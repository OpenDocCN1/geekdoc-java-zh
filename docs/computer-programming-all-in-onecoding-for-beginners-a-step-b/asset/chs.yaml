  \ \"))\n```\n\n## 第 4 章：硬件接口\n\n在本章中，你将学习 GPIO 和接口。理解这些基础知识对于定制电路的形成至关重要。树莓派有 40\
  \ 个引脚。以下是其中：\n\n| 引脚 | 功能 | 引脚 | 功能 |\n| :--- | :--- | :--- | :--- |\n| 1 | 3.3V\
  \ | 19 | GPIO 5 |\n| 2 | 5V | 20 | GPIO 6 |\n| 3 | GPIO 2 (SCL) | 21 | GPIO 9 |\n\
  | 4 | 5V | 22 | GPIO 25 |\n| 5 | GPIO 3 | 23 | GPIO 10 (SDA) |\n| 6 | GPIO 14 (TXD)\
  \ | 24 | GPIO 21 |\n| 7 | GPIO 17 | 25 | GPIO 11 |\n| 8 | Ground | 26 | GPIO 12\
  \ |\n| 9 | Ground | 27 | GPIO 8 (SCLK) |\n| 10 | 5V | 28 | Ground |\n| 11 | GPIO\
  \ 18 | 29 | GPIO 24 |\n| 12 | Ground | 30 | Ground |\n| 13 | GPIO 23 | 31 | GPIO\
  \ 6 |\n| 14 | Ground | 32 | GPIO 19 (SDA) |\n| 15 | 3.3V | 33 | GPIO 13 |\n| 16\
  \ | Ground | 34 | Ground |\n| 17 | GPIO 27 | 35 | GPIO 19 |\n| 18 | GPIO 24 | 36\
  \ | Ground |\n| 19 | 5V | 37 | GPIO 16 |\n| 20 | Ground | 38 | Ground |\n| | | 39\
  \ | GPIO 20 |\n| | | 40 | Ground |\n\n树莓派是一个强大的工具，通过学习如何与它交互，你可以创建各种奇的项目。\n\n\n\n\
  \n\n![Image00132.jpg](img/Image00132.jpeg)\n\n# 面包板\n\n面包板是你在制作电子原型时使用的基础。在树莓派上尝试之前，请先在面包板上进行尝试。确保买到优质的！\n\
  \n## 分立元件\n\n### 二极管\n\n二极管是一种半导体元件，它允许电流向一个方向流动，而不能向另一个方向。\n\n#### 发光二极管 (leds)\n\
  \n![Image00133.jpg](img/Image00133.jpeg)\n\nLED 的作用与二极管相似，只是当电流按正确的方向流动时它会发光。这些元件具有许多形状、尺寸和颜色。引脚的长度决定了哪一个引脚是正极（阴极），哪个是负极（阳极）。\n\
  \n### 电容\n\n![Image00134.jpg](img/Image00134.jpeg)\n\n电容器是一种可以存储电能的元件。当它的两个极板之间存在电压差时，它会存储能量。一旦电压差消失，它就会释放存储的能量。\n\
  \n### 三极管\n\n![Image00135.jpg](img/Image00135.jpeg)\n\n三极管是一种半导体元件，用于放大或开关电流或电信号。\n\
  \n### 光学耦合器\n\n这些是数字开关设备，允许将一个电路与另一个电路隔离。\n\n### 按钮和开关\n\n![Image00136.jpg](img/Image00136.jpeg)\n\
  \n这些是非常言而易懂的。这些是你与之交互以让电路执行操作的输入设备。它们的基本功能是开启或关闭电路。根据你的需求，它们有不同的形状和形式。\n\n## 通信协议\n\
  \n为了嵌入式系统和谐工作，它们之间需要通信。这就是数据在嵌入式系统之间传输的方式。设定了特定的标准以确保通信的持续性和连贯性，这些就是通信协议。\n\n存在许多通信协议，如果你先学习以下几个概念，将更好地理解它们之间的区别：\n\
  \n### 比特率 (Bit rate)\n\n比特率描述单位时间内发送的比特数。这通常以 bits/sec（比特/秒）描述。\n\n### 波特率 (Baud\
  \ rate)\n\n比特率描述的是单位时间内发送的符号数，而波特率描述的是单位时间内发送的符号数。每个符号可以是任意数量的比特。这取决于设计。如果符号只有 1\
  \ 个比特，那么波特率就等于比特率。\n\n### 并行通信 (Parallel communication)\n\n在并行通信中，多个比特同时发送。\n\n\
  ### 串行通信 (Serial communication)\n\n在串行通信中，比特逐个发送。\n\n### 同步串行通信 (Synchronous serial\
  \ communication)\n\n这描述了一种串行通信协议，数据以恒定的速率以稳定、连续流发送。这要求两个嵌入式系统的内部时钟以相同的速率同步，以便接收方以发送方使用的相同间隔接收信号。\n\
  \n### 异步串行通信 (Asynchronous serial communication)\n\n这种形式的串行通信不需要同步的内部时钟。数据流在传输前后分别包含起始和停止信号。当接收方接收到起始信号时，它会为数据流做准备。当它接收到停止信号时，它重置为之前的状态以接收新的数据流。\n\
  \n现在你已经学习了它们之间的基本概念，我们现在可以学习不同的通信协议。\n\n### i2c\n\ni2c 是集成电路（integrated circuit）的缩写。它是一种使用两根线的异步串行通信协议：一根用于数据\
  \ (`sda`)，另一根用于时钟 (`scl`)。它是一种多主多从的串行总线。它的大多数用途限于将低速外围电路连接到处理器和微控制器。由于其工作方式，i2c\
  \ 必须通过评估 `scl` 为高电平时 `sda` 上的数据是否变化来验证通过的数据。`sda` 上的数据应仅在 `scl` 为低电平时变化；否则数据无效。i2c\
  \ 支持宽电压范围。i2c 是半双的。i2c 可以支持高达 100kbps 的串行 8 位数据传输。这是 `scl` 的标准速度。i2c 还能支持更高的比特率：400\
  \ kbps（快速模式）和 3.4 mbps（高速模式）。i2c 主要用于短距离通信。\n\n![Image00137.jpg](img/Image00137.jpeg)\n\
  \n### uart\n\nuart 是通用异步收发器（universal asynchronous receiver）的缩写。在该协议中，一根线用于传输，另一根线用于接收。uart\
  \ 使用串行通信类型；因此，比特在单根线上传输。uart 支持通过 `rs232` 通信。uart 标准波特率包括 110、300、600、1200、4800\
  \ 和 9600。uart 在任何时刻只能支持两个设备之间的通信。因为它是点对点的通信协议。\n\n### spi\n\nspi 是串行外设接口（serial\
  \ peripheral interface）的缩写。它是一种用于短距离通信的串行通信接口协议。它可以与一个主设备和多个从设备工作。spi 是一种全双工类型的通信协议。spi\
  \ 协议对消息大小没有限制，使其非常灵活。\n\n## 使用 arduino 进行实时接口\n\n如果你不熟悉，arduino 是一个强大的微控制器。你可以将其与树莓派配合使用创建一些令人深刻的项目。显然，为了实现这些功能你需要一个\
  \ arduino。你需要大量的编程知识以及对接口的精通以利用这些功能，而解释这些内容会让这本书比实际需要的还要长，所以请务必对这个主题进行进一步的研究。不过，我会讨论几个关键点。你可以使用上述讨论的任何通信协议（i2c、uart\
  \ 和 spi）与 arduino 接口。你可以将 arduino 配置为 i2c 从设备，这意味着你可以将多个 arduino 连接到一个树莓派上。直接的 uart\
  \ 连接一次只能支持一个从设备。如果你需要 arduino 和 pi 之间进行快速、高级的交互，将 arduino 配置为 spi 从设备将是最佳选择。这是因为\
  \ arduino 的时钟速度只会限制 spi 连接。\n\n![Image00138.jpg](img/Image00138.jpeg)\n\n### 输入和输出\n\
  \n你可能已经了树莓派板顶部边缘的一排引脚。这些是 gpio 引脚。gpio 是通用输入输出（general purpose input/output）的缩写。通过软件，你可以指定这些引脚中的每一个是输入还是输出。你可以用它们做很多事情。这两个引脚是\
  \ 5v，另外两个是 3.3v。还有几个地引脚，你是无法配置它们的。其余的是通用 3.3v 引脚。\n\n## 第 5 章：下载操作系统\n\n在没有下载操作系统之前，你将无法运行树莓派。\n\
  \n\n\n\n\n你可以在 [www.raspberrypi.org](http://www.raspberrypi.org) 找到你需要的软件。\n\n#\
  \ Noobs\n\nNoobs 是一个非常适合树莓派初者的程序。noobs 一词代表着“开箱即用的软件”（new out of the box software）。如果你愿意，可以在任何销售树莓产品的零售商处购买预装了\
  \ noobs 的卡。或者，你可以去树莓派官网从那里下载它……\n\nNoobs 易于使用，它预装了 Raspbian 操作系统供你选择，也可以从互联网下载一个操作系统到你的电脑上。\n\
  \nNoobs lite 使用相同的安装程序，但不需要下载 Raspbian。其他所有内容都是一样的。\n\n### Raspbian\n\n这是由基金会创建的官方操作系统，可以使用\
  \ noobs 安装，你也可以独立安装。\n\n大多数 Raspbian 都会预装你需要的软件，这样你就可以进行比在 noobs 上更多的教育类编程。Raspbian\
  \ 还会随附安装几种不同的编程语言。\n\nRaspbian 操作系统的 zip 文件中包含一个像素镜像，你所有的功能都将归档在其中，但我们以前用来解压这些文件的旧工具将不再支持所有平台。\n\
  \n如果下载的 raspbian 文件损坏或无法正常打开，在尝试重新安装之前，尝试使用 `7zip` 或解压工具。\n\n## 第 6 章：项目\n\n###\
  \ Librelec 媒体中心\n\nLibrelec 是一个多媒体中心，可以将几乎任何电视变成智能电视。你可以用它下载应用、访问硬盘，并在电视上播放来自远程\
  \ PC 的电影文件。\n\n你还可以接收网络广播并将其流传输到你的音系统中。此外，如果你有账户，librelec 还有一个 spotify 应用。这是一个让树莓派在日常生活中变得实用的项目。\n\
  \n### Homebridge\n\n智能家居领域一个令人兴奋的项目是 homebridge 项目 (`homebridge.io`)。这个基于软件的项目实现起来相对容易。通过使用\
  \ homebridge，即使是非苹果认证的智能家居设备也可以与苹果的 homekit 使用，且无需任何额外应用即可控制。\n\n整个过程可以通过树莓派非常轻松地实现。它的实用之处在于软件相对易于安装和控制。这意味着你只需要添加不同制造商的插件，然后就可以通过苹果的\
  \ homekit 直接控制它们。\n\n下面的图片显示了两个可以直接开关的虚拟灯泡。稍后你可以通过简单的二维码在 homekit 中轻松添加此类设备。只需用照片应用扫描代码，你就可以从\
  \ iPhone、iPad 甚至你的 Mac 控制该设备。\n\n![Image00139.jpg](img/Image00139.jpeg)\n\n而且整个过程安装非常简单。这将在本手册稍后部分讨论。\n\
  \n### Magicmirror\n\n智能家居领域的另一个有趣项目是 magicmirror 项目 (`magicmirror.builders`)。该软件相对易于安装。你可以用它在镜子上设置一个显示器，并将其挂在家里或公寓里。在镜子里，你可以显示各种信息，如时间和天气。镜子还可以连接到其他智能家居设备。因此，这个项目是一个非常棒的，通过稍微调整就能轻松实现。\n\
  \n### Pi-hole 广告拦截器\n\n我们在书中看到的另一个实用项目是 pi-hole 项目 (`pi-hole.net`)。pi-hole 是一个网络级广告过滤器，可以安装在树莓派上。\n\
  \n如果你将路由器的互联网设置重定向到 pi-hole，所有的网络流量将通过树莓派进行过滤。从现在起，pi-hole 服务器将确保例如每个设备上的大部分广告被过滤掉。我们将在书的后面详细查看它的工作原理。\n\
  \n### Retropi 游戏机\n\n这是一个特殊的操作系统，可以在树莓派上模拟并运行旧游戏。这个项目是一个利用闲时间重温经典的好机会。\n\n## 第 7\
  \ 章：带有 Python 和 Linux 的树莓派\n\n### 带有 Linux 的树莓派\n\n涉及到启动时间至关重要。例如，当你的目标是在按下按钮后五秒内启动你喜欢的节目时。那么，如何开发一个启动速度快且不像其他类型的程序呢？\n\
  \n如果你想启用树莓派的启动，必须访问 SD 卡并向其加载某些文件。你可以通过 GPIO 引脚直接访问硬件。这意味着你的树莓派可以作为一个操作系统运行。\n\n\
  所谓的开发系统究竟是什么？它们通常是为特定目的创建的。例如，在操作系统发明之前，并不是所有系统都是可用的。现在，开发系统对于特殊应用仍然可用。\n\n此外，由于其优势，开发编程对于你的空闲时间来说是理想的。想想你自己的电脑，按下电源键后启动需要多长时间？\n\
  \n大部分的启动时间受你所用操作系统复杂性的影响。此外，当你使用操作系统环境时，它会花费大量工作来运行若干个后台进程。\n\n通过开发系统，你可以从性能限制中解脱出来。你去掉了操作系统并直接从硬盘运行程序。这让设备能够利用硬件性能在短时间内完成启动。\n\
  \n这可能看起来非常有吸引力。你甚至会奇怪为什么不是所有程序都以此方式运行。便利性是一个关键因素。也应该考虑系统的需求。这就是为什么在微软和苹果进入市场之前，很多电脑并没有出名。\n\
  \n图形界面的开发使用户能够相对轻松地使用计算机。操作系统虽然消耗性能且加载缓慢，但它是有用且方便的。事实上，许多人（包括开发者们）都对其优势感到惊讶。\n\n\
  \n\n\n此外，使用操作系统的计算机通常是多用途设备。许多人必须进行电子表格、文字处理、数学计算和网页浏览等活动。他们需要一种能够让他们仅用一台机器完成所有这些任务。\n\
  \n这种多样性需要一个更复杂的系统，利用各种硬件来实现各种用途。另一方面，嵌入式系统倾向于专注于处理单一设备，其功能范围较窄。\n\n# 如何编写嵌入式系统\n\
  \n相反，你必须使用计算机能够理解的东西。你需要使用一种对它们来说听起来母语的语言进行通信。\n\n你需要将你的汇编编译到 `raspberry pi` 会读取的内核中，而不是常用的\
  \ `raspbian` 内核。为了实现这一点，你必须从 `raspberry pi` 的 `sd card` 中删除所有数据。你需要一个来加载内核。请务必始终保留数据的备份。\n\
  \n内核通常充当软件与硬件之间的桥梁。`raspbian` 内核让用户更容易从显示器或键盘获取数据并对其进行处理。\n\n然而，在嵌入式系统中，你不需要与大多数硬件进行通信。也不需要图形用户界面（gui）。你可以在不使用它的情况下操作。\n\
  \n嵌入式设计通常是针对特定目的进行编程的。例如，你可能想让几个 led 闪烁。因此，你需要一个对启动时间敏感的系统，因为你必须移除任何为了让 led 闪烁不需要的内容。\n\
  \n### Linux 使用\n\n### 命令\n它们指的是在 linux 中使用的高级和基础命令。\n\n### 文本编辑器\n这些指的是一组用于 `raspberry\
  \ pi` 的文本编辑器。\n\n### Root（根）\n前缀 `sudo` 和用户 `root`。\n\n### 用户\n允许在 `raspberry pi`\
  \ 系统上设置多个用户。\n\n### 脚本\n它指的是组合命令来执行复杂的操作。\n\n### Crontab/cron\n它设置了预定的任务。\n\n###\
  \ .bash 和 .bashrc 别名\n它们是你的别名和 shell 配置。\n\n### Rc.local\n指的是初始化配置。\n\n# 给初学者的额外帮助\n\
  \n以下是 Linux 一些基本用法的解释，以及在 `raspberry pi` 上进行操作的命令。\n\n## Linux 文件系统\n这是存放文件、安装软件以及看到危险区域的地方。它包含了\
  \ home、整个文件系统和备份。\n\n#### Home\n这是存放文件的地方。它是主目录。\n\n#### 整个文件系统\n它指的是 Linux 文件系统的其余部分。\n\
  \n#### 备份\n它备份文件以及操作系统镜像。\n\n## Raspberry pi 和 Python\nPython 语言呈现出一种高级语法；我们之所以说这样是因为它的编写形式非常接近人类语言。此外，Python\
  \ 支持面向对象。\n\n从根本上说，Python 要求精确地编写代码。尽管如此，它还提供了一个友好的界面，应用程序本身会引导你编写代码（在代码中标记错误并提供实用的建议）。\n\
  \n这个专门为 Python 设计的集成开发环境有两种模式：普通模式和简单模式（模式）。简单模式让事情对初学者变得简单，在这份指南中，我们将参考这种的简单模式。这是你在应用程序简单模式下看到的工具栏。在工具栏上每个友好的图标下方，你会看到它们的用途。这是应用程序的脚本。其目的与\
  \ scratch 应用程序完全相似。我们在其中编写代码，左侧指示了行号。随着你不断编写代码，它会自动进行索引。在你的代码遇到错误的情况下，你将知道错误指的是哪一行代码，因为每一行都经过了索引，你可以快速导航到错误的代码行并修复它。这种索引可以非常有用且节省时间。这是\
  \ shell。它提供了关于应用程序当前运行代码的信息，你可以输入单行代码并按回车键执行它们。这是变量。它显示了你为特定程序创建的所有变量的信息（名称和值）。\n\
  \n# 使用 Python 编程：制作程序\n启动 Python 后，你注意到的第一点是，与 scratch 不同，这里没有彩色的块。这是因为 Python 更多像是一种传统的语言，依赖于手动编写代码（当然，不能有写写错误或故障！）。\n\
  \n从 raspberry pi 菜单打开 Python 并等待 thny ide 加载（thonny 将默认以简单模式启动）。转到 python shell\
  \ 并输入\n\n```python\nPrint(\"good morning!\")\n```\n\n在输入以下指令后，你只需要按回车键，你就会在指令下方看到显示出的“good\
  \ morning”消息。我们刚刚创建了第一个程序。它就是这么简单！\n\n一旦你击回回车，代码就会执行。另一方面，当你写完一行代码后按回车键而不是执行该行代码时，你只是得到了一个新的空白行来编写更多代码。要执行脚本中的代码，你需要点击工具栏上的\
  \ `run` 图标来执行（当你点击运行按钮时，thonny 会提示你先保存当前程序，只需为程序命名并点击保存）。注意，当你从脚本运行已保存的程序时，这次 shell\
  \ 中的消息有点不同\n\n```python\n>>> %run 'name you used to save the program.py.'\nGood\
  \ morning!\n```\n\n你也可以在脚本中编写相同的代码，但这次我们将使用一个不同的、更流行的短语，“hello world!”，并在保存时将其命名为\
  \ `hello world!`。\n\n（这是你在 shell 中看到的消息）\n\n```python\n>>> %run 'hello world.py'\n\
  Hello, world!\n```\n\n第一行指示器执行刚刚保存的程序，第二行是运行该程序的结果或输出，在我们的案例中显示了一条消息。我们成功地在 Python\
  \ 中编写了第一个程序并在交互和脚本模式下运行了它。\n\n# 使用循环和代码，缩进\n缩进基本上是 Python 控制代码执行顺序的方式。在 scratch\
  \ 编程中，我们会使用彩色的块并按照我们想要的顺序将它们堆在一起，但在 Python 中，我们需要使用缩进来告诉计算机这些代码的运行顺序。\n\n点击工具栏上的\
  \ `new` 图标打开新项目。这会为你打开一个独立的新窗口进行工作。在脚本中输入以下代码行，;\n\n```python\nPrint(\"loop starting!\"\
  )\n\nFor i in range (10):\n```\n\n\n\n在上面的代码行中，第一行的工作原理与 `print(\"good morning\"\
  )` 示例所示的完全相同。然而，第二行非常有趣。这一行启动了一个确定性循环序列，定义的限制由 `range` 后面跟随的整数设置。`i` 是循环计数器，它将计算程序循环的次数；在这种情况下，它将一直向上计数到\
  \ 9，因为停止指令是数字 10；一旦完成第 9 次循环，循环就会退出。此外，注意行末尾的冒号 `:`。它告诉计算机，接下来的几行代码实际上是循环的一部分。\n\
  \n此外，在 scratch 中，我们看到要添加到循环函数中的指令可以直接放置在循环块上。但在 python 中，我们通过冒号（`:`）对指令代码进行缩进。缩进的特征是在新行开头左留四个空格；当你在缩进缩进后按下回车键时，ide\
  \ 应用程序会自动完成这一操作。\n\n```python\nPrint(\"loop starting!\")\nFor i in range (10):\n\
  \    Print(\"loop number\", i)\n```\n\n正是这种缩进让 python 能够区分不包含在循环中的指令和要包含在循环中的指令（这种缩进代码被称为嵌套）。\n\
  \n此缩进之后的所有行都将自动包含四个空格，因为它假设接下来的代码也将也是循环的一部分。这将一直持续，直到你写完所有属于循环的指令。若要结束缩进，只需创建一个新的缩进空行并按退格键，这会将该行恢复为正常状态。现在，按照描述结束缩进并编写以下代码行：\n\
  \n```python\nPrint(\"loop finished!\")\n```\n\n代码行的顺序应该如下：\n\n```python\nPrint(\"\
  loop starting!\")\nFor i in range (10):\n    Print(\"loop number\", i)\nPrint(\"\
  loop finished!\")\n```\n\n在这个程序中，第一行和最后一行都在循环之外，因为它们没有缩进。第二行是循环开始的地方，并且包含了缩进，这使得第三行成为了了循环的一部分。\n\
  \n让我们将此程序保存为“indentation”并运行它。在 shell 区域，我们将看到以下输出：\n\n```text\nLoop starting!\n\
  Loop number 0\nLoop number 1\nLoop number 2\nLoop number 3\nLoop number 4\nLoop\
  \ number 5\nLoop number 6\nLoop number 7\nLoop number 8\nLoop number 9\nLoop finished!\n\
  ```\n\npython 从零开始计数而不是从一开始的原因是，python 被设计为一种零索引语言。这意味着它将 0 视为起始整数而不是 1。你可以通过指定\
  \ `range` 指令为 `range(1, 11)` 而不是 `range(10)` 来改变这种行为。通过这样，循环将从 1 开始计数到 10。你可以对任何你数字这样做。\n\
  \n就像我们在 scratch 中使用确定性循环和无限循环一样，在 python 中也可以这样做。要使用无限循环（永远运行的循环），你只需要编辑上面程序的第 2\
  \ 行代码。\n\n```python\nPrint(\"loop starting!\")\nWhile true:\n    Print(\"loop running!\"\
  )\nPrint(\"loop finished!\")\n```\n\n你现在创建了一个无限循环。这是因为循环的结束条件没有指定；每当打印“loop running!”消息时，程序都会将代码导回开头，整个过程不断重复，直到程序终止。要终止程序，只需点击“stop”图标。程序将终止，而永远无法到达最后一行代码。\n\
  \n使用条件和变量\n\n点击“new”图标打开一个新项目，并在脚本中输入以下代码行：\n\n```python\nusername = input(\"what\
  \ is your name?\")\n```\n\n保存程序并运行它。该程序的输出是显示一条询问你名字的消息。在消息结束后，点击空隙处，输入一个名字并按回车。程序中不会发生任何事情，但如果你将注意力转移到右侧的变量窗口，你将看到\
  \ `username` 被赋值了你刚刚输入的值。\n\n为了演示如何在 python 中使用变量，我们将 `username` 变量与一个条件配对。在这次演示中，程序将询问我们的名字，并根据我们的答案给出特定的答复：\n\
  \n```python\nIf username == \"clark kent\":\n    Print(\"you are superman!\")\n\
  Else:\n    Print(\"you are not superman!\")\n```\n\n现在保存并运行程序，注意输出。在第一种情况下，当程序询问我们的名字时，它会将它与变量值“clark\
  \ kent”进行比较以查看是否匹配。如果我们的名字与变量中的名字匹配，则该条件为真（true）；如果不匹配，则该条件为假（false）。根据结果的真或假，条件指示程序执行以下代码行之一。\n\
  \n![Image0140.jpg](img/Image0140.jpeg)\n\n此外，注意我们没有使用单个等号 `=`，而是使用了双等号 `==`。这是因为单等号是给变量赋值，或者简单来说是让此值等于该变量；而双等号符号则是进行直接比较。一个是赋值运算符，而另一个是比较运算符。\n\
  \n此外，引号中的文本被称为字符串（string）。带有或不带引号的数字被称为整数（integer）。当你组合两个不同类型的信息时，例如将文本“how old\
  \ are you?”与回复 22 组合，你必须将整数转换为字符串才能进行组合。\n\n在处理数字时，你还可以使用大于 `>` 和小于 `<` 比较运算符。但要使用等号运算符，你必须使用\
  \ `==`。同样，大于等于 `>=` 和小于等于 `<=` 也可以使用。我们现在将在之前使用的循环示例中使用一些比较运算符：\n\n```python\nWhile\
  \ username != \"clark kent\":\n    Print(\"you are not superman – try again!\")\n\
  \    username = input(\"what is your name,\")\nPrint(\"you are superman!\")\n```\n\
  \n在运行此程序后，你会发现当你告诉你不是超人后，程序并没有退出，而是会一直询问你的名字，直到确认你确实是超人。\n\n## 第 8 章：树莓派型号\n\n###\
  \ Model a/b\n\n第一代树莓派型号被称为 model a 和 model b（如上图所示）。这两种型号内部都集成了博通 bcm2835 soc，但规格不同：例如，model\
  \ a 具有 256 mb 内存、一个 USB 端口且没有任何网络功能；而 model b 根据购买日期，具有 256 mb 或 512 mb 内存、一个 10/100\
  \ 有线网络端口和两个 USB 端口。\n\n\n\n这些型号之所以易于区分，是因为它们的 GPIO 端口比通常的要，只有 26 个引脚，而较大、更先进的型号有\
  \ 40 个引脚。这两个型号都拥有全尺寸 SD 卡存储空间，而不是较新型号标配的紧凑 microSD 卡。尽管它们已不再生产，但 `model a` 和 `model\
  \ b` 仍然兼容大多数为新机型设计的软件，只是它们不使用基于 hat 标准的扩展硬件。\n\n### Model a+/b+\n\n原始型号被证明非常受欢迎，但很快被一种名为\
  \ plus 的新板子设计所取代。这些后来的迭代版本带有 40 引脚 GPIO 插针，同时改进了其他一些功能。然而，它们并没有偏离 `bcm 2835 soc`，这意味着\
  \ plus 型号与旧型号之间的性能没有太大区别。\n\n`model a+` 和 `model b+` 之间的硬件差异与之前的 `model a` 和 `model\
  \ b` 相似：`a+` 型的占用空间比 `a` 型小，根据产品发布时的零网络能力，它具有 256 mb 或 512 mb 的内存，并且只有一个 usb 端口；`model\
  \ b+` 则具有 512 mb 内存、一个 10/100 有线网络端口和四个 usb 端口。\n\n`A+` 和 `b+` 与本指南中提到的每种软件和设备都非常兼容，并且与如今较新的型号具有相同的\
  \ gpio 布局。如果你拥有其中任何一个型号，升级的唯一理由是为了获得额外的内存、享受内置的无线功能或提高性能。\n\n### Raspberry pi 2\n\
  \n虽然 plus 以及之前的其他板子使用相同的 `bcm 2835 soc processor`，但新的 raspberry pi 2 使用了新的 `bcm\
  \ 2836 soc processor`。与原始版本的单核不同，新处理器具有四个以上的内核，性能是原始型号的 4 到 8 倍——这使得从文字处理到编译代码的每一个过程都变得快得多。这个新版本还包含超过\
  \ 1gb (1024 mb) 的内存，是前一个的两倍，这使得内存密集型应用程序和多任务处理运行更加流畅，响应也更快。\n\n在布局方面，与 `model b`\
  \ 相比没有太大变化。例如，raspberry pi 2 具有相同的四个 usb 端口、40 引脚 gpio 插针、10/100 有线网络端口以及其他端口。如果你确实有一个与\
  \ `model b` 兼容的扩展设备或外壳，它在 raspberry pi 2 上也能运行良好——只是速度更快。\n\n新板子比之前的版本具有更大的软件兼容性：即使是专有的操作系统\
  \ `raspbian` 也可以运行如 windows 10 iot core 和 ubuntu 等操作系统，而这些在之前的代代中是不提供的。\n\n### Raspberry\
  \ pi 3\n\n在第四代迭代之前的最后一个型号 raspberry pi 3，在发布时配备了全新的处理器：broadcom `bcm 2837`。由于是 64\
  \ 位处理器而非 32 位，新处理器的速度比 raspberry pi 2 中的 `bcm 2836` 快得多，而后者在当时对于原始和系列中的 `bcm 2835`\
  \ 来说是一次巨大的升级。raspberry pi 3 还是第一个内置无线支持的型号，包括一个连接到 2.4 ghz wi-网络和蓝牙设备的无线电器。\n\n\
  像 pi 2 一样，布局没有太大变化：你将获得与最后几个型号相同的四个 usb 端口、40 引脚 gpio 插针、10/100 有线网络端口以及其他端口。唯一的细微变化在于板子与特定扩展设备交互的方式，所以如果你不确定某个设备是否兼容\
  \ pi 3，你应该在购买前联系供应商，以确保软件已考虑在内。\n\n新 pi 3 的一个大优势除了内置功能和当然还有改进的性能外，是它的 64 位处理器。切换到这个型号意味着你将比之前型号的\
  \ 32 位具有更好的软件兼容性和安全性。\n\nraspberry zero 到目前不仅是整个树莓派家族中最小的板子，也是最便宜的。尽管尺寸只有几块叠在一起的口香糖大小，但\
  \ raspberry zero 几乎并不缺少其他型号具备的特性：它具有相同的 `bcm 2835 soc` 以及与 raspberry model b+ 一样的\
  \ 512 mb 内存，并且运行速度略快以获得更好的性能。\n\n然而，pi zero 在时需要某些限制。例如，mini-hdmi 端口和单个 micro-usb\
  \ 端口在连接到标准外围设备之前需要适配器；没有 dsi 端口；3.5 mm av 接口消失了，需要适配器；虽然有 gpio 插针，但引脚需要额外购买并焊接到位置才能使用。\n\
  \n如果你是初学者，我们不推荐 pi zero。但如果你是经验丰富的用户并希望为嵌入式项目带来更多智能——特别是当你在成本、功耗和尺寸上遇到麻烦时——pi zero\
  \ 就是你需要的那个板子。\n\nraspberry pi 4 model b\n\n现在，我们将研究最新的 raspberry pi 4 model b，看看它是由什么制成的以及你如何让它工作。尽管这块小板子上似乎有很多东西，但我们向你保证树莓派板子非常容易理解——尤其是它的组件。\n\
  \n\n\n有一个由黑色塑料封装芯片表示的 USB 控制器，它位于板底边缘，紧邻中间一组 USB 端口后方。该组件负责运行所有的四个 USB 端口。还有一个更小的网络控制器芯片，处理电路板的以太网网络端口。最后，是一个最小的黑色芯片，位于板左上角的\
  \ USB Type-C 电源接口稍上方的位置，这被称为电源管理集成电路（`pmic`）。该芯片负责将 micro USB 端口的电转换为树莓派运行所需的电。\n\
  \n## 结语\n\n感谢阅读本书。下一步就是利用你在书中所学到的知识，开始使用树莓派进行编程了。你将能够创建许多项目，让你的生活变得更加舒适便利。\n\n树莓派确实是一项技术奇迹，这台微型机器所能做到的一切将始终让你感到惊讶。这个“小怪兽”不仅在性能和能力方面表现出色，而且树莓派在对各种可能应用的适应性方面也是独一无帜的。\n\
  \n正如树莓派的实用性没有限制，也没有定义的边界，我们在本入门级书籍中能学的知识是有限的。关于树莓派及其功能，以及我们如何充分利用它的能力，仍有整座岛屿般的知识等待探索。然而，本书已经涵盖了所有核心概念的基础形式，使读者在想要将树莓派作为口袋电脑或项目组件使用时，能够应对遇到的任何问题。\n\
  \n在处理任何万事时请保持谦虚。不要害怕承认自己错了，或者承认自己并没有你预想的那么能力，并在社区中寻求帮助。树莓派绝对是目前最酷的技术产品之一，它可以做很多事情。尽管如此，它对程序员来说也可能是令令人沮丧的，因为它的能力完全取决于程序员让它做到什么程度。\n\
  \n树莓派确实是一个奇妙的设备。它小巧手手，你可以随身携带。它价格低廉且易于获得，你可以轻松在不超出预算的情况下购买几十个。对于你的项目来说，树莓派设备越多越好。\n\
  \n如果你想精进技能、释放创造力并创造出有用且独特的东西，你就应该继续努力和实践。记住，你还可以从其他树莓派用户那里获得提示和建议，并分享你的想法。你甚至可以从在线社区建立友谊。\n\
  \n树莓派的廉价和普及可以帮助你同时进行多个项目。如果你犯了错，可以重新尝试。你甚至可以对作品申请专利并出售。从简单的设备开始，你可以开发出让全世界受益的工具。机会是无限的，在树莓派的帮助下，你可以实现你的梦想。\n\
  \n与其看电视、刷社交媒体或无目的地上网来消磨时间，不如变得高效起来，使用树莓派实验项目。\n\n树莓派确实是当今最伟发明之一。凭借如此微小的设备，可以成就伟业。\n\
  \n顶尖程序员不会在途中放弃。加油实践吧，将你在书中学到的所有想法概念化。记住，学习（包括树莓派在内）的准则是：实践；毫无疑问：熟能生巧。\n\n祝你好运！\n"
