  ## 第 8 章：类 (classes)\n\n### Python 类和对象\n\nPython 是一种面向对象的编程语言。这意味着 Python 程序员可以利用类等面向对象的特性。\n\
  \n类可以定义为数据和操作这些数据的方法的组合。这意味着类具有数据和方法，对方法的访问是通过使用点符号完成的。\n\n### 类定义\n\n在 Python 中定义类，我们使用\
  \ `class` 关键字。后面应该跟着一个冒号。\n\n```python\n testclass():\n```\n\n一旦定义了类，你就可以在里面创建方法和函数。这些有助于数据操作。\n\
  \n```python\n#!/usr/bin/python3\n\nclass pythonmaths:\n    def add(ax,bx):\n   \
  \     addition = ax + bx\n        print(addition)\n\n    def subtract(ax,bx):\n\
  \        subt = ax - bx\n        print(subt)\n\n    def multiply(ax,bx):\n     \
  \   multiplication = ax * bx\n        print(multiplication)\n\n    def division(ax,bx):\n\
  \        div = ax / bx\n        print(div)\n```\n\n我们定义了一个类名 `pythonmaths`。类可以有一些方法。要访问类的任何方法，你必须使用类名、点\
  \ `.` 和方法名。\n\n要访问上述 `pythonmaths` 类中的 `add` 方法，在 Python 终端输入以下内容：\n\n```python\n\
  Pythonmaths.add(2,3)\n```\n\n注意类名在前，后面是方法名，然后是括号内的参数。函数期望两个参数值，即参数 `ax` 和 `bx` 的值。如果你传递了两个两个参数的值甚至一个参数的值，将返回错误。\n\
  \n注意类中的所有内容都缩进了。这应该是总是这样的。如果没有，将会生成错误消息。\n\n\n\n\n类的方法（class methods）也可以从类内部被调用。这意味着我们需要创建一个类的实例，并用于访问这些类方法。示例：\n\
  \n```python\n#!/usr/bin/python3\n\nclass class2():\n\n    def firstmethod(self):\n\
  \        print(\"the first method\")\n\n    def secondmethod(self, astring):\n \
  \       print(\"second method, string alongside:\" + astring)\n\n    def main():\n\
  \        # 实例化类并调用方法\n        C = class2 ()\n        C.firstmethod()\n        C.secondmethod(\"\
  \ we are now testing\")\n\nif __name__== \"__main__\":\n    main()\n```\n\n代码执行时会打印以下内容：\n\
  \n![Image00022.jpg](img/Image00022.jpeg)\n\n`self` 参数通常指的是对象本身。这就是为什么我们使用 `self`\
  \ 这个词，它是 Python 中的一个关键字。当在方法内部使用时，`self` 指向被操作的对象的特定实例。每当你在 Python 中看到 `self` 关键字时，就知道它指的是实例方法的第一个参数。它被用于访问成员对象。然而，你会注意到在调用我们代码中的两个方法\
  \ `firstmethod()` 和 `secondmethod()` 时，我们从未指定过 `self` 关键字，因为 Python 会替我们完成这一点。在调用实例方法后，Python\
  \ 知道如何自动传递 `self` 参数，无论它是否被提供。这意味着你可以选择提供或不提供。我们创建了 `class2` 类的实例，并命名为 `C`。这是通过以下行完成的：\n\
  \n```python\nC = class2 ()\n```\n\n`C` 是 `class2` 类的一个对象。这意味着我们可以使用该对象来访问类的所有的方法和属性。你只需要关注非\
  \ `self` 参数（non-self-arguments）即可。注意 `secondmethod` 中是如何将字符串追加到初始文本的。\n\n### 内置属性\n\
  \n某些内置属性被所有类保留，为了访问它们，我们使用与其他属性类似的点运算符（.）。这些包括：\n\n- `__dict__`: 这是一个包含类命名空间的字典。\n\
  - `__doc__`: 类的文档字符串，如果未定义则为 `None`。\n- `__name__`: 类的名称。\n- `__module__`: 定义类所在的模块名称。在交互模式下，该属性变为\
  \ `__main__`。\n- `__bases__`: 这是一个元组（tuple），可能为空，按照类在类中出现的顺序包含了父类。示例：\n\n```python\n\
  #!/usr/bin/python3\n\nclass worker:\n    '所有实例通用的基类'\n    count = 0\n    def __init__(self,\
  \ name, age):\n        self.name = name\n        self.age = age\n        worker.count\
  \ += 1\n    def showcount(self):\n        print(\"total workers %d\" % worker.count)\n\
  \    def showworker(self):\n        print(\"name : \", self.name, \", age: \", self.age,)\n\
  \nworker1 = worker(\"gish\", 26)\nworker2 = worker(\"ether\", 24)\nprint(worker1.__doc__,\
  \ worker2.__doc__)\nprint(worker1.__name__, worker2.__name__)\nprint(worker1.__module__,\
  \ worker2.__module__)\nprint(worker1.__bases__, worker2.__bases__)\nprint(worker1.__dict__,\
  \ worker2.__dict__)\n```\n\n代码打印以下内容：\n\n![Image0023.jpg](img/Image0023.jpeg)\n\n\
  ### 垃圾收集\n\n有时内存可能会被不再定义的对象占用。Python 会自动从内存中清理，这一过程被称为垃圾收集（garbage collection）。通过这种方式\
  \ Python 可以回收不再使用的内存块。垃圾回收器在程序执行时启动，并在一个对象的引用计数（reference count）达到零时运行。对象的引用计数会随着指向它的别名数量的变化而变化。当分配一个新名称或将其添加到元组（tuple）、列表（list）或字典等容器时，对象的引用计数会增加。一旦使用\
  \ `del` 语句删除对象，计数值将减少，或者当其引用超出作用域，或者当引用被重新赋值时。示例：\n\n```python\nAx = 5 # 创建对象\n\
  Bx = ax # 增加 <5> 的引用计数\nBz = [bx] # 增加 <5> 的引用计数\ndel ax # 减少 <5> 的引用计数\nBx = 70\
  \ # 减少 <5> 的引用计数\nBz[0] = -1 # 减少 <5> 的引用计数\n```\n\n人们无法察觉垃圾回收器何时销毁了一个孤立的实例。然而在\
  \ Python 中，类可以实现一个名为 `__del__()` 的析构方法，它会在特定对象即将被销毁时被调用。任何未被实例使用的非内存资源都可以通过此方法进行清理。`__del__()`\
  \ 析构方法通常显示即将销毁的实例的类名。示例：\n\n```python\n#!/usr/bin/python3\n\nclass region:\n   \
  \ def __init__(self, ax=0, bx=0):\n        self.ax = ax\n        self.bx = bx\n\
  \    def __del__(self):\n        class_name = self.__class__.__name__\n        print(class_name,\
  \ \"already destroyed\")\n\nrg1 = region()\nrg2 = rg1\nrg3 = rg1\nprint(id(rg1),\
  \ id(rg2), id(rg3)); # 打印 id\ndel rg1\ndel rg2\ndel rg3\n```\n\n代码打印：\n\n![Image0024.jpg](img/Image0024.jpeg)\n\
  \n### 继承\n\n允许你在不同的文件中创建类。你可以使用 `import` 语句将它们导入到主程序中。假设上面的代码创建在 `region.py` 文件中并带有属性，我们可以这样做：\n\
  \n```python\n#!/usr/bin/python3\n\nimport region\n\nrg1=region.region()\n```\n\n\
  继承让你不需要从头创建类，而是可以从父类继承。由于父类拥有某些属性，子类允许使用它们。子类还可以覆盖（override）父类的方法。继承采用以下语法：示例：\n\
  \n```python\n#!/usr/bin/python3\n\n### 关于类操作示例\n\nclass parentclass():\n    def\
  \ firstmethod(self):\n        print(\"the first method in parentclass\")\n    def\
  \ secondmethod(self, astring):\n        print(\"we are testing\" + astring)\n\n\
  class childclass(parentclass):\n    # 覆盖 firstmethod\n    def firstmethod(self):\n\
  \        parentclass.firstmethod(self)\n    def secondmethod(self):\n        print(\"\
  childclass secondmethod\")\n\ndef main():\n        # 测试类方法\n        C = childclass()\n\
  \        C.firstmethod()\n        C.secondmethod()\n\nif __name__== \"__main__\"\
  :\n    main()\n```\n\n代码打印：\n\n![Image00025.jpg](img/Image00025.jpeg)\n\n在 `childclass`\
  \ 中我们没有定义 `firstmethod`，但我们从父类获取了它。这就是 Python 中工作的方式。子类从父类继承了一个方法。另一个示例：\n\n```python\n\
  #!/usr/bin/python3\n\n### 关于工作类的示例\n\nclass worker:\n    '所有工人通用的基类'\n    count\
  \ = 0\n    def __init__(self, name, age):\n        self.name = name\n        self.age\
  \ = age\n        worker.count += 1\n    def showcount(self):\n        print(\"total\
  \ workers %d\" % worker.count)\n    def showworker(self):\n        print(\"name\
  \ : \", self.name, \", age: \", self.age)\n\nworker1 = worker(\"bosco\", 2500)\n\
  worker2 = worker(\"june\", 3000)\nworker1.showworker()\nworker2.showworker()\n```\n\
  \n\n\n\n```python\nPrint (“total workers %d” % worker.work, worker.count)\n```\n\
  \n上述代码清晰地演示了如何创建一个类的实例，并使用它来访问父类的成员或方法。执行后，它将得到以下结果：\n\n![Image00026.jpg](img/Image00026.jpeg)\n\
  \n我们创建了 `worker` 类的两个实例，即 `worker1` 和 `worker2`。这些实例每一个都是 `worker`，第一个是 `bosco`，第二个是\
  \ `june`。我们使用这些实例来访问类中定义的 `showworker` 方法。该方法返回 `worker` 的名称和工资。\n\n### 多重继承\n\n\
  在 python 中，一个可以同时继承多个类。这在 `java` 和 `c#` 等其他语言中是不行的。python 的多重继承采用以下语法：\n\n```python\n\
  Class childclass(parentclass1, parentclass2, …):\n    # 初始化函数\n    # 方法\n```\n\n\
  ### python 多重继承示例：\n\n```python\n#!usr/bin/python3\n\nClass parentclass1():\n  \
  \  Def supermethod1(self):\n        Print(“calling supermethod1”)\n\nClass parentclass2():\n\
  \    Def supermethod2(self):\n        Print(“calling supermethod2”)\n\nClass childclass(parentclass1,\
  \ parentclass2):\n    Def childmethod(self):\n        Print(“the child method”)\n\
  \nCh = childclass()\nCh.supermethod1()\nCh.supermethod2()\n```\n\n代码将打印：\n\n![Image00027.jpg](img/Image00027.jpeg)\n\
  \n我们定义了两个方法，一个在第一个父类中，另一个在第二个父类中。子类继承了这两个类。它访问了在这两个类中定义的方法。这就是我们如何在 python 中继承多个类的方法。\n\
  \n### Python 构造函数\n\n构造函数是指一种类函数，用于实例化对象并赋予某些预定义的值。它应该以双下划线（`__`）开头。它是 `__init__()`\
