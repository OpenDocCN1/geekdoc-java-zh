  \ world”程序。\n\n虽然“hello world”代码听起来像是个陈词滥调，但在我们创建的过程中，它是“脊梁代码”的最佳说明，在我教完你之后，你以后创建的每一个程序几乎都会用到这种代码。无论你的程序或代码复杂还是简单，它都必须包含几行基础代码。\n\
