  \n\n\n面向对象编程中的另一个重要组件是 `interface`（接口）。接口代表了某些功能的多个声明。一个类可以实现一个或多个接口，但它只能继承一个类或抽象类。这揭示了\
  \ C# 编程语言的另一个特性——它不支持多继承。实现某些接口的类必须提供所有接口成员的完整定义。\n\n在接口的使用中，不涉及访问修饰符的操作，因为所有接口成员都被认为是\
  \ `public`（公共的）。因为接口的存在完全在于其供其他类实现的功能。如果某个类必须实现接口成员，就意味着这些接口成员必须是 `public` 的，以便被其他类实现。\n\
  \n接口是一个面向对象的组件，它包含声明，但不能有定义（实现）。如果你尝试在接口中插入某些实现，将会出现编译时错误。接口可以包含属性和方法——即任何可以实现的内容。它不能包含字段和构造函数，因为它不是类，而且无法被实例化。在实现接口时，类必须实现所有的接口成员。如前所述，C#\
  \ 不支持多继承，但可以通过接口的使用来实现多继承，因为一个类可以实现多个接口。\n\n示例：\n\n![Image00113.jpg](img/Image00113.jpeg)\n\
  \n这里，我们定义了一个接口。它内部有三个布尔属性。实现此接口的类必须拥有所有这些成员的定义。\n\n![Image00114.jpg](img/Image00114.jpeg)\n\
  \n程序包含一个类，即 `person` 类。该类实现了已声明的 `iperson` 接口。该类有两个私有字符串字段，分别为 `_firstname` 和 `_lastname`。它还有一个构造函数，在其中为这些字段赋值。此外，该类包含了\
  \ `iperson` 接口的三个成员的定义——`isRunning`、`isStanding` 和 `isTouching` 属性。编译器接受这一点，因为没有错误。但是，如果我们从\
  \ `person` 类中删除这三个属性中的任何一个，编译器就会报告错误。例如：\n\n![Image00115.jpg](img/Image00115.jpeg)\n\
  \n在这里，我们注释掉了 `person` 类内部的 `isRunning` 属性。编译器报告错误，指出 `person` 类没有实现该属性，程序无法构建。之后，我们将取消该属性的注释，恢复到程序的有效状态。让我们创建一个内部带有\
  \ `main` 方法的程序类。在那里，我们将创建一个 `person` 类的实例并运行程序，检查一切是否运行正常。\n\n![Image00116.jpg](img/Image00116.jpeg)\n\
  \n现在，运行程序：\n\n![Image00117.jpg](img/Image001111.jpeg)\n\n一切进展顺利。\n\n## 第 7 章：LINQ\
  \ 查询操作符 – LINQ\n\n集成查询（称为 LINQ）代表了 C# 编程语言中的查询语法，用于不同对象的检索和过滤。LINQ 为各种类型的对象提供了单一的查询接口。这种查询语法集成到了\
  \ C# 编程语言以及 Visual Basic 中。为了更好地理解，我们将提供一个示例进行进一步说明。因此，你有 SQL 这种结构化查询语言，SQL 用于从数据库中获取和保存数据，它是一种旨在与数据库紧密工作的语言。\n\
  \n与 SQL 类似，LINQ 用于获取和过滤不同的数据源，如集合、数据集等。有很多方法可以使用 LINQ；它被用于查询集合、XML 文档、实体框架数据集，并允许使用面向对象的方法处理数据。使用\
  \ LINQ 时，你不需要担心将设置转换为对象。LINQ 提供了一种查询任何来源数据的方法。它支持编译时语法检查，如果你在编写 LINQ 代码时出错，编译器会立即通知你。LINQ\
  \ 允许你查询每个集合，如列表、数组等。\n\n现在进入示例部分：\n\n在这个示例中，我们有一个名为 `car` 的类。在 `car` 类中，有三个属性：`trunkCapacity`、`isAutomatic`\
  \ 和 `isTurboCharged`。每个属性代表一个只读属性，它们的初始状态在 `car` 构造函数设置。构造函数接受三个参数并将它们的值赋予上述属性。在\
  \ `main` 方法中，我们正在创建一个 `car` 对象的列表。`car` 对象的列表在声明部分填充，创建了五个具有不同 `trunkCapacity`、`isAutomatic`\
  \ 和 `isTurboCharged` 值的 `car` 对象。之后，我们将过滤列表，只保留具有自动挡箱的汽车。这将通过使用 LINQ 查询完成。我们创建了一个名为\
  \ `carsAreAutomatic` 的对象并使用 LINQ 过滤 `cars` 列表。然后我们执行 `where` LINQ 扩展方法来获取所需的对象。它是如何工作的？在\
  \ `where` 方法中，我们声明了一个迭代变量，将用于过滤条件。\n\n示例中的变量是 `s`。因此，接下来的过滤操作是：对于 `cars` 列表中的每个\
  \ `s` 对象，它将为我们提供 `s.isAutomatic` 属性等于 true 的对象。这将创建一个过滤后的列表。为了让这成为显式类型对象的列表，我们将对过滤后的列表执行简单的\
  \ `toList()` 方法。这将创建一个 `list<car>` 类型的对象，并将其置于 `carsAreAutomatic` 对象。现在，我们拥有了所需的数据。最后，我们将遍历新创建的\
  \ `car` 对象集合，并将消息打印到控制输出。对于列表中的每个对象，我们将打印“后备箱容量为 {certain capacity} 的汽车是自动的”。我们知道这一点，是因为我们过滤了汽车并只取了具有自动挡的汽车。\n\
  \n另一个示例见下方：\n\n\n\n在这个示例中，我们有一个名为 `person` 的类。该类有三个属性，分别是 `salary`、`firstname` 和\
  \ `lastname`。每个 `person` 类代表一个包含其基本信息的员工。对象的属性是在构造函数中赋值的。\n\n在 `main` 方法中，创建了一个包含\
  \ `person` 类类型对象的列表。我们添加了五个 `person` 对象，每个对象都有不同的 `salary` 金额、`firstname` 和 `lastname`。经理想要筛选出所有\
  \ `salary` 大于 3000 的人员，这些人员将被标记为 `seniors`（资深员工）。我们将通过 LINQ 查询来实现这一目标。\n\n与上一个示例一样，我们使用\
  \ `where` 扩展方法对人员列表进行过滤。在该方法中，我们声明只需要 `salary` 大于 3000 的 `person` 对象。在完成检索后，`toList()`\
  \ 方法将过滤后的可枚举列表转换为 `person` 对象列表。现在，我们得到了一个包含 `person` 类类型的列表对象，它只包含 `salary` 大于\
  \ 3000 的人员。该变量命名为 `seniors`。\n\n现在，经理要求获取所有资深员工薪资的总和。我们将通过创建一个资深薪资列表，然后将所有值相加存一个变量，最后将其打印到标准输出。`seniorsalaries`\
  \ 列表的创建通过执行 `select` LINQ 扩展方法完成。当需要从对象集合中获取某些属性值时，就会使用 `select` 方法。情况下，我们需要从 `seniors`\
  \ 列表中的每个对象获取 `salary` 属性值。\n\n`select` 方法的操作如下：对于 `seniors` 列表中的每个 `x` 对象，获取 `x.salary`\
  \ 值。这创建了一个可枚举列表。执行 `toList()` 方法后，我们成功创建了一个包含资深员工薪资元素的 `List<int>` 对象。然后，我们创建了一个变量来存储所有资深员工薪资的总和——`seniorsalariessum`。完成这一步后，我们还有最后一条语句来完成工作。通过\
  \ `foreach` 方法遍历 `seniorsalaries` 列表，将所有薪资收集并累加到变量 `seniorsalariessum` 中。最后，程序将结果——`seniorsalariessum`\
  \ 的值打印到标准输出。该程序的输出看起来如下：\n\n![Image00121.jpg](img/Image00121.jpeg)\n\n这个逻辑和问题的解决方案可以简单得多，资深薪资总和只需要一行代码即可。那行代码看起来像这样：\n\
  \n![Image00122.jpg](img/Image00122.jpeg)\n\n在执行 `where` 方法后，将执行 `select` 方法，随后将创建一个列表，我们可以使用\
  \ `foreach` 扩展方法遍历该列表并进行求和计算。这将产生完全相同的结果。在初始解决方案中，为了便于理解，这个长语句被分成几个较小的语句。让我们用最后一个示例来结束这个\
  \ LINQ 章节：\n\n![Image00123.jpg](img/Image00123.jpeg)\n\n在这个示例中，我们修改了上一个示例中的 `person`\
  \ 类。现在，`person` 类包含了 `salary` 属性和 `personinformation` 类属性，两者都在 `person` 类中赋值。`personinformation`\
  \ 类包含三个只读属性。这些属性是 `firstname`、`lastname` 和 `id`，其中 `id` 的数据类型为 `int`。这三个属性在实例化 `personinformation`\
  \ 对象时在构造函数中进行赋值。\n\n现在，让我们进入 `person` 类的 `main` 方法。在这里，我们再次创建一个对象列表，这与上一个示例相同，尽管由于类的修改，这次会略有不同。我们正在创建五个\
  \ `person` 对象，每个对象都分配了 `salary` 和 `personinformation` 对象。对于每一个人，我们都创建一个 `personinformation`\
  \ 对象来正确地实例化 `person` 对象。每个 `personinformation` 对象在实例化时都传递了 `firstname`、`lastname`\
  \ 和 `id`。通过这种方式，我们创建了一个稍微复杂的对象，它内部包含了另一个对象。好了，我们准备好了。\n\n经理要求我们找到所有被视为资深员工且 `id`\
  \ 小于 150 的员工的名字（firstname）。从上一个示例中，我们知道资深员工是指 `salary` 大于三千 (3000) 的人员。我们正在进行与上一个示例类似的操作，但这次\
  \ `person` 类发生了变化。它的结构与上一个示例不同，因此我们必须先分析类结构并创建一个解决方案。\n\n第一步是，必须从人员列表中过滤出 `salary`\
  \ 大于 3000 的 `person` 对象。之后，我们必须从每个 `person` 对象中提取 `personinformation` 对象，找到所有资深员工的名字。当收集\
  \ `personinformation` 对象时，我们必须对其进行过滤，只保留 `id` 小于 150 的对象。完成该任务后，我们就可以 `select` 所有资深员工的\
  \ `firstname` 属性，创建一个列表，遍历该列表并打印名字值。这一切都是在一个复杂的 LINQ 查询中完成的，我们从中创建了 `seniorslt150`\
  \ 列表变量。\n\n第一个 `where` 方法创建了一个可枚举列表 `seniors`。然后，`select` 方法从 `seniors` 列表中获取 `personinformation`\
  \ 对象，并创建一个资深员工 `personinformation` 对象的枚举列表。第二个 `where` 方法作用于之前创建的枚举列表中的 `personinformation`\
  \ 对象，并在那里过滤出 `id` 属性小于 150 的 `personinformation` 对象。从那里，我们执行 `select` 方法，为每个 `id`\
  \ 小于 150 的资深员工 `personinformation` 对象收集 `firstname` 属性值。最后，我们对创建的最终枚举结果执行 `toList()`\
  \ 方法，最终产物是一个包含每个资深员工名字的字符串列表。\n\n\n\n同样，有很多问题需要我们了解某个条件，或者对如何解决它们做出决策。在 `c#` 中，实现这一点很容易，因为该语言为许多不同的工具来处理这些问题。我们将必须使用表达式，而这些表达式将被求值。在这种情况下，我们将使用关系表达式和逻辑表达式，它们会被求值，并根据求值的结果执行算法的特定步骤或其他操作。让我们先了解我们所需的表达式。\n\
  \n### 做出选择和决策\n\n当我们使用 `c#` 语言时，我们需要花一些时间来处理决策控制语句或条件语句。这些代码类型可以接收用户的输入，并将其与你在代码中设置的条件进行比较，然后代码将根据这两者自主做出一些重要的决策。\n\
  \n在某些时候，你写了代码，并希望确保此程序能够独立处理某些决策。你可以选择编写代码，以便在代码中预先找到特定的条件，然后代码可以根据用户输入到计算机的内容做出响应。\n\
  \n关于这一点的好消息是，对于这些条件语句，你有几个选项可以选择。根据你希望从程序中获得什么，以及你希望它如何响应用户的不同输入，每种语句的工作方式都略有不同。在我们学习不同的选项时，你能够更好地看到每种语句是如何工作的，以及为什么在此过程中选择其中一个对你来说是一个极佳的选择。让我们深入看看\
  \ `c#` 语言中可用的一些主要条件语句，学习每一个将如何工作，并探索使用它们进行编码的一些基础知识。\n\n 观察 if 语句\n\n我们在这里想要查看的第一种条件语句被称为\
  \ `if` 语句。在我们将要查看的所有条件语句中，这一个是最基础的。它缺少了一些我们将在这些语句中看到的功能，但它确实帮助我们学习更多关于条件语句的知识并在某些情况下也很有用，因此学习它是非常重要的。\n\
  \n当你处理这个 `if` 语句时，你会发现当它运行时，只有当用户提供的输入与代码中设置的条件匹配时，代码才会我们提供回复。当这种情况发生时，代码将能够执行，通常取决于程序员在代码中输入的内容，输出某种消息。有时你还会设置它执行其他操作。\n\
  \n然而，如果用户输入的输入与我们设置的条件不匹配，那么屏幕上将什么都不显示。这可能会导致一些问题，这就是为什么 `if` 语句可能没有其他某些选项那么常用。\n\
  \n这一切中的好消息是，即使是初学者，也会发现这些 `if` 语句很容易设置和使用。让我们来看下面的代码，看看我们如何在 `c#` 语言中创建一个这样的 `if`\
  \ 语句：\n\n```\nif (x > 0)\n{\n    Console.write(\"the value is positive.\");\n}\n\
  ```\n\n通过我们在上面列出的示例，某些事情需要发生。如果用户输入的值大于零，程序被设置为打印“the value is positive”，但如果该表达式结果为假，或者输入小于零，程序将忽略\
  \ `Console.write` 之后的整个语句并继续运行。\n\n 观察 else 语句\n\n正如我们在处理语句时很快发现的那样，在很多情况下，这些语句无法以我们想要的方式帮助我们完成任务。设置一种代码，让用户输入某些内容而程序直接结束，是一个好主意，在这里我们将查看一种名为\
  \ `else` 的新条件语句。\n\n`else` 语句将是一个非常好用的工具，因为它在为我们正在编写的代码增添大量功能的同时，同时允许我们添加多个选项，并处理用户可能添加的几乎任何内容。直入正题，我们需要查看\
  \ `else` 语句的语法，以便更好地理解它在 `c#` 语言中将如何工作。这种语句的一个很好的语法示例是：\n\n```\nif (expression)\n\
  {\n    Console.write(\"the statement you want to run if result is true\");\n}\n\
  else\n{\n    Console.write(\"the statement you want to run if result is false\"\
  );\n}\n```\n\n正如你已经从这个中看到的，`else` 语句将带来更多力量。这是 `else` 语句的一个基础选项，但你可以添加更多行来让它更强大。通过这些语句，如果答案为假，你的代码将继续执行语句的下部分以检查该部分是否为。如果有两个以上的选项，它将继续向下执行\
  \ `else` 语句，直到答案变为真，然后它将显示出现的消息。\n\n现在我们已经花了一些时间讨论它，是时候看一个它是如何工作的示例了，这样你就可以在代码中使用它：\n\
  \n```\nif (x > 0)\n{\n    Console.write(\"this value will be positive.\");\n}\n\
  else\n{\n    Console.write(\"the value is less than or equal to zero.\");\n}\n```\n\
  \n你会发现，当我们处理上面的示例时，`else` 子句将是非常重要的，或者至少在布尔表达式结果为假之前是隐藏的。它在过程需要 `else` 语句时就在那里。但如果我们最终得到了真值，那么第一个语句将是显示的那个，这样我们完全不需要\
  \ `else` 语句了。\n\n 嵌套条件语句是什么\n\n每当我们查看 `c#` 附带的一些新代码时，你应该发现，使用我们上面那两个语句会更容易，或者你也可以将它们结合起来，为你的某些代码制作一个嵌套条件语句。通过嵌套条件语句，我们将采取上述条件语句之一，并将其放在另一个语句内部。\n\
  \n\n\n在处理任何嵌套条件语句时，我们必须关注的主要点是：如果你在编写语句时出现任何错误，将会导致整个部分出错，并且花费一些时间来修复。这使得在开发过程中处理和操作它们变得有些困难，请务必小心。\n\
  \n不过，它们的之处之处，也是让它们非常有吸引力的一点在于，允许我们根据需要添加尽可能多或尽可能少的层级。尽管如此，大多数语言专业人士仍建议嵌套语句保持在三层或以内，以免它们在处理过程中变得过于混乱。\n\
  \n如果你在编写这些语句时最终超过了第三层，你可能会得到一个不受控且行为不符合预期的结果，甚至可能无法运行。作为一名初学者，请坚持三层，并随着编程水平的提高再增加层数。\n\
  \n你可以编写出许多依赖于这些条件语句的代码。它们可以帮助你让代码更健壮，并确保我们能够处理用户提供的某些输入，即使我们无法提前预测用户将向程序输入什么答案。这些语句可以根据我们设置的任何条件基于输入，并确保程序将按照我们期望的方式运行。这使得我们更容易看到结果，并确保程序按照我们想要的方式工作。\n\
  \n## 第 9 章：net\n\n### .net 框架\n\n在这种框架下编写的程序能够在软件环境中执行，而不是硬件环境，该环境被称为 clr 或“公共语言运行时”（common\
  \ language runtime）。cls 是一个应用程序虚拟机，它将帮助我们提供一些不同的服务，包括安全性、异常处理和内存管理。正因如此，用此框架编写的代码被称为托管代码（managed\
  \ code）。我们提到过的 cls 和 `fcl` 共同构成了我们所讨论的 .net 框架。\n\n首先，`fcl` 将非常重要。它为我们提供了一些用户界面、数据库连接、数据访问、Web\
  \ 应用程序开发、算法、网络通信等。程序员可以将他们正在编写的源代码与 .net 框架以及其他可用库结合，从而产出软件。\n\n这是一个设计用于与我们在 Windows\
  \ 平台上想要创建的大多数新应用程序良好协作的框架。此外，微软还将出一个专门为 .net 软件设计的 IDE（集成开发环境），称为 Visual Studio。\n\
  \n在涉及 .net 框架方面，我们有很多可以处理的内容。开发的一些方法不仅可以在 Windows 系统上运行，也可以其他操作系统上运行，包括 Linux 和\
  \ Mac。它还可以帮助我们使用多种语言（特别是 C#），同时保持可移植性、安全性、高性能，并良好地管理我们在编写特定代码时所需的内存。\n\n为了能够用 C#\
  \ 进行有效编程，人们需要一些关于所谓 .net 框架的理论背景知识。这就是为什么 .net 框架是本书不可或缺的一部分。在我们更深入接触 .net 框架之前，你应该知道它是\
  \ .net 技术中不可或缺的一部分。\n\n运行时环境的任务本质上是执行用相应编程语言开发的代码。但在过去，通常必须为每种编程语言（在某种程度上也为每个版本）提供单独运行时库（`runtime\
  \ library`），以便执行相应的程序。例如，C++ 的 `msvcrt.dll` 文件。运行时环境的概念今天仍然适用，并提供了 .net 的核心优势：\n\
  \n- 只需要一个框架。\n- 可以根据知识水平和偏好使用不同的语言。\n- 所有语言的运行时环境都是同一个框架。\n- 跨语言支持是一个主要优势。\n- 跨语言异常处理允许定义程序在发生错误时的反应方式。\n\
  - 运行时可以控制改进的安全性。\n- 简化的版本控制，允许存在多个版本。\n\n由于 .net 框架提供了跨语言运行时，它确保了不同组件之间的最佳协作。\n\n\
  你现在知道 .net 框架是 .net 技术的一部分以及它的职责。.net 框架由三个主要组件组成：\n- 公共运行时 (`clr`)\n- 程序集 (Assembly)\n\
  - 公共中间语言 (`cil`)\n\n在本书中，我们将详细介绍这些组件：公共运行时、程序集和公共中间语言。它们将在 Web 服务的上下文中再次出现。\n\n\
  .net 框架是开发中涉及的所有问题的解决方案。.net 框架的这两个组件也被称为基础框架：公共运行时和库。\n\n\n\n\n当我们有一个用 `.net` 语言编写的程序并对其编译时，会生成程序集（assembly）。程序集包含了编译后程序中的\
  \ `cil`，还包含了程序中使用的所有类型的信息。\n\n### CIL\n\n`.net` 程序不会直接编译成编译器的汇编代码；而是被编译成一种名为 `cil`\
  \ 的中间语言。这种语言由 `runtime` 读取并执行。`cil` 和 `runtime` 的使用赋予了 `.net` 极大的灵活性和跨平台能力。\n\n\
  `.net` 框架拥有通用语言规范，即 `cls`。这些规范是任何想要使用 `.net` 的语言都必须遵守的指南，以便与 `runtime` 配合。此的优势之一是，如果我们的代码符合\
  \ `cls` 编译，我们就可以与其他语言实现互操作性；例如，可以在 `c#` 中创建一个库，而 Visual Basic `.net` 程序员可以毫无问题地使用它。\n\
  \n这些指南中最重要的点之一是 `cts`，即公共类型系统。在编程语言中，当我们想要保存信息时，会将其放在变量中，变量的类型取决于要保存的信息，例如，类型可以是\
  \ `integer`（整数），另一个是存储带小数的数字，另一个是保存短语或单词。这样做的问题是，每种语言存储信息的方式不同。某些语言使用 16 位内存存储整数，而另一些语言使用\
  \ 32 位；甚至某些语言（如 `c` 和 `c++`）没有用于存储字符串或短语的类型。\n\n为了解决这个问题，`.net` 框架通过 `cts` 定义了类型在它们环境中如何工作。任何与\
  \ `.net` 工作的语言都必须使用 `cts` 中概述的类型。现在我们已经了基本概念，并可以看到所有这一切是如何整合在一起的。\n\n### 如何创建 .net\
  \ 应用程序\n\n我们可以使用编程语言来创建一个 `.net` 应用程序。为了这个目的，我们将使用 `c#`；通过这种编程语言，我们可以创建程序的源代码（告诉程序应该做什么的指令）。\n\
  \n当我们完成源代码后，就必须使用编译器。编译器获取源代码并为我们创建一个程序集。这个程序集将包含我们代码等等的内容，但是用 `cil` 编写的，这引导我们发现了\
  \ `.net` 的另一个优势——编译器可以针对我们将使用程序的平台对代码进行优化，这意味着同一个程序可以针对移动设备、普通 PC 或服务器进行优化，而无需对其进行任何更改。\n\
  \n`.net` 框架可以在许多平台上运行，不仅仅是 windows。这意味着我们可以在特定平台上进行编程，如果另一个平台拥有 `runtime`，我们的程序就可以毫无问题地运行。在\
  \ windows 中开发的 `.net` 程序可以在 `linux` 中执行，只要它有相应的 `runtime`。\n\n当我们想要调用程序时，`runtime`\
  \ 会开始介入，读取程序集并为我们创建整个环境。`runtime` 开始从程序集中读取 `cil` 指令，并在读取的同时将其编译为运行该程序的计算机的微处理器可以识别的代码；这被称为\
  \ `jit` 或即时编译。通过这种方式，程序在执行过程中推进，并被编译；所有这一切对用户来说都是透明的。\n\n`jit` 编译器也被称为 `jitter`。它是\
  \ `runtime` 的一部分，如果程序需要重新运行已经编译的代码，`jitter` 将而不会重新编译，而是运行已经编译的内容，从而提高了性能和对用户的响应时间。\n\
  \n对于正在运行的程序，`.net` 框架提供了内存管理和垃圾回收的服务。在 `c` 和 `c++` 等非托管语言中，程序员负责内存管理。在大型程序中，这可能是一项复杂的任务，会导致程序执行期间出错。幸运的是，像\
  \ `c#` 这样的托管语言有一种模型，使得我们这些程序员不再需要负责内存管理，垃圾回收器负责移除不再使用的对象。垃圾回收器会自动工作，但对于某些情况（例如数据库连接），我们必须显式指示它们何时需要被释放。\n\
  \n## 第 10 章：enum 和 struct\n\n### enum\n\n`enum` 是一种特殊的数据类型，允许程序员为一组常量提供有意义的名字。要声明一个\
  \ `enum`，我们使用 `enum` 关键字后跟 `enum` 的名称。`enum` 的成员定义在花括号内，用逗号分隔。一个示例是：\n\n```csharp\n\
  enum DaysOfWeek\n{\n    Sun, Mon\n}\n```\n\n注意，在声明 `enum` 后，我们不在右大括号结束加分号。默认情况下，`enum`\
  \ 的每个成员都是从 0 开始的整数。如果我们想为 `enum` 成员分配不同的值，可以如下操作：\n\n```csharp\nenum DaysEnum\n\
  {\n    Sun = 5, Mon = 10\n}\n```\n\n现在，sun 被赋值为 5，mon 被赋值为 10。如果我们没有赋值值，`enum` 成员将是连续的整数，例如：\n\
  \n```csharp\nenum DaysEnum\n{\n    Sun, Mon\n}\n```\n\nSun 被赋值为 0，Mon 被赋值为 1。如果我们想将\
  \ `enum` 强制转换为 `int`，可以这样做：\n\n```csharp\nConsole.WriteLine((int)daysEnum);\n```\n\
  \n```csharp\nConsole.WriteLine(daysEnum);\n```\n\n使用 `enums` 有两个主要原因。第一个是提高代码的可读性。语句：\n\
  \n```csharp\ndaysEnum = DaysEnum.Mon;\n```\n\n比：\n\n```csharp\ndaysEnum = 1;\n```\n\
  \n更具解释性。\n\n第二个原因是限制变量可以取的值。如果我们有一个存储星期几的变量，我们可能会不小心地给它赋值 10。通过使用 `enum` 可以防止这一点，因为我们只能将\
  \ `enum` 预定义的成员赋值给变量。\n\n```csharp\nenum DaysEnum : byte\n{\n    Sun = 300\n}\n\
  ```\n\n由于 `byte` 的范围是 0 到 255，这将失败。\n\n### Struct\n\n现在，让我们看看 `struct` 数据类型。`struct`\
  \ 在许多方面与 `class` 相似。像类一样样，它们包含属性、构造函数、方法和字段，并允许将相关的成员分组到一个包中，以便你可以作为一个组来操作它们。\n\n\
  要声明一个 `struct`，你使用 `struct` 关键字。一个示例是：\n\n```csharp\nstruct MyStruct\n{\n    //fields\n\
  \    private int x, y;\n    private anotherClass myclass;\n}\n```\n\n\n\n\n\n```csharp\n\
  private days mydays;\n\n//constructor\npublic mystruct(int a, int b, int c)\n{\n\
  \    myclass = new anotherclass();\n    myclass.number = a;\n    x = b;\n    y =\
  \ c;\n    mydays = days.mon;\n}\n\n//method\npublic void printstate()\n{\n    console.WriteLine(\"\
  x = {0}, y = {1}, mydays = {2}\", x, y, mydays);\n}\n}\n\nclass anotherclass\n{\n\
  \    public int number;\n}\n\nenum days { mon, tue, s, wed }\n```\n\n`mystruct`\
  \ 定义在第 1 到 23 行。在第 4 行，我们为结构体声明了两个私有的 `int` 字段。第 5 行，我们声明了另一个名为 `myclass` 的私有字段。该字段是\
  \ `anotherclass` 类的一个实例。第 6 行，我们声明了一个 `enum` 变量 `mydays`。这两个字段（`myclass` 和 `mydays`）在该示例中被特别包含，用于演示如何将类实例和\
  \ `enum` 变量作为结构体的字段。\n\n在声明字段之后，我们声明了结构体的构造函数（第 9 到 16 行），随后是一个用于打印 `x`、`y` 和 `mydays`\
  \ 取值的方法（第 19 到 22 行）。\n\n在声明结构体之后，我们在第 25 到 28 行声明了 `anotherclass` 类，并在第 30 行声明了\
  \ `enum days`。在这个示例中，我们将类和 `enum` 声明在结构体 `mystruct` 外部。然而，我们可以在结构体内部声明 `enum` 或类。`enum`、结构体或类可以嵌套在另一个结构体或类内部。当我们处理书末尾的项目时，将查看一个在类内部声明\
  \ `enum` 的示例。\n\n要使用上面的结构体，我们可以在 `main()` 方法中添加以下代码：\n\n```csharp\nMystruct example\
  \ = new mystruct(2, 3, 5);\nexample.printstate();\n```\n\n如果我们运行代码，将得到：\n`X = 3,\
  \ y = 5, mydays = mon`\n\n结构体（struct）和类（class）之间有两个主要区别。首先，结构体数据类型不支持继承。因此，你不能从一个结构体派生另一个结构体。然而，结构体可以实现接口。实现方法与类相同。更多信息请参阅第\
  \ 8 章。\n\n结构体和类的第二个区别是结构体是值类型，而类是引用类型。\n\n有关结构体和类区别的完整列表，请查看以下页面：\n`https://msdn.microsoft.com/en-us/library/saxz13w4.aspx`\n\
  \n# 第 11 章：常见错误以及如何避免它们\n\n本指南花费了一些时间来了在使用 C# 语言编写代码时需要了解的所有不同编码部分。\n\n在学习这门语言时，有很多不同的方面需要留意，但当我们把所有内容整合在一起时，我们会发现在这个过程中可以创建一些很棒的代码和程序。尽管许多旨在为初学者简化编程的现代编程语言在刚开始学习时，仍然会有许多挑战出现。\n\
  \n初学者在这一过程中必须做的事情之一是，他们需要通过练习，并从编码中出现的错误和一些问题中学习。即使是休息一下通常也足够帮助你继续进行，并确保你不会在过程中精疲力竭并遇到困难。你应该避免的一些错误如下：\n\
  \n### 练习不足\n\n本指南中有很多大量的代码、建议和需要学习的内容，但如果你不亲自打开 C# 编译器并尝试其中的一些内容，你将无法获得让这些技术为你服务的所需的技能（以及更多内容）。这就是为什么我们需要遵循的第一条规则是玩玩代码并尽可能多地练习。对于我们在任何语言中想要探索和学习任何新主题，我们越快能把手弄脏并开始捣鼓代码，就能越快地学习一些概念。你不能在不实际使用信息的情况下通读它们，并指望记住这些信息并能够将代码应用到你的程序中。你必须弄弄代码并观察它是如何工作的。现在，你会发现开始这一工作的最好地方就是打开我们的\
  \ C# 编译器并立即开始编写我们想要的代码。取本指南中的一些示例并随便弄一下。即使只是从开始将它们输入编译器也是朝着正确方向迈出的一步，并将确保我们能够通过练习、工作和探索来获得正确的结果。\n\
  \n### 忽略基础\n\n尽管有时基础知识看起来太基础了而无法使用，你可能觉得应该不加思考地快速跳过，但花时间学习这些是如何运作仍然很重要。尽管它们很简单，但良好运用它们非常重要。我们越能良好地处理这些基础知识，掌握随后出现的某些高级内容就越容易。那些试图进入编程语言并快速跳过起始部分、不在某些基础知识上花费适当时间的程序员，将在需要过渡到某些高级材料时成为第一批被住的人。\n\
  \n所以，在错过我们这里需要的一些课程并跳过所有这些中重要的基础知识之前，请确保在过程中学习更多关于基础知识以及我们能用它做什么。\n\n### 不写出来\n\n\
  想要开始编程、打开编译器并开始编码是正常的。虽然这是使用的方法之一，但有时尝试不同的方式并手写而不是一直尝试输入，将是帮助我们完成任务的秘诀。拿出笔和纸写下我们的代码是有帮助的。\n\
  \n\n\n\n如果你计划在大学期间或为了新工作而使用这种方法，那么能够写出你正在使用的 `codes` 并将其用于你的需求，对于你所预见到的成功将非常重要。\n\
  \n你投入越多的时间和练习来手写编写一些 `codes`，你对编码以及通过它能做的一切事情的理解就会越深刻。\n\n它迫使程序员慢下来，并真正关注他们想让 `codes`\
  \ 执行什么。\n\n然后你可以利用这种方法来发现自己的错误，并学习什么对你最有效，什么又无效。\n\n### 不要拒绝帮助\n\n当我们刚开始以这种方式编写\
  \ `codes` 时，你可能对事情将如何运作以及你将如何成为历史上最伟的代码编写者有一许多宏伟的想法。\n\n你可能认为这不会出现任何任何问题，而且你可以在短时间内处理好一切。\n\
  \n在我们想要在这里完成的工作中，出现的最大的误解之一，就是我们假设自己完全不需要为编程寻求任何帮助。\n\n虽然在没有任何帮助的情况下独立开始学习任何语言编程（即使是\
  \ `c#`）是非常棒的，但我们必须面对现实，并记住，当我们有正确的同伴反馈和导师来帮助时，我们的学习速度会更快、更高效。\n\n那些在你独自操作时看起来是无法解决的错误，或者看起来是无法学习的主题，你会发现，当有更有经验的人介入并提供帮助时，事情会变得简单得多，你实际上可以学到新东西。\n\
  \n无论是在线寻求帮助，还是能够找到可以面对面来到你并提供建议的人，你永远不要害怕向别人寻求帮助。\n\n现在所有更高级的程序员都曾处于你现在所处的位置。\n\n\
  而且大多数开发者都会喜欢他们能获得再次编码的机会，并且非常愿意帮助你解决你想要帮助的某些编码。\n\n当然，我们需要对此保持谨慎，在整个过程中绝不要利用这种机会。\n\
  \n在这里应该遵循的最好规则是：让别人帮助你解决代码中的某个问题的时间不要超过 20 分钟。\n\n而且，在提前花费至少 20 分钟时间尝试学习它是如何运作的以及你能够用它做什么之前，你不应该寻求帮助。\n\
  \n### 不要不要休息\n\n会有当你正在用 `c#` 语言编写你想做的某些 `codes` 时，然后你会在某些问题上卡住。\n\n你会在上面上花一些时间，但这似乎只会让整件事变得更糟。\n\
  \n你不断尝试、不断工作，实际上是在让问题变得更糟，或者根本找不到问题所在，你的挫败感会不断上升。\n\n你想解决问题并继续你的编码，但在过程中你只是变得越来越愤怒，而\
  \ `codes` 也变得变得越来越杂乱。\n\n当这种情况发生时（而且这是每个人都可能发生的事情），我们必须花时间来休息一下。\n\n这可能是我们在处理 `c#`\
  \ 语言和我们的一些 `codes` 时最不想担心的事，但它将允许我们从问题中抽身，呼吸一下新鲜空气，或者至少做一段时间其他的事情。\n\n而且，通常在你休息完并重新回到问题面前时，你会发现开始时看起来无法解决的问题实际上非常容易修复。\n\
  \n当人们在这个过程中投入了这么多时间和精精力后，没有人想要放弃，但从长远来看，它可以减少挫败感，并确保你能在短时间内修复你的代码。\n\n### 忽视 c#\
  \ 社区\n\n当我们开始用 `c#` 语言及更多内容进行编码时，我们会发现的有趣事情之一，就是由不同的程序员和开发者组成的庞大社区。\n\n\n\n当你准备好开始学习新的编程语言时，你会发现只要避开这些错误，你就能有一个良好的开端。\n\
  \n## 结论\n\n如果你已经决定 `c#` 语言是适合你工作的语言，那么你并不孤单。\n\n世界上有许多程序员都在使用这门语言，现在你已经读完了这本指南，你可以像我们一样，现在加入这一者的行列了。\n\
  \n本指南中包含了极其丰富的知识和信息，供我们学习使用，你会发现，在处理 `c#` 语言时，这是我们能够利用的最佳选择之一。\n\n`c#` 易用性的得益于减少了某些\
  \ `c++` 特性，并且不再使用宏、模板和多重继承。特别是对于企业级开发者来说，上述特性带来的麻烦远多于收益。让编程变得更容易的新特性包括严格的类型安全、版本控制、垃圾回收等。所有这些功能的目的是为了开发面向组件的软件。\n\
  \n你学习 `c#` 的努力是一项巨大的投资，因为 `c#` 设计初衷是作为编写应用程序的主要语言。你会发现许多在 `c++` 中可以实现或需要费力实现的功能，在\
  \ `c#` 中仅仅是一些基础函数。对于企业级编程语言，新的财务数据类型非常受欢迎。你使用了一种专用于财务计算的新型数据类型 `decimal`。如果你不喜欢这种简单、现成的类型，可以根据应用程序的特殊需求轻松创建一个新的数据类型。\n\
  \n`c#` 为你提供了便利的函数，如垃圾回收、类型安全、版本控制等。唯一的“代价”是代码操作默认是类型安全的，并且不允许使用指针。这完全关乎类型安全。然而，如果你需要指针，仍然可以在非安全代码中使用它们，且在调用非安全代码时不能使用列集。\n\
  \n`c#` 是一门易于的编程语言，即使对于编程初学者来说也很友好。你只需要搭建环境并开始编写和运行你的 `c#` 代码。你可以单独使用 `c#` 开发一个完整的计算机应用程序。\n\
  \n作为一名初学者，你将通过本指南实现惊的目标，并在学习如何使用 `c#` 语言的过程中获得宝贵的知识。我们探索了与该语言相关的许多不同主题，例如如何使用条件语句、如何使用类以及操作符的原理等等。本指南将帮助你熟悉\
  \ `c#` 语言，让你学会编写自己的代码。\n\n如果你觉得已经准备好学习一种新的编程语言并开始编程，`c#` 是一个很棒的选择。务必查看本指南，学习在短时间内创建真正实用的代码所需的所有基础知识。\n\
  \n祝你好运，编程愉快！\n\n# 第 6 册：树莓派\n\n一本计算机技术领域独立学习、无缝设置和项目精通的初学者指南\n\nvera Poe\n\n## 引言\n\
  \n我们可以找到许多不同的编程语言来编写代码，也有许多不断涌入并帮助我们完成任务的工具和配件。随着技术的不断发展和变化，有时会让初学者觉得自己落后了太多，认为应该放弃而不是尝试。他们担心工作对他们来说太难无法完成。很棒的一是，`raspberry\
  \ pi`（树莓派）将帮助解决这个问题。这是一块小型计算板，大小大约相当于信用卡，可以连接到电脑显示器或你的电视。\n\n首先，`raspberry pi` 设备可以执行我们对传统桌面电脑所要求的任何操作，例如处理不同的语音、上网、创建表格、玩游戏、播放高清视频等。不仅如此，我们还会发现该设备还具有与世界交互的能力。\n\
  \n正如你所看到的，在需要工作时，我们需要了解关于 `raspberry pi` 的很多。\n\n接下来的章节将讨论 `raspberry pi`。`raspberry\
  \ pi` 越来越受欢迎。但为什么呢？这么多人爱上 `raspberry pi` 到底引起了什么轰动？这本书将关注所有原因，我们还将学习如何用 Python 编程以及你可以使用的不同工具。\n\
  \n如果你观察 `raspberry pi` 的结构，你首先注意到的是它非常小。`raspberry pi` 的尺寸与典型的信用卡相似。`raspberry pi`\
  \ 的这种小外形本身就是设备的一个特性，尽管它从箱子里取出时看起来完全完全成品。\n\n与现代主板相比，`raspberry pi` 是一种以微型外形、低廉的价格以及通常全尺寸\
  \ PC 预期的功能面向普通消费者的计算机。此外，互联网上还有一个整个 `raspberry pi` 社区，致力于帮助人们解决有关该设备的疑问。无论你是刚买了第一台\
  \ `raspberry pi` 需要帮助设置，还是在项目正在使用 `raspberry pi`，你都会对社区如此积极、快速地加入讨论，并对你的问题给出建议和反馈感到惊讶。\n\
  \n\n\n\n树莓派（Raspberry Pi）的诞生源于这样一个理念：制造一种尺寸紧凑、功能齐全的计算机并以合理的价格提供给普通消费者。这不仅能促进教育行业的发展，还能让计算机技术在各种项目中易于实施和定制（教育项目、DIY\
  \ 项目或任何可以发挥树莓派威力的实验）；简而言之，其前景几乎是无限的。树莓派基金会成立于 2012 年，在限量产后，其 Beta 测试取得了巨大的成功。如今，树莓派已成为领先的设备，在各种人类交互环境中立了稳固的足，包括家庭、办公室、智能工厂、数据中心、交互式教室以及其他充分利用小型手持电脑功能的场所。\n\
  \n当我们想到计算机时，通常会发现一个显示器、键盘、鼠标和 CPU。但树莓派是一个功能齐全的计算机系统，它嵌入在一个只有信用卡大小的小电路板上，成本比你找到的大多数视频游戏还要便宜。通过它，人们可以完成许多事情，如制作机器人、学习编程以及各种迷人且奇异的项目。\n\
  \n社会现在对程序员的需求比以往任何时候都大，树莓派的发布引发了人们对计算机技术和科学的新一轮热爱。\n\n树莓派作为主电脑可能不是一个绝佳选择，因为它只有 512MB\
  \ 到 1GB 的内存，且存储目的是使用 SD 卡；但它还可以用于许多其他用途，从为家庭自制的机器人提供动力、开发复古视频游戏，到成为家庭备用电脑以及连接网络的气象站。\n\
  \n如果你正在寻找开启自己的树莓派之旅的动力，那么你来对地方这里了，因为我们安排了可能是最好的用例来给你提供一些思路。\n\n## 第一章：树莓派基础\n\n\
  ![Image00125.jpg](img/Image00125.jpeg)\n\n### 什么是树莓派？\n\n树莓派是由总部位于英国的慈善机构树莓派基金会开发的低成本单板计算机。树莓派可以连接到显示器或电视机，并可以使用\
  \ USB 鼠标和键盘进行操作。该设备的尺寸与信用卡相当，且运行功耗低。它包含了通用计算机中常用的所有接口，如 USB 端口、音频接口、HDMI 输出端口、以太网端口等。除了这些标准接口外，该设备还提供了一些通用输入/输出（GPIO）端口。这些\
  \ GPIO 引脚可以配置为输入或输出端口，从而使设备能够作为一个低功耗、高性能的嵌入式系统运行。市场上有多个版本的树莓派，取决于其提供的功能。\n\n树莓派基金会在英国开发了树莓派，第一台设备于\
  \ 2012 年初发布。截至今日，已经发布了多个版本的树莓派，并随着每个版本的推出不断改进。甚至还有工业型号和越来越小的版本，如树莓派 Zero（Raspberry\
  \ Pi zero）。到 2017 年底，树莓派销量已超过 1700 万台。\n\n### 开发目标\n\n树莓派基金会的目标向年轻人介绍硬件和软件，并促进他们进入编程领域。树莓派购买价格相对便宜，因此使用树莓派开发的门槛非常低。树莓派独特之处在于，这张信用卡大小的小隐藏了一台完整的计算机。\n\
  \n同时，可以轻松实现许多日常生活和职业项目。树莓派基金会也发挥着重要作用。在 raspberrypi.org 网站上，你可以找到许多可以轻松构建的宏大项目的建议。树莓派基金会还开展许多学校项目，向青少年学生介绍编程。由于有许多基于树莓派的不同软件和硬件项目，我想在下一章中展示其中的一些。\n\
  \n这里还有很多话想说，因为现在已经有了基于树莓派的整个业务和商业设备。这表明树莓派已经变得非常普及，不再仅仅是年轻人的学习设备。\n\n### 硬件规格\n\n\
  你的树莓派具有以下硬件规格：\n\n- `Bcmquad-core` 64 位`arm a53` CPU，主频 `1.4ghz`\n- 用于无线和蓝牙的 `cypress\
  \ 4345` 芯片\n- `400 mhz` 视频核心 GPU\n- `1 gb lpdr22-900 sdram`\n- `802.11 ac` 无线局域网\n\
  - 蓝牙 `4.2` 芯片\n\n### 电源\n\n- `2.5 amp` 电源输入\n- 增加了 `poe` 连接\n\n### 上网\n\n你可以通过以太网线或无线连接将树莓派连接到互联网。要连接\
  \ WiFi，查看屏幕右上角。你会看到一个带有红色叉的图标。从下拉菜单中选择正确的网络。提供 WiFi 连接密码，你的树莓派就连接到互联网了。\n\n### 树莓派用来做什么？\n\
  \n树莓派笔记本电脑可以像任何其他 Linux 系统一样使用。该系统的“硬盘”很小——它没有使用传统的硬盘，而是使用微 SD 卡。你可以轻松地处理办公文档、运行游戏并播放视频。\n\
  \n你可以从任何计算机通过安全外壳（`ssh`）连接到树莓派的命令行界面。`ssh`是一种网络协议，为管理员提供了一种安全访问远程计算机的方法。在这种情况下，你不会从连接中获得图形界面。但是，你可以从另一台计算机上的终端应用程序执行命令。这些命令将通过`ssh`执行在你的树莓派上。\n\
  \n如果远程访问树莓派并且还需要图形界面，可以通过虚拟网络共享（VNC）来实现。这将会是一个缓慢的过程，但它可以让你在需要时视觉连接到树莓派。\n\n### 使用树莓派\
  \ 3b+模型还需要什么\n\n为了让树莓派充分作为台式计算机工作，你需要将以下设备连接到前面列出的端口和连接：\n\n电源：你需要一根`usb-a`转`micro-usb`线。`5.1\
  \ 伏`的微 USB 电源为其供电。最好的选择是从当地零售商处购买一个`300 瓦`的电源。这将为你的树莓派提供足够的功率，使你无需进一步升级即可进行工作。确保你不要过载电源。仔细查看电源上提供的规格，可以让你对系统的电源处理能力有一个大致的了解。\n\
  \n\n\n\n\n### 键盘和鼠标\n键盘和鼠标：树莓派允许你连接任何 USB 或无线键盘或鼠标。该设备带有 4 个 USB 端口，在连接键盘和鼠标后，还有两个空闲的\
  \ USB 端口\n\n### 显示器\n原始树莓派支持 `hdmi` 和 `rca` 端口。树莓派 3 拥有 `hdmi` 和神奇的 `3.5mm` 媒体端口。每个版本的树莓派都兼容\
  \ `hdmi`，这意味着你可以轻松将其连接到家中的兼容 hdmi 的电视上。\n\n### Micro sd 卡\n如果你想在树莓派上使用自己的 micro\
  \ sd 卡，你需要获取 `noobs` 安装程序。`noobs` 代表“开箱即用的软件”，这可能是一个相对复杂的过程，因此建议购买制好的 micro sd 卡。制好的\
  \ micro sd 卡并不贵，而且可能会为你节省大量的时间、金钱和精力。如果你坚持要准备自己的 sd 卡，请访问 [www.raspberrypi.org/downloads](http://www.raspberrypi.org/downloads)。在准备卡片时，你可以选择广泛的操作系统发行版，这对于\
  \ Linux 新手来说是一个巨大的优势；然而，最好使用 `noobs` 安装程序并使用它提供的标准 Raspbian 操作系统。\n\n### 外壳\n你的树莓派只是一个主板。它没有外壳，这就是它价格如此低的原因。建议为该设备购买一个外壳以保护它免受磨损并延长其寿命。\n\
  \n### 从 noobs 启动\n如果你购买了预装了 `noobs` 的 micro sd 卡树莓派，你的设置将简单得多。连接到显示器后，它将显示安装程序已加载。点击“安装”，安装将在短时间内完成。\n\
  \n树莓派提供了一个 Linux 桌面，你可以像使用其他电脑 一样使用它。如果你熟悉 Windows 环境，它很容易使用和导航。\n\n现在你的树莓派已经完全安装并配置完成，我们可以开始详细地探索它了。准备好深入吧！\n\
  \n### 附件\n\n### 摄像头\n回到 2013 年，树莓派基金会及其发行商发布了固件更新，允许树莓派使用摄像头。摄像头是一条扁平线，你可以将其插入 `csi`\
  \ 接口。当你查看 Raspbian 时，你需要确保通过配置摄像头选项在开发板上启用摄像头。树莓派摄像头可以拍摄高达 1080p 的照片或拍摄 640 x 480p\
  \ 的视频，三年后，800 万像素版本向公众发布。\n\n### Getboard\n基金会制作此附件仅用于教育目的，以便扩展 `gpio` 引脚，从而可以使用一系列开关和传感器来控制接口。\n\
  \n### 红外摄像头\n这款摄像头本将作为不包含红外滤镜的摄像头模块的一部分，它被称为 pi noir。\n\n### 软件\n\n## 操作系统\n如前所述，你将尝试坚持使用\
  \ Raspbian 操作系统，它是 Linux 的扩展。如果你不想使用基于 Linux 的操作系统，还有其他操作系统供可以使用。\n\n### 驱动 API\n\
  用于图形处理器的 `videoicore iv` 将使用一个二进制二进制文件（binary blob），在其中你可以从 sd 卡启动图形处理，并仅在启动后添加额外的软件。驱动程序中完成的大部分工作将通过处理器及其相关代码的闭源来完成。任何软件使用都将运行其闭源，但你可以下载某些特定应用程序在内核内部打开原始代码。内核的\
  \ API 将为库文件设计，以确保树莓派处理正确且代码不会构建可能导致树莓派无法正常运行。\n\n### 固件\n树莓派使用的所有固件都将是闭源并使用可以自由分发的二进制文件。你无法为树莓派找到很多开源的固件。\n\
  \n## 第 2 章：设置\n\n### 设置你的树莓派\n在本章中，我们将概述设置树莓派需要进行的所有工作。这将包括让它启动并运行所需的所有内容，所以请注意。起初很困难，但从这里开始会变得容易！本指南假设你正在使用树莓派\
  \ 3 型，这是最新的型号。然而，如果你使用的是旧型号，整个过程中的情况在很大程度上将保持不变。\n\n首先，你需要以下内容来设置你的 pi 以其作为台式电脑运行：\n\
  - 显示器（显而易见的）\n- 键盘和鼠标\n- Micro sd 卡\n- 操作系统\n\n### 选择操作系统\n你应该在你的树莓派上使用什么操作系统？这个问题有许多不同的答案。许多不同的公司已经制作了可以在树莓派软件上运行的操作系统版本，甚至微软也发布了可以在树莓派硬件上运行的\
  \ Windows 版本。所以请记住这一切，在你的树莓派上具体应该使用什么软件？\n\n无论你想使用什么操作系统，noobs 都会提供支持，并且是一个出色的操作系统安装程序。虽然我建议你安装\
  \ raspbian，但最终你对决定在 pi 上安装什么内容拥有自主权，让我们现在谈谈设置过程。\n\n![Image00126.jpg](img/Image00126.jpeg)\n\
  \n### 安装 noobs\n这些指令将告诉你如何设置 raspbian。如果你决定安装不同的操作系统，那么此书将无法帮助你。然而，只要通过 noobs 安装，过程对于所有操作系统来说都是相同的。因此，安装时不应该遇到任何问题。话如此，让我们先安装\
  \ noobs。\n\n为了用操作系统设置树莓派，你需要获取你的 sd 卡并将其插入电脑。\n\n搜索 `sd formatter 4.0`。下载并安装它。（由于格式化与链接兼容性不好，所以我无法为你提供链接，遗憾。）它是由一个名为\
  \ sd association 的组织发布的，所以只要你是从他们的网站获取的，就应该是安全的。\n\n安装软件并启动 sd formatter 程序。选择你的\
  \ sd 卡磁盘驱动器，然后按照默认设置指示进行格式化，\n\n\n\n\n如果一切顺利，你现在应该可以将你的树莓派接入电源并开始一些高强度的开发了。如果你使用的是较新的树莓派型号，它应该内置了\
  \ wifi。然而，旧型号则需要你通过以太网连接互联网，或者插入与树莓派兼容的 wifi 适配器。\n\n当树莓派上的指示灯闪烁时，你就知道树莓派已启动。此时，你就能知道一切是否运行良好，因为指示灯会亮起，并且你的显示器上应该显示视频画面。\n\
  \n# 安装 Raspbian\n\n既然我们安装了 noobs，就可以继续安装 Raspbian 或你喜欢的其他操作系统。再次强调，本书将只讨论 Raspbian。尽管如此，安装操作系统的过程对于树莓派可以使用的所有其他操作系统来说都是相同的。\n\
  \n在操作系统启动后的主界面上，确保选中了 Raspbian。这是大多数社区推荐的操作系统，特别是对于树莓派的新手来说。\n\n点击 install（安装），然后点击\
  \ yes（是）确认覆盖你的 SD 卡。\n\n稍等片刻后，你的操作系统就会安装完成。正如我所说，这是一个非常直接的过程。\n\n你的树莓派将重启，并带你进入\
  \ Raspbian 操作系统的主界面。\n\n![Image00127.jpg](img/Image00127.jpeg)\n\n# 起始\n\n现在你已经进入\
  \ Raspbian 的主界面，是时候让奇迹发生了。这是你与树莓派冒险之旅的开始。可以随便点弄，看看它能提供什么。你从一开始就能看到，它内置了许多旨在帮助你学习各种技能的程序，这揭示了树莓派的初衷——旨在帮助弱势群体学习计算机科学以及通用的编程。\n\
  \n现在，你面对着你的操作系统。如果你以前从未用过 Linux 操作系统，你可能会有很多疑问。此外，即使你以前用过 Linux 操作系统，如果你主要一直使用 KDE\
  \ 发行版，那么这可能和你以前用过的完全不同。所以，让我们先回答一些问题。\n\n## 我在看什么？\n\n这个问题的答案很简单：Raspbian。Raspbian\
  \ 是 Linux 操作系统的一种发行版，你很可能以前听说过它。它是一个流行的 Linux 发行版 Debian 的分支。还有许多其他的 Linux 发行版，其中之一是\
  \ Ubuntu。Raspbian 的设计旨在完美匹配树莓派的硬件需求及其特定的 CPU 架构。\n\n### 什么是 Linux？\n\nLinux 本身是很久很久以前的另一个操作系统\
  \ Unix 的分支。Unix 因为各种原因而极其闻名，以至于单单关于它就可以写一本书（而且已经有很多了，写得非常好）。\n\nUnix 本身启发了人们每天使用的许多操作系统，包括\
  \ Linux（Linux 本身又启发了极其流行的 Android 移动操作系统）和 macOS（iOS 移动操作系统即源于此）。换句话说，如果你有一部手机或一台非\
  \ Windows 电脑，你已经在使用受 Unix 启发的计算机了。由于它在 80 年代的无处不在，加上诸如 Linux 和 FreeBSD 等操作系统非常契合黑客文化（在信息和软件自由方面，即既像言论一样自由，也像啤酒一样免费的自由），Unix\
  \ 在很长一段时间内一直是软件开发领域的王者。这段很长的一时期导致了今天：你正坐在一个陌生的操作系统面前，不知道不知道该做什么。\n\n![Image0128.jpg](img/Image0128.jpeg)\n\
  \n让我们仔细看一眼我们的操作系统。首先，Linux 系统最重要的部分是终端（terminal）。如果你用苹果设备，你可能已经在终端里弄过几次了。终端是 Unix\
  \ 使用最频繁的功能之一，因为它提供了一种获取包、管理系统以及进行更多操作的极其简单的方法。现在依然如此。理解系统意味着理解终端是如何工作的，以及你用它能做的所有不同事情。所以，如果你想了解\
  \ Linux 是如何工作的，请读读一本旨在教你终端如何运作的指南。\n\nLinux 的主要吸引力之一是它是完全免费的，而且这确实如此。你可以摆弄你的系统信息，并对计算机及其主板拥有完全的控制权。这就是为什么像我这样的许多极客喜欢\
  \ Raspbian 的原因：它既易于使用，又提供了 Linux 发行版所具备的所有控制功能。\n\n你会发现 Raspbian 内置了相当多的不同的东西。值得注意的是一个旨在帮助你解决代数相关问题的程序，名为\
  \ matmatica。你还会注意到里面包含了一个 Chromium 版本。这个浏览器和 Google Chrome 非常相似，它只是 Google Chrome\
  \ 的开源版本。不过，Chromium 标准版本与这个版本之间是有区别的；这个版本比其他版本轻得多，因此它在树莓派精密的架构上运行得好得多。你可以打开任何你想打开的标签！（别真的按你想打开的那么多标签，那样结果不会好的。）\n\
  \n最后一点值得注意的是，该操作系统带有一个版本的 Minecraft，被称为 Minecraft Pi。这和 Minecraft 非常像，只不过它旨在帮助孩子学习如何编程。不过，如果你去点弄并尝试一下，可能会觉得它挺有趣的。此外，这是一本大书，所以给自己留一点时间玩游戏并无妨。\n\
  \nLinux 是折腾者（tinkerers）的最佳选择。原因有很多。首先是由于它降低了折腾的整体成本，因为 Linux 的文化支持开源和免费软件的使用。这意味着你可以在获取软件上花费更少的钱，并花费更多时间使用你的软件。完全开放这一点也非常棒了，因为如果你的编程水平足够高，你可以破解源代码并按你的意愿进行修改。那里没有秘密，你清楚自己正在面对什么。此外，也许最大的吸引力在于作为\
  \ Linux 程序员，你有许多开源工具可供。\n\n\n\n从技术上来说，并没有所谓的“嵌入式 Linux”。当我们谈论嵌入式 Linux 时，我们将其作为一个统术语，用来指代运行\
  \ Linux 的嵌入式系统。嵌入式系统是指为单一、特定应用设计的计算硬件。相比之下，个人电脑有多种用途——浏览互联网、玩视频游戏或编写关于树莓派的电子书。然而，最近区分通用计算设备和嵌入式系统的界限变得模糊了。树莓派作为本书的主题，可以被归类为这两种者。这取决于你赋予它的用途。\n\
  \n明确的是，嵌入式系统仍然与通用计算机不同。它们拥有独有的特性，包括以下：\n\n*   它们的目的非常明确，并且通常专为此目的而设计。\n*   它们通常性能过剩。它们往往缺乏个人电脑通常拥有的强劲动力。\n\
  *   它们在大系统中运行，作为其他传感器和其他设备的枢纽。这与通常独立运行的 PC 形成对比。\n*   它们的角色通常非常重要，因此被分配了特定的任务。\n\
  *   它们能够实时处理事务。\n\n你可以通过在 raspbian 终端中疯狂操作来建立一个嵌入式 Linux 环境。这个设置是一个复杂的过程，并且假设你已经对技术方面略有所知。请随时自行研究。我们关于树莓派还有更多需要学习的内容。\n\
  \n# 第 3 章：如何使用树莓派\n\n你可以在树莓派上运行多种类型的软件，特别是在各种操作系统中——你可以通过它们运行你的电脑。在所有可用的操作系统，最流行的是\
  \ raspbian，它是树莓派基金会的官方操作系统。Raspbian 基于 debian linux，专为树莓派制作，配备了一系列预装的插件，将帮助你快速上手。\n\
  \n### 欢迎向导\n\n当你第一次运行 raspbian 时，你将遇到欢迎向导。这个工具将允许你配置 raspbian 的设置，以便树莓派的行为完全符合或接近于你的意愿。\n\
  \n**注意：** 如果你想关闭欢迎向导，只需点击向导底部的“取消”按钮即可。然而，我们建议不要这样做，因为某些某些功能（包括无线网络）在回答第一组问题之前将无法工作。\n\
  \n点击“下一步”按钮后，将出现一个语言、国家和时区的下拉框，你需要根据自己的地理位置进行点击。还有一个复选框允许你选择合适的键盘布局；例如，如果你使用的是美式布局（us-layout）的键盘，务必勾选\
  \ us-layout 选框。如果英语不是你的第一语言，但你仍然倾向于使用英语而不是母语，请点击“使用英语语言”复选框。完成后点击“下一步”。\n\n下一个屏幕是关于更改默认密码，密码是‘raspberry’——这完全出于安全考虑，创建一个新密码是一个好主意，这样黑客和机器人就无法轻易破解并访问你的账户等。在提供的空间内输入你的新密码。如果你使用的是复杂密码并想查看它的样子，点击“隐藏字符”旁边的按钮显示密码，并将其写在只有你可以访问的纸张或额外的记笔记本上。记住，为了安全起见，你必须输入密码。完成所有这些操作后，你可以点击“下一步”。\n\
  \n下一个屏幕将让你设置 wifi 网络。你可以从键盘或鼠标已列出的系列网络中选择。在点击“下一步”之前，点击你想要的网络名称。为了确保你的无线网络安全，你需要插入其预共享密钥（即密码）；这通常写在路由器底部或随附附的卡片上。当你点击“下一步”时，就可以连接到网络。如果你不想选择无线网络，可以点击“跳过”。\n\
  \n**注意：** 只有树莓派 3、pi 4 和 zero 系列具有内置无线网络功能。如果你在使用上述任何其他型号并需要网络功能，你需要购买一个 usb wifi\
  \ 适配器。\n\n在下一个屏幕中，你必须为 raspbian 操作系统以及你树莓派板上的任何其他软件安装更新。你可以点击“下一步”安装更新，或者如果你想以后安装，可以点击“跳过”。注意，下载和安装更新可能需要几分钟，请耐心等待。更新安装后，会出现一个显示“系统已最新”的对话框，之后你只需要点击“确定”按钮。\n\
  \n最后，欢迎向导的最后一个屏幕是一个通称为“重启”的简单过程，你需要重启树莓派以便某些更改生效。你只需要点击“重启”按钮，你的树莓派系统将重启，这一次欢迎向导将不再出现。话虽如此，是时候行动了。\n\
  \n### 使用桌面\n\n如今许多树莓派型号上安装的 raspbian 操作系统被称为“带有树莓派桌面的 raspbian”，这是系统的主要图形用户界面。桌面将配有一个背景纸，一些你将要使用的基础程序会出现在壁纸之上。你会在桌面顶部找到一个任务栏，它允许你加载任何想要打开的程序；任务栏中的任务代表这些程序。\n\
  \n菜单栏的右侧是系统托盘所在。如果树莓派连接了任何可移动的存储设备（如 usb 内存棒），你需要点击弹出符号来安全地弹出并移除它们。在最右侧，你会找到计时器，点击它可以调出一个数字日历。\n\
  \n计时器旁边是扬声器图标；使用鼠标左键点击图标可以调整系统音量，或者你可以点击鼠标右键选择你希望系统使用的输出设备。紧挨旁边的是网络图标；当你看到网络信号强度以一系列条显示时，你就知道自己连接到了无线网络，但如果你连接的是有线网络，则只会显示两个箭头。你可以点击网络图标列出附近的网络列表，旁边的蓝牙图标将允许你连接到附近的任何蓝牙设备。\n\
  \n\n\n\n\n在菜单栏的左侧，你会找到启动器，可以在这里运行安装在 Raspbian 操作系统上的所有程序。某些程序将以快捷图标的形式出现，而另一些隐藏在菜单某处的程序可以通过点击位于右侧的树莓图标来打开。\n\
  \n菜单中的每个程序都分为不同的类别，并根据其用途明确命名：例如，“编程”类别包含允许我们编写程序的软件——我们将在后面的章节中详细介绍——而“游戏”类别则允许你玩列出的任何游戏。请注意，本指南并没有涵盖所有的程序，因此非常欢迎你根据自己的意愿自行查看。\n\
  \n## Chromium\n\n开始使用树莓派板时，要做的第一件事是打开 `chromium` 浏览器：在菜单的左上角，你需要点击树莓图标。将鼠标光标移动到“Internet”类别，然后点击\
  \ `chromium` 网页浏览器即可打开它。\n\nChromium 并不难上手，那些在其他电脑上使用过谷歌 Chrome 浏览器的人会发现它的操作非常相似。像任何其他网络浏览器一样，chromium\
  \ 允许你打开并查看网站，使用社交媒体平台、聊天网站和表单与世界各地的人进行交流，以及玩游戏和观看视频。\n\n为了获得更好的体验，我们建议最大化 `chromium`\
  \ 浏览器的窗口：在 chromium 窗口标题栏的右上侧你会你会三个图标。你需要点击中间的向上箭头图标，这将窗口最大化以填充整个屏幕。最大化左侧的按钮是任务栏上的最小化按钮，点击它会隐藏窗口。最大化的右侧是关闭功能，它当然会关闭窗口。\n\
  \n注意：你必须在关闭窗口之前保存你的工作。虽然大多数程序在你点击关闭按钮时会弹出保存工作的警告，但其他程序并没有这个功能。\n\n位于 chromium 窗口左上角带有放大镜的大型白条是地址栏。点击地址栏，输入\
  \ `www.raspberrypi.org`，然后按下键盘上的回车键。树莓派官方网站将打开。你也可以通过直接在地址栏输入“raspbian”、“educational\
  \ computing”或“raspberry pi”来进行其他搜索。\n\n当你第一次加载 chromium 时，窗口顶部会显示几个标签页。如果你想查看另一个标签页，点击它；如果你想在不关闭浏览器本身的情况下关闭标签页，点击标签右边缘的交叉号。要打开新标签页，你可以点击标签最右侧的标签按钮，也可以按住键盘上的\
  \ `ctrl` 键并在松开 ctrl 之前按下 `t` 键。\n\n如果你想关闭浏览器，只需点击窗口右上角的关闭按钮即可。\n\n### 文件管理器\n\n\
  你保存的任何文件，无论是你编写的程序、创建的视频还是从网上下载的图像——都会直接进入你的主目录。要查看主目录，再次点击树莓图标弹出菜单，将鼠标悬停在“附件”（accessories）上，然后点击“文件管理器”加载它。\n\
  \n通过文件管理器，你可以浏览树莓派 microSD 卡或任何连接到板接口的可移动设备（如 USB 闪盘）中的各种文件夹（也称为目录）和文件。当你第一次打开它时，主目录会自动打开。在这里，你会发现许多文件夹（也称为目录）——与菜单类似——按类别组织。你会找到的主要目录包括：\n\
  \n- Documents（文档）：你创建的大部分文件（从故事等）都将保存在这里。\n- Desktop（桌面）：当你首次加载 raspbian 时，这将是你看到的文件夹；如果你如果你在这个文件夹中创建并保存文件，它将出现在你的桌面上，使其更容易查找。\n\
  - Magpi：此文件夹包含树莓派基金会官方杂志《Magpi》的电子版。\n- Downloads（下载）：使用 chromium 浏览器在网上下载的任何文件将自动保存到下载文件夹中。\n\
  - Pictures（图片）：此文件夹专门用于存储技术上称为图像文件的图片。\n- Music（音乐）：任何在树莓派板上放置或创建的音乐都将存储在此文件夹中。\n\
  - Videos（视频）：此文件夹留用于从外部存储设备上传或从 chromium 浏览器下载的任何视频。\n- Public（公共）：尽管其他树莓用户有自己的账户，你存储在此文件夹中的任何文件或文件夹对其他树莓用户可用。\n\
  \n你会发现文件管理器窗口被分为两个窗格：左窗格显示你的树莓派目录，而右窗格显示左侧窗格中所选目录的文件和目录。如果你将可移动存储设备插入板载的 USB 端口，会弹出一个对话框询问你是否想在文件管理器中打开它；通过点击确定按钮，你将能够查看该设备中的文件和目录。\n\
  \n你可以轻松地在树莓派的 microSD 卡和其上的可移动设备之间复制文件，甚至将它们从 microSD 卡传输到你的可移动设备。当你两个单独的文件管理器窗口中同时打开了可移动设备和主目录时，点击并按住鼠标左键选择想要移动的文件，将其滑动到另一个窗口，然后松开鼠标按钮。这个过程被称为拖放。\n\
  \n另一种方法是点击一次文件，选择“编辑”菜单，选择“复制”，点击另一个窗口，选择“编辑”菜单，然后点击“粘贴”。\n\n从编辑菜单找到“移动”选项在执行上类似，只不过它在被复制后会从原始位置删除文件。更快的方法是使用快捷键\
  \ `ctrl+c` 复制，或使用 `ctrl+x` 剪切并通过 `ctrl+v` 粘贴。\n\n注意：使用快捷键如 `ctrl+c` 复制文本、文件或文件夹；你需要先按住\
  \ `ctrl` 键，然后按下第二个键 `c` 最后再松开它们。\n\n完成操作后，点击窗口左上角的关闭按钮关闭文件管理器。如果有其他打开的窗口，你需要关闭所有窗口。如果树莓派板连接了可移动设备，你需要在拔掉它之前点击屏幕右上角的弹出按钮将其弹出。\n\
  \n注意：在拔掉外部存储设备之前务必点击弹出按钮。如果不这样做，存储设备中的文件可能会损坏或无法使用。\n\nLibreoffice，办公套件，\n\n\n\n\
  \n如果你想写文档、文章、诗歌或其他任何内容，LibreOffice Writer 就是你所需要的。如果你用过 Microsoft Office 或 Google\
  \ Docs，那么你已经对如何使用 LibreOffice 的文字处理器有了很好的了解。\n\n有一点需要，并不是每个 Raspbian OS 镜像都默认安装了\
  \ LibreOffice。如果情况确实是这样，你可以使用推荐的软件工具来安装它们。\n\n除了能够编写文档之外，此文字处理器还允许你以各种创意方式对其进行格式设置：你可以更改字体颜色、大小，插入图像、表格、图表，添加效果以及你选择的任何其他类型的内容。与其他文字处理程序一样，LibreOffice\
  \ Writer 会在你输入时检查你写的所有内容是否有错误，并分别用红色和绿色标出拼写和语法错误。\n\n如果你不知道写什么，我们建议你写一段关于你到为止学到的关于树莓派开发板以及其中安装的软件的所有内容。窗口顶部有几个图标，你可以尝试一下看看它们的作用：看看你是否可以增大字体大小以及更改颜色。如果你不确定如何操作，可以将鼠标光标悬停在每个图标上，查看“工具\
  \ tip”，它会让你知道图标的含义及其功能。如果你对写的内容满意，点击文件菜单，然后选择保存选项来保存你的所有工作。为你的文件命名，最后点击保存按钮。\n\n\
  **注意：** 你应该始终保持保存工作的的良好素养，因为你永远不知道何时会遇到停电、短路或其他任何干扰你在树莓派开发板工作的意外情况。\n\nLibreOffice\
  \ Writer 是你在 LibreOffice 办公套件中找到的许多程序之一。该套件中包含的其他办公软件包括：\n\n* `LibreOffice Calc`：用于创建图表、图形和处理数字的电子表格。\n\
  * `LibreOffice Base`：用于存储、快速查找和分析信息的数据库。\n* `LibreOffice Impress`：用于创建演示灯片以及播放幻灯片的工具。\n\
  * `LibreOffice Draw`：一个插图程序，你可以在其中创建图表和图片。\n* `LibreOffice Math`：用于创建格式适当的数学公式的工具，也可以用于其他文档。\n\
  \nLibreOffice 也适用于其他计算机和操作系统。如果你倾向于在 Pi 系统上使用它，可以访问 `libreoffice.org`，下载文件并将其安装在任何操作系统上，无论是\
  \ Linux、Apple Mac OS 还是 Microsoft Windows。\n\n如果你想了解更多关于如何使用 LibreOffice，请点击帮助菜单。如果你不再需要它，可以指向并点击窗口右上角的关闭按钮来关闭\
  \ LibreOffice Writer。\n\n**注意：** 许多程序都有帮助菜单，你可以通过它了解某个特定程序以及如何使用它。如果你在操作程序时遇到困难，这会非常有用。\n\
  \n### 推荐软件工具\n\n虽然你已经通过 Raspbian 操作系统可以使用了广泛的预装软件集合，但如果你喜欢，也可以获取更多软件。这就是推荐软件工具发挥用场的地方，因为它包含了你所找到的一些优秀的软件系列。\n\
  \n请注意，推荐软件工具需要连接互联网才能操作。一旦连接，点击树莓派菜单图标，将光标移动到“首选项”（preferences），然后点击“推荐软件”（recommended\
  \ software）。这将打开该工具并开始下载任何可用软件的信息。几秒钟后会出现一些兼容软件包的列表。像树莓派菜单一样，这些也被组织在几个类别中。点击左窗格中的任何类别来查看该类别下的软件，或者点击“全选”查看所有内容。如果你看到任何软件旁边有勾选标记，意味着它已经安装在你的操作系统上。如果框内没有勾选，使用左鼠标点击复选框，以便为安装做准备。你可以标记尽可能多想要准备安装的编号，但要确保你的\
  \ microSD 卡中有足够的空间存放这些程序；否则，你将限制安装。\n\n同样，你也可以通过这种方式卸载软件：寻找任何复选框中有勾选的软件并点击该框取消勾选。但如果你改变了主意或犯了错，可以回到上一个部分重新勾选。当你准备就绪后，点击\
  \ OK 按钮开始安装或卸载你选择的软件。在你下载并安装了区域内的任何软件后，会出现一个对话框；点击 OK 按钮退出推荐工具。\n\n“添加/删除软件”工具是另一个可以帮助你安装或卸载软件的工具。它位于\
  \ Raspbian 菜单中相同的“首选项”类别下。这里有大量的软件可用，但它们都没有经过树派派基金会的批准。\n\n### 树莓派配置工具\n\n你会发现它的功能与你最初使用的欢迎向导类似：你将更改\
  \ Raspbian 操作系统中的许多设置。首先，点击树莓派图标，将鼠标光标移动到“首选项”，并选择加载“树莓派配置”（Raspberry configuration）。\n\
  \n该工具分为四个标签页，每个标签页控制 Raspbian 的一部分。工具首次加载时你看到的第一个是“系统”（system）：你可以设置主机名——这是树莓派开发板在你的有线或无线网络上使用的名称——更改账户密码以及许多其他设置，尽管这些设置中的大多数不需要更改。\n\
  \n**注意：** 此概述旨在帮助你熟悉该工具以及如何使用它。\n\n将鼠标光标移动到“接口”（interfaces）标签页并用左鼠标点击它以调出下一个类别。你会看到许多被禁用的设置。只有当你向树莓派中引入新软件（包括树莓派摄像头模块）并且按照硬件制造商的指示时，你才能更改这些设置。这里唯一的例外包括\
  \ `vnc`，它启用“虚拟网络计算机”，允许你通过 vnc 客户端从网络上的另一台电脑查看并控制 Raspbian 桌面；`remote gpio`，你可以从网络上的另一台电脑使用树莓派的\
  \ gpio 引；以及 `ssh`，它启用“安全外壳”，允许你通过网络上的另一台电脑使用 ssh 客户端登录树莓派。\n\n\n\n\n当你点击 `performance`\
  \ 标签卡时，可以查看第三类别。在这里，你可以配置树莓派图形处理器（`gpu`）使用的内存量，并且根据某些型号，可以通过一种名为 `overclocking`（超频）的过程提高你开发板的性能。不过，除非你需要更改这些设置，否则保持原样更好。\n\
  \n最后，你可以通过点击 `localization` 标签卡查看最后一个类别。在这里，你可以设置区域语言（locale），其中你可以控制数字的显示方式、Raspbian\
  \ 使用的语言、更改键盘布局、更改时区，并为 Wi-Fi 功能设置国家。然而，到目前，你需要点击 `cancel` 按钮退出工具，而不进行任何进一步更改。\n\n\
  **警告：** 不同国家对 Wi-Fi 无线电使用的频率类型有不同的规定。例如，如果你在树莓派配置工具中将 Wi-Fi 国家设置为你当前所在地以外的国家，这会让你的设备产生困惑，并在连接网络时遇到困难。更糟糕的是，这在无线电许可法下可能是非法的。换句话说，不要这样做。\n\
  \n### 关机\n\n在探索了 Raspbian 桌面并熟悉了它之后，是时候学习如何安全地关闭树莓派了。和人们使用的任何计算机一样，树莓派将你的文件存储在易性内存中——这种内会在系统掉电后被清空。对于你创建的每一个文档，在输入时进行保存至关重要——你的文件将在这里传输到非易性内存中，即\
  \ microSD 卡——这样你就可以检索保存的文件并继续工作。\n\n但你正在处理的文档并不是唯一打开的文件。操作系统 Raspbian 在运行期间会打开几个文件，如果由于任何原因，在文件仍打开时将电源线从树莓派主板上拔掉，可能会导致整个操作系统损坏。你将不得不重新安装。\n\
  \n因此，为了防止这种情况的发生，你需要指示 Raspbian 保存你所有的文件和文档，并为关机时机做好准备——这个过程被称为关机。\n\n**警告：** 记住，在先关机之前不要从树莓派主板上拔掉电源线。如果你这样做，它会损坏\
  \ Raspbian，你可能会丢失创建或下载的任何文件。\n\n要关机，点击桌面左上角的树莓派图标并选择 `shutdown`。会弹出一个带有三个选项的对话框：`shutdown`（关机）、`logout`（注销）和\
  \ `reboot`（重启）。`shutdown` 是你最常用的选项，点击它将指示操作系统关闭所有打开的文件和软件，关闭整个系统。当你看到显示器变黑，距离树莓派上的绿色闪烁灯消失还有几秒钟时，就可以安全地关闭电源了。\n\
  \n如果你想重新开启树莓派，只需要断开然后重新连接电源线，或者切换墙上插座的电源开关。`remote`过程与关机类似，它会关闭你的每一个文件，但不是关机，而是重启你的树莓派——类似于你使用了\
  \ `shutdown` 选项并必须断开重新连接电源线。你对树莓派所做的某些更改需要重启才能生效——例如安装某些软件——或者软件崩溃导致你的操作系统处于不可用状态。\n\
  \n最后是 `logout` 功能，如果你的树莓派上有多个账户，这个功能非常有用：它会关闭你当前运行的任何程序，并立即显示登录界面，你可以使用用户名和密码访问另一个账户。如果你不小心按了注销，只需输入\
  \ `pi` 作为你的用户名即可回来。\n\n# 数据和变量\n\n我们将首先查看的是数学运算以及你如何执行这些运算。然而，为了理解这一点，你需要了解关于数据的一点点。Python\
  \ 以一种相对独特的方式理解数据，但所有编程语言都以这种方式理解数据是有原因的。数据是用于表示某些概念的任何单一信息。任何单独的数据单元被称为 `value`（值），值可以采取多种不同的形式。\n\
  \n然而，并不是所有的计算机都能真正理解这些不同形式；相反，计算机理解的是 0 和 1 的原始概念，即在计算机底层运行的二进制计算。在二进制代码之上有一层被称为\
  \ `assembly code`（汇编代码）的抽象层，它在代表单个值的位或不同二进制代码集上进行操作。在它之上是另一层被称为操作系统的抽象层。还有第三层抽象层，即正在使用的编程语言。它与操作系统配合，将我们能理解的东西转换为汇编语言，然后计算机的处理器将其转换为一组不同的计算。这一切都是在微秒甚至纳秒级内完成的。\n\
  \n这一切的关键点是，计算机是以 0 和 1 来理解事物的，而我们看到值的方式对计算机来说没有任何意义。为了解决这个问题，程序员们在很久以前就决定让计算机将不同的值分为不同的类型。这些数据类型告诉计算机如何以及以什么方式对给定的值执行操作，因为它们对应\
  \ 0 和 1。这是一个非常复杂的架构，所以如果它没有立即让你完全理解，不要觉得太抱歉。\n\n总之，为了正确理解这一切，我们必须稍微拆解这些数据类型，并用比现在更抽象的眼光来看它们，让我们这样做吧。我们将做的下一步是仔细查看在\
  \ Python 中使用的不同类型的数据。\n\n## 整数 (Integer)\n\n`integer` 数据类型指的是在我们的抽象理解中对应整数的数据单元。因此，这些将是如\
  \ `7`、`39` 或 `-3` 等数字。\n\n### 浮点数 (Float)\n\n`float` 数据类型指的是在我们的抽象理解中对应小数的数据单元，例如如\
  \ `3.141569` 或 `94.3332`。\n\n## 双精度浮点数 (Double)\n\nDouble 代表“双精度”数字，指的是一种非常特殊的数字。你现在不需要深入理解它，因为在\
  \ Python 中，`float` 和 `double` 的作用是非常等同的。这种区别可以追溯到计算机内存和处理能力远低于现在的时代，但对于我们的目的来说，你完全可以忽略这一点。\n\
  \n## 布尔值 (Boolean)\n\n\n\n\n\n# 布尔值（Boolean）代表 `true`（真）或 `false`（假）。等我们开始讨论程序逻辑以及逻辑在计算机科学中的实际作用时，这会有很多意义。\n\
  \n## 字符（Character）\n`character` 代表可以在控制台中打印的任何单个字母数字或符号字符。这些可以是像 `3` 或 `$` 之类的字符。不过这种理解是微妙的，因为字符与\
  \ `ascii value` 相关，这意味着任何给定的字符也都有一个数值整数值。因此，如果你有一个字符 `\"3\"` 和一个整数 `3` 并尝试判断它们是否相同，它们并不相同。在编程时请记住这一点。\n\
  \n## 字符串（String）\n我们稍后会深入讨论字符串，但字符串本质上是组合在一起的长字符链。任何字符值的集合都是字符串，无论长度是 2 个字符还是 2000\
  \ 个字符。\n\n然而，这些并不是 Python 中供你使用的所有值。但它们是你最可能立即用到的值，因此由于这个原因，我们专门在这里涵盖了它们。这些值可以在\
  \ Python 的任何表达式中表示。例如：\n\n```python\nPrint(3 + 3)\n# 将打印 6\n\nPrint(\"hey there!\\\
  n\")\n# 向控制台打印字符串，\n\nPrint('c')\n# 向控制台打印字符，\n```\n\n换句话说，这些构成了你在编程中将进行的所有操作的核心。你写的每一段代码都将与这些值打交道，并以某种方式对它们进行操作。随着你处理的代码越来越多，你会发现自己多么频繁地使用所有这些内容，并且程序中的每条语句都是以某种方式对数据进行操作。这就是编程的本质，无论好坏。\n\
  \n## 变量（Variables）\n有时，你想要记住这些数据片段，以便在以后某个点回想起它们或更改它们。为此你可以做什么呢？答案很简单，你可以使用变量。变量提供了一种方法，让你在运行程序时很长时间内跟踪值。\n\
  \n回想我们之前讨论过数据类型。数据类型在 Python 中特别有用且比其他语言更多样，因为 Python 尽力让事情变得简单；然而，所有这些值都存储在计算机内存中，并根据任何给定数据类型占用的空间存储在预分配大小的盒子中。\n\
  \n计算机内存中的这些单独盒子可以被称为变量。把它想象成某个城市的俯视图。你可能有一堆可以放置房屋的地块。然后你通过地址引用任何给定的地块。地块就像变量本身，而地址就是变量名。\n\
  \n因此，你实际上可以将所有这些值存储在变量中，由你决定用什么名称引用它。假设你有一个名字类似于 `dogage` 的变量。如果你的狗是 4 岁，那么你可以这样设置：\n\
  \n```python\nDogage = 4\n```\n\n如果你的狗的名字叫 lucky，那么你可以设置一个字符串变量，如下：\n\n```python\n\
  Dogname = \"lucky\"\n```\n\nPython 让命名和声明变量变得极其简单。某些语言在这一过程中会有很多障碍，但 Python 没有。这为什么这会是一件坏事呢？对于一个没有处理不同类型丰富经验的程序员来说，这可能会令人困惑，你可能会忘记并尝试对两个不同类型的数据片段进行比较，从而以相同的方式搞乱你的数据。这就是你实际上想要学习数据类型是什么的原因，它将帮助你意识到字符串\
  \ `\"34\"` 和整数 `34` 不是同一个，并且如果你不注意这一点，它可能会解释为什么你的比较在某一点可能会出错。\n\n当然，如果你实际上对数据进行操作，使用变量会有用得多——在这一节中，我们将探索你处理数据的不同方式。记住，你可以回溯变量。例如，如果你想打印保存在变量中的字符串，你可以这样做：\n\
  \n```python\nPrint(dogname)\n```\n\n或者，如果你野心勃勃，想同时打印你狗的名字和年龄，你可以这样做：\n\n```python\n\
  Print(\"my dog’s name is \" + dogname + \" and they are \" + dogage + \" years old.\"\
  )\n```\n\n但如果发生了变化呢？例如，如果你的狗老了一岁呢？你能做什么？你可能想要在你狗的年龄上加 1。但你如何做到这一点呢？你通过实际上给它分配一个新值来实现。你可以对变量重新赋值，并像最初设置和初始化它们那样对这些变量进行操作。这个过程在很大程度上是类似的。例如，假设我们想给变量\
  \ `dogage` 加 1。我们可以这样做：\n\n```python\nDogage = dogage + 1\n```\n\n变量 `dogage` 将取\
  \ `dogage` 的旧值 `4` 并在其基础上加 1，并将此设置为变量 `dogage` 的新值。理解吗？因此，如果你现在打印变量 `dogage`，它将打印数字\
  \ 5：\n\n```python\nPrint(dogage)\n```\n\n## Python 数学（Python Math）\nPython 有许多不同的运算符可以用于数学计算。Python\
  \ 的数学运算符如下：\n\n`C + d`\n这是加法运算符。它用于将一个数字加上另一个。\n\n`C - d`\n这是减法运算符。它用于从一个数字中减去另一个。\n\
  \n`C * d`\n这是乘法运算符。它用于将一个数字乘以另一个。\n\n`C / d`\n这是除法运算符。它用于将一个数字除以另一个。\n\n`C % d`\n\
  这是取模运算符。它用于计算 `c` 除以 `d` 的余数。例如，`7 % 3` 将得到 1，因为 7 除以 3 余数为 1。\n\n这些是你需要了解的 Python\
  \ 主要数学运算符。使用这些知识，你可以在 Python 中执行复杂的数学运算并产生一些非常酷的事情。但这只是开始！\n\n让我们注意一下，我们之前重新赋值的方法并不一定是最好的方法。也就是说，语句\
  \ `dogage = dogage + 1` 可以很容易地缩短，并使其更易于阅读和理解。Python 中有几种不同的赋值赋值运算符。它们如下：\n\n```python\n\
  C += d\n# 这仅仅意味着 c = c + d.\n\nC -= d\n# 这仅仅意味着 c = c - d.\n\nC *= d\n# 这意味着 c =\
  \ c * d.\n\nC /= d\n# 这意味着 c = c / d.\n\nC %= d\n# 这意味着 c = c % d.\n```\n\n注释\n\n\
  \n\n\n注释对于编程来说至关重要，除非你想在自己的代码中迷失。在与团队工作时，这一点尤为重要。注释是代码的一部分，从计算机的角度来看，它们完全没有任何作用。那么，为什么它们很重要呢？注释之所以，是因为你可以在代码中插入文本，而不会影响程序本身。你可以利用这些注释告诉你的同事不要碰代码的某部分，因为在你尝试修复代码的另一部分时，那里只是一个权宜之计。对于我们的目的来说，你可以将其作为自己的指南，这样你就知道代码的哪个部分负责什么以及是如何实现的。\n\
  \n## 格式化\n\n如果你曾经用其他语言编写过程序，那么你现在应该注意到，Python 在很多方面都非常不同。其中最不相同的之一就是 Python 处理格式的方式。许多流行语言对空格的态度是模糊的；分号分隔语句，如果你真的想做，甚至可以把整个程序放在同一行。在像\
  \ `c` 和 `java` 这样的语言中，甚至有人通过比赛来混淆代码，并尽可能使其漂亮，但是以牺牲可读性为代价的。另一方面，Python 非常重视空格。Python\
  \ 中的空白——即换行符、空格和制表符——向 Python 表明代码的层次结构。这是 Python 真正开始理解你代码的主要引擎，因此你需要密切关注你的空格。确保你的缩进和我的一一样，并注意缩进实际上如何影响代码的流程，以及代码的整体运行方式。\n\
  \n## 用户输入和类型转换\n\n在这里，我们将花几分钟时间讨论获取用户输入。在很多时候，你需要从用户那里获取信息。例如，你可能会要求用户提供文件名或程序所需的某些数据。如果你正在编写类似库或记账程序，这甚至可能是像书名这样无害的内容。无论如何，程序的繁荣不仅是因为它们的存在，更是在于它们与用户交互以及让事情发生的能力。\n\
  \n正因如此，你必须理解 Python 中的用户输入是如何工作的。它相对简单。\n\nPython 中的所有用户输入——至少使用控制台——都是通过 `input`\
  \ 方法处理的。`input` 方法允许你从控制台获取信息。它会读取直到按下回车键的所有内容，并将这些信息作为字符串返回。\n\n`input` 方法的工作方式如下：\n\
  \n```\nInput(\"prompt text\")\n```\n\n你可以将 `prompt text` 设置为任何想要的内容，或者完全省略它。所有 `prompt\
  \ text` 仅表示，作为参数传递给 `input` 方法的文本将显示给相关用户。\n\n你可以将 `input` 方法赋值给变量，这会将用户输入的任何内容都设置为该变量的值。例如，如果我的文本如下：\n\
  \n```python\nFood = input(\"what is the last thing you ate?\")\n```\n\n如果用户输入了 nachos，那么\
  \ `food` 的值就是 `nachos`。因此，如果我们打印变量 `food`，它将打印为 nachos：\n\n```python\nPrint(food)\n\
  # would print as nachos\n```\n\n但是，有时这并不是终点。假设你正在写一个计算器程序，你需要接受用户输入的数字。当然，`input`\
  \ 方法返回的是字符串。从我们之前讨论过数据类型如何工作，你知道字符串并不是我们目前需要的数据类型；不，我们需要一个 `float`（浮点数）值或 `integer`（整数）值。那么，我们如何将用户输入的任何内容转换为这些值之一呢？\n\
  \n你可以通过类型转换（casting）来实现。类型转换简单是将一种数据类型转换为另一种数据类型。在 Python 中，变量可以持有任何数据类型，所以你实际上只需要将转换后的数据类型设置为旧变量的新值，但你并不想仅仅为了保持代码整洁和成为一名优秀的程序员而这样做。（注：原文此处有重复错误，我将在保留类型转换概念的同时清理逻辑）。\n\
  \n*类型转换修正：*简单地将转换后的数据类型设置为旧变量的新值。\n\n## 格式化\n\n如果你曾经用其他语言编写过程序，那么你现在应该注意到 Python\
  \ 在很多方面都非常不同。其中最不相同的之一就是 Python 处理格式的方式。许多流行语言对空格的态度是模糊的；分号分隔语句，如果你真的想做，甚至可以把整个程序放在同一行。在像\
  \ `c` 和 `java` 这样的语言中，甚至有人通过比赛来混淆代码，并尽可能使其漂亮，但是以牺牲可读性为代价的。另一方面，Python 非常重视空格。Python\
