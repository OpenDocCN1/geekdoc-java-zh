  \n然后通过名称和位置配置你的新项目，保存，并点击 `create` 按钮。一切就绪，Visual Studio 将立即为你创建一个新项目。\n\n另一种创建项目的方法是选择\
  \ `File` 菜单，然后我们点击下图所示的 `new project` 选项；通过这种我们可以看到一个显示某些相关选项的对话框。\n\n![Image00096.jpg](img/Image00096.jpeg)\n\
  \n在对话框的右侧，列出了我们可以创建的不同类型的项目；对于本示例，我们必须选择由 `Console Application` 指定的项并点击 `next` 按钮。\n\
  \n**注意：** 如果由于某种原因，我们关闭了源代码编辑器或它没有出现在我们的用户界面中，找到它最简单的方法是通过 `Solution Explorer`（解决方案管理器）。只需转到代表源代码的文档并双击它；源代码编辑器的窗口就会出现。\n\
  \n![Image00097.jpg](img/Image00097.jpeg)\n\n在左侧，我们将编写项目的名称，在这种情况下为 `myproject`。我们创建的每个新项目都有自己的名称；然后我们只需按下\
  \ `create` 按钮。\n\n![Image00098.jpg](img/Image00098.jpeg)\n\n几秒钟后，C# express 会为我们创建项目。Visual\
  \ Studio 和社区版使用解决方案和项目。一个解决方案可以包含多个项目，例如，Office 拥有 Word、Excel 和 PowerPoint 等不同产品。Office\
  \ 是一个解决方案，每个产品都是一个项目。项目可以是独立程序或库，可以包含一个或多个文档，这些文档可以是源代码和附加资源。\n\n![Image00099.jpg](img/Image00099.jpeg)\n\
  \n我们可以看到用户界面发生了一点变化；窗口已经向我们显示信息，我们还可以看到编辑区域显示了我们程序的骨架。\n\n![Image00100.jpg](img/Image00100.jpeg)\n\
  \n`Solution Explorer` 以逻辑方式向我们展示有关解决方案的信息；如果观察的话，它像一棵小树。在根部，我们找到解决方案；解决方案中的每个项目都将是一个分支；每个项目反过来也有自己的划分。在我们的案例中，我们看到了三个元素：其中两个元素是文件夹；在其中一个，我们保留了项目的属性，在另一个中是引用（在书中我们将使用这些文件夹）。第四个元素是一个名为\
  \ `program.cs` 的文档；它代表我们保存应用程序源代码的文档。我们看到 C# 程序的扩展名是 `.cs`。\n\n在编辑区域中，我们可以看到有一个骨架，从那里我们可以创建程序。要理解我们拥有什么，需要了解一个概念：命名空间（namespace）。命名空间是一种逻辑分组；例如，所有与数学相关的代码都可以组在命名空间内。命名空间的另一个用途是解决名称冲突；例如，假设我们有一个巨大的项目，几个程序在上面工作。两个或多个程序可能创建了同名的方法；这会产生冲突，因为程序不知道使用哪一个。解决此问题是每个程序都有自己的命名空间，并根据我们想要使用的版本进行引用。.NET\
  \ framework 为我们提供了各种命名空间，其中已经创建了数千个类和方法供我们使用。当我们想要使用其他程序或我们自己在命名空间中找到资源时，我们必须使用名为\
  \ `using` 的 C# 命令。\n\n正如我们在代码顶部看到的，我们对应用程序所需的命名空间有多个引用；如果我们需要添加更多命名空间，将在该部分进行。以下是定义我们项目的正确命名空间；操作如下：\n\
  \n```csharp\nnamespace myproject\n{\n\n}\n```\n\n我们正在创建的命名空间称为 `myproject`。正如我们看到的，命名空间使用\
  \ `{}` 作为分隔符；这被称为代码块，放置在 `{}` 之间的一切都属于该命名空间。在这里将需要编写与应用程序相应的代码。\n\n在代码块内部，我们找到了类的声明。C#\
  \ 是一种面向对象的语言，这就是为什么它需要我们为应用程序声明一个类。类有自己的代码块，在我们的应用程序中它将被称为 program。类的概念将在本书的第 10\
  \ 章介绍。所有程序都需要一个起点，一个指示程序执行从何开始的地方。在 C# 中，与其他语言一样，起点是 `main()` 函数；该函数也有自己的代码块。在这个函数内部，我们通常会放置应用程序的主代码，尽管可能有更多的函数或方法以及类。函数的各个和特征将在本书的第\
  \ 5 章介绍。\n\n现在是创建我们的第一个应用程序了。我们将如下所示修改函数代码。当我们在 `main()` 内部添加语句时，必须注意它发生在点号放置之后立即。\n\
  \n### 编译应用程序\n\n一旦我们完成了程序的编写，就可以像之前学的那样进行编译；这将生成运行时执行时使用的程序集。\n\n要编译应用程序，我们必须选择\
  \ `Build` 菜单然后 `Build Solution` 或简单的按下 `F6` 按钮。编译器将开始工作，在状态栏中，我们将看到解决方案已成功编译。\n\n\
  ### 运行应用程序\n\n一旦编译成功，我们就可以运行程序并查看它是如何运行的。为此，我们有两个选项：带调试运行和不带调试执行。在快速版中，只显示带调试的执行，但我们可以使用按键\
  \ `Ctrl+F5` 不带调试执行，或通过 `Tools` 菜单添加。\n\n调试器是一个帮助我们纠正运行时错误以及逻辑错误的程序。我们最好使用不带调试的执行，仅在需要时才使用带调试的执行。现在我们将运行应用程序；为此，我们按下\
  \ `Ctrl + F5` 键。\n\n当程序执行时，会弹出一个窗口，我们称之为控制台，它显示程序的执行情况。通过这种方式，我们可以读取我们在示例中放置的消息。\n\
  \n\n\n\n\n由于这是一本 C# 编程的入门书籍，我们将在控制台中运行所有程序。一旦你理解了核心概念，就可以学习如何用 C# 编写形状、形式和图形界面。这种编程并不困难，但它需要对象对象编程的基础知识。\n\
  \n### 如何检测程序中的错误\n\n有时我们可能会写错程序；当发生时，应用程序将无法编译或执行；如果发生这种情况，我们必须更改错误的地方。\n\n让我们故意写一个错误，以便我们观察编译器的行为。\n\
  \n在程序中，我们将 `console` 更改为 `consoli` 并重新排列了 `namespace` 和 `helloworld` 的顺序；这将导致错误；现在，我们可以尝试再次编译并看看发生了什么。\n\
  \n![Image00101.jpg](img/Image00101.jpeg)\n\n正如我们所知道的，用户界面底部出现的窗口是编译器用于通信的；我们看到出现了一个列出错误列表的窗口。在下一本书中，我们将学习如何使用它；现在，我们只需要知道，解决列表中的第一个问题是必要的，而且我们可以通过双击它直接跳转到错误处。\n\
  \n### 类视图\n\n现在我们要检查类视图。在此视图中，我们可以获取有关正在创建解决方案的信息，但与解决方案资源管理器不同，这些信息按逻辑排列的。\n\n\
  通过此视图，我们可以快速找到解决方案的命名空间，以及它们包含的类；如果我们愿意，还可以查看每个类中的方法。此视图不仅让我们能够观察逻辑信息，还让我们具备在代码中快速导航的可能性。\n\
  \n在社区版中，没有预先配置的选项，因此有必要向视图（View）菜单添加命令。\n\n要显示类视图，我们必须进入视图（View）菜单，然后选择类视图（Class\
  \ View），或者只需按下 `ctrl + w`，用户界面中就会出现一个窗口。\n\n![Image00102.jpg](img/Image00102.jpeg)\n\
  \n类视图窗口分为两个部分；上部分显示元素的逻辑和层次关系，而下部分显示组成特定类的方法。\n\n![Image00103.jpg](img/Image00103.jpeg)\n\
  \n在树的根节点，我们找到了项目；它将包含必要的引用和 `helloworld` 的命名空间。如果有更多命名空间，它们会在打开 `helloworld` 命名空间时出现在那里；在其中我们可以找到未声明的类。在这种情况下，我们只有一个\
  \ `program` 类；如果我们选择它，将看到底部显示在内部声明的元素。在我们的示例中，我们有 `main()` 方法。\n\n如果此时我们双击任何方法，我们将自动跳转到定义它的代码处。由于我们的程序非常小，我们可能看不到这种做法的优势，但在具有数千行代码的程序中，能够快速导航是一个巨大的优势。\n\
  \n### 配置编译器菜单\n\n为了在菜单中添加所需的选项，我们必须遵循一系列非常简单的步骤。首先，进入工具（Tools）菜单并选择自定义（Customize）选项。\n\
  \n弹出一个对话框，在其中我们必须选择命令；在此部分，我们可以选择想要向其添加命令的菜单，例如视图（View）菜单。\n\n![Image00104.jpg](img/Image00104.jpeg)\n\
  \n列出了当前的菜单命令，我们点击想要插入新命令的区域，并按下添加（Add）命令按钮。这将弹出一个新的对话框，显示了分类后我们可以添加的所有可能的命令。\n\n\
  在类别中我们选择视图（View），在类视图（Class View）命令中，该命令就是让我们拥有类视图的命令。无调试启动（Start Without debugging）命令位于调试（Debug）类别中。\n\
  \n![Image00105.jpg](img/Image00105.jpeg)\n\n到此为止，我们分析了最重要的基本概念，从下一章开始，我们将开始学习 C#。\n\
  \n### C# 的主要功能\n\nC# 是一种新的面向对象的语言，它使程序员能够在 Microsoft 上编写各种应用程序。Microsoft 提供了一系列工具来最大化利用\
  \ C#，这 是一种高级语言。C# 的功能主要为以下内容设计：\n\n- Windows 设计\n- 控制台设计\n- 移动设计\n- Web 设计\n- 服务设计\n\
  - Windows 控制\n\nC# 是一种强大的语言，具有以下特征，是 Web 开发的理想选择。\n\n### C# 的主要特性\n\nC# 语言几乎结合了当前高级语言的优点，并具有：\n\
  \n### 简洁的语法\n\nC# 语言像 Java 一样使用统一的运算符来消除复杂的表达式并使其形式简单。\n\n### 面向对象的设计\n\nC# 语言根据面向对象的思想设计，因此它具有封装、继承和多态。C#\
  \ 只允许单继承，这意味着一个类没有多个基类。在 C# 中没有全局函数或全局变量。所有常量、属性、方法和事件必须封装在类中，这使得代码更具可读性。\n\n###\
  \ 与 Web 的深度集成\n\n在 C# 中，复杂的 Web 编程和其他网络编程更像操作对象，从而简化了大规模和分布式开发。内置的 C# 组件可以方便地为 Web\
  \ 服务，并被运行在任何系统上的任何语言调用。\n\n### 完善的安全错误处理\n\n语言的安全错误处理能力是衡量一种语言的重要基础。C# 可以消除软件开发中的许多常见错误，并提供完整的安全性能。\n\
  \n默认情况下，从互联网和内部网下载的代码不允许访问任何本地文件和资源。C# 不允许未初始化的变量，并提供了如方便检查和溢出检查等功能。\n\n\n\n\n\n\
  ### 版本处理技术\n\nC# 语言内置了版本控制功能，例如处理函数重载和执行以及特性支持等，以确保复杂软件的便利开发和升级。\n\n### 灵活性与兼容性\n\
  \n在托管状态下，C# 语言不能使用指针，而是使用 `delegate` 来模拟指针的功能。如果你需要在 `classes` 或类的方法中使用指针，只需要将这些内容声明为\
  \ `unsafe` 即可。此外，尽管 C# 语言不支持 `classes` 的多继承，但可以通过继承 `interfaces`来实现。\n\n兼容性意味着 C#\
  \ 语言允许与 C/C++ 语言风格的 api 集成（这需要传递指针类型参数），并允许 C# 语言组件与其他语言组件进行集成。\n\n## 业务流程与软件实现之间更好的对应关系\n\
  \n如果一个企业的业务计划要付诸实践，必须在抽象的业务流程与具体的软件实现之间建立紧密的对应关系。这在大多数语言中很难做到。\n\nC# 语言允许类型定义的扩展元数据。这些元数据可以应用于任何对象。项目构建者定义领域特定的属性并将其应用于任何语言元素，例如\
  \ `classes` 和 `interfaces`。\n\n简而言之，C# 是一种现代面向对象的语言，它使程序员能够基于 microsoft .net 平台快速方便地创建解决方案。该框架使得\
  \ C# 组件能够轻松转换为 xml 网络服务，以便任何平台调用。这提高了 C# 组件的效率。同时，它致力于消除可能导致严重错误的编程，让 c/c++ 程序员在保持所需灵活性的同时能够快速开发。\n\
  \n通过此，我们对 C# 的重要性和应用进行了简要介绍。在书的下一章中，我们将讨论用于开发环境的数据类型以了解更多信息。\n\n## 第 2 章：数据类型\n\n\
  ### 数据类型\n\n在 C 编程语言中，数据类型指的是用于声明变量或函数的类型。变量类型决定了它将占据的空间大小以及在系统中如何存储。数据类型的基本分类如下：\n\
  \n*   基础类型：它们包括以下类型：(a) 整数类型和 b) 浮点类型。\n*   枚举类型：它们再次用于表示离散数值。\n*   void 类型：关键字\
  \ `void` 表示没有可以赋值的值。\n*   派生类型：它们包括 (a) 数组、(b) 指针、(c) 联合体、(d) 结构体和 (e) 函数。\n\n数组和结构数据类型也被称为聚合类型。类型定义了函数返回的值。我们将讨论后续的数据类型。\n\
  \n### 整数类型\n\n以下是属于该类别的数据类型列表。此外，它们占据的空间及其范围也已指定：\n\n*   `char`：分配 1 字节，范围为 -128\
  \ 到 127\n*   `signed char`：分配 1 字节，范围为 -128 到 127\n*   `unsigned char`：分配 1 字节，范围为\
  \ 0 到 255\n*   `int`：分配 2 或 4 字节，范围为 -32768 到 2147483647\n*   `short`：分配 2 字节，范围为\
  \ -32768 到 32767\n*   `unsigned short`：分配 2 字节，范围为 0 到 65535\n*   `unsigned int`：分配\
  \ 2 或 4 字节，范围为 0 到 65535 或 4294967295\n*   `long`：分配 4 字节，范围为 -2147483648 到 2147483647\n\
  *   `unsigned long`：分配 4 字节，范围为 0 到 4294967295\n\n要获取变量或数据类型的精确大小，可以使用 `sizeof`\
  \ 运算符。`sizeof(<data type>)` 产生数据类型或变量的字节数。下面是一个说明该概念的示例：\n\n```c\n#include <limits.h>\n\
  #include <stdio.h>\nint main() {\n    printf(\"data type char (size in bytes): %d\
  \ \\n\", sizeof(char));\n    return 0;\n}\n```\n\n编译并执行此代码，你将得到以下输出：data type char（字节）：1\n\
  \n### 浮点数据类型\n\n以下是属于该类别的数据类型列表。此外，它们占据的空间、范围和精度值也已指定：\n\n*   `float`：分配 4 字节，范围为\
  \ 1.2e-38 到 3.4e+38，精度为 6 位小数\n*   `double`：分配 8 字节，范围为 2.3e-308 到 1.7e+308，精度为\
  \ 15 位小数\n*   `long double`：分配 10 字节，范围为 3.4e-4932 到 1.1e+4932，精度为 19 位小数\n\n名为\
  \ `float.h` 的头文件定义了宏，允许你使用这些数据类型的值。以下代码允许你找到系统中相关数据类型分配的精确字节数：\n\n```c\n#include\
  \ <float.h>\n#include <stdio.h>\nint main(){\n    printf(\"allocated memory for\
  \ float : %d \\n\", sizeof(float));\n    printf(\"precision: %d\\n\", flt_dig);\n\
  \    printf(\"max range value,: %e\\n\", flt_max);\n    printf(\"min range value,:\
  \ %e\\n\", flt_min);\n    return 0;\n}\n```\n\n编译并执行此代码，你将得到以下输出：float 的分配内存: 4，精度:\
  \ 6，最大范围值: 3.402823e+38，最小范围值: 1.175494e-38\n\n### void 类型\n\nvoid 数据类型表示没有可访问的值。它被用于以下三种情况：\n\
  \n*   函数返回 `void`：你可能经常注意到将数据类型 `void` 作为函数的返回类型。如果没有，随着你 C 经验的增加，你会看到大量使用。`void`\
  \ 数据类型表示函数不会返回任何内容。这种实现的示例是：\n```c\nvoid print(int)\n```\n*   作为 void 的函数参数：C 语言中有不同的函数，它们不接受任何参数。没有参数的函数可以识别为\
  \ `void`。这种实现的示例是：\n```c\nint print(void)\n```\n*   void 指针：类型 `void *` 的指针表示变量的位置。例如，考虑以下声明：`void\
  \ *malloc(size_t size);` 该函数返回一个 void 指针。换句话说，该函数可以返回任何类型的内存指针。\n\n\n\n\n\n变量简单就是分配给存储区域的名称。我们的程序能够操作此类存储区域。每个\
  \ `C#` 变量都与一个类型相关，该类型决定了在内存中为该变量分配的空间。这也决定了适用于变量的操作类型。例如，你不能对字符串变量进行乘法运算。\n\n在 `C#`\
  \ 中，变量声明应使用以下语法：\n\n`<data_type> <variable_list>;`\n\n上述语法中的 `data_type` 必须是 C#\
  \ 中的有效类型，如 `int`、`string`、`float` 等。`variable_list` 可以是多个用逗号分隔的变量名。\n\n以下是有效变量声明的示例：\n\
  \n`int a, b, c; char c, d; float x, salary; double y;`\n\n变量可以在声明时进行初始化。\n\n例如：`int\
  \ x = 40;`\n\n### 变量初始化\n变量初始化是指给变量赋值的过程。在 `C#` 中，这是通过使用等号后跟常量表达式来实现的。这里是初始化的通用语法：`variable_name\
  \ = value;`；正如我们之前提到的，变量可以在声明时进行初始化。这里有更多示例：\n\n`int x = 1, y = 6; /* 初始化 x 和 y.\
  \ */`\n`byte f = 22; /* 初始化 f. */`\n`double pi = 3.14159; /* 声明 pi 的近似值. */`\n`char\
  \ a = 'a'; /* 变量 a 的值为 'a'. */`\n\n变量初始化应该正确；否则程序可能会产生意外的结果。\n\n例如：\n```csharp\n\
  using System;\nnamespace variableDeclaration {\nclass myprogram {\n    static void\
  \ main(string[] args) {\n        short x; int y; double z; /* 变量实际初始化 */\n     \
  \   x = 5; y = 10; z = x + y;\n        Console.WriteLine(\"x = {0}, y = {1}, z =\
  \ {2}\", x, y, z);\n        Console.ReadLine();\n    }\n}\n}\n```\n\n代码返回以下输出：\n\
  X=5, y=10, z=15\n\n### 获取用户输入\n`System` 命名空间下的 `Console` 类有一个名为 `ReadLine()` 的方法，允许我们从用户那里获取输入。用户的输入被读取并存储在变量中。下面的示例演示了如何使用该方法：\n\
  \n```csharp\nusing System;\nnamespace userinputapp {\nclass myprogram {\n    static\
  \ void main(string[] args) {\n        string firstname = \"nicholas\"; string lastname\
  \ = \"samuel\";\n        Console.WriteLine(\"your name is: \" + firstname + \" \"\
  \ + lastname);\n        Console.WriteLine(\"please enter a different first name:\"\
  );\n        firstname = Console.ReadLine();\n        Console.WriteLine(\"your new\
  \ name is: \" + firstname + \" \" + lastname);\n        Console.ReadLine();\n  \
  \  }\n}\n}\n```\n\n提示输入新的名字时，输入并按回车键。你会发现你的名字已经改变。\n\n### 运算符\n运算符是指令编译器执行特定逻辑或数学操作的符号。`C#`\
  \ 拥有多种运算符。让我们讨论一下它们。\n\n### 算术运算符\n这些用于执行各种数学运算。它们可以像下面的示例所示使用：\n\n```csharp\nusing\
  \ System;\nnamespace arithmeticoperatorsapp {\nclass myprogram {\n    static void\
  \ main(string[] args) {\n        int x = 31; int y = 10; int z;\n        z = x +\
  \ y;\n        Console.WriteLine(\"1: z equals to {0}\", z);\n        z = x - y;\n\
  \        Console.WriteLine(\"2: z equals to {0}\", z);\n        z = x * y;\n   \
  \     Console.WriteLine(\"3: z equals to {0}\", z);\n        z = x / y;\n      \
  \  Console.WriteLine(\"4: z equals to {0}\", z);\n        z = x % y;\n        Console.WriteLine(\"\
  5: z equals to {0}\", z);\n        z = x++;\n        Console.WriteLine(\"6: z equals\
  \ to {0}\", z);\n        z = x--;\n        Console.WriteLine(\"7: z equals to {0}\"\
  , z);\n        Console.ReadLine();\n    }\n}\n}\n```\n\n上述大多数运算符都是为人知的，除了其中少数几个。`++`\
  \ 是递增运算符，每次执行后变量的值加 1。`--` 是递减运算符，每次执行后变量的值减 1。`%` 被称为取运算运算符，返回除法后的余数。代码返回输出：\n\n\
  ### 逻辑运算符\n`C#` 还有许多逻辑运算符。让我们简要讨论一下：\n- `&&`：如果两个操作数都为真，则条件为真。\n- `||`：如果任一操作数为真，则条件为真。\n\
  - `!`：该运算符反转状态。如果条件为真，此运算符将使其变为假。\n\n下面的示例演示了如何使用上述运算符：\n\n```csharp\nusing System;\n\
  namespace logicaloperators {\nclass myprogram {\n    static void main(string[] args)\
  \ {\n        bool x = true; bool y = true;\n        if (x && y) {\n            Console.WriteLine(\"\
  1: the condition is true\");\n        }\n        if (x || y) {\n            Console.WriteLine(\"\
  2: the condition is true\");\n        }\n        /* 改变 x 和 y 的值 */\n        x =\
  \ false; y = true;\n        if (x && y) {\n            Console.WriteLine(\"3: the\
  \ condition is true\");\n        } else {\n            Console.WriteLine(\"3: the\
  \ condition is not true\");\n        }\n        if (!(x && y)) {\n            Console.WriteLine(\"\
  4: the condition is true\");\n        }\n        Console.ReadLine();\n    }\n}\n\
  }\n```\n\n### 赋值运算符\n`C#` 赋值运算符可以如下示例所示：\n\n```csharp\nclass myprogram {\n    static\
  \ void main(string[] args) {\n        int x = 31; int z;\n        z = x;\n     \
  \   Console.WriteLine(\"1: = value of z is {0}\", z);\n        z += x;\n       \
  \ Console.WriteLine(\"2: += the value of z is {0}\", z);\n        z -= x;\n    \
  \    Console.WriteLine(\"3: -= the value of z is {0}\", z);\n        z *= x;\n \
  \       Console.WriteLine(\"4: *= the value of z is {0}\", z);\n        z /= x;\n\
  \        Console.WriteLine(\"5: /= the value of z is {0}\", z);\n        z = 100;\n\
  \        z %= x;\n        Console.WriteLine(\"6: %= the value of z is {0}\", z);\n\
  \        z <<= 2;\n        Console.WriteLine(\"7: <<= the value of z is {0}\", z);\n\
  \        z >>= 2;\n        Console.WriteLine(\"8: >>= the value of z is {0}\", z);\n\
  \        z &= 2;\n        Console.WriteLine(\"9: &= the value of z is {0}\", z);\n\
  \        z ^= 2;\n        Console.WriteLine(\"10: ^= the value of z is {0}\", z);\n\
  \        z |= 2;\n        Console.WriteLine(\"11: |= the value of z is {0}\", z);\n\
  \        Console.ReadLine();\n    }\n}\n```\n\n## 第 4 章：string 和 list\n\n### List\n\
  `List<t>` 是所有集合类中最频繁使用的集合类。它是一个可以通过索引访问元素的类型。正如之前所说的，`list` 类属于 `System.Collections.Generic`\
  \ 命名空间。`list` 类提供了许多用于列表和元素操作的方法。其中一些包括搜索、排序等。它被用于创建许多不同类型的集合。它可以是整数、字符串等更多类型的集合。对于引用类型，`list`\
  \ 允许空值作为元素。也可以在任何列表集合中插入重复值。数组与列表相似，但列表可以动态调整大小，而数组不能。\n\nString\n\n\n\n\n\n`c#`\
  \ 中的 `String` 数据类型是一种表示文本并与文本变量一起工作的类型。它是一个字符数组。通过 `string` 关键字来声明字符串数据类型。当使用 `string`\
  \ 关键字时，意味着它引用了 `System.String` 类。有很多扩展方法可以用于某些字符串变量上。其中最流行的包括 `concat` - 用于拼接两个字符串，`contains`\
  \ - 用于判断字符串是否包含作为参数传入的给定字符串，`equals` - 用于判断两个字符串是否具有相同的值等。默认的字符串数据类型是空字符串。\n\n##\
  \ 第 5 章：语法\n\n### 循环结构语句\n\n在现实生活中，我们经常多次重复做同一件事。例如，当你在进行眼部操的第四轮并揉眼睛时，你会重复揉眼睛的动作。在打乒乓球时，你会重复挥拍动作等等。在\
  \ `c#` 中，有一种语句可以重复执行相同的代码块，这被称为循环语句（circular statement）。循环语句分为三种：`while` 循环语句、`do...while`\
  \ 循环语句和 `for` 循环语句。\n\n### While 循环语句\n\n`while` 循环语句与上节提到的条件判断语句有些相似，它根据条件判断来决定是否执行\
  \ `{}` 中的执行语句。区别在于，`while` 语句会反复判断条件。只要条件为真，`{}` 中的语句就会一直执行，直到条件不再为真，`while` 循环结束。\n\
  \n`while` 循环语句的语法结构如下：\n\n```\nWhile (cyclic condition)\n{\n    Execute statement\n\
  \    ...\n}\n```\n\n在上述语法结构中，`{}` 中的执行语句被称为循环体，循环体是否执行取决于循环条件。当循环条件为真时，执行循环体。当循环体执行完毕后，它将继续判断循环条件。如果条件仍然为真，它将继续执行，直到循环条件为假，整个循环过程才会结束。\n\
  \n接下来，用一个案例打印从 1 到 4 的自然数，如下例所示。\n\n**program11.cs**\n\n```csharp\nPublic class\
  \ program11\n{\n    Public static void //这里需要你输入逻辑\n    {\n        Int firstsample\
  \ = 1;//定义变量 ‘firstsample,’，初始值为 1\n        While (firstsample <= 4) //循环条件\n  \
  \      {\n            Console.WriteLine(\"firstsample = \" + firstsample);\n   \
  \         //如果条件成立，则打印 firstsample 的值。\n            Firstsample++; //firstsample\
  \ 自增\n        }\n        Console.ReadKey();\n    }\n}\n```\n\n运行结果显示在计算机屏幕上。例如，`x`\
  \ 的初始值为 1，如果满足循环条件 `x <= 4`，循环将反复执行，打印 `x` 的值，并且 `x` 会自动增加。因此，打印结果中 `x` 的值分别为 1、2、3\
  \ 和 4。值得注意的是，示例中第 9 行的代码用于在每次循环中改变 `x` 的值，以实现改变循环条件。如果没有这一行，整个循环将进入死循环。\n\n### Do-while\
  \ 循环语句\n\n`do-while` 循环语句的功能与 `while` 语句相似。它们之间的区别在于 `while` 语句需要先判断循环条件，根据循环条件的结果决定是否执行\
  \ `{}` 中的代码。相比之下，`do-while` 语句在判断循环条件之前需要先执行一次 `{}` 中的代码。它的语法结构如下：\n\n```\nDo\n\
  {\n    Execute statement\n    ...\n} while (cyclic condition);\n```\n\n在上述语法结构中，关键字\
  \ `do` 之后的 `{}` 里的执行语句是循环体。`do-while` 循环将循环条件放在循环体之后。这意味着循环将无条件地执行一次，然后根据循环条件决定是否继续执行。\n\
  \n接下来，使用 `do-while` 语句重写示例，如下例所示。\n\n**program12.cs**\n\n```csharp\nPublic class\
  \ classicprogram\n{\n    Public static void //我们通常在这里输入选项\n    {\n        Int secondinstance\
  \ = 1;//定义变量 ‘secondinstance,’，初始值为 1\n        Do\n        {\n            Console.WriteLine(\"\
  firstinstance= \" + secondinstance); //打印‘firstinstance,’的值\n            secondinstance++;\
  \ //‘firstinstance,’自增\n        } While (firstinstance <= 4); //循环条件\n        Console.scan();\n\
  \    }\n}\n```\n\n运行结果将显示在计算机屏幕上。上面的示例具有相同的运行结果，说明 `do-while` 循环和 `while` 循环可以实现相同的功能。然而，这两种语句在程序运行过程中存在差异。如果循环语句开始时不满足条件，`while`\
  \ 循环的循环体将不会执行一次，但 `do-while` 循环的循环体仍会执行一次。如果示例中的循环条件 `x<=4` 改为 `x < 1`，示例 2-12 将打印\
  \ `x=1`，而示例 2-11 将什么都不打印。\n\n### For 循环语句\n\n`while` 循环和 `do-while` 循环在上节中已经解释。在程序开发中，另一种常用的循环语句是\
  \ `for` 循环语句，它通常用于循环次数已知的情况，其语法格式如下：\n\n```\nFor (initialization expression; circulation\
  \ conditions; operation expression)\n{\n    Execute statement\n    ...\n}\n```\n\
  \n在上述语法结构中，`for` 关键字后的 `()`包含三个部分：初始化表达式、循环条件和操作表达式，用 `;` 分隔；`{}` 中的执行语句是循环体。接下来，初始化表达式、循环条件、操作表达式和循环体分别用数字表示，并通过序号详细分析\
  \ `for` 循环的执行流。\n\n```\nFor (1; 2; 3)\n{\n    4\n}\n```\n\n接下来，通过一个案例求加 1~4 的自然数，如下所示。\n\
  \n**program13.cs**\n\n```csharp\nPublic class classicprogram\n{\n    Public static\
  \ void //我们通常在这里输入选项\n    {\n        Int secondinstance = 1;//定义变量 ‘secondinstance,’，初始值为\
  \ 1\n        Do\n        {\n            Console.WriteLine(\"firstinstance= \" +\
  \ secondinstance); //打印‘firstinstance,’的值\n            secondinstance++; //‘firstinstance,’自增\n\
  \        } While (firstinstance <= 4); //循环条件\n        For (int first = 1; first\
  \ <= 4;the, value, of first++) //first 将从 1 变到 4\n        {\n            Sum +=\
  \ first; //实现 sum 和 i 的累加\n        }\n    }\n}\n```\n\n\n\n\n在示例中，变量 `i` 的初始值为 1，如果判断条件\
  \ `i<=4` 为真，将执行循环 `sum+= i`。执行完成后，将执行操作表达式 `i++`，此时 `i` 的值将变为 2。然后继续判断条件并开始下次循环，直到\
  \ `i=5` 且条件 `i<=4` 为假，结束循环，执行 for 循环后的代码并打印“sum=10”。\n\n## 第 6 章：类\n\n### 类与对象\n\
  \n在 `c#` 编程语言中，每个组件都与类和对象相关联，这些代表了面向对象编程的基本概念。类类似于原型，用户从原型创建对象。类代表一个单一、唯一的单元，拥有所有的成员、属性和功能。\n\
  \n对象是现实中的内存实体。当实例化时，它们会分配一些内存空间并拥有对该空间的引用。创建的每个对象必须是类类型。\n\n### 类\n\n类代表了任何面向对象软件内部唯一的编程组件。类通过其访问修饰符、`class`关键字和唯一名称来定义。在某些类内部，可能有多个成员，如字段、属性和方法。类的默认访问修饰符是\
  \ `internal`（内部）。这意味着如果没有指定访问修饰符，则该类将被视为 `internal`。下面写了一个类的类的示例：\n\n![Image00109.jpg](img/Image00109.jpeg)\n\
  \n该类包含其访问修饰符 – `public`（公共），它包含关键字 `class`；它有一个唯一名称 `tshirt`。在此类内部定义了多个成员：有一个私有字段\
  \ `color`、一个公共属性 `color`、一个定义的构造函数（带有一个参数）以及一个公共方法 `about`。\n\n除了普通类之外，还有一种特殊的类\
  \ - 抽象类（abstract class）。抽象类是一种特殊的类，不能对其进行实例化。抽象类主要用于在层次结构中定义基类，也被称为不完整的类。抽象类通常代表基类，它的设计目标是让派生类来实现抽象定义。在抽象类中，也可以有抽象方法或非抽象方法。抽象方法以及每个标记为抽象的类成员都必须在派生类中实现。标记有\
  \ `abstract` 关键字的类其目的是为派生类提供原型。抽象类可以实现构造函数。下面提供了一个示例：\n\n![Image00110.jpg](img/Image00110.jpeg)\n\
  \n在提供的示例中，我们可以看到一个名为 `animal` 的抽象类。该类中只有一个成员，即一个抽象空方法 `legsnumber()`。当方法被标记为抽象时，意味着派自该类的每个类（在本例中为\
  \ `animal` 类）必须对该方法的重写实现。在抽象类下面还有两个类，它们是“普通”类。这两个类都对 `animal` 有重写实现。这在章节中定义，但这是可能的，因为\
  \ `animal` 是抽象的。\n\n*(自纠：原文包含许多冗余的逗号和拼写错误，如“e,xample,,。”我已经清理了标点符号以提高可读性，同时保留了所要求的语义内容。）*\n\
