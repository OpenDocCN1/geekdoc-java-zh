  \ copy 方法的代码行：in: `n = m[2:9:2,5:].copy()`\n\n### 使用 pandas 进行数据清洗\n\n现在你已经准备好了所有的工具并有了整洁的环境，是时候开始被称为数据清洗（data\
  \ munging）的数据科学过程了。有时被称为数据整理（data wrangling），这个步骤是整个数据科学流水线最重要的步骤之一。其背后的基本概念是处理一组数据，以便与其他数据集一起使用或对其进行分析。你必然需要对原始数据集进行足够的修改，使其更符合你的特定目标。为了更好地理解这个想法，想象你有一组数据，你想要对其应用分类算法。然而，你现在还无法执行这一步，因为数据集是连续变量和分类变量的组合。这意味着你必须修改某些变量以匹配正确的格式。挑战在于，你正在处理原始数据，你还无法对其分析。首先，你需要用各种数据清洗技术和工具来清洗数据。在大多数现实世界场景中，你将处理大量的原始数据，与用于学习和练习的数据集不同。这就是为什么你需要清洗数据，而且可能会花费你大量的时间。许多数据科学家花费更多时间在准备数据上，而不是编写代码或运行各种算法。那么我们如何准备数据呢？一种流行的方法包括使用\
  \ pandas 库，它被用于数据分析和处理，正如之前提到的。在这种情况下，这个库的目的是允许你更快速地分析真实世界数据。\n\n\n\n\n请记住，数据清洗（data\
  \ munging）的目的是收集足够的信息以检测出其中的模式。此外，数据必须准确，对数据科学家或分析师才有用，从而减少产生有意义结果所需的时间和资源。考虑到这一点，你需要采取的第一步是获取数据。毕竟，没有数据，你什么也做不了。然而，在获取访问权限之前，你需要理解所有的数据项都是不同的，而且它们的生成质量并非同等对待。你经常会在识别具有特定来源的真实数据时遇到问题。第二步是在从每个源提取数据后进行合并。在这个阶段，需要对数据进行修改，然后组合，以便后续进行分析。最后，我们还有最后一步，即清洗数据。这一阶段是主要的。你需要修改数据以获得你可以使用的格式。你可能还需要执行一些可选步骤，例如纠正对结果产生负面影响的噪声数据或错误数据。\n\
  \n如你所示，这一步是至关重要的，尽管枯燥且耗时。然而，你有时无法避免它。你必须确保拥有相关的、最新的且不包含任何空值的信息，以便只选择你感兴趣的数据进行分析。幸运的是，Python\
  \ 配合 pandas 是你可以用来辅助数据清洗的最强大的工具之一。\n\n### 流程\n\n你可以通过许多方式收集数据。你可以从数据库、图像、电子表格以及任何存储信息的数字源中提取数据。然而，这些都是原始数据。你不能用它们进行适当分析，因为在所有数据中，你还有缺失的信息和损坏的数据。你需要首先使用\
  \ Python 数据结构为混乱建立秩序，将原始信息转换为由格式正确的变量组成的组织数据集。然后，在各种算法的帮助下处理该数据集。\n\n接下来，你可以检查数据以得出一个稍后将测试的早期观察。通过处理现有的变量来获得新变量，并利用图分析等各种技术推进数据科学流水线，从而揭示最有价值的变量。你现在能够创建第一个数据模型了；但是，你的测试阶段会告诉你，你必须对数据进行任何修正，因此返回数据清洗过程重新处理每一步。请记住，在大多数情况下，你期望的输出不会反映你收到的实际输出。理论并不总是引导你走向预期的方向，这就是为什么你需要处理许多不同的场景并进行测试，看看什么有效。\n\
  \n### 导入数据集\n\n在我们进行任何操作之前，我们需要实际的数据。为了导入数据集，我们将使用 pandas 访问来自各种数据库或电子表格的表格信息。本质上，这个工具将构建一个数据结构，其中表格文件的每一行都将被索引，同时分离变量以便我们操作数据。尽管如此，我们将在\
