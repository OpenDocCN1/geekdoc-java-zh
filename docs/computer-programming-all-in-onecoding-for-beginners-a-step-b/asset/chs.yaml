  \n## 第 9 章：流程控制\n\n### 流程控制\n\n循环是一种程序控制结构，它有助于复杂的执行路径以及对语句或一系列语句的重复处理。\n\n### for\
  \ 循环\n\n`for` 循环用于迭代顺序数据类型（如字符串、列表或元组）中的项。\n\n**语法：**\n\n```\nFor val in sequence:\n\
  \    Statement(s)\n```\n\n在“forfor 循环”中，变量在每次迭代中持有序列中项的值。循环将一直进行，直到所有项都被处理。\n\n\
  **示例：**\n\n**遍历字符串的 for 循环：**\n\n```python\nFor letter in ‘programming’: # iterate\
  \ over a string\n    Print('<<*', letter, '*>>’)\n```\n\n如果你运行上面的代码，输出如下：\n\n```\n\
  <<* p *>>\n<<* r *>>\n<<* o *>>\n<<* g *>>\n<<* r *>>\n<<* a *>>\n<<* m *>>\n<<*\
  \ m *>>\n<<* i *>>\n<<* n *>>\n<<* g *>>\n```\n\n注意，当“for 循环”到达字符串中的最后一个字母时，打印结束。\n\
  \n**遍历列表的 for 循环：**\n\n```python\n### iterate over a list\nDogs = ['rottweiler’,\
  \ ‘pug’, ‘bulldog’, ‘beagle’, ‘poodle,’]\n\nFor name, in dogs:\n    Print('happy\
  \ dog :', name,)\n    Print(\"lovely dogs!\")\n```\n\n这是运行程序时的输出：\n\n```\nHappy\
  \ dog : rottweiler\nHappy dog : pug\nHappy dog : bulldog\nHappy dog : beagle,\n\
  Happy dog : poodle,\nLovely dogs!\n```\n\n#### 在 for 循环中使用 `range()` 函数\n\n`range()`\
  \ 函数是一个内置函数，可以与“for 循环”配合使用以获取所需的数字。例如，如果你需要 1 以及从 1 到 10 的所有数字，你可以用此程序创建一个“for\
  \ 循环”\n\n```python\nx = 10\nTotal = 0\nFor num in range(1, x+1):\n    Total = total\
  \ + num\nPrint(\"sum of 1 up to %d: %d” % (x, total))\n```\n\n你的输出将是：\n\n`Sum of\
  \ 1 up to 10: 55`\n\n### while 循环\n\n当测试表达式为真且需要重复执行语句或一组语句时，使用“while 循环”。当它不再为真时，控制传递到循环后的行。\n\
  \n**语法：**\n\n```\nWhile condition:\n    Statement(s)\n```\n\n**示例：**\n\n```python\n\
  #program adds number up to a number\n#specified by the user\n#total = 1+2+3+4…+number\n\
  Num = int(input(“enter a number: “))\n#initialize total and counter\nTotal = 0\n\
  Y = 1\nWhile y <= num:\n    Total = total + y\n    Y = y+1 #update counter\n#print\
  \ the total\nPrint(“the total is: “, total)\n```\n\nEnter a number: 3\n`The total\
  \ is: 6 #1+2+3`\n\nEnter a number: 7\n`The total is: 28 #1+2+3+4+5+7`\n\n#### break\
  \ 语句\n\nbreak 语句终止循环并将控制传递到循环后的第一个语句。它通常用于需要快速退出的情况。\n\n**语法：**\n\n```\nBreak\n\
  ```\n\n**示例：**\n\n```python\n#loop ends once a specified color is reached\nColors\
  \ = [blue,” “pink”, “red”, “green”, “yellow”]\nFor x in colors:\n    If x == ‘green’:\n\
  \        Break\n    Print('color :', x)\n    Print(“amazing loop!”)\n```\n\n运行程序查看结果：\n\
  \n```\ncolor : blue\ncolor : pink\ncolor : red\namazing loop!\n```\n\n注意，当到达颜色‘green’时，它跳过了打印语句并打印了列表中的下一个项。\n\
  \n#### continue 语句\n\ncontinue 语句跳过当前迭代中的语句并将控制传递到下一次迭代。\n\n**语法：**\n\n```\nContinue\n\
  ```\n\n为了说明，你可以将上述示例中的 `break` 语句替换为 `continue` 语句。\n\n```python\nColors = [blue,”\
  \ “pink”, “red”, “green”, “yellow”]\nFor x in colors:\n    If x == ‘green’:\n  \
  \      Continue\n    Print('color :', x)\n    Print(“amazing loop!”)\n```\n\n运行程序时，输出如下：\n\
  \n```\ncolor : blue\ncolor : pink\ncolor : red\ncolor : yellow\namazing loop!\n\
  ```\n\n注意，当到达颜色‘green’时，它跳过了打印语句并打印了列表中的下一个项。\n\n#### pass 语句\n\n`pass` 是 Python\
  \ 中的空操作。解释器读取 pass 语句但不执行任何操作。它通常用作语法要求语句时的占位符。这允许他们在测试完整语句的同时避免完整语句产生错误消息。\n\n\
  **语法：**\n\n```\nPass\n```\n\n## 第 10 章：python 字典\n\n字典（或简称 dict）虽然也包含顺序数据，但它是一种以键作为值的映射键的关联数组类型。它包含的数据可能是顺序的，但它们并不是排序的。\n\
  \n字典的元素是可变的，可以是任何其他数据类型。每个元素都由冒号（:）匹配的键:值对组成，就像列表和元组一样，用逗号分隔。字典的语法是一个由花括号 {} 包围的一个或多个元素组成的标识对象。\n\
  \n语法采用此格式：\n\n```\nMdict = {key1:value1, key2:value2, key3:value3}\n```\n\n与列表类似，字典是可变的，可以包含混合内容，包括元组（假设所有值都是相同类型）、列表、字符串、整数等。\n\
  \n键值对模型的作用在于存储在字典中的每个键都是唯一的。实际上，字典设计用于存储唯一项或属性列表。\n\n给定以下内容是正确的：\n\n- 在添加或创建字典时，所有条目必须是键:值对格式。如果缺少键或值，将抛出异常。\n\
  - 如果向字典添加键:值对且该键已存在，则将丢弃旧的键值并使用新条目。\n- 只有在提供键时才能更新值。\n- 列表不能用作键。\n\n这里是一些常用的字典操作：\n\
  \n**创建一个空字典：**\n\n```python\nx={}\n```\n\n**创建一个字典：**\n\n```python\nx=dict(name=’john’,\
  \ age=35, height=6)\nprint(x)\n```\n\n**测试键是否存在：**\n\n```python\nif ‘age,’ in x.keys():\n\
  \    Print('found it！)\n```\n\n**获取键的值：**\n\n```python\ny=x[‘height’]\nprint(‘height\
  \ = ' + str(y))\n```\n\n**列出所有键：**\n\n```python\nFor y in x.keys():\n    Print(y)\n\
  ```\n\n**打印键和值：**\n\n```python\nFor y in x.keys():\n    V=x[y]\n    If type(v)!=‘str’:\n\
  \        V=str(v)\n    Print(y + ‘=’ + v)\n```\n\n**更新键的值：**\n\n```python\nx[‘age,’]=40\n\
  print(x)\n```\n\n**删除键:值对：**\n\n```python\ndel(x[‘height’])\nprint(x)\n```\n\n**添加键:值对：**\n\
  \n```python\nx[‘height’]=6\nprint(x)\n```\n\n**将所有键或值转为列表：**\n\n```python\nlist(x.keys())\
  \ # keys as a list\n['name,’, ‘age,’, ‘height’]\n\nlist(x.values()) # values as\
  \ a list\n['john’, 40, 6]\n```\n\n创建字典\n\n\n\n\n\n在 Python 中创建字典对象最流行的方法是像我们在书中创建其他对象类型一样，为一个空字典对象命名。一旦创建了字典，你就可以根据需要添加键值对。\n\
  \n### 创建字典并向其添加键值对\n\n```python\n1 mydict = {}\n2\n3 mydict [\"name\"] = \"jane\"\
  \n4 mydict [\"age\"] = 21\n5 mydict [\"city\"] = \"london\"\n6 mydict [\"hobbies\"\
  ] = \"cycling\", \"coding\", \"cooking\", \"gaming\", 7\n8 print (mydict)\n```在本次练习中，我们在脚本的第一行创建了一个名为\
  \ `mydict` 的空字典。从第三行到第六行，我们向该空字典添加了键值对，最后在末尾打印了字典 `mydict` 的内容。\n\n创建字典的另一种方法是像练习\
  \ 27 那样，为命名的字典对象赋值键值对。\n\n### 通过赋值键值对创建字典\n\n```python\n1 mydict = {\"name\": \"\
  jane\", \"age\": 21, \"gender\": \"f\", \"city\": \"london\"}\n2\n3 print (mydict)\n\
  ```你会注意到，键值对输入字典的顺序并不重要，因为它们是通过键而不是索引来访问的，它们总是以不同的顺序被打印出来。\n\n创建字典时必须遵守的一条规则是：键必须是唯一的，但值不需要唯一。键是不可变的，而值可能是可变的数据类型，如字符串、数字或列表。\n\
  \n### 访问字典键值对\n\n字典数据不是排序的；因此，可以像我们处理字符串、列表和元组那样，无需索引即可独立访问。字典是一种复合对象类型，不能进行切片或索引操作。\n\
  \nPython 使用复杂的算法来映射字典的键。这种过程被称为哈希（hashing），它使得访问、检索和更新字典键值对的速度比其他顺序对象类型快得多。\n\n\
  键用于访问字典的键值对。下一个练习将演示我们如何如何访问字典的值。\n\n### 访问字典键值对\n\n```python\n1 weather = {\"mon\"\
  : \"cloudy\", \"tue\": \"sunny\", \"wed\": \"rainy\"}\n2\n3 print (weather[\"wed\"\
  ])\n```如果你尝试访问不存在的键的键值对，你将遇到错误 `KeyError: [key]`\n\n### 更新字典\n\n你可以向字典添加新的键值对，并修改或删除现有条目的值，正如下一个练习所示。\n\
  \n### 更新字典\n\n```python\n1 weather = {\"mon\": \"cloudy\", \"tue\": \"sunny\", \"\
  wed\": \"rainy\"}\n2\n3 weather[\"thu\"] = \"hot\"\n4 weather[\"wed\"] = \"gloomy\"\
  \n5 del weather[\"mon\"]\n6\n7 print (weather[\"wed\"])\n```在本次练习中，我们创建了一个名为 `weather`\
  \ 的字典，包含日期:天气类型的键值对，如你所见。在第 3 行，我们添加了一个新的键值对；在第 4 行，我们更新了 \"wed\" 键的值；在第 5 行，我们删除了\
  \ \"mon\"键值对。你的脚本运行正常吗？\n\n`del` 语句用于显式删除字典中的单个项目；要删除整个字典，也可以使用它。\n\n### 使用内置函数和方法进行基础字典操作\n\
