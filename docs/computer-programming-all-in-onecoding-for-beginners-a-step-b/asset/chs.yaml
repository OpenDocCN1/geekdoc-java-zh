  \n我们所做的是使用构造函数来获取用户名。\n\n### 重写类方法\n\n在编写 python 代码时，我们允许重写父类中定义的方法。你可能在子类中需要不同的功能，这就是重写父方法的良好理由。要重写该方法，我们只需要向它传递不同的参数，如下所示：\n\
