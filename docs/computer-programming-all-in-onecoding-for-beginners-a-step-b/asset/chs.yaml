  \n虽然程序代码现在看起来好多了，但它仍有些不完全正确的地方，如果你运行程序，仍然得不到正确答案。你能猜到为什么吗？因为了所谓的“截断”（truncation）。这听起来可能很，但其实并不。在上面的程序中，`x`\
