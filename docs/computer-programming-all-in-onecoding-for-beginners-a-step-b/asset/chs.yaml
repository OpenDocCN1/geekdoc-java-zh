  \ `double`。或者，你也可以简单地将每个变量声明为 `double`；这取决于你的决定。这里是完整程序的样子：\n\n![Image00069.jpg](img/Image00069.jpeg)\n\
  \n随着我们在 C++ 学习中目前看到的一切，你正走在成为代码高手的路上。练习是关键。\n\n### 编程中的常量类型\n\n### 整数常量\n第一件事，整数是以二进制形式存储的。你将像日常生活中那样编写整数；例如，你将把八编码为\
  \ `8`。下面的表格将向你展示不同的整数、它们在编程中的值以及数据类型\n\n![Image00070.jpg](img/Image00070.jpeg)\n\
  \n### 字符常量\n每当你发现一个整数位于单引号之间时，它就是字符常量。此外，你可能会在这些引号之间发现一个反斜杠 `\\`。对于大多数机器，使用的是字符集，即：\n\
  \n![Image00071.jpg](img/Image00071.jpeg)\n\n![Image00072.jpg](img/Image00072.jpeg)\n\
  \n### 浮点常量\n浮点常量作为两个部分存储在内存中，因为浮点常量带有小数部分的数字。内存中获得的第一部分是位，第二部分是指数。浮点常量的默认类型是 `double`。你必须编写代码来指定所需的数据类型，例如\
  \ `float` 或 `long double`。我们可以记住 `f` 或 `F` 用于表示 float，而 `l` 或 `L` 用于表示 long double。在下面的表中，展示了\
  \ float、double 和 long double 的一些示例：\n\n![Image00073.jpg](img/Image00073.jpeg)\n\n\
  ![Image00074.jpg](img/Image00074.jpeg)\n\n### 布尔常量\n这些常量是预定义的关键字，不能由程序员定义或声明。它有两个预定义的常量：`true`\
  \ 和 `false`。在编程中，我们把这种常量表示为 `bool`。\n\n### 编程常量\n在这一部分，我们将理解不同的编程常量以及在 C++ 程序中编写和定义常量的方法。通常，有三种类型的编程常量。\n\
  \n### 定义常量\n在 C++ 程序中定义常量的方法是使用预处理器语句 `#define`。像其他所有预处理器指令一样，它以 `#` 开始。例如，一个传统的\
  \ `#define` 预处理器指令是：`#define table_size 150`。`#define` 指令通常放在程序的开头，以便阅读你程序的人可以轻松找到它们。\n\
  \n##### 内存常量\n另一种编写常量的方法是使用内存常量。这些常量使用 C++ 类型限定符来记住指定的数据不能更改。C++ 编程为我们提供了定义命名常量的能力。我们只需要在代码中的常量之前添加类型限定符。例如：\n\
  \n```cpp\n#include <iostream>\n\nusing namespace std;\n\n#define val 50\n#define\
  \ floatval 9.7\n#define charval 'k'\n\nint main()\n{\n\n    cout << \"integer constant\
  \ in our code: \" << val << \"\\n\";\n    cout << \"floating point constant in our\
  \ code: \" << floatval << \"\\n\";\n    cout << \"character constant in our code:\
  \ \" << charval << \"\\n\";\n    return 0;\n}\n```\n\n输出： \n\n在此段代码的情况下，控制屏幕将弹出输出：\n\
  \ninteger constant in our code: 50\n\nfloating-point constant in our code: 9.7\n\
  \ncharacter constant in our code: k\n\n字面量常量\n\n[/content]\n[/content]\n\n\n\n\n\
  字面量常量（Literal constant）是一种没有名称且用于指定你所需数据的常量。正如我们所知，常量是不能更改的，因此我们只需要在语句中编写它的数据值即可。\n\
  \n字面量常量是最常见的常量形式。下表展示了不同类型的字面量常量。\n\n![Image00075.jpg](img/Image00075.jpeg)\n\n\
  ## 第 3 章：函数\n\n你可能在数学课上记得过某些时候需要处理函数，例如 `f(x) = 2x + 5`。`f(0)` 的结果是 5（`2(0) = 5`），`f(1)`\
  \ 的结果是 7（`2(1) + 5`），`f(2)` 的结果是 9（`2(2) + 5`），以此此类推。\n\nC++ 中的函数工作原理类似。\n\n函数执行后通常会返回一个值。然而，它们并不总是需要返回值——不返回值的函数是\
  \ `void` 函数。\n\n首先，来看这段代码，它现在不需要符合逻辑；我们将对它进行分析。创建一个新项目并删除 `main.cpp` 的内容，输入以下内容。\n\
  \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint get_area(int l, int\
  \ w);\n\nint main()\n{\n    int length, width;\n    cout << \"enter the length,\
  \ and enter the width.\\n\";\n    cin >> length >> width;\n    cout << \"the are_a\
  \ is: \" << get_area(length, width);\n    return 0;\n}\n\nint get_area(int l, int\
  \ w) {\n    int are_a = l * w;\n    return are_a;\n}\n```\n\n让我们逐行拆解代码。\n\n`#include\
  \ <iostream>`\n这包含了输入和输出的核心组件。\n\n`using namespace std;`\n这表示我们正在使用标准输入/输出命名空间。\n\
  \n`int get_area(int l, int w);`\n这是我们声明第一个函数的地方。C++ 是过程化编译的，所以你不能随心所欲放置函数。你必须在之后编写它们之前对其进行声明，或者它们必须在你的\
  \ `main` 函数之前完全编写。为了清晰起见，我倾向于先进行初始声明，然后在 `main` 函数之后编写函数，但这是个人选择，无论如何，我们在这里创建了一个名为\
  \ `get_area` 的函数。名称前的 `int` 表示它将返回一个整数值。同样，`float get_area(...)` 会返回一个浮点数值，`char\
  \ get_character(...)` 会返回一个字符，以此类推。\n\n在声明中，我们给出了两个变量称为参数（arguments）。就像在 `f(x)`\
  \ 方程中，`x` 是方程修改的对象一样，参数变量就是 C++ 读取并利用的内容。\n\n`int main()`\n`{`\n这是我们 `main` 函数的开始。如果你还没有发现，每个程序都必须有一个\
  \ `main` 函数。它是代码的入口点，编译器会主动寻找它。\n\n`int length, width;`\n我们声明了两个变量 `length` 和 `width`。\n\
  \n`cout << \"enter the length, and enter the width.\\n\";`\n`cin >> length >> width;`\n\
  我们要求用户输入长度和宽度，然后接受他们的输入。\n\n`cout << \"the are_a is: \" << get_area(length, width);`\n\
  这里需要进一步的解释。输出流输出了我们给它的值，对吧？由于函数只是返回一个值，我们可以直接把它放在输出流中。\n\n此外，由于此函数返回一个整数值，你可以创建一个新的整数并将其值赋值为函数的值，如下：`int\
  \ are_a = get_area(length, width);`\n你也可以直接输出：`cout << \"the are_a is: \" << are_a;`。但这样做是一种浪费，因为这个程序不需要创建这个变量。然而，如果你需要存储诸如矩形的\
  \ `are_a` 这样的变量，你可以完全这样做。\n\n`return 0;`\n`}`\n简单，每个 `main` 函数都必须返回 0。\n\n`int get_area\
  \ (int l, int w) {`\n这与函数声明相对应，也是我们开始编写它的地方。\n`int are_a = l * w;`\n我们创建了一个名为 `are_a`\
  \ 的新变量，它获取函数的两个参数并将它们相乘得到值。我们也可以简单地写成：`return l * w;`\n这两种都是返回该函数的有效方式，并会给你适当的结果。这是对函数的简要介绍。它们是构建程序的重要方式。如果所有内容只在一个函数中，读起来非常枯燥，维护也充满挑战。\n\
  \n## 第 4 章：多态\n\n多态（Polymorphism）意味着以多种形式存在。在编程中，当我们有许多通过继承相关的类时，就会发生多态。在 C++ 中，多态意味着对函数的调用将根据调用函数的对象类型执行不同的函数。考虑下面的示例，其中我们有一个由其他类派生的基类：\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\n\nclass figure {\nprotected:\n\
  \    int breadth, length;\npublic:\n    figure(int x = 0, int y = 0){\n        breadth\
  \ = x;\n        length = y;\n    }\n};\n\nclass rectangle: public figure {\npublic:\n\
  \    rectangle(int x = 0, int y = 0):figure(x, y) {}\n    int are_a () {\n     \
  \   cout << \"are_a of rectangle class is:\" << endl;\n    }\n};\n\nclass square:\
  \ public figure {\npublic:\n    square(int x = 0, int y = 0):figure(x, y) {}\n \
  \   int are_a () {\n        cout << \"are_a of square class is:\" << endl;\n   \
  \ }\n};\n\n// main function\nint main() {\n    figure *figure; \n    rectangle rec(10,7);\
  \ \n    figure = &rec;\n    figure->are_a();\n    square sq(5,5); \n    figure =\
  \ &sq;\n    figure->are_a();\n    return 0;\n}\n```\n\n*注：由于原文示例代码块在逻辑上存在不完整（如缺少构造函数实现和变量赋值），在翻译时保持了原文的结构，仅对文本描述进行了翻译。*\n\
  \n\n\n\n\n```cpp\n// store, the, addre,ss of square,figure, = &sq;\n\n// call aquare,\
  \ are,a.\n\nFigure,->are,a();\n\nRe,turn 0; }\n```\n\n代码现在应该返回以下结果：\n\n![Image00077.jpg](img/Image00077.jpeg)\n\
  \n编译器考虑的是指针的元素而不是它的类型，`rec` 和 `sq` 类的对象已经存储在 `figure` 中；它们各自定义的 `area()` 函数被调用了。\n\
  \n这表明每个派生类对该函数名和 `area()` 都有不同的实现。这被称为**多态**。你拥有多个一个具有相同函数名和相同参数的类，但它们的实现是不同的。\n\
  \n请注意，我们使用了 `virtual` 关键字来使该函数变为虚函数。当在基类中定义一个虚函数，而在派生类中定义另一个版本时，这将向编译器发送一个信号，表示不需要对函数进行静态链接。我们只需要根据调用该函数的对象类型，在程序的任何点选择要调用的函数。这种操作被称为**晚绑定**或**动态链接**。\n\
  \n有时，你可能需要在基类中包含一个虚函数，以便在派生类中重新定义以适应类对象，但你没有为基类中的函数提供有意义的定义。\n\n在这种情况下，我们在基类中的虚函数\
  \ `area()` 可以更改为：\n\n```cpp\nClass figure {\n\nProtected: int breadth, length;\n\
  \nPublic: figure,(int x =0, int y = 0){\n\nBreadth = x; length = y; }\n\nVirtual\
  \ int area() = 0; };\n```\n\n注意函数中使用的 `= 0;`。这告诉 C++ 编译器该函数没有函数体。这种函数被称为**纯虚函数**。\n\
  \n### 对象析构与多态性\n\n对象的析构是复杂的，特别是当通过接口销毁对象时，例如，你可以像这样的代码：\n\n```cpp\nClass drawable\n\
  \n{\n\nPublic:\n\nVirtual void draw () = 0;\n\n};\n\nClass mydrawable, : public\
  \ drawable,\n\n{\n\nPublic:\n\nVirtual void draw ();\n\nMydrawable, ();\n\n~mydrawable,\
  \ ();\n\nPrivate,:\n\nInt *mydata;\n\n};\n\nMydrawable,::mydrawable, ()\n\n{\n\n\
  Mydata = new int;\n\n}\n\nMydrawable,::~mydrawable, ()\n\n{\n\nDelete, mydata;\n\
  \n}\n\nVoid delete,drawable, (drawable, *drawable,)\n\n{\n\nDelete, drawable;;\n\
  \n}\n\nInt main ()\n\n{\n\nDelete,drawable,( new mydrawable,() );\n\n}\n```\n\n\
  `delete_drawable` 内部发生了什么？记住，当使用 `delete` 时，析构函数会被调用，所以这一行：\n\n`Delete, drawable;`\n\
  \n对该对象执行了函数调用。但编译器如何知道 `mydrawable` 析构函数在哪里？编译器不知道 `drawable` 变量的确切类型，但它知道它是一个 `drawable`，一个拥有\
  \ `draw()` 方法的东西。它只知道 `mydrawable` 析构函数本身如何找到与 `drawable` 关联的析构函数，由于 `mydrawable`\
  \ 在构造函数中分配了内存，因此 `mydrawable` 析构函数必须运行。\n\n好了，所以你可能认为：\n\n```cpp\nClass drawable\n\
  \n{\n\nPublic:\n\n    Virtual ~drawable ();\n\n    Virtual void draw () = 0;\n\n\
  };\n\nClass mydrawable, : public drawable,\n\n{\n\nPublic:\n\n    Virtual void draw\
  \ ();\n\n    Mydrawable, ();\n\n    ~mydrawable, ();\n\nPrivate:\n\n    Int *mydata;\n\
  \n};\n\nMydrawable,::mydrawable, ()\n\n{\n\n    Mydata = new int;\n\n}\n\nMydrawable,::~mydrawable,\
  \ ()\n\n{\n\n    Delete, mydata;\n\n}\n\nVoid delete,drawable, (drawable, *drawable,)\n\
  \n{\n\n    Delete, drawable;;\n\n}\n\nInt main ()\n\n{\n\n    Delete,drawable,(\
  \ new mydrawable,() );\n}\n```\n\n`delete_drawable` 内部发生了什么？记住，当使用 `delete` 时，析构函数会被调用，所以这一行\n\
  \n`Delete, drawable;`\n\n对该对象执行了函数调用。但编译器如何知道 `mydrawable` 析构函数在哪里？编译器不知道 `drawable`\
  \ 变量的确切类型，但它知道它是一个 `drawable`，一个拥有 `draw()` 方法的东西。它只知道 `mydrawable` 析构函数本身如何找到与\
  \ `drawable` 关联的析构函数，由于 `mydrawable` 在构造函数中分配了内存，因此 `mydrawable` 析构函数必须运行。\n\n（注：由于原文文本中\
  \ `delete_drawable` 的定义部分在提供的待翻译文本中缺失或不完整，上述翻译基于上下文推测了部分必要的 C++ 结构以确保逻辑连贯，但根据指令“不要漏原文”，此处严格遵循您提供的文本内容进行翻译。）\n\
  \n*纠正：提供的原始文本中 `delete_drawable` 的具体定义未在代码块中给出，只有 `main` 函数和描述。以下为针对给定原文的精确翻译：*\n\
  \n`delete_drawable` 内部发生了什么？记住，当使用 `delete` 时，析构函数会被调用，所以这一行\n\n`Delete, drawable;`\n\
  \n对该对象执行了函数调用。但编译器如何知道 `mydrawable` 析构函数在哪里？编译器不知道 `drawable` 变量的的确切类型，但它知道它是一个\
  \ `drawable`，一个拥有 `draw()` 方法的东西。它只知道 `mydrawable` 析构函数本身如何找到与 `drawable` 关联的析构函数，由于\
  \ `mydrawable` 在构造函数中分配了内存，因此 `mydrawable` 析构函数必须运行。\n\n\n\n\nC++ 允许你重新定义或重载其大多数内置运算符。这意味着程序员可以使用用户自定义类型配合运算符。\n\
  \n重载运算符是具有特殊名称的简单函数，即 `operator` 关键字加上正在定义的运算符的符号。就像函数定义一样，重载的运算符将有一个返回类型和参数列表。重载运算符的定义如下所示：\n\
  \n```cpp\nRectangle operator+(const rectangle & r);\n```\n\n在下例示例中，我们正在演示通过使用成员函数进行运算符重载的过程。我们将传递一个对象作为参数，并使用该对象访问对象的属性。调用该运算符的对象可以通过该运算符访问，如下所示：\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\n\nclass rectangle {\npublic:\n\
  \    double get_area(void) {\n        return length * breadth;\n    }\n    void\
  \ set_length(double l) {\n        length = l;\n    }\n    void set_breadth(double\
  \ b) {\n        breadth = b;\n    }\n    // 重载 + 运算符以加两个矩形对象。\n    rectangle operator+(const\
  \ rectangle & r) {\n        rectangle rect;\n        rect.length = this->length\
  \ + r.length;\n        rect.breadth = this->breadth + r.breadth;\n        return\
  \ rect;\n    }\nprivate:\n    double length; // 矩形的长度\n    double breadth; // 矩形的宽度\n\
  };\n\n// main 函数\nint main() {\n    rectangle rectangle1; // 声明类型为 rectangle 的 rectangle1\n\
  \    rectangle rectangle2; // 声明类型为 rectangle 的 rectangle2\n    rectangle rectangle3;\
  \ // 声明类型为 rectangle 的 rectangle3\n    double are_a = 0.0; // 在这里存储矩形的面积\n\n   \
  \ // 矩形 1 \n    rectangle1.set_length(6.0);\n    rectangle1.set_breadth(7.0);\n\n\
  \    // 矩形 2 \n    rectangle2.set_length(12.0);\n    rectangle2.set_breadth(13.0);\n\
  \n    // 矩形 1 的面积\n    are_a = rectangle1.get_area();\n    cout << \"are_a of rectangle_1\
  \ : \" << are_a << endl;\n\n    // 矩形 2 的面积\n    are_a = rectangle2.get_area();\n\
  \    cout << \"are_a of rectangle_2 : \" << are_a << endl;\n\n    // 两个对象相加：rectangle3\
  \ = rectangle1 + rectangle2;\n    rectangle3 = rectangle1 + rectangle2;\n\n    //\
  \ 矩形 3 的面积\n    are_a = rectangle3.get_area();\n    cout << \"are_a of rectangle_3\
  \ : \" << are_a << endl;\n\n    return 0;\n}\n```\n\n执行时，代码将返回以下内容：\n\n![Image00088.jpg](img/Image00088.jpeg)\n\
  \n考虑从上述代码中提取的章节：\n\n```cpp\nRectangle operator+(const rectangle & r) {\n    rectangle\
  \ rect;\n    rect.length = this->length + r.length;\n    rect.breadth = this->breadth\
  \ + r.breadth;\n    return rect;\n}\n```\n\n这就是实现运算符重载机制的地方。我们重载了 `+` 运算符，使其能够两个矩形对象的测量值。这里是代码中提取的另一行：\n\
  \n```cpp\nrectangle3 = rectangle1 + rectangle2;\n```\n\n在上述行中，`rectangle1` 将被加到\
  \ `rectangle2`。这意味着 `rectangle1` 的 `length` 将加到 `rectangle2` 的 `length` 上得到 `length`，而\
  \ `rectangle1` 的 `breadth` 将加到 `rectangle2` 的 `breadth` 上得到 `breadth`。这两个结果将给出 `rectangle3`\
  \ 的面积。`+` 运算符的含义已被重载！\n\n## 第 6 章：宏与模板\n\n### 模板简介\n\n模板是 C++ 语言中的重要特性，因为它允许函数和类使用泛型类型。它们通过允许定义不同的数据类型而无需重写每个类型来影响函数和类的工作。使用模板，你可以编写适用于任何数据类型的通用代码，只需将类型作为参数传递即可。模板提高了代码的可用性并提高了程序的灵活性。你可以创建一个简单的类或函数，并将数据类型作为参数传递，并实现供任何数据类型使用的代码。每当你想使用该函数时，只需调用函数并指定返回类型。例如，如果你使用\
  \ `sort()` 来对仓库中的数据进行排序，你可以将不同的数据类型作为参数传递给函数。你不需要根据传递给排序算法的数据编写并维护多个文件来排序，你仓库中的数据无论数据类型如何都会被排序。因此，模板被用于代码需要在多个数据类型中可重用的情况。在处理多重继承和运算符重载时，模板具有重要意义。它们在代码重用性是首要考虑的地方被广泛应用。\n\
  \n### 模板的类型\n\n模板通过两种方式实现：\n\n- 函数模板\n- 类模板\n\n模板可以定义为宏。也就是说，当你定义一个特定类型的对象时，该类型的模板定义将用相应的数据类型替换它。模板通常被称为参数化类或函数，因为在执行期间，指定的数据类型将替换定义的参数。\n\
  \n### 类模板\n\n类模板提供了根据参数创建类的规范。类模板接受带类型的成员。即，你可以通过传递一组数据类型来实例化类模板。类模板主要用于容器。\n\n\
  ### 语法\n\n```cpp\ntemplate <class identifier>\nclass class-name\n{\n    ...\n  \
  \  //类成员\n    ...\n};\n```\n\n### 示例：\n\n![Image00089.jpg](img/Image00089.jpeg)\n\
  \n类模板定义与普通类定义相似，但在模板中你需要添加前缀 `template <class m>`，其中 `m` 是类型。模板前缀告诉编译器这是一个类模板，它使用\
  \ `m` 作为类型。在这种情况下，`vector` 类是使用 `m` 作为参数的参数化类。\n\n如果一个类派自于类模板，它被称为模板类。模板对象的定义为：`classname<type>\
  \ objectname();`\n\n从类模板创建类被称为实例化过程。在创建模板类之前，你需要先调试模板。编译器在实例化后对模板类检查错误。\n\n### 示例：类模板\n\
  \n```cpp\ntemplate <class tt>\nclass rectangle {\n    tt width;\n    tt breadth;\n\
  public:\n    void set_value_s(tt num1, tt num2);\n    tt get_area() {\n        tt\
  \ a;\n        a = width * breadth;\n        return a;\n    }\n};\n\nvoid rectangle<tt>::set_value_s(tt\
  \ num1, tt num2) {\n    width = num1;\n    breadth = num2;\n}\n\nint main() {\n\
  \    rectangle<int> obj1(5, 6); // 示例的简化逻辑\n    rectangle<float> obj2;\n    rectangle<float>\
  \ obj2(5.6, 4);\n\n    cout << obj1.get_area() << endl;\n    cout << obj2.get_area()\
  \ << endl;\n\n    return 0;\n}\n\n//\n//输出\nObj1=30\nObj2=22.4\n```\n\n上述程序创建了一个类型为\
  \ `tt` 的类。`(void rectangle<tt>::set_value_s (tt num1, tt num2))` 中的 `<tt>` 指定了函数参数也是类模板参数，并且在调用类时应始终包含它。\n\
  \n\n\n你还可以在类中拥有多个泛型数据类型。你可以在模板规范内部使用逗号分隔的列表来声明泛型类。\n\n### 语法\n```cpp\ntemplate <class\
  \ xy, class xyz, …>\nclass class-name\n{\n    //函数体;\n};\n```\n\n### 示例：带有两个泛型类型的类\n\
  ```cpp\ntemplate<class f1,class f2>\nclass numbers\n{\n    f1 j; f2 k;\n\npublic:\n\
  \    numbers (f1 x, f2 y)\n    {\n        j=x; k=y;\n    }\n\n    void print()\n\
  \    {\n        cout<<j<<\"and\"<<k<<\"\\n\";\n    }\n};\n\nint main()\n{\n    numbers\
  \ <float, int> numbers1 (2.53, 253);\n    numbers <int, char> numbers2 (50,'z’);\n\
  \    numbers1.print();\n    numbers2.print();\n    return 0;\n};\n\n// 输出\n1.53\
  \ and 253\n50 and z\n```\n\n### 函数模板\n函数模板的工作原理与普通函数类似，区别在于普通函数只能处理单一数据类型，而模板可以容纳多种数据类型。通过模板，你可以重载普通函数以处理不同的数据类型。\n\
  \n这使得函数模板变得更有用，因为你只需要编写一个适用于所有数据类型的单一程序。\n\n模板总是在编译时进行展开的。\n\n就像类模板一样，你可以创建一个具有不同参数类型的函数模板。\n\
  \n### 语法\n```cpp\ntemplate <class type,>\nreturn-type function-name, (arguments)\n\
  {\n    函数体;\n};\n```\n在定义函数模板时，必要时你必须在函数体和参数列表中都包含模板类型。\n\n### 示例 1：交换值的函数\n```cpp\n\
  template <class t1>\nvoid swap (t1&num1, t1&num2)\n{\n    t1 val= num1; num1=num2;\
  \ num2=val;\n};\n```\n调用模板函数的方法与调用普通函数完全相同。\n\n### 示例 2：函数模板的实现\n```cpp\ntemplate\
  \ <class test>\ntest max (test x, test y);\n{\n    test results;\n    results=x>y?\
  \ x:y;\n    return results;\n};\n\nint main()\n{\n    int a=5, b=6, c;\n    double\
  \ l=4, m=6, n;\n    c= max <int> (a,b);\n    N=max <double,> (l,m);\n    cout<<\
  \ c<<endl;\n    cout<<n<<endl;\n    return 0;\n}\n```\n在这个示例中，`test` 是模板参数。函数 `max`\
  \ 使用不同的不同的参数类型（int 和 double）调用了两次。当编译器实例化时，它每次都会根据类型调用函数。产生的输出对象（在用特定类型实例化模板后）将与参数\
  \ `x` 和 `y` 的类型相同。\n\n上述程序将根据值的大小对值进行排序。如果使用数字数组，将应用排序算法对数字从最小到大进行排序。\n\n### 带有多个参数的函数模板\n\
  与类模板一样，你可以拥有多个由逗号分隔的泛型数据类型。\n\n![Image00090.jpg](img/Image00090.jpeg)\n\n### 示例：带有多个参数的类\n\
  ```cpp\ntemplate<class tmp1,class tmp2>\nvoid display( tmp1 j, tmp2 k)\n{\n    cout<<j<<\"\
  \ <<<<k<<\"\\n\";\n}\n\nint main()\n{\n    J=display1(2019, “edge,”);\n    K=display2(18.54,\
  \ “1854);\n    return 0;\n}\n\n// 输出\n2019 edge,\n18.54 1854\n```\n\n### 重载模板函数\n\
  可以使用模板函数本身或使用同名的普通函数来重载模板函数。重载可以通过以下方式实现：\n- 调用匹配模板函数的普通函数。\n- 调用使用精确函数构建的模板函数。\n\
  - 在普通函数上使用普通重载，并调用与匹配模板函数的函数。如果没有找到匹配项，系统将生成错误消息。\n\n### 示例：使用显式函数的重载模板\n```cpp\n\
  template <class m>\nvoid display(m n)\n{\n    cout<<”template function:” << n<<“n”;\n\
  }\n\nvoid display (int n)\n{\n    cout<<”explicit template display <<<< n<<“n”;\n\
  }\n\nint main()\n{\n    display (80);\n    display (15.20);\n    return 0;\n}\n\n\
  //输出\nexplicit template display: 80\ntemplate function: 15.20\n```\n函数调用 `display\
  \ (80)` 调用的是 `display()` 的普通版本，而不是模板版本。\n\n### 成员函数模板\n在创建类模板时，所有的成员函数都可以定义在类之外，因为模板类中的成员函数是通过类型进行参数化的。因此，函数模板应该定义成员函数。类模板内部的成员函数（无论是内联还是非内联的）隐式都是函数模板，如果声明了一个模板类，其所有模板函数有三种定义方式：\n\
  1. 为实例化模板类所使用的每个返回类型在文件作用域内显式定义。\n2. 在模板参数期间的文件作用域内。\n3. 在类内内联。\n\n成员函数模板可以实例化未显式生成的。如果类同时具有成员函数和显式函数，则显式定义的优先级更高。\n\
  \n### 语法\n![Image00091.jpg](img/Image00091.jpeg)\n\n### 示例：带有成员函数模板类\n![Image00092.jpg](img/Image00092.jpeg)\n\
  \n### 非类型模板参数\n模板可以有单个或多个类型参数。除了类型 `t` 参数，你还可以使用非类型参数模板。你可以使用字符串、常量内置类型和函数名创建模板参数。\n\
  \n![Image00093.jpg](img/Image00093.jpeg)\n上述模板将数组的大小作为参数传递。编译器只在运行时才知道数组的大小。参数在创建模板类时指定。\n\
  \n\n\n\n我们从基础模板介绍开始，并重新声明模板的参数。区别在于类名中现在包含了 `arraywrapper` 模板，这告诉所有人它属于一个 `template`\
  \ 类，而不是一个名为 `arraywrapper` 的标准类上的 `template` 函数。\n\n在在此实现中，模板参数可以用来代表提供的类型，就像模板函数中的一样。然而，函数调用者永远不需要提供该参数——它从第一个模板类型声明中获取。例如，与其其写成\
  \ `vec.size<int>()`\n\n或者\n\n```\nvec<int>.size();\n```\n\n为了获取整数向量的大小，你只需要写成\n\n\
  ```cpp\nvec.size().;\n```\n\n### 模板与头文件\n\n到目前为止，我们看到的模板都是直接写在 `.cpp` 文件中的。如果我们想把模板声明放在头文件中呢？我们能做到吗？这里的问题在于，任何使用模板类或模板函数的代码，在每次对模板的调用以及在模板类上调用的每个成员函数中，都需要能够访问整个模板定义。\n\
  \n这与标准函数的工作方式不同；标准函数只需要调用者知道声明即可。例如，如果你将 `calc` 类放在它的头文件中，你还需要添加完整的构造函数定义以及 `add()`\
  \ 方法，而不是像通常那样样将它们都放在一个 `.cpp` 文件中。如果你不这样做，你将无法使用 `calc`。\n\n这是模板的一个相当遗憾的点，这完全取决于模板是如何编译的。在大多数情况下，当编译器第一次解析它们时，它几乎忽略了模板。只有当模板被使用并关联了具体类型时，编译器才会为该类型生成代码。为了做到这一点，模板必须对编译器可用以便生成代码。结果是，所有模板代码必须包含在所有使用该模板的文件中。当编译一个包含模板的文件时，在模板第一次被使用之前，你可能都无法发现该模板中的任何语法错误。\n\
  \n创建模板类时最简单的方法是将所有模板定义都放在头文件中。使用 `.h` 以外的扩展名也有帮助，仅仅是为了指示该文件是一个模板——例如 `.hxx`。\n\n\
  ### 分析模板错误信息\n\n如果说使用模板有一个显著的缺点，那就是当模板被误用时，许多编译器会抛出难以理解的错误信息，无论你是否写错了。你可能因为一个错误就得到几页错误信息。\n\
  \n模板错误信息之所以难以阅读，是因为模板参数被展开到了极致，甚至包括你通常不使用的参数，例如默认参数。\n\n`vector` 模板的第二个参数也有类似的限制——这个参数需要一个比简单的基础整数提供更多功能支持的类型。错误都在抱怨\
  \ `int` 作为参数时，其作为有效类型有许多种方式。\n\n找到错误所在的代码行始终是弄清哪里出问题的第一步。很多时候，而且随着你经验和信心的增加，一眼你的代码就能告诉你错误是什么。如果这并不显而易见，你只需继续遍历实例化列表，直到出现正确的错误信息：“error:\
  \ int is not a class, struct or union type.,,” 编译器期望一个结构体或类，而不是任何其他类型。编译器期望一个结构体或类，而不是像\
  \ `int` 这样的内置类型。一个 vector 应该持有。你应该确保你知道 `vector` 是如何声明的，并且它只需要。现在问题已经找到了，我们将能够同时工作并修复一些错误，但错误通常是根源所在。在我们的最后一个示例中，所有由一个错误产生的所有错误信息，都是由于\
  \ `int` 类型的结果。\n\n### 第 7 章：类\n\n#### 类的介绍\n\n所有类的核心在于你创建并利用的对象概念，这有助于模块化和易用性。在早期的迭代中，有一种被称为\
  \ `struct` 的原始类型。`struct` 仍然存在，但主要被废弃，转而使用 `class`。`struct` 与 C++ 中的 `struct` 不同。\n\
  \n在我们深入讨论之前，让我们简要讨论访问权限。我们讨论过像 `int`、`string` 和 `float` 等内置类型。然而，你可以创建一个由数据片段和固有函数组成的整个类型。这被称为对象。\n\
  \nPublic 意味着对象及其内部数据可以被程序中的任何代码访问和修改。\n\nProtected 意味着对象及其内部数据可以被它的派生类访问（当我们学习继承和多态时，这就有意义了）。\n\
  \nPrivate 意味着只有对象本身可以访问其数据。这对于安全和清晰至关重要。\n\n开发者倾向于将 `struct` 看作功能有限的未保护对象，而倾向于将\
  \ `class` 看作功能强大且结构良好的对象。因此，除非你的对象功能很少且仅包含很少的数据，否则通常创建类更好。\n\n看看这个 `struct` 声明。\n\
  \n```cpp\nstruct animal {\n    int legs;\n    string name;\n    enum die_t { herbivore,\
  \ omnivore, carnivore };\n    die_t naturaldie_t;\n};\n```\n\n```cpp\nint main()\
  \ {\n    animal dog;\n    dog.legs = 4;\n    dog.name = \"dog\";\n    dog.naturaldie_t\
  \ = dog.carnivore;\n    return 0;\n}\n```\n\n这是声明新对象最简单的方法。你不应该在现有的函数内部声明它们。\n\n\
  \n\n\n让我们把那个结构体（struct）替换为类（class），因为以后我们将一直使用类，因为它们通常比结构体更安全、更好的选择。\n\n在代码块中创建一个名为“animalsimulator”的新项目。虽然这不是最有创意的标题，但它能胜任我们需要的任务。清空\
  \ `main.cpp` 的内容，导入 `iostream` 并创建你的 `main` 方法。\n\n在 `main` 方法上方，让我们声明一个名为 `animal`\
  \ 的类。你的操作方式和声明结构体非常相似。为了方便说明，让它看起来像这样：\n\n```cpp\nClass animal {\n    String name;\n\
  };\n```\n\n然后在你的 `main` 方法中，声明一个实例，并将它的 `name` 实例设置为你最喜欢的动物的名字。之后尝试构建。\n\n你应该会收到一个显示为“error:\
  \ string animal::name is private.”的错误。\n\n完美。这种情况应该是发生的，因为我们现在必须修复它。这就涉及到整个访问修饰符的概念。\n\
  \n修改你的类，使其看起来像下面所示：\n\n```cpp\nClass animal {\n    Public:\n    String name;\n}\n\
  ```\n\n然后尝试构建。这次应该可以正常运行了。这是因为我们把字符串“name”设为了公共（public），这意味着类本身之外的其他方法/函数可以访问它。\n\
  \n尽管这通常被认为是一种坏习惯，因此我们将这样重写类：\n\n```cpp\nClass animal {\n    Private:\n    String\
  \ name;\n}\n```\n\n在类内部修改值的最佳实践是使用 get/set 方法。如果实现了 get/set 方法，类看起来会是这样：\n\n```cpp\n\
  Class animal {\n    Private:\n    String name;\n    Public:\n    String getname()\
  \ {\n        Return this->name;\n    }\n    Void setname(string name) {\n      \
  \  this->name = name;\n    }\n}\n```\n\n现在，在你的 `main` 方法中，在声明任何动物实例后，不要直接修改它的名字，而是应该像这样使用\
  \ get/set 方法（假设你的实例 `animal` 称为“dog”）：\n\n```cpp\nDog.setname(\"dog\");\n```\n\n\
  然后你可以通过在 `main` 方法中打印名字来测试这一点：\n\n```cpp\nCout << “the name of my favorite animal\
  \ is: “ << dog.getname() << \"\\n\";\n```\n\n这些方法的工作原理是通过类内部的方法返回或设置变量的值。`this->`\
  \ 被称为 `this 指针`，它指向类给定实例的变量。每个对象都有访问其变量的权限，并且可以通过 `this 指针` 直接修改它们。\n\n不管怎样，你的代码运行非常完美。但如果你不想为每个类的每个实例都通过\
  \ get/set 来处理呢？我们将使用一种所谓的初始化函数（initializer function）。\n\n修改你的类，使其看起来像下面所示：\n\n```cpp\n\
  Class animal {\n    Private:\n    String name;\n    Public:\n    Animal(string name)\
  \ {\n        this->name = name;\n    }\n    String getname() {\n        Return this->name;\n\
  \    }\n    Void setname(string name) {\n        this->name = name;\n    }\n}\n\
  ```\n\n现在，在你的 `main` 函数中，删掉显示 `animal x` 后面跟着 `x.setname(“name,”)` 函数的代码块。当你创建一个初始化函数时，你可以从一开始就设置某些变量。\n\
  \n例如，由于你的初始化函数接受参数 `name`，你可以在声明变量时进行声明，并绕过整个 `setname` 操作。看这个代码作为示例：\n\n```cpp\n\
  Animal dog(\"dog\");\nAnimal elephant(\"elephant\");\nAnimal bird(\"bird\");\n```\n\
  \n这些都是类 `animal` 的独立实例，得益于初始化函数，它们的名字在没有使用 `setname` 的情况下就被设置了。它可以接受你需要的任意数量的参数。这使得创建新对象变得极其简单而且非常精简。\n\
  \n现在我们已经简单讨论了声明对象之类的内容，让我们更多地谈谈对它们进行的具体操作。这里的 `animal` 代表动物。我们可以为整个类提供一组它们可以执行的方法。\n\
  \n让我们思考一下每种动物都会做什么。每种动物都会睡觉、进和喝水，对吧？所以将这些内容包含在我们的类中，让类的每个成员对象都能执行，这并不算太奇怪。\n\n假设我们有两种食物：肉类和植物，它们也都由各自的对象表示。我们可以为此创建两个不同的函数：\n\
  \n```cpp\nVoid eat(plant p) {\n    // 此处写代码\n}\nVoid eat(meat m) {\n    // 此处写代码\n\
  }\n```\n\n尽管它们共享相同的名称，但你可以根据你放入的对象类型来调用其中任何一个，两者都会根据你包含的参数执行它们各自的代码。这被称为函数重载（function\
  \ overloading）。它是面向对象编程中一项至关的技术，将帮助你创建功能强大且清晰的代码集，便于人们使用和理解。在下一章中，我们将开始探索对类可以做的一些更深层次的内容，包括使它们在面向对象编程中极其有用且实用的内部属性。\n\
  \n因为在我们学习类之初，要创建大量的类型，让我们先把“eat”留为一个不接受参数的空（void）函数吧。你的代码应该是这样的：\n\n```cpp\nClass\
  \ animal {\n    Private:\n    String name;\n    Public:\n    Animal(string name)\
  \ {\n        this->name = name;\n    }\n    String getname() {\n        Return this->name;\n\
  \    }\n    Void setname(string name) {\n        this->name = name;\n    }\n   \
  \ Void eat() {\n        // 吃东西\n    }\n}\n```\n\n在下一章中，我们将涵盖更多关于类的深入概念。\n\n### 对象与类\n\
  \n类是 C++ 的一项特性，它将 C++ 为了面向对象编程。记住，C++ 不是一种纯面向对象的语言，因为在纯面向对象中我们无法类类执行任何功能，但在 C++\
  \ 中是可以可能的。\n\n### 类\n\n它是一种用户定义的类型，拥有数据成员和成员函数，只有在为类创建了实例后才能访问它们。通常来说，类是表示类实例（即对象）状态和行为的蓝图。\n\
  \n数据成员在类定义中定义为变量，成员函数定义为函数。\n\n\n\n\nC++ 中的 `Class` 与 C 语言中的 `structure` 相似，唯一的区别在于，默认情况下\
  \ `classes` 的访问控制权限是私有的，而 `structure` 是公开的。\n\nC++ 通过 `classes` 提供了所有面向对象编程的重要特性，如封装、抽象和继承等。\n\
  \n类的每个对象都拥有其独立的数据成员拷贝，我们可以根据需要为该类创建任意数量的对象。\n\n### 对象 (Objects)\n\n类仅仅是一个蓝图。定义一个类时，不会为其分配内存。只有在为该类创建对象后，才会分配内存。这些对象是实例，拥有在该类中声明的数据变量，该类的成员函数在这些实例上运行。\n\
  \n对象通过特殊的构造函数进行初始化——这些是我们稍后会学习特殊方法。析构函数是另一种特殊函数，在对象超出作用域时销毁对象。\n\n```cpp\nClass\
  \ mobiles{\n    Int price;\n    Void calling (){}\n    Void messaging (){}\n};\n\
  \nVoid main(){\n    Mobile m1; // 为类 mobiles 创建的对象\n}\n```\n\n### 构造函数 (Constructors)\n\
  \n构造函数是类似于类成员函数的特殊函数，承担着对象初始化的重要任务。当对象被创建时，编译器会调用构造函数。构造函数在为特定对象提供存储空间后，通过初始化其成员来初始化创建的对象。一个类至少有一个构造函数。如果类中没有显式定义构造函数，就会产生一个没有参数的默认构造函数。\n\
  \n```cpp\nClass test\n{\n    Char c;\n    Public:\n    Test(); // 构造函数\n};\n\nClass\
  \ test\n{\n    Int a;\n    Public:\n    Test(); // 构造函数的声明\n    Test::Test() //\
  \ 定义构造函数\n    {\n        A=1;\n    }\n};\n```\n\n### 析构函数 (Destructors)\n\n析构函数是特殊的类函数，负责在对象超出作用域时销毁对象。当对象超出作用域时，编译器会自动调用构造函数。\n\
  \n析构函数的语法与构造函数相同，唯一的区别是使用波浪符号 `~` 进行声明。此外，析构函数没有参数。\n\n```cpp\nClass test\n{\n \
  \   Public:\n    ~test(); // test 的析构函数\n};\n```\n\n### 调用构造函数和析构函数的示例\n\n```cpp\n\
  Class test\n{\n    Test()\n    {\n        cout << \"a constructor been called\"\
  ;\n    }\n    ~test()\n    {\n        cout << \"a destructor been called\";\n  \
  \  }\n};\n\nInt main()\n{\n    Test test1; // 构造函数被调用\n    Int a=1;\n    If(a)\n\
  \    {\n        Test test2; // 再次调用构造函数\n    } // test2 超出作用域，并调用了它的析构函数\n}\n```\n\
  \n在创建类时，你希望它们尽可能易于使用。任何类都可能需要提供一些基本操作：\n- 它需要初始化自己\n- 它需要清理内存和/或资源\n- 它需要复制自己\n\n\
  所有这些对于创建良好的数据类型都非常重要。我们将使用测试来演示这一点。字符串必须能够即使在为空时也能进行初始化。它们应该依赖外部代码来实现这一点。一旦字符串被声明，就可以立即使用。当你完成它的操作后，它必须能够清理，因为所有字符串都分配了内存。当类被使用时，不需要调用另一个方法来完成；类会自动完成。最后，它必须能够像整数在变量之间复制一样，从一个变量复制到另一个变量。所有这些功能都应该是类的一部分，以便能够被轻松使用。\n\
  \n我们将逐个处理这三个特性，并看看 C++ 如何让这一切变得简单。\n\n### 对象构造 (Object construction)\n\n你可能已经注意到，我们在棋盘接口（代码的公开部分）中没有任何用于初始化棋盘的代码。我们现在可以修复这个问题。当声明一个类变量时，该变量需要能够被初始化：\n\
  \n```cpp\nChessboard board;\n```\n\n当声明一个对象时，运行它的代码被称为构造函数，它应该设置好对象，使其不需要初始化。构造函数也可以接受参数——你在声明特定大小的\
  \ vector 时已经见过了：`vector<int> v(10 );`。\n\nvector 构造函数被调用时值为 10；新 vector 通过构造函数初始化，使其能够立即容纳\
  \ 10 个整数。创建一个构造函数无非是声明一个与类名同名、没有参数且没有返回值的函数。你甚至不需要给它一个 `void` 值；返回值不提供任何类型：`enum\
  \ space { empty_square, white_pawn /* and others */ };`, `enum playercolor { pc_white,\
  \ pc_black };`。\n\n```cpp\nClass chessboard\n{\n    Public:\n    Chessboard ();\
  \ // 完全没有返回值！\n    playercolor getmove ();\n    space getpiece (int x, int y);\n\
  \    Void make_move (int from_x, int from_y, int to_x, int to_y);\n    Private:\n\
  \    space _board[ 8 ][ 8 ];\n    playercolor whose_move;\n};\n\nChessboard::Chessboard\
  \ () // 没有返回值\n{\n    Whose_move = pc_white;\n    // 首先清空整个棋盘，然后添加棋子\n    For (\
  \ int i = 0; i < 8; i++ )\n    {\n        for (int j = 0; j < 8; j++ )\n       \
  \ {\n            // ... 代码\n        }\n    }\n}\n```\n\n现在注意上面的构造函数位于公开部分。如果我们不把它设为私有，我们就无法创建任何对象实例。构造函数在创建对象的同一行被调用：\n\
  \n`Chessboard board; // 调用构造函数`\n\n或者在分配内存时：\n\n`Chessboard *board = new chessboard;\
  \ // 这在内存分配时调用构造函数`\n\n当声明多个对象时，构造函数按照对象声明的顺序运行：\n\n`Chessboard a;`\n`Chessboard\
  \ b;`\n\n像这样传递参数给构造函数：\n\n`Chessboard board( 8 ); // 8 是 chessboard 构造函数的参数`\n\n\
  当你使用 `new` 关键字时，传递参数看起来调用了构造函数。可以通过参数类型进行重载，如果存在不同的初始化方法。例如，可以为 chessboard 创建第二个构造函数来接收棋盘大小：\n\
  \n```cpp\nClass chessboard\n{\n    Chessboard ();\n    Chessboard (int board_size);\n\
  };\n```\n\n函数的定义与任何类方法相同：\n\n```cpp\nChessboard::Chessboard (int board_size)\n{\n\
  \    // ... 代码\n}\n```\n\n关于语法的说明：虽然括号用于传递参数，但你不能用它们来声明无参数构造函数的对象。\n\n你不能这样做：\n\n\
  `Chessboard board();`\n\n\n\n\n正确的格式是：\n\n`Chessboard board;`\n\n然而，在使用 `new` 关键字时，可以使用括号：\n\
  \n`Chessboard *board = new board();`\n\n这是 `c++` 解析中一个令人遗憾的小缺陷，因为这些细节被隐藏得非常晦涩。只需在声明带有无参数构造函数的对象时**不要**使用括号即可。\n\
  \n那么，如果没有声明构造函数会发生什么呢？\n\n如果没有声明构造函数，`c++` 会创建一个。它不会接受参数，也不会初始化 `ints`、`chars` 或任何其他原始类型，但它会通过调用每个类的默认构造函数来初始化每个类字段。\n\
  \n通常情况下，你应该创建构造函数以确保所有内容都得到妥善初始化。一旦声明了构造函数，`c++` 就不会为你生成默认构造函数了。编译器假设你完全清楚自己在做什么，并且你将会创建你所需的构造函数。特别是，如果你创建了带参数的构造函数，代码将不再拥有默认构造函数，除非你显式地声明一个。\n\
  \n这可能会导致意外的后果。如果使用了自动生成的构造函数，然后你添加了一个带参数的非默认构造函数，那么依赖于自动构造函数的代码将无法编译。提供默认构造函数是你的责任，因为编译器不会为你做这件事。\n\
  \n### 初始化列表和 const 字段\n\n如果类字段被声明为 `consts`，则必须在列表中初始化：\n\n```cpp\nConstholder\n\
  {\nPublic:\n    Constholder (int val);\nPrivate:\n    Const int _val;\n};\n\nConstholder::Constholder\
  \ ()\n: _val( val )\n{}\n```\n\n`Const` 字段不能通过赋值来初始化，因为这些字段一旦设置就无法更改。类尚未完全形成的唯一地方就是初始化列表，因此不可变对象可以在那里安全地设置。出于相同的原因，如果一个字段是引用，它也必须在列表中初始化。\n\
  \n## 第 8 章：库\n\n### 标准模板库 (STL)\n\n能够编写自己的数据结构是件好事。然而，正如你可能已经意识到的，这并不常见。但你并不是无缘无故之前的所有内容。你现在已经学习了许多如何根据需要构建数据结构，以及一些在编写数据结构时可能用到的更常用的结构。\n\
  \n不过，`c++` 有一个非常酷的功能：一个可以复用的巨大代码库。它被称为标准模板库（`stl`），包含了最常见的数据结构，包括基于二叉树和链表的构建结构。这些结构允许你在创建它们时指定它们将存储什么数据类型，以便它们可以用于任何地方——结构化数据、字符串、`ints`\
  \ 等。\n\n因为你拥有这种灵活性，`stl` 在很多情况下可以消除你构建自己数据结构的需求。使用它可以从以下几个方面提升你的代码水平：\n\n- 你可以开始根据所需的结构来思考代码，而不是必须亲自思考如何构建和实现它们。\n\
  - 你可以免费且方便地访问最佳数据结构实现，其空间使用和性能都针对大多数问题进行了优化。\n- 你不再需要担心数据结构内存的分配和释放。\n\n然而，像万事万物一样，使用该库也有其权衡：\n\
  \n- 你需要学习 `stl` 接口以及应该如何使用它们。\n- 当你使用 `stl` 遇到编译器错误时，它们极其难以阅读和理解。\n- 你无法在库中找到所有的数据结构。\n\
  \n彻底讨论 `stl` 需要一整本书，所以我只会为你概括你将从 `stl` 中使用的最常用结构。\n\n#### Vectors (向量)\n\n`stl`\
  \ 中包含一种数组的替代品——vector。这非常像数组，但它是自动调整大小的；你不再需要担心分配内存和移动元素。然而，vector 的语法与标准数组不同。\n\
  \n数组的语法是：\n```cpp\nint_array[10];\n```\n\n而 vector 的语法是：\n\n```cpp\n#include <vector>\n\
  using namespace std;\nvector<int> vector(10);\n```\n\n必须包含 vector 头文件以及 `namespace\
  \ std`。这是因为像 `cout` 和 `cin` 一样，`vector` 是标准库的一部分。此外，当声明 `vector` 时，你必须提供存储在 vector\
  \ 中的数据类型。这是通过角括号 `<>` 完成的：\n\n```cpp\nvector<int>\n```\n\n这利用了 `c++` 的一种名为模板（templates）的功能。`vector`\
  \ 代码的编写方式允许存储任何数据类型。你所做的就是告诉编译器 vector 正在存储什么类型。这实际上意味着我们这里有两种类型：数据结构类型（它决定了数据组织组织的方式）以及在数据结构中持有的数据类型。使用模板允许你在数据结构内部将不同的结构类型与不同的数据类型结合起来。\n\
  \n最后，当提供 vector 大小时，它必须放在括号中而不是中括号：\n\n```cpp\nvector<int> vector(10);\n```\n\n\
  这是用于某些变量类型初始化的语法。为此，`10` 的值被传递给称为构造函数的初始化函数，它设置了 vector 的大小。在我们引导学习的过程中，你将学习构造函数以及带有构造函数的对象。\n\
  \n一旦创建了 `vector`，就可以像数组一样访问单个元素：\n\n```cpp\nfor ( int i = 0; i < 10; i++ )\n{\n\
  \    vector[i] = 0;\n    _array[i] = 0;\n}\n```\n\n### 在 vector 上调用方法\n\n`vector`\
  \ 提供的功能比数组多得多。你可以进行各种操作，例如在 vector 末尾添加元素。`vector` 提供了函数来帮助此类操作，但函数的语法与我们之前使用的语法不同。\n\
  \n`vector` 使用了一种名为方法（methods）的 `c++` 功能，如下所示：\n\n```cpp\nvector.size();\n```\n\n\
  这是在 `vector` 上调用 `size()` 方法，它返回该大小。这非常像访问结构体字段，但你是在调用与结构体相关的方法。虽然方法对 `vector` 做了某些操作，但\
  \ `vector` 不需要作为参数传递给方法。语法已经知道要把 `vector` 作为隐式参数传递到 `size` 方法中。\n\n下面的语法\n`<variable>.<function\
  \ call>(<args>);`\n\n可以被认为调用一个与变量类型相关的函数。换句话说，它有点像写成：\n`<function call>(<variable>,\
  \ <args>);`\n\n在示例 `vector.size();` 中：\n\n它就像是写成：\n`Size(vector);`\n\n其他 vector\
  \ 特性\n\n\n\n\n`vector` 还可以让增加存储的项数变得非常容易，而不需要重新分配内存。例如，向 `vector` 中添加额外的项可以如下所示：\n\
  \n```\nA_vector.push_back( 10 );\n```\n\n这在 `vector` 的末尾添加了另一个值为 10 的项。`vector`\
  \ 会自动处理大小调整工作。如果你想用数组实现此操作，则必须分配内存、复制值并添加新项。虽然 `vector` 确实会进行内存分配和复制，但它是以一种智能的方式完成此的，使其不需要在每次添加新项时都重新调整大小。\n\
  \n然而，尽管你可以使用 `push_back` 向 `vector` 的末尾添加项，但单独使用括号的操作效果是不相同的。括号让你只能处理已经分配过的数据，这主要是为了防止在你不自知晓的情况下进行内存分配。\n\
  \n所以，像下面这样的代码：\n\n```\nVector<int> a_vector( 10 );\nA_vector[ 10 ] = 10; // 最后一个有效元素是\
  \ 9\n```\n\n是无法运行的，并且可能导致程序崩溃。更不用说，它是危险的。像这样写：\n\n```\nVector<int> a_vector( 10\
  \ );\nA_vector.push_back( 10 ); // 为 vector 添加一个新元素\n```\n\n就可以调整 `vector` 的大小了。\n\
  \n# 映射 (Maps)\n\n我们之前提到过 map 使用一个值来查找另一个值，这在编程中很常见，例如当你想实现一个邮箱地址簿（通过名称查找地址），或者一个通过账户号码查找账户或允许用户登录游戏的程序。\n\
  \nSTL 为我们提供了 `map` 类型，允许我们指定键（key）类型和值类型。一个示例是存储邮箱地址簿的数据结构；可以如下实现：\n\n```cpp\n#include\
  \ <map>\n#include <string>\n\nUsing namespace std;\n\nMap<string, string> name_to_email;\n\
  ```\n\n我们必须告诉该结构有两种类型：`string` 作为键，另一个 `string` 作为值（在此例中，是邮箱地址）。\n\n这些 map 的有用功能之一是，当使用\
  \ map 时，语法也可以像数组一样使用。如果你想添加值，它非常像数组，区别是使用键类型代替整数：\n\n```cpp\nname_to_email[ “billy\
  \ bunter” ] = “billybunterthise.mailaddress.com”;\n```\n\n从 map 中获取值也大相同：\n\n```cpp\n\
  Cout << name_to_email[ “billy bunter” ];\n```\n\n你获得了数组的简单性，同时拥有了存储任何想要类型的能力。更棒的是，与\
  \ `vector` 不同，map 的大小在使用 `[]` 运算符添加元素之前不需要设置。\n\n从 map 中移除项也同样简单。假设你和 billy bunter\
  \ 闹翻了，想从从你的地址簿中移除他。你可以使用 `erase` 方法来做到：\n\n```cpp\nname_to_email.erase( “billy bunter”\
  \ );\n```\n\n你可以使用 `size()` 方法来检查 map 的大小：\n\n```cpp\nname_to_address.size();\n\
  ```\n\n使用 `empty()` 方法查看 map 是否为空：\n\n```cpp\nIf ( name_to_address.empty() )\n{\n\
  Cout << “地址簿是空的。我希望你没有删掉它。”;\n}\n```\n\n不要将此与清空 map 的方法混淆。清空是使用 `clear()` 方法完成的：\n\
  \n```\nname_to_address.clear();\n```\n\n由于 STL 中命名规范的一致性，相同的方法也可以用于 vector。\n\n\
  ## 迭代器 (Iterators)\n\n除了数据存储和单独访问的能力外，你还可以通过数组或 vector 遍历数据结构中的所有项，这只是使用长度来读取每个元素的一种情况。但对于\
  \ map，因为它们同时具有数值型和非数值型的键，你不能总是通过计数器进行迭代。为了解决这个问题，STL 为我们提供了迭代器，它是一个允许你访问数据结构元素的变量，即使该数据结构通常没有很好的方法可以做到这一点。我们将从查看如何在\
  \ vector 中使用迭代器开始，然后转向元素。其思想是迭代器将存储结构中的位置，以便你可以使用该位置来访问元素。当你调用迭代器上的方法移动到下一个元素时。\n\
  \n声明迭代器需要一些特殊的语法。对于一个整数型 vector，它看起来像这样：\n\n```\nVector<int>::iterator\n```\n\n\
  这句话的意思是你有一个 `vector`，并且想要一个适用于特定类型的迭代器，这就是为什么我们使用 `::iterator`。因为迭代器标记了结构中的位置，所以是从数据中请求迭代器：\n\
  \n```cpp\nvector<int> c;\nc.push_back( 1 );\nc.push_back( 2 );\nvector<int>::iterator\
  \ itr = c.begin();\n```\n\n`begin()` 方法调用将返回一个允许你访问 `vector` 第一个元素的迭代器。迭代器可以被类似于指针——提到结构中的元素位置，或使用它来获取元素。在我们的情况下，我们使用这种语法读取\
  \ `vector` 的第一个元素：\n\n```cpp\nCout << *itr; // 输出 vector 的第一个元素\n```\n\n我们使用 `*`\
  \ 运算符与指针相同；考虑到两者都存储位置，这是合乎逻辑的。如果你想要下一个元素，则递增迭代器：\n\n```\nItr++;\n```\n\n这让迭代器知道它需要移动到下一个元素。也可以使用前缀运算符：\n\
  \n```\n++itr;\n```\n\n你可以通过与迭代器和 `end` 迭代器进行比较来判断是否已到达末尾；要这样做，请调用：\n\n```\nc.end();\n\
  ```\n\n如果你想要遍历整个 vector 的代码，它看起来像这样：\n\n```cpp\nFor ( vector<int>::iterator itr\
  \ = c.begin(); itr != c.end(); ++itr )\n{\nCout << *itr << endl;\n}\n```\n\n我们可以使用类似的方法遍历\
  \ map，但请记住 map 不存储单值；它存储键/值对。当对迭代器解引用时，它有两个字段——一个键，一个值：\n\n```cpp\nInt key = itr->first;\
  \ // 从迭代器获取键\nInt value = itr->second; // 从迭代器获取值\n```\n\n下面的代码是以易读的格式显示 map 的内容：\n\
  \n```cpp\nVoid displaymap (map<string, string> map_to_print)\n{\nFor ( map<string,\
  \ string>::iterator itr = map_to_print.begin(), end = map_to_print.end(); itr !=\
  \ end; ++itr )\n{\nCout << itr->first << \" —> \" << itr->second << endl;\n}\n}\n\
  \n```这段代码与遍历 vector 非常相似；区别在于使用了 map 数据结构以及迭代器的第一个和第二个字段。\n\n# 检查 map 中的值\n\n有时你想能够查看给定的键是否已存储在\
  \ map 中。假设你正在地址簿中查找某人。你使用 `find()` 方法查看指定值是否存在，如果存在，则检索它。返回一个迭代器，它要么具有指定键的对象位置，要么在未找到对象时为结束迭代器。\n\
  \n```cpp\nMap<string, string>::iterator itr = name_to_email.find( “billy bunter”\
  \ );\n\nIf ( itr != name_to_email.end() )\n{\nCout << “再次见到 billy 的感觉真。他的邮箱是: \"\
  \ << itr->second;\n}\n```\n\n\n\n我仅触及了 `stl` 的基础，但你现在已经有了足够的信息来使用该库中的一些基础类型。`vector`\
  \ 可以完全取代数组，如果你不想花时间进行插入和修改，`vector` 也可以用来替代链表。一旦掌握了 `vector` 类型，你几乎没有理由使用数组，而这些理由中的大多数都是高级用法，例如在处理文件输入输出（file\
  \ i/o）时，我们将在指南的末尾讨论这一点。\n\n最实用的单一数据类型是 `map`。使用 `map` 可以轻松编写复杂的程序，而无需过多担心数据结构的创建；相反，你的注意力可以集中在解决问题上。在某些方面，`map`\
  \ 可以替代基础的二叉树。大多数情况下，你不需要深入研究二叉树的实现，除非有特定的性能需求或你明确需要树形结构。\n\n这正是 `stl` 真正的威力所在：在\
  \ 80% 的时间里，它为你提供了所需的内核结构，让你能够自由编写解决问题的代码。而在其余的时间，你需要相关知识来构建和实现自己的数据结构。\n\n有些程序员更倾向于使用自己的代码而不是现成的代码。大多数时候，你不应该使用自己的数据结构；内置的结构更快、更好且更完整。然而，了解如何构建确实会让你对使用它们有更深刻的见解。\n\
  \n那么，你什么时候可能想使用自己的结构呢？假设你想要一个计算器，允许用户输入算术表达式，然后按照正确的运算顺序对输入进行求值。例如 `4*9+8/3`，其评估方式是在加法之前完成除法和乘法。\n\
  \n这种结构可以很容易用树来考虑。你可以这样表示 `4*9+8/3`：\n\n```\n+\n/\n4 *8 3\n```\n\n每个节点通过两种方式之一进行评估：\n\
  \n- 如果节点是数字，则返回该值。\n- 如果节点是操作符，则计算两个子树的值并执行操作。\n\n构建这样一树需要一个原始数据结构；你不能只用 `map`。如果你只有\
  \ `stl`，处理这个问题将会很困难。然而，一旦你理解了递归和二叉树，就会变得简单得多。\n\n# 第 9 章：stl\n\n## 容器、算法、迭代器\n\n\
  一个常见的误区是将 C++ 标准库称为 `stl`。`stl`，或标准模板库，是过去某个时候开发的标准。C++ 标准库是一组模板，其中许多是从 `stl` 中采纳。`stl`\
  \ 现在已经被弃用，但仍保留了一些极其实用的模板。\n\n标准库以容器（containers）的形式为这个问题提供了解决方案。容器管理相同类型的数据集。它们包括\
  \ `vectors`、`sets` 和 `lists` 等。\n\n`vectors` 与数组非常相似，但它们会处理自己的存储和大小。\n\n就像字符串一样，你需要导入\
  \ `vector` 库来使用该模板：\n\n```cpp\n#include <vector>\n```\n\n现在你能够访问有关 `vectors` 的所有内容。你可以这样声明一个模板：\n\
  \n```cpp\ntemplate<type> name;\n```\n\n假设我们回到之前的示例，创建一个自动调整大小的成绩数组。我们会这样声明它：\n\n\
  ```cpp\nvector<int> grades;\n```\n\n如果你使用了推送（push）和弹出（pop）的概念，那么向模板中添加值非常简单。你向 `vector`\
  \ 中 `push` 一个新值，或者从它中 `pop` 出一个值。假设你想添加的第一个成绩是 `55`，我们可以这样做：\n\n```cpp\ngrades.push_back(55);\n\
  ```\n\n你现在已经向 `vector` 添加了你的第一个值。如果你想添加一组值呢？幸运的是，在 C++ 中，你也可以以类似于在数组中使用 `vector.insert()`\
  \ 初始化一组值的方式来插入一组 `vector`。这接受两个参数：你开始插入的索引以及你想要插入的值。如果你在 `vector` 中有多个值，你可以直接使用\
  \ `vector.end()` 来找到插入点。\n\n```cpp\ngrades.insert(grades.end(), {96, 64, 75});\n\
  ```\n\n在之前的版本中，你需要创建一个临时数组来插入数据。\n\n```cpp\nint[] tmp = {96, 64, 75};\ngrades.insert(grades.end(),\
  \ tmp + 4);\n```\n\n为了遍历列表中的每一个项，你可以使用其他语言中被称为 `for each` 循环的东西。如果我们想打印列表中的每一个项，我们将执行以下操作：\n\
  \n```cpp\nfor (int i : grades) {\n    cout << i << \"\\n\";\n}\n```\n\n如果我们使用的不是原始数据类型，而是对象呢？这有支持，我们将使用一种称为迭代器（iterators）的东西。通过迭代器的使用，你可以访问对象的方法（例如字符串的\
  \ `.length()` 或 `.substr()`）。假设我们有一个名为 `j` 的字符串 `vector`，并且想要打印每个字符串的长度，那么：\n\n\
  ```cpp\nfor (string i : j) {\n    cout << i << \" - string length: \" << i.length()\
  \ << \"\\n\";\n}\n```\n\n你可以对创建的任何对象执行此操作，但我们将在下一章实际开始创建对象时更显式地讨论这一点。\n\n另一种类型的容器\
  \ `lists` 的功能与 `vectors` 非常相似。这两种之间的具体差异对于初学者来说是难以理解的。尽管如此，关于这两种容器的通用规则是：通常情况下应该使用\
  \ `vector`，除非你必须在容器末尾以外的地方不断添加或删除元素。\n\n另一种类型的容器称为关联容器（associative container），它以键值对和映射值进行格式化。它通常根据键进行排序。最著名的关联容器类型被称为\
  \ `map`。当你需要将一组数据与特定特征关联起来时，这非常棒。一个现实世界的例子是，商店的库存系统可以用 `map` 来维护，其中 SKU 代码（整数 -\
  \ 键）和物品名称（字符串 - 映射数据）。\n\n为此，你需要导入 `<map>`并通过并通过方式声明 map：\n\n```cpp\nmap<int, string>\
  \ inventory;\ninventory[00400030] = \"tamagotchi, blue\";\ninventory[00400031] =\
  \ \"tamagotchi, white\";\ninventory[00324359] = \"twilight, dvd\";\ninventory[44539294]\
  \ = \"dark souls, xbox 360\";\n```\n\n如果你想在代码后面调用某个特定元素，可以执行类似的操作：\n\n```cpp\ncout\
  \ << \"inventory[00400030] is: \" << inventory[00400030] << \"\\n\";\n```\n\n调用\
  \ `inventory[00400030]` 将打印映射值，这里是 \"tamagotchi, blue\"。\n\n另一种关联容器是 `set`。`set`\
  \ 的功能与 `map` 非常相似，只是它们不允许重复。`map` 允许重复的值，但不允许重复的键。\n\n\n\n\n我们已经读到了本书的末尾，但这只是你编程生活这段漫长且果实累累旅程的开始。掌握了\
