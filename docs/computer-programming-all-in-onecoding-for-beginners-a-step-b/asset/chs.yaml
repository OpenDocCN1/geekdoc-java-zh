- "# 计算机编程全集：初学者编码指南：从零开始学习 Python、Java、SQL、C、C++、C#、HTML 和 CSS 的逐步进阶指南\n\n\n\n\n\n\
  \n\n\n\n# 第 1 本书：初学者 Python\n\n进入编程领域的权威初学者指南，向你介绍 Python 编程语言\n\n## 引言\n\nPython\
  \ 编码语言是你通过学习更多计算机、学习如何编码、甚至制作一些游戏和应用程序来开启之旅的极佳方法。这是最适合入门的语言之一，因为它简单、基于英语，而且许多决定开始学习编程语言的人自然地会喜欢它。本指南将花费一些时间讨论\
  \ Python 语言，并帮助你学习一些相关的基础知识，以帮助你上手。\n\n虽然 Python 语言是一种简单且基础、非常适合初者的语言，但它也拥有强大的功能，当你编写代码时会从中获得乐趣。在本指南中，你将学习入门\
  \ Python 语言所需的所有知识，并使其满足你的需求。这本书主要面向对编程较新的人群，更具体地说，是那些想要探索 Python 世界的人。这本书将带你了解编程和\
  \ Python 的基础知识。计算机编程听起来很可怕，但其实并不是。最难的部分是选择你想学习哪种语言，因为有太多的选择了。Python 是所有计算机编程语言中最简单的之一；事实上，你需要的一切就在那里，供你调遣。你所做的就是学习如何使用程序提供的内容来编写程序。请继续读完整本书，获取知识，并了解关于这一特定主题需要的关键事项。如果你像我一样对学习一切\
  \ Python 以及如何用它编程感到兴奋，那么让我们开始吧。\n\n## 第 1 章：Python 中的数据类型\n\nPython 数据类型\n\n\n\n\
  \n\n接下来我们需要查看的是 Python 数据类型。Python 中的每个值都有其特定的数据类型。\n\n### Python 数字\n\n我们可以处理的\
  \ Python 数据类型的第一种选择包括 Python 数字。这些将包括复数、浮点数，甚至是整数等内容。它们在 Python 中分别被定义为 `complex`、`float`\
  \ 和 `int` 类。例如，我们可以使用 `type()` 函数来识别一个值或变量属于哪个类别，然后使用 `isinstance()` 函数来审计一个对象是否存在于特定的类。\n\
  \n当我们处理整数时，它们可以是任意长度的，限制仅在于计算机上可用内存的大小。然后是浮点数。\n\n这种数字的精度可以达到 15 位小数，你也可以选择较小的位数。\n\
  \n浮点数通过小数点分隔。`1` 是一个整数，而 `10` 将是一个浮点数。\n\n最后，我们有复数。这些数字通常被写为 `x + y` 的形式，其中 `x`\
  \ 是实部，而 `y` 是虚部。我们需要将这两部分结合起来构成这种数字所需的复数。\n\n### Python 列表\n\nPython 列表是一个系列有序的项。它是\
  \ Python 中使用最频繁的数据类型之一，且具有极高的响应性。\n\n列表中显示的所有项可以是相似的，但这不是强制要求。你可以在列表中处理许多不同类型的项，而不需要它们相同，这样更容易操作。\n\
  \n声明列表是一个我们可以使用的简单直接。。项之间用逗号分隔，然后只需要将它们包含在这样的括号中，例如：`[]`。我们还可以使用切片运算符来帮助我们从列表中获取某部分或一组项。\n\
  \nPython 中的索引从 0 开始。在处理这些列表时，我们必须记住列表是**可变**（mutable）的。这意味着你列表上的元素值可以被更改或更新。\n\n\
  Python 中的列表是最基本的数据结构，因为它们属于序列。列表内部的元素都被分配了一个数字。换句话说，它们都有一个被分配的位置。列表不仅简单，而且功能多变。\n\
  \n在创建列表时，对象之间用逗号分隔，所有这些对象都将位于一组方括号内。列表中的项不需要具有相同的数据类型。\n\n### 示例\n\n```python\n\
  First list = ['science', 'history', 2002, 2030] ;\nSecond list = [2, 4, 6, 8, 10];\n\
  Third list = [\"b\", \"d\", \"e,\", \"g\"]\n```\n\n列表的索引从零开始，你将能够对其进行切片，以便在想要获取列表内部的值时创建子列表，从而在特定的索引处进行切片。\n\
  \n### 示例\n\n```python\n#! usr bin/python\nFirst list = ['science', 'history', 2002,\
  \ 2030] ;\nSecond list = [2, 4, 6, 8, 10];\n\nprint(First list[2])\nprint(Second\
  \ list[2:4])\n```\n\n**输出**\n```\nFirst list [2]: 2002\nSecond list [2:4]: [6, 8]\n\
  ```\n\n### Python 字符串\n\nPython 字符串是封装在引号内的字符序列。在 Python 中可以使用任何类型的引号，单引号、双引号或三引号。要访问字符串元素，我们使用从索引\
  \ 0 开始的切片运算符，这意味着第一个字符位于索引 0。这在你需要访问字符时非常用。在 Python 中拼接字符串我们使用 `+` 运算符，而星号 `*` 则用于重复。\n\
  \n示例：\n\n```python\n#! Usbin/python3\nThanks = 'thank you'\nprint(thanks) # 打印完整字符串\n\
  print(thanks[0]) # 打印字符串的第一个字符\nprint(thanks[2:7]) # 打印字符串的第 3 到第 7 个字符\nprint(thanks[4:])\
  \ # 从字符串的第 5 个字符开始打印\nprint(thanks * 2) # 打印两次字符串\nprint(thanks + \" again!\") #\
  \ 打印一个拼接后的字符串\n```\n\n程序将输出以下内容：\n![Image0003.jpg](img/Image0003.jpg)\n\n注意我们有以\
  \ `#` 符号开头的文本。该符号表示注释的开始。python `print` 不会对从符号到行尾的文本执行操作。注释旨在通过解释来增强代码的可读性。定义了一个名为\
  \ `thanks` 的字符串，值为 `thank you`。`thanks[0]` 帮助我们访问字符串的第一个字符。你还会注意到两个单词之间的空格被算作一个字符。\n\
  \n我们可以使用单引号或双引号来显示我们的字符串，但我们需要确保开头使用的引号类型与结束时使用的类型一致，否则会导致编译器产生一些困惑。我们甚至可以使用三引号来处理多行字符串。\n\
  \n正如我们在上面讨论的元组或列表所看到的，切片运算符也可以用于字符串。而且正如我们在元组中看到的那样，字符串是**不可变**（immutable）的。\n\n\
  ### Python 集合\n\n列表中的下一个是 Python 集合。集合是 Python 中的一个选项，包含一个无序的唯一集合。集合由逗号分隔的值来定义。集合中的元素是没有顺序的，因此我们可以按照任何方式使用它们。\n\
  \n我们可以同时对两个集合执行并集或交集操作。我们处理的集合将是唯一值，它们将确保消除重复项，因为集合是一个无序编译。因此切片运算符不适用于这种选项。\n\n\
  ### Python 列表\n\n列表由封装在方括号（`[]`）内的项组成，项之间用逗号（`,`）分隔。它们类似于 C 语言的数组。虽然数组元素必须属于相同类型，但列表支持在单个列表中存储属于不同类型的项。\n\
  \n\n\n\n\n![Image00004.jpg](img/Image00004.jpeg) 这里的，上述代码的操作内容与之前处理字符串的代码没有太大区别。执行时，程序输出：\n\
  \n在“print lista” 语句中，我们打印了 `lista` 的内容。注意，每个元素都被视为其对应索引上的一个整体，例如，元素‘john’被视为索引为\
  \ 0 的列表中的单个元素。\n\n### Python 元组 (Tuples)\n\n元组与列表的相似之处在于，它们都是对象的序列，但元组是**不可变**的（immutable）。\n\
  \n你可以使用圆括号来创建元组，也可以不使用括号，你只需要确保在元组中想要包含的不同对象之间使用逗号即可。\n\n### 示例：\n\n```python\n\
  Tup1 = ('science', 'history', 2002, 2030)\nTup2 = (5, 9, 7, 4, 2)\nTup3 = \"f\"\
  , \"b\", \"e,\", \"t\"\n```\n\n要写一个返回空元组的元组，需要使用 `tuple()` 函数和一组空圆括号。\n\n我们也可以处理所谓的\
  \ Python 元组。元组是一个有序的组件序列，与列表是重复的，但有时很难看出它们之间的相似之处和不同之处。\n\n我们将看到的元组和列表之间巨大的差异在于，元组是**不可变**的。\n\
  \n元组一旦创建，就是无法修改的。\n\n元组用于写保护数据，而且它们的运行速度通常比列表更快，因为它们不能主动移动。元组通过圆括号 `()` 确定，就像列表一样，项之间也用逗号分隔。\n\
  \n我们然后可以使用切片运算符（slicing operator）来帮助我们选取想要某些组件，但在编写代码或运行程序时，我们仍然无法更改值。\n\nPython\
  \ 元组与列表相似，区别在于创建元组后；你无法添加、删除或更改元组元素。元组元素应该包含在圆括号 `()` 内。示例：\n\n```python\n#!/usr/bin/python3\n\
  \nT1 = () # 创建一个空元组，没有数据\nT2 = (22, 34, 55)\nT3 = tuple([10, 23, 78, 110, 89]) #\
  \ 从数组创建元组\nT4 = tuple(\"xyz\") # 从字符串创建元组\n\nprint(t1)\nprint(t2)\nprint(t3)\n```\n\
  \n![Image00005.jpg](img/Image00005.jpeg) `print(t4)`\n\n将打印这 4 个元组的值：\n\n有许多函数可以应用于元组上。示例：\n\
  \n```python\n#!/usr/bin/python3\n\nT1 = (23, 11, 35, 19, 98)\n\nprint(\"the minimum\
  \ element in the tuple is\", min(t1))\nprint(\"the sum of tuple elements is\", sum(t1))\n\
  print(\"the maximum element in the tuple is\", max(t1))\nprint(\"the tuple has a\
  \ length of\", len(t1))\n```\n\n执行时，它得到如下结果：\n\n![Image00006.jpg](img/Image00006.jpeg)\n\
  \n首先，我们调用了 `min()` 函数，它返回元组中的最小元素。然后我们调用了 `sum()` 函数，它返回元组元素的总和。`max()` 函数返回了元组中的最大元素。`len()`\
  \ 函数统计了元组中的所有元素并返回数量。\n\n你可以使用切片运算符访问元组的某些元素，而不是全部。示例：\n\n```python\n#!/usr/bin/python3\n\
  \nt = (23, 26, 46, 59, 64)\n```\n\n![Image00007.jpg](img/Image00007.jpeg) `print(t[0:2])`\n\
  \n执行时，它打印：我们使用切片运算符访问元组中从索引 0 到 2 的元素，注意元素从索引 0 开始。\n\n### Python 字典 (Dictionaries)\n\
  \nPython 字典用于存储键值对。通过字典，你可以使用键（key）来检索、删除或修改值（value）。字典也是可变的，意味着一旦声明，你就可以修改它们的值。\n\
  \n要创建字典，我们使用大括号 `{}`。每个字典项都有一个键，后跟一个值，项之间用逗号分隔。示例：\n\n```python\n#!/usr/bin/python3\n\
  \nclassmates = {\n    'john': '234-221-323',\n    'alice': '364-32-141'\n}\n```\n\
  \n我们创建了一个名为 `classmates` 的包含两个项的字典。注意键必须是可哈希类型（hashable），但你可以使用任何值。每个字典键必须是唯一的，第一个元素\
  \ john 是键，后面是值；第二个元素 alice 是键。要访问字典元素，请使用字典名和键。示例：\n\n```python\n#!/usr/bin/python3\n\
  \nclassmates = {\n    'john': '234-221-323',\n    'alice': '364-32-141'\n}\n\nprint(\"\
  the number for john is\", classmates['john'])\n```\n\n![Image00008.jpg](img/Image00008.jpeg)\
  \ `print(\"the number for alice is\", classmates['alice'])`\n\n最后两个元素帮助我们访问字典值。它打印：要知道字典的长度，请如下所示运行\
  \ `len()` 函数：\n\n```python\nlen(classmates)\n```\n\n上述操作将返回 2，因为字典只有两个元素。\n\n在用\
  \ Python 工作时，字典在大括号内定义，每个组件都是 `key: value` 形式的组合。键和值可以根据你想要编写的代码类型是任何类型。我们也可以使用键来帮助检索所需的相应值，但我们完全无法反过来以那种方式进行工作。\n\
  \n处理不同类型的数据对于你在 Python 编码中进行的所有工作都至关重要，并且在处理数据科学时可以为你提供帮助。看看 Python 语言提供的不同数据类型。\n\
  \n### 类型转换 (Datatype conversion)\n\nPython 允许将数据从一种类型转换为另一种。从一种数据类型转换为另一种的过程被称为类型转换（type\
  \ casting）。\n\n如果你需要将整数类型转换为浮点类型，可以调用 `float()` 函数。示例：\n\n```python\n#!/usr/bin/python3\n\
  \nheight = 20\n\nprint(\"the value of height in int is\", height)\nprint(\"the value\
  \ of height in float\", float(height))\n```\n\n在上述示例中，`height` 初始化为 20。我们调用了 `float()`\
  \ 函数并将 `height` 作为参数。整数值 20 已转换成浮点值 20.0。程序打印如下：\n\n![Image00009.jpg](img/Image00009.jpeg)\n\
  \n要将浮点转换为整数，可以调用 `int()` 函数。示例：\n\n```python\n#!/usr/bin/python3\n\nheight = 20.0\n\
  \nprint(\"the value of height in float is\", height)\n```\n\n![Image00010.jpg](img/Image00010.jpeg)\
  \ `print(\"the value of height in int is\", int(height))`\n\n程序打印如下：我们调用了 `int()`\
  \ 函数并将参数 `height` 传递给它。它将 20.0 转换成了 20，这是一个浮点到整数的转换。\n\n如果你需要将数字转换为字符串，可以调用 `str()`\
  \ 函数。该数字随后将被转换为字符串。示例：\n\n```python\n#!/usr/bin/python3\n\nnum = 20\n\nprint(\"\
  the value of num in int is\", num)\n```\n\n![Image00011.jpg](img/Image00011.jpeg)\
  \ `print(\"the value of num in string is\", str(num))`\n\n程序输出：虽然值相同，但 Python 解释器处理它的方式不同。浮点到字符串的转换也可以类似地进行。\n\
  \n## 第 2 章：变量、运算符、类型及其用途\n\n\n\n\n运算符是表示特定过程实现的符号。它们被用于操作程序中的数据。Python 使用不同类型的运算符。\n\
  \n### 算术运算符\n\n#### 加法 (+)\n加法运算符 `+` 将运算符两侧的操作数相加：\n\n```python\n>>> 12 + 8\n20\n\
  ```\n\n#### 减法 (-)\n减法运算符 `-` 从左侧操作数的值中减去右侧操作数的值。\n\n```python\n>>> 40 – 3\n37\n\
  ```\n\n#### 乘法 (*)\n乘法运算符 `*` 将运算符左侧和右侧的值相乘：\n\n```python\n>>> 20 * 3\n60\n```\n\
  \n#### 除法 (/)\n除法运算符 `/` 将左操作数除以右操作数的值：\n\n```python\n>>> 20 / 5\n4.0\n```\n\n####\
  \ 幂 (**)\n幂运算符 `**` 将第一个操作数提升到第二个操作数所指定的幂。\n\n```python\n>>> 4**4\n256\n```\n\n\
  #### 取模 (%)\n取模运算符 `%` 返回左操作数除以右操作数后的余数。\n\n```python\n>>> 38%5\n3\n```\n\n####\
  \ 整除 (//)\n整除运算符 `//` 执行左操作数除以右操作数的除法，并返回整数商，同时舍弃小数部分。\n\n```python\n>>> 35//3\n\
  11\n```\n![Image00012.jpg](img/Image00012.jpeg)\n\n### 比较运算符\n\n### 逻辑运算符\nPython\
  \ 支持 3 逻辑运算符：\n\n- **或 (Or)**: `x or y`，如果 `x` 为假，则计算 `y`；否则，返回 `x` 的求值。\n- **与\
  \ (And)**: `x and y`，如果 `x` 为假，则返回 `x` 的求值；否则，如果 `x` 为真，则计算 `y`。\n- **非 (Not)**:\
  \ `not x`，如果 `x` 为假，返回 `true`；否则，如果 `x` 为真，返回 `false`。\n\n### 输入与输出\n\n#### 输入\n\
  许多程序需要用户输入才能运行。输入可以来自键盘、鼠标点击、数据库、外部存储或互联网。键盘是收集用户输入最常用的通道。因此，python 特有一个内置的 `input()`\
  \ 函数来识别键盘输入。\n\n#### `input()` 函数\nPython 的 `input()` 函数通过一个名为 `prompt string`（提示字符串）的可选参数交互式地收集键盘输入。每当调用\
  \ `input` 函数时，程序都会显示该 `prompt string`。程序执行会暂停，直到用户对提示输入响应。\n\n为了说明，这里有一个从用户收集收集和年龄信息的简单程序：\n\
  \n```python\nname = input(\"please type your name: \")\nprint(\"welcome, \" + name\
  \ + \"!\")\nage = input(\"how old are you, \" + name + \"? \")\nprint(\"thank you.\
  \ you are \" + name + \" and you’re \" + age + \" years old.\")\n```\n\n当你运行程序并为姓名输入\
  \ `marky`，为年龄输入 `24` 时，屏幕按行显示的内容如下：\n```\nplease type your name: marky\nwelcome,\
  \ marky!\nHow old are you, marky? 24\nThank you. you are marky, and you’re 24 years\
  \ old.\n```\n\n#### 输出\nPython 的内置 `print()` 函数用于将数据输出到屏幕（屏幕是标准输出设备）。`print` 命令的语法为：`print(value,)`。\n\
  \n以下是它的用法示例：\n\n```python\n>>> print(\"i am a programming student.\")\nI am a programming\
  \ student.\n>>> print(25)\n25\n>>> print(4**3)\n64\n>>> xyz = 50\n>>> print('the\
  \ value of xyz is', xyz)\nThe value of xyz is 50\n>>> animal = \"rhinoceros\"\n\
  >>> print(animal)\nRhinoceros\n```\n\nPython 允许打印多个值或变量，这些值必须在括号内用逗号分隔。例如，以下是一系列赋值：\n\
  ```python\nA = \"under\"\nB = \"16 years old\"\nC = \"result\"\n>>> print(\"job:\"\
  , A, B, C)\njob: under 16 years old result\n```\n\n#### 输出字符串格式化\n格式化选项允许用户创建更具读性的输出。Python\
  \ 提供了 `.format()` 方法来格式化字符串。使用花括号 `{}` 作为格式化值的占位符。\n\n如果参数在 `.format()` 中的位置与你期望的顺序一致，你可以在打印语句中使用空花括号：\n\
  \n```python\nx = 50\ny = 100\n>>> print(\"the value of x is {} and y is {}\".format(x,\
  \ y))\nThe value of x is 50 and y is 100.\n```\n\n但是，如果你希望参数出现的顺序与它们在 `.format()`\
  \ 语句中的位置不同，你需要在花括号内指定索引。第一个参数的索引为 `0`，第二个参数索引为 `1`，依此类推。\n\n```python\nx = 50\n\
  y = 100\n>>> print(\"the value of y is {1} and x is {0}\".format(x, y))\nThe value\
  \ of y is 100 and x is 50.\n```\n\n这里是其他示例。这次给出的是值，而不是存储在变量中：\n\n\n\n\n这些运算符用于比较操作数的值并识别它们之间的关系。它们包括等于\
  \ (`==`)、不等于 (`!=`)、小于 (`<`)、大于 (`>`)、大于等于 (`>=`) 和 小于等于 (`<=`)。\n\n### 示例：\n\n\
  ```python\n#!/usr/bin/python3\n\nN1 = 6\nN2 = 5\n\nIf (n1 == n2):\n    print(\"\
  the two numbers have equal values\")\nelse:\n    print(\"the two numbers are not\
  \ equal in value\")\n\nIf (n1 != n2):\n    print(\"the two numbers are not equal\
  \ in value\")\nelse:\n    print(\"the two numbers are equal in value\")\n\nIf (n1\
