  \ `i++`，此时 `i` 的值将变为 2。然后继续判断条件并开始下次循环，直到 `i=5` 且条件 `i<=4` 为假，结束循环，执行 for 循环后的代码并打印“sum=10”。\n\
  \n## 第 6 章：类\n\n### 类与对象\n\n在 `c#` 编程语言中，每个组件都与类和对象相关联，这些代表了面向对象编程的基本概念。类类似于原型，用户从原型创建对象。类代表一个单一、唯一的单元，拥有所有的成员、属性和功能。\n\
  \n对象是现实中的内存实体。当实例化时，它们会分配一些内存空间并拥有对该空间的引用。创建的每个对象必须是类类型。\n\n### 类\n\n类代表了任何面向对象软件内部唯一的编程组件。类通过其访问修饰符、`class`关键字和唯一名称来定义。在某些类内部，可能有多个成员，如字段、属性和方法。类的默认访问修饰符是\
  \ `internal`。这意味着如果没有指定访问修饰符，则该类将被视为 `internal`。下面写了一个类的类的示例：\n\n![Image00109.jpg](img/Image00109.jpeg)\n\
  \n该类包含其访问修饰符 – `public`，它包含关键字 `class`；它有一个唯一名称 `tshirt`。在此类内部定义了多个成员：有一个私有字段 `color`、一个公共属性\
  \ `color`、一个定义的构造函数（带有一个参数）以及一个公共方法 `about`。\n\n除了普通类之外，还有一种特殊的类 - 抽象类（abstract\
  \ class）。抽象类是一种特殊的类，不能对其进行实例化。抽象类主要用于在层次结构中定义基类，也被称为不完整的类。抽象类通常代表基类，它的设计目标是让派生类来实现抽象定义。在抽象类中，也可以有抽象方法或非抽象方法。抽象方法以及每个标记为抽象的类成员都必须在派生类中实现。标记有\
  \ `abstract` 关键字的类其目的是为派生类提供原型。抽象类可以实现构造函数。下面提供了一个示例：\n\n![Image00110.jpg](img/Image00110.jpeg)\n\
  \n在提供的示例中，我们可以看到一个名为 `animal` 的抽象类。该类中只有一个成员，即一个抽象空方法 `legsnumber()`。当方法被标记为抽象时，意味着派自该类的每个类（在本例中为\
  \ `animal` 类）必须对该方法的重写实现。在抽象类下面还有两个类，它们是“普通”类。这两个类都对 `animal` 有重写实现。这在章节中定义，但这是可能的，因为\
  \ `animal` 是抽象的。\n\n等待，这个 `the, the, the,` 是 `the` 是 `true` 还是 `false`？`false` `the,\
