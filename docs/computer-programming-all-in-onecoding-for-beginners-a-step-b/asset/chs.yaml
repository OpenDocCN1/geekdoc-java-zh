  \ studio 网站，然后确保点击下载 mac 版的按钮。这应该以 zip 文件的形式下载你需要的内容。\n\n一旦完成设置，你就可以解压文件并将其拖到应用程序（Applications）文件夹。你应该可以在那里运行它。下一步是进入并下载\
  \ C# 扩展。你可以进入 visual studio code，并打开实现该功能所需的扩展。\n\n现在，当你在此过程中进行操作时，你会发现扩展视图的顶部有一个搜索栏。你可以在这里输入“C#”。你需要的是由微软提供的，所以请确保点击这。点击安装，你就可以准备就绪。\n\
  \n但请记住这个过程：C# 语言是为在 Windows 系统上运行得最好而开发的。因此，如果你在 Windows 系统上，你可能发现这种语言易于使用，而且你在编码中寻找的所有功能和特性更有可能出现在你预期的地方。\n\
  \n这并不意味着你完全无法在 mac 电脑上运行它。它仅仅意味着你需要额外花几个步骤来完成设置，而且实现你想要的某些事情可能没有那么容易。花时间在 linux\
  \ 或 mac 电脑上熟悉 C# 语言，对于帮助你在过程中获得最佳结果非常重要。\n\n### 如何获取 C# 编译器\n\n有几种良好的 C# IDE 选项可以使学习变得简单顺畅；在本书中，我们将使用\
  \ visual studio 10 自带的版本。也可以使用旧版本。\n\n如果我们无法获取 visual studio 19 的专业版，一个选项是社区版，即\
  \ visual studio community。它是免费的，并可以直接从门户网站下载：`https://www.microsoft.com/vs/express`。一旦下载了编译器，我们可以从开始菜单中选择它来启动程序。\n\
  \n界面分为两个部分：左侧是搜索栏，我们可以在那里找到最近的项目；在主页的右侧，我们将看到创建新项目、打开文件夹或克隆仓库的选项。安装完成后，我们就能看到界面。\n\
  \n在右侧，有解决方案管理器（solution explorer），它提供了有关我们正在开发的项目的信息。我们将在本书后面的某些窗口中看到显示的细节。\n\n\
  ![Image00094](img/Image00094.jpeg)\n\n在底部，我们找到了另一个窗口；在这个区域，通常是编译器用来与我们通信的部分。例如，我们将看到指示程序错误的窗口；在窗口的顶部，我们将看到菜单和工具栏。\n\
  \n如果由于任何原因我们关闭了源代码编辑器，或者它没有出现在我们的界面中，那么找到它最简单的方法是通过解决方案管理器。只需进入代表你源代码的文档并双击它；显示源代码编辑器的窗口就会出现。\n\
  \n编辑区域允许我们编辑程序，如果我们知道如何使用 microsoft word 或记事本等任何类型的文本编辑器，这非常简单。\n\n\n\n\n为了更熟悉 C#\
  \ Visual Studio，最好的方法是创建第一个项目并进行操作。我们将生成一个小型程序，它会在控制台中向我们发送消息，然后我们将添加其他元素，以便探索用户界面的不同窗口。\n\
  \n## 在 Visual Studio 2019 中创建新项目\n\n在 Visual Studio 2019 中创建新项目主要有两种方法。第一种仅需点击 Visual\
  \ Studio 主界面右下角的 `create new project`。\n\n随后在搜索框中输入 `console`，并选择 `Console App (.NET\
