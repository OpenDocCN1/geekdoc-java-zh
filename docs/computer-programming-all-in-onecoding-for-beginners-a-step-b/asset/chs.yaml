  \ 2 章：声明常量\n\n常量是程序不允许更改的固定值，它们被称为字面量（literals）。常量可以属于任何可用的数据类型。注意，它们是普通的变量，区别在于常量的值在定义后不能更改。\n\
  \n使用预处理器定义常量，我们使用下面的语法：\n\n```\n#define identifier value\n```\n\n标识符（identifier）是常量名，而值（value）表示赋予常量的值。下面的程序描述了如何实现：\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\n\n#define width 7\n#define\
  \ length 11\n\nint main() {\n    int rectangle_area;\n    rectangle_area = length\
  \ * width;\n    cout << \"the area of rectangle is \" << rectangle_area;\n    return\
  \ 0;\n}\n```\n\n在上面的示例中，我们定义了常量，即 `width` 和 `length`。我们分别赋值了 7 和 11。我们还定义了变量 `rectangle_area`，并为其赋值了两个常量的乘积。然后我们打印了这个变量的值。\n\
  \n使用 `const` 关键字\n\n我们也可以通过使用 `const` 关键字来定义常量。要这样做，我们必须使用下面的语法：\n\n```cppconst\
  \ data_type variable = value;\n```\n\n注意，我们必须定义常量的数类型。这次常量的值是通过赋值运算符 (=) 赋值的。让我们来看一个演示此点的示例：\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    const int\
  \ length = 7;\n    const int width = 11;\n    int rectangle_area;\n    rectangle_area\
  \ = length * width;\n    cout << \"the area of rectangle is \" << rectangle_area;\n\
  \    return 0;\n}\n```\n\n我们刚刚创建了相同的示例，这次常量是使用 `const` 关键字定义的。\n\n注意，在编程中，用大写字母命名常量总是好的。\n\
  \n### 使用 C++ 数据类型\n\n现在你已经创建了你的第一个程序，还有其他事情同样重要，甚至比花费每个清醒小时编写代码文档更重要。\n\n每个程序都需要文档，不仅是为了帮助其他程序员理解你的程序，也是为了帮助你在编写多年后理解你的程序。这听起来可能像是在揭露你的魔法代码编写技巧，但在编程世界，在其他程序员对你赞誉之前，你永远算不上成功。使用\
  \ C++ 语言时，你可以通过双斜杠 \"//\" 以注释的形式为你的程序添加文档，编译器将忽略你在同一行中这两个斜杠之间编写的任何内容。\n\n在你的整个编码生涯和工作中，我建议你尽可能经常记录你的工作。此外，你还会发现你写的大部分注释与代码颜色不同。如果你的编译器没有自动实现这一点，你应该手动进行以避免混淆。\n\
  \n这里有一个你可能不知道的有趣事实；几乎每个程序都使用变量。对你来说太“数学化”了？编程中的变量与数学中的变量一样，是一个用于存储值的字母。在编程中，你使用变量来持有不同的数据类型，你需要在运行程序之前声明它们。\n\
  \n因此，为了修复这个问题，你必须按照以下方式为 x 赋值：\n\n```\nX=12;\n```\n\n\n\n\n[content]\n如果我们在程序中使用这个例子，除非另有指定，否则每次使用变量\
  \ `x` 时，它将类似于使用数字 `12`。如此，当你想向屏幕打印某些内容时，操作方法如下。\n\n注意：在这种情况下，我们是将 `x` 打印到屏幕上。\n\n\
  ```cpp\ncout<<x;\n```\n\n如果你有 `c` 语言的先验经验，可能不会察觉到这有什么不同。首先，这里没有 `printf`；其次，没有占位符。这不应该引起引起。在上面的代码中，`cout`\
  \ 中的 ‘c’ 是“console”（控制台）的占位符，因此 `cout` 的意思是 console out（控制输出）。让我们假设一种场景：你不想给程序赋值一个变量，但希望程序在运行时为变量赋值。虽然这听起来可能非常数学化且复杂，但你可以轻松地通过\
  \ `cin` 实现这一点，正如你可能猜的那样，它代表 console in（控制输入）。\n\n![Image00065.jpg](img/Image00065.jpeg)\n\
