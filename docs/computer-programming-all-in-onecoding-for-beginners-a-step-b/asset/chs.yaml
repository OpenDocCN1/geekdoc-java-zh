  \n### 数据处理\n\n现在你已经知道如何加载数据集，让我们探索你处理其中所有信息时需要采取的步骤。首先，我们假设我们需要对几行执行某些特定操作。为了使用任何函数，我们首先需要设置一个掩码（mask）。注意，在这种情况下，掩码是一个布尔值集合，它决定了选定的行。实际示例将消除这一概念，所以让我们开始吧：\n\
  \n```python\nmask_feature = iris['sepal_length'] > 7.0\nprint(mask_feature)\n```\n\
  输出:\n0    False\n1    False\n...\n146   True\n147   True\n148   True\n149   False\n\
  Name: sepal_length, dtype: bool\n\n\n\n\n\n正如你所见，我们只选择了包含独立长度值且大于七的行。这些观测值是用布尔值声明的。接下来，我们将应用掩码（mask）来修改\
  \ `iris virginica` 目标并为它创建一个新标签：\n\n入：`mask_target = iris['target'] == 'iris-virginica'`\n\
  \n入：`iris.loc[mask_target, 'target'] = 'mylabel'`\n\n任何旧的 `iris virginica` 标签出现的地方，现在都将被替换为新标签\
  \ \"mylabel\"。请注意，对于此操作，我们需要使用 `loc` 函数来通过索引访问数据。现在，让我们迈向下一步，查看 `target` 列中包含的标签：\n\
  \n入：`iris['target'].unique()`\n\n输出：`array(['iris-setosa', 'iris-versicolor', 'new\
  \ label'], dtype=object)`\n\n现在让我们对所有列进行分组：\n\n入：`grouped_targets_mean = iris.groupby(['target']).mean()`\n\
  \n输出：`grouped_targets_var`\n\n入：`grouped_targets_var = iris.groupby(['target']).var()`\n\
  \n输出：`grouped_targets_var`\n\n通过这一步，我们使用 `groupby` 函数对列进行了分组。请注意，这类似于 SQL 中的 \"\
  group by\" 命令。在下一行中，我们还应用了 `mean` 函数，该函数计算平均值。记住，我们可以将此方法同时应用于单列或多列。此外，我们还可以使用方差（variance）、计数（count）或求和（sum）函数来获取不同的值。请注意，获得的结果也是一个\
  \ pandas dataframe，这意味着你可以连接所有这些操作。在这个示例中，我们根据标签对所有观测进行分组，以便分析组之间的差异。但如果我们还有时间序列需要处理会呢？如果你不熟悉时间序列，你应该知道它们意味着对一组顺序出现的数据项进行分析。这种顺序是按时间顺序决定的。本质上，你处理的是一组分布在时间中的点，每个点之间有等距间隔。你会经常遇到时间序列，因为它们被用于许多领域，通常与分析有关。例如，当你必须处理天气数据时，你会发现关于预测或太阳黑子检测的时间序列。\n\
  \n下一个挑战是处理包含噪声的数据项。请记住，虽然这些训练数据集已经经过了多年的记录和处理，但它们往往非常干净，实际上实际上量的处理和清洗。然而，在现实世界中，你会经常遇到噪声数据。在这种情况下，我们可以做的第一件事是使用滚动函数（rolling\
  \ function），它如下：\n\n入：`smooth_time_series = pd.rolling_mean(time_series, 5)`\n\n\
  在这个过程中，我们再次应用了 `mean` 函数。记住，你不一定得使用 `mean`。你也可以选择 `median`（中位数）值。此外，你会注意到我们请求访问五个样本。接下来，我们将使用\
  \ `apply` 函数对我们的列和行执行一些操作。这是一个可以用于多个用途的函数，让我们让我们从确定每行有多少个非零项开始：\n\n入：`iris.apply(np.count_nonzero,\
  \ axis=1).head()`\n\n输出：\n0 5\n1 5\n2 5\n3 5\n4 5\ndtype: int64\n\n最后，`applymap`\
  \ 函数用于对元素本身执行操作。假设我们需要获取每个单元格内每个字符串表示的长度值：\n\n入：`iris.applymap(lambda el: len(str(el))).head()`\n\
  \n为了获得这些值，单元格被转换为字符串，然后我们就可以确定长度。\n\n现在你已经有了关于使用 pandas 进行数据处理的想法，让我们也借助同一个工具讨论数据选择的话题。\n\
  \n### 数据选择\n\n当我们谈到数据选择时是指什么意思？假设你有一个想要访问和处理的数据集。为了这个例子，我们将对所有的分组：\n\n100\n101\n\
  102\n103\n104\n\n正如你所见，第一行是 0，其索引是 100。在任何需要将数据从其余部分分离的地方，我们将使用：\n\n`dataset = pd.read_csv('data.csv',\
