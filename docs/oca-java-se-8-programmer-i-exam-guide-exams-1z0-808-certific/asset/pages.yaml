  md: '# Working with Calendar Data (OCA Objective 9.3)


    9.3 Create and manipulate calendar data using the following: java.time.LocalDateTime,
    java.time.LocalDate, java.time.LocalTime, java.time.format.DateTimeFormatter,
    java.time.Period


    Java 8 introduced a large collection (argh) of new packages related to working
    with calendars, dates, and times. The OCA 8 creators chose to include knowledge
    of a subset of these packages and classes as an exam objective. If you understand
    the classes included in the exam objective, you''ll have a good introduction to
    the entire calendar/time topic. As we work through this section, we''ll use the
    phrase "calendar object," which we will use to refer to one of the several types
    of calendar-related classes we''re covering. So "calendar object" is a made-up
    umbrella term. Here''s a summary of the five calendar-related classes we''ll study,
    plus an interface that looms:


    +   - **java.time.LocalDateTime** This class is used to create immutable objects,
    each of which represents a specific date and time. Additionally, this class provides
    methods that can manipulate the values of the date/time objects created and assign
    them to new immutable objects. LocalDate objects contain BOTH information about
    days, months, years, AND about hours, minutes, and fractions of seconds.


    +   - **java.time.LocalDate** This class is used to create immutable objects,
    each of which represents a specific date. Additionally, this class provides methods
    that can manipulate the values of the date objects created and assign them to
    new immutable objects. LocalDate objects are accurate only to days. Hours, minutes,
    and seconds are **not part of a LocalDate object.


    +   - **java.time.LocalTime** This class is used to create immutable objects,
    each of which represents a specific time. Additionally, this class provides methods
    that can manipulate the values of the time objects created and assign them to
    new immutable objects. LocalTime objects refer only to hours, minutes, seconds,
    and fractions of seconds. Days, months, and years are **not a part of** LocalTime
    objects.


    +   - **java.time.format.DateTimeFormatter** This class is used by the classes
    described above to format/output and parse input strings and convert them to date/time
    objects. DateTimeFormatter objects are also immutable.


    +   - **java.time.Period** This class is used to create immutable objects that
    represent a period of time, for example, "one year, two months, and three days."
    This class works in years, months, and days. If you want to represent chunks of
    time finer than a day (e.g., hours and minutes), you use the `java.time.Duration`
    class, but Duration is not on the exam.


    +   - **java.time.temporal.TemporalAmount** This interface is implemented by the
    Period class. When you use Period objects to manipulate (see the following section),
    calendar objects, you''ll often use methods that take objects that implement TemporalAmount.
    In general, as you use the Java API more and more, it''s a good idea to learn
    which classes implement these interfaces; this is a key to learn how classes in
    complex packages interact with each other.


