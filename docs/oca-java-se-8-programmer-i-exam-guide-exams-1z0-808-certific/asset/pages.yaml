    Three ways to access a method:


    +   * Invoking a method declared in the same class

    * Invoking a method using a reference of the class

    * Invoking an inherited method


    **FIGURE 1-2** Comparison of inheritance: dot operator for member access


    Much of access (both types) centers on whether the two classes involved are in
    the same or different packages. Don''t forget, though, if class A *itself* can''t
    be accessed by class B, then no members within class A can be accessed by class
    B.


    You need to know the effect of different combinations of class and member access
    (such as a default class with a public variable). To figure this out, first look
    at the access level of the class. If the class itself will not be visible to another
    class, then none of the members will be visible, even if the member is declared
    public. Once you''ve confirmed that the class is visible, then it makes sense
    to look at access levels on individual members.


    # Public Members


    When a method or variable member is declared public, it means all other classes,
    regardless of the package they belong to, can access the member (assuming the
    class itself is visible).


