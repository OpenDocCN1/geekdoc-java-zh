    # Writing Code Using Loops OCA Objectives 5.1, 5.2, 5.3, and 5.4


    +   A basic for statement has three parts: declaration/or initialization, boolean
    evaluation, and the iteration expression.


    +   If a variable is incremented or evaluated within a basic loop, it must be
    declared before the loop or within the for declaration.


    +   A variable declared (not initialized) within the basic for loop declaration
    cannot be accessed outside the for loop—in other words, code below the for loop
    won''t be able to use the variable.


    +   You can initialize more than one variable of the same type in the first part
    of the basic for loop declaration; each initialization must be comma separated


    +   An enhanced for statement (new as of Java 5) has two parts: the declaration
    and the expression. It is used only to loop through arrays or collections.


    +   With an enhanced for, the expression is the array or collection through which
    you want to loop.


    +   With an enhanced for, the declaration is the block variable, whose type is
    compatible with the elements of the array or collection, and that variable contains
    the value of the element for the given iteration.


    +   Unlike C, you cannot use a number or anything that does not evaluate to a
    boolean value as a condition for an statement or looping construct. You can, for
    example, say if(x), unless x is a boolean variable.


    +   The do loop always enter the body of the loop at least once.


    # Using break and continue OCA Objective 5.5


    +   An unlabeled break statement will cause the current iteration of the innermost
    loop to stop and the line of code following it to run.


    +   An unlabeled continue statement will cause the current iteration of the innermost
    loop to stop, the condition of that loop to be checked, and if the condition is
    met, the loop to run again.


    +   If the break statement or continue statement is labeled, it will cause a similar
    action to occur on the labeled loop, not the innermost loop.


