  md: "It is maddening! Code compiles! But when we try to run it, we'll get an exception,\
    \ something like this:\n\n```\njava.lang.ClassCastException\n```\n\nWhy can't\
    \ the compiler help us out here? Can't it see that animal is of type Animal? All\
    \ the compiler can verify that the two types are in the same inheritance tree,\
    \ so depending on whatever code might have come downcast, it's possible that animal\
    \ is of type Dog. The compiler must allow things that might possibly work at runtime.\
    \ However, if the compiler knows with certainty that the cast could not possibly\
    \ work, compilation will fail. The following replacement code block will NOT compile:\n\
    \n```\nAnimal animal = new Animal();\nDog d = (Dog) animal;\nString s = (String)\
    \ animal; // animal can't EVER be a String\n```\n\nIn this case, you'll get an\
    \ error like this:\n\n```\ninconvertible types\n```\n\nUnlike downcasting, upcasting\
    \ (casting up the inheritance tree to a more general type) works implicitly (that\
    \ is, you don't have to type in the cast) because when you upcast you're implicitly\
    \ restricting the range of methods you can invoke, as opposed to downcasting,\
    \ which implies that later on, you might want to invoke a more specific method.\
    \ Here's an example:\n\n```\nclass Animal { }\nclass Dog extends Animal { }\n\n\
    class DogTest {\n  public static void main(String [] args) {\n    Dog d = new\
    \ Dog();\n    Animal a1 = d; // upcast ok with no explicit cast\n    Animal a2\
    \ = (Animal) d; // upcast ok with an explicit cast\n  }\n}\n```\n\nBoth of the\
