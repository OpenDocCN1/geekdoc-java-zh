    # Assignment Operators


    Assigning a value to a variable seems straightforward enough; you simply assign
    the stuff on the right side of = to the variable on the left. Well, but don''t
    expect to be tested on something like this:


    ```

    x = 6;

    ```


    No, you will be tested on the no-brainer (technical term) assignments. You will,
    however, be tested on the trickier assignments involving complex expressions and
    casting. We''ll look at both primitive and reference variable assignments. Before
    we begin, let''s back up and peek inside a variable. What is a variable? How are
    the variables and its value related?


    Variables are just bit holders with a designated type. You can have an int holder,
    a double holder, a holder and String[] holder. Within that holder is a bunch of
    bits representing the value. For primitives, the bits represent a numeric value
    (although we don''t know what that pattern looks like for boolean, luckily, we
    don''t care). A byte with a value of 6, for example, means the pattern in the
    variable (the byte holder) 00000010, representing the 8 bits.


    The value of a primitive variable is clear, but what''s an object holder? If you
    say,


    ```

    Button b = new Button();

    ```


    what''s inside the Button holder b? Is the Button object? No! A variable referring
    to an object is just that—a reference variable. A reference variable holder contains
    bits representing a way to get to the object. We don''t know what the format is.
    The way in which object references are virtual-machine specific (it''s a pointer
    to something, we just don''t know what really is). All we can say is that the
    variable''s value is not the object, but rather a value representing a object
    on the heap. Or null. If the reference variable has not been assigned a value
    or has been explicitly assigned value of null, the variable holds bits representing—you
    guessed it—null. You can read


    ```

    Button b = null;

    ```


    “The Button variable is not referring to any object"

    So that we know a variable is just a little box of bits, we can get on with the
    work of changing those bits. We''ll look first at assigning values to primitives
    and then finish with assignments to reference variables.


    # Primitive Assignments


    The equal (=) is used for assigning a value to a variable, and it''s cleverly
    named the assignment operator. There are actually 12 assignment operators, but
    only the 5 most commonly used assignment operators are on the exam, and they are
    covered in Chapter 4.


    You can assign a primitive variable using a literal or the result of an expression.

    Take a look at following:


    ```

    int x = 7; // literal assignment

    int y = x + 2; // assignment with an expression

    // (including a literal)

    int z = x * y; // assignment with an expression

    ```'
