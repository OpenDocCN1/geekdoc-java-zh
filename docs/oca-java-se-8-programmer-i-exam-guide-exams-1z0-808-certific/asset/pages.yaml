    \n+   1. String s = \"Fred\";\n2. String t = s; // Now t and s refer to the same\n\
    \                   // String object\n3. t.toUpperCase(); // Invoke a String method\
    \ that changes\n                     // the String\n\nyou haven't changed the\
    \ original String object created on line 1. When line 2 completes, both t and\
