    Data structures are a part of almost every application you''ve ever worked on.
    The Java API provides an extensive range of classes that support common data structures
    such as Lists, Sets, Maps, and queues. For the purpose of the OCA exam, you should
    remember that the classes that support these common data structures are a part
    of is known as "The Collection API" (one of its many aliases). (The OCP exam covers
