    * Two-Minute Drill


    Q&A Self Test


    Can you imagine trying to write code using a language that didn’t give you a way
    to execute statements conditionally? Flow control is a key part of most useful
    programming language, and Java offers several ways to accomplish it. Some statements,
    such as if statements and for loops, are common to most languages. But Java also
    throws in a couple of flow control features you might not have used before—exceptions
    and assertions. (We’ll discuss assertions in the next chapter.)


    > The if and switch statement are types of conditional/decision controls that
    allow your program to behave differently at a “fork in the road,” depending on
    the result of a logical test. Java also provides three different looping constructs—for,
    while, and do—to execute the code over and again depending on some condition being
    true. Exceptions give you a clean, simple way to organize code that deals with
    problems that might crop up at runtime.


    With these tools, you can build a robust program that can handle any logical situation
    with grace. Expect to see a wide range of questions on the exam that include flow
    control as part of the question code, even on questions that aren’t testing your
    knowledge of flow control.


