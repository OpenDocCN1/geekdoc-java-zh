    # **Local (Automatic/Stack/Method) Variables**


    A local variable is a variable declared within a method. That means the variable
    is not just initialized within the method, but also declared within the method.
    Just as the local variable starts its life inside the method, it''s also destroyed
    when the method has completed. Local variables are always on the stack, not the
    heap. (We''ll talk more about the stack and the heap in Chapter 3.) Although the
    value of the variable might be passed into, say, another method that stores the
    value in an instance variable, the variable itself will only within the scope
    of the method.

    Just don''t forget that while the local variable is on the stack, if it is an
    object reference, the object itself still be created on the heap. There is no
    such thing as a stack object, only a stack variable. You''ll often hear programmers
    use the phrase "local object," but what they really mean, is "locally declared
    variable." If you hear a programmer use that, you''ll know that he''s just too
    lazy to phrase it in a technically precise way. You can tell him we said that—unless
    he knows where we live.'
