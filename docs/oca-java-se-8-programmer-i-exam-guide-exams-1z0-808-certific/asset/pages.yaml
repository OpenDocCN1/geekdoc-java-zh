    1 error\nThe JVM doesn't know Frog object's frogCount you're trying to access.\
    \ The problem is that main() is itself a static method and thus is not running\
    \ against any particular instance of the class; instead a static method cannot\
    \ access a nonstatic (instance) variable because there is no instance! That's\
    \ not to say there aren't instances of the class alive on the heap, but even if\
    \ there are, the static methods don't know anything about them. The same applies\
    \ to instance methods; a static method can't directly invoke a nonstatic method.\
    \ Think static = class, nonstatic = instance. Making the method called by the\
    \ JVM (main()) a static method means the JVM doesn't have to create an instance\
    \ of your class to start running code.\n\n![](img/0746bd23bbf07125e1cb15b26c3bffa0_158_0.png)\n\
    \nOne of the mistakes often made by new Java programmers is attempting to access\
