  md: 'When you implement an interface, you are fulfilling its contract.


    +   You implement an interface by properly and concretely implementing all the
    abstract methods defined by the interface.


    +   A single class can implement many interfaces.


    # Return Types (OCA Objectives 7.2 and 7.5)


    +   Overloaded methods can change return types; overridden methods cannot, except
    in the case of covariant returns.


    +   Object reference return types can accept null as a return value.


    +   An array is a legal return type, both to declare and return as a value.


    +   For methods with primitive return types, any value that can be implicitly
    converted to the return type can be returned.


    +   Nothing can be returned from a void, but you can return nothing. You''re allowed
    to simply say return in any method with a void return type to bust out of a method
    early. But you can''t returning nothing from a method with a non-void return type.


    +   Methods with an object reference type can return a subtype.


    +   Methods with an interface return type can return any implementer.


    # Constructors and Instantiation (OCA Objectives 6.3 and 7.4)


    +   A constructor is always invoked when a new object is created.


    +   Each superclass in an object''s inheritance tree will have a constructor called.


    +   Every class, even an abstract class, has at least one constructor.


    +   Constructors must have the same name as the class.


    +   Constructors don''t have a return type. If you see code with a return type,
    it''s a method with the same name as the class; it''s not a constructor.


    +   Typical constructor execution occurs as follows:


    +   The constructor calls its superclass constructor, which calls its superclass
    constructor, and so on all the way up to the object constructor.


    +   The object constructor executes and returns to the calling constructor, which
    runs to completion and returns to it its calling constructor, and so on back down
    to the completion of the constructor of the actual instance being created.


    +   Constructors can use any access modifier (even private!).


    +   The compiler will create a default constructor if you don''t create any constructors
    in your class.


    +   The default constructor is a no-arg constructor with a no-arg call to super().


    +   The first statement of every constructor must be either a call to this() (overloaded
    constructor) or to super().


    +   The compiler will add a call to super() unless you have already put in a call
    to this() or'
