  md: "# Initialization Blocks (OCA Objectives 1.2 and 6.3-ish)\n\n1.2 Define the\
    \ structure of a Java class\n\n6.3 Create and overload constructors; including\
    \ impact on default constructors\n\nWe've talked about two places in a class where\
    \ you can put code that performs operations: methods and constructors. Initialization\
    \ blocks are the third place in a Java program where operations can be performed.\
    \ Static initialization blocks run once when the class is first loaded, and initialization\
    \ blocks run whenever an instance is created (a bit similar to a constructor).\
    \ Let's look at an example:\n\n```\nclass SmallInit {\n    static int x;\n   \
    \ int y;\n\n    static { x = 7; } // static init block\n    { y = 8; } // instance\
    \ init block\n}\n```\n\nAs you can see, the syntax for initialization blocks is\
    \ pretty terse. They don't have names, they can't take arguments, and they don't\
    \ return anything. A static initialization block runs once when the class is first\
    \ loaded. An instance initialization block runs once every time a new instance\
    \ is created. Remember when we talked about the order in which constructor code\
    \ executed? Instance init code runs right after the call to super() in a constructor—in\
    \ other words, after all super constructors have run.\n\nYou may have many initialization\
    \ blocks in a class. It is important to note that unlike methods or constructors,\
    \ the order in which initialization blocks appear in a class matters. When it's\
    \ time for initialization blocks to run, if a class has more than one, they will\
    \ run in the order in which they appear in the class file—in other words, from\
    \ the top down. Based on the rules we just discussed, can you determine the output\
    \ of the following program?\n\n```\nclass Init {\n    Init(int x) { System.out.println(\"\
    1-arg const\"); }\n    Init() { System.out.println(\"no-arg const\"); }\n    static\
    \ { System.out.println(\"1st static init\"); }\n    { System.out.println(\"1st\
    \ instance init\"); }\n    { System.out.println(\"2nd instance init\"); }\n  \
    \  static { System.out.println(\"2nd static init\"); }\n}\n\npublic static void\
    \ main(String [] args) {\n    new Init();\n    new Init(7);\n}\n```\n\nTo figure\
    \ this out, remember these rules:\n\n+   - init blocks execute in the order in\
    \ which they appear.\n- Static init blocks run once, when the class is first loaded."
