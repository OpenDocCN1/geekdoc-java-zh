    \ times. (To be fair, equals has also been overridden billions of times, but we're\
    \ getting ahead of ourselves.)\n\n# The Evolution of Inheritance\n\nUp until Java\
    \ 8, when the topic of inheritance was discussed, it usually revolved around subclasses\
    \ inheriting methods from their superclasses. While this simplification was never\
    \ perfectly correct, it became less correct with the new features available in\
