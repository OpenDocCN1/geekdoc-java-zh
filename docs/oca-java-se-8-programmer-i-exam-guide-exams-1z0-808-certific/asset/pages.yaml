  md: 'Behavior (methods) When a programmer creates a class, she creates methods for
    that class. Methods are where the class''s logic is stored and where the real
    work gets done. They are where algorithms execute and data gets manipulated.


    # Identifiers and Keywords


    All the Java components we just talked about—classes, variables, and methods—need
    names. In Java, these names are called identifiers, and as you might expect, there
    are rules for what constitutes a Java identifier. Beyond what is legal, though,
    Java (and Oracle) programmers have created conventions for naming methods, variables,
    and classes.


    Like all programming languages, Java has a set of built-in keywords. These keywords
    must not be used as identifiers. Later in this chapter we''ll review the details
    of these naming rules, conventions, and the Java keywords.


    # Inheritance


    Central to Java and other OO languages is the concept of inheritance, which allows
    code defined in one class or interface to be reused in other classes. In Java,
    you can define a general (more abstract) superclass and then extend it with more
    specific subclasses. The superclass knows nothing of the classes that inherit
    from it, but all of the subclasses must explicitly declare the inheritance relationship.
    A subclass that inherits from a superclass is automatically given instance variables
    and methods defined by the superclass, but the subclass is also free to override
    superclass methods to define more specific behavior. For example, a car superclass
    could define general methods common to all automobiles, and a Ferrari subclass
    could override the accelerate() method that was already defined in the car.


    # Interfaces


    A powerful companion to inheritance is the use of interfaces. Interfaces are usually
    like a 100 percent abstract class that defines what a subclass must support, but
    not how they must be supported. In other words, for example, an Animal interface
    might declare that all Animal implementation classes have an eat() method, but
    the Animal interface doesn''t supply any logic for the eat() method. It''s up
    to the classes that implement the interface to define the actual code for how
    that particular type behaves when its eat() method is invoked. Note: As of Java
    8, interfaces can now include concrete, inheritable methods. We will talk much
    more about this when we dive into OO in the next chapter.


