  md: "look interfaces.)\n\n# IS-A and HAS-A Relationships\n\nNote: As of Winter 2017,\
    \ the OCA 8 exam won't ask you directly about IS-A and HAS-A relationships. But\
    \ understanding IS-A and HAS-A relationships will help OCA 8 candidates with many\
    \ of the questions on the exam.\n\n# IS-A\n\nIn OO, the concept of IS-A is based\
    \ on inheritance (or interface implementation). IS-A is a way of saying, “This\
    \ thing is a type of that thing.” For example, a Mustang is a type of Horse, so\
    \ in OO terms we can say, “Mustang IS-A Horse.” Subaru IS-A Car. Broccoli IS-A\
    \ Vegetable (not a very fun one, but it counts). You can express the IS-A relationship\
    \ in Java through the keywords extends (for class inheritance) and implements\
    \ (for interface implementation).\n\n```\npublic class Car {\n    // Cool Car\
    \ code goes here\n}\n```\n\n```\npublic class Subaru extends Car {\n    // Important\
    \ Subaru-specific stuff goes here\n    // Don't forget Subaru inherits accessible\
    \ Car members\n    // can include both methods and variables.\n}\n```\n\nA Car\
    \ is a type of Vehicle, so the inheritance tree might merry start from the vehicle\
    \ class as follows:\n\n```\npublic class Vehicle { ... }\npublic class Car extends\
    \ Vehicle { ... }\npublic class Subaru extends Car { ... }\n```\n\nIn OO terms,\
    \ you can say the following:\n\nVehicle is the superclass of Car.\nCar is the\
    \ subclass of Vehicle.\nCar is the superclass of Subaru.\nSubaru is the subclass\
    \ of Vehicle.\nCar inherits from Vehicle.\nSubaru inherits from both Vehicle and\
    \ Car.\nSubaru is derived from Car.\nCar is derived from Vehicle.\nSubaru is derived\
    \ from Vehicle.\nSubaru is a subtype of both Vehicle and Car.\n\nReturning to\
    \ our IS-A relationship, the following statements are true:\n\n> “Car extends\
    \ Vehicle” means “Car IS-A Vehicle.”\n“Subaru extends Car” means “Subaru IS-A\
    \ Car.”\n\nAnd we can also say:"
