    # Final Variables


    Declaring a variable with the final keyword makes it impossible to reassign a
    variable once it has been initialized with an explicit value (notice we say “explicit”
    rather than “default”). For primitives, this means that once the variable is assigned
    a value, the value can’t be altered. For example, if you assign 10 to the int
    variable x, then x is going to stay 10, forever. So that’s straightforward for
    primitives, but what does it mean to have a final object reference variable? A
    reference marked final can never be reassigned to refer to a different object.
    The data within the object can be modified, but the reference variable cannot
    be changed. In other words, a final reference allows you to modify the state of
    the object it refers to, but you can’t modify the reference variable to make it
    refer to a different object. Burn this in: there are no final objects, only final
    references. We’ll explain this in more detail in Chapter 3.


    We’ve covered how the final modifier can be applied to classes, methods, and variables.
    Figure 1-8 highlights the key points and differences of the various applications
    of final.'
