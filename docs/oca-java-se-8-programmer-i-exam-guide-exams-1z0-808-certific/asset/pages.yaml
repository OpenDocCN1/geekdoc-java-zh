  md: "Java provides many exception classes, most of which have quite descriptive\
    \ names. The first is from the type of the exception itself. The next is from\
    \ information that you can get from the exception object. Class Throwable (at\
    \ the top of the inheritance tree for exceptions) provides its descendants with\
    \ methods that are useful in exception handlers. One of them is printStackTrace()\
    \ method, as in the earlier example, a stack trace from where the exception occurred\
    \ will be printed.\n\nWe discussed that a call stack builds upwards with the most\
    \ recently called method at the top. You will notice that the printStackTrace()\
    \ method prints the most recently entered method and continues down, printing\
    \ the name of each method as it works its way down the call stack (this is called\
    \ \"unwinding the stack\") from the top.\n\n![](img/0746bd23bbf07125e1cb15b26c3bffa0_293_0.png)\n\
    \nFor the example, you don't need to know any of the methods contained in the\
    \ Throwable classes, including Exception and Error. You are expected to know that\
    \ Exception, Error, RuntimeException, and Throwable types can all be thrown using\
    \ the throw keyword and can be caught (although you rarely catch anything other\
    \ than Exception subtypes).\n\n# # Handling an Entire Class Hierarchy of Exceptions\n\
    \nWe've discussed that the catch keyword allows you to specify a particular type\
    \ of exception to catch. You can catch more than one type of exception in a single\
    \ catch clause. If the exception class the catch clause has no subclasses, then\
    \ only the specified class of exception will be caught. However, if the class\
    \ specified in the catch clause does subclasses, any exception object that subclasses\
    \ the specified class will be caught as well.\n\nFor example, class IndexOutOfBoundsException\
    \ has two subclasses, ArrayIndexOutOfBoundsException and StringOutOfBoundsException.\
    \ You may want to write one exception handler that deals with exceptions produced\
    \ by either type of boundary error, but you might not be concerned with which\
    \ exception you actually have. In this case, you could write a catch clause like\
    \ the following:\n\n```\ntry {\n  // Some code here that can throw a boundary\
    \ exception\n} catch (OutOfBoundsException e) {\n  e.printStackTrace();\n}\n```\n\
    \nIf any code in the try block throws ArrayIndexOutOfBoundsException or StringOutOfBoundsException,\
    \ the exception will be caught and handled. This can be convenient, but it should\
    \ be used sparingly. By specifying an exception's superclass in your catch clause,\
    \ you're discarding valuable information about the exception. You can, of course,\
    \ find out exactly what exception you have, but if you're going to do that, you're\
    \ better off writing a separate catch clause for each exception type of interest.\n\
    \n![](img/0746bd23bbf07125e1cb15b26c3bffa0_293_1.png)"
