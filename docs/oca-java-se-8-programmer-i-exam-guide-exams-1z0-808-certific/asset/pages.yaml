    # CERTIFICATION SUMMARY


    The most important thing to remember about Strings is that String objects are
    immutable, but references to Strings are not! You can make a new String by using
    an existing String as a starting point, but if you don''t assign a reference variable
    to the new String, it will be lost to your program—you will have no way to access
    your new String. Review the important methods in the String class.


    The StringBuilder class was added in Java 5. It has exactly the same methods as
    the old StringBuffer class, except StringBuilder''s methods are not thread-safe.
    Because StringBuilder''s methods are not thread-safe, they tend to run faster
    than StringBuffer, so choose StringBuilder whenever threading is not an issue.
    Both StringBuffer and StringBuilder objects have their value changed over and
    without your creating new objects. If you''re doing a lot of string manipulation,
    these objects will be more efficient than immutable string objects, which are,
    more or less, "once in memory forever.\ Remember, these methods ALWAYS change
    the invoking object''s value, even with no assignment.


    Next we discussed classes and interfaces in the new Java 8 calendar and date-related
    packages. Similar to Strings, all of the calendar classes created immutable objects.
    In addition, these classes use factory methods exclusively to create new objects.
    The keyword new cannot be used with these classes. We looked at some of the powerful
    features of these classes, like calculating the amount of time between two dates
    or times. Then we took a look at the DateTimeFormatter class which is used to
    parse objects and how it is to use calendar objects.


    The next topic was arrays. We talked about declaring, constructing, and initializing
    one-dimensional and multidimensional arrays. We talked about anonymous arrays
    and the fact that arrays of objects are actually arrays of references to objects.


    Next, we discussed the basics of ArrayList. ArrayLists are like arrays with superpowers
    that allow them to grow and shrink dynamically and make it easy for you to insert
