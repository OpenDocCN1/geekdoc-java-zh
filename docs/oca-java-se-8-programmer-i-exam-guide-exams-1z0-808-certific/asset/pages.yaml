    \ Fall-through is less than intuitive, Oracle recommends that you add a comment\
    \ such as // fall through when you use fall-through logic.\n\n# The Default Case\n\
    \nWhat if, using the preceding code, you wanted to print x is an odd number if\
    \ none of the cases (the even numbers) matched? You couldn't put it after the\
    \ switch statement, or even as the last case in the switch, in both of those situations\
    \ it always print x is an odd number. To get this behavior, you'd use the default\
    \ keyword. (By the way, if you've wondered why there is a default keyword even\
    \ though for access control, now you'll see that the default keyword is used for\
    \ a completely different purpose.) The only change we need to make is to add the\
