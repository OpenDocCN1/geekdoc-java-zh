  md: "Instance methods can be overridden if they are inherited by the subtype. A\
    \ subtype within the same package as the instance's supertype can override any\
    \ supertype method that is not private or final. A subtype in a different package\
    \ can override only those final methods marked public or protected (since protected\
    \ methods are inherited by the subtype).\n\n+   The overriding method CAN throw\
    \ any unchecked (runtime) exception, regardless of whether the overridden method\
    \ declares the exception. (More in Chapter 5.)\n\n+   The overriding method MUST\
    \ NOT checked exceptions that are new or broader than those declared by the overridden\
    \ method. For example, a method that declares a FileNotFoundException cannot be\
    \ overridden by a method that declares a SQLException, Exception, or any other\
    \ runtime exception unless it's a subclass of FileNotFoundException.\n\n+   The\
    \ overriding method can throw fewer or fewer exceptions. Just because \"takes\
    \ risks\" doesn't mean that the overriding subtype's exception takes the same\
    \ risks. Bottom line: an overriding method doesn't have to declare any exceptions\
    \ that it will never throw, regardless of what the overridden method declares.\n\
    \n+   You cannot override a method marked final.\n\n+   You cannot override a\
    \ method marked static. We'll look at an example in a few pages when we discuss\
    \ static methods in more detail.\n\n+   If a method can't be inherited, you cannot\
    \ override it. Remember that overriding implies that you're reimplementing a method().\
