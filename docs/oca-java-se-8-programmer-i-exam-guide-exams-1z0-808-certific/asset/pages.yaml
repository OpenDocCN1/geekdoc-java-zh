  md: "# Basic Assignments OCA Objectives 2.1, 2.2, and 2.3)\n\n+   - Literal integers\
    \ are implicitly ints.\n- Integer expressions always result in an int-sized result,\
    \ never smaller.\n- Floating-point numbers are implicitly doubles (64 bits).\n\
    - Narrowing a primitive truncates the high order bits.\n- Compound assignments\
    \ (such as +=) perform an automatic cast.\n- A reference holds the bits that are\
    \ used to refer to an object.\n- Reference variables can refer to subclasses of\
    \ the declared type but not to superclasses.\n- When you create a new object,\
    \ such as Button b = new Button();, the JVM does three:\n  - Makes a reference\
    \ variable named b, of type Button.\n  - Creates a new Button object.\n  - Assigns\
    \ the Button object to the reference variable b.\n\n# Using a Variable or Array\
    \ Element That Is Uninitialized and Unassigned (OCA Objectives 4.1 and 4.2)\n\n\
    +   - When an array of objects is instantiated, objects within the array are not\
    \ instantiated automatically, but all the references get the default value of\
    \ null.\n- When an array of primitives is instantiated, elements get default values.\n\
    - Instance variables are always initialized with a default value.\n- Local/automatic/method\
    \ variables are never given a default value. If you attempt to use one before\
    \ initializing it, you'll get a compiler error.\n\n# Passing Variables into Methods\
    \ (OCA Objective 6.6)\n\n+   - Methods can take primitives and/or object references\
    \ as arguments.\n- Method arguments are always copies.\n- Method arguments are\
    \ never actual objects (they can be references to objects).\n- A primitive argument\
    \ is an unattached copy of the original primitive.\n- A reference argument is\
    \ another copy of a reference to the original object.\n- Shadowing occurs when\
    \ two variables with different scopes share the same name. This leads to hard-to-find\
    \ bugs and hard-to-answer exam questions.\n\n# Garbage Collection (OCA Objective\
    \ 2.4)\n\n+   - In Java, garbage collection (GC) performs automated memory management.\n\
    - The purpose of GC is to delete objects that can't be reached.\n- Only the JVM\
    \ decides when to run the GC; you can only suggest it.\n- You can't know the GC\
    \ algorithm for sure."
