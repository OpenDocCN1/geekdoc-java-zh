  md: "Arrays are efficient, but many times you'll want to use one of the Collection\
    \ types from java.util (including HashMap, ArrayList, and TreeSet). Collection\
    \ classes offer more flexible ways to access an object (for insertion, deletion,\
    \ reading, and so on) and, unlike arrays, can expand or contract dynamically as\
    \ you add or remove elements. There are Collections for a wide range of needs.\
    \ Need a fast sort? A group of objects with no duplicates? Need access to a name-value\
    \ pair? Java provides a variety of Collection types to address these situations,\
    \ but the only Collection type you need is ArrayList,\n\nArrays are declared by\
    \ stating the type of elements the array will hold (an object or a primitive),\
    \ followed by square brackets on either side of the identifier.\n\n# Declaring\
    \ an Array of Primitives:\n\n```\nint[] key; // Square brackets before name (recommended)\n\
    int key[];    // Square brackets after name (legal but less\n              //\
    \ readable)\n```\n\n# Declaring an Array of Object References:\n\n```\nThread[]\
    \ threads; // Recommended\nThread threads[];    // Legal but less readable\n```\n\
    \n![](img/0746bd23bbf07125e1cb15b26c3bffa0_81_0.png)\n\nWhen declaring an array\
    \ reference, you should always put the array brackets immediately after the declared\
    \ type, rather than after the identifier (variable name). That way, anyone reading\
    \ the code can easily tell that, for example, key is a reference to an int array\
    \ object, not an primitive.\n\nWe can also declare multidimensional arrays, which\
    \ are, in fact, arrays of arrays. This can be done in the following manner:\n\n\
    ```\nString[][] occupantName;\nString[] managerName[];\n```\n\nThe first example\
    \ is a three-dimensional array (an array of arrays of arrays), and the second\
    \ is a two-dimensional array. Notice in the second example, we have one square\
    \ bracket before the variable name and one after it. This is perfectly legal to\
    \ the compiler, proving once again that because it's legal it doesn't mean it's\
    \ right.\n\n![](img/0746bd23bbf07125e1cb15b26c3bffa0_81_1.png)\n\n> It is not\
    \ legal to include the size of the array in your declaration. Yes, we know you\
    \ can do that in some other languages, which is why you might see a question or\
    \ two that include code similar to the following:\n\n```\nint[5] scores;\n```\n\
    \nThe preceding code won't compile. Remember, the JVM doesn't allocate space until\
    \ you actually instantiate the array object. That's when size matters."
