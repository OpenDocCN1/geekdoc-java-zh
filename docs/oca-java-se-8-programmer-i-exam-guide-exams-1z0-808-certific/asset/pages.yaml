  md: '# Scenario 2: b1 & (b2 == b3) | b4 If this was the programmer''s intention,
    then the code will work as intended, but his boss and fellow workers will want
    to strangle him.


    This is a long-winded way to say that when you''re writing code, you shouldn''t
    rely on everyone''s memory of operator precedence. You should just use parentheses
    like civilized people.


    # The Actual Beginning of the Operator Precedence Section


    Table 4-2 lists the most commonly used operators and their relative precedence,
    starting at the top with the highest precedence operators and ending at the lowest
    with them. (Note, not all of Java''s operators are in this table!)


    # TABLE 4-2 Precedence Hierarchy of Common Operators (from Highest to Lowest)


    | Types of Operators | Symbols | Example Uses |

    | --- | --- | --- |

    | Unary operators | -, !, +, +- | -7 * 4, !myBoolean |

    | Multiplication, division, modulus | *, /, % | 7 % 4 |

    | Addition, subtraction | +, - | 7 + 4 |

    | Relational operators | <, >, <=, >= | y > x |

    | Equality operators | ==, != | y != x |

    | Logical operators (& beats \|) | &, | myBool & yourBool |

    | Short-circuit (&& beats \| \|) | &&, || | myBool || yourBool |

    | Assignment operators | =, += | X += 5; |


    JavaRank (we know, we know, "Coderanch") moderator Fritz Walraven shared this
    tip with us. We like it, and we''re passing it along to you: for the table above,
    you might make up a word like "UMARELSA," or a sentence using those first letters,
    to help you remember the precedence rules!

    There are three important general rules for determining how Java will evaluate
    expressions with operators:


    +   - When two operators of the same precedence are in the same expression, Java
    evaluates the expression from left to right.

    - When parts of an expression are placed in parentheses, those parts are evaluated
    first.

    - When parentheses are nested, the innermost parentheses are evaluated first.


    A good way to burn these precedence rules into your brain is to—as always—write
    some test code and play around with it. We''ve added an example of test code that
    demonstrates several of the precedence hierarchy rules listed here. As you can
    see, we often compared parentheses-free expressions with their parentheses-rich
    counterparts to prove the rules:'
