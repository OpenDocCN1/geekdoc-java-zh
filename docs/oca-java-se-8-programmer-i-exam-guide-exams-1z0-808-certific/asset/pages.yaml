    Remember that any Java object that can pass more than one IS-A test can be considered
    polymorphic. Other than objects of type Object, all Java objects are polymorphic
    in that they pass the IS-A test for their own type and for class Object.

    Remember, that the only way to access an object is through a reference variable.
    There are a few things you should know about references:


    +   - A reference variable can be of only one type, and once declared, that type
    can never be changed (although the object it references can change).


    +   - A reference is a variable, so it can be reassigned to other objects (unless
    the reference is declared final).


    +   - A reference’s type determines the methods that can be invoked on the object
    it is referencing.


    +   - A reference variable can refer to any object of the same type as the declared
    reference, or—this is the big one—it can refer to any subtype of the declared
    type!


    +   - A reference variable can be declared as a class type or an interface type.
    If the variable is declared as an interface type, it can refer any object of any
    class that implements the interface.


