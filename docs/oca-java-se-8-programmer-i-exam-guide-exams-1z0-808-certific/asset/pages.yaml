  md: "# FROM THE CLASSROOM\n\nhalter-related code directly into the Horse class,\
    \ you'll end up duplicating code in the Cow class, and any other class that might\
    \ need Halter behavior. By keeping the Halter code in a separate, specialized\
    \ Halter class, you have the chance to reuse the Halter class in multiple applications.\n\
    \nUsers of the Horse class (that is, code that methods on an Horse instance) think\
    \ that the Horse class has Halter behavior. The Horse class might have a tie(Lead\
    \ rope rope) method. Users of the Horse class should never have to know that when\
    \ they invoke the tie() method, the Horse object turns around and delegates the\
    \ call to its Halter class by invoking myHalter.tie(rope). The scenario described\
    \ might look like this:\n\n```\npublic class Horse extends Animal {\n    private\
    \ Halter myHalter = new Halter();\n    public void tie(Lead rope rope) {\n   \
    \     myHalter.tie(rope); // Delegate tie behavior to the\n        // Halter object\n\
    \    }\n}\npublic class Halter {\n    public void tie(Leadrope arope) {\n    \
    \    // Do the actual tie work here\n    }\n}\n```\n\nIn OO, we don't want callers\
    \ to worry about which class or object is actually doing the real work. To make\
    \ that, the Horse class hides implementation details from Horse users. Horse users\
    \ ask the Horse object to do things (in this case, tie itself up), and the Horse\
    \ will either do it or, as in this example, something else (like perhaps an inherited\
    \ Animal class method) to do. To the caller, though, always appears that the Horse\
    \ object takes care of itself. Users of a Horse should not even need to know that\
    \ there is such a thing as a Halter class.\n\n# Object-Oriented Design\n\nIS-A\
    \ and HAS-A relationships and encapsulation are just the tip of the iceberg when\
    \ it comes to OO design. Many books and graduates theses have been dedicated to\
    \ this topic. The reason for the emphasis on proper design is simple: money. The\
    \ cost to deliver a software application has been estimated to be as much as ten\
    \ times more expensive for poorly designed programs.\n\nEven the best OO designers\
    \ (often called \"architects\") make mistakes. It is difficult to visualize the\
    \ relationships between hundreds, even thousands, of classes. When mistakes are\
    \ discovered during the implementation (code writing) phase of a project, the\
    \ amount of code that must be rewritten can sometimes mean programming teams have\
    \ to start over scratch.\n\nThe software industry has helped aid the designer.\
    \ Visual object modeling languages, such as the Unified Modeling Language (UML),\
    \ allow designers to design and easily modify classes without writing code first\
    \ because OO components are represented graphically. This allows designers to\
    \ create a map of the class relationships and help them them recognize errors\
    \ before coding begins."
