  md: "```\nclass NPE {\n    static String s;\n    public static void main(String[]\
    \ args) {\n        System.out.println(s.length());\n    }\n}\n```\n\nSurely, the\
    \ compiler can find the problem with that tiny little program! Nope, you're on\
    \ your own.\nThe code will compile just fine, and the JVM will throw a NullPointerException\
    \ when it tries to invoke the length() method.\n\nEarlier in this chapter we discussed\
    \ the call stack. As you recall, we used the convention that main() would be at\
    \ the bottom of the stack, and as main() invokes another method, and that method\
    \ invokes another, and so on, the stack grows upwards. Of course, the stack resides\
    \ in memory, and even if you give OS a gigabyte of RAM for your program, it's\
    \ still a finite amount. It's possible to grow the stack so large that the OS\
    \ runs out of space to store the call stack. When this happens, you get (wait\
    \ for it...) a StackOverflowError. The most common way for this to occur is to\
    \ create a recursive method. A recursive method invokes itself in the method body.\
    \ Although that may sound weird, it's very common and useful technique for things\
    \ like searching and sorting algorithms. Take a look at this code:\n\n```\nvoid\
    \ go() { // recursion gone bad\n    go();\n}\n```\n\nAs you can see, if you ever\
    \ make the mistake of invoking the go() method, your program will fall into a\
    \ black hole--go() invoking go() invoking go(), no matter how much memory you\
    \ have, you'll get a StackOverflowError. Again, only the JVM knows when this moment\
    \ occurs, and the JVM will be the source of this error.\n\n# Programmatically\
    \ Thrown Exceptions\n\nNow let's look at programmatically thrown exceptions. Remember\
