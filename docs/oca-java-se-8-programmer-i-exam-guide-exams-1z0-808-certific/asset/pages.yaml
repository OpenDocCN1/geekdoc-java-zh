  md: 'overriding methods must declare the same argument list and return type as the
    supertype''s overridden method, and that access modifier can be more restrictive.
    The overriding method also can throw any or broader checked exceptions that were
    not declared in the supertype. You also learned that the overridden method can
    be invoked using the syntax .something():


    Overloaded methods let you reuse the same method name in a class, but with different
    arguments (and, optionally, a different type). Whereas overriding methods must
    not change the argument list, overloaded methods must. Unlike overriding methods,
    overloaded methods are free to vary the return type, access modifier, and declare
    exceptions any they like.


    We learned the mechanics of casting (mostly downcasting) reference variables and
    when it''s necessary to do.


    Implementing interfaces comes next. An interface describes a contract that the
    implementing class must follow. The rules for implementing an interface are similar
    to those for extending an abstract class. As of Java 8, interfaces can have concrete
    methods, which are labeled default. Also, remember that a class can implement
    more than one interface and that interfaces can extend another interface.


    We also looked at return types and saw that you can declare any return type you
    like (assuming you have access to a class for an object reference type), unless
    you''re overriding a method. Barring a covariant return, an overriding method
    must have the same return type as the superclass, although overriding methods
    must not change the return type, overloaded methods can (as long as they change
    the argument list).


    Finally, you learned that it is legal to return any variable that can be converted
    to the declared return type. So, for example, a short can be returned when the
    return type is declared as int. And (assuming Horse extends Animal), a Horse reference
    can be returned when the return type is declared as Animal.


    We covered constructors in detail, learning that if you don''t provide a constructor
    for your class, the compiler will insert one. The compiler-generated constructor
    is called the default constructor, and it is always a no-arg constructor with
    a no-arg call to (). The default constructor will never be generated if even a
    single constructor exists in your class (regardless of the arguments of that constructor);
    so if you need more than one constructor in your class and you want a no-arg constructor,
    you''ll have to write it. We also saw that constructors are not inherited and
    can be confused by a method that has the same name as the class (which is legal).
    The return type is the giveaway that a method is not a constructor because constructors
    do not have types.


    We saw how all the constructors in an object''s inheritance tree will always be
    invoked when the object is instantiated. We also saw that constructors can be
    overloaded, which means defining constructors with different arguments. A constructor
    can invoke another constructor of the same class using the keyword this(), as
    the method named this(). We saw that every constructor must have either this()
    or super() as the first statement (although the compiler can insert it for you).


    After constructors, we discussed the two kinds of initialization blocks and how
    and when their code run.


    We looked at static methods and variables. static members are tied to the class
    or interface, not instance, there is only one of any static member. A common mistake
    is to attempt to reference an instance variable from a static method. Use the
    respective class or interface name to access static members.'
