  md: "```\nclass Bar {\n  void takeInt(int x) {\n}\n\nclass UseBar {\n  public static\
    \ void main(String [] args) {\n    Bar b = new Bar();\n    b.takeInt(); // Try\
    \ to invoke a no-arg takeInt() method\n  }\n}\n```\n\nThe compiler will complain\
    \ that you cannot invoke takeInt() without passing an int. Of course, the compiler\
    \ enjoys the occasional riddle, so the message it spits out on some versions of\
    \ the JVM (your leeway) is less obvious:\n\n```\nUseBar.java:7: takeInt(int) in\
    \ Bar cannot be applied to ()\nb.takeInt();\n^\n```\n\nBut you get the idea. The\
    \ bottom line is that there must be a match for the method. And by match, we mean\
    \ the argument types must be able to accept the values or variables you are passing\
    \ and in the order you are passing them. Which brings us back to constructors\
    \ (and here you were thinking we would never get there), which works exactly the\
    \ same.\n\nSo if your super constructor (that is, the constructor of your immediate\
    \ superclass/parent) has arguments, you must type in the call to super(), supplying\
    \ the appropriate arguments. Crucial point: if your superclass does not have a\
    \ no-arg constructor, you must type a constructor in your class (the subclass)\
    \ because you need a place to put the call to super() with the appropriate arguments.\n\
    \nThe following is an example of the problem:\n\n```\nclass Animal {\n  Animal(String\
    \ name) {}\n}\nclass Horse extends Animal {\n  Horse() {\n    super(); // Problem!\n\
    \  }\n}\n```\n\nAnd once again the compiler treats us with stunning lucidity:\n\
    \n```\nHorse.java:7: cannot resolve symbol\nsymbol : constructor Animal ()\nlocation:\
    \ class Animal\nsuper(); // Problem!\n^\n```\n\nIf you're lucky (and it's a full\
    \ moon), your compiler might be a little more explicit. But again, the problem\
    \ is that there isn't just a match for what we're trying to invoke with super()—an\
    \ Animal constructor with no arguments.\n\nAnother way to put this is that if\
    \ your superclass does not have a no-arg constructor, then in your subclass you\
    \ will not be able to use the default constructor supplied by the compiler. It's\
    \ simple."
