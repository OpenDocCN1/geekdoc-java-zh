  md: "# # Constructor Declarations\n\nIn Java, every time you make a new object,\
    \ at least one constructor is invoked. Every class has a constructor, although\
    \ if you don't create one explicitly, the compiler will build one for you. There\
    \ are tons of rules concerning constructors, and we're saving our detailed discussion\
    \ for Chapter 2. For now, let's focus on the basic declaration rules. Here's a\
    \ simple example:\n\n```\nclass Foo {\n    protected Foo() { } // this is Foo's\
    \ constructor\n    protected void Foo() { } // this is a badly named, but legal,\
    \ method\n}\n```\n\nThe first thing to notice is that constructors look an awful\
    \ lot like methods. A key difference is that a constructor can't ever, ever, ever,\
    \ have a return type...ever! Constructor declarations can, have all of the normal\
    \ access modifiers, and they can take arguments (including var-args), just like\
    \ methods. The BIG RULE to understand about constructors is that they must have\
    \ the same name as the class in which they are declared. Constructors can't be\
    \ marked static (they, after all, associated with object instantiation), and they\
    \ can't be marked final or abstract (because they can't be overridden). Here are\
    \ some legal and illegal constructor declarations:\n\n```\nclass Foo2 {\n    //\
    \ illegal constructors\n    Foo2(byte b) { }\n    private Foo2(int x) { }\n  \
    \  Foo2(int x, int... y) { }\n    void Foo2() { // it's a method, not a constructor\n\
    \        Foo() { // not a method or a constructor\n        Foo2(short s); // looks\
    \ like an abstract method\n        static Foo2(float f) { } // can't be static\n\
    \        final Foo2(long x) { } // can't be final\n        abstract Foo2(char\
    \ c) { } // can't be abstract\n        Foo2(int... x, int t) { } // bad var-arg\
    \ syntax\n    }\n}\n```\n\n# # Variable Declarations\n\nThere are two types of\
    \ variables in Java:\n\n+   **Primitives** A primitive can be one of eight types:\
    \ char, boolean, byte, short, int, long, double, or float. Once a primitive has\
    \ been declared, its primitive type can never change, although in most cases its\
    \ value can change.\n**Reference variables** A reference variable is used to refer\
    \ to (or access) an object. A reference variable is declared to be of a specific\
    \ type, and that can never be changed. A reference variable can be used to refer\
    \ to any object of the declared type or of a *subtype* of the declared type (a\
    \ compatible type). We'll tell a lot more about using a reference variable to\
    \ refer to a subtype in Chapter 2, when we discuss polymorphism."
