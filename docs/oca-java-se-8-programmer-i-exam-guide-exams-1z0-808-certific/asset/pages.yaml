  md: '# Using the javac and java Commands


    In this book, we''re going to talk about invoking the javac and java commands
    about 1000 times. Although in the real world you''ll probably use an integrated
    development environment (IDE) of most, you could see a few questions on the exam
    that use the command line instead, so we''re going to review the basics. (By the
    way, we did NOT use an IDE while writing this book. We still have a slight preference
    for the command line while studying for the exam; all IDEs do their best to be
    "helpful," and sometimes they''ll fix your problems without telling you. That''s
    nice on the job, but maybe not so great when you''re studying for a certification
    exam!


    # Compiling with javac


    The javac command is used to invoke Java''s compiler. You can specify many options
    when running javac. For example, there are options to generate debugging information
    or compiler warnings. Here''s the structural overview for javac:


    ```

    javac [options] [source files]

    ```


    There are additional command-line options called @argfiles, but they''re rarely
    used, and you won''t need to study for the exam. Both the [options] and the [source
    files] are optional parts of the command, and both allow multiple entries. The
    following are legal javac commands:


    ```

    javac -help

    javac -version Foo.java Bar.java

    ```


    The first invocation doesn''t compile any files, but prints a summary of valid
    options. The second invocation passes the compiler an option (-version, which
    prints the version of the compiler you''re using) and passes the compiler two
    .java files to compile (Foo.java and Bar.java). Whenever you specify multiple
    options and/or files, they should be separated by spaces.


    # Launching Applications with java


    The java command is used to invoke the Java Virtual Machine (JVM). Here''s the
    basic structure of the command:


    ```

    java [options] class args

    ```


    The [options] and [args] parts of the java command are optional, and they can
    both have multiple values. You must specify exactly one class file to execute,
    and the java command assumes you''re talking about .class file, so you don''t
    specify the .class extension on the command line. Here''s an example:


    ```

    java -showversion MyClass x 1

    ```


    This command can be interpreted as "Show me the version of the JVM being used,
    and then launch the file MyClass.class and send it two String arguments whose
    values are x and 1." Let''s look at the'
