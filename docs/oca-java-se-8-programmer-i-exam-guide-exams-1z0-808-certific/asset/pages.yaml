    }\n```\n\nA class cannot extend more than one class: that means one parent per\
    \ class. A class can have multiple ancestors, however, since B could extend class\
    \ A, and C could extend class B, and so on. Any given class might have multiple\
    \ classes up its inheritance tree, but that's not the same as saying a class directly\
    \ extends two classes.\n\n![](img/0746bd23bbf07125e1cb15b26c3bffa0_118_0.png)\n\
    \nSome languages (such as C++) allow a class to extend more than one class. This\
    \ capability is known as \"multiple inheritance.\" The reason that Java's creators\
    \ chose not to allow multiple class inheritance is that it can become messy. In\
    \ a nutshell, the problem is that a class extended two other classes, and both\
    \ superclasses had, say, a doStuff() method, which version of doStuff() would\
    \ the subclass inherit? This issue can lead to a scenario called the \"Deadly\
    \ Diamond of Death,\" because of the shape of the class diagram that can be created\
    \ in a multiple inheritance design. The diamond is formed when classes B and C\
    \ both extend A, and both B and C inherit the method from A. If class D extends\
    \ both B and C, and both B and C have overridden the method in A, class D has,\
    \ in theory, two different implementations of the same method. Drawn as a class\
    \ diagram, the shape of the four classes looks like a diamond.\n\nSo if that doesn't\
    \ work, what could you do? You could simply put the animate() code in GameShape,\
    \ and then disable the method in classes that can't be animated. But that's a\
    \ bad design choice for many reasons—it makes the GameShape class less cohesive;\
    \ and it means the GameShape API \"advertises\" that all shapes can be animated\
    \ when in fact, that's not true since some of the GameShape subclasses will be\
    \ able to run the animate() method successfully.\n\n![](img/0746bd23bbf07125e1cb15b26c3bffa0_118_1.png)\n\
