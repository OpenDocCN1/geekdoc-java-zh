  md: "Note that if an exception occurred on, line 3 of the try block, the remaining\
    \ lines in the try block\n(4 and 5) would never be executed. Once control jumps\
    \ to the catch block, it never returns to complete\nthe balance of the try block.\
    \ This is exactly what you want, though. Imagine that your code looks\nlike this\
    \ pseudocode:\n\n```\ntry {\n  FromFileFromNetwork\n  readFromFileAndPopulateTable\n\
    } catch (CantGetFromFileNetwork) {\n  displayNetworkErrorMessage\n}\n```\n\nThis\
    \ pseudocode demonstrates how typically you work with exceptions. Code's dependent\
    \ on a risky\noperation (as populating a table with file data) is grouped into\
    \ a try block in such a way that if, say, the first operation fails, you won't\
    \ continue to\nrun other code's that are also guaranteed to fail. In the pseudocode\
    \ example, you won't be able to read from\nfile if you can't get the file off\
    \ the network in the first place.\n\nOne of the benefits using exception handling\
    \ is that code to handle any particular exception\nmay occur in the guarded region\
    \ needs to be written only once. Returning to our earlier code\nexample, there\
    \ may be three different places in our try block that can generate a MyFirstException,\n\
    whomever it occurs will be handled by the same catch block (on line 7). We'll\
    \ discuss more benefits of\nexception handling near the end of this chapter.\n\
    \n# Using finally\n\nAlthough try and catch provide a terrific mechanism for trapping\
    \ and handling exceptions, we are left\nwith the problem of how to clean up ourselves\
    \ if an exception occurs. Because exception transfers\nout of the try block as\
    \ soon as an exception is thrown, we can't put our cleanup code at the bottom\
    \ of the\ntry block and expect it to be executed if an an exception occurs. Almost\
    \ as bad an idea would be placing\nour cleanup code in each of the catch blocks—letlet's\
    \ see why.\n\nException handlers are a poor place to clean up after the code in\
    \ the try block because each handler\nrequires its own copy of the cleanup code.\
    \ If, for example, you allocated a network socket or opened\nfile somewhere in\
    \ the guarded region, each handler would have to close the file or release the\n\
    socket. That would make it too easy to forget to do cleanup and also lead to a\
    \ lot of redundant code. To\naddress this problem, Java offers the finally block.\n\
    \nA finally block encapsulates code that is always executed at some point after\
    \ the try block, whether an\nexception was thrown or not. Even if there is a return\
    \ statement in the try block, the finally block\nexecutes right before the return\
    \ statement is encountered and before the finally executes!\n\nThis is the right\
    \ place to close your files, release your network sockets, and perform any other\
    \ cleanup\ny your code requires. If the try block executes with no exceptions,\
    \ the finally block is executed\nimmediately after the try block completes. If\
    \ there was an exception thrown, the finally block executes\nimmediately after\
    \ the proper catch block completes. Let's look at another pseudocode example:"
