    # When to use ArrayLists


    We''ve already talked about arrays. Arrays seem useful and pretty darn flexible.
    So why do we need more functionality than arrays provide? Consider these two situations:


    +   - You need to be able to increase and decrease the size of your list of things.

    - The order of things in your list is important and might change.


    Both situations can be handled with arrays, but it''s not easy...

    Suppose you want to plan a vacation to Europe. You have several destinations in
    mind (Paris, Oslo, Rome), but you''re not yet sure in what order you want to visit
    these cities, and as your planning progresses, you might want to add or subtract
    cities from your list. Let''s say your first idea is to travel from north to south,
    so your list looks like this:

    Oslo, Paris, Rome.

    If we were using an array, we could start with this:


    ```

    String[] cities = {"Oslo", "Paris", "Rome"};

    ```


    But now imagine that you remember that you REALLY want to go to London, too! You''ve
    got two problems:


    +   - Your array is already full.

    - If you''re going from north to south, you need to insert London before Paris.


    Of course, you can figure out a way to do this. Maybe you could create a second
    array, and you copy cities from one array to the other, and at the correct moment
    you add London to the second array. Doable, but difficult.

    Now let''s see how you could do the same thing with an ArrayList:'
