  md: 'A method can never, ever, be marked as both abstract and final, or both abstract
    and final (which essentially means overridden by a subclass), whereas final and
    private methods cannot ever be overridden by a subclass. Or to phrase it another,
    an abstract designation means the superclass doesn''t know anything about how
    the subclasses should behave in method, whereas a final designation means the
    superclass knows how all subclasses (however far down the inheritance tree they
    may be) should behave in method. The abstract and final modifiers are virtually
    opposites. Because private methods cannot be seen by a subclass (let alone inherited),
    they, too, cannot be overridden, so, too, cannot be marked abstract.


    Finally, you need to know that—for top-level classes—the abstract modifier can
    never be combined with the static modifier. We will cover static methods later
    in this objective, but for now just remember that the following would be illegal:


    ```

    abstract void doStuff();

    ```


    And it would give you an error that should be familiar by now:


    Class.java:2: illegal combination of modifiers: abstract and static

    abstract static void doStuff();


    # Synchronized Methods


    The synchronized keyword indicates that a method can be accessed by only one thread
    at a time. When you are studying for OCP 8, you''ll study the synchronized keyword
    extensively, but for now...all''re concerned with knowing that the synchronized
    modifier can be applied only to methods—not variables, not classes, just methods.
    A typical synchronized declaration looks like this:


    ```

    public synchronized Record retrieveUser(int id) {

    ```


    You should also know that the synchronized modifier can be matched with any of
    the four access control levels (which means it can be paired with any of the access
    modifier keywords).


    # Native Methods


    The native modifier indicates that the method is implemented in platform-dependent
    code, in C. You don''t need to know how to use native methods for the exam, other
    than knowing that native is a modifier (thus a reserved keyword) and that native
    can be applied only to methods—not classes, not variables, just methods. Note
    that a native method''s body must be a semicolon;) (like abstract methods), indicating
    that the implementation is omitted.


    # Strictfp Methods


    We looked earlier at using strictfp as a class modifier, but even if you don''t
    declare a class as strictfp, you can still declare an individual method as strictfp.
    Remember, strictfp forces floating points (and any floating-point operations)
    to adhere to the IEEE 754 standard. With strictfp, you can predict how your floating
    points will behave regardless of the underlying platform the JVM is running on.
    The downside is that if the underlying platform is capable of supporting greater
    precision, a strictfp method will not be able to take advantage of it.'
