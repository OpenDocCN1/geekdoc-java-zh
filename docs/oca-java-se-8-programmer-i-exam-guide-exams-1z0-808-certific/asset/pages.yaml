    switch (x) {\n  case 2:\n  case 4:\n  case 6:\n  case 8:\n  case 10: { System.out.println(\"\
    x is even\"); break; }\n  default: System.out.println(\"x is an odd number\");\n\
    }\n```\n\n![](img/0746bd23bbf07125e1cb15b26c3bffa0_272_0.png)\n\nThe default case\
