    \ by the compiler:\n\n```\nclass Clothing {\n    Clothing(String s) { }\n}\nclass\
    \ TShirt extends Clothing {\n    // Constructor identical to compiler-supplied\n\
    \    // default constructor\n    TShirt() {\n        super(); // Won't work!\n\
    \        // tries to invoke a no-arg Clothing constructor\n        // but there\
    \ isn't one\n    }\n}\n```\n\nOne last point on the default constructor thing\
    \ (and it's probably very obvious, but we have to say it or we'll feel guilty\
    \ for years), constructors are never inherited. They can't be overridden (because\
    \ they aren't methods, and only instance methods can be overridden). So the type\
    \ of constructor(s) your superclass has no way determines the type of default\
