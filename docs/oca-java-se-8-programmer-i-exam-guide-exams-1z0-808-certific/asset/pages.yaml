    +   - A, B, C, D, E, and H are incorrect based on the above. (OCA Objective 9.5)


    +   - 14. D is correct. Invoking the plusDays() method creates a new object, and
    both LocalDate and DateTimeFormatter have format() methods.


    +   - A, B, C, E, and F are incorrect based on the above. (OCA Objective 9.3)


    +   -15. C is correct. The only error in this code is attempting to add a String
    to an ArrayList of Integer wrapper objects. Line 7 uses autoboxing, and lines
    6 and 9 demonstrate using a wrapper class''s constructors.


    +   - A, B, D, E, F are incorrect based on the above. (OCA Objectives 2.5 and
    9.4)'
