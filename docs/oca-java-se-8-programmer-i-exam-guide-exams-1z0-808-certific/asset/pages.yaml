    \nThe break statement causes the program to stop execution of the innermost loop\
    \ and start processing\nt next line of code after the block.\n\nThe continue statement\
    \ causes only the current iteration of the innermost loop to cease and the next\n\
    iteration of the same loop to start if the condition of the loop is met. When\
    \ using a continue statement\na with for loop, you need to consider the effects\
    \ that continue has on the loop iteration. Examine the\ncode below:\n\n```\nfor\
    \ (int i = 0; i < 10; i++) {\n    System.out.println(\"Inside loop\");\n    continue;\n\
    }\n```\n\nThe question is, is this an endless loop? The answer is no. When the\
    \ continue statement is hit,\nit iteration still runs! It runs just as though\
    \ the current iteration ended \"in the natural way.\" So in\nthe preceding example,\
    \ i will still increment before the condition (i < 10) is checked again.\nMost\
    \ of the time, a continue is used within an if test as follows:\n\n```\nfor (int\
    \ i = 0; i < 10; i++) {\n    System.out.println(\"Inside loop\");\n    if (foo.doStuff()\
    \ == 5) {\n        continue;\n    }\n    // more loop code, that won't be reached\
    \ when the above if\n    // test is true\n}\n```\n\n# Unlabeled Statements\n\n\
