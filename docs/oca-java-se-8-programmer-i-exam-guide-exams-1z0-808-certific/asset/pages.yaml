    # Primitive Casting


    Casting lets convert primitive values from one type to another. We mentioned primitive
    casting in the previous section, but now we''re going to take a deeper look. (Object
    casting was covered in Chapter 2).


    Casts can be implicit or explicit. An implicit cast means you don''t have to write
    code for the cast; the conversion happens automatically. Typically, an implicit
    cast happens when you''re doing a widening conversion—in other words, putting
    a smaller (say, a byte) into a bigger container (such as an int). Remember those
    "possible loss of precision" compiler errors we saw in the assignments section?
    Those happened when we tried to put a larger (say, a long) into a smaller container
    (such as a short). The large-value-into-small-container conversion is referred
    to as narrowing and requires an explicit cast, where you tell the compiler that
    you''re aware of the danger and accept full responsibility.


    First we''ll look at an implicit cast:


    ```

    int a = 100;

    long b = a; // Implicit cast, an int value always fits in a long

    ```


    An explicit cast looks like this:


    ```

    float a = 100.01f;

    int b = (int)a; // explicit cast, the int might lose some of float''s info!

    ```


    ```

    double d = 100L; // Implicit cast

    ```


    In the preceding statement, a double is initialized with a long value (as denoted
    by the L) after the'
