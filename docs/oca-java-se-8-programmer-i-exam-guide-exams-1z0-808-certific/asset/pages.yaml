    # Character Literals


    A char literal is represented by a single character in single quotes:


    ```

    char a = ''a'';

    char b = ''@'';

    ```


    You can also type in the Unicode value of the character, using the Unicode notation
    of prefixing the value with \u, as follows:


    ```

    char letterN = ''\u004E''; // The letter ''N''

    ```


    Remember, characters are 16-bit unsigned integers under the hood. That means you
    can assign a number literal, assuming it will fit into the unsigned 16-bit range
    (0 to 65535). For example, the following are legal:


    ```

    char a = 0x8b92;      // hexadecimal literal

    char b = 982;         // int literal

    char c = (char) 70000; // The cast is required; 70000 is

    char d = (char) -98;    // out of char range

    char d = (char) -1; // Ridiculous, but legal

    ```


    And the following are not legal and produce compiler errors:


    ```

    char e = -29;      // Possible loss of precision; needs a cast

    char f = 70000;     // Possible loss of precision; needs a cast

    ```


    You can also use an escape code (backslash) if you want to represent a character
    that can''t be typed as a literal, including the characters for linefeed, newline,
    horizontal tab, backspace, and quotes:


