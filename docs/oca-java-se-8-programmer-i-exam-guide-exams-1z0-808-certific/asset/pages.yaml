    # Using a Variable or Array Element

    That Is Uninitialized and Unassigned


    Java gives us the option of initializing a declared variable or leaving it uninitialized.
    When we attempt to use the uninitialized variable, we can get different behavior
    depending on what type of variable or array we are dealing with (primitives or
    objects). The behavior also depends on the level (scope) at which we are declaring
    our variable. An instance variable is declared within the class but outside any
    method or constructor, whereas a local variable is declared within a method (or
    in the argument list of the method).


    Local variables are sometimes called stack, temporary, automatic, or method variables,
    but the rules for these variables are the same regardless of what you call them.
    Although you can leave a local variable uninitialized, the compiler complains
    if you try to use a local variable before initializing it with a value, as we
    shall see.


