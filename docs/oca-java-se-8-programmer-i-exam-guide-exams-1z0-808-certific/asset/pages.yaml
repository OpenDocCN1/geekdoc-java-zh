  md: "The animal is a gray elephant\n\nWe mentioned that characters can be used in\
    \ comparison operators. When comparing a character with a character or a number,\
    \ Java will use the Unicode value of the character as the numerical value for\
    \ comparison.\n\n# “Equality” Operators\n\nJava also has two relational operators\
    \ (sometimes called “equality operators”) that compare two similar “things” and\
    \ return a boolean (true or false) that represents what’s true about the two “things”\
    \ being equal. These operators are\n\n+   - == Equal (also known as equal to)\n\
    - != Not equal (also known as not equal to)\n\nEach individual comparison can\
    \ involve two numbers (including char), two boolean values, or object reference\
    \ values. You can’t compare incompatible types, however. What would it mean to\
    \ ask if a boolean is equal to a char? Or if a Button is equal to a String array?\
    \ (This is nonsense, which is why you can’t do it.) There are four different types\
    \ of things that can be tested:\n\n+   - Numbers\n- Characters\n- Boolean primitives\n\
    - Object reference variables\n\nWhat does == look at? The value in the variable—in\
    \ other words, the bit pattern.\n\n# Equality for Primitives\n\nMost programmers\
    \ are familiar with comparing primitive values. The following code shows some\
    \ equality tests on primitive variables:\n\n```\nclass ComparePrimitives {\n \
    \   public static void main(String[] args) {\n        System.out.println(\"a'\
    \ == '?'\" + ('a' == '?'));\n        System.out.println(\"a' == 'b?\" + ('a' ==\
    \ 'b'));\n        System.out.println(\"5 == 6?\" + (5 == 6));\n        System.out.println(\"\
    5.0 == 5L?\" + (5.0 == 5L));\n        System.out.println(\"true == false?\" +\
    \ (true == false));\n    }\n}\n```\n\nThis produces the following output:\n\n\
    ```\nchar 'a' == '?' true\nchar 'a' == 'b?' false\n5 == 6? false\n5.0 == 5L? true\n\
    true == false? false\n```"
