  md: '# PREFACE


    His book’s primary objective is to help you prepare for and pass Oracle’s OCA
    SE 8 Programmer I certification exam.


    This book follows closely both the breadth and the depth of the real exams. For
    instance, after reading this book, you probably won’t emerge as an OO guru, but
    if you study the material and do well on the Self Tests, you’ll have a basic understanding
    of OO, and you’ll do well on the exam. After completing this book, you should
    feel confident that you have thoroughly reviewed all the objectives that Oracle
    has established for these exams.


    # In This Book


    This book is organized into six chapters to optimize your learning of the topics
    covered by the OCA 8 exam. Whenever possible, we’ve organized the chapters to
    parallel the Oracle objectives, but sometimes we’ll mix objectives or partially
    repeat them to present topics in an order better suited to learning the material.


    # In Every Chapter


    We’ve created a set of chapter components that call your attention to important
    items, reinforce important points, and provide helpful exam-taking hints. Take
    a look at what you’ll find in every chapter:


    +   - Every chapter begins with the Certification Objectives—what you need to
    know in order to pass the section on the exam dealing with the chapter topic.
    The Certification Objective headings identify the objectives within the chapter,
    so you’ll always know an objective when you see it!


    ![](img/0746bd23bbf07125e1cb15b26c3bffa0_19_0.png)


    Exam Watch notes call attention to information about, and potential pitfalls,
    in the exam. Because we were on the team that created these exams, we know what
    you’re about to go through!


    +   - On the Job callouts discuss practical aspects of certification topics that
    might not'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'occur on the exam, but that will be useful in the real world.


    +   - **Exercises** are interspersed throughout the chapters. They help you master
    skills that are likely to be an area of focus on the exam. Don’t just read through
    the exercises; they are hands-on practice that you should be comfortable completing.
    Learning by doing is an effective way to increase your competency with a product.


    +   - **From the Classroom** sidebars describe the issues that come up most often
    in the training classroom setting. These sidebars give you a valuable perspective
    into certification- and product-related topics. They point out common mistakes
    and address questions that have arisen from classroom discussions.


    +   - **The Certification Summary** is a succinct review of the chapter and a
    restatement of salient points regarding the exam.


    +   - **Two-Minute Drill** at the end of every chapter is a checklist of the main
    points of the chapter. It can be used for last-minute review.


    # Q&A **The Self Test** offers questions similar to those found on the certification
    exam, including multiple choice and pseudo drag-and-drop questions. The answers
    to these questions, as well as explanations of the answers, can be found at the
    end of every chapter. By taking the Self Test after completing each chapter, you’ll
    reinforce what you’ve learned from that chapter, while becoming familiar with
    the structure of the exam questions.'
