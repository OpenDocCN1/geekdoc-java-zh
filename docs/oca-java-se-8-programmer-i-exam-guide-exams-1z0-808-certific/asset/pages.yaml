    Animal [] animals = {new Dog(), new Cat()}; // legal ''for'' declarations

    for(long y : la); // loop thru an array of longs

    for(int n : twoDee); // loop thru the array of arrays

    for(int n2 : twoDee[2]); // loop thru the 3rd sub-array

    for(String s : sNames); // loop thru the array of Strings

    for(Object o : sNames); // set an Object reference to

    for(Animal a : animals); // each String

