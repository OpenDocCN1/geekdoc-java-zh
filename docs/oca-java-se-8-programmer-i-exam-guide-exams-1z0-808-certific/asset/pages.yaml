  md: "because of its instance variables were being set (by the other programmers\
    \ within their code)\nvalues you hadn't anticipated. Their code brought out errors\
    \ in your code. (Relax, this just\nhypothetical). Well, it is a Java program,\
    \ so you should be able to ship out a newer version of the class,\nwhere they\
    \ could replace your code without changing any of their own.\n\nThis scenario\
    \ highlights two of the promises/benefits of an object-oriented (OO) language:\
    \ flexibility\\and maintainability. But those benefits don't come automatically.\
    \ You have to do something. So what if Java\nsupports OO? It can't design your\
    \ code for you. For example, imagine you made your class with public\ninstance\
    \ variables, and those other programmers were setting the instance variables directly,\
    \ as the\nthe code demonstrates:\n\n```\npublic class BadOO {\n    public int\
    \ size;\n    public int weight;\n    ...\n}\n\npublic class ExploitBadOO {\n \
    \   public static void main (String args) {\n        BadOO b = new BadOO();\n\
    \        b.size = -5; // Legal but bad!\n    }\n}\n```\n\nAnd now you're in trouble.\
    \ How are you going to change the class in a way that lets you handle the\nissues\
    \ that come up when somebody changes the size variable to a value that causes\
    \ problems? Your\nonly choice is to go back in write method code to adjust size\
    \ (a setState(int a) method, for\nexample) and then insulate the size variable\
    \ with, say, a private access modifier. But as soon as you\nmake that change to\
    \ your code, you break everyone else's!\n\nThe ability to make changes in your\
    \ implementation code without breaking the code of others who use\ny code is a\
    \ key benefit of encapsulation. You want to hide implementation details behind\
    \ a public\nprogramming interface. By interface, we mean the set of accessible\
    \ methods your code makes available\nfor other code to call—in other words, your\
    \ code's API. By hiding implementation details, you can\nrework your method code\
    \ (perhaps also altering the way variables are used by your class) without forcing\n\
    a change in the code that you changed method.\n\nIf you want maintainability,\
    \ flexibility, and extensibility (and, of course, you do), your design must\n\
    include encapsulation. How do you do?\n\n+   - Keep instance variables hidden\
    \ (with an access modifier, often private).\n- Make public accessor methods, and\
    \ force calling code to use these methods rather than\ndirectly accessing the\
    \ instance variable. These so-called accessor methods allow users of your\nclass\
    \ to set a variable's value or get a variable's value.\n- For these accessor methods,\
    \ use the most common naming convention of set<SomeProperty>\nand get<SomeProperty>.\n\
    \nFigure 2-1 illustrates the idea that encapsulation forces callers of our code\
    \ to go through methods\nrather than accessing variables directly."
