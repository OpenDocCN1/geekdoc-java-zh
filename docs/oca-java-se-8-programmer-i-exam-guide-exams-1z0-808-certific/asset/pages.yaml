    \nThis question might seem to be testing you on some complex arithmetic operator\
    \ trivia, when, in fact, it’s testing you on your knowledge of the final modifier.\n\
    \n# Conditional Operator\n\nThe conditional operator is a ternary operator (it\
    \ has three operands) and is used to evaluate boolean expressions—much like an\
    \ if statement, except instead of executing a block of code if the test is true,\
    \ a operator will assign a value to a variable. In other words, the goal of the\
    \ conditional operator is to decide which of two values to assign to a variable.\
    \ This operator is constructed using a ? (question mark) and a :(colon). The parentheses\
    \ are optional. Here is its structure:\n\nx = (boolean expression) ? value to\
    \ assign if true : value to assign if false\n\nLet’s take a look at a conditional\
    \ operator in code:\n\n```\nclass Salary {\n    public static void main(String\
    \ [] args) {\n        int numOfPets = 3;\n        String status = (numOfPets)\
    \ ? \"Pet limit not exceeded\"\n                                            :\
    \ \"too many pets\";\n        System.out.println(\"This pet status is \" + status);\n\
    \    }\n}\n```\n\nYou can read the preceding code as “Set numOfPets equal to 3”.\n\
    Next we’re going to assign a String to the status variable. If numOfPets is less\
    \ than 4, assign “Pet limit not exceeded” to the status variable; otherwise, assign\
    \ “too many pets” to the status variable."
