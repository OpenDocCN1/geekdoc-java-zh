  md: '# Declaring Primitives and Primitive Ranges


    Primitive variables can be declared as class variables (statics), instance variables,
    method parameters, and local variables. You can declare one or more primitives,
    of the same primitive type, in a single line.

    Chapter 3 we will discuss the various ways in which they can be initialized, but
    for now we''ll leave you with a few examples of primitive variable declarations:


    ```

    byte b;

    boolean myBooleanPrimitive;

    int x, y, z; // declare three int primitives

    ```


    On previous versions of the exam you needed to know how to calculate ranges for
    all the Java primitives. For the current exam, you can skip some of that detail,
    but it''s still important to understand that for the integer types the sequence
    from small to big is byte, short, int, and long, and that doubles are bigger than
    floats.


    +   You will also need to know that the number types (both integer and floating-point
    types) are all signed and how that affects their ranges. First, let''s review
    the concepts.


    All six number types in Java are made up of a certain number of 8-bit bytes and
    are signed, meaning they can be negative or positive. The leftmost bit (the most
    significant digit) is used to represent the sign, where a 1 means negative and
    0 means positive, as shown in Figure 1-6. The rest of the bits represent the value,
    using two''s complement notation.'
