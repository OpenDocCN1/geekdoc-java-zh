    \ chain of methods that your program executes to get to the current method. If\
    \ your program starts in main() and main() calls method a(), which calls method\
    \ b(), which in turn calls the stack consists of the following:\n\n+   c\nb\n\
    a\nmain\n\nWe will represent the stack as growing upward (although it can also\
    \ be visualized as growing downward). The last method called is at the top of\
    \ the stack, while the first calling method is at the bottom. The method at the\
    \ very top of the stack trace would be the method you were currently executing.\
    \ If we move back down the call stack, we're moving from the current method to\
    \ the previously called method. Figure 5-1 illustrates a way to think about how\
    \ the call stack in Java works."
