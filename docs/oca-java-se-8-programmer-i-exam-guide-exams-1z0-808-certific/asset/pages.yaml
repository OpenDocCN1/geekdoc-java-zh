    # # Initializing an Array


    Initializing an array means putting things into it. The "things" in the array
    are its elements, and they''re primitive values (2, x, false) or objects referred
    to by the reference variables in the array. If you have an array of objects (as
    opposed to primitives), the array doesn''t actually hold the objects—just as any
    other primitive variable never actually holds the object—but instead holds a reference
    to the object. We do talk about arrays as, for example, "an array of five strings,"
    even though what we mean is "an array of references to String objects." The big
    question becomes whether these references are actually pointing (Oops, this is
    Java, we mean referring to) real strings or are simply null. **Remember**, if
    a reference that hasn''t had an object assigned to, say, applying the dot operator
    to invoke a method on, you''ll get the NullPointerException.

    The individual elements in the array can be accessed with an index number. The
    index number always begins with zero (0), so for an array of ten objects, the
    index numbers will run from 0 through 9.'
