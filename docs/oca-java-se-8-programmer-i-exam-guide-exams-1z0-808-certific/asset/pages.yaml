    # Operator Precedence


    The OCA 8 exam has reintroduced the topic of operator precedence. As you probably
    already know but will deinitely see demonstrated in this section, when several
    operators are used in combination, the order in which they are evaluated can alter
    the result of the expression.


    # Operator Precedence Rant


    Allow us rant for a minute here. Memorizing operator precedence was on the old
    SCJP 1.2 exam about 15 years ago. Starting with the SCJP 1.4 exam, and for all
    the exams until the OCA 8, operator precedence has not been on the exam. For a
    glorious 15 years, candidates did not have to do this bit of memorization. Sadly,
    this snuck its way back into the exam for OCA 8. Why do we care so much about
    this? Take a look at this:


    ```

    System.out.println(true & false == false | true);

    ```


    What result would you expect? Imagine a more realistic version, evaluating some
    booleans:


    ```

    System.out.println(b1 & b2 == b3 | b4);

    ```


    What would you guess the programmer''s intention was here? There are two likely
    scenarios:


    # Scenario 1: (b1 & b2) == (b3 | b4) If this was the programmer''s intention,
    then he just created a bug.'
