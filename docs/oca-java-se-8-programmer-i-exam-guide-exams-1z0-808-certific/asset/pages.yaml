    # CERTIFICATION OBJECTIVE


    # Use Interfaces (OCA Objective 7.5)


    7.6 Use abstract classes and interfaces.


    # Declaring an Interface


    In general, when you create an interface, you''re defining a contract for *what*
    a class can do, without saying about *how* the class will do.


    > Note: As of Java 8, you can also describe the *how*, but you usually don''t.
    Until we get to the new interface-related features of Java 8—default and static
    methods—we will discuss interfaces from a traditional perspective, which is again,
    defining a contract for *what* a class can do.


    An interface is a contract. You could write an interface Bounceable, for example,
    that says in effect, "This is the Bounceable interface." Any class type that implements
    this interface must agree to write the code for the bounce() and setBounceFactor()
    methods.


    By defining an interface for Bounceable, any class that wants to be treated as
    a Bounceable thing can simply implement the Bounceable interface and provide code
    for the interface''s two methods.


    Interfaces can be implemented by any class, by any inheritance. This lets you
    radically different classes and give them a common characteristic. For example,
    you might want both a Ball and a Tire to have bounce behavior, but Ball and Tire
    don''t share any inheritance relationship; Ball extends Tire extends only java.lang.Object.
    By making both Ball and Tire implementation Bounceable, you''re saying that Ball
    and Tire can be treated as "Things that can bounce," which in Java translates
    to, "Things on which you can invoke the bounce() and setBounceFactor() methods."
    Figure 1-1 illustrates the relationship between interfaces and classes.'
