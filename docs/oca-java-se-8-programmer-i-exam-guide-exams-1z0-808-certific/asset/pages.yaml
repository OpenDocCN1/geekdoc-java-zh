  md: "Instance init blocks run every time a class instance is created.\nInstance\
    \ init blocks run after the constructor's call to super().\n\nWith those rules\
    \ in mind, the following output should make sense:\n\n```\n1st static init\n2nd\
    \ static init\n1st instance init\n2nd instance init\nno-arg const\n1st instance\
    \ init\n2nd instance init\n1-arg const\n```\n\nAs you can see, the instance init\
    \ blocks each ran twice. Instance init blocks are often used as a place to put\
    \ code that all the constructors in a class should share. That way, the code doesn't\
    \ have to be duplicated across constructors.\n\nFinally, if you make a mistake\
