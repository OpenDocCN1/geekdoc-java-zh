  md: "# if-else Branching\n\nThe basic format of an if statement is as follows:\n\
    \n```\nif (booleanExpression) {\n    System.out.println(\"Inside if statement\"\
    );\n}\n```\n\nThe expression in parentheses must evaluate to (a boolean) true\
    \ or false. Typically, you're testing something to see if it's true and then running\
    \ a code block (one or more statements) if it is true and (optionally) another\
    \ block of code if it isn't. The following code demonstrates a legal if-else statement:\n\
    \n```\nif (x > 3) {\n    System.out.println(\"x is greater than 3\");\n} else\
    \ {\n    System.out.println(\"x is not greater than 3\");\n}\n```\n\nThe else\
    \ block is optional, so you can also use the following:\n\n```\nif (x > 3) {\n\
    \    y = 2;\n    z += 8;\n    a = y + x;\n}\n```\n\nThe preceding code will assign\
    \ 2 to y if the test succeeds (meaning x is really greater than 3), but the other\
    \ two lines will execute regardless. Even the curly braces are optional if you\
    \ have only one statement to execute within the body of the conditional block.\
    \ The following code example is legal (although not recommended for readability):\n\
    \n```\nif (x > 3) // bad practice, but seen on the exam\ny = 2;\nz += 8;\na =\
    \ y + x;\n```\n\nMost developers consider it good practice to enclose blocks within\
    \ curly braces, even if there's only one statement in the block. Be careful with\
    \ code like the preceding, because you might think it should read as\n\n> “If\
    \ x is greater than 3, then set y to 2, z to z + 8, and a to y + x.”\n\nBut the\
    \ last two lines are going to execute no matter what! They aren't part of the\
    \ conditional flow. You might find it even more misleading if the code were indented\
    \ as follows:\n\n```\nif (x > 3) {\ny = 2;\nz += 8;\na = y + x;\n```"
