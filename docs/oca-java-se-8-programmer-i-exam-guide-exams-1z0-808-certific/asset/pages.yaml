    Then again, why would you want? Instead of testing the variable, you'd be declaring\
    \ and initializing it, so it would always have the exact same value. Not much\
    \ of a test condition!\n\nThe key point to remember about a while loop is that\
    \ it might never run. If the test expression is false the first time the expression\
    \ is checked, the loop body will be skipped and the program will begin executing\
    \ at the first statement after the while loop. Look at the following example:\n\
