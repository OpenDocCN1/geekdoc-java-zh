    # # Static Variables and Methods


    Note: The discussion of static in this section DOES NOT include the new static
    interface method discussed earlier in this chapter. Don''t just love how the Java
    8 folks reused important Java terms? The static modifier is used to create variables
    and methods that will exist independently of any instances created for the class.
    All static members exist before you make a new instance of a class, and there
    will be only one copy of a static member regardless of the number of instances
    of class. In other words, all instances of a given class share the same value
    for any given static variable. We''ll cover static members in great detail in
    the next chapter.


    **Things you can mark as static:**


    +   - Methods

    - Variables

    - A class nested within another class, but not within a method (not on the OCA
    8 exam)

    - Initialization blocks


    **Things you can''t mark as static:**


    +   - Constructors (makes no sense; a constructor is used only to create instances)

    - Classes (unless they are nested)

    - Interfaces (unless they are nested)

    - Local inner classes (not on the OCA 8 exam)

