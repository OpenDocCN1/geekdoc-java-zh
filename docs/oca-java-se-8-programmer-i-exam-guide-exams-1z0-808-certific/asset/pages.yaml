  md: 'With respect to the method it overrides, the overriding method


    +   Must have the same argument list

    Must have the same return type or a subclass (known as a covariant return)

    Must not have a more restrictive access modifier

    May have a less restrictive access modifier

    Must not throw new or broader checked exceptions

    May throw fewer or narrower checked exceptions, or any unchecked exception


    final methods cannot be overridden.


    Only inherited methods may be overridden, and remember that private methods are
    not inherited.


    A subclass uses super.overriddenMethodName() to call the superclass version of
    an overridden method.


    A subclass uses MyInterface.super.overriddenMethodName() to call the super interface
    version on an overridden method.


    Overloading means reusing a method name but with different arguments.


    Overloaded methods


    +   Must have different argument lists

    May have different return types, if argument lists are also different

    May have different access modifiers

    May throw different exceptions


    Methods from a supertype can be overriden.


    Polymorphism applies to overriding, not to overloading.


    Object type (not the reference variable''s type) determines which overridden method
    is used at runtime.


    Reference type determines which overloaded method will be used at compile time.


    # Reference Variable Casting (OCA Objective 7.3)


    +   There are two types of reference variable casting: downcasting and upcasting.


    +   Downcasting If you have a reference variable that refers to a subtype object,
    you can assign it to a reference variable of the subtype. You must make an explicit
    cast to do this, and the result is that you can access the subtype''s members
    with this new reference variable.


    +   Upcasting You can assign a reference variable to a supertype reference explicitly
    or implicitly. This is an inherently safe operation because the assignment restricts
    the access capabilities of the new variable.


    # Implementing an Interface (OCA Objective 7.5)'
