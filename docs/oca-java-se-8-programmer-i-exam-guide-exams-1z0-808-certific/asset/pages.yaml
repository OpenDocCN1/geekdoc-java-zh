    \ list are called, surprisingly, enums.)\n\nUsing enums can help reduce the bugs\
    \ in your code. For instance, imagine you're creating a commercial-coffee-establishment\
    \ application, and in your coffee shop application, you might want to restrict\
    \ your CoffeeSize selections to BIG, HUGE, and OVERWHELMING. If you let an order\
    \ for a LARGE or a GRANDE slip in, it might cause an error. Enums to the rescue.\
    \ With the following simple declaration, you can guarantee that the compiler will\
    \ stop you from assigning anything to a CoffeeSize except BIG, HUGE, or OVERWHELMING:\n\
    \n```\nenum CoffeeSize { BIG, HUGE, OVERWHELMING };\n```\n\nFrom then on, the\
    \ only way to get a CoffeeSize will be with a statement something like this:\n\
    \n```\nCoffeeSize cs = CoffeeSize.BIG;\n```\n\nIt's not required that enum constants\
    \ be in all caps, but borrowing from the Oracle code convention that constants\
    \ are named in caps, it's a good idea.\nThe basic components of an enum are its\
    \ constants (that is, BIG, HUGE, and OVERWHELMING), although in a minute you'll\
    \ see that there can be a lot more to an enum, enums can be declared as their\
    \ own separate class or as a class member; however, they must not be declared\
    \ within a method!\nHere's an example declaring an enum outside a class:\n\n```\n\
    enum CoffeeSize { BIG, HUGE, OVERWHELMING } // this cannot be // private or protected\n\
