  md: '# Passing Variables into Methods (OCA Objective 6.6)


    6.8 Determine the effect upon object references and primitive values when they
    are passed into methods that change the values.


    Methods can be declared to take primitives and/or object references. You need
    to know how (or if) the caller''s variable can be affected by the called method.
    The difference between object reference and primitive variables, when passed into
    methods, is huge and important. To understand this section, you''ll need to be
    comfortable with the information covered in the "Literals, Assignments, and Variables"
    section in the early part of this chapter.


    # Passing Object Reference Variables


    When you pass an object variable into a method, you must keep in mind that you''re
    passing the object reference, not the actual object itself. Remember that a reference
    variable holds bits that represent (the underlying VM) a way to get to a specific
    object in memory (on the heap). Most importantly, you remember that you are not
    even passing the actual reference variable, but rather a copy of the reference
    variable. A copy of variables means you get a copy of the bits in that, so when
    you pass a reference variable, you''re passing a copy of the bits representing
    how to get to a specific object. In other words, both the caller and the called
    method will have identical copies of the reference; thus, both will refer to the
    same (not a copy) object on the heap.


    For this example, we will use the Dimension class from the java.awt package:


    +   1. import java.awt.Dimension;

    2. class ReferenceTest {

    3. public static void main(String [] args) {

    4. Dimension d = new Dimension(5,10);

    5. ReferenceTest rt = new ReferenceTest();

    6. System.out.println("Before, d.height: " + d.height);

    7. rt.modify(d);

    8. System.out.println("After, d.height: " + d.height);

    9. }

    10. void modify(Dimension dim) {

    11. dim.height = dim.height + 1;

    12. System.out.println("dim = " + dim.height);

    13. } }


    When we run this class, we can see that the modify() method was, indeed, able
    to modify the original (and only) Dimension object created on line 4.


