  md: '# CERTIFICATION OBJECTIVE


    # Common Exceptions and Errors (OCA Objective 8.5)


    8.5 Recognize common exception classes (such as NullPointerException, ArithmeticException,
    ArrayIndexOutOfBoundsException, ClassCastException) sic


    The intention of this objective is to make sure that you are familiar with some
    of the most common exceptions and errors you''ll encounter as a Java programmer.


    ![](img/0746bd23bbf07125e1cb15b26c3bffa0_301_0.png)


    > The questions from this section are likely to be along the lines of, "Here''s
    some code that did something bad, which exception will be thrown" Throughout the
    exam, questions will present some code and ask you to determine whether the code
    will run or whether an exception will be thrown. Since these questions are so
    common, understanding the causes for these exceptions is critical to your success.


    This is another one of those objectives that will turn up all through the real
    exam (does "An exception is thrown at runtime" ring a bell?), so make sure this
    section gets a lot of your attention.


    # Where Exceptions Come From


    Jump back a page and take a look at the last sentence. It''s important that you
    understand what causes exceptions and errors and where they come from. For the
    purposes of exam preparation, let''s define two categories of exceptions and errors:


    +   - JVM exceptions Those exceptions or errors that are either exclusively or
    most logically thrown by the JVM

    - Programmatic exceptions Those exceptions that are thrown explicitly by application
    and/or API programmers


    # JVM-Thrown Exceptions


    Let''s start with a very common exception, the NullPointerException. As we saw
    in earlier chapters, this exception occurs when you attempt to access an object
    using a reference variable with a current value of null. There''s no way that
    the compiler can hope to find these problems before runtime. Take a look at the
    following:'
