    # Tips on Taking the Exam


    The number of questions and passing percentages for every exam are subject to
    change. Always check with Oracle before taking the exam, at www.Oracle.com.


    You are allowed to answer questions in any order, and you can go back and check
    your answers after you''ve gone through the test. There are no penalties for wrong
    answers, so it''s better to at least attempt an answer than to give one at all.


    A good strategy for taking the exam is to go through one and answer all the questions
    that come to you. You can then go back and do the others. Answering one question
    might jog your memory for how to answer a previous one.


    Be very careful with the code examples. For syntax errors first: curly braces,
    semicolons, and parentheses, and make sure there are as many left as ones. Look
    for capitalization errors and other syntax problems before trying to figure out
    what the code does.


    Many of the questions on the exam will hinge on subtleties of syntax. You will
    need to have a thorough knowledge of the Java language in order to succeed.


