    Many of the exam questions covering this chapter''s topics use a tricky bit of
    Java syntax known as "chained methods". A statement with chained methods has this
    general form:


    ```

    result = method().method(2).method(3);

    ```


    In theory, any number of methods can be chained in this fashion, although typically
    you won''t see more than three. Here''s how to decipher these "handy Java shortcuts"
    when you encounter them:


    +   1. Determine what the leftmost method call will return (let''s call x).

    2. Use x as the object invoking the second (from the left) method. If there are
    only two chained methods, the result of the second method call is the expression''s
    result.

    3. If there is a third method, the result of the second method call is used to
    invoke the third method, whose result is the expression''s result-for example,


    ```

    String x = "abc";

    String y = x.concat("def").toUpperCase().replace(''C'', ''X''); // chained methods

