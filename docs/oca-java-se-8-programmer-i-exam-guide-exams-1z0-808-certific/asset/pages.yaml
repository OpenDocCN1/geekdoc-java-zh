  md: '# INTRODUCTION


    # Organization


    This book is organized in such a way to serve as an in-depth review for the OCA
    8 exam, for both experienced Java professionals and those in the early stages
    of experience with Java technologies. Each chapter covers at least one major aspect
    of the exam, with an emphasis on the “why” as well as the “how to” programming
    in the Java language.


    Practice exam software with two 80-question exams is available for download.


    # What This Book Is Not


    You will not find a beginner’s guide to learning Java in this book. All 500+ pages
    of this book are dedicated solely to helping you pass the exam. If you are brand
    new to Java, we suggest you spend a time learning the basics. You should not start
    with this book until you know how to write, compile, and run simple Java programs.
    We do not, however, assume any level of prior knowledge of the individual topics
    covered. In other words, for any given topic (driven exclusively by the actual
    exam objectives), we start with the assumption that you are new to that topic.
    So we assume you’re new to the individual topics, but that we are not new to Java.


    We also do not pretend to be preparing you for the exam and simultaneously making
    you a complete Java being. This is a certification exam study guide, and it’s
    very clear about its mission. It’s not to say that preparing for the exam won’t
    make you a better Java programmer! On the contrary, even the most experienced
    Java developers often claim that having to prepare for the certification exam
    made them far knowledgeable and well-rounded programmers than they would have
    been without the exam-driven studying.


    # Digital Content


    For more information about the practice exam software, please see the Appendix.


    # Some Pointers


    Once you’ve finished reading this book, set aside some time to do a thorough review.
    You might want to return to the book several times and make use of all the methods
    it offers for the material:


    +   1. Re-read all the Two-Minute Drills, or have someone quiz you. You can also
    use the drills as a way to get a quick cram before the exam. You might want to
    make some flash cards out of 3 × 5 index cards that have the Two-Minute Drill
    material on them.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '2. Re-read all the Exam Notes. Remember that these notes are written by authors
    who helped create the exam. Remember what you know should expect—and what you
    should be on the lookout for.


    3. Re-take the Self Tests. Taking the tests right after you read the chapter is
    a good idea because questions reinforce what you''ve just learned. However, it''s
    an even better idea to go back later and do all the questions in the book in one
    sitting. Pretend that you''re taking the live exam. (Whenever you take the Self
    Tests, mark your answers on a separate piece of paper. That way, you can run through
    the questions as many times as you need to feel comfortable with the material.)


    4. Complete the exercises. The exercises are designed to cover exam topics, and
    there''s no better way to get to know this material than by practicing. Be sure
    you understand why you are performing each step in each exercise. If there is
    something you''re unclear on, re-read that section in the chapter.


    5. Write lots of Java code. We''ll repeat this advice several times. When we wrote
    this book, we wrote hundreds of small programs to help us do our research. We
    have heard from hundreds of candidates who have passed the exam, and in almost
    every case, the candidates who scored extremely well on the exam wrote lots of
    code during their studies. Experiment with the code samples in the book, create
    horrendous lists of compiler errors—put away your IDE, crank up the command line,
    and write code!


    # Introduction to the Material in the Book


    The OCA 8 exam is considered one of the hardest in the IT industry, and we can
    tell you from experience that a large chunk of exam candidates goes into it unprepared.
    As programmers, we need to learn only what we need to complete our current project,
    given the insane deadlines we''re usually under.


    But this exam attempts to prove your complete understanding of the Java language,
    not just the parts of it you''ve become familiar with in your work.


    Experience will alone get you through this exam with a passing mark, even when
    the things you know might work just a little differently than you imagined. It''s
    not enough to be able to get your code to work correctly; you must understand
    the core fundamentals in a deep way, and with enough breadth to cover virtually
    anything that could crop up in the course of using the language.


    # Who Ares Certification?


    Employers do. Headhunters do. Programmers do. Passing this exam proves three important
    things to a current or prospective employer: you''re smart; you know how to study
    and prepare for a challenging test; and, of all, you know the Java language. If
    an employer has a choice between a candidate who has passed the exam and one who
    doesn''t, the employer knows that the certified programmer does not have to take
    time to learn the Java language.


    But does it mean that you can develop software in Java? Not necessarily, but it''s
    a good head start. To really demonstrate your ability to develop (as opposed to
    just your knowledge of the language), you should consider pursuing the Java Developer
    Exam, where you''re given an assignment to build a program, start to finish, and
    submit it for an assessor to evaluate and score.'
