    # Cleaning Up Before Garbage Collection—the finalize() Method


    Java provides a mechanism that lets you run some code before your object is deleted
    by the garbage collector. This collector is a method named finalize() that all
    classes inherit from class Object. On the surface, this looks like a great idea;
    maybe your object opened up some resources, you''d like to close them before your
    object is deleted. The problem is that, as you may have gathered now, you can
    never count on the garbage collector to delete an object. So, any code you put
    into your class''s overridden finalize() method is not guaranteed to run. Because
    the finalize() method might run, but you can''t count on, put any essential code
    into your finalize() method. In fact, we recommend that, in general, you don''t
    override finalize() at all.


    # Tricky Little finalize() Gotchas


    There are a couple of concepts concerning finalize() that you need to remember:


    +   - For any object, finalize() will be called only once (at most) by the garbage
    collector.


    +   - Calling finalize() can actually result in saving an object from deletion.


    Let''s examine these statements a little further. First of all, remember that
    any code you can put into a normal method you can put into finalize(). For example,
    in the finalize() method you could write code that has a reference to the object
    in question back to another object, effectively ineligible-finalizing the object
    for garbage collection. If at some later point this object becomes eligible for
    garbage collection again, the garbage collector can still process the object and
    delete it. The garbage collector, however, will remember that, for this object,
    finalize() already ran, and it will not run finalize() again.


