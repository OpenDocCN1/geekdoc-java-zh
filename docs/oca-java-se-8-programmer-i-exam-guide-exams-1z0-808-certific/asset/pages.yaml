  md: "```\nclass A {\n  A() {\n    this(\"foo\");\n  }\n  A(String s) {\n    this();\n\
    \  }\n}\n```\n\nYour compiler may not actually catch the problem (it varies depending\
    \ on the compiler), but most won't catch the problem). It assumes you know what\
    \ you're doing. Can you spot the flaw? Given that a super constructor must always\
    \ be called, where would the call to super() go? Remember, the compiler won't\
    \ put in a default constructor if you've already got one or more constructors\
    \ in your class. If the compiler doesn't put in a default constructor, it still\
    \ inserts a call to super() in any constructor that doesn't explicitly have a\
    \ call to the super constructor—unless, that the constructor already has a call\
    \ to this(). So in the preceding code, where can super() go? The only two constructors\
    \ in the class both have calls to this(), and, in fact, you'll get exactly what\
    \ you'd get if you typed the following method code:\n\n```\npublic void go() {\n\
    \  doStuff();\n}\n\npublic void doStuff() {\n  go();\n}\n```\n\nNow you see the\
    \ problem? Of course you can. The stack explodes! It gets higher and higher until\
    \ it just bursts and method code keep spilling out, oozing out of the JVM onto\
    \ the floor. Two overloaded constructors both calling this() are two constructors\
    \ calling each other—over and over and over, resulting in:\n\n```\n% java A\n\
    Exception in thread \"main\" java.lang.StackOverflowError\n```\n\nThe benefit\
    \ of having overloaded constructors is that you offer flexible ways to instantiate\
    \ objects from your class. The benefit of having one constructor invoke another\
    \ overloaded constructor is to avoid code duplication. In the Animal example,\
    \ there wasn't any code other than setting the name, but imagine if after line\
    \ 4 there was still work to be done in the constructor. By putting all the other\
    \ constructor work in one constructor, and then having the other constructors\
    \ invoke it, you don't have to write and maintain multiple versions of that other\
    \ important constructor code. Basically, each of the not-the-real-one overloaded\
    \ constructors will call another overloaded constructor, passing whatever data\
    \ it needs (the data the client didn't supply).\n\nConstructors and instantiation\
    \ become even more exciting (just when you thought it was safe) when you get to\
    \ inner classes, but we know we can stand to only so much fun in one chapter,\
    \ and besides, you don't have to deal with inner classes until you tackle the\
    \ OCP exam.\n\n# CERTIFICATION OBJECTIVE"
