  md: "# Determine Whether a Default Constructor Will Be Created\n\nThe following\
    \ example shows a Horse class with two constructors:\n\n```\nclass Horse {\n \
    \   Horse() { }\n    Horse(String name) {}\n}\n```\n\nWill the compiler put in\
    \ a default constructor for this class? No!\nHow about for the following variation\
    \ of the class?\n\n```\nclass Horse {\n    Horse(String name) {}\n}\n```\n\nNow\
    \ will the compiler insert a default constructor? No!\nWhat about this class?\n\
    \n```\nclass Horse { }\n```\n\nNow we’re talking. The compiler will generate a\
    \ default constructor for this class because the class doesn’t have any constructors\
    \ defined.\nOkay, what about this class?\n\n```\nclass Horse {\n    void Horse()\
    \ {}\n}\n```\n\nIt might look like the compiler won’t create a constructor, since\
    \ one is already in the Horse class. Or is it? Take another look at the preceding\
    \ Horse class.\nWhat’s wrong with the Horse() constructor? It isn’t a constructor\
    \ at all! It’s simply a method that happens to have the same name as the class.\
    \ Remember, the return type is a giveaway that we’re looking at a method, not\
    \ a constructor.\n\nHow do you know for sure whether a default constructor will\
    \ be created? Because you didn’t write any constructors in your class.\n\nHow\
    \ do you know what the default constructor will look like? Because...\n\n+   -\
    \ The default constructor has the same access modifier as the class.\n- The default\
    \ constructor has no arguments.\n- The default constructor includes a no-arg call\
    \ to the super constructor (super()).\n\nTable 2-5 shows what the compiler will\
    \ (or won’t) generate for your class.\n\nTABLE 2-5 Compiler-Generated Constructor\
    \ Code"
