  md: '# Public Access


    A class declaration with the public keyword gives all classes from all packages
    access to the public class. In other words, all classes in the Java Universe (JU)
    have access to a public class. Don''t forget, though, if a public class you''re
    trying to use is in a different package from the class you''re writing, you''ll
    still need to import the public class.


    In the example of the preceding section, we may not want to place the subclass
    in the same package as the superclass. To make the code work, we need to add the
    keyword public in front of the superclass (Beverage) declaration, as follows:


    ```

    package cert;

    public class Beverage { }

    ```


    This changes the Beverage class so it will be visible to all classes in all packages.
    The class can now be instantiated from all other classes, and any class is free
    to subclass (extend from) it—unless, that, the class is also marked with the nonaccess
    modifier final. Read on.


    # Other (Nonaccess) Class Modifiers


    You can modify a class declaration using the keyword final, abstract, or strictfp.
    These modifiers are in addition to whatever access control is on the class, so
    you could, for example, declare a class as both public and final. But you can''t
    always mix nonaccess modifiers. You are free to use strictfp in combination with
    final, but you must never, ever make a class as both final and abstract.


    You won''t need to know how strictfp works, so we''re focusing on only modifying
    a class final or abstract. For the exam, you need to know only that strictfp is
    a keyword and can be used to modify a class or a method, but not a variable. Marking
    a class as strictfp means that any method code in the class will conform strictly
    to the IEEE 754 standard for ruling floating points. Without that modifier, floating
    points used in the methods might behave in a platform-dependent way. If you don''t
    declare a class as strictfp, you can still get strictfp behavior on a method-by-method
    basis by declaring a method as strictfp. If you don''t know the IEEE 754 standard,
    now''s not the time to learn it. You have, as they say, bigger fish to fry.


    # Final Classes


    When used in a class declaration, the final keyword means the class can''t be
    subclass. Under other words, no class can extend (inherit from) a final class,
    and any attempts to do so will result in a compiler error.


    So why would you ever mark a class final? After all, doesn''t that violate the
    whole OO notion of inheritance? You should make a final class only if you need
    an absolute guarantee that none of the methods in that class ever be overridden.
    If you''re deeply dependent on the implementations of certain methods, using final
    gives you the security that nobody can change the implementation out from you.


    You''ll notice many classes in the Java core libraries are final. For example,
    the String class cannot be subclassed. Imagine the havoc if you couldn''t guarantee
    that a String object would work on any given system your application is running
    on! If programmers were free to extend the String class and substitute it with
    their own String subclass in instances where java.lang.String instances are expected),
    civilization—as we know it—could collapse. So use final for safety, but only when
    you''re certain that'
