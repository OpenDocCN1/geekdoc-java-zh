    # Autoboxing with ArrayLists


    In general, collections like ArrayList can hold objects but not primitives. Prior
    to Java 5, a common use for the so-called wrapper classes (e.g., Integer, Float,
    Boolean, and so) was a way to get primitives into and out of collections. Prior
    to Java 5, you had to “wrap” a primitive before you could put it into a collection.
    As of Java 5, primitives still had to be wrapped before they could be added to
    ArrayLists, but autoboxing takes care of it for you.


    ```

    myInts = new ArrayList(); // pre Java 5 declaration

    myInts.add(new Integer(42)); // Use Integer class to “wrap” an int

    ```


    In the previous example, we create an instance of class Integer with a value of
    42. We’ve created another object to “wrap around” a primitive value. As of Java
    5, we can say:


    ```

    myInts.add(42); // autoboxing handles it!

    ```


    In this last, we are still adding an Integer to myInts (not an int primitive);
    it’s just that autoboxing handles the wrapping for us. There are some sneaky implications
    when we need to use wrapper objects; let’s take a closer look...


    In the old, pre-Java 5 days, if you wanted to make a wrapper, unwrap it, use it,
    and then wrap it, you might do something like this:


    ```

    Integer y = new Integer(567); // make it

    int x = y.intValue(); // unwrap it

    X++; // use it

    y = new Integer(x); // re-wrap it

    System.out.println("y = " + y); // print it

    ```


    Now you can say:


    ```

    Integer y = new Integer(567); // make it

    Y++; // unwrap it, increment it,

    // re-wrap it

    System.out.println("y = " + y); // print it

    ```


    Both examples produce the following output:


    ```

    y = 568

    ```


    And yes, you read that. The code appears to be using the postincrement operator
    on an object'
