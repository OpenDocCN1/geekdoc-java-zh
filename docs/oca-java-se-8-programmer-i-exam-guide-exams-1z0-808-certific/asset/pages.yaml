  md: "# Short-Circuit Logical Operators\n\nFive logical operators on the exam are\
    \ used to evaluate statements that contain more than one boolean expression. The\
    \ most commonly used of the five are the two *short-circuit* logical operators:\n\
    \n+   - && Short-circuit AND\n- || Short-circuit OR\n\nThey are used to link little\
    \ boolean expressions together to form bigger boolean expressions. The && and\
    \ || operators evaluate only boolean values. For an AND (&&) expression to be\
    \ true, both operands must be true. For example:\n\n```\nif ((2 < 3)) && (3 <\
    \ 4)) {\n```\n\nThe preceding expression evaluates to true because *both* operand\
    \ one (2 < 3) and operand two (3 < 4) evaluate to true.\nThe short-circuit feature\
    \ of the && operator is so named because it doesn't waste time on pointless evaluations.\
    \ A short-circuit && evaluates the left side of the operation (operand one), and\
    \ if it resolves to false, the && operator doesn't bother looking at the right\
    \ side of the expression (operand two) since the && operator already knows the\
    \ complete expression can't possibly be true.\n\n```\nclass Logical {\n    public\
    \ static void main(String [] args) {\n        boolean b1 = false, b2 = false;\n\
    \        boolean b3 = (b1 == true) && (b2 = true); // will b2 be set to true?\n\
    \        System.out.println(b3 + \" \" + b2);\n    }\n}\n```\n\nWhen we run the\
    \ preceding code, the *assignment* b2 = true never runs because of the short-circuit\
    \ operator, the output is\n\n```\n%java Logical\nfalse false\n```\n\nThe || operator\
    \ is similar to the && operator, except that it evaluates to true if EITHER of\
    \ the operands is true. If the first operand in an OR operation is true, the result\
    \ will be true, so the short-circuit || doesn't waste time looking at the right\
    \ side of the equation. If the first operand is false, however, the short-circuit\
    \ || has to evaluate the second operand to see if the result of the OR operation\
    \ will be true or false. Pay close attention the following example; you'll see\
    \ quite a few questions like this on the exam:"
