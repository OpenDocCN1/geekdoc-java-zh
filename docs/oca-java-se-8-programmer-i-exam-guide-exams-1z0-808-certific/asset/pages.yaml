    \ they're not equal\n- t1's an Object\n\nWhere did equals method come from? The\
    \ reference variable t1 is of type Test, and there's no equals method in the Test\
    \ class. Or is there? The second if test asks whether t1 is an instance of class\
    \ object, and because it is (more or so that), the test succeeds.\n\nOn hold...\
    \ how can t1 be an instance of type Object, when we said it was of type Test?\
    \ I'm sure you're way ahead of us, but it turns out that every class in Java is\
    \ a subclass of class object (except, of course, object itself). In other words,\
    \ every class you'll ever use or write will inherit from class object. You'll\
    \ always have an equals method, a clone method, notify, wait, and others available\
    \ to use. Whenever you create a class, you automatically inherit all of class\
    \ object's methods.\n\nWhy? Let's look at equals method for instance. Java's creators\
    \ reasonably assumed that it would be very common for Java programmers to want\
    \ to compare instances of their classes to check for equality. If class object\
    \ didn't have an equals method, you'd have to write one yourself—you and every\
