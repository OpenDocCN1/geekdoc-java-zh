    Default and protected members differ only when subclasses are involved:


    +   Default members can be accessed only by classes in the same package.


    +   protected members can be accessed by other classes in the same package, plus
    subclasses, regardless of package.


    +   protected = package + kids (kids meaning subclasses).


    +   For subclasses outside the package, the protected member can be accessed only
    through inheritance; a subclass outside the package cannot access a protected
    member by using a reference to a super instance. (In other words, inheritance
    is the only mechanism for a subclass outside the package to access a protected
    member of its super.)


    +   A protected member inherited by a subclass from another package is not accessible
    to any other class in the subclass package, except for the subclass''s own subclasses.


    # Local Variables (OCA Objectives 2.1 and 6.4)


    +   Local (method, automatic, or stack) variable declarations cannot have access
    modifiers.


    +   final is the only modifier available to local variables.


    +   Local variables do not get default values, so they must be initialized before
    use.


    # Other Modifiers—Members (OCA Objectives 7.1 and 7.5)


    +   final methods cannot be overridden in a subclass.


    +   abstract methods are declared with a signature, a return type, and an optional
    throws clause, but they are not implemented.


    +   abstract methods end in a semicolon—no curly braces.


    +   Three ways to spot a nonabstract method:


    +   The method is not marked abstract.


    +   The method has curly braces.


    +   The method MIGHT have code between the curly braces.


    The first nonabstract (concrete) class to extend an abstract class must implement
    all of the abstract class''s methods.


    The synchronized modifier applies only to methods and code blocks.


    synchronized methods cannot be abstract abstract methods must be implemented by
    a subclass, so they must be inheritable. For that reason


    +   abstract methods cannot be private.'
