  md: '# CONTRIBUTORS


    # About the Authors


    Kathy Sierra was a lead developer for the SCJP exam for Java 5 and Java 6. Kathy
    worked as a Sun "master trainer"; and in 1997, founded JavaRanch.com (now named
    Coderanch.com), the world''s largest Java community website. Her bestselling books
    have won multiple Software Development Awards, and she is a founding member of
    Oracle''s Java Champions program.


    These days, Kathy is developing advanced training programs in a variety of domains
    (from horsanship to computer programming), but the thread that ties all her projects
    together is helping readers reduce cognitive load.


    Bates Baer was a lead developer for many of Sun''s Java certification exams, including
    the SCJP for 5 and Java 6. Bert was also one of the lead developers for Oracle''s
    OCA 7 and OCP 7 exams and a contributor on Oracle''s OCA 8 and OCP 8 exams. He
    is a forum moderator on Coderanch (JavaRanch.com) and has been the co-author of
    several bestselling Java books, and he is a founding member of Oracle''s Java
    Champions program. Now that the book is done, Bert plans to throw a few balls
    around and once again start riding his beautiful Icelandic horse, Eyrraros fra
    Gufudal-Frem.


    # About the Technical Review Team


    This is the fifth edition of the book that we''ve cooked up. The first version
    we worked on was for Java 2. Then we updated the book for the SCJP 5, again for
    the SCIP 6, again for the OCA 7 and OCP 7 exams, and now for the OCA 8. Every
    step of the way, we were unbelievably fortunate to have fantastic JavaRanch.com-centric
    technical review teams at our sides. Over the course of the last 14 years, we''ve
    been "evolving" the book more than rewriting it. Many sections from our original
    work on the Java 2 book are still intact. On the following pages, we''d like to
    acknowledge the members of the various technical review teams who have saved our
    book over the years.


    # About the Java 2 Technical Review Team


    Johannes Jong was the leader of our technical review teams forever and ever. (He
    has more patience than any three people we know.) For the Java 2 book, he led
    our biggest team ever. Our sinceres go out to the volunteers who were knowledgeable,
    diligent, patient, and picky, picky, picky!


    Rob Ross, Nicholas Cheung, Jane Grisciti, Ilja Preuss, Vincent Brabant, Kudret
    Serin, Bill Seipel, Jing Yi, Jinu George, Radiya, LuAnn Mazz, Anshu Mishri, Anandhi
    Navaneethakrishnan, Didier Varon, Mary McCartney, Harsha Pwani, Abhishek Mishra,
    and Susan Das.'
