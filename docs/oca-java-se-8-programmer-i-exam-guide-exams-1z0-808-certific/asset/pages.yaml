  md: 'Exceptions come in two flavors: checked and unchecked.


    +   - Checked exceptions include all subtypes of Exception, excluding classes
    that extend RuntimeException.


    +   - Checked exceptions are subject to the handle or declare rule; any method
    that might throw a checked exception (including methods that invoke methods that
    can throw a checked exception) must either declare the exception using throws
    or handle the exception with an appropriate try/catch.


    +   - Subtypes of Error or RuntimeException are unchecked, so the compiler doesn''t
    enforce the handle or declare rule. You are free to handle them or declare them,
    but the compiler doesn''t care one way or the other.


    +   - A finally block will always be invoked, regardless of whether an exception
    is thrown or caught in its try/catch.


    +   - Just because finally is invoked does not mean it will complete. Code in
    the finally block could itself raise an exception or use System.exit().


    +   - Uncaught exceptions propagate back through the call stack, starting from
    the method where the exception is thrown and ending with either the first method
    that has a corresponding catch for that type or a JVM shutdown (which happens
    if the exception gets to main() and main() is “ducking” the exception by declaring
    it).


    +   - You can almost always create your own exceptions by extending Exception
    or one of its checked exception subtypes. Such an exception will then be considered
    a checked exception by the compiler. (In other words, it''s rare to extend RuntimeException.)


    +   - All catch blocks must be ordered from most specific to general. If you have
    a catch clause for both IOException and Exception, you must put the catch for
    IOException first in your code. Otherwise, the IOException would be caught by
    catch(Exception e), because a catch argument can catch the specified exception
    or any of its subtypes!


    +   - Some exceptions are created by programmers and some by the JVM.


