    But then what''s the result? When you narrow a primitive, Java truncates the higher-order
    bits that won''t fit. In other words, it loses all the bits to the left of the
    bits you''re narrowing to.

    Let''s take a look at what happens in the preceding code. There, 128 is the bit
    pattern 10000000. It takes full 8 bits to represent 128. But because the literal
    128 is an int, we actually get 32 bits, with the 128 living in the rightmost (lower)
    8 bits. So a literal 128 is actually


    ```

    00000000000000000000000010000000

    ```


    Take word for it; there are 32 bits there.

    To narrow the 32 bits representing 128, Java simply lopps the leftmost (higher
    order) 24 bits. What remains is 10000000. But remember that a byte is signed,
    with the leftmost bit representing the sign (and not part of the variable). So
    we end up with a negative number (the 1 that was used to represent 128 now the
    negative sign bit). Remember, to find the value of a negative number using 2''s
    complement notation, you flip all the bits and then add 1. Flipping the 8 bits
    gives us 01111111, and adding 1 gives us 10000000, or back to 128! And when we
    apply the sign bit, we end up with -128.

    You must use an explicit cast to assign 128 to a byte, and the assignment leaves
    you with the value — 128. A cast is nothing more than your way of saying to the
    compiler, “Trust me. I’m a professional. I take full responsibility for anything
    weird that happens when those top bits are chopped off.”

