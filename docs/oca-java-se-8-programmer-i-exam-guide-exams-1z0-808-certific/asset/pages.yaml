    \ and then look for possible exceptions. Only after you've satisfied those two\
    \ you dig into the logic and flow of the code in the question.\n\n# The Enhanced\
    \ for for Loop (for Arrays)\n\nThe enhanced loop, new as of Java 5, is a specialized\
    \ loop that simplifies looping through an array or collection. In this chapter\
    \ we're going to focus on using the enhanced for loop through arrays. In Chapter\
