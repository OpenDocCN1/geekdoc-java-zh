  md: '# Tips on Studying for the Exam


    First and foremost, give yourself plenty of time to study. Java is a complex programming
    language, and you can''t expect to cram what you need to know into a single study
    session. It is a field best learned over time, by studying a subject and applying
    your knowledge. Build a study schedule and stick to it, be be reasonable the pressure
    you put on yourself, especially if you''re studying in addition to your regular
    duties at.


    One easy technique to use in studying for certification exams is the 15-minutes-per-day
    effort. Simply study for a minimum of 15 minutes every day. It is a small but
    significant commitment. If you have a day where you can''t focus, give up at 15
    minutes. If you have a day where it flows completely for you, study longer. As
    long as you have many of the “flow days,” your chances of succeeding are excellent.


    We strongly recommend you use flash cards when preparing for the programmer''s
    exams. A flash card is simply a 3 x 5 or 4 x 6 card with a question on the front
    and the answer on the back. Construct these cards as you go through a chapter,
    capturing any topic you think need more memorization or practice. You can drill
    yourself by reading the question, thinking through the answer, and then turning
    the card over if you''re correct. Or you can get another person to help you by
    holding the card with the question facing and then verifying your answer. Most
    of our students have found these to be tremendously helpful, especially because
    they''re so portable that you can take them anywhere. Best not to use them while
    driving, though except at red lights. We''ve taken ours everywhere—the director''s
    office, restaurants, theaters, you matter.


    Certification study groups are another excellent resource, and you won''t find
    a larger or more community than the Coderank.com Big Moose saloon forums. If you
    have a question from this book, or any other mock exam question you may have stumbled
    upon, posting a question in a certification forum you will get an answer in all
    cases within a day—usually, within a few hours.


    Finally, we recommend you write a lot of little Java programs! During the course
    of writing this book, we write hundreds of small programs, and if you listen to
    what the most successful candidates say (you know, those guys who got 98 percent),
    they almost always report that they write a lot of code.


    # Scheduling Your Exam


    You can purchase your exam voucher from either Oracle or Pearson VUE. Visit Oracle.com
    (follow the training/certification links) or visit PearsonVue.com for exam scheduling
    details and locations of centers.


    # Arriving at the Exam


    As with any test, you''ll be tempted to cram the night before. Resist that temptation.
    You should know the material by this point, and if you''re groggy in the morning,
    you won''t remember what you studied anyway. Get a good night''s sleep.


    Arrive early for your exam; it gives you time to relax and review key facts. Take
    the opportunity to review your notes. If you get burned out on studying, you can
    start start a few minutes early. We don''t recommend arriving late. Your test
    could be cancelled, or you might not have enough time to'
