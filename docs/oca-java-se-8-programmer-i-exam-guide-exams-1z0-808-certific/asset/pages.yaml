  md: 'A heap is a heap. For the exam, it''s important that you know that you can
    call the heap, you can call it the garbage collectible heap, but there is only
    one heap.


    So garbage collection revolves around making sure the heap has much free space
    as possible. For the purpose of the exam, what this boils down to is deleting
    objects that are no longer reachable by the Java program running. We''ll talk
    much more about what "reachable" means in a minute, let''s drill into this point.
    When the garbage collector runs, its purpose is to find and delete objects that
    cannot be reached. If you think of a Java program as being in a constant cycle
    of creating the objects it needs (which occupy space on the heap) and then discarding
    them when they''re no longer needed, creating new objects, discarding them, and
    so on, the missing piece of the puzzle is the garbage collector. When it runs,
    it looks for those discarded objects and deletes them from memory, so that the
    cycle of using memory and releasing it can continue. Also, the great cycle of
    life:


    # When Does the Garbage Collector Run?


    The garbage collector is under the control of the JVM: From within your Java program,
    you can ask the JVM to run the garbage collector; but there are no guarantees,
    under any circumstances, the JVM will comply. On its own devices, the JVM will
    typically run the garbage collector when it senses memory is running low. Experience
    indicates that when your Java program makes a request for garbage collection,
    the JVM will usually grant your request in short order, but there are no guarantees.
    Just when you think you can count on it, the JVM will decide to ignore your request.


    # How Does the Garbage Collector Work?


    You can''t be sure. You might hear that the garbage collector uses a mark and
    sweep algorithm, and for any Java implementation that might be true, but the Java
    specification doesn''t guarantee any particular implementation. You might hear
    that the garbage collector uses reference counting; once again, maybe yes, maybe
    no. The important concept for you to understand for the exam is: When an object
    become eligible for garbage collection?


    In a nutshell, every Java program has from one to many threads. Each thread has
    its own execution stack. Normally, you (the programmer) cause at least one thread
    to run in a Java program, with the main() method at the bottom of the stack. However,
    there are really cool reasons to launch additional threads from your initial thread
    (which you''ll get into if you prepare for the OCP 8 exam). In addition to having
    its own execution stack, each thread has its own lifecycle. For now, all you need
    to know is that threads can be alive or dead.


    With this background, we can now see with stunning clarity and resolve that an
    object is eligible for garbage collection when no live thread can access it. (Note:
    Due to the variances of the String pool, the exam focuses its garbage collection
    questions on non-string objects, and our garbage collection discussions apply
    only to non-string objects too.)


    Based on that definition, the garbage collector performs some magical, unknown
    operations; and when it discovers an object that can''t be reached by any live
    thread, it will consider object as eligible for deletion, and might even delete
    it at some point. (You guessed it: it might never delete it.) When we talk about
    an object, we''re actually talking about a reachable variable that refers to the
    object in question. If our Java program has a reference that refers to that object
    and reference variable is available to a live thread, then that object is considered
    reachable. We''ll talk more about how objects can become unreachable in the following
    section.'
