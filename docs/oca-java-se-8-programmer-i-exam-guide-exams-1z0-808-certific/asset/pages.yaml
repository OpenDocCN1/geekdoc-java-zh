    : System.out.print(\"green \");\n            case \"blue\": System.out.print(\"\
    blue \");\n            default: System.out.println(\"ndone\");\n        }\n  \
    \  }\n}\n```\n```\n\nIn this example case \"green\": matched, so the JVM executed\
