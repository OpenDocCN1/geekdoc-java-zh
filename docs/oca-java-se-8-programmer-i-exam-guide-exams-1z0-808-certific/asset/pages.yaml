    the SCJP 6 exam. On the other hand, the OCP 7 exam introduced a vast array of
    brand-new topics. We enlisted several talented Java gurus to help us cover some
    of the new topics on the OCP 7 exam. Thanks and kudos to **Tom McG** for his fantastic
    work in creating the massive JDBC chapter. Several reviewers told us that Tom
    did an amazing job channeling the informal tone throughout the book. Next, to
    **Jeanne Boyskars**, Jeanne was truly a renaissance woman on this project. She
    contributed to several OCP chapters; she wrote some questions for the master exams;
    she performed some project management activities; and as if that wasn''t enough,
    she was one of our most energetic technical reviewers. Jeanne, we can''t thank
    you enough Thanks to **Matt Heimer** for his excellent work on the Concurrent
    chapter. A tough topic nicely handled! Finally, **Roel De Nij** and **Roberto
    Perillo** made some contributions to the *book* and helped out on the technical
    review team—thanks, guys!


