  md: 'Next we discussed the concept of scope, or “How long will this variable live?”
    Remember the four basic scopes in order of lessening life span: static, instance,
    local, and block.


    We covered the implications of using uninitialized variables and the importance
    of the fact that local variables MUST be assigned a value. We talked about some
    of the tricky aspects of assigning one reference to another and some of the finer
    points of passing variables into methods, including a discussion of “shadowing.”


    Finally, we dove into garbage collection, Java’s automatic memory management feature.
    We learned that in the heap is where objects live and where the cool garbage collection
    activity takes place. We learned that in the end, the JVM will perform garbage
    collection whenever it wants to. You (the programmer) can request a garbage collection
    run, but you can’t force it. We gathered only applying to objects that are eligible,
    and that eligible means “inaccessible from any live thread.” Finally, we discussed
    the rarely useful finalize() method and what you’ll have to know about it for
    the exam. All in all, this was one fascinating chapter.


    # TWO-MINUTE DRILL


    Here are some of the key points from this chapter.


    # Stack and Heap


    +   - Local variables (method variables) live on the stack.

    - Objects and their instance variables live on the heap.


    # Literals and Primitive Casting (OCA Objective 2.1)


    +   - Integer literals can be binary, decimal, octal (such as 013), or hexadecimal
    (such as 0x3d).

    - Literals for longs end in L or l. (For the sake of readability, we recommend
    “L”).

    - Float literals end in F or f, and double literals end in a d or D.

    - The boolean literals are true and false.

    - Literals for chars are a single character inside single quotes: ‘d’.


    # Scope (OCA Objective 1.1)


    +   - Scope refers to the lifetime of a variable.

    - There are four basic scopes:

    - Static variables live basically as long as their class lives.

    - Instance variables live as long as their object lives.

    - Local variables live as long as their method is on the stack; however, if their
    method invokes another method, they are temporarily unavailable.

    - Block variables (for example, in a for or an if) live until the block completes.'
