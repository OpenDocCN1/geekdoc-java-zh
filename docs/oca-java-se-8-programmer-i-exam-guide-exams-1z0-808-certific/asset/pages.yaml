  md: 'super(). Instance members are accessible only after the super constructor runs.


    +   - Abstract classes have constructors that are called when a concrete subclass
    is instantiated.


    +   - Interfaces do not have constructors.


    +   - If your superclass does not have a no-arg constructor, you must create a
    constructor and insert a call to super() with arguments matching those of the
    superclass constructor.


    +   - Constructors are not inherited; thus they cannot be overridden.


    +   - A constructor can be directly invoked only by another constructor (using
    a call to super() or this()).


    +   - Regarding issues with calls to this():


    +   - They may appear only as the first statement in a constructor.


    +   - The argument list determines which overloaded constructor is called.


    +   - Constructors can call constructors, and so on, but sooner or later one of
    them better call super() or the stack will explode.


    +   - Calls to this() and super() cannot be in the same constructor. You can have
    one or the other, but never both.


    # Initialization Blocks (OCA Objective 1.2 and 6.3-ish)


    +   - We static init blocks—static { /* code here */ }—for code you want to run
    once, when the class is first loaded. Multiple blocks run from the top down.


    +   - We normal init blocks—{ /* code here }—for code you want to run for every
    new instance, right after all the super constructors have run. Again, multiple
    blocks run from the top of the class down.


    # Statics (OCA Objective 6.2)


    +   - We static methods to implement behaviors that are not affected by the state
    of any instances.


    +   - We static variables to hold data that is class specific as opposed to instance
    specific—there will be only one of a static variable.


    +   - All members belong to the class, not to any instance.


    +   - A static method cannot access an instance variable directly.


    +   - Use the dot operator to access static members, but remember that using a
    reference variable with the dot operator is really a syntax trick, and the compiler
    will substitute the class name for the reference variable; for instance:


    ```

    d.doStuff();

    ```


    becomes


    Dog.doStuff();'
