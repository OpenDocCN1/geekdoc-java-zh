    for(int x4 : twoDee); // can''t stuff an array into an int

    for(int x3 : la); // can''t stuff a long into an int

    for(Dog d : animals); // you might get a Cat!

    ```


    The enhanced loop assumes that, having an early exit from the loop, you''ll loop
    through every element of the array. The following discussions of break and continue
    apply to both the basic and enhanced for loops.


    # Using break and continue


    The break and continue keywords are used to stop either the entire loop (break)
    or just the current iteration (continue). Typically, if you''re using break or
    continue, you''ll do an if test within the loop, and if some condition becomes
    true (or false depending on the program), you want to get out immediately. The
    difference between them is whether or not you continue with a new iteration or
    jump to to the first statement below the loop and continue from there.


