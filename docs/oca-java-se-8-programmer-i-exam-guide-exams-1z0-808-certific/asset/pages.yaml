    \ have a no-arg constructor unless you typed it in yourself!\n\n+   - Every constructor\
    \ has, as its first statement, either a call to an overloaded constructor ((this))\
    \ or a call to the superclass constructor (super()), although remember that this\
    \ can be inserted by the compiler.\n\n+   - If you type in a constructor (as opposed\
    \ to relying on the compiler-generated default constructor), and you do not type\
    \ in the call to super () or a call to this(), the compiler will insert a no-arg\
    \ call to super () for you as the very first statement in the constructor.\n\n\
    +   - A call to super () can be a no-arg call or can include arguments passed\
    \ to the super constructor.\n\n+   - A no-arg constructor is not necessarily the\
    \ default (that is, compiler-supplied) constructor, although the default constructor\
    \ is always a no-arg constructor. The default constructor is the one the compiler\
    \ provides! Although the default constructor is always a no-arg constructor, you're\
    \ free to put in your own no-arg constructor.\n\n+   - Only static variables and\
    \ methods can be accessed as part of the call to super () or this(). (Example:\
    \ super(Animal.NAME) is OK, because NAME is declared as a static variable.\n\n\
    +   - Abstract classes have constructors, and those constructors are always called\
    \ when a concrete subclass is instantiated.\n\n+   - Interfaces do not have constructors.\
    \ Interfaces are not part of an object's inheritance tree.\n\n+   - The only way\
    \ a constructor can be invoked is from within another constructor. In other words,\
    \ you can't write code that actually calls a constructor as follows:\n\n```\n\
    class Horse {\n    Horse() {} // constructor\n    void doStuff() {\n        Horse();\
    \ // calling the constructor - illegal!\n    }\n}\n```"
