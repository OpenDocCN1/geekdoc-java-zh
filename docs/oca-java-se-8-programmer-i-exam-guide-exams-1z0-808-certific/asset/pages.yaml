    \ is invoked, the objects created in the method are eligible for garbage collection.\
    \ There is an obvious exception, however. If an object is returned from the method,\
    \ its reference might be assigned to a reference variable in the method it called;\
    \ hence, it will not be eligible for collection. Examine the following code:\n\
