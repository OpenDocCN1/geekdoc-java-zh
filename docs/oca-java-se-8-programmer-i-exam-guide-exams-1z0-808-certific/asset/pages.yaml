    # Assignment Operators


    We covered most of the functionality of the (=) assignment operator in Chapter
    3. To summarize:


    +   - When assigning a value to a primitive, size matters. Be sure you know when
    implicit casting will occur, when explicit casting is necessary, and when truncation
    might occur.


    +   - Remember a reference variable isn''t an object; it''s a way to get to an
    object. (We know all you C++ programmers are just dying for us to say, "it''s
    a pointer," but we''re not going to.)


    +   - When assigning a value to a reference variable, type matters. Remember the
    rules for supertypes, subtypes, and arrays.


    Next we''ll cover a few more details about the assignment operators that are on
    the exam, and when we get to the next chapter, we''ll take a look at how the assignment
    operator = works with Strings (which are immutable).


    ![](img/0746bd23bbf07125e1cb15b26c3bffa0_231_0.png)


    Don''t spend time preparing for topics that are no longer on the exam! The following
    topics have NOT been on the exam since Java 1.4:


    +   - Bit-shifting operators

    - Bitwise operators

    - Two''s complement

    - Divide-by-zero staff


    It''s not that these aren''t important topics; it''s just that they''re not on
    the exam anymore, and we''re really focused on the exam. (Note: The reason we
    bring this up at all is because you might encounter mock exam exam questions on
    these topics—you can ignore those questions!)


    # Compound Assignment Operators


    There are actually 11 or so compound assignment operators, but only the 4 most
    commonly used (+=, -=, *=, /=) are on the exam. The compound assignment operators
    let lazy typists shave a few keystrokes off their workload.


    Here are several example assignments, first without using a compound operator:


    ```

    y = y - 6;

    x = x + 2 * 5;

    ```


    Now, with compound operators:


    ```

    y -= 6;

    ```'
