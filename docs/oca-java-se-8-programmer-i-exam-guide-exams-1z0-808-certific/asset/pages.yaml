    a temporary, intermediate String (soon to be lost), with the value abcdef. The
    toUpperCase() method was called on this string, which created a new (soon to be
    lost) String with the value ABCDEF. The replace() method was then called on this
    second String object, which created a final String with the value ABXDEF and referred
    y to it.


