    \ all subtypes of IOException, but then we would have to test the exception to\
    \ determine whether it is a FileNotFound. Instead, we coded a special handler\
    \ for the FileNotFound and a separate exception handler for all other IOException\
    \ subtypes.\n\nIf this code generates a FileNotFound, it will be handled by the\
    \ catch clause that begins at line 10. If it generates another IOException—perhaps\
    \ EOFException, which is a subclass of IOException—it will be handled by the catch\
    \ clause that begins at line 15. If some other exception is generated, as a runtime\
    \ exception of some type, neither catch clause will be executed and the exception\
    \ will be propagated down the stack.\n\nNotice that the catch clause for the FileNotFound\
    \ was placed above the handler for the IOException. This is very important! If\
    \ we do the opposite way, the program will not compile. The handlers for the most\
    \ specific exceptions must always be placed above those for more general exceptions.\
    \ The following will not compile:\n\n```\ntry {\n  // do risky things\n catch\
    \ (IOException e) {\n    // handle general IOExceptions\n    catch (FileNotFoundException\
    \ ex) {\n      // handle just FileNotFound\n    }\n}\n```\n\nYou'll get a compiler\
    \ error something like:\nTestEx.java:15: exception java.io.FileNotFoundException\
