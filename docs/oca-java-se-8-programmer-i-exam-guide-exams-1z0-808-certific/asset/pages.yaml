  md: "# Methods with Variable Argument Lists (var-args)\n\nJava allows you to create\
    \ methods that take a variable number of arguments. Depending on what you need,\
    \ you might have this capability referred to as “variable-length argument lists,”\
    \ “variable arguments,”var-args,” “varargs,” or our personal favorite (from department\
    \ of obfuscation), “variable arity parameters.” They’re all the same, and we’ll\
    \ use the term “var-args” from here on.\n\nAs a bit of background, we’d like to\
    \ clarify how we’re going to use the terms “argument” and “parameter” throughout\
    \ this book:\n\n+   The things you specify in the parentheses when you are *invoking*\
    \ a method:\n\n```\ndoStuff(\"a\", 2); // invoking doStuff, so \"a\" & 2 are\n\
    \      // arguments\n```\n\n+   The things in the method’s *signature* that indicate\
    \ what the method must receive when it’s invoked:\n\n```\nvoid doStuff(String\
    \ s, int a) { // we're expecting two\n                          // parameters:\n\
    \                          // String and int }\n```\n\nLet’s review the declaration\
    \ rules for var-args:\n\n+   **var-arg type** When you declare a var-arg parameter,\
    \ you must specify the type of the argument(s) this parameter of your method can\
    \ receive. (This can be a primitive type or an object type.)\n\n+   **Basic syntax**\
    \ To declare a method using a var-arg parameter, you follow the type with an ellipsis\
    \ (...), a space, and then the name of the array that will hold the parameters\
    \ received.\n\n+   **Other parameters** It’s legal to have other parameters in\
    \ a method that uses a var-arg.\n\n+   **var-arg limits** The var-arg must be\
    \ the last parameter in the method’s signature, and you can have only one var-arg\
    \ in a method.\n\n+   Let’s look at some legal and illegal var-arg declarations:\n\
    \n# Legal:\n\n```\nvoid doStuff(int... x) { // expects from 0 to many ints\n \
    \                         // as parameters\nvoid doStuff2(char c, int... x) {\
    \ // expects first a char,\n                              // then 0 to many ints\n\
    void doStuff3(Animal... animal) { // 0 to many Animals\n```\n\n# Illegal:\n\n\
    ```\nvoid doStuff4(int... x...) { // bad syntax\nvoid doStuff5(int... x, char...\
    \ y) { // too many var-args\nvoid doStuff6(String... s, byte b) { // var-arg must\
    \ be last\n```"
