    +   A legal nonabstract implementing class has the following properties:


    +   It provides concrete implementations for the interface''s methods.


    +   It must follow all override rules for the methods it implements.


    +   It must not declare any new checked exceptions for an implementation.


    +   It must not declare any checked exceptions that are broader than the exceptions
    declared in the interface method.


    +   It may declare runtime exceptions on any interface method implementation regardless
    of the interface declaration.


    +   It must maintain the exact signature (allowing for covariant returns) and
    return type of the methods it implements (but does not to declare the exceptions
    of the interface).


    +   A class implementing an interface can itself be abstract.


    +   An abstract implementing class does not have to implement the interface methods
    (but the first concrete subclass must).


    +   A class can extend only one class (no multiple inheritance), but it can implement
    many interfaces.


