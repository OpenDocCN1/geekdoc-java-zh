    # CERTIFICATION OBJECTIVE


    # Garbage Collection (OCA) Objective 2.4


    2.4 Explain an object''s lifecycle (creation, "dereference* by reassignment,"
    and garbage collection)


    The phrase garbage collection seems to come and go from the exam objectives. As
    of the OCA 8 exam, it''s back, and we''re happy. Garbage collection is a well-known
    idea and a universal phrase in computer science.


    # Overview of Memory Management and Garbage Collection


    This is the section you''ve been waiting for! It''s finally time to dig into the
    wonderful world of memory management and garbage collection. Memory management
    is a crucial element in many types of applications. Consider a program that reads
    large amounts of data, from somewhere else on a network, and then writes data
    into a database on a hard drive. A typical design would be to read the data into
    some sort of collection in memory, perform some operations on the data, and then
    write data into the database. After the data is written into the database, the
    collection that stored data temporarily must be emptied of old data or reaped
    before processing the next batch. This operation might be performed thousands
    of times, and in languages like C or C++ that do not offer automatic garbage collection,
    a small flaw in the logic that manually empties or deletes the collection data
    structures can allow small amounts of memory to be improperly reclaimed or lost.
    These small losses are called memory leaks, and over thousands of iterations they
    can make enough memory inaccessible that programs will eventually crash. Creating
    code that performs manual memory management cleanly and thoroughly is a nontrivial
    and complex task, while it is arguable that manual memory management can double
    the development effort for a complex program. Java''s garbage collector provides
    an automatic solution to memory management. In most cases it frees you from having
    to add any memory management logic to your application. The downside to automatic
    collection is that you can''t completely control when it runs and when it doesn''t.


    # Overview of Java''s Garbage Collector


    Let''s look at what we mean when we talk about garbage collection in the land
    of Java. From the 30,000-foot level, garbage collection is the phrase used to
    describe automatic memory management in Java. Whenever a software program executes
    (in Java, C, C++, Lisp, Ruby, and so on), it uses memory in several different
    ways. We''re not going to get into Computer Science 101 here, but it''s typical
