    # Literal Values for All Primitive Types


    A primitive literal is merely a source code representation of the primitive data
    types—in other words, an integer, floating-point number, boolean, or character
    that you type in while writing code. The following are examples of primitive literals:


    ```

    ''b''               // char literal

    42              // int literal

    false           // boolean literal

    2546789.343     // double literal

    ```


    # Integer Literals


    There are four ways to represent integer numbers in the Java language: decimal
    (base 10), octal (base 8), hexadecimal (base 16), and as Java 7, binary (base
    2). Most exam questions with integer literals use decimal representations, but
    the use of octal, hexadecimal, or binary are worth studying. Even though the odds
    that you''ll actually use octal in the real world are astronomically tiny, they
    were included for fun. Before we look at the four ways to represent integer numbers,
    let''s discuss a new feature added to Java 7: literals with underscores.


    # Numeric Literals with Underscores


    As of Java 7, numeric literals can be declared using underscore characters (_),
    ostensibly to improve readability. Let''s compare a pre-Java 7 declaration to
    an easier-to-read Java 7 declaration:


    ```

    int pre7 = 10000000;    // Java 7 - we hope it''s a million

    int with7 = 1_000_000;     // much clearer!

    ```


    The main rule is to keep track of that you CANNOT use the underscore literal at
    the beginning or end of a literal. The potential catch here is that you''re free
    to use the underscore in "weird" places:


    ```

    int i11 = _1_000_000;   // illegal, can''t begin with an "_

    int i12 = 10_000_000;   // legal, but confusing

    ```'
