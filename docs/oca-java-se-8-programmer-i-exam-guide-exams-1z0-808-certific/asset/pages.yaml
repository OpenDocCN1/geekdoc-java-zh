    # FIGURE 2-7 Overloaded constructors on the call stack


    Take a look at the call stack, and then let''s walk through the code straight
    from the top.


    +   * Line 2 Declare a String instance variable name.

    * Lines 3–5 Constructor that takes a String and assigns it to instance variable
    name.

    * Line 7 Here''s where it gets fun. Assume every animal needs a name, but the
