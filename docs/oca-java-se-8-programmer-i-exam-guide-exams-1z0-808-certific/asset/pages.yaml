    \n# # Catching an Exception using try catch\n\nBefore we begin, let's introduce\
    \ some terminology. The term exception means \"exceptional condition\" and is\
    \ an occurrence that alters the normal program flow. A bunch of things can lead\
    \ to exceptions, including hardware failures, resource exhaustion, and good bugs.\
    \ When an exceptional event occurs in Java, an exception is said to be \"thrown\"\
    . The code that's responsible for doing something about the exception is called\
    \ an \"exception handler,\" and it \"catches\" the thrown exception.\n\nException\
    \ handling works by transferring the execution of the program to an appropriate\
    \ exception handler when an exception occurs. For example, if you call a method\
    \ that opens a file the file cannot be opened execution of that method will stop\
    \ and the code you wrote to deal with this situation will be run. Therefore, we\
    \ need a way to tell the JVM what to execute when a certain exception happens.\
    \ To do this, we use the try and catch keywords. This is used to define a block\
    \ of code in which exceptions may occur. This block of code is called a \"guarded\
    \ region\" (which means \"risky code goes here\\). One or more catch clauses matches\
    \ a specific exception (or group of exceptions—one later) to a block of code that\
    \ handles it. Here's how it looks in pseudocode\n\n+   1. try {\n2. // This is\
    \ the first line of the \"guarded region\"\n3. // is governed by the try keyword.\n\
    4. // Put code that might cause some kind of exception.\n5. // We may have many\
    \ code lines here or just one.\n6. }\n7. catch(MyFirstException) {\n8. // Put\
    \ code here handles this exception.\n9. // This is the next line of the exception\
    \ handler.\n10. // This is the last line of the exception handler.\n11. }\n12.\
    \ catch(MySecondException) {\n13. // Put code here that handles this exception\n\
    14. }\n15. \n16. // Some other unguarded (normal, non-risky) code region begins\
    \ here\n\nIn this pseudocode example, lines 2 through 5 constitute the guarded\
    \ region that is governed by the try clause. Line 7 is an exception handler for\
    \ an exception of type MyFirstException. Line 12 is an exception handler for an\
    \ exception of type MySecondException. Notice that the catch blocks immediately\
    \ follow the try block. This is a requirement; if you have one or more catch blocks,\
    \ they must immediately follow the try block. Additionally, the catch blocks must\
    \ all follow each other, without any other statements or blocks in between. Also,\
    \ the order in which the catch blocks appear matters, as we'll see later.\n\n\
    Execution of the guarded region starts at line 2. If the program executes the\
    \ whole past line 5 with no exceptions being thrown, execution will transfer to\
    \ line 15 and continue downward. However, if at any time in lines 2 through 5\
    \ (the try block) an exception of type MyFirstException is thrown, execution will\
    \ immediately transfer to line 7. Lines 8 through 10 will be executed so that\
    \ the entire"
