    \ values; a boolean can only be true or false. If someone asks you for the bit\
    \ depth of boolean, look them in the eye and say, “That’s virtual-machine dependent.\"\
    \n\nThe char type (character) contains a single, 16-bit Unicode character. Although\
    \ extended ASCII known as ISO Latin-1 needs only 8 bits (256 different characters),\
