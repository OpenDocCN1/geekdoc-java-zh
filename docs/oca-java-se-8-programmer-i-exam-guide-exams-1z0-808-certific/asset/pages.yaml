    \ of Zoo?\n        Zoo z = new Zoo();\n        System.out.println(\"Zoo says,\
    \ \" + z.coolMethod());\n        // coolMethod() is public, so Moo can invoke\
    \ it on a Zoo\n        // reference\n    }\n}\n```\n\nFigure 1-2 compares a class\
    \ inheriting a member of another class and accessing a member of another class\
    \ using a reference of an instance of that class."
