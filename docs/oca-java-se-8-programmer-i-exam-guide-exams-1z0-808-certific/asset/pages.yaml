  md: 'The most important point to remember is that a literal (such as 7) is always
    an implicit int. No deal if you''re assigning a value to an int or a long variable,
    but what if you''re assigning to a byte variable? After all, a bytesized holder
    can''t hold as many bits as an int-sized holder. Here''s where it gets weird.
    The following is legal,


    ```

    byte b = 27;

    ```


    but only because the compiler automatically narrows the literal value to a byte.
    In other words, the compiler puts in the cost. The preceding code is identical
    to the following:


    ```

    byte b = (byte) 27; // Explicitly cast the int literal to a byte

    ```


    It looks as the compiler gives you a break and you take a shortcut with assignments
    to integer variables smaller than an int. (Everything we''re saying about byte
    applies to char and short, both of which are smaller than an int.) We''re not
    actually at the weird part yet, but by the way.


    We know that a literal is always an int, but more importantly, the result of an
    expression involving any int-sized or smaller is an int. In other words, add two
    bytes together and you''ll get an int—even if those two bytes are tiny. Multiply
    an int and a short and you''ll get an int. Divide a byte by a byte and you''ll
    get... an int. Now okay we''re at the weird part. Check this out:


    ```

    byte a = 3; // No problem, 3 fits in a byte

    byte b = 8; // No problem, 8 fits in a byte

    byte c = a + b; // Should be no problem, sum of the two bytes

    // fits in a byte

    ```


