  md: "Resist the temptation to write a single catch exception handler such as the\
    \ following:\n\n```\ntry {\n    // some code\n} catch (Exception e) {\n    e.printStackTrace();\n\
    }\n```\n\nThis code will catch every exception generated. Of course, no single\
    \ exception handler can properly handle every exception, and programming in this\
    \ way defeats the design objective. Exception handlers will trap many errors at\
    \ once probably reduce the reliability of your program, and because it's likely\
    \ that an exception will be caught by the handler does not know how to handle.\n\
    \n# Exception Matching\n\nIf you have an exception hierarchy composed of a superclass\
    \ exception and a number of subtypes, and you're interested in handling one of\
    \ the subtypes in a special way but want to handle all the rest together, you\
    \ need only two catch clauses.\n\nWhen an exception is thrown, Java will try to\
    \ find (by looking at the available catch clauses from the top down) a catch clause\
    \ for the exception type. If it doesn't find one, it will search for a handler\
    \ for a supertype of the exception. If it does not find a catch clause that matches\
    \ a supertype for the exception, the exception is propagated down the call stack.\
    \ This process is called \"exception matching\". Let's look at an example.\n\n\
    ```\n1: import java.io.*;\n2: public class ReadData {\n3: public static void main(String[]\
    \ args) {\n4: try {\n5: RandomAccessFile raf =\n6: new RandomAccessFile(\"file.txt\"\
    , \"r\");\n7: byte b[] = new byte[1000];\n8: raf.readFully(b, 0, 1000);\n9: }\n\
    10: catch (FileNotFoundException e) {\n11: System.err.println(\"File not found\"\
    );\n12: System.err.println(e.getMessage());\n13: e.printStackTrace();\n14: }\n\
    15: catch (IOException e) {\n16: System.err.println(\"IO Error\");\n17: System.err.println(e.toString());\n\
    18: e.printStackTrace();\n19: }\n20: }\n21: }\n```\n\nThis short program attempts\
    \ to open a file and read some data from it. Opening and reading files can generate\
    \ many exceptions, most of which are some type of IOException. Imagine that in\
    \ this program"
