  md: "```\npublic static void main(String[] args) {\n    String s = new String(\"\
    foo\");\n    if (s instanceof String) {\n        System.out.print(\"s is a String\"\
    );\n    }\n}\n```\n\nprints this:\n\ns is a String\n\nEven if the object being\
