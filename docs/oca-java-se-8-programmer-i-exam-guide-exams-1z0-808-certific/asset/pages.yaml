  md: '# # Taking the Programmer’s Exam


    In a perfect world, you would be assessed for your true knowledge of a subject,
    not simply how you respond to a series of test questions. But life isn''t perfect,
    and it just isn''t practical to evaluate everyone''s knowledge on a one-to-one
    basis.


    For most of your certifications, Oracle evaluates candidates using a computer-based
    testing service operated by Pearson VUE. To discourage simple memorization, Oracle
    exams presents a potentially different set of questions to different candidates.
    In the development of the exam, hundreds of questions are compiled and refined
    using beta testers. For this large collection, questions are pulled from each
    objective and assembled into many different versions of the exam.


    Each Oracle exam has a specific number of questions, and the test''s duration
    is designed to be generous. The time remaining is always displayed in the corner
    of the testing screen. If time expires during an exam, the test terminates, and
    incomplete answers are counted as incorrect.


    ![](img/0746bd23bbf07125e1cb15b26c3bffa0_23_0.png)


    > > Many experienced test-takers do not go back and change answers unless they
    have a good reason to do so. Only change an answer when you feel you may have
    misread or misinterpreted the first time. Nervousness may make you second-guess
    every answer and tell yourself out of a correct one.


    After completing the exam, you will receive an e-mail from Oracle telling you
    that your results are available on the Web. As of winter 2017, your results can
    be found at certview.oracle.com. If you want a printed copy of your certificate,
    you must make a specific request.


    # # Question Format


    Oracle''s Java exams pose questions in multiple-choice format.


    # # Multiple-Choice Questions


    In earlier versions of thePeriodic, when you encountered a multiple-choice question,
    you were not told how many answers were correct; but with each version of the
    exam, the questions have become more difficult, today, each multiple-choice tells
    you how many to choose. The Self Test at the end of each chapter closely match
    the format, wording, and difficulty of the real exam questions, with two exceptions:


    +   - Whenever we can, our questions will not tell you how many correct answers
    exist (unless we say "Choose all that apply"). We do this to help you master the
    material. Some verify-takers can eliminate wrong answers when the number of correct
    is known. It''s also possible, if you know how many answers are correct, to choose
    the most plausible answers. Our job is to toughen you up for the real!

    - The real exam typically numbers lines of code in a question. Sometimes we do
    not number'
