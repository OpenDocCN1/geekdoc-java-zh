    # ArrayLists and Duplicates


    As you''re planning your trip to Europe, you realize that halfway through your
    stay in Rome, there''s going to be a fantastic music festival in Naples! Naples
    is just down the coast from Rome! You''ve got to add that side trip to your itinerary.
    The question is, can an ArrayList have duplicate entries? Is it legal to say this:


    ```

    c.add("Rome");

    c.add("Naples");

    c.add("Rome");

    ```


    The short answer is: Yes, ArrayLists can have duplicates. If you stop and think
    about it, the notion of "duplicate Java objects" is actually a bit tricky. Relax,
    because you won''t have to get into that trickiness until you study for the OCP
    8.


