  md: '# Class Access


    What does it mean to access a class? When we say code from one class(A) has access
    to another class (class B), it means class A can do one of three things:


    +   - Create an instance of class B.

    - Extend class B (in other words, become a subclass of class B).

    - Access certain methods and variables within class B, depending on the access
    control of those methods and variables.


    In effect, access means visibility. If class A can''t see class B, the access
    level of the methods and variables within class B won''t matter; class A won''t
    have any way to access those methods and variables.


    # Default Access


    A class with default access has no modifier preceding it in the declaration! It''s
    the access control you get when you don''t type a modifier in the class declaration.
    Think of default access as package-level access, because a class with default
    access can be seen only by classes within the same package. For example, if class
    A and class B are in different packages, and class A has default access, class
    B won''t be able to create an instance of class A or even declare a variable or
    return type of class A. In fact class B has to pretend that class A doesn''t even
    exist or the compiler will complain. Look at the following source file:


    ```

    package cert;

    class Beverage { }

    ```


    Now look at the second source file:


    ```

    package exam.stuff;

    import cert.Beverage;

    class Tea extends Beverage { }

    ```


    As you see, the superclass (Beverage) is in a different package from the subclass
    (Tea). The import statement at the top of the Tea file is trying (fingers crossed)
    to import the Beverage class. The Beverage file compiles, but when we try to compile
    the Tea file, we get something like this:


    > Can''t access cert.Beverage. Class or interface must be public, in same package,
    or an accessible member class.

    import cert.Beverage;


    (Note: For various reasons, the error messages we show throughout this book might
    not match the error messages you get. Don''t worry, the real point is to understand
    when you''re apt to get an error of some sort.)


    Tea won''t compile because its superclass, Beverage, has default access and is
    in a different package. You can do two things to make this work. You could put
    both classes in the same package, or you declare Beverage as public, as the next
    section describes.


    When you see a question with complex logic, be sure to look at the access modifiers
    first. That way, if you spot an access violation (for example, a class in package
    A trying to access a default class in package B), you''ll know the code won''t
    compile so you don''t have to bother working through the logic. It''s not as if
    you don have nothing better to do with your time while taking the exam. Just choose
    the "Compilation fails" answer and zoom on the next question.'
