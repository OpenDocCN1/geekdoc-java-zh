    # Equality for Reference Variables


    As you saw earlier, two reference variables can refer to the same object, as the
    following code snippet demonstrates:


    ```

    JButton a = new JButton("Exit");

    JButton b = a;

    ```


    ![](img/0746bd23bbf07125e1cb15b26c3bffa0_234_0.png)


    Don''t mistake for == == in a boolean expression. The following is legal:


    +   11. boolean b = false;

    12. if (b = true) { System.out.println("b is true");

    13. } else { System.out.println("b is false"); };


    Look carefully! You might be tempted to think the output b is false, but look
    at the boolean test in line 12. The boolean variable is not being compared to
    true; it''s set to true. Once b is set to true, the println executes and we get
    b true. The result of an assignment expression is the value of the variable following
    the assignment. This substitution of = for == works only with boolean variables
    because the if test can be done only on boolean expressions. This does not compile:


    +   7. int x = 1;

    8. if (x = 0) { }


    Because x is an integer (and not a boolean), the result of (x = 0) is 0 (the result
    of the assignment). Primitive ints cannot be used where a boolean value is expected,
    so the code in line 8 won''t work unless it''s changed from an assignment (=)
    to an equality test (==) as:


    ```

    8. if (x == 0) { }

    ```


    After running this code, both variable a and variable b will refer to the same
    object (a JButton with the label Exit). Reference variables can be tested to see
    if they refer to the same object by the == operator. Remember, the == operator
    is looking at the bits in the variable, for reference variables, this means that
    if the bits in both reference variables are identical, then both refer to the
    same object. Look at the following code:'
