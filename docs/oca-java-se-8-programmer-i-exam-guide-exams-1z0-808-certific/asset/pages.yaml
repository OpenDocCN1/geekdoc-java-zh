  md: '# Apply access modifiers.


    We''ve looked at what it means to use a modifier in a class declaration, and now
    we''ll look at what it means to modify a method or variable declaration.

    Methods and instance (nonlocal) variables are collectively known as members. You
    can modify a member with both access and nonaccess modifiers, and you have more
    modifiers to choose from (and combine) than when you''re declaring a class.


    # Access Modifiers


    Because method and variable members are usually given access control in exactly
    the same way, we''ll cover both in this section.

    Whereas a class can use just two of the four access control levels (default or
    public), members can use all:


    +   - public

    - protected

    - default

    - private


    What does it mean for code in one class to access to a member of another class?
    For now, any differences between methods and variables. If class A has access
    to a member of class B, it means that class B''s member is visible to class A.
    When a class does not have access to another member, the compiler will slip you
    for trying to access something that you''re not supposed to know exists!

    You need to understand two different access issues:


    +   - Whether method code in one class can access a member of another class

    - Whether a subclass can inherit a member of its superclass


    The first type of access occurs when a method in one class tries to access a method
    or a variable of another class, using the dot operator (.) to invoke a method
    or retrieve a variable. For example:'
