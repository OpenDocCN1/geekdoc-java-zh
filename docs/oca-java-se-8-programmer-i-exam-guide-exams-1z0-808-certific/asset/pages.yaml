  md: '# TWO-MINUTE DRILL


    Here are some of the key points from the certification objectives in this chapter.


    # Using String and StringBuilder (OCA Objectives 9.2 and 9.1)


    +   - String objects are immutable, and String reference variables are not.

    - If you create a new String without assigning, it will be lost to your program.

    - If you redirect a String reference to a new String, the old String can be lost.

    - String methods use zero-based indexes, except for the second argument of substring().

    - The String class is final—it cannot be extended.

    - When the JVM finds a String literal, it is added to the String literal pool.

    - Strings have a method called length()—arrays have an attribute named length.

    - StringBuilder objects are mutable—they can change without creating a new object.

    - StringBuilder methods act on the object, and objects change without an explicit
    assignment in the statement.

    - Remember that chained methods are evaluated from left to right.

    - String methods to remember: charAt(), concat(), equals(), length(), replace(),
    substring(), toLowerCase(), toString(), toUpperCase(), and trim().

    - StringBuilder methods to remember: append(), delete(), insert(), reverse(),
    and toString().


    # Manipulating Calendar Data (OCA Objective 9.3)


    +   - On the exam all the objects created using the calendar classes are immutable,
    but their reference variables are not.

    - If you create a new calendar object without assigning, it will be lost to your
    program.

    - If you redirect a calendar reference to a new calendar object, the old calendar
    object can be lost.

    - All of the objects created using the exam''s calendar classes must be created
    using factory methods (e.g., from(), now(), of(), parse()); the keyword new is
    not allowed.

    - The until() and between() methods perform complex calculations that determine
    the amount of time between two calendar objects.

    - The DateTimeFormatter class uses the parse() method to parse input Strings into
    valid calendar objects.

    - The DateTimeFormatter class uses the format() method to format calendar objects
    into beautifully formed Strings.'
