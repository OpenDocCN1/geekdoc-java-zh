    (as inherited by the subclass) becomes private to any code outside the subclass,
    with the exception of subclasses of the subclass. If class Neighbor instantiates
    a Child object, then even if class Neighbor is in the same package as Child, class
    Neighbor won''t have access to the Child''s inherited (but protected) variable
    x. Figure 1-4 illustrates the effect of protected access on classes and subclasses
    in the same or different packages.


