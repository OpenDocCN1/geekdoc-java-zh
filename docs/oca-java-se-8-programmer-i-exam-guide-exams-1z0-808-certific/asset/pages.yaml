  md: "```\nclass Foo {\n    Foo() {}\n    Foo(String s) {}\n}\n```\n\nThe preceding\
    \ Foo class has two overloaded constructors: one that takes a string, and one\
    \ with no arguments. Because there's actually identical to the default constructor\
    \ the compiler supplies—but remember, since there's already a constructor in this\
    \ class (the one that takes a string), the compiler won't supply a default constructor.\
    \ If you want a no-arg constructor to overload the with-args version you already\
    \ have, you're going to type it yourself, just as in the Foo example.\n\nOverloading\
    \ a constructor is typically used to provide alternate ways for clients to instantiate\
    \ objects of your class. For example, if a client knows the animal name, they\
    \ can pass to an Animal constructor that takes a string. But if they don't know\
    \ the name, the client can call the no-arg constructor, and that constructor can\
    \ supply a default name. Here's what it looks like:\n\n```\npublic class Animal\
    \ {\n    String name;\n    Animal(String name) {\n        this.name = name;\n\
    \    }\n    Animal() {\n        this(makeRandomName());\n    }\n    static String\
    \ makeRandomName() {\n        int x = (int) (Math.random() * 5);\n        String\
    \ name = new String[] {\"Fluffy\", \"Fido\", \"Rover\", \"Spike\", \"Gigi\"}[x];\n\
    \        return name;\n    }\n    public static void main(String [] args) {\n\
    \        Animal a = new Animal();\n        System.out.println(a.name);\n     \
    \   Animal b = new Animal(\"Zeus\");\n        System.out.println(b.name);\n  \
    \  }\n}\n```\n\nRunning the code four times produces this output:\n\n```\n% java\
    \ Animal\nGigi\nZeus\n```"
