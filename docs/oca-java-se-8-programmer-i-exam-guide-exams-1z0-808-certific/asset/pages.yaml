  md: "# Don't be fooled by a method that's overloaded but not overridden by a subclass.\
    \ It's perfectly legal to do the following:\n\n```\npublic class Foo {\n    void\
    \ doStuff() { }\n}\n\nclass Bar extends Foo {\n    void doStuff(String s) { }\n\
    }\n```\n\nThe Bar class has two doStuff() methods: the no-arg version it inherits\
    \ from Foo (and does not override) and the overloaded doStuff(String s) defined\
    \ in the Bar class. Code with a reference to a Foo can invoke only the no-arg\
    \ version, but code with a reference to a Bar can invoke either of the overloaded\
    \ versions.\n\nTable 2-4 summarizes the difference between overloaded and overridden\
    \ methods.\n\n# TABLE 2-4 Differences Between Overloaded and Overridden Methods\n\
    \n| | Overloaded Method | Overridden Method |\n|---|---||\n| Argument(s) | Must\
    \ change. | Must not change. |\n| Return type | Can change. | Can't change except\
    \ for covariant returns.(Covered later this chapter). |\n| Exceptions | Can change.\
    \ | Can reduce or eliminate. Must not throw new or broader checked exceptions.\
    \ |\n| Access | Can change. | Must not make more restrictive (can be less restrictive).\
    \ |\n| Inocation | Reference type determines which overloaded version (based on\
    \ declared argument types) is selected. Happens at compile time. The actual method's\
    \ invoked is still a virtual method invocation that happens at runtime, the compiler\
    \ will already know the signature of the method to be invoked. So at runtime,\
    \ the argument match will already have been nailed down, just not the class in\
    \ which the method lives. | Object (in other words, the type of the actual instance\
    \ on the heap) determines which method is selected. Happens at runtime. |\n\n\
    We'll cover constructor overloading later in the chapter, where we'll also cover\
    \ the other constructor-related topics that are on the exam. Figure 2-4 illustrates\
    \ the way overloaded and overridden methods appear in class relationships."
