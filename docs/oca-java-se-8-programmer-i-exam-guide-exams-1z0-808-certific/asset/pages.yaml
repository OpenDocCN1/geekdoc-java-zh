    its reference variable is assigned to the new LocalDate object created by the
    first plusDays() invocation. The reference variables are swapped a bit, which
    accounts for the dates not printing in chronological order.


    +   A, C, D, F, and G are incorrect based on the above. (OCA Objectives 2.4 and
