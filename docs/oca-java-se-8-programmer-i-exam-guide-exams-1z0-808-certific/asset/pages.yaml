    # CERTIFICATION SUMMARY


    If you''ve studied this chapter diligently, you should have a firm grasp on Java
    operators, and you should understand what equality means when tested with the
    == operator. Let''s review the highlights of what you''ve learned in this chapter.


    The logical operators (&&, ||, &, ^) can be only used to evaluate two boolean
    expressions. The difference between && and is that the && operator not bothering
    the right operand if the left evaluates to false, because of the result of &&
    expression can never be true. The difference between || and is that the || operator
    not bothering the right operand if the left evaluates to true because the result
    is already known to be true at that point.


    The == operator can be used to compare values of primitives, but it can also be
    used to determine whether two references refer to the same object.


    The instanceof operator is used to determine whether the object referred to by
    a reference variable passes the IS-A for a test.


    The + operator is overloaded to perform String concatenation tasks and also concatenate
    strings and primitives, but be careful—concatenation can be tricky.


    The conditional operator (a.k.a. the "ternary operator") has an unusual, three-operand
    syntax—don''t mistake it for a complex assignment statement.


    The ++ and -- operators will be used throughout the exam, and you must pay attention
    to whether they are prefixed or postfixed to the variable being updated.


    Even though you use parentheses in real life, for the exam you should memorize
    Table 4-2 so determine how code that does not use parentheses for complex expressions
    will be evaluated, based on Java''s operator-precedence hierarchy.


    Prepared for a list of questions involving the topics from this chapter. Even
    within questions testing your knowledge of another objective, the code will frequently
    use operators, assignments, object and primitive passing, and so on.'
