  md: "```\nvoid myFunction() throws MyException1, MyException2 {\n  // code for the\
    \ method\n}\n```\n\nThis method has a void return type, accepts no arguments,\
    \ and declares that it can throw one of two types of exceptions: either MyException1\
    \ or MyException2. (Just because the method declares that it throws an exception\
    \ doesn't mean it will. It just tells the world that it.)\n\nSuppose your method\
    \ doesn't directly throw an exception but calls a method that does. You can choose\
    \ not to handle the exception yourself and instead just declare it, as though\
    \ it were your method that actually throws the exception. If you declare the exception\
    \ that your method might get from another method and you don't provide a try/catch\
    \ for it, then the method will propagate back to the method that called your method\
    \ and will either be caught or continue to be handled by a method further down\
    \ the stack.\n\nAny method that might throw an exception (unless it is a subclass\
    \ of RuntimeException) must declare the exception. That includes methods that\
    \ aren't actually throwing it\n\nRemember this:\n\n+   - Each method must handle\
    \ all handled checked exceptions by supplying a catch clause or list each unhandled\
    \ checked exception as a thrown exception.\n\nThis rule is referred to as Java’s\
    \ “handle or declare” requirement (sometimes called “catch or declare”).\n\n![](img/0746bd23bbf07125e1cb15b26c3bffa0_296_0.png)\n\
    \nLook for code that invokes a method declaring an exception, where the calling\
