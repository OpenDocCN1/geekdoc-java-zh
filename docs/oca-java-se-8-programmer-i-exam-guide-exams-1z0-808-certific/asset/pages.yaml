    # The order in which methods complete


    FIGURE 5-1 The Java method call stack


    Now let''s examine what happens to ducked exceptions. Imagine a building, say,
    five stories high, and at each floor is a deck or balcony. Imagine that on each
    deck, one person is holding a baseball mitt. Exceptions are like balls dropped
    from person to person, starting from the roof. An exception is first thrown from
    the top of the stack (in other words, the person on the roof); and if it isn''t
    caught by the same person who threw it (the person on the roof), it drops the
    call stack to the previous method, which is the person standing on the deck one
    floor down. If not caught by the previous method the exception again drops down
    to the previous method (person on the next floor down), and so on, until it is
    caught or reaches the very bottom of the call stack. This is called "exception
    propagation."


    If an exception reaches the bottom of the call stack, it''s like reaching the
    bottom of a very long drop; the ball explodes, and so does your program. An exception
    that''s never caught will cause your application to stop running. A description
    (if one is available) of the exception will be displayed, and the call stack will
    be "dumped." This helps you debug your application by telling you what exception
    was thrown, from what method it was thrown, and what the stack looked like at
    the time.'
