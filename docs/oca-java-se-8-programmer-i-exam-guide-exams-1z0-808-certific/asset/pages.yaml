  md: '![](img/0746bd23bbf07125e1cb15b26c3bffa0_292_0.png)


    FIGURE 5-2 Exception class hierarchy


    As you can see, there are two subclasses that derive from Throwable: Exception
    and Error. Classes that derive from Error represent unusual situations that are
    not caused by program errors and indicate things that would not normally happen
    during program execution, such as the JVM running out of memory. Generally, your
    application won''t be able to recover from an Error, so you''re not required to
    handle them. If your code does not handle them (and it usually won''t), it will
    still compile with no trouble. Although often thought of as exceptional conditions,
    Errors are technically not exceptions because they do not derive from class Exception.


    In general, an exception represents something that happens not as a result of
    a programming error, but rather because some resource is not available or some
    other condition required for correct execution is not present. For example, if
    your application is supposed to communicate with another application or computer
    is not answering, this is an exception that is not caused by a bug. Figure 5-2
    also shows a subtype of Exception called RuntimeException. These exceptions are
    a special case because they sometimes indicate program errors. They can also represent,
    difficult-to-handle exceptional conditions. Exceptions are discussed in greater
    detail later in this chapter.'
