    # Stack and Heap—Quick Review


    For most people, understanding the basics of the stack and the heap makes it far
    easier to understand topics like argument passing, polymorphism, threads, exceptions,
    and garbage collection. In this section, we''ll stick to an overview, but we''ll
    expand these topics several more times throughout the book.


    For the most part, the various pieces (methods, variables, and objects) of Java
    programs live in one of two places in memory: the stack or the heap. For now,
    we''re concerned about only three types of things—instance variables, local variables,
    and objects:


    +   - Instance variables and objects live on the heap.

    - Local variables live on the stack.


