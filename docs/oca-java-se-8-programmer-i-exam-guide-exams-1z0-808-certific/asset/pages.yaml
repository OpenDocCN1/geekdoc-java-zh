    # # Class Declarations and Modifiers


    The class declarations we discuss are limited to top-level classes. In addition
    to top-level classes, Java provides for another category of class known as nested
    classes or inner classes. Inner classes are included on the OCP exam, but not
    the OCA exam. When you become an OCP candidate, you''re going to learn out about
    inner classes. No, really. Seriously.

    The following code is a bare-bones class declaration:


    ```

    class MyClass { }

    ```


    This code compiles just fine, but you can also add modifiers before the class
    declaration. In general, modifiers fall into two categories:


    +   - Access modifiers (public, protected, private)

    - Nonaccess modifiers (including strictf, final, and abstract)


    We''ll look at access modifiers first, so you''ll learn how to restrict or allow
    access to a class you create. Access control in Java is a little tricky because
    there are four access controls (levels of access) but only three access modifiers.
    The fourth access level (default or package access) is what you get when you don''t
    use any of the three access modifiers. In other words, every class, method, and
    instance variable declare an access control, whether you explicitly type one or
    not. Although all access controls (which means all three modifiers) work for most
    method and variable declarations, a class can be declared with only public or
    default access; the other two access levels don''t make sense for a class, as
    you''ll see.


    ![](img/0746bd23bbf07125e1cb15b26c3bffa0_43_0.png)


    Java is a package-centric language; the developers assumed that for good organization
    and name scoping, you would put all your classes into packages. They were right,
    and you should. Imagine this nightmare: Three programmers, in the same company
    working on different parts of a project, write a class named utilities. If those
    utilities classes have not been declared in an explicit package and are in the
    classpath, you won''t have any way to compile the compiler or JVM of which you''re
    referring to. Oracle recommends that developers reverse domain names, appended
    with version/project names. For example, if your domain name is geeksanonymous.com
    and you are working on the client code for the TwelvePointSteps program, you would
    name your package something like com.geeksanonymous.steps.client. That would essentially
    change the name of your class to com.geeksanonymous.steps.utilities. You might
    still have name collisions within your company if you don''t come up with your
    own naming schemes, (assuming they''re guaranteed not to collide with classes
    developed outside your company (assuming they Oracle''s naming convention, and
    if they don''t, well, Really Bad Things could happen).'
