    \ example, program control will enter the loop body because x is equal to 2. However,\
    \ x is incremented in the loop, so when the condition is checked again it will\
    \ evaluate to false and exit the loop.\n\nAny variables used in the expression\
    \ of a while loop must be declared before the expression is evaluated. In other\
