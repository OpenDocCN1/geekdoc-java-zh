    got a Phaser!


    Finally, we send our thanks to Christophe Verre—if we can find him. It appears
    that Christophe performs his JavaRanch moderation duties from various locations
    around the globe, including France, Wales, and most recently Tokyo. On more than
    one occasion Christophe protected us from our lack of organization. Thanks for
    your patience, Christophe! It''s important to know that these guys all donated
    their reviewer honorariums to JavaRanch! The JavaRanch community is in your debt.


