- img_proc: true
  md: 'When you arrive at the testing center, you''ll need to provide current, valid
    photo identification. Visit PearsonVue.com for the ID requirements. They just
    want to be sure that you don''t send your binary java guru-neighbor who you''ve
    paid to take the exam for.


    Aside from a brain full of facts, you don''t need to bring anything else to the
    exam room. In fact, your brain is all you''re allowed to take into the exam! All
    the tests are closed book, meaning you don''t get to bring any reference materials
    with you. You''re not allowed to take any notes out of the room. The test administrator
    will provide you with a small marker board. If you''re allowed to, we recommend
    that you bring a water bottle or a juice bottle (call ahead for details of what''s
    allowed). These exams are long and, your brain functions much better when it''s
    well hydrated. In terms of hydration, the ideal approach is to take frequent,
    small sips. You should also verify how many "bio-breaks" you''ll be allowed to
    take during the exam! Leave your phone in the car. It will only add stress to
    the situation, since they are not allowed in the exam room, and sometimes still
    be heard if they ring outside the room. Purses, books, and other materials must
    be left with the administrator before entering the exam.


    Once in the testing room, you''ll be briefed on the exam software. You might be
    asked to complete a survey. The time you spend on the survey is not deducted from
    your actual test time—nor do you get more time if you fill out the survey. Also,
    remember the questions you get on the exam will not change depending on how you
    answer the survey questions. Once you''re done with the survey, the real clock
    starts ticking and the fun begins.


    The testing software allows you to move forward and backward between questions.
    Most important, there is a Mark check box on the screen—this will prove to be
    a critical tool, as explained in the next section.


    # Test-Taking Techniques


    Without a plan of attack, candidates can become overwhelmed by the exam or become
    sidetracked and run out of time. For the most part, if you are comfortable with
    the material, the allotted time is more than enough to complete the exam. The
    trick is to keep the time from slipping away during any particular problem.


    Your obvious goal is to answer the questions correctly and quickly, but other
    factors can distract you. Here are some tips for taking the exam more efficiently.


    # Size Up the Challenge


    First, take a quick pass through all the questions in the exam. "Cherry-pick"
    the easy questions, answering them on the spot. Briefly read each question, noticing
    the type of question and the subject. As a guideline, try to spend less than 25
    percent of your testing time in this pass.


    This step lets you assess the score and complexity of the exam, and it helps you
    determine how to pace your time. It also gives you an idea of where to find potential
    answers to some of the questions. Sometimes the wording of one question might
    lend clues or jog your thoughts for another question.


    If you''re not entirely confident in your answer to a question, answer it anyway,
    but check the Mark box to flag it for later review. If you run out of time, at
    least you''ve provided a "first guess" answer, rather than leaving it blank.'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'Second, go through the entire test, using the insight gained from the first
    go-through. For example, if the entire test looks difficult, you''ll know better
    than to spend a minute or two on each question. Creating a pacing with small milestones—for
    example, "I need to answer 10 questions every 15 minutes."


    At this stage, it''s probably a good idea to skip the time-consuming questions,
    marking them for the next pass. To finish this phase before you''re 50 to 60 percent
    through the testing time.


    Third, go back through all the questions for review, using the Review Marked button
    in the question review screen. This step includes taking a second look at all
    the questions you were unsure of in previous passes, as well as tackling the time-consuming
    ones you deferred until now. Chisel away at groups of questions until you''ve
    answered all.


    If you''re more comfortable with a previously marked question, unmark the Review
    Marked button now. Otherwise, leave it marked. Work your way through the time-consuming
    questions now, especially those requiring manual calculations. Unmark them when
    you''re satisfied with the answer.


    By the end of this stage, you''ve answered every question in the test, despite
    having reservations about some of your answers. If you run out of time in the
    next step, at least you won''t lose points for lack of an answer. In the grace
    phase if you still have 10 to 20 percent of your time remaining.


    # Review Your Answers


    Now you''re cruising! You''ve answered all the questions, and you''re ready to
    do a quality check. Take another pass (one one more) through the entire test,
    briefly re-reading each question and your answer. Carefully look over the questions
    again to check for "trick" questions. Be wary of those that include a choice of
    "Does not complete.\ Be alert for last-minute clues. You''re pretty familiar with
    nearly every question at this point, and you may find a few clues that you missed
    before.


    # The Grand Finale


    When you''re confident with all your answers, finish the exam by submitting it
    for grading. After you finish your exam, you''ll receive an e-mail from Oracle
    giving you a link to a page where your exam results will be available. As of this
    writing, you must ask for a hard copy certificate specifically or one will not
    be sent to you.


    # Retesting


    If you don''t pass the exam, don''t be discouraged. Try to have a good attitude
    about the experience, and get ready to try again. Consider yourself a little more
    educated. You''ll know the format of the test a little better, and you''ll have
    a good idea of the difficulty level of the questions you''ll get next time around.


    If you bounce back quickly, you''ll probably remember several of the questions
    you might have missed. This will help you focus your study efforts in the right
    area.


    Ultimately, remember that Oracle certifications are valuable because they''re
    hard to get. After all, if anyone could get one, what value would it have? In
    the end, it takes a good attitude and a lot of studying, but you can do!


    # Objectives Map'
