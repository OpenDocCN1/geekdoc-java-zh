    Instance variables (also called member variables) are defined at the class level.
    That means the variable declaration is not made within a method, constructor,
    or any other initializer. Instance variables are initialized to a default value
    each time a new instance is created, although they may be given an explicit value
    after the object''s superconstructors have completed. Table 3-1 lists the default
    values for primitive and object types.


