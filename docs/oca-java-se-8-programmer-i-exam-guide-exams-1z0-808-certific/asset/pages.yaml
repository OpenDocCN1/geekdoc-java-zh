  md: "# Does Java Use Pass-By-Value Semantics?\n\nIf Java passes objects by passing\
    \ the reference instead, does that mean Java uses pass-by-reference for objects?\
    \ Not exactly, although you'll often hear that Java is actually pass-by-value\
    \ for all variables running within a single VM. Pass-by-variable means pass-by-value.\
    \ And that means pass-by-copy-of-variable! (There's that word copy again!)\n\n\
    It makes no difference if you're passing primitive or reference variables; you\
    \ are always passing a copy of the bits in the variable. For example, for a primitive\
    \ variable, if you pass an int variable with the value of 3, you're passing a\
    \ copy of the bits representing 3. The called method then gets its own copy of\
    \ the value to do with what it likes.\n\nAnd if you're passing an object reference\
    \ variable, you're passing a copy of the bits representing the reference to an\
    \ object. The called method gets its own copy of the reference variable to do\
    \ with what it likes. But because two identical reference variables refer to the\
    \ exact same object, if the called method modifies the object (by invoking setter\
    \ methods, for example), the caller will see that the caller's original reference\
    \ variable has also been changed. In the next section, we'll look at how the picture\
    \ changes when we're talking about primitives.\n\nThe bottom line on pass-by-value:\
    \ The called method can't change the caller's variable, although for object reference\
    \ variables, the called method can change the object referred to. What's the difference\
    \ between changing the variable and changing the object? For object references,\
    \ it means the called method can't reassign the caller's original reference variable\
    \ and make it refer to a different object or null. For example, in the following\
    \ code fragment\n\n```\nvoid bar() {\nFoo f = new Foo();\ndoStuff(f);\n}\nvoid\
    \ doStuff(Foo g) {\n  g.setName(\"Boo\");\n  g = new Foo();\n}\n```\n\nreassigning\
    \ g does not affect f! At the end of the bar() method, two Foo objects have been\
    \ created: one by the local variable f and one by the local (argument) variable\
    \ g. Because the doStuff() method has a copy of the reference variable, it has\
    \ a way to get to the original Foo object, for instance to call the setName()\
    \ method. But the doStuff() method does not have a way to get to the f reference\
    \ variable. So doStuff() can't change values within the object f refers to, but\
    \ doStuff() can't change the actual contents of f (bit pattern). In other words,\
    \ doStuff() can change the state of the object that f refers to, but it can't\
    \ make f refer to a different object!\n\n# Passing Primitive Variables\n\nLet's\
    \ look at what happens when a primitive variable is passed to a method:"
