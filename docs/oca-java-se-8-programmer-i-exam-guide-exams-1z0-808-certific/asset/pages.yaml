  md: "# Writing Code That Explicitly Makes Objects Eligible for Collection\n\nIn\
    \ the preceding section, you learned the theories behind Java garbage collection.\
    \ In this section, we show how to make objects eligible for garbage collection\
    \ using actual code. We also discuss how to attempt to force garbage collection\
    \ if it is necessary and how you can perform additional cleanup on objects that\
    \ are removed from memory.\n\n# Nulling a Reference\n\nAs discussed earlier, an\
    \ object becomes eligible for garbage collection when there are no more reachable\
    \ references to it. Obviously, if there are no reachable references, it doesn't\
    \ matter what happens to the object. For our purposes it is floating in space,\
    \ unused, inaccessible, and no longer needed.\n\nThe first way to remove a reference\
    \ to an object is to set the reference variable that refers to the object to null.\
    \ Examine the following code:\n\n```\n1. public class GarbageTruck\n2.     public\
    \ static void main(String [] args) {\n3.         StringBuilder sb = new StringBuilder(\"\
    hello\");\n4.         System.out.println(sb);\n5.     // The StringBuilder object\
    \ is not eligible for collection\n6.         sb = null;\n7.         // Now the\
    \ StringBuilder object is eligible for collection\n8.     }\n9. }\n```\n\nThe\
    \ StringBuilder with the value hello is assigned to the reference variable sb\
    \ in the third line. To make the object eligible (for garbage collection), we\
    \ set the reference variable sb to null, which removes the single reference that\
    \ existed to the StringBuilder object. Once line 6 has run, our happy little StringBuilder\
    \ object is doomed, eligible for garbage collection.\n\n# Reassigning a Reference\
    \ Variable\n\nWe can also decouple a reference variable from an object by setting\
    \ the reference variable to refer to another object. Examine the following code:\n\
    \n```\nclass GarbageTruck {\n    public static void main(String [] args) {\n \
    \       StringBuilder s1 = new StringBuilder(\"hello\");\n        StringBuilder\
    \ s2 = new StringBuilder(\"goodbye\");\n        System.out.println(s1);\n    \
    \    // At this point the StringBuilder \"hello\" is not eligible\n        s1\
    \ = s2; // Redirects s1 to refer to the \"goodbye\" object\n        // Now the\
    \ StringBuilder \"hello\" is eligible for collection\n    }\n```"
