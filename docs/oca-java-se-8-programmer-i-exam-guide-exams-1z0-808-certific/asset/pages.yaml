  md: "# Arrays\n\nJust like any other object reference, array references declared\
    \ within a method must be assigned a value before use. That means you must declare\
    \ and, however, need to explicitly initialize the elements of an array. We've\
    \ said it before, but it's important to repeat: Array elements get their default\
    \ values (0, false, null, '\\u0000', and so on) regardless of whether the array\
    \ is declared as an instance or local. The array itself, however, will not be\
    \ initialized if it's declared locally. In other words, you must explicitly initialize\
    \ an array reference if it's declared and used within a method, but at the moment\
    \ you construct an array object, all of its elements are assigned their default\
    \ values.\n\n# Assigning One Reference Variable to Another\n\nWith primitive variables,\
    \ an assignment of one variable to another means the contents (bit pattern) of\
    \ one variable are copied into another. Object reference variables work exactly\
    \ the same way. The contents of a reference variable are a bit pattern, so if\
    \ you assign reference variable a1 to reference variable b1, the pattern in a1\
    \ is copied and the new copy is placed into b1. (Some people have created a game\
    \ counting how many times they use copy...this concept is big!) If you assign\
    \ an instance of object to a new reference variable, then two reference variables\
    \ will hold the same bit pattern—a bit pattern referring to a specific object\
    \ on the heap. Look at the following code:\n\n```\nimport java.awt.Dimension;\n\
    class ReferenceTest {\n    public static void main (String [] args) {\n      \
    \  Dimension a1 = new Dimension(5,10);\n        System.out.println(\"a1.height\
    \ = \" + a1.height);\n        Dimension b1 = a1;\n        b1.height = 30;\n  \
    \      System.out.println(\"a1.height = \" + a1.height + \" after change to b1\"\
    );\n    }\n}\n```\n\nIn the preceding example, a Dimension object a1 is declared\
    \ and initialized with a width of 5 and a height of 10. Next, Dimension b1 is\
    \ declared and assigned the value of a1. At this point, both variables (a1 and\
    \ b1) hold identical values because the contents of a1 were copied into b1. There\
    \ is still only one object—the one that a1 and b1 refer to. Finally, the height\
    \ property is changed using the b1 reference. Now think for a minute: is this\
    \ going to change the height property of a1 as well? Let's see what the output\
    \ will\n\n```\n%java ReferenceTest\na1.height = 10\na1.height = 30 after change\
    \ to b1\n```\n\nFrom this output, we can conclude that both variables refer to\
    \ the same instance of the Dimension object. When we made to b1, the height property\
    \ was also changed for a1.\n\nOne exception to the way object references are assigned\
    \ is String. In Java, string objects are given special treatment. For one thing,\
    \ String objects are immutable; you can't change the value of a String object\
    \ (lots more on this concept in Chapter 6). But it sure looks like you can. Examine\
    \ the"
