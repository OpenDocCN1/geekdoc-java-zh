    \ other languages, even if you're somewhat new to Java, these won't be a problem\
    \ to learn.\n\n# Using While Loops\n\nThe while loop is good when you don't know\
    \ how many times a block or statement should repeat but you want to continue looping\
    \ as long as condition is true. A while statement looks like this:\n\n```\nwhile\
    \ (expression) {\n  // do stuff\n}\n```\n\nOr this:\n\n```\nint x = 2;\nwhile(x\
    \ == 2) {\n  System.out.println(x);\n  ++x;\n}\n```\n\nIn this case, as in all\
    \ loops, the expression (test) must evaluate to a boolean result. The body of\
    \ the while loop will execute only if the expression (sometimes called the \"\
    condition\") results in a value of true. Once inside the loop, the body will repeat\
