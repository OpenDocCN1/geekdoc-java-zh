    # Logical Operators (not Short-Circuit)


    There are two non-short-circuit logical operators:


    +   - Non-short-circuit AND

    - Non-short-circuit OR


    These operators are used in logical expressions just like the && and || operators
    are used, but because they aren''t the short-circuit operators, they evaluate
    both sides of the expression—always! They''re inefficient. For example, if the
    first operand (left side) in an expression is false, the second operand will be
    evaluated—even though it''s impossible for the result to be true! And the | is
    as inefficient: if the first operand is true, the Java Virtual Machine (JVM) still
    pulls ahead and evaluates the second operand when it knows the expression will
    true regardless.

    You''ll find a lot of questions on the exam that use both the short-circuit and
    non-short-circuit logical operators. You''ll have to know exactly which operands
    are evaluated and which are not, because the result will vary depending on whether
    the second operand in the expression is evaluated.


    ```

    int z = 5;

    if(++z > 5 || ++z > 6) z++; // z = 7 after this code

    ```


    versus this:


    ```

    int z = 5;

    if(++z > 5 | ++z > 6) z++; // z = 8 after this code

    ```


    # Logical Operators ^ and !


    The last two logical operators on the exam


    +   - Exclusive-OR (XOR)

    - Boolean invert


    The ^ (exclusive-OR) operator evaluates only boolean values. The ^ operator is
    related to the non-short-circuit operators we just reviewed, in that it always
    evaluates both the left and right operands in an expression. For an exclusive-OR
    (^) expression to be true, EXACTLY one operand must be true. For example,


    ```

    System.out.println("xor " + ((2 < 3) ^ (4 > 3)));

    ```


