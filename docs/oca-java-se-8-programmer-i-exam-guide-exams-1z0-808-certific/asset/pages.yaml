  md: "# Static Variables and Methods\n\nThe static modifier has a profound impact\
    \ on the behavior of a method or variable that we're treating it as a concept\
    \ entirely separate from the other modifiers. To understand how a static works,\
    \ we will first look at a reason for using one. Imagine you've got a utility class\
    \ or interface with a method that always runs the same way; its sole function\
    \ is to return, a random number. It wouldn't matter which instance of the class\
    \ performed the method—it would behave exactly the same way. In other words, the\
    \ method's behavior has no dependency on the state (instance variable values)\
    \ of an object. Why so, then, do you need an object that will never be instance-specific?\
    \ Why not ask the type itself to run the method?\n\nLet's imagine another scenario:\
    \ Suppose you want to keep a running count of all instances instantiated from\
    \ a particular class. Where do you actually keep that variable? It won't work\
    \ to keep it as an instance variable within the class whose instances you're tracking,\
    \ because the count will just be initialized back to a default value with each\
    \ new instance. Answer to both the utility-method-always-runs-the-same and the\
    \ keep-a-running-total-of-instances scenario is to use the static modifier. Variables\
    \ and methods marked static belong to the type, rather than any particular instance.\
    \ For class, you can use a static method or variable without having any instances\
    \ of that class. You only need the type available to be able to invoke without\
    \ having an instance of a class. But access a static variable. Static variables,\
    \ too, can be accessed without an instance of a class. But if there are instances,\
    \ a static variable of a class will be shared by all instances of that class;\
    \ there is only one copy.\n\nThe following code declares uses static counter variable:\n\
    \n```\nclass Frog {\n    static int frogCount = 0;      // Declare and initialize\n\
    \                              // static variable\n\n    public Frog() {\n   \
    \     frogCount += 1;               // Modify the value in the constructor\n \
    \   }\n\n    public static void main (String [] args) {\n        new Frog();\n\
    \        new Frog();\n        new Frog();\n        System.out.println(\"Frog count\
    \ is now \" + frogCount);\n    }\n}\n```\n\nIn the preceding code, the static\
    \ frogCount variable is set to zero when the Frog class is loaded by the JVM,\
    \ before any Frog instances are created! (By the way, you don't actually need\
    \ to initialize a static variable to zero; static variables get the default values\
    \ instance variables get.) Whenever a Frog instance is created, the constructor\
    \ runs and increments the static frogCount variable. When this code executes,\
    \ three Frog instances are created in main(),), and the result is\n\nFrog count\
    \ is now 3\n\nNow imagine what would happen if frogCount were an instance variable\
    \ (in other words, nonstatic):"
