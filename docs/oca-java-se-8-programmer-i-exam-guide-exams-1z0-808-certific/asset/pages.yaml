    \ much more detail in Chapter 6, when we look at the equals() method (as opposed\
    \ to the equals operator we're looking here).\n\n# Equality for Strings and java.lang.Object.equals()\n\
    \nWe used == to determine whether two reference variables refer to the same object.\
    \ Because objects are central to Java, every class in Java inherits a method from\
    \ class Object to test if two objects of the class are \"equal.\" Surprisingly,\
    \ this method is called equals(). In this case of the equals() method, the phrase\
    \ \"meaningfully equivalent\" should be used instead of the word \"equal.\" The\
    \ equals() method is used to determine if two objects of the same class are \"\
    meaningfully equivalent.\" For classes that you create, you have the option of\
    \ overriding the equals() method that your class inherited from class Object and\
    \ creating your own definition of \"meaningfully equivalent\" for instances of\
    \ your class.\n\nIn terms of understanding the equals() method for the OCA exam,\
    \ you need to understand two aspects of the equals() method:\n\n+   - equals()\
    \ means in class Object\n\"- equals() means in class String\"\n\n**The equals()\
    \ Method in Class Object** The equals() method in class Object works the same\
    \ way the == operator works. If two references point to the same object, the equals()\
    \ will return true. If two references point to different objects, even if they\
    \ have the same values, the method will return false.\n\n**The equals() Method\
    \ in Class String** The equals() method in class String has been overridden. When\
    \ the equals() method is used to compare strings, it will return true if the strings\
    \ have the same value, and it will return false if the strings have different\
    \ values. For String's equals() method, values ARE case sensitive.\n\nLet's take\
    \ a look at how the equals() method works in action (notice that the Budgie class\
    \ did NOT override Object.equals"
