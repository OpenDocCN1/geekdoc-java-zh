  md: '# Define Classes Objectives 1.2, 1.3, 1.4, 6.4, and 7.5)


    1.2 Define the structure of a Java class.

    1.3 Create executable Java applications with a main method; run a Java program
    from the command line; including console output.(sic)

    1.4 Import other Java packages to make them accessible in your code.

    6.4 Apply access modifiers.

    7.5 Use abstract classes and interfaces.


    When you write code in Java, you''re writing classes or interfaces. Within those
    classes, as you know, are variables and methods (plus a few other things). How
    you declare your classes, methods, and variables dramatically affect your code''s
    behavior. For example, a public method can be accessed from code running anywhere
    in your application. Mark that method private, though, and it vanishes from everyone''s
    radar (except the class in which it was declared).


    For this objective, we will study the ways in which you can declare and modify
    (or not) a class. You''ll find that we cover modifiers in an extreme level of
    detail, and although we know you''re already familiar with them, we''re starting
    from the very beginning. Most Java programmers think how they work but on closer
    study they find out that they don''t (at least to the degree needed for the exam).
    Subtle distinctions are everywhere, so you need to be absolutely sure you''re
    completely solid on everything in this section''s objectives before taking the
    exam.


    # Source File Declaration Rules


    Before we dig into class declarations, let''s do a quick review of the rules associated
    with declaring classes, import statements, and package statements in a source
    file:


    +   - There can be only one public class per source code file.

    - Comments can appear at the beginning or end of any line in the source code file;
    they are independent of any of the positioning rules here.

    - If there is a public class in a file, the name of the file must match the pattern
    of the public class. For example, a class declared as public class Dog { } must
    be in a source code file named dog.java.

    - If the class is part of a package, the package statement must be the first line
    in the source code file, before any import statements that may be present.

    - If there are import statements, they must go between the package statement (if
    there is one) and the class declaration. If there isn''t a package statement,
    then the import statement(s) must be the first line(s) in the source code file.
    If there are no package or import statements, the class declaration must be the
    first line in the source code file.

    - import and package statements apply to all classes within a source code file.
    In other words, there''s no way to declare multiple classes in a file and have
    them in different packages or use different imports.'
