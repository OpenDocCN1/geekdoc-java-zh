    # # Important Facts About Strings and Memory


    In this section, we will discuss how Java handles String objects and some of the
    reasons behind these behaviors.

    One of the keys of any good programming language is to use memory. As an application
    grows, it''s very common for string literals to occupy large amounts of a program''s
    memory, and there is often a lot of redundancy when the use of String literals
    for a program. To make Java more memory efficient, the JVM sets aside a special
    area of memory called the String constant pool. When the compiler encounters a
    String literal, it checks the pool to see if an identical String already exists.
    If a match is found, the reference to the new literal is directed to the existing
    one, and no new String literal object is created. The existing String simply explains
    why making String objects immutable is such a good idea. If several reference
    variables refer to the same String without knowing it, it would be very bad if
    any of them could change the String''s value.


    You might say, "Well that''s all well and good, but what if someone overrides
    the class functionality; couldn''t that cause problems in the pool?" That''s one
    of the main reasons that the String class is marked final. Nobody can override
    the behaviors of any of the String methods, so you can rest assured that the String
    objects you are counting on to be immutable, in fact, will be immutable.


