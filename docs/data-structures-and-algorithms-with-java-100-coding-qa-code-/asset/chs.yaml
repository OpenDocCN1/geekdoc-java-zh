  \ trees）是你编程工具箱中非常有力的工具。在本文，我们将探索什么是伸展树、它们如何工作、其时间和空间复杂度，以及如何在 Java 中使用它们。读完这篇文章后，你将能够自如在程序中实现并使用伸展树。\n\
  \n### 什么是伸展树？\n\n伸展树是一种自平衡二叉搜索树。它与 AVL 树和红黑树等其他自平衡二叉搜索树相似，但它有一些关键区别。在伸展树中，节点会在树中移动以提高性能。这是通过“旋转”（splaying）树来实现的，旋转是一个重新排列树以使某个节点成为根节点的过程。\n\
  \n伸展树在需要频繁访问和更新树的应用程序中非常有用。这是因为伸展树针对快速访问进行了优化。伸展树可以重新排列自己，将最频繁使用的节点变为根节点，从而被快速访问。\n\
  \n### 伸展树是如何工作的？\n\n伸展树通过重新排列树内的节点来提高性能。这是通过旋转树来实现的，旋转是将某个节点变为树的根节点的过程。当一个节点被访问时，它会被旋转到树的根位置。\n\
  \n当一个节点插入到树中时，它首先作为叶子节点插入。然后，旋转树使插入的节点成为树的根节点。同样，当一个节点从树中删除时，它首先作为叶子节点被删除。然后，旋转树使被删除节点的父节点成为树的根节点。\n\
  \n## 时间复杂度\n\n伸展树访问、插入和删除的时间复杂度为 `O(log n)`。这是因为树是自平衡的并且针对快速访问进行了优化。\n\n## 空间复杂度\n\
  \n伸展树在最坏情况空间复杂度为 `O(n)`。这是因为伸展树在内存中存储所有的节点。\n\n### 在 Java 中使用伸展树\n\n现在我们已经探索了伸展树是什么以及它是如何工作的，让我们来看看如何在\
