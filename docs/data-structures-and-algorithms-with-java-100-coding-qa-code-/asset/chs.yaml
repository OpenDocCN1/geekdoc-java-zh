  \    System.out.print(num + \" \");\n    }\n    System.out.println();\n}\n\npublic\
  \ static void countingSort(int[] array, int range) {\n    // 创建计数数组存储每个元素的计数\n \
  \   int[] count = new int[range];\n    // 存储每个元素的计数\n    for (int i = 0; i < array.length;\
  \ i++) {\n        count[array[i] - 1]++;\n    }\n    // 修改计数数组，使得每个索引处\n    // 存储之前计数的和\n\
  \    for (int i = 1; i < count.length; i++) {\n        count[i] += count[i - 1];\n\
  \    }\n    // 创建输出数组\n    int[] output = new int[array.length];\n    // 根据计数数组从输入数组存储元素\n\
  \    // 并放入输出数组\n    for (int i = array.length - 1; i >= 0; i--) {\n        output[count[array[i]\
  \ - 1] - 1] = array[i];\n        count[array[i] - 1]--;\n    }\n    // 将排序后的元素拷贝回原始数组\n\
  \    System.arraycopy(output, 0, array, 0, array.length);\n}\n```\n\n## 结论\n\n总之，计数排序是一种根据频率对集合进行排序的高效算法。它是一种非比较排序算法，使用计数数组对元素进行排序。当已知集合中的元素在特定范围内时，计数排序特别有用。该算法简单高效，运行时间为线性时间\
