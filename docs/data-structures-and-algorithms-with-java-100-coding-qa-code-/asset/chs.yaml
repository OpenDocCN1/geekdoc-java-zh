  \ `O(n²)`。\n\n## 选择排序概述\n\n选择排序是一种对项目数组排序的算法。它通过不断从数组的未排序部分找到最小元素并将其放在数组开头来工作。这个过程不断重复，直到数组中的所有元素都排序完毕。选择排序是一种原地排序算法，意味着它不需要任何额外空间来执行排序操作。\n\
  \n## 选择排序原理\n\n选择排序通过不断从数组的未排序部分找到最小元素并将其放在数组开头来工作。这是通过逐个比较数组中的元素并跟踪最小元素来实现的。一旦找到最小元素，将其与数组中的第一个元素交换。这个过程不断重复，直到数组中的所有元素都排序完毕。\n\
  \n以下是选择排序工作原理的逐步示例：\n\n1. 从一个未排序的元素数组开始。\n2. 找到数组中的最小元素并将其与第一个元素交换。\n3. 找到数组中的第二个最小元素并将其与第二个元素交换。\n\
  4. 继续此过程，直到数组中的所有元素都完成排序。\n\n## 选择排序的 Java 代码\n\n以下是选择排序的 Java 示例：\n\n```java\n\
  public static void selectionSort(int[] array) {\n    // 遍历数组\n    for (int i = 0;\
  \ i < array.length - 1; i++) {\n        // 找到最小元素的索引\n        int minIndex = i;\n\
  \        for (int j = i + 1; j < array.length; j++) {\n            if (array[j]\
  \ < array[minIndex])\n                minIndex = j;\n        }\n        // 将最小元素与第一个元素交换\n\
  \        int temp = array[i];\n        array[i] = array[minIndex];\n        array[minIndex]\
  \ = temp;\n    }\n}\n```\n\n## 选择排序的时间复杂度\n\n选择排序的时间复杂度为 `O(n²)`，因为算法需要将数组中的每个元素与其他所有元素进行比较。选择排序中访问、搜索和删除操作的平均复杂度也是\
  \ `O(n²)`。\n\n## 选择排序的空间复杂度\n\n选择排序的空间复杂度为 `O(1)`，因为算法不需要任何额外空间来执行排序操作。\n\n## 结论\n\
  \n总之，选择排序是一种原地排序算法，时间复杂度为 `O(n²)`，空间复杂度为 `O(1)`。它通过不断从数组的未排序部分找到最小元素并将其放在数组开头来工作。\n\
