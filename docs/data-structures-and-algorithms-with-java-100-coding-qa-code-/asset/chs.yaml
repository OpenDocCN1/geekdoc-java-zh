  \n树排序对于高效快速地排序大型数据集非常有用。它的实现简单且易于理解。这使其成为开始学习排序算法的初者的绝佳选择。\n\n## 树排序的工作原理\n\n树排序的工作原理是首先创建一个二叉树数据结构。二叉树是一种树形结构，每个节点只能有两个子节点。根节点是树顶部的节点，所有其他节点都是根节点的子节点或根节点的后代。\n\
  \n要创建一个二叉树，我们从一个空树开始，逐个添加元素。每个元素都作为一个节点添加到树中，然后连接到根节点。通过将每个元素与根节点进行比较，并将其放置在相对于根节点的正确位置，从而在树中完成排序。\n\
  \n一旦树完成，就可以通过前序遍历（pre-order traversal）遍历树来排序元素。这意味着首先访问根节点，然后是左子节点，接着是右子节点，依此类推。这个过程持续到所有元素都被访问并按正确的顺序排序。\n\
  \n## 时间复杂度\n\n树排序的时间复杂度取决于数据集的大小。对于大小为 `n` 的数据集，创建树需要 `O(n log n)` 时间，而排序它需要 `O(n)`\
  \ 时间。\n\n访问、搜索、插入和删除的时间复杂度也是 `O(n log n)`。这是因为这些操作中的每一个都需要从根节点开始遍历树，这需要 `O(log n)`\
  \ 时间。\n\n## 空间复杂度\n\n树排序的空间复杂度为 `O(n)`。这是因为树必须存储数据集中的所有元素。\n\n## Java 代码\n\n这里是一个\
