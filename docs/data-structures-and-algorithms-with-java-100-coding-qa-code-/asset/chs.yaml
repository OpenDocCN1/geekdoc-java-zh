  \    int max = getMax(arr);\n    // 对每一位进行计数排序\n    for (int exp = 1; max/exp >\
  \ 0; exp *= 10) {\n        countSort(arr, exp);\n    }\n}\n\n// 使用基数排序长度为 n 的 arr[]\n\
