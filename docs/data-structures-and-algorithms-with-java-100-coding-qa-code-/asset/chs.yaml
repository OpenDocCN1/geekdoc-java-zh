  \n\n# Java 中的归排序 (Mergesort)\n\n归排序是一种经典的排序算法，用于对给定的元素列表进行排序。它是一种分治算法，通过将元素列表分解为多个子列表并对每个子列表进行排序，直到整个列表排序完成。在本文中，我们将介绍归排序的工作原理、时间复杂度和空间复杂度。我们还将通过一个\
  \ Java 归排序的示例来更好地理解该算法。最后，我们将提供五个带有答案的编程练习，以测试读者对归排序的理解。\n\n## 什么是归排序？\n\n归排序是一种高效的排序算法，它通过将给定的元素列表分解为子列表，并对每个子列表进行排序，直到整个列表排序完成。它是一种分治算法，使用递归将列表分解为更小的子列表，然后将排序后的子列表合并在一起。归排序是一种稳定排序算法，这意味着在列表排序后，相等元素的顺序将保持不变。\n\
  \n## 归排序算法\n\n归排序算法可以分解为三个步骤：\n\n1. **划分 (Divide)**：这是归排序算法的第一步。将元素列表分为两个子列表，直到每个子列表只包含一个元素。这是通过重复地将列表对半，直到每个子列表只有一个元素来实现的。\n\
  2. **解决 (Conquer)**：这是归排序算法的第二步。在这一步中，通过比较每个子列表中的元素并顺序合并来对子列表进行排序。这是通过重复比较每个子列表的第一个元素，直到整个列表排序完成来实现。\n\
  3. **合并 (Combine)**：这是归排序算法的最后一步。在这一步中，将排序后的子列表合并形成排序后的列表。这是通过重复合并子列表直到整个列表排序完成来实现。\n\
  \n为了说明归排序的过程，让我们考虑以下列表：`[3,2,1,4,5]`。该列表可以通过以下步骤使用归排序进行排序：\n\n1. 将列表对半：`[3,2,1]`\
  \ `[4,5]`\n2. 排序每个半部分：`[2,3,1]` `[4,5]`\n3. 将两个半部分合并：`[2,3,1,4,5]`\n\n## Java 归排序示例\n\
  \n现在我们已经对归排序算法有了基本的了解，让我们来看一个 Java 归排序的示例。以下代码是 Java 归排序的一个示例。\n\n```java\npublic\
  \ class MergeSort {\n    public static void main(String[] args) {\n        int[]\
  \ arr = {10, 7, 8, 9, 1, 5};\n        // 打印给定数组\n        System.out.println(\"Given\
  \ Array\");\n        printArray(arr);\n        // 排序数组\n        mergesort(arr, 0,\
  \ arr.length-1);\n        // 打印排序后的数组\n        System.out.println(\"\\nSorted Array\"\
  );\n        printArray(arr);\n    }\n\n    // 使用归排序算法对数组排序\n    public static void\
  \ mergesort(int[] arr, int left, int right) {\n        if (left < right) {\n   \
  \         // 找到中间点\n            int mid = (left+right)/2;\n            // 排序前、后半部分\n\
  \            mergesort(arr, left, mid);\n            mergesort(arr , mid+1, right);\n\
  \            // 合并排序后的半部分\n            merge(arr, left, mid, right);\n        }\n\
  \    }\n\n    // 合并排序后的半部分\n    public static void merge(int[] arr, int left, int\
  \ mid, int right) {\n        // 找到要合并的两个子数组的大小\n        int n1 = mid - left + 1;\n\
  \        int n2 = right - mid;\n        // 创建临时数组\n        int[] L = new int[n1];\n\
  \        int[] R = new int[n2];\n        // 将数据拷贝到临时数组\n        for (int i=0; i<n1;\
  \ ++i)\n            L[i] = arr[left + i];\n        for (int j=0; j<n2; ++j)\n  \
  \          R[j] = arr[mid + 1+ j];\n        // 合并临时数组\n        // 第、二子数组的初始化\n \
  \       int i = 0, j = 0;\n        // 合并子数组的初始索引\n        int k = left;\n      \
  \  while (i < n1 && j < n2) {\n            if (L[i] <= R[j]) {\n               \
  \ arr[k] = L[i];\n                i++;\n            } else {\n                arr[k]\
  \ = R[j];\n                j++;\n            }\n            k++;\n        }\n  \
  \      // 拷贝 L[] 中剩余的元素（如果有）\n        while (i < n1) {\n            arr[k] = L[i];\n\
  \            i++;\n            k++;\n        }\n        // 拷贝 R[] 中剩余的元素（如果有）\n\
  \        while (j < n2) {\n            arr[k] = R[j];\n            j++;\n      \
  \      k++;\n        }\n    }\n\n    // 打印数组的函数\n    public static void printArray(int[]\
  \ arr) {\n        int n = arr.length;\n        for (int i=0; i<n; ++i)\n       \
  \     System.out.print(arr[i] + \" \");\n        System.out.println();\n    }\n\
  }\n```\n\n## 时间空间复杂度\n\n归排序的时间复杂度为 `O(n log n)`，这是因为它需要将列表对半并进行合并。在平均情况和最坏情况下，它的时间复杂度都是\
  \ `O(n log n)`。空间复杂度为 `O(n)`，因为它需要额外的空间来存储合并时的子数组。\n\n## 结论\n\n在本文中，我们讨论了归排序、其时间复杂度和空间复杂度。我们还通过\
