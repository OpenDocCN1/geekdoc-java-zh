  \ 如果根为空，空间复杂度为 0\n    if (root == null) {\n        return 0;\n    }\n    // 计算左子树和右子树的空间复杂度\n\
  \    int leftSubtreeSpace = spaceComplexity(root.left);\n    int rightSubtreeSpace\
