  \ k)`，其中 `n` 是元素的数量，`k` 是数字的位数。\n\n## 空间复杂度\n\n基数排序的空间复杂度为 `O(n + k)`，其中 `n` 是元素的数量，`k`\
  \ 是取值的范围。\n\n## Java 代码\n\n这里是实现基数排序的示例 Java 代码：\n\n```java\n// 根据 exp 对 arr[] 进行计数排序\n\
  public static void countSort(int[] arr, int exp) {\n    int n = arr.length;\n  \
  \  int output[] = new int[n];\n    int count[] = new int[10];\n\n    Arrays.fill(count,\
  \ 0);\n\n    // 在 count[] 中存储出现次数\n    for (int i = 0; i < n; i++) {\n        count[(arr[i]/exp)%10]++;\n\
  \    }\n    // 修改 count[i]，使得 count[i] 现在包含在 output[] 中的实际位置\n    for (int i = 1;\
  \ i < 10; i++) {\n        count[i] += count[i - 1];\n    }\n    // 构建输出数组\n    for\
  \ (int i = n - 1; i >= 0; i--) {\n        output[count[(arr[i]/exp)%10] - 1] = arr[i];\n\
  \        count[(arr[i]/exp)%10]--;\n    }\n    // 将输出数组复制到 arr[]，使得 arr[] 现在包含排序后的数字\n\
  \    for (int i = 0; i < n; i++) {\n        arr[i] = output[i];\n    }\n}\n\n//\
