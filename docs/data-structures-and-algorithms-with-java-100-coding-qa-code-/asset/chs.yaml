  ```java\npublic class SuffixTree {\n    Node root;\n    public SuffixTree() {\n\
  \        this.root = new Node(\"\");\n    }\n}\n```\n\n### 步骤 3：向后缀树中添加字符串\n现在，让我们来看看如何向后缀树中添加字符串。\n\
  \n`addString()` 方法接受字符串作为参数并将其添加到后缀树中。`addString()` 方法应该遍历树并根据需要创建新节点。\n\n```java\n\
  public void addString(String str) {\n    Node currentNode = root;\n    for(int i=0;\
  \ i<str.length(); i++) {\n        char c = str.charAt(i);\n        // 检查字符是否已经存在于树中\n\
  \        boolean isPresent = false;\n        for(Node child : currentNode.children)\
  \ {\n            if (child.data.equals(Character.toString(c))) {\n             \
  \   currentNode = child;\n                isPresent = true;\n                break;\n\
  \            }\n        }\n        // 如果字符不存在，则创建一个新节点\n        if (!isPresent)\
  \ {\n            Node newNode = new Node(Character.toString(c));\n            currentNode.children.add(newNode);\n\
  \            currentNode = newNode;\n        }\n    }\n    // 标记字符串的结束\n    currentNode.isLeaf\
  \ = true;\n}\n```\n\n## 结论\n\n在本文中，我们讨论了后缀树及其各种操作。我们查看了操作的时间和空间复杂度，还查看了使用 Java 实现后缀树的示例。\n\
