  \ visited);\n    }\n  }\n}\n```\n\n# Java 实现的 Dijkstra 算法\n\nDijkstra 算法是图论中一种强大的算法，用于寻找两个顶点之间的最短路径。它由荷兰计算机科学家\
  \ Edsger Dijkstra 于 1956 年开发，现在是计算机科学中应用最广泛的算法之一。它被用于许多应用，并且通常用于寻找地图上两个位置之间的最短路径。Dijkstra\
  \ 算法效率极高，其时间复杂度为 `O(V² + E)`，其中 `V` 是图中顶点的数量，`E` 是图中边的数量。在本文中，我们将讨论 Dijkstra 算法的工作原理、它的时间复杂空间复杂度，以及如何在\
  \ Java 中实现它。\n\n## Dijkstra 算法的工作原理\n\nDijkstra 算法是一种贪心算法，其工作原理是从一个顶点开始，探索从它到其他顶点的所有可能路径。在探索每条路径时，它会记录每条路径的成本以及目前的总成本。一旦探索了所有路径，它就找到了从起始顶点到每个其他顶点的最短路径。\n\
  \n该算法通过使用优先级队列工作。该队列用于存储所有已探索路径以及每条路径的总成本。优先级队列根据每条路径的成本进行排序，因此成本的路径始终位于队列顶端。然后，算法获取队列顶部的路径并从该顶点探索所有可能的路径。在探索所有路径后，算法更新每条路径的总成本并将其放回优先级队列。这个过程不断重复，直到队列为空。\n\
  \n## 时间复杂度\n\nDijkstra 算法的时间复杂度为 `O(V² + E)`，其中 `V` 是图中顶点的数量，`E` 是边的数量。这意味着该算法可以在合理的时间内解决大型图。\n\
  \n## 空间复杂度\n\nDijkstra 算法的空间复杂度为 `O(V)`，其中 `V` 是图中顶点的数量。这意味着该算法运行所需的内存较少。\n\n##\
  \ 在 Java 中实现 Dijkstra 算法\n\n现在我们已经讨论了 Dijkstra 算法的工作原理及其时间和空间复杂度，让我们来看看如何在 Java\
  \ 中实现它。首先，我们需要定义一些类。\n\n### Node 类\n我们可以从定义 `Node` 开始，它将代表图中的顶点。\n```java\nclass\
  \ Node {\n  int id;\n  Map<Node, Integer> edges;\n}\n```\n\n### Graph 类\n接下来，我们需要定义\
  \ `Graph`，它将存储节点。\n```java\nclass Graph {\n  List<Node> nodes;\n}\n```\n\n### PriorityQueue\
  \ 类\n我们还需要定义 `PriorityQueue`，它将存储路径并比较它们的成本。\n```java\nclass PriorityQueue {\n \
  \ Comparator<Path> comparator;\n}\n```\n\n### Path 类\n最后，我们需要定义 `Path`，它将代表从一个顶点到另一个顶点的路径。\n\
  ```java\nclass Path {\n  List<Node> nodes;\n  int cost;\n}\n```\n\n### 实现逻辑\n现在我们定义了类，可以开始实现算法。我们通过节点和边初始化图。\n\
  ```java\nGraph graph = new Graph();\n```\n接下来，使用起始路径初始化优先级队列。起始路径应包含起始顶点且成本为 0。\n\
  ```java\nPriorityQueue queue = new PriorityQueue();\nPath startPath = new Path();\n\
  startPath.cost = 0;\n```\n然后我们遍历队列直到它为空。在每次循环中，我们需要从队列获取成本最低的路径，探索该节点的所有边并将路径加入队列。\n\
  ```java\nwhile(!queue.isEmpty()) {\n  Path currPath = queue.poll();\n  Node lastNode\
  \ = currPath.nodes.get(currPath.nodes.size() - 1);\n  for(Node neighbor : lastNode.edges.keySet())\
  \ {\n    int cost = currPath.cost + lastNode.edges.get(neighbor);\n    Path newPath\
  \ = new Path();\n    newPath.nodes.addAll(currPath.nodes);\n    newPath.nodes.add(neighbor);\n\
  \    newPath.cost = cost;\n    queue.add(newPath);\n  }\n}\n```\n一旦优先级队列为空，算法即完成，我们找到了从起始顶点到每个其他顶点的最短路径。\n\
  \n这是另一种使用邻接矩阵的 Dijkstra 算法实现。以下代码示例展示了如何创建邻接矩阵并使用它寻找两个节点之间的最短路径。\n\n```java\nimport\
