  \ max;\n}\n```\n\n### Java 中的计数排序\n\n计数排序是一种根据对象的频率对集合进行排序的高效算法。它是一种非比较排序算法，使用计数数组对元素进行排序。当已知集合中的元素在特定范围内时，计数排序特别有用。这意味着集合中不同元素的数量是已知的且相对较少。计数排序通常用于值范围较小且集合较大的情况。\n\
  \n计数排序的工作原理是统计每个元素在集合中出现的次数，然后利用这些信息将元素放置在排序集合中的正确位置。该算法简单高效，运行时间为线性时间 (O(n))。计数排序还可以用于确定集合中元素的频率。\n\
  \n## 计数排序的工作原理\n\n计数排序通过统计每个元素在集合中出现的次数，然后利用这些信息将元素放置在排序集合中的正确位置。该算法通过创建一个整数数组来实现，数组中的每个索引对应集合中的一个元素。然后，算法计算每个元素在集合中出现的次数，并将此信息存储在数组对应的索引中。\n\
  \n在创建计数数组后，算法遍历集合并将每个元素放置在排序集合中的正确位置。该算法通过查找计数数组中元素的计数，然后将元素放置在排序数组的正确位置。\n\n##\
  \ 时间复杂度\n\n计数排序是一种高效的排序算法，运行时间为线性时间 (O(n))，其中 `n` 是集合的大小。该算法简单高效，运行时间为线性时间 (O(n))。\n\
  \n对于计数排序，访问、搜索、插入和删除的时间复杂度均为 O(n)。这是因为访问、搜索、插入和删除都需要遍历集合一次。\n\n## 空间复杂度\n\n计数排序的空间复杂度为\
  \ O(n+k)，其中 `n` 是集合的大小，`k` 是值的范围。这是因为计数排序需要额外的空间。\n\n## Java 示例\n\n以下 Java 示例演示了计数排序的工作。\n\
  \n```java\npublic static void main(String[] args) {\n    // 创建整数数组\n    int[] array\
  \ = new int[10];\n    for (int i = 0; i < 10; i++) {\n        array[i] = (int) (Math.random()\
  \ * 10);\n    }\n    // 打印未排序的数组\n    System.out.println(\"Unsorted array: \");\n\
  \    for (int num : array) {\n        System.out.print(num + \" \");\n    }\n  \
