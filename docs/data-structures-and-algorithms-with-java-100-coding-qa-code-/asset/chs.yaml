  \n在这篇文章中，我们将详细讨论深度优先搜索算法及其的时间复杂空间复杂度。我们还将在 Java 编程语言的背景下讨论 DFS 算法。\n\n## 算法是如何工作的？\n\
  \n深度优先搜索是一种递归算法，遵循一组特定的步骤来遍历图或树的节点。它从根节点开始，在回溯之前沿每个分支尽可能深地探索。深度优先搜索算法的核心思想是按深度优先的方式遍历图或树。它从根节点开始，沿每个分支尽可能深地探索。然后移动到下一个分支，并继续此过程直到找到目标节点。\n\
  \n以下是深度优先搜索的一个运行示例：假设我们有一个如下结构的图：\n\nA-B-C\n|\nD-E\n\n我们从节点 `A` 开始，沿每个分支尽可能深地探索。我们首先探索\
  \ `B`，然后是 `C`，最后回溯到节点 `A`。接着我们探索 `D` 然后是 `E`。我们可以停止算法，因为我们已经找到了目标节点。\n\n## 时间复杂度\n\
  \n深度优先搜索算法的时间复杂度取决于图或树中节点和边的数量。深度优先搜索的最佳情况时间复杂度为 `O(V+E)`，其中 `V` 是节点数，`E` 是边数。深度优先搜索的平均时间复杂度也是\
  \ `O(V+E)`。深度优先搜索的最坏情况时间复杂度为 `O(V²)`，其中 `V` 是节点数。\n\n## 空间复杂度\n\n深度优先搜索算法的空间复杂度为\
  \ `O(V)`，其中 `V` 是节点数。\n\n## Java 中的深度优先搜索\n\n现在我们已经讨论了深度优先搜索的基础知识，让我们来看看如何在 Java\
