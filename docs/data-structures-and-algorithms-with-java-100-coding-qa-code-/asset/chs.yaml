  ```\n\n# Java 中的卡特斯尔树\n\n数据结构和算法是任何软件项目的核心组成部分，而 Java 是实现这些内容的流行语言。最重要的数据结构之一是卡特斯尔树（Cartesian\
  \ Tree），它可以用于快速存储和访问数据。在本文，我们将讨论卡特斯尔树的基础知识、它的工作原理、时间和空间复杂度，并提供一些示例代码帮助你理解如何使用它。\n\
  \n## 什么是卡特斯尔树？\n\n卡特斯尔树是一种自平衡二叉搜索树。它以法国数学家勒内·笛卡尔（Rene Descartes）命名，他首次提出了这种数据结构。它适用于快速存储和检索数据，因为它在添加或删除元素时能够保持平衡结构。在卡特斯尔树中，每个节点都关联一个值，该值用于确定节点的排列顺序。根节点与最小值关联，而叶子节点与最大值关联。节点随后以倒置结构排列，根节点位于顶部，叶子节点位于底部。\n\
  \n## 卡特斯尔树是如何工作的？\n\n卡特斯尔树是一种自平衡二叉搜索树。这意味着它在添加或删除元素时能够保持平衡。它是通过确保每个节点的左、右子树中的元素数量始终相同（或尽可能相同）来实现的。当新元素被添加到树中时，它会与现有元素的值进行比较。如果新元素的值小于根节点的值，则将其作为根节点的新左子添加。如果新元素的值大于根节点的值，则将其作为根节点的新右子添加。此过程对每个新元素重复进行，以确保树保持平衡。当元素从树中删除时，树将重新平衡以维持其平衡。这是通过用中序后继节点替换删除的元素来实现的。这确保了树保持平衡并保留了元素的顺序。\n\
  \n## 时间空间复杂度\n\n卡特斯尔树在访问、搜索、插入和删除方面的平均时间复杂度为 `O(log n)`。这意味着即使在处理大型数据集时，它也能快速执行这些操作。卡特斯尔树的最坏时间复杂度为\
  \ `O(n)`。这是因为每次插入或删除后必须重新平衡，而所需时间随着树中元素数量而增加。卡特斯尔树的空间复杂度为 `O(n)`，因为每个元素都需要内存空间。\n\
