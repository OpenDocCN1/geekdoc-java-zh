  # Java 中的最小堆堆 (Min Heap)\n\n`最小堆`（min heap）是一种数据结构，用于多种应用程序，如优先级队列、`heapsort`（堆排序）等。它是一个完全二叉树，遵循堆属性，即任何节点的值都大于或等于其父节点。在本文，我们将讨论`最小堆`的特征及其工作原理。我们还将讨论`插入`、`删除`、`搜索`的时间和空间复杂度，并提供几个\
  \ Java 示例来说明每种操作。\n\n### 什么是最小堆？\n\n`最小堆`是二叉树的一种。它是一个完全二叉树，这意味着树的所有层都被填满，除了最后底层外，且底层是从左到右填充的。堆属性规定任何节点的值都大于或等于其父节点。在`最小堆`中，这意味着根节点拥有整个树中最小的值。\n\
  \n最小堆的主要操作是`插入`、`删除`和`搜索`。`插入`向堆中添加新项，而`删除`从堆中移除一个项。`搜索`用于在堆中查找项。\n\n## 时间复杂度\n\
