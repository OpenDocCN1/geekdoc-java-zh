  ```java\npublic static int findMax(int[] array) {\n    Random random = new Random();\n\
  \    int max = array[0];\n    for (int i = 0; i < array.length; i++) {\n       \
  \ int randomIndex = random.nextInt(array.length);\n        int element = array[randomIndex];\n\
  \        if (element > max) {\n            max = element;\n        }\n    }\n  \
  \  return max;\n}\n```\n\n### 编写一个 Java 程序，使用随机算法对数组进行升序排序。\n\n```java\npublic static\
