  \n## 基数排序的工作原理\n\n基数排序是一种非比较排序算法，利用了给定列表中的元素可以通过其基数按特定顺序排序的事实。基数排序的工作原理首先根据元素的基数或进制将元素列表分成桶（或箱），然后对这些桶进行排序。\n\
