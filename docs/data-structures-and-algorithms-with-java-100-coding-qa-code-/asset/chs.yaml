  \ isLeaf：这是一个布尔值，用于指示该节点是否为叶子节点。\n\n```java\npublic class Node {\n    String data;\n\
  \    List<Node> children;\n    boolean isLeaf;\n    public Node(String data) {\n\
  \        this.data = data;\n        this.children = new ArrayList<>();\n       \
