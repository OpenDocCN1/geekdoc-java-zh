  \ 0; gap /= 2) {\n            // 对当前间距进行插入排序\n            // 前 gap 个元素（0..gap-1）已经是间隔排序的\n\
  \            // 不断添加元素，直到整个数组排序\n            for (int i = gap; i < n; i++) {\n \
  \               // ... 实现细节\n            }\n        }\n    }\n}\n```\n\n\n\n\n\n\
