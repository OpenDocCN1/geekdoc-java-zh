  ## Java 中的线性查找\n线性查找是在给定的元素列表中查找某个元素的过程。搜索从列表开始并持续进行，直到找到该元素或到达列表末尾。它也被称为顺序查找。线性查找是一种简单且直观的搜索算法，可用于在列表中查找元素。\n\
  \n### 线性查找的工作原理\n线性查找的工作原理是从列表开始，将列表中的每个元素与要查找的项进行比较。如果如果找到了该项，则搜索成功并返回元素的索引。如果没有找到该项，则搜索失败并返回一个空值。\n\
  \n线性查找可以使用 `for` 循环来实现。`for` 循环将遍历列表的每个元素，并将其与要查找的项进行比较。如果找到了该项，可以提前终止循环并返回元素的索引。如果没有找到该项，循环将持续到到达列表末尾。\n\
  \n### Java 示例\n下面的 Java 代码演示了如何实现线性查找。该示例在整数数组中搜索值 `13`。\n\n```java\npublic class\
  \ LinearSearch {\n    public static void main(String[] args) {\n        // 搜索的整数数组\n\
  \        int[] numbers = {2, 4, 6, 8, 10, 12, 14, 16, 20};\n        // 要搜索的值\n \
  \       int value = 13;\n        // 搜索数组\n        int index = linearSearch(numbers,\
  \ value);\n        // 显示结果\n        if (index == -1) {\n            System.out.println(\"\
  Value not found!\");\n        } else {\n            System.out.println(\"Value found\
  \ at index: \" + index);\n        }\n    }\n    // 线性查找算法\n    public static int\
  \ linearSearch(int[] numbers, int value) {\n        for (int i = 0; i < numbers.length;\
  \ i++) {\n            if (numbers[i] == value) {\n                return i;\n  \
  \          }\n        }\n        return -1;\n    }\n}\n```\n\n## 时间复杂度\n线性查找的时间复杂度为\
  \ `O(n)`，其中 `n` 是列表中元素的数量。这意味着搜索时间随列表中元素数量增加而线性增长。如果在第一个元素处找到了该项，线性查找的最优时间复杂度为 `O(1)`。\n\
  \n## 空间复杂度\n线性查找的空间复杂度为 `O(1)`。这意味着该算法使用的内存不会随列表大小而增加。\n\n## 结论\n线性查找是一种简单且直观的搜索算法，可用于在列表中查找元素。它通过\
  \ `for` 循环遍历列表的每个元素，并将其与要查找的项进行比较。\n\n## 练习\n- 编写一个查找字符串数组特定字符串的线性查找。\n- 编写一个查找对象数组特定对象的线性查找。\n\
