  \ 的数字。\n4. 编写一个程序，仅当数字同时能被 2 和 3 整除时打印 1 到 10 的数字。\n5. 编写一个程序，仅当数字不能被 4 整除时打印 1\
  \ 到 10 的数字。\n\n## 答案\n\n### 编写一个程序，使用 `for` 循环打印 1 到 10 的数字。\n```java\nfor (int\
  \ i = 1; i <= 10; i++) {\n  System.out.println(i);\n}\n```\n\n### 编写一个程序，仅当数字为偶数时打印\
