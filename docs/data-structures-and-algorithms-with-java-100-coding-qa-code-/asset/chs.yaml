  \    return smallestElement;\n}\n```\n\n### Java 中的插入排序\n\n插入排序是一种用于数组元素排序的算法。它是一种基于比较的排序算法，将元素与其之前的元素进行比较，然后插入到数组中的适当位置。在这篇文章中，我们将详细讨论插入排序算法，并探索它的时间和空间复杂度。我们还将通过\
  \ Java 代码示例来展示插入排序在实践中是如何工作的。\n\n### 插入排序的工作原理\n\n插入排序通过遍历数组并将每个元素与它前面的元素进行比较来工作。如果前一个元素更大，算法将交换这两个元素。这个过程一直持续到该元素处于数组中的正确位置。\n\
  \n该算法可以分解为以下步骤：\n\n1. 从一个未排序的元素数组开始。\n2. 为数组的当前索引设置一个标记。\n3. 将当前索引处的元素与它之前的元素进行比较。\n\
  4. 如果前面的元素更大，则交换这两个元素。\n5. 将标记移动到数组中的下一个元素。\n6. 重复步骤 3-5，直到标记到达数组末尾。\n\n### 插入排序的时间复杂度\n\
  \n插入排序最坏情况下的时间复杂度为 $O(n²)$，最好情况下为 $O(n)$。这意味着该算法在最坏情况下需要平方级的时间，而在最好的情况下需要线性级的时间。访问、搜索和删除的时间复杂度均为\
  \ $O(n)$，意味着访问、搜索和删除一个元素需要线性级的时间。\n\n### 插入排序复杂度\n\n插入排序的空间复杂度为 $O(1)$，这意味着排序数组需要常数空间。这是因为算法不需要额外的内存来存储数据。\n\
  \n### 插入排序的 Java 代码\n\n现在我们已经讨论了插入排序的工作原理及其时间和复杂度，让我们看看它在实践中是如何工作的。我们将通过一个实现插入排序的\
  \ Java 代码示例。首先，我们将定义一个名为 `insertionSort()` 的方法，它接收一个整数数组作为参数并返回一个排序后的数组。该方法将包含插入排序。\n\
