  \n    // 从字典树中删除字符串\n    public void delete(String str) {\n        // 从根节点开始\n \
  \       TrieNode currentNode = root;\n        for (int i = 0; i < str.length();\
  \ i++) {\n            char c = str.charAt(i);\n            int index = c - 'a';\n\
  \            // 检查字符是否存在于节点中\n            if (currentNode.children[index] == null)\
  \ {\n                return;\n            }\n            currentNode = currentNode.children[index];\n\
  \        }\n        // 将最后一个节点标记为不是字符串的结束\n        currentNode.isEndOfString = false;\n\
  \    }\n}\n```\n\n实现一个在 Trie 树中搜索字符串的方法。\n\n```java\npublic boolean search(String\
  \ str) {\n    // 从根节点开始\n    TrieNode currentNode = root;\n    for (int i = 0; i\
  \ < str.length(); i++) {\n        char c = str.charAt(i);\n        int index = c\
  \ - 'a';\n        // 检查字符是否存在于节点中\n        if (currentNode.children[index] == null)\
  \ {\n            return false;\n        }\n        currentNode = currentNode.children[index];\n\
  \    }\n    // 检查最后一个节点是否是字符串的结束\n    return currentNode.isEndOfString;\n}\n```\n\
  \n实现一个向 Trie 树中插入字符串的方法。\n\n```java\npublic void insert(String str) {\n    // 从根节点开始\n\
  \    TrieNode currentNode = root;\n    for (int i = 0; i < str.length(); i++) {\n\
  \        char c = str.charAt(i);\n        int index = c - 'a';\n        // 检查字符是否存在于节点中\n\
  \        if (currentNode.children[index] == null) {\n            currentNode.children[index]\
  \ = new TrieNode(c);\n        }\n        currentNode = currentNode.children[index];\n\
  \    }\n    // 将最后一个节点标记为字符串的结束\n    currentNode.isEndOfString = true;\n}\n```\n\
