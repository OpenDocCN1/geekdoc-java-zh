  ```java\nfor (int i = 1; i <= 10; i++) {\n  if (i % 3 == 0) {\n    System.out.println(i);\n\
  \  }\n}\n```\n\n### 编写一个程序，仅当数字同时能被 2 和 3 整除时打印 1 到 10 的数字。\n```java\nfor (int i\
  \ = 1; i <= 10; i++) {\n  if (i % 2 == 0 && i % 3 == 0) {\n    System.out.println(i);\n\
  \  }\n}\n```\n\n### 编写一个程序，仅当数字不能被 4 整除时打印 1 到 10 的数字。\n```java\nfor (int i = 1;\
  \ i <= 10; i++) {\n  if (i % 4 != 0) {\n    System.out.println(i);\n  }\n}\n```\n\
  \n\n\n\n公共类、对象和方法可以被程序中的任何其他类或对象访问。私有类、对象和方法只能由声明它们的类或对象访问。保护类、对象和方法只能由声明它们的类或对象以及该类的任何子类访问。\n\
  \n在下面的示例中，我们创建了一个名为 `BankAccount` 的类，包含两个实例变量（`balance` 和 `interestRate`）和两个方法（`deposit`\
  \ 和 `withdraw`）。实例变量被声明为 `private`，这意味着它们只能被 `BankAccount` 类访问。方法被声明为 `public`，这意味着它们可以被程序中的任何其他类或对象访问。\n\
  \n```java\npublic class BankAccount {\n   // instance variables\n   private double\
  \ balance; own   private double interestRate;\n\n   // methods\n   public void deposit(double\
  \ amount) {\n     balance += amount;\n   }\n\n   public void withdraw(double amount)\
  \ {\n     balance -= amount;\n   }\n}\n```\n\n## 继承\n\n继承是类继承属性、结构和行为的方法。这允许我们创建类层次结构并重用代码。\n\
  \n在下面的示例中，我们创建了一个名为 `SavingsAccount` 的类，它继承自 `BankAccount` 类。`SavingsAccount` 类拥有与\
  \ `BankAccount` 类相同的所有实例变量和方法，但还有一个额外的实例变量（`monthlyFee`）和方法（`applyFee`）。\n\n```java\n\
  public class SavingsAccount extends BankAccount {\n   // instance variable\n   private\
  \ double monthlyFee;\n\n   // constructor\n   public SavingsAccount(double interestRate,\
  \ double monthlyFee) {\n     this.interestRate = interestRate;\n     this.monthlyFee\
  \ = monthlyFee;\n   }\n\n   // method\n   public void applyFee() {\n     balance\
  \ -= monthlyFee;\n   }\n}\n```\n\n我们可以从 `SavingsAccount` 类创建一个对象，并使用它来访问 `BankAccount`\
  \ 和 `SavingsAccount` 类的实例变量和方法。\n\n```java\nSavingsAccount savingsAccount = new\
  \ SavingsAccount(0.05, 5.00);\nsavingsAccount.deposit(100.00);\nsavingsAccount.withdraw(50.00);\n\
  savingsAccount.applyFee();\n```\n\n## 接口\n\n接口是一种用于定义对象行为的类类型。接口使用 `interface` 关键字后跟接口名称来声明。在下面的示例中，我们创建了一个名为\
  \ `Comparable` 的接口，它定义了一个 `compareTo()` 方法。\n\n```java\npublic interface Comparable\
  \ {\n   int compareTo(Object other);\n}\n```\n\n类可以通过使用 `implements` 关键字后跟接口名称来声明并实现一个接口。在下面的示例中，我们创建了一个名为\
  \ `Person` 的类，它实现了 `Comparable` 接口。\n\n```java\npublic class Person implements Comparable\
  \ {\n   // instance variables\n   private String name;\n   private int age;\n\n\
  \   // constructor\n   public Person(String name, int age) {\n     this.name = name;\n\
  \     this.age = age;\n   }\n\n   // method\n   public int compareTo(Object other)\
  \ {\n     Person otherPerson = (Person) other;\n     if (this.age < otherPerson.age)\
  \ {\n         return -1;\n     } else if (this.age > otherPerson.age) {\n      \
  \   return 1;\n     } else {\n         return 0;\n     }\n   }\n}\n```\n\n## 结论\n\
  \n类和对象是 Java 面向对象编程的根本基石。类是用于定义对象属性、结构和行为的蓝图或模板。对象是类的实例，用于在程序中存储数据。构造函数、方法、访问修饰符、继承和接口用于创建和操作类与对象。通过理解类和对象，程序员可以创建高效的数据结构和算法。\n\
