  md: "# HOUR 23: Creating Minecraft Mods with Java\n\nThese commands need both a\
    \ player object and world object. They also need a list of every living mob, which\
    \ is accomplished in Line 19:\n\n```\nList<LivingEntity> mobs = world.getLivingEntities();\n\
    ```\n\nThis statement calls the world's getLivingEntities() method, which returns\
    \ a List object containing each mob. The mobs are represented as objects that\
    \ implement the LivingEntity interface.\n\nList is also an interface. It is implemented\
    \ by array lists, stacks, and other data structures. The methods and techniques\
    \ used by array lists can work with this list as well.\n\nAfter you have this\
    \ list, you can implement the /mobcount command with a single statement (Line\
    \ 47):\n\n```\nme.sendMessage(\"There are \" + mobs.size() + \" \" living mobs.\"\
    );\n```\n\nA list's size() command returns the number of elements in that list:\n\
    \nThis information is sent to the player as a message that appears in the game.\
