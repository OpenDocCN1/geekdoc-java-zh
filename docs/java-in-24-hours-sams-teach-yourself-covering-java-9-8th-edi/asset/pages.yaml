    \ = \"Cupid\";\nreindeerNames[6] = \"Donner\";\nreindeerNames[7] = \"Blitzen\"\
    ;\n```\n\nEach element of the array must be of the same type. Here, a string is\
    \ used to hold each of the reindeer names.\n\nAfter an array is created, you cannot\
    \ make room for more elements. Even if you recall the most famous reindeer of\
    \ all, you can't add \"Rudolph\" as the ninth element of the reindeerNames array.\
    \ The Java compiler won't let Rudolph join in any reindeerNames.\n\n# Using Arrays\n\
    \nYou use arrays in a program as you would in any variable, with one difference:\
