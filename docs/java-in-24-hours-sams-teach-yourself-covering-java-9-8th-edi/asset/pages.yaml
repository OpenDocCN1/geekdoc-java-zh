    As you''ve learned, Java has similar numeric variables that hold values of different
    sizes. Both int and long integers, but long holds a larger range of possible values.
    Both float and double carry floating-point numbers, but double is bigger.


    You can append a letter to a numeric value to indicate the value''s type, as in
    this statement:


    ```

    float pi = 3.14F;

    ```'
