  md: '# Assigning Variable Types


    designates tops as a variable that is used to store integer numbers. You can use
    the int type to store most of the non-decimal numbers you need in your computer
    programs. It can hold any integer ranging from around -2.14 billion to 2.14 billion.


    Add a blank line after the int tops statement and enter the following statement:

    float gradePointAverage;


    This statement creates a variable with the name gradePointAverage. The float text
    stands for floating-point numbers. Floating-point variables are used to store
    numbers that might contain a decimal point.


    The float variable type holds decimal numbers of up to 38 figures. The larger
    double type holds decimal numbers up to 300 figures.


    # Characters and Strings


    Because the variables you have dealt with far are numeric, you might have the
    impression that all variables are used to store numbers. Think again. You can
    also use variables to store text. Two types of text can be stored as variables:
    characters and strings. A character is a single letter, number, punctuation mark,
    or symbol. A string is a group of characters.


    Your next step in creating the Variable Program is to create a char variable and
    a String variable. Add these two statements after the float gradePointAverage
    line:


    ```

    char key = ''C'';

    String productName = "Larvets",

    ```


    As you might have noticed, these two statements use different characters around
    the text values. When you are using character values in your program, you must
    put single quotation marks on sides of the character value being assigned to a
    variable. For string values, you must surround them with double quotation marks.


    Quotation marks prevent the character or string from being confused with a variable
