  md: '# HOUR 12

    Making the Most of Existing Objects


    This Hour''s To-Do List:


    +   - Design superclasses and subclasses.

    - Form an inheritance hierarchy.

    - Override methods.


    Java objects are ideally suited for childbearing. When you create an object—a
    set of attributes and behavior—you have designed something that''s ready to pass
    these qualities on to offspring. These child objects take a lot of the same attributes
    and behavior of the parent. They also can do some things differently than the
    parent.


    This system is called inheritance, and it''s everything superclass (parent) gives
    to its subclasses (children). Inheritance is one of the most useful aspects of
    object-oriented programming (OOP), and you learn about it during this hour.


    Another useful aspect of OOP is the capability to create an object that you can
    use with different programs. Reusability makes it easier to develop error-free,
    reliable programs.


    # The Power of Inheritance


    You have used inheritance every time you worked with one of the standard Java
    classes such as String or Integer. Java classes are organized into a pyramid-shaped
    hierarchy of classes in which all classes descend from the Object class.


    A class of objects inherits from all superclasses that are above it. To get a
    working idea of how this operates, consider the InputStreamReader class. This
    class is a superclass of FileReader, a class that reads lines of text from a file.
    The FileReader class is a subclass of InputStreamReader.


    A partial family tree of InputStreamReader is shown in Figure 12.1. Each of the
    boxes is a class, and the lines connect a superclass to any subclasses below it.'
  merge: -1
  pgno: 170
