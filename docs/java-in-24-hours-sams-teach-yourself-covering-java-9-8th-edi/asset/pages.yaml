  md: '# Workshop


    # Q&A


    +   Q. Is the numeric range of the alphabet, from 65 for ''A'' to 90 for ''Z'',
    part of the Java language? If so, what are 1 through 64 reserved for?


    +   A. The numbers 1 through 64 include numerals, punctuation marks, and some
    unprintable characters, such as linefeed, newline, and backspace. A number is
    associated with each printable character that can be used in a Java program, as
    well as some unprintable ones. Java uses the Unicode numbering system. The first
    127 characters are from the ASCII character set, which you might have used in
    another programming language.


    +   Q. In a multidimensional array, is it possible to use the length variable
    to measure different dimensions other than the first?


    +   A. You can test the dimension of the array. For the first dimension, use length
    with the name of the array, as in x.length. Subsequent dimensions can be measured
    by using length with the [0] element of that dimension. Consider an array data
    that was created with the following statement:


    ```

    int[][][] data = new int[12][13][14];

    ```


    The dimensions of this array can be measured by using the data.length variable
    for the first dimension, data[0].length for the second, and data[0][0].length
    for the third.


