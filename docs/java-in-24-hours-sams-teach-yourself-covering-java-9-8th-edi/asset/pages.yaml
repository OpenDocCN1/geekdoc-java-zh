  md: '# Exceptions


    Although you are just learning about them now, you have probably become well acquainted
    with exceptions from the previous 13 hours. These errors turn up when you write
    a Java program that compiles successfully but encounters a problem as it runs.


    For example, a common programming mistake is to refer to an element of an array
    that doesn''t exist, as in the following statements:


    ```

    String[] greek = { "Alpha", "Beta", "Gamma" };

    System.out.println(greek[3]);

    ```


    The String array greek has three elements. Because the first element of an array
    is numbered 0 rather than 1, the first element is greek[0], the second greek[1],
    and the third greek[2]. This makes the statement attempting to display greek[3]
    erroneous. When you run the program, the Java Virtual Machine halts with a message
    such as


    # Output ▼


    ```

    Exception in thread "main" java.lang.ArrayIndexOutOfBoundsException: 3

    at SampleProgram.main(SampleProgram.java:4)

    ```


    This message indicates that the application has generated an exception, which
    the JVM noted by displaying an error message and stopping the program.


    The error message refers to a class ArrayIndexOutOfBoundsException in the java.lang
    package. This class is an exception, an object that represents an exceptional
    circumstance that has taken place in a program.


    Exception handling is a way that classes can communicate with each other in the
    event of an error or other unusual circumstance.


    When a Java class encounters an exception, it alerts all users of the class to
    the error. In this example, the user of the class is the JVM.


    # NOTE


    Two terms are used to describe this process: throw and catch. Objects throw exceptions
    to alert other objects that they have occurred. These exceptions are caught by
    other objects or the Java Virtual Machine.


    All exceptions are subclasses of Exception in the java.lang package. The ArrayIndexOutOfBoundsException
    does what you would expect—reports that an array element has been accessed outside
    the array''s boundaries.'
