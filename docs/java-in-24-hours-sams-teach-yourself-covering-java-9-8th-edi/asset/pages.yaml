  md: '# APPENDIX B

    Where to Go from Here: Java Resources


    After you have finished this book, you might be wondering where you can turn to
    improve your Java programming skills. This appendix lists some books, websites,
    Internet discussion sites, and other resources you can use to expand your Java
    knowledge.


    # Other Books to Consider


    Sams Publishing and other publishers offer several useful books on Java programming,
    including some that follow up on the material covered in this book. Use these
    ISBN numbers at bookstores if they don''t currently carry the book that you''re
    looking for:


    +   * Teach Yourself Java in 21 Days, by Rogers Cadenhead (me! me! me!)

    ISBN: 978-0-672-33795-6. Although some of the material in the first seven chapters
    of this book is redundant, it covers Java in more depth and adds lots of advanced
    topics. If you''re ready to make another 54-hour commitment to learning Java,
    this should be a suitable book.

    * Java Phrasebook, by Timothy R. Fisher. ISBN 0-67232-907-7. A collection of more
    than 100 snippets of code for use in your own Java projects, created by a professional
    programmer and Java Developer''s Journal contributor.

    * Agile Java Development with Spring, Hibernate and Eclipse by Anil Hemrajani.

    ISBN 0-672-32896-8. A book for Java Enterprise Edition that shows how to use the
    Spring framework, Hibernate library, and Eclipse IDE to reduce the complexity
    of enterprise application programming.

    * Java 9 for Programmers, 4th Edition by Paul and Harvey Deitel. ISBN 978-0-134-77756-6.
    An advanced exploration of Java 9 that includes expressions of lambda, the Java
    module system, animation, video, and database programming with JDBC and JPA.


    Other material from many Sams Publishing Java books have been made freely available
    on www.informat.com, a website for information technology professionals that is
    produced in collaboration with Sams.'
  merge: -1
