  md: '# HOUR 11

    describing What Your Object Is Like


    This Hour''s To-Do List:


    +   - Create variables for an object or class.

    - Use methods with objects and classes.

    - Call a method and return a value.

    - Create a constructor.

    - Send arguments to a method.

    - Use this to refer to an object.

    - Create new objects.


    As you learned during the past hour''s introduction to object-oriented programming
    (OOP), an object is a way of organizing a program so it has everything it needs
    to accomplish a task. Objects consist of attributes and behavior.


    Attributes are the information stored within an object. They can be variables
    such as integers, characters, and Boolean values, or objects such as String and
    Calendar objects. Behavior is the groups of statements used to handle specific
    jobs within the object. Each of these groups is called a method.


    Up to this point, you have been working with methods and variables of objects
    without knowing it. Anytime your statement had a period in it that wasn''t a decimal
    point or part of a string, an object was involved.


    # Creating Variables


    In this hour, you are looking at a sample class of objects called Gremlin whose
    sole purpose in life is to replicate themselves. A Gremlin has several different
    things it needs to do its work, and these are implemented as the behavior of the
    class. The information''s needed for the methods are stored as attributes.


    The attributes of an object represent variables needed for the object to function.
    These variables could be simple data types such as integers, characters, and floating-point
    numbers, or they could'
