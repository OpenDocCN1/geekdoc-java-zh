  md: '# What the main Statement Does


    The next line of the program is the following:


    ```

    public static void main(String[] arguments) {

    ```


    This line tells the computer, "The main part of the program begins here." Java
    programs are organized into different sections, so there needs to be a way to
    identify the part of a program that is executed when the first program is run.


    The main statement is the entry point to most Java programs. The exceptions are
    applets, programs that are run on a web page by a browser; servlets, programs
    run by a web server; and apps, programs run by a mobile device.


    Most programs you write during upcoming hours of this book use main as their starting
    point. That''s because you run them directly on your computer. Applets, apps,
    and servlets are run indirectly by another program or device.


    To differentiate them from these other types, the programs that you run directly
    are called applications.


    # Those Squiggles Bracket Marks


    In the Saluton program, Lines 3, 4, 6, and 7 contain a squiggly bracket mark of
    some kind—either a { or }. These brackets are a way to group lines of your program
    (in the same way that parentheses are used in sentence to group words). Everything
    between the opening bracket { and the closing bracket } is part of the same group.


    These groupings are called blocks. In Listing 2.1, the opening bracket on Line
    3 is associated with the closing bracket on Line 7, which makes your entire program
    a block. You use these brackets to show the beginning and end of a program.


    Blocks can be located inside other blocks (just as parentheses are used in this
    sentence (and a second set is used here)). The Saluton program has brackets on
    Line 4 and Line 6 that establish another block. This block begins with the main
    statement. The lines inside the main statement''s block will be run when the program
    begins.


    NetBeans can help you figure out where a block begins and ends. Click one of the
    brackets in the source code of the Saluton program. The bracket you clicked yellow
    along with its corresponding bracket. The Java statements enclosed within the
    two yellow brackets are a block. This tip is not useful on a short program like
    Saluton, but as you write much longer programs, it helps avoid looking like a
    headbeck.'
