  md: "# 142 HOUR 11: Describing What Your Object Is Like\n\nbe arrays or objects\
    \ of classes such as String or Calendar. You can use an object's variables throughout\
    \ its class, in any of the methods object contains. By convention, you create\
    \ variables immediately after the class statement that creates the class and before\
    \ any methods.\n\nOne of the things that a Gremlin object needs is a unique identifier\
    \ to set it apart from others of its kind (class).\n\nThe Gremlin object holds\
    \ this identifier in an integer variable called guid. The following statements\
    \ begin a class Gremlin with an attribute called guid and two other attributes:\n\
    \n```\npublic class Gremlin {\n    public int guid;\n    public String creator\
    \ = \"Chris Columbus\";\n    int maximumAge = 240;\n}\n```\n\nAll three variables\
    \ are attributes for the class: guid, maximumAge, and creator.\n\nPutting a statement\
    \ as public in a variable declaration statement it determines how other objects\
    \ from other classes can use that variable—or if they can use it at all.\n\nMaking\
    \ a variable public makes it possible to modify the variable from another program\
    \ by using the Gremlin object.\n\nIf the other program wants to assign another\
    \ creator, for instance, it can change creator to that value. The following statements\
    \ create a Gremlin object called gizmo and set its creator variable:\n\n```\n\
    Gremlin gizmo = new Gremlin();\ngizmo.creator = \"Joe Dante\";\n```\n\nIn the\
    \ Gremlin class, the creator variable is also public, so it can be changed freely\
    \ from other programs. The other variable, maximumAge, only can be used within\
    \ the class itself.\n\nWhen you make a variable public, the class loses control\
    \ over how that variable is used by other programs. In many cases, this might\
    \ not be a problem. For example, the creator can be changed to any name that identifies\
    \ the creator of the gremlin.\n\n+   * Switch the variable from public to protected\
    \ or private, two other statements that provide more restrictive access.\n\n+\
    \   * Add behavior to change the value of the variable and report the value of\
    \ the variable to other programs."
