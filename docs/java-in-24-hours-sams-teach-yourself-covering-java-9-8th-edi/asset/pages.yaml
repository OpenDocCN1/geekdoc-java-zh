  md: "# Separating Components with Insets\n\nAs you are arranging components within\
    \ a container, you can move components away from the edges of the container using\
    \ Insets, an object that represents the border area of a container.\n\nThe Insets\
    \ class, which is part of the java.awt package, has a constructor that takes four\
    \ arguments: the space to leave at the top, left, bottom, and right of the container.\
    \ Each argument is specified using pixels, the same unit of measure employed when\
    \ defining the size of a frame.\n\nThe following statement creates an Insets object:\n\
    \nInsets around = new Insets(10, 6, 10, 3);\n\nThe around object represents a\
    \ container border that is 10 pixels inside the top edge, 6 pixels inside the\
    \ left, 10 pixels inside the bottom, and 3 pixels inside the right.\n\nTo make\
    \ use of an Insets object in a container, you must override the container's getInsets()\
    \ method. This method has no arguments and returns an Insets object, as in the\
    \ following example:\n\n```\npublic Insets getInsets() {\n    Insets squeeze =\
    \ new Insets(50, 15, 10, 15);\n    return squeeze;\n}\n```\n\nFigure 18.5 shows\
