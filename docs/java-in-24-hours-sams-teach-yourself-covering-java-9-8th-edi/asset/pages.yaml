  md: '# HOUR 13

    Storing Objects in Data Structures


    This Hour''s To-Do List:


    +   - Create an array list.

    - Add and remove items from the list.

    - Use generics to improve list reliability.

    - Search a list for an object.

    - Loop through the contents of the list.

    - Create a hash map of keys and values.

    - Add and remove items from the map.

    - Retrieve a map entry''s key and value.

    - Loop through the keys and values of a map


    Programmers are hoarders.


    In computer programming, you spend a lot of time collecting information and looking
    for a place to store it. The information can come in the form of a primitive data
    type such as a float, or as an object of a particular class. It can be read from
    a drive, retrieved from a server, typed in a user, or gathered through other means.


    After you have the information, you must decide where to put it while a program
    is running in the Java Virtual Machine. Items that are related to each other by
    data type or class can be stored in an array.


    This is sufficient for many purposes, but as your programs grow in sophistication,
    your needs as a hoarder will increase.


    During this hour you learn about two classes in Java that are designed for information
    hoarders: array lists and hash maps.'
