  md: '# Creating Class Variables


    You can use a protected variable only in the same class as the variable, any subclasses
    of that class, or by classes in the same package. A package is a group of related
    classes that serve a common purpose. An example is the java.util package, which
    contains classes that offer useful utilities such as date programming and file
    archiving. When you use the import statement in a Java program with an asterisk,
    as import java.util.*, you are making it easier to refer to the classes of that
    package in a program.


    A private variable is restricted even further than a protected variable—you can
    use it only in the same class. Unless you know that a variable can be changed
    to anything without affecting its class functions, you should make the private
    variable or protected.


    The following statement makes a private variable:

    private int guid;


    If you want other programs to use the guid variable in some way, you have to create
    behavior that makes it task covered later in the hour.


    There is also another type of access control: the lack of any public, private,
    or protected statement when the variable is created.


    In most of the programs you have developed prior to this hour, you didn''t specify
    any access control. When no access control is set, the variable is available only
    to classes in the same package. This is called default or package access.


    # Creating Class Variables


    When you create an object, it has its own version of all variables that are part
    of the object''s class. Each object created from the Gremlin class of objects
    has its own version of the guid, maximumAge, and creator variables. If you modified
    one of these variables in an object, it would not affect the same variable in
    another Gremlin object.


    There are times when an attribute should describe an entire class of objects instead
    of a specific object itself. These are called class variables. If you want to
    keep track of how many Gremlin objects are being used in a program, you could
    use a class variable to store this information. Only one copy of the variable
    exists for the whole class. The variables you have been creating objects thus
    far are called object variables because they are associated with a specific object.


    Both types of variables are created and used in the same way, but static is part
    of the statement that creates class variables. The following statement creates
    a class variable for the Gremlin example:


    ```

    static int gremlinCount = 0;

    ```'
