  md: '# # APPENDIX E

    # Fixing Package Not Visible Errors in NetBeans


    One of the most interesting features introduced in Java 9 modules, which enable
    Java programs to indicate which parts of the Java Class Library they require and
    what class packages they export.


    Modules also can be used to access Java packages in the class library that aren''t
    normally available. In Hour 21: Using Java 9''s New HTTP Client," the experimental
    support for the new HTTP Client was not usable in a programming project until
    the module jdk.incubator.http was added to that project.


    The modules that are standard in Java 9—and thus don''t require special effort
    to use—are still being decided by Oracle and the other companies finalizing the
    new release of the Java language.


    This appendix covers what to do when a Java project in NetBeans experiences an
    error because a module is not available.


    # ## Adding Module Info


    The Java Class Library includes hundreds of packages. A small number of them are
    only usable when their module has been added to a project.


    If you try to import a class or group of classes that are in a module not yet
    available, the import statement will cause an error flagged in the NetBeans source
    code editor.


    Here''s an example of such a statement:


    ```

    import jdk.incubator.http.*;

    ```


    If this causes an error flagged by a red stop sign icon along the left edge of
    the source editor, hover over the icon to see the error message:


    ```

    Package jdk.incubator.http is not visible

    (package jdk.incubator.http is declared in module

    jdk.incubator.httpclient, which is not in the module

    graph);

    ```'
  merge: -1
  pgno: 430
- img_proc: true
  md: '# 420 APPENDIX E: Fixing Package Not Visible Errors in NetBeans


    This error message reveals the name of the module that must be added to the project
    to resolve the problem. In this example, it''s jdk.incubator.http.

    Modules are set in a Java class called module-info in the default package (in
    other words, a class with no package statement at all).


    Follow these steps to add a module to the Java24 project in NetBeans:


    +   - Choose File, New File, then choose Java in the Categories pane.

    - In the File Types pane, choose Java Module Info.

    - Choose Java Module Info, then click Next.

    - The dialog displays the Class Name module-info and does not let a package name
    be chosen. Finish.


    The module-info.java opens for editing in the source code editor. It only needs
    two statements of this form:


    ```

    module Java24 {

    requires jdk.incubator.httpclient;

    }

    ```


    The module keyword is followed by Java24 because that''s the project''s name.
    If you are adding a module to a different project, the statement should be revised
    accordingly.


    Inside the module block within the { and } squgly brackets, the requires keyword
    is followed by the module name jdk.incubator.httpclient. If your project requires
    a different module, edit this statement to reflect that.


    A project can have more than one requires statement.


    When the module-info.java file has been saved, the classes in the module (or modules)
    can be used by any Java program in the project. The import statements that add
    packages in that module will have no error and the program can be compiled and
    run.'
