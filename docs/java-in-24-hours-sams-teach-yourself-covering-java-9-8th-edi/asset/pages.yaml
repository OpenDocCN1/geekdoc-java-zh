  md: 'Designing a Real App


    385


    An emulator can do many of the things a real device can do, including connect
    to the Internet if the computer has an active connection. It can also receive
    fake phone calls and SMS messages, but making real calls and sending messages
    requires the real thing.


    Because it''s not a fully functional device, the apps that you develop must be
    tested on actual Android phones and tablets.


    If you can connect an Android phone (or other device) to your computer using a
    USB cord, you should be able to run the app if the phone is set to debugging mode.
    Apps developed with the Android SDK can only be deployed on a phone in this mode.


    On the phone, enter this mode by choosing Home, Settings, Applications, Development
    (or Home, Settings, Developer Options). The development settings are displayed.
    Choose the USB debugging option.


    Connect your Android phone to your computer with the USB cord. An Android bug
    icon should appear on the bar at the top of the phone''s screen. If you drag this
    bar, you should see the message "USB Debugging Connected." Next, in Android, follow
    these steps:


    +   1. Choose RunApp.


    +   2. Under Connected Devices, choose your phone.


    +   3. Click OK.


    The app runs on the phone as it did on the emulator.


    Like the first program you wrote in Java back in Hour 2, the first app you created
    on Android is exceptionally non-exceptional. The next project is more ambitious.


    Close this project by choosing the menu command File, Close Project.


    # Designing a Real App


    Android apps explore all of the device''s functionality, such as SMS messaging,
    location-based services, and touch input. In this book''s final programming project,
    you create a real app called Take Me to You Your Leader.


    This app takes advantage of an Android''s phone capabilities to make a phone call,
    visit a website, and load a location in Google Maps. The app puts you in touch
    with the White House via phone, Web, and maps. (If the president of the United
    States is not your leader, the app can be customized).


    To get started, create a new project in Android Studio by performing these steps:


    +   1. Choose Start a New Android Studio Project. (If you don''t see this, close
    the last project with the menu command File, Close Project.)'
