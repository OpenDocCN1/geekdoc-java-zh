    # CAUTION


    Resources are identified in an app using an ID formed from their filename with
    the extension

    removed. appicon.png has the ID icon, browser.png has the ID browser, and so on.
    No two

    resources can have the same ID (with the exception of the same graphic being stored
    at different

    resolutions in the mip folders, because they count as a single resource)


    If two resources have the same name without the extension, such as appicon.png
    and

    appicon.gif, Android Studio will flag the error and the app won''t compile.


    Resources also must have names that contain only lowercase letters, numbers, underscores
    (_), and

    periods (.). The files in this project follow these rules.


    Now that the project has a new icon, you can set it as the app''s icon. This will
    be handled by

    editing AndroidManifest.xml.


    # Configuring the App''s Manifest File


    The primary configuration tool in an Android app is a file AndroidManifest.xml
    in the

    app''s manifests folder. Double-click AndroidManifest.xml to open the XML file
    for editing.


    The icon field identifies the app''s icon, which currently has the incorrect value
    @mipmap/

