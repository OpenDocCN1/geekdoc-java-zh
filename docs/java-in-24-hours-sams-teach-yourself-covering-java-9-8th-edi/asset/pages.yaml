  md: '# HOUR 21

    Using Java 9’s New HTTP Client


    +   This Hour''s To-Do List:

    * Add a module to a Java project.

    * Create an HTTP web browser object.

    * Make a GET request of a web server.

    * Receive data from a web request.

    * Download an image file from the web.

    * Send data to a web server.


    Though they were created to present websites, web servers have grown far beyond
    the browser since the early days of the World Wide Web. The ability to communicate
    over HTTP has been exploited by many types of software, including RSS readers,
    web services, software upgraders, and operating systems.


    Java 9 introduces an HTTP Client library to make sending and receiving data over
    the web easier, faster, and more reliable.


    This library is not included automatically in the Java Class Library. Instead,
    it is added through an eagerly anticipated feature of the new language called
    modules.


    During this hour you''ll learn about modules and making web connections over HTTP.


    # Java Modules


    When Java programs are shipped, they are packaged into Java Archive (JAR) files
    with the class libraries used by the program. That JAR file and the other JAR
    files required by the project are all put on the Classpath accessed by the Java
    Virtual Machine (JVM) when it runs the program.


    Over time, the inefficiencies in this process have become apparent. There could
    be hundreds or even thousands of Java classes in the JAR, organized only by package.
    The same class could be in two different places on the Classpath, leading to confusion
    about which one is used during the program''s execution.'
