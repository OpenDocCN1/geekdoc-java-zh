  md: '# HOUR 23

    Creating Minecraft Mods with Java


    This Hour''s To-Do List:


    +   * Install a Minecraft server on your computer.

    * Write a script to start the server.

    * Set up NetBeans for Minecraft mod programming.

    * Create a framework for mods.

    * Design a mod that spawns a mob.

    * Make one mob the rider of another.

    * Find every mob in the game and attack it.

    * Write a mod that digs enormous scoops out of the world.


    This hour of the book covers something that has become a phenomenon in recent
    years.


    I have teenage sons who are avid gamers, and they all play the multiplayer building
    game Minecraft. Most of the cousins around their age play the game, too. When
    I tell any young person that I write books on Java programming, they all ask me
    the same question: Will it teach me how to create Minecraft mods?

    \Mods are extensions to the game that are designed and shared by players. The
    game Minecraft is written in Java, and mods must be programmed in the same language.


    Learning Java is the first step in creating Minecraft mods.


    This hour is the second.


    By the end of this hour, you will have your own Minecraft server downloaded, installed,
    and running on your computer. You will also be able to create mods in the Java
    language, deploy them on the server, and use them as you play the game.


    But be careful. There are creepers about.'
  merge: -1
