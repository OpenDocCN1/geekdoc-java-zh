  md: '# Assigning Variable Types


    When you are working with enormous numbers in Java, it can be difficult to see
    at a glance the value of the number, as in this statement:

    long salary = 264400000000L;


    Unless you count the zeros, you probably can''t tell that it''s $264.4 billion.
    Java makes it possible to organize large numbers with underscores ('''') characters.
    Here''s an example:

    long salary = 264_400_000_000L;


    The underscores are ignored, so the variable still equals the same value. They
    just make more human-readable.


    The capital "L" at the end of the number specifies it as a long value. If the
    "L" was omitted, the Java compiler would have assumed the number was an int and
    flagged an "Integer number too large" error.


    CAUTION


    If the use of underscores in a number is flagged as an error in the NetBeans source
    code editor, the IDE has been set up to an older version of Java. To correct this
    problem, in the Projects pane, right-click the name of the current project (likely
    Java24) and choose Properties. The Project Properties dialog opens with Sources
    chosen in the Categories pane. Check the Source/Binary Format drop-down to make
    sure it is the current version of Java.


    # The boolean Variable Type


    Java has a type of variable called boolean that can be used only to store the
    value true or the false value. At first glance, a boolean variable might not seem
    particularly useful unless you plan to write a lot of true-false quizzes. However,
    boolean variables are used in a variety of situations in your programs. The following
    are some examples of questions that boolean variables can be used to answer:


    +   - Has the user pressed a key?

    - Is the game over?

    - Is my bank account overdrawn?

    - Do these pants make my butt look fat?

    - Are these droids I''m looking for?


    Booleans are the place to hold the answer to yes/no and true/false questions.

    The following statement creates a boolean variable called gameOver:

    boolean gameOver = false;'
