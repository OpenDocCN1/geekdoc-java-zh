  md: '# HOUR 14

    Handling Errors in a Program


    This Hour''s To-Do List:


    +   - Learn why errors are called exceptions.

    - Respond to exceptions in your Java programs.

    - Create methods that ignore an exception.

    - Use methods that cause exceptions.

    - Create your own exceptions.


    Errors—the bugs, blunders, and typos that prevent a program from running correctly—are
    a natural part of the software development process. “Natural” is probably the
    kindest word that''s ever been used to describe them. In my own programming, when
    I can''t find the cause of an elusive error, I use words that would make an insult
    comic blush.


    Some errors are flagged by the compiler and prevent you from creating a class.
    Others are noted by the interpreter in response to a problem that keeps it from
    running successfully. Java divides errors into two categories:


    +   - Exceptions—Events that signal an unusual circumstance has taken place as
    a program runs

    - Errors—Events that signal the interpreter is having problems that might be unrelated
    to your program


    Errors normally aren''t anything a Java program can recover from, so they''re
    not the focus of this hour. You might have encountered an OutMemoryError as you
    worked on Java programs, which means the program got so big it ran out of memory
    on the computer. There''s nothing that can be done in a Java program to handle
    that kind of error after it occurs. The program exits with the error.


    Exceptions often can be dealt with in a way that keeps a program running properly.'
