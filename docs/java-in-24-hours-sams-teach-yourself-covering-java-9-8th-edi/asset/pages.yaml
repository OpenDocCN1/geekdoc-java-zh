    take up a

    lot of memory. Creating the 50 by 50 selectedPoint array was equivalent to creating
    2,500

    individual variables.


    # Sorting an Array


    When you have a bunch of similar items together into an array, one thing you can
    do

    is rearrange items. The following statements swap the values of two elements in
    an integer array

    called numbers:


    ```

    int[] numbers = { 3, 7, 9, 12, 5, 0, 8, 19 };

    int temporary = numbers[5];

    numbers[5] = numbers[6];

    numbers[6] = temporary;

    ```


    These statements result in numbers[5] and numbers[6] trading values with each
    other.

    The integer called temporary is used as a temporary storage place for one of the
    values

    being swapped. Sorting is the process of arranging a list of related items into
    a set order, such as

    when a list of numbers is sorted from lowest to highest.


    Santa Claus could use sorting to arrange the order of gift recipients by name
    with Willie

    Aames and Hank Aaron raking in his Yuletide plunder much earlier than alphabetical

    unfortunates Steve Zahn and Mark Zuckerberg.


    Sorting an array is easy in Java because the Arrays class does all the work. Arrays,
    which is

    part of the java.util group of classes, can rearrange arrays of all variable types.'
