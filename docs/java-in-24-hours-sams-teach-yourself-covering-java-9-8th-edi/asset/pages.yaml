  md: 'Instead of using probability to figure this out, the computer conducts drawings
    in rapid succession and doesn''t stop until there''s a winner. The 6-out-of-6
    win is extremely unlikely, the program also reports on any combination of three,
    four, or five winning numbers.


    The interface includes 12 text fields for lotto numbers and two check boxes labeled
    Quick Pick and Personal. Six text fields, disabled for input, are used to display
    the winning numbers of each drawing. The other six text fields are for the user''s
    choice of numbers. Selecting the Quick box chooses six random numbers for a user.
    Selecting the Personal box enables the user to select desired numbers.


    Three buttons control the activity of the program: Stop, Play, and Reset. When
    the Play button is pressed, the program starts a thread called playing and generates
    Lotto drawings.


    Pressing the Stop button stops the thread, and Reset clears all fields so the
    user can start over. Learn about threads in Hour 15, "Creating a Threaded Program."


    The LottoEvent class implements three interfaces: ActionListener, ItemListener,
    and Runnable. The Runnable interface relates to threads and was cleared in Hour
    15. The listeners are needed to listen to events generated by the application''s
    buttons and check boxes. The program does not need to listen to any events related
    to the text fields because they are used strictly to store the user''s choice
    of numbers. The user interface handles this storage automatically.


