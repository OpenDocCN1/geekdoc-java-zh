  md: "# Creating an Android App\n\nStrings and other resources are given a name and\
    \ a value, just like a variable in Java. There are three string resources represented\
    \ as XML data in the editing pane: app_name, dummy_button, and dummy_content.\n\
    \nThe names of resources follow three rules:\n\n+   - They must be all lowercase.\n\
    - They must have no spaces.\n- They must use only the underscore character (\"\
    _\") as punctuation.\n\nResources are stored in XML files. The Resources editor\
    \ is a simple XML editor. You can also directly edit the XML itself.\n\nHere's\
    \ strings.xml looks like at the moment:\n\n# Output\n\n```\n<resources>\n  <string\
    \ name=\"app_name\">SalutMondo</string>\n  <string name=\"dummy_button\">Dummy\
    \ Button</string>\n  <string name=\"dummy_content\">DUMMY\\nCONTENT</string>\n\
    </resources>\n```\n\nThis is a resources element with three string elements. Each\
    \ string element has a name attribute that holds its name. There's also text between\
    \ an opening <string> tag and a closing <string> tag that holds its value.\n\n\
    These serve the same purpose as variables: one dummy_content has the value \"\
    DUMMY\\nCONTENT.\"\n\nThis editor allows everything in the XML file to be edited,\
    \ even the markup tags. \"DUMMY\\nCONTENT\" to \"Salut Mondo!\"—but take care\
    \ not to change any of the surrounding characters. When you've made the change,\
    \ here's how the XML file should contain:\n\n# Output\n\n```\n<resources>\n  <string\
    \ name=\"app_name\">SalutMondo</string>\n  <string name=\"dummy_button\">Dummy\
    \ Button</string>\n  <string name=\"dummy_content\">Salut Mondo!</string>\n</resources>\n\
    ```\n\nClick the Save button in the Android Studio toolbar (or choose File, Save\
    \ All) to save your file strings.xml.\n\nWith that modification, you're almost\
    \ ready to run the app."
