  md: '# Pasting Strings Together


    When you use `System.out.println()` and work with strings in other ways, you can
    paste two strings together by using +, the same operator is used to add numbers.


    The + operator has a different meaning in relation to strings. Instead of performing
    some math, it pastes two strings together. This action can cause strings to be
    displayed together or make one big string out of two smaller ones.


    Linking two things together in a string is called *concatenation*.


    > NOTE

    You''ll probably see the term "concatenation" in other books as you build your
    programming skills, so it''s worth knowing. However, pasting is the term used
    here when one string and another are joined together. Pasting sounds like fun.
    Concatenating sounds like something that should never be done in the presence
    of an open flame.


    The following statement uses the + operator to display a long string:


    ```

    System.out.println("\Sharknado\ is an hour and half of your " + life that you''ll
    never get back.\And you won''t want to.\\n" + "-- David Hinckley, New York Daily
    News");

    ```


    Instead of putting this entire string on a single line, which would make it harder
    to understand when you look at the program later, you can use the + operator to
    break the two lines of the program''s Java source code. When this statement is
    displayed, it appears as the following:


    ```

    "Sharknado" is an hour and a half of your life you''ll never get back.

    And you don''t want to.

    -- David Hinckley, New York Daily News

    ```


    Several special characters are used in the string: `\", \n, and \t`. To better
    familiarize yourself with these characters, compare the output with the `System.out.println()`
    statement that produced it.


    # Using Other Variables with Strings


    Although you can use the + operator to paste two strings together, you use it
    more often to link strings and variables. Take a look at the following:


    ```

    int length = 86;

    char rating = ''R'';

    System.out.println("Running time: " + length + " minutes");

    System.out.println("Rated: " + rating);");

    ```'
