  md: "# The Ternary Operator\n\nThe most complicated conditional statement in Java\
    \ is the ternary operator ?.\nThe ternary operator assigns a value or displays\
    \ a value based on a condition. For example, consider a video game that sets the\
    \ numberOfemies variable to one of two values based on whether the skillLevel\
    \ variable is greater than 5. One way you can accomplish this is with an if-else\
    \ statement:\n\n```\nif (skillLevel > 5) {\n    numberOfEnemies = 20;\n} else\
    \ {\n    numberOfEnemies = 10;\n}\n```\n\nA shorter more complicated way to do\
    \ this is with the ternary operator. A ternary expression has five parts:\n\n\
    +   - The condition to test, surrounded by parentheses, as in (skillLevel > 5)\n\
    - A question mark (?)\n- The value to use if the condition is true\n- A colon\
    \ (:)\n- The value to use if the condition is false\n\nTo use the ternary operator\
    \ to set numberOfEnemies based on skillLevel, you could use the following statement:\n\
    int numberOfEnemies = (skillLevel > 5) ? 20 : 10;\n\nYou can also use the ternary\
    \ operator to determine what information to display. Consider the example of a\
    \ program that displays the \"Ms.\" or \"Mr.\" depending on the value of the gender\
    \ variable. Here's a statement that accomplishes this:\nString gender = \"female\"\
    ;\nSystem.out.print(gender.equals(\"female\") ? \"Ms.\" : \"Mr.\");\n\nThe ternary\
    \ operator can be useful, but it's also the hardest conditional in Java for beginners\
    \ to understand. As you learn Java, you don't encounter any situations where the\
    \ ternary operator must be used instead of if-else statements."
