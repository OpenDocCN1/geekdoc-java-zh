  md: "# Handling User Events\n\nWhen a user event is generated by a component that\
    \ has a listener, a method is called automatically. The method must be found in\
    \ the class specified when the listener was attached to the component.\n\nEach\
    \ listener has different methods that are called to receive their events. The\
    \ ActionListener interface sends events to a method called actionPerformed().\
    \ The following is a short example of an actionPerformed() method:\n\n```\npublic\
    \ void actionPerformed(ActionEvent event) {\n    // method goes here\n}\n```\n\
    \nAll action events sent in the program go to this method. If only one component\
    \ in a program can possibly send action events, you can put statements to handle\
    \ the event. If more than one component can send these events, you need to check\
    \ the object sent to the method.\n\nAn ActionEvent object is sent to the actionPerformed()\
    \ method. Several classes of objects represent the event that can be generated\
    \ in a program. These classes have methods to determine which component caused\
    \ the event to happen. In the actionPerformed() method, if the ActionEvent object\
    \ is named event, you can identify the component with the following statement:\n\
    \n```\nString cmd = event.getCommand();\n```\n\nThe getCommand() method sends\
    \ back a string. If the component is a button, the string is the label on the\
