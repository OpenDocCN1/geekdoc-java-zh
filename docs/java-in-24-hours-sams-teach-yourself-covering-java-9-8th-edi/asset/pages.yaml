  md: '# 34 HOUR 3: Vacationing in Java


    The app redraws the position of each tracked satellite as it runs and changes
    the orientation of the sky map based on the direction the user is facing. This
    kind of real-time update is possible because the Java language is multithreaded.
    Multithreading is a way for the computer to do more than one thing at the same
    time. One part of a program takes care of one task, another part takes care of
    a different task, and the two parts pay no attention to each other. Each part
    of a program in this example is called a thread.


    In a program such as ISS Detector, each satellite could run in its own thread.
    If you use an operating system such as Windows 10, you''re using a type of this
    behavior when you run more than one program at the same time. If you''re at work
    playing Minecraft in one window running a company sales report in another window
    and making a long-distance call to a friend, congratulate yourself—you''re multithreading!


