  md: '# NOTE


    This example works on a Windows system, which uses the backslash \ character as
    a separator in path and filenames. (There are two backslashes in this code examples
    because a backslash is a special character in Java.) Linux and Unix-based systems
    use a forward slash / character instead. To write a Java program that refers to
    a file in a way that works regardless of the operating system, use the class variable
    File.pathSeparator instead of a forward or backslash, as in this statement:


    ```

    File book = new File("data") + File.pathSeparator

    ```


    ```

    + "address.dat");

    ```


    Creating a File object doesn''t create a file on your computer. It''s just a reference
    to a file that may or not yet exist.


    When you have a File object, you can call several useful methods on that object:


    +   - exists()—If the file exists, false otherwise


    +   - getName()—The name of the file, as a String


    +   - length()—The size of the file, as a long value


    +   - createNewFile()—Creates a file of the same name, if one does not exist already


    +   - delete()—Delletes the file, if it exists


    +   - renameTo(File)—Renames the file, using the name of the File object specified
    as an argument


    You can use a File object to represent a folder on your system rather than a file.
    Specify the folder name in the File constructor, which can be absolute (such as
    C:\\Documents\) or relative (such as java\database).


    After you have an object representing a folder, call its listFiles() method to
    see what''s inside the folder. This method returns an array of File objects representing
    every file and subfolder it contains.


    # Reading Data from a Stream


    The first project of the hour is to read data from a file using an input stream.
    You can do this using the FileInputStream class, which represents input streams
    that are read as bytes from a file.


    You can create a file input stream by specifying a filename or a File object as
    the argument to the FileInputStream() constructor.'
