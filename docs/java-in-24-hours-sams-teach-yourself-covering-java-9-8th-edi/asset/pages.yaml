  md: '# 418 APPENDIX D: Fixing a Problem with the Android Studio Emulator


    computer before. Otherwise, you should recruit the help of someone else who is
    an expert and can guide you through the process.


    BIOS is the software that controls a Windows computer when you turn it on, taking
    care of booting the computer and other necessary hardware functions.


    While your computer is booting up, you briefly will see a message about hitting
    a function key to check your BIOS settings.


    If you don''t hit this key, BIOS completes its work and Windows loads.


    If you do hit the key, you will see a screen like the one in Figure D.4.


    Opening the folder


    Creating a folder


    Command Prompt


    ![](img/a0aae57357c3a6b5f086ebcfefa75a2f_429_0.png)


    FIGURE D.4 Looking at a computer''s BIOS settings.


    Your computer''s main menu for BIOS properly looks different than the one in Figure
    D.4. It varies depending on your computer manufacturer and the version of BIOS
    it uses.


    On my Dell desktop PC, I found out whether Intel Virtualization Technology was
    enabled by choosing BIOS Setup, Advanced, Processor Configuration. A list of processor
    settings was presented with "[Enabled]" or "[Disabled]" next to each one. These
    can be toggled from one setting to the other.


    If you enable Intel Virtualization Technology in BIOS and save the change, your
    computer should be able to run HXM and the emulator problem should be resolved.'
