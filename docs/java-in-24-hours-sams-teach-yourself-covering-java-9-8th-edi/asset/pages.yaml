    # Organizing Resources


    Creating an Android app requires Java programming, but a lot of the work is done
    in the Android Studio interface. When you are fully versed in the capabilities
    of the Android SDK, you can accomplish a great deal without writing a single line
    of Java code.


    One thing you do without programming creates resources that will be used by the
    app. Every new Android project starts with several folders where resources are
    placed. To see these, expand the Leader folder in the Package Explorer, and expand
    the /res folder and all its subfolders.


    Resources consist of graphics in the PNG, JPG, or GIF format; strings stored in
    a file called strings.xml; user interface files in XML format; and other files
    you can create. Two others are colors.xml for used in the app and styles.xml to
    define the appearance of interface components.


    The /res folder of a new project contains folders ic_launcher.png and ic_launcher_round.png
    that have different versions of the app''s icon. The icon''s small graphic to
    launch the app.


    The multiple versions of ic_launcher.png are the same graphic, sized for different-resolution
    displays. You won''t be using these icons. A new graphics file, appicon.png, will
    be added'
  merge: -1
