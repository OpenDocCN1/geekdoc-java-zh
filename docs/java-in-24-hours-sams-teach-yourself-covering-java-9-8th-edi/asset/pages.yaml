  md: '# Fixing Errors 405


    Return to Spartacus.java in the source editor and take the semicolon off the end
    of the

    line that calls System.out.println() (line 18 in Listing A.1). Even before you
    save the file,

    NetBeans spots the error and displays a red alert icon to the left of the line
    (see Figure A.5).


    ![](img/a0aae57357c3a6b5f086ebcfefa75a2f_416_0.png)


    FIGURE A.5

    Flagging errors in the source editor.


    Hover over the alert icon to see a dialog appear that describes the error NetBeans
    thinks it has spotted.

    The NetBeans source editor can identify most of the common programming errors
    and typos that

    it encounters when you write a Java program. The detection of an error stops the
    file from being

    compiled until the error has been fixed.


    Put the semicolon back at the end of the line. The alert icon disappears and you
    can save and

    run the class again.


    These basic features are all you need to create and compile the Java programs
    in this book.

    NetBeans is capable of a lot more than these features, but you should focus on
    learning Java

    diving too deeply into the IDE. Use NetBeans as if was just a simple programming

    project manager and text editor. Write classes, flag errors, and make sure you
    can compile and

    run each project successfully.


    When you''re ready to learn more about NetBeans, the Start page offers resources
    to learn how to

    it use. Oracle also offers training and documentation resources at https://netbeans.org/kb.'
