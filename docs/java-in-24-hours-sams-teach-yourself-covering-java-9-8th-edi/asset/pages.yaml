    Text areas have two methods that can be called to specify how the component behaves
    when a user types past the right edge of a line. Call the setLineWrap(boolean)
    method with an argument of true to cause text to wrap to the next line:

    comments.setLineWrap(true);


    To determine how text wraps to the next line, use the setWrapStyle(boolean) method.
    Call it with the argument true to wrap based on where a word ends, or false to
    wrap based on characters.


    If you don''t call these methods, text will not wrap. A user can keep entering
    text on the same line until hitting the Enter key, going past the right edge of
    the area.


    Text area components behave in ways you might not expect—they expand in size when
    the user reaches the bottom of the area and do not include scrollbars along the
    right edge or bottom edge. To implement them in a more well-behaved way, you must
    place the text area inside a container called a scroll pane.


    Components in a GUI are often bigger than the area available to display them.
    To enable a component to move from one part of the component to another, use vertical
    and horizontal scrollbars.


    In Swing, you support scrolling by adding a component to a scroll pane, a container
    that is represented by the JScrollPane class.


    You can create a scroll pane with the following constructors:


    +   * JScrollPane()Create a scroll pane with horizontal and vertical scrollbars
    that appear as needed.

    * JScrollPane(int, int)—Create a scroll pane with the specified vertical scrollbar
    and horizontal scrollbars.'
