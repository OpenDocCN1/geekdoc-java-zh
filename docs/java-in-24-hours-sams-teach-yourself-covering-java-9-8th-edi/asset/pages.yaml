  md: "# Using Arrays 113\n\nWhen you create an array with the new statement, you\
    \ must specify the number of elements. Each element of the array is given an initial\
    \ value that depends on the type of the array. All numeric arrays have the initial\
    \ value 0, char arrays equal '\\0', and boolean arrays have the value false. A\
    \ String array and all other objects are created with the initial value of null.\n\
    \nFor arrays that are not extremely large, you can set up their initial values\
    \ at the same time that you create them The following example creates an array\
    \ of strings and gives them initial values:\n\n```\nString[] reindeerNames = {\
    \ \"Dasher\", \"Dancer\", \"Prancer\", \"Vixen\", \"Comet\", \"Cupid\", \"Donner\"\
    , \"Blitzen\" };\n```\n\nThe information that should be stored in elements of\
