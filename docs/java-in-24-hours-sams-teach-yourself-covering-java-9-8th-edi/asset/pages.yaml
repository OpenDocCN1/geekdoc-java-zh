  md: '# Designing a User Interface


    An app''s graphical user interface consists of layouts, which are containers that
    hold widgets such as text fields, buttons, graphics, and custom widgets of your
    own design. Each screen displayed to a user can have one layout or multiple layouts
    contained within each other. There are layouts to stack components vertically
    or horizontally, organize them in a table, and other arrangements.


    An app can be as simple as a single screen or contain multiple screens. A game
    could be organized into these screens:


    +   - A splash screen that displays the game is loading

    - A main menu screen with buttons to view the other screens

    - A help screen explaining how to play

    - A scores screen that lists the highest player scores

    - A credits screen naming the game''s developers

    - A game screen for actual play


    The Leader app consists of a single screen, which holds buttons for contacting
    the president of the United States or a leader to be named.


    All of an app''s screens are kept in the /res/layout folder. This project has
    an activity_leader.xml file in this folder that''s designated as the screen to
    display when the app loads.


    To begin editing this screen''s layout, double-click activity_leader.xml in Package
    Explorer. The screen opens in the main Android Studio editing pane, as shown in
    Figure 24.7.


    ![](img/a0aae57357c3a6b5f086ebcfefa75a2f_399_0.png)


    FIGURE 24.7

    Editing an activity''s graphical user interface.'
