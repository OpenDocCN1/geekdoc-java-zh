  md: 'With OOP, a computer program is a group of objects that work together to get
    something done. Some simple programs might seem as though they consist of only
    one object: the class file. Even those programs are using other objects to get
    work done.


    # # Objects in Action


    Consider the program that displays a pie chart. A PieChart object could consist
    of the following:


    +   - Behavior to calculate the size of each pie slice

    - Behavior to draw the chart

    - An attribute to store the title of the chart


    It might seem odd to ask the PieChart object to draw itself because graphs don''t
    draw themselves in the real world. Objects in OOP work for themselves whenever
    possible. This capability makes it easier to incorporate them in other programs.
    If a PieChart object did not know how to draw itself, for instance, every time
    you used PieChart object in another program, you would have to create behavior
    to draw it.


    For another example of OOP, consider the autodialer program by Matthew Broderick''s
    character used in the classic hacker movie WarGames to find computers he could
    break into.


    # NOTE


    An autodialer is software that uses a device called a modem to dial a series of
    phone numbers in sequence. The purpose of such a program is to find other computers
    that answer the phone, so you can call them later to see what they are.


    Readers under 30 might find it hard to believe that computers used to make connections
    to each other via phone calls. You had to know a computer''s phone number to connect
    to it, and if it was already talking to another computer, you got a busy signal.


    Now I probably need to explain what a busy signal is.

    To quote the poet T.S. Eliot, "I grew old ... I grew old."


    Using an autodialer today today would attract the attention of your local phone
    company and law enforcement. Back in the 1980s, it was a good way to be rebellious
    without leaving the house. David Lightman (the character portrayed by Broderick)
    used his autodialer to look for a video game company''s private computer system
    so he could play the company''s new game before it was released. Instead, Lightman
    found a secret government computer that could play everything from chess to Global
    Thermonuclear War.'
