  md: '# HOUR 20

    Reading and Writing Files


    +   This Hour''s To-Do List:

    - Read bytes from a file into a program.

    - Create a new file on your computer.

    - Save an array of bytes to a file.

    - Make changes to the data stored in a file.


    There are numerous ways to represent data on a computer. You already have worked
    with one by creating objects. An object includes data in the form of variables
    and references to objects. It also includes methods that use the data to accomplish
    tasks.


    To work with other kinds of data, such as files on your hard drive and documents
    on a web server, you can use the classes of the java.io package. The "io" part
    of its name stands for "input/output" and the classes are used to access a source
    of data, such as a hard drive, DVD, or the computer''s memory.


    You can bring data into a program and send data out by using a communications
    system called streams, which are objects that take information from one place
    to another.


    # Streams


    To save data permanently within a Java program, or to retrieve that data later,
    you must use at least one stream.


    A stream is an object that takes information from one source and sends it somewhere
    else, taking its name from water streams that take fish, boats, and industrial
    pollutants from one place to another.


    Streams connect a diverse variety of sources, including computer programs, hard
    drives, Internet servers, computer memory, and thumb drives. After you learn how
    to work with one kind of data using streams, you can work with others in the same
    manner.


    During this hour, you use streams to read and write data stored in files on your
    computer.'
  merge: -1
  pgno: 302
- img_proc: true
  md: 'There are two kinds of streams:


    +   - Input streams, which read data from a source


    +   - Output streams, which write data to a source


    All input and output streams are made up of bytes, individual integers with values
    ranging from 0 to 255. You can use this format to represent data, such as executable
    programs, word-processing documents, and MP3 music files, but those are only a
    small sampling of what bytes can represent. A byte stream is used to read and
    write these kinds of data.


    # NOTE


    Java class files are stored as bytes in a form called bytecode. The Java Virtual
    Machine runs bytecode, which doesn''t actually have to be produced by the Java
    language. It can run compiled bytecode produced by other languages, including
    Scala, Groovy, and Jython. You also hear the JVM referred to as the bytecode interpreter.


    A more specialized way to work with data is in the form of characters—individual
    letters, numbers, punctuation, and the like. You can use a character stream when
    you are reading and writing a text source.


    Whether you work with a stream of bytes, characters, or other kinds of information,
    the overall process is the same:


    +   - Create a stream object associated with the data.


    +   - Call methods of the stream to either put information in the stream or take
    information out of it.


    +   - Close the stream by calling the object''s close() method.


    # Files


    In Java, files are represented by the File class, which is also part of the java.io
    package. Files can be read from hard drives, DVDs, and other storage devices.


    A File object can represent files that already exist or files you want to create.
    To create a File object, use the name of the file as the constructor, as in this
    example:


    ```

    File book = new File("address.dat");

    ```


    This creates an object for a filename address.dat in the current folder. You can
    also include a path in the filename:


    ```

    File book = new File("data\\address.dat");

    ```'
