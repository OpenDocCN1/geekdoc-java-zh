  md: "# 192 HOUR 14: Handling Errors in a Program\n\nargument that is not a number,\
    \ an error message is displayed. Because the exception is handled within the class,\
    \ the JVM does not display an error. You often can deal with problems related\
    \ to user input and other unexpected data by using try-catch blocks.\n\n# Catching\
    \ Several Different Exceptions\n\nA try-catch block can be used to handle several\
