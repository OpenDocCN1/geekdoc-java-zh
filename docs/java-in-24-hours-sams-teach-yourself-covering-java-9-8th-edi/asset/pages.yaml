  md: 'Methods that read or write files can fail with an IOException if there''s an
    error accessing the file. Many of the methods associated with reading and writing
    files generate this exception, so a try-catch block is often used. This exception
    belongs to the java.io package.


    Streams are one of the resources in Java that must be closed when they''re no
    longer being used. Leaving a stream open is a significant drain on resources in
    the JVM as a program runs.


    A special try statement called try-with-resources makes it easy to ensure that
    a resource, such as a file input, is closed when it''s no longer needed. The try
    statement is followed by parentheses. Inside the parentheses are one or more Java
    statements that declare variables that read or write data through a resource.


    Here''s an example that reads a file using a file input named stream:


    ```

    File cookie = new File("cookie.web

    ```


    Because stream is in the try statement, the stream is closed automatically when
    the try-catch block (if it hasn''t been closed).


    File input streams read data in bytes. You can read a single byte by calling the
    stream''s read() method without an argument. If no more bytes are available in
    the stream because you have reached the end of the file, a byte value of -1 is
    returned.


    When you read an input stream, it begins with the first byte in the stream, such
    as the first byte in a file. You can skip some bytes in a stream by calling its
    skip() method with one argument: an int representing the number of bytes to skip.
    The following statement skips 1,024 bytes in a stream scanData:

    scanData.skip(1024);


    If you want to read more than one byte at a time, do the following:


    +   - Create a byte array that is exactly the size of the number of bytes you
    want to read.


    +   - Call the stream''s read() method with that array as an argument. The array
    is filled with bytes from the stream.


    This first project reads ID3 data from an MP3 audio file. Because MP3 is such
    a popular format for music files, 128 bytes are often added to the end of an ID3
    file to hold information about the song, such as the title, artist, and album.'
