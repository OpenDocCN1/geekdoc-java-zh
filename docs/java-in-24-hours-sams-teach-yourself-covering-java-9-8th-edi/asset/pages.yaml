  md: '# HOUR 18

    Laying Out a User Interface


    This Hour''s To-Do List:


    +   - Create a layout manager.

    - Assign a layout manager to a container.

    - Use panels to organize components in an interface.

    - Work with unusual layouts.

    - Create a prototype for a Java application.


    When you begin designing graphical user interfaces (GUIs) for your Java programs,
    one obstacle you face is that your components can move around. Whenever a container
    changes size—such as when a user resizes a frame—the components it holds may rearrange
    themselves to fit its new dimensions.


    This fluidity works in your favor because it takes into account the differences
    in how interface components are displayed on different operating systems. A clickable
    button might look different in Windows than it does in Linux or Mac OS.


    Components are organized in an interface by using a set of classes called layout
    managers. These define how components are displayed within a container. Each container
    in an interface can have its own layout manager.


    # Using Layout Managers


    In Java, the placement of components within a container depends on the size of
    the component, the size of other components, and the height and width of the container.
    The layout of buttons, text fields, and other components can be affected by the
    following things:


    +   - The size of the container

    - The size of other components and containers

    - The layout manager'
