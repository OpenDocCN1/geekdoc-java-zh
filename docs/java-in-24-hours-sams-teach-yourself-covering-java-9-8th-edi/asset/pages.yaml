  md: '# Choosing a Language


    Android apps, and more, running on Windows, Mac, Linux, and other operating systems.
    This versatility is referenced by the ambitious early Java slogan “Write once,
    run anywhere.”


    # NOTE


    Early Java programmers had a less flattering slogan: “Write once, debug everywhere.”
    The language has come a long way, baby, since the first version was released in
    1996.


    Another important advantage is that Java requires a highly organized approach
    for getting programs to work. You must be particular about how you write programs
    and how they store alter data.


    When you start writing programs, you might not see the language''s persnicknety
    behavior as an advantage. You could try of writing a program and having several
    errors to fix before the program even be run. The benefit of this extra effort
    is that the software you create is reliable, useful, and error-free.


    In the coming hours, you will learn all of Java''s rules and the pitfalls to avoid.


    Java was invented by the Canadian computer scientist James Gosling as a better
    way to create computer programs. While working at Sun Microsystems in 1991, Gosling
    was unhappy with the C++ programming language was performing on a project, he
    created a new language that did the job better. It''s a matter of contentious
    debate whether Java is superior to other programming languages, course, but the
    success of the language demonstrates the strength of its initial design. Fifteen
    billion devices across the world are running Java, a number so amazing I''m going
    to repeat it. Fifteen billion! More than 1,000 books have been published about
    the language since its inception. (Fifteen is my tenth.)


    Regardless of whether Java is the best language'
  merge: -1
