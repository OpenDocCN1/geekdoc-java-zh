  md: '# Creating a New Project


    A NetBeans project consists of a set of related Java classes, files used by those
    classes, and Java class libraries. Each project has its own folder, which you
    can explore and modify outside NetBeans using text editors and other programming
    tools.


    To begin a new project, click the New Project button shown in Figure A.1 or choose
    the File, New Project menu command. The New Project Wizard opens, as shown in
    Figure A.2.


    ![](img/a0aae57357c3a6b5f086ebcfefa75a2f_412_0.png)


    FIGURE A.2

    The New Project Wizard.


    NetBeans can create several types of Java projects, but during this book you can
    focus on one type: Java Application.


    For your first project (and most of the projects in this book), choose the project
    type Java Application and click Next. The wizard asks you to choose a name and
    location for the project.


    The Project location field identifies the root folder of the programming projects
    you create with NetBeans. On Windows, this may be a subfolder of your My Documents
    (or Documents) folder named NetBeansProjects. All projects you create are stored
    inside this folder, each in its own subfolder.


    In the Project name field, enter Java24. The Create Main Class text boxes in response
    to the input, recommending java24.Java24 as the name of the main Java class in
    the project. Change this to Spartacus and click Finish, accepting all other defaults.
    NetBeans creates the project and its first class.'
  merge: -1
  pgno: 412
- img_proc: true
  md: '# Creating a New Java Class


    When NetBeans creates a new project, it sets up all the necessary files and folders
    and creates the main class. Figure A.3 shows the first class in your project,
    Spartacus.java, open in the source editor.


    ![](img/a0aae57357c3a6b5f086ebcfefa75a2f_413_0.png)


    FIGURE A.3

    The NetBeans source editor.


    Spartacus.java is a bare-bones class that consists only of a main() method. All
    the light gray lines in the class are comments that explain the purpose and function
    of the class. Comments are ignored when the class is run.


    To make the new class do something, add the following line of code on a new line
    below the comment // TODO code application logic here:

    System.out.println("I am Spartacus!");


    The method System.out.println() displays a string of text, in this case the sentence
    "I am Spartacus!"


    Make sure to enter this exactly as it appears. After you make sure you typed the
    line correctly and ended it with a semicolon, click the Save All toolbar button
    (or the menu command File, Save All) to save the class.'
  merge: -1
