    There''s also an equalsIgnoreCase() method that will make the comparison without
    regard to how the strings are capitalized. When favorite equals "chainsaw", another
    strong would be if it was "chainsaw", "Chainsaw", or "CHAINSAW".


    # Determining the Length of a String


    It can also be useful to determine the length of a string in characters. You do
    this with the length() method. This method works in the same fashion as the equals()
    method, except that only one string variable is involved. Look at the following
    example:


    ```

    String cinematographer = "Ben Demare";

    int nameLength = cinematographer.length();

    ```


    This example sets nameLength, an integer variable, equal to 11. The cinematographer
    length() method counts the number of characters in the string variable called
    cinematographer and stores this in the nameLength integer variable.


    # Copying a String with a New Case


    Because computers take everything literally, it''s easy to confuse them. Although
    a human would recognize the text Ian Ziering and the text IAN ZIERING refer to
    the same thing, most computers would disagree. The equals() method discussed previously
    in this hour would authoritatively that "Ian Ziering" is not equal to "IAN ZIERING".


    To get around these obstacles, Java has methods that take a string variable and
    create another that are all uppercase letters or lowercase letters, toUpperCase()
    and toLowerCase(), respectively. The following example shows the toUpperCase()
    method in action:


    ```

    String fin = "Ian Ziering";

    String change = fin.toUpperCase();

    ```


    This code sets the string variable change to the fin string variable converted
    to uppercase letters—“IAN ZIERING”. The toLowerCase() method works in the same
    fashion but returns an all-lowercase string value.


    Note that thetoUpperCase() method does not change the case of the string variable
    it is called on. In the preceding example, the fin variable is still equal to
    "Ian Ziering".


    # Looking for a String


    Another common task when handling strings is to see whether one string can be
    found inside another. To look inside a string, use the indexOf() method. Put the
    string you are looking for inside the parentheses. If the string is not found,
    indexOf() produces the value -1. If the string is found, indexOf() produces an
    integer that represents the position where the string begins.'
