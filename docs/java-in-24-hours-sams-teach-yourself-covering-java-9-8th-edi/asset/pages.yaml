  md: '# Drawing Lines and Shapes


    Drawing shapes such as lines and rectangles is as easy in a Java program as displaying
    text. All you need a Graphics2D object to define the drawing surface and objects
    that represent things to draw.


    The Graphics2D object has methods used to draw text with a command such as the
    following: comp2D.drawString("Draw, pardner!", 15, 40);


    This draws the text "Draw, pardner!" at the coordinates (15, 40). The (0, 0) coordinate
    is at the upper-left corner of the container, x values increase to the right,
    and y values increase as you go down. You can determine the maximum (x, y) value
    you can use in a frame or another container with the following statements:


    ```

    int maxSize = getSize().width;

    int maxYValue = getSize().height;

    ```


    With the exception of lines, shapes you can be filled or unfilled. A filled shape
    is drawn with the current color completely filling the space taken up by the shape.
    Unfilled shapes are drawn with a border with the current color.


    # Drawing Lines


    A 2D drawing of an object is created and represents the shape that is being drawn.


    The objects that define shapes belong to the java.awt.geom package of classes.


    The Line2D.Float line class creates a line connecting a beginning (x, y) point
    and an ending (x, y) point. The following statement creates a line from the point
    (40, 200) to the point (70, 130): Line2D.Float line = new Line2D.Float(40, 200F,
    70F, 130F);


    The arguments are followed by the letter F to indicate they are floating-point
    values. If this was omitted, Java would treat them as integers.


    > NOTE

    Line2D.Float has a period in the middle of its class name, which differs from
    most classes you''ve worked with. That''s because Float is a static inner class
    of the Line2D class, a subject covered in Hour 16, "Using Inner Classes and Closures."


    All shapes except for lines are drawn by calling a method of the Graphics2D class:
    draw( ) for outlines and fill() for filled shapes.'
