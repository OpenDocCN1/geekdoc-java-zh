    # Storing Objects of the Same Class in Array Lists


    An important decision to make when writing a computer program is where to store
    data. In the first half of this book, you''ve discovered three useful places to
    keep information:


    +   - Basic data types such as int and char (or their corresponding classes)


    +   - Arrays


    +   - String objects


    There are far more places to store information, because any java class can hold
    data. One of the most useful is ArrayList, a data structure that holds objects
    of the same class or a common superclass.


    As the name suggests, array lists are like arrays, which also hold elements of
    related data, but they can grow or shrink in size at any time.


    The ArrayList belongs to the java.util package of classes, one of the most useful
    in the Java Class Library. An import statement makes it available in your program:


    ```

    import java.util.ArrayList;

    ```


    An array list holds objects that either belong to the same class or share the
    same superclass. They are created by referencing two classes: the ArrayList class
    and the class it holds.


    The name of the class held by the list is placed within < and > characters, as
    in this statement: ArrayList<String> structure = new ArrayList<String>();'
