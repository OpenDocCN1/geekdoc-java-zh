  md: '# HOUR 9: Storing Information with Arrays


    An array is a group of related variables that share the same type. Any type of
    information that can be stored as a variable can become the items stored in an
    array. Arrays can be used to keep track of more sophisticated types of information
    than a single variable, but they are almost as easy to create and manipulate.


    # Creating Arrays


    Arrays are variables grouped together under a common name. The term array should
    be familiar to you—think of a saleswoman showing off her products or a game show
    with a dazzling array of prizes. Like variables, arrays are created by stating
    the type of variable organized into the array and the name of the array. A pair
    of square brackets [] follow the type to distinguish arrays from variables.


    You can create arrays for any type of information that can be stored as a variable.
    The following statement creates an array of string variables:


    ```

    String[] naughtyChild;

    ```


    Here are two statements that create arrays of integers and Boolean values, respectively:


    ```

    int[] reindeerWeight;

    boolean[] hostileTravelNations;

    ```


    > NOTE


    Java is flexible about where the square brackets are placed when an array is created.
    You can put them after the variable name instead of the variable type, as in the
    following:

    String niceChild[];


    To make arrays easier to spot in your programs (for humans), you should stick
    to one style rather than switching back and forth. Programs that use arrays in
    this book always place the brackets after the variable or object type.


    The previous examples create variables to hold arrays, but do not store any values
    in them. To do this, you can use the new keyword along with the variable type,
    or store values in the array within { } marks. When using new, you must specify
    how many different items are stored in the array. Each item in an array is called
    an element. The following statement creates an array and sets aside space for
    the values that it holds:


    ```

    int[] elfSeniority = new int[250];

    ```


    This example creates an array of integers called elfSeniority. The array has 250
    elements that can store the months that each of Santa''s elves has been employed
    at the Pole. (If Santa runs a union shop, this information is extremely important
    to track).'
