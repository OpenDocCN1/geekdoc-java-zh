    # Exceptions That Don''t Need catch


    Although this hour has shown that exceptions need to be caught with try-catch
    or declared to be thrown with a throws clause, there''s an exception.


    Some exceptions that might occur in a Java program don''t have to be handled in
    any way. The compiler won''t come to a screeching halt when it detects that the
    exception is ignored. These exceptions are called unchecked exceptions, while
    the others are checked exceptions.


    Unchecked exceptions are all subclasses of RuntimeException in the java package.
    A common example of an unchecked exception is IndexOutOfBoundsException, which
    indicates that the index used to access an array, string, or list is not within
    its boundaries. If an array has five elements and you attempt to read element
    number 10, this exception occurs.


    Another is NullPointerException, which occurs when an object has no value used.
    Object variables have the value null before they are assigned an object. Some
    methods return null when an object can be returned. If a statement incorrectly
    assumes an object has a value, a NullPointerException occurs.


    Both errors are things a programmer could (and should) prevent in the code, not
    things that require exception handling. If you write a program that accesses an
    out-of-bounds array element, fix the code that does this and recompile it. If
    you expect an object and it equals null, check for that with an if conditional
    before using the object.


    The rationale for unchecked exceptions in Java is that they either can be prevented
    by well-written code, or could occur so that catching them all the time would
    make programs unnecessarily complex. A NullPointerException could occur in every
    statement in a program where an object''s methods are called.


    Of course, just because an exception can be ignored doesn''t mean it should be.
    You still have the option of using try, catch, and throws with unchecked exceptions.


