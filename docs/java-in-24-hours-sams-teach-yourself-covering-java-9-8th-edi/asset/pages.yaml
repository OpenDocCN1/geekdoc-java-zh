  md: "# HOUR 17: Building a Simple User Interface\n\nA Path object represents the\
    \ location of a file or folder. The Paths class has a get (String) method that\
    \ converts a string to a path matching that string. When called with \" (an empty\
    \ string), it returns the path of the current folder in which the Java application\
    \ is running:\nPath current = Paths.get(\");\n\nStorage information for a disk\
    \ is represented in Java by a FileStore object, which is a storage pool. After\
    \ you have a path, you can get the file store where that path is located with\
    \ the Files class. Call the getStore (Path) method of Files to retrieve the file\
    \ storage pool:\n\nFileStore store = Files.getFileStore(current);\n\nWith this\
    \ pool, you can call its getTotalSpace() and getUsableSpace() methods to find\
    \ out how much disk space is available on the current disk:\n\n```\nlong totalSpace\
    \ = store.getTotalSpace();\nlong freeSpace = store.getUsableSpace();\ndouble percent\
    \ = (double)freeSpace / (double)totalSpace * 100;\n```\n\n> CAUTION\n\nThe expression\
    \ that calculates the percentage includes a lot of references to double, which\
    \ may seem weird. The second and third cast the freeSpace and totalSpace variables\
    \ to double values before they are used in the expression. This is necessary to\
    \ keep the expression from producing an integer value instead of a floating-point\
    \ number. Java determines the data type of an expression result by the types in\
    \ the expression. A long divided by a integer 100 would produce a long, not the\
    \ desired percentage.\n\nThe percentage calculated in the final statement may\
    \ be an extremely long number of digits after the decimal point, such as 64.8675309.\n\
    \nThe following expression converts a double percentage to no more than two decimal\
    \ places:\npercent = (int)percent * 100) / (double)100;\n\nThe first half of the\
    \ expression multiplies the percentage by 100—moving the decimal places to the\
    \ right—and then converts it to an integer, so 64.8675309 becomes 6486.\n\nThe\
    \ second half divides this by 100—moving the decimal back two places to the left—to\
    \ restore an approximation of the percentage. This makes 6486 into 64.86.\n\n\
    With a percentage limited to two decimal places, the label's text can be set to\
    \ report the available and occupied disk space:\n\n```\nspace.setText(freeSpace\
    \ + \" free out of \" + totalSpace + \" (\"\n      + percent + \"%%%\");\n```"
