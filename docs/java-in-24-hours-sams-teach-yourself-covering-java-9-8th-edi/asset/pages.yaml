  md: 'More than 300,000 apps have been created for Android phones and other devices
    that run the mobile operating system. You learn more about how to create them
    in Hour 24, “Writing Android Apps."


    # A Brief History of Java


    Bill Joy, one of the executives at Sun Microsystems when the company created Java,
    called the language "the end result of 15 years of work to produce a better, more
    reliable way to write computer programs." Java''s creation was a little more complicated
    than that.


    Java was developed in 1990 by James Gosling as a language that would serve as
    the brains for smart appliances (interactive TVs, omniscient ovens, time-traveling
    Terminators, SkyNet military satellites that enslave mankind, and so on). Gosling
    was unhappy with the results he getting by writing programs with a programming
    language C++. In a burst of inspiration, he holed up in his office and wrote a
    new language to suit his needs.


    Gosling named the new Oak after a tree he could see from his office window. The
    language was part of Gosling''s strategy to make a fortune when interactive TV
    became a multimillion-dollar industry. This still hasn''t happened today (though
    Amazon, Apple, Roku, and others are making a game attempt), but something completely
    different took place for Gosling''s new language. Just as Oak was about to be
    scrapped, the Web became popular.


    In a fortuit circumstance, many qualities that made Gosling''s language good on
    its appliance made it suitable for adaptation to the Web. His team devised a way
    for programs to run safely from web pages, and a catchy new name was chosen to
    accompany the language''s new purpose: Java.


    # NOTE


    You might have heard that Java is an acronym that stands for Just Another Vague
    Acronym. You might have heard that it was for Gosling''s love of coffee.


    The story behind Java''s naming contains no secret messages or declarations of
    liquid love. Java was chosen as the name for the same reason that the comedian
    Jerry Seinfeld likes to say the word salsa; it just sounds cool.


    Although Java can be used for many other things, the Web provided the original
    showcase it needed to seize the attention of the world''s software developers.
    When the language rose to prominence, you had to be in solitary confinement or
    a long-term orbital mission to avoid hearing about it.'
