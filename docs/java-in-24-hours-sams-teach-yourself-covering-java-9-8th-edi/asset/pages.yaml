    with a specific object, you don''t need to create an object solely for the purpose
    of using them. The use of the Integer.parseInt() method is an example of this
    because you don''t have to create a new Integer object just to convert a string
    to an int value.


    +   A. Oracle offers full documentation for all classes in the Java language,
    including all public methods you can use, on the Web at http://download.java.net/java/jdk9/docs/api/index.html.


    +   Q. Is there a way to control how much memory a Java program uses?


    +   A. The memory available to the Java Virtual Machine when it runs an application
    is controlled by two things: the physical memory available on the computer and
    the amount the JVM is configured to use. The default memory allocation is 256MB.
    A different amount can be set with the -Xmx command-line argument.


    To set this in NetBeans, choose Run, Set Project Configuration, Customize. The
    Project Properties dialog opens with the Run settings at the front. In the VM
    Options field, enter -Xmx1024M to allocate 1024MB of memory to the JVM. Alter
    that number for more or less memory. Fill out the Main Class and Arguments fields
    and run the program by choosing Run, Run Project.


