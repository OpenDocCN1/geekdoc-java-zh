  md: '# Summary


    Inner classes, anonymous inner classes, and lambda expressions are among the most
    complex parts of the Java language to learn. They appeal primarily to programmers
    who have been writing programs in the language for a while and can take advantage
    of powerful features to accomplish more in fewer lines of code.


    But before you reach a point where you''re writing your own lambda expressions,
    you should be able to benefit from the use of inner classes and anonymous inner
    classes.


    A non-anonymous inner class is structured like a separate helper class, but it''s
    placed inside another class alongside the instance variables, class variables,
    instance methods, and class methods. Unlike a helper class, it can access the
    private variables and methods of the class that it is created inside.


    An anonymous inner class removes the need to devote an object to a class that''s
    only used once, such as an event listener attached to a user interface component
    in Swing.


    Lambda expressions are deceptively similar in appearance, requiring only a new
    arrow operator -> to create. But the implications of what they enable a Java programmer
    to do are enormous. Programmers with experience in other languages have been clamoring
    for this functionality for years.


    # Workshop


    # Q&A. Anonymous inner classes are confusing. Do I have to use them in my programs?


    +   A. No. As with other complex features of the Java language, you don''t have
    to use them if you can get the job done some other way.

    But you should learn about them anyway, because you''re likely to encounter them
    in Java code.

    When you look at the Java programs written by experienced programmers, you often
    find both inner classes and anonymous inner classes. So even if you''re not ready
    to create them yourself, it''s worthwhile to learn what they are and how they
    work.


    +   Q. Are the Hatfields and Mcoys still feuding?


    +   A. The West Virginia and Kentucky families are on good 126 years after the
    last casualty in their infamous 35-year conflict.

    In 1979, Hatfields and Mcoys got together to play the TV game show Family Feud
    for a week. A pig was kept on stage and awarded to the winning family.

    In 2003, a formal peace treaty was reached between the families in Pikeville,
    KY.'
