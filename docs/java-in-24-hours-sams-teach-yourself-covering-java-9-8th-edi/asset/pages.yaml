    # Summary


    During this hour, you worked with input streams and output streams that wrote
    bytes, the simplest way to represent data over a stream.


    There are many classes in the java.io package to work with streams in other ways.
    There''s also a package of classes called java.net that enables you to read and
    write streams over an Internet connection.


    Byte streams can be adapted to many uses because you can easily convert bytes
    into other data types, such as integers, characters, and strings.


    The first project of this hour, the ID3Reader application, reads bytes from a
    stream and converted them into a string to read the ID3 data in this format from
    a song such as "Come On Gettitt" by Marion Black off the album Eccentric Soul.


    Have I mentioned yet that you should buy the song?


    # Workshop


    # Q&A


    +   - Q. Why do some of the byte stream methods in this hour use integers as arguments?
    Should they be using byte arguments?


    +   - A. There''s a difference between the bytes in a stream and the bytes represented
    by the bytes class. A byte in Java has a value ranging from -128 to 127, while
    a byte in a stream has a value from 0 to 255. You often have to use int when working
    with bytes for this reason—it can hold the values 128 to 255, whereas byte cannot.


    +   - Q. What is Mumblely-Peg?


    +   - A. It''s a schoolyard game played by children with pocketknives.'
