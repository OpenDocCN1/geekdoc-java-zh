  md: '+   4. Use the browser to send the request to a web server.


    +   5. Receive an HttpResponse object back.


    The browser is created using a factory method of the HttpClient class:


    ```

    HttpClient browser = HttpClient.newHttpClient();

    ```


    As you might expect, the browser''s job is to send the request to the server.


    The request is created with a builder class. The builder requires the web address
    of the server. The URI class in the java.net package represents an address (also
    called a URI or URL) and can be created like this:


    ```

    URI link = new URI("https://www.oracle.com/");

    ```


    If the web address specified as the only argument isn''t a properly formatted
    web address, a SyntaxException(from java.net) is thrown.


    With a URI object, you can call the factory method HttpRequest.newBuilder(URI)
    to create the builder:


    ```

    HttpRequest.Builder bob = HttpRequest.newBuilder(uri);

    ```


    The builder''s build() method creates the request, which is an object of the HttpClient
    class:


    ```

    HttpRequest request = bob.build();

    ```


    Now that you have a browser and a request, you can send it to the web server and
    get a response back. The response is an HttpResponse object that uses generics
    because it can receive information in multiple formats.


    The browser''s send() request takes two arguments:


    +   * An HttpRequest object.


    +   * A handler that sets the format of the response.


    The handler is created by calling a class method of the HttpResponse.BodyHandler
    class, as in this statement:


    ```

    HttpResponse<String> response = browser.send(request, HttpResponse.BodyHandler.asString());

    ```


    The generic reference in HttpResponse<String> defines the response as a string.
    The handler''s asString() method makes the call to the browser''s send() method
    to return a string.'
