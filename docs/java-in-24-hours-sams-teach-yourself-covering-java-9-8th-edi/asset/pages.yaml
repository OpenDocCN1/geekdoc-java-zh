  md: '# Array Lists


    In Hour 9, "Storing Information with Arrays," you were introduced to arrays, an
    extremely handy to work with groups of variables and objects in programs. Arrays
    are so essential to Java that they are a built-in data type like integers and
    characters. An array packages together elements of the same type or class.


    As useful as arrays can be, they are limited by the fact that the size of an array
    does not change. After an array is created to hold 90 elements, it can''t be altered
    to hold a larger or smaller amount. (The fancy way of saying this is to call the
    array''s size "immutable")


    There''s a class in the java.util package that does everything an array can do
    without that limitation: ArrayList.


    An array list is a data structure that holds objects of the same class or a common
    superclass. The list can grow or shrink as needed while a program is running.


    The simplest way to create an array list is by calling its constructor with no
    arguments:


    ```

    ArrayList servants = new ArrayList();

    ```


    Array lists can be created by specifying an initial capacity, which provides guidance
    on how many elements the list might hold. The capacity is set as an integer argument
    to the constructor, as in this statement that sets an array list''s capacity to
    30:


    ```

    ArrayList servants = new ArrayList(30);

    ```


    Although this looks lot like creating an array and determining its exact size,
    the capacity is just a hint. If the capacity is exceeded, the array list will
    be adjusted accordingly and continue to function properly. The better you estimate
    the capacity, the more efficient the list will be as the program runs.


    The list holds objects that belong to the same class or share superclass.


    When you create an array list, you know the class or superclass the list is intended
    to hold. This can be specified in the constructor < > signs, a feature of Java
    called generics. Here''s an improvement of the constructor for a list that holds
    String objects:


    ```

    ArrayList<String> servants = new ArrayList<String>();

    ```


    This statement creates an array list of String objects. Only that class or a superclass
    can be stored in the list. Otherwise, the compiler detects an error.


    To add an, call the array list''s add(Object) method with that object as the argument.
    Here are statements that add five strings:


    ```

    servants.add("Bates");

    servants.add("Anna");

    ```'
