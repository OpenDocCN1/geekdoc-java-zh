- img_proc: true
  md: 'This statement creates a speed potion of the maximum duration—the highest value
    an integer can hold in Java:


    ```

    PotionEffect = new PotionEffect(

    PotionType.SPEED,

    Integer.MAX_VALUE,

    10 + (coat * 10));

    ```


    The third argument to PotionEffect () sets the speed of the horse. It has a base
    value of 10 plus 10 times the random number used to determine the horse''s color.
    Because the colors in the switch-case statement are ordered from lightest to darkest,
    the formula 10 + (coat * 10) causes horses to run faster the darker their coloration.


    Now that the mod''s class is done, it needs a plug-in description file. Choose
    New File, select Other in the Categories pane, and create an empty file called
    plugin.yml in the src folder.


