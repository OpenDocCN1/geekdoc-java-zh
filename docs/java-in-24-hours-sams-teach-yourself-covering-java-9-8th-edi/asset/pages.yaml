  md: '# # Sams Teach Yourself Java TM EIGHTH EDITION in 24 Hours


    Computer programming with Java is easier than it looks. In 24 lessons of one hour
    or less, you can learn to write computer programs in Java.


    Using a straightforward, step-by-step approach, popular author Rogers Cadenhead
    helps you you need to create desktop and web programs, web services, an Android
    app, and even Minecraft mods in Java.


    Each lesson builds on what you''ve already learned, giving you a rock-solid foundation
    for real-world success.


    **Full-color figures** and step-by-step instructions visually show you how to
    program with Java.


    **Quizzes and Exercises** at the end of each chapter help you test your knowledge.


    **Notes, Tips, and Cautions** provide related information, advice, and warnings.


    **Rogers Cadenhead** is a writer, computer programmer, and web developer who has
    written 23 books on Java and Internet-related topics, including *Sams Teach Yourself
    Java in 21 Days*. He maintains the Drudge Retort and several other popular websites
    that receive more than seven million visits a year.


