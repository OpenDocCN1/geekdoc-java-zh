  md: '# Dedication


    For Roger Cadenhead, Sr. (1946–2016)


    ![](img/a0aae57357c3a6b5f086ebcfefa75a2f_8_0.png)


    My dad, pictured with me in 1970, loaned the Timex Sinclair 1000 on which I first
    attempted to program a computer at age 12. He never got it back:


    I learned several things as his first-born:


    +   1. When a train starts clanging and the arms come down, that means “hurry
    up and see if you can beat the train.”


    +   2. If your dad leaves you on an elevator, stay on the elevator. He’ll eventually
    figure out you’re gone and find you.


    +   3. When your dad says, “hold my beer while I try this,” step back at least
    10 feet for safety reasons.


    Dad was a microelectronic engineer, rock-ribbed Republican, ham radio operator
    K5PCS and half of the June 1980 father-son championship at the Hulen Mall Putt-Putt.
    You could start a conversation with him on the weather and find yourself an hour
    later in a discourse on the root causes of World War I. He was buried in Honey
    Grove, Texas, which he loved, beside the mother and grandmother who raised him.
    His death means that someone else is now the No. 1 critic of Texas Rangers general
    manager Jon Daniels.'
  merge: -1
