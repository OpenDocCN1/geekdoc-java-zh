  md: '# Teaching Zombies to Ride Horses


    A for loop that begins in Line 26 loops once for each zombie-horse pair.


    Their location is set by calling the Location() constructor with four arguments:
    the game world, x coordinate, y coordinate, and z coordinate.


    ```

    Location horseSpot = new Location(world,

    spot.getY() + (Math.random() * 15),

    spot.getY() + 20,

    spot.getY() + (Math.random() * 15);

    ```


    The player''s location in the spot variable is used to help pick a location for
    each zombie and horse for the x coordinate, the player''s getX() coordinate is
    retrieved and a random number from 0 to 14 is added. For the z coordinate, getZ()
    and a number from 0 to 14 are added. for the y coordinate, 20 is added.


    This means the mobs will appear 20 blocks above the player in the sky and 14 blocks
    in the other directions.


    Horses and zombies are created the same way as ocelots. Call the world''s spawn()
    method with the mob''s location and its class, which is Horse for horses and Zombie
    for zombies.


    Every mob that can be ridden in Minecraft has a setPassenger() method, which takes
    the rider as the only argument:

    orse.setPassenger(zombie);


    If you stopped here, the zombie would appear on the horse, but the horse would
    quickly buck it off. This can be prevented by making the player that horse''s
    owner:

    orse.setOwner(me);


    A tamed horse does not buck its rider, even if the rider is a zombie that hungers
    for human brains. When you create a mob, it inherits the default behavior of that
    mob from the game.


    Like ocelots, horses can be customized in several ways. One is to give the horse
    a different color coat by calling its setColor() method. There are seven possibilities.


    After a random number from 0 to 6 is generated, that number is used in a switch-case
    statement in Lines 38-59 to set that horse''s color.


    To make the horses a little crazy, you can customize their speed as well. The
    effects of a game potion can be applied to a mob. There are 22 different effects,
    which are indicated by the PotionType class.


    A potion effect is created by calling the PotionEffect constructor with three
    arguments: the effect type, the duration the potion should be in effect, and the
    value of that effect.'
