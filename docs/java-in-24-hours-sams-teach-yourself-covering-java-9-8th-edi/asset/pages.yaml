    # ComboBox


    A JComboBox is a pop-up list of choices that can also be set up to receive text
    input. When both options are enabled, you can select an item with your mouse or
    use the keyboard to enter text instead. The combo box serves a similar purpose
    to a group of check boxes, except that only one of the choices is visible unless
    the pop-up list is being displayed.


    To create a JComboBox object, you have to add each of the choices after creating
    the object, as in the following example:


    ```

    JComboBox profession = new JComboBox();

