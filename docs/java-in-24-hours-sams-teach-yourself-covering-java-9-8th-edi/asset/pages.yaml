    # # Compiling the Program into a Class File


    Before you can run a Java program, you must compile it. When you compile a program,
    the instructions given to the computer in the program are converted into a form
    the computer can understand better.


    NetBeans compiles programs automatically as they are saved. If you typed everything
    as shown in Listing 2.2, the program compiles successfully.


    A compiled version of the program, a new file Saluton.class, is created. All Java
    programs are compiled into class files, which are given the file extension .class.
    A Java program can be made of several classes that work together, but in a simple
    program only one class is needed.


    The compiler turns Java source code into bytecode, a form that can be run by the
    Java Virtual Machine (JVM).


    > NOTE

    The Java compiler speaks only when there''s an error to complain about. If you
    compile a program successfully without any errors, nothing happens in response.

    This is admittedly a bit anticlimactic. When I was starting out as a Java programmer,
    I was hoping successful compilation would be met with a grand flourish of celebratory
    horns.


    # # Fixing Errors


    As you compose a program in the NetBeans source editor, errors are flagged with
    a red alert icon to the left of the editor pane, as shown in Figure 2.2.'
