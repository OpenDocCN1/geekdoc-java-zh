  md: '# HOUR 11: Describing What Your Object Is Like


    The value of a class variable is no different than changing an object''s variables.
    If you have a Gremlin object called stripe, you could change the class variable
    gremlinCount with the following statement:


    ```

    stripe.gremlinCount++;

    ```


    Because class variables apply to an entire class, you can also use the name of
    the class instead:


    ```

    Gremlin.gremlinCount++;

    ```


    Both statements accomplish the same thing, but an advantage to using the name
    of the class when working with class variables is that it shows immediately that
    gremlinCount is a class variable instead of an object variable. If you always
    use object names when working with class variables, you can''t tell whether they
    are class or object variables without looking carefully at the source code.


    Class variables also are static variables.


    > CAUTION

    Although classes are useful, you must take care not to overreuse them. These variables
    exist for as long as the class is running. If a large array of objects is stored
    in class variables, it will take up a sizeable chunk of memory and never release
    it.


    # Creating Behavior with Methods


    Attributes are the way to keep track of information about a class of objects,
    but for a class to do the things it was created to, you must create behavior.
    Behavior describes the parts of a class that accomplish specific tasks. Each of
    these sections is called a method.


    You have been using methods throughout your programs up to this point without
    knowing it, including one in particular: println(). This method displays text
    onscreen. Like variables, methods are used in connection with an object or a class.
    The name of the object or class is followed by a period and the name of the method,
    as in object2.move() or integer.


    > NOTE

    System.out.println() method might seem confusing because it has two periods instead
    of one. This is because two classes are involved in the statement: the System
    class and the PrintStream class. The System class has a static variable called
    out that is a PrintStream object, println() is a method of the PrintStream class.
    The System.out.println() method of the instance variable of the System class.
    You can chain together references in this way.'
