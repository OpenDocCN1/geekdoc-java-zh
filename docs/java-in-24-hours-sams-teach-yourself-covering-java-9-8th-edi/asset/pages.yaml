    String array.


    +   C. Call the String() constructor with the array as an argument.


    +   2. What kind of stream is used to read from a file in a Java program?


    +   A. An input stream


    +   B. An output stream


    +   C. Either


    +   3. What method of the File class can be used to determine the size of a file?


    +   A. getSize()


    +   B. read()


    +   C. length()


    # Answers


    +   1. You can deal with each byte individually, as suggested in answer B, but
    you can easily create strings from other data types.


    +   2. An input stream is created from a File object or by providing a filename
    to the input stream''s constructor.


    +   3. This method returns a long, representing the number of bytes in the stream.'
