    # Summary


    During this hour, you got your first chance to create a Java program. You learned
    that in order to develop a Java program, you need to complete these four basic
    steps:


    +   1. Write the program with a text editor or a tool such as NetBeans.

    2. Compile the program into a class file.

    3. Tell the Java Virtual Machine to run the class.

    4. Call your mother.


    Along the way, you were introduced to some basic computer programming concepts
