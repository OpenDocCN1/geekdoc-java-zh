    # The BoxLayout Manager


    Another handy layout manager, BoxLayout in the javax.swing package, makes it possible
    to stack components in a single row horizontally or vertically.


    To employ this layout, create a panel to hold components, and then create a layout
    manager with two arguments:


    +   - The component to organize in box layout


    +   - The value BoxLayout.Y_AXIS for vertical alignment and BoxLayout.X_AXIS for
    horizontal alignment


    Here''s code to stack the Crisis components:


    ```

    JPanel pane = new JPanel();

    BoxLayout box = new BoxLayout(pane, BoxLayout.Y_AXIS);

    pane.setLayout(box);

    pane.add(panicButton);

    pane.add(dontPanicButton);

    pane.add(blameButton);

    pane.add(mediaButton);

    pane.add(saveButton);

    add(pane);

    ```


    Figure 18.4 shows how this turns out.'
