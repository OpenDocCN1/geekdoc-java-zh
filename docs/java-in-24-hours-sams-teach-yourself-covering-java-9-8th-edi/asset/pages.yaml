    # Incrementing and Decrementing a Variable


    A common task in programs is changing the value of a variable by one. You can
    increase the

    value by one, which is called incrementing the variable, or decrease the value
    by one, which is

    decrement the variable. There are operators to accomplish both tasks.


    To increment the value of a variable, use the ++ operator, as in the following
    statement:

    power++;


    This statement adds one to the value stored in the power variable.


    To decrement the value of a variable by one, use the -- operator:

    rating--;


    This statement reduces rating by one.


    You can also put the increment and decrement operators in front of the variable
    name, as in the

    following statements:

    ++power;

    --rating;


    Putting the operator in front of the variable name is called prefixing, and putting
    it after the

    name is called postfixing.


    > NOTE

    Confused yet? This is easier than it sounds, if you think back to elementary school
    when you

    learned about prefixes. Just as a prefix such as "sub-\ or "un-\ goes at the start
    of a word like sub-urban or unexpected, a prefix operator goes to the start of
    a variable name. A postfix operator goes

    at the end.


    The difference between prefixed and postfix operators becomes important when you
    use the

    increment and decrement operators inside an expression.'
