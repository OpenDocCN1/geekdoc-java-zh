  md: '# HOUR 18: Laying Out a User Interface


    There are several layout managers you can use to affect how components are shown.
    The default manager for panels is the FlowLayout class in the java.awt package,
    which was used during the previous hour.


    Under FlowLayout, components are dropped onto an area in the same way words are
    organized on a page in English—from left to right and down to the next line when
    there''s no more space.


    The following example could be used in a frame so that it employs flow layout
    when components are added:


    ```

    FlowLayout topLayout = new FlowLayout();

    setLayout(topLayout);

    ```


    You can also set up a layout manager to work within a specific container, such
    as a JPanel object. You can do this by using the setLayout() method of that container.


    The first project is Crisis, an application that has a GUI with five buttons.
    Create a new java file for a class named Crisis in the package com.java24hours.
    Enter the text from Listing 18.1 into the file and save the file.


