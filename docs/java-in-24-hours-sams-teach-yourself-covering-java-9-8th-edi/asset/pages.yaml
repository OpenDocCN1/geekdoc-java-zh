    \ If you give the count variable an initial value of 6 instead of 1, the text\
    \ would never be displayed.\n\n# do-while Loops\n\nThe do-while loop is similar\
    \ to the while loop, but the conditional test goes in a different place. The following\
    \ is an example of a do-while loop:\n\n```\nint gameLives = 0;\ndo {\n    // the\
    \ statements inside the loop go here\n} while (gameLives > 0);\n```\n\nLike the\
    \ while loop, this loop continues looping until the gameLives variable is no longer\
    \ greater than 0. The do-while loop is different because the conditional test\
    \ is conducted after the statements inside the loop, instead of before.\n\nWhen\
    \ the do loop is reached for the first time as a program runs, the statements\
