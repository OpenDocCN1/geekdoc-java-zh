  md: '# Setting Up a Minecraft Server


    To fix this problem, make sure the file spigot.jar is in the same folder as the
    file you ran to start the server (start-server.bat). Then try to start the server
    again.


    The second error displays the message “java” is not recognized as an internal
    or external command as in Figure 23.4.


    ![](img/a0aae57357c3a6b5f086ebcfefa75a2f_356_0.png)


    FIGURE 23.4

    The Java Virtual Machine (JVM) can''t be found.


    The JVM is in a file called java.exe, which is in the bin subfolder of the folder
    where Java is installed on your computer. When the java command is not recognized,
    this means the computer doesn''t know where to find java.exe.


    On a Windows system, this problem can be fixed by adding the name of the folder
    that contains java.exe to a Control Panel setting called the Path environmental
    variable.


    First, find your Java folder. Go to the top-level folder of your main hard drive,
    then open the Program Files or Files (x86) folder to see if either contains a
    Java subfolder. If you find not, open that folder.


    The Java folder may contain several versions of the Java Development Kit (JDK),
    each with a version number. On my computer, there are jdk1.8.0 and jdk-9 folders.
    The higher number contains the most current JDK.


    Open that folder, and then open its bin subfolder. There should be a couple dozen
    applications, including one called java.


    Your computer''s Path variable needs to be updated to include the full name of
    this folder, which is something like C:\Program Files\jdk-9\bin (with your own
    JDK version number).


    To add the JVM to the Path, perform these steps:


    +   1. Open the Control Panel on the Start Menu or by typing it in the search
    box.

    2. Choose System, and then choose Advanced System Settings. The Advanced dialog
    opens.'
