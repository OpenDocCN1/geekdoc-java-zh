  md: '# HOUR 20: Reading and Writing Files


    In the simplest form, players stand and throw their own knives at their feet.
    The one whose knife lands closest wins. Other versions involve throwing the knife
    at each other so the opponent has to stretch a foot to where it lands. The player
    who stretches too far and falls opponent does loses.


    The name comes from a rule that the winner could pound a peg into the ground with
    three blows of the knife. The loser had to “mumble the peg,” removing solely with
    his teeth.


    The game faded from popularity in the early 20th century when the world reached
    the collective realization that children throwing knives at each other might not
    be the greatest idea in the world.


    # Quiz


    To see whether you took a big enough byte from the tree of knowledge during this
