  md: '# Hash Maps


    NOTE


    in the shoot() method of the Battlepoint application, the Point object that will
    be removed from the array list is the one that represents the shot. This has the
    same (x,y) coordinates as the target that was hit.


    The ability to use one piece of information to access another is common in programming.
    An array list is the simplest example of this among the data structures, where
    an index number is used to retrieve one object from the list. Here''s an example
    that pulls the first string from the aristocrats array list:


    ```

    String first = aristocrats.get(0);

    ```


    Arrays also use index numbers to retrieve each item in the array.


    Hash maps are a data structure in Java that use an object to retrieve another
    object. The first object is the key and the second is the value. This structure
    is implemented as the HashMap class in the java.util package.


    The name refers to how keys are mapped to values. An example of this kind of structured
    data is a phone contact list. A person''s name (string) can be used to retrieve
    the person''s phone number.


    A hash map can be created by calling its constructor with no arguments:


    ```

    HashMap phonebook = new HashMap();

    ```


    Two things can be specified in a new hash map that control how efficient it is:
    the initial capacity and the load factor. These are set with two arguments, the
    first being capacity and the second load factor second:


    ```

    HashMap phonebook = new HashMap(30, 0.7F);

    ```


    The capacity is the number of buckets in which hash map values can be stored.
    The load factor is the number of buckets that can be used before the capacity
    automatically is increased. The value is a floating-point number ranging from
    0 to 1 (full), so a 0.7 means that the buckets are 70 percent full, the capacity
    increases. The defaults are a capacity of 16 and load factor of .75, which are
    sufficient.


    Generics should be used to indicate the classes of the keys and values. They are
    placed within < and > the class names separated by a comma, in this example:


    ```

    HashMap<String, Long> phonebook = new HashMap<>();

    ```


    This creates a hash map called phonebook with keys that are strings and values
    that are Long. The second set of < and > is empty, which assumes the same classes
    as those in the previous < and > in the statement.'
