  md: '# Creating Your First Mod


    The name of the program is SiameseCat.


    The argument inside the method call, label.equalsIgnoreCase("siamesecat"), is
    the command the user will type in the game to run the mod. So program implements
    the command /siamesecat (commands are preceded by a slash / character). The label
    object, which is sent as an argument to onCommand(), is a string that holds the
    text of a command entered by the user.


    The statement that calls log.info() with the message "[SiameseCat] Meow! sends
    a message that is displayed in the Minecraft server.


    The Logger object created as an instance variable sends messages to the server.


    The sender object is another argument sent to the onCommand() method. It represents
    the entity in Minecraft that entered that command. Checking to make sure that
    sender is an instance of the Player class verifies that the player issued that
    command.


    Everything a mod does when its command is entered goes at the spot marked by the
    comment // do something here.


    The first thing the SiameseCat mod needs to learn more about the game world, using
    these three statements:


    ```

    Player me = (Player) sender;

    Location spot = me.getLocation();

    World world = me.getWorld();

    ```


    An object called me is created by casting the sender object to the Player class.
    This is the character controlled by the person playing the game.


    With this Player object, you can call its getLocation() method to learn the exact
    spot where the player is standing. This spot is represented by the Location class.
    Three things you can learn about a location are (x,y,z) coordinates on the three-dimensional
    game map.


    The Player object also has a getWorld() that returns a World object representing
    the entire game.


    Most of the mods you create need these Player, Location, and World objects.


    This mod creates a new mob that''s a Siamese cat, using the spawn() method of
    the World class:

    Ocelot cat = world.spawn(spot, Ocelot.class);


    There''s a class for every type of mob in the game. The two arguments to spawn()
    are the location where the cat should be placed and the class of the mob to create.


    This statement creates an Ocelot named cat at the same spot as the player.'
