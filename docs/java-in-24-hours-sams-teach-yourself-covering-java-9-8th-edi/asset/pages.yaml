  md: '# HOUR 16

    Using Inner Classes and Closures


    This Hour''s To-Do List:


    +   - Add an inner class to an object.

    - Explore why inner classes are useful.

    - Create an anonymous inner class.

    - Use an adapter class with interfaces.

    - Write a lambda expression.

    - Replace an anonymous inner class with a lambda expression.


    When it was launched in 1995, the Java programming language was limited in scope
    and simple to master. There were only around 250 classes in the Java Class Library.
    The language was designed primarily so that interactive programs called applets
    could be run inside web browsers. Because no other technology had been introduced
    to do that, Java made an enormous splash and was quickly embraced by hundreds
    of thousands of programmers.


    As a testament to how well the language was designed, it expanded beyond that
    one focus and became a general-purpose programming language to rival C++, which
    at the time was the most popular and widely implemented language on the planet.


    Millions of programmers write in Java today as the language turns 23. With each
    new release, Java has supported its existing developers while expanding its capabilities
    to enable sophisticated new methodologies of software development.


    One of the most exciting is a new way to write code called closures, or lambda
    expressions. These expressions make possible a methodology called functional programming.


    During this hour, you learn about lambda expressions after covering two aspects
    of the language that are prerequisites to using them: inner classes and anonymous
    inner classes.'
