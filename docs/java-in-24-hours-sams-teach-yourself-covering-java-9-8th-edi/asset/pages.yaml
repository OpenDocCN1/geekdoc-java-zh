    # The Java Class Library


    This book covers how to use the Java language to create your own programs from
    scratch. You learn all the keywords and operators that form the language and then
    put them to work writing statements that make a computer do interesting and useful
    things.


    Although this approach is the best way to learn Java, it''s a bit like showing
    someone how to build a car by making her build every part of the car from scratch
    first.


    A lot of work is already done for you a Java programmer, provided you know where
    to look for it.


    Java comes with an enormous collection of code that you can utilize in your programs
    called the Java Class Library. This library is a collection of thousands of classes,
    many of which can be used in the programs that you write.


    NOTE


    There are many class libraries provided by other companies and organizations.
    The Apache Project, the creators of the Apache web server, has more than a dozen
    Java open source projects. One is Tomcat, a set of classes for creating a web
    server that can run web applications implemented as Java servlets.


    For more information on the project, visit http://tomcat.apache.org. To see all
    of Apache’s Java projects, visit https://projects.apache.org.


    The classes can be put to work in your programs in a manner somewhat similar to
    using a variable.


    A class is used to create an object, which is like a variable but far more sophisticated.
    An object can hold data, like a variable does, and also perform tasks, like a
    program.


    Oracle offers comprehensive documentation for the Java Class Library on the Web
    at http:// download.java.net/jdk9/docs/api. This page is shown in Figure 4.3.'
