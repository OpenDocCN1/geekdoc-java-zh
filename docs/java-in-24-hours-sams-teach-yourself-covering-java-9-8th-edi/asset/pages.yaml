    At the top is the Object class. InputStreamReader has two superclasses above it
    in the hierarchy: Reader, and Object. It has one subclass below it in the hierarchy:
    FileReader.

    The InputStreamReader class inherits attributes and behavior from the Reader and
    Object classes because it is directly above it in the hierarchy of superclasses.
    InputStreamReader does not inherit anything from the orange classes in Figure
    12.1, BufferedReader, UrlReader, and LineNumber, because they are not above it
    in the hierarchy.


    If this seems confusing, think of the hierarchy as a family tree. InputStreamReader
    inherits from its parent and onward. The InputStreamReader class doesn''t inherit
    from its siblings or its cousins, however.


    Creating a new class blows down to the following task: You only must define the
    ways in which it is different from an existing class. The rest of the work is
    done for you.


    # Inheriting Behavior and Attributes


    The behavior and attributes of a class are a combination of two things: its own
    behavior and attributes and all the behavior and attributes it inherits from its
    superclasses.


