    # Connecting to the Server


    Because you want to make Minecraft mods, you presumably already have a Minecraft
    client on your computer that you use to play the game. If not, you can buy and
    download the game from the website minecraft.net. The current price is $26.95.
    There are versions of the game for Windows, Mac OS, videogame consoles, and mobile
    devices, but mod programming requires the version for Windows or Mac.


    Start Minecraft and choose Multiplayer. You should see your new server as one
    of the options (Figure 23.5).


    The server is called "Minecraft Server" (you can change this to something cooler
    later). The client will send a ping message to the server and report back the
    speed, which is displayed as a set of green connection bars (as shown in Figure
    23.5).


    These green bars mean you are ready to connect. If you see them (by clicking it)
    and click the Join Server button. Now you have a new Minecraft world running on
    your own server. Proceed to the section "Creating Your First Mod."


    When the client can''t connect to the server, a red X is displayed instead of
    green connection bars. The next section describes how to troubleshoot this issue.'
