  md: '# HOUR 9

    Storing Information with Arrays


    This Hour''s To-Do List:


    +   - Create an array.

    - Set the size of an array.

    - Store a value in an array element.

    - Change the information in an array.

    - Make multidimensional arrays.

    - Sort an array.


    No one benefited more from the development of the computer than Santa Claus. For
    centuries, humankind has put an immense burden on him to gather and process information.
    Old St. Nick has to keep track of the following things:


    +   - Naughty children

    - Nice children

    - Gift requests

    - Homes with impassable chimneys

    - Women who want more from Santa than Mrs. Claus will let him give

    - Countries that shoot unidentified aircraft first and ask questions later


    Computers were a great boon to the North Pole. They are ideal for the storage,
    categorization, and study of information.


    The most basic way that information is stored in a computer program is by putting
    it into a variable. So far, all variables you''ve worked with have been a single
    item of information, such as a floating-point number or a string.


    Santa''s list of nice children is an example of a larger collection of similar
    information. To keep track of a list of this kind, you can use arrays.'
