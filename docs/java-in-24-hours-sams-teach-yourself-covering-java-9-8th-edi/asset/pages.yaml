    # Using Special Characters in Strings


    When a string is being created or displayed, its text must be enclosed within
    double quotation marks. These quotation marks are not displayed, which raises
    a question: What if you want to display a double quotation mark?


    To display that character, Java has a special code that can be put into a string:
    \". Whenever this code is encountered in a string, it is replaced with a double
    quotation mark. For example, examine the following:


    ```

    System.out.println("Anthony Ferrante directed \"Sharknado\\\.");

    ```


    This code is displayed as the following:


    Anthony Ferrante directed "Sharknado".


    You can insert other special characters into a string in this manner. The following
    list shows these special characters; note that each is preceded by a backslash
    (\).


    | Special Characters | Display |

    |---|---|

    | \ | Single quotation mark |

    | \" | Double quotation mark |

    | \ | Backslash |

    | \t | Tab |

    | \b | Backspace |

    | \r | Carriage return |

    | \f | Formfeed |

    | \n | Newline |


    The newline character causes the text following that character to be displayed
    at the beginning of the next line. Look at this example:


    ```

    System.out.println("Script by\nThunder Levin");

    ```


    This statement would be displayed like this:


    Script by

    Thunder Levin'
