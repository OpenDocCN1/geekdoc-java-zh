  md: '# APPENDIX B: Where to Go from: Java Resources


    The Sams Publishing website, www.informit.com/sams, is a good place to see what''s
    coming from Sams Publishing and other imprints of the Pearson Technology Group.


    # Oracle''s Official Java Site


    The Java software division of Oracle maintains three websites of interest to programmers
    and users of its language.


    The Oracle Technology Network for Java Developers, which is published at www.oracle.com/technetwork/java,
    is the first place to visit when looking for Java-related information. New versions
    of the Java Development Kit and other programming resources are available for
    download, along with documentation for the entire Java class library. There''s
    also a bug database, a directory of local face-to-face user groups, and support
    forums.


    Java.com at www.java.com promotes the benefits of the language to consumers and
    non-programmers. You can download the Java runtime environment from the site,
    which enables users to run programs created with Java on their computers. There''s
    also a help section for running Java and addressing security concerns.


    Planet NetBeans at www.planetbeans.org is a collection of several dozen blogs
    that cover Java programming with the NetBeans IDE. The latest posts from the blogs
    appear on the site and you can subscribe to their RSS feeds in a reader such as
    Feedly.


    # Java Class Documentation


    Perhaps the most useful part of Oracle''s Java site is the documentation for every
    class, variable, and method in the Java class library. Thousands of pages are
    available online at no cost to show you how to use the classes in your programs.


    To visit the class documentation for Java 9, go to http://download.java.net/jdk9/docs/api.


    # Other Java Websites


    Because so much of the Java phenomenon was originally inspired by its use on web
    pages, a large number of websites focus on Java and Java programming.


    # This Book''s Official Site


    This book''s official website is www.java24hours.com and is described fully in
    Appendix C, "This Book''s Website."'
  merge: -1
  pgno: 419
- img_proc: true
  md: '# Workbench


    I also publish a weblog, Workbench, which covers Java, Internet technology, computer
    books, and similar topics along with other subjects. You can find it at http://workbench.cadenhead.org.


    # Slashdot


    The technology news site Slashdot has been a go-to place for programmers and other
    computer industry professionals since 1997. The site selects the best user-submitted
    stories for its front page and allows users to rank comments so you can filter
    out the noise. To see its latest Java-related stories, visit www.slashdot.org/tag/java.


    # Other Java Weblogs


    Hundreds of other weblogs cover Java programming, either as their primary focus
    or part of diverse subject matter.


    WordPress.Com, a host for thousands of blogs, categorizes the latest Java-related
    posts on sites at https://en.wordpress.com/tag/java.


    # InformIT


    The tech reference site InformIT, available at www.informit.com, is a comprehensive
    resource supported by the publisher of this book. The site devotions to several
    dozen subjects related to software development and the Internet. InformIT''s Java
    section includes how-to-articles and a beginner''s reference. Visit www.informit.com/topics/topic.aspx?st=66497
    to access it directly.


    # Stack Overflow


    The online community Stack Overflow is a place where programmers can ask questions
    and rate the answers provided by other users. The site is tagged so you can narrow
    your search to the language or topic of interest. To see Java-related questions,
    visit https://stackoverflow.com/questions/tagged/java.


    # JavaWorld Magazine


    A magazine that has been around since the inception of the language in the 1990s,
    JavaWorld, publishes frequent tutorial articles along with Java development news
    and other features. Also are video and audio podcasts. Visit www.javaworld.com.'
  merge: -1
  pgno: 420
- img_proc: true
  md: '# Developer.com''s Java Directory


    Because Java is an object-oriented language, it''s easy to use resources created
    by other developers in your programs. Before you start a Java project of any significance,
    you should scan the Web for resources you might be able to use in your program.


    A good place to start is Developer.com''s Java directory. This site catalogs Java
    programs, programming resources, and other information at www.developer.com/java.


    # Java Meetings


    The website Meetup.com contains thousands of meetings of formal and informal groups
    shared on the site by users seeking to attend.


    Many Java users groups and other Java events are announced on the site. To find
    a meetup within 100 miles of your location, visit www.meetup.com/find?keywords=Java&radius=100.


    In my region of Florida, there are regularly held meetings of Java user''s groups,
    and social gatherings over coffee.


    # Job Opportunities


    If you''re one of those folks learning Java as a part of your plan to become a
    captain of industry, several of the resources listed in this appendix have a section
    devoted to job opportunities.


    Check out some of the Java-related job openings that might be available.


    The job posting searching engine Indeed has a section devoted to Java jobs. Visit
    www.indeed.com/q-java-jobs.html to see the latest help-wanted ads for programmers
    proficient in the language. Another job site for Java programmers is Dice, which
    lists Java employment postings at www.dice.com/jobs=java.


    Although it isn''t specifically a Java employment resource, the CareerBuilder
    website enables you to search the job classified of more than two dozen databases,
    including newspaper classified and many other sources. You can search more than
    100,000 job postings using keywords such as Java, Internet, or snake charm. Go
    to www.careerbuilder.com.


    If you get a job in Java programming after reading this book, I''d love to hear
    about it. Come to the book''s website and use the Feedback link to contact me,
    or send a message on Twitter @rcade.'
  merge: -1
