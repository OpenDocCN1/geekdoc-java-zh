  md: 'The classes that make up the Java language extensively use inheritance, so
    understanding it is essential. You learn more about the subject during Hour 12,
    "Making the Most of Existing Objects."


    # Converting Objects and Simple Variables


    One of the most common tasks you need to accomplish in Java is to convert information
    from one form into another. Several types of conversions you can do include:


    +   - Converting an object into another object

    - Converting a simple variable into another type of variable

    - Using an object to create a simple variable

    - Using a simple variable to create an object


    Simple variables are the basic data types you learned during Hour 5, "Storing
    and Changing Information in a Program." Some of these types are int, float, char,
    double, byte, and short.


    When using a method or an expression in a program, you must use the right type
    of information that''s expected by these methods and expressions. A method that
    expects a Calendar object must receive a Calendar object, for instance. If you
    used a method that takes a single integer argument you sent it a floating-point
    number instead, an error would occur when you attempted to compile the program.


    When a method requires a string argument, you can use the + operator to combine
    several different types of information in argument. As long as one of the things
    being combined is a string, the combined argument is converted into a string.


    Converting information to a new form is called casting. Casting produces a new
    value that is a different type of variable or object than its source. You don''t
    actually change the value when casting. Instead, a new variable or object is created
    in the format you need.


    The terms source and destination are useful when discussing the concept of casting.
    The source is some kind of information in its original form—whether it''s a variable
    or an object. The destination is the converted version of the source in a new
    form.


    # Casting Simple Variables


    With simple variables, casting occurs most commonly between numeric variables
    such as integers and floating-point numbers. One type of variable that cannot
    be used in any casting is Boolean values.'
