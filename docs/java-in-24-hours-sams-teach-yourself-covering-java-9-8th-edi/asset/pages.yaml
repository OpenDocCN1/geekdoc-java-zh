  md: '# APPENDIX A


    # Using the NetBeans Integrated Development Environment


    Although It''s possible to create Java programs with nothing more than the Java
    Development Kit and a text editor, the experience is considerably more pleasant
    when you use an integrated development environment (IDE).


    Most of us employ NetBeans, a free IDE offered by Oracle for Java programmers.
    NetBeans is a program that makes it easier to organize, write, compile, debug
    Java software. It includes a project and file manager, graphical user interface
    designer, and many other tools. One killer feature is a code editor that automatically
    detects Java syntax errors as you type.


    Now in version 8.2, NetBeans has become a favorite of professional Java developers,
    offering functionality and performance that would be worth the money at 10 times
    the price. (See what I did?) NetBeans is also one of the easiest IDEs for Java
    novices to use.


    In this appendix, you learn enough about NetBeans to install the software and
    put it to use throughout this book.


    # Installing NetBeans


    From inausicious beginnings, the NetBeans IDE has grown to become one of the leading
    programming tools for Java developers. James Gosling, the creator of the Java
    language, gave the ultimate vote of confidence in his book NetBeans Field Guide:
    "I use NetBeans for all my Java development." After trying most of the IDEs available
    for the language over the years, I''ve become a convert as well.


    NetBeans supports all facets of Java programming for the three editions of the
    language—Java Standard Edition (JSE), Java Enterprise Edition (JEE), and Java
    Mobile Edition (JME). It also supports web application development, web services,
    and JavaBeans. It also focuses on the JSE.


    You can download NetBeans, available for Windows, Mac OS, and Linux, from https://netbeans.org.
    The software is available for download bunkle with the Java Development Kit and
    can be downloaded separately. You must have NetBeans and the JDK installed on
    your computer. NetBeans is available in several bundles. Choose the one that supports
    Java SE.'
  merge: -1
