  md: "# # Catching Errors as You Set Up URLs\n\nWhen you set up a URI object, you\
    \ must make sure the text used to set the address is in a valid format: http://workbench.cadenhead.org\
    \ and http://www.samspublishing.com are valid, but http://www.java would not be\
    \ because it is missing the two slash characters (//) after the colon.\n\nThe\
    \ getURI(String) method takes a web address as an argument, returning a URI object\
    \ representing that address. If the string is not a valid address, the method\
    \ returns null instead:\n\n```\nURI getURI(String urlText) {\n    URI pageURI\
    \ = null;\n    try {\n        pageURI = new URI(urlText);\n    } catch (URISyntaxException\
    \ m) {\n        // do nothing\n    }\n    return pageURI;\n}\n```\n\nThe try-catch\
    \ block deals with any URILException errors that occur when URI objects are created.\
    \ Because nothing needs to happen if this exception is thrown, the catch block\
    \ contains only a comment.\n\n# # Starting the Thread\n\nIn this program, the\
    \ runner starts when its start() method is called.\n\nThe start() method is called\
    \ as the last statement of the constructor. Here's the method:\npublic void start()\
    \ {\n    if (runner == null) {\n        runner = new Thread(this);\n        runner.start();\n\
    \    }\n}\n\nThis method starts the runner thread if it is not already started.\n\
    \nThe statement runner = new Thread(this) creates a new Thread object with one\
    \ argument: this keyword. The keyword refers to the program itself, designating\
    \ it as the class that runs within the thread.\n\nThe call to runner.start() causes\
    \ the thread to begin running. When a thread begins, the run() method of that\
    \ thread is called. Because the runner thread is the LinkRotator application itself,\
    \ the run() method of the application is called."
