    # Q&A


    +   - Is it possible to create your own exceptions?

    - A. It''s not just possible, it''s a really good idea. Making your own exceptions
    for problems that may arise your classes most robust. You can create your own
    exceptions easily by making them a subclass of an existing exception, such as
    Exception, the superclass of all exceptions. In a subclass of Exception, there
    are only two constructors you might want to override: Exception() with no arguments
    and Exception(String s as an argument. In the latter, the string should be a message
    describing the error that has occurred.

    - Why doesn''t this hour cover how to throw and catch errors in addition to exceptions?

    - Java divides problems into Errors and Exceptions because they differ in severity.
    Exceptions are less severe, so they are something that should be dealt with in
    your programs using try-catch or throws in the method declaration. Errors, on
    the other hand, are more serious and can''t be dealt with adequately in. Two examples
    of these errors are stack overflows and out-of-memory errors. These can cause
    the JVM to crash, and there''s no way you can fix them in your own program as
    the JVM runs it.

