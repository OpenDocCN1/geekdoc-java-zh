  md: 'The following statement is the only line located inside the block:

    // My first Java program goes here


    This line is a placeholder. The // at the beginning of the line tells the computer
    to ignore this line because it was put in the program solely for the benefit of
    humans who are looking at the source code. Lines that serve this purpose are called
    comments.


    Right now, you have written a complete Java program. It can be compiled, but if
    you run it, nothing happens. The reason is that you haven''t told the computer
