  md: '# Writing Your First Program


    # ### This Hour''s To-Do List:


    +   - Type a Java program into a text editor.

    - Organize a program with bracket marks.

    - Store information in a variable.

    - Display the information stored in a variable.

    - Save, compile, and run a program.


    As you learned during Hour 1, “Becoming a Programmer,” a computer program is a
    set of instructions that tells a computer what to do. These instructions are given
    to a computer using a programming language.


    During this hour, you create your first Java program by entering it into a text
    editor. When that''s done, you save the program, compile it, and test it out.
    Then you break it on purpose and fix it again, just to show off.


    # What You Need to Write Programs


    As explained in Hour 1, to create Java programs, you must have a programming tool
    that supports the Java Development Kit (JDK) such as the NetBeans integrated development
    environment (IDE). You need a tool that can compile and run Java programs and
    a text editor to write programs.


    With most programming languages, computer programs are written by entering text
    into a text editor (also a source code editor). Some programming languages come
    with their own editor. NetBeans includes its own editor editor.


    Java programs are plain text files without any special formatting, such as centered
    text or boldface text. The NetBeans source code editor functions like a simple
    text editor with some useful enhancements for programmers. Text turns different
    colors as you type to identify different elements of the language, NetBeans also
    indents lines properly and provides helpful programming documentation inside the
    editor.'
