  md: '# HOUR 23: Creating Minecraft Mods with Java


    Because the Y axis in Minecraft is the vertical position, this moves the player
    to a spot right above the sphere.


    # Summary


    In all the years I''ve been writing Java programs and teaching people how to use
    this language, I never expected that I would put those skills to work making a
    zombie ride a horse.


    Or that the horse would catch fire immediately catch fire because the sun was
    out.


    Or you could dig a hole so large you fell out of the world.


    This is the funnest kind of Java programming. I know that isn''t a word, but it
    should be one, and it should be used to describe putting your own Java objects
    into a three-dimensional world where you fight monsters, dig tunnels, build houses,
    and dodge the legions of the living dead.


    Minecraft also is an excellent way to learn about object-oriented programming,
    one of the toughest aspects of the language to master. Everything you do in Java
    is accomplished with objects. You create them with constructors, give them knowledge
    in instance variables, and tell them to do things by calling methods. Objects
    indicate the tasks they can perform by implementing interfaces.


    All these concepts directly relate to mod programming. Need a zombie? Create a
    Zombie object. Want the player to move to a new spot? Call his teleport() method.
    Did you lose your horse? Call its getLocation() method.


    So dig as deep into Minecraft mod programming as you like. You''re going to be
    able to use these skills far beyond the realm of creepers and wither skeletons
    and pig zombies.


    # Workshop


    # Q&A


    +   A. I made an enormous mess of my server''s world with the IceCreamScoop mod.
    How can I start over?


    +   B. The Minecraft server makes it easy to create a new world from scratch or
    switch from one world to another.


    To start and delete the old world, start the server, open the Minecraft server''s
    folder, and delete the world subfolder. When you start the server, Minecraft figures
    out the world is gone and creates a new one. This process is a little slower than
    usual. The server log explains what it is doing.'
