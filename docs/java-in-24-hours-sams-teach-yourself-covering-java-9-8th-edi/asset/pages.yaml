    # Q&A


    +   Q. Is a line in a Java program the same thing as a statement?


    +   A. No. The programs you create in this book put one statement on each line
    to make the programs easier to understand;it''s not required.


    The Java compiler does not consider lines, spacing, or other formatting issues
    when compiling a program. The compiler just wants to semicolons at the end of
    each statement. This line would work just fine in Java:


    ```

    int x = 12; x = x + 1;

    ```


    Putting more than one statement on a line makes a program more difficult for humans
    to understand when they read its source code. For this reason, it is not recommended.


    +   Q. Why should the first letter of a variable be lowercase, as in gameOver?


    +   A. It''s a naming convention that helps your programming in two ways. First,
    it makes variables easier to spot among the other elements of a Java program.
    Second, by following consistent style in the naming of variables, you eliminate
    errors that can occur when you use a variable in several places in a program.
    The style of capitalization used in this book is the one that''s been adopted
    by most Java programmers over the years.


    +   Q. Can I specify Integers as binary values in Java?


    +   A. You can. Put the characters "Ob" in front of the number and follow it with
    the bits in the value. Since 1101 is the binary form for the number 13, the following
    statement sets an integer to 13:


    ```

    int z = 0B0000_1101;

    ```


    The underscore is just there to make the number more readable, just like with
    large numbers. The underscore is ignored by the Java compiler.


    Hexadecimal underscores can be represented with numbers preceded by "0x", as in
    Super Bowl 0x33, in which the New England Patriots defeated the Atlanta Falcons
    by a score of 0x22 to 0x1C.'
