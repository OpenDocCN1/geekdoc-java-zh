  md: '# # APPENDIX D

    # Fixing a Problem with the Android Studio Emulator


    The free Android Studio integrated development environment (IDE) has become the
    official tool for creating Android apps since its release in 2015. You will learn
    how to create mobile apps in Java with this IDE during Hour 24, "Writing Android
    Apps."


    If you already have read that chapter and successfully run an app in an Android
    emulator, you don''t need to read this appendix.


    But if you couldn''t make the emulator work at all, you''re in the right place.


    # # Problems Running an App


    When you are working on an Android project in Android Studio and you want to run
    the app, you can choose the menu command Run, Run App.


    This command opens a Choose Device dialog that asks for the device where the app
    should be executed. The device can be a real Android phone or tablet, if it''s
    connected to your computer over a USB cord and configured to test apps. The device
    also can be an Android emulator.


    An Android emulator in Android Studio can act like actual phones and tablets that
    run the mobile OS. A virtual device can be set up for multiple Android virtual
    devices.


    Some users experience problems running an Android app for the first time with
    an emulator in Android Studio. The emulator crashes with this ominous message:


    output ▼


    ```

    ERROR: x86 emulation requires hardware acceleration!

    Please ensure Intel HAXM is properly installed and usable. CPU acceleration status:
    HAXM kernel module is not installed!

    ```


    This error occurs on Windows computers and indicates that they need a hardware
    acceleration program from Intel called the Hardware Accelerated Execution Manager
    (HAXM) before the emulator will work. This program can be downloaded in Android
    Studio, but you must install it outside of the IDE.'
  merge: -1
  pgno: 424
- img_proc: true
  md: '# 414 APPENDIX D: Fixing a Problem with the Android Studio Emulator


    HAXM is a hardware virtualization engine for computers with Intel processors that
    speeds up Android development by making emulators run faster. One of the biggest
    bottlenecks in app programming for Android is how slowly emulators load.


    Before you set up HAXM, you must add it to the Android SDK in Android Studio.


    CAUTION


    HAXM should only be installed on computers with an Intel processor. This appendix
    resolves a problem where Android Studio indicates that it needs HAXM to run the
    Android emulator. If the emulator is failing with an error message that does not
    mention HAXM, do not use this appendix to fix it.


    # Install HAXM in Android Studio


    HAXM can be downloaded and added to the Android SDK as you''re running Android
    Studio. Click the SDK Manager button in the Android Studio toolbar, which is identified
    in Figure D.1.


    ![](img/a0aae57357c3a6b5f086ebcfefa75a2f_425_0.png)


    FIGURE D.1

    Running the SDK Manager.


    The SDK Manager is used to enhance the SDK with additional versions of Android
    and useful SDK tools. Click the SDK Tools tab to bring it to the front.


    The tools available for the SDK will be listed along with a check mark next to
    the ones you already have installed. Look for the item Intel x86 Emulator Accelerator
    (HAXM Installer).'
  merge: -1
