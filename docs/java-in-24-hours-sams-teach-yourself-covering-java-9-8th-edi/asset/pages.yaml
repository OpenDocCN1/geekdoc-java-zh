  md: '# Hash Maps


    Objects are stored in a hash map by calling its put(Object, Object) method with
    two arguments: the key and the value:

    phonebook.put("Butterball Turkey Line", 8002888372L);


    This stores an item in the map with the key "Butterball Turkey Line" and a Long
    object for the value 8002888372, the phone number of that service.


    # NOTE


    These statements are putting Long objects in the hash map using long values. This
    would have been an error in early versions of Java, because a primitive data type
    such as long couldn''t be used where an object was required.


    But it''s no longer an error because of autoboxing and unboxing, a feature of
    Java that automatically converts primitive types to their equivalent object classes.
    When the Java compiler sees a long like 8002888372, it converts it to a Long object
    representing that value.


    An object can be retrieved from the map with its key by calling get(Object) with
    the key as the only argument:

    long number = phonebook.get("Butterball Turkey Line");


    The get() method returns null if there''s no value matching that key. This would
    cause a problem with the preceding example, because null is not a suitable long
    type.


    Another way to handle that potential problem is to call getOrDefault(Object, Object).
    If the key specified as the first argument is not found, the second argument is
    returned by default, as in this statement:


    long number = phonebook.getOrDefault("Betty Crocker", -1L);


    A third way to avoid the problem is for number to be declared as a Long object
    instead of a primitive type. The number object could accept null as a value.


    If a number matching the key "Betty Crocker" is found in the map, that number
    is returned. Otherwise, -1 is returned.


    There are two methods that indicate whether a key or value is present in the map:
    containsKey(Object) and containsValue(Object). These return a Boolean of true
    or false.


    Hash maps, like array lists, have a size() method that reveals the number of items
    in the data structure.


    Looping through a map can be performed using an entry set, a collection of all
    the entries in the map. The entrySet() method returns these entries as a Set object
    (using the Set interface in java.util).'
