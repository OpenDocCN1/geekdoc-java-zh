  md: '# HOUR 19

    Responding to User Input


    +   This Hour''s To-Do List:

    - Make your programs aware of events.

    - Set up a component so it can cause events.

    - Find out where events end up in a program.

    - Store information in the interface.

    - Convert values stored in text fields.


    The graphical user interface (GUI) you developed during the past two hours can
    run on its own. Users can click buttons, fill text fields with text and resize
    the window. Sooner or later, even the least discriminating user is going to be
    left wanting more. The GUI that a program offers to cause things to happen when
    a mouse click or keyboard entry occurs.


    These thing become possible when your Java program can respond to user events.
    This is called event handling and is the main event for this.


    # Getting Your Programs to Listen


    A user event in Java is something that happens when a user performs an action
    with the mouse, keyboard, or another input device.


    Before you can receive events, you must learn how to make an object listen. Responding
    to user events requires the use of one or more EventListener interfaces. Interfaces
    are a feature of object-oriented programming in Java that enable a class to inherit
    behavior it would not be able to employ otherwise. They are like a contract agreement
    with other classes that guarantees the class will contain specific methods.


    An Event interface contains methods that receive user input of a specific type.

    Adding an Listener interface requires two things. First, the listening classes
    are part of the java.awt. package, you must make them available with the following
    statement:


    ```

    import java.awt.event.*;

    ```'
