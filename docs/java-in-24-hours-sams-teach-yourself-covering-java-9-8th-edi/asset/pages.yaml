  md: '# Workshop


    # Q&A


    +   Q. Why is the Android Studio used to create Android apps instead of NetBeans?


    +   A. You can use NetBeans to develop apps, but it''s a more cumbersome and less
    well-supported IDE for Android programming. Android Studio has been designated
    by Google as the preferred IDE for Android. The official documentation and tutorials
    on the Android Developer site at http://developer.android.com all use Android
    Studio.


    +   Most programming books for Android also employ Android Studio. Although there''s
    a learning curve to switch from NetBeans to Android Studio when you dive into
    Android, after you master the basics of writing, debugging, and deploying an app,
    you should find Android easier to use because it''s so much better supported by
    programmers and technical writers.


    +   Q. Why do many movies have the exact sound of a scream in anguish?


    +   A. That sound is the Wilhelm scream, a sound effect that was heard first in
    the 1951 movie Distant Dreams. It turns out most often when somebody falls from
    a great height, is shot by a gun, or is knocked back by an explosion. Two famous
    uses are in the original Star Wars, when a stormtrooper is shot by Luke Skywalker
    and falls off a ledge, and in the animated movie Toy Story when Sheriff Woody
    Buzz Lightyear out the window.


    +   The sound was popularized by movie sound designer Ben Burtt, who found it
    in a Warner Brothers library when developing sound for Star Wars and included
    it in every Steven Spielberg and George Lucas movie he worked on. It has since
    become a tradition among sound designers and can be heard in more than 140 movies.


    +   The voice actor who screamed is believed to be Sheb Wooley, an actor and singer
    who recorded the 1958 novelty song "Purple People Eater."


    +   The scream being named Wilhelm comes from the third movie to use the sound
    effect. In the 1953 film The Charge at Feather River, Private Wilhelm yields in
    anguish as he''s shot by an arrow.


    # Quiz


