    become clearer to you in successive hours. As long as you go theing program to
    work during this hour, you''re ready to proceed.


    (The fourth step has nothing to do with Java programming. It''s just something
    I put in the book.)


    # Workshop


    # Q&A


    +   How important is it to put the right number of blank spaces on a line in a
    Java program?


    +   It''s completely unimportant as far as the computer is concerned. Spacing
    is strictly for the benefit of people looking at a computer program—the Java compiler
    couldn''t care less. You could have written the program without including blank
    spaces or using the Tab key to indent lines, and it would compile successfully.


    Although the number of spaces in front lines isn''t important to the computer,
    you should use consistent spacing and indentation in your Java programs anyway.
    Why? Because spacing makes it easier for you to see how a program is organized
    and to which programming statement belongs.'
