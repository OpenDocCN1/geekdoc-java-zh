  md: '# HOUR 17: Building a Simple User Interface


    With Java, the development of a program''s user interface is based on Swing and
    an earlier set of classes called the Abstract Windowing Toolkit. These classes
    enable you to create a GUI and receive input from the user.


    Swing includes everything you need to write programs that use a GUI. With Java''s
    user interface classes, you can create a GUI that includes all the following and:


    +   - Buttons, check boxes, labels, and other simple components


    +   - Text fields, sliders, and other more complex components


    +   - Pull-down menus and pop-up menus


    +   - Windows, frames, dialog boxes, panels, and applet windows


    > NOTE

    Swing includes dozens of components that can be customized in far more ways than
    can be documented. This book covers the most common components and their most
    useful methods. As you explore them in the next four hours, you can learn more
    about each component and find new methods in Oracle''s official documentation
    for the Java Class Library. Read it on the web at http://download.java.net/jdk9/docs/api.
    It offers additional reference documentation on every class and interface in Java
    9.


    # Using Components


    In Java, every part of a GUI is represented by a class in the Swing package. There
    is a JButton class for buttons, a Window class for windows, a JTextField class
    for text fields, and so on.


    To create and display an interface, you create objects, set their variables, and
    call their methods. The techniques are the same as those you used as you were
    introduced to object-oriented programming (OOP).


    When you are putting a GUI together, you work with two kinds of objects: components
    and containers. A component is an individual element in a user interface, such
    as a button or slider. A container is a component that you can use to hold other
    components.


    The first step in creating an interface is to create a container that can hold
    components. In an application, this container is often a window or a frame.


    # Windows and Frames


    Windows and frames are containers that can be displayed in a user interface and
    hold other components. Windows are simple containers that do not have a title
    bar or any of the other buttons normally along the top edge of a GUI. Frames are
    windows that include all the common'
