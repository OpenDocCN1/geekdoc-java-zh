    \ than 0.\n\nThe while statement tests the condition at the beginning of the loop\
    \ before any statements in the loop have been handled. If the tested condition\
    \ is false when a program reaches the while statement for the first time, the\
    \ statements inside the loop are ignored.\n\nIf the while condition is true, the\
    \ loop goes around once and tests the while condition again. If the tested condition\
    \ never changes inside the loop, the loop keeps looping forever.\n\nThe following\
    \ statements use a loop to display the same line of text several times:\n\n```\n\
    int limit = 5;\nint count = 1;\nwhile (count < limit) {\n    System.out.println(\"\
    Pork is not a verb\");\n    count++;\n}\n```\n\nA while loop uses one or more\
    \ variables set before the loop statement. In this example, two integer variables\
