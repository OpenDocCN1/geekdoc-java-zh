  md: "With the preceding grade example, you saw that if and else statements can be\
    \ chained to handle several different conditions.\n\nAnother way to do this is\
    \ with the switch statement, which can test for a variety of different conditions\
    \ and respond accordingly. In the following code, the grading example has been\
    \ rewritten with a switch statement:\n\n```\nchar grade = 'B';\nnwitch (grade)\
    \ {\n    case 'A':\n        System.out.println(\"You got an A. Awesome!\");\n\
    \        break;\n    case 'B':\n        System.out.println(\"You got a B. Beautiful!\"\
    );\n        break;\n    case 'C':\n        System.out.println(\"You got a C. Concerning!\"\
    );\n        break;\n    default:\n        System.out.println(\"You got an F. You'll\
    \ do well in Congress!\");\n}\n```\n\nThe first line of the switch statement specifies\
    \ the variable that is tested—in this example, grade. Then, the switch statement\
    \ uses the { } brackets to form a block statement.\n\nEach case statement checks\
    \ the test variable in the switch statement against a specific value. The value\
    \ used in a case statement can be a character, integer, or string. In the preceding\
    \ example, there are case statements for the characters 'A', 'B', and 'C'. Each\
    \ has one or two statements that follow it. When one of these case statements\
    \ matches the variable in switch, the computer executes all statements after the\
    \ case until it encounters a break statement.\n\nFor example, if the grade variable\
    \ has the value of 'B', the text \"You got a B. Good work!\" is displayed. The\
    \ next statement is break, so nothing else in the switch statement is executed.\
    \ The break statement tells the computer to break out of the switch statement.\n\
    \nForgetting to use break statements in the case sections of a switch statement\
    \ can lead to undesired results. If there were no break statements in this grading\
    \ example, the first three \"You got a...\" messages would be displayed when the\
    \ grade variable equals 'A', 'B', or 'C'.\n\nThe default statement is used as\
    \ a catch-all if none of the preceding case statements are true. In this example,\
    \ it occurs if the grade variable does not equal 'A', 'B', or 'C'. You do not\
    \ have to use a default statement with every switch block in your programs. When\
    \ it is omitted, nothing happens if none of the case statements has the correct\
    \ value.\n\nYour first project, the Commodity class in Listing 7.1, uses switch\
    \ to either buy or sell an unspecified commodity. The commodity costs $20 when\
    \ purchased and earns $15 profit when sold."
