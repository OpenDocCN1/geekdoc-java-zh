  md: '# APPENDIX D Fixing Problem with the Android Studio Emulator


    If you don''t remember where you put it, the default on Windows is to put the
    SDK in your personal user folder in a subfolder called AppData\Local\Android\sdk.
    So if your Windows username is Catniss, the suggested SDK location is \Users\Catniss\AppData\Local\


    If you find the SDK''s folder on your computer, open that folder, then open the
    subfolder extras\intel\Hardware_Accelerated_Execution_Manager.exe.


    The folder contains a program called intelhaxm-android.exe. This is the HAXM installation


    HAXM requires a computer with an Intel processor, 16 GB of disk space, and a Windows
    7 or higher, or the 64-bit Mac OS X versions 10.8 through 10.11. A text file called
    Release Notes.txt in this folder contains detailed information on the software
    requirements.


    After you''ve reviewed the release notes file, if you''re ready to install HAXM,
    run the program intelhaxm-android.exe. The installer will check whether your computer
    can run HAXM and exit if it can''t.


    During installation you''ll be asked how much memory to allow HAXM to use. The
    default value of 2G should be sufficient. Complete the installation.


    # TIP


    If you decide later that you''ve allocated too much or too little memory for HAXM,
    you can change this setting by running the installation program again.


    Once HAXM has been installed, you should reboot your computer.


    When that''s complete, load Android Studio and try to run your Android app again
    by choosing Run, Run App.


    The app should run in an emulator. The Android emulator looks like a phone, displays
    “Android” boot screen while it''s loading and then runs the app. Figure D.3 shows
    what the SalutonMondo app looks like when it has been run successfully.'
