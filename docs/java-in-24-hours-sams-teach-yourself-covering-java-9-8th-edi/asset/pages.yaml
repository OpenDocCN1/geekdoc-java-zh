    # Other Numeric Variable Types


    The types of variables you have been introduced to so far are the main ones you
    will use for most of your Java programming. You can employ a few other types of
    variables in less common circumstances.


    One is byte, which holds integer numbers that range from -128 to 127. The following
    statement creates a variable called escapeKey with an initial value of 27:

    byte escapeKey = 27;


    The second, short, can be used for integers that are smaller in size than the
    int type. An integer can range from -32,768 to 32,767, as in the following statement:

    short roomNumber = 222;


    The last of the numeric variable types, long, is used for integers that are too
    big for the int type to hold. A long integer is from -9.22 quintillion to 9.22
    quintillion, which is a large enough number to cover everything but government
