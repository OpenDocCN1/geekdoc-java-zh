  md: '# HOUR 15


    # Creating a Threaded Program


    This Hour''s To-Do List:


    +   - Use an interface with a program.

    - Create threads.

    - Start, stop, and pause threads.

    - Catch errors.


    A computer term often used to describe the hectic pace of daily life is multitasking,
    which means to do more than one thing at once—such as browsing the Web at your
    desk while participating in a conference call and doing butt crunch exercises.
    A multitasking computer is one that can run more than one program at a time.


    One sophisticated feature of the Java language is the ability to write programs
    that can multitask, which is made possible through a class of objects called *threads*.


    # Threads


    In a java program, each of the simultaneous tasks the computer handles is called
    a thread, and the overall process is called *multithreading*. Threading is useful
    in animation and many other tasks.


    Threads are a way to organize a program so it does more than one thing at a time.
    Each task that must occur simultaneously is placed in its own thread, and this
    often is accomplished by implementing each task as a separate class.


    Threads are represented by the Thread class and the Runnable interface, which
    are both part of the `java.lang` package of classes. Because they belong to this
    package, you don''t have to use an import statement to refer to them in your programs.


    One of the simplest uses of the Thread class is to slow down how fast a program
    does something.'
