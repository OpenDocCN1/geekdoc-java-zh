    # Workshop


    # Q&A


    Q. Are there any reasons to do nothing within a catch statement, as the LinkRotator
    application does when an exception is caught?


    A. It depends on the type of error or exception being caught. In the LinkRotator
    application, you know with catch statements what the cause of an exception would
    be, so you can be assured that nothing awaits is appropriate. In the getURI()
    method, the URISyntaxException would be caught only if the URI sent is invalid.


    Another exception that likely requires no action in a catch block is InterruptedException.
    In over 20 years as a Java programmer I''ve never had a program that threw exception.


    Most exceptions do necessitate logging the error.


