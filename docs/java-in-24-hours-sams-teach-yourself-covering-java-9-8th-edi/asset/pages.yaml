  md: 'The biggest advantage of interpreted languages is that they are faster to test.
    When you are writing a BASIC program, you can try it out immediately, fix errors,
    and try again. The primary disadvantage is that interpreted languages run slower
    than other programs. Each line has to be translated into instructions the computer
    can run, one line at a time.


    Other programming languages require a compiler. The compiler takes a program and
    translates it into a form that the computer can understand. It also makes the
    program run as efficiently as possible. The compiled program can run directly
    without the need for an interpreter.


    Compiled programs run more quickly than interpreted programs but take more time
    to test. You have to write your program and compile the whole thing before trying
    it out. If you find an error and fix it, you must compile the program.


    Java is unusual because it requires both a compiler and an interpreter. The compiler
    converts the statements that make up the program into bytecode. Once this bytecode
    has been created successfully, it can be run by an interpreter the Java Virtual
    Machine.


    The Java Virtual Machine, also called a JVM, is the thing that makes possible
    for the same Java program to run without modification on different operating systems
    and different kinds of computing devices. The virtual machine turns bytecode into
    instructions that a particular device''s operating system can execute.


    Java 9 introduces a new tool called JShell that acts like an interpreter, running
    a Java statement right when it is typed in. JShell works by putting the statement
    into a Java program, compiling that program into bytecode, and running it. It
    is a useful tool for learning and testing.


    # When Programs Don’t Work


    Many new programmers become discouraged when they start to test their programs.
    Errors appear everywhere. Some of these are syntax errors, which are identified
    by the computer as it looks at the program and becomes confused by the way a statement
    has been written. Other errors are logic errors, which are only noticed by the
    programmer as the program is being tested (or might be overlooked entirely). Logic
    errors often cause to do something unintended.


    As you begin your own programs, you become well acquainted with errors. They’re
    a natural part of the process. Programming errors are called *bugs*, a term that
    dates back a century or more to describe errors in technical details.


    The process of fixing errors also has its own term: **debugging**.


    It’s no coincidence that there are so many ways to describe errors. You get a
    lot of debugging experience as you learn programming—whether you want it or not.'
