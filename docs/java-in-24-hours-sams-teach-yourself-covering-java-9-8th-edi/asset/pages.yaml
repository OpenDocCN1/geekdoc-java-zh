    ```


    Make sure to capitalize everything exactly as shown, and use your spacebar or
    Tab key to insert the blank spaces in front of Lines 4-6. When you''re done, choose
    File, Save to save the file.


    At this point, Saluton.java contains the bare bones of a Java program. You will
    create many programs that start exactly like this one, except for the word Saluton
    on Line 3. This represents the name of your program and changes with each program
    you write. Line 5 should make sense to you, because it''s a sentence in actual
    English. The rest is probably new to you.


    # The class Statement


    The first line of the program is the following:


    ```

    package.java24hours;

    ```


    A package is a way to group Java programs together. This line tells the computer
    to make com.java24hours the package name of the program.


    After a blank line, the third line is this:


    ```

    class Saluton

    ```


    Translated into English, it means, "Computer, give my Java program the name Saluton."


    As you might recall from Hour 1, each instruction you give a computer is called
    a statement. The class statement is the way you give your program a name. It''s
    also used to determine other things about the program, as you will see later.
    The significance of the term class is that Java programs also are called classes.


    In this example, the program name Saluton matches the document''s filename, Saluton.
    java. A Java program must have a name that matches the first part of its filename—the
    portion before the \." period character—and be capitalized the same way.


    If the program name doesn''t match the filename, you get an error when you try
    to compile some Java programs, depending on how the class statement is being used
    to configure the program.'
