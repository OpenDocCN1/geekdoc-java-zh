  md: '# Telling the Computer What to Do


    A computer program, also called software, is a way to tell a computer to perform
    a task. Everything that the computer does, from booting up to shutting down, is
    done by a program. Mac OS X is a program; Minecraft is a program; the driver software
    that controls your printer is a program; even the dreaded blue screen of death
    on a crashed Windows PC is a program.


    Computer programs are made up of a list of commands the computer handles in a
    specific order when the program is run. Each command is called a statement.


    If your house had its own butler and you were a control freak with a Type-A personality,
    you give your servant a detailed set of instructions to follow every day, like
    this:


    +   Dear Mr. Jeeves,

    nPlease take care of these errands for me while I''m out asking Congress for a
    bailout:

    Item 1: Vacuum the living room.

    Item 2: Go to the store.

    Item 3: Pick up soy sauce, wasabi, and as many California sushi rolls as you can
    carry.

    Item 4: Return home.

    Sincerely, your lord and master,

    Bertie Wooster


    If you tell a human butler what to do, there''s a certain amount of leeway in
    how your requests are fulfilled. If California rolls aren''t available, Jeeves
    could bring Boston rolls home instead.

    Computers don''t leeway. They follow instructions literally. The programs that
    you write are followed precisely, one instruction at a time.


    The following example is a three-line computer program, written in BASIC. Take
    a look at it, but don''t worry too about what each line is supposed to mean.


    ```

    1 PRINT "Hey Tom, it''s Bob from the office down the hall."

    2 PRINT "It''s good to see you buddy, how''ve you been"

    3 INPUT AS

    ```


    Translated into English, this program is equivalent to giving a computer the to-do
    list:


    +   Dear personal computer,

    Item 1: Display the message, "Hey Tom, it''s Bob from the office down the hall."

    Item 2: Ask the question, "It''s good to see you buddy, how''ve you been?"'
  merge: -1
