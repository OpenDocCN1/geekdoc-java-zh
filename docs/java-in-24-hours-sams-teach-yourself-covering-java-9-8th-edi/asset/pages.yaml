  md: "# # Stopping a Thread\n\nThe LinkRotator application does not have a way to\
    \ stop the thread, but it has been designed in a way that would make it simple\
    \ to do. Here's one method that could be called to end execution of the thread:\n\
    \n```\npublic void stop() {\n    if (runner == null) {\n        runner = null;\n\
    \    }\n}\n```\n\nThe if statement tests whether the runner object is equal to\
    \ null. If it is, there isn't an active thread that needs to be stopped. Otherwise,\
    \ the statement sets runner equal to null.\n\nSetting the runner object to a null\
    \ value causes it to have a different value than the thisThread object. When this\
    \ happens, the while loop inside the run() method stops running.\n\n![](img/a0aae57357c3a6b5f086ebcfefa75a2f_227_0.png)\n\
    \nFIGURE 15.2\nDisplaying revolving links in an application."
