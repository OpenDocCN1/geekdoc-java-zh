  md: '# CHAPTER 3


    # Change a Few Habits


    # 6. Eat out less


    It really is as simple as this. There is a reason why the hot dog stand owner
    sells you the hot dog at the price he sells them at. The hotdogs may appear to
    be cheap enough for you, but the truth is he wouldn''t be selling it at that price
    if he couldn''t make the hot dog at much cheaper than that. Moral of the story
    is that, if you can cook it yourself, it is always cheaper. I am not saying that
    you should cut out all your family outings. I mean to say you do not spend when
    there is absolutely no need to spend. You can decide on some amazing dinners as
    a family and cook it as a family. Yes, it takes more effort. However, there are
    more advantages than disadvantages if you choose to cook your meals yourself.


    # 7. Find ways to eat out cheap


    We have ignored coupons for a long time. It is about time that we change this
    fact. Why would you want to ignore a discount? Use coupons as often possible.
    I do not mean to say that you use every coupon you find. I mean to say if you
    want to purchase anything, make sure you have a coupon for it. You will be surprised
    on the number of places around you offer regular coupons. You will find a lot
    in the local newspapers and a few online coupons too. Why spend the full amount
    on a three course meal if you are getting the dessert for free? It is not about
    being a cheapskate, it is about being smart. It is about understanding the value
    of money.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# 8. Carry your lunch


    This must be obvious advice after looking at the previous tips. You need to avoid
    eating out as often as possible. Depending on the company, you may be offered
    lunch for free at the company’s canteen. But if your company doesn’t, spending
    money every day on lunch can get expensive. You can carry lunch from home and
    it usually doesn’t take a lot of time. There are some great options for lunch.
    You can create a schedule for the lunch you and your family needs on weekdays
    on a weekend. This can be a great way for your family to bond.


    # 9. Change your style


    If you are someone who loves dressing up a lot, with great accessories, and impeccable
    make up, then frugal living might not be a great option for you. If you want to
    live frugally, you need to understand how to dress up frugally too. All of us
    want to look our best, but looking our best every day takes both money and efforts.
    The choice is simple. Choose the days you want to look your best carefully. The
    other days of the week you can live with a minimalist wardrobe and very light
    make up. This saves a lot of time and money. It is much easier for guys, as I
    am sure that most of them live frugally when it comes to clothes! However, they
    spend a lot more on accessories such as watches. So cut down on what you spend
    if you do not need it.


    # 10.The lure of the online market


    Online shopping is a great option if you need something. But, online shopping
    is more of an indulgence than simply fulfilling your need. It is comfortable to
    shop from our living room and this makes us buy'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'impulsively. The illusion of comfort is very deceiving and you should never
    fall for it. It is tougher to control initially, but as you go along with living
    frugally, you will get a better understanding of it. During the initial stages,
    constantly remind yourself of the difference between want and need. This will
    help you stop buying things impulsively online. If you still find yourself making
    impulse buys online, then the final option available for you is to cancel your
    credit card subscription for a few weeks or months.


    # 11. Say no to shopping


    Most of the times, we buy things we do not need at all. We buy because we simply
    want them after looking at them. The idea is to avoid malls and other shopping
    complexes during your initial days of living frugally. This will help you to save
    as much money as possible. Once you are used to the idea, you will notice that
    you have control over yourself and you also understand the clear distinction between
    needing something, and wanting something. I am sure there were times when you
    went to the mall just to hang out with your friends while you were younger. I
    am sure that you spent more than what you expected almost every time. This is
    because shopping malls are designed to sell products to customers, so it is only
    obvious that you spend more when faced with so many choices.


    # 12. Plan for a month


    Plan everything for the month ahead. If there are fresh food items which are perishable,
    then make a budget for them and keep money aside for buying them! This allows
    you to understand the items you need, and the items you want impulsively. This
    will also help you to keep track of your finances and savings. You might get your
    list wrong for a few months in the beginning.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'You might over buy, or you might under buy, but after a while, you will get
    a hang of it. This will also improve your organizational skills.


    # 13. Quit smoking


    Smoking is expensive. You may not find it expensive when you look at each individual
    cigarette. But annually you are wasting hundreds of dollars on smoking. Quit smoking
    to save money, and also to avoid having to pay thousands of dollars on medical
    fees. So it is about time that you realize that smoking is not only bad for your
    health, but bad for your wallet too.


    # 14. Moderation is the key


    Alcohol consumption is not quite as bad as people make it sound. Alcohol in moderation
    might actually be good for you. But the bottom line is that you need to learn
    when to stop drinking. Partaking in an occasional drink is totally different compared
    to drinking every day. Alcohol, like smoking, can be quite heavy on your pocket
    and your health. So you should not waste too much money on either of these habits.


    # 15. Cut back on sweets


    Sweets and desserts are usually rich in carbs and fats, and they lack the other
    essentials nutrients your body require. This shows that sweets and desserts do
    no other than job to sweeten your mouths. After reading so many tips, you should
    realize that frugal living means to cut back on what is needed. And sweets are
    not necessary to life.'
  merge: -1
  pgno: 17
