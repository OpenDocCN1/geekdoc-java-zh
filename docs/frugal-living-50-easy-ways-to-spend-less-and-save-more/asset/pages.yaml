  md: '# CHAPTER 4


    # Health and Entertainment


    # 16. Cut the Cable


    Cable TV is expensive. It might not be crazily expensive, but if you ask me, it
    is a totally unnecessary way to spend your money. If you want a brief idea, the
    cable TV costs on average 60 dollars a month in the USA. That is an equivalent
    of 720 dollars, a year. 60 dollars might sound cheap to you and maybe it is. However,
    the actual question is: do you need it. We live in the age of the internet. We
    can get almost everything we want for entertainment online. So having a cable
    subscription has become unnecessary for on-demand entertainment. Not having a
    television set means you will have more time to do other activities as well. This
    will help you grow as a family and also as a person.


    # 17. Become a bookworm


    Books are great at entertainment; this is a fact that can be overlooked by many
    people. Books can create worlds, stories, and even give some great advice. So
    pick up books from the local library and read as often as possible. Libraries
    are great places for entertainment, and you can learn a lot too while you are
    at it. This will also help you to develop the habit of reading for your children
    from a very young age.


    # 18.Free entertainment'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'Not going to the movies or the bars around the place you doesn’t mean you do
    not have a life. You need to understand that watching movies in theaters is expensive.
    The tickets may not be expensive but the food they sell be. If you go to the movies
    at night, you will have a strong impulse to eat out, or to hit the local bar before
    you return home. That costs a lot of money. You can save a lot of money by finding
    some great ways of entertainment which are both cheap, as well as more intimate.
    You can rent out a movie and make your own popcorn. You will get more popcorn
    for a fraction of the price. You can go out hiking, the zoo, or a museum.


    # 19. Frugal exercise


    Obviously, the first step is to cancel your gym subscription. There is a difference
    between growing muscles and staying healthy. You can save a lot of money by cancelling
    your gym subscriptions and finding a way to exercise on your own. You can purchase
    a set of dumbbells. Go for a run or take a walk instead of walking or running
    on treadmill. Use the stairs to simulate the action of a cross trainer. You will
    find that you can replicate most of the exercises you do at a gym in your living
    room. All that is required is a little motivation to start.


    # 20. Stay healthy and save money


    The amount of money we spend on medical care is astronomical. Hospitals, medicines,
    and general consultations are never free. I am not implying that you stay at home
    when you are sick. I am simply saying that prevention is better than trying to
    get a cure. Take care of your body, eat the right food, and exercise regularly.
    This should cut down your hospital needs by half.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# 21. Why subscribe?


    You may have subscribed to a local newspaper and to a few magazines. We believe
    that it is a really good investment. It does encourage the habit of reading, but
    you still have to spend some money on it. But why spend money on subscriptions?
    The internet is filled with all the news and information you would want to read
    from. So cancel all your newspaper and magazine subscriptions and read all you
    want online. You can unsubscribe from Netflix too if you are not an avid movie
    watcher. You can hire or borrow DVD’s for a better rate, whenever you feel like
    watching a movie.'
  merge: -1
