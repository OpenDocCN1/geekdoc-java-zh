  md: '# CHAPTER 5


    # The Way You Travel


    22. Use a bicycle


    I wonder why more people haven''t figured this out yet. Cycling is very refreshing
    and is also very good for the body! There are a few drawbacks, of course. If your
    place of work is too far away from your home, a bike can be ruled out. If however,
    you stay near your workplace, then there is no better option than riding a bike
    to work. You can get there quickly and at the same time, get some valuable exercise
    on the go. Let your spouse drive the car and you can enjoy the benefits of the
    bike.


    23. Carpool if you can


    Again, carpooling is an obvious choice which most people simply ignore. Carpooling
    is a great option that not only saves you money but also helps you bond with your
    friends. What is the point of travelling alone in a car that is meant to carry
    four people? So if you have friends or coworkers living in your area, then the
    best idea for you is to carpool. This helps you save a lot of money. If this is
    not a possibility, then try to use public transportation as often as possible.
    Sometimes you might wake up early—if you do, use the public transportation because
    you have more time to use it.


    24. Walk


    It is funny that these days most of us use a car to go to a nearby supermarket.
    We can always walk or jog if a store or a supermarket is'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'nearby, instead of taking a car. If you do not want to think in terms of money,
    then simply think in terms of your health. There is no better exercise to walk
    regularly. We have legs to walk, not to drive. So use those legs for the purpose
    that they are meant for, as often as possible.


    # 25. Travel frugally


    If you are planning on taking a vacation, then you can choose to travel frugally
    too. Avoid places that are major tourist hubs. There are places which are not
    so famous, but are equally beautiful. If you are planning on going to the Bahamas
    for the white sands, you can choose an alternate destination like Thailand. There
    are always countries that are cheaper to visit and it always helps to do your
    research beforehand. Remember that air travel tickets are astonishing expensive,
    so plan and book your tickets ahead of time.


    # 26. Save on gas


    This may be another tip you must have been expecting in this topic. Gasoline prices
    are on the rise all over the world and they may continue to rise. So, it is important
    that we learn to save on gas as much as possible. It helps to reduce our budget
    and gives us a chance to contribute to keep planet safe. Here are a few tips to
    save some gas.


    +   - Keeping your vehicle in a good condition helps you to save a lot of gas.
    An engine that is not performing well will obviously take more gasoline to run.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '+   - Check your tires- Keeping your tires inflated will affect your mileage
    positively.


    +   - Avoid rush hours at all costs- If you cannot avoid rush hours when you commute
    to work, then get to work earlier and return a little later from work to avoid
    rush hour traffic.


    +   - Do not accelerate too much or too little. Try to drive as smoothly as possible.


    +   - You can always try to avoid using a car altogether when it is not required;
    there are quite a few errands which can be done without a car. So, walk or use
    a bicycle, whenever possible!'
