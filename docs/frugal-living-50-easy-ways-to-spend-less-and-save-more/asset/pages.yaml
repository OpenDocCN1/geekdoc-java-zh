  md: '# # CHAPTER 1


    # # What is Frugal Living?


    There has been great confusion as to what exactly frugal living means. We do not
    intend to say that a person following frugal living is better than anybody, but
    the truth is when you take money out of the equation, you will have more time
    for everything else in your life. Does frugal living mean you will stop caring
    about money? The answer to this is no, in fact, it is exactly the opposite. Imagine
    this scenario: if you have a lot of something, and you realize you can live without
    that thing, wouldn''t you be comfortable doing everything else?


    The idea is simple. If you can save money in everything you do, then you will
    reach a stage where you will eventually have enough money that you wouldn''t need
    to worry about it so much. So frugal living the same as having extensive savings?
    Actually, the answer to this is also no. The idea is to live a simpler life, without
    wasting money. Having a larger bank balance is a by-product of this way of life.


    So what exactly is frugal living? The concept is to live life as simply as possible.
    This will allow you to save more money and as a product, gain financial flexibility
    in the long term. This is the most basic definition I can think of. Now, many
    of you might be frugal from time to time. But if you actually think about it,
    we choose to be cheapskates for things that are almost worthless and tend to spend
    big on everything else. Penny-wise, pound-foolish. You need to understand that
    frugal living is a way of life,'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'and once you get used to it, you will view other important aspects in life
    with a much deeper perspective.


    People will always crave for more and more materialistic possessions. Some people
    say that things make up who we are. I agree with them; most of the time, people
    will be judged by what they have. This may sound too obtuse for some of you, but
    the truth is that most people judge a book by its cover. That is the world we
    live in. So living frugally doesn’t mean that you have to live without any material
    possessions. It means to choose what you buy more wisely. We need to surround
    ourselves with what we believe is ours and what we believe we have earned. There
    is absolutely nothing wrong with this. Frugal living also improves your ability
    to think creatively. If you are really serious about frugal living, then you can
    be rest assured that you will learn at least one important life skill with this
    style. You could learn a thing or two about plumbing, carpentry, or even computer
    hardware.


    So the burning question now is, how do I start living frugally? The following
    chapters will help you understand the concept of frugal living as well as you
    started with some really easy tips you can start right away.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# CHAPTER 2


    # Start with the Most Expensive


    Here are a few tips on how you can live frugally.


    +   1. One family, one car


    It really doesn''t matter how many kids you have. The idea is simple: if you are
    a single family, one car will do just fine. You might be wondering how this would
    be possible if both the parents are working employees. If your day starts at the
    same time, the whole family carpool together. The idea is that you will save a
    lot of money by cutting the gasoline costs for two cars. If your timings differ
    or the area of your work is different, then you can split the driving privileges
    equally. You can alternate who drives the car to work and who takes public transport.
    If you are the one who gets to drive the car, then it will be your duty to drop
    your kids at school too. This divides the chores between the both of you and helps
    save a lot of money.


    +   2. The size of your house


    I do not understand why people prefer a house that is bigger than what they need.
    If you are a family of four, then a three bedroom house is more than enough. If
    a guest shows unexpectedly, you can ask your children to share a room. I agree
    that a three bedroom house is a big house. What I mean to say when I say to reduce
    the size of your house is to buy only as a space that you will use. If you do
    not require a home office, there is no need for you to buy a house'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'with a home office. Some of you may have work from home, but if you think about
    it, there is absolutely no need for a separate home office. You can convert this
    room into a bedroom for your children instead. Thus, you can live comfortably,
    but not wastefully.


    # 3. Small family, small car


    I understand that SUV''s look big and majestic. However, the mileage they give
    is pathetic compared to the mileage of a small car. What is a better family car,
    an SUV or a mini-van? My answer would be neither, unless you are a family that
    regularly takes long trips. A small car is better for families who use it only
    for urban commute. Small cars offer more mileage and are usually lighter on your
    wallet. So choose a smaller car unless you really need a bigger car. There is
    a lot of difference between needing something and wanting something.


    # 4. Own a house? Or simply rent?


    This is usually the biggest question. Most people think it is better to own a
    house, because it gives you the comfort of owning a property. I agree that you
    will save up a lot on rent if you decide to own a house. But you need to think
    about the mortgage as well. I would advise you to rent a house until you have
    saved enough to own one yourself. If you do not have the money to have your own
    house, then do not even try to own one. You might find the deals offered by some
    banks to be quite lucrative, but the interest will raise the total cost of your
    payment, and it is in your best interest to avoid high interests.


    # 5. Look before you buy'
  merge: -1
  pgno: 12
- img_proc: true
  md: I am sure that most of you would simply log in online, or walk into the nearest
    store to buy any new equipment required for your house. There is something new
    furniture or equipment that excites the human brain, but buying new items all
    the time can be quite expensive. Look for second hand items near you home or online
    instead. You can start by asking your family and friends first. If they have upgraded
    any home equipment recently, they may have no use for the older equipment. You
    can purchase it at a much lower price compared to buying a brand new one. You
    can check out craigslist or any other website that sells used goods. You can even
    get many things you need at thrift stores and garage sales too.
