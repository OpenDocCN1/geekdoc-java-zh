    do not need to wash your clothes if they are not dirty. You can wash your jeans
    once or twice a week. This might sound too dirty for your liking, but jeans were
    designed for exactly this purpose. You can do a nose test and sniff of your shirts,
    before you decide to wash them. You will realize that a lot of your clothes are
    fresher than you think.


