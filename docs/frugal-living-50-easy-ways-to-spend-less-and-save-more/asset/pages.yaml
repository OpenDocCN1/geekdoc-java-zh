  md: '# 43. Learn to plan ahead


    This is an important life tip, frugal living or otherwise. Learning to plan ahead
    will allow you to reach goals that you previously thought impossible to achieve.
    Frugal living takes a lot of creativity and planning. Start with simple things.
    Like I have mentioned before, make a 30 day list of your grocery needs. If you
    are planning to run errands today, think ahead about your meals during your errands.
    You can pack a lunch for yourself and save a few dollars on the way. If you are
    having a field day, it helps to carry iced water. If you know that there is a
    family member''s birthday coming up, it is better to buy the gift as soon as there
    is a sale. All these simple things will help you in the long run. You will learn
    the important habit of always planning ahead.


    # 44. Wash clothes only when required


    You need not wash your clothes every time you wear them. The concept of washing
    clothes every time you wear is relatively new. People always wore clothes a couple
