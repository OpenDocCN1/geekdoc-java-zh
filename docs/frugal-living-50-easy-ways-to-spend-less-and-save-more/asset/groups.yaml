    # 第1章


    ## 什么是节约生活？


    关于节约生活的准确含义，一直存在很大的困惑。我们并不是想说遵循节约生活的人比任何人都要，但事实是，当你把金钱从考虑之外时，你有更多的时间处理生活的其他所有事情。节约生活意味着你将停止关心金钱吗？答案是否定的，事实上，恰恰相反。想象一下这种场景：如果你拥有某样东西，并且意识到你没有它也能生活，那么你做其他事情时不会很从容吗？


    这个观点很简单。如果你在做的每件事中都能省钱，那么你将达到一个阶段，最终你会有足够的钱，而不需要那么担心它了。那么节约生活等同于拥有大量的储蓄吗？实际上，答案是否定的。这个理念是尽可能简单地生活。


    那么，节约生活到底是什么？这个概念就是节省更多的钱。这是我能想到的最基本的定义。对于你们中的一些来说，这可能听起来太晦涩，但事实是，大多数人通过外表来判断。我同意他们；大多数时候人们渴望更多的物质。节约生活并不意味着你必须在没有任何东西的情况下生活。它意味着明智地选择你购买的东西。我们需要被自己认为自己的东西。这完全没有问题。节约生活还能提高你的创造性思维。如果你认真对待节约生活，那么你可以放心，通过这种方式你可以学到至少一项重要技能。你可以学习关于水管、木工甚至是硬件的知识。


    所以现在迫切的问题是，我如何开始节约？接下来的章节将帮助你理解节约生活的概念，以及可以立即开始的技巧。


    # 第2章


    ## 从最昂贵的开始


    以下是一些关于如何过上节约生活的技巧：


    - 家庭汽车：无论你有几个孩子，这并不重要。这个观点很简单：如果你是一个家庭，一辆车就足够了。你可能在想，如果父母双方都是上班族，这如何可能。如果你们的一天同一时间开始，全家人一起拼车。这个理念是，通过减少两辆车的油耗，你可以节省大量的资金。如果你们的时间不同或工作区域不同，那么可以平均分配驾驶权。你们可以轮流谁开车上班，谁乘坐公共交通。如果你是那个开车的人，那么你也有责任送孩子上学。这把任务分担给了你们双方，有助于节省大量资金。


    - 房屋的大小：我不理解为什么人们倾向于选择比他们需要的更大的房子。如果你是一个四口之家，那么一个三室的房子绰绰有余。如果客人突然到来，你可以让孩子们共用一个房间。我同意三室房子是一个很大的房子。当我说缩小房屋面积时，我的意思是只购买你将要使用的空间。如果你不需要家庭办公室，就没有必要购买额外的房间。


