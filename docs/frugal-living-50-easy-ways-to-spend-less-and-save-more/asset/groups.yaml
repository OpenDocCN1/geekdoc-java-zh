    # CHAPTER 4

    ## Health and Entertainment


    ## 16. Cut the Cable


    Cable TV is expensive. It might not be crazily expensive, but if you ask me, it
    is a totally unnecessary way to spend your money. If you want a brief idea, the
    cable TV costs on average 60 dollars a month in the USA. That is an equivalent
    of 720 dollars, a year. 60 dollars might sound cheap to you and maybe it is. However,
    the actual question is: do you need it? We live in the age of the internet. We
    can get almost everything we want for entertainment online. So having a cable
    subscription has become unnecessary for on-demand entertainment. Not having a
    television set means you will have more time to do other activities as well. This
    will help you grow as a family and also as a person.


    ## 17. Become a bookworm


    Books are great at entertainment; this is a fact that can be overlooked by many
    people. Books can create worlds, stories, and even give some great advice. So
    pick up books from the local library and read as often as possible. Libraries
    are great places for entertainment, and you can learn a lot too while you are
    at it. This will also help you to develop the habit of reading for your children
    from a very young age.


    ## 18. Free entertainment


    Not going to the movies or the bars around the place doesn''t mean you do not
    have a life. You need to understand that watching movies in theaters is expensive.
    The tickets may not be expensive but the food they sell be. If you go to the movies
    at night, you will have a strong impulse to eat out, or to hit the local bar before
    you return home. That costs a lot of money. You can save a lot of money by finding
    some great ways of entertainment which are both cheap, as well as more intimate.
    You can rent out a movie and make your own popcorn. You will get more popcorn
    for a fraction of the price. You can go out hiking, the zoo, or a museum.


    ## 19. Frugal exercise


    Obviously, the first step is to cancel your gym subscription. There is a difference
    between growing muscles and staying healthy. You can save a lot of money by cancelling
    your gym subscriptions and finding a way to exercise on your own. You can purchase
    a set of dumbbells. Go for a run or take a walk instead of walking or running
    on treadmill. Use the stairs to simulate the action of a cross trainer. You will
    find that you can replicate most of the exercises you do at a gym in your living
    room. All that is required is a little motivation to start.


    ## 20. Stay healthy and save money


    The amount of money we spend on medical care is astronomical. Hospitals, medicines,
    and general consultations are never free. I am not implying that you stay at home
    when you are sick. I am simply saying that prevention is better than trying to
    get a cure. Take care of your body, eat the right food, and exercise regularly.
    This should cut down your hospital needs by half.


    ## 21. Why subscribe?


    You may have subscribed to a local newspaper and to a few magazines. We believe
    that it is a really good investment. It does encourage the habit of reading, but
    you still have to spend some money on it. But why spend money on subscriptions?
    The internet is filled with all the news and information you would want to read
    from. So cancel all your newspaper and magazine subscriptions and read all you
    want online. You can unsubscribe from Netflix too if you are not an avid movie
    watcher. You can hire or borrow DVDs for a better rate, whenever you feel like
    watching a movie.


    # CHAPTER 5

    ## The Way You Travel


    ## 22. Use a bicycle


    I wonder why more people haven''t figured this out yet. Cycling is very refreshing
    and is also very good for the body! There are a few drawbacks, of course. If your
    place of work is too far away from your home, a bike can be ruled out. If however,
    you stay near your workplace, then there is no better option than riding a bike
    to work. You can get there quickly and at the same time, get some valuable exercise
    on the go. Let your spouse drive the car and you can enjoy the benefits of the
    bike.


    ## 23. Carpool if you can


    Again, carpooling is an obvious choice which most people simply ignore. Carpooling
    is a great option that not only saves you money but also helps you bond with your
    friends. What is the point of travelling alone in a car that is meant to carry
    four people? So if you have friends or coworkers living in your area, then the
    best idea for you is to carpool. This helps you save a lot of money. If this is
    not a possibility, then try to use public transportation as often as possible.
    Sometimes you might wake up early—if you do, use the public transportation because
    you have more time to use it.


    ## 24. Walk


    It is funny that these days most of us use a car to go to a nearby supermarket.
    We can always walk or jog if a store or a supermarket is nearby, instead of taking
    a car. If you do not want to think in terms of money, then simply think in terms
    of your health. There is no better exercise to walk regularly. We have legs to
    walk, not to drive. So use those legs for the purpose that they are meant for,
    as often as possible.


    ## 25. Travel frugally


    If you are planning on taking a vacation, then you can choose to travel frugally
    too. Avoid places that are major tourist hubs. There are places which are not
    so famous, but are equally beautiful. If you are planning on going to the Bahamas
    for the white sands, you can choose an alternate destination like Thailand. There
    are always countries that are cheaper to visit and it always helps to do your
    research beforehand. Remember that air travel tickets are astonishing expensive,
    so plan and book your tickets ahead of time.


    ## 26. Save on gas


    This may be another tip you must have been expecting in this topic. Gasoline prices
    are on the rise all over the world and they may continue to rise. So, it is important
    that we learn to save on gas as much as possible. It helps to reduce our budget
    and gives us a chance to contribute to keep planet safe. Here are a few tips to
    save some gas.


    - Keeping your vehicle in a good condition helps you to save a lot of gas. An
    engine that is not performing well will obviously take more gasoline to run.

    - Check your tires- Keeping your tires inflated will affect your mileage positively.

    - Avoid rush hours at all costs- If you cannot avoid rush hours when you commute
    to work, then get to work earlier and return a little later from work to avoid
    rush hour traffic.

    - Do not accelerate too much or too little. Try to drive as smoothly as possible.

    - You can always try to avoid using a car altogether when it is not required;
    there are quite a few errands which can be done without a car. So, walk or use
    a bicycle, whenever possible!


    # CHAPTER 6

    ## The Other Half of the List of Tips


    I made sure that I address all walks of your everyday lives, when it comes to
    living frugally. The first five chapters are specifically divided into the most
    common needs, we have. Here are the next set of tips which are more common and
    yet effective.


    ## 27. Simplify your life


    There is absolutely no need to hang on things you do not use. I agree there are
    a few things which are sentimental to us, like your first watch, or the pen your
    father gave you. I am not asking you to sell those precious possessions. You can
    sell your old furniture or old car that are never going to fix. The more you sell,
    the more money you will make. This will also make your life much simpler because
    you will be surrounded by things which are needed and that helps you understand
    the concept of frugal living, better.


    ## 28. Frugal gifting


    Gifts are a waste of money. I might sound too harsh, but I believe sometimes we
    push the limits on what is considered as good gifts. These days, kids expect an
    iPad or a PS4 as a gift for Christmas. I do not mean to say that gifting is wrong;
    I simply have a problem with the high expectations from gifting. You can always
    gift your child what he wants, but make sure that you teach him the value of money,
    from a young age.

