    and capitalism in general. But it is not so great if you are trying to live your
    life frugally. Do not avoid Christmas; instead try to be smart about your Christmas
    shopping. Shop for gifts when stores offer you discounted prices.


    # 49. Eat a breakfast, but a cheap one


    Breakfast is the most important meal in the day and you should not skip it if
