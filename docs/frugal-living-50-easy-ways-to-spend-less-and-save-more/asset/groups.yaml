    ## 29. Water, water, everywhere


    Water is good for your health. The truth is you can never consume too much. You
    can drink a lot of water in a day, and most of us do not actually drink enough.
    If you are really looking forward to improve your health and also stay frugal,
    then drink water whenever you need the urge to the drink something. I know that
    this tip sounds very obvious, but the truth is most of us, drink a lot of sodas
    or beverages, which are detrimental to our health. So, the next time you find
    yourself yearning for a cup of coffee, try drinking a glass of water. It is free
    as well as healthy.


    ## 30. Stack your errands


    Instead of running one or two errands, stack them up so that you can do all of
    them at a time. If they are urgent then you can ignore this point. But, all of
    us have errands that we can stack and do all at once. You will save a lot of gas
    as well as time and effort. Be smart about how you manage your errands.


    ## 31. Stay home


    The more you stay at home, the lesser you spend. There is simply no denying this
    fact. This might sound sad to some of you, but the fact is that staying at home
    doesn''t make you or your life boring. There is so much to learn and do at home.
    You can learn a lot of things by staying home and teaching yourself. If you have
    kids, then there are a lot of quality things you can do with your children to
    bond with them. You can even start a blog or reach out deep within yourself, to
    find your true passion. A lot of things are possible if you give time to yourself
    in a comfortable setting.


    ## 32. Say no to credit cards


    Credit cards are great. I know they are great, but only if you use them correctly.
    Credit cards are loans. You are buying things with a promise that you will pay
    it back. Unless you really need something, do not use your credit card. If you
    find yourself buying impulsively, the best course of action for you is to cancel
    your credit subscription for a while. This will help you to buy more pragmatically.
    In a recent study, it was found that the average spending has a debt of 8000 dollars.
    You need to be smart and avoid spending money you are not willing to spend.


    ## 33. Build things


    This might sound ridiculous, but it is possible. I am not saying that you should
    build a whole dining table for yourself. I agree that it takes several years before
    you can master the trade of carpentry. What I am suggesting is that you try to
    build something simpler instead. You can build yourself a crude bookshelf or a
    shoe rack. You can make this an activity with your kids. This will teach them
    to build things by themselves, and to be self-sufficient. You can find some great
    ideas online or you can learn some of the basic skills required when you go to
    the library. You will not only save money, but you will pick up a new skill as
    well.


    ## 34. Do it yourself


    Do you change the oil in your car yourself? Or do you just give it to a mechanic
    to handle? Changing the oil in a car is a relatively simple thing to do. You can
    find lot of information on this topic online. You can watch some videos before
    you do it by yourself. There are many other household chores that you can handle
    yourself, without seeking the help of a professional. Leaky faucets are easy to
    fix. You will be surprised to find exactly how many things in your house you can
    actually fix, all by yourself. So read, watch, and learn.


    ## 35. Interests are a no-go


    You need to start worrying about the interests you pay. If you already have a
    mortgage, make sure it is the last one. Interest needs to be avoided if you are
    trying to live frugally. Think about it—what are you getting in return for all
    the interest you pay? You should try and avoid mortgages and bank loans as much
    as you possibly can. If you are in need of cash, take a loan from family. As a
    follower of frugal living, you will have enough cash to pay them off in good time.


    ## 36. Say no easy-to-cook foods


    Once again, let me go back to the hot dog analogy. Why does the hot dog stand
    owner sell you a hot dog at such low prices? It is only because it is substantially
    cheaper to make a hot dog from the raw ingredients. So you should make sure you
    cook as much as you can from the natural ingredients. This might sound tedious,
    but the truth is that it''s not as hard as it sounds. Start simple and you will
    eventually get better and better at it. The reason why I am against ‘easy-to-cook’
    foods is simple. They cost more than the actual product, and they are likely to
    be less healthy than food made from natural ingredients without any preservatives.
    Cut back on packaged food and learn how to cook. Cooking is a great life skill
    to know and it is fun to learn, too. Spend your time learning about some great
    new ingredients and recipes.


    ## 37. Cut back on the use of your cellphone


    This is quite an unpopular opinion these days. 40 years ago there weren''t any
    cellphones and people still survived. So the truth is that you can obviously survive,
    without a cell phone. I agree that it has become a necessity to own a cellphone.
    Try to get a decent phone that is cost effective. Do not go for the most expensive
    brand. Use your phone only for work and emergencies. This will save you a lot
    of time and money too, and you will form stronger bonds with your friends and
    family as you will have more meaningful conversations with them the next time
    you meet them.


    ## 38. Repair and Recycle


    I have often seen people change an entire home setup because of a tiny glitch.
    But it is much cheaper to repair and maintain your home equipment as long as they
    are not too old and need to be replaced completely. The best way to start is with
    your personal computer. There is no point in buying a new computer every time
    you want to upgrade your computer. Try to upgrade parts of your computer according
    to your needs. If you find your computer too slow to run important software, then
    get the system requirements of that software, and buy the required parts. It might
    sound too hard to do, but you do not actually need a hardware expert to fix your
    computer. You can do it yourself, and you will find it very easy too. You can
    find a lot of help online that will address both the hardware and software issues.
    You should always try to repair and recycle instead of shopping for new things.


    ## 39. Groom yourself


    If you are not interested in this, you can skip this point. But the truth is you
    spend a lot of money in grooming yourself. I have heard of people complaining
    about not having enough money while at the same time, I would find these people
    visiting salons and beauty parlors to get their nails done. It is not hard to
    cut your hair. There are many videos you can refer to that help you do this. That
    said, you do not need to get hair done. Of course this takes practice but you
    should remember if you do not start, you will never know if you could be good
    at it.


    ## 40. Save electricity


    You may have guessed that this would be the last tip in this book. Saving electricity
    saves a lot of money and more importantly, it will give you a chance to saving
    our planet. Everyone talks about electricity but no one talks about how you can
    do it. Here are a few tips to save electricity:


    - Place your window conditioning units on windows that get the most shade.

    - Clean the air filters in your ACs and heaters occasionally. This will not only
    allow them to work more efficiently but also provide cleaner air for you.

    - Unplug appliances when you are not using them. There is something called leakage
    current that will continue to flow when you switch an appliance off. To stop this,
    you need to unplug them.

    - If it is hot outside, cover your windows. This will allow rooms to cool down
    faster.

    - You should always switch off lights and any other appliances when in use.


    ## 41. Look out for sales


    This is an obvious trick that I am sure most of you follow. But what most of you
    forget is that shouldn’t purchase new clothes or shoes if you do not have the
    need for them. Do not shop because you have a coupon, or because the store is
    offering a clearance sale. This will make you buy things that you do not need.
    The whole point of frugal living is to buy what you need and not what you want.
    There are a few exceptions to this rule too. For instance, if your child''s birthday
    is in a few months, you can purchase now when the sale available to save money.


    ## 42. Telecommute


    If you have your dream job, then you can go ahead and simply skip this tip. If
    you are stuck in a menial position, consider the option of working from home.
    You will save a lot of money and time cutting down on the travelling needs. You
    will find this option allows you to spend more time with yourself. This can be
    an advantage but at the same time, it may prove to be disadvantageous! If you
    are social person who likes to meet people regularly, you can ignore the idea
    of telecommuting as the only people you will be meeting face to face will be your
    family.

