    with programming languages that date back to C. This operator increments the value
    of the variable it applies to — in this case, the ++ operator is prefix if it
    comes before the operand and postfix if it comes after. Likewise, the - operator
    decrements the value of the variable it applies to by one, and can also be prefix
    or postfix. Operators


    ++ and are derived from the C programming language. In the above example operator


    ```

    i++;

    ```


    can be replaced by the expression


    ```

    i = i + 1;

    ```


    ```

    i +=;

    ```


    The value on the right side of the + = operator (that is, 1) is added to the value
    of the variable on the left side (i.e. i) and the result is written to the same
    variable. Most binary operators in Java (in other words, operators with two operands)
    can be similarly concatenated with the = operator.


