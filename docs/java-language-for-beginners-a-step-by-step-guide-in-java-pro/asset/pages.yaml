  md: 'The ability to create extended classes are one many strengths of object-oriented
    programming. When you extend a class to add functionality, it creates a so-called
    IsA relationship — the extension creates a new type of object that is “like” the
    original class. A similarity differs significantly from a HasA relationship, in
    which one object uses another to store information about its state or to perform
    its functions - it “owns” a reference to this object.


    Let''s take an example. Say we have a Point class that represents a point two-dimensional
    space as a pair of coordinates (x, y). The Point class can be extended and


    create Pixel class based on it representing a colored pixel on the screen. Pixel
    is “like” Point; whatever is true for a simple point will also hold for a pixel.
    In the Pixel class, you can include a mechanism for storing information about
    the color of the pixel, or a reference to the screen object where the pixel is
    located. Pixel is “like” a point (that is, it is a special case of it), since
    it is a point on a plane (screen) with an extended contract (the concept of color
    and screen is also defined for it).


    The correct choice is not obvious - different options may depend on the specific
    application. The only requirement is to make the application work, and in a meaningful
    way.


