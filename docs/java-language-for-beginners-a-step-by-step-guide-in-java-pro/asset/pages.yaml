  md: '# Package names


    The package name should be used only once, choosing a meaningful and unique name
    is an important aspect of package design. However, now that programmers around
    the world are developing packages in the Java language, it is impossible to figure
    out what package names they are using. Therefore, choosing a unique name presents
    some problem. If you are confident the package will only be used within your organization,
    then you can involve an internal arbiter in choosing the name of an internal arbiter
    to ensure that all packages have distinct names.


    Nevertheless, in our vast world, this approach will not work. Java package IDs
    are just plain names, so a good way to make them unique is to include the organization''s
    Internet domain name. If you work for Magic, Inc., an attribute package might
    be declared this:


    ```

    package COM.magic.attr;

    ```


    Note that the component names are in reverse order from the regular domain name
    and the top-level domain name (in this case, COM) is capitalized. This is to avoid
    conflicts with package names that do not follow this convention - their names
    may accidentally coincide with the top-level domain name, they are unlikely to
    be written in capital letters.


    If you follow this agreement, conflicts will arise not (unless within your organization).
    If problems do arise (in a very largeorganization), you can go ahead and refine
    the domain name. Many large companies have internal domains named east, europe,
    etc. You can refine the package name using the internal name:


    ```

    package COM.magic.japan.attr;

    ```


    This can make package names quite long, but this scheme is relatively safe — no
    one will use it choose a name that matches your package name.


    In many development environments, package names are reflected in the file system
    - it is often required that all programs from one package be located in a specific
    folder or directory, and the name of this directory corresponds to the name of
    the package. For details, see the documentation for your development environment.


    # Batch access


    Classes and interfaces included in a package have two access levels: package and
    public. A class or interface is available to programs outside of the package.
    Non-public types are package-scoped; they are available to all programs in the
    same package, but hidden outside the package, even from programs in nested packages.


    Class members also have access levels. A member not declared with the public keyword,
    or private can be used by any package, but is invisible outside the package. In
    other words, by default, identifiers have "batch" access, except for interface
    members, which are public.


    Fields or methods not in a package with the private keyword, are available for
    all programs in this package. Therefore, classes in the same package are considered
    "friendly" or "trustworthy". However, subpackages are not trusted in their external
    packages. For example, protected and batch IDs in the dit package are not available
    to programs in the dit.dat package and vice versa.


    # Package content


    If there is no declaration in the source file package, then the types it contains
    are considered to belong to an "unnamed" package.


    Package design should be considered carefully and only functionally related classes
    and interfaces should be included. The package classes are free to access each
    other''s non-private members. Class member protection is'
