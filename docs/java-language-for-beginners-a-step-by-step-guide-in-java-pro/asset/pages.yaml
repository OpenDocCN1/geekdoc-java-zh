  md: '# Chapter 2


    # CLASSES OBJECTS


    The fundamental unit of programming in Java is Class... The classes include -
    fragments of executable code in which all calculations take place. Classes also
    define the structure of objects and provide mechanisms for creating them based
    on the class definition. You can limit your programs to only primitive types (integers,
    real, etc.), but almost any non-trivial Java program creates objects and works
    with them.


    In-oriented programming, what is done and how it is done, there are clear differences.
    "What" is described as a collection of methods (and sometimes public data) and
    associated semantics. Such


    the combination (data and semantics) is often referred to as a contract between
    the developer of the class and the programmer using that class, as it determines
    what happens when specific methods of an object are called.

    It is generally assumed that the methods declared in a class constitute the entire
    content of its contract. In addition, the concept of a class also includes the
    semantics of these operations, though it can only be described in the documentation.
    Two methods may have the same name and signature, but will not be equivalent if
    they have different semantics. For example, you cannot assume that one could call
    a copy of an object''s print method and nest different semantics in its name —
    say, the term could be short for "process interval" or "prioritizing nonmetals".
    The contract (that is, the collection of signature and semantics) defines the
    essence of the method.


    The question "how" is answered by the class on which this object was created.
    Class defines the implementation of the methods supported by the object. Each
    object is an instance of a class. When you call a method on an object, the code
    to run is looked up in the class. The object can use other objects, however, we
    will start with simple classes in which all methods are implemented directly.


    # Simple class


    The main components of the class are fields (data) and methods (code for working
    with them). Here is a simple class Body designed to store information about celestial
    bodies:


    ```

    class Body {


    public String nameFor; public Body orbits;


    public static long nextID = 0;


    }

    ```


    First of all, the name of the class is declared. Class declaration in languageJava
    creates a type, so that in the future, references to objects of this type can
    be declared as follows:


    Body mercury;


    A declaration like this indicates that mercury is a reference to an object of
    the class Body. It does not create the object itself, but only declares a reference
    to it. Initially, the reference is null, and the object being referenced by it
    does not exist until you explicitly create it; in this respect Java differs from
    other programming languages in that objects are created when variables are declared.


    The first version of the Body class is poorly designed. This was intentional:
    as the class improves in this chapter, we can focus on some of the language''s
    features.'
