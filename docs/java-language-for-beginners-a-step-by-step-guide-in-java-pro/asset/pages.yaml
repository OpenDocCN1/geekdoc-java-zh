  md: '# Packages


    Name conflicts are a source of serious problems when developing reusable code.
    No matter how carefully you choose the names for your classes and methods, someone
    can use the same name for other purposes. Using simple names aggravates the problem
    - names are more likely to be used by else who also wants to use them. Words as
    such, get, clear, etc., are very common and are inevitable when using them.


    Many programming languages offer a standard solution - using a "package prefix"
    before each name of a class, type, global function. Prefix conventions create
    a naming context that prevents one from colliding with the names of another. Usually
    such prefixes are several characters long and are abbreviations of the name.


    package - example, Xt for "X Toolkit" or WIN32 for 32-bit Windows API.


    If the program consists of only a few packages, there is little chance of prefix
    conflicts. However, since prefixes are shorthand, the more packages increases,
    the likelihood of name collisions increases.

    Java has adopted a more formal concept a package in types and subpackages as members.
    Packages are hierarchical, with components separated by periods. When using a
    package component, you must enter its full name or import the package in whole
    or part. The hierarchical structure of package names allows you to work with longer
    names. It avoids naming conflicts — two packages have classes with the same name,
    you can use the name form to invoke them, which includes the package name.


    Here''s an example of a method that uses fully qualified names to display the
    current date and time using a Java helper class Date (which is covered in Chapter
    12):


    ```

    class Date1{

    public static void main (String [ ] args) (java.util.Date now = new java.util.Date());
    System.out.println(now);

    \}

    ```


    Now compare this example with another in which to declare the Date type using
    the import keyword:


    ```

    import java.util.Date;

    ```


    ```

    class Date2 {

    public static void main (String [ ] args) (Date now = new Date()); System.out.println(now);

    \}

    ```


    Java packages do not fully resolve the issue of conflicts names. Two different
    projects can give their packages the same name. This problem is solved only by
