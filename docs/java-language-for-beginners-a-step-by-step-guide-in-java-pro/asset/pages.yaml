  md: '# Chapter 10


    # PACKAGES


    Under the term "package" the union of related classes, interfaces, and subpackages
    is implied. The package concept is useful for several reasons:


    +   - Packages allow you to group related interfaces and classes.

    - The interfaces and classes included in the package can use popular names (like
    get or put) that make sense in this context, but conflict with the same names
    in other packages.


    +   - Plastic bag may include types and members that can be manipulated within
    the package. The corresponding identifiers are available to the package programs,
    but closed to external methods.


    Let''s take an example package for our attribute class in the previous chapters.
    Let''s call the package attr. Each source file where classes and interfaces belong
    to the attr package must indicate that they belong to the package by declaring
    package:


    package attr;


    This declares that all classes and interfaces defined in this source file are
    part of the attr package. The package declaration must appear at the very beginning
    of the file, before any class or interface declarations; there can be only one
    package declaration per file. The package name is an implicit prefix for all types
    included in the package.


    If a program outside a package will need to refer to the types included in it,
    it has two possibilities. The first is to prefix each type name with a prefix
    (package name). This is a reasonable option if you only have to deal with a few
    members of a package.


    Another way to access types is to import the package partially or completely.
    A programmer who wants to use the attr package can insert the following line at
    the beginning of his source file (after his package declaration, but before everything
    else);


    ```

    import attr *;

    ```


    It can then refer to the package types by simply name - for example, Attributed.
    A package implicitly imports itself, so that whatever is defined in it becomes
    available to all other package types.


    Package mechanisms and import help the programmer avoid potential name collisions.
    If a package intended for other purposes (say, linguistic) also contains a class
    Attributed, designed to store language attributes, then a programmer who wants
    to use both packages in one file has several options:


    +   - Address to types by their fully qualified names - for example, attr.Attributed
    and lingua.Attributed.


    - Import Attributed or attr. * And then use simple name


    Attributed instead of attr.Attributed and the full name is lingua.Attributed.


    +   - To do the opposite - import lingua.Attributed or lingua. * And then use
    simple attributed name instead of lingua. Attributed and the full name is attr.Attributed.'
