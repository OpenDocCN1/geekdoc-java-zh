    of i against itsparity. The if statement parses the value of the expression in
    parentheses. If it is true, then the first statement or block inside the if is
    executed. If the value is false, then the statement or block following the else
    keyword is executed. The else is not required; if else is absent and the condition
    is false, then the block is skipped.


    After executing one of the two possible branches of the if / else construction,
    control passed to the statement following the if statement.


