  md: '# Chapter 4


    # INTERFACES


    The basic design unit in Java is public methods, whichcan be called for objects.
    Interfaces are designed to declare types consisting only of abstract methods and
    constants; they allow you to define arbitrary implementations for these methods.
    An interface is an expression of pure design concept, whereas a class is a mixture
    of design and concrete implementation.


    Methods included in the interface can be implemented in a class as the designer
    of the class sees fit. Consequently, interfaces have significantly more implementation
    possibilities than classes.


    +   * Example interface


    In the previous chapter, we introduced the Class attr and showed how to extend
    it to create specialized objects with attributes. Now there are two approaches
    to this: composition and inheritance. You can create a set of specific attributes
    on an object and give the programmer access to that. The second method is that
    you treat the attributes of an object as part of its type and include them in
    the class hierarchy. Both approaches are perfectly valid; we believe that storing
    attributes in a class hierarchy is more beneficial. We will create an Attributed
    type that can be used to give attributes to objects by attaching Attr objects
    to them.


    Java only supports single inheritance (single inheritance) when implemented, means
    that a new class can be a direct extension of just one class. If you create an
    Attributed class from which other classes derive, then you have to base the entire
    hierarchy on Attributed, or programmers will have to choose whether to extend
    the Attributed class or some other class.


    Every time you create a useful tool like Attributed, you would want to include
    it in the root Object class. If it were allowed, the Object class would soon grow
    so large that it would be impossible to work with it.


    Java allows multiple inheritance of interfaces, so instead of include the capabilities
    of the Attributed class in Object, we will design it as an interface.


    For example, to give attributes to our class of celestial bodies, we can declare
    it in the following way:


    ```

    void add(String newAttr); Attr find(String attrName);

    ```


    ```

    Attr remove(String attrName); java.util.Enumeration getAttrs();

    }

    ```


    This interface declares four methods. The first adds a new attribute to the Attributed
    object; the second checks whether the attribute with the specified name was previously
    included in the object; the third removes the attribute from the object; the fourth
    returns a list of attributes attached to the object. The latter uses the Enumeration
    interface for Java collections. java.util.Enumeration is covered in detail in
    Chapter 12...


    All methods included in the interface are implicitly declared; since the interface
    cannot contain its own implementation of the methods declared in it. Therefore
    there is no need to declare them with the abstract keyword. Every class that implements
    an interface must implement all of its methods; if the class implements only some
    of the interface methods, such a class (without fail) is declared abstract.


    Interface methods are always public. They cannot be static, since static methods
    always refer to a specific class and are never abstract, and an interface can
    only include abstract methods.'
