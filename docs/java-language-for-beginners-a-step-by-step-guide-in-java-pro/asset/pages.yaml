  md: '# Chapter 7


    # EXCEPTIONS


    During its operation, the application sometimes encounters all sorts of abnormal
    situations. When calling a method of some object, it can detect internal problems
    (incorrect values of variables), find errors in other objects or data (for example,
    in a file or a network address), determine the fact of violation of its basic
    contract (reading data from a closed stream), and so on.


    Many programmers do not check all possible sources of errors, and there is a good
    reason for that: if you analyze every conceivable error with each method call,
    the program becomes completely incomprehensible. Thus, a compromise is reached
    between correctness (checking for all errors) and clarity (avoiding cluttering
    the main program logic with many checks).


    Exceptions provide a convenient way to check for errors cluttering the text. In
    addition, exceptions directly signal errors, and do not change the value of flags
    or any fields, which then need to be checked.


