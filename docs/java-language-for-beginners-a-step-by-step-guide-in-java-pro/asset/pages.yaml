  md: '# Chapter 13


    # APPLICATION OF TYPES


    # IN PROGRAMMING


    Types in Java are represented by classes. For almost everyone of the primitive
    types (int, boolean, etc.) there is a separate class known as the wrapper; in
    addition, there is a class, Class, which represents the types of classes and interfaces.
    Such classes have the following advantages:


    +   * Useful static methods for a primitive type get a natural "residence". For
    example, the methods for converting a string to float are static methods of the
    Float class

    * The same is true for descriptive methods and fields. Each of the classes for
    primitive numeric types contains constants MIN_VALUE and MAX_VALUE; using the
    Class object, you can access methods that describe the supertypes of a class

    * For values that are primitive types, these objects are used in any context,
    where a reference to the Object class is required. For this reason, classes for
    primitive types are called wrapper classes.


    ![](img/ac1c09502d2efa764b825a7e05789e9f_199_0.png)


    The type hierarchy for these classes is as follows:

    There are no classes for short or byte, as these types are used primarily for
    memory reasons. All arithmetic calculations for short and byte are performed with
    expressions of type int. Use the Integer class to store a short or byte value
    in an. Unfortunately, this also means that the MIN_VALUE and MAX_VALUE constants
    are missing for the byte and short types.


    This chapter shows you how to use wrapper classes. The first part of the chapter
    discusses Class objects, which represent concrete classes and interfaces.


    The remainder of this chapter focuses on programming with classes- wrappers for
    primitive types.


    # Class Class


    For each class and interface in the system, there is a representative Class object.
    This object can be used to get basic information about a class or interface to
    create new objects of the class.


    The Class class allows you to navigate the type hierarchy in your program. In
    a hierarchy actually becomes part of the software, which makes it easier to debug
    and automatic documentation, and also makes the program more consistent. In addition,
    this opens up new possibilities for working with classes - primarily for creating
    objects (their type can be specified as a string) and calling classes using special
    techniques (for example, loading over the network).


    There are two ways to get a Class object: query it from an existing object using
    the getClass method, or search for it by the qualified (including all package
    names) name using the static Class.forName method.'
