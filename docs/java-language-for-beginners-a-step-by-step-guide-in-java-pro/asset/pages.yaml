    # Appendix B


    # Runtime exceptions in Java


    The Java runtime throws exceptions of two main kinds: runtime exceptions,


    ending the RuntimeException class, and that ensure the Error class. Both types
    of exceptions are unchecked (see section 7.3). The top of the exception hierarchy
    looks like this:


    Error exceptions signal very serious problems, after which the program usually
    terminates, and should never (or most never) be intercepted. Error exceptions
    are not extensions of RuntimeException, so a programmer to write a generic catch
    clause to catch all Exceptions and RuntimeExceptions (usually shouldn''t) be able
    to catch Errors. Of course, after any exception occurs, the final conditions of
    the try statements will be met, except all necessary actions.


    The programmer can independently expand RuntimeException and Error classes to
    create your own variants of unchecked exceptions — that is, can be thrown without
    specifying them in the throws clause. We are reporting this for only one reason
    - so you know你应该.


    The throws clause is provided precisely so when the method is called, all possible
    aspects of its behavior are visible. Hiding your exception from RuntimeException
    or Error, you are falsely reporting it (as if it were triggered by the runtime
    system).


    Also, others reading your program, assume that the throws clause gives them information
    about the possible behavior of your method; you are violating this assumption.'
