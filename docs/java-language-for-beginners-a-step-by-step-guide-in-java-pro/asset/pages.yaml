  md: '# Thread safety and


    # ThreadGroup


    When programming the work of several threads (some of which are created by library
    calls), it can be useful to partially limit the capabilities that the threads
    do not interfere with each other.


    Threads are divided into thread groups for security purposes. A thread group can
    be part of another group, which allows you to create a certain hierarchy. Streams
    within a group can modify other streams in the same group, as well as groups lower
    in the hierarchy. A thread cannot modify threads outside of its own and all subordinate
    groups.


    These restrictions are used to protect threads from arbitrariness by other threads.
    If new threads are placed in a separate group within an existing group, the priorities
    of the spawned threads can change, but the new threads will not be able to affect
    the priorities of existing threads or any threads outside your group.


    Each thread belongs to a certain group. Limitations imposed on streams,members
    of the group are described by the ThreadGroup object. The group can be specified
    in the constructor of the stream; by default, each new thread is placed in the
    same group, in


    which includes its creator. After the end of the stream, the corresponding objtreimoved
    from the group.


    # public Thread(ThreadGroup, String name)


    Constructs a new stream with the given name (may be null),


    belonging to a specific group.


    Once the object is created, you cannot modify the associated ThreadGroup object.
    To find out which group thread belongs to, call its get method. In addition, you
    can check if the stream can be modified by calling its AccessMethod. This method
    throws a SecurityException if you cannot modify the stream, and simply exits otherwise
    (the method is void).


    Thread groups are daemon groups. Such groups are automatically destroyed when
    there are no threads left in them. The fact that a group is a daemon group does
    not in any way affect the "demonism" of the streams or groups belonging to it.
    The status of a daemon group only determines what happens to it when the group
    becomes empty.


    Threadgroups can also be used to set the maximum priority of threads that are
    included in it. After calling the setPriority method, which sets the maximum priority
    of a group, any attempt to raise the priority of a thread will inconicuously decrease
    it to the declared maximum. Calling this method does not affect existing threads.
    To make sure that the priority of some thread always exceed the priority of all
    other threads in the group, set its priority to MAX_PRIORITY, and then set the
    maximum priority of the group to MAX_PRIORITY-1. The limitation also applies to
    the group itself - if you try to set its priority to a higher value than the current
    value, the request will be imperceptibly ignored:


    ```

    static void maxThread (Thread thr) ThreadGroup grp = thr.currentThread();setPriority(Thread.MAX_PRIORITY-1);grp.setPriority(thr.getPriority()
    - 1));

    ```


    This method sets the highest priority for a thread and drops the maximum allowed
    group priority below that thread''s priority. The new priority is one lower than
    the group priority, not Thread.MAX_PRIORITY-1, because the current group maximum
    may restrict your right to set a thread to the MAX_PRIORITY. You want the priority
    of a thread to be the highest possible in a given group, and the maximum priority
    of a group to be below it, no matter what the specific values are.'
