    refuses to allow other threads CPU time they will remain permanently blocked.
    By calling yield() the thread is generously saying “who else wants a turn?”. In
    reality it is unreliable and isn’t normally used. The implementation can be different
    on any system or JVM, and can often be different between Java versions. There
    is no guarantee of what other thread will get the next access, nor when your thread
    will next get an opportunity to run.


    **Q: What does interrupt() do?**


    You may have noticed that a number of Thread related methods (most commonly Thread.sleep())
    force you to catch an InterruptedException. If we need to suggest to a Thread
    it needs to stop for whatever reason we can do this by calling interrupt() on
    it. This sets the “interrupted” flag on the target thread. If the target thread
    chooses to check this flag (using the interrupted() or isInterrupted()) then it
    can optionally throw an Exception (usually Interrupted exception). It is predicated
    on the target Thread actually checking this.


    However there are a number of methods, such as Thread.sleep() which automatically
    poll for this flag. If the target thread is running one of these then an InterruptedException
    will be thrown straight away.


    **Q: What does join() do?**


    join() will simply tell the currently running thread to wait until completion
    of whichever thread join() is called on completes.


