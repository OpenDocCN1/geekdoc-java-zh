- fmt: '

    The same applies when removing objects; all object references after it have to
    be copied forward one space. There is an even worse case. On creating an `ArrayList`
    it starts with a fixed length `Array` (whose length you can set in the constructor,
    or the default is 10). If the capacity needs to increase over this, the collection
    has to create a brand new array of greater length and copy all the references
    to it which can be really slow.


    Where `ArrayList` succeeds is access speed; As the array is in contiguous memory
    it means that if you request object 999 of 1000, you can calculate exactly where
    in memory the reference is with no need to traverse the full collection. This
    gives constant time access which is fast.


    So, `ArrayLists` make a great choice if you have a set of data that is unlikely
    to be modified significantly, and you need speedy read access.


    # Hash Implementation


    ### Examples: HashSet, HashMap

    The `HashMap` is a complicated beast in itself and is a good choice for an interview
    question as it is easy to add extending questions to.


    **Q: How does a `HashMap` work?**


    **Q: Why does the `hashcode` of the key matter?**


    **Q: What happens if two objects have the same `HashCode`?**


    **Q: How does the `Map` select the correct object if there is a clash?**


    Interestingly `HashSet` is backed by `HashMap`, so for the purpose of this I will
    just discuss the latter. A `HashMap` works like this: under the covers a `HashMap`
    is an array of references (called the `Entry Table`, which defaults to 16 entries)
    to a group of `LinkedLists` (called `Buckets`) where `HashEntry`s are stored.
    A `HashEntry` is an object containing the key and associated object.


    ![](index-45_1.jpg)


    All instances of `Object` have a method, `hashCode()`, which returns an `int`.
    The `hashcode` is usually a value derived from the properties of an object. The
    `hashcode` returned from an object should be consistent and equal objects must
    return the same `hashcode`. This property can then be used to determine which
    bucket to put it in based on the index of the entry table; For example, in the
    above example with 4 spaces in the entry table, if I have a key in with `HashCode`
    123456, I can do `12345 % 4 = 1`, so I would place my object in bucket 1.


    This makes object retrieval very quick. In my example, if I try to retrieve the
    object for my key then all I need to do is the same mod calculation to find the
    bucket and it’s the first entry. Exceptionally quick.


    This can get more complicated. What if I have two more objects, `HashCode` of
    “5” and “9”? They both have a (modulus 4) of 1 so would both be put into bucket
    1 too. Now when I use my “9” key to retrieve my object the `HashMap` has to iterate
    through a `LinkedList`, calling `.equals()` on the keys of each `HashEntry`.


    ![](index-46_1.jpg)


    This is slow! Fortunately, this shouldn’t happen often. Although collisions will
    naturally occur, the intention is that objects will be spread evenly across the
    entry table with minimal collisions. This relies on a well implemented `hashcode`
    function. If the `hashcode` is poor (e.g., always return 0) then you will hit
    collisions.


    To further try and reduce the chance of this, each `HashMap` has a `load factor`
    (which defaults to 0.75). If the entry table is more full than the load factor
    (e.g. if more than 75% of the entry table has entries) then, similar to the `ArrayList`,
    the `HashMap` will double the size of the entry table and reorder the entries.
    This is known as rehashing.


    # Tree Implementation


    ### Examples: TreeMap, TreeSet

    The `Tree` implementation is completely different to any of the data structures
    we’ve considered before and is considerably more complicated. It is based on a
    Red Black tree, a complicated algorithm which you’re unlikely to get asked about
    (if you’re really keen then watch http://www.csanimated.com/animation.php?t=Red-black_tree).
    Values are stored in an ordered way, determined either by the natural ordering
    of the object or using a `Comparable` passed in as part of the constructor. This
    means on all implementations the collection will re-sort itself to maintain this
    natural order. When retrieving items it is necessary to navigate the tree, potentially
    traversing a large number of nodes for sizeable collections. The important thing
    to note from your perspective: This is slower than HashMap. Considerably slower.
    If speed is the goal then always use a `HashMap` or `HashSet`. However, if ordering
    is important then `TreeMap/TreeSet` should be your collection of choice.


    # Multithreading and collections


    Collections and Threading are intrinsically linked; many of the core problems
    related to Threading are regarding shared data access. How can we access data
    from multiple threads in a fast yet safe fashion?


    ## How do I create a Thread Safe collection?


    The easiest way to make something threadsafe if to make it immutable. An immutable
    object is one whose state cannot be altered. If it cannot change then it is safe
    for all threads to read it without any problems. This can be achieved in Java
    using the `Collections.unmodifiable` methods.


    ```

    1 Collections.unmodifiableCollection

    2 Collections.unmodifiableSet

    3 Collections.unmodifiableSortedSet

    4 Collections.unmodifiableList

    5 Collections.unmodifiableCollection

    6 Collections.unmodifiableMap

    7 Collections.unmodifiableSortedMap

    ```


    All of these collections act as a wrapper around a standard collection and guarantee
    access safety; any attempts to modify the collection will result in an `UnsupportedOperationException`.
    However, this is only a view on the data. If everyone is accessing via the unmodifiable
    version.


    ```

    1 LinkedList<String> words = new LinkedList<>();

    2 words.add("Hello");

    3 words.add("There");

    4 List<String> unmodifiableList = Collections.unmodifiableList(words);

    5 System.out.println(unmodifiableList);

    6 words.add("Cheating");

    7 System.out.println(unmodifiableList);

    ```


    8 *result:*

    9 *[Hello, There]*

    10 *[Hello, There, Cheating]*


    As a result this isn’t really immutable. Such things as `ImmutableList` do exist
    in third party libraries such as Google Guava, but not in the core language. It’s
    also important to note that immutable collections don’t normally satisfy the needs
    of our programs; Often data needs to be written and read, so we need a bigger
    solution.


    In Java 5, the java.util.concurrent package was introduced with the specificific
    aim of making life easier for dealing with collections in a thread safe way.


    **Q: Tell me about the java.util.concurrent package that was introduced in Java
    5.**


    **Q: Why is it important? Why does it matter?**


    The guys who write Java are smarter than you or me (or they should be). Instead
    of everyone having to write their own implementation to ensure thread safety,
    making sure the right things were locked in the right places without destroying
    performance, java.util.concurrent provides a number of collection types which
    guarantee Thread safety with the minimum performance impact.


    It also introduced a bunch of other cool Thread related features, which will be
    covered in the Threading chapter.


    ### The Queues


    ConcurrentLinkedDeque


    ConcurrentLinkedQueue


    LinkedBlockingQueue


    LinkedBlockingDeque


    LinkedTransferQueue


    PriorityBlockingQueue


    ArrayBlockingQueue


    That’s a lot of queues (and double ended queues, a deque)! The key things to note:
    A Blocking queue will block a consumer/producer when the queue is empty/full.
    This is a necessary mechanism to allow a producer/consumer pattern. The `BlockingQueue`
    interface has `put()` and `take()` methods to allow for this.


    A Transfer queue is a blocking queue, with extra methods to allow a consumer to
    wait for a message to be consumed.


    A Priority queue will order elements based on their natural ordering or using
    a comparator passed in at construction time.

