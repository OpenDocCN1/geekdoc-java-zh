- fmt: '

    When a `GC` happens it is necessary to completely pause the threads in an application
    whilst collection occurs. This is known as Stop The World. For most applications
    long pauses are not acceptable. As a result it is important to tune the garbage
    collector to minimise the impact of collections to be acceptable for the application.


    ## Q: How does Generational GC work? Why do we use generational GC? How is the
    Java Heap structured?


    It is important to understand how the `Java Heap` works to be able to answer questions
    about `GC`. All objects are stored on the `Heap` (as opposed to the `Stack`, where
    variables and methods are stored along with references to objects in the heap).
    Garbage Collection is the process of removing Objects which are no longer needed
    from the `Heap` and returning the space for general consumption. Almost all `GCs`
    are “generational”, where the `Heap` is divided into a number of sections, or
    generations. This has proven significantly more optimal which is why almost all
    collectors use this pattern.


    ## New Generation


    ### Q: What is the New Generation? How does it help to minimise the impact of
    GC?


    Most applications have a high volume of short lived objects. Analyzing all objects
    in an application during a `GC` would be slow and time consuming, so it therefore
    makes sense to separate the shortlived objects so that they can be quickly collected.
    As a result all new Objects are placed into the new generation. New gen is split
    up further: `Eden Space`: all new objects are placed in here. When it becomes
    full, a `minor GC` occurs. all objects that are still referenced are then promoted
    to a `survivor space` Survivor spaces: The implementation of survivor spaces varies
    based on the `JVM` but the premise is the same. Each `GC` of the `New Generation`
    increments the age of objects in the survivor space. When an object has survived
    a sufficient number of `minor GCs` (defaults vary but normally start at 15) it
    will then be promoted to the `Old Generation`. Some implementations use two survivor
    spaces, a `From space` and a `To space`. During each collection these will swap
    roles, with all promoted `Eden` objects and surviving objects move to the `To
    space`, leaving `From` empty.


    ### Q: What is a minor GC?


    A garbage collection in the `NewGen` is known as a `minor GC`. One of the benefits
    of using a `New Generation` is the reduction of the impact of fragmentation. When
    an Object is garbage collected, it leaves a gap in the memory where it was. We
    can compact the remaining Objects (a stop-the-world scenario) or we can leave
    them and slot new Objects in. By having a `Generational GC` we limit the amount
    that this happens in the `Old Generation` as it is generally more stable which
    is good for improving latencies by reducing stop the world. However if we do not
    compact we may find Objects cannot just fit in the spaces inbetween, perhaps due
    to size concerns. If this is the case then you will see objects failing to be
    promoted from `New Generation`.


    ## Old Generation


    ### Q: Explain what the old generation is?


    Any objects that survive from survivor spaces in the `New Generation` are promoted
    to the `Old Generation`. The `Old Generation` is usually much larger than the
    `New Generation`.


    When a `GC` occurs in old gen it is known as a `full GC`. `Full GCs` are also
    stop-the-world and tend to take longer, which is why most `JVM` tuning occurs
    here. There are a number of different Algorithms available for Garbage Collection,
    and it is possible to use different algorithms for new and old gen.


    ### Q: What type of Garbage Collectors are there?


    * **Serial GC**: Designed when computers only had one CPU and stops the entire
    application whilst `GC` occurs. It uses `mark-sweep-compact`. The collector goes
    through all of the objects and marks which objects are available for Garbage Collection,
    before clearing them out and then copying all of the objects into contiguous space
    (so therefore has no fragmentation).

    * **Parallel GC**: Similar to Serial, except that it uses multiple threads to
    perform the `GC` in order to be faster.

    * **Concurrent Mark Sweep (CMS)**: `CMS GC` minimises pauses by doing most of
    the `GC` related work concurrently with the processing of the application. This
    minimises the amount of time when the application has to completely pause and
    so lends itself much better to applications which are sensitive to this. `CMS`
    is a non compacting algorithm which can lead to fragmentation problems. The `CMS`
    collector uses `Parallel GC` for the young generation.

    * **G1GC (garbage first garbage collector)**: A concurrent parallel collector
    that is viewed as the long term replacement for `CMS` and does not suffer from
    the same fragmentation problems as `CMS`.


    ### Q: Which is better? Serial, Parallel or CMS?


    It depends entirely on the application. Each one is tailored to the requirements
    of the application. `Serial` is better if you’re on a single CPU, or in a scenario
    where there are more VMs running on the machine than CPUs. `Parallel` is a throughput
    collector and really good if you have a lot of work to do but you’re ok with pauses.
    `CMS/G1GC` is the best of the options if you need consistent responsiveness with
    minimal pauses.


    ## PermGen


    ### Q: What is the PermGen?


    The `PermGen` is where the `JVM` stores the metadata about classes. It no longer
    exists in Java 8, having been replaced with `metaspace`. Generally the `PermGen`
    doesn’t require any tuning above ensuring it has enough space, although it is
    possible to have leaks if `Classes` are not being unloaded properly.


    ## From the code


    ### Q: Can you tell the system to perform a garbage collection?


    This is an interesting question: the answer is both yes and no. We can use the
    call `System.gc()` to suggest to the `JVM` to perform a garbage collection. However,
    there is no guarantee this will do anything. As a java developer, we don’t know
    for certain what `JVM` our code is being run in. The `JVM` spec makes no guarantees
    on what will happen when this method is called. There is even a startup flag,
    `-XX:+DisableGC`, which will stop this from doing anything.


    It is considered bad practice to use `System.gc()`.


    ### Q: What does finalize do?


    `finalize()` is a method on `java.lang.Object` so exists on all Objects. The default
    implementation does nothing. It is called by the garbage collector when there
    are no more references to the object. As a result there are no guarantees the
    code will ever executed and so not be used to execute actual functionality. Instead
    it is used for clean up, such as file references. It will never be called more
    than once on an object (by the `JVM`).


    ## JVM Tuning


    ### Q: What flags can I use to tune the JVM?


    There are textbooks available on tuning the JVM for optimal Garbage Collection.
    You’ll never them all! Nonetheless it’s good to know a few for the purpose of
    interview.


    * `-XX:UseConcMarkSweepGC`: Use the `CMS` collector for the Old Gen.

    * `-XX:UseParallelGC`: Use `Parallel GC` for New Gen

    * `-XX:UseParallelOldGC`: Use `Parallel GC` for Old and New Gen.

    * `-XX:HeapDumpOnMemoryError`: Create a thread dump when the application runs
    out of memory. Very useful for diagnostics.

    * `-XX:PrintGCDetails`: Log out details of Garbage Collection.

    * `-Xms512m`: Sets the initial heap size to 512m `-Xmx1024m`: Sets the maximum
    heap size to 1024m

    * `-XX:NewSize` and `-XX:MaxNewSize`: Specifically set the default and max size
    of the New Generation

    * `-XX:NewRatio=3`: Set the size of the Young Generation as a ratio of the size
    of the Old Generation.

    * `-XX:SurvivorRatio=10`: Set the size of Eden space relative to the size of a
    survivor space.


    ## Diagnosis


    Whilst all of the questions above are very good to know to show you have a basic
    understanding of how the `JVM` works, one of the most standard questions during
    an interview is this:


    **Have you ever experience a memory leak? How did you diagnose it?**

    '
  raw: 'When a GC happens it is necessary to completely pause the threads in an application
    whilst collection occurs. This is known as Stop The World. For most applications
    long pauses are not acceptable. As a result it is important to tune the garbage
    collector to minimise the impact of collections to be acceptable for the application.


    **Q: How does Generational GC work? Why do we use generational GC? How is the**
    **Java Heap structured?**


    It is important to understand how the Java Heap works to be able to answer questions
    about GC. All objects are stored on the Heap (as opposed to the Stack, where variables
    and methods are stored along with references to objects in the heap). Garbage
    Collection is the process of removing Objects which are no longer needed from
    the Heap and returning the space for general consumption. Almost all GCs are “generational”,
    where the Heap is divided into a number of sections, or generations. This has
    proven significantly more optimal which is why almost all collectors use this
    pattern.


    **New Generation**


    **Q: What is the New Generation? How does it help to minimise the impact of GC?**


    Most applications have a high volume of short lived objects. Analyzing all objects
    in an application during a GC would be slow and time consuming, so it therefore
    makes sense to separate the shortlived objects so that they can be quickly collected.
    As a result all new Objects are placed into the new generation. New gen is split
    up further: Eden Space: all new objects are placed in here. When it becomes full,
    a minor GC


    occurs. all objects that are still referenced are then promoted to a **survivor
    space** Survivor spaces: The implementation of survivor spaces varies based on
    the JVM but the premise is the same. Each GC of the New Generation increments
    the age of objects in the survivor space. When an object has survived a sufficient
    number of minor GCs (defaults vary but normally start at 15) it will then be promoted
    to the Old Generation. Some implementations use two survivor spaces, a From space
    and a To space. During each collection these will swap roles, with all promoted
    Eden objects and surviving objects move to the To space, leaving From empty.


    **Q: What is a minor GC?**


    A garbage collection in the NewGen is known as a **minor GC**. One of the benefits
    of using a New Generation is the reduction of the impact of fragmentation. When
    an Object is garbage collected, it leaves a gap in the memory where it was. We
    can compact the remaining Objects (a stop-the-world scenario) or we can leave
    them and slot new Objects in. By having a Generational GC we limit the amount
    that this happens in the Old Generation as it is generally more stable which is
    good for improving latencies by reducing stop the world. However if we do not
    compact we may find Objects cannot just fit in the spaces inbetween, perhaps due
    to size concerns. If this is the case then you will see objects failing to be
    promoted from New Generation.


    **Old Generation**


    **Q: Explain what the old generation is?**


    Any objects that survive from survivor spaces in the New Generation are promoted
    to the Old Generation. The Old Generation is usually much larger than the New
    Generation.


    When a GC occurs in old gen it is known as a **full GC.** Full GCs are also stop-the-world
    and tend to take longer, which is why most JVM tuning occurs here. There are a
    number of different Algorithms available for Garbage Collection, and it is possible
    to use different algorithms for new and old gen.


    **Q: What type of Garbage Collectors are there?**


    *Serial GC*


    Designed when computers only had one CPU and stops the entire application whilst
    GC


    occurs. It uses **mark-sweep-compact**. The collector goes through all of the
    objects and marks which objects are available for Garbage Collection, before clearing
    them out and then copying all of the objects into contiguous space (so therefore
    has no fragmentation).


    *Parallel GC*


    Similar to Serial, except that it uses multiple threads to perform the GC in order
    to be faster.


    *Concurrent Mark Sweep (CMS)*


    CMS GC minimises pauses by doing most of the GC related work concurrently with
    the processing of the application. This minimises the amount of time when the
    application has to completely pause and so lends itself much better to applications
    which are sensitive to this. CMS is a non compacting algorithm which can lead
    to fragmentation problems. The CMS collector uses Parallel GC for the young generation.


    *G1GC (garbage first garbage collector)*


    A concurrent parallel collector that is viewed as the long term replacement for
    CMS and does not suffer from the same fragmentation problems as CMS.


    **Q: Which is better? Serial, Parallel or CMS?**


    It depends entirely on the application. Each one is tailored to the requirements
    of the application. Serial is better if you’re on a single CPU, or in a scenario
    where there are more VMs running on the machine than CPUs. Parallel is a throughput
    collector and really good if you have a lot of work to do but you’re ok with pauses.
    CMS/G1GC is the best of the options if you need consistent responsiveness with
    minimal pauses.


    **PermGen**


    **Q: What is the PermGen?**


    The PermGen is where the JVM stores the metadata about classes. It no longer exists
    in Java 8, having been replaced with metaspace. Generally the PermGen doesn’t
    require any tuning above ensuring it has enough space, although it is possible
    to have leaks if Classes are not being unloaded properly.


    **From the code**


    **Q: Can you tell the system to perform a garbage collection?**


    This is an interesting question: the answer is both yes and no. We can use the
    call


    “System.gc()” to suggest to the JVM to perform a garbage collection. However,
    there is no guarantee this will do anything. As a java developer, we don’t know
    for certain what JVM


    our code is being run in. The JVM spec makes no guarantees on what will happen
    when this method is called. There is even a startup flag, -XX:+DisableExplicitGC,
    which will stop this from doing anything.


    It is considered bad practice to use System.gc().


    **Q: What does finalize() do?**


    finalize() is a method on java.lang.Object so exists on all Objects. The default
    implementation does nothing. It is called by the garbage collector when it determines
    there are no more references to the object. As a result there are no guarantees
    the code will ever be executed and so should not be used to execute actual functionality.
    Instead it is used for clean up, such as file references. It will never be called
    more than once on an object (by the JVM).


    **JVM Tuning**


    **Q: What flags can I use to tune the JVM and GC?**


    There are textbooks available on tuning the JVM for optimal Garbage Collection.
    You’ll never know them all! Nonetheless it’s good to know a few for the purpose
    of interview.


    **-XX:-UseConcMarkSweepGC:** Use the CMS collector for the Old Gen.


    **-XX:-UseParallelGC:** Use Parallel GC for New Gen


    **-XX:-UseParallelOldGC:** Use Parallel GC for Old and New Gen.


    **-XX:-HeapDumpOnOutOfMemoryError:** Create a thread dump when the application
    runs out of memory. Very useful for diagnostics.


    **-XX:-PrintGCDetails:** Log out details of Garbage Collection.


    **-Xms512m:** Sets the initial heap size to 512m **-Xmx1024m:** Sets the maximum
    heap size to 1024m


    **-XX:NewSize and -XX:MaxNewSize:** Specifically set the default and max size
    of the New Generation


    **-XX:NewRatio=3:** Set the size of the Young Generation as a ratio of the size
    of the Old Generation.


    **-XX:SurvivorRatio=10:** Set the size of Eden space relative to the size of a
    survivor space.


    **Diagnosis**


    Whilst all of the questions above are very good to know to show you have a basic
    understanding of how the JVM works, one of the most standard questions during
    an interview is this:


    **Have you ever experience a memory leak? How did you diagnose it?**'
