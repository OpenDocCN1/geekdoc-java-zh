    通过将某些声明为 `final`，你可以防止它们被重写。然而，没有什么是完美的，狡猾的开发者始终可以使用 `Reflection` 来绕过这一点，或者直接将你的代码复制粘贴到他们自己的
    `class` 版本中。防止你的方法或类被重写通常不是一个好主意，你应该编写防御性代码来体现这一点。


    ## 数据结构


    Java 数据结构面试题会出现在你的面试中。作为一名程序员，核心在于处理数据、将其从一种格式转换并输出另一种格式，这就是为什么理解底层原理以及它如何影响你的应用程序是如此重要。让我感到困惑的是，竟然有这么多年不知道用什么
    `collection` 来支撑 `ArrayList`（提示：就在名字里）。从面试官的角度来看，关于数据结构的问题揭示了关于候选人的大量信息。它们展示了候选人对
    `java` 的工作原理是否有核心理解。


    更好的是，它提供了一个平台，可以引导出设计、算法等更广泛的问题。在日常 `java` 编程中，你大部分时间都会花在 `ArrayList`、`LinkedList`
    和 `HashMap` 上。因此，回顾一下你久没看过的集合和算法是有意义的，根据我的经验，公司非常喜欢问这类问题。


    ### 问题：什么是 Java 集合框架（Collection Framework）？


    ### 问题：Java 中有哪些集合类型？


    ### 问题：基础接口类型有哪些


    ### 问题：List、Set 和 Map 之间的区别是什么


    这些是每个使用 `Java` 的人应该掌握的基础知识。集合框架简单来说就是作为核心 `java` 包含的集合类型。在 `Java` 中你会处理三种类型的集合：`Set`
    和 `List`（两者都实现了 `Collection`）以及 `Maps`（实现 `AbstractMap` 且技术上不属于核心 `Collections`）。每种类型的集合都表现出定义其用途的特性。集合的关键特征是：


    - 可以添加或删除元素

    - 集合将可以查询的大小

    - 集合可能包含或不包含重复项

    - 集合可能提供或不提供排序

    - 集合可能提供或不提供位置访问（例如：获取位置 6 的项）


    这些方法的行为取决于实现（正如你对接口所预期的那样）。如果你对一个不存在对象的集合调用 `remove`，会发生什么？这取决于实现。


    ## 集合类型


    - **Set**: 集合没有重复项且没有保证顺序。正如此，它不提供位置访问。实现了 `Collection`。示例实现包括 `TreeSet` 和 `HashSet`。

    - **List**: 列表可能包含或不包含重复项，并且保证顺序，允许位置访问。实现了 `Collection`。示例实现包括 `ArrayList` 和
    `LinkedList`。

    - **Map (接口: AbstractMap)**: map 稍微不同，因为它包含键值对而不是特定对象。map 的键可能不包含重复。map 没有保证顺序，也没有位置访问。没有实现
    `Collection`。示例实现包括 `HashMap` 和 `TreeMap`。


    但这对面试意味着什么呢？你几乎肯定会遇到关于类型之间区别的问题，所以要努力学习它们。更重要的是，聪明的面试者理解这些特性的意义。


    为什么选择其中一个而不是另一个？影响是什么？


    ## 选择哪一个？


    在现实中，选择 `Set`、`List` 还是 `Map` 取决于你的数据结构。


    如果没有重复项且不需要顺序，那么 `Set` 是选择。


    如果你需要顺序，`List` 是选择。如果你需要键值对，`Map` 是选择。


    ## 示例


    - `ArrayList`

    - `LinkedList`

    - `HashMap`

    - `TreeSet`

    - `HashSet`

    - `TreeMap`


    ## 集合实现


    ### 选择集合时主要考虑的问题是什么？


    在添加 `collection` 时，注意：

    - 访问速度

    - 添加元素的速度

    - 删除元素的速度

    - 迭代速度


    ### 为什么我要选择 LinkedList 而不是 ArrayList？


    ### TreeSet 还是 HashSet 更快？


    ### LinkedList 是如何工作的？


    ### 链式实现


    **示例：LinkedList, LinkedHashSet**


    `Linked` 实现。在底层，每个项都存储在一个 `node` 节点中。


    每个节点都有一个指向集合中下一项的指针，如下所示。


    *这对速度意味着什么？*


    在 `linked` 连接中添加项非常快，无论你在何处添加节点。如果你有一个包含 3 个元素的列表，并想在位置 1 添加一个新项，操作只需简单地将位置 2
    指向新项，并将新项指向旧的第 2。


    这非常快！不需要复制集合，不需要移动元素，不需要重新排序。删除操作也是如此；只需将节点 0 指向节点 2，你就删除了节点 1。


    相反，访问对象时相对较慢。如果你有一个包含 1000 个元素的列表，并且想要第 999 个元素，你需要遍历每一个节点才能获取该项。这意味着访问速度是不一致的。访问元素
    1 比访问元素 1000 快。请记住，当添加新对象时，你需要遍历到前一个节点，因此这会对速度产生一些影响。


    因此，链式集合如 `LinkedList` 在你需要快速添加/删除且对访问时间不太担心时是非常棒的。如果你经常要在集合中添加/删除项，那么这就是适合你的选择。


    ### 数组实现


    **示例：ArrayList**


    `ArrayList` 是集合类中唯一的基于数组的实现，但经常与 `LinkedList` 进行比较，因此理解这一点很重要。正如之前提到的，`ArrayLists`
    是由数组支撑的。这具有趣味的意义。


