  trans: "\n然而，与所有与线程和 JVM 相关的事务一样，你不能依赖它以一致的方式运行，特别是在不同的系统和操作系统之间。优先级层级的实际实现方式随系统而异，CPU\
    \ 可以选择它想要的任何方式运行。也许对于高于某个水平的优先级，它会分配专门的百分比时间。同样，你并不知道还有哪些进程正在运行。你可能设置了一个低值的后台线程，但如果机器上正在运行某个一个优先级略高的其他进程，你的\
    \ `Thread` 可能永远不会获得执行。\n\n尽管如此，它仍然可以很好工作。查看以下示例：\n\n```java\npublic static void\
    \ main(String[] args) {\n    Thread thread = new Thread(new Counter(1));\n   \
    \ thread.setPriority(Thread.MAX_PRIORITY);\n    Thread threadTwo = new Thread(new\
    \ Counter(2));\n    threadTwo.setPriority(Thread.MIN_PRIORITY);\n    thread.start();\n\
    \n    threadTwo.start();\n}\n\nprivate static class Counter implements Runnable\
    \ {\n    private int id;\n\n    public Counter(int i) {\n        id = i;\n   \
    \ }\n\n    @Override\n    public void run() {\n        for (int i = 0; i < 10;\
    \ i++) {\n            System.out.println(\"Thread \" + id + \" - \" + i);\n  \
    \      }\n    }\n}\n```\n\n这个简单的程序启动了两个线程，由于优先级的不同，输出可能会是乱的：\n\n```\nThread 1\
    \ - 0\nThread 1 - 1\nThread 1 - 2\nThread 1 - 3\nThread 1 - 4\nThread 1 - 5\n\
    Thread 1 - 6\nThread 1 - 7\nThread 1 - 8\nThread 1 - 9\nThread 2 - 0\nThread 2\
    \ - 1\nThread 2 - 2\nThread 2 - 3\nThread 2 - 4\nThread 2 - 5\nThread 2 - 6\n\
    Thread 2 - 7\nThread 2 - 8\nThread 2 - 9\n```\n\n这种方式在不同机器或 JVM 之间是不一致的，有时会产生混乱。但使用线程池（ThreadPool）是可靠的：\n\
    \n```\nThread 1 - 0\nThread 1 - 1\nThread 1 - 2\nThread 1 - 3\nThread 1 - 4\n\
    Thread 1 - 5\nThread 1 - 6\nThread 1 - 7\nThread 1 - 8\nThread 1 - 9\nThread 2\
    \ - 0\nThread 2 - 1\nThread 2 - 2\nThread 2 - 3\nThread 2 - 4\nThread 2 - 5\n\
    Thread 2 - 6\nThread 2 - 7\nThread 2 - 8\nThread 2 - 9\n```\n\n如果我使用线程池，输出将是：\n\
    \n```\nThread 1 - 0\nThread 2 - 0\nThread 1 - 1\nThread 2 - 1\nThread 1 - 2\n\
    Thread 2 - 2\nThread 1 - 3\nThread 2 - 3\nThread 1 - 4\nThread 2 - 4\nThread 1\
    \ - 5\nThread 2 - 5\nThread 1 - 6\nThread 2 - 6\nThread 1 - 7\nThread 2 - 7\n\
    Thread 1 - 8\nThread 2 - 8\nThread 1 - 9\nThread 2 - 9\n```\n\n通常线程池是通过使用 `Executors`\
    \ 创建的：\n\n```java\nExecutorService executorService1 = Executors.newSingleThreadExecutor();\n\
    ExecutorService executorService2 = Executors.newFixedThreadPool(10);\nExecutorService\
    \ executorService3 = Executors.newScheduledThreadPool(10);\n```\n\n单线程执行器将创建一个线程；所有任务将按顺序执行。也可以使用\
    \ `Executors.newFixedThreadPool(1)` 实现。\n\n`Executors.newFixedThreadPool` 会创建一个具有指定数量\
    \ `Threads` 的线程池。这些线程在整个 `JVM` 的生命周期内存在，除非 `Executor` 使用 `shutdown()`（这将允许当前队列中的任务完成）和\
    \ `shutdownNow()`（这将取消所有待执行的任务）。\n\n任务可以通过提交 `Callable` 或 `Runnable` 在 `ExecutorServices`\
    \ 上运行。\n\n### Q：什么是线程饥饿（Thread starvation）？\n\n如果一个 `Thread` 因为其他 `Threads` 而无法获得\
    \ CPU 时间，这被称为饥饿。\n\n想象一个上面的极端例子，许多高优先级的 `Threads` 和一个低优先级的 `Thread`。低优先级的线程无法获得任何\
    \ CPU 时间并将遭受饥饿。\n\n### Futures, Callables 和 Executors\n\n### Q：什么是线程池（ThreadPool）？为什么使用它们比手动创建\
    \ Threads 好？\n\n创建和维护 `Threads` 是昂贵且耗时的。使用 `ThreadPool`，有一组 `Threads` 可供调用以执行任务。线程是预先创建的，从而减少了执行时的开销。一旦任务执行，`Thread`\
    \ 就会返回池以执行另一个任务。如果 `Thread` 因为某些原因死亡，会在 `ThreadPool` 中被替换，从而无需编写复杂的线程管理代码。\n\n\
    额外的好处是它可以轻松控制并行任务的数量。例如，如果我们有一个 Web 服务器，我们可能希望限制任务的数量，以防止巨大的流量停止其他后台任务的运行。\n\n\
    ### Q：如何创建线程池？\n\n线程池通常使用 `Executors` 创建。\n\n### Q：Callable 和 Runnable 的区别是什么？什么是\
    \ Future？\n\n`Runnable` 不能返回值且不能抛出检查异常，而这些功能在 `Callable` 中都是具备。`Future` 是异步计算结果的表示。\n"
- fmt: "\n### O(1)/Constant Complexity\nConstant. This means irrelevant of the size\
    \ of the data set the algorithm will always take a constant time.\n\n*1 item takes\
    \ 1 second, 10 items takes 1 second, 100 items takes 1 second.*\n\nIt always takes\
    \ the same amount of time.\n\n### O(log n)/Logarithmic Complexity\nNot as good\
    \ as constant, but still pretty good. The time taken increases with the size of\
    \ the data set, but not proportionately so. This means the algorithm takes longer\
    \ per item on smaller datasets relative to larger ones.\n\n*1 item takes 1 second,\
    \ 10 items takes 2 seconds, 100 items takes 3 seconds.*\n\nIf your dataset has\
    \ 10 items, each item causes 0.2 seconds latency. If your dataset has 100, it\
    \ only takes 0.03 seconds extra per item. This makes `log n` algorithms very scalable.\n\
    \n### O(n)/Linear Complexity\nThe larger the data set, the time taken grows proportionately.\n\
    \n*1 item takes 1 second, 10 items takes 10 seconds, 100 items takes 100 seconds.*\n\
    \n### O(n log n)\nA nice combination of the previous two. Normally there’s 2 parts\
    \ to the sort, the first loop is `O(n)`, the second is `O(log n)`, combining to\
    \ form `O(n log n)`. *1 item takes 2 seconds, 10 items takes 12 seconds, 100 items\
    \ takes 103 seconds.*\n\n### O(n 2)/Quadratic Complexity\nThings are getting extra\
    \ slow.\n\n*1 item takes 1 second, 10 items takes 100, 100 items takes 10000.*\n\
    \n### O(2 n): Exponential Growth!\nThe algorithm takes twice as long for every\
    \ new element added.\n\n*1 item takes 1 second, 10 items takes 1024 seconds, 100\
    \ items takes 1267650600228229401496703205376 seconds.*\n\nIt is important to\
    \ notice that the above is not ordered by the best to worst complexity.\n\nThere\
    \ is no “best” algorithm, as it completely hinges on the size of the dataset and\
    \ the task at hand. It is also important to remember the code maintenance cost;\
    \ a more complex algorithm may result in an incredibly quick sort, but if the\
    \ code has become unmaintainable and difficult to debug is that the right thing\
    \ to do? It depends on your requirements.\n\nThere is also a variation in complexity\
    \ within the above complexities. Imagine an algorithm which loops through a list\
    \ exactly two times. This would be `O(2n)` complexity, as it’s going through your\
    \ lists length `(n)` twice!\n\n### Why does this matter?\nSimply put: an algorithm\
    \ that works on a small dataset is not guaranteed to work well on a large dataset.\
    \ Just because something is lightning fast on your machine doesn’t mean that it’s\
    \ going to work when you scale up to a serious dataset. You need to understand\
    \ exactly what your algorithm is doing, and what it’s big O complexity is, in\
    \ order to choose the right solution.\n\nThere are three things we care about\
    \ with algorithms: **best case, worst case and expected case**. In reality we\
    \ only actually care about the latter two, as we’re a bunch of pessimists.\n\n\
    If you ask an algorithm to sort a pre-sorted list it’s probably going to do it\
    \ much faster than a completely jumbled list. Instead we want to know what the\
    \ worst case (the absolutely maximum amount of steps the algorithm could take)\
    \ and the expected case (the likely or average number of steps the algorithm could\
    \ take). Just to add to the fun, these can and often are different.\n\n### Examples\n\
    Hopefully you’re with me so far, but let’s dive into some example algorithms for\
    \ sorting and searching. The important thing is to be able to explain what complexity\
    \ an algorithm is. Interviewers love to get candidates to design algorithms and\
    \ then ask what the complexity of it is.\n\n#### O(1)\nIrrelevant of the size,\
    \ it will always return at constant speed. The javadoc for `Queue` states that\
    \ it is “constant time for the retrieval methods (peek, element, and size)”. It’s\
    \ pretty clear why this is the case. For `peek`, we are always returning the first\
    \ element which we always have a reference to; it doesn’t matter how many elements\
    \ follow it. The size of the list is updated upon element addition/removal, and\
