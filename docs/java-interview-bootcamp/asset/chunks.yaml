    By declaring something as `final` you prevent it from being overridden. Nothing
    is perfect though, as crafty developers can always use `Reflection` to get around
    this, or alternatively just copy and paste your code into their own version of
    the `class`. It is rarely a good idea to prevent your methods or classes being
    overridden, and you should code defensively to reflect this.


    ## Data Structures


    Java data structures interview questions will come up in your interview. At it’s
    nexus being a programmer is about handling data, transforming and outputting it
    from one format to another, which is why it is so important to understand what’s
    going on under the hood and how it can affect your application. It never fails
    to confound me how many people can’t tell what `collection` is used to back an
    `ArrayList` (hint: it’s in the name). From the interviewers perspective, questions
    on data structures reveal a lot of information about the candidate. They show
    if the candidate has a core understanding of how `java` works.


    Even better it provides a platform to lead to a wide ranging set of questions
    on design, algorithms and a whole lot more. In day to day `java` programming,
    you’re going to spend most of your time with `ArrayLists`, `LinkedLists` and `HashMaps`.
    As a result it makes sense to review collections and algorithms you haven’t looked
    at for a while as, in my experience, companies love asking this sort of question.


    ### Q: What is the Java Collection Framework?


    ### Q: What Collection types are there in Java?


    ### Q: What are the basic interface types


    ### Q: What are the differences between List, Set and Map


    This is the bread and butter stuff that everyone who uses `Java` should know.
    The collections framework is simply the set of collection types that are included
    as part of core `java`. There are three types of collection you will deal with
    in `Java`; `Set` and `List` (both of which implement `Collection`) and `Maps`
    (which implement `AbstractMap` and technically aren’t part of core `Collections`).
    Each type of collection exhibits certain characteristics which define it’s usage.
    The key features of a collection are:


    - Elements can be added or removed

    - The collection will have a size that can be queried

    - The collection may or may not contain duplicates

    - It may or may not provide ordering

    - It may or may not provide positional access (e.g. get me item at location 6)


    The behaviour of these methods varies based on implementation (as you would expect
    from an interface). What happens on if you call `remove` on a collection for an
    object that doesn’t exist? It depends on the implementation.


    ## The Collection Types


    - **Set**: A set has no duplicates and no guaranteed order. Because of this, it
    does not provide positional access. Implements `Collection`. Example implementations
    include `TreeSet` and `HashSet`.

    - **List**: A list may or may not contain duplicates and also guarantees order,
    allowing positional access. Implements `Collection`. Example implementations include
    `ArrayList` and `LinkedList`.

    - **Map (interface: AbstractMap)**: a map is slightly different as it contains
    key-value pairs as opposed to specific object. The key of a map may not contain
    duplicates. a map has no guaranteed order and no positional access. Does not implement
    `Collection`. Example implementations include `HashMap` and `TreeMap`.


    But what does this mean with regards to interviews? You’re almost certainly going
    to get a question about the differences between the types so make an effort to
    learn them. More importantly the smart interviewee understands what the implication
    of these features are.


    Why would you choose one over the other? What are the implications?


    ## Which to choose?


    In reality, whether you choose a `Set`, `List` or `Map` will depend on the structure
    of your data.


    If you won’t have duplicates and you don’t need order, then `Set` is the choice.


    If you need order, `List` is the choice. If you need key-value pairs, `Map` is
    the choice.


    ## Examples


    - `ArrayList`

    - `LinkedList`

    - `HashMap`

    - `TreeSet`

    - `HashSet`

    - `TreeMap`


    ## Collection Implementations


    ### What are the main concerns when choosing a collection?


    When adding a `collection` care about:

    - Speed of access

    - Speed of adding an element

    - Speed of removing an element

    - Speed of iteration


    ### Why would I choose LinkedList over ArrayList?


    ### Which is faster, TreeSet or HashSet?


    ### How does a LinkedList work?


    ### Linked implementation


    **Example: LinkedList, LinkedHashSet**


    `Linked` implementation. Under the covers, each item is held in a `node`.


    Each node has a pointer to the next item in the collection like so.


    *What does this mean for speed?*


    When adding an item into `linked` connection it’s quick, irrelevant of where you’re
    adding the node. If you have a list of 3 items and want to add a new one in position
    1, the operation is simply to point position 2 to the new item, and the new item
    to the old 2.


    That’s pretty fast! No copying collections, no moving things, no reordering. The
    same is true for removals; simply point node 0 to node 2 and you’ve removed node
    1.


    Conversely when accessing objects it is relatively slow. If you have a list of
    1000 items, and you want item 999, you need to traverse every single node to get
    to that item. This also means that the access speed is not consistent. It’s quicker
    to access element 1 than it is element 1000. Bear in mind that when adding a new
    object you need to traverse to the node before, so this can have some impact on
    speed.


    So linked collections such as `LinkedList` are great when you need fast addition/removal
    and access time is less of a concern. If you’re going to be adding/remove items
    from your collection a lot, then this is the option for you.


    ### Array implementation


    **Example: ArrayList**


    `ArrayList` is the only Array based implementation in the collection classes,
    but is often used to compare to `LinkedList` so it’s important to understand.
    As alluded to previously, `ArrayLists` are backed by an `Array`. This has interesting
    implications.

