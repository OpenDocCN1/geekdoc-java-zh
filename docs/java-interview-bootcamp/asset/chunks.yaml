    ## Core Java

    Core Java: threading, exceptions, data structures & algorithms, object oriented
    programming etc. This is the basic stuff you simply need to take the time to revisit.


    Whether or not they are good questions to ask to determine your ability is irrelevant;
    most interviews will fall back on this so it’s good to be prepared. Reading the
    second half of Java Interview Bootcamp is the best place to start.


    ## Technology Discussion

    “Have you used technology X (or “I see from your CV you’ve used X)?”, “Can you
    tell me about it? What do you think of it?”. My default go-to topics are `Spring`
    and `Hibernate` as they have a lot of questions that can lead from the initial
    one and really go into depth. They also appear on most people’s CVs.


    This is the sort of question I prefer to ask as you can get a proper understanding
    of a candidates knowledge and whether they understand the tools they use, or if
    they just use them because they’re told. Look at the core technologies on your
    resume and figure out what your opinion is on them. The interviewer most likely
    won’t care what the opinion is specifically, more that you can articulate the
    pros and cons of each side and draw a conclusion.


    ## Techniques

    I love asking about these. Every office works differently; agile vs waterfall
    (yes, waterfall still exists), `TDD`/`BDD`/other DD, programming style etc. Again,
    if you have put these on your CV then you need to be sure you have good answers
    for your experience with them. If your department uses `TDD` so you’ve put it
    on the CV but you don’t actually do it you’re going to look bad.


    Again review your CV and look at what you’ve listed; come up with strong explanations
    for each of them.


    ## Riddles

    This is made up of the google-esque questions like “how many grains of sand are
    there in the world?” and “What would you do if you were stuck in a lift for an
    hour and a half?”. It’s good to try and read up on some of these just to get comfortable
    with answering them, but in reality they’re not something you can do a great amount
    of study for. Personally I’m not a big fan of these, but every interviewer is
    different.


    Try not to guess what the interviewer is looking for or what you think the interviewer
    believes is the “right” answer. They may intentionally lead you down the wrong
    path to see if you’re a “yes man”. Stick to your opinions even if they seem controversial.
    Be polite, be honest, and try to engage in an open discussion. The person on the
    other side of the phone isn’t a robot so try and engage the human side and have
    a 2 way conversation. If a candidate fires a question back at me during an answer
    I tend to enjoy it. An interview should be two way.


    ## After the interview

    Normally you should have a pretty good idea of how you’ve done, but don’t fret.
    I’ve had candidates who thought they’d tanked who were actually really good. Conversely
    I’ve had terrible people who thought they had done brilliantly. Simply wait to
    hear back from them and relax comfortable in the knowledge you’ve done your best.
    If you don’t make it through then don’t sweat it. The fact is that every interviewer
    is different and has different opinions, every company values different things
    and you may not fit into the team at that time. That’s ok. Just keep applying
    to different roles.


    On top of this there is a human element; maybe the interviewer woke up on the
    wrong side of the bed, or they haven’t had lunch yet so they’re hungry. It’s terrible
    to think that this could affect your potential job but it’s a fact of life. Whatever
    you do, don’t contest the result. Emailing back to try and explain something better
    now you’ve had time to think about it or asking to be seen again isn’t going to
    work and may damage your reputation.


    The industry is surprisingly small (particularly thanks to `LinkedIn`) so hold
    your head high, take the time to review what you could have done better for next
    time and move on.


    ## Face to face interview

    The vast majority of interviews you are likely to undertake during a recruitment
    process will be a variation of the face to face interview: as discussed earlier
    in the book, there are a huge number of variations a recruiter can pick and choose
    from. Although there are tips and tricks specific to each one there are some key
    tenets that run through them all which enable you to best represent yourself as
    a candidate. Whilst having the technical skills for the role is obviously crucial
    the reality is that success is often determined by gut feel-whether or not the
    interviewers have a good “feeling” about you. You can influence by the way you
    present yourself; your handshake, the conversations you have and your body language.
    In my experience these things end up being massively influential when making a
    decision about a candidate.


    ### First impressions

    It is cliche, and I’ve already said it multiple times, but first impressions really
    are everything. The initial meeting can be the difference between success and
    failure even though you’ve not answered a single question. Although I think any
    bias is unconscious, people will ask easier questions of candidates that they
    like from the initial introduction alone (and vice versa harder questions for
    difficult candidates).


    But what makes a good first impression?


    #### Turning up on time

    It’s baffling that this needs to be written down but the number of candidates
    I’ve had arrive late is incredible. You are being interviewed by busy people who
    are taking the time out of their day to sit with you. The moment you arrive late
    you’re in the “no” column and fighting to escape. Ideally try to arrive about
    5 minutes before the scheduled start time. It is also important not to arrive
    too early. I know everywhere I’ve ever worked has struggled for meeting room space
    and if you get there really early it puts the burden onto the interviewer to find
    somewhere for you to wait.


    #### Dressing Correctly

    It varies by industry, but I’ve found generally people don’t bother with a full
    suit and tie anymore, generally just wearing trousers and a shirt. I think this
    is preferable and will help you to relax. If you feel more comfortable wearing
    a suit then go for it, you’re not going to get marks against for dressing too
    formally (although I would recommend taking your suit jacket off when you get
    to the interview itself). However, make sure that whatever you wear fits properly:
    don’t be the classic stereotype of a geek wearing a suit two sizes too large.
    I’ve had people show up to interviews in jeans and a t-shirt before. Don’t do
    that ever. You will never make a bad impression by dressing up too much, however
    you certainly will by dressing too casually.


    #### Handshake

    Never underestimate the importance of a good handshake. There are three types
    of handshake. The first is the weak, limp shake which a lot of geeks suffer from
    as we tend to be timid. You are making a statement about the type of person you
    are with your handshake. If yours has no pressure then the conclusion is you are
    weak in the office: less likely to stand up at the whiteboard or to have strong
    opinions. All from just a handshake!


    The second sort of handshake is the bone crusher. At the very other end of the
    spectrum is the type of person who has heard that a strong handshake is important
    and as a result attempts to crush the other persons hand as a show of force and
    strength. Again, avoid this. It signifies you are an overbearing personality or
    you’re overcompensating for something. It also hurts! This is equally as bad as
    the limp handshake.

