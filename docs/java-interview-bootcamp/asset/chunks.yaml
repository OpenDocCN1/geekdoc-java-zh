    **Introduction**


    Welcome to Java Interview Bootcamp. Firstly, I’d just like to say a huge thank
    you to you for buying this book. I hope you will enjoy reading the book, but more
    importantly that it helps you to get your next amazing job.


    Helping Java devs through the interview process is something I’m really passionate
    about.


    In my career I’ve interviewed hundreds of people from the most junior developers
    to the most senior technical leads. There have been some consistent themes throughout
    that really drove my desire to write this book and create www.corejavainterviewquestions.com.


    What I have learnt can be summed up in two key points; People are terrible at
    preparing for interviews, and they do not know how to give a good impression during
    an interview.


    Programming interviews are both a skill and an art and as such they require practice
    and time. I have discovered most people simply don’t take the time to prepare.
    A huge proportion of the developers I’ve interviewed struggle to answer basic
    java questions.


    They seem intentionally stand offish and make no effort to come across as personable.


    These are simple things that can be remediated with preparation. By purchasing
    this book you are already ahead of most of your competitors because you know that
    you need to take the time to study beforehand.


    This book is split into two sections, interview process and core java revision.
    When someone is interviewing you they are looking to ensure that you are technically
    capable, but they also want to know that you are someone they can work with day
    to day. In the first half of the book we cover the different types of interview
    and what you can do as a candidate to make the best impression possible on your
    future employer.


    The second half of the book is a ground-up revision of core java. The simple fact
    is in most interviews the technical questions bare little resemblance to our day-to-day
    programming. I’ve found most interview processes don’t even involve a programming
    stage. Instead companies love to ask obscure threading questions or ask you to
    write java code on a whiteboard to reverse a string. Whether these are good interview
    questions or not isn’t the subject of this book. The simple fact is you have to
    be prepared for them, which means spending some time to revise the basic core
    java principles.


    I hope you find the everything you need in here. If you have any questions, queries,
    or just want to have a chat then you can email me on hello@corejavainterviewquestions.com.
    I will always respond.


    If you’re not already a member, don’t forget to head to www.corejavainterviewquestions.com
    and sign up to the mailing list. It’s packed with tons of valuable information
    and goodies.


    And last but not least: Good luck with all your interviews. I’m sure you’re going
    to knock them out the park.


    **Sam Atkinson, author of Java Interview Bootcamp.**


