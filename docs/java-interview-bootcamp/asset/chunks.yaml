  trans: '


    当 `GC` 发生时，必须在收集期间完全暂停应用程序中的线程。这被称为“停顿世界”（Stop The World）。对于大多数应用程序来说，长时间的暂停是不可接受的。因此，调整垃圾回收器以将回收对应用程序的影响降低到可接受的范围内至关重要。


    ## Q: 分代 GC 是如何工作的？我们为什么要使用分代 GC？Java 堆的结构是？


    理解 `Java Heap` 的工作原理对于回答关于 `GC` 的问题至关重要。所有对象都存储在 `Heap`（堆）中（与之相对的是 `Stack` ，变量、方法以及指向堆中对象的引用）。垃圾回收（Garbage
    Collection）是从 `Heap` 中移除不再需要的对象并释放空间供后续使用的过程。几乎所有的 `GC` 都是“分代的”，即 `Heap` 被划分为若干区域，称为“代”。这种方式被证明是优得多，这也是为什么几乎所有的收集器都使用这种模式。


    ## 新生代 (New Generation)


    ### Q: 什么是新生代？它是如何帮助减少 GC 影响的？


    大多数应用程序都会产生大量的短命对象。在 `GC` 期间分析应用程序中的所有对象会非常缓慢且耗时，因此，将短命对象分离以便它们被快速回收是有意义的。因此，所有新对象都被放置在新生代中。新生代进一步拆分为：`Eden
    Space`：所有新对象都放在这里。当它变满时，就会发生 `minor GC`（新生代回收）。所有仍被引用的对象随后会被提升到 `survivor space`（幸存空间）。幸存空间的实现根据
    `JVM` 而异，但原理是相同的。`New Generation` 的每次 `GC` 都会增加幸存空间中对象的年龄。当一个对象存过了足够数量的 `minor
    GC`（默认值不同，但通常从 15 开始）后，它将被提升到 `Old Generation`（老年代）。某些实现使用两个幸存空间：`From space`（源空间）和
    `To space`（目标空间）。在每次收集期间，它们会交换角色，所有提升的 `Eden` 对象和幸存对象将移动到 `To space`，留下 `From`
    为空。


    ### Q: 什么是 minor GC？


    在 `NewGen` 中的垃圾回收被称为 `minor GC`。使用 `New Generation` 的益处之一是减少碎片的影响。当一个对象被垃圾回收时，它会在原有的内存位置留下一个空隙。我们可以压缩剩余的对象（一种停顿世界的场景），也可以留着它们并将新对象插入空隙。通过使用
    `Generational GC`，我们限制了这种情况在 `Old Generation` 中发生的频率，因为那里通常更稳定，有利于通过减少“停顿世界”来提高延迟。然而，如果我们不进行压缩，可能会发现对象无法恰好放入中间的空隙中，可能是由于大小问题。如果是这种情况，你将看到对象无法从
    `New Generation` 提升。


    ## 老年代 (Old Generation)


    ### Q: 请解释什么是老年代？


    任何从 `New Generation` 幸存空间存活的对象都会被提升到 `Old Generation`。`Old Generation` 通常比 `New
    Generation` 大得多。


    当老年代发生 `GC` 时，被称为 `full GC`（全堆）。`Full GCs` 也是停顿世界的，并且倾向于花费更长时间，这就是为什么大多数的 `JVM`
    调优发生在这里。有许多不同的垃圾回收算法可用，并且可以对新生代和老年代使用不同的算法。


    ### Q: 有什么类型的垃圾回收器？


    * **Serial GC**：为仅有一个 CPU 的计算机设计，在 `GC` 发生时停止整个应用程序。它使用 `mark-sweep-compact`（标记-清除-压缩）算法。收集器遍历所有对象并标记哪些对象可以进行垃圾回收，清除它们，然后将所有对象复制到连续的空间中（因此没有碎片）。

    * **Parallel GC**：与 Serial 类似，区别是它使用多个线程来执行 `GC` 以提高速度。

    * **Concurrent Mark Sweep (CMS)**：`CMS GC` 通过在与应用程序处理的同时执行大部分 `GC` 相关工作来尽量地减少停顿。这减少了应用程序必须完全暂停的时间，因此更适合对这种停顿敏感的应用程序。`CMS`
    是一种非压缩算法，可能会导致碎片问题。`CMS` 收集器在新生代使用 `Parallel GC`。

    * **G1GC (垃圾优先垃圾收集器)**：一种并发并行收集器，被视为 `CMS` 的长期替代方案，并且不会遭受与 `CMS` 相同的碎片问题。


    ### Q: 哪个更好？Serial、Parallel 还是 CMS？


    这完全取决于应用程序。每一个都是为应用程序的需求身定制的。如果你在单 CPU 上，或者在机器上运行的虚拟机比 CPU 更多的情况下，`Serial` 更好。`Parallel`
    是一个吞吐量收集器，如果你有大量工作要做但可以介意暂停，它非常好。如果你需要一致的响应速度和最小的停顿，`CMS/G1GC` 是最佳选择。


    ## 元空间 (PermGen)


    ### Q: 什么是 PermGen？


    `PermGen` 是 `JVM` 存储类元数据的地方。它在 Java 8 中不再存在，被 `metaspace`（元空间）取代。通常 `PermGen`
    不需要确保有足够空间以外的调优，尽管如果 `Classes` 没有被正确卸载，可能会发生泄漏。


    ## 来自代码


    ### Q: 你可以告诉系统执行垃圾回收吗？


    这是一个有趣的问题：答案既是肯定的。我们可以使用调用 `System.gc()` 来建议 `JVM` 执行垃圾回收。然而，无法保证这会发生。作为 Java
    开发者，我们不知道代码运行在什么样的 `JVM` 中。`JVM` 规范对调用此方法会发生什么没有任何保证。甚至有一个启动标记 `-XX:+DisableGC`，它可以阻止执行任何操作。


    使用 `System.gc()` 被认为是一种坏习惯。


    ### Q: finalize 有什么作用？


    `finalize()` 是 `java.lang.Object` 的一个方法，因此所有对象都拥有。默认实现什么都不做。当不再有对对象的引用时，垃圾回收器会调用它。结果是，无法保证代码会被执行，因此不用于执行实际功能。相反，它用于清理工作，例如文件引用。它不会由
    `JVM` 对对象调用超过一次。


    ## JVM 调优


    ### Q: 我可以使用哪些标志来调优 JVM？


    有很多关于调优 JVM 以优化垃圾回收的教程。你不可能学会所有的！尽管如此，为了面试，了解几个是好的。


    * `-XX:UseConcMarkSweepGC`：老年代使用 `CMS` 收集器。

    * `-XX:UseParallelGC`：新生代使用 `Parallel GC`。

    * `-XX:UseParallelOldGC`：老年代和新生代都使用 `Parallel GC`。

    * `-XX:HeapDumpOnMemoryError`：当应用程序内存不足时创建转转储。对于诊断非常有用。

    * `-XX:PrintGCDetails`：记录垃圾回收的细节。

    * `-Xms512m`：设置初始堆大小为 512m `-Xmx1024m`：设置最大堆大小为 1024m。

    * `-XX:NewSize` 和 `-XX:MaxNewSize`：专门设置新生代的默认和最大大小。

    * `-XX:NewRatio=3`：根据老年代的大小比例设置新生代的大小。

    * `-XX:SurvivorRatio=10`：设置 Eden 空间相对于幸存空间的大小。


    ## 诊断


    虽然上述所有问题对于展示你对 `JVM` 如何工作有基础理解非常有帮助，但面试中最标准的问题之一是这个：


    **你经历过内存泄漏吗？你是如何诊断它的？**


    '
