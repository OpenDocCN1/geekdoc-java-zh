- fmt: "\nIf you have a personal website or blog then include it, but make sure it\
    \ looks good and has been updated in the last 6 months. I’ve seen some terrible\
    \ candidate websites, and it instantly puts me off. Make sure your site is looking\
    \ good and up to date and it can absolutely earn you some extra credit.\n\nIf\
    \ you’ve been playing around with technologies at home then list them and what\
    \ you’ve been doing with them. A lot of organisations will limit the permitted\
    \ technoligies you are allowed to use; if you then go home and play with `NoSQL`\
    \ or `node.js` then by putting this on your resume you are displaying a wider\
    \ awareness of technology which is a sought after skill.\n\n## Make it look pretty\n\
    \nI’m being very serious when I say most CVs don’t stand out. They’re just blocks\
    \ of text going into pages and pages. Having just a little bit of design can make\
    \ a big difference.\n\nI’m a huge fan of google docs for this; they have some\
    \ basic attractive templates which can make you stand out just a little from the\
    \ rest of the pile. It’s not much, but it’s often enough.\n\n## Phone Interviews\n\
    \nI’m a huge fan of using a phone interview at the start of my hiring process.\
    \ As someone trying to recruit it’s important that I have some way of filtering\
    \ the hundreds of candidates that get sent through. I’ve come to accept most people\
    \ are terrible at writing a resume, and some just plain bend the truth, so before\
    \ I meet someone face to face I find it’s useful to speak to them on the phone\
    \ for 20 minutes to ensure that they do know `java` and get an understanding of\
    \ their background. As a candidate it’s also an opportunity to make a good first\
    \ impression. Many people panic that they won’t be able to do themselves justice\
    \ over the phone (and indeed, candidates who fail often cite this as a reason),\
    \ however with a few pieces of key advice you can be sure to come out on top of\
    \ the pack.\n\n## Preparing for your Java phone interview\n\nYou may be dealing\
    \ with a recruiter or with the firm directly. Either way, contact them and find\
    \ out the exact details of the phone interview. You want to be as prepared as\
    \ you can.\n\nSpecifically you should ask:\n\n- How long will it be?\n- What sort\
    \ of questions will be asked? You’ll be lucky if you get an answer to this, but\
    \ it’s good to know if the questions are more likely to be technical focused or\
    \ design focused. Phone interviews tend to have a technical slant as design interviews\
    \ are really hard to do without a piece of paper or a whiteboard. It’s certainly\
    \ worth asking as you might hit lucky and get some gems of information to help\
    \ you in your preparations.\n- How many people will be on the call? Who will they\
    \ be? Phone interviews with one or two people will generally be easier as you\
    \ can identify who’s who and an understanding of their interests and question\
    \ style. Above that will make it a little more difficult.\n\nIt’s then time to\
    \ simply to hit the books and get revising. Chances are you’re going to get a\
    \ lot of “what does this thing in `Java` do?” type questions, as they’re easy\
    \ to do over the phone. They’re not necessarily good questions, but they’re the\
    \ questions interviewers tend to fall back on.\n\nMake sure that whenever you’ve\
    \ booked your interview for you have **somewhere quiet** and **private to go**.\
    \ Make sure you get there **5 minutes** before the interviewer is due to call.\
    \ There is nothing worse than starting your call flustered because you don’t have\
    \ a place to do the interview and it leaves a terrible first impression. As an\
    \ interviewer I have a limited amount of time; I tend to bunch phone interviews\
    \ to be back to back or slip them in between meetings. If you waste 5 minutes\
    \ then you’re losing an opportunity to impress the interviewer.\n\nMake sure you\
    \ **have a copy of your CV with you**. The interviewer will have a copy too and\
    \ will ask you about it. I would guess that you can’t remember what you’ve written\
    \ on your resume so have it in front of you. It’s very embarrassing when someone\
    \ asks you about a part of your CV and you have no idea what they’re talking about.\n\
    \nEnsure you go in with a **pre-prepared list of questions for the end of the\
    \ interview**. You will get asked and it’s important that you are quick to respond.\
    \ I want to know that you care about the role I’m hiring for and have spent 30\
    \ seconds to look at the job description and that want to know more. Interviewers\
    \ (and people in general) are egotistical. It doesn’t matter if it’s a simple\
    \ “I was hoping you could tell me more about the role”; just make sure you don’t\
    \ spend 5 seconds in silence as if you hadn’t expected the question to be asked.\
    \ Have 2 or 3 questions lined up. It doesn’t matter if you really want an answer,\
    \ the act of asking is what matters.\n\nFor the exceptionally lazy, here’s a list\
    \ of example questions:\n- Please can you tell me a bit more about the team? What\
    \ size is it? What experience levels?\n- Is the team based in one region or geographically\
    \ split?\n- How does the team work? Do you use agile?\n- What’s your biggest frustration\
    \ in your current job?\n- What’s your favourite part of working at the company\
    \ and in the team?\n- What does an average day look like?\n- How hard is it to\
    \ use new technologies in your company?\n- What training exists?\n\nIt’s also\
    \ an opportunity to impress and show off. Say you know the people you’re interviewing\
    \ are really keen on a technology or technique, like `Test Driven Development`.\n\
    \nUse your questions to promote yourself! “I’m a huge fan of `TDD` and was wondering\
    \ how exactly do you use it in your?”. Or “I’ve always wanted to learn `TDD` but\
    \ have never been given the opportunity. Do you think the learning curve is manageable?”.\
    \ \n\n## Tips for giving the best impression\n\nWhen your phone rings, think positive.\
    \ Be positive. Sound happy. As cheesy as this sounds, the old adage of “you have\
    \ 7 seconds to make a first impression” is spot on. The amount of candidates I\
    \ call that sounds grumpy and/or uninterested is crazy. This instantly turns an\
    \ interviewer against you and unless you nail all the questions you’re going to\
    \ have a hard time. Conversely, if you pick up the phone, sound excited and tell\
    \ the interviewer you’ve been looking forward to the interview then you’re in\
    \ the positive books from the start.\n\nSpeak slowly. You don’t want to rattle\
    \ through the interview at lightening pace. But, don’t speak so slowly as to bore\
    \ the interviewer. Most importantly, know when to stop. I’ve had candidates give\
    \ 5 minute monologues on `Spring` before I’ve had to step in. Being able to craft\
    \ a succinct answer is a hugely important skill, not just in interviewing but\
    \ as a `java` developer. It takes practice but it is well worth it. If you’re\
    \ worried about not answering the question fully, simply say “is that ok or would\
    \ you like me to continue?”. Chances are the interviewer will have picked up on\
    \ something you’ve mentioned and change the direction of the question or ask a\
    \ new one. If not they may simply ask you to continue and you can keep talking.\n\
    \nSome quick don’ts:\n- Don’t sound bored\n- Don’t chew gum\n- Don’t google answers\
    \ (**we can hear the keyboard**)\n- Don’t interrupt the interviewer\n- Don’t be\
    \ afraid to say you don’t know. Trying to guess your way through isn’t going to\
    \ fool anyone. If I’m asking the question then I probably know the answer. It’s\
    \ absolutely fine to say “I don’t know about that, but I’m happy to try and work\
    \ it out if you’d like”. That way everyone knows you’re not trying to lie your\
    \ way through. Candidates capable of admitting they don’t know will always gain\
    \ respect.\n\n## What you will get asked during the interview\n\nDue the limitations\
    \ of the telephone you can be fairly certain that the questions will be based\
    \ in one of four categories:\n"
  raw: 'If you have a personal website or blog then include it, but make sure it looks
    good and has been updated in the last 6 months. I’ve seen some terrible candidate
    websites, and it instantly puts me off. Make sure your site is looking good and
    up to date and it can absolutely earn you some extra credit.


    If you’ve been playing around with technologies at home then list them and what
    you’ve been doing with them. A lot of organisations will limit the permitted technoligies
    you are allowed to use; if you then go home and play with NoSQL or node.js then
    by putting this on your resume you are displaying a wider awareness of technology
    which is a sought after skill.


    **Make it look pretty**


    I’m being very serious when I say most CVs don’t stand out. They’re just blocks
    of text going into pages and pages. Having just a little bit of design can make
    a big difference.


    I’m a huge fan of google docs for this; they have some basic attractive templates
    which can make you stand out just a little from the rest of the pile. It’s not
    much, but it’s often enough.


    **Phone Interviews**


    I’m a huge fan of using a phone interview at the start of my hiring process. As
    someone trying to recruit it’s important that I have some way of filtering the
    hundreds of candidates that get sent through. I’ve come to accept most people
    are terrible at writing a resume, and some just plain bend the truth, so before
    I meet someone face to face I find it’s useful to speak to them on the phone for
    20 minutes to ensure that they do know java and get an understanding of their
    background. As a candidate it’s also an opportunity to make a good first impression.
    Many people panic that they won’t be able to do themselves justice over the phone
    (and indeed, candidates who fail often cite this as a reason), however with a
    few pieces of key advice you can be sure to come out on top of the pack.


    **Preparing for your Java phone interview**


    You may be dealing with a recruiter or with the firm directly. Either way, contact
    them and find out the exact details of the phone interview. You want to be as
    prepared as you can be.


    Specifically you should ask:


    How long will it be?


    What sort of questions will be asked? You’ll be lucky if you get an answer to
    this, but it’s good to know if the questions are more likely to be technical focused
    or design focused. Phone interviews tend to have a technical slant as design interviews
    are really hard to do without a piece of paper or a whiteboard. It’s certainly
    worth asking as you might hit lucky and get some gems of information to help you
    in your preparations.


    How many people will be on the call? Who will they be? Phone interviews with one
    or two people will generally be easier as you can identify who’s who and an understanding
    of their interests and question style. Above that will make it a little more difficult.


    It’s then time to simply to hit the books and get revising. Chances are you’re
    going to get a lot of “what does this thing in Java do?” type questions, as they’re
    easy to do over the phone. They’re not necessarily good questions, but they’re
    the questions interviewers tend to fall back on.


    Make sure that whenever you’ve booked your interview for you have **somewhere
    quiet** **and private to go**. Make sure you get there **5 minutes** before the
    interviewer is due to call. There is nothing worse than starting your call flustered
    because you don’t have a place to do the interview and it leaves a terrible first
    impression. As an interviewer I have a limited amount of time; I tend to bunch
    phone interviews to be back to back or slip them in between meetings. If you waste
    5 minutes then you’re losing an opportunity to impress the interviewer.


    Make sure you **have a copy of your CV with you**. The interviewer will have a
    copy too and will ask you about it. I would guess that you can’t remember what
    you’ve written on your resume so have it in front of you. It’s very embarrassing
    when someone asks you about a part of your CV and you have no idea what they’re
    talking about.


    Ensure you go in with a **pre-prepared list of questions for the end of the interview**.
    You will get asked and it’s important that you are quick to respond. I want to
    know that you care about the role I’m hiring for and have spent 30 seconds to
    look at the job description and that want to know more. Interviewers (and people
    in general) are egotistical. It doesn’t matter if it’s a simple “I was hoping
    you could tell me more about the role”; just make sure you don’t spend 5 seconds
    in silence as if you hadn’t expected the question to be asked. Have 2 or 3 questions
    lined up. It doesn’t matter if you really want an answer, the act of asking is
    what matters.


    For the exceptionally lazy, here’s a list of example questions: Please can you
    tell me a bit more about the team? What size is it? What experience levels?


    Is the team based in one region or geographically split?


    How does the team work? Do you use agile?


    What’s your biggest frustration in your current job?


    What’s your favourite part of working at the company and in the team?


    What does an average day look like?


    How hard is it to use new technologies in your company?


    What training exists?


    It’s also an opportunity to impress and show off. Say you know the people you’re
    interviewing are really keen on a technology or technique, like Test Driven Development.


    Use your questions to promote yourself! “I’m a huge fan of TDD and was wondering
    how exactly do you use it in your team?”. Or “I’ve always wanted to learn TDD
    but have never been given the opportunity. I find the concept really exciting.
    Do you think the learning curve is manageable?”. This is music to an interviewers
    ears because you actually care. If I’m doing 3 interviews a day, 5 days a week
    things like this really make a big difference.


    **Tips for giving the best impression**


    When your phone rings, think positive. Be positive. Sound happy. As cheesy as
    this sounds, the old adage of “you have 7 seconds to make a first impression”
    is spot on. The amount of candidates I call that sounds grumpy and/or uninterested
    is crazy. This instantly turns an interviewer against you and unless you nail
    all the questions you’re going to have a hard time getting through. Conversely,
    if you pick up the phone, sound excited and tell the interviewer you’ve been looking
    forward to the interview then you’re in the positive books from the start.


    Speak slowly. You don’t want to rattle through the interview at lightening pace.
    But, don’t speak so slowly as to bore the interviewer. Most importantly, know
    when to stop. I’ve had candidates give me 5 minute monologues on Spring before
    I’ve had to step in. Being able to craft a succinct answer is a hugely important
    skill, not just in interviewing but as a java developer. It takes practice but
    it is well worth it. If you’re worried about not answering the question fully,
    simply say “is that ok or would you like me to continue?”. Chances are the interviewer
    will have picked up on something you’ve mentioned and will change the direction
    of the question or ask a new one. If not they may simply ask you to continue and
    you can keep talking. Some quick don’ts:


    Don’t sound bored


    Don’t chew gum


    Don’t google answers (**we can hear the keyboard**) Don’t interrupt the interviewer


    Don’t be afraid to say you don’t know. Trying to guess your way through isn’t
    going to fool anyone. If I’m asking the question then I probably know the answer.
    It’s absolutely fine to say “I don’t know about that, but I’m happy to try and
    work it out if you’d like”. That way everyone knows you’re not trying to lie your
    way through.


    Candidates capable of admitting they don’t know will always gain respect.


    **What you will get asked during the interview**


    Due the limitations of the telephone you can be fairly certain that the questions
    will be based in one of four categories:'
