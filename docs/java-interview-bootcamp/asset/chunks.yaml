  trans: "\n\n所有的实现都使用了 `Compare and Set (CAS)` 操作，而不是同步块（synchronized blocks）来确保线程安全。这确保了没有死锁风险，且\
    \ `Threads` 不会阻塞等待，同时速度要快得多。所有基于 `CAS` 操作的集合（如上述）都具有弱一致迭代器。这意味着它们不会抛出 `ConcurrentModificationExceptions`，但不能保证能反映正确的状态；根据文档描述：\n\
    \n返回的迭代器是一个“弱一致性”迭代器，它永远不会抛出 `ConcurrentModificationException`，并保证遍历在迭代器构造时存在的元素，并且可能（但不保证）反映构造后的任何修改。\n\
    \n## CopyOnWrite 机制\n\n### Q: 在遍历集合时如何避免 `ConcurrentModificationException`？\n\n\
    `CopyOnWriteArrayList`\n\n`CopyOnWriteArraySet`\n\n我非常喜欢命名良好的 `Classes`，而这是一个很棒的例子。通过在每次写入时复制整个集合，它保证了不可变性；如果我有一个迭代器正在遍历集合，那么它可以保证集合在遍历过程中不会被修改，因为所有的修改都会导致创建数据的副本。这可能是一个昂贵的操作，因此这些集合更适用于访问频繁但更新较少的数据。依赖数据复制的迭代器（如本例）被称为失败安全迭代器（fail\
    \ safe iterator）。\n\n## ConcurrentHashMap\n\n### Q: `ConcurrentHashMap` 是如何实现的？\n\
    \n`ConcurrentHashMap` 是一个高效的、线程安全的 `HashMap` 实现。如前所述，`HashMap` 由段（segments）组成，即若干个列表（默认\
    \ 16 个），这些列表包含了根据 `HashCode` 访问的数据。在 `ConcurrentHashMap` 中，读操作通常是非阻塞的，这使得它非常快；写操作仅按段锁定。这意味着如果正在写入更新，其他\
    \ 15 个段仍然可以无问题地读取。\n\n### Q: 我应该使用 `HashTable` 还是 `ConcurrentHashMap`？\n\n`HashTable`\
    \ 是 `HashMap` 的同步实现，但它源自旧版本的 Java，且不应该再被使用。`HashTable` 中的所有操作都是同步的，这意味着相对于 `ConcurrentHashMap`，它的性能非常差。\n\
    \n### Q: `ConccurrentLinkedQueue` 和 `ConcurrentHashMap` 等集合是完全线程安全的吗？\n\n答案是既是也不是。该实现本身是完全线程安全的（ThreadSafe），并且可以作为其非线程安全对应物的替代品。然而，完全有可能写出以线程安全的方式访问集合的代码。\n\
    \n```java\nMap<String, String> map = new ConcurrentHashMap<>(); \nmap.put(\"a\"\
    , \"1\");\nmap.put(\"b\", \"2\");\n//....启动一堆其他线程....\nif (!map.containsKey(\"\
    c\"))\n    map.put(\"c\", \"3\");\nelse\n    map.get(\"c\");\n```\n\n`contains`\
    \ -> `put` 和 `contains` -> `get` 操作不是原子的。在检查是否存在和放入/获取内容之间，集合中可能会发生任何变化。集合本身仍然是安全的，但我们的访问方式不安全。我们需要确保任何先检查状态后执行的操作都是以原子或同步的方式完成的。上述代码可以通过使用\
    \ `putIfAbsent` 方法来创建原子性来纠正；但是，例如如果你想根据列表的大小对列表执行某些操作，你可能需要锁定集合以确保它作为一个单一操作执行。\n\
    \n## Java 异常 (Exceptions)\n\nJava 异常是我电话面试中最喜欢问的问题之一。\n\n它们是 Java 中较简单的部分，因此我预计大多数候选人都能给出很好的答案。通常很容易过滤掉那些答不上的人，因为他们不值得我的时间。\n\
    \n然而，我真正喜欢异常作为面试素材的一点是，它们允许将 Java 核心技术问题与观点陈述结合。受检异常（Checked Exceptions）实际上是 Java\
    \ 中一个非常有争议的部分，能够看到候选人站在哪一方，或者他们是否甚至意识到这道界限的存在，是非常有利的。\n\n## 核心问题\n\n### Q: Java\
    \ 中的异常（Exception）是什么？\n\n我通常不问这个问题，因为它太基础了，但确保你手头准备了一个标准答案是好的。异常是用编程方式传递系统错误和编程错误的方法。所有异常都继承自\
    \ `Throwable`。当出现问题时，你可以使用 `throw` 关键字来抛出异常。\n\n### Q: Java 中有 2 类异常，它们是什么？有什么区别？\n\
    \n这个“2 类类型”问题依然能让人如此困惑，这让我很惊讶（是的，throws [抛出]，我又玩了一个双关语，又来）。这是 Java 核心最基础的内容了。如果你不理解这个，说明你没有正确学习\
    \ Java 核心（或根本没学），这可能会成为你其他知识的一个不稳定的基础。答好这个问题。两类异常是 `checked`（受检）和 `unchecked`（未检）。我在这些年听过一些奇怪的答案，包括“Runtime\
    \ 和 NullPointerException”！受检异常是强制你捕获的异常。它是 API 或合约的一部分。任何使用抛出受检异常代码的人都能看到，因为它在方法上已经声明了，他们被迫使用\
    \ `try/catch` 块来处理它。未检异常不需要捕获，也不会通知使用代码的人可能会抛出异常。\n\n### Q: 如何知道一个异常类是受检还是未检的？\n\
    \n除了继承自 `java.lang.RuntimeException` 的异常外，所有异常都是受检异常。\n\n### Q: “finally”的作用是什么？\n\
    \n异常使用 `try-catch` 块捕获。然而，在 catch 之后你可以有一个 `finally` 块。这个块保证无论发生什么都会执行（除非有人拔掉了插头），例如在\
    \ catch 块中抛出了异常。这对于清理资源（如连接）非常有用。\n\n### Q: 我可以在同一个方法中抛出多个异常吗？我该如何捕获它们？\n\n可以的，每个异常（或该类的父类）只需要在方法签的\
    \ `throws` 之后列出。你可以使用多个 catch 块来捕获它们，或者通过捕获父异常类，例如你可以捕获 `Exception`，它会捕获所有异常。\n\
    \n这在理论上是坏习惯，因为你失去了对错误的错误的细微感知，以及特定的恢复能力。从 Java 7 开始，你也可以在单个 catch 块中捕获多个异常。捕获异常时，按从具体到不具体的顺序进行处理是非常重要的。\n\
    \n如果你的 catch 块先捕获 `Exception` 后捕获 `IOException`，那么第一个 catch 块将始终捕获任何传入的异常，导致 `IOException`\
    \ 变得毫无用处（事实上，它会导致编译错误，提示异常已被捕获）。\n\n"
- fmt: '

    This results in empty catch blocks or just log statements. This results in a brittle
    system where `Exceptions` get swallowed never to be heard from again and the system
    can get into a brittle state without telling anyone. On the positive side for
    checked, it declares on the API what it’s going to do so consumers can handle
    it. This is good if you’re handing out a library. However a lot of developers
    use this for evil, and control the flow of their system using exceptions. Exceptions
    are for exceptional circumstances only.


    As with most discussion questions the important part is not that the developer
    agrees with your opinion but that they are capable of forming an opinion and explaining
    it. I personally fall heavily on the side that Checked Exceptions are terrible
    and developers misuse them. In my code all checked exceptions get wrapped in an
    application specific `RuntimeException` and thrown up the stack where I’ll normally
    have an `Exception` guard to catch and log the issue. However if a candidate says
    they use Checked Exceptions in their code and can explain why with an understanding
    of the problems then they get a pass. Just make sure you’ve thought about where
    you lie on the issue before you go in for your interview so you can articulate
    it to the interviewer. And if you’ve never thought about it before, then remember
    checked exceptions are evil :).


    ## JVM and Garbage Collection


    The Java Virtual Machine is the achilles heel of most developers and can cause
    even the most seasoned developers to be become unstuck. The simple fact is that
    unless something is going wrong, we don’t normally care about it. Maybe we tune
    it a little when the application goes live but after that it remains untouched
    until something goes wrong. This makes it a very difficult subject to excel in
    during interviews. Even worse, interviewers love to ask questions about it. Everyone
    should have a basic knowledge of the `JVM` to be able to do their job but often
    people recruiting are looking for someone who knows how to fix a problem like
    a memory leak when it happens.


    In this guide we take a ground up approach to the `JVM` and garbage collection
    so you can feel some level of confidence going into your big day.


    ### Q: What is the JVM? Why is it a good thing? What is “write once, run anywhere”?


    ### Are there negatives?


    `JVM` stands for `Java Virtual Machine`. Java code is compiled down into an intermediary
    language called `byte code`. The `Java Virtual Machine` is then responsible for
    executing this `byte code`. This is unlike languages such as `C++` which are compiled
    directly to native code for a specific platform.


    This is what gives Java its `Write once, run anywhere` ability. In a language
    which compiles directly to native you would have to compile and test the application
    separately on every platform on which you wish it to run. There would likely be
    several issues with libraries, ensuring they are available on all of the platforms
    for example. Every new platform would require new compilation and new testing.
    This is time consuming and expensive.


    On the other hand a java program can be run on any system where a `Java Virtual
    Machine` is available. The `JVM` acts as the intermediary layer and handles the
    OS specific details which means that as developers we shouldn’t need to worry
    about it. In reality there are still some kinks between different operating systems,
    but these are relatively small. This makes it quicker and easier to develop, and
    means developers can write software on windows laptops that may be destined for
    other platforms. I only need to write my software once and it is available on
    a huge variety of platforms, from Android to Solaris.


    In theory this is at the cost of speed. The extra layer of the `JVM` means it
    is slower than direct-to-tin languages like `C`. However java has been making
    a lot of progress in recent years, and given the many other benefits such as ease
    of use, it is being used more and more often for low latency applications.


    The other benefit of the `JVM` is that any language that can compile down to `byte
    code` can run on it, not just java. Languages like `Groovy`, `Scala` and `Clojure`
    are all `JVM` based languages. This also means the languages can easily use libraries
    written in other languages. As a `Scala` developer I can use Java libraries in
    my applications as it all runs on the same platform.


    The separation from the real hardware also means the code is sandboxed, limiting
    the amount of damage it can do to a host computer. Security is a great benefit
    of the `JVM`.


    There is another interesting facet to consider; not all `JVMs` are built equal.
    There are a number of different implementations beyond the standard `JVM` implementation
    from `Oracle`. `JRockit` is renowned for being an exceptionally quick `JVM`. `OpenJDK`
    is an open source equivalent. There are tons of `JVM` implementations available.
    Whilst this choice is ultimately a good thing, all of the `JVMs` may behave slightly
    differently. A number of areas of the Java specification are left intentionally
    vague with regards to their implementation and each `VM` may do things differently.
    This can result in a bug which only manifests in a certain `VM` in a certain platform.
    These can be some of the hardest bugs to figure out.


    From a developer perspective, the `JVM` offers a number of benefits, specifically
    around memory management and performance optimisation.


    ### Q: What is JIT?


    `JIT` stands for “Just in Time”. As discussed, the `JVM` executes bytecode. However,
    if it determines a section of code is being run frequently it can optionally compile
    a section down to native code to increase the speed of execution. The smallest
    block that can be `JIT` compiled is a `method`. By default, a piece of code needs
    to be executed 1500 times for it to be `JIT` compiled although this is configurable.
    This leads to the concept of “warming up” the `JVM`. It will be at it’s most performant
    the longer it runs as these optimisations occur.


    On the downside, `JIT` compilation is not free; it takes time and resource when
    it occurs.


    ### Q: What do we mean when we say memory is managed in Java? What is the Garbage
    Collector?


    In languages like `C` the developer has direct access to memory. The code references
    memory space addresses. This can be difficult and dangerous, and can result in
    damaging memory leaks. In Java all memory is managed. As a programmer we deal
    exclusively in objects and primitives and have no concept of what is happening
    underneath with regards to memory and pointers. Most importantly, Java has the
    concept of a `garbage collector`.


    When objects are no longer needed the `JVM` will automatically identify and clear
    the memory space for us.


    ### Q: What are the benefits and negatives of the Garbage Collector?


    On the positive side:


    - The developer can worry much less about memory management and concentrate on
    actual problem solving. Although memory leaks are still technically possible they
    are much less common.

    - The `GC` has a lot of smart algorithms for memory management which work automatically
    in the background. Contrary to popular belief, these can often be better at determining
    when best to perform `GC` than when collecting manually.


    On the negative side:


    - a a garbage collection occurs it has an effect on the application performance,
    notably slowing it down or stopping it. In so called “Stop the world” garbage
    collections the rest of the application will freeze whilst this occurs. This is
    can be unacceptable depending on the application requirements, although `GC` tuning
    can minimize or even remove any impact.

    - Although it’s possible to do a lot of tuning with the garbage collector, you
    cannot specify when or how the application performs `GC`.


    ### Q: What is “Stop the World”?

