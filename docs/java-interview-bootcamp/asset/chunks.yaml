- fmt: "\nAll of the implementations use `Compare and Set (CAS)` operations, not synchronized\
    \ blocks to ensure thread safety. This ensures no risk of deadlock and `Threads`\
    \ do not get stuck waiting, and is also significantly faster. All collections\
    \ based on `CAS` operations, such as the above, have weakly consistent iterators.\
    \ This means that they will not throw `ConcurrentModificationExceptions` but they\
    \ make no guarantee to reflect the correct state; from the documentation:\n\n\
    The returned iterator is a “weakly consistent” iterator that will never throw\
    \ `ConcurrentModificationException` and guarantees to traverse elements as they\
    \ existed upon construction of the iterator, and may (but is not guaranteed to)\
    \ reflect any modifications subsequent to construction.\n\n## The CopyOnWrites\n\
    \n### Q: How can `ConcurrentModificationException` be avoided when iterating a\
    \ collection?\n\n`CopyOnWriteArrayList`\n\n`CopyOnWriteArraySet`\n\nI’m a big\
    \ fan of well named `Classes`, and this is a great example. By copying the entire\
    \ collection on every write it guarantees immutability; if I have an iterator\
    \ looping through a collection then it can guarantee that the collection will\
    \ not be modified as it is being traversed as all modifications will result in\
    \ a copy of the data being created. This can be an expensive operation so these\
    \ collections lend themselves better to data that has frequent access but infrequent\
    \ update. An iterator which relies on the data being copied, such as in this case,\
    \ is known as a fail safe iterator.\n\n## ConcurrentHashMap\n\n### Q: How is `ConcurrentHashMap`\
    \ implemented?\n\n`ConcurrentHashMap` is a highly efficient, thread safe implementation\
    \ of `HashMap`. As discussed earlier, a `HashMap` is made up of segments, a number\
    \ of lists (defaulting to 16) which contain the data which are accessed based\
    \ on `HashCode`. In `ConcurrentHashMap` read operations are generally not blocking\
    \ which allows for it to be very speedy; writes only block by segment. This means\
    \ that the other 15 segments can be read without issue if an update is being written.\n\
    \n### Q: Should I use a `HashTable` or a `ConcurrentHashMap`?\n\n`HashTable` is\
    \ a synchronized implementation of `HashMap` but it is from an old version of\
    \ Java and should no longer be used. All operations are synchronized in `HashTable`\
    \ which means it’s performance is very poor relative to `ConcurrentHashMap`.\n\
    \n### Q: Are collections such as `ConccurrentLinkedQueue` and `ConcurrentHashMap`\
    \ completely Thread safe?\n\nThe answer is both yes and no. The implementation\
    \ is completely `ThreadSafe` and can be used as a replacement for their non Thread\
    \ safe counterparts. However, it is very possible to write code which access the\
    \ collection in a non Thread safe manner.\n\n```java\nMap<String, String> map\
    \ = new ConcurrentHashMap<>(); \nmap.put(\"a\", \"1\");\nmap.put(\"b\", \"2\"\
    );\n//....Set off a bunch of other threads....\nif (!map.containsKey(\"c\"))\n\
    \    map.put(\"c\", \"3\");\nelse\n    map.get(\"c\");\n```\n\nThe `contains`\
    \ -> `put` and `contains` -> `get` operations are not atomic. Between checking\
    \ for existence and putting/getting anything can happen in the collection. The\
    \ collection is still thread safe, our access simply isn’t. We need to ensure\
    \ any operations where we check state and then execute are done in an atomic or\
    \ synchronized way. The above code could be rectified by making use of the `putIfAbsent`\
    \ method to create atomicity; however if for example you wanted to perform an\
    \ action to a list based on it’s size you may need to lock the collection to ensure\
    \ it happens as a single operation.\n\n## Java Exceptions\n\nJava Exceptions are\
    \ one of my favourite questions to ask during telephone interviews.\n\nThey’re\
    \ one of the simpler parts of Java so I would expect most candidates to be able\
    \ to give good answers. It’s normally easy to weed out those who don’t as not\
    \ worth my time.\n\nHowever what I really like about Exceptions as interview fodder\
    \ is that they allow the combination of a technical core java question with an\
    \ opinion piece. Checked Exceptions are actually a really controversial part of\
    \ Java and it’s good to see which side of the fence a candidate falls on, or whether\
    \ they are even aware that the fence is there.\n\n## Core Questions\n\n### Q:\
    \ What is an Exception in Java?\n\nI don’t normally ask this question as it’s\
    \ so basic but it’s good to make sure you’ve got a standard answer in your pocket.\
    \ Exceptions are a way to programmatically convey system and programming errors.\
    \ All exceptions inherit from `Throwable`. When something goes wrong you can use\
    \ the `throw` keyword to fire an exception.\n\n### Q: There are 2 types of exception\
    \ in Java, what are they and what’s the difference?\n\nIt still amazes me how\
    \ much the “2 types” question throws people (yep, throws, I did it again, another\
    \ pun). This is as basic as core java gets. If you don’t get this then it tells\
    \ me that you didn’t learn core java properly (or at all) which will probably\
    \ act as a shaky base for the rest of your knowledge. Get this answer right. The\
    \ two types of exception are `checked` and `unchecked`. I’ve heard some strange\
    \ answers in my time including “Runtime and NullPointerException”! A checked exception\
    \ is one that forces you to catch it. It forms part of the API or contract. Anyone\
    \ using code that throws a checked Exception can see that as it is declared on\
    \ the method and they are forced to handle it using a `try/catch` block. Unchecked\
    \ exceptions do not need to be caught and do not notify anyone using the code\
    \ that it could be thrown.\n\n### Q: How do I know if an Exception class is checked\
    \ or unchecked?\n\nAll exceptions are checked exceptions except those that inherit\
    \ from `java.lang.RuntimeException`.\n\n### Q: What does “finally” do?\n\nExceptions\
    \ are caught using a `try-catch` block. However following the catch you can have\
    \ a `finally` block. This block is guaranteed to execute no matter what happens\
    \ (short of someone pulling out the plug), such as if an Exception is thrown in\
    \ the catch block. This is really useful to ensure the clean up of resources such\
    \ as Connections.\n\n### Q: Can I throw multiple Exceptions from the same method?\
    \ How do I catch them?\n\nYes you can, each exception (or a parent of that class)\
    \ just need listing after the `throws` in the method signature. You can catch\
    \ them using multiple catch blocks, or by catching a parent exception class e.g.\
    \ you can catch `Exception` which will catch all Exceptions.\n\nThis is in theory\
    \ bad practice as you lose the nuance of what went wrong and specifically the\
    \ ability to recover. You can also catch multiple exceptions in a single catch\
    \ block as of Java 7\\. When catching exceptions it is important to do so in order\
    \ from most specific to least specific.\n\nIf your catch block catches `Exception`\
    \ first and `IOException` second, the first catch block will always catch any\
    \ Exception coming through and the `IOException` will be rendered useless (and\
    \ in fact it will cause a compiler error saying the Exception has already been\
    \ caught)\n"
  raw: 'All of the implementations use Compare and Set (CAS) operations, not synchronized
    blocks to ensure thread safety. This ensures no risk of deadlock and Threads do
    not get stuck waiting, and is also significantly faster. All collections based
    on CAS operations, such as the above, have weakly consistent iterators. This means
    that they will not throw ConcurrentModificationExceptions but they make no guarantee
    to reflect the correct state; from the documentation:


    *The returned iterator is a “weakly consistent” iterator that will never throw*
    *ConcurrentModificationException and guarantees to traverse elements as they existed*
    *upon construction of the iterator, and may (but is not guaranteed to) reflect
    any* *modifications subsequent to construction.*


    **The CopyOnWrites**


    **Q: How can ConcurrentModificationException be avoided when iterating a** **collection?**


    CopyOnWriteArrayList


    CopyOnWriteArraySet


    I’m a big fan of well named Classes, and this is a great example. By copying the
    entire collection on every write it guarantees immutability; if I have an iterator
    looping through a collection then it can guarantee that the collection will not
    be modified as it is being traversed as all modifications will result in a copy
    of the data being created. This can be an expensive operation so these collections
    lend themselves better to data that has frequent access but infrequent update.
    An iterator which relies on the data being copied, such as in this case, is known
    as a fail safe iterator.


    **ConcurrentHashMap**


    **Q: How is ConcurrentHashMap implemented?**


    ConcurrentHashMap is a highly efficient, thread safe implementation of HashMap.
    As discussed earlier, a HashMap is made up of segments, a number of lists (defaulting
    to 16) which contain the data which are accessed based on HashCode. In ConcurrentHashMap
    read operations are generally not blocking which allows for it to be very speedy;
    writes only block by segment. This means that the other 15 segments can be read
    without issue if an update is being written.


    **Q: Should I use a HashTable or a ConcurrentHashMap?**


    HashTable is a synchronized implementation of HashMap but it is from an old version
    of Java and should no longer be used. All operations are synchronized in HashTable
    which means it’s performance is very poor relative to ConcurrentHashMap.


    **Q: Are collections such as ConccurrentLinkedQueue and ConcurrentHashMap** **completely
    Thread safe?**


    The answer is both yes and no. The implementation is completely ThreadSafe and
    can be used as a replacement for their non Thread safe counterparts. However,
    it is very possible to write code which access the collection in a non Thread
    safe manner.


    1 Map<String, String> map = new ConcurrentHashMap<>(); 2 map.put("a", "1");


    3 map.put("b", "2");


    4 *//....Set off a bunch of other threads….*


    5 **if** (!map.containsKey("c"))


    6 map.put("c", "3");


    7 **else**


    8 map.get("c");


    The contains -> put and contains -> get operations are not atomic. Between checking
    for existence and putting/getting anything can happen in the collection. The collection
    is still thread safe, our access simply isn’t. We need to ensure any operations
    where we check state and then execute are done in an atomic or synchronized way.
    The above code could be rectified by making use of the putIfAbsent method to create
    atomicity; however if for example you wanted to perform an action to a list based
    on it’s size you may need to lock the collection to ensure it happens as a single
    operation.


    **Java Exceptions**


    Java Exceptions are one of my favourite questions to ask during telephone interviews.


    They’re one of the simpler parts of Java so I would expect most candidates to
    be able to give good answers. It’s normally easy to weed out those who don’t as
    not worth my time.


    However what I really like about Exceptions as interview fodder is that they allow
    the combination of a technical core java question with an opinion piece. Checked
    Exceptions are actually a really controversial part of Java and it’s good to see
    which side of the fence a candidate falls on, or whether they are even aware that
    the fence is there.


    **Core Questions**


    **Q: What is an Exception in Java?**


    I don’t normally ask this question as it’s so basic but it’s good to make sure
    you’ve got a standard answer in your pocket. Exceptions are a way to programmatically
    convey system and programming errors. All exceptions inherit from Throwable. When
    something goes wrong you can use the throw keyword to fire an exception.


    **Q: There are 2 types of exception in Java, what are they and what’s the difference?**


    It still amazes me how much the “2 types” question throws people (yep, throws,
    I did it again, another pun). This is as basic as core java gets. If you don’t
    get this then it tells me that you didn’t learn core java properly (or at all)
    which will probably act as a shaky base for the rest of your knowledge. Get this
    answer right. The two types of exception are **checked** and **unchecked**. I’ve
    heard some strange answers in my time including “Runtime and NullPointerException”!
    A checked exception is one that forces you to catch it. It forms part of the API
    or contract. Anyone using code that throws a checked Exception can see that as
    it is declared on the method and they are forced to handle it using a try/catch
    block. Unchecked exceptions do not need to be caught and do not notify anyone
    using the code that it could be thrown.


    **Q: How do I know if an Exception class is checked or unchecked?**


    All exceptions are checked exceptions except those that inherit from java.lang.RuntimeException.


    **Q: What does “finally” do?**


    Exceptions are caught using a try-catch block. However following the catch you
    can have a finally block. This block is guaranteed to execute no matter what happens
    (short of someone pulling out the plug), such as if an Exception is thrown in
    the catch block. This is really useful to ensure the clean up of resources such
    as Connections.


    **Q: Can I throw multiple Exceptions from the same method? How do I catch them?**


    Yes you can, each exception (or a parent of that class) just need listing after
    the “throws”


    in the method signature. You can catch them using multiple catch blocks, or by
    catching a parent exception class e.g. you can just catch Exception which will
    catch all Exceptions.


    This is in theory bad practice as you lose the nuance of what went wrong and specifically
    the ability to recover. You can also catch multiple exceptions in a single catch
    block as of Java 7\. When catching exceptions it is important to do so in order
    from **most specific** to **least specific**. If your catch block catches Exception
    first and then IOException second, the first catch block will always catch any
    Exception coming through and the IOException will be rendered useless (and in
    fact it will cause a compiler error saying the Exception has already been caught)


    **Q: What do you think of Checked Exceptions, are they a good thing?**


    **Q: When you’re writing your own code and you need to throw a custom exception,**
    **do you create a checked or unchecked exception?**


    **Q: C# does not have Checked Exceptions. Can you tell me why this might be? Who**
    **do you think was right, Java or C sharp?**


    I love these questions so much. It’s a really good way to stretch a candidate
    and to see if they understand how to architect systems. Having an appropriate
    policy on Exceptions is key to maintaining a clean code base, and you’ll quickly
    figure out who’s thought about the issue and who hasn’t. A must read before your
    interview is this interview with the creator of C# on [why he didn’t include checked
    exceptions in the language.](http://www.artima.com/intv/handcuffs.html) The argument
    in general is that Checked Exceptions cause ugly code in Java. Handling is incredibly
    verbose, and normally most developers don’t know how to handle them or are too
    lazy to.'
