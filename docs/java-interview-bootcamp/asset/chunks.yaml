  trans: '

    一种常见的做法是邀请你来讨论代码。我非常喜欢这个概念。


    代码本身往往无法解释某项设计决策，但它是招聘者理解你思维方式的良好平台。你为什么那样对领域进行建模？你为什么使用组合而不是继承？在面试之前，花一个小时查看你的代码，尝试构思可能的问题并准备答案。对于你为什么以某种方式编写代码，说出“我不知道”可并不好。设计决策和实现决策应该是深思熟虑的。以下是我喜欢问候选人的的一些关键问题：


    - 为什么你选择（或为什么没有选择）将其作为最终方案？它是不可变的吗？

    - 这里有任何线程问题吗？

    - 这代码看起来相当复杂。你为什么要这样写？有什么方法可以简化它吗？

    - 你在这里写了注释。为什么？

    - 你为什么选择 `ArrayList`/`LinkedList`/ 或其他？

    - 是否有任何第三方库可以帮助你完成这项工作？

    - 你重写了 `equals`/`hashcode`。为什么？结果导致了什么变化？

    - 对于任何对速度有要求的地方：你测试过这是否产生了差异吗？


    记住，很少有一个“正确”的答案。问题的目的是为了引发讨论，并观察你是否理解每种选择的考量。不要觉得有必要编造内容或因为认为面试官在寻找特定答案而做出妥协。坚持你的观点，并进行理性的讨论！


    ## 介绍一下你的系统


    这是我在面对面面试时最喜欢问的问题之一。在你目前的工作职位上，你正在处理一个系统（可能是多个），而且你已经在其中投入了大量心血。你可能有一群同事一起工作让系统上线，并为某交付了出色的价值。这应该是你真正、非常熟悉的一件事。尽管如此，被这个问题难住的候选人数量之多得惊人。你不会相信有些人在这个问题上会如此挣扎。


    ## 为什么会被问这个问题？


    对于面试官来说，这是衡量候选人经验的极佳方式。有些开发者往往只会使用摆在面前的技术，既理解也不在乎为什么。这应该引起一个巨大的警信号。成为一名 Java 开发人员不仅仅是了解语法。你需要理解系统为什么是这样组合的，以及它们的优缺点是什么。无论候选人的经验如何，我都要求他们具备这一点。你是否参与了系统的架构设计并不重要。你应该能够对所做的决策给出看法，无论是正面的还是负面的。记住，系统本身的架构并不是受审对象；如果你认为它很糟糕，你可以直说。极少数人有机会参与真正的绿地项目并从零开始构建解决方案，而现实中，每个系统都会有缺陷；这没关系。重要的是你了解系统中的弱点，并且你可以解释你会如何采取不同的处理方式。


    ## 利用这次机会


    如果你足够幸运被问到这个问题，请务手抓住这个机会。比起面试的任何其他部分，这给了你一个脱颖而出并展示自己是一个优秀候选人的机会。如果你能表现得出色，那么获得录取
    Offer 就不远了。


    ## 准备


    坐下来，拿着笔和纸，把你的系统画出来。如果你觉得目前正在做的系统没趣，那就用你过去做过的其他东西。按照经验，面试官并不特别关心你现在正在做的项目，他们只是让你向他们讲解一个系统。


    画出相关的组件。它们是用什么语言编写的？使用了什么技术或框架？你同意这些选择吗，还是你希望有不同的？画出并标记它们之间的通信。它使用文件吗？


    总线（Bus）？套接字（Sockets）？鸽子？写下来。现在准确地解释为什么每个东西要那样做。它是为什么被选中的？你是否参与了决策，或者你是否同意它，并不重要。解释逻辑（或你认为逻辑是什么），并概述这是一件好事还件坏事。


    如果你有更偏好的做法，也说出来。现实中，大多数选择都归结为某种非功能性需求。“这个对延迟非常敏感，所以我们选择了这个中间件来满足该需求。“交易员并不在乎，所以我们把它做成了批处理，因为它更容易维护。”你在这些问题中的任务是证明你理解每个组件的需求，以及这些需求如何联系技术选择。不要忘记，需求绝不是纯功能性的。你如何支持应用程序？平均恢复时间是多少？系统是全球性的还是局部的？如果你的数据中心淹水会怎样？


    ## 面试示例


    这个面试是虚构的，但应该代表你在真实面试中可能预期的内容。将这种提问方式应用于你自己的系统。


    ### 请你介绍一下你的系统吗？


    当然。它接收来自下游系统的大量交易数据并进行存储。它对数据进行一些复杂的转换，并供终端用户和进一步的上游系统使用。


    ### 好的，能给我画出来好吗？


    好的。首先，我们有一个导入器（importer）。它从我们的多个下游系统摄取数据，这些系统包含了订单和报告信息。它是用 `Java` 编写的。它每天从 3
    个系统获取文件，并且提供了通过我们拼凑的一些 Web 界面手动导入数据的选项。


    ![](img/index-31_1.jpg)


    ### 为什么你选择使用文件而不是持续更新或其他什么？


    遗留原因。这些系统是很多以前构建的，人们不愿意在它们上投入任何资金，因为它们基本能用。这限制了我们，因为无法创建实时的客户报告，只能每天一次。我们目前正处于一个转型项目中，以允许实时流；尽管有些系统永远不会升级，但有些新的下游系统需要接入我们的系统。这是我目前工作的大部分内容。我在里面放了一个
    `HTTP` 接口以允许日内更新，作为一种临时方案。那无法应对我们的目标数据负载，但还没有决定怎么做。


    ### 好的，那么这个系统是全球性的吗？


    是的，我们在纽约和伦敦都有导入器。每个地区的系统略有不同，所以我们对代码进行了微调。


    ### 那么你们拥有一套代码库还是多个？


    我们以前有多个代码库。跨库修复补丁简直是场噩梦，所以我们最近合并到了单一的 `GIT` 仓库，并根据每个位置增加了功能开关。我非常喜欢学习 `GIT`，它比
    `SVN` 好得多，而且能实践功能开关感觉很棒。


    ### 那么故障转移怎么办？如果某个东西宕机了？


    老实说，它并不经常发生，直到最近还没有故障转移。由于它目前是一个批处理系统，这从未成为问题，但由于我们正尝试转向实时更新，这意味着一旦出现问题，用户会非常愤怒。结果是我们开始运行两个实例。不过，第二个实例只暴露实时功能，不碰批处理。这是因为我们需要引入复杂的故障转移机制来防止两个批处理发生。这是一种成本/风险分析；如果批处理出现问题，我们在修复时延迟一会儿没关系，但实时系统不是如此。


    '
- fmt: '

    ## Ok, so what does the importer do then?


    It takes the files and updates and turns them into messages and puts them on our
    global bus. We have a bunch of components that need this data so hang it off this
    bus. It’s using `IBMMQ`: not my choice, it’s mandated by the company.


    ## What would you rather use? Why choose a bus?


    I’d rather use `ActiveMQ`. It’s much easier for testing and I’ve had great experience
    with it when I’ve used it before. The bus was my idea. It removes a lot of issues
    with regards to failover. Before we had a massive web of point to point connections
    which were difficult to manage from a support perspective and meant that if a
    single component went down the system would collapse. Having a bus breaks the
    tight coupling between components and has seen our overall stability increase
    significantly; we used to have 1 outage a month last year but since introducing
    this we’ve had no full blackouts.


    ## Are there any issues using a bus?


    It’s extra middleware which can be a nightmare to manage, particularly if you
    have a centralised team like we do. It also decreases the visibility of what’s
    going on. We had some problems with messages going missing and had to very quickly
    become experts at config tuning. I think overall it was a good choice though.


    ## Do you know any other Bus technologies?


    There’s `HornetQ` and `ZeroMQ`. I’ve not had chance to play with them but I hear
    `HornetQ` is really fast.


    ## What format do you put on the wire?


    We’re using `XML`. I wanted to use `JSON` but there was push back from the upstream
    teams. `JSON` is much nicer, it’s more readable, it’s much less verbose and so
    smaller and quicker on the wire. However the other teams are heavily invested
    in `XML` so we compromised.


    ## Ok. What next?


    We have a database that hangs off that records all the data imported onto the
    bus. We need a historical record of data so this stores it for up to 7 years.
    It’s a basic `MySQL` instance.


    ## Why did you choose to hang it on the bus? Why not have it attached to the importer?


    ### Couldn’t you have a case where the bus collapses and you’ll lose a message?


    We make sure to log stuff as it comes through the importer so we can manually
    reconcile messages in a worst case scenario. If we had to do a DB transaction
    every new record it would be really slow in the importer. We felt it was best
    to decouple this completely. It also made failover easier, as the importers just
    need to worry about who’s publishing to the bus, and don’t need to mess around
    with database connections.


    Some of our upstreams consume this raw feed, but for others we have an enhanced
    feed.


    This transformer enriches the data with some information from a different database
    and puts it back onto the bus.


    ## How quick is that?


    Not very, it takes a few seconds. Right now that’s not a problem but as we move
    to real time it needs to be fixed. I’d like to look at some near caching technologies
    for it.


    We also have a set of user screens that feed of the data. This talks directly
    to the transformer.


    ## Why did you choose to directly connect it and not use the bus?


    It’s another piece of legacy we haven’t gotten around to fixing. Ideally it would
    hang off the bus too but for now it has a direct connection.


    ## What connection are you using between them?


    Plain sockets. We’ve got an embedded `Netty` server in the transformer. I’m a
    big fan of `netty`.


    ## What about failover?


    We run the Transformers in London only, but we run them hot warm. We have some
    basic heartbeating on the bus so they know which is alive. If the heartbeats stop
    then the secondary takes over.


    ## Have you had any issues with this? What about split brain?


    Yes, we’ve had split brain happen a couple of times. We were too aggressive with
    the heartbeat timeout so we’ve pushed that back. It’s an acceptable compromise,
    if the transformer gets delayed for a few seconds during failover it’s ok.


    Hopefully you get the idea. For every system you need to be able to explain The
    technology choice, The failover strategy, The transport choice.


    You also can use this as an opportunity to express you knowledge of other technologies.
    In the interview there’s references to `Netty`, `ZeroMQ`, `HornetQ`, `IBMMQ`,
    `ActiveMQ`, `Git`, `Feature Toggles`, `heartbeating`, `XML` vs `JSON`, `MySQL`
    and `Oracle`. That’s a lot of technologies and design patterns. This is an effective
    way to show that you have a broad knowledge of your domain. It’s impossible to
    know everything which is why when hiring it’s good to look for people who can
    introduce new ideas and technologies into the organisation. And if you don’t know
    any then spend the time to look on google. Type in “Alternatives to ” and the
    technology and you’ll have a ton of articles laying the arguments out for you.


    ## Part Two: Core Java


    Now you’re fully equipped to excel at the softer skills of interviewing it’s time
    to learn how to answer the technical stuff. There is an unlimited selection of
    questions which an interviewer could ask you; the Java universe is huge. So where
    do you start?


    The traditional method is to google around for lists of interview questions (that
    may even be how you found this book). The simple fact is that generally the questions
    will be much more in-depth than what most of what you will find-you’re never going
    to get asked a simple list of questions. You really need to understand the areas
    you’re talking about.


    That’s what this section will give you; an in depth revision guide to the core
    areas of Java that you need to know for most interviews. Read this half all the
    way through, then come back to the sections you feel really struggle with. Fundamentally
    you will understand all of the topics covered in this chapter from the work you
    do in your day to job, however being able to code away on your machine and being
    able to explain the concepts are very different things. Perhaps you’ve never worked
    on a highly-threaded application. In that case, spend the time re-reading about
    Threading.


    ### Object Oriented Programming


    #### Basics


    Questions on Object Programming are exceptionally common on interviews and with
    good reasons. For junior developers it can clearly differentiate between someone
    who doesn’t understand programming and a candidate who could be a potential star
    but simply lacks in experience. For more senior candidates I find it can help
    identify developers who understand good design and how code should be put together.
    There is a huge array of questions (pun intended) and it is well worth significant
    study. Fundamentally you will understand all of the topics covered in this chapter
    from the work you do in your day to job, however being able to code away on your
    machine and being able to explain the concepts are very different things. We all
    know (hopefully) that we should aim for low coupling and high cohesion. But can
    you explain what that means? Can you give a concise answer? Take the time to really
    think about the questions below. Often answers will vary based on personal preference
    and experience.


    **Q: Java is an Object Oriented Language. What does that mean?**


    There are a number of different programming paradigms of which OOP is but one.
    Another would be functional programming (which is becoming very popular with languages
    like `Scala`). Programs are modelled as Objects which are analogous to real world
    objects. For example, when modelling a car you could create a `Car` object, which
    would possess 4 `Wheel` Objects and an `Engine` Object. An Object is defined by
    the data it contains and the actions that can be performed on it or with it. The
    four key principles of OOP are Abstraction, Encapsulation, Inheritance and Polymorphism.


    **Q: What is a Class? What is an Object?**

