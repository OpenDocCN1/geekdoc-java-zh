    Access to pens and paper or a whiteboard make this the best format to ask design
    questions in. Expect to be grilled about a system you’ve worked on before or asked
    to design something on demand. Similarly, interviewers love to ask people to write
    up pseudocode, particularly questions around creating search or sort algorithms.
    This tees the path up nicely for some big O type questions, but more importantly
    gives your potential employer the opportunity to see how you work through a problem.


    ## One on one


    The simplest interview. Person to person, normally for an hour or even more. This
    has the benefit that you are only trying to impress a single person, but this
    in turn means that if you get off on the wrong foot, or the person you’re interviewing
    with is having a bad day then you have a problem. Try to get an understanding
    of who your interviewer is before you go to the interview if possible. From my
    experience these one to one meetings are normally with team leads or above, so
    whilst there will likely be some technical content the main purpose of the exchange
    is to understand how you are going to fit into the team and wider company culture.


    ## Group Grilling


    Personally I think this is the most difficult of the interviews. Normally 2 or
    3 of your potential new team members will be sat on the opposite side of the table
    throwing their best questions at you whilst you try your very best not to embarrass
    yourself. I find this interview the worst because impressing 3 people is really
    hard to do. Everyone has their own opinions and ways of working and the likelihood
    of you being able to satisfy all of your interrogators is slim.


    ## Speed Dating


    The speed dating interview involves cramming in as many interviewers as possible
    within an allotted space of time. The default tends to be working through 3 separate
    interviewers.


    You remain in a room and interview with each one for 20 or 30 minutes, before
    they disappear and are replaced with yet more people asking different questions.
    I’ve even experienced this before when one of the interviewers has been dealing
    in using Video Conference. From an interviewers side this is great; you get a
    consensus opinion from a number of members of staff (anyone who gets a yes from
    all three is a definitive pass) and it also means you can interview 3 candidates
    simultaneously. This is a really effective way of churning through people.


    From the interviewee side however it can be intense. That’s a lot of interviewing!
    If you’re just doing 1 hour with one or two people then once you’re in the flow
    things are good.


    You can get comfortable with your interviewer. However seeing lots of different
    interviewers means you can’t relax. You’re constantly trying to figure out what
    each person is looking for. It is really hard work, and there is no way to prepare
    for it beyond regular `java` preparation. The best advice I can give you if going
    in for one of these is to remember that everyone’s different. Although generally
    there will be team themes (maybe they all love Test Driven Development) the individuals
    will all like different facets, prefer different technologies. As with any interview,
    try to strike up a rapport with the person on the other side of the table. Whilst
    obviously it is important to be technically able, a huge percentage of you success
    is going to come down to whether the interviewer likes you and your attitude.


    ## Example Interview Process


    To give you an idea of what to expect, here are some example processes I’ve gone
    before:


    ### Major Australian Bank:

    - One on One Interview with team manager

    - Aptitude test

    - 2 hour technical interview; 1 hour face to face with local developer, 1 hour
    with 2 developers over Video Conference

    - Interview With Department Heads


    ### Small Charity Firm

    - Face to Face with future manager and department head

    - HR Interview


    ### Major International Bank

    - 30 Minute phone interview

    - Pair Programming interview with 2 developers

    - Group Grilling with 3 developers


    ## Creating your resume


    You only get one opportunity for a first impression, From which point it’s either
    working for you or against you. This applies across all media, from websites (where
    you have 7 seconds to impress the visitor) to meeting a new person at an interview
    (where you have even less). Getting off on the wrong foot means you need to be
    incredibly impressive to stand a chance of landing your new role, which whilst
    not impossible is certainly going to make a difficult interview even harder. On
    the other hand if you arrive and can make a bond with an interviewer then the
    job is yours to lose; psychologically they’re going to be rooting for you to do
    well, so long as you don’t make any major mistakes then the person on the other
    side is going to do try his best to get you hired.


    “But how does this relate to my CV?” I hear you cry. Your CV is your very first
    first impression. When those pages land on someones desk it is the first time
    they have been exposed to you and what you stand for. Interviewers receive hundreds
    of CVS for every role so understandably very few of them stand out as exciting.
    Let’s be clear; your CV is a sales document. After reading your hard crafted words
    you want whoever is reading it to turn to the person next to them and say ‘hey,
    this guy looks really good. We should bring him in soon”. I would say this happens
    for me every 20 CVs or so.


    Before we dive into crafting the perfect programmer’s propaganda, I have one crucial
    piece of advice that applies not just to CVs but to all of the hiring and interview
    processes that you’re going to go through.


    ### Killer advice: Everyone is different


    All of the people you are going to talk to during the interview process will have
    differing opinions on what makes a good developer. If there was a standardised
    exam or some other way of telling a good developer from a bad one then it would
    make hiring a whole lot easier (and no, being a Sun Certified Java Programmer
    does not even come). Every interview you go to is going to have different questions
    and each interviewer is going to have a different set of values. One may value
    polyglot developers. Another may value TDD and BDD. The next may believe all code
    should be done in notepad and hand compiled. There is no golden bullet.


    As a candidate it can be hard to remember this. Perhaps your CV isn’t getting
    you interviews, or maybe you’ve been on a couple of interviews and haven’t progressed.
    Your head drops and you conclude that you’re stuck where you are and that you’re
    not enough to get a new job.


    The reality is that you’ve just not found a place that aligns with your values
    yet, and that’s ok.


    What you want from a job may make it easier or harder for you to find a role.
    For me, I hate big-o notation and performance questions because I have google
    nearby and I believe people have a tendency to prematurely optimise code; real
    performance problems happen very rarely. That means there are interviews where
    I come out and I know I have done terribly and I don’t care. I’m comfortable knowing
    I don’t want to work for that team because their values don’t align with mine.
    Does that make it harder for me to get a job?


    Yes, but it means that when I find a role it’s the one that I really want. You
    spend most of your waking life at work, so you may well spend the time to get
    it right.


    This is a roundabout way of saying that there is no golden template for your resume.
    You can send a CV to 5 different people and get 5 different responses. All you
    can do is bullet proof your document so you don’t have stupid things like spelling
    errors (which happens a lot) and then use your text to craft a message that makes
    you as desirable as possible to the type of people you want to work for.


    ## Resume Format


