    ## JVM 与垃圾回收


    Java 虚拟机（JVM）是大多数开发者的阿喀琉斯之踵，甚至会让经验丰富的开发者也陷入困境。事实证明是，除非出现问题，否则我们通常并不关心它。也许在应用程序上线后我们会对其进行微调，但在之后，在出现问题之前，它一直保持原样。这使其成为面试中一个非常难以攻克的科目。更糟糕的是，面试官喜欢问关于它的问题。每个人都应该具备
    `JVM` 的基础知识以完成工作，但招聘人员通常在寻找那些如何在内存泄漏发生时修复此类问题的人。


    在本指南中，我们将从零开始研究 `JVM` 和垃圾回收，让你在面对大时刻感到自信。


    ### Q: 什么是 JVM？它为什么是一件好事？什么是“一次编写，随运行”？


    ### 是否有负面影响？


    `JVM` 代表 `Java Virtual Machine`（Java 虚拟机）。Java 代码被编译成一种名为 `byte code`（字节码）的中间语言。然后由
    `Java Virtual Machine` 负责执行这些 `byte code`。这与 `C++` 等语言不同，后者直接编译为针对特定平台的原生代码。


    这赋予了 Java `Write once, run anywhere`（一次编写，随运行）的能力。在直接编译为原生代码的语言中，你必须在希望运行的每个平台上分别对应用程序进行编译和测试。库方面可能会出现很多问题，例如如何确保它们在所有平台上都是可用的。每个新平台都需要新的编译和新的测试。这既耗时又昂贵。


    另一方面，Java 程序可以在任何可用 `Java Virtual Machine` 的系统上运行。`JVM` 充当中间层并处理特定于操作系统的细节，这意味着作为开发者，我们不应该担心它。在现实，不同操作系统之间仍然存在一些小瑕疵，但这些都是相对较小的。这使得开发变得更快、更简单，意味着开发者可以在
    Windows 笔记本电脑上编写可能目标是其他平台的软件。我只需要编写一次我的软件，它就可以从 Android 到 Solaris 的各种平台上运行。


    从理论上讲，这是以牺牲速度为代价的。`JVM` 的额外层意味着它比 `C` 这种直接编译到机器的语言慢。然而，Java 近年来取得了巨大进展，考虑到易用性等许多其他优势，它正被越来越多地用于低延迟应用。


    `JVM` 的另一个优点是，任何可以编译为 `byte code` 的语言都可以在其上运行，而不只是 Java。`Groovy`、`Scala` 和 `Clojure`
    等语言都是基于 `JVM` 的语言。这意味着这些语言可以轻松地使用其他语言编写的库。作为一名 `Scala` 开发者，我可以在应用程序中使用 Java 库，因为它们都运行在同一个平台上。


    与真实硬件的分离意味着代码是沙箱化的，限制了它对主机计算机可能造成的破坏程度。安全性是 `JVM` 的一大优势。


    还有另一个值得考虑的有趣方面：并非所有的 `JVM` 都是等同的。除了 Oracle 的标准 `JVM` 实现外，还有许多不同的实现。`JRockit` 以其异常快速
    `JVM` 闻名。`OpenJDK` 是开源对等品。有大量的 `JVM` 实现可用。虽然这种选择终究是一件好事，但所有 `JVMs` 的行为可能略有不同。Java
    规范的许多领域在实现方面被刻意模糊化，每个 `VM` 可能会以不同的方式处理。这可能导致仅在特定平台上的特定 `VM` 中表现出的 bug。这些可能是最难发现的
    bug。


    从开发者的角度来看，`JVM` 提供了许多优势，特别是在内存管理和性能优化方面。


    ### Q: 什么是 JIT？


    `JIT` 代表“Just in Time”（即时编译）。正如讨论过的，`JVM` 执行字节码。然而，如果它确定一段代码正在被频繁运行，它可以选择性将该部分代码编译为原生代码以提高执行速度。可以被
    `JIT` 编译的最小块是一个 `method`（方法）。默认情况下，一段代码需要执行 1500 次才会被 `JIT` 编译，尽管这是可以配置的。这导致了“预热”
    `JVM` 的概念。它运行得越久，性能就越高，因为这些优化会不断发生。


    在缺点方面，`JIT` 编译并不是免费的；它在发生时会消耗时间和资源。


    ### Q: 当我们说 Java 内存时指的是什么？什么是垃圾回收器？


    在 `C` 等语言中，开发者直接访问内存。代码引用内存地址。这可能是困难且危险的，并可能导致内存泄漏。在 Java 中，所有内存都是管理的。作为程序员，我们完全处理对象和原始类型，对底层的内存和指针没有概念。最重要的是，Java
    有 `garbage collector`（垃圾回收器）的概念。


    当对象不再需要时，`JVM` 会自动识别并清理内存空间。


    ### Q: 垃圾回收器的优点和缺点是什么？


    优点方面：


    - 开发者可以少地担心内存管理，专注于解决实际问题。虽然内存泄漏在技术上仍然可能，但它们要少得多。

    - `GC` 有许多用于内存管理的智能算法，并在后台自动运行。与流行观点相反，这些算法通常比手动收集更好地判断何时执行 `GC` 最佳。


    缺点方面：


    - 当发生垃圾回收时，它会对应用程序性能产生影响，特别是减慢或停止它。在所谓的“停止整个世界”（Stop the world）垃圾回收期间，应用程序的其他部分将冻结。这取决于应用程序的需求可能是不可接受的，尽管
    `GC` 调优可以减少甚至消除任何影响。

    - 尽管可以对垃圾回收器进行许多调优，但你无法指定应用程序何时以及如何执行 `GC`。


    ### Q: 什么是“停止整个世界”？


