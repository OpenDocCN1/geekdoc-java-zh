    ## 核心 Java

    核心 Java：多线程、异常、数据结构与算法、面向对象编程等。这些都是基础内容，你只需要花点时间重新温习一下。


    这些问题是否是衡量你能力的良好提问并不重要；大多数面试都会回到这些点上，所以做好准备是明智的。阅读《Java 面试训练营》（Java Interview Bootcamp）的后半部分是最好的起点。


    ## 技术讨论

    “你用过技术 X 吗（或‘我从你的简历上看到你用过 X））？”能介绍一下吗？你对它有什么看法的？”我默认的首选话题是 `Spring` 和 `Hibernate`，因为它们有很多可以从初始问题延伸并进行深入探讨的问题。它们也出现在大多数人的简历上。


    这类问题是我偏问的，因为你可以借此了解候选人的知识水平，以及他们是否真的理解自己使用的工具，还是仅仅因为被要求才使用它们。看看你简历上的核心技术，并想出你对它们的观点。面试官可能并不在乎具体的观点是什么，而是在乎你能否清晰地阐述每一方面的优缺点并得出结论。


    ## 技术与技巧

    我很喜欢问这些问题。每个办公室的运作方式都不同：敏捷对比瀑布（是的，瀑布流依然存在）、`TDD`/`BDD` 以及其他开发模式、编程风格等。同样，如果你把这些写在了简历上，你就需要确保对自己的经验有良好的回答。如果你的部门使用
    `TDD` 所以你把它放在简历上，但你实际上并没有这样做，你会显得很糟糕。


    再次检查你的简历，看看你列出的内容；为每一项准备强有力的解释。


    ## 脑筋急转弯

    这类包含了谷歌风格的问题，比如“世界上有多少粒沙子？”以及“如果你被困在电梯里一个半小时怎么办？”尝试读一些这类问题让自己在回答时更从容是好的，但实际上，这些并不是通过大量学习就能掌握的。我个人并不太喜欢这些，但每个面试官都是不同的。


    尽量不要去猜测面试官在寻找什么，或者你认为面试官认为什么是“正确”答案。他们可能会故意引导你走错路，以看你是否是一个“唯诺诺”。即使你的观点看起来很有争议，也要坚持自己。保持礼貌、诚实，并尝试参与开放式讨论。电话那头的对面不是机器人，所以要尝试从人性的角度与其进行双向对话。如果候选人在回答过程中反问我一个问题，我通常会很。面试应该是双向的。


    ## 面试后

    通常情况下，你对自己的表现应该很有数，但不要担心。我遇到过一些觉得自己搞砸了但其实表现很好的候选人。相反，我也遇到过表现糟糕却自认为很出色的人。只需等待他们的回复，并对你已经尽力的事实保持放松心情。如果你没有通过，也不纠结。事实是，每个面试官都是不同的，观点也不同，每家公司重视的东西也不同，你可能在那段时间并不适合那个团队。这没关系。继续申请不同的职位即可。


    除此之外，还有人为因素；也许面试官今天心情不好，或者他们还没吃午饭所以肚子饿。想到这可能影响你的潜在工作机会很糟糕，但这是生活的常态。无论你做什么，都不要对结果提出异议。回邮件试图在你有时间思考后解释得更清楚一些，或者请求再次面试都是没用的，而且可能会损害你的声誉。


    这个行业出奇地小（特别是得益于 `LinkedIn`），所以要抬头做人，花时间回顾你下次可以做得更好的地方，然后继续前进。


    ## 面对面面试

    在招聘过程中，你可能进行的大部分面试都是面对面面试的变体：正如书中前面讨论过的，招聘人员可以选择的变体非常多。虽然针对每种面试都有特定的技巧和窍门，但存在一些贯穿始终的核心准则，这些准则能让你作为候选人尽可能地代表自己。虽然拥有职位所需的技能显然至关重要，但现实是，成功往往取决于直觉——面试官对你是否有良好的“感觉”。你可以通过展示自己的方式来产生影响；你的握手、你的对话以及你的肢体语言。根据我的经验，在对候选人做出决定时，这些最终会产生巨大影响。


    ### 第一印象

    这很陈词，而且我已经说过很多次了，但第一印象确实代表一切。初次见面可能决定成败，即使你一个问题都没有回答。虽然我认为任何偏见都是无意识的，但人们仅仅根据自我介绍就会给他们喜欢的候选人问更容易的问题（而对难搞的候选人问更难的问题）。


    但什么是良好的第一印象呢？


    #### 时到达

    这竟然需要写下来真是令人费解，但我遇到的迟到的候选人多得令人惊舌。面试你的是忙碌的人，他们是从一天工作中抽出时间和你坐在一起。你迟到的那一刻，你就进入了“否”列并挣扎着想要。理想情况下，尝试在计划开始时间前
    5 分钟到达。不要太早也很重要。我知道我去过的每个地方都面临会议室空间的问题，如果你来得早，会让面试官产生找地方让你等的压力。


    #### 穿着得体

    视行业而异，但我发现通常人们不再穿西装领带，通常只穿长裤和衬衫。我认为这样更好，并且有助于你放松。如果你觉得穿西装更舒服，那就尽管穿（尽管我建议进入面试时脱掉西装外套）。但是，确保你穿的任何东西都合适：不要成为那种穿大两个号西装的极客刻板印象。我以前有人穿牛仔裤和
    T 恤来面试。千万不要那样。穿得太正式永远不会留下坏印象，但穿得太随意绝对会。


    #### 握手

    永远不要低估良好握手的重要性。握手有三种。第一是软弱、无力的握手，很多极客都有这种表现，因为我们倾向于胆怯。你通过握手在表达你是什么样的人。如果你的握手没有力度，结论就是你在办公室里很软弱：不太可能站在白板前或发表强烈的观点。仅仅是因为一次握手！


    第二种握手是碎骨手。在光谱的另一端，类型的人听说过有力握手很重要，结果试图压碎对方的手来展示力量和实力。再次，避免这种。这说明你是一个强势的人，或者你正在过度补偿什么。这也很疼！这和软弱握手一样糟糕。


    '
- fmt: "\nInstead we want the third shake, the `Goldilocks` of handshaking: just right.\
    \ A good handshake conveys confidence but without being over the top. It is firm,\
    \ with good pressure, but without leaving the other person feeling they need to\
    \ go to hospital with a broken hand. Unsurprisingly this takes practice. So practice!\
    \ Ask your close colleagues, friends or family to practice with you. It can take\
    \ only 3 minutes of testing out different pressures to figure out what a good\
    \ handshake is for you but it can make a huge difference in your first impression.\
    \ I was lucky enough in school to have a teacher who ran a lesson dedicated to\
    \ this and it has stood me in good standing ever since.\n\n### First conversation\
    \ \nThe awkward moment where you finally have to talk. The two major things you\
    \ need to consider here are what you want to say, and how you’re going to say\
    \ it.\n\nBody language, mannerisms and tone are all understandably important.\
    \ Your job is to convey to the interviewer that you are excited for the interview\
    \ and job opportunity. You would be surprised by the number of candidates who\
    \ sound like they have no interest in being at the interview. If your tone is\
    \ dull and you sound like this is just another interview your recruiter is putting\
    \ you through then why should the interviewer be willing to spend his time with\
    \ you? Sound interested. Sound excited. Sound like you want the job!\n\nGo into\
    \ your interview with some ideas for small talk. Again, we programmers tend to\
    \ be a quiet bunch lacking in conversational skills. Chances are there’s going\
    \ to be some point from when you’re collected in reception to the interview starting\
    \ where you’re going to need to fill the gap with conversation. This is a great\
    \ opportunity for you to sell yourself, whether you’re talking about something\
    \ you’re working on at the moment or just being honest about your nerves. It’s\
    \ a chance to make a good impression and to bond with your interviewer. If you’re\
    \ really struggling then ask questions. “What are you working on at the moment?”.\
    \ “I was reading up on `Java 8` last night, have you seen the new stuff on `default\
    \ methods`?”. It allows the other person to talk and takes the pressure off you,\
    \ and is also a great way to build a relationship. People are usually better at\
    \ talking than listening and will be pleased you’re asking questions and giving\
    \ them the chance to talk. It sounds cheesy but it’s true.\n\n### Interview Formats\n\
    \nOnce you’ve made your incredible first impression, the hard work begins. Depending\
    \ on the stage of the interview the content may vary greatly so it’s important\
    \ to know what you’re going in for. Make sure you talk to your recruiter or the\
    \ hiring company before hand and ask what will be involved in the interview; how\
    \ many people, how many stages, what sort of questions. Normally companies are\
    \ happy to release this information to help you prepare. Never forget that the\
    \ people interviewing you want you to get the job. They want you to be the amazing\
    \ developer they’ve been looking for and you need to prove to them it’s you.\n\
    \n### Technical Interview\nThis is the bread and butter of most interview processes,\
    \ and the main focus of this book.\n\nA group of developers asking you a series\
    \ of questions on `java` programming, algorithms and design. This is always going\
    \ to be the most difficult part of any interview process. The domain space is\
    \ so huge you could get asked anything, and some interviewers pride themselves\
    \ on asking esoteric questions. However, most people aren’t like that and will\
    \ limit themselves to a core set of questions.\n\nIn preparation for a `Java`\
    \ interview you have to make sure you’ve revised the core material. Even though\
    \ you spend all day every day working in the code the fact is that most of the\
    \ “complicated” parts of the language are infrequently used but regularly asked\
    \ in interviews. At a minimum you need to revise the big three:\n* `Threading`\n\
    * `Collections`\n* `Garbage Collection`\n\nA natural extension on collections\
    \ is to study algorithms as the questions will often revolve around writing an\
    \ algorithm to sort a data structure. These too are covered later in the book.\
    \ \n\nYou are also quite likely to be asked about your design experience. One\
    \ that seems to pop up regularly is “Tell me about something you’ve designed”\
    \ or “tell me about the system you’re working on at the moment”. Normally you\
    \ will be given a whiteboard and asked to sketch out the architecture and asked\
    \ to explain as you go along. This is a nice open ended question and can give\
    \ you a good opportunity to show off by engaging in discussions around technology\
    \ choices and resilient design.\n\nFinally you are likely to get asked “fluffy”\
    \ questions. A huge amount of being a developer has absolutely nothing to do with\
    \ code. Development practices is a great example; I love to ask candidates about\
    \ their experience with `agile development` for example. It allows a clear delineation\
    \ between people who just do what they’re told and people who take an active interest\
    \ in the development practices and understand their purposes. There’s also the\
    \ non-technical questions that fit into this section: “What excites you about\
    \ going to work?” is another one of my favourites.\n\nWhen answering these loose\
    \ open ended questions don’t feel the need to launch straight into an answer and\
    \ blab your way through. It’s ok to take the time up front to think of a good\
    \ answer. This is not the sort of information people keep ready in their heads\
    \ and the interviewer knows that. \n\n### The Management Interview\nAfter you’ve\
    \ cleared the hurdles of the developer team you will normally end up in a room\
    \ with a manager. This may be the team manager (who will likely still be technical\
    \ to some degree) or it may be a department head (who is quite removed from the\
    \ day to day). The likelihood is that this is going to focus heavily on the interpersonal\
    \ fluffy questions. The purpose of this interview is to get an understanding of\
    \ your experience as part of a team, to figure out your potential as an employee\
    \ and to determine if you will be a good fit for the team and the company.\n\n\
    There is no right answer to these questions and it will depend entirely on the\
    \ values of the person interviewing you and the firm you’re interviewing with.\
    \ Some firms are looking for people who can bring a breath of fresh air and stir\
    \ things up, people to bring new ideas and mix things up. Once when I was interviewed\
    \ by a head of development I spent a huge amount of time talking about the of\
    \ having build and information radiators, all of which he had heard about but\
    \ had never tried. By showing I could bring some valuable skills to the team he\
    \ was exceptionally keen to hire me.\n\nConversely, a large proportion of the\
    \ people who interview you will be looking for people who can slot in seamlessly\
    \ with the team or company and hit the ground running. If you know someone who’s\
    \ already working there you can find out what “good” looks like to that team/company\
    \ and tailor your answers accordingly, but most of the time you won’t know what\
    \ your interviewer is specifically looking for. Don’t worry about this, and don’t\
    \ try and guess based on the intonation or questions asked. Just be honest and\
    \ try to show where your expertise and passion lies. The simple reality is not\
    \ everyone will fit in everywhere, and that’s ok.\n\nBe confident and outgoing.\
    \ Even though the person you’re talking to is in management it’s no reason to\
    \ get nervous. Think of the worst case scenario: you don’t get the job. That’s\
    \ ok. Most of your peers will struggle with this interview as it’s heavily focused\
    \ on being able to give articulate answers and have interactive conversations.\
    \ If this is not your strong point then *practice*. Ask a friend (preferably not\
    \ in IT) to drill you on these questions until you no longer sound nervous.\n\n\
    **Example Questions**\n"
  raw: 'Instead we want the third shake, the Goldilocks of handshaking: just right.
    A good handshake conveys confidence but without being over the top. It is firm,
    with good pressure, but without leaving the other person feeling they need to
    go to hospital with a broken hand. Unsurprisingly this takes practice. So practice!
    Ask your close colleagues, friends or family to practice with you. It can take
    only 3 minutes of testing out different pressures to figure out what a good handshake
    is for you but it can make a huge difference in your first impression. I was lucky
    enough in school to have a teacher who ran a lesson dedicated to this and it has
    stood me in good standing ever since.


    **First conversation**: The awkward moment where you finally have to talk. The
    two major things you need to consider here are what you want to say, and how you’re
    going to say it.


    Body language, mannerisms and tone are all understandably important. Your job
    is to convey to the interviewer that you are excited for the interview and job
    opportunity. You would be surprised by the number of candidates who sound like
    they have no interest in being at the interview. If your tone is dull and you
    sound like this is just another interview your recruiter is putting you through
    then why should the interviewer be willing to spend his time with you? Sound interested.
    Sound excited. Sound like you want the job!


    Go into your interview with some ideas for small talk. Again, we programmers tend
    to be a quiet bunch lacking in conversational skills. Chances are there’s going
    to be some point from when you’re collected in reception to the interview starting
    where you’re going to need to fill the gap with conversation. This is a great
    opportunity for you to sell yourself, whether you’re talking about something you’re
    working on at the moment or just being honest about your nerves. It’s a chance
    to make a good impression and to bond with your interviewer. If you’re really
    struggling then ask questions. “What are you working on at the moment?”. “I was
    reading up on Java 8 last night, have you seen the new stuff on default methods?”.
    It allows the other person to talk and takes the pressure off you, and is also
    a great way to build a relationship. People are usually better at talking than
    listening and will be pleased you’re asking questions and giving them the chance
    to talk. It sounds cheesy but it’s true.


    **Interview Formats**


    Once you’ve made your incredible first impression, the hard work begins. Depending
    on the stage of the interview the content may vary greatly so it’s important to
    know what you’re going in for. Make sure you talk to your recruiter or the hiring
    company before hand and ask what will be involved in the interview; how many people,
    how many stages, what sort of questions. Normally companies are happy to release
    this information to help you prepare. Never forget that the people interviewing
    you want you to get the job. They want you to be the amazing developer they’ve
    been looking for and you need to prove to them it’s you.


    **Technical Interview**


    This is the bread and butter of most interview processes, and the main focus of
    this book.


    A group of developers asking you a series of questions on java programming, algorithms
    and design. This is always going to be the most difficult part of any interview
    process. The domain space is so huge you could get asked anything, and some interviewers
    pride themselves on asking esoteric questions. However, most people aren’t like
    that and will limit themselves to a core set of questions.


    In preparation for a Java interview you have to make sure you’ve revised the core
    material. Even though you spend all day every day working in the code the fact
    is that most of the “complicated” parts of the language are infrequently used
    but regularly asked in interviews. At a minimum you need to revise the big three:
    Threading


    Collections


    Garbage Collection


    A natural extension on collections is to study algorithms as the questions will
    often revolve around writing an algorithm to sort a data structure. These too
    are covered later in the book.


    You are also quite likely to be asked about your design experience. One that seems
    to pop up regularly is “Tell me about something you’ve designed” or “tell me about
    the system you’re working on at the moment”. Normally you will be given a whiteboard
    and asked to sketch out the architecture and asked to explain as you go along.
    This is a nice open ended question and can give you a good opportunity to show
    off by engaging in discussions around technology choices and resilient design.


    Finally you are likely to get asked “fluffy” questions. A huge amount of being
    a developer has absolutely nothing to do with code. Development practices is a
    great example; I love to ask candidates about their experience with agile development
    for example. It allows a clear delineation between people who just do what they’re
    told and people who take an active interest in the development practices and understand
    their purposes. There’s also the non-technical questions that fit into this section:
    “What excites you about going to work?”


    is another one of my favourites.


    When answering these loose open ended questions don’t feel the need to launch
    straight into an answer and blab your way through. It’s ok to take the time up
    front to think of a good answer. This is not the sort of information people keep
    ready in their heads and the interviewer knows that.


    **The Management Interview**


    After you’ve cleared the hurdles of the developer team you will normally end up
    in a room with a manager. This may be the team manager (who will likely still
    be technical to some degree) or it may be a department head (who is quite removed
    from the day to day). The likelihood is that this is going to focus heavily on
    the interpersonal fluffy questions. The purpose of this interview is to get an
    understanding of your experience as part of a team, to figure out your potential
    as an employee and to determine if you will be a good fit for the team and the
    company.


    There is no right answer to these questions and it will depend entirely on the
    values of the person interviewing you and the firm you’re interviewing with. Some
    firms are looking for people who can bring a breath of fresh air and stir things
    up, people to bring new ideas and mix things up. Once when I was being interviewed
    by a head of development I spent a huge amount of time talking about the important
    of continuous delivery and having build monitors as information radiators, all
    of which he had heard about but had never tried to implement. By showing I could
    bring some valuable new skills to the team he was exceptionally keen to hire me.


    Conversely, a large proportion of the people who interview you will be looking
    for people who can slot in seamlessly with the team or company and hit the ground
    running. If you know someone who’s already working there you can find out what
    “good” looks like to that team/company and tailor your answers accordingly, but
    most of the time you won’t know what your interviewer is specifically looking
    for. Don’t worry about this, and don’t try and guess based on the intonation or
    questions asked. Just be honest and try to show where your expertise and passion
    lies. The simple reality is not everyone will fit in everywhere, and that’s ok.
    Just talk candidly about your experiences and opinions and try and strike up interesting
    conversations.


    Be confident and outgoing. Even though the person you’re talking to is in management
    it’s no reason to get nervous. Think of the worst case scenario: you don’t get
    the job. That’s ok. Most of your peers will struggle with this interview as it’s
    heavily focused on being able to give articulate answers and have interactive
    conversations. If this is not your strong point then *practice*. Ask a friend
    (preferably not in IT) to drill you on these questions until you no longer sound
    nervous.


    **Example Questions**'
