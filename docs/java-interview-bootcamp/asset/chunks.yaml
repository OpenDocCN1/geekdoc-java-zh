  trans: '


    可以使用笔纸或白板，这使得它成为提问设计问题的最佳格式。准备好被针对你以前工作过的系统进行盘问，或者被要求现场设计某些东西。同样，面试官非常喜欢让候选人写伪代码，特别是关于创建搜索或排序算法的问题。这为后续的一些大
    O 类问题铺平了道路，但更重要的是，它为你的潜在雇主提供了一个观察你如何解决问题的机会。


    ## 一对一 (One on one)


    最简单的面试。人面对面，通常持续一小时甚至更久。这种方式的处在于你只需要尝试给一个人留下深刻印象，但也意味着如果你从一开始就表现不好，或者面试官那天心情不好，你就有麻烦了。如果可能，在去面试之前尝试了解你的面试官是谁。根据我的经验，这些一对一会议通常是团队负责人或高级别进行的，因此虽然可能会有一些技术内容，但交流的主要目的是了解你将如何融入团队和更广泛的公司文化。


    ## 组面试 (Group Grilling)


    我个人认为这是最困难的一种面试。通常会有 2 到 3 位未来的新团队成员坐在桌对面，向你抛出他们最尖锐的问题，而你必须尽力不让自己难脸。我觉得这种面试是最糟糕的，因为要给
    3 个人留下其实非常困难。每个人都有自己的意见和工作方式，你能够满足所有质问者的概率微乎其微。


    ## 快速配面试 (Speed Dating)


    速配式面试涉及在规定的时间内安排尽可能多的面试官。默认情况下，通常是与 3 位不同的面试官分别进行。


    你留在房间里，与每人进行 20 或 30 分钟的面试，然后他们就会离开，取而代之的是更多提出不同问题的人。我以前甚至经历过这种情况，其中一个面试官是通过视频会议参与的。从面试官的角度来看，这是棒的；你可以从多位员工成员那里获得共性意见（任何获得三位中全部赞同的人都可以直接通过），而且这意味着你可以同时面试
    3 名候选人。这是一种筛选人员非常有效的方法。


    然而，从面试者的角度来看，这可能会非常紧张。那是大量的面试！如果你只是和一或两个人进行 1 小时，那么一旦你进入状态，一切都是好的。


    你可以和面试官变得熟悉。然而，看到许多不同的面试官意味着你无法放松。你不断尝试弄清楚每个人在寻找什么。这真的是非常辛苦的工作，除了常规的 `java` 准备之外，没有办法可以准备。如果你要去参加这种面试，我能给你最好的建议是记住每个人都是不同的。尽管通常会有团队主题（也许他们都喜欢测试驱动开发），但个人会喜欢不同的侧面，偏好不同的技术。和任何面试一样，尝试与桌子对面的人建立联系。虽然显上技术能力是重要的，但你成功的很大程度上取决于面试官是否喜欢你以及你的态度。从心理上来说，只要你不犯任何重大错误，桌子对面的那个人就会尽力录用你。


    ## 面试流程示例 (Example Interview Process)


    为了让你对预期情况心中有数，这里有一些我经历过的流程示例：


    ### 某澳洲大型银行：

    - 与团队经理的一对一面试

    - 能力测试

    - 2 小时技术面试；1 小时与本地开发人员面对面，1 小时通过视频会议与 2 名开发人员交流

    - 与部门主管面试


    ### 小型慈善机构

    - 与未来的经理和部门主管面对面

    - HR 面试


    ### 某国际大型银行

    - 30 分钟电话面试

    - 与 2 名开发人员的结对编程面试

    - 与 3 名开发人员的组面试


    ## 制作你的简历 (Creating your resume)


    留下初印象的机会只有一次，从那时起，这种印象要么对你有利，要么对你不利。这适用于所有媒介，从网站（你有 7 秒钟给访问者留下深刻印象）到在面试中遇到新的人（你的时间更短）。从一开始就表现不好意味着你需要表现得极其出色才有机会获得新职工作，虽然这并非不可能，但无疑会让原本困难的面试变得更加困难。另一方面，如果你到达并能与面试官建立联系，那么这份工作就任由你来决定了；从心理上来说，他们会希望你表现出色，只要你不犯任何重大错误，桌对面的那个人就会尽力争取录用你。


    “但这和我的简历有什么关系呢？”我听到你在心里叫道。你的简历是你的第一个初印象。当这些页面落在某人的桌上时，这是他们第一次接触到你以及你所代表的东西。面试官每个职位都会收到数百份简历，可以理解，其中很少有简历能脱颖而出令人兴奋。让我们明确：你的简历是一份销售文档。在读完你精心构思的文字后，你希望阅读者转向旁边的人说：“嘿，这家哥们看起来不错。我们应该尽快请他来。”我说这种情况每隔
    20 份简历左右就会发生一次。


    在我们深入撰写完美的“程序员宣传稿”之前，我有一条至关重要的建议，它不仅适用于简历，也适用于你将经历的所有招聘和面试过程。


    ### 杀手建议：每个人都是不同的 (Killer advice: Everyone is different)


    在面试过程中，你将谈到的所有人对于什么是好的开发者都会有不同的意见。如果有一种标准化的考试或其他方式来区分好开发者和坏开发者，那么招聘将变得容易得多（不，即使是
    Sun 认证 Java 程序员证书也不能解决问题）。你参加的每一场面试都会有不同的问题，每位面试官都有不同的价值观。一个人可能看重多语言开发者。另一个人可能看重
    TDD。下一个人可能认为代码应该在记事本中编写并手动编译。没有万能妙药。


    作为候选人，很难记住这一点。也许是你的简历没有获得面试机会，或者也许你参加了几场面试但没有进展。你的情绪会低落，并得出你被困在原地、不够优秀获得新工作的结论。现实情况是，你还没有找到与你的价值观一致的地方，这没关系。


    你对工作的要求可能会让你寻找职位变得更容易或更难。对我来说，我讨厌大 O 符号和性能问题，因为我身边有谷歌，而且我相信人们倾向于过早优化代码；真正的性能问题发生非常少。这意味着有些面试我出来时知道自己表现得很糟糕，但我不在乎。我很清楚我不想为那个团队工作，因为他们的价值观与我的不符。这会让找工作更困难吗？


    是的，但这意味着当我找到一个职位时，它是我真正想要的。你清醒时的大部分时间都在工作，所以你完全值得花时间把它做好。


    ## 简历格式 (Resume Format)


    ### 应该有多长？


