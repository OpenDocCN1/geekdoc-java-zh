  trans: "\n\n### O(1)/常数复杂度\n常数。这意味着无论数据集的大小如何，算法将总是花费恒定的时间。\n\n*1 个元素需要 1 秒，10 个元素需要\
    \ 1 秒，100 个元素需要 1 秒。*\n\n它总是花费相同的时间。\n\n### O(log n)/对数复杂度\n没有常数复杂度好，但仍然很好。耗时随数据集的大小而增加，但并非比例增加。这意味着相对于较大的数据集，算法在较小数据集上每个元素花费的时间更长。\n\
    \n*1 个元素需要 1 秒，10 个元素需要 2 秒，100 个元素需要 3 秒。*\n\n如果你的数据集有 10 个元素，每个元素会导致 0.2 秒的延迟。如果你的数据集有\
    \ 100 个，每个元素仅额外花费 0.03 秒。这使得 `log n` 算法具有非常的可扩展性。\n\n### O(n)/线性复杂度\n数据集越大，花费的时间就成比例增长。\n\
    \n*1 个元素需要 1 秒，10 个元素需要 10 秒，100 个元素需要 100 秒。*\n\n### O(n log n)\n上述两者的良好结合。通常排序有两个部分，第一个循环是\
    \ `O(n)`，第二个循环是 `O(log n)`，组合形成 `O(n log n)`。*1 个元素需要 2 秒，10 个元素需要 12 秒，100 个元素需要\
    \ 103 秒。*\n\n### O(n²)/二次复杂度\n情况变得额外缓慢了。\n\n*1 个元素需要 1 秒，10 个元素需要 100 秒，100 个元素需要\
    \ 10000 秒。*\n\n### O(2ⁿ)：指数级增长！\n每添加一个新元素，算法花费的时间就会翻倍。\n\n*1 个元素需要 1 秒，10 个元素需要\
    \ 1024 秒，100 个元素需要 1267650600228229401496703205376 秒。*\n\n重要的是，上述内容并不是按复杂度从最好到最坏排序的。\n\
    \n没有所谓的“最佳”算法，因为它完全取决于数据集的大小和手头的任务。记住代码维护成本也同样重要；更复杂的算法可能会导致极快速的排序，但如果代码变得变得以维护且难以调试，那是正确的做法吗？这取决于你的需求。\n\
    \n在上述复杂度内部也存在差异。想象一个算法精确地遍历列表两次。这将是 `O(2n)` 复杂度，因为它遍历了两次你的列表长度 `(n)` ！\n\n###\
    \ 为什么这很重要？\n简单来说：在小型数据集上运行良好的算法并不保证在大型数据集上也能运行良好。仅仅因为某个东西在你的机器上运行得飞快，并不意味着当你扩展到大型数据集时它还能正常工作。你需要确切了解你的算法在做什么，以及它的大\
    \ O 复杂度是多少，以便选择正确的解决方案。\n\n我们关注算法的三个方面：**最好情况、最坏情况和预期情况**。在现实中，我们实际上只关心后两者，因为我们是一群悲观主义者。\n\
    \n如果你要求算法对一个预先排序的列表进行排序，它的速度可能比一个完全杂乱的列表快得多。相反，我们想知道最坏情况（算法可能采取的最大步骤数）和预期情况（算法可能采取的可能或平均步骤数）。为了增加趣味性，这些情况可以且通常是不同的。\n\
    \n### 示例\n希望你到为止还能跟上我的思路，让我们深入一些排序和搜索的示例算法。重要的是能够解释一个算法属于什么复杂度。面试官喜欢让候选人设计算法，然后问它们的复杂度是多少。\n\
    \n#### O(1)\n与大小无关，它将始终以恒定的速度返回。`Queue` 的 javadoc 说明它“检索方法（peek, element 和 size）是常数时间”。这为什么会这样就很清楚了。对于\
    \ `peek`，我们总是返回第一个元素，而我们始终拥有该元素的引用；它后面有多少元素并不重要。列表的大小在元素添加/删除时会更新，无论列表大小如何，引用这个数字都只需要一次操作。\n\
    \n#### O(log n)\n经典的例子是`二分查找`（Binary search）。你是一个超级极客，所以你显然对你的电影收藏按字母排了序。为了找到《回到未来》拷贝，你首先来到列表的中间。你发现中间的电影是《霍克家族聚》，然后前往开头和这电影电影之间的电影。你发现是《人类之子》。再次重复这个过程，你就找到了《回到未来》。这里有一个非常好的二分查找交互演示：\n\
    \n`http://www.cs.armstrong.edu/liang/animation/web/BinarySearch.html`\n\n虽然添加更多元素会增加搜索所需的时间，但它并不是比例增加的。因此它是\
    \ `O(log n)`。\n\n#### O(n)\n正如集合章节中讨论的，`LinkedList` 在检索方面的表现（相对而言）并不好。它的最坏情况复杂度实际上为\
    \ `O(n)`。\n\n#### O(n log n)\n正如集合章节中讨论的，`LinkedList` 在检索方面的表现（相对而言）并不好。它的最坏情况复杂度实际上为\
    \ `O(n)`。\n\n#### O(n²)\n冒泡排序是每个人在学校学的第一个算法，有趣的是，它是二次复杂度。\n\n```java\npublic int[]\
    \ sort(int[] toSort) {\n    for (int i = 0; i < toSort.length -1; i++) {\n   \
    \     boolean swapped = false;\n        for (int j = 0; j < toSort.length - 1\
    \ - i; j++) {\n            if(toSort[j] > toSort[j+1]){\n                swapped\
    \ = true;\n                int swap = toSort[j+1];\n                toSort[j +\
    \ 1] = toSort[j];\n                toSort[j] = swap;\n            }\n        }\n\
    \        if(!swapped){\n            break;\n        }\n    }\n    return toSort;\n\
    }\n```\n\n"
- fmt: "\npeople and I would like to find every combination of groupings; everyone\
    \ by themselves, all of the groups of 2 people, all of the groups of 3 people\
    \ etc. Using a simple program which takes each person and loops through the combinations,\
    \ if I add one extra person then it’s going to increase the processing time exponentially.\
    \ Every new element will double processing time.\n\nIn reality `O(2n)` algorithms\
    \ are not scalable.\n\n## How to figure out Big O in an interview\n\nThis is not\
    \ an exhaustive list of Big O. Much as you can `O(n2)`, you can also have `O(n3)`\
    \ (imagine bubble sort but with an extra loop). What the list on this page should\
    \ allow you to do is have a stab in the dark at figuring out what the big O of\
    \ an algorithm is. If someone is asking you this during an interview they probably\
    \ want to see how you try and figure it out. Break down the loops and processing.\n\
    \n- Does it have to go through the entire list? There will be an `n` in there\
    \ somewhere.\n- Does the algorithms processing time increase at a slower rate\
    \ than the size of the data set? Then there’s probably a `log n` in there.\n-\
    \ Are there multiple loops? You’re probably looking at `n2 or n3`.\n- Is access\
    \ time constant irrelevant of the size of the dataset? `O(1)`\n\n## Sample Question\n\
    \n**I have an array of the numbers 1 to 100 in a random number. One of the numbers\
    \ is missing. Write an algorithm to figure out what the number is and what position\
    \ is missing.**\n\nThere are many variations of this question all of which are\
    \ very popular. To calculate the missing number we can add up all the numbers\
    \ we do have, and subtract this from the expected answer of the sum of all numbers\
    \ between 1 and 100. To do this we have to iterate the list once. Whilst doing\
    \ this we can also note which spot has the gap.\n\n```java\npublic class BubbleSort{\n\
    \    public void findTheBlank(int[] theNumbers) {\n        int sumOfAllNumbers\
    \ = 0;\n        int sumOfNumbersPresent = 0;\n        int blankSpace = 0;\n\n\
    \        for (int i = 0; i < theNumbers.length; i++) {\n            sumOfAllNumbers\
    \ += i + 1;\n            sumOfNumbersPresent += theNumbers[i];\n            if\
    \ (theNumbers[i] == 0)\n                blankSpace = i;\n        }\n        System.out.println(\"\
    Missing number = \" + (sumOfAllNumbers - sumOfNumbersPresent) + \" at location\
    \ \" + blankSpace +\" of the array\"); \n    }\n\n    public static void main(String[]\
    \ args) {\n        new BubbleSort().findTheBlank(new int[]{7,6,0,1,3,2,4});\n\
    \    }\n    //Missing number = 5 at location 2 of the array\n}\n```\n\nCaveat:\
    \ you can also calculate `sumOfAllNumbers` using `(theNumbers.length+1) * (theNumbers.length)\
    \ / 2.0`. I would never remember that in an interview though.\n\n## What is the\
    \ big O of your algo?\n\nOur algorithm iterates through our list once, so it’s\
    \ `O(n).`\n\n## Conclusion\n\nYou’re amazing. Well done for reading this book\
    \ all the way through. I’m very proud of it, but more specifically I’m proud of\
    \ how I’ve been able to help people to get amazing new jobs. Whenever I get emails\
    \ or messages through from people saying thanks because I’ve helped them to get\
    \ a better job it gives me the biggest buzz.\n\nIf everything goes well and you’ve\
    \ benefitted from this, then please do let me know. Or even if you have extra\
    \ questions, want someone to look over your CV, or just want to say hi. I try\
    \ and reply to every message I get.\n\ne: `hello@corejavainterviewquestions.com`\n\
    \nt: `@sambahk`\n\nGo out and ace that interview.\n\nSam\n\n# Document Outline\n\
    \n- [Table of Contents]\n- [Introduction]\n- [Part 1: Soft Skills and Process]\n\
    - [The Interview Process]\n- [Creating your resume]\n- [Phone Interviews]\n- [Face\
    \ to face interview]\n- [Technical Tests]\n- [Tell me about your system]\n- [Part\
    \ Two: Core Java]\n- [Object Oriented Programming]\n- [Data Structures]\n- [Java\
    \ Exceptions]\n- [JVM and Garbage Collection]\n- [Threading]\n- [Big O Notation]\n\
    - [Conclusion]\n"
