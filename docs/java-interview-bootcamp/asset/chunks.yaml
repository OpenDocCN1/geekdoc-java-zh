  trans: '

    相反，我们想要的是第三种握手方式，即握手的“金发姑娘”原则：恰到好处。一个好的握手传达了自信，但不会过头。它有力，力度适中，但不会让对方觉得需要去医院看骨折。意不意外的是，这需要练习。所以要练习吧！请你亲的同事、朋友或家人和你一起练习。只需要花
    3 分钟时间测试不同的力度，就能找出对你来说良好的握手是什么，但它可以对你的第一印象产生巨大的影响。我在学校时很幸运遇到过一位专门讲过这节课的老师，从那时起受益匪浅。


    ### 第一次对话

    你终于不得不开口说话的尴尬时刻。在这里你需要考虑的两个主要点是：你想说什么，以及你打算怎么说。


    肢体语言、举止和语气显然都是重要的。你的任务是向面试官传达你对这次面试和工作机会感到兴奋。你会惊讶地发现，有这么多候选人听起来完全对参加面试不感兴趣。如果你的语气平淡，听起来就像这只是招聘人员为你安排的又一次面试，那么面试官为什么要愿意在你身上花时间呢？听起来很感兴趣。听起来很兴奋。听起来你很想要这份工作！


    进入面试前，准备一些闲聊的话题。再次，我们程序员倾向于是一群安静、缺乏社交技巧的群体。很有可能在从你被带到接待处到面试开始之间，会有某个时刻你需要通过对话来填补空白。这是一个推销自己的绝佳机会，无论是在谈论你目前正在做的事情，还是诚实地表达你的紧张。这是一个留下良好印象并与面试官建立联系的机会。如果你真的觉得很吃力，就提问吧。“你最近在忙什么？”“我昨晚在看
    `Java 8`，你见过关于 `default methods` 的新花样吗？”这能让对方说话，减轻你的压力，同时也是建立关系的极佳方式。人们通常更擅长说话而不是擅长倾听，他们会因为你提问并给他们说话的机会而很高兴。这听起来很老套，但却是事实。


    ### 面试形式


    一旦你留下了惊人的第一印象，真正的工作就开始了。根据面试阶段的不同，内容可能会大异，因此了解你要面对的是什么非常重要。确保在面试之前与你的招聘人员或聘用公司沟通，询问面试将包含哪些内容：有多少人、几个阶段、什么类型的问题。通常公司乐意提供这些信息来帮助你准备。永远不要忘记，面试你的人是希望你获得这份工作的。他们希望你成为他们一直在寻找的极优秀的开发者，而你需要向他们证明你就是那个人。


    ### 技术面试

    这是大多数面试流程的核心，也是本书的重点。


    一组开发者会就 `java` 编程、算法和设计向你提一系列问题。这将始终是任何面试过程中最困难的部分。领域空间如此巨大，你可能会被问到任何问题，而且有些面试官甚至以问一些晦涩的问题为自豪。然而，大多数人并不是那样，他们会将问题限制在一个核心问题范围内。


    在准备 `Java` 面试时，你必须确保已经复习了核心材料。尽管你每天整天都在写代码，但事实是，语言中大多数“复杂”部分很少使用，但在面试中经常被问到。至少你需要复习大三：

    * `Threading`（多线程）

    * `Collections`（集合）

    * `Garbage Collection`（垃圾回收）


    集合的自然延伸是学习算法，因为问题通常会围绕编写一个算法来对数据结构排序展开。这些在书后面也会介绍。


    你也很可能被问到你的设计经验。一个经常出现的问题是“跟我谈谈你设计过的东西”或“谈谈你目前正在工作的系统”。通常，他们会给你一块白板，让你画出架构并要求你边画边解释。这是一个很好的开放式问题，可以给你提供一个良好的机会，通过参与技术选择和健壮性设计的讨论来展示才华。


    最后，你可能会被问到一些“虚泛”的问题。作为开发者，很大一部分工作与代码完全无关。开发实践就是一个很好的例子；例如，我喜欢询问候选人关于他们 `agile
    development`（敏捷开发）的经验。这可以将只听命行事的人与对开发实践有积极兴趣并理解其目的的人区分开来。还有一些属于这一类的非技术问题：“什么让你对上班感到兴奋？”这可是我的另一个最喜欢的问题之一。


    在回答这些松散的开放式问题时，不要急于直接给出答案并滔滔不绝。花点时间想一个好的答案是可以的。这种信息不是人们在脑子里随时准备好的，面试官也清楚这一点。


    ### 管理层面试

    当你通过开发团队的关卡后，你通常会进入一个由经理所在的房间。这可能是团队经理（可能在某种程度上仍然具有技术性），也可能是部门主管（与日常工作脱节很大）。很有可能是这将侧重于人际关系的泛泛问题。面试的目的是了解你作为团队成员的经验，确定你作为员工的潜力，并判断你是否适合这个团队。


    '
- fmt: '

    What do you enjoy about going to work?


    What do you dislike about being a developer?


    Why are you leaving your current job?


    If you could change one thing about your current team what would it be?


    What does a good team look like?


    What makes a good developer?


    Tell me about a time you had conflict at work. How did you deal with it?


    Tell me about the biggest mistake you made at work?


    ## Technical Tests


    ### What are technical tests?


    Over the years I’ve tried many different types of ways of screening candidates;
    phone interview, speed dating style, full on technical interview and everything
    in between. My favourite method by far is the technical test, also known as the
    coding homework.


    The technical test is simply an exercise or set of exercises given for you to
    complete at home. Normally it will take one to two hours and will be reasonably
    challenging, involving some level of complexity such as `Threading` or `algorithms`.
    The instructions will likely be emailed to you, giving you a certain time frame
    within which to complete it.


    ### Why are they good?


    Most interview process do not involve the candidate writing any code. This is
    crazy!


    You’re interviewing to be a programmer and most job interviews don’t involve you
    doing any programming. If you’re lucky enough to be in a process which does involve
    looking at your code there are 3 main options they could use:


    - Bring you in and watch you code. This could be a pair programming exercise or
    it could be simply sitting you in front of an exercise and watching you code.
    I’m a big fan of the pair programming interview as a mechanism to use later on
    in the interview cycle to get a good understanding of how a programmer interacts
    with other people and designs their way through a solution.


    - Ask for a code sample. Less popular than it used to be, but the equivalent of
    asking a graphic designer for their portfolio. Most the code people write is for
    their employer and cannot be exported outside the firm, so it relies on the hiree
    having personal projects to showcase. I’d recommend if you do already have projects
    that you upload them to `github` and include them on your CV: you look good for
    having the project and it shows you’re proud of your code.


    - The Technical Test!


    The problem with a pairing interview is that it takes a lot of time out of the
    hirers day, often 2 people taking 2 hours per candidate. This is expensive, and
    so it is better saved to the end of the process. Code samples on the other hand
    aren’t standardised. They give a view on what your code style is, but are unlikely
    to answer all of the questions the interviewer has about your ability. It also
    means as an interviewer I need to get myself around a new problem space and code
    base for each and every candidate which takes a lot of time and effort.


    Coding Homeworks on the other hand take relatively little time to review. They’re
    standardised, which makes the recruiting teams job easier and ensures candidates
    are compared on a level playing field. The challenge can be written to ensure
    it tests whatever facets the company values; `algorithms`, `threading`, `design`
    etc. Personally I find them a great first or second stage interview to sort the
    wheat from the chaff and immediately filter out a huge number of candidates. A
    lot of people talk big game on their CV but are terrible programmers.


    However be wary of using this too early in the process if you’re putting a hiring
    process together. I’ve had a number of candidates refuse to do the interview when
    they’ve not even had a phone interview yet. When asking a candidate to take 1
    or 2 hours out to write code they will often want the opportunity to talk to you
    first so they can get more information on the role and make sure it’s worth their
    time. On the other hand I’ve also had candidates be extra excited for the role
    because it’s shown we value a candidates ability to code highly, a very desirable
    attribute.


    ### How to pass


    This may sound obvious, but a the very minimum you need to produce something that
    compiles, runs and solves the problem. I’ve reviewed far too many submissions
    where the code simply didn’t compile. This is a straight no. Don’t expect the
    reviewer to spend a lot of time trying to get things working. Use a standard build
    tool like `maven` and include clear, step by step instructions in a `readme` file.


    Ensure you read and follow the instructions to the letter. I once had someone
    submit a solution in `Scala` despite the instructions specifying `Java`. This
    just wastes everyones time.


    If you are at all unsure then ask. Chances are you won’t be the first person to
    have the issue, and if you are then they can amend their instructions for future
    candidates.


    Your target should be to write code you would be happy to see go into production.
    At the highest level, I’m looking to see if the very best code you can produce
    (which is what this should be) is good enough that I’d be happy for you to commit
    to my codebase. Clearly


    “good code” is a very personal opinion but if you submit something you’re proud
    of then that is the best you can do. If you don’t pass because of the code style
    you can rest assured that the team is not a good fit for you. As an example; If
    I was rejected from a team because I didn’t comment my code I’d be glad I missed
    out because I believe that code should be written with good naming and broken
    down so that it’s clear what’s going on without comments (with the exception of
    `APIs`). Your code is a representation of what you value.


    Some key things to check before you submit:

    - All `methods`, `classes`, `tests` and `variables` are consistently named

    - Remove all commented out code

    - Don’t leave unused code in; a good IDE like `IntelliJ` will clearly highlight
    if a piece of code isn’t being referenced

    - Delete any unused `classes` or `tests`

    - Delete any `main` methods you wrote “just to test if something worked”

    - Remove all breakpoints!


    Above and beyond this it simply comes down to creating a good solution that solves
    the problem. Read the question thoroughly and jot down what the concerns are.
    Is the problem latency sensitive? Is there large data volume? If a `UI` is involved
    is there responsiveness concern? If you write a list of what’s important (and
    what’s not) it will give you a good guide when creating your solution so you can
    optomise the right things.


    Do not prematurely optomise! If the solution asks you to read in a file of 10
    lines, don’t write an increible caching solution. It’s 10 lines!


    Make sure to write `tests`. `Tests` are great anyway, but if you have `tests`
    written for the key requirements you can be sure that you’ve ticked them off proving
    to the creator you’ve read, understood and coded for them.


    Once you’ve finished, put your solution into whatever format requested (`zip`,
    `github`, `jar`) along with your comprehensive `readme` and email it to another
    computer. If you have a spare laptop then great, if not then maybe a friends.
    Try it out on here before you submit it; you want to ensure you avoid the issue
    of “Works On Machine” where it looks fine on your laptop but works nowhere else
    of some esoteric setting or an assumption you’ve made. If you can send it to someone
    and they can get it up and running with no guidance then you’re good to go. Send
    it in and keep your fingers crossed!


    ## Following the technical test


    What comes next depends entirely on who is hiring you. Some people will give you
    a simple pass/fail with no feedback. In this scenario go back and ask for feedback
    anyway.


    If you’ve failed then it can be comforting to know why so you can improve next
    time (or perhaps it was a style issue as mentioned, in which case can rest in
    peace). Even if you’ve passed it can be good to know any areas the team felt you
    could have improved on.


    This way you can allay these fears in the next round.

