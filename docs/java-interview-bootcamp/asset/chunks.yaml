    19 Thread 2 - 8


    20 Thread 2 - 9


    Running on my machine this isn’t consistent though, and does sometime jumble slightly.


    The way Threads work will never be consistant across machines or JVMs and it is
    important to write code that does not rely on a JVM’s behaviour.


    **Q: What is Thread starvation?**


    If a Thread cannot get CPU time because of other Threads this is known as starvation.


    Imagine an extreme example like the above, with a number of high priority Threads
    and a single low priority Thread. The low priority is unlikely to get any CPU
    time and will be suffering from starvation.


    **Futures, Callables and Executors**


    **Q: What is a ThreadPool? Why is it better to use them instead of manually creating**
    **Threads?**


    The creation and maintenance of Threads is expensive and time consuming. With
    a ThreadPool a group of Threads are available which can be called on to execute
    tasks. The Threads are created up-front, thus reducing the overhead at execution
    time. Once a task has been executed the Thread is returned to the pool to execute
    another task. If a Thread dies for some reason it will be replaced in the ThreadPool,
    removing the need to write complex Thread management code.


    There is the added benefit that it makes it easy to control the number of tasks
    happening in parallel. For example, if we have a webserver we may want to limit
    the number of parallel tasks so that a huge burst of traffic wouldn’t stop other
    background tasks from happening.


    **Q: How do you create a ThreadPool**


    Normally ThreadPools are created using Executors.


    1 ExecutorService executorService1 = Executors.newSingleThreadExecutor(); 2 ExecutorService
    executorService2 = Executors.newFixedThreadPool(10); 3 ExecutorService executorService3
    = Executors.newScheduledThreadPool(10); A single thread executor will create a
    single thread; all tasks will be executed sequentially.


    The same could be achieved using Executors.newFixedThreadPool(1).


    Executors.newFixedThreadPool will create a ThreadPool with exactly the number
    of Threads specified. Those threads will live for the lifetime of the JVM unless
    the Executor is shutdown using shutdown() (which will allow currently queued tasks
    to finished) and shutdownNow() (which will cancel any outstanding tasks).


    Tasks can be run on ExecutorServices by either submitting a Callable or a Runnable.


    **Q: What is the difference between Callable and Runnable? What is a Future?**


    A Runnable cannot return a value and it cannot throw a checked exception, both
    features available in Callable. Often a return value is very useful when building
    multithreaded applications. When we submit a task to an executor we don’t know
    when it will be executed; it could be instantly or at any time in the future-
    the whole process is asynchronous. Future’s allow this to happen. Futures have
    one main method: get() and it’s overloaded version, get(long timeout, TimeUnit
    unit). When called, it will block the current Thread whilst it awaits the result
    (if the result is not currently available).


    There is no benefit/negative to using Callable over Runnable or vice versa, it
    all depends on whether a return value is needed.


    1 **public** static void main(String[] args) throws InterruptedException, ExecutionExc\


    2 eption {


    3 Callable**<String>** callable = new StringCallable(); 4 Callable**<String>**
    callable2 = new StringCallable(); 5 Callable**<String>** callable3 = new StringCallable();
    6 Callable**<String>** callable4 = new StringCallable(); 7


    8 ExecutorService executorService = Executors.newFixedThreadPool(4); 9 List**<Future**<String**>**
    > futures = executorService.invokeAll(asList(callable, ca\


    10 llable2, callable3, callable4));


    11 for (Future**<String>** future : futures) {


    12 System.out.println(future.get());


    13 }


    14 }


    15 //pool-1-thread-1


    16 //pool-1-thread-2


    17 //pool-1-thread-3


    18 //pool-1-thread-4


    **Q: What is ThreadLocal?**


    ThreadLocal allows a different instance of a variable for each Thread that accesses
    it.


    Normally this will be a static variable used to store state like a UserID or session.
    This can also be particularly useful when an object is not Thread Safe but you
    want to avoid synchronising.


    **Big O Notation**


    I hate big O notation. For as long as I can remember it’s been my biggest achilles
    heel. It’s just something I’ve never managed to successfully motivate myself to
    learn about despite knowing it’s going to come up in every single interview. I’ll
    get asked to implement an algorithm which I’ll do via brute force to start with:
    “What is the Big O of that?”. “I don’t know Big O but I know it’s slow”.


    It’s fairly obvious, but this is the wrong approach. Take the time to really read
    this chapter and maybe even do some extra research. This seems to be a question
    that comes up consistently at interviews so it’s worth taking the time.


    **What on earth is Big O?**


    Big O is the way of measuring the efficiency of an algorithm and how well it scales
    based on the size of the dataset. Imagine you have a list of 10 objects, and you
    want to sort them in order. There’s a whole bunch of algorithms you can use to
    make that happen, but not all algorithms are built equal. Some are quicker than
    others but more importantly the speed of an algorithm can vary depending on how
    many items it’s dealing with. Big O is a way of measuring how an algorithm scales.
    Big O references how **complex** an algorithm is.


    Big O is represented using something like O(n). The O simply denoted we’re talking
    about big O and you can ignore it (at least for the purpose of the interview).
    *n* is the thing the complexity is in relation to; for programming interview questions
    this is almost always the size of a collection. The complexity will increase or
    decrease in accordance with the size of the data store.


    Below is a list of the Big O complexities in order of how well they scale relative
    to the dataset.'
