    ## 那么，导入器究竟是做什么的？


    它获取文件和更新，将它们转换为消息并发布到我们的全局总线上。我们有一系列组件需要这些数据，因此它们挂载在这个总线上。它使用的是 `IBMMQ`：这并不是我的选择，而是公司强制要求的。


    ## 你更想用什么？为什么要选择总线？


    我更想用 `ActiveMQ`。它对测试来说容易得多，而且我以前在使用时体验非常好。总线是我的主意。它解决了很多关于故障转移（failover）的问题。之前，我们有一个巨大的点对点连接网络，从支持的角度来看极难管理，而且如果任何一个组件宕机，整个系统就会崩溃。引入总线打破了组件之间的紧耦合，使我们的整体稳定性显著提高；去年我们每月会有一次故障，但自从引入这个之后，我们没有发生过任何全线停机。


    ## 使用总线有什么问题吗？


    它是额外的中间件，管理起来可能是一场噩梦，特别是当你有一个像我们这样的中心化团队时。它还降低了运行情况的可见性。我们遇到过消息丢失的问题，不得不迅速成为配置调优专家。但我认为总的来说这是一个很好的选择。


    ## 你知道其他的总线技术吗？


    有 `HornetQ` 和 `ZeroMQ`。我还没有机会尝试过它们，但我听说 `HornetQ` 非常快。


    ## 你们在传输层使用什么格式？


    我们正在使用 `XML`。我想用 `JSON`，但遭到了上游团队的阻力。`JSON` 好得多，可读性更高，冗余少得多，因此在传输时更小、速度更快。然而，其他团队深度投入了
    `XML`，所以我们选择了折中方案。


    ## 好的。接下来是什么？


    我们有一个挂载在它上面的数据库，记录所有导入到总线的数据。我们需要数据的历史记录，所以它可以存储长达 7 年。这是一个基础的 `MySQL` 实例。


    ## 为什么选择把它挂在总线上？为什么不把它连接到导入器上？


    ### 会不会出现总线崩溃导致消息丢失的情况？


    我们会确保在数据通过导入器时记录日志，以便在最坏的情况下可以手动对齐消息。如果每条新记录都要执行数据库事务，导入器的速度会变得非常慢。我们认为完全解耦是最好的。这也让故障转移变得更容易，因为导入器只需要关心谁在向总线发布消息，而不需要处理数据库连接。


    我们的一些上游会消费这些原始数据流，但对于其他部分，我们提供了增强版数据流。


    这个转换器通过来自不同数据库的信息对数据进行增强，并将其放回总线。


    ## 速度有多快？


    不太快，需要几秒钟。现在这不是问题，但随着我们转向实时，这需要被解决。我想为它查看一些近缓存（near caching）技术。


    我们还有一组接入数据的用户界面。它们直接与转换器通信。


    ## 为什么选择直接连接而不是使用总线？


    这是另一个我们还没得及修复的遗留问题。理想情况下它也应该挂载在总线上，但目前它是直接连接。


    ## 它们之间使用的是什么连接？


    原始套接字（Plain sockets）。我们在转换器中有一个嵌入式的 `Netty` 服务器。我是 `netty` 的忠实粉丝。


    ## 故障转移如何？


    我们只在伦敦运行转换器，但我们采用热备（hot warm）模式运行。我们在总线上有一些基础的心跳机制，以便它们知道哪一个处于存状态。如果心跳停止，备机就会接管。


    ## 在这方面遇到过问题吗？脑裂（split brain）怎么办？


    是的，我们发生过几次脑裂。我们的心跳超时设置得太激进了，所以我们推后了。这是一个可以接受的折中，如果转换器在故障转移期间延迟几秒钟是没问题的。


    希望你理解了这些观点。对于每一个系统，你都能够解释：技术选择、故障转移策略、传输选择。


    你也可以利用这个机会表达你对其他技术的了解。在面试中提到了 `Netty`、`ZeroMQ`、`HornetQ`、`IBMMQ`、`ActiveMQ`、`Git`、特性开关（Feature
    Toggles）、心跳、`XML` 对 `JSON`、`MySQL` 和 `Oracle`。这是大量的技术和设计模式。这是展示你对领域有广泛知识的有效方法。了解一切是不可能的，这就是为什么在招聘时寻找能够为组织引入新想法和技术的人是好的。如果你什么都不知道，就花时间在
    Google 上搜索。输入“Alternatives to ” 加上技术名称，你就会看到大量为你阐述论点的文章。


    ## 第二部分：核心 Java


    现在你已经完全准备好在面试的软技能上表现出色了，是时候学习如何回答技术问题了。面试官可以问你的问题无穷多；Java 的世界非常巨大。那么，该从哪里开始呢？


    传统方法是在 Google 上到处搜索面试题列表（这可能也是你找到这本书的方式）。事实是，通常问题会比你找到的大部分内容要深入得多——你永远不会被问到一个简单的问题列表。你真的需要理解你所谈论的领域。


