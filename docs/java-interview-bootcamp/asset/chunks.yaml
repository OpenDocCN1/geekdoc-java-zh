  raw: 'A common practice is to bring you in to discuss the code. I really like this
    as a concept.


    Often code cannot explain a design decision by itself and it can be a good platform
    for the hirer to understand how you think. Why did you model the domain like you
    did? Why did you use composition over inheritance? Before the interview spend
    an hour looking over your code trying to think of questions and preparing answers.
    Saying “I don’t know” about why you crafted your code in a certain way does not
    look good. Design and implementation decisions should be deliberate. Some key
    questions I like to ask of candidates:


    Why did/didn’t you make this final? Is this immutable?


    Are there any threading issues here?


    This code seems quite complicated. Why did you write it this way? Is there any
    way you could simplify it?


    You’ve written comments here. Why?


    Why did you choose ArrayList/LinkedList/Other thing?


    Are there any third party libraries that could’ve helped you with this?


    You’ve overridden equals/hashcode. Why? What changed as a result?


    For anything where speed is a concern: Did you test this to see if it made a difference?


    Remember, there is rarely a “right” answer. The questions are there to prompt
    a discussion and to see if you understand the concerns of each choice. Don’t feel
    the need to make stuff up or compromise because you think the interviewer is looking
    for a certain answer. Stick to your opinions and have a sensible discussion!


    **Tell me about your system**


    This is one of my absolute upmost favourite questions to ask during a face to
    face interview. Right now in your current role you’ll be working on a system (maybe
    more than one), and you’ve put hours of your life into it. You probably have a
    bunch of guys and girls you’ve worked with to put the system live and deliver
    some awesome value to someone. This should be the one thing that you know really
    really well. Nonetheless the number of candidates that get caught out by this
    question is incredible. You wouldn’t believe how much some people struggle with
    this.


    **Why are you getting asked this question?**


    For the interviewer this is a great way to gauge a candidates experience. Some
    developers will often just use the technologies put in front of them and neither
    understand nor care why. This should send up a big red flag. Being a java developer
    is about much more than knowing the syntax. You need to understand why systems
    are put together the way they are and what the pros and cons are. I expect this
    from candidates irrelevant of their experience. It also doesn’t matter whether
    you were involved in architecting the system or not. You should be able to take
    a view on the decisions made, whether it’s positive or negative. Remember, the
    architecture of the system itself is not on trial; if you think it’s terrible
    then you can say as much. Very few people get to work on true greenfield projects
    and build their solutions up from the start, and in reality every system is going
    to have flaws; and that’s ok. The important thing is that you know the weaknesses
    in your system and you can explain how you would do things differently.


    **Take advantage of the opportunity**


    If you are lucky enough to get this question then seize the chance with both hands.
    More than any other part of an interview this gives you the opportunity to step
    up and show yourself as an excellent candidate. If you can crush it then you’re
    well on your way to a job offer.


    **Preparation**


    Sit down with a pen and a piece of paper and draw your system out. If you think
    the system you’re working on currently isn’t interesting then use something else
    you’ve worked on in the past. As a rule of thumb the interviewer shouldn’t care
    specifically about the project you’re working on right now, they just want you
    to talk them through a system.


    Draw the relevant components. What languages are they written in and what technologies
    are frameworks used? Do you agree with those choices or do you wish there was
    something different? Draw and label the communications between them. Does it use
    files?


    Bus? Sockets? Pigeons? Write it down. Now explain exactly why each thing does
    what it does. Why was it chosen? It doesn’t matter whether you were involved in
    the decision, or if you agree with it. Explain the reasoning (or what you think
    the reasoning was), and outline if this is a good or a bad thing.


    If you have a way you would prefer to do it, then say that as well. Most choices
    in reality boil down to some sort of non functional requirement. “This is very
    latency sensitive so we chose this middleware to fit that requirement”. “The traders
    don’t really care so we made this a batch process as it’s easier to support”.
    Your job with this questions is to show that you understand the requirements of
    each component and how that relates to the technology choices. Don’t forget that
    requirements are never purely functional. How do you support the application?
    What is the mean time to recovery? Is the system global or local? What happens
    if your datacenter floods?


    **Example Interview**


    This interview is fictional, but should be representative of what you could expect
    in a real interview. Apply this sort of questioning to your own system.


    **Can you please tell me about your system?**


    Sure. It takes a bunch of transaction data from downstream systems and stores
    it. It performs some complex transformation on it and makes it available for end
    users and further up stream systems to use.


    **Ok, could you draw it for me please?**


    Sure. So first of all we have the importer. This slurps in the data from a bunch
    of our downstream systems which have information about orders and reporting in.
    It’s written in Java. It takes files once a day from 3 systems, and also has the
    option to manually import data using some web screens we threw together.


    ![](index-31_1.jpg)


    **Why did you choose to take files and not have a continuous update or something**
    **else?**


    Legacy reasons. These systems were built many years ago and there’s a reluctance
    to invest any money in them as they basically work. This limits us as we can’t
    create things like customer reports in real time, only once a day. We are currently
    mid way through a transformational project to allow real time flows; although
    some systems will never be upgraded there are some brand new downstreams that
    need to move onto our system and want a real time interface. That’s the bulk of
    my current job. The target state is to have a real time flow of data so that the
    business can see the orders as soon as they’re put in. I’ve put an HTTP interface
    in there to allow intraday updates as a tactical fix. That won’t cope with the
    data loads we’re targeting but we haven’t concluded how yet.


    **Ok, and is this system global?**


    Yes, we have an importer in New York and London. The systems in each are slightly
    different in each region so we’ve had to tweak the code slightly.


    **Do you have 1 code base then or multiple?**


    We used to have multiple code bases. It was a nightmare patching fixes across
    them so we’ve recently merged into a single GIT repo and we’ve added feature toggles
