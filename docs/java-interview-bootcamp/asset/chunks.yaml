- fmt: "\nA class can be thought of like a template; it defines what an `Object` will\
    \ look like, specifically what fields and methods it will contain. An object is\
    \ said to be an instance of a class- where the fields will contain data. For example,\
    \ a `TShirt` class may have a `colour` and `size` attribute. A `TShirt` object\
    \ could have the `colour` red and the `size` XL. There could be many instances\
    \ of an object with different or identical values for the fields.\n\n## Q: Explain\
    \ Abstraction, Encapsulation, Inheritance and Polymorphism\n\nOne of the key features\
    \ of Java is the idea of abstraction and inheritance. Inheritance allows the creation\
    \ of a class which will have the same fields and methods of another class (and\
    \ possibly more), and also be considered of the same type. For example, a `Car`\
    \ has four wheels and an engine. Using inheritance we can create a `TeslaCar`,\
    \ which is still a `Car` but also has extra fields (such as a cool touchscreen),\
    \ or a `FormulaOneCar`, which would also be a car but have an extra field for\
    \ it’s spoiler. This allows us two special features:\n\n- If I have a list of\
    \ cars and I want to see what colour each one is, I don’t care if it’s a `TeslaCar`\
    \ or a `ForumlaOneCar`. I just want to call the `Car`’s `.colour()` method. Because\
    \ `TeslaCar` “is-a” `Car`, we know that it has this method available on it.\n\
    - If the `Class` we are inheriting from already has the implementation of the\
    \ method, we do not need to write it ourselves (although we can if we want).\n\
    \nThe ability to define or override a methods implementation in a subclass results\
    \ in Polymorphism. When executing a method the implementation used is not the\
    \ one specified by the variable type but that of the variable instance.\n\n```java\n\
    public static void main(String[] args) {\n    NumberPrinter numberPrinter = new\
    \ EvenNumberPrinter(); \n    numberPrinter.printSomeNumbers();\n}\n\nprivate static\
    \ class EvenNumberPrinter extends NumberPrinter {\n    public void printSomeNumbers()\
    \ {\n        System.out.println(\"2468\");\n    }\n}\n\nprivate static class NumberPrinter\
    \ {\n    public void printSomeNumbers() {\n        System.out.println(\"123456\"\
    );\n    }\n}\n```\n\nThis would print out “2468” despite the type being a `NumberPrinter`\
    \ type. This is also a good example of method overriding, where a subclass provides\
    \ a different implementation to that of it’s superclass. It is possible to call\
    \ non-abstract methods on the super type using the keyword `super`, e.g. from\
    \ `EvenNumberPrinter`’s `printSomeNumbers()` it would be ok to call `super.printSomeNumbers()`:\n\
    \n```java\npublic void printSomeNumbers() {\n    super.printSomeNumbers();\n \
    \   System.out.println(\"2468\");\n}\n```\n\nThis would result in:\n123456\n2468\n\
    \nAn `Interface` is a `Class` with no implementation. To continue our analogy,\
    \ if `Car` was an interface with the method `.colour()`, that is simply specifying\
    \ that all `Car`’s will have a `colour()` method (and makes no statement about\
    \ how it will be implemented). You cannot create an object from an interface as\
    \ it has no implementation or fields.\n\nAn `Abstract Class` is another type of\
    \ `Class`. It may have some methods which have not been implemented (which will\
    \ be labelled `abstract`), but it may also have some methods which have been implemented.\
    \ `Abstract Classes` also cannot be used to create an object, as some implementation\
    \ code will be missing.\n\nAn object can only be instantiated based on a full\
    \ `Class` (e.g. not abstract, not an interface). In Java, a `Class` can implement\
    \ between zero or many interfaces, or it can extend zero or one abstract or concrete\
    \ classes only.\n\nEncapsulation is the principal of data hiding. An `Object`\
    \ has internal state that it does not want modifying by other objects, so it can\
    \ hide this. The only properties and behaviours that can be accessed on an `Object`\
    \ are those that are deliberately exposed by it’s creator. This is accomplished\
    \ in Java using access modifiers; `public`, `protected`, `private` and `default`.\n\
    \n## Q: What are the different access modifiers in Java and what do they mean?\n\
    \n- `public`: accessible to everyone in the JVM\n- `private`: only accessible\
    \ from inside the class.\n- `protected`: accessible from by any class in the same\
    \ package or any subclass in any package\n- `default`: when no visibility modifier\
    \ is present. accessible from any class in the same package only.\n\n## Q: What\
    \ is meant when it is said we favour low coupling and high cohesion?\n\nThis is\
    \ one of the key design principals in OOP. Low coupling refers to how different\
    \ components interact; that could be objects, modules, systems, any level. We\
    \ want components to have a very limited dependency on other components. This\
    \ makes it quick and cheap to refactor and make changes to. This is usually accomplished\
    \ by creating clean interfaces between components and using encapsulation to hide\
    \ the internal implementation. Low coupling is one of the most important ideas\
    \ for creating systems that are flexible and manageable.\n\nCohesion refers to\
    \ the implementation of the components; in a highly cohesive system things are\
    \ built in such a way that related items are put together and unrelated ones are\
    \ separate. To return to the `Car` analogy, it makes sense that the methods for\
    \ driving a car such as `turn()`, `accelerate()` and `brake()` exist on `Car`.\
    \ They are cohesive and belong together. On the other hand, if the `Car` had a\
    \ `clean()` method on it that would not be cohesive. A car doesn’t clean itself;\
    \ That is done by something else, perhaps a `CarWash` or an `Owner`. High Cohesion\
    \ is achieved by ensuring that fields and behaviours that don’t belong together\
    \ are separated to a better place.\n\nThese terms are often referred together\
    \ because cohesive systems with low coupling tend to be more flexible and maintainable.\n\
    \n## Q: What is the difference between method overloading and method overriding?\n\
    \nIn Java, it is possible for multiple methods to have the same name. They are\
    \ differentiated by having a different number, type and/or ordering of parameters.\
    \ This is known as method overloading. Overriding is the creation of a different\
    \ implementation of a method in a subclass.\n\n## Q: What is a constructor?\n\n\
    A constructor is a special method which is named identical to the class, e.g a\
    \ `Car` class will have a constructor called `Car()`. A constructor does not specify\
    \ a return type as it implicitly returns an object of the type of that class,\
    \ in this case a `Car` object. It is used to build an instance of that class.\
    \ If one is not specified there will be default public no-arg constructor provided.\
    \ It is possible to overload constructors, and all the access modifiers can be\
    \ applied to a constructor. If your class contains any `final` fields they must\
    \ be assigned a value by the end of the constructor or your program will not compile.\n\
    \n## Q: What is static in java\n\nUsing the `static` keyword effectively declares\
    \ that something belongs to the class, not to the object instance. The static\
    \ variable is shared by all instances of the object. A static method belongs to\
    \ the class, meaning that it cannot access any non-static field values. It also\
    \ means it cannot be overridden. We can also have static code blocks which are\
    \ executed when a class is loaded into memory:\n\n```java\nstatic {\n    System.out.println(\"\
    Hello!\");\n    //maybe initialise some static variables here\n}\n```\n\nStatic\
    \ can also be used for nested classes.\n\n## Q: What does it mean when we say\
    \ java does not support multiple inheritance? Is this a good thing?\n\nJava cannot\
    \ extend functionality from more than one concrete or abstract class. If both\
    \ parent classes had a `jump()` method, it would be unclear which functionality\
    \ the caller would need to use. We can implement multiple interfaces however as\
    \ the implementation occurs in our actual class so this problem does not occur.\n\
    \n## Q: If you wanted to prevent your methods or classes from being overridden,\
    \ how would you do this?\n"
