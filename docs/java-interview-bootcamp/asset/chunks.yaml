  trans: "\n人们和我想要找到所有的分组组合：每个人单独的、所有 2 人的小组、所有 3 人的小组等。使用一个简单的程序来获取每个人并遍历各种组合，如果我再多增加一个人，处理时间将呈指数级增长。每个新元素都会使处理时间翻倍。\n\
    \n现实中，`O(2n)` 算法是扩展扩展。\n\n## 如何在面试中确定 Big O\n\n这并不是 Big O 的完整列表。就像你可以有 `O(n2)`，你也可以有\
    \ `O(n3)`（想象一个多了一个循环的冒泡排序）。此页上的列表应该让你能够盲目尝试推出一个算法的 Big O 是什么。如果有人在面试中问你这个问题，他们可能想看到你是如何尝试去解决它的。拆解循环和处理过程。\n\
    \n- 它必须遍历整个列表吗？那里某处会有 `n`。\n- 算法的处理时间增长速度是否比数据集的大小增长慢？那么那里可能有一个 `log n`。\n- 是否有多个循环？你可能面对的是\
    \ `n2` 或 `n3`。\n- 访问时间是否与数据集的大小无关？`O(1)`\n\n## 示例问题\n\n**我有一个包含 1 到 100 随机数字的数组。其中缺少一个数字。写一个算法找出这个数字以及它缺失在哪个位置。**\n\
    \n这个问题有很多变体，而且都非常流行。要计算缺失的数字，我们可以将我们拥有的所有数字相加，然后减去 1 到 100 之间所有数字之和的预期值。为了做到，我们需要遍历列表一次。在此过程中，我们还可以记录哪个位置有空缺。\n\
    \n```java\npublic class BubbleSort{\n    public void findTheBlank(int[] theNumbers)\
    \ {\n        int sumOfAllNumbers = 0;\n        int sumOfNumbersPresent = 0;\n\
    \        int blankSpace = 0;\n\n        for (int i = 0; i < theNumbers.length;\
    \ i++) {\n            sumOfAllNumbers += i + 1;\n            sumOfNumbersPresent\
    \ += theNumbers[i];\n            if (theNumbers[i] == 0)\n                blankSpace\
    \ = i;\n        }\n        System.out.println(\"Missing number = \" + (sumOfAllNumbers\
    \ - sumOfNumbersPresent) + \" at location \" + blankSpace +\" of the array\");\
    \ \n    }\n\n    public static void main(String[] args) {\n        new BubbleSort().findTheBlank(new\
    \ int[]{7,6,0,1,3,2,4});\n    }\n    //Missing number = 5 at location 2 of the\
    \ array\n}\n```\n\n注意：你也可以使用 `(theNumbers.length+1) * (theNumbers.length) / 2.0`\
    \ 来计算 `sumOfAllNumbers`。但在面试中我永远记不住公式。\n\n## 你的算法 Big O 是多少？\n\n我们的算法遍历了列表一次，所以它是\
    \ `O(n)`。\n\n## 结论\n\n你太棒了。感谢你读完这本书。我为此感到非常自豪，更具体地说，我为能够帮助人们获得理想的新工作感到自豪。每当我收到人们发来的邮件或消息，感谢我帮助他们找到了更好的工作时，这让我非常兴奋。\n\
    \n如果一切顺利并且你从中获益，请务必告诉我。即使你有额外的问题、想让人帮你看简历，或者只是想打个招呼。我都会尝试回复收到的每一条消息。\n\ne: `hello@corejavainterviewquestions.com`\n\
