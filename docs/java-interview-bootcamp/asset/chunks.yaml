  trans: "\n\n`yield()` 会放弃处理器的控制权。假设你只有一个 CPU，如果一个线程拒绝让其他线程使用 CPU 时间，它们将保持永久阻塞。通过调用\
    \ `yield()`，该线程慷慨地表示：“还有谁想轮到吗？”。在现实中，它是不可靠的，且通常不被使用。在任何系统或 `JVM` 上，其实现可能不同，并且在不同的\
    \ Java 版本之间也经常不同。无法保证哪个线程将获得下一次访问权限，也无法保证你的线程何时再次获得运行的机会。\n\n### Q: `interrupt()`\
    \ 有什么作用？\n\n你可能已经注意到许多与线程相关的方法（最常见的是 `Thread.sleep()`）强制你捕获 `InterruptedException`。如果我们需要建议某个\
    \ `Thread` 因某种原因需要停止，可以通过对它调用 `interrupt()`来实现。这会在目标线程上设置“被中断”（interrupted）标志。如果目标线程选择检查此标志位（使用\
    \ `interrupted()` 或 `isInterrupted()`），那么它就可以选择性地抛出一个 `Exception`（通常是 `Interrupted`\
    \ 异常）。这取决于目标 `Thread` 是否真的检查了该标志。\n\n然而，有许多方法（例如 `Thread.sleep()`）会自动轮询此标志。如果目标线程正在运行这些方法之一，将直接抛出\
    \ `InterruptedException`。\n\n### Q: `join()` 有什么作用？\n\n`join()` 简单地告诉当前运行的线程等待，直到调用\
    \ `join()` 的那个线程完成。\n\n```java\npublic class SayHelloRunner implements Runnable\
    \ {\n    public static void main(String[] args) throws InterruptedException {\n\
    \        Thread thread = new Thread(new SayHelloRunner());\n        thread.start();\n\
    \        thread.join();\n        System.exit(3);\n    }\n\n    @Override\n   \
    \ public void run() {\n        int i = 0;\n        while(i < 10000){\n       \
    \     System.out.println(i);\n            i++;\n        }\n    }\n}\n```\n\n在这个示例中，如果我们没有\
    \ `thread.join()`，应用程序将在不打印任何内容的情况下直接退出。`join()` 调用实际上使调用变为同步；它希望 `Thread` 在继续继续执行之前先完成。\n\
    \n### 对象方法\n\n### Q: `wait()`、`notify()` 和 `notifyAll()` 有什么作用？\n\n### Q: 为什么必须在同步块中调用它们？\n\
    \n### Q: 它们有什么替代方案？\n\n`wait()`、`notify()` 和 `notifyAll()` 被用作线程间通信手段。在获取对象锁时，对象可能尚未处于所需状态；也许资源尚未设置，或者值不正确。我们可以使用\
    \ `wait()` 让线程睡眠，直到某些发生变化。当这些变化发生时，可以通过在正在等待的对象上调用 `notify()` 或 `notifyAll()`\
    \ 来通知等待的客户端。如果理论上你所有的等待线程都可以根据新信息采取行动，则使用 `notifyAll()`。然而，如果有新的锁需要获取（因此只有一个等待状态的\
    \ `Thread` 可以采取行动），则仅调用 `notify()`。\n\n示例代码：\n\n```java\npublic class Example\
    \ {\n    public static void main(String[] args) {\n        ResourceCarrier carrier\
    \ = new ResourceCarrier();\n        ThingNeedingResource thingNeedingResource\
    \ = new ThingNeedingResource(carrier);\n        ThingNeedingResource thingNeedingResource2\
    \ = new ThingNeedingResource(carrier);\n        ThingNeedingResource thingNeedingResource3\
    \ = new ThingNeedingResource(carrier);\n        ResourceCreator resourceCreator\
    \ = new ResourceCreator(carrier);\n\n        new Thread(thingNeedingResource).start();\n\
    \        new Thread(thingNeedingResource2).start();\n        new Thread(thingNeedingResource3).start();\n\
    \        new Thread(resourceCreator).start();\n    }\n}\n\npublic class ResourceCarrier\
    \ {\n    private boolean resourceReady;\n\n    public boolean isResourceReady()\
    \ {\n        return resourceReady;\n    }\n\n    public void resourceIsReady()\
    \ {\n        resourceReady = true;\n    }\n}\n\npublic class ResourceCreator implements\
    \ Runnable {\n    private ResourceCarrier carrier;\n\n    public ResourceCreator(ResourceCarrier\
    \ carrier) {\n        this.carrier = carrier;\n    }\n\n    @Override\n    public\
    \ void run() {\n        try {\n            Thread.sleep(2000);\n        } catch\
    \ (InterruptedException e) {\n            e.printStackTrace();\n        }\n  \
    \      synchronized (carrier) {\n            carrier.resourceIsReady();\n    \
    \        carrier.notifyAll();\n        }\n    }\n}\n\npackage com.core.interview.thread;\n\
    \npublic class ThingNeedingResource implements Runnable {\n    private ResourceCarrier\
    \ carrier;\n\n    public ThingNeedingResource(ResourceCarrier carrier){\n    \
    \    this.carrier = carrier;\n    }\n\n    @Override\n    public void run() {\n\
    \        synchronized (carrier){\n            while(!carrier.isResourceReady()){\n\
    \                try {\n                    System.out.println(\"Waiting for Resource\"\
    );\n                    carrier.wait();\n                } catch (InterruptedException\
    \ e) {\n                    e.printStackTrace();\n                }\n        \
    \    }\n            System.out.println(\"Waiting for Resource\"); \n        }\n\
    \    }\n}\n```\n\n示例输出：\n```text\nWaiting for Resource\nWaiting for Resource\n\
    Waiting for Resource\n```\n在这个示例中，我们有一个名为 `ResourceCarrier` 的资源包装器，以及想要访问该资源的线程。当它获取锁时，它会发现资源不可用，并通过在\
    \ `ResourceCarrier` 上调用 `wait()` 进入等待模式。`ResourceCreator` 随后介入创建资源并在 `ResourceCarrier`\
    \ 上调用 `notifyAll()`，此时线程恢复了活力的。\n\n### 死锁 (Deadlock)\n\n### Q: 什么是死锁？\n\n### Q:\
    \ 如何防止死锁？\n\n许多候选人会在回答死锁问题时含糊其辞。这是一个非常常见的面试题，概念本身足够容易理解，但在电话中解释起来可能很棘手。\n\n死锁发生在两个或线程相互等待对方的操作，从而阻止了任何进一步的发生。例如，线程\
    \ A 持有对象 1 的锁并尝试获取对象 2 的锁以继续。同时，线程 B 持有对象 2 的锁并尝试获取对象 1 的锁。结果是两个线程都在等待对方，而对方永远不会释放。这就是死锁。\n\
    \n防止死锁最简单的方法是确保获取锁的顺序一致的。如果两个线程都尝试按顺序获取对象 1 然后对象 2，就不会发生死锁。在获取锁时，编写防御性代码是非常重要的。更好的方法是让同步块尽可能小，并尽可能避免锁定多个对象。\n\
    \n### Q: 什么是活锁 (Livelock)？\n\n在死锁中，线程会停止工作并等待资源释放。在活锁中，独立的线程并没有停止；它们会继续工作尝试解决阻塞。然而，这样做会导致阻塞持续且无法解决。这种情况发生在以下场景：如果一个线程无法访问所需的资源，它将回到处理开始并在循环中重试工作，直到成功。想象经典的银行账户示例。如果同时存在从账户\
    \ A 到账户 B 以及从账户 B 到账户 A 的交易；两个账户都被扣款，但当进行入账时，账户已被锁定。交易被撤销并重新尝试。这种尝试会无限持续下去；因此，被称为“活”的锁。\n\
    \n### Q: 什么是线程优先级？\n\nThread 有一个方法 `setPriority()`，它接收一个表示优先级的 `int`。\n\nThread\
    \ 还有一些你可以使用的常量：`Thread.MIN_PRIORITY`、`Thread.MAX_PRIORITY` 和 `Thread.NORM_PRIORITY`。\n\
    \n"
- fmt: "\nHowever, like all things threading and JVM related, you cannot rely on it\
    \ to behave in a consistent fashion particularly across different systems and\
    \ operating systems. The actual way priority levels varies from system to system,\
    \ and the CPU can choose to behave in any way it wants. Maybe for priorities above\
    \ a certain level it will give even a dedicated percentage of time for. In the\
    \ same fashion, you’t know what other processes are being run. You may have a\
    \ background thread you set to a low value, but if there is some other process\
    \ running on the machine at a slightly higher priority your `Thread` may never\
    \ get run.\n\nNonetheless, it can work well. Check the following example: \n\n\
    ```java\npublic static void main(String[] args) {\n    Thread thread = new Thread(new\
    \ Counter(1));\n    thread.setPriority(Thread.MAX_PRIORITY);\n    Thread threadTwo\
    \ = new Thread(new Counter(2));\n    thread.setPriority(Thread.MIN_PRIORITY);\n\
    \    thread.start();\n\n    threadTwo.start();\n}\n\nprivate static class Counter\
    \ implements Runnable {\n    private int id;\n\n    public Counter(int i) {\n\
    \        id = i;\n    }\n\n    @Override\n    public void run() {\n        for\
    \ (int i = 0; i < 10; i++) {\n            System.out.println(\"Thread \" + id\
    \ + \" - \" + i);\n        }\n    }\n}\n```\n\nThis simple program launches two\
    \ `Threads` which count to ten in a loop. If I remove the priority setting lines,\
    \ the output is jumbled:\n\n```\nThread 2 - 0\nThread 1 - 0\nThread 1 - 1\nThread\
    \ 1 - 2\nThread 1 - 3\nThread 1 - 4\nThread 2 - 1\nThread 2 - 2\nThread 2 - 3\n\
    Thread 2 - 4\nThread 2 - 5\nThread 2 - 6\nThread 1 - 5\nThread 1 - 6\nThread 2\
    \ - 7\nThread 2 - 8\nThread 1 - 7\nThread 1 - 8\nThread 1 - 9\nThread 2 - 9\n\
    ```\n\nHowever, if I run the program as it’s shown above:\n\n```\nThread 1 - 0\n\
    Thread 1 - 1\nThread 1 - 2\nThread 1 - 3\nThread 1 - 4\nThread 1 - 5\nThread 1\
    \ - 6\nThread 1 - 7\nThread 1 - 8\nThread 1 - 9\nThread 2 - 0\nThread 2 - 1\n\
    Thread 2 - 2\nThread 2 - 3\nThread 2 - 4\nThread 2 - 5\nThread 2 - 6\nThread 2\
    \ - 7\nThread 2 - 8\nThread 2 - 9\n```\n\nRunning on my machine this isn’t consistent\
    \ though, and does sometime jumble slightly. The way `Threads` work will never\
    \ be consistant across machines or JVMs and it is important to write code that\
    \ does not rely on a JVM’s behaviour.\n\n### Q: What is Thread starvation?\n\n\
    If a `Thread` cannot get CPU time because of other `Threads` this is known as\
    \ starvation.\n\nImagine an extreme example like the above, with a number of high\
    \ priority `Threads` and a single low priority `Thread`. The low priority is unlikely\
    \ to get any CPU time and will be suffering from starvation.\n\n### Futures, Callables\
    \ and Executors\n\n### Q: What is a ThreadPool? Why is it better to use them instead\
    \ of manually creating Threads?\n\nThe creation and maintenance of `Threads` is\
    \ expensive and time consuming. With a `ThreadPool` a group of `Threads` are available\
    \ which can be called on to execute tasks. The `Threads` are created up-front,\
    \ thus reducing the overhead at execution time. Once a task has been executed\
    \ the `Thread` is returned to the pool to execute another task. If a `Thread`\
    \ dies for some reason it will be replaced in the `ThreadPool`, removing the need\
    \ to write complex `Thread` management code.\n\nThere is the added benefit that\
    \ it makes it easy to control the number of tasks happening in parallel. For example,\
    \ if we have a webserver we may want to limit the number of parallel tasks so\
    \ that a huge burst of traffic wouldn’t stop other background tasks from happening.\n\
    \n### Q: How do you create a ThreadPool\n\nNormally `ThreadPools` are created\
    \ using `Executors`.\n\n```java\nExecutorService executorService1 = Executors.newSingleThreadExecutor();\n\
    ExecutorService executorService2 = Executors.newFixedThreadPool(10);\nExecutorService\
    \ executorService3 = Executors.newScheduledThreadPool(10);\n```\n\nA single thread\
    \ executor will create a single thread; all tasks will be executed sequentially.\
    \ The same could be achieved using `Executors.newFixedThreadPool(1)`.\n\n`Executors.newFixedThreadPool`\
    \ will create a `ThreadPool` with exactly the number of `Threads` specified. Those\
    \ threads will live for the lifetime of the `JVM` unless the `Executor` is shutdown\
    \ using `shutdown()` (which will allow currently queued tasks to finished) and\
    \ `shutdownNow()` (which will cancel any outstanding tasks).\n\nTasks can be run\
    \ on `ExecutorServices` by either submitting a `Callable` or a `Runnable`.\n\n\
    ### Q: What is the difference between Callable and Runnable? What is a Future?\n\
    \nA `Runnable` cannot return a value and it cannot throw a checked exception,\
    \ both features available in `Callable`. A `Future` is a representation of the\
    \ result of an asynchronous computation.\n"
