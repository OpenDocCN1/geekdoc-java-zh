  trans: "\n\n# Q: 什么是 `volatile` 关键字？\n\n在现代处理器中，有许多技术尝试优化内存和吞吐量，例如 `caching`（缓存）。这是将频繁访问的变量存储在靠近特定处理器的小内存内存中，以提高处理速度；它减少了处理器从磁盘获取信息的次数（磁盘读取通常非常慢）。然而，在多线程环境中，这是非常危险的，因为如果变量在缓存中更新但未写回内存，意味着两个线程可能会看到变量的不同版本；`processor\
    \ A` 可能认为 `int i = 2`，而 `processor B` 认为 `int i = 4`。这时 `volatile` 派上用场了。它告诉 Java\
    \ 该变量可能会被多个线程访问，因此不应该被缓存，从而保证在访问时获取值是正确的。它还阻止了编译器通过重排排序（reordering）代码来尝试优化代码。\n\
    \n缺点是使用 `volatile` 变量会有性能开销。由于信息无法存储在缓存中，获取信息的传输距离更远。然而，从速度来看，`volatile` 通常比使用\
    \ `synchronized` 块要好得多，因为它不会导致线程阻塞，因此比其他同步选项快得多。\n\n# Q: 解释一下 `synchronized` 关键字。它是做什么的？我们为什么需要它？\n\
    \n`synchronized` 是 `java` 中的一个关键字，可以作为代码块包裹代码，也可以作为方法签名的一部分。\n\n```java\npublic\
    \ class Bank {\n    private int funds = 100;\n\n    public void deposit(int money){\n\
    \        synchronized (this){\n            funds += money;\n        }\n    }\n\
    \n    public synchronized void withdraw(int money){\n        if(funds > money)\n\
    \            funds -= money;\n        }\n    }\n}\n```\n\n`synchronized` 在 Java\
    \ 中存在是为了允许多个能够看到同一个对象的线程安全地访问它，以确保数据的正确性。经典的例子是银行账户。想象一下从上面的示例中移除同步机制。线程一尝试从账户中扣除\
    \ 100。与此同时，线程二也尝试从账户中扣除 100。当两个线程检查资金是否充足时，`if` 语句都返回 true，导致两者都执行了扣款操作，结果余额为\
    \ -100，这是不被允许的。通过使用 `synchronized`，只有一个线程可以访问 `synchronized` 块中的代码段，这可以帮助我们确保状态正确。\n\
    \n当 `synchronized` 关键字放在方法上（如 `withdraw(int money)`）时，它的效果相当于将整个方法的代码包裹在 `synchronized(this)`\
    \ 中（如示例中的 `deposit` 方法）。如果任何线程尝试执行该对象上的任何 `synchronized` 方法，它都将被阻塞。\n\n# Q: 使用\
    \ `synchronized` 的缺点是什么？我们如何避免或减轻这些缺点？\n\n`Locks` 很慢。非常慢。特别是当使用 `synchronized`\
    \ 关键字时，它会对性能产生巨大影响。其原因在 `LMAX` 创建的关于他们如何构建 `Disruptor`（一个超低延迟并发组件）的论文中解释得非常好。\n\
    \n对于任何想要深入了解线程细节和 `mechanical sympathy`（机械共鸣）的人来说，这是一都是非常精彩的读物。你可以在此地址访问：http://lmax-exchange.github.io/disruptor/files/Disruptor-1.0.pdf。\n\
    \n> “锁是非常昂贵的，因为它们在竞争时需要仲裁。这种仲裁通过切换到操作系统内核来实现，内核会挂起等待锁的线程，直到锁释放。在这样的上下文切换期间，以及将控制权交给操作系统期间（操作系统在拥有控制权期间可能会决定执行其他管理任务），执行上下文可能会丢失之前缓存的数据和指令。这会对现代处理器产生严肃的性能影响。”\n\
    \n你不需要学习引文中细节的含义；只需知道，除了线程在等待资源时被阻塞的影响外，在操作系统层面还有一种影响造成了巨大的性能损害。在同一篇论文中，进行了一项实验来观察不同类型的锁对延迟的影响；在不加锁的情况下，进程耗时\
    \ 300ms，而当 2 个线程竞争锁时，耗时 224,000ms。处理好线程是困难的，但做错会产生巨大的后果。\n\n如果你坚持使用 `synchronized`，那么尽可能减小被\
    \ `synchronized` 代码块的大小是一个好的开始。块越小，越有助于将影响至最低。更好的方法是，你可以针对特定对象加锁，或者在使用基本类型时使用一个锁对象，这样就不需要整个对象进行竞争。\n\
    \n```java\npublic class Bank {\n    private int funds = 100;\n    private Object\
    \ fundLock;\n\n    private UserDetails details = new UserDetails();\n\n    public\
    \ void deposit(int money){\n        synchronized (fundLock){//需要获取锁对象来更新资金\n \
    \           funds += money;\n        }\n    }\n\n    public void createUsername(){\n\
    \        synchronized (details){//在 details 对象上加锁意味着 details 对象会被阻塞，但 Bank 不会。\n\
    \            details.setName(\"Bob\");\n        }\n        System.out.println(\"\
    His name is Bob\");\n    }\n}\n```\n\n但理想情况下，我们希望避免 `synchronized`。\n\n# Q: 创建线程安全的代码，我们还有哪些其他选项？\n\
    \n正如之前讨论的，将变量标记为 `volatile` 性能更好且复杂性较低。然而，Java 有许多类可以帮助我们处理线程，以便我们以高效的方式完成。\n\n\
    # 原子类 (Atomic Classes)\n\n# Q: 什么是 CAS？它相比 `synchronized` 有什么优势？\n\nJava 有许多 `Atomic`\
    \ 类，包括 `AtomicInteger`、`AtomicDouble` 和 `AtomicBoolean`。这些类完全线程安全，不涉及锁定，而是使用比较并交换（CAS）操作。`CAS`\
    \ 操作是一种原子操作（即作为单一操作完成），在更新期间，我们检查字段值是否自决定更新以来发生了变化（即未被另一个线程修改），如果是，则将其设置为新值。这种方式非常快；`CAS`\
    \ 实际上大多数处理器都支持的操作，且不需要阻塞。它仍然比单线程慢（LMAX 实验得出它慢了 100 倍），但它是确保值安全访问的最佳方案。\n\n理解 `volatile`\
    \ 和 `CAS` 之间的区别是非常重要的。如果你尝试执行任何使用原始值的操作，将使 `volatile` 关键字失效。例如，`i++` 被拆解为 `i=i\
    \ + 1`。在读取 `i`（`i + 1`）和写入（`i = result`）之间，另一个线程可能会插入并更新值。由于 `Atomic` 类检查并写入值是原子操作，因此要安全得多。\n\
    \n# 不变性 (Immutability)\n\n不可变对象是极好的。不可变对象是在创建后状态无法改变。根据这个定义，所有不可变对象都是线程安全的。面试官喜欢测试人们记忆这些方法细节的能力。最好的方法是在面试前阅读一下相关内容。\n\
    \n# 线程方法\n\n# Q: `yield()` 是做什么的？\n\n`Thread` 类有很多方法，是你面试中需要知道的。面试官喜欢测试人们对这些方法细节的记忆。最好的方法是在面试前学习它们。\n\
    \n"
- fmt: "\n`yield()` gives up the processor. Imagine you have a single CPU only, if\
    \ a thread refuses to allow other threads CPU time they will remain permanently\
    \ blocked. By calling `yield()` the thread is generously saying “who else wants\
    \ a turn?”. In reality it is unreliable and isn’t normally used. The implementation\
    \ can be different on any system or `JVM`, and can often be different between\
    \ Java versions. There is no guarantee of what other thread will get the next\
    \ access, nor when your thread will next get an opportunity to run.\n\n### Q:\
    \ What does `interrupt()` do?\n\nYou may have noticed that a number of Thread\
    \ related methods (most commonly `Thread.sleep()`) force you to catch an `InterruptedException`.\
    \ If we need to suggest to a `Thread` it needs to stop for whatever reason we\
    \ can do this by calling `interrupt()` on it. This sets the “interrupted” flag\
    \ on the target thread. If the target thread chooses to check this flag (using\
    \ the `interrupted()` or `isInterrupted()`) then it can optionally throw an `Exception`\
    \ (usually `Interrupted` exception). It is predicated on the target `Thread` actually\
    \ checking this.\n\nHowever there are a number of methods, such as `Thread.sleep()`\
    \ which automatically poll for this flag. If the target thread is running one\
    \ of these then an `InterruptedException` will be thrown straight away.\n\n###\
    \ Q: What does `join()` do?\n\n`join()` will simply tell the currently running\
    \ thread to wait until completion of whichever thread `join()` is called on completes.\n\
    \n```java\npublic class SayHelloRunner implements Runnable {\n    public static\
    \ void main(String[] args) throws InterruptedException {\n        Thread thread\
    \ = new Thread(new SayHelloRunner());\n        thread.start();\n        thread.join();\n\
    \        System.exit(3);\n    }\n\n    @Override\n    public void run() {\n  \
    \      int i = 0;\n        while(i < 10000){\n            System.out.println(i);\n\
    \            i++;\n        }\n    }\n}\n```\n\nIn this example if we did not have\
    \ the `thread.join()` the application will exit without printing anything out.\
    \ The `join()` call effectively makes the call synchronous; it want’s the `Thread`\
    \ to finish before proceeding.\n\n### Object methods\n\n### Q: What do `wait()`,\
    \ `notify()` and `notifyAll()` do?\n\n### Q: Why must they be called from a synchronised\
    \ block?\n\n### Q: What alternatives are there to these?\n\n`wait()`, `notify()`\
    \ and `notifyAll()` are used as a means of inter-thread communication. When acquiring\
    \ a lock on an object it may not be in the required state; perhaps a resource\
    \ isn’t set yet, a value isn’t correct. We can use `wait()` to put the thread\
    \ to sleep until something changes. When that something does change, the awaiting\
    \ clients can be notified by calling `notify()` or `notifyAll()` on the object\
    \ that is being waited for. If all of your waiting threads could could in theory\
    \ take action with the new information then use `notifyAll()`. However if there\
    \ is a new lock to be acquired (so only one waiting `Thread` can take action),\
    \ then call just `notify()`.\n\nExample:\n\n```java\npublic class Example {\n\
    \    public static void main(String[] args) {\n        ResourceCarrier carrier\
    \ = new ResourceCarrier();\n        ThingNeedingResource thingNeedingResource\
    \ = new ThingNeedingResource(carrier);\n        ThingNeedingResource thingNeedingResource2\
    \ = new ThingNeedingResource(carrier);\n        ThingNeedingResource thingNeedingResource3\
    \ = new ThingNeedingResource(carrier);\n        ResourceCreator resourceCreator\
    \ = new ResourceCreator(carrier);\n\n        new Thread(thingNeedingResource).start();\n\
    \        new Thread(thingNeedingResource2).start();\n        new Thread(thingNeedingResource3).start();\n\
    \        new Thread(resourceCreator).start();\n    }\n}\n\npublic class ResourceCarrier\
    \ {\n    private boolean resourceReady;\n\n    public boolean isResourceReady()\
    \ {\n        return resourceReady;\n    }\n\n    public void resourceIsReady()\
    \ {\n        resourceReady = true;\n    }\n}\n\npublic class ResourceCreator implements\
    \ Runnable {\n    private ResourceCarrier carrier;\n\n    public ResourceCreator(ResourceCarrier\
    \ carrier) {\n        this.carrier = carrier;\n    }\n\n    @Override\n    public\
    \ void run() {\n        try {\n            Thread.sleep(2000);\n        } catch\
    \ (InterruptedException e) {\n            e.printStackTrace();\n        }\n  \
    \      synchronized (carrier) {\n            carrier.resourceIsReady();\n    \
    \        carrier.notifyAll();\n        }\n    }\n}\n\npackage com.core.interview.thread;\n\
    \npublic class ThingNeedingResource implements Runnable {\n    private ResourceCarrier\
    \ carrier;\n\n    public ThingNeedingResource(ResourceCarrier carrier){\n    \
    \    this.carrier = carrier;\n    }\n\n    @Override\n    public void run() {\n\
    \        synchronized (carrier){\n            while(!carrier.isResourceReady()){\n\
    \                try {\n                    System.out.println(\"Waiting for Resource\"\
    );\n                    carrier.wait();\n                } catch (InterruptedException\
    \ e) {\n                    e.printStackTrace();\n                }\n        \
    \    }\n            System.out.println(\"Waiting for Resource\"); \n        }\n\
    \    }\n}\n```\n\nSample output:\n```text\nWaiting for Resource\nWaiting for Resource\n\
    Waiting for Resource\n```\nIn this example we have a wrapper around a resource\
    \ called `ResourceCarrier` and threads that want access to it. When it acquires\
    \ the lock it sees the resource isn’t available and goes into wait mode by calling\
    \ `wait()` on `ResourceCarrier`. The `ResourceCreator` swoops in later to create\
    \ the resource and calls `notifyAll()` on `ResourceCarrier`, at which point the\
    \ threads spring back to life.\n\n### Deadlock\n\n### Q: What is a deadlock?\n\
    \n### Q: How do we prevent deadlocks?\n\nMany candidates fluff the answer to deadlock\
    \ questions. It’s a very common interview question, and it’s an easy enough concept\
    \ to understand, but it can be tricky to explain (particularly over the phone).\n\
    \nA deadlock occurs when two or more threads are awaiting the actions of each\
    \ other which prevents any further processing from happening. For example, Thread\
    \ A has the lock on Object 1 and attempts to require a lock on Object 2 to continue.\
    \ Simultaneously, Thread B has a lock on Object 2 and attempts to acquire a lock\
    \ on Object 1. As a result both Threads are kept busy waiting for the other, which\
    \ will never release. This is a deadlock.\n\nThe easiest way to prevent deadlock\
    \ is to ensure that the ordering of acquisition for locks is consistent. If both\
    \ Threads try to acquire Object 1 then Object 2 in that order then deadlock will\
    \ not occur. It is important to code defensively when acquiring locks. Even better\
    \ is to make synchronized blocks as small as possible and where possible avoid\
    \ locking multiple objects.\n\n### Q: What is Livelock?\n\nIn deadlock, the Threads\
    \ will stop working and await the resource to become free. In Livelock the separate\
    \ Threads do not stop; they will continue working trying to resolve the block.\
    \ However by doing so the blockage continues and will not resolve. This can happen\
    \ in situations where, if a Thread cannot access the resources it requires, will\
    \ go back to the start of processing and retry the work in a loop until success.\
    \ Imagine the classic bank account example. If there is a simultaneous transaction\
    \ from Account A to Account B and Account B to Account A; Both accounts are debited,\
    \ but when the crediting of the account takes place the account is already locked.\
    \ The transactions are reverted and reattempted. This will continue ad infinatum\
    \ with the work being attempted; hence, “live” lock.\n\n### Q: What is Thread\
    \ Priority?\n\nThread has a method on it, `setPriority()` which takes an `int`\
    \ representing the priority level.\n\nThread has some constants on it you can\
    \ use: `Thread.MIN_PRIORITY`, `Thread.MAX_PRIORITY` and `Thread.NORM_PRIORITY`.\n"
