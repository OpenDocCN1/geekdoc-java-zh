    **Threading**


    As a developer the single best thing we can do for producing clean, understandable
    code that won’t fall over is to avoid putting any multi threading into your code
    base. The best programmers can break most problems down to be solved without complex
    threading.


    Poor programmers will throw threading in to fix a problem they don’t understand
    or to prematurely optimise. Threading questions are exceptionally popular for
    interviews so it’s important to be able to demonstrate a sound understanding of
    how threads work in Java, when and why we use them, and how to actually program
    them in a safe manner. In this article we will tackle threading from the ground
    up and cover what you need to know to be able to answer any questions that come
    up.


    **Introduction to Threading**


    **Q: What is a Thread?**


    **Q: How do we create Threads in java?**


    Threads allow us to do more than one thing at once. Without Threads code is executed
    in a linear fashion, one command after another. By using threads we can perform
    multiple actions at the same time. This takes advantage of the fact that computers
    now have multiple processors as well as the ability to time slice tasks, so multiple
    threads can even be run on a single processors. There are 2 main ways to create
    a new Thread in Java.


    Firstly, you can extend the Thread class and override the run method to execute
    your code.


    1 public class SayHello extends Thread {


    2


    3 public **static** void main(String[] args) {


    4 new SayHello().start();


    5 }


    6


    7 @Override


    8 public void run() {


    9 **for** (int i = 0; i < 100; i++) {


    10 System.out.println("Hi there!"); 11 }


    12 }


    13 }


    Generally we avoid this. Java doesn’t have multiple inheritance so this option
    will limit your ability to extend anything else. More importantly, it’s just not
    a very pretty way of doing it. As good developers we aim to favour composition
    over inheritance. Option two is much nicer, allowing us to implement the Runnable
    interface and pass this to a new Thread object. The interface has one method on
    it, run.


    1 public class SayHelloRunner implements Runnable {


    2 public **static** void main(String[] args) {


    3 new Thread(new SayHelloRunner()).start();


    4 }


    5


    6 @Override


    7 public void run() {


    8 **for** (int i = 0; i < 100; i++) {


    9 System.out.println("Hi there!"); 10 }


    11 }


    12 }


    We pass the new Runnable to a Thread to start it. We always use **start()** to
    run the thread; using run() will run execute in the same thread as the caller.


    **Q: How do we stop a Thread in java?**


    There is actually no API level way to stop a Thread reliably in java. The only
    guarantee is that when the code being executed in the thread completes, the thread
    will finish. It is therefore down to the developer to implement a way of telling
    a Thread to stop.


    1 public class SayHelloRunner implements Runnable {


    2 private **volatile** boolean running = true; 3


    4 public void stopIt(){


    5 running = false;


    6 }


    7


    8 @Override


    9 public void run() {


    10 **while**(running)


    11 System.out.println("Hi there!"); 12 }


    13 }


    As you can see in the above example the flag to check if the thread is running
    or not has the keyword volatile.'
