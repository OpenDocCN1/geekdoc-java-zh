  trans: "\n对于大多数人来说，这是一个很难回答的问题，尽管他们可能做过这件事，但很可能是很久以前的事情，而且并不是你能轻易回起来的内容。最好的准备方法是实际上尝试编写一个带有内存泄漏的应用程序，并尝试对其进行诊断。下面我创建了一个荒谬的内存泄漏示例，这将让我们逐步了解识别问题的过程。**我强烈建议你下载代码并遵循这一过程。**\
    \ 如果你亲自执行了这个过程，它将更有可能被深深刻记忆。\n\n```java\nimport java.util.ArrayDeque;\nimport\
    \ java.util.Deque;\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        TaskList taskList = new TaskList();\n        final TaskCreator\
    \ taskCreator = new TaskCreator(taskList);\n        new Thread(new Runnable()\
    \ {\n            @Override\n            public void run() {\n                for\
    \ (int i = 0; i < 100000; i++) {\n                    taskCreator.createTask();\n\
    \                }\n            }\n        }).start();\n    }\n\n    private static\
    \ class TaskCreator {\n        private TaskList taskList;\n        public TaskCreator(TaskList\
    \ taskList) {\n            this.taskList = taskList;\n        }\n        public\
    \ void createTask() {\n            taskList.addTask(new Task());\n        }\n\
    \    }\n\n    private static class TaskList {\n        private Deque<Task> tasks\
    \ = new ArrayDeque<Task>();\n        public void addTask(Task task) {\n      \
    \      tasks.add(task);\n            tasks.peek().execute();//Memory leak!\n \
    \       }\n    }\n\n    private static class Task {\n        private Object[]\
    \ array = new Object[1000];\n        public void execute() {\n            //dostuff\n\
    \        }\n    }\n}\n```\n\n在上面这个非常刻意的示例中，应用程序执行了放入 `Deque` 中的任务。\n\n然而，当我们运行它时，得到了内存溢出（out\
    \ of memory）！这可能是什么呢？\n\n为了找到答案，我们需要使用性能分析器（profiler）。性能分析器允许让我们准确看到 VM 内部发生了什么。有很多可用选项。VisualVM\
    \ (https://visualvm.java.net/download.html) 是免费的，并允许基础分析。对于更完整的工具 set，有很多选择，但我个人最喜欢的是\
    \ Yourkit。它拥有一系列惊人的工具帮助你进行诊断和分析。然而，使用的原理通常是相同的。\n\n我开始在本地运行我的应用程序，然后启动 VisualVM\
    \ 并选择该进程。\n\n你可以准确观察堆（heap）、永久代（permgen）等区域发生的情况。\n\n你可以在堆（右上角）看到内存泄漏的明显迹象。应用程序呈现锯齿状波动，这本身并不是问题，但内存一直在持续上升且没有回到基础水平。这听起来像是内存泄漏。但我们如何判断是什么\n\
    \n![](img/index-59_1.jpg)\n\n![](img/index-58_2.jpg)\n"
- fmt: "\n# Q: What is the volatile keyword?\n\nIn modern processors a lot goes on\
    \ to try and optimise memory and throughput such as `caching`. This is where regularly\
    \ accessed variables are kept in a small amount of memory close to a specific\
    \ processor to increase processing speed; it reduces the amount the processor\
    \ has to go to disk to get information (which can be very slow). However, in a\
    \ multithreaded environment this can be very dangerous as it means that two threads\
    \ could see a different version of a variable if it has been updated in cache\
    \ and not written back to memory; `processor A` may think `int i = 2` whereas\
    \ `processor B` thinks `int i = 4`. This is where `volatile` comes in. It tells\
    \ Java that this variable could be accessed by multiple threads and therefore\
    \ should not be cached, thus guaranteeing the value is correct when accessing.\
    \ It also stops the compiler from trying to optimise the code by reordering it.\n\
    \nThe downside is that there is a performance penalty on using `volatile` variables.\
    \ There is a greater distance to travel to get access to the information as it\
    \ cannot be stored in the cache. However `volatile` is usually a much better option\
    \ speed wise than using a `synchronized` block as it will not cause threads to\
    \ block and as such is much faster than other options for synchronisation.\n\n\
    # Q: Explain the synchronized keyword. What does it do? Why do we need it?\n\n\
    `synchronized` is a keyword in `java` that can be used as a block around a piece\
    \ of code or as part of the method signature.\n\n```java\npublic class Bank {\n\
    \    private int funds = 100;\n\n    public void deposit(int money){\n       \
    \ synchronized (this){\n            funds += money;\n        }\n    }\n\n    public\
    \ synchronized void withdraw(int money){\n        if(funds > money)\n        \
    \    funds -= money;\n        }\n    }\n}\n```\n\n`synchronized` exists in Java\
    \ to allow multiple threads which can both see an object to safely access it to\
    \ ensure that the data is correct. The classic example is that of the bank account.\
    \ Imagine if you remove the synchronisation from the above example. Thread one\
    \ attempts to remove 100 from the account. At the exact same time, Thread two\
    \ attempts to remove 100 from the account. For both threads when checking if there\
    \ are sufficient funds the `if` statement returns true, resulting in the both\
    \ withdrawing and a resultant balance of -100 which is not allowed. By using `synchronized`\
    \ only a single thread can access the section of code in the `synchronized` block,\
    \ which can help us to ensure correct state.\n\nWhen a `synchronized` keyword\
    \ is placed on a method such as on `withdraw(int money)`, it has the same effect\
    \ as wrapping all of a methods code in `synchronized(this)` (which is the case\
    \ in the `deposit` method in the example). If any Thread tries to execute any\
    \ `synchronized` method on the object it will be blocked.\n\n# Q: What are the\
    \ downsides of using synchronized? How can we avoid or mitigate them?\n\n`Locks`\
    \ are slow. Really slow. Particularly when using the `synchronized` keyword, it\
    \ can have a huge effect on performance. The reason for this is explained wonderfully\
    \ in a paper `LMAX` created on how they built `Disruptor`, a super low latency\
    \ concurrency component.\n\nIt is a brilliant read for anyone who wants to get\
    \ into the fine details of threading and `mechanical sympathy`. You can access\
    \ it at http://lmax-exchange.github.io/disruptor/files/Disruptor-1.0.pdf.\n\n\
    > “Locks are incredibly expensive because they require arbitration when contended.\
    \ This arbitration is achieved by a context switch to the operating system kernel\
    \ which will suspend threads waiting on a lock until it is released. During such\
    \ a context switch, as well as releasing control to the operating system which\
    \ may decide to do other house-keeping tasks while it has control, execution context\
    \ can lose previously cached data and instructions. This can have a serious performance\
    \ impact on modern processors.”\n\nYou don’t need to learn the contents of the\
    \ details of the quote; it should be sufficient to say that along with the impact\
    \ of threads being blocked whilst they wait for a resource, there is an impact\
    \ at an OS level which causes huge performance damage. In the same paper an experiment\
    \ is carried out to see the impact on latency of different types of lock; without\
    \ locking the process took 300ms, whereas with 2 threads contesting a lock it\
    \ took 224,000ms. Getting threading right is hard but getting it wrong has huge\
    \ consequences.\n\nIf you insist on using `synchronized` then minimising the size\
    \ of the code block that is `synchronized` is a good start. The smaller this is\
    \ will help to minimise impact. Even better, you can lock on specific objects,\
    \ or use a lock object if using a primitive, so that the entire object does not\
    \ need to be contended.\n\n```java\npublic class Bank {\n    private int funds\
    \ = 100;\n    private Object fundLock;\n\n    private UserDetails details = new\
    \ UserDetails();\n\n    public void deposit(int money){\n        synchronized\
    \ (fundLock){//Lock Object needs to be acquired to update funds\n            funds\
    \ += money;\n        }\n    }\n\n    public void createUsername(){\n        synchronized\
    \ (details){//Lock on the details object mean that the details object will block,\
    \ but Bank will not.\n            details.setName(\"Bob\");\n        }\n     \
    \   System.out.println(\"His name is Bob\");\n    }\n}\n```\n\nIdeally though\
    \ we want to avoid `synchronized`.\n\n# Q: What other options do we have for creating\
    \ Thread safe code?\n\nAs previously discussed, making a variable `volatile` is\
    \ more performant and less complex. However Java has a number of classes that\
    \ aid us with threading so that we can do it in an efficient way.\n\n# Atomic\
    \ Classes\n\n# Q: What is CAS? What benefits does it have over Synchronized?\n\
    \nJava has a number of `Atomic` classes including `AtomicInteger`, `AtomicDouble`\
    \ and `AtomicBoolean`. These are completely thread safe and do not involve locking,\
    \ but instead use Compare and Swap (`CAS`) operations. A `CAS` operation is an\
    \ atomic one (as in, it happens as one single operation) where during an update\
    \ we check that the field value has not changed from when we decided to update\
    \ it (it hasn’t been modified by another thread) and if so sets the value to the\
    \ new amount. This is exceptionally quick; `CAS` is actually an operation available\
    \ on most processors and no blocking is required. It is still slower than single\
    \ threaded (the LMAX experiment concluded it was 100x slower) but it is the best\
    \ available away ensuring thread safe access to values.\n\nIt is important to\
    \ understand the difference between `volatile` and `CAS`. if you try and perform\
    \ any operation that uses the original value it will render the `volatile` keyword\
    \ useless. For example, `i++` breaks down into `i=i + 1`. In the time between\
    \ `i` being read (`i + 1`) and it being written (`i = result`) another thread\
    \ can jump in between and update the value. Because the `Atomic` classes checks\
    \ and writes values as an atomic operation, it is a much safer option.\n\n# Immutability\n\
    \nImmutable objects are brilliant. An immutable object is an object whose state\
    \ cannot be changed after creation. By this definition all immutable objects are\
    \ thread-safe.\n\nProgramming to use immutable objects can be difficult and is\
    \ a paradigm shift from standard Object Oriented Programming. Functional languages\
    \ like Scala make heavy use of immutable objects which allows them to scale well\
    \ and be highly concurrent. The more we can rely on immutable objects the less\
    \ threading we will need.\n\n# Thread methods\n\n# Q: What does yield() do?\n\n\
    The `Thread` class has a whole bunch of methods on it which you need to know for\
    \ your interview. Interviewers love testing people on their ability to remember\
    \ the details around these methods. It is best to read up on them before an interview.\n"
