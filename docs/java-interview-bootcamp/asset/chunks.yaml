  trans: '

    移除对象时也是如此；其之后的所有对象引用都必须向前移动一个位置。有一种更糟糕的情况。在创建 `ArrayList` 时，它会从一个固定长度的 `Array`
    开始（你可以在构造函数中设置其长度，默认为 10）。如果容量需要超过此范围，集合必须创建一个长度更长的新数组，并将所有引用复制到其中，这可能会非常慢。


    `ArrayList` 的成功之处在于访问速度；由于数组位于连续内存中，这意味着如果你请求 1000 个对象中的第 999 个，你可以精确地计算出该引用在内存中的位置，而无需遍历整个集合。这提供了常数时间访问，速度非常快。


    所以，如果你有一组不太可能被大幅修改的数据，并且需要快速读取访问，那么 `ArrayList` 是一个很好的选择。


    # Hash 的实现


    ### 示例：HashSet, HashMap

    `HashMap` 本身就是一个复杂的野兽，作为面试题是一个很好的选择，因为它很容易添加扩展问题。


    **Q：`HashMap` 是如何工作的？**


    **Q：为什么键的 `hashcode` 很重要？**


    **Q：如果两个对象具有相同的 `HashCode` 会发生什么？**


    **Q：如果发生冲突，`Map` 如何选择正确的对象？**


    有趣的是，`HashSet` 是由 `HashMap` 支持的，所以为了本文的目的，我将只讨论后者。`HashMap` 的工作原理如下：在底层，`HashMap`
    是一个引用数组（称为 `Entry Table`，默认有 16 个条目），指向一组 `LinkedLists`（称为 `Buckets`，桶），其中存储了
    `HashEntry`s。`HashEntry` 是一个包含键和关联对象的实例。


    ![](img/index-45_1.jpg)


    所有 `Object` 实例都有一个方法 `hashCode()`，它返回一个 `int`。`hashcode` 通常是根据对象的属性派出的值。从对象返回的
    `hashcode` 应该是一致的，且相等的对象必须返回相同的 `hashcode`。这个属性可以用来根据条目表的索引来决定将其放入哪个桶中；例如，在上面的示例中，条目表有
    4 个空间，如果我有一个 `HashCode` 为 123456 的键，我可以执行 `12345 % 4 = 1`，所以我将我的对象放在桶 1 中。


    这使得对象检索变得非常快。在我的示例中，如果我尝试为我的键检索对象，那么我只需要执行相同的模运算来找到桶，它就是第一个条目。极快。


    这可能会变得更复杂。如果我有另外两个对象，`HashCode` 为“5”和“9”呢？它们的模（模 4）都是 1，所以它们都会被放入桶 1 中。现在当我使用我的“9”键来检索对象时，`HashMap`
    必须遍历一个 `LinkedList`，对每个 `HashEntry` 的键调用 `.equals()`。


    ![](img/index-46_1.jpg)


    这太慢了！幸运的是，这种情况不会经常发生。虽然冲突自然会发生，但意图是让对象均匀地分布在条目表中，使冲突最小化。这依赖于一个实现良好的 `hashcode`
    函数。如果 `hashcode` 很糟糕（例如，始终返回 0），那么你就会遇到冲突。


    为了进一步尝试减少这种概率，每个 `HashMap` 都有一个“负载因子”（默认为 0.75）。如果条目表的填充程度超过了负载因子（例如，如果条目表超过 75%
    有条目），那么类似于 `ArrayList`，`HashMap` 将将条目表的大小翻倍并重新排列条目。这被称为重希（rehashing）。


    # 树的实现


    ### 示例：TreeMap, TreeSet

    `Tree` 实现与我们之前考虑的任何数据结构都完全不同，并且复杂得多。它基于红黑树，这是一种复杂的算法，你不太会被问到（如果你真的感兴趣，可以看 http://www.csanimated.com/animation.php?t=Red-black_tree）。值以有序的方式存储，这种顺序由对象的自然排序决定，或使用作为构造函数一部分传递的
    `Comparable` 决定。这意味着在所有实现中，集合都将重新排序以维护这种自然顺序。在检索项目时，必须遍历树，对于大型集合，可能需要遍历大量节点。从你的角度需要注意的重要点是：这比
    `HashMap` 慢。慢得多。如果目标是速度，请始终使用 `HashMap` 或 `HashSet`。但是，如果顺序很重要，那么 `TreeMap/TreeSet`
    应该是你的集合之。


    # 多线程与集合


    集合与线程在本质上是关联的；许多与线程相关的核心问题涉及共享数据访问。我们如何以快速且安全的方式从多个线程访问数据？


    ## 如何创建一个线程安全的集合？


    让某个东西线程安全的简单方法是使其不可变。不可变对象是指状态无法更改的对象。如果它不能改变，那么所有线程读取它都是安全的，没有任何问题。这在 Java 中可以通过通过
    `Collections.unmodifiable` 方法实现。


    ```

    1 Collections.unmodifiableCollection

    2 Collections.unmodifiableSet

    3 Collections.unmodifiableSortedSet

    4 Collections.unmodifiableList

    5 Collections.unmodifiableCollection

    6 Collections.unmodifiableMap

    7 Collections.unmodifiableSortedMap

    ```


    所有这些集合都是对标准集合的包装，并保证访问安全；任何修改集合的尝试都会导致 `UnsupportedOperationException`。然而，这只是数据的一个视图。


    ```

    1 LinkedList<String> words = new LinkedList<>();

    2 words.add("Hello");

    3 words.add("There");

    4 List<String> unmodifiableList = Collections.unmodifiableList(words);

    5 System.out.println(unmodifiableList);

    6 words.add("Cheating");

    7 System.out.println(unmodifiableList);

    ```


    8 *结果:*

    9 *[Hello, There]*

    10 *[Hello, There, Cheating]*


    作为结果，这并不是不可变的。像 `ImmutableList` 这样的东西存在 Google Guava 等第三方库中，但在核心语言中没有。还需要注意的是，不可变集合通常不能满足我们程序的需求；数据通常需要读写，所以我们需要更大的解决方案。


    Java 5 引入了 `java.util.concurrent` 包，其特定目的是让以线程安全的方式处理集合变得更容易。


    **Q：介绍一下 Java 5 中引入的 java.util.concurrent 包。**


    **Q：它为什么很重要？它有什么意义？**


    写 Java 的那些人比你或我聪明（或者应该是这样的）。不需要每个人都自己写一个实现来确保线程安全，在不破坏性能的情况下正确锁定的地方，`java.util.concurrent`
    提供了许多集合类型，以最小的性能影响保证线程安全。


    它还引入了许多其他酷的线程功能，这些将在线程章节中介绍。


    ### 队列


    ConcurrentLinkedDeque


    ConcurrentLinkedQueue


    LinkedBlockingQueue


    LinkedBlockingDeque


    LinkedTransferQueue


    PriorityBlockingQueue


    ArrayBlockingQueue


    那真多的队列（以及双端队列 deque）！需要注意的关键点是：阻塞队列在队列为空/满时会阻塞消费者/生产者。这是允许生产者/消费者模式的必要机制。`BlockingQueue`
    接口有 `put()` 和 `take()` 方法来实现这种操作。


    Transfer 队列是一种阻塞队列，具有额外的方法允许消费者等待消息被消费。


    优先级队列根据元素的自然排序或使用构造函数时传递的比较器对元素进行排序。

