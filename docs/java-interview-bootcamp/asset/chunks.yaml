    In this example if we did not have the thread.join() the application will exit
    without printing anything out. The join() call effectively makes the call synchronous;
    it want’s the Thread to finish before proceeding.


    **Object methods**


    **Q: What do wait(), notify() and notifyAll() do?**


    **Q: Why must they be called from a synchronised block?**


    **Q: What alternatives are there to these?**


    **wait(), notify() and notifyAll()** are used as a means of inter-thread communication.
    When acquiring a lock on an object it may not be in the required state; perhaps
    a resource isn’t set yet, a value isn’t correct. We can use wait() to put the
    thread to sleep until something changes. When that something does change, the
    awaiting clients can be notified by calling notify() or notifyAll() on the object
    that is being waited for. If all of your waiting threads could in theory take
    action with the new information then use notifyAll(). However if there is a new
    lock to be acquired (so only one waiting Thread can take action), then call just
    notify().


