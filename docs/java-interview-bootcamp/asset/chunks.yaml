  trans: "\n\n类可以被认为是一个模板；它定义了 `Object`（对象）的结构，特别是它将包含哪些字段和方法。对象被认为是类的实例——其中字段包含数据。例如，一个\
    \ `TShirt` 类可能有一个 `colour`（颜色）和 `size`（尺寸）属性。一个 `TShirt` 对象可以拥有红色的 `colour` 和\
    \ XL 的 `size`。可以存在许多该对象的实例，它们的字段值可以不同也可以相同。\n\n## Q: 解释抽象、封装、继承和多态\n\nJava 的核心特性之一是抽象和继承。继承允许创建一个类，该类将拥有另一个类相同的字段和方法（可能还更多），并且被视为相同的类型。例如，`Car`（汽车）有四个轮和一个引擎。通过继承，我们可以创建一个\
    \ `TeslaCar`（特斯拉汽车），它仍然是一个 `Car`，但具有额外的字段（如酷炫的触摸屏），或者一个 `FormulaOneCar`（方程式 1\
    \ 汽车），它也是一辆汽车，但有一个用于尾翼的额外字段。这为我们提供了两个特殊功能：\n\n- 如果我有一个汽车列表，我想看每辆车是什么颜色的，我不在乎它是\
    \ `TeslaCar` 还是 `ForumlaOneCar`。我只想调用 `Car` 的 `.colour()` 方法。因为 `TeslaCar` “是一个”\
    \ `Car`，我们知道它可以使用这个方法。\n- 如果我们继承的 `Class`（类）已经有了方法的实现，我们就不需要自己写它（尽管如果我们想写也可以写）。\n\
    \n在子类中定义或重写方法实现的能力导致了多态。在执行方法时，使用的实现不是变量类型指定的，而是变量实例的。\n\n```java\npublic static\
    \ void main(String[] args) {\n    NumberPrinter numberPrinter = new EvenNumberPrinter();\
    \ \n    numberPrinter.printSomeNumbers();\n}\n\nprivate static class EvenNumberPrinter\
    \ extends NumberPrinter {\n    public void printSomeNumbers() {\n        System.out.println(\"\
    2468\");\n    }\n}\n\nprivate static class NumberPrinter {\n    public void printSomeNumbers()\
    \ {\n        System.out.println(\"123456\");\n    }\n}\n```\n\n尽管类型是 `NumberPrinter`\
    \ 类型，这也会打印出“2468”。这也是方法重写的一个良好示例，子类为其父类提供了一个不同的实现。可以使用 `super` 关键字在父类型上调用非抽象方法，例如，从\
    \ `EvenNumberPrinter` 的 `printSomeNumbers()` 中调用 `super.printSomeNumbers()` 是可以的：\n\
    \n```java\npublic void printSomeNumbers() {\n    super.printSomeNumbers();\n \
    \   System.out.println(\"2468\");\n}\n```\n\n这将导致：\n123456\n2468\n\n`Interface`（接口）是一个没有实现的\
    \ `Class`（类）。继续我们的类比，如果 `Car` 是一个带有 `.colour()` 方法的接口，这仅仅是指定所有的 `Car` 都有一个 `colour()`\
    \ 方法（而对如何实现它不做任何陈述）。你无法从接口创建对象，因为它没有实现或字段。\n\n`Abstract Class`（抽象类）是另一种类型的 `Class`。它可能包含一些尚未实现的方法（标记为\
    \ `abstract`），但它也可以包含一些已经实现的方法。`Abstract Classes`（抽象类）也不能用于创建对象，因为缺少某些实现代码。\n\n\
    对象只能基于完整的 `Class`（例如不是抽象类，也不是接口）进行实例化。在 Java 中，一个 `Class` 可以实现零个或多个接口，或者只能扩展零个或一个抽象或具体类。\n\
    \n封装是数据隐藏的原则。`Object`（对象）拥有它不希望其他对象修改的内部状态，因此它可以隐藏这些状态。在 `Object` 上可以访问的属性和行为只有创建者刻意暴露的那些。这在\
    \ Java 中通过访问修饰符来实现：`public`、`protected`、`private` 和 `default`（默认）。\n\n## Q: Java\
    \ 中有哪些不同的访问修饰符？它们意味着什么？\n\n- `public`：JVM 中的所有人都可以访问。\n- `private`：仅从类内部访问。\n\
    - `protected`：可相同包中的任何类或任何包中的任何子类访问。\n- `default`：当没有可见性修饰符时。仅可从同一包中的任何类访问。\n\n\
    ## Q: 说我们倾向于低耦合和高内聚是什么意思？\n\n这是面向对象编程（OOP）的核心设计原则之一。低耦合指的是不同组件之间的相互作用；这些可以是对象、模块、系统等任何级别。我们希望组件对其他组件的依赖非常有限。这使得重构和修改变得快速且廉价。这通常通过在组件之间创建整洁的接口并使用封装来隐藏内部实现来实现。低耦合是创建灵活且可维护系统的最重要的思想之一。\n\
    \n内聚指的是组件的实现；在高内聚的系统中，事物的构建方式使得相关的项放在在一起，而不相关的项分开。回到 `Car` 的类比，驾驶汽车的方法（如 `turn()`、`accelerate()`\
    \ 和 `brake()`）存在于 `Car` 上是合理的。它们是内聚的，并且属于在一起。另一方面，如果 `Car` 上有一个 `clean()` 方法，那么它将是不内聚的。汽车不会自己清洁；那是由其他东西完成的，也许是\
    \ `CarWash` 或 `Owner`。高内聚通过确保不属于在一起的字段放在更好的地方来实现。\n\n这些术语通常被放在一起，因为内聚系统通常更灵活且易于维护。\n\
    \n## Q: 方法重载和方法重写的区别是什么？\n\n在 Java 中，多个方法可以具有相同的名字。它们通过参数的数量、类型和/或顺序来区分。这被称为方法重载。重写是在子类中创建方法的不同实现。\n\
    \n## Q: 什么是构造函数？\n\n构造函数是一个与类名相同的特殊方法，例如 `Car` 类将有一个名为 `Car()` 的构造函数。构造函数不指定返回类型，因为它隐式地返回该类型的对象，在这种情况下是\
    \ `Car` 对象。它用于构建该类的实例。如果没有指定，将提供默认的公共无参构造函数。可以重载构造函数，所有的访问修饰符都可以应用于构造函数。如果你的类包含任何\
    \ `final` 字段，必须在构造函数结束时赋值，否则你的程序将无法编译。\n\n## Q: Java 中的 static 是什么\n\n使用 `static`\
    \ 关键字有效地声明某些内容属于类，而不是对象实例。静态变量被所有对象实例共享。静态方法属于类，这意味着它无法访问任何非静态字段值。它意味着它不能被重写。我们还可以静态代码块，它们在类加载到内存时执行：\n\
    \n```java\nstatic {\n    System.out.println(\"Hello!\");\n    //也许在这里初始化一些变量\n\
    }\n```\n\nstatic 也可以用于嵌套类。\n\n## Q: 说 Java 不支持多继承是什么意思？这是一件好事吗？\n\nJava 不能从超过一个具体或抽象类扩展功能。如果两个父类都有一个\
    \ `jump()` 方法，将不清楚调用者需要使用哪种功能。但我们可以实现多个接口，因为实现发生在我们实际的类中，所以这个问题不会发生。\n\n## Q:\
    \ 如果你想防止你的方法或类被重写，你应该怎么做？\n\n"
