    # Chapter 7


    ## Building Your First Android Game: A Hands-On Introduction (Let''s Get Coding!)


    Are you prepared to immerse yourself in the thrilling realm of developing games
    for Android? In this hands-on tutorial, we''ll guide you through the process of
    creating your first Android game using basic Java code and Android APIs. By the
    end of this tutorial, you''ll have a simple 2D game up and running on your Android
    device. Let''s get started!


    Step 1: Setting Up Your Development Environment


    Before we begin coding, make sure you have the following tools installed:


    1\. Android Studio: Download and install the latest version of Android Studio
    from the official website (https://developer.android.com/studio).


    2\. Java Development Kit (JDK): Ensure that you have JDK installed on your computer.
    You can download JDK from the Oracle website (https://www.oracle.com/java/technologies/javase-jdk15-downloads.html).


    Once you have installed Android Studio and JDK, launch Android Studio and create
    a new Android project.


    Step 2: Starting a fresh Android project.


    Follow these steps to create a new Android project in Android Studio:


    1\. Open Android Studio and select "Start a new Android Studio project" from the
    welcome screen.


    2\. Select the "Empty Activity" template for your project and then proceed by
    clicking "Next."


    3\. Configure your project settings, including project name, package name, and
    save location.


    4\. Click "Finish" to create your new Android project.


    Step 3: Designing Your Game Interface


    Now that we have set up our project, let''s design the user interface for our
    game. Open the `activity_main.xml` layout file and add the following XML code
    to create a simple game interface:


    ```xml


    <?xml version="1.0" encoding="utf-8"?>


    <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"


    xmlns:tools="http://schemas.android.com/tools"


    android:layout_width="match_parent"


    android:layout_height="match_parent"


    tools:context=".MainActivity">


    <SurfaceView


    android:id="@+id/gameSurface"


    android:layout_width="match_parent"


    android:layout_height="match_parent" />


    </RelativeLayout>


    ```


    In this layout, we have added a `SurfaceView` element with the id `gameSurface`,
    which will serve as the canvas for our game graphics.


    Step 4: Implementing the Game Logic


    Now, let''s write the Java code to implement the game logic. Create a new Java
    class named `GameSurface.java` and add the following code:


    ```java


    import android.content.Context;


    import android.graphics.Canvas;


    import android.graphics.Color;


    import android.graphics.Paint;


    import android.view.SurfaceHolder;


    import android.view.SurfaceView;


    The class GameSurface extends SurfaceView and implements SurfaceHolder.Callback.


    private SurfaceHolder holder;


    private Paint paint;


    public GameSurface(Context context) {


    super(context);


    holder = getHolder();


    holder.addCallback(this);


    paint = new Paint();


    paint.setColor(Color.RED);


    }


    @Override


    public void surfaceCreated(SurfaceHolder surfaceHolder) {


    // Start the game loop


    new Thread(new GameLoop()).start();


    }


    @Override


    The surfaceChanged method, which takes parameters SurfaceHolder surfaceHolder,
    int format, int width, and int height, is defined as follows.


    // Handle surface changes (not implemented in this tutorial)


    }


    @Override


    public void surfaceDestroyed(SurfaceHolder surfaceHolder) {


    // Stop the game loop (not implemented in this tutorial)


    }


    private class GameLoop implements Runnable {


    @Override


    public void run() {


    while (true) {


    if (!holder.getSurface().isValid()) {


    continue;


    }


    Canvas canvas = holder.lockCanvas();


    canvas.drawColor(Color.WHITE);


    canvas.drawCircle(canvas.getWidth() / 2, canvas.getHeight() / 2, 100, paint);


    holder.unlockCanvasAndPost(canvas);


    }


    }


    }


    }


    ```


    In this code, we have defined a custom `GameSurface` class that extends `SurfaceView`
    and implements `SurfaceHolder.Callback`. We use the `SurfaceHolder` interface
    to manage the surface of the `SurfaceView`, and the `Canvas` class to draw graphics
    on the surface.


    Step 5: Integrating the Game Surface into MainActivity


    Now, let''s integrate the `GameSurface` into our `MainActivity`. Open the `MainActivity.java`
    file and add the following code:


    ```java


    import android.os.Bundle;


    import android.support.v7.app.AppCompatActivity;


    public class MainActivity extends AppCompatActivity {


    @Override


    protected void onCreate(Bundle savedInstanceState) {


    super.onCreate(savedInstanceState);


    setContentView(R.layout.activity_main);


    GameSurface gameSurface = new GameSurface(this);


    setContentView(gameSurface);


    }


    }


    ```


    In this code, we create an instance of `GameSurface` and set it as the content
    view of our `MainActivity`.


    Step 6: Running Your Game


    That''s it! You''ve created your first Android game. Now, it''s time to run your
    game on an Android device or emulator.


    1\. Connect your Android device to your computer via USB, or launch an Android
    emulator.


    2\. Click on the "Run" button (green play icon) in the Android Studio toolbar
    to build and run your project.


    3\. Select your device or emulator from the list of available devices and click
    "OK."


    4\. Wait for Android Studio to install and launch your game on the selected device
    or emulator.


    5\. Once your game is running, you should see a red circle displayed on the screen,
    indicating that your game surface is working correctly. You can now start experimenting
    with adding more game elements, such as player characters, enemies, and interactive
    objects, to create a fully functional game.


