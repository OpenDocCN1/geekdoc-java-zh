    \n## Java Syntax Cheat Sheet\n\n### 1. Basic Syntax\n\n```java\n// Declaring Variables\n\
    int score = 0;\nString playerName = \"Player1\";\nfloat gravity = 9.8f;\n\n//\
    \ Conditional Statements\nif (score >= 100) {\n    System.out.println(\"You win!\"\
    );\n} else {\n    System.out.println(\"Keep playing!\");\n}\n\n// Loops\nfor (int\
    \ i = 0; i < 10; i++) {\n    System.out.println(\"Count: \" + i);\n}\n\n// Methods\n\
    void jump() {\n    // Code to make player jump\n}\n\n// Classes and Objects\n\
    class Player {\n    String name;\n    int health;\n    void takeDamage(int damage)\
    \ {\n        health -= damage;\n    }\n}\n```\n\n### 2. Data Types\n\n```java\n\
    // Primitive Data Types\nint score = 100;\nfloat gravity = 9.8f;\nboolean isAlive\
    \ = true;\n\n// Reference Data Types\nString playerName = \"Player1\";\nint[]\
    \ scores = {100, 200, 300};\n```\n\n### 3. Control Flow\n\n```java\n// If-Else\
    \ Statement\nif (condition) {\n    // Code to execute if condition is true\n}\
    \ else {\n    // Code to be executed in case the condition is not met.\n}\n\n\
    // Switch Statement\nswitch (expression) {\n    case value1:\n        // Code\
    \ to be executed if the expression is equal to value1.\n        Break:\n    case\
    \ value2:\n        // Code to be executed if the expression is equal to value2.\n\
    \        break;\n    default:\n        // Code to execute if the expression does\
    \ not match any case.\n}\n```\n\n### 4. Object-Oriented Programming\n\n```java\n\
    // Class Declaration\nclass Player {\n    String name;\n    int health;\n    void\
    \ takeDamage(int damage) {\n        health -= damage;\n    }\n}\n\n// Creating\
