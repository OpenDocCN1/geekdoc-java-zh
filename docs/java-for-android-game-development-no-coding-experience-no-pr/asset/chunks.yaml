    \ Player {\n    // Attributes\n    private String name;\n    private int health;\n\
    \    private int score;\n\n    // Constructor\n    public Player(String name)\
    \ {\n        this.name = name;\n        this.health = 100;\n        this.score\
    \ = 0;\n    }\n\n    // Methods\n    public void takeDamage(int damage) {\n  \
    \      health -= damage;\n    }\n\n    public void increaseScore(int points) {\n\
    \        score += points;\n    }\n\n    public String getName() {\n        return\
    \ name;\n    }\n\n    public int getHealth() {\n        return health;\n    }\n\
    \n    public int getScore() {\n        return score;\n    }\n}\n```\n\nIn the\
    \ above code snippet, we have defined a `Player` class with attributes such as\
    \ `name`, `health`, and `score`, along with methods to perform actions like taking\
    \ damage and increasing the player's score. This class serves as a blueprint for\
