    class. By doing so, the `Enemy` class inherits all the attributes and methods
    defined in the `Character` class, allowing for code reuse and establishing a hierarchical
    relationship between characters and enemies in the game.


    Encapsulation for Data Hiding and Modularity


    Encapsulation is a key principle of object-oriented design that involves bundling
