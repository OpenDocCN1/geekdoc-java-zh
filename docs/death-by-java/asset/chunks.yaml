    “It’s all right,” I said before turning my attention to the man who clearly wanted
    to go unnoticed. “Hi, Hugh. I’m surprised to see you here.”


    “Krissy.” He ran his fingers through his bangs, as if trying to stretch them out
    so they’d cover his face. “I was in the neighborhood and thought I’d check in
    to make sure Val was doing okay.”


    “He showed up right after I called you,” Valerie added. “I’m glad he did.” She
    flashed him a smile that was as appreciative as it was inappropriate.


    “Do you still want to talk?” I asked. “If not, I—”


    “No, I do.” Valerie picked up a tissue and tugged at its edges. “You know, I opened
    `Death by Java` because I wanted to give something back to the community. I thought
    the Village could use some high-class coffee. It’s why I chose `java` when it
    came to my store instead of plain old coffee, like you use. It’s just so much
    better, and I think the customers notice.”


    I bit the inside of my cheek to keep from saying something I might later regret.
    Knowing her, she probably believed everything she was saying.


    “But look at what’s happened!” she went on, tearing a small corner from her tissue.
    She looked at it as if shocked that it would dare to shred, then she balled the
    torn corner into the rest of the tissue, so as not to lose it. “Lyle hounded me
    day and night, threatening to have me closed down over nothing. And now … *this!*”


    “I knew he was no good,” Hugh said. “I told you as much the first day I saw the
    two of you together.”


    “But it’s … it’s … *Mickey!*** As if that explained everything.


    “I feel like I’m missing something here,” I said, head reeling from the sudden
    switch. “I thought we were talking about Lyle. Did something happen with Mickey?”


    “He’s avoiding me,” Valerie said with a petulant stomp of her sandaled foot. “Like
    I said on the phone, I was thinking about those questions you were asking about
    Mickey and what he’s been up to as of late. It got me thinking, and I realized
    there were quite a few nights when I had no idea where he was. I’d call him, and
    he wouldn’t answer his phone. Or if he did, he’d be all evasive-like, and he wouldn’t
    tell me where he was. I just assumed he was sleeping with one of his old girlfriends.”
    Spoken as if she couldn’t care one way or the other if he did. “But what if that’s
    not what he was doing at all?”


    “Where was Mickey the night Lyle died?” I asked.


    “I don’t know!” she wailed, pressing the balled-up tissue to her mouth. “I don’t
    know where he’s been the last few weeks, truth be told. He’s assured me it’s nothing,
    but what if it’s not? What if he killed Lyle? What if he thinks I know all about
    it and he’s going to come after me next? What if—”


    Hugh shot from his chair and rushed over to where Valerie was near hyperventilating.
    He gathered her into his arms and shot me a glare, as if it was my fault she was
    panicking. She let him hug her close as they sank back down onto the couch together,
    resuming the pose I’d noted through the window.


    “She’s very upset,” he explained when her sobs—real or exaggerated— eased. “Mickey
    meant a lot to her, and now he’s doing this. If I wasn’t such a gentle soul, I
    might have a word or two with him myself.”


    I found that hard to believe. Mickey could easily twist Hugh into a pretzel, and
    I was pretty sure Hugh knew it.


    “Has she talked to the police about any of this?” I asked.


    It was like I’d taken an electric prod to her. Valerie jerked upright so fast,
    the top of her head struck Hugh’s chin. His teeth *clack*ed together hard, and
    he just about fell off the couch when he recoiled. Valerie surged to her feet,
    then took a quick two steps my way.


    “You can’t tell them anything about what we talk about here!” she demanded. “They’ll
    arrest Mickey, and what will everyone think about me then? I’ll be a laughingstock.
    I won’t be able to show my face around town, and then where would I be?”


    *Alive*, I thought. “If you’re afraid he might have killed Lyle and that he’s
    coming for you, don’t you think the police *should* know?” I asked. “No one’s
    going to hold it against you if you’re the one who turned him in. In fact, they
    might call you a hero for it. Brave.”


    Valerie blinked as she thought about it. Yeah, I’d laid it on a bit thick, but
    honestly, if it made her do the right thing, it would be worth it. “I don’t know
    …”


    “Listen to her, Val,” Hugh said through semi-clenched teeth as he rubbed his jaw.
    “Better to let them know than to have him show up here in the middle of the night.
    I could always stay here tonight if it would make you feel better.”


    Valerie still appeared undecided, so I pulled my phone from my pocket and held
    it up for her to see. “Let me call them. I’ll wait with you for Detective McKensie
    to show up. You tell her what you told me, give her any other details you might
    have about Lyle and Mickey’s interactions with one another.”


    # 10


    Detective McKensie arrived alone. I stood at Valerie’s window and watched as she
    parked and unfurled herself from a car that appeared too small for her frame.
    She eyed my car, then Hugh’s, before making her way to the front door. She took
    everything in, right down to the parted curtain, without making it obvious that
    she was cataloging every sight and sound.


    *Detective Buchannan would love her*, I thought as McKensie knocked on the door.
    Valerie, who was already waiting, answered promptly and then led the detective
    into the living room, where Hugh and I were waiting.


    “Ms. Hancock,” McKensie said, nodding to me. She paused, glanced around the room
    with a slight frown. “Where’s Paul?”


    “At the beach with my dad,” I said, noting how she’d used his first name, while
    I was merely a ‘Ms.’ “After we’re done here, I’m hoping to join them.”


    “I see.” Her smile was flat, almost disapproving, before she turned to Hugh. “And
    you are?”


    “I’m Valerie’—”


    “Ex-boyfriend,” Valerie cut in. “Recently separated. I’m with Mickey now.” Her
    face reddened, and then a flare of panic shot through her eyes as she seemed to
    recall that she was currently afraid of Mickey Robbins.


    Detective McKensie eyed them both before asking Hugh, “Do you have a name?”


    “Uh, yeah.” A beat before he seemed to realized that she wanted to know it, then,
    “Hugh. Irwin. Hugh Irwin.” He cleared his throat. “Like the crocodile guy.”

