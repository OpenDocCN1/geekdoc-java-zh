    “The crocodile guy.” Not a question, but Hugh answered anyway.


    “Yeah, you know the one.” A nervous laugh followed. “He used to be on TV a long
    time ago. And I guess our first names are different, but I meant that our last
    names are—”


    “None of this is about Hugh,” Valerie cut in before Hugh could embarrass himself
    any further. “This is about Mickey.”


    “I see.” McKensie continued to watch Hugh, who was fidgeting and looking like
    he might be sick. “How about you and I have a chat, while these two wait in another
    room?” Her eyes flickered to Valerie, then back to Hugh. “I’d like to talk to
    everyone here before I let you all go.”


    Hugh paled. “I really should get going.”


    McKensie’s smile was all teeth. “This won’t take long.”


    “You can wait in the bedroom,” Valerie said to Hugh. “You know the way.”


    That caused McKensie’s eyebrows to rise. Hugh didn’t notice because he had already
    turned and scurried down the hall. The detective turned expectantly to me.


    “I’ll wait outside,” I said. I had no intention of going into Valerie Kemp’s bedroom
    with her ex-boyfriend. “I need to make a call anyway.”


    “Don’t go anywhere,” Detective McKensie warned.


    “I won’t.” I slipped past the two women and out the door into sunlight that felt
    a little too bright after the tense, gloomy aura hovering around Valerie. I took
    a moment to close my eyes and let the warmth seep through me before I sent Paul
    a quick text, letting him know that I hoped to be on the way within the next half
    hour.


    The reply was quick in coming: *Hope to see you there.* It was followed by a kiss
    emoji that had me smiling.


    I debated on sending him one back, but the thought that Dad might see it kept
    me from going through with it. Funny how no matter how old I got, I still felt
    like a kid when it came to keeping my personal life away from my dad.


    I tapped my phone against my palm as I considered what to do next. I mean, I knew
    what I *wanted* to do, but I wasn’t sure if I should. I didn’t want people to
    think I was a worrywart, but, well, if the shoe fit …


    I hit the call button and began chewing on my thumbnail as I listened to it ring.


    “Krissy? How’s California?”


    “Hi, Jules. It’s been good.” Jules Phan was the owner and operator of Pine Hills’s
    best candy store, Phantastic Candies. He was also my neighbor whom I’d tasked
    with keeping an eye on my cat while I was gone. “How’s Misfit doing?”


    Jules laughed. “Spoiled. He’s taking over your house to the point that I’m not
    sure you’re going to be able to move back in without his permission.”


    I smiled. “As expected.”


    “He tolerates me coming in to feed him, but as soon as that’s done, it’s like
    I don’t even exist. And if I tell him to get off the counter or try to move him,
    he becomes more obstinate than Maestro.” His white Maltese. “I’ve never known
    a cat who could dig his claws into a countertop and make himself feel at least
    a hundred pounds heavier like your kitty.”


    “So, he’s acting normal, then,” I said with a laugh.


    “He is. One sec.” His voice turned muffled, and there was a *clunk* that I assumed
    was his cash register. “Okay. Sorry about that.”


    “No, I shouldn’t have called. You’re at work.”


    “It’s all right. I could use the break.” He groaned, and I imagined him leaning
    against the counter, crossing legs adorned with one of his colorful outfits. “I’m
    surprised you called. I figured you’d be out sunning yourself somewhere with Paul.”


    “I plan on it,” I said. “In fact, I’ll be heading to the beach with him very soon.”
    I hoped. “It’s just …”


    “I get it. You want to know about Death by Coffee without anyone else finding
    out that you’re not enjoying your vacation because you’re too busy worrying about
    things beyond your control?”


    “Something like that.”


    Jules chuckled. “Vicki has everything under control. I’ve been stopping in as
    you requested, and while there have been some fluctuations in the electricity,
    nothing has gone boom or flat-out shut off for more than a second or two. At least,
    not while I was there.”


    “Does she seem okay?” I asked. “Vicki, I mean. I talked to her, but you know how
    she is.” *How I am*, was what I really meant, but he didn’t call me out on it.


    “She’s fine. We’re all okay. Really, Krissy, there’s no need to worry. The only
    person who seems upset by your absence—and don’t take this personally—is Rita.
    She’s been in here at least four times over the last two days, asking if I’ve
    heard from you. She said something about a video chat—”


    I groaned. “Yeah. With Dad. They had a nice little conversation the other night
    on his computer. Has she been trying to reach him again?”


    “She has. She thinks you’ve taken his tablet from him.”


    “What? I have not!”


    “I told her as much when I saw her this morning. She thinks you’re punishing her
    for some reason. Honestly, I think she’s just lonely. And we all know how she
    feels about your father.”

