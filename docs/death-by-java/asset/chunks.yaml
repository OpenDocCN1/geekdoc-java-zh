    I didn’t think that was it, but I let it go. Talking about it was only making
    me feel melancholy, like I’d left and the Village had moved on without me. *Which
    is the natural state of the world.* Weird how you never think about it like that
    until you’re confronted with it. “How’re things going with you and Dad?” I asked.


    Laura’s smile lit up her entire face. “Great, actually. There was a bit of a bumpy
    stretch when I moved into the house, but that was more because I felt self-conscious
    about it. He’s lived there for years, and here I was coming in, feeling as if
    I was trying to replace your mom.” She shook her head as her smile faded. “I know
    no one else saw it that way, but I couldn’t help it.”


    “Mom would be happy for him,” I said, and I meant it. “She wouldn’t have wanted
    Dad to be alone. She would have loved you.”


    Laura blinked rapidly and coughed into her hand, clearly overcome. It took her
    a moment before she could speak again. “We’ve talked about moving.” She glanced
    at me askance. “You know? Finding a place to start over that’s just ours? He’s
    the one who broached the subject, though I can tell he doesn’t really want to
    move.”


    My heart hiccupped. I hadn’t lived in that house for more years than I cared to
    admit, yet the thought of it no longer being Dad’s house made me feel as if I
    was about to lose my own home. Him moving meant that when I came back, I’d be
    staying somewhere else, somewhere unfamiliar. It wouldn’t be like coming home
    anymore.


    “And?” I asked.


    “And I don’t think a move would be good for him. There’re too many good memories
    for him there. And even if there weren’t, it’s a good house, in a good location.
    I feel at home there, and I know he does too.”


    Up ahead, downtown Redwood came into view. Most of the businesses were closed,
    or near closing, so traffic was minimal. There were still a decent number of pedestrians
    walking down the sidewalk, enjoying the pleasant night air, but most of them were
    out for ventures other than shopping. The bars and restaurants were all likely
    packed, and they would be until late in the evening, despite it being a weekday.


    Laura and I fell into a comfortable rhythm, legs and arms pumping. We weren’t
    power walking, but it wasn’t a casual stroll anymore either. I was handling it
    pretty well, thanks to my recent exercise routine, though my body was a little
    confused about the timing since back home in Ohio, I would be settling in with
    my orange long-haired cat, Misfit, for the night.


    “There’s a light on.”


    I looked toward where Laura was pointing.


    Death by Java did, indeed, have a light on inside, though it was faint. No one
    was outside the bookstore café other than a couple people walking by. Tito’s Deli
    was closed and completely dark next door, making the soft glow coming from inside
    Valerie’s place of business seem all the more curious.


    “Strange,” I said. “Maybe she’s fixing whatever it is that the health inspector
    was complaining about.”


    “Do you think you’re going to help her?” Laura paused at a crosswalk, then we
    crossed, putting us on the path to Death by Java. “She seemed pretty desperate
    when we left earlier.”


    “I’m not sure.” And I’d tried not to think too much about it.


    Since we were already headed that way, we continued toward Death by Java. There
    was no harm in having a little look, and it didn’t mean I planned on helping Valerie.
    I was, to put it bluntly, curious. A light on after closing wasn’t really all
    that strange. I’d been in Death by Coffee after hours countless times. And, really,
    it was still early, with darkness yet to fully fall.


    The door was locked, and a sign on the door proclaimed the bookstore café to be
    closed, as expected. The light was coming from the back room, its door propped
    open by something I couldn’t see from outside. The glow held steady for a couple
    of seconds before it shifted, causing the light to dim. A beat later, and it steadied
    once more.


    “That was odd,” Laura said.


    I made a noncommittal sound. I was getting weird vibes from the place. The movement
    of the light had reminded me of a flashlight, not an overhead bulb, though it
    was hard to tell since the back-room door was only open partway, and I couldn’t
    see anything beyond. As far as I knew, there was a desk lamp back there, and Valerie,
    or one of her employees, had walked in in front of it.


    “I come by here on my walks all the time, and I’ve never seen a light on inside
    this late before.” Laura cupped her hands around her eyes and peered through the
    glass.


    “We should probably go before someone thinks we’re trying to break in.” No one
    was paying us any mind, yet I was getting creeped out.


    Laura nodded, and we turned back the way we’d come.


    The walk back to Dad’s was uneventful and full of light chatter about plans for
    the next two weeks. Shopping and beach trips were heavy on the agenda, and I couldn’t
    say I was unhappy about that. Though, after our nighttime visit to Death by Java,
    I was thinking I might at least talk to Valerie and see what I could learn about
    her troubles.


