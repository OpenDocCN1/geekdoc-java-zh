  raw: 'McKensie hadn’t stepped into view, but I followed Peel’s directions and soon
    found myself in what I took for her office. The detective was seated behind a
    small, cramped desk cluttered with *stuff.* There was a Los Angeles Angels glass
    cup–turned–pencil holder. A scratched-up wooden box with a stack of folders on
    top. A stapler sat beside a wire hanger bent so that it was heart-shaped. More
    papers. More folders. And, oddly, a brand-new rolling pin was perched precariously
    on one corner of the desk.


    “Have a seat,” McKensie said, motioning toward the chair across from her.


    I clutched my purse close as I sat. “I’m sorry to drop in on you like this.”


    McKensie waved me off. “I assume you’ve learned something about the case or you
    wouldn’t be here. I’d rather you interrupt me than for you to keep whatever it
    is it to yourself.” She crossed her arms, leaned back in her chair. “So … spill.”


    I was surprised by how casual she was being. The softer tone put me at ease, which
    was probably the point.


    “Don’t be mad,” I said. “But I came across something that you’re going to want.”


    McKensie blinked once, didn’t otherwise react.


    *Quit procrastinating*, I told myself before reaching into my purse and removing
    Lyle’s tablet. I handed it over without a word.


    Detective McKensie took it with a frown. She turned it over in her hand twice
    before testing the power button. The screen didn’t so much as flicker. Whether
    it was because it was cracked or because the battery was dead, I had no idea.
    I hadn’t tried it when I’d gotten it, nor had I thought to plug it in before bringing
    it. She held it up toward me, brow raised in question.


    “I found it in Tito Adornetto’s trash.”


    McKensie heaved a sigh, then tossed the tablet onto her desk amid the rest of
    the clutter. “So, that was you?”


    “Pardon?”


    “Last night. We got a call about someone sneaking around a well-to-do neighborhood,
    going through people’s trash. That was you.”


    “I only went through Tito’s garbage,” I said. “And I only did it because I saw
    him throw the tablet away. I knew I had to do something.”


    “You could have called it in,” McKensie pointed out.


    “I could have, but I wasn’t positive that’s what he’d tossed. It could have been
    kitty litter for all I knew. Calling you seemed risky, so I figured I’d check
    to make sure it was the tablet.”


    “And when it was, you decided to what? Just run off with it?”


    I suppressed a wince. “Tito came back outside. I panicked.”


    Detective McKensie closed her eyes and rubbed at her temples. A long stretch of
    silence followed before she said, “Let me get this straight. You went to Mr. Adornetto’s
    house in the middle of the night to …?”


    “Check in on him?” It came out sounding like a question.


    She grunted, went on. “You just so happen to see him throw something away and
    decide to rifle through the garbage. You then find what is evidence against Mr.
    Adornetto as it pertains to the murder of Mr. Carrigan. Instead of calling me,
    you decide to take said evidence with you, keep it overnight, and then bring it
    to me this morning. Am I clear on the chain of events?”


    “Pretty much,” I said, unable to hide my wince this time. “Sorry.”


    McKensie mouthed, *“Sorry,”* back at me and then shook her head. “I don’t know
    what to think here.”


    “I know it doesn’t prove that Tito killed Lyle,” I said. “But he did have the
    tablet. I know I should have left it where it was, but like I said, he saw me,
    and I panicked. If I’d tossed it back into the trash, he would have taken it and
    hidden it elsewhere, maybe destroyed it. And there might be something on it that
    might provide a motive for Lyle’s death.”


    McKensie eyed the tablet a long moment before glancing up at me. “You’ve put me
    in a precarious position, Ms. Hancock,” she said. “I appreciate what you were
    trying to do, but I do wish you would have called me instead acting on your own.”


    “It won’t happen again.”


    McKensie still didn’t look happy as she stood. “I suppose I need to pay a visit
    to Mr. Adornetto and see what I can pry out of him. But first …” She picked up
    the tablet, weighed it in her hands. “I’m going to see if I can get this thing
    working. Hopefully you’re right and there’s something on here that will make everything
    else moot.” She leveled a finger at me. “You’d better hope this doesn’t cost me
    an arrest. I’d keep yourself busy with your family the rest of the time you’re
    here, if I were you.”


    I stood. “I plan on it.”


    When I left the police station, I felt a great sense of relief. Not only was the
    tablet off my hands, but Detective McKensie hadn’t arrested me. She wasn’t happy
    with me, of course, but I could live with that if my contribution ended up putting
    a killer behind bars.


    With my main errand completed, I drove to Death by Java to at least pretend to
    do what I’d said I was going to do. Tito’s Deli next door was open, and I wondered
    if Tito was inside or if the events of the night had him worried. If he’d killed
    Lyle, it could go either way. He might want to keep up appearances, since calling
    off work might seem suspicious. But at the same time, if he was worried that the
    tablet might lead to his arrest, he might already have packed his bags and be
    halfway to Mexico by now.


    The urge to poke my head inside Tito’s to see if he was there was strong, but
    I resisted it. Everyone would be waiting for me, so I needed to do what I’d come
    here to do and get back to Dad’s. I entered Death by Java, already planning my
    exit strategy if Valerie tried to talk me into sticking around for more than a
    few minutes, but I was caught off guard by a loud, excited voice.


    “Lordy Lou, I know!” Rita proclaimed. “I can see it just over your shoulder. It’s
    uncanny how similar they are. Look here. You see that? Almost identical!”


    Because the dining area was empty of all but one person, I zeroed in on the table
    at which Dad sat, tablet propped up in front of him. Rita Jablonski’s face was
    on the screen. Behind her, I could just make out the menu board at Death by Coffee
    and the top of Eugene Dohmer’s head, where he was serving a customer.


    “Very similar, indeed,” Dad said as I crossed the room behind him. “What amazes
    me is that the two of them didn’t get along when they were younger, and yet they
    both ended up following similar paths. I—” He glanced over as if he’d sensed my
    presence. “Oh! Buttercup. There you are.”


    “Dad.” I glanced at the tablet. “Rita.” I glanced around the room to find that
    neither Laura nor Paul were in attendance.


    “Your father told me you’d be here, dear.” Rita *tsk*ed. “I thought we could all
    have a nice little chat, but when he got here, you were nowhere in sight!”


    “I had something else I needed to do,” I said before turning to Dad. “What are
    you doing here? I thought you were going to the grocery?”


    “I was planning on it,” he said. “But then I got a message from Rita asking if
    we could chat. So …” He shrugged. “I had Laura drop me off.”


    “Really, dear,” Rita said. “I don’t know where you’ve been, but you should sit
    down and spend some time with your father.”


    “Did Paul ask why I wasn’t here yet?” I asked Dad instead of responding to Rita.


    “I saw you lingering outside the car before we left, so I assumed you had something
    else to do.” Dad’s eyes twinkled as he said it. “Let’s just say you’re covered.”


    I probably didn’t want to know, and before I could ask, Valerie appeared from
    the back. “Krissy! I’m glad you’re here. Something’s come up, and I’d like to
    talk to you about it if you have a second.”


    I sighed, resigned. “I’ll be right back.” I walked over to where Valerie stood
    next to a seemingly disinterested Farrah. “What’s up?”


    Valerie glanced at Farrah and then led me a few steps away. When she spoke, she
    kept her voice low. “I’m starting to worry,” she said. “I think I’m going to lose
    my employees if things don’t change.”


    “Is it about Lyle’s murder?”


    “No!” Valerie grabbed my arm, led me another step away. “Not so loud.”


    “Sorry.”'
