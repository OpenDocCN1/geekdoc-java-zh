  trans: '

    “他当时不知道该怎么办，”他笑着说道，“我真怕他会当场就把我抓了。幸他没那么做，因为我没法用合理的理由解释为什么我手里会拿着那只橡鸭。”


    “准备好了吗？”我问道，不想知道他指的是什么。


    “准备好了，”保罗说，还在为那个故事咯咯直地笑。


    “你们两个玩得开心点。”爸爸把车钥匙递给了保罗，“别做任何我不会做的事。”


    “这话可真没什么分量，”劳拉说道，“尤其是是在听完*那个*故事之后。”


    除了我以外，大家都笑了。不，我*真的*不想知道他刚才告诉了他们什么。


    保罗和我很快就上路了，他开车，我盯着副驾驶席的窗外，胃里紧张得翻江倒海。我以前从未想过参加同学聚会，虽然这次是非正式的，但我曾经认识过的人*会*出现在那里。


    当然，见到一些老朋友可能会很有趣。但我甚至不确定他们中是否有人会来。这很可能只是瓦莱里和她的朋友的聚会，而我和保罗被硬挤进去。那简直就像噩梦成真。


    *想想莱尔吧*，当保罗开车进入 Hooties 的停车场时，我提醒自己。他关闭引擎时，汽车的屏幕变暗了，留下我们坐在门上方那个刺眼的红蓝灯 Hooties
    招牌投射的光影里。停车场里停着几辆车，大概有十辆，这预示着不会像布雷预测的那样有五十多名老同学座无虚席。


    “我在里面应该期待看到什么？”保罗问道，打量着涂成近乎黑色的正门和窗户。透过它们什么也看不见。甚至连最微弱的光线或轮廓都没有告诉我们穿过那些深色屏障后在等着我们什么。


    “没什么太疯狂的，”我说，“我只进去过一次，但那是几年前的事了。那时候到处都是街机游戏和油腻的食物。它曾被认为是学校里所有酷孩子聚集的地方。从那以后可能已经变了，但我总觉得怀疑。”


    “它没……”他摇摇头，“算了。”


    我转过身面对他。“不，告诉我。你在想什么？”


    他脸上露出了尴尬的微笑。“我以前从外面见过像这样的地方。再加上这个名字，我只是认为那种色膜是因为里面的每一个人都不想让路人看到他们在做什么。”


    “噢。”我做了个鬼脸，“你真的觉得我会带你去那样的地方吗？”


    他坏笑。“那取决于你之后想从我身上得到什么。”


    在我们一起下车之前，我拍了拍他的手臂。这种轻快的开玩笑对我的神经起到了奇妙的作用，这可能正是他的意图。我挽住保罗的手，平复了最后的一丝紧张，我们一起进入了
    Hooties。


    ### 感觉就像回到了过去。


    自从我上次去那里以后，这些年什么都没有改变。空间被几十台街机游戏照亮了，每台机器都在用各种*哐当*声、*叮当*声和*撞击*声争夺注意力。散落在房间各处的扬声器里播放着流行摇滚。它试图盖过机器的噪音，但实际上只是增添了嘈杂。我们正对面是一个酒吧，由于那里经常出没青少年而非成年人，酒吧那里只提供可乐和雪碧水。


    就在那里，三三两两地像小圈一样聚在一起，那是布雷发起的同学聚会的参与者们——一共十二个人。


    布雷、塔玛拉和贝贝当然聚在一起。没有瓦莱里。没有米奇。在机器投射出的眩晕灯光中，附近站着几个我不认识的男人。我假设他们是同学，但如果是的话，我想不起他们的名字。酒吧另一端有一组五个女性，其中三个我认出是老同学。另外两个完全陌生，我不禁好奇是不是某些男人的妻子。


    “你准备好了吗？”保罗问。


    “你呢？”


    在我们回答之前，布雷注意到了我们。他的整张脸都亮了起来，对着空气挥手，仿佛在这个几乎空空的房间里看不到我。“克莉西！这边！”他转向其他人，“嘿，大家好！”和我穿过房间来到大家等候的地方时，所有的目光都转向了我们。我突然对手臂上的创可贴感到局促，我希望自己能找到其他不那么明显的方法遮住那些猫抓。在街机的灯光下，它们几乎在发光。


    “布雷，”当我们加入他们时，我说，“你记得保罗·达尔顿吗？”我甚至不确定前几天在 Death by Java 见面时是否正式介绍过保罗，但布雷的表现就好像他们是老友一样，他抓着保罗的手臂，脸上带着大大的、傻傻的微笑。


    “记得，记得，”他说，“我记得。基因。伙计们。”他招了招那群男人过来。“你们记得克莉西，吧？”


    “当然了。”当其中一个男人走过来时，他的名字在我脑海中响了起来。基因·里克特。他确实在我的班级，但我从未和他有过互动，甚至连路过打个招呼都没有。当布雷介绍他时，他伸出手握了我的手，又握了保罗的手。“你是那个让奥格特里老师被解雇的人。”


    “噢，我——”


    “不，那是他自找的，”布雷打断道，转向保罗，“克莉西在这里发现了学校的清洁工在地下室抽烟，她把他举报了校长。那家伙试图辩解。”


    “噢，我——”


    “不，那是他自找的，”布雷打断道，转向保罗，“克莉西在这里发现了学校的清洁工在地下室抽烟，她把他举报了校长。那家伙试图辩解。”


    “噢，我——”


    “不，那是他自找的，”布雷打断道，转向保罗，“克莉西在这里发现了学校的清洁工在地下室抽烟，她把他举报了校长。那家伙试图辩解。”


    “噢，我——”


    “不，那是他自找的，”布雷打断道，转向保罗，“克莉西在这里发现了学校的清洁工在地下室抽烟，她把他举报了校长。那家伙试图辩解。”


