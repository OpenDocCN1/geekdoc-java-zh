    “Nah, she was dating Robert Dunhill when she left,” Bray said, surprising me that
    he remembered since Robert and I met *after* high school. “They’re probably married
    by now.”


    “Actually—” Before I could tell them that Robert and I had broken up *before*
    I’d left, or that it was Vicki Lawyer now, the door opened, and Paul walked in.


    Seeing him was like a blast of cool, refreshing air. I hurried out from behind
    the counter and rushed over to him. When I grabbed his hand, I did so like a person
    desperate for saving, which, quite frankly, I was.


    I kissed him on the cheek before asking, “Where are Dad and Laura?”


    “They decided to walk back to the house, leaving the car to me.” He eyed the trio
    as he showed me the keys. Valerie, seemingly drawn by Paul’s appearance, rounded
    the counter to join her buddies. “Friends of yours?” he asked.


    “Of course, we are. From way back,” Bray said, smiling like he actually meant
    it. “Krissy was a lot of fun when we were younger.”


    *A lot of fun to pick on.* “Sorry, guys. I wish I could stay, but Paul and I have
    somewhere to be.”


    Both Bebe and Tamara didn’t appear to care, but Bray appeared disappointed. *Could
    he really think we were once friends?* I understood that not everyone was cognizant
    of their past behavior, but there was no way he could have forgotten the times
    I’d been close to tears due to their verbal abuse. Could he?


    “Ah, man,” he said with a shake of his head. “I was hoping we could catch up.”
    His eyes widened. “I know! How about you come to Hooties this Saturday night at
    like …” He looked to the others. When none of them jumped in with a suggestion,
    he finished with, “Eightish. I can let everyone know. We can make it an impromptu
