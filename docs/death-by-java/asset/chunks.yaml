    okay? Did they catch the killer?” If there *was* a killer.


    “No, not yet,” he said. He sounded both jazzed and weary at the same time. “There
    was a lot to process, and the police here were feeling a smidge overwhelmed. We’re
    all done at Death by Java. Gabby was appreciative of my input and asked me to
    come to the station with her to go over a few more things.”


    “Gabby?”


    “Detective McKensie. She’s driving us to the station now.” He cleared his throat.
    “I’m not sure how long this is going to take. I’m sorry.” A pause. “I could always
    tell her to drop me off if you want? I wasn’t thinking when I agreed to the ride-along.
    I kind of got swept up in the moment, I suppose.”


    I considered it, then said, “No, that’s okay. We’re watching a movie and figure
    we might just hang around the house for the rest of the day. Just make sure you’re
    back so we can go to the beach tomorrow.”


    “Of course. I wouldn’t miss it.”


    “I bought a special bikini, just for you.”


