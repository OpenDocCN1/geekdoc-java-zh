  trans: '


    “我做了，”我说。我的双腿在面前摊开，拒绝执行任何让它们活动的心理指令。“但不认为我*能做到*。”


    “那可走了好长的一路，”劳拉说，“连我都快累坏了。”


    在卫生部门停留之后，我们花了一天中的大部分时间在红木村（Redwood Village）到处乱跑，看了那里几乎所有值得看的地方。我们去哪里完全没有规律。尽管我们中四分之三的人并不是游客，但那里非常游客化。


    然而，这一切是那么完美。


    “去洗个澡吧，”我说，对他挥了挥手，“你洗完我再进去。”


    保罗点头朝浴室走走去，而爸爸瘫倒在窗边的椅子上。一天的最后一缕光透过略微敞开的窗帘洒了进来，很快就会消失。


    “我去做些柠檬水，”劳拉说，“我忙的时候，你们两个最好别去哪儿。”


    “我觉得你不必担心那个，”爸爸说。


    劳拉打了他他一眼，然后离开了。好奇心从她身上散去，但到为止，她还没有问我们今天早些时候陷入了什么麻烦。我希望她永远别这么问。


    “所以，”劳拉离开后爸爸说，“愿意分享一下？”


    “分享什么？”我问。


    爸爸踢掉自己的鞋，动了动穿着丝袜的脚趾。“你们去了莱尔（Lyle）工作过的卫生部门。你是想说那里没人什么都知道吗？”


    噢。是*那个*。“那里只有一个人一个人，”我说，“而且她并没有任何具体的线索。”我向他简要复述了我与贝利（Bailey）的对话。


    爸爸皱起眉。“她认为可能是某个同时能接触这两个地方的人？那会是谁呢？”


    “老实说？”我问道，“据我所知，没有。不同的员工，不同的建筑，不同的老板。”


    “这两个地方的客户会有某些交集，”爸爸自言自语道，“但客户是进不去后门的。”


    “而且莱尔是在下班后才被杀死的。”


    “一个维修工？”在我回答之前，爸爸摇了摇头。“不，这不合逻辑。如果是商场之类的，那也许吧，但不是不同的人拥有的独立建筑。”


    “还有罗马曼（Roman），”我说，“他似乎是镇上生意人很受欢迎的修理工。马可（Marco）用过他。瓦莱莉（Valerie）用过他。我想提托（Tito）也用过。也许罗马曼在工作时拿到了店里的钥匙并复制了。这样他随时都可以进去。”


    “但为什么要这样做呢？”爸爸问，“你觉得他提前计划了谋杀吗？”


    “不太像。”我叹了口气。“我不明白。也许我们完全看错了，被无关紧的信息分散了注意力。”


    “你什么意思？”


    在回答之前，我简单思考了一下。“因为莱尔和马可在一起工作，并不意味着这就是他被杀的原因。可能仅仅是米基（Mickey）对他生气并杀了他，因为是因为他提到了《Java
    之死》（Death by Java）并让瓦莱莉不快。他可能把他留在了后门，是因为他没有时间移动他。”


    “我们以前讨论过，”爸爸指出。


    “这并不意味着它无关紧，”我说，“但我仍然无法排除提托有莱尔平板电脑的事实。这不可能是巧合。但提托是怎么在下班后进入《Java 之死》后门的呢？”


    “瓦莱莉的员工里会不会有他的朋友？”爸爸问，“他们可能让他进去杀了莱尔，而没有意识到自己正在做什么。也许他请求他们留门没锁，这样他就能给瓦莱莉留个惊喜，或者之类的，而他们听从了，却没意识到正在陷害她去谋杀？”


    事情真的有那么简单吗？我深表怀疑，但我自己的理论也没有取得什么进展。我的意思是，如果爸爸说的是真的，那个员工现在应该已经告诉某人了吧？或者他们是害怕如果说出来，提托下一个就会轮到他们？


    我不知道。我一直在几个嫌疑人之间徘徊，每一个看起来都很有可能。米基和瓦莱莉。提托和马可。罗马曼。甚至艾伦（Aaron）和休（Hugh）在适当的情况下也像是可能的嫌疑人。


    但同时，我能想出同样多的理由说明他们中没有会这样做。米基和瓦莱莉不想把尸体留在营业场所。马可的计划实际上因为莱尔的死而泡汤了，为什么要杀他？艾伦和休不想冒险让瓦莱莉为谋杀案背锅。


    *但提托和罗马曼呢？*


    现在，那两个……除了道德和法律原因之外，我找不出充分、有力的理由来说他们没有没有犯罪。唯一的问题是，我看不出他们任何一个是如何杀了他并把他留在《Java 之死》里面的。


    我们又回到了原点。


    “我想门*可能确实*被留没锁，”我说。


    “什么门？”劳拉走进房间。她手里拿着一杯柠檬水。在她抿口之前转动杯子，冰块发出*叮当*声。


    爸爸和我交换了一个眼神，但当保罗走进房间时（头发还没洗完澡还是湿漉的），我们免于不得不承认我们正在讨论莱尔的谋杀案。


    “搞定了，”他说。

