    “你喜欢在‘死亡咖啡馆’工作吗？”我一边走一边问道。小巷里排满了垃圾桶。大部分都是关着的，而且保持得相对整洁，只有几个底部已经生锈，渗出恶心的液体流在地上。我希望奥斯卡（Oscar）离那些远一点。


    迪（Dee）看了我一眼，耸了耸肩。“我想是吧。这这是一份工作。我喜欢奥斯卡，我也喜欢早晨的咖啡味。”


    因为我察觉到了异样，于是问道：“但是呢？”


    “但我讨厌那些衣服。我讨厌不得不装得像个硅谷女孩或某个脑残的拉啦队员，因为那是瓦莱里（Valerie）认为那样才能吸引顾客。”她停顿了一下，“不是说我是在侮辱拉啦队员或硅谷女孩。”


    “没关系，我明白你的意思。”


    “而且我们也没在赚大钱。那件愚蠢的裙子是我用自己的钱买的。瓦莱里认识那个卖衣服的女人，让我们大家都从她那里订购。她可能拿了回扣。自从我买了那件东西，我觉得我必须在那儿继续工作，才能证明我付出的那些钱是值的。我又没法转头把它卖了。谁会穿那种东西呢？”


    我不会，这一点我很断定。


    “还有瓦莱里和她那没完的男人，”迪继续说道，似乎对倾诉自己的苦水乐于言辞。“我发誓，每当我抬头时，她都在对每一个进门的长得还凑的男人抛眉媚眼。已经到了这种地步，我不确定有没有哪个男人是她没在这个时候搭讪过的。她好像觉得他们的注意力就能证明她的存在价值。”


    我小心翼翼地，以免让自己看起来像是在打听——当然，我确实是在打听，“她做的就这些吗？对他们抛眉媚眼？”


    “奥斯卡！”迪叫道，发出了更多亲吻的声音，然后回答道，“谁知道呢？我总是在天黑前就离开那里了，所以谢天谢地，我不用看到发生了什么。早上看到证据就已经够糟糕的了。”


    “什么证据？”


    垃圾罐拿出来了，她还从另一个口袋里掏出一个小银勺子。她边敲着罐子边说：“别误会我，不是说这种情况经常发生。通常我只是在后后的地上发现一些东西，就像某人在做不该做的事时把它们从架子上撞下来一样。”她意味深地看了我一眼。“我还没发现过丢弃的衣服之类的东西，如果你是想那个的话。如果我真的发现了，那我就彻底受够了。”


    我无法想象如果我来到‘死亡咖啡馆’，发现某人的内裤躺在咖啡豆旁边我会怎么办。很可能得进行烟熏消毒。


    “你确定不是只是最后下班的人不粗心吗？”我问道。


    “不是。我曾问过法拉（Farrah）这件事，她告诉我她离开时一切都正常。不过，那天晚上米基（Mickey）和瓦莱里都在那里，我们推断出了一些事情。”她停下脚步转过来面对我。“这些话绝对不能传到瓦莱里耳朵里好吗？我知道她是你的朋友——”


    “我不是，”我打断了她，“我不会告诉她任何事的。保证。”


    迪咬着下唇，眼睛环视着四周。这一次，我不太确定她是否在寻找奥斯卡。“我百分之九十确定瓦莱里在对米基不轨，”她说，“他们那天晚上可能在一起，但还有其他晚上，我去跑晚晚的差事，路过时会看到她和其他男人在一起，通常是她的某个前男友。她并不知道我知道，所以……”


    我做了一个比划心口和封住嘴唇的动作。“你说你‘看到她和其他男人在一起’时，是什么什么意思？”


    迪考虑了一会儿才回答道。“我不是说我见过她和别人接吻之类的。那更多是一种感觉。你看到两个人在一起，你就知道他们之间一定有猫腻。”


    我明白了。看到瓦莱里和休（Hugh）以及阿伦（Aaron）在一起时也有同样的感受，这引出了我的下一个问题。“你见过她和谁在一起？我是除了休和阿伦。”


    迪打量了我一会儿，然后问道：“发生什么了？为什么‘死亡咖啡馆’关门了？”


    我纠结该告诉她什么，但选择了实话。这又不是什么秘密。如果她回家打开新闻，就会发现的。


    我正准备开口告诉她关于莱尔（Lyle）被杀的事，这时大楼通往小巷的门打开了，一个胡子垂到胸口大男人提着一袋垃圾走了出来。他怀疑地看了我们一眼，然后把袋子扔进垃圾桶。又是一个怀疑的眼神，接着他重重地走回室内。


    “我们可能该回去了，”迪叹了口气，“这样是找不到奥斯卡的。”


    我表示赞同。


    我们开始回‘死亡咖啡馆’，由于她没有追问这个问题，我以为对话已经结束了，但迪开口让我大吃一惊。


    “我不认为瓦莱里想伤害米基或她对他出轨的任何男人，”她说，“她只是不知道该怎么表现。她好像觉得她的外貌就证明了她的存在价值。”

