    someone you know could have committed murder, the evidence appears to point that
    way.”


    She crossed her arms, but I could tell she was wavering.


    “Lyle had to have gotten in here somehow,” I said. “Maybe someone showed up to
    let Oscar out, and in doing so, let Lyle in. Maybe Lyle forced the issue, which
    led to a scuffle. It could have been an accident.”


    “Or Lyle could have broken in.” There was no strength to her argument. She seemed
    to realize it, because she turned away, changed the subject. “I need to get back
    to work. I …” A cough. “I could use some help if you have a little time.”


    Her tone was so hurt, so frail, that it hit me like a gut punch. While none of
    this was my fault, I couldn’t help but feel responsible for her. Could I really
    leave her here alone to wallow in her worry and frustration?


    No, no, I couldn’t.


    “Sure. Let me tell Paul.”


    Valerie nodded and led the way from the back room.


    So much for a day with my family.


    # 14


    I wiped sweat from my forehead, then stepped back and looked over what I’d just
    done. The bookshelves were dusted, and the books themselves were upright, aligned,
    and sorted according to genre. Mostly. There was no way I was going to spend my
    entire day making sure everything was perfect, but a little organization would
    help customers find what they were looking for.


    If anyone ever came in, that was.


    My stomach grumbled, and I glanced at the time. It was just before noon, which
    meant I’d been there for a couple of hours. There were still things that could
    be done, but I felt as if I’d done my part. Dad, Laura, and Paul were waiting
    on a promised call when I was finished, and if I started in on something else,
    who knew when that would be.


    So, I went looking for Valerie and found her in the women’s restroom, leaning
    over the leaky toilet with a perplexed expression on her face. She flushed it,
    watched as water oozed from the base, then wiped it up with a ball of paper towels.


    “You’ll have to call someone for that,” I said. “It’s probably the seal, and it
    would be better to have a professional look at it.”


    Valerie stepped back, shot the toilet a disgusted look, and then walked over to
    the sink to scrub at her hands. “I was hoping it would just stop,” she said. “But
    I suppose I could always call Roman.”


    *Don’t, Krissy.* I desperately wanted to follow up on that and ask her about her
    relationship with the repairman, but now wasn’t the time.


    “I’m done out front,” I said instead. “There are a few more things that need to
    be done, but I figure you can handle them. I’m supposed to meet Dad for lunch.”


    Valerie’s back was to me, but I could see the annoyed expression that crossed
    her face in the mirror before she said, “Sure. Have fun.”


    I hesitated, torn. On the one hand, I really wanted to leave and spend the rest
    of the day with my family. On the other, I still felt guilty for … what? I wasn’t
    sure. Maybe I was just a sucker.


    “If I get a chance, I might stop back in later,” I said, deciding to meet myself
    halfway. “If you’re still here, I’ll try to get a few more things done.”


    Valerie continued scrubbing at her hands and didn’t respond. I left her to it.'
