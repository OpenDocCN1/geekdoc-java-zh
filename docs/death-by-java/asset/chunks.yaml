    “不过，我觉得有点不好意思，”他继续说道，语气稍微低了下去，“我并不太了解那个健康检查员，但我认识他妻子一点。我们几年前见过过几次面。”那副自傲的笑容又回来了，但在我的意识里几乎没有引起任何波澜。


    “他妻子？”我问，“莱尔（Lyle）结过婚？”


    “结过，”他说，“名字叫莉安（Leanne）。大约一个月前我修了他们的水泵。或者也许是两三周前。” 想起这里时，他的眼神变得有些空远，然后摇了摇头。“反正，我想也许她可能想再聚聚，你懂的，为了叙叙旧？”


    “好啊，”我说，“她感兴趣吗？”


    “不。她当时太心烦了。”


    “心烦？为了什么？”


    罗曼耸了耸肩。“我也不知道。她提到了关于她丈夫和他的工作。我想也许是因为他面临着高层的压力，要求他更努力之类的。那时，我的活也快干完了了，既然她又不想弄脏，我就等不及要离开了。我我已经约了另一份工作，那份工作在额外福利部门的前景要好得多。”


    *噢天哪。* 这个家伙太自以为了，他似乎没有意识到他的吹嘘在听起来既猥态又带有性别歧视。


    “之后你和她谈过天吗？”我问，设法让自己的声音里听不出厌恶，“或者和莱尔谈过？”


    还没等他回答，后门就开了，瓦莱里（Valerie）冲了出来，法拉（Farrah）紧跟在她后面。“罗曼！谢天谢地你在这儿了。我们需要谈谈。”


    “马上来，宝贝，”他说，然后转向我，“你知道的，如果你想多聊聊这件事，我们随时可以再见面。我认识这地方——”


    “不用了，”在他说完之前我就打断了他，“我已经有计划了。”


    他耸了耸肩，似乎对这种拒绝并不在乎。“如果你改变主意，可以在网上找到我的号码，”他说完，对着瓦莱里露出了灿烂的笑容。“我完全听你的，”他对她说道，她领着他走向了后方。


    “他太恶心了，”法拉说道，然后拿出手机，看都不看我就把我打发了。


    他确实很恶心。但尽管罗曼很恶心，但他并非完全没用。我们刚才的短谈让我获得了一个我之前没有过的重要信息。


    莱尔结过婚。


    不仅如此，他的妻子在他被杀前几周还心烦意乱。她是对莱尔不爽吗？气到要杀了他吗？还是完全因为其他什么事情？


    只有一个办法可以找到真相。


    “呼，”爸爸稍后走到了我身边，“我不确定自己能不能脱开身。。莉塔（Rita）一旦说起来，就停不下来了，对吧？”他停顿了一下，观察着我。“我错过了什么吗，小宝贝（Buttercup）？”


    我考虑过告诉他没什么，我们应该回家里去见劳拉（Laura）和保罗（Paul），但我*知道*我做不到。而且，现在还早。我们足够的时间在回到爸爸那里之前再去停留一个地方。


    “你愿意再进行一次实地考察吗？”我问他，在空中晃着他的车钥匙。


    爸爸笑着从我手里夺过钥匙，“告诉我想去哪儿就行。”


    莱尔和莉安·卡里根（Carrigan）的地址在网上并不难找。等爸爸和我上车时，爸爸已经提醒过劳拉和保罗我们可能会晚几分钟，而我已经把地址调到了导航屏幕上。爸爸按照指示行驶，没有问任何问题，尽管我感觉到他身上散发出阵阵好奇。


    卡里根一家住在一个安静的社区，那里的房子规模适中，但对我来说离得稍微近了点。没有人家的车库——只有路边停车，街道本身相当挤，除了几个标有残疾人标志的显眼空隙外。那些房子门都有通往前门的坡道。


    卡里根的房子没有那种坡道。我们在附近找到了停车位，从街道走到那块作为前门台的小块混凝土地。那里没有门铃，所以我敲了敲门。


    门几乎立刻开了，一个眼睛通红、留着浅褐色头发、身材瘦削的女性回答道。“什么事？”她问道，声音在每个字上都颤抖。


    “莉安·卡里根？”看到她点头，我继续道，“我是克西·汉考（Krissy Hancock）。这是我父亲詹姆斯（James）。我认识你丈夫莱尔。如果你有时间，我希望能和你简短聊聊。”


    莉安无言地侧开了身子。过去的几天里她可能见过各种各样的访客，多来几个又怎么？爸爸和我进了一间光线昏暗、充满一生回忆的房子。书籍、收藏品和各种*东西*填满了几乎每一个空间。所有的东西都擦了灰并保持整洁，但这赋予了房子一种生活气息、充满活力的感觉，让我的心微微作痛。


    莉安带我们来到一个小小的用餐角。桌子足够两个人坐下来舒服地吃饭，但再多就有挑战了。只有两把椅子。莉安示意我和爸爸坐，而她选择靠在门框上，双臂交叉防御姿态，仿佛她担心我们会告诉她一些她不想听过。


    “你们能来真好，”在我们坐好后她说，“莱尔是个好人，但他也有问题。”


    她叹了口气。“我们在一起度了很多时间，尽管我们并不交流。彼此陪伴就足够了。”她擦掉了眼泪。


    显然，我需要保持简短，让莉安·卡里根继续她的哀悼，但我不知道如何在不让她心烦的情况下问出我想问的问题。


    “我见到莱尔时，他似乎专注于工作，”我说，“他从未提到过他的家庭生活或工作之余的事。在和叫罗曼的人聊天之前，我甚至不知道他结过婚。”


    莉安的脸上闪过一刻刻薄的情绪，取代了她的哀伤。“我明白了。”

