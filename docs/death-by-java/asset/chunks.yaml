    Hugh had both hands on the wheel and was staring straight ahead. He looked nervous,
    which I suppose shouldn’t have been a surprise, considering. The fact that he
    wanted to talk to me so badly about the blocked numbers told me that I’d been
    right and he was responsible, at least partly.


    “Does she know?” he asked with a side-eyed glance my way.


    “About Mickey’s number being blocked? Yes. About who did it? Not yet.”


    Hugh’s shoulders sagged as he leaned back in his seat. “Okay. All right. Good.”


    “No, Hugh, it’s not good,” I said. “You blocked Mick ey’s number from her phone,
    and I assume you blocked hers from Mickey’s.”


    He winced, didn’t otherwise respond.


    “Why?” I asked, before shaking my head. “No, never mind. I know why. You still
    care about her.”


    He closed his eyes, nodded. “It wasn’t my idea.”


    Of course it wasn’t. “Aaron?”


    “Aaron,” he agreed before he took a deep, trembling breath. “None of this can
    get back to Val, okay? I’ll tell you everything, but you have to promise me that
    you won’t say a word to her.”


    “Hugh—”


    “*Please.*” He all but sobbed the word. “If you tell her, she’ll never talk to
    me again. Or Aaron. Neither of us could handle that. Mickey is all wrong for her,
    so it’s not like what we did is *bad* for her. If she stays with him, it will
    ruin her entire life. You know it as much as I do.”


    Sadly, from what I’d seen of Mickey and Valerie together, I tended to agree. But
    I also wasn’t so sure that either Aaron or Hugh was right for her either. I left
    my thoughts unsaid as I motioned for him to go on.


    Hugh studied me, then must have decided that my silence was as good as a promise,
    because he started speaking.


    “So, the day that …” He cleared his throat. “That night …”


    “After Lyle was killed,” I supplied.


    “Yeah. That.” He shuddered. “You came in that day. Val and Aaron and I were there.”


    “I remember.”


    “After you left, the three of us were sitting at the table, talking about everything.
    She mentioned a few things about Mickey that rankled me a bit. Aaron too. Well,
    eventually Val got up to use the restroom. She left her phone sitting there, which
    is when Mickey tried to call. Aaron and I let it go to voicemail because, why
    wouldn’t we?” He rubbed his hands across the steering wheel. “That’s when Aaron
    got the idea.”


    “To block Mickey’s calls?”


    “We knew they were having it rough, and with the murder, things were going to
    get even tougher. We didn’t know if he’d come around, but we figured it couldn’t
    hurt to minimize their contact. Like I said, Aaron’s the one who had the idea.
    I knew Val’s passcode. It was simple, really. A few swipes and done.”


    “And Mickey’s phone?”


    “That was all Aaron,” he said. “I don’t know how he did it, but he managed to
    get ahold of it and block her. Mickey’s so dim, Aaron probably asked to make a
    call or something and he handed the phone right over.”


    I frowned. Mickey had been making himself scarce, yet Aaron had found him? Interacted
    with him, even? All while even the police were having a hard time locating him?
    “Do you know when he did it?”


    “No clue. That night, maybe?” Hugh shrugged. “Does it really matter? Once the
    numbers were blocked, both Aaron and I did our best to make ourselves available
    to Val. We both wanted to be there for her, to make sure she understood that no
    matter what, we’d do what was right for her. We’d let her decide who between us
    she thought was best.”


    “Like a competition?” I asked, unable to keep the mild disgust out of my voice.
    They’d treated her like a prize to be won.


    Hugh heaved a sigh, laughed, seemingly oblivious to my disdain. “I suppose it
    was. We figured that once Mickey was out of the way, Val would choose one of us
    to replace him. We were both there for her. She’d been with each of us once before,
    so why not try again? It made sense.”


    “What about Roman?” I asked. “Couldn’t she have chosen him instead?”


    Hugh snorted. “Roman? The repairman? No, she wouldn’t have chosen him, even if
    he was the last guy on earth. She has no interest in him. He can’t be trusted.”


    *Like you can?* “Do you really think she’d choose you?” I asked, genuinely curious.


    “Of course.” Hugh squared his shoulders, tried to look regal. “I’m the one who
    knows her best. I can give her everything she wants without having to stoop to
    underhanded tactics.”


    I wanted to point out that blocking Mickey’s number *was* an underhanded tactic,
    but I let it go. “You were with her the night before the murder,” I said instead.
    “She said that the two of you only talked.”


    “We do that,” he said with a sharp nod. “That’s what gives me the advantage. Val
    can talk to me. Aaron and Mickey and all the others? They’re just muscle. They
    don’t have the brains.” He tapped the side of his head. “We talked that night
    like we have so many other nights. We even went back to her place together to
    continue our conversation, since she never likes staying at Death by Java past
    closing. It was almost romantic.” He smiled in a way that said more than words
    how much it had meant to him.


    I started to ask another question, but then I realized what he’d just said. “You
    left at closing time? You didn’t stay late? Spend time in the back with the backroom
    light on?”


    Hugh shook his head. “I told you—she doesn’t like being there after dark. Once
    the last customer left, we stayed for maybe ten minutes more, and then we left.
    It was still light out. I don’t know who was there that night after we left, but
    I can tell you for sure, it wasn’t us.”


