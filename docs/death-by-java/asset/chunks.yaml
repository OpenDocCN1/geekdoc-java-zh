  trans: '


    我不认为事情就是那样，但我还是把它放下了。谈起这些只会让我感到忧郁，就好像我离开了，而这个村庄在没有我的情况下继续运转。*这本就是世界的常态。* 奇怪的是，在你直面这种事实之前，你永远不会那样想过它。“你和爸爸最近怎么样？”我问。


    劳拉的笑容点亮了她的整张脸。“其实很好。我搬进那间房子时确实经历过小波折，但更多是因为我对此此感到很局促。他在那里住了多年了，而我却搬进来，感觉自己像是在试图取代你妈妈。”她笑着摇头，笑容消失了，“我知道没有别人会那样想，但我控制不住。”


    “妈妈会为他感到高兴的，”我说，我是发真心的，“她不希望爸爸孤单。她会喜欢你的。”


    劳拉快速地眨着眼睛，用手捂住嘴咳嗽，显然被触动了。她沉默了一会儿才再次开口。“我们谈过搬家的事。”她意味性地看了我一眼，“你知道的吗？找一个完全属于自己的地方重新开始？虽然是他提起这个话题的，但我看得出来他其实并不想搬。”


    我的心咯噔了一下。我在这房子里住的时间比我愿意承认的要多，但一想到那里不再是爸爸的房子，我就觉得好像要失去我自己的家了。他的搬家意味着当我回来时，将住在另一个地方，一个陌生的地方。那里将不再像是家了。


    “然后呢？”我问。


    “我不认为搬家对他有好处。那里有太多的美好回忆了。即使没有，那是一间好房子，位置也很好。我觉得那里像家一样，我知道他也是。”


    在前方，红木城市中心映入眼帘。大多数商店已经关门或临近营业，所以交通流量稀少。人行道上还有相当数量的行人，享受着舒适的夜空气，但他们大多数人是为了购物以外的目的出来。酒吧和餐厅可能都坐满了，尽管是工作日，它们也会持续到深夜。


    劳拉和我进入了一种舒适的节奏，双腿手臂摆动。我们不是在快走，但也再也不是随意的散步了。多亏于最近的锻炼习惯，我应得还可以，尽管我的身体对这个时间有点困惑，因为在俄亥俄州的家里，此时我应该正和我的橘色长毛猫“不合群”度过夜晚。


    “那里开着灯。”


    我朝劳拉指向的地方看去。


    Death by Java 内部确实开着灯，尽管光线很弱。书店咖啡馆外除了几个路过的人，没有人在外面。隔壁的 Tito 熟肉店已经关门了，一片漆黑，这让从瓦莱莉店里透出的柔和光芒显得更加奇怪。


    “奇怪，”我说，“也许她正在修理卫生检查员投诉的某些东西。”


    “你打算帮她吗？”劳拉在斑马线处停下，然后我们穿过马路，走在通往 Death by Java 的路上。“我们之前离开时，她看起来很绝望。”


    “我不确定。”我试着不想太多。


    既然我们已经朝那边走了，我们就继续向 Death by Java 走。看一眼并无大碍，并不意味着我计划帮助瓦莱莉。坦白地说，我很好奇。闭门后开灯其实并不怎么奇怪，我无数次在下班后待在
    Death by Coffee。而且，真的，现在还早，黑暗尚未完全降临。


    门锁着，门上的告示牌如预期所，显示书店咖啡馆已打烊。光线是从后屋传来的，门被某种我从外面看不见的东西顶着。光芒稳定了几秒钟，然后发生了偏移，导致光变暗。片刻后，它再次稳定了。


    “真奇怪，”劳拉说。


    我发出了一个含糊的回应。我感觉到那个地方很诡。灯光的移动让我想起了手电筒而不是顶灯，尽管很难判断，因为后屋的门只开了一部分，我看不到里面的情况。据我所知，那里有一盏台灯，瓦莱莉或她的某个员工曾走过它面前。


    “我散步时经常经过这里，但从未见过在这么晚开着灯。”劳拉双手聚在眼睛前，透过玻璃向内窥。


    “我们也许该走了，免得别人以为我们在闯入。”没有人理我们，但我感到心里发毛。


    劳拉点了点头，我们沿着原来的路往回。


    回爸爸家的路上一帆风顺，充满了对未来两周计划的闲聊。购物和海滩之游是议程上的重点，我不能说我对此不开心。不过，在晚上造访了 Death by Java 之后，我在想至少可以和瓦莱莉谈谈，看看能从她的麻烦中了解到些什么。


    *并且确保里面真的是她，而不是小偷。* 尽管我不知道为什么会从一家苦苦经营的书店咖啡馆里偷东西东西。


    当我们到达房子时，我已经精疲力竭。劳拉和我静静地进入屋内，屋里的温暖迎接着我们。“晚安，”当我们朝楼梯走时她轻声说。“晚安，”我回答道。


