    the Redwood Village Police Station to talk to Detective McKensie. Valerie returned
    just as I was finishing up, and she handed over Dad’s tablet with a muttered thanks
    before stomping off to the back. Apparently, she hadn’t come away happy from her
    conversation with Vicki, which wasn’t much of a surprise, considering Valerie’s
    reticence to pay her employees a living wage.


    “Rita’s not going to be happy,” Dad said, waggling his tablet. “I expect to hear
    from her at any moment.”


    As if cue, his phone *ding*ed. He checked it, showed me Rita’s, *They hung up
    on me!* text, and then he took a moment to respond. Another *ping* followed. And
    then another.


    “She’ll keep texting you until you call her,” I said.


    “You’re probably right.” He heaved a resigned sigh. “Give me a few minutes to
    smooth things over with her, and then we can head home.” He stood and moved to
    the empty bookstore portion of the café, though he could have made the call sitting
    in his seat and not disturbed anyone since there was quite literally no one else
    in the dining area but me and Farrah, who was perusing her phone behind the counter.


    I peered at the window toward Tito’s Deli, curiosity smoldering just under the
    surface. I wondered if Tito was inside, and if Detective McKensie had arrived
    while I’d been talking to Dad. I could go over and have a look around, but what
    then? If Tito was there and he recognized me as his trash thief, there’s no telling
    what he’d do. Not only that, but Dad was with me. And Paul and Laura were likely
    on their way back to Dad’s by now, if they weren’t there already.


    The door to Death by Java opened. I glanced back to see Roman Haines walk through
    the door, tool belt slung low on his hip.


    “Hey, babe,” he said to Farrah, whose face immediately fell when she saw him.
    “Could you get the boss lady for me? We’ve got a little business to work out between
    the two of us, if you know what I mean?” I couldn’t see his face, but I could
    imagine the smarmy wink that followed.


    Farrah pocketed her phone, rolled her eyes, and without a word, retreated to the
    back, leaving Roman and me alone in the dining room. He turned, hip cocked in
    a way I assumed he took as fetching, and when he saw me, a grin a mile wide spread
    across his face.


    “Hey there.”


    “Roman.” Noting that Dad was still on the phone with Rita, I stood and walked
    over to where the repairman waited. “Something else break?”


    “I don’t think so,” he said. “I just need to talk to Valerie.”


    As subtly as I could, I scanned the tool belt, noted the mismatched screwdriver
    tucked at his hip. I pointed at it. “I heard Valerie found one of your tools in
    the back.” *Next to a dead body*, I didn’t add.


    Roman’s grin somehow widened further. “Boy, did she ever.”


    I did well not to groan. “I meant your screwdriver.”


    He glanced down at his tool belt. “Oh yeah. That thing. It happens.”


    “Did you leave it here when you fixed the ice machine?” I pressed. “Or did you
    come back here later that night? You know, to collect payment.” I winked, feeling
    like a complete moron, but I didn’t know how else to slither into Roman’s good
    graces.


    The ploy appeared to work. The expression that flittered across Roman’s face made
    my stomach do very unpleasant things. I could almost taste the slimeball oozing
    off him.


    “You *do* feel me.” He bobbed his head in time with whatever music was echoing
    in his otherwise-empty skull. “We may have had a few minutes to powwow the other
    night. We didn’t quite get physical, but I may have rattled my belt, if you catch
    my meaning?”


    I had an inkling. “Are you and Valerie a thing?” I kept my voice low, even though
    no one was within earshot.


    I could see the desire in Roman’s eyes. He desperately wanted to brag, to tell
    me that he and Valerie were doing things that were only ever conceived of in erotic
    stories told in hushed whispers in the dead of night. Instead, he hitched a shoulder,
    ceased the endless head bob.


    “Not officially as of yet,” he said. Then his expression brightened. “But hey,
    now that this Mickey dude of hers is a suspect in a murder, she might think about
    giving me a solid chance at hitching a ride on the old Valerie Express. It’s most
    fortuitous.”


    I was actually surprised he knew such a big word, but I managed to mask my shock
    as I asked, “How well do you know her boyfriend, Mickey Robbins? Do you think
    he could have killed Lyle?”


    “Guy was a loose cannon,” Roman said. “Got all up in my face one day, but he had
    nothing to say. Was just mad that his girl was making eyes at me. I could have
    told him that it ain’t nothing new. All women look at me that way.” He looked
    me up and down and licked his lips in a way that wasn’t just an invitation, but
    a promise.


    Somehow I didn’t puke.'
