    I let Dad’s voice fade as I turned my attention back out my window. We’d just
    entered the downtown portion of the Village. Traffic wasn’t too bad at this time
    of day, but I knew it could get hectic, especially around shift changes. There
    was a ton of foot traffic along wide, well-maintained sidewalks, which were decorated
    with various flowers, including redwood sorrels when they were in season. Even
    with so many people packing the walkways, the Village held that cozy vibe I’d
    always loved.


    A contented smile started to spread across my face, but it froze when my gaze
    landed on a business I’d only heard about up until that very moment.


    The building was situated on a popular street on a busy corner, making it a prime
    location for foot traffic. A sign above the door featured a cup of coffee with
    steam spilling from it, spelling out the words *Death by Java*. A sprinkling of
    beans lay around the base, next to a pair of stacked books.


    “You’ve got to be kidding me,” I muttered. I’d known my high school bully, Valerie
    Kemp, was opening a bookstore café, and that she was using my own shop as inspiration,
    but seeing it in person was something else.


    I couldn’t see inside the café, but I did note that most people walked past it
    without paying it much more than a glance. Curiosity warred with annoyance. I
    desperately wanted to know what it looked like inside to see if Valerie had copied
    the exact layout of Death by Coffee, or if she’d come up with something original.
    Death by Java was bigger than my own place, but it was also in a bigger town,
    so the increased size was understandable.


    “Do you want to go in, Buttercup?” Dad asked, using the pet name he’d had for
    me since I was little.


    I bit my lip. Did I? If Valerie was there, she’d make a scene. I just *knew* she
    would proudly explain how her place was *so* much better than mine, all while
    acting like she was paying me compliments.


    “Let’s stop,” Paul said, squeezing my hand. “It’s better to get it over with now
    than to let it eat at you.”


    I hated to admit it, but he was right. If I didn’t stop in and have a look, I’d
    obsess over it until I did, which would ruin the trip for everyone. “Okay. Let’s
    do it.”


    It took Laura five minutes to find us a place to park. Another two just to squeeze
    us into the space between two much larger vehicles. On-street parking could be
    bad in Pine Hills, but here in the Village, it was always a nightmare.


    We climbed out of the car with my entire body groaning at the movement. After
    a good stretch, Paul took my hand, gave me a reassuring smile, and then the four
    of us walked the short distance to Death by Java.


    “You ready for this?” Dad asked, hand on the door.


    “No. But let’s do it anyway.”


    He gave me a reassuring smile, then he opened the door.


    “You know exactly what you’re doing!”


    The shout met us the moment we were inside. Valerie Kemp, with her spritzed, bottle-blond
    hair, her long, shapely legs, and insultingly trim body, was standing, her hands—manicured
    nails and all—pressed firmly to her hips as she faced off against a short man
    in a ball cap whose back was to us. She was wearing heels and a too-tight blue
    dress that left little to the imagination. She looked like she was ready to head
    out for a night on the town.


    “I’m going to hit the restroom,” Dad said, eyeing the confrontation with mild
    interest. “My bladder isn’t what it used to be.”


    “I think I’ll join you,” Paul said. “That was a long flight, and I feel like I’m
    going to float away.”


    “Count me in.” Laura turned to me. “You want to come along and scope out the stalls?”


    “No,” I said, still watching as Valerie and the guy in the hat continued to argue.
    “I’m okay.”


    Dad and Laura headed toward the back, where the restrooms were marked with large
    letters declaring one for men and the other for women, and below each, in smaller,
    yet readable print, NO EXCEPTIONS.


    Paul hesitated.


    “Go,” I told him. “I’ll be fine. I’d rather talk to Valerie without you all watching
    over my shoulder anyway.”


    Another beat, and then he leaned forward to kiss me on the cheek before half-waddling
    to the restroom.


    “I’m only doing my job,” the man in the ball cap said. He was holding a tablet
    with one of those rubberized cases on it that looked as if it had been dropped
    numerous times. “If you would just—”


    “I can’t believe this!” Valerie spun, took two angry steps away, then stormed
    right back over, heels *clack*ing on the hard floor. “You’re trying to run me
    out of business. You’re jealous of my success!”


    “Success” might have been a strong word, I thought, looking around. The tables
    were clean*ish*, as was the floor. The trash bins weren’t quite overflowing, but
    I think that had to do with a decided lack of customers more than them having
    been emptied recently. There were no stairs leading to the bookstore portion of
    the bookstore café like there were at Death by Coffee, but the design was similar.
    The bookshelves were nice, but the books themselves appeared to have been shoved
    haphazardly into place with no rhyme or reason. Some were practically hanging
    off the shelves, as if someone had tossed them back without bothering to stand
    them upright.


    Casually, hoping not to be noticed, I slinked around the side so I could get a
    look at the menu board behind the counter. A pair of young women, both dressed
    in pink dresses with white bows at the waist, stood watching the exchange between
    Valerie and the man. One was snapping and popping her gum in interest, while the
    other appeared bored, as if this was something that happened on a daily basis.


    “Jealous? Have you looked at this place?” the man said. “I’m being generous if
    anything!”


    “Generous! I ought to—”


    “Val.” Another man stepped forward and put a meaty hand on Valerie’s wrist, stopping
    her from saying whatever it was she’d had to say. He was tall and muscular, with
    that bronzed look about him that spoke of a lot of time spent under the sun.


    “Now, listen here, Mickey—”


    “No, *you* listen, you pipsqueak,” the man, Mickey, said. He flexed biceps that
    were clearly gym-made and rolled his head, causing his neck to crack and pop.
    “I’ve had just about enough of you coming in here and harassing my Val.”


    *My Val?* I kept my gaze glued to the menu board, though I had yet to read it.
    Last I’d heard, Valerie was dating a guy named Hugh.


    “I’m not harassing anyone!” the man with the tablet said. “I’m telling you, the
    condition of the—”


    “You’d better be more concerned about *your* condition, egghead.” Mickey advanced
    a step.


    The man in the cap backed up a step, toward the door. “You can’t keep me out of
    here like this. I have a right to inspect the machines.”


    “You have a right to leave.” Mickey grinned, clearly thinking himself a genius
    for his high school–quality comebacks.'
