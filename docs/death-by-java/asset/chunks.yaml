    “Two Cokes,” Bray said, sliding them across the bar toward Paul and me. “So, Paul,
    what is it you do for a living? And how did you meet our Krissy here?”


    While I could have stood there and explained how I was `never` “their” Krissy,
    I had more important things in mind. “I’ll be right back,” I said. And before
    Paul, or anyone else, could stop me, I rushed across the room, out the door, and
    into the night.


    Mickey was already halfway across the lot, and he was walking away fast.


    “Mickey!” I called. “Wait up a sec.”


    He glanced over his shoulder at me, and then, with a sigh that caused his big
    shoulders to heave, he turned and waited for me to jog across the lot to join
    him.


    “Sorry. I’m Krissy Hancock, Valerie’s friend.” Even coming out of my mouth, it
    sounded forced, but I didn’t know what else to say that wouldn’t make him dismiss
    me and walk away.


    “I remember.” He looked down at the flowers and then held them out to me. “These
    are for you, I guess.”


    I didn’t want them, but I took them anyway, making sure to take note of Mickey’s
    hand. It was no longer bandaged, but he had a couple of nasty-looking bruises
    and scabs on his knuckles. “What happened?” I asked, nodding toward the damage.


    Mickey flexed his fingers with a wince. “Got a little too rough during my workout.
    It’s nothing.” He folded his hands behind his back. “Was there something you needed?”


    “I assume these were meant for Valerie?” I held up the flowers, which were, admittedly,
    a pretty assortment, though I couldn’t name half of them.


    Mickey shrugged, looked away. “I suppose they were.”


    “She’s not here.”


    “I noticed.”


    This was going great. “She didn’t tell you she was skipping out on the reunion?”


    “No. We haven’t spoken recently.”


    I absorbed that a moment before asking, “Is everything okay between you two?”
    I knew that it wasn’t, but I was curious as to what he might say.


    Mickey ran his tongue over his teeth, kept his eyes averted. “It’s been a tough
    couple of days,” he said. “My Val’s got a lot on her mind with the whole Lyle
    thing, and I haven’t been doing too hot lately, either. It’s messed everything
    up.”


    “It’s a shame what happened to him,” I said. “From what I’ve seen, you two didn’t
    get along. You and Lyle, I mean.”


    His eyes narrowed as he turned them on me. “That some sort of accusation?”


    “Just an observation,” I said. “You aren’t the only one, it seems. Tito next door
    didn’t appear to like Lyle, either.”


    “No one did.” Mickey sniffed, then wiped his uninjured hand across his nose as
    he glanced around the parking lot. It was a move straight out of a tough-guy handbook.
    “It’s a shame he had to die, but I can’t say I’m too broken up about it. He was
    harassing Val and making a nuisance of himself all over town. It was inevitable,
    if you ask me.”


    Inevitable that someone would kill him? I found that hard to believe. “Do you
    have any idea how he ended up in the back room of Death by Java?” I asked.


    Another shrug, sniff, and nose wipe. “No clue. Must’ve broken in.” And then, like
    that, he dropped the act. “Look, I don’t know what happened to the guy. But if
    you talk to Val, could you tell her to call me? I really want to speak with her
    so we can clear the air.”


    *About what?* I desperately wanted to ask the question, but I held my tongue.
    I was keenly aware that while there were a dozen people inside Hooties, there
    was no one in the parking lot with us. If Mickey Robbins was a killer and he thought
    I was prying too much, who knew what he might do?


    “I’ll talk to her,” I promised. And then, because I was curious, I asked, “Have
    you tried to call her yourself?”


    Mickey looked off into the distance, and for a moment, I wasn’t sure he’d respond.
    “She’s not answering,” he said, eyes sliding over to me. “Every time I’ve tried
    to contact her, I’ve hit a brick wall. I swear, it’s got to do with those two,
    Aaron and Hugh.” His face hardened when he referenced Valerie’s exes. “Just …
    tell her to call me, all right?”


    And then, without saying goodbye, Mickey turned and climbed into his car. A moment
    later, he gunned the engine and was gone.


    I stood under the parking lot lights for a long time, just thinking. Valerie had
    once claimed Mickey was avoiding her, yet he’d just said it was the other way
    around. One of them was lying. But which one?


    I returned to Hooties, mind churning over the possibilities. Could Hugh and Aaron
    be somehow involved? But if so, how? Could one of them have found a way to block
    Mickey’s number from Valerie’s phone, or vice versa? It seemed far-fetched, but
    it felt like it *was* within the realm of possibility. I didn’t think either man
    was a criminal mastermind, but if they were to put their heads together … maybe.


    And the big question: If Aaron and Hugh were that intent on coming between Mickey
    and Valerie, would it be such a stretch to imagine that they might


    # 13 The Morning After


    The next morning, the sun was barely up when I’d finished getting ready. Paul’s
    shower was quick. Before Dad and Laura were done with their first cup of coffee,
    the two of us were out the door and headed for our breakfast with McKensie.


    She’d chosen a small diner called Juan’s. It was nestled between two buildings
    right across the street from the police station, which made it a convenient place
    for her to conduct the interview. The smell of grease was strong as we entered
    through the glass front door. McKensie was seated at a booth in the corner, sipping
    at a coffee. She waved us over with a smile.


    “Thanks for coming on short notice,” she said, motioning to the seat across from
    her. “Coffee’s still hot.” The pot was sitting at the edge of the table. Two off-white
    mugs were turned upside down in front of where she’d indicated.


    “I’m not sure there’s much we can help you with,” Paul said as he sat. “Krissy
    and I are here on vacation and hardly know anyone.” He flipped both our mugs upright
    and then filled them, sadly, sans cookie.


    “Understood,” McKensie said. “I still would like to go over a few things, if you
    don’t mind. Krissy *has* been in contact with people involved in the case, and
    I’d love to get her insights.” She glanced over at me before turning back to Paul.
    “And anything you can contribute can only help. I’m not officially on duty yet,
    so think of this as more of an informal meet.”

