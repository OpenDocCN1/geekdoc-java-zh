    “A cat. Black and white. His name is Oscar.”


    “I’ve seen him,” Tito said. “He gets into my trash and rips open the bags. And
    if you’re not careful, the thing will dart between your feet whenever it’s spooked.
    The thing is a pest. If I was a lesser man, I’d do something about it. I doubt
    Ms. Kemp is taking much care of it or else it wouldn’t be so skittish.”


    “Oscar was in the store the night Lyle was killed,” I said. “Or, at least, that’s
    what everyone at Death by Java believed.”


    Tito waited a beat, then asked, “And?”


    “And someone let him out. I was wondering if you might have seen who that was.”


    The incredulous look that passed across his face had me blushing in embarrassment.
    “You think I pay attention to who or what goes in and out of that place next door?
    We’re business neighbors, not friends. I have my own issues to deal with here.
    I don’t care where that cat is, as long as he’s not messing with my trash or getting
    into my place of business.” His glance at his watch was so quick, there was zero
    chance he’d actually read it. “Your five minutes are up. I’ve got to get back
    to work.” He started to rise.


    “Wait. One more question.”


    Tito hesitated, then settled back down, though he was tense. His jaw worked, and
    those dark brown eyes of his looked like deep, black pits.


    “It’s about Lyle’s tablet,” I said.


    It was as if all the air was sucked from the room. I swear Tito stopped breathing
    for a full five seconds before he asked in a quiet voice, “What about it?”


    “When was the last time you saw it?” I asked, watching him carefully. His reaction
    wasn’t what I’d expected.


    Tito’s eyes bounced back and forth as he scanned my face, as if searching for
    some sort of deception. “I assume it was when I last saw him.”


    “Which was …?”


    His blink was slow, measured. “I wager it was when I kicked him out of here.”


    *Assume. Wager.* Tito was being awfully careful here. “Did you ever see Lyle *without*
    his tablet?”


    He ran a hand over his scalp. Behind him, the dudebros rose with a raucous round
    of laughter and left.


    I was about to prod Tito into speaking when he abruptly stood.


    “I answered your questions. If you’ll excuse me, I’d like to get back to work.”
    His gaze flickered to the empty table. “And please, no loitering. If you aren’t
    go ing to eat, I would ask you to leave so a paying customer can have your place.”
    He spun away and marched to the back.


    I watched him go with a growing concern. Tito had been relatively relaxed when
    we’d started. I mean, the guy seemed like he was a powder keg of suppressed, angry
    energy most of the time, but he hadn’t appeared too concerned about anything I
    was asking when I’d first started questioning him about Lyle.


    And then I’d brought up the tablet.


    The door opened, and Dad, Paul, and Laura entered. They scanned the deli, saw
    me, and then worked their way around the room, toward my table. I plastered on
    a smile and greeted them like nothing was wrong.


    I knew otherwise.


    Someone knew what had happened to Lyle Carrigan’s tablet.


    And I’m pretty sure Tito Adornetto was that someone.


    # 15


    Tito’s Deli had once been called the Plain Slice. The change in name coincided
    with Tito taking over from his father, Carlito, and it heralded an increase in
    business. Before, there was some confusion, as the old name made people think
    it was a pizza joint, where as the newer one made it obvious that it wasn’t. There
    were also countless articles about Tito’s ascension to head man, about his more
    cutthroat nature. Where Daddy Adornetto was kind and generous, Tito was will ing
    to do just about anything to succeed.


    And based on the Google Maps view of his house, he’d succeeded just fine.


    “What are you looking at?” Dad asked as he entered the dining room. He was dressed
    in his slippers and robe, clearly ready for a night in after a long day spent
    running around Redwood Village.


    I turned off the screen of my phone and set it aside. “Nothing. Just waiting for
    you.”


    His smile said he knew otherwise, but he didn’t press. He crossed the room and
    eased down into a chair with a groan. “Today was fun. I think Paul likes it here.”
    He gave me a meaningful look.


    “We *all* like it here,” I said. “But Paul and I like it in Pine Hills just as
    much. I think you do too.”


    “True.” Dad stretched his legs out in front of him with a barely suppressed yawn.
    “Do you have any big plans for tonight?”


    “Not really.” My eyes flickered to my phone. “I …” I shook my head. “Never mind.”


    He sat forward. “No, tell me.”


    I bit my lip and considered what to tell him. On the one hand, talking about it
    might help me to sort things out in my mind. On the other, it was Dad. Unlike
    Paul, he wouldn’t tell me to sit back and let the police handle it. He’d warn
    me to be careful, all while urging me to keep looking, to keep digging. In a word,
    he was an enabler.


    And me being me, that was exactly what I was hoping for.


    “It’s Tito,” I said. “Something strikes me as off about him.”


    “Such as?”


    “He’s not a very nice guy, for one.”


    “Being nice isn’t a prerequisite for owning a business,” Dad said. “Nor does it
    make him a killer. That’s what you’re thinking, right? That he killed Lyle Carrigan?”


    I scrunched up my face. “Maybe? I honestly don’t know what to think. Mickey Robbins
    is a better suspect, as are Valerie and Hugh and Aaron and countless other people.
    But when I mentioned Lyle’s missing tablet, Tito got all weird on me.”


    “Weird, huh?” Dad rubbed his chin. “Like he knows where it is?”'
