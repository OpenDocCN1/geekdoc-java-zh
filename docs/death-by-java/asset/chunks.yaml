    asked, “Is that all she does? Make eyes at them?”


    “Oscar!” Dee called, making more kissing sounds, before answering. “Who knows?
    I’m always out of there before dark, so thankfully, I’m not there to see what
    happens at night. Seeing the evidence of it in the morning is bad enough.”


    “What evidence?”


    Out came the can, along with a small silver spoon from her other pocket. She tapped
    on the side of the can as she said, “Don’t get me wrong, it’s not like it happens
    all the time. Usually I just find a few things on the floor in the back, like
    they were knocked off the shelves by someone doing something they shouldn’t be
    doing.” She glanced meaningfully at me. “I haven’t found discarded clothing or
    anything like that, if that’s what you’re thinking. If I ever do, that’ll be it
    for me.”


    I couldn’t imagine what I’d do if I ever came into Death by Coffee and found someone’s
    boxers lying next to the coffee beans. Fumigate, more than likely.


    “Are you sure it’s not just the closers being careless?” I asked.


    “No. I asked Farrah about it once, and she told me everything was in order when
    she’d left. Both Mickey and Valerie were there that night, though, and we sort
    of put two and two together.” She stopped walking and turned to face me. “None
    of this can get back to Valerie, all right? I know you’re her friend—”


    “I’m not,” I said, cutting her off. “And I won’t tell her anything. Promise.”


    Dee chewed on her lower lip, her eyes scanning the area. This time, I wasn’t so
    sure she was looking for Oscar. “I’m ninety percent sure Valerie is cheating on
    Mickey,” she said. “They might have been there together that night, but there
    are other nights when I’m running evening errands and I go by and I see her there
    with other guys, usually one of her exes. She doesn’t know I know, so …”


    I mimed crossing my heart and zipping my lips. “When you say you ‘see her with
    other guys,’ what do you mean?”


    Dee considered it a moment before answering. “I’m not saying I’ve seen her kissing
    someone else or anything like that. It’s more of a vibe thing. You see two people
    together, and you just *know* there’s something going on between them.”


    I got it. I got the same vibes from seeing Valerie with Hugh and Aaron, which
    brought me to my next question. “Who have you seen her with? Other than Hugh and
    Aaron, I mean?”


    Dee studied me a moment, then asked, “What’s going on? Why’s Death by Java closed?”


    I debated on what to tell her, but then opted for the truth. It wasn’t like it
    was a secret. If she were to go home and turn on the news, she’d find out.


    I had just opened my mouth to tell her about Lyle’s murder when a door opened
    from the building into the alley, and a guy with a beard that went halfway down
    his chest exited, carrying a bag of trash. He eyed us distrustfully for a moment
    before tossing the bag into a trash bin. Another distrustful stare, then he tromped
    back inside.


    “We should probably head back,” Dee said with a sigh. “We’re not going to find
    Oscar like this.”


    I agreed.


    We started back toward Death by Java, and since she hadn’t pushed the issue, I
    expected the conversation to be over, but Dee surprised me by speaking up.


    “I don’t think Valerie wants to hurt Mickey or any of the guys she’s cheating
    on him with,” she said. “She just doesn’t know how else to act. It’s like she
    thinks her looks are the only thing she has going for her. I’m not sure she understands
    that she doesn’t have to act that way to get people to like her, you know?”


    Sadly, I did. The more I got to know Valerie Kemp, the more I realized that her
    entire self-worth was wrapped up in how others saw her. She wanted women to be
    envious; she wanted to attract all the men. She didn’t see that she could just
    be herself, without worrying about what anyone else thought, and *that* would
    make her a far more attractive person to most people.


    Dee fell silent, and I was content to leave it at that. I’d already suspected
    Valerie was cheating on Mickey, and my conversation with Dee had all but confirmed
    it. I wasn’t positive her infidelity had anything to do with Lyle’s murder, but
    it was a place to start.


    What I *did* know was that if she was using Death by Java as a home base for her
    illicit liaisons, then it was likely that other business owners in the area knew
    about it.


    *I need to talk to Tito*, I thought. If anyone would know who was going in and
    out of Death by Java after hours, it would be the deli owner next door.


    “Oscar!”


    The scruffy, black-and-white cat was sitting near the back door to Death by Java
    as we approached the bookstore cafe. At the sound of Dee’s excited exclamation,
    he’d risen to all fours and arched his back, but as soon as he saw who it was,
    his entire demeanor changed. He let out a croaking *meow* and pranced in place,
    favoring a front paw, as Dee rushed over to him.


    “There you are,” she said, pulling the can of food from her pocket. “I’ve been
    looking all over for you! Are you hurt?”


    Oscar made another strangled-sounding *meow*, rubbed up against her shin, and
    then practically ripped the can from her hand as she popped the lid off and set
    the food down in front of him. He dove in like he hadn’t eaten in days.


    “Eat up,” she told him. “I don’t think Valerie’s going to let you in. I’m not
    sure what to do.” She stroked his back, which he allowed. It was clear he trusted
    her, and I wished that things could be different and she could take him home.
    He deserved it. They both did.


    Oscar shifted his stance so that he wasn’t putting as much weight on that front
    paw of his. It didn’t look broken or bloody, so it didn’t appear serious. Still
    …


    “Has he been to the vet?” I asked.


    Dee shook her head and kept petting the cat. “I don’t have the money to take him,
    and Valerie doesn’t care. I even bought a cat carrier, just in case, though I’ve
    never gotten the chance to use it.”


    “Where do you keep it?” I asked. “The carrier, I mean?”


    “In my car.” She glanced back over her shoulder. “Why?”


    I hesitated, but there wasn’t any real debate on what I was going to do. The cat
    needed care, and I was in a position to give it to him. No, I didn’t have a home
    for him, but I could at least make sure he got his shots and tests, not to mention
    having his paw looked at and getting him fixed. The latter should cut down on
    his wandering some, and that, in turn, would hopefully prevent him from injuring
    himself again.'
