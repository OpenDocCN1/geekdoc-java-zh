    do need to talk to Nadia.”


    “Is she in trouble?” Dee asked.


    Was she? I had no idea how to answer that. “I’m not sure,” I said. “That’s why
    I need to see her.”


    Dee considered that a moment and then seemed to come to a decision. “It’s probably
    better if I don’t know the details, especially with everything that’s happened
    lately.” She rattled off Nadia’s address. “I don’t have her number, or I’d give
    you that too. I only know where she lives because I gave her a ride home once
    when her car broke down. We’re not close.”


    “It’s all right,” I said, repeating the address over and over in my head so I
    wouldn’t forget it. “Thank you so much, Dee.”


    “No problem. You’ve helped Oscar and me, so I felt like I should return the favor.”


    I hurried back to the car. Dad was waiting right where I’d left him, and by the
    time I was seated and strapped in, he was already pulling out onto the road. I
    told him the address, and then sat back, shaking ever so slightly from the exhilaration
    of it all.


    “Should we call the police?” Dad asked once we were moving in the right direction.


    “Probably,” I admitted. “But not yet. I want to see what Nadia has to say before
    we call.” I didn’t think Nadia had killed Lyle, so I wasn’t worried about her
    coming after me. But I did think she had information, and I didn’t want to spook
    her by having the police show up on her doorstep unannounced.


    I was a nervous ball of energy by the time we pulled up in front of a complex
    of two-story apartments with outdoor entrances. From the outside, they weren’t
    terribly appealing. Most of the rooftops had an aged look to them that warned
    of impending leaks. And they all were a beige color that made them appear dirtier
    than they actually were.


    “She’s in that one,” I said, pointing.


    Dad parked in front of the indicated building. “I’ve heard questionable things
    about the ownership here,” he said. “*This* is the sort of place a health inspector
    should frequent.”


    From what I’d seen thus far, I tended to agree. “Maybe you should wait—”


    He shut off the engine and popped open his door. “Not a chance.”


    I didn’t argue. I got out of the car and took the lead as we headed for the set
    of stairs that led up to Nadia’s apartment. They were old, made of questionably
    sturdy wood, and looked like they were a good stomp away from collapse. Still,
    I pounded up them like my life depended on it, reached the small, deck-like structure
    that served as Nadia’s stoop, and knocked.


    When no one answered, I knocked again, this time adding my voice. “Nadia. It’s
    Krissy Hancock. Valerie’s friend.” It still didn’t roll right off my tongue the
    way I’d intended, but I let it go. “I just want to talk to you for a few minutes,
    and then I’ll go away.”


    “Maybe she’s not home,” Dad said.


    A creak from inside said otherwise, so I knocked harder. “Nadia, please.”


    “All right, all right. Don’t beat the door down. Sheesh.” The door opened, and
    there she was, looking, to be frank, awful. Gone was the gum-popping, pink-dressed
    girl from Death by Java. In her place was a woman wearing gray sweats and a torn
    T-shirt that hung loosely from one bare shoulder. It might have been cute if it
    wasn’t for her matching gray pallor. “Come on in, I guess.” She started to step
    aside, but stopped. “Who’s that?”


    “That’s my dad,” I said. “Ignore him.”


    “Howdy.” Dad gave her an aw-shucks wave and smile.


    Nadia pulled the tattered sleeve of her shirt up onto her shoulder, but there
    was nothing to keep it from sliding right back down. She let me and Dad in her
    apartment before hastily closing the door behind us.


    “I don’t know why you’re here,” she said. “But if it’s because Ms. Kemp sent you,
    you can tell her that I’m getting better and I’ll be back to work soon.”'
