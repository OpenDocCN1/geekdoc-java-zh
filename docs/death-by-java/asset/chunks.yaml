    next trip. I talked to her yesterday and … whew. She’s riled up and isn’t afraid
    to let everyone know about it.” There was a shuffling sound before she said, “I
    should let you get back to it. Say hi to your dad for me.”


    “I’ll do that.” New thought. “Before you go, how’s Death by Coffee doing?”


    “The people or the place itself?”


    “Both.”


    “The lights are still on—mostly—and business is about the same as usual. We all
    miss you, customers included.”


    *The lights are on.*


    A flash: the shifting light at Death by Java the night before Lyle’s murder. A
    flashlight? Something else? Farrah claimed there was no light on the next day,
    so who ever was back there had turned it off—or had taken it with them—when they’d
    left.


    Then, twenty-four hours later or so, Lyle Carrigan was found dead in the very
    same backroom. Coincidence? A clue?


    Lena’s voice tore me from my thoughts. “I’ll see you when you get back, Krissy.”


    “See you then.” I clicked off, mind churning over the possibilities.


    Valerie had claimed she didn’t know anything about the light. Was she telling
    the truth? Lying? Had Mickey gone there, dented the ice machine then? When Roman
    had been fixing it the following day, I hadn’t noticed a dent, but I hadn’t been
    looking for one. And since Roman and Valerie were standing in front of it, too
    close for comfort, I’d kept my focus turned elsewhere, lest I see something that
    would give me nightmares.


    “Everything okay back home?” Dad asked, setting his tablet on his lap. “If you
    want to talk about it …”


    “Everything’s fine.” I stood. “I need to make a call.” I hurried out of the room
    and into my bedroom for privacy. I closed the door behind me, waited a couple
    of seconds to make sure Dad hadn’t followed me back, then I put in the call.


    The phone rang four times before a breathless Valerie answered with a curt, “Who’s
    calling?”


    “It’s me, Krissy.”


    A beat, and then, “Oh. Krissy.” Said like she hadn’t heard from me in years. “Was
    there something you needed? I’m kind of busy right now.”


    “It’s about the light I saw on at Death by Java two nights ago.”


    An impatient sigh. “Didn’t we already talk about this? The light wasn’t on when
    Farrah came in. You were probably mistaken. If that’s all—”


    “Where was Mickey that night?”


    A long stretch of silence followed before she asked, “Why do you ask?”


    From her tone, I realized I needed to be careful here. She wanted to protect him,
    which, since he was her boyfriend, was understandable.


    But if he’d killed Lyle, she deserved to know. No one wanted to be dating a murderer.
    No sane person did, anyway.


    “I’m not accusing him of anything,” I said. “I’m simply trying to put a timeline
    for everyone together. Someone was inside Death by Java that night. If it wasn’t
    you, and if it wasn’t one of your employees, I’m assuming it had to be Mickey,
    right? Does anyone else have a key?”


    “No …” Spoken slowly, almost uncertainly. “I don’t see what this has to do with
    anything.”


    “Could Mickey have been meeting someone at Death by Java at night?” I pressed.
    “A friend? You, even?”


    “What are you implying?” The heat in her voice told me I’d hit a nerve of some
    kind.


    “I’m not implying anything,” I said. “But if Mickey was there that night, perhaps
    he was there the following evening too. He might have seen something that would
    help the police—”


    Valerie cut me off. “Mickey wasn’t there. He’s not cheating on me. He wouldn’t
    *dare*.”


    I hesitated. *Cheating?* Where had *that* come from?


    Valerie took a deep breath and let it out in a huff. “Look, I’m sorry I snapped
    at you.” She didn’t sound it. “It’s been a long day, and I’m having a hard time
    dealing with everything that’s happened, so I’m a little short with everyone right
    now, okay?”


    “It’s all right. One more question, and then I’ll let you go.”


    Another sigh, this one dramatic enough, she should have won an award. “Sure. Whatever.
    Go ahead.”


    “Your ice machine,” I said. “I noticed the door was dented earlier today. Do you
    know when that happened?”


    Another long stretch of silence before she said, “I don’t know what you mean.”


    “The ice machine—the one that was broken.” As if there was more than one in the
    back room of Death by Java. “Roman was fixing it when I walked back there, and
    I’m pretty sure the door was fine then. The next day, when you showed me where
    Lyle had been found, I noticed the door was dented.”


    “You must have been mistaken,” she said. “I didn’t notice anything like that.”
    Said like she *had* noticed, but didn’t want to talk about it. Because she—or
    Mickey—was involved in the murder and realized it was a clue? Or because she hadn’t
    thought of it as important?


    *Or could she have dented it herself?*


    I tried to imagine Valerie doing *anything* that would have put a dent that shape
    and size into a metal door and couldn’t do it.'
