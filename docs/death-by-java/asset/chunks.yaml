    # 18


    “Yeah, I’m sorry about this,” Dad said, phone to his ear. “Right. Uh-huh.” He
    glanced at me and winked. “It’ll probably be an hour at most. Yep. See you then.”
    He clicked off and shoved his phone into his pocket. “I don’t think she believes
    me.”


    “Of course she doesn’t,” I said as I opened the car door and slid out. “A flat
    tire? Really?”


    “I didn’t know what else to say,” Dad said, joining me on the sidewalk. “I didn’t
    want to tell Laura we were off chasing killers like a couple of mopes from one
    of my novels.”


    “She knows, Dad. She knows.”


    We walked the short distance to the Italian Roll side by side. Customers were
    seated outside, enjoying their pizza rolls, and all those old memories came flooding
    back once again. But now, knowing there was a chance Marco Rossi could very well
    be a murderer—or tied to one—I couldn’t summon the enthusiasm for those little
    squares of lava.


    *You don’t know that he’s involved.* All Leanne had said was that Marco and Lyle
    had struck a deal and that it might be the reason why her husband was killed.
    She hadn’t said Marco killed him or even knew who did, but it was hard not to
    wonder. I still thought Mickey was a good bet as Lyle’s killer. Even Roman and
    Tito were better suspects. I hoped that talking to Marco would help me sort it
    all out.


    “Are you ready for this?” Dad asked, hand on the door.


    No, I wasn’t. “Let’s get it over with.”


    Most of the tables were full as we entered, though orders had died down. No one
    was behind the counter other than one of the Italian Roll’s teenage employees,
    who was wearing the typical outfit: white shirt, jeans, covered by a white apron
    with the Italian Roll logo on it. He was leaning against the serving window that
    led into the kitchen, talking to someone out of sight. A glance toward the open
    office door showed Marco standing just inside, peering out at us.


    “How do you want to do this?” Dad asked.


    I strode to the counter by way of answer. “Hi there,” I said.


    The teen didn’t so much as crack a smile at my perky tone. He grunted as he pushed
    away from the window and moved over to stand behind the register. “What can I
    get you?”


    “We’d like to talk to Marco.” I flashed a wide grin to where the man in question
    stood, scowling. “It’s about Lyle Carrigan. I’ve heard an interesting rumor about
    how Marco struck a deal with—”


    Before I could finish the thought, Marco barked, “Get in here,” and motioned for
    me to enter his office. Since Dad was standing behind me, he took it as an invite
    as well, and we both crossed the short distance to where Marco waited. He made
    room for us to enter, then slammed the door closed behind us.


    “What do you think you’re doing coming in here talking about Lyle to my employees
    like that? And loud enough to be heard by my customers? Are you trying to ruin
    me?” He walked around his desk, but he didn’t sit. Instead, he gripped the back
    of his chair in hands that looked strong enough to strangle both Dad and me at
    the same time. “Care to explain yourself?”


    “I’m sorry about that,” I said, going for contrite, but his reaction had piqued
    my interest. There was, indeed, something to what Leanne had told me. “But I wanted
    to get your attention. You *did* strike a deal with Lyle Carrigan, didn’t you?”


    Marco glowered at me for a good long minute before speaking. “Who told you?”


    “So, it’s true?” Dad asked.


    A *crash* came from the kitchen on the other side of the wall. Someone clapped.
    Marco just stared, jaw working overtime. I imagined his dentist wouldn’t be thrilled
    with him once this was over.


    “It could be important,” I pressed. “Did you make a deal with Lyle?”


    “That’s your business, how?”


    I didn’t have to think about it very hard to know that accusing Marco of killing
    Lyle would be the wrong tactic here. “He was murdered,” I pointed out. “If it
    was because the two of you were working together …” I gave him a meaningful look.'
