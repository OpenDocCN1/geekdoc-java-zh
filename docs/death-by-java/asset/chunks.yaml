    我们进入房间时，我瞥了一眼父亲。他正打量着房间，目光像他故事里的侦探一样扫视着四周。当 `Marco` 关上并锁好身门时，我决定由我开头。他指向附近的一张桌子，在我回答之前，我们都坐了那里。


    “还没有。这就是为什么我想和你谈谈。”


    “我不认为我能说什么管用的话，”他说，“我不知道他身上发生了什么，只知道他被杀了。”


    在开口之前，我简短地想警察是否已经出来承认这是一起谋杀案，或者 `Marco` 是否知道什么我不知道的事情。随后我说道：“你和莱尔是朋友。”


    他的神情中闪过一丝瞬即的哀伤，随即恢复了平静。“我们确实是朋友，”他说，“当然，我们也有分歧。他是一名健康检查员，而我开着餐厅，所以有时他过来时，我们之间会产生摩擦。比如冷柜和烤箱温度之类的问题。没什么大不了，没到需要进行几番责备的程度。我们总能过去。我明白他只是在履行职责，就像我一样。”


    “但并不是每个人都那样看问题，”父亲说。


    `Marco` 看了他一眼。“不，他们不是那样看的。村子里食品行业的大多数人都讨厌那个家伙。莱尔在做他的工作，而且做得很好。但他不喜欢冲突，有些人趁机欺负他。”


    “我看到提托·阿托（Tito Adornetto）把他从他的熟食店里推出去，”我说，“肢体冲突。”


    `Marco` 指着我说。“就像那样。他会提醒他们冷藏设置、肉类和奶酪的储存方式，但总会有反对意见。他们都知道他是对的，但没有人喜欢被告诉自己搞砸了。当你被开具罚单时，就会出现在任何人都能网上查到的报告里，如果违规情节严重，可能会导致顾客流失。”


    “莱尔曾因为开具罚单而导致有人不得不关门吗？”我问，“或者因此被人解雇？”


    “据我所知没有。”`Marco` 闭上眼睛，用布满老茧的手揉了揉，“他尽了自己的责任，但他也有同情心。他试着给人们容疑的空间。我想，某人因为他指出了*他们的*违规行为而被解雇，这并不是不可能。这是不可避免的。老板们喜欢找个替罪羊，无论他们是否真的是导致罚单的原因。”


    这让我怀疑，也许 `Death by Java` 的某人是因为莱尔的投诉而被解雇了。纳迪之前不是提到过 `Dee` 前几天没来上班吗？


    “莱尔昨天在这儿，”我说，“当他离开时，你看起来并不开心。”


    `Marco` 放下手，严厉地盯着我。“你在指控我什么吗，小姐？”


    “没有，但我很好奇是怎么了。这会不会和他被杀的原因有关？”


    `Marco` 凝视了一会儿，似乎在判断我是否诚实，然后回答道。“问题不在于我或我的店，如果你是那样想的话。莱尔进来时说他和某人相处得很艰难。他担心如果自己继续施压，他身上可能会发生什么事。我告诉他他反应过度了。他因为我不认真对待而生气，就走了。”


    “然后他就去世了，”父亲说。


    `Marco` 缩了了一下，仿佛被打了一样。“这就是我今天关门的原因。我一听到发生了什么，就觉得莱尔的死部分是我的错。”他深吸了一口气，颤抖着，“我本应该听他的，把他的顾虑放在心里。我让他就这样离开了这里，甚至没有提议帮忙调解。我本可以打电话，给几个人打个招呼的。但我没有。莱尔的死是因为我什么都没做。”他拳头重砸在桌子上，震得桌子和我都跳了一下。“为什么在我有机会的时候不听呢？”


    他推开椅子走开了。他穿过房间，收拾起桌上残留的垃圾。把垃圾倒进桶后，他站在那里背对着我们站了很久，才回来，但他并没有坐。“我想回家了，所以如果你们愿意……”他指向门口。


    父亲和我一起站了。。“我还有一个问题，”我推回椅子时说道。


    `Marco` 的表情紧绷了一下，但他示意我继续说。


    “莱尔害怕的人是谁？”我很确定自己已经知道答案，但我想从别人口中听听。


    `Marco` 带我们走到门口，一路上下颌紧绷，仿佛在把话说出口之前必须先反复嚼一遍。他在手按锁上时停了下来，转过头直视我的眼睛。他声音里的热气简直能烫掉漆。


    “是那个呆货瓦莱莉·坎普（Valerie Kemp）所谓的男朋友，”他吐口道。“米基·罗宾斯（Mickey Robbins）。是他威胁莱尔的人，如果他不是杀手，我会感到很意外。”


    # 8


    `米基·罗宾斯`。在每个地方，他的名字——以及本人——似乎都在出现。


    电视开着，但没人看。父亲手里拿着平板电脑，正盯着他经纪人发来的最新版合同。我不确定合同是否有争议点，又说他紧锁的眉头是因为还是看不懂那些法律术语。


    `Laura` 在过去的一小时里进进出出，关照着我们，但没有过度打听我们发现了什么。她已经准备好了去海滩所需的所有物品，并问了我们两次是否还计划去。我们都向她保证过。


    我不确定她是否相信我们。


    还有保罗……在我们从意大利卷饼回来后，接到一个简电话，告知他仍在协助当地警方处理案件。他承诺很快就会回来，随后他就离开了。


    所以，在无事可做时，我在脑海中反复演练所知的一切，希望能产生灵感来解决案件，让我能无压力地享受接下来的假期。


    `Death by Java` 陷入了困境。健康检查员莱尔·卡里根（Lyle Carrigan）威胁要给他们开具罚单。瓦莱莉认为莱尔在骚扰她。提托对自己的店面也有同样的想法。米基不喜欢这一点，他几乎当着大家的面威胁了莱尔。连
    `Marco` 都知道这件事。


