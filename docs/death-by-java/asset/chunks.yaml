  trans: '


    这意味着亚伦并没有把他看作竞争对手，与米奇不同。


    虽然他没有说出口，但显而易见，亚伦想要莱莉里回来。只要看他看她的眼神，看他对她的担忧，一眼就能看出来。


    但是他对莱莉里·坎普的这种，我敢称之为`执念`，是否会让他杀死像莱尔·卡里根这样的人，仅仅为了让米奇·罗宾斯显得难看？


    我正试图构思某种问题，既能给我答案，同时又不会让我的想法表现得太明显，这时门开了，麦肯西侦探走了外面。“里面都处理好了，”她说道。如果她对在车道道上看到亚伦感到惊讶，她也没有表现出来。“汉考克小姐，能聊吗？”


    亚伦向门口走了一步，随即又改变了主意。“我可以检查一下莱莉里吗？”他对侦探问道，极尽礼貌。


    麦肯西审视了他片刻，然后点了点头。“她在里面。”她看着亚伦匆忙走进屋里。“那个女人身上的粘人简直比魔术贴毛衫还多。”她转向我。“坎普小姐给你打电话了？”


    *魔术贴毛衫？*我甩掉这个念头。“她打了。”


    “她对她的男朋友有担心，而且她打给了*你*。”最后一个词上的重音伴随着一个未说出口的问题。*为什么？*


    “我们认识很长时间了，”我说，尽管*认识*这个词用得有点重了。“而且这几天我一直在 `Death by Java` 帮帮忙，我想她可能认为我对于正在发生的事情会有一些见解。”


    “关于她的恋关系？”她语气平淡。“从我所了解，你们两个几乎互不认识。你不再住在这附近了，对吗？”


    “不，我不住在这里了，”我承认道。“而且说实话，我不知道莱莉里为什么要打电话，除了我比较方便。也许她不想和她的前任们谈论她现在的男朋友，因为那样会很尴尬，可能会伤到一些人的感情。”


    “那为什么不给朋友打电话呢？”麦肯西问道。“她经常见的人。你们现在简直是陌生人。”


    我对此感到反感，但老实说，她没错。“她可能想要一个新鲜的观点。我了解米奇仅限于表面。我对他没有先入为主的观念，没有过去的历史。”


    “一个局外人的意见？”


    我点头。“她担心米奇可能是伤害莱尔的人。由于他们过去的感情关系，休斯和亚伦很可能会倾向于同意她的观点。我想她的某些朋友可能也有同感，特别是如果他们对米奇有负面评价的话。”


    “你呢？”


    “我不知道，”我说。“这不是我评价的范围。我来这里，告诉莱莉里她应该把她知道的一切都告诉你们，然后……”我朝她比了比，仿佛在说，*“现在我的任务完成了。”*


    麦肯西注视了我良久，才问道：“关于卡里根先生的平板电脑，你能告诉我什么？”


    我犹豫了，对这种突然转折感到惊讶。“他的平板电脑？那个带着橡胶壳的？”


    “我想是那个。”


    事实突然涌上心头，我睁大了眼睛。“丢了？”


    麦肯西只是盯着，既不确认也不否定。但如果她问的是平板电脑，那么很有可能是警方还没有找到它。莱莉里*确实*提到过它不在他的尸体旁。我本以为他把它留在了车里，或者在家里，但万一杀手拿走了呢？


    “我每次看到他时，他都带着它，”我思索着。“他用它工作，所以我不知道他是否曾为了私用随身携带。”


    “你最后一次看到它是什么时候？”


    我回想起来。“我想是我最后见到他的时候。”


    麦肯西的表情变得不耐烦。“是时候……？”


    “在意大利卷饼，”我说，尽管不确定性破坏了语气。“我很确定那是我最后一次见到他。”


    “‘很确定’？”


    “几乎肯定，”我纠正道。“就在我到达时他正离开。那时他带着平板电脑。”我等了一下，然后说道：“莱莉里告诉我，她发现他的尸体时他没有带平板电脑。我推测你们没有在他家里找到它？”


    我简直像是在对着墙墙说话。“如果你还记得其他可能见到卡里根先生的场合，请告诉我。”她看了一眼手表，皱起眉头。“我想和你谈谈罗宾斯先生，但我还有别的地方要去。”


    “我不确定能关于米奇告诉你比莱莉里已经告诉你的更多的信息，”我说。“正如我之前提到的，我几乎不认识他。”


    “尽管如此，我想和你聊聊。我会联系保罗，安排一次见面。”当她提到保罗这个名字时，她的神色发生了变化。眼神亮了些，紧张感消失了。那是我每当想到他时都会产生的反应，而这对我*我*来说是正常的。我不喜欢在另一个女人的脸上看到这种反应。


    “我不确定我们会有多少时间，”我说，努力不让语气里带着刺刺。我并不嫉妒。不，真的，我并不嫉妒。


    并不真的。


    “我相信我们能想办法的，”我说，努力不让语气里带着刺刺。我并不嫉妒。不，真的，我并不嫉妒。


    并不真的。


    “我相信我们能想办法的，”我说，努力不让语气里带着刺刺。我并不嫉妒。不，真的，我并不嫉妒。


    并不真的。


    “我相信我们能想办法的，”我说，努力不让语气里带着刺刺。我并不嫉妒。不，真的，我并不嫉妒。


    并不真的。


