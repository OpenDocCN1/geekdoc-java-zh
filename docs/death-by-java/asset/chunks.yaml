  trans: '


    “我怀疑他们甚至不会获准开门，所以我我不确定能做什么，”我说，“我已经给过 `Valerie` 了一份她可以修改的清单，只要她按照那个清单做，我就没什么可为了。而且如果我跑去她家找她谈谈，她可能会直接把我踢出去。或者根本无视我。”


    “但如果你愿意努力，向她表现出你的诚意，她可能对你的态度会软化一些，”爸爸说道，“我知道在你小的时候，`Valerie Kemp` 并不是你最喜欢的人。你试图掩盖这一点，但我看到她是怎么对待你的。”他简短地抿了抿嘴，接着继续道，“但人会变的。我知道她现在很难相处，但总有一种可能，那是一场戏，是她维持面子的方式。”


    “装作一个得自是的坏蛋女孩的面子吗？”劳拉问道。


    我考虑了一下。我不认为 `Valerie` 有了多大的变化，但这重要吗？一个男人死了。这事发生在她的书店咖啡馆里。


    她认识的人可能卷了其中。


    “Mickey 的手包着，”我说，“而且他没有试图进去查看 `Valerie`。如果他没做任何错事，你不认为他至少会*尝试*穿过 `Mr. Mustache`
    去确保她无事吗？”


    “`Mr. Mustache`？”劳拉笑着问。


    “外面的那个警察。警官……”我皱起眉。


    “`Peel`，”爸爸提供了信息，“他的名牌上写着 `Peel`。”


    “就是他。”我的手指在桌子上敲击着，“Officer Peel` 守着门，但我成功绕过了他。”当然，`Valerie` 把我拉进屋子让他有些措手不及，但我还是进去了。“Mickey
    躲在视线之外，表现得像是不希望任何人看到他。我上次看到他时，手还是完好的。”而那恰恰就是他几乎威胁过 `Lyle Carrigan` 的一天。


    “你真的觉得这个叫 `Mickey` 的家伙是杀手吗？”爸爸问。


    “我不确定是否*真的*有杀手，”我说，“侦探是在假设 `Lyle` 被谋杀的前提下工作的，但她并没有直接说是他。这可能是场意外。也许 `Lyle` 是非法呆那里的，然后心脏发作或类似的情况。她可能是在试图弄清楚他为什么在那儿。”


    当然，根据她问的问题，我怀疑不是那样。`Lyle` 被谋杀了。`Valerie` 的男朋友是头号嫌疑人，至少在我心里是这样。一旦 `Detective McKensie`
    知道了他的受伤和可疑行为，他也会成为她的目标。


    “假设这*是*谋杀，”爸爸说，“我们知道什么？”


    我考虑了一下，说道：“Mickey 冲到 `Lyle` 脸前，警告他离开 `Valerie`。”


    “`Death by Java` 现在已经很挣扎了，”爸爸补充道，“如果卫生检查员把他们关停掉，哪怕只是几天，也可能对他们伤害太大，让他们不得不永久关闭。”


    “冰冰机昨天坏了，”我说，“`Lyle` 坚持要为了这件事给 `Valerie` 开罚单，说他以后会回来检查。”


    “这让 Mickey 不爽，他之前已经告诉过 `Lyle` 放远点。”


    “所以，他对质了健康检查员，可能是在检查员回来执行检查的时候。”


    “然后，*砰！*”爸爸用拳头撞了一下手掌。“他杀了他。也许是意外。也许 `Lyle` 拒绝退缩，他在对方来得及提交报告之前解决了他。”


    “但为什么要把尸体留在 `Death by Java` 呢？”我问。


    “他可能恐慌了。”


    “或者有人路过。”我仔细思索着，“如果这件事发生在清晨，比如，就在开门之前，第一批员工到达之前……”


    “他们吵吵起来，Mickey 杀了他，但他没有时间在有人出现之前处理掉那个检查员。他从后门溜出去——”


    “我不确定有没有后门，”我说，“或者至少，我在那里的时候没有注意到。”话虽如此，当时我进后面时被 `Valerie` 和 `Roman` 分了些神，所以也有可能我忽略了。”


    “好，那么也许他躲在某个地方，等尸体被发现后，再趁混乱溜出去，”爸爸修正道，“他之后又回来看看发生了什么。就像那种杀手回到犯罪现场的陈词滥调。”


    “你们两个真是不可理喻。”劳拉起身摇了摇头。


    “你的意思是，我们是极其出色的侦探，而且可能处于正确的轨道上，”爸爸对我眨了眨眼。


    劳拉翻了个白眼。“我要去找 Find 部轻松的电影，洗洗我脑子里这些关于谋杀的话题。你们两个想和我一起去吗？”


    “我去弄爆米花，”爸爸站起来伸了个懒腰，“我觉得我们都需要休息一下。你觉得呢，小菊？”


    现在吃爆米花和看电影有点早了，但话虽如此，这一天已经够长了。几个小时的无脑娱乐听起来是让自己自己远离麻烦的完美方式。


    “好，”我说，“看电影很棒。”


    '
- fmt: '

    Speaking of Valerie; she must have seen us coming because by the time Dad and
    I reached the door, she was already holding it open for us.


    “The police have shut us down for the day,” she said as we entered. “Probably
    for a week. I don’t know what I’m going to do.”


    The dining room was empty but for the three of us. `Death by Java` coffee cups
    sat on most of the tables. I assumed the police had left them behind because customers
    sure hadn’t. Most of the cups were empty, but three at a nearby table were half
    full and still steaming.


    “Why are you here?” Valerie asked, crossing her arms as she regarded me. “Come
    to gloat?”


    “I wanted to check on you,” I said. “See if there was anything I could do to help.”


    “We’re concerned,” Dad added.


    Valerie blinked, dabbed a finger under her eye. “There’s no need to be concerned.”
    Her tone said otherwise.


    “Valerie—” I cut off as the bathroom door opened and two men came strolling out.


    I recognized `Hugh`, Valerie’s ex, immediately. A mop of blond hair hung down
    near his freckled nose. He had bronzed skin and a somewhat skinnier build for
    what Valerie usually went for. I didn’t know his last name, only that he’d once
    dated Valerie and had a hand in helping her do research for `Death by Java`. And
    by research, I mean he snuck around `Death by Coffee` and took pictures and reported
    on everything I did.


    The other man, however, took me a moment to recognize.


    I hadn’t seen `Aaron Middleton`, Valerie’s ex-husband, in years. In high school,
    he’d been the jock to her cheerleader. He wasn’t as buff as `Mickey`, never had
    been, but he was lean and muscled nonetheless. He sported a goatee that had clearly
    been bleached, considering the light brown hair on his head. Even his eyebrows
    appeared to have had work done, which, knowing what I did of `Aaron`, wasn’t a
    surprise.


    “Hey, Val, you’re out of—” `Hugh` cut off when he saw Dad and me.


    Valerie put on a strained smile. “Hugh, you remember `Krissy`, right?”


    `Hugh` nodded, seemingly struck speechless by my presence.


    Next to him, `Aaron` scratched at his goatee. “You’re the Hancock kid, right?
    I think I remember you.”


    I’d be surprised if he did. He hadn’t been as outright hostile to me in high school
    as Valerie had been. In fact, I wasn’t sure he’d noticed me, even when I was standing
    right in front of him. People like `Aaron Middleton` didn’t tend to acknowledge
    anyone outside their circle.


    “I’m `James`,” Dad said, stepping forward and extending a hand. “Krissy’s father.”
    The men shook. “I’m sorry to hear about the death. Was it murder?”


    Leave it to Dad to get right to the point.


    “It looks like it might be,” Valerie said.


    “Do the police have an idea who did it?” I asked her.


    “How should I know what the police think?” She scowled, looked anywhere but at
    me.


    So I asked her point-blank: “What about `Mickey`?”


    “What about him?” Valerie’s jaw was tight as she spoke. “He wasn’t here, so how
    would he know who killed `Lyle`?”


    “Valerie …” I took a step toward her, lowered my voice. “I saw `Mickey` outside
    when the police were here. His hand was bandaged.”


    “So? He had nothing to do with any of this.”


    “What happened?” Dad asked. “I assume `Lyle` died inside `Death by Java`?”


    Valerie hugged herself as she nodded. “In the back.” A pause, and then, “I can
    show you.”


    I blinked in surprise. “The police didn’t close it off?”


    She shook her head. “There was no need. They took all the evidence, and it wasn’t
    like there was any blood. They told me not to go back there, but a little look
    can’t hurt anything.”


    “You two go,” Dad said. “I’ll stay here.” He gave me a meaningful look before
    a subtle head tilt toward `Hugh` and `Aaron`. *He’d talk to them.*


    Valerie led the way around the counter to the back door. She paused there briefly,
    as if second-guessing herself, before she pushed through. She held the door open
    for me, then flipped on the light. As the door swung closed behind us, she pointed
    toward another door at the far end of the room, one I hadn’t noticed before. “He
    was found over there.”


    As she’d said, there was no blood on the floor, no indication that anything untoward
    had happened at all. “Does the door lead into an alley?” I asked.


    She nodded. “It’s where we keep the trash bins. I never go in or out that way,
    so I assume someone else left the door unlocked, and he came in. Someone probably
    followed him. A mugger or something.”


    The question was, of course, why `Lyle` would come sneaking in through an unlocked
    alley doorway, even if he was being chased by a thief, but I didn’t ask. “Were
    there signs of a struggle?” I asked instead. The door looked de-t-aged and undamaged.
    There was no splintering that spoke of it being kicked it. No debris on the ground
    around it.


    “He was dead,” Valerie said, deadpan. “Doesn’t that indicate that there was a
    struggle?”


    I took a deep breath, held it for a count of three, before speaking. “I meant,
    was there stuff knocked over in the room?” I gestured around at the shelves, which
    were all as tidy.


    # 7


    Sunlight streamed through the branches of the trees, casting speckled light across
    the open green of `Village Park`, which was bursting with life. A pair of squirrels
    sat atop a half-wall, busily doing squirrely things. A trio of dogs romped together
    while their owners chatted over coffee. Kids played. Parents looked on. It should
    have been uplifting. Peaceful.


    I stared down at my half-eaten pretzel, hardly seeing it. The large square flecks
    of salt reminded me of miniature ice cubes, which made me think of the ice machine
    and the dent.

