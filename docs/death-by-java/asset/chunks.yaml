    “Yeah. He fell. I don’t know how it happened, or if anyone was responsible for
    it. I was there, but I wasn’t, if you know what I mean? I suppose I was pouting
    while the rest of them were having the time of their lives.” Another sigh, this
    one heavier than the last. “One minute, Scrat was there, the next …” He snapped
    his fingers. “Gone.”


    I couldn’t imagine, but I could take a guess about how he’d felt. “You didn’t
    do it, but you felt responsible,” I said.


    “Yeah.” Mickey sniffed, wiped his injured hand across his nose. “It never left
    me. I put up a wall, I guess, so that no one could see how badly it affected me.
    Never let it down, not until Valerie.”


    A squirrel finally took notice of the pretzel pieces and rushed over. It looked
    around the park, as if wondering how it had gotten so lucky, and started stuffing
    its cheeks.


    “I screwed up,” Mickey said, watching it. “With Valerie. With, well, everything.
    I tried hard to protect her, used my size and reputation to intimidate. It’s the
    only way I know how to be.” He tipped his head from side to side, cracking it.
    “But I didn’t kill Lyle Carrigan. I want to make that clear. I didn’t much like
    the guy, and I can’t say I’m too broken up about his death, considering how he’d
    been treating my Val, but I didn’t kill him.”


    “Do you know who did?” I asked.


    Mickey flexed his fingers, as if wishing he still had a pretzel to tear into.
    “I don’t know anything for sure,” he said. “And because of my past, I don’t want
    to talk to the police about it. They already think I got away with one murder,
    so what’s to stop them from pinning me with this one? You know, make up for not
    nailing me for the last.”


    I doubted Detective McKensie would do such a thing, but telling him that wouldn’t
    matter. “You could tell me,” I said. “And I can talk to the police in your stead.
    I don’t even have to use your name. I could tell them I’d heard it anonymously.
    And even if you don’t know anything for sure, a rumor, even a *feeling*, could
    help.” Though facts would be far more valuable to the police.


    Mickey thought about it for a long time, fingers still flexing. Then he leaned
    toward me, face so close to mine, I could feel his breath on my cheek when he
    spoke.


    “I think I saw who did it.”


    My heart did one of those little jumps. I wasn’t sure what I’d expected him to
    say, but that wasn’t it. “You saw it happen?”


    Mickey cracked his neck again, did one of those shoulder rolls big guys always
    did in the movies. “No, but I saw someone outside Death by Java that night.”


    My mind was racing. “Lyle?”


    Mickey shook his head. “I never saw him, which is probably why I didn’t say anything.
    That, and, well, you know.”


    “You didn’t want to talk to the police,” I said. “But why not tell Valerie who
    you saw? Or leave an anonymous message for the detective?”


    He opened his mouth to respond, then closed it again. He did that a few times
    before making a frustrated sound. “I don’t know,” he admitted. “I suppose I was
    trying to protect Val.”


    “*Valerie* was there?” I just about bounced from the park bench.


    “No, it wasn’t Val. I thought it was at first, since who else would be hanging
    around outside Death by Java in the middle of the night? It was too late for her,
    anyway. It was too late for *me*, to be honest. I’m not as young as I once was.”'
