    I drummed my fingers on the table, a cold cup of coffee sitting forgotten in front
    of me. I was back at Dad’s, and after assuring him that everything was all right,
    I left him in his office so he could make a few calls to his agent, likely about
    that contract of his. Paul wasn’t back, and neither was Laura, which gave me time
    to think.


    The problem was, I didn’t know *what* to think. Hugh had said he and Valerie had
    left `Death by Java` by closing time on the night I’d seen the light on in the
    back. Later on, `Valerie` had implied it was only a few minutes before that, but
    she had said much the same as Hugh when I’d *first* asked her about it days ago.
    Had she gone back to the café sometime after she and Hugh had parted for the evening?
    Or had someone else been there, someone she was trying to protect?


    That made me think of Mickey. She’d been flip-flopping on him as of late, but
    she always seemed to want to protect him, even when she’d claimed she was afraid
    he might have killed Lyle. It would make sense for her to lie about being there
    that night if she knew—or even suspected—it was Mickey who’d been at `Death by
    Java` after closing.


    But if it *was* him, why was he there that late? Why was Lyle?


    That brought me to what Tito had said about the employee he’d fired. Could Lyle—and
    possibly, by extension, Marco—be responsible for that? Lyle and Marco struck a
    deal to have Lyle cite both `Death by Java` and `Tito’s Deli` so that one of them
    would be forced to close and Marco could swoop in and move the Italian Roll to
    a better location. Perhaps Lyle, needing help so that his citations couldn’t easily
    be dismissed, bribe-ed one of the employees at `Tito’s`, who sabotaged the place,
    allowing for the health inspector to come in and cite them for the manufactured
    violations.


    If Lyle had done that at `Tito’s`, then wouldn’t it stand to reason he’d likely
    do the same at `Death by Java`?


    *That’s who was there*, I thought, still drumming my fingers. Someone who worked
    at the bookstore café had been working with Lyle. Mickey wasn’t staying late,
    cheating on Valerie with someone else. Valerie wasn’t fooling around—or just talking,
    as she claimed—with Hugh in the back room. One of the girls, who were clearly
    disgruntled by the low pay and unflattering work attire, must have agreed to help
    Lyle.


    But which one?


    My phone buzzed, causing me to jump. *Vicki*. Heart thumping, I answered.


    “Please tell me that `Death by Coffee` didn’t explode,” I said by way of answer.


    Vicki laughed. “No, we’re still here. Trouble’s currently lounging on one of the
    shelves upstairs, holding court over the books, while I’m sitting here in a bright
    and shiny dining area, in a very good mood.”


    I sat up straighter. “The power issue?”


    “Taken care of.” I could hear the relief in her voice. “Our friendly neighborhood
    electrician *finally* showed up. He was here for all of five minutes before he
    had it fixed. Apparently, my husband isn’t as well-versed in electrical work as
    he thinks he is.”


    A very faint, “I heard that!” caused her to laugh, and me to smile.


    “Thank goodness,” I said, blowing out a breath as I sagged back in my chair. “I
    was worried that something major was wrong and that … I don’t know. That we’d
    lose power long-term and all our customers would stop coming in and that we’d
    never be able to get them back.”


    “That’s why I called,” Vicki said. “I knew you wouldn’t be able to relax for as
    long as everything was in limbo here. Now there’s nothing left for you to worry
    about. So, have fun already!”


    Nothing to worry about other than a murder, Valerie’s collapsing business, and
    Paul’s sudden flight out the door, likely to meet with a police detective who
    was clearly smitten with him.


    I decided Vicki didn’t need to hear about all that, so instead I asked, “Have
    you seen Lena?” If there was any other pain point left in Pine Hills, it was with
    how she was doing. “She called a few days ago. She was worried about how things
    were going with her training.”


    “She was here earlier today, actually,” Vicki said. A pregnant pause followed
    before she added, “There’s good news and bad news.”


    *Uh-oh.* “Did Buchannan do something to upset her?”


    “Quite the opposite. It looks like Lena will be joining the Pine Hills Police
    Department as a full-time officer of the law. From the way I hear it, she’ll be
    partnered up with Becca Garrison, which, if you ask me, is a perfect fit.”


    I suppressed a squeal before asking, “What’s the bad news?”


    “The bad news isn’t really *bad* news, per se. Lena was here because she had to
    put in her notice. Hard to work at a bookstore café when you’re spending most
    of your time patrolling the streets, hunting for criminals.”


    “True.” I let myself feel sad for a couple of seconds before shaking it off. “I’m
    going to miss having her working behind the counter, but she’s doing what she
    wants, and that’s what matters. Besides, she’ll probably be in daily for coffee.
    It’ll be like she never left.”


    “I agree.” Vicki huffed out a sigh, and I imagined her pushing her way to her
    feet. “I should get going. I just wanted to let you know that everything’s good
    here.”

