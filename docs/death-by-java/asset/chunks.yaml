    Leanne picked at her thumbnail. I noted it was already red and agitated. “It was,
    I don’t know, two years ago? Maybe three. Lyle was off doing some training thing
    out of town, and I was here alone. I called Roman because the fridge was acting
    up. He came over and made a move on me. It caught me by surprise, so it took me
    a moment to react, which he took as an invitation. He kissed me, and I suppose
    I might not have resisted at first, but then it hit me all at once, and I pushed
    him away. I told him to leave, but he wouldn’t go. I almost had to call the cops.
    Thankfully, Lyle called right then, and he scurried out the door before I could
    tell on him.”


    That wasn’t how Roman described their relationship, but I wasn’t about to open
    that can of worms. “Did you tell Lyle about what Roman had done?”


    Leanne looked up from her thumbnail and studied us for a long moment. “Even if
    you only knew Lyle a little bit, you would realize that telling him something
    like that would have destroyed him. He wouldn’t have blamed me, nor would he have
    gotten angry at Roman. No, instead, Lyle would have questioned his own self-worth.
    Nothing had happened, yet he’d always think that Roman made his move because he
    knew how unworthy Lyle was, which couldn’t be further from the truth.” She took
    a shuddering breath.


    Guilt caused me to rise. “I’m sorry, Leanne. I didn’t mean to upset you.” I motioned
    for Dad, who stood. I wanted to ask her what she’d been upset about when Roman
    had last talked to her, but now didn’t feel like the right time. “We should probably
    go.”


    She nodded and led us to the front door, but she didn’t open it right away. She
    stood there, back to us, hand on the knob, unmoving. Unspeaking. It was clear
    she was working through something, and I let her do it.


    “Lyle let people walk all over him,” she said after a moment. “His job caused
    strife between him and the business owners he was forced to cite. He didn’t enjoy
    it, and he often felt guilty about it whenever it happened.”


    Dad and I shared a look, waited her out.


    “But recently, things had gotten so bad, Lyle was starting to worry. I said before
    that he never complained, but that wasn’t quite true. Over the last few weeks,
    he’d been really upset. I asked him why, and at first, he told me it was nothing.
    He’d take care of it, he’d said. And then that man showed up outside.”


    “Mickey Robbins,” I said.


    She nodded. “Lyle told me a little about him, about why he was angry with him.
    He said it was about some citations he’d been forced to make, that this Robbins
    guy was protecting his girlfriend or wife or whatever she was. But I knew there
    was more to it than just a simple health violation that had the other man worked
    up. I could hear it in Lyle’s voice.”


    “Did you ever find out what it was about?”


    She shook her head. “I called his work, but they didn’t know anything. Or at least
    that’s what they said. And Lyle … He …” A deep trembling breath, then, “This is
    something I didn’t tell the police. I don’t know why I didn’t say anything. I
    guess I was scared. Lyle was just—” Her hand tightened on the doorknob. “He died,
    and I suppose I was afraid that his killer might come for me next if I said something.
    I thought it was the Robbins guy or maybe Roman because of how I’d rejected him
    not once, but twice.”


    She turned, revealing eyes filled with tears. “But I’m not so sure that was it.
    You see, Mickey Robbins had a reason to be angry with Lyle, though when he showed
    up outside here, he didn’t know it.”


    She opened the door, stepped aside. Sunlight streamed in, casting a glow upon
    the dimly lit interior. Dad and I walked past Leanne, into the light. She didn’t
    close the door behind us, but rather, she stood there, tears rolling down reddened
    cheeks. The hand on the doorknob was clenched into a fist so tight, her knuckles
    were white.


    “Talk to Marco Rossi,” she said. “Ask him about Lyle and the deal they made. If
    anything, `that’s` the reason why my husband is dead. And if anyone, he is the
    man who is responsible.”


    And then, without another word, she stepped back and closed the door.


    # 18


    “Yeah, I’m sorry about this,” Dad said, phone to his ear. “Right. Uh-huh.” He
    glanced at me and winked. “It’ll probably be an hour at most. Yep. See you then.”
    He clicked off and shoved his phone into his pocket. “I don’t think she believes
    me.”


    “Of course she doesn’t,” I said as I opened the car door and slid out. “A flat
    tire? Really?”


    “I didn’t know what else to say,” Dad said, joining me on the sidewalk. “I didn’t
    want to tell Laura we were off chasing killers like a couple of mopes from one
    of my novels.”


    “She knows, Dad. She knows.”


    We walked the short distance to the Italian Roll side by side. Customers were
    seated outside, enjoying their pizza rolls, and all those old memories came flooding
    back once again. But now, knowing there was a chance Marco Rossi could very well
    be a murderer—or tied to one—I couldn’t summon the enthusiasm for those little
    squares of lava.

