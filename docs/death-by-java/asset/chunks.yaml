  trans: '

    “是谁？”马科问道，“卫生部门没有其他人会帮我。如果罚单停止了，那么又会有什么能迫使瓦莱丽·坎普（Valerie Kemp）出手？”他摇了摇头，“我不得不这样做。当莱尔（Lyle）晚上给我打电话时，他告诉我他不干了，再也做不下去了。我不能让那样发生，尤其是当我们离那么近的时候。我说服他等我，这样我们就可以谈谈。他同意了。但当我到达那里时，他拒绝听取理，甚至说他正在考虑自首。你能想象吗？毁了他的生活，为了什么？为了道德吗？”马科几乎是把这些话唾出来的。


    纳迪亚瘫坐在沙发上，身体抖得厉害，看起来几乎快要崩溃了。


    “所以你杀了他，”我说。


    “我还能怎样？”马科说道，“如果他自首了，就会牵连我犯下他的罪行。他只会失去工作，而我会失去我的生意。我不能让那种事情发生。”他颤抖着吸了一口气，“我试图让他明白他不能走掉，如果他这样做，会毁掉我们两个人的生活，但他不听。我抓抓住他，试图让他清醒清脑。然后……”他迎上我的目光，“我不是故意的。我放开了他，但他当时失去了平衡。他摔倒了。我不知道发生了什么。也许是因为震惊。也许他的头部正好撞到了某个地方。我不知道，但无论是什么，等我回过神时，他就躺在那里，了，在那家书店咖啡馆那糟糕的后屋里。”


    “你本可以叫救护车的，”我说，“他们也许能救救他。”


    马科笑了起来，“我为什么要那样做？他们救了他，然后他就告诉大家都发生了什么？我的处境会比以前更糟。”他在房间里来回走着，“我意识到我可以利用局势，于是我把他留在那儿，心想警察非得关掉那个地方。我拿走了他的平板电脑，因为我不知道他在里面存了，然后准备离开。”他的表情暗了下来，“因为那头被他们放进店里游走的野兽，我差点也落得像莱尔一样。”


    “奥斯卡（Oscar）？”我问。


    “它是凭空冲出来的。直接钻过我的脚尖，我差点摔了一跤。我掉了莱尔的平板电脑，它弹到了黑暗中的某处。我本想去找它，但我闹出的声音太大了，我怕有人听见了，所以在被抓到之前离开了它。”


    我能感觉到那种转变，也能看到它。当马科将目光锁定在纳迪亚和我时，一种平静的情绪席罩了他的身上。“我本会让一切顺其自然发展，但当你出现并问起纳迪亚时，我知道我必须在你有机会和她说话之前除掉她。我花比我想象中长的时间找到她住的地方，所以我们现在在这里了。”他的手从背部离开，手里握着几分钟之前还在推测的枪。“坐。”


    “马科——”


    “坐！”他的手猛地抬起，“别说了。”


    我正开始慢慢坐在沙发上，这时世界在机枪的轰鸣中爆炸了。


    我直接趴倒在地板，以为是马科开了火，尽管我完全不知道他那把小枪怎么会发出那么响的声音。在我身边，纳迪亚正尖叫，双手捂着头。在房间另一头，马科同样趴在地板上，一边破口大骂。


    走廊尽头，爸爸像一头半疯的牛一样朝我们冲过来。


    我错过了大部分发生的事情。机枪“哒哒哒”的声音响彻了纳迪亚的公寓。纳迪亚的尖叫，以及当我试图理解发生了什么时耳朵里随后的鸣响。


    爸爸冲过走廊，撞上了马科，马科刚开始从他摔倒的地方站起来。一阵扭斗声，接着是一声沉闷的撞击声。我的心猛地一紧，我挣爬起来想帮帮爸爸，但战斗已经结束了。


    爸爸把马科脸朝下按在地地上，双臂在背后折曲，那种姿势一定很疼。马科脸的一侧起了一块包，眼神中透着迷茫，告诉我他被打得很重。到处都没有弹孔。


    爸爸把手机高高举过头顶。他按了一个按钮，在把设备移到耳边之前，机枪声停止了。“抱歉吵到你了，侦探。嫌疑人已被制服。我们会等你。”他挂掉电话，抓紧了马马科的手腕，然后看了我一眼。“你应该去开门，小姑娘。麦肯齐侦探（Detective
    McKensie）马上就到。”


    # 25


    叉子碰撞餐子的声音和低声的交语声填满了房间。我坐在爸爸对面，劳拉坐在我的一侧，保罗在另一侧。我们吃饭的地方很贵，与我和保罗到达红木木村（Redwood Village）以来去过的任何地方相比，这都是完全不同的体验。


    但没关系。考虑到我经历的这一切，这是一种不错的改变。


    马科·罗西（Marco Rossi）进牢了。“意大利卷饼店（The Italian Roll）”关门了。“Death by Java”和“Tito’s Deli”还开着，尽管我不确定前者还能维持多久。据我最后听说的，瓦莱丽仍在苦苦维持经营客源。

    '
