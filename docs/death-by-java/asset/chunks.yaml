    “Something like that.”


    Jules chuckled. “Vicki has everything under control. I’ve been stopping in as
    you requested, and while there have been some fluctuations in the electricity,
    nothing has gone boom or flat-out shut off for more than a second or two. At least,
    not while I was there.”


    “Does she seem okay?” I asked. “Vicki, I mean. I talked to her, but you know how
    she is.” *How I am*, was what I really meant, but he didn’t call me out on it.


    “She’s fine. We’re all okay. Really, Krissy, there’s no need to worry. The only
    person who seems upset by your absence—and don’t take this personally—is Rita.
    She’s been in here at least four times over the last two days, asking if I’ve
    heard from you. She said something about a video chat—”


    I groaned. “Yeah. With Dad. They had a nice little conversation the other night
    on his computer. Has she been trying to reach him again?”


    “She has. She thinks you’ve taken his tablet from him.”


    “What? I have not!”


    “I told her as much when I saw her this morning. She thinks you’re punishing her
    for some reason. Honestly, I think she’s just lonely. And we all know how she
    feels about your father.”


    Did we ever. Though, while Rita had a thing for my dad, I didn’t believe she’d
    ever act on it. “I’ll make sure Dad gives her a call tonight. Paul and I are thinking
    of going to a class reunion that some old classmates of mine are putting together
    this evening. Dad should have lots of free time to talk to her then.”


    “I’ll let her know. She’ll probably rush straight home and wait with bated breath
    for the call.”


    And, knowing Rita, she’d do it with the cardboard cutout of Dad she kept in her
    bedroom watching over her.


    Don’t ask.


    A car drifted slowly down the road toward Valerie’s drive. It lingered half a
    second before continuing past. I watched as it vanished from sight.


    “I’d better let you go,” I said, mildly curious. While Detective McKensie *was*
    at Valerie’s, her car wasn’t marked, so I didn’t think it was some sort of looky-loo.
    “Tell everyone I said hi.”


    “Will do. And, Krissy?”


    “Yeah?”


    “Have fun.”


    I smiled. “I will. I’ll call you in a day or so. And I’ll do it at night, when
    you’re not at work. Maybe I can time it for when you’re at my place and you can
    put me on speaker so Misfit can hear my voice.”


    He laughed. “I’m sure he’d love that.”


    We said our goodbyes and clicked off just as the slow-moving car returned. This
    time, instead of passing by, it rolled to a stop behind Detective McKensie’s car.
    It sat there a long moment, engine running, before falling silent, and Aaron Middleton
    stepped out, a look of confusion on his face.


    “What’s going on?” he asked. His step was brisk, as if he was afraid something
    had happened to his ex. “Is Valerie all right?”


    “She’s fine, just shaken up.” I debated on filling him in, but decided it wasn’t
    my place.


    He chewed on his lower lip as he looked toward the front door. “Should I go in?”
    he asked. “I see that Hugh is here, but …” His gaze drifted to McKensie’s car.


    “Valerie had some concerns she wanted to share with Detective McKensie,” I explained,
    keeping it nice and vague. “They’re talking right now. It shouldn’t be much longer.”


    Aaron’s brow furrowed as he turned back to me. “Is this about Mickey?”


    The question caught me by surprise, but then again, should it have? “Is there
    a reason she should be worried about him?” I asked, keeping my voice neutral,
    so as not to give anything away.


    He rubbed his hands together as if trying to warm them, despite the sunny day.
    “Nah. Well, I mean, he’s not right for her, so there’s that, I suppose. There
    are days when she clearly needs him at Death by Java, even if only for moral support,
    and he never shows. Hugh and I have chipped in far more than he has. What kind
    of guy leaves his girl alone like that?”


    “You and Hugh seem to spend a lot of time around Valerie,” I said, ignoring the
    use of the term *girl* for a grown woman. “I’m surprised since you’re no longer
    together. Most people aren’t usually interested in hanging around their exes.”


    Aaron blinked rapidly, then looked away. “Yeah, well, just because we broke up,
    it doesn’t mean I don’t still care. And while Hugh is cool and all, he was never
    right for her. He’s best as a friend, and I’m pretty sure he knows it.”'
