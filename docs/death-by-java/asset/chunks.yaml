    “Krissy?” she asked, pushing open the door. Her hair was pulled into a messy bun,
    and sweat and dirt coated her face. She was even wearing a plain white T-shirt
    and jeans. It was `very` un-Valerie-like. “What are you doing here?”


    “Hi, Valerie. I wanted to check in with you.” I stepped through the doorway as
    Valerie moved to make room for me. “I heard you’re going to be allowed to open
    on Monday.”


    “We can,” she said, flopping into a chair. “It’s why I’m here now. I got to thinking
    that it might be a good idea to start working on that list you gave me and see
    if it makes any sort of difference. I have my doubts, but it’s not like I have
    much else to do at the moment.”


    I glanced around at the empty bookstore café. “No one else is here?”


    She sighed as she tossed her gloves onto the table. “Just me. Aaron and Hugh are
    busy or else I’d have called them in. And my girls …” She shrugged.


    “Have you heard from Mickey?” I asked.


    A slight tensing of her shoulders was all the reaction Valerie showed. “No, I
    haven’t.”


    “I saw him last night,” I said, watching her face for a reaction. There was none.
    “He showed up at the reunion. He brought flowers.”


    A series of rapid blinks. “He did?”


    “Gave them to me when he realized you weren’t there,” I said. “He seemed upset.”


    Valerie chewed on her lower lip, wouldn’t look at me. “So … what did he say?”


    “Not a lot,” I admitted. “He was there for you, and since you weren’t there, he
    left right away. I stopped him, and we talked for a few minutes. He said you two
    haven’t talked recently.” I paused, added, “And that you’ve been avoiding his
    calls.”


    Valerie crossed her legs and wagged her foot in clear agitation, but she didn’t
    say a word.


    “You made it sound like he was the one avoiding you,” I pressed. “Valerie, what’s
    going on?” When she still didn’t respond, I continued, “If something is going
    on between you and Mickey, something more than you being afraid he might be involved
    in Lyle’s death, you need to tell someone. The more you try to hide it, the guiltier
    you’ll look.” `Especially after what I said to Detective McKensie`, I didn’t add.


    Valerie sighed, causing her shoulders to slump. “There’s nothing going on between
    Mickey and me. We’re just having a rough patch. It happens.”


    “You were afraid he might have killed Lyle,” I pointed out. “That’s more than
    just a rough patch.”


    “He didn’t do it.”


    That caught me by surprise. “I thought you hadn’t talked to him.”


    “I haven’t.” Another sigh, this one annoyed. “But I thought about it some more
    and realized there was no way Mickey could have done it. I was just upset and
    jumped to conclusions. I may have seen him and pretended I didn’t once. That’s
    all.”


    “But—”


    Valerie abruptly stood and started for the back room. She paused halfway there,
    looked back at me. “Coming?”


    Uncertain as to what was going on, I followed her into the back room, which looked
    much the same as when I’d last seen it. The dent was still in the ice machine
    door, but that was the only thing that looked out of place.


    “See that?” she asked, spreading her arms to indicate the entire space.


    I hesitated, then said, “No?”


    “That’s right,” she said, though I had no idea what she was getting at. “Mickey
    wouldn’t have killed Lyle here. Neither would Aaron or Hugh or any single one
    of my employees. You might not think too highly of any of us, but we’re all smarter
    than that.”


    “That’s not fair, Valerie. I don’t think—”


    A hard shake of her head cut me off. “Someone else came in here and did it. I
    don’t know who, but I realized it wasn’t one of my people. It couldn’t have been.
    `You` are a more likely killer than someone I actually care about.”


    I could have been hurt by the indirect insult, but it was Valerie, so I chose
    to let it go. “Do you know who let Oscar out that night?” I asked, eyes flickering
    to the back alleyway door. “Depending on when they did it, there’s a chance they
    might have seen someone hanging around who shouldn’t have been here.”


    “I have no idea,” she said. “It wasn’t me.”


    I figured as much. “Someone murdered Lyle Carrigan,” I said. “And while you might
    not believe it, they did it here, which does indicate that it had something to
    do with Death by Java or someone who works here.”


    “I disagree. No one here had a reason to hurt him.”


    “He was going to cite you for health code violations,” I pointed out. “And I was
    told that Mickey went to Lyle’s house and stood outside in a threatening manner.”


    “He does stuff like that,” Valerie said with a dismissive wave of her hand. “Mickey
    hoped it would scare him off.”


    “And it didn’t work. So, what’s the next step? Try to scare him off physically?”
    I softened my tone. “Look, Valerie, just because you don’t want to believe that
    someone you know could have committed murder, the evidence appears to point that
    way.”


    She crossed her arms, but she didn’t say a word.

