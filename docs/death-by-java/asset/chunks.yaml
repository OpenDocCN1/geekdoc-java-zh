    I felt we were getting off the topic of what was important, so I veered the conversation
    back to where I believed it should be. “Mickey punched the ice machine,” I said.
    “Do you think he killed Lyle?”


    “Of course not!” Valerie sounded genuinely appalled that I’d even consider the
    notion, even though she’d thought along those same lines recently. “He doesn’t
    have that sort of violence in him.”


    Considering the ice machine, I wasn’t so sure. “I heard a rumor that he was connected
    to another death a few years ago. A friend of his died, and there are rumors Mickey
    might have killed him.”


    Valerie waved away the idea. “That’s ridiculous. Mickey would have told me if
    he’d *killed* someone.”


    I almost pointed out that no, killers didn’t often confess their crimes to anyone,
    let alone someone they were in a relationship with, but I let it go. It sounded
    like Valerie knew nothing about what had happened, so asking her about it was
    pointless. Hopefully, she’d at least consider what I’d said, just in case it turned
    out to be true.


    “I understand your concerns, Krissy, I really do,” she said before I could come
    up with something else to say. “But there’s nothing you can do to help me anymore.
    Lyle died. I was mad at Mickey for getting mad at me, so we fought, and I started
    thinking that maybe he killed Lyle just to spite me. He didn’t. But now we’re
    all screwed up, and I don’t know if we’re ever going to be able to mend our relationship.”
    Her lower lip pouted. “It’s not fair!”


    No, it wasn’t. And something felt off about how she and Mickey were suddenly having
    troubles. Sure, Lyle was dead, but you’d think that would have brought them closer
    together. Valerie wanted comfort. Mickey could have provided it.


    And yet, he hadn’t. She claimed he was avoiding her, but was he? He’d shown up
    at Bray’s impromptu reunion at Hooties, looking for her. When I’d confronted him,
    he’d claimed she was avoiding *his* calls. Something wasn’t adding up, and I was
    beginning to wonder if perhaps there was more to it than two adults giving each
    other the silent treatment.


    “Let me see your phone,” I said, an idea forming.


    “What? Why?”


    “Just …” I made a “gimme” motion with my hand.


    Valerie narrowed her eyes, but she retrieved her phone from a small purse I hadn’t
    noticed sitting on a nearby shelf. She held the device tightly a moment before
    handing it over.


    I shouldn’t have been surprised, but the screen wasn’t locked, so I was able to
    access her data without a password or fingerprint. I went to her recent calls
    list and immediately saw the problem.


    “Valerie …” I turned the phone toward her.


    She stared at it blankly. “What am I supposed to be seeing?”


    “Mickey’s number.” I tapped the screen next to it. “That symbol. He’s been blocked.”


    “On my phone?” She scrunched up her nose. “That doesn’t make sense.”


    “Well, he is.” And I had an inkling as to who might have done it. “Here.” I went
    ahead and unblocked his number. “Try him now.” I handed over the phone.


    Valerie gave me a skeptical look, then tried. “Straight to voicemail,” she said.
    She sounded exasperated. “I told you—he’s avoiding me!”


    “Or your number is blocked on his phone, too,” I said. “I bet he didn’t do it
    either.”


    “I don’t get it. You think it was an accident?”


    Valerie might not “get it,” but I thought I was starting to understand. And, no,
    I didn’t believe it was an accident that they’d both managed to block one another
    without realizing it. “I’m going to talk to someone,” I said. “After I do that,
    I’m going to contact Mickey and get this whole thing sorted out. You should expect
    a call from him sometime later today, tonight at the latest.”


    “I guess, but—”


    I started for the door. “Everything is going to work out, Valerie. Just sit tight.”'
