    # Then what about Tito? He’d had Lyle’s tablet. He’d been thrown into the mix
    by Marco, which meant Lyle had been hounding him just as much as he was Valerie.
    Could she have told Tito what Lyle was doing after she’d learned about it from
    Roman? In a fit of rage that fit with what I knew of the man, Tito killed Lyle
    and left his body in `Death by Java` because he didn’t approve of Valerie’s methods?


    But again, if that was the case, how did he get the body into the bookstore café?
    I was missing something, and I had no idea what it could be.


    “Are you okay?” Paul asked, nudging my shoulder.


    “Yeah. Fine. Why wouldn’t I be?”


    “You have that look on your face.”


    “What look?”


    Paul took my hand. “The one that says your mind is running a million miles an
    hour. The one that says you’re thinking about murder and how you can get yourself
    tied up into the investigation.”


    “I’m not—” A building caught my eye, and I yanked my hand out of Paul’s own so
    I could point. “Dad! Pull over.”


    He didn’t question it, pulling up to the curb with a smooth jerk of the wheel.
    A horn honked behind us, just before a car zipped past, going far faster than
    they should be.


    “Give me five minutes,” I said, pushing open the door and stepping out of the
    car. “I’ll be right back. I promise.” Before anyone could respond, I hurried for
    the building situated smack-dab in the middle of a bunch of other similar, boring-looking
    buildings downtown.


    The Redwood Village Health Department was fronted by a bunch of windows, all covered
    with long, heavy drapes that made me wonder why they bothered to have windows
    at all. It was a rectangular box, otherwise. A blast of cold air hit me the moment
    I was through the front door, and then it was gone as I moved farther into the
    building. A sign on the wall pointed the way to the food safety department. I
    followed the arrow, not quite sure why I was there, but my instincts had told
    me to come in, so here I was.


    “Can I help you?” A large woman was sitting at a desk too small for her. She had
    an enviable head of dark curls that cascaded around broad shoulders hidden behind
    a knit sweater.


    “Hi, sorry to bother you.” I scanned the area behind her, but there was no one
    at the handful of desks clustered together in a series of identical rooms. “Lyle
