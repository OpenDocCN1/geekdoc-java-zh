    # KILLER UNKNOWN


    Lyle was found inside Death by Java. He’d gotten in because someone with a key
    had let him in; I was sure of it. That meant the killer had to be Valerie, Mickey,
    or one of her employees, which consisted of a bunch of women in pink dresses and
    white bows. I knew women could be killers, just like men, but it was hard to imagine
    someone like Farrah murdering Lyle, even as small as he was, while she was wearing
    a pink dress.


    And there’d been no blood. Could one of the women have strangled him? Bludgeoned
    him to death? If so, with what? I needed to know the cause of death to even know
    what to think.


    “Someone had to have had a good reason to kill him,” Dad said, cutting into my
    thoughts. “I doubt it had to do with some minor health violation. He might have
    seen something he wasn’t supposed to see. Or perhaps he had enemies beyond Valerie
    …”


