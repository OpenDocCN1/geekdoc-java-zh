- fmt: '

    “Give them a few minutes,” I said, depositing the tray in the middle of the table.
    “Or else you’ll scald yourself.”


    “Hey, Krissy,” Paul said, nodding to a point past my shoulder. “Isn’t that the
    guy we saw arguing with Valerie at Death by Java yesterday?”


    I turned and was surprised to see `Lyle Carrigan` hurrying from the back office,
    his tablet tucked under his arm. The owner of the Italian Roll, `Marco Rossi`,
    followed him out with a frown. He watched Lyle leave and then, with a frustrated
    shake of his head, headed behind the counter.


    “Do you think there’s health code violations going on here?” Paul asked, picking
    up a pizza roll and then quickly dropping it back onto the tray before blowing
    on his reddening fingers.


    “I don’t know.” A brief war went on inside my head before I stood. “I’ll be right
    back.”


    “Krissy …”


    “I know, I know,” I said. “But if this Lyle guy is hounding more than one business
    in town, it might make Valerie feel better.” I didn’t know why I cared so much,
    but I did. “Give me five minutes, and then we can eat.”


    Paul sighed, but nodded. I left him to his burnt fingers and joined Marco at the
    counter.


    “Can I help you?” he asked, barely looking up from the register.


    “Hi, Marco. You probably don’t remember me. I used to come in here all the time
    when I was a kid.”


    He glanced up. There wasn’t even an inkling of recognition in his eyes. “I’m happy
    you’ve come back. Have you ordered?”


    “I have. We’re just waiting on it to cool.” I smiled, earning myself nothing more
    than a stare. “I was wondering …” I glanced toward the door that Lyle had recently
    exited. “That was Lyle Carrigan, right? The health inspector?”


    A pause. “It was.”


    “There’s nothing wrong here, is there? I love this place and—”


    “No, no, it’s nothing like that,” Marco said. “Lyle and I have known each other
    a long time.”


    “I see.” I peeked over at Paul. He tried to pick up another pizza roll and dropped
    it right back onto the tray. “I saw him at Death by Java and Tito’s Deli, so I
    was curious. It seems like he’s hanging around a lot.”


    Marco sighed. “Lyle’s doing his job, though not everyone appreciates it. It’s
    sad because I would have loved to move the Italian Roll to that part of town,
    but I was outbid. Why they can’t keep their places up to standards, especially
    in an area with such potential, I’ll never know.” He shook his head. “If you’ll
    excuse me, I need to …” He gestured toward the register.


    Thanking him for his time, I returned to the table.


    “Everything good?”


    “Looks like it.” I glanced back at Marco, who was counting money.


    “You don’t believe him?”


    Did I? Marco hadn’t looked happy when Lyle had left, friends or not. It made me
    wonder if the health inspector was hounding him about something. If so, that would
    make three businesses in town that I was aware of that had a problem with Lyle
    Carrigan. My guess is that they weren’t the only ones.


    But it was none of my business what was going on in the Village when it came to
    Lyle and his job. I turned my attention to Paul and the pizza rolls between us.
    “Ready?” I asked Paul, picking up one of the steaming bites. “They’re still hot,
    but they should be edible by now.”


    Paul picked up his own roll, blew on it. “As ready as I’ll ever be.”


    We dinked them together, and as one, took a bite. Piping-hot marinara and mini-pepperonis
    shot onto my tongue, instantly scorching any and all tastebuds from it. I gasped,
    then somehow managed to chew and swallow with my mouth hanging open. Steam billowed
    with every huffing bite.


    Paul, who’d managed to eat his without burning himself, watched me with amusement.


    “Hot,” I managed, snatching up my Coke and downing half of it in one go.


    “But good.”


    That, they were.


    Setting my Coke aside, I took another bite.


    # 5


    I went to bed that night feeling pretty good about the prospects for the rest
    of my vacation. Valerie had the list of fixes she could make to Death by Java
    to improve business—and to get Lyle off her back. If she decided to ignore my
    suggestions, that was on her. If she followed through and he still hounded her,
    then she had grounds to complain to his bosses. Either way, I’d done my part,
    and I was determined to focus on family for the rest of the trip.


    The plan was simple. Friday would be dedicated to Dad. We’d go to some of our
    favorite places, spending father/daughter time together, starting with breakfast
    at one of Dad’s favorite local places, the Scramble, downtown. From there, we’d
    head back to the house, pick up Laura and Paul, and make a day of it. No Valerie.
    No Lyle. Just us.


    “Well, that can’t be good.”


    Strobing red-and-blue lights lit up the early morning sky as Dad and I pulled
    to a stop near Death by Java. A small crowd had formed outside, mostly made up
    of people who were dressed as if they were on their way to work, though a few
    joggers were thrown into the mix.


    “I wonder if the ice machine exploded,” I said, eyeing the ambulance parked out
    front next to a pair of police cruisers. “The guy who fixed it didn’t look much
    like a repairman.”


    Dad made a noncommittal sound.


    “Yeah, I don’t believe it either.” My heart was doing one of those slow, heavy
    thumps that made it feel as if it were trying to pound its way straight out of
    my chest. The scene looked all too familiar, and a sense of surrealness flowed
    through me. “We should probably check it out.”


    Dad didn’t respond. He merely found a place to park, which was far easier this
    time of morning, and we were soon pushing our way to the front of the crowd gathered
    before Death by Java. A police officer was standing in front of the door with
    his arms crossed, attempting to appear imposing, though his scrawny frame made
    that difficult. He wore large, thick shades, and he had one of those mustaches
    favored by policemen on old television shows. His name tag read `PEEL`.


    I peered past him, into Death by Java, but there was little to see. A pair of
    cops were in the dining room, just standing there. They were looking toward the
    front counter, which, from where I stood, was just out of sight.


    “What happened?” Dad asked the woman next to him.


    “Someone died, I guess.” She yawned as if this thing happened all time. “Can’t
    see a thing.”


    “Buttercup.”


    The tone of Dad’s voice had me turning back to Death by Java. Valerie had moved
    within view, arms and hands in constant motion as she spoke to someone out of
    sight. She gestured toward the door without looking my way, then threw her hands
    into the air in what appeared to be frustration.

