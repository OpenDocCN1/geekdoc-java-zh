    提到瓦莱莉；她一定看到我们走过来了，因为当我和父亲走到门口时，她已经为我们开着门。


    “警察今天让我们关门歇业了，”当我们进去时，她说，“可能要关一周了。我不知道我该怎么办。”


    餐厅里空空如也，只有我们三个人。大部分桌子上都放着 `Death by Java` 的咖啡杯。我猜警察是把它们留下的，因为顾客们肯定没留这么多。大部分杯子都是空的，但附近一张桌子上的三个杯还有半满，正冒着热气。


    “你为什么在这儿？”瓦莱莉交叉双臂，看着我问道，“来幸灾乐祸的吗？”


    “我想来看看你的情况，”我说，“看看我能做什么帮到你。”


    “我们很担心，”父亲补充道。


    瓦莱莉眨了眨眼，用手指擦了一下眼角。“没必要担心。”她的语气却说明不是。


    “瓦莱莉——”我被打断了，这时浴室门开了，两个男人悠闲地走了。


    我一眼认出了 `Hugh`，瓦莱莉的前男友。一头金色的头发垂在他满是雀斑的鼻子旁。他皮肤黝黝的，对于瓦莱莉通常喜欢的类型来说，身材显得有些瘦。我不认识他的姓，只知道他曾和瓦莱莉交往过，并曾帮她为
    `Death by Java` 做过研究。我所说的研究，是指他偷偷溜进 `Death by Coffee` 拍照并报道我所做的每一件事。


    然而，另一个男人，我花了一会儿时间才认出来。


    我已经多年没见过 `Aaron Middleton` 了，他是瓦莱莉的前夫。在高中时期，他是运动明星，她是她的拉啦队队长。他不像 `Mickey` 那么强壮，从来不是，但看起来依然很精干且有肌肉。他留着小络胡，考虑到他头上浅褐色的头发，胡子显然是漂白过的。甚至他的眉毛似乎也做过手术，考虑到我对
    `Aaron` 所做过的事，这并不令人意外。


    “嘿，Val，你出来——” `Hugh` 在看到我和父亲时打断了。


    瓦莱莉露出一丝勉强的微笑。“Hugh，你还记得 `Krissy` 吧？”


    `Hugh` 点了点头，似乎被我的出现震得说不出话。


    在他旁边，`Aaron` 挠了挠小络胡。“你是 Hancock 家的孩子吧？我想我记得你。”


    如果他真的记得，我会很惊讶。在高中时，他并没有瓦莱莉那样对我表现出敌意。事实上，我不确定他是否注意到过我，即使我就站在他面前。像 `Aaron Middleton`
    这样的人通常不会理圈子之外的任何人。


    “我是 `James`，”父亲走上前伸出手，“Krissy 的父亲。”两个男人握了手。“听到这个消息我很难过。是谋杀吗？”


    直奔主题，不愧父亲的风格。


    “看起来像是，”瓦莱莉说。


    “警察有办法是谁干的吗？”我问她。


    “我怎么知道警察怎么想？”她皱着眉，看着地方唯独不看我。


    于是我直接问她：“`Mickey` 怎么样？”


    “他怎么了？”瓦莱莉说话时下颌紧绷。“他当时不在人儿，他怎么知道是谁杀了 `Lyle`？”


    “瓦莱莉……”我向她走了一步，低了声音，“警察在这里时，我在外面看到了 `Mickey`。他的手包着绷。”


    “那又怎样？他跟这一切没关系。”


    “发生了什么？”父亲问道，“我假设 `Lyle` 是在 `Death by Java` 里面去世的？”


    瓦莱莉抱着自己点了点头。“在后面。”停顿了一下，然后说，“我可以给你们看。”


    我惊讶地眨了眨眼。“警察没有封锁那里？”


    她摇摇头。“没必要。他们带走了所有的证据，而且现场并没有什么血。他们告诉我不要再回去，但偷偷看一眼又伤不了什么。”


    “你们两个去吧，”父亲说，“我留在这里。”他给了我一个意味深长的眼神，然后微微看向 `Hugh` 和 `Aaron`。*他会和他们谈谈。*


    瓦莱莉带路绕过柜台来到后门。她在那里短短地停了一下，似乎在怀疑自己的决定，然后推门进去。她为我开着门，然后开了灯。当门在我们身后关上时，她指向房间尽头的另一扇门，那是我之前没有注意到的门。“他被发现在那儿。”


    正如她所说，地板上没有血，没有任何迹象显示发生过任何不顺。“那扇门通向巷子吗？”我问。


    她点了点头。“那是我们放垃圾桶的地方。我从不在那条路进出，所以我认为是别人忘了没锁门，他就进来了。可能有人在跟着他。也许是抢劫犯之类的。”


    当然，问题是，为什么 `Lyle` 会从一个没锁的巷子门里溜进进来，即使他正被小偷追赶，但我没有问。“有打斗的痕迹吗？”我反而问道。门看起来很陈旧但完完好。没有被踢开过的裂痕。门周围地上也没有碎片。


    “他死了，”瓦莱莉面无表情地说。“难道不说明发生过斗争吗？”


    我深吸了一口气，心里数了三秒，才开口。“我的意思是，房间里有没有东西被撞倒？”我指了指周围的架子，它们都很整齐。


