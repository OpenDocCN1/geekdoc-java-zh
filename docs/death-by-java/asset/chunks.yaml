    # 1


    Warm sunlight streamed through the window of the car, hitting the dashboard. Redwood
    Village—simply called the Village by those of us who lived there—seemed massive
    compared to a small town like Pine Hills, but it was still just a cozy little
    town, sitting just outside the much bigger Los Angeles. In the years I’d been
    gone, the Village had grown by leaps and bounds, filling up with small businesses
    and more more housing developments so that I was beginning to worry they’d have
    to change the name to something that reflected the growth. Redwood City just didn’t
    have the same ring to it.


    My phone buzzed in my lap. I glanced at the screen, then turned it back over without
    answering.


    “Rita?” Paul asked.


    I nodded. “She wants me to call her as soon as I get to the house.”


    “That’s, what now? Twelve texts?”


    “Since we’ve arrived.” Another ten had awaited me when we’d landed. To say Rita
    Jonski wasn’t happy about leaving her behind was an understatement. She was a
    self-proclaimed James Hancock number-one fan, and I wouldn’t be surprised if it
    was the truth. Dad wrote mystery and thriller novels for a living, and Rita had
    read every last one of them at least five times. She’d wanted to come along so
    she could pick Dad’s brain about his latest book, but I’d refused. These next
    two weeks were for me, Paul, Dad, and Laura. I’d let nothing else get in the way
    of that.

