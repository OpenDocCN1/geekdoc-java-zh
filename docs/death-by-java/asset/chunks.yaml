    to understand how Valerie’s life had suddenly started to crumble around her, seemingly
    through no fault of her own. And despite our differences, if I could help her
    pick up the pieces, I was going to do just that.


    # 21


    I didn’t have a car.


    The realization hit me the moment I stepped outside Death by Java. I desperately
    wanted to talk to Aaron, Hugh, and yes, even Mickey, but not over the phone. I
    wanted to sit down with them face-to-face and put an end to all the speculation
    swirling around them about their relationships with Valerie. And, perhaps, find
    a way to help her love life finally sort itself out.


