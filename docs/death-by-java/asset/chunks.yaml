  trans: '

    她笑了起来。“对。。你们离开后，达尔顿警长觉得是时候让我接手一部分保罗的案件了。我和贝卡分一组，所以没那么糟。”贝卡·加里森是松树山镇当地的警官之一。我喜欢她，而且我知道她的出现会对莉娜产生镇静的作用。而帕特里亚·达尔顿警长是保罗的妈妈，也是他以及莉娜的老板。“但布坎南探员似乎总是在每个角落潜伏，盯着我的一举一动，好像他指望我会变成我正在追捕的那些犯罪分子一样。”


    “这并不意外。”约翰·布坎南和我之间有一段过节，通常他会因为我插手他的谋杀案而威胁要把我关进监狱。如果他发现我也卷入了其中一起案件，哪怕只是边缘性的，他一点也不会感到意外。


    “我害怕做任何事。万一我搞砸了怎么办？我做的事情也不过是发罚单，但尽管如此。贝卡处理所有的大案，所以我的失误不会导致某个杀人犯或小偷逃脱。我想这只是让我变得疑神疑鬼。比如，我预计他随时会从我的衣柜里跳出来。”


    一阵吱呀声，我以为是莉娜在打开那个衣柜，以确保布坎南没有躲在里面。


    “达尔顿警长怎么说？”我问。


    莉娜哼了一声。“她说我做得很好。贝卡也是这么说的。但他们可能只是在客气。你知道的，就像那种老师，总是夸你做得好，就在给你还回那张打着大大 D 的试子之前。到目前为止，我从布坎南探员那里得到的只有哼声和监视的。”


    “他可能只是对你的进展好奇，”我说，“你和他合作过很多次了，不是吗？”


    “是。”她不情愿地说道，好像知道这会导致什么结果。


    “布坎南想要想要*一切*的功劳。我不光是指破案。当你成为我们都知道的那个成功人士时，他也想要分一杯功。他会说你的一切都是从他那里学的，可能还会因此要求一个奖励。”


    “我知道，但是——”


    “没有但是，”我说，“我可能可能不在现场亲眼见证，但我知道你做得很好。如果他们不认为你能够胜，他们就不会把保罗工作量的哪怕分之一交给你。”


    在莉娜吸收这些话时，陷入了长久的沉默。“我想你是对的。”她的声音听起来既松了口气又有些沮丧。“我可能只是在无缘无故。”


    “这没什么‘可能’的。”


    接着是一声轻笑，“那边怎么样？阳光充沛吗？”


    “明天是海滩日，”我说，“我完全预计在一天结束前我会变得像只小龙虾。”


    “听起来很有趣。我希望我在那里。我确实需要一些休息时间。”


    “也许下次保罗和我来这边时，我带上你。我们可以在海滩呆一整周，忘掉所有的约翰·布坎南。”


    “我会记住你说的。丽塔已经在计划参加你的下一次旅行了。我昨天和她聊过……呼。她兴奋极了，而且不怕让所有人知道。”听到一阵摩擦的响声，接着她说，“我该让你回去忙了。替我向你爸爸问好。”


    “我会的。”一个新念头。“在你走之前，‘死亡咖啡’店怎么样了？”


    “是指人还是地方本身？”


    “两个都是。”


    “灯还亮着——大部分时候是——生意和往常一样。我们都很想你，包括客户在内。”


    *灯亮着。*


    一个闪回：莱尔被杀前那个晚上，“死亡咖啡”店里变动的光。是手电筒？还是别的什么？法拉声称第二天没有开灯，所以无论是谁在那里，在离开时都关掉了灯——或者把灯带走了。


    然后，大约二十四小时后，莱尔·卡里根被发现死在同一个后室里。巧合？还是线索？


    莉娜的声音将我从思绪中拉回来。“等你回来见，克莉丝。”


    “到时候见。”我挂断了电话，脑海中盘旋着各种可能性。


    瓦莱里声称她不知道关于灯的事。她说真话吗？还是在撒谎？米奇有没有去过那里，然后撞坏了制冰机？当罗马在第二天修理它时，我没有发现凹痕，但我并没有刻意去找。而且由于罗马和瓦莱里也站在它面前，距离近得让人不安，所以我一直把注意力转向别处，免得看到会让我做噩梦的东西。


    “家里一切都好吗？”爸爸问道，把平板电脑放在腿上。“如果你想聊聊……”


    “一切都好。”我站了起来。“我需要打个电话。”我匆忙离开房间，回到卧室以保持隐私。我在身后关上门，等了几秒确保爸爸没有跟进来，然后拨通了电话。


    电话响了四声，气喘吁吁的瓦莱里才接了电话，语气简短地问：“谁打？”


    “是我，克莉丝。”


    停顿，然后……”

