    Roman cleared his throat. “I’ll get back to work. I just gotta screw it in a little
    more, and we’re good to go.” He winked at me and then turned to the ice machine.


    “A list, huh?” Valerie walked over and snatched my phone out of my hand. “What
    is this?”


    “Suggestions,” I said, tearing my eyes away from Roman, who’d leaned over the
    ice machine in a way that was far too suggestive to be real. “To help you draw
    in more business.”


    “I see.” She frowned. “Can’t we just have someone stand outside and tell people
    to come in?”


    “You could, but once inside, you’d also want them to stay and buy something, right?
    And some of my advice should get Mr. Carrigan off your case.”


    She gave me a blank look as she handed me back my phone.


    “Lyle. The health inspector.”


    “So, he’d go away?”


    “I don’t know about that,” I said. “But he’d stop citing you.” My gaze flickered
    over to the ice machine, steadfastly refusing to acknowledge Roman’s proffered
    rear end. “What you really need is for someone to come in and go through all the
    wiring and piping, check all your connections, to make sure nothing is against
    code.”


    Valerie glanced back, gaze lingering on Roman, who seemed to notice her attention.
    He gave a little tush shake, glanced back at us, and winked once more, before
    tightening whatever screw it was he thought deserved so much of his attention.


    “It doesn’t look too bad back here,” I said, turning away to take in the rest
    of the room. Like the space behind the counter, everything was where it should
    be. The sink was empty of all but a few dishes, which I gave her a pass on considering
    the ice machine issue. “If you kept the rest of your store like this, it would
    go a long way toward drawing in customers.”


    Valerie narrowed her eyes at me. “What do you mean by that?”


    *Tread carefully, Krissy.* “The dining area isn’t as clean as it is back here,”
    I said. “I assume Lyle cites you for that more than anything, right?”


    Valerie just stared, giving nothing away.


    “There’s trash on the floor, dust. I didn’t look on the underside of the tables,
    but I bet there’s stuff stuck to them. The chairs themselves are filthy.”


    “That has nothing to do with me.”


    It was my turn to simply stare.


    “The customers do that,” Valerie said. “They should respect us enough not to leave
    their trash lying around. What they do isn’t my fault, and I shouldn’t be cited
    for it.”


    “But it *is* your responsibility.”'
