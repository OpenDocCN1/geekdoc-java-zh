  raw: 'A grease-stained waiter slouched his way over to our table. We took a moment
    to put in our orders, and then, without a word, he dragged himself to the back.


    “He’s not much of a morning person,” McKensie said with a chuckle. “Can’t get
    much more than a grunt out of him this early—and I’ve tried.”


    Which told me that Juan’s was, as expected, one of her regular haunts.


    “So,” she said after another sip of coffee, “tell me about Ms. Kemp and those
    men who hang around her like a pack of lonely puppies.” She folded her arms on
    the table as she leveled those cop eyes of hers on me.


    “I’m not sure what I can say,” I said. “Valerie was married to Aaron, who was
    her high school sweetheart. They got divorced sometime after I moved out of town.
    She started dating Hugh after that, then broke up with him. When did they get
    together? When did they break up? I have no idea. Now she’s with Mickey.” Or was.
    With the suspicion of murder squarely on him, I wasn’t so sure how long that would
    last. “That’s really all I know.”


    “See, that’s what I don’t get,” McKensie said. “Divorce. Breakups. And yet, every
    time I see her, she’s with one of these men she’s supposedly no longer with.”


    “It’s possible to break up with someone and still be friends,” Paul pointed out.


    “True, but it feels like more than that.”


    “Valerie is a flirt,” I said. “She used to make Aaron jealous all the time back
    in high school. They never fought about it, as far as I know, but I can remember
    him giving a few hard looks to a couple of guys she’d led on because she liked
    the attention and they were gullible enough to give it.”


    “I see.” McKensie chewed over that a moment. “Other than the big three, are there
    any other men who have been vying for Ms. Kemp’s attention? Recently, I mean.
    I don’t think high school flirtations would have much bearing on what’s happened
    here over the last few days.”


    I thought about the conversation I’d had with Dee about her suspicions that Valerie
    was cheating on Mickey. The only people she’d indicated directly were Hugh and
    Aaron, though she’d hinted that there might be more. “I’m not *positive* she’s
    seeing anyone on the side.”


    McKensie leaned forward. “But?”


    “But there’s speculation that Valerie might be cheating on Mickey. I have no proof
    of it, mind you.” I paused. “Though I did see her in a semi-compromising position
    with a guy named Roman the other day.”


    “Roman Haines.” McKensie’s expression darkened. “I know him.”


    “I don’t know if there’s anything serious between them,” I said, “or if Valerie
    was just looking for a way to lower the repair bill, but …” I shrugged as guilt
    dried up the words. I hated being a gossip, and that’s exactly was what this felt
    like. It was the sort of thing Rita Jablonski and her friends thrived on. Me?
    Not so much.


    “I’ll talk to him.” McKensie stirred her coffee with a spoon, though she hadn’t
    added anything to it. “Can you think of anyone else she might have flirted with,
    even innocently?” A beat, then she met my eye. “Someone like Mr. Carrigan, perhaps?”


    Before I could answer, the waiter returned. He deposited our food and left without
    saying a word. I looked down at my eggs, which had been slathered in butter, and
    my bacon, which was as flimsy as a wet noodle, with distaste. Neither McKensie
    nor Paul seemed to mind the grease-fest and started digging in as my stomach roiled.


    “Krissy?” McKensie prodded, mouth half-full.


    I poked at my egg, watched it jiggle unappealingly. “I’m not sure she was actually
    *flirting* with Lyle,” I said. “He was going to cite her for a broken ice machine,
    and she was trying to talk him out of it.”


    “By hitting on him?” McKensie asked.


    “Kind of?” I made a face. “I don’t think she would have followed through with
    it. He rejected her, so it’s moot, anyway.”


    “He rejected her?” McKensie gnawed on a slice of floppy bacon, eyes going distant.
    “Interesting.”


    Guilt had me lowering my head. I hadn’t meant to, but I’d just painted a target
    on Valerie’s back. It didn’t take Dad’s psychic superpower to know that McKensie
    was wondering if Valerie had taken exception to Lyle’s rejection and had invited
    him back to Death by Java and killed him for it. Or perhaps Lyle had changed his
    mind and returned to take her up on the offer, but instead, found himself face-to-face
    with Mickey or one of Valerie’s exes.


    Even though my food was as appetizing as soapy water, I started to eat, mostly
    because I figured that if my mouth was full, then I couldn’t say anything else
    that would incriminate Valerie. I had a feeling she’d be seeing Detective McKensie
    again very soon.


    “I told Ms. Kemp that she could open the café on Monday,” she said after a moment.
    “We’ve gotten all the evidence we physically could out of the place, so now all
    that’s left is to watch and see if anyone acts strangely.”


    “If the killer works there, then they might not show up for their shift,” Paul
    said.


    “Or they might, and will make mistakes because they’re worried someone knows more
    than they do,” McKensie added.


    “Nerves can do that.”


    She winked and pointed the last droopy bacon slice at him. “Sometimes all you’ve
    got to do is watch, and the guilty parties make themselves known.”


    “I saw Mickey last night.” The words popped out of my mouth without me knowing
    I was going to say them.


    McKensie wiped her hands on her napkin as she regarded me. “Really? Where was
    this?”


    “At Hooties.” I explained my short chat with him, making sure to include the scabs
    on his hand. Once again, I felt awful, since it felt like more gossip, but it
    was something the detective needed to know.


    “Huh.” McKensie thought about it a long moment, then popped to her feet. “I’ll
    look into it. For now, I need to get going. Meals have already been paid for,
    so no need to worry about that.” She met Paul’s eye. “Thanks for taking the time
    to meet with me.” She glanced at me briefly. “Both of you.”


    And then, with a nod to each of us, she left.


    I watched her cross the street over to the police station with my gut doing slow,
    churning flips. I regretted eating the single slice of bacon and two bites of
    egg I’d managed to force in. Even the coffee was sitting heavily in my stomach.


    “Ready to go?” Paul asked.


    I pushed my plate away. “Let’s get out of here.”


    We walked back to Dad’s car in silence. I desperately wanted to forget about everything
    we’d just talked about, to go on with my day, spend it like I’d originally planned,
    but could I really do that when I’d just made Valerie’s life even harder by siccing
    the detective on her? I mean, I was sure Detective McKensie already had Valerie
    and Mickey in her crosshairs since Lyle had been found dead in Death by Java,
    but now I felt responsible for whatever happened to them. And it was all thanks
    to my big mouth.


    “Would you mind if we went by Death by Java?” I asked as we climbed into the car.
    “I want to see if Valerie is there. We can pick Dad and Laura up after that.”


    “Sure.”


    He pulled out onto the road and drove the short distance to the bookstore café.
    Sure enough, through the front window I spotted Valerie moving around inside.


    “I’ll wait in the car,” Paul said as he parked. “I want to call Susie and check
    in with Kefka and Ziggy.” His two Huskies were being watched by his neighbor,
    who was also his regular dog sitter.


    “This should only take a minute,” I said, climbing out of the car. I approached
    the door to Death by Java, mentally going over what I was going to say. Valerie
    was on her knees, body contorted so she could look up at the underside of a nearby
    table. She scraped at it, then grimaced as something—gum most likely—fell to the
    floor.


    I knocked, nearly causing her to smack her head on the table when she jumped.
    She pushed her way to her feet and walked over, peeling off thick yellow rubber
    gloves as she did.'
