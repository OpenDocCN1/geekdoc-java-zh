    “搞定。”罗马曼（Roman）直起身子，将螺丝刀甩向空中，灵巧地接住，然后滑进工具带。“这东西不会再给你惹什么麻烦了。”他靠在制冰机上。“当然，我会留在这儿确保它运行一切正常。等你有空的时候，我们再商量报酬的事。”


    “谢谢你，罗马曼，”瓦莱莉（Valerie）说道。她避开了我的目光，但我很确定她在转过头看向我之前，向他眨了眨眼。“所以，你的意思是`我`得替这群野蛮人收拾垃圾，就因为他们太懒了，自己都不扔垃圾？”


    “是你，或者是你的员工之一，”我说。“这是工作的一部分。”


    “我是这个地方的主人，所以这不该由我来，”瓦莱莉说道，语气变得沉思起来，“但我可以让我的女孩们去做。”


    *这是个开始。* “我把清单发给你，”我说，“让她们在接下来的几天里处理一下，我肯定你会开始看到业务额的增长。这可能需要一些时间，但一点口碑会起很大作用。”


    瓦莱莉报出了她的手机号码和邮箱地址。我将两者都存入了联系人，然后把做好的清单发给了她。接着，我推开门带路回到前台，瓦莱莉尽职地跟在后面。她竟然在听我的，简直是个小奇迹，所以我决定指出几个更紧迫的问题。


    “现在，还有关于猫的问题。我——”


    “克西·汉考克（Krissy Hancock）？是你吗？”


    听到那个似曾熟悉的声音，我停下脚步，导致瓦莱莉撞到了我身上。


    “老天，*真的是*是你啊。伙计们！是学校的克西。”


    三个我以为这辈子再也见不到笑脸出现在柜台的对面。我的大脑花了一点时间来计算高中以来的岁月，但很快就对上了脸和名字。


    布雷·埃克莱斯（Bray Eckles）左眼上方还有那块大黑痣，这在他青少年时期并没有减损他的帅气，现在也是如此。塔玛拉·凯瑞（Tamara Carey）曾拥有超级模模的身材，这些年变得丰满了，尽管她的穿衣风格依然像是随时准备好走红毯。而贝比·隆（Bebe
    Long）还是，嗯，还是贝比。她看起来和几十年前一模一样。深色的头发。透着妩媚感的褐色眼睛。皮肤如玻璃般完美无瑕。


    用两个词形容，她们就是瓦莱莉的小跟班。


    多年遭受言语虐待的本能让我想要逃进后屋。我不确定这几个人是否曾有哪一个对我说过一句好话。也许这些年来他们也给过一两次明里暗暗的赞美，就像瓦莱莉喜欢说的那种，但没有一句是真诚的。


    “克西？”塔玛拉歪着头，显然没认出我。


    “是啊，小个子，”布雷说道，“你记得吧？我们以前经常和你开玩笑。”他转转向我，“在一起在一起可开心了。不是吗，克西？”


    开*玩笑**并不是*他们做过的事，但我笑了并点了点头。“好，我记得。”


    “噢是，”塔玛拉说道，上上下打量着我，“这些年你真的丰了很多，不是吗？”


    我用力咬住唇，差点出血。是的，我高中时要瘦得多，但我认识的几乎所有人都是如此，包括塔玛拉。


    “你怎么回这儿了？”布雷问。“我以为你跟着维基·帕特森（Vicki Patterson）搬到俄亥州了。”


    “等等，他们在一起过？”贝比问道，她直到那为止几乎没怎么注意。


    “没，她离开时是在和罗伯特·邓希（Robert Dunhill）交往，”布雷说道，令我很惊讶他竟然记得，因为罗伯特和我是在高中*之后*才认识的。“他们现在可能结婚了。”


    “实际上——”还没等我告诉他们罗伯特和我已经在离开*之前*就分手了，或者她现在姓维基·劳耶（Vicki Lawyer）了，门开了，保罗（Paul）走了进来。


    看到他就像感受到一阵清凉舒爽的风。我冲出柜台后，飞快地向他跑去。当我抓住他的手时，动作就像一个极度渴望拯救的人，坦白说，我确实是那样。


    我亲了他的脸颊，然后问：“爸爸和拉拉在哪？”


    “他们决定走回去，把车留给我了。”他一边给我看钥匙，一边盯着那三个人。瓦莱莉似乎被保罗的出现吸引了，绕过柜台加入了她的伙伴中。“你的朋友？”他问。


    “当然是朋友。老朋友了，”布雷说道，笑得很发自真。“克西年轻的时候很有趣。”


    *很有趣的捉弄对象*。“抱歉，伙计们。我希望留不下，我和保罗有地方要去。”


    贝比和塔玛拉似乎并不在意，但布雷看起来很失望。*他真的会认为我们曾经是朋友吗？*我明白并不是所有人都能意识到过去的行为，但他绝不可能忘记那些我因为他们的言语虐待而几乎落泪的时刻。他可能忘记吗？


    “啊，哥们儿，”他摇着摇头。“我希望我们能叙叙旧。”他的眼睛睁大了。“我知道了！你们这周六晚上来 Hooties，大约……”他看向其他人。当他们没有跳出来提建议时，他又看向其他人。


