    deserve to be thrown in jail for it. Or turned into a social pariah, for that
    matter.


    “Was there anything useful on Lyle’s tablet?” I asked, curious more than anything.
    “More than just his usual work notes and reports?”


    McKensie nodded. “There was. I’m not at liberty to say what, but let’s just say
    that even if Marco hadn’t confessed, there was enough there to put him in a bad
    way. Let’s call it the icing on the cake.”


    That was good, though, once again, it served as a point of frustration. If Tito
    had turned in the tablet the moment he’d found it, then, once again, the detective
    could have been talking to Marco right away instead of chasing other, false leads.


    “Anyway, that’s all I came in here to say.” Detective McKensie clapped her hands
    together, drawing a few curious eyes. “I hope you don’t take it the wrong way,
    but I hope to never see you again.” The smile on her face said otherwise.


    “I’m pretty sure we all feel the same,” Dad said.


    And then, with a farewell wave and a final, lingering glance at Paul, Detective
    McKensie walked away.


    “That was nice to hear,” Dad said when she was gone. “I’d like to point out that
    she didn’t yell at us for our part in what happened.”


    “The two of you are lucky you didn’t get yourselves hurt—or killed,” Laura said.
    “The next time Krissy is in town, I’m not going to let either of you out of my
    sight.”


    “That might help,” Dad said. “We could always use a lookout. Isn’t that right,
    Buttercup?”


    Laura nudged him with an elbow, but I barely noticed. I was focused on Paul, who
    checked his watch as if impatient to be gone before he resumed silently staring
    at his food.


    “I’m all right,” I said, reaching out and touching his hand. He didn’t pull away,
    but he did flinch, as if I’d startled him. “I should have told you what I was
    going to do, but you know how I am.”


    “I do,” he said with the ghost of a smile. “Impulsive.”


    “And reckless,” I added. “I didn’t mean to scare you.” Our eyes met briefly before
    he went back to his meal. I decided to let it go and changed the subject. “I forgot
    to tell you, but Oscar found his forever home.”


    “That’s the cat, right?” Dad asked.


    “The one at Death by Java, yeah. Dee was taking care of him as best as she could,
    but it was hard to do with him living at the bookstore café.”


    “That was nice of her,” Laura said. “Not everyone is willing to do that.”


    No, they weren’t. “I called her landlord the other day,” I said. “They normally
    don’t allow pets in the apartments, but after a little convincing on my part,
    he changed his mind.” I grinned. “Oscar is now living with Dee.”


    “That’s great!” Dad said. “Good for you. And her. *And* the kitty.”


    It was. It had taken some doing, too. The landlord had argued against it, but
    when offered an extra deposit for any prospective damages, he acquiesced. Dee
    didn’t know about that part, and if I had my way, she never would.


    Paul checked his watch again, then cleared his throat loud enough that I could
    have heard him from across the room.


    “I’ve got to hit the restroom,” Dad said, abruptly standing. “No fictional gastrointestinal
    distress this time, but I think my teeth are about to float away.”


    “Really?” Laura said, rising to her feet beside him. “You could have kept that
    last part to yourself.”


    “Where’s the fun in that?” Dad winked at me. “I’ll be back soon.” He took Laura’s
    arm. “Unless Laura has other uses for me while we’re back there, that is.”


    “Stop it,” she said with a laugh, but she didn’t release his arm as they walked
    away, toward the restrooms in the corner.


    I watched them go with a frown. “That was weird. I really hope the two of them
    don’t—” Whatever I’d been about to say was obliterated from my head as I turned
    around. Paul was no longer seated next to me. He wasn’t standing, either.


    “Krissy Hancock,” he said from where he knelt next to my chair, eyes glittering
    in the overhead lights. My entire universe narrowed down to the small black box
    he was holding in his hand. With a smooth movement, he opened the lid, revealing
    a ring that sparkled even brighter than his eyes. “Will you marry me?”


    Time stopped. Everything made so much sense now. His nervousness. His sudden departures
    over the last few days. The secrecy. My heart didn’t beat; no air passed through
    my lungs. I couldn’t speak, couldn’t even think. It was as if that one single
    second took an eon to complete.


    And when it did, it ended with a single, resounding word.


    “Yes.”


