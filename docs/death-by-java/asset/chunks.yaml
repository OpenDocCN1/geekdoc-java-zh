    by Java’s existence.


    “That was fun,” Dad said as the door closed behind us.


    “Shush, you.” Laura nudged him with her elbow, though she was smiling as she did.


    “Get out! Now!”


    I jumped at the shout coming from next door. A bald man with a sweaty scalp, wearing
    a mustard-stained apron, was physically shoving Lyle the health inspector out
    the door of a place called Tito’s Deli. A name tag hanging from the apron declared
    the bald man to be Tito himself.


    “I have a right to—”


    “I don’t have time for you or your rights,” Tito said with a final shove. “Come
    back when I’m not so busy.” A pause. “And when you’re not being paid to harass
    hardworking folk!”


    With that, he spun and slammed the door in Lyle’s face.


    The health inspector stood there a long moment, as if debating on whether he should
    go back in, before he tapped something into his tablet. That done, he walked quickly
    away, muttering to himself.


    “Let’s get out of here,” I said.


    Dad nodded. “Agreed.”


    I leaned in close to Paul. “I promise the Village isn’t like this all of the time.”


    He laughed. “It’s kind of charming.”


    That was one word for it, I supposed.


    “If you want to see charming, there’s this park on the south end of town you just
    have to experience,” Dad said as we started back to the car. “Krissy used to go
    there all the time and …”


    I groaned inwardly, but let him rattle on. I had a feeling that by the end of
    this trip, Paul was going to know everything about my childhood, whether I wanted
    him to or not.


    # 2


    “So…” Paul made a slow circuit around the room. “This is where you grew up, huh?”


    I flopped onto the bed, arms spread. The mattress was slightly too cushy, causing
    me to sink down farther into it than I liked. It wasn’t my childhood bed, yet
    a contented groan escaped my lips, and I considered just closing my eyes and drifting
    off for a well-deserved nap. Though, as late as it was, the nap would likely end
    up turning into a nightlong sleep, but right then, I was okay with that.


    “It seems kind of bland for you,” he went on. “Are you sure this was your bedroom
    as a kid?”


    I cracked open an eye to find Paul examining a plain brown dresser with a white
    doily atop it. “Yes, this was my room. Still is, I suppose. But if you haven’t
    noticed, I’ve grown up.”


    The room was admittedly lacking in the decorations department. When I’d moved
    out for college, Dad had kept the room as I’d left it. But once I’d made the trek
    to Pine Hills to open Death by Coffee with Vicki, he’d begun the process of turning
    it into a guest room. I’d taken most of my things with me, and those that I’d
    left behind were likely stored away in a box somewhere. Knowing Dad, he wouldn’t
    have thrown anything out.


    “It’s nice,” Paul said. “My childhood bedroom was the size of a shoebox. I could
    roll from my bed, right out the door.” He said it fondly, with a wistful smile.
    “You have enough room in here for a whole gaggle of teenage girls.”'
