    demand he admit to killing Lyle. A few questions never hurt anyone, especially
    if I could couch them in questions about his relationship with Valerie.


    I started the car and drove the short distance to Valerie’s parents’ house. I
    pulled up to the side of the road and parked, but I left the engine running. Dad
    wasn’t there yet, so I sat back and chewed on the pretzel Mickey had bought me
    as I worked through what I knew.


    Lyle was working with Marco, who wanted to move his place of business. He used
    someone at Tito’s Deli to help sabotage the business, to create health violations
    he could then cite. The assumption was that he’d done the same at Death by Java.
    Somehow Lyle ended up dead. Because his coconspirator had turned on him? Because
    their plan was discovered? I didn’t know.


    But Aaron was waiting outside Death by Java on the night of the murder. That put
    him at the murder scene near the time of death. Even if he didn’t kill Lyle, there
    was a chance that Aaron saw who did, even if he didn’t realize it.


    By the time Dad came speed-walking down the sidewalk, I was just about bouncing
    from my seat in anticipation of the conversation to come. I double-checked Aaron’s
    address online, and then, as soon as Dad was strapped in, we were on the way.


    “Okay, where are we going?” Dad asked.


    “Aaron Middleton’s,” I said before explaining what Mickey had told me, along with
    my thought process afterward. “If he was waiting for Lyle, as Mickey believes,
    that means he might have killed him. If he was waiting for someone else, that
    person might be the killer. Either way, whatever Aaron has to say could tell us
    everything we need to know.”


    “What if whoever he was waiting for had nothing to do with it?” Dad asked.


    “Then we might be able to dismiss them as a suspect,” I said. “We’ll just have
    to see what Aaron has to say for himself.”


    There were no cars in Aaron’s driveway when we arrived, and the house looked empty.
    It wasn’t until we pulled all the way up in front of the house that I saw a garage
    tucked under a low-hanging branch of a tree that looked like it was about to fall
    over. The garage door was up, revealing Aaron’s car parked inside. It made me
    think that he’d either just gotten home, or he was about to leave. I parked behind
    his car in a way that effectively trapped him in, just in case he decided to make
    a run for it.


    “What’s the plan?” Dad asked before we got out.


    “We’re just going to have a casual conversation,” I said. “I’ll do the talking.
    You can be my backup.”


    “I’m the muscle, huh?” He lifted his upper lip, and then half-mumbled his words
    Rambo-like. “I can do that.”


    “I hope it doesn’t come to a fight,” I said, hiding my smile. “Or we’re screwed.”


    “Very funny.” His voice—and lip—returned to normal. “My strength lies in my wit.”


    I rolled my eyes as I climbed out of the car. “That’ll help when Aaron’s bench-pressing
    you with one hand.”


    “If he’s laughing, it will.”


    The banter dried up as we approached Aaron’s front door. The house was older,
    but well-maintained. I realized as I stepped up to the door that this could very
    well be the same house Valerie had lived in back when she and Aaron were married.
    It felt strange to be there, like I was treading upon her past, uninvited. It
    was possible he’d moved since they’d divorced, but it felt right for him to have
    remained in the same house, especially since he refused to let his love for her
    go. What better way to hold her close than to remain where her memory was the
    strongest?


    I pressed the doorbell and stood back to wait. Dad stood sentry right behind me,
    arms folded behind his back, playing the part as my bodyguard. All that was missing
    were the sunglasses and black suit.


    Aaron answered the door with a perplexed expression on his face. “Krissy?” He
    looked from me to Dad, and his confusion deepened. “What’s going on?”


    “Hi, Aaron. I’m sorry to barge in on you like this, but I’d like to talk.”


    He frowned. “I’ve got to leave for work in like”—he glanced at his watch—“ten
    minutes. Can it wait?”


    “It’s about Valerie,” I said. And then, just to pique his curiosity, I added,
    “I’ve already talked to Hugh about what I found on her phone.”'
