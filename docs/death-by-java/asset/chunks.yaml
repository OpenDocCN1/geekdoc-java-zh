- fmt: '

    Dad started for the passenger’s seat, but I handed him his keys and took it instead.
    I was too distracted to drive. I was mentally going over the list of employees
    at Death by Java and when I’d last seen them. Farrah was there most days, so she
    wasn’t Aaron’s girlfriend or fling or whatever you wanted to call her. Dee had
    called off a few times recently, but she’d been there earlier that very day, fussing
    over Oscar.


    *But Nadia …*


    Thinking back, I realized I hadn’t seen her since Lyle’s murder.


    Nadia was the mole.


    If she’d been working with Lyle Carrigan to sabotage Death by Java, she might
    know why he was murdered. And I suspected, due to her sudden disappearing act,
    she might also know who was the one who had done it.


    # 24


    The phone rang and went to voicemail.


    “Come on, Valerie,” I muttered, dialing again. Once more, it went straight to
    voicemail. It made me wonder if Hugh had gotten ahold of Valerie’s phone and blocked
    me in retaliation for my interference with his plan to break her and Mickey up.


    I’d tried to find Nadia’s address online, but it was kind of hard to do when all
    I had was a first name and place of employment. Same went for a phone number.
    But Valerie would know. If I could ever reach her.


    “Death by Java?” Dad asked, though we were already heading that way. I’d tried
    to call there first, but, like with Valerie’s cell, no one had answered.


    I gave him a sharp nod, and we were soon parking out front of the bookstore café.
    “I’ll be right back,” I said as I got out. “Keep the car running.”


    I was anxious to talk to Nadia, so much so I was half-convinced that if I didn’t
    talk to her *right now*, someone else might die or the killer would escape.


    I barreled my way through the front door, noted the handful of people scattered
    around the room sipping coffee, and went straight to the counter, where Valerie
    was standing, talking to a man with his back to me. I didn’t so much as pay him
    a glance as I stepped up beside him.


    “I need Nadia’s address,” I blurted before realizing I was being rude. “Sorry
    to butt in like this, but it’s import—” My eyes widened. “Marco?”


    He didn’t quite sneer at me, but it was close. “Go right ahead. Say what you have
    to say. I think I’m done here anyway.” He shot Valerie a dirty look before he
    turned and walked out the door.


    “What was that about?” I asked her.


    Valerie stared after him a couple seconds more before saying, “He tried to buy
    me out.” She shook her head. “I can’t believe he thought I was trying to sell.
    Although …” Her expression turned thoughtful.


    “You might sell Death by Java?”


    She shrugged. “It’s not like it’s been going great. Maybe things will turn around.
    But if they don’t, I might as well keep my options open.” She turned her focus
    fully on me. “Now, what’s this about Nadia?”


    “I need to see her,” I said. “And as soon as possible.”


    Valerie pulled a face, like she couldn’t fathom why I’d want to talk to one of
    her employees. “Why are you looking for Nadia?”


    “She hasn’t been at work for the last few days.”


    “You think I haven’t noticed that?” Followed by a patented Valerie eye roll. “She’s
    kind of left me hanging. Right in the middle of a crisis, no less.”


    “I know. And I think I know why she’s called off.”


    Valerie’s hands went to her hips. “Care to share?”


    “I …” Did I want to tell her? If I was wrong and Nadia had nothing to do with
    what had happened with Lyle, I could be getting her into trouble for nothing.
    Her relationship with Aaron was beside the point, though I did think it was something
    Valerie should know about if she was considering going back to Aaron. Things could
    get messy real fast.


    I was saved from having to come up with an excuse when, “I know where she lives,”
    came from behind me.


    I turned to find Dee standing by one of the bookshelves, Oscar lying on the floor
    next to her. The cat was eyeing me distrustfully, though he was making biscuits
    in the air near Dee’s heel, telling me he was in a good mood, despite what his
    face implied.


    “Sorry,” I told Valerie as I started Dee’s way. “I’ll fill you in later.”


    Valerie huffed and muttered, “Whatever,” before vanishing into the back.


    I joined Dee, careful not to disturb—or get too close to—Oscar. “Thanks. I really
    do need to talk to Nadia.”


    “Is she in trouble?” Dee asked.


    Was she? I had no idea how to answer that. “I’m not sure,” I said. “That’s why
    I need to see her.”


    Dee considered that a moment and then seemed to come to a decision. “It’s probably
    better if I don’t know the details, especially with everything that’s happened
    lately.” She rattled off Nadia’s address. “I don’t have her number, or I’d give
    you that too. I only know where she lives because I gave her a ride home once
    when her car broke down. We’re not close.”


    “It’s all right,” I said, repeating the address over and over in my head so I
    wouldn’t forget it. “Thank you so much, Dee.”


    “No problem. You shouldn’t forget it.”


