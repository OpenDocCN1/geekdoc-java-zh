    “Dad …” I whispered, nodding toward where Mickey was standing.


    “I see him.”


    Mickey was craning his neck to see inside `Death by Java`, but he wasn’t moving
    close enough to where Officer `Peel` would notice him. In fact, he was doing his
    best to look inconspicuous to *everyone*, despite his clear nervousness. He was
