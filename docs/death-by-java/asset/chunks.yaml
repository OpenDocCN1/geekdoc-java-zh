    Thoroughly embarrassed, I fled, determined to keep my bedroom door wide open and
    a light on, not just for tonight, but for the entire two weeks ahead.


    # 3


    I stifled a yawn as I waited for the coffee to finish percolating. I was out of
    bed at first light and had quietly taken my morning shower before I’d headed to
    the kitchen to get the coffee started. Paul was still soundly asleep, mummified
    in a blanket he’d wrapped around himself, as if making sure there was no chance
    we’d accidentally touch during the night. It was kind of cute—and appreciated,
    considering Rita’s comments.


    Down the hall, a door opened. A few moments later, Laura appeared, wrapped in
    a blue robe that was cinched at the waist. Her hair was only slightly mussed from
    sleep. When she saw me at the counter, she smiled and came over to join me.


    “Did you sleep okay?” she asked as she leaned against the counter.


    I made a so-so gesture with my hand. “Let’s just say Rita’s parting shot had me
    wishing for bunk beds.”


    Laura laughed. “You’re not the only one it got to. Your dad spent most of the
    night at the edge of the bed, like he was afraid you might walk in on us at any
    moment. I swear, he nearly fell out of it at least twice.”


    “I think Paul was about to go sleep on the couch.”


    “Maybe we should arrange a little living room campout for the boys. I’m sure they’d
    love it. It might send them right back to their childhoods.”


    “Send who, where?” Dad spoke through a yawn as he entered the kitchen.


    Laura winked at me before pushing away from the counter. “Pancakes? I’m cooking.”


    By the time the pancakes were done and coffee served, Paul had joined us, looking
    as rough as I felt. We sat around the small, circular table, like a real family.
    No one was married here, and Dad and I were the only two who were related, but
    there was definitely a sense of *right* as we dug in.


    And yet …


    I poked at my pancakes, barely tasting them. They were good, don’t get me wrong,
    but my mind was elsewhere, and I couldn’t seem to get it focused on the here and
    now.


    “What’s wrong, Buttercup?” Dad asked, setting aside his fork.


    “It’s nothing.”


    A shared look around the table.


    “That doesn’t sound like nothing,” Paul said while the other two nodded.


    “It’s just …” I sighed. “It’s Valerie. I know I don’t owe her anything, yet I
    feel guilty for not helping her when she asked. I’m pretty sure we could all tell
    that `Death by Java` was struggling.”


    “I’m not sure there’s much you can do to save that place,” Laura said. “I hate
    to say it, but it’s true. There’s a negative vibe that I think the customers can
    feel.”


    “I know.” I stabbed at a square of pancake with my fork and let it hang there,
    uneaten. “But if she is forced to close and I didn’t at least *try* to give her
    a few pointers, I’d feel terrible. I mean, it’s not like I’m some great businesswoman
    or anything. Vicki takes care of a lot of the business side of things, but some
    of the basics …” I shoved the bite into my mouth, talked through it. “I could
    do that.”


    “Why don’t you talk to her?” Dad asked. “Stop in, take her on a tour of her own
    place. You could point out any problem areas you see, tell her what you think
    she should do to fix them. You could talk to her employees, show them how you
    do things, and if they take your advice, great. If not …” He shrugged. “That’s
    on them.”


    “Your dad and I can show Paul around town while you do that,” Laura said.


    “Take him to that park I mentioned yesterday,” Dad added.


    I mulled it over, made a face. “I’m here for you,” I said. “Not Valerie. I’d feel
    bad skipping out on you for this.”


    “You’re here for two weeks,” Dad said. “I’m pretty sure we could spare you for
    a few hours. It’s not like I’m saying you should spend all day there. Go in, have
    your say, and then be done with it. It’ll make you feel better.”


    “Otherwise, you’ll obsess over it all week,” Paul added.


    He was right, but I didn’t want him to be. I mock-pouted and muttered, “I don’t
    obsess.”


    Another shared look around the table. Thankfully, no one contradicted me, or else
    I’d have obsessed over *that* all day.


    “We can drop you off once we’re done here,” Dad said. “We’ll take Paul to that
    park, show him around.” He grinned. “I have a few stories I can tell him about
    some of the trouble you got into as a kid. Do you remember that time you saw the
    squirrel go into that hole and you—”


    “*Not* another word!” I pointed my fork threateningly at him.


    Dad raised his hands in surrender, though the mischievous grin told me that *that*
    little tale wouldn’t be our secret for long.


    “Are you sure you don’t want me to come along?” I asked, aiming the question at
    Paul. “I don’t want you to feel abandoned. We’re here together.”


    He pulled me into a one-armed hug and kissed my temple. “I’ll be fine. Go. Help.”


