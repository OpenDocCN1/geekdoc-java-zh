  raw: '*Could the woman have been wrong?* Valerie appeared upset, but that could
    be because the mustached officer wasn’t letting anyone inside, not that somebody
    had died. And since Valerie was clearly alive and well, a vague hope coursed through
    me that it was all just a bad rumor, and that it was indeed the ice machine that
    had caused the fuss.


    But I desperately wanted to know for sure.


    I made a snap decision and stepped forward.


    Officer Peel immediately held up a hand, palm outward. “No one is allowed in.
    This is a crime scene. This place is closed until further notice.”


    “I’m not a customer,” I said, wincing at the words “crime scene.” “I’ve been helping
    the owner lately.” I nodded toward Valerie, who’d yet to notice me. “If there’s
    something I can do to help—”


    “You can help by taking a step back.”


    “At least tell Valerie I’m here. She’s the owner. Valerie Kemp.” I flashed him
    my best smile. “I’m Krissy Hancock. That’s my dad, James Hancock.”


    If I’d hoped name-dropping the local famous author’s name would help, I was disappointed.
    Officer Peel merely adjusted his shades and squared his scrawny shoulders. “No
    admittance. Step back or else I’ll have to take you into custody.”


    “I heard someone died,” I said. “Can you at least tell me if that’s true?”


    Mustache twitching, Officer Peel crossed his arms. His jaw worked, and while I
    couldn’t see his eyes, I got the impression he was debating whether he should
    follow through on his threat to arrest me or to simply ignore me.


    Before he could make up his mind either way, the door flew open, and a frazzled
    Valerie Kemp appeared. “Krissy!” She grabbed me by the arm and physically pulled
    me past the startled Officer Peel. “Tell her that I had nothing to do with it!”


    I staggered through the doorway of Death by Java, nearly face-planting on the
    floor in front of a tall Black woman with crossed arms dressed in slacks and a
    dark blue shirt. Her hair was pulled back tight from a striking face with high
    cheekbones and ultra-smooth skin that made her clear brown eyes stand out from
    the rest of her face. Those eyes were narrowed at me in a way that said she didn’t
    appreciate my sudden appearance.


    “Tell Detective McKensie!” Valerie prodded. “Krissy was here yesterday. She saw
    him leave. He was alive then, and he never came back here, not while we were here.
    Ask her!”


    The woman—the *detective—*didn’t ask. She just stared at me.


    “Who are we talking about?” I asked. “I don’t know what’s going on.”


    A moment passed during which I was sure Detective McKensie was going to toss me
    right back outside without saying a word. She eyed me like she might a bug in
    her soup, before heaving a heavy sigh.


    “I suppose I should hear what you have to say since you’re here,” she said. Her
    voice was buttery smooth, almost sultry. It was the kind of voice that would have
    most people lapping at her feet if the situation were different. “Krissy, wasn’t
    it?”


    I nodded. “Krissy Hancock.”


    “Do you live around here?”


    “I used to. I live in Ohio now. I’m here visiting family.”


    Her eyes flickered toward Valerie, causing me to nearly laugh.


    “No, we’re not related. We went to high school together. I’m here with my dad.”
    I pointed at him through the door. He was still standing where I’d left him.


    “I see. And you were here yesterday?”


    “I was.” I shot a glance toward the other cops in the room. They were watching
    the interaction, faces impassive. No one else was present. “Who died?”


    Detective McKensie’s lips pressed together at the question. She didn’t otherwise
    respond.


    “Krissy was here almost as long as I was,” Valerie said.


    “Working?” the detective asked, eyes on me.


    “No,” I said. “Not really. I own a bookstore café in Ohio. Valerie wanted me to
    have a look around, see where she could improve her store to draw in more business.”


    “‘Improve’ is a strong word,” Valerie said, earning herself a glare before McKensie
    turned back to me.


    “Did you see anyone else while you were here?”


    “Valerie, of course,” I said. “Two of her employees, Nadia and Farrah. I don’t
    know their last names.”


    Detective McKensie nodded, as if I’d merely confirmed what she already knew.


    “A repairman showed up while I was working out here. His name’s Roman.” My eyes
    widened. “Was he the one who died?”


    “Please stop speculating,” Detective McKensie said. “Is that the full list of
    people? Customers? Other employees?”


    I started to shake my head, then remembered. “Lyle Carrigan,” I said. “He was
    already here when I got here. Him and two customers. They left their cups on the
    tables …” I trailed off when McKensie’s expression darkened. “Lyle was going to
    cite Valerie for the broken ice machine, which was what Roman came here to fix.”


    “You saw Mr. Carrigan?”


    “I did. He and Valerie were arguing—”


    “‘Arguing’ is a strong word,” Valerie said.


    McKensie made a zipping motion at Valerie before taking a step closer to me. “When
    did Mr. Carrigan leave?”


    “He’s the one who died,” I said, not making it a question. At that point, it was
    obvious based on the questions and Valerie’s reaction to them. “He left almost
    as soon as I got here. I didn’t see him at Death by Java again that day.”


    “But you saw him somewhere else?”


    *She’s observant.* “I did. He was at the Italian Roll. He left just when I arrived.”


    “That seems to happen a lot.”


    I blinked, not quite sure where she was going with that.


    “You show up where Mr. Carrigan is conducting his business, and then he leaves.
    How well did you know him?”


    “Not at all,” I said. “The first time I’d ever met him was here.”


    “Yesterday?”


    I shook my head. “The day before. When I first arrived in town, I came here to
    check the place out. He was here then.”


    “And he left right after?”


    I was torn between indignation and fear. Was the detective really trying to make
    a connection between Lyle Carrigan and *me*?


    “He did,” I said. “I never spoke him. Then or later.”


    “I see.” A beat, and then the dreaded question, “Where were you last night, Ms.
    Hancock?”


    “At home. With my family.” I took a shaky breath. “Dad’s outside. His name is
    James Hancock. He can confirm my whereabouts. And before that, I was with my boyfriend,
    who just so happens to be a policeman from Ohio. I could call him if you want
    me to.”


    “That won’t be necessary.”


    Beside me, Valerie was chewing on her lip and wringing her hands. I noted that
    her fingernails were pristine, as was her clothing. She didn’t look like a woman
    who’d just committed a murder. But if she hadn’t done it, then who? No other employees
    were evident. And even if they were, I couldn’t imagine any of the girls I’d seen
    working here killing anyone.


    Then again, just because Detective McKensie was treating it like a murder, that
    didn’t mean it was. As far as I knew, Lyle had come in and had a heart attack
    while pointing out yet another health violation to Val erie.


    But if she’d seen him keel over, then why all the questions?


    “I don’t know what happened,” I said. “And I only knew Mr. Carrigan by sight.
    Yes, he argued with Valerie, but he’d been getting on the bad side of a lot of
    other business owners in town, too, including Tito.”


    “Tito Adornetto?”


    “I don’t know his last name, but I assume that’s him. He owns the deli next door.”


    McKensie shared a look with the other cops in the room before turning back to
    me. “Did he argue with anyone else? Anyone at all?”


    I almost said no, before I remembered. “Mickey. Valerie’s boyfriend.”


    Valerie’s mouth opened, and she gave me the most betrayed look I’d ever seen.


    “Does this Mickey have a last name?” The detective looked to Valerie for an answer.


    “He doesn’t have anything to do with this,” she said. “All Mickey did was stand
    up to Lyle when he was harassing me. You know, like a good boyfriend would?”


    Detective McKensie simply stared, which appeared to be her go-to move when one
    of her questions was being avoided.'
