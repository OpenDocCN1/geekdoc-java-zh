    “Who?” Marco asked. “No one else at the health department would have helped me.
    And if the citations stopped, then what would force Valerie Kemp’s hand?” He shook
    his head. “I had to. When Lyle called that night, he told me that he was done,
    that he couldn’t do it anymore. I couldn’t let that stand, not when we were so
    close. I convinced him to wait for me so we could talk about it. He agreed. But
    when I got there, he refused to see reason, went so far as to say he was thinking
    about turning himself in. Can you imagine? Ruining his life, for what? Morals?”
    Marco all but spat the words.


    Nadia sank down onto the couch, trembling so hard, she appeared close to falling
    apart.


    “So you killed him,” I said.


    “What else was I supposed to do?” Marco said. “If he turned himself in, it would
    implicate me in his crimes. He’d only lose his job. I’d lose my business. I couldn’t
    let that happen.” He took a trembling breath. “I tried to make him understand
    that he couldn’t walk away, that if he did, it would ruin both our lives, but
    he wouldn’t listen. I grabbed him, tried to shake some sense into him. And then
    …” He met my eyes. “I didn’t do it on purpose. I let him go, but he was off balance.
    He fell. I don’t know what happened. Maybe it was shock. Maybe he hit his head
    just right. I don’t know, but whatever it was, the next thing I knew, he was lying
    there, dead, in the horrible back room of that bookstore café.”


    “You could have called an ambulance,” I said. “They might have been able to save
    him.”


    Marco laughed. “Why would I do that? They save him and then he tells everyone
    what happened? I’d be even worse off than before.” He paced one way, then the
    next. “I realized that I could take advantage of the situation, so I left him
    there, figuring that the police would have to shut the place down. I grabbed his
    tablet, since I didn’t know what he kept on it, and went to leave.” His expression
    darkened. “And I very nearly ended up like Lyle because of that beast they let
    wander the store.”


    “Oscar?” I asked.


    “It came out of nowhere. Darted right between my feet, and I nearly fell. I dropped
    Lyle’s tablet, and it bounced off somewhere in the dark. I would have looked for
    it, but I had made enough noise, I was afraid someone had heard, so I left it
    before I was caught.”


    I could feel the shift as much as see it. A sort of calm washed over Marco as
    he leveled his gaze on Nadia and me. “I would have let everything play out as
    it would, but when you showed up, asking about Nadia, I knew I had to get rid
    of her before you had a chance to talk to her. It took me longer than I liked
    to find out where she lived, so here we are.” His hand moved from the small of
    his back. In it, he held the gun that moments before had only been speculation.
    “Sit.”


    “Marco—”


    “Sit!” His hand jerked up. “No more talk.”


    I started to ease down onto the couch, just as the world exploded with the sound
    of a machine gun.


    I dropped flat to the floor, thinking that Marco had opened fire, though how that
    little gun of his could have made such a racket, I had no idea. Beside me, Nadia
    was scream ing, hands covering her head. Across the room, Marco had likewise dropped
    to the floor, cursing up a storm.


    And down the hall, running toward us like a half-mad bull, was Dad.


    I missed most of what happened. There was the sound of the machine gun, rat-a-tatting
    throughout Nadia’s apartment. Nadia’s screams and the subsequent ringing in my
    ears as I tried to make sense of what was going on.


    Dad flew down the hall and collided with Marco, who’d just started to rise from
    where he’d fallen. There was the sound of a scuffle, then a meaty thump. My heart
    lurched, and I scrambled to my feet, thinking I’d help Dad, but the fight was
    already over.


    Dad had Marco pinned face down on the floor, arms bent behind his back in a way
    that had to hurt. A welt was growing on the side of Marco’s head, and he had a
    dazed look in his eye, telling me he’d been struck pretty hard. There were no
    bullet holes anywhere.


    Dad had his cell phone held high over his head. He thumbed a button, and the machine
    gun sounds ceased before he brought the device to his ear. “Sorry about the noise,
    Detective. Suspect is subdued. We’ll be waiting for your arrival.” He clicked
    off and tightened his grip on Marco’s wrists before glancing at me. “You should
    unlock the door, Buttercup. Detective McKensie should be here any moment.”


    # 25


    The *clink* of forks on plates and the low murmur of voices filled the room. I
    sat across the table from Dad, with Laura to one side of me, Paul on the other.
    The place where we were eating was expensive and a vastly different experience
    from anywhere we’d been since Paul and I had arrived in Redwood Village.


    But that was okay. It was a nice change, considering what I’d been through.


    Marco Rossi was behind bars. The Italian Roll was closed. Death by Java and Tito’s
    Deli were still open, though I wasn’t sure how much longer the former would remain
    so. Last I’d heard, Valerie was still struggling to generate business.

