    “或者他拿着它。”我身体前倾，双手用力按在桌子上，仿佛那是唯一让我没有立刻跳起来冲出门门的支撑。“如果他杀了莱尔（Lyle）并拿走了他的平板电脑呢？如果他现在还有那个东西呢？”


    “他为什么要拿？”爸爸问道，随后他似乎反应过来了，“莱尔因为某事给他开了一具罚单。”


    “如果那张罚单严重到可能让提托肉店（Tito’s Deli）关门呢？”


    “提托不会希望那样。”


    “不，他不会的。他那天晚上可能在‘Death by Java’咖啡馆外遇到了莱尔，看到他拿着平板电脑，然后他们可能为了它打了一架。他可能是不小心杀了了他，然后由于不知道该怎么处理尸体，就把他拖进了书店咖啡馆的后房间。”


    “他是怎么进去的？”


    我张了张嘴，又又闭上了。他是怎么进入‘Death by Java’的？我很确定瓦莱里（Valerie）没有给过提托钥匙，即使是紧急情况下也不行。


    `Mickey` 可能在那里。他看到了那场打斗，决定通过藏匿尸体来帮助提托。但为什么要选择瓦莱里的生意场所，而不是其他地方，比如巷子尽头的某个垃圾桶？


    我脑中灵光一闪。如果 Mickey 认为瓦莱里在对他不忠，他可能决定诬陷她杀人以此作为惩罚。这或许可以解释为什么他那天早晨在书店咖啡馆外那么紧张，为什么他不想被看到。


    “即使他没杀他，只要有提托有那个平板电脑的可能性，他就可能意识到拥有它会让自己看起来很有罪。”爸爸意味深长地看了我一眼。


    “他可能会把它毁掉。”


    爸爸点了点头。“如果我们说的对的，如果莱尔是因为某项严重违规给他开罚单的，他可能认为警察会把这当作作案动机。这还没提到他拥有平板电脑这件事本身就会自动让他列入警方嫌疑人名单的前列。”


    “我应该给麦肯西侦探（Detective McKensie）打电话的，”我说，看了一眼手机。“但如果我错了，他并没有拿它怎么办？”


    爸爸思考了很久，然后耸了耸肩。“对此你做不了什么。而且，说实话，我不确定警察能做些什么。”


    “你什么意思？”


    “你可以告诉他们你认为提托有那个平板电脑，”他说，“他们会问你为什么这么想。你会说他行为古异。他们会要求证据，而你什么也没有。”


    “这并不能给他们提供合理理由（probable cause），”我说。


    他点了点头。“侦探可以去找提托，问他这件事，但你我清楚，他很可能会否认一切。虽然我不是专家，但我很确定，如果没有任何东西能把提托和平板电脑或莱尔联系起来，警察就不能闯进他家，他们绝对不能搜查那个地方。”


    “他们束手无策了。”


    “没错。”这也许是我的幻觉，但我能感觉到那句“‘但你没有束手’。”


    “提托可能现在正离开肉店，”我嘟囔着，看了一眼钟。


    爸爸站了起来。“我去看看一下劳拉（Laura）和保罗（Paul）。她把他关在我的办公室里，正在核对谁知道些什么。”他轻笑道，“我预计他们还要忙一会儿。我完全可以去插几句话，让他们再忙上，噢，比多出十分分钟。”


    我站起来把手机揣进口兜。“能改成三十分吗？”


    “看看吧。只是……别让自己陷入危险，小花儿（Buttercup）。”他走出房间，然后停顿了一下。“钥匙在柜台上的盘子里。”然后他就离开了。


    向爸爸无声地表示感谢，我从盘子里夺过钥匙，然后溜出门门。我并不确定自己打算做什么，但我知道这会涉及到探访提托那栋豪华大房子，至少，那是个起点。


    开车去提托家的这段短距离路程时，紧张得我坐得笔直。那房子坐在一条长而弯曲的道路尽头，这条路通向一个中产阶级居住的小社区。富裕企业主的住宅紧邻药剂师和夜总会老板的房屋。院子大小适中，房子很大，但还没大到需要雇佣人来维护的程度。


    提托的房子内部灯火通明，他的车停在车道上，就在路边两个装满的垃圾桶后面。我沿着街回开了一小段，停在一个看起来空无一人的黑暗房子附近，尽管门前并没有贴售卖标志。我从后视镜里看到提托的家，但透过遮住大前窗的半掩窗帘，我看不明任何细节。


    我熄了引擎，在那里坐了很久，听着它发出的 `滴嗒` 声。我有几个选择，但都充满风险。我可以走到门口敲门。如果提托来应门，我可以直截了当地问他是否拿了莱尔的平板电脑。


    代价是什么？如果他真的拿了，这意味着他可能杀了那个健康检查员，或者至少参与了其中。如果他谋杀了莱尔，那还有什么能阻止他对我做同样的事呢？


    不，取消这个念头。


    我可以找个借口去找他，就说之前在提托肉店的提问表示歉意。我可以告诉他我并不是故意让他不高兴，我只是……


    '
- fmt: '

    A shadow moved in a room upstairs. A moment later, a light clicked off. I tensed
    in anticipation, counting the seconds in my head, and then Tito appeared, dressed
    casually in loose-fitting exercise pants and a tank top. A fluffy snow-white cat
    followed at his heel as Tito paced in front of the coffee table in clear agitation.


    For a few long minutes, nothing else happened. Tito was running his hands through
    what was left of his hair and seemed to be grumbling to himself—or, knowing cat
    owners, being one myself, to his kitty. There was no telltale tablet in his hand,
    yet I just *knew* that was what he was worried about.


    My phone felt heavy in my pocket as I watched him. I could call `Detective McKensie`
    now, but what could I tell her? I had no proof that Tito had done anything wrong.
    She couldn’t search his house for the missing tablet at my word, and I seriously
    doubted Tito would admit to anything if she asked him about it. I needed evidence,
    even something small, that would give me something more than speculation.


    The cat, seemingly bored with following Tito around, hopped up on the cat tree
    and peered outside. Its large green eyes spotted me immediately, and its ears
    perked up in interest.


    “Shoo,” I whispered, motioning for the cat to jump down, though I knew from experience
    it was a futile exercise. “Go away before you—”


    Before I could finish the thought, Tito stopped pacing and crossed the room to
    the window. I ducked back behind the tree, heart hammering in my chest as my breath
    locked in my throat. I waited a full minute before hazarding another peek toward
    the house.


    The cat was gone, and the curtains were closed tight.


    It was time to go.


    I studied the window a few moments more to make sure that Tito, or his cat, wouldn’t
    return, and then I stepped out from behind the tree. Shoulders tense, I crossed
    the yard, toward his car, and I had just reached it when the rattle of Tito’s
    doorknob had me dropping to my knees, behind the vehicle.


    I couldn’t make out much from underneath the car, but what I could see had my
    blood pumping in my ears. Tito, in brown slippers, was walking quickly toward
    the car behind which I was hiding. My brain registered that he wasn’t wearing
    socks, all while I vainly tried to come up with some reasonable explanation as
    to why I was lurking in his driveway.


    Instead of rounding the vehicle and climbing into the driver’s seat like I expected,
    though, Tito continued past, toward the trash cans at the end of the drive. I
    remained crouched and eased around the bumper, to the side of the car, praying
    he didn’t notice the sound of my sneakers on the paved surface.


    I couldn’t see what he was doing as he paused at the trash cans, though I could
    hear it. There was a *thump* as he opened the plastic top and let it fall against
    the side of the can. A rattle of plastic followed, then what sounded like a patting
    of the same plastic surface. A moment later, there was a new *thump* I took for
    him closing the lid, and then the *swish* of Tito’s pants legs rubbing together
    as he hurried back to his house.


    As soon as I heard the door close again, I sagged down against the tire, breathing
    fast and hard. That was *way* too close.


    Down the street, a door opened, and a woman with short hair stepped outside, carrying
    a bag of trash. She tossed it in a can sitting just outside her garage, and then
    she dragged that to the end of the driveway with a loud grating sound. She scanned
    the neighborhood, eyes seemingly passing right over me where I sat against Tito’s
    car, before she turned and walked back to her house. The door closed with a solid
    *thump* that reverberated down the street.


    I rose on shaky legs, peering over Tito’s car as I did. The living room light
    was still on, and the curtain remained closed. My eyes flickered over to the trash
    can, curiosity swirling. Tito might have simply tossed a bag of kitty litter,
    but I didn’t think so. He’d been agitated when I saw him inside. And I was pretty
    sure our earlier conversation was the reason why.


    *Call Detective McKensie!*


    And tell her what? That I suspected Tito Adornetto had just thrown away Lyle Carrigan’s
    missing tablet? I didn’t know the law well enough to know if she could search
    his trash without a solid reason. I mean, it was garbage, on a curb, where anyone
    could walk by and root around in it.


    And anyone included me.


    Steps quick and determined, I hurried over to the trash cans. I wasn’t sure which
    of the two he’d opened, so I started with the nearest. A single black trash bag
    sat inside. Its drawstring was pulled tight and knotted. I checked around either
    side of it, saw nothing, so I closed the lid and moved on to the next with a quick
    glance back at Tito’s house. Nothing had changed, yet I could *feel* time slipping
    away.


    I opened the lid, and my heart skipped a beat as I laid eyes on the torn bag.
    No, a torn trash bag wasn’t confirmation of anything, and it was too dark to see
    what was inside. Gritting my teeth, I shoved my hand through the tear and maneuvered
    my way past something that felt like a banana peel and a rectangular box that
    made me think of my favorite brownie mix. I rooted around, scratched the back
    of my hand on said box, bumped into an aluminum can, a glass bottle, and …


    Rubber.


    I froze, stunned by the fact that I might have been right.


    Taking slow, measured breaths, I walked my fingers around the edge until I touched
    it.

    '
