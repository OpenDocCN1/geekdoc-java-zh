    “I doubt they’ll even be allowed to open, so I’m not sure what I can do,” I said.
    “I already gave `Valerie` a list of changes she could make, so as long as she
    follows that, there’s little else I can do. And if I show up at her house to talk,
    she’ll probably just kick me out. Or ignore me.”


    “But if you make the effort, show her that you’re available, she might soften
    her stance on you,” Dad said. “I know that `Valerie Kemp` wasn’t your favorite
    person when you were younger. You tried to hide it, but I saw how she treated
    you.” His lips pressed together briefly before he went on. “But people change.
    I realize she’s difficult now, but there’s always a chance that it’s a show, a
    way for her to keep up appearances.”


    “Appearances as an entitled brat?” Laura asked.


    I considered it. I didn’t think `Valerie` had changed all that much, but did it
    matter? A man was dead. It had happened in her bookstore café.


    Someone she knew might be involved.


    “Mickey’s hand was wrapped,” I said. “And he didn’t try to get inside to check
    on `Valerie`. If he’d done nothing wrong, don’t you think he’d have at least *tried*
    to get past `Mr. Mustache` to make sure she was okay?”


    “`Mr. Mustache`?” Laura asked with a laugh.


    “The cop outside. Officer …” I frowned.


    “`Peel`,” Dad provided. “His name tag said `Peel`.”


    “That’s it.” I drummed my fingers on the table. “Officer Peel` was guarding the
    door, but I was able to get past him.” Sure, `Valerie` yanking me inside had caught
    him by surprise, but I’d still made it. “Mickey stood out of sight, acting like
    he didn’t want anyone to see him. And his hand was fine when I last saw him.”
    Which just so happened to be the day that he’d all but threatened `Lyle Carrigan`.


    “Do you really think this `Mickey` guy is the killer?” Dad asked.


    “I’m not even sure there *is* a killer,” I said. “The detective is working under
    the assumption that `Lyle` was murdered, but she didn’t come right out and say
    that he was. It could have been an accident. Maybe `Lyle` was there illegally
    and had a heart attack or something. She might have been trying to figure out
    why he was there.”


    Of course, based on the questions she was asking, I doubted that was it. `Lyle`
    was murdered. `Valerie`’s boyfriend was the prime suspect, at least in my mind.
    Once `Detective McKensie` learned about his injured hand and suspicious behavior,
    he would be hers as well.


    “Assume it *was* murder,” Dad said. “What do we know?”


    I considered it, and said, “Mickey got into `Lyle`’s face, warned him to leave
    `Valerie` alone.”


    “`Death by Java` is already struggling at this point,” Dad added. “If the health
    inspector shuts them down, even for a few days, it might hurt them enough that
    they could have to close permanently.”


    “The ice machine broke down yesterday,” I said. “`Lyle` insisted on citing `Valerie`
    for it, said he’d come back later to check on it.”


    “Which upsets Mickey, who’d already told `Lyle` to back off.”


    “So, he confronts the health inspector, possibly when he came back to follow through
    on his inspection.”


    “And, *bam!*” Dad punched his fist against his palm. “He kills him. Maybe it’s
    by accident. Maybe `Lyle` refuses to back down, and he takes him out before he
    can file his report.”


    “But why leave the body in `Death by Java`?” I asked.


    “He could have panicked.”


    “Or someone came by.” I thought it through. “If this happened early in the morning,
    let’s say, just before opening and before the first employees arrived …”


    “They argue, Mickey kills him, but he doesn’t have time to dispose of the health
    inspector before someone shows up. He slips out the back—”


    “I’m not sure there’s a back door,” I said. “Or, at least, I didn’t notice one
    when I was back there.” Then again, I’d been a smidge distracted by `Valerie`
    and `Roman` when I’d gone into the back, so there was always a chance I’d overlooked
    it.


    “Okay, then, perhaps he hides somewhere, waits until the body is found, and then
    slips out in the confusion,” Dad amended. “He comes back later to see what’s going
    on. Kind of like that trope of killers returning to the scene of the crime.”


    “You two are impossible.” Laura shook her head as she rose.


    “By which, you mean we are brilliant detectives who are likely on the right track,”
    Dad said with a wink at me.


    Laura rolled her eyes. “I’m going to find a lighthearted movie to cleanse my mind
    of all this talk of murder. Would the two of you care to join me?”


    “I’ll pop the popcorn,” Dad said, rising with a stretch. “I think we could all
    use the break. What do you think, Buttercup?”


    It was a bit early for popcorn and movies, but then again, the day had already
    been long enough. A few hours of mindless fun sounded like the perfect way to
    keep myself out of trouble.


    “Sure,” I said. “A movie would be great.”


    Dad, true to his word, retrieved a bag of popcorn. “Amish-made,” he said, showing
    me the brown bag before tossing it into the microwave. “It’s smaller than what
    you usually get at the store. A writer friend of mine who lives in Amish country
    sends it to me every couple of months as payment for some editing I did on one
    of her Amish mysteries.”


    The scent of buttery popcorn filled the house, and we were soon situated in the
    living room in front of Dad’s television. Dad sat in the middle, Laura on his
    left, me on his right. The couch was just barely big enough for the three of us,
    but we managed.


    I did my best to focus on the movie, which was indeed a lighthearted romp, but
    I couldn’t. I kept wondering where `Paul` was, if he was helping `Detective McKensie`
    subdue a killer, even now. Or had something gone wrong? Could `McKensie` have
    decided that `Paul` was responsible for `Lyle`’s death? He was a stranger in town.
    It’s far easier to believe someone new to town is a killer than someone you’ve
    lived beside for years.


    We were about halfway through the movie when my phone rang. A quick look at the
    screen told me it was `Paul`, which sent all sorts of emotions zinging through
    me.


    I shot to my feet, nearly upending the mostly empty popcorn bowl, and rushed into
    the dining room to answer.


    “Paul?” I tried to keep the desperation out of my voice. “Is everything okay?
    Did they catch the killer?”

