  trans: '

    “这就是为什么在我们离开之前，你想去那条小巷吗？”


    我点了点头。“门框上，甚至锁周围，连道划痕都没有。我确定有其他方法不用钥匙就能打开门，但完全没有任何痕迹，这让我怀疑是不是杀手有钥匙并让他进得来的。”


    “门还是可能被撬开的，”爸爸说，“如果你想看的话，我可以给你演示一下？”


    我考虑了一下，摇了摇头。“不用，没事。”爸爸有一套开锁工具，那是他在为自己的一本书做研究时学会使用的。詹姆斯·汉考（James Hancock）因为追求写作的准确而有很多才华，但如果他真的使用这些才华，大部分会让他处于法律的对面。“我相信你。但是……”


    “我明白。如果你愿意，我们可以详细聊聊，”他说，“我是那场谋杀。当你和瓦莱莉在后面时，我确实和那两个年轻人谈了。我想他们是她的前男友。”


    “呢？”


    “他们都声称对谋杀案一无所知。”


    “这并不意外。”


    “不，并不意外，”爸爸赞同道，“但他们*确实*暗示那个叫米基的家伙可能参与了。”


    瞥了他一眼。“他们说为什么那样想吗？”因为如果艾隆（Aaron）或休格（Hugh）想要回瓦莱莉，指控她的男朋友杀人是一个除掉他且不弄脏自己手的好办法。


    “没有直接说。他们都提到米基本应该守在瓦莱莉身边的，质问他为什么不在。他们还提到了他的脾气，说他们多次看到他对卫生检查员大吼。从他们说话的语气，好像他爆发并杀了对方只是时间问题。”


    如果休格和艾隆不是瓦莱莉的前男友，那这话就有意义了。他们可能只是嫉妒米基，单纯想让他消失。


    但他的手*确实*包了着。


    “制冰机被凹陷了，”我说。“莱尔（Lyle）的体是在门口发现的，但这并不意味着战斗是从那里开始的。”


    “你是说你认为发生了肢体冲突？”爸爸问。


    “是冲突，或者是一场升级到有人拳击制冰机的争吵。我无法理解的是，莱尔为什么会在那里。”


    “警察知道他是什么时候被死的吗？”爸爸问。“如果他是那天晚上关门左右出现的，可能发生在那时，而不是今天早晨。”


    “也许吧。”我皱着眉，盯着远方。“但我总是在早上在 Death by Java 看到他。最晚也是下午早。他说他回来检查制冰机，但为什么不等等到正常的时间呢？而且关门时周围会有人。在街上。在咖啡馆里。我的意思是，我很确定他们关门时天还没亮。在大光天日下杀人很难。”


    “所以，你认为他是在开门之前出现的，那时天还黑，然后和米基发生了争吵——”


    “或者和任何开门的人。”


    “——然后呢？他们杀了他是因为他仍然计划因为制冰机给他们罚单？这似乎不值为了杀命。”


    不，不值。除非他打算更进一步。但一个卫生检查员除了开具罚单并可能让地方关门，还能做什么呢？


    几个跑步者路过。其中一个狗主拽住了小狗，向另外两个说了*再见*。松鼠在某个时候离开了它们的栖息地，半矮墙除了一个被丢弃的橡果壳外空空如也。


    “瓦莱莉不会杀他的，”我说。“我不认为她会让米基去做。”


    “但如果不是他，是谁？”


    到底是谁呢？


    我仔细思索了一下，想出了几个主意。莱尔是在 Death by Java 内部发现的。他进去是因为某个有钥匙的人让他进去的；我很确定。这意味着杀手必须是瓦莱莉、米基或者她的员工之一，那是一群穿着粉色裙、系着白色丝结的女性。我知道女性也可以是杀手，就像一样，但很难想象像法拉（Farrah）那样的人杀了莱尔，尽管莱尔那么瘦小，而她还穿着粉色裙。


    而且现场没有血。其中一个女性会勒死他吗？用东西砸死他？如果是的话，用什么？我需要知道死因才能知道怎么想。


    “这些人必须有一个充分的理由杀他，”爸爸打断了我的思路。“我怀疑这和某些轻微的卫生违规有关。他可能看到了他不不该看到的东西。或者他在瓦莱莉之外还有敌人。”


    灵光一闪。“马可（Marco）。”


    爸爸皱起眉。“谁？”


    “意大利卷饼的老板——马可·罗西（Marco Rossi）。我昨天看到莱尔和他在一起。马可说他和莱尔认识很久了，尽管当莱尔离开时，马可看起来很不开心。”


    “就像他们打过架一样？”


    “或者是莱尔说的什么让他不快了。”现在回想起来，马可完全不像我最初想的那样对莱尔生气。“如果莱尔告诉马可米基欺负了他呢？”


    “你认为他会去 Death by Java 对质这个米米基家伙吗？然后呢？莱尔由于某种原因卷入了火中？”


    “如果发生了打架，也许莱尔试图插手阻止。他被打倒了，头部撞击了，然后……”

    '
- fmt: 'I glanced at Dad as we entered. He was taking in the room, eyes scouring the
    place like a detective in one of his stories. I decided to take the lead as `Marco`
    closed and locked the door behind us. He motioned toward a nearby table, where
    we all sat before I answered.


    “Not yet. It’s why I wanted to talk.”


    “I don’t see what I could possibly say that would matter,” he said. “I don’t know
    what happened to him, only that he was killed.”


    I briefly wondered if the police had come out and admitted that it was murder,
    or if `Marco` knew something I didn’t, before saying, “You and Lyle were friends.”


    A brief flare of sadness shot through his expression before he stilled his face.
    “We were,” he said. “We had our differences, of course. He was a health inspector,
    and I own a restaurant, so there were times when he would come in and there’d
    be friction between us. Stuff like freezer and oven temps and such. Nothing big.
    Nothing that went beyond a reprimand here or there. And we always got past it.
    I understood that he was just doing his job, like I was doing mine.”


    “But not everyone saw it the same way,” Dad said.


    `Marco` glanced at him. “No, they didn’t. Most people in the Village’s food industry
    hated the man. Lyle did his job, and he did it well. But he didn’t like confrontation,
    and there were some people who took advantage and pushed him around.”


    “I saw Tito Adornetto shove him out of his deli,” I said. “Physically.”


    `Marco` pointed at me. “Like that. He’d warn them about cooler settings, the way
    the meats and cheeses were stored, and there was always pushback. They all knew
    he was right, but no one likes being told they’ve screwed up. And when you’re
    cited, it ends up in the reports that anyone can find online, which, if the infraction
    was bad enough, could cause a drop in customers.”


    “Did Lyle ever cause someone to have to close because he’d cited them?” I asked.
    “Or get people fired for it?”


    “Not that I’m aware.” `Marco` closed his eyes and rubbed them with calloused fingers.
    “He did his job, but he also had compassion. He tried to give people the benefit
    of the doubt. I suppose it’s not beyond reason that someone might have gotten
    let go because of him pointing out *their* violations. It’s inevitable. Owners
    like to have someone to blame, whether they’re truly the reason for the citation
    or not.”


    It made me wonder if perhaps someone at `Death by Java` had been fired because
    of Lyle’s complaints. Had’t Nadia said something about `Dee` not showing up to
    work the other day?


    “Lyle was here yesterday,” I said. “When he left, you didn’t look happy.”


    `Marco` dropped his hand and leveled me with a hard stare. “Are you accusing me
    of something, miss?”


    “No, but I am curious as to what was wrong. Could it have had something to do
    with why he was killed?”


    `Marco` stared a moment longer, as if determining whether I was being honest before
    he answered. “The issue wasn’t about me or my place, if that’s what you’re thinking.
    Lyle came in and said he was having a hard time with someone. He was worried that
    if he continued to press the issue, something might happen to him. I told him
    he was overreacting. He got angry that I wasn’t taking it seriously, so he left.”


    “And then he ended up dead,” Dad said.


    `Marco` winced as if he’d been struck. “It’s why I closed today. As soon as I
    heard what happened, I felt like Lyle’s death was partially my fault.” He took
    a deep, trembling breath. “I should have listened to him, taken his concerns to
    heart. I let him walk out of here without even offering to help mediate. I could
    have called someone, put a word in a few ears. But I didn’t. Lyle’s dead because
    I didn’t do anything.” He slammed a fist down onto the table, causing it—and me—to
    jump. “Why didn’t I listen when I had the chance?”


    He shoved away from the table and walked away. He crossed the room and gathered
    the trash still on the table. After dumping it into the bin, he stood there, facing
    away from us, for a long moment before he returned, but he didn’t sit down. “I’d
    like to go home now, so if you would …” He motioned toward the door.


    Dad and I stood. “I have one more question,” I said as I pushed in my chair.


    `Marco`’s expression tightened, but he motioned for me to go on.


    “Who was it that Lyle was afraid of?” I was pretty sure I already knew, but I
    wanted to hear it from someone else.


    `Marco` walked us to the door, jaw working the entire time, as if he had to chew
    on the words before he said them out loud. He paused with his hand on the lock
    before he turned and stared directly into my eyes. The heat in his voice could
    have peeled paint.


    “It was that meathead Valerie Kemp calls a boyfriend,” he spat. “Mickey Robbins.
    He’s the one who threatened Lyle, and I’d be surprised if he wasn’t the one who
    killed him.”


    # 8


    `Mickey Robbins`. At every turn, his name—and the man himself—seemed to pop up.


    The TV was on, but no one was watching it. Dad was sitting with his tablet in
    hand, pouring over the latest version of the contract his agent had sent him.
    I couldn’t tell if there were sticking points with it, or if his pinched brow
    and frown was because he still couldn’t make sense of the legal jargon.


    `Laura` had been in and out over the last hour, checking in with the both of us,
    but not prying too much about what we’d discovered. She’d already packed everything
    for our beach day and had asked us twice if we were still planning on going. We
    both assured her we were.


    I wasn’t sure she believed us.


    And Paul … A quick call after we’d gotten back from the Italian Roll informed
    me that he was still helping the local police with the case. A promise that he’d
    be back soon followed, and then he was gone.


    So, with nothing else to do, I mentally replayed everything I knew in the hopes
    of having an epiphany that would solve the case and allow me to enjoy the rest
    of my vacation, stress-free.


    `Death by Java` was struggling. `Lyle Carrigan`, the health inspector, had been
    threatening to cite them for violations. `Valerie` had thought Lyle was harassing
    her. `Tito` thought the same thing with regard to his own business. `Mickey` didn’t
    like it, and he all but threatened Lyle in front of everyone. Even `Marco` knew
    about it.

