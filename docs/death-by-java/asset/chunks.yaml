    “你病了？”我问道，环顾着整个公寓。家具很简陋，但还算体面。电视开着但静音了。咖啡几上放着一盒 `Kleenex` 纸巾，旁边放着一张揉成团的纸。


    纳迪亚回答时有些轻微的犹豫。“嗯，吧。”纳迪亚走过我身边，回到沙发上的位置坐下。她拿起纸巾，擦了擦看起来很干的鼻子，尽管她的眼睛红红的，满是忧虑。


    “纳迪亚，”我说，示意父亲跟着我一起进客厅，她正坐在那里。“我和 `Aaron` 谈过了了。”


    她眨着眼睛看着我。“噢，然后呢？”


    “他说你们俩……”我不知道该怎么收场才不会显得礼貌，于是只是模糊地向她挥了挥手。


    这换来她一个巨大的大白眼。“搞在一起？人们确实会做那种事的。”


    父亲在我身后冷哼了一声。


    我没理他。“你知道他以前和 `Valerie` 结过婚对吧？”


    “废话。”又是一个大白眼。“我不傻，你知道吗。但他们现在没在一起，我也没打算跟他同住之类。”她似乎放松了些。“如果你是为了这事来的，你可以走了。我没必要跟你谈论我的感情。”


    “不，你不需要，但是——”


    “你知道的，”纳迪亚站了起来，“我觉得你 `应该` 走吧。我不该让你进来的。”


    “`Aaron`……”


    “不关你的事。”她交叉双臂，抖着光脚脚脚。“我要求你离开。别逼我叫管理员。”


    我脑海中浮出一个头发稀疏、油光水脑的男人，脖子上挂着一条粗金链，垂在敞开的衬衫里，胸口满是毛，随即我打掉了这个念头。“我——”


    “我可以用一下你们洗手间吗？”父亲插话道。“我真的很不想这样打扰你们，但是……”他把手放在在肚子上。“我乳糖不耐，我们在过来之前犯了错误买了一杯奶昔。这胀气要了我的命了，如果我不快缓解一下……”


    “好吧，真恶。”纳迪亚本就苍白的脸色泛起了绿光。“左手边第一个门。快点。还有，用完记得用那个喷雾。就在马桶背上。”


    “谢谢。”父亲向我眨了一个只有我能看见的眼，然后像真的爆炸了一似的大步着走进了走廊，仿佛他真的快要爆炸了。


    我们都看着他离开，然后转而面对面。


    “纳迪亚，”我说，用最和蔼、最温柔的语气，“我来这里不是为了 `Aaron`。”


    她眨着眼睛看着我。“噢？”


    “在 `Lyle Carrigan` 死的那天晚上，你在 `Death by Java`。”


    纳迪亚深吸了一口气，手放在了胸口。“我……我不知道你在说什么。”


    “`Lyle` 和 `Marco Rossi` 一直在一起干，”我说。“他们试图让 `Death by Java` 和 `Tito’s Deli` 关门，这样
    `Marco` 就能把意大利面卷饼搬到新的、更好的地点去。”


    “你为什么要告诉我这些？”她问道，尽管从她眼神在房间里游移来看，我知道她完全清楚我为什么要这么说。


    我继续说道。“Tito 告诉我，他不得不开掉一名员工，因为每当那个员工上班，就会出现卫生违规问题。一旦那个员工走了，违规问题就停止了。”


    纳迪亚向后退了一步。“真的。我不知道——”


    “你当时和 `Lyle` 在一起，”我打断了她。“你在帮他破坏 `Death by Java`。”


    我预料会有另一个否认，但纳迪亚的表情变得硬了起来。“又怎样？如果那地方关门了，我也不会损失什么。看看这地方。”她朝向她那些简陋的家具。“按照 `Ms. Kemp`
    给我的工资，我连披萨都买不起。”


    “发生了什么？”我问，尽管内心紧张得不行，但依然保持声音稳定。“那天晚上。你告诉 `Aaron` 你在 `Death by Java` 有事，所以他一直在那里等你。”


    她叹了口气。“我很蠢。我不是故意要漏口风的。”


    “但你确实漏了。他抓到你和 `Lyle` 会面了吗？”


    “什么？没有。`Aaron` 在 `Lyle` 出现之前就离开了了，我确认过的。”她那股防御的神态开始动摇。“但当 `Lyle` 真的到时，他……不一样了。”


    “怎么不一样？”


    走廊尽头，门微微开启了一缝，告诉我父亲正在听我们说的话。很好。


    “他……”她皱起眉。“他不想做。我从未破坏过任何东西。我只需要在 `Lyle` 出现时开门让他进来。他做他的事，我锁好门，就这样。我的意思是，在他死的那个晚上，他还很好。”


    我脑海中灵光一闪。那个我和 Laura 看到亮着光的晚上，`Lyle` 在破坏制冰机，这样他就能在第二天早上出现并以此指控 `Valerie`。


    “他答应过没有人会受伤，”纳迪亚继续道，“而且不会惹麻烦，因为没有别人知道这件事。然后，当 `Death by Java` 关门后，`Marco` 会会给我一份工作，工资比
    `Ms. Kemp` 给我的高。我就可以搬出这个公寓，找个真正的房子，不用再这样过苦日子了。”


