    laughed.


    “I’ll, uh, keep that in mind,” Paul said.


    “Good.” I grinned. “I’ll talk to you when you get here. You’ll fill me in?”


    “I will. Talk soon.”


    And then he was gone.


    I tapped my phone on my palm, thinking. The police were done at Death by Java.
    Valerie might still be there. I could ask her about Mickey, about what she knew
    about the crime.


    “Dad?” I called into the living room.


    “What do you need, Buttercup?”


    “You up for a field trip?”


    He stepped into the dining room with a grin. “I thought you’d never ask.”


    Not only had the police left Death by Java, but so had the crowd. The usual foot
    traffic passed outside, but not even a possible murder was enough to garner interest
    for the bookstore café. Valerie truly did have her work cut out for her if she
    wanted to turn things around.'
