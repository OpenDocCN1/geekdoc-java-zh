  raw: '“You know, I do have a grill,” Dad said. “We could pick some things up and
    spend the day outside. It’s just as relaxing as the beach, but without all of
    the driving.”


    I set my mug down, fiddled with the handle. “Whatever you decide,” I said, trying
    to come up with some way to sneak away for a little while without raising suspicions.
    And I most definitely didn’t want Paul anywhere near Dad’s car, where Lyle’s tablet
    was currently hidden under the passenger’s seat.


    Dad snapped his fingers. “I forgot to ask. Did Larissa get ahold of you yesterday?”


    “Yes!” I snatched onto the lifeline he’d thrown me. “She wants to meet up with
    me tonight. Renee too.”


    “That’s great.” Dad sounded genuinely happy. “I always liked Larissa and Renee.”
    He turned to Paul. “You should have seen them all together when they were younger.
    Those four girls—Vicki included—were a handful.” He chuckled. “I’m surprised it
    took so long for my hair to fall out, considering how much stress they caused
    me.”


    “We weren’t that bad.”


    “So you think.” Dad laughed. “We had to repaint your room, what? Three times in
    a single year? First it was the nail polish fiasco. Then that time Renee tried
    to do a backflip off your bed.”


    “She didn’t *try*,” I said. “She managed it just fine.” Then lost her balance
    and crashed headfirst into the wall. She came out of it intact. The wall … not
    so much.


    “You can still see the indentation where I tried to fix the wall,” Dad said. “You
    should have Krissy show you sometime.”


    “I might do that,” Paul said, though I noted his smile had turned speculative
    as he regarded me.


    I decided to change the subject before he could ask me what was wrong. “I forgot
    to tell you that Larissa and Renee asked me to dinner tonight. They want to make
    it the three of us, but I can always ask them if it would be okay to bring you.”


    “No, that’s all right,” Paul said. “You go. See your friends.”


    “We’ll keep him out of trouble,” Laura added.


    I picked up my coffee mug, ran my lips over the rim. “I can’t help but feel like
    I’m ruining this whole trip,” I said. “We’re supposed to be doing things *together*,
    and I keep running off on my own.”


    “It’s all right. *Really*.” Paul reached over and put a hand on my forearm. “It’s
    good to see you get out. We don’t have to spend every waking moment together.
    We don’t back home. I don’t see why we have to here.”


    “And I don’t mind having him around,” Dad said. “Gives me a chance to tell him
    stories about you.”


    “Ugh. Please don’t.”


    Dad merely smiled. Laura was no help.


    I sighed, resigned to having my life story told without my input. I had a feeling
    I’d be trying to set the record straight on the flight home, and likely for days
    afterward.


    “We can always grill out this afternoon,” Dad said. “That way, you can still see
    your friends tonight.”


    “We’ll need to go to the store,” Laura said. “We’re out of anything grill-able.”


    “You three can do that,” I said. “I’d like to run an errand or two of my own.”


    “Oh?” Dad asked. “We could always drive you.”


    “No, that’s okay,” I said. “Valerie is reopening Death by Java this morning. I
    want to stop in and make sure everything is running smoothly. It might take five
    minutes, or it could take an hour if she needs my help. Since I gave her suggestions,
    I feel kind of responsible for her.”


    “Understood,” Dad said. “That work with everyone?” Nods went around the table.
    “Perfect. You can take Laura’s car and—”


    “Actually,” I cut in. “I’d like to take yours. I’m more comfortable with it.”


    “My car has more room for groceries,” Laura pointed out.


    Dad studied me a long moment, and I just *knew* he was trying to piece together
    my movements from last night. I gave him my best vacant stare until he polished
    off his coffee and clapped his hands together. “Well, I suppose it’s settled then.
    We’ll meet back here in, let’s say, two hours? Gives us time to shop and you time
    to deal with Valerie.”


    “Sounds perfect,” I said, rising.


    Dad and Laura started cleaning up after breakfast, and Paul took me aside.


    “You sure you don’t want me to come with you?” he asked.


    “I’m sure.” And to prove it, I kissed him squarely on the lips. “I have to do
    this.”


    “I know you do.” He gave me a hug, and then a moment later, we were out the door.
    I took my time getting settled in the car so that the other three were out of
    sight before I started down the road. Yes, I was going to check in at Death by
    Java, but that wasn’t the real reason why I wanted to go alone. Nor was it the
    first place I wanted to stop.


    My palms sweated all the way to the Redwood Village Police Station, and I could
    hardly sit still in my seat. Nerves had me adjusting and readjusting my seat belt
    at least a dozen times. The same went for the rearview mirror. And I couldn’t
    decide whether I was cold from the air-conditioning or hot from the bright morning
    sun. I eventually rolled down the window and let the cool breeze wash over my
    flushed skin as a sort of compromise.


    I pulled into the parking lot, which was dotted with a handful of cars I assumed
    were the personal vehicles of the officers. I turned off the engine, then sat
    there and breathed in and out. I could do this. If I was back home in Pine Hills,
    I’d think nothing about carrying the tablet inside and handing it over to Detective
    Buchannan. He’d be annoyed that I’d involved myself in his investigation, and
    he’d threaten me with a night in a jail cell, but he’d take it and would use it
    as best he could to nail the bad guy.


    But I wasn’t in Pine Hills. Detective McKensie might not be as forgiving as Buchannan,
    which was a strange thing for me to say, considering how *un*forgiving Buchannan
    could be. I could imagine McKensie snapping the cuffs on me and charging me with
    theft or contaminating a crime scene or any number of offenses that might or might
    not have merit.


    *I’m here. I might as well get it over with.*


    Huffing out a breath, I slid Lyle’s tablet into my purse and climbed out of the
    car. The police station was larger than the one in Pine Hills, but it felt strangely
    similar as I entered through the glass front door. Officer Peel was waiting for
    me inside.


    “I was beginning to wonder if you were going to come in or if you’d sit out there
    all day,” he said, eyeing me like he might a common criminal.


    “I’d like to speak with Detective McKensie,” I said.


    Officer Peel made a sort of snapping, *click*ing sound out of the corner of his
    mouth. “Would you, now? What is this regarding?”


    “It’s about the Lyle Carrigan murder.” I kept my expression blank and avoided
    patting or otherwise touching my purse, lest he catch on and want to see what
    was inside. Explaining it to Detective McKensie was going to be hard enough.


    Peel glanced around the room, stroking his mustache. Other officers were busy,
    or were at least putting on the appearance of being busy. Every so often, eyes
    strayed to a door across the room, which made me wonder if someone of importance
    was there.


    “Does the detective know you were coming?” Peel asked. “Or is this an impromptu
    visit?”


    “I didn’t call ahead.” My annoyance flared. “This is important. Is she here or
    not?”


    Another *click*, another stroke of his mustache. “She is. However, she is extremely
    busy. It would be best if you filled me in on what’s so important that you had
    to come down here this morning.” He took a step toward me as he hooked his thumbs
    into his belt and puffed out his chest. “I’m all you’re going to get.”


    “Dudley. Just send her back.”


    Red crept up Officer Peel’s—Dudley’s—neck at the sound of Detective McKensie’s
    voice. He held his puffed-up pose a moment longer before deflating. “Down the
    hall, first door on your right.”


    “Thank you,” I said, giving Peel my best smile before stepping past him.'
