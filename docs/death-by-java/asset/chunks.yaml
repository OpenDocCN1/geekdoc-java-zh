    “I do feel kind of bad, though,” he went on, deflating just a little. “I didn’t
    know the health inspector guy all that well, but I knew his wife some. We kind
    of hooked up a few years back.” The cocky grin was back, but it barely registered
    on my consciousness.


    “His wife?” I asked. “Lyle was married?”


    “Sure was,” he said. “Name’s Leanne. I fixed their water pump about a month ago.
    Or maybe it was two, three weeks back.” His eyes went distant as he thought about
    it, then he shook his head. “Anyway, thought maybe she might like to hook up again,
    you know, for old time’s sake?”


    “Sure,” I said. “Was she interested?”


    “Nah. She was too upset.”


    “Upset? Why?”


    Roman shrugged. “Beats me. She said something about her husband and his job. I
    thought maybe he was getting pressure from the top to work harder or something.
    By then, I was just about done with the job, and since she wasn’t keen on getting
    a little dirty, I was itching to get moving. I had another job lined up, one with
    far better prospects when it came to the side-benefits department.”


    *Oh boy.* This guy was so full of himself that he didn’t seem to understand his
    bragging came off as creepy and sexist.


    “Did you talk to her after that?” I asked, somehow keeping the disgust out of
    my voice. “Or with Lyle?”


    Before he could answer, the back door opened, and Valerie rushed out of it with
    Farrah right behind her. “Roman! Thank goodness you’re here. We need to talk.”


    “Be right there, babe,” he said, then turned to me. “You know, if you want to
    talk about this some more, we could always meet up later. I know this place—”


    “No thanks,” I said before he could finish. “I’ve already got plans.”


    He shrugged, seemed unconcerned by the rejection. “You can find my number online
    if you change your mind,” he said before turning a wide grin on to Valerie. “I’m
    all yours,” he told her, and she whisked him off to the back.


    “He’s so gross,” Farrah said, before producing her phone and dismissing me without
    so much a look.


    That he was. But for as gross Roman might be, he wasn’t entirely useless. Our
    little chat had produced one important tidbit of information I hadn’t had before.


    Lyle was married.


    Not only that, but his wife had been upset weeks before his murder. Was she upset
    with Lyle? Mad enough to kill him? Or was it about something else entirely?


    There was only one way to find out.


    “Whew,” Dad said, joining me a moment later. “I wasn’t sure I was going to be
    able to get away. Once Rita gets rolling, she doesn’t stop talking, does she?”
    He paused, studied me. “Did I miss something, Buttercup?”


    I considered telling him that it was nothing and that we should go meet Laura
    and Paul back at home, but I *knew* I wouldn’t be able to do that. Besides, it
    was still early. We had more than enough time to make one more little stop before
    heading back to Dad’s.


    “You up for another field trip?” I asked him, dangling his car keys in the air.


    Dad snatched them out of my hand with a grin, “Just tell me where you want to
    go.”


    Lyle and Leanne Carrigan’s address wasn’t hard to find online. By the time Dad
    and I were strapped into his car, Dad had already warned Laura and Paul we might
    be a few minutes late, and I’d already brought the address up on the navigation
    screen. Dad followed the directions without asking a single question, though I
    could feel the curiosity coming off him in waves.


    The Carrigans lived in a quiet neighborhood full of modestly sized homes that
    were a smidge too close together for my liking. No one had a garage—it was on-street
    parking only, and the street itself was rather full, outside a couple of notable
    gaps marked by handicap signs. Those houses all had ramps leading up to their
    front doors.


    The Carrigan house had no such ramp. We found a parking spot nearby and made the
    short walk from the street to the small square of concrete that served as a front
    stoop. There was no doorbell, so I knocked.


    The door opened almost immediately, and a red-eyed woman with light brown hair
    and a slim build answered. “Yes?” she asked, voice cracking ever so on on the
    word.


    “Leanne Carrigan?” At her nod, I continued, “I’m Krissy Hancock. This is my father,
    James. I knew your husband, Lyle. I was hoping we could talk briefly, if you have
    the time.”


    Leanne stepped aside wordlessly. She’d probably had visitors of all sorts over
    the last few days, so what was a few more? Dad and I entered a dimly lit home
    full of a lifetime of memories. Books, collectibles, and general *stuff* filled
    nearly every space. All of it was dusted and kept clean, but it gave the house
    a lived-in, full-of-life vibe that made my heart ache just a little bit.


    Leanne led us into a small dining nook. The table was big enough for two to sit
    at and eat comfortably, but any more that than would be a challenge. There were
    only two chairs. Leanne motioned for Dad and me to sit, while she chose to lean
    up against the door frame, arms crossed defensively, as if she were afraid we
    were going to tell her something that she didn’t want to hear.


    “It’s nice of you to come,” she said once we were settled. “Lyle was a good man,
    but he had his problems.”


    She sighed. “We spent a lot of time together, even though we didn’t speak. Having
    one another there was enough.” She wiped away a tear.


    It was clear I needed to keep this brief and let Leanne Carrigan get on with grieving,
    but I wasn’t sure how to ask what I wanted to ask without upsetting her.


    “Lyle seemed to focus on work when I saw him,” I said. “He never spoke about his
    family life or what he did outside the job. I didn’t even know he was married
    until I talked to a man named Roman.”


    A flash of something unkind shot across Leanne’s face, replacing her grief for
    an instant. “I see.”

