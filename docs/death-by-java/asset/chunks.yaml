    The question, *Can’t you talk to someone else?* was on the tip of my tongue, but
    I bit it back. Even if she could, there was no way I could go to the beach and
    enjoy myself now. Not with an unsolved murder. Not with Valerie sounding as if
    she was scared for her life. She might be overstating things, might be shooting
    for overly dramatic so she could get her way, but could I really turn my back
    on her?


    I sighed. “All right. Tell me where you want to meet.”


    “My place. I feel safe here.” She rattled off her address so fast, I had to ask
    her to repeat it twice before I had it committed to memory. “Thank you so much,
    Krissy. I know …” She coughed, cleared her throat. “I know I haven’t treated you
    the best over the years. The words are always out of my mouth before I realize
    I’m going to say them, and you know how it is, right? I have an image to keep
    up, so it’s not like I can just apologize where everyone can hear.”


    “I get it.” I didn’t like it, but I understood it. To Valerie, her reputation
    was her life. As a teen, she couldn’t be seen being cordial to someone as lowly
    as me. And she most definitely couldn’t be seen as ever being in the wrong. “I’ll
    be there in twenty minutes.”


    We clicked off, and I just stood there, my back to the others, rubbing at my eyes.
    A headache was forming, and I had a feeling it was going to be the sort that would
    last all day.


    “That was Valerie Kemp, I take it?” Dad asked.


    I nodded, heaved another sigh, then turned around. “Something’s come up.”


    “We heard,” Laura said.


    “I’m sorry. I can’t abandon her.” I wished I could, but it just wasn’t in me.


    “No need to apologize,” Paul said. “We understand. If you want, I can—”


    “No.” I held up a finger, forestalling him. “You three are going to the beach.”


    The three of them shared a look. It was Dad who answered. “We could always wait
    for you to finish with—”


    I turned my finger toward him. “No. Go. I have no idea how long this is going
    to take or even what it is she’s so scared of.” Other than Mickey. I squeezed
    my phone, was tempted to throw it, before I pocketed it. “If this only takes a
    few minutes, I’ll get an Uber and meet you guys there. Otherwise, I’ll see you
    when you get back.”


    “I don’t—” Paul snapped his lips together when I threatened him with my finger.


    “If you’re sure …” Laura sounded uncertain.


    “I’m sure,” I said, hating it that I was. “Go to the beach. Have fun. Show Paul
    all the sights. If I can’t make it today, we still have next week.”


    “Can we at least give you a ride?” Laura asked. “There’s no reason for you to
    have to call an Uber when we’re right here.”


    Worries that Dad or Paul might use it as an excuse to accompany me inside Valerie’s
    almost had me declining, but she was right. “That would be great.”


    I gave Laura Valerie’s address, and then we piled into the car. Dad and Laura
    sat up front, with Paul and me in the back. As soon as we were strapped in, Paul
    took my hand and gave me a level look.


    “If you change your mind and want me to come in with you, just say the word.”


    “I’ll be okay,” I said. “Valerie’s probably blowing this whole thing out of proportion.
    And, hey, if Dad’s right and Laura drives too carefully, I might even beat you
    guys to the beach.”


    “I heard that,” Laura said from the front, while Dad merely chuckled.


    “What about tonight?” Paul asked.


    I almost asked him what he meant, but then it hit me. “The reunion thing?”


    He nodded. “The reunion thing.”


    “I don’t know. If Valerie is scared now, then I doubt she’ll want to go. And if
    she doesn’t go, I’m not sure anyone else will.”


    “I got the impression that *you* were the guest of honor.”


    I made a face. “I’m not sure how that happened. I wasn’t joking when I said Bray
    and company weren’t my friends.” But what if some of my old high school friends
    *were* there? I’d feel bad if they showed up and I didn’t. “Let’s play it by ear.
    If everything’s settled by tonight, then we can consider going.”


    “Works for me.”


    It took less than the promised twenty minutes to arrive at Valerie’s place. The
    small bungalow sat at the end of a quiet, tree-lined street. The yard was barely
    there, but what little there was of it was well-tended. A short driveway led to
    a single-car garage. Laura pulled up behind one of those electric cars that looked
    more like a toy than something anyone would actually drive. I thought it was a
    strange choice for Valerie; she seemed the type to go for something far showier.


    “I’ll let you know how it goes,” I said as I climbed out of the car.


    “Good luck,” Paul said with a parting kiss on my cheek.


    A moment later, he, along with Dad and Laura, were off to the beach, and I was
    striding toward the paved walkway that led to the front door of a woman whom I’d
    once considered my nemesis.


    As I rounded the small electric vehicle, I peered through the window of the garage
    and was surprised to see another car inside. The silver BMW was far more Valerie’s
    style. And even though it was sitting in a garage, she’d put in one of those window
    screens that was supposed to keep the sun from heating up the inside. I frowned
    at it, wondering, if *that* was Valerie’s car, then who drove the small, toy-sized
    car out front?


    I had my answer the moment I reached the door.


    The bungalow had one of those large windows by the front door that took up a good
    portion of the frontage. The blinds were raised and the curtains parted, so that
    as soon as I was in front of it, I could look directly into the living room, where
    Valerie was seated on the couch, head buried against Hugh’s shoulder. Her ex-boyfriend
    had his arms around her and was gently caressing her back and kissing the top
    of her head every couple of seconds.


    Feeling like a voyeur, I looked away as I knocked on the door.


    Valerie answered promptly, eyes red and swollen, as if she had, indeed, been crying,
    though there were no streaks in her carefully applied makeup. She motioned for
    me to enter, then led the way to the living room, where Hugh was now seated in
    a wooden rocking chair by the window, as if he’d been there the entire time. He
    kept his gaze firmly planted on the tops of his shoes.


    “I’m glad you came, Krissy,” Valerie said, sitting back down on the couch. “I
    was beside myself and didn’t know who else to call.”'
