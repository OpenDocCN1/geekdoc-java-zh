    None of us were. “Mickey,” I said. The anticipation was killing me. “Who did you
    see that night?”


    Both of his hands bunched into tight fists. When he spoke, he did so through clenched
    teeth. “Aaron,” he said. “Valerie’s ex-husband. He was standing outside `Death
    by Java` that night. And by the look of things, he was waiting for someone.”


    # 23


    My phone rang as I was about to climb back into Dad’s car.


    “Hi, Dad,” I said by way of answer. “Sorry I took off on you like that. Something
    came up.”


    “Where did you go?” There was a faint twinge of worry in his voice. “Paul and
    I came out of the office, and you were gone. *With* my car, I might add.”


    I debated on making up some story about needing to run to the store, but I changed
    my mind. I needed to talk to `Aaron Middleton`, and I didn’t want to do it alone.


    “`Mickey Robbins` called,” I said. “He wanted me to meet him at `Village Park`.”


    A short pause before, “And you went alone?”


    “It’s a public place. He bought me a pretzel.” As if that made my risky vanishing
    act okay. “He wanted to set the record straight about some rumors going around
    about him.”


    “Did he?”


    I considered it. `Mickey` could easily have lied about his past, his involvement
    in his friend’s death, but I didn’t think so. “He did. And I don’t think he killed
    `Lyle Carrigan`.”


    “Oh?” Genuine curiosity filled Dad’s voice. “Then who did?”


    I glanced at the pretzel I’d carried back to the car. It was resting in the passenger’s
    seat, uneaten. It would be poor backup if and when I confronted `Aaron` about
    what `Mickey` had said about him.


    But Dad …


    “Is Paul still there?” I asked. “As in, within hearing distance?”


    There was a faint *click* I took for a door closing. “He’s in the living room.
    I told him I would call you and see where you’d run off to. I’m in my office now.”
    A beat, and then, “What do you need me to do?”


    “First off, don’t tell Paul where I went.”


    “I won’t,” Dad agreed. “But *you* should when you see him next.”


    “I know. I will. But not yet.” My mind was racing with possibilities. “Make up
    some story about why you need to leave. Your car broke down, and you need to meet
    me so we can wait for a tow truck, perhaps.”


    “He’ll want to come,” Dad said. “And it doesn’t make much sense for me to meet
    you on foot if the car broke down.”


    “I don’t know. Make up whatever you want,” I said. “Just … don’t let him come.”
    I winced as I said it. I didn’t think Paul would interfere with my plan to talk
    to `Aaron`, but he wouldn’t be happy about it. And, just like with `Mickey`, I
    doubted `Aaron` would talk if a police officer, even one who didn’t have jurisdiction
    in the `Village`, was listening to what he had to say.


    No, this was something I needed to do, not quite alone, but without official backup.


    “I’ll come up with something,” Dad said. “Where are we going?”


    I almost told him, but I caught myself. I didn’t think Dad would spill the beans,
    but telling him meant he’d be forced to lie to Paul’s face when he was inevitably
    asked where we were headed. He was already stretching the truth as it was. No
    reason to make it worse.


    “I’ll tell you when I pick you up. I’ll be waiting for you outside the `Kemp`
    house down the street in about five minutes.”


    “It might take me longer than that to wiggle my way out of here without raising
    suspicions.”


    “That’s okay. I can wait.”


    I clicked off, mind whirling. I felt like I was getting close to learning who
    had killed `Lyle`, and the thrill of the chase was starting to take over. Yes,
    I knew what I was doing was risky. Yes, I knew I should simply call `Detective
    McKensie` and tell her everything `Mickey` had told me and let her handle it.


    But if I was wrong, then I’d be wasting her valuable time, which, in turn, might
    allow the killer to escape. And it wasn’t like I was going to go up to `Aaron`
    and demand he admit to killing `Lyle`. A few questions never hurt anyone, especially
    if I could couch them in questions about his relationship with `Valerie`.


    I started the car and drove the short distance to `Valerie`’s parents’ house.
    I pulled up to the side of the road and parked, but I left the engine running.
    Dad wasn’t there yet, so I sat back and chewed on the pretzel `Mickey` had bought
    me as I worked through what I knew.


    `Lyle` was working with `Marco`, who wanted to move his place of business. He
    used someone at `Tito’s Deli` to help sabotage the business, to create health
    violations he could then cite. The assumption was that he’d done the same at `Death
    by Java`. Somehow `Lyle` ended up dead. Because his conspir had turned on him?
    Because their plan was discovered? I didn’t know.


    But `Aaron` was waiting outside `Death by Java` on the night of the murder. That
    put him at the murder scene near the time of death. Even if he didn’t kill `Lyle`,
    there was a chance that `Aaron` saw who did, even if he didn’t realize it.


    By the time Dad came speed-walking down the sidewalk, I was just about bouncing
    from my seat.

