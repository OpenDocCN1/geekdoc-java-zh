    瓦莱莉极力忍受着。她盯着自己那双华丽的鞋尖看了好几秒钟，然后颓然了下去。“罗宾斯。他的名字叫米基·罗宾斯。”


    当麦肯西侦探问道“罗宾斯先生昨晚在哪儿？”时，她的语气里没有任何得意的感觉。


    在瓦莱莉回答之前，门开了，皮尔警官探出头进来。“侦探。外面来了一个警察。他说想和你聊一会儿。”


    当 `McKensie` 说“让他进来”时，她的眼睛一直没有离开过瓦莱莉。


    `Peel` 犹豫了一下，抽动着胡子须显示出他的不耐烦，随后他消失在门外。


    “米基是无辜的，”瓦莱莉说，“他整晚都跟我在一起。”


    即使是*我*也不相信她，而且我并没有受过识破谎言训练。瓦莱莉真的不擅长撒谎。她的眼睛在房间里乱转，声音语调起伏不定。也许这些并不是欺骗的迹象，但确实让她看起来很不像在说真话。


    我身后的门开了。我本以为会有另一个红木村的警察进来，但进来的却是保罗·达尔顿，他穿着跑步短裤和无袖背心。


    `McKensie` 看到他时似乎也和我一样惊讶。“你是？”


    “保罗·达尔顿警官，”他一边走上前，一边拍了一下我的手臂，伸出一只手。“松树丘警察局的。我知道这不是我的管辖范围，但我想顺路过来看看能不能帮上什么。”


    “我猜松树丘是在俄亥俄州？”`McKensie` 说，“你就是前面提到的那个男朋友？”


    我再次对 `McKensie` 反应如此之快感到惊讶。“是的。”


    保罗的笑容一如既往地迷人。“是的。我是他。克丽西遇到麻烦了吗？”


    麦肯西侦探笑了。“没有。她可以走了，不过如果她能把联系方式留外面的 `Peel` 警官，我会很感激，以防我还有后续问题。”


    我松了一口气。“我们不打扰你们了——”


    “事实上，”`McKensie` 打断了的话，“我想和这里的达尔顿先生聊几分钟。”她朝门口比了比。“你可以在外面等他。”


    反对的话已经到了嘴边。保罗知道的没我多得少。他现在出现在这里是因为他正好在外面跑步，看到了动静。他可能发现了爸爸的车，或者是发现了爸爸本人，于是过来调查。然后，在听到我在里面和警察交谈后，他进来确保我一切无事。


    *或者为了确保我没有让自己卷入一场谋杀调查。*


    “去去吧，”保罗说，“这只需要几分钟。”


    尽管如此，我还是犹豫了。我想知道知道 `McKensie` 侦探会问保罗什么，她是会核实我的说法，还是会试图在故事中找破绽。保罗是对的；这不是他的管辖范围，她为什么要找他谈话？他帮不上她。他不是这里的警察。


    不过话说回来，我也不是。我在*任何地方*都不是警察。


    “我和爸爸在一起，”我说。我接过他的手，捏了捏，然后朝门口走去。


    爸爸在稀疏许多的人群中等着我。“还好吗？”他问。


    “不太好。”我交叉双臂，不安地跺脚，紧张得无法站稳。我低声问：“你还记得那个健康检查员吗？第一天来这里的那个？”


    “我记得。”停顿了一下，然后说，“是他吗？”


    “是的。我不知道发生了什么，但里面的侦探表现得就像是*谋杀*一样，”我几乎是耳语出这个词，但它引起了周围人的注意，他们立刻开始交头接耳。


    提托附近的动静引起了我的注意。我本以为是提托回到了外面，或者是他的某个员工走了出来看热闹，但这两者都不是。


    是米基·罗宾斯。


    “爸爸……”我低声说，指了指米基站的地方。


    “我看到了。”


    米基正伸着脖子看 `Death by Java` 内部，但他并没有走得近到让 `Peel` 警官注意到他。事实上，尽管他显得很紧张，但他极力让自己在*所有人*面前显得不显眼。他用左手揉着右手，起初我以为那只是紧张的动作，但很快我意识到不仅于此。他的右手指节上缠着绷带。我不确定，但那只手的指似乎肿了，好像他击中了足够硬的东西，被打断了两根骨头。


    米基观察这一幕整整好了一分钟，也许两分钟。然后，在环顾四周确保没有看到看到后，他悄悄离开了。


    # 6


    “你还好吗，小宝贝？”


    我低头看着咖啡，不理智地希望自己喝的是最近习惯了的那种香料奶茶。在倒咖啡前放进那个缺口咖啡杯里的巧克力奇干饼产生的泡沫早已消失，几块软塌塌的碎屑浮在水面上。爸爸声称，杯上的缺口是象征性的。他说这反映了生活中，即使是受损的东西仍然可以发挥作用。事实上，他对待碗具和低水龙头时总是粗心。


