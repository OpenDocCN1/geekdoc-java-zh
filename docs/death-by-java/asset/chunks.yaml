    Which meant Aaron didn’t view him as competition, unlike Mickey.


    And while he hadn’t said it, it was obvious that Aaron wanted Valerie back. One
    look at the way he looked at her, at how he worried about her, and you could see
    it.


    But would his, dare I call it, `obsession` with Valerie Kemp cause him to kill
    someone like Lyle Carrigan, all to make Mickey Robbins look bad?


    I was trying to formulate some sort of question that would answer that for me
    without making it too obvious what I was thinking when the door opened and Detective
    McKensie stepped outside. “All done in there,” she said. If she was surprised
    to see Aaron in the driveway, she didn’t show it. “Ms. Hancock. A word?”


    Aaron took a step toward the door, reconsidered. “May I check on Valerie?” he
    asked the detective, as polite as could be.


    McKensie eyed him a moment before nodding. “She’s inside.” She watched Aaron as
    he scurried inside. “That woman has more clingers-on than a Velcro sweater.” She
    turned to me. “Ms. Kemp called you?”


    *A Velcro sweater?* I shook off the thought. “She did.”


    “She has concerns about her boyfriend, and she calls *you.*” The emphasis on the
    last word was accompanied by an unspoken question. *Why?*


    “We’ve known each other a long time,” I said, though *known* was a bit strong
    of a word. “And since I’ve been helping around `Death by Java` over the last few
    days, I imagine she thought that perhaps I might have a few insights into what’s
    going on.”


    “About her relationship?” Spoken flat. “From what I gather, you two barely know
    each other. You don’t live around here anymore, isn’t that correct?”


    “No, I don’t,” I admitted. “And to tell you the truth, I don’t know why Valerie
    called, other than that I was convenient. Maybe she didn’t want to talk to her
    exes about her current boyfriend since it would be awkward and might hurt a few
    feelings.”


    “Then why not call a friend?” McKensie asked. “Some one she sees regularly. You
    two are practically strangers these days.”


    I bristled at that, but honestly, she wasn’t wrong. “She could have wanted a fresh
    opinion. I don’t know Mickey beyond sight. I have no preconceived notions about
    him, no past history.”


    “An outside opinion?”


    I nodded. “She’s worried Mickey might have been the one to have hurt Lyle. Hugh
    and Aaron likely would lean toward agreeing with her because of their past relationships.
    I imagine some of her friends might feel the same way, especially if they have
    a negative opinion of Mickey.”


    “Do you?”


    “I don’t know,” I said. “It’s not my place to say. I came here, told Valerie that
    she should tell you everything she knows, and …” I gestured toward her, as if
    saying, *“And now my job is done.”*


    McKensie eyed me for a long moment before she asked, “What can you tell me about
    Mr. Carrigan’s tablet?”


    I hesitated, surprised by the sudden shift. “His tablet? The one with the rubber
    case?”


    “I assume so.”


    Realization hit, causing my eyes to widen. “It’s missing?”


    McKensie just stared, neither confirming nor denying it. But if she was asking
    about the tablet, then chances were good that the police hadn’t found it. Valerie
    *had* mentioned that it wasn’t near his body. I’d assumed he’d left it in his
    car, or perhaps at home, but what if the killer had taken it?


    “He was carrying it every time I saw him,” I said, thinking it through. “He used
    it for work, so I don’t know whether he ever carried it with him for personal
    use.”


    “When did you last see it?”


    I thought back. “I suppose it was the last time I saw him.”


    McKensie’s expression turned annoyed. “Which was …?”


    “At the Italian Roll,” I said, though uncertainty marred the words. “I’m pretty
    sure that was the last time I saw him.”


    “‘Pretty sure’?”


    “Almost positive,” I amended. “He was leaving just as I arrived. He had his tablet
    with him then.” I waited a beat, then said, “Valerie told me he didn’t have his
    tablet when she found his body. I take it you didn’t find it in his home?”


    I might as well have asked a brick wall. “If you recall any other instance when
    you might have seen Mr. Carrigan, please let me know.” She looked at her watch
    and scowled. “I’d like to discuss Mr. Robbins with you, but I have somewhere else
    I need to be.”


    “I’m not sure I can tell you much more than what Valerie has already told you
    about Mickey,” I said. “Like I mentioned before, I barely know him.”


    “Be that as it may, I’d like to have a little chat. I’ll contact Paul, set up
    a meet.” A change came over her face when she said Paul’s name. A lightening around
    the eyes, the bleeding away of tension. It was the sort of reaction I had every
    time I thought of him, which was normal for *me.* I didn’t like seeing it on another
    woman’s face.


    “I’m not sure what kind of time we’ll have,” I said, trying to keep the barbs
    out of my voice. I wasn’t jealous. No, seriously, I wasn’t.


    Not really.


    “I’m sure we’ll figure something out,” I said, trying to keep the barbs out of
    my voice. I wasn’t jealous. No, seriously, I wasn’t.


    Not really.


    “I’m sure we’ll figure something out,” I said, trying to keep the barbs out of
    my voice. I wasn’t jealous. No, seriously, I wasn’t.


    Not really.


    “I’m sure we’ll figure something out,” I said, trying to keep the barbs out of
    my voice. I wasn’t jealous. No, seriously, I wasn’t.


    Not really.

