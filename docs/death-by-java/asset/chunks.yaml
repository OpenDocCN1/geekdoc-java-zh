    here when I got here. Him and two customers. They left their cups on the tables
    …” I trailed off when McKensie’s expression darkened. “Lyle was going to cite
    Valerie for the broken ice machine, which was what Roman came here to fix.”


    “You saw Mr. Carrigan?”


