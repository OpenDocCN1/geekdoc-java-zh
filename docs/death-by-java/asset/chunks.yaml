    # 25


    The *clink* of forks on plates and the low murmur of voices filled the room. I
    sat across the table from Dad, with Laura to one side of me, Paul on the other.
    The place where we were eating was expensive and a vastly different experience
    from anywhere we’d been since Paul and I had arrived in Redwood Village.


    But that was okay. It was a nice change, considering what I’d been through.


    Marco Rossi was behind bars. The Italian Roll was closed. Death by Java and Tito’s
    Deli were still open, though I wasn’t sure how much longer the former would remain
    so. Last I’d heard, Valerie was still struggling to generate business and was
    considering selling to the highest bidder.


    It was kind of ironic to think that if Marco had just been patient, he could have
    purchased the place and been moved in by the end of next month, not that I would
    have seen it. Paul and I were due to return to Pine Hills tomorrow. I would miss
    Dad and Laura, but I was anxious to get back home. I longed to see Misfit. Rita.
    Death by Coffee. Jules and Lance and Vicki and everyone and everything else.


    Our impending flight seemed to be weighing on everyone around the table, Paul
    included. There wasn’t a lot of chatter, just light talk here and there as we
    ate. Every few minutes, Dad looked over at Laura, who smiled at him before glancing
    at me. Paul kept his eyes on his plate, seemingly preoccupied. I couldn’t help
    but wonder if he was sad about leaving or if he was still mad at me for chasing
    after a killer and very nearly getting myself shot. To say he was upset when I’d
    first told him was an understatement of gargantuan proportions.


    “This is nice,” I said, hoping to break the tension.


    “It is,” Dad agreed.


    Paul flashed a smile, went back to his food.


    “Didn’t you already talk to the detective?” Laura asked, her voice dropping to
    a near-whisper.


    “I did.” I noted her frown, sat up straighter. “Why?”


    She didn’t have to answer because a moment later, a shadow fell over me, and there
    she was, Detective Gabby McKensie, dressed in her usual attire, though she appeared
    somewhat rumpled around the edges, like she hadn’t been getting much sleep.


    “I’m sorry to interrupt,” she said.


    “No, no, please, pull up a seat.” Dad motioned toward an empty chair at a nearby
    table.


    “That’s all right. I’m not staying.” McKensie turned to me. “I was passing by
    and saw you through the window.” Was that a lie I detected in her voice? Hard
    to say, but we *were* close to the windows, so it was possible. “I thought you’d
    like to know that he confessed.”


    “Marco?” I asked, though who else could she be talking about?


    She nodded with a tight smile. “He didn’t try to deny anything. Considering I’d
    already heard most of it when your father called me, faint as it was, there wasn’t
    much *to* deny.” She looked to Dad. “Smart thinking, by the way.”


    “I have my moments.”


    She grunted, turned back to me. “It also helped that I had Ms. Pearson’s statement.
    When confronted with that, Mr. Rossi folded without much of a whimper.”


    It took me a moment to realize Ms. Pearson was Nadia.


    McKensie rubbed at the back of her neck with a frown. “This whole mess might have
    been avoided if people would just *talk*. Even after the murder, if just one of
    the people involved had come forward, we could have had Marco locked away days
    ago.” She sighed. “I spent days thinking that handyman—”


    “Roman,” I supplied.'
