    Which would have meant something if both Hugh and Aaron weren’t Valerie’s exes.
    They could be jealous of Mickey and simply wanted him gone.


    But his hand *was* bandaged.


    “The ice machine was dented,” I said. “Lyle’s body was found by the door, but
    that doesn’t mean that’s where the fight started.”


    “Are you saying you think there was a struggle?” Dad asked.


    “A struggle, or an argument that escalated to the point that someone punched the
    ice machine. What I can’t figure out is why Lyle was there at all.”


    “Do the police know when he was killed?” Dad asked. “If he showed up at around
    closing time that night, it’s possible it happened then, and not this morning.”


    “Maybe.” I frowned, stared off into the distance. “But I always saw him at Death
    by Java in the mornings. Early afternoon at the latest. He said he was going to
    come back to check on the ice machine, but why not wait until his normal time?
    And there’d be people around at closing. On the street. In the café. I mean, I’m
    pretty sure they close while it’s still light out. Hard to kill someone in broad
    daylight.”


    “So, you’re thinking he showed up just before opening, when it was still dark,
    and got into an argument with Mickey—”


    “Or whoever opened.”


    “—and what? They killed him because he still planned on citing them for the ice
    machine? That hardly seems worth killing over.”


    No, it didn’t. Not unless he was going to take it a step further. But what could
    a health inspector do besides cite them and possibly have the place shut down?


    A couple jogged by. One of the dog owners corralled their pooch and bid the other
    two *adieu*. The squirrels had left their perch at some point, leaving the half-wall
    empty of everything but a discarded acorn cap.


    “Valerie wouldn’t have killed him,” I said. “I don’t think she would have Mickey
    do it either.”


    “But if not him, who?”


    Who, indeed?


    I thought it over and came up with few ideas. Lyle was found inside Death by Java.
    He’d gotten in because someone with a key had let him in; I was sure of it. That
    meant the killer had to be Valerie, Mickey, or one of her employees, which consisted
    of a bunch of women in pink dresses and white bows. I knew women could be killers,
    just like men, but it was hard to imagine someone like Farrah murdering Lyle,
    even as small as he was, while she was wearing a pink dress.


    And there’d been no blood. Could one of the women have strangled him? Bludgeoned
    him to death? If so, with what? I needed to know the cause of death to even know
    what to think.


    “Someone had to have had a good reason to kill him,” Dad said, cutting into my
    thoughts. “I doubt it had to do with some minor health violation. He might have
    seen something he wasn’t supposed to see. Or perhaps he had enemies beyond Valerie.”


    A flash. “Marco.”


    Dad frowned. “Who?”


    “The owner of the Italian Roll—Marco Rossi. I saw Lyle with him yesterday. Marco
    said he and Lyle go way back, though when Lyle left, Marco looked unhappy.”


    “Like they’d fought?”


    “Or something Lyle had said upset him.” Now that I thought about it, it was entirely
    possible that Marco wasn’t upset with Lyle like I’d originally thought. “What
    if Lyle had told Marco about Mickey bullying him?”


    “Do you think he would have gone to Death by Java to confront this Mickey guy?
    And what? Lyle got caught in the crossfire somehow?”


    “If there was a fight, perhaps Lyle tried to step in and stop it. He gets knocked
    down, hits his head, and …” It wasn’t much of a theory, but it was at least something
    to go on. “Even if he didn’t do anything himself, perhaps Marco knows who might
    have.”


    Dad rose, brushed off the bottom of his pants. “Then I suppose we should go talk
    to him.”


    I stood, started to follow him, but paused. “Dad?”


    “Yeah, Buttercup?”


    “Did you tell Paul about the squirrel and the, you know, hole?”


    He smiled. “I suppose you’ll have to talk to him about it and see.” A wink, then
    he turned and started walking.


    *Great*. Shaking off the thought, I followed after him.


    A closed sign hung in the window of the Italian Roll, despite it being early afternoon.
    I cupped my hands on either side of my face and peered inside.


    “See anything?”


    “A light is on in the back,” I said, squinting into the gloom. The blinds on the
    windows were pulled closed, meaning it was rather dark inside. “I think. It’s
    hard to be sure with the sun’s reflection.”


    “Let me look.”


    I stepped back so Dad could have a peek. While he did, I checked the rest of the
    street. No other shops were closed along this stretch of road, so it wasn’t a
    water-main break or a power outage.


    “Someone’s back there,” Dad said. “I saw a shadow move. And there’s trash on the
    table, like someone’s eaten recently.”


    “Marco?”


    “Your guess is as good as mine.”


    “We should knock and see who answers.” If anyone. “If Marco was friends with Lyle
    and Lyle was killed …”


    “Then someone might be after Marco as well,” Dad finished for me.


    I stepped up beside Dad, and using the palm of my hand, I beat on the glass door
    as hard as I could.


    “Marco? Are you in there?” I squinted past the reflection, toward the mostly closed
    office door, where the light was coming from. I half-expected the light to snap
    off and a shadowy shape to dart for the back exit, but nothing happened. “Marco!”
    I pounded harder. “Come out. We only want to talk.”


    “People are looking,” Dad said, nudging me with his elbow. Out of the corner of
    my eye, I noticed that we were, indeed, drawing stares. After the excitement at
    Death by Java, it was no wonder.


    “At least we’ll have witnesses if something happens,” I said, knocking again.
    “Marco!”


    The door to the office finally opened, and Marco Rossi stepped out, alive and
    well, and looking rather an noyed.


    Hands on his hips, he regarded me from across the room for a long moment before
    sighing and walking across the empty restaurant. He unlocked the door and pushed
    it open just enough to say, “We’re closed,” through the crack, before he started
    to close it again.


    “We’re not here to eat,” I said before he could shut it altogether. “We want to
    talk.” A pause. “It’s about Lyle Carrigan.”


    Marco frowned at me through the crack. There was a brief flare of irritation,
    followed by a drop of the head. Another sigh, then he opened the door and stepped
    aside. “Come in. Did they find out who killed him?”'
