  raw: '“Or that he has it.” I leaned forward, pressing hard into the table, as if
    it was the only thing keeping me from popping to my feet and running out the door.
    “What if he killed Lyle and took his tablet? What if he still has it?”


    “Why would he take it?” Dad asked, before it seemed to dawn on him. “Lyle cited
    him for something.”


    “What if the citation was bad enough that it might close Tito’s Deli down?”


    “Tito wouldn’t like that.”


    “No, he wouldn’t. He could have seen Lyle outside Death by Java that night, saw
    that he had the tablet, and they could have fought over it. He might have killed
    him by accident, and then, uncertain what to do with the body, he dragged him
    into the back room of the bookstore café.”


    “How’d he get in?”


    I opened my mouth, then closed it again. How would he have gotten into Death by
    Java? I was pretty sure Valerie wouldn’t have given Tito a key, even for emergencies.


    *Mickey could have been there.* He saw the fight, decided to help Tito by hiding
    the body. But why in Val erie’s place of business and not somewhere else, like
    a trash bin somewhere down the alley?


    Then it hit me. If Mickey thought Valerie was cheating on him, he might have decided
    to frame her for murder as punishment. It might explain why he was so nervous
    that morning outside the bookstore café, why he didn’t want to be seen.


    “Even if he didn’t kill him, if there’s a chance Tito has the tablet, he might
    realize that having it makes him look guilty.” Dad gave me a pointed look.


    “He might destroy it.”


    Dad nodded. “If we’re right, and Lyle was citing him for some major violation,
    he might think the police could claim it as motive. That’s not even mentioning
    how his possession of the tablet would automatically put him at the top of the
    police’s suspect list.”


    “I should call Detective McKensie,” I said, glancing at my phone. “But what if
    I’m wrong and he doesn’t have it?”


    Dad thought about it a long moment before shrugging. “There’s not much you can
    do about that. And, to be honest, I’m not sure there’s much the police can do
    either.”


    “What do you mean?”


    “You can tell them that you think Tito has the tablet,” he said. “They’ll ask
    why you think that. You’ll say he was acting weird. They’ll ask for proof, and
    you have none.”


    “Which doesn’t give them probable cause,” I said.


    He nodded. “The detective can go to Tito, ask him about it, but you and I both
    know he’ll likely deny everything. And while I’m not expert, I’m pretty sure that
    without anything tying Tito to the tablet or to Lyle, the police can’t go barging
    in on him at his house, and they certainly can’t search the place.”


    “Their hands are tied.”


    “Exactly.” It might have been my imagination, but I could feel the *“But yours
    aren’t.”*


    “Tito’s probably just now leaving the deli,” I muttered, glancing at the clock.


    Dad stood. “I’m going to go check in on Laura and Paul. She has him trapped in
    my office, going over who knows what.” He chuckled. “I expect they’ll be at it
    for a little while longer. And I could always throw in my two cents, keep them
    occupied for, oh, let’s say an extra twenty minutes.”


    I stood and pocketed my phone. “Could you make it thirty?”


    “We’ll see. Just … don’t put yourself at risk, Buttercup.” He started out of the
    room, then paused. “The keys are in the dish on the counter.” And then he was
    gone.


    Shooting Dad a silent thanks, I snatched the keys out of the dish, then slipped
    out the door. I wasn’t quite sure what I was planning on doing, but I knew it
    would involve checking out that fancy house of Tito’s, which, if nothing else,
    was a place to start.


    Nerves had me sitting bolt upright as I drove the short distance to Tito’s. The
    house sat at the end of a long, winding road that led to a small neighborhood
    of houses occupied by the semi-wealthy. Homes of well-to-do business owners were
    situated next to those of pharmacists and club owners. The yards were of a decent
    size and the houses were large, but not so big that they required paid help to
    keep them maintained.


    Tito’s house was lit up from the inside, and his car was parked in the driveway,
    just past a pair of full trash cans sitting near the curb. I drove back down the
    street a little ways and parked near a darkened house that appeared unoccupied,
    though no for sale sign sat out front. I could see Tito’s home in the rearview
    mirror, but I couldn’t make anything out through the parted curtains covering
    the large front window.


    I shut off the engine and sat there for a long moment, listening to it *tick*.
    I had a couple of options, all of which were risky. I could walk up to the door
    and knock. If Tito answered, I could ask him point-blank if he’d taken Lyle’s
    tablet.


    Downside? If he had, that meant he’d likely killed the health inspector, or at
    least, had a hand in it. If he’d murdered Lyle, then what would stop him from
    doing the same thing to me?


    No, nix that idea.


    I could go to him under the guise of me being apologetic for my earlier questions
    at Tito’s Deli. I could tell him I didn’t mean to upset him, that I had a tendency
    to be overly nosy at times. It was a semi-valid excuse.


    The obvious problem with that idea was that it was unlikely that Tito would carry
    the tablet to the door if he had it. Nor did I believe he’d leave it sitting out
    where anyone could see it. I’d need him to invite me in, and to leave me unattended
    in the room where he’d hidden it. The chances of that were less than slim. Tito
    would be more likely to be annoyed that I’d come all the way out to his home and
    disturbed him in the middle of the night, when I could have waited until tomorrow
    and just showed up at his deli.


    That left option number three, which was probably the best—and safest—of the bunch.


    Stealth.


    I climbed out of Dad’s car and eased the door closed with a soft *click*. A large
    tree stood in the front yard of the Adornetto home, near the large window. I figured
    it would serve as the perfect place to hide so I could have a peek inside. I knew
    the chances were small that I’d find Tito sitting there with Lyle’s rubberized
    tablet in hand, but it wasn’t impossible either.


    I walked briskly toward the tree, hands shoved in my pockets, trying my hardest
    to look like I belonged. No one else was outside, but that didn’t mean someone
    wouldn’t glance out their window and spot me. I knew from my earlier research
    into Tito that he was recently divorced and that his son was an adult, meaning
    he’d likely be alone.


    Tito’s car engine was ticking as I passed it by, telling me he must have gotten
    home minutes before I’d arrived, which was a good sign. If he *did* have Lyle’s
    tablet and planned on getting rid of it, now would be the time. I stepped up behind
    the tree, glanced down the street to the other houses to make sure no one had
    noticed me, then looked toward Tito’s house and through the parted curtains.


    The first thing I noticed was the cat tree in front of the window. The curtains
    weren’t parted because Tito wanted them that way, but because the feline of the
    house must have been sitting there and had nudged them aside. They’d caught on
    the sides of the tree so the kitty could look out and survey his or her territory.
    It didn’t leave much in the way of an opening, but it was enough to see that the
    living room beyond was empty of life. A large, plush couch was flanked on either
    side by matching recliners. A long coffee table sat in front of the couch, and
    a steaming mug sat on a coaster there.


    “Come on, Tito,” I quietly whispered. The mug meant that he planned on returning
    to the room. I just hoped it would be soon because I felt very exposed standing
    there, behind the tree. Tito might not be able to see me from his window, but
    pretty much everyone else in the neighborhood could. And if a car drove by, there’d
    be nowhere for me to hide.'
