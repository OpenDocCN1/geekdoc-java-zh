    the next. Mickey and Valerie. Tito and Marco. Roman. Even Aaron and Hugh felt
    like viable suspects under the right circumstances.


    But, at the same time, I could come up with just as many reasons why none of them
    would have done it. Mickey and Valerie wouldn’t want to leave a body in their
    place of business. Marco’s plan was actually ruined by Lyle’s death, so why kill
    him? Aaron and Hugh wouldn’t want to risk Valerie taking the fall for the murder.


    *But what about Tito and Roman?*


    Now, those two … I couldn’t come up with a good, solid reason for them not to
    have committed the murder, outside moral and legal reasons. The only problem was,
    I couldn’t see how either of them could have killed him and left him inside Death
    by Java.


    Back to square one we went.


    “I suppose it’s possible the door *had* been left unlocked,” I said.


    “What door?” Laura asked, entering the room. She was holding a glass of lemonade.
    Ice *clink*ed as she swirled it before taking a sip.


    Dad and I shared a look, but we were saved from having to admit we were talking
    about Lyle’s murder when Paul entered the room, hair still damp from the shower.


    “All done,” he said. “Shower’s all yours, Krissy.”


    “Thanks.” I popped to my feet, ignoring the burning in my arches and calves. I
    hurried past Laura to the bathroom, where I took a long, hot shower and tried
    not to think about murder.


    I only partially succeeded.


    After the shower, I got dressed and pushed the dire thoughts out of mind. I had
    other things to worry about, the least of which was dinner with friends I hadn’t
    seen, let alone talked to, in years. Would I even recognize them when I saw them?
    Would they recognize *me*?


    And worst of all, would we have anything in common after all this time?


    I found myself standing in my old bedroom, an odd melancholy washing over me.
    I missed both Larissa and Renee now that I was thinking about them. Over the last
    few years, I hated to admit that I’d barely thought of them at all. We’d grown
    apart in both years and distance. All I had were memories—good ones—but memories,
    nonetheless.


    It was strange how it hit me all at once. I’d been back to Redwood Village countless
    times over the last few years. There was no reason for me not to have looked up
    my old friends before now, but I hadn’t. Did that make me a horrible friend? Or
    just really bad at keeping in touch?


    *Stop beating yourself up over this*, I scolded myself. People grew apart. It
    was just a part of life.


    Taking a deep, calming breath, I returned to the living room to find everyone
    else sitting around the TV. A movie was playing at low volume, but no one was
    watching it. It served as background noise, something Dad had done ever since
    Mom had passed as a way to keep the loneliness at bay.


    “Have fun tonight, Buttercup,” Dad said. “Tell Larissa and Renee I said hi.”


    “Will do.” I turned to Paul. “You going to be okay here alone with these two?”


    He stifled a yawn. “I’ll be fine. I doubt I’ll make it much longer anyway.”


    “We’ll keep him busy,” Laura promised. “Don’t worry about us.”


    “Take my car,” Dad said. “And try to be back by midnight. I don’t want to have
    to wait up all night, worrying about you.”


    I rolled my eyes, but smiled. Talk about a blast from the past. “Okay, *Daddy*,”
    I said, which caused him to laugh. “I’ll call if I’m going to be late.” And with
    a final wave, I headed into the kitchen, where I snatched up Dad’s keys, and then
    I was on my way to Redwood Tavern to reconnect with my past.


    The restaurant sat in a well-to-do part of town and was one of those places you
    went to if you wanted to spend twice as much for a meal than what you’d pay anywhere
    else. Redwood Tavern’s brown wooden exterior gave it a rustic look from the outside.
    Once through the doors, filtered lights gave a warm, almost fire-like glow to
    the place. There was no music playing, just the rumble of low conversation, the
    *clink* of silverware on plates, and the occasional bark of laughter that felt
    weirdly out of place.'
