    “He didn’t know what to do,” he said with a laugh. “I was afraid that he might
    arrest me right then and there. Good thing he didn’t, because I had no reasonable
    excuse for why I had the rubber duck in my possession.”


    “Ready?” I asked, not wanting to know what he was referring to.


    “Ready,” Paul said, still chuckling from the story.


    “You two have fun.” Dad handed Paul the keys to his car. “Don’t do anything I
    wouldn’t do.”


    “That’s not really saying much,” Laura said. “Especially after *that* story.”


    Everyone but me laughed. No, I *really* didn’t want to know what he’d just told
    them.


    Paul and I were soon on the way, with him driving and me staring out the passenger’s-side
    window, a nervous churning in my gut. I’d never so much as considered going to
    a class reunion before, and while this one was unofficial, people I’d once known
    *would* be there.


    Sure, seeing some old friends might be fun. But I wasn’t even sure any of them
    would show up. This could very well just a gathering of Valerie and her friends
    with Paul and me shoehorned in. That would be like a nightmare made manifest.


    *Think about Lyle*, I reminded myself as Paul pulled into the lot at Hooties.
    The car’s screen dimmed as he shut off the engine, leaving us to sit in the glow
    cast by the obnoxious red and blue hooties sign above the door. A handful of other
    cars sat in the lot, maybe ten, which didn’t bode well for it being a packed house
    of fifty-plus former classmates like Bray had predicted.


    “What should I expect in there?” Paul asked, eyeing the front door and windows,
    which were tinted to near-black. Nothing could be seen through them. Not even
    the faintest hint of light or a shape that would tell us what awaited us past
    those dark barriers.


    “Nothing too crazy,” I said. “I’ve only ever been inside once, but it was years
    ago. Back then, it was all arcade games and greasy food. It was once considered
    the hip place to hang out for all the cool people in school. It might have changed
    since then, but I somehow doubt it.”


    “It’s not …” He shook his head. “Never mind.”


    I turned in my seat to face him. “No, tell me. What were you thinking?”


    An awkward smile found his face. “I’ve seen places that look like this before
    from the outside. And with the name, I just assumed the tint was because anyone
    inside wouldn’t want passersby to see what they were doing.”


    “Oh.” I made a face. “Do you really think I’d take you to a place like that?”


    He grinned. “That depends on what you wanted to get out of me afterward.”


    I smacked him on the arm before we both climbed out of the car. The light banter
    had done wonders for my nerves, which was probably the point. I took Paul’s arm,
    steeled the last of my nerves, and together we entered Hooties.


    ### It was like walking into the past.


    Nothing had changed in the years since I’d last been there. The space was lit
    up by dozens of arcade machines, each vying for attention with various *clang*s,
    *ping*s, and *crash*es. Pop-rock music played over speakers spread out around
    the room. It tried to overpower the noise of the machines, but all it really did
    was add to the din. Directly across from us was a bar that was relegated to serving
    Cokes and Sprites since it was frequented by teens, rather than adults.


    And there, standing off together in small, clique-like groups, were the attendees
    of Bray’s impromptu class reunion—all twelve of them.


    Bray, Tamara, and Bebe were together, of course. No Valerie. No Mickey. A group
    of men I didn’t recognize in the dizzying lights cast by the machines stood nearby.
    I assumed they were classmates, but if they were, I couldn’t recall their names.
    At the other end of the bar was a group of five women, three of which I recognized
    as former classmates. The other two were entirely unfamiliar, and I wondered if
    they were the wives of some of the men.


    “You ready for this?” Paul asked.


    “Are you?”


    Before either of us could answer, Bray noticed us. His entire face lit up, and
    he waved his hands into the air, as if I couldn’t see him in the mostly empty
    room. “Krissy! Over here!” He turned to the others. “Hey, guys! It’s Krissy Hancock.
    She made it!”


    All eyes turned our way as Paul and I crossed the room to where everyone else
    was waiting. I became suddenly self-conscious about the Band-Aids on my arms,
    and I wished I could have found some other way to cover the cat scratches that
    wasn’t so obvious. They almost glowed in the lights of the arcade machines.


    “Bray,” I said as we joined them. “You remember Paul Dalton?” I wasn’t even sure
    I’d officially introduced Paul when we’d met at Death by Java the other day, but
    Bray acted as if they were old friends, choosing to clasp Paul on the arm with
    a wide, goofy grin on his face.


    “Sure, sure,” he said. “I remember. Gene. Guys.” He waved the group of men over.
    “You remember Krissy, right?”


    “Of course.” As one of the men stepped over, his name clicked in my head. Gene
    Rickart. He was, indeed, in my class, but I’d never interacted with him, not even
    to say “hi” in passing. He reached out and shook my hand, then Paul’s, as Bray
    introduced him. “You’re the one who got Mr. Ogletree fired.”


    “Well, I—”


    “Nah, he did that to himself,” Bray said, cutting in before turning to Paul. “Krissy
    here discovered the janitor at the school was smoking in the basement, and she
    turned him in to the principal. Guy tried to deny it, but the evidence was pretty
    solid, so out he went.”


    “She just about got Mrs. Clayborn fired too.” I didn’t recognize the guy who spoke,
    though I assumed he was one of Gene’s friends.


    Gene snorted. “She should have been. Used to hound me about reading. What could
    a book ever tell me that I don’t already know?”


    “She *was* a librarian.” This from another guy whose name escaped me, though his
    features were more familiar than Gene’s other friend. “Actually, I think she still
    is the school librarian, if you can believe it.”


    “She was old when we were in school,” Bray said with a laugh. “Has to be ancient
    now.”


    Behind him, both Tamara and Bebe, seemingly bored with the topic of conversation,
    took a step back and put their heads together. My jaded mind assumed they were
    gossiping about me and how poorly I’d aged since those teenage years.


    Some things never changed.


    “Is Valerie coming?” I asked, looking around. I was ready to talk to her and get
    out of there. “I expected her to be here already.”


    “Nah,” Bray said. “She had to cancel. It’s cool that you’ve been hanging out with
    her recently, though. Almost like old times.” He laughed and appeared as if he
    might try to put an arm around my shoulder, but one look at Paul changed his mind.
    “You want something to drink? I’ve got control of the bar, so you can have whatever.
    It’s nothing crazy, though I brought a few bottles of stronger stuff from home.
    It’s all on the house, of course.”


    “A Coke is fine,” I said.


    Paul nodded. “Same here.”


    “Cool. Coming right up.” Bray rounded the bar to grab our drinks, leaving Paul
    and me standing with Gene and his buds. We eyed each other, but no one spoke.
    The discomfort was palpable.


    I glanced down the bar, toward the group of women, but they appeared to have no
    interest in talking to me. I decided that once the Cokes were gone, Paul and I
    would make our excuses and leave.


    A part of me would feel guilty for abandoning Bray. He seemed to be genuinely
    trying to be friends. But he was the only one, and I wasn’t about to stand around,
    feeling uncomfortable, just for Bray’s sake.


    “You okay?” Paul asked, keeping his voice low so only I could hear.


    “Yeah. A little disappointed, I guess.”


    “If you want to go—”


    The door opened, and to my surprise, Mickey Robbins entered. He was dressed as
    if he was out on a date, and he was even carrying a bouquet of flowers. He stopped
    just inside the door, took in the small groups, and the otherwise-empty arcade
    area, then turned and walked right back out.

