    “But Lyle was dead.”


    “No.” He shot me a scowl. “I mean, yes, he was, but I didn’t know that then. At
    that point, all I was thinking about was all the false claims Lyle was making
    against my place of business. I wanted to have a look at what was on the device
    and see if he was fabricating any others.”


    “Was he?”


    “I don’t know. I couldn’t get in because it was password protected. Then I find
    out the man is dead, and I’m standing there with his property in my possession.
    I didn’t know what to do. If I took it to the police, they would have thought
    I killed him.”


    “You could have told them where you found it,” I pointed out.


    “That wouldn’t have proven anything. They’d still take a closer look at me, and
    where would the scrutiny get me? I was already dealing with fallout from Lyle’s
    claims. I even had to fire someone because of them, though I suppose that was
    for the best.”


    “Wait. You fired someone? Why didn’t you tell me that before?”


    Tito sighed, some of the fight going out of him. “Why would I? It’s none of your
    business.”


    True. “But you did fire someone?”


    “I had to. I realized that every time this person—and no, I’m not going to name
    him—worked the closing shift, Lyle would be in the next morning and would find
    something left out in the open or a freezer would be set to the incorrect temperature.
    It only happened when the person in question worked, so I did what any other business
    owner would do and had a talk with him. When that didn’t change anything, I fired
    him. The violations stopped almost immediately.”


    My mind was racing. “He was sabotaging the deli.”


    “Or he was extraordinarily inept,” Tito said. “Either way, once he was gone, things
    calmed down, though Lyle kept coming back. I’d had enough of him, so I kicked
    him out whenever I saw him.” He leaned his head back, looked up to the sky. “I
    didn’t have anything to do with his death, but I can’t say it upset me. He was
    making my life miserable. And even after his death, he haunted me. That tablet.”
    He spat on the ground. “If I hadn’t found it, then perhaps the police would have,
    and then they’d have already discovered who killed him. And then we could have
    all moved on with our lives without Lyle Carrigan.”


    “Why didn’t you give the tablet to the police anonymously?” I asked.


    “And how would you propose I do that? Mail it to them? Sneak up on one of them
    and slip it into their car?” He scoffed. “There was no way to get it to them without
    someone finding out that I was the one who’d had it.”


    “So, instead of looking for a solution, you just threw it away?” I tried not to
    sound incredulous, but I couldn’t help it. “It’s evidence in a crime!”


    “I know that,” he snarled. “I didn’t know what to do. I was weighing my options
    when you showed up and started asking questions. I realized that it was either
    get rid of the tablet, or have the police come breathing down my neck. It was
    stupid, I realize, but what else was I going to do? If I became a suspect in a
    murder, what you do think it would do to my business? I’m short-handed already.
    People would quit. Customers would stop coming in. I would be ruined just as readily
    as if I’d let Lyle keep hounding me.”


    All of it was true. As much as I might not like what Tito had done, it made sense.
    No one wanted the police sniffing around them, even if they had nothing to hide.


    “Look, lady,” Tito said, putting as much disdain into his voice as he could. “I
    never asked for any of this. I tried to protect myself, and instead, I screwed
    everything up. I saw you that night—knew even then that it was probably you—digging
    around in my trash. And when I realized the tablet was taken, I knew I was cooked.”


    “You’re not under arrest,” I pointed out.


    “I’m not, no. The detective was surprisingly understanding. I don’t know if she
    ever got into the damn thing, but I wouldn’t be surprised if there’s some sort
    of evidence of malfeasance on Lyle Carrigan’s part somewhere on it. Will it point
    to his killer?” He shrugged. “I have no idea. But I’m counting on it proving that
    my deli wasn’t as bad as that man tried to make it seem. I only hope that information
    becomes public. It’s the least they could do.”


    I searched his face for deception, but I couldn’t find any. “The screen,” I said.
    “It was cracked. Was it like that when you found it?”


    Tito rubbed at the back of his head and looked away. “I might have done that once
    I realized I couldn’t bypass the password. Had one of those—what do you call them?—psychotic
    episodes, where I thought that maybe if I physically battered the thing, it would
    suddenly let me in. It was dumb, but I was at my wits’ end.” He sighed. “I’ve
    got to get back inside. I just wanted to let you know that I know it was you snooping
    around my place that night, and that I’d appreciate it if you stay far, far away
    from me and my place of business.” A pause. “*And* my home.”


    With that, he turned and entered Tito’s Deli through the back door, leaving me
    alone in the alley.'
