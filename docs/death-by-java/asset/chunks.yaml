    “Valerie, of course,” I said. “Two of her employees, Nadia and Farrah. I don’t
    know their last names.”


    Detective McKensie nodded, as if I’d merely confirmed what she already knew.


    “A repairman showed up while I was working out here. His name’s Roman.” My eyes
    widened. “Was he the one who died?”


    “Please stop speculating,” Detective McKensie said. “Is that the full list of
    people? Customers? Other employees?”


