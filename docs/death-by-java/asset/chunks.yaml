    “Get it,” I said. “If we can get him into it, we can take him to the vet. I’ll
    pay for everything.”


    Dee rose, eyes widening. “Really? Are you sure?” She glanced down at Oscar, who
    was still chowing down. “You don’t have to do this. I appreciate it, but I—”


    “I’m sure,” I said, cutting her off. “I’ll keep an eye on him while you grab the
    carrier.”


    Dee grinned. “Okay. Yeah. I’ll be right back.”


    Moving quickly, but carefully, so as not to startle the cat, Dee hurried back
    around `Death by Java`, toward where I assumed she’d parked her car.


    As I watched Oscar eat, I wondered who had let him out the night of Lyle’s death.
    Valerie hadn’t, nor had Dee. Could one of the other employees have done it? I
    found it unlikely, considering none of them appeared to have anything to do with
    the cat.


    But if not them, then who?


    “Do you know who killed Lyle?” I asked, keeping my voice low so no one else would
    hear.


    Oscar didn’t so much as glance up at me. Even if he `could` talk, I wasn’t so
    sure he’d tell me.


    # 12


    I grimaced as I applied the last Band-Aid to my forearm, just below the crook
    in my elbow. To say Oscar hadn’t been happy about being shoved into a cat carrier
    and hauled to the vet would be an understatement. The cat became all claws and
    teeth and made sounds I’d never heard come from any animal, let alone a cat. But
    between Dee and me, we got him into the carrier with what I’d consider minimal
    damage to our persons.


    A quick drive to a vet that was open during the weekend, a bit of coaxing to get
    them to take a stray without an appointment, and then a decision to let them keep
    Oscar for a few days so they could make sure he was in tip-top shape, made for
    a long couple of hours. After that, Dee dropped me off at Dad’s. Valerie hadn’t
    been about to miss her chance to relax on the beach, and so she’d left long before
    we’d even finished corralling Oscar.


    I used one of Dad’s hand towels to dab at my still-damp arm. Peroxide was followed
    by Neosporin, just in case Oscar’s claws were dirtier than they’d appeared. None
    of the scratches were too deep, but I wasn’t going to take any chances, not with
    how my luck had been going as of late.


    Once that was done, I went out into the living room, threw myself down onto the
    couch, and watched TV while I pouted about missing out on beach day. Dad had sent
    me periodic updates throughout the day, exclaiming about how nice it was, and
    how he’d keep an eye on Paul for me because, as he put it, the “eye candy” was
    rather “spectacular.” That was followed by a picture of a bunch of college-age
    men and women playing volleyball in tiny swimsuits that made Valerie’s own look
    like a poncho.


    Time passed. I’m not sure how much. I barely noticed what was playing on the television.
    I kept thinking about Valerie and Mickey and how they were at the center of Lyle’s
    murder. I was having trouble seeing how they `couldn’t` be involved. It had happened
    in their store. They were both being evasive—with Mickey having dropped completely
    off the map. They might as well have painted guilty across their foreheads and
    called it a day.


    As much as I hated to admit it, I found myself looking forward to the upcoming
    reunion. Valerie’s friends would be there, as would people who knew most of the
    individuals involved with the crime. And since I expected Valerie herself to make
    an appearance, freshly bronzed from the beach, it would give me yet another opportunity
    to coax something useful out of her.


    It wasn’t quite evening when Paul, Dad, and Laura laughed their way through the
    front door. Dad’s nose was pink, while Laura looked the same as she had when she’d
    left. Paul, on the other hand, glowed as if he’d become radioactive.


    “Forget your sunscreen?” I asked with a wide smile.


    “I bathed in the stuff.” He stuck a finger into his ear and wiggled it around.
    “And I have sand everywhere.”


    “I have a theory that sand is sentient and mobile,” Dad said. “It will find a
    way into every crevice, every device, into every single pore of your body, no
    matter how hard you try to keep it out.”


    “Wait until you take a shower,” Laura added. “You’ll be standing in a sand dune
    by the time you’re done, with no idea where it all came from.”


    “I think I’m going to go do that now.” Paul started down the hall, but he paused
    when he got a good look at me. “What happened to you?”


    “I had a wrestling match with a cat,” I said, holding up my Band Aid–adorned arms
    and hands.


    “There’s a cat here?” Dad asked, looking around as if one might come darting out
    from under the table.


    “No, but I caught the one that was at `Death by Java` and got it to the vet. Long
    story.”


    “Let me get that shower, and then you can tell me all about it,” Paul said, running
    a hand through his hair. Sand cascaded down onto his shoulders like he had a bad
    case of dandruff. “Do you still want to go to that reunion tonight? I’m game,
    but if you aren’t, we can stay in.”


    “I do,” I said, brushing the sand from his shoulder. “Now, go shower.”


    Dad here finished his story and poured herself a glass of water. Laura here downed
    half.


    Paul returned from his shower a short time later, looking much better than he
    had arrived. The red glow had dimmed to a more natural shade of pink. He was wearing
    a nice outfit, but nothing too extravagant since this was merely a class reunion.

