    # 6


    “Are you okay, Buttercup?”


    I frowned down into my coffee, irrationally wishing I had the spiced chai tea
    I’d recently grown accustomed to drinking. The bubbles created by the chocolate-chip
    cookie I’d placed into my chipped coffee mug before pouring were long gone, and
    a few soggy crumbs had floated to the top. The chip in the mug, Dad claimed, was
    symbolic. He said it reflected how in life, even something damaged could still
    be of use. In reality, he’d always been careless with the dishes and the low-hanging
    faucet.


    “I don’t know,” I admitted, nudging the mug aside. “I feel like I should be doing
    something.”


    Three of us were seated around Dad’s table. Dad and me, of course, and Laura,
    who’d sensed something was wrong the moment we were through the door. Paul was
    still at Death by Java after Detective McKensie had requested he hang around.
    He’d claimed she’d requested his presence because he might have a few insights
    into the crime, though what she expected out of him, I had no idea. It wasn’t
    like he knew Valerie or Lyle or anyone involved in the death, beyond his involvement
    with me.


    But he wanted to help. I couldn’t fault him for that.


    “It’s not your responsibility to do anything,” Laura said. “I know you want what’s
    best for your high school friend—”


    “She’s not my friend.” I scowled. “I mean, she wasn’t when we went to school together.
    Now …” I shrugged. I was helping Valerie Kemp, sure, but I didn’t think I actually
    *liked* her. Yet I did know her, and she was in trouble, which made me want to
    defend her. Did it make sense? Not really. But that was me in a nutshell.


    “Either way, you’re not in Pine Hills,” Laura went on. “The police here might
    not like you snooping around, even with Paul helping them. In fact, they might
    be harsher on you because you’re from out of town.”


    With my elbows propped onto the table, I folded my hands and leaned my head against
    them, eyes closed. “I know. It’s just …” I floundered for an argument, though,
    against what? I had no clue.


    “I understand your predicament,” Dad said. “It’s the same thing I go through when
    I write. I want to get my hero or heroine involved in the crime, yet how do I
    do it and make it believable? If they just show up and start poking their nose
    into everyone’s business, the reader will wonder why the police aren’t stopping
    them.”


    I cracked open an eye to peer at him. “*I* just show up and start poking my nose
    into everyone’s business. It’s kind of what I do.”


    He grinned. “Don’t I know it. When anyone comments about my characters doing something
    similar, I just talk about you, and that usually shuts them up.”


    I snorted as I sat back. “I get that I can’t go running around, interrogating
    suspects. While I might have known most of these people when I was a kid, I know
    almost nothing about them now. But I’m not sure I can sit here and do *nothing.*
    Even if all I do is help Valerie put things to rights around her café, then I’d
    at least feel as if I was making a difference.”


    “Then do that,” Dad said, earning him a sharp look from Laura. “What? Why not?
    You know as well as I do that Krissy takes after me and can be obsessive. If going
    to Death by Java and trying to figure out how to help Valerie increase business
    gets her mind off the murder, then I’m all for it.”


    “You just want to be able to investigate,” Laura said. “Turn her into your inside
    man.”


    Dad grinned. “Maybe.”'
