    car, or perhaps at home, but what if the killer had taken it?


    “He was carrying it every time I saw him,” I said, thinking it through. “He used
    it for work, so I don’t know whether he ever carried it with him for personal
    use.”


    “When did you last see it?”


    I thought back. “I suppose it was the last time I saw him.”


    McKensie’s expression turned annoyed. “Which was …?”


    “At the Italian Roll,” I said, though uncertainty marred the words. “I’m pretty
    sure that was the last time I saw him.”


    “‘Pretty sure’?”


    “Almost positive,” I amended. “He was leaving just as I arrived. He had his tablet
    with him then.” I waited a beat, then said, “Valerie told me he didn’t have his
    tablet when she found his body. I take it you didn’t find it in his home?”


    I might as well have asked a brick wall. “If you recall any other instance when
    you might have seen Mr. Carrigan, please let me know.” She looked at her watch
    and scowled. “I’d like to discuss Mr. Robbins with you, but I have somewhere else
    I need to be.”


    “I’m not sure I can tell you much more than what Valerie has already told you
    about Mickey,” I said. “Like I mentioned before, I barely know him.”


    “Be that as it may, I’d like to have a little chat. I’ll contact Paul, set up
    a meet.” A change came over her face when she said Paul’s name. A lightening around
    the eyes, the bleeding away of tension. It was the sort of reaction I had every
    time I thought of him, which was normal for *me.* I didn’t like seeing it on another
    woman’s face.


    “I’m not sure what kind of time we’ll have,” I said, trying to keep the barbs
    out of my voice. I wasn’t jealous. No, seriously, I wasn’t.


    Not really.


    “I’m sure we’ll figure something out.” Another look at her watch. “I’ll be in
    touch.”


    I wanted to argue, but what good would it do? I’d managed to pull myself—and,
    much to my dismay, Paul—into the murder investigation, all because I couldn’t
    just walk away. If I hadn’t insisted on going to Death by Java, if I hadn’t taken
    Valerie’s call, I’d be sitting on a beach right now, enjoying the sun with my
    family and the one man I wanted to spend the rest of my life with.


    Instead, it appeared as if we’d be spending a chunk of our time with Detective
    McKensie, a woman who was clearly smitten with my boyfriend.


    I watched as she speed-walked her way to her car. She paused at the door, taking
    one last speculative look at the cars in the driveway, at the house where Valerie
    was currently being comforted by a pair of men who were still seeking her love
    and acceptance, despite the breaking off of their relationships. Then McKensie
    climbed into her vehicle and drove off, leaving me to stand alone in Valerie’s
    driveway, wishing I was anywhere but.


    The good news was, now that she was gone, I *could* be somewhere else.


    Putting Detective McKensie out of my mind, I headed inside to find Valerie. She
    wouldn’t like it, but I was going to make her pay me back for our chat by having
    her drive me to the beach. It was the least she could do.


    And yeah, a part of me was annoyed. Mostly at myself, but also at Valerie. If
    she could just choose one man, could look beyond her own personal wants and needs,
    then perhaps none of this would have happened. It was a jaded thought, but this
    was supposed to be my vacation. I wasn’t supposed to be there at the house of
    my high school nemesis, talking about a murdered man with a detective and someone
    I didn’t really even like.


    Valerie was in the living room with both Hugh and Aaron. I half-expected them
    to be locked in some weird, three-person embrace, but they were all seated around
    the room, with no one touching. There were somber expressions all around, which
    caused me to feel guilty for my recent unkind thoughts.


    “Detective McKensie’s gone,” I said. “I’m sorry to ask, Valerie, but I was headed
    to the beach with my family when you called. Do you think you could—”


    Valerie surprised me by speaking up before I’d finished. “Yeah, sure. I’ll take
    you. You came here when you didn’t have to. I owe you for that at least.” She
    stood. “Give me a few minutes to get ready.” She started to leave the room, then
    paused. “You know, a trip to the beach sounds good right about now. I could use
    the break from all of this.” She waved a hand vaguely around the room.


    “I could go with you,” Hugh said from the rocking chair. “If you want company,
    that is.”


    Aaron rose to his feet. “Me too. I don’t have anywhere else I need to be, and
    I have swim trunks in the car.”


    They looked like abandoned puppies, desperate for attention.


    Valerie smiled at them both. “I think I want to do this one alone, guys. I’ll
    call you later.” I noted that her eyes lingered on Aaron when she said the last.


    Neither man moved, as if they hoped she’d change her mind.'
