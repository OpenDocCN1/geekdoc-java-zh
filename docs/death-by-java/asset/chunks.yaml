  trans: '

    “Krissy？”她一边推开门一边问道。她的头发扎成一个凌乱的丸子，脸上满汗水和泥土。她甚至穿了一件简单的白色 T 恤和牛仔裤。这`very`不像瓦莱莉的风格。“你在这里干什么？”


    “嗨，瓦莱莉。我想来看看你。”当我走进门口时，瓦莱莉移动了身体给我让路。“我听你说周一就能获准重新营业了。”


    “我们可以营业了，”她说，倒在椅子上。“这也是我现在来这里。我在想，开始处理你给我的那个清单可能是个好主意，看看是否会有什么变化。我有些怀疑，但目前我没什么别的事可以做了。”


    我环顾了一下空空的书店咖啡馆。“这里没别人了吗？”


    她把手套扔在桌上，叹了口气。“只有我。阿伦和休格很忙，否则我该叫他们来了。还有我的女孩们……”她耸了耸肩。


    “你收到米基的消息了吗？”我问。


    瓦莱莉的肩膀微微紧了一下，这是她表现出的唯一反应。“没有，我没有。”


    “我昨晚见到他了，”我说，观察她的脸看是否有反应。没有任何反应。“他出现在聚会上了。他带了花。”


    她快速地眨了几下眼睛。“他带了？”


    “当他意识到你不在时，把花给了我，”我说。“他看起来很不心心。”


    瓦莱莉咬着下唇，不看我。“那么……他说了什么？”


    “不多，”我承认道。“他是为了你来的，既然你不在，他立刻就走了。我留住了他，我们聊了几分钟。他说你们最近没说过过。”我停顿了一下，补充道，“而且你一直在避开他的电话。”


    瓦莱莉双腿交叉，脚尖不安地动着，显然很焦虑，但她一句话也没说。


    “你听起来倒像是他在躲着你，”我逼道。“瓦莱莉，到底是怎么了？”当她仍然没有回答时，我继续说道：“如果你和米基之间发生了什么事，不仅仅是你担心他可能卷入了莱尔的死亡那么简单，你需要告诉某人。你越试图隐瞒，看起来就越像有鬼。`尤其是在我对麦肯西探员说完那些话之后`，”我没有补充这句话。


    瓦莱莉叹了口气，肩膀垮了。“米基和我之间什么事也没有。我们只是处于一段低谷期。这种事会发生的。”


    “你曾担心他可能杀了莱尔，”我指出。“这可不仅仅是低谷期。”


    “他没干那。”


    这让我很意外。“我以为你没跟他说话。”


    “我没说过过。”她又叹了口气，这次带着不耐。“但我又想了想，意识到米基没有可能这么做。我只是太闹心了，草率下结论。我可能见过他并假装没见过一次。仅此而已。”


    “但是——”


    瓦莱莉突然起身，朝后屋走去。她走到一半时停下脚步，回头看我。“来吗？”


    我不确定发生了什么，跟着她进了后屋，那里看起来和我上次看到它时几乎一样。制冰机门上还有那个凹痕，但那是唯一看起来不对劲的地方。


    “看到了吗？”她问道，张开手臂指向整个空间。


    我犹豫了一下，然后说：“没有？”


    “没错，”她说，尽管我不知道她指什么。“米基不会在这里杀死莱尔。阿伦、休格或者我的任何一个员工都不会。你可能并不看好我们任何一个人，但我们都比那聪明得多。”


    “这不公平，瓦莱莉。我不认为——”


    她用力摇头打断了我的话。“别人进在这里干的。我不知道是谁，但我意识到不是我自己的人。这不可能。`你`比我真正在乎的人更有可能是杀手。”


    我本可以因这种间接的侮辱感到受伤，但因为是瓦莱莉，所以我选择了放过。“你知道那天晚上是谁把奥斯卡放出来的吗？”我问，眼神向后巷的门闪过。“取决于他们作手的时间，他们可能看到某个不该在这里的人在附近徘。”


    “我完全不知道，”她说。“不是我。”


    我猜想也是如此。“有人杀了莱尔·卡里根，”我说。“虽然你可能不相信，但他们是在这里下手的，这表明与‘Java 之死’或这里这里的人有关。”


    “我不认同。我们这里没有人有理由伤害他。”


    “他本打算因你违反卫生条例而开罚单，”我指出。“而且有人告诉我，米基去过莱尔的家里，站在外面神情威胁性。”


    “他就会做那种事，”瓦莱莉不在乎地挥了挥手。“米基希望那能把他吓走。”


    “但并没用。那么，下一步是什么？尝试用武力把他吓走吗？”我放软了语气。“听着，瓦莱莉，仅仅因为你不想相信你认识的人可能犯下杀案，证据似乎指向了方向。”


    她交叉抱在胸前，但一句话也没说。

    '
- fmt: '

    The breeze felt good on my skin as I stepped outside. Cars rolled down the street,
    most obeying the speed limit, though a few were pushing it. Pedestrians passed
    me by at a regular clip. Death by Java *did* sit on a good corner. Business should
    be booming. Judging by the mostly full tables I could see through the windows
    at `Tito’s`, the deli was doing just fine. Better. It was doing great.


    And yet, Death by Java hardly garnered a glance from passersby. Months of poor
    service, of questionable cleanliness, had killed any and all interest in the place.


    But it felt like there was more to it than that. There were all sorts of places
    with dirty tables, with less-than-enthusiastic employees, that chugged along perfectly
    fine despite their shortcomings. Same went for the many businesses that were getting
    dinged for health violations. Lyle had gone into `Tito’s`, and yeah, he’d been
    tossed right back out, but I was pretty sure he’d given them bad marks with how
    `Tito` had treated him. The customers didn’t seem to care.


    So why was Death by Java struggling so mightily?


    I studied the deli as I called `Paul` on my cell. My mind was churning slowly
    over the possibilities, including ones that had `Lyle` getting killed for playing
    favorites of some kind. He answered on the second ring.


    “Hi, Buttercup.”


    “Ew. Don’t do that,” I said, making a face.


    `Paul` laughed. “It didn’t come out as naturally as I hoped.”


    “I don’t want it to,” I said. “From Dad, I’m used to it. You? I’m perfectly fine
