    # 13


    I was up bright and early the next morning, with plans to spend every waking moment
    with Paul, Dad, and Laura. I wanted to go shopping and take Paul around town to
    show him the sights personally. I wanted to have lunch and dinner at places I’d
    eaten at when I was younger. Show him my high school. Show him that place in Village
    Park where I’d seen the squirrel, though I still wasn’t sure I was ready to tell
    him *that* story.


    When I climbed into the shower, I had everything laid out.


    By the time I was done, my plans were already wrecked.


    “Detective McKensie called,” Paul said. “She wants us to meet her for breakfast.”


    A thousand denials were on the tip of my tongue, though I knew they would do little
    good. You didn’t tell a police officer no. “What did you tell her?” I asked.


    Paul made a pained face when he said, “I told her we can do breakfast, but we
    have plans afterward. I hope that’s okay. She made it sound like it was important.”


    “It’s fine.” And honestly, it was. If we got our sit-down with McKensie out of
    the way, told her everything we—and by we, I meant *me*—knew about the case, then
    we could be done with it. “I’ll let Dad know.”


    Paul nodded, kissed me on the temple, then headed into the bathroom, his clothes
    for the day tucked under his arm.


    Dad and Laura were sitting in the dining room, coffees in hand. One look at me,
    and my overly observant father already knew what I was going to say.


    “Do what you have to do.” He raised his mug in salute. “We’ll be here whenever
    you’re done.”


    “Paul already tell you?” I asked.


    “It’s my psychic superpower at work,” Dad said.


    Laura merely rolled her eyes.


    Paul’s shower was quick. Before Dad and Laura were done with their first cup of
    coffee, the two of us were out the door and headed for our breakfast meeting with
    Detective McKensie.


    She’d chosen a small diner downtown called Juan’s. It was nestled between two
    larger buildings right across the street from the police station, which made it
    a convenient place for her to conduct the interview. The smell of grease was strong
    as we entered through the glass front door. McKensie was seated at a booth in
    the corner, sipping at a coffee. She waved us over with a smile.


    “Thanks for coming on such short notice,” she said, motioning to the seat across
    from her. “Coffee’s still hot.” The pot was sitting at the edge of the table.
    Two off-white mugs were turned upside down in front of where she’d indicated.


    “I’m not sure there’s much we can help you with,” Paul said as he sat. “Krissy
    and I are here on vacation and hardly know anyone.” He flipped both our mugs upright
    and then filled them, sadly, sans cookie.


    “Understood,” McKensie said. “I still would like to go over a few things, if you
    don’t mind. Krissy *has* been in contact with people involved in the case, and
    I’d love to get her insights.” She glanced over at me before turning back to Paul.
    “And anything you can contribute can only help. I’m not officially on duty yet,
    so think of this as more of an informal meet.”'
