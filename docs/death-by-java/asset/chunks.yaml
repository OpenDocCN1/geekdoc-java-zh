- fmt: '

    Nadia gnawed on her gum a moment as she thought about it. “I mean, he’s only bit
    a couple of people. Don’t get too close, and you should be okay.” A pause. “So,
    like, shouldn’t you buy something if you want to hang around?”


    *Bit a couple of people.* If Lyle hadn’t already seen Oscar, I’m sure he’d love
    to know that a feral cat was living in the bookstore.


    But I didn’t want to be the one to turn Oscar in. It wasn’t his fault Valerie
    was letting him stay. He was probably just looking for somewhere comfortable to
    sleep. It made me wonder if she’d taken care of him in any way at all, gotten
    him his shots, or even *fed* him. I hadn’t seen water or food dishes, let alone
    a litter box, during my quick peek.


    I’d bring it up with Valerie the next time I saw her.


    Nadia stepped over to the register, a clear hint to order a drink or leave.


    “Sure,” I said with a sigh. “Do you have cookies?” A glance at the empty display
    told me that no, they didn’t, but I asked anyway. I could really go for a chocolate-chip
    cookie soaked in coffee right about then.


    “Not right now,” Nadia said. “Ice machine’s broken.”


    I opened my mouth to ask what an ice machine had to do with cookie baking, but
    closed it again and let it go without comment. “A black coffee is fine.”


    With a put-upon sigh, Nadia turned to get me my coffee, while Farrah continued
    to stare down at her phone, oblivious to the world around her.


    # 4


    Time crept by slower than business at Death by Java, and that was saying something.
    As I sipped at my coffee, which, to be honest, wasn’t as bad as I’d expected,
    I finished my rounds around the dining area before moving on to the books. I didn’t
    invade Oscar’s domain; he was still camped out in his corner, and I didn’t want
    to bother him and become one of the bitten.


    I recognized most of the book titles, so that was good. The organization was questionable,
    with books by the same author being shelved in different places with no rhyme
    or reason as to why they were separated. As I’d noted before, some books were
    stacked on top of one another, while others were standing upright. And while there
    was a counter upstairs where an employee could check out customers, no one was
    there now, nor had I seen anyone go up there since I’d been there.


    It made me wonder what would happen if I wanted to buy a book. Would Farrah help
    me? Or would I have to take the book downstairs to pay for it? Nadia had left
    a few minutes ago, though I wasn’t sure if she was on break or if she was done
    for the day. Farrah was all that was left to handle customers since Valerie had
    yet to emerge from the back.


    Of course, there deended to *be* customers first.


    I tapped a final note into my phone, glanced at the time, and then, with nothing
    better to do, I headed for the counter, where Farrah was busily studying the screen
    of her own device.


    “Hi,” I said.


    Farrah glanced up, raised a single eyebrow in question, and then went right back
    to staring at her phone without waiting for me to continue.


    I tamped down my annoyance. I’d have to add *employee attitudes* to my list of
    things that needed fixed, but now wasn’t the time to bring it up. “I was wondering
    if I might be able to go into the back and have a look around. Valerie’s still
    back there, right?”


    Farrah shrugged. Didn’t look up.


    “I’m finished up front here, though it would be helpful if I could have a peek
    behind the counter to see how things are organized.”


    Another shrug. I had a creeping suspicion that Farrah wasn’t listening to a word
    I said.


    “Mind if I have a quick look and then head to the back? I won’t get in your way.”
    Not that she was doing anything.


    “Knock yourself out.” Farrah tapped her phone, smiled at something she saw.


    I waited a beat and then rounded the counter. I half-expected to find bottles
    shoved haphazardly onto shelves, coffee bags tipped over, spilling their contents
    onto the floor. Maybe a puddle of water or two.


    Instead, the space behind the counter was clean, and everything was properly sealed
    and shelved correctly. Lyle’s influence? Or was it kept tidy because Valerie and
    the girls actually had to work back here and they didn’t want to slip on spilled
    beans?


    Satisfied, I turned toward the back door, which was closed and didn’t have a window.
    There was no other door in this portion of the store, so unlike Death by Coffee,
    there was no office immediately evident.


    With a glance toward Farrah, who was paying me absolutely no mind, I pushed open
    the door and stepped through.


    Valerie and Roman stood near the ice machine a few feet away, far too close for
    comfort. Valerie’s hand was pressed against Roman’s cheek, a coy smile on her
    lips. Roman was holding a screwdriver loosely in a hand that was resting on Valerie’s
    cocked hip. There was no locking of lips, no grotesque fumbling, yet I felt like
    I’d just walked in on them in the middle of something far less PG than what was
    actually going on.


    “Uh …” Irrational panic flooded my system. I tried to look away, but couldn’t.
    Valerie had a boyfriend, and yet, here she was, seemingly flirting with another
    man.


    “Was there something you needed?” she asked, sounding almost bored, before she
    stepped out of Roman’s grip.


    “I was just… looking,” I lied, my heart hammering against my ribs.


    Valerie didn’t answer, she just turned back to Roman, and I was alone in the cold,
    sterile light of the back room.

