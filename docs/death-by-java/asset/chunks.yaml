    I made my way around the counter to the back, figuring that Valerie wouldn’t mind.
    I wondered who was supposed to be working the front, then put that in the back
    of my mind when I saw Valerie standing there, staring at the dent in the door
    of the ice machine. I didn’t think she’d noticed me until she spoke in a slow,
    almost-deadened voice.


    “Do you ever look back on your life and realize that you’ve made more mistakes
    than correct choices?”


    I wasn’t sure how to answer that, so I didn’t. “Are you okay, Valerie?”


    She glanced over at me and gave me a smile that was more frightening than comforting.
    “Why wouldn’t I be? My business is floundering. Employees keep calling off. My
    life is in shambles. A man was found dead in my shop, and I don’t know if someone
    I care about did it.” Her eyes slid back to the dent. “And `you`, of all people,
    have come to bail me out. I’m pretty sure the universe hates me.”


    I took a step toward her. “Did something else happen?”


    She stared at the dent a moment longer before she suddenly seemed to snap out
    of whatever dark place she’d been in. “No. Everything’s fine.” This time, her
    smile was more natural, though there was still a dark cloud hovering around her.
    “Is there something I can do for you, Krissy?”


    I wasn’t buying her sudden shift. “Valerie,” I said, taking another step toward
    her, “if Mickey did something—”


    “What? No. Mickey didn’t do anything. Other than not answer when I call. Or call
    me back. Or show up at my place when I’m sitting there all alone, with no one
    to make sure I don’t fall into …” She took a deep breath, plastered on that fake
    smile of hers. “It’s nothing.”


    It sure didn’t sound like nothing. “Talk to me,” I said, spreading my hands invitingly.
    “Just because we didn’t get along when we were younger, doesn’t mean we can’t
    now.”


    A flurry of emotions flashed across her face. There was the expected disgust and
    annoyance, followed by what I took for a genuine desire for someone to actually
    `listen` to her. Aaron and Hugh would, but they’d only do so because they were
    trying to get back into her good graces. And I was pretty sure the both of them
    would only tell her what she wanted to hear, which I’m positive she realized.
    She might be shallow, but she wasn’t stupid.


    And while having someone stand there, agreeing to whatever they thought she wanted
    them to agree to, could be nice, that wasn’t what Valerie Kemp needed right then.
    What she needed was a friend.


    Sadly, I was as close as she was going to get to one.


    “Mickey did that,” she said, motioning toward the dent. “He hauled off and punched
    it because he didn’t like the fact that I was here alone with someone else.”


    “That night. When I saw the light?”


    Valerie was wearing tight pants with no pockets. She ran her hands around her
    hips, where pockets should be, like she was desperate to shove her hands into
    them, but couldn’t. “For a little while, yeah.”


    “Was it Roman?”


    She made a face. “Not even.” The disgust morphed, but it didn’t go away. “It was
    Hugh. We didn’t `do` anything,” she hurriedly added. “We just talked. But Mickey
    didn’t believe me. He knew about my past and refused to believe that I’ve changed.”
    She met my eyes, and I noticed they were wet, near to spilling over. “I have.
    I really have.”


    In that moment, I believed her. “Aaron and Hugh both still care for you, despite
    whatever you’ve done.”


    “I know,” she said, with the ghost of a smile. “And I like having them around.
    You might not understand, but I `need` them to want to be around me. I’ve focused
    so long on what `I` want, I kind of forgot about my friends and the people I care
    about so much so that they hardly care about me anymore.”


    “Bray and the others—”


    She scoffed, cutting me off. “They came here that day for you, not me. They pretend
    that we’re all best friends, but we’re not. Bray honestly wants to make amends
    for how he acted when he was younger, especially toward people like you.” Another
    scoff, this time, for another reason. “Like it would change anything.”


    I felt we were getting off the topic of what was important, so I veered the conversation
    back to where I believed it should be. “Mickey punched the ice machine,” I said.
    “Do you think he killed Lyle?”


    “Of course not!” Valerie sounded genuinely appalled that I’d even consider the
    notion, even though she’d thought along those same lines recently. “He doesn’t
    have that sort of violence in him.”


    Considering the ice machine, I wasn’t so sure. “I heard a rumor that he was connected
    to another death a few years ago. A friend of his died, and there are rumors Mickey
    might have killed him.”


    Valerie waved away the idea. “That’s ridiculous. Mickey would have told me if
    he’d `killed` someone.”


    I almost pointed out that no, killers didn’t often confess their crimes to anyone,
    let alone someone they were in a relationship with, but I let it go. It sounded
    like Valerie knew nothing about what had happened, so asking her about it was
    pointless. Hopefully, she’d at least consider what I’d said, just in case it turned
    out to be true.

