    gesture, but then I quickly realized it was more than that. A bandage was wrapped
    around the knuckles of his right hand. And I couldn’t be sure, but it appeared
    as if the fingers of that hand were swollen, as if he’d punched something hard
    enough to break a bone or two.


    Mickey watched the scene for a good minute, maybe two. And then, with a quick
    look around to make sure no one had seen him, he slipped quietly away.


    “Are you okay, Buttercup?”


    I frowned down into my coffee, irrationally wishing I had the spiced chai tea
    I’d recently grown accustomed to drinking. The bubbles created by the chocolate-chip
    cookie I’d placed into my chipped coffee mug before pouring were long gone, and
    a few soggy crumbs had floated to the top. The chip in the mug, Dad claimed, was
    symbolic. He said it reflected how in life, even something damaged could still
    be of use. In reality, he’d always been careless with the dishes and the low-hanging
    faucet.


    “I take it Pine Hills is in Ohio?” `McKensie` said. “You’re the aforementioned
    boyfriend?”


    Once again, I was surprised by how quickly `McKensie` caught on. “He is.”


    Paul’s smile was as charming as ever. “It is. And I am. Is Krissy in trouble?”


    Detective `McKensie` smiled. “No. She’s free to go, though I’d appreciate it if
    she left her contact information with Officer `Peel` outside, just in case I have
    any follow-up questions.”


    Relief washed over me. “We’ll get out of your hair—”


    “Actually,” `McKensie` said, cutting me off. “I’d like to talk with Mr. Dalton
    here for a few minutes.” She motioned toward the door. “You can wait for him outside.”


    An objection was on the tip of my tongue. Paul knew less than what I did. He was
    only here now because he’d been out on a run and had seen the commotion. He’d
    probably spotted Dad’s car, or Dad himself, and come over to investigate. And
    then, upon hearing that I was inside, talking to the police, he’d come in make
    sure I was okay.


    *Or make sure I wasn’t getting myself pulled into a murder investigation.*


    “Go ahead,” Paul said. “This should only take a few minutes.”


    Still, I hesitated. I wanted to know what Detective `McKensie` was going to ask
    Paul, if she was going to verify my story, or if she was going to try to poke
    holes in it. Paul was right; this wasn’t his jurisdiction, so why would she want
    to talk to him? He couldn’t help her. He wasn’t a cop here.


    Then again, neither was I. I wasn’t a cop *anywhere.*


