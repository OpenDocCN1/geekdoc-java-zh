  raw: '“So …” I looked from Nadia to Farrah. “Could one of you yell back for Valerie
    for me?”


    There was a beat before Nadia said, “Sure. Let me get her.”


    Nadia spun and *clack*ed her way to the back. Farrah eyed me a moment, then fished
    a phone out from beneath her pink dress somewhere. She tapped it a few times,
    her pink nails *clack*ing against the screen in a way that sounded like it might
    be marking it up.


    “I take it the pink is part of the uniform?” I asked, earning a half-smile and
    a subtle head bob I took for a nod. “Do you like working here?”


    “It’s all right.” That was followed by a not-so-subtle step away from me.


    *Okay, then.* I took the hint and let it go, choosing instead to take a more thorough
    walk-through of the dining area. Even though it was close to open, there was already
    trash on the floor, along with a smear of something that looked like chocolate
    on one seat. A cobweb hung on the bathroom sign, and I noted that one of the doors
    didn’t close all way, leaving a gap that anyone could peek through. I decided
    not to see how the bathroom stalls looked, at least not yet.


    I worked my way back toward the front, picking up and tossing the coffee cups
    into the trash as I did. Farrah was watching me over the top of her phone with
    disapproval, but she didn’t tell me to stop as I bent over and picked up a balled-up
    napkin and threw it away.


    It took five more minutes before Nadia returned. Valerie floated out right behind
    her.


    “Krissy?” Valerie rounded the counter and joined me. She was wearing flats, and
    her outfit was a little less showy than the last time I’d seen her, though the
    jeans were tight and fashionably ripped and her blouse was pure and white as snow,
    hinting that she didn’t plan on working with anything messy. “What are you doing
    here?”


    “Hi, Valerie. I thought about what you said yesterday, and well …” I spread my
    arms. “Here I am.”


    A scrunching of her nose betrayed her when she smiled that fake smile of hers,
    the one that attempted to be polite, but was more condescending than anything.
    “That’s great. It is kind of a bad time, though.”


    “Your ice machine.” At her nod, I said, “I heard you and Lyle talking when I came
    in.”


    “I don’t know what happened.” She made a frustrated sound. “It was fine last night
    when I left. I even came back after closing because I forgot—” She cut off abruptly
    and gave me a look like I’d tried to coax her into incriminating herself in some
    sort of crime. “Well, never mind that. Everything was in tip-top order when I
    left.”


    “You checked the ice machine when you were here?”


    “Well, not *checked* it. But I was in the back, so I saw it. There was no water
    on the floor, and I heard it make that racket it does when it’s making ice.”


    I considered that, then asked, “What time did you leave last night?”


    “I don’t know? Six, maybe? I wasn’t keeping track. Why?”


    Six was well before Laura and I had gone on our walk. “I walked past just before
    dark, and I saw a light on in the back room and thought that it might have been
    you.”


    “No.” Her eyes flickered away, back again. “It was still light out when I left.
    I don’t like being here after dark. It’s creepy. You were probably mistaken.”


    “It was on back there.” I pointed toward the door, just in case she somehow didn’t
    get it. “I couldn’t be sure, but I thought it might have been a flashlight. Or
    perhaps a desk light someone walked past? The door was propped open, and the light
    dimmed at one point and—”


    “No one was here,” Valerie said, voice going hard. “There was no light on.” She
    turned. “Farrah, was the back-room light on when you got here this morning?”


    Farrah’s eyes flickered up from her phone. She gave the briefest of head shakes
    before she was right back to perusing whatever was on her screen.


    “See?” Valerie said, turning back to me. “No light. Like I said, you must have
    been mistaken. Maybe you saw a reflection from next door or something and thought
    it was a light in here.”


    I wanted to continue to argue, but why? She clearly wasn’t going to believe me,
    or at least, admit that she might have been here later than she’d said. It made
    me wonder what Valerie could have possibly been doing that she wouldn’t want anyone
    else to know about?


    *Perhaps something like sabotaging her own ice machine.*


    Though why she would do that, I had no idea.


    “If that’s all …” Valerie edged away from me. “I really have a lot to do. I’m
    waiting for the repairman, and I have … *stuff* to manage.”


    The urge to call Dad and have him come get me was strong, but I knew that if I
    left now, I’d regret it later. I was here for a reason, and despite Valerie’s
    evasiveness—and attitude—I wanted to get it over with.


    “How about I do a thorough walk-through around the place?” I asked. “I’ll make
    a list and give you a few suggestions on how you can improve. You *did* want me
    to help you attract more customers, right? This is how we can do that.”


    Valerie made a face, like the thought of me wandering around her bookstore café
    was enough to make her ill.


    Before she could reject the idea, however, the door opened, and a guy who looked
    like a stripper playing the part of a repairman entered. The top three buttons
    of his shirt were undone, revealing a bronzed, hairless chest. A belt, with tools
    that looked as if they’d never been used, hung loosely from his hips. He wore
    shorts with sandals, and had one of those rope anklets around his left ankle.


    “Roman! Thank goodness you’re here.” Valerie spun and rushed over to him. “I was
    just about going insane with worry.”


    “Hey, babe,” Roman said with a wide smile, revealing perfectly straight, pearly
    white teeth. “What appears to be the problem?”


    “It’s in the back.” And together, they walked off.


    Abandoned, I decided to go ahead and do my walk-through, with or without Valerie’s
    permission. Chances were good she wouldn’t care what I found. I’m not sure what
    that said about me, other than “gullible.” Both Nadia and Farrah were watching
    me with disinterest, so I got started.


    Using an app on my phone, I took notes about what I saw. I figured that I could
    send the list to Valerie and if she decided to make changes, great. If not, I’d
    at least tried. I mentioned the cobweb, along with a note that she might want
    to consider removing the NO EXCEPTIONS sign since it came off as insensitive and
    insulting. The bathrooms themselves were surprisingly clean, but one of the toilets
    in the women’s room had a slow leak that someone had stopped up with a wad of
    paper towels. I assumed Lyle had already pointed that out to Valerie, but I made
    a note of it anyway.


    From there, I headed into the bookstore portion of the store, but before I could
    peruse the shelves up close, a threatening *hiss*, followed by a deep-throated
    growl, stopped me in my tracks.


    The black and white cat was tucked away in a shadowy corner of the room, which
    was why I hadn’t noticed him—and I could tell it was a him since he wasn’t fixed.
    His fur was grimy, and a dirty, almost black, streak ran across his nose. Hackles
    raised, he turned sideways and arched his back, making himself look bigger. His
    eyes narrowed as he growled and hissed again.


    “Nice kitty,” I said, easing back a step. “Go back to sleep. I’m leaving.”


    That earned me another hiss and a growl so deep, it seemed to vibrate through
    the floor. Then, as I backed past the bookshelves, the cat eased back down, tail
    swishing.


    “What was *that*?” I asked Nadia once I was safely at the counter. I pointed in
    the general direction of where I’d left the cat.


    Nadia snapped her gum, craned her neck to get a better look, then leaned back
    with a smile. “That’s Oscar.”


    “Oscar? Whose cat is he?”


    Nadia shrugged one shoulder. “The store’s? We just let him hang. Dee takes care
    of him when she comes in, though she didn’t show up today.”


    “Is he safe?” I asked. “For the customers, I mean.”'
