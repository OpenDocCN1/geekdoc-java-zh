  trans: '

    楼上一个房间里出现了一个黑影。片刻后，灯灭了。我紧张地期待着，在脑子里数着秒数，接着 Tito 出现了，他穿得很休闲，穿着宽松的运动裤和一件背心。一只毛茸茸的雪白猫跟在他脚后，而
    Tito 在咖啡桌前踱步，显然非常焦躁。


    在漫长的几分钟里，没有发生其他任何事情。Tito 用手抓过凌乱的头发，似乎在自言自语——或者，根据养猫人士的经验（我自己也是其中之一），是在对着他的猫念叨。他手里并没有那块显眼的平板电脑，但我*很清楚*那是他所担心的。


    看着他，我口袋里的手机显得格外沉重。我现在可以打电话给`Detective McKensie`，但我能告诉她什么呢？我没有证据证明 Tito 做了任何错事。她不能凭我的话就搜查他的房子寻找丢失的平板电脑，而且我怀疑如果她问起他，Tito
    不会承认任何事情。我需要证据，即使是微小的证据，也能让我拥有比推测更有根据的东西。


    那只猫似乎厌倦了跟在 Tito 身后转，它跳上猫架向外望去。它那双大绿眼睛立刻发现了我，耳朵由于兴趣竖了起来。


    “走开，”我低声说，示意猫跳下来，尽管我知道这是徒劳无功，“走开，免得你……”


    等我话还没说完，Tito 停止了踱步，穿过房间来到窗边。我躲回树后，心脏在胸腔里剧跳，呼吸仿佛凝在喉子里。我等了整整一分钟，才胆敢再次向房子瞥了一眼。


    猫不见了，窗帘紧闭着。


    是时候该走了。


    我又观察了窗户几分钟，以确保 Tito 或他的猫不会回来，然后从树后走出来。我肩膀紧绷，穿过院子走向他的车，正当我到达那里时，Tito 动门把手的咯吱声让我立刻双膝跪在车后。


    从车底下我看不清太多什么，但我所看到的景象让我的耳朵里血流如涌。Tito 穿着棕色拖鞋，正朝我躲藏的这辆车走来。我的大脑意识到他没穿袜子，同时我还在徒劳地试图找出一个合理的解释，说明我为什么潜伏在他的车道上。


    然而，Tito 并没有像我预想的那样绕过车辆进入驾驶座，而是继续往前走，朝车道尽头的垃圾桶去。我保持蹲姿，慢慢绕过保险杠来到汽车一侧，祈祷他没有注意到我的运动鞋在铺装路面的声音。


    当他在垃圾桶旁停下时，我看不他在做什么，但我能听到。随着一声*咚*的，他打开了塑料盖并让它掉在桶侧。接着是一阵塑料的响动声，然后是像拍打同一个塑料表面的声音。片刻后，又是一声新的*咚*，我以为是他关上了盖子，接着是
    Tito 匆忙走回房子时裤腿摩擦的*沙沙*声。


    我一听到门再次关上的声音，就瘫在轮胎旁，呼吸急促而剧烈。刚才实在*太*近了。


    街的另一头，一扇门开了，一个留着短发的女人走出门外，手里提着一袋垃圾。她把它扔进车库外的一个桶里，然后拖着刺耳的声音把那个桶拖到车道尽头。她环顾了一下四周，目光似乎直接穿过了坐在
    Tito 车旁的我，然后转身走回了自己的房子。门关上了，发出一声结实的*砰*声，在街上回荡。


    我颤抖着腿站起来，越过 Tito 的车向外看。客厅的灯还亮着，窗帘依然关着。我的目光转向垃圾桶，心中涌起一阵好奇。Tito 可能只是扔掉了一袋猫砂，但我并不这么认为。我看到他在里面时他很焦躁。而且我很确定我们之前的对话就是原因。


    *给 McKenzie 侦探打电话！*


    然后告诉她什么？告诉我怀疑 Tito Adornetto 刚刚扔掉了 Lyle Carrigan 丢失的平板电脑？我不够熟悉法律，不知道她是否可以在没有充分理由的情况下搜查他的垃圾。我的意思是，那是垃圾，在路边，任何人都可以路过并翻找。


    而任何人包括我。


    我脚步轻快而坚定，冲向垃圾桶。我不确定他打开了两个中的哪一个，所以我从最近的一个开始检查。里面放着一个黑色的垃圾袋。它的抽绳被拉紧并系了结。我检查了它的两侧，一无所获，于是关上盖子，走向下一个，并回头看了
    Tito 的房子。一切没有变化，但我能*感觉到*时间正在流逝。


    我打开盖子，看到那个破了的袋子时，心脏漏了一拍。不，一个破的垃圾袋不能证明任何事，而且太黑了看不清里面有什么。我咬着牙，手伸进破口，避开了一个摸起来像香蕉皮的东西，和一个让我想起最喜欢的百朗蛋糕混合粉的长方形盒子。我胡乱摸索着，手背在盒子上划过，碰到了一个铝罐、一个玻璃瓶，还有……


    橡胶。


    我愣住了，被自己可能是对的这一事实震惊了。


    我深着缓慢而克制的呼吸，手指顺着边缘移动，直到碰到了它。

