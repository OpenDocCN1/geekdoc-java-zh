  raw: 'Wait. That wasn’t true. I could imagine one thing that could have happened.
    If it wasn’t Mickey who was cheating, but Valerie, and with a certain handyman,
    possibly late at night where the only light was a flashlight to keep anyone else
    from noticing …


    Which led me to another thought.


    “You said there was a screwdriver on the floor near where Lyle was found,” I said,
    keeping my tone neutral. “Do you really believe it was Roman’s?” She’d claimed
    he might have dropped it, but was she positive? Or had she merely assumed it was
    his?


    There was a beat of silence before she said, “I don’t know. Maybe?” A rustle followed.
    “I really do need to go. Let’s talk later, okay?”


    Before I could respond, she was gone.


    I lowered my phone with a frown. Valerie was lying. Whether to protect herself
    or Mickey, it didn’t matter. No, I didn’t need to know every sordid detail of
    her and Mickey’s relationship with each other—or with anyone else. But if it cleared
    them of murder, why not at least *try* to explain things away? Being evasive only
    made her look guilty.


    I closed my eyes and imagined the scene. Valerie, at Death by Java, meeting with
    Roman. Or maybe it was Mickey with one of the bookstore café’s employees, let’s
    say Farrah. Either way, they had a flashlight on as they romped around in the
    back room. Lyle happened by, and, like I did the night before, he saw the light.
    Maybe he assumed it was the back-room light, left on by accident, and he came
    up with a way he might be able to cite them for it. Maybe he saw movement and
    decided to go in and talk about the ice machine. He caught one of them cheating,
    threatened to cite them … because I imagined that hanky-panky in the back room
    of a café would be a major health violation.


    Then what? Mickey—or Roman—killed him because of it? Did that mean Valerie, or
    whomever Mickey was cheating on her with, had seen the murder happen?


    A soft knock at my bedroom door caused me to open my eyes.


    “Krissy? You awake?” Paul gently eased open the door.


    “Yeah. Just thinking.”


    “I’m sorry I’m so late,” he said, entering the bedroom. “Gabby found out some
    interesting details on a few of the involved parties and wanted to get my take
    on it. And you know how slowly police business can go.”


    “Glacial.”


    He nodded, dropped heavily onto the bed. “Apparently, Lyle Carrigan had gone to
    the police about Mickey Robbins and Valerie Kemp about a week and a half ago.
    He claimed Robbins showed up at his place on Kemp’s orders. Robbins didn’t do
    anything but stand outside and stare, but it unnerved him.”


    “Wow,” I said. “That doesn’t sound good for Mickey.”


    “No, it doesn’t. You throw in that scene in Death by Java later and Mickey’s current
    vanishing act, and it doesn’t look good for him at all.”


    I blinked. “Mickey’s missing?”


    Paul seesawed his hand. “He’s not picking up his phone, and he hasn’t shown up
    at home or at Valerie Kemp’s place since the body was discovered. I know you know
    them—”


    “I know Valerie,” I said. “Mickey is new to me.”


    He conceded the point. “He’s making himself look guilty by avoiding the police.
    If he doesn’t make an appearance soon, he’s going to end up being the prime suspect.”


    *If he’s not already.* I considered telling Paul about what I’d learned, about
    how Valerie had been evasive about the light and the ice machine, along with my
    suspicions that one, or both, of them were cheating on the other, but then I decided
    against it. Paul wasn’t on duty. He had no jurisdiction here. And if I told him
    about it, he’d feel the need to talk to Gabby about it, which would mean another
    lost day while he helped her with the case instead of going to the beach with
    me.


    “What do you think about us calling it a night and forgetting all about Mickey
    Robbins and murder?” I asked. “We have a big day tomorrow.”


    Paul grinned. “You, in a skimpy bikini, on the beach.”


    I made a face. “Bikini, yes. Skimpy, in your dreams.”


    He held out a hand, and when I took it, he pulled me down onto the bed next to
    him. “Have you been spying on my dreams?”


    “Do I really need to?” I kissed his temple. “I’m pretty sure I already know what’s
    going on in that head of yours.”


    He held on to me for a couple of minutes more, murmuring things I won’t repeat
    here. Let’s just say that by the time he was done, I was keen on closing the door
    because I didn’t want Dad or Laura to see me blush. Not for the first time, I
    wished we had gotten a hotel room somewhere in town, rather than staying with
    my dad, because there were just some things you didn’t—and couldn’t—do when visiting
    your family in their home.


    # 9


    “Do we have everything?” Dad scanned the pile of beach supplies with a frown.
    “I feel like we’re forgetting something.”


    “It’s all there,” Laura said. “I’ve already triple checked. I even packed extra
    sunscreen, just in case you don’t like the smell of mine, which, knowing you,
    you won’t.”


    Dad pinched his nose and waved his hand in front of his face before he turned
    to Paul. “Are you ready for this? The drive should take less than two hours, and
    that’s if I drive. Laura tends to follow all the traffic laws, which means we’ll
    be putt-putting along just under the speed limit. And she hates passing, so if
    the car in front of us is going twenty miles per hour, then we’re going to be
    going twenty miles per hour.”


    “Says the man who never drives because he thinks everyone else is a lunatic,”
    Laura said.


    “Well, they are!” Dad grinned. “And I’d drive if you’d ever let me. Of course,
    then all you’d do is squeal every time I come up on another car.”


    Laura just looked at him, causing him to laugh.


    “Okay, maybe my reflexes aren’t what they once were, but at least I’d get us there
    faster.”


    She rolled her eyes. “If we got there at all.” She turned to Paul. “You know those
    old men who drive like the double yellow line is some sort of rail that they have
    to ride on?” She jerked a thumb at Dad. “He takes that to heart.”


    Dad’s hand went to his chest, and he staggered back a step. “Are you calling me
    *old*?”


    She raised both hands, palms outward. “I’m just saying that your assessment of
    our comparative driving skills might be somewhat inaccurate.”


    “Point conceded,” Dad said, bowing his head to her before turning my way. “Buttercup?”


    “Don’t look at me,” I said. “I’m not driving.”


    “And I have no idea where we’re going,” Paul said before Dad could look at him.


    “Looks like we’re putt-putting, then,” Dad said with a sigh. “I suppose we’d best
    get the car loaded so we can get there before dark.”


    Laura elbowed him good-naturedly, and then we got to it.


    Since this was only a beach day and not a full-fledged sightseeing trip, there
    wasn’t much for us to pack. Bags filled with towels, sunscreen, and swimsuits
    were hoisted and placed in the trunk. A cooler full of drinks—mostly water—was
    added next to the snack bag, which consisted of carrot sticks, celery, and other
    freshly chopped veggies.


    “I can sit in the back,” Dad said once the car was loaded. “If you or Paul wants
    to ride up front, that is.”


    “I wouldn’t hear of it,” Paul said, looking to me.


    “Me either,” I said. “You can play the role of backseat driver from up front just
    as easily, if not more so.”


    “Ha-ha.” Dad smiled as he said it, despite his attempt at sounding offended. “We
    should get there early enough to snag a good spot. It’s going to be busy, so be
    prepared for that. I was also thinking that on the way back, we could stop at—”


    Before he could finish, my phone went off.


    We all just stood there, surrounding the car, with everyone looking at me like
    I’d just belched out loud. Dread welled up in my gut because I *knew* that if
    I were to answer the phone, if I were to so much as pull it out of my back pocket
    and look at the screen, our fun little beach day would be ruined.


    *But what if it’s Vicki about Death by Coffee and our electrical problem? Or Jules
    about Misfit. Or …*'
