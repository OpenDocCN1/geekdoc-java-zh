    to make an appearance, freshly bronzed from the beach, it would give me yet another
    opportunity to coax something useful out of her.


    It wasn’t quite evening when Paul, Dad, and Laura laughed their way through the
    front door. Dad’s nose was pink, while Laura looked the same as she had when she’d
    left. Paul, on the other hand, glowed as if he’d become radioactive.


    “Forget your sunscreen?” I asked with a wide smile.


    “I bathed in the stuff.” He stuck a finger into his ear and wiggled it around.
    “And I have sand everywhere.”


    “I have a theory that sand is sentient and mobile,” Dad said. “It will find a
    way into every crevice, every device, into every single pore of your body, no
    matter how hard you try to keep it out.”


    “Wait until you take a shower,” Laura added. “You’ll be standing in a sand dune
    by the time you’re done, with no idea where it all came from.”


    “I think I’m going to go do that now.” Paul started down the hall, but he paused
    when he got a good look at me. “What happened to you?”


    “I had a wrestling match with a cat,” I said, holding up my Band Aid–adorned arms
    and hands.


    “There’s a cat here?” Dad asked, looking around as if one might come darting out
    from under the table.


    “No, but I caught the one that was at Death by Java and got it to the vet. Long
    story.”


    “Let me get that shower, and then you can tell me all about it,” Paul said, running
    a hand through his hair. Sand cascaded down onto his shoulders like he had a bad
    case of dandruff. “Do you still want to go to that reunion tonight? I’m game,
    but if you aren’t, we can stay in.”


    “I do,” I said, brushing the sand from his shoulder. “Now, go shower. Looking
    at you is making me jealous.”


    “Wait until I show you the pictures I took of him in the water with those—” Dad
    flinched when Laura elbowed him. “Okay, okay, I’m kidding.”


    “James here thinks he’s a world-class practical joker,” Laura said, leading the
    way into the kitchen, where she poured herself a glass of water. She downed half
    of it in one go. “Paul behaved himself. Your dad here was an absolute terror.”


    Dad held a hand to his chest. “That wounds me deeply, my dear.”


    Laura rolled her eyes, gave me a crooked grin, and polished off her water without
    giving me an explanation as to what they were talking about. I was pretty sure
    I didn’t want to know.


    “Did everything get sorted with Valerie?” Dad asked.


    “Kind of?” I made a face. “It’s hard to say, really. She’s worried her boyfriend,
    Mickey, might be the killer. It took some doing, but I coaxed her into talking
    to the police. Detective McKensie took her aside so I didn’t hear what they discussed.
    I hope Valerie told her everything and didn’t leave something out because she
    was afraid of what it might do to her reputation. Even though she’s worried about
    Mickey, she’s still being evasive about a few things.”


    “That’s too bad,” Dad said. “I know you two had your issues over the years, but
    she doesn’t deserve this.”


    “No,” I agreed. “No one does.”


    Paul returned from his shower a short time later, looking much better than he
    had when he’d arrived. The red glow had dimmed to a more natural shade of pink.
    He was wearing a nice outfit, but nothing too extravagant since this was merely
    an impromptu class reunion, not a fancy dinner date.


    “*Gabby* asked about you,” I told him, making sure to use her first name. “She
    was disappointed you weren’t at Valerie’s, and she said she’d like for us to all
    get together soon and chat about the case.”


    “I see.” Paul cleared his throat. “She was there?”


    I quickly explained about Valerie and her reluctant chat with Detective McKensie.
    “I expect she’ll call tomorrow. She seemed keen on seeing you again.”


    “Making good with the local cops, are we?” Dad asked. “I know a few of them from
    when I’ve needed to do research on police methodology.”


    “I’m going to get ready,” I said, glancing at the time. “I’ll be out in five.”


    Dad started talking about one of his visits with the local police as I headed
    down the hall to my bedroom to get dressed. It took closer to ten minutes than
    five for me to get ready, thanks to my indecision about what to wear. Hooties
    wasn’t a fancy place, yet I wanted to impress my old classmates. I’m not sure
    why I cared, but I didn’t want to show up just in shorts and a T-shirt.


    I eventually settled on a nice blouse with a pair of jeans. I ran a brush through
    my hair, rechecked my makeup, and then, with a nervous huff, I returned to the
    kitchen, where Dad was finishing up his story.'
