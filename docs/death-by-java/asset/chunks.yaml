    # 那么蒂托呢？他拿了莱尔的平板。他是被马可拉进这个局面的，这意味着莱尔对他的纠缠就像对瓦莱里纠缠的一样。她会不会在从罗马曼那里得知莱尔的所作后，告诉了蒂托莱尔在做什么？是否出于一种符合我对那个男人的认知的怒火，蒂托杀了莱尔，并将尸体遗留在
    `Death by Java`，仅仅是因为他不认可瓦莱里的方法？


    但话说回来，如果那样，他是怎么把尸体弄进书店咖啡馆的？我漏掉了一些信息，而且完全不知道是什么。


    “你还好吗？”保罗问道，拍了拍我的肩膀。


    “好。没事。我为什么不没事呢？”


    “你脸上带着那种表情。”


    “什么表情？”


    保罗握住我的手。“那种说明你的大脑在以每秒万英的速度运转的表情。那种说明你在思考谋杀，以及如何让自己卷入调查的表情。”


    “我没——”一栋建筑引起了我的注意，我从保罗的手里抽回手指向它。“爸！靠边。”


    他没有多问，顺滑转动方向盘停在路边。我们身后传来一声鸣笛声，紧接着一辆车疾驰而过，速度远比应有的快。


    “给我五分钟时间，”我说，推开门走下车。“我就回来。我保证。”还没等有人回应，我便已匆忙走向那栋位于市中心、周围是一群其他相似且无趣建筑正中的建筑。


    红木村健康部门门前是几排窗户，窗户上覆盖着长而厚重的窗帘，让我不禁怀疑为什么要费劲装上窗户。除此之外，它就像一个矩形盒子。穿过正门的一瞬间，一股冷风迎面而来，随着我向建筑深处移动，冷风又消失了。墙上的标牌指向食品安全部门。我顺着箭头走，并不太清楚自己为什么要来这里，但直觉告诉我要进来，所以我就进来了。


    “有什么能帮你的吗？”一个高大的女人坐在一张对她来说太小的桌子后面。她拥有一头令人羡慕的深色卷发，垂落在毛织衫遮下的宽阔肩膀上。


    “你好，抱歉打扰了。”我扫视了她身后的区域，几间相同房间里聚集的几张办公桌旁没人。“莱尔·卡里根在这里工作过，对吧？”


    女人缩了一下，仿佛被我打了一拳。“他确实在这过。你是？”


    “克莉丝·汉考。我认识他。”我越过桌面握住女人的手，希望她没有听出我因歪曲事实而声音颤抖。


    “贝利，”女人说道。“莱尔是个好人。我不相信会有人想伤害他。”她叹了口气，然后注意到我对身后空隙的关注。“今天大多数人都在外面。只有我一个人在这里接电话。”她指了指那个正保持沉默的电话。


    “我不会占用你太多时间的，”我说。“我对莱尔以及他在这里的工作很好奇。你能告诉我一些关于他的事情吗？”


    “可以。”贝利似乎很乐意聊天，考虑到独自坐在这里该有多无聊，这倒也不意外。“莱尔是一名健康检查员，如你所知。他专注于食品安全，就像我们这里的所有人一样。他主要做抽检，以及标准的计划内检查。没什么特别刺激的，但这毕竟算不上什么刺激的职业。”


    没什么新意了。“你说你负责接电话？”我问。“人们会为了健康违规的事打电话进来吗？”


    “偶尔会有，”她说。“但并不频繁。通常情况下，如果人们不喜欢某个吃饭的地方，他们就不再去了。或者他们直接给店里打电话投诉，指望能换来顿免费餐。他们很少为了诉求来找我们，但确实偶尔会发生。”


    到目前为止，一切都符合我的预料。“你知道为什么莱尔在他去世那天晚上会在 `Death by Java` 吗？”我问。我在试探，但抱有希望。总有人知道*些什么*。有时候只需要向正确的人提出正确的问题，然后砰地一下，一切都会迎刃解。


    贝利低下眼睛，快速画了一个十字，然后回答道。“我无法确定他那天晚上为什么特别去那里，但我可以说，最近他在那个市区的区域度过了异常大量的时间。”


    “他开了很多罚单，”我猜道。


    贝利点了点头。“似乎每天都有新的罚单。而且我*确实*收到了很多关于他常去的那两个地方的电话，所以我并不意外。”


    “`蒂托肉店` 和 `Death by Java`？”


    “就是那两个，”她说，指着我。“起初，我们会接到电话，莱尔会进去转完回来声称没那回事。我猜你们把那种电话叫恶作剧电话。我们偶尔会遇到这种电话。你知道那些小孩子是什么样的吗？有时候他们就是控制不住自己。”


    走廊里传来脚步声，然后又远去。我身体前倾，静默默地催促贝利继续说。


    “所以，有一天，电话停止了，”她说。“就像开关被关掉了一样，但奇怪的是，从那时其他事情开始发生了。”


    “你什么意思？”


    “电话可能停止了，但随后违规行为开始冒了出来。”


