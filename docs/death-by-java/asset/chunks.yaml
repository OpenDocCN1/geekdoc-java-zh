    of my vacation, stress-free.


    Death by Java was struggling. Lyle Carrigan, the health inspector, had been threatening
    to cite them for violations. Valerie had thought Lyle was harassing her. Tito
    thought the same thing with regard to his own business. Mickey didn’t like it,
    and he all but threatened Lyle in front of everyone. Even Marco knew about it.


    And then, Lyle was killed, and his body was left at Death by Java. No sign of
    forced entry. No sign of struggle. Just a screwdriver and a dented ice machine,
    both of which might not have had anything to do with the murder. Add to that Mickey’s
    hand injury and Tito’s seeming glee that Lyle was dead, and I had two prime suspects.
    Marco believed Mickey was responsible, and honestly, based on what I’d seen thus
    far, I had to agree with his assessment.


    But none of it was proof. Not the injured hand, not the threats, not even Mickey
    showing up outside Death by Java, looking nervous, after the body was found.


    I drummed my fingers on the armrest of the couch, causing Dad to look up from
    his tablet.


    “Everything okay, Buttercup?”


    “I—”


    My phone buzzed, causing me to jump. Thinking it might be Paul, I snatched it
    up from the end table and answered without looking at the screen.


    “Krissy, I don’t know what I’m going to do.”


    “Lena?” I glanced at Dad, who shrugged before turning back to his tablet. “What’s
    going on?”


    Lena sighed heavily into the phone. “This was stupid. I shouldn’t have called.
    You’re on vacation. I’m being dumb and worrying over nothing and—”


    “Lena, it’s okay. I’m just sitting here watching TV at the moment anyway. What’s
    wrong?”


    “It’s this job.” Lena Allison was once a full-time Death by Coffee employee, but
    she had recently started working with the police in the hopes of becoming an officer
    of the law and making a difference for those typically—and wrongfully—deemed as
    trouble. I assumed the call had nothing to do with my bookstore café, where she
    worked when she had free time, but I couldn’t be positive. “I think I’m screwing
    everything up.”


    “I’m sure it’s not that bad,” I said.'
