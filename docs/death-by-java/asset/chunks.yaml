    Valerie did her best to withstand it. She stared at the tops of her fancy shoes
    for a couple of long seconds before wilting. “Robbins. His name is Mickey Robbins.”


    There was no satisfaction in Detective McKensie’s voice when she said, “Where
    was Mr. Robbins last night?”


    Before Valerie could answer, the door opened, and Officer Peel poked his head
    inside. “Detective. There’s a cop out here. He says he wants to talk to you a
    moment.”


    `McKensie`’s eyes never left Valerie when she said, “Send him in.”


    Peel` hesitated, twitching mustache signaling his annoyance, before he vanished
    back out the door.


    “Mickey’s innocent,” Valerie said. “He was with me all night.”


    Even *I* didn’t believe her, and I wasn’t trained to detect lies. Valerie was
    just really bad at lying. Her eyes darted around the room, and her voice fluctuated
    in pitch. Maybe they weren’t telltale signs of deception, but they sure did make
    her look like she wasn’t telling the truth.


    The door opened behind me. I expected another Redwood Village police officer to
    enter, but instead, Paul Dalton walked through the door, dressed in running shorts
    and a tank top.


    Detective `McKensie` seemed as surprised as I was when she saw him. “You are?”


    “Officer Paul Dalton,” he said, brushing a hand against my arm as he stepped forward,
    a hand extended. “Pine Hills Police Department. I know this isn’t my jurisdiction,
    but I wanted to stop in and see if I could be of any assistance.”


    “I take it Pine Hills is in Ohio?” `McKensie` said. “You’re the aforementioned
    boyfriend?”


    Once again, I was surprised by how quickly `McKensie` caught on. “He is.”


    Paul’s smile was as charming as ever. “It is. And I am. Is Krissy in trouble?”


    Detective `McKensie` smiled. “No. She’s free to go, though I’d appreciate it if
    she left her contact information with Officer `Peel` outside, just in case I have
    any follow-up questions.”


    Relief washed over me. “We’ll get out of your hair—”


    “Actually,” `McKensie` said, cutting me off. “I’d like to talk with Mr. Dalton
    here for a few minutes.” She motioned toward the door. “You can wait for him outside.”


    An objection was on the tip of my tongue. Paul knew less than what I did. He was
    only here now because he’d been out on a run and had seen the commotion. He’d
    probably spotted Dad’s car, or Dad himself, and come over to investigate. And
    then, upon hearing that I was inside, talking to the police, he’d come in make
    sure I was okay.


    *Or make sure I wasn’t getting myself pulled into a murder investigation.*


    “Go ahead,” Paul said. “This should only take a few minutes.”


    Still, I hesitated. I wanted to know what Detective `McKensie` was going to ask
    Paul, if she was going to verify my story, or if she was going to try to poke
    holes in it. Paul was right; this wasn’t his jurisdiction, so why would she want
    to talk to him? He couldn’t help her. He wasn’t a cop here.


    Then again, neither was I. I wasn’t a cop *anywhere.*


    “I’ll be with Dad,” I said. I took his hand, squeezed, then headed for the door.


    Dad was waiting for me in a vastly thinner crowd. “Everything okay?” he asked.


    “Not really.” I crossed my arms and tapped my foot, too nervous to stand still.
    I kept my voice low when I asked, “Do you remember that health inspector? The
    one who was here that first day?”


    “I do.” A beat, and then, “It was him?”


    “Yeah. I don’t know what happened, but the detective inside is acting like it
    was *murder*,” I practically whispered the word, but it caught the attention of
    those nearby, who immediately started gossiping.


    Movement from near Tito’s caught my attention. I expected to find Tito had come
    back outside or perhaps one of his employees had stepped out to get a look at
    the excitement, but it was neither.


    It was Mickey Robbins.


    “Dad …” I whispered, nodding toward where Mickey was standing.


    “I see him.”


    Mickey was craning his neck to see inside `Death by Java`, but he wasn’t moving
    close enough to where Officer `Peel` would notice him. In fact, he was doing his
    best to look inconspicuous to *everyone*, despite his clear nervousness. He was
    rubbing at his right hand with his left, which, at first, I took for a nervous
    gesture, but then I quickly realized it was more than that. A bandage was wrapped
    around the knuckles of his right hand. And I couldn’t be sure, but it appeared
    as if the fingers of that hand were swollen, as if he’d punched something hard
    enough to break a bone or two.


    Mickey watched the scene for a good minute, maybe two. And then, with a quick
    look around to make sure no one had seen him, he slipped quietly away.


    # 6


    “Are you okay, Buttercup?”


    I frowned down into my coffee, irrationally wishing I had the spiced chai tea
    I’d recently grown accustomed to drinking. The bubbles created by the chocolate-chip
    cookie I’d placed into my chipped coffee mug before pouring were long gone, and
    a few soggy crumbs had floated to the top. The chip in the mug, Dad claimed, was
    symbolic. He said it reflected how in life, even something damaged could still
    be of use. In reality, he’d always been careless with the dishes and the low-hanging
    faucet.


    “I take it Pine Hills is in Ohio?” `McKensie` said. “You’re the aforementioned
    boyfriend?”


