    \n“我猜瓦莱莉可能不是那些朋友之一。”\n\n我冷哼了一声，再次闭上眼睛。“不太可能。我觉得她只进过一次那房子，也许是两次。我在高中的西班牙语课上和她搭档，为了某个愚蠢的比赛得做辣椒酱。她出现了，眼睁睁地看着我完成所有的工作，还不停地批评我。”\n\
    \n“你赢了吗？”\n\n“没有。获胜的辣椒酱没法吃。他们用了能找到的最辣的辣椒，这意味着它得了所有的票，因为那让萨拉泽先生病了。”\n\n“意料之中。”他咯笑道，然后严肃起来。“那么，睡觉安排是怎样的？”\n\
    \n我没看他，拍了拍床。“大够两个人睡。”\n\n停了一片刻。“你不觉得我应该睡地板上吗？或者在另一个房间？我不介意睡沙发。”\n\n“爸爸不会答应的。如果你不想睡在我身边……”\n\
    \n“噢不，我愿意。我只是……”\n\n“我明白。对我来说也很奇怪。”尽管我已经够大了，本不该如此。这是我住在这里从未从未过真正的男朋友所付出的代价。这让睡在某人身边这么简单的事情变成了一种新体验，一种让我感到奇怪紧张的体验。\n\
    \n“浴室在哪里？”保罗问。“我觉得我需要洗洗脸。”\n\n“右边第一扇门，”我说，朝那个方向比了一个模糊的手势，然后直起身看向他。“你还好吗？这对比你来说不会太过了吧？”\n\
    \n“我很好。”他的笑容里带着一丝不确定。“只是紧张。”\n\n“别紧张。你知道爸爸和劳拉爱你你。”\n\n“我知道。我只是不想引起任何麻烦。”\n\n“你不会的。”\n\
    \n“睡个好觉我就会过去的。”他俯身吻了吻我的额头。“我马上回来。”说完，他溜出门门，轻轻地关上了门。\n\n他一走，我立刻掏出手机拨通了电话。\n\n“嘿，克西，”维基说道，听起来气喘吁吁的。“我猜你顺利到了？”\n\
    \n“平安无事。“死亡咖啡店’那边怎么样？”\n\n沉默了一下，然后接着说：“很好。梅森看过了——”\n\n我没忍不住；呻了一声。\n\n“别冲我呻。他想干活的时候还是挺能干的。”\n\
    \n“抱歉。”我起身时咕囔道。“刚才的呻不是因为我以为梅森没能力修理任何东西。我的床正试图吃了我。”\n\n“你话里好像有个笑话，我就不计了，”维基说道。“幸好梅森没听到你这么说。”\n\
    \n“噢，我很庆幸。”停顿了一下，然后我问：“他发现了什么？”\n\n“与其说是他*没*发现什么。灯又灭了，既然梅森当时在场，而且他带着工具，他就去看了一下。他没发现任何问题。所有该亮的地方都亮了，其他一切也都检查过了，无论那是什么意思。我又给电工打了了电话，得到的还是那套托词，谁知道他们什么时候才会来。”\n\
    \n“如果会来的话。”\n\n“我知道。已经三天了，而且似乎变得更糟了。有些不对劲，我担心哪里有短路，如果不处理，最终会引发火灾。”她发出了沮丧的声音。“我甚至不知道这是否可能。我跟街上的其他几个店主聊过，他们没一个遇到问题，所以似乎只局限于我们这地方。”\n\
    \n“你觉得我们应该关门营业吗？”我问，害怕得到那个答案。关门意味着没有生意。没有生意就意味着很难付账单，特别是如果那个电工——一个以慢得像冰闻名的男人——一直拖延不把我们排进日程表。”\n\
    \n“还没。我正在密切关注。而且，你在加利福尼亚。你不应该担心这些。”\n\n“我知道，但是——”\n\n“没有可是。玩得开心点。如果你想惩罚自己，去跟我父母打个招呼。我确定他们有很多话要对你说。”\n\
    \n我笑了。“我打赌。”维基的父母，吉娜和弗雷德里克·帕特森，怪维基没有选择通过拍低预算电影来走他们的后尘，他们并不怕让我知道这一点。“我想我该走了。”走廊尽头，浴室的门吱的一一声开了。“我过两天再回来联系你。”\n\
    \n“你那样做吧。希望那时我有消息。”\n\n就在保罗回来时，我挂断了电话。劳拉紧跟在他后面，穿着跑步短裤和无背心。\n\n### 与保罗的对话\n\n“噢，好吧，那小聚会只有维基和另外几个人。”我想奇那些高中老同学可能在哪里，他们的生活过得怎么样。据我所知，他们还住在村子里，尽管我并不确定。我跟维基读的是同一所大学，所以我们一直保持着联系，但我的其他朋友选择了不同的道路。在那个年代，没有现在这种先进的手机和社交媒体，保持联系并不容易，所以我们慢慢地疏远了。\n\
