    # 1


    Warm sunlight streamed in through the car’s window, and I basked in a glow that
    was both familiar, and yet, strangely foreign. I closed my eyes against it, letting
    the busy world vanish as I leaned against the glass in the back seat. Yes, I knew
    the sun was the same one that gave light to Pine Hills, Ohio, where I lived, yet
    it felt somehow more special here in Redwood Village, California, where I’d grown
    up.


    A buzz of conversation filled the car, yet I’d tuned it out ever since I’d climbed
    in, just wanting to enjoy a few moments of quiet now that I was no longer trapped
    on a plane. The stress of the last few days was slowly bleeding away, though I
    knew the peace would be short-lived. Concerns about fluctuating power at my bookstore
    café, Death by Coffee, along with the fact that I was going to be staying with
    my dad and his girlfriend in my childhood home with my boyfriend, Paul Dalton,
    at my side would soon have my anxiety skyrocketing.


    But right then … peace.


    “What do you think, Krissy?”


    “Hmm?” I reluctantly opened my eyes. Paul was regarding me from where he sat buckled
    in, deep blue eyes sparkling in the sun.


    “Were you asleep?” he asked.


    “No.” I stifled a yawn. “Just relaxing.”


    “She’ll sleep like the dead for about eight hours once we’re at the house,” my
    dad, James Hancock, said from the passenger’s seat up front. I couldn’t see his
    eyes to know if they were sparkling, but his bald head sure was.


    Next to him, his girlfriend, Laura Dresden, nodded. I couldn’t see her face since
    I was sitting directly behind her, but I could *feel* her grin. “The last time
    she was here, we were afraid she might sleep through the entire weekend.”


    “Ha-ha.” I stuck out my tongue, though nobody could see it. “I’m not that bad.
    Travel wears me out.”


    Paul took my hand and squeezed. There was a nervousness in his smile. While he
    knew Dad and Laura from their visits to Pine Hills, this was the first time he’d
    traveled with me to my hometown. It was a part of my life he’d only heard stories
    about.


    Redwood Village—simply called the Village by those of us who lived there—seemed
    massive compared to a small town like Pine Hills, but it was still just a cozy
    little town, sitting just outside of the much bigger Los Angeles. In the years
    I’d been gone, the Village had grown by leaps and bounds, filling up with small
    businesses and more and more housing developments so that I was beginning to worry
    they’d have to change the name to something that reflected the growth. Redwood
    City just didn’t have the same ring to it.


    My phone buzzed in my lap. I glanced at the screen, then turned it back over again
    without answering.


    “Rita?” Paul asked.


    I nodded. “She wants me to call her as soon as I get to the house.”


    “That’s, what now? Twelve texts?”


    “Since we’ve arrived.” Another ten had awaited me when we’d landed. To say Rita
    Jablonski wasn’t happy about me leaving her behind was an understatement. She
    was a self-proclaimed James Hancock number-one fan, and I wouldn’t be surprised
    if it was the truth. Dad wrote mystery and thriller novels for a living, and Rita
    had read every last one of them at least five times. She’d wanted to come along
    so she could pick Dad’s brain about his latest book, but I’d refused. These next
    two weeks were for me, Paul, Dad, and Laura. I’d let nothing else get in the way
    of that.'
