    Hugh and Aaron shared a look, and then, like the aforementioned abandoned puppies,
    they sulked their way out the door.


    “Men,” Valerie said with a roll of her eyes. “So, which beach are we going to?”


    Before I could answer, Valerie’s phone rang. She held up a finger to me and answered
    the phone with a terse, “What is it?” A moment of silence followed. “Are you sure?
    You can’t—” Another stretch where I could vaguely hear a raised voice that sounded
    female, but it was hard to tell since it was so faint. “Okay. I’ll be there.”
    She clicked off and turned back to me, an apologetic expression on her face.


    My heart sank. “You’re not taking me to the beach.”


    “I will!” Her face scrunched up. “But not right away. That was Dee. There’s an
    emergency at Death by Java that needs my attention right away. It can’t wait.
    I promise that once it’s taken care of, I’ll drive you to wherever you want to
    go.”


    I considered telling her not to worry about it, that I’d just call an Uber, but
    the fact that it was an emergency at Death by Java—which, as far as I knew, was
    closed while the investigation was ongoing—had me curious enough that I thought
    that I could spare a little more time. Paul and Dad would understand.


    “Sure,” I said. “And if there’s anything I can do to help …”


    Valerie flashed me a smile that was just shy of condescending, then she started
    down the hall. “Let me grab my bikini, and then we’ll be on our way.”


    # 11


    It took me a moment to recognize Dee as Valerie and I pulled up in front of Death
    by Java. She was standing at the doors, wearing jeans and a black T-shirt, and
    looking the part of a normal, worried woman. There wasn’t a pink dress in sight.


    “I hope this doesn’t take too long,” Valerie said as we climbed out of her car.
    She was wearing loose shorts and a tank top that hung so loose, it didn’t hide
    much. Her bikini was on beneath that, and it might as well have been the only
    thing she’d worn considering how little the rest of her outfit covered. “I really
    would like to get to the beach soon.”


    Dee waited for us by the doors. She was wringing her hands together and kept looking
    through the glass. As soon as we reached her, she said, “I can’t get to Oscar!
    He’s trapped in there and I can’t get in, and I don’t know what’s going to happen
    to him.”


    “Calm down, Dee,” Valerie said as we joined her. “It’s just a cat.”


    That, of course, didn’t sit well with Dee—or me, for that matter. We both shot
    Valerie a glare that would have sent her scurrying for cover if she hadn’t been
    too busy searching for her keys in her purse to notice.


    “I should have been here this morning,” Dee said. “I should have at least checked
    in on him and made sure he was taken care of.” She paced away, came right back.
    “When I realized that no one else would think to feed him, I drove over, and no
    one was here! What’s going on? Did something happen? Did that health inspector
    close us down?” Panic caused the volume of her voice to rise.


    “It’s a long story,” I said as Valerie finally produced her keys. No sense in
    scaring Dee with tales of murder. “You take care of the cat?”


    Dee nodded. “His name is Oscar. He was a stray, but since Valerie was letting
    him stay, I figured I could take care of him. I’m not allowed to have a cat at
    my place. I’m renting, and pets are a no-no, so this felt like the perfect solution.”


    Valerie unlocked the door and pushed it open. “Go on in and get him,” she said.
    “Just don’t go into the back room.”


    “I’m sorry I dragged you out here,” Dee said before she slipped inside, already
    calling Oscar’s name.


    Valerie rolled her eyes as she let the door swing closed. “I really hope she hurries.
    I need at least two hours of good sun to even start to tan.” She gave me a smile
    that was just this side of condescending. “Not that *I* need much in the way of
    a tan.” Her eyes dropped to my legs, then back to my face.


    I ignored the implied jab about my glaringly white complexion and asked, “Are
    you planning on adopting Oscar and getting him acclimated to people?”


    “What?” Valerie made a face. “No. He was living in the alley before he snuck into
    the shop one day. Smells like an alley cat too.” She shuddered in disgust. “But
    since he was here, and you let a cat live in *your* bookstore, I figured, why
    not let him stay?”


    I could have told her that Trouble, the cat who “lived” in Death by Coffee, was
    Vicki’s cat, and he didn’t actually live there. Vicki brought him in when either
    she or her husband, Mason, were working, often letting him stay until closing
    time. And, unlike Oscar, he didn’t attack the customers. He typically just lounged
    around somewhere upstairs, usually on a bookshelf, and rarely caused trouble.


    “Do you remember seeing Oscar when the police were here?” I asked, because I sure
    didn’t. “You’d think all the commotion would have spooked him.”


    “I didn’t pay attention,” Valerie said. She tapped her foot and peered in through
    the doors. “I’m not sure why Dee is so worried. Oscar can take care of himself.
    I mean, he gets let out to take care of his business and someone usually lets
    him back in. Since no one was here, though, he’s probably out doing cat things
    around town.”


    “What if he’s stuck inside?” I asked, trying to keep the annoyance out of my voice.
    “He would need water and food. And unless you want him to ‘take care of his business’
    all over your floor, he’d need someone here to let him out. Or be given a litter
    box.”


    Valerie’s nose scrunched. “Ew. Those things stink.”


    They did, but if you wanted a cat, it was a necessity.


    Before I could explain the finer points of cat ownership to Valerie, Dee came
    sprinting out the door. “He’s not in there!”


    “See?” Valerie said. “There was no need to worry.”


    “But he hasn’t eaten.” Dee reached into the pocket of her jeans and removed a
    small can of cat food, sealed with a rubber lid. “I don’t want him eating scraps.
    He’ll get worms!” By the looks of him, I wasn’t so sure he didn’t have them already.


    Exasperation flashed across Valerie’s face. “He’ll be fine.” She turned to me.
    “Shall we go?”


    One look at the desperation on Dee’s face, and I knew there was no way I could
    abandon her here, worried about Oscar.


    “Do you want me to help you look for him?” I asked her.


    “Really? Yes, please!” Dee practically dropped to her knees thanking me. “He can’t
    be far. He always sticks pretty close when he goes out, but I didn’t see him when
    I showed up, and I looked.”


    Valerie sighed audibly. “Do we really have time for this?”


    “It shouldn’t take long,” I said, tamping down my annoyance. “If you keep an eye
    out here, you can text me if Oscar shows up. I have my phone on me.”


    Another Valerie eye roll before, “Yeah, sure. Whatever. I’ll be inside.”


    And with that, she turned and pushed her way into Death by Java, where I assumed
    she’d sit at one of the chairs and scroll through her phone until we returned.


    “Where do you want to start?” I asked, turning to Dee.


    She thought about it a moment, then started walking. “He might be in the alley.
    He wasn’t there earlier, but he could have shown up since. Thanks again for this.
    I know you don’t have to.”


    “It’s my pleasure.”


    We rounded Death by Java and made our way toward the alley. Dee’s head was on
    a swivel as she looked for Oscar, and she kept fingering the can of cat food,
    which she’d returned to her pocket. Gone was the pink dress–wearing snob I’d taken
    her to be. In its place was a woman who seemed genuinely concerned for a cat that
    most people would dismiss because of how scraggly and mean he appeared. That raised
    my opinion of her quite a bit.


    We reached the alley and had a look around, but no Oscar. Dee frowned, looked
    both ways, then turned and led the way past Tito’s, making those kissing sounds
    that always seemed to attract cats.'
