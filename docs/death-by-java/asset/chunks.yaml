    “You’re sick?” I asked, glancing around the apartment. The furnishings were sparse,
    but nice enough. The TV was on and muted. A box of `Kleenex` sat on the coffee
    table, with a balled-up tissue sitting beside that.


    There was a slight hesitation to Nadia’s response. “Yeah. Sure.” Nadia walked
    past me and resumed her place on the couch. She picked up the tissue and dabbed
    at a nose that looked dry, though her eyes were red-rimmed and worried.


    “Nadia,” I said, motioning for Dad to follow me into the living room, where she
    was seated. “I talked to `Aaron.”


    She blinked at me. “Okay, so?”


    “He said you two were …” I didn’t know how to finish without sounding rude, so
    I just waved my hand vaguely toward her.


    That earned me a massive eye roll. “Banging? People do that sort of thing.”


    Dad snorted from behind me.


    I ignored him. “You know he used to be married to `Valerie`, right?”


    “Duh.” Another eye roll. “I’m not stupid, you know. But they aren’t together now,
    and it’s not like I plan on moving in with him or anything.” She seemed to relax.
    “If that’s what this is about, you can go. I don’t have to talk about my relationships
    with you.”


    “No, you don’t, but—”


    “You know”—Nadia stood—“I think you `should` go. I shouldn’t have let you in.”


    “Aaron—”


    “Is none of your business.” She crossed her arms and tapped a bare foot. “I asked
    you to leave. Don’t make me call the super.”


    I imagined a man with sparse, slicked-back hair, with a thick golden chain around
    his neck hanging down into an open shirt sprouting with chest hair, then dismissed
    the thought. “I—”


    “May I use your restroom?” Dad asked, cutting in. “I really do hate to impose
    on you like this, but …” He rested a hand on his belly. “I am lactose intolerant,
    and I made the mistake of grabbing a milkshake before we came over. The bloating
    is killing me, and if I don’t relieve it soon …”


    “Okay, ew.” Nadia’s already-pale complexion tinged green. “First door on your
    left. Make it quick. And, like, use the spray when you’re done. It’s sitting on
    the back of the toilet.”


    “Thank you.” Dad shot me a wink that only I could see before waddling down the
    hall like he was, indeed, about to explode.


    We both watched him go before turning to face one another.


    “Nadia,” I said, putting on my kindest, gentlest voice, “I didn’t come here about
    `Aaron`


    She blinked at me. “Okay?”


    “You were at `Death by Java` on the night of `Lyle Carrigan`’s death.”


    Nadia sucked in a breath, hand going to her chest. “I … I don’t know what you’re
    talking about.”


    “Lyle` and `Marco Rossi` were working together,” I said. “They were trying to
    get `Death by Java` and `Tito’s Deli` closed so that `Marco` could move the Italian
    Roll to the new, better location.”


    “Why are you telling me this?” she asked, though by the way her eyes darted around
    the room, I could tell that she knew exactly why I was saying it.


    I pressed on. “Tito told me he had to fire one of his employees because health
    violations kept cropping up every time that employee worked a shift. Once the
    employee was gone, the violations stopped.”


    Nadia took a step back. “Really. I don’t know—”


    “You were working with `Lyle`,” I said, cutting her off. “You were sabotaging
    `Death by Java` for him.”


    I expected another denial, but Nadia’s expression hardened. “So? It’s not like
    I’d be missing much if the place closed. Look at this place.” She flung a hand
    toward her sparse furnishings. “I can hardly afford a pizza with what `Ms. Kemp`
    is paying me.”


    “What happened?” I asked, keeping my voice steady despite how my nerves were jumping.
    “That night. You told `Aaron` you had something to do at `Death by Java`, which
    is why he was waiting for you there.”


    She sighed. “I was dumb. I didn’t mean to let it slip.”


    “But you did. Did he catch you meeting with `Lyle`?”


    “What? No. `Aaron` left before `Lyle` showed up, I made sure of it.” Her look
    of defiance started to waver. “But when `Lyle` did get there, he was … different.”


    “Different how?”


    Down the hall, the door cracked open ever so slightly, telling me that Dad was
    listening to everything we were saying. Good.


    “He …” She frowned. “He didn’t want to do it. I never sabotaged anything. All
    I was supposed to do was unlock the door and let `Lyle` in when he showed up.
    He’d do his thing, I would lock up, and that would be that. I mean, the night
    before he died, he was fine.”


    A light bulb clicked on in my head. The night when Laura and I had seen the light
    on in the back, Lyle was sabotaging the ice machine so he could show up the next
    morning and cite Valerie for it.


    “He promised no one would get hurt,” Nadia went on. “And that I wouldn’t get into
    trouble because no one else would know about it. Then, when `Death by Java` closed,
    `Marco` would give me a job at a higher wage than what `Ms. Kemp` was paying me.
    I could move out of this apartment, get a real place, and stop having to scrape
    by.”

