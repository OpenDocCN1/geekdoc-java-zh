    “He promised no one would get hurt,” Nadia went on. “And that I wouldn’t get into
    trouble because no one else would know about it. Then, when Death by Java closed,
    Marco would give me a job at a higher wage than what Ms. Kemp was paying me. I
    could move out of this apartment, get a real place, and stop having to scrape
    by.”


    “What happened that night, Nadia?” I asked. “When Lyle died?”


    “I don’t know!” she all but wailed. “He showed up, and I unlocked the alleyway
    door for him like I always did. He was already acting weird when he got there,
    and as soon as the door was open, he changed his mind about the whole thing. He
    told me to go home, that he’d take care of everything. He apologized to me, said
    that he was sorry he’d dragged me into it. I wasn’t sure what to think, so I just
    left him there. I didn’t know someone would come in and *kill* him!” Tears formed
    in her eyes.


    “Did you see anyone else there that night, other than Aaron?” I asked. “Tito from
    next door? Valerie? Mickey? *Anyone?*”


    She shook her head. “It was just the two of us.” A pause. “Wait. When I was leaving,
    I heard him making a call.” Her eyes met mine. “He called Marco.”


    Before I could press her about that, the front door of Nadia’s apartment opened,
    and Marco Rossi entered. “I think that’s enough, Nadia,” he said, closing the
    door behind him with a *click*. He then turned the dead bolt before flashing a
    smile void of humor onto me. “You are a very annoying pest, aren’t you?”


    “Marco, I—”


    “No, no. No more talk. Move over there, please.” He motioned toward the couch,
    where Nadia had already retreated to. When I didn’t move, the smile vanished.
    “Now.”


    There was such menace in his voice, I complied.


    Marco stepped farther into the room, took a moment to look around. “Just us, then?”
    When neither Nadia nor I responded, he nodded. “Good. I really wish it hadn’t
    come to this, but here we are. I’d hoped that this whole thing would blow over,
    and it would have, but *you*”—his eyes met mine—“just had to keep asking questions.”
    He sighed, moved his hand to the small of his back, where I assumed he had a gun.


    My mind was racing. It took every ounce of willpower not to look down the hall
    toward the bathroom, where Dad had gone. If there was any way out of this situation,
    it was going to be through him.


    But I needed to buy time. The best way to do that? With my mouth.


    “You killed Lyle Carrigan,” I said. “Why? He was working for you, helping you.”


    Marco’s face contorted, and for a moment, I thought he might whip out the gun
    and shoot me right then and there. After a moment, his features eased, though
    his smile didn’t return. “He was, but then he got cold feet, thanks to Tito firing
    his other assistant. Lyle was afraid Tito had discovered what was happening and
    that he’d tell someone. He was afraid he’d lose his job, his reputation.” He scoffed.
    “Coward.”


    “But why kill him?” I pressed. “If he was so afraid of getting caught, you could
    have let him go, found someone else.”'
