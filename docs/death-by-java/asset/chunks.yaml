    and our food arrived. We talked and laughed. I told them of my life in Pine Hills,
    of Paul, and how Vicki was doing. Larissa told me of her two marriages, both of
    which were now in the past and, in her words, “Good riddance.” Renee spoke of
    her life, how she realized that she had no interest in marriage or relationships
    at all. We talked of life and everything after.


    It was one of the best half hours of my life.


    Then, as the joy of seeing each other again slowly bled away, the conversation
    shifted. Not all at once, but slowly, toward the one thing—the one *person*—we
    all knew was inevitable to bring up.


    “I hear you’ve been hanging around with Valerie Kemp,” Renee said, mild disapproval
    in her voice.


    I tried not to take it as an accusation, but with our history with Valerie, I
    couldn’t help it. “I’m not hanging around her because we’re friends,” I said,
    before explaining how she’d asked me to help her failing business. “I kind of
    feel bad for her,” I finished. “She’s trying, but she’s still, well, *Valerie*.”


    “Tell me about it,” Larissa said. “I ran into her about a month ago, and she couldn’t
    help but hit me with one of those insults of hers. You know the kind.”


    “You mean the insult she *thinks* is a compliment,” Renee said with a shake of
    her head. “I’m pretty sure we’ve all been the target of those more than enough
    for one lifetime.”


    Larissa nodded. “I’ve tried to get along with her, but it’s impossible. You must
    be a saint to be willing to help her out, of all people. She was really hard on
    you back in school, Krissy.”


    I shrugged, somewhat embarrassed. “I try to leave the past in the past,” I said.
    “Though, to be fair,” I repeated, “she’s trying.”


    “I heard someone was killed at her place,” Renee said.


    Before I could confirm it, Larissa said, “Lyle Carrigan.”


    “You knew him?” I asked.


    “Not well,” Larissa admitted. “But we crossed paths when I was jumping from job
    to job. I think it was about a year back that we worked together at the health
    department. Might have been two years, actually. You know how times flies.”


    Boy, did I ever. “*You* were a health inspector?” I asked with a laugh. “You used
    to eat cheese off the floor!”


    “Hey!” Larissa said with mock offense. “That piece of cheese fell under the three-second
    rule. And it was *your* kitchen floor, and I knew for a fact that your dad had
    mopped it earlier that day because he always cleaned like a maniac when we were
    coming over to spend the night.” She sobered. “But no, I wasn’t a health inspector.
    I answered the phones.” She made a face. “Not glamorous, but it was a job.”


    “I’m sometimes jealous of her,” Renee said.


    “Right.” Larissa rolled her eyes. “You have a solid job, where you get to make
    your own hours and get paid pretty well, while I bounce from job to job, hoping
    it sticks for more than a month or two.” She waved Renee off good-naturedly. “But
    yeah, I knew Lyle. We used to get drinks with one another every now and again.
    Nothing romantic, mind you. He was married, and at that point, I wasn’t looking
    for husband number three.”


    “It’s sad what happened to him,” Renee said. “Lyle, I mean, not lucky number two.”
    She turned to me. “You should have met Cody. You’d wonder if it was possible to
    have a negative IQ score once he opened his mouth.”


    Larissa snorted. “He had his moments, that’s for sure.” She shook her head, moved
    on. “Lyle was a decent guy. He let people push him around a bit much for my liking,
    but who am I to talk?” She poked at the remains of her steak. “When I heard he
    was murdered, I’d like to say I was shocked, but to hear it happened at Valerie’s
    …” She *cluck*ed her tongue as Renee nodded.


    I looked from her to Renee and back again. “I take it you know something about
    what happened?” I asked when neither spoke up.


    Larissa continued poking at the meat, causing the last of its juices to ooze onto
    her plate. “I don’t *know* anything for certain. But …” She glanced at Renee,
    who motioned for her to go on. “You know Valerie was married to Aaron Middleton,
    right?”


    “I do. And then they divorced.”


    “He cheated on her, and I’m pretty sure she did the same to him. I don’t think
    any of us were surprised about that.”


    “Not in the slightest,” Renee said.


    “She moved on to a guy named Hugh,” Larissa went on. “I’ve seen him around, seen
    the two of them together. They broke up too.”


    “Probably for the same reason,” Renee added.


    “It’s a Valerie thing, right? And now she’s with Mickey Robbins.”


    “Do you know him?” I asked, scooching to the edge of my seat in barely suppressed
    excitement.


    “I don’t, but Renee does,” Larissa said.


    I turned to Renee, who was frowning and staring off into space. There seemed to
    be some sort of internal battle going on inside of her, one that eventually resulted
    in her speaking slowly and quietly, as if she was afraid someone might overhear.


    “Mickey has been in trouble before,” she said. “I didn’t represent him, but I
    know of him and his case. You know how people talk?” She scratched at her ear.
    “Now, don’t quote me on this, and don’t ask where I heard it, but let’s just say
    the fact that Lyle Carrigan ended up dead somewhere Mickey Robbins frequents doesn’t
    come as a surprise to those of us who know about Mickey’s past.”'
