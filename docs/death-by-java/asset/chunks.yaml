    “So, one day, the calls up and stopped,” she said. “It was like a switch was flipped,
    yet oddly, that’s when other things started happening.”


    “What do you mean?”


    “The calls might have stopped, but then the violations started cropping up.”


    *That’s when the deal was struck.* “Lyle was the only one to handle these violations?”
    I asked.


    Bailey nodded. “Daily, too.” She leaned in closer, as if sharing a deep, dark
    secret. “I suspect that whoever was making those calls up and decided to cause
    a little more havoc by actually messing with the places. Two respectable businesses
    don’t just up and start falling apart like that so suddenly. It was all poor Lyle
    could do to keep up with it.”


    “Did anyone else go in and confirm the violations?” I asked. “To verify that they
    were justified?”


    Bailey sat back, hand to her chest. “Why would someone need to do that?” Her eyes
    widened. “You think Lyle was making it up? He wouldn’t have done such a thing!”
    She huffed, then, slowly, her brow furrowed. “No, Lyle wasn’t that type of man.
    If he said there was a health violation, then there was one.”


    “But do you think someone was sabotaging the businesses?”


    Bailey thought about it, then spread her hands. “I suppose we’ll see, now, won’t
    we?”


    “What do you mean by that?” I asked.


    “Like I said, Lyle was a good, honest man. He wouldn’t have reported something
    that wasn’t there, meaning there *were* actual violations. But if someone *was*
    going in and sabotaging these businesses, as you put it, and Lyle found out about
    it, he would have done something about it. Maybe even confronted the person responsible.”


    “And you think that whoever it was might have killed him for it?”


    Bailey’s jaw firmed, then trembled. “They must have. I mean, it makes sense, doesn’t
    it? Someone was causing trouble, and Lyle found out about it. He was too good
    of a man to want to get anyone into trouble, so he probably said something to
    them and …” She squeezed her eyes closed, and a single tear slid from beneath
    the lids before she opened them again and fixed me with a hard stare. “Whoever
    it was made a mistake, though.”


    “How so?” I asked.


    “It’s a simple thing, really,” she said. “Two businesses were involved in those
    calls. Two businesses were at the center of Lyle’s sudden spike in reported violations.”
    She squared her broad shoulders, then shook a finger at me as she finished. “So,
    it serves to reason that whoever killed poor Lyle Carrigan had to have access
    to both of those businesses, because how else could they have sabotaged them if
    they couldn’t get inside?”


    # 19


    I groaned as I kicked off my shoes and slouched down onto the couch. Dad, as he’d
    done countless times before in my youth, wordlessly scooped up my discarded sneakers
    and moved them out of the way of everyone else.


    “I’m going to take a shower,” Paul said with a stretch. “Unless you want to go
    first since you have that thing with your friends tonight?”'
