    “Someone died, I guess.” She yawned as if this sort of thing happened all the
    time. “Can’t see a thing.”


    “‘Died’?” I asked, my early dread turning into full-fledged panic. “Do you know
    who it was? How it happened?”


    The woman shrugged. “I just followed the crowd.” She glanced at her watch. “And
    now I’m going to be late for work. Just great.” She heaved a sigh, then turned
    and walked away. A couple of others followed, clearly bored with the lack of visible
    action.


    “I should go inside,” I said. “What if it’s Valerie?” My stomach clenched at the
    thought. No, we’d never been friends, but I didn’t want to see her dead. I didn’t
    want *anyone* to die.


    “How are you going to manage that?” Dad asked, nodding to the cop. “I don’t think
    he’s going to let you waltz on in.”


