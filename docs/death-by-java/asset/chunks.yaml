    and I reached the door, she was already holding it open for us.


    “The police have shut us down for the day,” she said as we entered. “Probably
    for a week. I don’t know what I’m going to do.”


    The dining room was empty but for the three of us. Death by Java coffee cups sat
    on most of the tables. I assumed the police had left them behind because customers
    sure hadn’t. Most of the cups were empty, but three at a nearby table were half
    full and still steaming.


    “Why are you here?” Valerie asked, crossing her arms as she regarded me. “Come
    to gloat?”


    “I wanted to check on you,” I said. “See if there was anything I could do to help.”


    “We’re concerned,” Dad added.


    Valerie blinked, dabbed a finger under her eye. “There’s no need to be concerned.”
    Her tone said otherwise.


    “Valerie—” I cut off as the bathroom door opened and two men came strolling out.


    I recognized Hugh, Valerie’s ex, immediately. A mop of blond hair hung down near
    his freckled nose. He had bronzed skin and a somewhat skinnier build for what
