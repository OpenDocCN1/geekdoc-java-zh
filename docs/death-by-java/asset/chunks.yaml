    “Yeah, well, the gaggle consisted of Vicki and only a couple of others.” I wondered
    where those other high school friends might be, how their lives were going. As
    far as I knew, they were still living in the Village, though I couldn’t be sure.
    I’d gone to the same college as Vicki, so we’d kept in touch, but my other friends
    had chosen different paths. Back then, without the fancy cell phones and social
    media we had today, it wasn’t as easy to keep in contact, so we’d slowly drifted
    apart.


    “I imagine Valerie wasn’t one of those friends.”


    I snorted, closed my eye again. “Hardly. I think she was in the house once. Maybe
    twice. We were partnered in my high school Spanish class and had to make chili
    for some silly competition. She showed up and watched me do all the work, criticizing
    me all the while.”


    “Did you win?”


    “No. The winning chili wasn’t edible. They used the hottest peppers they could
    find, which meant it got all the votes because it made Mr. Salazar sick.”


    “Figures.” He chuckled, then sobered. “So, what’s the sleeping arrangements?”


    I patted the bed without looking at him. “It’s big enough to share.”


    A beat. “You don’t think I should sleep on the floor? Or in another room, perhaps?
    I don’t mind the couch.”


    “Dad wouldn’t hear of it. If you don’t want to sleep beside me …”


    “Oh no, I do. It’s just …”


    “I get it. It’s weird for me too.” Though I was old enough that it shouldn’t have
    been. It’s what I got for never having a real boyfriend while living here. It
    made something as simple as sleeping next to someone a new experience, one I was
    strangely nervous about.


    “Where’s the bathroom?” Paul asked. “I think I need to splash some water on my
    face.”


    “First door on your right,” I said, making a vague gesture in that direction before
    propping up and looking at him. “Are you okay? This isn’t too much for you, is
    it?”


    “I’m fine.” His smile had an uncertain edge to it. “Just nervous.”


    “Don’t be. You know Dad and Laura love you.”


    “I know. I just don’t want to rock any boats.”


    “You won’t.”


    “I’ll get over it after a good night’s sleep.” He leaned over and kissed my forehead.
    “I’ll be right back.” With that, he slipped out the door, closing it softly behind
    him.


    As soon as he was gone, I fished out my phone and put in a call.


    “Hey, Krissy,” Vicki said, sounding out of breath. “I take it that you made it
    okay?”


    “Safe and sound. How are things at Death by Coffee?”


    A pause, and then, “Good. Mason had a look—”


    I couldn’t help it; I groaned.


    “Don’t groan at me. He can be handy when he wants to be.”


    “Sorry.” I grunted as I rolled to my feet. “That wasn’t a groan because I didn’t
    think Mason was incapable of fixing anything. My bed was trying to eat me.”


    “There’s a joke in there somewhere that I’m going to let slide,” Vicki said. “Just
    be glad Mason didn’t hear you.”


    “Oh, I am.” A beat, and then I asked, “What did he find?”


    “It’s more like what he *didn’t* find. The lights went out again, and since Mason
    was here at the time and he had his tools with him, he went ahead and had a look.
    He couldn’t find anything wrong. All the stuff that was supposed to light up lit
    up, and everything else checked out, whatever that means. I called the electrician
    again and got the same runaround, so who knows when they’ll show up.”


    “If ever.”


    “I know. It’s been three days, and it seems to be getting worse. Something’s not
    right, and I’m afraid there’s a short somewhere that will end up starting a fire
    if it isn’t taken care of.” She made a frustrated sound. “I don’t even know if
    that’s possible. I talked to a few other business owners on the street, and none
    of them are having any issues, so it appears as if it’s isolated to just our place.”


    “Do you think we should shut down?” I asked, dreading the answer. Shutting down
    meant no business. And no business meant it would be hard to pay the bills, especially
    if the electrician, a man known to be on the glacial side of slow, kept dragging
    his feet about fitting us onto the schedule.”


    “Not yet. I’m keeping a close eye on things. Besides, you’re in California. You
    shouldn’t be worrying about this.”


    “I know, but—”


    “No buts. Have fun. If you want to punish yourself, go say hi to my parents. I’m
    sure they’ll have a lot to talk to you about.”


    I laughed. “I’ll bet.” Vicki’s parents, Gina and Frederick Patterson, blamed me
    for Vicki not choosing to follow in their footsteps by acting in low-budget films,
    and they weren’t afraid to let me know it. “I guess I should go.” Down the hall,
    the bathroom door squeaked open. “I’ll check back in a day or so.”


    “You do that. Hopefully, I’ll have news by then.”


    I clicked off just as Paul returned. Laura was right behind him, dressed in running
    shorts and a tank top.


    ### The Conversation with Paul


