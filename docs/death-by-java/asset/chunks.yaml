    “Done.” Roman straightened and flipped his screwdriver into the air, catching
    it deftly before sliding it into his tool belt. “It shouldn’t give you no more
    problems.” He leaned against the ice machine. “I’ll stick around and make sure
    that it’s all running properly, of course. We can work out payment once you have
    a few minutes.”


    “Thank you, Roman,” Valerie said. She was looking away from me, but I’m pretty
    sure she winked at him before turning back to me with a frown. “So, you’re saying
    `I` have to clean up after the heathens because they’re too lazy to throw their
    own trash away?”


    “You or one of your employees,” I said. “It’s part of the job.”


    “I own the place, so that shouldn’t be on me,” Valerie said, voice going thoughtful.
    “But I could have my girls do it.”


    *That’s a start.* “Let me send you the list,” I said. “Have them work through
    it over the coming days, and I’m positive you’ll start to see an uptick in business.
    It might take time, but a little word of mouth should go a long way.”


    Valerie rattled off her cell phone number and email address. I added both to my
    contacts and then sent her the list I’d made. Then, I pushed open the door and
    led the way back to the front, with Valerie dutifully following behind. It was
    a minor miracle that she was listening to me, so I decided to point out a few
    of the more pressing issues.


    “Now, there is the issue of the cat. I—”


    “Krissy Hancock? Is that you?”


    I jerked to a halt at the vaguely familiar voice, causing Valerie to bump into
    me.


    “Holy crap, it *is* you. Guys! It’s Krissy from school.”


    Three smiling faces I thought I’d never see again were on the other side of the
    counter. It took my brain a moment to add the years since high school, but I quickly
    was able to put names to the faces.


    Bray Eckles still had a large mole over his left eye, which hadn’t detracted from
    his good looks when he was in his teens, nor did it now. Tamara Carey once had
    a supermodel body that had rounded out over the years, though she still dressed
    like she planned on walking the red carpet at any moment. And Bebe Long was, well,
    Bebe. She looked exactly the same as she had decades ago. Dark hair. Brown eyes
    that seeped sultriness. Flawless skin as smooth as glass.


    They were, in two words, Valerie’s crew.


    Instinct from years of verbal abuse had me wanting to flee into the back room.
    I wasn’t sure a single one of them had ever said a nice word to me before. Maybe
    there’d been a backhanded compliment or two over the years, much like the kind
    Valerie loved to deliver, but nothing genuine.


    “Krissy?” Tamara cocked her head to the side, clearly not recognizing me.


    “Yeah. Short Stuff,” Bray said. “You remember, right? We joked with her all the
    time.” He turned to me. “Had a barrel of laughs together. Isn’t that right, Krissy?”


    Joked *with* was *not* what they’d done, but I smiled and nodded. “Sure. I remember.”


    “Oh yeah,” Tamara said, looking me up and down. “You’ve really filled out over
    the years, haven’t you?”


    I bit my lip so hard, I very nearly drew blood. Yes, I’d been far skinnier in
    my high school days, but so had almost everyone I knew, Tamara included.


    “What are you doing back here?” Bray asked. “I thought you moved to Ohio with
    Vicki Patterson.”


    “Wait, they were dating?” This from Bebe, who’d barely been paying attention up
    to that point.


    “Nah, she was dating Robert Dunhill when she left,” Bray said, surprising me that
    he remembered since Robert and I met *after* high school. “They’re probably married
    by now.”


    “Actually—” Before I could tell them that Robert and I had broken up *before*
    I’d left, or that it was Vicki Lawyer now, the door opened, and Paul walked in.


    Seeing him was like a blast of cool, refreshing air. I hurried out from behind
    the counter and rushed over to him. When I grabbed his hand, I did so like a person
    desperate for saving, which, quite frankly, I was.


    I kissed him on the cheek before asking, “Where are Dad and Laura?”


    “They decided to walk back to the house, leaving the car to me.” He eyed the trio
    as he showed me the keys. Valerie, seemingly drawn by Paul’s appearance, rounded
    the counter to join her buddies. “Friends of yours?” he asked.


    “Of course, we are. From way back,” Bray said, smiling like he actually meant
    it. “Krissy was a lot of fun when we were younger.”


    *A lot of fun to pick on.* “Sorry, guys. I wish I could stay, but Paul and I have
    somewhere to be.”


    Both Bebe and Tamara didn’t appear to care, but Bray appeared disappointed. *Could
    he really think we were once friends?* I understood that not everyone was cognizant
    of their past behavior, but there was no way he could have forgotten the times
    I’d been close to tears due to their verbal abuse. Could he?


    “Ah, man,” he said with a shake of his head. “I was hoping we could catch up.”
    His eyes widened. “I know! How about you come to Hooties this Saturday night at
    like …” He looked to the others. When none of them jumped in with a suggestion,
    he looked to the others. When none of them jumped in with a suggestion, he looked
    to the others. When none of them jumped in with a suggestion, he looked to the
    others. When none of them jumped in with a suggestion, he looked to the others.
    When none of them jumped in with a suggestion, he looked to the others.

