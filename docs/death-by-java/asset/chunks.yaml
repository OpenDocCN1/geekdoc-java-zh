    She laughed. “Right. You guys leave, and Chief Dalton decides it’s time for me
    to take over some of Paul’s caseload. I’m paired with Becca, so it’s not that
    bad.” Becca Garrison was one of the local Pine Hills officers. I liked her, and
    I knew that her presence would have a calming effect on Lena. And Chief Patricia
    Dalton was Paul’s mom, as well as his—and Lena’s—boss. “But Detective Buchannan
    always seems to be lurking around every corner, watching my every move like he
    expects me to turn into one of the criminals I’m supposed to be chasing.”


    “No surprise there.” John Buchannan and I had a history that often involved him
    threatening to throw me in jail for poking my nose into his murder investigations.
    He wouldn’t have been the least bit surprised to find out that I was involved
    in one now, albeit peripherally.


    “I’m afraid to do anything. What if I mess it up? I’m not doing much more than
    handing out parking tickets, but still. Becca’s handling all the big stuff, so
    it’s not like a mistake by me would cause a murderer or a thief to go free. It’s
    just making me paranoid, I guess. Like, I expect him to pop out of my closet at
    any moment.”


    There was a creak I assumed was Lena opening said closet to be sure Buchannan
    wasn’t lurking inside.


    “What does Chief Dalton say?” I asked.


    Lena huffed. “She says that I’m doing great. Becca says the same thing. But they
    could just be being nice. You know, like that teacher who is always telling you
    you’re doing a good job, just before handing back your paper with a big fat D
    on it. So far, all I’ve gotten out of Detective Buchannan is a grunt and a watchful
    eye.”


    “He could simply be curious about your progress,” I said. “You’ve worked with
    him quite a bit, haven’t you?”


    “Yeah.” Said grudgingly, as if she knew where this was going.


    “Buchannan wants to take the credit for *everything*. And I don’t just mean with
    solving crimes. When you become the success we all know you’re going to be, he’s
    going to want to take credit for that too. He’ll say that you learned everything
    from him, will probably expect an award for it.”


    “I know, but—”


    “No buts,” I said. “I might not be there to see it with my own eyes, but I know
    you’re doing great. They wouldn’t have put even a fraction of Paul’s workload
    onto you if they didn’t think you could handle it.”


    A long stretch of silence followed while Lena absorbed that. “I suppose you’re
    right.” She sounded both relieved and deflated at the same time. “I’m probably
    just working myself up over nothing.”


    “There’s no ‘probably’ about it.”


    A chuckle, then, “How are things going out there? Getting a lot of sun?”


    “Beach day is tomorrow,” I said. “I fully expect to look like a lobster before
    the day is out.”


    “Sounds fun. I wish I was there. I could use some downtime, that’s for sure.”


    “Maybe I’ll bring you along the next time Paul and I head this way. We could spend
    the entire week at the beach and forget all about John Buchannan.”


    “I’m going to hold you to that. Rita’s already planning on tagging along on your
    next trip. I talked to her yesterday and … whew. She’s riled up and isn’t afraid
    to let everyone know about it.” There was a shuffling sound before she said, “I
    should let you get back to it. Say hi to your dad for me.”


    “I’ll do that.” New thought. “Before you go, how’s Death by Coffee doing?”


    “The people or the place itself?”


    “Both.”


    “The lights are still on—mostly—and business is about the same as usual. We all
    miss you, customers included.”


    *The lights are on.*


    A flash: the shifting light at Death by Java the night before Lyle’s murder. A
    flashlight? Something else? Farrah claimed there was no light on the next day,
    so who ever was back there had turned it off—or had taken it with them—when they’d
    left.


    Then, twenty-four hours later or so, Lyle Carrigan was found dead in the very
    same backroom. Coincidence? A clue?


    Lena’s voice tore me from my thoughts. “I’ll see you when you get back, Krissy.”


    “See you then.” I clicked off, mind churning over the possibilities.


    Valerie had claimed she didn’t know anything about the light. Was she telling
    the truth? Lying? Had Mickey gone there, dented the ice machine then? When Roman
    had been fixing it the following day, I hadn’t noticed a dent, but I hadn’t been
    looking for one. And since Roman and Valerie were standing in front of it, too
    close for comfort, I’d kept my focus turned elsewhere, lest I see something that
    would give me nightmares.


    “Everything okay back home?” Dad asked, setting his tablet on his lap. “If you
    want to talk about it …”


    “Everything’s fine.” I stood. “I need to make a call.” I hurried out of the room
    and into my bedroom for privacy. I closed the door behind me, waited a couple
    of seconds to make sure Dad hadn’t followed me back, then I put in the call.


    The phone rang four times before a breathless Valerie answered with a curt, “Who’s
    calling?”


    “It’s me, Krissy.”


    A beat, and then...

