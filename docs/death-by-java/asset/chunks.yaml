    Some of the heat left Marco’s expression. “Then the killer might come for me next.”
    His scowl morphed into a thoughtful frown. “Meaning I might be in danger.”


    “Exactly,” I said. “If someone found out about whatever it was that you two were
    conspiring to do—”


    “We weren’t ‘conspiring’,” Marco snapped, but there was little force to it. He
    released his death grip on the chair and sat down. “We were righting a wrong.”


    Dad and I shared a look. His subtle nod was permission for me to continue to press
    the issue. “What happened, Marco?” I asked. “I know you and Lyle were friends.
    But ‘righting a wrong’? What kind of deal are we talking about?”


    Marco sighed, rubbed at his face. It took him almost a full minute before he spoke.
    “There was a time when this part of the Village was the place to be. When I first
    opened, it was perfect. Business was great, as there was an endless stream of
    customers.”


    “But times changed,” Dad said.


    “They did. It was a slow progression while this end of town became less attractive,
    and on the other end, more accessible locations drew the eye of businesses and
    tourists. Before long, all I had were old customers, with few new ones knowing
    I existed.”


    Marco’s eyes flickered up to me, then flashed to Dad, before he planted them onto
    the desk in front of him. “Then, when that corner opened up, I jumped at the chance
    to move. I put in my bid, but unfortunately, I lost.”


    “To Valerie.” Marco nodded with a barely suppressed scowl. “Death by Java.” He
    said the name like a curse. “I know she cheated her way into it because there
    was no chance she outbid me. I’m not going to say how, but I’m sure you can imagine.”


    “I didn’t have to imagine since Lyle had all but spelled it out to me. Again,
    lot of men hated it when women managed to beat them, whether it was in games or
    business or whatever. That had to get on your nerves,” said.


    Marco barked a laugh. “You’t say. I tried to talk sense into anyone who would
    listen, but the deal was done. Best location in town, and that—” He clamped his
    teeth closed, then spoke through them. “That woman steals it from me and squanders
    it. How anyone could fail at that is beyond me. I didn’t need to enlist Lyle,
    but I’m not a patient man. I couldn’t wait for her to die a slow death when I
    could get her out of the place far quicker.”


    The light bulb went on in my head. “You had Lyle cite her.”


    “No,” Marco said. I told him not to do anything illegal or immoral. Just go in
    there, take a good hard look at the place, and cite her into oblivion. Threw Tito’s
    Deli for good measure, not because I have anything against Tito, but because I
    figured it couldn’t hurt to add another option in case Valerie withstood the scrutiny.
    His spot is good too. And it wouldn’t look like Lyle was targeting only the if
    he was also citing other businesses.”


    “That’s what you two were talking about the day he stormed out,” I said.


    Marco’s nod was slow, thoughtful. “He said he was worried that things were getting
    too hot for him to handle. Mickey was pressing him, threatening him.” He clenched
    a fist. “I told him to keep pushing, not to let it bother him. It’s my fault he
    was killed. If I’d let him back off like he wanted, then perhaps…” He shook his
    head and fell silent.


    Things were starting to make sense. Valerie, using underhanded tactics or not,
    snatched up prime real estate for her bookstore. Marco wanted the space, and he
    wanted to hurry her demise. He had his friend Lyle, who just happened to be a
    health inspector, go in and nitpick every violation he could find in an attempt
    to force her to close. Mickey and Valerie were unsurprisingly unhappy about it.
    So was Tito, who had been tossed into the blender alongside them. One of them—I
    wasn’t sure which—had gotten fed up and killed Lyle before he could ruin business.


    But which one? And could someone else, be it Hugh or Aaron or even Roman, have
    stepped in instead?


    “Did anyone else know about this?” Dad asked, likely thinking along the same lines
    as me.


    “Of course not,” Marco snapped. “Not unless Lyle told someone, because I sure
    didn’t. Do you know what it would do to me if people found out I was trying to
    close other businesses in town, even ones that were already failing? I’d be treated
    like a pariah.”


    Besides Leanne, I couldn’t think of anyone Lyle might have told, other than someone
    he worked with. But even then, wouldn’t talking to his coworkers about forced
    citations risk getting him into trouble?


    “Wait.” Marco’s eyes widened. “There might be one other person who knew.”


    Dad was the one who asked, “Who might that be?”


    Marco thought about it, then slowly nodded as he spoke. “I don’t know the guy’s
    name. It happened maybe a week ago. Lyle was here, and we were talking. Well,
    he was talking. He’d gotten all worked up and started yelling. This was right
    about the time he was starting to question our tactics and wanted to stop. Normally,
    he never used names, just in case someone was listening, but on that day, he did.”


    He paused, and I just about screamed from the anticipation.


    “I recall looking up because the door was hanging open after Lyle had barged in
    here while I was working at my desk.” He patted the desktop in front of him. “That
    Valerie woman’s lover was standing there.”


    “Mickey?” I asked.


    To my surprise, Marco shook his head. “No, not her boyfriend. Her lover.” He met
    my eyes with an intensity that I felt clear across the room. “The repairman. If
    anyone else knew what was going on between me and Lyle Carrigan, it was him.”


    * *


    Roman Haines had overheard the plot to ruin Valerie Kemp’s business.


    I churned it over all the way back to Dad’s house. Roman was interested in Valerie.
    Sure, he appeared interested in almost all women, but he did seem awfully smitten
    with her in particular. If he knew that Lyle was hounding her on Marco’s behalf,
    he could have used that information to get into her good graces, maybe by holding
    the information hostage.


    For what? A night together in Death by Java’s back room? Something more?


    And how exactly would that lead to Lyle’s murder?


    Laura and Paul were waiting at the house. Dad had called ahead, and it had been
    decided that grilling out would have to wait, so when we arrived, we spent a few
    minutes freshen up before we all piled into the car and were headed … I didn’t
    know where. I’m sure Paul, Laura, and Dad had discussed it at some point, but
    I hadn’t been paying attention.

