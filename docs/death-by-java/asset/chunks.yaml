  trans: '

    那个女人可能错了吗？瓦莱里（Valerie）看起来很沮丧，但这可能是因为那个留着胡子的警察不让任何人进去，而不是有人去世了。既然瓦莱里显然还健康无恙，我心中涌起一丝模糊的希望，希望这一切只是一个糟糕的传言，确实是制冰机引起了骚乱。


    但我迫切想知道真相。


    我果断决定，向前一步。


    皮尔警官（Officer Peel）立即举起一只手，掌心朝外。“禁止进入。这里是犯罪现场。在另行通知之前，这里关闭了。”


    “我不是顾客，”我说，听到“犯罪现场”三个字不由得缩了缩脖，“我最近一直在帮老板。”我向瓦莱里点了点头，她还没注意到我。“如果有什么我可以帮忙的什么——”


    “你现在的帮忙就是后退一步。”


    “至少告诉瓦莱里我在这儿。她是老板，瓦莱里·坎普（Valerie Kemp）。”我露出我最完美的微笑。“我是克丽西·汉科克（Krissy Hancock）。那是我爸，詹姆斯·汉科克（James
    Hancock）。”


    如果我曾希望提一下当地著名作者的名字会有帮助，那我就太失望了。皮尔警官只是调整了一下眼镜，挺了挺他瘦削的肩膀。“不准进入。后退，否则我得带你回留。”


    “我听有人去世了，”我说，“你至少能告诉我那是真的吗？”


    皮尔警官抖着胡子，双手交叉在胸前。他的下颌动了动，虽然我看不到他的眼睛，但我感觉到他在纠结是该执行他逮捕我的威胁，还是干脆无视我。


    还没等他做出决定，门就被推开了，一个神色慌乱的瓦莱里·坎普出现了。“克丽西！”她抓住我的胳膊，硬生生地把我拉过了受惊的皮尔警官。“告诉她，这件事与我没关系！”


    我踉跄着走进 `Death by Java` 的门口，差点脸朝地摔在了一个穿着西装裤和深蓝色衬衫、双臂交叉的高个黑人女性面前。她的头发紧紧地向后梳，露出一张惊人的脸，高高的颧骨和极其光滑的皮肤让她那清澈的棕色眼睛在脸上脱颖而出。那双眼睛眯着看着我，似乎表明她并不喜欢我的突然出现。


    “告诉麦肯西侦探（Detective McKensie）！”瓦莱里催促道。“克丽西昨天在这儿。她看到他离开了。他那时还活着，之后就再也没回来过，在我们在这儿期间。问问她吧！”


    那个女人——侦探——没有问。她只是盯着我。


    “我们在说谁呢？”我问，“我不知道发生了什么。”


    沉默过了一刻，我确信麦肯西侦探会一句话不说直接把我扔出去。她打量着我，就像看汤里的小虫子一样，然后重重地叹了口气。


    “我想既然你在这儿，我应该听听你想说什么，”她说。她的声音像黄油一样顺滑，几乎带着磁性。如果情况不同，这种声音会让大多数人对她心服口服。“克丽西，是吧？”


    我点了点头。“克丽西·汉科克。”


    “你住在这里附近吗？”


    “以前住。我现在住在俄亥俄州。我来这里探亲。”


    她的眼神向瓦莱里闪烁了一下，搞得我差点笑出来。


    “不，我们没有亲缘关系。我们是高中同学。我跟我爸在这儿。”我隔着门指向他。他还是站在我离开时的那个地方。


    “我明白了。你昨天也在这儿？”


    “我在这儿。”我瞥了一眼房间里的其他警察。他们正观察着这场互动，面无表情。现场没有别人了。“谁去世了？”


    麦肯西侦探听到问题后抿了抿嘴唇。她没有其他回答。


    “克丽西在这里待的时间几乎和我我一样长，”瓦莱里说。


    “工作？”侦探问，眼睛盯着我。


    “不，”我说，“不完全是。我在俄亥俄州有一家书店咖啡馆。瓦莱里想让我到处转转，看看她可以如何改进她的店来吸引更多生意。”


    “‘改进’是个很重的词，”瓦莱里说道，这引来了一个白眼，随后麦肯西才转回看向我。


    “你在这儿的时候看到其他人了吗？”


    “当然有瓦莱里，”我说，“还有她的两个员工，纳迪亚（Nadia）和法拉（Farrah）。我不知道她们的姓。”


    麦肯西侦探点了点头，仿佛我只是证实了她已经知道的事。


    “我在这里干活时来过一个修理工。他叫罗马曼（Roman）。”我睁大了眼睛。“死的是他吗？”


    “请停止猜测，”麦肯西侦探说，“那是完整的人员吗？顾客？其他员工？”


    我开始摇头，然后想起来。“莱尔·卡里根（Lyle Carrigan），”我说，“我到这时他已经在那儿了。他还有两个顾客。他们把杯子留在桌子上……”当麦肯西的表情变暗时，我的声音变小了。“莱尔本要因为制冰机坏了对瓦莱里进行指控，而那正是罗马曼来这儿修的。”


    “你见到卡里根先生了？”


    “我见过。他和瓦莱里在争论——”


    “‘争论’是个很重的词，”瓦莱里说。


    麦肯西对瓦莱里做了一个闭嘴的手势，然后向我走近了一步。“卡里根先生什么时候离开的？”


    “他是死掉的那个，”我说，并不是疑问。在那刻，根据提问和瓦莱里对问题的反应，这是显而易见的。

