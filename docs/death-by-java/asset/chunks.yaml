    The thought of having a class reunion, impromptu or not, just about gave me hives.
    “I’m not sure I can make it,” I said. “Paul and I have a ton of plans with my
    dad, and Saturday, we’re going to the beach—”


    “We should be back by eight, though, right?”


    I shot Paul a betrayed glare.


    “Sweet,” Bray said. “Hooties at eight. My pop still owns the place, so I can reserve
    it for us. I bet at least fifty will show. Maybe double that.”


    I doubted it, but at that point, I just wanted to be gone. I tugged on Paul’s
    hand and led him to the door. “We’ll see,” I said. “It was good seeing you all.
    Don’t forget about that list, Valerie. Bye!”


    As soon as we were on the sidewalk, I released Paul’s hand and turned on him.
    “Why would you do that?”


    “Do what?” he asked. “You said they were your friends. I thought it would be nice
    to get to know some of the people you hung out with in school.”


    “I said nothing of the sort. They’re Valerie’s friends, not mine.” The heat was
    already fading from my voice as my shoulders sagged. “I’m starving. Do you want
    to get something to eat?”


    Tito’s was right there, but I didn’t want to stick too close, just in case Bray
    and company decided to join us. We got into Dad’s car, with Paul slipping in behind
    the wheel. I directed him through traffic, to a quieter part of downtown, where
    there were still businesses, but the crowds were much thinner and the chances
    of being spotted at random were fewer.


    “There,” I said, pointing. “I used to love that place as a kid.”


    Paul parked in a small lot across the street from a place called the Italian Roll.
    They specialized in these little pizza rolls that were, when I was a kid, like
    eating little bites of heaven. I was happy to see that the place was still open,
    despite being off the beaten path. Metal tables and chairs sat outside the door.
    I used to love sitting outside, under the sun, sucking down the spicy little balls
    of lava, but since all the tables were taken now, Paul and I would have to enjoy
    them inside.


    The dim interior was like a slap of nostalgic bliss, as was the heavy scent of
    marinara and pepperoni that filled my nostrils. Mouth watering, I led Paul to
    the counter, where I put in an order for a dozen pizza rolls and a pair of Cokes.
    We then found an empty table and sat down to wait.


    “I’m sorry,” he said once we were settled. “I didn’t mean to put you on the spot
    back there. I just thought—”


    “It’s okay,” I said, waving off his concern. “Maybe it won’t be so bad.”


    “We don’t have to go.”


    I noted the “we” part of the statement and approved. “No, we don’t, but I’d feel
    bad if everyone showed up and I didn’t.” I shrugged. “Who knows? It might be fun.”


    Our order was up a few minutes later. I rose to retrieve it, savoring the smell
    all the way back to the table.'
