    The man looked from Mickey to Valerie, then decided to cut his losses as he turned
    and walked out of Death by Java. I half-expected Mickey to shout, “And stay out!”
    after him, but all he did was clap his hands together as if knocking away dust
    before turning and walking back behind the counter and through a door, into the
    back room.


    Which left me as the only other person, other than Valerie and her employees,
    in the dining area.


    “Krissy Hancock?” Valerie said, gaze zeroing in on me. “Is that really you?”


    A denial was on my lips, but instead, I smiled. “It is. Hi, Valerie.”


    Heels `clack`ing, Valerie crossed the distance between us and surprised me by
    giving me a hug that consisted of all arms and a lot of air between us.


    “It’s good to see you!” she said before turning to her two employees. “Dee. Nadia.
    This is Krissy. She’s the one with that basic little coffee shop I told you about.”


    Both Dee and Nadia gave me a tight smile before going back to staring vacantly
    around the room.


    I somehow kept my own smile in place, despite the jab at Death by Coffee. With
    Valerie, that sort of thing was expected. She’d never been good at complimenting
    anyone, other than herself. As a kid, she was the poster child for the snooty,
    popular girl, who only cared about herself, and she’d apparently never grew out
    of it.


    “Who was that?” I asked, nodding toward the exit.


    “Him?” Valerie made a face. “Lyle Carrigan. He’s no one. Just some health inspector
    who’s been doing his best to make my life miserable for the last month or so.”


    A health inspector. Quite suddenly, I wasn’t too keen on buying a coffee, despite
    needing a jolt of caffeine after my long flight.


    “What brings you to California?” Valerie asked, taking a step back to look me
    up and down. “You don’t look like you’re here for anything too special, not dressed
    like that. Did you hear about us all the way back in Michigan?”


    “Ohio,” I corrected. “Pine Hills.”


    Valerie waved a dismissive hand in front of her face. “Whatever. Same difference.”


    Her tone was really rubbing me the wrong way, which was why I let my annoyance
    get the better of me when I said, “It seems dead in here. Is it always like this?”


    I expected Valerie to come off with some smart remark about how her place was
    so much better than mine, but she surprised me by saying, “I don’t know what’s
    going on. I’ve done everything right. I looked at what you did and improved on
    it in every way, yet I can’t seem to draw in customers!”


    *Perhaps it has something to do with your attitude.* My lips puckered, ready to
    deliver the verbal jab, but thankfully, Dad, Laura, and Paul chose that moment
    to return, keeping me from saying it.


    “I feel better,” Dad said, joining us. “Valerie. It’s good to see you.”


    She gave him one of those brief, not-quite-a-smile expressions that was just this
    side of impolite.


    “Are you getting anything?” Paul asked as he took my hand. “I could go for a coffee.”


    Valerie’s gaze latched on on our hands and, oddly, she stiffened. “You saw Mickey,
    right? He and I just recently started dating. He’s a dear. He helps out around
    the place quite a bit. Aaron and Hugh stop in when they can, too. I can’t seem
    to keep them away.” A tittering laugh followed.


    Aaron was her ex-husband, and as I mentioned before, Hugh was her ex, so I found
    it hard to believe either man would come around. Then again, it wasn’t like Valerie
    chose boyfriends based on intelligence, so who knew?


    “That’s nice,” I said, tugging on Paul’s hand as I eased toward the door. “We
    really should get going. It was nice to see you, Valerie.”


    Panic flashed across Valerie’s face. “You know, I wouldn’t mind if you stopped
    in again soon. Perhaps you could give me some pointers on how you manage to lure
    people into your place? I tried to advertise, gave out samples, but it didn’t
    help. I’m not sure how people are overlooking us, and maybe you’d be able to,
    I don’t know, help.”


    I glanced around at the café, at the emptiness of the place, and felt a brief
    flare of guilt and compassion. Valerie and I had never gotten along, but I wasn’t
    one to hold a grudge. “I’ll think about it,” I said. “But the next couple of weeks
    are for family. If I get a chance, I’ll—”


    “Thank you!” Valerie grabbed my free hand and squeezed. “I don’t know what I’ll
    do if I’m forced to close because people around here don’t know a good thing when
    they see it.”


    I extracted my hand from Valerie’s grip, fought down a massive eye roll. “Good
    luck. I’ll see you around, Valerie.”


    I led the way out the door. Relief flooded me as I was back out under the sun
    and away from Valerie’s desperation. I felt bad for her, I really did. But I had
    a feeling the problems with her bookstore café had a lot more to do with how she
    treated her customers than a problem with visibility or their awareness of Death
    by Java’s existence.


    “That was fun,” Dad said as the door closed behind us.


    “Shush, you.” Laura nudged him with her elbow, though she was smiling as she did.

