  trans: '

    不对。那事实。我可以想象出可能发生的情况。如果出轨的不是 `Mickey` 而是 Valerie，而且是某个手艺工，可能是在深夜，唯一的光源只有一盏为了防止别人察觉而打开的手电筒光……


    这让我想到了另一个想法。


    “你说在 Lyle 被发现的地方附近的地板上有一把螺丝刀，”我说道，语气平淡，“你真的认为那是 `Roman` 的吗？”她声称他可能是掉进去的，但她确定吗？还是说她只是认为那是他的？


    沉默了一片刻后，她才说：“我不知道。也许吧？”随后听到了一阵沙沙声。“我真的得走了。我们以后再聊，好吗？”


    等我还没来得及回答时，她已经离开了。


    我皱眉放下手机。Valerie 在撒谎。是为了保护她自己还是保护 `Mickey`，这并不重要。不，我不需要知道她和 Mickey 之间，或者与其他任何人的每一个肮脏细节——但如果这能洗清他们的谋杀罪名，为什么不至少
    `try` 解释一下呢？回避只会让她看起来很心虚。


    我闭上眼睛想象了那个场景。Valerie 在 `Death by Java` 与 `Roman` 会面。或者可能是 `Mickey` 和书店咖啡馆的一名员工，比说是
    `Farrah` 好。无论如何，他们在后屋里嬉闹时开着手电筒。`Lyle` 恰巧经过，就像我昨晚一样，他看到了那道光。也许他以为那是不小心留下的后屋灯光，于是想出了一个可以借此指控他们的办法。也许他看到了动静，决定进去谈谈制冰机的事。他抓住了其中一个人的出轨现场，威胁要指控他们……因为我想象在咖啡馆后屋的这种偷情行为会是严重的卫生违规。


    然后呢？`Mickey`——或者 `Roman`——因为这事杀了他？这意味着 Valerie，或者不管 Mickey 和谁出轨的某个人，目睹了谋杀的发生？


    卧室门传来的轻声敲门声让我睁开了眼睛。


    “Krissy？醒了没？”Paul 轻轻推开门。


    “醒了。只是在想。”


    “对不起我来这么晚，”他走进卧室，“Gabby 发现了一些涉案当方的有趣细节，想听听我的看法。你知道警察办案进展得有多慢。”


    “像冰川一样慢。”


    他点了点头，重重地坐在床边。“显然，`Lyle Carrigan` 在一个多星期前向警察报了了 `Mickey Robbins` 和 `Valerie Kemp`。他声称
    `Robbins` 是应 `Kemp` 的命令出现在他家那里的。`Robbins` 没做什么，只是站在外面盯着，但这让他很不安。”


    “哇，”我说，“这对 `Mickey` 来说听起来不妙。”


    “不，不妙。算上后来 `Death by Java` 里的那个场景，再加上 `Mickey` 现在的失踪，对他来说完全不乐观。”


    我眨了眨眼睛。“`Mickey` 失踪了？”


    Paul 摊了摊手。“他不接电话，自从发现尸体后，他没有回家，也没有去过 `Valerie Kemp` 家。我知道你认识他们——”


    “我认识 Valerie，”我说，“Mickey 对我来说很新。”


    他承认了这一点。“他通过躲避警察来让自己显得有罪。如果他还不尽快露面，就会变成头号嫌疑犯。”


    *如果他现在不是的话。* 我考虑过告诉 Paul 我学到的事情，关于 Valerie 对光和制冰机的事情闪烁其词，以及我怀疑他们其中一个或两人都在出轨，但我打消了此念。Paul
    没有值。他在这里没有管辖权。如果我告诉他，他会觉得需要和 Gabby 谈这件事，这意味着他为了帮她办案又要浪费一天时间，而不是陪我我去海滩。


    “你觉得我们今天晚上就此结束，忘记关于 `Mickey Robbins` 和谋杀案的事怎么样？”我问，“我们明天还有大事要做。”


    Paul 笑了。“你，穿着一件很暴露的比基尼，在沙滩上。”


    我做了个鬼。“比基尼，可以。暴露？做梦去。”


    他伸出一只手，当我握住时，他把我拉到他身边的床上。“你一直在监视我的梦吗？”


    “我真的需要吗？”我亲了吻他的太阳穴。“我很确定已经知道你脑子里在想什么。”


    他又抱了我几分钟，低语着一些我不会在这里重复的话。这么说吧，等他忙完，我很想关上门，因为我不想让爸爸或 Laura 看到我脸红。这不是第一次，我希望我们在城里找间酒店住，而不是住在爸爸家里，因为在家人家里做客时，有些事情是你不想——也做不到的。


    # 9


    “东西都带齐了吗？”爸爸皱着眉扫过那堆海滩用品。“我觉得我们忘了什么。”


    “都在那儿，”Laura 说，“我已经检查了三遍。我甚至还多带了额外的防晒霜，万一你不喜欢我的味道呢，我知道你，你不会喜欢的。”


    爸爸捏住鼻子，在面前挥了挥手，然后转向我。

    '
- fmt: '

    I made a pained face as I removed my phone from my pocket. A glance at the screen,
    and I let out a low groan before mouthing, *“Sorry,”* before answering.


    “Hi, Valerie. We’re about to—”


    “Krissy! Thank goodness you answered. I’m at my wits’ end here, and I don’t know
    what to do!” Valerie sounded panicked. “My entire life is crumbling right before
    my eyes.”


    I took a few steps away from the car. “What’s going on, Valerie? Did they arrest
    someone for Lyle’s murder?”


    “No!” she wailed. “And that’s the problem. I got to thinking about what you said
    yesterday. The questions. I didn’t answer you because I didn’t know *how* to answer
    them. I don’t want to believe it, but what else am I supposed to think? I need
    you to come over right now. I need to talk this through before I lose my mind.”


    “Slow down,” I said, catching only half of what she’d said. “Tell me exactly what’s
    going on.”


    She took a deep couple of breaths before she said, “It’s about Lyle’s murder.
    That poor man.” She tried to inject compassion into her voice, but failed. “I’ve
    thought about who could have done it and why anyone would want to kill him, and
    after serious consideration, I … I’m afraid I might be next.”


    “Did something else happen?” I asked as I imagined Mickey standing outside her
    house like some horror-movie villain.


    “No. If it had, then I might feel better. It’s what *hasn’t* happened that’s got
    me worried.” Her voice dropped and became oddly muffled, as if she was shielding
    the mic with her hand. “Can you come over? I don’t want to discuss it over the
    phone. Who knows who could be listening? I really do need to talk to you.”


    The question, *Can’t you talk to someone else?* was on the tip of my tongue, but
    I bit it back. Even if she could, there was no way I could go to the beach and
    enjoy myself now. Not with an unsolved murder. Not with Valerie sounding as if
    she was scared for her life. She might be overstating things, might be shooting
    for overly dramatic so she could get her way, but could I really turn my back
    on her?


    I sighed. “All right. Tell me where you want to meet.”


    “My place. I feel safe here.” She rattled off her address so fast, I had to ask
    her to repeat it twice before I had it committed to memory. “Thank you so much,
    Krissy. I know …” She coughed, cleared her throat. “I know I haven’t treated you
    the best over the years. The words are always out of my mouth before I realize
    I’m going to say them, and you know how it is, right? I have an image to keep
    up, so it’s not like I can just apologize where everyone can hear.”


    “I get it.” I didn’t like it, but I understood it. To Valerie, her reputation
    was her life. As a teen, she couldn’t be seen being cordial to someone as lowly
    as me. And she most definitely couldn’t be seen as ever being in the wrong. “I’ll
    be there in twenty minutes.”


    We clicked off, and I just stood there, my back to the others, rubbing at my eyes.
    A headache was forming, and I had a feeling it was going to be the sort that would
    last all day.


    “That was Valerie Kemp, I take it?” Dad asked.


    I nodded, heaved another sigh, then turned around. “Something’s come up.”


    “We heard,” Laura said.


    “I’m sorry. I can’t abandon her.” I wished I could, but it just wasn’t in me.


    “No need to apologize,” Paul said. “We understand. If you want, I can—”


    “No.” I held up a finger, forestalling him. “You three are going to the beach.”


    The three of them shared a look. It was Dad who answered. “We could always wait
    for you to finish with—”


    I turned my finger toward him. “No. Go. I have no idea how long this is going
    to take or even what it is she’s so scared of.” Other than Mickey. I squeezed
    my phone, was tempted to throw it, before I pocketed it. “If this only takes a
    few minutes, I’ll get an `Uber` and meet you guys there. Otherwise, I’ll see you
    when you get back.”


    “I don’t—” Paul snapped his lips together when I threatened him with my finger.


    “If you’re sure …” Laura sounded uncertain.


    “I’m sure,” I said, hating it that I was. “Go to the beach. Have fun. Show Paul
    all the sights. If I can’t make it today, we still have next week.”


    “Can we at least give you a ride?” Laura asked. “There’s no reason for you to
    have to call an `Uber` when we’re right here.”


    Worries that Dad or Paul might use it as an excuse to accompany me inside Valerie’s
    almost had me declining, but she was right. “That would be great.”


    I gave Laura Valerie’s address, and then we piled into the car. Dad and Laura
    sat up front, with Paul and me in the back. As soon as we were strapped in, Paul
    took my hand and gave me a level look.


    “If you change your mind and want me to come in with you, just say the word.”


    “I’ll be okay,” I said. “Valerie’s probably blowing this whole thing out of it.”

