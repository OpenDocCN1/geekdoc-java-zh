    he presses the issue. Maybe not right away. And maybe not directly. But eventually,
    he starts showing up here or there, making comments, pushing you to acknowledge
    him. It’s like he is unable to comprehend the fact that not every woman falls
    madly in love with him the moment they lay eyes on him.”


    “He said he fixed your water pump.”


    “That he did. Lyle was the one who called him, completely by chance, because I
    wouldn’t have. Roman and I …” She took a breath, huffed it out. “We have a history.”


    I glanced at Dad, who asked, “What sort of history?”'
