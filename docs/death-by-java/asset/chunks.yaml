    Bailey nodded. “Seemed like there was a new one every day. And I *was* getting
    a lot of calls about the two locations he was frequenting right about then, so
    I suppose it wasn’t much of a surprise.”


    “Tito’s Deli and Death by Java?”


    “Those are the ones,” she said, pointing at me. “At first, we’d get a call, and
    Lyle would go in and come back claiming there was nothing to it. Crank calls,
