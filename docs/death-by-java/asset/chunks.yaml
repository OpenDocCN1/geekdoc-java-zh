- fmt: "\nI found Larissa and Renee seated at a corner table, talking quietly to one\
    \ another. I saw them before they saw me, which gave me a chance to stand back\
    \ and marvel at how times might have changed, yet at the same time, they didn’t.\
    \ Renee had the same severe look about her that was softened by her brown doe\
    \ eyes that had always grabbed the attention of anyone who saw her. Larissa’s\
    \ round face had thinned over the years, yet it held the same youthful exuberance\
    \ that had gotten us into trouble countless times. When she smiled, her entire\
    \ face lit up in a way that brought a smile to my own face.\n\nRenee was the one\
    \ who looked up and spotted me. Her eyes went wide, and then she just about leapt\
    \ out of her chair.\n\n“Krissy! There you are!”\n\nNormally, I’d never stoop to\
    \ acting like a thirteen-year-old girl in public, but at the sound of my name\
    \ coming from her mouth, I was transported back in time, and the next thing I\
    \ knew, I was jumping up and down and squealing and giving out hugs like they\
    \ were candy. The tears I found myself wiping from my cheeks were of the happy\
    \ kind, and by the time we sat down, all eyes in the place had turned our way,\
    \ but none of us cared. In that moment, we were the only three people on the planet.\n\
    \n“How have you been?” I asked Renee once I could speak without sobbing. “It’s\
    \ been far too long.”\n\n“It has,” she said. “And I’ve been good. Busy, but good.”\n\
    \n“Tell me about it,” Larissa said. “Renee is representing half of the Village\
    \ these days, so getting a spare moment with her is near-impossible.”\n\n“Not\
    \ even close,” Renee said, though she seemed pleased. “But I’m doing all right.”\n\
    \n“‘Representing’?” I asked.\n\n“I’m a lawyer.” She made a face like she’d said\
    \ something dirty. I handle local conflicts, so it’s nothing fancy. You won’t\
    \ be seeing me on TV or hearing about me defending a celebrity or anything like\
    \ that.”\n\n“Wait, wait, wait.” I squeezed my eyes shut against what I’d just\
    \ heard. “You’re a `lawyer`? You?”\n\nI remembered how Renee had been the one\
    \ person in my life whom I thought was most likely to find herself in trouble\
    \ with the law. Nothing horrible, mind you. But she wasn’t above causing a little\
    \ mischief, and boy, did she ever.\n\n“It’s kind of like that guy in that show,”\
    \ Larissa said, snapping her fingers as she tried to come up with a name. Renee\
    \ provided it right away.\n\n“`Saul Goodman`, she said with a laugh. “From `Breaking\
    \ Bad` and `Better Call Saul.` I should be offended, but I’m not. It fits.”\n\n\
    Larissa pointed at her with a grin that had me smiling so hard, my face hurt.\n\
    \n“How did that happen?” I asked. “Did someone kidnap you and force you to go\
    \ to law school?”\n\n“Okay, you’re going to love this …”\n\nFor the next thirty\
    \ minutes, we spoke of everything under the sun. We ordered, and our food arrived.\
    \ We talked and laughed. I told them of my life in Pine Hills, of Paul, and how\
    \ Vicki was doing. Larissa told me of her two marriages, both of which were now\
    \ in the past and, in her words, “Good riddance.” Renee spoke of her life, how\
    \ she realized that she had no interest in marriage or relationships at all. We\
    \ talked of life and everything after.\n\nIt was one of the best half hours of\
    \ my life.\n\nThen, as the joy of seeing each other again slowly bled away, the\
    \ conversation shifted. Not all at once, but slowly, toward the one thing—the\
    \ one `person`—we all knew was inevitable to bring up.\n\n“I hear you’ve been\
    \ hanging around with Valerie Kemp,” Renee said, mild disapproval in her voice.\n\
    \nI tried not to take it as an accusation, but with our history with Valerie,\
    \ I couldn’t help it. “I’m not hanging around her because we’re friends,” I said,\
    \ before explaining how she’d asked me to help her failing business. “I kind of\
    \ feel bad for her,” I finished. “She’s trying, but she’s still, well, `Valerie`.”\n\
    \n“Tell me about it,” Larissa said. “I ran into her about a month ago, and she\
    \ couldn’t help but hit me with one of those insults of hers. You know the kind.”\n\
    \n“You mean the insult she `thinks` is a compliment,” Renee said with a shake\
    \ of her head. “I’m pretty sure we’ve all been the target of those more than enough\
    \ for one lifetime.”\n\nLarissa nodded. “I’ve tried to get along with her, but\
    \ it’s impossible. You must be a saint to be willing to help her out, of all people.\
    \ She was really hard on you back in school, Krissy.”\n\nI shrugged, somewhat\
    \ embarrassed. “I try to leave the past in the past,” I said. “Though, to be fair,”\
    \ I repeated, “she’s trying.”\n\n“I heard someone was killed at her place,” Renee\
    \ said.\n\nBefore I could confirm it, Larissa said, “Lyle Carrigan.”\n\n“You knew\
    \ him?” I asked.\n\n“Not well,” Larissa admitted. “But we crossed paths when I\
    \ was jumping from job to job. I think it was about a year back that we worked\
    \ together at the health department. Might have been two years, actually. You\
    \ know how times flies.”\n\nBoy, did I ever. “`You` were a health inspector?”\
    \ I asked with a laugh. “You used to eat cheese off the floor!”\n\n“Hey!” Larissa\
    \ said with offense.\n\n“Wait,” I interrupted the conversation. The atmosphere\
    \ shifted. “I heard someone was killed at her place,” Renee said.\n\nBefore I\
    \ could confirm it, Larissa said, “Lyle Carrigan.”\n\n“You knew him?” I asked.\n\
    \n“Not well,” Larissa admitted. “But we crossed paths when I was jumping from\
    \ job to job. I think it was about a year back that we worked together at the\
    \ health department. Might have been two years, actually. You know how times flies.”\n\
    \nBoy, did I ever. “`You` were a health inspector?” I asked with a laugh. “You\
    \ used to eat cheese off the floor!”\n\n“Hey!” Larissa said with offense.\n[/content]\
