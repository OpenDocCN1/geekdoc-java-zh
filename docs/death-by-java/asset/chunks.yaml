    “I do,” I said. My legs were splayed out before me and refused to obey any sort
    of mental command to function. “But I don’t think I *can.*”


    “That was a lot of walking,” Laura said. “Even I’m kind of pooped.”


    After the stop at the health department, we’d spent the rest of the day running
    all over Redwood Village, seeing just about everything there was to see. There’d
    been no rhyme or reason to where we went. It was very touristy, despite three-fourths
    of us not being tourists.


    And yet, it was perfect.


    “Go ahead and get your shower,” I said, flapping a hand at him. “I’ll hop in when
    you’re done.”


    Paul nodded and headed for the bathroom, while Dad collapsed into a chair by the
    window. The last light of the day streamed in through slightly parted curtains,
    and would soon be gone.


    “I’m going to make some lemonade,” Laura said. “You two better not go anywhere
    while I’m busy.”


    “I don’t think you have to worry about that,” Dad said.


    Laura eyed him a moment and then left. The curiosity was swirling off her, but
    so far, she hadn’t asked what we’d gotten into earlier that day. I hoped she never
    would.


    “So,” Dad said when she was gone, “care to share?”


    “Share what?” I asked.


    Dad kicked off his own shoes, wiggled his stockinged toes. “You went into the
    health department where Lyle had been working. You’re telling me no one there
    knew anything?”


    Oh. *That*. “There was only one person there,” I said. “And she didn’t have anything
    concrete.” I gave him a quick rundown of my conversation with Bailey.


    Dad’s brow furrowed. “She thinks it might be someone who has access to both places?
    Who would that be?”


    “Honestly?” I asked. “No one, as far as I know. Separate employees, separate buildings,
    separate owners.”


    “Both places would have some crossover in customers,” Dad said, thinking out loud.
    “But customers wouldn’t have access to the back rooms.”


    “And Lyle wasn’t killed until after hours.”


    “A maintenance man?” Before I could answer, Dad shook his head. “No, that doesn’t
    make sense. If it was a mall or something, then perhaps, but not separate buildings
    owned by different people.”


    “There’s Roman,” I said. “He seems to be a popular repairman with the businesses
    in town. Marco’s used him. Valerie uses him. I imagine Tito has, as well. Maybe
    Roman got hold of the businesses’ keys while he worked and copied them. That would
    give him access any time he wanted.”


    “But why do that?” Dad asked. “Do you think he planned the murder in advance?”


    “Not really.” I sighed. “I don’t get it. Maybe we’re looking at this all wrong,
    getting distracted by information that doesn’t matter.”


    “What do you mean?”


    I thought about it briefly before answering. “Just because Lyle and Marco were
    working together, it doesn’t mean that is why he was killed. It could be as simple
    as Mickey getting angry with him and killing him because he was citing Death by
    Java and upsetting Valerie. He could have left him in the back room because he
    didn’t have time to move him.”


    “Which we’ve discussed before,” Dad pointed out.


    “That doesn’t make it irrelevant,” I said. “But I still can’t dismiss the fact
    that Tito had Lyle’s tablet. There’s no way that’s just a coincidence. But how
    could Tito have gotten into Death by Java’s back room after hours?”


    “Could one of Valerie’s employees be friends with him?” Dad asked. “They could
    have let him in to kill Lyle without realizing that was what they were doing.
    Maybe he asked them to leave the door unlocked so he could leave a surprise for
    Valerie, or something like that, and they complied, not realizing they were setting
    her up for murder?”


    Could it really be that simple? I had my doubts, but it wasn’t like I was getting
    anywhere with my own theories. I mean, if what Dad said was true, wouldn’t the
    employee have told someone by now? Or were they afraid Tito would come after them
    next if they spoke up?


    I didn’t know. I kept waffling between suspects, each looking just as good as
    the next. Mickey and Valerie. Tito and Marco. Roman. Even Aaron and Hugh felt
    like viable suspects under the right circumstances.


    But, at the same time, I could come up with just as many reasons why none of them
    would have done it. Mickey and Valerie wouldn’t want to leave a body in their
    place of business. Marco’s plan was actually ruined by Lyle’s death, so why kill
    him? Aaron and Hugh wouldn’t want to risk Valerie taking the fall for the murder.


    *But what about Tito and Roman?*


    Now, those two … I couldn’t come up with a good, solid reason for them not to
    have committed the murder, outside moral and legal reasons. The only problem was,
    I couldn’t see how either of them could have killed him and left him inside Death
    by Java.


    Back to square one we went.


    “I suppose it’s possible the door *had* been left unlocked,” I said.


    “What door?” Laura asked, entering the room. She was holding a glass of lemonade.
    Ice *clink*ed as she swirled it before taking a sip.


    Dad and I shared a look, but we were saved from having to admit we were talking
    about Lyle’s murder when Paul entered the room, hair still damp from the shower.


    “All done,” he said.

