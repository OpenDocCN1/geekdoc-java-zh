  trans: '

    “给他们几分钟，”我说道，把托盘放在桌子中间，“否则你们会烫着自己的。”


    “嘿，克丽西，”保罗说，朝我肩膀后方的某点点了点头，“那不是我们昨天在‘Java 死亡之旅’看到他正和瓦莱莉争吵的那个家伙吗？”


    我转过头，惊讶地看到 `Lyle Carrigan` 正在从办公室后面匆忙走出来，腋下夹着平板电脑。意大利卷饼店（Italian Roll）的老板 `Marco
    Rossi` 皱着眉跟在他后面。他看着莱尔离开，然后沮丧地摇了摇头，走回了柜台后方。


    “你觉得这里有违反卫生规定的行为吗？”保罗问道，他拿起一个披萨卷，然后又迅速地把它放回托盘，对着自己发红的指尖吹了气。


    “我不知道。”我的脑子里进行了一场短暂的斗争，然后我站了起来。“我马上回来。”


    “克丽西……”


    “我知道，我知道，”我说，“但如果这个叫莱尔的家伙在纠扰镇上多家店，可能会让瓦莱莉感觉好受些。”我不知道自己为什么这么在意，但我确实在意。“给我五分钟，然后我们就可以吃了。”


    保罗叹了口气，但点了点头。我留下他自己对付烧伤的手指，来到柜台加入了马可的行列。


    “有什么可以帮你的吗？”他问道，几乎没有从收银机上抬起头。


    “你好，马可。你可能不记得我了。我小时候经常来这里。”


    他抬头看了一眼。他的眼神里甚至没有一丝认出的意思。“很高兴你回来了。点餐了吗？”


    “点过了。我们只是在等它凉。”我笑了笑，得到的却只有一个注视。“我在想……”我瞥了一眼莱尔刚刚离开的门口。“那个是莱尔·卡里根，对吧？那个卫生检查员？”


    停顿了一下。“是吧。”


    “这里没问题，对吧？我很喜欢这个地方，而且——


    “不，不，不是那样的，”马可说道，“莱尔和我认识很久了。”


    “我懂了。”我偷了一眼保罗。他试图再次拿起另一个披萨卷，结果又把它掉回了托盘。“我在‘Java 死亡之旅’和 Tito 熟食店见过他，所以有点好奇奇。看起来他经常在附近转悠。”


    马可叹了口气。“莱尔在履行职责，尽管并不是所有人都能理解。这很遗憾，因为我我很想把‘意大利卷饼’搬到镇上的那个区域，但我的出价没人比。他们为什么不能让自己的店符合标准，特别是在这样一个充满潜力的地区，我永远不知道。”他摇了摇头。“失涵我一下，我需要……”他指向了收银机。


    感谢他的时间后，我回到桌边。


    “一切还好吗？”


    “看起来不错。”

