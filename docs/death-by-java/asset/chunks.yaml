  trans: '

    McKensie 还没有现身，但我按照 Peel 的指示，很快进入了一个我以为是她办公室的地方。侦探坐在一张狭小拥挤且堆满 `stuff` 的办公桌后。桌上有一个由洛杉矶天使队玻璃杯制成的笔筒。一个满是划痕的木盒上面叠着一叠文件夹。订书机旁边放着一个铁丝架，衣架被弯成了一个心形。更多的纸张，更多的文件夹。而且奇怪的是，一个崭新的擀面杖正摇摇欲坠地停在办公桌的一角上。


    “坐吧，”McKensie 说，朝她对面的椅子比了比。


    我坐下时紧紧抓着我的手包。“抱歉这样打扰你。”


    McKensie 挥了挥手。“我猜你已经对这个案件了解了一些情况，否则你不会来这儿。我宁愿你打断我，也不希望你把那些事情憋在心里。”她交叉双臂，靠在椅子背上。“那么……说出来吧。”


    我对她如此随意的态度感到惊讶。这种柔和的语气让我放松了，这可能正是她的目的。


    “别生气，”我说。“但我发现了一些你可能想要的东西。”


    McKensie 眨了眨眼，没有其他反应。


    `Quit procrastinating`，我在心里对自己说，然后从手包里掏，拿出 Lyle 的平板电脑。我一言不发地递给了她。


    McKensie 侦探皱着眉接过了它。她在手里翻转了两次，然后测试了电源按钮。屏幕连闪烁一下都没有。我不确定是因为屏幕裂了还是电池没电了，我并不知道。拿到它时我没试过，带过来之前也没想过插上电源。她把电脑举向我，挑起眉表示询问。


    “我在 Tito Adornetto 的垃圾桶里找到它的。”


    McKensie 叹了口气，然后把平板电脑扔在桌上的一堆杂物中。“所以，是你干的？”


    “什么？”


    “昨晚。我们接到举报，说有人在一个富人街区附近溜荡，翻找别人的垃圾。那就是你。”


    “我只翻了 Tito 的垃圾，”我说。“我这么做是因为我看到他把平板电脑扔掉了。我知道我必须做点什么。”


    “你本可以报警的，”McKensie 指出。


    “我本可以，但我并不确定他扔的是不是那个。据我所知，那可能是猫砂。找你看起来很有风险，所以我想——我得去检查一下确保那是平板电脑。”


    “当你发现确实是平板电脑时，你打算怎么办？就这么带着它跑掉？”


    我强忍了一下。“Tito 回到了外面的。我恐慌了。”


    McKensie 侦探闭上眼睛，揉了揉太阳穴。在长时间的沉默后，她开口道：“让我理清楚。你半夜去 Adornetto 先生的家里是为了……？”


    “确认他的情况？”这听起来像是个提问。


    她哼了一声，继续说道。“你恰好看到他扔了某样东西，然后决定翻垃圾。接着，你发现了有关 Adornetto 先生杀害 Carrigan 先生的证据。你没有打电话给我，而是决定把这些证据带走，留了一晚上，然后在今天早上带给我。我对这一系列事件的逻辑表述清楚吗？”


    “差不多吧，”我说，这次没能掩饰自己的抽动。“抱歉。”


    McKensie 对我口型了一句 `“抱歉，”` 然后摇了摇头。“我不知道该怎么想。”


    “我知道这不能证明 Tito 杀了 Lyle，”我说。“但他确实有那个平板电脑。我知道我本应该把它留在原处的，但正如我所说，他看到我了，我恐慌了。如果我把它扔回垃圾桶，他会把它拿走并藏在别地方，可能会把它毁掉。而且上面可能有些东西能提供
    Lyle 死的动机。”


    McKensie 盯着平板电脑看了很久，然后抬头看向我。“你让我处于一个很尴尬的境地，Hancock 女士，”她说。“我很感激你的初衷，但我希望你是打电话给我，而不是自己采取行动。”


    “不会有下次了。”


    McKensie 站起来依然并不高兴。“我想我需要去拜访 Adornetto 先生，看看能从他那里打听出什么。但首先……”她拿起平板电脑，在手里掂了重量。“我去看看能不能让这台机器运行起来。希望你是对的，上面有什么东西能让其他事情都变得无关紧。”她指着我。“你最好希望这不会让我漏掉一次逮捕。如果我是你，我会在在这里的剩余时间里多陪陪你的家人。”


    我站了起来。“我打算这么做。”


    当我离开警察局时，我感到如释重负。不仅平板电脑离开了我的手，而且 McKensie 侦探也没有逮捕我。她当然对我并不满意，但如果我的贡献最终能让一个杀手落入法网，我可以接受这一点。


    完成了主要任务后，我开车去了 Death by Java，至少假装在做我说过要做的事。隔壁的 Tito’s Deli 开着门，我在想 Tito 是在里面，还是
    Tito 是在里面。

