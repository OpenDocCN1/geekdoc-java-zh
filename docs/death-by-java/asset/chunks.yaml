    “How so?” I asked. All I knew of Mickey was what people had told me, which mostly
    consisted of how he interacted with Valerie. His history before her was a complete
    mystery to me.


    The waiter returned and spirited away our mostly empty plates. Renee waited for
    him to be out of earshot before she responded.


    “Like I said, don’t quote me on this. And remember that this is hearsay, so there’s
    a chance some of it was exaggerated. Very few people know anything about it since
    it was kept hush-hush, for reasons I won’t get into here.” She leaned forward
    and met my eyes. “But quite a few years ago, back before Valerie met him, a friend
    of Mickey Robbins turned up dead.” A pregnant pause followed, before, “And the
    way I heard it, Mickey was the one who killed him.”


    # 20


    That night, I dreamed of my friends, but not in a good way.


    We were back in high school, at a football game, walking the track that surrounded
    the field and ignoring the actual game taking place. Then, in a blink, we were
    at my house, sitting in my bedroom, talking about boys and movies and everything
    under the sun.


    Yet in every window, standing in every doorway, and following us wherever we went,
    was Mickey Robbins.


    Sometimes he’d have a knife. Sometimes he’d have a rope pulled taut between his
    meaty hands. It was like those horror movies where the killer would walk slowly
    toward the victim, and no matter how fast they ran, they couldn’t get away from
    the inevitable—yet we seemed oblivious to his presence. I saw him, but I couldn’t
    tell anyone, could only watch as he moved ever closer.


    When I woke up, I was tired, yet determined. I wasn’t going to let thoughts of
    what Mickey might do—or might have done—ruin my vacation.


    “Good morning, Buttercup,” Dad said through a yawn as he poured coffee. “Care
    for a cup?”


    “Only if you’ve got a cookie for it.”


    “Of course.” He retrieved another mug, dropped in a chocolate-chip cookie, then
    poured coffee atop it. He handed it over with another yawn.


    “Long night?” I asked, injecting as much calm into my voice as I could manage.


    He glanced at me over the top of his mug and winked. “Very.” I decided I didn’t
    want to know what `that` meant.


    “Morning,” Paul said, shuffling over. “That coffee?”


    “It is!” Dad produced another mug and poured without having to be asked. “I was
    thinking—”


    Paul’s phone rang, causing us all to start. He glanced at the screen, then quickly
    answered. “Paul Dalton speaking.” He listened, eyes flickering over to me, then
    to Dad. “I can.” He checked the time on the microwave. “Give me twenty minutes.”
    He clicked off.


    “Who was that?” I asked.


    He took a long drink from his coffee, then set the mug aside. “It’s no big deal.
    I’ll fill you in when I get back.” He hurried away, presumably to get dressed.


    I watched him go with a frown. “He didn’t answer my question.”


    “It’s probably nothing,” Dad said, before gesturing at me with his mug. “I bet
    it’s that detective. You know? About the case.”


    “Hmm.” My frown deepened. It seemed awfully early for Detective McKensie to call,
    especially since Paul actually had nothing to do with her investigation. And if
    it `was` her, why wouldn’t he just tell me?


    Paul appeared a moment later, dressed for the day. He hadn’t dressed up, nor did
    he look any different than usual, so there were no clues there. He gave me a quick
    kiss on the cheek, took Dad’s proffered keys, and then rushed out the door like
    he was on fire.


    I sipped my coffee, still frowning. It wasn’t that I didn’t trust Paul; I did.
    But I knew how McKensie looked at him. Knew that Paul didn’t know anyone else
    in town. Where could he possibly go that he couldn’t take me or tell me about?


    “Do you have plans for the day?” Dad asked, seemingly far less concerned about
    Paul’s sudden flight than I was.


    I took another sip, then set my mug down beside Paul’s. “You know, I think I might
    go have a chat with Valerie.” If anyone would know something about Mickey’s past,
    it would be her. And if she didn’t … Well, her boyfriend being a suspect in an
    old murder investigation was something she `should` know about.


    “Want some company?” Dad asked. “Laura’s got a thing today, so she’s not going
    to be around much.”


    “A ‘thing’?”


    Dad shrugged. “No clue. She told me about it last night, but I was distracted
    at the time.”


    “You weren’t listening.”


    “I was.” He grinned. “Just not closely.”


    “Uh-huh.” I looked down at my pajamas. “I’m going to get ready and go. This shouldn’t
    take long, so there’s no need for me to drag you along.” And then, because I didn’t
    want him to worry like I was worrying about Paul, “It has to do with something
    Renee and Larissa told me last night. You know, girl talk.”


    “Oh.” He made a face. “I probably don’t want to hear it, then.”


    I gave him a quick kiss on the cheek and said, “Probably not,” though I knew the
    opposite to be true. “I’ll give you the CliffsNotes version of it when I’m back.”


    “You do that.”


    I went about my business, but my mind kept returning to Paul. He was gone now,
    but the phone call hung in the air. Detective McKensie. What did she want with
    Paul?


    I headed to my room to get dressed. I needed to see Valerie. Valerie was the only
    one who could help me make sense of the shadows surrounding Mickey''s past.

