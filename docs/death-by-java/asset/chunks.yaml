  trans: '

    我们谁都没有。“米奇，”我说。这种期待感快要把我逼疯了。“那天晚上你看到谁了？”


    他的双手都握成了紧紧的拳头。他说话时，是咬着牙关说的。“艾伦，”他说，“瓦莱莉的前丈夫。那天晚上，他就一直站在 `Death by Java` 外面。从他的样子来看，他是在等某人。”


    # 23


    当我正准备爬回爸爸的车里时，手机响了。


    “嘿，爸爸，”我当作是回答，“抱歉我刚才那样不不打招呼就走了。临时发生了一点事。”


    “你去哪儿了？”他的声音里有一丝轻微的担忧。“保罗和我刚离开办公室，你就不见了。顺便说一句，你还开着我的车。”


    我纠结要不要编造一个急要去商店的故事，但我改变了主意。我需要和 `Aaron Middleton` 谈谈，我不想一个人去。


    “`Mickey Robbins` 打过电话，”我说，“他想让我 `Village Park` 跟他见面。”


    沉默了短短片刻，“然后你一个人去了？”


    “那是公共场所。他给我买了一个椒盐饼。”好像这就能让我那冒险的失踪行为变得合理了。“他想澄清一下关于他的某些传言。”


    “他是这么说的吗？”


    我考虑了一下。`Mickey` 完全可以对他的过去、他对他朋友死亡的牵葛撒谎，但我认为他不会。“确实是这么说的。我不认为他杀死了 `Lyle Carrigan`。”


    “噢？”爸爸的声音里充满了真诚的好奇。“那是谁？”


    我看了了一眼带回车里的椒盐饼。它放在副驾驶座上，还没吃。如果我要向 `Aaron` 质问 `Mickey` 关于他的那些话，这可算不上什么好的证据。


    但爸爸……


    “保罗还在那儿吗？”我问，“我是说，在听力范围内吗？”


    听到一声轻微的*咔哒*声，我以为是门关上了。“他在客厅。我告诉他我会给你打电话，看看你跑到哪儿去了。我现在在办公室里。”停顿了一下，接着说，“你需要我做什么？”


    “首先，别告诉保罗我去哪儿了。”


    “我不会的，”爸爸同意道，“但*你*下次见到他时应该告诉他。”


    “我知道。我会的。但还没到时候。”我的脑海中飞速旋转着各种可能性。“个关于你为什么得离开的故事。比如你的车坏了，你需要见我，也许我们可以一起等拖车吧。”


    “他会想来的，”爸爸说，“如果车坏了，我走路去见你也太不合理了。”


    “我不知道。随你怎么编怎么编，”我说，“只是……别让他来。”我说这话时缩了缩脸。我不认为保罗会干预我找 `Aaron` 谈话的计划，但他不会为此高兴。而且，就像对
    `Mickey` 一样，我怀疑如果有一个警察（即使是一个在 `Village` 没有管辖权的警察）在听他说话，`Aaron` 会不会开口。


    不，这是我必须做的事，虽然不是完全独自，但不需要官方的支援。


    “我会想办法的，”爸爸说，“我们要去哪儿？”


    我差点就告诉他了，但我忍住了。我不认为爸爸会泄密，但告诉他意味着当他不可避免地被问及去哪儿时，他将被迫对保罗撒谎。他现在的说法已经在夸大事实了。没必要让情况更糟。


    “等我去接你时再告诉你。大约五分钟后，我会在街头的 `Kemp` 家子外面等你。”


    “我想我可能需要更长时间才能在不引起怀疑的情况下脱离这里。”


    “没关系。我可以等。”


    我挂了电话，脑子里一片空白。我觉得自己快要发现是谁杀了 `Lyle` 了，那种追逐的快感开始占据主导。是的，我知道我所做的很有风险。是的，我知道我应该直接给
    `Detective McKensie` 打电话，告诉她 `Mickey` 告诉我的一切，让她处理。


    但如果我错了，就会浪费她的宝贵时间，反过来可能让杀手逃脱。而且，我又不是冲到 `Aaron` 面前让他承认杀杀了 `Lyle`。问几个问题不会伤害任何人，特别是如果我把这些问题包装成关于他与
    `Valerie` 关系的问题。


    我发动汽车，开了短段路去 `Valerie` 父母家。我在路边停下停好，但没有熄火。爸爸还没到，所以我向后坐好，一边嚼着 `Mickey` 买给我的椒盐饼，一边梳理我已知的信息。


    `Lyle` 一直和 `Marco` 合作，后者想搬迁经营地点。他利用 `Tito’s Deli` 的人来帮助破坏生意，制造一些他可以引用的健康违规问题。假设他在
    `Death by Java` 也做了同样的事。由于某种原因，`Lyle` 最终死掉了。是因为他的同谋者背叛了他？还是因为他们的计划被发现了？我不知道。


    但 `Aaron` 在谋杀案发生的晚上就在 `Death by Java` 外面。这意味着他在死亡时间附近出现在了作案现场。即使他没有杀掉 `Lyle`，也有可能
    `Aaron` 看到是谁杀了他了，尽管他自己还没意识到。


    当爸爸快步走过人道走过来时，我正准备从座位上跳起来。

    '
- fmt: '

    Aaron ran a hand over his mouth, eyes flickering between us, before he stepped
    aside. “I can spare fifteen minutes max, then I really need to go.”


    Dad and I entered the house. I wasn’t sure what I’d expected, but I was surprised
    to find his home clean and moderately well-furnished. I wondered if the paintings
    on the walls and the semi-fancy furniture spread around the rooms was Valerie’s
    doing, or if Aaron had more depth, more taste, than I gave him credit for.


    He led us into an eat-in kitchen and motioned for us to sit. Without asking, he
    grabbed a trio of Cokes from the fridge and handed them out before he, too, sat,
    though he perched at the edge of his chair like he might up and bolt at any moment.


    “What did Hugh say?” he asked. He tried to make it casual, but it came out strained,
    worried.


    “You blocked Mickey’s number on Valerie’s phone,” I said. “And vice versa.”


    He cracked open his can and took a drink before responding. “He told you all that?”


    “I’d already found the number blocked on Valerie’s phone,” I said. “I pressed
    him about it, so don’t blame him.”


    Aaron’s nod was slow. “And he ratted on me.”


    It wasn’t a question, but I spread my hands, as if saying, *I’m here, aren’t I?*
    anyway.


    Aaron eyed me for a long time, then seemed to make up his mind about something
    because he shrugged dismissively. “We had the opportunity, so we took it. No crime
    in that. You know how close Valerie and I used to be. Mickey’s got her all tied
    up, and she doesn’t realize what he’s doing to her. Hugh and I just wanted to
    speed their downfall along, that’s all.”


    “And then, once their relationship was over, the two of you would swoop in,” I
    said.


    Aaron’s smile was chagrined. “Or at least try. You gotta understand, I made a
    mistake when I was younger. I’m still paying for it. But I’ve changed, I really
    have. Once Valerie sees it, she’ll practically beg me to take her back. I won’t
    have to force her or even convince her. I just have to be there for her when she
    needs me.”


    “But there’s Hugh,” I pointed out. “He cares for her just as much as you do, and,
    like you, he’s already been in a relationship with her.”


    “Yeah, but he was”—he gestured vaguely in the air—“a fling. Something different.
    You know, like you eat Rocky Road ice cream all the time, then you want to try
    plain old vanilla and see how it tastes. It’s fine for a little while, but it’s
    not what you really crave. Before long, you’re back to your chunky, chocolaty
    comfort.”


    “What does that make Mickey?” Dad asked. When I glanced at him, he gave me a subtle
    shrug.


    Aaron sighed, set aside his can. “Mickey’s off-brand. He looks good when you see
    him in the store, sitting next to your old favorite, but he can’t compete with
    the real thing.”


    I decided to move on from ice-cream terms and pushed in another direction. “Do
    you think Mickey killed Lyle?”


    Aaron met my eyes. His gaze didn’t waver when he said, “I do.”


    “Did you know Hugh and Valerie were there late the night before? They left a little
    after closing time.”


    “They do that,” Aaron said, seemingly unbothered by the fact that his “competition”
    was spending late nights alone with his ex-wife.


    “Do you know if they were there the night Lyle died?”


    “How would I know that?” he asked. “I suppose they might have been. It’s not like
    I’m keeping tabs on her.”


    “I don’t know,” I said, playing it cool. “Since you were there that night, I assumed
    you might have seen her or Hugh around.”


    His blink was slow and measured. “Where’d you hear that?” He reached for his Coke,
    then pulled his hand back without grabbing it. His leg started jigging up and
    down beneath the table. When neither Dad nor I answered, he said, “There’s nothing
    wrong with being there. It’s not like I know anything.”


    “So, you *were* there?” I asked.


    He reached out again, this time picking up his Coke. When he took a drink, I noted
    his hand was shaking.


    “Aaron,” I said, “if you saw something that night, you should tell someone. Even
    if you don’t think it’s important, it might be. And if you and Lyle got into a
    fight—”


    “We didn’t,” he said, cutting in with a sharp shake of his head. “I never saw
    Lyle, didn’t know he was going to be there. I …” He squeezed his eyes closed,
    his entire body tensing. “Don’t tell Valerie.” When he opened his eyes, he looked
    worried. “Please. I’ll explain everything. Just … don’t tell her, okay?”


    I mimed crossing my heart, but I didn’t verbally agree. If Aaron’s actions had
    somehow caused Lyle’s death, the police would need to know, which would mean Valerie
    would eventually find out, no matter what I promised him.


    Aaron swallowed hard, causing his Adam’s apple to bob. He considered me, then
    Dad, then seemed to come to some sort of decision because his entire body sagged.


    “I was looking for someone else that night.”


    “Who?”


    “A girl. Doesn’t matter.”

