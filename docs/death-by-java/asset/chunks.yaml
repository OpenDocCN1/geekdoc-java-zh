  raw: 'The breeze felt good on my skin as I stepped outside. Cars rolled down the
    street, most obeying the speed limit, though a few were pushing it. Pedestrians
    passed me by at a regular clip. Death by Java *did* sit on a good corner. Business
    should be booming. Judging by the mostly full tables I could see through the windows
    at Tito’s, the deli was doing just fine. Better. It was doing great.


    And yet, Death by Java hardly garnered a glance from passersby. Months of poor
    service, of questionable cleanliness, had killed any and all interest in the place.


    But it felt like there was more to it than that. There were all sorts of places
    with dirty tables, with less-than-enthusiastic employees, that chugged along perfectly
    fine despite their shortcomings. Same went for the many businesses that were getting
    dinged for health violations. Lyle had gone into Tito’s, and yeah, he’d been tossed
    right back out, but I was pretty sure he’d given them bad marks with how Tito
    had treated him. The customers didn’t seem to care.


    So why was Death by Java struggling so mightily?


    I studied the deli as I called Paul on my cell. My mind was churning slowly over
    the possibilities, including ones that had Lyle getting killed for playing favorites
    of some kind. He answered on the second ring.


    “Hi, Buttercup.”


    “Ew. Don’t do that,” I said, making a face.


    Paul laughed. “It didn’t come out as naturally as I hoped.”


    “I don’t want it to,” I said. “From Dad, I’m used to it. You? I’m perfectly fine
    with ‘Krissy’.”


    “Noted. Are you all finished up there, *Krissy*?” He purred the name, causing
    a shiver to run down my spine—the good kind.


    “All done,” I said as a skateboarder rolled past. Somehow, he didn’t run into
    anyone on the semi-crowded sidewalk. “I was thinking we could have lunch with
    Dad and Laura at Tito’s Deli.”


    “That’s the place next to Death by Java?” he asked.


    “It is. Since I’m already here, I could get us a table. I’m beat and really want
    to sit down.”


    There was a brief moment of silence when I just *knew* Paul was thinking I had
    ulterior motives for our lunch, and I supposed he was right. I wanted to ask Tito
    about Lyle, though I’d need to do so in a way that wouldn’t make him suspicious.


    *Good luck with that.*


    “Give us fifteen minutes,” Paul said. “I’ll run it by James and Laura and make
    sure they don’t have other plans. Either way, we’ll meet you there.”


    “Great. I’ll be waiting.”


    I clicked off and then walked the short distance to Tito’s Deli. The inside was
    cool and inviting, if not a smidge cramped, especially at lunchtime. The tables
    were a little too close together, and since nearly every one of them was full,
    walking space was nonexistent between the occupied chairs.


    I spotted an empty table across the room and was forced to take the long way around
    to reach it. Mustard was smeared across the top of the table, and a balled-up
    napkin was sitting next to it. There were only three chairs. The fourth had been
    nabbed by a group of five dude-bros with backward baseball caps and smarmy grins
    who were crowded around a nearby table meant for four.


    Still, it was all that was left, and I hoped that by the time Paul arrived with
    Dad and Laura, they’d be gone and I could retrieve the chair.


    “Sorry, sorry.” A petite teen with corn bread–colored hair rushed over to the
    table. Freckles covered her face, which only served to accentuate her blush as
    she wiped down the table. “We’re really busy, and I got caught up with the dishes.”


    “It’s fine.”


    She flashed me a smile, revealing her braces. “This will take just a second.”


    I waited until she finished cleaning the table before asking, “Is Mr. Adornetto
    in?”


    Panic washed across her face, and her hand went to her name tag, as if she might
    cover it. *Birdie.* From what little I’d seen of the girl, the name fit.


    “I’m not going to complain,” I said, giving her a reassuring smile. “This is about
    something else. Promise.”


    The look she gave me was uncertain, but she nodded. “He’s in the back. Do you
    want me to get him for you?”


    “Please.” I sat, still smiling.


    Birdie flittered there a moment longer before she hurried toward the back. The
    next table over, the dudebros burst into a round of laughter and elbowed each
    other as if one of them had cracked the most amazing joke. It earned them dirty
    looks from nearly all the other tables, but they didn’t deign to notice.


    My phone buzzed. I glanced back to make sure Tito wasn’t coming before checking
    the screen. Unknown, but local number. I frowned, and then, with one more glance
    back, I answered with a curious, “Hello?”


    “Krissy?”


    The voice was vaguely familiar, but I couldn’t place it. “Speaking.”


    “It’s Larissa.” A pause, and then, as if the moment she’d spoken her name hadn’t
    hit me like a nostalgic ton of bricks, she added, “Larissa Sweeny.”


    “Larissa! Hi!” I choked back a sudden tear. Larissa was one of my old high school
    friends, one of the ones I’d lost contact with long ago and had hoped would be
    at Bray’s reunion. “It’s been forever.”


    “It has.” I could hear the smile in her voice. “I got your number from your dad.
    I hope it’s okay.”


    “Yeah, sure. Of course.” I glanced back. Tito still wasn’t on the way, which meant
    I had a moment to talk. “I’m glad you called.”


    “Me too.” There was a smile in her voice. “I can’t talk long, but I wanted to
    check in and see if you might want to get together while you’re in town. We heard
    about the reunion Bray Eckles was throwing and that you’d be there, but we couldn’t
    make it.”


    The *didn’t want to* was implied to take the place of *couldn’t.*


    I also noted the “we.”


    “Renee?” I asked, hopefully.


    “Renee especially.” A laugh. If anyone had hated Bray Eckles in high school, it
    was Renee Weaver. “We were hoping you might want to meet tomorrow night. Dinner
    at Redwood Tavern? It’d be just the three of us.” A pause. “Kind of like old times.
    We’d just be missing Vicki.”


    A looming presence informed me that Tito had come out from the back and was heading
    my way. “That sounds great. Yeah, I’d really like that.”


    “Great! Does eight work?”


    “It’s perfect.”


    Tito rounded the table to stand in front of me, arms crossed. He looked like a
    man who wanted to get back to work. Up close, he looked as intimidating as when
    I’d seen him throwing Lyle out of his deli. His eyes were dark brown, slightly
    pinched at the corners, and he had frown lines around his mouth that told me he
    spent a lot of time scowling.


    “I’ve got to go, Larissa. It was great hearing from you. I’ll see you tomorrow
    night.”


    “Yeah.” A pause. “I’m glad we’re doing this.” And before I could comment on that,
    she was gone.


    I turned off my screen and set my phone facedown on the table. “I’m sorry to bother
    you, Mr. Adornetto. I’m Krissy Hancock.”


    “Call me Tito. Was there something wrong with your service, Ms. Hancock?” He glanced
    at the clean table, noted the lack of food in front of me. “We are rather busy,
    so if it’s taken longer than usual, I apologize.”


    “It’s not about the service,” I said. “This is about something else, if you have
    a moment.” I motioned toward the chair across from me. “Please.”


    Tito sighed. “Look, I’ve got a business to run here. And as I mentioned before,
    we’re very busy.”


    “I understand,” I said. And then, quieter, “It’s about Lyle Carrigan.”


    Tito went still, seemed to stop breathing, and then he abruptly sat. “I have five
    minutes.”


    Five minutes should be more than enough, though it did mean I’d have to get straight
    to the point. “As you know, he was murdered.”


    Tito scowled and made a *get on with it* gesture.


    “I’ve been helping Valerie Kemp over at Death by Java, and while I’m not a cop,
    I do have an interest in finding out who killed Lyle.”


    “Good luck with that,” Tito said, crossing his arms as he sat back. “Lyle made
    enemies. Ms. Kemp and her muscle-bound idiot are two of them.”'
