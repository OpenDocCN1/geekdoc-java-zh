  trans: '


    “那么……”我从娜迪亚看向法拉，“你们中有人能帮我大声叫一下瓦莱莉吗？”


    沉默了一刻后，娜迪亚说道：“好。。我去叫她。”


    娜迪亚转过身，*咯哒*着走向后方。法拉盯着我看了会儿，然后从她粉色裙子下面的某处掏出一部手机。她点了几几次，粉色的指甲敲击屏幕时发出*咯哒*声，听起来像是在上面划划着。


    “我猜粉色是制服的一部分？”我问道，换来了一个半带的微笑和一个微妙的点头，我以为那是认同。“你喜欢在这里工作吗？”


    “还行吧。” 接着，她并不怎么显眼地向我后退了一小步。


    *行吧。* 我领会了意图并不再提这件事，而是选择对用餐区进行一次更彻底的巡视。尽管快要营业了，但地板上已经有了垃圾，一个座位上还有一抹看起来像巧力的污渍。洗手间的标志上挂着一个蜘蛛网，我注意到其中扇门没有完全关上，留下了一个任何人都可以窥视的缝隙。我决定不去去看洗手间隔间的情况如何，至少现在不想。


    我朝往前走回，沿路捡起咖啡杯并扔进垃圾桶。法拉透过手机上方看着我，神情中是不赞同，但当我弯腰捡起一张揉成团的纸巾扔掉时，她并没有叫我停下。


    过了五分钟，娜迪亚才回来。瓦莱莉紧跟在她身后飘了了出来。


    “克丽丝？”瓦莱莉绕过柜台来到我身旁。她穿着平底鞋，打扮比我上次见到她时少张扬了一些，尽管牛仔裤很紧且有时尚的破洞，她的衬衫洁如雪，暗示着她打算避免任何脏乱的工作。“你在这里干什么？”


    “你好，瓦莱莉。我想了你昨天说的话，然后……”我张开双臂。“我在这儿。”


    当她露出那种虚假的微笑时，鼻子皱了一下出卖了她的心思——那是她试图礼貌、但比任何时候都显得傲慢的笑。“那太棒了。不过现在确实有点不对。”


    “你们的制冰机。”顺着她的点头，我说，“我进来时听到你和莱尔在谈这件事。”


    “我不知道发生了什么。”她发出一声焦躁的。“我昨晚离开时还好好的。我甚至在关门后回来了一趟，因为我忘了——”


    她突然停住，看了我一眼，仿佛我试图诱唆她犯某种犯罪似的。“噢，管那干什么。我离开时一切都井井有序。你在这里时检查过制冰机吗？”


    “嗯，没没*检查*过。但我在后方，所以我看到了。地板上没有水，我也听到它在制冰时发出了那种嘈杂声。”我考虑了一下，然后问：“你几点离开的？”


    “我不知道？也许六点吧？我没留意时间。六点在我去散步之前很久了。我在天快黑时路过这里，看到后方有一盏灯，以为也许是——`不。” 她的眼睛再次闪躲开。“我离开时灯还是亮的。[此处原文重复：当我弯腰捡起一张揉成团的纸巾扔掉时，她并没有叫我停下。修正为：当我弯腰捡起一张揉成团的纸巾扔掉时，她并没有叫我停下。]“这里没人，”瓦莱莉强硬道。“灯没开。”法拉的眼睛从手机上移开。她极短地摇了摇头，然后又回到她忙的事情上。“看到吧？”瓦莱莉转向我。“没有。正如我所说，你一定搞错了。也许你看到的是隔壁的反射，或者以为是这里的灯。”我想继续说下去，但为什么呢？她显然不相信我，或者至少不承认她可能比说的要晚。*也许是她自己破坏了自己的机器。*
    但至于她为什么要那样做，我完全不知道。“如果就这样的话……”瓦莱莉向我离开。“我真的有很多事要做。我正在等修理工，我还有事情要处理。”打电话叫他来的冲动很强烈，但我知道如果现在离开，我会后悔的。我来这里是有目的，尽管瓦莱莉在顾闪——还有态度——我想把这件事解决。


    “我对着店里进行一次彻底的巡视怎么样？”我问。“我会列一份清单，并就你如何改进提供一些建议。你确实想吸引更多顾客，对吧？这就是我们这样做的方法。”瓦莱莉做了个表情，仿佛一想到我在她的书店里转悠就让她感到恶心。然而，在她拒绝这个想法之前，门开了，一个看起来像冒充修理工的舞男走了进来。他衬衫上面的三个扣子没扣，露出古铜色、无毛的胸膛。腰间松松地挂着一条看起来从没用过的工具带。他穿着短裤和凉鞋，左脚踝上戴着那种绳结脚链。


    “罗马！谢天谢地你来了。”瓦莱莉转过身冲向他。“我简直快要担心疯了。”


    “嘿，宝贝，”罗马大笑着说，露出了整齐、珍珠般洁白的牙齿。“看起来是什么问题？”


    “在后方。”于是他们一起离开了。


    在被遗弃后，我决定直接开始我的巡视，无论瓦莱莉是否许可。


