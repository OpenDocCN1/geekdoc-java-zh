    “The bad news isn’t really *bad* news, per se. Lena was here because she had to
    put in her notice. Hard to work at a bookstore café when you’re spending most
    of your time patrolling the streets, hunting for criminals.”


    “True.” I let myself feel sad for a couple of seconds before shaking it off. “I’m
    going to miss having her working behind the counter, but she’s doing what she
    wants, and that’s what matters. Besides, she’ll probably be in daily for coffee.
    It’ll be like she never left.”


    “I agree.” Vicki huffed out a sigh, and I imagined her pushing her way to her
    feet. “I should get going. I just wanted to let you know that everything’s good
    here. You should get back to enjoying your vacation.”


    “I’ll do that.” Or, at least, I would as soon as I stopped worrying about things
    I couldn’t control.


    “I’ll talk to you when you get back, Krissy,” Vicki said. “And then you can tell
    me all about what’s going on in the Village.”


    “Oh, I will. You’re not going to believe the half of it.”


    “Knowing you, you’re probably right.”


    We both laughed as we disconnected. Before I could set my phone down, the door
    opened, and Paul walked through, hands shoved deep into his pockets. He looked
    like a man who’d just been caught coming in after a late night at a bar. As soon
    as he saw me, his face flushed red.


    “Hey,” he said, eyes flickering past me, toward the empty living room. “Where’s
    James?”


    “In his office.” I stood. “Have a good time?”


    He shrugged, looked even more chagrined. “It was okay. Glad to be back.” He removed
    Dad’s keys and set them on the table before returning his hand to his pocket.


    I narrowed my eyes at him. Something was up. “How’s Detective McKensie?” I was
    fishing, but what else could it be?


    Another shrug. “Dunno. Haven’t seen her. Ah!” Relief washed over him as Dad exited
    his office and headed our way. “I need to borrow your dad for a moment,” he told
    me before, “James, can we talk?”


    “Of course,” Dad said with a flourish and a bow. “Please, step into my office.”


    “Don’t mind me,” I said. “You can talk out here. I’m done with my calls, so you
    won’t bother me.”


    “That’s all right.” Paul kissed me on the temple before crossing the room to where
    Dad waited. “This will take just a minute.”


    I opened my mouth to argue, but my phone buzzed in my hand.


    “Go ahead and take that,” Dad said. “Then we can all find a nice place to eat
    and maybe catch a movie or something. Or we can grill out. We have everything
    for it now, so why not?”


    “I could go for a burger,” Paul said.


    “Perfect,” Dad said, then the two of them headed back to Dad’s office to talk.


    Without me.


    With a frustrated sigh, I answered the call. “This is Krissy.”


    No response.


    “Hello?” I glanced at the screen, noted the local number, and then put the phone
    back to my ear. “Is anyone there?”


    More silence. I was about to hang up when there was a heavy sigh from the other
    end, followed by a groaned, “Yeah.”


    *I know that voice.* My senses immediately went on high alert. “Mickey?”


    Another, “Yeah.”


    I waited a beat, then prodded him. “You called?”


    I expected another “Yeah,” but got a sigh instead.


    I could have been annoyed, but I wasn’t. Mickey Robbins calling me was a good
    sign. It meant he had something to say. About the murder? About Valerie? I had
    no idea, but I figured it had to be about one of those topics. Maybe both. His
    reluctance to speak, despite being the one who’d called, told me that whatever
    he had to say was a big deal.'
