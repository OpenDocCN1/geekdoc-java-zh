    “It’s …” She shot another worried glance at Farrah. “Dee has called off a few
    times recently. Now Nadia can’t come in. I swear, I’m paying them enough, but
    what if they’re looking for new jobs? It’s already hard enough with just the three
    of them. I don’t know what to do!”


    “What *are* you paying them?” I asked. I recalled a time when Valerie had called
    me months ago, asking what I paid my own employees because she wanted to pay her
    own less than minimum wage.


    “That’s not really important,” Valerie said. “The financials—”


    “I’m not the person to ask about something like that,” I said, and I meant it.
    Vicki was the one who dealt with the money and the business side of things.


    “Yes, but …” Valerie’s voice turned to a buzz as I glanced back at Dad.


    “Hold that thought,” I said, before marching over to the table. “Rita?”


    “Yes, dear?” she replied.


    “You’re at Death by Coffee.” A statement because I could see that she was. “Is
    Vicki there?”


    Rita blinked at me. “Well, I suppose she is. At least, she was a few minutes ago.
    If you’re worried about the lights, they’ve been on since I got here. No power
    fluctuations at all, though there was a tiny little dimming when I first came
    in that I took for my eyes adjusting, so I could be wrong about that.”


    “Could you get her for me?” I asked, ignoring the bit about the lights. I so didn’t
    need to be worrying about that right now. “Please.”


    Rita looked stricken, but nodded. “Of course, dear. This won’t take long, will
    it?”


    “It shouldn’t.” I smiled at her. “Thank you.”


    Rita vanished from view as she stood and walked over to the counter, where Eugene
    waited.


    “What’s going on?” Dad asked.


    I shook off the question as Vicki appeared on-screen, Rita at her heel.


    “Hi, Krissy. Having fun? James.”


    “Hi, Vicki. It’s good to see you,” Dad said.


    “Can I borrow you for a minute?” I asked. “Valerie has a few questions about finances.
    I’m not sure how to answer her, and I figure it might be better if you talked
    to her.”


    In the background, Rita said, “With *my* tablet?”


    “Visuals might help,” I said. “You could look her in the eye and see if she’s
    trying to pull one over on you.”


    “Sure,” Vicki said. “I’ve got a few minutes, if it’s okay with everyone else?”


    “Fine by me,” Dad said. “I’m sure Rita won’t mind.”


    “Of course not, dear. You go right ahead. James and I can finish our conversation
    later.” Though I could tell from her tone, she wasn’t happy.


    With permission granted, I picked up Dad’s tablet and carried it over to Valerie,
    who took it with a perplexed, “What’s this?” just before it registered who was
    on the screen. “Vicki? Is that you?”


    Without bothering to explain myself, I returned to where Dad sat. I slid into
    the chair across from him. “Sorry about that. She’ll bring it back in a few minutes.”


    “No, it’s all right.” Dad cupped his chin in his hand and gave me an expectant
    look. “Now,” he said, “mind telling me what happened last night that caused you
    to rush off to who knows where this morning? And, Buttercup, don’t leave anything
    out.”


    # 17


    Business at Death by Java continued to be nonexistent during the ten minutes it
    took for me to go over my night at Tito’s house and subsequent morning jaunt to
    the Redwood Village Police Station to talk to Detective McKensie. Valerie returned
    just as I was finishing up, and she handed over Dad’s tablet with a muttered thanks
    before stomping off to the back. Apparently, she hadn’t come away happy from her
    conversation with Vicki, which wasn’t much of a surprise, considering Valerie’s
    reticence to pay her employees a living wage.


    “Rita’s not going to be happy,” Dad said, waggling his tablet. “I expect to hear
    from her at any moment.”


    As if cue, his phone *ding*ed. He checked it, showed me Rita’s, *They hung up
    on me!* text, and then he took a moment to respond. Another *ping* followed. And
    then another.


    “She’ll keep texting you until you call her,” I said.


    “You’re probably right.” He heaved a resigned sigh. “Give me a few minutes to
    smooth things over with her, and then we can head home.” He stood and moved to
    the empty bookstore portion of the café, though he could have made the call sitting
    in his seat and not disturbed anyone since there was quite literally no one else
    in the dining area but me and Farrah, who was perusing her phone behind the counter.


    I peered at the window toward Tito’s Deli, curiosity smoldering just under the
    surface. I wondered if Tito was inside, and if Detective McKensie had arrived
    while I’d been talking to Dad. I could go over and have a look around, but what
    then? If Tito was there and he recognized me as his trash thief, there’s no telling
    what he’d do. Not only that, but Dad was with me. And Paul and Laura were likely
    on their way back to Dad’s by now, if they weren’t there already.


    The door to Death by Java opened. I glanced back to see Roman Haines walk through
    the door.


    “Hi, Krissy. Having fun? James.”


    “Hi, Vicki. It’s good to see you,” Dad said.


    “Can I borrow you for a minute?” I asked. “Valerie has a few questions about finances.
    I’m not sure how to answer her, and I figure it might be better if you talked
    to her.”


