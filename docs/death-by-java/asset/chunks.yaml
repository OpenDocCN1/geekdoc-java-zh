    “Of course not, dear. You go right ahead. James and I can finish our conversation
    later.” Though I could tell from her tone, she wasn’t happy.


    With permission granted, I picked up Dad’s tablet and carried it over to Valerie,
    who took it with a perplexed, “What’s this?” just before it registered who was
    on the screen. “Vicki? Is that you?”


    Without bothering to explain myself, I returned to where Dad sat. I slid into
    the chair across from him. “Sorry about that. She’ll bring it back in a few minutes.”


    “No, it’s all right.” Dad cupped his chin in his hand and gave me an expectant
    look. “Now,” he said, “mind telling me what happened last night that caused you
    to rush off to who knows where this morning? And, Buttercup, don’t leave anything
    out.”


