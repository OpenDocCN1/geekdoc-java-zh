    “We should talk,” he said after a couple of excruciatingly long seconds. “Face-to-face.”


    I glanced toward where Paul and Dad had gone. “When?”


    “Now, if you can manage it.”


    Dad’s keys were sitting on the table. I could be gone before anyone was the wiser.


    *Is that such a good idea, Krissy?*


    No, it wasn’t. But I desperately wanted to know what Mickey had to say, and if
    I told Dad or Paul where I was going, they’d insist on coming. And if they came
    with me, chances were good that Mickey wouldn’t talk. He’d called `me` for a reason.


    “Where?” I asked.


    “Do you know Village Park?”


    “I do.”


    “I’ll be there in five minutes, sitting on one of the benches.” A pause, and then
    the all-too-dramatic, “Come alone,” before he clicked off.


    I didn’t hesitate. I snatched up Dad’s car keys and all but sprinted out the door.


    As promised, Mickey Robbins was seated on one of the numerous benches in Village
    Park, picking at a pretzel from Walt’s and tossing the chunks into the grass,
    though there were no squirrels or birds there to eat it. Another wrapped pretzel
    sat on the bench beside him. I assumed it was for me.


    “Mickey,” I said as I approached. I didn’t sit right away. He appeared harmless
    with the pretzel in his hands, but he `was` a big guy. He could tear me up and
    toss me to the birds just as easily as he was doing to the baked dough.


    “Hey.” He scooted over even though there was more than enough room for me. “I
    got you one. You don’t have to eat it if you don’t want.”


    “Thank you.” I picked up the pretzel and sat. “I’ll save it.”


    He shrugged, kept his eyes forward. “Up to you.”


    “You wanted to talk?” I prodded after a few moments of watching him tear tiny
    pieces of the pretzel off. The ground was littered with chunks, telling me he’d
    been at it for a while—and he’d likely gone through more than one pretzel in the
    process.


    “I talked to Valerie,” he said, glancing at me side-eyed. “From what I gather,
    I have you to thank for that.”


    “It was no big deal,” I said.


    “Sure. Right.” He sniffed, ran a hand across his nose. “It was good to hear her
    voice, but I realized …” He shook his head, brow furrowing. “She asked me about
    my past. That’s another thing I have you to thank for.”


    “I wasn’t trying to—”


    He waved me off with one big hand before going back to destroying the pretzel.
    “It’s fine. It was good to get it off my chest.” He huffed, tossed what was left
    of the pretzel into the grass. “But I did want to clear the air with you. Don’t
    know why, but I do.”


    “Okay?” I said, making it a question.


    Mickey stared off into the distance for a long moment before he spoke. His voice
    was slow and measured, like a man reliving something he didn’t want to. “I was
    just a kid. Maybe nineteen. Twenty. Hard to recall since I really don’t want to
    remember it, if you get me?”


    I nodded, let him continue.


    “I was just getting into lifting, though I’d always been pretty big without it.
    Strong. You know, genetics.” He chuckled. “Met a few guys about my age who were
    into the same thing. They had other interests I wasn’t too keen on, but when you’re
    young, you can overlook stuff like that. It’s nice to have someone you can do
    things with, you know?”


    I did. “I take it that it was one of those guys who died?”


    His nod was slow, almost sad. “I don’t know what happened, really. We were out
    at an hour when most smart people were tucked away in bed. But we were young and
    dumb.” His jaw firmed. “I guess I still am.”


    “Mickey …”


    He waved that big hand of his at me again. It took me a moment to realize it was
    the same one he’d injured punching the ice machine. “When you’re that age, you
    take chances. You think you’re invincible. I was that way back then, though I
    tended to be the quieter one of the crew.” He laughed. “Imagine that, right?”


    The sound of a skateboarder rolling by somewhere behind us caused him to fall
    silent until the sound of the wheels on the pavement faded away. Only then did
    he continue.


    “We were messing around on top of some building. Well, the guys were, anyway.
    I’d gotten into a scuffle with one of them, a guy we called `Scrat`. I can’t even
    remember how he got the name.” He gazed off into the distance. When he continued,
    he was no longer speaking to me. “‘Scrat` was all wiry. Could lift more than you’d
    expect for his size. Won a few bets at the gym because of it.” He sighed. “Anyway,
    `Scrat` held his own against me when we fought, bloodied my nose and blackened
    my eye while I only managed to scrape his knuckle with my tooth.”


    “Then he ended up dead,” I said, putting it together quickly. “And the police
    blamed you because of the fight.”


    “Yeah. He fell. I don’t know how it happened, or if anyone was responsible for
    it. I was there, but I wasn’t, if you know what I mean? I suppose I was pouting
    while.”

