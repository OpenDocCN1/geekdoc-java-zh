    马可脸上的怒气消退了一些。“那么那个杀手下一个可能就要轮到我了。”他的皱眉变成了深思的凝锁，“意味着我可能处于危险之中。”


    “没错，”我说，“如果有人发现了你俩在密谋要做的什么事——”


    “我们可不是‘密谋’，”马可粗鲁地反驳道，但语气没什么力气。他松开了对椅子的死死抓握，坐了下来，“我们是在纠正不公。”


    父亲和我交换了一个眼神。他细微的点头示意我可以继续追问下去。“发生了什么事，马可？”我问道，“我知道你和莱尔是朋友。但‘纠正不公’？我们谈论的是一种什么样的交易？”


    马可叹了口气，揉了揉脸。他花了几乎整整一分钟才开口。“曾有一段时间，村庄的这片地区是热门地点。我刚开业时，那里完美极了。生意极好，顾客源源不穷。”


    “但时代变了，”父亲说。


    “确实如此。这是一个缓慢的过程，镇上这一端变得越来越没有吸引力，而在另一端，更便利的地点吸引了企业和游客的目光。没多久，我只剩下老客户了，几乎没有新客户知道我的存在。”


    马可的眼睛闪向了我一眼，又转看向父亲，最后定格在他面前的桌子上。“然后，当那个街角空出来时，我抓住了搬迁的机会。我出了价，但遗憾的是，我输了。”


    “输给了瓦莱莉。”马可极力压制着不满，点头。“‘Java 之死’。”他念出这个名字像在诅咒一样。“我知道她是作弊才进去的，因为她根本没有可能出过我的价。我不说具体是怎么做的，但我确定你完全想象得到。”


    “我不需要想象，因为莱尔几乎把一切都解释得很清楚了。而且，很多男人都很讨厌女性击败他们，无论是在游戏、生意还是其他事情上。这一定让你很心不爽，”我说。


    马可发出一声干笑。“可不是吗。我曾试图向任何愿意听的人讲道理，但交易已经达成了。镇上最好的地段，而那——”他咬紧牙关，从牙缝里挤出来，“那个女人抢走了我的位置并挥霍无度。她怎么可能在那件事上搞砸，我无法理解。我本不需要拉莱尔帮忙，但我不是个有耐心的人。我等不及让她慢慢死去，我本更快地把她赶出那个地方。”


    我脑子中灵光一闪。“你让莱尔给她开具罚单。”


    “不，”马可说。“我告诉他不要做任何违法或不道德的事。只是去那里，好好看看那个地方，然后把她罚到要死。顺便把托托熟肉店（Tito’s Deli）也给报了，并不是因为我对托托有异议，而是我觉得以防瓦莱莉能受住审查，多加一个选项也无妨。他的地方也不错。而且，如果莱尔同时也开了其他企业的罚单，看起来就不像是只针对她的店了。”


    “这就是他那天冲门出去时，你俩在谈论的内容，”我说。


    马可点头得很缓慢、深思。“他说他担心事情变得太棘手，他无法应付了。米奇在逼他，威胁他。”他握紧了拳头。“我告诉他继续坚持，不要让这事困扰他。他被杀是我的错。如果我让他像想的那样退缩，那么也许……”他摇了摇头陷入了沉默。


    事情开始变得通顺了。瓦莱莉无论是否使用了卑劣手段，抢占了黄金地段作为她的书店。马可想要那块空间，他想加速她的死亡。他让他的朋友莱尔——莱尔恰好是个健康检查员——进去挑剔他能找到的每一处违规行为，试图迫使她关门。米奇和瓦莱莉对此感到不快并不为奇。托托也是如此，他和他们一起被进了‘搅拌机’。他们其中一人——我不确定是哪一个——忍无可了，在莱尔毁掉生意之前杀了他。


    但是哪一个呢？有没有可能其他人，无论是休、阿伦还是罗曼，可以代替他介入？


    “还有其他人知道这件事吗？”父亲问道，可能和我想了同样的想法。


    “当然没有，”马可粗鲁地道，“除非莱尔告诉了别人，否则我绝对没说。你知道如果人们发现我正试图关闭镇上的其他企业，即使是那些已经失败的企业，这会对对我产生什么影响吗？我会被当成害群人对待。”


    除了莉安恩，我想不出莱尔可能告诉过其他谁，除了他的同事。但即便如此，和同事谈论强制开具罚单的事，难道不会有让他陷入麻烦的风险吗？


    “等一下。”马可睁大了眼睛。“可能还有一个人知道。”


    父亲是那个提问的人，“那可能是谁？”


    马可思考了一下，然后一边说话一边点头。“我不知道那家伙的名字。事情发生在大约周左右。莱尔在这儿，我们正在聊天。嗯，是他在说话。他变得非常激动并开始大吼。这恰好就在他开始质疑我们的战术并想要停止的时候。通常，他从不提名字，以防有人偷听，但在那天，他提了。”


    他停顿了一下，我紧张得几乎要叫出声来。


    “我记得抬头看了，因为当莱尔在我办公桌前工作时冲进来后，门还敞开着。”他拍了拍面前的桌面。“那个瓦莱莉女人的情人就站在那里。”


    “米奇？”我问。


    令我惊讶的是，马可摇了摇头。“不，不是她的男朋友。是她的情人。”他直视着我的眼睛，那种强度感隔着房间都能感受到。“那个修理工。如果还有其他人知道我和莱尔之间发生的事，那就是他。”


