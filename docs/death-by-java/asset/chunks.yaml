    莉安抠弄着她的指甲。我注意到她的指甲已经变红了，显得局促不安。“那是……我不知道，两年前的事了？也许三年前吧。莱尔当时在外面参加什么培训，我一个人留在这里。因为冰箱出问题了，我给罗马曼打了了电话。他过来后调戏了我。这让我措措手不及，所以我花了一会儿才反应过来，而他却把这当成了邀请。他吻了我，我想我起初可能没有推开，但随后这一切感瞬间涌上心头，我推开了他。我让他离开，但他不肯走。我差点就报警了。谢天莱尔正好在那时候打来电话，在我还没告发他之前，他就匆忙地溜出了门。”


    这并不是罗马曼描述他们之间关系的方式，但我不想去开那个惹麻烦的匣子。“你告诉过莱尔罗马曼做过的事了吗？”


    莉安从指甲上抬起头，注视了我们良久。“即便你对莱尔只有一点点了解，你也会意识到，告诉他那种事情会毁掉他的。他不会怪我，也不会对罗马曼生气。不，相反，莱尔会怀疑自己的价值。明明什么都没有发生，但他总会认为罗马曼之所以出手是因为他知道莱尔是多么不配得，而这与事实大相径远。”她颤抖着吸了一口气。


    内疚感让我站了起来。“对不起，莉安。我不是故意的让你难过。”我示意了一下父亲，他也站了起来。我想问问她罗马曼上一次和她说话时她在生什么气，但现在觉得这还不是合适的时机。“我们可能该走了。”


    她点了点头，领我们走向正门，但没有立刻开门。她站在那里，背对着我们，手按在门把上，一动不动。沉默不语。显然，她在消化某些情绪，我让她自己待。


    “莱尔总是让别人欺负他，”过了一会儿她说。“他的工作导致他与那些被迫他开罚单的企业主之间产生了矛盾。他不喜欢那样，每当事情发生时，他总是会感到内疚。”


    父亲和我相视一眼，等她平复情绪。


    “但最近，情况变得太糟糕了，莱尔开始感到担心。以前我说过他从不抱怨，但那并不完全准确。在过去的几周里，他非常难心。我问他为什么，起初他告诉我没什么。他说他会处理好的。然后，那个男人出现在了外面。”


    “米奇·罗宾斯（Mickey Robbins），”我说。


    她点了点头。“莱尔告诉我关于他的一点情况，关于他为什么对他发火。他说是因为一些他被迫开具的罚单，说那个叫罗宾斯的家伙在保护他的女朋友、妻子或者其他别的什么。但我知道，这不仅仅是一个简单的卫生违规问题就能让那个男人大发雷霆的。我能从莱尔的声音里听出来。”


    “你后来查到到底是怎么事了吗？”


    她摇了摇头。“我打过他的单位，但他们什么都不知道。至少他们是这么说的。莱尔……他……”她深深地颤抖着吸了一口气，然后，“这是我没有告诉警察的事。我不知道我为什么没有说什么。我想我是害怕了。莱尔只是——”她的手抓紧了门把手。“他死了，我想，如果我说了些什么，他的杀手可能会轮到来找我。我以为是那个罗宾斯，或者是罗马曼，因为我拒绝过他不止一次，而是两次。”


    她转过身，眼中满是泪水。“但我不太确定是否如此。你明白，米奇·罗宾斯确实有理由对莱尔发火，尽管当他出现在这里外面时并并这一点。”


    她开了门，侧过身。阳光洒了进来，照亮了昏暗的室内。父亲和我走过莉安，走向光亮。她没有为我们关上门，而是站在那里，泪水顺着通红的脸颊滑落。她按门把的手指节发白。


    “去找马可·罗宾斯吧，”她说，“问问他莱尔以及他们之间的交易。如果有的话，那就是我丈夫去世的原因。如果说有谁该负责，那就是他。”


    然后，她没再多说什么，退后关上了门。


    # 18


    “是的，很抱歉遇到这种事，”父亲对着电话说。“好。嗯。”他看了我一眼，眨了眨眼。“最多一个小时。行。等会见。”他挂了电话，把手机塞进口袋。“我不认为她相信我的。”


    “她当然不信，”我打开车门跨了出去，“轮胎爆胎了？真的吗？”


    “我不知道还能说什么，”父亲在人行道上与我在一起。“我不想告诉劳拉我们要像我小说里的落魄主角一样去追捕杀手。”


    “她知道的，爸爸。她知道。”


    我们并肩走向走不远的意式披萨卷店。食客们坐在外面吃着他们的披萨卷，那些旧的回忆再次涌上脑海。但现在，知道马可·罗宾斯极有可能是个杀手，或者与杀手有关，我再也对那些小方块提不起任何兴趣了。


