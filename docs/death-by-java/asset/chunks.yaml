    “Want some company?” Dad asked. “Laura’s got a thing today, so she’s not going
    to be around much.”


    “A ‘thing’?”


    Dad shrugged. “No clue. She told me about it last night, but I was distracted
    at the time.”


    “You weren’t listening.”


    “I was.” He grinned. “Just not closely.”


    “Uh-huh.” I looked down at my pajamas. “I’m going to get ready and go. This shouldn’t
    take long, so there’s no need for me to drag you along.” And then, because I didn’t
    want him to worry like I was worrying about Paul, “It has to do with something
    Renee and Larissa told me last night. You know, girl talk.”


    “Oh.” He made a face. “I probably don’t want to hear it, then.”


    I gave him a quick kiss on the cheek and said, “Probably not,” though I knew the
    opposite to be true. “I’ll give you the CliffsNotes version of it when I’m back.”


    “You do that.”


    I went about my morning routine in record time and was out of the house within
    twenty minutes of Paul leaving. Since Paul had Dad’s car and Laura had her *thing*,
    I chose to walk to Death by Java, hoping Valerie would be in and that this wouldn’t
    be a wasted trip.


    The walk was invigorating, though by the time I’d reached downtown, I was sweating
    far more than I would have liked. There was little in the way of a breeze, and
    the air felt almost heavy with impending rain, despite there being only a handful
    of white fluffy clouds in the sky. Maybe it was my mood more than any actual incoming
    inclement weather.


    Death by Java was unsurprisingly slow. At least there were a few customers in
    the dining area, sipping at their coffees, which was an upgrade to how it had
    been as of late. No one was behind the counter when I entered, though I did spot
    Dee, dressed in the hated pink dress, kneeling on the floor beside a bookshelf.
    I joined her, but I kept my distance when I saw she wasn’t alone.


    “Hi, Ms. Hancock!” Dee said, popping to her feet. Oscar was curled up in a new
    cat bed, looking as grouchy as ever.


    “Dee,” I said. “Oscar is back from the vet, I see.”


    “He is.” She grinned. “He’s all checked out and passed with mostly flying colors.
    I have some medication to give him, but I can crumble it into his food and he
    doesn’t seem to notice. He wolfs it down no matter what.”


    “That’s good to hear.” The cat looked better too. He looked as if he’d been given
    a bath and had his nails trimmed. Another couple days of pampering, and he might
    look like any other house cat. “His paw okay?”


    “Yep. The vet said he probably got underfoot and was stepped on or that he could
    have leapt from too tall a height. He was walking normally before I picked him
    up.” Dee bit her lower lip, and some of the joy left her. “I really wish my landlord
    would allow me to keep pets. I was only scheduled to work four days this week,
    and I can’t keep an eye on him when I’m not here. If he’d had somewhere else to
    go, maybe he wouldn’t have gotten hurt.”


    “The landlord won’t make an exception?” I asked. “Where is it that you live?”


    “An apartment over on Sutcliffe.” Dee shrugged. “It’s not great, but it’s decent.
    And I’ve tried to talk to him, but …” Another shrug. Something in it made me wonder
    if she was afraid to ask for too much, lest she be booted from her home for being
    a pest.


    I filed the information away to consider later, then moved on to the real reason
    I was there. “Is Valerie in today? I’d like to talk to her for a few minutes.”


    “She’s in the back.” Dee knelt back down beside Oscar. The cat lifted his head
    enough for a few strokes, before laying it back down again. “She’s been back there
    practically all day.”


    “Thanks.” I started to leave, paused. “I’m glad Oscar is doing okay. He’s lucky
    to have you.” And then I left her and the cat to it.'
