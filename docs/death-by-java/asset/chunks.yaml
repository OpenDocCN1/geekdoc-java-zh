    was there stuff knocked over in the room?” I gestured around at the shelves, which
    were all as tidy as when I’d last seen them. Nothing was out of place. “Did Lyle
    fight back?”


    “I don’t know.” Her voice was small, scared. “I don’t usually come in first, but
    …” She took a shuddering breath. “I thought he was asleep or something. But when
    I went over to check.” She squeezed her eyes closed, entire body tensing.


    I gave her a moment to work through it before asking, “What about evidence? Did
    the police take anything that might hint at what happened?” *Or at who killed
    him?* I didn’t add.


    “Not really. Lyle didn’t have his tablet with him, which was strange, but if it
    was a mugger who did it, then maybe not. All that was on the floor near him was
    a screwdriver Roman probably dropped when he’d fixed the ice machine.”


    I almost asked if Lyle had been stabbed, but if he had been, there would have
    been blood. And while the door didn’t appear to be jimmied open, it was possible
    Lyle—or his killer—had done so without leaving a mark that could be seen from
    the inside. I’d need to check the alley and see if there were marks there.


    But that did raise the question: What was Lyle Carrigan doing at Death by Java
    when it was closed? And who had been there with him? I found it hard to believe
    he’d been chased and killed for his tablet.


    “This was a mistake,” Valerie said, abruptly backing toward the door. “We should
    go. I shouldn’t have let you back here.”


    I eyed the alleyway door a moment longer, but there was nothing to see. I let
    my gaze slide around the room until it fell on the ice machine.


    And the hinged metal door, which now sported a dent in it the size of a man’s
    meaty fist.


    # 7


    Sunlight streamed through the branches of the trees, casting speckled light across
    the open green of Village Park, which was bursting with life. A pair of squirrels
    sat atop a half-wall, busily doing squirrely things. A trio of dogs romped together
    while their owners chatted over coffee. Kids played. Parents looked on. It should
    have been uplifting. Peaceful.


    I stared down at my half-eaten pretzel, hardly seeing it. The large square flecks
    of salt reminded me of miniature ice cubes, which made me think of the ice machine
    and the dent. I’d tried to shake thoughts of murder, of bandaged hands and back-room
    lights, but I couldn’t.


    “Is there something wrong with your pretzel, Buttercup?” Dad asked, balling up
    his greasy napkin and brushing away fallen salt particles. “You used to love Walt’s.”


    “No. It’s fine.” I took a bite as if to prove the point, then chewed and swallowed.
    “I’m just thinking.”


    “About Valerie and what happened?”


    I took another bite before wrapping up the rest of my meager lunch. “I’d hoped
    going over there would help, but all I have now are more questions.”


    “Such as?”


    “How did the killer get in?”


    Dad shifted on the bench so he could look at me straight on. “Did you see something
    that might help explain that?”


    “No, but I saw the *lack* of something. There were no marks on the door, front
    or back, that would indicate it being jimmied open.”'
