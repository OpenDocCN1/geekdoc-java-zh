    “那是……”她再次向法拉投去忧虑的目光。“迪最近又请了几假。现在纳迪亚也来不了。我发誓，我给他们的工资已经足够了，但万一他们是在找新工作呢？光是他们三个人就已经够难的了。我不知道该怎么办！”


    “你**到底**付给他们多少钱？”我问道。我记得几个月前瓦莱莉曾给我打过电话，问我给自己的员工发多少工资，因为她想给自己的员工发低于最低工资的薪。


    “那并不重要，”瓦莱莉说，“财务方面——”


    “我不是问这种问题的人，”我说，我是我是认真的。维基才是那个处理金钱和业务方面的人。


    “是的，但是……”当我回头看向爸爸时，瓦莱莉的声音变成了嗡嗡声。


    “先等一下那个话题，”我说道，然后走向桌子。“里塔？”


    “是的，亲爱的？”她回答道。


    “你在‘咖啡之死’（Death by Coffee）。”这是一个陈述句，因为我看到她确实在那儿。“维基在那里吗？”


    里塔眨了眨眼睛。“嗯，我想她在。至少，几分钟前还在。如果你是担心灯光，从我到这儿起灯就一直开着。完全没有电力波动，不过我刚进来的时候灯光稍微变暗了一下，我当时以为是我的眼睛在适应，所以我这点可能是错的。”


    “你能帮我去把她叫来吗？”我问道，没有理会关于灯的部分。我现在完全不需要担心那个。“拜了。”


    里塔看起来很忧心，但点了点头。“当然可以，亲爱的。这很快的，对吧？”


    “不应该慢。”我对她笑了笑。“谢谢。”


    里塔起身走向柜台消失在视线中，尤金在那里等着。


    “发生什么事了？”爸爸问。


    当维基出现在屏幕上时，里塔跟在她身后，我避开了这个问题。


    “嗨，克莉西。玩得开心吗？詹姆斯。”


    “嗨，维基。见到你很好，”爸爸说。


    “我能借你分钟吗？”我问道。“瓦莱莉对财务有几个问题。我不确定该怎么回答她，我觉得你和她谈谈可能更好。”


    在背景中，里塔说：“用**我的**平板电脑吗？”


    “视觉辅助可能有帮助，”我说。“你可以直视她的眼睛，看看她是不是在耍花招。”


    “没问题，”维基说，“如果大家方便的话，我有几分钟时间？”


    “我没问题，”爸爸说。“我确定里塔不会介意的。”


    “当然不介意，亲爱的。你去忙吧。詹姆斯我可以以后再结束聊天。”尽管从她的语气中听出，她并不高兴。


    得到许可后，我拿起爸爸的平板电脑走到瓦莱莉那里，她在接过电脑时带着一丝困惑：“这是什么？”就在这时她认出了屏幕上的人是谁。“维基？是你吗？”


    我没费力解释，直接回到了爸爸坐的地方。我坐在他对面的椅子上。“抱歉。她几分钟后就会带回来。”


    “不，没关系。”爸爸手托着下巴，用期待的眼神看着我。“现在，”他说，“能告诉我昨晚发生了什么事，让你今天早上急匆匆地赶往什么鬼地方吗？还有，小宝贝，什么都别漏掉。”


    # 17


    在我回顾在提托家的那个晚上，以及随后早上前往红木村警察局与麦肯西侦探谈话的十分钟里，“咖啡之死”的生意依然毫无起色。瓦莱莉在我快结束时回了，她递过爸爸的平板电脑，低声说了声谢谢，然后跺脚走回后去。显然，她和维基谈完后并不愉快，这并不令人意外，考虑到瓦莱莉不愿给员工支付生活工资。


    “里塔不会高兴的，”爸爸晃了晃手中的平板电脑说。“我预计随时都会收到她的消息。”


    仿佛接到了信号一样，他的手机“叮”的一声。他检查了一下，给我看里塔的短信：*她挂了我的电话！*，然后花了一时间回复。接着是一声“叮”。又是一声。


    “她会一直给你发短信，直到你回她为止，”我说。


    “你可能是的。”他无奈地叹了口气。“给我几分钟和她和好，然后我们就可以回家。”他起身走向咖啡馆内空出的书区域，尽管他完全可以坐在座位上打电话，而不打扰到任何人，因为用餐区除了我和在柜台后玩手机的法拉之外，真的没有别人了。


    我透过窗户向提托肉铺的方向望去，好奇心在表面下暗动。我好奇提托是否在里面，在我和爸爸说话期间，麦肯西侦探是否到达了。我可以过去看看，但那又怎样？如果提托在那儿并认出我是那个偷垃圾的人，谁知道他会做什么。不仅如此，爸爸还和我在一起。而且保罗和劳拉现在可能已经在回爸爸家的路上了，如果他们还没到的的话。


    咖啡之死的的大门开了。我回头看到罗曼·汉斯走了进来。


    “嗨，克莉西。玩得开心吗？詹姆斯。”


    “嗨，维基。见到你很好，”爸爸说。


    “我能借你分钟吗？”我问道。“瓦莱莉对财务有几个问题。我不确定该怎么回答她，我觉得你和她谈谈可能更好。”


    在背景中，里塔说：“用**我的**平板电脑吗？”


    “视觉辅助可能有帮助，”我说。“你可以直视她的眼睛，看看她是不是在耍花招。”


    “没问题，”维基说。“如果大家方便的话，我有几分钟时间？”


    “我没问题，”爸爸说。“我确定里塔不会介意的。”


    “当然不介意，亲爱的。你去忙吧。詹姆斯我可以以后再结束聊天。”尽管从她的语气中听出，她并不高兴。


    得到许可后，我拿起爸爸的平板电脑走到瓦莱莉那里，她在接过电脑时带着一丝困惑：“这是什么？”就在这时她认出了屏幕上的人是谁。“维基？是你吗？”


    我没费力解释，直接回到了爸爸坐的地方。我坐在他对面的椅子上。“抱歉。她几分钟后就会带回来。”


    “不，没关系。”爸爸手托着下巴，用期待的眼神看着我。“现在，”他说，“能告诉我昨晚发生了什么事，让你今天早上急匆匆地赶往什么鬼地方吗？还有，小宝贝，什么都别漏掉。”

