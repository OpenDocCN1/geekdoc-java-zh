- fmt: '

    I stood there for at least five more minutes, thinking. If Tito was telling the
    truth, it sounded like the fired employee was responsible for the recent spate
    of violations that had taken place within the deli. Was he, as Tito said, inept?
    Or was it something more sinister? There were the calls to the health department,
    followed by the sudden increase in violations. I was truly beginning to wonder
    if that employee had been working with Lyle. I wished I had a name so I could
    talk to him.


    But how did a saboteur at Tito’s Deli tie in to Death by Java? Tito implied his
    fired employee was male. Everyone who worked at Valerie’s bookstore café was female.
    Was someone there working against her? Or was I trying too hard to make abnormal
    pieces fit into a standardized puzzle?


    I decided to let my subconscious work on it as I pulled out my phone and did a
    quick search. A moment later, I was actually on the phone, waiting for an answer.


    It came after only the second ring. “Yeah? Who’s this?”


    “Hugh?” I asked, though I recognized his voice. “It’s `Krissy Hancock`. Valerie’s
    friend.” I winced. Every time I said it, it came out sounding wrong.


    “Okay?”


    “We need to talk.” I paused. “It’s about her phone and a certain blocked number.”


    A long stretch of silence followed. I expected him to play dumb and ask, *“What
    number?”* but instead, when he finally did speak, he sounded resigned. “Where
    are you?”


    “Outside Death by Java.” Or I would be once once I left the alley, but close enough.


    “I’m in the area. Give me five minutes.” Another pause. “Don’t go inside. I don’t
    want Val to see us talking. And … don’t tell her anything, all right? Let’s talk
    first.” He clicked off before I could answer.


    I pocketed my phone and then walked to the front sidewalk. I’d just barely settled
    in to wait when a horn honked. Hugh was sitting across the street in his tiny
    electric car, motioning frantically for me. I checked both ways, then crossed
    over to where he was parked.


    He opened the window a crack. “Get in,” he said before rolling it up again.


    A brief flash of worry flared through me, though I dismissed it. If Hugh tried
    to drive off with me in the passenger seat, I was pretty sure I could overpower
    him. Or at least make it hard enough for him to drive that we wouldn’t make it
    far before crashing into a light pole. Not ideal, but it would be better than
    getting whisked away someplace I’d never be found.


    I didn’t think Hugh had any ill intent toward me, so I rounded the car and got
    in.


    Hugh had both hands on the wheel and was staring straight ahead. He looked nervous,
    which I suppose shouldn’t have been a surprise, considering. The fact that he
    wanted to talk to me so badly about the blocked numbers told me that I’d been
    right and he was responsible, at least partly.


    “Does she know?” he asked with a side-eyed glance my way.


    “About Mickey’s number being blocked? Yes. About who did it? Not yet.”


    Hugh’s shoulders sagged as he leaned back in his seat. “Okay. All right. Good.”


    “No, Hugh, it’s not good,” I said. “You blocked Mick ey’s number from her phone,
    and I assume you blocked hers from Mickey’s.”


    He winced, didn’t otherwise respond.


    “Why?” I asked, before shaking my head. “No, never mind. I know why. You still
    care about her.”


    He closed his eyes, nodded. “It wasn’t my idea.”


    Of course it wasn’t. “Aaron?”


    “Aaron,” he agreed before he took a deep, trembling breath. “None of this can
    get back to Val, okay? I’ll tell you everything, but you have to promise me that
    you won’t say a word to her.”


    “Hugh—”


    “*Please.*” He all but sobbed the word. “If you tell her, she’ll never talk to
    me again. Or Aaron. Neither of us could handle that. Mickey is all wrong for her,
    so it’s not like what we did is *bad* for her. If she stays with him, it will
    ruin her entire life. You know it as much as I do.”


    Sadly, from what I’d seen of Mickey and Valerie together, I tended to agree. But
    I also wasn’t so sure that either Aaron or Hugh was right for her either. I left
    my thoughts unsaid as I motioned for him to go on.


    Hugh studied me, then must have decided that my silence was as good as a promise,
    because he started speaking.


    “So, the day that …” He cleared his throat. “That night …”


    “After Lyle was killed,” I supplied.


    “Yeah. That.” He shuddered. “You came in that day. Val and Aaron and I were there.”


    “I remember.”


    “After you left, the three of us were sitting at the table, talking about everything.
    She mentioned a few things about Mickey that rankled me a bit. Aaron too. Well,
    eventually Val got up to use the restroom. She left her phone sitting there, which
    is when Mickey tried to call. Aaron and I let it go to voicemail because, why
    wouldn’t we?” He rubbed his hands across the steering wheel. “That’s when Aaron
    got the idea.”


    “To block Mickey’s calls?”


    “We knew they were having it rough, and with the murder, things were going to
    get even tougher. We didn’t know if he’d come around, but we figured it couldn’t
    hurt to.”

