    “没问题，”我说，“如果我们能让他进箱子，我们就能带他去兽医那里。所有的费用我来。”


    Dee 站了起来，眼睛睁大了。“真的吗？你确定吗？”她瞥了一眼奥斯卡，它还在埋头苦脸地吃着。“你不必这么做的。我很感激，但我——”


    “我很确定的，”我打断了她的话，“你去提猫箱的时候，我在这里看着他。”


    Dee 笑了起来。“好。行。我马上回来。”


    Dee 动作很快但很小心，以免惊到猫，她匆忙穿过 `Death by Java`，走向我推测她停汽车的地方。


    我看着奥斯卡吃东西，心在想是谁在莱尔死死的那个晚上把它放出来的。瓦莱莉（Valerie）没有，Dee 也没有。难道是其他员工中的某人干的？我觉得这不太可能，考虑到他们看起来似乎和那只猫没任何关系。


    但如果不是他们，那是谁呢？


    “你知道是谁杀了莱尔的吗？”我问道，压低了声音免得别人听到。


    奥斯卡甚至连抬头都没看我一眼。即使它 `could` 说话，我也不确定它是否会告诉我。


    # 12


    当我在前手臂肘窝下方贴上最后一张创可贴时，我不禁皱起眉头。说奥斯卡对被塞进猫箱并拖到兽医那里并不开心，那太是轻描了。那只猫全身都是爪子和牙齿，发出我从未从任何动物身上听过的声音，更何况是一只猫了。但在
    Dee 我之间，我们还是把它弄进了箱子，而且对我们造成的伤害算得上是最小的。


    开车去一家周末营业的兽医诊，花些心思劝说让他们在没有预约的情况下收一只流浪猫，然后决定让他们把奥斯卡留在那几天以确保它处于最佳状态，这耗费了漫长的几个小时。之后，Dee
    把我送到了我爸家。瓦莱莉可不想错过在沙滩上放松的机会，所以在我们还没完全安顿好奥斯卡之前她就已经离开了。


    我用我爸的一条手毛巾擦了擦还没干的手臂。涂了双氧水后又涂了霉霉素（Neosporin），以防奥斯卡的爪子比看起来的要脏。伤口都不太深，但我不想冒险，尤其是考虑到我最近的运气一直很糟糕。


    做完这些后，我走到客厅，整个人倒在沙发上，一边看电视，一边为没能参加沙滩之行而懊闷。我爸一整天不断给我发更新信息，感叹那里有多漂亮，说他会帮我照看保罗（Paul），因为正如他所说的，那个“视觉盛宴”相当“壮观”。接着是一张照片，一群大学年龄的男女穿着极小的泳衣在打排球，那泳衣让瓦莱莉自己的看起来像件雨披。


    时间流逝了。我不确定过了多久。我几乎没有注意到电视上在放什么。我一直在想着瓦莱莉和米奇（Mickey），他们他们是莱尔谋杀案的核心。我很难想象他们 `could’t`
    卷其中。案件发生在他们的店里。他们都在闪烁其词——米奇完全消失了踪迹。他们还不如直接在头上写上“有罪”两个字完了。


    尽管我不愿承认，但我发现自己很期待即将到来的聚会。瓦莱莉的朋友会来，还有认识大多数与犯罪有关人员的人。而且由于我预计瓦莱莉本人也会出现，带着从沙滩晒出来的古铜色，这会给我又一次机会从她那里套出一些有用的信息。


    还没到晚上，保罗、我爸和拉拉（Laura）笑着进了大门。我爸的鼻子是红的，而拉拉看起来和离开时一样。另一方面，保罗脸上发光，就像被放射了一样。


    “忘了带防晒霜了？”我笑着问道。


    “我用它洗了澡。”他手指进耳朵揉了揉。“我到处都是沙。”


    “我有一个理论，认为沙是有意识且会移动的，”我爸说，“它会找到进入每一个缝隙、每一个设备、你身体每一个毛孔的方法，无论你如何努力把它隔绝在外。”


    “等你去洗澡再说，”拉拉补充道，“等你洗完，你会站在一个沙丘里，完全不知道那些沙是从哪来的。”


    “我想我现在就去洗。”保罗开始朝走廊走去，但在看清我时停住了。“你怎么了？”


    “我和一只猫摔了一场跤，”我说，举起贴满创可贴的手臂和手。


    “这儿有猫？”我爸问道，环顾四周，好像怕会有只猫从桌底下钻出来。


    “没有，但我抓到了那只在 `Death by Java` 的猫并把它带去了兽医那里。说来很长。”


    “让我洗个澡，然后你再详细告诉我，”保罗用手抓了头发。沙子倾泻落在他的肩膀上，就像他患了严重的头皮屑。“你今晚还想去参加聚会吗？我打算去，但如果你不想去，我们可以留家里。”


    “我想去，”我说，拍掉他肩膀上的沙。“现在，去洗澡吧。”


