    Paul shifted onto the bed so that he was lying across it, hand supporting his
    chin. “Mind if I watch?” he asked.


    I closed the door by way of answer. Then I dug out my running clothes and made
    a show of getting changed. I left him grinning a few minutes later.


    “Ready?” Laura asked from the dining room, where Dad was sitting at the table
    with his tablet, which, unlike Lyle Carrigan’s, didn’t have a protective case
    over it. He was squinting at the screen in a way that made me think he was looking
    over a publishing contract and was struggling to make sense of the legalese.


    “Ready.”


    A quick peck from each of us on Dad’s cheek, and then Laura and I headed out into
    the California evening.


    Dad’s house was situated in a residential district populated by wealthier, but
    not filthy-rich, residents of the Village. It wasn’t too far from downtown, and
    that was the direction Laura headed when we started our walk. A surreal feeling
    washed over me as we began. Memories of running down this very street as a kid,
    of trick-or-treating at these very houses, warred with the here and now. Families
    I’d once known had moved. Additions were added to houses. New siding, new roofs,
    new lives. I knew the area, and yet, at the same time, I didn’t.


    “You okay?” Laura asked after a few minutes of silence.


    “Yeah. Just thinking.” We passed by Valerie’s old house. Her parents still lived
    there, as was indicated by the KEMP in big, block letters by the door. They, like
    Valerie, always had a certain air about them, one I’d much rather steer clear
    of. “I’ve been back to the Village often over the last few years, yet this time
    feels different.”


    “Is it because Paul is here?”


    I shrugged. “Maybe? I don’t know. It’s the same as I remembered, and yet …”


    “I get it,” she said. “You might need some time to settle in. You just got here
    a few hours ago, and it’s”—she glanced at her watch—“nearly ten in Ohio. Your
    entire system probably needs time to adjust.”'
