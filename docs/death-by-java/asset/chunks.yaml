  trans: '

    当我走到户外时，微风拂过皮肤的感觉很舒服。汽车在街道上穿梭，大多数遵守限速，尽管有几辆在超速。行人以寻常的速度从我身边走过。“Death by Java”确实坐落在一个黄金地段。生意应该红火才对。从我在
    `Tito’s` 窗外看到的几乎满目的桌子来看，那家肉铺店经营得不错。甚至更好。经营得非常好。


    然而，“Death by Java”几乎没有引起路人的的一顾。几个月来糟糕的服务、令人存疑的卫生状况已经杀死了人们对这个地方的任何兴趣。


    但感觉并不仅仅于此。到处都是那种桌子肮脏、员工缺乏热情的地方，尽管有这些缺点，它们依然运行得完完好。许多违反卫生规定而被警告的企业也是如此。`Lyle` 进过
    `Tito’s`，没错，他被直接赶了出去，但我很确定根据 `Tito` 对待他的方式，他一定给了他们差评。顾客们似乎并不在乎。


    那么，为什么“Death by Java”过得如此艰难呢？


    我一边用手机给 `Paul` 打电话，一边观察那家肉铺店。我的脑海中缓慢地旋转各种可能性，包括 `Lyle` 因为某种偏袒而害死的可能。他在第二个铃响时接了电话。


    “嗨，小花儿。”


    “呃。别那样，”我说，做了一个鬼脸。


    `Paul` 笑了。“听起来没有我预想中那么自然。”


    “我不希望它那么自然，”我说，“从爸爸那里，我已经习惯了。你呢？我觉得‘Krissy’完全没问题。”


    “知道了。你那边忙完了吗，`Krissy`？”他低声念出这个名字，导致我的背脊一阵发栗——是那种很舒服的感觉。


    “忙完了，”我说，这时一个滑板少年滑过。不知为何，他在半拥挤的人行道上竟然没有撞到任何人。“我在想我们可以和爸爸还有 `Laura` 一起在 `Tito’s
    Deli` 吃午饭。”


    “是 Death by Java 旁边的那家吗？”他问道。


    “是。既然我已经在在这里了，我可以帮我们占个位子。我累了，真的很想坐会儿。”


    沉默了一小刻，我`很清楚` `Paul` 觉得我对我们的午饭另有意图，我想他是对的。我想问问 `Tito` 关于 `Lyle` 的事，但我需要用一种不会让他怀疑的方式来问。


    *祝你好运吧。*


    “给我们十五分钟时间，”`Paul` 说，“我去问问 `James` 和 `Laura`，确保他们没有其他计划。无论如何，我们会在那里等你。”


    “太好了。我等。”


    我挂了电话，走完短段距离来到 `Tito’s Deli`。里面凉爽且宜人，尽管有一点拥挤，尤其是在午餐时间。桌子之间的距离太近了，而且由于几乎每一桌都满了，占座椅子之间完全没有行走空间。


    我看到房间另一头有一张空桌，被迫绕远路才走过去。桌面上抹着芥末，旁边放着一张被揉成团的纸巾。那里只有三把椅子。第四把被五个戴着反戴棒球帽、带着油腻笑意的哥们儿占据了，他们正挤在附近的一张本可以坐四人的桌子旁。


    尽管如此，那也是剩下的了，我希望 `Paul` 带着爸爸和 `Laura` 到达时，他们已经离开了，我就可以拿回那个椅子。


    “对不起，对不起。”一个留着玉米色头发的娇小青少年向桌子跑过来。她脸上满了斑斑，这在她擦拭桌子时反而更加衬托出她的脸红。“我们真的很忙，我刚才忙着洗碗了。”


    “没关系。”


    她对我微笑一笑，露出了牙套。“这只需要几秒钟。”


    我等她擦完桌子才问道：“`Adornetto` 先生在吗？”


    恐慌掠过她的脸，她的手伸向了名牌，仿佛想把它盖住。*Birdie*（小鸟）。根据我对这个女孩的极少观察来看，这个名字很合适。


    “我不是来投诉的，”给了她一个安慰微笑，“这是关于其他的事。保证。”


    她看着我的眼神有些不确定，但她点了点头。“他在后面。需要让我去帮你叫他吗？”


    “请吧。”我坐下，依然带着微笑。


    `Birdie` 在那里多停留了一会儿，然后匆向后跑去。隔壁桌，那几个哥们儿爆发出一阵大笑，互相推着手肘，好像其中一个人开了个超级搞笑的笑话。这引来了几乎所有其他桌客的白眼，但他们并不屑于注意。


    手机震了一下。我回头确认 `Tito` 没过来，然后检查屏幕。未知号码，但是本地号码。我皱了皱眉，又回头看了一眼，好奇地接道：“喂？”


    “Krissy？”


    声音听起来有些熟悉，但我认不出来。“我在。”


    “是 `Larissa`。”停顿了一下，仿佛她说出自己名字的那一刻并没有像由于怀旧的重锤一样击中了我，她补充道：“Larissa Sweeny。”


    “Larissa! 嘿！”我忍住了涌上的泪水。`Larissa` 是我高中的老朋友之一，是我很久以前失去联系的人，我曾希望她出现在 `Bray’s` 的同学聚会上。

    '
- fmt: '

    I assumed the “idiot” was Mickey. “You threw Lyle out of your deli a few days
    ago,” I said. “When you did, you said something about him being paid to harass
    business owners. What did you mean by that?”


    Tito laughed. “What do you think I meant? He works at the health department. It’s
    his job to snoop around and find problems with the food industry.” A pause, and
    some of the humor went out of his expression. “*Was* his job, I suppose. I don’t
    know what goes on down there, but I’m sure they have quotas. He needed to meet
    them. He’d come in, make up some tall tale about machines not working properly
    or cleaner being stored on the wrong shelf, write up his little citation in that
    tablet of his, and then he would go collect his bonus or whatever it was that
    made him do what he did.”


    “And you didn’t like that.”


    “None of us did. I didn’t. Valerie Kemp didn’t.”


    “Marco Rossi?”


    “Sure.” He leaned forward. “Did you know Marco wanted to move his place over to
    the corner there?” He pointed toward Death by Java. “I’m pretty sure he had it
    all lined up too. Money down and everything. Then in comes Ms. Kemp with her perfect
    hair and body to kill for. One closed-door meeting with the seller, and what do
    you know? She gets the location. I don’t fault her for using her assets like that,
    but Marco sure didn’t like it.”


    “You think Valerie seduced the seller?” I asked, wishing I could be more skeptical
    than I was.


    Tito shrugged. “You tell me. You’re the one helping her out. You see how she is.
    We all do.”


    For a brief instant, I wondered if Marco could have resented Valerie’s actions
    and resorted to murder because of it. But why kill Lyle? Valerie, Mickey, or one
    of her employees would have been a far better target. Remove them, the location
    becomes open, and he could swoop back in and scoop it up. Kill Lyle, and it might
    inconvenience her, but it would also remove the thorn in her side, especially
    since there was no evidence connecting her to the crime. So, how would he benefit?


    “What time do you leave here at night, Tito?” I asked, shifting topics.


    “When I’m done here,” he said with a shrug. “Sometimes that’s early. Sometimes
    late.”


    “On the night of the murder?”


    He looked me up and down, eyes going hard. “Why are you asking? Are you implying
    that I might have had something to do with Lyle Carrigan’s death?”


    “No,” I said. “But Valerie keeps a cat in her store.”


    His brow furrowed. “Excuse me?”


    “A cat. Black and white. His name is Oscar.”


    “I’ve seen him,” Tito said. “He gets into my trash and rips open the bags. And
    if you’re not careful, the thing will dart between your feet whenever it’s spooked.
    The thing is a pest. If I was a lesser man, I’d do something about it. I doubt
    Ms. Kemp is taking much care of it or else it wouldn’t be so skittish.”


    “Oscar was in the store the night Lyle was killed,” I said. “Or, at least, that’s
    what everyone at Death by Java believed.”


    Tito waited a beat, then asked, “And?”


    “And someone let him out. I was wondering if you might have seen who that was.”


    The incredulous look that passed across his face had me blushing in embarrassment.
    “You think I pay attention to who or what goes in and out of that place next door?
    We’re business neighbors, not friends. I have my own issues to deal with here.
    I don’t care where that cat is, as long as he’s not messing with my trash or getting
    into my place of business.” His glance at his watch was so quick, there was zero
    chance he’d actually read it. “Your five minutes are up. I’ve got to get back
    to work.” He started to rise.


    “Wait. One more question.”


    Tito hesitated, then settled back down, though he was tense. His jaw worked, and
    those dark brown eyes of his looked like deep, black pits.


    “It’s about Lyle’s tablet,” I said.


    It was as if all the air was sucked from the room. I swear Tito stopped breathing
    for a full five seconds before he asked in a quiet voice, “What about it?”


    “When was the last time you saw it?” I asked, watching him carefully. His reaction
    wasn’t what I’d expected.


    Tito’s eyes bounced back and forth as he scanned my face, as if searching for
    some sort of deception. “I assume it was when I last saw him.”


    “Which was …?”


    His blink was slow, measured. “I wager it was when I kicked him out of here.”


    *Assume. Wager.* Tito was being awfully careful here. “Did you ever see Lyle *without*
    his tablet?”


    He ran a hand over his scalp. Behind him, the dudebros rose with a raucous round
    of laughter and left.


    I was about to prod Tito into speaking when he abruptly stood.


    “I answered your questions. If you’ll excuse me, I’d like to get back to work.”
    His gaze flickered to the empty table. “And please, no loitering. If you aren’t
    go ing to eat, I would ask you to leave so a paying customer can have your place.”
    He spun away and marched to the back.


    I watched him go with a growing concern. Tito had been relatively relaxed when
    we’d started.

