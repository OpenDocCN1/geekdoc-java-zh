    skies, and through enterprises such as nuclear technology, human beings are successfully
    challenging natural limits, posing political questions made vastly more difficult
    by the inaccessibility of modern science to public discussion.


    Arendt’s prologue moves from this theme to “another no less threatening event”
    that seems at first strangely unconnected: the advent of automation. While liberating
    us from the burden of hard labor, automation is causing unemployment in a “society
    of laborers” where all occupations are conceived of making a life. Over the course
    of the book, framing the phenomenological analysis of human activities, a dialectical
    contrast between these two apparently unrelated topics is gradually developed.
    On the one hand, the dawn of the space age demonstrates that human beings literally
    transcend nature. As a result of modern science’s “alienation from the earth”
    the human capacity to start new things calls all natural limits into question,
    leaving the future alarming openly. On the other hand, in a development Arendt
    traces to “alienation from the world,” modern societies engulfed by ever more
    efficient production and consumption encourage us to behave and think of ourselves
    simply as animal species governed by natural laws.


    Human animals unconscious of their capacities and responsibilities are not well
    fitted to take charge of earth-threatening powers. This conjunction echoes Arendt’s
    earlier analysis of totalitarianism as a nihilistic process propelled by a paradoxical
    combination of convictions: on the one hand the belief that “everything is possible,”
    and on the other that human beings are merely an animal species governed by laws
    of nature or history, in the service of which individuals are entirely dispensable.
    The echo is not, for The Human Condition is organically linked to Arendt’s work
    and the two contain an original and striking diagnosis of the contemporary predicament.


