    The second feature of science leads to depoliticization—or, better, to a failure
    to engage in “thinking what we are doing”—science’s reliance on allant. Arendt
    writes that scientists (and she does use that category regularly in the book)”move
    in a world where speech has lost its power.” She continues, “For the sciences
    today have been forced to adopt a ‘language’ of mathematical symbols, though it
    was originally meant only as an abbreviation for spoken statements, now contains
    statements that in no way can be translated into speech” (p. 4). Although mathematization
    is a language of its own, it nonetheless forces a rupture in the shared linguistic
    fabric that humans depend on to narrate histories, chooses courses of action,
    and give meaning to life. Here Arendt is channeling Aristotle. Humans are political
    animals, and they are political because they are equipped with words. She writes,


    > There may be truths beyond speech, and they may be of great relevance to the
    singular, to man in so far as he is not a political being, whatever else he may
    be. Men in the plural, that is, men in so far as they live and move and act in
    this world, can experience meaningfulness only because they can talk and sense
    to each other and to themselves. (p. 4)


