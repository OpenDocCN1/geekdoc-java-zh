  md: '# Introduction


    # Margaret Canovan


    With the creation of man, the principle of beginning came into the world. . .
    . It is in the nature of beginning that something new is started which cannot
    be expected. (Below, p. 177)


    I


    Hannah Arendt is preeminently the theorist of beginnings. All her books are tales
    of the unexpected (whether concerned with the novel horrors of totalitarianism
    or the new dawn of revolution), and reflections on the human capacity to start
    something new pervade her thinking. When she published *The Human Condition* in
    1958, she herself sent something out into the world, and forty years later the
    book’s originality is striking as ever. Belonging to no genre, it had no successful
    imitators, and its style and manner remain highly idiosyncratic. Although Arendt
    never tried to gather disciples and found a school of thought, she has been a
    great educator, opening her readers’ eyes to new ways of looking at the world
    and at human affairs. Often the way she light on neglected corners of experience
    is by making distinctions, many of them threefold, if conventional dichotomies
    were too constricting for her intellectual imagination. *The Human Condition*
    is crammed with distinctions: between labor, work, and action; between power,
    violence, and strength; between the earth and the world; between property and
    wealth; and many more, often established through etymological explorations. But
    these distinctions are linked to a controversial view of challenging contemporary
    triums. (For what is surely the most unexpected feature of the book) she finds
    in ancient Greece an Archimedean point from which to take a critical eye on ways
    of thinking and behaving that we take for granted. Indeed, her calm assumption
    that we may be able to learn important lessons from the experience of people who
    lived two and a half millennia itself challenges the modern belief in progress.
    Continual references to the Greeks have added to the sense of bewilderment'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'experienced by many readers of The Human Condition, who have found it hard
    to understand what is actually going on in the book. Here is a long, complex piece
    of writing that conforms to no established pattern, crammed with unexpected insights
    but lacking a clearly argumentative structure. The most urgent question to be
    addressed by way of introduction is, therefore, what Arendt actually doing?


    Both the book’s difficulty and its enduring fascination arise from the fact that
    she is doing a great many things at once. There are intertwined strands of thought
    than can possibly be followed at first reading, and even repeated readings are
    liable to bring surprises. But one thing she is clearly not writing political
    philosophy as conventionally understood: that is to say, offering political prescriptions
    backed up by philosophical arguments. Readers accustomed to that genre have tried
    to find something like it in The Human Condition, usually by using Arendt’s account
    of the human capacity for action. Since the book is laced with criticism of modern
    society, it is tempting to suppose that she intended to present a utopia of political
    action, a kind of New Athens. Nor is this caricature entirely without foundation.
    Arendt was certainly down to participatory democracy, and was an enthusiastic
    observer of outbreaks of civic activity ranging from American citizens against
    the Vietnam War to the formation of grassroots citizens’ “councils” during the
    short-lived Hungarian Revolution of 1956. Reminding us that the capacity to act
    is present even in unlikely circumstances was certainly one of her purposes. But
    she denied denied her role to propose a blueprint for the future or to do so.
    Repudiating the title of “political philosopher,” she argued that the mistake
    made by all political philosophers since Plato is that on among plural human beings,
    each of whom can act and start something new. The results that emerge from such
    interaction are contingent and unpredictable, “matters of practical politics,
    subject to the agreement of many; they can never lie in theoretical considerations
    or the opinion of one person” (p. 5).


    Not political philosophy, then; and, indeed, a good deal of the book does not
