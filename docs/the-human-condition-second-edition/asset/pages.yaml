- img_proc: true
  md: 'different categories of people. Arendt instead insists that these three areas
    are pertinent to every human being; the project of politics is precisely to define
    the terms of how these three activities articulate with one another in each of
    our lives. The revival of politics demands a renewal of the capacities of each
    and every democratic citizen or civic agent to diagnose the circumstances of human
    experience—what is possible for them with regard to opportunities for labor and
    work—and to pursue the political work of responding to these circumstances.


    Life moves faster than science, whether natural or social. Factories close. People
    find themselves out of work and stressed by depression. People go on over the
    years it takes the social scientist to hypothesize, collect data, test or confirm,
    and replicate. And on it goes. When we confront the hardest social problems—like
    mass incarceration, or economic disruption as occasioned by globalization, or
    climate change—we need to accelerate the pace of our acquisition of understanding.
    We have to use every available tool of thought to think what we are doing. I,
    as a sensible, cognizing, learning, processing, feeling being, can make a judgment
    even before the economic study gets completely rendered, and so can you, and then
    we can debate our differing judgments, wrangling our way to a decision about what
    should be done. This is what it means to think what we are doing.


    Of course, where we can, we also want to draw on and validate our judgments through
    rigorous science or social-science research. But it is crucial to keep in mind
    that science will always remain limited by the fact that it can''t catch up with
    reality, and it can never tell us what we should do. We must supplement science
    with other instruments for understanding current, reality. Arendt tells us what
    we should do more than science can. Instead, she seeks to give us back those instruments
    of thought and the doings that they shape: labor, work, and action. In proffering
    these gifts and modeling political thinking, *The Human Condition* offers a much-needed
    remedy for our times.'
