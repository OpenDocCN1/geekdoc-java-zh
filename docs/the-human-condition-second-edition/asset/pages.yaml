    and why—Science is not a guide but a support—a crutch, a tool, an accelerator—for
    human beings ready to think what they are doing.


    In reread **The Human Condition** now, sixty years after its initial publication,
    I am struck more powerfully by Arendt''s prescience. Science and a related phenomenon,
    technocracy, have grown only ever more powerful in the intervening six decades.
    By technocracy, I mean the now-common expectation that political questions should
    simply be decided by policy experts equipped with the relevant expertise—economics,
    climate science, genomics, and the like. Our inequitarian economics and divisive
    politics are, I think, the bitter fruit that we are now harvesting from the depoliticization
    of much of human life. For almost two decades, the exceptionally recent economist
    Dani Rodrik has argued for an “impossibility theorem” for the global economy,
    namely that “democracy, national sovereignty and global economic integration are
    incompatible”,⁵ it is impossible, he argues, to have three at the same time. Yet
    economic-policy makers for two decades proceeded as if there no tragic choices
    here, as if the question of growth were a purely technocratic one, to be managed
    through the right policies and market institutions. Rather than seeing the fundamental,
    underlying political questions and engaging with, pursuing projects of educating
    and cultivating judgment within a citizenry, policy makers found themselves surprised
    by the Great Recession of 2008 and, barely a decade later, surprised again by
    a tsunami of populist overturns of what proved to be seemingly stable political
    configurations.


    Our struggle to deal with the politics of climate change is surely also a product
    of the strange standoff between science and political thinking. This standoff
    consists of a refusal of science to recognize its role as aide and support, not,
    to political thinking and a refusal of political thinking to recognize the value
    of science for itself. Arendt, I''m sure, would not have been surprised by our
    hiatus or passivity on that. In contrast, technocracy and technocrats find themselves
    surprised by politics, and over over again. The fact that our policy makers are
    startled by eruptions of politics will be dangerous and damaging we learn again
    to think what we are doing and equipping ourselves to re-politicize our world.
    I say not in the hopes of dethroning science, for we can and should celebrate
    its actualization of extraordinary human potentials. The time has come, I'
