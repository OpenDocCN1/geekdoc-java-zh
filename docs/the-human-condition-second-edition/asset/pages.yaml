  md: '# CHAPTER I


    # The Human Condition


    1


    Vita Activa AND THE HUMAN CONDITION


    With the term *vita activa*, I propose to designate three fundamental human activities:
    labor, work, and action. They are fundamental because each corresponds to one
    of the basic conditions under which life on earth has been given to man.


    Labor is the activity which corresponds to the biological process of the human
    body, whose spontaneous growth, metabolism, and eventual decay are bound to the
    vital necessities produced and fed into the life process by labor. The human condition
    of labor is life itself.


    Work is the activity which corresponds to the unnaturalness of human existence,
