  md: 'think, reunite science with political thinking, calculation and algorithmic
    intelligence with judgment. This is the work Arendt was calling us to many years
    ago, and the call has, I think, gotten only more urgent.


    To suggest that depoliticization leads to divisiveness and inequality is counterintuitive.
    Indeed, the burden of The Human Condition is to help us see why politicization
    is a good thing.


    In The Human Condition, Arendt famously expounds on the content and import of
    three human activities: labor, work, and action. Labor is that which we undertake
    out of biological necessity; that which we do, in other words, to free ourselves.
    It also encompasses sexual reproduction and the energies devoted to child-rearing.
    Work is that which we do of creative effort, to build the things—whether physical
    or cultural—that shape our world and establish our social connections with others.
    Labor and work overlap with each other since, of course, the context within which
    we may also pursue biological reproduction. Our romantic relationships are products
    of social art and, Finally, action identifies the effort to make together as political
    creatures, struggling in conditions of pluralistic diversity, to come to collective
    decisions about our polity’s course of action.


    Arendt shows us how these three human “doings”—labor, work, and action—can lessen
    the space between us; give us the opportunity to build worlds that turn our plurality,
    or difference, into productive engagements; and enable us to make ourselves visible
    and knowable to one another, not armed strangers in the four corners of cold and
    uninhabitable rooms. The third “doing,” belongs to the political realm, and Arendt
    is often interpreted as if she focuses exclusively on howrew on rescuing action
    from other human activities. In fact, her rescue of the political and of politicization
    is more complicated than that. Labor and work are also categories that scientific
    analyses flatten and reduce—whether those are the analyses of economists or computer
    scientists. Just as we worry that nowadays will soon leave us without a sense
    of purpose, so Arendt’s contemporaries also worried.


    Politics is rescued, in Arendt’s work, by means of a broader rescue of all three
    fundamental and interrelated human doings. Arendt’s project is not to separate
    labor, work, and action from one another but, having distinguished them, to show
    their interactions and, more importantly, the articulations of each activity with
    the others. In doing so, Arendt overturns centuries of intellectual tradition
    that insisted on assigning action, work, and labor to'
