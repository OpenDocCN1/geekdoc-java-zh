  md: '# Foreword


    # Danielle Allen


    2018


    The Soviet Union’s satellite Sputnik, the first man-made object to orbit the earth,
    is the astrological sign under which Hannah Arendt sets forth her argument in
    The Human Condition. “In 1957,” she writes, “an earth-born object made was launched
    into the universe.” This event, continues, was second in importance to no other,
    not even to the splitting of the atom”(p. 1). The glistening metal sphere of about
    twenty-three inches in diameter takes precedence over even the terrifying darkness
    of the mushroom cloud. The first subject of The Human Condition is science—and
    the transformation of human experience by not only technology but also scientific
    ways of knowing. The second subject is how, once we can see science’s temptations
    and dangers as well as its self-evident virtues and rewards, we can restore human
    authority over it by reviving the power of political thinking to operate alongside
    it.


    In invoking the splitting of the atom so immediately after Sputnik, Arendt adds
    a second astrological sign to the first with which she opens the book. The argument
    of this book begins not only under the sign of science’s temptations—the joyful
    prospect that earthlings might liberate ourselves from the earth—but also with
    an alert to its dangers. The temptations take precedence over the dangers only
    because they pave the way for them. Science tempts us into thinking we can put
    an end to politics and transform the human condition into a series of technical
    problems amenable to definite solutions. The danger that flows from this temptation,
    Arendt finds explicitly at the end of the book, is that “an unprecedented and
    promising outburst of human activity . may end in the deadliest, most sterile
    passivity history has ever known”(p. 322).


    To some extent, Arendt takes her bearings from the philosophical tradition known
    as phenomenology. That is, she looks to appearances in ordinary life as a starting
    point for insight into “the human condition.” She'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'investigates the world around her and observes in ordinary experience a rising
    habit of reducing all human action to, say, utility functions, or to an accounting
    of consequences and a tiring up of costs and benefits, or to algorithms that depend
    on the mechanical application of deductive rules to action. Importantly, in contrast
    to the main line of phenomenologists, figures like her teacher Martin Heidegger,
    Arendt does not see such reductionist treatments of appearances as a natural and
    necessary pathology of ordinary experience. For her, they are not the inevitable
    painful disappearance of true “being” behind its appearances. Instead, she sees
    reductionist treatments as reflecting the problem of “rule,” in Patchen Markell’s
    formulation—that is, the problem of the dominance over possible interpretations
    of human life by a hegemonic intellectual paradigm. The reductionist paradigm
    that she has in her sights is science and the modes of thought on which it relies—styles
    of thinking that anticipate definite and final “right” answers.


    In Arendt’s argument, two key features of scientific thinking transform human
    experience. The first is a focus on cause and effect—on how things work—that makes
    human reasoning substitutable by machines, which are inevitably faster calculators.
    She writes, “It is not only and not even primarily contemplation which has become
    an meaningless experience. Thought itself, when it became ‘reckoning with consequences,’
    became a function of the brain, with the result that electronic instruments are
    found to fulfil these functions much better than we could” (pp. 321–22). The questions
    of what ends we should pursue and why we receded as science developed greater
    power to explain how things work and to devise technical solutions for making
    this or that thing, which someone with resources or power had wanted to want—for
    instance, nuclear wars. Arendt says what she would like people to gain from her
    book “is very simple: it is nothing more than what we are doing” (p. 5).


    Contemporary examples of science’s links to passivity are not hard to find. The
    Growth of Incarceration in the United States: Exploring Causes and Consequences,
    a report released in 2014 by the National Academy of Sciences, is eloquent on
    this subject. The report seeks to assess the cases of the rapid rise in incarceration
    in the American criminal-justice system over the past three decades and offers
    a meta-analysis of a vast number of preexisting studies, tracing crime rates,
    the impact of changes in policing on incarceration, themes of electoral politics,
    and the like. The authors come to'
