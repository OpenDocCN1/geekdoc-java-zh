    to the biological life of man as an animal; work, which corresponds corresponds
    to the artificial world of objects that human beings build upon the earth; and
    action, which corresponds to our plurality as distinct individuals. Arendt argues
    that these distinctions (and the hierarchy of activities implicit in them) have
    been ignored within an intellectual tradition shaped by philosophical and religious
    priorities. However, there is considerably more to the book than the phenomenological
    analysis, and more than even Arendt’s critique of traditional political philosophy’s
