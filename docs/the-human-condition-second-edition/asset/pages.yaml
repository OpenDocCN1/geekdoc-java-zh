    human condition from the vantage point of our newest experiences and our most
    recent fears.” What experiences and fears?


    # II


    The prologue opens with reflections on one of events that reveal the human capacity
    for making new beginnings: the launch of the first space satellite in 1957, Arendt
    describes as an “event, second in importance to no other, not even to the splitting
    of the atom.” Like the Hungarian Revolution of 1956, which also occurred while
    she was working on the book, this unexpected event led her to rearrange her ideas,
    but was at the same time a vindication of observations already made. For, noting
    that this amazing demonstration of human power was greeted on all sides not with
    pride or awe but but rather as a sign that mankind might escape from the earth,
    she comments that this “rebellion against human existence as it has been'
