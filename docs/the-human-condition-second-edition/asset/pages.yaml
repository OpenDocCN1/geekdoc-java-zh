  md: '# Prologue


    In 1957, an earth-born object made by man was launched into the universe, where
    for some weeks it circled the earth according to the same laws of gravitation
    that sway and keep in motion the celestial bodies—the sun, the moon, and the stars.
    To be sure, the man-made satellite was no moon or star, no heavenly body which
    could follow its circling path for a time span to us mortals, bound by earthly
    time, Yet, for a time it managed to stay in the skies; it dwelt and moved in the
    proximity of the heavenly bodies as though it had been admitted tentatively to
    their sublime company.


    This event, second in importance to no other, not even to the splitting of the
    atom, would have been greeted with unmitigated joy if it had not been for the
    uncomfortable military and political circumstances attending it. But, curiously
    enough, this joy was not triumphant; it was not pride nor awe the tremendousness
