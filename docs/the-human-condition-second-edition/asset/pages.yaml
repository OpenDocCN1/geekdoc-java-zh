    # THE FRAILTY OF HUMAN AFFAIRS


    Action, as distinguished from fabrication, is never possible in isolation; to
    be isolated is be deprived of the capacity to act. Action and speech need the
    surrounding presence of others no less than fabrication needs the surrounding
    presence of nature for its material, and of a world in which to place the finished
    product. Fabrication is surrounded by in constant contact with the world: action
    and speech are surrounded by in constant contact with the web of the acts and
