    achieve,” “to finish”) correspond to the two Latin *agere* (“to set into motion,”
    “to lead”) (whose original meaning is “to bear”).^16 Here it seems as though each
    action was divided into two parts, the beginning by a single person and the achievement
    in which many join by “bearing” and “finishing” the enterprise, by seeing through.
