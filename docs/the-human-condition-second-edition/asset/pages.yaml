    usage is very similar too. In both cases the word that originally designated the
    second part of action, its achievement—prattein and gerere—became the accepted
    word for action in general, whereas the words designating the beginning of action
    became specialized in meaning, at least in political language. *Archein* came
    to chiefly “to rule” and “to lead” when it was specifically used, and *agere*
    came to mean “to lead” rather than “to set into motion.”


    Thus the role of the beginner and leader, who was a *primus inter pares* (in the
