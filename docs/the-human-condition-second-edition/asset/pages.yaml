    83. In the monastic life, particularly in the orera of Benedict, labor is recommended
    against the temptations of an idle body (see ch. 48 of the rule). In the so-called
    role of Augustine (Epistulae 211), he uses the words labor and synonymously as
    opposite of otium—three reasons: it helps to fight the temptations of toil; he
    encourages the monasteries to fill their duty of charity toward the poor and it
    is favorable to contemplation because it does not engage the mind unlike other
    occupations, for instance, the buying and selling of goods. For the role of labor
    in the monasteries, compère Étienne Delanrelle, “Le travail dans les règles religieuses
    occidentales du 4e au IX siècle,” Journal de psychologie et pathologique, Vol.
    XXI, No. 1 (1948). Apart from these formal considerations, it is quite characteristic
