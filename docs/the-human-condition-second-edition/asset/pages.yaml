    the defenders of the Christian origin of more glorification of labor are in France,
    Étienne Boerne and François Henry, Le travail en revolt (1937); in Germany, Karl
    Müller, Die Arbeit: moral-philosophischen Grundlagen des heiligen Thomas von Aquino
    (1912). More recently, Jacques Lecclerc from Louvain, who contributed one of the
    most valuable and interesting works to the philosophy of labor in the book of
    his Leçons de droit naturel, Entail, Travillé (1946), has criticized this misinterpretation
    of the Christian scriptures: “Christianisme n''est pas grand-ch à l''estime au
