    ### Parallel Streams\n\nMost computers today have a multi-core processor. This\
    \ means, multiple threads can run concurrently in different cores, which makes\
    \ using parallel streams make sense. However, a parallel stream is more expensive\
    \ to construct than a sequential stream, which means using a parallel stream does\
    \ not always make your program run faster.\n\nThe `ParallelStreamDemo` class in\
    \ Listing 4.12 maps six integers with their fibonacci numbers. The objective of\
    \ this example is to show how a parallel stream can run much faster in a multi-core\
    \ processor machine.\n\nListing 4.12: The `ParallelStreamDemo` class\n\n```\n\
    \ package app04;\nimport java.time.Duration;\nimport java.time.Instant;\nimport\
    \ java.util.Arrays;\nimport java.util.List;\n\npublic class ParallelStreamDemo\
    \ {\n\n    public static long fibonacci(long i) {\n        if (i == 1 || i ==\
    \ 2) {\n            return 1;\n        }\n        return fibonacci(i - 1) + fibonacci(i\
    \ - 2);\n    }\n\n    public static void main(String[] args) {\n        List<Integer>\
    \ numbers = \n                Arrays.asList(10, 20, 30, 40, 41, 42);\n\n     \
    \   Instant start = Instant.now();\n        numbers.parallelStream()\n       \
    \         .map((input) -> fibonacci(input))\n                .forEach(System.out::println);\n\
    \        Instant end = Instant.now();\n        System.out.printf(\n          \
    \      \"Processing time with parallel stream : %dms\\n\",\n                Duration.between(start,\
    \ end).toMillis());\n\n        start = Instant.now();\n        numbers.stream()\n\
    \                .map((input) -> fibonacci(input))\n                .forEach(System.out::println);\n\
    \        end = Instant.now();\n        System.out.printf(\n                \"\
    Processing time with sequential stream : %dms\\n\",\n                Duration.between(start,\
    \ end).toMillis());\n    }\n}\n```\n\nIf you run the code, you will see this on\
    \ your console.\n\n```\n 55\n6765\n832040\n102334155\n165580141\n267914296\nProcessing\
    \ time with parallel stream : 953ms\n55\n6765\n832040\n102334155\n165580141\n\
    267914296\nProcessing time with sequential stream : 1764ms\n```\n\nAs you can\
    \ see, you can benefit from a parallel stream. However, for not so resource-intensive\
    \ tasks, the advantage gets less and less and there is a point where the cost\
    \ of setting up a parallel stream outweighs the cost of setting up a sequential\
    \ stream plus the speed-up. For instance, if I replace the numbers with\n\n```\n\
    \ List<Integer> numbers = \n                Arrays.asList(1, 2, 3, 4, 5, 6);\n\
    ```\n\nOn my machine, before you decide to use a parallel stream, do some testing\
    \ to see if it is faster.\n\n### Summary\n\nJDK 1.8 introduces two classes for\
    \ measuring an amount of time, `Duration` and `Period`. These two are similar\
    \ except that `Duration` is time-based and `Period` is date-based. `Duration`\
    \ provides a quantity of time to nanosecond precision. This class is good, for\
    \ example, to model a flight time.\n\n### Chapter 5: The Date-Time API\n\nSupport\
    \ for dates and times has been available since Java version 1.0, mainly through\
    \ the `java.util.Date` class. However, `Date` was poorly designed and not easy\
    \ to work with, causing many to resort to third party alternatives as Joda Time\
    \ ([http://joda.org/](http://joda.org/)). The new Date and Time API in 1.8 resolves\
    \ many of the issues in the old API and is similar to the Joda Time API.\n\nThis\
    \ chapter explains the JDK 1.8 Date-Time.\n\n#### Overview\n\nThe new Date and\
    \ Time API makes it extremely easy to work with dates and times. The `java.time`\
    \ package contains the core classes. In addition, there are four other packages\
    \ whose members are used less often: `java.time.chrono`, `java.time.format`, `java.time.temporal`\
    \ and `java.time.zone`.\n\nWithin the `java.time` package, the `Instant` class\
    \ represents a point on the time-line and is often used to time an operation.\
    \ The `LocalDate` class models a date without the time component and time zone,\
    \ suitable, for example, to represent a birthday.\n\nIf you need a date as well\
    \ as a time, then `LocalDateTime` is for you. For instance, an order shipping\
    \ date probably requires a time in addition to a date to make the order easier\
    \ to track. If you need a time but do not care about the date, then you can use\
    \ `LocalTime`.\n\nOn top of that, if a time zone is important, the Date and Time\
    \ API provides the `ZonedDateTime` class. As the name implies, this class models\
    \ a date-time with a time zone. For instance, you can use this class to calculate\
    \ the flight time between two airports located in different time zones.\n\nThe\
    \ `java.time` package also comes with two enums, `DayOfWeek` and `Month`. `DayOfWeek`\
    \ represents the day of the week, from `MONDAY` to `SUNDAY`. The `Month` enum\
    \ represents the twelve months of the year, from `JANUARY` to `DECEMBER`.\n"
