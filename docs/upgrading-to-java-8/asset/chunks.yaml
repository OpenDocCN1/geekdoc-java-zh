  trans: "\n\n```java\npackage app06;\nimport javafx.application.Application; \nimport\
    \ javafx.geometry.Insets; \nimport javafx.scene.Scene; \nimport javafx.scene.control.Button;\
    \ \nimport javafx.scene.control.ColorPicker; \nimport javafx.scene.control.Label;\
    \ \nimport javafx.scene.image.ImageView; \nimport javafx.scene.layout.BorderPane;\
    \ \nimport javafx.scene.layout.HBox; \nimport javafx.scene.layout.VBox; \nimport\
    \ javafx.stage.Stage; \n\npublic class BorderPaneDemo extends Application { \n\
    \n    @Override \n    public void start(Stage stage) { \n        Button okButton\
    \ = new Button(\"OK\"); \n        okButton.setDefaultButton(true); \n\n      \
    \  Button cancelButton = new Button(\"Cancel\"); \n        HBox hBox = new HBox();\
    \ \n        hBox.setPadding(new Insets(15, 12, 15, 12)); \n        hBox.setSpacing(10);\
    \ \n        hBox.setStyle(\"-fx-background-color: #886699;\"); \n        hBox.getChildren().addAll(okButton,\
    \ cancelButton); \n        BorderPane root = new BorderPane(); \n        root.setTop(hBox);\
    \ \n\n        ImageView imageView = new ImageView(\"image/1.jpg\"); \n       \
    \ root.setCenter(imageView); \n\n        VBox vBox = new VBox(); \n        vBox.setStyle(\"\
    -fx-background-color: \" + \n        \"#ddeeff;-fx-padding:10px\"); \n       \
    \ vBox.getChildren().addAll( \n                new Label(\"Select Color:\"), \n\
    \                new ColorPicker()); \n        root.setLeft(vBox); \n\n      \
    \  root.setStyle(\"-fx-background-color: #6680e6;\"); \n        Scene scene =\
    \ new Scene(root, 740, 530); \n\n        stage.setTitle(\"HBox, VBox, BorderPane\
    \ Demo\"); \n        stage.setScene(scene); \n        stage.show(); \n    } \n\
    \n    public static void main(String[] args) { \n        launch(args); \n    }\
    \ \n} \n```\n\n图 6.5 显示了 Windows 上的 `BorderPaneDemo` 。\n\n![](img/0605.png)\n\n\
    图 6.5：BorderPane demo\n\n## 事件处理\n\nJavaFX 是事件驱动的。UI 组件可以引发事件，你可以编写代码来处理这些事件。这种事件驱动机制使得\
    \ JavaFX 应用程序能够用户交互性。\n\n有许多类型的事件，它们都继承自 `javafx.event.Event` 类。`Event` 的子类包括\
    \ `ActionEvent`、`InputMethodEvent`、`MouseEvent`、`MouseDragEvent`、`ScrollEvent`、`SwipeEvent`\
    \ 等。\n\n不同的组件可能会引发不同的事件。例如，点击按钮会引发 `ActionEvent`，在 `TextField` 中更改文本会触发 `InputMethodEvent`。你可以编写并注册一个事件处理器，当相应的事件发生时，该处理器会被调用。例如，你可以为\
    \ `TextField` 的 `InputMethodEvent` 编写一个处理器，将输入的文本转换为大写。或者，你可以编写一个处理器，在按钮被点击时打开另一个\
    \ `Stage`。\n\n在 JavaFX 中编写和注册事件处理器的最简单的方法是使用 `Node` 类提供的便利方法之一。这些方法的名称遵循 `setOnXXX`\
    \ 模式，并且被 `Node` 的所有后代继承。便利方法的示例有 `setOnDragEntered`、`setOnDragExited`、`setOnInputMethodTextChanged`、`setOnKeyTyped`、`setOnMouseClicked`\
    \ 等许多。`Node` 的子类可能会添加更多便利方法以适应它们特定的事件。\n\n这些便利方法接受一个 `EventHandler` 对象作为参数。`javafx.event.EventHandler`\
    \ 是一个带有 `handle` 方法的泛型接口。这里是 `EventHandler` 的定义。\n\n```java\n package javafx.event;\n\
    public interface EventHandler<T extends Event> extends \n        java.util.EventListener\
    \ {\n\n    void handle(T event)\n\n}\n```\n\n在构造 `EventHandler` 时，你必须传递合适的事件类型。例如，以下代码构造了\
    \ `ActionEvent` 的 `EventHandler`。\n\n```java\nEventHandler handler = new EventHandler<ActionEvent>()\
    \ { \n\n    @Override \n    public void handle(ActionEvent event) { \n       \
    \ // 执行某些操作\n    } \n};\n```\n\n列表 6.4 中的 `RotateDemo` 类展示了 JavaFX 事件处理。该类包含一个\
    \ `Rectangle` 和一个 `Button`，并捕获 `Button` 的 `ActionEvent`。每当按钮被点击时，`Rectangle` 就会顺时针旋转\
    \ 10 度。\n\n列表 6.4：`RotateDemo` 类\n\n```java\n package app06;\n\nimport javafx.application.Application;\
    \ \nimport javafx.collections.ObservableList; \nimport javafx.event.ActionEvent;\
    \ \nimport javafx.event.EventHandler; \nimport javafx.scene.Node; \nimport javafx.scene.Scene;\
    \ \nimport javafx.scene.control.Button; \nimport javafx.scene.layout.VBox; \n\
    import javafx.scene.paint.Color; \nimport javafx.scene.shape.Rectangle; \nimport\
    \ javafx.stage.Stage; \n\npublic class RotateDemo extends Application { \n\n \
    \   @Override \n    public void start(Stage stage) { \n        VBox root = new\
    \ VBox(40); \n        ObservableList<Node> children = root.getChildren(); \n \
    \       final Rectangle rect = new Rectangle(80, 50); \n        rect.setFill(Color.AQUAMARINE);\
    \ \n        children.add(rect); \n\n        Button button = new Button(\"Rotate\"\
    ); \n        button.setOnAction(new EventHandler<ActionEvent>() { \n         \
    \   @Override \n            public void handle(ActionEvent event) { \n       \
    \         rect.rotate(10); \n            } \n        });\n\n        Scene scene\
    \ = new Scene(root, 120, 130); \n        stage.setTitle(\"Rotate Demo\"); \n \
    \       stage.setScene(scene); \n        stage.show(); \n    } \n\n    public\
    \ static void main(String[] args) { \n        launch(args); \n    } \n}\n```\n\
    \n在应用程序的 `start` 方法中，创建了一个 `Button` 并调用了它的 `setOnAction` 方法。\n\n图 6.6 显示了该应用程序。尝试点击按钮观察效果。\n\
    \n![](img/0606.png)\n\n图 6.6：JavaFX 中的事件处理\n\n## 使用 CSS 样式\n\n某些控件提供了更改其外观的方法。例如，`Label`\
    \ 类的 `setFont` 方法允许你设置显示文本的字体。虽然这些方法易于使用，但它们必须在代码内部调用，这导致了表示层与业务逻辑之间的紧耦合。更好的方法是使用\
    \ CSS（级联样式表）样式 UI 组件。在本书中，CSS 指 JavaFX 中使用的 CSS。\n\nCSS 文件包含可以通过 ID 或类引用的样式。每个\
    \ JavaFX 控件已分配了一个默认 CSS 类，与控件的 Java 类名相似。例如，`Button` 的默认样式是 `button`，`Label` 的默认样式是\
    \ `label`。这意味着，为了提供影响所有按钮的样式，你只需要在 CSS 文件中有一个名为 `button` 的样式即可。例如：\n\n```css\n\
    \ .button {\n    -fx-border-width: 3px; \n    -fx-background-color:#dd8818; \n\
    } \n```\n\n多单词控件的默认样式是单词组合。例如，`CheckBox` 的默认样式是 `check-box`，`ProgressBar` 的默认样式是\
    \ `progress-bar`。\n\n非控件节点没有默认样式。如果你想为 `VBox` 设置样式，首先需要为实例添加一个 CSS 类。例如，以下代码为\
    \ `VBox` 添加了名为 `vbox` 的类。\n\n```java\n VBox vBox = new VBox(); \nvBox.getStyleClass().add(\"\
    vbox\"); \n```\n\n该 `VBox` 随后会对应用程序引用的任何 CSS 文件中的 `vbox` 样式做出响应。\n\n"
- fmt: "\nIn addition to using style classes, you can also create a style that will\
    \ be referred by the component identifier. You do this if you want a style that\
    \ will only affect a certain instance of a type, and not all instances of that\
    \ particular type. For example, the `.button` style affects all `Button` controls\
    \ in an application. If you want a style to affect a certain `Button` and not\
    \ all `Buttons`, you can either add a new class to the `Button` or add an identifier\
    \ to it. Here is an example of a `Button` that is assigned the id `nextBtn`.\n\
    \n```\n Button nextButton = new Button(\"Next\"); \nnextButton.setId(\"nextBtn\"\
    ); \n```\n\nYou can then create this style in your CSS file that will only affect\
    \ that Button.\n\n```\n #nextBtn { \n    -fx-font-weight: bold; \n}\n```\n\nNote\
    \ that each node has a `setStyle` method that you can call to assign a CSS style.\
    \ However, this practice is not recommended as you are mixing presentation and\
    \ business logic. Here is an example of how you can use `setStyle`.\n\n```\n Button\
    \ button = new Button();\nbutton.setStyle(\"-fx-background-color:green\");\n```\n\
    \nIt’s better to write all your styles in a CSS file. Once your CSS file is ready,\
    \ you can load it from the application’s start method, like this.\n\n```\n @Override\
    \ \npublic void start(Stage stage) { \n    ...\n    Scene scene = ...; \n    scene.getStylesheets().add(\"\
    style.css\");\n    ...\n} \n```\n\nHere, `style.css` is the CSS file located in\
    \ the same location as the class file.\n\nThe following are some of the styles\
    \ used in this chapter.\n\n*   `-fx-fill`\n*   `-fx-font-family`\n*   `-fx-font-size`\n\
    *   `-fx-font-style`\n*   `-fx-font-weight`\n*   `-fx-background-color`\n*   `-fx-text-fill`\n\
    \nAs an example, consider the `CSSDemo` class in Listing 6.5 that uses the `style.css`\
    \ file in Listing 6.6.\n\nListing 6.5: The `CSSDemo` class\n\n```\n package app06;\n\
    import javafx.application.Application; \nimport javafx.scene.Scene; \nimport javafx.scene.control.Button;\
    \ \nimport javafx.scene.control.Label; \nimport javafx.scene.layout.BorderPane;\
    \ \nimport javafx.scene.layout.HBox; \nimport javafx.stage.Stage; \n\npublic class\
    \ CSSDemo extends Application { \n\n    @Override \n    public void start(Stage\
    \ stage) { \n        BorderPane root = new BorderPane(); \n\n        root.setCenter(new\
    \ Label(\"Welcome\")); \n\n        HBox hBox = new HBox(); \n        hBox.getStyleClass().add(\"\
    hbox\"); \n\n        Button backButton = new Button(\"Back\"); \n        hBox.getChildren().add(backButton);\
    \ \n        Button nextButton = new Button(\"Next\"); \n        nextButton.setId(\"\
    nextBtn\"); \n        hBox.getChildren().add(nextButton); \n        root.setBottom(hBox);\
    \ \n\n        Scene scene = new Scene(root, 400, 300); \n        scene.getStylesheets().add(\"\
    style.css\");\n\n        stage.setTitle(\"CSS Demo\"); \n        stage.setScene(scene);\
    \ \n        stage.show(); \n    } \n\n    public static void main(String[] args)\
    \ { \n        launch(args); \n    } \n} \n```\n\nListing 6.6: The `style.css`\
    \ file\n\n```\n .label { \n    -fx-background-color: #778855; \n    -fx-font-family:\
    \ helvetica; \n    -fx-font-size: 450%; \n    -fx-text-fill: yellow;\n} \n.hbox\
    \ { \n    -fx-background-color: #2f4f4f; \n    -fx-padding: 15; \n    -fx-spacing:\
    \ 10; \n    -fx-alignment: center-right; \n} \n\n.button { \n    -fx-border-width:\
    \ 2px; \n    -fx-background-color:#ff8800;\n    -fx-cursor: hand;\n} \n\n#nextBtn\
    \ { \n    -fx-font-weight: bold; \n}\n```\n\nIf you run the application, you’ll\
    \ see a `Stage` just like that in Figure 6.7.\n\n![](Images/0607.png)\n\nFigure\
    \ 6.7: CSS Demo\n\nAs a side note, the `jfxrt.jar` file, the JavaFX runtime file,\
    \ includes a `modena.css` file. This is the default style sheet for the root node\
    \ and UI controls. I recommend that you look at the content of this file to learn\
    \ all the styles defined. To view this file, go to the directory the jar file\
    \ is located and run this command.\n\n```\n jar xf jfxrt.jar com/sun/javafx/scene/control/skin/modena/modena.css\n\
    ```\n\n### Using DatePicker\n\nA new component in JavaFX 8, `DatePicker` allows\
    \ the user to select a date or enter it as text. You can then retrieve the selected\
    \ date as a `LocalDate`. You can also respond to date selection by writing an\
    \ `EventHandler` and passing to the `DatePicker`’s `setOnAction` method.\n\nListing\
    \ 6.7 shows a JavaFX application that uses a `DatePicker` to select a birthday.\
    \ If the user selects a future date, an error message will be displayed next to\
    \ the `DatePicker`.\n\nListing 6.7: The DatePicker class\n\n```\n package app06;\n\
    import java.time.LocalDate;\nimport java.time.Period;\nimport javafx.application.Application;\n\
    import javafx.event.Event;\nimport javafx.event.EventHandler;\nimport javafx.geometry.HPos;\n\
    import javafx.scene.Scene;\nimport javafx.scene.control.DatePicker;\nimport javafx.scene.control.Label;\n\
    import javafx.scene.layout.GridPane;\nimport javafx.scene.layout.VBox;\nimport\
    \ javafx.stage.Stage;\n\npublic class DatePickerDemo extends Application {\n\n\
    \    public static void main(String[] args) {\n        launch(args);\n    }\n\n\
    \    @Override\n    public void start(Stage stage) {\n        stage.setTitle(\"\
    DatePicker Demo\");\n        VBox vbox = new VBox(20);\n        vbox.setStyle(\"\
    -fx-padding: 15;\");\n        Scene scene = new Scene(vbox, 550, 340);\n     \
    \   stage.setScene(scene);\n\n        GridPane gridPane = new GridPane();\n  \
    \      gridPane.setHgap(10);\n        gridPane.setVgap(10);\n\n        Label label\
    \ = new Label(\"Birthday:\");\n        gridPane.add(label, 0, 0);\n\n        DatePicker\
    \ birthdayPicker = new DatePicker();\n        gridPane.add(birthdayPicker, 0,\
    \ 1);\n\n        Label error = new Label();\n        gridPane.add(error, 1, 1);\n\
    \n        birthdayPicker.setOnAction(new EventHandler() {\n            public\
    \ void handle(Event t) {\n                LocalDate selectedDate = birthdayPicker.getValue();\n\
    \                System.out.println(\"Selected date: \" + selectedDate);\n   \
    \             LocalDate today = LocalDate.now();\n                if (Period.between(selectedDate,\
    \ today).isNegative()) {\n                    error.setText(\"Your birthday cannot\
    \ be later than today\");\n                } else {\n                    error.setText(\"\
    \");\n                }\n            }\n        });\n\n        vbox.getChildren().add(gridPane);\n\
    \        stage.show();\n    }\n}\n```\n\nFigure 6.8 shows the application.\n\n\
    ![](Images/0608.png)\n\nFigure 6.8: Steps to program\n\nSummary\n\nJavaFX is a\
    \ Java technology for creating desktop and in-browser applications. It is a better\
    \ solution than both AWT and Swing and is therefore destined to replace its predecessors.\n\
    \nThis chapter introduced JavaFX and provided a couple of examples. The next chapter,\
    \ “JavaFX with FXML” explains how to separate the presentation layer and the logic\
    \ using a special markup language called FXML.\n\n# Chapter 7: JavaFX with FXML\n\
    \nFXML is an XML-based markup language for constructing JavaFX user interface\
    \ (UI). Using FXML in JavaFX applications is a great way of separating the presentation\
    \ layer and the logic. This chapter discusses FXML and shows how to use it in\
    \ JavaFX application development.\n\n## Overview\n\nA new feature of JavaFX 2,\
    \ FXML greatly reduces the complexity of your JavaFX classes by moving user interface\
    \ construction to an XML-based document. In addition, FXML visualizes the UI component\
    \ hierarchy much better than Java classes. The root of an FXML document represents\
    \ a `javafx.scene.Parent` that can be loaded to JavaFX using a special loader\
    \ called `FXLoader`. Here is the start method of an `Application` subclass that\
    \ uses FXML.\n\n```\n @Override \npublic void start(Stage stage) throws Exception\
    \ { \n    stage.setTitle(\"FXML Example\"); \n    Parent root = (Parent) FXMLLoader.load(\n\
    \            getClass().getResource(\"example1.fxml\")); \n    Scene scene = new\
    \ Scene(root, 740, 530); \n    stage.setScene(scene); \n    stage.show(); \n}\
    \ \n```\n\nThe code above calls the `load` method of `FXLoader` to read an FXML\
    \ file and convert its content to a `Parent` object. The `Parent` object is then\
    \ used to construct a `Scene`.\n"
