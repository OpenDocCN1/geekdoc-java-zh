  trans: "\n关于构造函数引用的更多示例，可以在第 4 章“Stream API”中找到。\n\n# 总结\n\nJava 8 的一项新功能 `lambda\
    \ expressions` 可以让某些结构变得更短更具可读性，特别是当你在处理内部类时。本章讨论了方法引用，这是一种可以使编写 lambda 表达式的子功能。\n\
    \n# 第 3 章：Optional 及相似类\n\nJava 程序员多年来一直在处理 `null pointer exceptions`（空指针异常）。在\
    \ Java 8 中，处理它们有一种新方法：通过将可能为空的对象封装在一个名为 `Optional` 的类中。本章涵盖了 `Optional` 以及相似类。\n\
    \n## 概述\n\nJava 8 增加了 `Optional`、`OptionalInt`、`OptionalLong` 和 `OptionalDouble`\
    \ 类来处理 `NullPointerExceptions`。这些类作为 `java.util` 包的一部分，是大量使用 lambda 表达式和方法引用的优秀范例。\n\
    \n这四个类非常相似，而 `Optional` 是其中最重要的，因为它可以用于任何类型，而其他类分别仅适用于整数、`longs` 或 `doubles`。因此，`Optional`\
    \ 是本章的重点。\n\n`Optional` 是一个用于可能为空的值的容器。正如你现在所知的，尝试在空引用变量上调用方法或字段会抛出 `NullPointerException`。处理空并不困难，但可能会很繁琐。考虑列表\
    \ 3.1 中的代码，它展示了一个 `Company` 类，它可以拥有一个 `Office`，而 `Office` 又可以拥有 `Address`。为了简单起见，这里的\
    \ `Address` 只包含两个字段：`street` 和 `city`。所有这些属性都可以为空。一个 `Company` 可能没有 `Office`，而一个\
    \ `Address` 可能没有关于 `street` 和 `city` 的完整数据。\n\n### 列表 3.1：检查空值的繁琐方法\n\n```\npackage\
    \ app03.optional1;\n\nclass Company {\n    private String name;\n    private Office\
    \ office;\n    public Company(String name, Office office) {\n        this.name\
    \ = name;\n        this.office = office;\n    }\n\n    public String getName()\
    \ {\n        return name;\n    }\n\n    public Office getOffice() {\n        return\
    \ office;\n    }\n}\n\nclass Office {\n    private String id;\n    private Address\
    \ address;\n\n    public Office(String id, Address address) {\n        this.id\
    \ = id;\n        this.address = address;\n    }\n\n    public String getId() {\n\
    \        return id;\n    }\n\n    public Address getAddress() {\n        return\
    \ address;\n    }\n}\n\nclass Address {\n    private String street;\n    private\
    \ String city;\n\n    public Address(String street, String city) {\n        this.street\
    \ = street;\n        this.city = city;\n    }\n\n    public String getStreet()\
    \ {\n        return street;\n    }\n\n    public String getCity() {\n        return\
    \ city;\n    }\n}\n\npublic class OptionalDemo1 {\n\n    public static void main(String[]\
    \ args) {\n        Address address1 = new Address(null, \"New York\");\n     \
    \   Office office1 = new Office(\"OF1\", address1);\n        Company company1\
    \ = new Company(\"Door Never Closed\",\n            office1);\n\n        // company1\
    \ 的街道地址是什么？\n        // company1 位于哪个城市？\n        String streetAddress = null;\n\
    \        String city = null;\n        if (company1 != null) {\n            Office\
    \ office = company1.getOffice();\n            if (office != null) {\n        \
    \        Address address = office.getAddress();\n                if (address !=\
    \ null) {\n                    streetAddress = address.getStreet();\n        \
    \            city = address.getCity();\n                }\n            } \n  \
    \      }\n        System.out.println(\"Street Name:\" + streetAddress);\n    \
    \    System.out.println(\"City:\" + city);\n    }\n}\n```\n\n列表 3.1 中的 `OptionalDemo1`\
    \ 类创建了一个用于测试的 `Company`，并尝试获取该公司的街道地址。意识到任何字段都可能为空，程序员有意识地尝试在对实例调用方法之前对每个单独实例进行空值测试，导致了如下代码：\n\
    \n```\n        if (company1 != null) {\n            Office office = company1.getOffice();\n\
    \n            if (office != null) {\n                Address address = office.getAddress();\n\
    \                if (address != null) {\n                    streetAddress = address.getStreet();\n\
    \                    city = address.getCity();\n                }\n          \
    \  } \n        }\n```\n\n这有点很繁琐，且可读性受损。\n\n`Optional` 类可以提供帮助。如果你决定使用它，你可以将每个可能为空的字段封装在\
    \ `Optional` 中。例如，`Company` 中的 `office` 字段现在应该是：\n\n```java\n private Optional<Office>\
    \ office;\n```\n\n而 `Address` 中的 `city` 字段应该是\n\n```java\n private Optional<String>\
    \ city;\n```\n\n在学习如何使用 `Optional` 重写列表 3.1 中的示例之前，请先看表 3.1 中 `Optional` 的方法。\n\
    \n| 方法 | 描述 |\n| :--- | :--- |\n| `empty` | 返回一个空的 `Optional` |\n| `filter` |\
    \ 如果值存在并匹配给定的谓词，则返回一个描述该值的 `Optional`。否则，返回一个空的 `Optional`。 |\n| `flatMap` | 如果值存在，对该值应用指定的映射函数，并返回一个描述映射结果的\
    \ `Optional`。如果值不存在，返回一个空的 `Optional`。 |\n| `get` | 如果值存在，则返回值。否则，抛出 `NoSuchElementException`。\
    \ |\n| `ifPresent` | 如果值存在，则调用给定的 `Consumer`。 |\n| `isPresent` | 如果值存在，则返回 true。否则，返回\
    \ false。 |\n| `map` | 如果值存在，则对它应用给定的映射函数。如果结果不为空，返回一个描述结果的 `Optional`。 |\n| `of`\
    \ | 返回描述给定非空值的 `Optional`。 |\n| `ofNullable` | 如果给定值不为空，则返回描述该值的 `Optional`。如果值为空，返回一个空的\
    \ `Optional`。 |\n| `orElse` | 如果值存在，则返回值。否则，返回指定的值。 |\n\n表 3.1：Optional 的重要方法\n\
    \n"
- fmt: "\n```java\n package app03.optional2;\nimport java.util.Optional;\n\nclass\
    \ Company {\n    private String name;\n    private Optional<Office> office;\n\n\
    \    public Company(String name, Optional<Office> office) {\n        this.name\
    \ = name;\n        this.office = office;\n    }\n\n    public String getName()\
    \ {\n        return name;\n    }\n\n    public Optional<Office> getOffice() {\n\
    \        return office;\n    }\n}\n\nclass Office {\n    private String id;\n\
    \    private Optional<Address> address;\n\n    public Office(String id, Optional<Address>\
    \ address) {\n        this.id = id;\n        this.address = address;\n    }\n\n\
    \    public String getId() {\n        return id;\n    }\n\n    public Optional<Address>\
    \ getAddress() {\n        return address;\n    }\n}\n\nclass Address {\n    private\
    \ Optional<String> street;\n    private Optional<String> city;\n\n    public Address(Optional<String>\
    \ street, Optional<String> city) {\n        this.street = street;\n        this.city\
    \ = city;\n    }\n\n    public Optional<String> getStreet() {\n        return\
    \ street;\n    }\n\n    public Optional<String> getCity() {\n        return city;\n\
    \    }\n}\n\npublic class OptionalDemo2 {\n    public static void main(String[]\
    \ args) {\n        Optional<Address> address1 = Optional.of(\n               \
    \ new Address(Optional.ofNullable(null), \n                        Optional.of(\"\
    New York\")));\n        Optional<Office> office1 = Optional.of(\n            \
    \    new Office(\"OF1\", address1));\n\n        Optional<Company> company1 = Optional.of(\n\
    \                new Company(\"Door Never Closed\", office1));\n\n        // What\
    \ is the street address of company1?\n        // In which city company1 is located?\n\
    \        Optional<Office> maybeOffice = \n                company1.flatMap(Company::getOffice);\n\
    \        Optional<Address> maybeAddress = \n                maybeOffice.flatMap(Office::getAddress);\n\
    \        Optional<String> maybeStreet = \n                maybeAddress.flatMap(Address::getStreet);\n\
    \        maybeStreet.ifPresent(System.out::println);\n        if (maybeStreet.isPresent())\
    \ {\n            System.out.println(maybeStreet.get());\n        } else {\n  \
    \          System.out.println(\"Street not found\");\n        }\n\n        //\
    \ shorter way\n        String city = company1.flatMap(Company::getOffice)\n  \
    \          .flatMap(Office::getAddress)\n            .flatMap(Address::getCity)\n\
    \            .orElse(\"City not found\");\n        System.out.println(\"City:\
    \ \" + city);\n\n        // only print if city is not null\n        company1.flatMap(Company::getOffice)\n\
    \                .flatMap(Office::getAddress)\n                .flatMap(Address::getCity)\n\
    \                .ifPresent(System.out::println);\n    }\n}\n```\n\nThe `OptionalDemo2`\
    \ class shows how to get the street and city of a company, first by assigning\
    \ the return value of each `flatMap` invocation to a variable and then by cascading\
    \ it.\n\n### OptionalInt, OptionalLong and OptionalDouble\n\nThe `OptionalInt`,\
    \ `OptionalLong` and `OptionalDouble` classes have a subset of the methods offered\
    \ by `Optional`. For example, they have these methods: `empty`, `ifPresent`, `isPresent`,\
    \ and `of`. `of` takes a primitive and since a primitive cannot be null, there\
    \ is no `ofNullable` method. There is no `get` method either. Instead, `OptionalInt`\
    \ has a `getAsInt` method, `OptionalLong` a `getAsLong` method and `OptionalDouble`\
    \ a `getAsDouble` method. There are no `filter`, `flatMap` and `map` methods either.\n\
    \n### Summary\n\nJava programmers have to deal with null pointer exceptions every\
    \ where in his or her code. Java 8 introduces `Optional` and similar classes as\
    \ a new powerful way of tackling null pointer exceptions. You have learned how\
    \ to use `Optional` in this chapter.\n\n# Chapter 4\n\n## The Stream API\n\nIn\
    \ this chapter you will learn about the `Stream API`, a new feature of JDK 8.\
    \ To understand the topics in this chapter, you need to know how to use `Lambda\
    \ expressions` and the predefined functional interfaces in `java.util.function`,\
    \ both discussed in Chapter 1, “Lambda Expressions.”\n\n## Overview\n\nA stream\
    \ is like a pipe, but instead of transporting water or oil, a stream transfers\
    \ data from a source to a destination. Depending on the mode of transfer, a stream\
    \ can be either sequential or parallel. A parallel stream is especially useful\
    \ if the computer the program is running on has a multicore CPU.\n\nAt first glance,\
    \ a stream may look like a collection. However, a stream is not a data structure\
    \ for storing objects, it only moves them. As such, you cannot add an element\
    \ to a stream as you would to a collection.\n\nThe main reason for using a stream\
    \ is for its supports for sequential and parallel aggregate operations. For example,\
    \ you can easily filter, sort or map the elements in a stream.\n\nThe `Stream\
    \ API` consists of the types in the `java.util.stream` package. The `Stream` interface\
    \ is the most frequently used stream type. A `Stream` can be used to transfer\
    \ any type of objects. There are also specializations of `Stream`: `IntStream`,\
    \ `LongStream` and `DoubleStream`. All the four stream types are derived from\
    \ `BaseStream`.\n\nTable 4.1 shows some of the methods defined in the `Stream`\
    \ interface.\n\n| Method | Description |\n| :--- | :--- |\n| `concat` | Lazily\
    \ concatenates or links together two streams. It returns a new stream whose elements\
    \ are all the elements of the first stream followed by all the elements of the\
    \ second stream. |\n| `count` | Returns the number of elements of the stream.\
    \ |\n| `empty` | Creates and returns an empty stream. |\n| `filter` | Returns\
    \ a new stream whose elements are all the elements of this stream that match the\
    \ given predicate. |\n| `forEach` | Performs an action on each element of the\
    \ stream. |\n| `limit` | Returns a new stream having the specified maximum number\
    \ of elements from the current stream. |\n| `map` | Returns a stream consisting\
    \ of the results of applying the given function to the elements of this stream.\
    \ |\n| `max` | Returns the maximum element of this stream according to the given\
    \ comparator. |\n| `min` | Returns the minimum element of this stream according\
    \ to the given comparator. |\n| `of` | Returns a stream whose source is the given\
    \ values. |\n| `reduce` | Performs a reduction on this stream’s elements using\
    \ an identity and an accumulator. |\n| `sorted` | Returns a new stream containing\
    \ the elements of this stream in natural order |\n| `toArray` | Returns an array\
    \ containing the elements of this stream. |\n\nTable 4.1: More important methods\
    \ of Stream\n\nSome of the Stream methods perform intermediate operations and\
    \ some perform terminal operations. An intermediate operation transforms a stream\
    \ into another stream. Methods such as `filter`, `map` and `sorted` are examples\
    \ of methods that perform intermediate operations. A terminal operation produces\
    \ a result or side-effect. Methods such as `count` and `forEach` perform terminal\
    \ operations.\n\nIt is worth noting that streams are lazy. Computation on the\
    \ source is only performed when a terminal operation is started.\n\nStream’s methods\
    \ will be explained in detail in the sections to come.\n\n## Creating and Obtaining\
    \ a Stream\n\nYou can use the `of` static method in `Stream` to create a sequential\
    \ stream. For example, the following code snippet creates a `Stream` of `Integers`\
    \ with three elements.\n\n```java\n Stream<Integer> stream = Stream.of(100, 200,\
    \ 300);\n```\n\nOr, you can pass an array to the `of` method:\n\n```java\ning[]\
    \ names = {\"Bart\", \"Lisa\", \"Maggie\"};\nStream<String> stream = Stream.of(names);\n\
    ```\n\nThe `java.util.Arrays` utility class now has a `stream` method for converting\
    \ an array to a sequential stream. For instance, you can rewrite the code above\
    \ using `Arrays` to create a Stream from an array.\n\n```java\n String[] names\
    \ = {\"Bart\", \"Lisa\", \"Maggie\"};\nStream<String> stream = Arrays.stream(names);\n\
    ```\n\nIn addition, the `java.util.Collection` interface also has default methods\
    \ named `stream` and `parallelStream` that return a sequential or a parallel stream,\
    \ respectively, with the collection as its source. Their signatures are as follows.\n\
    \n```java\n default java.util.stream.Stream<E> stream()\ndefault java.util.stream.Stream<E>\
    \ parallelStream()\n```\n\nThanks to these methods in `Collection`, getting a\
    \ `Stream` from a `List` or a `Set` is a breeze.\n"
