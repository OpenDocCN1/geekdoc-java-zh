    \ in an object\n\n```\n package app02.methodref;\nimport java.util.Arrays;\nimport\
    \ java.util.List;\n\npublic class MethodReferenceDemo2 {\n    public static void\
    \ main(String[] args) {\n        List<String> fruits = Arrays.asList(\"Apple\"\
    , \"Banana\");\n        // with lambda expression\n        fruits.forEach((name)\
    \ -> System.out.println(name));\n\n        // with method reference\n        fruits.forEach(System.out::println);\n\
    \    }\n}\n```\n\nThe MethodReferencDemo2 class has a list of fruits that needs\
    \ to be printed. You can do this by calling the forEach method, passing a Consumer\
    \ in the form of a lambda expression like so:\n\n```\n fruits.forEach((name) ->\
    \ System.out.println(name));\n```\n\nAlternatively, since System.out is an existing\
    \ object that the system has created for you, you can use a method reference to\
    \ the println method on System.out.\n\n```\n fruits.forEach(System.out::println);\n\
    ```\n\nReference to An Instance Method where No Object Reference Is Available\n\
    \nHold on tight. This one is a bit tricky and requires your full concentration.\n\
    \nYou can pass a reference to an instance method as a method argument to replace\
    \ a functional interface. In this case, you do not have to explicitly create an\
    \ instance of the containing class. The syntax for this kind of method reference\
    \ is different from that of the first and second kinds of method references. With\
    \ the first two kinds, the number of arguments must be the same as the number\
    \ of arguments expected by the functional interface’s abstract method. When using\
    \ an instance method without an object reference, the referenced method must have\
    \ one fewer argument than the number of arguments expected by the functional interface’s\
    \ abstract method. Therefore, if the functional interface’s abstract method takes\
    \ four arguments, the referenced instance method must take only three arguments,\
    \ which must be compatible with the second, third and fourth arguments of the\
    \ abstract method. In addition, the first argument of the abstract method must\
    \ be of a type that is compatible as the class containing the instance method.\n\
    \nThe compatibility rule for this kind of method reference is depicted below.\
    \ The first line is a pseudo-signature of the functional interface’s abstract\
    \ method and the second line a pseudo-signature of the referenced instance method.\n\
    \n```\n returnType abstractMethod(type-1, type-2, type-3, type-4)\nreturnType\
    \ instanceMethod(type-2, type-3, type-4)\n```\n\nHere, type-1 must be compatible\
    \ with the class containing the instance method because the class will be instantiated\
    \ and the instance passed as the first argument to the abstract method, along\
    \ with the other arguments.\n\nThis will become clear after you have seen the\
    \ example for this kind of method reference.\n\nListing 2.5: The MethodReferenceDemo3\
    \ class\n\n```\n package app02.methodref;\nimport java.util.Arrays;\n\npublic\
    \ class MethodReferenceDemo3 {\n\n    public static void main(String[] args) {\n\
    \        String[] names = {\"Alexis\", \"anna\", \"Kyleen\"};\n\n        Arrays.sort(names,\
    \ String::compareToIgnoreCase);\n        for (String name : names) {\n       \
    \     System.out.println(name);\n        }\n    }\n}\n```\n\nThe example in Listing\
    \ 2.5 shows how to pass an instance method reference to Arrays.sort in lieu of\
    \ a Comparator. The MethodReferenceDemo3 class contains a string array with three\
    \ names where case-sensitivity is not strictly adhered to. If you use an override\
    \ of Arrays.sort that only takes one argument to sort this array, the names will\
    \ be sorted as\n\n```\n Alexis, Kyleen, anna\n```\n\nThis is not what you really\
    \ want. So, you need to use Arrays.sort that also takes a Comparator:\n\n```\n\
    \ public static <T> void sort(T[] array, Comparator<? super T> c)\n```\n\nThe\
    \ example shows how you can use an instance method reference String.compareIgnoreCase\
    \ to replace a Comparator (Recall that Comparator is a functional interface).\
    \ Here is the signature of String.compareToIgnoreCase.\n\n```\n public int compareToIgnoreCase(String\
    \ str)\n```\n\nIt has one less argument than the signature of Comparator.compare.\n\
    \n```\n int compare(String str1, String str2)\n```\n\nThis is perfect for the\
    \ second kind of method reference.\n\nIf you run the code, you will see that the\
    \ names are sorted correctly. Here is the result.\n\n```\n Alexis\nanna\nKyleen\n\
    ```\n\nReference to A Constructor\n\nThe fourth kind of method reference uses\
    \ a constructor. The syntax for a constructor reference is as follows.\n\n```\n\
    \ ClassName::new\n```\n\nSuppose you need a method to convert an Integer array\
    \ to a Collection and you need to be able to determine whether the resulting collection\
    \ is a List or a Set. To this end, you can create the arrayToCollection method\
    \ in Listing 2.6.\n\nListing 2.6: The MethodReferenceDemo4 class\n\n```\n package\
    \ app02.methodref;\nimport java.util.ArrayList;\nimport java.util.Collection;\n\
    import java.util.HashSet;\nimport java.util.function.Supplier;\n\npublic class\
    \ MethodReferenceDemo4 {\n\n    public static Collection<Integer> arrayToCollection(\n\
    \            Supplier<Collection<Integer>> supplier, Integer[] \n            \
    \    numbers) {\n        Collection<Integer> collection = supplier.get();\n  \
    \      for (int i : numbers) {\n            collection.add(i);\n        }\n  \
    \      return collection;\n    }\n\n    public static void main(String[] args)\
    \ {\n        Integer[] array = {1, 8, 5};\n        Collection<Integer> col1 \n\
    \                = arrayToCollection(ArrayList<Integer>::new, array);\n      \
    \  System.out.println(\"Natural order\");\n        col1.forEach(System.out::println);\n\
    \        System.out.println(\"=======================\");\n        System.out.println(\"\
    Ascending order\");\n        Collection<Integer> col2 \n                = arrayToCollection(HashSet<Integer>::new,\
    \ array);\n        col2.forEach(System.out::println);\n    }\n}\n```\n\nInstead\
    \ of passing this lambda expression as the first argument to the method.\n\n```\n\
    \ () -> new ArrayList<Integer>()\n```\n\nYou can simply pass this reference to\
    \ the ArrayList constructor.\n\n```\n ArrayList<Integer>::new\n```\n\nAnd, instead\
    \ of this\n\n```\n () -> new HashSet<Integer>()\n```\n\nyou can write\n\n```\n\
    \ HashSet<Integer>::new\n```\n\nIf you run the example, you will see this on the\
    \ console.\n\n```\n Natural order\n1\n8\n5\n=======================\nAscending\
    \ order\n1\n5\n8\n```"
