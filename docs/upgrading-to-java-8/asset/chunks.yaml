  trans: "\n\n作为一种构建浏览器内应用程序的技术，JavaFX 必须与其它技术竞争，特别是 HTML 5、Flash 和 Microsoft Silverlight。HTML\
    \ 5 的优势在于被现代浏览器原生支持，这意味着使用 HTML 5 构建的任何内容都能保证在这些浏览器中无缝运行，尽管 HTML 5 的功能没有 JavaFX、Flash\
    \ 或 Silverlight 丰富。JavaFX、Flash 和 Silverlight 应用需要插件才能在浏览器中运行，浏览器并不一定带有这些插件，因此例如\
    \ JavaFX applet 用户可能在运行 JavaFX applet 之前必须安装 Java 浏览器插件。安装插件可能会或不会阻碍人们对 JavaFX\
    \ applet 的喜爱。你可以通过阅读此网页上的说明，自行判断安装插件是否足够简单。\n\n```\nhttp://java.com/en/download/help/enable_browser.xml\
    \ \n```\n\n### 设置\n\nJavaFX 起初是一项独立的技术，必须从 JDK 离离开下载。然而，从 `JDK 1.7 update 6` (`JDK7u6`)\
    \ 开始，JDK 自带了最新版本的 JavaFX。`JDK 1.7` 包含 `JavaFX 2.2`，而 `Java 8` 带有 `JavaFX 8`，这是版本\
    \ `2.2`之后的之后的。\n\n在编写此时，开发 JavaFX 应用最简单的方法是使用 `NetBeans 8` 或更高版本。只需点击 `File` →\
    \ `New Project` → `JavaFX` 即可创建一个新的 JavaFX 项目。\n\n如果你没有使用 NetBeans，在编译和运行应用程序时，将\
    \ `jfxrt.jar` 文件包含在类路径中。在 `JDK 1.8` 中，文件位于 `$JAVA_HOME/jre/lib/ext/`，其中 `$JAVA_HOME`\
    \ 是你 JDK 的安装目录。在 `JDK 1.7 update 6` 及更高版本中，可以在 `$JAVA_HOME/jre/lib/` 找到该文件。\n\n\
    如果你使用 Eclipse，右键点击项目图标并点击 `Properties`。在出现的窗口左侧，点击 `Java Build Path`，然后选择右侧的 `Libraries`\
    \ 选项卡。接下来，点击 `Add External JARs` 按钮，导航到 jar 文件的位置并选择它。\n\n有一个名为 `e(fx)clipse`\
    \ 的 Eclipse 插件，你可以将其添加到 `Eclipse 4.4` 及更高版本中以帮助你开发 JavaFX 应用。可以在此处查看说明。\n\n```\n\
    http://www.eclipse.org/efxclipse/install.html\n```\n\n你也可以从 IDE 外部编译和运行 JavaFX\
    \ 应用程序。要使用命令行上的 `javac` 程序编译包 `mypackage` 中名为 `MyFXApp` 的 JavaFX 类，请进入项目的源码目录并输入：\n\
    \n```\njavac -cp ${JAVA_HOME}/jre/lib/ext/jfxrt.jar mypackage/MyFXApp.java\n```\n\
    \n将 `${JAVA_HOME}` 替换为 Java 安装路径。例如，如果你的 Java 安装在 `/opt/jdk1.8.0_25`，请使用此命令。\n\
    \n```\njavac -cp /opt/jdk1.8.0_25/jre/lib/ext/jfxrt.jar mypackage/MyFXApp.java\n\
    ```\n\n运行应用程序（在 Linux 和 Mac OS X 上），将当前目录包含在类路径中：\n\n```\njava -cp /opt/jdk1.8.0_25/jre/lib/ext/jfxrt.jar:.\
    \ mypackage.MyFXApp \n```\n\n在 Windows 上，将冒号替换为分号。\n\n```\njava -cp /opt/jdk1.8.0_25/jre/lib/ext/jfxrt.jar;.\
    \ mypackage.MyFXApp\n```\n\n### 你的第一个 JavaFX \n\n本节展示了开发 JavaFX 应用程序有多简单。示例仅包含一个类，名为\
    \ `FirstApp`，如列表 6.1 所示。\n\n#### 列表 6.1: `FirstApp` 类\n\n```\npackage app06; \n\
    import javafx.application.Application; \nimport javafx.scene.Scene; \nimport javafx.scene.control.Label;\
    \ \nimport javafx.scene.layout.StackPane;\nimport javafx.stage.Stage; \n\npublic\
    \ class FirstApp extends Application { \n\n    @Override \n    public void start(Stage\
    \ stage) { \n        Label label = new Label(\"Welcome\"); \n        StackPane\
    \ root = new StackPane(); \n        root.getChildren().add(label); \n\n      \
    \  Scene scene = new Scene(root, 400, 100);\n\n        stage.setTitle(\"First\
    \ FX\"); \n        stage.setScene(scene); \n        stage.show(); \n    } \n\n\
    \    public static void main(String[] args) { \n        launch(args); \n    }\
    \ \n}\n```\n\n就像运行任何 Java 应用程序一样运行它，你会看到一个类似于图 6.1 的窗口。\n\n![](img/0601.png)\n\
    \n图 6.1：一个简单的 JavaFX 应用程序（在 Ubuntu 上）\n\n下一节将解释 JavaFX API。\n\n### Application,\
    \ Stage 和 Scene\n\nJavaFX API 以 `javafx` 包及其子包中类型的类型形式存在。它最重要的类型之一是 `javafx.application.Application`\
    \ 类，它代表一个 JavaFX 应用程序。JavaFX 应用程序由一个或多个窗口和其他资源组成。\n\n在 JavaFX 中，窗口由 `javafx.stage.Window`\
    \ 类表示，它有两个子类 `Stage` 和 `PopupWindow`。一个 `Stage`（`javafx.stage.Stage` 的实例）是一个顶层容器，你向其添加一个。一个\
    \ `Stage`（由创建的……类型是 `javafx.application.Application` 类，代表……现在让我们来看看这三个主要类：Application、Stage\
    \ 和 Scene。其他 JavaFX 类型的详情可以在查看。\n\n```\nhttp://docs.oracle.com/javase/8/javafx/api/toc\n\
    ```\n\n#### Application\n\n你继承 `Application` 类来创建 JavaFX 应用程序。要将其作为独立程序运行，你需要调用它的其中一个启动方法。\n\
    \n```\npublic static void launch(java.String... args)\npublic static void launch(Class<?\
    \ extends Application> appClass, java.String... args)\n```\n\n你传递给启动方法的任何参数都可以从\
    \ `Application` 内部使用 `getParameters` 方法获取。\n\n```\npublic final Application.Parameters\
    \ getParameters()\n```\n\nApplication 具有以下生命周期方法，它们将在实例启动时被调用。\n\n```\npublic\
    \ void init() throws java.Exception\n```\n\n该方法在应用程序构造后调用。如果应用程序需要初始化，则应重写它。\n\
    \n```\npublic abstract void start(Stage stage) throws java.Exception\n```\n\n\
    该方法在 `init()` 返回后调用，你应该在此方法中构建 UI。JavaFX 运行时创建一个 `Stage` 对象并作为方法参数传递。\n\n```\n\
    public void stop() throws java.Exception\n```\n\n该方法在应用程序停止时调用。你应该在此处释放持有的资源。\n\
    \n在生命周期方法中，只有 `start` 必须重写。\n\n#### Stage\n\n`Stage` 类代表 UI 组件的顶层容器。当应用程序的 `start`\
    \ 方法被调用时，会创建一个实例并传递给你。应用程序创建的 Stage 是应用程序的主窗口。如有，你可以创建自己的 Stage。\n\n`Stage` 就像任何其他\
    \ UI 窗口一样，有一个标题，你可以使用 `Stage` 类的标题属性进行填充。此外，你可以通过调用 `Stage` 的 `setScene` 方法将 `Scene`\
    \ 添加到其中。然后，要显示 `Stage` 调用它的 `show` 方法。\n\n#### Scene\n\n`Scene` 是可以添加到 `Stage`\
    \ 的容器。`Scene` 必须包含一个父节点，它是所有添加到 Scene 的组件的根。父节点由 `javafx.scene.Parent` 类表示。`Scene`\
    \ 最简单的构造函数接受一个参数，即 `Parent` 的实例。\n\n```\npublic Scene(Parent root)\n\n\n\n其他构造函数允许你指定\
    \ `Scene` 的尺寸及其填充颜色。\n\n```\npublic Scene(Parent root, double width, double height)\n\
    public Scene(Parent root, javafx.scene.paint.Paint fill)\npublic Scene(Parent\
    \ root, double width, double height, javafx.scene.paint.Paint fill)\n```\n\nUI\
    \ 组件\n\n"
- fmt: "\nBuilt-in UI components make writing JavaFX applications so easy and fun.\
    \ A UI component is called a scene graph node (or simply a node) in the parlance\
    \ of JavaFX developers. The `javafx.scene.Node` class is the base class for all\
    \ nodes. It has five subclasses that distinguish the types of nodes in JavaFX:\n\
    \n* `Canvas`: A rectangular area you can draw on.\n* `Parent`: A container to\
    \ which you can add other UI components.\n* `Shape`: Represents a shape, such\
    \ as a rectangle, a circle, or an arc.\n* `ImageView`: A view area for showing\
    \ an image.\n* `MediaView`: Provides a view of media being played by a `MediaPlayer`.\n\
    \n`Canvas`, `ImageView`, and `MediaView` do not have subclasses. `Parent` and\
    \ `Shape` do.\n\nThe `Parent` class has the following subclasses:\n\n* `Control`:\
    \ This class is a base class for all UI controls, from simple controls like `Button`\
    \ and `Label` to more complex ones such as `ProgressBar`, `TreeView`, and `TableView`.\n\
    * `Region`: Represents a screen area that can contain other nodes and be styled\
    \ using CSS. Subclasses include `Chart` and various `Panes`, including `BorderPane`,\
    \ `StackPane`, `FlowPane`, `GridPane`, `HBox`, `VBox`, `AnchorPane`, etc.\n* `Group`:\
    \ An area that contains an `ObservableList` of children and is the best `Parent`\
    \ for working with `Shape` objects.\n* `WebView`: A `WebView` is used to manage\
    \ a `WebEngine` and display its content. As the name implies, a `WebEngine` can\
    \ load web pages, create document models, and run JavaScript on pages.\n\nThe\
    \ `Control` and `Region` classes are discussed further in the next sections.\n\
    \nThe `javafx.scene.shape.Shape` class is a base class for various geometric shapes,\
    \ including `Arc`, `Circle`, `Ellipse`, `Line`, `Path`, and `Rectangle`.\n\n#\
    \ Controls\n\nUI controls are nodes that the user can interact with. The `javafx.scene.control.Control`\
    \ class is the base class for all UI controls. Figure 6.2 shows direct and indirect\
    \ subclasses of `Control`.\n\n![](Images/0602.png)\n\nFigure 6.2: Control implementations\n\
    \nFigure 6.3 shows a `Scene` that contains some JavaFX controls and Listing 6.2\
    \ presents the code that produces the `Scene`.\n\n![](Images/0603.png)\n\nFigure\
    \ 6.3: JavaFX UI Controls\n\nListing 6.2: The `ControlsDemo` class\n\n```java\n\
    \ package app06;\nimport javafx.application.Application;\nimport javafx.geometry.Insets;\n\
    import javafx.scene.Scene;\nimport javafx.scene.control.Button; \nimport javafx.scene.control.CheckBox;\
    \ \nimport javafx.scene.control.ChoiceBox; \nimport javafx.scene.control.ColorPicker;\
    \ \nimport javafx.scene.control.ComboBox; \nimport javafx.scene.control.Hyperlink;\
    \ \nimport javafx.scene.control.Label; \nimport javafx.scene.control.ListView;\
    \ \nimport javafx.scene.control.MenuButton; \nimport javafx.scene.control.MenuItem;\
    \ \nimport javafx.scene.control.PasswordField; \nimport javafx.scene.control.RadioButton;\
    \ \nimport javafx.scene.control.ScrollBar; \nimport javafx.scene.control.Separator;\
    \ \nimport javafx.scene.control.Slider; \nimport javafx.scene.control.TextArea;\
    \ \nimport javafx.scene.control.TextField; \nimport javafx.scene.control.ToggleGroup;\
    \ \nimport javafx.scene.layout.ColumnConstraints; \nimport javafx.scene.layout.GridPane;\
    \ \nimport javafx.scene.paint.Color; \nimport javafx.stage.Stage; \n\npublic class\
    \ ControlsDemo extends Application { \n\n    @Override \n    public void start(Stage\
    \ stage) { \n        GridPane grid = new GridPane(); \n        grid.setHgap(15);\
    \ \n        grid.setVgap(25); \n        ColumnConstraints constraint = new ColumnConstraints();\
    \ \n        constraint.setPercentWidth(25); \n        grid.getColumnConstraints().addAll(constraint,\
    \ \n                constraint, constraint, constraint); \n        grid.setPadding(new\
    \ Insets(10)); \n\n        grid.add(new Label(\"Label\"), 0, 0); \n        grid.add(new\
    \ Button(\"Button\"), 1, 0); \n        grid.add(new CheckBox(\"CheckBox\"), 2,\
    \ 0); \n\n        ChoiceBox<String> choiceBox = new ChoiceBox<String>(); \n\n\
    \        choiceBox.getItems().addAll(\"ChoiceBox 1\", \"ChoiceBox 2\"); \n   \
    \     choiceBox.setValue(\"ChoiceBox 1\"); \n        grid.add(choiceBox, 3, 0);\
    \ \n\n        grid.add(new ColorPicker(Color.GREEN), 0, 1); \n\n        ComboBox<String>\
    \ comboBox = new ComboBox<String>(); \n        comboBox.getItems().addAll(\"Combo\
    \ 1\", \"Combo 2\"); \n        comboBox.setValue(\"Combo 1\"); \n        grid.add(comboBox,\
    \ 1, 1); \n\n        grid.add(new Hyperlink(\"Hyperlink\"), 2, 1); \n\n      \
    \  ListView<String> listView = new ListView<String>(); \n        listView.getItems().addAll(\"\
    List Item 1\", \n                \"List Item 2\", \"List Item 3\"); \n       \
    \ grid.add(listView, 3, 1); \n\n        MenuButton menuButton = new MenuButton(\"\
    Menu\"); \n        menuButton.getItems().addAll(new MenuItem(\"Menu 1\"), \n \
    \               new MenuItem(\"Menu 1\")); \n        grid.add(menuButton, 0, 2);\
    \ \n\n        grid.add(new TextField(\"TextField\"), 1, 2); \n\n        PasswordField\
    \ passwordField = new PasswordField(); \n        passwordField.setText(\"Password\"\
    ); \n        grid.add(passwordField, 2, 2); \n\n        grid.add(new ScrollBar(),\
    \ 3, 2); \n\n        ToggleGroup group = new ToggleGroup(); \n        RadioButton\
    \ radioButton1 = new RadioButton(\"Radio 1\"); \n        radioButton1.setToggleGroup(group);\
    \ \n        radioButton1.setSelected(true); \n        RadioButton radioButton2\
    \ = new RadioButton(\"Radio 2\"); \n        radioButton2.setToggleGroup(group);\
    \ \n        grid.add(radioButton1, 0, 3); \n        grid.add(radioButton2, 1,\
    \ 3); \n\n        TextArea textArea = new TextArea(\"TextArea\"); \n        textArea.setMinHeight(60.00);\
    \ \n        grid.add(textArea, 2, 3); \n\n        grid.add(new Separator(), 3,\
    \ 3); \n\n        Slider slider2 = new Slider(0, 100, 30); \n        slider2.setShowTickMarks(true);\
    \ \n        slider2.setShowTickLabels(true); \n        grid.add(slider2, 0, 4,\
    \ 4, 1); \n\n        Scene scene = new Scene(grid, 600, 320); \n        scene.setFill(Color.BEIGE);\
    \ \n\n        stage.setTitle(\"JavaFX Controls\"); \n        stage.setScene(scene);\
    \ \n        stage.show(); \n    } \n\n    public static void main(String[] args)\
    \ { \n        launch(args); \n    } \n}\n```\n\n# Regions\n\nA `Region` is a screen\
    \ area that can contain other nodes and be styled using CSS. All `Regions` are\
    \ subclasses of the `javafx.scene.layout.Region` class. There are three direct\
    \ descendents of `Region`: `Axis`, `Chart`, and `Pane`. An `Axis` is used to render\
    \ an axis on a chart area and a `Chart` models a chart. A `Pane` is a region that\
    \ is normally used for laying out UI controls.\n\nThis section only discusses\
    \ `Pane`.\n\nSubclasses of `Pane` include `BorderPane`, `StackPane`, `GridPane`,\
    \ `FlowPane`, `AnchorPane`, `HBox`, and `VBox`.\n\n`BorderPane` divides a `Parent`\
    \ into five areas, top, bottom, left, right, and center. The diagram in Figure\
    \ 6.4 shows the different areas in a `BorderPane`.\n\n![](Images/0604.png)\n\n\
    Figure 6.4: The five areas of `BorderPane`\n\n`HBox` lays out its children in\
    \ a single horizontal row and `VBox` does it in a single vertical row. `GridPane`,\
    \ on the other hand, arranges children in a grid and is often used to layout the\
    \ controls of a form.\n\nThe `ControlsDemo` class Listing 6.3 uses `BorderPane`\
    \ to lay out controls. Only the top, left and center areas are used. The top section\
    \ contains an `HBox` with two buttons and the left section contains a `Label`\
    \ and a `ColorPicker`. The center section has an `ImageView` with an `Image`.\n"
