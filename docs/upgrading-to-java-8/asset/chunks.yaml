    public class ParallelStreamDemo {\n\n    public static long fibonacci(long i)\
    \ {\n        if (i == 1 || i == 2) {\n            return 1;\n        }\n     \
    \   return fibonacci(i - 1) + fibonacci(i - 2);\n    }\n\n    public static void\
    \ main(String[] args) {\n        List<Integer> numbers = \n                Arrays.asList(10,\
    \ 20, 30, 40, 41, 42);\n\n        Instant start = Instant.now();\n        numbers.parallelStream()\n\
    \                .map((input) -> fibonacci(input))\n                .forEach(System.out::println);\n\
    \        Instant end = Instant.now();\n        System.out.printf(\n          \
    \      \"Processing time with parallel stream : %dms\\n\",\n                Duration.between(start,\
    \ end).toMillis());\n\n        start = Instant.now();\n        numbers.stream()\n\
    \                .map((input) -> fibonacci(input))\n                .forEach(System.out::println);\n\
    \        end = Instant.now();\n        System.out.printf(\n                \"\
    Processing time with sequential stream : %dms\\n\",\n                Duration.between(start,\
    \ end).toMillis());\n    }\n}\n```\n\n如果你运行这段代码，你将在控制台上看到这些。\n\n```\n 55\n6765\n\
    832040\n102334155\n165580141\n267914296\nProcessing time with parallel stream\
    \ : 953ms\n55\n6765\n832040\n102334155\n165580141\n267914296\nProcessing time\
    \ with sequential stream : 1764ms\n```\n\n如你所见，你可以从并行流中受益。然而，对于资源非密集型的任务，这种优势变得越来越小，并且在某一点上，设置并行流的成本将超过设置顺序流的成本加上加速带来的收益。例如，如果我将数字替换为\n\
    \n```\n List<Integer> numbers = \n                Arrays.asList(1, 2, 3, 4, 5,\
    \ 6);\n```\n\n在我的机器上，在你决定使用并行流之前，请做一些测试来查看它是否更快。\n\n### 总结\n\nJDK 1.8 引入了两个用于测量时间的类：`Duration`\
    \ 和 `Period`。这两个非常相似，区别在于 `Duration` 是基于时间的，而 `Period` 是基于日期的。`Duration` 提供了纳秒级的时间量。这个类非常适合例如建模飞行时间。\n\
    \n### 第 5 章：日期时间 API\n\n自 Java 1.0 以来就有对日期的支持，主要通过 `java.util.Date` 类实现。然而，`Date`\
    \ 的设计糟糕且难以使用，导致许多人转向第三方替代方案如 Joda Time ([http://joda.org/])。1.8 的新日期时间 API 解决了许多问题，并与\
    \ Joda Time 类似。\n\n本章将解释 JDK 1.8 的日期时间。\n\n#### 概述\n\n新的日期时间 API 处理日期和时间变得极其简单。`java.time`\
    \ 包包含了核心类。此外，还有四个使用较少的包：`java.time.chrono`、`java.time.format`、`java.time.temporal`\
    \ 和 `java.time.zone`。\n\n在 `java.time` 包中，`Instant` 类表示时间线上的一个点，常用于为操作计时。`LocalDate`\
    \ 类模型不带时间分和时区的日期，适用于例如表示生日。\n\n如果你既需要日期也时间，那么 `LocalDateTime` 适合你。例如，订单发货日期可能除了日期之外还需要时间，以便跟踪订单。如果你只需要时间而不关心日期，那么你可以使用\
    \ `LocalTime`。在此基础上，如果时区很重要，日期时间 API 提供了 `ZonedDateTime` 类。正如其名，该类模型了带时区的日期-时间。例如，你可以使用该类计算位于不同时区的机场之间的飞行时间。\n\
    \n`java.time` 包还带有两个枚举：`DayOfWeek` 和 `Month`。`DayOfWeek` 代表星期中的一天，从星期一到星期日。`Month`\
    \ 枚举代表年的十二个月，从一月到十二月。\n\n"
- fmt: "\nWorking with dates and times frequently involves parsing and formatting.\
    \ The Date and Time API addresses these two issues by providing parse and format\
    \ methods in all its major classes. In addition, the `java.time.format` contains\
    \ a `DateTimeFormatter` class for formatting dates and times.\n\n# The Instant\
    \ Class\n\nAn `Instant` object represents a point on the time-line. The reference\
    \ point is the standard Java epoch, which is `1970-01-01T00:00:00Z` (January 1,\
    \ 1970 00:00 GMT). The `EPOCH` field of the `Instant` class returns an `Instant`\
    \ representing the Java epoch. Instants after the epoch have positive values and\
    \ instants prior to that have negative values.\n\nThe static method `now()` of\
    \ `Instant` returns an `Instant` object that represents the current time:\n\n\
    ```java\n Instant now = Instant.now();\n```\n\nThe `getEpochSecond()` method returns\
    \ the number of seconds that have elapsed since the epoch. The `getNano()` method\
    \ returns the number of nanoseconds since the beginning of the last second.\n\n\
    A popular use of the `Instant` class is to time an operation, as demonstrated\
    \ in Listing 5.1.\n\n**Listing 5.1: Using Instant to time an operation**\n\n```java\n\
    \ package app05;\nimport java.time.Duration;\nimport java.time.Instant;\n\npublic\
    \ class InstantDemo1 {\n    public static void main(String[] args) {\n       \
    \ Instant start = Instant.now();\n        // do something here\n        Instant\
    \ end = Instant.now();\n        System.out.println(Duration.between(start, end).toMillis());\n\
    \    }\n}\n```\n\nAs shown in Listing 5.1, the `Duration` class is used to return\
    \ the difference between two `Instants`. You will learn more about `Duration`\
    \ later in this chapter.\n\n# LocalDate\n\nThe `LocalDate` class models a date\
    \ without a time component. It also has no time zone. Table 5.1 shows some of\
    \ the more important methods in `LocalDate`.\n\n| Method | Description |\n| :---\
    \ | :--- |\n| `now` | A static method that returns today’s date. |\n| `of` | A\
    \ static method that creates a `LocalDate` from the specified year, month and\
    \ date. |\n| `getDayOfMonth`, `getMonthValue`, `getYear` | Returns the day, month\
    \ or year part of this `LocalDate` as an `int`. |\n| `getMonth` | Returns the\
    \ month of this `LocalDate` as a `Month` enum constant. |\n| `plusDays`, `minusDays`\
    \ | Adds or subtracts the given number of days to or from this `LocalDate`. |\n\
    | `plusWeeks`, `minusWeeks` | Adds or subtracts the given number of weeks to or\
    \ from this `LocalDate`. |\n| `plusMonths`, `minusMonths` | Adds or subtracts\
    \ the given number of months to or from this `LocalDate`. |\n| `plusYears`, `minusYears`\
    \ | Adds or subtracts the given number of years to or from this `LocalDate`. |\n\
    | `isLeapYear` | Checks if the year specified by this `LocalDate` is a leap year.\
    \ |\n| `isAfter`, `isBefore` | Checks if this `LocalDate` is after or before the\
    \ given date. |\n| `lengthOfMonth` | Returns the number of days in the month in\
    \ this `LocalDate`. |\n| `withDayOfMonth` | Returns a copy of this `LocalDate`\
    \ with the day of month set to the given value. |\n| `withMonth` | Returns a copy\
    \ of this `LocalDate` with the month set to the given value. |\n| `withYear` |\
    \ Returns a copy of this `LocalDate` with the year set to the given value. |\n\
    \n**Table 5.1: More important methods of LocalDate**\n\n`LocalDate` offers various\
    \ methods to create a date. For example, to create a `LocalDate` that represents\
    \ today’s date, use the static method `now`.\n\n```java\n LocalDate today = LocalDate.now();\n\
    ```\n\nTo create a `LocalDate` that represents a specific year, month and day,\
    \ use its `of` method, which is also static. For instance, the following snippet\
    \ creates a `LocalDate` that represents December 31, 2015.\n\n```java\n LocalDate\
    \ endOfYear = LocalDate.of(2015, 12, 31);\n```\n\nThe method `of` has another\
    \ override that accepts a constant of the `java.time.Month` enum as the second\
    \ argument. For example, here is the code to construct the same date using the\
    \ second method override.\n\n```java\n LocalDate endOfYear = LocalDate.of(2015,\
    \ Month.DECEMBER, 31);\n```\n\nThere are also methods for obtaining the day, month\
    \ or year of a `LocalDate`, such as `getDayOfMonth`, `getMonth`, `getMonthValue`\
    \ and `getYear`. They all do not take any argument and either return an `int`\
    \ or a `Month` enum constant. In addition, there is a `get` method that takes\
    \ a `TemporalField` and returns a part of this `LocalDate`. For example, passing\
    \ `ChronoField.YEAR` to `get` returns the year component of a `LocalDate`.\n\n\
    ```java\n int year = localDate.get(ChronoField.YEAR);\n```\n\n`ChronoField` is\
    \ an enum that implements the `TemporalField` interface, therefore you can pass\
    \ a `ChronoField` constant to `get`. Both `TemporalField` and `ChronoField` are\
    \ part of the `java.time.temporal` package. However, not all constants in `ChronoField`\
    \ can be passed to `get` as not all of them are supported. For example, passing\
    \ `ChronoField.SECOND_OF_DAY` to `get` throws an exception. As such, instead of\
    \ `get`, it is better to use `getMonth`, `getYear` or a similar method to obtain\
    \ a component of a `LocalDate`.\n\nIn addition, there are methods for copying\
    \ a `LocalDate`, such as `plusDays`, `plusYears`, `minusMonths`, and so on. For\
    \ example, to get a `LocalDate` that represents tomorrow, you can create a `LocalDate`\
    \ that represents today and then calls its `plusDays` method.\n\n```java\n LocalDate\
    \ tomorrow = LocalDate.now().plusDays(1);\n```\n\nTo get a `LocalDate` that represents\
    \ yesterday, you can use the `minusDays` method.\n\n```java\n LocalDate yesterday\
    \ = LocalDate.now().minusDays(1);\n```\n\nIn addition, there are `plus` and `minus`\
    \ methods to get a copy of `LocalDate` in a more generic way. Both accept an `int`\
    \ and a `TemporalUnit`. The signatures of these methods are as follows:\n\n```java\n\
    \ public LocalDate plus(long amountToAdd, java.time.temporal.TemporalUnit unit)\n\
    public LocalDate minus(long amountSubtract, java.time.temporal.TemporalUnit unit)\n\
    ```\n\nAs an example, to get a `LocalDate` that represents a past date two decades\
    \ ago from today, you can use this code:\n\n```java\n LocalDate pastDate = LocalDate.now().minus(2,\
    \ ChronoUnit.DECADES);\n```\n\n`ChronoUnit` is an enum that implements `TemporalUnit`,\
    \ so you can pass a `ChronoUnit` constant to the `plus` or `minus` method. `LocalDate`\
    \ is immutable and therefore cannot be changed. Any method that returns a `LocalDate`\
    \ returns a new instance.\n\nListing 5.2 shows an example of `LocalDate`.\n\n\
    ```java\n package app05;\nimport java.time.LocalDate;\nimport java.time.temporal.ChronoField;\n\
    import java.time.temporal.ChronoUnit;\n\npublic class LocalDateDemo1 {\n    public\
    \ static void main(String[] args) {\n        LocalDate today = LocalDate.now();\n\
    \        LocalDate tomorrow = today.plusDays(1);\n        LocalDate oneDecadeAgo\
    \ = today.minus(1, ChronoUnit.DECADES);\n        System.out.println(\"Day of month:\
    \ \" + today.getDayOfMonth());\n        System.out.println(\"Today is \" + today);\n\
    \        System.out.println(\"Tomorrow is \" + tomorrow);\n        System.out.println(\"\
    A decade ago was \" + oneDecadeAgo);\n        System.out.println(\"Year : \" +\
    \ today.get(ChronoField.YEAR));\n        System.out.println(\"Day of year:\" +\
    \ today.getDayOfYear());\n    }\n}\n```\n\n# Period\n\nThe `Period` class models\
    \ a date-based amount of time, such as five days, a week or three years. Some\
    \ of its more important methods are presented in Table 5.2.\n\n| Method | Description\
    \ |\n| :--- | :--- |\n| `between` | Creates a `Period` between two `LocalDates`.\
    \ |\n| `ofDays`, `ofWeeks`, `ofMonths`, `ofYears` | Creates a `Period` representing\
    \ the given number of days/weeks/months/years. |\n| `of` | Creates a `Period`\
    \ from the given numbers of years, months and days. |\n| `getDays`, `getMonths`,\
    \ `getYears` | Returns the number of days/months/years of this period as an `int`.\
    \ |\n| `isNegative` | Returns true if any of the three components of this `Period`\
    \ is negative. Returns false otherwise. |\n| `isZero` | Returns true if all of\
    \ the three components of this `Period` are zero. Otherwise, returns false. |\n\
    | `plusDays`, `minusDays` | Adds or subtracts the given number of days to or from\
    \ this `Period`. |\n| `plusMonths`, `minusMonths` | Adds or subtracts the given\
    \ number of months to or from this `Period`. |\n"
