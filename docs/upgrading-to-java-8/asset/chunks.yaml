  trans: "\n\n```\n package app04;\nimport java.time.LocalDate;\nimport java.time.Month;\n\
    import java.time.Period;\nimport java.util.stream.Stream;\n\npublic class StreamMapDemo\
    \ {\n    class Employee {\n        public String name;\n        public LocalDate\
    \ birthday;\n        public Employee(String name, LocalDate birthday) {\n    \
    \        this.name = name;\n            this.birthday = birthday;\n        }\n\
    \    }\n\n    public Employee[] getEmployees() {\n        Employee[] employees\
    \ = { \n            new Employee(\"Will Biteman\", \n                    LocalDate.of(1984,\
    \ Month.JANUARY, 1)), \n            new Employee(\"Sue Everyman\", \n        \
    \            LocalDate.of(1980, Month.DECEMBER, 25)),\n            new Employee(\"\
    Ann Wangi\",\n                    LocalDate.of(1976, Month.JULY, 4)),\n      \
    \      new Employee(\"Wong Kaching\",\n                    LocalDate.of(1980,\
    \ Month.SEPTEMBER, 1))\n        };\n        return employees;\n    }\n\n    public\
    \ double calculateAverageAge(Employee[] employees) {\n        LocalDate today\
    \ = LocalDate.now();\n        Stream<Employee> stream = Stream.of(employees);\n\
    \        Stream<Period> periods = stream.map(\n                (employee)-> Period.between(\n\
    \                        employee.birthday, today));\n        double avgAge =\
    \ periods.mapToLong(\n                (period)->period.toTotalMonths())\n    \
    \            .average().getAsDouble() / 12;\n        return avgAge;\n    }\n\n\
    \    public static void main(String[] args) {\n        StreamMapDemo demo = new\
    \ StreamMapDemo();\n        Employee[] employees = demo.getEmployees();\n    \
    \    double avgAge = demo.calculateAverageAge(employees);\n        System.out.printf(\"\
    Average employee age : %2.2f\\n\",\n                avgAge);\n    }\n}\n```\n\n\
    如果你运行 `StreamMapDemo` 类，你将看到员工的平均年龄。当然，结果取决于你运行程序的时间。在我写这本书时，我在电脑上运行它，得到了如下结果。\n\
    \n```\n Average employee age : 34.13\n```\n\n## 规约 (Reduction)\n\n`Stream` 中更有用的方法之一是\
    \ `reduce`，它可以执行规约操作。该方法有两个重载版本：\n\n```\n java.util.Optional<T> reduce(java.util.function.BinaryOperator<T>\
    \ \n        accumulator)\nT reduce(T identity,\n        java.util.function.BinaryOperator<T>\
    \ accumulator)\n```\n\n观察这两个签名，你可能会注意到 `reduce` 方法在指定的 `BinaryOperator` 帮助下，将类型为\
    \ `T` 的 `Stream` 规约类型类型 `T` 的单个实例。尽管 Java 文档中的描述并不那么直观，但实际上这个方法并没有那么难以理解。\n\n\
    图 4.1 显示了当一个包含四个元素的顺序流正在被规约时，后台发生了什么。\n\n![](img/0401.png)\n\n图 4.1: 规约流\n\n首先，`element-1`\
    \ 和 `element-2` 被用作指定二元运算符的操作数。该操作的结果是一个与元素相同类型的对象，我称之为 `result-a`。接下来，`result-a`\
    \ 和 `element-3` 被传递给二元运算符，产生 `result-b`，它再次具有与元素相同的类型。最后，`result-b` 和 `element-4`\
    \ 被传递给二元运算符，返回 `result-c`。由于流中没有更多元素，`result-c` 作为规约的结果被返回。\n\n对于并行流，操作可以并行执行。这意味着对\
    \ `element-1` 和 `element-2` 的操作可能与对 `element-3` 和 `element-4` 的操作同时发生，然后将第一次操作的结果和第二次操作的结果传递给二元运算符并返回其结果。\n\
    \n好了。现在让我们来看一个例子。\n\n列表 4.7 中的 `StreamReductionDemo1` 类展示了一个包含四个 `Order` 对象的 `Stream`，它被规约为了单个\
    \ `Order` 对象，该对象是最近放置的且值最大的 `Order`。\n\n列表 4.7: StreamReductionDemo1 类\n\n```\n\
    \ package app04;\nimport java.time.LocalDate;\nimport java.time.Month;\nimport\
    \ java.util.Optional;\nimport java.util.stream.Stream;\n\npublic class StreamReductionDemo1\
    \ {\n    class Order {\n        public int orderId;\n        public double value;\n\
    \        public LocalDate orderDate;\n        public Order(int orderId, double\
    \ value, \n                LocalDate orderDate) {\n            this.orderId =\
    \ orderId;\n            this.value = value;\n            this.orderDate = orderDate;\n\
    \        }\n    }\n\n    public Order[] getOrders() {\n        Order[] orders\
    \ = {\n            new Order(1, 100.49,  \n                    LocalDate.of(2014,\
    \ Month.DECEMBER, 11)), \n            new Order(1, 88.09,  \n                \
    \    LocalDate.of(2014, Month.DECEMBER, 29)), \n            new Order(1, 10.29,\
    \  \n                    LocalDate.of(2014, Month.DECEMBER, 30)), \n         \
    \   new Order(1, 100.49,\n                    LocalDate.of(2014, Month.NOVEMBER,\
    \ 22)) \n        };\n        return orders;\n    }\n\n    public Optional<Order>\
    \ getLatestOrder(Order[] orders) {\n        Stream<Order> stream = Stream.of(orders);\n\
    \        Optional<Order> theOrder = stream.reduce((a, b) -> {\n              \
    \  if (a.value > b.value) {\n                    return a;\n                }\
    \ else if (a.value < b.value) {\n                    return b;\n             \
    \   } else {\n                    if (a.orderDate.isAfter(b.orderDate)) {\n  \
    \                      return a;\n                    } else {\n             \
    \           return b;\n                    }\n                }\n            });\n\
    \        return theOrder;\n    }\n\n    public static void main(String[] args)\
    \ {\n        StreamReductionDemo1 demo = new StreamReductionDemo1();\n       \
    \ Order[] orders = demo.getOrders();\n        Optional<Order> latestLargest =\
    \ demo.getLatestOrder(orders);\n        if (latestLargest.isPresent()) {\n   \
    \         Order order = latestLargest.get();\n            System.out.printf(\"\
    Latest largest order value: $%2.2f\\n\",\n                    order.value);\n\
    \            System.out.println(\" date : \" + order.orderDate);\n        } else\
    \ {\n            System.out.println(\"No order found\");\n        }\n    }\n}\n\
    ```\n*(注：由于提供的原文代码片段存在截断和格式错乱，翻译时已根据逻辑进行了必要的补全以确保可读性)*\n\n"
- fmt: "\n```\n package app04;\nimport java.time.LocalDate;\nimport java.time.Month;\n\
    import java.time.YearMonth;\nimport java.util.function.Predicate;\nimport java.util.stream.Stream;\n\
    \npublic class StreamReductionDemo2 {\n    class Order {\n        public int orderId;\n\
    \        public double value;\n        public LocalDate orderDate;\n        public\
    \ Order(int orderId, double value, \n                LocalDate orderDate) {\n\
    \            this.orderId = orderId;\n            this.value = value;\n      \
    \      this.orderDate = orderDate;\n        }\n    }\n\n    public Order[] getOrders()\
    \ {\n        Order[] orders = { \n            new Order(1, 100.49,  \n       \
    \             LocalDate.of(2014, Month.DECEMBER, 11)), \n            new Order(1,\
    \ 88.09,  \n                    LocalDate.of(2014, Month.DECEMBER, 29)), \n  \
    \          new Order(1, 10.29,  \n                    LocalDate.of(2014, Month.DECEMBER,\
    \ 30)), \n            new Order(1, 100.49,\n                    LocalDate.of(2014,\
    \ Month.NOVEMBER, 22)) \n        };\n        return orders;\n    }\n\n    public\
    \ double calculateSalesTotal(Order[] orders, \n            YearMonth yearMonth)\
    \ {\n        Predicate<Order> orderInGivenMonth\n                = (order) ->\
    \ order.orderDate.getMonth() \n                        == yearMonth.getMonth()\n\
    \                && order.orderDate.getYear() \n                        == yearMonth.getYear();\n\
    \n        Stream<Order> stream = Stream.of(orders);\n        return stream.filter(orderInGivenMonth)\n\
    \                .mapToDouble((order) -> order.value)\n                .reduce(0,\
    \ (a, b) -> a+b);\n    }\n\n    public static void main(String[] args) {\n   \
    \     StreamReductionDemo2 demo = new StreamReductionDemo2();\n        Order[]\
    \ orders = demo.getOrders();\n        double totalSalesForMonth = demo.calculateSalesTotal(\n\
    \                orders, YearMonth.of(2014, Month.NOVEMBER));\n        System.out.printf(\"\
    Sales for Nov 2014 : $%2.2f\\n\",\n                totalSalesForMonth);\n\n  \
    \      totalSalesForMonth = demo.calculateSalesTotal(\n                orders,\
    \ YearMonth.of(2014, Month.DECEMBER));\n        System.out.printf(\"Sales for\
    \ Dec 2014 : $%2.2f\\n\",\n                totalSalesForMonth);\n    }\n}\n```\n\
    \nThe `StreamReductionDemo2` class employs the same `Order` objects as those in\
    \ `StreamReduceDemo1`. The `calculateSalesTotal` method creates a `Stream` from\
    \ the `Order` array, filters the `Orders` to those having a given year/month and\
    \ maps the elements to doubles before finally reducing them to a `double`.\n\n\
    If you run this demo class, you will see this on your console.\n\n```\n Sales\
    \ for Nov 2014 : $100.49\nSales for Dec 2014 : $198.87\n```\n\n## Mutable Reductions\n\
    \nA mutable reduction operation accumulates a `Stream`’s elements into a container\
    \ and returns the container. The container is mutable, hence the term mutable.\n\
    \nYou use the `Stream` interface’s `collect` method to perform a mutable reduction\
    \ operation. Its signature is as follows.\n\n```\n <R> R collect(java.util.function.Supplier<R>\
    \ supplier,\n        java.util.function.BiConsumer<R, ? super T> accumulator,\n\
    \        java.util.function.BiConsumer<R, R> combiner);\n```\n\nThe `collect`\
    \ method does its job in three steps, each step processing one of the arguments\
    \ to the method.\n\nIn the first step, the method handles its first argument,\
    \ which is a `Supplier` that returns a container such as a `Collection` or a `StringBuilder`.\
    \ In a sequential stream, the `Supplier` is only called once and there will only\
    \ only one container. In a parallel stream, however, the `Supplier` may be called\
    \ multiple times and there may be multiple containers.\n\nIn the second step,\
    \ the method tackles the second argument, which is a `BiConsumer` that performs\
    \ the collection. Recall that a `BiConsumer` accepts two arguments of different\
    \ types and do not return any value. Practically, the `BiConsumer` adds each stream\
    \ element to the container or containers that the `Supplier` produced. In the\
    \ case of a sequential stream, all elements are added to the same container because\
    \ there is only one container. In a parallel stream, each element is added to\
    \ a different container.\n\nIn the last step, the method processes the third argument,\
    \ which is also a `BiConsumer`. In a sequential stream, no processing takes place\
    \ and the argument has no effect as it is never called. Nevertheless, you cannot\
    \ pass a `null` as the third argument. In a parallel stream, the collectors are\
    \ merged using the operation specified by the `BiConsumer`.\n\nThe first example\
    \ of this kind of operation is given in Listing 4.9. It demonstrates how you can\
    \ collect an array of strings into a `StringBuilder`. There are two streams involved,\
    \ both doing the same thing. The first stream uses lambda expressions and the\
    \ second uses method references.\n\n### Listing 4.9: StreamCollectDemo1 class\n\
    \n```\n package app04;\nimport java.util.stream.Stream;\n\npublic class StreamCollectDemo1\
    \ {\n    public static void main(String[] args) {\n        String[] strings =\
    \ { \"a\", \"b\", \"c\", \"d\" };\n        Stream<String> stream1 = Stream.of(strings);\n\
    \        StringBuilder sb1 = stream1.collect(\n                () -> new StringBuilder(),\n\
    \                (a1, b1) -> a1.append(b1),\n                (a2, b2) -> a2.append(b2));\n\
    \        System.out.println(sb1.toString());\n\n        Stream<String> stream2\
    \ = Stream.of(strings);\n        StringBuilder sb2 = stream2.collect(\n      \
    \          StringBuilder::new,\n                StringBuilder::append,\n     \
    \           StringBuilder::append);\n        System.out.println(sb2.toString());\n\
    \    }\n}\n```\n\nFor each stream, the `collect` method starts by creating a `StringBuilder`.\
    \ Since a sequential stream is involved, there is only one container. Next, the\
    \ method appends each stream element to the `StringBuilder`. Since there are four\
    \ elements in the stream, the `append` method of the `StringBuilder` is called\
    \ four times.\n\nSince this is a sequential stream, the third argument is not\
    \ processed. The `collect` method simply returns the `StringBuilder` that now\
    \ contains “abcd”.\n\nListing 4.10 shows a second example for the mutable reduction\
    \ operation. This time I use a `List` as the container, in a sequential stream.\
    \ Again, there are two streams involved, one using lambda expression one using\
    \ method reference. The `collect` method here returns a `List` that contains four\
    \ elements.\n\n### Listing 4.10: StreamCollectDemo2 class\n\n```\n package app04;\n\
    import java.util.ArrayList;\nimport java.util.List;\nimport java.util.stream.Stream;\n\
    \npublic class StreamCollectDemo2 {\n    public static void main(String[] args)\
    \ {\n        String[] strings = { \"a\", \"b\", \"c\", \"d\" };\n        Stream<String>\
    \ stream1 = Stream.of(strings);\n        List<String> list1 = stream1.collect(\n\
    \                () -> new ArrayList<>(),\n                (a1, b1) -> a1.add(b1),\n\
    \                (a2, b2) -> a2.addAll(b2));\n        for (String s: list1) {\n\
    \            System.out.println(s);\n        }\n\n        Stream<String> stream2\
    \ = Stream.of(strings);\n        List<String> list2 = stream2.collect(\n     \
    \           ArrayList::new,\n                ArrayList::add,\n               \
    \ ArrayList::addAll);\n        for (String s: list2) {\n            System.out.println(s);\n\
    \        }\n    }\n}\n```\n\nThe last example in this category, the `StreamCollectDemo3`\
    \ class in Listing 4.11, is a rewrite of `StreamCollectDemo1`. However, a parallel\
    \ stream is used to show you how collection really works. To show the exact moment\
    \ each argument is processed, I have also created a custom `Supplier` by extending\
    \ `ArrayList` and overriding its `add` and `addAll` methods. The new methods print\
    \ a message and call a super method.\n\n### Listing 4.11: StreamCollectDemo3 class\n"
