  trans: "\n\n换句话说，如果你需要将一个 `Runnable` 传递给 `java.util.concurrent.Executor`，如下所示：\n\
    \n```java\nexecutor.execute(new Runnable() {\n    @Override\n    public void run()\
    \ {\n        System.out.println(\"Running...\");\n    }\n});\n```\n\n你可以使用 lambda\
    \ 表达式来产生相同的效果：\n\n```java\nexecutor.execute(() -> System.out.println(\"Running...\"\
    ));\n```\n\n简洁明了。而且更加清晰且具表现力。\n\n# 接口的更改\n\n在我深入研究 lambda 表达式之前，我必须提到，从 Java 8\
    \ 开始，你可以在接口中拥有 `default` 和 `static` 方法。这一节将解释什么是 `default` 方法和 `static` 方法，以及为什么\
    \ Java 语言需要这次重大重构，以便让 lambda 表达式能够融入 Java 核心类库中。\n\n## 默认方法 (Default Methods)\n\
    \n扩展接口是向接口添加功能的安全方式。然而，你最终会得到两个具有相似功能的接口。如果你只需要扩展一个或两个接口，这是可以接受的。但如果你需要向数百个接口添加新功能，这确实会变成严重的问题。\n\
    \n这正是 Java 语言设计者在尝试为 Java 8 引入 lambda 表达式，并为 `Collection` 框架中的几十个接口添加 lambda 支持时所面临的问题。这些接口需要新方法来支持\
    \ lambda 表达式，但扩展所有接口将使接口数量翻倍，某些接口最终可能会带有如 `List2` 或 `ExtendedSet` 这样难看的名字。\n\n\
    相反，他们通过向语言中添加 `default` 方法解决了这个问题。接口中的 `default` 方法是带有实现的方法。实现该接口的类没有必须实现 `default`\
    \ 方法，这意味着你可以在不破坏后兼容性的情况下向接口添加新方法。\n\n要使接口中的方法成为默认方法，请在方法签名前添加 `default` 关键字。此外，不要用分号结束签名，而是添加一对括号并在括号内编写代码。这里是一个示例：\n\
    \n```java\ndefault java.lang.String getDescription() {\n    return \"This is a\
    \ default method\";\n}\n```\n\n正如你之后将学到的，`JDK 1.8` 中的许多 Java 接口现在都有 `default`\
    \ 方法。\n\n在扩展带有 `default` 方法的接口时，你有这些选项：\n\n* 忽略 `default` 方法，实际上是继承它们，\n* 重新声明\
    \ `default` 方法，使其变为抽象方法，\n* 重写 `default` 方法。\n\n记住，Java 现在支持 `default` 方法的主要由于是为了后兼容性。你绝不开始编写没有类的程序。\n\
    \n## 静态方法 (Static Methods)\n\n类中的 `static` 方法由类的所有实例共享。在 Java 8 及更高版本中，你可以在接口中拥有\
    \ `static` 方法，这样所有与接口相关的静态方法都可以写在接口中，而不是辅助类中。\n\n`static` 方法的签名与 `default` 方法相似。然而，你使用的不是\
    \ `default` 关键字而是 `static` 关键字。接口中的 `static` 方法默认是 `public` 的。\n\n接口中的静态方法非常罕见。\n\
    \n## 函数式接口 (Functional Interfaces)\n\n函数式接口是一个包含恰好一个抽象方法的接口。这是 lambda 表达式的基础。函数式接口可以使用\
    \ `@FunctionalInterface` 进行注解。\n\n除了 `default` 和 `static` 方法外，还有另一个前提：`SAM`（单抽象方法）。函数式接口是一个恰好有一个抽象方法的接口。例如：\n\
    \n```java\npublic interface Calculator {\n    int calculate(int a, int b);\n}\n\
    ```\n\n你可以使用 lambda 表达式来实现此接口：\n\n```java\nCalculator addition = (a, b) -> a +\
    \ b;\nSystem.out.println(addition.calculate(5, 10)); // 输出 15\n\nCalculator subtraction\
    \ = (a, b) -> a - b;\nSystem.out.println(subtraction.calculate(5, 10)); // 输出\
    \ -5\n\nCalculator multiplication = (a, b) -> a * b;\nSystem.out.println(multiplication.calculate(5,\
    \ 10)); // 输出 50\n\nCalculator division = (a, b) -> a / b;\nSystem.out.println(division.calculate(5,\
    \ 10)); // 输出 0\n```\n\n# Lambda 表达式\n\nlambda 表达式的设计非常优雅。如果没有 lambda 表达式，实现相同的程序需要多少行代码？现在你已经熟悉了\
    \ lambda 表达式，我向你展示它的形式语法：\n\n```java\n(parameter list) -> expression\n```\n\n\
    或者\n\n```java\n(parameter list) -> {\n    statements\n}\n```\n\n参数列表与抽象方法的参数列表相同。然而，每个参数的类型是可选的。换句话说，这两个表达式都是有效的：\n\
    \n```java\nCalculator addition = (int a, int b) -> a + b;\nCalculator addition\
    \ = (a, b) -> a + b;\n```\n\n总结来说，lambda 表达式是定义函数式实现的快捷方式。lambda 表达式等同于函数式接口的实例。既然可以将对象作为参数传递给方法，也可以将\
    \ lambda 表达式传递给方法。\n\n## 预定义的函数式接口\n\n`java.util.function` 包是 `JDK 8` 中的一个新包。它包含了四十多个预定义的函数式接口，可以让你编写\
    \ lambda 表达式变得更容易。下表显示了一些预定义的函数式接口：\n\n| 函数式接口 | 描述 |\n| :--- | :--- |\n| `Function`\
    \ | 接受一个参数并返回结果的函数。 |\n| `BiFunction` | 接受两个参数并返回结果的函数。 |\n| `UnaryOperator` |\
    \ 对单个操作数的操作，返回与操作数类型相同的结果。 |\n| `BiOperator` | 对两个操作数的操作。 |\n| `Predicate` | 一个接受参数并返回真或假的\
    \ `Function`。 |\n| `Supplier` | 代表结果的提供者。 |\n| `Consumer` | 接受一个参数且不返回结果的操作。 |\n\
    \n"
- fmt: "\n# Table 1.1: Core functional interfaces\n\n## Function, BiFunction and Other\
    \ Variants\n\nThe `Function` interface is used to create a one-argument function\
    \ that returns a result. It is a parameterized type and here is its definition.\n\
    \n```\n public interface Function<T, R>\n```\n\nHere, `T` represents the type\
    \ of the argument and `R` the type of the result.\n\n`Function` has one abstract\
    \ method, `apply`, whose signature is as follows.\n\n```\n R apply(T argument)\n\
    ```\n\nThis is the method you need to override when using `Function`. For example,\
    \ the class in Listing 1.2 defines a `Function` for converting miles to kilometers.\
    \ The `Function` takes an `Integer` as an argument and returns a `Double`.\n\n\
    ### Listing 1.2: The `FunctionDemo1` class\n\n```\n package app01.function;\n\
    import java.util.function.Function;\n\npublic class FunctionDemo1 {\n    public\
    \ static void main(String[] args) {\n        Function<Integer, Double> milesToKms\
    \ = \n                (input) -> 1.6 * input;\n        int miles = 3;\n      \
    \  double kms = milesToKms.apply(miles);\n        System.out.printf(\"%d miles\
    \ = %3.2f kilometers\\n\", \n                miles, kms);\n    }\n}\n```\n\nIf\
    \ you run the `FunctionDemo1` class, you will see this on your console.\n\n```\n\
    \ 3 miles = 4.80 kilometers\n```\n\nA variant of `Function`, `BiFunction` takes\
    \ two arguments and returns a result. Listing 1.3 shows an example of `BiFunction`.\
    \ It uses `BiFunction` to create a function that calculates an area given a width\
    \ and a length. Invoking the function is done by calling its `apply` method.\n\
    \n### Listing 1.3: The `BiFunctionDemo1` class\n\n```\n package app01.function;\n\
    import java.util.function.BiFunction;\n\npublic class BiFunctionDemo1 {\n    public\
    \ static void main(String[] args) {\n        BiFunction<Float, Float, Float> area\
    \ =\n                (width, length) -> width * length;\n        float width =\
    \ 7.0F;\n        float length = 10.0F;\n        float result = area.apply(width,\
    \ length);\n        System.out.println(result);\n    }\n}\n```\n\nRunning the\
    \ `BiFunctionDemo1` class prints this on the console.\n\n```\n 70.0\n```\n\nIn\
    \ addition to `BiFunction`, there are also variants that are specializations of\
    \ `Function`. For example, the `IntFunction` interface always takes an `Integer`\
    \ and requires only one parameterized type for the result type. Its `apply` method\
    \ returns an `int`.\n\n```\n R apply(int input)\n```\n\nThe `LongFunction` and\
    \ `DoubleFunction` interfaces are similar to `IntFunction`, except they take a\
    \ `long` and a `double` as an argument, respectively.\n\nThen, there are variants\
    \ that do not require parameterized arguments at all, because they have been designed\
    \ for a specific argument type and a specific return type. For instance, the `IntToDoubleFunction`\
    \ interface can be used to create a function that accepts an `int` and returns\
    \ a `double`. Instead of `apply`, the interface offers an `applyAsDouble` method.\
    \ An example of `IntToDoubleFunction` interface is given in Listing 1.4. It is\
    \ a function that converts a temperature on the Celcius scale to Fahrenheit.\n\
    \n### Listing 1.4: The `IntToDoubleFunctionDemo1` class\n\n```\n package app01.function;\n\
    import java.util.function.IntToDoubleFunction;\n\npublic class IntToDoubleFunctionDemo1\
    \ {\n    public static void main(String[] args) {\n        IntToDoubleFunction\
    \ celciusToFahrenheit = \n                (input) -> 1.8 * input + 32;\n     \
    \   int celcius = 100;\n        double fahrenheit = \n                celciusToFahrenheit.applyAsDouble(celcius);\n\
    \        System.out.println(celcius + \"\\u2103\" + \" = \" \n               \
    \ + fahrenheit + \"\\u2109\\n\");\n    }\n}\n```\n\nThis is the output of `IntToDoubleFunctionDemo1`.\n\
    \n```\n 100? = 212.0?\n```\n\nSimilar to `IntToDoubleFunction` are `LongToDoubleFunction`\
    \ and `LongToIntFunction`. I am sure you can guess what they do from their names.\n\
    \nThe `UnaryOperator` interface is another specialization of `Function` whose\
    \ operand type is the same as the return type. Its declaration is as follows.\n\
    \n```\n public interfaceUnaryOperator<T> extends Function<T,T>\n```\n\n`BinaryOperator`\
    \ is a specialization of `BiFunction`. `BinaryOperator` represents an operation\
    \ with two operands of the same type and returns a result that has the same type\
    \ as the operands.\n\n## Predicate\n\nA `Predicate` is a function that takes a\
    \ parameter and returns true or false based on the value of the parameter. It\
    \ has a single abstract method called `test`.\n\nFor example, the `PredicateDemo1`\
    \ class in Listing 1.5 defines a `Predicate` that evaluates a string input and\
    \ returns true if every character in the string is a number.\n\n### Listing 1.5:\
    \ The `PredicateDemo1` class\n\n```\n package app01.function;\nimport java.util.function.Predicate;\n\
    \npublic class PredicateDemo1 {\n    public static void main(String[] args) {\n\
    \        Predicate<String> numbersOnly = (input) -> {\n            for (int i\
    \ = 0; i < input.length(); i++) {\n                char c = input.charAt(i);\n\
    \                if (\"0123456789\".indexOf(c) == -1) {\n                    return\
    \ false;\n                }\n            }\n            return true;\n       \
    \ };\n\n        System.out.println(numbersOnly.test(\"12345\")); // true\n   \
    \     System.out.println(numbersOnly.test(\"100a\")); // false\n    }\n}\n```\n\
    \n## Supplier\n\nA `Supplier` takes no parameter and returns a value. Implementations\
    \ must override its `get` abstract method and returns an instance of the interface’s\
    \ type parameter.\n\nListing 1.6 shows an example of `Supplier`. It defines a\
    \ `Supplier` that returns a one-digit random number and uses a for loop to print\
    \ five random numbers.\n\n### Listing 1.6: The `SupplierDemo1` class\n\n```\n\
    \ package app01.function;\nimport java.util.Random;\nimport java.util.function.Supplier;\n\
    \npublic class SupplierDemo1 {\n    public static void main(String[] args) {\n\
    \        Supplier<Integer> oneDigitRandom = () -> {\n            Random random\
    \ = new Random();\n            return random.nextInt(10);\n        };\n      \
    \  for (int i = 0; i < 5; i++) {\n            System.out.println(\n          \
    \          oneDigitRandom.get());\n        }\n    }\n}\n```\n\nThere are also\
    \ specialized variants of `Supplier`, such as `DoubleSupplier` (returns a `Double`),\
    \ `IntSupplier` and `LongSupplier`.\n\n## Consumer\n\nA `Consumer` is an operation\
    \ that returns no result. It has one abstract method called `accept`.\n\nListing\
    \ 1.7 shows an example of `Consumer` that takes a string and print it center-justified.\n\
    \n### Listing 1.7: Consumer example\n\n```\n package app01.function;\nimport java.util.function.Consumer;\n\
    import java.util.function.Function;\n\npublic class ConsumerDemo1 {\n    public\
    \ static void main(String[] args) {\n        Function<Integer, String> spacer\
    \ = (count) -> {\n            StringBuilder sb = new StringBuilder(count);\n \
    \           for (int i = 0; i < count; i++) {\n                sb.append(\" \"\
    );\n            }\n            return sb.toString();\n        };\n\n        int\
    \ lineLength = 60; // characters\n        Consumer<String> printCentered = \n\
    \                (input) -> {\n                    int length = input.length();\n\
    \                    String spaces = spacer.apply(\n                         \
    \   (lineLength - length) / 2);\n                    System.out.println(spaces\
    \ + input);\n                };\n\n        printCentered.accept(\"A lambda expression\
    \ a day\");\n        printCentered.accept(\"makes you\");\n        printCentered.accept(\"\
    look smarter\");\n    }\n}\n```\n\nThe example in Listing 1.7 features a `Consumer`\
    \ that takes a String and prints it after prefixing it with a certain number of\
    \ spaces. The implementation of the `Consumer`’s `accept` method is given by this\
    \ Lambda expression.\n\n```\n (input) -> {\n                    int length = input.length();\n\
    \                    String spaces = spacer.apply(\n                         \
    \   (lineLength - length) / 2);\n                    System.out.println(spaces\
    \ + input);\n                }\n```\n\nThe function `spacer` returns the specified\
    \ number of spaces and is defined as\n"
  raw: "Table 1.1: Core functional interfaces\n\nFunction, BiFunction and Other Variants\n\
    \nThe Function interface is used to create a one-argument function that returns\
    \ a result. It is a parameterized type and here is its definition.\n\n```\n public\
    \ interface Function<T, R>\n```\n\nHere, T represents the type of the argument\
    \ and R the type of the result.\n\nFunction has one abstract method, apply, whose\
    \ signature is as follows.\n\n```\n R apply(T argument)\n```\n\nThis is the method\
    \ you need to override when using Function. For example, the class in Listing\
    \ 1.2 defines a Function for converting miles to kilometers. The Function takes\
    \ an Integer as an argument and returns a Double.\n\nListing 1.2: The FunctionDemo1\
    \ class\n\n```\n package app01.function;\nimport java.util.function.Function;\n\
    \npublic class FunctionDemo1 {\n    public static void main(String[] args) {\n\
