    ```\n Latest largest order value: $100.49, date : 2014-12-11\n```\n\nIf the stream\
    \ is empty, the reduce method will not throw an exception. It simply returns an\
    \ empty Optional.\n\nAs a second example, consider the code in Listing 4.8\\.\
    \ The demo class uses a Stream to calculate the total order value in a given month.\n\
    \nListing 4.8: StreamReductionDemo2 class"
