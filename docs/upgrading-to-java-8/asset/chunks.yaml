    \ VBox.\n\nBorderPane divides a Parent into five areas, top, bottom, left, right,\
    \ and center. The diagram in Figure 6.4 shows the different areas in a BorderPane.\n\
    \n![](Images/0604.png)\n\nFigure 6.4: The five areas of BorderPane\n\nHBox lays\
    \ out its children in a single horizontal row and VBox does it in a single vertical\
    \ row. GridPane, on the other hand, arranges children in a grid and is often used\
    \ to layout the controls of a form.\n\nThe BorderPaneDemo class Listing 6.3 uses\
    \ BorderPane to lay out controls. Only the top, left and center areas are used.\
    \ The top section contains an HBox with two buttons and the left section contains\
    \ a Label and a ColorPicker. The center section has an ImageView with an Image.\n\
    \nListing 6.3: The BorderPaneDemo class"
