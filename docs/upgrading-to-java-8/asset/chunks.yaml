  trans: "\n\n顺便提一下，注意 `StringListFormatter` 中的抽象方法接受两个参数并返回一个值。这是 `BiFunction` 的理想候选者。列表\
    \ 2.3 中的 `WithBiFunction` 类是 `MethodReferenceDemo1` 类的重写，它完全消除了 `StringListFormatter`\
    \ 接口。`formatAndPrint` 方法也经过修改以接受一个 `BiFunction` 作为其第一个参数。\n\n### 列表 2.3：`WithBiFunction`\
    \ 类\n\n```java\n package app02.methodref;\nimport java.util.Arrays;\nimport java.util.List;\n\
    import java.util.function.BiFunction;\n\npublic class WithBiFunction {\n\n   \
    \ public static void formatAndPrint(\n            BiFunction<String, List<String>,\
    \ String> formatter, \n            String delimiter, List<String> list) {\n  \
    \      String formatted = formatter.apply(delimiter, list);\n        System.out.println(formatted);\n\
    \    }\n\n    public static void main(String[] args) {\n        List<String> names\
    \ = Arrays.asList(\"Don\", \"King\", \"Kong\");\n        formatAndPrint(String::join,\
    \ \", \", names);\n    }\n}\n```\n\n### 引用对象引用可用的实例方法\n\n此类方法引用的兼容性规则与静态方法引用的规则相同。被引方法必须与被替换的函数式接口的抽象方法具有兼容的返回值和参数。\n\
    \n例如，在 JDK 1.8 中，`java.lang.Iterable` 接口有一个名为 `forEach` 的默认方法，它接受一个 `Consumer`：\n\
    \n```java\n default void forEach(java.util.function.Consumer<? super T> action)\n\
    ```\n\n`forEach` 为 `Iterable` 的每个元素执行给的操作。得益于继承，该方法被其子接口 `List` 继承，我将在列表 2.4 的示例中使用它。\n\
    \n### 列表 2.4：在对象中引用实例方法\n\n```java\n package app02.methodref;\nimport java.util.Arrays;\n\
    import java.util.List;\n\npublic class MethodReferenceDemo2 {\n    public static\
    \ void main(String[] args) {\n        List<String> fruits = Arrays.asList(\"Apple\"\
    , \"Banana\");\n        // 使用 lambda 表达式\n        fruits.forEach((name) -> System.out.println(name));\n\
    \n        // 使用方法引用\n        fruits.forEach(System::out::println);\n    }\n}\n\
    ```\n\n`MethodReferenceDemo2` 类有一个需要打印的水果列表。你可以通过调用 `forEach` 方法来实现这一点，并如下所示以\
    \ lambda 表达式的形式传递 `Consumer`：\n\n```java\n fruits.forEach((name) -> System.out.println(name));\n\
    ```\n\n或者，由于 `System.out` 是系统已经为你创建的现有对象，你可以使用方法引用指向 `System.out` 上的 `println`\
    \ 方法。\n\n```java\n fruits.forEach(System.out::println);\n```\n\n### 引用对象引用不可用的实例方法\n\
    \n坐稳了。这一个有点复杂，需要你全神贯。\n\n你可以将实例方法的引用作为方法参数传递，以替换函数式接口。在这种情况下，你不需要显式地创建所属类的实例。此类方法引用的语法与第一、二类方法引用不同。对于前二类方法引用，参数的数量必须与函数式接口抽象方法预期的参数数量相同。当使用没有对象引用的实例方法时，被引方法的参数数量必须比函数式接口抽象方法预期的参数数量少一个。因此，如果函数式接口的抽象方法接受四个参数，则被引实例方法只需要三个参数，且这些参数必须与抽象方法的第二、第三和第四参数兼容。此外，抽象方法的第一个参数必须是与包含该实例方法的类兼容的类型。\n\
    \n此类方法引用的兼容性规则如下所示。第一行是函数式接口抽象方法的伪签名，第二行是被引实例方法的伪签名。\n\n```\n returnType abstractMethod(type-1,\
    \ type-2, type-3, type-4)\nreturnType instanceMethod(type-2, type-3, type-4)\n\
    ```\n\n在这里，`type-1` 必须与包含该实例方法的类兼容，因为该类将被实例化，并且该实例将与其他参数一起作为第一个参数传递给抽象方法。\n\n\
    在看了这种方法引用的示例后，这一点将会变得清晰。\n\n### 列表 2.5：`MethodReferenceDemo3` 类\n\n```java\n package\
    \ app02.methodref;\nimport java.util.Arrays;\n\npublic class MethodReferenceDemo3\
    \ {\n\n    public static void main(String[] args) {\n        String[] names =\
    \ {\"Alexis\", \"anna\", \"Kyleen\"};\n\n        Arrays.sort(names, String::compareToIgnoreCase);\n\
    \        for (String name : names) {\n            System.out.println(name);\n\
    \        }\n    }\n}\n```\n\n列表 2.5 中的示例展示了如何向 `Arrays.sort` 传递实例方法引用以代替 `Comparator`。`MethodReferenceDemo3`\
    \ 类包含一个字符串数组，其中没有严格遵守大小写敏感。如果你使用只接受一个参数的 `Arrays.sort` 重载版本来对此数组排序，名称将排序为：\n\n\
    ```\n Alexis, Kyleen, anna\n```\n\n这不是你想要的。因此，你需要使用同样接受 `Comparator` 的 `Arrays.sort`：\n\
    \n```\n public static <T> void sort(T[] array, Comparator<? super T> c)\n```\n\
    \n示例展示了如何使用实例方法引用 `String.compareIgnoreCase` 来替换 `Comparator`（记得 `Comparator`\
    \ 是一个函数式接口）。这里是 `String.compareToIgnoreCase` 的签名。\n\n```java\n public int compareToIgnoreCase(String\
    \ str)\n```\n\n它比 `Comparator.compare` 的签名少一个参数。\n\n```\n int compare(String str1,\
    \ String str2)\n```\n\n这对于第二类方法引用非常完美。\n\n如果你运行代码，你会发现名称被正确排序了。这里是结果。\n\n```\n\
    \ Alexis\nanna\nKyleen\n```\n\n### 引用构造函数\n\n第四类方法引用使用构造函数。构造函数引用的语法如下：\n\n```\n\
    \ ClassName::new\n```\n\n假设你需要一个方法将 `Integer` 数组转换为 `Collection`，并且你需要确定结果集合是\
    \ `List` 还是 `Set`。为此，你可以在列表 2.6 中创建 `arrayToCollection` 方法。\n\n### 列表 2.6：`MethodReferenceDemo4`\
    \ 类\n\n```java\n package app02.methodref;\nimport java.util.ArrayList;\nimport\
    \ java.util.Collection;\nimport java.util.HashSet;\nimport java.util.function.Supplier;\n\
    \npublic class MethodReferenceDemo4 {\n\n    public static Collection<Integer>\
    \ arrayToCollection(\n            Supplier<Collection<Integer>> supplier, Integer[]\
    \ \n                numbers) {\n        Collection<Integer> collection = supplier.get();\n\
    \        for (int i : numbers) {\n            collection.add(i);\n        }\n\
    \        return collection;\n    }\n\n    public static void main(String[] args)\
    \ {\n        Integer[] array = {1, 8, 5};\n        Collection<Integer> col1 \n\
    \                = arrayToCollection(ArrayList<Integer>::new, array);\n      \
    \  System.out.println(\"Natural order\");\n        col1.forEach(System.out::println);\n\
    \        System.out.println(\"=======================\");\n        System.out.println(\"\
    Ascending order\");\n        Collection<Integer> col2 \n                = arrayToCollection(HashSet<Integer>::new,\
    \ array);\n        col2.forEach(System.out::println);\n    }\n}\n```\n\n与其将此 lambda\
    \ 表达式作为方法的第一个参数传递。\n\n```java\n () -> new ArrayList<Integer>()\n```\n\n你只需要传递此\
    \ `ArrayList` 构造函数的引用。\n\n```\n ArrayList<Integer>::new\n```\n\n以及，而不是这个\n\n```\n\
    \ () -> new HashSet<Integer>()\n```\n\n你可以写成\n\n```\n HashSet<Integer>::new\n\
    ```\n\n如果你运行该示例，你将在控制台上看到以下内容。\n\n```\n Natural order\n1\n8\n5\n=======================\n\
    Ascending order\n1\n5\n8\n```\n\n"
- fmt: "\nMore examples of constructor references can be found in Chapter 4, “The\
    \ Stream API.”\n\n# Summary\n\nA new feature in Java 8, `lambda expressions` can\
    \ make certain constructs shorter and more readable, especially when you are dealing\
    \ with inner classes. This chapter discussed the method reference a subfeature\
    \ that can make writing lambda expressions easier.\n\n# Chapter 3: Optional and\
    \ Similar Classes\n\nJava programmers have been dealing with `null pointer exceptions`\
    \ for years. In Java 8 there is a new way of handling them, by wrapping an object\
    \ that can potentially be null in a class called `Optional`. This chapter covers\
    \ `Optional` and similar classes.\n\n## Overview\n\nJava 8 adds the `Optional`,\
    \ `OptionalInt`, `OptionalLong` and `OptionalDouble` classes to deal with `NullPointerExceptions`.\
    \ Part of the `java.util` package, these classes are excellent examples of classes\
    \ that heavily use lambda expressions and method references.\n\nThese four classes\
    \ are similar and `Optional` is the most important of them as it can be used with\
    \ any type whereas the other classes are only suitable for integers, `longs` or\
    \ `doubles`, respectively. Consequently, `Optional` is the main focus of this\
    \ chapter.\n\n`Optional` is a container for a value that can potentially be null.\
    \ As you should know by now, trying to call a method or a field on a null reference\
    \ variable throws a `NullPointerException`. Handling null is not hard, but it\
    \ can be tedious. Consider the code in Listing 3.1 that shows a `Company` class\
    \ that can have an `Office`, which in turn can have an `Address`. To make things\
    \ simple, here an `Address` only contains two fields, `street` and `city`. All\
    \ these properties can be null. A `Company` may not have an `Office` and an `Address`\
    \ may not have full data about the `street` and `city`.\n\n### Listing 3.1: Tedious\
    \ way of checking for nullity\n\n```\npackage app03.optional1;\n\nclass Company\
    \ {\n    private String name;\n    private Office office;\n    public Company(String\
    \ name, Office office) {\n        this.name = name;\n        this.office = office;\n\
    \    }\n\n    public String getName() {\n        return name;\n    }\n\n    public\
    \ Office getOffice() {\n        return office;\n    }\n}\n\nclass Office {\n \
    \   private String id;\n    private Address address;\n\n    public Office(String\
    \ id, Address address) {\n        this.id = id;\n        this.address = address;\n\
    \    }\n\n    public String getId() {\n        return id;\n    }\n\n    public\
    \ Address getAddress() {\n        return address;\n    }\n}\n\nclass Address {\n\
    \    private String street;\n    private String city;\n\n    public Address(String\
    \ street, String city) {\n        this.street = street;\n        this.city = city;\n\
    \    }\n\n    public String getStreet() {\n        return street;\n    }\n\n \
    \   public String getCity() {\n        return city;\n    }\n}\n\npublic class\
    \ OptionalDemo1 {\n\n    public static void main(String[] args) {\n        Address\
    \ address1 = new Address(null, \"New York\");\n        Office office1 = new Office(\"\
    OF1\", address1);\n        Company company1 = new Company(\"Door Never Closed\"\
    ,\n            office1);\n\n        // What is the street address of company1?\n\
    \        // In which city company1 is located?\n        String streetAddress =\
    \ null;\n        String city = null;\n        if (company1 != null) {\n      \
    \      Office office = company1.getOffice();\n            if (office != null)\
    \ {\n                Address address = office.getAddress();\n                if\
    \ (address != null) {\n                    streetAddress = address.getStreet();\n\
    \                    city = address.getCity();\n                }\n          \
    \  } \n        }\n        System.out.println(\"Street Name:\" + streetAddress);\n\
    \        System.out.println(\"City:\" + city);\n    }\n}\n```\n\nThe `OptionalDemo1`\
    \ class in Listing 3.1 creates a `Company` for testing and tries to get the street\
    \ address of the company. Realizing that any of the fields can be null, the programmer\
    \ made a conscious attempt to test each single instance for nullity before calling\
    \ a method on it, resulting in this code:\n\n```\n        if (company1 != null)\
    \ {\n            Office office = company1.getOffice();\n\n            if (office\
    \ != null) {\n                Address address = office.getAddress();\n       \
    \         if (address != null) {\n                    streetAddress = address.getStreet();\n\
    \                    city = address.getCity();\n                }\n          \
    \  } \n        }\n```\n\nThis is kind of tedious and readability suffers.\n\n\
    The `Optional` class can help. If you decide to use it, you wrap every field that\
    \ can potentially be null in an `Optional`. For example, the `office` field in\
    \ `Company` should now be:\n\n```java\n private Optional<Office> office;\n```\n\
    \nAnd the `city` field in `Address` should be\n\n```java\n private Optional<String>\
    \ city;\n```\n\nBefore you learn how to rewrite the example in Listing 3.1 using\
    \ `Optional`, look at the methods of `Optional` in Table 3.1.\n\n| Method | Description\
    \ |\n| :--- | :--- |\n| `empty` | Returns an empty `Optional` |\n| `filter` |\
    \ If a value is present and matches the given predicate, return an `Optional`\
    \ describing the value. Otherwise, returns an empty `Optional`. |\n| `flatMap`\
    \ | If a value is preset, apply the specified mapping function on the value and\
    \ return and `Optional` describing the mapping result. If a value is not present,\
    \ return an empty `Optional`. |\n| `get` | If a value is present, returns the\
    \ value. Otherwise, throw a `NoSuchElementException`. |\n| `ifPresent` | If a\
    \ value is present, invoked the given `Consumer` with the value. |\n| `isPresent`\
    \ | Returns true if a value is present. Otherwise, returns false. |\n| `map` |\
    \ If a value is present, apply the given mapping function to it. If the result\
    \ is not null, return an `Optional` describing the result. |\n| `of` | Returns\
    \ an `Optional` describing the given non-null value. |\n| `ofNullable` | If the\
    \ given value is non-null, returns an `Optional` describing the value. If the\
    \ value is null, returns an empty `Optional`. |\n| `orElse` | If a value is present,\
    \ returns the value. Otherwise, returns the specified value. |\n\nTable 3.1: More\
    \ important methods of Optional\n\nThe methods are easy to use. To wrap a value\
    \ in an `Optional`, call its static `of` or `ofNullable` method. You `of` if you\
    \ are certain the value you are wrapping is not null. If the value is potentially\
    \ null, use `ofNullable` instead. Alternatively, the `empty` method is also static\
    \ and returns an empty `Optional`, i.e. an `Optional` without a value.\n\nThe\
    \ rest of the methods are for handling an `Optional`. If you simply want to retrieve\
    \ the value in an `Optional`, you would first check if a value is present. You\
    \ can do this by using `isPresent` followed by `get`:\n\n```\n if (optional.isPresent())\
    \ {\n    value = optional.get();\n}\n```\n\nHowever, this is similar to checking\
    \ for nullity when not using `Optional`. There are better ways, though.\n\nThe\
    \ `ifPresent` method accepts a `Consumer` that will be called if a value is present.\
    \ So if you simply want to print the value, you can do this.\n\n```\n optional.ifPresent(System.out::println);\n\
    ```\n\nIf no value is present, nothing will happen. So this is getting better,\
    \ isn’t it?\n\nHowever, wait until you get to use `flatMap`. This method applies\
    \ a mapping function and returns an `Optional` describing the value. Better still,\
    \ it can be cascaded, like this to replace the series of null check in Listing\
    \ 3.14:\n\n```java company1.flatMap(Company::getOffice)\n        .flatMap(Office::getAddress)\n\
    \        .flatMap(Address::getCity)\n        .ifPresent(System.out::println);\n\
    ```\n\nNow look at Listing 3.2 that contains a rewrite of the code in Listing\
    \ 3.1. All fields that can potentially be null have been wrapped in `Optionals`.\n\
    \nListing 3.2: Using Optional\n"
  raw: "More examples of constructor references can be found in Chapter 4, “The Stream\
    \ API.”\n\nSummary\n\nA new feature in Java 8, lambda expressions can make certain\
    \ constructs shorter and more readable, especially when you are dealing with inner\
    \ classes. This chapter discussed the method reference a subfeature that can make\
    \ writing lambda expressions easier.\n\nChapter 3\n\nOptional and Similar Classes\n\
    \nJava programmers have been dealing with null pointer exceptions for years. In\
    \ Java 8 there is a new way of handling them, by wrapping an object that can potentially\
    \ be null in a class called Optional.\n\nThis chapter covers Optional and similar\
    \ classes.\n\nOverview\n\nJava 8 adds the Optional, OptionalInt, OptionalLong\
    \ and OptionalDouble classes to deal with NullPointerExceptions. Part of the java.util\
    \ package, these classes are excellent examples of classes that heavily use lambda\
    \ expressions and method references.\n\nThese four classes are similar and Optional\
    \ is the most important of them as it can be used with any type whereas the other\
    \ classes are only suitable for integers, longs or doubles, respectively. Consequently,\
    \ Optional is the main focus of this chapter.\n\nOptional is a container for a\
    \ value that can potentially be null. As you should know by now, trying to call\
    \ a method or a field on a null reference variable throws a NullPointerException.\
    \ Handling null is not hard, but it can be tedious. Consider the code in Listing\
    \ 3.1 that shows a Company class that can have an Office, which in turn can have\
    \ an Address. To make things simple, here an Address only contains two fields,\
    \ street and city. All these properties can be null. A Company may not have an\
    \ Office and an Address may not have full data about the street and city.\n\n\
    Listing 3.1: Tedious way of checking for nullity\n\n```\n package app03.optional1;\n\
    \nclass Company {\n    private String name;\n    private Office office;\n    public\
    \ Company(String name, Office office) {\n        this.name = name;\n        this.office\
    \ = office;\n    }\n\n    public String getName() {\n        return name;\n  \
    \  }\n\n    public Office getOffice() {\n        return office;\n    }\n}\n\n\
    class Office {\n    private String id;\n    private Address address;\n\n    public\
    \ Office(String id, Address address) {\n        this.id = id;\n        this.address\
    \ = address;\n    }\n\n    public String getId() {\n        return id;\n    }\n\
    \n    public Address getAddress() {\n        return address;\n    }\n}\n\nclass\
    \ Address {\n    private String street;\n    private String city;\n\n    public\
    \ Address(String street, String city) {\n        this.street = street;\n     \
    \   this.city = city;\n    }\n\n    public String getStreet() {\n        return\
    \ street;\n    }\n\n    public String getCity() {\n        return city;\n    }\n\
    }\n\npublic class OptionalDemo1 {\n\n    public static void main(String[] args)\
    \ {\n        Address address1 = new Address(null, \"New York\");\n        Office\
    \ office1 = new Office(\"OF1\", address1);\n        Company company1 = new Company(\"\
    Door Never Closed\",\n            office1);\n\n        // What is the street address\
    \ of company1?\n        // In which city company1 is located?\n        String\
    \ streetAddress = null;\n        String city = null;\n        if (company1 !=\
    \ null) {\n            Office office = company1.getOffice();\n            if (office\
    \ != null) {\n                Address address = office.getAddress();\n       \
    \         if (address != null) {\n                    streetAddress = address.getStreet();\n\
    \                    city = address.getCity();\n                }\n          \
    \  } \n        }\n        System.out.println(\"Street Name:\" + streetAddress);\n\
    \        System.out.println(\"City:\" + city);\n    }\n}\n```\n\nThe OptionalDemo1\
    \ class in Listing 3.1 creates a Company for testing and tries to get the street\
    \ address of the company. Realizing that any of the fields can be null, the programmer\
    \ made a conscious attempt to test each single instance for nullity before calling\
    \ a method on it, resulting in this code:\n\n```\n if (company1 != null) {\n \
    \           Office office = company1.getOffice();\n\n            if (office !=\
    \ null) {\n                Address address = office.getAddress();\n          \
    \      if (address != null) {\n                    streetAddress = address.getStreet();\n\
    \                    city = address.getCity();\n                }\n          \
    \  } \n        }\n```\n\nThis is kind of tedious and readability suffers.\n\n\
    The Optional class can help. If you decide to use it, you wrap every field that\
    \ can potentially be null in an Optional. For example, the office field in Company\
    \ should now be:\n\n```\n private Optional<Office> office;\n```\n\nAnd the city\
    \ field in Address should be\n\n```\n private Optional<String> city;\n```\n\n\
    Before you learn how to rewrite the example in Listing 3.1 using Optional, look\
    \ at the methods of Optional in Table 3.1.\n\n| Method | Description |\n\n| empty\
    \ | Returns an empty Optional |\n\n| filter | If a value is present and matches\
    \ the given predicate, return an Optional describing the value. Otherwise, returns\
    \ an empty Optional. |\n\n| flatMap | If a value is preset, apply the specified\
    \ mapping function on the value and return and Optional describing the mapping\
    \ result. If a value is not present, return an empty Optional. |\n\n| get | If\
    \ a value is present, returns the value. Otherwise, throw a NoSuchElementException.\
    \ |\n\n| ifPresent | If a value is present, invoked the given Consumer with the\
    \ value. |\n\n| isPresent | Returns true if a value is present. Otherwise, returns\
    \ false. |\n\n| map | If a value is present, apply the given mapping function\
    \ to it. If the result is not null, return an Optional describing the result.\
    \ |\n\n| of | Returns an Optional describing the given non-null value. |\n\n|\
    \ ofNullable | If the given value is non-null, returns an Optional describing\
    \ the value. If the value is null, returns an empty Optional. |\n\n| orElse |\
    \ If a value is present, returns the value. Otherwise, returns the specified value.\
    \ |\n\nTable 3.1: More important methods of Optional\n\nThe methods are easy to\
    \ use. To wrap a value in an Optional, call its static of or ofNullable method.\
    \ You use of if you are certain the value you are wrapping is not null. If the\
    \ value is potentially null, use ofNullable instead. Alternatively, the empty\
    \ method is also static and returns an empty Optional, i.e. an Optional without\
    \ a value.\n\nThe rest of the methods are for handling an Optional. If you simply\
    \ want to retrieve the value in an Optional, you would first check if a value\
    \ is present. You can do this by using isPresent followed by get:\n\n```\n if\
    \ (optional.isPresent()) {\n    value = optional.get();\n}\n```\n\nHowever, this\
    \ is similar to checking for nullity when not using Optional. There are better\
    \ ways, though.\n\nThe ifPresent method accepts a Consumer that will be called\
    \ if a value is present. So if you simply want to print the value, you can do\
    \ this.\n\n```\n optional.ifPresent(System.out::println);\n```\n\nIf no value\
    \ is present, nothing will happen. So this is getting better, isn’t it?\n\nHowever,\
    \ wait until you get to use flatMap. This method applies a mapping function and\
    \ returns an Optional describing the value. Better still, it can be cascaded,\
    \ like this to replace the series of null check in Listing 3.14:\n\n```\n company1.flatMap(Company::getOffice)\n\
    \        .flatMap(Office::getAddress)\n        .flatMap(Address::getCity)\n  \
    \      .ifPresent(System.out::println);\n```\n\nNow look at Listing 3.2 that contains\
    \ a rewrite of the code in Listing 3.1\\. All fields that can potentially be null\
    \ have been wrapped in Optionals.\n\nListing 3.2: Using Optional"
