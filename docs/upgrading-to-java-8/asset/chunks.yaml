    \n![](Images/0605.png)\n\nFigure 6.5: BorderPane demo\n\n## Event Handling\n\n\
    JavaFX is event-driven. A UI component can raise events and you can write code\
    \ to handle the events. This event-driven-ness enables user interactivity in JavaFX\
    \ applications.\n\nThere are many types of events, all derive from the `javafx.event.Event`\
    \ class. Subclasses of `Event` include `ActionEvent`, `InputMethodEvent`, `MouseEvent`,\
    \ `MouseDragEvent`, `ScrollEvent`, `SwipeEvent`, and so on.\n\nDifferent components\
    \ may raise different events. For example, clicking a button raises an `ActionEvent`\
    \ and changing the text in a `TextField` triggers an `InputMethodEvent`. You can\
    \ write and register an event handler that will be called when the corresponding\
    \ event occurs. For instance, you can write a handler for the `InputMethodEvent`\
    \ of a `TextField` to change entered text to upper case. Or, you can write a handler\
    \ that will open another `Stage` if a button is clicked.\n\nThe easiest way to\
    \ write and register an event handler in JavaFX is by using one of the convenience\
    \ methods provided by the `Node` class. The method names have the pattern `setOnXXX`\
    \ and the methods are inherited by all descendents of `Node`. Examples of the\
    \ convenience methods are `setOnDragEntered`, `setOnDragExited`, `setOnInputMethodTextChanged`,\
    \ `setOnKeyTyped`, `setOnMouseClicked`, and many, many others. Subclasses of `Node`\
    \ may add more convenience methods to accommodate events specific to them.\n\n\
    These convenience methods take an `EventHandler` object as an argument. `javafx.event.EventHandler`\
    \ is a parameterized interface with a method, `handle`. Here is the definition\
    \ of `EventHandler`.\n\n```java\n package javafx.event;\npublic interface EventHandler<T\
    \ extends Event> extends \n        java.util.EventListener {\n\n    void handle(T\
    \ event)\n\n}\n```\n\nWhen constructing an `EventHandler`, you must pass an appropriate\
    \ event type. For example, the following code construct an `EventHandler` for\
    \ the `ActionEvent`.\n\n```java\nEventHandler handler = new EventHandler<ActionEvent>()\
    \ { \n\n    @Override \n    public void handle(ActionEvent event) { \n       \
    \ // do something\n    } \n};\n```\n\nThe `RotateDemo` class in Listing 6.4 shows\
    \ JavaFX event processing. The class has a `Rectangle` and a `Button` and captures\
    \ the `ActionEvent` of the `Button`. Whenever the button is clicked, the `Rectangle`\
    \ is rotated 10 degrees clock-wise.\n\nListing 6.4: The `RotateDemo` class\n\n\
    ```java\n package app06;\n\nimport javafx.application.Application; \nimport javafx.collections.ObservableList;\
    \ \nimport javafx.event.ActionEvent; \nimport javafx.event.EventHandler; \nimport\
    \ javafx.scene.Node; \nimport javafx.scene.Scene; \nimport javafx.scene.control.Button;\
    \ \nimport javafx.scene.layout.VBox; \nimport javafx.scene.paint.Color; \nimport\
    \ javafx.scene.shape.Rectangle; \nimport javafx.stage.Stage; \n\npublic class\
    \ RotateDemo extends Application { \n\n    @Override \n    public void start(Stage\
    \ stage) { \n        VBox root = new VBox(40); \n        ObservableList<Node>\
    \ children = root.getChildren(); \n        final Rectangle rect = new Rectangle(80,\
    \ 50); \n        rect.setFill(Color.AQUAMARINE); \n        children.add(rect);\
    \ \n\n        Button button = new Button(\"Rotate\"); \n        button.setOnAction(new\
    \ EventHandler<ActionEvent>() { \n            @Override \n            public void\
    \ handle(ActionEvent event) { \n                rect.rotate(10); \n          \
    \  } \n        });\n\n        Scene scene = new Scene(root, 120, 130); \n    \
    \    stage.setTitle(\"Rotate Demo\"); \n        stage.setScene(scene); \n    \
    \    stage.show(); \n    } \n\n    public static void main(String[] args) { \n\
    \        launch(args); \n    } \n}\n```\n\nIn the `start` method of the application,\
    \ a `Button` is created and its `setOnAction` method called.\n\nFigure 6.6 shows\
    \ the application. Try clicking the button and watch the effect.\n\n![](Images/0606.png)\n\
    \nFigure 6.6: Event handling in JavaFX\n\n## Styling with CSS\n\nSome of the controls\
    \ offer methods to change their look and feel. For example, the `setFont` method\
    \ of the `Label` class allows you to set the font to display the label text. While\
    \ these methods are easy to use, they have to be called from within the code and\
    \ this implies tight-coupling between the presentation layer and the business\
    \ logic. A better way is to style the UI components using CSS (Cascading Style\
    \ Sheet). In this chapter CSS refers to the CSS used in JavaFX.\n\nA CSS file\
    \ contains styles that can be referred to by id or by class. Each of the JavaFX\
    \ controls is already assigned a default CSS class that is similar to the Java\
    \ class name of the control. For example, the default style for `Button` is `button`\
    \ and the default style for `Label` is `label`. This means, to provide a style\
    \ that affects all buttons, you simply need a style named `button` in your CSS\
    \ file. For example,\n\n```css\n .button {\n    -fx-border-width: 3px; \n    -fx-background-color:#dd8818;\
    \ \n} \n```\n\nThe default style for a control with a multiword name is the combination\
    \ of the words separated by a hyphen. For instance, the default style for `CheckBox`\
    \ is `check-box` and the default style for `ProgressBar` is `progress-bar`.\n\n\
    Non-control nodes do not have a default style. If you want to style a `VBox`,\
    \ for example, you first need to add a CSS class to the instance. For example,\
    \ the following code adds a style named `vbox` to a `Vbox`.\n\n```java\n VBox\
    \ vBox = new VBox(); \nvBox.getStyleClass().add(\"vbox\"); \n```\n\nThe `VBox`\
    \ will then react to a `vbox` style in any CSS file referred to by the application.\n"
