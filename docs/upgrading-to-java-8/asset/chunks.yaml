  trans: "\n\n```java\n package app05;\nimport java.time.Duration;\nimport java.time.LocalDateTime;\n\
    import java.time.Month;\nimport java.time.ZoneId;\nimport java.time.ZonedDateTime;\n\
    \npublic class TravelTimeCalculator {\n\n    public Duration calculateTravelTime(\n\
    \            ZonedDateTime departure, ZonedDateTime arrival) {\n        return\
    \ Duration.between(departure, arrival);\n    }\n\n    public static void main(String[]\
    \ args) {\n        TravelTimeCalculator calculator = \n                new TravelTimeCalculator();\n\
    \        ZonedDateTime departure1 = ZonedDateTime.of(\n                LocalDateTime.of(2014,\
    \ Month.MARCH, 8, \n                        8, 0), \n                ZoneId.of(\"\
    America/Denver\"));\n        ZonedDateTime arrival1 = ZonedDateTime.of(\n    \
    \            LocalDateTime.of(2014, Month.MARCH, 9, \n                       \
    \ 8, 0), \n                ZoneId.of(\"America/Toronto\"));\n        Duration\
    \ travelTime1 = calculator\n                .calculateTravelTime(departure1, arrival1);\n\
    \        System.out.println(\"Travel time 1: \" \n                + travelTime1.toHours()\
    \ + \" hours\");\n\n        ZonedDateTime departure2 = ZonedDateTime.of(\n   \
    \             LocalDateTime.of(2014, Month.MARCH, 18, \n                     \
    \   8, 0), \n                ZoneId.of(\"America/Denver\"));\n        ZonedDateTime\
    \ arrival2 = ZonedDateTime.of(\n                LocalDateTime.of(2014, Month.MARCH,\
    \ 19, \n                        8, 0), \n                ZoneId.of(\"America/Toronto\"\
    ));\n        Duration travelTime2 = calculator\n                .calculateTravelTime(departure2,\
    \ arrival2);\n        System.out.println(\"Travel time 2: \" \n              \
    \  + travelTime2.toHours() + \" hours\");\n    }\n}\n```\n\n结果如下。\n\n```\n Travel\
    \ time 1: 21 hours\nTravel time 2: 22 hours\n```\n\n为什么会有差异？因为 2014 年的夏令时是从 3\
    \ 月 9 日星期日凌晨 2 点开始的。因此，在 2014 年 3 月 8 日和 2014 年 3 月 9 日之间，你“丢失”了一小时。\n\n## 格式化日期-时间\n\
    \n你使用 `java.time.format.DateTimeFormatter` 来格式化本地或带时区的日期时间。`LocalDate`、`LocalDateTime`、`LocalTime`\
    \ 和 `ZonedDateTime` 类提供了具有以下签名的 `format` 方法。\n\n``` public java.lang.String format(java.time.format.DateTimeFormatter\
    \ \n        formatter)\n```\n\n显然，要格式化日期或时间，必须先创建一个 `DateTimeFormatter` 实例。\n\n\
    列表 5.8 中的代码使用两个格式化器格式化当前日期。\n\n### 列表 5.8：格式化日期\n\n```java\n package app05;\n\
    import java.time.LocalDateTime;\nimport java.time.format.DateTimeFormatter;\n\
    import java.time.format.FormatStyle;\n\npublic class DateTimeFormatterDemo1 {\n\
    \    public static void main(String[] args) {\n        DateTimeFormatter formatter1\
    \ = DateTimeFormatter\n                .ofLocalizedDateTime(FormatStyle.MEDIUM);\n\
    \        LocalDateTime example = LocalDateTime.of(\n                2000, 3, 19,\
    \ 10, 56, 59);\n        System.out.println(\"Format 1: \" + example\n        \
    \        .format(formatter1));        \n        DateTimeFormatter formatter2 =\
    \ DateTimeFormatter\n                .ofPattern(\"MMMM dd, yyyy HH:mm:ss\");\n\
    \        System.out.println(\"Format 2: \" + \n                example.format(formatter2));\n\
    \    }\n}\n```\n\n结果如下（第一个结果取决于你的区域设置）。\n\n```\n Format 1: 19-Mar-2000 10:56:59\
    \ AM\nFormat 2: March 19, 2000 10:56:59\n```\n\n## 解析日期-时间\n\nJava 日期和时间 API 中的许多类都有两个解析方法。第一个需要一个格式化器，第二个不需要。不需要的将根据默认模式解析日期时间。要使用你自己的模式，请使用\
    \ `DateTimeFormatter`。如果传递的字符串无法解析，`parse` 方法将抛出 `DateTimeParseException`。\n\n\
    列表 5.9 包含一个年龄计算器，用于演示日期解析。\n\n### 列表 5.9：一个年龄计算器\n\n```java\n package app05;\n\
    import java.time.LocalDate;\nimport java.time.Period;\nimport java.time.format.DateTimeFormatter;\n\
    import java.time.format.DateTimeParseException;\nimport java.util.Scanner;\n\n\
    public class AgeCalculator {\n    DateTimeFormatter formatter = DateTimeFormatter.ofPattern(\"\
    yyyy-M-d\");\n    public Period calculateAge(LocalDate birthday) {\n        LocalDate\
    \ today = LocalDate.now();\n        return Period.between(birthday, today);\n\
    \    }\n\n    public LocalDate getBirthday() {\n        Scanner scanner = new\
    \ Scanner(System.in);\n        LocalDate birthday;\n        while (true) {\n \
    \           System.out.println(\"Please enter your birthday \"\n             \
    \       + \"in yyyy-MM-dd format (e.g. 1980-9-28): \");\n            String input\
    \ = scanner.nextLine();\n            try {\n                birthday = LocalDate.parse(input,\
    \ formatter);\n                return birthday;\n            } catch(DateTimeParseException\
    \ e) {\n                System.out.println(\"Error! Please try again\");\n   \
    \         }\n        }\n    }\n\n    public static void main(String[] args) {\n\
    \        AgeCalculator ageCalculator = new AgeCalculator();\n        LocalDate\
    \ birthday = ageCalculator.getBirthday();\n        Period age = ageCalculator.calculateAge(birthday);\n\
    \        System.out.printf(\"Today you are %d years, %d months\"\n           \
    \     + \" and %d days old%n\",\n                age.getYears(), age.getMonths(),\
    \ age.getDays());\n    }\n}\n```\n\n`AgeCalculator` 类有两个方法：`getBirthday` 和 `calculateAge`。`getBirthday`\
    \ 方法使用 `Scanner` 读取用户输入，并使用类级别的 `DateTimeFormatter` 将输入解析为 `LocalDate`。`getBirthday`\
    \ 方法会一直请求日期，直到用户输入正确格式的日期，此时该方法返回。`calculateAge` 方法接收一个 `birthday` 并在 `birthday`\
    \ 和今天之间创建一个 `Period`。\n\n如果你运行这个示例，你将在控制台上看到以下内容：\n\n```\n Please enter your birthday\
    \ in yyyy-MM-dd format (e.g. 1980-9-28):\n```\n\n如果你输入了格式正确的日期，程序将打印计算出的年龄，如下：\n\
    \n```\n Today you are 79 years, 0 months and 15 days old\n```\n\n## 总结\n\nJava\
    \ 8 带来了新的日期时间 API 来取代围绕 `java.util.Date` 类的旧 API。在本章中，你学习了使用新 API 中的核心类，如 `Instant`、`LocalDate`、`LocalDateTime`、`ZonedDateTime`、`Period`\
    \ 和 `Duration`，并学习了格式化和解析日期时间。\n\n# 第 6 章 JavaFX 8\n\nJavaFX 是一种用于创建可以在桌面和浏览器中运行的丰富应用程序的技术。它与\
    \ Swing 类似，但具有更好更简单的对象模型，并将取代 Swing 和 AWT。\n\n本章介绍了 JavaFX，第七章“使用 FXML JavaFX”解释了如何使用名为\
    \ FXML 的特殊标记语言分离表示层和业务逻辑。\n\n## 概述\n\nJavaFX 是一种构建丰富应用程序的技术，可以作为桌面应用程序部署，并在浏览器中作为\
    \ applet 运行。JavaFX 将最终取代 Swing，为了方便从 Swing 迁移到 JavaFX，它支持两者之间的互操作性。你可以在 JavaFX\
    \ 应用程序中轻松地使用 Swing 组件。\n\n作为一种桌面技术，JavaFX 是任何 Java 开发者或渴望成为 GUI 开发者的极选择，归功于其功能和易用性。此外，JavaFX\
    \ 受到 Oracle 以及整个 Java 社区的全支持，因此获取帮助很容易。\n\n"
- fmt: "\nAs a technology for building in-browser applications, JavaFX must compete\
    \ with other technologies, notably HTML 5, Flash, and Microsoft Silverlight. HTML\
    \ 5 has the advantage of being natively supported by modern browsers, which means\
    \ everything built in HTML 5 is guaranteed to work seamlessly in those browsers,\
    \ despite the fact that HTML 5 is not as feature-rich as JavaFX, Flash or Silverlight.\
    \ JavaFX, Flash and Silverlight applications require plug-ins to run in a browser\
    \ and browsers do not necessarily ship with these plug-ins so JavaFX applet users,\
    \ for example, may have to install a Java browser plug-in before being able to\
    \ run a JavaFX applet. Installing a plug-in may or may not discourage people from\
    \ liking JavaFX applets. You can judge yourself whether it is easy enough to install\
    \ the plug-in by reading the instructions on this web page.\n\n```\nhttp://java.com/en/download/help/enable_browser.xml\
    \ \n```\n\n### Setting up\n\nJavaFX started as an independent technology that\
    \ had to be downloaded separately from the JDK. Starting from `JDK 1.7 update\
    \ 6` (`JDK7u6`), however, the JDK ships with the latest version of JavaFX. `JDK\
    \ 1.7` includes `JavaFX 2.2` and `Java 8` comes with `JavaFX 8`, the release after\
    \ version `2.2`.\n\nAt the time of writing, the easiest way to develop JavaFX\
    \ applications is by using `NetBeans 8` or later. Simply click `File` → `New Project`\
    \ → `JavaFX` to create a new JavaFX project.\n\nIf you are not using NetBeans,\
    \ you need to include the `jfxrt.jar` file in your class path when compiling and\
    \ running your application. In `JDK 1.8`, the file is located in `$JAVA_HOME/jre/lib/ext/`\
    \ where `$JAVA_HOME` is the installation directory of your JDK. In `JDK 1.7 update\
    \ 6` and later, the file can be found in `$JAVA_HOME/jre/lib/`.\n\nIf you’re using\
    \ Eclipse, right-click the project icon and click on `Properties`. On the left\
    \ hand side of the window that appears, click `Java Build Path`, then select the\
    \ `Libraries` tab on the right. Next, click the `Add External JARs` button and\
    \ navigate to the location of the jar file and select it.\n\nThere is an Eclipse\
    \ plug-in called `e(fx)clipse` that you can add to `Eclipse 4.4` and later to\
    \ help you develop JavaFX applications. The instruction can be found here.\n\n\
    ```\nhttp://www.eclipse.org/efxclipse/install.html\n```\n\nYou can also compile\
    \ and run a JavaFX application from outside an IDE. To compile a JavaFX class\
    \ named `MyFXApp` in package `mypackage` using the `javac` program on the command\
    \ line, go to the source directory of your project and type\n\n```\njavac -cp\
    \ ${JAVA_HOME}/jre/lib/ext/jfxrt.jar mypackage/MyFXApp.java\n```\n\nreplacing\
    \ `${JAVA_HOME}` with the path to Java installation. For example, if your Java\
    \ installation is in `/opt/jdk1.8.0_25`, use this command.\n\n```\njavac -cp /opt/jdk1.8.0_25/jre/lib/ext/jfxrt.jar\
    \ mypackage/MyFXApp.java\n```\n\nTo run the application (on Linux and Mac OS X),\
    \ include the current directory in the class path:\n\n```\njava -cp /opt/jdk1.8.0_25/jre/lib/ext/jfxrt.jar:.\
    \ mypackage.MyFXApp \n```\n\nOn Windows, replace the colon with a semicolon.\n\
    \n```\njava -cp /opt/jdk1.8.0_25/jre/lib/ext/jfxrt.jar;. mypackage.MyFXApp\n```\n\
    \n### Your First JavaFX Application\n\nThis section shows how easy it is to develop\
    \ a JavaFX application. The example consists of only one class, which is called\
    \ `FirstApp` and shown in Listing 6.1.\n\n#### Listing 6.1: The `FirstApp` class\n\
    \n```\npackage app06; \nimport javafx.application.Application; \nimport javafx.scene.Scene;\
    \ \nimport javafx.scene.control.Label; \nimport javafx.scene.layout.StackPane;\n\
    import javafx.stage.Stage; \n\npublic class FirstApp extends Application { \n\n\
    \    @Override \n    public void start(Stage stage) { \n        Label label =\
    \ new Label(\"Welcome\"); \n        StackPane root = new StackPane(); \n     \
    \   root.getChildren().add(label); \n\n        Scene scene = new Scene(root, 400,\
    \ 100);\n\n        stage.setTitle(\"First FX\"); \n        stage.setScene(scene);\
    \ \n        stage.show(); \n    } \n\n    public static void main(String[] args)\
    \ { \n        launch(args); \n    } \n}\n```\n\nRun it just as you would any Java\
    \ application and you’ll see a window like the one in Figure 6.1.\n\n![](Images/0601.png)\n\
    \nFigure 6.1: A simple JavaFX application (on Ubuntu)\n\nThe JavaFX API is explained\
    \ in the next section.\n\n### Application, Stage, and Scene\n\nThe JavaFX API\
    \ takes the form of the types in the `javafx` package and its subpackages. One\
    \ of its most important types is the `javafx.application.Application` class, which\
    \ represents a JavaFX application. A JavaFX application consists of one or more\
    \ windows and other resources.\n\nIn JavaFX a window is represented by the `javafx.stage.Window`\
    \ class, which has two subclasses, `Stage` and `PopupWindow`. A `Stage` (an instance\
    \ of `javafx.stage.Stage`) is a top-level container to which you add a. A `Stage`\
    \ ( created by ` ` ` ` ` ` ` ` `...............................................................................\
    \ the types is the `javafx.application.Application` class, which represents.......................................\n\
    Now let’s take a look at the three main classes, Application, Stage and Scene.\
    \ Details on other JavaFX types can be viewed here.\n\n```\nhttp://docs.oracle.com/javase/8/javafx/api/toc\n\
    ```\n\n#### Application\n\nYou extend the `Application` class to create a JavaFX\
    \ application. To run it as a stand-alone program, you call one of its launch\
    \ methods.\n\n```\npublic static void launch(java.String... args)\npublic static\
    \ void launch(Class<? extends Application> appClass, java.String... args)\n```\n\
    \nAny parameter you pass to the launch methods can be retrieved from inside Application\
    \ using the `getParameters` method.\n\n```\npublic final Application.Parameters\
    \ getParameters()\n```\n\n has the following life-cycle methods that will be called\
    \ when an instance is launched.\n\n```\npublic void init() throws java.Exception\n\
    ```\n\nThis method is called after the application is constructed. It should be\
    \ overridden if the application needs to perform initialization.\n\n```\npublic\
    \ abstract void start(Stage stage) throws java.Exception\n```\n\nThis method is\
    \ called after `init()` returns and you should construct your UI in this method.\
    \ The JavaFX runtime creates a `Stage` object that is passed as a method argument.\n\
    \n```\npublic void stop() throws java.Exception\n```\n\nThis method is called\
    \ when the application should stop. You should release any held resources here.\n\
    \nOf the life-cycle methods, only `start` must be overridden.\n\n#### Stage\n\n\
    The `Stage` class represents a top-level container for your UI components. An\
    \ instance is created and passed to you when the application’s `start` method\
    \ is called. The Stage that the application created is the primary window of the\
    \ application. You can create your own Stage if necessary.\n\nA `Stage`, just\
    \ like any other UI window, can have a title that you can populate using the `Stage`\
    \ class’s title property. On top of that, you can add a `Scene` to a `Stage` by\
    \ calling the `setScene` method on the `Stage`. Then, to show a `Stage` you call\
    \ its `show` method.\n\n#### Scene\n\nA `Scene` is a container that can be added\
    \ to a `Stage`. A `Scene` must contain a parent node that is the root of all components\
    \ added to the Scene. A parent node is represented by the `javafx.scene.Parent`\
    \ class. The simplest constructor in Scene takes one argument, an instance of\
    \ `Parent`.\n\n```\npublic Scene(Parent root) own```\n\nThere are other constructors\
    \ that let you specify the deimension of the `Scene` as well as its fill.\n\n\
    ```\npublic Scene(Parent root, double width, double height)\npublic Scene(Parent\
    \ root, javafx.scene.paint.Paint fill)\npublic Scene(Parent root, double width,\
    \ double height, javafx.scene.paint.Paint fill)\n```\n\nUI Components\n"
