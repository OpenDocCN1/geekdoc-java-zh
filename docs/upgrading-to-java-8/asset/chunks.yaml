  trans: "\n\n# 表 1.1: 核心函数接口\n\n## Function, BiFunction 及其他变体\n\n`Function` 接口用于创建一个接受一个参数并返回结果的函数。它是一个泛型类型，其定义如下：\n\
    \n```\n public interface Function<T, R>\n```\n\n在这里，`T` 代表参数的类型，`R` 代表结果的类型。\n\
    \n`Function` 有一个抽象方法 `apply`，其签名如下：\n\n```\n R apply(T argument)\n```\n\n当你在使用\
    \ `Function` 时，需要重写这个方法。例如，代码列表 1.2 中的类定义了一个将英里转换为公里的 `Function`。该 `Function`\
    \ 接受一个 `Integer` 作为参数，并返回一个 `Double`。\n\n### 代码列表 1.2：`FunctionDemo1` 类\n\n```\n\
    \ package app01.function;\nimport java.util.function.Function;\n\npublic class\
    \ FunctionDemo1 {\n    public static void main(String[] args) {\n        Function<Integer,\
    \ Double> milesToKms = \n                (input) -> 1.6 * input;\n        int\
    \ miles = 3;\n        double kms = milesToKms.apply(miles);\n        System.out.printf(\"\
    %d miles = %3.2f kilometers\\n\", \n                miles, kms);\n    }\n}\n```\n\
    \n如果你运行 `FunctionDemo1` 类，你将在控制台上看到以下内容：\n\n```\n 3 miles = 4.80 kilometers\n\
    ```\n\n`Function` 的变体 `BiFunction` 接受两个参数并返回一个结果。代码列表 1.3 展示了 `BiFunction` 的示例。它使用\
    \ `BiFunction` 创建了一个根据宽度和长度计算面积的函数。通过调用其 `apply` 方法来执行该函数。\n\n### 代码列表 1.3：`BiFunctionDemo1`\
    \ 类\n\n```\n package app01.function;\nimport java.util.function.BiFunction;\n\n\
    public class BiFunctionDemo1 {\n    public static void main(String[] args) {\n\
    \        BiFunction<Float, Float, Float> area =\n                (width, length)\
    \ -> width * length;\n        float width = 7.0F;\n        float length = 10.0F;\n\
    \        float result = area.apply(width, length);\n        System.out.println(result);\n\
    \    }\n}\n```\n\n运行 `BiFunctionDemo1` 类会在控制台上打印此内容：\n\n```\n 70.0\n```\n\n除了\
    \ `BiFunction` 之外，还有是 `Function` 的特化变体。例如，`IntFunction` 接口始终接受一个 `Integer`，并且对于结果类型只需要一个泛型类型。它的\
    \ `apply` 方法返回一个 `int`。\n\n```\n R apply(int input)\n```\n\n`LongFunction` 和 `DoubleFunction`\
    \ 接口与 `IntFunction` 类似，但它们分别接受 `long` 和 `double` 作为参数。\n\n此外，还有一些变体完全不需要泛型参数，因为它们是为特定的参数类型和特定的返回类型设计的。例如，`IntToDoubleFunction`\
    \ 接口可以创建一个接受 `int` 并返回 `double` 的函数。该接口提供的不是 `apply` 方法，而是 `applyAsDouble` 方法。代码列表\
    \ 1.4 给出了 `IntToDoubleFunction` 接口的示例。它是一个将摄氏度转换为华氏度的转换函数。\n\n### 代码列表 1.4：`IntToDoubleFunctionDemo1`\
    \ 类\n\n```\n package app01.function;\nimport java.util.function.IntToDoubleFunction;\n\
    \npublic class IntToDoubleFunctionDemo1 {\n    public static void main(String[]\
    \ args) {\n        IntToDoubleFunction celciusToFahrenheit = \n              \
    \  (input) -> 1.8 * input + 32;\n        int celcius = 100;\n        double fahrenheit\
    \ = \n                celciusToFahrenheit.applyAsDouble(celcius);\n        System.out.println(celcius\
    \ + \"\\u2103\" + \" = \" \n                + fahrenheit + \"\\u2109\\n\");\n\
    \    }\n}\n```\n\n这是 `IntToDoubleFunctionDemo1` 的输出：\n\n```\n 100° = 212.0°\n\
    ```\n\n与 `IntToDoubleFunction` 类似的还有 `LongToDoubleFunction` 和 `LongToIntFunction`。我相信你能从它们的名字看出它们的作用。\n\
    \n`UnaryOperator` 接口是 `Function` 的另一个特化版本，其操作数类型与返回类型相同。其声明如下：\n\n```\n public\
    \ interfaceUnaryOperator<T> extends Function<T,T>\n```\n\n`BinaryOperator` 是 `BiFunction`\
    \ 的特化版本。`BinaryOperator` 表示一个有两个相同类型操作数的操作，并返回一个与操作数类型相同的结果。\n\n## Predicate\n\
    \n`Predicate` 是接受参数并根据参数值返回 true 或 false 的函数。它有一个名为 `test` 的抽象方法。\n\n例如，代码列表 1.5\
    \ 中的 `PredicateDemo1` 类定义了一个 `Predicate`，用于评估字符串输入，如果字符串中的每个字符都是数字，则返回 true。\n\
    \n### 代码列表 1.5：`PredicateDemo1` 类\n\n```\n package app01.function;\nimport java.util.function.Predicate;\n\
    \npublic class PredicateDemo1 {\n    public static void main(String[] args) {\n\
    \        Predicate<String> numbersOnly = (input) -> {\n            for (int i\
    \ = 0; i < input.length(); i++) {\n                char c = input.charAt(i);\n\
    \                if (\"0123456789\".indexOf(c) == -1) {\n                    return\
    \ false;\n                }\n            }\n            return true;\n       \
    \ };\n\n        System.out.println(numbersOnly.test(\"12345\")); // true\n   \
    \     System.out.println(numbersOnly.test(\"100a\")); // false\n    }\n}\n```\n\
    \n## Supplier\n\n`Supplier` 不接受参数并返回一个值。实现类必须重写其抽象方法 `get`。\n\n代码列表 1.6 展示了 `Supplier`\
    \ 的示例。它定义了一个返回随机数字的 `Supplier`，并使用循环打印五个数。\n\n### 代码列表 1.6：`SupplierDemo1` 类\n\
    \n```\n package app01.function;\nimport java.util.Random;\nimport java.util.function.Supplier;\n\
    \npublic class SupplierDemo1 {\n    public static void main(String[] args) {\n\
    \        Supplier<Integer> oneDigitRandom = () -> {\n            Random random\
    \ = new Random();\n            return random.nextInt(10);\n        };\n      \
    \  for (int i = 0; i < 5; i++) {\n            System.out.println(oneDigitRandom.get());\n\
    \        }\n    }\n}\n```\n\n`Supplier` 还有特化变体，如 `DoubleSupplier`（返回 Double）、`IntSupplier`\
    \ 和 `LongSupplier`。\n\n## Consumer\n\n`Consumer` 是一个不返回结果的操作。它有一个名为 `accept` 的抽象方法。\n\
    \n代码列表 1.7 展示了一个 `Consumer` 的示例，它接受一个字符串并将其居中打印。\n\n### 代码列表 1.7：Consumer 示例\n\
    \n```\n package app01.function;\nimport java.util.function.Consumer;\nimport java.util.function.Function;\n\
    \npublic class ConsumerDemo1 {\n    public static void main(String[] args) {\n\
    \        Function<Integer, String> spacer = (count) -> {\n            StringBuilder\
    \ sb = new StringBuilder(count);\n            for (int i = 0; i < count; i++)\
    \ {\n                sb.append(\" \");\n            }\n            return sb.toString();\n\
    \        };\n\n        int lineLength = 60; // characters\n        Consumer<String>\
    \ printCentered = \n                (input) -> {\n                    int length\
    \ = input.length();\n                    String spaces = spacer.apply(\n     \
    \                       (lineLength - length) / 2);\n                    System.out.println(spaces\
    \ + input);\n                };\n\n        printCentered.accept(\"A lambda expression\
    \ a day\");\n        printCentered.accept(\"makes you\");\n        printCentered.accept(\"\
    look smarter\");\n    }\n}\n```\n\n代码列表 1.7 中的示例包含一个 `Consumer`，它接受一个字符串并在前面添加特定数量的空格后打印。`Consumer`\
    \ 的 `accept` 方法实现由这个 Lambda 表达式提供：\n\n```\n (input) -> {\n                   \
    \ int length = input.length();\n                    String spaces = spacer.apply(\n\
    \                            (lineLength - length) / 2);\n                   \
    \ System.out.println(spaces + input);\n                }\n```\n\n"
- fmt: "\n```\n Function<Integer, String> spacer = (count) -> {\n            StringBuilder\
    \ sb = new StringBuilder(count);\n            for (int i = 0; i < count; i++)\
    \ {\n                sb.append(\" \");\n            }\n            return sb.toString();\n\
    \        };\n```\n\nThe function employs a for loop that appends a space to a\
    \ `StringBuilder` `count` number of times, where `count` is the parameter to the\
    \ function. When the loop exits, it returns the `String` representation of the\
    \ `StringBuilder`.\n\nIf you run the `ConsumerDemo1` class, you will see this\
    \ on your console.\n\n```\n A lambda expression a day\n                      \
    \   makes you\n                        look smarter\n```\n\n# Summary\n\nA new\
    \ feature in Java 8, lambda expressions can make certain constructs shorter and\
    \ readable, especially when you are dealing with inner classes. This chapter discussed\
    \ lambda expressions, functional interfaces, the pre-defined functional interfaces\
    \ and method references.\n\n# Chapter 2\n\n## Method References\n\nIn Chapter\
    \ 1 you learned about the lambda expression. This chapter discusses the method\
    \ reference, a subfeature of the lambda expression that can make writing lambda\
    \ expressions even easier.\n\n## Overview\n\nA lot of Java methods take a functional\
    \ interface as an argument. For instance, one of the `sort` methods in `java.util.Arrays`\
    \ accepts an instance of `Comparator`, which is a functional interface. The signature\
    \ of the `sort` method is as follows.\n\n```\n public static T[] sort(T[] array,\
    \ Comparator<? super T> comparator)\n```\n\nInstead of passing an implementation\
    \ of `Comparator` to the `sort` method, you can pass a lambda expression. You\
    \ have seen how to do this in the previous chapter.\n\nNow, you can go one step\
    \ further by passing a method reference in lieu of a lambda expression. A method\
    \ reference is simply a class name or an object reference followed by the double\
    \ colon operator (`::`) and a method name.\n\nWhy would you want to use a method\
    \ reference? There are two reasons for this:\n\n1. A method reference has shorter\
    \ syntax than a lambda expression because a method reference does not contain\
    \ a definition like a lambda expression. The method body is defined somewhere\
    \ else.\n2. You can use an existing method, thus promoting code reuse.\n\nYou\
    \ can use a reference to a static method, an instance method or even a constructor.\
    \ You use the double colon (`::`), a new operator in Java 8, to separate the class\
    \ name/object reference and the method/constructor name. The class that encapsulates\
    \ the referenced method does not have to implement the functional interface.\n\
    \nThe syntax for method references is one of the following.\n\n```\n ClassName::staticMethodName\n\
    ContainingType::instanceMethod\nobjectReference::methodName\nClassName::new\n\
    ```\n\nEach of the kinds of method references are discussed in the following sections.\n\
    \n### Reference to A Static Method\n\nA reference to a static method can be passed\
    \ as an argument to a method that expects a functional interface if the method\
    \ has a compatible return type and compatible argument types with the functional\
    \ interface’s abstract method.\n\nAs the first example in this topic, consider\
    \ the `NoMethodRef` class in Listing 2.1, which illustrates the use of a functional\
    \ interface without method references. The class defines a functional interface\
    \ called `StringListFormatter` that takes a `List` of `Strings` and formats the\
    \ strings. The `format` method, the abstract method of the interface, takes a\
    \ delimiter and a `List` of `Strings`. There is also a `formatAndPrint` static\
    \ method that takes an instance of `StringListFormatter`, a delimiter and a `List`\
    \ of `Strings`. This method in turn calls the `format` method on the `StringListFormatter`\
    \ and prints the formatted list.\n\nListing 2.1: The NoMethodRef class\n\n```\n\
    \ package app02.methodref;\nimport java.util.Arrays;\nimport java.util.List;\n\
    \npublic class NoMethodRef {\n\n    @FunctionalInterface\n    interface StringListFormatter\
    \ {\n        String format(String delimiter, List<String> list);\n    }\n\n  \
    \  public static void formatAndPrint(StringListFormatter formatter, \n       \
    \     String delimiter, List<String> list) {\n        String formatted = formatter.format(delimiter,\
    \ list);\n        System.out.println(formatted);\n    }\n\n    public static void\
    \ main(String[] args) {\n        List<String> names = Arrays.asList(\"Don\", \"\
    King\", \"Kong\");\n\n        StringListFormatter formatter =\n              \
    \  (delimiter, list) -> {\n                    StringBuilder sb = new StringBuilder(100);\n\
    \                    int size = list.size();\n                    for (int i =\
    \ 0; i < size; i++) {\n                        sb.append(list.get(i));\n     \
    \                   if (i < size - 1) {\n                            sb.append(delimiter);\n\
    \                        }\n                    }\n                    return\
    \ sb.toString();\n                };\n        formatAndPrint(formatter, \", \"\
    , names);\n    }\n}\n```\n\nThe main method in `NoMethodRef` constructs a string\
    \ list with three elements and creates an implementation of `StringListFormatter`\
    \ with this lambda expression.\n\n```\n StringListFormatter formatter =\n    \
    \            (delimiter, list) -> {\n                    StringBuilder sb = new\
    \ StringBuilder(100);\n                    int size = list.size();\n         \
    \           for (int i = 0; i < size; i++) {\n                        sb.append(list.get(i));\n\
    \                        if (i < size - 1) {\n                            sb.append(delimiter);\n\
    \                        }\n                    }\n                    return\
    \ sb.toString();\n                };\n```\n\nBasically, it iterates over the `List`\
    \ and adds a delimiter between two elements. No delimiter is appended after the\
    \ last element.\n\nThe main method then calls the `formatAndPrint` method passing\
    \ the lambda expression, a delimiter and the string list. If you run `NoMethodRef`,\
    \ you will see the formatted list:\n\n```\n Don, King, Kong\n```\n\nAfter spending\
    \ twenty minutes writing the code, you realized that the lambda expression does\
    \ the same job as the `join` method of the `String` class. This is a static method\
    \ added to `String` in 1.8. One of its overrides has the following signature.\n\
    \n```\n public static String join(CharSequence delimiter,\n        Iterable extends\
    \ CharSequence> elements)\n```\n\nCompare it with the `format` method in the functional\
    \ interface in Listing 2.1.\n\n```\n public String format(java.lang delimiter,\
    \ \n        java.util.List<String> list);\n```\n\nSince `List` extends `Iterable`\
    \ and `String` implements `CharSequence`, `join` is compatible with `format`.\n\
    \nA method reference allows you to reuse an existing implementation such as `String.join()`.\
    \ As such, you can rewrite the `NoMethodRef` class to use a reference to `String.join()`.\
    \ This is illustrated in the `MethodReferenceDemo1` class in Listing 2.2.\n\n\
    Listing 2.2: The MethodReferenceDemo1 class\n\n```\n package app02.methodref;\n\
    import java.util.Arrays;\nimport java.util.List;\n\npublic class MethodReferenceDemo1\
    \ {\n\n    @FunctionalInterface\n    interface StringListFormatter {\n       \
    \ String format(String delimiter, List<String> list);\n    }\n\n    public static\
    \ void formatAndPrint(StringListFormatter formatter, \n            String delimiter,\
    \ List<String> list) {\n        String formatted = formatter.format(delimiter,\
    \ list);\n        System.out.println(formatted);\n    }\n\n    public static void\
    \ main(String[] args) {\n        List<String> names = Arrays.asList(\"Don\", \"\
    King\", \"Kong\");\n        formatAndPrint(String::join, \", \", names);\n   \
    \ }\n}\n```\n\nYou still have the same `StringListFormatter` interface and the\
    \ same `formatAndPrint` method. However, the main method no longer contains a\
    \ lambda expression implementing `StringListFormatter`. Instead, you use `String::join`\
    \ as an implementation of `StringListFormatter`.\n\n```\n formatAndPrint(String::join,\
    \ \", \", names);\n```\n"
