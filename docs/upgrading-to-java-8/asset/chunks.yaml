    OK\"); \n        okButton.setDefaultButton(true); \n\n        Button cancelButton\
    \ = new Button(\"Cancel\"); \n        HBox hBox = new HBox(); \n        hBox.setPadding(new\
    \ Insets(15, 12, 15, 12)); \n        hBox.setSpacing(10); \n        hBox.setStyle(\"\
    -fx-background-color: #886699;\"); \n        hBox.getChildren().addAll(okButton,\
    \ cancelButton); \n        BorderPane root = new BorderPane(); \n        root.setTop(hBox);\
    \ \n\n        ImageView imageView = new ImageView(\"image/1.jpg\"); \n       \
    \ root.setCenter(imageView); \n\n        VBox vBox = new VBox(); \n        vBox.setStyle(\"\
    -fx-background-color: \" + \n        \t\t\"#ddeeff;-fx-padding:10px\"); \n   \
    \     vBox.getChildren().addAll( \n                new Label(\"Select Color:\"\
    ), \n                new ColorPicker()); \n        root.setLeft(vBox); \n\n  \
    \      root.setStyle(\"-fx-background-color: #6680e6;\"); \n        Scene scene\
    \ = new Scene(root, 740, 530); \n\n        stage.setTitle(\"HBox, VBox, BorderPane\
    \ Demo\"); \n        stage.setScene(scene); \n        stage.show(); \n    } \n\
    \n    public static void main(String[] args) { \n        launch(args); \n    }\
    \ \n}\n```\n\nThe UI construction part of the BorderPaneDemo class can be replaced\
    \ with the markup in the example1.fxml file shown in Listing 7.2.\n\nListing 7.2:\
    \ The example1.fxml file\n\n```\n <?xml version=\"1.0\" encoding=\"UTF-8\"?> \n\
    <?import javafx.scene.*?> \n<?import javafx.scene.control.*?> \n<?import javafx.scene.layout.*?>\
    \ \n<?import javafx.geometry.Insets?> \n<?import javafx.scene.image.Image?> \n\
    <?import javafx.scene.image.ImageView?> \n\n<BorderPane> \n    <top> \n      \
    \  <HBox spacing=\"10.0\" style=\"-fx-background-color:#886699;\"> \n        \
    \    <padding> \n                <Insets top=\"15\" bottom=\"15\" left=\"12\"\
    \ right=\"12\"/>     \n            </padding> \n            <Button id=\"okButton\"\
    \ text=\"OK\" defaultButton=\"true\"/> \n            <Button text=\"Cancel\"/>\
    \ \n        </HBox> \n    </top> \n    <left> \n        <VBox style=\"-fx-background-color:#ddeeff;-fx-padding:10px\"\
    > \n            <Label text=\"Select Color:\"/> \n            <ColorPicker />\
    \ \n        </VBox> \n    </left> \n    <center> \n        <ImageView> \n    \
    \        <Image url=\"/image/1.jpg\"></Image> \n        </ImageView> \n    </center>\
    \ \n</BorderPane> \n```\n\nThe main Java class, called Example1, is given in Listing\
    \ 7.3\\. It extends Application and provides an implementation of the start method.\n\
    \nListing 7.3: The Example1 class\n\n```\n package app07;\nimport javafx.application.Application;\
    \ \nimport javafx.fxml.FXMLLoader; \nimport javafx.scene.Parent; \nimport javafx.scene.Scene;\
    \ \nimport javafx.stage.Stage; \n\npublic class Example1 extends Application {\
    \ \n\n    @Override \n    public void start(Stage stage) throws Exception {\n\
    \        // Example1.fxml must be located in the same directory\n        // as\
    \ Example1.class\n        Parent root = FXMLLoader.load(\n                getClass().getResource(\"\
    example1.fxml\")); \n        root.setStyle(\"-fx-background-color: #6680e6;\"\
    ); \n        Scene scene = new Scene(root, 740, 530); \n        stage.setTitle(\"\
    JavaFX with FXML (Example 1)\"); \n        stage.setScene(scene); \n        stage.show();\
    \ \n    } \n\n    public static void main(String[] args) { \n        launch(args);\
    \ \n    } \n}\n```\n\nThe start method uses FXMLLoader to load the FXML document\
    \ and return a Parent object that contains the components declared in the document.\
    \ The method then creates a Scene and passes the Scene to the Stage before calling\
    \ the show method on the Stage.\n\nFigure 7.1 shows the result of running the\
    \ application.\n\n![](Images/0701.png)\n\nFigure 7.1: Using FXML\n\nEvent Handling\
    \ with FXML\n\nFXML is a powerful language. Among its features is the ability\
    \ to bind a UI component with an event-processing method (event handler) in a\
    \ controller, so that the method will be called when the event occurs. A controller\
    \ is a Java class that implements javafx.fxml.Initializable. To take advantage\
    \ of this feature, you must use the fx:controller attribute in your root element,\
    \ like this.\n\n```\n <Group fx:controller=\"app7.Example2Controller\" \n```\n\
    \nRecall that fx is a special prefix in FXML.\n\nTo bind a component to an event\
    \ handler, use the relevant onXXX attribute of the element. For example, to bind\
    \ the ActionEvent with a method called handleAction in the controller, write this.\n\
    \n```\n onAction=\"#handleAction\"\n```\n\nFor example, consider the following\
    \ application that features a Login form that takes a user name and password.\
    \ The primary stage of the application is shown in Figure 7.2.\n\n![](Images/0702.png)\n\
    \nFigure 7.2: The Login form in Example 2"
