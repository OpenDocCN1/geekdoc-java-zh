  trans: "\n\n```\n Function<Integer, String> spacer = (count) -> {\n            StringBuilder\
    \ sb = new StringBuilder(count);\n            for (int i = 0; i < count; i++)\
    \ {\n                sb.append(\" \");\n            }\n            return sb.toString();\n\
    \        };\n```\n\n该函数使用一个 `for` 循环，向 `StringBuilder` 中添加 `count` 次空格，其中 `count`\
    \ 是函数的参数。当循环退出时，它返回 `StringBuilder` 的 `String` 表示形式。\n\n如果你运行 `ConsumerDemo1`\
    \ 类，你将在控制台上看到以下内容：\n\n```\n A lambda expression a day\n                      \
    \   makes you\n                        look smarter\n```\n\n# 总结\n\nLambda 表达式是\
    \ Java 8 的新特性，它可以使某些结构变得更短且易于读，特别是当你处理内部类时。本章讨论了 lambda 表达式、函数式接口、预定义的函数接口以及方法引用。\n\
    \n# 第 2 章\n\n## 方法引用\n\n在第 1 章中，你学习了 lambda 表达式。本章将讨论方法引用，这是 lambda 表达式的一个子功能，可以使编写\
    \ lambda 表达式变得更加简单。\n\n## 概述\n\n许多 Java 方法接受函数式接口作为参数。例如，`java.util.Arrays` 中的\
    \ `sort` 方法之一接受 `Comparator` 实例，而 `Comparator` 就是一个函数式接口。`sort` 方法的签名如下：\n\n```\n\
    \ public static T[] sort(T[] array, Comparator<? super T> comparator)\n```\n\n\
    与其向 `sort` 方法传递 `Comparator` 的实现，不如传递一个 lambda 表达式。你在上一节已经看到过如何这样做。\n\n现在，你可以更进一步，通过传递方法引用来代替\
    \ lambda 表达式。方法引用简单就是类名或对象引用后跟着双冒号运算符（`::`）和方法名。\n\n你为什么想要使用方法引用？有两个原因：\n\n1.\
    \ 方法引用的语法比 lambda 表达式更短，因为方法引用不包含像 lambda 表达式那样的定义。方法体定义在其他地方。\n2. 你可以使用现有的方法，从而促进代码复用。\n\
    \n你可以使用静态方法、实例方法甚至构造函数的引用。你使用双冒号（`::`，这是 Java 8 中的一个新运算符）来分隔类名/对象引用与方法/构造函数名。封装所引用方法的类不需要实现该函数式接口。\n\
    \n方法引用的语法是以下之一：\n\n```\n ClassName::staticMethodName\nContainingType::instanceMethod\n\
    objectReference::methodName\nClassName::new\n```\n\n接下来的章节将分别讨论每种类型的方法引用。\n\n\
    ### 静态方法的引用\n\n如果静态方法与函数式接口的抽象方法具有兼容的返回类型和参数参数类型，那么静态方法的引用可以作为参数传递给期望函数式接口的方法。\n\
    \n作为此主题的第一个示例，考虑列表 2.1 中的 `NoMethodRef` 类，它说明了在没有方法引用的情况下使用函数式接口。该类定义了一个名为 `StringListFormatter`\
    \ 的函数式接口，它接收一个 `String` 列表并对字符串进行格式化。`format` 方法是接口的抽象方法，接受一个分隔符和一个 `String` 列表。还有一个\
    \ `formatAndPrint` 静态方法，它接收 `StringListFormatter` 实例、一个分隔符和一个 `String` 列表。该方法反过来调用\
    \ `StringListFormatter` 的 `format` 方法并打印格式化后的列表。\n\n列表 2.1：NoMethodRef 类\n\n```\n\
    \ package app02.methodref;\nimport java.util.Arrays;\nimport java.util.List;\n\
    \npublic class NoMethodRef {\n\n    @FunctionalInterface\n    interface StringListFormatter\
    \ {\n        String format(String delimiter, List<String> list);\n    }\n\n  \
    \  public static void formatAndPrint(StringListFormatter formatter, \n       \
    \     String delimiter, List<String> list) {\n        String formatted = formatter.format(delimiter,\
    \ list);\n        System.out.println(formatted);\n    }\n\n    public static void\
    \ main(String[] args) {\n        List<String> names = Arrays.asList(\"Don\", \"\
    King\", \"Kong\");\n\n        StringListFormatter formatter =\n              \
    \  (delimiter, list) -> {\n                    StringBuilder sb = new StringBuilder(100);\n\
    \                    int size = list.size();\n                    for (int i =\
    \ 0; i < size; i++) {\n                        sb.append(list.get(i));\n     \
    \                   if (i < size - 1) {\n                            sb.append(delimiter);\n\
    \                        }\n                    }\n                    return\
    \ sb.toString();\n                };\n        formatAndPrint(formatter, \", \"\
    , names);\n    }\n}\n```\n\n`NoMethodRef` 中的 `main` 方法构建了一个包含三个元素的字符串列表，并使用此 lambda\
    \ 表达式创建了 `StringListFormatter` 的实现。\n\n```\n StringListFormatter formatter =\n\
    \                (delimiter, list) -> {\n                    StringBuilder sb\
    \ = new StringBuilder(100);\n                    int size = list.size();\n   \
    \                 for (int i = 0; i < size; i++) {\n                        sb.append(list.get(i));\n\
    \                        if (i < size - 1) {\n                            sb.append(delimiter);\n\
    \                        }\n                    }\n                    return\
    \ sb.toString();\n                };\n```\n\n基本上，它遍历 `List` 并在两个元素之间添加分隔符。最后一个元素后不会添加分隔符。\n\
    \n然后 `main` 方法调用 `formatAndPrint` 方法，传递 lambda 表达式、分隔符和字符串列表。如果你运行 `NoMethodRef`，你将看到格式化后的列表：\n\
    \n```\n Don, King, Kong\n```\n\n在花费二分钟编写代码后，你发现该 lambda 表达式与 `String` 类的 `join`\
    \ 方法的功能相同。这是 Java 8 添加到 `String` 类中的静态方法。其一个签名如下：\n\n```\n public static String\
    \ join(CharSequence delimiter,\n        Iterable extends CharSequence> elements)\n\
    ```\n\n将其与列表 2.1 中函数式接口的 `format` 方法进行对比：\n\n```\n public String format(java.lang\
    \ delimiter, \n        java.util.List<String> list);\n```\n\n由于 `List` 实现了 `Iterable`\
    \ 且 `String` 实现了 `CharSequence`，`join` 与 `format` 。\n\n方法引用允许你复用现有实现，例如 `String.join()`。因此，你可以重写\
    \ `NoMethodRef` 类以使用 `String.join()` 的引用。这在列表 2.2 的 `MethodReferenceDemo1` 类所示。\n\
    \n列表 2.2：MethodReferenceDemo1 类\n\n```\n package app02.methodref;\nimport java.util.Arrays;\n\
    import java.util.List;\n\npublic class MethodReferenceDemo1 {\n\n    @FunctionalInterface\n\
    \    interface StringListFormatter {\n        String format(String delimiter,\
    \ List<String> list);\n    }\n\n    public static void formatAndPrint(StringListFormatter\
    \ formatter, \n            String delimiter, List<String> list) {\n        String\
    \ formatted = formatter.format(delimiter, list);\n        System.out.println(formatted);\n\
    \    }\n\n    public static void main(String[] args) {\n        List<String> names\
    \ = Arrays.asList(\"Don\", \"King\", \"Kong\");\n        formatAndPrint(String::join,\
    \ \", \", names);\n    }\n}\n```\n\n你仍然拥有相同的 `StringListFormatter` 接口和相同的 `formatAndPrint`\
    \ 方法。然而，`main` 方法不再包含实现 `StringListFormatter` 的 lambda 表达式。相反，你使用 `String::join`\
    \ 作为 `StringListFormatter` 的实现。\n\n```\n formatAndPrint(String::join, \", \",\
    \ names);\n```\n\n"
- fmt: "\nAs a side note, note that the abstract method in `StringListFormatter` takes\
    \ two parameters and returns a value. This is a good candidate for a `BiFunction`.\
    \ The `WithBiFunction` class in Listing 2.3 is a rewrite of the `MethodReferenceDemo1`\
    \ class that eliminates the `StringListFormatter` interface entirely. The `formatAndPrint`\
    \ method has also been modified to accept a `BiFunction` as its first parameter.\n\
    \n### Listing 2.3: The `WithBiFunction` class\n\n```java\n package app02.methodref;\n\
    import java.util.Arrays;\nimport java.util.List;\nimport java.util.function.BiFunction;\n\
    \npublic class WithBiFunction {\n\n    public static void formatAndPrint(\n  \
    \          BiFunction<String, List<String>, String> formatter, \n            String\
    \ delimiter, List<String> list) {\n        String formatted = formatter.apply(delimiter,\
    \ list);\n        System.out.println(formatted);\n    }\n\n    public static void\
    \ main(String[] args) {\n        List<String> names = Arrays.asList(\"Don\", \"\
    King\", \"Kong\");\n        formatAndPrint(String::join, \", \", names);\n   \
    \ }\n}\n```\n\n### Reference to An Instance Method where An Object Reference Is\
    \ Available\n\nThe compatibility rule for this kind of method reference is the\
    \ same as the method reference to a static method. The referenced method must\
    \ have a compatible return value and compatible arguments as the abstract method\
    \ of the functional interface the method replaces.\n\nFor example, in JDK 1.8\
    \ the `java.lang.Iterable` interface has a default method named `forEach` that\
    \ accepts a `Consumer`:\n\n```java\n default void forEach(java.util.function.Consumer<?\
    \ super T> action)\n```\n\n`forEach` performs the given action for each element\
    \ of the `Iterable`. Thanks to inheritance, this method is inherited by its subinterface\
    \ `List`, which I will use in the example in Listing 2.4.\n\n### Listing 2.4:\
    \ Referencing an instance method in an object\n\n```java\n package app02.methodref;\n\
    import java.util.Arrays;\nimport java.util.List;\n\npublic class MethodReferenceDemo2\
    \ {\n    public static void main(String[] args) {\n        List<String> fruits\
    \ = Arrays.asList(\"Apple\", \"Banana\");\n        // with lambda expression\n\
    \        fruits.forEach((name) -> System.out.println(name));\n\n        // with\
    \ method reference\n        fruits.forEach(System::out::println);\n    }\n}\n\
    ```\n\nThe `MethodReferencDemo2` class has a list of fruits that needs to be printed.\
    \ You can do this by calling the `forEach` method, passing a `Consumer` in the\
    \ form of a lambda expression like so:\n\n```java\n fruits.forEach((name) -> System.out.println(name));\n\
    ```\n\nAlternatively, since `System.out` is an existing object that the system\
    \ has created for you, you can use a method reference to the `println` method\
    \ on `System.out`.\n\n```java\n fruits.forEach(System.out::println);\n```\n\n\
    ### Reference to An Instance Method where No Object Reference Is Available\n\n\
    Hold on tight. This one is a bit tricky and requires your full concentration.\n\
    \nYou can pass a reference to an instance method as a method argument to replace\
    \ a functional interface. In this case, you do not have to explicitly create an\
    \ instance of the containing class. The syntax for this kind of method reference\
    \ is different from that of the first and second kinds of method references. With\
    \ the first two kinds, the number of arguments must be the same as the number\
    \ of arguments expected by the functional interface’s abstract method. When using\
    \ an instance method without an object reference, the referenced method must have\
    \ one fewer argument than the number of arguments expected by the functional interface’s\
    \ abstract method. Therefore, if the functional interface’s abstract method takes\
    \ four arguments, the referenced instance method must take only three arguments,\
    \ which must be compatible with the second, third and fourth arguments of the\
    \ abstract method. In addition, the first argument of the abstract method must\
    \ be of a type that is compatible as the class containing the instance method.\n\
    \nThe compatibility rule for this kind of method reference is depicted below.\
    \ The first line is a pseudo-signature of the functional interface’s abstract\
    \ method and the second line a pseudo-signature of the referenced instance method.\n\
    \n```\n returnType abstractMethod(type-1, type-2, type-3, type-4)\nreturnType\
    \ instanceMethod(type-2, type-3, type-4)\n```\n\nHere, `type-1` must be compatible\
    \ with the class containing the instance method because the class will be instantiated\
    \ and the instance passed as the first argument to the abstract method, along\
    \ with the other arguments.\n\nThis will become clear after you have seen the\
    \ example for this kind of method reference.\n\n### Listing 2.5: The `MethodReferenceDemo3`\
    \ class\n\n```java\n package app02.methodref;\nimport java.util.Arrays;\n\npublic\
    \ class MethodReferenceDemo3 {\n\n    public static void main(String[] args) {\n\
    \        String[] names = {\"Alexis\", \"anna\", \"Kyleen\"};\n\n        Arrays.sort(names,\
    \ String::compareToIgnoreCase);\n        for (String name : names) {\n       \
    \     System.out.println(name);\n        }\n    }\n}\n```\n\nThe example in Listing\
    \ 2.5 shows how to pass an instance method reference to `Arrays.sort` in lieu\
    \ of a `Comparator`. The `MethodReferenceDemo3` class contains a string array\
    \ with three names where case-sensitivity is not strictly adhered to. If you use\
    \ an override of `Arrays.sort` that only takes one argument to sort this array,\
    \ the names will be sorted as\n\n```\n Alexis, Kyleen, anna\n```\n\nThis is not\
    \ what you really want. So, you need to use `Arrays.sort` that also takes a `Comparator`:\n\
    \n```\n public static <T> void sort(T[] array, Comparator<? super T> c)\n```\n\
    \nThe example shows how you can use an instance method reference `String.compareIgnoreCase`\
    \ to replace a `Comparator` (Recall that `Comparator` is a functional interface).\
    \ Here is the signature of `String.compareToIgnoreCase`.\n\n```java\n public int\
    \ compareToIgnoreCase(String str)\n```\n\nIt has one less argument than the signature\
    \ of `Comparator.compare`.\n\n```\n int compare(String str1, String str2)\n```\n\
    \nThis is perfect for the second kind of method reference.\n\nIf you run the code,\
    \ you will see that the names are sorted correctly. Here is the result.\n\n```\n\
    \ Alexis\nanna\nKyleen\n```\n\n### Reference to A Constructor\n\nThe fourth kind\
    \ of method reference uses a constructor. The syntax for a constructor reference\
    \ is as follows.\n\n```\n ClassName::new\n```\n\nSuppose you need a method to\
    \ convert an `Integer` array to a `Collection` and you need to be able to determine\
    \ whether the resulting collection is a `List` or a `Set`. To this end, you can\
    \ create the `arrayToCollection` method in Listing 2.6.\n\n### Listing 2.6: The\
    \ `MethodReferenceDemo4` class\n\n```java\n package app02.methodref;\nimport java.util.ArrayList;\n\
    import java.util.Collection;\nimport java.util.HashSet;\nimport java.util.function.Supplier;\n\
    \npublic class MethodReferenceDemo4 {\n\n    public static Collection<Integer>\
    \ arrayToCollection(\n            Supplier<Collection<Integer>> supplier, Integer[]\
    \ \n                numbers) {\n        Collection<Integer> collection = supplier.get();\n\
    \        for (int i : numbers) {\n            collection.add(i);\n        }\n\
    \        return collection;\n    }\n\n    public static void main(String[] args)\
    \ {\n        Integer[] array = {1, 8, 5};\n        Collection<Integer> col1 \n\
    \                = arrayToCollection(ArrayList<Integer>::new, array);\n      \
    \  System.out.println(\"Natural order\");\n        col1.forEach(System.out::println);\n\
    \        System.out.println(\"=======================\");\n        System.out.println(\"\
    Ascending order\");\n        Collection<Integer> col2 \n                = arrayToCollection(HashSet<Integer>::new,\
    \ array);\n        col2.forEach(System.out::println);\n    }\n}\n```\n\nInstead\
    \ of passing this lambda expression as the first argument to the method.\n\n```java\n\
    \ () -> new ArrayList<Integer>()\n```\n\nYou can simply pass this reference to\
    \ the `ArrayList` constructor.\n\n```\n ArrayList<Integer>::new\n```\n\nAnd, instead\
    \ of this\n\n```\n () -> new HashSet<Integer>()\n```\n\nyou can write\n\n```\n\
    \ HashSet<Integer>::new\n```\n\nIf you run the example, you will see this on the\
    \ console.\n\n```\n Natural order\n1\n8\n5\n=======================\nAscending\
    \ order\n1\n5\n8\n```\n"
