    \ operations. For example, you can easily filter, sort or map the elements in\
    \ a stream.\n\nThe Stream API consists of the types in the java.util.stream package.\
    \ The Stream interface is the most frequently used stream type. A Stream can be\
    \ used to transfer any type of objects. There are also specializations of Stream:\
    \ IntStream, LongStream and DoubleStream. All the four stream types are derived\
    \ from BaseStream.\n\nTable 4.1 shows some of the methods defined in the Stream\
    \ interface.\n\n| Method | Description |\n\n| concat | Lazily concatenates or\
    \ links together two streams. It returns a new stream whose elements are all the\
    \ elements of the first stream followed by all the elements of the second stream.\
    \ |\n\n| count | Returns the number of elements of the stream. |\n\n| empty |\
    \ Creates and returns an empty stream. |\n\n| filter | Returns a new stream whose\
    \ elements are all the elements of this stream that match the given predicate.\
    \ |\n\n| forEach | Performs an action on each element of the stream. |\n\n| limit\
    \ | Returns a new stream having the specified maximum number of elements from\
    \ the current stream. |\n\n| map | Returns a stream consisting of the results\
    \ of applying the given function to the elements of this stream. |\n\n| max |\
    \ Returns the maximum element of this stream according to the given comparator.\
    \ |\n\n| min | Returns the minimum element of this stream according to the given\
    \ comparator. |\n\n| of | Returns a stream whose source is the given values. |\n\
    \n| reduce | Performs a reduction on this stream’s elements using an identity\
    \ and an accumulator. |\n\n| sorted | Returns a new stream containing the elements\
    \ of this stream in natural order |\n\n| toArray | Returns an array containing\
    \ the elements of this stream. |\n\nTable 4.1: More important methods of Stream\n\
    \nSome of the Stream methods perform intermediate operations and some perform\
    \ terminal operations. An intermediate operation transforms a stream into another\
    \ stream. Methods such as filter, map and sorted are examples of methods that\
    \ perform intermediate operations. A terminal operation produces a result or side-effect.\
    \ Methods such as count and forEach perform terminal operations.\n\nIt is worth\
    \ noting that streams are lazy. Computation on the source is only performed when\
    \ a terminal operation is started.\n\nStream’s methods will be explained in detail\
    \ in the sections to come.\n\nCreating and Obtaining a Stream\n\nYou can use the\
    \ of static method in Stream to create a sequential stream. For example, the following\
    \ code snippet creates a Stream of Integers with three elements.\n\n```\n Stream<Integer>\
    \ stream = Stream.of(100, 200, 300);\n```\n\nOr, you can pass an array to the\
    \ of method:\n\n```\n String[] names = {\"Bart\", \"Lisa\", \"Maggie\"};\nStream<String>\
    \ stream = Stream.of(names);\n```\n\nThe java.util.Arrays utility class now has\
    \ a stream method for converting an array to a sequential stream. For instance,\
    \ you can rewrite the code above using Arrays to create a Stream from an array.\n\
    \n```\n String[] names = {\"Bart\", \"Lisa\", \"Maggie\"};\nStream<String> stream\
    \ = Arrays.stream(names);\n```\n\nIn addition, the java.util.Collection interface\
    \ also has default methods named stream and parallelStream that return a sequential\
    \ or a parallel stream, respectively, with the collection as its source. Their\
    \ signatures are as follows.\n\n```\n default java.util.stream.Stream<E> stream()\n\
    default java.util.stream.Stream<E> parallelStream()\n```\n\nThanks to these methods\
    \ in Collection, getting a Stream from a List or a Set is a breeze."
