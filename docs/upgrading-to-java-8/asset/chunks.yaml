    \   }\n    }\n}\n```\n\nThe StreamFilterDemo2 class starts by constructing a Path\
    \ that points to the parent of the current directory. It then passes the Path\
    \ to Files.walk to obtain a Stream of Paths and assign the result to a local variable\
    \ named list. Next, it filters the stream with a Predicate that will include all\
    \ Paths whose name ends with .java and calls the forEach method to print the path.\n\
    \nMapping\n\nThe Stream interface’s map method maps each element of a stream with\
    \ the result of passing the element to a function. Here is the signature of map.\n\
    \n```\n <R> Stream<R> map(java.util.function.Function<? super T,\n        ? extends\
    \ R> mapper)\n```\n\nAs you can see from the signature, the map method returns\
    \ a new Stream of elements whose type may be different from the type of the elements\
    \ of the current stream.\n\nConsider the code in Listing 4.6 that shows a more\
    \ useful and realistic example of a Stream to calculate the average age of all\
    \ employees in a company. It does this in two steps. First, it calls the map method\
    \ to convert a Stream of Employee objects to a Stream of Period objects. Each\
    \ Period element of the new stream contains the period between today and each\
    \ employee’s birthday. In other words, each Period element contains the age of\
    \ an employee. In the second step, the code calls the mapToLong method to calculate\
    \ the average age of all the employees.\n\nListing 4.6: The StreamMapDemo class"
