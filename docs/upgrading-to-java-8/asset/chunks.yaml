    \ This will eliminate scrolling back to the beginning of the document as you would\
    \ normally have to do when printing a long manual.\n\n```\n jjs> var System =\
    \ java.lang.System\njjs> var lines = `man pwd`.split('\\n')\njjs> for each (line\
    \ in lines) {System.out.print(line); System.in.read()}\n```\n\nType Enter to show\
    \ the next line of text.\n\nSummary\n\nNashorn is a new JavaScript engine in Java\
    \ 8\\. Not only does it allow you to execute JavaScript from Java code, it also\
    \ comes with advanced features to script JavaFX applications and process the output\
    \ of a Linux command."
  toc: []
  trans: "\n\nNashorn 的另一个有趣特性是它能够编写 JavaFX 脚本。你只需要在 JavaScript 文件中编写一个 `start` 函数。该\
    \ `start` 函数必须接受一个参数，该参数将作为应用程序的主 `Stage` 。\n\n考虑列表 8.6 中的代码。\n\n### 列表 8.6：一个\
    \ JavaFX 脚本 (`test1.js`)\n\n```\nfunction start(stage) {\n    stage.title = \"\
    Scripting JavaFX\";\n    var button = new javafx.scene.control.Button();\n   \
    \ button.text = \"Click Me!\";\n    button.onAction = function() {\n    \tprint(\"\
    Thank you!\");\n    }\n    var root = new javafx.scene.layout.StackPane();\n \
    \   root.children.add(button);\n    stage.scene = new javafx.scene.Scene(root,\
    \ 400, 200);\n    stage.show();\n}\n```\n\n要执行 JavaFX 脚本，你必须使用 `-fx` 选项调用 `jjs`：\n\
    \n```\njjs -fx test1.js\n```\n\n图 8.1 显示了运行 `test1.js` 脚本时创建的 JavaFX 。\n\n![](img/0801.png)\n\
    \n图 8.1：编写 JavaFX\n\n### 使用 Nashorn 替代 Shell 脚本\n\nLinux 硬核粉丝通常精通 Linux 命令。然而，如果你的\
    \ Linux 技能仅限于 `whoami` 和 `ls` 等最基础的命令，你可以利用 Nashorn。Nashorn 允许你调用 Linux 命令并处理结果。\n\
    \n要在 Nashorn 中执行 Linux 命令，请调用 `jjs` 并用反引号（`` ` ``）括起命令。在键盘上，该字符通常位于数字 `1` 的左侧。例如，要列出当前目录的内容，可以使用以下命令。\n\
    \n```\njjs> `ls -al`\n```\n\n使用 Nashorn 调用 Linux 命令的优势在于你可以处理输出内容。例如，以下代码调用了 `cat`\
    \ 命令打印 `Demo.java` 文件并添加行号。\n\n```\njjs> var lines = `cat Demo.java`.split('\\\
    n');\njjs> var i = 1;\njjs> for each (line in lines) { print(i++ + '\\t' + line)\
    \ };\n```\n\n结果如下所示。\n\n```\n1\tpackage nashorn.scripting;\n2\t\n3\tpublic class\
    \ Demo {\n4\t\tpublic static void main(String[] args) {\n5\t\t\tSystem.out.println(\"\
    This is a demo\");\n6\t\t}\n7\t}\n8 \n```\n\n另一个例子是，以下脚本可以逐行显示长文档。这可以避免在打印长手册时像往常那样需要回滚到文档开头。\n\
    \n```\njjs> var System = java.lang.System\njjs> var lines = `man pwd`.split('\\\
    n')\njjs> for each (line in lines) {System.out.print(line); System.in.read()}\n\
    ```\n\n按回车键显示下一行文本。\n\n### 总结\n\nNashorn 是 Java 8 中一个新的 JavaScript 引擎。它不仅允许你从\
    \ Java 代码执行 JavaScript，还带有高级功能，用于编写 JavaFX 应用程序以及处理 Linux 命令的输出。\n\n"
