  trans: "\n`ZonedDateTime` 始终是不可变的，且时间组件的精度为纳秒。\n\n表 5.4 显示了 `ZonedDateTime` 中更重要的方法。\n\
    \n| 方法 | 描述 |\n| :--- | :--- |\n| `now` | 静态方法，返回系统默认时区的当前日期和时间。 |\n| `of` | 静态方法，根据指定的日期、时间和时区标识符创建\
    \ `ZonedDateTime`。 |\n| `getYear`, `getMonthValue`, `getDayOfMonth`, `getHour`,\
    \ `getMinute`, `getSecond`, `getNano` | 以 `int` 类型返回此 `ZoneDateTime` 的年、月、日、时、分、秒或纳秒部分。\
    \ |\n| `plusDays`, `minusDays` | 在当前的 `ZonedDateTime` 上增加或减去指定的天数。 |\n| `plusWeeks`,\
    \ `minusWeeks` | 在当前的 `ZonedDateTime` 上增加或减去指定的周数。 |\n| `plusMonths`, `minusMonths`\
    \ | 在当前的 `ZonedDateTime` 上增加或减去指定的月份。 |\n| `plusYears`, `minusYears` | 在当前的 `ZonedDateTime`\
    \ 上增加或减去指定的年份。 |\n| `plusHours`, `minusHours` | 在当前的 `ZonedDateTime` 上增加或减去指定的小时。\
    \ |\n| `plusMinutes`, `minusMinutes` | 在当前的 `ZonedDateTime` 上增加或减去指定的分钟。 |\n|\
    \ `plusSeconds`, `minusSeconds` | 在当前的 `ZonedDateTime` 上增加或减去指定的秒。 |\n| `isAfter`,\
    \ `isBefore` | 检查此 `ZonedDateTime` 是否在指定的时区日期时间之后或之前。 |\n| `getZone` | 返回此 `ZonedDateTime`\
    \ 的时区 ID。 |\n| `withYear`, `withMonth`, `withDayOfMonth` | 返回此 `ZonedDateTime`\
    \ 的副本，将年/月/日设置为为指定的值。 |\n| `withHour`, `withMinute`, `withSecond` | 返回此 `ZonedDateTime`\
    \ 的副本，将时/分/秒设置为指定的值。 |\n| `withNano` | 返回此 `ZonedDateTime` 的副本，将纳秒设置为指定的值。 |\n\
    \n表 5.4：`ZonedDateTime` 的更重要的方法\n\n与 `LocalDateTime` 一样，`ZonedDateTime` 类提供了静态方法\
    \ `now` 和 `of` 来构建 `ZonedDateTime`。`now` 创建一个表示执行时日期和时间的 `ZonedDateTime`。`now`\
    \ 的无参数重载方法创建一个使用计算机默认时区的 `ZonedDateTime`。\n\n```\nZonedDateTime now = ZonedDateTime.now();\n\
    ```\n\n`now` 的另一个重载允许你传递一个时区标识符：\n\n```\nZonedDateTime parisTime =\n        ZonedDateTime.now(ZoneId.of(\"\
    Europe/Paris\"));\n```\n\n方法 `of` 也带有若干个重载。在所有情况下，你都需要传递一个时区标识符。第一个重载允许你传递从年到纳秒的带时区时间的每一个组件。\n\
    \n```\npublic static ZonedDateTime of(int year, int month, int dayOfMonth, \n\
    \        int hour, int minute, int second, int nanosecond, \n        ZoneId zone)\n\
    ```\n\n`of` 的第二个重载接收一个 `LocalDate`、一个 `LocalTime` 和一个 `ZoneId`：\n\n```\npublic\
    \ static ZonedDateTime of(LocalDate date, LocalTime time,\n        ZoneId zone)\n\
    ```\n\n`of` 的最后一个重载接收一个 `LocalDateTime` 和一个 `ZoneId`。\n\n```\npublic static ZonedDateTime\
    \ of(LocalDateTime datetime, ZoneId zone)\n```\n\n与 `LocalDate` 和 `LocalDateTime`\
    \ 类似，`ZonedDateTime` 提供了使用 `plusXXX`、`minusXXX` 和 `withXXX` 方法创建实例副本的方法。\n\n例如，这些代码创建了一个具有默认时区的\
    \ `ZonedDateTime`，并调用其 `minusDays` 方法来创建一个早三天的相同 `ZonedDateTime`。\n\n```\nZonedDateTime\
    \ now = ZonedDateTime.now();\nZonedDateTime threeDaysEarlier = now.minusDays(3);\n\
    ```\n\n### Duration\n\n`Duration` 类模型了一个基于时间的持续时间。它与 `Period` 相似，但 `Duration`\
    \ 具有纳秒级精度的时间组件，并且考虑了 `ZonedDateTime` 之间的时区。表 5.5 显示了 `Duration` 中更重要的方法。\n\n|\
    \ 方法 | 描述 |\n| :--- | :--- |\n| `between` | 在两个时间对象之间创建一个 `Duration`，例如在两个 `LocalDateTimes`\
    \ 之间或两个 `LocalZonedDateTimes` 之间。 |\n| `ofYears`, `ofMonths`, `ofWeeks`, `ofDays`,\
    \ `ofHours`, `ofMinutes`, `ofSeconds`, `ofNano` | 创建一个表示给定年/月/周/日/小时/分/秒/纳秒的 `Duration`。\
    \ |\n| `of` | 根据给定的时间单位创建一个 `Duration`。 |\n| `toDays`, `toHours`, `toMinutes`\
    \ | 以 `int` 类型返回此 `Duration` 的天/小时/分钟。 |\n| `isNegative` | 如果此 `Duration` 为负，则返回\
    \ true。否则返回 false。 |\n| `isZero` | 如果此 `Duration` 长度为零，则返回 true。否则，返回 false。 |\n\
    | `plusDays`, `minusDays` | 在此 `Duration` 上增加或减去指定的天数。 |\n| `plusMonths`, `minusMonths`\
    \ | 在此 `Duration` 上增加或减去指定的月份。 |\n| `plusYears`, `minusYears` | 在此 `Duration`\
    \ 上增加或减去指定的年份。 |\n| `withSeconds` | 返回此 `Duration` 的副本，将秒设置为指定的值。 |\n\n表 5.5：`Duration`\
    \ 的更重要的方法\n\n可以通过调用其 `between` 或 `of` 静态方法创建一个 `Duration`。表 5.5 的代码创建两个 `LocalDateTimes`\
    \ 之间的 `Duration`，例如 2015 年 1 月 26 日 8:10 和 2015 年 1 月 26 日 11:40。\n\n```java\n\
    package app05;\nimport java.time.Duration;\nimport java.time.LocalDateTime;\n\n\
    public class Duration1 {\n\n    public static void main(String[] args) {\n   \
    \     LocalDateTime dateTimeA = LocalDateTime\n                .of(2015, 1, 26,\
    \ 8, 10, 0);\n        LocalDateTime dateTimeB = LocalDateTime\n              \
    \  .of(2015, 1, 26, 11, 40, 0);\n        Duration duration = Duration.between(\n\
    \                dateTimeA, dateTimeB);\n        System.out.printf(\"There are\
    \ %d hours and %d minutes.%n\",\n                duration.toHours(), \n      \
    \          duration.toMinutes() % 60);\n    }\n}\n```\n\n运行 `Duration1` 类的结果是：\n\
    \n```\nThere are 3 hours and 30 minutes.\n```\n\n表 5.6 的代码创建两个 `ZoneDateTimes`\
    \ 之间的 `Duration`，具有相同的时间但不同的时区。\n\n```java\npackage app05;\nimport java.time.Duration;\n\
    import java.time.LocalDateTime;\nimport java.time.Month;\nimport java.time.ZoneId;\n\
    import java.time.ZonedDateTime;\n\npublic class Duration2 {\n\n    public static\
    \ void main(String[] args) {\n        ZonedDateTime zdt1 = ZonedDateTime.of(\n\
    \                LocalDateTime.of(2015, Month.JANUARY, 1, 8, 0),\n           \
    \     ZoneId.of(\"America/Denver\"));\n        ZonedDateTime zdt2 = ZonedDateTime.of(\n\
    \                LocalDateTime.of(2015, Month.JANUARY, 1, 8, 0), \n          \
    \      ZoneId.of(\"America/Toronto\"));\n        Duration duration = Duration.between(zdt1,\
    \ zdt2);\n        System.out.printf(\"There are %d hours and %d minutes.%n\",\n\
    \                duration.toHours(), \n                duration.toMinutes() %\
    \ 60);\n    }\n}\n```\n\n运行 `Duration2` 类在控制台上输出如下：\n\n```\nThere are -2 hours\
    \ and 0 minutes.\n```\n\n作为一个更复杂的示例，列表 5.7 中的代码显示了一个班车旅行时间计算器。它有一个方法 `calculateTravelTime`，接收一个出发\
    \ `ZonedDateTime` 和一个到达 `ZonedDateTime`。代码调用了两次 `calculateTravelTime` 方法。两次班车都是丹佛当地时间早上\
    \ 8 点从科罗拉多州丹佛出发，并在第二天早上 8 点到达多伦多。第一次班车是在 2014 年 3 月 8 日出发，第二次是在 2014 年 3 月 18\
    \ 日出发。\n\n这两种情况的旅行时间是多少？\n\n列表 5.7：旅行时间计算器\n\n"
- fmt: "\n```java\n package app05;\nimport java.time.Duration;\nimport java.time.LocalDateTime;\n\
    import java.time.Month;\nimport java.time.ZoneId;\nimport java.time.ZonedDateTime;\n\
    \npublic class TravelTimeCalculator {\n\n    public Duration calculateTravelTime(\n\
    \            ZonedDateTime departure, ZonedDateTime arrival) {\n        return\
    \ Duration.between(departure, arrival);\n    }\n\n    public static void main(String[]\
    \ args) {\n        TravelTimeCalculator calculator = \n                new TravelTimeCalculator();\n\
    \        ZonedDateTime departure1 = ZonedDateTime.of(\n                LocalDateTime.of(2014,\
    \ Month.MARCH, 8, \n                        8, 0), \n                ZoneId.of(\"\
    America/Denver\"));\n        ZonedDateTime arrival1 = ZonedDateTime.of(\n    \
    \            LocalDateTime.of(2014, Month.MARCH, 9, \n                       \
    \ 8, 0), \n                ZoneId.of(\"America/Toronto\"));\n        Duration\
    \ travelTime1 = calculator\n                .calculateTravelTime(departure1, arrival1);\n\
    \        System.out.println(\"Travel time 1: \" \n                + travelTime1.toHours()\
    \ + \" hours\");\n\n        ZonedDateTime departure2 = ZonedDateTime.of(\n   \
    \             LocalDateTime.of(2014, Month.MARCH, 18, \n                     \
    \   8, 0), \n                ZoneId.of(\"America/Denver\"));\n        ZonedDateTime\
    \ arrival2 = ZonedDateTime.of(\n                LocalDateTime.of(2014, Month.MARCH,\
    \ 19, \n                        8, 0), \n                ZoneId.of(\"America/Toronto\"\
    ));\n        Duration travelTime2 = calculator\n                .calculateTravelTime(departure2,\
    \ arrival2);\n        System.out.println(\"Travel time 2: \" \n              \
    \  + travelTime2.toHours() + \" hours\");\n    }\n}\n```\n\nThe result is this.\n\
    \n```\n Travel time 1: 21 hours\nTravel time 2: 22 hours\n```\n\nWhy the difference?\
    \ Because in 2014 daylight saving time began on Sunday, March 9 at 2AM. As such,\
    \ you ‘lost’ one hour between March 8, 2014 and March 9, 2014.\n\n## Formatting\
    \ A Date-Time\n\nYou use a `java.time.format.DateTimeFormatter` to format a local\
    \ or zoned date-time. The `LocalDate`, `LocalDateTime`, `LocalTime` and `ZoneDateTime`\
    \ classes offer a `format` method that has the following signature.\n\n```\n public\
    \ java.lang.String format(java.time.format.DateTimeFormatter \n        formatter)\n\
    ```\n\nIt is clear that to format a date or time, you must first create an instance\
    \ of `DateTimeFormatter`.\n\nThe code in Listing 5.8 formats the current date\
    \ using two formatters.\n\n### Listing 5.8: Formatting dates\n\n```java\n package\
    \ app05;\nimport java.time.LocalDateTime;\nimport java.time.format.DateTimeFormatter;\n\
    import java.time.format.FormatStyle;\n\npublic class DateTimeFormatterDemo1 {\n\
    \    public static void main(String[] args) {\n        DateTimeFormatter formatter1\
    \ = DateTimeFormatter\n                .ofLocalizedDateTime(FormatStyle.MEDIUM);\n\
    \        LocalDateTime example = LocalDateTime.of(\n                2000, 3, 19,\
    \ 10, 56, 59);\n        System.out.println(\"Format 1: \" + example\n        \
    \        .format(formatter1));        \n        DateTimeFormatter formatter2 =\
    \ DateTimeFormatter\n                .ofPattern(\"MMMM dd, yyyy HH:mm:ss\");\n\
    \        System.out.println(\"Format 2: \" + \n                example.format(formatter2));\n\
    \    }\n}\n```\n\nThe results are as follows (the first result depends on your\
    \ locale).\n\n```\n Format 1: 19-Mar-2000 10:56:59 AM\nFormat 2: March 19, 2000\
    \ 10:56:59\n```\n\n## Parsing A Date-Time\n\nThere are two parse methods in many\
    \ of the classes in the Java Date and Time API. The first requires a formatter,\
    \ the second does not. The one that does not will parse the date-time based on\
    \ the default pattern. To use your own pattern, use a `DateTimeFormatter`. The\
    \ `parse` methods will throw a `DateTimeParseException` if the string passed cannot\
    \ be parsed.\n\nListing 5.9 contains an age calculator to demonstrate date parsing.\n\
    \n### Listing 5.9: An age calculator\n\n```java\n package app05;\nimport java.time.LocalDate;\n\
    import java.time.Period;\nimport java.time.format.DateTimeFormatter;\nimport java.time.format.DateTimeParseException;\n\
    import java.util.Scanner;\n\npublic class AgeCalculator {\n    DateTimeFormatter\
    \ formatter = DateTimeFormatter.ofPattern(\"yyyy-M-d\");\n    public Period calculateAge(LocalDate\
    \ birthday) {\n        LocalDate today = LocalDate.now();\n        return Period.between(birthday,\
    \ today);\n    }\n\n    public LocalDate getBirthday() {\n        Scanner scanner\
    \ = new Scanner(System.in);\n        LocalDate birthday;\n        while (true)\
    \ {\n            System.out.println(\"Please enter your birthday \"\n        \
    \            + \"in yyyy-MM-dd format (e.g. 1980-9-28): \");\n            String\
    \ input = scanner.nextLine();\n            try {\n                birthday = LocalDate.parse(input,\
    \ formatter);\n                return birthday;\n            } catch(DateTimeParseException\
    \ e) {\n                System.out.println(\"Error! Please try again\");\n   \
    \         }\n        }\n    }\n\n    public static void main(String[] args) {\n\
    \        AgeCalculator ageCalculator = new AgeCalculator();\n        LocalDate\
    \ birthday = ageCalculator.getBirthday();\n        Period age = ageCalculator.calculateAge(birthday);\n\
    \        System.out.printf(\"Today you are %d years, %d months\"\n           \
    \     + \" and %d days old%n\",\n                age.getYears(), age.getMonths(),\
    \ age.getDays());\n    }\n}\n```\n\nThe `AgeCalculator` class has two methods,\
    \ `getBirthday` and `calculateAge`. The `getBirthday` method employs a `Scanner`\
    \ to read user input and parses the input into a `LocalDate` using the class level\
    \ `DateTimeFormatter`. The `getBirthday` method keeps begging for a date until\
    \ the user types in a date in the correct format, in which case the method returns.\
    \ The `calculateAge` method takes a `birthday` and creates a `Period` between\
    \ the `birthday` and today.\n\nIf you run this example, you will see this on your\
    \ console.\n\n```\n Please enter your birthday in yyyy-MM-dd format (e.g. 1980-9-28):\n\
    ```\n\nIf you enter a date in the correct format, the program will print the calculated\
    \ age, such as the following.\n\n```\n Today you are 79 years, 0 months and 15\
    \ days old\n```\n\n## Summary\n\nJava 8 brings with it a new Date-Time API to\
    \ replace the old API that centered around the `java.util.Date` class. In this\
    \ chapter you have learned to use the core classes in the new API, such as `Instant`,\
    \ `LocalDate`, `LocalDateTime`, `ZonedDateTime`, `Period` and `Duration`, as well\
    \ as learned to format and parse a date-time.\n\n# Chapter 6 JavaFX 8\n\nJavaFX\
    \ is a technology for creating rich client applications that can run on the desktop\
    \ and in the browser. It is similar to Swing but with a better and simpler object\
    \ model and will replace Swing and AWT.\n\nThis chapter provides an introduction\
    \ to JavaFX and Chapter 7, “JavaFX with FXML” explains how to separate the presentation\
    \ layer and business logic using a special markup language called FXML.\n\n##\
    \ Overview\n\nJavaFX is a technology for building rich applications that can be\
    \ deployed as desktop applications as well as run in the browser as applets. JavaFX\
    \ will eventually replace Swing, and to ease transition from Swing to JavaFX,\
    \ there is support for interoperability between the two. You can easily use Swing\
    \ components from within your JavaFX application.\n\nAs a desktop technology,\
    \ JavaFX is an excellent choice for any Java developer or anyone aspiring to be\
    \ a GUI developer, thanks to its features and ease of use. In addition, JavaFX\
    \ enjoys the full support from Oracle and the Java community at large, so getting\
    \ help is easy.\n"
