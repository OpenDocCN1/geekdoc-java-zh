    \   error.setText(\"\");\n                }\n            }\n        });\n\n  \
    \      vbox.getChildren().add(gridPane);\n        stage.show();\n    }\n}\n```\n\
    \nFigure 6.8 shows the application.\n\n![](Images/0608.png)\n\nFigure 6.8: Steps\
    \ to program\n\nSummary\n\nJavaFX is a Java technology for creating desktop and\
    \ in-browser applications. It is a better solution than both AWT and Swing and\
    \ is therefore destined to replace its predecessors.\n\nThis chapter introduced\
    \ JavaFX and provided a couple of examples. The next chapter, “JavaFX with FXML”\
    \ explains how to separate the presentation layer and the business logic using\
    \ a special markup language called FXML.\n\nChapter 7\n\nJavaFX with FXML\n\n\
    FXML is an XML-based markup language for constructing JavaFX user interface (UI).\
    \ Using FXML in JavaFX applications is a great way of separating the presentation\
    \ layer and the application logic. This chapter discusses FXML and shows how to\
    \ use it in JavaFX application development.\n\nOverview\n\nA new feature of JavaFX\
    \ 2, FXML greatly reduces the complexity of your JavaFX classes by moving user\
    \ interface component construction to an XML-based document. In addition, FXML\
    \ visualizes the UI component hierarchy much better than Java classes. The root\
    \ of an FXML document represents a javafx.scene.Parent that can be loaded to JavaFX\
    \ using a special loader called FXMLLoader. Here is the start method of an Application\
    \ subclass that uses FXML.\n\n```\n @Override \npublic void start(Stage stage)\
    \ throws Exception { \n    stage.setTitle(\"FXML Example\"); \n    Parent root\
    \ = (Parent) FXMLLoader.load(\n            getClass().getResource(\"example1.fxml\"\
    )); \n    Scene scene = new Scene(root, 740, 530); \n    stage.setScene(scene);\
    \ \n    stage.show(); \n} \n```\n\nThe code above calls the load method of FXMLLoader\
    \ to read an FXML file and convert its content to a Parent object. The Parent\
    \ object is then used to construct a Scene."
