  trans: "\n\n```java\n package app03.optional2;\nimport java.util.Optional;\n\nclass\
    \ Company {\n    private String name;\n    private Optional<Office> office;\n\n\
    \    public Company(String name, Optional<Office> office) {\n        this.name\
    \ = name;\n        this.office = office;\n    }\n\n    public String getName()\
    \ {\n        return name;\n    }\n\n    public Optional<Office> getOffice() {\n\
    \        return office;\n    }\n}\n\nclass Office {\n    private String id;\n\
    \    private Optional<Address> address;\n\n    public Office(String id, Optional<Address>\
    \ address) {\n        this.id = id;\n        this.address = address;\n    }\n\n\
    \    public String getId() {\n        return id;\n    }\n\n    public Optional<Address>\
    \ getAddress() {\n        return address;\n    }\n}\n\nclass Address {\n    private\
    \ Optional<String> street;\n    private Optional<String> city;\n\n    public Address(Optional<String>\
    \ street, Optional<String> city) {\n        this.street = street;\n        this.city\
    \ = city;\n    }\n\n    public Optional<String> getStreet() {\n        return\
    \ street;\n    }\n\n    public Optional<String> getCity() {\n        return city;\n\
    \    }\n}\n\npublic class OptionalDemo2 {\n    public static void main(String[]\
    \ args) {\n        Optional<Address> address1 = Optional.of(\n               \
    \ new Address(Optional.ofNullable(null), \n                        Optional.of(\"\
    New York\")));\n        Optional<Office> office1 = Optional.of(\n            \
    \    new Office(\"OF1\", address1));\n\n        Optional<Company> company1 = Optional.of(\n\
    \                new Company(\"Door Never Closed\", office1));\n\n        // company1\
    \ 的街道地址是什么的？\n        // company1 位于哪个城市？\n        Optional<Office> maybeOffice\
    \ = \n                company1.flatMap(Company::getOffice);\n        Optional<Address>\
    \ maybeAddress = \n                maybeOffice.flatMap(Office::getAddress);\n\
    \        Optional<String> maybeStreet = \n                maybeAddress.flatMap(Address::getStreet);\n\
    \        maybeStreet.ifPresent(System.out::println);\n        if (maybeStreet.isPresent())\
    \ {\n            System.out.println(maybeStreet.get());\n        } else {\n  \
    \          System.out.println(\"未找到街道\");\n        }\n\n        // 更简短的方法\n  \
    \      String city = company1.flatMap(Company::getOffice)\n            .flatMap(Office::getAddress)\n\
    \            .flatMap(Address::getCity)\n            .orElse(\"未找到城市\");\n   \
    \     System.out.println(\"City: \" + city);\n\n        // 仅当城市不为空时打印\n      \
    \  company1.flatMap(Company::getOffice)\n                .flatMap(Office::getAddress)\n\
    \                .flatMap(Address::getCity)\n                .ifPresent(System.out::println);\n\
    \    }\n}\n```\n\n`OptionalDemo2` 类展示了如何获取公司的街道和城市，首先通过将每次 `flatMap` 调用的返回值赋值给变量，然后通过链式调用。\n\
    \n### OptionalInt, OptionalLong 和 OptionalDouble\n\n`OptionalInt`、`OptionalLong`\
    \ 和 `OptionalDouble` 类包含了 `Optional` 提供的方法的子集。例如，它们拥有这些方法：`empty`、`ifPresent`、`isPresent`\
    \ 和 `of`。`of` 接收一个基本类型，由于基本类型不能为空，因此没有 `ofNullable` 方法。也没有 `get` 方法。相反，`OptionalInt`\
    \ 有一个 `getAsInt` 方法，`OptionalLong` 有一个 `getAsLong` 方法，而 `OptionalDouble` 有一个 `getAsDouble`\
    \ 方法。也没有 `filter`、`flatMap` 和 `map` 方法。\n\n### 总结\n\nJava 程序员必须在代码的到处处理空指针异常。Java\
    \ 8 引入了 `Optional` 和类似的类，作为处理空指针异常的新强大方法。在本章中，你已经学习了如何使用 `Optional`。\n\n# 第 4\
    \ 章\n\n## Stream API\n\n在本章中，你将学习 `Stream API`，这是 JDK 8 的新特性。为了理解本章的主题，你需要知道如何使用\
    \ `Lambda 表达式` 以及 `java.util.function` 中的预定义函数接口，这两者在第 1 章“Lambda 表达式”中都讨论过。\n\
    \n## 概述\n\n流（stream）就像一个管道，但它传输的不是水或油，而是从源传输到目的地的数据。根据传输模式的不同，流可以是顺序的，也可以是并行的。如果程序运行的计算机具有多核\
    \ CPU，那么并行流将特别有用。\n\n初看之下，流看起来像集合（collection）。然而，流并不是存储对象的数据结构，它只移动对象。因此，你不能像操作集合那样向流中添加元素。\n\
    \n使用流的主要原因是它支持顺序和并行聚合操作。例如，你可以轻松地过滤、排序或映射流中的元素。\n\n`Stream API` 由 `java.util.stream`\
    \ 包中的类型组成。`Stream` 接口是最频繁使用的流类型。`Stream` 可用于传输任何类型的对象。还有 `Stream` 的特化类型：`IntStream`、`LongStream`\
    \ 和 `DoubleStream`。所有四种流类型都派生自 `BaseStream`。\n\n表 4.1 显示了 `Stream` 接口中定义的一些方法。\n\
    \n| 方法 | 描述 |\n| :--- | :--- |\n| `concat` | 惰性地连接或链接两个流。返回一个新流，其元素是第一个流的元素后跟第二个流。\
    \ |\n| `count` | 返回流的数量。 |\n| `empty` | 创建并返回一个空流。 |\n| `filter` | 返回一个包含匹配给定谓词的流元素的流。\
    \ |\n| `forEach` | 对流的每个元素执行操作。 |\n| `limit` | 返回一个包含流中指定数量元素的流。 |\n| `map` |\
    \ 返回一个由将函数应用于流元素后的结果组成的流。 |\n| `max` | 根据给定的比较器返回流的最大元素。 |\n| `min` | 根据给定的比较器返回流的最小元素。\
    \ |\n| `of` | 返回一个源自给定值的流。 |\n| `reduce` | 使用恒等和累加器对流进行归约。 |\n| `sorted` | 返回一个按自然顺序排列流元素的流。\
    \ |\n| `toArray` | 返回一个包含流中元素的数组。 |\n\n表 4.1：Stream 的重要方法\n\n某些 Stream 方法执行中间操作，而某些执行终端操作。中间操作将流转换为另一个流。`filter`、`map`\
    \ 和 `sorted` 是执行中间操作的方法示例。终端操作产生结果或产生副作用。`count` 和 `forEach` 是执行终端操作的方法。\n\n值得注意的是，流是惰性的。只有在启动终端操作时，才会对源进行计算。\n\
    \nStream 的方法将在后面的章节中详细介绍。\n\n## 创建和获取流\n\n你可以使用 `Stream` 的静态方法 `of` 来创建一个顺序流。例如，以下代码段创建一个包含三个元素的\
    \ `Integer`  `Stream`。\n\n```java\n Stream<Integer> stream = Stream.of(100, 200,\
    \ 300);\n```\n\n或者，你可以将数组传递给 `of` 方法：\n\n```java\n String[] names = {\"Bart\"\
    , \"Lisa\", \"Maggie\"};\nStream<String> stream = Stream.of(names);\n```\n\n`java.util.Arrays`\
    \ 工具类现在有一个 `stream` 方法用于将数组转换为顺序流。例如，你可以使用 `Arrays` 重写上面的代码来从数组创建 Stream。\n\n\
    ```java\n String[] names = {\"Bart\", \"Lisa\", \"Maggie\"};\nStream<String> stream\
    \ = Arrays.stream(names);\n```\n\n此外，`java.util.Collection` 接口也有名为 `stream` 和\
    \ `parallelStream` 的默认方法，分别返回顺序流或并行流，并集合为源。它们的签名如下。\n\n```java\n default java.util.stream.Stream<E>\
    \ stream()\ndefault java.util.stream.Stream<E> parallelStream()\n```\n\n多亏于 `Collection`\
    \ 中的这些方法，从 `List` 或 `Set` 获取 `Stream` 是轻而易举。\n"
- fmt: "\nOn top of that, the `java.nio.file.Files` class offers two methods that\
    \ return a `Stream<Path>`, `list` and `walk`. `list` returns a `Stream` of `Paths`\
    \ that point to the entries in the given path. On the other hand, `walk` walks\
    \ through the entries in the given path and return them as a stream.\n\n`Files`\
    \ also contains a `lines` method that returns all lines in a text file as a `Stream<String>`.\n\
    \nFor example, the `ObtainStreamDemo` class in Listing 4.1 shows how to obtain\
    \ a stream from the `Files` class.\n\n### Listing 4.1: The ObtainStreamDemo class\n\
    \n```java\n package app04;\nimport java.io.IOException;\nimport java.nio.file.Files;\n\
    import java.nio.file.Path;\nimport java.nio.file.Paths;\nimport java.util.stream.Stream;\n\
    \npublic class ObtainStreamDemo {\n\n    public static void main(String[] args)\
    \ {\n        Path path = Paths.get(\".\");\n        try {\n            Stream<Path>\
    \ list = Files.list(path);\n            list.forEach(System.out::println);\n \
    \       } catch (IOException ex) {\n            ex.printStackTrace();\n      \
    \  }\n    }\n}\n```\n\nThe code in Listing 4.1 constructs a `Path` that references\
    \ the current directory (i.e. the directory from which the Java program was run)\
    \ and passes it to `Files.list`. The method returns a `Stream` of `Paths`. The\
    \ code then calls the `forEach` method on the `Stream` passing a `Consumer` that\
    \ prints each entry. If you run the code, you will see all entries in the current\
    \ path printed on the console.\n\n### Concatenating Streams\n\nThe `Stream` interface\
    \ provides a `concat` method for lazily concatenating or linking two streams together.\
    \ This method returns a new stream whose elements are all the elements of the\
    \ first stream followed by all the elements of the second stream.\n\nThe code\
    \ in Listing 4.2 shows how to concatenate two `Streams` of `Strings` and sort\
    \ them.\n\n### Listing 4.2: Joining streams\n\n```java\n package app04;\nimport\
    \ java.util.stream.Stream;\n\npublic class StreamConcatDemo {\n    public static\
    \ void main(String[] args) {\n        Stream<String> stream1 = \n            \
    \    Stream.of(\"January\", \"Christie\");\n        Stream<String> stream2 = \n\
    \                Stream.of(\"Okanagan\", \"Sydney\", \"Alpha\");\n        Stream.concat(stream1,\
    \ stream2).sorted().\n                forEach(System.out::println);\n    }\n}\n\
    ```\n\nIf you run the `StreamConcatDemo` class in Listing 4.2, you will see the\
    \ following printed on the console.\n\n```\n Alpha\nChristie\nJanuary\nOkanagan\n\
    Sydney\n```\n\n### Filtering\n\nWhen you filter a stream you select the elements\
    \ of the stream based on certain criteria and return a new `Stream` for the selected\
    \ elements. You filter a stream by calling the `filter` method on a `Stream` object,\
    \ passing a `Predicate`. The `Predicate` determines whether or not an element\
    \ will be included in the new stream.\n\nHere is the signature of the `filter`\
    \ method.\n\n```java\n Stream<T> filter(java.util.function.Predicate<? super T>\
    \ predicate)\n```\n\nAs an example, the code in Listing 4.3 reads the `example.txt`\
    \ file in Listing 4.4 and let pass only lines that are not empty and not a comment.\
    \ A comment line starts with a hash (`#`) after removing all trailing spaces.\n\
    \n### Listing 4.3: The StreamFilterDemo1 class\n\n```java\n package app04;\nimport\
    \ java.io.BufferedReader;\nimport java.io.FileReader;\nimport java.io.IOException;\n\
    import java.util.function.Predicate;\nimport java.util.stream.Stream;\n\npublic\
    \ class StreamFilterDemo1 {\n    public static void main(String[] args) {\n  \
    \      Predicate<String> notCommentOrEmptyLine\n                = (line) -> line.trim().length()\
    \ > 0\n                && !line.trim().startsWith(\"#\");\n        try (FileReader\
    \ fr = new FileReader(\"example.txt\");\n                BufferedReader br = new\
    \ BufferedReader(fr)) {\n            Stream<String> lines = br.lines();\n    \
    \        lines.filter(notCommentOrEmptyLine)\n                    .forEach(System.out::println);\n\
    \        } catch (IOException e) {\n            e.printStackTrace();\n       \
    \ }\n    }\n}\n```\n\n### Listing 4.4: The example.txt file\n\n```bash\n # Set\
    \ path so it includes user's private bin if it exists\nif [ -d \"$HOME/bin\" ]\
    \ ; then\n    PATH=\"$HOME/bin:$PATH\"\n\nfi\n```\n\nIf you run the class in Listing\
    \ 4.3, you will see these lines on the console. It prints three of five lines\
    \ in the text file.\n\n```\n if [ -d \"$HOME/bin\" ] ; then\n    PATH=\"$HOME/bin:$PATH\"\
    \nfi\n```\n\nAs a second example, the class in Listing 4.5 shows how you can use\
    \ a stream to do a file search on your computer. To be more precise, the code\
    \ displays all java files located in a given directory and any of its subdirectories.\n\
    \n### Listing 4.5: The StreamFilterDemo2 class\n\n```java\n package app04;\nimport\
    \ java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\n\
    import java.nio.file.Paths;\nimport java.util.stream.Stream;\n\npublic class StreamFilterDemo2\
    \ {\n    public static void main(String[] args) {\n        // find all java files\
    \ in the parent directory and\n        // all its subdirectories\n        Path\
    \ parent = Paths.get(\"..\");\n        try {\n            Stream<Path> list =\
    \ Files.walk(parent);\n            list.filter((Path p) -> p.toString().endsWith(\"\
    .java\"))\n                    .forEach(System.out::println);\n        } catch\
    \ (IOException ex) {\n            ex.printStackTrace();\n        }\n    }\n}\n\
    ```\n\nThe `StreamFilterDemo2` class starts by constructing a `Path` that points\
    \ to the parent of the current directory. It then passes the `Path` to `Files.walk`\
    \ to obtain a `Stream` of `Paths` and assign the result to a local variable `list`.\
    \ Next, it filters the stream with a `Predicate` that will include all `Paths`\
    \ whose name ends with `.java` and calls the `forEach` method to print the path.\n\
    \n### Mapping\n\nThe `Stream` interface’s `map` method maps each element of a\
    \ stream with the result of passing the element to a function. Here is the signature\
    \ of `map`.\n\n```java\n <R> Stream<R> map(java.util.function.Function<? super\
    \ T,\n        ? extends R)\n```\n\nAs you can see from the signature, the `map`\
    \ method returns a new `Stream` of elements whose type may be different from the\
    \ type of the elements of the current stream.\n\nConsider the code in Listing\
    \ 4.6 that shows a more useful and realistic example of a Stream to calculate\
    \ the average age of all employees in a company. It does this in two steps. First,\
    \ it calls the `map` method to convert a `Stream` of `Employee` objects to a `Stream`\
    \ of `Period` objects. Each `Period` element of the new stream contains the period\
    \ between today and each employee’s birthday. In other words, each `Period` element\
    \ contains the age of an employee. In the second step, the code calls the `mapToLong`\
    \ method to calculate the average age of all the employees.\n\n### Listing 4.6:\
    \ The StreamMapDemo class\n"
