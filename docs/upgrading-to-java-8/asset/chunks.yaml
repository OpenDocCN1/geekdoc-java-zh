    \n# Introduction\n\nReleased in March 2014, Java 8 ships with many important features\
    \ and enhancements. This book covers the most important features for developers,\
    \ including:\n\n* Lambda expressions and method references.\n- A Stream API to\
    \ support functional-style operations on streams of elements.\n- The revamped\
    \ `java.util` package that adds support for streams.\n- The introduction of the\
    \ `Optional` class and similar classes to help handle null pointer exceptions.\n\
    - A major change to the Java language that allows static and default methods in\
    \ interfaces.\n- A new theme and components for JavaFX 8.\n- Nashorn, a new JavaScript\
    \ engine with more capabilities than simply parsing JavaScript code.\n\nThe complete\
    \ list of the new features and enhancement can be found here:\n\n```\nhttp://www.oracle.com/technetwork/java/javase/8-whats-new-2157071.html\n\
    ```\n\n# Who This Book is For\n\nThis book is for experienced Java developers\
    \ who want to learn Java 8 fast. If you are not familiar with Java, consider reading\
    \ my other book, Java: A Beginner’s Tutorial, Fourth Edition (ISBN 9780992133047),\
    \ which is fully revised for Java 8.\n\n# About This Book\n\nThe following presents\
    \ the overview of each chapter.\n\nChapter 1, “Lambda Expressions” covers lambda\
    \ expressions, a powerful feature added in Java 8\\. It explains the concept and\
    \ provides useful examples.\n\nChapter 2, “Method References” explains method\
    \ references, a feature to make lambda expressions even shorter.\n\nChapter 3,\
    \ “Optional and Similar Classes” talks about the new `Optional` class and similar\
    \ classes for wrapping objects that can be null. These classes can help handle\
    \ pointer exceptions.\n\nChapter 4, “The Stream API” discusses the new Stream\
    \ API to support streams.\n\nChapter 5, “The Date-Time API” explains how you can\
    \ work with the new Date-Time API in Java 8.\n\nChapter 6, “JavaFX 8” is an introduction\
    \ to JavaFX and provides several examples.\n\nChapter 7, “JavaFX with FXML” discusses\
    \ FXML, a markup language that can be used to separate the presentation layer\
    \ and the business logic in JavaFX applications.\n\nChapter 8, “Nashorn” discusses\
    \ the new JavaScript engine in Java 8 for running JavaScript from Java as well\
    \ as performing other tasks such as scripting JavaFX and manipulating shell script\
    \ output.\n\n# Downloading Sample Applications\n\nSample applications accompanying\
    \ this book can be downloaded from the publisher’s website at\n\n```\nhttp://books.brainysoftware.com\n\
    ```\n\n# Chapter 1\n\n## Lambda Expressions\n\nThe lambda expression is the most\
    \ important new feature in Java SE 8\\. Long considered a missing feature in Java,\
    \ it has made the Java language complete. At least for now. In this chapter you\
    \ will learn what lambda expressions are and why they are a nice addition to the\
    \ language. You will also be introduced to new technical terms such as single\
    \ abstract method (SAM) and functional interface.\n\n### Why Lambda Expressions?\n\
    \nAlso known as closures, lambda expressions can make certain constructs shorter\
    \ and more readable, especially when you are dealing with inner classes.\n\nConsider\
    \ the following code snippet that defines an anonymous inner class out of the\
    \ `java.lang.Runnable` interface and instantiates the class.\n\n```\nRunnable\
    \ runnable = new Runnable() {\n    @Override\n    public void run() {\n      \
    \  System.out.println(\"Running...\");\n    }\n}\n```\n\nThe code can be replaced\
    \ with a lambda expression as short as this:\n\n```\nRunnable runnable = () ->\
    \ System.out.println(\"Running...\")\n```\n"
