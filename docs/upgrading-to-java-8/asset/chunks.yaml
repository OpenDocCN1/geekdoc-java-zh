  trans: "\n\n此外，`java.nio.file.Files` 类提供了两个返回 `Stream<Path>` 的方法：`list` 和 `walk`。`list`\
    \ 返回一个指向给定路径下条目的 `Paths` 的 `Stream`。另一方面，`walk` 会遍历给定路径中的条目，并将它们作为流的形式返回。\n\n\
    `Files` 还包含一个 `lines` 方法，该方法可以将文本文件中所有的行作为 `Stream<String>` 返回。\n\n例如，列表 4.1 中的\
    \ `ObtainStreamDemo` 类展示了如何从 `Files` 类获取流。\n\n### 列表 4.1：ObtainStreamDemo 类\n\n\
    ```java\n package app04;\nimport java.io.IOException;\nimport java.nio.file.Files;\n\
    import java.nio.file.Path;\nimport java.nio.file.Paths;\nimport java.util.stream.Stream;\n\
    \npublic class ObtainStreamDemo {\n\n    public static void main(String[] args)\
    \ {\n        Path path = Paths.get(\".\");\n        try {\n            Stream<Path>\
    \ list = Files.list(path);\n            list.forEach(System.out::println);\n \
    \       } catch (IOException ex) {\n            ex.printStackTrace();\n      \
    \  }\n    }\n}\n```\n\n列表 4.1 中的代码构建了一个引用当前目录（即运行 Java 程序的目录）的 `Path`，并将其传递给 `Files.list`。该方法返回一个\
    \ `Paths` 的 `Stream`。随后代码在 `Stream` 上调用 `forEach` 方法，传递一个打印每个条目的 `Consumer`。如果你运行该代码，你将在控制台上看到当前路径下的所有条目打印。\n\
    \n### 合并流\n\n`Stream` 接口提供了一个 `concat` 方法，用于惰性地合并或链接两个流。该方法返回一个新的流，其元素包含第一个流的所有元素，紧随其的是第二个流的所有元素。\n\
    \n列表 4.2 中的代码展示了如何合并两个 `String` 类型的 `Stream` 并对其进行排序。\n\n### 列表 4.2：合并流\n\n```java\n\
    \ package app04;\nimport java.util.stream.Stream;\n\npublic class StreamConcatDemo\
    \ {\n    public static void main(String[] args) {\n        Stream<String> stream1\
    \ = \n                Stream.of(\"January\", \"Christie\");\n        Stream<String>\
    \ stream2 = \n                Stream.of(\"Okanagan\", \"Sydney\", \"Alpha\");\n\
    \        Stream.concat(stream1, stream2).sorted().\n                forEach(System.out::println);\n\
    \    }\n}\n```\n\n如果你运行列表 4.2 中的 `StreamConcatDemo` 类，你将在控制台上看到以下输出。\n\n```\n\
    \ Alpha\nChristie\nJanuary\nOkanagan\nSydney\n```\n\n### 过滤\n\n当你过滤流时，你根据某些标准选择流中的元素，并为所选元素返回一个新的\
    \ `Stream`。你通过在 `Stream` 对象上调用 `filter` 方法来过滤流，并传递一个 `Predicate`。`Predicate` 决定一个元素是否包含在新的流中。\n\
    \n以下是 `filter` 方法的签名。\n\n```java\n Stream<T> filter(java.util.function.Predicate<?\
    \ super T> predicate)\n```\n\n例如，列表 4.3 中的代码读取列表 4.4 中的 `example.txt` 文件，并允许通过非空且不是注释的行。在移除所有尾部空格后，注释行以哈希符号（##）开头。\n\
    \n### 列表 4.3：StreamFilterDemo1 类\n\n```java\n package app04;\nimport java.io.BufferedReader;\n\
    import java.io.FileReader;\nimport java.io.IOException;\nimport java.util.function.Predicate;\n\
    import java.util.stream.Stream;\n\npublic class StreamFilterDemo1 {\n    public\
    \ static void main(String[] args) {\n        Predicate<String> notCommentOrEmptyLine\n\
    \                = (line) -> line.trim().length() > 0\n                && !line.trim().startsWith(\"\
    #\");\n        try (FileReader fr = new FileReader(\"example.txt\");\n       \
    \         BufferedReader br = new BufferedReader(fr)) {\n            Stream<String>\
    \ lines = br.lines();\n            lines.filter(notCommentOrEmptyLine)\n     \
    \               .forEach(System.out::println);\n        } catch (IOException e)\
    \ {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n### 列表 4.4：example.txt\
    \ 文件\n\n```bash\n # Set path so it includes user's private bin if it exists\n\
    if [ -d \"$HOME/bin\" ] ; then\n    PATH=\"$HOME/bin:$PATH\"\n\nfi\n```\n\n如果你运行列表\
    \ 4.3 中的类，你将在控制台上看到这些行。它打印了文本文件中五行中的三行。\n\n```\n if [ -d \"$HOME/bin\" ] ; then\n\
    \    PATH=\"$HOME/bin:$PATH\"\nfi\n```\n\n作为第二个示例，列表 4.5 中的类展示了你如何使用流在你的计算机上进行文件搜索。更准确地说，该代码显示了位于给定目录及其任何子目录下的所有\
    \ java 文件。\n\n### 列表 4.5：StreamFilterDemo2 类\n\n```java\n package app04;\nimport\
    \ java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\n\
    import java.nio.file.Paths;\nimport java.util.stream.Stream;\n\npublic class StreamFilterDemo2\
    \ {\n    public static void main(String[] args) {\n        // find all java files\
    \ in the parent directory and\n        // all its subdirectories\n        Path\
    \ parent = Paths.get(\"..\");\n        try {\n            Stream<Path> list =\
    \ Files.walk(parent);\n            list.filter((Path p) -> p.toString().endsWith(\"\
    .java\"))\n                    .forEach(System.out::println);\n        } catch\
    \ (IOException ex) {\n            ex.printStackTrace();\n        }\n    }\n}\n\
    ```\n\n`StreamFilterDemo2` 类首先构建一个指向当前目录父目录的 `Path`。然后它将该 `Path` 传递给 `Files.walk`\
    \ 以获取 `Paths` 的 `Stream`并将结果赋值给本地变量 `list`。接下来，它使用一个 `Predicate` 过滤流，包含所有名称以 `.java`\
    \ 结尾的 `Paths`，并调用 `forEach` 方法打印路径。\n\n### 映射\n\n`Stream` 接口的 `map` 方法通过将元素传递给函数将流中的每个元素映射为结果。以下是\
    \ `map` 的签名。\n\n```java\n <R> Stream<R> map(java.util.function.Function<? super\
    \ T,\n        ? extends R)\n```\n\n从签名中可以看出，`map` 方法返回一个新的 `Stream`，其元素类型可能与当前流的元素类型不同。\n\
    \n考虑列表 4.6 中的代码，它展示了一个更实用、更真实的流示例，用于计算公司所有员工的平均年龄。它分两个步骤完成：首先，调用 `map` 方法将 `Employee`对象的\
    \ `Stream` 转换为 `Period` 对象的 `Stream`。新流中的每个 `Period` 元素包含今天到每个员工生日之间的间隔。换句话说，每个\
    \ `Period` 元素包含一个员工的年龄。在第二步中，代码调用 `mapToLong` 方法计算所有员工的平均年龄。\n\n### 列表 4.6：StreamMapDemo\
    \ 类\n\n"
- fmt: "\n```\n package app04;\nimport java.time.LocalDate;\nimport java.time.Month;\n\
    import java.time.Period;\nimport java.util.stream.Stream;\n\npublic class StreamMapDemo\
    \ {\n    class Employee {\n        public String name;\n        public LocalDate\
    \ birthday;\n        public Employee(String name, LocalDate birthday) {\n    \
    \        this.name = name;\n            this.birthday = birthday;\n        }\n\
    \    }\n\n    public Employee[] getEmployees() {\n        Employee[] employees\
    \ = { \n            new Employee(\"Will Biteman\", \n                    LocalDate.of(1984,\
    \ Month.JANUARY, 1)), \n            new Employee(\"Sue Everyman\", \n        \
    \            LocalDate.of(1980, Month.DECEMBER, 25)),\n            new Employee(\"\
    Ann Wangi\",\n                    LocalDate.of(1976, Month.JULY, 4)),\n      \
    \      new Employee(\"Wong Kaching\",\n                    LocalDate.of(1980,\
    \ Month.SEPTEMBER, 1))\n        };\n        return employees;\n    }\n\n    public\
    \ double calculateAverageAge(Employee[] employees) {\n        LocalDate today\
    \ = LocalDate.now();\n        Stream<Employee> stream = Stream.of(employees);\n\
    \        Stream<Period> periods = stream.map(\n                (employee)-> Period.between(\n\
    \                        employee.birthday, today));\n        double avgAge =\
    \ periods.mapToLong(\n                (period)->period.toTotalMonths())\n    \
    \            .average().getAsDouble() / 12;\n        return avgAge;\n    }\n\n\
    \    public static void main(String[] args) {\n        StreamMapDemo demo = new\
    \ StreamMapDemo();\n        Employee[] employees = demo.getEmployees();\n    \
    \    double avgAge = demo.calculateAverageAge(employees);\n        System.out.printf(\"\
    Average employee age : %2.2f\\n\",\n                avgAge);\n    }\n}\n```\n\n\
    If you run the `StreamMapDemo` class, you will see the average age of the employees.\
    \ Of course, the result will depend on when you run the program. When I ran it\
    \ on my computer at the time of writing this book, I got the following result.\n\
    \n```\n Average employee age : 34.13\n```\n\n## Reduction\n\nOne of the more useful\
    \ methods in `Stream` is `reduce`, which can perform reduction operations. There\
    \ are two overloads of this method:\n\n```\n java.util.Optional<T> reduce(java.util.function.BinaryOperator<T>\
    \ \n        accumulator)\nT reduce(T identity,\n        java.util.function.BinaryOperator<T>\
    \ accumulator)\n```\n\nLooking at the two signatures, you probably notice that\
    \ the `reduce` method reduces a `Stream` of type `T` to a single instance of type\
    \ `T`, with the help of the specified `BinaryOperator`. Even though the description\
    \ in the Java documentation is not that intuitive, in reality this method is not\
    \ that hard to understand.\n\nFigure 4.1 shows what happens behind the scene when\
    \ a sequential stream of four elements is being reduced.\n\n![](Images/0401.png)\n\
    \nFigure 4.1: Reducing a stream\n\nFirst, `element-1` and `element-2` are used\
    \ as operands to the specified binary operator. The result of this operation is\
    \ an object of the same type as the elements, which I call `result-a`. Next, `result-a`\
    \ and `element-3` are passed to the binary operator, resulting `result-b`, which\
    \ again has the same type as the elements. Finally, `result-b` and `element-4`\
    \ are passed to the binary operator, returning `result-c`. Since there is no more\
    \ element in the stream, `result-c` is returned as the result of the reduction.\n\
    \nFor a parallel stream, operations can be done in parallel. This means, the operation\
    \ on `element-1` and `element-2` may take place at the same time as the operation\
    \ on `element-3` and `element-4`, and then the results of the first operation\
    \ and the second operation are passed to the binary operator and its result returned.\n\
    \nOkay. Let’s now look at an example.\n\nThe `StreamReductionDemo1` class in Listing\
    \ 4.7 shows a `Stream` of four `Order` objects that is reduced to a single `Order`\
    \ object, which is the `Order` placed most recently and having the largest value.\n\
    \nListing 4.7: StreamReductionDemo1 class\n\n```\n package app04;\nimport java.time.LocalDate;\n\
    import java.time.Month;\nimport java.util.Optional;\nimport java.util.stream.Stream;\n\
    \npublic class StreamReductionDemo1 {\n    class Order {\n        public int orderId;\n\
    \        public double value;\n        public LocalDate orderDate;\n        public\
    \ Order(int orderId, double value, \n                LocalDate orderDate) {\n\
    \            this.orderId = orderId;\n            this.value = value;\n      \
    \      this.orderDate = orderDate;\n        }\n    }\n\n    public Order[] getOrders()\
    \ {\n        Order[] orders = {\n            new Order(1, 100.49,  \n        \
    \            LocalDate.of(2014, Month.DECEMBER, 11)), \n            new Order(1,\
    \ 88.09,  \n                    LocalDate.of(2014, Month.DECEMBER, 29)), \n  \
    \          new Order(1, 10.29,  \n                    LocalDate.of(2014, Month.DECEMBER,\
    \ 30)), \n            new Order(1, 100.49,\n                    LocalDate.of(2014,\
    \ Month.NOVEMBER, 22)) \n        };\n        return orders;\n    }\n\n    public\
    \ Optional<Order> getLatestOrder(Order[] orders) {\n        Stream<Order> stream\
    \ = Stream.of(orders);\n        Optional<Order> theOrder = stream.reduce((a, b)\
    \ -> {\n                if (a.value > b.value) {\n                    return a;\n\
    \                } else if (a.value < b.value) {\n                    return b;\n\
    \                } else {\n                    if (a.orderDate.isAfter(b.orderDate))\
    \ {\n                        return a;\n                    } else {\n       \
    \                 return b;\n                    }\n                }\n      \
    \      });\n        return theOrder;\n    }\n\n    public static void main(String[]\
    \ args) {\n        StreamReductionDemo1 demo = new StreamReductionDemo1();\n \
    \       Order[] orders = demo.getOrders();\n        Optional<Order> latestLargest\
    \ = demo.getLatestOrder(orders);\n        if (latestLargest.isPresent()) {\n \
    \           Order order = latestLargest.get();\n            System.out.printf(\"\
    Latest largest order value: $%2.2f,\",\n                    order.value);\n  \
    \          System.out.println(\" date : \" + order.orderDate);\n        } else\
    \ {\n            System.out.println(\"No order found\");\n        }\n    }\n}\n\
    ```\n\nFirst, look at the `Order` class. The `Order` class models an order and\
    \ has three fields, `orderId`, `value` and `orderDate`. The method `main` instantiates\
    \ `StreamReductionDemo1` and calls its `getOrders` method, which returns an `Order`\
    \ array. `main` then calls the `getLatestOrder` method, passing the `Order` array.\n\
    \nThe `getLatestOrder` method is of interest here. It first creates a `Stream<Order>`\
    \ using `Stream`’s static method.\n\n``` Stream<Order> stream = Stream.of(orders);\n\
    ```\n\nIt then calls the `reduce` method on the `Stream` passing a binary operator.\n\
    \n```\n Optional<Order> theOrder = stream.reduce((a, b) -> {\n               \
    \ if (a.value > b.value) {\n                    return a;\n                } else\
    \ if (a.value < b.value) {\n                    return b;\n                } else\
    \ {\n                    if (a.orderDate.isAfter(b.orderDate)) {\n           \
    \             return a;\n                    } else {\n                      \
    \  return b;\n                    }\n                }\n            });\n```\n\
    \nThe binary operator compares the values of the two `Order` operands and returns\
    \ the one with the larger value. If both values are equal, the order with the\
    \ latest order date is returned.\n\n`main` then checks if the returned `Optional`\
    \ has an `Order`. If so, the `Order` is unwrapped and its value and date are printed.\
    \ If not, an error message will be displayed.\n\nIf you run the class you will\
    \ see this on the console.\n\n```\n Latest largest order value: $100.49, date\
    \ : 2014-12-11\n```\n\nIf the stream is empty, the `reduce` method will not throw\
    \ an exception. It simply returns an empty `Optional`.\n\nAs a second example,\
    \ consider the code in Listing 4.8. The demo class uses a `Stream` to calculate\
    \ the total order value in a given month.\n"
