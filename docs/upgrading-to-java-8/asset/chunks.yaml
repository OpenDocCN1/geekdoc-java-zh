    \ the sort methods in java.util.Arrays accepts an instance of Comparator, which\
    \ is a functional interface. The signature of the sort method is as follows.\n\
    \n```\n public static T[] sort(T[] array, Comparator<? super T> comparator)\n\
    ```\n\nInstead of passing an implementation of Comparator to the sort method,\
    \ you can pass a lambda expression. You have seen how to do this in the previous\
    \ chapter.\n\nNow, you can go one step further by passing a method reference in\
    \ lieu of a lambda expression. A method reference is simply a class name or an\
    \ object reference followed by the double colon operator (::) and a method name.\n\
    \nWhy would you want to use a method reference? There are two reasons for this.\n\
    \n1\\. A method reference has shorter syntax than a lambda expression because\
    \ a method reference does not contain a definition like a lambda expression. The\
    \ method body is defined somewhere else.\n\n2\\. You can use an existing method,\
    \ thus promoting code reuse.\n\nYou can use a reference to a static method, an\
    \ instance method or even a constructor. You use the double colon (::), a new\
    \ operator in Java 8, to separate the class name/object reference and the method/constructor\
    \ name. The class that encapsulates the referenced method does not have to implement\
    \ the functional interface.\n\nThe syntax for method references is one of the\
    \ following.\n\n```\n ClassName::staticMethodName\nContainingType::instanceMethod\n\
    objectReference::methodName\nClassName::new\n```\n\nEach of the kinds of method\
    \ references are discussed in the following sections.\n\nReference to A Static\
    \ Method\n\nA reference to a static method can be passed as an argument to a method\
    \ that expects a functional interface if the method has a compatible return type\
    \ and compatible argument types with the functional interface’s abstract method.\n\
    \nAs the first example in this topic, consider the NoMethodRef class in Listing\
    \ 2.1, which illustrates the use of a functional interface without method references.\
    \ The class defines a functional interface called StringListFormatter that takes\
    \ a List of Strings and formats the strings. The format method, the abstract method\
    \ of the interface, takes a delimiter and a List of Strings. There is also a formatAndPrint\
    \ static method that takes an instance of StringListFormatter, a delimiter and\
    \ a List of Strings. This method in turn calls the format method on the StringListFormatter\
    \ and prints the formatted list.\n\nListing 2.1: The NoMethodRef class\n\n```\n\
    \ package app02.methodref;\nimport java.util.Arrays;\nimport java.util.List;\n\
    \npublic class NoMethodRef {\n\n    @FunctionalInterface\n    interface StringListFormatter\
    \ {\n        String format(String delimiter, List<String> list);\n    }\n\n  \
    \  public static void formatAndPrint(StringListFormatter formatter, \n       \
    \     String delimiter, List<String> list) {\n        String formatted = formatter.format(delimiter,\
    \ list);\n        System.out.println(formatted);\n    }\n\n    public static void\
    \ main(String[] args) {\n        List<String> names = Arrays.asList(\"Don\", \"\
    King\", \"Kong\");\n\n        StringListFormatter formatter =\n              \
    \  (delimiter, list) -> {\n                    StringBuilder sb = new StringBuilder(100);\n\
    \                    int size = list.size();\n                    for (int i =\
    \ 0; i < size; i++) {\n                        sb.append(list.get(i));\n     \
    \                   if (i < size - 1) {\n                            sb.append(delimiter);\n\
    \                        }\n                    }\n                    return\
    \ sb.toString();\n                };\n        formatAndPrint(formatter, \", \"\
    , names);\n    }\n}\n```\n\nThe main method in NoMethodRef constructs a string\
    \ list with three elements and creates an implementation of StringListFormatter\
    \ with this lambda expression.\n\n```\n StringListFormatter formatter =\n    \
    \            (delimiter, list) -> {\n                    StringBuilder sb = new\
    \ StringBuilder(100);\n                    int size = list.size();\n         \
    \           for (int i = 0; i < size; i++) {\n                        sb.append(list.get(i));\n\
    \                        if (i < size - 1) {\n                            sb.append(delimiter);\n\
    \                        }\n                    }\n                    return\
    \ sb.toString();\n                };\n```\n\nBasically, it iterates over the List\
    \ and adds a delimiter between two elements. No delimiter is appended after the\
    \ last element.\n\nThe main method then calls the formatAndPrint method passing\
    \ the lambda expression , a delimiter and the string list. If you run NoMethodRef,\
    \ you will see the formatted list:\n\n```\n Don, King, Kong\n```\n\nAfter spending\
    \ twenty minutes writing the code, you realized that the lambda expression does\
    \ the same job as the join method of the String class. This is a static method\
    \ added to String in JDK 1.8\\. One of its overrides has the following signature.\n\
    \n```\n public static String join(CharSequence delimiter,\n        Iterable<?\
    \ extends CharSequence> elements)\n```\n\nCompare it with the format method in\
    \ the functional interface in Listing 2.1.\n\n```\n public String format(java.langString\
    \ delimiter, \n        java.util.List<String> list);\n```\n\nSince List extends\
    \ Iterable and String implements CharSequence, join is compatible with format.\n\
    \nA method reference allows you to reuse an existing implementation such as String.join().\
    \ As such, you can rewrite the NoMethodRef class to use a reference to String.join().\
    \ This is illustrated in the MethodReferenceDemo1 class in Listing 2.2.\n\nListing\
    \ 2.2: The MethodReferenceDemo1 class\n\n```\n package app02.methodref;\nimport\
    \ java.util.Arrays;\nimport java.util.List;\n\npublic class MethodReferenceDemo1\
    \ {\n\n    @FunctionalInterface\n    interface StringListFormatter {\n       \
    \ String format(String delimiter, List<String> list);\n    }\n\n    public static\
    \ void formatAndPrint(StringListFormatter formatter, \n            String delimiter,\
    \ List<String> list) {\n        String formatted = formatter.format(delimiter,\
    \ list);\n        System.out.println(formatted);\n    }\n\n    public static void\
    \ main(String[] args) {\n        List<String> names = Arrays.asList(\"Don\", \"\
    King\", \"Kong\");\n        formatAndPrint(String::join, \", \", names);\n   \
    \ }\n}\n```\n\nYou still have the same StringListFormatter interface and the same\
    \ formatAndPrint method. However, the main method no longer contains a lambda\
    \ expression implementing StringListFormatter. Instead, you use String.join as\
    \ an implementation of StringListFormatter.\n\n```\n formatAndPrint(String::join,\
    \ \", \", names);\n```"
