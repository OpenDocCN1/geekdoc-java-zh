    \ replace Swing, and to ease transition from Swing to JavaFX, there is support\
    \ for interoperability between the two. You can easily use Swing components from\
    \ within your JavaFX application.\n\nAs a desktop technology, JavaFX is an excellent\
    \ choice for any Java developer or anyone aspiring to be a GUI developer, thanks\
    \ to its features and ease of use. In addition, JavaFX enjoys the full support\
    \ from Oracle and the Java community at large, so getting help is easy."
