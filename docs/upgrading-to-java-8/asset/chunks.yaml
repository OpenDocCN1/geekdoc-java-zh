  trans: "\n处理日期和时间经常涉及解析和格式化。Date and Time API 通过在其所有主要类中提供 `parse` 和 `format` 方法来解决这两个问题。此外，`java.time.format`\
    \ 包含一个 `DateTimeFormatter` 类，用于格式化日期和时间。\n\n# Instant 类\n\n`Instant` 对象表示时间线上的一个点。参考点是标准的\
    \ Java 纪元（epoch），即 `1970-01-01T00:00:00Z`（格林威时间 1970 年 1 月 1 日 00:00）。`Instant`\
    \ 类的 `EPOCH` 字段返回一个表示 Java 纪元的 `Instant`。纪元之后的 `Instant` 值为正值，之前的 `Instant` 值为负值。\n\
    \n`Instant` 的静态方法 `now()` 返回一个表示当前时间的 `Instant` 对象：\n\n```java\n Instant now =\
    \ Instant.now();\n```\n\n`getEpochSecond()` 方法返回自纪元以来经过的秒数。`getNano()` 方法返回自上一秒开始经过的纳秒数。\n\
    \n`Instant` 类的一个常见用法是对操作进行计时，如列表 5.1 所示。\n\n**列表 5.1：使用 Instant 对操作计时**\n\n```java\n\
    \ package app05;\nimport java.time.Duration;\nimport java.time.Instant;\n\npublic\
    \ class InstantDemo1 {\n    public static void main(String[] args) {\n       \
    \ Instant start = Instant.now();\n        // do something here\n        Instant\
    \ end = Instant.now();\n        System.out.println(Duration.between(start, end).toMillis());\n\
    \    }\n}\n```\n\n如列表 5.1 所示，使用 `Duration` 类来返回两个 `Instant` 之间的差值。你将在本章后面学习更多关于\
    \ `Duration` 的知识。\n\n# LocalDate\n\n`LocalDate` 类模拟不包含时间组件的日期。它也没有时区。表 5.1 显示了\
    \ `LocalDate` 中一些重要的方法。\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `now` | 返回今日日期的静态方法。\
    \ |\n| `of` | 根据指定的年、月、日创建 `LocalDate` 的静态方法。 |\n| `getDayOfMonth`, `getMonthValue`,\
    \ `getYear` | 以 `int` 类型返回此 `LocalDate` 的日、月或年。 |\n| `getMonth` | 以 `Month` 枚举常量返回此\
    \ `LocalDate` 的月份。 |\n| `plusDays`, `minusDays` | 在此 `LocalDate` 上增加或减去指定的天数。\
    \ |\n| `plusWeeks`, `minusWeeks` | 在此 `LocalDate` 上增加或减去指定的周数。 |\n| `plusMonths`,\
    \ `minusMonths` | 在此 `LocalDate` 上增加或减去指定的月数。 |\n| `plusYears`, `minusYears` |\
    \ 在此 `LocalDate` 上增加或减去指定的年数。 |\n| `isLeapYear` | 检查此 `LocalDate` 指定的年份是否为闰年。\
    \ |\n| `isAfter`, `isBefore` | 检查此 `LocalDate` 是否在给定日期之后或之前。 |\n| `lengthOfMonth`\
    \ | 返回此 `LocalDate` 所在月份的天数。 |\n| `withDayOfMonth` | 返回此 `LocalDate` 的副本，并将日中的设置为给定值。\
    \ |\n| `withMonth` | 返回此 `LocalDate` 的副本，将月份设置为给定值。 |\n| `withYear` | 返回此 `LocalDate`\
    \ 的副本，将年份设置为给定值。 |\n\n**表 5.1：LocalDate 的更多重要方法**\n\n`LocalDate` 提供了多种方法来创建日期。例如，要创建一个代表今天的\
    \ `LocalDate`，请使用静态方法 `now`。\n\n```java\n LocalDate today = LocalDate.now();\n\
    ```\n\n创建一个表示特定年、月、日的 `LocalDate`，使用其静态方法 `of`。例如，以下代码段创建了一个表示 2015 年 12 月 31\
    \ 日的 `LocalDate`：\n\n```java\n LocalDate endOfYear = LocalDate.of(2015, 12, 31);\n\
    ```\n\n`of` 方法另一个重载版本，接受 `java.time.Month` 枚举作为第二个参数。例如，这里使用重载方法构造相同的日期：\n\n```java\n\
    \ LocalDate endOfYear = LocalDate.of(2015, Month.DECEMBER, 31);\n```\n\n还有用于获取\
    \ `LocalDate` 的日、月或年的方法，例如 `getDayOfMonth`、`getMonthValue` 和 `getYear`。它们都不接受参数，并返回\
    \ `int` 或 `Month` 枚举。此外，还有一个 `get` 方法接受 `TemporalField` 并返回此 `LocalDate` 的部分。例如，将\
    \ `ChronoField.YEAR` 传递给 `get` 会返回 `LocalDate` 的年份：\n\n```java\n int year = localDate.get(ChronoField.YEAR);\n\
    ```\n\n`ChronoField` 是实现 `TemporalField` 接口的枚举，因此你可以向 `get` 方法传递一个 `ChronoField`\
    \ 常量。`TemporalField` 和 `ChronoField` 属于 `java.time.temporal` 包。然而，并不是所有的 `ChronoField`\
    \ 都可以传递给 `get`。例如，将 `ChronoField.SECOND_OF_DAY` 传递给 `get` 会抛出异常。因此，与其使用 `get`，不如使用\
    \ `getMonth`、`getYear` 或类似的方法来获取 `LocalDate` 的组件。\n\n还有用于复制 `LocalDate` 的方法，如\
    \ `plusDays`、`plusYears`、`minusMonths` 等。例如，要获取代表明日 `LocalDate`，可以创建一个代表今天的 `LocalDate`\
    \ 然后调用其 `plusDays` 方法。\n\n```java\n LocalDate tomorrow = LocalDate.now().plusDays(1);\n\
    ```\n\n要获取代表昨日的 `LocalDate`，可以使用 `minusDays` 方法。\n\n```java\n LocalDate yesterday\
    \ = LocalDate.now().minusDays(1);\n```\n\n此外，还有 `plus` 和 `minus` 方法以更通的方式获取 `LocalDate`\
    \ 副本。它们都接受 `long` 和 `TemporalUnit`。这些方法的签名如下：\n\n```java\n public LocalDate plus(long\
    \ amountToAdd, java.time.temporal.TemporalUnit unit)\npublic LocalDate minus(long\
    \ amountSubtract, java.time.temporal.TemporalUnit unit)\n```\n\n例如，要获取代表十年前日期的\
    \ `LocalDate`，可以使用代码：\n\n```java\n LocalDate pastDate = LocalDate.now().minus(2,\
    \ ChronoUnit.DECADES);\n```\n\n`ChronoUnit` 是实现 `TemporalUnit` 的枚举，因此你可以向 `plus`\
    \ 或 `minus` 方法传递 `ChronoUnit`常量。`LocalDate` 是不可变的，因此无法更改。任何返回 `LocalDate` 的方法都会返回一个新实例。\n\
    \n列表 5.2 展示了 `LocalDate` 的示例。\n\n```java\n package app05;\nimport java.time.LocalDate;\n\
    import java.time.temporal.ChronoField;\nimport java.time.temporal.ChronoUnit;\n\
    \npublic class LocalDateDemo1 {\n    public static void main(String[] args) {\n\
    \        LocalDate today = LocalDate.now();\n        LocalDate tomorrow = today.plusDays(1);\n\
    \        LocalDate oneDecadeAgo = today.minus(1, ChronoUnit.DECADES);\n      \
    \  System.out.println(\"Day of month: \" + today.getDayOfMonth());\n        System.out.println(\"\
    Today is \" + today);\n        System.out.println(\"Tomorrow is \" + tomorrow);\n\
    \        System.out.println(\"A decade ago was \" + oneDecadeAgo);\n        System.out.println(\"\
    Year : \" + today.get(ChronoField.YEAR));\n    }\n}\n```\n\n# Period 类\n\n`Period`\
    \ 类模拟了基于日期的时间量，例如五天、一周或三年。其一些重要方法在表 5.2 中。\n\n| 方法 | 说明 |\n| :--- | :--- |\n|\
    \ `between` | 在两个 `LocalDate` 之间创建一个 `Period`。 |\n| `ofDays`, `ofWeeks`, `ofMonths`,\
    \ `ofYears` | 创建表示给定天数/周/月/年的 `Period`。 |\n| `of` | 根据给定的年、月、日创建一个 `Period`。 |\n\
    | `getDays`, `getMonths`, `getYears` | 以 `int` 类型返回此期的日、月、年。 |\n| `isNegative`\
    \ | 如果此 `Period` 的三个组件之一为负值，则返回 `true`。否则返回 `false`。 |\n| `isZero` | 如果此 `Period`\
    \ 的三个组件都为零，则返回 `true`。否则返回 `false`。 |\n| `plusDays`, `minusDays` | 在此 `Period`\
    \ 上增加或减去指定的天数。 |\n| `plusMonths`, `minusMonths` | 在此 `Period` 上增加或减去指定的月数。 |\n"
- fmt: "\n| `plusYears`, `minusYears` | Adds or subtracts the given number of years\
    \ to or from this `Period`. |\n| `withDays` | Returns a copy of this `Period`\
    \ with the specified number of days. |\n| `withMonths` | Returns a copy of this\
    \ `Period` with the specified number of months. |\n| `withYears` | Returns a copy\
    \ of this `Period` with the specified number of years. |\n\n### Table 5.2 More\
    \ important methods of `Period`\n\nCreating a `Period` is easy, thanks to the\
    \ static factory methods between `of`, `ofDays()`, `ofWeeks()`, `ofMonths()`,\
    \ and `ofYears`. For example, here is how you create a `Period` representing two\
    \ weeks.\n\n```\nPeriod twoWeeks = Period.ofWeeks(2);\n```\n\nTo create a `Period`\
    \ representing one year, two months and three days, use the `of` method.\n\n```\n\
    Period p = Period.of(1, 2, 3);\n```\n\nTo obtain the year/month/day component\
    \ of a `Period`, call its `getYears()`, `getMonths()`, and `getDays()` method.\
    \ For instance, the `howManyDays` variable in the following code snippet will\
    \ have a value of 14.\n\n```\nPeriod twoWeeks = Period.ofWeeks(2);\nint howManyDays\
    \ = twoWeeks.getDays();\n```\n\nFinally, you can create a copy of a `Period` using\
    \ the `plusXXX` or `minusXXX` methods as well as one of the `withXXX` methods.\
    \ A `Period` is immutable so these methods return new `Period` instances.\n\n\
    As an example, the code in Listing 5.3 shows an age calculator that calculates\
    \ a person’s age. It creates a `Period` from two `LocalDate`s and calls its `getDays()`,\
    \ `getMonths()`, and `getYears()` methods.\n\n#### Listing 5.3: Using `Period`\n\
    \n```java\npackage app05;\nimport java.time.LocalDate;\nimport java.time.Period;\n\
    \npublic class PeriodDemo1 {\n    public static void main(String[] args) {\n \
    \       LocalDate dateA = LocalDate.of(1978, 8, 26);\n        LocalDate dateB\
    \ = LocalDate.of(1988, 9, 28);\n        Period period = Period.between(dateA,\
    \ dateB);\n        System.out.printf(\"Between %s and %s\"\n                +\
    \ \" there are %d years, %d months\"\n                + \" and %d days%n\", dateA,\
    \ dateB, \n                period.getYears(), \n                period.getMonths(),\n\
    \                period.getDays());\n    }\n}\n```\n\nWhen run, the `PeriodDemo1`\
    \ class in Listing 5.3 will print this string.\n\n```\nBetween 1978-08-26 and\
    \ 1988-09-28 there are 10 years, 1 months and 2 \ndays\n```\n\n### LocalDateTime\n\
    \nThe `LocalDateTime` class models a date-time without a time zone. Table 5.3\
    \ shows some of the more important methods in `LocalDateTime`. The methods are\
    \ similar to those of `LocalDate` plus some other methods for modifying the time\
    \ component, such as `plusHours()`, `plusMinutes()`, and `plusSeconds()`, that\
    \ are not available in `LocalDate`.\n\n| Method | Description |\n| :--- | :---\
    \ |\n| `now` | A static method that returns the current date and time. |\n| `of`\
    \ | A static method that creates a `LocalDateTime` from the specified year, month,\
    \ date, hour, minute, second and millisecond. |\n| `getYear`, `getMonthValue`,\
    \ `getDayOfMonth`, `getHour`, `getMinute`, `getSecond` | Returns the year, month,\
    \ day, hour, minute or second part of this `LocalDateTime` as an `int`. |\n| `plusDays`,\
    \ `minusDays` | Adds or subtracts the given number of days to or from the current\
    \ `LocalDateTime`. |\n| `plusWeeks`, `minusWeeks` | Adds or subtracts the given\
    \ number of weeks to or from the current `LocalDateTime`. |\n| `plusMonths`, `minusMonths`\
    \ | Adds or subtracts the given number of months to or from the current `LocalDateTime`.\
    \ |\n| `plusYears`, `minusYears` | Adds or subtracts the given number of years\
    \ to or from the current `LocalDateTime`. |\n| `plusHours`, `minusHours` | Adds\
    \ or subtracts the given number of hours to or from the current `LocalDateTime`.\
    \ |\n| `plusMinutes`, `minusMinutes` | Adds or subtracts the given number of minutes\
    \ to or from the current `LocalDateTime`. |\n| `plusSeconds`, `minusSeconds` |\
    \ Add or subtracts the given number of seconds to or from the current `LocalDateTime`.\
    \ |\n| `isAfter`, `isBefore` | Checks if this `LocalDateTime` is after or before\
    \ the given date-time. |\n| `withDayOfMonth` | Returns a copy of this `LocalDateTime`\
    \ with the day of month set to the given value. |\n| `withMonth`, `withYear` |\
    \ Returns a copy of this `LocalDateTime` with the month or year set to the given\
    \ value. |\n| `withHour`, `withMinute`, `withSecond` | Returns a copy of this\
    \ `LocalDateTime` with the hour/minute/second set to the given value. |\n\n####\
    \ Table 5.3: More important methods of `LocalDateTime`\n\n`LocalDateTime` offers\
    \ various static methods to create a date-time. The method `now` comes with three\
    \ overrides and return the current date-time. The no-argument override is the\
    \ easiest to use:\n\n```\nLocalDateTime now = LocalDateTime.now();\n```\n\nTo\
    \ create a `LocalDateTime` with a specific date and time, use the `of` method.\
    \ This method has a number of overrides and allows you to pass the individual\
    \ component of a date-time or a `LocalDate` and a `LocalTime`. Here are the signatures\
    \ of some of the `of` methods.\n\n```java\npublic static LocalDateTime of(int\
    \ year, int month, int dayOfMonth, int hour, int minute)\npublic static LocalDateTime\
    \ of(int year, int month, int dayOfMonth, int hour, int minute)\npublic static\
    \ LocalDateTime of(int year, Month month, int dayOfMonth, int hour, int minute)\n\
    public static LocalDateTime of(int year, Month month, int dayOfMonth, int hour,\
    \ int minute)\npublic static LocalDateTime of(LocalDate date, LocalTime time)\n\
    ```\n\nFor instance, the following snippet creates a `LocalDateTime` that represents\
    \ December 31, 2015 at eight o’clock in the morning.\n\n```\nLocalDateTime endOfYear\
    \ = LocalDateTime.of(2015, 12, 31, 8, 0);\n```\n\nYou can create a copy of a `LocalDateTime`\
    \ using the `plusXXX` or `minusXXX` method. For example, this code creates a `LocalDateTime`\
    \ that represents the same time tomorrow.\n\n```\nLocalDateTime now = LocalDateTime.now();\n\
    LocalDateTime sameTimeTomorrow = now.plusHours(24);\n```\n\n### Time Zones\n\n\
    The Internet Assigned Numbers Authority (IANA) maintains a database of time zones\
    \ that you can download from this web page:\n\n```\nhttp://www.iana.org/time-zones\n\
    ```\n\nFor easy viewing, however, you can just visit this Wikipedia page:\n\n\
    ```\nhttp://en.wikipedia.org/wiki/List_of_tz_database_time_zones\n```\n\nThe Java\
    \ Date and Time API caters for time zones too. The abstract class `ZoneId` (in\
    \ `java.time`) represents a zone identifier. It has a static method `getAvailableZoneIds()`\
    \ that returns all zone identifiers. Listing 5.4 shows how you can print a sorted\
    \ list of all zones using this method.\n\n#### Listing 5.4: Listing all zone identifiers\n\
    \n```java\npackage app05;\nimport java.time.ZoneId;\nimport java.util.ArrayList;\n\
    import java.util.Collections;\nimport java.util.List;\nimport java.util.Set;\n\
    \npublic class ZoneDemo1 {\n    public static void main(String[] args) {\n   \
    \     Set<String> allZoneIds = ZoneId.getAvailableZoneIds();\n        List<String>\
    \ zoneList = new ArrayList<>(allZoneIds);\n\n        Collections.sort(zoneList);\n\
    \        for (String zoneId : zoneList) {\n            System.out.println(zoneId);\n\
    \        }\n        // alternatively, you can use this line of code to\n     \
    \   // print a sorted list of zone ids\n        // ZoneId.getAvailableZoneIds().stream().sorted()\n\
    \        //        forEach(System.out::println);\n    }\n}\n```\n\n`getAvailableZoneIds()`\
    \ returns a `Set` of `String`. You can sort the `Set` using `Collections.sort()`\
    \ or more elegantly by calling its `stream` method. You could have written this\
    \ code to sort the zone identifiers.\n\n```\nZoneId.getAvailableZoneIds().stream().sorted()\n\
    \        .forEach(System.out::println);\n```\n\n`getAvailableZoneIds()` returns\
    \ a `Set` of 586 zone identifiers. Here are some of the zone identifiers from\
    \ the code above.\n\n```\nAfrica/Cairo\nAfrica/Johannesburg\nAmerica/Chicago\n\
    America/Los_Angeles\nAmerica/Mexico_City\nAmerica/New_York\nAmerica/Toronto\n\
    Antarctica/South_Pole\nAsia/Hong_Kong\nAsia/Shanghai\nAsia/Tokyo\nAustralia/Melbourne\n\
    Australia/Sydney\nCanada/Atlantic\nEurope/Amsterdam\nEurope/London\nEurope/Paris\n\
    US/Central\nUS/Eastern\nUS/Pacific\n```\n\n### ZonedDateTime\n\nThe `ZonedDateTime`\
    \ class models a date-time with a time zone. For example, the following is a zoned\
    \ date-time:\n\n```\n2015-12-31T10:59:59+01:00 Europe/Paris\n```\n"
