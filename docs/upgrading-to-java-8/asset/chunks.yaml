    \ Parent.\n\n```\n public Scene(Parent root)\n```\n\nThere are other constructors\
    \ that let you specify the dimension of the Scene as well as its fill.\n\n```\n\
    \ public Scene(Parent root, double width, double height)\npublic Scene(Parent\
    \ root, javafx.scene.paint.Paint fill)\npublic Scene(Parent root, double width,\
    \ double height, \n        javafx.scene.paint.Paint fill)\n```\n\nUI Components"
