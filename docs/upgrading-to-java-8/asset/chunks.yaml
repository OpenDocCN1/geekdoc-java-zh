    \ b on ArrayList 3\n\"addAll\" called on ArrayList 2\n\"addAll\" called on ArrayList\
    \ 1\n\"addAll\" called on ArrayList 1\na\nb\nc\nd\n```\n\nYou see that the `Supplier`\
    \ was called four times since there were four elements in the stream, resulting\
