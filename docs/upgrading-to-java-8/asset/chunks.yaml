    \ Dec 2014 : $%2.2f\\n\",\n                totalSalesForMonth);\n    }\n}\n```\n\
    \n`StreamReductionDemo2` 类使用了与 `StreamReduceDemo1` 相同的 `Order` 对象。`calculateSalesTotal`\
    \ 方法从 `Order` 数组创建了一个 `Stream`，过滤出具有给定年份/月份的 `Orders`，并将元素映射为双，最后将它们归约为 ` `double`。\n\
    \n如果你运行这个演示类，你将在控制台上看到这些：\n\n```\n Sales for Nov 2014 : $100.49\nSales for Dec\
    \ 2014 : $198.87\n```\n\n## 可变归约 (Mutable Reductions)\n\n可变归约操作将 `Stream` 的元素累积到一个容器中并返回该容器。该容器是可变的，因此被称为可变。\n\
    \n你使用 `Stream` 接口的 `collect` 方法来执行可变归约操作。它的签名如下：\n\n```\n <R> R collect(java.util.function.Supplier<R>\
    \ supplier,\n        java.util.function.BiConsumer<R, ? super T> accumulator,\n\
    \        java.util.function.BiConsumer<R, R> combiner);\n```\n\n`collect` 方法分三个步骤完成工作，每一步处理该方法的一个参数。\n\
    \n在第一步中，方法处理其第一个参数，它是一个 `Supplier`，用于返回一个容器（如 `Collection` 或 `StringBuilder`）。在顺序流中，`Supplier`\
    \ 只会被调用一次，且只会存在一个容器。但在并行流中，`Supplier` 可能会被调用多次，并可能存在多个容器。\n\n在第二步中，方法处理第二个参数，它是一个执行收集的\
    \ `BiConsumer`。请记住，`BiConsumer` 接受两个不同类型的参数且不返回任何值。实践中，`BiConsumer` 将每个流元素添加到\
    \ `Supplier` 产生的容器或多个容器中。在顺序流中，所有元素都被添加到同一个容器中，因为只有一个容器。在并行流中，每个元素被添加到不同的容器中。\n\
    \n在最后一步中，方法处理第三个参数，它也是一个 `BiConsumer`。在顺序流中，不会发生任何处理，该参数由于从未被调用而没有任何影响。尽管如此，你不能将\
    \ `null` 作为第三个参数。在并行流中，收集器将使用 `BiConsumer` 指定的操作进行合并。\n\n这种操作的第一个示例在列表 4.9 中。它演示了你如何将字符串数组收集到\
    \ `StringBuilder` 中。涉及到两个流，它们都在做相同的事情。第一个流使用 lambda 表达式，第二个流使用方法引用。\n\n### 列表\
    \ 4.9: StreamCollectDemo1 类\n\n```\n package app04;\nimport java.util.stream.Stream;\n\
    \npublic class StreamCollectDemo1 {\n    public static void main(String[] args)\
    \ {\n        String[] strings = { \"a\", \"b\", \"c\", \"d\" };\n        Stream<String>\
    \ stream1 = Stream.of(strings);\n        StringBuilder sb1 = stream1.collect(\n\
    \                () -> new StringBuilder(),\n                (a1, b1) -> a1.append(b1),\n\
    \                (a2, b2) -> a2.append(b2));\n        System.out.println(sb1.toString());\n\
    \n        Stream<String> stream2 = Stream.of(strings);\n        StringBuilder\
    \ sb2 = stream2.collect(\n                StringBuilder::new,\n              \
    \  StringBuilder::append,\n                StringBuilder::append);\n        System.out.println(sb2.toString());\n\
    \    }\n}\n```\n\n对于每个流，`collect` 方法通过创建一个 `StringBuilder` 开始。由于涉及到顺序流，只有一个容器。接下来，方法将每个流元素添加到\
    \ `StringBuilder` 中。由于流中有四个元素，`StringBuilder` 的 `append` 方法被调用四次。\n\n由于这是顺序流，第三参数没有没有处理。`collect`\
    \ 方法直接返回包含“abcd”的 `StringBuilder`。\n\n列表 4.10 显示了可变归约的第二个示例。这次我在顺序流中使用 `List`\
    \ 作为容器。同样涉及到两个流，一个使用 lambda 表达式，另一个使用方法引用。这里的 `collect` 方法返回一个包含四个元素的 `List`。\n\
    \n### 列表 4.10: StreamCollectDemo2 类\n\n```\n package app04;\nimport java.util.ArrayList;\n\
    import java.util.List;\nimport java.util.stream.Stream;\n\npublic class StreamCollectDemo2\
    \ {\n    public static void main(String[] args) {\n        String[] strings =\
    \ { \"a\", \"b\", \"c\", \"d\" };\n        Stream<String> stream1 = Stream.of(strings);\n\
    \        List<String> list1 = stream1.collect(\n                () -> new ArrayList<>(),\n\
    \                (a1, b1) -> a1.add(b1),\n                (a2, b2) -> a2.addAll(b2));\n\
    \        for (String s: list1) {\n            System.out.println(s);\n       \
    \ }\n\n        Stream<String> stream2 = Stream.of(strings);\n        List<String>\
    \ list2 = stream2.collect(\n                ArrayList::new,\n                ArrayList::add,\n\
    \                ArrayList::addAll);\n        for (String s: list2) {\n      \
    \      System.out.println(s);\n        }\n    }\n}\n```\n\n该类别的最后一个示例——列表 4.11\
    \ 中的 `StreamCollectDemo3` 类，是对 `StreamCollectDemo1` 的重写。然而，使用了并行流来向你展示收集到底是如何工作的。为了展示每个参数被处理的精确时刻，我还通过扩展\
    \ `ArrayList` 并重写其 `add` 和 `addAll` 方法创建了一个自定义的 `Supplier`。这些新方法会打印消息并调用父类方法。\n\
    \n"
