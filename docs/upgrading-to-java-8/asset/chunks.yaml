    \nThis is expected, because there are two hours difference between the time zones\
    \ America/Denver and America/Toronto.\n\nAs a more complex example, the code in\
    \ Listing 5.7 shows a bus travel time calculator. It has one method, calculateTravelTime,\
    \ which takes a departure ZonedDateTime and an arrival ZonedDateTime. The code\
    \ calls the calculateTravelTime method twice. Both times the bus departs from\
    \ Denver, Colorado at 8 in the morning Denver time and arrives in Toronto at 8\
    \ in the next morning Toronto time. The first time the bus leaves on March 8,\
    \ 2014 and the second time it leaves on March 18, 2014.\n\nWhat are the travel\
    \ time in both occasions?\n\nListing 5.7: Travel time calculator"
