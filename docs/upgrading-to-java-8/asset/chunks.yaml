  trans: "\n\n### 列表 8.1: `test1.js` 文件\n\n```\n function add(a, b) {\n    return\
    \ a + b;\n}\nvar c = add(10, 20)\nprint(c)\n```\n\n现在，调用 `jjs` 并传递 `test1.js`：\n\
    \n```\n $ jjs test1.js\n30\n```\n\n如前所述，`jjs` 可以配合选项使用。表 8.1 列出了部分选项。\n\n| 选项\
    \ |  |\n| :--- | :--- |\n| `-ccs=size` 或 `--class-cache-size=size` | 指定以字节为单位的类缓存大小。字母\
    \ `k` 或 `K` 表示千字节，`m` 或 `M` 表示兆字节，`g` 或 `G` 表示字节。默认类缓存大小为 50。 |\n| `-co` 或 `--compile-only`\
    \ | 编译脚本但不运行它。 |\n| `-cp` 或 `-classpath` | 指定类路径。此选项可以重复使用以指定多个类路径。 |\n| `-Dname=value`\
    \ | 传递系统属性键和值。 |\n| `-d=path` 或 `--dump-debug-dir=path` | 指定用于导出类文件的目录路径。 |\n\
    | `--debug-lines=true\\|false` | 表明是否在类文件中生成行号表。默认开启此选项。 |\n| `--debug-locals`\
    \ | 在类文件中生成局部变量表。 |\n| `-doe` 或 `--dump-on-error` | 发生错误时提供完整的堆栈跟踪。默认情况下，仅打印简短的错误信息。\
    \ |\n| `--early-lvalue-error` | 将无效的 lvalue 表达式报告为早期错误。 |\n| `--empty-statements`\
    \ | 在 Java 抽象语法树中保留空语句。 |\n| `-fv` 或 `-fullversion` | 打印 Nashorn 的完整版本。 |\n| `--function-statement-error`\
    \ | 当函数声明当作语句使用时打印错误信息。 |\n| `--function-statement-warning` | 当函数声明当作语句使用时打印警告信息。\
    \ |\n| `-fx` | 将脚本作为 JavaFX 启动。 |\n| `-h` 或 `-help` | 打印选项列表及其描述。 |\n| `-Joption`\
    \ | 将 Java 选项传递给 JVM。 |\n| `--lazy-compilation` | 启用懒代码生成。 |\n| `--loader-per-compile`\
    \ | 每次编译创建一个新的类加载器。 |\n| `--log=subsystem:level` | 按指定的级别记录日志。 |\n| `--package=name`\
    \ | 指定生成类的包。 |\n| `--parse-only` | 只解析代码不编译。 |\n| `--print-ast` | 打印代码的抽象语法树。\
    \ |\n| `--print-code` | 打印字节码。 |\n| `--print-lower-ast` | 打印降低后的 AST。 |\n| `--print-lower-parse`\
    \ | 打印降低后的解析树。 |\n| `--scripting` | 启用 脚本。 |\n| `--stderr=filename\\|stream\\\
    |tty` | 将标准错误流重定向到指定的文件、流或文本终端。 |\n| `--stdout=filename\\|stream\\|tty` | 将标准输出流重定向到指定的文件、流或文本终端。\
    \ |\n| `-v` 或 `-version` | 打印 Nashorn 版本。 |\n| `-xhelp` | 打印命令行选项的扩展帮助。 |\n\n\
    表 8.1：`jjs` 选项\n\n你可以使用 `-help` 选项列出所有可用选项：\n\n```\n $ jjs -help\n```\n\n或者使用\
    \ `-xhelp` 获取更完整的选项列表：\n\n```\n $ jjs -xhelp\n```\n\n如果你对底层编译器的工作原理好奇，可以尝试 `--print-ast`\
    \ 和 `--print-code` 选项。\n\n```\n $ jjs --print-ast myscript.js\n$ jjs --print-code\
    \ myscript.js\n```\n\n除了 `jjs` 外，还有另一个工具 `jrunscript`，它可以调用任何符合 JSR 223（“Java\
    \ 平台脚本语言”）的脚本引擎。在安装了 Java 8 且不带任何选项的情况下，`jrunscript` 将调用 Nashorn。\n\n```\n $ jrunscript\n\
    nashorn>\n```\n\n自己尝试一下。\n\n```\n $ jrunscript\nnashorn> print(300 + 700)\n1000\n\
    ```\n\n### 在 Java 代码中使用 Nashorn\n\n你可以从 Java 代码中运行 JavaScript。但，为什么要这样做呢？一种场景是：你有复杂的\
    \ JavaScript 函数，不想在 Java 中重写它们。\n\n要要在 Java 中调用 Nashorn，请使用 `javax.script` 包。`ScriptEngine`\
    \ 接口的 `eval` 方法会评估 JavaScript 脚本并将结果作为 `java.lang.Object` 返回。`eval` 的多个重载版本允许你传递\
    \ `String` 或 `Reader`。\n\n```\n public java.lang.Object eval(java.lang.String\
    \ script) \n        throws ScriptException\npublic java.lang.Object eval(java.io.Reader\
    \ scriptFile)\n        throws ScriptException\n```\n\n你可以使用 `ScriptEngineManager`\
    \ 的 `getEngineByName` 方法获取 `ScriptEngine` 实现类：\n\n```\n ScriptEngineManager factory\
    \ = new ScriptEngineManager();\nScriptEngine engine = factory.getEngineByName(\"\
    nashorn\");\n```\n\n例如，列表 8.2 中的 `ScriptEngineDemo1` 类获取了一个 `ScriptEngine` 并运行了一个小的\
    \ JavaScript 脚本。\n\n### 列表 8.2：`ScriptEngineDemo1` 类\n\n```\n package nashorn.fromjava;\n\
    import javax.script.ScriptEngine;\nimport javax.script.ScriptEngineManager;\n\n\
    public class ScriptEngineDemo1 {\n    public static void main(String[] args) {\n\
    \        ScriptEngineManager factory = new ScriptEngineManager();\n        ScriptEngine\
    \ engine = factory.getEngineByName(\"nashorn\");\n        Object result = engine.eval(\"\
    300 + 700\");\n        System.out.println(result);\n    }\n}\n```\n（注：8.2 的源代码在提示中是部分片段化的，已根据所提供的上下文进行了重构）。\n\
    \n### 在 JavaScript 中调用 Java\n\n你可以从 Java 代码中运行 JavaScript。但，为什么要这样做呢？一种场景是：你有复杂的\
    \ JavaScript 函数，不想在 Java 中重写它们。\n\n要要在 Java 中调用 Nashorn，请使用 `javax.script` 包。`ScriptEngine`\
    \ 接口的 `eval` 方法会评估 JavaScript 脚本并将结果作为 `java.lang.Object` 返回。`eval` 的多个重载版本允许你传递\
    \ `String` 或 `Reader`。\n\n```\n public java.lang.Object eval(java.lang.String\
    \ script) \n        throws ScriptException\npublic java.lang.Object eval(java.io.Reader\
    \ scriptFile)\n        throws ScriptException\n```\n\n你可以使用 `ScriptEngineManager`\
    \ 的 `getEngineByName` 方法获取 `ScriptEngine` 实现类：\n\n```\n ScriptEngineManager factory\
    \ = new ScriptEngineManager();\nScriptEngine engine = factory.getEngineByName(\"\
    nashorn\");\n```\n\n例如，列表 8.2 中的 `ScriptEngineDemo1` 类获取了一个 `ScriptEngine` 并运行了一个小的\
    \ JavaScript 脚本。\n\n### 列表 8.3：评估文件\n\n```java\n package nashorn.fromjava;\nimport\
    \ java.io.FileReader;\nimport java.io.FileNotFoundException;\nimport javax.script.ScriptEngine;\n\
    import javax.script.ScriptEngineManager;\nimport javax.script.ScriptException;\n\
    \npublic class ScriptEngineDemo2 {\n    public static void main(String[] args)\
    \ throws ScriptException {\n        ScriptEngineManager factory = new ScriptEngineManager();\n\
    \        ScriptEngine engine = factory.getEngineByName(\"nashorn\");\n       \
    \ Object result = engine.eval(new FileReader(\"test1.js\"));\n        System.out.println(result);\n\
    \    }\n}\n```\n（注：提供的文本存在大量重叠和片段化。上述结构遵循文档的逻辑意图）。\n\n### 列表 8.4：在 JavaScript\
    \ 使用 Java\n\n```javascript\n var path = java.nio.file.Paths.get(\"sales.txt\"\
    );\n var lines = java.nio.file.Files.lines(path);\nprint(\"Total: \" + lines.mapToDouble(function(s)\
    \ {return parseFloat(s)})\n        .sum());\n\n// lines 流已关闭，所以我们需要重新打开\nlines\
    \ = java.nio.file.Files.lines(path);\nprint(\"Average: \" + lines.mapToDouble(function(s)\
    \ {return parseFloat(s)})\n        .average().getAsDouble());\n```\n\n### 列表 8.5：等效的\
    \ Java 代码\n\n```java\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\
    import java.nio.file.Files;\nimport java.util.stream.DoubleStream;\nimport java.util.stream.Stream;\n\
    \npublic class Main {\n    public static void main(String[] args) throws Exception\
    \ {\n        Path path = Paths.get(\"sales.txt\");\n        Stream<String> lines\
    \ = Files.lines(path);\n        DoubleStream ds = lines.mapToDouble(a -> Double.parseDouble(a));\n\
    \        System.out.println(\"Total: \" + ds.sum());\n\n        lines = Files.lines(path);\n\
    \        ds = lines.mapToDouble(a -> Double.parseDouble(a));\n        System.out.println(\"\
    Average: \" + ds.average().getAsDouble());\n    }\n}\n```\n\n"
- fmt: "\nAnother intriguing feature of Nashorn is its ability to script JavaFX. All\
    \ you need is a `start` function in a JavaScript file. The `start` function must\
    \ accept an argument that will be passed the primary `Stage` for the application.\n\
    \nConsider the code in Listing 8.6.\n\n### Listing 8.6: A JavaFX script (`test1.js`)\n\
    \n```\nfunction start(stage) {\n    stage.title = \"Scripting JavaFX\";\n    var\
    \ button = new javafx.scene.control.Button();\n    button.text = \"Click Me!\"\
    ;\n    button.onAction = function() {\n    \tprint(\"Thank you!\");\n    }\n \
    \   var root = new javafx.scene.layout.StackPane();\n    root.children.add(button);\n\
    \    stage.scene = new javafx.scene.Scene(root, 400, 200);\n    stage.show();\n\
    }\n```\n\nTo execute a JavaFX script, you must invoke `jjs` with the `-fx` option:\n\
    \n```\njjs -fx test1.js\n```\n\nFigure 8.1 shows the JavaFX application that gets\
    \ created when you run the `test1.js` script.\n\n![](Images/0801.png)\n\nFigure\
    \ 8.1: Scripting JavaFX\n\n### Using Nashorn As Shell Script Replacement\n\nLinux\
    \ die-hards are usually good with the Linux commands. If your Linux skills are\
    \ limited to the most basic commands such as `whoami` and `ls`, however, you can\
    \ take advantage of Nashorn. Nashorn allows you to invoke Linux commands and process\
    \ the results.\n\nTo execute a Linux command in Nashorn, invoke `jjs` and enclose\
    \ the command with backtick characters (`` ` ``). On the keyboard, the character\
    \ key is normally located to the left of the `1. For example, to list the contents\
    \ of the current directory, use this.\n\n```\njjs> `ls -al`\n```\n\nThe advantage\
    \ of using Nashorn to invoke a Linux command is that you can process the output.\
    \ For instance, the following invokes the `cat` command to print a `Demo.java`\
    \ file and append line numbers.\n\n```\njjs> var lines = `cat Demo.java`.split('\\\
    n');\njjs> var i = 1;\njjs> for each (line in lines) { print(i++ + '\\t' + line)\
    \ };\n```\n\nHere is the result.\n\n```\n1\tpackage nashorn.scripting;\n2\t\n\
    3\tpublic class Demo {\n4\t\tpublic static void main(String[] args) {\n5\t\t\t\
    System.out.println(\"This is a demo\");\n6\t\t}\n7\t}\n8 \n```\n\nAs another example,\
    \ the following script can be used to display a long document one line at a time.\
    \ This will eliminate scrolling back to the beginning of the document as you would\
    \ normally have to do when printing a long manual.\n\n```\njjs> var System = java.lang.System\n\
    jjs> var lines = `man pwd`.split('\\n')\njjs> for each (line in lines) {System.out.print(line);\
    \ System.in.read()}\n```\n\nType Enter to show the next line of text.\n\n### Summary\n\
    \nNashorn is a new JavaScript engine in Java 8. Not only does it allow you to\
    \ execute JavaScript from Java code, it also comes with advanced features to script\
    \ JavaFX applications and process the output of a Linux command.\n"
