  trans: "\n编写 FXML 文件非常简单。你首先创建一个文本文件，并将其保存到与类文件相同的目录中。你可以将其存储在其他地方，但如果它与加载它的类位于同一个目录，加载起来是最容易的。\n\
    \n由于 FXML 文件是一个 XML 文档，所有 FXML 文档都以此声明开头。\n\n```\n <?xml version=\"1.0\" encoding=\"\
    UTF-8\"?> \n```\n\n接下来是导入指令，用于导入你将在 FXML 文件中引用的类型。你可以导入一个包或一个类型。\n\n```\n <?import\
    \ javafx.scene.*?> \n<?import javafx.scene.control.*?> \n<?import javafx.scene.layout.*?>\
    \ \n<?import javafx.geometry.Insets?> \n```\n\n接下来是根元素。它可以是 `Parent` 的任何子类。这里有一个示例。\n\
    \n```xml\n <GridPane xmlns:fx=\"http://javafx.com/fxml\" \n        hgap=\"5\"\
    \ vgap=\"12\" layoutY=\"30\">\n\n</GridPane>\n```\n\n`fx` 前缀是 FXML 中的一个特殊前缀。你将在本章稍后的部分学习它的用法。\n\
    \n要设置对象中的属性，请使用嵌套元素或属性。例如，上面 `GridPane` 元素中的 `hgap` 属性填充了 `GridPane` 的 `hgap`\
    \ 属性。\n\n在根元素内部构建你的 UI。列表 7.1 显示了一个 FXML 文件的示例。\n\n列表 7.1：FXML 文件示例\n\n```xml\n\
    \ <?xml version=\"1.0\" encoding=\"UTF-8\"?> \n<?import javafx.scene.*?> \n<?import\
    \ javafx.scene.control.*?> \n<?import javafx.scene.layout.*?> \n<?import javafx.geometry.Insets?>\
    \ \n<?import javafx.scene.image.Image?> \n<?import javafx.scene.image.ImageView?>\
    \ \n\n<BorderPane> \n    <top> \n        <HBox spacing=\"10.0\" style=\"-fx-background-color:#886699;\"\
    > \n            <padding> \n                <Insets top=\"15\" bottom=\"15\" left=\"\
    12\" right=\"12\"/>\n            </padding> \n            <Button id=\"okButton\"\
    \ text=\"OK\" defaultButton=\"true\"/> \n            <Button text=\"Cancel\"/>\
    \ \n        </HBox> \n    </top> \n</BorderPane> \n```\n\n元素可以包含一个要实例化的类或一个要填充的属性。列表\
    \ 7.1 中的 FXML 文件包含一个类型为 `BorderPane` 的根元素。`BorderPane` 的 `top` 属性填充了一个 `HBox`。`HBox`\
    \  又包含两个 `Buttons`，并且其 `padding` 属性填充了一个 `Insets`。\n\n关于 FXML 的更多细节可以在此处找到。\n\n\
    ```\n http://docs.oracle.com/javafx/2/api/javafx/fxml/doc-files/\nintroduction_to_fxml.html\n\
    ```\n\n### 注意事项\n\n建议在编写 FXML 时使用支持 JavaFX 的 IDE，并利用其代码补全功能使编写 FXML 变得更简单。NetBeans\
    \ 和 IntelliJ 支持 JavaFX，而 Eclipse 通过插件支持 JavaFX。\n\n接下来的章节将展示在 JavaFX 应用中使用 FXML\
    \ 的示例。\n\n## 一个简单的基于 FXML 的应用程序\n\n此示例是上一章中创建的 `BorderPaneDemo` 应用程序的重写。这次使用 FXML\
    \ 文档来构建和组织 UI 组件。为了方便阅读，这里重印了 `BorderPaneDemo` 类。\n\n```java\n package app07;\n\
    import javafx.application.Application; \nimport javafx.geometry.Insets; \nimport\
    \ javafx.scene.Scene; \nimport javafx.scene.control.Button; \nimport javafx.scene.control.ColorPicker;\
    \ \nimport javafx.scene.control.Label; \nimport javafx.scene.image.ImageView;\
    \ \nimport javafx.scene.layout.BorderPane; \nimport javafx.scene.layout.HBox;\
    \ \nimport javafx.scene.layout.VBox; \nimport javafx.stage.Stage; \n\npublic class\
    \ BorderPaneDemo extends Application { \n\n    @Override \n    public void start(Stage\
    \ stage) { \n        Button okButton = new Button(\"OK\"); \n        okButton.setDefaultButton(true);\
    \ \n\n        Button cancelButton = new Button(\"Cancel\"); \n        HBox hBox\
    \ = new HBox(); \n        hBox.setPadding(new Insets(15, 12, 15, 12)); \n    \
    \    hBox.setSpacing(10); \n        hBox.setStyle(\"-fx-background-color: #886699;\"\
    ); \n        hBox.getChildren().addAll(okButton, cancelButton); \n        BorderPane\
    \ root = new BorderPane(); \n        root.setTop(hBox); \n\n        ImageView\
    \ imageView = new ImageView(\"image/1.jpg\"); \n        root.setCenter(imageView);\
    \ \n\n        VBox vBox = new VBox(); \n        vBox.setStyle(\"-fx-background-color:\
    \ \" + \n        \t\t\"#ddeeff;-fx-padding:10px\"); \n        vBox.getChildren().addAll(\
    \ \n                new Label(\"Select Color:\"), \n                new ColorPicker());\
    \ \n        root.setLeft(vBox); \n\n        root.setStyle(\"-fx-background-color:\
    \ #6680e6;\"); \n        Scene scene = new Scene(root, 740, 530); \n\n       \
    \ stage.setTitle(\"HBox, VBox, BorderPane\"); \n    }\n}\n```\n\n`BorderPaneDemo`\
    \ 类中的 UI 部分可以替换为 7.2 所示的 `example.fxml` 文件。\n\n```xml\n <?xml version=\"1.0\"\
    \ encoding=\"UTF-8\"?> \n<?import javafx.scene.*?> \n<?import javafx.scene.control.*?>\
    \ \n<?import javafx.scene.layout.*?> \n<?import javafx.geometry.Insets?> \n\n\
    <BorderPane> \n    <top> \n        <HBox spacing=\"10.0\" style=\"-fx-background-color:#886699;\"\
    > \n            <padding> \n                <Insets top=\"15\" bottom=\"15\" left=\"\
    12\" right=\"12\"/>\n            </padding> \n            <Button id=\"okButton\"\
    \ text=\"OK\" defaultButton=\"true\"/> \n            <Button text=\"Cancel\"/>\
    \ \n        </HBox> \n    </top> \n</BorderPane>\n```\n列表 7.2：`example.fxml` 文件\n\
    \n```xml\n <?xml version=\"1.0\" encoding=\"UTF-8\"?> \n<?import javafx.scene.*?>\
    \ \n<?import javafx.scene.control.*?> \n<?import javafx.scene.layout.*?> \n<?import\
    \ javafx.geometry.Insets?> \n<?import javafx.scene.image.Image?> \n<?import javafx.scene.image.ImageView?>\
    \ \n\n<BorderPane> \n    <top> \n        <HBox spacing=\"10.0\" style=\"-fx-background-color:#886699;\"\
    > \n            <padding> \n                <Insets top=\"15\" bottom=\"15\" left=\"\
    12\" right=\"12\"/>\n            </padding> \n            <Button id=\"okButton\"\
    \ text=\"OK\" defaultButton=\"true\"/> \n            <Button text=\"Cancel\"/>\
    \ \n        </HBox> \n    </top> \n</BorderPane>\n```\n`start` 方法使用 `FXMLLoader`\
    \ 加载 FXML 文档并返回一个包含所声明组件的 `Parent` 对象。该方法随后创建一个 `Scene`并将 `Scene` 传递给 `Stage`，然后调用\
    \ `Stage` 的 `show` 方法。\n\n列表 7.3 所示了 Java 类 `Example1`。\n\n```java\n package app07;\n\
    import javafx.application.Application; \nimport javafx.fxml.FXMLLoader; \nimport\
    \ javafx.scene.Parent; \nimport javafx.scene.Scene; \nimport javafx.stage.Stage;\
    \ \n\npublic class Example1 extends Application { \n\n    @Override \n    public\
    \ void start(Stage stage) throws Exception {\n        // Example1.fxml 必须位于 Example1.class\
    \ 相同的目录下\n        Parent root = FXMLLoader.load(getClass().getResource(\"example1.fxml\"\
    )); \n        root.setStyle(\"-fx-background-color: #6680e6;\"); \n        Scene\
    \ scene = new Scene(root, 740, 530); \n        stage.setTitle(\"JavaFX with FXML\
    \ (Example 1)\"); \n        stage.setScene(scene); \n        stage.show(); \n\
    \    }\n\n    public static void main(String[] args) { \n        launch(args);\
    \ \n    }\n}\n```\n\n## 使用 FXML 处理事件\n\n使用 FXML FXML 是一种强大的语言。它的功能之一是将 UI 组件与控制器中的事件处理方法（事件处理器）绑定，这样当事件发生时就会调用该方法。控制器是实现\
    \ `javafx.fxml.Initializable` 的 Java 类。为了利用这一功能，你必须在根元素中使用 `fx:controller` 属性，如下：\n\
    \n```xml\n <Group fx:controller=\"app7.Example2Controller\" \n```\n\n记得 `fx` 是\
    \ FXML 中的一个特殊前缀。\n\n要将组件绑定到事件处理器，请使用元素相关的 `onXXX` 属性。例如，将 `ActionEvent` 绑定到控制器中名为\
    \ `handleAction` 的方法，请写：\n\n```xml\n onAction=\"#handleAction\"\n```\n\n例如，考虑以下带有用户名和密码登录表单的应用程序。应用程序的主阶段如图\
    \ 7.2 所示。\n\n![](img/0702.png)\n\n图 7.2：示例 2 中的登录表单\n"
- fmt: "\nThe user may enter a user name and password. Clicking `Reset` clears the\
    \ User Name and Password fields. Clicking `Login` authenticates the user. The\
    \ authentication result will be written on the `Label` above the fields.\n\nThe\
    \ application consists of an FXML document (`example2.fxml` in Listing 7.4), a\
    \ controller class (`Example2Controller` in Listing 7.5), and the main class (`Example2`\
    \ in Listing 7.6).\n\n### Listing 7.4: The `example2.fxml` file\n\n```xml\n <?xml\
    \ version=\"1.0\" encoding=\"UTF-8\"?> \n\n<?import javafx.scene.*?> \n<?import\
    \ javafx.scene.control.*?> \n<?import javafx.scene.layout.*?> \n<?import javafx.geometry.Insets?>\
    \ \n\n<GridPane xmlns:fx=\"http://javafx.com/fxml\" \n        fx:controller=\"\
    app07.Example2Controller\" \n        hgap=\"5\" vgap=\"12\" layoutY=\"30\"  >\
    \ \n    <columnConstraints> \n        <ColumnConstraints percentWidth=\"15\"/>\
    \ \n        <ColumnConstraints percentWidth=\"35\" \n                halignment=\"\
    RIGHT\"/> \n        <ColumnConstraints percentWidth=\"35\"/> \n        <ColumnConstraints\
    \ percentWidth=\"10\"/> \n    </columnConstraints> \n\n    <children> \n     \
    \   <Label fx:id=\"statusLabel\" > \n            <GridPane.columnIndex>1</GridPane.columnIndex>\
    \ \n            <GridPane.rowIndex>0</GridPane.rowIndex> \n            <GridPane.columnSpan>2</GridPane.columnSpan>\
    \ \n        </Label> \n\n        <Label text=\"User Name:\"> \n            <GridPane.columnIndex>1</GridPane.columnIndex>\
    \ \n            <GridPane.rowIndex>1</GridPane.rowIndex> \n        </Label> \n\
    \        <TextField fx:id=\"userNameField\"> \n            <GridPane.columnIndex>2</GridPane.columnIndex>\
    \ \n            <GridPane.rowIndex>1</GridPane.rowIndex> \n        </TextField>\
    \ \n\n        <Label text=\"Password:\"> \n            <GridPane.columnIndex>1</GridPane.columnIndex>\
    \ \n            <GridPane.rowIndex>2</GridPane.rowIndex> \n        </Label> \n\
    \        <PasswordField fx:id=\"passwordField\"> \n            <GridPane.columnIndex>2</GridPane.columnIndex>\
    \ \n            <GridPane.rowIndex>2</GridPane.rowIndex> \n        </PasswordField>\
    \ \n        <Button fx:id=\"resetButton\" text=\"Reset\" \n                onAction=\"\
    #handleReset\"> \n            <GridPane.columnIndex>1</GridPane.columnIndex> \n\
    \            <GridPane.rowIndex>3</GridPane.rowIndex> \n        </Button> \n \
    \       <Button fx:id=\"loginButton\" text=\"Login\" \n                defaultButton=\"\
    true\" onAction=\"#handleLogin\"> \n            <GridPane.columnIndex>2</GridPane.columnIndex>\
    \ \n            <GridPane.rowIndex>3</GridPane.rowIndex> \n        </Button> \n\
    \    </children> \n</GridPane>\n```\n\nThe FXML document in Listing 7.2 uses a\
    \ `GridPane` as the root element. The markup also populates the `columnConstraints`\
    \ and `children` properties of the `GridPane`. The `columnContraints` contains\
    \ `ColumnConstraints` elements that specify the width for each of its columns.\
    \ The `children` property specifies the UI components to be rendered inside the\
    \ `GridPane`.\n\nPay special attention to the `onAction` attributes of the `Button`\
    \ elements. They are used to bind the `ActionEvent` with the `handleLogin` and\
    \ `handleReset` methods, respectively.\n\n### Listing 7.5: The `Example2Controller`\
    \ class\n\n```java\n package app07;\nimport java.net.URL; \nimport java.util.ResourceBundle;\
    \ \nimport javafx.event.ActionEvent; \nimport javafx.fxml.FXML; \nimport javafx.fxml.Initializable;\
    \ \nimport javafx.scene.control.Label; \nimport javafx.scene.control.PasswordField;\
    \ \nimport javafx.scene.control.TextField; \n\npublic class Example2Controller\
    \ implements Initializable { \n\n    @FXML \n    private TextField userNameField;\
    \ \n    @FXML \n    private PasswordField passwordField; \n    @FXML \n    private\
    \ Label statusLabel; \n\n    @FXML \n    private void handleReset(ActionEvent\
    \ event) { \n        userNameField.setText(\"\"); \n        passwordField.setText(\"\
    \"); \n        statusLabel.setText(\"\"); \n    } \n\n    @FXML \n    private\
    \ void handleLogin(ActionEvent event) { \n        String userName = userNameField.getText();\
    \ \n        String password = passwordField.getText(); \n        if (\"john\"\
    .equals(userName) \n                && \"secret\".equals(password)) { \n     \
    \       statusLabel.setText(\"Login successul\"); \n        } else { \n      \
    \      statusLabel.setText(\"Login failed\"); \n        } \n    } \n\n    @Override\
    \ \n    public void initialize(URL url, ResourceBundle rb) { \n    }    \n} \n\
    ```\n\nA controller provides event-handlers for the FXML document it is bound\
    \ with. An event-handler must be annotated with `@FXML`. In addition, to allow\
    \ access to a UI component, you can annotate a field with `@FXML`. The annotated\
    \ field must have the same name as the `fx:id` attribute of the component it is\
    \ bound to.\n\nIn the controller class in Listing 7.5, three fields are declared\
    \ and annotated with `@FXML`: `userNameField`, `passwordField`, and `statusLabel`.\n\
    \n### Listing 7.6: The `Example2` class\n\n```java\n package app07;\nimport javafx.application.Application;\n\
    import javafx.fxml.FXMLLoader;\nimport javafx.scene.Parent;\nimport javafx.scene.Scene;\n\
    import javafx.stage.Stage;\n\npublic class Example2 extends Application {\n\n\
    \    @Override \n    public void start(Stage stage) throws Exception { \n    \
    \    Parent root = FXMLLoader.load(getClass().getResource(\"example2.fxml\"));\n\
    \        Scene scene = new Scene(root, 300, 200); \n        stage.setTitle(\"\
    Login Form\"); \n        stage.setScene(scene); \n        stage.show(); \n   \
    \ }\n\n    public static void main(String[] args) { \n        launch(args); \n\
    \    }\n}\n```\n\nFinally, the `Example2` class loads the FXML document and shows\
    \ it.\n\n### Summary\nFXML is a markup language for constructing the UI graph.\
    \ In this chapter you learned the basics of FXML and how to use it.\n\n# Chapter\
    \ 8: Nashorn\n\n## Overview\nNashorn is a JavaScript engine in Java 8. It replaces\
    \ Mozilla Rhino, an older JavaScript engine still available in Java. However,\
    \ for new projects you should use Nashorn, which is faster and provides better\
    \ compliance with ECMAScript.\n\nThe name Nashorn is a German word meaning rhinoceros.\
    \ The Nashorn engine is based on JSR 292, “Supporting Dynamically Typed Languages\
    \ on the Java Platform.” This JSR allows dynamic languages targeting the JVM to\
    \ run faster by taking advantage of `invokedynamic`.\n\n## Using the jjs Command\n\
    jjs is a tool that comes with the JRE 1.8 and the JDK 1.8. It is located under\
    \ the `JAVA_HOME/bin` directory, where `JAVA_HOME` is the installation directory\
    \ of the JRE or the JDK.\n\nThe easiest way to test the power of Nashorn is by\
    \ using the jjs command tool. The syntax is as follows:\n\n```\n jjs [options]\
    \ [script-files] [-- arguments]\n```\n\nUsed without a script file, jjs will launch\
    \ as a read-eval-print loop (REPL), an environment to which you can type in commands\
    \ or expressions.\n\nYou can try this at home:\n\n```bash\n $ jjs\n```\n\nThe\
    \ interface for jjs is a prompt like this:\n\n```\n jjs>\n```\n\nYou can now start\
    \ typing. For example:\n\n```javascript\n jjs> \"Hello World\"\nHello World\n\
    ```\n\nHere is another example:\n\n```javascript\n jjs> var name = 'Charlie'\n\
    \ jjs> print('Hello ' + name)\nHello Charlie\n```\n\nAnd, here is a JavaScript\
    \ function:\n\n```javascript\n jjs> function triple(n) { return 3 * n }\nfunction\
    \ triple(n) { return 3 * n }\n```\n\nCalling the function `triple` and passing\
    \ 5 returns 15:\n\n```javascript\n jjs> triple(5)\n15\n```\n\nOf course, you can\
    \ put your script in a file and pass it to jjs. Suppose you have a script file\
    \ named `test1.js` as printed in Listing 8.1.\n"
  raw: "The user may enter a user name and password. Clicking Reset clears the User\
    \ Name and Password fields. Clicking Login authenticates the user. The authentication\
    \ result will be written on the Label above the fields.\n\nThe application consists\
    \ of an FXML document (example2.fxml in Listing 7.4), a controller class (Example2Controller\
    \ in Listing 7.5), and the main class (Example2 in Listing 7.6).\n\nListing 7.4:\
    \ The example2.fxml file\n\n```\n <?xml version=\"1.0\" encoding=\"UTF-8\"?> \n\
    \n<?import javafx.scene.*?> \n<?import javafx.scene.control.*?> \n<?import javafx.scene.layout.*?>\
    \ \n<?import javafx.geometry.Insets?> \n\n<GridPane xmlns:fx=\"http://javafx.com/fxml\"\
    \ \n        fx:controller=\"app07.Example2Controller\" \n        hgap=\"5\" vgap=\"\
    12\" layoutY=\"30\"  > \n    <columnConstraints> \n        <ColumnConstraints\
    \ percentWidth=\"15\"/> \n        <ColumnConstraints percentWidth=\"35\" \n  \
    \              halignment=\"RIGHT\"/> \n        <ColumnConstraints percentWidth=\"\
    35\"/> \n        <ColumnConstraints percentWidth=\"10\"/> \n    </columnConstraints>\
    \ \n\n    <children> \n        <Label fx:id=\"statusLabel\" > \n            <GridPane.columnIndex>1</GridPane.columnIndex>\
    \ \n            <GridPane.rowIndex>0</GridPane.rowIndex> \n            <GridPane.columnSpan>2</GridPane.columnSpan>\
    \ \n        </Label> \n\n        <Label text=\"User Name:\"> \n            <GridPane.columnIndex>1</GridPane.columnIndex>\
    \ \n            <GridPane.rowIndex>1</GridPane.rowIndex> \n        </Label> \n\
    \        <TextField fx:id=\"userNameField\"> \n            <GridPane.columnIndex>2</GridPane.columnIndex>\
    \ \n            <GridPane.rowIndex>1</GridPane.rowIndex> \n        </TextField>\
    \ \n\n        <Label text=\"Password:\"> \n            <GridPane.columnIndex>1</GridPane.columnIndex>\
    \ \n            <GridPane.rowIndex>2</GridPane.rowIndex> \n        </Label> \n\
    \        <PasswordField fx:id=\"passwordField\"> \n            <GridPane.columnIndex>2</GridPane.columnIndex>\
    \ \n            <GridPane.rowIndex>2</GridPane.rowIndex> \n        </PasswordField>\
    \ \n        <Button fx:id=\"resetButton\" text=\"Reset\" \n                onAction=\"\
    #handleReset\"> \n            <GridPane.columnIndex>1</GridPane.columnIndex> \n\
    \            <GridPane.rowIndex>3</GridPane.rowIndex> \n        </Button> \n \
    \       <Button fx:id=\"loginButton\" text=\"Login\" \n                defaultButton=\"\
    true\" onAction=\"#handleLogin\"> \n            <GridPane.columnIndex>2</GridPane.columnIndex>\
    \ \n            <GridPane.rowIndex>3</GridPane.rowIndex> \n        </Button> \n\
    \    </children> \n</GridPane>\n```\n\nThe FXML document in Listing 7.2 uses a\
    \ GridPane as the root element. The markup also populates the columnConstraints\
    \ and children properties of the GridPane. The columnContraints contains ColumnConstraints\
    \ elements that specify the width for each of its columns. The children property\
    \ specifies the UI components to be rendered inside the GridPane.\n\nPay special\
    \ attention to the onAction attributes of the Button elements. They are used to\
    \ bind the ActionEvent with the handleLogin and handleReset methods, respectively.\n\
    \nListing 7.5: The Example2Controller class\n\n```\n package app07;\nimport java.net.URL;\
    \ \nimport java.util.ResourceBundle; \nimport javafx.event.ActionEvent; \nimport\
    \ javafx.fxml.FXML; \nimport javafx.fxml.Initializable; \nimport javafx.scene.control.Label;\
    \ \nimport javafx.scene.control.PasswordField; \nimport javafx.scene.control.TextField;\
    \ \n\npublic class Example2Controller implements Initializable { \n\n    @FXML\
    \ \n    private TextField userNameField; \n    @FXML \n    private PasswordField\
    \ passwordField; \n    @FXML \n    private Label statusLabel; \n\n    @FXML \n\
    \    private void handleReset(ActionEvent event) { \n        userNameField.setText(\"\
    \"); \n        passwordField.setText(\"\"); \n        statusLabel.setText(\"\"\
    ); \n    } \n\n    @FXML \n    private void handleLogin(ActionEvent event) { \n\
    \        String userName = userNameField.getText(); \n        String password\
    \ = passwordField.getText(); \n        if (\"john\".equals(userName) \n      \
    \          && \"secret\".equals(password)) { \n            statusLabel.setText(\"\
    Login successul\"); \n        } else { \n            statusLabel.setText(\"Login\
    \ failed\"); \n        } \n    } \n\n    @Override \n    public void initialize(URL\
    \ url, ResourceBundle rb) { \n    }    \n} \n```\n\nA controller provides event-handlers\
    \ for the FXML document it is bound with. An event-handler must be annotated with\
    \ @FXML. In addition, to allow access to a UI component, you can annotate a field\
    \ with @FXML. The annotated field must have the same name as the fx:id attribute\
    \ of the component it is bound to.\n\nIn the controller class in Listing 7.5,\
    \ three fields are declared and annotated with @FXML: userNameField, passwordField,\
    \ and statusLabel.\n\nListing 7.6: The Example2 class\n\n```\n package app07;\n\
    import javafx.application.Application; \nimport javafx.fxml.FXMLLoader; \nimport\
    \ javafx.scene.Parent; \nimport javafx.scene.Scene; \nimport javafx.stage.Stage;\
    \ \n\npublic class Example2 extends Application { \n\n    @Override \n    public\
    \ void start(Stage stage) throws Exception { \n        Parent root = FXMLLoader.load(\
    \ \n                getClass().getResource(\"example2.fxml\")); \n        Scene\
    \ scene = new Scene(root, 300, 200); \n        stage.setTitle(\"Login Form\");\
    \ \n        stage.setScene(scene); \n        stage.show(); \n    } \n\n    public\
    \ static void main(String[] args) { \n        launch(args); \n    } \n}\n```\n\
    \nFinally, the Example2 class in Listing 7.6 loads the FXML document and creates\
    \ and shows the primary stage.\n\nSummary\n\nFXML is a markup language for constructing\
    \ the UI component graph of a JavaFX application. Using FXML makes writing the\
    \ UI easier. In this chapter you learned the basics of FXML and how to use it.\n\
    \nChapter 8\n\nNashorn\n\nNashorn is a JavaScript engine in Java 8\\. It replaces\
    \ Mozilla Rhino, an older JavaScript engine that comes with JDK 7 and JDK 6\\\
    . The new engine is fast and lets you mix Java with JavaScript. With Nashorn you\
    \ can run JavaScript from Java or run Java code quickly from a command prompt.\
    \ In addition, you can use Nashorn to run JavaFX applications and execute shell\
    \ scripts on UNIX or Linux machines.\n\nThis chapter introduces Nashorn.\n\nOverview\n\
    \nThe API for Java scripting actually has been available since JDK 1.6 and takes\
    \ the form of the javax.script package. JDK 1.6 and JDK 1.7 use Mozilla Rhino\
    \ and the engine is still available in Java 8\\. However, for new projects you\
    \ should use Nashorn, which is faster than its predecessor and provides better\
    \ compliance with ECMAScript.\n\nThe name Nashorn is a German word meaning rhinoceros.\
    \ The Nashorn engine is based on JSR 292, “Supporting Dynamically Typed Languages\
    \ on the Java Platform.” This JSR allows dynamic languages targeting the JVM to\
    \ run faster by taking advantage of invokedynamic, a new Java bytecode. The specification\
    \ can be downloaded from this web page:\n\n```\n https://jcp.org/en/jsr/detail?id=292\n\
    ```\n\nUsing the jjs Command\n\njjs is a tool that comes with the JRE 1.8 and\
    \ the JDK 1.8\\. It is located under the JAVA_HOME/bin directory, where JAVA_HOME\
    \ is the installation directory of the JRE or the JDK.\n\nThe easiest way to test\
    \ the power of Nashorn is by using the jjs command tool that ships with Java 8\\\
    . The syntax is as follows.\n\n```\n jjs [options] [script-files] [-- arguments]\n\
    ```\n\nUsed without a script file, jjs will launch as a read-eval-print loop (REPL),\
    \ an environment to which you can type in commands or expressions.\n\nYou can\
    \ try this at home:\n\n```\n $ jjs\n```\n\nThe interface for jjs is a prompt like\
    \ this:\n\n```\n jjs>\n```\n\nYou can now start typing. For example:\n\n```\n\
    \ jjs> \"Hello World\"\nHello World\n```\n\nHere is another example:\n\n```\n\
    \ jjs> var name = 'Charlie'\njjs> print('Hello ' + name)\nHello Charlie\n```\n\
    \nAnd, here is a JavaScript function:\n\n```\n jjs> function triple(n) { return\
    \ 3 * n }\nfunction triple(n) { return 3 * n }\n```\n\nCalling the function triple\
    \ and passing 5 returns 15:\n\n```\n jjs> triple(5)\n15\n```\n\nOf course, you\
    \ can put your script in a file and pass it to jjs. Suppose you have a script\
    \ file named test1.js as printed in Listing 8.1."
