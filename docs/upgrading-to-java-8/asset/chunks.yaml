    \ package app01.function;\nimport java.util.function.BiFunction;\n\npublic class\
    \ BiFunctionDemo1 {\n    public static void main(String[] args) {\n        BiFunction<Float,\
    \ Float, Float> area =\n                (width, length) -> width * length;\n \
