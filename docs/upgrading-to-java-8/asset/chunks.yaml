    \ a default style. If you want to style a VBox, for example, you first need to\
    \ add a CSS class to the instance. For example, the following code adds a style\
    \ named vbox to a Vbox.\n\n```\n VBox vBox = new VBox(); \nvBox.getStyleClass().add(\"\
    vbox\"); \n```\n\nThe VBox will then react to a vbox style in any CSS file referred\
    \ to by the application."
