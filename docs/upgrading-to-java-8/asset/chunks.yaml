  trans: "\n\n用户可以输入用户名和密码。点击 `Reset` 会清除用户名和密码字段。点击 `Login` 将对用户进行身份验证。验证结果将写在字段上方的\
    \ `Label` 上。\n\n该应用程序由一个 FXML 文档（列表 7.4 中的 `example2.fxml`）、一个控制器类（列表 7.5 中的 `Example2Controller`）以及一个主类（列表\
    \ 7.6 中的 `Example2`）组成。\n\n### 列表 7.4：`example2.fxml` 文件\n\n```xml\n <?xml version=\"\
    1.0\" encoding=\"UTF-8\"?> \n\n<?import javafx.scene.*?> \n<?import javafx.scene.control.*?>\
    \ \n<?import javafx.scene.layout.*?> \n<?import javafx.geometry.Insets?> \n\n\
    <GridPane xmlns:fx=\"http://javafx.com/fxml\" \n        fx:controller=\"app07.Example2Controller\"\
    \ \n        hgap=\"5\" vgap=\"12\" layoutY=\"30\"  > \n    <columnConstraints>\
    \ \n        <ColumnConstraints percentWidth=\"15\"/> \n        <ColumnConstraints\
    \ percentWidth=\"35\" \n                halignment=\"RIGHT\"/> \n        <ColumnConstraints\
    \ percentWidth=\"35\"/> \n        <ColumnConstraints percentWidth=\"10\"/> \n\
    \    </columnConstraints> \n\n    <children> \n        <Label fx:id=\"statusLabel\"\
    \ > \n            <GridPane.columnIndex>1</GridPane.columnIndex> \n          \
    \  <GridPane.rowIndex>0</GridPane.rowIndex> \n            <GridPane.columnSpan>2</GridPane.columnSpan>\
    \ \n        </Label> \n\n        <Label text=\"User Name:\"> \n            <GridPane.columnIndex>1</GridPane.columnIndex>\
    \ \n            <GridPane.rowIndex>1</GridPane.rowIndex> \n        </Label> \n\
    \        <TextField fx:id=\"userNameField\"> \n            <GridPane.columnIndex>2</GridPane.columnIndex>\
    \ \n            <GridPane.rowIndex>1</GridPane.rowIndex> \n        </TextField>\
    \ \n\n        <Label text=\"Password:\"> \n            <GridPane.columnIndex>1</GridPane.columnIndex>\
    \ \n            <GridPane.rowIndex>2</GridPane.rowIndex> \n        </Label> \n\
    \        <PasswordField fx:id=\"passwordField\"> \n            <GridPane.columnIndex>2</GridPane.columnIndex>\
    \ \n            <GridPane.rowIndex>2</GridPane.rowIndex> \n        </PasswordField>\
    \ \n        <Button fx:id=\"resetButton\" text=\"Reset\" \n                onAction=\"\
    #handleReset\"> \n            <GridPane.columnIndex>1</GridPane.columnIndex> \n\
    \            <GridPane.rowIndex>3</GridPane.rowIndex> \n        </Button> \n \
    \       <Button fx:id=\"loginButton\" text=\"Login\" \n                defaultButton=\"\
    true\" onAction=\"#handleLogin\"> \n            <GridPane.columnIndex>2</GridPane.columnIndex>\
    \ \n            <GridPane.rowIndex>3</GridPane.rowIndex> \n        </Button> \n\
    \    </children> \n</GridPane>\n```\n\n列表 7.2 中的 FXML 文档使用 `GridPane` 作为根元素。该标记还填充了\
    \ `GridPane` 的 `columnConstraints` 和 `children` 属性。`columnContraints` 包含 `ColumnConstraints`\
    \ 元素，指定了每个列的宽度。`children` 属性指定了要在 `GridPane` 内部渲染的 UI 组件。\n\n请特别注意 `Button` 元素的\
    \ `onAction` 属性。它们分别用于将 `ActionEvent` 绑定到 `handleLogin` 和 `handleReset` 方法。\n\n\
    ### 列表 7.5：`Example2Controller` 类\n\n```java\n package app07;\nimport java.net.URL;\
    \ \nimport java.util.ResourceBundle; \nimport javafx.event.ActionEvent; \nimport\
    \ javafx.fxml.FXML; \nimport javafx.fxml.Initializable; \nimport javafx.scene.control.Label;\
    \ \nimport javafx.scene.control.PasswordField; \nimport javafx.scene.control.TextField;\
    \ \n\npublic class Example2Controller implements Initializable { \n\n    @FXML\
    \ \n    private TextField userNameField; \n    @FXML \n    private PasswordField\
    \ passwordField; \n    @FXML \n    private Label statusLabel; \n\n    @FXML \n\
    \    private void handleReset(ActionEvent event) { \n        userNameField.setText(\"\
    \"); \n        passwordField.setText(\"\"); \n        statusLabel.setText(\"\"\
    ); \n    } \n\n    @FXML \n    private void handleLogin(ActionEvent event) { \n\
    \        String userName = userNameField.getText(); \n        String password\
    \ = passwordField.getText(); \n        if (\"john\".equals(userName) \n      \
    \          && \"secret\".equals(password)) { \n            statusLabel.setText(\"\
    Login successul\"); \n        } else { \n            statusLabel.setText(\"Login\
    \ failed\"); \n        } \n    } \n\n    @Override \n    public void initialize(URL\
    \ url, ResourceBundle rb) { \n    }    \n} \n```\n\n控制器为其绑定的 FXML 文档提供事件处理器。事件处理器必须标记为\
    \ `@FXML`。此外，为了访问 UI 组件，你可以对字段使用 `@FXML` 标记。标记的字段名称必须与其绑定的组件的 `fx:id` 属性相同。\n\n\
    在列表 7.5 的控制器类中，声明了三个字段并标记了 `@FXML`：`userNameField`、`passwordField` 和 `statusLabel`。\n\
    \n### 列表 7.6：`Example2` 类\n\n```java\n package app07;\nimport javafx.application.Application;\n\
    import javafx.fxml.FXMLLoader;\nimport javafx.scene.Parent;\nimport javafx.scene.Scene;\n\
    import javafx.stage.Stage;\n\npublic class Example2 extends Application {\n\n\
    \    @Override\n    public void start(Stage stage) throws Exception {\n      \
    \  Parent root = FXMLLoader.load(getClass().getResource(\"example2.fxml\"));\n\
    \        Scene scene = new Scene(root, 300, 200);\n        stage.setTitle(\"Login\
    \ Form\");\n        stage.setScene(scene);\n        stage.show();\n    }\n   \
    \ // \n}\n```\n\n最后，`Example2` 类加载并显示了 FXML 文档。\n\n### 总结\nFXML 是构建 UI 的标记语言。在本章中，你学习了\
    \ FXML 的基础知识以及如何使用。\n\n# 第 8 章：Nashorn\n\n## 概述\nNashorn 是 Java 8 中的 JavaScript\
    \ 引擎。它取代了 Java 中仍然使用的旧 JavaScript 引擎 Rhino。然而，新项目应该使用 Nashorn，因为它更符合 ECMAScript。\n\
    \nNashorn 是一个德语单词，意为“犀牛”。Nashorn 引擎基于 JSR 292，“在 Java 平台上支持动态语言”。该 JSR 让目标 JVM\
    \ 的动态语言通过利用 `invokedynam` 得更快。\n\n## 使用 jjs 命令\njjs 是随 JRE 1.8 和 JDK 1.8 一起提供的工具。位于\
    \ `JAVA_HOME/bin` 目录下，`JAVA_HOME` 是 JRE 或 JDK 的安装目录。\n\n测试 Nashorn 功能的最简单方法是使用\
    \ jjs 命令工具。其语法如下：\n\n```\n jjs [options] [script-files] [-- arguments]\n```\n\n\
    如果不带脚本文件使用，jjs 将读取-执行-打印循环（REPL）启动，这是一个你可以输入命令或表达式的环境。\n\n你可以在本地尝试：\n\n```bash\n\
    \ $ jjs\n```\n\njjs 的界面所示：\n\n```\n jjs>\n```\n\n现在你可以开始输入了。例如：\n\n```javascript\n\
    \ jjs> \"Hello World\"\nHello World\n```\n\n这里是另一个例子：\n\n```javascript\n jjs>\
    \ var name = 'Charlie'\n jjs> print('Hello ' + name)\nHello Charlie\n```\n\n这里，这是一个\
    \ JavaScript 函数：\n\n```javascript\n jjs> function triple(n) { return 3 * n }\n\
    function triple(n) { return 3 * n }\n```\n\n调用函数 `triple` 并传递 5 返回 15：\n\n```javascript\n\
    \ jjs> triple(5)\n15\n```\n\n当然，你也可以将脚本放在文件中并将其传递给 jjs。假设你有一个名为 `test1.js` 的脚本文件，如列表\
    \ 8.1 所示。\n\n"
- fmt: "\n### Listing 8.1: The `test1.js` file\n\n```\n function add(a, b) {\n   \
    \ return a + b;\n}\nvar c = add(10, 20)\nprint(c)\n```\n\nNow, call `jjs` and\
    \ pass `test1.js`:\n\n```\n $ jjs test1.js\n30\n```\n\nAs mentioned earlier, `jjs`\
    \ can be used with options. Table 8.1 lists some of the options.\n\n| Option |\
    \ Description |\n| :--- | :--- |\n| `-ccs=size` or `--class-cache-size=size` |\
    \ Specifies the class cache size in bytes. The letter `k` or `K` indicates kilobytes,\
    \ `m` or `M` megabytes and `g` or `G` gigabytes. The default class cache size\
    \ is 50. |\n| `-co` or `--compile-only` | Compiles the script without running\
    \ it. |\n| `-cp` or `-classpath` | Specifies the class path. This option can be\
    \ repeated to specify multiple class paths. |\n| `-Dname=value` | Passes a system\
    \ property key and value. |\n| `-d=path` or `--dump-debug-dir=path` | Specifies\
    \ the path to a directory to dump class files to. |\n| `--debug-lines=true\\|false`\
    \ | Indicates whether a line number table should be generated in the class file.\
    \ By default, this option is on. |\n| `--debug-locals` | Generates a local variable\
    \ table in the class file. |\n| `-doe` or `--dump-on-error` | Provides a full\
    \ stack trace when an error occurs. By default, only a brief error message is\
    \ printed. |\n| `--early-lvalue-error` | Reports invalid lvalue expressions as\
    \ early errors. |\n| `--empty-statements` | Preserves empty statements in the\
    \ Java abstract syntax tree. |\n| `-fv` or `-fullversion` | Prints the full version\
    \ of Nashorn. |\n| `--function-statement-error` | Prints an error message when\
    \ a function declaration is used as a statement. |\n| `--function-statement-warning`\
    \ | Prints a warning message when a function declaration is used as a statement.\
    \ |\n| `-fx` | Launches the script as a JavaFX application. |\n| `-h` or `-help`\
    \ | Prints the list of options and their descriptions. |\n| `-Joption` | Passes\
    \ a Java option to the JVM. |\n| `--lazy-compilation` | Enables lazy code generation.\
    \ |\n| `--loader-per-compile` | Creates a new class loader per compile. |\n| `--log=subsystem:level`\
    \ | Logs at the specified level. |\n| `--package=name` | Specifies the package\
    \ for generated classes. |\n| `--parse-only` | Parses the code without compiling.\
    \ |\n| `--print-ast` | Prints the abstract syntax tree of the code. |\n| `--print-code`\
    \ | Prints the bytecode. |\n| `--print-lower-ast` | Prints the lowered AST. |\n\
    | `--print-lower-parse` | Prints the lowered parse tree. |\n| `--scripting` |\
    \ Enabled shell scripting. |\n| `--stderr=filename\\|stream\\|tty` | Redirects\
    \ the standard error stream to the specified file, stream or text terminal. |\n\
    | `--stdout=filename\\|stream\\|tty` | Redirects the standard output stream to\
    \ the specified file, stream or text terminal. |\n| `-v` or `-version` | Prints\
    \ the Nashorn version. |\n| `-xhelp` | Prints extended help for command-line options.\
    \ |\n\nTable 8.1: `jjs` options\n\nYou can list all available options using the\
    \ `-help` option:\n\n```\n $ jjs -help\n```\n\nOr even a more complete list of\
    \ options using `-xhelp`:\n\n```\n $ jjs -xhelp\n```\n\nIf you are curious about\
    \ how the underlying compiler works, try the `--print-ast` and `--print-code`\
    \ options.\n\n```\n $ jjs --print-ast myscript.js\n$ jjs --print-code myscript.js\n\
    ```\n\nIn addition to `jjs`, there is also another tool, `jrunscript`, that invokes\
    \ any script engine compliant with JSR 223, “Scripting for the Java Platform.”\
    \ With Java 8 installed and without any options, `jrunscript` will invoke Nashorn.\n\
    \n```\n $ jrunscript\nnashorn>\n```\n\nTry it yourself.\n\n```\n $ jrunscript\n\
    nashorn> print(300 + 700)\n1000\n```\n\n### Using Nashorn from Java Code\n\nYou\
    \ can run JavaScript from your Java code. But, why would you do that? One scenario:\
    \ You have complex JavaScript functions that you don’t want to rewrite in Java.\n\
    \nTo call Nashorn from Java, use the `javax.script` package. The `ScriptEngine`\
    \ interface’s `eval` methods evaluate a JavaScript script and returns the result\
    \ as a `java.lang.Object`. The multiple overloads of `eval` allow you to pass\
    \ a `String` or a `Reader`.\n\n```\n public java.lang.Object eval(java.lang.String\
    \ script) \n        throws ScriptException\npublic java.lang.Object eval(java.io.Reader\
    \ scriptFile)\n        throws ScriptException\n```\n\nYou can obtain a `ScriptEngine`\
    \ implementation using the `ScriptEngineManager`’s `getEngineByName` method:\n\
    \n```\n ScriptEngineManager factory = new ScriptEngineManager();\nScriptEngine\
    \ engine = factory.getEngineByName(\"nashorn\");\n```\n\nFor example, the `ScriptEngineDemo1`\
    \ class in Listing 8.2 obtains a `ScriptEngine` and runs a small JavaScript script.\n\
    \n### Listing 8.2: The `ScriptEngineDemo1` class\n\n```\n package nashorn.fromjava;\n\
    import javax.script.ScriptEngine;\nimport javax.script.ScriptEngineManager;\n\n\
    public class ScriptEngineDemo1 {\n    public static void main(String[] args) {\n\
    \        ScriptEngineManager factory = new ScriptEngineManager();\n        ScriptEngine\
    \ engine = factory.getEngineByName(\"nashorn\");\n        Object result = engine.eval(\"\
    300 + 700\");\n        System.out.println(result);\n    }\n}\n```\n*(Note: The\
    \ source code for 8.2 was partially fragmented in the prompt; it is reconstructed\
    \ based on the context provided).*\n\n### Invoking Java from JavaScript\n\nYou\
    \ can run JavaScript from your Java code. But, why would you do that? One scenario:\
    \ You have complex JavaScript functions that you don’t want to rewrite in Java.\n\
    \nTo call Nashorn from Java, use the `javax.script` package. The `ScriptEngine`\
    \ interface’s `eval` methods evaluate a JavaScript script and returns the result\
    \ as a `java.lang.Object`. The multiple overloads of `eval` allow you to pass\
    \ a `String` or a `Reader`.\n\n```\n public java.lang.Object eval(java.lang.String\
    \ script) \n        throws ScriptException\npublic java.lang.Object eval(java.io.Reader\
    \ scriptFile)\n        throws ScriptException\n```\n\nYou can obtain a `ScriptEngine`\
    \ implementation using the `ScriptEngineManager`’s `getEngineByName` method:\n\
    \n```\n ScriptEngineManager factory = new ScriptEngineManager();\nScriptEngine\
    \ engine = factory.getEngineByName(\"nashorn\");\n```\n\nFor example, the `ScriptEngineDemo1`\
    \ class in Listing 8.2 obtains a `ScriptEngine` and runs a small JavaScript script.\n\
    \n### Listing 8.3: Evaluating JavaScript file\n\n```java\n package nashorn.fromjava;\n\
    import java.io.FileReader;\nimport java.io.FileNotFoundException;\nimport javax.script.ScriptEngine;\n\
    import javax.script.ScriptEngineManager;\nimport javax.script.ScriptException;\n\
    \npublic class ScriptEngineDemo2 {\n    public static void main(String[] args)\
    \ throws ScriptException {\n        ScriptEngineManager factory = new ScriptEngineManager();\n\
    \        ScriptEngine engine = factory.getEngineByName(\"nashorn\");\n       \
    \ Object result = engine.eval(new FileReader(\"test1.js\"));\n        System.out.println(result);\n\
    \    }\n}\n```\n*(Note: The provided text contained significant overlapping/fragmented\
    \ content. The structure above follows the logical flow of the document's intent).*\n\
    \n### Listing 8.4: Using Java from JavaScript\n\n```javascript\n var path = java.nio.file.Paths.get(\"\
    sales.txt\");\n var lines = java.nio.file.Files.lines(path);\nprint(\"Total: \"\
    \ + lines.mapToDouble(function(s) {return parseFloat(s)})\n        .sum());\n\n\
    // lines stream has been closed, so we need to re-open it\nlines = java.nio.file.Files.lines(path);\n\
    print(\"Average: \" + lines.mapToDouble(function(s) {return parseFloat(s)})\n\
    \        .average().getAsDouble());\n```\n\n### Listing 8.5: The equivalent Java\
    \ code\n\n```java\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\nimport\
    \ java.nio.file.Files;\nimport java.util.stream.DoubleStream;\nimport java.util.stream.Stream;\n\
    \npublic class Main {\n    public static void main(String[] args) throws Exception\
    \ {\n        Path path = Paths.get(\"sales.txt\");\n        Stream<String> lines\
    \ = Files.lines(path);\n        DoubleStream ds = lines.mapToDouble(a -> Double.parseDouble(a));\n\
    \        System.out.println(\"Total: \" + ds.sum());\n\n        lines = Files.lines(path);\n\
    \        ds = lines.mapToDouble(a -> Double.parseDouble(a));\n        System.out.println(\"\
    Average: \" + ds.average().getAsDouble());\n    }\n}\n```\n"
  raw: "Listing 8.1: The test1.js file\n\n```\n function add(a, b) {\n    return a\
    \ + b;\n}\nvar c = add(10, 20)\nprint(c)\n```\n\nNow, call jjs and pass test1.js:\n\
    \n```\n $ jjs test1.js\n30\n```\n\nAs mentioned earlier, jjs can be used with\
    \ options. Table 8.1 lists some of the options.\n\n| Option | Description |\n\n\
    | -ccs=size or--class-cache-size=size | Specifies the class cache size in bytes.\
    \ The letter k or K indicates kilobytes, m or M megabytes and g or G gigabytes.\
    \ The default class cache size is 50. |\n\n| -co or --compile-only | Compiles\
    \ the script without running it. |\n\n| -cp or -classpath | Specifies the class\
    \ path. This option can be repeated to specify multiple class paths. |\n\n| -Dname=value\
    \ | Passes a system property key and value. |\n\n| -d=path or--dump-debug-dir=path\
    \ | Specifies the path to a directory to dump class files to. |\n\n| --debug-lines=true&#124;false\
    \ | Indicates whether a line number table should be generated in the class file.\
    \ By default, this option is on. |\n\n| --debug-locals | Generates a local variable\
    \ table in the class file. |\n\n| -doe or--dump-on-error | Provides a full stack\
    \ trace when an error occurs. By default, only a brief error message is printed.\
    \ |\n\n| --early-lvalue-error | Reports invalid lvalue expressions as early errors.\
    \ |\n\n| --empty-statements | Preserves empty statements in the Java abstract\
    \ syntax tree. |\n\n| -fv or -fullversion | Prints the full version of Nashorn.\
    \ |\n\n| --function-statement-error | Prints an error message when a function\
    \ declaration is used as a statement. |\n\n| --function-statement-warning | Prints\
    \ a warning message when a function declaration is used as a statement. |\n\n\
    | -fx | Launches the script as a JavaFX application. |\n\n| -h or -help | Prints\
    \ the list of options and their descriptions. |\n\n| -Joption | Passes a Java\
    \ option to the JVM. |\n\n| -lazy-compilation | Enables lazy code generation.\
    \ |\n\n| --loader-per-compile | Creates a new class loader per compile. |\n\n\
    | --log=subsystem:level | Logs at the specified level. |\n\n| --package=name |\
    \ Specifies the package for generated classes. |\n\n| --parse-only | Parses the\
    \ code without compiling. |\n\n| --print-ast | Prints the abstract syntax tree\
    \ of the code. |\n\n| --print-code | Prints the bytecode. |\n\n| --print-lower-ast\
    \ | Prints the lowered AST. |\n\n| --print-lower-parse | Prints the lowered parse\
    \ tree. |\n\n| --scripting | Enabled shell scripting. |\n\n| --stderr=filename&#124;stream&#124;tty\
    \ | Redirects the standard error stream to the specified file, stream or text\
    \ terminal. |\n\n| --stdout=filename&#124;stream&#124;tty | Redirects the standard\
    \ output stream to the specified file, stream or text terminal. |\n\n| -v or -version\
    \ | Prints the Nashorn version. |\n\n| -xhelp | Prints extended help for command-line\
    \ options. |\n\nTable 8.1: jjs options\n\nYou can list all available options using\
    \ the -help option:\n\n```\n $ jjs -help\n```\n\nOr even a more complete list\
    \ of options using -xhelp:\n\n```\n $ jjs -xhelp\n```\n\nIf you are curious about\
    \ how the underlying compiler works, try the --print-ast and --print-code options.\n\
    \n```\n $ jjs --print-ast myscript.js\n$ jjs --print-code myscript.js\n```\n\n\
    In addition to jjs, there is also another tool, jrunscript, that invokes any script\
    \ engine compliant with JSR 223, “Scripting for the Java Platform.” With Java\
    \ 8 installed and without any options, jrunscript will invoke Nashorn.\n\n```\n\
    \ $ jrunscript\nnashorn>\n```\n\nTry it yourself.\n\n```\n $ jrunscript\nnashorn>\
    \ print(300 + 700)\n1000\n```\n\nUsing Nashorn from Java Code\n\nYou can run JavaScript\
    \ from your Java code. But, why would you do that? One scenario: You have complex\
    \ JavaScript functions that you don’t want to rewrite in Java.\n\nTo call Nashorn\
    \ from Java, use the javax.script package. The ScriptEngine interface’s eval methods\
    \ evaluate a JavaScript script and returns the result as a java.lang.Object. The\
    \ multiple overloads of eval allow you to pass a String or a Reader.\n\n```\n\
    \ public java.lang.Object eval(java.lang.String script) \n        throws ScriptException\n\
    public java.lang.Object eval(java.io.Reader scriptFile)\n        throws ScriptException\n\
    ```\n\nYou can obtain a ScriptEngine implementation using the ScriptEngineManager’s\
    \ getEngineByName method:\n\n```\n ScriptEngineManager factory = new ScriptEngineManager();\n\
    ScriptEngine engine = factory.getEngineByName(\"nashorn\");\n```\n\nFor example,\
    \ the ScriptEngineDemo1 class in Listing 8.2 obtains a ScriptEngine and runs a\
    \ small JavaScript script.\n\nListing 8.2: The ScriptEngineDemo1 class\n\n```\n\
    \ package nashorn.fromjava;\nimport javax.script.ScriptEngine;\nimport javax.script.ScriptEngineManager;\n\
    import javax.script.ScriptException;\n\npublic class ScriptEngineDemo1 {\n   \
    \ public static void main(String[] args) {\n        ScriptEngineManager factory\
    \ = new ScriptEngineManager();\n        ScriptEngine engine = factory.getEngineByName(\"\
    nashorn\");\n\n        // evaluate JavaScript statement\n        try {\n     \
    \       engine.eval(\"print('A taste of Nashorn');\");\n        } catch (ScriptException\
    \ e) {\n        \te.printStackTrace();\n        }\n    }\n}\n```\n\nRunning the\
    \ ScriptEngineDemo1 class prints “A taste of Nashorn” on the console.\n\nOf course,\
    \ most of the time it is more convenient to write JavaScript code in a file rather\
    \ than as a Java String. Listing 8.3 shows how to load a JavaScript file and execute\
    \ it with Nashorn.\n\nListing 8.3: Evaluating a JavaScript file\n\n```\n package\
    \ nashorn.fromjava;\nimport java.io.FileNotFoundException;\nimport java.io.FileReader;\n\
    import javax.script.ScriptEngine;\nimport javax.script.ScriptEngineManager;\n\
    import javax.script.ScriptException;\n\npublic class ScriptEngineDemo2 {\n   \
    \ public static void main(String[] args) {\n        ScriptEngineManager factory\
    \ = new ScriptEngineManager();\n        ScriptEngine engine = factory.getEngineByName(\"\
    nashorn\");\n        // evaluate JavaScript file\n        try {\n            engine.eval(new\
    \ FileReader(\"jjstest/test1.js\"));\n        } catch (FileNotFoundException |\
    \ ScriptException e) {\n        \te.printStackTrace(); \n        }\n    }\n}\n\
    ```\n\nInvoking Java from JavaScript\n\nYou can use your Java skills to perform\
    \ certain tasks with Nashorn. Neither a Java project nor compilation is necessary.\
    \ Assuming you are using a computer with Java 8 installed, you can, for example,\
    \ read a text file and process the content or use the java.lang.Math class to\
    \ perform complex arithmetic operations.\n\nYou can also tell Nashorn to handle\
    \ Java 8 new features. Even though Nashorn cannot parse Java lambda expressions,\
    \ don’t despair. You can replace a lambda expression with an anonymous JavaScript\
    \ function. For example, this lambda expression\n\n```\n (a) -> 3 * a\n```\n\n\
    can be replaced with\n\n```\n function(a) {\n    return 3 * a;\n}\n```\n\nThe\
    \ code in Listing 8.4 opens and reads the content of the sales.txt file and calculates\
    \ the sales figures there.\n\nListing 8.4: Using Java from JavaScript\n\n```\n\
    \ var path = java.nio.file.Paths.get(\"sales.txt\");\nvar lines = java.nio.file.Files.lines(path);\n\
    print(\"Total: \" + lines.mapToDouble(function(s) {return parseFloat(s)})\n  \
    \      .sum());\n\n// lines stream has been closed, so we need to re-open it\n\
    lines = java.nio.file.Files.lines(path);\nprint(\"Average: \" + lines.mapToDouble(function(s)\
    \ {return parseFloat(s)})\n        .average().getAsDouble());\n```\n\nTo give\
    \ you a better perspective, the equivalent Java code is given in Listing 8.5.\n\
    \nListing 8.5: The equivalent Java code\n\n```\n Path path = java.nio.file.Paths.get(\"\
    sales.txt\");\nStream<String> lines = java.nio.file.Files.lines(path);\nDoubleStream\
    \ ds = lines.mapToDouble(a -> Double.parseDouble(a));\nSystem.out.println(\"Total:\
    \ \" + ds.sum());\n\nlines = java.nio.file.Files.lines(path);\nds = lines.mapToDouble(a\
    \ -> Double.parseDouble(a));\nSystem.out.println(\"Average: \" + ds.average().getAsDouble());\n\
    ```\n\nTo run the script in Listing 8.4, change directory to where the sales.txt\
    \ file is located and issue this command:\n\n```\n $ jjs test1.js\n```\n\nThe\
    \ result will be printed on the console:\n\n```\n 30\n```\n\nRunning JavaFX with\
    \ Nashorn"
