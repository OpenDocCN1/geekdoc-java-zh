    \ `Period` 是非常的，这得益于 `of`、`ofDays()`、`ofWeeks()`、`ofMonths()` 和 `ofYears()` 之间的静态工厂方法。例如，以下是创建一个代表两周的\
    \ `Period` 的方法。\n\n```\nPeriod twoWeeks = Period.ofWeeks(2);\n```\n\n要创建一个代表一年两个月三日的\
    \ `Period`，请使用 `of` 方法。\n\n```\nPeriod p = Period.of(1, 2, 3);\n```\n\n要获取 `Period`\
    \ 的年/月/日组件，调用其 `getYears()`、`getMonths()` 和 `getDays()` 方法。例如，以下代码段中的 `howManyDays`\
    \ 变量的值为 14。\n\n```\nPeriod twoWeeks = Period.ofWeeks(2);\nint howManyDays = twoWeeks.getDays();\n\
    ```\n\n最后，你可以使用 `plusXXX` 或 `minusXXX` 方法以及 `withXXX` 方法之一来创建 `Period` 的副本。`Period`\
    \ 是不可变的，因此这些方法返回的是新的 `Period` 实例。\n\n例如，列表 5.3 中的代码显示了一个计算年龄的年龄计算器。它从两个 `LocalDate`\
    \ 创建一个 `Period` 并调用它的 `getDays()`、`getMonths()` 和 `getYears()` 方法。\n\n#### 列表\
    \ 5.3：使用 `Period`\n\n```java\npackage app05;\nimport java.time.LocalDate;\nimport\
    \ java.time.Period;\n\npublic class PeriodDemo1 {\n    public static void main(String[]\
    \ args) {\n        LocalDate dateA = LocalDate.of(1978, 8, 26);\n        LocalDate\
    \ dateB = LocalDate.of(1988, 9, 28);\n        Period period = Period.between(dateA,\
    \ dateB);\n        System.out.printf(\"Between %s and %s\"\n                +\
    \ \" there are %d years, %d months\"\n                + \" and %d days%n\", dateA,\
    \ dateB, \n                period.getYears(), \n                period.getMonths(),\n\
    \                period.getDays());\n    }\n}\n```\n\n运行时，列表 5.3 中的 `PeriodDemo1`\
    \ 类将打印此字符串。\n\n```\nBetween 1978-08-26 and 1988-09-28 there are 10 years, 1 months\
    \ and 2 \ndays\n```\n\n### LocalDateTime\n\n`LocalDateTime` 类模型了一个没有时区的日期时间。表\
    \ 5.3 显示了 `LocalDateTime` 中一些重要的方法。这些方法与 `LocalDate` 的方法相似，增加了一些修改时间组件的方法，例如 `plusHours()`、`plusMinutes()`\
    \ 和 `plusSeconds()`，这些方法在 `LocalDate` 中是不可用的。\n\n| 方法 |  |\n| :--- | :--- |\n\
    | `now` | 返回当前日期和时间的静态方法。 |\n| `of` | 从指定的年、月、日、时、分、秒和毫秒创建 `LocalDateTime` 的静态方法。\
    \ |\n| `getYear`, `getMonthValue`, `getDayOfMonth`, `getHour`, `getMinute`, `getSecond`\
    \ | 以 `int` 返回此 `LocalDateTime` 的年、月、日、小时、分或秒部分。 |\n| `plusDays`, `minusDays`\
    \ | 向当前的 `LocalDateTime` 增加或减去指定的天数。 |\n| `plusWeeks`, `minusWeeks` | 向当前的 `LocalDateTime`\
    \ 增加或减去指定的周。 |\n| `plusMonths`, `minusMonths` | 向当前的 `LocalDateTime` 增加或减去指定的月份。\
    \ |\n| `plusYears`, `minusYears` | 向当前的 `LocalDateTime` 增加或减去指定的年份。 |\n| `plusHours`,\
    \ `minusHours` | 向当前的 `LocalDateTime` 增加或减去指定的时长。 |\n| `plusMinutes`, `minusMinutes`\
    \ | 向当前的 `LocalDateTime` 增加或减去指定的分钟。 |\n| `plusSeconds`, `minusSeconds` | 向当前的\
    \ `LocalDateTime` 增加或减去指定的秒数。 |\n| `isAfter`, `isBefore` | 检查此 `LocalDateTime`\
    \ 是否在给定日期时间之后或之前。 |\n| `withDayOfMonth` | 返回一个日几数设置为给定值的此 `LocalDateTime` 副本。\
    \ |\n| `withMonth`, `withYear` | 返回一个月份或年份设置为给定值的此 `LocalDateTime` 副本。 |\n| `withHour`,\
    \ `withMinute`, `withSecond` | 返回一个小时/分/秒设置为给定值的此 `LocalDateTime` 副本。 |\n\n####\
    \ 表 5.3：`LocalDateTime` 的更多重要方法\n\n`LocalDateTime` 提供了各种静态方法来创建日期时间。`now` 方法带有三个重载，并返回当前日期时间。无参数重载最容易使用：\n\
    \n```\nLocalDateTime now = LocalDateTime.now();\n```\n\n要创建一个具有特定日期时间的 `LocalDateTime`，请使用\
    \ `of` 方法。该方法有多个重载，允许你传递日期时间的单个组件或一个 `LocalDate` 和一个 `LocalTime`。以下是一些 `of` 方法的签名。\n\
    \n```java\npublic static LocalDateTime of(int year, int month, int dayOfMonth,\
    \ int hour, int minute)\npublic static LocalDateTime of(int year, int month, int\
    \ dayOfMonth, int hour, int minute)\npublic static LocalDateTime of(int year,\
    \ Month month, int dayOfMonth, int hour, int minute)\npublic static LocalDateTime\
    \ of(int year, Month month, int dayOfMonth, int hour, int minute)\npublic static\
    \ LocalDateTime of(LocalDate date, LocalTime time)\n```\n\n例如，以下代码段创建了一个表示 2015\
    \ 年 12 月 31 日早上 8 点的 `LocalDateTime`。\n\n```\nLocalDateTime endOfYear = LocalDateTime.of(2015,\
    \ 12, 31, 8, 0);\n```\n\n你可以使用 `plusXXX` 或 `minusXXX` 方法创建 `LocalDateTime` 的副本。例如，这段代码创建了一个代表明天同一时间的\
    \ `LocalDateTime`。\n\n```\nLocalDateTime now = LocalDateTime.now();\nLocalDateTime\
    \ sameTimeTomorrow = now.plusHours(24);\n```\n\n### 时区\n\n互联网分配编号机构 (IANA) 维护着时区数据库，你可以从此网页下载：\n\
    \n```\nhttp://www.iana.org/time-zones\n```\n\n然而，为了方便查看，你只需要访问这个维基百科页面：\n\n```\n\
    http://en.wikipedia.org/wiki/List_of_tz_database_time_zones\n```\n\nJava 日期时间\
    \ API 也考虑了时区。抽象类 `ZoneId`（在 `java.time` 中）表示区域标识符。它有一个静态方法 `getAvailableZoneIds()`，返回所有区域标识符。列表\
    \ 5.4 显示了如何使用此方法打印所有区域的排序列表。\n\n#### 列表 5.4：列出所有区域标识符\n\n```java\npackage app05;\n\
    import java.time.ZoneId;\nimport java.util.ArrayList;\nimport java.util.Collections;\n\
    import java.util.List;\nimport java.util.Set;\n\npublic class ZoneDemo1 {\n  \
    \  public static void main(String[] args) {\n        Set<String> allZoneIds =\
    \ ZoneId.getAvailableZoneIds();\n        List<String> zoneList = new ArrayList<>(allZoneIds);\n\
    \n        Collections.sort(zoneList);\n        for (String zoneId : zoneList)\
    \ {\n            System.out.println(zoneId);\n        }\n        // 另一种，你可以使用这行代码来\n\
    \        // 打印排序后的区域列表\n        // ZoneId.getAvailableZoneIds().stream().sorted()\n\
    \        //        forEach(System.out::println);\n    }\n}\n```\n\n`getAvailableZoneIds()`\
    \ 返回一个 `String` 的 `Set`。你可以使用 `Collections.sort()` 对 `Set` 进行排序，或者更优雅地调用它的 `stream`\
    \ 方法。你可以编写这样的代码来排序区域标识符：\n\n```\nZoneId.getAvailableZoneIds().stream().sorted()\n\
    \        .forEach(System.out::println);\n```\n\n`getAvailableZoneIds()` 返回包含 586\
    \ 个区域标识符的 `Set`。以下是上述代码中的一些区域标识符。\n\n```\nAfrica/Cairo\nAfrica/Johannesburg\n\
    America/Chicago\nAmerica/Los_Angeles\nAmerica/Mexico_City\nAmerica/New_York\n\
    America/Toronto\nAntarctica/South_Pole\nAsia/Hong_Kong\nAsia/Shanghai\nAsia/Tokyo\n\
    Australia/Melbourne\nAustralia/Sydney\nCanada/Atlantic\nEurope/Amsterdam\nEurope/London\n\
    Europe/Paris\nUS/Central\nUS/Eastern\nUS/Pacific\n```\n\n### ZonedDateTime\n\n\
    `ZonedDateTime` 类模型了一个带有时区的日期时间。例如，以下是一个带时区的日期时间：\n\n```\n2015-12-31T10:59:59+01:00\
    \ Europe/Paris\n```\n\n"
- fmt: "\nA `ZonedDateTime` is always immutable and the time component is stored to\
    \ nanosecond precision.\n\nTable 5.4 shows the more important methods in `ZonedDateTime`.\n\
    \n| Method | Description |\n| :--- | :--- |\n| `now` | A static method that returns\
    \ the current date and time of the system’s default zone. |\n| `of` | A static\
    \ method that creates a `ZonedDateTime` from the specified date-time and zone\
    \ identifier. |\n| `getYear`, `getMonthValue`, `getDayOfMonth`, `getHour`, `getMinute`,\
    \ `getSecond`, `getNano` | Returns the year, month, day, hour, minute, second\
    \ or nanosecond part of this `ZoneDateTime` as an int. |\n| `plusDays`, `minusDays`\
    \ | Adds or subtracts the given number of days to or from the current `ZonedDateTime`.\
    \ |\n| `plusWeeks`, `minusWeeks` | Adds or subtracts the given number of weeks\
    \ to or from the current `ZonedDateTime`. |\n| `plusMonths`, `minusMonths` | Adds\
    \ or subtracts the given number of months to or from the current `ZonedDateTime`.\
    \ |\n| `plusYears`, `minusYears` | Adds or subtracts the given number of years\
    \ to or from the current `ZonedDateTime`. |\n| `plusHours`, `minusHours` | Adds\
    \ or subtracts the given number of hours to or from the current `ZonedDateTime`.\
    \ |\n| `plusMinutes`, `minusMinutes` | Adds or subtracts the given number of minutes\
    \ to or from the current `ZonedDateTime`. |\n| `plusSeconds`, `minusSeconds` |\
    \ Add or subtracts the given number of seconds to or from the current `ZonedDateTime`.\
    \ |\n| `isAfter`, `isBefore` | Checks if this `ZonedDateTime` is after or before\
    \ the given zoned date-time. |\n| `getZone` | Returns the zone ID of this `ZonedDateTime`.\
    \ |\n| `withYear`, `withMonth`, `withDayOfMonth` | Returns a copy of this `ZonedDateTime`\
    \ with the year/month/day of month set to the given value. |\n| `withHour`, `withMinute`,\
    \ `withSecond` | Returns a copy of this `ZonedDateTime` with the hour/minute/second\
    \ set to the given value. |\n| `withNano` | Returns a copy of this `ZonedDateTime`\
    \ with the nanosecond set to the given value. |\n\nTable 5.4: More important methods\
    \ of `ZonedDateTime`\n\nLike `LocalDateTime`, the `ZonedDateTime` class offers\
    \ the static methods `now` and `of` to construct a `ZonedDateTime`. `now` creates\
    \ a `ZonedDateTime` representing the date and time of execution. The no-argument\
    \ override of `now` creates a `ZonedDateTime` with the computer’s default time\
    \ zone.\n\n```\nZonedDateTime now = ZonedDateTime.now();\n```\n\nAnother override\
    \ of `now` lets you pass a zone identifier:\n\n```\nZonedDateTime parisTime =\n\
    \        ZonedDateTime.now(ZoneId.of(\"Europe/Paris\"));\n```\n\nThe method `of`\
    \ also comes with several overrides. In all cases, you need to pass a zone identifier.\
    \ The first override allows you to pass each component of a zoned date-time, from\
    \ the year to the nanosecond.\n\n```\npublic static ZonedDateTime of(int year,\
    \ int month, int dayOfMonth, \n        int hour, int minute, int second, int nanosecond,\
    \ \n        ZoneId zone)\n```\n\nThe second override of `of` takes a `LocalDate`,\
    \ a `LocalTime` and a `ZoneId`:\n\n```\npublic static ZonedDateTime of(LocalDate\
    \ date, LocalTime time,\n        ZoneId zone)\n```\n\nThe last override of `of`\
    \ takes a `LocalDateTime` and a `ZoneId`.\n\n```\npublic static ZonedDateTime\
    \ of(LocalDateTime datetime, ZoneId zone)\n```\n\nLike `LocalDate` and `LocalDateTime`,\
    \ `ZonedDateTime` offers methods to create a copy of an instance using the `plusXXX`,\
    \ `minusXXX` and `withXXX` methods.\n\nFor instance, these lines of code creates\
    \ a `ZonedDateTime` with the default time zone and calls its `minusDays` method\
    \ to create the same `ZonedDateTime` three days earlier.\n\n```\nZonedDateTime\
    \ now = ZonedDateTime.now();\nZonedDateTime threeDaysEarlier = now.minusDays(3);\n\
    ```\n\n### Duration\n\nThe `Duration` class models a time-based duration. It is\
    \ similar to `Period` except that a `Duration` has a time component to nanosecond\
    \ precision and takes into account the time zones between `ZonedDateTimes`. Table\
    \ 5.5 shows the more important methods in `Duration`.\n\n| Method | Description\
    \ |\n| :--- | :--- |\n| `between` | Creates a `Duration` between two temporal\
    \ objects, such as between two `LocalDateTimes` or two `LocalZonedDateTimes`.\
    \ |\n| `ofYears`, `ofMonths`, `ofWeeks`, `ofDays`, `ofHours`, `ofMinutes`, `ofSeconds`,\
    \ `ofNano` | Creates a `Duration` representing the given number of years/months/weeks/days/hours/minutes/seconds/nanoseconds.\
    \ |\n| `of` | Creates a `Duration` from the given number of temporal units. |\n\
    | `toDays`, `toHours`, `toMinutes` | Returns the number of days/hours/minutes\
    \ of this `Duration` as an int. |\n| `isNegative` | Returns true if this `Duration`\
    \ is negative. Returns false otherwise. |\n| `isZero` | Returns true if this `Duration`\
    \ is zero length. Otherwise, returns false. |\n| `plusDays`, `minusDays` | Adds\
    \ or subtracts the given number of days to or from this `Duration`. |\n| `plusMonths`,\
    \ `minusMonths` | Adds or subtracts the given number of months to or from this\
    \ `Duration`. |\n| `plusYears`, `minusYears` | Adds or subtracts the given number\
    \ of years to or from this `Duration`. |\n| `withSeconds` | Returns a copy of\
    \ this `Duration` with the specified number of seconds. |\n\nTable 5.5: More important\
    \ methods in `Duration`\n\nYou can create a `Duration` by calling its `between`\
    \ or `of` static method. The code in Listing 5.5 creates a `Duration` between\
    \ two `LocalDateTimes`, between January 26, 2015 11:10 and January 26, 2015 12:40.\n\
    \nListing 5.5: Creating a Duration between two LocalDateTimes\n\n```java\npackage\
    \ app05;\nimport java.time.Duration;\nimport java.time.LocalDateTime;\n\npublic\
    \ class DurationDemo1 {\n\n    public static void main(String[] args) {\n    \
    \    LocalDateTime dateTimeA = LocalDateTime\n                .of(2015, 1, 26,\
    \ 8, 10, 0, 0);\n        LocalDateTime dateTimeB = LocalDateTime\n           \
    \     .of(2015, 1, 26, 11, 40, 0, 0);\n        Duration duration = Duration.between(\n\
    \                dateTimeA, dateTimeB);\n        System.out.printf(\"There are\
    \ %d hours and %d minutes.%n\",\n                duration.toHours(), \n      \
    \          duration.toMinutes() % 60);\n    }\n}\n```\n\nThe result of running\
    \ the `DurationDemo1` class is this.\n\n```\nThere are 3 hours and 30 minutes.\n\
    ```\n\nThe code in Listing 5.6 creates a `Duration` between two `ZoneDateTimes`,\
    \ with the same date-time but different timezones.\n\nListing 5.6: Creating a\
    \ Duration between two ZonedDateTimes\n\n```java\npackage app05;\nimport java.time.Duration;\n\
    import java.time.LocalDateTime;\nimport java.time.Month;\nimport java.time.ZoneId;\n\
    import java.time.ZonedDateTime;\n\npublic class DurationDemo2 {\n\n    public\
    \ static void main(String[] args) {\n        ZonedDateTime zdt1 = ZonedDateTime.of(\n\
    \                LocalDateTime.of(2015, Month.JANUARY, 1, \n                 \
    \       8, 0),\n                ZoneId.of(\"America/Denver\"));\n        ZonedDateTime\
    \ zdt2 = ZonedDateTime.of(\n                LocalDateTime.of(2015, Month.JANUARY,\
    \ 1, \n                        8, 0), \n                ZoneId.of(\"America/Toronto\"\
    ));\n        Duration duration = Duration.between(zdt1, zdt2);\n        System.out.printf(\"\
    There are %d hours and %d minutes.%n\",\n                duration.toHours(), \n\
    \                duration.toMinutes() % 60);\n    }\n}\n```\n\nRunning the `DurationDemo2`\
    \ class prints this on the console.\n\n```\nThere are -2 hours and 0 minutes.\n\
    ```\n\nThis is expected, because there are two hours difference between the time\
    \ zones America/Denver and America/Toronto.\n\nAs a more complex example, the\
    \ code in Listing 5.7 shows a bus travel time calculator. It has one method, `calculateTravelTime`,\
    \ which takes a departure `ZonedDateTime` and an arrival `ZonedDateTime`. The\
    \ code calls the `calculateTravelTime` method twice. Both times the bus departs\
    \ from Denver, Colorado at 8 in the morning Denver time and arrives in Toronto\
    \ at 8 in the next morning Toronto time. The first time the bus leaves on March\
    \ 8, 2014 and the second time it leaves on March 18, 2014.\n\nWhat are the travel\
    \ time in both occasions?\n\nListing 5.7: Travel time calculator\n"
