  trans: "\n\n除了使用样式类（style classes），你还可以创建一个由组件标识符（identifier）引用的样式。如果你希望样式只影响某个类型的特定实例，而不是该类型的所有实例，就可以这样做。例如，`.button`\
    \ 样式会影响应用程序中所有的 `Button` 控件。如果你想让样式影响某个 `Button` 而不是所有的 `Buttons`，你可以为该 `Button`\
    \ 添加新类，或者为它添加一个标识符。这是一个分配了 id `nextBtn` 的 `Button` 示例。\n\n```\n Button nextButton\
    \ = new Button(\"Next\"); \nnextButton.setId(\"nextBtn\"); \n```\n\n然后你可以在 CSS\
    \ 文件中创建此样式，它只会影响该 Button。\n\n```\n #nextBtn { \n    -fx-font-weight: bold; \n\
    }\n```\n\n注意，每个节点都有一个 `setStyle` 方法，你可以调用它来分配 CSS 样式。然而但不推荐这种做法，因为你将表示逻辑和业务逻辑混合在一起了。以下是如何使用\
    \ `setStyle` 的示例。\n\n```\n Button button = new Button();\nbutton.setStyle(\"-fx-background-color:green\"\
    );\n```\n\n最好将所有的样式写在 CSS 文件中。一旦你的 CSS 文件准备好，你就可以从应用程序的启动方法加载它，如下所示。\n\n```\n\
    \ @Override \npublic void start(Stage stage) { \n    ...\n    Scene scene = ...;\
    \ \n    scene.getStylesheets().add(\"style.css\");\n    ...\n} \n```\n\n在这里，`style.css`\
    \ 是位于类文件相同位置的 CSS 文件。\n\n以下是本章中使用的一些样式。\n\n*   `-fx-fill`\n*   `-fx-font-family`\n\
    *   `-fx-font-size`\n*   `-fx-font-style`\n*   `-fx-font-weight`\n*   `-fx-background-color`\n\
    *   `-fx-text-fill`\n\n作为一个示例，考虑列表 6.5 中的 `CSSDemo` 类，它使用了列表 6.6 中的 `style.css`\
    \ 文件。\n\n列表 6.5：`CSSDemo` 类\n\n```\n package app06;\nimport javafx.application.Application;\
    \ \nimport javafx.scene.Scene; \nimport javafx.scene.control.Button; \nimport\
    \ javafx.scene.control.Label; \nimport javafx.scene.layout.BorderPane; \nimport\
    \ javafx.scene.layout.HBox; \nimport javafx.stage.Stage; \n\npublic class CSSDemo\
    \ extends Application { \n\n    @Override \n    public void start(Stage stage)\
    \ { \n        BorderPane root = new BorderPane(); \n\n        root.setCenter(new\
    \ Label(\"Welcome\")); \n\n        HBox hBox = new HBox(); \n        hBox.getStyleClass().add(\"\
    hbox\"); \n\n        Button backButton = new Button(\"Back\"); \n        hBox.getChildren().add(backButton);\
    \ \n        Button nextButton = new Button(\"Next\"); \n        nextButton.setId(\"\
    nextBtn\"); \n        hBox.getChildren().add(nextButton); \n        root.setBottom(hBox);\n\
    \n        Scene scene = new Scene(root, 400, 300); \n        scene.getStylesheets().add(\"\
    style.css\");\n\n        stage.setTitle(\"CSS Demo\"); \n        stage.setScene(scene);\
    \ \n        stage.show(); \n    }\n\n    public static void main(String[] args)\
    \ { \n        launch(args); \n    } \n}\n```\n\n列表 6.6：`style.css` 文件\n\n```\n\
    \ .label { \n    -fx-background-color: #778855; \n    -fx-font-family: helvetica;\
    \ \n    -fx-font-size: 45px; \n    -fx-text-fill: yellow;\n}\n.hbox { \n    -fx-background-color:\
    \ #2f4f4f; \n    -fx-padding: 15px; \n    -fx-spacing: 10px; \n    -fx-alignment:\
    \ center;\n}\n\n.button { \n    -fx-border-width: 2px; \n    -fx-background-color:#ff8800;\n\
    \    -fx-cursor: hand;\n}\n\n#nextBtn { \n    -fx-font-weight: bold;\n}\n```\n\
    \n如果你运行该应用程序，你会看到一个与图 6.7 相同的 `Stage`。\n\n![](img/0607.png)\n\n图 6.7：CSS Demo\n\
    \n作为一个补充说明，`jfxrt.jar` 文件（JavaFX 运行时）包含 `modena.css` 文件。这是根节点和 UI 控件的默认样式表。建议查看此文件的内容以学习定义的样式。要查看此文件，请进入\
    \ jar 文件所在的目录并运行此命令：\n\n```\n jar jfxrt.jar com/javafx/scene/control/skin/modena.css\n\
    ```\n\n### 使用 DatePicker\n\nJavaFX 8 中的新组件 `DatePicker` 允许用户选择日期或输入文本。你可以通过 `LocalDate`\
    \ 获取选择的日期。你还可以通过编写 `EventHandler` 并传递给 `DatePicker` 的 `setOnAction` 方法来响应日期选择。\n\
    \n列表 6.7 显示了一个使用 `DatePicker` 选择生日的 JavaFX 应用程序。如果用户选择了未来的日期，将在 `DatePicker` 旁边显示错误消息。\n\
    \n列表 6.7：DatePicker 类\n\n```\n package app06;\nimport java.time.LocalDate;\nimport\
    \ java.time.Period;\nimport javafx.application.Application;\nimport javafx.event.Event;\n\
    import javafx.event.EventHandler;\nimport javafx.geometry.HPos;\nimport javafx.scene.Scene;\n\
    import javafx.scene.control.DatePicker;\nimport javafx.scene.control.Label;\n\
    import javafx.scene.layout.GridPane;\nimport javafx.scene.layout.VBox;\nimport\
    \ javafx.stage.Stage;\n\npublic class DatePickerDemo extends Application {\n\n\
    \    public static void main(String[] args) {\n        launch(args);\n    }\n\n\
    \    @Override\n    public void start(Stage stage) {\n        stage.setTitle(\"\
    DatePicker Demo\");\n        VBox vbox = new VBox(20);\n        vbox.setStyle(\"\
    -fx-padding: 15;\");\n        Scene scene = new Scene(vbox, 550, 340);\n     \
    \   stage.setScene(scene);\n\n        GridPane gridPane = new GridPane();\n  \
    \      gridPane.setHgap(10);\n        gridPane.setVgap(10);\n\n        Label label\
    \ = new Label(\"Birthday:\");\n        gridPane.add(label, 0, 0);\n\n        DatePicker\
    \ birthdayPicker = new DatePicker();\n        gridPane.add(birthdayPicker, 0,\
    \ 1);\n\n        Label error = new Label();\n        gridPane.add(error, 1, 1);\n\
    \n        birthdayPicker.setOnAction(new EventHandler() {\n            public\
    \ void handle(Event t) {\n                LocalDate selectedDate = birthdayPicker.getValue();\n\
    \                System.out.println(\"Selected date: \" + selectedDate);\n   \
    \             LocalDate today = LocalDate.now();\n                if (Period.between(selectedDate,\
    \ today).isNegative()) {\n                    error.setText(\"Your birthday cannot\
    \ be later than today\");\n                } else {\n                    error.setText(\"\
    \");\n                }\n            }\n        });\n\n        vbox.getChildren().add(gridPane);\n\
    \        stage.show();\n    }\n}\n```\n\n图 6.8 显示了应用程序。\n\n![](img/0608.png)\n\
    \n图 6.8：编程步骤\n\n总结\n\nJavaFX 是一种用于创建桌面和浏览器应用程序的 Java 技术。它是比 AWT 和 Swing 更好的解决方案，因此注定将取代它的前身。\n\
    \n本章介绍了 JavaFX 并提供了几个示例。下一章“使用 FXML 的 JavaFX”将解释如何使用名为 FXML 的特殊标记语言来分离表示层和逻辑。\n\
    \n# 第 7 章：使用 FXML 的 JavaFX\n\nFXML 是一种基于 XML 的标记语言，用于构建 JavaFX 用户界面 (UI)。在 JavaFX\
    \ 应用程序中使用 FXML 是分离表示层和逻辑的一种极方法。本章讨论了 FXML 并展示如何在 JavaFX 应用程序开发中使用它。\n\n## 概述\n\
    \nJavaFX 2 的新功能 FXML 通过将用户界面构建移动到基于 XML 的文档，极大降低了 JavaFX 类的复杂度。此外，FXML 比 Java\
    \ 类更能可视化 UI 组件层次结构。FXML 文档的根节点一个 `javafx.scene.Parent`，可以使用名为 `FXLoader` 的特殊加载器加载到\
    \ JavaFX。以下是使用 FXML 的 `Application` 子类的启动方法。\n\n```\n @Override \npublic void\
    \ start(Stage stage) throws Exception { \n    stage.setTitle(\"FXML Example\"\
    ); \n    Parent root = (Parent) FXMLLoader.load(\n            getClass().getResource(\"\
    example1.fxml\")); \n    Scene scene = new Scene(root, 740, 530); \n    stage.setScene(scene);\
    \ \n    stage.show(); \n} \n```\n\n上述代码调用了 `FXLoader` 的 `load` 方法来读取 FXML 文件并将其内容转换为\
    \ `Parent` 对象。然后使用该 `Parent` 对象来构建 `Scene`。\n\n"
- fmt: "\nWriting an FXML file is easy. You start by creating a text file and saving\
    \ it in the same directory as your class file. You can store it somewhere else,\
    \ but it is easiest to load it if it is in the same directory as the class that\
    \ will load it.\n\nAs an FXML file is an XML document, all FXML documents start\
    \ with this declaration.\n\n```\n <?xml version=\"1.0\" encoding=\"UTF-8\"?> \n\
    ```\n\nNext come the import directives to import types you will reference in the\
    \ FXML file. You can import a package or a type.\n\n```\n <?import javafx.scene.*?>\
    \ \n<?import javafx.scene.control.*?> \n<?import javafx.scene.layout.*?> \n<?import\
    \ javafx.geometry.Insets?> \n```\n\nThe root element comes next. It can be any\
    \ subclass of `Parent`. Here is an example.\n\n```\n <GridPane xmlns:fx=\"http://javafx.com/fxml\"\
    \ \n        hgap=\"5\" vgap=\"12\" layoutY=\"30\">\n\n</GridPane>\n```\n\nThe\
    \ `fx` prefix is a special prefix in FXML. You will learn its use later in this\
    \ chapter.\n\nTo set a property in an object, use a nested element or an attribute.\
    \ For example, the `hgap` attribute in the `GridPane` element above populates\
    \ the `GridPane`’s `hgap` property.\n\nInside the root element, construct your\
    \ UI. Listing 7.1 shows an example FXML file.\n\nListing 7.1: An example FXML\
    \ file\n\n```\n <?xml version=\"1.0\" encoding=\"UTF-8\"?> \n<?import javafx.scene.*?>\
    \ \n<?import javafx.scene.control.*?> \n<?import javafx.scene.layout.*?> \n<?import\
    \ javafx.geometry.Insets?> \n<?import javafx.scene.image.Image?> \n<?import javafx.scene.image.ImageView?>\
    \ \n\n<BorderPane> \n    <top> \n        <HBox spacing=\"10.0\" style=\"-fx-background-color:#886699;\"\
    > \n            <padding> \n                <Insets top=\"15\" bottom=\"15\" left=\"\
    12\" right=\"12\"/>\n            </padding> \n            <Button id=\"okButton\"\
    \ text=\"OK\" defaultButton=\"true\"/> \n            <Button text=\"Cancel\"/>\
    \ \n        </HBox> \n    </top> \n</BorderPane> \n```\n\nAn element may contain\
    \ a class to be instantiated or a property to be populated. The FXML file in Listing\
    \ 7.1 contains a root of type `BorderPane`. The `BorderPane` has its `top` property\
    \ populated with an `HBox`. The `HBox` in turn contains two `Buttons` and has\
    \ its `padding` property populated with an `Insets`.\n\nMore details on FXML can\
    \ be found here.\n\n```\n http://docs.oracle.com/javafx/2/api/javafx/fxml/doc-files/\n\
    introduction_to_fxml.html\n```\n\n### Note\n\nIt is recommended that you use an\
    \ IDE that supports JavaFX when writing an FXML and take advantage of its code\
    \ completion feature to make writing FXML easier. NetBeans and IntelliJ support\
    \ JavaFX, and Eclipse supports JavaFX through a plug-in.\n\nThe next sections\
    \ present examples of using FXML in JavaFX applications.\n\n## A Simple FXML-Based\
    \ Application\n\nThis example is a rewrite of the `BorderPaneDemo` application\
    \ created in the previous chapter. This time an FXML document is used to construct\
    \ and organize the UI components. For your reading convenience, the `BorderPaneDemo`\
    \ class is reprinted here.\n\n```\n package app07;\nimport javafx.application.Application;\
    \ \nimport javafx.geometry.Insets; \nimport javafx.scene.Scene; \nimport javafx.scene.control.Button;\
    \ \nimport javafx.scene.control.ColorPicker; \nimport javafx.scene.control.Label;\
    \ \nimport javafx.scene.image.ImageView; \nimport javafx.scene.layout.BorderPane;\
    \ \nimport javafx.scene.layout.HBox; \nimport javafx.scene.layout.VBox; \nimport\
    \ javafx.stage.Stage; \n\npublic class BorderPaneDemo extends Application { \n\
    \n    @Override \n    public void start(Stage stage) { \n        Button okButton\
    \ = new Button(\"OK\"); \n        okButton.setDefaultButton(true); \n\n      \
    \  Button cancelButton = new Button(\"Cancel\"); \n        HBox hBox = new HBox();\
    \ \n        hBox.setPadding(new Insets(15, 12, 15, 12)); \n        hBox.setSpacing(10);\
    \ \n        hBox.setStyle(\"-fx-background-color: #886699;\"); \n        hBox.getChildren().addAll(okButton,\
    \ cancelButton); \n        BorderPane root = new BorderPane(); \n        root.setTop(hBox);\
    \ \n\n        ImageView imageView = new ImageView(\"image/1.jpg\"); \n       \
    \ root.setCenter(imageView); \n\n        VBox vBox = new VBox(); \n        vBox.setStyle(\"\
    -fx-background-color: \" + \n        \t\t\"#ddeeff;-fx-padding:10px\"); \n   \
    \     vBox.getChildren().addAll( \n                new Label(\"Select Color:\"\
    ), \n                new ColorPicker()); \n        root.setLeft(vBox); \n\n  \
    \      root.setStyle(\"-fx-background-color: #6680e6;\"); \n        Scene scene\
    \ = new Scene(root, 740, 530); \n\n        stage.setTitle(\"HBox, VBox, BorderPane\
    \ Demo\"); \n        stage.setScene(scene); \n        stage.show(); \n    } \n\
    \n    public static void main(String[] args) { \n        launch(args); \n    }\
    \ \n}\n```\n\nThe UI construction part of the `BorderPaneDemo` class can be replaced\
    \ with the markup in the `example1.fxml` file shown in Listing 7.2.\n\nListing\
    \ 7.2: The `example1.fxml` file\n\n```\n <?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?> \n<?import javafx.scene.*?> \n<?import javafx.scene.control.*?> \n<?import\
    \ javafx.scene.layout.*?> \n<?import javafx.geometry.Insets?> \n<?import javafx.scene.image.Image?>\
    \ \n<?import javafx.scene.image.ImageView?> \n\n<BorderPane> \n    <top> \n  \
    \      <HBox spacing=\"10.0\" style=\"-fx-background-color:#886699;\"> \n    \
    \        <padding> \n                <Insets top=\"15\" bottom=\"15\" left=\"\
    12\" right=\"12\"/>     \n            </padding> \n            <Button id=\"okButton\"\
    \ text=\"OK\" defaultButton=\"true\"/> \n            <Button text=\"Cancel\"/>\
    \ \n        </HBox> \n    </top> \n    <left> \n        <VBox style=\"-fx-background-color:#ddeeff;-fx-padding:10px\"\
    > \n            <Label text=\"Select Color:\"/> \n            <ColorPicker />\
    \ \n        </VBox> \n    </left> \n    <center> \n        <ImageView> \n    \
    \        <Image url=\"/image/1.jpg\"></Image> \n        </ImageView> \n    </center>\
    \ \n</BorderPane> \n```\n\nThe main Java class, called `Example1`, is given in\
    \ Listing 7.3. It extends `Application` and provides an implementation of the\
    \ `start` method.\n\nListing 7.3: The `Example1` class\n\n```\n package app07;\n\
    import javafx.application.Application; \nimport javafx.fxml.FXMLLoader; \nimport\
    \ javafx.scene.Parent; \nimport javafx.scene.Scene; \nimport javafx.stage.Stage;\
    \ \n\npublic class Example1 extends Application { \n\n    @Override \n    public\
    \ void start(Stage stage) throws Exception {\n        // Example1.fxml must be\
    \ located in the same directory\n        // as Example1.class\n        Parent\
    \ root = FXMLLoader.load(\n                getClass().getResource(\"example1.fxml\"\
    )); \n        root.setStyle(\"-fx-background-color: #6680e6;\"); \n        Scene\
    \ scene = new Scene(root, 740, 530); \n        stage.setTitle(\"JavaFX with FXML\
    \ (Example 1)\"); \n        stage.setScene(scene); \n        stage.show(); \n\
    \    } \n\n    public static void main(String[] args) { \n        launch(args);\
    \ \n    } \n}\n```\n\nThe `start` method uses `FXMLLoader` to load the FXML document\
    \ and return a `Parent` object that contains the components declared in the document.\
    \ The method then creates a `Scene` and passes the `Scene` to the `Stage` before\
    \ calling the `show` method on the `Stage`.\n\nFigure 7.1 shows the result of\
    \ running the application.\n\n![](Images/0701.png)\n\nFigure 7.1: Using FXML\n\
    \n## Event Handling with FXML\n\nFXML is a powerful language. Among its features\
    \ is the ability to bind a UI component with an event-processing method (event\
    \ handler) in a controller, so that the method will be called when the event occurs.\
    \ A controller is a Java class that implements `javafx.fxml.Initializable`. To\
    \ take advantage of this feature, you must use the `fx:controller` attribute in\
    \ your root element, like this.\n\n```\n <Group fx:controller=\"app7.Example2Controller\"\
    \ \n```\n\nRecall that `fx` is a special prefix in FXML.\n\nTo bind a component\
    \ to an event handler, use the relevant `onXXX` attribute of the element. For\
    \ example, to bind the `ActionEvent` with a method called `handleAction` in the\
    \ controller, write this.\n\n```\n onAction=\"#handleAction\"\n```\n\nFor example,\
    \ consider the following application that features a Login form that takes a user\
    \ name and password. The primary stage of the application is shown in Figure 7.2.\n\
    \n![](Images/0702.png)\n\nFigure 7.2: The Login form in Example 2\n"
