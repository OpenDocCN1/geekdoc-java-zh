- fmt: "\nIn other words, if you need to pass a `Runnable` to a `java.util.concurrent.Executor`\
    \ like so\n\n```java\nexecutor.execute(new Runnable() {\n    @Override\n    public\
    \ void run() {\n        System.out.println(\"Running...\");\n    }\n});\n```\n\
    \nyou can use a lambda expression to produce code with the same effect:\n\n```java\n\
    executor.execute(() -> System.out.println(\"Running...\"));\n```\n\nShort and\
    \ sweet. And clearer and more expressive too.\n\n# Changes to the Interface\n\n\
    Before I delve deeper into lambda expressions, I have to mention that starting\
    \ Java 8 you can have `default` and `static` methods in an interface. This section\
    \ explains what `default` and `static` methods are and why this major overhaul\
    \ of the Java language was needed to enable lambda expressions to blend into the\
    \ Java core libraries.\n\n## Default Methods\n\nExtending an interface is a safe\
    \ way of adding functionality to the interface. However, you end up with two interfaces\
    \ with similar functionality. This is acceptable if you only need to extend one\
    \ or two interfaces. If you need to add new features to hundreds of interfaces,\
    \ this has certainly become a serious issue.\n\nThis is exactly what the Java\
    \ language designers faced when they were trying to add lambda expressions to\
    \ Java 8 and add support for lambda in dozens of interfaces in the `Collection`\
    \ Framework. The interfaces needed new methods to support lambda expressions,\
    \ but extending all the interfaces would double the number of interfaces and some\
    \ would probably end up with ugly names such as `List2` or `ExtendedSet`.\n\n\
    Instead, they resolved this by adding the `default` method to the language. A\
    \ `default` method in an interface is a method with implementation. A class implementing\
    \ the interface does not have to implement the `default` method, which means you\
    \ can add new methods to an interface without breaking backward compatibility.\n\
    \nTo make a method in an interface a default method, add the keyword `default`\
    \ in front of the method signature. Additionally, instead of terminating the signature\
    \ with a semicolon, add a pair of brackets and write code in the brackets. Here\
    \ is an example.\n\n```java\ndefault java.lang.String getDescription() {\n   \
    \ return \"This is a default method\";\n}\n```\n\nAsAs you will learn later, a\
    \ lot of Java interfaces in `JDK 1.8` now have `default` methods.\n\nWhen extending\
    \ an interface with `default` methods, you have these options:\n\n* Ignore the\
    \ `default` methods, in effect inheriting them,\n* Re-declare the `default` methods,\
    \ which makes them abstract,\n* Override the `default` methods.\n\nRemember that\
    \ the main reason Java now support `default` methods is for backward compatibility.\
    \ By no means should you start writing programs without classes.\n\n## Static\
    \ Methods\n\nA `static` method in a class is shared by all instances of the class.\
    \ In Java 8 and later you can have `static` methods in an interface so that all\
    \ static methods associated with an interface can be written in the interface,\
    \ rather than in a helper class.\n\nThe signature of a `static` method is similar\
    \ to that of a `default` method. Instead of the keyword `default`, however, you\
    \ use the keyword `static`. `static` methods in an interface are `public` by default.\n\
    \nStatic methods in an interface are rare.\n\n## Functional Interfaces\n\nA functional\
    \ interface is an interface that contains exactly one abstract method. This is\
    \ the basis for lambda expressions. A functional interface can be annotated with\
    \ `@FunctionalInterface`.\n\nIn addition to `default` and `static` methods, there\
    \ is another prerequisite: the `SAM` (Single Abstract Method). A functional interface\
    \ is an interface that has exactly one abstract method. For example:\n\n```java\n\
    public interface Calculator {\n    int calculate(int a, int b);\n}\n```\n\nYou\
    \ can use a lambda expression to implement this interface:\n\n```java\nCalculator\
    \ addition = (a, b) -> a + b;\nSystem.out.println(addition.calculate(5, 10));\
    \ // prints 15\n\nCalculator subtraction = (a, b) -> a - b;\nSystem.out.println(subtraction.calculate(5,\
    \ 10)); // prints -5\n\nCalculator multiplication = (a, b) -> a * b;\nSystem.out.println(multiplication.calculate(5,\
    \ 10)); // prints 50\n\nCalculator division = (a, b) -> a / b;\nSystem.out.println(division.calculate(5,\
    \ 10)); // prints 0\n```\n\n# Lambda Expression\n\nThe lambda expression is such\
    \ an elegant design. How many more lines of code would you need to implement the\
    \ same program without lambda expressions? Now that you have acquainted yourself\
    \ with the lambda expression, I will show you its formal syntax:\n\n```java\n\
    (parameter list) -> expression\n```\n\nor\n\n```java\n(parameter list) -> {\n\
    \    statements\n}\n```\n\nThe parameter list is the same as the list of parameters\
    \ of the abstract method. However, the type for each parameter is optional. In\
    \ other words, both of these expressions are valid:\n\n```java\nCalculator addition\
    \ = (int a, int b) -> a + b;\nCalculator addition = (a, b) -> a + b;\n```\n\n\
    To summarize, a lambda expression is a shortcut to defining an implementation\
    \ of a functional interface. A lambda expression is equivalent to an instance\
    \ of a functional interface. Since it is possible to pass objects as parameters\
    \ to a method, it is too possible to pass lambda expressions as parameters to\
    \ a method.\n\n## Predefined Functional Interfaces\n\nThe `java.util.function`\
    \ package is a new package in `JDK 8`. It contains more than forty predefined\
    \ functional interfaces that can make it easier for you to write lambda expressions.\
    \ Some of the predefined functional interfaces are shown in the table below:\n\
    \n| Functional Interface | Description |\n| :--- | :--- |\n| `Function` | Models\
    \ a function that can take one parameter and return a result. |\n| `BiFunction`\
    \ | Models a function that can take two parameters and return a result. |\n| `UnaryOperator`\
    \ | Represents an operation on a single operand that returns a result of the same\
    \ type as the operand. |\n| `BiOperator` | Represents an operation on two operands.\
    \ |\n| `Predicate` | A `Function` that takes a parameter and returns true or false.\
    \ |\n| `Supplier` | Represents a supplier of results. |\n| `Consumer` | An operation\
    \ that takes a parameter and returns no result. |\n"
  raw: "In other words, if you need to pass a Runnable to a java.util.concurrent.Executor\
    \ like so\n\n```\n executor.execute(new Runnable() {\n    @Override\n    public\
    \ void run() {\n        System.out.println(\"Running...\");\n    }\n});\n```\n\
    \nyou can use a lambda expression to produce code with the same effect:\n\n```\n\
    \ executor.execute(() -> System.out.println(\"Running...\"));\n```\n\nShort and\
    \ sweet. And clearer and more expressive too.\n\nChanges to the Interface\n\n\
    Before I delve deeper into lambda expressions, I have to mention that starting\
    \ Java 8 you can have default and static methods in an interface. This section\
    \ explains what default and static methods are and why this major overhaul of\
    \ the Java language was needed to enable lambda expressions to blend into the\
    \ Java core libraries.\n\nDefault Methods\n\nExtending an interface is a safe\
    \ way of adding functionality to the interface. However, you end up with two interfaces\
    \ with similar functionality. This is acceptable if you only need to extend one\
    \ or two interfaces. If you need to add new features to hundreds of interfaces,\
    \ this has certainly become a serious issue.\n\nThis is exactly what the Java\
    \ language designers faced when they were trying to add lambda expressions to\
    \ Java 8 and add support for lambda in dozens of interfaces in the Collection\
    \ Framework. The interfaces needed new methods to support lambda expressions,\
    \ but extending all the interfaces would double the number of interfaces and some\
    \ would probably end up with ugly names such as List2 or ExtendedSet.\n\nInstead,\
    \ they resolved this by adding the default method to the language. A default method\
    \ in an interface is a method with implementation. A class implementing the interface\
    \ does not have to implement the default method, which means you can add new methods\
    \ to an interface without breaking backward compatibility.\n\nTo make a method\
    \ in an interface a default method, add the keyword default in front of the method\
    \ signature. Additionally, instead of terminating the signature with a semicolon,\
    \ add a pair of brackets and write code in the brackets. Here is an example.\n\
    \n```\n default java.lang.String getDescription() {\n    return \"This is a default\
    \ method\";\n}\n```\n\nAs you will learn later, a lot of Java interfaces in JDK\
    \ 1.8 now have default methods.\n\nWhen extending an interface with default methods,\
    \ you have these options.\n\n*   Ignore the default methods, in effect inheriting\
    \ them,\n\n*   Re-declare the default methods, which makes them abstract,\n\n\
    *   Override the default methods.\n\nRemember that the main reason Java now support\
    \ default methods is for backward compatibility. By no means should you start\
    \ writing programs without classes.\n\nStatic Methods\n\nA static method in a\
    \ class is shared by all instances of the class. In Java 8 and later you can have\
    \ static methods in an interface so that all static methods associated with an\
    \ interface can be written in the interface, rather than in a helper class.\n\n\
    The signature of a static method is similar to that of a default method. Instead\
    \ of the keyword default, however, you use the keyword static. Static methods\
    \ in an interface are public by default.\n\nStatic methods in an interface are\
    \ rare. Of the close to 30 interfaces in the java.util package, only two contain\
    \ static methods.\n\nFunctional Interfaces\n\nIn addition to the default and static\
    \ methods, there is another prerequisite for learning the lambda expression: the\
    \ functional interface. A functional interface is an interface that has exactly\
    \ one abstract method that does not override a java.lang.Object method. A functional\
    \ interface is also called a single abstract method (SAM) interface. For example,\
    \ java.lang.Runnable is a functional interface because it has only one abstract\
    \ method, run. A functional interface may have any number of default and static\
    \ methods and methods that override public methods in java.lang.Object and still\
    \ qualifies as a functional interface. For example, the Calculator interface in\
    \ Listing 1.1 is a functional interface with a single abstract method called calculate.\
    \ It is a functional interface even though it has two default methods and another\
    \ abstract method overriding the toString method from java.lang.Object.\n\nListing\
    \ 1.1: A functional interface\n\n```\n package app01;\npublic interface Calculator\
    \ {\n\n    double calculate(int a, int b);\n\n    public default int subtract(int\
    \ a, int b) {\n        return a - b;\n    }\n\n    public default int add(int\
    \ a, int b) {\n        return a * b;\n    }\n\n    @Override\n    public String\
    \ toString();\n}\n```\n\nExamples of functional interfaces in the core Java library\
    \ include java.lang.Runnable, java.lang.AutoCloseable, java.lang.Comparable and\
    \ java.util.Comparator. In addition, the new package java.util.function contains\
    \ dozens of functional interfaces and is discussed in the section “Predefined\
    \ Functional Interfaces” later in this chapter. Optionally, a functional interface\
    \ can be annotated with @FunctionalInterface.\n\nWhy is the functional interface\
    \ important? Because you can use a lambda expression to create the equivalent\
    \ of an anonymous inner class from a functional interface. You cannot use an interface\
    \ that is not a functional interface for this purpose.\n\nLambda Expression Syntax\n\
    \nThe Calculator interface in Listing 1.1 has a calculate method that can be the\
    \ basis of a lambda expression. The method allows you to define any mathematical\
    \ operation that takes two integers and returns a double. For instance, here are\
    \ two lambda expressions based on Calculator.\n\n```\n Calculator addition = (int\
    \ a, int b) -> (a + b);\nSystem.out.println(addition.calculate(5, 20)); // prints\
    \ 25.0\n\nCalculator division  = (int a, int b) -> (double) a / b;\nSystem.out.println(division.calculate(5,\
    \ 2)); // prints 2.5\n```\n\nThe lambda expression is such an elegant design.\
    \ How many more lines of code would you need to implement the same program without\
    \ lambda expressions?\n\nNow that you have acquainted yourself with the lambda\
    \ expression, I will show you its formal syntax.\n\n```\n (parameter list) ->\
    \ expression\n```\n\nor\n\n```\n (parameter list) -> { \n    statements\n}\n```\n\
    \nThe parameter list is the same as the list of parameters of the abstract method\
    \ in the underlying functional interface. However, the type for each parameter\
    \ is optional. In other words, both of these expressions are valid.\n\n```\n Calculator\
    \ addition = (int a, int b) -> (a + b);\nCalculator addition = (a, b) -> (a +\
    \ b);\n```\n\nTo summarize, a lambda expression is a shortcut to defining an implementation\
    \ of a functional interface. A lambda expression is equivalent to an instance\
    \ of a functional interface implementation. Since it is possible to pass objects\
    \ as parameters to a method, it is too possible to pass lambda expressions as\
    \ parameters to a method.\n\nPredefined Functional Interfaces\n\nThe java.util.function\
    \ package is a new package in JDK 8\\. It contains more than forty predefined\
    \ functional interfaces that can make it easier for you to write lambda expressions.\
    \ Some of the predefined functional interfaces are shown in Table 1.1.\n\n| Functional\
    \ Interface | Description |\n\n| Function | Models a function that can take one\
    \ parameter and return a result. The result can be of a different type than the\
    \ parameter. |\n\n| BiFunction | Models a function that can take two parameters\
    \ and return a result. The result can be of a different type than any of the parameters.\
    \ |\n\n| UnaryOperator | Represents an operation on a single operand that returns\
    \ a result whose type is the same as the type of the operand. A UnaryOperator\
    \ can be thought of as a Function whose return value is of the same type as the\
    \ parameter. In fact, UnaryOperator is a subinterface of Function. |\n\n| BiOperator\
    \ | Represents an operation on two operands. The result and the operands must\
    \ be of the same type. |\n\n| Predicate | A Function that takes a parameter and\
    \ returns true or false based on the value of the parameter. |\n\n| Supplier |\
    \ Represents a supplier of results. |\n\n| Consumer | An operation that takes\
    \ a parameter and returns no result. |"
