  ## 商标\nOracle 和 Java 是 Oracle 和/或其关联机构的注册商标\nUNIX 是 Open Group 的注册商标\n\nApache 是\
  \ The Apache Software Foundation 的商标。\n\nFirefox 是 Mozilla Foundation 的注册商标。\n\n\
  Google 是 Google, Inc. 的商标。\n\n在本书中，不带商标符号的商标名称打印仅用于编辑目的。我们无侵犯商标的意图。\n\n\n\n## 关于作者\n\
  \nBudi Kurniawan 以其清晰的写作风格闻名。作为 Brainy Software Corp. 的顾问，他编写过由财富 100 强公司授权的软件，并为世界各地的组织架构和开发了大型应用程序。他还在权威出版物上发表了\
  \ 100 多篇文章。他的其他书籍包括热门的《Tomcat 如何工作》和《Servlet and JSP：教程》。\n\n\n\n\n\n\n换句话说，如果你需要将一个\
  \ `Runnable` 传递给 `java.util.concurrent.Executor`，如下所示：\n\n```java\nexecutor.execute(new\
  \ Runnable() {\n    @Override\n    public void run() {\n        System.out.println(\"\
  Running...\");\n    }\n});\n```\n\n你可以使用 lambda 表达式来产生相同的效果：\n\n```java\nexecutor.execute(()\
  \ -> System.out.println(\"Running...\"));\n```\n\n简洁明了。而且更加清晰且具表现力。\n\n# 接口的更改\n\
  \n在我深入研究 lambda 表达式之前，我必须提到，从 Java 8 开始，你可以在接口中拥有 `default` 和 `static` 方法。这一节将解释什么是\
  \ `default` 方法和 `static` 方法，以及为什么 Java 语言需要这次重大重构，以便让 lambda 表达式能够融入 Java 核心类库中。\n\
  \n## 默认方法 (Default Methods)\n\n扩展接口是向接口添加功能的安全方式。然而，你最终会得到两个具有相似功能的接口。如果你只需要扩展一个或两个接口，这是可以接受的。但如果你需要向数百个接口添加新功能，这确实会变成严重的问题。\n\
  \n这正是 Java 语言设计者在尝试为 Java 8 引入 lambda 表达式，并为 `Collection` 框架中的几十个接口添加 lambda 支持时所面临的问题。这些接口需要新方法来支持\
  \ lambda 表达式，但扩展所有接口将使接口数量翻倍，某些接口最终可能会带有如 `List2` 或 `ExtendedSet` 这样难看的名字。\n\n相反，他们通过向语言中添加\
  \ `default` 方法解决了这个问题。接口中的 `default` 方法是带有实现的方法。实现该接口的类没有必须实现 `default` 方法，这意味着你可以在不破坏后兼容性的情况下向接口添加新方法。\n\
  \n要使接口中的方法成为默认方法，请在方法签名前添加 `default` 关键字。此外，不要用分号结束签名，而是添加一对括号并在括号内编写代码。这里是一个示例：\n\
  \n```java\ndefault java.lang.String getDescription() {\n    return \"This is a default\
  \ method\";\n}\n```\n\n正如你之后将学到的，`JDK 1.8` 中的许多 Java 接口现在都有 `default` 方法。\n\n在扩展带有\
  \ `default` 方法的接口时，你有这些选项：\n\n* 忽略 `default` 方法，实际上是继承它们，\n* 重新声明 `default` 方法，使其变为抽象方法，\n\
  * 重写 `default` 方法。\n\n记住，Java 现在支持 `default` 方法的主要由于是为了后兼容性。你绝不开始编写没有类的程序。\n\n##\
  \ 静态方法 (Static Methods)\n\n类中的 `static` 方法由类的所有实例共享。在 Java 8 及更高版本中，你可以在接口中拥有 `static`\
  \ 方法，这样所有与接口相关的静态方法都可以写在接口中，而不是辅助类中。\n\n`static` 方法的签名与 `default` 方法相似。然而，你使用的不是\
  \ `default` 关键字而是 `static` 关键字。接口中的 `static` 方法默认是 `public` 的。\n\n接口中的静态方法非常罕见。\n\
  \n## 函数式接口 (Functional Interfaces)\n\n函数式接口是一个包含恰好一个抽象方法的接口。这是 lambda 表达式的基础。函数式接口可以使用\
  \ `@FunctionalInterface` 进行注解。\n\n除了 `default` 和 `static` 方法外，还有另一个前提：`SAM`（单抽象方法）。函数式接口是一个恰好有一个抽象方法的接口。例如：\n\
  \n```java\npublic interface Calculator {\n    int calculate(int a, int b);\n}\n\
  ```\n\n你可以使用 lambda 表达式来实现此接口：\n\n```java\nCalculator addition = (a, b) -> a + b;\n\
  System.out.println(addition.calculate(5, 10)); // 输出 15\n\nCalculator subtraction\
  \ = (a, b) -> a - b;\nSystem.out.println(subtraction.calculate(5, 10)); // 输出 -5\n\
  \nCalculator multiplication = (a, b) -> a * b;\nSystem.out.println(multiplication.calculate(5,\
  \ 10)); // 输出 50\n\nCalculator division = (a, b) -> a / b;\nSystem.out.println(division.calculate(5,\
  \ 10)); // 输出 0\n```\n\n# Lambda 表达式\n\nlambda 表达式的设计非常优雅。如果没有 lambda 表达式，实现相同的程序需要多少行代码？现在你已经熟悉了\
  \ lambda 表达式，我向你展示它的形式语法：\n\n```java\n(parameter list) -> expression\n```\n\n或者\n\
  \n```java\n(parameter list) -> {\n    statements\n}\n```\n\n参数列表与抽象方法的参数列表相同。然而，每个参数的类型是可选的。换句话说，这两个表达式都是有效的：\n\
  \n```java\nCalculator addition = (int a, int b) -> a + b;\nCalculator addition =\
  \ (a, b) -> a + b;\n```\n\n总结来说，lambda 表达式是定义函数式实现的快捷方式。lambda 表达式等同于函数式接口的实例。既然可以将对象作为参数传递给方法，也可以将\
  \ lambda 表达式传递给方法。\n\n## 预定义的函数式接口\n\n`java.util.function` 包是 `JDK 8` 中的一个新包。它包含了四十多个预定义的函数式接口，可以让你编写\
  \ lambda 表达式变得更容易。下表显示了一些预定义的函数式接口：\n\n| 函数式接口 | 描述 |\n| :--- | :--- |\n| `Function`\
  \ | 接受一个参数并返回结果的函数。 |\n| `BiFunction` | 接受两个参数并返回结果的函数。 |\n| `UnaryOperator` | 对单个操作数的操作，返回与操作数类型相同的结果。\
  \ |\n| `BiOperator` | 对两个操作数的操作。 |\n| `Predicate` | 一个接受参数并返回真或假的 `Function`。 |\n\
  | `Supplier` | 代表结果的提供者。 |\n| `Consumer` | 接受一个参数且不返回结果的操作。 |\n\n\n\n\n\n## 表 1.1:\
  \ 核心函数接口\n\n## Function, BiFunction 及其他变体\n\n`Function` 接口用于创建一个接受一个参数并返回结果的函数。它是一个泛型类型，其定义如下：\n\
  \n```\n public interface Function<T, R>\n```\n\n在这里，`T` 代表参数的类型，`R` 代表结果的类型。\n\n\
  `Function` 有一个抽象方法 `apply`，其签名如下：\n\n```\n R apply(T argument)\n```\n\n当你在使用 `Function`\
  \ 时，需要重写这个方法。例如，代码列表 1.2 中的类定义了一个将英里转换为公里的 `Function`。该 `Function` 接受一个 `Integer`\
  \ 作为参数，并返回一个 `Double`。\n\n### 代码列表 1.2：`FunctionDemo1` 类\n\n```\n package app01.function;\n\
  import java.util.function.Function;\n\npublic class FunctionDemo1 {\n    public\
  \ static void main(String[] args) {\n        Function<Integer, Double> milesToKms\
  \ = \n                (input) -> 1.6 * input;\n        int miles = 3;\n        double\
  \ kms = milesToKms.apply(miles);\n        System.out.printf(\"%d miles = %3.2f kilometers\\\
  n\", \n                miles, kms);\n    }\n}\n```\n\n如果你运行 `FunctionDemo1` 类，你将在控制台上看到以下内容：\n\
  \n```\n 3 miles = 4.80 kilometers\n```\n\n`Function` 的变体 `BiFunction` 接受两个参数并返回一个结果。代码列表\
  \ 1.3 展示了 `BiFunction` 的示例。它使用 `BiFunction` 创建了一个根据宽度和长度计算面积的函数。通过调用其 `apply` 方法来执行该函数。\n\
  \n### 代码列表 1.3：`BiFunctionDemo1` 类\n\n```\n package app01.function;\nimport java.util.function.BiFunction;\n\
  \npublic class BiFunctionDemo1 {\n    public static void main(String[] args) {\n\
  \        BiFunction<Float, Float, Float> area =\n                (width, length)\
  \ -> width * length;\n        float width = 7.0F;\n        float length = 10.0F;\n\
  \        float result = area.apply(width, length);\n        System.out.println(result);\n\
  \    }\n}\n```\n\n运行 `BiFunctionDemo1` 类会在控制台上打印此内容：\n\n```\n 70.0\n```\n\n除了 `BiFunction`\
  \ 之外，还有是 `Function` 的特化变体。例如，`IntFunction` 接口始终接受一个 `Integer`，并且对于结果类型只需要一个泛型类型。它的\
  \ `apply` 方法返回一个 `int`。\n\n```\n R apply(int input)\n```\n\n`LongFunction` 和 `DoubleFunction`\
  \ 接口与 `IntFunction` 类似，但它们分别接受 `long` 和 `double` 作为参数。\n\n此外，还有一些变体完全不需要泛型参数，因为它们是为特定的参数类型和特定的返回类型设计的。例如，`IntToDoubleFunction`\
  \ 接口可以创建一个接受 `int` 并返回 `double` 的函数。该接口提供的不是 `apply` 方法，而是 `applyAsDouble` 方法。代码列表\
  \ 1.4 给出了 `IntToDoubleFunction` 接口的示例。它是一个将摄氏度转换为华氏度的转换函数。\n\n### 代码列表 1.4：`IntToDoubleFunctionDemo1`\
  \ 类\n\n```\n package app01.function;\nimport java.util.function.IntToDoubleFunction;\n\
  \npublic class IntToDoubleFunctionDemo1 {\n    public static void main(String[]\
  \ args) {\n        IntToDoubleFunction celciusToFahrenheit = \n                (input)\
  \ -> 1.8 * input + 32;\n        int celcius = 100;\n        double fahrenheit =\
  \ \n                celciusToFahrenheit.applyAsDouble(celcius);\n        System.out.println(celcius\
  \ + \"\\u2103\" + \" = \" \n                + fahrenheit + \"\\u2109\\n\");\n  \
  \  }\n}\n```\n\n这是 `IntToDoubleFunctionDemo1` 的输出：\n\n```\n 100° = 212.0°\n```\n\
  \n与 `IntToDoubleFunction` 类似的还有 `LongToDoubleFunction` 和 `LongToIntFunction`。我相信你能从它们的名字看出它们的作用。\n\
  \n`UnaryOperator` 接口是 `Function` 的另一个特化版本，其操作数类型与返回类型相同。其声明如下：\n\n```\n public interfaceUnaryOperator<T>\
  \ extends Function<T,T>\n```\n\n`BinaryOperator` 是 `BiFunction` 的特化版本。`BinaryOperator`\
  \ 表示一个有两个相同类型操作数的操作，并返回一个与操作数类型相同的结果。\n\n## Predicate\n\n`Predicate` 是接受参数并根据参数值返回\
  \ true 或 false 的函数。它有一个名为 `test` 的抽象方法。\n\n例如，代码列表 1.5 中的 `PredicateDemo1` 类定义了一个\
  \ `Predicate`，用于评估字符串输入，如果字符串中的每个字符都是数字，则返回 true。\n\n### 代码列表 1.5：`PredicateDemo1`\
  \ 类\n\n```\n package app01.function;\nimport java.util.function.Predicate;\n\npublic\
  \ class PredicateDemo1 {\n    public static void main(String[] args) {\n       \
  \ Predicate<String> numbersOnly = (input) -> {\n            for (int i = 0; i <\
  \ input.length(); i++) {\n                char c = input.charAt(i);\n          \
  \      if (\"0123456789\".indexOf(c) == -1) {\n                    return false;\n\
  \                }\n            }\n            return true;\n        };\n\n    \
  \    System.out.println(numbersOnly.test(\"12345\")); // true\n        System.out.println(numbersOnly.test(\"\
  100a\")); // false\n    }\n}\n```\n\n## Supplier\n\n`Supplier` 不接受参数并返回一个值。实现类必须重写其抽象方法\
  \ `get`。\n\n代码列表 1.6 展示了 `Supplier` 的示例。它定义了一个返回随机数字的 `Supplier`，并使用循环打印五个数。\n\n\
  ### 代码列表 1.6：`SupplierDemo1` 类\n\n```\n package app01.function;\nimport java.util.Random;\n\
  import java.util.function.Supplier;\n\npublic class SupplierDemo1 {\n    public\
  \ static void main(String[] args) {\n        Supplier<Integer> oneDigitRandom =\
  \ () -> {\n            Random random = new Random();\n            return random.nextInt(10);\n\
  \        };\n        for (int i = 0; i < 5; i++) {\n            System.out.println(oneDigitRandom.get());\n\
  \        }\n    }\n}\n```\n\n`Supplier` 还有特化变体，如 `DoubleSupplier`（返回 Double）、`IntSupplier`\
  \ 和 `LongSupplier`。\n\n## Consumer\n\n`Consumer` 是一个不返回结果的操作。它有一个名为 `accept` 的抽象方法。\n\
  \n代码列表 1.7 展示了一个 `Consumer` 的示例，它接受一个字符串并将其居中打印。\n\n### 代码列表 1.7：Consumer 示例\n\n\
  ```\n package app01.function;\nimport java.util.function.Consumer;\nimport java.util.function.Function;\n\
  \npublic class ConsumerDemo1 {\n    public static void main(String[] args) {\n \
  \       Function<Integer, String> spacer = (count) -> {\n            StringBuilder\
  \ sb = new StringBuilder(count);\n            for (int i = 0; i < count; i++) {\n\
  \                sb.append(\" \");\n            }\n            return sb.toString();\n\
  \        };\n\n        int lineLength = 60; // characters\n        Consumer<String>\
  \ printCentered = \n                (input) -> {\n                    int length\
  \ = input.length();\n                    String spaces = spacer.apply(\n       \
  \                     (lineLength - length) / 2);\n                    System.out.println(spaces\
  \ + input);\n                };\n\n        printCentered.accept(\"A lambda expression\
  \ a day\");\n        printCentered.accept(\"makes you\");\n        printCentered.accept(\"\
  look smarter\");\n    }\n}\n```\n\n代码列表 1.7 中的示例包含一个 `Consumer`，它接受一个字符串并在前面添加特定数量的空格后打印。`Consumer`\
  \ 的 `accept` 方法实现由这个 Lambda 表达式提供：\n\n```\n (input) -> {\n                    int\
  \ length = input.length();\n                    String spaces = spacer.apply(\n\
  \                            (lineLength - length) / 2);\n                    System.out.println(spaces\
  \ + input);\n                }\n```\n\n\n\n\n\n```\n Function<Integer, String> spacer\
  \ = (count) -> {\n            StringBuilder sb = new StringBuilder(count);\n   \
  \         for (int i = 0; i < count; i++) {\n                sb.append(\" \");\n\
  \            }\n            return sb.toString();\n        };\n```\n\n该函数使用一个 `for`\
  \ 循环，向 `StringBuilder` 中添加 `count` 次空格，其中 `count` 是函数的参数。当循环退出时，它返回 `StringBuilder`\
  \ 的 `String` 表示形式。\n\n如果你运行 `ConsumerDemo1` 类，你将在控制台上看到以下内容：\n\n```\n A lambda expression\
  \ a day\n                         makes you\n                        look smarter\n\
  ```\n\n### 总结\n\nLambda 表达式是 Java 8 的新特性，它可以使某些结构变得更短且易于读，特别是当你处理内部类时。本章讨论了 lambda\
  \ 表达式、函数式接口、预定义的函数接口以及方法引用。\n\n# 第 2 章\n\n## 方法引用\n\n在第 1 章中，你学习了 lambda 表达式。本章将讨论方法引用，这是\
  \ lambda 表达式的一个子功能，可以使编写 lambda 表达式变得更加简单。\n\n## 概述\n\n许多 Java 方法接受函数式接口作为参数。例如，`java.util.Arrays`\
  \ 中的 `sort` 方法之一接受 `Comparator` 实例，而 `Comparator` 就是一个函数式接口。`sort` 方法的签名如下：\n\n\
  ```\n public static T[] sort(T[] array, Comparator<? super T> comparator)\n```\n\
  \n与其向 `sort` 方法传递 `Comparator` 的实现，不如传递一个 lambda 表达式。你在上一节已经看到过如何这样做。\n\n现在，你可以更进一步，通过传递方法引用来代替\
  \ lambda 表达式。方法引用简单就是类名或对象引用后跟着双冒号运算符（`::`）和方法名。\n\n你为什么想要使用方法引用？有两个原因：\n\n1. 方法引用的语法比\
  \ lambda 表达式更短，因为方法引用不包含像 lambda 表达式那样的定义。方法体定义在其他地方。\n2. 你可以使用现有的方法，从而促进代码复用。\n\
  \n你可以使用静态方法、实例方法甚至构造函数的引用。你使用双冒号（`::`，这是 Java 8 中的一个新运算符）来分隔类名/对象引用与方法/构造函数名。封装所引用方法的类不需要实现该函数式接口。\n\
  \n方法引用的语法是以下之一：\n\n```\n ClassName::staticMethodName\nContainingType::instanceMethod\n\
  objectReference::methodName\nClassName::new\n```\n\n接下来的章节将分别讨论每种类型的方法引用。\n\n###\
  \ 静态方法的引用\n\n如果静态方法与函数式接口的抽象方法具有兼容的返回类型和参数参数类型，那么静态方法的引用可以作为参数传递给期望函数式接口的方法。\n\n\
  作为此主题的第一个示例，考虑列表 2.1 中的 `NoMethodRef` 类，它说明了在没有方法引用的情况下使用函数式接口。该类定义了一个名为 `StringListFormatter`\
  \ 的函数式接口，它接收一个 `String` 列表并对字符串进行格式化。`format` 方法是接口的抽象方法，接受一个分隔符和一个 `String` 列表。还有一个\
  \ `formatAndPrint` 静态方法，它接收 `StringListFormatter` 实例、一个分隔符和一个 `String` 列表。该方法反过来调用\
  \ `StringListFormatter` 的 `format` 方法并打印格式化后的列表。\n\n列表 2.1：NoMethodRef 类\n\n```\n\
  \ package app02.methodref;\nimport java.util.Arrays;\nimport java.util.List;\n\n\
  public class NoMethodRef {\n\n    @FunctionalInterface\n    interface StringListFormatter\
  \ {\n        String format(String delimiter, List<String> list);\n    }\n\n    public\
  \ static void formatAndPrint(StringListFormatter formatter, \n            String\
  \ delimiter, List<String> list) {\n        String formatted = formatter.format(delimiter,\
  \ list);\n        System.out.println(formatted);\n    }\n\n    public static void\
  \ main(String[] args) {\n        List<String> names = Arrays.asList(\"Don\", \"\
  King\", \"Kong\");\n\n        StringListFormatter formatter =\n                (delimiter,\
  \ list) -> {\n                    StringBuilder sb = new StringBuilder(100);\n \
  \                   int size = list.size();\n                    for (int i = 0;\
  \ i < size; i++) {\n                        sb.append(list.get(i));\n          \
  \              if (i < size - 1) {\n                            sb.append(delimiter);\n\
  \                        }\n                    }\n                    return sb.toString();\n\
  \                };\n        formatAndPrint(formatter, \", \", names);\n    }\n\
  }\n```\n\n`NoMethodRef` 中的 `main` 方法构建了一个包含三个元素的字符串列表，并使用此 lambda 表达式创建了 `StringListFormatter`\
  \ 的实现。\n\n```\n StringListFormatter formatter =\n                (delimiter, list)\
  \ -> {\n                    StringBuilder sb = new StringBuilder(100);\n       \
  \             int size = list.size();\n                    for (int i = 0; i < size;\
  \ i++) {\n                        sb.append(list.get(i));\n                    \
  \    if (i < size - 1) {\n                            sb.append(delimiter);\n  \
  \                      }\n                    }\n                    return sb.toString();\n\
  \                };\n```\n\n基本上，它遍历 `List` 并在两个元素之间添加分隔符。最后一个元素后不会添加分隔符。\n\n然后 `main`\
  \ 方法调用 `formatAndPrint` 方法，传递 lambda 表达式、分隔符和字符串列表。如果你运行 `NoMethodRef`，你将看到格式化后的列表：\n\
  \n```\n Don, King, Kong\n```\n\n在花费二分钟编写代码后，你发现该 lambda 表达式与 `String` 类的 `join`\
  \ 方法的功能相同。这是 Java 8 添加到 `String` 类中的静态方法。其一个签名如下：\n\n```\n public static String\
  \ join(CharSequence delimiter,\n        Iterable extends CharSequence> elements)\n\
  ```\n\n将其与列表 2.1 中函数式接口的 `format` 方法进行对比：\n\n```\n public String format(java.lang\
  \ delimiter, \n        java.util.List<String> list);\n```\n\n由于 `List` 实现了 `Iterable`\
  \ 且 `String` 实现了 `CharSequence`，`join` 与 `format` 。\n\n方法引用允许你复用现有实现，例如 `String.join()`。因此，你可以重写\
  \ `NoMethodRef` 类以使用 `String.join()` 的引用。这在列表 2.2 的 `MethodReferenceDemo1` 类所示。\n\
  \n列表 2.2：MethodReferenceDemo1 类\n\n```\n package app02.methodref;\nimport java.util.Arrays;\n\
  import java.util.List;\n\npublic class MethodReferenceDemo1 {\n\n    @FunctionalInterface\n\
  \    interface StringListFormatter {\n        String format(String delimiter, List<String>\
  \ list);\n    }\n\n    public static void formatAndPrint(StringListFormatter formatter,\
  \ \n            String delimiter, List<String> list) {\n        String formatted\
  \ = formatter.format(delimiter, list);\n        System.out.println(formatted);\n\
  \    }\n\n    public static void main(String[] args) {\n        List<String> names\
  \ = Arrays.asList(\"Don\", \"King\", \"Kong\");\n        formatAndPrint(String::join,\
  \ \", \", names);\n    }\n}\n```\n\n你仍然拥有相同的 `StringListFormatter` 接口和相同的 `formatAndPrint`\
  \ 方法。然而，`main` 方法不再包含实现 `StringListFormatter` 的 lambda 表达式。相反，你使用 `String::join`\
  \ 作为 `StringListFormatter` 的实现。\n\n```\n formatAndPrint(String::join, \", \", names);\n\
  ```\n\n\n\n\n\n顺便提一下，注意 `StringListFormatter` 中的抽象方法接受两个参数并返回一个值。这是 `BiFunction`\
  \ 的理想候选者。列表 2.3 中的 `WithBiFunction` 类是 `MethodReferenceDemo1` 类的重写，它完全消除了 `StringListFormatter`\
  \ 接口。`formatAndPrint` 方法也经过修改以接受一个 `BiFunction` 作为其第一个参数。\n\n### 列表 2.3：`WithBiFunction`\
  \ 类\n\n```java\n package app02.methodref;\nimport java.util.Arrays;\nimport java.util.List;\n\
  import java.util.function.BiFunction;\n\npublic class WithBiFunction {\n\n    public\
  \ static void formatAndPrint(\n            BiFunction<String, List<String>, String>\
  \ formatter, \n            String delimiter, List<String> list) {\n        String\
  \ formatted = formatter.apply(delimiter, list);\n        System.out.println(formatted);\n\
  \    }\n\n    public static void main(String[] args) {\n        List<String> names\
  \ = Arrays.asList(\"Don\", \"King\", \"Kong\");\n        formatAndPrint(String::join,\
  \ \", \", names);\n    }\n}\n```\n\n### 引用对象引用可用的实例方法\n\n此类方法引用的兼容性规则与静态方法引用的规则相同。被引方法必须与被替换的函数式接口的抽象方法具有兼容的返回值和参数。\n\
  \n例如，在 JDK 1.8 中，`java.lang.Iterable` 接口有一个名为 `forEach` 的默认方法，它接受一个 `Consumer`：\n\
  \n```java\n default void forEach(java.util.function.Consumer<? super T> action)\n\
  ```\n\n`forEach` 为 `Iterable` 的每个元素执行给的操作。得益于继承，该方法被其子接口 `List` 继承，我将在列表 2.4 的示例中使用它。\n\
  \n### 列表 2.4：在对象中引用实例方法\n\n```java\n package app02.methodref;\nimport java.util.Arrays;\n\
  import java.util.List;\n\npublic class MethodReferenceDemo2 {\n    public static\
  \ void main(String[] args) {\n        List<String> fruits = Arrays.asList(\"Apple\"\
  , \"Banana\");\n        // 使用 lambda 表达式\n        fruits.forEach((name) -> System.out.println(name));\n\
  \n        // 使用方法引用\n        fruits.forEach(System::out::println);\n    }\n}\n```\n\
  \n`MethodReferenceDemo2` 类有一个需要打印的水果列表。你可以通过调用 `forEach` 方法来实现这一点，并如下所示以 lambda\
  \ 表达式的形式传递 `Consumer`：\n\n```java\n fruits.forEach((name) -> System.out.println(name));\n\
  ```\n\n或者，由于 `System.out` 是系统已经为你创建的现有对象，你可以使用方法引用指向 `System.out` 上的 `println` 方法。\n\
  \n```java\n fruits.forEach(System.out::println);\n```\n\n### 引用对象引用不可用的实例方法\n\n\
  坐稳了。这一个有点复杂，需要你全神贯。\n\n你可以将实例方法的引用作为方法参数传递，以替换函数式接口。在这种情况下，你不需要显式地创建所属类的实例。此类方法引用的语法与第一、二类方法引用不同。对于前二类方法引用，参数的数量必须与函数式接口抽象方法预期的参数数量相同。当使用没有对象引用的实例方法时，被引方法的参数数量必须比函数式接口抽象方法预期的参数数量少一个。因此，如果函数式接口的抽象方法接受四个参数，则被引实例方法只需要三个参数，且这些参数必须与抽象方法的第二、第三和第四参数兼容。此外，抽象方法的第一个参数必须是与包含该实例方法的类兼容的类型。\n\
  \n此类方法引用的兼容性规则如下所示。第一行是函数式接口抽象方法的伪签名，第二行是被引实例方法的伪签名。\n\n```\n returnType abstractMethod(type-1,\
  \ type-2, type-3, type-4)\nreturnType instanceMethod(type-2, type-3, type-4)\n```\n\
  \n在这里，`type-1` 必须与包含该实例方法的类兼容，因为该类将被实例化，并且该实例将与其他参数一起作为第一个参数传递给抽象方法。\n\n在看了这种方法引用的示例后，这一点将会变得清晰。\n\
  \n### 列表 2.5：`MethodReferenceDemo3` 类\n\n```java\n package app02.methodref;\nimport\
  \ java.util.Arrays;\n\npublic class MethodReferenceDemo3 {\n\n    public static\
  \ void main(String[] args) {\n        String[] names = {\"Alexis\", \"anna\", \"\
  Kyleen\"};\n\n        Arrays.sort(names, String::compareToIgnoreCase);\n       \
  \ for (String name : names) {\n            System.out.println(name);\n        }\n\
  \    }\n}\n```\n\n列表 2.5 中的示例展示了如何向 `Arrays.sort` 传递实例方法引用以代替 `Comparator`。`MethodReferenceDemo3`\
  \ 类包含一个字符串数组，其中没有严格遵守大小写敏感。如果你使用只接受一个参数的 `Arrays.sort` 重载版本来对此数组排序，名称将排序为：\n\n```\n\
  \ Alexis, Kyleen, anna\n```\n\n这不是你想要的。因此，你需要使用同样接受 `Comparator` 的 `Arrays.sort`：\n\
  \n```\n public static <T> void sort(T[] array, Comparator<? super T> c)\n```\n\n\
  示例展示了如何使用实例方法引用 `String.compareIgnoreCase` 来替换 `Comparator`（记得 `Comparator` 是一个函数式接口）。这里是\
  \ `String.compareToIgnoreCase` 的签名。\n\n```java\n public int compareToIgnoreCase(String\
  \ str)\n```\n\n它比 `Comparator.compare` 的签名少一个参数。\n\n```\n int compare(String str1,\
  \ String str2)\n```\n\n这对于第二类方法引用非常完美。\n\n如果你运行代码，你会发现名称被正确排序了。这里是结果。\n\n```\n Alexis\n\
  anna\nKyleen\n```\n\n### 引用构造函数\n\n第四类方法引用使用构造函数。构造函数引用的语法如下：\n\n```\n ClassName::new\n\
  ```\n\n假设你需要一个方法将 `Integer` 数组转换为 `Collection`，并且你需要确定结果集合是 `List` 还是 `Set`。为此，你可以在列表\
  \ 2.6 中创建 `arrayToCollection` 方法。\n\n### 列表 2.6：`MethodReferenceDemo4` 类\n\n```java\n\
  \ package app02.methodref;\nimport java.util.ArrayList;\nimport java.util.Collection;\n\
  import java.util.HashSet;\nimport java.util.function.Supplier;\n\npublic class MethodReferenceDemo4\
  \ {\n\n    public static Collection<Integer> arrayToCollection(\n            Supplier<Collection<Integer>>\
  \ supplier, Integer[] \n                numbers) {\n        Collection<Integer>\
  \ collection = supplier.get();\n        for (int i : numbers) {\n            collection.add(i);\n\
  \        }\n        return collection;\n    }\n\n    public static void main(String[]\
  \ args) {\n        Integer[] array = {1, 8, 5};\n        Collection<Integer> col1\
  \ \n                = arrayToCollection(ArrayList<Integer>::new, array);\n     \
  \   System.out.println(\"Natural order\");\n        col1.forEach(System.out::println);\n\
  \        System.out.println(\"=======================\");\n        System.out.println(\"\
  Ascending order\");\n        Collection<Integer> col2 \n                = arrayToCollection(HashSet<Integer>::new,\
  \ array);\n        col2.forEach(System.out::println);\n    }\n}\n```\n\n与其将此 lambda\
  \ 表达式作为方法的第一个参数传递。\n\n```java\n () -> new ArrayList<Integer>()\n```\n\n你只需要传递此 `ArrayList`\
  \ 构造函数的引用。\n\n```\n ArrayList<Integer>::new\n```\n\n以及，而不是这个\n\n```\n () -> new\
  \ HashSet<Integer>()\n```\n\n你可以写成\n\n```\n HashSet<Integer>::new\n```\n\n如果你运行该示例，你将在控制台上看到以下内容。\n\
  \n```\n Natural order\n1\n8\n5\n=======================\nAscending order\n1\n5\n\
  8\n```\n\n\n\n\n关于构造函数引用的更多示例，可以在第 4 章“Stream API”中找到。\n\n### 总结\n\nJava 8 的一项新功能\
  \ `lambda expressions` 可以让某些结构变得更短更具可读性，特别是当你在处理内部类时。本章讨论了方法引用，这是一种可以使编写 lambda\
  \ 表达式的子功能。\n\n# 第 3 章：Optional 及相似类\n\nJava 程序员多年来一直在处理 `null pointer exceptions`（空指针异常）。在\
  \ Java 8 中，处理它们有一种新方法：通过将可能为空的对象封装在一个名为 `Optional` 的类中。本章涵盖了 `Optional` 以及相似类。\n\
  \n## 概述\n\nJava 8 增加了 `Optional`、`OptionalInt`、`OptionalLong` 和 `OptionalDouble`\
  \ 类来处理 `NullPointerExceptions`。这些类作为 `java.util` 包的一部分，是大量使用 lambda 表达式和方法引用的优秀范例。\n\
  \n这四个类非常相似，而 `Optional` 是其中最重要的，因为它可以用于任何类型，而其他类分别仅适用于整数、`longs` 或 `doubles`。因此，`Optional`\
  \ 是本章的重点。\n\n`Optional` 是一个用于可能为空的值的容器。正如你现在所知的，尝试在空引用变量上调用方法或字段会抛出 `NullPointerException`。处理空并不困难，但可能会很繁琐。考虑列表\
  \ 3.1 中的代码，它展示了一个 `Company` 类，它可以拥有一个 `Office`，而 `Office` 又可以拥有 `Address`。为了简单起见，这里的\
  \ `Address` 只包含两个字段：`street` 和 `city`。所有这些属性都可以为空。一个 `Company` 可能没有 `Office`，而一个\
  \ `Address` 可能没有关于 `street` 和 `city` 的完整数据。\n\n### 列表 3.1：检查空值的繁琐方法\n\n```\npackage\
  \ app03.optional1;\n\nclass Company {\n    private String name;\n    private Office\
  \ office;\n    public Company(String name, Office office) {\n        this.name =\
  \ name;\n        this.office = office;\n    }\n\n    public String getName() {\n\
  \        return name;\n    }\n\n    public Office getOffice() {\n        return\
  \ office;\n    }\n}\n\nclass Office {\n    private String id;\n    private Address\
  \ address;\n\n    public Office(String id, Address address) {\n        this.id =\
  \ id;\n        this.address = address;\n    }\n\n    public String getId() {\n \
  \       return id;\n    }\n\n    public Address getAddress() {\n        return address;\n\
  \    }\n}\n\nclass Address {\n    private String street;\n    private String city;\n\
  \n    public Address(String street, String city) {\n        this.street = street;\n\
  \        this.city = city;\n    }\n\n    public String getStreet() {\n        return\
  \ street;\n    }\n\n    public String getCity() {\n        return city;\n    }\n\
  }\n\npublic class OptionalDemo1 {\n\n    public static void main(String[] args)\
  \ {\n        Address address1 = new Address(null, \"New York\");\n        Office\
  \ office1 = new Office(\"OF1\", address1);\n        Company company1 = new Company(\"\
  Door Never Closed\",\n            office1);\n\n        // company1 的街道地址是什么？\n \
  \       // company1 位于哪个城市？\n        String streetAddress = null;\n        String\
  \ city = null;\n        if (company1 != null) {\n            Office office = company1.getOffice();\n\
  \            if (office != null) {\n                Address address = office.getAddress();\n\
  \                if (address != null) {\n                    streetAddress = address.getStreet();\n\
  \                    city = address.getCity();\n                }\n            }\
  \ \n        }\n        System.out.println(\"Street Name:\" + streetAddress);\n \
  \       System.out.println(\"City:\" + city);\n    }\n}\n```\n\n列表 3.1 中的 `OptionalDemo1`\
  \ 类创建了一个用于测试的 `Company`，并尝试获取该公司的街道地址。意识到任何字段都可能为空，程序员有意识地尝试在对实例调用方法之前对每个单独实例进行空值测试，导致了如下代码：\n\
  \n```\n        if (company1 != null) {\n            Office office = company1.getOffice();\n\
  \n            if (office != null) {\n                Address address = office.getAddress();\n\
  \                if (address != null) {\n                    streetAddress = address.getStreet();\n\
  \                    city = address.getCity();\n                }\n            }\
  \ \n        }\n```\n\n这有点很繁琐，且可读性受损。\n\n`Optional` 类可以提供帮助。如果你决定使用它，你可以将每个可能为空的字段封装在\
  \ `Optional` 中。例如，`Company` 中的 `office` 字段现在应该是：\n\n```java\n private Optional<Office>\
  \ office;\n```\n\n而 `Address` 中的 `city` 字段应该是\n\n```java\n private Optional<String>\
  \ city;\n```\n\n在学习如何使用 `Optional` 重写列表 3.1 中的示例之前，请先看表 3.1 中 `Optional` 的方法。\n\n\
  | 方法 | 描述 |\n| :--- | :--- |\n| `empty` | 返回一个空的 `Optional` |\n| `filter` | 如果值存在并匹配给定的谓词，则返回一个描述该值的\
  \ `Optional`。否则，返回一个空的 `Optional`。 |\n| `flatMap` | 如果值存在，对该值应用指定的映射函数，并返回一个描述映射结果的\
  \ `Optional`。如果值不存在，返回一个空的 `Optional`。 |\n| `get` | 如果值存在，则返回值。否则，抛出 `NoSuchElementException`。\
  \ |\n| `ifPresent` | 如果值存在，则调用给定的 `Consumer`。 |\n| `isPresent` | 如果值存在，则返回 true。否则，返回\
  \ false。 |\n| `map` | 如果值存在，则对它应用给定的映射函数。如果结果不为空，返回一个描述结果的 `Optional`。 |\n| `of`\
  \ | 返回描述给定非空值的 `Optional`。 |\n| `ofNullable` | 如果给定值不为空，则返回描述该值的 `Optional`。如果值为空，返回一个空的\
  \ `Optional`。 |\n| `orElse` | 如果值存在，则返回值。否则，返回指定的值。 |\n\n表 3.1：Optional 的重要方法\n\n\
  \n\n\n\n```java\n package app03.optional2;\nimport java.util.Optional;\n\nclass\
  \ Company {\n    private String name;\n    private Optional<Office> office;\n\n\
  \    public Company(String name, Optional<Office> office) {\n        this.name =\
  \ name;\n        this.office = office;\n    }\n\n    public String getName() {\n\
  \        return name;\n    }\n\n    public Optional<Office> getOffice() {\n    \
  \    return office;\n    }\n}\n\nclass Office {\n    private String id;\n    private\
  \ Optional<Address> address;\n\n    public Office(String id, Optional<Address> address)\
  \ {\n        this.id = id;\n        this.address = address;\n    }\n\n    public\
  \ String getId() {\n        return id;\n    }\n\n    public Optional<Address> getAddress()\
  \ {\n        return address;\n    }\n}\n\nclass Address {\n    private Optional<String>\
  \ street;\n    private Optional<String> city;\n\n    public Address(Optional<String>\
  \ street, Optional<String> city) {\n        this.street = street;\n        this.city\
  \ = city;\n    }\n\n    public Optional<String> getStreet() {\n        return street;\n\
  \    }\n\n    public Optional<String> getCity() {\n        return city;\n    }\n\
  }\n\npublic class OptionalDemo2 {\n    public static void main(String[] args) {\n\
  \        Optional<Address> address1 = Optional.of(\n                new Address(Optional.ofNullable(null),\
  \ \n                        Optional.of(\"New York\")));\n        Optional<Office>\
  \ office1 = Optional.of(\n                new Office(\"OF1\", address1));\n\n  \
  \      Optional<Company> company1 = Optional.of(\n                new Company(\"\
  Door Never Closed\", office1));\n\n        // company1 的街道地址是什么的？\n        // company1\
  \ 位于哪个城市？\n        Optional<Office> maybeOffice = \n                company1.flatMap(Company::getOffice);\n\
  \        Optional<Address> maybeAddress = \n                maybeOffice.flatMap(Office::getAddress);\n\
  \        Optional<String> maybeStreet = \n                maybeAddress.flatMap(Address::getStreet);\n\
  \        maybeStreet.ifPresent(System.out::println);\n        if (maybeStreet.isPresent())\
  \ {\n            System.out.println(maybeStreet.get());\n        } else {\n    \
  \        System.out.println(\"未找到街道\");\n        }\n\n        // 更简短的方法\n      \
  \  String city = company1.flatMap(Company::getOffice)\n            .flatMap(Office::getAddress)\n\
  \            .flatMap(Address::getCity)\n            .orElse(\"未找到城市\");\n     \
  \   System.out.println(\"City: \" + city);\n\n        // 仅当城市不为空时打印\n        company1.flatMap(Company::getOffice)\n\
  \                .flatMap(Office::getAddress)\n                .flatMap(Address::getCity)\n\
  \                .ifPresent(System.out::println);\n    }\n}\n```\n\n`OptionalDemo2`\
  \ 类展示了如何获取公司的街道和城市，首先通过将每次 `flatMap` 调用的返回值赋值给变量，然后通过链式调用。\n\n### OptionalInt, OptionalLong\
  \ 和 OptionalDouble\n\n`OptionalInt`、`OptionalLong` 和 `OptionalDouble` 类包含了 `Optional`\
  \ 提供的方法的子集。例如，它们拥有这些方法：`empty`、`ifPresent`、`isPresent` 和 `of`。`of` 接收一个基本类型，由于基本类型不能为空，因此没有\
  \ `ofNullable` 方法。也没有 `get` 方法。相反，`OptionalInt` 有一个 `getAsInt` 方法，`OptionalLong`\
  \ 有一个 `getAsLong` 方法，而 `OptionalDouble` 有一个 `getAsDouble` 方法。也没有 `filter`、`flatMap`\
  \ 和 `map` 方法。\n\n### 总结\n\nJava 程序员必须在代码的到处处理空指针异常。Java 8 引入了 `Optional` 和类似的类，作为处理空指针异常的新强大方法。在本章中，你已经学习了如何使用\
  \ `Optional`。\n\n# 第 4 章\n\n## Stream API\n\n在本章中，你将学习 `Stream API`，这是 JDK 8 的新特性。为了理解本章的主题，你需要知道如何使用\
  \ `Lambda 表达式` 以及 `java.util.function` 中的预定义函数接口，这两者在第 1 章“Lambda 表达式”中都讨论过。\n\n\
  ## 概述\n\n流（stream）就像一个管道，但它传输的不是水或油，而是从源传输到目的地的数据。根据传输模式的不同，流可以是顺序的，也可以是并行的。如果程序运行的计算机具有多核\
  \ CPU，那么并行流将特别有用。\n\n初看之下，流看起来像集合（collection）。然而，流并不是存储对象的数据结构，它只移动对象。因此，你不能像操作集合那样向流中添加元素。\n\
  \n使用流的主要原因是它支持顺序和并行聚合操作。例如，你可以轻松地过滤、排序或映射流中的元素。\n\n`Stream API` 由 `java.util.stream`\
  \ 包中的类型组成。`Stream` 接口是最频繁使用的流类型。`Stream` 可用于传输任何类型的对象。还有 `Stream` 的特化类型：`IntStream`、`LongStream`\
  \ 和 `DoubleStream`。所有四种流类型都派生自 `BaseStream`。\n\n表 4.1 显示了 `Stream` 接口中定义的一些方法。\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `concat` | 惰性地连接或链接两个流。返回一个新流，其元素是第一个流的元素后跟第二个流。\
  \ |\n| `count` | 返回流的数量。 |\n| `empty` | 创建并返回一个空流。 |\n| `filter` | 返回一个包含匹配给定谓词的流元素的流。\
  \ |\n| `forEach` | 对流的每个元素执行操作。 |\n| `limit` | 返回一个包含流中指定数量元素的流。 |\n| `map` | 返回一个由将函数应用于流元素后的结果组成的流。\
  \ |\n| `max` | 根据给定的比较器返回流的最大元素。 |\n| `min` | 根据给定的比较器返回流的最小元素。 |\n| `of` | 返回一个源自给定值的流。\
  \ |\n| `reduce` | 使用恒等和累加器对流进行归约。 |\n| `sorted` | 返回一个按自然顺序排列流元素的流。 |\n| `toArray`\
  \ | 返回一个包含流中元素的数组。 |\n\n表 4.1：Stream 的重要方法\n\n某些 Stream 方法执行中间操作，而某些执行终端操作。中间操作将流转换为另一个流。`filter`、`map`\
  \ 和 `sorted` 是执行中间操作的方法示例。终端操作产生结果或产生副作用。`count` 和 `forEach` 是执行终端操作的方法。\n\n值得注意的是，流是惰性的。只有在启动终端操作时，才会对源进行计算。\n\
  \nStream 的方法将在后面的章节中详细介绍。\n\n## 创建和获取流\n\n你可以使用 `Stream` 的静态方法 `of` 来创建一个顺序流。例如，以下代码段创建一个包含三个元素的\
  \ `Integer`  `Stream`。\n\n```java\n Stream<Integer> stream = Stream.of(100, 200,\
  \ 300);\n```\n\n或者，你可以将数组传递给 `of` 方法：\n\n```java\n String[] names = {\"Bart\", \"\
  Lisa\", \"Maggie\"};\nStream<String> stream = Stream.of(names);\n```\n\n`java.util.Arrays`\
  \ 工具类现在有一个 `stream` 方法用于将数组转换为顺序流。例如，你可以使用 `Arrays` 重写上面的代码来从数组创建 Stream。\n\n```java\n\
  \ String[] names = {\"Bart\", \"Lisa\", \"Maggie\"};\nStream<String> stream = Arrays.stream(names);\n\
  ```\n\n此外，`java.util.Collection` 接口也有名为 `stream` 和 `parallelStream` 的默认方法，分别返回顺序流或并行流，并集合为源。它们的签名如下。\n\
  \n```java\n default java.util.stream.Stream<E> stream()\ndefault java.util.stream.Stream<E>\
  \ parallelStream()\n```\n\n多亏于 `Collection` 中的这些方法，从 `List` 或 `Set` 获取 `Stream`\
  \ 是轻而易举。\n\n\n\n\n此外，`java.nio.file.Files` 类提供了两个返回 `Stream<Path>` 的方法：`list` 和\
  \ `walk`。`list` 返回一个指向给定路径下条目的 `Paths` 的 `Stream`。另一方面，`walk` 会遍历给定路径中的条目，并将它们作为流的形式返回。\n\
  \n`Files` 还包含一个 `lines` 方法，该方法可以将文本文件中所有的行作为 `Stream<String>` 返回。\n\n例如，列表 4.1 中的\
  \ `ObtainStreamDemo` 类展示了如何从 `Files` 类获取流。\n\n### 列表 4.1：ObtainStreamDemo 类\n\n\
  ```java\n package app04;\nimport java.io.IOException;\nimport java.nio.file.Files;\n\
  import java.nio.file.Path;\nimport java.nio.file.Paths;\nimport java.util.stream.Stream;\n\
  \npublic class ObtainStreamDemo {\n\n    public static void main(String[] args)\
  \ {\n        Path path = Paths.get(\".\");\n        try {\n            Stream<Path>\
  \ list = Files.list(path);\n            list.forEach(System.out::println);\n   \
  \     } catch (IOException ex) {\n            ex.printStackTrace();\n        }\n\
  \    }\n}\n```\n\n列表 4.1 中的代码构建了一个引用当前目录（即运行 Java 程序的目录）的 `Path`，并将其传递给 `Files.list`。该方法返回一个\
  \ `Paths` 的 `Stream`。随后代码在 `Stream` 上调用 `forEach` 方法，传递一个打印每个条目的 `Consumer`。如果你运行该代码，你将在控制台上看到当前路径下的所有条目打印。\n\
  \n### 合并流\n\n`Stream` 接口提供了一个 `concat` 方法，用于惰性地合并或链接两个流。该方法返回一个新的流，其元素包含第一个流的所有元素，紧随其的是第二个流的所有元素。\n\
  \n列表 4.2 中的代码展示了如何合并两个 `String` 类型的 `Stream` 并对其进行排序。\n\n### 列表 4.2：合并流\n\n```java\n\
  \ package app04;\nimport java.util.stream.Stream;\n\npublic class StreamConcatDemo\
  \ {\n    public static void main(String[] args) {\n        Stream<String> stream1\
  \ = \n                Stream.of(\"January\", \"Christie\");\n        Stream<String>\
  \ stream2 = \n                Stream.of(\"Okanagan\", \"Sydney\", \"Alpha\");\n\
  \        Stream.concat(stream1, stream2).sorted().\n                forEach(System.out::println);\n\
  \    }\n}\n```\n\n如果你运行列表 4.2 中的 `StreamConcatDemo` 类，你将在控制台上看到以下输出。\n\n```\n Alpha\n\
  Christie\nJanuary\nOkanagan\nSydney\n```\n\n### 过滤\n\n当你过滤流时，你根据某些标准选择流中的元素，并为所选元素返回一个新的\
  \ `Stream`。你通过在 `Stream` 对象上调用 `filter` 方法来过滤流，并传递一个 `Predicate`。`Predicate` 决定一个元素是否包含在新的流中。\n\
  \n以下是 `filter` 方法的签名。\n\n```java\n Stream<T> filter(java.util.function.Predicate<?\
  \ super T> predicate)\n```\n\n例如，列表 4.3 中的代码读取列表 4.4 中的 `example.txt` 文件，并允许通过非空且不是注释的行。在移除所有尾部空格后，注释行以哈希符号（##）开头。\n\
  \n### 列表 4.3：StreamFilterDemo1 类\n\n```java\n package app04;\nimport java.io.BufferedReader;\n\
  import java.io.FileReader;\nimport java.io.IOException;\nimport java.util.function.Predicate;\n\
  import java.util.stream.Stream;\n\npublic class StreamFilterDemo1 {\n    public\
  \ static void main(String[] args) {\n        Predicate<String> notCommentOrEmptyLine\n\
  \                = (line) -> line.trim().length() > 0\n                && !line.trim().startsWith(\"\
  #\");\n        try (FileReader fr = new FileReader(\"example.txt\");\n         \
  \       BufferedReader br = new BufferedReader(fr)) {\n            Stream<String>\
  \ lines = br.lines();\n            lines.filter(notCommentOrEmptyLine)\n       \
  \             .forEach(System.out::println);\n        } catch (IOException e) {\n\
  \            e.printStackTrace();\n        }\n    }\n}\n```\n\n### 列表 4.4：example.txt\
  \ 文件\n\n```bash\n # Set path so it includes user's private bin if it exists\nif\
  \ [ -d \"$HOME/bin\" ] ; then\n    PATH=\"$HOME/bin:$PATH\"\n\nfi\n```\n\n如果你运行列表\
  \ 4.3 中的类，你将在控制台上看到这些行。它打印了文本文件中五行中的三行。\n\n```\n if [ -d \"$HOME/bin\" ] ; then\n\
  \    PATH=\"$HOME/bin:$PATH\"\nfi\n```\n\n作为第二个示例，列表 4.5 中的类展示了你如何使用流在你的计算机上进行文件搜索。更准确地说，该代码显示了位于给定目录及其任何子目录下的所有\
  \ java 文件。\n\n### 列表 4.5：StreamFilterDemo2 类\n\n```java\n package app04;\nimport\
  \ java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\n\
  import java.nio.file.Paths;\nimport java.util.stream.Stream;\n\npublic class StreamFilterDemo2\
  \ {\n    public static void main(String[] args) {\n        // find all java files\
  \ in the parent directory and\n        // all its subdirectories\n        Path parent\
  \ = Paths.get(\"..\");\n        try {\n            Stream<Path> list = Files.walk(parent);\n\
  \            list.filter((Path p) -> p.toString().endsWith(\".java\"))\n       \
  \             .forEach(System.out::println);\n        } catch (IOException ex) {\n\
  \            ex.printStackTrace();\n        }\n    }\n}\n```\n\n`StreamFilterDemo2`\
  \ 类首先构建一个指向当前目录父目录的 `Path`。然后它将该 `Path` 传递给 `Files.walk` 以获取 `Paths` 的 `Stream`并将结果赋值给本地变量\
  \ `list`。接下来，它使用一个 `Predicate` 过滤流，包含所有名称以 `.java` 结尾的 `Paths`，并调用 `forEach` 方法打印路径。\n\
  \n### 映射\n\n`Stream` 接口的 `map` 方法通过将元素传递给函数将流中的每个元素映射为结果。以下是 `map` 的签名。\n\n```java\n\
  \ <R> Stream<R> map(java.util.function.Function<? super T,\n        ? extends R)\n\
  ```\n\n从签名中可以看出，`map` 方法返回一个新的 `Stream`，其元素类型可能与当前流的元素类型不同。\n\n考虑列表 4.6 中的代码，它展示了一个更实用、更真实的流示例，用于计算公司所有员工的平均年龄。它分两个步骤完成：首先，调用\
  \ `map` 方法将 `Employee`对象的 `Stream` 转换为 `Period` 对象的 `Stream`。新流中的每个 `Period` 元素包含今天到每个员工生日之间的间隔。换句话说，每个\
  \ `Period` 元素包含一个员工的年龄。在第二步中，代码调用 `mapToLong` 方法计算所有员工的平均年龄。\n\n### 列表 4.6：StreamMapDemo\
  \ 类\n\n\n\n\n\n```\n package app04;\nimport java.time.LocalDate;\nimport java.time.Month;\n\
  import java.time.Period;\nimport java.util.stream.Stream;\n\npublic class StreamMapDemo\
  \ {\n    class Employee {\n        public String name;\n        public LocalDate\
  \ birthday;\n        public Employee(String name, LocalDate birthday) {\n      \
  \      this.name = name;\n            this.birthday = birthday;\n        }\n   \
  \ }\n\n    public Employee[] getEmployees() {\n        Employee[] employees = {\
  \ \n            new Employee(\"Will Biteman\", \n                    LocalDate.of(1984,\
  \ Month.JANUARY, 1)), \n            new Employee(\"Sue Everyman\", \n          \
  \          LocalDate.of(1980, Month.DECEMBER, 25)),\n            new Employee(\"\
  Ann Wangi\",\n                    LocalDate.of(1976, Month.JULY, 4)),\n        \
  \    new Employee(\"Wong Kaching\",\n                    LocalDate.of(1980, Month.SEPTEMBER,\
  \ 1))\n        };\n        return employees;\n    }\n\n    public double calculateAverageAge(Employee[]\
  \ employees) {\n        LocalDate today = LocalDate.now();\n        Stream<Employee>\
  \ stream = Stream.of(employees);\n        Stream<Period> periods = stream.map(\n\
  \                (employee)-> Period.between(\n                        employee.birthday,\
  \ today));\n        double avgAge = periods.mapToLong(\n                (period)->period.toTotalMonths())\n\
  \                .average().getAsDouble() / 12;\n        return avgAge;\n    }\n\
  \n    public static void main(String[] args) {\n        StreamMapDemo demo = new\
  \ StreamMapDemo();\n        Employee[] employees = demo.getEmployees();\n      \
  \  double avgAge = demo.calculateAverageAge(employees);\n        System.out.printf(\"\
  Average employee age : %2.2f\\n\",\n                avgAge);\n    }\n}\n```\n\n\
  如果你运行 `StreamMapDemo` 类，你将看到员工的平均年龄。当然，结果取决于你运行程序的时间。在我写这本书时，我在电脑上运行它，得到了如下结果。\n\
  \n```\n Average employee age : 34.13\n```\n\n## 规约 (Reduction)\n\n`Stream` 中更有用的方法之一是\
  \ `reduce`，它可以执行规约操作。该方法有两个重载版本：\n\n```\n java.util.Optional<T> reduce(java.util.function.BinaryOperator<T>\
  \ \n        accumulator)\nT reduce(T identity,\n        java.util.function.BinaryOperator<T>\
  \ accumulator)\n```\n\n观察这两个签名，你可能会注意到 `reduce` 方法在指定的 `BinaryOperator` 帮助下，将类型为\
  \ `T` 的 `Stream` 规约类型类型 `T` 的单个实例。尽管 Java 文档中的描述并不那么直观，但实际上这个方法并没有那么难以理解。\n\n图 4.1\
  \ 显示了当一个包含四个元素的顺序流正在被规约时，后台发生了什么。\n\n![](img/0401.png)\n\n图 4.1: 规约流\n\n首先，`element-1`\
  \ 和 `element-2` 被用作指定二元运算符的操作数。该操作的结果是一个与元素相同类型的对象，我称之为 `result-a`。接下来，`result-a`\
  \ 和 `element-3` 被传递给二元运算符，产生 `result-b`，它再次具有与元素相同的类型。最后，`result-b` 和 `element-4`\
  \ 被传递给二元运算符，返回 `result-c`。由于流中没有更多元素，`result-c` 作为规约的结果被返回。\n\n对于并行流，操作可以并行执行。这意味着对\
  \ `element-1` 和 `element-2` 的操作可能与对 `element-3` 和 `element-4` 的操作同时发生，然后将第一次操作的结果和第二次操作的结果传递给二元运算符并返回其结果。\n\
  \n好了。现在让我们来看一个例子。\n\n列表 4.7 中的 `StreamReductionDemo1` 类展示了一个包含四个 `Order` 对象的 `Stream`，它被规约为了单个\
  \ `Order` 对象，该对象是最近放置的且值最大的 `Order`。\n\n列表 4.7: StreamReductionDemo1 类\n\n```\n\
  \ package app04;\nimport java.time.LocalDate;\nimport java.time.Month;\nimport java.util.Optional;\n\
  import java.util.stream.Stream;\n\npublic class StreamReductionDemo1 {\n    class\
  \ Order {\n        public int orderId;\n        public double value;\n        public\
  \ LocalDate orderDate;\n        public Order(int orderId, double value, \n     \
  \           LocalDate orderDate) {\n            this.orderId = orderId;\n      \
  \      this.value = value;\n            this.orderDate = orderDate;\n        }\n\
  \    }\n\n    public Order[] getOrders() {\n        Order[] orders = {\n       \
  \     new Order(1, 100.49,  \n                    LocalDate.of(2014, Month.DECEMBER,\
  \ 11)), \n            new Order(1, 88.09,  \n                    LocalDate.of(2014,\
  \ Month.DECEMBER, 29)), \n            new Order(1, 10.29,  \n                  \
  \  LocalDate.of(2014, Month.DECEMBER, 30)), \n            new Order(1, 100.49,\n\
  \                    LocalDate.of(2014, Month.NOVEMBER, 22)) \n        };\n    \
  \    return orders;\n    }\n\n    public Optional<Order> getLatestOrder(Order[]\
  \ orders) {\n        Stream<Order> stream = Stream.of(orders);\n        Optional<Order>\
  \ theOrder = stream.reduce((a, b) -> {\n                if (a.value > b.value) {\n\
  \                    return a;\n                } else if (a.value < b.value) {\n\
  \                    return b;\n                } else {\n                    if\
  \ (a.orderDate.isAfter(b.orderDate)) {\n                        return a;\n    \
  \                } else {\n                        return b;\n                 \
  \   }\n                }\n            });\n        return theOrder;\n    }\n\n \
  \   public static void main(String[] args) {\n        StreamReductionDemo1 demo\
  \ = new StreamReductionDemo1();\n        Order[] orders = demo.getOrders();\n  \
  \      Optional<Order> latestLargest = demo.getLatestOrder(orders);\n        if\
  \ (latestLargest.isPresent()) {\n            Order order = latestLargest.get();\n\
  \            System.out.printf(\"Latest largest order value: $%2.2f\\n\",\n    \
  \                order.value);\n            System.out.println(\" date : \" + order.orderDate);\n\
  \        } else {\n            System.out.println(\"No order found\");\n       \
  \ }\n    }\n}\n```\n*(注：由于提供的原文代码片段存在截断和格式错乱，翻译时已根据逻辑进行了必要的补全以确保可读性)*\n\n\n\n\n\n\
  ```\n package app04;\nimport java.time.LocalDate;\nimport java.time.Month;\nimport\
  \ java.time.YearMonth;\nimport java.util.function.Predicate;\nimport java.util.stream.Stream;\n\
  \npublic class StreamReductionDemo2 {\n    class Order {\n        public int orderId;\n\
  \        public double value;\n        public LocalDate orderDate;\n        public\
  \ Order(int orderId, double value, \n                LocalDate orderDate) {\n  \
  \          this.orderId = orderId;\n            this.value = value;\n          \
  \  this.orderDate = orderDate;\n        }\n    }\n\n    public Order[] getOrders()\
  \ {\n        Order[] orders = { \n            new Order(1, 100.49,  \n         \
  \           LocalDate.of(2014, Month.DECEMBER, 11)), \n            new Order(1,\
  \ 88.09,  \n                    LocalDate.of(2014, Month.DECEMBER, 29)), \n    \
  \        new Order(1, 10.29,  \n                    LocalDate.of(2014, Month.DECEMBER,\
  \ 30)), \n            new Order(1, 100.49,\n                    LocalDate.of(2014,\
  \ Month.NOVEMBER, 22)) \n        };\n        return orders;\n    }\n\n    public\
  \ double calculateSalesTotal(Order[] orders, \n            YearMonth yearMonth)\
  \ {\n        Predicate<Order> orderInGivenMonth\n                = (order) -> order.orderDate.getMonth()\
  \ \n                        == yearMonth.getMonth()\n                && order.orderDate.getYear()\
  \ \n                        == yearMonth.getYear();\n\n        Stream<Order> stream\
  \ = Stream.of(orders);\n        return stream.filter(orderInGivenMonth)\n      \
  \          .mapToDouble((order) -> order.value)\n                .reduce(0, (a,\
  \ b) -> a+b);\n    }\n\n    public static void main(String[] args) {\n        StreamReductionDemo2\
  \ demo = new StreamReductionDemo2();\n        Order[] orders = demo.getOrders();\n\
  \        double totalSalesForMonth = demo.calculateSalesTotal(\n               \
  \ orders, YearMonth.of(2014, Month.NOVEMBER));\n        System.out.printf(\"Sales\
  \ for Nov 2014 : $%2.2f\\n\",\n                totalSalesForMonth);\n\n        totalSalesForMonth\
  \ = demo.calculateSalesTotal(\n                orders, YearMonth.of(2014, Month.DECEMBER));\n\
  \        System.out.printf(\"Sales for Dec 2014 : $%2.2f\\n\",\n               \
  \ totalSalesForMonth);\n    }\n}\n```\n\n`StreamReductionDemo2` 类使用了与 `StreamReduceDemo1`\
  \ 相同的 `Order` 对象。`calculateSalesTotal` 方法从 `Order` 数组创建了一个 `Stream`，过滤出具有给定年份/月份的\
  \ `Orders`，并将元素映射为双，最后将它们归约为 ` `double`。\n\n如果你运行这个演示类，你将在控制台上看到这些：\n\n```\n Sales\
  \ for Nov 2014 : $100.49\nSales for Dec 2014 : $198.87\n```\n\n## 可变归约 (Mutable\
  \ Reductions)\n\n可变归约操作将 `Stream` 的元素累积到一个容器中并返回该容器。该容器是可变的，因此被称为可变。\n\n你使用 `Stream`\
  \ 接口的 `collect` 方法来执行可变归约操作。它的签名如下：\n\n```\n <R> R collect(java.util.function.Supplier<R>\
  \ supplier,\n        java.util.function.BiConsumer<R, ? super T> accumulator,\n\
  \        java.util.function.BiConsumer<R, R> combiner);\n```\n\n`collect` 方法分三个步骤完成工作，每一步处理该方法的一个参数。\n\
  \n在第一步中，方法处理其第一个参数，它是一个 `Supplier`，用于返回一个容器（如 `Collection` 或 `StringBuilder`）。在顺序流中，`Supplier`\
  \ 只会被调用一次，且只会存在一个容器。但在并行流中，`Supplier` 可能会被调用多次，并可能存在多个容器。\n\n在第二步中，方法处理第二个参数，它是一个执行收集的\
  \ `BiConsumer`。请记住，`BiConsumer` 接受两个不同类型的参数且不返回任何值。实践中，`BiConsumer` 将每个流元素添加到 `Supplier`\
  \ 产生的容器或多个容器中。在顺序流中，所有元素都被添加到同一个容器中，因为只有一个容器。在并行流中，每个元素被添加到不同的容器中。\n\n在最后一步中，方法处理第三个参数，它也是一个\
  \ `BiConsumer`。在顺序流中，不会发生任何处理，该参数由于从未被调用而没有任何影响。尽管如此，你不能将 `null` 作为第三个参数。在并行流中，收集器将使用\
  \ `BiConsumer` 指定的操作进行合并。\n\n这种操作的第一个示例在列表 4.9 中。它演示了你如何将字符串数组收集到 `StringBuilder`\
  \ 中。涉及到两个流，它们都在做相同的事情。第一个流使用 lambda 表达式，第二个流使用方法引用。\n\n### 列表 4.9: StreamCollectDemo1\
  \ 类\n\n```\n package app04;\nimport java.util.stream.Stream;\n\npublic class StreamCollectDemo1\
  \ {\n    public static void main(String[] args) {\n        String[] strings = {\
  \ \"a\", \"b\", \"c\", \"d\" };\n        Stream<String> stream1 = Stream.of(strings);\n\
  \        StringBuilder sb1 = stream1.collect(\n                () -> new StringBuilder(),\n\
  \                (a1, b1) -> a1.append(b1),\n                (a2, b2) -> a2.append(b2));\n\
  \        System.out.println(sb1.toString());\n\n        Stream<String> stream2 =\
  \ Stream.of(strings);\n        StringBuilder sb2 = stream2.collect(\n          \
  \      StringBuilder::new,\n                StringBuilder::append,\n           \
  \     StringBuilder::append);\n        System.out.println(sb2.toString());\n   \
  \ }\n}\n```\n\n对于每个流，`collect` 方法通过创建一个 `StringBuilder` 开始。由于涉及到顺序流，只有一个容器。接下来，方法将每个流元素添加到\
  \ `StringBuilder` 中。由于流中有四个元素，`StringBuilder` 的 `append` 方法被调用四次。\n\n由于这是顺序流，第三参数没有没有处理。`collect`\
  \ 方法直接返回包含“abcd”的 `StringBuilder`。\n\n列表 4.10 显示了可变归约的第二个示例。这次我在顺序流中使用 `List` 作为容器。同样涉及到两个流，一个使用\
  \ lambda 表达式，另一个使用方法引用。这里的 `collect` 方法返回一个包含四个元素的 `List`。\n\n### 列表 4.10: StreamCollectDemo2\
  \ 类\n\n```\n package app04;\nimport java.util.ArrayList;\nimport java.util.List;\n\
  import java.util.stream.Stream;\n\npublic class StreamCollectDemo2 {\n    public\
  \ static void main(String[] args) {\n        String[] strings = { \"a\", \"b\",\
  \ \"c\", \"d\" };\n        Stream<String> stream1 = Stream.of(strings);\n      \
  \  List<String> list1 = stream1.collect(\n                () -> new ArrayList<>(),\n\
  \                (a1, b1) -> a1.add(b1),\n                (a2, b2) -> a2.addAll(b2));\n\
  \        for (String s: list1) {\n            System.out.println(s);\n        }\n\
  \n        Stream<String> stream2 = Stream.of(strings);\n        List<String> list2\
  \ = stream2.collect(\n                ArrayList::new,\n                ArrayList::add,\n\
  \                ArrayList::addAll);\n        for (String s: list2) {\n        \
  \    System.out.println(s);\n        }\n    }\n}\n```\n\n该类别的最后一个示例——列表 4.11 中的\
  \ `StreamCollectDemo3` 类，是对 `StreamCollectDemo1` 的重写。然而，使用了并行流来向你展示收集到底是如何工作的。为了展示每个参数被处理的精确时刻，我还通过扩展\
  \ `ArrayList` 并重写其 `add` 和 `addAll` 方法创建了一个自定义的 `Supplier`。这些新方法会打印消息并调用父类方法。\n\n\
  \n\n\n\n```\n package app04;\nimport java.util.ArrayList;\nimport java.util.Collection;\n\
  import java.util.List;\nimport java.util.concurrent.atomic.AtomicInteger;\nimport\
  \ java.util.function.Supplier;\nimport java.util.stream.Stream;\n\npublic class\
  \ StreamCollectDemo3 {\n\n    public static void main(String[] args) {\n       \
  \ AtomicInteger counter = new AtomicInteger();\n        Supplier<List<String>> supplier\
  \ = () -> {\n            System.out.println(\"supplier called\");\n            return\
  \ new ArrayList<String>() {\n                int id = counter.getAndIncrement();\n\
  \                @Override\n                public boolean add(String e) {\n   \
  \                 System.out.println(\n                            \"\\\"add\\\"\
  \ called for \" + e\n                            + \" on ArrayList \" + id);\n \
  \                   return super.add(e);\n                }\n\n                @Override\n\
  \                public boolean addAll(\n                        Collection<? extends\
  \ String> c) {\n                    System.out.println(\"\\\"addAll\\\" called\"\
  \n                        + \" on ArrayList \" + id);\n                    return\
  \ super.addAll(c);\n                }\n            };\n        };\n        String[]\
  \ strings = { \"a\", \"b\", \"c\", \"d\" };\n        Stream<String> stream1 = Stream.of(strings).parallel();\n\
  \        List<String> list1 = stream1.collect(\n                supplier,\n    \
  \            (a1, b1) -> a1.add(b1),\n                (a2, b2) -> a2.addAll(b2));\n\
  \        for (String s: list1) {\n            System.out.println(s);\n        }\n\
  \    }\n}\n```\n\n如果你在多核计算机上运行此示例，你将在控制台上看到类似 own 的内容。\n\n```\n supplier called\n\
  supplier called\nsupplier called\nsupplier called\n\"add\" called for d on ArrayList\
  \ 0\n\"add\" called for c on ArrayList 2\n\"add\" called for a on ArrayList 1\n\"\
  add\" called for b on ArrayList 3\n\"addAll\" called on ArrayList 2\n\"addAll\"\
  \ called on ArrayList 1\n\"addAll\" called on ArrayList 1\na\nb\nc\nd\n```\n\n你可以看到，由于流中共有四个元素，`Supplier`\
  \ 被调用了四次，导致生成了四个全新的 `ArrayList`。然后，每个 `ArrayList` 的 `add` 方法为每个元素被调用了一次。最后，四个 `ArrayList`\
  \ 的内容被合并到一个 `ArrayList` 中并返回该 `ArrayList`。\n\n### 并行流\n\n如今大多数计算机都拥有多核处理器。这意味着多个线程可以在不同的核心上并发运行，这使得使用并行流变得意义。然而，并行流的构建成本比顺序流更高，这意味着使用并行流并不总是能让你的程序运行更快。\n\
  \n列表 4.12 中的 `ParallelStreamDemo` 类将六个整数与其斐波那契数进行映射。此示例的目的是展示并行流在多核处理器机器上如何运行得更快。\n\
  \n列表 4.12：`ParallelStreamDemo` 类\n\n```\n package app04;\nimport java.time.Duration;\n\
  import java.time.Instant;\nimport java.util.Arrays;\nimport java.util.List;\n\n\
  public class ParallelStreamDemo {\n\n    public static long fibonacci(long i) {\n\
  \        if (i == 1 || i == 2) {\n            return 1;\n        }\n        return\
  \ fibonacci(i - 1) + fibonacci(i - 2);\n    }\n\n    public static void main(String[]\
  \ args) {\n        List<Integer> numbers = \n                Arrays.asList(10, 20,\
  \ 30, 40, 41, 42);\n\n        Instant start = Instant.now();\n        numbers.parallelStream()\n\
  \                .map((input) -> fibonacci(input))\n                .forEach(System.out::println);\n\
  \        Instant end = Instant.now();\n        System.out.printf(\n            \
  \    \"Processing time with parallel stream : %dms\\n\",\n                Duration.between(start,\
  \ end).toMillis());\n\n        start = Instant.now();\n        numbers.stream()\n\
  \                .map((input) -> fibonacci(input))\n                .forEach(System.out::println);\n\
  \        end = Instant.now();\n        System.out.printf(\n                \"Processing\
  \ time with sequential stream : %dms\\n\",\n                Duration.between(start,\
  \ end).toMillis());\n    }\n}\n```\n\n如果你运行这段代码，你将在控制台上看到这些。\n\n```\n 55\n6765\n\
  832040\n102334155\n165580141\n267914296\nProcessing time with parallel stream :\
  \ 953ms\n55\n6765\n832040\n102334155\n165580141\n267914296\nProcessing time with\
  \ sequential stream : 1764ms\n```\n\n如你所见，你可以从并行流中受益。然而，对于资源非密集型的任务，这种优势变得越来越小，并且在某一点上，设置并行流的成本将超过设置顺序流的成本加上加速带来的收益。例如，如果我将数字替换为\n\
  \n```\n List<Integer> numbers = \n                Arrays.asList(1, 2, 3, 4, 5, 6);\n\
  ```\n\n在我的机器上，在你决定使用并行流之前，请做一些测试来查看它是否更快。\n\n### 总结\n\nJDK 1.8 引入了两个用于测量时间的类：`Duration`\
  \ 和 `Period`。这两个非常相似，区别在于 `Duration` 是基于时间的，而 `Period` 是基于日期的。`Duration` 提供了纳秒级的时间量。这个类非常适合例如建模飞行时间。\n\
  \n# 第 5 章：日期时间 API\n\n自 Java 1.0 以来就有对日期的支持，主要通过 `java.util.Date` 类实现。然而，`Date`\
  \ 的设计糟糕且难以使用，导致许多人转向第三方替代方案如 Joda Time ([http://joda.org/])。1.8 的新日期时间 API 解决了许多问题，并与\
  \ Joda Time 类似。\n\n本章将解释 JDK 1.8 的日期时间。\n\n## 概述\n\n新的日期时间 API 处理日期和时间变得极其简单。`java.time`\
  \ 包包含了核心类。此外，还有四个使用较少的包：`java.time.chrono`、`java.time.format`、`java.time.temporal`\
  \ 和 `java.time.zone`。\n\n在 `java.time` 包中，`Instant` 类表示时间线上的一个点，常用于为操作计时。`LocalDate`\
  \ 类模型不带时间分和时区的日期，适用于例如表示生日。\n\n如果你既需要日期也时间，那么 `LocalDateTime` 适合你。例如，订单发货日期可能除了日期之外还需要时间，以便跟踪订单。如果你只需要时间而不关心日期，那么你可以使用\
  \ `LocalTime`。在此基础上，如果时区很重要，日期时间 API 提供了 `ZonedDateTime` 类。正如其名，该类模型了带时区的日期-时间。例如，你可以使用该类计算位于不同时区的机场之间的飞行时间。\n\
  \n`java.time` 包还带有两个枚举：`DayOfWeek` 和 `Month`。`DayOfWeek` 代表星期中的一天，从星期一到星期日。`Month`\
  \ 枚举代表年的十二个月，从一月到十二月。\n\n\n\n\n处理日期和时间经常涉及解析和格式化。Date and Time API 通过在其所有主要类中提供\
  \ `parse` 和 `format` 方法来解决这两个问题。此外，`java.time.format` 包含一个 `DateTimeFormatter` 类，用于格式化日期和时间。\n\
  \n## Instant 类\n\n`Instant` 对象表示时间线上的一个点。参考点是标准的 Java 纪元（epoch），即 `1970-01-01T00:00:00Z`（格林威时间\
  \ 1970 年 1 月 1 日 00:00）。`Instant` 类的 `EPOCH` 字段返回一个表示 Java 纪元的 `Instant`。纪元之后的 `Instant`\
  \ 值为正值，之前的 `Instant` 值为负值。\n\n`Instant` 的静态方法 `now()` 返回一个表示当前时间的 `Instant` 对象：\n\
  \n```java\n Instant now = Instant.now();\n```\n\n`getEpochSecond()` 方法返回自纪元以来经过的秒数。`getNano()`\
  \ 方法返回自上一秒开始经过的纳秒数。\n\n`Instant` 类的一个常见用法是对操作进行计时，如列表 5.1 所示。\n\n**列表 5.1：使用 Instant\
  \ 对操作计时**\n\n```java\n package app05;\nimport java.time.Duration;\nimport java.time.Instant;\n\
  \npublic class InstantDemo1 {\n    public static void main(String[] args) {\n  \
  \      Instant start = Instant.now();\n        // do something here\n        Instant\
  \ end = Instant.now();\n        System.out.println(Duration.between(start, end).toMillis());\n\
  \    }\n}\n```\n\n如列表 5.1 所示，使用 `Duration` 类来返回两个 `Instant` 之间的差值。你将在本章后面学习更多关于\
  \ `Duration` 的知识。\n\n## LocalDate\n\n`LocalDate` 类模拟不包含时间组件的日期。它也没有时区。表 5.1 显示了\
  \ `LocalDate` 中一些重要的方法。\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `now` | 返回今日日期的静态方法。\
  \ |\n| `of` | 根据指定的年、月、日创建 `LocalDate` 的静态方法。 |\n| `getDayOfMonth`, `getMonthValue`,\
  \ `getYear` | 以 `int` 类型返回此 `LocalDate` 的日、月或年。 |\n| `getMonth` | 以 `Month` 枚举常量返回此\
  \ `LocalDate` 的月份。 |\n| `plusDays`, `minusDays` | 在此 `LocalDate` 上增加或减去指定的天数。 |\n\
  | `plusWeeks`, `minusWeeks` | 在此 `LocalDate` 上增加或减去指定的周数。 |\n| `plusMonths`, `minusMonths`\
  \ | 在此 `LocalDate` 上增加或减去指定的月数。 |\n| `plusYears`, `minusYears` | 在此 `LocalDate`\
  \ 上增加或减去指定的年数。 |\n| `isLeapYear` | 检查此 `LocalDate` 指定的年份是否为闰年。 |\n| `isAfter`, `isBefore`\
  \ | 检查此 `LocalDate` 是否在给定日期之后或之前。 |\n| `lengthOfMonth` | 返回此 `LocalDate` 所在月份的天数。\
  \ |\n| `withDayOfMonth` | 返回此 `LocalDate` 的副本，并将日中的设置为给定值。 |\n| `withMonth` | 返回此\
  \ `LocalDate` 的副本，将月份设置为给定值。 |\n| `withYear` | 返回此 `LocalDate` 的副本，将年份设置为给定值。 |\n\
  \n**表 5.1：LocalDate 的更多重要方法**\n\n`LocalDate` 提供了多种方法来创建日期。例如，要创建一个代表今天的 `LocalDate`，请使用静态方法\
  \ `now`。\n\n```java\n LocalDate today = LocalDate.now();\n```\n\n创建一个表示特定年、月、日的\
  \ `LocalDate`，使用其静态方法 `of`。例如，以下代码段创建了一个表示 2015 年 12 月 31 日的 `LocalDate`：\n\n```java\n\
  \ LocalDate endOfYear = LocalDate.of(2015, 12, 31);\n```\n\n`of` 方法另一个重载版本，接受 `java.time.Month`\
  \ 枚举作为第二个参数。例如，这里使用重载方法构造相同的日期：\n\n```java\n LocalDate endOfYear = LocalDate.of(2015,\
  \ Month.DECEMBER, 31);\n```\n\n还有用于获取 `LocalDate` 的日、月或年的方法，例如 `getDayOfMonth`、`getMonthValue`\
  \ 和 `getYear`。它们都不接受参数，并返回 `int` 或 `Month` 枚举。此外，还有一个 `get` 方法接受 `TemporalField`\
  \ 并返回此 `LocalDate` 的部分。例如，将 `ChronoField.YEAR` 传递给 `get` 会返回 `LocalDate` 的年份：\n\n\
  ```java\n int year = localDate.get(ChronoField.YEAR);\n```\n\n`ChronoField` 是实现\
  \ `TemporalField` 接口的枚举，因此你可以向 `get` 方法传递一个 `ChronoField` 常量。`TemporalField` 和 `ChronoField`\
  \ 属于 `java.time.temporal` 包。然而，并不是所有的 `ChronoField` 都可以传递给 `get`。例如，将 `ChronoField.SECOND_OF_DAY`\
  \ 传递给 `get` 会抛出异常。因此，与其使用 `get`，不如使用 `getMonth`、`getYear` 或类似的方法来获取 `LocalDate`\
  \ 的组件。\n\n还有用于复制 `LocalDate` 的方法，如 `plusDays`、`plusYears`、`minusMonths` 等。例如，要获取代表明日\
  \ `LocalDate`，可以创建一个代表今天的 `LocalDate` 然后调用其 `plusDays` 方法。\n\n```java\n LocalDate\
  \ tomorrow = LocalDate.now().plusDays(1);\n```\n\n要获取代表昨日的 `LocalDate`，可以使用 `minusDays`\
  \ 方法。\n\n```java\n LocalDate yesterday = LocalDate.now().minusDays(1);\n```\n\n\
  此外，还有 `plus` 和 `minus` 方法以更通的方式获取 `LocalDate` 副本。它们都接受 `long` 和 `TemporalUnit`。这些方法的签名如下：\n\
  \n```java\n public LocalDate plus(long amountToAdd, java.time.temporal.TemporalUnit\
  \ unit)\npublic LocalDate minus(long amountSubtract, java.time.temporal.TemporalUnit\
  \ unit)\n```\n\n例如，要获取代表十年前日期的 `LocalDate`，可以使用代码：\n\n```java\n LocalDate pastDate\
  \ = LocalDate.now().minus(2, ChronoUnit.DECADES);\n```\n\n`ChronoUnit` 是实现 `TemporalUnit`\
  \ 的枚举，因此你可以向 `plus` 或 `minus` 方法传递 `ChronoUnit`常量。`LocalDate` 是不可变的，因此无法更改。任何返回\
  \ `LocalDate` 的方法都会返回一个新实例。\n\n列表 5.2 展示了 `LocalDate` 的示例。\n\n```java\n package\
  \ app05;\nimport java.time.LocalDate;\nimport java.time.temporal.ChronoField;\n\
  import java.time.temporal.ChronoUnit;\n\npublic class LocalDateDemo1 {\n    public\
  \ static void main(String[] args) {\n        LocalDate today = LocalDate.now();\n\
  \        LocalDate tomorrow = today.plusDays(1);\n        LocalDate oneDecadeAgo\
  \ = today.minus(1, ChronoUnit.DECADES);\n        System.out.println(\"Day of month:\
  \ \" + today.getDayOfMonth());\n        System.out.println(\"Today is \" + today);\n\
  \        System.out.println(\"Tomorrow is \" + tomorrow);\n        System.out.println(\"\
  A decade ago was \" + oneDecadeAgo);\n        System.out.println(\"Year : \" + today.get(ChronoField.YEAR));\n\
  \    }\n}\n```\n\n## Period 类\n\n`Period` 类模拟了基于日期的时间量，例如五天、一周或三年。其一些重要方法在表 5.2\
  \ 中。\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `between` | 在两个 `LocalDate` 之间创建一个 `Period`。\
  \ |\n| `ofDays`, `ofWeeks`, `ofMonths`, `ofYears` | 创建表示给定天数/周/月/年的 `Period`。 |\n\
  | `of` | 根据给定的年、月、日创建一个 `Period`。 |\n| `getDays`, `getMonths`, `getYears` | 以 `int`\
  \ 类型返回此期的日、月、年。 |\n| `isNegative` | 如果此 `Period` 的三个组件之一为负值，则返回 `true`。否则返回 `false`。\
  \ |\n| `isZero` | 如果此 `Period` 的三个组件都为零，则返回 `true`。否则返回 `false`。 |\n| `plusDays`,\
  \ `minusDays` | 在此 `Period` 上增加或减去指定的天数。 |\n| `plusMonths`, `minusMonths` | 在此 `Period`\
  \ 上增加或减去指定的月数。 |\n\n\n\n\n| `plusYears`, `minusYears` | 向此 `Period` 增加或减去指定的年份。\
  \ |\n| `withDays` | 返回一个具有指定天数的此 `Period` 副本。 |\n| `withMonths` | 返回一个具有指定月份的此 `Period`\
  \ 副本。 |\n| `withYears` | 返回一个具有指定年份的此 `Period` 副本。 |\n\n### 表 5.2 `Period` 的重要方法\n\
  \n创建一个 `Period` 是非常的，这得益于 `of`、`ofDays()`、`ofWeeks()`、`ofMonths()` 和 `ofYears()`\
  \ 之间的静态工厂方法。例如，以下是创建一个代表两周的 `Period` 的方法。\n\n```\nPeriod twoWeeks = Period.ofWeeks(2);\n\
  ```\n\n要创建一个代表一年两个月三日的 `Period`，请使用 `of` 方法。\n\n```\nPeriod p = Period.of(1, 2,\
  \ 3);\n```\n\n要获取 `Period` 的年/月/日组件，调用其 `getYears()`、`getMonths()` 和 `getDays()`\
  \ 方法。例如，以下代码段中的 `howManyDays` 变量的值为 14。\n\n```\nPeriod twoWeeks = Period.ofWeeks(2);\n\
  int howManyDays = twoWeeks.getDays();\n```\n\n最后，你可以使用 `plusXXX` 或 `minusXXX` 方法以及\
  \ `withXXX` 方法之一来创建 `Period` 的副本。`Period` 是不可变的，因此这些方法返回的是新的 `Period` 实例。\n\n例如，列表\
  \ 5.3 中的代码显示了一个计算年龄的年龄计算器。它从两个 `LocalDate` 创建一个 `Period` 并调用它的 `getDays()`、`getMonths()`\
  \ 和 `getYears()` 方法。\n\n### 列表 5.3：使用 `Period`\n\n```java\npackage app05;\nimport\
  \ java.time.LocalDate;\nimport java.time.Period;\n\npublic class PeriodDemo1 {\n\
  \    public static void main(String[] args) {\n        LocalDate dateA = LocalDate.of(1978,\
  \ 8, 26);\n        LocalDate dateB = LocalDate.of(1988, 9, 28);\n        Period\
  \ period = Period.between(dateA, dateB);\n        System.out.printf(\"Between %s\
  \ and %s\"\n                + \" there are %d years, %d months\"\n             \
  \   + \" and %d days%n\", dateA, dateB, \n                period.getYears(), \n\
  \                period.getMonths(),\n                period.getDays());\n    }\n\
  }\n```\n\n运行时，列表 5.3 中的 `PeriodDemo1` 类将打印此字符串。\n\n```\nBetween 1978-08-26 and 1988-09-28\
  \ there are 10 years, 1 months and 2 \ndays\n```\n\n## LocalDateTime\n\n`LocalDateTime`\
  \ 类模型了一个没有时区的日期时间。表 5.3 显示了 `LocalDateTime` 中一些重要的方法。这些方法与 `LocalDate` 的方法相似，增加了一些修改时间组件的方法，例如\
  \ `plusHours()`、`plusMinutes()` 和 `plusSeconds()`，这些方法在 `LocalDate` 中是不可用的。\n\n\
  | 方法 |  |\n| :--- | :--- |\n| `now` | 返回当前日期和时间的静态方法。 |\n| `of` | 从指定的年、月、日、时、分、秒和毫秒创建\
  \ `LocalDateTime` 的静态方法。 |\n| `getYear`, `getMonthValue`, `getDayOfMonth`, `getHour`,\
  \ `getMinute`, `getSecond` | 以 `int` 返回此 `LocalDateTime` 的年、月、日、小时、分或秒部分。 |\n| `plusDays`,\
  \ `minusDays` | 向当前的 `LocalDateTime` 增加或减去指定的天数。 |\n| `plusWeeks`, `minusWeeks`\
  \ | 向当前的 `LocalDateTime` 增加或减去指定的周。 |\n| `plusMonths`, `minusMonths` | 向当前的 `LocalDateTime`\
  \ 增加或减去指定的月份。 |\n| `plusYears`, `minusYears` | 向当前的 `LocalDateTime` 增加或减去指定的年份。\
  \ |\n| `plusHours`, `minusHours` | 向当前的 `LocalDateTime` 增加或减去指定的时长。 |\n| `plusMinutes`,\
  \ `minusMinutes` | 向当前的 `LocalDateTime` 增加或减去指定的分钟。 |\n| `plusSeconds`, `minusSeconds`\
  \ | 向当前的 `LocalDateTime` 增加或减去指定的秒数。 |\n| `isAfter`, `isBefore` | 检查此 `LocalDateTime`\
  \ 是否在给定日期时间之后或之前。 |\n| `withDayOfMonth` | 返回一个日几数设置为给定值的此 `LocalDateTime` 副本。 |\n\
  | `withMonth`, `withYear` | 返回一个月份或年份设置为给定值的此 `LocalDateTime` 副本。 |\n| `withHour`,\
  \ `withMinute`, `withSecond` | 返回一个小时/分/秒设置为给定值的此 `LocalDateTime` 副本。 |\n\n### 表\
  \ 5.3：`LocalDateTime` 的更多重要方法\n\n`LocalDateTime` 提供了各种静态方法来创建日期时间。`now` 方法带有三个重载，并返回当前日期时间。无参数重载最容易使用：\n\
  \n```\nLocalDateTime now = LocalDateTime.now();\n```\n\n要创建一个具有特定日期时间的 `LocalDateTime`，请使用\
  \ `of` 方法。该方法有多个重载，允许你传递日期时间的单个组件或一个 `LocalDate` 和一个 `LocalTime`。以下是一些 `of` 方法的签名。\n\
  \n```java\npublic static LocalDateTime of(int year, int month, int dayOfMonth, int\
  \ hour, int minute)\npublic static LocalDateTime of(int year, int month, int dayOfMonth,\
  \ int hour, int minute)\npublic static LocalDateTime of(int year, Month month, int\
  \ dayOfMonth, int hour, int minute)\npublic static LocalDateTime of(int year, Month\
  \ month, int dayOfMonth, int hour, int minute)\npublic static LocalDateTime of(LocalDate\
  \ date, LocalTime time)\n```\n\n例如，以下代码段创建了一个表示 2015 年 12 月 31 日早上 8 点的 `LocalDateTime`。\n\
  \n```\nLocalDateTime endOfYear = LocalDateTime.of(2015, 12, 31, 8, 0);\n```\n\n\
  你可以使用 `plusXXX` 或 `minusXXX` 方法创建 `LocalDateTime` 的副本。例如，这段代码创建了一个代表明天同一时间的 `LocalDateTime`。\n\
  \n```\nLocalDateTime now = LocalDateTime.now();\nLocalDateTime sameTimeTomorrow\
  \ = now.plusHours(24);\n```\n\n### 时区\n\n互联网分配编号机构 (IANA) 维护着时区数据库，你可以从此网页下载：\n\n\
  ```\nhttp://www.iana.org/time-zones\n```\n\n然而，为了方便查看，你只需要访问这个维基百科页面：\n\n```\nhttp://en.wikipedia.org/wiki/List_of_tz_database_time_zones\n\
  ```\n\nJava 日期时间 API 也考虑了时区。抽象类 `ZoneId`（在 `java.time` 中）表示区域标识符。它有一个静态方法 `getAvailableZoneIds()`，返回所有区域标识符。列表\
  \ 5.4 显示了如何使用此方法打印所有区域的排序列表。\n\n### 列表 5.4：列出所有区域标识符\n\n```java\npackage app05;\n\
  import java.time.ZoneId;\nimport java.util.ArrayList;\nimport java.util.Collections;\n\
  import java.util.List;\nimport java.util.Set;\n\npublic class ZoneDemo1 {\n    public\
  \ static void main(String[] args) {\n        Set<String> allZoneIds = ZoneId.getAvailableZoneIds();\n\
  \        List<String> zoneList = new ArrayList<>(allZoneIds);\n\n        Collections.sort(zoneList);\n\
  \        for (String zoneId : zoneList) {\n            System.out.println(zoneId);\n\
  \        }\n        // 另一种，你可以使用这行代码来\n        // 打印排序后的区域列表\n        // ZoneId.getAvailableZoneIds().stream().sorted()\n\
  \        //        forEach(System.out::println);\n    }\n}\n```\n\n`getAvailableZoneIds()`\
  \ 返回一个 `String` 的 `Set`。你可以使用 `Collections.sort()` 对 `Set` 进行排序，或者更优雅地调用它的 `stream`\
  \ 方法。你可以编写这样的代码来排序区域标识符：\n\n```\nZoneId.getAvailableZoneIds().stream().sorted()\n\
  \        .forEach(System.out::println);\n```\n\n`getAvailableZoneIds()` 返回包含 586\
  \ 个区域标识符的 `Set`。以下是上述代码中的一些区域标识符。\n\n```\nAfrica/Cairo\nAfrica/Johannesburg\nAmerica/Chicago\n\
  America/Los_Angeles\nAmerica/Mexico_City\nAmerica/New_York\nAmerica/Toronto\nAntarctica/South_Pole\n\
  Asia/Hong_Kong\nAsia/Shanghai\nAsia/Tokyo\nAustralia/Melbourne\nAustralia/Sydney\n\
  Canada/Atlantic\nEurope/Amsterdam\nEurope/London\nEurope/Paris\nUS/Central\nUS/Eastern\n\
  US/Pacific\n```\n\n### ZonedDateTime\n\n`ZonedDateTime` 类模型了一个带有时区的日期时间。例如，以下是一个带时区的日期时间：\n\
  \n```\n2015-12-31T10:59:59+01:00 Europe/Paris\n```\n\n\n\n\n`ZonedDateTime` 始终是不可变的，且时间组件的精度为纳秒。\n\
  \n表 5.4 显示了 `ZonedDateTime` 中更重要的方法。\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `now` |\
  \ 静态方法，返回系统默认时区的当前日期和时间。 |\n| `of` | 静态方法，根据指定的日期、时间和时区标识符创建 `ZonedDateTime`。 |\n\
  | `getYear`, `getMonthValue`, `getDayOfMonth`, `getHour`, `getMinute`, `getSecond`,\
  \ `getNano` | 以 `int` 类型返回此 `ZoneDateTime` 的年、月、日、时、分、秒或纳秒部分。 |\n| `plusDays`, `minusDays`\
  \ | 在当前的 `ZonedDateTime` 上增加或减去指定的天数。 |\n| `plusWeeks`, `minusWeeks` | 在当前的 `ZonedDateTime`\
  \ 上增加或减去指定的周数。 |\n| `plusMonths`, `minusMonths` | 在当前的 `ZonedDateTime` 上增加或减去指定的月份。\
  \ |\n| `plusYears`, `minusYears` | 在当前的 `ZonedDateTime` 上增加或减去指定的年份。 |\n| `plusHours`,\
  \ `minusHours` | 在当前的 `ZonedDateTime` 上增加或减去指定的小时。 |\n| `plusMinutes`, `minusMinutes`\
  \ | 在当前的 `ZonedDateTime` 上增加或减去指定的分钟。 |\n| `plusSeconds`, `minusSeconds` | 在当前的\
  \ `ZonedDateTime` 上增加或减去指定的秒。 |\n| `isAfter`, `isBefore` | 检查此 `ZonedDateTime` 是否在指定的时区日期时间之后或之前。\
  \ |\n| `getZone` | 返回此 `ZonedDateTime` 的时区 ID。 |\n| `withYear`, `withMonth`, `withDayOfMonth`\
  \ | 返回此 `ZonedDateTime` 的副本，将年/月/日设置为为指定的值。 |\n| `withHour`, `withMinute`, `withSecond`\
  \ | 返回此 `ZonedDateTime` 的副本，将时/分/秒设置为指定的值。 |\n| `withNano` | 返回此 `ZonedDateTime`\
  \ 的副本，将纳秒设置为指定的值。 |\n\n表 5.4：`ZonedDateTime` 的更重要的方法\n\n与 `LocalDateTime` 一样，`ZonedDateTime`\
  \ 类提供了静态方法 `now` 和 `of` 来构建 `ZonedDateTime`。`now` 创建一个表示执行时日期和时间的 `ZonedDateTime`。`now`\
  \ 的无参数重载方法创建一个使用计算机默认时区的 `ZonedDateTime`。\n\n```\nZonedDateTime now = ZonedDateTime.now();\n\
  ```\n\n`now` 的另一个重载允许你传递一个时区标识符：\n\n```\nZonedDateTime parisTime =\n        ZonedDateTime.now(ZoneId.of(\"\
  Europe/Paris\"));\n```\n\n方法 `of` 也带有若干个重载。在所有情况下，你都需要传递一个时区标识符。第一个重载允许你传递从年到纳秒的带时区时间的每一个组件。\n\
  \n```\npublic static ZonedDateTime of(int year, int month, int dayOfMonth, \n  \
  \      int hour, int minute, int second, int nanosecond, \n        ZoneId zone)\n\
  ```\n\n`of` 的第二个重载接收一个 `LocalDate`、一个 `LocalTime` 和一个 `ZoneId`：\n\n```\npublic static\
  \ ZonedDateTime of(LocalDate date, LocalTime time,\n        ZoneId zone)\n```\n\n\
  `of` 的最后一个重载接收一个 `LocalDateTime` 和一个 `ZoneId`。\n\n```\npublic static ZonedDateTime\
  \ of(LocalDateTime datetime, ZoneId zone)\n```\n\n与 `LocalDate` 和 `LocalDateTime`\
  \ 类似，`ZonedDateTime` 提供了使用 `plusXXX`、`minusXXX` 和 `withXXX` 方法创建实例副本的方法。\n\n例如，这些代码创建了一个具有默认时区的\
  \ `ZonedDateTime`，并调用其 `minusDays` 方法来创建一个早三天的相同 `ZonedDateTime`。\n\n```\nZonedDateTime\
  \ now = ZonedDateTime.now();\nZonedDateTime threeDaysEarlier = now.minusDays(3);\n\
  ```\n\n### Duration\n\n`Duration` 类模型了一个基于时间的持续时间。它与 `Period` 相似，但 `Duration` 具有纳秒级精度的时间组件，并且考虑了\
  \ `ZonedDateTime` 之间的时区。表 5.5 显示了 `Duration` 中更重要的方法。\n\n| 方法 | 描述 |\n| :--- | :---\
  \ |\n| `between` | 在两个时间对象之间创建一个 `Duration`，例如在两个 `LocalDateTimes` 之间或两个 `LocalZonedDateTimes`\
  \ 之间。 |\n| `ofYears`, `ofMonths`, `ofWeeks`, `ofDays`, `ofHours`, `ofMinutes`, `ofSeconds`,\
  \ `ofNano` | 创建一个表示给定年/月/周/日/小时/分/秒/纳秒的 `Duration`。 |\n| `of` | 根据给定的时间单位创建一个 `Duration`。\
  \ |\n| `toDays`, `toHours`, `toMinutes` | 以 `int` 类型返回此 `Duration` 的天/小时/分钟。 |\n\
  | `isNegative` | 如果此 `Duration` 为负，则返回 true。否则返回 false。 |\n| `isZero` | 如果此 `Duration`\
  \ 长度为零，则返回 true。否则，返回 false。 |\n| `plusDays`, `minusDays` | 在此 `Duration` 上增加或减去指定的天数。\
  \ |\n| `plusMonths`, `minusMonths` | 在此 `Duration` 上增加或减去指定的月份。 |\n| `plusYears`,\
  \ `minusYears` | 在此 `Duration` 上增加或减去指定的年份。 |\n| `withSeconds` | 返回此 `Duration`\
  \ 的副本，将秒设置为指定的值。 |\n\n表 5.5：`Duration` 的更重要的方法\n\n可以通过调用其 `between` 或 `of` 静态方法创建一个\
  \ `Duration`。表 5.5 的代码创建两个 `LocalDateTimes` 之间的 `Duration`，例如 2015 年 1 月 26 日 8:10\
  \ 和 2015 年 1 月 26 日 11:40。\n\n```java\npackage app05;\nimport java.time.Duration;\n\
  import java.time.LocalDateTime;\n\npublic class Duration1 {\n\n    public static\
  \ void main(String[] args) {\n        LocalDateTime dateTimeA = LocalDateTime\n\
  \                .of(2015, 1, 26, 8, 10, 0);\n        LocalDateTime dateTimeB =\
  \ LocalDateTime\n                .of(2015, 1, 26, 11, 40, 0);\n        Duration\
  \ duration = Duration.between(\n                dateTimeA, dateTimeB);\n       \
  \ System.out.printf(\"There are %d hours and %d minutes.%n\",\n                duration.toHours(),\
  \ \n                duration.toMinutes() % 60);\n    }\n}\n```\n\n运行 `Duration1`\
  \ 类的结果是：\n\n```\nThere are 3 hours and 30 minutes.\n```\n\n表 5.6 的代码创建两个 `ZoneDateTimes`\
  \ 之间的 `Duration`，具有相同的时间但不同的时区。\n\n```java\npackage app05;\nimport java.time.Duration;\n\
  import java.time.LocalDateTime;\nimport java.time.Month;\nimport java.time.ZoneId;\n\
  import java.time.ZonedDateTime;\n\npublic class Duration2 {\n\n    public static\
  \ void main(String[] args) {\n        ZonedDateTime zdt1 = ZonedDateTime.of(\n \
  \               LocalDateTime.of(2015, Month.JANUARY, 1, 8, 0),\n              \
  \  ZoneId.of(\"America/Denver\"));\n        ZonedDateTime zdt2 = ZonedDateTime.of(\n\
  \                LocalDateTime.of(2015, Month.JANUARY, 1, 8, 0), \n            \
  \    ZoneId.of(\"America/Toronto\"));\n        Duration duration = Duration.between(zdt1,\
  \ zdt2);\n        System.out.printf(\"There are %d hours and %d minutes.%n\",\n\
  \                duration.toHours(), \n                duration.toMinutes() % 60);\n\
  \    }\n}\n```\n\n运行 `Duration2` 类在控制台上输出如下：\n\n```\nThere are -2 hours and 0 minutes.\n\
  ```\n\n作为一个更复杂的示例，列表 5.7 中的代码显示了一个班车旅行时间计算器。它有一个方法 `calculateTravelTime`，接收一个出发\
  \ `ZonedDateTime` 和一个到达 `ZonedDateTime`。代码调用了两次 `calculateTravelTime` 方法。两次班车都是丹佛当地时间早上\
  \ 8 点从科罗拉多州丹佛出发，并在第二天早上 8 点到达多伦多。第一次班车是在 2014 年 3 月 8 日出发，第二次是在 2014 年 3 月 18 日出发。\n\
  \n这两种情况的旅行时间是多少？\n\n列表 5.7：旅行时间计算器\n\n\n\n\n\n```java\n package app05;\nimport java.time.Duration;\n\
  import java.time.LocalDateTime;\nimport java.time.Month;\nimport java.time.ZoneId;\n\
  import java.time.ZonedDateTime;\n\npublic class TravelTimeCalculator {\n\n    public\
  \ Duration calculateTravelTime(\n            ZonedDateTime departure, ZonedDateTime\
  \ arrival) {\n        return Duration.between(departure, arrival);\n    }\n\n  \
  \  public static void main(String[] args) {\n        TravelTimeCalculator calculator\
  \ = \n                new TravelTimeCalculator();\n        ZonedDateTime departure1\
  \ = ZonedDateTime.of(\n                LocalDateTime.of(2014, Month.MARCH, 8, \n\
  \                        8, 0), \n                ZoneId.of(\"America/Denver\"));\n\
  \        ZonedDateTime arrival1 = ZonedDateTime.of(\n                LocalDateTime.of(2014,\
  \ Month.MARCH, 9, \n                        8, 0), \n                ZoneId.of(\"\
  America/Toronto\"));\n        Duration travelTime1 = calculator\n              \
  \  .calculateTravelTime(departure1, arrival1);\n        System.out.println(\"Travel\
  \ time 1: \" \n                + travelTime1.toHours() + \" hours\");\n\n      \
  \  ZonedDateTime departure2 = ZonedDateTime.of(\n                LocalDateTime.of(2014,\
  \ Month.MARCH, 18, \n                        8, 0), \n                ZoneId.of(\"\
  America/Denver\"));\n        ZonedDateTime arrival2 = ZonedDateTime.of(\n      \
  \          LocalDateTime.of(2014, Month.MARCH, 19, \n                        8,\
  \ 0), \n                ZoneId.of(\"America/Toronto\"));\n        Duration travelTime2\
  \ = calculator\n                .calculateTravelTime(departure2, arrival2);\n  \
  \      System.out.println(\"Travel time 2: \" \n                + travelTime2.toHours()\
  \ + \" hours\");\n    }\n}\n```\n\n结果如下。\n\n```\n Travel time 1: 21 hours\nTravel\
  \ time 2: 22 hours\n```\n\n为什么会有差异？因为 2014 年的夏令时是从 3 月 9 日星期日凌晨 2 点开始的。因此，在 2014\
  \ 年 3 月 8 日和 2014 年 3 月 9 日之间，你“丢失”了一小时。\n\n## 格式化日期-时间\n\n你使用 `java.time.format.DateTimeFormatter`\
  \ 来格式化本地或带时区的日期时间。`LocalDate`、`LocalDateTime`、`LocalTime` 和 `ZonedDateTime` 类提供了具有以下签名的\
  \ `format` 方法。\n\n``` public java.lang.String format(java.time.format.DateTimeFormatter\
  \ \n        formatter)\n```\n\n显然，要格式化日期或时间，必须先创建一个 `DateTimeFormatter` 实例。\n\n\
  列表 5.8 中的代码使用两个格式化器格式化当前日期。\n\n### 列表 5.8：格式化日期\n\n```java\n package app05;\nimport\
  \ java.time.LocalDateTime;\nimport java.time.format.DateTimeFormatter;\nimport java.time.format.FormatStyle;\n\
  \npublic class DateTimeFormatterDemo1 {\n    public static void main(String[] args)\
  \ {\n        DateTimeFormatter formatter1 = DateTimeFormatter\n                .ofLocalizedDateTime(FormatStyle.MEDIUM);\n\
  \        LocalDateTime example = LocalDateTime.of(\n                2000, 3, 19,\
  \ 10, 56, 59);\n        System.out.println(\"Format 1: \" + example\n          \
  \      .format(formatter1));        \n        DateTimeFormatter formatter2 = DateTimeFormatter\n\
  \                .ofPattern(\"MMMM dd, yyyy HH:mm:ss\");\n        System.out.println(\"\
  Format 2: \" + \n                example.format(formatter2));\n    }\n}\n```\n\n\
  结果如下（第一个结果取决于你的区域设置）。\n\n```\n Format 1: 19-Mar-2000 10:56:59 AM\nFormat 2: March\
  \ 19, 2000 10:56:59\n```\n\n## 解析日期-时间\n\nJava 日期和时间 API 中的许多类都有两个解析方法。第一个需要一个格式化器，第二个不需要。不需要的将根据默认模式解析日期时间。要使用你自己的模式，请使用\
  \ `DateTimeFormatter`。如果传递的字符串无法解析，`parse` 方法将抛出 `DateTimeParseException`。\n\n列表\
  \ 5.9 包含一个年龄计算器，用于演示日期解析。\n\n### 列表 5.9：一个年龄计算器\n\n```java\n package app05;\nimport\
  \ java.time.LocalDate;\nimport java.time.Period;\nimport java.time.format.DateTimeFormatter;\n\
  import java.time.format.DateTimeParseException;\nimport java.util.Scanner;\n\npublic\
  \ class AgeCalculator {\n    DateTimeFormatter formatter = DateTimeFormatter.ofPattern(\"\
  yyyy-M-d\");\n    public Period calculateAge(LocalDate birthday) {\n        LocalDate\
  \ today = LocalDate.now();\n        return Period.between(birthday, today);\n  \
  \  }\n\n    public LocalDate getBirthday() {\n        Scanner scanner = new Scanner(System.in);\n\
  \        LocalDate birthday;\n        while (true) {\n            System.out.println(\"\
  Please enter your birthday \"\n                    + \"in yyyy-MM-dd format (e.g.\
  \ 1980-9-28): \");\n            String input = scanner.nextLine();\n           \
  \ try {\n                birthday = LocalDate.parse(input, formatter);\n       \
  \         return birthday;\n            } catch(DateTimeParseException e) {\n  \
  \              System.out.println(\"Error! Please try again\");\n            }\n\
  \        }\n    }\n\n    public static void main(String[] args) {\n        AgeCalculator\
  \ ageCalculator = new AgeCalculator();\n        LocalDate birthday = ageCalculator.getBirthday();\n\
  \        Period age = ageCalculator.calculateAge(birthday);\n        System.out.printf(\"\
  Today you are %d years, %d months\"\n                + \" and %d days old%n\",\n\
  \                age.getYears(), age.getMonths(), age.getDays());\n    }\n}\n```\n\
  \n`AgeCalculator` 类有两个方法：`getBirthday` 和 `calculateAge`。`getBirthday` 方法使用 `Scanner`\
  \ 读取用户输入，并使用类级别的 `DateTimeFormatter` 将输入解析为 `LocalDate`。`getBirthday` 方法会一直请求日期，直到用户输入正确格式的日期，此时该方法返回。`calculateAge`\
  \ 方法接收一个 `birthday` 并在 `birthday` 和今天之间创建一个 `Period`。\n\n如果你运行这个示例，你将在控制台上看到以下内容：\n\
  \n```\n Please enter your birthday in yyyy-MM-dd format (e.g. 1980-9-28):\n```\n\
  \n如果你输入了格式正确的日期，程序将打印计算出的年龄，如下：\n\n```\n Today you are 79 years, 0 months and 15\
  \ days old\n```\n\n### 总结\n\nJava 8 带来了新的日期时间 API 来取代围绕 `java.util.Date` 类的旧 API。在本章中，你学习了使用新\
  \ API 中的核心类，如 `Instant`、`LocalDate`、`LocalDateTime`、`ZonedDateTime`、`Period` 和 `Duration`，并学习了格式化和解析日期时间。\n\
  \n# 第 6 章 JavaFX 8\n\nJavaFX 是一种用于创建可以在桌面和浏览器中运行的丰富应用程序的技术。它与 Swing 类似，但具有更好更简单的对象模型，并将取代\
  \ Swing 和 AWT。\n\n本章介绍了 JavaFX，第七章“使用 FXML JavaFX”解释了如何使用名为 FXML 的特殊标记语言分离表示层和业务逻辑。\n\
  \n## 概述\n\nJavaFX 是一种构建丰富应用程序的技术，可以作为桌面应用程序部署，并在浏览器中作为 applet 运行。JavaFX 将最终取代 Swing，为了方便从\
  \ Swing 迁移到 JavaFX，它支持两者之间的互操作性。你可以在 JavaFX 应用程序中轻松地使用 Swing 组件。\n\n作为一种桌面技术，JavaFX\
  \ 是任何 Java 开发者或渴望成为 GUI 开发者的极选择，归功于其功能和易用性。此外，JavaFX 受到 Oracle 以及整个 Java 社区的全支持，因此获取帮助很容易。\n\
  \n\n\n\n\n作为一种构建浏览器内应用程序的技术，JavaFX 必须与其它技术竞争，特别是 HTML 5、Flash 和 Microsoft Silverlight。HTML\
  \ 5 的优势在于被现代浏览器原生支持，这意味着使用 HTML 5 构建的任何内容都能保证在这些浏览器中无缝运行，尽管 HTML 5 的功能没有 JavaFX、Flash\
  \ 或 Silverlight 丰富。JavaFX、Flash 和 Silverlight 应用需要插件才能在浏览器中运行，浏览器并不一定带有这些插件，因此例如\
  \ JavaFX applet 用户可能在运行 JavaFX applet 之前必须安装 Java 浏览器插件。安装插件可能会或不会阻碍人们对 JavaFX applet\
  \ 的喜爱。你可以通过阅读此网页上的说明，自行判断安装插件是否足够简单。\n\n```\nhttp://java.com/en/download/help/enable_browser.xml\
  \ \n```\n\n### 设置\n\nJavaFX 起初是一项独立的技术，必须从 JDK 离离开下载。然而，从 `JDK 1.7 update 6` (`JDK7u6`)\
  \ 开始，JDK 自带了最新版本的 JavaFX。`JDK 1.7` 包含 `JavaFX 2.2`，而 `Java 8` 带有 `JavaFX 8`，这是版本\
  \ `2.2`之后的之后的。\n\n在编写此时，开发 JavaFX 应用最简单的方法是使用 `NetBeans 8` 或更高版本。只需点击 `File` → `New\
  \ Project` → `JavaFX` 即可创建一个新的 JavaFX 项目。\n\n如果你没有使用 NetBeans，在编译和运行应用程序时，将 `jfxrt.jar`\
  \ 文件包含在类路径中。在 `JDK 1.8` 中，文件位于 `$JAVA_HOME/jre/lib/ext/`，其中 `$JAVA_HOME` 是你 JDK\
  \ 的安装目录。在 `JDK 1.7 update 6` 及更高版本中，可以在 `$JAVA_HOME/jre/lib/` 找到该文件。\n\n如果你使用 Eclipse，右键点击项目图标并点击\
  \ `Properties`。在出现的窗口左侧，点击 `Java Build Path`，然后选择右侧的 `Libraries` 选项卡。接下来，点击 `Add\
  \ External JARs` 按钮，导航到 jar 文件的位置并选择它。\n\n有一个名为 `e(fx)clipse` 的 Eclipse 插件，你可以将其添加到\
  \ `Eclipse 4.4` 及更高版本中以帮助你开发 JavaFX 应用。可以在此处查看说明。\n\n```\nhttp://www.eclipse.org/efxclipse/install.html\n\
  ```\n\n你也可以从 IDE 外部编译和运行 JavaFX 应用程序。要使用命令行上的 `javac` 程序编译包 `mypackage` 中名为 `MyFXApp`\
  \ 的 JavaFX 类，请进入项目的源码目录并输入：\n\n```\njavac -cp ${JAVA_HOME}/jre/lib/ext/jfxrt.jar\
  \ mypackage/MyFXApp.java\n```\n\n将 `${JAVA_HOME}` 替换为 Java 安装路径。例如，如果你的 Java 安装在\
  \ `/opt/jdk1.8.0_25`，请使用此命令。\n\n```\njavac -cp /opt/jdk1.8.0_25/jre/lib/ext/jfxrt.jar\
  \ mypackage/MyFXApp.java\n```\n\n运行应用程序（在 Linux 和 Mac OS X 上），将当前目录包含在类路径中：\n\n\
  ```\njava -cp /opt/jdk1.8.0_25/jre/lib/ext/jfxrt.jar:. mypackage.MyFXApp \n```\n\
  \n在 Windows 上，将冒号替换为分号。\n\n```\njava -cp /opt/jdk1.8.0_25/jre/lib/ext/jfxrt.jar;.\
  \ mypackage.MyFXApp\n```\n\n### 你的第一个 JavaFX \n\n本节展示了开发 JavaFX 应用程序有多简单。示例仅包含一个类，名为\
  \ `FirstApp`，如列表 6.1 所示。\n\n### 列表 6.1: `FirstApp` 类\n\n```\npackage app06; \nimport\
  \ javafx.application.Application; \nimport javafx.scene.Scene; \nimport javafx.scene.control.Label;\
  \ \nimport javafx.scene.layout.StackPane;\nimport javafx.stage.Stage; \n\npublic\
  \ class FirstApp extends Application { \n\n    @Override \n    public void start(Stage\
  \ stage) { \n        Label label = new Label(\"Welcome\"); \n        StackPane root\
  \ = new StackPane(); \n        root.getChildren().add(label); \n\n        Scene\
  \ scene = new Scene(root, 400, 100);\n\n        stage.setTitle(\"First FX\"); \n\
  \        stage.setScene(scene); \n        stage.show(); \n    } \n\n    public static\
  \ void main(String[] args) { \n        launch(args); \n    } \n}\n```\n\n就像运行任何\
  \ Java 应用程序一样运行它，你会看到一个类似于图 6.1 的窗口。\n\n![](img/0601.png)\n\n图 6.1：一个简单的 JavaFX\
  \ 应用程序（在 Ubuntu 上）\n\n下一节将解释 JavaFX API。\n\n### Application, Stage 和 Scene\n\nJavaFX\
  \ API 以 `javafx` 包及其子包中类型的类型形式存在。它最重要的类型之一是 `javafx.application.Application` 类，它代表一个\
  \ JavaFX 应用程序。JavaFX 应用程序由一个或多个窗口和其他资源组成。\n\n在 JavaFX 中，窗口由 `javafx.stage.Window`\
  \ 类表示，它有两个子类 `Stage` 和 `PopupWindow`。一个 `Stage`（`javafx.stage.Stage` 的实例）是一个顶层容器，你向其添加一个。一个\
  \ `Stage`（由创建的……类型是 `javafx.application.Application` 类，代表……现在让我们来看看这三个主要类：Application、Stage\
  \ 和 Scene。其他 JavaFX 类型的详情可以在查看。\n\n```\nhttp://docs.oracle.com/javase/8/javafx/api/toc\n\
  ```\n\n### Application\n\n你继承 `Application` 类来创建 JavaFX 应用程序。要将其作为独立程序运行，你需要调用它的其中一个启动方法。\n\
  \n```\npublic static void launch(java.String... args)\npublic static void launch(Class<?\
  \ extends Application> appClass, java.String... args)\n```\n\n你传递给启动方法的任何参数都可以从\
  \ `Application` 内部使用 `getParameters` 方法获取。\n\n```\npublic final Application.Parameters\
  \ getParameters()\n```\n\nApplication 具有以下生命周期方法，它们将在实例启动时被调用。\n\n```\npublic void\
  \ init() throws java.Exception\n```\n\n该方法在应用程序构造后调用。如果应用程序需要初始化，则应重写它。\n\n```\n\
  public abstract void start(Stage stage) throws java.Exception\n```\n\n该方法在 `init()`\
  \ 返回后调用，你应该在此方法中构建 UI。JavaFX 运行时创建一个 `Stage` 对象并作为方法参数传递。\n\n```\npublic void stop()\
  \ throws java.Exception\n```\n\n该方法在应用程序停止时调用。你应该在此处释放持有的资源。\n\n在生命周期方法中，只有 `start`\
  \ 必须重写。\n\n### Stage\n\n`Stage` 类代表 UI 组件的顶层容器。当应用程序的 `start` 方法被调用时，会创建一个实例并传递给你。应用程序创建的\
  \ Stage 是应用程序的主窗口。如有，你可以创建自己的 Stage。\n\n`Stage` 就像任何其他 UI 窗口一样，有一个标题，你可以使用 `Stage`\
  \ 类的标题属性进行填充。此外，你可以通过调用 `Stage` 的 `setScene` 方法将 `Scene` 添加到其中。然后，要显示 `Stage` 调用它的\
  \ `show` 方法。\n\n### Scene\n\n`Scene` 是可以添加到 `Stage` 的容器。`Scene` 必须包含一个父节点，它是所有添加到\
  \ Scene 的组件的根。父节点由 `javafx.scene.Parent` 类表示。`Scene` 最简单的构造函数接受一个参数，即 `Parent` 的实例。\n\
  \n```\npublic Scene(Parent root)\n\n\n\n其他构造函数允许你指定 `Scene` 的尺寸及其填充颜色。\n\n```\n\
  public Scene(Parent root, double width, double height)\npublic Scene(Parent root,\
  \ javafx.scene.paint.Paint fill)\npublic Scene(Parent root, double width, double\
  \ height, javafx.scene.paint.Paint fill)\n```\n\nUI 组件\n\n\n\n\n内置的 UI 组件让编写 JavaFX\
  \ 变得既简单又有趣。在 JavaFX 开发者的术语中，UI 组件被称为场景图节点（或简单称为节点）。`javafx.scene.Node` 类是所有节点的基类。它有五个子类，区分了\
  \ JavaFX 中的节点类型：\n\n*   `Canvas`: 一个你可以在上面画图的矩形区域。\n*   `Parent`: 一个可以向其中添加其他 UI\
  \ 组件的容器。\n*   `Shape`: 表示一个形状，例如矩形、圆形或弧形。\n*   `ImageView`: 显示图片的视图区域。\n*   `MediaView`:为由\
  \ `MediaPlayer` 播放的媒体提供视图。\n\n`Canvas`、`ImageView` 和 `MediaView` 没有子类。`Parent` 和\
  \ `Shape` 有子类。\n\n`Parent` 类具有以下子类：\n\n*   `Control`: 该类是所有 UI 控件的基类，从像 `Button`\
  \ 和 `Label` 这样的简单控件到 `ProgressBar`、`TreeView` 和 `TableView` 等更复杂的控件。\n*   `Region`:\
  \ 表示一个可以包含其他节点并使用 CSS 进行样式的屏幕区域。子类包括 `Chart` 和各种 `Pane`，包括 `BorderPane`、`StackPane`、`FlowPane`、`GridPane`、`HBox`、`VBox`、`AnchorPane`\
  \ 等。\n*   `Group`: 一个包含子节点 `ObservableList` 的区域，是处理 `Shape` 对象的最佳 `Parent`。\n* \
  \  `WebView`: `WebView` 用于管理 `WebEngine` 并显示其内容。如名称所示，WebEngine` 可以加载网页、创建文档模型并在页面上运行\
  \ JavaScript。\n\n`Control` 和 `Region` 类将在后续章节中进一步讨论。\n\n`javafx.scene.shape.Shape`\
  \ 类是各种几何形状的基类，包括 `Arc`、`Circle`、`Ellipse`、`Line`、`Path` 和 `Rectangle`。\n\n# Controls\n\
  \nUI 控件是用户可以交互的节点。`javafx.scene.control.Control` 类是所有 UI 控件的基类。图 6.2 显示了 `Control`\
  \ 的直接和间接子类。\n\n![](img/0602.png)\n\n图 6.2：Control 的实现\n\n图 6.3 显示了一个包含一些 JavaFX\
  \ 控件的 `Scene`，列表 6.2 展示了生成该 `Scene` 的代码。\n\n![](img/0603.png)\n\n图 6.3：JavaFX UI\
  \ 控件\n\n列表 6.2：`ControlsDemo` 类\n\n```java\n package app06;\nimport javafx.application.Application;\n\
  import javafx.geometry.Insets;\nimport javafx.scene.Scene;\nimport javafx.scene.control.Button;\
  \ \nimport javafx.scene.control.CheckBox; \nimport javafx.scene.control.ChoiceBox;\
  \ \nimport javafx.scene.control.ColorPicker; \nimport javafx.scene.control.ComboBox;\
  \ \nimport javafx.scene.control.Hyperlink; \nimport javafx.scene.control.Label;\
  \ \nimport javafx.scene.control.ListView; \nimport javafx.scene.control.MenuButton;\
  \ \nimport javafx.scene.control.MenuItem; \nimport javafx.scene.control.PasswordField;\
  \ \nimport javafx.scene.control.RadioButton; \nimport javafx.scene.control.ScrollBar;\
  \ \nimport javafx.scene.control.Separator; \nimport javafx.scene.control.Slider;\
  \ \nimport javafx.scene.control.TextArea; \nimport javafx.scene.control.TextField;\
  \ \nimport javafx.scene.control.ToggleGroup; \nimport javafx.scene.layout.ColumnConstraints;\
  \ \nimport javafx.scene.layout.GridPane; \nimport javafx.scene.paint.Color; \nimport\
  \ javafx.stage.Stage; \n\npublic class ControlsDemo extends Application { \n\n \
  \   @Override \n    public void start(Stage stage) { \n        GridPane grid = new\
  \ GridPane(); \n        grid.setHgap(15); \n        grid.setVgap(25); \n       \
  \ ColumnConstraints constraint = new ColumnConstraints(); \n        constraint.setPercentWidth(25);\
  \ \n        grid.getColumnConstraints().addAll(constraint, \n                constraint,\
  \ constraint, constraint); \n        grid.setPadding(new Insets(10)); \n\n     \
  \   grid.add(new Label(\"Label\"), 0, 0); \n        grid.add(new Button(\"Button\"\
  ), 1, 0); \n        grid.add(new CheckBox(\"CheckBox\"), 2, 0); \n\n        ChoiceBox<String>\
  \ choiceBox = new ChoiceBox<String>(); \n\n        choiceBox.getItems().addAll(\"\
  ChoiceBox 1\", \"ChoiceBox 2\"); \n        choiceBox.setValue(\"ChoiceBox 1\");\
  \ \n        grid.add(choiceBox, 3, 0); \n\n        grid.add(new ColorPicker(Color.GREEN),\
  \ 0, 1); \n\n        ComboBox<String> comboBox = new ComboBox<String>(); \n    \
  \    comboBox.getItems().addAll(\"Combo 1\", \"Combo 2\"); \n        comboBox.setValue(\"\
  Combo 1\"); \n        grid.add(comboBox, 1, 1); \n\n        grid.add(new Hyperlink(\"\
  Hyperlink\"), 2, 1); \n\n        ListView<String> listView = new ListView<String>();\
  \ \n        listView.getItems().addAll(\"List Item 1\", \n                \"List\
  \ Item 2\", \"List Item 3\"); \n        grid.add(listView, 3, 1); \n\n        MenuButton\
  \ menuButton = new MenuButton(\"Menu\"); \n        menuButton.getItems().addAll(new\
  \ MenuItem(\"Menu 1\"), \n                new MenuItem(\"Menu 1\")); \n        grid.add(menuButton,\
  \ 0, 2); \n\n        grid.add(new TextField(\"TextField\"), 1, 2); \n\n        PasswordField\
  \ passwordField = new PasswordField(); \n        passwordField.setText(\"Password\"\
  ); \n        grid.add(passwordField, 2, 2); \n\n        grid.add(new ScrollBar(),\
  \ 3, 2); \n\n        ToggleGroup group = new ToggleGroup(); \n        RadioButton\
  \ radioButton1 = new RadioButton(\"Radio 1\"); \n        radioButton1.setToggleGroup(group);\
  \ \n        radioButton1.setSelected(true); \n        RadioButton radioButton2 =\
  \ new RadioButton(\"Radio 2\"); \n        radioButton2.setToggleGroup(group); \n\
  \        grid.add(radioButton1, 0, 3); \n        grid.add(radioButton2, 1, 3); \n\
  \n        TextArea textArea = new TextArea(\"TextArea\"); \n        textArea.setMinHeight(60.00);\
  \ \n        grid.add(textArea, 2, 3); \n\n        grid.add(new Separator(), 3, 3);\
  \ \n\n        Slider slider2 = new Slider(0, 100, 30);\n        slider2.setShowTickMarks(true);\
  \ \n        slider2.setShowTickLabels(true); \n        grid.add(slider2, 0, 4, 4,\
  \ 1); \n\n        Scene scene = new Scene(grid, 600, 320); \n        scene.setFill(Color.BEIGE);\
  \ \n\n        stage.setTitle(\"JavaFX Controls\"); \n        stage.setScene(scene);\
  \ \n        stage.show(); \n    } \n\n    public static void main(String[] args)\
  \ { \n        launch(args); \n    }\n}\n```\n\n# Regions\n\nRegion 是一个可以包含其他节点并使用\
  \ CSS 进行样式的屏幕区域。所有 Regions 都是 `javafx.scene.layout.Region` 类的子类。Region 有三个直接后代：`Axis`、`Chart`\
  \ 和 `Pane`。`Axis` 用于在图表区域上渲染轴，`Chart` 模型图表。`Pane` 是一个通常用于布局 UI 控件的区域。\n\n本节仅讨论 `Pane`。\n\
  \n`Pane` 的子类包括 `BorderPane`、`StackPane`、`GridPane`、`FlowPane`、`AnchorPane`、`HBox`\
  \ 和 `VBox`。\n\n`HBox` 将其子项排列在单水平行中，而 `VBox` 在单垂直行中排列。相比之下，`GridPane` 将元素安排在网格中，通常用于布局表单的控件。\n\
  \n列表 6.3 中的 `ControlsDemo` 类使用 `BorderPane` 布局控件。只使用了顶部、左侧和中间区域。顶部部分包含包含两个按钮的 `HBox`，左侧包含一个\
  \ `Label` 和一个 `ColorPicker`。中间部分有一个带有 `Image` 的 `ImageView`。\n\n\n\n\n```java\n\
  package app06;\nimport javafx.application.Application; \nimport javafx.geometry.Insets;\
  \ \nimport javafx.scene.Scene; \nimport javafx.scene.control.Button; \nimport javafx.scene.control.ColorPicker;\
  \ \nimport javafx.scene.control.Label; \nimport javafx.scene.image.ImageView; \n\
  import javafx.scene.layout.BorderPane; \nimport javafx.scene.layout.HBox; \nimport\
  \ javafx.scene.layout.VBox; \nimport javafx.stage.Stage; \n\npublic class BorderPaneDemo\
  \ extends Application { \n\n    @Override \n    public void start(Stage stage) {\
  \ \n        Button okButton = new Button(\"OK\"); \n        okButton.setDefaultButton(true);\
  \ \n\n        Button cancelButton = new Button(\"Cancel\"); \n        HBox hBox\
  \ = new HBox(); \n        hBox.setPadding(new Insets(15, 12, 15, 12)); \n      \
  \  hBox.setSpacing(10); \n        hBox.setStyle(\"-fx-background-color: #886699;\"\
  ); \n        hBox.getChildren().addAll(okButton, cancelButton); \n        BorderPane\
  \ root = new BorderPane(); \n        root.setTop(hBox); \n\n        ImageView imageView\
  \ = new ImageView(\"image/1.jpg\"); \n        root.setCenter(imageView); \n\n  \
  \      VBox vBox = new VBox(); \n        vBox.setStyle(\"-fx-background-color: \"\
  \ + \n        \"#ddeeff;-fx-padding:10px\"); \n        vBox.getChildren().addAll(\
  \ \n                new Label(\"Select Color:\"), \n                new ColorPicker());\
  \ \n        root.setLeft(vBox); \n\n        root.setStyle(\"-fx-background-color:\
  \ #6680e6;\"); \n        Scene scene = new Scene(root, 740, 530); \n\n        stage.setTitle(\"\
  HBox, VBox, BorderPane Demo\"); \n        stage.setScene(scene); \n        stage.show();\
  \ \n    } \n\n    public static void main(String[] args) { \n        launch(args);\
  \ \n    } \n} \n```\n\n图 6.5 显示了 Windows 上的 `BorderPaneDemo` 。\n\n![](img/0605.png)\n\
  \n图 6.5：BorderPane demo\n\n## 事件处理\n\nJavaFX 是事件驱动的。UI 组件可以引发事件，你可以编写代码来处理这些事件。这种事件驱动机制使得\
  \ JavaFX 应用程序能够用户交互性。\n\n有许多类型的事件，它们都继承自 `javafx.event.Event` 类。`Event` 的子类包括 `ActionEvent`、`InputMethodEvent`、`MouseEvent`、`MouseDragEvent`、`ScrollEvent`、`SwipeEvent`\
  \ 等。\n\n不同的组件可能会引发不同的事件。例如，点击按钮会引发 `ActionEvent`，在 `TextField` 中更改文本会触发 `InputMethodEvent`。你可以编写并注册一个事件处理器，当相应的事件发生时，该处理器会被调用。例如，你可以为\
  \ `TextField` 的 `InputMethodEvent` 编写一个处理器，将输入的文本转换为大写。或者，你可以编写一个处理器，在按钮被点击时打开另一个\
  \ `Stage`。\n\n在 JavaFX 中编写和注册事件处理器的最简单的方法是使用 `Node` 类提供的便利方法之一。这些方法的名称遵循 `setOnXXX`\
  \ 模式，并且被 `Node` 的所有后代继承。便利方法的示例有 `setOnDragEntered`、`setOnDragExited`、`setOnInputMethodTextChanged`、`setOnKeyTyped`、`setOnMouseClicked`\
  \ 等许多。`Node` 的子类可能会添加更多便利方法以适应它们特定的事件。\n\n这些便利方法接受一个 `EventHandler` 对象作为参数。`javafx.event.EventHandler`\
  \ 是一个带有 `handle` 方法的泛型接口。这里是 `EventHandler` 的定义。\n\n```java\n package javafx.event;\n\
  public interface EventHandler<T extends Event> extends \n        java.util.EventListener\
  \ {\n\n    void handle(T event)\n\n}\n```\n\n在构造 `EventHandler` 时，你必须传递合适的事件类型。例如，以下代码构造了\
  \ `ActionEvent` 的 `EventHandler`。\n\n```java\nEventHandler handler = new EventHandler<ActionEvent>()\
  \ { \n\n    @Override \n    public void handle(ActionEvent event) { \n        //\
  \ 执行某些操作\n    } \n};\n```\n\n列表 6.4 中的 `RotateDemo` 类展示了 JavaFX 事件处理。该类包含一个 `Rectangle`\
  \ 和一个 `Button`，并捕获 `Button` 的 `ActionEvent`。每当按钮被点击时，`Rectangle` 就会顺时针旋转 10 度。\n\
  \n列表 6.4：`RotateDemo` 类\n\n```java\n package app06;\n\nimport javafx.application.Application;\
  \ \nimport javafx.collections.ObservableList; \nimport javafx.event.ActionEvent;\
  \ \nimport javafx.event.EventHandler; \nimport javafx.scene.Node; \nimport javafx.scene.Scene;\
  \ \nimport javafx.scene.control.Button; \nimport javafx.scene.layout.VBox; \nimport\
  \ javafx.scene.paint.Color; \nimport javafx.scene.shape.Rectangle; \nimport javafx.stage.Stage;\
  \ \n\npublic class RotateDemo extends Application { \n\n    @Override \n    public\
  \ void start(Stage stage) { \n        VBox root = new VBox(40); \n        ObservableList<Node>\
  \ children = root.getChildren(); \n        final Rectangle rect = new Rectangle(80,\
  \ 50); \n        rect.setFill(Color.AQUAMARINE); \n        children.add(rect); \n\
  \n        Button button = new Button(\"Rotate\"); \n        button.setOnAction(new\
  \ EventHandler<ActionEvent>() { \n            @Override \n            public void\
  \ handle(ActionEvent event) { \n                rect.rotate(10); \n            }\
  \ \n        });\n\n        Scene scene = new Scene(root, 120, 130); \n        stage.setTitle(\"\
  Rotate Demo\"); \n        stage.setScene(scene); \n        stage.show(); \n    }\
  \ \n\n    public static void main(String[] args) { \n        launch(args); \n  \
  \  } \n}\n```\n\n在应用程序的 `start` 方法中，创建了一个 `Button` 并调用了它的 `setOnAction` 方法。\n\n\
  图 6.6 显示了该应用程序。尝试点击按钮观察效果。\n\n![](img/0606.png)\n\n图 6.6：JavaFX 中的事件处理\n\n## 使用\
  \ CSS 样式\n\n某些控件提供了更改其外观的方法。例如，`Label` 类的 `setFont` 方法允许你设置显示文本的字体。虽然这些方法易于使用，但它们必须在代码内部调用，这导致了表示层与业务逻辑之间的紧耦合。更好的方法是使用\
  \ CSS（级联样式表）样式 UI 组件。在本书中，CSS 指 JavaFX 中使用的 CSS。\n\nCSS 文件包含可以通过 ID 或类引用的样式。每个 JavaFX\
  \ 控件已分配了一个默认 CSS 类，与控件的 Java 类名相似。例如，`Button` 的默认样式是 `button`，`Label` 的默认样式是 `label`。这意味着，为了提供影响所有按钮的样式，你只需要在\
  \ CSS 文件中有一个名为 `button` 的样式即可。例如：\n\n```css\n .button {\n    -fx-border-width: 3px;\
  \ \n    -fx-background-color:#dd8818; \n} \n```\n\n多单词控件的默认样式是单词组合。例如，`CheckBox`\
  \ 的默认样式是 `check-box`，`ProgressBar` 的默认样式是 `progress-bar`。\n\n非控件节点没有默认样式。如果你想为 `VBox`\
  \ 设置样式，首先需要为实例添加一个 CSS 类。例如，以下代码为 `VBox` 添加了名为 `vbox` 的类。\n\n```java\n VBox vBox\
  \ = new VBox(); \nvBox.getStyleClass().add(\"vbox\"); \n```\n\n该 `VBox` 随后会对应用程序引用的任何\
  \ CSS 文件中的 `vbox` 样式做出响应。\n\n\n\n\n\n除了使用样式类（style classes），你还可以创建一个由组件标识符（identifier）引用的样式。如果你希望样式只影响某个类型的特定实例，而不是该类型的所有实例，就可以这样做。例如，`.button`\
  \ 样式会影响应用程序中所有的 `Button` 控件。如果你想让样式影响某个 `Button` 而不是所有的 `Buttons`，你可以为该 `Button`\
  \ 添加新类，或者为它添加一个标识符。这是一个分配了 id `nextBtn` 的 `Button` 示例。\n\n```\n Button nextButton\
  \ = new Button(\"Next\"); \nnextButton.setId(\"nextBtn\"); \n```\n\n然后你可以在 CSS 文件中创建此样式，它只会影响该\
  \ Button。\n\n```\n #nextBtn { \n    -fx-font-weight: bold; \n}\n```\n\n注意，每个节点都有一个\
  \ `setStyle` 方法，你可以调用它来分配 CSS 样式。然而但不推荐这种做法，因为你将表示逻辑和业务逻辑混合在一起了。以下是如何使用 `setStyle`\
  \ 的示例。\n\n```\n Button button = new Button();\nbutton.setStyle(\"-fx-background-color:green\"\
  );\n```\n\n最好将所有的样式写在 CSS 文件中。一旦你的 CSS 文件准备好，你就可以从应用程序的启动方法加载它，如下所示。\n\n```\n @Override\
  \ \npublic void start(Stage stage) { \n    ...\n    Scene scene = ...; \n    scene.getStylesheets().add(\"\
  style.css\");\n    ...\n} \n```\n\n在这里，`style.css` 是位于类文件相同位置的 CSS 文件。\n\n以下是本章中使用的一些样式。\n\
  \n*   `-fx-fill`\n*   `-fx-font-family`\n*   `-fx-font-size`\n*   `-fx-font-style`\n\
  *   `-fx-font-weight`\n*   `-fx-background-color`\n*   `-fx-text-fill`\n\n作为一个示例，考虑列表\
  \ 6.5 中的 `CSSDemo` 类，它使用了列表 6.6 中的 `style.css` 文件。\n\n列表 6.5：`CSSDemo` 类\n\n```\n\
  \ package app06;\nimport javafx.application.Application; \nimport javafx.scene.Scene;\
  \ \nimport javafx.scene.control.Button; \nimport javafx.scene.control.Label; \n\
  import javafx.scene.layout.BorderPane; \nimport javafx.scene.layout.HBox; \nimport\
  \ javafx.stage.Stage; \n\npublic class CSSDemo extends Application { \n\n    @Override\
  \ \n    public void start(Stage stage) { \n        BorderPane root = new BorderPane();\
  \ \n\n        root.setCenter(new Label(\"Welcome\")); \n\n        HBox hBox = new\
  \ HBox(); \n        hBox.getStyleClass().add(\"hbox\"); \n\n        Button backButton\
  \ = new Button(\"Back\"); \n        hBox.getChildren().add(backButton); \n     \
  \   Button nextButton = new Button(\"Next\"); \n        nextButton.setId(\"nextBtn\"\
  ); \n        hBox.getChildren().add(nextButton); \n        root.setBottom(hBox);\n\
  \n        Scene scene = new Scene(root, 400, 300); \n        scene.getStylesheets().add(\"\
  style.css\");\n\n        stage.setTitle(\"CSS Demo\"); \n        stage.setScene(scene);\
  \ \n        stage.show(); \n    }\n\n    public static void main(String[] args)\
  \ { \n        launch(args); \n    } \n}\n```\n\n列表 6.6：`style.css` 文件\n\n```\n .label\
  \ { \n    -fx-background-color: #778855; \n    -fx-font-family: helvetica; \n  \
  \  -fx-font-size: 45px; \n    -fx-text-fill: yellow;\n}\n.hbox { \n    -fx-background-color:\
  \ #2f4f4f; \n    -fx-padding: 15px; \n    -fx-spacing: 10px; \n    -fx-alignment:\
  \ center;\n}\n\n.button { \n    -fx-border-width: 2px; \n    -fx-background-color:#ff8800;\n\
  \    -fx-cursor: hand;\n}\n\n#nextBtn { \n    -fx-font-weight: bold;\n}\n```\n\n\
  如果你运行该应用程序，你会看到一个与图 6.7 相同的 `Stage`。\n\n![](img/0607.png)\n\n图 6.7：CSS Demo\n\n\
  作为一个补充说明，`jfxrt.jar` 文件（JavaFX 运行时）包含 `modena.css` 文件。这是根节点和 UI 控件的默认样式表。建议查看此文件的内容以学习定义的样式。要查看此文件，请进入\
  \ jar 文件所在的目录并运行此命令：\n\n```\n jar jfxrt.jar com/javafx/scene/control/skin/modena.css\n\
  ```\n\n### 使用 DatePicker\n\nJavaFX 8 中的新组件 `DatePicker` 允许用户选择日期或输入文本。你可以通过 `LocalDate`\
  \ 获取选择的日期。你还可以通过编写 `EventHandler` 并传递给 `DatePicker` 的 `setOnAction` 方法来响应日期选择。\n\
  \n列表 6.7 显示了一个使用 `DatePicker` 选择生日的 JavaFX 应用程序。如果用户选择了未来的日期，将在 `DatePicker` 旁边显示错误消息。\n\
  \n列表 6.7：DatePicker 类\n\n```\n package app06;\nimport java.time.LocalDate;\nimport\
  \ java.time.Period;\nimport javafx.application.Application;\nimport javafx.event.Event;\n\
  import javafx.event.EventHandler;\nimport javafx.geometry.HPos;\nimport javafx.scene.Scene;\n\
  import javafx.scene.control.DatePicker;\nimport javafx.scene.control.Label;\nimport\
  \ javafx.scene.layout.GridPane;\nimport javafx.scene.layout.VBox;\nimport javafx.stage.Stage;\n\
  \npublic class DatePickerDemo extends Application {\n\n    public static void main(String[]\
  \ args) {\n        launch(args);\n    }\n\n    @Override\n    public void start(Stage\
  \ stage) {\n        stage.setTitle(\"DatePicker Demo\");\n        VBox vbox = new\
  \ VBox(20);\n        vbox.setStyle(\"-fx-padding: 15;\");\n        Scene scene =\
  \ new Scene(vbox, 550, 340);\n        stage.setScene(scene);\n\n        GridPane\
  \ gridPane = new GridPane();\n        gridPane.setHgap(10);\n        gridPane.setVgap(10);\n\
  \n        Label label = new Label(\"Birthday:\");\n        gridPane.add(label, 0,\
  \ 0);\n\n        DatePicker birthdayPicker = new DatePicker();\n        gridPane.add(birthdayPicker,\
  \ 0, 1);\n\n        Label error = new Label();\n        gridPane.add(error, 1, 1);\n\
  \n        birthdayPicker.setOnAction(new EventHandler() {\n            public void\
  \ handle(Event t) {\n                LocalDate selectedDate = birthdayPicker.getValue();\n\
  \                System.out.println(\"Selected date: \" + selectedDate);\n     \
  \           LocalDate today = LocalDate.now();\n                if (Period.between(selectedDate,\
  \ today).isNegative()) {\n                    error.setText(\"Your birthday cannot\
  \ be later than today\");\n                } else {\n                    error.setText(\"\
  \");\n                }\n            }\n        });\n\n        vbox.getChildren().add(gridPane);\n\
  \        stage.show();\n    }\n}\n```\n\n图 6.8 显示了应用程序。\n\n![](img/0608.png)\n\n\
  图 6.8：编程步骤\n\n总结\n\nJavaFX 是一种用于创建桌面和浏览器应用程序的 Java 技术。它是比 AWT 和 Swing 更好的解决方案，因此注定将取代它的前身。\n\
  \n本章介绍了 JavaFX 并提供了几个示例。下一章“使用 FXML 的 JavaFX”将解释如何使用名为 FXML 的特殊标记语言来分离表示层和逻辑。\n\n\
  # 第 7 章：使用 FXML 的 JavaFX\n\nFXML 是一种基于 XML 的标记语言，用于构建 JavaFX 用户界面 (UI)。在 JavaFX\
  \ 应用程序中使用 FXML 是分离表示层和逻辑的一种极方法。本章讨论了 FXML 并展示如何在 JavaFX 应用程序开发中使用它。\n\n## 概述\n\n\
  JavaFX 2 的新功能 FXML 通过将用户界面构建移动到基于 XML 的文档，极大降低了 JavaFX 类的复杂度。此外，FXML 比 Java 类更能可视化\
  \ UI 组件层次结构。FXML 文档的根节点一个 `javafx.scene.Parent`，可以使用名为 `FXLoader` 的特殊加载器加载到 JavaFX。以下是使用\
  \ FXML 的 `Application` 子类的启动方法。\n\n```\n @Override \npublic void start(Stage stage)\
  \ throws Exception { \n    stage.setTitle(\"FXML Example\"); \n    Parent root =\
  \ (Parent) FXMLLoader.load(\n            getClass().getResource(\"example1.fxml\"\
  )); \n    Scene scene = new Scene(root, 740, 530); \n    stage.setScene(scene);\
  \ \n    stage.show(); \n} \n```\n\n上述代码调用了 `FXLoader` 的 `load` 方法来读取 FXML 文件并将其内容转换为\
  \ `Parent` 对象。然后使用该 `Parent` 对象来构建 `Scene`。\n\n\n\n\n编写 FXML 文件非常简单。你首先创建一个文本文件，并将其保存到与类文件相同的目录中。你可以将其存储在其他地方，但如果它与加载它的类位于同一个目录，加载起来是最容易的。\n\
  \n由于 FXML 文件是一个 XML 文档，所有 FXML 文档都以此声明开头。\n\n```\n <?xml version=\"1.0\" encoding=\"\
  UTF-8\"?> \n```\n\n接下来是导入指令，用于导入你将在 FXML 文件中引用的类型。你可以导入一个包或一个类型。\n\n```\n <?import\
  \ javafx.scene.*?> \n<?import javafx.scene.control.*?> \n<?import javafx.scene.layout.*?>\
  \ \n<?import javafx.geometry.Insets?> \n```\n\n接下来是根元素。它可以是 `Parent` 的任何子类。这里有一个示例。\n\
  \n```xml\n <GridPane xmlns:fx=\"http://javafx.com/fxml\" \n        hgap=\"5\" vgap=\"\
  12\" layoutY=\"30\">\n\n</GridPane>\n```\n\n`fx` 前缀是 FXML 中的一个特殊前缀。你将在本章稍后的部分学习它的用法。\n\
  \n要设置对象中的属性，请使用嵌套元素或属性。例如，上面 `GridPane` 元素中的 `hgap` 属性填充了 `GridPane` 的 `hgap` 属性。\n\
  \n在根元素内部构建你的 UI。列表 7.1 显示了一个 FXML 文件的示例。\n\n列表 7.1：FXML 文件示例\n\n```xml\n <?xml version=\"\
  1.0\" encoding=\"UTF-8\"?> \n<?import javafx.scene.*?> \n<?import javafx.scene.control.*?>\
  \ \n<?import javafx.scene.layout.*?> \n<?import javafx.geometry.Insets?> \n<?import\
  \ javafx.scene.image.Image?> \n<?import javafx.scene.image.ImageView?> \n\n<BorderPane>\
  \ \n    <top> \n        <HBox spacing=\"10.0\" style=\"-fx-background-color:#886699;\"\
  > \n            <padding> \n                <Insets top=\"15\" bottom=\"15\" left=\"\
  12\" right=\"12\"/>\n            </padding> \n            <Button id=\"okButton\"\
  \ text=\"OK\" defaultButton=\"true\"/> \n            <Button text=\"Cancel\"/> \n\
  \        </HBox> \n    </top> \n</BorderPane> \n```\n\n元素可以包含一个要实例化的类或一个要填充的属性。列表\
  \ 7.1 中的 FXML 文件包含一个类型为 `BorderPane` 的根元素。`BorderPane` 的 `top` 属性填充了一个 `HBox`。`HBox`\
  \  又包含两个 `Buttons`，并且其 `padding` 属性填充了一个 `Insets`。\n\n关于 FXML 的更多细节可以在此处找到。\n\n\
  ```\n http://docs.oracle.com/javafx/2/api/javafx/fxml/doc-files/\nintroduction_to_fxml.html\n\
  ```\n\n### 注意事项\n\n建议在编写 FXML 时使用支持 JavaFX 的 IDE，并利用其代码补全功能使编写 FXML 变得更简单。NetBeans\
  \ 和 IntelliJ 支持 JavaFX，而 Eclipse 通过插件支持 JavaFX。\n\n接下来的章节将展示在 JavaFX 应用中使用 FXML\
  \ 的示例。\n\n## 一个简单的基于 FXML 的应用程序\n\n此示例是上一章中创建的 `BorderPaneDemo` 应用程序的重写。这次使用 FXML\
  \ 文档来构建和组织 UI 组件。为了方便阅读，这里重印了 `BorderPaneDemo` 类。\n\n```java\n package app07;\n\
  import javafx.application.Application; \nimport javafx.geometry.Insets; \nimport\
  \ javafx.scene.Scene; \nimport javafx.scene.control.Button; \nimport javafx.scene.control.ColorPicker;\
  \ \nimport javafx.scene.control.Label; \nimport javafx.scene.image.ImageView; \n\
  import javafx.scene.layout.BorderPane; \nimport javafx.scene.layout.HBox; \nimport\
  \ javafx.scene.layout.VBox; \nimport javafx.stage.Stage; \n\npublic class BorderPaneDemo\
  \ extends Application { \n\n    @Override \n    public void start(Stage stage) {\
  \ \n        Button okButton = new Button(\"OK\"); \n        okButton.setDefaultButton(true);\
  \ \n\n        Button cancelButton = new Button(\"Cancel\"); \n        HBox hBox\
  \ = new HBox(); \n        hBox.setPadding(new Insets(15, 12, 15, 12)); \n      \
  \  hBox.setSpacing(10); \n        hBox.setStyle(\"-fx-background-color: #886699;\"\
  ); \n        hBox.getChildren().addAll(okButton, cancelButton); \n        BorderPane\
  \ root = new BorderPane(); \n        root.setTop(hBox); \n\n        ImageView imageView\
  \ = new ImageView(\"image/1.jpg\"); \n        root.setCenter(imageView); \n\n  \
  \      VBox vBox = new VBox(); \n        vBox.setStyle(\"-fx-background-color: \"\
  \ + \n        \t\t\"#ddeeff;-fx-padding:10px\"); \n        vBox.getChildren().addAll(\
  \ \n                new Label(\"Select Color:\"), \n                new ColorPicker());\
  \ \n        root.setLeft(vBox); \n\n        root.setStyle(\"-fx-background-color:\
  \ #6680e6;\"); \n        Scene scene = new Scene(root, 740, 530); \n\n        stage.setTitle(\"\
  HBox, VBox, BorderPane\"); \n    }\n}\n```\n\n`BorderPaneDemo` 类中的 UI 部分可以替换为 7.2\
  \ 所示的 `example.fxml` 文件。\n\n```xml\n <?xml version=\"1.0\" encoding=\"UTF-8\"?>\
  \ \n<?import javafx.scene.*?> \n<?import javafx.scene.control.*?> \n<?import javafx.scene.layout.*?>\
  \ \n<?import javafx.geometry.Insets?> \n\n<BorderPane> \n    <top> \n        <HBox\
  \ spacing=\"10.0\" style=\"-fx-background-color:#886699;\"> \n            <padding>\
  \ \n                <Insets top=\"15\" bottom=\"15\" left=\"12\" right=\"12\"/>\n\
  \            </padding> \n            <Button id=\"okButton\" text=\"OK\" defaultButton=\"\
  true\"/> \n            <Button text=\"Cancel\"/> \n        </HBox> \n    </top>\
  \ \n</BorderPane>\n```\n列表 7.2：`example.fxml` 文件\n\n```xml\n <?xml version=\"1.0\"\
  \ encoding=\"UTF-8\"?> \n<?import javafx.scene.*?> \n<?import javafx.scene.control.*?>\
  \ \n<?import javafx.scene.layout.*?> \n<?import javafx.geometry.Insets?> \n<?import\
  \ javafx.scene.image.Image?> \n<?import javafx.scene.image.ImageView?> \n\n<BorderPane>\
  \ \n    <top> \n        <HBox spacing=\"10.0\" style=\"-fx-background-color:#886699;\"\
  > \n            <padding> \n                <Insets top=\"15\" bottom=\"15\" left=\"\
  12\" right=\"12\"/>\n            </padding> \n            <Button id=\"okButton\"\
  \ text=\"OK\" defaultButton=\"true\"/> \n            <Button text=\"Cancel\"/> \n\
  \        </HBox> \n    </top> \n</BorderPane>\n```\n`start` 方法使用 `FXMLLoader` 加载\
  \ FXML 文档并返回一个包含所声明组件的 `Parent` 对象。该方法随后创建一个 `Scene`并将 `Scene` 传递给 `Stage`，然后调用\
  \ `Stage` 的 `show` 方法。\n\n列表 7.3 所示了 Java 类 `Example1`。\n\n```java\n package app07;\n\
  import javafx.application.Application; \nimport javafx.fxml.FXMLLoader; \nimport\
  \ javafx.scene.Parent; \nimport javafx.scene.Scene; \nimport javafx.stage.Stage;\
  \ \n\npublic class Example1 extends Application { \n\n    @Override \n    public\
  \ void start(Stage stage) throws Exception {\n        // Example1.fxml 必须位于 Example1.class\
  \ 相同的目录下\n        Parent root = FXMLLoader.load(getClass().getResource(\"example1.fxml\"\
  )); \n        root.setStyle(\"-fx-background-color: #6680e6;\"); \n        Scene\
  \ scene = new Scene(root, 740, 530); \n        stage.setTitle(\"JavaFX with FXML\
  \ (Example 1)\"); \n        stage.setScene(scene); \n        stage.show(); \n  \
  \  }\n\n    public static void main(String[] args) { \n        launch(args); \n\
  \    }\n}\n```\n\n## 使用 FXML 处理事件\n\n使用 FXML FXML 是一种强大的语言。它的功能之一是将 UI 组件与控制器中的事件处理方法（事件处理器）绑定，这样当事件发生时就会调用该方法。控制器是实现\
  \ `javafx.fxml.Initializable` 的 Java 类。为了利用这一功能，你必须在根元素中使用 `fx:controller` 属性，如下：\n\
  \n```xml\n <Group fx:controller=\"app7.Example2Controller\" \n```\n\n记得 `fx` 是 FXML\
  \ 中的一个特殊前缀。\n\n要将组件绑定到事件处理器，请使用元素相关的 `onXXX` 属性。例如，将 `ActionEvent` 绑定到控制器中名为 `handleAction`\
  \ 的方法，请写：\n\n```xml\n onAction=\"#handleAction\"\n```\n\n例如，考虑以下带有用户名和密码登录表单的应用程序。应用程序的主阶段如图\
  \ 7.2 所示。\n\n![](img/0702.png)\n\n图 7.2：示例 2 中的登录表单\n\n\n\n\n用户可以输入用户名和密码。点击 `Reset`\
  \ 会清除用户名和密码字段。点击 `Login` 将对用户进行身份验证。验证结果将写在字段上方的 `Label` 上。\n\n该应用程序由一个 FXML 文档（列表\
  \ 7.4 中的 `example2.fxml`）、一个控制器类（列表 7.5 中的 `Example2Controller`）以及一个主类（列表 7.6 中的\
  \ `Example2`）组成。\n\n### 列表 7.4：`example2.fxml` 文件\n\n```xml\n <?xml version=\"1.0\"\
  \ encoding=\"UTF-8\"?> \n\n<?import javafx.scene.*?> \n<?import javafx.scene.control.*?>\
  \ \n<?import javafx.scene.layout.*?> \n<?import javafx.geometry.Insets?> \n\n<GridPane\
  \ xmlns:fx=\"http://javafx.com/fxml\" \n        fx:controller=\"app07.Example2Controller\"\
  \ \n        hgap=\"5\" vgap=\"12\" layoutY=\"30\"  > \n    <columnConstraints> \n\
  \        <ColumnConstraints percentWidth=\"15\"/> \n        <ColumnConstraints percentWidth=\"\
  35\" \n                halignment=\"RIGHT\"/> \n        <ColumnConstraints percentWidth=\"\
  35\"/> \n        <ColumnConstraints percentWidth=\"10\"/> \n    </columnConstraints>\
  \ \n\n    <children> \n        <Label fx:id=\"statusLabel\" > \n            <GridPane.columnIndex>1</GridPane.columnIndex>\
  \ \n            <GridPane.rowIndex>0</GridPane.rowIndex> \n            <GridPane.columnSpan>2</GridPane.columnSpan>\
  \ \n        </Label> \n\n        <Label text=\"User Name:\"> \n            <GridPane.columnIndex>1</GridPane.columnIndex>\
  \ \n            <GridPane.rowIndex>1</GridPane.rowIndex> \n        </Label> \n \
  \       <TextField fx:id=\"userNameField\"> \n            <GridPane.columnIndex>2</GridPane.columnIndex>\
  \ \n            <GridPane.rowIndex>1</GridPane.rowIndex> \n        </TextField>\
  \ \n\n        <Label text=\"Password:\"> \n            <GridPane.columnIndex>1</GridPane.columnIndex>\
  \ \n            <GridPane.rowIndex>2</GridPane.rowIndex> \n        </Label> \n \
  \       <PasswordField fx:id=\"passwordField\"> \n            <GridPane.columnIndex>2</GridPane.columnIndex>\
  \ \n            <GridPane.rowIndex>2</GridPane.rowIndex> \n        </PasswordField>\
  \ \n        <Button fx:id=\"resetButton\" text=\"Reset\" \n                onAction=\"\
  #handleReset\"> \n            <GridPane.columnIndex>1</GridPane.columnIndex> \n\
  \            <GridPane.rowIndex>3</GridPane.rowIndex> \n        </Button> \n   \
  \     <Button fx:id=\"loginButton\" text=\"Login\" \n                defaultButton=\"\
  true\" onAction=\"#handleLogin\"> \n            <GridPane.columnIndex>2</GridPane.columnIndex>\
  \ \n            <GridPane.rowIndex>3</GridPane.rowIndex> \n        </Button> \n\
  \    </children> \n</GridPane>\n```\n\n列表 7.2 中的 FXML 文档使用 `GridPane` 作为根元素。该标记还填充了\
  \ `GridPane` 的 `columnConstraints` 和 `children` 属性。`columnContraints` 包含 `ColumnConstraints`\
  \ 元素，指定了每个列的宽度。`children` 属性指定了要在 `GridPane` 内部渲染的 UI 组件。\n\n请特别注意 `Button` 元素的\
  \ `onAction` 属性。它们分别用于将 `ActionEvent` 绑定到 `handleLogin` 和 `handleReset` 方法。\n\n\
  ### 列表 7.5：`Example2Controller` 类\n\n```java\n package app07;\nimport java.net.URL;\
  \ \nimport java.util.ResourceBundle; \nimport javafx.event.ActionEvent; \nimport\
  \ javafx.fxml.FXML; \nimport javafx.fxml.Initializable; \nimport javafx.scene.control.Label;\
  \ \nimport javafx.scene.control.PasswordField; \nimport javafx.scene.control.TextField;\
  \ \n\npublic class Example2Controller implements Initializable { \n\n    @FXML \n\
  \    private TextField userNameField; \n    @FXML \n    private PasswordField passwordField;\
  \ \n    @FXML \n    private Label statusLabel; \n\n    @FXML \n    private void\
  \ handleReset(ActionEvent event) { \n        userNameField.setText(\"\"); \n   \
  \     passwordField.setText(\"\"); \n        statusLabel.setText(\"\"); \n    }\
  \ \n\n    @FXML \n    private void handleLogin(ActionEvent event) { \n        String\
  \ userName = userNameField.getText(); \n        String password = passwordField.getText();\
  \ \n        if (\"john\".equals(userName) \n                && \"secret\".equals(password))\
  \ { \n            statusLabel.setText(\"Login successul\"); \n        } else { \n\
  \            statusLabel.setText(\"Login failed\"); \n        } \n    } \n\n   \
  \ @Override \n    public void initialize(URL url, ResourceBundle rb) { \n    } \
  \   \n} \n```\n\n控制器为其绑定的 FXML 文档提供事件处理器。事件处理器必须标记为 `@FXML`。此外，为了访问 UI 组件，你可以对字段使用\
  \ `@FXML` 标记。标记的字段名称必须与其绑定的组件的 `fx:id` 属性相同。\n\n在列表 7.5 的控制器类中，声明了三个字段并标记了 `@FXML`：`userNameField`、`passwordField`\
  \ 和 `statusLabel`。\n\n### 列表 7.6：`Example2` 类\n\n```java\n package app07;\nimport\
  \ javafx.application.Application;\nimport javafx.fxml.FXMLLoader;\nimport javafx.scene.Parent;\n\
  import javafx.scene.Scene;\nimport javafx.stage.Stage;\n\npublic class Example2\
  \ extends Application {\n\n    @Override\n    public void start(Stage stage) throws\
  \ Exception {\n        Parent root = FXMLLoader.load(getClass().getResource(\"example2.fxml\"\
  ));\n        Scene scene = new Scene(root, 300, 200);\n        stage.setTitle(\"\
  Login Form\");\n        stage.setScene(scene);\n        stage.show();\n    }\n \
  \   // \n}\n```\n\n最后，`Example2` 类加载并显示了 FXML 文档。\n\n### 总结\nFXML 是构建 UI 的标记语言。在本章中，你学习了\
  \ FXML 的基础知识以及如何使用。\n\n# 第 8 章：Nashorn\n\n## 概述\nNashorn 是 Java 8 中的 JavaScript\
  \ 引擎。它取代了 Java 中仍然使用的旧 JavaScript 引擎 Rhino。然而，新项目应该使用 Nashorn，因为它更符合 ECMAScript。\n\
  \nNashorn 是一个德语单词，意为“犀牛”。Nashorn 引擎基于 JSR 292，“在 Java 平台上支持动态语言”。该 JSR 让目标 JVM 的动态语言通过利用\
  \ `invokedynam` 得更快。\n\n## 使用 jjs 命令\njjs 是随 JRE 1.8 和 JDK 1.8 一起提供的工具。位于 `JAVA_HOME/bin`\
  \ 目录下，`JAVA_HOME` 是 JRE 或 JDK 的安装目录。\n\n测试 Nashorn 功能的最简单方法是使用 jjs 命令工具。其语法如下：\n\
  \n```\n jjs [options] [script-files] [-- arguments]\n```\n\n如果不带脚本文件使用，jjs 将读取-执行-打印循环（REPL）启动，这是一个你可以输入命令或表达式的环境。\n\
  \n你可以在本地尝试：\n\n```bash\n $ jjs\n```\n\njjs 的界面所示：\n\n```\n jjs>\n```\n\n现在你可以开始输入了。例如：\n\
  \n```javascript\n jjs> \"Hello World\"\nHello World\n```\n\n这里是另一个例子：\n\n```javascript\n\
  \ jjs> var name = 'Charlie'\n jjs> print('Hello ' + name)\nHello Charlie\n```\n\n\
  这里，这是一个 JavaScript 函数：\n\n```javascript\n jjs> function triple(n) { return 3 * n\
  \ }\nfunction triple(n) { return 3 * n }\n```\n\n调用函数 `triple` 并传递 5 返回 15：\n\n\
  ```javascript\n jjs> triple(5)\n15\n```\n\n当然，你也可以将脚本放在文件中并将其传递给 jjs。假设你有一个名为 `test1.js`\
  \ 的脚本文件，如列表 8.1 所示。\n\n\n\n\n\n### 列表 8.1: `test1.js` 文件\n\n```\n function add(a,\
  \ b) {\n    return a + b;\n}\nvar c = add(10, 20)\nprint(c)\n```\n\n现在，调用 `jjs`\
  \ 并传递 `test1.js`：\n\n```\n $ jjs test1.js\n30\n```\n\n如前所述，`jjs` 可以配合选项使用。表 8.1\
  \ 列出了部分选项。\n\n| 选项 |  |\n| :--- | :--- |\n| `-ccs=size` 或 `--class-cache-size=size`\
  \ | 指定以字节为单位的类缓存大小。字母 `k` 或 `K` 表示千字节，`m` 或 `M` 表示兆字节，`g` 或 `G` 表示字节。默认类缓存大小为 50。\
  \ |\n| `-co` 或 `--compile-only` | 编译脚本但不运行它。 |\n| `-cp` 或 `-classpath` | 指定类路径。此选项可以重复使用以指定多个类路径。\
  \ |\n| `-Dname=value` | 传递系统属性键和值。 |\n| `-d=path` 或 `--dump-debug-dir=path` | 指定用于导出类文件的目录路径。\
  \ |\n| `--debug-lines=true\\|false` | 表明是否在类文件中生成行号表。默认开启此选项。 |\n| `--debug-locals`\
  \ | 在类文件中生成局部变量表。 |\n| `-doe` 或 `--dump-on-error` | 发生错误时提供完整的堆栈跟踪。默认情况下，仅打印简短的错误信息。\
  \ |\n| `--early-lvalue-error` | 将无效的 lvalue 表达式报告为早期错误。 |\n| `--empty-statements`\
  \ | 在 Java 抽象语法树中保留空语句。 |\n| `-fv` 或 `-fullversion` | 打印 Nashorn 的完整版本。 |\n| `--function-statement-error`\
  \ | 当函数声明当作语句使用时打印错误信息。 |\n| `--function-statement-warning` | 当函数声明当作语句使用时打印警告信息。\
  \ |\n| `-fx` | 将脚本作为 JavaFX 启动。 |\n| `-h` 或 `-help` | 打印选项列表及其描述。 |\n| `-Joption`\
  \ | 将 Java 选项传递给 JVM。 |\n| `--lazy-compilation` | 启用懒代码生成。 |\n| `--loader-per-compile`\
  \ | 每次编译创建一个新的类加载器。 |\n| `--log=subsystem:level` | 按指定的级别记录日志。 |\n| `--package=name`\
  \ | 指定生成类的包。 |\n| `--parse-only` | 只解析代码不编译。 |\n| `--print-ast` | 打印代码的抽象语法树。 |\n\
  | `--print-code` | 打印字节码。 |\n| `--print-lower-ast` | 打印降低后的 AST。 |\n| `--print-lower-parse`\
  \ | 打印降低后的解析树。 |\n| `--scripting` | 启用 脚本。 |\n| `--stderr=filename\\|stream\\|tty`\
  \ | 将标准错误流重定向到指定的文件、流或文本终端。 |\n| `--stdout=filename\\|stream\\|tty` | 将标准输出流重定向到指定的文件、流或文本终端。\
  \ |\n| `-v` 或 `-version` | 打印 Nashorn 版本。 |\n| `-xhelp` | 打印命令行选项的扩展帮助。 |\n\n表 8.1：`jjs`\
  \ 选项\n\n你可以使用 `-help` 选项列出所有可用选项：\n\n```\n $ jjs -help\n```\n\n或者使用 `-xhelp` 获取更完整的选项列表：\n\
  \n```\n $ jjs -xhelp\n```\n\n如果你对底层编译器的工作原理好奇，可以尝试 `--print-ast` 和 `--print-code`\
  \ 选项。\n\n```\n $ jjs --print-ast myscript.js\n$ jjs --print-code myscript.js\n```\n\
  \n除了 `jjs` 外，还有另一个工具 `jrunscript`，它可以调用任何符合 JSR 223（“Java 平台脚本语言”）的脚本引擎。在安装了 Java\
  \ 8 且不带任何选项的情况下，`jrunscript` 将调用 Nashorn。\n\n```\n $ jrunscript\nnashorn>\n```\n\
  \n自己尝试一下。\n\n```\n $ jrunscript\nnashorn> print(300 + 700)\n1000\n```\n\n### 在 Java\
  \ 代码中使用 Nashorn\n\n你可以从 Java 代码中运行 JavaScript。但，为什么要这样做呢？一种场景是：你有复杂的 JavaScript\
  \ 函数，不想在 Java 中重写它们。\n\n要要在 Java 中调用 Nashorn，请使用 `javax.script` 包。`ScriptEngine`\
  \ 接口的 `eval` 方法会评估 JavaScript 脚本并将结果作为 `java.lang.Object` 返回。`eval` 的多个重载版本允许你传递\
  \ `String` 或 `Reader`。\n\n```\n public java.lang.Object eval(java.lang.String script)\
  \ \n        throws ScriptException\npublic java.lang.Object eval(java.io.Reader\
  \ scriptFile)\n        throws ScriptException\n```\n\n你可以使用 `ScriptEngineManager`\
  \ 的 `getEngineByName` 方法获取 `ScriptEngine` 实现类：\n\n```\n ScriptEngineManager factory\
  \ = new ScriptEngineManager();\nScriptEngine engine = factory.getEngineByName(\"\
  nashorn\");\n```\n\n例如，列表 8.2 中的 `ScriptEngineDemo1` 类获取了一个 `ScriptEngine` 并运行了一个小的\
  \ JavaScript 脚本。\n\n### 列表 8.2：`ScriptEngineDemo1` 类\n\n```\n package nashorn.fromjava;\n\
  import javax.script.ScriptEngine;\nimport javax.script.ScriptEngineManager;\n\n\
  public class ScriptEngineDemo1 {\n    public static void main(String[] args) {\n\
  \        ScriptEngineManager factory = new ScriptEngineManager();\n        ScriptEngine\
  \ engine = factory.getEngineByName(\"nashorn\");\n        Object result = engine.eval(\"\
  300 + 700\");\n        System.out.println(result);\n    }\n}\n```\n（注：8.2 的源代码在提示中是部分片段化的，已根据所提供的上下文进行了重构）。\n\
  \n### 在 JavaScript 中调用 Java\n\n你可以从 Java 代码中运行 JavaScript。但，为什么要这样做呢？一种场景是：你有复杂的\
  \ JavaScript 函数，不想在 Java 中重写它们。\n\n要要在 Java 中调用 Nashorn，请使用 `javax.script` 包。`ScriptEngine`\
  \ 接口的 `eval` 方法会评估 JavaScript 脚本并将结果作为 `java.lang.Object` 返回。`eval` 的多个重载版本允许你传递\
  \ `String` 或 `Reader`。\n\n```\n public java.lang.Object eval(java.lang.String script)\
  \ \n        throws ScriptException\npublic java.lang.Object eval(java.io.Reader\
  \ scriptFile)\n        throws ScriptException\n```\n\n你可以使用 `ScriptEngineManager`\
  \ 的 `getEngineByName` 方法获取 `ScriptEngine` 实现类：\n\n```\n ScriptEngineManager factory\
  \ = new ScriptEngineManager();\nScriptEngine engine = factory.getEngineByName(\"\
  nashorn\");\n```\n\n例如，列表 8.2 中的 `ScriptEngineDemo1` 类获取了一个 `ScriptEngine` 并运行了一个小的\
  \ JavaScript 脚本。\n\n### 列表 8.3：评估文件\n\n```java\n package nashorn.fromjava;\nimport\
  \ java.io.FileReader;\nimport java.io.FileNotFoundException;\nimport javax.script.ScriptEngine;\n\
  import javax.script.ScriptEngineManager;\nimport javax.script.ScriptException;\n\
  \npublic class ScriptEngineDemo2 {\n    public static void main(String[] args) throws\
  \ ScriptException {\n        ScriptEngineManager factory = new ScriptEngineManager();\n\
  \        ScriptEngine engine = factory.getEngineByName(\"nashorn\");\n        Object\
  \ result = engine.eval(new FileReader(\"test1.js\"));\n        System.out.println(result);\n\
  \    }\n}\n```\n（注：提供的文本存在大量重叠和片段化。上述结构遵循文档的逻辑意图）。\n\n### 列表 8.4：在 JavaScript 使用\
  \ Java\n\n```javascript\n var path = java.nio.file.Paths.get(\"sales.txt\");\n var\
  \ lines = java.nio.file.Files.lines(path);\nprint(\"Total: \" + lines.mapToDouble(function(s)\
  \ {return parseFloat(s)})\n        .sum());\n\n// lines 流已关闭，所以我们需要重新打开\nlines =\
  \ java.nio.file.Files.lines(path);\nprint(\"Average: \" + lines.mapToDouble(function(s)\
  \ {return parseFloat(s)})\n        .average().getAsDouble());\n```\n\n### 列表 8.5：等效的\
  \ Java 代码\n\n```java\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\
  import java.nio.file.Files;\nimport java.util.stream.DoubleStream;\nimport java.util.stream.Stream;\n\
  \npublic class Main {\n    public static void main(String[] args) throws Exception\
  \ {\n        Path path = Paths.get(\"sales.txt\");\n        Stream<String> lines\
  \ = Files.lines(path);\n        DoubleStream ds = lines.mapToDouble(a -> Double.parseDouble(a));\n\
  \        System.out.println(\"Total: \" + ds.sum());\n\n        lines = Files.lines(path);\n\
  \        ds = lines.mapToDouble(a -> Double.parseDouble(a));\n        System.out.println(\"\
  Average: \" + ds.average().getAsDouble());\n    }\n}\n```\n\n\n\n\n\nNashorn 的另一个有趣特性是它能够编写\
  \ JavaFX 脚本。你只需要在 JavaScript 文件中编写一个 `start` 函数。该 `start` 函数必须接受一个参数，该参数将作为应用程序的主\
  \ `Stage` 。\n\n考虑列表 8.6 中的代码。\n\n### 列表 8.6：一个 JavaFX 脚本 (`test1.js`)\n\n```\nfunction\
  \ start(stage) {\n    stage.title = \"Scripting JavaFX\";\n    var button = new\
  \ javafx.scene.control.Button();\n    button.text = \"Click Me!\";\n    button.onAction\
  \ = function() {\n    \tprint(\"Thank you!\");\n    }\n    var root = new javafx.scene.layout.StackPane();\n\
  \    root.children.add(button);\n    stage.scene = new javafx.scene.Scene(root,\
  \ 400, 200);\n    stage.show();\n}\n```\n\n要执行 JavaFX 脚本，你必须使用 `-fx` 选项调用 `jjs`：\n\
  \n```\njjs -fx test1.js\n```\n\n图 8.1 显示了运行 `test1.js` 脚本时创建的 JavaFX 。\n\n![](img/0801.png)\n\
  \n图 8.1：编写 JavaFX\n\n### 使用 Nashorn 替代 Shell 脚本\n\nLinux 硬核粉丝通常精通 Linux 命令。然而，如果你的\
  \ Linux 技能仅限于 `whoami` 和 `ls` 等最基础的命令，你可以利用 Nashorn。Nashorn 允许你调用 Linux 命令并处理结果。\n\
  \n要在 Nashorn 中执行 Linux 命令，请调用 `jjs` 并用反引号（`` ` ``）括起命令。在键盘上，该字符通常位于数字 `1` 的左侧。例如，要列出当前目录的内容，可以使用以下命令。\n\
  \n```\njjs> `ls -al`\n```\n\n使用 Nashorn 调用 Linux 命令的优势在于你可以处理输出内容。例如，以下代码调用了 `cat`\
  \ 命令打印 `Demo.java` 文件并添加行号。\n\n```\njjs> var lines = `cat Demo.java`.split('\\n');\n\
  jjs> var i = 1;\njjs> for each (line in lines) { print(i++ + '\\t' + line) };\n\
  ```\n\n结果如下所示。\n\n```\n1\tpackage nashorn.scripting;\n2\t\n3\tpublic class Demo\
  \ {\n4\t\tpublic static void main(String[] args) {\n5\t\t\tSystem.out.println(\"\
  This is a demo\");\n6\t\t}\n7\t}\n8 \n```\n\n另一个例子是，以下脚本可以逐行显示长文档。这可以避免在打印长手册时像往常那样需要回滚到文档开头。\n\
  \n```\njjs> var System = java.lang.System\njjs> var lines = `man pwd`.split('\\\
  n')\njjs> for each (line in lines) {System.out.print(line); System.in.read()}\n\
  ```\n\n按回车键显示下一行文本。\n\n### 总结\n\nNashorn 是 Java 8 中一个新的 JavaScript 引擎。它不仅允许你从 Java\
  \ 代码执行 JavaScript，还带有高级功能，用于编写 JavaFX 应用程序以及处理 Linux 命令的输出。\n\n"
