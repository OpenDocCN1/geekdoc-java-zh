  mdcn: "\n\n## 高级 Java\n\n本质上，任何 Java 类只要实现一个单一接口：`javax.annotation.processing.Processor`，就可以变成一个完整的注解处理器。然而，为了发挥作用，`javax.annotation.processing.Processor`\
    \ 的每个实现都必须提供一个公共构造函数（更多细节请参阅本教程的第一部分，*如何创建和销毁对象*），该构造函数可用于实例化处理器。处理基础设施将遵循一套规则来与注解处理器交互，处理器必须遵守这些规则：\n\
    \n- 注解处理器的实例是通过处理器类的无参构造函数创建的\n- 在调用 `init` 方法时，会 传入一个合适的 `javax.annotation.processing.ProcessingEnvironment`\
    \ 实例\n- 调用 `getSupportedAnnotationTypes`、`getSupportedOptions` 和 `getSupportedSourceMethods`（这些方法在每次运行期间仅被调用一次，而不是每次都调用）\n\
    - 最后，根据情况调用 `javax.annotation.processing.Processor` 上的 `process` 方法（请注意，每轮处理不会为创建一个新的注解处理器）\n\
    \nJava 文档强调，如果创建注解处理器且没有遵循上述协议，则处理器的行为将不受此接口规范定义。\n\n## 14.4 编写自己的注解处理器\n\n我们将开发几种类型的注解处理器，从最简单的不可变性检查器开始。让我们定义一个简单的注解\
    \ `Immutable`，我们将用它来标记类，以确保其不允许修改状态。\n\n```java\n@Target(ElementType.TYPE)\n@Retention(Retention.CLASS)\n\
    public interface Immutable {\n```\n\n按照策略，该注解将在 Java 编译器的编译阶段被保留，它在运行时将不可用（且不应该）可用）。\n\
    \n正如我们在教程第 3 部分 *如何设计类和接口* 中所知，在 Java 中实现不可变性是困难的。为了保持简单，我们的注解处理器将验证所有类是否都声明为\
    \ `final`。幸运的是，Java 库提供了一个抽象注解处理器 `AbstractProcessor`，它被设计为大多数具体注解处理器的基础。我们可以使用\
    \ `SimpleAnnotationProcessor`来实现\n\n```java\n@SupportedAnnotationType(\"com.javgeeks.advanced.processor.Immutable\"\
    )\n@SupportedSourceVersion(SourceVersion.RELEASE_7)\npublic class SimpleAnnotationProcessor\
    \ extends AbstractProcessor {\n    @Override\n    boolean process(Set<? extends\
    \ TypeElement> annotations, RoundEnv env) {\n        for (Element element : env.getElementsAnnotatedWith(Immutable.class))\
    \ {\n            if (element instanceof TypeElement) {\n                TypeElement\
    \ typeElement = (TypeElement) element;\n                for (Element enclosedElement\
    \ : typeElement.getEnclosedElements()) {\n                    if (enclosedElement\
    \ instanceof VariableElement) {\n                        VariableElement variableElement\
    \ = (VariableElement) enclosedElement;\n                        if (!variableElement.getModifiers().contains(Modifier.FINAL))\
    \ {\n                            env.getMessage().printMessage(Diagnostic.Kind.ERROR,\n\
    \                                String.format(\"Class %s is annotated as @Immutable,\
    \ but field %s is not declared as final\",\n                                typeElement.getSimpleName(),\
    \ variableElement.getName()));\n                        }\n                  \
    \  }\n                }\n            }\n        }\n        return true;\n    }\n\
    }\n```\n\n```java\ntypeElement.getSimpleName(), variableElement.getSimpleName()\n\
    )\n}\n// 声明注解已由处理器处理\nreturn true;\n```\n\n`SupportedAnnotationTypes` 可能是定义注解处理的是哪种注解最重要的细节。在这里可以使用\
    \ `*` 来处理所有可用的注解。\n\n由于提供的脚手架，我们的 `SimpleAnnotationProcessor` 必须实现一个单一的方法，其实现非常直观，基本上是验证是否有任何字段在没有\
    \ `final` 修饰符的情况下被声明。让我们来看一个违反原生不可变性约的类示例。\n\n```java\n@Immutable\npublic class\
    \ MutableClass {\n    private String name;\n\n    public MutableClass(final String\
    \ name ) {\n        this.name = name;\n    }\n\n    public String getName() {\n\
    \        return name;\n    }\n}\n```\n\n针对此类运行 `SimpleAnnotationProcessor` 将在控制台上输出以下错误：\n\
    `'MutableClass' is annotated as @Immutable, but field 'name' is not declared as\
    \ final`\n\n因此证实了注解处理器成功检测到了在可变类上误用 `Immutable` 注解的行为。\n\n在很大程度上，某些内省（代码生成）是注解处理器使用最频繁的领域。我们可以稍微使用该类并从教程第\
    \ 13 部分 *Java 编译器 API* 中了解一些 Java 编译器 API。我们这次要编写的注解处理器通过添加 `final` 字段来改变（或修改）生成的代码，以确保这一结果不会被遗漏。\n\
    \n```java\n@SupportedAnnotationTypes(\"com.javgeeks.advanced.processor.Immutable\"\
    )\n@SupportedSourceVersion(SourceVersion.RELEASE_7)\npublic class MutableProcessor\
    \ extends AbstractProcessor {\n    private Trees trees;\n\n    @Override\n   \
    \ public void init(ProcessingEnvironment processingEnv) {\n        super.init(processingEnv);\n\
    \        trees = Trees.instance(processingEnv);\n    }\n\n    @Override\n    public\
    \ boolean process(Set<? extends TypeElement> annotations, RoundEnvironment roundEnv)\
    \ {\n        final TreePathScanner<Object, CompilationUnitTree> scanner =\n  \
    \          new TreePathScanner<Object, CompilationUnitTree>() {\n            \
    \    @Override\n                public void visitClass(final ClassTree classTree,\
    \ CompilationUnitTree unitTree) {\n                    if (unitTree instanceof\
    \ JCompilationUnit) {\n                        final JCompilationUnit compilationUnit\
    \ = (JCompilationUnit) unitTree;\n\n                        // 只对从源码编译的文件进行处理\n\
    \                        if (compilationUnit.getSourceFile().Kind() == Kind.SOURCE)\
    \ {\n                            compilationUnit.accept(new TreeTranslator() {\n\
    \                                @Override\n                                public\
    \ void visitVarDef(final VariableTree tree) {\n                              \
    \      super.visitVarDef(tree);\n\n                                    if ((tree.getModifiers()\
    \ & Flags.FINAL) == 0) {\n                                        tree.setFlags(Flags.FINAL);\n\
    \                                    }\n                                }\n  \
    \                          });\n                        }\n                  \
    \  }\n                }\n            };\n\n        for(final Element element :\
    \ roundEnv.getElementsAnnotatedWith(Immutable.class)) {\n            final TreePath\
    \ path = trees.getPath(element);\n            scanner.scan(path, path.getCompilationUnit());\n\
    \        }\n        return true;\n    }\n}\n```\n\n实现变得更加复杂，但许多类（如 `TreePath`）应该已经就绪了。在同一个\
    \ `MutableClass` 上运行注解处理器将生成体代码（可以通过 `javac -p MutableClass.class` 进行验证）。\n\n\
    ```java\npublic class com.javacodeeks.advanced.processor.examples.MutableClass\
    \ {\n    private final java.String name;\n    public com.javacodeeks.advanced.processor.examples.MutableClass(java.String\
    \ name);\n    public java.String getName();\n}\n```\n\n确实，name 存在 final 字段，尽管它在原始文件中被省略了。我们的最后一个示例将展示注解处理器的代码生成能力（并讨论相关内容）。在这种情况下，我们实现了一个注解处理器，通过标记带有\
    \ `@Immutable` 的合适类来生成新的源文件（分别生成新的类）。\n\n"
