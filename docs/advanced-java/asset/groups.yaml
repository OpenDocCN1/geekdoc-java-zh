    \ implements Serializable, Runnable {\n    @Override\n    public void run() {\n\
    \        // Some implementation\n    }\n}\n```\n\nWithout using generics, the\
    \ straightforward solution is to introduce intermediate interface (or use the\
    \ pure Object as a last resort), for example:\n\n```java\n// The class itself\
    \ should be modified to use the intermediate interface\n// instead of direct implementations\n\
