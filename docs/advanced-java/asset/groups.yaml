    \ more come in part 14 of the tutorial, Annotation Processors) and is split between\
    \ three packages, shown below.\n\n+   * javax.annotation.processing :Annotation\
    \ processing.\n* java.lang.Model : Language model used in annotation processing\
    \ and Compiler Tree API (including Java language elements, types and utility classes).\n\
    * java.tools.tools : Java Compiler API itself.\n\nOn the other side, the Java\
    \ Compiler Tree API is hosted by the com.sun.source package and following Java\
    \ standard library naming conventions, is considered to be non-standard (proprietary\
    \ or internal). In general, these APIs are not very well documented or could change\
    \ any time. Moreover, they are tied to the particular JDK/JRE version and may\
    \ limit the portability of applications which use.\n\n# 13.2 Java Compiler API\n\
    \nOur exploration will start from the Java Compiler API, which is quite well documented\
