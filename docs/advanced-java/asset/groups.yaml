    # Chapter 12


    # Dynamic languages support


    # 12.1 Introduction


    In this part of the tutorial our attention will be fully concentrated on the scripting
    and dynamic languages support in Java. Since Java 7, the JVM has a direct support
    of modern dynamic (also called scripting) languages and the Java 8 release delivered
    even more enhancements into this space.


    One of the strength of the dynamic languages is that the behavior of the program
    is defined at runtime, rather than at compile time. Ruby (https://www.ruby-lang.org/),
    Python (https://www.python.org/) and JavaScript (http://en.wikipedia.org/wiki/JavaScript)
    have gained a lot of popularity and are the most widely used ones the moment.
    We are going to take a look on how Java scripting API opens a way to integrate
    these languages into existing Java applications.


    # 12.2 Dynamic Languages Support


    As we already know well, Java is a statically typed language. For class, its members
    parameters and return values are available at compile time. Using all these details,
    the Java compiler ensures typed code which can then be efficiently interpreted
    by the JVM at runtime.


    However, dynamic languages perform type checking at runtime, rather than compile
    time. The challenge of dealing dynamic languages is how to implement a runtime
    system that can choose the most appropriate implementation of a method to call
    after the program has been compiled.


    For a long time, the JVM had no special support for dynamically typed languages.
    But Java 7 introduced the new invokedynamic instruction that enabled the runtime
    system (JVM) to control the linkage between a call site (where the method is being
    called) and a method implementation. It really opened a door for effective dynamic
    languages support and implementations on JVM platform.


    # 12.3 Scripting API


    As of the Java 6 release in 2006, the new scripting API has been introduced through
    the javax.script package. This extensible API was designed to plug in any scripting
    language (which provides the script engine implementation) and run on JVM platform.


    Under the hood, the Java scripting API is relatively small and quite cute. The
    initial step to begin working with scripting API is to create a new ScriptEngineManager
    class. ScriptEngineManager provides the capability to discover and retrieve available
    engines by their names from the running classpath.


    Each scripting engine is represented using a respective ScriptEngine implementation
    and provides the ability to execute the scripts using eval() functions (which
    have multiple overloaded versions). Quite number of popular scripting (dynamic)
    languages already provide support of the Java scripting API and in the next sections
    of this tutorial we will see how this API works in practice by playing with JavaScript,
    Groovy, Ruby/JRuby and Python/Jython.'
