    # Advanced java


    # 12.4 JavaScript on JVM


    It is not by accident we are going to start our journey with the JavaScript language
    as it was the one of the first scripting languages supported by the Java standard
    library scripting API. And also, by large, it is the single programming language
    every we web browser understands.


    In its simplest form, the eval() function executes the script, passed as a plain
    Java string. The script has no state shared with the evaluator (caller) and is
    self-contained piece of code. However, in real-world applications it is quite
    rare and more often than not variables or properties are required to be the script
    in order to perform some meaningful calculations or actions. With that being said,
    let us take a look at a quote evaluating JavaScript function call using simple
    variables:


    ```

    final ScriptEngineManager factory = new ScriptEngineManager();

    final ScriptEngine engine = factory.getByName("JavaScript");


    Bindings bindings = engine.createBindings();

    bindings.put("str", "Calling JavaScript");

    bindings.put("engine", engine);

    ```


    ```

    engine.eval("print(str + '' from '' + engine.getClass().getSimpleName())", bindings);

    ```


    Once executed, the output will be printed on the console:


    Calling JavaScript fromNashornScriptEngine


    For a while, Rhino used to be the single JavaScript scripting engine, on JVM.
    But the Java 8 release brought a brand-new-Nashorn-j2126511.html (http://www.oracle.com/technetwork/network/java/j14-nashorn-j2126511.html).


    From the API standpoint, there are not many differences the however implementation
    differs significantly, promising much better performance. Here is the example
    rewrite to use Nashorn JavaScript:


    ```

    final ScriptEngineManager factory = new ScriptEngineManager();

    final ScriptEngine engine = factory.getByName("Nashorn");


    Bindings bindings = engine.createBindings();

    bindings.put("engine", engine);

    ```


    ```

    engine.eval("print(str + '' from '' + engine.getClass().getSimpleName())", bindings);

    ```


    The following output will be printed on the console (please note a different script
    engine in this time):


    Calling JavaScript fromNashornScriptEngine


    Nonetheless, the example of JavaScript code snippets we have looked at are quite
    trivial. You could actually evaluate JavaScript files using overloaded eval()
    function and implement quite sophisticated algorithms, purely in JavaScript. In
    the next sections we are going to see these examples while exploring other languages.


    # 12.5 Groovy on JVM


    Groovy (http://groovy.org) is one of the most dynamic languages for the JVM platform.
    By side with Java, it also provides the JavaScript API engine implementation and
    could be used in a similar way as a JavaScript.


    Let us make this Groovy example a bit more meaningful and interesting by developing
    a small standalone script which prints out on the console some details about the
    collection shared with its calling Java application.


    The Book class is simple and has only two properties, author and title:'
