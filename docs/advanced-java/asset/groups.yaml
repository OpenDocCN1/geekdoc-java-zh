    # 5.8 When to use enums


    Since Java 5 enums are the only recommended way to represent and display with
    the fixed set of constants. Not only are they strongly-typed, but they are also
    extensible and supported by any modern library or framework.


    # 5.9 Annotations as special interfaces


    As mentioned before, annotations are the syntactic sugar used to associate the
    metadata with different elements of Java language. Annotations do not have any
    direct effect on the code they are annotating. However, depending on the annotations
    and how they are defined, they may be used by Java compiler (the great example
    of that is the @Override annotation which we have seen in the part **3** of the
    tutorial, by annotation processors (details to come in the Annotation processors
    section) and by code at runtime using reflection and other inspection techniques
    (more than about that in the part **11** of the tutorial, **Reflection and dynamic
    languages support**).


    Let us look at a simple annotation declaration:


    ```

    public interface SimpleAnnotation {

    }

    ```


    The @interface introduces new annotation type. This is why annotations could be
    treated as specialized interfaces. Annotations declare the attributes with or
    without default values, for example:


    ```

    public interface SimpleAnnotationWithAttributes {

    String name();

    int order() default 0;

    }

    ```


    If an annotation defines an attribute without a default value, it should be provided
    in all places the annotation is applied. For example:


    ```

    @SimpleAnnotationWithAttributes(name = "new annotation");

    ```


