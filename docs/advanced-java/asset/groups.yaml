    \ blocks: %d\", scanner.getNumberOfEmptyTryBlocks());\n```\n\nOnce run against\
    \ multiple source files, the code snippet above is going to print the following\
    \ output in the console:\n\nEmpty try/catch blocks: 1\n\nThe Java Compiler Tree\
    \ API may look a bit low-level and it certainly is. Plus, being an internal API\
    \ it does not have well-supported documentation availability. However, it gives\
    \ the full access to the abstract syntax trees and it is a life-saver when you\
    \ need to perform deep source code analysis and post-processing.\n\n## 13.6 Download\n\
    \nThis was a lesson for the Java Compiler API, part 13 of Advanced Java Course.\
    \ You can download the source code of the lesson here: advanced-java-part-13\n\
    \n## 13.7 What's next\n\nIn this part of the tutorial we will have programmatic\
    \ access to Java Compiler API within the Java applications. We also do deeper,\
    \ touched annotation processors and uncovered Java Compiler Tree API which provides\
    \ the full access to syntax trees of the Java source files being compiled (compilation\
    \ units). In the next part of the tutorial we are going to continue and take a\
    \ closer look at annotation processors.\n\n# Chapter 14\n\n# Annotation Processors\n\
    \n## 14.1 Introduction\n\nIn this part of the tutorial we are going to demystify\
    \ the magic of annotation processing, which is often used to inspect, modify or\
    \ generate source code, driven only by annotations. Essentially, annotation processors\
    \ are some kind of plugins of the Java compiler. Annotation processors used wisely\
    \ could significantly simplify the life of Java developers so that is why they\
    \ are often bundled with many libraries and frameworks.\n\nBeing compiler plugins\
    \ also means that annotation processors are a bit low-level and highly depend\
    \ on the version of Java. However, the knowledge about annotations from the part\
    \ 5 of the tutorial and Java Compiler API from the part 13 is going to be very\
    \ handy in the understanding intrinsic details of how annotation processors work.\n\
    \n## 14.2 When to Use Processors\n\nAs we briefly mentioned, annotation processors\
    \ are typically used to inspect the codebase against the presence of annotations\
    \ and, on depending case, to:\n\n- generate a set of source or resources files\n\
    - mutate (modify) the existing source code\n- analyze the existing source code\
    \ and generate diagnostic messages\n\nThe usefulness of annotation processors\
    \ is overhyped. They can significantly reduce the amount of code which developers\
    \ have to write (by generating or modifying one), or by doing static analysis,\
    \ hint the developers if the assumptions expressed by a particular annotation\
    \ are not being held.\n\nBeing somewhat inevitable to developers, annotation processors\
    \ are supported by all modern Java IDEs and popular building tools and generally\
    \ do not any particular intrusion. In the next section of the tutorial we are\
    \ going to build own an annotation processor which nonetheless will show the full\
    \ power of this Java compiler feature.\n\n## 14.3 Annotation Processing Under\
    \ the Hood\n\nBefore diving into implementation of our own annotation processors,\
    \ it is good to know the mechanics of that. Annotation processing happens in a\
