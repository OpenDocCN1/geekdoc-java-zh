    \nDependency injection (also known as inversion of control) is considered a good\
    \ practice for class designers: if some class instance depends on the other class\
    \ instances, those dependencies should be provided (injected) to by means of constructors\
    \ (or settings, etc.) but not by the instance itself. Let us consider the following\
    \ example:\n\n```\npackage com.javagecode.advanced.construction.patterns;\n\n\
    import java.text.DateFormat;\nimport java.util.Date;\n\npublic class Dependent\
    \ {\n    private final DateFormat format = DateFormat.getInstance();\n\n    public\
    \ String format(final Date date) {\n        return format.format(date);\n    }\n\
    }\n```\n\nThe class needs needs its DateFormat and it creates one by calling DateFormat.getInstance()\
    \ at construction time. The best design would be to use constructor argument to\
    \ do the same thing:\n\n```\npackage com.javagecode.advanced.construction.patterns;\n\
    \nimport java.text.DateFormat;\nimport java.util.Date;\n\npublic class Dependent\
    \ {\n    private final DateFormat format;\n\n    public Dependent(final DateFormat\
    \ format) {\n        this.format = format;\n    }\n\n    public String format(final\
    \ Date date) {\n        return format.format(date);\n    }\n}\n```\n\nIn this\
    \ case class has all its dependencies provided from outside and it would be very\
