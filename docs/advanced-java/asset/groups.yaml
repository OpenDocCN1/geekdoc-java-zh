    \ {\n            return false;\n        }\n    },\n    TUESDAY() {\n        @Override\n\
    \        public boolean isWeekend() {\n            return false;\n        }\n\
    \    },\n    WEDNESDAY() {\n        @Override\n        public boolean isWeekend()\
    \ {\n            return false;\n        }\n    },\n    THURSDAY() {\n        @Override\n\
    \        public boolean isWeekend() {\n            return false;\n        }\n\
    \    },\n    FRIDAY() {\n        @Override\n        public boolean isWeekend()\
    \ {\n            return false;\n        }\n    },\n    SATURDAY() {\n        @Override\n\
    \        public boolean isWeekend() {\n            return true;\n        }\n \
    \   },\n    SUNDAY() {\n        @Override\n        public boolean isWeekend()\
    \ {\n            return true;\n        }\n    }\n};\n```\n\nThe way we have implemented\
    \ the interface is bit verbose, however it is certainly possible to make it better\
    \ by combining instance fields and interfaces. For example:\n\n```java\npublic\
    \ enum DaysOfWeekFields implements DayOfWeek {\n    MONDAY (false),\n    TUESDAY\
    \ (false),\n    WEDNESDAY (false),\n    THURSDAY (false),\n    FRIDAY (false),\n\
    \    SATURDAY (true),\n    SUNDAY (true);\n\n    private final boolean isWeekend;\n\
    \n    DaysOfWeekFields(final boolean isWeekend) {\n        this.isWeekend = isWeekend;\n\
    \    }\n\n    @Override\n    public boolean isWeekend() {\n        return isWeekend;\n\
    \    }\n}\n```\n\nBy supporting instance fields and interfaces, enums are used\
    \ in more object-oriented way, bringing some level of abstraction to rely upon.\n\
    \n## 5.5 Enums and generics\n\nAlthough it is not visible from first glance, there\
    \ is relation between enums and generics. Every single enum in Java is automatically\
    \ inherited from the generic Enum<T> class where T is the enum type itself. The\
    \ Java compiler does this transformation on behalf of the developer, expanding\
    \ enum declaration to something like:\n\n```java\npublic enum DayOfTheWeek extends\
    \ Enum<T> {\n    // Other declarations\n}\n```\n\nIt also explains why enums can\
    \ implement interfaces but cannot extend other classes: they implicitly extend\
    \ Enum<T> as we know from part 2 of the tutorial. The fact that every enum Enum<T>\
    \ allows to define generic classes, interfaces and methods which the instances\
    \ of enums use as arguments or parameters. For example:\n\n```java\npublic <T\
    \ extends Enum<?>> void performAction(T instance) {\n    // Perform some action\
    \ here\n}\n```\n\n## 5.6 Convenient Enums methods\n\nThe base Enum<T> class provides\
    \ a couple of helpful methods that are automatically inherited by every enum instance.\n\
    \n### Table 5.1: (continued)\n\n| Method | Description |\n| :--- | :--- |\n| String\
    \ name() | Returns the name of this enum constant, exactly as declared in its\
    \ declaration. |\n| int ordinal() | Returns the ordinal of this enumeration constant\
    \ (its position in its enum declaration, where the initial constant is assigned\
    \ an ordinal of zero). |\n\nAdditionally, Java compiler automatically generates\
    \ two more helpful `static` methods for every enum type it encounters (let refer\
    \ to the enum type as T).\n\n### Table 5.2:\n\n| Method | Description |\n| :---\
    \ | :--- |\n| T[] values() | Returns all the declared constants for the enum T.\
    \ |\n| T valueOf(String name) | Returns the enum constant T with the specified\
    \ name. |\n\nBecause of the presence of these methods and worker, there is one\
    \ more benefit of using enums in your code: they can be used in switch/case statements.\
    \ For example:\n\n```java\npublic void performAction(DaysOfWeek instance) {\n\
    \    switch (instance) {\n        case MONDAY:\n            // Do something\n\
    \            break;\n        case TUESDAY:\n            // Do something\n    \
    \        break;\n        // Other enum constants here\n    }\n}\n```\n\n## 5.7\
    \ Specialized Collections: EnumSet and EnumMap\n\nInstances of enums, like other\
    \ classes, can be used with the standard Java collection library. However, certain\
    \ collections have been optimized for enums specifically and are recommended in\
    \ most cases to use instead of general-purpose counterparts.\n\nWe are going to\
    \ look into two specialized collection types: EnumSet<T> and EnumMap<T>. Both\
    \ are very easy to use and we are going to start with EnumSet<T>.\n\nThe EnumSet<T>\
    \ is the regular set optimized to store enums. Interestingly, EnumSet<T> cannot\
    \ be instantiated using constructors and provides a lot of helpful factory methods\
    \ instead (we have covered factory pattern in part 1 of the tutorial, How to create\
