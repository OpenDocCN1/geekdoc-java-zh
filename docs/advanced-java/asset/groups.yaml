    # 9.10 Using Synchronization Wisely


    Locking and synchronized keyword are powerful instruments which help to keep the
    data model and state consistent in multithreaded applications. However, using
    them wisely causes contention and could decrease application performance. From
    the other side, not using synchronization primitives (and may will) lead to a
    weird program state and corrupted data eventually causes application to crash.
    So the balance is important.


    The advice is to use locks or/and synchronized where it is really necessary. While
    doing so, make sure that the locks are released as soon as possible, and the execution
    blocks requiring locking or synchronization are kept minimal. Techniques should
    at least help to reduce the contention but will not eliminate it.


    In recent years, the use of lock-free algorithms and data structure have emerged
    (f.e., atomic operations in Java from Atomic Operations), which may provide better
    performance compared to the equivalent implementations which are built using synchronization
    primitives.


    It is good to know that JVM has a couple of runtime optimizations in order to
    eliminate the locking when it is not necessary. The most is biased locking: an
    optimization that improves uncontended synchronization performance by eliminating
    operations with the Java synchronization primitives (for more details, refer to
    http://www.oracle.com/-technology/java/6-performance-137236.html#2.1.1).


    Nevertheless JVM does not, eliminating the unnecessary synchronization in the
    application is much better. Excessive use of synchronization has a negative impact
    on application performance as threads will be wasting expensive CPU cycles competing
    for resources instead of doing real work.


    # 9.11 Wait/Notify


    Prior to the introduction of the concurrency utilities in the Java standard library
    (java.util.concurrent), the usage of Object''s wait ( /notify() /notifyAll() methods
    was the way to establish communication between threads in Java. All these methods
    must be called if the thread monitors on the object in question. For example:'
