    \ Java 8 features, in particular lambdas. However we have not looked deeply into\
    \ practical use cases and exceptions are one of them.\nWith unexpected exceptions\
    \ worked as expected, however Java's lambda syntax does not allow specify the\
    \ checked exceptions (unless they are defined by @FunctionalInterface itself)\
    \ which may be thrown. The following snippet will not work with a compilation\
    \ error *Unhandled type exception* (which could be thrown at line 03);\n\n```\n\
    public void readFile() {\nrun(() -> {\n    Files.readAllBytes(new File(\"some.txt\"\
    ).toPath());\n}\n}\n```\n\n```\npublic void run(final Runnable runnable ) {\n\
    runnable.run();\n}\n```"
  - "[PAGE 75]\n\n# Advanced java\n\nThe only solution right now is to catch the IOException\
    \ exception inside lambda function body and re-throw the appropriate RuntimeException\
    \ (not forgetting to pass the original exception as a cause), for example:\n\n\
    ```\npublic void readFile() {\n  run(() -> {\n    try {\n      Files.readAllBytes(new\
    \ File(\"some.txt\").toPath());\n    } catch (final IOException ex) {\n      throw\
    \ new RuntimeException(\"Error reading file\", ex);\n    }\n  });\n}\n```\n\n\
    Many functional interfaces are declared with the ability to throw any Exception\
    \ from its implementation but if not (Runnable), wrapping (or catching) the checked\
    \ exceptions into unchecked is the only way to go.\n\n# 8.6 Standard Java exceptions\n\
    \nThe library provides plenty of exception classes which are designated to cover\
    \ most of the generic errors during programming during. The most widely used are\
    \ presented in the table below, please consider those before defining your own.\n\
    \n| Exception Class | Purpose |\n|---|---|\n| NullPointerException | Attempts\
    \ to use null in a case where an object is required. |\n| IllegalArgumentException\
    \ | Method has been passed an illegal or inappropriate argument. |\n| IllegalStateException\
    \ | Method has been invoked at an illegal or inappropriate time. |\n| IndexOutOfBoundsException\
    \ | Index of some sort (such as to an array, to a string, or to a vector) is out\
    \ of range. |\n| UnsupportedOperationException | Requested operation is not supported.\
    \ |\n| ArrayIndexIndexOfBoundsException | An array has been accessed with an illegal\
    \ index. |\n| ClassCastException | Code has attempted to cast an object to a subclass\
    \ of which it is not an instance. |\n| EnumConstantNotPresentException | Attempt\
    \ to access an enum constant by name and the enum type contains no constant with\
    \ the specified name (enums have been covered in the part 5 of the tutorial, How\
    \ and when to use enum)\nEnums and Annotations. |\n| FormatException | Attempts\
    \ to convert a string to one of the numeric types, but that the string does not\
    \ have the appropriate format. |\n| StringIndexOutOfBoundsException | Index is\
    \ negative or greater than the size of the string. |\n| IOException | I/O exception\
    \ of some sort has occurred. This is the general class of exceptions produced\
    \ by failed or interrupted I/O operations. |\n\nFigure 8.1: advanced-java-standard-exceptions\n\
    \n# 8.7 Defining your exceptions\n\nThe Java language makes it very easy to define\
    \ exception classes. Carefully designed exception hierarchies allow to implement\
    \ detailed and fine-grained erroneous conditions management and reporting. As\
    \ always, finding the right balance is very important: too many exceptions may\
    \ complicate the development and blow the amount of code caught in exception or\
    \ propagating them down the stack."
  - "[PAGE 76]\n\n# Advanced java\n\nIt is strongly advised that all user-defined\
    \ exceptions should be inherited from RuntimeException class and fall into the\
    \ class of unchecked exceptions (however, there are exclusions from the rule).\
    \ For example, let us define exception to dial with authentication:\n\n```\npublic\
    \ class NotAuthenticatedException extends RuntimeException {\n    private static\
    \ final long serialVersionUID = 207923538133605509L;\n\n    public NotAuthenticatedException()\
    \ {\n        super();\n    }\n\n    public NotAuthenticatedException(final String\
    \ message) {\n        super(message);\n    }\n\n    public NotAuthenticatedException(final\
    \ String message, final Throwable cause) {\n        super(message, cause);\n \
    \   }\n}\n```\n\nThe purpose of this exception is to signal about non-username\
    \ or invalid user credentials during sign-in process, for example:\n\n```\npublic\
    \ void login(final String username, final String password) {\n    if (!exists(username,\
    \ password)) {\n        throw new NotAuthenticatedException(\n            \"User\
    \ / Password combination is not recognized\"\n        );\n    }\n}\n```\n\nIt\
    \ is always good idea to pass the informative message along with the exception\
    \ as it helps a lot to troubleshoot production systems. Also, if the exception\
    \ was re-thrown as the result of another exceptional condition, the initial exception\
    \ should be preserved using the cause constructor argument. It will help to figure\
    \ out the source of the problem.\n\n# 8.8 Documenting exceptions\n\nIn the part\
    \ 6 of the tutorial, How to write methods efficiently, we have covered the proper\
    \ documentation of the methods in Java. In this section we are going to spend\
    \ a bit more time discussing how to make exceptions to be a part of the documentation\
    \ as well.\n\nIf a part of its implementation throw the checked exception, it\
    \ must become a part of the method signature (using throws declaration). Respectively,\
    \ Java documentation uses the @throws tag for describing those exceptions. For\
    \ example:\n\n```\n/* Reads from the file system.\n * @throws IOException if an\
    \ I/O error occurs.\n */\npublic void readFile throws IOException {\n    // Some\
    \ implementation here\n}\n```\n\nIn contrast, as we know from section Checked\
    \ and unchecked exceptions, the unchecked exception usually are not declared as\
    \ part of method signature. However it is still a very good idea to document so\
    \ the caller of the method will be aware of possible exceptions by using the (@throws\
    \ tag). For example:\n\n```\n/* Parses the string representation of some concept.\n\
    \ * @param str String to parse\n * @throws IllegalArgumentException if the specified\
    \ string cannot be parsed\n * @throws NullPointerException if the specified string\
    \ is null\n```"
- md: "\n## Advanced java\n\n```java\npublic void parse( final String str ) {\n  //\
    \ Some implementation here\n}\n```\n\nPlease always document the exceptions which\
    \ your methods could throw. It will help other developers to implement proper\
    \ exception handling and recovering (fallback) logic from the beginning, rescuing\
    \ them from troubleshooting issues in production systems.\n\n## 8.9 Exceptions\
    \ and logging\n\nLogging (http://en.wikipedia.org/wiki/Logfile) is an essential\
    \ part of any or-or less complex Java application, library or framework. It is\
    \ a journal of the important events happening in the application and exceptions\
    \ are the crucial part of this flow. Later in the tutorial we may cover a bit\
    \ the logging subsystem provided by Java standard library; however, please remember\
    \ that exceptions should be properly logged and analyzed later on in to discover\
    \ problems in the applications and troubleshoot critical issues.\n\n## 8.10 Download\
    \ the Source Code\n\nThis was a lesson on how and when to use Exceptions. You\
    \ may download the source code here: advanced-java-part-8\n\n## 8.11 What's next\n\
    \nIn this part of the tutorial we have covered exceptions, a very important feature\
    \ of the Java language. We have seen that exceptions are the foundation of the\
    \ errors management in Java. Exceptions make handling and signaling erroneous\
    \ conditions quite an easy job and, in contrast to error codes, flags and statuses,\
    \ once occurred, exceptions cannot be ignored. In the next part we are going to\
    \ address a very hot and complicated topic: concurrency and multithreaded programming\
    \ in Java.\n\n## Chapter 9\n\n## Concurrency best practices\n\n## 9.1 Introduction\n\
    \nThe multiprocessor and multicore hardware architectures greatly influence the\
    \ design and execution model of applications which run on them nowadays. In order\
    \ to utilize the full power of available computational units, the applications\
    \ should be ready to support multiple execution flows which are running concurrently\
    \ and competing for resources and memory. Concurrent programming brings a lot\
    \ of challenges related to data access and non-deterministic flow of events which\
    \ can lead to unexpected crashes and strange failures.\n\nIn this part of the\
    \ tutorial we are going to look at what Java can offer to the developers in order\
    \ to help them write robust and safe applications in a concurrent world.\n\n##\
    \ 9.2 Threads and Thread Groups\n\nThreads are the foundational blocks of concurrent\
    \ applications in Java. Threads are sometimes called lightweight processes and\
    \ they allow multiple execution flows to proceed concurrently. Every single application\
    \ in Java has at least one thread called the main thread. Every thread exists\
    \ inside JVM only and may not reflect any operating system thread.\n\nThreads\
    \ in Java are instances of class. Typically, it is not recommended to directly\
    \ create and manage threads using the instances of Thread (executors and thread\
    \ pools covered in section Futures and Executors provide a better way to do that),\
    \ however it is very easy to do:\n\n```java\npublic static void main(String[]\
    \ args) {\n    new Thread(new Runnable() {\n        @Override\n        public\
    \ void run() {\n            // Some implementation here\n        }\n    }).start();\n\
    }\n```\n\nOr the same using Java 8 lambda functions:\n\n```java\npublic static\
    \ void main(String[] args) {\n    new Thread(() -> { /* Some implementation here\
    \ */ }).start();\n}\n```\n\nNevertheless creating a new thread in Java looks very\
    \ simple, threads have a complex lifecycle and can be one of the following states\
    \ (a thread can be in only one state at a given point in time).\n\n## Advanced\
    \ java\n\n| Thread State | Description |\n|---|---|\n| NEW | A thread that has\
    \ not yet started in this state. |\n| RUNNABLE | A thread executing in the Java\
    \ virtual machine is in this state. |\n| BLOCKED | A thread that is waiting for\
    \ a monitor is in this state. |\n| WAITING | A thread that is waiting indefinitely\
    \ for another thread to perform a particular action is in this state. |\n| TIMED_WAITING\
    \ | A thread that is waiting indefinitely for another thread to perform a particular\
    \ action is in this state. |\n| TERMINATED | A thread that has exited in this\
    \ state. |\n\nNot all threads are clear right now but in the tutorial we will\
    \ discuss most of them and what kind of events cause the thread to be in one state\
    \ or another. Threads could be assembled into groups. A thread group represents\
    \ a set of threads and can also include other groups (forming a tree). Thread\
    \ groups intended to be a nice feature; however they are not recommended for nowadays\
    \ as executors and thread pools (please see Futures) are much better alternatives.\n\
    \n## 9.3 Concurrency, Synchronization and Immutability\n\nIn every Java application\
    \ multiple running threads need to communicate with each other and access shared\
    \ data. Reading this data is not so much of a problem however unordered coordination\
    \ is a shortcut to disaster (so called racing conditions). The point is when synchronization\
    \ kicks in. Synchronization is a mechanism to ensure that concurrently running\
    \ threads will not execute the specified (synchronized) block of code at the same\
    \ time. If one of the threads has begun to execute a synchronized block of the\
    \ code, any other thread trying to execute the block must wait until the one finishes.\n\
    \nJava has synchronization built-in in the form of synchronized thread. This keyword\
    \ can be applied to instance methods, static methods or used around arbitrary\
    \ execution blocks and guarantees that only one thread at a time will be able\
    \ to invoke it. For example:\n\n```java\npublic void performAction() {\n  // Some\
    \ implementation here\n}\n```\n\n```java\npublic static synchronized void performObjectClass()\
    \ {\n  // Some implementation here\n}\n```\n\nOr, alternatively, the example which\
    \ we used the synchronized with a code block:\n\n```java\npublic void performActionBlock()\
    \ {\n  synchronized (this) {\n    // Some implementation here\n  }\n}\n```\n\n\
    There is another very important effect of synchronized keyword.\n\n## Advanced\
    \ java\n\nIn Java, synchronization is built around an entity known as **monitor**\
    \ (http://en.wikipedia.org/wiki/Monitor). Monitor enforces exclusive access to\
    \ the object When the method returns, it releases it.\n\nLastly, the synchronization\
    \ is reentrant: it means that the thread can acquire a lock it already owns.\n\
    \nAs you can see, concurrency introduces a lot of complexity into the Java applications.\
    \ However, there is a cure: immutability. We have talked about many times already,\
    \ but it is very important for multithreaded applications: immutable objects do\
    \ not need the synchronization.\n\n## 9.4 Futures, Executors and Thread Pools\n\
    \nCreating new threads in Java is easy, but managing them is really tough. Java\
    \ standard library provides extremely useful abstractions in the form of executors\
    \ and thread pools to simplify thread management.\n\nEssentially, in its simplest\
    \ implementation, thread pool creates and manages a list of threads, ready to\
    \ be used. Applications, instead of spawning new thread each, just borrow one\
    \ (or many) from the pool. Once finished job, it is returned to the pool, and\
    \ becomes available to pick up next task.\n\nIt is possible to use thread pools\
    \ directly, Java standard library provides executors which has a set of method\
    \ to create thread pools. For example, the code snippet creates a thread pool\
    \ with fixed number of threads (10):\n\n```java\nExecutorService executor = Executors.newFixedThreadPool(10);\n\
    ```\n\nExecutors could be used to offload any task so it will be executed in the\
    \ separate thread from the pool (as note, it is not recommended to use executors\
    \ for long-running tasks). The executors' facade allows customizing the behavior\
    \ of the underlying thread pool and supports following configurations:\n\nIn some\
    \ cases, the result of the execution is not very important so executors support\
    \ fire-and-forget semantic, for example:\n\n```java\nexecutor.execute(new Runnable()\
    \ {\n  @Override\n  public void run() {\n    // Some implementation here\n  }\n\
    });\n```\n\nThe equivalent Java 8 example is much more concise:\n"
  mdcn: "\n\n## 高级 Java\n\n```java\npublic void parse( final String str ) {\n  //\
    \ Some implementation here\n}\n```\n\n请务必记录你的方法可能抛出的异常。这有助于其他开发者从一开始就实现适当的异常处理和恢复（回退）逻辑，避免他们在生产系统中遇到故障排查问题的困扰。\n\
    \n## 8.9 异常与日志\n\n日志记录（http://en.wikipedia.org/wiki/Logfile）是任何或复杂的 Java 应用程序、库或框架不可或缺的一部分。它是应用程序中发生的重要事件的日志，而异常是这一流程的关键部分。在随后的教程中，我们可能会稍微介绍\
    \ Java 标准库提供的日志子系统；但是，请记住，应该对异常进行适当记录和分析，以便发现应用程序的问题并解决关键故障。\n\n## 8.10 下载源代码\n\
    \n这是一节关于如何以及何时使用异常的课程。你在这里下载源代码：advanced-java-part-8\n\n## 8.11 接下来\n\n在教程的这一部分，我们涵盖了\
    \ Java 语言中一个非常重要的特性——异常。我们看到异常是 Java 错误管理的基础。异常处理和信号错误状态变得非常简单，而且与错误代码、标志和状态相比，异常一旦发生就无法被忽略。在下一部分，我们将讨论一个非常热门且复杂的话题：Java\
    \ 中的并发和多线程编程。\n\n## 第9 章\n\n## 并发最佳实践\n\n## 9.1 引言\n\n多处理器和多核心硬件架构极大影响了如今运行在其上的应用程序的设计和执行模型。为了充分利用可用计算单元的力量，应用程序应该能够支持多个并发运行并竞争资源和内存的执行流。并发编程带来了许多与数据访问和事件非确定性流相关的挑战，可能导致意外崩溃和奇怪的故障。\n\
    \n在教程的这一部分，我们将介绍 Java 能为开发者提供什么，以帮助他们在并发世界中编写健壮安全的应用程序。\n\n## 9.2 线程与线程组\n\n线程是\
    \ Java并发应用程序的基础。线程有时被称为轻量级进程，它们允许多个执行流并发进行。Java 中的每个应用程序至少有一个称为主线程的线程。每个线程只存在于\
    \ JVM 中，并不反映任何操作系统的线程。\n\nJava 中的线程是类的实例。通常，不建议使用 `Thread` 实例直接创建和管理线程（Futures\
    \ 和 Executors 章节中涵盖了执行器和线程池，它们提供了更好的方法），但是这样做非常简单：\n\n```java\npublic static void\
    \ main(String[] args) {\n    new Thread(new Runnable() {\n        @Override\n\
    \        public void run() {\n            // Some implementation here\n      \
    \  }\n    }).start();\n}\n```\n\n或者使用 Java 8 Lambda 函数实现相同的功能：\n\n```java\npublic\
    \ static void main(String[] args) {\n    new Thread(() -> { /* Some implementation\
    \ here */ }).start();\n}\n```\n\n尽管在 Java 中创建新线程看起来非常简单，但线程具有复杂的生命周期，并可能处于以下状态之一（线程在任何给定时间点只能处于一种状态）。\n\
    \n## 高级 Java\n\n| 线程状态 | 描述 |\n|---|---|\n| NEW (新建) | 线程在此状态尚未启动。 |\n| RUNNABLE\
    \ (运行) | 在 Java 虚拟机中执行的线程处于此状态。 |\n| BLOCKED (阻塞) | 等待监视器的线程处于此状态。 |\n| WAITING\
    \ (等待) | 无限等待另一个线程执行特定操作的线程处于此状态。 |\n| TIMED_WAITING (超时等待) | 在限期等待另一个线程执行特定操作的线程处于此状态。\
    \ |\n| TERMINATED (终止) | 线程在此状态已退出。 |\n\n目前并不是所有线程都非常清晰，但在教程中我们将讨论大多数线程以及导致线程进入某一种状态或另一种状态的各种事件。线程可以被组成组。线程组代表一组线程，也可以包含其他组（形成树形结构）。线程组的设计初衷是作为一个很好的特性；但现在已不再推荐使用，因为执行器和线程池（请参阅\
    \ Futures）是更好的替代方案。\n\n## 9.3 并发、同步与不可变性\n\n在每个 Java 应用程序中，多个运行中的线程需要相互通信并访问共享数据。读取这些数据并不是什么大问题，但无序的协调是通往灾难的捷径（所谓的竞态条件）。关键在于同步的介入。同步是一种机制，确保并发运行的线程不会同时执行指定的（同步）代码块。如果其中一个线程开始执行同步代码块，任何其他尝试执行该代码块的线程必须等待，直到该线程完成。\n\
    \nJava 以 `synchronized` 线程的形式内置了同步机制。该关键字可以应用于实例方法、静态方法，或用于任意执行块周围，并保证同一时刻只有一个线程能够调用它。例如：\n\
    \n```java\npublic void performAction() {\n  // Some implementation here\n}\n```\n\
    \n```java\npublic static synchronized void performObjectClass() {\n  // Some implementation\
    \ here\n}\n```\n\n或者，另一种我们在代码块中使用 `synchronized` 的示例示例：\n\n```java\npublic void\
    \ performActionBlock() {\n  synchronized (this) {\n    // Some implementation\
    \ here\n  }\n}\n```\n\n`synchronized` 关键字还有一个非常重要的作用。\n\n## 高级 Java\n\n在 Java\
    \ 中，同步是围绕一个名为**监视器**（http://en.wikipedia.org/wiki/Monitor）的实体构建的。监视器强制执行对象的排他访问。当方法返回时，它会释放。\n\
    \n最后，同步是重入的：这意味着线程可以获取它已经拥有的锁。\n\n正如你所看到的，并发为 Java 应用程序引入了许多复杂性。然而有一个解决方案：不可变性。我们已经讨论过多次，但它对于多线程应用程序非常重要：不可变对象不需要同步。\n\
    \n## 9.4 Futures、Executors 与线程池\n\n在 Java 中创建新线程很容易，但管理它们非常困难。Java 标准库提供了以执行器（Executors）和线程池形式存在的有用抽象，以简化线程管理。\n\
    \n本质上，在最简单的实现中，线程池创建并管理一个就绪线程列表。应用程序不再每次都创建新线程，而是从池中借用一个（或多个）线程。一旦完成工作，它就会返回到池中，并可以处理下一个任务。\n\
    \n可以直接使用线程池，Java 标准库提供了执行器，它有一组创建线程池的方法。例如，以下代码段创建了一个具有固定数量（10个）线程的线程池：\n\n```java\n\
    ExecutorService executor = Executors.newFixedThreadPool(10);\n```\n\n执行器可以卸载任何任务，使其在池中的独立线程中执行（请注意，不建议使用执行器处理耗时任务）。执行器的外观允许自定义底层线程池的行为，并支持以下配置：\n\
    \n在某些情况下，执行结果并不重要，因此执行器支持“发后即忘”的语义，例如：\n\n```java\nexecutor.execute(new Runnable()\
    \ {\n  @Override\n  public void run() {\n    // Some implementation here\n  }\n\
    });\n```\n\n等效的 Java 8 示例要简洁得多：\n\n"
