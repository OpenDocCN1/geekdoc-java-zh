    \nThe retention policy (please see Annotations and retention policy) plays a key\
    \ role by instructing the compiler which annotations should be available for processing\
    \ by annotation processors.\n\nAnnotation processors are widely used, however\
    \ to write one it requires some knowledge of how Java works.\n\n## 5.15 Annotations\
