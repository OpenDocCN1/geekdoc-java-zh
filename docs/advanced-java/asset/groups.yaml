    \ntry (final StringWriter writer = new StringWriter()) {\n  Json.createObjectBuilder(writer)\n\
    \    .add(\"str\", example.getStr())\n    .add(\"number\", example.getNumber())\n\
    \    .build();\n};\n```\n\nAnd here is the JSON representation of the JsonExample\
    \ class from the example above:\n\n```json\n{\"str\":\"Some string\",\n\"number\"\
    :12.330000000000000}\n```\n\nThe deserialization process goes in the same way:\n\
    \n```java\nfinal String json = \"{\\\"str\\\":\\\"Some string\\\",\\\"number\\\
    \":12.330000000000000\\}\";\ntry (final StringReader reader = new StringReader(json))\
    \ {\n  final JSONObject obj = Json.create(reader).readObject();\n  final JsonExample\
    \ example = new JsonExample();\n  example.setStr(obj.getString(\"str\"));\n  example.setNumber(obj.getJSONObject(\"\
    number\").bigBigDecimal());\n}\n```\n\nIt is fair to say that JSON serialization\
