    \ Inheritance and composition\n\nFortunately, inheritance is not the only way\
    \ to design your classes. Another alternative, which many developers consider\
    \ being better than inheritance, composition. The idea is very simple: instead\
    \ of building class hierarchies, the classes should be composed from other classes.\n\
    \nLet us take a look on this example:\n\n```java\npublic class Vehicle {\n   \
    \ private Engine engine;\n    private Wheels[] wheels;\n    // ...\n}\n```\n\n\
    # Advanced java\n\nThe Vehicle class is composed of its engine and wheels (plus\
    \ many other parts which are left for simplicity). However, one may say that Vehicle\
    \ class is also an engine and so could be designed using the inheritance.\n\n\
    ```java\npublic class Vehicle extends Engine {\n    private Wheels[] wheels;\n\
    \    // ...\n```\n\nWhich design decision is right? The general guidelines are\
    \ known as IS-A and HAS-A principles. IS-A is the inheritance relationship: the\
    \ subclass allows the pattern class specification and such IS-A variation of pattern.\
    \ Consequently, HAS-A is the composition relationship: the class (or HAS-A) the\
    \ objects which belongs to. In most cases, the HAS-A principle better than IS-A\
    \ for a couple of reasons:\n\n- The design is more flexible in a way it could\
    \ be\n- The model stores changes as notating through class hierarchies\n- The\
    \ class and its composites are loosely coupled to inheritance which tightly couples\
    \ parent and its subclasses\n- The reasoning about class is simpler as all its\
    \ dependencies are included in it, in one place\n\nHowever, the inheritance has\
    \ its place, solves real design issues in different way and should not be neglected.\
    \ Please keep those alternatives in mind designing your object-oriented models.\n\
    \n# 3.12 Encapsulation\n\nThe concept of encapsulation in object-oriented programming\
    \ is all about hiding the implementation details (like state, internal, etc.)\
    \ from the outside world. The benefits of encapsulation are maintainability and\
    \ ease of change. The less internal details expose the class, the more control\
    \ the developers have over their internal implementation, without the fear of\
    \ breaking the code class if you are developing a library or framework used by\
    \ many people.\n\nEncapsulation in Java is achieved using visibility and accessibility\
    \ rules. It is considered best practice in Java to never expose the fields directly,\
    \ only by means of getters and setters (if the field is not declared as final).\
    \ For example:\n\n```java\npackage com.javocodeeks.advanced.design;\n\npublic\
    \ class Encapsulation {\n    private final String email;\n    private String address;\n\
    \n    public Encapsulation(final String email) {\n        this.email = email;\n\
    \    }\n\n    public String getAddress() {\n        return address;\n    }\n\n\
    \    public void setAddress(String address) {\n        this.address = address;\n\
    \    }\n\n    public String getEmail() {\n        return email;\n    }\n}\n```\n\
    \nThis example resembles what is called JavaBeans in Java language: the regular\
    \ Java classes written by following the set of conventions, one of them allows\
    \ the access to the fields using getter and setter methods only.\n\n# Advanced\
    \ java\n\nAs we already emphasized in the Inheritance section, please always try\
    \ to keep the class public minimal, following the encapsulation principle. Whatever\
    \ should not be public, should be private instead (protected / package private),\
    \ depending on the problem you are solving. In long run it will pay off, giving\
    \ you the freedom to evolve your design without introducing changes (or at least\
    \ minimize them).\n\n# 3.13 Final classes and methods\n\nIn Java, there is a way\
    \ to prevent the class to be subclassed by any other class: it should be declared\
    \ as `final`.\n\n```java\npackage com.javadegeeks.advanced.design;\n\npublic final\
    \ class FinalClass {\n}\n```\n\nThe same final keyword in the method declaration\
    \ prevents the method in question to be overridden in subclasses.\n\n```java\n\
    package com.javadegeeks.advanced.design;\n\npublic class FinalMethod {\n    public\
    \ final void performAction() {\n    }\n}\n```\n\nThere are no general rules to\
    \ decide if class or method should be `final` or not. Final classes and methods\
    \ limit the extensibility and it is very hard to think ahead the class should\
    \ or not be subclassed, or method should or not be overridden. This is particularly\
    \ important to library developers as the design decisions that could significantly\
    \ limit the applicability of the library.\n\nJava standard library has examples\
    \ of `final` classes, with most known being `String` class. On an early stage,\
    \ the decision has been taken to proactively prevent any attempts to come up with\
    \ “better” implementations.\n\n# 3.14 Download the Source Code\n\nThis was a lesson\
    \ on How to design Classes and Interfaces.\n\n- You may download the source code\
    \ here: advanced-java-part-3\n\n# 3.15 What’s next\n\nIn this part of the tutorial\
    \ we have looked at object-oriented design concepts. We briefly walked through\
    \ contract-based development, touched some functional concepts and saw how the\
    \ language evolved. In next part of the tutorial we are going to meet generics\
    \ and how they are changing the approach approach.\n\n# Chapter 4\n\n# How and\
    \ when to use Generics\n\nThe idea of generics represents the abstraction over\
    \ types (well-known to C++ developers as templates). It is a very powerful concept\
    \ (which came up quite a while ago) that allows to develop abstract algorithms\
    \ and data structures to provide concrete types to operate on. Interestingly,\
    \ generics were not present in the early versions of Java and were added along\
    \ the way only in Java 5 release. And since then, it is fair to say that generics\
    \ revolutionized the way Java programs are being written, delivering much stronger\
    \ type guarantees and making code significantly safer.\n\nIn this section we are\
    \ going to cover the usage of generics everywhere, starting from interfaces, classes\
    \ and methods. Providing a lot of benefits, generics however introduce some limitations\
    \ and side-effects which we are going to cover.\n\n# 4.1 Generics and interfaces\n\
    \nIn contrast to regular interfaces, to define a generic interface it is sufficient\
    \ to provide the type (or types) it should be parameterized. With example:\n\n\
    ```java\npackage com.javodegeeks.advanced.generics;\n\npublic interface GenericInterfaceType<T>\
    \ {\n    void performAction(final T action);\n}\n```\n\nThe GenericInterfaceType\
    \ is parameterized with single type T, which could be used immediately by interface\
    \ declarations. The interface may be parameterized with more than one type, for\
    \ example:\n\n```java\npackage com.javodegeeks.advanced.generics;\n\npublic interface\
    \ GenericInterfaceSeveralTypes<T, R> {\n    R performAction(final T action);\n\
    }\n```\n\nWhenever ever want to implement the interface, it has an option to provide\
    \ the exact type substitutions, for example the ClassImplementingGenericInterface\
    \ uses String as a parameter T of the generic interface:\n\n```java\npackage com.javodegeeks.advanced.generics;\n\
    \npublic class ClassImplementingGenericInterface\n    implements GenericInterfaceType<String>\
    \ {\n    @Override\n    void performAction(final String action ) {\n    }\n}\n\
    ```\n"
