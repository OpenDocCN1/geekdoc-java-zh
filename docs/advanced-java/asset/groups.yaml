  mdcn: "\n\n## 12.10 展望\n\n从这部分开始，我们真正开始讨论 Java 作为一种语言的高级概念，以及 JVM 作为卓越运行时执行平台的相关内容。在教程的接下来的部分，我们将介绍\
    \ Java Compiler API 和 Java Compiler Tree API，学习如何在运行时操作 Java 源码。\n\n## 第 13 章\n\
    \n## Java Compiler API\n\n### 13.1 简介\n\n在教程的这一部分，我们将对 Java Compiler API 进行高视角观察（10000\
    \ feet view）。该 API 提供了对 Java 编译器本身的编程访问，允许开发者从应用程序代码即时地从源文件编译 Java 类。\n\n更有趣的是，我们还将详细介绍\
    \ Java Compiler Tree API，它提供了对 Java 语法解析器功能的访问。通过使用此 API，Java 开发者能够直接接入到语法解析阶段，并对正在编译的\
    \ Java 源码进行后处理分析。这是一个非常强大的 API，被许多静态代码分析工具广泛使用。\n\nJava 编译器还支持注解处理（更多细节请参阅教程的第\
    \ 5 部分“如何以及何时使用枚举和注解”，更多内容见于教程的第 14 部分“注解处理器”），并被分为三个三个包，如下所示：\n\n- javax.annotation.processing\
    \ : 注解处理。\n- java.lang.Model : 用于注解处理和 Compiler Tree API 的语言模型（包括 Java 语言元素、类型和工具类）。\n\
    - java.tools.tools : Java Compiler API 本身。\n\n另一方面，Java Compiler Tree API 由 `com.sun.source`\
    \ 包托管，遵循 Java 标准库的命名规范，它被认为是非标准的（专有的或内部的）。通常，这些 API 的文档并不详尽，或者可能会随时更改。此外，它们绑定到特定的\
    \ JDK/JRE 版本，可能会限制使用它们的应用程序的移植性。\n\n### 13.2 Java Compiler API\n\n我们的探索将从 Java\
    \ Compiler API 开始，它的文档非常齐全且易于使用。进入 Java Compiler API 的入口是 `ToolProvider` 类，它允许获取系统中可用的\
    \ Java 编译器（官方文档是熟悉典型使用场景的绝佳起点）。例如：\n\n```java\nfinal JavaCompiler compiler = ToolProvider.getSystemJavaCompiler();\n\
    for (final SourceVersion version : compiler.getSourceVersions()) {\n    System.out.println(version);\n\
    }\n```\n\n这段短代码获取了 Java 编译器实例，并在控制台上打印出支持的 Java 源码版本列表。对于 Java 7 编译器，输出如下：\n\n\
    ```\nRELEASE_3\nRELEASE_4\nRELEASE_5\nRELEASE_6\nRELEASE_7\n```\n\n它们对应于常见的 Java\
    \ 版本：**1.3, 1.4, 5, 6** 和 **7**。对于 **Java 8** 编译器，支持的版本列表稍长：\n\n```\nRELEASE_3\n\
    RELEASE_4\nRELEASE_5\nRELEASE_6\nRELEASE_7\nRELEASE_8\n```\n\n一旦激活了 Java 编译器实例，就可以对一组\
    \ Java 源文件执行不同的编译任务。在此之前，应该准备好编译单元和诊断收集器（用于收集所有编译错误）。为了实验，我们将编译存储在 `SampleClass.java`\
    \ 源文件中的 Java 类：\n\n```java\npublic class SampleClass {\n    public static void\
    \ main(String[] args) {\n        System.out.println(\"SampleClass has been compiled!\"\
    );\n    }\n}\n```\n\n创建好源文件后，让我们实例化诊断收集器并配置要编译的源文件列表（包含 `SampleClass.java`）：\n\
    \n```java\nfinal DiagnosticCollector<FileObject> diagnostics = new DiagnosticCollector<>();\n\
    final StandardJavaFileManager manager = compiler.getStandardFileManager(\n   \
    \ diagnostics, null, null);\n```\n\n```java\nfinal File file = new File(\n   \
    \ SampleExample.class.getResource(\"SampleClass.java\").toURI() );\n```\n\n```java\n\
    final Iterable<? extends FileObject> sources =\n    manager.getJavaFileObjectFromFiles(Arrays.asList(file));\n\
    ```\n\n准备完成后，最后一步是调用 Java 编译器，并将诊断收集器和源文件列表传递它进行编译：\n\n```java\nfinal CompilationTask\
    \ task = compiler.getTask(null, manager, diagnostics,\n    null, null, sources);\n\
    task.call();\n```\n\n基本上就是这样。在编译任务完成后，`SampleClass.class` 应该出现在 `target/classes`\
    \ 文件夹中。我们可以运行它来确保编译已成功执行：\n\n```bash\njava -cp target/classes SampleClass\n```\n\
    \n控制台将显示以下输出，确认文件已正确编译为字节码：\nSampleClass has been compiled!\n\n如果在编译过程中遇到任何错误，将通过诊断收集器获取（默认情况下，任何额外的收集器输出将打印到\
    \ System.err）。为了说明这一点，让我们尝试编译包含某些错误的示例源文件（SampleClassWithErrors.java）：\n\n```java\n\
    private class SampleClassWithErrors {\n    public static void main(String[] args)\
    \ {\n        System.out.println(\"SampleClass has been compiled!\");\n    }\n\
    }\n```\n\n编译过程应该失败，并且错误信息（包括行名和源文件名）可以从诊断信息中获取，例如：\n\n```java\nfor (final Diagnostic<?\
    \ extends FileObject> diagnostic : diagnostics.getDiagnostics()) {\n    System.out.printf(\"\
    line %d in %s:%n\",\n        diagnostic.getLineNumber(),\n        diagnostic.getSourceName(),\n\
    \        diagnostic.getMessage());\n}\n```\n\n"
