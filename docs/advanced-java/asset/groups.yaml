    \ 113\n\nCopyright (c) Exelixis Media P.C., 2015\n\n保留所有权利。在不限制上述保留版权的权利的情况下，未经版权所有者的事面许可，本书出版物的任何部分均不得复制、存储或引入检索系统，或以任何形式或任何方式（电子、机械、复印、录制或其他）进行传输。\n\
    \n# 前言\n\n学习 Java 基础很容易的。但真正深入研究这种语言并学习其更高级的概念和细节将使你成为优秀的 Java 开发者。互联网上充斥着“软”、“廉价”、“低端”的\
    \ Java 教程，但缺乏真正带你进入下一个层次的。\n\n本书旨在帮助你高效利用 Java。它讨论了高级主题，包括对象创建、并发、序列化、反射等。它将引导你走上精通\
    \ Java 的之路！\n\n# 关于作者\n\nAndriy 在乌克兰的日托米尔工程技术学院完成了计算机科学硕士学位。在过去的十五里，他一直担任顾问/软件开发人员/高级软件开发人员/团队负责人，参与了许多成功项目，包括来自北美和欧洲客户的大型软件系统。\n\
    \n在职业生涯中，Andriy 在企业架构、Web 开发（ASP.NET, Java Server Faces, Play Framework）、软件开发实践（测试驱动开发、持续集成）、软件平台（Sun\
    \ JEE, Microsoft .NET）、面向对象的分析与设计、用户界面开发（MFC, Swing, Windows Forms/WPF）、关系型数据库管理系统（MySQL,\
    \ SQL Server, PostgreSQL, Oracle）、NoSQL 解决方案（MongoDB, Redis）以及操作系统（Linux/Windows）方面获得了丰富的经验。\n\
    \nAndriy 在分布式（多层）软件系统、多线程应用程序、桌面应用程序、面向服务的架构和富互联网应用程序的开发方面拥有丰富经验。自2006年以来，他主要活跃于\
    \ JEE / JSP 平台。\n\n作为一名专业人士，他始终对持续学习和自我完善开放，以便在他热爱的工作中提高效率。\n\n# 第 1 章\n\n# 如何创建和销对象\n\
    \n## 1.1 引言\n\n根据 TIOBE 编程语言指数，Java 编程语言起源太阳微系统公司并于 1995 年发布，是世界上使用最广泛的编程语言之一。Java\
    \ 是一门通用编程语言。它对软件开发者具有吸引力，主要因为它拥有强大的库和运行时、简单的语法、丰富的支持平台（编写一次，随处运行 - WORA）以及出色的社区。\n\
    \n在本教程中，我们将涵盖 Java 概念，假设读者已经具备了该语言的一些基础知识。这绝不是一份完整的参考书，而是一份将你的 Java 技能提升到新水平的详细指南。\n\
    \n课程过程中，会有很多代码片段供参考。在合理的情况下，同一个示例将分别使用 Java 7 语法和 Java 8 语法呈现。\n\n## 1.2 实例化构造\n\
    \nJava 是一门面向对象的语言，因此创建新的类实例（对象）可能是它最重要的概念。构造函数在类实例的初始化中起着核心作用，Java 为定义它们提供了一些便利。\n\
    \n### 1.2.1 隐式（生成的）构造函数\n\nJava 允许在不定义构造函数的情况下创建类。让我们考虑以下类：\n\n```java\npackage\
    \ construction;\n\npublic class NoConstructor {\n}\n```\n\n在这种情况下，当使用 `new` 关键字创建实例时，Java\
    \ 编译器会隐式生成一个构造函数。\n\n```java\nfinal NoConstructor instance = new NoConstructor();\n\
    ```\n\n### 1.2.2 无参数构造函数\n\n没有参数的构造函数（无参构造函数）是最简单的方式。\n\n```java\npackage construction;\n\
    public class NoArgConstructor {\n    public NoArgConstructor() {\n        // 构造体\n\
    \    }\n}\n```\n\n该构造函数在通过 `new` 关键字创建类时会被调用。\n\n```java\nfinal NoArgConstructor\
    \ noArg = new NoArgConstructor();\n```\n\n### 1.2.3 带参数的构造函数\n\n带参数的构造函数是参数化类的有趣方式。\n\
    \n```java\npackage construction;\n\npublic class ConstructorWithArguments {\n\
    \    public ConstructorWithArguments(String arg1, String arg2) {\n        // 构造体\n\
    \    }\n}\n```\n\n有趣的是，构造函数可以使用 `this` 互相调用。\n\n```java\nfinal ConstructorWithArguments\
    \ withArgs = new ConstructorWithArguments(\"arg1\", \"arg2\");\n```\n\n这种方式减少了代码重复，基本上提供了单一入口点。\n\
    \n```java\npublic ConstructorWithArguments(String arg1) {\n    this(arg1);\n}\n\
    ```\n\n### 1.2.4 初始化块\n\nJava 还有另一种使用初始化块来提供初始化逻辑的方法。这个功能很少使用，但最好了解。\n\n```java\n\
    package construction;\n\npublic class InitializationBlock {\n    // 初始化代码\n}\n\
    ```\n\n初始化块可能被视为匿名的无参构造函数。特定的类可以有多个初始化块，它们将按照代码中定义的顺序被调用。例如：\n\n```java\npackage\
    \ construction;\npublic class InitializationBlocks {\n  {\n    // 初始化代码\n  }\n\
    \  {\n    // 初始化代码\n  }\n}\n```\n\n初始化块并不取代构造函数，可以与它们一起使用。但非常重要的一点是，初始化块总会在任何构造函数之前调用。\n\
