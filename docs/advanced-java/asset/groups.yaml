  - "[PAGE 121]\n\n# Advanced java\n\n```\npublic class SampleClass {\n    public\
    \ static void main(String[] args) throws IOException {\n        fetch(\"http://www.google.com\"\
    );\n        fetch(\"http://www.yahoo.com\");\n    }\n\n    private static void\
    \ fetch(final String address)\n        throws MalformedURLException, IOException\
    \ {\n        final URL url = new URL(address);\n        final URLConnection connection\
    \ = url.openConnection();\n\n        try (BufferedReader in = new BufferedReader(\n\
    \                new InputStreamReader(connection.getInputStream())) )) {\n  \
    \          String inputLine = null;\n            final StringBuilder sb = new\
    \ StringBuffer();\n            while ((inputLine = in.readLine()) != null) {\n\
    \                sb.append(inputLine);\n            }\n            System.out.println(\"\
    Content size: \" + sb.length());\n        }\n    }\n}\n```\n\nJava agents fit\
    \ well solving such kind of challenges. We need to define the transformer which\
    \ will gladly modify sun.net.www.protocol.http.HttpURLConnection constructors\
    \ by injecting the code to output the content. Sounds can be done with ClassFileTransformer\
    \ and Javascript is very simple. Let's take a look on such transformer implementation:\n\
    \n```\npublic class SimpleClassTransformer implements ClassFileTransformer {\n\
    \    @Override\n    public byte[] transform(\n        final ClassLoader loader,\n\
    \        final String className,\n        final Class<?> classBeingRedefined,\n\
    \        final ProtectionDomain protectionDomain,\n        final byte[] classbuffer,\n\
    \        throws IllegalClassFormatException) {\n        if (className.endsWith(\"\
    sun/net/www/protocol/HttpURLConnection\")) {\n            try {\n            \
    \    final ClassPool classPool = ClassPool.getDefault();\n                final\
    \ Ct clazz = classPool.get(className);\n                classPool.get(\"sun.net.www.protocol.http.HttpConnection\"\
    );\n\n                for (CtConstructor constructor : clazz.getConstructors())\
    \ {\n                    constructor.insertAfter(\"System.out.println(this.getUrl());\"\
    );\n                }\n\n                byte[] bytecode = clazz.toBytecode();\n\
    \                return bytecode;\n            } catch (final NotFoundException\
    \ | CannotException | IOException ex) {\n                ex.printStackTrace();\n\
    \            }\n        }\n        return null;\n    }\n}\n```"
  - "[PAGE 122]\n\n# Advanced java\n\n# 112 / 113\n\n}\n\nThe ClassPool and CtXxx\
    \ classes (CtClass, CtConstructor) came from Javascript library. The transformation\
    \ we have done it quite Na've but it is for demonstrational purposes. Firstly,\
    \ because we were interested in HTTP communications only, the sun.net.protocol.http.HttpConnection\
    \ is the class from Standard library being responsible for that.\n\nPlease note\
    \ that using \"_\" separator, the className has the\" one. Secondly, we looked\
    \ for HTTPConnection class and modified all its constructors by injecting the\
    \ System.out.println(this.getClass()); statement at the end. And lately, we rewritten\
    \ the bytecode of the transformed version of the class so it is going to be used\
    \ by JVM instead of original one.\n\nWith that, role of Java agent premain would\
    \ be to add the instance of SimpleClassTransformer class to the instrumentation\
    \ context:\n\n```\npublic class SimpleAgent {\n  public static void main(String[]\
    \ args, Instrumentation inst) {\n    final SimpleClassTransformer transformer\
    \ = new SimpleClassTransformer();\n    inst.addTransformer(transformer);\n  }\n\
    ```\n\nThat's it quite easy and somewhat frightening at the same time. To finish\
    \ up with Java agent, we have to supply the proper MANIFEST so the JVM will be\
    \ able to pick the right class. Here is the minimum set of the required attributes\
    \ (please refer to Java Agent Basics section for more details):\n\n```\nManifest-Version:\
    \ 1.0\nPremain-Class: com.javacodegeek.advanced.agent.SimpleAgent\n```\n\nWith\
    \ out, our Java agent is ready for a real battle. In the next section of the tutorial\
    \ we are going to cover one of the ways to run agent with your Java applications.\n\
    \n# 15.5 Running Java Agents\n\nWhen running the command line, the Java agent\
    \ can be passed to JVM instance using -javaagent argument has the following semantic:\n\
    \n```\n-javaagent:<path-to-jar>[options]\n```\n\nWhere <path-to-jar> is the path\
    \ to locate agent JAR archive, and options holds additional options which could\
    \ be passed to the java agent, more precisely from agentArgs argument. The command\
    \ line for running our java agent from the section Writing Your First Agent (using\
    \ Java 7 version of) it will look like (assuming that the agent is located in\
    \ the current folder):\n\n```\njava -javaagent:advanced-java-part-15-java7.agents-0.0.1-SNAPSHOT.jar\n\
    ```\n\nWhen running the SimpleClass class along with the advanced-java-part-15-java7.0.0.1-SNAPS\
    \ HOT. Your java agent, the application is to print on the console of all the\
    \ URLs (Google and Yahoo!) which were attempted to be accessed using HTTP protocol\
    \ (followed by the content size of the Google and Yahoo! search home web pages):\n\
    \n```\nhttp://www.google.com\nContent size: 20349\nhttp://www.yahoo.com\nContent\
    \ size: 1387\n```\n\nWhen running the SimpleClass class without Java agent specified\
    \ is going to output on the console only content size, no URLs (please notice\
