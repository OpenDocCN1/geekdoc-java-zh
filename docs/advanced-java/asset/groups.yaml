    \ could be parameterized using generics. One interesting detail is that the class\
    \ may (or not) its generic type (or) down to the interfaces and parent classes,\
    \ without providing the exact type instance, for example:\n\n```java\npackage\
    \ com.javacodegeeks.advanced.generics;\npublic class GenericImplementingGenericInterface<\
    \ T > {\n    @Override\n    public void performAction( final T action ) {\n  \
    \      // Implementation here\n    }\n}\n```\n\nIt is a very convenient technique\
    \ which allows classes to impose additional bounds on generic type still conforming\
    \ the interface (or parent class), as we will see in section wildcards and bounded\
    \ types.\n\n## 4.4 Generics and methods\n\nWe have already seen couple of generic\
    \ methods in the previous sections while discussing classes and interfaces. However,\
    \ there is more to say about. Methods could use generic types as parts of argument\
    \ declaration or return type declaration. For example:\n\n```java\npublic<T, R>\
    \ R performAction( final T action ) {\n    final R result = ...; \n    // Implementation\
    \ here\n    return result;\n}\n```\n\nThere are no restrictions on methods which\
    \ can use generic types, they could be concrete, abstract, static or final. Here\
    \ is a couple of examples:\n\n```java\nprotected abstract<T, R> R performAction(\
    \ final T action );\nstatic<T, R> R performActionOn( final Collection< T > action\
    \ ) {\n    final R result = ...; \n}\n```\n\n```java\n// Implementation here\n\
    return result;\n}\n```\n\nIf methods are declared (or defined) as part of generic\
    \ interface or class, they may (or may not) use the generic types of their owner.\
    \ they may define own generic types or mix them with ones from their class or\
    \ interface declaration. For example:\n\n```java\npackage com.javadegeeks.advanced.generics;\n\
    \npublic class GenericMethods<T> {\n  public<R> R perform(final T action) {\n\
    \    final R result = ...;\n    // Implementation here\n    return result;\n \
    \ }\n```\n\n```java\npublic<U, R> R performAnother(final U action) {\n  final\
    \ R result = ...;\n  // Implementation here\n  return result;\n}\n```\n\nClass\
    \ constructors are also considered to be kind of initialization methods, and as\
    \ such, they may use the generic types declared by their class, clear owner (they\
    \ cannot return values so the type parameterization is not applicable to constructors),\
    \ for:\n\n```java\npublic class GenericMethods<T> {\n  public GenericMethods(final\
    \ T initialAction) {\n    // Implementation here\n  }\n```\n\n```java\npublic<J>\
    \ GenericMethods(final T initialAction, final J nextAction) {\n  // Implementation\
    \ here\n}\n```\n\nIt looks very easy and simple, and it is surely. However, there\
    \ are some restrictions and side-effects caused by the way generics are implemented\
    \ in Java language and the next section is to address that.\n\n## 4.5 Limitations\
    \ of generics\n\nBeing one of the brightest features of the language, generics\
    \ unfortunately have some limitations, mainly by the fact that they were introduced\
    \ late into mature language. Most likely, more implementation required significantly\
    \ more time and resources to the trade-offs made in order to have generics in\
    \ a timely manner.\n\nFirstly, primitive types (like int, long, byte,...) are\
    \ not allowed to be used in generics. It means whenever you need to parameterize\
    \ your generic with a primitive one, the class wrapper (Integer, Long, Byte,...)\
    \ has to be used instead.\n\n```java\nfinal List<Long> longList = new ArrayList<>();\n\
    final Set<Integer> integers = new HashSet<>();\n```\n\nNot only, because of necessity\
    \ to use wrappers in generics, it causes implicit boxing and unboxing of primitive\
    \ values (this topic will be covered in the part 7 of the tutorial, General programming\
    \ guidelines), for example:\n\n```java\nfinal List<Long> longList = new ArrayList<>();\n\
    longList.add(0L); // 'long' is boxed to 'Long'\n```\n\n```java\nlong value = longs.get(0);\
    \ // 'Long' is unboxed to 'long'\n// Do something with value\n```\n\nBut primitive\
    \ types are just one of generics pitfalls. Another, more obscure, is erasure.\
    \ It is important to know that generics exist only at compile time: the Java compiler\
    \ uses a complicated set of rules to enforce type safety with generics and their\
    \ type parameters, whereas the JVM bytecode has all concrete types erased (replaced\
    \ with the Object class). It can also come as a surprise that the following code\
    \ does not compile:\n\n```java\nvoid sort(Collection<String> strings) {\n    //\
    \ Some implementation over strings here\n}\n\nvoid sort(Collection<Number> numbers)\
    \ {\n    // Some implementation over numbers here\n}\n```\n\nFrom the developer's\
    \ standpoint, it is a perfectly valid code because of type erasure, however two\
    \ methods are narrowed to the same signature and leads to compilation error (with\
    \ a message like \"Erasure of method(Collection)\").\n\nAnother disadvantage of\
    \ type erasure is that you cannot create an array of a generic type. For example,\
    \ the following code does not compile:\n\n```java\nT[] array = new T[0];\n```\n\
    \nDespite all these issues, generics are still useful and bring a lot of value.\n\
    \n## 4.6 Generics, wildcards and bounded types\n\nSo far we have seen the examples\
    \ using generics. The extremely powerful ability of generics is imposing the constraints\
    \ (or bounds) on the type using extends and super.\n\nThe extends keyword restricts\
    \ the type parameter to be a subclass of some other class. For example:\n\n```java\n\
    public <T extends InputStream> read(final T) {\n    // Implementation here\n}\n\
    ```\n\nThe type parameter T in the read method is required to be a subclass of\
    \ the InputStream. The same keyword is used to restrict interface. For example:\n\
    \n```java\npublic< T extends Serializable > store(final T object ) {\n    // Implementation\
    \ here\n}\n```\n\nIt is also possible to use other type parameter as a bound for\
    \ extends, for example:\n\n```java\npublic< T, J extends T> void action(final\
    \ T initial, final J next ) {\n    // Implementation here\n}\n```\n\nThe bounds\
    \ are not limited to single constraints and can be combined using &. There could\
    \ be multiple interfaces where only class is allowed. The combination of class\
    \ and interfaces is also possible, with a couple of examples below:\n\n```java\n\
    public< T extends InputStream & Serializable > storeTo(final T ) {\n    // Implementation\
    \ here\n}\n```\n\n```java\npublic< T extends Serializable & Externalizable & Cloneable\
    \ > persist(final T ) {\n    // Implementation here\n}\n```\n\nBefore discussing\
    \ the super, we need to get familiar with the concept of wildcards. If the type\
    \ parameter is not of interest of the generic class, interface or method, it could\
    \ be replaced by the wildcard? For example:\n\n```java\npublic void store(final\
    \ Collection< ? extends Serializable > objects ) {\n    // Implementation here\n\
    }\n```\n\nThe method store does not care what type parameters it is being called,\
    \ the only thing it needs to ensure is that every implements Serializable interface.\
    \ Or, if this is not of importance, the wildcard without bounds could be used\
    \ instead:\n\n```java\npublic void store(final Collection< ? objects ) {\n   \
    \ // Implementation here\n}\n```\n\nIn contrast to extends, the super keyword\
    \ restricts the type parameter to a superclass of some other class. For example:\n\
    \n```java\npublic void iterate(final Collection< ? super Integer > objects ) {\n\
    \    // Implementation here\n}\n```\n\nBy using upper and lower type bounds (with\
    \ extends and super) the generics provide a way to fine-tune the type parameter\
    \ requirements or, in some cases, completely omit them, preserving the generics\
    \ type-oriented semantic.\n\n## 4.7 Generics and type inference\n\nWhen generics\
    \ found their way into the Java language, they blew up the amount of the code\
    \ developers had to write in order to satisfy the syntax rules. For example:\n\
    \n```java\nfinal Map< String, Collection< String > > map =\n    new HashMap< String,\
    \ Collection< String > >();\n```\n"
