  - "[PAGE 114]\n\n# Advanced java\n\nIn essence, any Java class could become a full-blown\
    \ annotation processor just by implementing a single interface: javax.annotation.processing.\
    \ However, to become useful, each implementation of the javax.annotation.processing.Processor\
    \ must provide a public constructor (for more details, please refer to the part\
    \ I of the tutorial, How to create and destroy objects) which could be used to\
    \ instantiate the processor. The processing infrastructure will follow a set of\
    \ rules to interact with an annotation processor and the processor must respect\
    \ these:\n\n+   - the instance of the annotation processor is created with the\
    \ no-argument constructor of the processor class\n- the init method is called\
    \ with an appropriate javax.annotation.processing.ProcessingEnvironment instance\
    \ being passed\n- the getSupportedAnnotationTypes, getSupportedOptions, and getSupportedSourceMethods\
    \ are called (these methods are called only once per run, not on each)\n- and\
    \ lastly, as appropriate, the process method on the javax.annotation.processing.Processor\
    \ is called (please take into account that a new annotation processor is not going\
    \ to be created for each round)\n\nThe Java documentation emphasizes that if annotation\
    \ processor is created and without the above protocol then the processor's behavior\
    \ is not defined by this interface specification.\n\n# 14.4 Writing Your Own Annotation\
    \ Processor\n\nWe are going to develop several kinds of annotation processors,\
    \ starting from the simplest one, immutability checker. Let us define a simple\
    \ annotation Imutable we are going to use in order to annotate the class to ensure\
    \ it does not allow to modify its state.\n\n```\n@Target(ElementType.TYPE)\n@Retention(Retention.CLASS)\n\
    public interface Immutable {\n```\n\nFollowing the policy, the annotation is going\
    \ to be retained by Java compiler during the compilation phase it will not be\
    \ (and should not) available at runtime.\n\nAs we know from part 3 of the tutorial,\
    \ How to design Classes and Interfaces, immutability is hard in Java. To keep\
    \ things simple, our annotation processor is going to verify that all of the classes\
    \ are declared as final. Luckily, the Java library provides an abstract annotation\
    \ processor, AbstractProcessor, which is designed to be a base for most concrete\
    \ annotation processors. We can use SimpleAnnotationProcessor to implement\n\n\
    ```\n@SupportedAnnotationType(\"com.javgeeks.advanced.processor.Immutable\")\n\
    @SupportedSourceVersion(SourceVersion.RELEASE_7)\npublic class SimpleAnnotationProcessor\
    \ extends AbstractProcessor {\n    @Override\n     boolean process(Set<? extends\
    \ TypeElement> annotations, RoundEnv env) {\n        for (Element element : env.getElementsAnnotatedWith(Immutable.class))\
    \ {\n            if (element instanceof TypeElement) {\n                TypeElement\
    \ typeElement = (TypeElement) element;\n                for (Element enclosedElement\
    \ : typeElement.getEnclosedElements()) {\n                    if (enclosedElement\
    \ instanceof VariableElement) {\n                        VariableElement variableElement\
    \ = (VariableElement) enclosedElement;\n                        if (!variableElement.getModifiers().contains(Modifier.FINAL))\
    \ {\n                            env.getMessage().printMessage(Diagnostic.Kind.ERROR,\n\
    \                                String.format(\"Class %s is annotated as @Immutable,\
    \ but field %s is not declared as final\",\n                                typeElement.getSimpleName(),\
    \ variableElement.getName()));\n                        }\n                  \
    \  }\n                }\n            }\n        }\n        return true;\n    }\n\
    }\",\n```"
