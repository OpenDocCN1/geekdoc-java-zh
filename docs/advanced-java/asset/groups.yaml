- md: "\n## 12.10 What's next\n\nBeginning from this part we are really starting the\
    \ discussions about advanced concepts of Java as a language and JVM as excellent\
    \ runtime execution platform. In the next part of the tutorial we are going to\
    \ look at the Java Compiler API and the Java Compiler Tree API to learn how to\
    \ manipulate Java sources at runtime.\n\n## Chapter 13\n\n## Java Compiler API\n\
    \n### 13.1 Introduction\n\nIn this part of the tutorial we are going to take 10000\
    \ feet view of the Java Compiler API. This API provides programmatic access to\
    \ the Java compiler itself and allows developers to compile Java classes from\
    \ source files on the fly from application code.\n\nMore interestingly, we are\
    \ also going to walk through the Java Compiler Tree API, which provides access\
    \ to Java syntax parser functionality. By using this API, Java developers have\
    \ the ability to directly plug into syntax parsing phase and post-analyze Java\
    \ source code being compiled. It is a very powerful API which is heavily utilized\
    \ by many static code analysis tools.\n\nThe Java Compiler also supports annotation\
    \ processing (for more details please refer to part 5 of the tutorial, How and\
    \ when to use Enums and Annotations, more come in part 14 of the tutorial, Annotation\
    \ Processors) and is split between three packages, shown below.\n\n- javax.annotation.processing\
    \ : Annotation processing.\n- java.lang.Model : Language model used in annotation\
    \ processing and Compiler Tree API (including Java language elements, types and\
    \ utility classes).\n- java.tools.tools : Java Compiler API itself.\n\nOn the\
    \ other side, the Java Compiler Tree API is hosted by the com.sun.source package\
    \ and following Java standard library naming conventions, is considered to be\
    \ non-standard (proprietary or internal). In general, these APIs are not very\
    \ well documented or could change any time. Moreover, they are tied to the particular\
    \ JDK/JRE version and may limit the portability of applications which use.\n\n\
    ### 13.2 Java Compiler API\n\nOur exploration will start from the Java Compiler\
    \ API, which is quite well documented and easy to use. The entry point into Java\
    \ Compiler API is the ToolProvider class, which allows to obtain the Java compiler\
    \ available in the system (the official documentation is a great starting point\
    \ to get familiar with the typical usage scenarios). For example:\n\n```java\n\
    final JavaCompiler compiler = ToolProvider.getSystemJavaCompiler();\nfor (final\
    \ SourceVersion version : compiler.getSourceVersions()) {\n    System.out.println(version);\n\
    }\n```\n\nThis small snippet gets the Java compiler instances and prints out on\
    \ the console a list of supported Java source versions. For Java 7 compiler, the\
    \ output looks like this:\n\n```\nRELEASE_3\nRELEASE_4\nRELEASE_5\nRELEASE_6\n\
    RELEASE_7\n```\n\nIt corresponds to more well-known Java version: **1.3, 1.4,\
    \ 5, 6** and **7**. For **Java 8** compiler, the list of supported versions looks\
    \ a bit longer:\n\n```\nRELEASE_3\nRELEASE_4\nRELEASE_5\nRELEASE_6\nRELEASE_7\n\
    RELEASE_8\n```\n\nOnce the instance of Java compiler is activated, it could be\
    \ used to perform different compilation tasks over the set of Java source files.\
    \ But before, the set of compilation units and diagnostics collector (to collect\
    \ all compilation errors) should be prepared. To experiment with, we are going\
    \ to compile this Java class stored in `SampleClass.java` source file:\n\n```java\n\
    public class SampleClass {\n    public static void main(String[] args) {\n   \
    \     System.out.println(\"SampleClass has been compiled!\");\n    }\n}\n```\n\
    \nHaving this source file created, let us instantiate the diagnostics collector\
    \ and configure the list of source files (which includes only `SampleClass.java`)\
    \ to compile:\n\n```java\nfinal DiagnosticCollector<FileObject> diagnostics =\
    \ new DiagnosticCollector<>();\nfinal StandardJavaFileManager manager = compiler.getStandardFileManager(\n\
    \    diagnostics, null, null);\n```\n\n```java\nfinal File file = new File(\n\
    \    SampleExample.class.getResource(\"SampleClass.java\").toURI() );\n```\n\n\
    ```java\nfinal Iterable<? extends FileObject> sources =\n    manager.getJavaFileObjectFromFiles(Arrays.asList(file));\n\
    ```\n\nOnce the preparation is done, the last step is to invoke Java compiler,\
    \ passing the diagnostics collector and list of source files to, it compile:\n\
    \n```java\nfinal CompilationTask task = compiler.getTask(null, manager, diagnostics,\n\
    \    null, null, sources);\ntask.call();\n```\n\nThat is, basically, it. After\
    \ the compilation task, the SampleClass.class should be available in the `target/classes`\
    \ folder. We can run it to make sure compilation has been performed successfully:\n\
    \n```bash\njava -cp target/classes SampleClass\n```\n\nThe following output will\
    \ be shown on the console, confirming that the file has properly compiled into\
    \ byte code:\nSampleClass has been compiled!\n\nIn case of any errors encountered\
    \ during the compilation process, they will be available through the diagnostics\
    \ collector (by default, any additional collector output will be printed into\
    \ System.err) To illustrate that, let us try to compile the sample source file\
    \ which contains some errors(SampleClassWithErrors.java):\n\n```java\nprivate\
