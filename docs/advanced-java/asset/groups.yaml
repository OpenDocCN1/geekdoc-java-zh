    \ up with the method version to convert numbers to strings (instead of raw objects).\n\
    \n```\npublic class Child extends Parent {\n    @Override\n    public String toobject(\
    \ Number number ) {\n        return number.toString();\n    }\n}\n```\n\nWhatever\
    \ the signature of the toobject method in the Child is a little different (please\
    \ see Covariant return types for more details), it overrides the one from the\
    \ superclass and Java compiler has no complaints about that. Now, let us add another\
    \ method to the Child class.\n\n```\npublic class Child extends Parent {\n   \
    \ public String toobject( Double number ) {\n        return number.toString();\n\
    \    }\n}\n```"
- md: "\n## Advanced java\n\nAgain, there is just a subtle difference in the method\
    \ signature (Double instead of Number) but in this case it is overloaded version\
    \ of the method, which does not override the parent. That is when the help from\
    \ Java compiler and @Override annotations pay off: annotating the method from\
    \ example with @Override raises the compiler error.\n\n## 6.6 Inlining\n\nInlining\
    \ is an optimization performed by the Java JIT (just-in-time) compiler in order\
    \ to eliminate a particular method call and replace it with direct method implementation.\
    \ The heuristics JIT compiler uses are depending on how often a method is invoked\
    \ and how large it is. Methods that are too large cannot be effectively inlined.\
    \ Inlining may provide significant performance improvements to your code and is\
    \ yet another benefit of keeping methods short as we already discussed in the\
    \ section Method body.\n\n## 6.7 Recursion\n\nRecursion in Java is a technique\
    \ where a method calls itself while performing calculations. For example, let\
    \ us take a look on the\n\n```java\npublic int sum(int[] numbers ) {\n    if (numbers.length\
    \ == 0) {\n        return 0;\n    }\n    if (numbers.length == 1) {\n        return\
    \ numbers[0];\n    } else {\n        return numbers[0] + Arrays.copyOfRange(numbers,\
    \ 1, numbers.length );\n    }\n}\n```\n\nIt is an ineffective implementation,\
    \ however it demonstrates recursion well. There is one well-known issue with recursive\
    \ methods: depending how deep the call chain is, they can blow up the stack and\
    \ cause a StackOverflow call optimization. But things are not as bad as you say\
    \ because there is a technique which can eliminate stack calls called tail calls\
    \ (all tail calls). For example, let us rewrite the previous algorithm in a tail-recursive\
    \ methods which are methods in which all recursive methods are tail-recursive:\n\
    \n```java\npublic int sum(int initial, int[] numbers ) {\n    if (numbers.length\
    \ == 0) {\n        return initial;\n    }\n    if (numbers.length == 1) {\n  \
    \      return initial + numbers[0];\n    } else {\n        return sum(initial\
    \ + numbers[ 0 ],\n        Arrays.copyOfRange(numbers, 1, numbers.length ) );\n\
    \    }\n}\n```\n\nUnfortunately, at the moment the Java compiler (as well as JVM\
    \ JIT compiler) does not support tail optimization but still it is a very useful\
    \ technique to know about and to consider when you are writing the recursive algorithms\
    \ in Java.\n\n## 6.8 Method References\n\nJava 8 made a huge step forward by introducing\
    \ functional concepts into the Java language. The foundation of treating the methods\
    \ as data, a concept which was not supported by the language before (however,\
    \ since Java 7, the JVM and the Java standard library have already some features\
    \ to make it possible). Thankfully, with method it is now possible.\n\n## Advanced\
    \ java\n\n## Table 6.1: datasheet\n\n| Type of the reference | Example |\n|---|---|\n\
    | Reference to a static method | SomeClass::staticMethodName |\n| Reference to\
    \ an instance method of a particular object | SomeInstance::instanceName |\n|\
    \ Reference to an instance method of an arbitrary object of a particular type\
    \ | SomeType::methodName |\n| Reference to a constructor | SomeClass::new |\n\n\
    Let us look at a quick example on how methods could be passed around as arguments\
    \ to other methods.\n\n```java\npublic class MethodReference {\n    public static\
    \ void println(String s) {\n        System.out.println(s);\n    }\n\n    public\
    \ static void main(String[] args) {\n        final Collection<String> strings\
    \ = Arrays.asList(\"s1\", \"s2\", \"s3\");\n        strings.stream().forEach(MethodReference::println);\n\
    \    }\n}\n```\n\nThe last line of the main method uses the reference to println\
    \ to print each element from the collection of strings to the console and is passed\
    \ as an argument to another method, forEach.\n\n## 6.9 Immutability\n\nImmutability\
    \ taking a lot of these days and Java is not an exception. It is well-known that\
    \ immutability is hard in Java but this does not mean it should be ignored.\n\n\
    In Java, immutability avoids all changing internal state. As an example, let us\
    \ take a look at the JavaBeans specification (https://docs.oracle.com/javase/tutorial/javabeans/).\
    \ It states clearly that setters may modify the state of the containing object\
    \ and that is what every Java developer expects.\n\nHowever, the alternative would\
    \ be not to modify the state, but return a new one every time. It is not as costly\
    \ as it sounds and the new Java 8 Date/Time API (developed under JSR 310: Date\
    \ and Time API) is a great example of it. Let us take a look at the following\
    \ code snippet:\n\n```java\nfinal LocalDateTime now = LocalDateTime.now();\nfinal\
    \ LocalDateTime tomorrow = now.plusHours(24);\n\nfinal LocalDateTime midnight\
    \ = now\n    .withHour(0)\n    .withMinute(0)\n    .withSecond(0)\n    .withNano(0);\n\
    ```\n\nEvery call to the LocalDateTime instance needs to modify its state returns\
    \ the new LocalDateTime instance and keeps the original unchanged. It is a big\
    \ shift in API design paradigm comparing to old Calendar and Date ones (which\
    \ mildly speaking were not very pleasant to use and caused a lot of headaches).\n\
    \n## 6.10 Method Documentation\n\nIn Java, specifically if you are developing\
    \ some kind of library or framework, all public methods should be documented using\
    \ the Javadoc tool (http://www.oracle.com/technnetwork/articles/java/index-jsp-135444.html).\
    \ Strictly speaking, nothing forces you to do that, but good documentation helps\
    \ other developers to understand what a particular method is doing, what it requires,\
    \ what assumptions or constraints as its implementation has, what types of exceptions\
    \ and when could be raised and what the return value (if any) could be (plus many\
    \ things).\n\nLet us take a look at the following example:\n\n```java\n/**\n*\
    \ The method parses the string argument as a signed decimal integer.\n* The characters\
    \ in the string must all be decimal digits, except\n* that first character may\
    \ be a minus sign (`code '-'`) or plus\n* sign (`code '+'`).\n\n* <p>An exception\
    \ of type (`codeFormatException`) is thrown if\n* string is (`code null`) or has\
    \ length of zero.\n\n* <p>Examples:\n* <blockquote>\n* parse(\"0\") returns 0\n\
    * parse(\"+42\") returns 42\n* parse(\"-2\") returns -2\n* parse(\"string\") throws\
    \ NumberFormatException\n* </blockquote>\n\n* @param str a (code String) containing\
    \ the (code int) representation to be parsed\n* @return the integer value represented\
    \ by the string\n* @exception NumberFormatException if the string does not contain\
    \ a valid integer value\n */\npublic int parse(String str) {\n    // implementation\n\
    }\n```\n\n## Advanced java\n\n## 6.11 Method Parameters and Return Values\n\n\
    Documenting methods is a great thing, but unfortunately it does not prevent the\
    \ use cases when a method is called using incorrect values. Returning to our example\
    \ from the previous section, the method should perform the validation of its argument\
    \ before doing anything with:\n\n```java\npublic int parse(String str) {\n   \
    \ if(str == null)\n        throw new IllegalArgumentException(\"String should\
    \ not be null\");\n\n    return Integer.parseInt(str);\n}\n```\n\nJava has another\
    \ option for validation and sanity checks using the assert statements. However,\
    \ those could be turned off at runtime and not be executed. It is preferred to\
    \ always perform checks and catch the relevant exceptions.\n\nEven having methods\
    \ documented and validating their checks, there are still plenty of note related\
    \ to the values they could return. Before Java 8, the simplest way for a method\
    \ to say \"I have no value to return\" was by returning null. Java 8 tries to\
    \ address this with introduction of Optional<T>. Let's look at this example:\n\
    \n```java\npublic Optional<T> find(String id) {\n    // Some implementation here\n\
    }\n```\n\nOptional<T> provides a lot of useful methods and completes the need\
    \ for the method to return null and pollute your code with null checks everywhere.\
    \ The only exception probably is collections. Whenever method returns the collection,\
    \ it is always better to return the empty instead of null (and ever Optional<T>),\
    \ for example:\n\n```java\npublic List<T> find(Collection<T> collection, String\
    \ id) {\n    return Collections.emptyList();\n}\n```\n\n## 6.12 Methods as API\
    \ entry points\n\nIf you are just a developer building applications within your\
    \ organization or a contributor to one of the popular Java framework or library,\
    \ the design decisions you make play a very important role in how your code is\
    \ to be used.\n\nWhile the API design guidelines are worth of several books, this\
    \ part of the tutorial touches many (as methods become the API entry points) so\
    \ a summary would be helpful:\n\n- Use meaningful names for methods and their\
    \ arguments (Method signatures)\n- Try to keep the number of arguments to methods\
    \ be less than 6 (section Method signatures)\n- Keep your methods short and readable\
    \ (section Method body and Inlining)\n- Always document your public methods, including\
    \ preconditions and examples if it makes sense (section Method Documentation)\n"
  mdcn: "\n\n## 进阶 Java\n\n再次，方法签名上仅有细微差别（使用 `Double` 而不是 `Number`），但在这种情况下它是方法的重载版本，并没有重写父类。这就是\
    \ Java 编译器帮助和 `@Override` 注解发挥作用的时候了：为示例中的方法添加 `@Override` 注解会引发编译错误。\n\n## 6.6\
    \ 内联 (Inlining)\n\n内联是 Java JIT（即时编译）编译器执行的一种优化，旨在消除特定的方法调用并将其替换为直接的方法实现。JIT 编译器使用的启发式算法取决于方法被调用的频率以及其体量。过大的方法无法被有效地内联。内联可能会为你的代码提供显著的性能提升，这也是我们在“方法体”章节中已经讨论过的保持方法短小的的另一个益处。\n\
    \n## 6.7 递归\n\nJava 中的递归是一种方法在执行计算时调用 way人的技术。例如，让我们来看这个：\n\n```java\npublic int\
    \ sum(int[] numbers ) {\n    if (numbers.length == 0) {\n        return 0;\n \
    \   }\n    if (numbers.length == 1) {\n        return numbers[0];\n    } else\
    \ {\n        return numbers[0] + Arrays.copyOfRange(numbers, 1, numbers.length\
    \ );\n    }\n}\n```\n\n这是一个低效的实现，但它很好地演示了递归。递归方法有一个广为人知的问题：取决于调用链的深度，它们可能会导致栈溢出并引发\
    \ `StackOverflow`（栈溢出）异常。但情况并没有你想象的那么糟糕，因为有一种可以消除栈调用的技术，被称为**尾调用**（tail calls，所有尾调用）。例如，让我们将之前的算法重写为尾递归方法，尾递归方法是指其中所有的递归方法调用都是尾递归的：\n\
    \n```java\npublic int sum(int initial, int[] numbers ) {\n    if (numbers.length\
    \ == 0) {\n        return initial;\n    }\n    if (numbers.length == 1) {\n  \
    \      return initial + numbers[0];\n    } else {\n        return sum(initial\
    \ + numbers[ 0 ],\n        Arrays.copyOfRange(numbers, 1, numbers.length ) );\n\
    \    }\n}\n```\n\n遗憾的是，目前 Java 编译器（以及 JVM JIT 编译器）还不支持尾优化，但当你编写 Java 递归算法时，这仍然是一个非常值得了解和考虑的技巧。\n\
    \n## 6.8 方法引用 (Method References)\n\nJava 8 通过将函数式概念引入 Java 语言，向前迈出了巨大的一步。将方法视为数据的基础，这一概念在之前的语言中是不被支持的（尽管自\
    \ Java 7 以来，JVM 和 Java 标准库已经拥有某些功能可以使其成为可能）。幸运的是，现在处理方法是可行的。\n\n## 进阶 Java\n\n\
    ## 表 6.1：数据数据表\n\n| 引用类型 | 示例 |\n|---|---|\n| 对静态方法的引用 | SomeClass::staticMethodName\
    \ |\n| 对特定对象实例方法的引用 | SomeInstance::instanceName |\n| 对特定类型任意对象的实例方法的引用 | SomeType::methodName\
    \ |\n| 对构造函数的引用 | SomeClass::new |\n\n让我们来看一个快速的示例，说明如何将方法作为参数传递给其他方法。\n\n```java\n\
    public class MethodReference {\n    public static void println(String s) {\n \
    \       System.out.println(s);\n    }\n\n    public static void main(String[]\
    \ args) {\n        final Collection<String> strings = Arrays.asList(\"s1\", \"\
    s2\", \"s3\");\n        strings.stream().forEach(MethodReference::println);\n\
    \    }\n}\n```\n\n`main` 方法的最后一行使用 `println` 的引用将字符串集合中的每个元素打印到控制台，并将其作为参数传递另一个方法\
    \ `forEach`。\n\n## 6.9 不可变性 (Immutability)\n\n不可变性最近非常流行，Java 也不例外。众所周知，在 Java\
    \ 中实现不可变性很困难，但这并不意味着应该忽略它。\n\n在 Java 中，不可变性避免了所有内部状态的改变。例如，让我们来看 JavaBeans 规范（https://docs.oracle.com/javase/tutorial/javabeans/）。它明确指出，setter\
    \ 可以修改包含对象的状态，这是每个 Java 开发者所期望的。\n\n然而，替代方案是不修改状态，而是每次返回一个新状态。这并不像听起来那么昂贵，新的 Java\
    \ 8 日期时间 API（在 JSR 310: Date and Time API 下开发）就是一个很好的例子。让我们来看下面的代码段：\n\n```java\n\
    final LocalDateTime now = LocalDateTime.now();\nfinal LocalDateTime tomorrow =\
    \ now.plusHours(24);\n\nfinal LocalDateTime midnight = now\n    .withHour(0)\n\
    \    .withMinute(0)\n    .withSecond(0)\n    .withNano(0);\n```\n\n对 `LocalDateTime`\
    \ 实例的每次修改状态的操作都会返回一个新的 `LocalDateTime` 实例，并保持原始实例不变。与旧的 `Calendar` 和 `Date` 相比，这是\
    \ API 设计范式的一个巨大转变（说实话，它们并不好用，并且引起了很多麻烦）。\n\n## 6.10 方法文档\n\n在 Java 中，特别是当你正在开发某种库或框架时，所有公共方法都应该使用\
    \ Javadoc 工具（http://www.oracle.com/technnetwork/articles/java/index-jsp-135444.html）进行文档。严格来说，没有东西强制你这样做，但良好的文档有助于其他开发者理解特定方法在做什么，它需要什么。\n\
    \n"
