    # 9.8 Concurrent Collections


    Shared collections, accessible and modifiable by multiple threads, are rather
    a rule than an exception. Java standard library provides a couple of helpful static
    methods in the Collections which make any existing collection thread-safe. For
    example:


    ```

    final Set<String> strings =

    Collections.synchronizedSet(new HashSet<String> );


    final Map<String, String> map =

    Collections.synchronizedMap(new HashMap<String, String> );

    ```


    However the returned general-purpose collection wrappers are thread-safe, it is
    not the best option as they provide a mediocre performance in real-world applications.
    This is why Java library includes a set of collection classes for concurrency.
    Below is a list of most used ones, all hosted under java.util.concurrent package.


    | Class | Description |

    | --- | --- |

    | CountDownLatch | A synchronization aid that allows one or more threads to wait
    until a set of operations being performed in other threads completes. |

    | CyclicBarrier | A synchronization aid that allows a set of threads to wait for
    each other to reach a common barrier point. |

    | Exchanger<V> | A synchronization point at which threads can pair and swap elements.
    |

    | Phaser | A reusable synchronization barrier, similar in functionality to CyclicBarrier
    and CountDownLatch but supporting more flexible usage. |

    | Semaphore | A counting semaphore. |

    | ThreadLocalRandom | A random number generator isolated to the current thread
    |

    | ReentrantReadWriteLock | An implementation of read/write lock


    Figure 9.5: Atomic Classes Java 8


    Those classes are specifically designed to be used in the multithreaded applications.
    They exploit a lot of techniques to make the concurrent access to the collection
    as efficient as possible and are the recommended replacement to synchronized collection
    wrappers.


