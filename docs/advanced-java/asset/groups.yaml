    \ `clone()` 实现执行正确的操作。\n\n## 高级 Java\n\n```java\n@Override\npublic Office clone()\
    \ throws CloneNotSupportedException {\n    final Office clone = ( Office ) super.clone();\n\
    \    clone.persons = persons.clone();\n    return clone;\n}\n```\n\n现在看起来好多了，但这个实现非常脆弱，因为将\
    \ `persons` 字段设为 `final` 将导致相同的共享问题（因为 `final` 无法重新赋值）。\n\n总而言之，如果你想为类制作拷贝，最好实现\
    \ `clone()` 和 `Cloneable`，并使用许多相似的替代方案（例如拷贝、构造一个开发者熟悉的 C++ 方式的类型，或者通过工厂方法，这些很有用）。\n\
    \n## 高级 Java\n\n## 2.5 == 运算符\n\n`==` 运算符和 `equals()` 方法之间存在有趣的关系，这会导致很多问题。在大多数情况下（基本类型除外），`==`\
    \ 执行的是引用相等；如果两个引用指向同一个实例，它返回 `true`。我们来看一个简单的示例说明这一点：\n\n```java\nString str =\
    \ new String(\"bbb\");\nSystem.out.println(\"Using == \" + (str==\"bbb\"));\n\
    ```\n\n即使两个字符串看起来一样，它们也是不同的实例。\n\n## 2.6 有用的类\n\n自 Java 7 发布以来，标准库包含了一些非常有用的工具类。其中之一是\
    \ `Objects` 类。特别是这三个方法可以极大简化你的 `equals()` 和 `hashCode()` 实现。\n\n表 2.2：方法 | 描述\
    \ |\n|---|---|\n| static boolean equals(Object a, Object b) | 如果参数相等返回 true，否则返回\
    \ false。 |\n| static int hash(Object...values) | 为输入值生成哈希码。 |\n| static int hashCode(Object\
    \ o) | 返回非空参数的哈希码，空参数返回 0。 |\n\n如果我们使用这些辅助方法重写 Person 类的 `equals()` 和 `hashCode()`\
    \ 方法，代码量将显著减少，而且代码更具可读性。\n\n```java\n@Override\npublic boolean equals( Object\
    \ obj) {\n    if ( obj == null ) {\n        return false;\n    }\n\n    if (this\
    \ == obj) {\n        return true;\n    }\n\n    if (getClass() != obj.getClass())\
    \ {\n        return false;\n    }\n\n    final PersonObjects other = (PersonObjects)\
    \ obj;\n    if (!Objects.equals(email, other.email)) {\n        return false;\n\
    \    } else if (!Objects.equals(firstName, other.firstName)) {\n        return\
    \ false;\n    } else if (!Objects.equals(lastName, other.lastName)) {\n      \
    \  return false;\n    }\n\n    return true;\n}\n```\n\n```java\n@Override\npublic\
    \ int hashCode() {\n    return Objects.hash(email, firstName, lastName);\n}\n\
    ```\n\n## 2.7 下载源码\n\n-    你可以在此处下载源码：advanced-java-part-2\n\n## 2.8 接下来是什么\n\n\
    在这一节中，我们涵盖了 `Object` 类，它是 Java 面向对象编程的基础。我们看到每个类都可以重写继承自 `Object` 类的方法并制定自己的等值规则。在下一节中，我们将切换思路，开始讨论如何正确地设计你的类和接口。\n\
    \n"
