    \ and allows developers to compile Java classes from source files on the fly from\
    \ application code.\n\nMore interestingly, we are also going to walk through the\
    \ Java Compiler Tree API, which provides access to Java syntax parser functionality.\
    \ By using this API, Java developers have the ability to directly plug into syntax\
    \ parsing phase and post-analyze Java source code being compiled. It is a very\
    \ powerful API which is heavily utilized by many static code analysis tools.\n\
    \nThe Java Compiler also supports annotation processing (for more details please\
