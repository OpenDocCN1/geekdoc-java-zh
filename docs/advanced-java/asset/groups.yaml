    \ {\n    @Override\n    public void run() {\n    }\n}\n```\n\n幸运的是，随着 Java 8 引入\
    \ Lambda 表达式和函数接口，所有样板代码都将消失，最终让 Java 代码看起来非常简洁。\n\n```java\npackage com.javacodegeeks.advanced.design;\n\
    public class AnonymousClass {\n    public static void main(String[] args) {\n\
    \        new Thread(() -> { /* 在处实现 */ }).start();\n    }\n}\n```\n\n## 3.8 可见性\n\
    \n在教程的第一部分“如何设计类和接口”中，我们已经讨论过关于 Java 可见性和可访问规则。在这一部分，我们将从子类化的角度再次回到这个主题。\n\n表\
    \ 3.1：数据数据表\n\n| 修饰符 | 包 | 子类 | 其他所有人 |\n| --- | --- | --- | --- |\n| public |\
    \ 可访问 | 可访问 | 可访问 |\n| protected | 可访问 | 可访问 | 不可访问 |\n| <无修饰符> | 可访问 | 不可访问 |\
    \ 不可访问 |\n| private | 不可访问 | 不可访问 | 不可访问 |\n\n不同的可见性级别允许或禁止类查看其他类或接口（例如，如果它们在不同的包中或嵌套在另一个内部），或者允许子类查看和访问方法、构造函数。\n\
    \n## 3.9 继承\n\n继承是面向对象编程中的核心概念，在下一节中，我们将看到它的用法。在 Java 中，继承通过 `extends` 关键字实现。由于\
    \ Java 的设计，子类可以继承父类的属性和方法。此外，即使这种简单的做法也提供了一个很好的例子，说明不可变性在 Java 中并不是原生公民。如果一个不可变类引用了其他类的实例，情况就会变得非常复杂。那些类也必须是不可变的，因为没有简单的方法可以避免这一点。\n\
    \n为了实现代码的重用性和维护性，继承允许子类扩展父类的成员。在 Java 中，每个类都有有一个直接父类（Object 类位于层次结构的顶端）。然而，类可以实现多个接口，这是在\
    \ Java 中实现（或模拟）多继承的唯一方式。\n\n为了实现代码的重用性和维护性，继承允许子类扩展父类的成员。在 Java 中，每个类都有一个直接父类（Object\
