    \ applications within your organization or a contributor to one of the popular\
    \ Java framework or library, the design decisions you make play a very important\
    \ role in how your code is to be used.\n\nWhile the API design guidelines are\
    \ worth of several books, this part of the tutorial touches many (as methods become\
    \ the API entry points) so a summary would be helpful:\n\n+   - Use meaningful\
    \ names for methods and their arguments (Method signatures)\n- Try to keep the\
    \ number of arguments to methods be less than 6 (section Method signatures)\n\
    - Keep your methods short and readable (section Method body and Inlining)\n- Always\
    \ document your public methods, including preconditions and examples if it makes\
