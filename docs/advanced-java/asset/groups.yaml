  - "[PAGE 91]\n\n# Advanced java\n\nHowever, there is a way to reduce those risks\
    \ by employing simple pattern named Serialization Proxy, which is based on using\
    \ replaceReplace and readResolve methods. The basic idea of this pattern is to\
    \ introduce dedicated class for serialization (usually as private static inner\
    \ class), the classes required to be serialized. Let us a look at this example:\n\
    \n```\npublic class SerializationProxyExample implements Serializable {\n    private\
    \ static final long serialVersionUID = 6163231482548364831L;\n\n    private String\
    \ str;\n    private int number;\n\n    public SerializationProxyExample(final\
    \ String str, final int number) {\n        this.setStr(str);\n        this.setNumber(number);\n\
    \    }\n\n    private void readObject(Object InputStream stream) throws InvalidObjectException\
    \ {\n        throw new InvalidObjectException(\"Serialization Proxy is expected\"\
    );\n    }\n\n    private Object readResolve() {\n        return new SerializationProxy(this);\n\
    \    }\n\n    // Setters and getters\n```\n\nWhen the instances of this class\
    \ are being serialized, the class SerializationProxyExample implementation provides\
    \ the replacement object (instance of the SerializationProxy class instead). It\
    \ means that the SerializationProxy class will never be serialized (and deserialized)\
    \ directly. It explains why the readObject method raises an exception in case\
    \ a deserialization something happens. Now, let us take a look on the companion\
    \ SerializationProxy class:\n\n```\nprivate static class SerializationProxy implements\
    \ Serializable {\n    private static final long serialVersionUID = 83684405852265246959L;\n\
    \n    private String str;\n    private int number;\n\n    public SerializationProxy(final\
    \ SerializationProxyExample instance) {\n        this.str = instance.getStr();\n\
    \        this.number = instance.getNumber();\n    }\n\n    private Object readResolve()\
    \ {\n        return new SerializationProxyExample(str, number); // Uses public\
    \ constructor\n    }\n}\n```\n\nIn our simplified case, the SerializationProxy\
    \ class duplicates all the fields of the SerializationProxy (but it could be much\
    \ complicated than that). Consequently, when the instances of this class are being\
    \ deserialized, the readResolve method is called and SerializationProxy provides\
    \ the replacement as well, this in a shape of SerializationProxyExample instance.\
    \ As such, the SerializationProxy class serves as a serialization proxy for SerializationProxyExample\
    \ class.\n\n# 10.5 Serializability and Remote Method Invocation (RMI)\n\nFor some\
