    \ is called (please take into account that a new annotation processor is not going\
    \ to be created for each round)\n\nThe Java documentation emphasizes that if annotation\
    \ processor is created and without the above protocol then the processor's behavior\
    \ is not defined by this interface specification.\n\n## 14.4 Writing Your Own\
    \ Annotation Processor\n\nWe are going to develop several kinds of annotation\
    \ processors, starting from the simplest one, immutability checker. Let us define\
    \ a simple annotation `Immutable` we are going to use in order to annotate the\
