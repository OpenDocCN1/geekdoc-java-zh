    \n## 10.7 JSON-P\n\nSince 2013, Java developers are able to use JSON as the serialization\
    \ format, by virtue of newly introduced Java API for JSON Processing (JSON-P).\
    \ Now JSON-P is not part of Standard library although there are many discussions\
    \ to include JSON support into the language using Java 9 release (http://openjdk.java.net/jeps/198).\
    \ Nevertheless, it is there and available as Java Processing Reference Implementation\
    \ (https://jsonp.java.net/). In contrast to JAXB, nothing is required to be added\
    \ to the class to make it suitable for JSON serialization, for example:\n\n```java\n\
    public class JsonExample {\n  private String str;\n  private BigDecimal number;\n\
    \  // Setters and getters here\n}\n```\n\nThe serialization is not as transparent\
    \ as JAXB, and requires a bit of code to be written for each class intended to\
    \ be serialized into JSON, for:\n\n```java\nfinal JsonExample example = new JsonExample();\n\
