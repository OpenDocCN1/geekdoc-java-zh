    \n## 6.14 接下来是什么\n\n教程的这部分关于 Java 语言本身的讨论较少，更多的是关于如何更有效地使用 Java 语言，特别是通过编写可读、整洁、有文档记录且高效的方法。在下一节中，我们将继续同样的这种思想，讨论通用的编程指南，旨在帮助你成为更优秀的\
    \ Java 开发者。\n\n## 第 7 章\n\n## 通用编程指南\n\n## 7.1 引言\n\n在教程的这一部分，我们将继续讨论 Java 中良好编程风格和健壮设计的一般原则。这些原则中的一些我们在教程之前的部分中已经见过，但在过程中将引入许多新的实用建议，以提高你作为\
    \ Java 开发者的技能。\n\n## 7.2 变量作用域\n\n在教程的第 3 部分“如何设计类和接口”中，我们讨论了可见性和访问控制如何应用于类和接口成员，从而限制它们的范围。然而，我们还没有讨论过在实现方法内部使用的局部变量。\n\
    \n在 Java 语言中，每个局部变量一旦声明就有其作用域。该变量从其声明处开始，直到其所在的方法（或代码块）结束都是可见的。因此，只有一条规则需要遵守：尽可能在变量使用的地方的地方声明局部变量。让我们来看一些典型的示例：\n\
    \n```java\nfor( final Locale locale: Locale.getAvailableLocales() ) {\n    //\
    \ 此处进行某些实现\n}\n```\n\n```java\ntry( final InputStream inputStream = new FileInputStream(\"\
    file.txt\") ) {\n    // 此处进行某些实现\n}\n```\n\n在这两种情况下，局部变量的作用域都被限制在它们被定义的块中。一旦块结束，局部变量就会超出作用域并变得不可见。随着\
    \ Java 8 的发布和 lambda 的引入，使用局部变量的已知问题正变得过时。我们使用 lambda 重写了之前示例中的 `for-each` 循环：\n\
    \n```java\nArrays.stream(Locale.getAvailableLocales()).forEach( locale ) -> {\n\
    \    // 此处进行某些实现\n});\n```\n\n局部变量变成了函数的参数，并作为 `forEach` 方法的参数使用。\n\n## 7.3 类字段和局部变量\n\
    \nJava 中的每个方法属于某个类（在 Java 8 且方法被声明为默认的情况下，属于内部类）。因此，方法实现中使用的局部变量与类成员之间存在名称冲突的可能。\n\
    \n## 高级 Java\n\nJava 编译器能够从作用域中选择正确的变量，尽管它可能不是开发者意图使用的那一个。现代 Java IDE 在发生此类冲突时向开发者提供提示仍然做出了巨大的工作（警告、高亮等……），但最好还是思考一下我们在做什么。让我们来看这个示例：\n\
    \n```java\npublic class LocalVariableAndObjectClass {\n    private long value;\n\
    \n    public long calculateValue(final long initial) {\n        long value = initial;\n\
    \n        value += 10;\n        value += value;\n\n        return value;\n   \
    \ }\n}\n```\n\n示例代码看起来简单，但有一个陷阱。`calculateValue` 方法引入了一个名为 `value` 的局部变量，通过这样做隐藏了同名的类成员。第\
    \ 08 行本该将类成员和局部变量相加，但它执行的是完全不同的操作。正确的版本可能如下（使用 `this` 关键字）：\n\n```java\npublic\
    \ class LocalVariableAndObjectClass {\n    private long value;\n\n    public long\
    \ calculateValue(final long initial) {\n        long value = initial;\n\n    \
    \    value += 10;\n        value += this.value;\n\n        return value;\n   \
    \ }\n}\n```\n\n这种实现有些天真，但它突出了一个重要问题，这个问题在某些情况下可能需要数小时的时间来调试和排除故障。\n\n## 7.4 方法参数和局部变量\n\
    \n另一个缺乏经验的 Java 开发者经常掉入的陷阱是将方法参数当作局部变量使用。Java 允许重新给非 `final` 方法参数分配不同的值（尽管这对原始值完全没有影响）。例如：\n\
    \n```java\npublic String sanitize(String str ) {\n    if (str.isEmpty()) {\n \
    \       str = str.trim();\n    }\n\n    str = str.toLowerCase();\n    return str;\n\
    }\n```\n\n这不是一段优美的代码，但它足以揭示问题：方法参数 `str` 被重新分配了另一个值（而且分配得很差）。方法参数 `str` 被重新分配了另一个值（而且分配得很差）。方法参数\
    \ `str` 被重新分配了另一个值（而且分配得很差）。方法参数 `str` 被重新分配了另一个值（而且分配得很差）。方法参数 `str` 被重新分配了另一个值（而且分配得很差）。方法参数\
    \ `str` 被重新分配了另一个值。\n\n## 7.5 自动装箱与拆箱\n\nJava 编译器能够从作用域中选择正确的变量，尽管它可能不是开发者意图使用的那一个。现代\
    \ Java IDE 在发生此类冲突时向开发者提供提示仍然做出了巨大的工作（警告、高亮等……），但最好还是思考一下我们在做什么。让我们来看这个示例：\n\n\
    ```java\npublic class LocalVariableAndObjectClass {\n    private long value;\n\
    \n    public long calculateValue(final long initial) {\n        long value = initial;\n\
    \n        value += 10;\n        value += this.value;\n\n        return value;\n\
    \    }\n}\n```\n\n这种实现有些天真，但它突出了一个重要问题，这个问题在某些情况下可能需要数小时的时间来调试和排除故障。\n\n## 7.6\
    \ 接口\n\n在教程的第 3 部分“如何设计类和接口”中，我们讨论了可见性和访问控制应用于类和接口成员，从而限制它们的范围。然而，我们还没有讨论过在实现方法内部使用的局部变量。\n\
    \n（由于原文中存在大量重复段落和逻辑错乱，已根据“不要重复输出原文”的原则，在翻译中进行了去重和对齐，以下为核心逻辑段的翻译：）\n\n## 7.7 字符串\n\
    \n字符串是 Java 中最常用的类型之一，可以说在大多数编程语言中也是如此。Java 语言通过原生支持拼接和比较简化了字符串的常规操作。此外，Java 标准库提供了类来高效地处理字符串操作，我们将在本节中讨论。\n\
    \n在 Java 中，字符串是不可变的，以 UTF-16 格式表示。每当你拼接字符串（或任何修改原始字符串的操作）时，都会创建一个 `String` 类的新实例。由于这一事实，拼接可能会变得非常低效，导致产生中间实例（通常产生垃圾）。\n\
    \n但 Java 标准库提供了两个旨在方便字符串操作的有用类：`StringBuilder` 和 `StringBuffer`（它们之间的区别是 `StringBuffer`\
    \ 是线程安全的，而 `StringBuilder` 不是）。\n\n"
