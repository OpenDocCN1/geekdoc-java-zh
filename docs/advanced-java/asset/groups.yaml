  - "[PAGE 38]\n\n# # Chapter 4\n\n# # How and when to use Generics\n\nThe idea of\
    \ generics represents the abstraction over types (well-known to C++ developers\
    \ as templates). It is a very powerful concept (which came up quite a while ago)\
