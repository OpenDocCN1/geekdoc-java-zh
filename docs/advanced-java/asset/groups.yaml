    \ {\n            // Some implementation here\n        }\n    }).start();\n}\n\
    ```\n\nOr the same using Java 8 lambda functions:\n\n```\npublic static void main(String[]\
    \ args) {\n    new Thread(() -> { /* Some implementation here */ }).start();\n\
    }\n```\n\nNevertheless creating a new thread in Java looks very simple, threads\
    \ have a complex lifecycle and can be one of the following states (a thread can\
    \ be in only one state at a given point in time)."
  - "[PAGE 79]\n\n# Advanced java\n\n| Thread State | Description |\n|---|---|\n|\
    \ NEW | A thread that has not yet started in this state. |\n| RUNNABLE | A thread\
    \ executing in the Java virtual machine is in this state. |\n| BLOCKED | A thread\
    \ that is waiting for a monitor is in this state. |\n| WAITING | A thread that\
    \ is waiting indefinitely for another thread to perform a particular action is\
    \ in this state. |\n| TIMED_WAITING | A thread that is waiting indefinitely for\
    \ another thread to perform a particular action is in this state. |\n| TERMINATED\
    \ | A thread that has exited in this state. |\n\n![](img/0c18c23df1fa562d1b6fc69569bf3713_79_0.png)\n\
    \nNot all threads are clear right now but in the tutorial we will discuss most\
    \ of them and what kind of events cause the thread to be in one state or another.\\\
    Threads could be assembled into groups. A thread group represents a set of threads\
    \ and can also include other groups (forming a tree). Thread groups intended to\
    \ be a nice feature however they are not recommended for nowadays as executors\
    \ and thread pools (please see Futures) are much better alternatives.\n\n# 9.3\
    \ Concurrency, Synchronization and Immutability\n\nIn every Java application multiple\
    \ running threads need to communicate with each other and access shared data.\
    \ Reading this data is not so much of a problem however unordered coordination\
    \ is a shortcut to disaster (so called racing conditions). The point is when synchronization\
    \ kicks in. Synchronization is a mechanism to ensure that concurrently running\
    \ threads will not execute the specified (synchronized) block of code at the same\
    \ time. If one of the threads has begun to execute a synchronized block of the\
    \ code, any other thread trying to execute the block must wait until the one finishes.\n\
    \nJava has synchronization built-in in the form of synchronized thread. This keyword\
    \ can be applied to instance methods, static methods or used around arbitrary\
    \ execution blocks and guarantees that only one thread at a time will be able\
    \ to invoke it. For example:\n\n```\npublic void performAction() {\n  // Some\
    \ implementation here\n}\n```\n\n```\npublic static synchronized void performObjectClass()\
    \ {\n  // Some implementation here\n}\n```\n\nOr, alternatively, the example which\
    \ we used the synchronized with a code block:\n\n```\npublic void performActionBlock()\
    \ {\n  synchronized (this) {\n    // Some implementation here\n  }\n}\n```\n\n\
    There is another very important effect of synchronized keyword: it automatically\
    \ establishes a happens-before relationship (http://en.wikipedia.org/wiki/Happened-before)\
    \ with any invocation of a synchronized method or code block for the same object.\
    \ It guarantees that changes to the state of the object are visible to all threads.\n\
    \nPlease note that constructors cannot be synchronized (using the synchronized\
    \ keyword with a constructor causes compiler error) because only the thread which\
    \ creates an instance has access to it while instance is being constructed."
  - "[PAGE 80]\n\n# Advanced java\n\nIn Java, synchronization is built around an internal\
    \ entity known as **monitor** (intrinsic/monitor lock, http://en.wikipedia.org/wiki/Monitor_(synchronization)).\
    \ Monitor enforces exclusive access to an object's state and establishes happens-before\
    \ relationships. When any thread invokes a synchronized method, it automatically\
    \ acquires the intrinsic (monitor) lock for that method's instance (or class in\
    \ case of static) and releases it when the method returns.\n\nLastly, the synchronization\
    \ Java is reentrant: it means that the thread can acquire a lock that it already\
    \ owns. Reentrant significantly simplifies the programming model of the concurrent\
    \ applications as the threads have fewer chances to block themselves.\n\nAs you\
    \ can see, concurrency introduces a lot of complexity into the Java applications.\
    \ However, there is a cure: immutability. We have talked about many times already,\
    \ but it is really very important for multithreaded applications in particular:\
    \ immutable objects do not need the synchronization as they are never updated\
    \ by more than one threads.\n\n# 9.4 Futures, Executors and Thread Pools\n\nCreating\
    \ new threads in Java is easy, but managing them is really tough. Java standard\
    \ library provides extremely useful abstractions in the form of executors and\
    \ thread pools to simplify thread management.\n\nEssentially, in its simplest\
    \ implementation, thread pool creates and manages a list of threads, ready to\
    \ be used right away. Applications, instead of spawning new thread each, just\
    \ borrow one (or many) from the pool. Once finished job, it is returned to the\
    \ pool, and becomes available to pick up next task.\n\nIt is possible to use thread\
    \ pools directly, Java standard library provides executors which has a set of\
    \ method to create thread pools. For example, the code snippet creates a thread\
    \ pool with fixed number of threads (10):\n\n```\nExecutorService executor = Executors.newFixedThreadPool(10);\n\
    ```\n\nExecutors could be used to offload any task so it will be executed in the\
    \ separate thread from the thread pool (as note, it is not recommended to use\
    \ executors for long-running tasks). The executors' facade allows customizing\
    \ the behavior of the underlying thread pool and supports following configurations:\n\
    \n| Thread State | Description |\n|--- | --- |\n| NEW | A thread that has not\
    \ yet started is in this state. |\n| RUNNABLE | A thread executing in the Java\
    \ virtual machine is in this state. |\n| BLOCKED | A thread that is blocked for\
    \ a monitor lock is in this state. |\n| WAITING | A thread that is waiting indefinitely\
    \ for another thread to perform a particular action is in this state. |\n| TIMED_WAITING\
    \ | A thread that is waiting indefinitely for another thread to perform an action\
    \ is in this state. |\n| TERMINATED | A thread that has exited is in this state.\
    \ |\n\n> Figure 2: Thread States\n\nIn some cases, the result of the execution\
    \ is not very important so executors support fire-and-forget semantic, for example:\n\
    \n```\nexecutor.execute(new Runnable() {\n  @Override\n  public void run() {\n\
    \    // Some implementation here\n  }\n});\n```\n\nThe equivalent Java 8 example\
    \ is much more concise:"
- md: "\n## Advanced java\n\n```java\nexecutor.execute( () -> {\n    // Some implementation\
    \ here\n});\n```\n\nBut if the result of the execution is important, not within\
    \ specified timeout, Java standard library provides another abstraction to represent\
    \ the computation which will happen at some point in the future, Future<T>. For\
    \ example:\n\n```\nFuture<Long > result = executor.submit(new Callable<Long>()\
    \ {\n    @Override\n    public Long call() throws Exception {\n        // Some\
    \ implementation here\n        return null;\n    }\n});\n```\n\nThe result of\
    \ the Future<T> might not be available immediately so the application should wait\
    \ for it using a family of get methods. For example:\n\n```\nLong value = result.get(1,\
    \ TimeUnit.SECONDS);\n```\n\nIf the computation is not available within specified\
    \ timeout, the TimeoutException will be raised. There is an overloaded version\
    \ of get() which always waits forever but please prefer to use the one with timeout.\n\
    \nSince the Java 8 release, developers have another version of the Future<T>,\
    \ CompletableFuture<T>, which supports addition functions and actions that trigger\
    \ upon completion. Not only, with introduction of streams, Java 8 introduces a\
    \ simple and straightforward way to perform parallel processing using parallelStream()\
    \ method, for example:\n\n```java\nfinal Collection<String> strings = new ArrayList<>();\n\
    // Some implementation here\nint sumOfLengths = strings.parallelStream()\n   \
    \ .filter(str -> !str.isEmpty())\n    .mapToInt(str -> str.length())\n    .sum();\n\
    ```\n\nThe simplicity, which executors and parallel streams bring to the Java\
    \ platform, makes the concurrent and parallel programming in Java much easier.\
    \ But there is a catch: uncontrolled creation of thread pools and parallel streams\
    \ could kill performance so it is important to manage them properly.\n\n## 9.5\
    \ Locks\n\nAdditionally to the monitors, Java has support of reentrant mutual\
    \ exclusion locks (with the same behavior and semantics as the monitor lock but\
    \ with capabilities). These locks are available through ReentrantLock class from\
    \ java.util.concurrent.locks.\n\n```java\nprivate final ReentrantLock lock = new\
    \ ReentrantLock();\n\npublic void performAction() {\n    try {\n        // Some\
    \ implementation here\n    } finally {\n        lock.unlock();\n    }\n}\n```\n\
    \n## Advanced java\n\nPlease note that any lock must be explicitly released by\
    \ calling the unlock() method for (synchronized methods and execution blocks Java\
    \ compiler under the hood emits the instructions to release the monitor). If the\
    \ locks require more code, are they better than monitors? Well, for reason of\
    \ most important ones, locks use time while waiting for acquisition and fail fast\
    \ (monitors wait indefinitely and do not have a way to specify the desired timeout).\
    \ For example:\n\n```java\npublic void performActionWithTimeout() throws InterruptedException\
    \ {\n    if (lock.tryLock(1, TimeUnit.SECONDS)) {\n        try {\n           \
    \ // Some implementation here\n        } finally {\n            lock.unlock();\n\
    \        }\n    }\n}\n```\n\nNow, when we are waiting for the lock (acquired by\
    \ another thread) using lock() method, let us discuss how usage affects threads\
    \ state.\n\nWhen any thread is waiting for the lock (acquired by another thread)\
    \ using tryLock() method call, it is in a WAITING state. However, when any thread\
    \ is waiting for the lock (acquired by another thread) using tryLock() method\
    \ call with timeout, it is in a TIMED_WAITING state. In contrast, when any thread\
    \ is waiting for the monitor (acquired by another thread) using synchronized method\
    \ or execution block, it is in a BLOCKED state.\n\nThe examples we see are far\
    \ from simple lock method reality and hard full of pitfalls. The most infamous\
    \ of them is a deadlock: when two or more threads are waiting for each other to\
    \ proceed and thus neither ever does. Deadlocks usually occur when one or more\
    \ lock is acquired by another thread. JVM can then detect deadlocks in the running\
    \ applications and scare the developers (please see Troubleshooting Concurrency\
    \ Issues section). The canonical example of the deadlock like this:\n\n```java\n\
    private final ReentrantLock lock1 = new ReentrantLock();\nprivate final ReentrantLock\
    \ lock2 = new ReentrantLock();\n```\n\n```java\npublic void performAction() {\n\
    \    lock1.lock();\n\n    try {\n        // Some implementation here\n       \
    \ try {\n            lock2.lock();\n            // Some implementation here\n\
    \        } finally {\n            lock2.unlock();\n        }\n        // Some\
    \ implementation here\n    } finally {\n        lock1.unlock();\n    }\n}\n```\n\
    \n```java\npublic void performAnotherAction() {\n    lock2.lock();\n\n    try\
    \ {\n        // Some implementation here\n        try {\n            lock1.lock();\n\
    \            // Some implementation here\n        } finally {\n            lock1.unlock();\n\
    \        }\n        // Some implementation here\n    } finally {\n        lock2.unlock();\n\
    \    }\n}\n```\n\n## Advanced java\n\nThe performAction() method tries to acquire\
    \ lock1 and then lock2, while the method performAnotherAction() does it in the\
    \ other order, lock2 and then lock1. If program execution flow these two methods\
    \ are called from the same class in two different threads, the deadlock is very\
    \ likely to happen: the first thread will be waiting indefinitely for the lock2\
    \ acquired by the second thread, while the second thread will be waiting indefinitely\
    \ for the lock1 acquired by the first one.\n\n## 9.6 Thread Sulers\n\nIn JVM,\
    \ the thread scheduler determines which thread run and for how long. All threads\
    \ created by Java applications have the priority which basically influences the\
    \ thread scheduling algorithm when it makes a decision when thread is scheduled\
    \ and its time quantum. This feature has a reputation of being non-portable (as\
    \ every trick which relies on specific behavior of the thread scheduler).\n\n\
    The Thread class also provide another way to intervene in thread scheduling by\
    \ using a yield() method. It hints the thread scheduler that the current thread\
    \ is willing to yield its current use of a processor time (and has a reputation\
    \ of being non-portable).\n\nBy and large, relying on the thread scheduler implementation\
    \ details is not a great idea. That is why executors and pools from the Java standard\
    \ library (please see Futures section) try not expose these non-portable details\
    \ to the developers (but still leaving a way to do so if it is necessary). Nothing\
    \ works better than careful design which take into account the real hardware the\
    \ application is running on (f.e., number of available CPUs and cores could be\
    \ retrieved using Runtime class).\n\n## 9.7 Atomic Operations\n\nIn multithread\
    \ world there is a particular set of instructions called compare-and-swap (CAS).\
    \ These compare their values to given ones and and, only if they are the same,\
    \ set a new given values. This is done as a single atomic operation which is usually\
    \ lock-free and highly efficient.\n\nJava standard library has a list of classes\
    \ supporting atomic operation, all of them located under java.util.concurrent.atomic\
    \ package.\n\n| Class | Description |\n|---|---|\n| AtomicBoolean | A boolean\
    \ value that may be updated |\n| AtomicInteger | An int value that may be updated\
    \ |\n| AtomicLongArray | A long value that may be updated |\n| AtomicLongArray\
    \ | A long array in which elements may be updated |\n| AtomicReference<V> | An\
    \ object reference that may be updated |\n| AtomicReferenceArray<E> | An array\
    \ of object references in which elements may be updated |\n\nFigure 9.3: Atomic\
    \ Classes\n\nThe Java 8 release extends java.util.concurrent.atomic with a new\
    \ set of atomic operations (accumulators and adders).\n\n## Advanced java\n\n\
    | Class | Description |\n|---|---|\n| DoubleAccumulator | One or more variables\
    \ that together maintain a double updated using a function. |\n| DoubleAdder |\
    \ One or more variables that together maintain a zero sum. |\n| LongAccumulator\
    \ | One or more variables that together maintain a long updated using a function.\
    \ |\n| LongAdder | One or more variables that together maintain a zero sum. |\n\
    \nFigure 9.4: Atomic Classes\n\n## 9.8 Concurrent Collections\n\nShared collections,\
    \ accessible and modifiable by multiple threads, are rather a rule than an exception.\
    \ Java standard library provides a couple of helpful static methods in the Collections\
    \ which make any existing collection thread-safe. For example:\n\n```java\nfinal\
    \ Set<String> strings =\nCollections.synchronizedSet(new HashSet<String> );\n\n\
    final Map<String, String> map =\nCollections.synchronizedMap(new HashMap<String,\
    \ String> );\n```\n\nHowever the returned general-purpose collection wrappers\
    \ are thread-safe, it is not the best option as they provide a mediocre performance\
    \ in real-world applications. This is why Java library includes a set of collection\
    \ classes for concurrency. Below is a list of most used ones, all hosted under\
    \ java.util.concurrent package.\n\n| Class | Description |\n|---|---|\n| CountDownLatch\
    \ | A synchronization aid that allows one or more threads to wait until a set\
    \ of operations being performed in other threads completes. |\n| CyclicBarrier\
    \ | A synchronization aid that allows a set of threads to wait for each other\
    \ to reach a common barrier point. |\n| Exchanger<V> | A synchronization point\
    \ at which threads can pair and swap elements. |\n| Phaser | A reusable synchronization\
    \ barrier, similar in functionality to CyclicBarrier and CountDownLatch but supporting\
    \ more flexible usage. |\n| Semaphore | A counting semaphore. |\n| ThreadLocalRandom\
    \ | A random number generator isolated to the current thread |\n| ReentrantReadWriteLock\
    \ | An implementation of read/write lock |\n\nFigure 9.5: Atomic Classes\n\nThose\
    \ classes are specifically designed to be used in the multithreaded applications.\
    \ They exploit a lot of techniques to make the concurrent access to the collection\
    \ as efficient as possible and are the recommended replacement to synchronized\
    \ collection wrappers.\n\n## 9.9 Explore Java standard library\n\nThe java.util.concurrent\
    \ and java.util.concurrent.locks packages are real gems for the Java developers\
    \ who are writing concurrent applications. As there are a lot of the classes,\
    \ in this section we are going to cover most\n"
  mdcn: "\n\n## 进阶 Java\n\n```java\nexecutor.execute( () -> {\n    // Some implementation\
    \ here\n});\n```\n\n但如果执行结果非常重要，且在指定的超时时间内未完成，Java 标准库提供了另一个抽象来表示在未来某个时间点将发生的计算，`Future<T>`。例如：\n\
    \n```java\nFuture<Long > result = executor.submit(new Callable<Long>() {\n   \
    \ @Override\n    public Long call() throws Exception {\n        // Some implementation\
    \ here\n        return null;\n    }\n});\n```\n\n`Future<T>` 的结果可能不会立即可用，因此应用程序应该使用一组\
    \ `get` 方法来等待它。例如：\n\n```\nLong value = result.get(1, TimeUnit.SECONDS);\n```\n\
    \n如果计算没有在指定的超时时间内完成，将抛出 `TimeoutException`。`get()` 有一个重载版本，它会一直等待下去，但请优先使用带有超时限制的版本。\n\
    \n自 Java 8 发布以来，开发者有了另一个 `Future<T>` 的版本——`CompletableFuture<T>`，它支持额外的函数和在完成时触发的动作。不仅如此，随着流（streams）的引入，Java\
    \ 8 引入了一种简单且直接使用 `parallelStream()` 方法执行并行处理的方法，例如：\n\n```java\nfinal Collection<String>\
    \ strings = new ArrayList<>();\n// Some implementation here\nint sumOfLengths\
    \ = strings.parallelStream()\n    .filter(str -> !str.isEmpty())\n    .mapToInt(str\
    \ -> str.length())\n    .sum();\n```\n\n执行器和并行流为 Java 平台带来的简单性使得 Java 中的并发和并行编程变得容易得多。但有一个问题：不受控制的线程池和并行流创建可能会破坏性能，因此妥善管理它们至关重要。\n\
    \n## 9.5 锁 (Locks)\n\n除了监器（monitors）之外，Java 还支持重入互斥锁（具有监器锁相同的行为和语义，但功能更强）。这些锁可以通过\
    \ `java.util.concurrent.locks` 中的 `ReentrantLock` 类可用。\n\n```java\nprivate final\
    \ ReentrantLock lock = new ReentrantLock();\n\npublic void performAction() {\n\
    \    try {\n        // Some implementation here\n    } finally {\n        lock.unlock();\n\
    \    }\n}\n```\n\n## 进阶 Java\n\n请注意，任何锁必须通过调用 `unlock()` 方法显式释放（对于 `synchronized`\
    \ 方法和执行块，Java 编译器在底层会发出释放监器的指令）。如果锁需要更多的代码，它们会比监器更好吗？嗯，出于最重要的几个原因，锁在等待获取锁时会花费时间并快速失败（而监器会无限等待，且没有指定所需超时时间的方法）。例如：\n\
    \n```java\npublic void performActionWithTimeout() throws InterruptedException\
    \ {\n    if (lock.tryLock(1, TimeUnit.SECONDS)) {\n        try {\n           \
    \ // Some implementation here\n        } finally {\n            lock.unlock();\n\
    \        }\n    }\n}\n```\n\n现在，当我们使用 `lock()` 方法等待锁（由另一个线程获取）时，让我们讨论一下用法如何影响线程状态。\n\
    \n当任何线程使用 `tryLock()` 方法调用等待锁（由另一个线程获取）时，它处于 `WAITING`（等待）状态。然而，当任何线程使用带有超时的 `tryLock()`\
    \ 方法等待锁（由另一个线程获取）时，它处于 `TIMED_WAITING`（计时等待）状态。相比之下，当任何线程使用 `synchronized` 方法或执行块等待监器（由另一个线程获取）时，它处于\
    \ `BLOCKED`（阻塞）状态。\n\n我们看到的示例远非简单的锁方法现实，而且充满了陷阱。其中最臭名昭著的是死锁：当两个或多个线程互相等待对方继续执行，导致两者都无法进行时。死锁通常发生在一个或多个锁被另一个线程获取时。JVM\
    \ 随后可以检测到运行应用程序中的死锁并惊扰开发者（请参阅“并发问题排查”章节）。此类死锁的典型示例：\n\n```java\nprivate final\
    \ ReentrantLock lock1 = new ReentrantLock();\nprivate final ReentrantLock lock2\
    \ = new ReentrantLock();\n```\n\n```java\npublic void performAction() {\n    lock1.lock();\n\
    \n    try {\n        // Some implementation here\n        try {\n            lock2.lock();\n\
    \            // Some implementation here\n        } finally {\n            lock2.unlock();\n\
    \        }\n        // Some implementation here\n    } finally {\n        lock1.unlock();\n\
    \    }\n}\n```\n\n```java\npublic void performAnotherAction() {\n    lock2.lock();\n\
    \n    try {\n        // Some implementation here\n        try {\n            lock1.lock();\n\
    \            // Some implementation here\n        } finally {\n            lock1.unlock();\n\
    \        }\n        // Some implementation here\n    } finally {\n        lock2.unlock();\n\
    \    }\n}\n```\n\n## 进阶 Java\n\n`performAction()` 方法尝试获取 `lock1` 然后是 `lock2`，而\
    \ `performAnotherAction()` 方法以相反顺序执行，即 `lock2` 然后是 `lock1`。如果程序执行流从同一个类的两个不同线程中调用这两个方法，可能会发生死锁：第一个线程将无限等待第二个线程获取的\
    \ `lock2`，而第二个线程将无限等待第一个线程获取的 `lock1`。\n\n## 9.6 线程调度器 (Thread Sulers)\n\n在 JVM\
    \ 中，线程调度器决定哪个线程运行以及运行多久。Java 应用程序创建的所有线程都有优先级，这基本上影响了线程调度算法在决定何时调度线程及其时间切片时的决策。这一特性具有不可移植的声誉（因为任何依赖于线程调度器特定行为的技巧都是如此）。\n\
    \n`Thread` 类还通过使用 `yield()` 提供了另一种干预线程调度的方法。\n\n当任何线程使用 `tryLock()` 方法等待锁（由另一个线程获取）时，它处于\
    \ `WAITING` 状态。但当任何线程使用带有超时的 `tryLock()` 方法等待锁（由另一个线程获取）时，它处于 `TIMED_WAITING`\
    \ 状态。相反，当任何线程使用 `synchronized` 方法或执行块等待监器（由另一个线程获取）时，它处于 `BLOCKED` 状态。\n\n## 9.7\
    \ 原子操作 (Atomic Operations)\n\n在多线程世界中，有一组被称为比较交换（CAS）的特定指令。Java 标准库提供了这些类，它们是无锁且高效的。这些类都位于\
    \ `java.util.atomic` 包中。\n\n| 类 | 描述 |\n|---|---|\n| AtomicBoolean | 一个布尔值 |\n\
    | AtomicInteger | 一个整数 |\n| AtomicLongArray | 一个长整数数组 |\n| AtomicReference<V>\
    \ | 一个对象引用 |\n| AtomicReferenceArray<E> | 一个引用数组 |\n\n图 9.3: 原子类\n\nJava 8 发布扩展了\
    \ `java.util.atomic` 以一组新的原子操作（累加器）。\n\n| 类 | 描述 |\n|---|---|\n| DoubleAccumulator\
    \ | 一个或多个使用维护函数的 double 变量 |\n| DoubleAdder | 一个或多个共同维护的 double 变量 |\n| LongAccumulator\
    \ | 一个或多个使用维护函数的 long 变量 |\n| LongAdder | 一个或多个共同维护的 long 变量 |\n\n## 9.8 并发集合\
    \ (Concurrent Collections)\n\n被多个线程访问和修改的共享集合在现实中是规则而非例外。Java 标准库在 `Collections`\
    \ 中提供了一些有助于静态方法，可以将任何现有集合变为安全的。例如：\n\n```java\nfinal Set<String> strings =\nCollections.synchronizedSet(new\
    \ HashSet<String> );\n\nfinal Map<String, String> map =\nCollections.synchronizedMap(new\
