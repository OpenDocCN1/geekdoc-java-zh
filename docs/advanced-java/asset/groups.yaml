    \ {\n    private Wheels[] wheels;\n    // ...\n```\n\n哪种设计决策是正确的？通用指南被称为 IS-A（是一个）和\
    \ HAS-A（拥有一个）原则。IS-A 是继承关系：子类允许模式类的规范以及这种模式的变体。因此，HAS-A 是组合关系：类（拥有一个）它所所属的对象。在大多数情况下，HAS-A\
    \ 原则优于 IS-A，原因有几点：\n\n- 设计在某些方面更灵活\n- 模型通过类层次结构中的标记来存储更改\n- 类及其组合部分与继承是松耦合的，而继承将父类及其子类紧密耦合\n\
    - 对类的推理更简单，因为它其所有的依赖项都包含在其中，位于一个地方\n\n然而，继承有其用武之地，它以不同的方式解决真实的设计问题，不应被忽视。在设计你的面向对象模型时，请记住这些替代方案。\n\
    \n# 3.12 封装\n\n面向对象编程中的封装概念完全关于向外部世界隐藏实现细节（如状态、内部实现等）。封装的处处可维护性和易于更改。类暴露的内部细节越少，开发者对其内部实现的控制就越大，而无必担心在开发被许多人使用的库或框架时会破坏代码类。\n\
    \nJava 中的封装是通过可见性和可访问性规则实现的。在 Java 中，最佳实践是永远不要直接暴露字段，仅通过 getter 和 setter 方法（如果字段未声明为\
    \ final）。例如：\n\n```java\npackage com.javocodeeks.advanced.design;\n\npublic class\
    \ Encapsulation {\n    private final String email;\n    private String address;\n\
    \n    public Encapsulation(final String email) {\n        this.email = email;\n\
    \    }\n\n    public String getAddress() {\n        return address;\n    }\n\n\
    \    public void setAddress(String address) {\n        this.address = address;\n\
    \    }\n\n    public String getEmail() {\n        return email;\n    }\n}\n```\n\
    \n这个示例类似于 Java 语言中所谓的 JavaBeans：按照遵循一套约定的编写的普通 Java 类，其中一个约定允许仅通过 getter 和 setter\
    \ 方法访问字段。\n\n# 高级 Java\n\n正如我们在“继承”部分中所强调的样，请始终尝试保持类的公开性最小化，遵循封装原则。任何不应该是公开的，都应该是私有的（protected\
    \ / 包级私有），取决于你正在解决的问题。从长远来看，这将是有回报的，让你能够自由地演进设计而不引入更改（或至少将更改最小化）。\n\n# 3.13 Final\
    \ 类和方法\n\n在 Java 中，有一种方法可以防止类被其他类继承：它应该被声明为 `final`。\n\n```java\npackage com.javadegeeks.advanced.design;\n\
    \npublic final class FinalClass {\n}\n```\n\n方法声明中的相同的 `final` 关键字可以防止相关方法在子类中被重写。\n\
    \n```java\npackage com.javadegeeks.advanced.design;\n\npublic class FinalMethod\
    \ {\n    public final void performAction() {\n    }\n}\n```\n\n没有通用规则来决定类或方法是否应该是\
    \ `final` 的。`final` 类和方法限制了扩展性，而且很难预判类应不应该被子类，或者方法应不应该被重写。这对于库开发者来说特别重要，因为设计决策可能会显著限制库的适用性。\n\
    \nJava 标准库中有 `final` 类的示例，最为人知的是 `String` 类。在早期阶段，就决定主动防止任何尝试提出“更好”的实现。\n\n# 3.14\
    \ 下载源代码\n\n这是一节关于“如何设计类和接口”的课程。\n\n- 你可以在此处下载源代码：advanced-java-part-3\n\n# 3.15\
    \ 接下来做什么\n\n在教程的这一部分，我们查看了面向对象的设计概念。我们简要回顾了基于契的开发，接触了一些函数式概念，并看到了语言的演进。在教程的下一部分，我们将遇到泛型（generics）以及它们是如何改变处理方法的。\n\
    \n# 第 4 章\n\n# 如何以及何时使用泛型\n\n泛型的思想代表了对类型的抽象（C++ 开发者所熟悉的模板）。这是一个非常强大的概念（已经出现很长时间了），它允许开发抽象的算法和数据结构，并提供具体的类型进行操作。有趣的是，泛型并没有出现在\
    \ Java 的早期版本中，直到 Java 5 发布时才被添加。从那以后，可以说泛型彻底改变了 Java 程序的编写方式，提供了更强得的类型保证，并使代码变得显著安全。\n\
    \n在本节中，我们将涵盖泛型的各处用法，从接口、类到方法开始。泛型提供了许多益处，但同时也引入了一些局限性和副作用，我们将进行介绍。\n\n# 4.1 泛型与接口\n\
    \n与普通接口相比，定义泛型接口只需要提供它应该参数化的类型（或类型）。例如：\n\n```java\npackage com.javodegeeks.advanced.generics;\n\
    \npublic interface GenericInterfaceType<T> {\n    void performAction(final T action);\n\
    }\n```\n\nGenericInterfaceType 使用单个类型 T 参数化，这可以立即在接口声明中使用。接口可以使用多个类型参数化，例如：\n\n\
    ```java\npackage com.javodegeeks.advanced.generics;\n\npublic interface GenericInterfaceSeveralTypes<T,\
    \ R> {\n    R performAction(final T action);\n}\n```\n\n每当想要实现接口时，它都有选项提供具体的类型替换，例如\
    \ ClassImplementingGenericInterface 使用 String 作为泛型接口的参数 T：\n\n```java\npackage\
    \ com.javodegeeks.advanced.generics;\n\npublic class ClassImplementingGenericInterface\n\
    \    implements GenericInterfaceType<String> {\n    @Override\n    void performAction(final\
    \ String action ) {\n    }\n}\n```\n\n"
