    \ pattern which aims to simplify the development when a set of rules is followed.\
    \ For example, MVC (model-view-controller) frameworks follow the conventions.\n\
    \nOn the other side, annotations open the way for different design which is based\
    \ on explicit configuration. Considering the examples above, @Entity may explicitly\
    \ mark any class as.\n\n## 5.16 When to use annotations\n\nAnnotations are literally\
    \ everywhere: the Java standard library has a lot of them, mostly every Java specification\
    \ includes them. Whenever you need to associate an additional metadata with your\
    \ code, annotations are straightforward and easy to do.\n\nInterestingly, there\
    \ is an ongoing effort in the Java community to develop common semantic concepts\
    \ and standardize the annotations (for more information, please take a look JSR-250\
    \ specification). At the moment, following annotations are included with the Java\
