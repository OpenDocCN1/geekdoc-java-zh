    ## 1.2. 可见性\n\n构造函数受 Java 可见性规则限制，并带有访问控制修饰符，这些修饰符决定了其他类是否可以调用特定的构造函数。\n\n表 1.2：数据\n\
    \n| 修饰符 | 包 | 子类 | 其他所有 |\n| --- | --- | --- | --- |\n| public | 可访问 | 可访问 | 可访问\
    \ |\n| protected | 可访问 | 可访问 | 不可见 |\n| <无修饰符> | 可访问 | 不可见 | 不可见 |\n| private\
    \ | 可访问 | 不可见 | 不可见 |\n\n## 1.2.7 垃圾回收\n\nJava（以及 JVM）使用自动垃圾回收。简单来说，每创建一个新对象，会自动为它们分配内存。因此，每当对象不再被引用时，它们会被销毁并回收内存。\n\
    \nJava 垃圾回收是分代的，它基于这样一个假设：大多数对象都会死亡（在创建后不久后不再被引用，因此可以被销毁）。大多数开发者认为 Java 中对象的创建是很慢的，应该尽可能避免实例化新对象。事实上，事实并非如此：Java\
    \ 中的对象创建是非常廉价且快速的。昂贵是不必要的创建长寿对象，这些对象最终会填满老年代并导致“停顿世界”（stop-the-world）垃圾回收。\n\n\
    ## 1.2.8 终结器 (Finalizers)\n\n到目前为止我们讨论了对象和对象的初始化，但还没有真正提到它们的对立面：对象的销毁。这是因为 Java\
    \ 使用垃圾回收来管理对象周期，销毁不需要的对象并回收内存是垃圾回收器的责任。\n\n然而，Java 中有一个名为 Finalizers 的特殊特性，它ن有点像析构函数，但用途不同，是用于执行资源清理。Finalizers\
    \ 被认为是一项危险的功能（会导致许多副作用和性能问题）。通常情况下，它们是不必要的，并且应该被避免（与 AutoCloseable 相关的极少数情况除外）。Java\
    \ 7 引入的语言结构 `try-with-resources` 是比 Finalizers 更好的替代方案，它可以编写出如下代码：\n\n```java\n\
    try { \n    final InputStream in = Files.newInputStream(path); \n    // 此处编写代码\n\
    } \n```\n\n## 1.3 静态初始化\n\n到目前为止我们查看了类的初始化和构造。但 Java 还支持一种类层级的初始化结构，称为静态初始化器。它们与初始化块非常相似，只是多了一个\
    \ `static` 关键字。请注意，静态初始化是每个类加载器执行一次的。例如：\n\n```java\npackage com.javachegeeks.advanced.construction;\n\
    \npublic class StaticInitializationBlock {\n    static {\n        // 此处编写静态初始化代码\n\
    \    }\n}\n```\n\n与初始化块类似，你可以在类定义中包含任意数量的静态初始化块，它们将按照它们在代码中出现的顺序被执行。例如：\n\n```java\n\
    package com.javachegeeks.advanced.construction;\n\npublic class StaticInitializationBlocks\
    \ {\n    static {\n        // 此处编写静态初始化代码\n    }\n\n    static {\n        // 此处编写静态初始化代码\n\
    \    }\n}\n```\n\n由于静态初始化可以从多个并行线程中触发（当第一次加载该类时），Java 运行时保证它只会被执行一次，并且以线程安全的方式执行。\n\
    \n## 1.4 构造模式\n\n多年来，Java 社区中出现了一些广为人知且广泛应用的构造（或创建）模式。我们将涵盖其中最著名的：单例、工具类、工厂和依赖注入。\n\
    \n### 1.4.1 单例 (Singleton)\n\n单例是社区中历史悠久且充满争议的模式之一。基础上说，它的核心思想是确保在给定时间内只能创建一个类的唯一实例。以下是一个朴素的版本：\n\
    \n```java\npackage com.javachegeeks.advanced.construction;\n\npublic class NaiveSingleton\
    \ {\n    private static NaiveSingleton instance;\n\n    public static NaiveSingleton\
    \ getInstance() {\n        if (instance == null) {\n            instance = new\
    \ NaiveSingleton();\n        }\n        return instance;\n    }\n}\n```\n\n有人可能会认为，引入一个新的工厂方法并没有太大意义，但使用这种模式通常会让代码更具可读性。使其变得正确的的方法之一是使用显式同步同步：\n\
    \n```java\npackage com.javachegeeks.advanced.construction;\n\npublic class NaiveSingleton\
    \ {\n    private static NaiveSingleton instance;\n\n    private NaiveSingleton()\
    \ {\n    }\n\n    public static NaiveSingleton getInstance() {\n        if (instance\
    \ == null) {\n            instance = new NaiveSingleton();\n        }\n      \
    \  return instance;\n    }\n}\n```\n\n如果你不想浪费资源，并希望单例是懒加载的：\n\n```java\npackage\
    \ com.javachegeeks.advanced.construction;\n\npublic class LazySingleton {\n  \
    \  private static LazySingleton instance;\n\n    private LazySingleton() {\n \
    \   }\n\n    public static synchronized LazySingleton getInstance() {\n      \
    \  if (instance == null) {\n            instance = new LazySingleton();\n    \
    \    }\n        return instance;\n    }\n}\n```\n\n### 1.4.2 工具类 (Utility/Helper\
    \ Class)\n\n工具类或辅助类是许多 Java 开发者使用的模式。基本上，它代表一个不可实例化的类（构造函数声明为私有），可选声明为 `final`，并且仅包含静态方法。例如：\n\
    \n```java\npackage com.javachegeeks.advanced.construction;\n\npublic class HelperClass\
