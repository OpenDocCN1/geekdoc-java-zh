    \n# 3.11 继承与组合\n\n幸运的是，继承并不是设计类的唯一方法。另一种被许多开发者认为比继承更好的替代方案是“组合”（composition）。这个想法非常简单：与其构建类层次结构，不如类应该由其他类组合而成。\n\
