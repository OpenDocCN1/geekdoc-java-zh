    \ the source code\n\nYou can download the source code of this lesson here: advanced-java-part-14\n\
    \n## 14.7 What's next\n\nIn this part of the tutorial we have taken a deep look\
    \ on annotation processors and the ways they help to inspect the source code,\
    \ mutate (modify) resulting bytecode or generate new Java source files or resources.\
    \ Annotation processors are very often used to free up Java developers from writing\
    \ tons of boilerplate code by deriving it from annotations spread across codebase.\
    \ The next section of the tutorial we are going to take a look on Java agents\
    \ and the way to manipulate how JVM interprets bytecode at runtime.\n\n# Chapter\
    \ 15\n\n# Java Agents\n\n## 15.1 Introduction\n\nIn this last part of the tutorial\
    \ we are going to talk about Java Agents, a real black magic for regular Java\
    \ developers out there. Java agents are able to \"intrude\" into the execution\
    \ of Java applications running on the JVM at runtime by performing the direct\
    \ modifications of the bytecode. Java agents are extremely powerful as dangerous:\
    \ they can do everything however if something goes wrong, they can easily crash\
    \ the JVM.\n\nThe goal of this part is to densify Java agents by explaining how\
    \ they work, how to run them and showing off some simple examples where Java agents\
    \ come as a clear advantage.\n\n## 15.2 Java Agent Basics\n\nIn essence, a Java\
    \ agent is a regular Java class that follows a set of strict conventions. The\
    \ agent class must implement a `public static void premain(String agentArgs, Instrumentation\
    \ inst)` method which becomes an agent entry point (similar to the `main` method\
    \ for regular Java applications).\n\nOnce the Java Virtual Machine (JVM) has initialized,\
    \ each `premain(String agentArgs, Instrumentation inst)` method of every agent\
    \ will be called.\n\nThe Java Virtual Machine (JVM) has initialized, each `premain(String\
    \ agentArgs, Instrumentation inst)` method of every agent will be called in the\
    \ order.\n\n# Advanced java\n\n| Manifest Attribute | Description |\n|---|---|\n\
    | Premain-Class | When an agent is specified at launch time this attribute defines\
    \ the agent class the premain method. This is required and the JVM will abort\
    \ if not present. |\n| Agent-Class | If the agent is specified at runtime this\
    \ attribute specifies the agent class the agentmain method. This is required.\
    \ |\n| Boot-Class-Path | A list of paths to be searched by bootstrap class loader.\
    \ |\n| Redefine-Classes | A value of true,case-insensitive and defines the ability\
    \ to redefine classes needed by this agent. This attribute is optional. |\n| Can-Transform-Classes\
    \ | A value of true,case-insensitive and defines the ability to transform classes\
    \ needed by this agent. This attribute is optional. |\n| Can-Set-Method-Prefix\
    \ | A value of true,case-insensitive and defines the ability to set method prefix\
    \ needed by this agent. This attribute is optional. |\n\nFigure 15.1: Java Agent\
    \ Attributes\n\n## 15.3 Java Agent Instrumentation\n\nThe instrumentation capabilities\
    \ of Java agents are truly unlimited. Most noticeable ones include:\n\n- Ability\
    \ to redefine classes at run-time. The redefining may change method bodies, the\
    \ constant pool and attributes. The redefinition must not add, or rename fields,\
    \ change the signatures of methods, or change inheritance.\n- Ability to transform\
    \ classes at run-time. The transformation may change method bodies, the constant\
    \ pool and attributes. The transformation must not add, or rename fields, change\
    \ the signatures of methods, or change inheritance.\n- Ability to modify the failure\
    \ handling of native method resolution by using retry with a prefix applied to\
    \ the name.\n\n## 15.4 Writing Your First Java Agent\n\nIn this section we are\
    \ going to write to write a simple Java agent by implementing our class transformer.\
    \ With that said, the only disadvantage of working with Java agents is that in\
    \ order accomplish any or less useful transformation, bytecode manipulation skills\
    \ are required. And, unfortunately, the Java standard library does not provide\
    \ any API (at least, documented ones) to make those bytecode manipulation possible.\n\
    \nTo fill this gap, bytecode manipulation can come with such an event and at this\
    \ moment very more libraries, such as Javassist and ASM, just to name a few. Those\
    \ of Javais is much simpler to use and that it became the reason we are going\
    \ to employ as a bytecode manipulation library.\n"
