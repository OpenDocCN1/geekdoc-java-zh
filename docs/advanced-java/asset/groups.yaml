- md: "\n## Advanced java\n\nSecondly, follow the proper initialization: if the field\
    \ is the reference to a collection or array, do not assign those fields from constructor\
    \ arguments, make the copies inside. It will guarantee that state of the collection\
    \ or array will not be changed from outside.\n\n```java\npublic ImmutableClass(final\
    \ long id, final String[] arrayStrings, final Collection<String> collectionOfString)\
    \ {\n    this.id = id;\n    this.arrayStrings = Arrays.copyOf(arrayStrings, arrayStrings.length);\n\
    \    this.collectionOfString = new ArrayList<>(collectionOfString);\n}\n```\n\n\
    And lastly, follow the proper access getters. For the collection, the immutable\
    \ view should be exposed using Collections.unmodifiableXxx wrappers.\n\n```java\n\
    public Collection<String> getCollectionOfString() {\n    return Collections.unmodifiableCollection(collectionOfString);\n\
    }\n```\n\nWith arrays, the only way to ensure true immutability is to provide\
    \ a copy of returning reference to the array. That might not be acceptable from\
    \ a practical standpoint as it depends on size and may put a lot of pressure on\
    \ garbage collector.\n\n```java\npublic String[] getArrays() {\n    return Arrays.copyOf(arrayStrings,\
    \ arrayStrings.length);\n}\n```\n\nEven this simple gives a good example that\
    \ immutability is not a first citizen in Java. Things can get easily complicated\
    \ if an immutable class has referencing another class instances. Those classes\
    \ should also be immutable because there is no simple way to avoid.\n\nThere are\
    \ a couple of Java source code analyzers like FindBugs and PMD which may help\
    \ you inspecting your code and pointing to the common Java programming flows.\
    \ These tools are great friends of any Java developer.\n\n## 3.7 Anonymous classes\n\
    \nIn the Pre-Java 8 era, anonymous classes were the only way to provide in-place\
    \ class definitions and immediate instantiations. The purpose of anonymous classes\
    \ was to reduce boilerplate and provide a concise and easy way to represent classes\
    \ as expressions. Let us take a look at the old-fashioned way to spawn new thread\
    \ in Java:\n\n```java\npackage com.javacodegeeks.advanced.design;\n\npublic class\
    \ AnonymousClass {\n    public static void main(String[] args) {\n        new\
    \ Thread(\n            // Example of creating anonymous class which implements\n\
    \            // Runnable\n            new Runnable() {\n                @Override\n\
    \                public void run() {\n                    // Implementation here\n\
    \                }\n            }\n        ).start();\n    }\n}\n```\n\nIn this\
    \ example, the implementation of the Runnable interface is provided in place as\
    \ anonymous. Although there are some limitations associated with anonymous classes,\
    \ the fundamental disadvantages of their usage are a quite verbose constructs\
    \ which Java imposes as a language. The simplest anonymous class which does nothing\
    \ requires at 5 lines of code to be written every time.\n\n```java\nnew Runnable()\
    \ {\n    @Override\n    public void run() {\n    }\n}\n```\n\nLuckily, with Java\
    \ 8, lambdas and functional interfaces all this boilerplate is about to go away,\
    \ finally making the Java code to look concise.\n\n```java\npackage com.javacodegeeks.advanced.design;\n\
    public class AnonymousClass {\n    public static void main(String[] args) {\n\
    \        new Thread(() -> { /* Implementation here */ }).start();\n    }\n}\n\
    ```\n\n## 3.8 Visibility\n\nWe have already talked a bit about Java visibility\
    \ and accessibility rules in part 1 of the tutorial, How to design Classes and\
    \ Interfaces. In this part we are going to get back to this subject again in the\
    \ context of subclassing.\n\nTable 3.1: datasheet\n\n| Modifier | Package | Subclass\
    \ | Everyone Else |\n| --- | --- | --- | --- |\n| public | accessible | accessible\
    \ | Accessible |\n| protected | accessible | accessible | not accessible |\n|\
    \ <no modifier> | accessible | not accessible | not accessible |\n| private |\
    \ not accessible | not accessible | not accessible |\n\nDifferent visibility levels\
    \ allow or disallow the classes to see other classes or interfaces (for example,\
    \ if they are in different packages or nested in one other) or subclasses to see\
    \ and access methods, constructors and fields of their parents.\nIn next section,\
    \ Inheritance, we are going to see that in action.\n\n## 3.9 Inheritance\n\nInheritance\
    \ is one of the key concepts of object-oriented programming, serving as a base\
    \ of class relationships. Combined together with visibility and accessibility\
    \ rules, inheritance allows designing extensible and maintainable class hierarchies.\n\
    Conceptually, inheritance in Java is implemented using subclassing and the extends\
    \ keyword, followed by the parent class. The subclass inherits all of the public\
    \ and protected members of its parent class. Additionally, a subclass inherits\
    \ the package-private members of its parent class if both reside in the same package.\
    \ Having said that, it is very important no matter what you are trying to design,\
    \ to keep the minimal set of the methods which exposes publicly or to its subclasses.\
    \ For example, let us take a look at a Parent and its subclass Child to demonstrate\
    \ different visibility levels and their effect:\n\n```java\npackage com.javacodegeeks.advanced.design;\n\
    \npublic class Parent {\n    // Everyone can see it\n    public static final String\
    \ CONST = \"Constant\";\n}\n\n// No one can access it\nprivate String privateField;\n\
    // Only subclasses can access it\nprotected String protectedField;\n\n// No one\
    \ can see it\nprivate class PrivateClass {\n}\n\n// Only visible to subclasses\n\
    protected interface ProtectedInterface {\n}\n\n// Everyone can call it\npublic\
    \ void publicAction() {\n}\n\n// Only subclass can call it\nprotected void protectedAction()\
    \ {\n}\n\n// No one can call it\nprivate void privateAction() {\n}\n\n// Only\
    \ subclasses in the same package can call it\nvoid packageAction() {\n}\n```\n\
    \n```java\npackage com.javacodegeeks.advanced.design;\n// Resides in the same\
    \ package as parent class\npublic class Child extends Parent.ProtectedInterface\
    \ {\n    @Override\n    protected void protectedAction() {\n        // Calls parent's\
    \ method implementation\n        super.protectedAction();\n    }\n\n    @Override\n\
    \    void packageAction() {\n        // Do nothing, call to parent's method implementation\n\
    \    }\n\n    public void childAction() {\n        this.protectedField = \"value\"\
    ;\n    }\n}\n```\n\nInheritance is a very large topic, with a lot of subtle details\
    \ specific to Java. However, there are a couple of easy to follow rules which\
    \ could keep your class hierarchies concise. In Java, any subclass may override\
    \ any inherited method of its parent unless declared as final (refer to the Final\
    \ classes and methods).\n\nHowever, there is no syntax or keyword to mark the\
    \ method being overridden which might cause a lot of confusion. That is why the\
    \ @Override annotation has been introduced: whenever your intention is to override\
    \ the inherited method, always use the @Override annotation to indicate that.\n\
    \nAnother dilemma Java developers are often facing in design building class hierarchies\
    \ (with concrete or abstract classes) interface implementations. It is strongly\
    \ advised to prefer interfaces over abstract classes when possible. Interfaces\
    \ are much more lightweight, easier to test (using mocks) and maintain, plus they\
    \ minimize the side effects of implementation. Many advanced techniques like creating\
    \ class proxies in standard library heavily rely on interfaces.\n\n## 3.10 Multiple\
    \ inheritance\n\nIn contrast to C++ and some other languages, Java does not support\
    \ multiple inheritance: in Java every class has exactly one direct parent (Object\
    \ class being on top of the hierarchy as we already know from part 2 of the tutorial,\
    \ Using methods to all objects). However, the class can implement multiple interfaces\
    \ and stacking interfaces is the only way to achieve (or mimic) multiple inheritance\
    \ in Java.\n\n```java\npackage com.javacodegeeks.advanced.design;\n\npublic class\
    \ MultipleInterfaces implements Runnable, AutoCloseable {\n    @Override\n   \
    \ public void run() {\n        // Some implementation here\n    }\n\n    @Override\n\
    \    public void close() throws Exception {\n        // Some implementation here\n\
    \    }\n}\n```\n\nImplementation of multiple interfaces is fact quite powerful,\
    \ but often the need to reuse an implementation leads to deep class hierarchies\
    \ as way to overcome the absence of multiple inheritance support.\n\n```java\n\
    public class A implements Runnable {\n    @Override\n    public void run() {\n\
    \        // Some implementation here\n    }\n}\n```\n\n> Class B wants to inherit\
    \ the implementation of run() method from class A.\n\n```java\npublic class B\
    \ extends A implements AutoCloseable {\n    @Override\n    public void close()\
    \ throws Exception {\n        // Some implementation here\n    }\n}\n```\n\n>\
    \ Class C wants to inherit the implementation of run() method from class A\n//\
    \ and the implementation of close() method from class B.\n\n```java\npublic class\
    \ C extends B implements Readable {\n    @Override\n    public int read(java.nio.CharBuffer\
    \ cb) throws IOException {\n        // Some implementation here\n    }\n}\n```\n\
    \nAnd so on... Recent Java 8 release somewhat addressed the problem with the introduction\
    \ of default methods. Because of default methods, interfaces have started to provide\
    \ not only contract but implementation, the classes which implement them are automatically\
    \ inheriting these implemented methods as well. For example:\n\n```java\npackage\
    \ com.javacodegeeks.advanced.design;\n\npublic interface DefaultMethods extends\
    \ Runnable, AutoCloseable {\n    @Override\n    default void run() {\n       \
    \ // Some implementation here\n    }\n}\n```\n"
  mdcn: "\n\n## 高级 Java\n\n其次，遵循适当的初始化方法：如果字段是集合或数组的引用，不要直接从构造函数参数为这些字段赋值，而是在内部进行浅拷贝。这可以保证集合或数组的状态不会从外部被修改。\n\
    \n```java\npublic ImmutableClass(final long id, final String[] arrayStrings, final\
    \ Collection<String> collectionOfString) {\n    this.id = id;\n    this.arrayStrings\
    \ = Arrays.copyOf(arrayStrings, arrayStrings.length);\n    this.collectionOfString\
    \ = new ArrayList<>(collectionOfString);\n}\n```\n\n最后，遵循正确的 getter 方法get。对于集合，应该使用\
    \ `Collections.unmodifiableXxx` 包装器暴露不可变视图。\n\n```java\npublic Collection<String>\
    \ getCollectionOfString() {\n    return Collections.unmodifiableCollection(collectionOfString);\n\
    }\n```\n\n对于数组，确保真正不可变性的唯一方法是返回一个数组的副本引用。从实际角度来看，这可能是不可接受的，因为它取决于数组的大小，可能会给垃圾收集器带来很大压力。\n\
    \n```java\npublic String[] getArrays() {\n    return Arrays.copyOf(arrayStrings,\
    \ arrayStrings.length);\n}\n```\n\n即使这种简单的做法也提供了一个很好的例子，说明不可变性在 Java 中并不是原生公民。如果一个不可变类引用了其他类的实例，情况就会变得非常复杂。那些类也应该是不可变的，因为没有简单的方法可以避免这一点。\n\
    \n有几个像 FindBugs 和 PMD 这样的 Java 源码分析工具，可以帮助你检查代码并指出常见的 Java 编程问题。这些工具是任何 Java 开发者的好朋友。\n\
    \n## 3.7 匿名类\n\n在 Java 8 之前的时代，匿名类是提供就地类定义和即时实例唯一方式。匿名类的目的是减少样板代码，并提供一种简洁方便的方式将类表示为表达式。让我们来看看\
