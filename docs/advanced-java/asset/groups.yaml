    \ type declaration is intended to be a functional interface, as defined by the\
    \ Java Language Specification (more details about functional interfaces are covered\
    \ in the part 3 of the tutorial, How to design Classes and Interfaces). |\n| @Repeatable\
    \ | Indicates that the marked annotation can be applied more than once to the\
    \ same declaration or use type (for more details please refer to Repeatable annotations\
    \ section). |\n"
