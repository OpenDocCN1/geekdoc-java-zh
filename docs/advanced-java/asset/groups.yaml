    \n## 第 6 章\n\n## 如何高效地编写方法\n\n## 6.1 引言\n\n在教程的这一节中，我们将花一些时间讨论与 Java 方法设计和实现相关的不同方面。正如我们在教程之前的部分中看到的，在\
    \ Java 中编写方法非常简单，但有很多方法可以使你的方法更具可读性和更高效。\n\n## 6.2 方法签名\n\n正如我们所熟知的，Java 是一种面向对象的语言。因此，Java\
    \ 中的每个方法都属于某个类实例（如果是静态方法则属于类本身），具有可见性（或访问权限）规则，可以声明为抽象（abstract）或最终（final）等。然而，可以说，方法最重要的部分是它的签名：返回类型和参数，外加方法实现可能抛出的受检异常（checked\
    \ exceptions）列表（但这部分现在较少使用）。这里有一个简单的示例：\n\n```java\npublic static void main(String[]\
    \ args) {\n    // 此处是实现\n}\n```\n\n该方法接受一个字符串数组作为唯一参数且不返回任何内容。如果能保持所有方法都像 `main`\
    \ 一样简单就好了。但实际上，方法签名可能会变得不可读。让我们来看：\n\n```java\npublic void setTitleVisible(int\
    \ length, String title, boolean visible) {\n    // 此处是实现\n}\n```\n\n首先要到，根据约定，Java\
    \ 中的方法名采用驼峰命名法（camel case），例如：setTitle。这个名字起得很好，描述了该方法应该做什么。\n\n其次，每个参数的名称（至少）描述了它的用途。为方法找到合适的、具有解释性的名称很重要，而不是使用\
    \ `int i`、`String`、`boolean f`（尽管在某些情况下这样做是有意义的）。\n\n第三，该方法只接受三个参数。虽然 Java 对参数数量限制非常高，但强烈建议将此数字保持在\
    \ 6 以下。超过这个点，方法签名就会变得难以理解。\n\n自 Java 5 发布以来，方法可以使用特殊语法拥有具有相同类型的可变参数列表（称为变长参数 varargs），例如：\n\
    \n```java\npublic void find(String... elements) {\n    // 此处是实现\n}\n```\n\n##\
    \ 高级 Java 48 / 113\n\n在内部，Java 编译器会将变长参数转换为相应类型的数组，方法实现通过这种方式访问变长参数。\n\n有趣的是，Java\
    \ 还允许使用泛型类型参数来声明变长参数。然而，由于参数的类型是未知的，编译器希望确保变长参数被被负责任地使用，并且该方法必须是 `final` 的并标记了\
    \ `@SafeVarargs` 注解（关于注解的更多细节见教程的第 5 部分，“何时以及如何使用枚举和注解”）。例如：\n\n```java\n@SafeVarargs\n\
    final public <T> void find(T ... elements) {\n    // 此处是实现\n}\n```\n\n另一种方法是使用\
    \ `@SuppressWarnings` 注解\n\n```java\n@SuppressWarnings(\"unchecked\")\npublic\
    \ <T> void findSuppressed(T ... elements) {\n    // 此处是实现\n}\n```\n\n下一个示例演示了将受检异常作为方法签名的一部分使用。近年来，受检异常证明其并没有预期的那样有用，导致了编写更多的样板代码并引发了许多问题。\n\
    \n```java\npublic void write(File file) throws IOException\n// 此处是实现\n```\n\n\
    最后但同样重要的是，通常建议（尽管很少这样做）将参数标记为 `final`。这有助于消除在方法参数被赋予不同值时的糟糕代码习惯。此外，此类方法可以被匿名类使用（关于匿名类的更多细节见教程的第\
    \ 3 部分，“如何设计类和接口”，尽管 Java 8 通过引入有效最终变量（effectively final variables）引入了这一限制）。\n\
    \n## 6.3 方法体\n\n每个方法都有自己的实现和存在的目的。然而，有几个通用指南对于有助于编写整洁且易理解的方法。\n\n可能最重要的是单一职责原则（single\
    \ responsibility principle）：以一种方式实现方法，使得每个方法只做一件事并把它做好。遵循这一原则可能会增加类的数量，因此保持正确的平衡至关重要。\n\
    \n最后（但同样）建议与使用 `return` 语句有关。如果一个方法返回某些值，尽量减少调用 `return` 语句的地方（有些人可能更进一步，建议在所有情况下都使用\
    \ `return` 语句）。方法中的 `return` 语句越多，追踪其逻辑流和修改（或重构）实现就越困难。\n\n## 6.4 方法重载\n\n重载（overloading）技术通常用于为不同的参数类型或组合提供专门版本的方法。虽然方法保持不变，但编译器会根据调用点的实际参数值选择正确的替代方案（重载的最佳示例是\
    \ Java 中的构造函数：名称始终相同，但参数集不同），或者在未找到时抛出编译器错误。例如：\n\n## 高级 Java\n\n```java\npublic\
    \ String numberToString( Long number ) {\n    return Long.toString();\n}\n\npublic\
    \ String numberToString( BigDecimal number ) {\n    return number.toString();\n\
    }\n```\n\n方法重载与泛型相似（关于泛型的更多细节见教程第 4 部分，“何时以及如何使用枚举和注解”），然而它用于泛型方法不起通的情况，且每个（大多数）泛型类型参数都需要自己的实现。尽管如此，泛型和重载结合非常强大，但在\
    \ Java 中是不可能的，这是因为类型擦除（type erasure）（更多细节请参阅教程第 4 部分）。让我们来看这个示例：\n\n```java\n\
    public <T extends Number> String numberToString( T number ) {\n    return number.toString();\n\
    }\n\npublic String numberToString( BigDecimal number ) {\n    return number.toString();\n\
    }\n```\n\n虽然这段代码不使用泛型也能运行，但对于我们的演示很重要。有趣的地方在于，`toString` 方法针对 `BigDecimal` 有专门的重载，并为所有其他数字提供了通用版本。\n\
    \n## 6.5 方法重写\n\n我们在教程的第 3 部分“如何设计类和接口”中讨论过方法重写。在本节中，当我们已经了解方法重写时，我们将展示为什么 `@Override`\
    \ 注解很重要。我们的示例将演示简单类层次结构中方法重写和重载之间的细微区别。\n\n```java\npublic class Parent {\n  \
    \  public Object toobject( Number number ) {\n        return number.toString();\n\
    \    }\n}\n```\n\n`Parent` 类只有一个 `toobject` 方法。让我们对该类进行子类并尝试实现数字转换为字符串（而不是原始对象）的方法版本。\n\
    \n```java\npublic class Child extends Parent {\n    @Override\n    public String\
    \ toobject( Number number ) {\n        return number.toString();\n    }\n}\n```\n\
    \n无论 `Child` 类中 `toobject` 方法的签名如何（更多细节请参见协变返回类型 Covariant return types），它重写了父类的方法，Java\
    \ 编译器对此没有意见。现在，我们在 `Child` 类中添加另一个方法。\n\n```java\npublic class Child extends Parent\
    \ {\n    public String toobject( Double number ) {\n        return number.toString();\n\
    \    }\n}\n```\n\n"
