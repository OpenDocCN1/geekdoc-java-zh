    \ 113\n\nCopyright (c) Exelixis Media P.C., 2015\n\nAll rights reserved. Without\
    \ limiting the rights under copyright reserved above, no part of this publication\
    \ may be reproduced, stored or introduced into a retrieval system, or transmitted,\
    \ in any form or by any means (electronic, mechanical, photocopying, recording\
    \ or otherwise), without the prior written permission of the copyright owner.\n\
    \n# Preface\n\nLearning the basics of Java is easy. But really delving into the\
    \ language and studying its more advanced concepts and nuances is what will make\
    \ you a great Java developer. The web is abundant with “soft\", “cheap\", “low\
    \ end” Java tutorials, but what it is missing is material to really take you to\
    \ the next level.\n\nThis book is designed to help you make the most effective\
    \ use of Java. It discusses advanced topics, including object creation, concurrency,\
    \ serialization, reflection and many more. It will guide you through your journey\
    \ to Java mastery!\n\n# About the Author\n\nAndriy completed his Master Degree\
    \ in Computer Science at Zhitomir Institute of Engineering and Technologies, Ukraine.\
    \ For the last fifteen years he has been working as the Consultant/Software Developer/Senior\
    \ Software Developer/Team Lead for a many successful projects including huge software\
    \ systems for customers from North America and Europe.\n\nThrough his career Andriy\
    \ has gained a great experience in enterprise architecture, web development (ASP.NET,\
    \ Java Server Faces, Play Framework), software development practices (test-driven\
    \ development, continuous integration) and software platforms (Sun JEE, Microsoft\
    \ .NET), object-oriented analysis and design, development of the rich user interfaces\
    \ (MFC, Swing, Windows Forms/WPF), relational database management systems (MySQL,\
    \ SQL Server, PostgreSQL, Oracle), NoSQL solutions (MongoDB, Redis) and operating\
    \ systems (Linux/Windows).\n\nAndriy has a great experience in development of\
    \ distributed (multi-tier) software systems, multi-threaded applications, desktop\
    \ applications, service-oriented architecture and rich Internet applications.\
    \ Since 2006 he is actively working primarily with JEE / JSP platforms.\n\nAs\
    \ a professional he is always open to continuous learning and self-improvement\
    \ to be more productive in the job he is really passionate about.\n\n# Chapter\
    \ 1\n\n# How to create and destroy objects\n\n## 1.1 Introduction\n\nJava programming\
    \ language, originated in Sun Microsystems and released back in 1995, is one of\
    \ the most widely used programming-languages in the world, according to TIOBE\
    \ Programming Community Index. Java is a general-purpose programming language.\
    \ It is attractive to software developers primarily due to its powerful library\
    \ and runtime, simple syntax, rich set of supported platforms (Write Once, Run\
    \ Anywhere - WORA) and awesome community.\n\nIn this tutorial we are going to\
    \ cover Java concepts, assuming that our readers already have some basic knowledge\
    \ of the language. It is by no means a complete reference, rather a detailed guide\
    \ to move your Java skills to the next level.\n\nAlong the course, there will\
    \ be a lot of code snippets to look at. Where it makes sense, the same example\
    \ will be presented using Java 7 syntax as well as Java 8 one.\n\n## 1.2 Instance\
    \ Construction\n\nJava is object-oriented language and as such the creation of\
    \ new class instances (objects) is, probably, the most important concept of it.\
    \ Constructors are playing a central role in new class instance initialization\
    \ and Java provides a couple of favors to define them.\n\n### 1.2.1 Implicit (Generated)\
    \ Constructor\n\nJava allows to define a class without any constructors but it\
    \ does not mean the class will not have any. For example, let us consider this\
    \ class:\n\n```java\npackage com.javacodgeeks.advanced.construction;\npublic class\
    \ NoConstructor {\n}\n```\n\nThis class has no constructor but Java compiler will\
    \ generate one implicitly and the creation of new class instances will be possible\
    \ using new keyword.\n\n```java\nfinal NoConstructor noConstructorInstance = new\
    \ NoConstructor();\n```\n\n## 1.2 Constructors without Arguments\n\nThe constructor\
    \ without arguments (or no-arg constructor) is the simplest way to do Java compiler's\
    \ job explicitly.\n\n```java\npackage com.javacodegeeks.advanced.construction;\n\
    public class NoArgConstructor {\n    public NoArgConstructor() {\n        // Constructor\
    \ body here\n    }\n}\n```\n\nThis constructor will be called once new instance\
    \ of the class is created using the new keyword.\n```java\nfinal NoArgConstructor\
    \ noArgConstructor = new NoArgConstructor();\n```\n\n## 1.2.3 Constructors with\
    \ Arguments\n\nThe constructors with arguments are the most interesting and useful\
    \ way to parameterize class instances creation. The following example defines\
    \ a constructor with two arguments.\n\n```java\npackage com.javacodegeeks.advanced.construction;\n\
    \npublic class ConstructorWithArguments{\n    public ConstructorWithArguments(final\
    \ String arg1,final String arg2) {\n        // Constructor body here\n    }\n\
    }\n```\n\nIn this case, when instance is being created using the new keyword,\
    \ both constructors should be provided.\n```java\nfinal ConstructorWithArguments\
    \ ConstructorWithArguments = new ConstructorWithArguments(\"arg1\",\"arg2\");\n\
    ```\n\nInterestingly, the constructors can call each other using the special this.\
    \ It is considered a good practice to chain constructors in such way reduces code\
    \ duplication and basically having single entry point.\n```java\npublic ConstructorWithArguments(final\
    \ String arg1) {\n    this(arg1);\n}\n```\n\n## 1.2.4 Initialization Blocks\n\n\
    Java has another way to provide initialization logic using initialization blocks.\
    \ This feature is rarely used but it is better to know it.\n\n```java\npackage\
    \ com.javacodeeks.advanced.construction;\n\npublic class InitializationBlock {\n\
    \    // initialization code\n}\n```\n\nIn a certain way, the initialization block\
    \ might be treated as anonymous no-arg constructor. The particular class may have\
    \ multiple initialization blocks and they will be called in the order they are\
    \ defined in the code. For example:\n\n```java\npackage com.javacodeeks.advanced.construction;\n\
    public class InitializationBlocks {\n``````java\n{\n  // initialization code\n\
    }\n{\n  // initialization code\n}\n```\n\nInitialization blocks do not replace\
    \ the constructors and may be used along with them. But it is very important to\
    \ mention that initialization blocks are always called before any constructor.\n\
    \n```java\npackage com.javacecodeeks.advanced.construction;\npublic class InitializationBlockAndConstructor\
    \ {\n  // initialization code\n}\n  public InitializationBlockAndConstructor()\
    \ {\n}\n```\n\n## 1.2.5 Construction guarantee\n\nJava provides certain initialization\
    \ guarantees that developers may rely on. Uninitialized instance and class (static)\
    \ variables are automatically initialized to their default values.\n\nTable 1.1:\
    \ datasheet\n\n| Type | Default Value |\n|---|---|\n| boolean | False |\n| byte\
    \ | 0 |\n| short | 0 |\n| int | 0 |\n| long | 0 |\n| char | u0000 |\n| float |\
    \ 0.0 |\n| double | 0.0d |\n| object reference | null |\n\nLet us confirm that\
    \ using following class as a simple example:\n\n```java\npackage com.javacecodeeks.advanced.construction;\n\
    public class InitializationWithDefaults {\n  private boolean booleanMember;\n\
    \  private byte byteMember;\n  private short shortMember;\n  private int intMember;\n\
    \  private long longMember;\n  private char charMember;\n  private float floatMember;\n\
    \  private double doubleMember;\n  private Object referenceMember;\n}\n```\n"
