    \nAlthough in Java 8 the repeatable features requires a bit of work to do in order\
    \ to allow your annotation to be repeatable (@Repeatable), the final result is\
    \ worth: more clean and annotated code.\n\n## 5.14 Annotation processors\n\nThe\
    \ Java compiler supports a special kind of plugins called annotation processors\
    \ (using the -processor command line argument) which could process the annotations\
    \ during the compilation phase. Annotation processors can analyze the annotations\
    \ usage (perform static analysis), create additional Java source files or resources\
