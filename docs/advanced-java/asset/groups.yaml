    \ MethodHandle methodHandle = lookup.findVirtual(String.class, \"length\", methodType);\n\
    final length = (int) methodHandle.invoke(\"sample\");\n```\n\n上面的示例展示了如何使用方法句来动态调用方法。这比传统的反射快得多，因为\
    \ JVM 可以优化方法句。\n\n反射 API 的这一特性通常被测试脚手架或依赖注入框架使用，以便访问内部的（或不可的）实现细节。请在你的应用程序中尽量避免使用它，除非你别无其他选择。\n\
    \n## 11.7 方法名称\n\n开发者多年来面临已知问题是参数名称在运行时不会被保留。然而，通过 `-parameters` 编译器选项，我们现在可以使用反射来提取它们：\n\
    \n```java\nMethod method = MyClass.class.getMethod(\"myMethod\");\nfor (Parameter\
    \ parameter : method.getParameters()) {\n    System.out.println(parameter.getName());\n\
    }\n```\n\n## 11.8 下载源代码\n\n如果你想查看反射 API 的源代码，可以从官方 Java 文档下载。\n\n## 11.9 接下来\n\
    \n在教程的这部分中，我们涵盖了反射 API。在下一部分，我们将讨论脚本和动态语言。\n\n## 第 12 章：动态语言\n\n# 动态支持\n\n###\
    \ 12.1 介绍\n\n在教程的这部分中，我们的注意力将完全集中在脚本语言和动态语言上。从 Java 7 开始，JVM 已经直接支持现代（脚本）语言，而\
    \ Java 8 在这一领域提供了更多的增强。\n\n动态语言的优势之一是程序的行为是在运行时定义的，而不是在编译时。我们将查看 Java 脚本 API 如何集成这些语言。\n\
    \n### 12.2 动态支持\n\n正如我们所知，Java 是一种静态类型语言。对于类，其成员和返回值在编译时是可用的。通过使用这些细节，Java 编译器确保了类型代码，这些代码可以被\
    \ JVM 高效解释。\n\n然而，动态语言在运行时进行类型检查，而不是编译时。处理动态语言的挑战在于如何实现一个运行时系统，在程序编译后选择最合适的方法进行调用。\n\
    \n### 12.3 脚本 API\n\n自 2006 年 Java 6 发布以来，新的脚本 API 通过 `javax.script` 包引入。这个可扩展的\
    \ API 设计用于接入任何脚本语言（提供脚本引擎实现）并运行在 JVM 平台上。\n\n"
