    The performAction() method tries to acquire lock1 and then lock2, while the method
    performAnotherAction() does it in the other order, lock2 and then lock1. If program
    execution flow these two methods are called from the same class in two different
    threads, the deadlock is very likely to happen: the first thread will be waiting
    indefinitely for the lock2 acquired by the second thread, while the second thread
    will be waiting indefinitely for the lock1 acquired by the first one.


    # 9.6 Thread Sulers


    In JVM, the thread scheduler determines which thread run and for how long. All
    threads created by Java applications have the priority which basically influences
    the thread scheduling algorithm when it makes a decision when thread is scheduled
    and its time quantum. This feature has a reputation of being non-portable (as
    every trick which relies on specific behavior of the thread scheduler).


    The Thread class also provide another way to intervene in thread scheduling by
    using a yield() method. It hints the thread scheduler that the current thread
    is willing to yield its current use of a processor time (and has a reputation
    of being non-portable).


    By and large, relying on the thread scheduler implementation details is not a
    great idea. That is why executors and pools from the Java standard library (please
    see Futures section) try not expose these non-portable details to the developers
    (but still leaving a way to do so if it is necessary). Nothing works better than
    careful design which take into account the real hardware the application is running
    on (f.e., number of available CPUs and cores could be retrieved using Runtime
    class).


    # 9.7 Atomic Operations


    In multithread world there is a particular set of instructions called compare-and-swap
    (CAS). These compare their values to given ones and and, only if they are the
    same, set a new given values. This is done as a single atomic operation which
    is usually lock-free and highly efficient.


    Java standard library has a list of classes supporting atomic operation, all of
    them located under java.util.concurrent.atomic package.


    | Class | Description |

    |---|---|n| AtomicBoolean | A boolean value that may be updated atomically |

    | AtomicInteger | An int value that may be updated atomically |

    | AtomicIntegerArray | A long value that may be updated atomically |

    | AtomicLongArray | A long array in which elements may be updated atomically |

    | AtomicReference<V> | An object reference that may be updated atomically |

    | AtomicReferenceArray<E> | An array of object references in which elements may
    be updated atomically |


    Figure 9.3: Atomic Classes


    The Java 8 release extends the java.util.concurrent.atomic with a new set of atomic
    operations (accumulators and adders).'
