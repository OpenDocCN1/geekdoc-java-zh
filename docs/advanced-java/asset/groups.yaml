    \ was not so great as of Java 8, there is new kind of lock:\nStampedLock: A capability-based\
    \ lock with three modes for controlling read/write access.\n\n# 9.10 Using Synchronization\
    \ Wisely\n\nLocking and synchronized keyword are powerful instruments which help\
    \ to keep the data model and state consistent in multithreaded applications. However,\
    \ using them wisely causes contention and could decrease application performance.\
    \ From the other side, not using synchronization primitives (and may will) lead\
    \ to a weird program state and corrupted data eventually causes application to\
    \ crash. So the balance is important.\n\nThe advice is to use locks or/and synchronized\
    \ where it is really necessary. While doing so, make sure that the locks are released\
    \ as soon as possible, and the blocks requiring locking or synchronization are\
    \ kept minimal. Techniques should at least help to reduce the contention but will\
    \ not eliminate it.\n\nIn recent years, the use of lock-free algorithms and data\
    \ structure have emerged (f.e, atomic operations in Java from Atomic Operations),\
    \ which may provide better performance compared to the equivalent implementations\
    \ which are built using synchronization primitives.\n\nIt is good to know that\
    \ JVM has a couple of runtime optimizations in order to eliminate the locking\
    \ when it is not necessary. The most is biased locking: an optimization that improves\
    \ uncontended synchronization performance by eliminating operations with the Java\
    \ synchronization primitives (for more details, refer to http://www.oracle.com/-technology/java/6-performance-137236.html#2.1.1).\n\
    \nNevertheless JVM does not, eliminating the unnecessary synchronization in the\
    \ application is much better. Excessive use of synchronization has a negative\
    \ impact on application performance as threads will be wasting expensive CPU cycles\
    \ competing for resources instead of doing real work.\n\n# 9.11 Wait/Notify\n\n\
    Prior to the introduction of the concurrency utilities in the Java standard library\
    \ (java.util.concurrent), the usage of Object's wait() / notify() /notifyAll()\
    \ methods was the way to establish communication between threads in Java. All\
    \ these methods must be called if the thread monitors on the object in question.\
    \ For example:\n\n```\nprivate Object lock = new Object();\n\npublic void performAction()\
    \ {\n    synchronized (<condition>) {\n        while (<condition>) {\n       \
    \     // Causes the thread to wait until\n            // another thread invokes\
    \ the lock() or notifyAll() methods.\n            lock.wait();\n        }\n\n\
    \        // Some implementation here\n    }\n}\n```\n\nMethod wait() releases\
    \ the lock monitor the thread holds because the condition it is waiting for is\
    \ not met (wait() must be called in a loop and never be called out of a loop).\
    \ Consequently, another waiting on the same monitor gets to lock. When this is\
    \ done, it should call one notify()/notifyAll() methods to wake up the thread\
    \ (threads) waiting for the monitor. For example:\n\n```\npublic void performAction()\
    \ {\n    synchronized (lock) {\n        // Some implementation here\n    }\n\n\
    \    // Wakes up a single thread that is waiting on this object's monitor.\n \
    \   lock.notify();\n}\n```\n\nThe difference between notify() and notifyAll()\
    \ is that the first wakes up a single thread while wakes up all waiting threads\
    \ (which stays to contend for the monitor).\n\nThe wait()/notify() idiom is not\
    \ advisable to be used in the modern Java applications. Not only is it complicated,\
    \ but also requires a set of mandatory rules. As such, it may cause bugs in the\
    \ running program which will be very hard and time-consuming to investigate. The\
    \ java.util.concurrent has a lot to replace the wait()/notify() with much simpler\
    \ alternatives (which will likely have much better performance in the real-world\
    \ scenario).\n\n# 9.12 Troubleshooting Concurrency Issues\n\nMany things can go\
    \ wrong in multithread applications. Debugging and troubleshooting can take hours\
    \ and days or weeks. Java Development Kit (JDK) provides a couple of tools which\
    \ we are able to provide some details about application threads and their states,\
    \ and deadlock conditions (see Threads thread groups and Locks sections). It is\
    \ a good point to start with. Those tools are (but not limited to):\n\n- VisualVM\
    \ (http://docs.oracle.com/java/7/docs/techniques/tools/share/jvisualm.html)\n\
    - Java Mission Control (http://docs.oracle.com/javacomponents/jmc.htm)\n- jstack\
    \ (https://docs.oracle.com/java/7/docs/techniques/tools/share/jstack.html)\n\n\
    # 9.13 Download\n\nYou can download the source code of this lesson here: advanced-java-part-9\n\
    \n# 9.14 What’s next\n\nIn this part we have looked through very important aspect\
    \ of modern software and hardware platforms - concurrency. In particular, we have\
    \ seen what kind of instruments Java as a language and its standard library offer\
    \ to developers help them dealing with concurrency and asynchronous executions.\
    \ In the next part of the tutorial we are going to cover serialization techniques\
    \ in Java.\n\n# Chapter 10\n\n# Built-in Serialization techniques\n\n# 10.1 Introduction\n\
    \nThis part of the tutorial is solely devoted to serialization: the process of\
    \ translating Java objects into a format that can be used to store and reconstructed\
    \ later in the same (or another) environment (http://en.wikipedia.org/wiki/Serialization).\
    \ Serialization not only allows saving and loading Java objects to/from the persistent\
    \ storage, but is also a very important component of modern distributed systems\
    \ communication.\n\nSerialization is not easy, but effective serialization is\
    \ even harder. Besides the Java standard library, there are many serialization\
    \ techniques and frameworks available: some of them are using compact binary representation,\
    \ others put the readability on the first place. Although we are going to mention\
    \ many alternatives along the way, our attention will be concentrated on the ones\
    \ from Java standard library (latest specifications): Serializable, Externalizable,\
    \ JSR222 and Java API for JSON Processing (JSON-P JSR-353).\n\n# 10.2 Serialization\
    \ interface\n\nArguably the easiest way to mark the class as serializable is by\
    \ implementing the java.io.Serializable interface.\n\n```\npublic class SerializableExample\
    \ implements Serializable {\n}\n```\n\nThe serialization runtime associates with\
    \ each serializable class a specific version number, called serialVersionUID,\
    \ which is used during deserialization (the process opposite to serialization)\
    \ to make sure that the classes for the serialized object are compatible. If the\
    \ compatibility has been compromised, the InvalidClassException will be raised.\n\
    \nA serializable class may introduce its own serialVersionUID by declaring a field\
    \ named serialVersionUID that must be static, final, and of type long:\n\n```\n\
    public class SerializableExample implements Serializable {\n    private static\
    \ final long serialVersionUID = 8894f7554319602846L;\n}\n```\n\nHowever, if a\
    \ class does not explicitly declare a serialVersionUID field, the serialization\
    \ runtime will generate a default serialVersionUID field for that class. It is\
    \ well to know that it is strongly recommended by all classes implementing Serializable\
    \ to explicitly declare the serialVersionUID field, because the default serialVersionUID\
    \ generation heavily on intrinsic class details and may vary depending on Java\
    \ compiler implementation and its version. As such, to guarantee a consistent\
    \ behavior, a serializable class must always declare an explicit serialVersionUID.\n\
    \nOnce the class becomes serializable (implements Serializable and declares serialVersionUID),\
    \ it could be stored and retrieved, for example, ObjectOutputStream/ObjectInputStream:\n"
  mdcn: "\n\n# 高级 Java\n\n...其中的它们，但请不要犹豫咨询 Java 官方文档并探索所有内容。\n\n| 类 |set |\n| ---\
    \ | --- |\n| CountDownLatch | 一种同步辅助，允许一个或多个线程等待其他线程执行的一组操作完成。 |\n| CyclicBarrier\
    \ | 一种同步辅助，允许一组线程等待彼此到达一个共同的屏障点。 |\n| Exchanger<V> | 一个同步点，线程可以在此处交换成对的元素。 |\n\
    | Phaser | 一种可重用的同步屏障，功能类似于 Cyclicbarrier 和 CountDownLatch，但支持更灵活的用法。 |\n| Semaphore\
    \ | 计数信号量。 |\n| ThreadLocalRandom | 限制当前线程的随机数生成器。 |\n| ReentrantReadWriteLock\
    \ | 读/写锁的实现。 |\n\n图 9.6: Java 8 原子类\n\n遗憾的是，在 Java 8 中，ReentrantReadWriteLock\
    \ 的 Java 实现并不完美，出现了一种新锁：\nStampedLock：一种基于能力的锁，具有三种模式用于控制读/写访问。\n\n# 9.10 明智地使用同步\n\
    \n锁（Locking）和 `synchronized` 关键字是强大的工具，有助于在多线程应用程序中保持数据模型和状态的一。然而，明智地使用它们会导致竞争并降低应用性能。另一方面，不使用同步原语（可能会）导致奇怪的程序状态和数据损坏，最终导致应用程序崩溃。因此，平衡是非常关重要的。\n\
    \n建议在确实需要的地方使用锁或/或 `synchronized`。在这样做时，确保尽快释放锁，并将需要锁定或同步的块块保持在最小范围内。这些技术至少应该有助于减少竞争，但不会消除竞争。\n\
    \n近年来，无锁算法和数据结构的使用已经出现（例如，来自 Atomic Operations 的 Java 原子操作），与使用同步原语构建的等效实现相比，它们可能提供更好的性能。\n\
    \n值得知道的是，JVM 有一些运行时优化以在不需要时消除锁定。最著名的是**偏向锁（biased locking）**：一种通过消除 Java 同步原语中的操作来提高无竞争同步性能的优化（更多细节，请参阅\
    \ http://www.oracle.com/-technology/java/6-performance-137236.html#2.1.1）。\n\n\
    尽管如此，JVM 并没有消除应用程序中不必要的同步，消除不必要的同步好得多。过度使用同步会对应用程序性能产生负面影响，因为线程将浪费贵的 CPU 周期来竞争资源，而不是执行实际工作。\n\
    \n# 9.11 Wait/Notify\n\n在 Java 标准库（`java.util.concurrent`）引入并发工具之前，使用 Object 的\
    \ `wait()` / `notify()` / `notifyAll()` 方法是 Java 中线程通信的方法。如果线程在相关对象上监控，则必须调用所有这些方法。例如：\n\
    \n```\nprivate Object lock = new Object();\n\npublic void performAction() {\n\
    \    synchronized (<condition>) {\n        while (<condition>) {\n           \
    \ // 导致线程等待直到\n            // 另一个线程调用 lock() 或 notifyAll() 方法。\n            lock.wait();\n\
    \        }\n\n        // 此处进行某些实现\n    }\n}\n```\n\n`wait()` 方法释放线程持有的锁视器，因为它等待的条件尚未满足（`wait()`\
    \ 必须在循环中调用，绝不能在循环外调用）。因此，另一个等待同一监视器的线程可以获取锁。完成后，它应该调用一个 `notify()`/`notifyAll()`\
    \ 方法来唤醒等待监视器的（线程）。例如：\n\n```\npublic void performAction() {\n    synchronized\
    \ (lock) {\n        // 此处进行某些实现\n    }\n\n    // 唤醒一个等待此对象监视器的线程。\n    lock.notify();\n\
    }\n```\n\n`notify()` 和 `notifyAll()` 的区别在于，前者唤醒单个线程，而后者唤醒所有等待的线程（这些线程将留在竞争监视器）。\n\
    \n现代 Java 应用中不建议使用 `wait()/notify()` 这种用例。它不仅复杂，而且还需要一套强制性规则。因此，它可能会导致运行中的程序出现\
    \ bug，这些 bug 将非常难以且耗时的调查。`java.util.concurrent` 有许多可以替代 `wait()/notify()` 的更简单的替代方案（这些方案在现实场景中可能会有更好的性能）。\n\
    \n# 9.12 排除并发问题\n\n多线程应用程序中可能会发生很多问题。调试和排除故障可能花费数小时、几天或几周。Java 开发工具包（JDK）提供了几个工具，能够提供应用程序线程及其状态以及死锁条件的详细信息（参见\
    \ Threads 线程组和 Locks 章节）。这是一个很好的起点。这些工具包括（但不限于）：\n\n- VisualVM (http://docs.oracle.com/java/7/docs/techniques/tools/share/jvisualm.html)\n\
    - Java Mission Control (http://docs.oracle.com/javacomponents/jmc.htm)\n- jstack\
