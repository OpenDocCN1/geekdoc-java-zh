    \ and Return Values\n- Try to escape null as method return value (section Method\
    \ Parameters and Return Values)\n- Whenever it makes sense, try to design immutable\
    \ methods (which do not affect the internal state, section Immutability)\n- Use\
    \ visibility and accessibility rules to hide the methods which should not be public\
    \ (part 3 of the tutorial, How to design Classes and Interfaces)\n\n## 6.13 Download\
    \ the Source Code\n\nThis was a lesson on How to write methods efficiently. You\
    \ may download the source code here: advanced-java-part-6\n\n## 6.14 What's next\n\
    \nThis part of the tutorial was talking a bit less about Java as a language, but\
    \ more about how to use Java as a language effectively, in particular by writing\
    \ readable, clean, documented and effective methods. In the next section we are\
    \ going to continue with the same basic idea and discuss general programming guidelines\
    \ which are intended to help you to be better Java developer.\n\n## Chapter 7\n\
    \n## General programming guidelines\n\n## 7.1 Introduction\n\nIn this part of\
    \ the tutorial we are going to continue discussing general principles of good\
    \ programming style and robust design in Java. Some of these principles we have\
    \ already seen in the previous parts of the tutorial, however a lot of new practical\
    \ advices will be introduced along the way to improve your skills as a Java developer.\n\
    \n## 7.2 Variable scopes\n\nIn the part 3 of the tutorial, How to design Classes\
    \ and Interfaces, we have discussed the visibility and accessibility could be\
    \ applied to classes and interface members, limiting their scope. However we have\
    \ not discussed the local variables, which are used within implementation methods.\n\
    \nIn the Java language, every local variable, once declared, has its scope. The\
    \ variable becomes visible from the place it is declared to the end of the method\
    \ (or code block) it is declared in. As such, there is only one rule to follow:\
    \ declare the local variable as close to the place where it is used as possible.\
    \ Let us take a look on some typical examples:\n\n```java\nfor( final Locale locale:\
    \ Locale.getAvailableLocales() ) {\n    // Some implementation here\n}\n```\n\n\
    ```java\ntry( final InputStream inputStream = new FileInputStream(\"file.txt\"\
    ) ) {\n    // Some implementation here\n}\n```\n\nIn both cases the scope of the\
    \ local variables is limited to the blocks they are declared in. Once the block\
    \ ends, the local variable goes out of scope and is not visible. With the release\
    \ of Java 8 and introduction of lambdas, well-known issues of using local variables\
    \ are becoming obsolete. We rewrite the for-each loop from previous example using\
    \ lambda instead:\n\n```java\nArrays.stream(Locale.getAvailableLocales()).forEach(\
    \ locale ) -> {\n    // Some implementation here\n});\n```\n\nThe local variable\
    \ becomes the argument of the function which is used as the argument of the forEach\
    \ method.\n\n## 7.3 Class fields and local variables\n\nEvery method in Java belongs\
    \ to some class (or inner class in case of Java 8 and the method is declared as\
    \ default). As such, there is a probability of name conflicts between local variables\
    \ used in method implementations and class members.\n\n## Advanced java\n\nThe\
    \ Java compiler is able to pick the right variable from the scope although it\
    \ might not be the one developer intended to use. The modern Java IDEs are still\
    \ a tremendous work in order to hint the developers when such conflicts are taking\
    \ place (warnings, highlights...) it is better to think about what we are doing.\
    \ Let us take a look on this example:\n\n```java\npublic class LocalVariableAndObjectClass\
    \ {\n    private long value;\n\n    public long calculateValue(final long initial)\
    \ {\n        long value = initial;\n\n        value += 10;\n        value += value;\n\
    \n        return value;\n    }\n}\n```\n\nExample code looks simple but there\
    \ is a catch. The method calculateValue introduces a local variable with value\
    \ and by doing that hides the class member with the same name. The line 08 should\
    \ have summed the class member and the local variable but it does something very\
    \ different. The correct version may look like that (using the keyword this):\n\
    \n```java\npublic class LocalVariableAndObjectClass {\n    private long value;\n\
    \n    public long calculateValue(final long initial) {\n        long value = initial;\n\
    \n        value += 10;\n        value += this.value;\n\n        return value;\n\
    \    }\n}\n```\n\nSomewhat naive implementation but nevertheless highlights the\
    \ important issue which in some cases could take hours to debug and troubleshoot.\n\
    \n## 7.4 Method arguments and local variables\n\nAnother trap, which quite often\
    \ inexperienced Java developers fall into, is using method arguments as local\
    \ variables. Java allows to reassign non-final method arguments with a different\
    \ value (however it has no effect on the original value whatsoever). For example:\n\
    \n```java\npublic String sanitize(String str ) {\n    if (str.isEmpty()) {\n \
    \       str = str.trim();\n    }\n\n    str = str.toLowerCase();\n    return str;\n\
    }\n```\n\nIt is not a beautiful piece of code but it is good enough to reveal\
    \ the problem: method argument str is reassigned to another value (and badly used\
    \ as a local). In all cases (with no exception) this pattern could and be avoided\
    \ (for example, by declaring method arguments as final). For example:\n\n```java\n\
    public String sanitize(final String str ) {\n    String sanitized = str;\n   \
    \ if (!str.isEmpty()) {\n        sanitized = str.trim();\n    }\n\n    sanitized\
    \ = sanitized.toLowerCase();\n    return sanitized;\n}\n```\n\nThe code which\
    \ follows this simple rule is much easier to follow and reason about, even at\
    \ the price of introducing local variables.\n\n## 7.5 Boxing and unboxing\n\n\
    Boxing and unboxing are all the names of the same technique used in Java language\
    \ to convert between primitive types (like int, long, double) to respective primitive\
    \ types (like Integer, Long, Double). In the part 4 of the tutorial, How and when\
    \ to use Generics, we have already seen it in action when talking about primitive\
    \ wrappers as generic type parameters.\n\nThe Java compiler tries to do its best\
    \ to hide conversions by performing autoboxing, sometimes it things worse and\
    \ leads to unexpected results. Let us take a look at this example:\n\n```java\n\
    public static void calculate(final long value) {\n    // Some implementation here\n\
    }\n\nfinal Long value = null;\ncalculate(value);\n```\n\nThe code snippet above\
    \ completes perfectly, however it throws NullPointerException on line 02 when\
    \ the conversion between long and long happens. The advice here would be to prefer\
    \ using primitive type (however as we already know, it is not always possible).\n\
    \n## 7.6 Interfaces\n\nIn the part 3 of the tutorial, How to design Classes and\
    \ Interfaces, we have discussed interfaces and contract-based development, emphasizing\
    \ a lot on the fact that interfaces should be preferred to concrete classes wherever\
    \ possible. The intent of this is to convince you one more time that interfaces\
    \ are not tied to any implementation. They are just contracts. Let us take a look\
    \ at the following interface:\n\n```java\npublic interface TimeService {\n   \
    \ TimeZone getTimeZone(double lat, double lon) throws IOException;\n}\n```\n\n\
    ```java\npublic class TimezoneImpl implements TimeService {\n    @Override\n \
    \   public TimeZone getTimeZone(double lat, double lon) throws IOException {\n\
    \        final URL url = new URL(\"http://api.geojson.org/timezone?lat=\" + lat\
    \ + \"&lon=\" + lon);\n        final HttpURLConnection connection = (HttpURLConnection)\
    \ url.openConnection();\n\n        connection.setRequestMethod(\"GET\");\n   \
    \     connection.connectTimeout(1000);\n        connection.setReadTimeout(1000);\n\
    \        connection.connect();\n\n        int status = connection.getResponseCode();\n\
    \        if (status == 200) {\n            // Do something here\n        }\n\n\
    \        return TimeZone.getDefault();\n    }\n}\n```\n\nThe code snippet above\
    \ demonstrates a typical interface implementation. The implementation uses external\
    \ service (http://api.geonames.org/) to retrieve the time for a particular location.\
    \ However because the connection is driven by the interface, it is very easy to\
    \ inject another implementation, for example, database or flat file. With interfaces\
    \ help design testable code. For example, using mock or stub:\n\n```java\npublic\
    \ class TimeServiceTest implements TimeService {\n    @Override\n    public TimeZone\
    \ getTimeZone(double lat, double lon) throws IOException {\n        return TimeZone.getDefault();\n\
    \    }\n}\n```\n\nThis could be used anywhere where TimeService is required, isolating\
    \ the testing from external components.\nMany excellent examples of appropriate\
    \ use of interfaces are encapsulated in the Java standard collection library.\
    \ Col, List, Set, all those interfaces are backed by several implementations which\
    \ could be replaced seamlessly and interchangeably without changes to element:\n\
    \n```java\npublic static <T> void print( final Collection<T> collection ) {\n\
    \    for( final T element : collection) {\n        System.out.println( element);\n\
    \    }\n}\n```\n\n```java\nprint(new HashSet<Object>());\nprint(new ArrayList<Integer>());\n\
    print(new TreeSet<String>());\nprint(new Vector<Long>());\n\n\n## 7.7 Strings\n\
    \nStrings are one of the most used types in Java and, arguably, in most of the\
    \ programming languages. The Java language simplifies the routine operations over\
    \ strings by natively supporting the concatenations and comparison. Additionally,\
    \ the Java standard library provides classes to make string operations efficient\
    \ and that we are going to discuss in this section\n\nIn Java, strings are immutable,\
    \ represented in UTF-16 format. Every time you concatenate the strings (or any\
    \ operation which modifies the original string) the new instance of the String\
    \ class is created. Because of this fact, the concatenations may become very ineffective,\
    \ causing the creation of many intermediate instances (generally generating garbage).\n\
    \nBut the Java standard library provides two helpful classes which aim to facilitate\
    \ string manipulations: StringBuilder and StringBuffer (the difference between\
    \ them is that StringBuffer is thread-safe while StringBuilder is not).\n"
