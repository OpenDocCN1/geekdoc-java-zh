    # Chapter 8


    # How and when to use Exceptions


    # 8.1 Introduction


    Exceptions in Java are an important instrument to signal abnormal (or exceptional)
    conditions in the program flow which may prevent it from making a further progress.
    By nature, those exceptional conditions may be fatal (the program is not able
    to function anymore and be terminated) or recoverable (the program may continue
    to run though functionality may not be available).


    In this section of the tutorial we are going to walk through the typical scenario
    of using exceptions in Java, discuss the checked and unchecked exceptions, and
    touch some corner cases and useful idioms.


    # 8.2 Exceptions and when to use them


    In a nutshell, exceptions are some kind of events (or signals) which occur during
    program execution and interrupt the regular execution flow. The idea which led
    to introduction of the exceptions was born a replacement for the error codes and
    status checking techniques used back in days. Since then, exceptions gained widespread
    acceptance as the standard way to deal with errors in many programming languages,
    Java.


    There is only one rule related to handling (not only in Java): never ignore them!
    Every exception should be at least logged (using Exceptions and logging) but not
    ignored. Nonetheless, there are rare circumstances where exceptions could be safely
    ignored because really might not be done about it (please refer to the Using-with-resources
    section for a sample).


    And one more, in the part 6 of the total, How to write exceptions efficiently,
    we have discussed argument validation and sanity checks. Exceptions are a crucial
    part of these practices: every public method should verify all required conditions
    before doing any real work and raise an appropriate exception if some of them
    have not met.


    # 8.3 Checked and unchecked exceptions


    The exceptions management in the Java language differs from other programming
    languages. This is primarily because there are two classes of exceptions in Java:
    checked and unchecked exceptions. Interestingly, those classes are arbitrary and
    imposed by Java language rules and is (but JVM has no difference between them).


    As rule of thumb, unchecked exceptions are used to signal about errors related
    to program logic and assumptions being made (invalid arguments, null pointers,
    unsupported operations, ...). Any unchecked exception is a subclass of RuntimeException
    and that Java compiler understands that a particular exception belongs to the
    class of unchecked ones.


    Unchecked exceptions are not required to be caught by the caller or be listed
    as a part of the method signature (using throws keyword). The NullPointerException
    is the most known member of unchecked exceptions and here is its declaration from
    the Java standard library:'
