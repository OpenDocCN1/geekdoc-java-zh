    \ annotations will be often the part of the mostly every discussion.\n\n## Chapter\
    \ 6\n\n## How to write methods efficiently\n\n## 6.1 Introduction\n\nIn this section\
    \ of the tutorial we are going to spend some time discussing different aspects\
    \ related to designing and implementing methods in Java. As we have seen in previous\
    \ parts of the tutorial, it is very easy to write methods in Java, however there\
    \ are many things which could make your methods more readable and efficient.\n\
    \n## 6.2 Method signatures\n\nAs we already know very well, Java is an object-oriented\
    \ language. As such, every method in Java belongs to some class instance (or class\
    \ itself in case of static methods), has visibility (or accessibility) rules,\
    \ may be declared abstract or final, and so on. However, arguably, the most important\
    \ part of the method is its signature: the return type and arguments, plus the\
    \ list of checked exceptions which method implementation may throw (but this part\
    \ is used less and often nowadays). Here is a small example to start with:\n\n\
    ```java\npublic static void main(String[] args) {\n    // Some implementation\
    \ here\n}\n```\n\nThe method accepts an array of strings as an only argument and\
    \ returns nothing. It would be very nice to keep all methods as simple as main.\
    \ But in reality, a method signature may become unreadable. Let us take a look\
    \ at the following:\n\n```java\npublic void setTitleVisible(int length, String\
    \ title, boolean visible) {\n    // Some implementation here\n}\n```\n\nThe first\
    \ thing to notice is that by convention, the method names in Java are written\
    \ in camel case, for example: setTitle. The name is well chosen and describes\
    \ what the method is supposed to do.\n\nSecondly, the name of each argument (or\
    \ at least) about its purpose. It is important to find the right, explanatory\
    \ names for the method, instead of int i, String, boolean f (in very cases it\
    \ makes sense however).\n\nThirdly, the method takes only three arguments. Although\
    \ Java has a much higher limit for number of arguments, it is highly recommended\
    \ to keep this number below 6. Beyond this point method signature becomes hard\
    \ to understand, it is.\n\nSince the Java 5 release, the methods can have variable\
    \ list of arguments of the same type (called varargs) using a special syntax,\
    \ for example:\n\n```java\npublic void find(String... elements) {\n    // Some\
    \ implementation here\n}\n```\n\n## Advanced java 48 / 113\n\nInternally, the\
    \ Java compiler converts varargs into an array of the respective type and that\
    \ is how varargs can be accessed by the method implementation.\n\nInterestingly,\
    \ Java also allows to declare the varargs argument using generic type parameter.\
    \ However, because the type of the argument is not known, the compiler wants to\
    \ be sure that the varargs are used responsibly and the method to be final and\
    \ annotated with the @SafeVarargs annotation (more details about annotations are\
    \ covered in the part 5 of the tutorial, When and how to use Enums and Annotations).\
    \ For example:\n\n```java\n@SafeVarargs\nfinal public <T> void find(T ... elements)\
    \ {\n    // Some implementation here\n}\n```\n\nThe other way is by using the\
    \ @SuppressWarnings annotation\n\n```java\n@SuppressWarnings(\"unchecked\")\n\
    public <T> void findSuppressed(T ... elements) {\n    // Some implementation here\n\
    }\n```\n\nThe next example demonstrates the usage of the checked exceptions as\
    \ part of the method signature. In recent years the checked exception has proved\
    \ not be as useful as it intended to, causing more boilerplate code to be written\
    \ with many problems.\n\n```java\npublic void write(File file) throws IOException\n\
    // Some implementation here\n```\n\nLast but not, it is generally advised (but\
    \ rarely) to mark the arguments as final. It helps to get rid of bad code practice\
    \ when method arguments are assigned with different values. Also, such method\
    \ could be used by anonymous classes (more details about anonymous classes are\
    \ covered in part 3 of the tutorial, How to design Classes and Interfaces, though\
    \ Java 8 has this constraint by introducing effectively final variables.\n\n##\
    \ 6.3 Method body\n\nEvery method has its own implementation and purpose to exist.\
    \ However, there are a couple of general guidelines that really help writing clean\
    \ and understandable methods.\n\nProbably the most important one is the single\
    \ responsibility principle: to implement the methods in a way, that every method\
    \ does just one thing and does it well. Following this principle may blow up the\
    \ number of classes, so it is important to keep the right balance.\n\nLast (but\
    \ not) advice is related to using return statements. If a method returns some\
    \ value, try to minimize the number of places where the return statement is called\
    \ (some people may go further and recommend to use just return statement in all\
    \ cases). Return statements method has, much harder it becomes to follow its logic\
    \ flow and modify (or refactor) the implementation.\n\n## 6.4 Method overloading\n\
    \nThe technique of overloading is often used to provide the specialized version\
    \ of the method for different argument types or combinations. Although the method\
    \ stays the same, the compiler picks the right alternative depending on the actual\
    \ argument values at the invocation point (the best example of overloading is\
    \ constructors in Java: the name is always the same but the set of arguments is\
    \ different) or raises a compiler error if not found. For example:\n\n## Advanced\
    \ java\n\n```java\npublic String numberToString( Long number ) {\n    return Long.toString();\n\
    }\n\npublic String numberToString( BigDecimal number ) {\n    return number.toString();\n\
    }\n```\n\nMethod overloading is close to generics (more details about generics\
    \ are covered in part 4 of the tutorial, How and when to use Generics), however\
    \ it is used in cases where the generic approach does not work and each (most)\
    \ generic type arguments require their own implementations. Nevertheless, both\
    \ generics and overloading could be very powerful, but not possible in Java, because\
    \ of type erasure (for more details refer to part 4 of the tutorial, How and when\
    \ to use Generics). Let us take a look at this example:\n\n```java\npublic <T\
    \ extends Number> String numberToString( T number ) {\n    return number.toString();\n\
    }\n\npublic String numberToString( BigDecimal number ) {\n    return number.toString();\n\
    }\n```\n\nAlthough this code works without using generics, it is important for\
    \ our demonstration purposes. The interesting part is that the method toString\
    \ is overloaded with a specialized implementation for BigDecimal and a generic\
    \ version is provided for all other numbers.\n\n## 6.5 Method overriding\n\nWe\
    \ have talked about method overriding in part 3 of the tutorial, How to design\
    \ Classes and Interfaces. In this section, when we already know about method overriding,\
    \ we are going to show why @Override annotation is important. Our example will\
    \ demonstrate the subtle difference between method overriding and overloading\
    \ in the simple class hierarchy.\n\n```java\npublic class Parent {\n    public\
    \ Object toobject( Number number ) {\n        return number.toString();\n    }\n\
    }\n```\n\nThe class Parent has just one toObject method. Let us subclass this\
    \ class and try to come up with the method version to convert numbers to strings\
    \ (instead of raw objects).\n\n```java\npublic class Child extends Parent {\n\
    \    @Override\n    public String toobject( Number number ) {\n        return\
    \ number.toString();\n    }\n}\n```\n\nWhatever the signature of the toobject\
    \ method in the Child is a little different (please see Covariant return types\
    \ for more details), it overrides the one from the superclass and Java compiler\
    \ has no complaints about that. Now, let us add another method to the Child class.\n\
    \n```java\npublic class Child extends Parent {\n    public String toobject( Double\
    \ number ) {\n        return number.toString();\n    }\n}\n```\n"
