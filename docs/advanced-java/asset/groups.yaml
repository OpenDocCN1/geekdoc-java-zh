- md: "\n## Chapter 3\n## How to design Classes and Interfaces\n\n### 3.1 Introduction\n\
    \nWhatever programming language you are using (and Java is not an exception here),\
    \ following good design principles is a key to write clean, understandable, testable\
    \ code and deliver long-living, easy to maintain solutions. In this part of the\
    \ tutorial we are going to discuss the foundational building blocks the Java language\
    \ provides and introduce a couple of design principles, aiming to help you to\
    \ make better design decisions.\n\nMore precisely, we are going to discuss **interfaces**\
    \ and **interfaces with default methods** (new feature of Java 8), **abstract**\
    \ and **final classes, immutable classes, inheritance, composition** and revisit\
    \ a bit the **visibility** (or accessibility) rules we have briefly touched in\
    \ **part 1** of the tutorial, How to create and destroy objects.\n\n### 3.2 Interfaces\n\
    \nIn object-oriented programming, the concept of interfaces forms the basics of\
    \ contract-driven (or contract-based) development. In a nutshell, interfaces define\
    \ the set of methods (contract) and every class that claims to support this particular\
    \ interface must provide the implementation of these methods: a pretty simple,\
    \ powerful idea.\n\nMany programming languages have interfaces in one form or\
    \ other, but Java particularly provides language support for that. Take a look\
    \ at a simple interface definition in Java.\n\n```\npackage com.javacodgeeks.advanced.design;\n\
    public interface SimpleInterface {\n    void performAction();\n}\n```\n\nIn the\
    \ code snippet above, the interface we named `SimpleInterface` declares just one\
    \ method named performAction. The principal differences of interfaces in respect\
    \ to classes is that interfaces outline what the contract is (declared) but do\
    \ not provide their implementations.\n\nHowever, interfaces in Java can be more\
    \ complicated than that: they can include nested classes, enumerations, notations\
    \ (annotations) and annotations will be covered in details in **part 5** of the\
    \ tutorial, **How and when to use Enums and Annotations** and for example:\n\n\
    ```java\npackage com.javacodgeeks.advanced.design;\npublic interface InterfaceWithDefinitions\
    \ {\n    String CONSTANT = \"CONSTANT\";\n\n    enum InnerEnum {\n        E1,\
    \ E2;\n    }\n}\n\nclass InnerClass {\n    interface InnerInterface {\n      \
    \  void performInnerAction();\n    }\n    void performAction();\n}\n```\n\nWith\
    \ this more complex example, there are a couple of constraints which interfaces\
    \ implicitly imply with respect to the nested constructs and method declarations,\
    \ and Java compiler enforces them. First and foremost, even if it is not being\
    \ said every declaration in the interface is public (and can only be public, for\
    \ more details about visibility and accessibility rules, please refer to section\
    \ Visibility). As such, the following method declarations are equivalent:\n\n\
    ```java\npublic void performAction();\nvoid performAction();\n```\n\nWorth to\
    \ mention every single method in the interface is implicitly declared as abstract\
    \ and even these method declarations are equivalent:\n\n```java\npublic abstract\
    \ void performAction();\npublic void performAction();\nvoid performAction();\n\
    ```\n\nAs for the first constant, declarations added to being public, they are\
    \ implicitly static and final so the following declarations are equivalent:\n\n\
    ```java\nString CONSTANT = \"CONSTANT\";\npublic static final String CONSTANT\
    \ = \"CONSTANT\";\n```\n\nAnd finally, the classes or interfaces, in addition\
    \ to being public, are implicitly declared as static. For example, those class\
    \ declarations are equivalent as well:\n\n```java\nclass InnerClass {\n}\nstatic\
    \ class InnerClass {\n```\n\nWhich one you are choosing is a personal preference,\
    \ however knowledge of those simple qualities of interfaces can save you from\
    \ unnecessary typing.\n\n### 3.3 Marker Interfaces\n\nMarker interfaces are a\
    \ special kind of interfaces which have no methods or other nested constructs\
    \ defined. We have already seen one example of the marker interface in part 2\
    \ of the tutorial Using methods common to all objects, the interface Cloneable.\
    \ Here is it defined in the Java library:\n\n```java\npublic interface Cloneable\
    \ { }\n```\n\nMarker interfaces are not contracts but somewhat useful technique\
    \ to \"attach\" or \"tie\" some particular trait to the class. For example, with\
    \ respect to Cloneable, the class is marked as being available for cloning the\
    \ way it should or be done is not a part of the interface. Another very well-known\
    \ and widely used example of marker interface is Serializable:\n\n```java\npublic\
    \ interface Serializable {\n}\n```\n\nThis interface marks the class as available\
    \ for serialization and deserialization, and again, it does not specify the way\
    \ it could or be done.\n\nThe markers interface have their place in object-oriented\
    \ design, although they do not satisfy the main purpose of interface to be a contract.\n\
    \n### 3.4 Functional interfaces, default and static methods\n\nWith the release\
    \ of Java 8, interfaces have obtained very interesting capabilities: static methods,\
    \ default methods and automatic conversion of lambdas (functional interfaces).\n\
    \nIn Interfaces we have emphasized the fact that interfaces in Java can declare\
    \ methods but are not allowed to implement them. With default methods it is not\
    \ true anymore: an interface can mark a method with the default keyword and provide\
    \ the implementation for it. For example:\n\n```java\npackage com.javadegeeks.advanced.design;\n\
    \npublic interface InterfaceWithDefaultMethods {\n    void performAction();\n\n\
    \    default void performDefaultAction() {\n        // Implementation here\n \
    \   }\n}\n```\n\nBeing an instance level, default methods could be overridden\
    \ by each interface implementer, but from now, interfaces may also include static\
    \ methods, for example:\n\n```java\npackage com.javadegeeks.advanced.design;\n\
    \npublic interface InterfaceWithDefaultMethods {\n    static void createAction()\
    \ {\n        // Implementation here\n    }\n}\n```\n\nOne may say that providing\
    \ an implementation in the interface defeats the whole purpose of contract-based\
    \ development, but are are many reasons why these features were introduced into\
    \ the Java language and no matter how useful or confusing they are, are are there\
    \ for you to use.\n\nThe functional interfaces are different during story and\
    \ they are very helpful also-to the language. Basically, the functional interface\
    \ is the interface with just a single abstract method declared in it. The Runnable\
    \ interface from Java standard library is a good example of this concept:\n\n\
    ```java\n@FunctionalInterface\npublic interface Runnable {\n    void run();\n\
    }\n```\n\nThe Compiler treats functional interfaces differently and is to convert\
    \ the lambda function into the functional interface implementation where it makes\
    \ sense. Let us take a look on enabling lambda function definition:\n\n```java\n\
    public void runMe(Runnable r) {\n    r.run();\n}\n```\n\nTo invoke this function\
    \ in Java 7 below, the implementation of the Runnable interface should be provided\
    \ (for example using Anonymous classes), but in Java 8 it is enough to run Run()\
    \ method implementation using lambda syntax:\n\n```java\nrunMe() = () -> System.out.println(\"\
    Run!\");\n```\n\nAdditionally, the functionalInterface annotations annotations\
    \ will be covered in details in part 5 of the tutorial. How and when to use Enums\
    \ and Annotations hints the compiler to verify that the interface contains only\
    \ one abstract method so any changes introduced to the future will not break this\
    \ assertion.\n\n### 3.5 Abstract classes\n\nAnother concept supported by Java\
    \ language is the notion of abstract classes. Abstract classes are somewhat similar\
    \ to the interfaces in Java 7 and very close to methods in Java 8. By contrast,\
    \ abstract classes cannot be instantiated but can be subclassed (please refer\
    \ to the section Inheritance for details). More importantly, abstract classes\
    \ may contain abstract methods: the special kind of methods without implementations,\
    \ like interfaces. For example:\n\n```java\npackage com.javocodegeeks.advanced.design;\n\
    public abstract class SimpleAbstractClass {\n    public void performAction() {\n\
    \        // Implementation here\n    }\n\n    public abstract void performAnotherAction();\n\
    }\n```\n\nIn this example, SimpleAbstractClass is declared as abstract and has\
    \ one abstract method declaration well. Abstract classes are very useful when\
    \ most or even some of implementation details could be shared by many subclasses.\
    \ They will leave the door open and allow customizing the intrinsic behavior of\
    \ each subclass by means of abstract methods.\n\nOne thing to mention, in contrast\
    \ to interfaces which can contain only public declarations, abstract classes may\
    \ the full power of accessibility rules to control abstract methods visibility\
    \ (please refer to the sections Visibility and Inheritance for more)\n\n### 3.6\
    \ Immutable classes\n\nImmutability is becoming more and more important in the\
    \ software development nowadays. The rise of multi-core systems has raised a lot\
    \ of concerns related to data sharing and concurrency (in the part 9. Concurrency\
    \ best practices, we are going to discuss in these topics) But the thing clearly\
    \ emerged: less (or even absence of) mutable state leads to better scalability\
    \ and reasoning among the matters.\n\nThe Java language does not provide strong\
    \ support for class immutability. However using a combination of techniques it\
    \ is possible to design classes that are immutable. First and foremost, all fields\
    \ of the class should be final. A good start but does not guarantee immutability\n\
    \n```java\npackage com.javocodegeeks.advanced.design;\n\nimport java.util.Collection;\n\
    public class ImmutableClass {\n    private final long id;\n    private final String[]\
    \ arrayOfStrings;\n    private final Collection< String > collectionOfString;\n\
    }\n```\n"
  mdcn: "\n\n## 第3章\n## 如何设计类和接口\n\n### 3.1 引言\n\n无论你使用哪种编程语言（Java 也不例外），遵循良好的设计原则都是编写整洁、易懂、可测试的代码，并交付长久且易于维护的解决方案的关键。在教程的这部分，我们将讨论\
    \ Java 语言提供的基础构建模块，并介绍一些设计原则，旨在帮助你做出设计的设计。\n\n更具体地说，我们将讨论**接口**和**带有默认方法的接口**（Java\
    \ 8 的新功能）、**抽象类**和**最终类（final classes）**、**不可变类**、**继承**、**组合**，并回顾我们在教程**第1部分**（如何创建和销毁对象）中简要提过的**可见性**（或可访问性）规则。\n\
    \n### 3.2 接口\n\n在面向对象的编程中，接口的概念构成了契约驱动（或基于契约）开发的基础。简单来说，接口定义了方法集（契约），任何声称支持此特定接口的类必须提供这些方法的实现：这是一个非常简单且强大的想法。\n\
    \n许多编程语言以某种形式拥有接口，但 Java 特别地为此提供了语言支持。让我们看看 Java 中一个简单的接口定义。\n\n```\npackage com.javacodgeeks.advanced.design;\n\
    public interface SimpleInterface {\n    void performAction();\n}\n```\n\n在上面的代码段中，我们命名为\
    \ `SimpleInterface` 的接口只声明了一个名为 `performAction` 的方法。接口相对于类的主要区别在于，接口概述了契约是什么（声明），但没有提供它们的实现。\n\
    \n然而，Java 中的接口可能比这更复杂：它们可以包含嵌套类、枚举、标记（注解），注解将在教程的**第5部分**——**何时以及如何使用枚举和注解**中详细介绍，例如：\n\
    \n```java\npackage com.javacodgeeks.advanced.design;\npublic interface InterfaceWithDefinitions\
    \ {\n    String CONSTANT = \"CONSTANT\";\n\n    enum InnerEnum {\n        E1,\
    \ E2;\n    }\n}\n\nclass InnerClass {\n    interface InnerInterface {\n      \
    \  void performInnerAction();\n    }\n    void performAction();\n}\n```\n\n通过这个更复杂的例子，我们可以发现接口在嵌套结构和方法声明方面隐含地包含了一些约束，Java\
    \ 编译器会强制执行这些约束。首先也是最重要的，即使没有明说，接口中的每个声明都是公共的（public），且只能是公共（关于可见性和可访问性规则的更多信息，请参见“可见性”章节）。因此，以下方法声明是等价的：\n\
    \n```java\npublic void performAction();\nvoid performAction();\n```\n\n值得提到的是接口中的每一个方法都隐式地声明为抽象（abstract），即使这些方法声明也是等价的：\n\
    \n```java\npublic abstract void performAction();\npublic void performAction();\n\
    void performAction();\n```\n\n至于第一个常量，除了是 public 之外，它们还隐式地声明为 static 且 final，因此以下声明是等价的：\n\
    \n```java\nString CONSTANT = \"CONSTANT\";\npublic static final String CONSTANT\
    \ = \"CONSTANT\";\n```\n\n最后，类或接口除了是 public 外，还隐式地声明为 static。例如，这些类声明也是等价的：\n\n\
    ```java\nclass InnerClass {\n}\nstatic class InnerClass {\n```\n\n选择哪一个取决于个人喜好，然而，了解接口的这些简单特性可以避免不必要的输入。\n\
    \n### 3.3 标记接口 (Marker Interfaces)\n\n标记接口是一种特殊的接口，它们没有定义方法或其他嵌套结构。我们已经在教程的第2部分（使用所有对象的通用方法）中见过一个标记接口的示例：`Cloneable`\
    \ 接口。它在 Java 库中的定义如下：\n\n```java\npublic interface Cloneable { }\n```\n\n标记接口不是契约，而是某种很有用的技术，用于向类“附带”或“绑定”某些特定特征。例如，对于\
    \ `Cloneable`，类被标记为可以进行克隆，但应该如何进行或如何执行克隆并不属于接口的一部分。另一个广为人知且广泛使用的标记接口示例是 `Serializable`：\n\
    \n```java\npublic interface Serializable {\n}\n```\n\n此接口将类标记为可进行序列化和反序列化，同样，它没有指定可以如何或如何执行。\n\
    \n标记接口在面向对象的设计中有一有一席之地，尽管它们没有满足接口作为契约的主要目的。\n\n### 3.4 泛型接口、默认方法和静态方法\n\n随着 Java\
    \ 8 的发布，接口获得了非常有趣的能力：静态方法、默认方法以及 lambda 的自动转换（函数式接口）。\n\n在接口中，我们强调了 Java 接口可以声明方法但不允许实现它们。有了默认方法后，情况就不再如此了：接口可以使用\
    \ `default` 关键字标记一个方法并为其提供实现。例如：\n\n```java\npackage com.javadegeeks.advanced.design;\n\
    \npublic interface InterfaceWithDefaultMethods {\n    void performAction();\n\n\
    \    default void performDefaultAction() {\n        // 在处编写实现\n    }\n}\n```\n\
    \n由于是实例级别，默认方法可以被每个接口实现者重写，但从现在起，接口也可以包含静态方法，例如：\n\n```java\npackage com.javadegeeks.advanced.design;\n\
    \npublic interface InterfaceWithDefaultMethods {\n    static void createAction()\
    \ {\n        // 在处编写实现\n    }\n}\n```\n\n有人说在接口中提供实现违背了基于契约开发的整个初衷，但有很多原因导致这些功能被引入\
    \ Java 语言，无论它们有多用或多令人困惑，它们都是供你使用的。\n\n### 3.5 抽象类 (Abstract classes)\n\nJava 语言支持的另一个概念是抽象类。抽象类与\
    \ Java 7 中的接口某些相似，与 Java 8 中的方法非常接近。相比之下，抽象类不能实例化但可以被子类化（详情请参见“继承”章节）。更重要的是，抽象类可以包含抽象方法：没有实现的特殊方法，类似于接口。例如：\n\
    \n```java\npackage com.javacodgeeks.advanced.design;\npublic abstract class SimpleAbstractClass\
    \ {\n    public void performAction() {\n        // 在处编写实现\n    }\n\n    public\
    \ abstract void performAnotherAction();\n}\n```\n\n在这个示例中，`SimpleAbstractClass`\
    \ 被声明为抽象并有一个抽象方法。当多个子类共享大部分或部分实现细节时，抽象类非常有用。它们留下了空间，并允许通过抽象方法自定义每个子类的内在行为。\n\n\
    需要提到，与接口只能包含公共声明不同，抽象类可以使用完整的访问性规则来控制抽象方法的可见性（更多信息请参见“可见性”和“继承”章节）。\n\n### 3.6\
    \ 不可变类 (Immutable classes)\n\n不可变性今天变得越来越重要。多核系统的出现引发了许多关于数据共享和并发的担忧（在第 9 部分。并发最佳实践中，我们将讨论这些主题）。但一个事实已显易见：可变状态越少，扩展性和推理越容易。\n\
    \nJava 语言没有为类的不可变性提供强支持。然而，通过组合技术，可以设计出不可变的类。首先也是最重要的，类的所有字段都应该是 `final` 的。这是一个良好的开始，但不能保证不可变性：\n\
    \n```java\npackage com.javacodgeeks.advanced.design;\n\nimport java.util.Collection;\n\
    public class ImmutableClass {\n    private final long id;\n    private final String[]\
    \ arrayOfStrings;\n    private final Collection< String > collectionOfString;\n\
    }\n```\n\n"
