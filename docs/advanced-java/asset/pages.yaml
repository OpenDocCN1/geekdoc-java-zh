  md: "# Chapter 11\n\n# How to use Reflection effectively\n\n# 11.1 Introduction\n\
    \nIn this part of the tutorial we are going to briefly look through a very interesting\
    \ subject called reflection. Reflection is the ability of the program to examine\
    \ or introspect itself at runtime. Reflection is an extremely useful and powerful\
    \ feature which significantly expands the capabilities of the code to perform\
    \ its own inspections, modifications or transformations during its execution,\
    \ without a single line of code change. Not every programming language implementation\
    \ has this feature supported, but lucky Java adopted it since its beginning.\n\
    \n# 11.2 Reflection API\n\nThe Reflection API is part of the Java standard library,\
    \ provides a way to explore intrinsic class details at runtime, dynamically create\
    \ new instances without the new operator, modify annotations (annotations have\
    \ been covered in part 5 of the standard, How and to use Enums and Annotations),\
    \ and much, more. It gives Java developers freedom to write code that could adapt,\
    \ verify, execute and even modify while it is running.\n\nThe Reflection API is\
    \ designed in quite intuitive way and is hosted by the java.lang.reflect package.\
    \ Its structure follows closely the Java language concepts and all elements to\
    \ reflect classes (including generic versions), methods (fields), constructors,\
    \ interfaces, and annotations. The entry point for the Reflection API is the simplest\
    \ way to list all methods of the class by using the getMethods() method call:\n\
    \n```\nfinal Method[] methods = String.class.getMethods();\nfor (final Method\
    \ method : methods ) {\n    System.out.println(method.getName());\n}\n```\n\n\
    Following the same pattern, we can list all fields of the class by is using the\
    \ getFields() method call, for example:\n\n```\nfinal Field fields = String.class.getFields();\n\
    for (final Field field : fields ) {\n    System.out.println(field.getName());\n\
    }\n```\n\nContinuing the experiment with the String class, let us try to create\
    \ a new instance and call the length() method on it, all by using the reflection\
    \ API only.\n\n```\nfinal Constructor<String> constructor = String.class.getConstructor(String.class);\n\
    final String str = constructor.newInstance(\"sample string\");\n```"
