    # Using methods common to all objects


    # 2.1 Introduction


    From part 1 of the tutorial, How to create and destroy objects, we already know
    that Java is an object-oriented language (however, not a pure object-oriented
    one). On top of the Java class hierarchy sits the Object class and every single
    class in Java implicitly inherits from it. As such, all classes inherit the set
    of methods declared in Object class, most importantly the following:


    Table 2.1: datasheet



    | Method | Description |

    | :--- | :--- |

    n| protected Object clone() | Creates and returns a copy of this object. |

    | protected void finalize() | Called by the garbage collector on an object when
    garbage collection determines that there are no more references to the object.
    We have discussed finalizers in the part 1 of the tutorial, How to create and
    destroy objects. |

    | boolean equals(Object obj) | Indicates whether some other object is "equal"
    to this one. |

    | int hashCode() | Returns a hash value for the object. |

    | String toString() | Returns a string representation of the object. |

    | void notify() | Wakes up a single thread that is waiting on this object''s monitor.
    We are going to discuss this method in the part 9 of the tutorial, Currency best
    practices. |

    | void notifyAll() | Wakes up all threads that are waiting on this object''s monitor.
    We are going to discuss this method in the part 9 of the tutorial, Currency best
    practices. |

    | void wait() | Causes the current thread to wait until another thread |

    | void wait(long timeout) | invokes the notify() method or the notifyAll() method
    for the object. We are going to discuss these methods in the part 9 of the tutorial,
    Currency best practices. |


    In this part of the tutorial we are going to look at equals,hashCode, and clone
    methods, their usage and important constraints to keep in mind.'
