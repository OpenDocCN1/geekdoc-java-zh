  md: "# Advanced java\n\nSecondly, follow the proper initialization: if the field\
    \ is the reference to a collection or array, do not assign those fields from constructor\
    \ arguments, make the copies inside. It will guarantee that state of the collection\
    \ or array will not be changed from outside.\n\n```\npublic ImmutableClass( final\
    \ long id, final String[] arrayStrings, {\n    final Collection< String> collectionOfString\
    \ = \n    this.id = id;\n    this.arrayStrings = Arrays.copyOf(arrayStrings, arrayStrings.length);\n\
    \    this.collectionOfString = new ArrayList< ( collectionOfString );\n}\n```\n\
    \nAnd lastly, follow the proper access getters. For the collection, the immutable\
    \ view should be exposed using Collections.unmodifiableXxx wrappers.\n\n```\n\
    public Collection<String> getCollectionOfString() {\n    return Collections.unmodifiableCollection(collectionOfString);\n\
    }\n```\n\nWith arrays, the only way to ensure true immutability is to provide\
    \ a copy of returning reference to the array. That might not be acceptable from\
    \ a practical standpoint as it depends on size and may put a lot of pressure on\
    \ garbage collector.\n\n```\npublic String[] getArrays() {\n    return Arrays.copyOf(arrayStrings,\
    \ arrayStrings.length);\n}\n```\n\nEven this simple gives a good example that\
    \ immutability is not a first citizen in Java. Things can get easily complicated\
    \ if an immutable class has referencing another class instances. Those classes\
    \ should also be immutable because there is no simple way to avoid.\n\nThere are\
    \ a couple of Java source code analyzers like FindBugs and PMD which may help\
    \ you inspecting your code and pointing to the common Java programming flows.\
    \ These tools are great friends of any Java developer.\n\n# 3.7 Anonymous classes\n\
    \nIn the Pre-Java 8 era, anonymous classes were the only way to provide in-place\
    \ class definitions and immediate instantiations. The purpose of anonymous classes\
    \ was to reduce boilerplate and provide a concise and easy way to represent classes\
    \ as expressions. Let us take a look at the old-fashioned way to spawn new thread\
    \ in Java:\n\n```\npackage com.javcodegeeks.advanced.design;\n\npublic class AnonymousClass\
    \ {\n    public static void main(String[] args) {\n        new Thread(\n     \
    \       // Example of creating anonymous class which implements\n            //\
    \ Runnable\n            new Runnable() {\n                @Override\n        \
    \        public void run() {\n                    // Implementation here\n   \
    \             }\n            }\n        ).start();\n    }\n}\n```\n\nIn this example,\
    \ the implementation of the Runnable interface is provided in place as anonymous.\
    \ Although there are some limitations associated with anonymous classes, the fundamental\
    \ disadvantages of their usage are a quite verbose constructs which Java imposes\
    \ as a language. The simplest anonymous class which does nothing requires at 5\
    \ lines of code to be written every time."
