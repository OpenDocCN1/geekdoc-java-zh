  md: "# Advanced java\n\n```\n}\nclass InnerClass {\n    interface InnerInterface\
    \ {\n        void performInnerAction();\n    }\n    void performAction();\n}\n\
    ```\n\nWith this more complex example, there are a couple of constraints which\
    \ interfaces implicitly imply with respect to the nested constructs and method\
    \ declarations, and Java compiler enforces them. First and foremost, even if it\
    \ is not being said every declaration in the interface is public (and can only\
    \ be public, for more details about visibility and accessibility rules, please\
    \ refer to section Visibility). As such, the following method declarations are\
    \ equivalent:\n\n```\npublic void performAction();\nvoid performAction();\n```\n\
    \nWorth to mention every single method in the interface is implicitly declared\
    \ as abstract and even these method declarations are equivalent:\n\n```\npublic\
    \ abstract void performAction();\npublic void performAction();\nvoid performAction();\n\
    ```\n\nAs for the first constant, declarations added to being public, they are\
    \ implicitly static and final so the following declarations are equivalent:\n\n\
    ```\nString CONSTANT = \"CONSTANT\";\npublic static final String CONSTANT = \"\
    CONSTANT\";\n```\n\nAnd finally, the classes or interfaces, in addition to being\
    \ public, are implicitly declared as static. For example, those class declarations\
    \ are equivalent as well:\n\n```\nclass InnerClass {\n}\nstatic class InnerClass\
    \ {\n```\n\nWhich one you are choosing is a personal preference, however knowledge\
    \ of those simple qualities of interfaces can save you from unnecessary typing.\n\
    \n# 3.3 Marker Interfaces\n\nMarker interfaces are a special kind of interfaces\
    \ which have no methods or other nested constructs defined. We have already seen\
    \ one example of the marker interface in part 2 of the tutorial Using methods\
    \ common to all objects, the interface Cloneable. Here is it defined in the Java\
    \ library:\n\n```\npublic interface Cloneable { }\n```\n\nMarker interfaces are\
    \ not contracts but somewhat useful technique to \"attach\" or \"tie\" some particular\
    \ trait to the class. For example, with respect to Cloneable, the class is marked\
    \ as being available for cloning the way it should or be done is not a part of\
    \ the interface. Another very well-known and widely used example of marker interface\
    \ is Serializable:"
