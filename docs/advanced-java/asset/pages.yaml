  md: "# 2.2 Methods equals and hashCode\n\nBy default, any two object references\
    \ (or class instance references) in Java are equal only if they are referring\
    \ to the same memory location (reference equality). But Java allows classes to\
    \ define their own equality rules by overriding the equals() method of the Object\
    \ class. It sounds like a powerful concept, however the correct equals() method\
    \ implementation should conform to a set of rules and satisfy the following constraints:\n\
    \n+   - Reflexive. Object x must be equal to equals(x) must return true.\n- Symmetric.\
    \ If equals(y) returns true then x.equals(y) must also return true.\n- Transitive.\
    \ If equals(y) returns true and y.equals(z) returns true, then x.equals(z) must\
    \ also return true.\n- Consistent. Multiple invocation of equals(object) method\
    \ must return the same value, unless of the properties used for comparison modified.\n\
    - Equals Null. The result of equals(null) must always be false.\n\nUnfortunately,\
    \ the Java compiler is not able to enforce these constraints during the compilation.\
    \ However, not following these rules may cause very weird and hard to troubleshoot\
    \ issues. The general advice is: if you are going to override your equals() method,\
    \ think twice if you need it. Armed with all these rules, let us write a simple\
    \ implementation of the equals() method for the Person class.\n\n```\npackage\
    \ com.javadegeeks.advanced.objects;\npublic class Person {\n    private final\
    \ String firstName;\n    private final String lastName;\n    private final String\
    \ email;\n\n    Person(String firstName, final String lastName, final String email)\
    \ {\n        this.firstName = firstName;\n        this.lastName = lastName;\n\
    \        this.email = email;\n    }\n\n    public String getEmail() {\n      \
    \  return email;\n    }\n\n    public String getFirstName() {\n        return\
    \ firstName;\n    }\n\n    public String getLastName() {\n        return lastName;\n\
    \    }\n\n    // Step 0: Please add the @Override annotation, it will ensure that\
    \ you\n    // intention is to change the default implementation.\n    @Override\n\
    \    public boolean equals(Object obj) {\n        // Step 1: Check if the 'obj'\
    \ is null\n        if (obj == null) {\n            return false;\n        }\n\n\
    \        // Step 2: Check if the 'obj' is pointing to this instance\n        if\
    \ (this == obj) {\n            return true;\n        }\n}\n```"
