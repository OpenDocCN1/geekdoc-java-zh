  md: "# Advanced java\n\nInstance fields are an extremely useful capability of Java.\
    \ They are used very often to associate some additional details with each value,\
    \ using regular class declaration rules.\n\n# 5.4 Enums and interfaces\n\nAnother\
    \ interesting feature, which yet one more time confirms that enums are just specialized\
