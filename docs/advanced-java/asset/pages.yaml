    \n# 1.2. Visibility\n\nConstructors subject to Java visibility rules and can have\
    \ access control modifiers which determine if other classes may invoke a particular\
    \ constructor.\n\nTable 1.2: datasheet\n\n| Modifier | Package | Subclass | Everyone\
    \ Else |\n| --- | --- | --- | --- |\n| public | accessible | accessible | accessible\
    \ |\n| protected | accessible | accessible | not accessible |\n| <no modifier>\
    \ | accessible | not accessible | not accessible |\n| private | accessible | not\
    \ accessible | not accessible |\n\n# 1.2.7 Garbage Collection\n\nJava (and JVM)\
    \ uses automatic garbage collection. To put it simply, whenever new objects are\
    \ created, the memory is automatically allocated for them. Consequently, whenever\
    \ objects are not referenced, they are destroyed and their memory is reclaimed.\n\
    Java garbage collection is generational and based on assumption that most objects\
    \ which die (not referenced anymore shortly after their creation and as such can\
    \ be destroyed). Most developers use believe that objects creation in Java is\
    \ slow and instantiation of the new objects should be avoided as much as possible.\
    \ In fact, it does not hold: the objects in Java is quite cheap and fast. Although\
    \ expensive though is an unnecessary creation of long-lived objects which eventually\
    \ fill up old generation and cause stop-the-world garbage collection."
