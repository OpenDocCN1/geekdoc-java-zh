  md: "# Advanced java\n\nTo invoke this function in Java 7 below, the implementation\
    \ of the Runnable interface should be provided (for example using Anonymous classes),\
    \ but in Java 8 it is enough to run Run() method implementation using lambda syntax:\n\
    \n```\nrunMe() = () -> System.out.println(\"Run!\");\n```\n\nAdditionally, the\
    \ functionalInterface annotations annotations will be covered in details in part\
    \ 5 of the tutorial. How and when to use Enums and Annotations hints the compiler\
    \ to verify that the interface contains only one abstract method so any changes\
    \ introduced to the future will not break this assertion.\n\n# 3.5 Abstract classes\n\
    \nAnother concept supported by Java language is the notion of abstract classes.\
    \ Abstract classes are somewhat similar to the interfaces in Java 7 and very close\
    \ to methods in Java 8. By contrast, abstract classes cannot be instantiated but\
    \ can be subclassed (please refer to the section Inheritance for details). More\
    \ importantly, abstract classes may contain abstract methods: the special kind\
    \ of methods without implementations, like interfaces. For example:\n\n```\npackage\
    \ com.javocodegeeks.advanced.design;\nnpublic abstract class SimpleAbstractClass\
    \ {\n    public void performAction() {\n        // Implementation here\n    }\n\
    \n    public abstract void performAnotherAction();\n}\n```\n\nIn this example,\
    \ SimpleAbstractClass is declared as abstract and has one abstract method declaration\
    \ well. Abstract classes are very useful when most or even some of implementation\
    \ details could be shared by many subclasses. They will leave the door open and\
    \ allow customizing the intrinsic behavior of each subclass by means of abstract\
    \ methods.\n\nOne thing to mention, in contrast to interfaces which can contain\
    \ only public declarations, abstract classes may the full power of accessibility\
    \ rules to control abstract methods visibility (please refer to the sections Visibility\
    \ and Inheritance for more)\n\n# 3.6 Immutable classes\n\nImmutability is becoming\
    \ more and more important in the software development nowadays. The rise of multi-core\
    \ systems has raised a lot of concerns related to data sharing and concurrency\
    \ (in the part 9. Concurrency best practices, we are going to discuss in these\
    \ topics) But the thing clearly emerged: less (or even absence of) mutable state\
    \ leads to better scalability and reasoning among the matters.\n\nThe Java language\
    \ does not provide strong support for class immutability. However using a combination\
    \ of techniques it is possible to design classes that are immutable. First and\
    \ foremost, all fields of the class should be final. A good start but does not\
    \ guarantee immutability\n\n```\npackage com.javocodegeeks.advanced.design;\n\n\
    import java.util.Collection;\nnpublic class ImmutableClass {\n    private final\
    \ long id;\n    private final String[] arrayOfStrings;\n    private final Collection<\
    \ String > collectionOfString;\n}\n```"
