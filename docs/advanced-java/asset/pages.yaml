  md: "# Chapter 5\n\n# How and when to use Enums and Annotations\n\n# 5.1 Introduction\n\
    \nIn this part of the tutorial we are going to cover another two great features\
    \ introduced into the language as Java 5 release along with generics: enums (or\
    \ enumerations) and annotations. Enums could be treated as a special type of classes\
    \ and annotations as a special type of interfaces.\n\nThe idea of enums is simple,\
    \ quite handy: it represents a fixed, constant set of values. What it means in\
    \ practice is that enums are often used to design the concepts which have a constant\
    \ set of possible states. For example, the days of the week are a great example\
    \ of the enums: they are Monday, Tuesday, Wednesday, Thursday, Friday, Saturday\
    \ and Sunday.\n\nFrom the other side, annotations are a special kind of metadata\
    \ which could be associated with different elements and constructs of the Java\
    \ language. Interestingly, annotations have contributed a lot into the elimination\
    \ of boilerplate XML descriptors in Java ecosystem everywhere. They introduced\
    \ the new, type-safe and robust way of configuration and customization techniques.\n\
    \n# 5.2 Enums as special classes\n\nBefore enums had been introduced into the\
    \ Java language, the regular way to model the set of fixed values in Java was\
    \ just by declaring a number of constants.\n\n```\npublic class DaysOfTheWeekConstants\
    \ {\n    public static final int MONDAY = 0;\n    public static final int TUESDAY\
    \ = 1;\n    public static final int WEDNESDAY = 2;\n    public static final int\
    \ THURSDAY = 3;\n    public static final int FRIDAY = 4;\n    public static final\
    \ int SATURDAY = 5;\n    public static final int SUNDAY = 6;\n}\n```\n\nAlthough\
    \ this approach of kind works, it is far from being the ideal solution. Primarily\
    \ because the constants are just values of int and every place in the code where\
    \ these constants are used (instead of arbitrary int values) should be explicitly\
    \ documented and asserted all time. Semantically, it is not a type-safe representation\
    \ of the concept as the following method demonstrates.\n\n```\npublic boolean\
    \ isWeekend(int day) {\n    return( day == SATURDAY || day == SUNDAY );\n}\n```"
