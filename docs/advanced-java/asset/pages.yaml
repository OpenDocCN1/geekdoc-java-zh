  md: "# Advanced java\n\n```\n// Implementation here\nreturn result;\n}\n```\n\n\
    If methods are declared (or defined) as part of generic interface or class, they\
    \ may (or may not) use the generic types of their owner. they may define own generic\
    \ types or mix them with ones from their class or interface declaration. For example:\n\
    \n```\npackage com.javadegeeks.advanced.generics;\n\npublic class GenericMethods<T>\
    \ {\n  public<R> R perform(final T action) {\n    final R result = ...;\n    //\
    \ Implementation here\n    return result;\n  }\n```\n\n```\npublic<U, R> R performAnother(final\
    \ U action) {\n  final R result = ...;\n  // Implementation here\n  return result;\n\
    }\n```\n\nClass constructors are also considered to be kind of initialization\
    \ methods, and as such, they may use the generic types declared by their class,\
    \ clear owner (they cannot return values so the type parameterization is not applicable\
    \ to constructors), for:\n\n```\npublic class GenericMethods<T> {\n  public GenericMethods(final\
    \ T initialAction) {\n    // Implementation here\n  }\n```\n\n```\npublic<J> GenericMethods(final\
    \ T initialAction, final J nextAction) {\n  // Implementation here\n}\n```\n\n\
    It looks very easy and simple, and it is surely. However, there are some restrictions\
    \ and side-effects caused by the way generics are implemented in Java language\
    \ and the next section is to address that.\n\n# 4.5 Limitations of generics\n\n\
    Being one of the brightest features of the language, generics unfortunately have\
    \ some limitations, mainly by the fact that they were introduced late into mature\
    \ language. Most likely, more implementation required significantly more time\
    \ and resources to the trade-offs made in order to have generics in a timely manner.\n\
    \nFirstly, primitive types (like int, long, byte,...) are not allowed to be used\
    \ in generics. It means whenever you need to parameterize your generic with a\
    \ primitive one, the class wrapper (Integer, Long, Byte,...) has to be used instead.\n\
    \n```\nfinal List<Long> long = new ArrayList<>();\nfinal Set<Integer> integers\
    \ = new HashSet<>();\n```\n\nNot only, because of necessity to use wrappers in\
    \ generics, it causes implicit boxing and unboxing of primitive values (this topic\
    \ will be covered in the part 7 of the tutorial, General programming guidelines),\
    \ for example:\n\n```\nfinal List<Long> long = new ArrayList<>();\nlongs.add(0L);\
    \ // 'long' is boxed to 'Long'\n```\n\n```\nlong value = longs.get(0); // 'Long'\
    \ is unboxed to 'long'\n// Do something with value\n```"
