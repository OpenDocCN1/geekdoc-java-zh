    \ same fields are used within implementation of equals() and hashCode() methods.\
    \ It will guarantee consistent behavior of both methods in case of any change\
    \ affecting the fields in question.\n\n# 2.3 Method to toString\n\nThe toString()\
    \ is arguably the most interesting method among the others and is overridden more\
    \ frequently. Its purpose is to provide the string representation of the object\
    \ class. The properly toString() method can easily simplify debugging and troubleshooting\
    \ of the issues in real-live systems.\n\nThe default toString() implementation\
    \ is not very useful in most cases and returns the full class name and object\
    \ hash code, separated by @fec.:\n\n```\ncom.javodegeeks.advanced.objects.Person@6104e2ee\n\
    ```\n\nLet us try to implement it and override the toString() method for our Person\
    \ class. Here is one of the ways to make it toString() more useful.\n\n```\n//\
    \ add the @Override annotation, it will ensure that your\n// intention is to change\
    \ the default implementation.\n@Override\npublic String toString() {\n    return\
    \ String.format(\"%email=%s, first name=%s, lastName=%s\",\n    getClass().getSimpleName(),\
    \ firstName, lastName);\n}\n```\n\nNow, the toString() method provides the string\
    \ representation of the Person instance with all its fields. For example, by executing\
    \ the following code below:\n\n```\nPerson person = new Person(\"John\", \"Smith\"\
    , \"john.smith@domain.com\");\nSystem.out.println(person.toString());\n```\n\n\
    The following output will be printed out in the console:\n\n```\nPerson[john.smith@domain.com,\
    \ first name=John, lastName=Smith]\n```\n\nUnfortunately, the standard Java library\
    \ has a limited support to simplify toString() method implementations, notably,\
    \ the most useful methods are Objects.toString(), Arrays.deepToString() /Arrays.\
    \ Let us take a look at the Object class and its possible toString() implementation.\n\
    \n```\npackage com.javodegeeks.advanced.objects;\n\nimport java.util.Arrays;\n\
    \npublic class Person {\n    private Person[] persons;\n\n    public Person(Person\
    \ ...persons) {\n        this.persons = Arrays.copyOf(persons, persons.length);\n\
    \    }\n\n    @Override\n    public String toString() {\n        return String.format(\"\
    %s=%s\",\n        getClass().getSimpleName(), Arrays.toString(persons));\n   \
    \ }\n\n    public Person[] getPersons() {\n        return persons;\n    }\n}\n\
    ```"
