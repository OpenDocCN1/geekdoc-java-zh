  md: "# Chapter 9\n\n# Concurrency best practices\n\n# 9.1 Introduction\n\nThe multiprocessor\
    \ and multicore hardware architectures greatly influence the design and execution\
    \ model of applications which run on them nowadays. In order to utilize the full\
    \ power of available computational units, the applications should be ready to\
    \ support multiple execution flows which are running concurrently and competing\
    \ for resources and memory. Concurrent programming brings a lot of challenges\
    \ related to data access and non-deterministic flow of events which can lead to\
    \ unexpected crashes and strange failures.\n\nIn this part of the tutorial we\
    \ are going to look at what Java can offer to the developers in order to help\
    \ them write robust and safe applications in concurrent world.\n\n# 9.2 Threads\
    \ and Thread Groups\n\nThreads are the foundational blocks of concurrent applications\
    \ in Java. Threads are sometimes called lightweight processes and they allow multiple\
    \ execution flows to proceed concurrently. Every single application in Java has\
    \ at least one thread called the main thread. Every thread exists inside JVM only\
    \ and may not reflect any operating system thread.\n\nThreads in Java are instances\
    \ of class. Typically, it is not recommended to directly create and manage threads\
    \ using the instances of Thread (executors and thread pools covered in section\
    \ Futures and Executors provide a better way to do that), however it is very easy\
    \ to do:\n\n```\npublic static void main(String[] args) {\n    new Thread(new\
    \ Runnable() {\n        @Override\n        public void run() {\n            //\
    \ Some implementation here\n        }\n    }).start();\n}\n```\n\nOr the same\
    \ using Java 8 lambda functions:\n\n```\npublic static void main(String[] args)\
    \ {\n    new Thread(() -> { /* Some implementation here */ }).start();\n}\n```\n\
    \nNevertheless creating a new thread in Java looks very simple, threads have a\
    \ complex lifecycle and can be one of the following states (a thread can be in\
    \ only one state at a given point in time)."
