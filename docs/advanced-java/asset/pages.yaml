    # 6.3 Method body


    Every method has its own implementation and purpose to exist. However, there are
    a couple of general guidelines that really help writing clean and understandable
    methods.


    Probably the most important one is the single responsibility principle: to implement
    the methods in a way, that every method does just one thing and does it well.
    Following this principle may blow up the number of classes, so it is important
    to keep the right balance.


    Last (but not) advice is related to using return statements. If a method returns
    some value, try to minimize the number of places where the return statement is
    called (some people may go further and recommend to use just return statement
    in all cases). Return statements method has, much harder it becomes to follow
    its logic flow and modify (or refactor) the implementation.


