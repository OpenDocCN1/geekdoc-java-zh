  md: "# 1.4.1 Singleton\n\nSingleton is one of the oldest and controversial patterns\
    \ in software developer's community. Basically, the main idea of it is to ensure\
    \ that only one instance of the class could be created at any given time. Being\
    \ so simple however, singleton raised a lot of the discussions about how to make\
    \ it right and in particular, thread-safe. Here is a naive version of singleton\
    \ class may look like:\n\n```\npackage com.javadegeeks.advanced.construction.patterns;\n\
    \npublic class NaiveSingleton {\n    private static NaiveSingleton instance;\n\
    \n    private NaiveSingleton() {\n    }\n\n    public static NaiveSingleton getInstance()\
    \ {\n        if (instance == null) {\n            instance = new NaiveSingleton();\n\
    \        }\n        return instance;\n    }\n}\n```\n\nAt least one problem with\
    \ this code is that it may create many instances of the class if called concurrently\
    \ by multiple threads. One of the ways to design a singleton properly (in non-lazy\
    \ fashion) is using the static final property of the class.\n\n```\nfinal property\
    \ of the class.\npackage com.javadegeeks.advanced.construction.patterns;\n\npublic\
    \ class EagerSingleton {\n    private static final EagerSingleton instance = new\
    \ EagerSingleton();\n\n    private EagerSingleton() {\n    }\n\n    public static\
    \ EagerSingleton getInstance() {\n        return instance;\n    }\n}\n```\n\n\
    If you do not want to waste your resources and would like your singleton to be\
    \ lazily when they are really needed, the explicit synchronization is required,\
    \ potentially leading to lower concurrency in a multithreaded environment (more\
    \ details about concurrency in Java will be discussing in part of the tutorial,\
    \ **Concurrency best practices**).\n\n```\npackage com.javadegeeks.advanced.construction.patterns;\n\
    \npublic class LazySingleton {\n    private static LazySingleton instance;\n\n\
    \    private LazySingleton() {\n    }\n\n    public static synchronized LazySingleton\
    \ getInstance() {\n        if (instance == null) {\n            instance = new\
    \ LazySingleton();\n        }\n        return instance;\n    }\n}\n```"
