  md: "# Advanced java\n\nLastly, reflection API does not provide enough safety guarantees,\
    \ developers to use Object instances in most of the places, and is quite limited\
    \ in transforming constructor / method arguments or method return values.\n\n\
    Since the Java 7 release, there are a couple of features which could provide much\
    \ faster, alternative way to access some functionality to be available only through\
    \ reflection calls. The next section will introduce you to them.\n\n# 11.6 Method\
    \ Handles\n\nThe Java 7 release introduced a new important feature into the JVM\
    \ and Java standard library - method handles. Method handle is a typed, directly\
    \ executable reference to an underlying method, constructor or field (or similar\
    \ low-level operation) with optional transformations of arguments or return values.\
    \ They are much better respect to method invocation using the Reflection API.\
    \ Let us take a look at a snippet which uses method handles to dynamically invoke\
    \ the method length() on the String class.\n\n```\nfinal MethodHandle lookup =\
    \ MethodHandles.lookup();\nfinal MethodType methodType = MethodType.fieldType(int.class);\n\
    final MethodHandle methodHandle = lookup.findVirtual(String.class, \"length\"\
    , methodType);\nfinal int length = (int)methodHandle.invoke(\"sample string\"\
    );\n// The length of the string is 13 characters\n```\n\nThe example above is\
    \ not complex and just outlines the basic idea of how method handles are capable\
    \ of. compare it it the same implementation which uses the Reflection API from\
    \ Reflection API section. It does have a bit more verbose than the performance\
    \ and type safety profile method handles are better alternative.\n\nMethod handles\
    \ are very powerful tool they build a necessary foundation for implementation\
    \ of dynamic (scripting) languages on the JVM platform. In the part 12 of the\
    \ tutorial, Dynamic languages support, we are going to look on couple of those\
    \ languages.\n\n# 11.7 Method Argument Names\n\nThe well-known issue which Java\
    \ developers have been facing for years is the fact that method argument names\
    \ are not preserved at runtime when we use reflection. Community projects, like\
    \ example Paramaner (https://github.com/paul-hamann/paramaner), tried to solve\
    \ this by injecting some additional metadata into the generated byte code. Lucky,\
    \ Java 8 changed this by introducing new compiler -parameters which inject the\
    \ exact method argument names into the byte code. Let us take a look on the following:\n\
    \n```\npublic static void performAction(final String action, final Runnable callback)\
    \ {\n  // Some implementation here\n}\n```\n\nIn the next step, let use the Reflection\
    \ API to inspect method argument names for this method and make sure they are\
    \ preserved:\n\n```\nfinal Method method = MethodNamesExample.class\ngetDeclaredMethod(\"\
    performAction\", String.class, Runnable.class);\nArrays.stream(method.getParameters())\n\
    \  .forEach(p -> System.out.println(p.getName()));\n```\n\nWith the -parameters\
    \ compiler option specified, the following output is great relief for developers\
    \ of many Java libraries and frameworks. From now on, much more pieces of metadata\
    \ can be extracted using just Java Reflection API without a need to introduce\
    \ any additional workarounds (or hacks)."
