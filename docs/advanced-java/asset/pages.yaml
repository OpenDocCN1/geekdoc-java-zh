  md: '# Chapter 14


    # Java Annotation Processors


    # 14.1 Introduction


    In this part of the tutorial we are going to demystify the magic of annotation
    processing, which is often used to inspect, modify or generate source code, driven
    only by annotations. Essentially, annotation processors are some kind of plugins
    of the Java compiler. Annotation processors used wisely could significantly simplify
    the life of Java developers so that is why they are often bundled with many popular
    libraries and frameworks.


    Being compiler plugins also means that annotation processors are a bit low-level
    and highly depend on the version of Java. However, the knowledge about annotations
    from the part 5 of the tutorial How when to use Enums and Annotations and Java
    Compiler API from the part 13 of the tutorial, Java Compiler API, is going to
    be very handy in the understanding of intrinsic details of how annotation processors
    work.


    # 14.2 When to Use Annotation Processors


    As we briefly mentioned, annotation processors are typically used to inspect the
    codebase against the presence of particular annotations and, on depending case,
    to:


    +   * generate a set of source or resources files

    * mutate (modify) the existing source code

    * analyze the existing source code and generate diagnostic messages


    The usefulness of annotation processors is overhyped. They can significantly reduce
    the amount of code which developers have to write (by generating or modifying
    one), or by doing static analysis, hint the developers if the assumptions expressed
    by a particular annotation are not being held.


    Being somewhat inevitable to developers, annotation processors are supported by
    all modern Java IDEs and popular building tools and generally do not any particular
    intrusion. In the next section of the tutorial we are going to build own somewhat
    an annotation processor which nonetheless will show the full power of this Java
    compiler feature.


    # 14.3 Annotation Processing Under the Hood


    Before diving into implementation of our own annotation processors, it is good
    to know the mechanics of that. Annotation processing happens in a sequence of
    rounds. On each round, an annotation processor might be asked to process a subset
    of the annotations which were found on the source and class files produced by
    a prior round.


    Please notice that, if an annotation processor was asked to process on a given
    round, it will be asked to process on subsequent rounds, including the last round,
    even if there are no annotations for it to process.'
