    \ as declared in its declaration. |\n| int ordinal() | Returns the ordinal of\
    \ this enumeration constant (its position in its enum declaration, where the initial\
    \ constant is assigned an ordinal of zero). |\n\nAdditionally, Java compiler automatically\
    \ generates two more helpful `static` methods for every enum type it encounters\
    \ (let us refer to the enum type as T).\n\n# Table 5.2: datasheet\n\n| Method\
