  md: "```\npublic class NullPointerException extends RuntimeException {\n    public\
    \ NullPointerException() {\n        super();\n    }\n\n    public NullPointerException(String\
    \ s) {\n        super(s);\n    }\n}\n```\n\nConsequently, checked exceptions represent\
    \ invalid conditions in the areas which are outside of the immediate control of\
    \ the program. Any checked exception is a subclass of Exception. In contrast to\
    \ the unchecked exceptions, checked exceptions must be caught by the caller or\
    \ as a part of the method signature (using throws). The IOException is, probable,\
    \ the most known among checked exceptions:\n\n```\npublic class IOException extends\
    \ Exception {\n    public IOException() {\n    }\n\n    public IOException(String\
    \ message) {\n        super(message);\n    }\n\n    public IOException(String\
    \ message, Throwable cause) {\n        super(message, cause);\n    }\n\n    public\
    \ IOException(Throwable cause) {\n        super(cause);\n    }\n}\n```\n\nThe\
    \ separation to checked and unchecked exceptions sounded like a good idea at the\
    \ time, however over the years it turned out that it has introduced more boilerplate\
    \ and not so pretty code that solved the real problems. The typical (unfortunately\
    \ quite cumbersome) pattern which emerged within Java ecosystem is to hide (wrap)\
    \ the checked exception within unchecked, for example:\n\n```\n// // Some I/O\
    \ operation here\ncatch (final IOException ex) {\n    throw new RuntimeException(\"\
