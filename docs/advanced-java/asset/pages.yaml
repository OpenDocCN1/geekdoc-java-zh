  md: "# Advanced java\n\n```\npublic interface Serializable {\n}\n```\n\nThis interface\
    \ marks the class as available for serialization and deserialization, and again,\
    \ it does not specify the way it\ncould or be done.\n\nThe markers interface have\
    \ their place in object-oriented design, although they do not satisfy the main\
    \ purpose of interface to be\na contract.\n\n# 3.4 Functional interfaces, default\
    \ and static methods\n\nWith the release of Java 8, interfaces have obtained very\
    \ interesting capabilities: static methods, default methods and\nautomatic conversion\
    \ of lambdas (functional interfaces).\n\nIn Interfaces we have emphasized the\
    \ fact that interfaces in Java can declare methods but are not allowed to\nimplement\
    \ them. With default methods it is not true anymore: an interface can mark a method\
    \ with the default\nkeyword and provide the implementation for it. For example:\n\
    \n```\npackage com.javadegeeks.advanced.design;\n\npublic interface InterfaceWithDefaultMethods\
    \ {\n    void performAction();\n\n    default void performDefaultAction() {\n\
    \        // Implementation here\n    }\n}\n```\n\nBeing an instance level, default\
    \ methods could be overridden by each interface implementer, but from now, interfaces\
    \ may also\ninclude static methods, for example:\n\n```\npackage com.javadegeeks.advanced.design;\n\
    \npublic interface InterfaceWithDefaultMethods {\n    static void createAction()\
    \ {\n        // Implementation here\n    }\n}\n```\n\nOne may say that providing\
    \ an implementation in the interface defeats the whole purpose of contract-based\
    \ development, but\nare are many reasons why these features were introduced into\
    \ the Java language and no matter how useful or confusing they are,\nare are there\
    \ for you to use.\n\nThe functional interfaces are different during story and\
    \ they are very helpful also-to the language. Basically, the\nfunctional interface\
    \ is the interface with just a single abstract method declared in it. The Runnable\
    \ interface from Java standard\nlibrary is a good example of this concept:\n\n\
    ```\n@FunctionalInterface\npublic interface Runnable {\n    void run();\n}\n```\n\
    \nThe Compiler treats functional interfaces differently and is to convert the\
    \ lambda function into the functional interface\nimplementation where it makes\
    \ sense. Let us take a look on enabling lambda function definition:\n\n```\npublic\
    \ void runMe(Runnable r) {\n    r.run();\n}\n```"
