  md: "# Advanced java\n\n# 5.13 Repeatable annotations\n\nIn-Java 8 era there was\
    \ another limitation related to the annotations which was not discussed yet: the\
    \ same annotation could appear only once at the same place, it cannot be repeated\
    \ multiple times. Java  eased this restriction by providing support for repeatable\
    \ annotations. For example:\n\n```\n@Target(ElementType.METHOD)\n@Retention(RetentionPolicy.RUNTIME)\n\
    public @interface RepeatableAnnotations {\n    RepeatableAnnotation value();\n\
    }\n\n@Target(ElementType.METHOD)\n@Retention(RetentionPolicy.RUNTIME)\n@Repeatable(RepeatableAnnotations.class)\n\
    public @interface RepeatableAnnotation {\n    String value();\n}\n\n@RepeatableAnnotation(\"\
    repetition 1\")\n@RepeatableAnnotation(\"repetition 2\")\npublic void performAction()\
    \ {\n    // Some code here\n```\n\nAlthough in Java 8 the repeatable features\
    \ requires a bit of work to do in order to allow your annotation to be repeatable\
    \ (@Repeatable), the final result is worth: more clean and annotated code.\n\n\
    # 5.14 Annotation processors\n\nThe Java compiler supports a special kind of plugins\
    \ called annotation processors (using the -processor command line argument) which\
    \ could process the annotations during the compilation phase. Annotation processors\
    \ can analyze the annotations usage (perform static analysis), create additional\
    \ Java source files or resources (which in turn can be compiled and processed)\
    \ or modify the annotated code.\n\nThe retention policy (please see Annotations\
    \ and retention policy) plays a key role by instructing the compiler which annotations\
    \ should be available for processing by annotation processors.\n\nAnnotation processors\
    \ are widely used, however to write one it requires some knowledge of how Java\
    \ compiler works and the compilation process itself.\n\n# 5.15 Annotations and\
    \ configuration over convention\n\nConvention over configuration is a software\
    \ design pattern which aims to simplify the development process when a set of\
    \ simple rules (or conventions) is being followed by the developers. For example,\
    \ MVC (model-view-controller) frameworks follow the convention to place controllers\
    \ in the controller folder (or package). Another example is the ORM (object-relational\
    \ mapper) frameworks which often follow the convention to look up classes in model\
    \ folder (or package) or derive the relation table name from the class name.\n\
    \nOn the other side, annotations open the way for a different design paradigm\
    \ which is based on explicit configuration. Considering the examples above, @Controller\
    \ annotation may explicitly mark any class as controller and @Entity refer to\
    \ relational database table. The benefits also come from the fact annotations\
    \ are extensible, may have additional attributes and are restricted to particular\
    \ element types. Improper use of annotations is enforced by the Java compiler\
    \ and reveals the misconfiguration issues very early (on the compilation phase)."
