  md: "# Advanced java\n\nThe way we have implemented the interface is a bit verbose,\
    \ however it is certainly possible to make it better by combining instance fields\
    \ and interfaces together. For example:\n\n```\npublic enum DaysOfWeekFields implements\
    \ DayOfWeek {\n    MONDAY ( false),\n    TUESDAY ( false),\n    WEDNESDAY ( false),\n\
    \    THURSDAY ( false),\n    FRIDAY ( false),\n    SATURDAY ( true),\n    SUNDAY\
    \ ( true);\n\n\n    private final boolean isWeekend;\n\n    private DaysOfWeekFieldsInterfaces(\
    \ final boolean isWeekend) {\n        this.isWeekend = isWeekend;\n    }\n\n \
    \   @Override\n    public boolean isWeekend() {\n        return isWeekend;\n \
    \   }\n```\n\nBy supporting instance fields and interfaces, enums are used in\
    \ a more object-oriented way, bringing some level of abstraction to rely upon.\n\
    \n# 5.5 Enums and generics\n\nAlthough it is not visible from a first glance,\
    \ there is a relation between enums and generics in Java. Every single enum in\
    \ Java is automatically inherited from the generic Enum<T> class, where T is the\
    \ enum type itself. The Java compiler does this transformation on behalf of the\
    \ developer at compile time, expanding enum declaration public enum DaysOfWeek\
    \ to something like this:\n\n```\npublic class DaysOfTheWeek extends Enum<DaysOfTheWeek>\
    \ {\n    // Other declarations here\n```\n\nIt also explains why enums can implement\
    \ interfaces but cannot extend other classes: they implicitly extend Enum<I> as\
    \ we know from part 2 of the tutorial, Using methods to all objects, Java does\
    \ not support multiple inheritance.\n\nThe fact that every enum Enum<T> allows\
    \ to define generic classes, interfaces and methods which affect the instances\
    \ of enums use as arguments or parameters. For example:\n\n```\npublic <T extends\
    \ Enum<?>> void performAction( final T instance ) {\n    // Perform some action\
    \ here\n```\n\nIn the method declaration, type T is constrained to the instance\
    \ of any enum and Java compiler will verify that.\n\n# 5.6 Convenient Enums methods\n\
    \nThe base Enum<T> class provides a couple of helpful methods that are automatically\
    \ inherited by every enum instance.\n\nTable 5.1: datasheet"
