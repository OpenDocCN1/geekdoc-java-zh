  md: "# Advanced java\n\nNowadays, singletons are not considered to be a good choice\
    \ in most cases, primarily because they are making a code very hard to test. The\
    \ domination of dependency injection pattern (please see the Dependency Injection\
    \ section below) also makes singletons unnecessary.\n\n# 1.4.2 Utility/Helper\
    \ Class\n\nThe utility or helper classes are popular pattern used by many Java\
    \ developers. Basically, it represents the non-instable class (with constructor\
    \ declared as private), optionally declared as final (more about declaring classes\
    \ as final will be provided in part 3 of the tutorial, How to design Classes and\
    \ Interfaces) and contains static methods only. For example:\n\n```\npackage com.javacodegeeks.advanced.construction.patterns;\n\
    \npublic class HelperClass {\n    private HelperClass() {\n}\n\n    public static\
    \ void helperMethod1() {\n        // Method body here\n    }\n\n    public static\
    \ void helperMethod2() {\n        // Method body here\n    }\n}\n```\n\nFrom seasoned\
    \ software developer standpoint, such helpers often become containers for all\
    \ kind of non-related methods which have not found other place to be put in but\
    \ should be shared and used by other classes. Such design decisions can be avoided\
    \ in most cases: it is always possible to find another way to use the required\
    \ functionality, keeping the code clean and concise.\n\n# 1.4.3 Factory\n\nFactory\
    \ pattern is proven to be extremely useful technique in the hands of software\
    \ developers. As such, it has several flavors in Java, ranging from factory method\
    \ to abstract factory. The simplest example of factory pattern is a static method\
    \ which returns new instance of a particular class (factory method). For example:\n\
    \n```\npackage com.javacodegeeks.advanced.construction.patterns;\n\npublic class\
    \ Book {\n    private Book(final String title) {\n}\n    public static Book newBook(final\
    \ String title) {\n        return new Book(title);\n    }\n}\n```\n\nOne may argue\
    \ that it does not make a lot of sense to introduce the newBook factory method\
    \ but using such pattern often makes the code more readable. Another variant of\
    \ factory pattern involves interfaces or abstract classes (abstract factory).\
    \ For example, let us define a factory interface:\n\n```\npublic interface BookFactory\
    \ {\n    Book newBook();\n}\n```\n\nWith couple of different implementations,\
    \ depending on the library type:"
