    # 10.8 Cost of serialization


    It is very important to understand that though serialization / deserialization
    looks simple in Java, it is not free and depending on the data model and access
    patterns may consume a lot of bandwidth, memory and CPU resources. Moreover Java
    has some kind of versioning for the serializable classes (serial version UID)
    as we does make the development process harder as developers are on their own
    to manage data evolution.


    To add another point, Java serialization does not work well outside of JVM. It
    is a significant constraint for the modern distributed applications which are
    built using multiple programming languages and runtimes.


    That explains why alternative serialization frameworks and solutions have emerged
    and became very popular choice in the Java ecosystem.


    # 10.9 Beyond Java standard library specifications


    In this section we are going to look on alternatives for painless and effective
    Java serialization, starting with the Fast-serialization project (http://rudiegermo.github.io/fast-serialization/)
    the fast Java serialization drop-in. The usage of Fast-serialization is not much
    different from what Java standard library provides but it claims to be much faster
    and more effective.


    Another set of frameworks have taken on the problem. They are based on structured
    data definition (or protocol) and serialize data into compact binary representation
    (the corresponding data model could even be generated from the definition). Aside
    from that, those frameworks are going far beyond Java platform and can be used
    for cross-language / cross-platform serialization. The most known Java libraries
    in this space are Google Protocol Buffers (https://developers.google.com/protocol-buffers/),
    Apache Avro (http://avro.apache.org/) and Apache Thrift (https://thrift.apache.org/).


