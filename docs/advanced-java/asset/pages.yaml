  md: "# Advanced java\n\nThe Vehicle class is composed of out engine and wheels (plus\
    \ many other parts which are left for simplicity). However, one may say that Vehicle\
    \ class is also an engine and so could be designed using the inheritance.\n\n\
    ```\npublic class Vehicle extends Engine {\n    private Wheels[] wheels;\n   \
    \ // ...\n```\n\nWhich design decision is right? The general guidelines are known\
    \ as IS-A and HAS-A principles. IS-A is the inheritance relationship: the subclass\
    \ allows the pattern class specification and such IS-A variation of pattern. Consequently,\
    \ HAS-A is the composition relationship: the class (or HAS-A) the objects which\
    \ belongs to. In most cases, the HAS-A principle better than IS-A for a couple\
    \ of reasons:\n\n+   * The design is more flexible in a way it could be\n* The\
    \ model stores changes as notating through class hierarchies\n* The class and\
    \ its composites are loosely coupled to inheritance which tightly couples parent\
    \ and its subclasses\n* The reasoning about class is simpler as all its dependencies\
    \ are included in it, in one place\n\nHowever, the inheritance has its place,\
    \ solves real design issues in different way and should not be neglected. Please\
    \ keep those alternatives in mind designing your object-oriented models.\n\n#\
    \ 3.12 Encapsulation\n\nThe concept of encapsulation in object-oriented programming\
    \ is all about hiding the implementation details (like state, internal, etc.)\
    \ from the outside world. The benefits of encapsulation are maintainability and\
    \ ease of change. The intrinsic details expose class, the more control the developers\
    \ have over their internal implementation, without the fear of breaking the code\
    \ class if you are developing a library or framework used by many people.\n\n\
    Encapsulation in Java is achieved using visibility and accessibility rules. It\
    \ is considered best practice in Java to never expose the fields directly, only\
    \ by means of getters and setters (if the field is not declared as final). For\
    \ example:\n\n```\npackage com.javocodeeks.advanced.design;\n\npublic class Encapsulation\
    \ {\n    private final String email;\n    private String address;\n\n    public\
    \ Encapsulation(final String email) {\n        this.email = email;\n    }\n\n\
    \    public String getAddress() {\n        return address;\n    }\n\n    public\
    \ void setAddress(String address) {\n        this.address = address;\n    }\n\n\
    \    public String getEmail() {\n        return email;\n    }\n}\n```\n\nThis\
    \ example resembles what is called JavaBeans in Java language: the regular Java\
    \ classes written by following the set of conventions, one of them allows the\
    \ access to the fields using getter and setter methods only."
