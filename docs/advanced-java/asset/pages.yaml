    # General programming guidelines


    # 7.1 Introduction


    In this part of the tutorial we are going to continue discussing general principles
    of good programming style and robust design in Java. Some of these principles
    we have already seen in the previous parts of the tutorial, however a lot of new
    practical advices will be introduced along the way to improve your skills as a
    Java developer.


    # 7.2 Variable scopes


    In the part 3 of the tutorial, How to design Classes and Interfaces, we have discussed
    the visibility and accessibility could be applied to classes and interface members,
    limiting their scope. However we have not discussed the local variables, which
    are used within implementation methods.


    In the Java language, every local variable, once declared, has its scope. The
    variable becomes visible from the place it is declared to the end of the method
    (or code block) it is declared in. As such, there is only one rule to follow:
    declare the local variable as close to the place where it is used as possible.
    Let us take a look on some typical examples:


    ```

    for( final Locale locale: Locale.getAvailableLocales() ) {

    // Some implementation here

    ```


    ```

    try( final InputStream inputStream = new FileInputStream("file.txt") ) {

    // Some implementation here\}

    ```


    In both cases the scope of the local variables is limited to the blocks they are
    declared in. Once the block ends, the local variable goes out of scope and is
    not visible. With the release of Java 8 and introduction of lambdas, well-known
    issues of using local variables are becoming obsolete. We rewrite the for-each
    loop from previous example using lambda instead:


    ```

    Arrays.stream(Locale.getAvailableLocales()).forEach( locale ) -> {

    // Some implementation here

    ```



    The local variable becomes the argument of the function which is used as the argument
    of the forEach method.


    # 7.3 Class fields and local variables


    Every method in Java belongs to some class (or inner class in case of Java 8 and
    the method is declared as default). As such, there is a probability of name conflicts
    between local variables used in method implementations and class members.'
