    | Element Type | Description |

    | --- | --- |

    | TYPE_PARAMETER | Type parameter declaration |

    | TYPE_USE | Use of a type |


    In contrast to the retention policy, an annotation may declare multiple element
    types it can be associated with, with the @Target annotation. For example:


    ```

    import java.lang.annotation.ElementType;

    import java.lang.annotation.Target;

    @Target( { ElementType.FIELD, ElementType.METHOD } )

    public @interface AnnotationWithWithTarget {

    }

    ```


    Most all ones you are going to create should have both retention policy and element
    types specified in order to be useful.


    # 5.12 Annotations and inheritance


    The important relation exists between declaring annotations and inheritance in
    Java. By default, the subclasses do not inherit the annotation declared on the
    class. However there is a way to propagate annotations throughout the class using
    the @Inherited annotation. For example:


    ```

    @Target( { ElementType.TYPE } )

    @Retention ( RetentionPolicy.RUNTIME )

    @Inherited

    @interface InheritableAnnotation {

    }


    @InheritableAnnotation

    public class Parent {

    }


    public class Child extends Parent {

    }

    ```


    In this example, the @InheritableAnnotation annotation declared on the Parent
    class will be inherited by the Child class as well.'
