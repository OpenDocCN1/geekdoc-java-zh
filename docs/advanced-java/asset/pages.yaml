  md: "# 3.10 Multiple inheritance\n\nIn contrast to C++ and some other languages,\
    \ Java does not support multiple inheritance: in Java every class has exactly\
    \ one direct parent (Object class being on top of the hierarchy as we already\
    \ know from part 2 of the tutorial, Using methods to all objects). However, the\
    \ class can implement multiple interfaces and, stacking interfaces is the only\
    \ way to achieve (or mimic) multiple inheritance in Java.\n\n```\npackage com.javacodegeeks.advanced.design;\n\
    \npublic class MultipleInterfaces implements Runnable, AutoCloseable {\n    @Override\n\
    \    public void run() {\n        // Some implementation here\n    }\n\n    @Override\n\
    \    public void close() throws Exception {\n        // Some implementation here\n\
    \    }\n}\n```\n\nImplementation of multiple interfaces is fact quite powerful,\
    \ but often the need to reuse an implementation leads to deep class hierarchies\
    \ as way to overcome the absence of multiple inheritance support in Java.\n\n\
    ```\npublic class A implements Runnable {\n    @Override\n    public void run()\
    \ {\n        // Some implementation here\n    }\n```\n\n> // Class B wants to\
    \ inherit the implementation of run() method from class A.\n\n```\npublic class\
    \ B extends A implements AutoCloseable {\n    @Override\n    public void close()\
    \ throws Exception {\n        // Some implementation here\n    }\n```\n\n> //\
    \ Class C wants to inherit the implementation of run() method from class A\n//\
    \ and the implementation of close() method from class B.\n\n```\npublic class\
    \ C extends B implements Readable {\n    @Override\n    public int read(java.nio.CharBuffer\
    \ cb) throws IOException {\n        // Some implementation here\n    }\n```\n\n\
    And so on... Recent Java 8 release somewhat addressed the problem with the introduction\
    \ of default methods. Because of default methods, interfaces have started to provide\
    \ not only contract but implementation, the classes which implement them are automatically\
    \ inheriting these implemented methods as well. For example:\n\n```\npackage com.javacodegeeks.advanced.design;\n\
    \npublic interface DefaultMethods extends Runnable, AutoCloseable {\n    @Override\n\
    \    default void run() {\n        // Some implementation here\n    }\n```"
