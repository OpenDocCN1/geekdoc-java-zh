  md: "# Advanced java\n\nBut primitive types are just one of generics pitfalls. Another,\
    \ more obscure, is erasure. It is important to know that generics exist only at\
    \ compile time: the Java compiler uses a complicated set of rules to enforce type\
    \ safety with generics and their type parameters, whereas the JVM bytecode has\
    \ all concrete types erased (replaced with the Object class). It can also come\
    \ as a surprise that the following code does not compile:\n\n```\nvoid sort(Collection<String>\
    \ strings) {\n    // Some implementation over strings here\n}\n\nvoid sort(Collection<Number>\
    \ numbers) {\n    // Some implementation over numbers here\n}\n```\n\nFrom the\
    \ developer's standpoint, it is a perfectly valid code because of type erasure,\
    \ however two methods are narrowed to the same signature and leads to compilation\
    \ error (with a message like \"Erasure of method(Collection<String>) is the same\
    \ as another method...\")\n\n```\nvoid sort(Collection<String> strings)\nvoid\
    \ sort(Collection<Number> numbers)\n```\n\nAnother disadvantage caused by type\
    \ erasure come from the fact that it is not possible to use generics' type parameters\
    \ in any meaningful way, example to create new instances of the type, or get the\
    \ class of the type or use it in the instanceof operator. The examples do not\
    \ pass compilation check:\n\n```\n<T> void action(final T action) {\n    if (action\
    \ instanceof T) {\n        // Doing something here\n    }\n}\n```\n\n```\n<T>\
    \ void action(final T action) {\n    if (T.class.isAssignableFromFrom(Number.class))\
    \ {\n        // Doing something here\n    }\n}\n```\n\nAnd, lastly it is also\
    \ not possible to create the array instances using generics' type parameters.\
    \ For example, the following code does not compile (with a clear error message\
    \ \"Cannot create a generic array of T\"):\n\n```\n<T> void performAction(final\
    \ T action) {\n    T[] actions = new T[0];\n```\n\nDespite all these issues, generics\
    \ are still extremely useful and bring a lot of value. In the section Accessing\
    \ generic type parameters we are going to take a look at some of the ways to overcome\
    \ some of the constraints imposed by generics implementation in Java language.\n\
    \n# 4.6 Generics, wildcards and bounded types\n\nSo far we have seen the examples\
    \ using generics with unbounded type parameters. The extremely powerful ability\
    \ of generics is imposing the constraints (or bounds) on the type to be parameterized\
    \ using the extends and super keywords.\n\nThe extends keyword restricts the type\
    \ parameter to be a subclass of some other class or to implement one or more interfaces.\
    \ For example:\n\n```\npublic <T extends InputStream> void read(final T stream)\
    \ {\n    // Some implementation here\n}\n```"
