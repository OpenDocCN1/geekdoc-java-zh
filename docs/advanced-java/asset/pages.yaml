    \n```\nclass java.lang.String\n```\n\n# 11.4 Reflection API and visibility\n\n\
    In the part 1 of the tutorial, How to create and destroy objects, we have met\
    \ first time the accessibility visibility rules which are supported by the Java\
    \ language. It may come as a surprise, but the reflection API is able to modify,\
    \ in a certain way, the visibility rules of a given class member.\n\nLet us a\
    \ look at the following example of the class with a single private field. The\
    \ getter to is provided, but the setter is not, and by this is intention.\n\n\
    ```\npublic static class PrivateFields {\n    private String name;\n\n    public\
    \ String getName() {\n        return name;\n    }\n}\n```\n\nObviously, it is\
    \ apparent for any Java that the name field cannot be set using Java syntax constructs\
    \ as the class does not provide the way to do that. Reflection API on the resource,\
    \ see how it can be done by changing field's visibility and accessibility scope.\n\
    \n```\nfinal PrivateFields instance = new PrivateFields();\nfinal Field field\
    \ = PrivateFields.class.getDeclaredField(\"name\");\nfield.setAccessible(true);\n\
    field.set(instance, \"sample name\");\nSystem.out.println(instance.getName());\n\
    ```\n\nThe following output be printed on the console:\n\n```\nsample name\n```\n\
    \nPlease note that without the field.setAccessible( true ) call, the exception\
    \ will be raised at runtime saying that the class of member with modifiers private\
    \ cannot be accessed.\n\nThis feature of the reflection API is often used by test\
    \ scaffolding or dependency injection frameworks in order to get access to the\
    \ intrinsic (or not exposeable) implementation details. Please, try avoiding it\
    \ in your applications unless you really have no other choice.\n\n# 11.5 Reflection\
    \ API pitfalls\n\nAlso, be aware that though the reflection API is very powerful,\
    \ it has a few pitfalls. First of all, it is a subject of security permissions\
    \ and may not be available in all environments where your code is running. Secondly,\
    \ it could have a performance impact on your applications. The calls to reflection\
    \ API are quite expensive."
