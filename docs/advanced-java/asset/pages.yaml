  md: '# Chapter 15


    # Java Agents


    # 15.1 Introduction


    In this last part of the tutorial we are going to talk about Java Agents, a real
    black magic for regular Java developers out there. Java agents are able to "intrude"
    into the execution of Java applications running on the JVM at runtime by performing
    the direct modifications of the bytecode. Java agents are extremely powerful as
    dangerous: they can do everything however if something goes wrong, they can easily
    crash the JVM.


    The goal of this part is to densify Java agents by explaining how they work, how
    to run them and showing off some simple examples where Java agents come as a clear
    advantage.


    # 15.2 Java Agent Basics


    In essence, a Java agent is a regular Java class that follows a set of strict
    conventions. The agent class must implement a `public static void premain(String
    agentArgs, Instrumentation inst)` method which becomes an agent entry point (similar
    to the `main` method for regular Java applications).


    Once the Java Virtual Machine (JVM) has initialized, each `premain(String agentArgs,
    Instrumentation inst)` method of every agent will be called in the order the agents
    were specified on JVM start. When this initialization step is done, the real Java
    application `main` method will be called.


    If the class does not implement public static void premain(String agentArgs, Instrumentation
    inst)` method, the JVM will try to load and invoke another, overloaded version,
    `public static void main(String agentArgs)`. Please note that each `premain` method
    must return in order for the startup phase to proceed.


    But last not least, the Java class may also have a `public static void agentmain(String
    agentArgs, Instrumentation inst)` or `public static void agentmain(String agentArgs)`
    methods which are used when the agent is started after JVM startup.


    It looks simple on the first glance but there is one more thing Java agent implementation
    should provide as part of its packaging: manifest. Manifest file, usually located
    in the META-INF folder and NAMED `MANIFEST.MF`, contains various metadata related
    to package distribution.


    We have not talked about manifests during this tutorial because most of the time
    they are not required, however this is not the case with Java agents. The following
    attributes are defined for Java agents who are packaged as a Java archive (or
    simply JAR) files:'
