  md: "# Advanced java\n\nThe type parameter T in the read method declaration is required\
    \ to be a subclass of the InputStream. The same keyword is used to restrict interface\
    \ implementations. For example:\n\n```\npublic< T extends Serializable > void\
    \ store( final T object ) {\n    // Some implementation here\n}\n```\n\nMethod\
    \ store requires its type T to implement the Serializable interface in order for\
    \ the method to perform the desired action. It is also possible to use other type\
    \ parameter as a bound for extends keyword, for example:\n\n```\npublic< T, J\
    \ extends T> void action( final T initial, final J next ) {\n    // Some implementation\
    \ here\n}\n```\n\nThe bounds are not limited to single constraints and can be\
    \ combined using the &amp; There could be multiple interfaces where only class\
    \ is allowed. The combination of class and interfaces is also possible, with a\
    \ couple of examples shown below:\n\n```\npublic< T extends InputStream &amp;\
    \ Serializable > void storeTo( final T stream ) {\n    // Some implementation\
    \ here\n}\n```\n\n```\npublic< T extends Serializable &amp; Externalizable &amp;\
    \ Cloneable > void persist( final T object ) {\n    // Some implementation here\n\
    }\n```\n\nBefore discussing the super, we need to get familiar with the concept\
    \ of wildcards. If the type parameter is not of interest of the generic class,\
    \ interface or method, it could be replaced by the wildcard? For example:\n\n\
    ```\npublic void store( final Collection< ? extends Serializable > objects ) {\n\
    \    // Some implementation here\n}\n```\n\nThe method store does not care what\
    \ type parameters it is being called, the only thing it needs to ensure is that\
    \ every type implements Serializable interface. Or, if this is not of importance,\
    \ the wildcard without bounds could be used instead:\n\n```\npublic void store(final\
    \ Collection< ? objects ) {\n    // Some implementation here\n}\n```\n\nIn contrast\
    \ to extends, the super keyword restricts the type parameter to a superclass of\
    \ some other class. For example:\n\n```\npublic void iterate( final Collection<\
    \ ? super Integer > objects ) {\n    // Some implementation here\n}\n```\n\nBy\
    \ using upper and lower type bounds (with extends and super) the generics provide\
    \ a way to fine-tune the type parameter requirements or, in some cases, completely\
    \ omit them, preserving the generics type-oriented semantic.\n\n# 4.7 Generics\
    \ and type inference\n\nWhen generics found their way into the Java language,\
    \ they blew up the amount of the code developers had to write in order to satisfy\
    \ the syntax rules. For example:\n\n```\nfinal Map< String, Collection< String\
    \ > > map =\n    new HashMap< String, Collection< String > >();\n```"
