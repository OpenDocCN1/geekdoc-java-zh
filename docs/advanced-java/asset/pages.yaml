  md: '# 5.16 When to use annotations


    Annotations are literally everywhere: the Java standard library has a lot of them,
    mostly every Java specification includes the annotations as well. Whenever you
    need to associate an additional metadata with your code, annotations are straightforward
    and easy way to do so.


    Interestingly, there is an ongoing effort in the Java community to develop common
    semantic concepts and standardize the annotations across several Java technologies
    (for more information, please take a look on JSR-250 specification). At the moment,
    following annotations are included with the Java standard library.


    Table 5.6: datasheet


    | Annotation | Description |

    | --- | --- |

    | @Deprecated | Indicates that the marked element is deprecated and should no
    longer be used. The compiler generates a warning whenever a program uses a method,
    class, or field with this annotation. |

    | @Override | Hints the compiler the element is meant to override an element declared
    in a subclass. |

    | @SuppressWarnings | Instructs the compiler to suppress warnings that it would
    otherwise generate. |

    | @SafeVarargs | When applied to a method or constructor, asserts that the code
    does not perform unsafe operations on its varargs parameter. When this annotation
    type is used, unchecked warnings relating to varargs are suppressed (more details
    about varargs will be covered in the part 6 of the tutorial, How to write methods).
    |

    | @Retention | Specifies how the marked annotation is retained. |

    | @Target | Specifies what kind of Java elements the marked annotation can be
    applied to. |

    | @Documented | Indicates that the specified annotation is used those elements
    should be documented using the Javadoc tool (by default, annotations are not included
    in Javadoc). |

    | @Inherited | Indicates that the annotation type can be inherited from the super
    class (for more details please refer to Annotations and inheritance section).
    |


    The Java 8 release adds a couple of new annotations as well.


    Table 5.7: datasheet


    | Annotation | Description |

    | --- | --- |

    | @FunctionalInterface | Indicates that the type declaration is intended to be
    a functional interface, as defined by the Java Language Specification (more details
    about functional interfaces are covered in the part 3 of the tutorial, How to
    design Classes and Interfaces). |

    | @Repeatable | Indicates that the marked annotation can be applied more than
    once to the same declaration or use type (for more details please refer to Repeatable
    annotations section). |'
