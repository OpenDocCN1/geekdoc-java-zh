  md: "# Chapter 13\n\n# Java Compiler API\n\n# 13.1 Introduction\n\nIn this part\
    \ of the tutorial we are going to take 10000 feet view of the Java Compiler API.\
    \ This API provides programmatic access to the Java compiler itself and allows\
    \ developers to compile Java classes from source files on the fly from application\
    \ code.\n\nMore interestingly, we are also going to walk through the Java Compiler\
    \ Tree API, which provides access to Java syntax parser functionality. By using\
    \ this API, Java developers have the ability to directly plug into syntax parsing\
    \ phase and post-analyze Java source code being compiled. It is a very powerful\
    \ API which is heavily utilized by many static code analysis tools.\n\nThe Java\
    \ Compiler also supports annotation processing (for more details please refer\
    \ to part 5 of the tutorial, How and when to use Enums and Annotations, more come\
    \ in part 14 of the tutorial, Annotation Processors) and is split between three\
    \ packages, shown below.\n\n+   * javax.annotation.processing :Annotation processing.\n\
    * java.lang.Model : Language model used in annotation processing and Compiler\
    \ Tree API (including Java language elements, types and utility classes).\n* java.tools.tools\
    \ : Java Compiler API itself.\n\nOn the other side, the Java Compiler Tree API\
    \ is hosted by the com.sun.source package and following Java standard library\
    \ naming conventions, is considered to be non-standard (proprietary or internal).\
    \ In general, these APIs are not very well documented or could change any time.\
    \ Moreover, they are tied to the particular JDK/JRE version and may limit the\
    \ portability of applications which use.\n\n# 13.2 Java Compiler API\n\nOur exploration\
    \ will start from the Java Compiler API, which is quite well documented and easy\
    \ to use. The entry point into Java Compiler API is the ToolProvider class, which\
    \ allows to obtain the Java compiler available in the system (the official documentation\
    \ is a great starting point to get familiar with the typical usage scenarios).\
    \ For example:\n\n```\nfinal JavaCompiler compiler = ToolProvider.getSystemJavaCompiler();\n\
    for (final SourceVersion version : compiler.getSourceVersions()) {\n    System.out.println(version);\n\
    }\n```\n\nThis small snippet gets the Java compiler instances and prints out on\
    \ the console a list of supported Java source versions. For Java 7 compiler, the\
    \ output looks like this:"
