  md: "# Advanced java\n\n```\n// Implementation here\n}\n}\n```\n\nThe standard generic\
    \ library has a plenty of the generic interfaces, primarily within collections\
    \ library. It is very easy to declare and use generic interfaces we are going\
    \ to get back to once again when discussing bounded types (wildcards and bounded\
    \ types) and generic limitations (Limitation of generics).\n\n# 4.3 Generics and\
    \ classes\n\nSimilarly to interfaces, the difference between regular and generic\
    \ classes is only the type parameters in the class definitions. For example:\n\
    \n```\npackage com.javacodegeeks.advanced.generics;\npublic class GenericClassOneType<\
    \ T > {\n    public void performAction( final T action ) {\n        // Implementation\
    \ here\n    }\n}\n```\n\nPlease note that any class (concrete, abstract or final)\
    \ could be parameterized using generics. One interesting detail is that the class\
    \ may (or not) its generic type (or) down to the interfaces and parent classes,\
    \ without providing the exact type instance, for example:\n\n```\npackage com.javacodegeeks.advanced.generics;\n\
    public class GenericImplementingGenericInterface< T > {\n    @Override\n    public\
    \ void performAction( final T action ) {\n        // Implementation here\n   \
    \ }\n}\n```\n\nIt is a very convenient technique which allows classes to impose\
    \ additional bounds on generic type still conforming the interface (or parent\
    \ class), as we will see in section wildcards and bounded types.\n\n# 4.4 Generics\
    \ and methods\n\nWe have already seen couple of generic methods in the previous\
    \ sections while discussing classes and interfaces. However, there is more to\
    \ say about. Methods could use generic types as parts of argument declaration\
    \ or return type declaration. For example:\n\n```\npublic<T, R> R performAction(\
    \ final T action ) {\n    final R result = ...; \n    // Implementation here\n\
    \    return result;\n}\n```\n\nThere are no restrictions on methods which can\
    \ use generic types, they could be concrete, abstract, static or final. Here is\
    \ a couple of examples:\n\n```\nprotected abstract<T, R> R performAction( final\
    \ T action );\nstatic<T, R> R performActionOn( final Collection< T > action )\
    \ {\n    final R result = ...; \n}\n```"
