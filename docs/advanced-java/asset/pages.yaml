    Table 5.4: (continued)


    | Element Type | Description |

    | --- | --- |

    | ANNOTATION_TYPE | Annotation type declaration |

    | CONSTRUCTOR | Constructor declaration |

    | FIELD | Field declaration (includes enum constants) |

