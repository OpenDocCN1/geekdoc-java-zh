    \            break;\n        case TUESDAY:\n            // Do something\n    \
    \        break;\n        // Other enum constants here\n    }\n}\n```\n\n# 5.7\
    \ Specialized Collections: EnumSet and EnumMap\n\nInstances of enums, all other\
