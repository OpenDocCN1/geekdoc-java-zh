    \ Method clone\n\nIf there is a method with a bad reputation in Java, it is definitely\
    \ clone(). Its purpose is very clear - the exact copy of the class instance is\
    \ being called, over there are a couple of reasons why it is not as easy as it\
    \ sounds.\n\nFirst of all, in case you have decided to implement your clone()\
    \ method, there are a lot of conventions to follow as Java documentation. Secondly,\
    \ the method declared protected in Object class in order to make it visible, which\
    \ is overridden with public return type of the overriding class. The overriding\
    \ class should implement Clone interface (which is just a marker interface with\
    \ no methods defined) CloneNotSupportedException will be raised. And Lastly, the\
    \ implementation should call super.clone() first and then add additional actions\
    \ if needed. Let us see how it is implemented for our sample Person class.\n\n\
    ```\n// Add the @Override annotation, it will ensure that your\n// implementation\
    \ is to change the default implementation.\n@Override\npublic Person clone() throws\
    \ CloneNotSupportedException {\n    return ( Person )super.clone();\n}\n```\n\n\
    The implementation looks quite straightforward, so what could go wrong? Couple\
    \ of things, alike. While the cloning of the class instance is being performed,\
    \ no constructor is being called. The consequence of such a behavior is that unintentional\
    \ data sharing may come out. Let us consider the example of the Office class,\
    \ introduced in previous section:\n\n```\npackage com.javavegeeks.advanced.objects;\n\
    \nimport java.util.Arrays;\n\npublic class Office implements Cloneable {\n   \
    \ private Person[] persons;\n\n    public Office(Person ... persons ) {\n    \
    \    this.persons = Arrays.copyOf(persons, persons.length);\n    }\n\n    @Override\n\
    \    public Person clone() throws CloneNotSupportedException {\n        return\
    \ ( Person )super.clone();\n    }\n\n    public Person[] getPersons() {\n    \
    \    return persons;\n    }\n}\n```\n\nIn this implementation, all the clones\
    \ of the Office class instance will share the same persons array, which is likely\
    \ the desired behavior. A bit of work should be done in order to make the clone()\
    \ implementation to do the right thing."
