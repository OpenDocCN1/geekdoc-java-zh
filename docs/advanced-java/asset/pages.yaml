    \ now just until using the ParameterizedType is the central point to do reflection\
    \ over generics.\n\n# 4.10 When to use generics\n\nDespite all the limitations,\
    \ which generics adds to Java language is numerous. Nowadays it is hard to imagine\
    \ that there was a time when Java had no generics. Generics should be used instead\
    \ of raw types (Collection<T> instead of Collection, Callable<T> instead of Callable,...)\
    \ or Object to guarantee type safety, define clear constraints on the contracts\
    \ and agreements, and significantly ease the maintenance and refactoring.\n\n\
    However, because of the limitations of the current implementation of generics\
    \ in Java, type erasure and the famous implicit boxing using primitive types.\
    \ Generics are not a silver bullet not solving all the problems you may encounter\
    \ and nothing could replace careful design and thoughtful thinking.\n\nExample\
    \ 1: It would be idea to look on some real examples and the typical example of\
    \ the method which performs actions against an instance of a class implements\
    \ some interface (Serializable) and returns back the modified instance of this\
    \ class.\n\n```\nclass SomeClass implements Serializable {}\n```\n\nWithout generics,\
    \ the solution may look like this:\n\n```\npublic Serializable performAction(\
    \ final Serializable instance ) {\n    // Do something here\n    return instance;\n\
    }\n```\n\n```\nfinal SomeClass instance = new SomeClass();\n// Please notice a\
    \ necessary type cast required\nfinal SomeClass modifiedInstance = ( SomeClass)performAction(\
    \ instance );\n```\n\nLet us see how generics improves this:\n\n```\npublic< T\
    \ extends Serializable > T performAction( final T instance ) {\n    // Do something\
    \ here\n    return instance;\n}\n```\n\n```\nfinal SomeClass instance = new SomeClass();\n\
    final SomeClass modifiedInstance = performAction( instance );\n```\n\nThe ugly\
    \ type cast how away as possible is to infer the right types and prove that those\
    \ types are used correctly.\n\nExample 2: A more complicated example of the method\
    \ which requires the instance of the class to implement two interfaces (say, Serializable,\
    \ and Runnable).\n\n```\nclass SomeClass implements Serializable, Runnable {\n\
    \    @Override\n    public void run() {\n```"
