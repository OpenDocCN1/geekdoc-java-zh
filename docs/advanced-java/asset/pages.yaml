  md: "# # Chapter 4\n\n# # How and when to use Generics\n\nThe idea of generics represents\
    \ the abstraction over types (well-known to C++ developers as templates). It is\
    \ a very powerful concept (which came up quite a while ago) that allows to develop\
    \ abstract algorithms and data structures to provide concrete types to operate\
    \ on later. Interestingly, generics were not present in the early versions of\
    \ Java and were added along the way only in Java 5 release. And since then, it\
    \ is fair to say that generics revolutionized the way Java programs are being\
    \ written, delivering much stronger type guarantees and making code significantly\
    \ safer.\n\nIn this section we are going to cover the usage of generics everywhere,\
    \ starting from interfaces, classes and methods. Providing a lot of benefits,\
    \ generics however introduce some limitations and side-effects which we are going\
    \ to cover.\n\n# ## 4.1 Generics and interfaces\n\nIn contrast to regular interfaces,\
    \ to define a generic interface it is sufficient to provide the type (or types)\
    \ it should be parameterized. With example:\n\n```\npackage com.javodegeeks.advanced.generics;\n\
    \npublic interface GenericInterfaceType<T> {\n    void performAction(final T action);\n\
    }\n```\n\nThe GenericInterfaceType is parameterized with single type T, which\
    \ could be used immediately by interface declarations. The interface may be parameterized\
    \ with more than one type, for example:\n\n```\npackage com.javodegeeks.advanced.generics;\n\
    \npublic interface GenericInterfaceSeveralTypes<T, R> {\n    R performAction(final\
    \ T action);\n}\n```\n\nWhenever ever want to implement the interface, it has\
    \ an option to provide the exact type substitutions, for example the ClassImplementingGenericInterface\
    \ uses String as a parameter T of the generic interface:\n\n```\npackage com.javodegeeks.advanced.generics;\n\
    \npublic class ClassImplementingGenericInterface\n    implements GenericInterfaceType<String>\
    \ {\n    @Override\n    void performAction(final String action ) {\n```"
