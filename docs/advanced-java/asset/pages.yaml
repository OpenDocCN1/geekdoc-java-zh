  md: '# Advanced java


    | Manifest Attribute | Description |

    |---|---|

    | Premain-Class | When an agent is specified at JVM launch time this attribute
    defines the Java agent class the class containing the premain method. When an
    agent is specified at JVM launch time this attribute is required. If the attribute
    is not present the JVM will abort |

    | Agent-Class | If an implementation supports a mechanism to start Java agents
    after the JVM has started this attribute specifies the agent class: the class
    containing the agentmain method. This is required and the agent will not be started
    if this attribute is not present |

    | Boot-Class-Path | A list of paths to be searched by the bootstrap class loader.
    Paths represent directories or libraries |

    | Redefine-Classes | A value of true,case-insensitive and defines the ability
    to redefine classes needed by this agent. This attribute is optional, the default
    is false |

    | Can-Transform-Classes | A value of true,case-insensitive and defines the ability
    to transform classes needed by this agent. This attribute is optional, the default
    is false |

    | Can-Set-Native-Method-Prefix | A value of true,case-insensitive and defines
    the ability to set native method prefix needed by this agent. This attribute is
    optional, the default is false |


    Figure 15.1: Java Agent Attributes


    For details please do not hesitate to consult the official documentation dedicated
    to Java agents and instrumentation.


    # 15.3 Java Agent Instrumentation


    The instrumentation capabilities of Java agents are truly unlimited. Most noticeable
    ones include but are not limited to:


    +   - Ability to redefine classes at run-time. The redefining may change method
    bodies, the constant pool and attributes. The redefinition must not add, remove
    or rename fields, change the signatures of methods, or change inheritance.

    - Ability to transform classes at run-time. The transformation may change method
    bodies, the constant pool and attributes. The transformation must not add, remove
    or rename fields, change the signatures of methods, or change inheritance.

    - Ability to modify the failure handling of native method resolution by using
    retry with a prefix applied to the name.


    Please note that transformed redefined class bytecode is not checked, and installed
    just after the transformations or redefinitions have been applied. The resulting
    bytecode is erroneous or not, the exception will be thrown and that may crash
    JVM completely.


    # 15.4 Writing Your First Java Agent


    In this section we are going to write a simple Java agent by implementing our
    class transformer. With that said, the only disadvantage of working with Java
    agents is that in order accomplish any or less useful transformation, bytecode
    manipulation skills are required. And, unfortunately, theJava standard library
    does not provide any API (at least, documented ones) to make those bytecode manipulation
    possible.


    To fill this gap, bytecode manipulation can come with such an event and at this
    moment very more libraries, such as Javascript and ASM, just to name a few. Those
    of Javais is much simpler to use and that it became the reason we are going to
    employ as a bytecode manipulation library. So for a first time we were not able
    to find the API in Java standard and had no choice but to use the one provided
    by the community.


