  md: "# Chapter 10\n\n# Built-in Serialization techniques\n\n# 10.1 Introduction\n\
    \nThis part of the tutorial is solely devoted to serialization: the process of\
    \ translating Java objects into a format that can be used to store and reconstructed\
    \ later in the same (or another) environment (http://en.wikipedia.org/wiki/Serialization).\
    \ Serialization not only allows saving and loading Java objects to/from the persistent\
    \ storage, but is also a very important component of modern distributed systems\
    \ communication.\n\nSerialization is not easy, but effective serialization is\
    \ even harder. Besides the Java standard library, there are many serialization\
    \ techniques and frameworks available: some of them are using compact binary representation,\
    \ others put the readability on the first place. Although we are going to mention\
    \ many alternatives along the way, our attention will be concentrated on the ones\
    \ from Java standard library (latest specifications): Serializable, Externalizable,\
    \ JSR222 and Java API for JSON Processing (JSON-P JSR-353).\n\n# 10.2 Serialization\
    \ interface\n\nArguably the easiest way to mark the class as serializable is by\
    \ implementing the java.io.Serializable interface.\n\n```\npublic class SerializableExample\
    \ implements Serializable {\n}\n```\n\nThe serialization runtime associates with\
    \ each serializable class a specific version number, called serialVersionUID,\
    \ which is used during deserialization (the process opposite to serialization)\
    \ to make sure that the classes for the serialized object are compatible. If the\
    \ compatibility has been compromised, the InvalidClassException will be raised.\n\
    \nA serializable class may introduce its own serialVersionUID by declaring a field\
    \ named serialVersionUID that must be static, final, and of type long:\n\n```\n\
    public class SerializableExample implements Serializable {\n    private static\
    \ final long serialVersionUID = 8894f7554319602846L;\n```\n\nHowever, if a class\
    \ does not explicitly declare a serialVersionUID field, the serialization runtime\
    \ will generate a default serialVersionUID field for that class. It is well to\
    \ know that it is strongly recommended by all classes implementing Serializable\
    \ to explicitly declare the serialVersionUID field, because the default serialVersionUID\
    \ generation heavily on intrinsic class details and may vary depending on Java\
    \ compiler implementation and its version. As such, to guarantee a consistent\
    \ behavior, a serializable class must always declare an explicit serialVersionUID.\n\
    \nOnce the class becomes serializable (implements Serializable and declares serialVersionUID),\
    \ it could be stored and retrieved, for example, ObjectOutputStream/ObjectInputStream:"
