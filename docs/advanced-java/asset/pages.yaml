  md: "# Advanced java\n\nAs we already emphasized in the Inheritance section, please\
    \ always try to keep the class public minimal, following the encapsulation principle.\
    \ Whatever should not be public, should be private instead (protected / package\
    \ private), depending on the problem you are solving. In long run it will pay\
    \ off, giving you the freedom to evolve your design without introducing changes\
    \ (or at least minimize them).\n\n# 3.13 Final classes and methods\n\nIn Java,\
    \ there is a way to prevent the class to be subclassed by any other class: it\
    \ should be declared as `final`.\n\n```\npackage com.javadegeeks.advanced.design;\n\
    \npublic final class FinalClass {\n}\n```\n\nThe same final keyword in the method\
    \ declaration prevents the method in question to be overridden in subclasses.\n\
    \n```\npackage com.javadegeeks.advanced.design;\n\npublic class FinalMethod {\n\
    \    public final void performAction() {\n}\n}\n```\n\nThere are no general rules\
    \ to decide if class or method should be `final` or not. Final classes and methods\
    \ limit the extensibility and it is very hard to think ahead the class should\
    \ or not be subclassed, or method should or not be overridden. This is particularly\
    \ important to library developers as the design decisions that could significantly\
    \ limit the applicability of the library.\n\nJava standard library has examples\
    \ of `final` classes, with most known being `String` class. On an early stage,\
    \ the decision has been taken to proactively prevent any developer's attempts\
    \ to come up with own, “better” string implementations.\n\n# 3.14 Download the\
    \ Source Code\n\nThis was a lesson on How to design Classes and Interfaces.\n\n\
    +   - You may download the source code here: advanced-java-part-3\n\n# 3.15 What’s\
    \ next\n\nIn this part of the tutorial we have looked at object-oriented design\
    \ concepts in Java. We briefly walked through contract-based development, touched\
    \ some functional concepts and saw how the language evolved over time. In next\
    \ part of the tutorial we are going to meet generics and how they are changing\
    \ the way we approach type-safe programming."
