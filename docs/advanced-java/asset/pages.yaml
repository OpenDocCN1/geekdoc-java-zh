    interface B extends A {\n    @Override\n    default void performAction()\n}\n\
    ```\n\n```\ninterface C extends A {\n    @Override\n    default void performAction()\n\
    }\n```\n\nFor example, the following code snippet fails to compile:\n\n```\n//\
    \ E is not compilable unless it overrides performAction() as well\ninterface E\
    \ extends B, C {\n}\n```\n\nAt this point it is fair to say that Java as a language\
    \ has always tried to escape the corner cases of object-oriented programming,\
    \ as the language evolves, some of those cases are started to pop up.\n\n# 3.11\
    \ Inheritance and composition\n\nFortunately, inheritance is not the only way\
    \ to design your classes. Another alternative, which many developers consider\
    \ being better than inheritance, composition. The idea is very simple: instead\
    \ of building class hierarchies, the classes should be composed from other classes.\n\
    \nLet us take a look on this example:\n\n```\npublic class Vehicle {\n    private\
    \ Engine engine;\n    private Wheels[] wheels;\n    // ...\n}\n```"
