  md: "# Advanced java\n\nJava objects from JVMs on the same host or on different\
    \ physical (virtual) hosts. the foundation of RMI lays object serialization, which\
    \ is used to marshal (serialize) and unmarshal (deserialize) method parameters.\n\
    \nRMI is still used in many Java applications nowadays, but it lesser and lesser\
    \ a choice because of its complexity and connection restrictions (the firewalls\
    \ do block RMI ports). To get more details about RMI please refer to [official\
    \ documentation]().\n\n# 10.6 JAXB\n\nJava Architecture for XML Binding, or just\
    \ JAXB, is probably the oldest serialization mechanism available to Java developers.\
    \ Underneath, it uses XML as the serialization format, provides a wide range of\
    \ customization options and includes a lot of annotations which makes JAXB very\
    \ appealing and easy to use in part 5 of the tutorial. See [how to use Enums and\
    \ Annotations](\n\nLet us look at a quick simple example of the old Java POJO\
    \ annotated with JAXB annotations:\n\n```\nimport java.math.BigDecimal;\nimport\
    \ javax.xml.bind.annotation.XmlAccessType;\nimport javax.xml.bind.annotation.XmlAccessorType;\n\
    import javax.xml.bind.annotation.XmlElement;\nimport javax.xml.bind.annotation.XmlRootElement;\n\
    \n@XmlAccessorType(FIELD)\n@XmlRootElement(name = \"example\")\npublic class JaxbExample\
    \ {\n    @XmlElement(required = true) private String str;\n    @XmlElement(required\
    \ = true) private BigDecimal number;\n\n    // Setters and getters\n}\n```\n\n\
    To serialize this class into XML format using JAXB framework, the only thing needed\
    \ is the instance of the marshaller (or, deserializer),\n\n```\nfinal JaxbContext\
    \ context = JaxbContext.newInstance(JaxbExample.class);\nfinal Marshaller marshaller\
    \ = context.createMarshaller();\n\nfinal JaxbExample example = new JaxbExample();\n\
    example.setStr(\"String\");\nexample.setNumber(new BigDecimal(12.33d, MathContext.DECIMAL64));\n\
    \ntry(StringWriter writer = new StringWriter()) {\n    marshaller.marshal(example,\
    \ writer);\n}\n```\n\nHere is the XML representation of the JaxbExample class\
    \ instance from the above:\n\n```\n<xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"\
    yes\"?>\n<example>\n  <str>string</str>\n  <number>12.3300000000000</number>\n\
    </example>\n```\n\nFollowing the same pattern, instances of the class can be deserialized\
    \ from XML representation into the Java objects using the instance of the unmarshaller\
    \ (or, deserializer), for example:\n\n```\nfinal JaxbContext context = JaxbContext.newInstance(JaxbExample.class);\n\
    final String xml = \"\" + \n\"<?xml version=\"1.0\" encoding=\"UTF-8\\\" standalone=\"\
    yes\"?>\" +\n```\n\n![](img/0c18c23df1fa562d1b6fc69569bf3713_92_0.png)"
