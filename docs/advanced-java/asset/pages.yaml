  md: "From logical point of view, the day argument should have one of the values\
    \ declared in the DaysOfWeekConstants class.\nHowever, it is not possible to guess\
    \ that without additional documentation being written (read afterwards by someone).\
    \ The Java compiler call like isWeekend (100) looks absolutely correct and raises\
    \ no concerns.\n\nHere comes enum to the rescue. Enum allows to replace constants\
    \ with the typed values and to use those everywhere.\nLet us rewrite the solution\
    \ using enum.\n\n```\npublic enum DaysOfWeek {\n    MONDAY,\n    TUESDAY,\n  \
    \  WEDNESDAY,\n    THURSDAY,\n    FRIDAY,\n    SATURDAY,\n    SUNDAY\n}\n```\n\
    \nWhat changed is the class becomes enum and the possible values are listed in\
    \ the enum definition. The distinguishing part however is that every single value\
    \ is the instance of the enum class it is declared at (in our example, DaysOfWeek).\
    \ As whenever enum is used, the Java compiler is able to do type checking.\n\n\
    ```\npublic boolean isWeekend(DaysOfWeek day) {\n    return day == SATURDAY ||\
    \ day == SUNDAY );\n}\n```\n\nPlease note that the use of the uppercase naming\
    \ scheme in enums is just a convention, nothing really prevents you from not doing\
    \ that.\n\n# 5.3 Enums and instance fields\n\nEnums are specialized classes and\
    \ as are extensible. It means they can have instance fields, constructors and\
    \ methods (the only limitations are that the no-args constructor cannot be declared\
    \ and all constructors must be private). Let us add the property isWeekend to\
    \ every day of the week using the instance field and constructor.\n\n```\npublic\
    \ enum DaysOfWeekFields {\n    MONDAY (false),\n    TUESDAY (false),\n    WEDNESDAY\
    \ (false),\n    THURSDAY (false),\n    FRIDAY (false),\n    SATURDAY (true)\n\
    }\n```\n\n```\nprivate final boolean isWeekend;\n\nprivate DaysOfWeekFields(final\
    \ boolean isWeekend) {\n    this.isWeekend = isWeekend;\n}\n```\n\n```\npublic\
    \ boolean isWeekend() {\n    return isWeekend;\n}\n```\n\nAs we see, the values\
    \ of the enum are just constructor calls with the simplification that the new\
    \ keyword is not required. The isWeekend() property could be used to detect if\
    \ the value represents the day work or week-end. For example:\n\n```\npublic boolean\
    \ isWeekend(DaysOfWeek day) {\n    return day.isWeekend();\n}\n```"
