    \ {\n}\n}\n```\n\nLuckily, with Java 8, lambdas and functional interfaces all\
    \ this boilerplate is about to go away, finally making the Java code to look concise.\n\
    \n```\npackage com.javacodegeeks.advanced.design;\npublic class AnonymousClass\
    \ {\n    public static void main(String[] args) {\n        new Thread(() -> {\
    \ /* Implementation here */ }).start();\n    }\n}\n```\n\n# 3.8 Visibility\n\n\
    We have already talked a bit about Java visibility and accessibility rules in\
    \ part 1 of the tutorial, How to design Classes and Interfaces. In this part we\
    \ are going to get back to this subject again in the context of subclassing.\n\
    \nTable 3.1: datasheet\n\n| Modifier | Package | Subclass | Everyone Else |\n\
    | --- | --- | --- | --- |\n| public | accessible | accessible | Accessible |\n\
    | protected | accessible | accessible | not accessible |\n| <no modifier> | accessible\
    \ | not accessible | not accessible |\n| private | not accessible | not accessible\
    \ | not accessible |\n\nDifferent visibility levels allow or disallow the classes\
    \ to see other classes or interfaces (for example, if they are in different packages\
    \ or nested in one other) or subclasses to see and access methods, constructors\
    \ and fields of their parents.\nIn next section, Inheritance, we are going to\
    \ see that in action.\n\n# 3.9 Inheritance\n\nInheritance is one of the key concepts\
    \ of object-oriented programming, serving as a base of class relationships. Combined\
    \ together with visibility and accessibility rules, inheritance allows designing\
    \ extensible and maintainable class hierarchies.\nConceptually, inheritance in\
    \ Java is implemented using subclassing and the extends keyword, followed by the\
    \ parent class. The subclass inherits all of the public and protected members\
    \ of its parent class. Additionally, a subclass inherits the package-private members\
    \ of its parent class if both reside in the same package. Having said that, it\
    \ is very important no matter what you are trying to design, to keep the minimal\
    \ set of the methods which exposes publicly or to its subclasses. For example,\
    \ let us take a look at a Parent and its subclass Child to demonstrate different\
    \ visibility levels and their effect:\npackage com.javacodegeeks.advanced.design;\n\
    \n```\npublic class Parent {\n    // Everyone can see it\n    public static final\
    \ String CONST = \"Constant\";\n}\n\n// No one can access it\n```"
