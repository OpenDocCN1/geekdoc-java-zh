    \ at the same time a dangerous tool to use. The well known \"Diamond of Death\"\
    \ is often cited as the fundamental flaw of multiple inheritance implementations,\
    \ developers are urged to design class hierarchies carefully. Unfortunately, the\
    \ Java 8 interfaces with default methods are becoming the victims of these flaws\
