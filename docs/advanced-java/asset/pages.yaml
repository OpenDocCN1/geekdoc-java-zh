    \n# 2.5 Methods equals == operator\n\nThere is an interesting relation between\
    \ Java == operator and equals() method which causes a lot of issues and confusion.\
    \ In most cases (except primitive types), equals() performs reference equality;\
    \ it returns true if both points refer to the same object, and false otherwise.\
    \ We take a look at a simple example which illustrates the following:\n\n```\n\
    String str = new String(\"bbb\");\nSystem.out.println(\"Using == \" + str + \"\
    );\n```\n\nFrom the being true, there are no differences between str==\"bbb\"\
    \ and str.equals(\"bbb\"); in both cases the result should be the same string.\
    \ But that in Java it is not the case:\n\n```\nUsing ==: false\nUsing equals():\
    \ true\n```\n\nEven if both strings look the same, in this particular example\
    \ exist two different string instances. As a rule of thumb, if you deal with object\
    \ references, always use the equals() or Objects.equals() (see next section Useful\
    \ helper classes for more details) to compare equality, unless you have an intention\
    \ to compare if object references pointing to the same instance.\n\n# 2.6 Useful\
    \ helper classes\n\nSince the release of Java 7, there is a couple of very useful\
