  md: "# # Chapter 3\n\n# # How to design Classes and Interfaces\n\n# ## 3.1 Introduction\n\
    \nWhatever programming language you are using (and Java is not an exception here),\
    \ following good design principles is a key to write clean, understandable, testable\
    \ code and deliver long-living, easy to maintain solutions. In this part of the\
    \ tutorial we are going to discuss the foundational building blocks the Java language\
    \ provides and introduce a couple of design principles, aiming to help you to\
    \ make better design decisions.\n\nMore precisely, we are going to discuss **interfaces**\
    \ and **interfaces with default methods** (new feature of Java 8), **abstract**\
    \ and **final classes, immutable classes, inheritance, composition** and revisit\
    \ a bit the **visibility** (or accessibility) rules we have briefly touched in\
    \ **part 1** of the tutorial, How to create and destroy objects.\n\n# ## 3.2 Interfaces\n\
    \nIn object-oriented programming, the concept of interfaces forms the basics of\
    \ contract-driven (or contract-based) development. In a nutshell, interfaces define\
    \ the set of methods (contract) and every class that claims to support this particular\
    \ interface must provide the implementation of these methods: a pretty simple,\
    \ powerful idea.\n\nMany programming languages have interfaces in one form or\
    \ other, but Java particularly provides language support for that. Take a look\
    \ at a simple interface definition in Java.\n\n```\npackage com.javacodgeeks.advanced.design;\n\
    public interface SimpleInterface {\n    void performAction();\n}\n```\n\nIn the\
    \ code snippet above, the interface we named `SimpleInterface` declares just one\
    \ method named performAction. The principal differences of interfaces in respect\
    \ to classes is that interfaces outline what the contract is (declared) but do\
    \ not provide their implementations.\n\nHowever, interfaces in Java can be more\
    \ complicated than that: they can include nested classes, enumerations, notations\
    \ (annotations) and annotations will be covered in details in **part 5** of the\
    \ tutorial, **How and when to use Enums and Annotations** and for example:\n\n\
    ```\npackage com.javacodgeeks.advanced.design;\npublic interface InterfaceWithDefinitions\
    \ {\n    String CONSTANT = \"CONSTANT\";\n\n    enum InnerEnum {\n        E1,\
    \ E2;\n    }\n```"
