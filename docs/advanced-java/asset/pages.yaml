  md: "# Advanced java\n\n```\nfor ( final Map.Entry< String, Collection< String>\
    \ > entry: map.entrySet() ) {\n    // Some implementation here\n}\n```\n\nThe\
    \ Java 7 release addressed this problem by making changes in the compiler and\
    \ introducing the new diamond operator - For.\n\n```\nfinal Map<String, Collection<String>\
    \ > map = new HashMap<>();\n```\n\nThe compiler is able to infer generics types\
    \ from the left side and omit them in the right side of the expression. It was\
    \ a significant progress towards generics syntax less verbose, however the abilities\
    \ of the compiler to infer generic types were limited. For example, the following\
    \ code does not compile in Java 7:\n\n```\npublic static <T> void performAction(final\
    \ Collection<T> actions,\nfinal Collection<T> defaults) {\n    // Some implementation\
    \ here\n}\n```\n\n```\nfinal Collection<String> strings = new ArrayList<>();\n\
    performAction(strings, Collections.emptyList());\n```\n\nThe Java 7 compiler cannot\
    \ infer the type parameter for the Collections.emptyList() and as such requires\
    \ it to be passed explicitly:\n\n```\nperformAction(strings, Collections.<String>emptyList());\n\
    ```\n\nLuckily, Java 8 release brings more enhancements to the compiler and, particularly,\
    \ into the type inference for generics the code snippet above compiles successfully,\
    \ saving the developers from unnecessary typing.\n\n# 4.8 Generics and annotations\n\
    \nAlthough we are going to discuss the annotations in the next part of the tutorial,\
    \ it is worth mentioning that the Pre-Java 8 generics were not allowed to have\
    \ annotations with their type parameters. But Java 8 changed and now it becomes\
    \ possible to annotate generics types at the places they are declared or used.\
    \ For example, here is how the generic type parameter is annotated with annotations:\n\
    \n```\npublic <@action T> void performAction(final T action) {\n    // Some implementation\
    \ here\n}\n```\n\nOr another example of applying the annotation when generic type\
    \ is being used:\n\n```\nfinal Collection<@Nonnull String> strings = new ArrayList<>();\n\
    // Some implementation here\n```\n\nIn the part 4 of the tutorial, How and when\
    \ to use Enums and Annotations, we are going to take a look at a couple of examples\
    \ how the annotations can be used in order to associate metadata with the generic\
    \ parameters. This just section will give you the feeling that it is possible\
    \ to enrich generics with annotations.\n\n# 4.9 Accessing generic type parameters\n\
    \nAs you already know from the section Limitation of generics, it is not possible\
    \ to get the generic type parameter. One simple trick to work-around that is to\
    \ require additional argument to be passed, Class< T >, in places where it is\
    \ necessary to know the class of the type parameter T. For example:"
