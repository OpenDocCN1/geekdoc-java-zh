    \        out.writeObject(getObj());\n    }\n}\n```\n\nSimilarly to the classes\
    \ implementing Serializable, the classes implementing Externalizable could be\
    \ stored and retrieved using, for example, ObjectOutputStream / ObjectInputStream:"
