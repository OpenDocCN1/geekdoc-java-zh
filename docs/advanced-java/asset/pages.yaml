  md: "# Advanced java\n\n# 1.2.8 Finalizers\n\nSo far we have talked about objects\
    \ and objects initialization but have not actually mentioned anything about their\
    \ counterpart: objects destruction. That is because Java uses garbage collection\
    \ to manage objects lifecycle and is the responsibility of garbage collector to\
    \ destroy unnecessary objects and reclaim the memory.\n\nHowever, there is one\
    \ particular feature in Java called Finalizers which resemble a bit destructors\
    \ but serve the different purpose of performing resources cleanup. Finalizers\
    \ are considered to be a dangerous feature (which leads to numerous side effects\
    \ and performance issues). Generally, they are not necessary and should be avoided\
    \ (except very rare cases related to AutoCloseable) a much better alternative\
    \ to finalizers is introduced by Java 7 language construct try-with-resources\
    \ to write code like this:\n\n```\ntry { final InputStream in = Files.newInputStream(path)\
    \ } } (\n// code here\n}\n```\n\n# 1.3 Static initialization\n\nSo far we have\
    \ looked through class initialization and construction. But Java also supports\
    \ class-level initialization constructs called static initializers. They are very\
    \ similar to the initialization blocks except the additional static keyword. Please\
    \ note that static initialization is performed per class-loader. For example:\n\
    \n```\npackage com.javachegeeks.advanced.construction;\n\npublic class StaticInitializationBlock\
    \ {\n    static {\n        // static initialization code here\n    }\n}\n```\n\
    \nSimilarly to initialization blocks, you may include any number of static initializer\
    \ blocks in the class definition and they will be executed in the order which\
    \ they appear in the code. For example:\n\n```\npackage com.javachegeeks.advanced.construction;\n\
    \npublic class StaticInitializationBlocks {\n    static {\n        // static initialization\
    \ code here\n    }\n\n    static {\n        // static initialization code here\n\
    \    }\n}\n```\n\nBecause static initialization can be triggered from multiple\
    \ parallel threads (when the loading of the class happens at the first time),\
    \ Java runtime guarantees that it will be executed only once and in thread-safe\
    \ manner.\n\n# 1.4 Construction Patterns\n\nOver the years a couple of well-understood\
    \ and widely applicable construction (or creation) patterns have emerged within\
    \ Java community. We are going to cover the most famous of them: singleton, helpers,\
    \ factory and dependency injection (also known as inversion of control)."
