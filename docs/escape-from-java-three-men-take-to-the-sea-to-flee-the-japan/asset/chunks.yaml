    naval base. They came inland from Indramayu and cut the railroad between Batavia
    and Surabaya. The forces from Rembang headed for the oilfields at Tjepu, which
    the Dutch destroyed before they left. With rapid, slashing strokes they cut up
    the northern coast and flanked Batavia and Surabaya. They pushed on toward Bandung.
    Within two days they were thirty miles from the mountain fortress.The conquest
    of Java wasn’t easy for the Japs. Though our troops were pitifully under-supplied
    with artillery and had insufficient mechanized equipment, they fought wherever
    they could hit a Jap and gave the enemy a harrowing few days. Bridges, roads,
    and airdromes were wrecked before the Japs came. Everything of military value
    was destroyed by the retreating forces, who left nothing but ruin behind them.
    We slowed the Japs, but could not stop them. Our planes had fought well while
    they lasted, but, once a plane was shot down, there wasn’t another to take its
    place to defend Java. The Jap troops came nearer to Bandung along the mined roads,
    across the devastated areas the Dutch had left in their wake.There was no chance
    for guerrilla warfare on the plains of Java. It is too densely populated, too
    thickly overlaid with roads and railways. With 821 people living within each square
    mile a guerrilla has nowhere to hide. Much of the island is flat, open country,
    in spite of the volcanic mountains in the interior. We had no choice but to stick
    to the one feasible plan of defense; to make a stand at Bandung.At Batavia we
    knew the end was near. Rumors spread that a huge force of American troops was
    on its way to help us; that an Allied fleet was even now preparing to attack the
    Jap transports which brought the invaders to Java. Though we listened to these
    stories, we knew them to be false. Then, five days after the initial Jap landings,
    Batavia had to be evacuated by the army, as the railway to Bandung was threatened.
    Before leaving, the army destroyed everything in the city that might be of value
    to the Japs: the major government buildings, the harbor works at Tanjung Priok,
    all the oil-storage tanks and other industrial works. All private cars were commandeered
    to get the soldiers to Bandung, where they were to join in the defense of that
    stronghold. Those cars which the army could not use were dismantled. Only a few
    government automobiles were left on the streets.Thus when the Japs came to Batavia,
    the entire population was there to face them. No private citizen had been able
    to leave the city, for there was no transportation. Indonesians and Europeans
    alike were on hand to take whatever treatment the invaders chose to give them.
    Batavia fell on March 5, 1942\. At seven-thirty that evening the Resident sent
    volunteers out with white flags to receive the commander of the enemy forces,
    west of the city.I was a civilian member of the Netherlands Army, delegated to
    carry on my work in Batavia. My job was in the office of one of the public utilities,
    a position I had held for several years. Just a few days before the occupation
    those who did essential work were instructed by the Dutch government to stick
    by their jobs. The only precaution we took for our personal safety was to destroy
    our uniforms. We’d get a better chance with the Japs if they thought we were civilians.
    So I had a front-row seat for the tragedy which followed.Though I had seen nothing
    of the actual battle for Java and, except for the ineffectual and occasional bombing
    of the city, had experienced none of its reality, I was not unprepared for the
    announcement that Batavia was to be surrendered. The news we had received in the
    past weeks was all too significant to anyone who could read the story of Jap conquest
    in recent months. Therefore, the government radio announcement which came a few
    hours before the capitulation, telling of the imminent surrender of the city,
    was not surprising. But it was a shock nonetheless. Right up to the last we had
    been hoping for some miracle to save us. That miracle never happened. Like the
    Philippines, Malaya, and the other Pacific islands, we had fallen victim to the
    tide of conquest. Java was lost.The government broadcast a warning that all civilians
    stay off the streets that night of March fifth. The officials wanted no “incidents”
    to give the Japs an excuse to terrorize the population. But, like many Batavians
    both white and native, I could not resist the impulse to see what was happening.
    It wasn’t a spectacle that anyone wanted to watch, but, like torturing an aching
    tooth, you couldn’t help it. A crowd gathered in front of the Residential Building,
    where we knew the formal surrender of the city was to take place.The volunteers
    who had gone out to meet the officers of the Jap forces brought them into the
    city in the early evening. The native and Dutch policemen, who were on hand to
    keep the gathering crowd orderly, cleared a path for the general’s car through
    the throng. No one spoke. We moved back when the police asked us to, but we did
    so quietly. It was amid a grim, disheartened silence that the Jap officers walked
    up the steps to the Resident’s office and took possession of the city.A contingent
    of Jap troops followed immediately on bicycles; small, low machines especially
    built to accommodate the bandy-legged warriors. It was too dark to see much. I
    couldn’t even make out what the Jap soldiers looked like, except that they were
    little men, heavily armed and extremely businesslike. Later I learned that there
    were about two thousand of them in this advance guard.The troops took over the
    duty of policing the crowd. Armed with rifles and machine guns they threw a ring
    around the building and began eyeing the throng with obvious suspicion. They knew
    that the Dutch government had asked people to stay at home and this gathering
    looked like insubordination to them.The onlookers began to get restless. They
    had expected a show of some sort and nothing was happening. Some people began
    pushing their way through the police lines toward the building. The Jap guards
    got nervous. They tried to push the curious natives, who made up the greater part
    of the throng, back with the flat of their swords. But the Indonesians were persistent.
    Without a second’s hesitation, the Japs turned their machine guns on them and
    fired.Several natives and one or two Dutch policemen were killed. A man who had
    been standing near me fell to his knees, his chest torn by a spray of bullets.
    The crowd lost its curiosity to know what the Japs were like. Silently the people
    disbanded, taking their dead and wounded with them. We had had our first taste
    of Jap “co-prosperity.”'
