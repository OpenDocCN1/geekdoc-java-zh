    and take the helm. William, you stay on watch and yell the minute you see anything
    ahead. I want to go below and take a look at the chart.”Dirk came back and I set
    the helm for him. In the cabin I grabbed a flashlight and directed its beam for
    an instant on the chart. In that quick glance I saw that we would soon be out
    of the area showing on this chart and into the unknown portion of the bay for
    which I had no chart. I snapped off the light. There was no use worrying. We’d
    just have to go ahead and trust to luck to get us through.Once again on deck I
    peered forward. Directly in our path was the long low outline of an island. Why
    hadn’t William seen it?“What’s the matter with your eyes?” I shouted, grabbing
    the helm from the frightened Dirk. “Don’t you see that island?”My eyes, more accustomed
    to the darkness and knowing what to look for on the sea, had spotted the vague
    shape which was not at all apparent to William. We swung around the small island,
    missing it by a bare ten feet, while William, too chagrined to make an answer
    for once, sat glumly in the bow.“You’ll get used to spotting them,” I consoled
    him, feeling better now that the danger was past. “But keep your eyes open.”Thoroughly
    alert now, William and Dirk, who had once again joined him at the bow, redoubled
    their efforts and soon were as quick as I to spot the looming shapes on our path.Their
    warning cries gave me an ample margin of safety and we avoided them all.The prevailing
    wind in the Java Sea is generally south at night, shifting to the north during
    the day. I knew we could expect the favorable south wind until daylight and by
    that time I hoped to have covered the sixty miles from Batavia to the mouth of
    the strait.No one thought of getting any rest that night. Except for an occasional
    trip below to flash my light for an instant on the charts, hoping to find that
    we had passed through the area which neither of my Java Sea maps showed, I stayed
    at the helm all night. We didn’t talk much. We were too tense even to think. At
    any minute we expected a Jap patrol boat to show up or to find ourselves rammed
    against a hidden reef, powerless to move. None of us had thought of getting any
    supper before we left, but we weren’t hungry even now. You can go without food
    and nourish yourself on anxiety indefinitely, if you have to.Occasionally one
    of the reefs or shoals showed a light. All of them had been marked before the
    Japs came, but under their rule, the buoys and lights had been neglected and only
    a few were working. But these few were a tremendous help and their tiny winking
    lights seemed to signal a message of hope to us.A pale glow was showing in the
    eastern sky, when I made another trip to the cabin to look at the charts. I gave
    a long sigh of relief. In the faint early light I had noted our position in relation
    to the visible islands. Now I knew that we had passed safely through the uncharted
    area and were in the region marked on my chart of the Sunda Strait. We had made
    it, in spite of the darkness, all the countless reefs and shoals in our path.
    What kind fate had led us through this perilous passage, I didn’t try to determine.
    Ahead was the strait, patrolled as we had been warned by Jap planes and ships.
    Our troubles weren’t over yet.We dropped anchor some fifteen miles north of the
    strait just as the sun burst up over the sea, flooding the waters of the bay in
    a red glow of light. Morning had come with a vengeance and we could depend no
    longer on the protecting darkness which had been our salvation on the first leg
    of our flight. For the next twelve hours we would be in full sight of any marauding
    Japs.The wind veered around to the north soon after we anchored and the little
    cutter bobbed in the freshening breeze as though anxious to get under way once
    more. I stared out over the water and wondered if I dared risk making the run
    now. The area looked harmless enough. Just ahead of us were a dozen or so fishing
    prahus, some of them raising anchor to begin the day’s work, others content to
    try their luck in a stationary position.“Well?” It was William who asked the unspoken
    question. I knew what he meant, for he understood the significance of these fishing
    boats as well as I. They might be our salvation. Another sailboat, even a European-rigged
    one such as our cutter, might easily escape the notice of the Japs in the waters
    of the strait. I knew that we could expect to meet these prahus all along the
    way. They might protect us by their very numbers if we tried the run during the
    day.“There’s no point in hanging around here like a dead duck all day as long
    as those prahus are about,” I said slowly. “It would be safer to wait for night,
    but we can’t be sure of getting a favorable wind like this. I don’t know about
    the current, so we can’t count on it to help us, if the wind drops.”“We’ll be
    visible from both shores if we run through now,” said Dirk nervously. “The Japs
    might—”“To hell with the Japs,” said William energetically. “I’m for getting started.
    I don’t like this sitting around.”I grinned. “Two against one. We’ll get going.
    The strait is eight miles wide and we’ll be visible from both shores all right,
    but we’ll take a chance. We haven’t seen a Jap yet.” We weighed anchor, hoisted
    the mainsail, and soon were scudding along before the wind at a lively pace. I
    took the helm and headed direct for the mouth of the strait, some fifteen miles
    ahead.“Say, look at those wrecks,” exclaimed Dirk, pointing off to starboard at
    a cluster of buoys attached to the masts and funnels of several sunken ships.
    “Bet those are what’s left of the Java Sea battle.”I nodded. We were almost at
    the mouth of the strait and I knew that the great sea battle had been fought in
    this area. Those desolate masts, rising above the water, were mute testimony of
    the destruction of our ships and those of the enemy. But our ship was alive. It
    was taking us away from the defeat and ruin that these ships meant to Java. We
    were on our way to revenge a battle like this and I didn’t waste time in mourning
    over the graveyard of our once gallant little fleet.“Look here,” I said, as two
    prahus loomed across our path, “you two get below and begin fixing up that cabin.
    It’s a mess with all that stuff strewn around. See if you can rig another bunk
    on top of some of the luggage.”The two ducked down the hatch, just as we passed
    some thirty feet to starboard of one of the prahus. The men aboard her stood up
    to stare at me and I saw them gesticulating and talking among themselves. They
    were too curious about the cutter and I didn’t want to rouse suspicion even among
    the native fishermen.“Chuck me up one of those bath towels and that fisherman’s
    hat,” I shouted, suddenly getting an idea for disguising myself. The towel and
    hat came flying up through the hatchway and I hung the former around my shoulders
    and pulled the hat well down over my eyes. With the bright blue towel as a makeshift
    shirt like the colored ones worn by the fishermen and the hat, I hoped to make
    myself look like an innocent native, in spite of the tell-tale European rigging
    on our boat. The ruse seemed to work, for I was careful to give all the prahus
    a wide berth and kept my face sheltered under the hat brim.With a strong wind
    at our backs we entered the mouth of the strait about nine in the morning. Here
    the native fishing boats were scattered thickly over the water, all of them a
    welcome sight. The more prahus there were, the less chance there was of a Jap
    patrol spotting us. So far I hadn’t seen any sign of the Japs. There were no planes
    overhead and the only boats in sight were the ever-present prahus. It began to
    look as though we might make it.A baby could have handled the helm the way the
    wind was favoring us, so I yelled down to William to relieve me. I wanted to make
    certain that our stores were stowed away in a shipshape manner and particularly
    to see that our instruments were given a dry place.“Hey, when do we eat?” asked
    William, when he appeared on deck.“Not until we get through the strait,” I answered
    grimly.“We can’t risk taking time to set up that charcoal stove until we’re out
    in the Indian Ocean where we’ll be safe from the Japs.”William groaned as he took
    the towel and hat from me and grasped the helm.“Grab yourself some biscuits and
    some of those tomatoes,” I said, relenting as I saw his crestfallen look. “They’ll
    hold you.”I handed him up the biscuits and fruit and took some myself. Dirk was
    feeling rather green around the gills, for the boat was heeling pretty much in
    the stiff wind. I made him sit on the hatchway to get some fresh air, while I
    finished making the cabin shipshape. The other two had fixed a second berth on
    top of a couple of seabags and a spare mainsail, but it didn’t look any too comfortable.
    We were to discover that the man who drew this berth had to lie at an angle of
    about twenty degrees with a sharp wooden brace to prod him in the back every time
    he moved. I wrapped the instruments in canvas and lashed them to a small shelf
    over the bunk.The wind kept up all day, shoving us along at a good clip. Still
    no Jap planes or ships appeared. I couldn’t understand why they neglected the
    area, but I wasn’t going to worry myself on that score. Their carelessness was
    our good luck. We passed several islands in the strait, most of them deserted
    except for lighthouses. By nightfall we were off the volcanic island of Krakatau,
    a good sixty miles from the mouth of the strait. If we kept this up, we’d be well
    out into the ocean by morning and safe from any possible Jap patrols.But I knew
    too much about winds and the sea to cheer at our good fortune and it was well
    that I didn’t. Krakatau was lying to starboard, just visible in the dimness of
    the setting sun. I was pointing it out to William and Dirk when I realized that
    the wind had fallen suddenly and was now nothing but a mere puff at our backs.
    I looked over the side of the boat and to my dismay saw that the current was carrying
    us back the way we had come at a rate of about three or four knots.I stared out
    over the water and up at the sky. There wasn’t a ripple on the sea or a cloud
    in the sky to give me hope of a breeze.“If this keeps up,” I said nervously, “the
    current will carry us back to the mouth of the strait by dawn.”William and Dirk
    didn’t say anything. There wasn’t anything to say. They peered over the edge of
    the boat at the running current, listening to the slapping noise of the water
    pushing against the prow.By eight o’clock we couldn’t see Krakatau any more and
    were some ten miles back on our course. I whistled, snapped my fingers and swore,
    ably seconded by William and Dirk. But the wind made no response. The air was
    as still as though we were in a vacuum. A slight swell rocked the boat in a sideways,
    bobbing motion, that soon sent William and Dirk to the bow, where they hung over
    the edge, groaning and cursing.I was too worried to think their agony funny, as
    many seamen do the seasickness of a landlubber. For several hours I sat glumly
    at the helm with nothing to do but keep the bow set on our backward course. At
    midnight a sudden rain squall shot up behind us, bringing a temperamental wind
    that sent us forward once more. I was too thankful to mind the fact that I was
    quickly soaked to the skin, for the fitful wind was carrying us toward our goal.
    It died again after an hour, but soon another squall sent us on again. So by fits
    and starts we pushed on and before dawn of July eighth were opposite Krakatau
    once more.William and Dirk had spent the hours from midnight recovering from their
    bouts of seasickness in the cabin, but a shout from me brought them on deck at
    sunrise. A light eastern breeze had sprung up with the sun, carrying us along
    at about three knots.“At this rate we’ll be well out in the Indian Ocean by nightfall,”
    I told them. “The chances of the Japs spotting us then are absolutely nil.”“Japs
    or no Japs,” said William, “let’s eat.”
