    few Hollywood pictures, but only ones that had been carefully censored. One that
    the Japs liked particularly was a fantasy called 1,000,000 B.C., a very mediocre
    picture by any artistic standards. But it showed white men acting like savages,
    eating with their fingers and living in caves, and, for this reason, the Japs
    considered it highly effective as anti-American propaganda.Another American picture,
    Seven Sinners, was presented several times. I had seen it before the occupation
    and went again to find out what the Japs would do to it. Even before the picture
    began, an announcement was flashed on the screen saying, “This picture is busuk
    (rotten) because it shows ships of the American Navy that have been totally annihilated
    by the Imperial Japanese Navy.” Throughout the showing an announcer interrupted
    to cry, “Busuk!” whenever he felt that the action required this comment. Much
    of the picture had been censored so that the story was completely ruined and made
    no sense whatsoever.I heard that Charlie Chaplin’s The Great Dictator was being
    shown to the Jap officers in Batavia, but we never saw it at a public theater.
    The rumor was that the officers enjoyed it tremendously and got a big laugh out
    of seeing their allies, Hitler and Mussolini, as portrayed by the Messrs. Chaplin
    and Oakie. In fact, they liked it so much it was repeated four or five times for
    their exclusive benefit.Instead of turning the natives against America by showing
    such mutilated Hollywood products, it only served to increase the Indonesians’
    regard for that country. Like many people in the world, the Javanese have an almost
    awed respect for the great Western Democracy. They look upon it as a land of hope
    and promise where all the streets are paved with gold and the common man can live
    in ease and luxury. They know it to be a powerful country, and America to them
    is the nation that will finally release them from the power of the Japs. So confident
    are they of this that they originated a slogan which passed by word of mouth throughout
    Java. It is their own version of the “Three A’s”: “Awas, Ada American!” It means,
    “Beware, there is America!”


