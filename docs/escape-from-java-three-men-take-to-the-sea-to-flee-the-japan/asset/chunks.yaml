    如果不告诉别人我们打算做什么，我们就无法得到那块时计。威廉在巴达雅认识一个曾经做过很多航海的人。他发现那人还留着他的时计，但要让他把表交给我们的唯一方法就是告诉他我们所有的计划。我很讨厌不得不这样做，因为我仍然坚信一个理论：知道我们行动的人越少，遭遇的危险就越少。但我完全没必要担心这个人，当他知道我们要逃离爪罗答时，他立刻就把时计交给了威廉。


    那是一块旧表，状态相当糟糕，但我得到它时太高兴了，根本没心思抱怨它的缺陷。日本人每晚都会从巴达雅无线电站发送时间信号，我用信号对时计进行校对。它显示每二十四小时误差六点五秒，知道这一点，我觉得可以根据它来校正我的计算。


    我有从那个中国商人那里买的六象仪，但那也是一个旧仪器。威廉几乎每天都在镇上转悠，运气很好地找到了一个更新且更好的。我们决定带上那一个，而不是我的这一个。


    ### 计划与地图


    那个以前在轮船公司工作过的男人在威廉向他索要地图后，对我们的打算有了了解。出于某种原因，他从未怀疑过我会参加这次旅行，而且知道威廉对航海一窍不通，于是问威廉谁来掌舵。


    “如果你不带上有航海证的人，你就疯了，”他说。

    “你拿什么种证？”威廉问道，他意识到那哥们在暗示让他也一起去。

    “大大副，”他迅速回答道。

    “噢，好吧，”威廉轻率地说道，“我们用不上你。你会在驾驶台上显得太显眼了。”


    那男人听到这个答案显得有些不知所措，但他一定看出我们无意告诉他更多计划。他再也没有建议过带上他，但他还是很好地帮了我们。他为我们找到了一本旧历书，是 1938
    年的，虽然落后了四年，但总比没有好。


    在一家我们寻找地图的旧书店里，我们找到了两张详细的巴达雅湾地图，一张覆盖了城市附近的岸边区域，另一张是巽峡海峡地区。两张图之间有一个巨大的缺口，导致从千群岛到海口的区域一片空白。无论我怎么找也找不到这片海湾区域的地图，我最终接受了现实：我将盲目航行并听天由。如果我们撞上珊瑚礁——噢，我不敢让自己去想会发生什么。至少，那意味着我们旅程的终结。


    印度洋的地图更难找，因为它们不像海湾地图那样被船主常用。我们最后不得不用一张宣传地图。那只不过是地理书式的海洋图，比例尺是 1 比 238 英里。它没有显示任何盛风或洋流，作为航海图，它是一次惨败的失败。但它总比没有好，我很庆幸拥有它。


    ### 准备船只


    自从找到船已经过去了一个周。我们逐渐让它进入状态，并收集了大部分需要的物品。看起来我们可以计划一个逃离的日子了。我们没有敢在船上储存任何物资，担心日本人会没收它并夺走我们辛辛苦苦搜集来的所有东西。所有的食物和仪器还在我家里，我们打算在出发当天之前把它们留在那里。我们制定了一份周密的计划表，说明如何将船移过桥并到达外外运河。在船进入这条运河之前，我们不会把任何东西放上船，因为到达那里必须经过哨兵塔，而这将是旅程中最棘手的部分。如果哨兵在我们移动船只时太好奇并对其进行检查，他们发现的将是一艘空空荡的帆船。


    用于索具的钢丝仍然是个问题。我们买不到，因为日本人没收了城里的每一根钢绳。我认识一个电工，我觉得他的办公室里很可能积有一些旧电线。但他住在郊区，从他的店面到我家的整个路程，我必须冒着被捕的风险。此外，我犹豫去见他，因为索要这么多电线是很可疑的。我该怎么告诉我需要这些电线干什么呢？


    但最后我不得不冒险向那个电工求助。我给他编造了一个关于需要电线做鸡舍的疯狂故事——一个连我我自己都不会相信的故事。他看起来很怀疑，但最后说如果我晚上来取，他可以给我几段，这样日本人就不会看到我。我挑选了一些最长、最结固的几段，天黑后骑着自行车带了回家。我不知道如果哨兵看到我会会怎样。我用旧布包裹着钢丝，但看起来看起来像是个可疑的包。幸运的是，从店里到我家之间我没有遇到任何一个哨兵，并将钢丝安全地安置在和其他东西在一起。


    第二天晚上，我把它们带到船上，依然屏住呼吸担心被拦下，并向当地男孩展示如何安装紧固螺丝。那些紧固螺丝给我们带来了麻烦。船上的原件几乎生锈了，我只设弄到了两个新的。我把它们固定在船侧，只能在船头船尾使用旧的。它们并不太结固，我不敢想在额外拉力下会发生什么。


    ### 执行策略


    现在我真的能看到希望了。船只几乎准备就绪，用我们手头的材料就可以航行了。当地男孩完成了工作，尽管如果日本人发现他们在修船，他们将不会高兴的。我们付给了他们一些钱，作为他们忍受几周饥饿的补偿。


    我决定周一离开。有几个原因说明周一最合适。这给了我足够的准备时间，而且周一我会通知我生病了。在日本人来调查之前，我希望已经足够了。调查这种事情至少需要几天，我很确定他们直到周二才会出现。


    周三晚上，一个打击几乎击溃了我们的整个计划。当我骑自行车时，注意到街道上有异常数量的哨兵。没多久我就发现了他们在做什么。其中一个在街角拦住我，要求看我的登记证。我再次拿出我的登记证并向他们展示袖章。


    “怎么了？”我问。

    “正在询问，”他回答道。


    我没去想他为什么还要礼貌地跟我交流。我立刻意识到威廉和迪克正处于危险之中。他们没有袖章，没有留在巴达雅的正当理由。他们只是日本人喜欢对待的那类人，对日本人来说具有潜在的危险。一旦我从哨兵那里拿回登记证，我就尽可能快地回家。我知道威廉和迪克在那里等候，如果哨兵比我先到达我家，我无能为力。


    当我走过去时，我看到哨兵正进入某些房子，我的心沉了下去。假设他们已经到了我的家里并抓了那对毫无防备的人。我冲进房子，令我宽慰的是威廉和迪克正舒服地坐在客厅里，完全不知危险。


    “什么——”威廉开始说，但我打断了他。

    “你们两个进厨房，”我大喊道。由于威廉抗议，我继续道：“晚点再说。”他们听从了我，尽管看起来他们觉得我疯了。


    一旦他们安全地躲在黑暗的厨房里，我对后院进行了仔细检查。我决定如果日本人进入房子搜查，威廉和迪克可以躲在灌木丛中，爬过我和邻居之间的围栏。威廉和迪克并不喜欢躲起来。但当我向他们强调这是避开日本人并在周一逃离爪罗答的唯一机会时，他们同意听我的安排。


    ### 最终出发


    我们没等多久哨兵。我们听到门外传来响亮的敲门声和撞门声。看到威廉和迪克的脚印消失在灌木丛中，我去开了门。但日本人已经在未经邀请的情况下进入了房子，当我到达门口时，他们已经在搜索前面的房间了。他们询问我，我再次拿出登记证并向他们展示袖章。袖章起了往常的魔力，在检查完房子里没有其他人后，他们离开了。我对他们的搜查没有任何异议，我明显的友好可能对他们产生了某种影响。他们问我是否一个人住，我说是我是住。


    他们离开十分钟后，威廉和迪克出现在厨房。他们对必须在剩下的时间里在巴达雅躲感到非常愤怒，但我让他们明白这是绝对必要的。现在，准备出发的最后工作必须落在我身上。但大部分工作已经完成了，从某种意义上说，我和当地男孩单独对我更好。太多的白人帮忙移动船比两个当地男孩引起更多怀疑。


    那天晚上，当我去码头告诉男孩们我计划移动船时，我惊讶地发现对岸的哨兵被撤走了。为什么发生这种情况我永远不知道。但日本人总是在调动哨兵，显然这一个被认为在别处更有用。没有人被派来取代他，所以对我们来说，日本人没有选择更好的时候来清除我计划中最大的障碍之一了。我一直在想哨兵看到我们移动船时会做什么，但现在我再也不用担心了。似乎日本人是在顺水推舟。


    我告诉男孩们，周日晚上天黑后，我让他们把船开到桥下，经过哨兵塔，并绕到捕鱼码头的对侧。这些码头位于哨兵塔和我计划停靠船的码头之间，这样哨兵在周一的白天看不到它。然后周一晚上，一入黑，我就告诉他们再次移动船只，这次跨越运河到达一个连接往巴达雅公路的码头。

