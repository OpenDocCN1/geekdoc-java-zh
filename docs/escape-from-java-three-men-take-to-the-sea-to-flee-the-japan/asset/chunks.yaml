    # 第九

    '
- fmt: '

    # The Escape from Java


    BUT I wasn’t going to wait for any outside help to be delivered from Jap rule.
    Two weeks after the Japs took Java, I decided that I had had enough of “co-prosperity.”
    I am young, just twenty-eight years old; I have no family. There was nothing of
    a personal nature to keep me there. It looked as though it would be a long time
    before the Dutch came back and I didn’t want to wait that long and do nothing
    to help my country. The Japs were getting a firmer grip on the island with each
    passing day; they were smart, tough, and there were a lot of them. I didn’t want
    to fight this war as a prisoner-in-all-but-name of the Japs.


    ## The Plan Takes Form


    Ever since I was a child I’ve owned a boat of some kind. As a hobby I’ve studied
    navigation and know the rudiments of this complicated science. Several years ago
    I captained a yacht for a wealthy man on a trip to Honolulu. I’ve sailed to most
    of the islands of the South Seas. Sailing and the sea are familiar to me and I
    knew that my one chance of escape was by boat. But where to get one now that the
    Japs were in control of the island was a problem that fairly staggered the imagination.


    All yachts in the yacht basin at `Tanjung Priok` had been scuttled by the Japs,
    in order to prevent an escape like the one I was contemplating. Not a single ship
    of the original hundreds that had once graced the harbor remained in a usable
    condition. I know because I investigated the basin shortly after my plan began
    to take form.


    ## Investigation of the Waterfront


    I bicycled down to the waterfront at `Tanjung Priok`, some seven miles east of
    Batavia. The way lies along an inland waterway paralleling the sea wall on the
    shore. A straight road follows the river, which runs some hundreds of yards in
    from the sea. The intervening space between the road and sea is a flat marshy
    area, which has never been filled in or developed in any way and is almost completely
    deserted. Far away across this boggy marshland I could see a sentry patrolling
    the sea wall. He watched me as I pedaled along the road to `Tanjung Priok`, but
    made no motion to stop me.


    `Tanjung Priok` is one of the largest harbors in the Indies. It is composed of
    several long piers, lying alongside each other, all of them covered by big godowns
    or warehouses. In peace time the docks were a lively place, teeming with activity,
    as the natives loaded the big cargo ships which made the harbor one of their chief
    ports of call. Now the entire area was dead. The warehouses were locked, the piers
    empty of life. The water was filled with the hulks of sunken ships, some of them
    scuttled by the Dutch before the army left Batavia and some the Japs had destroyed.
    It was a dreary, depressing sight.


    The yacht basin was particularly distressing to me. All the beautiful little ships
    which had once made the harbor so lively lay submerged, their hulks waterlogged
    and only the outlines visible just below the surface. I had heard previously that
    the Japs had taken the masts and rigging off all the boats, before scuttling them,
    and stored this equipment in one of the godowns. But all the warehouses were locked
    and, even if by any remote chance I could have raised one of the sunken yachts,
    I would have had no hope of getting its sails and mast out of the godown.


    I hadn’t dared go too near the docks in making this hasty inspection of the yacht
    basin and I soon discovered that I had been wise to be cautious. I got off my
    bicycle and started to walk nearer the boats, when a Jap sentry suddenly jumped
    out from behind a godown and flourished his bayonet in my face. He snarled and
    waved me away. I didn’t try to argue. I got on my bicycle and rode off. I knew
    then that there was no hope of getting a boat from the yacht basin. They were
    in no condition to be made ready for sailing and were too closely guarded to make
    any attempt to raise one either feasible or sensible. I would have to look somewhere
    else.


    ## Searching for a Boat


    On my way back I looked along the riverfront more carefully. This region between
    `Tanjung Priok` and `Batavia` along the river is closely packed with small warehouses
    and docks, most of them the home ports of the native fishing boats or prahus,
    as they are called. The Chinese own most of these docks and before the Japs came
    had done a flourishing trade there. Now only a few of them were doing a desultory
    business with the fishermen. The Japs had not forbidden the natives to fish, though
    they watched all the prahus that went out very closely and supervised their activity
    as they did everything else in Java.


    I saw the masts of several prahus over the tops of the godowns as I rode back
    toward `Batavia`, and a faint hope began to stir within me. I knew that a prahu
    would not do for the kind of trip I had in mind; the native boats are too small
    and frail for anything but sailing about near the shore. But I wondered if the
    Japs might not have overlooked a larger boat somewhere in the maze of docks, warehouses,
    and piers in this district. The whole area was filled with small shipping. An
    apparently harmless little ketch or cutter might have been passed over as not
    worth their trouble by the Japs when they destroyed most of the boats in the harbor.
    I rode more slowly, peering intently over the roofs of the warehouses, always
    hoping to see the varnished mast which would tell me that a sturdier boat than
    a prahu was located there. The native boats all have unfinished masts, mere poles
    to support the big sails.


    But I didn’t dare go too near the riverfront then to make an inspection. The Jap
    sentries, spaced at regular intervals along the sea wall, were watching me and
    I didn’t want to make them suspicious. I went home that day having seen nothing
    that would give me any hope of following out my plan of escape.


    ## The Route and Logistics


    For already I knew where I must go and the course I must follow. I have sailed
    the Indian Ocean countless times and know its winds and weathers as well as anyone
    can know such elements.

    - The distance from `Batavia` to `Australia` is some 1200 miles, but each foot
    of the way is against the prevailing winds which sweep from the southeast.

    - From `Batavia` to `Colombo` on the island of `Ceylon` is roughly 1800 miles.
    Here again the winds, if they blow at all, are squally or so light that sailing
    is mere guesswork.


    My best chance lay to the southwest to the island of `Rodriguez`, just east of
    `Madagascar`, over three thousand miles across the Indian Ocean. In spite of the
    greater distance, I decided that to `Rodriguez` I would set my course, if I found
    a boat to take me.


    It was a month before I found the boat. During this time I made frequent trips
    to the waterfront, but I always to be careful. The sentries were everywhere and
    I knew that if they saw me in the district too often they would begin to get suspicious.
    I was so fortunate, however, as to be given more work to do; inspection and other
    jobs offered me a good excuse for absent myself from work often. Thus, if I were
    stopped by a sentry, I could tell him that I was at the waterfront on business.
    No one at the office or among my friends had any idea of my plans.


    I saw the little ketch one afternoon moored in the harbor at `Batavia`. It lay
    near the yacht, just below the lookout tower. Why the Japs had overlooked this
    ketch I never knew. Its masts and sails were gone, it was half filled with water.
    There were no sentries about, except for a group in the lookout tower. But when
    I saw it, my spirits rose as though on wings. This was the boat I had been looking
    for. Its hull was in good shape, well made and entirely seaworthy. In the cabin
    I found an old sea chart of the `Sunda Strait`, the passage between `Java` and
    `Sumatra`, which we would have to go through to reach the Indian Ocean. I took
    it, for it would be invaluable to me in navigating this narrow waterway. I didn’t
    dare linger near the boat too long. But within a few moments I knew what I would
    need to outfit the ketch; a complete set of sails, spars and rigging and a mast.
    Where I could get all this equipment I had no idea, but as I rode away, I was
    too elated to worry about anything. Even the appalling problem of working on the
    boat in its exposed position did not present too many difficulties that time.
    Something could be arranged, I felt sure. Perhaps I could move the boat some night
    to a safer place at one of the Chinese docks on the riverfront. Or perhaps the
    sails, mast and so forth could be made at home and rigged on the boat at the last
    minute.


    ## Gathering Supplies


    Now that I had found my boat, there were a multitude of problems to face. I must
    have food for the trip, least enough for fifty days at sea. With luck I might
    make the voyage in a shorter time, but I wanted to be on the safe side. I needed
    instruments—a `chronometer`, `sextant`, a `nautical almanac`, `charts`, and various
    hand tools. All these things, in addition to the first necessities of a mast,
    sails, and rigging, presented terrific difficulties. But I was determined not
    to be discouraged. I must get away and nothing was going to stop me.


    Still another question faced me. I knew I could never make the trip alone. I needed
    at least two other men to help me get that boat across the Indian Ocean. Where
    could I find men willing to take the risks the whole plan entailed? None of my
    friends were in a position to leave; they had families or other responsibilities
    which would keep them in Java. I must find my companions somewhere and they would
    have to be chosen carefully. At the moment I knew no one whom I dared approach
    with my scheme.


    Meanwhile I busied myself in collecting some of the needed supplies. Since all
    the shops were closely watched by the Japs, I couldn to buy the nautical equipment
    just by going to a store and asking for it. I would have to get it piecemeal from
    the black market or from people who had once owned boats and might have some things
    they had salvaged before their ships were scuttled. It was easier to concentrate
    on the food first, so I began laying in a hoard of rice, corned beef, canned fruits,
    and vegetables. I could get only a few things at a time, as canned goods were
    scarce and buying in quantity would arouse suspicion.


    In a secondhand shop I found an old `sextant` which I was able to purchase by
    saying that I was studying navigation as a hobby and needed it in my work. The
    Chinese owner merely shrugged as he sold it to me. Perhaps he knew I had other
    plans, but he wasn’t going to question me. The `chronometer` was harder to find.
    I saw one in a pawn shop, but the Japs were running it now and I didn’t dare go
    in and ask for it. For the time being the `chronometer` would have to wait.


    I had decided to make my own sails for the ketch and was lucky enough to get a
    piece of canvas from a friend, who asked no questions and pretended to believe
    my story that I was going to make myself.


    ## The Final Departure


    I found two companions, William and Dirk, who were willing to take the risk. William
    was of my age, a tall, dynamic person, evidently afraid of nothing. Dirk was a
    few years older, a quieter personality, full of restless energy. The more they
    talked, the more certain I became they were the men for me. Of course, they wanted
    to see the ketch at once, so I agreed to take them down to the harbor that very
    night. All of us felt tremendously elated as we bicycled down to the harbor. We
    discussed a multitude of plans, revolved schemes for getting hold of the instruments
    and supplies we needed and, in short, built a variety of castles in the air which
    were to whisk us away from Java in record time. There was a bright moon shining
    and its light acted like a charm on our spirits. We forgot all the mountainous
    difficulties that still stood in our path, for now that we were in this thing
    together, we felt that nothing could stop us.


    When we reached the harbor, I led them cautiously across the dock, keeping a sharp
    watch on the lookout tower for any spying Jap sentry. But no one saw us. Then
    I pointed dramatically to the spot where the ketch lay. My hand dropped to my
    side. The moon was reflected on the water in a brilliant glow that made it look
    like a sheet of gold. But the water was empty. The ketch was gone.

