    \ and the Indonesians and some Europeans were permitted to participate in the\
    \ celebration by sending war prisoners a few necessities of life.\n\nThe principal\
    \ thing these prisoners needed was medical supplies. We heard frightful stories\
    \ of the way wounded soldiers were treated, or rather not treated. They had no\
    \ bandages, medicines, or nursing care. a few Japanese doctors were supposed to\
    \ look after them, but either there weren’t enough of them or they didn’t pay\
    \ much attention to their jobs. The wounded prisoners were to all intents practically\
    \ uncared for.\n\nAll the hospitals had been taken over and Jap doctors and nurses\
    \ installed. The Dutch medical men were either interned or told to leave their\
    \ work, though a few native doctors and nurses were made to stay on the job and\
    \ help the Japs. The civilian population was just as badly off for medical attention\
    \ as the prisoners, for all the hospitals were run for the Japanese Army. If any\
    \ of us got sick we could only hope for the best. The Dutch doctors were handicapped\
    \ in their work among the civilians by lack of supplies and, if an epidemic of\
    \ any kind had struck us, there would have been nothing to check it.\n\nThe Japs\
    \ now had control of all phases of life in Java. One of the most interesting proofs\
    \ of their imitative habits was their administration of justice in the courts.\
    \ Of course, they had taken over the judicial machinery immediately, but in the\
    \ courts they made fewer changes than in other places. They were smart enough\
    \ to realize that the Dutch system worked well and they didn’t want to disrupt\
    \ it. Many of the Dutch judges were forcibly retained and the Japs watched the\
