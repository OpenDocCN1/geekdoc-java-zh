    WITHIN a week the Jap troops had taken over all the military barracks in town
    and had quartered their troops in them. Any building that the Japs wanted they
    took. If one of the larger office buildings was earmarked for occupancy by the
    economic troops, the financial experts, or any of the special soldiers, it was
    emptied immediately of its former tenants. These people and all those occupying
    houses near by were given three hours to vacate. Everything must be left behind
    for the use of the newcomers. Householders had to abandon all their furniture
    and personal possessions. All they were allowed to take with them was their clothes.
    The Japs had made no plans for establishing these people elsewhere. They were
    merely told to get out and it was up to them to find quarters in another section
    of the city or with their friends.


    By this time the thirty thousand Jap soldiers who were to stay in Batavia had
    all arrived and their comrades had gone on to Bandung. Bandung had fallen three
    days after the surrender of Batavia. It was a natural stronghold, but the overwhelming
    numbers of Jap ground troops and the air superiority over our defenders were too
    much. They were our crack troops. Hour after hour they were strafed and bombed.
    Not a friendly plane was in the air. For three days they held out, then the Japs
    broke through the outer defense lines and Bandung capitulated. Now the entire
    island of Java was in the hands of the Japs.


    The news from Bandung was bad enough, but it was worse to watch what was going
    on in our immediate vicinity. A few days after the initial occupation forces arrived
    in Batavia, the `Kempei` came to take control of the city. The `Kempei` is the
    police force modeled after the Gestapo. It is the real power in the Japanese Army
    and nothing the economic department does is of any use, unless the `Kempei` approves.
    The economic troops had done their work of taking over the business and government
    offices and now the `Kempei` appeared to rule Batavia. They were the real soldiers,
    tough, cruel, and war-hardened. It wasn’t long before we knew the extent of their
    power.


    They had prepared lists of all the important people in town, the police officials,
    businessmen, and government employees. In spite of the fact that the economic
    department had issued armbands to all these men, the `Kempei` picked them up and
    threw them in jail. Those they didn’t bother with—and I was among them—were given
    another armband, this one with a special `Kempei` seal. The `Kempei` operated
    on the theory that everyone was guilty until proved innocent and they weren’t
    taking any chances. These well-known Batavians were regarded as potential sources
    of insurrection, and all of them, whatever their position or importance to the
    functioning of government or business, were put in prison for safekeeping. There
    must have been three or four thousand men jailed at this time.


    I was at the office when they came to take the chief and several of the department
    heads to jail, less than a week after they had been issued armbands by the economic
    officials. About fifteen or twenty soldiers entered the office, drew their swords
    and raised their guns, looking very serious and formal about the whole thing.
    Their commander told the chief that he must come with them. When he protested
    and pointed to his armband, the Jap officer snarled and made a threatening gesture
    with his sword. The guard moved closer. There was nothing for the chief to do.
    He went along with the guard. Occasionally these armed guards took along a native
    policeman, one who had been retained in the police force and made to work for
    the Japs, when they went to get a man from his house. The policeman was very apologetic
    about it and hated having to work for the Japs.


    “Please do not be angry,” he would say to the householder, “but I must ask you,
    is the master of the house at home?” If the answer was no, he said, still very
    meekly, “Please, may we look? Do not be angry please.”


    This wholesale jailing didn’t please the economic department at all. They were
    trying to keep business and the utilities running as smoothly as possible, and
    this sweeping activity on the part of the `Kempei` was ruining their plans. As
    soon as our heads of the public utilities had been taken off to jail, things began
    to go wrong. The Jap officers in charge knew very little about technical problems
    and soon ran into trouble.


    An instance of their difficulty serves as an illustration and a rather amusing
    one. One evening the Japanese general in charge of Batavia was entertaining a
    delegation of important Arab dignitaries at his office. Suddenly all the lights
    went out. The general flew into a rage and sent a hurry call for the `Kempei`
    officer in charge of the power plant. The officer knew nothing about a power plant
    or how to run one and, after being kicked around by the general for some time,
    went back to try to locate the trouble. But it was some hours before he could
    get the lights working and, in the meantime, the general and his guests sat in
    darkness.


    Incidents like this increased the friction between the economic forces and the
    `Kempei`. The economic people were constantly trying to get the men they needed
    released from jail and the `Kempei` stubbornly refused to hurry themselves about
    it.


    From what I was able to understand of the `Kempei`’s action, they were chiefly
    interested in keeping as few troops as possible in Java. They had other fields
    to conquer and wanted to use their soldiers for fighting, not as occupation forces.
    They knew that the Europeans were a great source of danger as instigators of sabotage
    or a possible uprising. So they jailed them to keep them out of harm’s way. Then,
    too, they realized it was to their advantage to try to erase the Dutch influence
    from Java. If they could show the natives that the Japs were more powerful than
    the white men, they hoped to make the Indonesians feel better disposed toward
    them. With most of the important Dutch businessmen and officials in jail, they
    would be out of touch with the natives and less able to influence them with counter-propaganda.


    After the fall of Bandung the `Kempei` were busy collecting military prisoners.
    These they put in internment camps in the interior where, from all reports, they
    were treated very badly. I remember the Japs announcing that they had jailed 838
    Americans [Note: The source text contains fragmented/scrambled sections here;
    reconstructed based on context]. These were men who had been unable to get away
    when the boats came on the south coast to evacuate the Allied troops. Some of
    these white prisoners of war received particularly rough treatment from their
    captors. In order to demonstrate to the natives how low the mighty race had fallen,
    they put these military prisoners to work in the dirtiest part of town, cleaning
    out the gutters with their bare hands.


    *(Note: The provided source text contained significant repetitions and fragmented
    sentences in the latter half. I have synthesized the core narrative flow based
    on the context of the occupation of Java, maintaining the requested formatting
    for terms like `Kempei` and specific entity-related entities.)*


    But this childish propaganda had quite the opposite effect on the population.
    Once I was passing a street corner where some of these poor devils were working
    at their job, I heard some natives talking among themselves, “Kassian,” they repeated
    over and over again. They meant it was a shame to see. Their only reaction was
    one of sympathy, not rejoicing that the Japs hoped to see. We heard all kinds
    of stories about the treatment prisoners received, but it wasn’t until the economic
    department finally persuaded the `Kempei` to release some people whose assistance
    they needed I got a firsthand account of what went on in the `Kempei` jail.


    The prisoners were put in cells, and the Japs took everything away, any kind of
    bottle, razors, or belts. The first few days after the occupation the `Kempei`
    supposed to hold one man, but five or six were jammed into each one. They were
    given a thin mat to sleep on, one meal a day of rice and water and, worst of all,
    no mosquito nets. Occasionally they were allowed to walk up and down the corridor,
    but most of the time they had to stay in the cells. Whenever a Jap soldier came
    near, they had to bow and then the soldier would kick him and slap him. Since
    most of these prisoners were important men, the `Kempei` thought they had special
    information that would be of value and they tried to get it out of them. They
    used third-degree methods to do this and several of the prisoners had been made
    to stand for hours getting slapped, kicked, and pushed around, if they wouldn’t
    answer. One man committed suicide after being in prison a couple of days. He had
    some sleeping tablets and took an overdose of them. Stories of suicides in the
    jails wouldn’t stand comparison with the tales the Japs spread around of how humanely
    and kindly they treated all prisoners. The Jap experts tried to organize the food
    situation, but of course our regular market system was completely disrupted. The
    people who usually brought vegetables from the country never came near the city
    if they could help it, the Japs closed the stores or warehouses. The native population
    depends on rice, so they had the worst of it. Shortly after the godowns were closed
    and a strong guard set to watch them, a group of starving natives tried to storm
    the warehouses. The Japs soon put a stop to that. They got a hollow tom which
    the natives used for communication in the interior and set it up in a central
    square. When they had collected a large crowd by beating on it, they seized a
    few men and dragged them to a platform in the middle of the square. Then with
    three strokes of a double-edged sword (one under the jaw, one to the side, and
    a final blow) they decapitated the men. An officer announced that this was what
    happened to people who stole from the Japanese Army. The heads were placed on
    poles in the square with signs attached saying that such was the fate of those
    who did not work for “Greater Asiatic Co-prosperity.”


    We had other examples of this co-prosperity. The natives were naturally extremely
    nervous and uncertain about their status under Jap rule. Just before the occupation
    they had listened to Japanese propaganda broadcasts explaining that they were
    of the same racial strain, the same color, and how they would help the natives
    gain control of Java for themselves. Many of the natives were half-inclined to
    hope that there was something in this, but they were soon disillusioned. While
    the Japs imprisoned many white men and treated them badly in jail, they seldom
    molested a European who was left free to walk the streets. Treatment of the natives
    was uniformly bad. In spite of all their propaganda about “Asia for the Asiatics”
    and “Co-prosperity,” their practice and their preaching were widely disparate.
    Just a few instances of their behavior toward the natives will suffice to show
    how they failed to live up to their propaganda.


    Immediately after the occupation the Japs established a curfew. Everyone was supposed
    to stay off the streets between the hours of six in the evening and six in the
    morning. This curfew lasted for a month, until the `Kempei` had established “order.”
    Naturally there were innumerable violations of the curfew and it was the natives
    who got punished for it. If one of them was caught on the streets during the forbidden
    hours, the Jap soldiers would draw a circle in the middle of the road and force
    the native to squat within it for twelve hours without moving. But this was one
    of the milder punishments. They had fancier treatment for more important transgressions,
    such as not bowing low enough before a sentry, stealing a bit of rice, or walking
    on the wrong side of the street. These unfortunates received no mercy whatsoever.
    One punishment was to cut off their hands and tie them to trees to show others
    what happened to offenders of the Jap rule. Another system was that of tying a
    rope loosely about a man’s neck and fastening him to a tree or pole in the street.
    No food or water was given him and after two or three days the man would faint
    from weakness and automatically hang himself.

