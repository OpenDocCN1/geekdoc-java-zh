    working, two Jap soldiers came up and searched them, evidently looking for weapons.
    But instead of guns they took a wristwatch from one fellow and a pair of sun glasses
    from another. The men tried to protest, but were silenced by a menacing gesture
    with a bayonet.At the end of the two-hour stretch they went up to the Jap officer
    to announce that they had finished their stint. The officer saluted them and said,
    “Thank you,” very formally. He seemed quite civil and one of the men decided to
    mention the fact that his watch was gone. He had no sooner told him that the soldiers
    had taken the watch and sun glasses than the officer flew into a violent rage.All
    the soldiers were made to form a line and the officer announced that the two who
    had taken the articles were to step forward and return them. The soldiers obeyed
    instantly and, with many apologies and hissing excuses, the officer returned the
    stolen property. The last my friends saw of the officer he was yelling at the
    two soldiers, slapping them in a fury of anger.The officers were obviously sincere
    in their determination to make their propaganda have some meaning. They did their
    best to offset the bad effect of the soldiers’ brutality and senseless mistreatment
    of the natives. But there weren’t enough officers to catch all the offenders.Perhaps
    as a means of keeping the soldiers out of mischief the officers kept them up to
    a strict military training. Every day between two and three in the afternoon,
    when the temperature is well over a hundred, the soldiers were made to run up
    and down the streets. They wore their heaviest uniforms and carried bayonets with
    which they practiced stabbing motions as they ran. The sweat poured off them,
    but they weren’t allowed a moment’s rest. From time to time they gave hoarse yells,
    a sort of animal cry. I learned that these shouts are part of their training.
    They are intended to frighten the enemy.But it was by propaganda that the Japs
    hoped to conquer the Indonesians. Their slogans were meant to win them to the
    Japanese point of view, in spite of the daily evidences that the Japs had no understanding
    of or sympathy for the natives.'
