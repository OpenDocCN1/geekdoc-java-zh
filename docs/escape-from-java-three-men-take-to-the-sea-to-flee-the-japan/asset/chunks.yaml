    felt sure. Perhaps I could move the boat some night to a safer place at one of
    the Chinese docks on the riverfront. Or perhaps the sails, mast, and so forth
    could be made at home and rigged on the boat at the last minute.Now that I had
    found my boat, there were a multitude of problems to face. I must have food for
    the trip, at least enough for fifty days at sea. With luck I might make the voyage
    in a shorter time, but I wanted to be on the safe side. I needed instruments—a
    chronometer, a sextant, a nautical almanac, charts, and various hand tools. All
    these things, in addition to the first necessities of a mast, sails, and rigging,
    presented terrific difficulties. But I was determined not to be discouraged. I
    must get away and nothing was going to stop me.Still another question faced me.
    I knew I could never make the trip alone. I needed at least two other men to help
    me get that boat across the Indian Ocean. Where could I find men willing to take
    the risks the whole plan entailed? None of my friends were in a position to leave;
    they had families or other responsibilities which would keep them in Java. I must
    find my companions somewhere and they would have to be chosen carefully. At the
    moment I knew no one whom I dared approach with my scheme.Meanwhile I busied myself
    in collecting some of the needed supplies. Since all the shops were closely watched
    by the Japs, I couldn’t buy the nautical equipment just by going to a store and
    asking for it. I would have to get it piecemeal from the black market or from
    people who had once owned boats and might have some things they had salvaged before
    their ships were scuttled. It was easier to concentrate on the food first, so
    I began laying in a hoard of rice, corned beef, canned fruits, and vegetables.
    I could get only a few things at a time, as canned goods were scarce and buying
    in quantity would arouse suspicion.In a secondhand shop I found an old sextant
    which I was able to purchase by saying that I was studying navigation as a hobby
    and needed it in my work. The Chinese owner merely shrugged as he sold it to me.
    Perhaps he knew I had other plans, but he wasn’t going to question me. The chronometer
    was harder to find. I saw one in a pawn shop, but the Japs were running it now
    and I didn’t dare go in and ask for it. For the time being the chronometer would
    have to wait.I had decided to make my own sails for the ketch and was lucky enough
    to get a piece of canvas from a friend, who asked no questions and pretended to
    believe my story that I was going to make myself a pup tent. I made frequent visits
    to the harbor to see if the boat was still there and had the satisfaction of finding
    that the little ketch was apparently ignored by the Japs, who must have considered
    it too unseaworthy to be useful to anyone. No one seemed to be watching it, and
    I decided that for the time being I would leave it where it was. When I had to
    begin actual work on it, I could move it to a less exposed place.It wasn’t until
    the end of May that I met William Desbres and Dirk Voorneveld. During all those
    weeks I had been busy laying in my supplies of food, working on the sail, and
    trying to find some of the other equipment needed for the voyage. I had made some
    headway on my own, but the time had come when I needed help. William and Dirk
    came into my life just as I was beginning to think there was no one in Java whom
    I could trust with my plans.I had been invited to a Sunday evening party and the
    moment I entered the house I heard a man’s voice telling my hostess that he was
    establishing a prahu company and was in Batavia looking for some boats to operate
    with. Immediately I had a feeling that this man was the one I had been waiting
    for. His story of a prahu company sounded suspicious to me. He didn’t look as
    though he was the kind of man who would be content to manage a fleet of native
    prahus. I was introduced to William Desbres and his friend, Dirk, and spent the
    evening listening to their ideas. The more they talked the more convinced I became
    that these two had other fish to fry than those they might catch from the sea.William
    was just my age, a tall, dynamic sort of person, full of restless energy and evidently
    afraid of nothing. Dirk was a few years older, a quieter, less forceful personality.
    Both men were from Bandung where they were now living a hit-or-miss existence
    under the Japs.I said nothing of my own plans at the party. I listened to William
    talk and the more he talked the more sure I was that he was the man I needed.
    Dirk was his partner in the “prahu company,” so he was of course to be included
    in any plans William and I concocted. I left the party with William and Dirk and
    once outside said quietly:“Look here, about this prahu company—”“Prahu company,
    hell,” exclaimed William. “That’s just a stall. I’m here to find a boat to get
    me out of Java.”That was all I needed to know. I immediately told them that I
    had found a boat, that I had collected a store of food and made some headway in
    outfitting the ketch. They listened enthusiastically and were with me at once.
    When William pulled a revolver out of his pocket and showed it to me, I was more
    than ever certain that he was the kind of person who would risk anything to get
    away. He had stolen the gun from the Japs somehow and told me that he had four
    more hidden in Bandung. Anyone who would dare steal five revolvers from the Japs
    was the man for me.Of course, they wanted to see the ketch at once, so I agreed
    to take them down to the fishing harbor that very night. All of us felt tremendously
    elated as we bicycled down to the harbor. We discussed a multitude of plans, revolved
    schemes for getting hold of the instruments and supplies we needed and, in short,
    built a variety of castles in the air which were to whisk us away from Java in
    record time. There was a bright moon shining and its light acted like a charm
    on our spirits. We forgot all the mountainous difficulties that still stood in
    our path, for now that we were in this thing together, we felt that nothing could
    stop us.When we reached the harbor, I led them cautiously across the dock, keeping
    a sharp watch on the lookout tower for any spying Jap sentry. But no one saw us.
    Then I pointed dramatically to the spot where the ketch lay. My hand dropped to
    my side. The moon was reflected on the water in a brilliant glow that made it
    look like a sheet of gold. But the water was empty. The ketch was gone.
