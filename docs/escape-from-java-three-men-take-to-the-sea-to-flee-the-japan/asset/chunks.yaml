    # 第六章

    '
- fmt: '

    I DECIDED to learn Japanese. Since the vast majority of soldiers, and officers
    too, spoke only their native tongue, I had to learn their language if I wanted
    to talk to them. I’ve always been fairly quick at languages, but Japanese is a
    science in itself. I put myself on a strict regime of one hundred Jap “characters”
    a day and struggled to get a grasp of their intricacies. Soon I had a list of
    words at my command and began practicing them on the Jap soldiers and officers.


    ### The Attitude of the Soldiers

    The first question I asked was what they thought about the war, what they hoped
    to get out of it. I was not long in discovering that most of them thoroughly enjoyed
    fighting and looked upon war as the only real way for a man to live. The basis
    for this belief is easy to understand; most of the common soldiers had led a miserable
    life at home. They were of the lowest order; ignorant, poverty stricken, and with
    nothing to look forward to except grinding work and slow starvation. Army life
    to them was seventh heaven; they had a bowl of rice a day, a uniform, and nothing
    to worry about. Their military leaders have crammed into their heads the idea
    that the only way to improve their lot at home is to go out and conquer the world.
    This they are fully confident they can do.


    As I have already said, the Japs in Java were those who had already been fighting
    for four years in China. They were war-toughened, excellently trained in their
    business, and fanatical to an unbelievable degree. Only one or two soldiers showed
    me pictures of their wives and children and expressed a wish that the war was
    over so that they might go home. The others, the vast majority, wanted nothing
    better than a life of continual warfare. These latter were the true fanatics.


    ### Fanism and Honor

    Once, talking to a group of soldiers who were off duty, I asked them what they
    would do if they were taken prisoner. They looked at me as though they thought
    I had lost my mind. No true son of the Empire, replied one in effect, would allow
    himself to be captured. He would kill himself first. From the look in his eyes
    as he spoke I knew he meant what he said.


    Another told me very solemnly that he would never dare go home if he were taken
    prisoner or surrendered. His mother, he assured me, would spit on him for disgracing
    the family. Then his only course would be to commit hara-kiri in order to restore
    the family honor. He showed me with a gesture of his bayonet just how he would
    do this.


    ### Interactions and Communication

    On the whole the Jap soldiers are extremely polite when talking to a white man.
    They always saluted before speaking and their conversation was riddled with “sorry”
    and “please,” the two English words that most of them knew. They bowed and ducked
    their heads constantly and in general acted like schoolboys being addressed by
    a bishop.


    Some of them know a few words of English and a little Malayan. But in talking
    to them I had to rely chiefly on my own poor knowledge of Japanese and gestures.
    The Japs can express almost any thought or action by a series of complicated motions
    of their hands and arms. I grew quite adept in this “deaf and dumb” language myself
    and soon could ask a soldier how he liked the war by pointing to him, then to
    his bayonet and finally by making the motion of stabbing someone with it. The
    Japs were highly amused by my efforts and always knew what I meant.


    ### Views of the War

    It was particularly interesting to hear what questions they asked me. The first
    one in almost every case was, “What about America?” Evidently America had been
    held up to them as the real enemy and they seemed apprehensive of the part the
    United States might play in the war. Often I was asked if I thought the Americans
    would bomb Japan. They had a very real fear that America would upset their apple
    cart, though in the light of events thus far, they had no reason to feel this
    way.


    They had just taken the Philippines, Malaya, Borneo, and all the islands of the
    Indies and were extremely scornful of the Allied defense of these places. They
    felt that these campaigns had been easy for them, and the fact that Singapore,
    supposedly the strongest fortress in the world, had fallen so quickly was a source
    of great satisfaction to them. I often heard them joking about the American and
    British soldiers, and they evidently felt themselves to be so superior that there
    was no possible comparison. But they had a very healthy respect for the Chinese.
    One soldier expressed it by sticking up his thumb and saying, “Good, good,” several
    times. They had been fighting the Chinese long enough to know what they were talking
    about.


    ### Life Off Duty

    When the soldiers were off duty they acted like children on a holiday. They were
    full of animal good spirits and seemed to have an inexhaustible supply of energy.
    One day a group of soldiers stopped me in the street and one of them suggested
    that we wrestle. But I had heard enough about jujitsu to know that I would be
    no match for him, in spite of the fact that I was twice his size. I knew too that,
    if I should happen to hurt him at all or made a false move that he felt injurious
    to his dignity, almost anything could happen. Getting run through with a bayonet
    might easily be the end of the wrestling match for me. I wanted to stay on their
    good side in any case and always pretended a friendliness toward them. It would
    do me no good to get in their bad books.


    When I declined to wrestle with him the soldier took my refusal in good part,
    but immediately suggested I sing an American jazz song. Before I could make my
    excuses, he began gesturing as though playing a guitar and singing in a hoarse,
    guttural voice the English words to “Dinah.” His friends accompanied this exhibition
    by doing a clumsy imitation of an American dance. They were delighted with their
    own performance and repeated it several times.


    ### The Role of the Officers

    On the whole I discovered that the majority of the common soldiers are totally
    ignorant of everything but the mechanics of war and a smattering of Japanese history.
    They have been told that Japan’s destiny is to rule Asia and they believe this
    wholeheartedly. They know nothing of what goes on in other countries, and foreign
    nations to them are peopled by savages who want to wipe Japan off the face of
    the earth.


    The officers were obviously sincere in their determination to make their propaganda
    have some meaning. They did their best to offset the bad effect of the soldiers’
    brutality and senseless mistreatment of the natives. But there weren’t enough
    officers to catch all the offenders.


    ### Instances of Discipline

    Other incidents of the officers’ efforts to counteract the behavior of the troops
    occurred when the soldiers stole anything, either from the people or shopkeepers.
    It appeared that every Jap’s greatest wish in the world was to own a watch. Before
    they had been in Batavia a week, every jewelry store in town was bare of watches.
    The soldiers had a very simple method of acquiring these timepieces: they would
    enter a shop, point out a watch to the clerk and announce they wanted it. Occasionally
    they paid less than the asking price in Japanese script, but more often they merely
    walked off without so much as a you.


    When the officers realized the soldiers were doing this, they announced every
    watch was to be returned immediately. They accompanied the men back to the stores
    and insisted that the watches be given back or else paid for in full in script.
    The fact that the script was practically worthless made no difference. To the
    officers it was the principle of the thing. The soldiers weren’t supposed to steal
    and the officers were there to see that they obeyed the letter of the law at least.


    Petty pilfering went on all over the city, but whenever the officers heard about
    it they took measures to stop it. Friends of mine, men who had worked temporarily
    in Bandung, told me a story that illustrates the officers’ efforts to keep peace
    between the soldiers and the people. On their way home to Batavia my friends ran
    into a repair crew of Jap soldiers who were fixing one of the bridges that had
    been blown up by the retreating Dutch. They were stopped and told that everyone
    who passed that way must work two hours, helping to repair the bridge. There was
    no way out of it so they took off their coats and set to work. A Jap officer stood
    over the whole gang with a long whip and whenever he saw anyone, either a soldier
    or civilian worker, slacking a little, he uncurled his whip and let him have it
    across the shoulders.


    While the men were working, two Jap soldiers came up and searched them, evidently
    looking for weapons. But instead of guns they took a wristwatch from one fellow
    and a pair of sunglasses from another. The men tried to protest, but were silenced
    by a menacing gesture with a bayonet. At the end of the two-hour stretch they
    went up to the Jap officer to announce that they had finished their stint. The
    officer saluted them and said, “Thank you,” very formally. He seemed quite civil
    and one of the men decided to mention the fact that his watch was gone. He had
    no sooner told him that the soldiers had taken the watch and sunglasses than the
    officer flew into a violent rage.


    All the soldiers were made to form a line and the officer announced that the two
    who had taken the articles were to step forward and return them. The soldiers
    obeyed instantly and, with many apologies and hissing excuses, the officer returned
    the stolen property. The last my friends saw of the officer he was yelling at
    the two soldiers, slapping them in a fury of anger.


    An instance of this happened in Surabaya. She was riding in a crowded street when
    a group of Jap soldiers got on. They immediately pushed their way toward her and
    demanded she give up her seat. This girl was not used to such treatment, being
    Dutch, was as stubborn as only a woman can be. The soldiers began kicking her
    feet and one of them slapped her several times. She still refused to move. Then
    another snatched her handbag and tossed it out the window. This only served to
    make her more determined than ever to stay. What might have happened to her next
    can only be imagined for the car stopped and two Jap officers got on. They immediately
    saw what was on and ordered the trolley to stop. Then they grabbed the soldiers
    and tossed them into the street. One of them walked back to pick up the handbag.
    After slapping and kicking the soldiers to teach them a lesson, the officers came
    back to the girl and apologized profusely. “Sorry, sorry, excuse please,” they
    repeated over and again.

