  raw: IT took me three days of careful reconnoitering to find the ketch again. I
    finally saw it moored just around the corner from its original position in a drydock
    that had once been owned by a Chinese. Now the Japs had control of the dock and
    three sentries patrolled it night and day. The boat lay right before my eyes,
    but now it was as far out of my reach as though it had never existed. I knew that
    there wasn’t the slightest hope of getting it away from that dock. The sentries
    were too near and it would have been foolhardy to make any attempt to snatch it
    from under their very noses.William was all for making a bold dash and grabbing
    the boat without a second thought as to where we could hide it, if we did succeed
    in getting it. I had some difficulty in persuading him that such a plan was utterly
    ridiculous. But he was too disappointed to be able to think clearly and kept on
    insisting that we could do it. When I had calmed him down, I made him see that
    we should have to begin all over again; find another boat and start from scratch
    with our plans.Then Dirk had an idea. He and William knew somebody near Cheribon
    who owned a schooner which he kept at another harbor. They had already talked
    over the idea of escaping with this man and he had agreed to find out whether
    or not his boat had been scuttled by the Japs. I didn’t put too much faith in
    this scheme, for what they told me of their friend made me think that he wasn’t
    any too anxious to get away. The Japs had been in Java for three months and if
    he hadn’t found out whether or not his boat still existed in all that time, he
    couldn’t be very up and coming. But any working plan was better than none, so
    I told William and Dirk to see what they could do with this fellow.We decided
    that they were to go back to Cheribon immediately and talk to the man. The next
    weekend I was to come there and see if they had succeeded in getting anything
    definite out of him. I still had my job at the office, of course, and couldn’t
    move about as freely as I would have liked. So I had to do most of my work on
    our plans in the late afternoon and on weekends. The Japs had issued strict orders
    that anyone caught taking time off when not necessary, slowing up on the job,
    or in any way acting suspiciously was to be heavily punished. I didn’t want to
    spoil my chances by getting in wrong with the Japs, so I had to move carefully.All
    that week I waited impatiently for word from William. He had promised to write
    me a postcard, giving some cryptic message which would tell me what progress he
    was making. But as the days passed and no card came, I began to get rather nervous.
    I wondered if I had been wise to tell the two men so much about my plans. I knew
    nothing of them really. They might even be Jap spies, though I thought this highly
    unlikely. Then, too, in spite of the confidence I had first felt in William’s
    courage and self-confidence, neither he nor Dirk had ever done any sailing. They
    knew nothing whatsoever about a boat, and the responsibility of the coming voyage
    would fall entirely on my shoulders. I had chosen the two men to confide in because
    I liked their spirit. They obviously had strength of mind enough to make plans
    for getting away; they could help me enormously in the preliminary preparations.
    But once at sea, it would be up to me to get us across the Indian Ocean.I had
    just about decided I had acted like a fool to tell so much to utter strangers,
    when a card came from William written in Malayan. “Johnny is well and hopes to
    see you soon,” it said. From this, I knew that he had spoken to his man and that
    he wanted me to come to Cheribon to talk to him myself.On Saturday I set out by
    train. I didn’t feel any too happy about this trip, for stories had been circulating
    in Batavia to the effect that all trains were searched by the Japs and European
    men taken out and imprisoned. But I had to take risks to get what I wanted, so
    I tried not to think too much about what might happen to me if the train were
    searched. Like most of the rumors I had been hearing lately, this one proved to
    be false, at least as far as I was concerned. Except for a few soldiers traveling
    on the train, I saw no Japs at all. I merely showed my registration card when
    I bought my ticket, and when I reached the railroad station at Cheribon, the guards
    let me pass without so much as a second look in my direction. For the thousandth
    time I blessed that Kempei armband I wore.William and Dirk were at the station
    to meet me and seemed in high spirits. They had made an appointment with their
    friend and we were to see him right away. I tried to find out what they had heard
    about this man’s boat, but they were pretty vague on that score.“Wait until we
    see...,” they said. And I had to be content with that, though my opinion of their
    friend began to sink away to nothing.Almost as soon as we arrived at the man’s
    house, I knew that I had been right in suspecting that he wasn’t the sort of person
    who could help us at all. He was a businessman, a European who had lived in Java
    for years and was evidently quite wealthy. His life apparently had not been much
    disturbed by the Jap occupation and he and his family seemed very comfortably
    off. For two hours I had to listen to him discourse on his life and career. He
    described his schooner in minute detail and told us what a perfect boat it would
    be for our purpose. His desire to escape from Java was nothing but a dream of
    adventure to him and I soon saw that he had no real intention of leaving. He just
    liked to talk about it. He had made no efforts, even yet, to find out what had
    happened to his boat and this alone was enough to convince me that I was wasting
    my time.“Look here,” I said finally, cutting in on one of his interminable tales
    about his own prowess as a yachtsman, “what about your boat? Does it still exist
    or not?”“Well—“ he began, but I interrupted again.“I’m going back to Batavia,”
    I announced. “By next Saturday I want to know if your boat is still seaworthy.
    If not I’ll get another.”He must have seen that I was beginning to lose patience
    with him, for he immediately promised to send someone down the next day to find
    out about his boat. With this I had to be content, but, when I left his house,
    I crossed him off my list of hopes. Boat or no boat, he wasn’t going to be a member
    of our ship’s company.I went back to Batavia that afternoon, after arranging with
    William and Dirk that they were to follow me the next Saturday, bringing news
    of the man’s boat and also all the personal possessions they would need for the
    trip. I told them to make their luggage light as there would be little storage
    space, whatever kind of boat we might find. The two men were to stay in Batavia
    until we left, since there was much they could do to help get ready for the voyage.All
    that week I looked for a boat with no success whatsoever. That ketch seemed to
    be the only sailing vessel the Japs hadn’t scuttled. But I wouldn’t let myself
    get discouraged and continued to collect food supplies and other equipment just
    as though I had a boat all set for the voyage. Two native boys helped me buy the
    food. I sent them into the black market to get a little at a time, for I knew
    that I couldn’t buy it all myself without rousing suspicion. Gradually the food
    stock at my house grew until I had fifty kilos of rice, forty-seven cans of corned
    beef, five cans of sardines, four cans of fruit, a can of sauerkraut, and two
    cans of prunes. It was a miracle that I was able to get so much canned stuff considering
    how strictly it was rationed.I was still on the lookout for a chronometer and
    the necessary sea charts, but as yet had no luck in finding them. I wished William
    and Dirk would hurry and get to Batavia so they could help me. William, I knew,
    had many contacts there, and he told me of one man in particular who had worked
    with one of the steamship companies who might be able to help us in getting some
    charts. The only piece of real good fortune I had that week was running into an
    old friend of mine who must have had some idea of what I was planning, for, to
    my complete surprise, he told me that if ever I wanted any sailing equipment,
    I was free to use any he had. He had salvaged the sails from an old boat which
    he had sold and now had them hidden at his house. Without committing myself, I
    told him I’d remember his promise. The realization that I had this store of sailing
    equipment to fall back on gave my spirits a big lift.It wasn’t until Tuesday of
    the following week that William and Dirk finally showed up in Batavia. But I forgave
    their late arrival when I heard what they had brought with them. They had the
    five revolvers and some ammunition sewn up in a big piece of canvas, a case containing
    two gallons of gasoline, and a variety of small hand tools, such as a screw driver,
    a hammer, and some nails.“But where is this stuff?” I asked, when William had
    finished telling me all about it.“Oh,” he said casually, “it didn’t come on the
    same train we did. The baggage car was full, so it’s coming on a later train.
    I’ll have to go down to the station and get it tomorrow.”I groaned aloud, picturing
    what would happen to all of us if the Japs should happen to inspect the bundles,
    before William claimed them. But he reassured me by saying that he had sent them
    under an assumed name and planned to go to the baggage room and look over the
    stuff there before claiming his luggage. If he saw that his bundles had been tampered
    with, he was just going to walk away and do nothing about claiming them. He seemed
    so confident, I didn’t say anything more, but I found myself praying that the
    Japs hadn’t gotten curious about that bulky roll of canvas and the gasoline container.They
    also told me that the man near Cheribon had found out that his ship had been scuttled
    and that there was no hope of using it. The man still talked of making a getaway,
    they told me, but I refused to listen to any more of his schemes. He wanted to
    get a native prahu and escape in that, but I knew enough about these fishing boats
    to realize that they’d never be good for a three-thousand-mile voyage.As William
    had assured me, he had no difficulty at all in claiming his luggage at the station
    the next day. He hired a tricycle with a cart attached, one of the vehicles that
    were used in Batavia to transport goods. The natives did a thriving business with
    this “express” service, especially now when so many families were moving to cheaper
    quarters.William made a careful inspection of the baggage room and soon discovered
    that his bundles were intact. The guard gave them to him without a murmur when
    he presented his claim check. It amused William to see the Jap hand him that canvas
    bundle containing the revolvers and ammunition. He packed the stuff in the tricycle’s
    cart and led the way on his bicycle to my house, where we had agreed to keep all
    our stores. It was a load off my mind when I saw those bundles safely hidden in
    my cellar.I explained to both of them what we still needed to outfit any boat
    we might find and stressed the fact that we must have charts of the Java Sea and
    a map of the ocean itself. We couldn’t go anywhere without these. Charts of the
    Java Sea were particularly necessary as this part of our voyage might easily be
    the most dangerous, because of the reefs near the shore.William is one of those
    people who are born lucky. He went the very next day to his friend from the steamship
    company and, without having to reveal our plans at all, got a lot of useful information
    for us, as well as some charts of the Java Sea. He also learned that the Japs
    kept a constant patrol of the Sunda Strait by planes and by boat. This news wasn’t
    any too encouraging, but I had already decided that we would make the trip through
    the strait at night anyway and hoped to be able to avoid the Japs under cover
    of darkness.We were making headway, but by the middle of June still hadn’t found
    a boat. I began to get desperate. A native boy who worked in my office lived at
    Tanjung Priok and I tried to question him about the situation there. If some of
    the sentries had been moved away from the yacht basin, I thought I might have
    a slim chance of raising one of the scuttled yachts. But the boy seemed to know
    nothing of the Japs’ activities and merely acted scared when I questioned him.
    However, I knew that the Jap sentries were always being changed; some of those
    at the Batavia end of the harbor had been removed entirely. Only those in the
    lookout tower remained.The only thing to do was to make another trip to Tanjung
    Priok and look over the situation myself. I took William and Dirk with me late
    one afternoon and we bicycled the seven miles, talking rather dispiritedly about
    our chances of making an escape. We even discussed the possibility of buying a
    native prahu and trying to get away in that. This was William’s idea and it took
    me some time to prove to him that, even if we had the money to buy a prahu, it
    would never be good for the trip we contemplated.But the sentries were still thick
    at Tanjung Priok and we didn’t even get off our bicycles to inspect the yacht
    basin. I knew that this seemingly last hope was blasted and that it was no good
    even to think of raising one of the yachts. We started back along the way we had
    come. Partly from habit I studied the masts rising above the roofs of the godowns
    along the riverfront. Perhaps I had overlooked the varnished mast I was hoping
    to see.Then I saw it. Rising just a foot above the top of a tumble-down warehouse
    was the shining tip of a mast. Without inspecting it more closely I knew that
    it belonged to a European type of boat of some sort. The varnished mast proved
    that.To the astonishment of William and Dirk, I said dramatically, “I’ve found
