    \ at `Tandung Priok`, the harbor of `Batavia`. Soldiers were loaded onto barges\
    \ at the docks and taken out to larger ships in the outer harbor. Most of the\
    \ troops who had actually participated in the battle for Java left at this time\
    \ and a new contingent appeared to act as the occupying force. These new soldiers\
    \ were so much like the others that we in `Batavia` scarcely noticed the change.\
    \ There were men from the economic department to run business and industry and,\
    \ of course, a large group from the `Kempei` to keep order. Though I never heard\
    \ how many soldiers there were in this new occupation force, I should judge that\
    \ there were several thousand in `Batavia` alone.\n\nLife went on just as it had\
    \ in recent weeks, though now the Japs began to bring some organization into their\
    \ rule. They had tried to impress on everyone the fact that they had come to Java\
    \ to stay, and, though neither the natives or whites believed this, the Japs went\
    \ busily to work to implant themselves in the Indies.\n\nAs part of their effort\
    \ to eradicate all Dutch influence from Java, they closed all the schools, both\
    \ native and European. After some time they reopened the elementary schools only,\
    \ with a new educational system for the natives. The Dutch language was forbidden\
    \ in the schools; all the teachers had to conduct their classes in Malayan or\
    \ Japanese. Since none of the instructors spoke Japanese, they were given a quick\
    \ course in the language to prepare themselves for the new order. European teachers,\
    \ whether Dutch or any other white race, were thrown out of the schools entirely.\
    \ The schools were to be run for the exclusive benefit of the Indonesians, for\
    \ the Japs had learned the obvious lesson that the most effective way to spread\
    \ their doctrines was through the children. If a child was taught nothing but\
    \ what the Japs wanted him to know, he would grow up a model member of a subject\
    \ race.\n\nTeaching the Japanese language was not only confined to the schools.\
    \ Instructors appeared everywhere, even on street corners, and set up shop. Whether\
    \ anyone listened to them or not, they went right ahead propounding the rules\
    \ of Japanese grammar. The newspapers announced that everyone must make himself\
    \ familiar with Japanese, for “This will be the future language of the world.”\
    \ \n\nAll letter writing was banned and the only postal communication allowed\
    \ was by postcard—easy for the censors to read. These cards had to be written\
    \ in Malayan or Japanese, for, as I have said, the Dutch language “no longer existed,”\
    \ according to the Japs. Occasionally, as a special treat, civilians were allowed\
    \ to send packages of food and clothing to their relatives in the internment camps.\
