    # 第十五章

    '
- fmt: '

    WE set up the little charcoal stove on deck and heaped coals under the grate.
    The ten gallons of gasoline that William had brought from Bandung came in handy
    as a quick method of getting the fire alight. Soon we had a hot bed of coals and
    a small saucepan of rice simmering over the grate.


    “Bust out a can of that corned beef,” I suggested. “It’s almost time to congratulate
    ourselves. By sundown we’ll be out of sight of any Jap patrol.”


    “What makes you so sure of that?” asked Dirk, getting busy with the `can opener`.
    “Since we didn’t see any in the strait, they may be hanging around to the south
    of us.”


    “What for?” I demanded. “They’ve seen to it that all the sailing ships have been
    scuttled in Java—that is,” I added with a grin, “all but this one. They wouldn’t
    have any need to patrol out of range of a prahu. No, you can count on our being
    safe once we get out in the ocean.”


    “Wonder what we’d do if we did sight a Jap ship or plane?” asked William thoughtfully.
    “What could we do to make the boat look harmless?”


    “First thing I’d do,” I replied instantly, “would be to lower sail and turn the
    bow toward shore. The Japs would think we were headed for Java and probably not
    bother us. Or they might think we were a derelict ship and leave us alone anyway.”


    We speculated on possible means of fooling the Japs, in case we were spotted,
    but it was more of a conversational exercise than a serious problem. My confidence
    had given William and Dirk a greater sense of security and they began to feel
    better. The rice and corned beef, washed down with a little water, gave us a lift
    and we were in high spirits all that day. By late afternoon we had left the strait
    behind us and were well out in the Indian Ocean, still driven along by the light
    easterly breeze.


    Now we must depend on the publicity map of the Indian Ocean, for we had gone beyond
    the area shown on the chart of the strait. Fortunately the map was fairly accurate,
    but it was no navigator’s dream at that. I marked our position on the map, getting
    it quite accurately, as we were still within sight of Prince’s Island, at the
    southern end of the strait. I planned to take a sight with the `chronometer` and
    `sextant` the next day, but for now that was not necessary.


    We decided that we must limit ourselves to two meals a day, morning and evening,
    for our stores were none too plentiful. The water situation was even more ticklish.
    We had fifty gallons aboard and I had no real idea of how long it would take us
    to reach Rodriguez. With luck and a good wind, we might hit it in a couple of
    weeks, but if things went against us, it might take two or three times as long.


    “We’ll have to plan on using only a gallon of water a day for the three of us,”
    I announced at suppertime. “It’s going to be tough, but we don’t dare allow ourselves
    any more than that.”


    “Lord, I hope it doesn’t get any hotter,” said Dirk, when he had digested the
    fact that this would allow each of us only a little more than a quart a day for
    cooking and drinking. “It’s fit to broil an ox right now.”


    He was right about that. The tropical sun had beat down on us with terrific force
    all day, making the deck little better than a sizzling frying pan. Even now, with
    the sun sinking, it was desperately hot.


    “Wait until the sun goes down and you’ll be cold,” I told them. I had sailed these
    tropic seas enough to know that the contrast between night and day often sets
    one shivering at night after suffering the agonies of the damned all day. They
    discovered the truth of my prophecy before long and, when darkness overtook us,
    we were glad to put on sweaters.


    The wind still kept its leisurely easterly direction, but it was enough to keep
    us going when I crowded all the sail aloft. Much of this work I had to do alone,
    for neither William nor Dirk knew the first thing about a ship. They were willing
    and eager to learn and were useful in hauling rope and setting canvas. But the
    main responsibility was mine. I was willing to have it this way, for I was captain
    of the boat and the other two my crew, albeit an untrained one. Until I could
    trust them for even so much as handling the `helm` without my guidance, I had
    to be everywhere at once on the `cutter`.


    I stayed on deck all night, telling the others to get some sleep in the cabin.
    The breeze held, but it was dishearteningly fitful and light. At 4 a.m. on the
    ninth, it died away entirely and we were left sitting on the sea in a dead calm.
    A heavy swell showed that there was plenty of wind in other parts of the ocean,
    but it didn’t come near us. The southeasterly trade wind that I had been hoping
    to strike about now refused to blow and I began to think we weren’t so lucky after
    all.


    At sunrise we were still becalmed, bobbing and swaying about in the swell like
    a cork. William and Dirk weren’t any too comfortable in that swell, but a breakfast
    of rice and beef made them feel for a while that life was worth living. We weren’t
    too well stocked with coal, so I worked out a plan which would make it necessary
    to light the fire only Once a day.


    “We’ll cook enough rice to last us all day,” I explained. “One hot meal a day
    is enough anyway and we can go on cold rations at night. Dirk, how would you like
    to be cook?”


    There were several reasons why I suggested this to him, the principal one being
    that he was not as handy as William about the boat and couldn’t seem to get the
    knack of raising or reefing sail with the speed that might be required if we got
    a strong blow. He was anxious to do his part, however, so I decided that he could
    handle the cooking and cabin work.


    “Well, anyway,” I said some time later, when we were still heaving up and down
    in the swell but not making any forward motion, “we got through the strait. Let’s
    open a can of that fruit to celebrate.”


    I wanted to keep their spirits up at all costs and the fruit helped some. It tasted
    like ambrosia, after our diet of rice and corned beef. Work also helps morale,
    so I kept all of us busy that morning rigging a blanket to act as an awning over
    the cockpit. This would protect us from the sun and we needed something for shelter
    from its burning fire. By the time the awning was up, we were all dripping with
    sweat. We took turns going overside to cool off in the ocean, but the water was
    soupy warm under the midday sun. Once on deck again we were as hot as we had been
    before our swim.


    By noon on the ninth we had drifted out of sight of land and now there was nothing
    to be seen on our horizon but a heaving mass of rolling sea. It made William and
    Dirk pretty uncomfortable to view this monotonous seascape.


    “What makes the boat roll so much?” asked Dirk, evidently wishing that his stomach
    didn’t follow the ship. “Wait until we get a breeze,” I told him. “You won’t notice
    it so much. Guess I’ll take a sight, so I can check our position from my dead
    reckoning.” I set up the `sextant` on deck and, after a good deal of fiddling
    around, managed to get the angle of the sun in relation to the horizon. Our position
    was Latitude 44 40 S, Longitude 104 45 E. We were about a hundred miles from the
    north mouth of the strait and had covered forty miles. Not bad considering we
    had been becalmed for the past eight hours, but I hoped a better run in the future.


    Shortly after noon a light easterly breeze sprang up again that carried us along
    about two or three knots with sails aloft. Later some rain squalls served the
    double purpose of cooling us off and speeding us up to about six knots. But the
    winds were squally and we were kept on changing sails and trying to set them so
    as to get the most out of the wind. That night, after a cold supper, we arranged
    our watches. We planned to stand two-hour periods on duty and four off, when we
    hoped to get some sleep in the cabin. In case of bad weather we were to take one
    on and two off. I took the first watch eight in the evening and sent the other
    below for rest. All that day I had been instructing William and Dirk in the art
    of keeping the boat on course and felt fairly confident they could handle her,
    unless an unusual blow came up. But as it turned out, I seldom got sleep during
    my periods off. William followed me at the `helm` at ten in the evening and I
    went below, tired as a dog. I didn’t sleep. Every slap of a wave against the prow
    seemed to sound a warning, the rattle of the stays and creak of the ropes meant
    something to me. I lay on the bunk fearing every moment that something would go
    wrong.


    “If you leave the helm, even for a second without calling for someone to relieve
    you, you’ll find yourselves in trouble,” I said. “A wave or lurch of the boat
    might knock you overboard and you’d never know.” I had drummed into them so hard
    that they both kept a tight grip on the `helm` whenever they were on watch. They
    were so new at sailing that every time the canvas flapped, they’d sing out to
    me to tell them what to do. They still hadn’t gotten the knack of keeping the
    ship close to the wind and when they were at the `helm` we didn’t get as much
    out as we might. The wind was variable all night, unless a rain squall shoved
    us along about six knots. After midnight a heavy rain fell and we collected a
    couple of gallons from the water that dripped off the sails. By daybreak we’d
    refilled the tank again and began to feel that water shortage wasn’t going to
    be our big worry after all.


    We were still being knocked around by nothing more than occasional squalls. By
    daybreak on the tenth we were wallowing around the same rolling sea, making little
    or no headway. The rain served one good purpose in cooling us off and not making
    us thirsty, but I’d have sacrificed this advantage for a good southeast. Dirk
    cooked some potatoes for breakfast in seawater, a culinary stroke of genius that
    saved our water and really improved their taste. We were all rather dispirited
    at our lack of progress, for it didn’t take an experienced seaman to realize we’d
    gotten just about nowhere in the past twenty-four hours. Our noon position showed
    Latitude 47 30 S, Longitude 103 28 E, a run of forty-eight miles since the previous
    reckoning. We’d have to do better than that or we’d be hanging around too near
    Java and the Japs for comfort. Just after taking the sight the wind died away
    completely and we were at the mercy of the rolling swell. The ship was heaving
    up and down, back and forth like a rat in a terrier’s mouth, and William and Dirk
    cursed the day they were born.


    “Why in hell those rollers don’t sweep over the boat instead of under it the way
    they do is a mystery to me,” said William, staring apathetically at a green mountain
    of water towering above us. He watched it sink away under our keel and shook his
    head disbelieving. It looked as though it would break just over our heads and
    I couldn’t blame him for wondering why it never did.


    “What gets me is how the damn boat can rock so much and not turn over,” said Dirk,
    who was clutching the freeboard with both hands. The little cutter spent much
    of its time at an angle of about forty-five degrees and to a landlubber it looked
    as though every lurch would be its last.


    “Well, you can thank your stars she’s as seaworthy as she is,” I said defensively.
    “You keep your eyes open and watch everything I do and you’ll learn all you need
    to know about this boat.”


    “All right, Captain Jenks,” exclaimed William a moment later, “what is that rope
    flapping around the mast?” He was at the wheel when he spoke and I was lounging
    halfway up the companionway staring out over the stern and wishing I could see
    something that looked like a wind approaching. I whirled around. One look was
    enough to show me that the `mainsail halyard` had broken. The rope hadn’t been
    new when we started, but I had hoped it would last longer than this. I began to
    swear, while the other two laughed. The accident gave them a good chance to get
    back at my boasting.


    “You won’t laugh so hard when we pull you up that mast in a bosn’s chair,” I told
    Dirk, as I went forward. The only extra rope we had was larger than the broken
    halyard so I had to climb the mast to fit a bigger `block` at the top. It wasn’t
    much fun shinning up the mast with the ship rolling and lurching like a drunken
    man. If I’d had an extra pair of hands, it might not have been so bad. But as
    it was I used about one and a half hands to keep myself steady and half a hand
    to do the necessary work. I felt like a flag on a pole swaying and bobbing around
    atop that mast.

    '
  raw: WE set up the little charcoal stove on deck and heaped coals under the grate.
    The ten gallons of gasoline that William had brought from Bandung came in handy
    as a quick method of getting the fire alight. Soon we had a hot bed of coals and
    a small saucepan of rice simmering over the grate.“Bust out a can of that corned
    beef,” I suggested. “It’s almost time to congratulate ourselves. By sundown we’ll
    be out of sight of any Jap patrol.”“What makes you so sure of that?” asked Dirk,
    getting busy with the can opener. “Since we didn’t see any in the strait, they
    may be hanging around to the south of us.”“What for?” I demanded. “They’ve seen
    to it that all the sailing ships have been scuttled in Java—that is,” I added
    with a grin, “all but this one. They wouldn’t have any need to patrol out of range
    of a prahu. No, you can count on our being safe once we get out in the ocean.”“Wonder
    what we’d do if we did sight a Jap ship or plane?” asked William thoughtfully.
    “What could we do to make the boat look harmless?”“First thing I’d do,” I replied
    instantly, “would be to lower sail and turn the bow toward shore. The Japs would
    think we were headed for Java and probably not bother us. Or they might think
    we were a derelict ship and leave us alone anyway.”We speculated on possible means
    of fooling the Japs, in case we were spotted, but it was more of a conversational
    exercise than a serious problem. My confidence had given William and Dirk a greater
    sense of security and they began to feel better. The rice and corned beef, washed
    down with a little water, gave us a lift and we were in high spirits all that
    day. By late afternoon we had left the strait behind us and were well out in the
    Indian Ocean, still driven along by the light easterly breeze.Now we must depend
    on the publicity map of the Indian Ocean, for we had gone beyond the area shown
    on the chart of the strait. Fortunately the map was fairly accurate, but it was
    no navigator’s dream at that. I marked our position on the map, getting it quite
    accurately, as we were still within sight of Prince’s Island, at the southern
    end of the strait. I planned to take a sight with the chronometer and sextant
    the next day, but for now that was not necessary.We decided that we must limit
    ourselves to two meals a day, morning and evening, for our stores were none too
    plentiful. The water situation was even more ticklish. We had fifty gallons aboard
    and I had no real idea of how long it would take us to reach Rodriguez. With luck
    and a good wind, we might hit it in a couple of weeks, but if things went against
    us, it might take two or three times as long.“We’ll have to plan on using only
    a gallon of water a day for the three of us,” I announced at suppertime. “It’s
    going to be tough, but we don’t dare allow ourselves any more than that.”“Lord,
    I hope it doesn’t get any hotter,” said Dirk, when he had digested the fact that
    this would allow each of us only a little more than a quart a day for cooking
    and drinking. “It’s fit to broil an ox right now.”He was right about that. The
    tropical sun had beat down on us with terrific force all day, making the deck
    little better than a sizzling frying pan. Even now, with the sun sinking, it was
    desperately hot.“Wait until the sun goes down and you’ll be cold,” I told them.
    I had sailed these tropic seas enough to know that the contrast between night
    and day often sets one shivering at night after suffering the agonies of the damned
    all day. They discovered the truth of my prophecy before long and, when darkness
    overtook us, we were glad to put on sweaters.The wind still kept its leisurely
    easterly direction, but it was enough to keep us going when I crowded all the
    sail aloft. Much of this work I had to do alone, for neither William nor Dirk
    knew the first thing about a ship. They were willing and eager to learn and were
    useful in hauling rope and setting canvas. But the main responsibility was mine.
    I was willing to have it this way, for I was captain of the boat and the other
    two my crew, albeit an untrained one. Until I could trust them for even so much
    as handling the helm without my guidance, I had to be everywhere at once on the
    cutter.I stayed on deck all night, telling the others to get some sleep in the
    cabin. The breeze held, but it was dishearteningly fitful and light. At 4 a.m.
    on the ninth, it died away entirely and we were left sitting on the sea in a dead
    calm. A heavy swell showed that there was plenty of wind in other parts of the
    ocean, but it didn’t come near us. The southeasterly trade wind that I had been
    hoping to strike about now refused to blow and I began to think we weren’t so
    lucky after all.At sunrise we were still becalmed, bobbing and swaying about in
    the swell like a cork. William and Dirk weren’t any too comfortable in that swell,
    but a breakfast of rice and beef made them feel for a while that life was worth
    living. We weren’t too well stocked with coal, so I worked out a plan which would
    make it necessary to light the fire only Once a day.“We’ll cook enough rice to
    last us all day,” I explained. “One hot meal a day is enough anyway and we can
    go on cold rations at night. Dirk, how would you like to be cook?”There were several
    reasons why I suggested this to him, the principal one being that he was not as
    handy as William about the boat and couldn’t seem to get the knack of raising
    or reefing sail with the speed that might be required if we got a strong blow.
    He was anxious to do his part, however, so I decided that he could handle the
    cooking and cabin work.“Well, anyway,” I said some time later, when we were still
    heaving up and down in the swell but not making any forward motion, “we got through
    the strait. Let’s open a can of that fruit to celebrate.”I wanted to keep their
    spirits up at all costs and the fruit helped some. It tasted like ambrosia, after
    our diet of rice and corned beef. Work also helps morale, so I kept all of us
    busy that morning rigging a blanket to act as an awning over the cockpit. This
    would protect us from the sun and we needed something for shelter from its burning
    fire. By the time the awning was up, we were all dripping with sweat. We took
    turns going overside to cool off in the ocean, but the water was soupy warm under
    the midday sun. Once on deck again we were as hot as we had been before our swim.By
    noon on the ninth we had drifted out of sight of land and now there was nothing
    to be seen on our horizon but a heaving mass of rolling sea. It made William and
    Dirk pretty uncomfortable to view this monotonous seascape, even though it meant
    that we were out of all possible range of Jap patrols.“What makes the boat roll
    so much?” asked Dirk, evidently wishing that his stomach didn’t follow the ship’s
    motions quite so accurately.“Wait until we get a breeze,” I told him. “You won’t
    notice it so much. Guess I’ll take a sight, so I can check our position from my
    last dead reckoning.”I set up the sextant on deck and, after a good deal of fiddling
    around, managed to get the angle of the sun in relation to the horizon. It’s no
    joke to get a sight in a small boat that is heaving and rocking in a heavy swell,
    but I managed what I hoped was a fairly accurate reckoning. Our position was Latitude
    6 44 40 S, Longitude 104 12 45 E. We were about a hundred miles from the north
    mouth of the strait where we had left the Java Sea and had covered forty miles
    that day. Not bad considering we had been becalmed for the past eight hours, but
    I hoped we’d average a better daily run in the future.Shortly after noon a light
    easterly breeze sprang up again that carried us along at about two or three knots
    with all sails aloft. Later some rain squalls served the double purpose of cooling
    us off and speeding us up to about six knots. But the winds were squally and we
    were kept on the jump changing sails and trying to set them so as to get the most
    out of the chancey wind.That night, after a cold supper, we arranged our watches.
    We planned to stand two-hour periods on duty and four off, when we hoped to get
    some sleep in the cabin. In case of bad weather we were to take one on and two
    off. I took the first watch at eight in the evening and sent the other two below
    for a rest.All that day I had been instructing William and Dirk in the art of
    keeping the boat on its course and felt fairly confident that they could handle
    her, unless an unusual blow came up. But as it turned out, I seldom got much sleep
    during my periods off duty. William followed me at the helm at ten in the evening
    and I went below, tired as a dog. But I couldn’t sleep. Every slap of a wave against
    the prow seemed to sound a warning, the rattle of the stays and creak of the ropes
    and sail all meant something to me. I lay on the bunk listening to the ship breathe,
    fearing every moment that something would go wrong.I had impressed upon both William
    and Dirk the importance of never leaving the helm to go forward to shift sail.“If
    you leave the helm, even for a second, without calling for someone to relieve
    you, you’ll find yourselves in trouble,” I said. “A wave or a lurch of the boat
    might knock you overboard and we’d never know you were gone. Don’t forget that.”I’d
    drummed this into them so hard that they both kept a tight grip on the helm whenever
    they were on watch. They were so new at sailing that every time the canvas flapped,
    they’d sing out to me to come and tell them what to do. They still hadn’t gotten
    the knack of keeping the ship close to the wind and when they were at the helm
    we didn’t get as much out of the wind as we might have.The wind was variable all
    night, never strong unless a rain squall shoved us along at about six knots. After
    midnight a heavy rain fell and we collected a couple of gallons from the water
    that dripped off the sails. By daybreak we’d refilled the tank again and began
    to feel that a water shortage wasn’t going to be our big worry after all. It was
    the wind that really bothered me. I’d hoped to hit the southeast trades before
    now and here we were still being knocked around by nothing more than occasional
    rain squalls.By daybreak on the tenth we were wallowing around in the same rolling
    sea, making little or no headway. The rain served one good purpose in cooling
    us off and not making us so thirsty, but I’d have sacrificed this advantage for
    a good stiff southeaster.Dirk cooked some potatoes for breakfast in seawater,
    a culinary stroke of genius that saved our water and really improved their taste.
    We were all rather dispirited at our lack of progress, for it didn’t take an experienced
    seaman to realize that we’d gotten just about nowhere in the past twenty-four
    hours. Our noon position showed Latitude 6 47 30 S, Longitude 103 28 15 E, a run
    of forty-eight miles since the previous reckoning. We’d have to do better than
    that or we’d be hanging around too near Java and the Japs for comfort.Just after
    taking the sight the wind died away completely and we were at the mercy of the
    rolling swell. The ship was heaving up and down, back and forth like a rat in
    a terrier’s mouth, and William and Dirk cursed the day they were born.“Why in
    hell those rollers don’t sweep over the boat instead of under it the way they
    do is a mystery to me,” said William, staring apathetically at a green mountain
    of water towering above us. He watched it sink away under our keel and shook his
    head disbelievingly. It had looked as though it would break just over our heads
    and I couldn’t blame him for wondering why it never did.“What gets me is how the
    damn boat can rock so much and not turn over,” said Dirk, who was clutching the
    freeboard with both hands. The little cutter spent much of its time at an angle
    of about forty-five degrees and to a landlubber it looked as though every lurch
    would be its last.“Well, you can thank your stars she’s as seaworthy as she is,”
    I said defensively. “You keep your eyes open and watch everything I do and you’ll
    learn all you need to know about this boat.”“All right, Captain Jenks,” exclaimed
    William a moment later, “what is that rope doing flapping around the mast?” He
    was at the wheel when he spoke and I was lounging halfway up the companionway
    staring out over the stern and wishing I could see something that looked like
    a wind approaching.I whirled around. One look was enough to show me that the mainsail
    halyard had broken. The rope hadn’t been new when we started, but I had hoped
    it would last longer than this. I began to swear, while the other two laughed.
    The accident gave them a good chance to get back at my boasting.“You won’t laugh
    so hard when we pull you up that mast in a bos’n’s chair,” I told Dirk, as I went
    forward.The only extra rope we had was larger than the broken halyard so I had
    to climb the mast to fit a bigger block at the top. It wasn’t much fun shinning
    up the mast with the ship rolling and lurching like a drunken man. If I’d had
    an extra pair of hands, it might not have been so bad. But as it was I used about
    one and a half hands to keep myself steady and half a hand to do the necessary
    work. I felt like a flag on a pole swaying and bobbing around atop that mast and
    every minute I was certain that I’d lose my grip. It took me about five times
    as long to fit the new block as it would under ordinary circumstances. It was
    secure at last however, and William and I hauled Dirk, the lightest of the three,
    up in the bos’n’s chair to run the new rope through the block. He didn’t like
    his trip aloft one bit and looked pretty green when we finally lowered him to
    the deck again. It had been a risky business, but the new halyard was in place.“Hadn’t
    we ought to reef sail a little?” asked William, when we were once more established
    in the cockpit. “They’re taking a hell of a beating from the swell and aren’t
    getting us forward at all.”I’d already considered this point and had debated in
    my mind the advantage that might be gained from the fitful squally winds by keeping
    all sails set. Certainly they were taking a lot of punishment from the lurching
    rock and sway of the swell, but I decided that it was better to keep them up and
    try to make headway.“The only thing that worries me is that they aren’t any too
    strong,” I explained. “We’ll be patching sail before long, but I’d rather do that
    than sacrifice any wind we might get.” All that afternoon we were becalmed, at
    the mercy of an occasional rain squall which sent us forward for a few minutes
    and then left us to the rolling swell. To help pass the time, we got out the revolvers
    and practiced shooting at the sea snakes that rode the surface of the waves some
    distance from the boat. We weren’t Annie Oakleys by any means, for we didn’t hit
    a one. But the sport took our minds off our troubles and gave us something to
    do besides grouse at our hard luck. Just as we put the revolvers away a shark
    nosed up out of the water not twenty feet from the stern and gave us a mean going
    over with his piglike little eyes. We comforted ourselves for our previous bad
    shooting by thinking that we’d surely have gotten him if only our guns had been
    handy.I had been heading the ship due southwest and west southwest in hopes of
    picking up the trade, but by the morning of the eleventh we were still just about
    where we had been the evening before. But we found something to occupy us, in
    spite of the lack of wind. As I had feared, the sails, none of them in first-class
    condition to begin with, began to show the effects of the pounding they were getting
    from the ship’s uneven motion. Right after breakfast I reefed in the mainsail,
    for it was showing several spots that needed patching. I showed William and Dirk
    how to make a patch, but it wasn’t easy work sewing with darning needles and cord
    on that unwieldy canvas. We had plenty of time to do the work, however, and by
    noon, still in a dead calm, we had the sails repaired.I got the noon sight, Latitude
    7 10 S, Longitude 103 20 E, showing a discouraging day’s run of twenty-eight miles,
    just before the sky clouded over. The clouds brought the wind, however, and it
    began to look as though we had hit the southeast trades at last. Our spirits rose
    with the wind and by suppertime we were feeling fairly jubilant. We were hitting
    about six knots now and, if our luck held, we ought to average sixty miles per
    day.At eleven that night I came on deck, though it wasn’t my turn at the helm,
    just to see how William was getting along. I found him staring out off our starboard
    quarter, looking as though he were seeing a whole troupe of ghosts.“What’s the
    matter?” I asked impatiently, for he was neglecting the ship entirely.He pointed
    and, following the direction he indicated, I saw two huge ships, lighted up like
    Christmas trees, passing to windward.
