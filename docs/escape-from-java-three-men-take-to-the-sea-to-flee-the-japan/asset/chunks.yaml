    cold at sea. None of us so much as had a sniffle the whole time we were in the
    boat.By the next morning we were well clear of Cocos Island and I set a straight
    course for Mauritius, a larger island just west of Rodriguez. We would strike
    Rodriguez first, but I made Mauritius our objective for purposes of navigation.
    My map showed it to be 3020 miles from Batavia, one hell of a long way from where
    we were now.“Why don’t we head for Diego Garcia?” asked William, who had been
    studying the map. “It’s just west of us and about half the distance to Rodriguez.”
    He indicated the tiny island lying about a thousand miles due west of our position.“I
    thought of that,” I explained, “before we left Batavia. There are several reasons
    why it isn’t such a good idea. In the first place it’s entirely surrounded by
    reefs and shoals and, without a chart of the area, we’d be fools to risk trying
    for a landing there. Then Diego Garcia is about as flat as a pancake and we could
    sail right by it in a heavy swell like this and never spot it at all. Rodriguez
    is mostly rocks and hills and we can’t miss it once we get within sight of it.”“It’s
    too near the Jap sea lanes, too, I suppose,” said William, after studying its
    position more closely. “Right smack below Ceylon and the Japs are hanging around
    there like flies.”I nodded. “It’s best to steer clear of any place the Japs have
    their eyes on. No, I think we’ll be better off heading for Rodriguez. It’ll take
    longer, but, if we keep up this speed, we’ll make it all right.”All that night
    the ship rolled so heavily in the tremendous swells set up by the trade winds
    that none of us could stay in our bunks. We’d taken on so much spray that the
    decks began to leak, too, and a lot of water seeped down into the cabin. If we
    did try to sleep, a couple of drops of water would land on our faces and wake
    us up with a jerk. But we didn’t mind any discomfort as long as we realized we
    were making such headway.Cooking next morning was a gymnastic exercise. The boat
    was pitching and tossing so much that two of us had to hold the stove, the saucepan,
    and the coals in place to get the food cooked. It wasn’t much of a meal when it
    was ready, but better than cold rations at least.The mainsail began to show a
    tear near the mast later in the morning and I reefed it in a bit to keep it from
    growing bigger. We were pitching around too much to make patching a very easy
    job at the moment and besides we made plenty of headway, even with a reef in the
    sail. I put the jib back on again, however, in spite of its worn condition, to
    feed more wind on the mainsail. It wouldn’t last long, but I thought we might
    get what good we could out of it before it tore itself to pieces in the wind.Our
    noon position on the fourteenth showed Latitude 9 16 55 S, Longitude 97 39 30
    E, a run of 145 miles. The best we’d done so far, but the wind would have carried
    us along even without a sail at the rate it was blowing. I began to wish it wouldn’t
    blow quite so hard, an odd wish for a seaman, but, considering the condition of
    our sails, an understandable one. We carried some spare canvas and an extra mainsail,
    but it would have to be recut to fit our mast and I hoped that the one we had
    would last the voyage.By the time my watch ended at ten that evening, the wind
    was roaring overhead like a herd of angry bulls. The sails were straining at their
    ropes, as though anxious to get away, and a soaking spray kept the cockpit half
    awash. Someone had to pump all the time to keep it from filling entirely. We were
    making good time and nothing serious had happened to make me feel anxious, but
    I was just the same.“Watch her,” I told Dirk, when he came up out of the cabin,
    rubbing his eyes and yawning. “Keep her headed into the wind and for God’s sake
    don’t let the mainsail jibe.”He seemed annoyed at my advice, as well he might
    have been, and I lingered for a time on deck to study the sky. It was beginning
    to cloud over a bit; dark masses were rolling up along the horizon and I wondered
    if the storm would hit us. William came on deck to help with the pumping and I
    decided to go below to try to snatch a little sleep. I’d been up most of the previous
    night and knew I was getting too tired to be as alert as I should be.“Get along,
    grandma,” said William laughing, as I went down the companionway. “We’ll watch
    the baby for you.” I didn’t tell them that I was afraid we were in for a storm.
    No use to worry them and I would be on deck again before it hit us, if it was
    going to. I threw myself across the bunk and, in spite of a persistent trickle
    of water running down my neck from the deck above, fell into a deep sleep.It was
    a crash and a wild yell from Dirk that wakened me. I was on deck before I was
    fully awake. What I saw there made me forget there was such a thing as sleep.
    The cutter was pitching wildly in a massive heaving sea, its mast broken short
    and lying off the starboard quarter in a soaking tangle of ropes, spars and sail.
    A great wave washed over us, almost filling the cockpit, and the boat swung helpless
    in the trough of the sea.
