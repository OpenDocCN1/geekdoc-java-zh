    # 第十八章章

    '
- fmt: '

    BUT the next morning I forgot all about putting a bullet through my head. I’d
    finished cutting down the mast and the rain stopped. The sun couldn’t get through
    the heavy curtain of clouds hanging just over our heads, but the whole outlook
    began to seem brighter. I doled out the last three chocolate bars for breakfast
    and looked at the finished mast with some complacency. “We’ll get it up all right,”
    I said confidently. “Come on, you two, let’s get going.”


    Perhaps encouraged by my certainty, William and Dirk set their shoulders to the
    job with a will. Even to my surprise, we got the mast upright on the first try,
    a pretty amazing job considering the fact that we had to work with one hand and
    hang on to the boat with the other. The butt end fitted into the hinge as though
    it were tailored for it. Half an hour later, we all sat back in the cockpit and
    stared up at that twelve-foot length of wood rising over our heads as though it
    were Jack’s beanstalk grown there overnight. To us it was just as miraculous as
    that. It meant the difference between safety and wreck, life and death.


    “I better give that hinge another turn with the screwdriver,” I said, after several
    minutes’ silent enjoyment of the spectacle. “Want to be sure it’s tight.” I stepped
    forward feeling suddenly so sure of myself and my own powers that I ignored the
    heave and roll of the boat entirely, trying to balance myself on my feet alone.
    My carelessness almost proved my finish. I had just reached the foot of the mast
    when a wave slapped the side of the boat with a sound like a cannon shot. The
    cutter gave a lurch and a second later I was overboard, several feet below the
    surface, blinded by the impact of the water.


    When I fought my way up to the air, I found myself staring into the horrified
    faces of William and Dirk, who had rushed to the side to help me. But their willing
    hands stretched toward me weren’t necessary. I’d surfaced just beside the stern
    and a moment later had hauled myself back into the boat, a soggier and wiser man.


    “Good God, what happened?” cried Dirk, still staring at me as though I had risen
    out of the waves like the old man of the sea.


    “What’s the matter? Scared?” I asked, grinning at his terror-stricken face. “Thought
    you’d lost your navigator?”


    “Yeah, well, what would have happened if you’d pegged out?” he demanded. “William
    and I would have been in one hell of a fix.”


    “So would I,” I replied. “I’d be dead. All you two would have to do is sail west.
    You couldn’t miss hitting the coast of Africa.”


    But the idea of sailing the cutter without my help didn’t seem to amuse them very
    much and they kept a wary eye on me from then on. Every time I went forward they’d
    watch me like a couple of mother hens, and I began to wonder whether they were
    more worried about me as a navigator or a friend.


    As though to celebrate our getting the mast up, the sun broke through the clouds
    shortly after noon, and I got a chance to take a sight, before it ducked behind
    the mist again. Our position showed `Latitude 10 41 45 S`, `Longitude 92 28 45
    E`, which meant that we had covered more than three hundred miles since July fourteenth,
    averaging about sixty miles a day. Not bad considering we were using a blanket
    for a sail, and we had been going in the right direction all the time, too. It
    proved the strength of the wind and, in spite of the headaches that wind had given
    us in the past few days, we all felt grateful to it now we knew what it had done
    for us.


    That afternoon I cut a jib from some of our spare canvas, a patchwork job that
    looked like a bedsheet on a pole, but it worked. I rigged it to help us get the
    most out of the wind, while I began the tedious process of recutting the mainsail
    for the second time. The wind still kept up a good fresh blow, but now with the
    jib to help us, it was easier for the helmsman to keep her headed up. The boat
    rocked less, but still enough to make us wonder what it would be like not to feel
    as though we were living in a washing machine. The rain came on again that afternoon,
    but it had lost much of its power to dampen us. Everything aboard, including ourselves,
    was so waterlogged that a little more rain only meant an extra few minutes at
    the pump.


    Feeling that we needed something to warm us up on the inside at least, we cooked
    some rice that evening, a precarious business with the stove slithering around
    the cockpit and hot coals flying out in all directions. But we got some rice half
    cooked and all felt a lot better for the center of warmth it created where it
    would do the most good.


    The next morning the wind veered around to north northwest, which sent us along
    toward the southeast in the wrong direction. We hadn’t sail enough to tack and
    we had to sit by and watch ourselves being shoved off our course at a good rate
    of five or six knots. But the wind sent the clouds flying before it and just before
    noon the sun came out in the first real blaze of heat we had felt for days. We
    rushed everything on deck—blankets, clothes, and canvas—to dry in the blessed
    warmth. The heat felt like a benediction on our backs and with the dry wind to
    help we were soon dried out.


    I got another sight that day that showed we had made seventy-five miles since
    the previous noon—seventy-five miles in the wrong direction, however. But I couldn’t
    worry about that. I knew we’d hit the southeast trades as soon as the last tag
    ends of the storm had blown away. It was enough to be thankful we’d come through
    that hell alive, without complaining about an adverse wind. I got to work on the
    mainsail and showed Dirk how to sew canvas. By the next morning, July twenty-first,
    we had it finished, the weirdest sail ever seen on any ocean. It was a long, awkward
    affair that would make a honest seaman blink, but it had the virtue of working.


