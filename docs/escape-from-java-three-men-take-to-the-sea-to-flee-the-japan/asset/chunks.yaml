    had given us a taste of what Admiral Byrd went through. Even with dry blankets
    again, we’d all felt pretty chilly.In the evening we hit them, the welcome southeast
    trade winds. They blew on us like a benediction, sending us west on our course
    toward Rodriguez, some 1600 miles away. We’d covered almost half the voyage, lived
    through a storm and near wreck and now were on our way once more. We began to
    enjoy life. The routine of life aboard a small boat began again as though it had
    never been interrupted. We organized our watches on the old schedule, got a full
    quota of sleep, and ate a morning and evening meal.William and Dirk had begun
    to get the feel of the helm and now I didn’t have to worry so much when they were
    on watch. All shifting of sail was up to me, however, and I was kept too busy
    to have time for any idle contemplation of the “boundless sea” that the poets
    like to think about. As I’ve said before, I don’t believe I thought about anything
    beyond the deck of that cutter the whole time I was at sea. There is always something
    to be done on a small ship and I, as skipper, had my hands full. We spent more
    time talking, though; making plans for what we should do when we hit Rodriguez
    and speculating on our reception by the British there. We knew they’d probably
    confiscate our boat and wait for instructions from the Netherlands government
    before letting us go on. All of us had but one idea in mind; to join the Netherlands
    Army and fight the Japs. It didn’t matter to us what happened as long as we were
    allowed to do that.Three days later on July twenty-fifth we’d covered 315 miles,
    all of them toward Rodriguez. An average run of a hundred miles a day wasn’t bad,
    considering the state of our sails. They’d begun to give me a lot of trouble;
    the canvas was old and my sailmaking with darning needles and cord was of necessity
    a patchwork job. I spent most of the time during those three days mending the
    tears and worn spots, hoping the threadbare canvas would hold out until we reached
    our goal.But I was out of luck as far as the sails were concerned. Another three
    days of wind, which averaged us the same hundred miles per day, was too much for
    them. I had to begin work on another set of sails. It was now the twenty-eighth
    of July and we’d been at sea three weeks, most of the time with nothing to look
    at but an endless expanse of heaving sea, a bowl-like sky overhead, and the narrow
    confines of the cutter near at hand. The nights were getting colder, but now our
    thin tropical blood was getting used to them and the bracing air really made us
    feel a lot better. We were all tanned to a mahogany brown and fit as the proverbial
    fiddles. The trip, except for the four days of storm and near disaster, was turning
    out to be quite a pleasure voyage.I didn’t mind the work I had to do on the new
    sails, as it gave me something to relieve the monotony of the long days. William
    and Dirk weren’t as fortunate, for, except for their turns at the helm, they had
    nothing to do, but wish for a change of scene. As I look back on it, it’s a wonder
    none of us got into a quarrel. Three men cooped up on a twenty-five-foot cutter
    with nothing but each other’s faces to look at are apt to get a little touchy.
    But we were all keyed up by the immensity of our adventure and the knowledge that,
    if we succeeded in it, we would have a real job to do—fighting Japs. All of us
    are pretty easy-going anyway, not given to “nerves” or petty bickering, and we
    got along with very few harsh words. As skipper I had the authority to step on
    any incipient quarrels, and, as soon as I saw one brewing among us, I shut it
    up in a hurry. The only thing that “got” us was the dreary sameness of our food
    and the scarcity of water. But there was no one to blame this on and it didn’t
    cause any more trouble than a good deal of vehement grousing.“Let’s open another
    can of fruit,” suggested Dirk on the evening of the twenty-ninth. “You say we
    just passed the eightieth meridian, so let’s celebrate it.”“Suits me,” I replied,
    willing to find any cause for celebration. “What I’ll really feel glad about is
    the day I take the last stitch in these lousy sails.”“How are they coming?” asked
    William, who was at the helm. “I should—Hey!”His exclamation made us all start
    and we looked up to see him pointing toward the setting sun as though he had sighted
    land at the very least. It was a rainbow or rather a pair of them, fitting into
    each other in two perfectly semi-circular curves, brilliant and clearly outlined
    against the western sky. None of us said anything, but we all took the rainbows
    as good omens. They arched just over the spot toward which we were headed and
    seemed to form a gateway on our course. We were enormously cheered by the sight,
    and even the drenching rain squall which followed as the rainbows disappeared
    could not quench our good spirits.But during the night the rain increased and
    with it the wind. By morning the mainsail was in ribbons, much too far gone for
    repair. We got it down and sailed the rest of the day with the jib alone, while
    I redoubled my efforts to finish the new sail. It was ready that evening and hoisted
    after a tough hour’s work. William and Dirk had never had to rig a new sail before,
    but it was blowing too hard for me to do it alone, so I had to enlist their services.
    The new sail looked worse than the one I’d made before, but like its predecessor,
    it worked, sending us along at a good six knots.The wind increased during the
    night and by the morning of August first it was blowing so hard that a long rip
    showed along the bottom of the sail. I knew the canvas was none too strong, but
    I’d hoped it would stand up better than this.“Have to take her in to mend that
    tear,” I said resignedly. Another gust of rain hit us just then and considerably
    dampened my already low-pressure enthusiasm for the job.“Why don’t you let it
    alone?” asked Dirk. “It might not get any bigger.”I didn’t even answer him and
    began to haul in the sail. I did a patch job of mending it, for the wind was hitting
    us too hard to try to take the whole thing down again right now. We were now about
    six hundred miles due west of Rodriguez and at the rate we were going should reach
    the island in four or five days. I wasn’t going to get careless when we were so
    near our goal.The rain stopped by noon and I got a sight that showed we were Latitude
    18 41 05 S, Longitude 74 12 15 E, a run of 136 miles since the previous day. We
    were really hitting it up now with a good strong wind that would have sent us
    along at a couple of knots even without sails. It turned out to be a beautiful
    sunny day, warm and clear, a good start, we all thought, for the new month. William
    began to make a Dutch flag out of an old red hockey stocking, a white shirt, and
    a blue sport jacket.“Want to let them know who we are when we reach Rodriguez,”
    he explained, when I asked him what he was doing.“They’ll find out who we are
    soon enough,” I told him.“We won’t need a flag, but, if you want to make one,
    go ahead.”I was glad he’d found something to occupy himself with, though I knew
    a Dutch flag wasn’t necessary. When we reached Rodriguez we’d have no trouble
    identifying ourselves, and it wasn’t likely that the British there would fire
    on a small boat before they knew who we were.I spent the next three days nursing
    that mainsail. The patched tear didn’t hold, and on the night of the third the
    sail ripped from end to end along the bottom. We had to take it in, just as a
    rain squall struck us, giving us a good freezing chill to make the work all the
    harder. Without lights we had a rough time on the heeling deck and it took us
    a good half hour to get it down.Sailing under the jib alone the next day cut our
    speed down to about two knots. But we were within three hundred and fifty miles
    of Rodriguez now and we didn’t let this worry us. I cut the bottom off the mainsail,
    which shortened it considerably and made it look worse than ever, which isn’t
    saying much for it. We got it up the next morning and the noon sight showed we’d
    made ninety-two miles, just on the jib. It seemed as though nothing could stop
    us and we were all in high spirits. Now that we were getting so near Rodriguez,
    food rationing wasn’t necessary and we cooked ourselves two whopping big meals
    that day.“I’ll never look a plate of rice in the face again,” vowed Dirk that
    evening. “As for corned beef—“ He didn’t finish, but sat looking at the unappetizing
    mess on his plate with an expression that said more than words.“You’ll be eating
    white bread in Rodriguez the day after tomorrow,” I told him confidently.Both
    William and Dirk looked at me in utter disbelief. They either couldn’t believe
    the good news or thought I was talking through my hat. All around us was the same
    gray expanse of sea, the same sky and water we had looked at for four long weeks.
    The idea that we would actually reach Rodriguez in two days was too much for them
    to comprehend.“Want to bet?” I asked.
