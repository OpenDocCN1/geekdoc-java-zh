    # 第四章

    '
- fmt: '

    IT wasn’t until the next morning that I had a good look at the Jap occupation
    troops. By the time I was ready to go to work, as I had been instructed, the Jap
    soldiers were all over the city. They came by bicycle. Swarms of squat little
    men on their strange machines. They came waving tiny Japanese flags, showing their
    buck teeth in wide grins and feeling very happy. Their black eyes glinted behind
    their horn-rimmed spectacles. Within half an hour I was able to estimate that
    fifty per cent of the Japs wore glasses.


    The ordinary Jap soldier is not a prepossessing specimen of the human race. Most
    of them are bowlegged, with stunted, awkward bodies and extremely ugly faces.
    The caricatures one sees of the Japs aren’t much exaggerated. They look that way:
    runty, bespectacled, and big toothed. Many of them drag their feet when they walk,
    scuffing along as though it were too much of an effort to lift them off the ground.


    I was surprised at their lack of equipment. From the glimpse I had had of the
    invaders the night before, I supposed that every soldier would be heavily armed.
    But most of the men I saw this morning carried only small-bore rifles. About one
    in twenty-five had a machine gun.


    Their personal effects were no better. Each soldier evidently had one uniform,
    a thin, loose shirt with long sleeves, buttoned up to the neck. They wore puttees
    wrapped over their trouser legs and leather boots. Some of them had lightweight
    sun helmets, but the majority wore a brown cap with a piece of cloth hanging down
    the back to protect the neck from the sun. Without exception the soldiers smelt
    to high heaven. The cheap cotton uniforms, once a dark tan, were faded to a dirty
    gray and stank with stale sweat. Long before you saw a Jap coming, you could smell
    him.


    Their first move was to take all the government cars that were left in the city.
    Of the 150,000 troops that came through Batavia, only 30,000 stayed as an occupation
    force. The others were on their way to Bandung, so they grabbed any vehicle which
    would take them there faster.


    I pedaled along the street on my bicycle, trying to look unconcerned, but keeping
    a sharp eye on everything that went on. The stinking Japs were everywhere. I saw
    three Japs jump off their bicycles and stop a car, moving through the densely
    packed street ahead of me. They gestured with their thumbs to show the native
    driver that they wanted the car and, when he hesitated, took him by the neck and
    threw him into the street. They tied their bicycles to the back of the car, took
    branches from a near-by tree and arranged them over the top to camouflage it.
    I was to learn that this act of camouflaging the car was typical of the Jap soldiers.
    Of course, such a precaution was unnecessary, as the Japs were masters of the
    air. But they are like machines. They had been told: “Whenever you ride in a car,
    be sure to camouflage it.” So they did, without thinking whether it was necessary
    or not. But right there, I want to say that the Jap soldiers are excellently trained.
    The ones I saw had been fighting in China for four years and were the pick of
    the storm troops. They knew their job.


    I didn’t get far on my bicycle. Soon after the incident of the car, a Jap riding
    past me on his bicycle got a flat tire. Immediately he jumped to the ground and
    stopped me by wheeling his machine across my path. The soldier waved toward my
    bicycle, grinned and then pointed to his nose. For a moment I was puzzled, but
    finally his gestures, first toward my bicycle and then toward his nose, told me
    that this meant he was appropriating my machine. The motion toward his nose I
    was to see duplicated many times in the next months. It was the Jap way of indicating
    himself. “I,” he would say with a gesture to his nose, “want this or that.” A
    wise man gave it to him.


    In spite of how I felt about everything that day, I couldn’t help be amused by
    the Jap as he tried to mount my bicycle. I am over six feet tall and my bicycle
    was large. This soldier was even smaller than many of his comrades. I watched
    him try to mount into the saddle, but he couldn’t make it by the usual method.
    His legs were too short. He had to give an awkward jump to reach the seat and,
    once there, had the devil of a time balancing the machine. He finally solved the
    problem by standing up and leaning way over to one side to reach one pedal and
    then swaying back to the other side to propel the opposite one. I felt a little
    more cheerful as I watched him zigzagging a wobbly course down the street. He
    didn’t look much like a world conqueror on that bicycle.


    On the whole the occupation went smoothly. The Japs were careful to keep a crowd
    from forming and, even when some apprehensive natives got out small Jap flags
    and waved them about in hopes of pleasing the invaders, the soldiers disbanded
    them. They weren’t sure how the natives or whites were going to react to their
    coming and any kind of crowd made them nervous. But there wasn’t much resistance.
    All civilians were ordered by our government to stay at their jobs and to refrain
    from hostilities. A couple of natives got slapped by Jap soldiers when they started
    to protest the stealing of their bicycles, but most people didn’t dare object.


    When I reached my office, I was surprised to find that none of the Jap troops
    had been there. Word had gone around that the Japs had lists of all the government
    offices, the consulates, and business firms and were to take them over immediately.
    No one did much work that morning. We all felt nervous and wondered when the Japs
    would show up to occupy the office.


    We didn’t have long to wait. At noon a car carrying a Jap officer drove into the
    yard with soldiers carrying guns and bayonets riding on the running board. Accompanied
    by an armed guard, he went immediately to the head office. A few minutes later
    word came that all the employees of our division were to gather to hear a proclamation
    by the Jap officer.


    As soon as we were all collected, the officer, a nervous man with the inevitable
    spectacles, began to talk rapidly in a sort of sing-song voice. He spoke Japanese,
    so I didn’t understand a word of his speech. When he had finished, he gestured
    to one of his subordinates and this man repeated the officer’s words in careful,
    precise English. What he said in substance was that this office was being taken
    over by the Japanese Government, that all of us were to work for them now and
    to keep on with our regular duties as though nothing had changed. Acts of sabotage,
    passive resistance or any forms of insubordination would be punished by death.
    He finished by saying that anyone who did not wish to abide by this new system
    would kindly step forward and declare himself.


    The armed guards fixed their bayonets and waited. No one moved. I wondered if
    they expected anyone to announce his real feelings in the face of that barrage
    of steel.


    The English speech over, another Jap repeated the same thing in Malayan for the
    benefit of our employees. It had the same effect as the previous announcement.
    None of them was inclined to state his reaction to it by impaling himself on the
    bayonet. This formula completed, the officer sent some of his men about the building
    to paste up posters saying that the office was now the `Property of the Japanese
    Empire` and would be run for the benefit of `Greater Asiatic Prosperity`. I stayed
    to hear what else the officer had to say. The first thing he did, when the majority
    of employees had been sent back to their posts, was to draw his sword and show
    it to us. It was splashed with a brown stain from hilt to point. “Anzac,” declared
    the officer, pointing to the dried blood. He meant that the blood was of New Zealand
    and Australian soldiers he had killed in Malaya. Obviously this sword with its
    bloody stains was most treasured possession. After this display of vanity, the
    officer got down to business. He began asking innumerable questions about the
    office; how it was run, how many employees we had, the cost of maintaining it
    and forth. Our chief answered briefly, but whenever he tried to evade a question,
    the officer supplied the answer. The officer already knew how well spies living
    in Java had done the work.


    Toward the end of the interview, the chief told the officer that two thousand
    Indonesian workmen had been fired the week before, as he put it, “they did not
    wish to cooperate with our policies.” This news didn’t seem to bother the Jap
    officer. He merely shrugged his shoulders and said, “Good.” Of course he knew
    they couldn’t run the office without our help and they needed to keep the public
    utilities going. By this time more Jap officers had showed up with them sentries.
    The latter were immediately posted about the building inside and out and stood
    at their places with bayonets. It was then that we first learned about bowing.
    Everyone, white or native, had to bow as they passed; sentry yelled, “Bow,” whenever
    he saw anyone.


    Later we were given official regulations about bowing. The men were to bow sixty
    degrees, the women forty-five degrees. The papers put this way: `Citizens will
    bow to sentries to show their respect for the great Empire`. Naturally lot of
    trouble came from this. It is easy to imagine no white man wants to bow to a Jap,
    but we knew it would be foolish to refuse. The Dutch government had always been
    careful to respect native beliefs and forbade Indonesians to wear small black
    caps as a sign of their faith. But Jap sentries were annoyed when they saw natives
    bowing with caps and tried to knock them off. Japs have a way of snarling when
    they are angry, a hoarse, guttural sound that betrays their bestial qualities.
    They would shout at natives, beat them with rifle butts and kick them to make
    them remove caps. This didn’t make Indonesians feel better about prosperity.


    We learned before the day was over that the soldiers who had come to our office
    were economic troops, not professional soldiers at all, but businessmen who had
    been delegated to take over industries and offices. Each had been assigned to
    manage a certain office or plant and knew in advance as much about the business
    as Dutch officials did. Each of us was given a band to wear on the left arm. It
    was printed in Japanese characters and said the wearer was working for the Japanese
    Government and not to be molested in any way. We were instructed to wear these
    armbands all the time and not to remove them if we valued our safety.


    When I went home that night I saw from almost every office building that the troops
    had not been wasting time. All these posters bore the same announcement: that
    the concern was now the property of the Japanese Government and was to be run
    for the greater good of `Asiatic Prosperity`. The posters made me wonder who was
    going to prosper by this wholesale exchange of ownership.


    Once again in the midst of the sorrow and depression that had taken control of
    me I saw something that amused me. As already said, Jap soldiers were filthy with
    dirt and sweat by the time they reached Batavia and one of the first things they
    wanted to do was get clean. They went about this in a very direct manner. Without
    any hesitation they walked into someone’s house and announced they had come to
    use the bathroom. Of course no householder was willing to dispute this under the
    circumstances, so the soldiers were given the free use of the bath. Friends of
    mine who were subjected to this odorous visitation of this kind told me that Japs
    spent a couple of hours scrubbing themselves. After they were clean, they washed
    their uniforms. Without waiting for them to dry, the soldiers walked away carrying
    their wet uniforms and wearing only a short white shirt that came just above their
    knees and was tied about the waist with a rope. It was the sight of these bandy-legged
    little men in their underwear that made me smile. The soldiers went everywhere
    in this scanty costume that first day; into stores, theaters, and on the street.
    It didn’t help hide their physical shortcomings.


    When I reached home I found three Jap soldiers in my backyard trying to pump water
    from the well. Seeing me, they began pointing to their noses in the usual way
    to indicate “I.” “Water, water,” they said, gesturing to the well and then holding
    their noses. “Please, please.” I gave them water. “Thank you, thank you.” While
    I stood watching them drink, they kept smiling and ducking their heads to me.
    Right then I got an idea that many of Jap soldiers are somewhat in awe of white
    men. These men seemed to have a certain respect for me, perhaps because of my
    height, and were extremely polite. After they finished drinking, they took small
    tin pans from their packs and some rice. Squatting on the ground they began eating.
    “How far Bandung?” asked one. I told him about a hundred and ten miles. He sighed
    and made a hopeless gesture. “I walk,” he said mournfully. They went away soon
    after. My first encounter with Jap soldiers wasn’t unpleasant. But it was hell
    to think that Java had been taken by ragged, half-starved men like these.

    '
  raw: 'IT wasn’t until the next morning that I had a good look at the Jap occupation
    troops. By the time I was ready to go to work, as I had been instructed, the Jap
    soldiers were all over the city. They came by bicycle. Swarms of squat little
    men on their strange machines. They came waving tiny Japanese flags, showing their
    buck teeth in wide grins and feeling very happy. Their black eyes glinted behind
    their horn-rimmed spectacles. Within half an hour I was able to estimate that
    fifty per cent of the Japs wore glasses.The ordinary Jap soldier is not a prepossessing
    specimen of the human race. Most of them are bowlegged, with stunted, awkward
    bodies and extremely ugly faces. The caricatures one sees of the Japs aren’t much
    exaggerated. They look that way: runty, bespectacled, and big toothed. Many of
    them drag their feet when they walk, scuffing along as though it were too much
    of an effort to lift them off the ground.I was surprised at their lack of equipment.
    From the glimpse I had had of the invaders the night before, I supposed that every
    soldier would be heavily armed. But most of the men I saw this morning carried
    only small-bore rifles. About one in twenty-five had a machine gun.Their personal
    effects were no better. Each soldier evidently had one uniform, a thin, loose
    shirt with long sleeves, buttoned up to the neck. They wore puttees wrapped over
    their trouser legs and leather boots. Some of them had lightweight sun helmets,
    but the majority wore a brown cap with a piece of cloth hanging down the back
    to protect the neck from the sun. Without exception the soldiers smelt to high
    heaven. The cheap cotton uniforms, once a dark tan, were faded to a dirty gray
    and stank with stale sweat. Long before you saw a Jap coming, you could smell
    him.Their first move was to take all the government cars that were left in the
    city. Of the 150,000 troops that came through Batavia, only 30,000 stayed as an
    occupation force. The others were on their way to Bandung, so they grabbed any
    vehicle which would take them there faster.I pedaled along the street on my bicycle,
    trying to look unconcerned, but keeping a sharp eye on everything that went on.
    The stinking Japs were everywhere. I saw three Japs jump off their bicycles and
    stop a car, moving through the densely packed street ahead of me. They gestured
    with their thumbs to show the native driver that they wanted the car and, when
    he hesitated, took him by the neck and threw him into the street. They tied their
    bicycles to the back of the car, took branches from a near-by tree and arranged
    them over the top to camouflage it. I was to learn that this act of camouflaging
    the car was typical of the Jap soldiers. Of course, such a precaution was unnecessary,
    as the Japs were masters of the air. But they are like machines. They had been
    told: “Whenever you ride in a car, be sure to camouflage it.” So they did, without
    thinking whether it was necessary or not. But right there, I want to say that
    the Jap soldiers are excellently trained. The ones I saw had been fighting in
    China for four years and were the pick of the storm troops. They knew their job.I
    didn’t get far on my bicycle. Soon after the incident of the car, a Jap riding
    past me on his bicycle got a flat tire. Immediately he jumped to the ground and
    stopped me by wheeling his machine across my path. The soldier waved toward my
    bicycle, grinned and then pointed to his nose. For a moment I was puzzled, but
    finally his gestures, first toward my bicycle and then toward his nose, told me
    that this meant he was appropriating my machine. The motion toward his nose I
    was to see duplicated many times in the next months. It was the Jap way of indicating
    himself. “I,” he would say with a gesture to his nose, “want this or that.” A
    wise man gave it to him.In spite of how I felt about everything that day, I couldn’t
    help but be amused by the Jap as he tried to mount my bicycle. I am over six feet
    tall and my bicycle was large. This soldier was even smaller than many of his
    comrades. I watched him try to mount into the saddle, but he couldn’t make it
    by the usual method. His legs were too short. He had to give an awkward jump to
    reach the seat and, once there, had the devil of a time balancing the machine.
    He finally solved the problem by standing up and leaning way over to one side
    to reach one pedal and then swaying back to the other side to propel the opposite
    one. I felt a little more cheerful as I watched him zigzagging a wobbly course
    down the street. He didn’t look much like a world conqueror on that bicycle.On
    the whole the occupation went smoothly. The Japs were careful to keep a crowd
    from forming and, even when some apprehensive natives got out small Jap flags
    and waved them about in hopes of pleasing the invaders, the soldiers disbanded
    them. They weren’t sure how the natives or whites were going to react to their
    coming and any kind of crowd made them nervous. But there wasn’t much resistance.
    All civilians were ordered by our government to stay at their jobs and to refrain
    from hostilities. A couple of natives got slapped by Jap soldiers when they started
    to protest the stealing of their bicycles, but most people didn’t dare object.When
    I reached my office, I was surprised to find that none of the Jap troops had been
    there. Word had gone around that the Japs had lists of all the government offices,
    the consulates, and business firms and were to take them over immediately. No
    one did much work that morning. We all felt nervous and wondered when the Japs
    would show up to occupy the office.We didn’t have long to wait. At noon a car
    carrying a Jap officer drove into the yard with soldiers carrying guns and bayonets
    riding on the running board. Accompanied by an armed guard, he went immediately
    to the head office. A few minutes later word came that all the employees of our
    division were to gather to hear a proclamation by the Jap officer.As soon as we
    were all collected, the officer, a nervous man with the inevitable spectacles,
    began to talk rapidly in a sort of sing-song voice. He spoke Japanese, so I didn’t
    understand a word of his speech. When he had finished, he gestured to one of his
    subordinates and this man repeated the officer’s words in careful, precise English.
    What he said in substance was that this office was being taken over by the Japanese
    Government, that all of us were to work for them now and to keep on with our regular
    duties as though nothing had changed. Acts of sabotage, passive resistance or
    any forms of insubordination would be punished by death. He finished by saying
    that anyone who did not wish to abide by this new system would kindly step forward
    and declare himself.The armed guards fixed their bayonets and waited. No one moved.
    I wondered if they expected anyone to announce his real feelings in the face of
    that barrage of steel.The English speech over, another Jap repeated the same thing
    in Malayan for the benefit of our native employees. It had the same effect as
    the previous announcement. None of them was inclined to state his reaction to
    it by impaling himself on a Jap bayonet.This formula completed, the officer sent
    some of his men about the building to paste up posters saying that the office
    was now the “Property of the Japanese Empire” and would be run for the benefit
    of “Greater Asiatic Prosperity.”I stayed to hear what else the Jap officer had
    to say. The first thing he did, when the majority of the employees had been sent
    back to their posts, was to draw his sword and show it to us. It was splashed
    with a brown stain from hilt to point.“Anzac,” declared the officer proudly, pointing
    to the dried blood. He meant that the blood was that of New Zealand and Australian
    soldiers he had killed in Malaya. Obviously this sword with its bloody stains
    was his most treasured possession.After this display of vanity, the officer got
    down to business. He began asking innumerable questions about the office; how
    it was run, how many employees we had, the cost of maintaining it and so forth.
    Our chief answered briefly, but whenever he tried to evade a question, the officer
    supplied the answer himself. That’s how well the Jap spies who had been living
    in Java had done their work. The officer already knew all about the company.Toward
    the end of the interview the chief told the officer that he had two thousand Indonesian
    workmen and that two of them had been fired the week before, because, as he put
    it, “they did not wish to co-operate with our policies.” He meant that these men
    had been Jap sympathizers and had been spreading propaganda, trying to make the
    rest of us see the glory that awaited us when the Japs took Java.This news didn’t
    seem to bother the Jap officer at all. He merely shrugged his shoulders and said,
    “Good.” Of course, he knew that they couldn’t run the office without our help
    and they needed to keep the public utilities going.By this time more Jap officers
    had showed up and with them a strong force of sentries. The latter were immediately
    posted about the building, inside and out, and stood at their places with bayonets
    fixed. It was then that we first learned about bowing to the sentries. Everyone,
    white or native, had to bow as he passed one of the guards anywhere in the city.
    There wasn’t much danger of our not finding out about this, as a sentry yelled,
    “Bow, bow,” whenever he saw anyone of the “conquered races” approaching. Later
    we were given official regulations in the newspapers about this bowing. The men
    were to bow sixty degrees, the women forty-five degrees. The papers put it this
    way: “Citizens will bow to all sentries to show their respect for the protection
    the great Japanese Empire is giving them.”Naturally a lot of trouble came from
    this. It’s easy to imagine that no white man wants to bow to a Jap, but we knew
    it would be foolish to refuse. There was nothing we could do about it; we had
    the choice of bowing or being run through with a bayonet. A dead man is no good
    to Holland and a wise man did as he was told under the circumstances. But the
    natives had a worse time with their bows. Most Javanese are Mohammedans and wear
    a small black cap as a sign of their faith. The Dutch government has always been
    careful to respect the native beliefs and of course never forbade the Indonesians
    to wear their caps.But the Jap sentries were annoyed when they saw the natives
    bowing with their caps on and tried to knock them off. The Japs have a way of
    snarling, when they are angry, a hoarse, guttural sound, that betrays their bestial
    qualities. They would shout at the natives, beat them with their rifle butts and
    kick them to make them remove their caps. It didn’t make the Indonesians feel
    any better about co-prosperity.I learned before the day was over that the soldiers
    who had come to our office were the economic troops. Many of them were not professional
    soldiers at all, but businessmen who had been delegated to take over all industries
    and offices in Java. Each had been assigned to manage a certain office or plant
    and knew in advance almost as much about the business as our Dutch officials did.
    Before we went home, each one of us was given a band to wear on the left arm.
    It was printed in Japanese characters and said in effect that the wearer was working
    for the Japanese Government and was not to be molested in any way. We were instructed
    to wear these armbands all the time and not to remove them, if we valued our own
    safety.When I went home that night I saw from the posters on almost every office
    building that the economic troops had not been wasting time. All these posters
    bore the same announcement: that the concern was now the property of the Japanese
    Government and was to be run for the greater good of “Asiatic Prosperity.” The
    posters made me wonder who was going to “prosper” by this wholesale exchange of
    ownership.Once again in the midst of the sorrow and depression that had taken
    control of me, I saw something that amused me. As I’ve already said, the Jap soldiers
    were filthy with dirt and sweat by the time they reached Batavia and one of the
    first things they wanted to do was get clean. They went about this in a very direct
    manner. Without any hesitation they walked into someone’s house and announced
    that they had come to use the bathroom. Of course, no householder was willing
    to dispute this under the circumstances, so the soldiers were given the free use
    of the bath. Friends of mine, who were subjected to an odorous visitation of this
    kind, told me that the Japs spent a couple of hours scrubbing themselves. After
    they were clean, they washed their uniforms. Without waiting for them to dry,
    the soldiers walked away, carrying their wet uniforms and wearing only a short
    white shirt that came just above their knees and was tied about the waist with
    a rope. It was the sight of these bandy-legged little men in their underwear that
    made me smile, though for obvious reasons I was careful to hide my amusement.
    The soldiers went everywhere in this scanty costume that first day; into stores,
    theaters, and on the street. It didn’t help hide their physical shortcomings.When
    I reached home I found three Jap soldiers in my backyard, trying to pump water
    from the well. Seeing me, they began pointing to their noses in the usual way
    to indicate “I.”“Water, water,” they said, gesturing to the well and then holding
    their noses. “Please, please.”I gave them water.“Thank you, thank you.”While I
    stood watching them drink, they kept smiling and ducking their heads to me. Right
    then I got an idea that many of the Jap soldiers are somewhat in awe of white
    men. These men seemed to have a certain respect for me, perhaps because of my
    height, and were extremely polite. After they finished drinking, they took small
    tin pans from their packs and some rice. Squatting on the ground, they began eating.“How
    far Bandung?” asked one.I told him about a hundred and ten miles.He sighed and
    made a hopeless gesture. “I walk,” he said mournfully.They went away soon after.
    My first encounter with Jap soldiers wasn’t unpleasant. But it was hell to think
    that Java had been taken by ragged, half-starved men like these.'
