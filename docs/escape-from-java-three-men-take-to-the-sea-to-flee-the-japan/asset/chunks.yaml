    # 第十七章

    '
- fmt: "\n“HEAD her into the wind!” I yelled to Dirk. Lunging forward, I grabbed the\
    \ helm from him and shoved it hard over. But the drag of the mast and sails to\
    \ starboard was too much for me. I couldn’t keep the bow headed forward with that\
    \ mass of tangled wreckage pulling us around to starboard. There was nothing to\
    \ do but let the ship have her own way and ride in the trough of the waves like\
    \ a lifeless hulk.\n\nSeeing there was nothing to be gained by struggling with\
    \ the helm, I lashed it and went to inspect the damage. A driving rain began to\
    \ fall just then, the storm I had seen forming along the horizon a short time\
    \ previously. At the moment we scarcely noticed it; we were too concerned with\
    \ the tragedy that faced us.\n\nNo one had a word to say as I made a hasty inspection\
    \ of the cause of the accident. A glance at the stub of the mast showed that it\
    \ had snapped off about three feet above the deck, just over the hinge point.\
    \ The wood was decayed there and, weakened by the wind of the last few days, had\
    \ given way in the gathering storm. The two turnbuckles of the jib stays were\
    \ ripped out by the mast’s fall, so that every bit of canvas had gone overboard\
    \ with the mainsail. We got the jib in, as it was floating in the water, practically\
    \ undamaged.\n\nBut the mainsail was a sorry sight. It was wrapped tightly about\
    \ the mast, held there by the tangled stays. These ropes and wires were still\
    \ attached to the boat and were the only thing that kept us from losing the mast\
    \ and sail entirely. The canvas was torn to shreds by the fall and the beating\
    \ it was taking from the lashing waves. The boat was pitching and tossing so violently\
    \ that I knew it was foolhardy to try to get our ruined sail aboard that night.\n\
    \n“Lend a hand with these ropes,” I shouted, grasping a floating halyard. I braced\
    \ myself against the freeboard and began to haul on the rope. William and Dirk,\
    \ balancing precariously in the heaving boat, did as I directed, and after a herculean\
    \ struggle we got the mast lashed alongside, using the broken stays to do the\
    \ work. Once the mast, wrapped in the shredded sail, was secure, we sat back in\
    \ the cockpit to view our impossible situation with what calm we could muster.\n\
    \nBoth William and Dirk were so utterly discouraged by the disaster that I saw\
    \ I would have to assume a confidence I was far from feeling to keep their spirits\
    \ up.\n\n“We’ll begin hauling the mast aboard in the morning,” I announced, trying\
    \ to sound as though the task were going to be easy.\n“We better give up the whole\
    \ damn trip,” said Dirk, making a desperate clutch at the freeboard to save himself\
    \ from falling overboard as the boat heeled. “We could row to `Cocos` from here.”\n\
    “And let the Japs stow us in a concentration camp—or worse—for the rest of the\
    \ war,” I answered scornfully. “Not on your life. We aren’t licked yet. Wait until\
    \ morning and you’ll see.”\n\nI didn’t mention the fact that we were well over\
    \ a hundred miles from `Cocos`, a long row, even if I had wanted to try it. I\
    \ was determined not to show my own discouragement and for the rest of that night\
    \ talked like a fool to keep up my own courage as well as theirs. I made them\
    \ tell me their life stories and added mine, with many embellishments, just to\
    \ have something to keep the conversation going. But never for a moment could\
    \ any of us forget our real danger.\n\nThe sea and wind saw that. The storm was\
    \ going full blast now and, if we had thought the boat heeled too much before\
    \ we felt as though we were in a swing. It was only by hanging on both hands that\
    \ we kept from overboard. The rain pelted down and with that and the heavy spray\
    \ from the great rollers, the cockpit was half awash all the time. We had something\
    \ to do in taking turns at the `handpump`.\n\n### The Struggle\n\nWe were all\
    \ glad when a faint light along the eastern horizon showed that the night was\
    \ over. But the morning that finally came was not a cheerful one. Heavy clouds\
    \ still covered the sky and not a beam of sunlight penetrated them. The rain kept\
    \ on but now we were so soaked that we paid little heed to it; it was merely another\
    \ torment to add to our long list.\n\n“How the devil are you going to get that\
    \ mast aboard and what are you to do with it?” asked Dirk, staring at the snarled\
    \ mass of wood which looked even more of wreck in the gray light of day. “We haven’t\
    \ any tools to fix anything.”\n“Oh, shut up,” I shouted, tired of his attitude.\
    \ “We’ve got a `screwdriver` and a `knife`, haven’t we? Lend a hand here and don’t\
    \ talk so much.”\n\nIt took us two hours of backbreaking work to get that mast\
    \ and mainsail aboard; work that wasn’t helped by the fact that we had to hang\
    \ on while we struggled with the wreck. The sea had not quiet with daylight and\
    \ the cutter was still tossing and wallowing like a derelict. We got it aboard\
    \ at last, however, and what a sorry sight it was. The mainsail was ruined beyond\
    \ repair; there was scarcely a square foot that didn’t show hole or tear. We’d\
    \ have to fashion a new mainsail of the spare one, a job I didn’t look forward\
    \ to.\n\nJust as we gave the mast a final haul to settle it on deck, the main\
    \ boom snapped. It had never been in-class condition and the extra strain had\
    \ too much for it.\n\n“Well, that’s dandy,” I exclaimed, sitting back to survey\
    \ the damage. “Broken mast, busted boom. What more could you want?”\n“I say we\
    \ row to `Cocos`,” repeated Dirk. “We can’t do anything with this mess.”\n“And\
    \ I say we can,” I said with more spirit. “William, get the `breadknife` and the\
    \ `file` from the cabin. I’m going to start cutting down the mast.”\n“And then\
    \ what are you to do with it?” asked Dirk sarcastically. “Hold it up in one hand\
    \ all the way to `Rodriguez`?”\n\nI kept my temper with an effort and began to\
    \ explain what I intended to do. “I’ll cut about three feet off the end with this\
    \ `knife` and drill a hole in it with the `screwdriver` and `hammer`, so we can\
    \ set it up at the hinge point. You two can get busy splicing rope. We’ll have\
    \ to splice almost all the stays and halyards before they can be used again.”\n\
    \nI showed them how to splice and, using the `screwdriver`, they took turns at\
    \ the job. Their efforts were a good deal hampered by the fact that I made one\
    \ of them stay at the helm all the time to try to keep the boat headed into the\
    \ wind. The other had to take time off every minutes or so to work the `handpump`.\
    \ The spray was still coming in, and every so often the water had to be pumped\
    \ out of the cockpit or we would soon have been swamped. Then, too, the boat never\
    \ stopped rolling and plunging, no matter how the helmsman was in keeping her\
    \ bow to the wind. This sickening motion affected all of us and made our work\
    \ twice as difficult.\n\nFour hours’ work with the `breadknife` and another hour\
    \ with the `screwdriver` and `hammer` gave us a new mast. It was a tedious business,\
    \ for I had to sharpen the `knife` every minutes on the `file` and more than once\
    \ I wondered if I were foolish to try to fashion a mast by such a toilsome process.\
    \ But it was the `knife` or nothing and I kept at it. I felt rewarded when I last\
    \ saw I had finished the job. Now setting it up would be another problem. We’d\
    \ have to wait until the storm let up before trying this, as it was going to be\
    \ hard enough getting the heavy, unwieldy mast on our shoulders without trying\
    \ to balance ourselves in a rocking boat at the same time.\n\nThe other two had\
    \ made some headway with the ropes, but I saw it would be some time before they\
    \ were ready for use. I made them keep at it, however while I got to work on the\
    \ mainsail. The spare one we carried had originally been cut for a schooner and\
    \ would have to be completely remade for the cutter, especially now that I had\
    \ cut down the mast. The light darning needles and heavy thread didn’t help me\
    \ with the job, and by the end of the afternoon I had made discouraging progress.\n\
    \nWe hadn’t cooked any food that day, for we wouldn’t have been able to keep the\
    \ stove upright. At noon we’d each had a chocolate bar and when evening came another\
    \ piece of candy served as our supper. What with little food and all the work\
    \ and worry we had been through, we were dead tired long before nightfall.\n\n\
    “Let’s turn in,” said William. “We can’t do anything more in the dark.”\n“We’ve\
    \ got to rig a sea anchor before we quit,” I told him. “I want to try to keep\
    \ headed into the wind and a sea anchor may help.”\n\nI made a sketchy sea anchor\
    \ out of a spare piece of canvas and attached it to a rope at the bow. Nothing\
    \ happened. The boat still persisted in riding abeam of the waves in a hell manner\
    \ that really expressed how we all felt.\n\n“Shove the helm over,” I directed\
    \ William. “Head up.” He obeyed, but still the boat refused to respond. I made\
    \ another sea anchor and launched it over. It was useless. The cutter lay in the\
    \ trough of the waves as though nothing would induce her to fight on. While we\
    \ watched the bow, hoping for a sudden change, a huge roller broke beside the\
    \ cockpit and in another instant it were flooded.\n\n“Hang on to that helm!” I\
    \ bellowed to William, who had let it go when the sea washed over. “Keep trying\
    \ to get her up.” I lashed the ropes which held, realizing that they were partly\
    \ the cause of the accident. Once they were free, I dashed for the companionway\
    \ and plunged up to my waist in the flooded cabin. The `handpump` was useless\
    \ now and I grabbed a big pan. With Dirk to help me we worked like madmen; filling\
    \ the pan and handing it overboard. For two hours we worked, never pausing an\
    \ instant to catch our breath. If a second roller had washed over us before we\
    \ finished it would have been all over. The boat couldn’t stood another flood\
    \ and we would have gone down like a sodden bathtub.\n\n without another roller,\
    \ things couldn’t have been worse. Everything inside the cabin was soaked, our\
    \ rice was ruined, all our possessions even waterlogged. It was a disheartening\
    \ sight that we looked upon, once we got the water out of the cabin. We had to\
    \ throw away the spoiled rice and do what we could to restore some semblance of\
    \ order. But we couldn’t do much with the boat pitching as it was and we left\
    \ the cabin in a sorry mess.\n\nWilliam was waging losing fight with the helm,\
    \ for he couldn’t keep the bow into the wind more than a few seconds at a time.\
    \ Once he set the wind would shove us again and we’d lie abeam of the waves at\
    \ the mercy of every roller that came our way. The rain continued, adding bit\
    \ to the spray which kept the cockpit half awash. Only by using the `handpump`\
    \ every minutes were we able to keep it from flooding.\n\nI saw that the most\
    \ important thing now was to rig up some kind of sail, so we could get some response\
    \ out of the helm. Tied the stub of the mast and held in place with ends of rope\
    \ did the trick. The wind was so strong that a handkerchief would have helped,\
    \ but it did its duty. The helmsman was able to keep the bow into the wind and\
    \ we were even conscious that we were getting some speed out of the boat.\n\n\
    We took one-hour watches at night, but the two who were supposed to be resting\
    \ in the cabin had a nightmare existence. All the blankets were wet and our clothes\
    \ in the same sodden mess. No one got sleep. Lying in the sea-soaked cabin with\
    \ our predicament to contemplate and the driving rain not exactly soothing, I\
    \ preferred to spend most of the time in the cockpit and was lucky I did, as someone\
    \ had to be on hand to man the pump.\n\nThe following morning dawned—though we\
    \ didn’t see anything that looked like dawn on the gray horizon—and we. I rigged\
    \ a higher sternboard of canvas and part of an old case to help keep some water\
    \ out of the cockpit. It worked after a fashion, though the spray made it necessary\
    \ to pump twenty minutes or so.\n\nThe storm lasted four days; days of gray skies,\
    \ frequent soaking squalls, and a constant leaden dampness in the air held our\
    \ spirits down to zero. The wind kept up, though it veered slowly from southeast\
    \ to north, while we were pushed along its path by the sail. It was hard to work\
    \ in the wind and rain, particularly with the tools we had at hand. But we finished\
    \ splicing the stays and cut a mainsail to fit the new mast. Now we would have\
    \ to wait for the storm to die down before trying to hoist the mast into position.\
    \ I wondered how we were going to get that unwieldy length of wood on our shoulders\
    \ in that pitching boat, in order to set it up. But there was no use worrying\
    \ that until I had to. Not once during those four days were we able to cook a\
    \ meal. We lived on chocolate, a diet that was nourishing enough, but scarcely\
    \ sufficient for anyone who was living and working as we were then (Wait, let\
    \ me re-read the flow).\n\n*Correction on flow:*\nNot once during those four days\
    \ were we able to cook a meal. We lived on chocolate, a diet that was nourishing\
    \ enough, but scarcely sufficient for anyone who was living and working as we\
    \ were. None of us had time for any philosophic consideration of our position\
    \ or our chances of getting out of the mess alive. When there is an immediate\
    \ task to be done, you don’t have a chance to think. I don’t remember having a\
    \ thought in my head, except in connection with the work at hand; either sewing\
    \ sail, splicing rope, or handling the helm. We were too busy even to worry. Of\
    \ course we groused a lot, but that’s a healthy sign and the more Dirk and William\
    \ sweated and stewed the better I liked it. I don’t believe anyone slept more\
    \ than a total of three or four hours during those hellish four days, and we felt\
    \ groggy with weariness.\n\nOn the morning of the eighteenth, it stopped raining\
    \ and at about eleven o’clock a watery sunlight showed through the clouds. The\
    \ mast was ready to be set up and the sails cut, so I decided to make the attempt\
    \ that day. The cutter was still pitching heavily, but we couldn’t afford to wait\
    \ much longer for better weather. It was no use, however. The mast was too heavy\
    \ for us to lift on our shoulders on that unstable footing and after two hours\
    \ of cursing and sweating we had to give it up.\n\n“Now what?” The question came\
    \ from Dirk and from its tone I knew that he had about reached the depths of despair.\n\
    “I’ll cut another hunk off it,” I said, trying to act as though this were going\
    \ to be an easy job. I didn’t say that with a shorter mast, I’d have to recut\
    \ the mainsail again. No use telling him all the bad news at once.\n\nI got to\
    \ work with the `breadknife`, deciding to take another four feet off which would\
    \ leave us with a mast about twelve feet long. I felt sure we could get one of\
    \ that length on our shoulders and set it up. The boat rolled as much as it ever\
    \ had, making my work on deck a precarious job. I braced myself with one arm about\
    \ the mast stump and began the slow process of whittling at the wood, a sliver\
    \ at a time.\n\nThe sun disappeared an hour after its half-hearted appearance,\
    \ and shortly after noon a heavy rain began to fall, one that seemed to have every\
    \ intention of keeping on forever. I looked up from my work and saw Dirk handing\
    \ one of the revolvers to William.\n“What the hell are you doing with that?” I\
    \ shouted.\nDirk clutched at the edge of the lurching boat and said grimly, “If\
    \ we don’t get out of this and it doesn’t look as though we were, I’d rather die\
    \ by a bullet than by drowning.”\nI didn’t answer him. I was beginning to feel\
    \ much the same way myself.\n"
  raw: “HEAD her into the wind!” I yelled to Dirk. Lunging forward, I grabbed the
    helm from him and shoved it hard over. But the drag of the mast and sails to starboard
    was too much for me. I couldn’t keep the bow headed forward with that mass of
    tangled wreckage pulling us around to starboard. There was nothing to do but let
    the ship have her own way and ride in the trough of the waves like a lifeless
    hulk.Seeing there was nothing to be gained by struggling with the helm, I lashed
    it and went to inspect the damage. A driving rain began to fall just then, the
    storm I had seen forming along the horizon a short time previously. At the moment
    we scarcely noticed it; we were too concerned with the tragedy that faced us.No
    one had a word to say as I made a hasty inspection of the cause of the accident.
    A glance at the stub of the mast showed that it had snapped off about three feet
    above the deck, just over the hinge point. The wood was decayed there and, weakened
    by the wind of the last few days, had given way in the gathering storm. The two
    turnbuckles of the jib stays were ripped out by the mast’s fall, so that every
    bit of canvas had gone overboard with the mainsail. We got the jib in, as it was
    floating in the water, practically undamaged.But the mainsail was a sorry sight.
    It was wrapped tightly about the mast, held there by the tangled stays. These
    ropes and wires were still attached to the boat and were the only thing that kept
    us from losing the mast and sail entirely. The canvas was torn to shreds by the
    fall and the beating it was taking from the lashing waves. The boat was pitching
    and tossing so violently that I knew it was foolhardy to try to get our ruined
    sail aboard that night.“Lend a hand with these ropes,” I shouted, grasping a floating
    halyard. I braced myself against the freeboard and began to haul on the rope.William
    and Dirk, balancing precariously in the heaving boat, did as I directed, and after
    a herculean struggle we got the mast lashed alongside, using the broken stays
    to do the work. Once the mast, wrapped in the shredded sail, was secure, we sat
    back in the cockpit to view our impossible situation with what calm we could muster.Both
    William and Dirk were so utterly discouraged by the disaster that I saw I would
    have to assume a confidence I was far from feeling to keep their spirits up.“We’ll
    begin hauling the mast aboard in the morning,” I announced, trying to sound as
    though the task were going to be easy.“We better give up the whole damn trip,”
    said Dirk, making a desperate clutch at the freeboard to save himself from falling
    overboard as the boat heeled. “We could row to Cocos from here.”“And let the Japs
    stow us in a concentration camp—or worse—for the rest of the war,” I answered
    scornfully. “Not on your life. We aren’t licked yet. Wait until morning and you’ll
    see.”I didn’t mention the fact that we were well over a hundred miles from Cocos,
    a long row, even if I had wanted to try it. I was determined not to show my own
    discouragement and for the rest of that night talked like a fool to keep up my
    own courage as well as theirs. I made them tell me their life stories and added
    mine, with many embellishments, just to have something to keep the conversation
    going. But never for a moment could any of us forget our real danger. The sea
    and wind saw to that. The storm was going full blast now and, if we had thought
    the boat heeled too much before, we felt as though we were in a swing now. It
    was only by hanging on with both hands that we kept from falling overboard. The
    rain pelted down and what with that and the heavy spray from the great rollers,
    the cockpit was half awash all the time. We had something to do in taking turns
    at the handpump. But it was a small one and we were never able to keep the cockpit
    free of water.We were all glad when a faint light along the eastern horizon showed
    that the night was over. But the morning that finally came was not a cheerful
    one. Heavy clouds still covered the sky and not a beam of sunlight penetrated
    them. The rain kept on, but now we were so soaked that we paid little heed to
    it; it was merely another torment to add to our long list of troubles.“How the
    devil are you going to get that mast aboard and what are you going to do with
    it if we do haul it in?” asked Dirk, staring at the snarled mass of wood and canvas
    which looked even more of a wreck in the gray light of day. “We haven’t any tools
    to fix anything with.”“Oh, shut up,” I shouted, tired of his Jonah attitude. “We’ve
    got a screwdriver and a knife, haven’t we? Lend a hand here and don’t talk so
    much.”It took us two hours of backbreaking work to get that mast and mainsail
    aboard; work that wasn’t helped any by the fact that we had to hang on to the
    pitching boat like grim death while we struggled with the bulky wreck. The sea
    had not quieted with daylight and the cutter was still tossing and wallowing like
    a derelict. We got it aboard at last, however, and a sorry sight it was. The mainsail
    was ruined beyond repair; there was scarcely a square foot that didn’t show a
    hole or tear. There was no hope of repairing it. I’d have to fashion a new mainsail
    out of the spare one we carried, a job I didn’t look forward to.Just as we gave
    the mast a final haul to settle it on deck, the main boom snapped. It had never
    been in first-class condition and the extra strain had been too much for it.“Well,
    that’s dandy,” I exclaimed, sitting back on my heels to survey the damage. “Broken
    mast, busted boom. What more could you want?”“I say we row to Cocos,” repeated
    Dirk stubbornly. “We can’t do anything with this mess.”“And I say we can,” I said
    with more spirit. “William, get the breadknife and the file from the cabin. I’m
    going to start cutting down the mast.”“And then what are you going to do with
    it?” asked Dirk sarcastically. “Hold it up in one hand all the way to Rodriguez?”I
    kept my temper with an effort and began to explain what I intended to do. “I’ll
    cut about three feet off the end with this knife and drill a hole in it with the
    screwdriver and hammer, so we can set it up at the hinge point. You two can get
    busy splicing rope. We’ll have to splice almost all the stays and halyards before
    they can be used again.”I showed them how to splice and, using the screwdriver,
    they took turns at the job. But it was slow work for inexperienced men. Their
    efforts were a good deal hampered by the fact that I made one of them stay at
    the helm all the time to try to keep the boat headed into the wind. The other
    had to take time off every fifteen minutes or so to work the hand-pump. The spray
    was still coming in constantly, and every so often the water had to be pumped
    out of the cockpit or we would soon have been swamped. Then, too, the boat never
    stopped rolling and plunging, no matter how successful the helmsman was in keeping
    her bow to the wind. This sickening motion affected all of us and made our work
    twice as difficult.Four hours’ work with the breadknife and another hour with
    the screwdriver and hammer gave us a new mast. It was a tedious business, for
    I had to sharpen the knife every five minutes on the file and more than once I
    wondered if I were foolish to try to fashion a mast by such a toilsome process.
    But it was the knife or nothing and I kept at it. I felt rewarded when I at last
    saw I had finished the job. Now setting it up would be another problem. We’d have
    to wait until the storm let up before trying this, as it was going to be hard
    enough getting the heavy, unwieldy mast on our shoulders without trying to balance
    ourselves in a rocking boat at the same time.The other two had made some headway
    with the ropes, but I saw it would be some time before they were ready for use.
    I made them keep at it, however, while I got to work on the mainsail. The spare
    one we carried had originally been cut for a schooner and would have to be completely
    remade for the cutter, especially now that I had cut down the mast. The light
    darning needles and heavy thread didn’t help me with the job, and by the end of
    the afternoon I had made discouraging progress.We hadn’t cooked any food that
    day, for we wouldn’t have been able to keep the stove upright. At noon we’d each
    had a chocolate bar and when evening came another piece of candy served as our
    supper. What with little food and all the work and worry we had been through,
    we were dead tired long before nightfall.“Let’s turn in,” said William. “We can’t
    do anything more in the dark.”“We’ve got to rig a sea anchor before we quit,”
    I told him. “I want to try to keep headed into the wind and a sea anchor may help.”I
    made a sketchy sea anchor out of a spare piece of canvas and attached it to a
    rope at the bow. Nothing happened. The boat still persisted in riding abeam of
    the waves in a sort of helpless “what the hell” manner that really expressed how
    we all felt about the situation.“Shove the helm over,” I directed William. “Head
    her up.”He obeyed, but still the boat refused to respond. I made another and larger
    sea anchor and launched it over the bow. It was useless. The cutter lay in the
    trough of the waves, as though nothing would induce her to fight them head on.
    While we watched the bow, hoping for a sudden miraculous change of heart in the
    cutter, a huge roller broke beside the cockpit and in another instant the cabin
    and cockpit were flooded with water.“Hang on to that helm!” I bellowed to William,
    who had let it go when the sea washed over him. “Keep trying to get her head up.”I
    lashed at the ropes which held the sea anchors, realizing that they were partly
    the cause of the accident. Once they were free, I dashed for the companionway
    and plunged up to my waist in the flooded cabin. The handpump was useless now
    and I grabbed a big pan. With Dirk to help me, we worked like madmen; I filling
    the pan and handing it up to Dirk who tossed the water overboard. For two hours
    we worked, never pausing an instant to catch our breath. If a second roller had
    washed over us before we had finished, it would have been all over. The boat couldn’t
    have stood another flood and we would have gone down like a sodden bathtub.Even
    without another roller, things couldn’t have been much worse. Everything inside
    the cabin was soaked, half our rice was ruined, all our personal possessions and
    even the instruments waterlogged. It was a disheartening sight that we looked
    upon, once we got the water out of the cabin. We had to throw away the spoiled
    rice and do what we could to restore some semblance of order below. But we couldn’t
    do much with the boat pitching as it was and we left the cabin in a sorry mess.William
    was waging a losing fight with the helm, for he couldn’t keep the bow headed into
    the wind more than a few seconds at a time. Once he’d get it set, the wind would
    shove us around again and we’d lie abeam of the waves at the mercy of every comber
    that came our way. The rain continued, adding its bit to the spray which kept
    the cockpit half awash. Only by using the handpump every ten minutes or so were
    we able to keep it from flooding.I saw that the most important thing right now
    was to rig up some kind of makeshift sail, so we could get some response out of
    the helm. A blanket tied to the stub of the mast and held in place with odds and
    ends of rope did the trick. The wind was so strong that a handkerchief would have
    helped, and the blanket did its duty admirably. The helmsman was able to keep
    the bow headed into the wind and we were even conscious that we were getting some
    speed out of the boat.We took one-hour watches that night, but the two who were
    supposed to be resting in the cabin had a nightmare existence. All the blankets
    were wet and our clothes in the same sodden mess. No one got any sleep. Lying
    in a sea-soaked cabin with our sorry predicament to contemplate and the driving
    rain to act as a lullaby wasn’t exactly soothing. I preferred to spend most of
    the time in the cockpit and it was lucky I did, as someone had to be on hand to
    man the pump.The following morning dawned—though we didn’t see anything that looked
    like dawn on the gray horizon—and we had much the same dreary prospect before
    us as we’d had the previous day. I’d cut down the mast and made some headway with
    the new sail, but that was about all. The swells were greater than ever; huge
    combers five or six meters high with mighty curling crests came rushing down on
    us, each one looking as though it had but one purpose—to swamp our boat. I rigged
    a higher sternboard out of canvas and part of an old beer case to help keep some
    of the water out of the cockpit. It worked after a fashion, though the spray made
    it necessary to pump every twenty minutes or so.The storm lasted four days; days
    of gray skies, frequent soaking rain squalls, and a constant leaden dampness in
    the air which held our spirits down to zero. The wind kept up, though it veered
    slowly from southeast to north, while we were pushed along in its path by our
    blanket sail. It was hard to work in the wind and rain, particularly with the
    tools we had at hand. But we finished splicing the stays and cut a mainsail to
    fit the new mast. Now we would have to wait for the storm to die down before trying
    to hoist the mast into position. I wondered how we were going to get that unwieldy
    length of wood on our shoulders in that pitching boat, in order to set it up.
    But there was no use worrying about that until I had to.Not once during those
    four days were we able to cook a meal. We lived on chocolate, a diet that was
    nourishing enough, but scarcely sufficient for anyone who was living and working
    as we were then. None of us had time for any philosophic consideration of our
    position or our chances of getting out of the mess alive. When there’s an immediate
    task to be done, you don’t have a chance to think. I don’t remember having a thought
    in my head, except in connection with the work at hand; either sewing sail, splicing
    rope, or handling the helm. We were too busy even to worry. Of course we groused
    a lot, but that’s a healthy sign and the more Dirk and William sweated and stewed
    the better I liked it. I don’t believe any one us slept more than a total of three
    or four hours during those hellish four days, and we felt groggy with weariness.On
    the morning of the eighteenth, it stopped raining and at about eleven o’clock
    a watery sunlight showed through the clouds. The mast was ready to be set up and
    the sails cut, so I decided to make the attempt that day. The cutter was still
    pitching heavily, but we couldn’t afford to wait much longer for better weather.
    It was no use, however. The mast was too heavy for us to lift on our shoulders
    on that unstable footing and after two hours of cursing and sweating we had to
    give it up.“Now what?” The question came from Dirk and from its tone I knew that
    he had about reached the depths of despair.“I’ll cut another hunk off it,” I said,
    trying to act as though this were going to be an easy job. I didn’t say that with
    a shorter mast, I’d have to recut the mainsail again. No use telling him all the
    bad news at once.I got to work with the breadknife, deciding to take another four
    feet off which would leave us with a mast about twelve feet long. I felt sure
    we could get one of that length on our shoulders and set it up. The boat rolled
    as much as it ever had, making my work on deck a precarious job. I braced myself
    with one arm about the mast stump and began the slow process of whittling at the
    wood, a sliver at a time.The sun disappeared an hour after its half-hearted appearance,
    and shortly after noon a heavy rain began to fall, one that seemed to have every
    intention of keeping on forever. I looked up from my work and saw Dirk handing
    one of the revolvers to William.“What the hell are you doing with that?” I shouted.Dirk
    clutched at the edge of the lurching boat and said grimly, “If we don’t get out
    of this and it doesn’t look as though we were, I’d rather die by a bullet than
    by drowning.”I didn’t answer him. I was beginning to feel pretty much the same
    way myself.
