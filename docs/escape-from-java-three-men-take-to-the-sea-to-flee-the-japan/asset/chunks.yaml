    # 第十二章

    '
- fmt: '

    WE couldn’t get the chronometer without telling someone what we intended to do.
    William knew someone in Batavia who had once done a lot of sailing. He found out
    that he still had his chronometer, but the only way he could get him to give it
    to us was to tell him all our plans. I hated to have to do this, for I was still
    operating on the theory that the fewer people who knew what we were up to, the
    less danger we would encounter. But I needn’t have worried about this man. He
    gave William the chronometer instantly when he knew we wanted to escape from Java.


    It was an old one and in pretty bad shape, but I was too glad to have it to complain
    about its deficiencies. The Japs transmitted a time signal from the Batavia radio
    station every night and I checked the chronometer with the signal. It showed an
    error of six and a half seconds every twenty-four hours and, knowing this, I felt
    I could correct my calculations from it.


    I had the sextant I had bought from the Chinaman, but this too was an old instrument.
    William, who walked around in town almost every day, had the luck to find a newer
    and better one. We decided to take this along instead of the one I had.


    ### The Planning and Maps


    The man who had formerly worked with a steamship company got some idea of what
    we were up to when William asked him for maps. For some reason he never suspected
    that I was going along on the trip and, knowing that William knew nothing about
    navigation, he questioned him as to who was going to navigate the boat.


    “You’re crazy if you don’t take someone along who has a navigation ticket,” he
    said.

    “What kind of a ticket do you have?” asked William, who realized that the fellow
    was hinting that he be taken along.

    “First mate,” he replied promptly.

    “Oh, well,” said William airily, “we couldn’t use you. You’d be parading the bridge
    too much.”


    The man looked pretty nonplussed at this answer, but he must have seen that we
    had no intention of telling him anything more of our plans. He never again suggested
    we take him along, but he was good enough to help us. He found an old almanac
    for us, a 1938 one which was better than nothing, though it was four years out
    of date.


    In an old book shop where we hunted for maps, we found two detailed charts of
    the Bay of Batavia, one which covered the area just off the shore near the city
    and another of the Sundra Strait region. There was a big gap between the two which
    left the area from the Thousand Islands to the mouth of the strait a blank. Try
    as I might I couldn’t find a chart for this section of the bay and I finally resigned
    myself to the fact that I would have to navigate it blind and trust to luck. If
    we ran into a coral reef—well, I wouldn’t allow myself to think what might happen
    to us. Certainly it would mean the end of our voyage at the very least.


    The chart of the Indian Ocean was harder to find, for they hadn’t been as much
    used by yachtsmen as charts of the bay. We finally had to fall back on a publicity
    map. This was nothing more than a geography-book idea of the ocean with a scale
    of one inch to 238 miles. It showed nothing about prevailing winds or currents,
    and as a navigator’s chart it was a dismal failure. But it was better than nothing
    and I was glad to have it.


    ### Preparing the Boat


    A week had passed since we had found the boat. We had gradually gotten it into
    shape and collected most of the things we needed. It began to look as though we
    could plan on a day for our getaway. We hadn’t dared store any of our supplies
    on board, for fear the Japs might seize it and take all the stuff we had so laboriously
    gotten together. All the food and instruments were still at my house and we intended
    to leave them there until the day we sailed. We worked out a careful schedule
    of how the boat was to be moved under the bridge and out to the outer canal. We
    weren’t going to put any of the stuff aboard until the boat was in this canal,
    because it would have to pass the lookout tower to reach there and this was going
    to be the most ticklish part of the trip. If the sentries got too curious while
    we were moving the boat and inspected it, all they would find was an empty sailing
    ship.


    The wire for the stays was still a problem. We couldn’t buy any, for the Japs
    had confiscated every bit of wire rope in the city. I knew a man who was an electrician,
    and I thought it quite possible that he had a quantity of used wire in his office.
    But he lived in one of the suburbs and all the way between his shop and my house
    I would have to run the risk of being caught. Moreover, I hesitated to go and
    see him because it was rather suspicious to ask for as much wire as I wanted.
    What could I tell him I needed it for?


    But at last I had to take the chance and appeal to the electrician. I told him
    some crazy story about needing the wire for a chicken coop—a tale that I wouldn’t
    have believed from anyone. He looked pretty doubtful, but at last he said I could
    have a few pieces if I would take it at night, so the Japs wouldn’t see me. I
    selected some of the longest and strongest pieces and took them home after dark
    on my bicycle. I don’t know what a sentry would have done if he had seen me. I
    wrapped the wire in old cloths, but it still made a suspicious-looking bundle.
    Fortunately, I didn’t meet a single sentry between the shop and my house and got
    the wire safely stowed with the other things.


    The next evening I took it down to the boat, still holding my breath for fear
    of being stopped, and showed the native boys how to rig it to the turnbuckles.
    Those turn-buckles had given us a lot of trouble. The original ones belonging
    to the boat were almost rusted away and I only succeeded in getting two new ones.
    I fixed at the sides of the boat and had to content with the old ones at the bow
    and stern. They weren’t any too strong and I hated to think what might happen
    when extra strain was put on them.


    ### Execution Strategy


    Now I could really see daylight ahead in our schemes. The boat was just about
    ready, seaworthy as we could make it with the material at our disposal. The boys
    had done their work, even though they were still scared the Japs wouldn’t like
    it if they found out they had been working on boat. But we paid them well and
    a little money went with them after weeks of near starvation.


    I decided that we would leave the following Monday. There were several reasons
    why Monday suited me best. It would give me Sunday for the multitude of last-minute
    preparations, and on Monday I would notify that I was sick. By the time the Japs
    came around to investigate my claim, I hoped to be far of reach. It always took
    them a couple of days at least to look into such claims, and I was pretty sure
    they’t show up until Tuesday.


    Wednesday night a blow fell that almost knocked our whole scheme. I was bicycling
    from work when I noticed there were an unusual number of sentries on the streets.
    It wasn’t long before I found out what they were up to. One of them stopped me
    at a street corner and asked to see my registration card. I showed it to him and
    pointed to my armband.


    “What’s going on?” I asked. “All European men between the ages of sixteen and
    sixty are being questioned,” he replied.


    I didn’t stop to wonder why he should bother to be polite and communicative to
    me. In a flash I realized that William and Dirk were in danger. They had no armbands,
    no valid reason for being in Batavia. They were just the kind of people the Japs
    liked to get their hands on young men who had nothing to do and might be potentially
    dangerous to the Japs. As soon as I got my registration card back from the sentry,
    I headed for home as fast as I could. I knew William and Dirk were waiting there
    and, if the sentries got to the house before I did, there was nothing I could
    do to save them.


    I saw, as I went along, that sentries were entering some of the houses and my
    heart sank. Suppose they had already called at my house and picked up the unsuspecting
    pair. I burst into the house at a run, deathly afraid that I was too late. To
    my overwhelming relief William and Dirk were lounging comfortably in the living
    room, quite unconscious of their danger.


    “What—” began William, but I cut him short. “Get into the kitchen both of you,”
    I yelled. “Don’t ask questions,” I went on, as William protested. “Tell you later.”
    They obeyed me, still looking as though they thought I had lost my mind, as well
    as they might in view of my action.


    Once they were safely hidden in the darkened kitchen I made a careful inspection
    of the backyard. I decided that if the Japs came into the house to search it William
    and Dirk could hide in the bushes and eventually scale the fence between my house
    and that of my neighbor. William and Dirk didn’t like the idea of hiding out.
    But when I drummed it into them that it was their one chance of avoiding the Japs
    and being able to make their escape from Java on Monday, they agreed to do what
    I told them.


    ### The Final Departure


    We didn’t have long to wait for the sentries. We heard a loud knocking and banging
    at the door. Only waiting to see William and Dirk’s heels disappearing into the
    bushes, I went to open it. But the Japs had entered the house without being invited
    and were already searching the front rooms by the time I reached the door. They
    questioned me and once more I produced my registration card and showed them the
    armband. The armband had its usual magic effect and, after going through the rooms
    to see if there was anyone else in the house, they left. I had made no protest
    to their search and my apparent goodwill must have had some effect on them. They
    asked if I was living alone and were quite ready to believe me when I said I was.


    Ten minutes after they had gone William and Dirk appeared in the kitchen. They
    were furious to think they would have to spend the rest of their time in Batavia
    hiding out, but I made them see that it was absolutely necessary. Now all the
    last-minute work of getting ready to sail must fall on me. But the greater part
    of it had been done, and in one way it was better for me to work alone with the
    native boys. Too many white men helping to move the boat would create more suspicion
    than one and two native boys.


    That evening when I went down to the dock to tell the boys when I planned to move
    the boat, I found to my amazement that the sentry across the river had been removed.
    Why this happened I’ll never know. But the Japs were always shifting their sentries
    and evidently this one was felt to be more useful elsewhere. There was no one
    sent to replace him, so for our purposes the Japs couldn’t have chosen a better
    time to get rid of one of the biggest stumbling blocks to my plans. I had been
    wondering what the sentry would do when he saw us move the boat, but now I needn’t
    worry any longer. It almost seemed though the Japs were playing into our hands.


    I told the boys that on Sunday night, right after dark, I wanted them to take
    the boat out under the bridge, past the lookout tower and around to the opposite
    side of the fishing wharves. These wharves were between the tower and the dock
    where I planned to moor the boat, so that the sentries could not see it during
    the daylight hours on Monday. Then Monday evening, as soon as it was dark, I told
    them to move the boat again, this time across the canal to a dock that connected
    with the highway leading from Batavia.

