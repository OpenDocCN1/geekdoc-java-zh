    the—“ began William, but I cut him short.“Get into the kitchen both of you,” I
    yelled. “Don’t ask questions,” I went on, as William protested. “Tell you later.”They
    obeyed me, still looking as though they thought I had lost my mind, as well they
    might in view of my action. Once they were safely hidden in the darkened kitchen
    outside the house, I made a careful inspection of the backyard. I decided that
    if the Japs came into the house to search it, William and Dirk could hide in the
    bushes and eventually scale the fence between my house and that of my neighbor.William
    and Dirk didn’t like the idea of hiding out. But when I drummed it into them that
    it was their one chance of avoiding the Japs and being able to make their escape
    from Java on Monday, they agreed to do what I told them.We didn’t have long to
    wait for the sentries. We heard a loud knocking and banging at the door. Only
    waiting to see William and Dirk’s heels disappearing into the bushes, I went to
    open it. But the Japs had entered the house without being invited and were already
    searching the front rooms by the time I reached the door. They questioned me and
    once more I produced my registration card and showed them the armband. The armband
    had its usual magic effect and, after going through the rooms to see if there
    was anyone else in the house, they left. I had made no protest to their search
    and my apparent goodwill must have had some effect on them. They asked me if I
    was living alone and were quite ready to believe me when I said I was.Ten minutes
    after they had gone, William and Dirk appeared in the kitchen. They were furious
    to think they would have to spend the rest of their time in Batavia hiding out,
    but I made them see that it was absolutely necessary. Now all the last-minute
    work of getting ready to sail must fall on me. But the greater part of it had
    been done, and in one way it was better for me to work alone with the native boys.
    Too many white men helping to move the boat would create more suspicion than one
    and two native boys.That evening when I went down to the dock to tell the boys
    when I planned to move the boat, I found to my amazement that the sentry across
    the river had been removed. Why this happened I’ll never know. But the Japs were
    always shifting their sentries and evidently this one was felt to be more useful
    elsewhere. There was no one sent to replace him, so for our purposes the Japs
    couldn’t have chosen a better time to get rid of one of the biggest stumbling
    blocks to my plans. I had been wondering what the sentry would do when he saw
    us move the boat, but now I needn’t worry any longer. It almost seemed as though
    the Japs were playing into our hands.I told the boys that on Sunday night, right
    after dark, I wanted them to take the boat out under the bridge, past the lookout
    tower and around to the opposite side of the fishing wharves. These wharves were
    between the tower and the dock where I planned to moor the boat, so that the sentries
    could not see it during the daylight hours on Monday. Then Monday evening, as
    soon as it was dark, I told them to move the boat again, this time across the
    canal to a dock that connected with the highway leading from Batavia. We had to
    make this second move, as we were to load the boat just before leaving and we
    couldn’t do this at the fishing wharf without taking a lot of unnecessary trouble
    and risk.The last few days seemed endless. I couldn’t concentrate on my work at
    the office and spent most of my time going over and over in my mind all that I
    must do on Sunday and Monday. Now that our plans were so near fulfillment, they
    began to look perfectly insane. How could we expect to get away with it? I asked
    myself over and over again. There were a thousand risks to be taken, a thousand
    chances of failure. Any small slip-up in our time schedule, an unlucky questioning
    by a sentry, or another search made at my house might easily blast our hope of
    escaping.
