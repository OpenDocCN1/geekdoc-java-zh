    high-voiced rendition of “Swanee River.” For the moment the boat was safe.Monday
    morning I sent my servant to the office with a note saying I was ill. This would
    explain my absence and I could only hope that the Japs wouldn’t start their investigation
    of my sick claim that day. There were many people I should have liked to see again
    before I started, but I didn’t dare for fear of their getting in trouble with
    the Japs after my escape was discovered. So I left Batavia, my home for twenty-two
    years, without saying farewell. I just disappeared.Darkness came and with it the
    two native boys, who had already moved the boat again. I had hired a native cart
    to carry the bundles and we soon had it loaded with the food and sails. Now the
    real danger was beginning. If the cart were stopped and searched, there was no
    ready-made story to explain the food supply. The Japs would know something was
    up and there would be nothing I could say to make fifty kilos of rice and all
    those canned goods look innocent.I went ahead on my bicycle and left the boys
    to follow with the cart. I hoped to be able to warn them of any potential danger,
    so that they could turn back in time. Our little cavalcade hadn’t gone fifty yards
    before I saw that we were in for a bad time. The street was full of carts, carrying
    household effects, for, as I have said, many people were moving at this time and
    most of them did it at night when there was less bother from the sentries. But
    tonight dozens of extra sentries had been posted who were inspecting the carts,
    perhaps to see if they carried anything the Japs could use. My heart sank to my
    heels and I stopped where I was. Ten yards behind me the cart, too, halted. Should
    I turn back and wait for a more opportune moment or should I keep on? If we didn’t
    get the stuff aboard that night and make our getaway, our whole scheme of escape
    might be ruined. We would have to hide the boat again and go through this whole
    procedure once more.Then I noticed something that gave me a ray of hope. The sentries
    inspected most of the carts, but every once in a while, for no apparent reason,
    they let one go by without looking at its contents. Perhaps our cart would be
    one of the lucky ones. I decided to take the chance. Gesturing to the driver to
    follow me, I mounted my bicycle and went slowly forward. Not once did I look behind
    me to see whether the cart was still following. I didn’t dare.Holding my breath
    I went steadily forward. Past one group of sentries, past another that had stopped
    a cart. I didn’t look at the sentries. My eyes were fixed straight ahead. It is
    over five miles from my house to the fishing wharf and I don’t believe I took
    a deep breath the whole way. Once we were outside the thickly populated section
    of the city and in the business district, the sentries were not so thickly posted.
    I sneaked a glance behind me. The small, underfed horse was still ambling along,
    its head down and its weary feet plodding patiently on the pavement. The cart
    had not been stopped. I still didn’t dare congratulate myself. We hadn’t reached
    the boat yet and a hundred risks and dangers might lie in wait for us.But we avoided
    them all. We passed three more sentries, all of whom merely stared at the tumble-down
    cart with its native passengers and the bulky bundles heaped inside it. The whole
    equipage looked too disreputable to be worthy of notice and the Japs let it pass
    unchallenged. By the time we reached the dock, our immediate troubles were over.
    Except for the sentries in the lookout tower, there wasn’t a Jap in sight. It
    was too dark for these sentries to see what was going on below, and for the first
    time in what seemed hours I took a long, full breath.Now that I look back on it,
    I realize what I was too busy to think much about at the time—the almost incredible
    luck we had in making our preparations for escape. Though we had many close calls,
    innumerable breathtaking moments, we never once were challenged by the Jap sentries
    while working on the boat. The nearest any of us came to a run-in with the police
    was a brief encounter between William and a native patrolman. Returning to the
    house one evening, he was stopped by a native who asked to see his registration
    card.William hesitated a second to do some quick thinking. His card had been issued
    at Bandung and he knew that this fact alone would make the policeman wonder what
    he was doing so far from home. He made a pretense of searching in his pockets
    and then said carelessly:“Must have left it at home. Come along and I’ll show
    it to you there.”“You’ll have to come to the station with me to report,” replied
    the policeman, taking William by the arm.“Rot!” exclaimed William, making a great
    show of annoyance. “I’ve been up to the station several times. They know all about
    me there. No use bothering with all that again.”The policeman, who didn’t care
    to overwork himself for the Japs in any case, shrugged his shoulders and let go
    of William’s arm. He probably didn’t believe the bluff, but he was too apathetic
    about his job to make a point of it.Before he could say anything more, William
    bid him good night and disappeared up the street at a fast clip.That was our only
    direct challenge from either the police or sentries. It was luck that did the
    trick for us; without that blessing, we would still be in Batavia.On that Monday
    night the darkness was also our salvation. Usually the area around the wharves
    is lighted by hundreds of kerosene lamps, the native means of illumination. But
    the Japs had confiscated all the kerosene and now the natives had to go without
    lights. We could hear them singing in the darkness as we quickly unloaded the
    bundles and stowed them aboard, heaping them into the cabin any which way. There
    was no time for orderly arrangement of our stores now. As they worked, the two
    native boys joined in the songs coming from the darkened houses surrounding the
    wharf. The mournful, dirge-like melodies made a dreary accompaniment to our work.The
    boys had begun to get curious when they saw the stuff I was stowing aboard and
    their questions became pretty embarrassing. You wouldn’t need all these food supplies
    for a trip to the islands in the bay, and it didn’t take much intelligence to
    see that I had some other plan in mind. But money will cure most ills, even curiosity.
    The bonus I paid them, when the food and sails were safely aboard, was well spent.
    They realized they weren’t to ask questions and the money shut them up like a
    charm.Leaving them to guard the boat, I mounted my bicycle again for the final
    trip to town. When I returned, William, Dirk, and the rest of our supplies, the
    precious instruments and charts, would be with me and we would be ready to leave.
    On my way back to the house, I saw to my delighted amazement that the extra sentries
    had been withdrawn and now only the usual guards were posted at the street corners.
    I thought of the risks I had taken to get that first load down to the boat and
    what I might have avoided by waiting an hour or so. But the stuff was safely aboard,
    so I didn’t waste any time in thinking about that first trip.William and Dirk
    were wild with anxiety to get started and had loaded themselves with all the equipment
    they could carry. Each of them had stowed a revolver under his shirt, leaving
    three more to be disposed of. They protested when I decided to stuff all three
    under my belt, but I wasn’t going to let them out of my hands. I’d hired a tricycle
    to get this last load to the wharf and told William and Dirk to ride atop the
    load. Once the last of our stores was packed and William and Dirk were waiting
    in the tricycle, I took a last look about my house. There was no time for sentimentality.
    I just locked the front door and put the key in my pocket. Next time I came home—well,
    who could tell when that would be?Once again I went ahead on my bicycle. Now it
    was well into the evening. Except for the sentries posted under the street lights,
    there was no living soul in sight. I wondered what those Japs would do if they
    knew that the man riding past on a bicycle had three revolvers concealed under
    his belt. The revolvers were heavy and kept slipping down, so that I had to ride
    with one arm pressed close to my side to hold them in place. The sentries just
    stared at me. I saw one of them picking his teeth. Perhaps they were tired from
    their recent exertions in searching the carts. They looked utterly disinterested
    in me and in the tricycle following behind—a vehicle loaded with nautical instruments
    and carrying two men who had been in hiding for almost a week. What a catch those
    sentries would have made if they had felt inclined.As we neared the business district,
    almost totally deserted after darkness fell, we passed the last sentry post. Two
    men were stationed here. I saw one of them gesture toward me and then at the tricycle.
    My hand crept toward the handle of one of my revolvers. If they stopped us, it
    meant our end.I was going to take those sentries with me, if it came to a shooting
    match; take them wherever one goes when a bullet stops you. But the other sentry
    shrugged his shoulders and turned away. He wasn’t going to bother and his companion
    didn’t care enough about us to argue. They let us pass unchallenged.We reached
    the wharf, safe at last in the darkness of the night. The native boys were waiting
    to help us throw the last of our stores aboard. The sails were set, everything
    ready at long last. I gave my bicycle to the boys.“It’s yours,” I said. “Keep
    it for me until I come back.” I jumped into the boat and grasped the helm. “Let
    her go,” I directed William in a tense whisper. He untied the line and shoved
    the boat away from the wharf with both feet.“Slamat belayar, tuan, slamat belayar!”“Happy
    voyage, sir, happy voyage!” From the blackness of the wharf, already invisible
    behind us, the voices of the two boys followed us into the night. It was our farewell
    to Java.
