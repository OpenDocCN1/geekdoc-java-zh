    # 第三章

    '
- fmt: '

    THE Japs were closing the jaws of a trap about us. They had control of `Sumatra`
    to the west and now they began bombing `Timor` and `Bali` to the east. Our planes
    and ships, with the aid of the British and American units that had been sent to
    hold `Java`, went out to meet the swarming, always more numerous Jap ships and
    planes. On `Timor` and `Bali` our land army fought fiercely. But we hadn’t enough
    men or machines to meet the attack. The Japs landed at `Timor` and `Bali`, taking
    their losses as part of the price of eventual victory. They secured their positions
    around `Java`, tightening their jaws to swallow us.


    Finally Australian and American troops landed on `Java`. Their presence was heartening
    and disheartening at the same time. If our Allies were landing troops, they must
    feel there was hope for the island, but we saw how few of them came. The natives’
    morale rose with a bound at the sight of the Americans. These easy, confident
    men looked enormous to the small-sized Indonesians. “Long live America,” they
    shouted, whenever they saw an American soldier. “You will beat the dwarfs!” An
    American looked a match for a dozen tiny Japs. But there were too many dwarfs,
    even for the Americans—too many and too well equipped.


    ### The Battle of the Java Sea


    It was the Battle of the Java Sea, immediately following the Jap landings at `Timor`
    and `Bali`, that decided the fate of `Java`. A tremendous Jap convoy was sighted
    in the waters between `Borneo` and `Java`. It was headed in our direction. Our
    last chance had come to ward off the fate which hung over us. Outnumbered, outgunned,
    `Admiral Helfrich` sent the last of his ships to meet the attack. He must have
    known that the battle was lost, even before it began, but, if the Japs were going
    to take `Java`, they were going to pay for it; and the price for this richest
    isle of the Indies was high. Five Jap cruisers, three destroyers, and seventeen
    transports were sunk or crippled by our ships.


    We started the war with five cruisers. Two were lost in the Battle of the Java
    Sea, as well as an undisclosed number of destroyers and lighter naval units. Though
    we sank more ships than the Japs, the contest was unequal. They always had more;
    we had lost the strength of our fleet. Our last naval base in the Indies was threatened.
    To all intents the battle for `Java` was lost when the score was reckoned after
    that heroic sea engagement. Now `Java` lay open to the invaders, for with the
    loss of our planes in the defense of `Malaya` and the islands outside `Java`,
    our land forces were easy prey for the Japanese bombers and fighters.


    ### The Defense of Java


    The Japs wasted no time. It was too late for the few hundred planes that might
    have saved us; for the necessary troops to bolster our army, aided by the few
    thousand Allied soldiers. The Jap plan of attack was obvious. We knew where they’d
    strike and we’d made what preparations we could to meet them. The north coast
    of `Java` is flat, broad and open. There are no natural defenses there, no hope
    of guarding it with the forces at our command. Our main bastion was at `Bandung`,
    where `General Headquarters` had been established within the encircling hills
    of this inland city on the west.


    All roads leading to `Bandung` were mined, every mountain pass was planted with
    explosives. It was here that we were to make our last stand for `Java`. The Japs
    landed from barges at four points on the island; at the east and west and at `Indramayu`
    and `Rembang` on the north coast. They made for the airdromes in the interior.
    Those that came from `Indramayu` were headed for `Kalijati`, the big airport at
    the foot of the mountains surrounding `Bandung`. In the east they immobilized
    the area around `Surabaya`, our naval base. They came inland from `Indramayu`
    and cut the railroad between `Batavia` and `Surabaya`. The forces from `Rembang`
    headed for the oilfields at `Tjepu`, which the Dutch destroyed before they left.
    With rapid, slashing strokes they cut up the northern coast and flanked `Batavia`
    and `Surabaya`. They pushed on toward `Bandung`. Within two days they were thirty
    miles from the mountain fortress.


    The conquest of `Java` wasn’t easy for the Japs. Though our troops were pitifully
    under-supplied with artillery and had insufficient mechanized equipment, they
    fought wherever they could hit a Jap and gave the enemy a harrowing few days.
    Bridges, roads, and airdromes were wrecked before the Japs came. Everything of
    military value was destroyed by the retreating forces, who left nothing but ruin
    behind them. We slowed the Japs, but could not stop them. Our planes had fought
    well while they lasted, but, once a plane was shot down, there wasn’t another
    to take its place to defend `Java`. The Jap troops came nearer to `Bandung` along
    the mined roads, across the devastated areas the Dutch had left in their wake.


    There was no chance for guerrilla warfare on the plains of `Java`. It is too densely
    populated, too thickly overlaid with roads and railways. With 821 people living
    within each square mile a guerrilla has nowhere to hide. Much of the island is
    flat, open country, in spite of the volcanic mountains in the interior. We had
    no choice but to stick to the one feasible plan of defense; to make a stand at
    `Bandung`.


    ### The Fall of Batavia


    At `Batavia` we knew the end was near. Rumors spread that a huge force of American
    troops was on its way to help us; that an Allied fleet was even now preparing
    to attack the Jap transports which brought the invaders to `Java`. Though we listened
    to these stories, we knew them to be false. Then, five days after the initial
    Jap landings, `Batavia` had to be evacuated by the army, as the railway to `Bandung`
    was threatened. Before leaving, the army destroyed everything in the city that
    might be of value to the Japs: the major government buildings, the harbor works
    at `Tanjung Priok`, all the oil-storage tanks and other industrial works. All
    private cars were commandeered to get the soldiers to `Bandung`, where they were
    to join in the defense of that stronghold. Those cars which the army could not
    use were dismantled. Only a few government automobiles were left on the streets.


    Thus when the Japs came to `Batavia`, the entire population was there to face
    them. No private citizen had been able to leave the city, for there was no transportation.
    Indonesians and Europeans alike were on hand to take whatever treatment the invaders
    chose to give them. `Batavia` fell on March 5, 1942. At seven-thirty that evening
    the Resident sent volunteers out with white flags to receive the commander of
    the enemy forces, west of the city.


    I was a civilian member of the `Netherlands Army`, delegated to carry on my work
    in `Batavia`. My job was in the office of one of the public utilities, a position
    I had held for several years. Just a few days before the occupation those who
    did essential work were instructed by the Dutch government to stick by their jobs.
    The only precaution we took for our personal safety was to destroy our uniforms.
    We’d get a better chance with the Japs if they thought we were civilians. So I
    had a front-row seat for the tragedy which followed.


    Though I had seen nothing of the actual battle for `Java` and, except for the
    ineffectual and occasional bombing of the city, had experienced none of its reality...
    [rest of text processed]

