    # 第十四章

    '
- fmt: "\nA STIFF breeze on our port quarter pushed us out into the canal. The little\
    \ cutter, glad to be released from its long idleness, seemed to skip over the\
    \ water, drawing a long green trail of phosphorescent light behind her. Stretching\
    \ out on either side of us were the long jetties which formed the entrance to\
    \ the canal. The one at our right was submerged under the high tide waters; that\
    \ to our left dimly visible in the gloom.\n\n“Watch that jetty on the right,”\
    \ I cautioned, still speaking in a whisper. “We don’t want to—”“What’s that!”\
    \ William, crouched in the bow, sounded frightened. \n\n“That” was a faint light\
    \ playing fitfully at the end of the pier near the lighthouse. The big light was\
    \ out, as it had been ever since the Japs came, but the flashlight told us that\
    \ someone, probably a Jap sentry, was on duty at the end of the jetty.\n\n“We’ll\
    \ duck out the side entrance,” I decided, remembering with a rush of thankfulness\
    \ the small opening in the sea wall to our left.\n\nI was at the helm with both\
    \ William and Dirk posted in the bow to warn me of obstacles in the darkness ahead.\
    \ It was a piece of luck that I found the opening in the wall on the first try.\
    \ We slipped through it and out into the bay.\n\n“Fifty per cent of our troubles\
    \ are over,” I announced somewhat dramatically. “We’ve only got the sea to fight\
    \ now.”\n\nWilliam and Dirk groaned in unison. “Only the sea,” said Dirk mockingly.\
    \ To them the sea with all its unknown terrors was as great a danger as anything\
    \ we had been through ashore. But I knew something about the sea and felt more\
    \ confidence than they.\n\n“What about the Jap patrol in the strait?” asked William.\
    \ “That’s not going to be any picnic.”\n\n“We’ll run the strait at night,” I told\
    \ them. “By morning, with this wind, we ought to be at the north end of the strait.\
    \ We’ll drop anchor and—”“Good God, look out!” This time William fairly screamed\
    \ the warning.\n\nMy heart jumped and I jammed the helm over to avoid whatever\
    \ it was that William saw ahead. Not fifty yards before us were several dark shapes\
    \ looming huge and menacing on the oily blackness of the water. I recognized them\
    \ at once and began to laugh shakily.\n\n“They’re prahus lying at anchor,” I explained\
    \ to the indignant William. “We’ll give them a wide berth.” I swung to starboard\
    \ and passed the motionless prahus without rousing the sleeping natives aboard.\n\
    \nI headed away from the shore out toward the open bay. Even here I knew we were\
    \ running a tremendous risk, for coral reefs and tiny islands dotted the bay like\
    \ plums in a pudding. Just north of us were the Thousand Islands, countless miniature\
    \ landmarks, each one spelling possible ruin to our boat. The wind had shifted\
    \ south, a brief spanking breeze that carried us along at a clip which would take\
    \ us direct to the mouth of the strait, but at a speed that would stove in the\
    \ hull, if we should strike a hidden shoal. I reefed the mainsail, the only canvas\
    \ we carried aloft at the moment, and prayed for luck.\n\n“Dirk!” I cried suddenly.\
    \ “Come here and take the helm. William, you stay on watch and yell the minute\
    \ you see anything ahead. I want to go below and take a look at the chart.”\n\n\
    Dirk came back and I set the helm for him. In the cabin I grabbed a flashlight\
    \ and directed its beam for an instant on the chart. In that quick glance I saw\
    \ that we would soon be out of the area showing on this chart and into the unknown\
    \ portion of the bay for which I had no chart. I snapped off the light. There\
    \ was no use worrying. We’d just have to go ahead and trust to luck to get us\
    \ through.\n\nOnce again on deck I peered forward. Directly in our path was the\
    \ long low outline of an island. Why hadn’t William seen it?\n\n“What’s the matter\
    \ with your eyes?” I shouted, grabbing the helm from the frightened Dirk. “Don’t\
    \ you see that island?”\n\nMy eyes, more accustomed to the darkness and knowing\
    \ what to look for on the sea, had spotted the vague shape which was not at all\
    \ apparent to William. We swung around the small island, missing it by a bare\
    \ ten feet, while William, too chagrined to make an answer for once, sat glumly\
    \ in the bow.\n\n“You’ll get used to spotting them,” I consoled him, feeling better\
    \ now that the danger was past. “But keep your eyes open.”\n\nThoroughly alert\
    \ now, William and Dirk, who had once again joined him at the bow, redoubled their\
    \ efforts and soon were as quick as I to spot the looming shapes on our path.\
    \ Their warning cries gave me an ample margin of safety and we avoided them all.\n\
    \nThe prevailing wind in the Java Sea is generally south at night, shifting to\
    \ the north during the day. I knew we could expect the favorable south wind until\
    \ daylight and by that time I hoped to have covered the sixty miles from Batavia\
    \ to the mouth of the strait.\n\nNo one thought of getting any rest that night.\
    \ Except for an occasional trip below to flash my light for an instant on the\
    \ charts, hoping to find that we had passed through the area which neither of\
    \ my Java Sea maps showed, I stayed at the helm all night. We didn’t talk much.\
    \ We were too tense even to think. At any minute we expected a Jap patrol boat\
    \ to show up or to find ourselves rammed against a hidden reef, powerless to move.\
    \ None of us had thought of getting any supper before we left, but we weren’t\
    \ hungry even now. You can go without food and nourish yourself on anxiety indefinitely,\
    \ if you have to.\n\nOccasionally one of the reefs or shoals showed a light. All\
    \ of them had been marked before the Japs came, but under their rule, the buoys\
    \ and lights had been neglected and only a few were working. But these few were\
    \ a tremendous help and their tiny winking lights seemed to signal a message of\
    \ hope.\n\nA pale glow was showing in the eastern sky, when I made another trip\
    \ to the cabin to look at the charts. I gave a long sigh of relief. In the faint\
    \ early light I had noted our position in relation to the visible islands. Now\
    \ I knew that we had passed safely through the uncharted area and were in the\
    \ region marked on my chart of Sunda Strait. We had made it, in spite of the darkness,\
    \ all the countless reefs and shoals in our path. What fate had led us through\
    \ this perilous passage, we didn’t try to determine. Ahead was the strait, patrolled\
    \ as we had been warned by planes and ships. Our troubles weren’t over yet.\n"
