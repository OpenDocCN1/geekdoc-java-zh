    that I might need and went to see him. He gave me an old mainsail, much too big
    for the cutter, but it could be cut down if we needed it. I wanted to get as much
    spare canvas as possible, as most of what we had wasn’t in first-class condition.
    A heavy wind might easily tear any of the sails to ribbons and I would need plenty
    of extra canvas to work with.While the native boys worked on the boat, all three
    of us were kept busy trying to collect the rest of the necessary equipment. I
    tried to buy sail needles but there weren’t any to be had, and I was forced to
    content myself with twenty of the biggest darning needles I could find. Sail thread
    was another thing we couldn’t get, so we bought ordinary heavy cord. I didn’t
    look forward to mending and making sail with these, but they would have to do.I
    remembered a fifty-gallon tank which had once been used on a camp trip. I had
    given this tank to one of the native boys, before the Japs came, telling him that
    he might find it useful in case the city water supply was shut off. He had installed
    it in his backyard and now I told him to bring it to the dock. It arrived one
    evening and we had some difficulty in getting it through the hatchway. Once inside
    it filled half the available space, but water was the prime requisite of the trip
    and we didn’t mind sacrificing comfort for a sure water supply. We braced the
    tank with wooden blocks, so that it wouldn’t move when the boat heeled.We were
    making progress, but there were still plenty of things we must have before we
    could think of leaving. Among these necessities were a chronometer, sea charts,
    and an almanac. Even more important was wire for the stays. There wasn’t a foot
    of wire to be bought in Batavia. It began to look as though we had gone through
    all this suspense, trouble, and danger for nothing. Without wire and the sea charts
    we might as well stay where we were.
