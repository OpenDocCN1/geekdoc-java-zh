    were banknotes corresponding to our five and one guilder notes and even for one-cent
    notes. The Japs forced this script on the people of the conquered countries in
    exchange for real currency. It wasn’t worth the paper it was printed on, but the
    Japs used it to help along their “co-prosperity.” It doesn’t need much insight
    to see who prospered by this exchange of banknotes.The refugees also told of the
    Jap paratroops who had been principally responsible for taking Palembang. They
    were heavily armed when they landed from the sky, and the Dutch and Indonesian
    troops who were there to meet them were pitifully outnumbered. But our men charged
    into the Japs, armed only with bayonets. Of course, against such a well-equipped
    enemy they could do nothing, but they weren’t going to let that stop them from
    trying. They fought themselves to death, and thus gained time for the destruction
    squads to do their work. Palembang fell but the riches of southern Sumatra were
    demolished. No oil for the Japs.'
