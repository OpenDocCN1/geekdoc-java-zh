    whole appreciate the advantages that the white people have given them; the tremendous
    improvements in sanitation, the modern schools which anyone is free to attend,
    and, above all, the wisdom the Dutch have shown in allowing them to lead their
    own lives and pursue their own interests.The Chinese in Java have fitted themselves
    into the island life so well that they are a welcome and necessary part of it.
    Generally speaking, the Chinese are the shopkeepers. They operate good stores
    and give liberal credit to the natives; something which is highly appreciated,
    though it sometimes leads to usury. The fact that the Chinese show a profit under
    this system at the end of a business year is a major miracle. But they flourish
    under it and many of them are third and fourth generation Chinese. In every sense
    of the word they are loyal and essential citizens of the country.But long before
    the shadows of war began to fall on the Indies, the scant Japanese population
    in Java was an “outside element” in the peaceful island life. Though the four
    or five thousand Japs among the teeming millions in Java were scarcely noticeable,
    they succeeded in making themselves felt. Perhaps their pushing ambition, their
    determination to “get ahead,” were not understood in Java. A native Javanese is
    happy as long as he has a belly full of rice. A Jap wants something more. In Java,
    as we were soon to discover, he wanted complete pictures of the military and naval
    fortifications, of the roads, railways, and harbor works. The barbers, hairdressers,
    and, above all, the photographers who carried on their business in Batavia and
    elsewhere saw that the Son of Heaven got these pictures. The photographers in
    particular were in an ideal position to get what they wanted from Java. A major
    in the Japanese Army worked for several years as a photographer on one of the
    main streets of Batavia. He is probably a general now.The influence of Japan itself
    was not considerable in Java. By 1939 the Japanese exports to the Netherlands
    Indies were but fourteen per cent of the total imports of the Indies, while our
    exports were considerably less. It was in the fall of 1940 that representatives
    of the Empire of the Rising Sun came to Batavia to suggest to the Dutch government
    that Japan would be only too willing to help share the white man’s burden in Java.
    After allowing the representatives to cool their heels for several months, the
    Dutch officials politely told them that they could get along very well without
    Japanese “co-prosperity.” They were committed to the development of the country
    on behalf of the Indonesians and couldn’t take on any further obligations. The
    Japanese trade commission returned home in the middle of 1941 with much loss of
    face and a rankling grievance against the Dutch.But this visit of the Japanese
    economic experts was not the first intimation that the Netherlands government
    received that the island empire to the north was in danger of becoming a yellow
    peril. As early as 1930 the Dutch knew that the Japs were building up a strong
    military machine and that they had no intentions of using it merely for show purposes.
    Though this was long before the “incident” in Manchukuo and an enemy invasion
    of Java seemed as remote as a threat from Mars, plans were made to blow up the
    oil fields and other industrial developments in Java and to destroy the tin-mining
    islands, such as Bangka and Billiton, in case of attack.Plans like this were necessary
    in view of the military situation in the Indies. The East Indies are spread over
    an area as large as the United States and they consist of countless islands, some
    of which are in a relatively primitive condition, many of them sparsely settled
    and all so widely scattered that a military defense system for the entire group
    is an impossibility. Therefore, it was principally Java, the seat-of government
    and the most important island, that the Dutch hoped to defend from aggression.Ten
    years ago, when I was eighteen, I took my year’s military service, as all Europeans
    in the Indies are required to do. Every four years a compulsory refresher course
    was given, so that the white population as a whole knew what army life was. It
    wasn’t until 1941 that the Indonesians were conscripted, though many of them served
    voluntarily in the militia.By the end of 1941 there were about a hundred thousand
    men in the army, some Dutch but most of them native. This was a relatively small
    number to defend an island like Java with its exposed coastline and few natural
    defenses. But we couldn’t get the matériel to equip more. The navy was no better
    off. It consisted of five cruisers, twenty submarines, six or eight destroyers,
    and a few torpedo boats with auxiliaries. The naval base at Surabaya on the eastern
    end of the island is a naturally fine harbor, large enough to base a navy twenty
    times the size of ours. But those few ships were all we had. The air force was
    more promising. We had at the end of 1941 four hundred fighter planes and bombers,
    most of which, however, were not the latest type and were inferior to the Japanese
    Zero.The weakness of our Army, Navy, and Air Force was no fault of the Netherlands
    Indies government. The Indies have no heavy industries and they are consequently
    dependent upon the industrialized countries for tanks, guns, planes, and other
