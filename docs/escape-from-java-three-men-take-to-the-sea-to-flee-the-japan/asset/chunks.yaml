    # 第十一章

    '
- fmt: '

    THERE was no sentry in sight. We hid our bicycles behind a near-by building and
    ducked down to the wharf, moving cautiously in case we came upon a sentry by surprise.
    The boat lay at an obscure little dock, behind a native shipyard. It was a little
    twenty-five-foot cutter, with all the characteristics that made her a lively little
    sailboat. She had no bowsprit and a beam of eight feet. A small ship for a three-thousand-mile
    voyage, but I knew at once that she was the boat that was going to take us to
    Rodriguez.


    “Hey!” William sounded frightened. “There’s a sentry over there across the river.”
    He pointed toward a soldier who was patrolling on the opposite bank, evidently
    guarding the warehouses there.


    “Never mind him,” I answered grimly. “I’m going to inspect this boat. You fellows
    keep out of sight.”


    They protested, but I was determined to get a look at the cutter. I wanted to
    see what condition she was in and what we would have to do to outfit her for the
    voyage. The sentry looked in my direction, but made no move to challenge me. He
    watched me apathetically for a short time and then resumed his dreary beat.


    I lost no time in giving the cutter a quick inspection. She had an open cockpit
    with only a two-and-a-half-foot freeboard, not a safe margin if we ran into heavy
    seas. Another point against her was the fact that the cockpit was not self-draining.
    In case of water coming in over that low freeboard, we would have one devil of
    a time pumping with the handpump. But I didn’t give such drawbacks a second thought
    then. You can’t expect to get just what you want when you’re stealing a boat from
    under the noses of the Japs. There were plenty of good points in the boat’s favor
    to offset those I could find fault with.


    She was strongly built, copper riveted throughout with heavy teakwood ribs and
    planking. The bow and stern were the same, so she would stand a following sea
    well and a following sea was what we could expect to get. The cabin was small
    with only one berth, but there were possibilities of rigging up a second one.
    There were several lockers in the cabin and plenty of room in the bow to stow
    sails and other bulky stuff.


    After noting these things, I began making a hasty calculation of what we would
    need to do to make her ready for the trip. All the stays were rusted away, the
    mast was in bad shape and the decks needed caulking. But these things could be
    done without too much trouble, though we would need help. William and Dirk didn’t
    know anything about a boat and I wouldn’t be able to get away from the office
    for long enough periods to get the job done quickly. I remembered the two native
    boys who had helped me in buying my food supplies and felt better. Both of them
    had some experience in painting and I knew they would be able to do what had to
    be done under my instruction.


    “Hey!” It was William’s voice again. “There’s a native boy here who says he’s
    in charge of this boat.” I left the boat and joined William and Dirk on the dock
    where they were keeping out of sight of the sentry on the opposite shore. They
    were talking to a small Indonesian, who seemed pretty excited to find someone
    meddling with the cutter.


    “This ship belong to tuan who live in city,” he announced.


    The boy explained, after my questioning him for some time, that the Chinese tuan
    who had hired him to watch the boat was an employee of the original owner. When
    I asked him if this man had the sails, boom, and rigging for the cutter, the boy
    didn’t know. He just shrugged his shoulders and acted scared.


    “Look here,” I said firmly, pointing to my Kempei armband. “I need this boat in
    my work. I have permission from the Japanese government to take over the boat,
    so you needn’t be afraid.” I gave him some coppers to look out for the boat and
    he felt better. He seemed to believe my story. With the coppers to grease his
    palm I felt pretty sure he would do as I told him. He said that the tuan came
    down to the dock occasionally to see the boat, and I hoped he would come again
    soon. If this man had the sails and other rigging, much of our outfitting trouble
    would be over.


    “How are we going to get the boat fixed up with that sentry watching us all the
    time?” asked Dirk, as we rode away. I confessed that this had been worrying me,
    too. I only hoped that if he ever challenged us, he would respect my armband.


    “We can’t let him stop us,” I said impatiently, for Dirk was rather prone to find
    difficulties. “The worst of this boat is its position. When we get it outfitted,
    we’ll have to take it out to the main canal under that drawbridge. The lookout
    tower is right beside the bridge and that’s going to be a ticklish business. Luckily
    the mast is a folding one, so we can lower it to get under the bridge and not
    run the risk of having to raise the drawbridge when we go through.”


    We found the cutter on a Wednesday in mid-June and it wasn’t until the following
    Sunday that I was able to get in touch with the two native boys. When I told them
    that I wanted them to work on a boat for me, they refused pointblank. Though they
    had been out of a job for three months, they weren’t any too anxious to work for
    me as they were scared of getting into trouble with the Japs. It was only when
    I told them I had permission to use the boat that I could get them reluctantly
    to agree. The idea of having a job helped some, for they had been having a tough
    time getting enough to eat in the past few weeks. But they still weren’t any too
    keen about the work, and it took constant prodding to keep them on the job.


    I had succeeded in getting some oakum to caulk the deck, though I still had to
    find most of the outfitting materials. But we had enough to start with at least.
    We were just getting to work when one of the boys nudged me and pointed to a man
    who was standing on the dock watching us. He was an elderly Chinese, and as soon
    as I saw him I knew I’d have no trouble with him about the boat. His first words
    confirmed my feeling.


    “I hear that you are taking charge of the boat,” he said, when I had joined him
    on the dock.


    “Yes,” I replied. “I am starting—” But he waved my words aside with a smile. “I
    see, I see. You should be glad I’ve kept my eye on it, because the Japs would
    have gotten it long ago if I hadn’t.”


    I thought he wanted to be paid for his trouble and told him I would be glad to
    give him anything he had spent in caring for the boat. But he wouldn’t listen
    to my offer. Then I asked him the all-important question. “Have you the sails,
    ropes, and boom in your possession?”


    He nodded. “Yes. You can come and get them at the store.” My heart gave a leap.
    If he really had these things, most of our troubles would be over. We wouldn’t
    have to waste weeks making a sail from the canvas we had and trying to buy rope
    and other equipment. The man gave me the address and went away, after I had assured
    him I would be there the next afternoon to get the stuff. William and Dirk arrived
    soon after he left and my story of the meeting with the old Chinese gave them
    a tremendous lift. I made out a list of few things we would need to repair the
    boat, tools, paint, and so forth, and sent William and Dirk in town to get them.
    They went separately, as we didn’t want to rouse suspicion by a wholesale raid
    on the shops. Most of things we got from Chinese merchants had a good deal hidden
    away in the back of their stores. Gradually we accumulated wire brushes to scrape
    the rust from the mast, some lead paint and heavy scrapers to get barnacles off
    the bottom. I stayed with the boat to show the boys what to do and got them started
    scraping the rust off the mast and barnacles from the bottom. By evening they
    had finished caulking the deck and begun the paint. When darkness came, I had
    every reason to feel satisfied with the progress. The sentry was still at his
    post and had been watching us all day. Either he was extraordinarily stupid or
    was pleased to have something to divert him, for he never so much as hailed us
    to ask what was on.


    The next afternoon, after work, I went to store as promised. I found some rope,
    turnbuckles, a boom, and one mainsail stowed in small godown. Still without questioning
    me why I wanted these things, the Chinese gentleman gave me all without a murmur.
    I loaded it on tricycle I had and, as soon as darkness fell, got it transported
    to house. I felt nervous when I saw the tell-tale tricycle wheeling ahead of me,
    for if any sentry wanted to stop me, I would have had difficulty. The Chinese
    gentleman had told me, when I saw he had only mainsail, which was fortunately
    in good condition, where the rest were. I got the address from him and decided
    to get the jib and any other sails without delay. I took William with me when
    we went to house next day. We learned from the boy who welcomed us that the man
    who lived there had been interned and his sister looked after the house. We asked
    whether she could see us. As soon as we met the sister, I had a feeling that it
    wasn’t going to be easy to get sails from her. She looked suspiciously at us and
    was obviously a woman who had been through much to put faith in any story. After
    introducing ourselves, I made William, who is good looking, start the conversation
    by nudging him. “We understand that your brother has the sails of the boat lying
    in harbor,” he began. “Yes,” was her brief reply. “We are starting a company,”
    he lied, “and since we are using boat, will you kindly let us have sails?”


    “Well,” she said hesitantly, “I can’t decide. I would have to get my brother’s
    consent, but I’m afraid there’s no way.” I saw that we weren’t getting anywhere
    this way, for it was hopeless to suppose we could get his permission. I decided
    to take strong measures and said boldly: “Japanese government has authorized our
    plans. We were going to send couple of Jap soldiers, but we thought it pleasanter
    if we came ourselves.” I felt rotten to have talk this way, but I wanted those
    sails and I knew we’d never get them except bluffing her. The idea of Jap soldiers
    coming to house horrified her and made her angry at the same time. “Well,” she
    said hastily, “if that’s the case, you can have them.” She went out of the room,
    leaving me feeling like a heel. After the war, I thought, I’ll tell her truth
    and maybe she’ll forgive us for acting like this. After all, I told myself, boat
    isn’t doing any good and it’s life saver to us. She came back in few minutes with
    big bundle of sail in her arms and dumped it down at our feet. “There,” she exclaimed,
    “take it and don’t you dare send any Jap soldiers.” We thanked her profusely and
    gathered up the sail. When we left the house, she refused to say goodbye to us
    and we heard her locking the door as soon as we were outside. But we were too
    elated at having sails to give much thought to her justifiable anger.


    When we got home, we inspected new possessions and found they consisted of three
    jibs, one of them quite new, spinnaker and balloon jib, both in middling good
    condition. All of them would need mending, but I knew I could do that easily.
    Now with mainsail we had gotten from old Chinese gentleman and extra canvas we
    already had, from which I could manufacture some extra sails, we felt well outfitted.
    I remembered friend who had promised to give me any of his equipment that I might
    need and went to see him. He gave me old mainsail, much too big for cutter, but
    it could be cut down if we needed it. I wanted to get as much spare canvas as
    possible, as most of what we had wasn’t in first-class condition. Heavy wind might
    easily tear any of sails to ribbons and I would need plenty of extra canvas to
    work with.


    While native boys worked on boat, all three of us kept busy trying to collect
    rest of necessary equipment. I tried to buy sail needles but there weren’t any
    be had, and I was forced to content myself with twenty of biggest darning needles
    I could find. Sail thread was another thing we couldn’t get, so we bought ordinary
    heavy cord. I didn’t look forward to mending and making sail with these, but they
    would have to do.


    I remembered fifty-gallon tank which had once used on camp trip. I had given this
    tank to one of native boys, before Japs came, telling him he might find it useful
    in case city water supply was shut off. He had installed it in backyard and now
    I told him to bring it to dock. It arrived one evening and we had some difficulty
    in getting it through hatchway. Once inside it filled half available space, but
    water was prime requisite of trip and we didn’t mind sacrificing comfort for sure
    water supply. We braced tank with wooden blocks, so that it wouldn’t move when
    boat heeled. We were making progress, but there were still plenty of things we
    must have before we could think of leaving. Among these necessities were chronometer,
    sea charts, and almanac. Even more important was wire for stays. There wasn’t
    a foot of wire be bought in Batavia. It began to look as though we had gone through
    all suspense, trouble, and danger for nothing. Without wire and sea charts we
    might as well stay where we were.

