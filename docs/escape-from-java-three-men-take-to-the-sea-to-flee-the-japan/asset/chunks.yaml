    away our stuff. I wanted to have everything ready when we hit the trade wind,
    so we could give all our attention to sailing the boat and not bother with housekeeping.William
    had rigged a fishing line over the stern and just before it was time to eat that
    evening, we saw a big fish bobbing along behind us, caught fast on the hook. We
    hauled it in, considerably cheered by the thought of variety in our monotonous
    diet. It was a benito, a big fellow with an ugly face, but plump enough to make
    us think we’d get a good meal out of him. William sat up in the bow to clean him,
    while Dirk got some water boiling on the stove. The wind was still blowing at
    a good stiff rate, but with our makeshift sails we were able to keep the bow headed
    into the waves and so did not pitch quite as much. The stove stayed more or less
    stationary and we had gotten into our cooking routine again.The benito tasted
    fine and I ate about as much as I could hold. But I didn’t hold it long. Either
    it wasn’t cooked enough or I have too ladylike a stomach. I spent a miserable
    night, not at all helped by William and Dirk, who pretended to think I was seasick
    and got back at me for teasing them about their mal de mer by giving me an unmerciful
    ribbing. I recovered by morning, however, but I let the other two finish what
    was left of the fish. Rice and corned beef looked all right to me.The morning
    of the twenty-second showed a bright sky filled with scudding clouds, the last
    of the storm signals. The wind was still from the northwest, but it was dropping
    and I felt sure we’d hit the trades again some time that day. The noon sight showed
    we had covered another sixty miles in the wrong direction. It was beginning to
    get pretty cold and I hoped we wouldn’t be forced much farther south of the equator.
