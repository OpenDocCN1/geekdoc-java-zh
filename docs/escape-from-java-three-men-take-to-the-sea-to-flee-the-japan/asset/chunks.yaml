    # 第十三章

    '
- fmt: '

    BUT Sunday, July fifth, came and nothing had happened to spoil our carefully thought-out
    plans. William and Dirk were still confined to my house; unwilling prisoners who
    felt themselves badly used to have to spend their last days ashore cooped up indoors.
    I kept them busy packing our stores and making compact bundles of all that we
    were to take with us. It was going to be a tight squeeze to stow all that we had
    in the cabin and still have room to move about. We cut our personal luggage to
    a minimum, and I left most of my possessions behind me.


    Late Sunday afternoon, just as the sun was beginning to set, I bicycled down to
    the wharf to superintend moving the boat. The two native boys were already there,
    for they had spent the day doing some last-minute chores about the cutter. She
    didn’t look any too trim with her makeshift rigging and worn ropes, but I was
    in no position to criticize. This boat, with God’s help, was going to take us
    across the Indian Ocean and it wouldn’t do to find fault with her. A captain of
    a fishing prahu was sitting on the dock when I arrived, watching the boys as they
    lowered the mast so that we could get the boat under the bridge. He was chewing
    betel nut, spitting into the water and offering them the benefit of his free advice.


    “Where are you going in that boat?” he asked me in Malayan, when he learned that
    the cutter belonged to me. “Nowhere,” I replied, but apparently he did not believe
    me. The captain shrugged resignedly. “You will have trouble,” he prophesied. “I
    have been sailing for years, but never until these dwarfs came have I had such
    trouble. A permit here, questioning there, rules, rules, rules. You can’t make
    money and you haven’t any freedom.” He rambled along in this strain while I helped
    the boys with the mast.


    “Look at that armband now,” said the captain, spitting dangerously close to my
    feet. He gestured scornfully toward my `Kempei brassard`. “What does it say? Who
    knows that dwarf language? It’s foolishness, all crazy.”


    I let him talk and even got him to help us. He was too interested in his own worries
    to wonder much about mine and I was quite content not to have him ask too many
    questions. When we finally got the mast folded, we began poling the boat away
    from the dock, for this was the only means of locomotion we had without sails.
    The last I saw of the captain, he had squatted down on his heels again, watching
    us as we disappeared into the evening dusk. “Trouble, trouble. You’ll have plenty
    trouble,” I heard him muttering as we passed out of earshot.


    But the old fellow was wrong, at least as far as this first leg of our trip was
    concerned. Before we reached the drawbridge, where we would come within sight
    of the lookout tower, I had the boys shove the boat near the bank, so I could
    jump ashore. I didn’t want to run the risk of showing myself to the Jap sentries.
    A couple of natives poling an empty boat wouldn’t rouse much suspicion. I hated
    to let the boys run the gauntlet of the lookout tower alone and they weren’t any
    too anxious to expose themselves to the sentries either. But it was the safest
    course and I urged them on by promising a fat bonus that would keep them in rice
    for weeks, if they got the cutter to the fishing wharf safely.


    I watched them pass under the bridge and then turn to the right and head down
    the canal. This part of their trip was the most dangerous, for they would be in
    full sight of the sentries for at least five hundred yards, before they could
    swing to the left and get out of sight behind the fishing wharves. I pedaled along
    beside the canal, trying to look innocent and apparently not paying any attention
    to the boat. From time to time I glanced up at the tower and through the windows
    could see the heads of the half-dozen sentries posted there. Once or twice one
    of them leaned out the window and stared apathetically at the scene below. But
    the boat must have seemed quite harmless to them, for, as far as I could judge,
    they never gave it a second thought. One of the sentries began to sing and the
    others took up the American jazz song, always a favorite type of tune with the
    Japs. I heard them laughing. By the time the cutter had made its turn to the left
    and disappeared behind the fishing wharf, the sentries were engaged in a cracked,
    high-voiced rendition of “Swanee River.” For the moment the boat was safe.


    Monday morning I sent my servant to the office with a note saying I was ill. This
    would explain my absence and I could only hope that the Japs wouldn’t start their
    investigation of my sick claim that day. There were many people I should have
    liked to see again before I started, but I didn’t dare for fear of their getting
    in trouble with the Japs after my escape was discovered. So I left Batavia, my
    home for twenty-two years, without saying farewell. I just disappeared.


    Darkness came and with it the two native boys, who had already moved the boat
    again. I had hired a native cart to carry the bundles and we soon had it loaded
    with the food and sails. Now the real danger was beginning. If the cart were stopped
    and searched, there was no ready-made story to explain the food supply. The Japs
    would know something was up and there would be nothing I could say to make fifty
    kilos of rice and all those canned goods look innocent.


    I went ahead on my bicycle and left the boys to follow with the cart. I hoped
    to be able to warn them of any potential danger, so that they could turn back
    in time. Our little cavalcade hadn’t gone fifty yards before I saw that we were
    in for a bad time. The street was full of carts, carrying household effects, for,
    as I have said, many people were moving at this time and there was less bother
    from the sentries.


    My heart sank to my heels and I stopped where I was. Ten yards behind me the cart,
    halted. Should I turn back and wait for a more opportune moment or should I keep
    on? If we didn’t get the stuff aboard tonight and make our getaway, our whole
    scheme might be ruined. We would have to hide the boat again and go through this
    procedure once more. Then I noticed something that gave me a ray of hope. The
    sentries inspected most of the carts but every once in a while, for no apparent
    reason, they let one go without looking at its contents. Perhaps our cart would
    be one of the lucky ones. I decided to take the chance. Gesturing to the driver
    to follow me, I mounted my bicycle and went slowly. Not once did I look behind
    me to see whether the cart was still following. Holding my breath I went steadily
    forward. Past one group of sentries, past another that had stopped.

