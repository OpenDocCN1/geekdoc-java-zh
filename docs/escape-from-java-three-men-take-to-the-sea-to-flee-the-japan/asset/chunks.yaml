    在这个战争的世界里，看到这些灯火通明的船只，显得完全不真实。随着它们越越近，我发现它们正平行航行，显然是为了互相保护而紧紧靠在一起。“把舵让给我，”我大喊道，从
    `William` 手中夺了过来，“得避开它们。”


    我向南调舵，在上风面保持着大约五英里的距离。当我们看着它们闪烁的光芒消失在海平线上时，我在想，如果在白天遇到那些船会发生什么？它们绝不会错过我们，那对我们来说可能意味着旅程的终结。对我来说，这只是到目前为止眷临在我们身上的运气又一明证。


    “它们是什么船？”`William` 问道，盯着地平线上标示它们位置的光芒。“什么样的船会这样灯火通明地在这片海洋上航行？”


    我也一直在想这个问题，但现在我记起离开 `Java` 之前听过的关于外交代表交换的消息。“我猜测，它们是来自美国和英国的领事人员，正被送到普鲁属东非的`卢伦戈·马奎克斯`（Lourengo
    Marques）。我听说他们要去那里和`日本`的代表进行交换。”


    后来我得知我的猜想是对的。但在那一刻，只要我们没有被它们发现，我并不太在乎那些是什么船。那个晚上的大部分时间我都留在甲板上，因为风现在正带着我们以相当快的速度前进，我喜欢这种进步的感觉。反正我也睡不着，在甲板上闲逛总比在临时船舱的铺床上翻来覆去要好。`William`
    被那些`海豚`折腾得不可开交，它们偶尔会发神经似地在快艇的尾后面突然跃出水面，把他吓死了一半命。它们在驾驶舱上方洒层层水花让他淋得湿透的，像个疯子一样愤怒。


    到黎明时，我们仍在取得良好进展，我判断大约有六节节。这是一个晴朗的好日子，成群的海鸥出现在周围，它们像往常一样被船只吸引，希望能找到食物。它们对我们感到很失望。我们没有足够的垃圾供它们，但海鸥仍然在周围徘徊，在头顶上鸣叫尖叫。其中一些试图降落在`斜桁`（gaff）上，但它移动得太频繁，它们无法站稳。偶尔有一只会在桅杆顶停留一会，即使对于一只不怎么挑剔的海鸥来说，那也不是一个舒服的休息处。


    “我们去打其中一只那些该死的鸟吧，”`William` 建议道，他不喜欢海鸥在帆和甲板上留下的“名片”。“不，你不想，”我迅速回答道。“迷信吗？”他咧笑着问，“‘用我的十字弩射了信天鸟’之类的吗？”


    “也许吧，”我说，“反正我不相信为了好玩就杀一只鸟。你不能吃海鸥，而且我反正喜欢看它们。它们静止不动时丑陋得惊人，但一旦张开翅膀，就没有什么比它们更优雅的。”


    “嘿，”就在这时，`Dirk` 从舱房里喊道，“水箱漏水了！”


    这是一场灾难，我跳下舱梯看看能做什么。漏水点在`水龙头`（tap）处，在一番折腾之后，我安装了一根我们无缘无故带上的`橡胶管`，并将其连接在`水箱`的顶部。`水龙头`现在不再漏水了，我想是怎样的运气让我带了那根`橡胶管`。


    我们今天（7 月 12 日）的正午位置是南纬 8°25''′10''''，东经 101°53''′15''''，一天航行了 102 英里。当我宣布我们的进展时，大家精神非常振奋，一天的剩余时间都在互相诉说我们如此轻易逃脱是多么聪明。现在我们知道，我们离`印度洋`太远了，万一遇到`日本`人巡逻该地区，我们没有任何可信的故事可以讲了。在`巽他海峡`，我们编造了一个故事，如果被拦截，就说我们正前往`爪哇`南岸的`普拉布万·拉图`（Pelabuan
    Ratu），加入一个渔鱼船队。当我们离开海峡刚进入`印度洋`时，我们计划说我们正前往苏门腊岛西岸的`巴当`（Padang），为一家即将在`巴达维`（Batavia）建立的航运公司寻找货物。


    我们当时讨论过这些故事以便记牢，但现在我们处于`印度洋`如此遥远的地方，没有什么能解释我们为什么出现在那里。遇到`日本`巡逻队的可能性不大，所以我们并不担心。我们收起一直挂在桅杆上的那面小`日本旗`，庆幸终于去掉了它，并把它扔进了大海。现在我们没有旗帜来标识身份，但至少目前没有需要。


    风一直没有停，到第二天中午，我们自上次看到船以来已经移动了 120 英里。如果保持这样，我们将比我希望的更早到达`罗德里格斯`（Rodriguez）。但我不敢过度庆祝，并警告`William`和`Dirk`不要指望每天都有这种运气。从地图上的位置看，我看到我们非常接近`科科岛`（Cocos
    Island），于是转向了更向西的航线。离开`Java` 之前我听说`日本`人占领了`基林岛`（Keeling Island），或者通常所说的`科科`岛，我不想离敌方太近。后来我发现`日本`人并没有拥有那个岛，我们的行程可能会缩短四分之一。如果我早知道英国仍然控制着`科科`岛，我们一开始就会去那里了。不知道`日本`人占领了那里的传言是如何传出来的，但那是关于`巴达维`的典型传闻。


    风持续着，到第二天中午我们自上次看到船以来已经移动了 120 英里。如果这种情况持续，我们将比我希望的更早到达`罗德里格斯`。但我不敢过度庆祝，并警告`William`和`Dirk`不要指望每天都有这种运气。从地图上的位置看，我看到我们非常接近`科科岛`，于是转向了更向西的航线。离开`Java`
    之前我听说`日本`人占领了`基林岛`，或者通常所说的`科科`岛，我不想离敌方太近。后来我发现`日本`人并没有拥有那个岛，我们的行程可能会缩短四分之一。如果我早知道英国仍然控制着`科科`岛，我们一开始就会去那里了。不知道`日本`人占领了那里的传言是如何传出来的，但那是关于`巴达维`的典型传闻。


    13 日下午，我们挂起了`三角帆`（spinnaker）以利用风力。但当晚上`Dirk`掌舵时，他变得有点粗大意，可能是因为舵上的压力太小，结果让`主帆横迎`（mainsail
    jibe）失控了。之后我决定放弃`三角帆`。


    “为什么不重新挂上`横帆`（jib）？”`William` 看到我只让船靠着`主帆`行驶时问道。“它已经太旧了，没什么用了，”我告诉他，“这种风会把它吹成碎片，我们不想去麻烦它。如果风一直这样，只靠`主帆`也是没问题的。”
    大多数时候，我们都被淋透了皮肤，因为我们的`雨衣`（raincoats）一旦弄湿了就完全没处用了。“好吧，我希望这风没掀起这样的浪，”`Dirk` 说，这时一个巨浪袭来。它让驾驶舱进了几英寸的水，我们开始使用`手泵`（handpump）来排水。一整晚上，在信风带来的巨大巨浪中，船摇晃得非常剧烈，我们无人待在铺床上。如果尝试睡觉，几滴水就会落在脸上猛地将我们震醒。但只要意识到我们正在取得如此进展，我们就不在乎任何不适。


    第二天早晨，做饭是一项体操运动。船颠簸得非常厉害，以至于我们中两个个人得按住炉子、锅和炭才能让食物煮熟。准备好时并不算大餐，但至少比冷餐要好。上午晚些时候，`主帆`在桅杆附近出现了一处裂缝，我缩减了一点以防止它扩大。目前我们颠簸得太厉害，补补并不是一项容易的工作，而且即使帆上缩了缝，我们的进展依然很快。然而，尽管它状况破旧，我还是重新挂上了`横帆`（jib），以为`主帆`提供更多风。它撑不了多久，但我想在它被风吹碎之前，我们可能充分利用它的价值。


    14 日的正午位置显示南纬 9°16''′55''''，东经 97°39''′30''''，航行了 145 英里。这是我们目前为止最好的成绩，但按照这种风速，即使不挂帆，风也会带着我们前进。我开始希望风不要刮得这么猛，这对一个海员来说是个奇怪的愿望，但考虑到我们帆的状况，这是可以理解的。我们带了一些备布和一块额外的`主帆`，但它必须重新裁剪以适应我们的桅杆，我希望现有的这块能坚持整个航程。


    等到晚上十点我的值班结束时，风在头顶咆哮，像一群愤怒的公牛。帆在绳索上紧绷着，仿佛急于离开，一股湿透的水花让驾驶舱半满了水。有人一直在抽水以防止它完全充满。我们进展得很快，没有发生任何让我感到焦虑的大事，但我依然紧张。


    “看好船，”我告诉 `Dirk`，这时他正从舱房出来，揉着眼睛打着哈欠。“保持船迎风行驶，在上帝份上，千万别让`主帆横迎`了。”他对我的建议似乎有些反感，他也完全可以如此，我在甲板上多留了一会儿观察天空。天空开始变得阴云，地平线上翻滚着深色的云团，我在想风暴是否会袭来。`William`来到甲板帮忙抽水，我决定下去试着睡一会儿。“去休息吧，老奶奶，”`William`
    笑着说，当我走下舱梯时。我没有告诉他们我担心会有一场风暴。没用担心他们，如果风暴真的要来，会在它之前回到甲板上的。我把自己甩在铺床上，尽管甲板上方有一股水流过我的脖子，我陷入了深睡。是一声巨响和
    `Dirk` 的一声尖叫将我唤醒的。在我完全清醒之前，我就已经在甲板上了。我看到的一幕让我忘记了睡眠这回事。

