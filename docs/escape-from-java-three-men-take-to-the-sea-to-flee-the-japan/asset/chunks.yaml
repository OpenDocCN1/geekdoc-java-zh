    # 第二章

    '
- fmt: '

    # THE Jap attack on Pearl Harbor set in train a course of events that is all too
    horribly familiar to everyone. We in Java had to watch the tide of conquest creep
    closer and closer, while we did everything in our power to prepare for any eventuality.
    And though some of us knew that a real defense of the island was impossible, since
    we just didn’t have the war materiel, there was never a moment of despair.


    ## The Defense of Java

    The first thing the government did, naturally, was to intern all the Japs on the
    islands. But long ago they had finished their work there and Java was an open
    book to the war lords of Tokyo, just as Singapore and Pearl Harbor were. Of course
    the Netherlands government declared war on Japan immediately, and a large part
    of the 250,000 to 300,000 Dutch and Europeans on the islands were called into
    the army. Precautions were taken to guard `Batavia`, and the building of air-raid
    shelters, already begun with the fall of Holland, was speeded up. Everyone on
    Java had some part in its defense; working at civil-defense jobs, if they weren’t
    in the army.


    ## Leadership and Preparation

    Major-General `Hein ter Poorten`, chief of staff of the Netherlands East Indian
    Army, was as ready as any man could be with the material he had to work with.
    `Ter Poorten` is a realist. He always knew the Japs had big ideas and he’d done
    all in his power to build up and modernize the army. For years he’d worked to
    increase the air force, too, and what success our planes had against the enemy
    in the early months of the war was largely due to his foresight in training pilots
    and ground crews. Major-General `van Oyen`, chief of the air force, was also alive
    to the dangers of our position. He worked closely with `ter Poorten` and helped
    in the establishment of the airdromes scattered throughout the interior of the
    island. I often think what these two men must have felt as they watched the Japs
    roll nearer and nearer, knowing as they did what materiel they had to fight them
    off.


    There were a few munitions factories in Java and they had turned out a good many
    bullets, bombs, shells, grenades, and torpedoes. But after the war in Europe started,
    it was almost impossible to get any more raw materials and, as I’ve already said,
    we had no luck getting sufficient finished stuff from England or America.


    ## Naval Resistance

    It’s Admiral `Helfrich` that most people outside of Java remember as the hero
    of our short-lived fight against the Japs. In the first fifty-four days of the
    war, his ships sank fifty-four enemy ships. We called him `Ship-a-day Helfrich`.
    The Admiral is also a realist. He knew what he had to fight with and against what.
    But that knowledge never led him to try to conserve our meager fleet when there
    was the slightest chance of doing damage with it. Time after time in those early
    days of the war he would send out a mere handful of ships against the fleets of
    transports and convoys that flowed south from Japan. One of our subs sank four
    Jap transports the day after Pearl Harbor. But the Japs always had more transports
    and more bandy-legged, bespectacled soldiers to fill them.


    Our naval forces in the Indies were part of the Allied Nations plan of defense
    for the whole Pacific area. The American Admiral `Hart` was the chief and Admiral
    `Helfrich` his second in command. `Helfrich` had studied plans of naval defense
    for the islands for years; it was something of a hobby with him. For years he
    had felt that one day the Japs would attack the Indies.


    ## The Retreat Strategy

    Again it’s too late to talk about what might have been done, but I can’t help
    wondering what might have happened if `Helfrich` had had his way with sufficient
    ships and planes. He knows the Indies as well as he knows the palm of his hand.
    Even by the middle of February, when `Hart` retired and `Helfrich` took command,
    it was not too late. Although several of our ships were gone, taking a lot of
    Japs with them, the main body of our fleet was still there, assisted by American
    and British forces. And how they fought and what they could do was demonstrated
    in the battle in `Macassar Strait`, the battle of `Bali`, and finally the battle
    in the `Java Sea`.


    I remember what it was like to watch the Japs coming nearer and nearer. By the
    end of January they had taken `Manila`, `Hong Kong`, and were creeping southward
    in Malaya closer and closer to `Singapore`. They had landed troops in `Sarawak`
    and on `Celebes`. `Tarakan`, the oil island off the coast of `Borneo`, had fallen.
    That’s the place where a heavy oil comes from the earth in so pure state that
    it can be pumped right from the wells into the tanks of a ship without refining.
    The island couldn’t be defended but our troops had wrecked the oil wells before
    leaving. It would take at least half a year to get them working again. In every
    one of the places from which our troops were forced back, they scorched the earth
    thoroughly before leaving. We left nothing for the Japs except destruction.


    ## The Atmosphere in Batavia

    In `Batavia` the general feeling was still one of confidence. Now, however, instead
    of saying only, “The Japs will never take Java,” they said, “We’ll defend Java
    to the last. They will never take Java.” They knew now that we would be attacked,
    but they still couldn’t believe we would be conquered. Help was expected from
    the outside to replace our losses in the defense of `Singapore` and the outer
    islands. We didn’t let ourselves down. There was still time for replacements to
    come in.


    ## Key Battles

    The Battle of `Macassar Strait` at the end of January proved this point. Against
    heavy odds the United Nations planes met a large Jap convoy escorting transports
    in the narrow passage between `Celebes` and `Borneo`, on their way to invade Java.
    In the ensuing battle thirty-one of the transports were sunk as well as several
    of the escorting warships. The battle was a tremendous victory for the Allies.
    Though the Japs landed on `Borneo` and in a short time took `Balikapan`, which
    couldn’t be defended and was completely destroyed, the invasion of Java was prevented
    and time was gained. The Batavians were enormously cheered by the sinking of the
    ships in `Macassar Strait`; and though center of `Balikapan` had fallen, they
    were full of confidence and said, “The Japs will never take Java.”


    Certainly such confidence was wonderful for the morale of the city and its people.
    They didn’t really need the posters that the government pasted up on the streets.
    These posters repeated the famous slogan: “It is better to die on your feet than
    live on your knees.” The native population had by this time become fully conscious
    of the war. When the men were drafted into the army, naturally knew that their
    peaceful way of life had changed and that it was due for an greater upheaval.
    Stories of what it would be like to live under Japanese rule began be whispered
    about. The Indonesians knew that Japs paid low wages and one of principal fears
    was that under Jap law they would get less. Their fears were justified, as will
    soon be seen. More important was the feeling for the Dutch; they had been happy
    under government, they had been allowed to live their own lives and didn’t want
    any changes. He wants to work the same fields, live in the same house, sing the
    same songs, and act in general just as his forebears have for hundreds of years.


    It wasn’t until the first part of February that the war really came to Java, however.
    Then Japs started bombing us. After heavy fighting they took the island `Amboina`,
    which lies to the east of `Celebes` and was our largest naval base. Their bombers
    appeared over `Surabaya` and `Batavia`, not doing a great deal of damage, but
    “softening” us up, as they thought. Their troops were close behind, creeping southward
    in `Borneo`, `Celebes`, and in Malaya. There was no doubt that Java was their
    next objective. Our air force and ships did what they could. Every day we heard
    that so many planes had been shot down, so many ships sunk. By this time a few
    American `Flying Fortresses` arrived to help us. But they weren’t enough. In a
    way they only served as aggravation, for we knew what could have been done if
    we had more of these amazing bombers. The spirit of our airmen, soldiers, and
    sailors was wonderful. It never seemed to occur to them that they were waging
    a losing fight. They went out and did what they had to do; they could sink Jap
    ships, dozens of planes, but it was never enough. The Japs always had more.


    When Singapore fell on the fifteenth of February we were only partly prepared
    for it. That is, as prepared as anyone could be for the downfall of what we had
    felt to be the strongest fortified position in the world. By that time so had
    happened to change our way of thinking that we didn’t bother to be surprised at
    anything. All we knew was that we would be next, unless help came in. The British
    troops began to come into Java after Singapore went; those who had succeeded in
    escaping from Malaya naturally were disorganized. They had had to flee in any
    way they could, some coming by boat, some by plane. Lots of them were Anzacs,
    Australian and New Zealand men. They had been through hell on Malaya and they’d
    lost the fight. That’s enough to take it out of a soldier. I remember talking
    to a New Zealander in a bar in `Batavia`. He’d just landed that morning from a
    native fishing boat, or `prahu` as they are called in the Indies. He’d lost all
    his equipment, his rifle, ammunition and all his belongings. But he didn’t care
    about that. All he wanted to do was get down to `Chilachap` on the south coast
    of Java where some British boats were picking up their troops and taking them
    back to Australia.“Just let me at those...” he kept saying. “God, if we’d had
    the stuff, we’d have...those Japs.” You couldn’t write what he said, but I knew
    what he meant. He wanted to fight Japs. There were a lot of British troops in
    Java then and they all wanted to get out so they could carry on the fight somewhere
    else. They knew Java was gone already. They’d seen what kind of stuff the Japs
    had to fight with and they knew we had nothing to compare with it.


    But even after Singapore fell, the people in Java did not despair. I don’t suppose
    anyone had much doubt about what was going to happen to us, but you’d never have
    known it from a Dutchman in `Batavia`. I had dinner at the `Hotel des Indes` one
    evening shortly after we heard the news about Singapore. Only a few people were
    having cocktails on the terrace, served by the native waiters with their usual
    polite efficiency. The talk was different. It was about war. But the women were
    as beautifully dressed as ever, the men looked cool and comfortable in their linen
    dinner jackets. There is an almost indescribable sense of ease about the hotel
    and one felt it, even with the Jap at the door, so to speak. However, the fact
    that one could have dinner at the hotel, just as one always had during the long
    years of peace, shouldn’t give anyone the impression that the Dutch were “fiddling
    while Rome burned.” They just refused to let themselves show what they felt. We
    had done everything in our power to prepare for the defense of the island. The
    Dutch were having a last drink to wish us all luck.


    ## The Fall of Palembang

    It was the fall of `Palembang`, the rich oil city in Sumatra, that hit us even
    harder than Singapore’s collapse. This happened not many days after we heard the
    news of Singapore. The refugees from `Palembang` came crowding into `Batavia`
    on ferries, fishing boats, anything they could find. They told stories of the
    Jap conquest of the city that gave us an ugly premonition of what we were to face.
    The Dutch had blown up the oil wells immediately and the roaring fires from these
    wells and refineries impressed the people even more than the actual Jap attack.
    The sound of the flames and the heavy clouds of smoke were a terrifying experience.
    Over and over again I heard people tell what they had felt when they saw these
    millions of dollars’ worth of installations going up in smoke. These refugees
    brought with them some of the script that the Japs had prepared for the countries
    they conquered. There were banknotes corresponding to our five and one guilder
    notes and even for one-cent notes. The Japs forced this script on the people of
    the conquered countries in exchange for real currency. It wasn’t worth the paper
    it was printed on, but the Japs used it to help along their “co-prosperity.” It
    doesn’t need much insight to see who prospered by this exchange of banknotes.

