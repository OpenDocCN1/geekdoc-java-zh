    # 第十六章

    '
- fmt: '

    IT seemed totally unreal to see these ships, lighted up as they were, in this
    warring world. As they came nearer I saw they were sailing parallel, evidently
    keeping close together for mutual protection. “Let me have the helm,” I shouted,
    grabbing it from `William`’s hands. “Got to steer clear of them.”


    I tacked southward, keeping to windward about five miles. As we watched their
    blazing lights disappearing over the horizon, I wondered what would have happened
    if we had met those ships during the day. They couldn’t have missed us and it
    would probably have meant the end of the voyage for us. To me it was just another
    evidence of the luck that had graced us so far.


    “What are they?” asked `William`, staring at the glow of light that marked their
    position on the horizon. “What ships would sail this ocean all lighted up like
    that?”


    I had been wondering this myself, but now I remembered something I had heard before
    leaving `Java` about an exchange of diplomatic representatives. “My guess is that
    they are American and British consular people being taken to `Lourengo Marques`
    in `Portuguese East Africa`. I heard that they were going to exchange them for
    `Jap` representatives there.”


    Later I learned that my guess had been right. But at the moment I didn’t much
    care what the ships were as long as we had missed being sighted by them. I stayed
    on deck most of that night, for the wind was sending us along at a pretty good
    clip now and I liked the feeling of making progress. I couldn’t sleep anyway and
    it was better to lounge on deck than toss around in the makeshift cabin bunk.
    `William` was kept on the jump by the `porpoises` which occasionally took it into
    their silly heads to surface just by the stern of the cutter, scaring him half
    to death. The showers of spray they threw over the cockpit kept him wringing wet
    and mad as a hatter.


    By dawn we were still making good headway, about six knots I judged. It was a
    fine sunny day and flocks of seagulls appeared around us, attracted as they always
    are to a boat in hopes of finding food. They were disappointed in us. We didn’t
    have enough to afford garbage, but the gulls hung around, squawking and shrilling
    overhead. Some of them tried to light on the `gaff`, but it moved too often for
    them to get a footing. Occasionally one would perch for an instant on the top
    of the mast, not a comfortable resting place, even for a gull who isn’t very choosy.


    “Let’s take a shot at one of those damn birds,” suggested `William`, who didn’t
    care for the calling cards the gulls were leaving on the sails and deck. “No,
    you don’t,” I replied quickly. “Superstitious?” he asked grinning. “‘With my crossbow
    I shot the albatross’ and all that?”


    “Perhaps,” I said. “Anyway I don’t believe in killing a bird just for the fun
    of it. You can’t eat seagull and I like to watch them anyway. It’s amazing how
    ugly they are when they’re sitting still, but once they spread their wings there’s
    nothing more graceful.”


    “Hey,” shouted `Dirk` from the cabin just at that moment, “the water tank’s leaking!”


    This was a catastrophe and I jumped down the companionway to see what could be
    done about it. The leak was in the `tap` and, after some fooling around, I rigged
    a `rubber tube` that we had brought along for no good reason and attached it to
    the top of the `tank`. The `tap` couldn’t leak now and I wondered what streak
    of luck had made me take along the `rubber tube`.


    Our noon position this day, July twelfth, was `Latitude 8 25 10 S`, `Longitude
    101 53 15 E`, a day’s run of 102 miles. We were in high spirits when I announced
    our progress and spent the rest of the day telling each other how clever we had
    been in making our getaway so easily. Now we knew we were too far out in the `Indian
    Ocean` to have any believable story to tell the `Japs` in the unlikely event of
    their patrolling the region. In the `Sunda Strait` we had fixed up a story, if
    we were stopped, to the effect that we were on our way to `Pelabuan Ratu` on the
    south coast of `Java` where we were joining a fishing fleet. When we left the
    strait and were just entering the `Indian Ocean`, we planned to say that we were
    on our way to `Padang` on the west coast of `Sumatra` to look for freight for
    a shipping company to be established in `Batavia`.


    We had discussed these stories at the time in order to get them straight, but
    now that we were so far out in the `Indian Ocean` there was nothing to explain
    our presence there. There wasn’t much likelihood of meeting a `Jap` patrol, so
    we weren’t very worried about it. We hauled in the small `Japanese flag` we had
    been carrying on the masthead, glad to get rid of it, and tossed it overboard.
    Now we had no flag to identify ourselves by, but for the present at any rate there
    wasn’t any necessity for one.


    The wind held and by noon the next day we had covered 120 miles since the last
    sight. If this kept up we would reach `Rodriguez` sooner than I hoped. But I didn’t
    dare do too much cheering and warned `William` and `Dirk` not to expect such luck
    every day. From our position on the map I saw that we were running pretty close
    to `Cocos Island` and shifted to a more westerly course. I had been told before
    leaving `Java` that the `Japs` had taken `Keeling Island`, or `Cocos` as it is
    usually called, and didn’t want to risk running too close to enemy territory.
    I found out later that the `Japs` didn’t have the island and we might have cut
    our trip by three-fourths. If I’d known the British still controlled `Cocos` we
    would have headed for it in the first place. I don’t know how the false rumor
    got around that the `Japs` had taken it, but it was typical of all the stories
    that were floating around `Batavia`.


    The afternoon of the thirteenth I rigged up `spinnaker` to take advantage of the
    strong wind. But when `Dirk` was at the wheel that evening he got a little careless,
    probably because the pressure on the helm was so light, and let the `mainsail
    jibe` on him. I decided to forget `spinnaker` after that.


    “Why don’t you rig the `jib` again?” asked `William`, when he saw that I was letting
    the boat sail under `mainsail` alone. “It’s too worn out to be worth anything,”
    I told him. “This wind will tear it to ribbons and we don’t want to bother it.
    We’ll get along all right with `mainsail`, if this wind holds.”


    “Well, I wish it didn’t throw up such sea,” said `Dirk`, trying to dodge a comber
    that came along. It put several inches of water into the cockpit and we began
    to use `handpump`, all of us wishing for the thousand time that we had a self-draining
    system to take this load off. We were soaked to the skin most of the time, as
    our `raincoats` were absolutely worthless once they were wet. We missed `oilskins`,
    but it had been impossible to get any before we left. None of us had pneumonia
    with baking by day and shivering at night.


    By the next morning we were well clear of `Cocos Island` and I set a straight
    course for `Mauritius`, a larger island just west of `Rodriguez`. We would strike
    `Rodriguez` first, but I made `Mauritius` our objective for purposes of navigation.
    My map showed it to be 320 miles from `Batavia`, one hell of a way from where
    we were.


    “Why don’t we head for `Diego Garcia`?” asked `William`, who had been studying
    the map. “It’s just west of us and about half the distance to `Rodriguez`.”


    “I thought of that,” I explained, “before we left `Batavia`. There are several
    reasons why it isn’t such a good idea. In the first place it’s entirely surrounded
    by reefs and shoals and, without a chart of the area, we’d be fools to risk trying
    for landing. Then `Diego Garcia` is about as flat as a pancake and we could sail
    right by it in a heavy swell like this and never spot it at all. `Rodriguez` is
    mostly rocks and hills and we can’t miss it once we get sight of it.”


    “It’s too near the `Jap` sea lanes, too,” said `William`, after studying its position
    more closely. “Right smack below `Ceylon` and the `Japs` are hanging around there
    like flies.” I nodded. “It’s best to steer clear of any place they have their
    eyes on. No, I think we’ll be better off heading for `Rodriguez`. It’ll take longer,
    but, if we keep up this speed, we’ll make it all right.” All that night the ship
    rolled so heavily in the tremendous swells up by the trade winds that none of
    us could stay in our bunks. We’d taken on so much spray that the decks began to
    leak, too, and a lot of water seeped down into the cabin. If we did try to sleep,
    a couple of drops of water would land on our faces and wake us up with a jerk.
    But we didn’t mind any discomfort as long as we realized we were making such headway.


    Cooking next morning was a gymnastic exercise. The boat was pitching and tossing
    so much that two of us had to hold the stove, the saucepan, and the coals in place
    to get the food cooked. It wasn’t much of a meal when it was ready, but better
    than cold rations at least. The `mainsail` began to show a tear near the mast
    later in the morning and I reefed it in a bit to keep it from growing bigger.
    We were pitching around too much to make patching a very easy job at the moment
    and besides we made plenty of headway, even with a reef in the sail. I put the
    `jib` back on again, however, in spite of its worn condition, to feed more wind
    on the `mainsail`. It wouldn’t last long, but I thought we might get what good
    we could out of it before it tore itself to pieces in the wind.


    Our noon position on the fourteenth showed `Latitude 9 16 55 S`, `Longitude 97
    39 30 E`, a run of 145 miles. The best we’d done so far, but the wind would have
    carried us along even without a sail at the rate it was blowing. I began to wish
    it wouldn’t blow quite so hard, an odd wish for a seaman, but, considering the
    condition of our sails, an understandable one. We carried some spare canvas and
    an extra `mainsail`, but it would have to be recut to fit our mast and I hoped
    that the one we had would last the voyage.


    By the time my watch ended at ten that evening, the wind was roaring overhead
    like a herd of angry bulls. The sails were straining at their ropes, as though
    anxious to get away, and a soaking spray kept the cockpit half awash. Someone
    had to pump all the time to keep it from filling entirely. We were making good
    time and nothing serious had happened to make me feel anxious, but I was just
    the same.


    “Watch her,” I told `Dirk`, when he came up out of the cabin, rubbing his eyes
    and yawning. “Keep her headed into the wind and for God’s sake don’t let the `mainsail
    jibe’.” He seemed annoyed at my advice, as well he might have been, and I lingered
    for a time on deck to study the sky. It was beginning to cloud over a bit; dark
    masses were rolling up along the horizon and I wondered if the storm would hit
    us. `William` came on deck to help with the pumping and I decided to go below
    to try to snatch a little sleep. “Get along, grandma,” said `William` laughing,
    as I went down the companionway. “We’ll watch the baby for you.” I didn’t tell
    them that I was afraid we were in for a storm. No use to worry them and I would
    be on deck again before it hit us, if it was going to. I threw myself across the
    bunk and, in spite of a persistent trickle of water running down my neck from
    the deck above, fell into a deep sleep. It was a crash and a wild yell from `Dirk`
    that awakened me. I was on deck before I was fully awake. What I saw there made
    me forget there was such a thing as sleep. The cutter was pitching wildly in a
    massive heaving sea, its mast broken short and lying off the starboard quarter
    in a soaking tangle of ropes, spars and sail. A great wave washed over us, almost
    filling the cockpit, and the boat swung helpless in the trough of the sea.

