  raw: ABOUT a month after the Japs arrived, a huge fleet of troop transports appeared
    at Tandung Priok, the harbor of Batavia. Soldiers were loaded onto barges at the
    docks and taken out to larger ships in the outer harbor. Most of the troops who
    had actually participated in the battle for Java left at this time and a new contingent
    appeared to act as the occupying force. These new soldiers were so much like the
    others that we in Batavia scarcely noticed the change. There were men from the
    economic department to run business and industry and, of course, a large group
    from the Kempei to keep order. Though I never heard how many soldiers there were
    in this new occupation force, I should judge that there were several thousand
    in Batavia alone.Life went on just as it had in recent weeks, though now the Japs
    began to bring some organization into their rule. They had tried to impress on
    everyone the fact that they had come to Java to stay, and, though neither the
    natives or whites believed this, the Japs went busily to work to implant themselves
    in the Indies.As part of their effort to eradicate all Dutch influence from Java,
    they closed all the schools, both native and European. After some time they reopened
    the elementary schools only, with a new educational system for the natives. The
    Dutch language was forbidden in the schools; all the teachers had to conduct their
    classes in Malayan or Japanese. Since none of the instructors spoke Japanese,
    they were given a quick course in the language to prepare themselves for the new
    order. European teachers, whether Dutch or any other white race, were thrown out
    of the schools entirely. The schools were to be run for the exclusive benefit
    of the Indonesians, for the Japs had learned the obvious lesson that the most
    effective way to spread their doctrines was through the children. If a child was
    taught nothing but what the Japs wanted him to know, he would grow up a model
    member of a subject race.Teaching the Japanese language was not only confined
    to the schools. Instructors appeared everywhere, even on street corners, and set
    up shop. Whether anyone listened to them or not, they went right ahead propounding
    the rules of Japanese grammar. The newspapers announced that everyone must make
    himself familiar with Japanese, for “This will be the future language of the world.”All
    letter writing was banned and the only postal communication allowed was by postcard—easy
    for the censors to read. These cards had to be written in Malayan or Japanese,
    for, as I have said, the Dutch language “no longer existed,” according to the
    Japs. Occasionally, as a special treat, civilians were allowed to send packages
    of food and clothing to their relatives in the internment camps. The Emperor’s
    birthday was considered an occasion for tremendous rejoicing, and the Indonesians
    and some Europeans were permitted to participate in the celebration by sending
    war prisoners a few necessities of life.The principal thing these prisoners needed
    was medical supplies. We heard frightful stories of the way wounded soldiers were
    treated, or rather not treated. They had no bandages, medicines, or nursing care.
    A few Japanese doctors were supposed to look after them, but either there weren’t
    enough of them or they didn’t pay much attention to their jobs. The wounded prisoners
    were to all intents practically uncared for.All the hospitals had been taken over
    and Jap doctors and nurses installed. The Dutch medical men were either interned
    or told to leave their work, though a few native doctors and nurses were made
    to stay on the job and help the Japs. The civilian population was just as badly
    off for medical attention as the prisoners, for all the hospitals were run for
    the Japanese Army. If any of us got sick we could only hope for the best. The
    Dutch doctors were handicapped in their work among the civilians by lack of supplies
    and, if an epidemic of any kind had struck us, there would have been nothing to
    check it.The Japs now had control of all phases of life in Java. One of the most
    interesting proofs of their imitative habits was their administration of justice
    in the courts. Of course, they had taken over the judicial machinery immediately,
    but in the courts they made fewer changes than in other places. They were smart
    enough to realize that the Dutch system worked well and they didn’t want to disrupt
    it. Many of the Dutch judges were forcibly retained and the Japs watched the way
    they meted out justice with great attention. They had always been respectful of
    our governmental administration and knew that, by watching the way we did things,
    they could learn a great deal.The tax system, too, they left as it was. The Japs
    admitted that it was effective and that’s the best that can be said of any tax
    collecting. But now the natives weren’t making the wages they had under Dutch
    rule, and when the Japs tried to collect on the previous year’s incomes, the Indonesians
    had nothing with which to meet the tax. Surprisingly enough, the Japs were lenient
    and gave them three months in which to try to find their tax money. Close imitation
    of the Dutch administration methods was one of the most ominous aspects of the
    Jap conquest to me. It showed that they had every intention of keeping Java and
    exploiting its riches.The lowering of the wage scale which I have just mentioned
    was the point of greatest friction between the Japs and the natives. The Dutch
    had paid from seventy-five to eighty cents for an eight-hour day with overtime.
    The Japs paid them thirty-five cents a day and nothing for overtime. One man I
    knew asked for his overtime wage, after working a twelve-hour stretch, and was
    thrown into jail for a fortnight.The native reaction to this wage cut was to quit
    work entirely. The Indonesians have a strong family feeling, and those who had
    jobs in the cities knew that all they had to do was to go home to their families
    in the mountain villages. Here they could be sure of a bowl of rice a day and,
    most important of all, harmonious surroundings, which to them is the most necessary
    thing in life. Any Indonesian would rather exchange a good job in the city paying
    anywhere from fifteen to twenty guilders a month for one paying little or nothing
    in his native village. Here he could be sure of harmony among his gentle, peace-loving
    relatives.But the Japs had work to be done, repairing the demolished roads, buildings,
    and bridges destroyed by the Dutch Army, so they drafted native labor to speed
    it along. One method of their doing this came to my attention when one of our
    native boys at the office asked me if he could go home to visit his people for
    two days. I gave permission, but it was a month and a half before he returned.
    He was covered with bruises from head to foot and evidently had been mercilessly
    mistreated by the Japs. His story was that while walking to his village he passed
    by an airdrome that the Japs were rebuilding. They spotted him and immediately
    put him to work on the field. Here he was forcibly retained for several weeks,
    being locked in the airdrome at night, given no wages and very little food for
    his labor. If he tried to escape or showed signs of slacking on the job, he was
    beaten and kicked until he could hardly stand. He at last managed to get away
    one night, and, after reaching his family’s house and receiving treatment, came
    back to Batavia.His case was only one among thousands like it during the time
    I was there. Scarcely any of the natives worked willingly for the Japs, even those
    who had at first been influenced by the propaganda about the benefits they would
    receive under the Japs. The low wage scale, or, as more often happened, no wage
    at all, was enough to convince the natives that they were going to get nothing
    out of their new rulers.Another important reason for the general state of unemployment
    among the natives was the wholesale closing down of most business offices. All
    the European firms that had once employed thousands of natives were out of business.
    The import and export houses, the consulates, the great agricultural estates had
    to shut up shop immediately after the occupation, since they were cut off from
    the world market. The Japs couldn’t run them, as the majority of these firms had
    dealt with the Allied nations and naturally none of them were doing business with
    the Japs.They made no attempt to keep these businesses going, as a matter of fact,
    because they didn’t need them. By redrilling they could get oil from Tarakan more
    easily than they could from Java, where the oil needed refining. Sugar, tea, rubber,
    and rice were plentiful in other places they had conquered. Until they had consolidated
    their gains in the Pacific, they were content to let Java’s great natural resources
    remain unused. Java to them is chiefly valuable right now as a strategic naval
    and aviation base. The harbor at Surabaya is one of the largest in the world and
    they immediately set about rebuilding it with drafted native labor. The airdromes,
    of which we had ten scattered throughout the interior of the island, were quickly
    put into working condition again, also by native workers. New airports and naval
    construction work at Surabaya were begun. The Japs are fitting Java as a naval
    and air stronghold. That is the principal role that the island is to play in the
    Jap military scheme, at least for the time being.Though the Indonesians had the
    worst of the new Jap “order” from every point of view, the white people were not
    much better off. True, they were seldom molested by the conquerors, except for
    the unfortunate businessmen and government officials who were jailed. The rest
    of us weren’t important enough to bother with. I was protected by the Kempei armband
    which I was careful to wear everywhere and, since I did not have an executive
    job, I was not thought to be in a position to have any special knowledge that
    might be dragged out of me by third-degree methods.I was not watched and was able
    to move about Batavia pretty much as I pleased. Of course there were restricted
    areas, such as the waterfront, where we weren’t supposed to go. But, as I shall
    mention later, even forbidden spots like these were not always closely guarded.The
    white women, too, were left strictly alone. Just before I left I heard that the
    Japs were going to set aside a certain area of Batavia for the exclusive use of
    the white women where they could live together without fear of harm. But this
    was not done while I was there and indeed there was no particular need for such
    a restricted area. Unlike some of the other countries conquered by the Japs, Java
    was not evacuated by the white women and children.No Netherlander was allowed
    to leave the country and almost nobody wanted to. The Indies were our home; we
    had lived there with the Indonesians for so many years in prosperity, why should
    we run away when trouble came. The only people who escaped were those men who
    had orders from the Dutch government to leave before the occupation. The ones
    who left were men whose specialized knowledge and skill in a variety of fields
    were necessary to the war effort. Therefore, the large majority of the white families
    stayed on in Java when the Japs came. The natives had no cause to say, as we heard
    they did in other countries, that the whites had run out on them and left them
    to face the Japs alone.Our greatest hardship was the lack of money. The Japs took
    over all the banks immediately and appropriated the funds they contained. Any
    money that we had on hand was exchangeable for Japanese script, but when this
    was gone many people had no further resources. The heads of many families were
    in jail and their wives and children were soon badly off. Not even pensions were
    paid and some had depended entirely on such money for a livelihood. Only those
    who worked for the Japs had any regular source of income. I had my salary, though
    now it was less than half what it had been. I was fortunate to be in a position
    to help some of my friends, and during the time I was in Java supported seven
    families on my wages.With so many people in straitened circumstances everyone
    fell to and helped one another. Dutch and Chinese landlords agreed to forget the
    rents owed to them by many householders. “After the war,” they said. “Then we
    will think about your rent.” Those who had more money than others were generous
    with it and all shared and shared alike with their friends and relatives.Those
    who had servants told them that they would have to leave, as there was no money
    to pay their wages any more. Invariably the native and Chinese servants responded
    by saying, “You don’t have to pay us. Just give us a plate of rice every day so
    we have something to eat and we will stay.” These people knew that they would
    be better off with a friendly employer even without wages, than shifting for themselves
    with the Japs.The natives expressed great sympathy for the white people in their
    difficulty. I remember hearing one Indonesian say, as he saw a Dutch woman in
    the market picking out the cheapest foods, “It is a shame that you are in such
    a condition. I pity you.” It was obvious that the “oppressed natives,” as the
    Japs love to call them, were not rejoicing to see their former masters in such
    unhappy circumstances. They were sorry for them and felt none of the elation the
    Japs expected at being “freed” from Dutch rule.Another reason why people had so
    little money was due to the registration cards we were forced to buy from the
    Japs. The cards stated one’s age, race, and length of time in the Indies. They
    cost a white man one hundred and fifty guilders, a white woman eighty guilders.
    Chinese paid one hundred guilders for the cards and their women fifty guilders.
    This was a lot of money, but we had to have the cards or risk being thrown into
    jail.Needless to say, our whole way of life was changed. We no longer had access
    to any of the amusements we had enjoyed during peace time. No one wanted to go
    to the movies more than once or twice. It was scarcely pleasant to see a Jap propaganda
    picture and the ordinary films were so distorted by censorship that they meant
    nothing. Formerly the white people had spent a good deal of their leisure time
    at the great hotels, dining or dancing, or at one or another of the clubs of which
    there are several famous ones in Batavia. But now the Hotel des Indes was occupied
    by Jap officers and no one else was allowed inside. These officers could be seen
    drinking and playing billiards through the hotel windows, and it was not a spectacle
    that made one want to join in the fun. The Harmonie, one of the largest of the
    men’s clubs, was similarly used. All the former members were excluded and the
    Jap officers had the free run of the place.Everyone stayed at home and the only
    relaxation we had was visiting among our friends. Occasionally the Japs would
    put on a show for the edification of the public. One of these was the burial service
    held at the Fair Grounds in the Konigsplein in commemoration of the Japs who had
    died in the Battle of Java. This was really quite impressive. Masses of soldiers
    lined up in the square, facing a platform draped with flags of the Rising Sun.
    A speaker addressed them, paying honor to the dead, and then the soldiers sang.
    This singing was what was most effective. One group at the back of the audience
    began the song and it was taken up by various other groups at different intervals.
    Finally the whole array of men was singing. I had always heard that Japanese singing
    was a monotonous singsong, but these soldiers sang in the Western manner. They
    have several rousing national songs and evidently are trained to sing them so
    that they get the most effect out of them. I was honestly impressed, not by what
    they were singing, but by the way in which they did it.One of our favorite forms
    of relaxation was listening to rumors, either because we half hoped they were
    true or because they gave us something to talk about. The natives were generally
    the ones who started these stories and, while I knew none of them had any basis
    in fact, I hated to act the wet blanket by refuting them. A particularly persistent
    rumor was one that said the Americans were coming, that they would be in Java
    at any moment to deliver the island from the Japs. We were always hearing that
    American troops were even now in Bali or Sumatra or Borneo, getting ready for
    a big offensive against the Japs. As soon as one rumor proved itself to be false,
    another would spring up to take its place, a story equally as fantastic as the
    last, but always a source of hope and comfort to the natives. These tales helped
    preserve our morale, which, during the time I was in Java, was very good. People
    lived on the belief that this period of degrading conquest was only temporary
    and that some day the last Jap would be driven off the island.There is a native
    legend in Java, in which the Indonesians put great faith. Hundreds of years ago
    some prophet said that one day Java would be overrun by yellow men from the north.
    These conquerors would control the island absolutely, but at the end of one hundred
    days they would be driven away. The hundred days had come and gone, however, and
    still the Japs had Java.
