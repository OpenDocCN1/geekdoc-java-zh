    # 第十九章

    '
- fmt: "\nIT’S lucky neither William nor Dirk took me up on that bet. Lucky for them,\
    \ that is. At noon on August fifth our position was `Latitude 19 34 10 S`, `Longitude\
    \ 65 56 30 E`, showing a run of ninety-two miles since the previous day. According\
    \ to my rough calculations, we were some one hundred and forty miles east of Rodriguez.\
    \ I hoped that’s where we were at least. That publicity map of the Indian Ocean\
    \ wasn’t good enough to base an exact judgment on. \n\nI knew that Rodriguez was\
    \ a small island; on my map it was about one-tenth of an inch long. If we could\
    \ hit that pin dot in the expanse of the ocean, we’d be more than fortunate, we’d\
    \ be pretty darn good.\n\n“What’s the name of the town on Rodriguez?” asked William\
    \ that evening. “I’d like to know where it is I’m to eat this white bread.”\n\n\
    “Port Mathurin,” I answered, staring at the map. “It shows here on the east side\
    \ of the island, which seems pretty funny to me. It can’t be much of a harbor.\
    \ The swell from the ocean, sweeping all across from Australia, must make it a\
    \ lousy anchorage.”\n\n“You can’t tell anything from that map,” said Dirk scornfully.\
    \ “Rodriguez is so small there, you’d never know where Port Mathurin is. Which\
    \ side are you going to approach it from? How do you know where the reefs are?”\n\
    \n“I don’t,” I answered. “We’ll just have to trust to luck.”\n\n“It’ll be luck\
    \ if we hit it at all,” said Dirk, who still couldn’t believe that land lay ahead\
    \ on that barren expanse of sea. “I’ll believe it when I see it.”\n\nI didn’t\
    \ sleep that night. I couldn’t. I knew that at the rate we were going we ought\
    \ to sight Rodriguez early the next morning, if my calculations were right. The\
    \ nearer we came to that dot on the ocean, the bigger that “if” looked to me.\
    \ I was at the helm the next morning, taking the six o’clock watch while William\
    \ and Dirk were below, trying to catch some sleep. We’d been making about six\
    \ knots all night and a heavy swell showed the strength of the wind. The cutter\
    \ climbed laboriously up those mountains of water and slid thankfully down into\
    \ the troughs on the other side.\n\nAt eight o’clock the boat reached the crest\
    \ of one of those watery hills and just before it dipped down the opposite slope,\
    \ I saw it. Dead ahead, showing faintly gray in the morning light, lay the island\
    \ of Rodriguez. For a moment I didn’t say anything. If I’d wanted to shout the\
    \ time-honored “land ho” I wouldn’t have been able to. My throat felt thick. I\
    \ waited until the cutter mounted the next swell, just to make certain that my\
    \ eyes hadn’t deceived me. They hadn’t. There it was, already clearer, more distinct\
    \ in the bright morning sun. We’d done it.\n\nThen I yelled.\n\n“We hit it!” I\
    \ bellowed in a voice that would have waked the dead. It roused William and Dirk,\
    \ who came clattering up on deck in ten seconds flat.\n\n“Where?” asked Dirk accusingly,\
    \ peering ahead at the steep rise of water towering before us. “You’re joking.”\n\
    \n“Like hell I am,” I answered joyfully. “Wait until we hit the top of this swell\
    \ and—There! Look at it!” I pointed toward the now clearly defined spot of land\
    \ directly before us.\n\n“Well I’ll be damned,” said William softly.\n\nDirk didn’t\
    \ say anything. He stared ahead of him, as though still unable to believe his\
    \ eyes. They couldn’t doubt it a few minutes later. Each heave of the little cutter,\
    \ breasting the tops of the swells, brought us that much nearer. Soon we could\
    \ make out the shape of the rocky hills which covered the island, making it a\
    \ jagged mass of irregular outlines.\n\n“Which side of it are you going to tackle?”\
    \ asked William, later in the morning. “When do you think we’ll get there?”\n\n\
    “Oh, around one or two o’clock,” I replied. “Those breakers on this end don’t\
    \ look too good to me. Guess I’ll try the north side.”\n\n“Why?” It was Dirk who\
    \ asked the question.\n\nI shrugged. “I don’t know. Just a hunch. It’s obvious\
    \ the map was wrong about Port Mathurin. It’s not at this end.”\n\nWe could see\
    \ the island clearly now; the steep hills and the long stretches of green pasture,\
    \ dotted with grazing cows. It seemed almost unbelievable to be looking at that\
    \ peaceful scene, after our long days at sea. None of us talked much; we just\
    \ feasted our eyes on the greenery and in imagination felt our feet touching dry\
    \ land once more.\n\nAt two in the afternoon we were within half a mile of the\
    \ shore, just off the southeast corner of the island. There was a heavy cloud\
    \ of breakers dashing against the coast, sending up a high spray that soaked the\
    \ steep rocks which covered the shoreline. Obviously there was no hope of finding\
    \ an anchorage here. I tacked northward for a mile or so and then headed west\
    \ along the north coast. Here, too, there was no sign of a safe harbor. The same\
    \ breakers betrayed the reefs about the island, dangerous waters for us. I stayed\
    \ as close to land as possible without getting caught in the ground swell and\
    \ wondered if I’d guessed wrong in choosing this side of the island to find a\
    \ landing place.\n\n“Hey, look at those people on the hill there,” cried Dirk,\
    \ pointing to a wide pasture land, a picturesque scene of grazing cows and men\
    \ and women dressed in bright-colored clothes. “They seem to be watching us.”\n\
    \n“Probably are,” I answered. “It isn’t every day a sailing boat flying a Dutch\
    \ flag lands here, you can bet.”\n\nWe waved at the watchers, but either they\
    \ didn’t see us or were too astounded at our appearance to be able to reply. The\
    \ sails we carried must have made them think we were guests from another planet\
    \ anyway. No boat had ever carried worse-looking canvas than we did, of that I’m\
    \ certain. I kept my eyes on the mainsail, praying that it would hold out for\
    \ another hour or so. If it had given way again just then, it might have been\
    \ all up with us. The wind would have carried us straight for the breakers, where\
    \ we’d have been ground to pieces; not a pretty end to a voyage like ours.\n\n\
    At the northwest corner of the island I sighted a long reef stretching out into\
    \ the ocean for half a mile. I had to veer north to avoid this and by the time\
    \ we had cleared it and were headed toward the island once more, we could make\
    \ out the houses and radio masts in the town of Port Mathurin. I had been right\
    \ in my doubt of the map after all; Port Mathurin was on the west end of the island,\
    \ just where I suspected it was. Then I spotted another reef stretching westward\
    \ all across the water which separated us from the town.\n\nI began to swear half\
    \ to myself. If we had to sail out around that reef, the end of I couldn’t see\
    \ from where we were, it would be nightfall before we could drop anchor. Then\
    \ I saw a pair of stakes, marking a passage through the reef. It was the entrance\
    \ to the harbor of Port Mathurin.\n\nWe ran through the narrow cut, guided by\
    \ the changed color of the water. Once in the little bay the wind slackened and\
    \ we coasted slowly toward the town, now lying before us. About four hundred yards\
    \ off shore I lowered sail, for I could see that the water was growing shallower\
    \ with every foot. The little cutter drifted easily and lazily forward, as though\
    \ weary from its long fight against the sea. Slowly and surely she nosed forward,\
    \ then stopped. We had run aground.I looked up. Coming toward us was a small power\
    \ boat. At its bow was a British flag, snapping briskly in the wind. I turned\
    \ to William and Dirk\n\n“Well,” I said inadequately, “we made it.”\n\nA major\
    \ of the British forces stationed on the island took us in charge; a very astonished\
    \ major, who had to be told over and over again the story of our trip. He brought\
    \ us ashore, fed us, gave us a place to sleep and confiscated our boat. We didn’t\
    \ care about that. The long trip was over, our adventure had succeeded. We were\
    \ free to fight again.The week we spent on Rodriguez passed pleasantly. The British\
    \ Army forces treated us well and promised to see that we got in touch with the\
    \ Netherlands government. The islanders themselves were equally hospitable; they\
    \ couldn’t make enough of us and we were deluged with kindness and questions.\
    \ None of them ever tired of hearing the story of our trip.I found that the luck\
    \ which had followed us for the past month hadn’t deserted us when I happened\
    \ to choose the north side of the island to find a possible harbor.A British cruiser\
    \ picked us up on August eleventh with instructions from the Netherlands government\
    \ to take us to Ceylon. That was the first leg of the long journey that brought\
    \ me to America, sent Dirk to Australia, and William to England. In each one of\
    \ these places we were to prepare ourselves for the job we’d set out to do—fighting\
    \ Japs. We parted at Ceylon. I’ve seen neither of them since. But we will meet\
    \ again—in Java. When we return, we will be the invaders, we and our Dutch comrades.\n"
