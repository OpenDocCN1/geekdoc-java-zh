    我花了三天时间仔细的侦察，才再次找到了那艘小纵船。我终于看到它停靠在原位置转角处的一个干船坞里，那个船坞曾属于一个中国人。现在日本人控制了那个码头，有三名哨兵日夜地巡逻。船就就在我的眼前，但现在它看起来就像从未存在过一样，遥不可及。我知道想把它从那个码头带走连半点希望都没有。哨兵离得太近了，试图在他们的眼皮底下把它夺走简直是愚蠢行为。


    威廉完全赞成进行大胆的冲刺，二话不说地夺过船，完全没考虑如果我们成功拿了船可以藏在哪里。我费了些劲才说服他这种计划完全荒唐。但他太失望了，无法清醒地思考，一直坚持认为我们办得到。等我让他冷静下来，我让他明白我们必须重新开始；找另一艘船，并从头开始制定计划。


    接着迪尔克出了个主意。他和威廉知道在切里伯农（Cheribon）附近有一个人拥有一艘帆船，那艘船停在另一个港口。他们已经讨论过和这个人一起逃跑的想法，那人答应去探听他的船是否被日本人凿沉了。我对这个计划并没有抱太大希望，因为他们告诉我关于那位朋友的情况让我觉得他并不太急于离开。日本人已经在爪哇岛待了三个月，如果他这段时间里还没查出自己的船是否还存在，那他算不上有什么出息。但任何可行的计划都比没有计划好，所以我告诉威廉和迪尔克看看他们能对那个家伙做些什么。


    我们决定他们立即回到切里伯农和那人谈谈。下周末我要去那里，看看他们是否成功从他那里那里得了什么确定的答复。当然，我在办公室还有工作，不能像我希望的那样自由地活动。所以我我必须在傍晚和周末完成大部分关于计划的工作。日本人发布了严令，凡是被发现在没必要时请假、放慢工作速度或有任何可疑行为的人都会受到严厉惩罚。我不想因为和日本人得罪而毁了自己的机会，所以我必须谨慎行事。


    那整周我都在焦急地等待威廉的消息。他答应给我寄一张明信片，上面会有一些隐晦的信息，告诉我进展如何。但随着一天天过去，明信片没来，我开始变得相当紧张。我怀疑告诉这两个人这么多关于我的计划是否明智智。我其实对他们一无所知。他们甚至可能是日本人的间谍，尽管我认为这极不可能。而且，尽管我最初对威廉的勇气和自信充满信任，但他和迪尔克都从未航过海。他们对船一窍不通，而即将到来的航程的责任将完全落在我的肩上。我选择这两个人倾诉，是因为我喜欢他们的精神。他们显然有足够的意志力来制定逃跑计划；在初步准备阶段可以给我提供巨大的帮助。但一旦进入大海，带我们横跨印度洋就要靠我了。


    正当我决定自己对这些完全陌生的人说这么多简直像个傻瓜时，一张威廉寄来的用马来语写的明信片到了。上面写道：“约翰尼很好，希望很快见到你。”从这我知道他已经和那人谈过了，并且想让我亲自去切里伯农和他谈谈。


    周六我乘火车出发了。我对这次旅行并不太感到高兴，因为巴达维亚流传着消息，说日本人搜查所有的火车，并将欧洲人带走监禁。但为了得到我想要的，我必须冒险，所以我试着不去想太多如果火车被搜查会发生什么。像我最近听到的大多数谣言一样，这一个证明是假的，至少对我而言如此。除了火车上的几名士兵，我没有看到任何日本人。我买票时只出示了登记证，到达切里伯农火车站时，守卫让我通过了，甚至没有多看我一眼。第千次，我感谢我戴着的那个宪兵臂章。


    威廉和迪尔克在站接我，看起来精神很好。他们已经和那位朋友约了时间，我们要立刻去见他。我试着打听他们他们关于那人的船的消息，但他们在这方面说得非常模糊。


    “等我们看看再说……”他们说。我只能满足于此，尽管我对他们那个朋友的看法开始一落无地。


    几乎一到达那人的房子，我就知道我怀疑得没错，他根本不是那种能帮上忙的人。他是个商人，一个在爪哇岛住了多年的欧洲人，显然相当富有。他的生活显然没有受到日本占领的太大干扰，他和他的家人生活得非常优渥。两个小时里，我不得不听他论述他的生活和事业。他详尽地描述了他的帆船，告诉我们那艘船对于我们的目的来说是多么完美的船。他离开爪哇的愿望对他来说不过是一个冒险之梦，我很快发现他并没有离开的真意。他只是喜欢聊起它。他甚至还没有努力去查他的船到底发生了什么，光是这些就足以说服我是在浪费时间。


    “听着，”我终于打断了他关于自己航海技巧的没完没了的话，“你的船怎么样？还在不在？”


    “这个——”他开始说，但我再次打断了他。“我要回巴达维亚了，”我宣布道，“下周六之前告诉我你的船是否可用。否则我会找另一艘。”他一定看出我开始失去耐心了，因为他立刻答应第二天派人去听船的消息。这我算接受了，但离开他的房子时，我从愿望清单删除了他。


    下午我回到巴达维亚，和威廉、迪尔克约定下周六跟我汇，带来关于那人的船的消息以及他们需要的所有行李。我告诉他们精简行李，因为存放空间有限。


    不管有没有船，那艘小纵船似乎是唯一一没被日本人凿沉的船。但我没有让自己沮丧，继续收集食物和其他设备，以备航行。两个当地男孩帮我买了食物。一次买一点，因为我知道一次买太多会引起怀疑。我家的食物储备逐渐增加，直到有了五十公斤大米、四十七罐罐牛肉、五罐沙丁鱼、四罐水果、一罐酸菜，和两罐李子。考虑到配给得如此严格，我能弄到这么多简直是奇迹。


    我仍在寻找航海仪和必要的海图，但目前还没有找到。我希望威廉和迪尔克能快点到达巴达维亚，这样他们就能帮我。我知道威廉在当地有很多人脉，他告诉我有一个人与轮船公司工作，也许能帮我们拿到海图。令我完全惊讶的是，他告诉我如果我需要任何航海设备，可以使用他拥有的。他从一艘已经卖掉的旧船上拆下了帆具，现在藏在他家里。我没有口头答应他，告诉我我会记住他的承诺。意识到我有这些帆具可以依靠，极大提振了我的精神。


    直到下周二，威廉和迪尔克才出现在巴达维亚。当我听到他们带来的东西时，我原谅他们的迟到。他们带了缝在大块帆布里的手枪和弹药、一箱两加仑汽油，以及各种小工具，如螺丝刀、锤子和一些钉子。


    “但这些东西在哪？”当威廉跟我说完这一切后我问道。


    “噢，”他随口说道，“它们没坐我们同一班火车来。行李车满了，所以坐的是晚一班火车。我明天得去车站取。”我大声呻吟，想象着如果在威廉领取之前日本人检查了包裹会发生什么。但他安慰我，说他用假名发送的，并计划在领取前先去行李房检查东西。如果他发现包裹被动过过，他就会直接走人，什么也不去管。他看起来那么自信，我没多说什么，但我发现自己在祈祷日本人没有对那卷巨大的帆布和汽油桶好奇。他们还告诉我，切里伯农的那个人已经发现他的船被凿沉了，没有使用的希望。他们告诉我，那人还在谈论逃跑，但我拒绝再听他的任何计划了。我对这些渔船有了解，意识到它们永远不适合千公里的航程。威廉向我保证，第二天他在车站领取行李完全没有困难。他租了一辆带推车的三轮车，那是巴达维亚用来运输货物的车辆之一。当地人这种“快运”服务生意兴隆，尤其是现在有这么多家庭搬到更便宜的地方。威廉仔细检查了行李房，很快发现他的包裹完好无损。当他出示取证时，守卫没说一句就把交给了他。看到日本人递给他那个装有手枪和弹药的帆包，威廉觉得很有趣。他把东西装进三轮车里，骑着自行车带路回到我家，我们约定在那里存放所有的物资。看到那些包裹安全地藏在我的地下室里，我心里的一块石头落地了。


    我向他们解释了我们还需要什么来装备可能找到的任何船，并强调我们必须有爪哇海的海图和海洋本身的地图。没有这些，我们哪也去不了。爪哇海的海图尤为必要，因为由于岸边的礁石，我们这段航程可能是最危险的。威廉是那种天生好运的人之一。部分时间我观察了河岸仓库屋顶上方升起的桅杆。也许我错过了我希望看到的那根上光的桅杆。然后，我看到了它。在一座倒塌的仓库上方一英尺处，竖立着一根桅杆闪光的顶端。在没有仔细观察之前，我知道它属于某种欧洲类型的船。上光的桅杆证明了这一点。在威廉和迪尔克的惊讶中，我戏剧性地说：“我找到我们的船了。”

