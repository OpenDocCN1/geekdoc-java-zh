    # 日本对珍珠港的袭击引发了一系列对每个人来说都感到无比恐怖且熟悉的事件。在爪哇，我们不得不目睁睁看着征服的浪潮步步逼近，同时我们竭尽全力为任何可能发生的情况做准备。尽管我们中有些人知道，由于我们缺乏战争物资，对岛屿进行真正的防御是不可能的，但从未有过绝望的时刻。


    ## 爪哇的防御

    政府首先做的事情自然是关留了岛上所有的日本人。但很久以前，他们已经在那里结束了工作，爪哇对于东京的军阀们来说就像是一本敞开的书，正如新加坡和珍珠港一样。当然，荷兰政府立即对日本宣战，岛上
    25 万至 30 万荷兰人和欧洲人中有很大一部分人被征召入伍。他们对保护 `Batavia` 采取了预防措施，并加快了在荷兰沦落后已开始的防空掩体建设。爪哇的每一个人在防御中都有一份力量；如果他们不在军队里，就从事民防工作。


    ## 领导层与准备

    荷属东印度陆军总谋长 `Hein ter Poorten` 将他所拥有的物资做到了所能的最好准备。`Ter Poorten` 是一个现实主义者。他一直知道日本人有大图计划，他已竭尽全力建设和现代化军队。多年来，他一直致力于加强空军建设，战争初期几个月我们的飞机对敌人取得的成功，很大程度上归功于他在培训飞行员和地面人员方面的远见。空军司令长
    `van Oyen` 少将也察觉到了我们处境的危险性。他与 `ter Poorten` 密切合作，并帮助在岛屿内陆各地建立了机场。我经常在想，当这两个人看着日本人越靠越近时，心里一定是什么感受，因为他们很清楚自己用什么样的物资来击退敌人。


    爪哇有几家弹药工厂，他们生产了大量的子弹、炸弹、炮弹、手榴弹和鱼雷。但在欧洲战争爆发后，几乎无法获得更多的原材料，而且正如我所说的，我们没有运气从英国或美国获得足够的成品。


    ## 海军抵抗

    爪哇以外的人们最记得的是 `Helfrich` 将将，他可是我们对抗日本人那场短暂战斗的英雄。在战争的前五十四天里，他的舰只击沉了五十四艘敌舰。我们称他为“一天一舰的
    Helfrich”。这位将领也是一个现实主义者。他知道要用什么战斗，以及要对抗什么。但只要有一丝机会造成伤害，这种认知就从未导致他试图去节省我们匮乏的舰队。在战争初期的那些日子里，他反复派出少数几艘船去对抗从日本南下的运输船队和护航队。我们的一艘潜艇在珍珠港事件后的第二天击沉了四艘日本运输船。但日本人总有更多的运输船，以及更多腿细的、戴着眼镜的士兵来填充它们。


    我们在印尼群的海军力量是盟国整个太平洋地区防御计划的一部分。美国将领 `Hart` 是司令，`Helfrich` 将是他的副司令。`Helfrich` 研究岛屿的海军防御计划已经多年；这对他来说像是一种爱好。多年来，他一直觉得日本人有一天会进攻印尼群。


    ## 撤退策略

    同样，讨论本可以做什么已经太晚了，但我禁不住想，如果 `Helfrich` 拥有足够的船只和飞机并听从他的安排，会发生什么。他对印尼群的了解胜如指掌。即使到
    2 月中旬，当 `Hart` 退休 `Helfrich` 接管指挥时，也还不晚。尽管我们的几艘船损失了，带走了大量的日本人，但我们舰队的主力仍在那里，并得到了美英军的援助。他们如何战斗以及能做什么，在
    `Macassar Strait` 海峡战、`Bali` 之战以及最后的 `Java Sea` 海战中得到了证明。


    我记得看着日本人越靠越近的感觉。到 1 月底，他们已经占领了 `Manila` 和 `Hong Kong`，并在马来亚向南推进，越来越接近 `Singapore`。他们在
    `Sarawak` 和 `Celebes` 登陆了部队。婆罗洲 `Borneo` 海岸的油岛 `Tarakan` 沦落了。那里出产重油纯度极高，可以直接从井中泵到船只的油箱里而无需精炼。该岛屿无法防御，但我们的部队在离开前破坏了油井。至少需要半年时间才能让它们重新运作。在我们的部队被迫撤回的每一个地方，他们在离开前都彻底执行了焦土政策。除了毁灭，我们没有给日本人留下任何什么。


    ## 巴达维亚的气氛

    在 `Batavia`，总体感觉仍然是自信。现在，他们不再只说“日本人永远夺不了爪哇”，而是说“我们会守卫爪哇。他们永远夺不了爪哇”。他们现在知道我们将会受到攻击，但仍然无法相信我们会被征服。他们期待外部的援助来弥补我们在防御
    `Singapore` 和外围岛屿的损失。我们没有辜负他们。还有时间让补充到位。


    ## 关键战役

    1 月底的 `Macassar Strait` 海峡之战证明了这一点。在极度不利的情况下，盟军飞机遭遇了在 `Celebes` 和 `Borneo` 之间狭窄海峡护卫前往爪哇的大型运输队。在随后的战斗中，击沉了
    31 艘运输船以及几艘护卫舰。这对盟军来说是一场巨大的胜利。尽管日本人登陆了 `Borneo` 并在短时间内夺取了无法防御的 `Balikapan`，但对爪哇的侵略被阻止了，并争取到了时间。爪哇人被
    `Macassar Strait` 舰只沉没的消息所鼓舞；尽管 `Balikapan` 沦落了，他们仍然充满信心并说“日本人永远夺不了爪哇”。这种信心对于这座城市及其人民来说是极好的。政府在街道上贴出了这条著名的口号：“宁立着死，不跪着活”。此时，当地居民已经完全意识到战争的到来，他们的生活方式发生了剧变。关于在日本人统治下生活的各种开始流传。印尼人知道，被征入军队后，在日本人法律下得到的待遇更低。他们的担心是正确的，很快就会证实。对于荷兰人来说，更重要的是他们被允许过自己的生活，种同样的田地，唱同样的歌，就像他们的祖先数百年来那样。


    直到 2 月上旬，战争才真正来到爪哇。然而，日本人开始轰炸我们。他们的轰炸机出现在 `Surabaya` 和 `Batavia` 上空，没有造成巨大的破坏，但他们认为正在“软化”我们。他们的部队紧随其后，在
    `Bor` 向南推进。毫无疑问，爪哇是他们的下一个目标。我们的空军和海军尽了所能。我们每天都听到有飞机被击落，许多船只被击沉。这时，一些美国的 `Flying
    Fortresses` 到来帮助我们。但它们还不够。这些惊人轰炸机的出现反而增加了烦恼。我们的飞行员、士兵和水员的精神非常伟大。他们似乎从未想过自己在进行一场注定失败的战斗。他们出去并做了必须做的事；他们击沉了日本船和几十架飞机，但仍然不够。日本人总有更多。


    当 2 月 15 日新加坡沦落时，我们只做了一部分准备。对于我们认为世界上最坚固的防御工事的陷落，准备仅此。那时这种情况已经改变了我们的思考方式，以至于对任何事情都不感到惊讶。我们所知道的只是除非援助到来，我们将是下一个。新加坡的事后，英国军队开始进入爪哇；那些从马来亚逃出来的人自然处于一片混乱。他们不得不尽一切办法逃跑，有的坐船，有的坐飞机。他们许多是澳洲和新西兰人。他们在马来亚经历了地狱，并且输掉了战斗。这足以让一个士兵崩溃。我记得记得在
    `Batavia` 的一家酒吧里和一个新西兰人聊天。他那天早上刚从一艘当地的鱼船（在印尼被称为 `prahu`）上登陆。他失去了他所有的装备、步枪、弹药和所有财物。但他不在乎这些。他想做的只是去爪哇南岸的
    `Chilachap`，那里有一些英国船正在接载他们的士兵并将他们带回澳大利亚。“就让我对付那些……”他一直这么说，“天哪，如果我们有物资，我们就会……那些日本人。”你无法写下他所说的，但我知道他的意思。他想和日本人战斗。那时爪哇有很多英国士兵，他们都想离开，以便在其他地方继续战斗。他们知道爪哇已经完了蛋。他们见识了日本人用来战斗的何种物资，并知道我们无一可以与之比拟。


    但即使在新加坡沦落后，爪哇的人也没有绝望。我不认为有人对我们将发生什么事持有太大怀疑，但从一个 `Batavia` 荷兰人那里，你永远无法得知。在听到关于新加坡的消息后不久晚上，我在
    `Hotel des Indes` 吃了晚餐。只有几人在露台上喝鸡尾酒，由当地的侍员如往常一样礼貌且高效地服务。谈话变得了。那是关于战争。但妇女们一如既往地穿着漂亮，男人们穿着亚麻晚宴服看起来冷静而舒适。酒店里有一种几乎无法言表的安逸感，人们能感受到这种感觉，即使日本人就在门口了（如果这么说的话）。然而，在酒店里吃饭的事实（正如在长期和平岁中所常做的那样）不应该给任何人留下荷兰人在“罗马被焚烧时弹奏琴”的印象。他们只是拒绝表现出自己的感受。我们已经竭尽全力为岛屿的防御做准备。荷兰人正在用最后一杯酒祝我们好运。


    ## 亚亚加罗的陷落

    苏答腊岛富油城 `Palembang` 的沦落，对我们的打击比新加坡的崩溃还要严重。这发生在我们听到新加坡消息后没几天。`Palembang` 的难民乘坐渡轮、鱼船等任何能找到的工具挤入
    `Batavia`。他们讲述了日本人占领这座城市的故事，这让我们对即将面对的情况产生了可怕的预感。荷兰人立即炸毁了油井，这些油井和炼油厂发出的熊烈火焰给人们留下的印象甚至超过了真正的日本袭击。火焰的声音和浓重的烟云是一次恐怖的经历。我一遍又一遍听到人们讲述当看到这些价值数百万美元的设施化为乌烟时的感受。这些难民带来了一些日本人为被征服国家准备的钞币。这些纸币对应于我们的五盾票和一盾盾票，甚至还有一分盾票。日本人强迫被征服国家的人接受这种钞币以换取真实的货币。这种纸币本身根本不值钱，但日本人利用它来推进他们的“共荣圈”。不需要太大的洞察就能看出谁在这场纸币交换中获利了。


