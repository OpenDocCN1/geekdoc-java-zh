- fmt: "\n# CHAPTER SEVEN\n\n“ASIA RAYA, Asia Melindung, Pemimpin!”“Greater Asia,\
    \ Cooperative Asia, Harmonious Asia!”This slogan appeared everywhere—on posters,\
    \ over the radio, and in the newspapers. The Japs drummed away at the idea that\
    \ their coming was the greatest blessing ever bestowed on Java. They were determined\
    \ that the Indonesians should forget the Dutch and everything that we had brought\
    \ in the way of advancement. \n\nBut the natives had their own slogans. A few\
    \ weeks of Jap occupation was enough to convince them that the way of the “Three\
    \ A’s,” as this principal rallying cry was termed, should really read was, “Asia\
    \ Raya, Nippon Kaya, Asia Paya.” Translated as “Greater Asia, Richer Japan, Poorer\
    \ Asia,” it shows that no one was blind as to who was to benefit by the Japanese\
    \ conquests.\n\nNaturally the Japs took over all the newspapers and radio broadcasting\
    \ stations immediately. Every newspaper plant was shut down within a week after\
    \ the occupation and only a few Malayan papers were allowed to continue publication.\
    \ Of course the Japs controlled these and filled them with their propaganda for\
    \ native consumption. Their own newspaper, called `000` was their principal organ\
    \ and in it they printed a fantastic array of lies, twisted tales, and glorified\
    \ accounts of Jap conquests. Every battle in which their troops, ships, or planes\
    \ was engaged anywhere on the globe was announced as a Japanese victory, no matter\
    \ how many ships, planes, or men might have been lost. The losses weren’t mentioned.\n\
    \nThe Japs had brought correspondents from all their big news agencies and these\
    \ men kept themselves busy dreaming up tall tales for home consumption about the\
    \ glorious welcome the Jap troops had received from the “oppressed Indonesian\
    \ people.” They printed pictures of a Jap and a Javanese shaking hands while a\
    \ dove of peace flew overhead. The natives might have found more meaning in this\
    \ happy thought if the Jap soldiers hadn’t expressed their peaceful intentions\
    \ by cutting off their heads at the slightest provocation.\n\nThe radios blared\
    \ from dawn to dusk on the same themes. No one had a chance to hear anything but\
    \ the propaganda idea that the Japs and Javanese were the “same color, the same\
    \ race.” Within a few days of the conquest, special troops visited every house\
    \ in Batavia to seal the shortwave radio bands, so that no one could listen to\
    \ foreign broadcasts. Needless to say, there were many people among the Dutch\
    \ population who disobeyed this edict and risked imprisonment or worse to get\
    \ the news from outside.\n\nOne young fellow had a concealed radio to which he\
    \ listened every night. The news he received he printed on a hand press and distributed\
    \ among his friends. He was caught finally and we heard he had been shot. But\
    \ we still got some outside information. The Indonesians who worked at the Jap\
    \ radio stations often were able to pick up foreign broadcasts and they relayed\
    \ what they heard to their friends. The truth travels fast and there were few\
    \ people of any intelligence in Batavia who did not know a great deal of what\
    \ was going on in the world.\n\nI remember turning on my radio one night at ten\
    \ o’clock about a week after the conquest and hearing, to my amazement, the Dutch\
    \ National Anthem. Each night for a week this same thing happened. Evidently the\
    \ Japs aren’t very musical, for it took them all this time to catch on to what\
    \ was happening. Two men who worked at the radio station had been playing a record\
    \ of the anthem right under the noses of the enemy. It was a splendidly foolish\
    \ thing for them to do, for, when the Japs finally realized what the tune was,\
    \ the two men paid dearly for their loyalty. They were imprisoned for several\
    \ weeks and later shot.\n\nBy way of erasing all evidence of Dutch influence,\
    \ the Japs began changing the names of all the streets, shops, and buildings.\
    \ It was fairly easy for them to go about putting up signs announcing that such\
    \ and such a place was now to be known by a Japanese or Malayan name. But no one\
    \ ever referred to them by the new terms. The Indonesians aren’t people who can\
    \ change customs quickly and, since they had no wish to forget the Dutch in any\
    \ case, the Japs had little success with this campaign.\n\nFor some reason the\
    \ Japs decided soon after they were established in Java that the terms `Japan`\
    \ and `Japanese` were not to be used any more. Perhaps they felt that the name\
    \ `Jap` by which everyone called them was detrimental to their dignity. In any\
    \ event it was announced that from now on the conquerors of Java were to be called\
    \ `Nipponese` and their country `Nippon`. Anyone violating this rule was liable\
    \ to strictest punishment. But they had the same success with this idea as they\
    \ had with the name changing of the streets and buildings. They were Japs to the\
    \ Dutch and natives, and I never heard anyone call them Nipponese, unless he were\
    \ face to face with one of them.\n\nThe movies also were converted to Jap propaganda\
    \ uses. Every theater was closed soon after the occupation and only opened to\
    \ show some special Jap film. These movies were the rankest propaganda, showing\
    \ scenes of happy family life in the factories and fields of Japan or, more often,\
    \ battle pictures of Jap conquest. Their favorite in the latter category was the\
    \ attack on Pearl Harbor, which they announced had been totally destroyed. Every\
    \ battle in which Jap forces participated was claimed as a “complete victory.”\
    \ I saw the film they showed of the Battle of the Coral Sea. The commentator declared\
    \ that the whole American fleet had been sunk in this engagement.\n\nThe Japs\
    \ had a hard time getting people to come to the theaters to watch films like these,\
    \ even though they reduced the admittance fee to a mere fraction of what it had\
    \ been in peace time. In order to make theater going more attractive, they released\
    \ a few Hollywood pictures, but only ones that had been carefully censored. One\
    \ that the Japs liked particularly was a fantasy called `1,000,000 B.C.`, a very\
    \ mediocre picture by any artistic standards. But it showed white men acting like\
    \ savages, eating with their fingers and living in caves, and, for this reason,\
    \ the Japs considered it highly effective as anti-American propaganda.\n\nAnother\
    \ American picture, Seven Sinners, was presented several times. I had seen it\
    \ before the occupation and went again to find out what the Japs would do to it.\
    \ Even before the picture began, an announcement was flashed on the screen saying,\
    \ “This picture is busuk because it shows ships of the American Navy that have\
    \ been totally annihilated by the Imperial Japanese Navy.” Throughout the showing\
    \ an announcer interrupted to cry, “Busuk!” whenever he felt that the action required\
    \ this comment. Much of the picture had been censored so that the story was completely\
    \ ruined and made no sense whatsoever. I heard that Charlie Chaplin’s The Great\
    \ Dictator was being shown to the Jap officers in Batavia, but we never saw it\
    \ at a public theater. The rumor was that the officers enjoyed it tremendously\
    \ and got a big laugh out of seeing their allies, Hitler and Mussolini, as portrayed\
    \ by the Messrs. Chaplin and Oakie. In fact, they liked it so much it was repeated\
    \ four or five times for their exclusive benefit.\n\n# CHAPTER EIGHT\n"
