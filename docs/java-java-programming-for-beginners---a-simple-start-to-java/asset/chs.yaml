- "# Java 编程初学者指南 - Java 编程简单入门\n\n\n\n![](img/cover.jpeg)\n\n![Image 1](img/index-1_1.jpg)\n\
  \n\n## 引言\nJava 是一种编程语言由甲骨文科技（Sun Microsystems）引入。这项工作由 James Gosling 发起，Java 的最终版本于\
  \ 1995 年发布。\n\n然而，最初 Java 是作为 Sun 微系统核心平台的一个组件发布的，称为 `J2SE` 或 Java 1.0。Java 或 J2SE\
  \ 的最新发布版本是 Java 标准版 6。\n\n随着 Java 作为一种编程平台和语言的日益普及，促成了许多针对 Java 开发的工具和配置的发展。例如，`J2ME`\
  \ 和 `J2EE` 就是两种这样的配置。Java 的最新版本被称为 `Java SE` 和 `Java EE` 或 `Java ME`，而不是 `J2SE`、`J2EE`\
  \ 和 `J2ME`。使用 Java 平台最大的优势是它允许你在任何机器上运行代码。因此，你只需要编写一次代码，并期望它在任何地方运行。\n\n关于 Java\
  \ 的特性，如下所示：\n\n## 面向\n在 Java 中，一切都是对象。由于 Java 围绕对象模型构建，它可以被有效地扩展和延伸到无法想象的维度。\n\n\
  ## 平台无关\n与包括 `C` 和 `C++` 在内的许多其他编程语言不同，Java 在汇编时不会转换为适用于任何特定机器的格式。相反，它被转换为与机器无关的字节码。这些字节码通过网络传输，并在运行的任何阶段由虚拟机或\
  \ `JVM` 解码。\n\n## 简单\nJava 的设计初衷是易于学习。如果你理解 OOP（面向对象编程）的核心思想，精通 Java 并不困难。\n\n##\
  \ 安全\n凭借 Java 的安全框架，它能够创建不受病毒和篡改的框架。公钥加密被用作核心认证策略。\n\n## 与机器架构无关\nJava 编译器产生的对象文件格式与机器架构是无关的。经过汇编后的代码可以在许多处理器上执行，唯一的要求是它们都必须拥有\
  \ Java 运行时框架。\n\n## 可移植性\nJava 代码与机器和平台无关的这一事实使其极其紧凑。Java 编译器用 `ANSI C` 编写，具有整洁的可传输性限制，即\
  \ `POSIX` 子集。\n\n## 健壮性\nJava 通过重点强调运行时检查和编译时检查，试图消除可能导致潜在系统失败的情况。\n\n## 支持多线程应用程序\n\
  凭借 Java 的多线程特性，可以编写同时执行许多任务的程序。这种配置技巧允许设计人员构建运行的智能应用程序。\n\n## 解释型代码\nJava 字节码在本地机器上被实时解释。开发方法更加快速且直观，因为接口是一个增量且轻量级的过程。\n\
  \n## 高性能\n通过利用即时编译器（Just-In-Time compilers），Java 增强了系统性能。\n\n## 分布式\nJava 是为了 Web\
  \ 的分布式环境设计的。\n\n## 动态\nJava 被认为比 `C` 或 `C++` 更具动态性，因为它旨在适应\n\n\n\n\n\n一个不断进步的环境。Java\
  \ 项目可以传递大量的运行时数据，这些数据可用于检查并在运行时对其做出响应。\n\n# Java 历史\n\nJames Gosling 于 1991 年 6\
  \ 月开始开发 `Java` 编程语言，用于他众多许多机顶盒项目之一。该编程语言最初被称为 `Oak`（橡树），这个名字源自 Gosling 办公室外的一棵橡树。后来，这个名字被更改为\
  \ `Green`（绿色），并最终从字典中随机选取的一组单词列表中重命名为 `Java`。\n\nSun 公司在 1995 年发布了第一个开放使用的版本 `Java\
  \ 1.0`。它保证了“编写一次，随处运行”（WORA），在主流平台上提供了免费的运行环境。2006 年 11 月 13 日，Sun 公司根据 `GNU` 通用公共许可证\
  \ (GPL) 的条款，将大部分 `Java` 以免费开源的形式发布。2007 年 5 月 8 日，Sun 公司完成了这一程序，使 `Java` 的大部分核心代码免费并开源，除了一小部分\
  \ Sun 公司不拥有版权的代码外。\n\n# 前提条件\n\n为了运行和实验本书中的示例，你需要一台至少带有 64 MB RAM 的 Pentium 200-Mhz\
  \ 机器。你还需要配套的编程平台：\n\n- Microsoft 记事本或任何文字处理器\n- Java JDK `5`\n- Linux `7.1` 或 Windows\
  \ `XP` 或更高操作系统\n\n# Java - 基础语法\n\n一个基础的 Java 程序可以分为几个结构和元素。通常，它可以被描述为对象的集合，这些对象通过调用彼此的例程进行通信。对象和类的基本定义如下：\n\
  \n## 类 (Class)\n类可以被描述为蓝图，描绘其对象的所有行为和状态。\n\n## 对象 (Object)\n对象由两个组件组成，即方法和属性或变量。例如，考虑小狗的例子，它具有以下属性或状态：名称、颜色和品种。此外，它还具有以下行为，包括汪汪、摇尾和进。任何对象都只是类的实例。\n\
  \n## 实例变量 (Instance Variables)\n每个对象都有一组变量。对象的状态是由程序执行期间分配给这些变量的属性形成的。\n\n## 方法\
  \ (Methods)\n方法是方法的定义。此外，一个类可以包含许多方法。在这些方法中，组合了逻辑等行为，控制了信息并执行了所有的活动。\n\n# 第一个 Java\
  \ 程序\n\n为了开始基础的 Java 编程，让我们来看标准的 Hello World 程序。\n\n```java\npublic class MyFirstJavaProgram\
  \ {\n    public static void main(String []args) {\n        System.out.println(\"\
  Say Hello World To The World!\");\n    }\n}\n```\n\n你可以看到，程序在 `main()` 函数中使用单行代码打印出语句“Hello\
  \ World!”。然而，在执行这一操作之前，让我们看看你在执行该文件时必须遵循的步骤。\n\n1. 打开任何文本编辑器并将此代码粘贴到文件中。\n2. 以 `.java`\
  \ 扩展名保存文件。例如，你可以将文件保存为 `Sample.java`。\n3. 下一步是打开系统的命令提示符，并将其引用切换到保存文件的目录。例如，如果你将文件保存在\
  \ `C:\\`，那么你必须将提示符切换到同一个目录。\n4. 为了编译代码，你必须输入：`javac Sample.java`\n5. 如果没有错误，你将自动跳转到下一行。你现在可以使用以下命令执行代码：`java\
  \ Sample.java`\n\n你应该能在屏幕上看到以下输出。\n\nSay Hello World To The World!\n\n# 基础语法\n\n\
  关于 Java 程序，记住以下几点非常重要。\n\n## 类名 (Class Names)\n对于所有类名，首字母应当大写。如果使用几个单词来构建类名，则每个内部单词的首字母都应该是大写。例如，一个标准的类名如下：`class\
  \ Sampleclass`\n\n## 大小写敏感 (Case Sensitivity)\nJava 是大小写敏感，这意味着标识符 `Hi` 和 `hi` 在\
  \ Java 中具有不同的含义。\n\n## 方法名 (Method Names)\n所有系统名称应以小写字母开头。如果使用几个单词来构建方法名，则每个内部单词的首字母应该是大写。这一惯例示例如下：`public\
  \ void mysamplemethod ()`\n\n## 文件名 (Filename)\n记录名称必须与类名精确匹配。在保存文件时，你应该使用类名进行保存。记住\
  \ Java 是大小写敏感的，并在末尾添加 `.java`。如果文件名和类名不匹配，你的系统将无法编译。\n\n考虑类名 `Sample` 的例子。在这种情况下，你必须将文件命名为\
  \ `sample.java`。\n\n`public static void main(string args[])`\nJava 系统处理从 `main()`\
  \ 函数开始，它是每个 Java 程序的必不可部分。\n\n# Java 标识符 (Identifiers)\n\n所有的 Java 组件都需要名称。用于类、变量和策略的名称被称为标识符。在\
  \ Java 中，关于标识符有几点需要记。。它们遵循以下标准：\n\n- 所有标识符必须以字母（从 a 到 z）、下划线 (`_`) 或特殊字符 (`$`) 开头。\n\
  - 在第一个字符之后，标识符可以包含任何字符组合。\n- 不能使用关键字作为标识符。\n- 最重要的是，标识符是大小写敏感的。因此 `Sample` 不等于 `sample`。\n\
  \n标识符示例包括 `$salary`、`age`。非法标识符示例包括 `123abc`。\n\n# Java 修饰符 (Modifiers)\n\n与其他语言一样，可以使用修饰符来修改类和方法。修饰符分为两种：\n\
  \n- 访问修饰符：`public`、`default`、`protected` 和 `private`\n- 非访问修饰符：`static`、`final`\
  \ 和 `abstract`\n\n我们将在后续章节研究更多关于修饰符的信息。\n\n# Java 变量 (Variables)\n\nJava 支持多种变量。这些变量类型包括：\n\
  - 实例变量（非静态变量）\n- 类变量（静态变量）\n- 局部变量\n\n# Java 数组 (Arrays)\n\n数组是存储相同类型变量的连续内存位置。另一方面，数组本身是一个对象。我们将在后续章节研究如何声明、创建和实例化。\n\
  \n# Java 枚举 (Enums)\n\n枚举是在 `java 5.0` 中作为包引入的。枚举限制变量仅具有预定义的属性之一。此标识列表中的属性被称为枚举。使用枚举可以减少代码中的错误数量。例如，如果我们考虑一个咖啡馆应用程序，可以将杯子尺寸限制为\
  \ `extra large`、`large`、`medium` 和 `small`。这可以确保人们不会请求菜单或应用程序列出的尺寸之外的任何尺寸。请注意，枚举可以独立声明，也可以在类内部声明。此外，在枚举体内也可以创建方法、变量和构造函数。\n\
  \n# Java 关键字 (Keywords)\n\nJava 中的关键字或保留字在下表所示。根据规则，这些单词不能用作变量或常量的名称。\n\n`assert`,\
  \ `abstract`, `break`, `boolean`, `case`, `byte`, `char`, `catch`, `const`, `class`,\
  \ `default`, `continue`, `double`, `do`, `enum`, `else`, `final`, `extends`, `float`,\
  \ `finally`, `goto`, `for`, `implements`, `if`, `instanceof`, `import`, `int`, `long`,\
  \ `interface`, `new`, `native`, `private`, `package`, `protected`, `return`, `public`,\
  \ `static`, `short`, `super`, `strictfp`, `synchronized`, `switch`, `throw`, `this`,\
  \ `transient`, `throws`, `while`\n\n\n\n\n\n`try`\n\n`volatile`\n\n`void`\n\n##\
  \ Java 中的注释\n与 `C++` 和 `C` 一样，Java 支持两种类型的注释，即单行注释和多行注释。这些类型注释的语法如下：\n\n### 单行注释：\n\
  ```\n//<comment>\n```\n\n### 多行注释：\n```\n/*<comment>*/\n```\n注释区域中存在的所有字符都会被 Java\
  \ 编译器直接忽略。\n\n### 空行\n任何仅由空白字符或注释组成的行都被视为空行。这些行会被编译器忽略，且不会包含在可执行文件中。\n\n## 继承\n\
  Java 支持继承。换句话说，在这一编程语言中，可以从一个类派生出另一个类。例如，如果你需要创建一个现有类的扩展新类，那么你就可以简单地从一个现有类派生出这个新类。这允许新类访问现有类中已经实现的元素。在这种情况下，新类被称为派生类，而现有类被称为超类。\n\
  \n## 接口\n如之前所述，Java 的核心在于对象之间的交互。不同对象之间通信的方式是在所谓的“接口”（interface）中定义的。此外，接口也是 Java\
  \ 继承功能的一个重要方面。作为接口的一部分，声明了派生类或子类可以使用的方法。然而，所有声明为子类可用的方法必须在子类中实现。\n\n## 对象与类\nJava\
  \ 是一种面向对象的编程语言。作为具有面向对象特性的语言，Java 支撑了以下核心思想：\n- 继承\n- 多态\n- 抽象\n- 封装\n- 对象\n- 消息传递\n\
  - 类\n- 方法\n- 实例\n\n在此部分，我们将研究类和对象的概念。\n\n**类 (Class)**：类可以被描述为一个蓝图，它声明并定义了对象将实现和使用的属性与方法。\n\
  \n**对象 (Object)**：对象是拥有状态及其特征行为的简单现实实体。例如，如果你考虑一个现实世界的实体——一只拉布拉犬，那么这只狗就是一个对象。但是，它属于狗类。因此，相关的类是\
  \ `Dog`。\n\n### Java 中的对象\n现在让我们深入研究什么是对象。当我们考虑当前的现实时，我们可以发现周围有许多实体，汽车、人类、狗以及其他等。事实上，任何现实世界的实体都可以建模为一个对象。这些实体之间的共同点是它们都包含状态和行为。如果我们考虑一只狗，那么它的状态是`breed`（品种）、`name`（名字）和`color`（颜色）。然而，它的行为包括进食习惯以及跑步和吠叫等特征。\n\
  \n### Java 中的类\n类是制造单个对象的蓝图。下面给出了类的示例：\n\n```\nclass Dogs {\nString breed;\nString\
  \ shade;\nint age;\nvoid eating (){ }\nvoid barking (){ }\n}\n```\n类可以包含以下任何一种变量类型。\n\
  \n**局部变量 (Local variables)**\n在例程、构造函数或代码块内部声明并使用的变量称为局部变量。变量将在方法或作用域内声明并实例化，并在方法执行结束时被销毁。\n\
  \n**实例变量 (Instance variables)**\n实例变量是类内部但在任何方法之外的变量。这些变量在类被加载时实例化。可以从该特定类的任何方法、构造函数或代码块中访问这些变量。\n\
  \n**类变量 (Class variables)**\n类变量是在类内部声明、在任何方法之外，且前面带有 `static` 关键字的变量。\n\n一个类可以拥有任意数量的方法来实现不同类型的方法。在上面的示例中，`eating()`\
  \ 和 `barking()` 是被使用的方法。\n\n下面列出了研究 Java 语言类时需要检查的一些重要主题。\n\n### 构造函数\n在谈论类时，最重要的子主题中一个突出的就是构造函数。每个类都有一个构造函数。如果我们没有显式地为类编写构造函数，Java\
  \ 编译器会为该类生成一个默认构造函数。每当创建一个对象时，至少会调用一次构造函数。\n\n构造函数的基本原理是它们的名称必须与类名相同。一个类可以有多个构造函数，根据给定的参数和预期的返回类型调用匹配的构造函数。下面给出这种方法的示例实现：\n\
  \n```\npublic class Puppies{\npublic Puppies(){\n}\npublic Puppies(string puppyname){\n\
  }\n}\n```\n上面的类有两个构造函数。其中一个构造函数不需要参数。然而，另一个构造函数需要一个等于小名的字符串。Java 还支持单例类（Singleton\
  \ Classes），你有能力为类创建一个且仅有的对象。\n\n## 创建对象\n如之前所述，类为对象的创建提供了框架。因此，从根本上说对象是从类创建的。在 Java\
  \ 中，使用 `new` 关键字来创建新对象。\n\n创建任何对象涉及三个步骤。这些步骤所示：\n1. **声明 (Declaration)**：带有变量名和对象类型的变量断言。\n\
  2. **实例化 (Instantiation)**：利用 `new` 关键字创建已声明类的对象。\n3. **初始化 (Initialization)**：`new`\
  \ 关键字后紧跟对构造函数的调用。该调用实例化类并结果创建一个相同的对象。\n\n为了更好地理解该概念，给出的示例实现如下：\n\n```\npublic class\
  \ Puppies{\npublic Puppies(string name){\nSystem.out.println(\"传递的名字是:” + name );\n\
  }\npublic static void main(string []args){\nPuppies samplepuppy = new Puppies( “jimmy”\
  \ );\n}\n}\n```\n如果我们编译并运行上面的代码，将得到以下结果：\n`传递的名字是: jimmy`\n\n## 获取实例变量和方法\n变量和方法通过创建的对象来获取。要访问变量，正确的方法应该是：\n\
  以下语句创建一个对象。\n```\nNewobject = new Constructormethod();\n```\n可以使用以下语句访问与对象相关的变量和方法。\n\
  ```\nNewobject.variablesname;\nNewobject.methodsname();\n```\n这里给出了该概念的示例实现：\n\n\
  ```\npublic class Dog{\nint dogAge;\npublic dogAge(String dogname){\nSystem.out.println(“狗传递的名字是\
  \ :” + dogname );\n}\npublic void initAge( int dogage ){\ndogAge = dogage;\n}\n\
  public int getDogAge( ){\nSystem.out.println(“狗现在的年龄是:” + dogAge );\nreturn dogAge;\n\
  }\npublic static void main(String []args){\nDog myDog = new Dog( “jimmy” );\nmyDog.initAge(\
  \ 5 );\nmyDog.getDogAge( );\nSystem.out.println(“变量 dogAge 的值是:” + myDog.dogAge\
  \ );\n}\n}\n```\n编译并执行以下代码后，你将看到以下结果：\n`变量 dogAge 的值是: 5`\n\n## 源文件声明规范\n作为该部分的最后，我们现在研究源文件的声明标准。这些原则在源文件中声明类、导入声明和包时至关重要。\n\
  \n- 每个源文件只能有一个公共类（public class）。\n- 一个源文件可以有多个非公共类。\n\n\n\n\npublic 类 `name` 应该是源文档的名称。源文件名必须以\
  \ `.java` 字符串结尾。例如，如果类名是 `public class Employeerecord{}`，那么源文档应该保存为 `Employeerecord.java`。\n\
  \n如果类声明在包（package）内部，那么包声明应当是源记录中的第一个陈述。\n\n如果存在导入（import）语句，则它们必须置于包声明和类揭示之间。如果没有包声明，那么导入语句应该是源文件的第一行。\n\
  \n导入语句和包声明将告知源记录中显示的所有类。在源文件中为不同的类声明不同的导入和/或包说明是不切实际的。\n\n类有几种访问级别。此外，还有不同类型的类，包括\
  \ `final` 类，以及其他的若干类。除了上述上述的类之外，Java 还有一些不常见的类，被称为 `Inner` 类（内部类）和 `Anonymous` 类（匿名类）。\n\
  \n## Java 包\n\n基本上，它是一种对类和接口分类的方法。在 Java 中创建应用程序时，会组成许多类和接口。在这种情况下，对这些类进行排序是一项不可或缺的要求，并使生活变得简单得多。在\
  \ Java 中，如果给出一个包含类名和包名的完全限定名，那么编译器可以轻松地找到源代码或类。导入声明是为编译器提供正确区域以找到该特定类的方法。\n\n例如，为了加载\
  \ `java_installation/java/io` 中可访问的所有类，你必须使用以下语句：\n\n```\nimport java.io.*;\n```\n\
  \n该概念的示例实现下所示：\n\n以下代码使用了两个类 `Employeerecord` 和 `Employeerecordtest`。第一步是在你的系统中打开打算使用的文本编辑器，并将下方所示的代码复制并粘贴到文本编辑器应用程序中。请记住，代码中的公共类是\
  \ `Employeerecord`。因此，文件名应该是 `Employeerecord.java`。该类使用了如下的变量、方法和构造函数：\n\n```java\n\
  import java.io.*;\n\npublic class Employeerecord {\n    int empage;\n    String\
  \ empname;\n    double empcompensation;\n\n    public Employee(string empname){\n\
  \        this.empname = empname;\n    }\n\n    public void employeeage(int employeeage){\n\
  \        empage = employeeage;\n    }\n\n    public void empcompensation(double\
  \ empcompensation){\n        empcompensation = empcompensation;\n    }\n\n    public\
  \ void printemp(){\n        System.out.println(“empname:”+ empname );\n        System.out.println(“empage:”\
  \ + empage );\n        System.out.println(“empcompensation:” + empcompensation);\n\
  \    }\n}\n```\n\n正如刚才在此练习中指定的，处理从 main 函数开始。\n\n因此，为了这个目标，我们应该为这个 `Employeerecord`\
  \ 类创建一个 main 函数。下面是 `Employeerecordtest` 类，它创建了两个 `Employeerecord` 类实例，并为每个项目调用技术为每个变量分配值。你可以将此文件保存为\
  \ `Employeerecordtest.java`。\n\n```java\nimport java.io.*;\n\npublic class Employeerecordtest{\n\
  \    public static void main(String args[]){\n        Employeerecord employee1 =\
  \ new Employeerecord“Jack Wright”); \n        Employeerecord employee2 = new Employeerecord“Mary\
  \ John”); \n        employee1.employeeage(32);\n        employee1.empcompensation(5000);\n\
  \        employee2.employeeage(25);\n        employee2.empcompensation(2000);\n\
  \        employee1.printemp();\n        employee2.printemp();\n    }\n}\n```\n\n\
  编译并执行后，你将获得以下输出：\nempname: Jack Wright\nempage: 32\nempcompensation: 5000\nempname:\
  \ Mary John\nempage: 25\nempcompensation: 2000\n\n## 基本数据类型\n\n变量只是用于存储值的内存区域。这意味着当你创建一个变量时，你就在内存中节省了一些空间。根据变量的数据类型，工作框架会分配内存并选择可以放入所持内存的内容。\n\
  \n因此，通过为变量指定不同的数据类型，你可以在这些变量中存储整数、小数或字符。\n\nJava 中有两种可用的数据类型：\n1. 引用/对象数据类型\n2.\
  \ 基本数据类型\n\n## 基本数据类型\n\nJava 支持八种基本信息类型。基本数据类型由语言预定义，并用特定的短语命名。本节将详细讨论这些数据类型。\n\
  \n### byte:\n\n`byte` 信息类型是一个 8 位的带符号补码整数。\n\n最大值为 `2⁷ -1`，等于 `127`。该值也包含在这些值的范围内。\n\
  最小值为 `-2⁷`，等于 `-128`。\n存储在此类型变量中的默认值为 `0`。\n`byte` 信息类型用于在大型数组中节省空间，特别是数字的设置，因为一个字节比一个\
  \ `int` 小四倍。\n\n示例：\n```java\nbyte x = 200, byte y = -20\n```\n\n### short:\n\n\
  `short` 信息类型是一个 16 位的带符号补码数。\n最大值为 `2¹⁵ -1`，等于 `32767`。该值也包含在这些值的范围内。\n最小值为 `-2¹⁵`，等于\
  \ `-32768`。\n\n示例：\n```java\nshort x = 42, short y =76\n```\n\n### int:\n\n`int`\
  \ 信息类型是一个 32 位的带符号补码数。\n最大值为 `2³¹ -1`，等于 `2147483647`。该值也包含在这些值的范围内。\n最小值为 `-2³¹`，等于\
  \ `-2147483648`。\n`int` 通常作为整数的默认信息类型。\n\n示例：\n```java\nint x = 8263, int y = -647\n\
  ```\n\n### long:\n\n`long` 信息类型是一个 64 位的带符号补码整数。\n最大值为 `2⁶³ -1`，等于 `9223372036854775807`。\n\
  最小值为 `-2⁶³`，等于 `-9223372036854775808`。\n`long` 在需要比 `int` 更大的内存范围时使用。\n\n示例：\n```java\n\
  long x = 174636L, long y = -53645L\n```\n\n### float:\n\n`float` 是一种类型以单精度 32 位\
  \ IEEE 754 浮点数为特征。\n`float` 通常在大型浮点数数组中节省内存。\n该数据类型的默认值为 `0.0f`。\n\n示例：\n```java\n\
  float x = 254.3f\n```\n\n### double:\n\n`double` 信息类型是双精度 64 位 IEEE 754 浮点数。\n`double`\
  \ 通常作为小数属性的默认信息类型。\n该数据类型的默认值为 `0.0d`。\n\n示例：\n```java\ndouble x = 321.4\n```\n\n\
  ### boolean:\n\n`boolean` 信息类型表示比特数据。\n任何 `boolean` 变量可以是两个值之一：`true` 或 `false`。\n\
  `boolean` 信息类型用于跟踪真/假条件的基本旗帜。\n该数据类型的默认值为 `false`。\n\n示例：\n```java\nboolean check\
  \ = true;\n```\n\n### char:\n\n`char` 信息类型是一个单 16 位 Unicode 字符。\n该类型变量的最大值为 `\\\
  uffff`（或 65535）。\n该类型变量的最小值为 `\\u0000`（或 0）。\n\n示例：\n```java\nchar text = 'a';\n\
  ```\n\n## 引用数据类型\n\n引用变量通过类的特征化构造函数创建。\n\n\n\n\n它们被用于访问对象。这些变量（常量）被声明为特定的数据类型，且该类型不可更改。此类数据类型的几个示例是\
  \ `Employee` 和 `Dog`。\n\n类对象和不同类型的变量属于引用数据类型。\n\n任何引用变量的默认估值都是无效的。\n\n引用变量可以用于引用已声明种的任何对象。\n\
  \n示例：`myanimal = new Animals(“rabbit”);`\n\n## Java 字面量\n\nJava 中的字面量是固定值的源码表示。它们在代码中被具体地表达，而不经过任何计算。字面量可以分配给任何基本类型变量。例如：\n\
  \n```java\nbyte x = 86;\nchar x = “a”\n```\n\n`int`、`byte`、`short` 和 `long` 也可以以十六进制（16\
  \ 进制）、十进制（10 进制）或八进制（8 进制）数字框架进行通信。在利用这些数字框架表示字面量时，使用前缀 `0` 表示八进制，而使用前缀 `0x` 表示十六进制。例如，\n\
  \n```java\nint numd = 134;\nint numo = 0243;\nint numx = 0x95;\n```\n\nJava 中的字符串字面量与大多数其他编程语言一样，通过在一对双引号之间封装一组字符来确定。\n\
  \n字符串字面量的示例为：\n\n“Hi Everyone” “two\\nlines” “\"these characters are inside quotes\"\
  ”\n\n字符串类型的字面量可以包含任何 Unicode 字符。例如：`String news = “\\u0001”`。\n\n你也可以在 Java 中转义序列。以下是你可以使用的转义序列列表：\n\
  \n- 双引号 - `\"`\n- 回车 (0x0d) - `\\r`\n- 新行 (0x0a) - `\\n`\n- 单引号 - `'`\n- 退格 (0x08)\
  \ - `\\b`\n- 换页 (0x0c) - `\\f`\n- 制表符 - `\\t`\n- 空格 (0x20) - `\\s`\n- 八进制字符 (ddd)\
  \ - `\\ddd`\n- 反斜杠 - `\\`\n- 十六进制 UNICODE 字符 (xxxx) - `\\uxxxx`\n\n## 变量类型\n\n变量为我们提供了代码可以控制的具名容量。Java\
  \ 中的每个变量都有特定的类型，该类型决定了变量内存的大小和格式；内存中可以存储的值范围；以及可以与变量关联的操作 set。在使用所有变量之前，必须对其进行显式声明。变量可以用以下方式声明：`Data\
  \ type <variable name>;`\n\n这里 `data type` 是 Java 的数据类型之一。相反，变量是与变量关联的名称或标识符。要声明多个指定类型的变量，你可以使用逗号分隔的列表。这里是声明的几个示例：\n\
  \n以下声明声明了三个整数变量。\n\n```java\nint x, y, z;\n```\n\n同样，也可以声明其他数据类型的变量。Java 支持三种类型的变量。这些类型如下：\n\
  1. 类/静态变量\n2. 实例变量\n3. 局部变量\n\n## 局部变量\n\n局部变量在方法、构造函数或作用域中声明。\n\n局部变量在进入构造函数或方法时创建，一旦退出方法、构造函数或作用域，该变量将被销毁。\n\
  \n访问修饰符不能用于局部变量。\n\n局部变量仅在声明的方法、构造函数或作用域内部可见。\n\n局部变量在栈级别执行。\n\n这些变量没有默认值。因此，局部变量在第一次使用之前必须被声明并分配一个初始值。\n\
  \n### 示例实现：\n\n在这里，`age` 是一个局部变量。它在 `pupage()` 方法内部被定义，其范围仅限制于此方法。\n\n```java\n\
  public class myTest{\n    open void newfunc(){\n        int myvar = 1;\n       \
  \ myvar = myvar + 10;\n        System.out.println(“The value of myvar is: ” + myvar);\n\
  \    }\n    public static void main(string args[]){\n        mytest = new myTest\
  \ ();\n        mytest.myfunc();\n    }\n}\n```\n\n此代码执行的输出为：\n`The value of myvar\
  \ is: 11`\n\n## 实例变量\n\n实例变量的声明在类内部。然而，它是在方法、构造函数或任何作用域之外创建。\n\n当使用 `new` 关键字创建对象时会创建实例变量，并在对象被销毁时销毁。\n\
  \n当内存中为对象分配空间时，会为每个变量值创建一个空间。\n\n实例变量可以在类级别在使用之前或之后声明。\n\n实例变量持有的值必须被多个方法、构造函数或部分引用，或者对象表达式中在整个类中必须可见的关键部分。\n\
  \n实例变量可以赋予访问修饰符。\n\n实例变量有默认值。对于数字，默认值是 0。然而，对于 `Booleans`，它是 `false`，对于对象引用，它是无效的。值可以在语句中或构造函数内部分配。\n\
  \n类变量对于类中的所有方法、构造函数和作用域都是可见的。通常，建议将这些变量设为私有（访问级别）。然而，可以使用访问修饰符为这些变量赋予子类可见性。\n\n\
  可以通过在类内部调用变量名来访问实例变量。此语句可用于语句：`Objectreference.variablename.`\n\n### 示例实现：\n\n```java\n\
  import java.io.*;\n\npublic class Employeerecord{\n    public String empname;\n\
  \    private double empcompensation;\n\n    public Employee (String name){\n   \
  \     empname = name;\n    }\n    public void initsalary(double empsalary){\n  \
  \      empcompensation = empsalary;\n    }\n    public void printemployee(){\n \
  \       System.out.println(“Employee name : ” + empname);\n        System.out.println(“Employee\
  \ salary :” + empcompensation);\n    }\n    public static void main(string args[]){\n\
  \        Employeerecord employee1 = new Employeerecord“Mary”);\n        employee1.initsalary(7500);\n\
  \        employee1.printemployee();\n    }\n}\n```\n结果：\n`Employee name : Mary`\n\
  `Employee salary :7500.0`\n\n## 类/静态变量\n\n类变量也称为静态变量，在类中使用 `static` 关键字声明，但在构造函数、方法或作用域之外。每个类都只有一个类变量的副本，无论创建了多少对象。\n\
  \n静态变量除了被声明为常量外很少使用。常量是声明为 `private/public`、`static` 和 `final` 的变量。常量变量从不改变其初始值。\n\
  \n静态变量存储在静态内存中。静态变量除了作为私有或公共常量使用外极少使用。静态变量在系统启动时创建，在执行停止时销毁。\n\n可见性类似于实例变量。在任何情况下，大多数静态变量被声明为公共，因为它们必须对类的客户端可见。\n\
  \n这些变量的默认值与实例变量相同。对于数字，默认值通常是 0。然而，`Booleans` 的相同值是 `false`，对于对象引用无效无效。值可以在断言或构造函数内部分配。此外，值可以在唯一的静态初始化块中分配。\n\
  \n可以通过调用类名访问静态变量：`Classname.variablename.` 当声明类变量为 `public static final` 时，变量名（常量）必须全大写。此外，静态变量不是公有的，命名约定与局部和实例变量相同。\n\
  \n### 示例实现：\n\n```java\nimport java.io.*;\n\npublic class Employeerecord{\n    private\
  \ static double empcompensation;\n    public static final String empdept = “HR “;\n\
  \n    public static void main(string args[]){\n        empcomp = 7500;\n       \
  \ System.out.println(empdept+” Compensation: ”+empcompensation);\n    }\n}\n```\n\
  结果：\n`HR Compensation: 7500`\n\n\n\n\n修饰符是你添加到定义中的短语，用于改变它们的含义。Java 编程语言拥有丰富且多样的修饰符，包括：\n\
  \n### 非访问修饰符\n\n## Java 访问修饰符\n\n为了使用修饰符，将其短语整合到类、变量或方法的含义中。修饰符位于声明内容的之前。\n\n###\
  \ 访问控制修饰符\nJava 提供了各种访问修饰符来设置类、变量、程序和构造函数的访问级别。四种访问权限为：\n\n- `Private`：类内可见。\n-\
  \ `Default`：包内可见。不需要修饰符。\n- `Secured`：对所有子类和包可见。\n- `Public`：对所有人可见。\n\n### 非访问修饰符\n\
  Java 提供了各种非访问修饰符来实现许多其他用途。\n\n- `Static`：用于创建类变量和方法的 `static` 修饰符。\n- `Final`：用于结束类、变量和方法执行的\
  \ `final` 修饰。\n- `Abstract`：此修饰符用于创建抽象方法和抽象类。\n- `Volatile` 和 `Synchronized`：这些修饰符通常用于线程。\n\
  \n## Java 中的运算符\n\nJava 中的运算符集非常丰富。广而言，Java 中可用的运算符分为以下几类：\n\n- 关系运算符\n- 算术运算符\n\
  - 逻辑运算符\n- 位运算符\n- 杂运算符\n- 赋值运算符\n\n## 算术运算符\n\nJava 中的操作方式本质上与代数中相同。它们与变量配合执行算术操作。以下是\
  \ Java 中可用的算术运算符列表。\n\n| 操作 | 运算符 | 描述 |\n| :--- | :--- | :--- |\n| 加法 | `+` | 相两个变量的值\
  \ |\n| 减法 | `-` | 减去两个变量的值 |\n| 乘法 | `*` | 乘两个变量的值 |\n| 除法 | `/` | 除以两个变量的值。结果为\
  \ |\n| 取模 | `%` | 除法的余数 |\n| 递增 | `++` | 将值加 1 |\n| 递减 | `--` | 将值减 1 |\n\n## 关系运算符\n\
  \nJava 还支持几种关系运算符。Java 支持的关系运算符列表所示。\n\n| 操作 | 运算符 | 描述 |\n| :--- | :--- | :---\
  \ |\n| 等于 | `==` | 比较两个变量的值是否相等 |\n| 不等于 | `!=` | 比较两个变量的值是否不等 |\n| 大于 | `>` | 检查一个值是否大于另一个值\
  \ |\n| 小于 | `<` | 检查一个值是否小于另一个值 |\n| 大于等于 | `>=` | 检查一个值是否大于或等于另一个值 |\n| 小于等于 |\
  \ `<=` | 检查一个值是否小于或等于另一个值 |\n\n## 位运算符\n\nJava 中可用的位运算符可以很容易应用于多种数据类型。\n\n这些数据类型包括\
  \ `byte`、`short`、`long`、`int` 和 `char`。通常，任何位运算符都会按位执行相关操作。例如，考虑整数 `x`，其值为 `60`。因此，`x`\
  \ 的二进制等效值是 `00111100`。\n\n考虑另一个变量 `y`，其值为 `13` 或 `00001101`。如果我们对这两个数字执行位运算 `&`，你将得到以下结果：`x&y\
  \ = 0000 1100`\n\n下表显示了 Java 中可用的位运算符列表。\n\n| 操作 | 运算符 | 描述 |\n| :--- | :--- | :---\
  \ |\n| 二进制与 | `&` | 执行 AND 运算 |\n| 二进制或 | `\\|` | 执行 OR 运算 |\n| 二进制异异 | `^` | 执行\
  \ XOR 运算 |\n| 补码 | `~` | 对一元变量执行取反操作 |\n| 二进制左移 | `<<` | 执行位的左移 |\n| 二进制右移 | `>>`\
  \ | 执行位的右移 |\n\n除了上述提到的，Java 还支持右移零符号填充运算符 (`>>>`)，它会将移后的右侧位填充零。\n\n## 逻辑运算符\n\n\
  逻辑运算符是任何运算符集的不可或缺的一部分。Java 支持的逻辑运算符如表所示。\n\n| 操作 | 运算符 | 描述 |\n| :--- | :--- | :---\
  \ |\n| 逻辑与 | `&&` | 如果两个提到的条件都为真，则返回 True |\n| 逻辑或 | `\\|\\|` | 如果提到的条件一个或两个都为真，则返回\
  \ True |\n| 逻辑非 | `!` | 如果提到的条件为假，则返回 True |\n\n## 赋值运算符\n\nJava 语言支持以下赋值运算符：\n\n\
  | 操作 | 运算符 | 描述 |\n| :--- | :--- | :--- |\n| 简单赋值 | `=` | 将右侧的值赋值给左侧的变量 |\n| 加赋值\
  \ | `+=` | 将右侧的值加到左侧变量的值，并将结果赋值给左侧变量 |\n| 减赋值 | `-=` | 将右侧的值从左侧变量的值减去，并将结果赋值给左侧变量\
  \ |\n| 乘赋值 | `*=` | 将右侧的值乘以左侧变量的值，并将结果赋值给左侧变量 |\n| 除赋值 | `/=` | 将右侧的值除以左侧变量的值，并将结果赋值给左侧变量\
  \ |\n| 取模 | `%=` | 取左侧和右侧的模，并将结果赋值给左侧变量 |\n| 左移 | `<<=` | 取左侧和右侧的左移，并将结果赋值给左侧变量\
  \ |\n| 右移 | `>>=` | 取左侧和右侧的右移，并将结果赋值给左侧变量 |\n| 位与 | `&=` | 取左侧和右侧的位与，并将结果赋值给左侧变量\
  \ |\n| 位异异 | `^=` | 取左侧和右侧的位异异，并将结果赋值给左侧变量 |\n| 位或 | `\\|\\|` | 取左侧和右侧的位或，并将结果赋值给左侧变量\
  \ |\n\n## 杂运算符\n\n除了上述提到的，Java 还支持其他几种运算符。\n\n### 条件运算符 ( ? :)\n条件运算符是一个包含三个操作数的三元运算符。本质上，该运算符用于布尔表达式的评估。运算符测试第一个操作数或条件，如果条件为真，则将第二个值赋予变量。然而，如果条件为假，则将第三个操作数赋予变量。\n\
  \n该运算符的语法如下：\n`变量 a = (<条件>) ? 真值 : 假值`\n\n```\npublic class myTest {\n    public\
  \ static void main(String args[]) {\n        int x, y;\n        x = 5;\n       \
  \ y = (x == 5) ? 15: 40;\n        System.out.println(\"y = \" + y);\n        y =\
  \ (x == 34) ? 60: 95;\n        System.out.println(\"x = \" + y);\n    }\n}\n```\n\
  此代码的编译和执行将给出结果：\ny = 15\nx = 95\n\n### instanceof 运算符\n只有对象引用变量可以使用此运算符。此运算符的目的是检查对象是否是现有类的实例。该运算符的语法如下：\n\
  `(<对象引用变量>) instanceof(<接口/类>)`\n\n```\npublic class myTest {\n    public static\
  \ void main(String args[]) {\n        int x = 4;\n        boolean resultant = x\
  \ instanceof int;\n        System.out.println(resultant);\n    }\n}\n```\n此代码的输出应为\
