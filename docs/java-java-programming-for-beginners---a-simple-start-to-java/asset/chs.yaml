  \ 构造正在执行！\n\n## 嵌套 if…else 语句\n\n嵌套 if-else 构造是允许的，这意味着你可以在另一个 `if` 或 `else if`\
  \ 解释内部使用 `if` 或 `else if` 声明。使用此构造的语法如下：\n\n```java\nif(condition_1){\n// 如果 condition_1\
  \ 为真则执行\nif(condition_2){\n// 如果 condition_2 为真则执行\n}\n}\nelse if(condition_3){\n\
  // 如果 condition_3 为真则执行\n}\nelse\n{\n// 如果所有条件为假则执行\n}\n```\n\n示例实现：\n\n```java\n\
  public class myTest {\n    public static void main(string args[]){\n        int\
  \ i = 1;\n        if( i >= 1 ){\n            System.out.println(“The if construct\
  \ is executing!”);\n            if(i == 1){\n                System.out.println(“The\
  \ nested if construct is executing!”);\n            }\n        }\n        else{\n\
  \            System.out.print(“The else construct is executing!”);\n        }\n\
  \    }\n}\n```\n\n这将产生相应的结果：\n\nif 构造正在执行！\n\n嵌套 if 构造正在执行！\n\n## switch 语句\n\n\
  `switch` 构造允许对变量与一组值进行等效性比较。\n\n每个值被称为一个 `case`，而被比较的变量会在每个 `case` 中进行检查。使用此决策性构造的语法如下：`switch(<condition>){`\n\
  \n```java\ncase value1:\n// 语句\nbreak;\ncase value2 :\n// 语句\nbreak;\ndefault:\n\
  // 可选\n}\n```\n\n相应的规则适用于 `switch` 构造：\n\n- 作为 `switch` 解释一部分使用的变量必须是 short（short）、byte、`char`\
  \ 或 `int`。\n- 你可以在 `switch` 内部拥有任意数量的 `case` 解释。每个 `case` 后面跟着要对比的值和一个冒号。\n- `case`\
  \ 的值类型必须与 `switch` 中的变量类型相同，并且它必须是一个常量（steady）或精确值。\n- 当被比较的变量等于某个 `case` 时，该 case\
  \ 之后的语句将执行，直到遇到 `break`。\n- 当遇到 `break` 时，`switch` 结束，控制流跳转到 `switch` 之后的行。\n- 并不是每个\
  \ `case` 都需要包含一个 `break`。如果没有出现 `break`，控制流将向下贯穿到后续的 `case`，直到遇到 `break` 为止。\n-\
  \ `switch` 声明可以有一个可选的 `default` case，它必须出现在 `switch` 的末尾。`default` case 可用于在没有任何\
  \ `case` 为真时执行某些操作。`default` case 不需要 `break`。但是，根据惯例，建议使用它。\n\n示例实现：\n\n```java\n\
  public class myTest {\n    public static void main(string args[]){\n        char\
  \ mygrade = ‘A’;\n        switch(mygrade)\n        {\n            case “A”:\n  \
  \          // 语句\n            break;\n            case “B” :\n            // 语句\n\
  \            break;\n            default:\n            // 语句\n            System.out.println(“Failed”);\n\
  \        }\n    }\n}\n```\n注：此处示例代码逻辑与原文略有出入（引号符号问题），但根据要求保留了代码块内容。\n\n相应的运行结果适用于\
