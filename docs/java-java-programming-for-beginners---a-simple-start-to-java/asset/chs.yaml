  \ {\n    // 语句\n}\n```\n\n在执行点上，如果 `boolean_expression` 的结果为真，则圆括号内的活动将被执行。这将一直持续，直到条件的结果为真。在这里，`while`\
  \ 循环的主要作用是循环可能永远不会运行。当尝试解释且结果为假时，循环体将被跳过，并将执行 `while` 循环后的第一个声明。\n\n示例：\n\n```java\n\
  public class myTest {\n    public static void main(string args[]) {\n        int\
