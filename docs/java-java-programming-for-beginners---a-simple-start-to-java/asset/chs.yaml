  public static int minval(int num1, int num2) {\n    int minvalue;\n    if (num1\
  \ > num2) minvalue = num2;\n    else minvalue = num1;\n    return minvalue;\n}\n\
  ```\n\n### 调用方法\n\n要使用一个方法，必须对其进行调用。技术调用有两种方式，即技术返回一个值或不返回任何值（无返回值）。系统调用的方法是基本的。当项目调用一个方法时，系统控制权会转移到被调用的方法。该被调用的方法在两种条件下会将控制权返回给调用者。这些条件包括：\n\
  \n1. 到达了方法的结束大括号。\n2. 执行了 return 语句。\n\n返回 `void` 的方法被视为声明的调用。让我们考虑一个示例：\n\n```java\n\
  System.out.println(“This is the end of the method!”);\n```\n\n返回值的方法可以通过附图看到：`double\
  \ resultant = sumval(4.2, 2.5);`\n\n### 示例实现：\n\n```java\npublic class Minnumber{\n\
  \    public static void main(string[] args) {\n        double x = 21.5;\n      \
  \  double y = 2.0;\n        double z = minvalfunc (x, y);\n        System.out.println(“The\
  \ returned value = ” + z);\n    }\n    public static double minvalfunc (double num1,\
  \ double num2) {\n        double minval;\n        if (num1 > num2)\n           \
  \ minval = num2;\n        else\n            minval = num1;\n        return minval;\n\
  \    }\n}\n```\n\n这将产生相应的结果：\n`The returned value = 2.0`\n\n### void 关键字\n\n`void`\
  \ 关键字允许我们创建不返回值的方法。在这里，在附的插图中，我们正在考虑一个 `void` 方法。此函数是一个 `void` 方法，不返回任何值。对 void\
  \ 系统调用必须是一个声明，例如 `rankpoints(657.3);`。这是一个 Java 解释语句，如所示以分号结尾。\n\n### 示例实现：\n\n\
  ```java\npublic class Myexample {\n    public static void main(string[] args) {\n\
  \        rankpoints(657.3);\n    }\n    public static void rankpoints(double valfoc)\
  \ {\n        if (valfoc >= 100.5) {\n            System.out.println(“A1 Rank”);\n\
  \        }\n        else if (valfoc >= 55.4) {\n            System.out.println(“A2\
  \ Rank”);\n        }\n        else {\n            System.out.println(“A3 Rank”);\n\
  \        }\n    }\n}\n```\n\n这将交付相应的结果：\n`A1 Rank`\n\n### 按值传递参数\n\n在调用过程工作期间，需要传递内容。这些内容应该与其函数调用中的特定参数在同一个请求中。参数可以通过引用或值传递。按值传递参数意味着带有参数调用方法。通过这种方式，参数的值被传递给参数。\n\
  \n### 示例实现：\n\n附带的项目演示了按值传递参数的示例。\n\n```java\npublic class Myswapping {\n    public\
  \ static void main(string[] args) {\n        double x = 0.43;\n        double y\
  \ = 34.65;\n        System.out.println(“Values of X and Y before swapping, x = ”\
  \ + x + ” and y = ” + y); myswapfunc (x, y);\n        System.out.println(\"\\\\\
  nValues of X and Y after swapping: “);\n        System.out.println(“x = ” + x +\
  \ ” and y is ” + y);\n    }\n    public static void myswapfunc (int x, int y) {\n\
  \        System.out.println(“Inside the function: Values of X and Y before swapping,\
  \ x = ” + x + ” y = ” + y);\n        System.out.println(“Inside the function: Values\
  \ of X and Y after swapping, x = ” + x + ” y = ” + y);\n    }\n}\n```\n\n### 方法重载\n\
  \n当一个类拥有两个或多个相同名称但参数不同的方法时，被称为方法重载。这与重写不同。在重写中，方法具有相同的名称、相同的参数数量、数据类型等。\n\n下方的插图阐明了这一点：\n\
  \n```java\npublic class Myoverloading{\n    public static void main(string[] args)\
  \ {\n        int x = 50;\n        int y = 34;\n        double s = 14.3;\n      \
  \  double r = 13.6;\n        int resultant1 = minfunc (x, y);\n        double resultant2\
  \ = minfunc (s, r);\n        System.out.println(“Value of minfunc = ” + resultant1);\n\
  \        System.out.println(“Value of minfunc = ” + resultant2);\n    }\n    public\
  \ static int minfunc(int num1, int num2) {\n        int minval;\n        if (num1\
  \ > num2)\n            minval = num2;\n        else\n            minval = num1;\n\
  \        return minval;\n    }\n    public static double minfunc(double num1, double\
  \ num2) {\n        double minval;\n        if (num1 > num2)\n            minval\
  \ = num2;\n        else\n            minval = num1;\n        return minval;\n  \
  \  }\n}\n```\n\n重载方法使程序更清晰。在这里，方法具有相同名称但不同的参数。\n\n### 命令行参数\n\n当你运行它时，你可能需要向方法传递数据。这是通过命令行参数来实现的。\n\
  \n示例：\n\n```java\npublic class Mycommand {\n    public static void main(string args[])\
  \ {\n        for(int k=0; k<args.length; k++){\n            System.out.println(“ARGS[”\
  \ + k + “]: ” + args[k]);\n        }\n    }\n}\n```\n\n### 构造函数\n\n构造函数在创建对象时被调用。它与类同名，且没有返回类型。它用于初始化对象。\n\
  \n构造函数分为两种：\n1. 默认构造函数：如果程序员没有定义构造函数，Java 会提供一个默认。\n2. 参数构造函数：接受参数来初始化对象的构造函数。\n\
  \n下方的插图阐明了这一点：\n\n```java\npublic class Myclass {\n    int i;\n    Myclass() {\n\
  \        i = 0;\n    }\n    Myclass(int k) {\n        i = k;\n    }\n}\npublic class\
  \ Myconsdemo {\n    public static void main(string args[]) {\n        Myclass obj1\
  \ = new Myclass();\n        System.out.println(obj1.i);\n        Myclass obj2 =\
  \ new Myclass(35);\n        System.out.println(obj2.i);\n    }\n}\n```\n\n### 重载构造函数\n\
  \n构造函数可以通过具有相同名称但不同参数列表的多个构造函数来进行重载。这允许以不同的方式初始化对象。\n\n```java\npublic class Myclass\
  \ {\n    int x;\n    int y;\n    Myclass() {\n        x = 0;\n        y = 0;\n \
  \   }\n    Myclass(int x) {\n        this.x = x;\n        y = 0;\n    }\n    Myclass(int\
  \ x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n}\n```\n\n### finalize(\
  \ ) 方法\n\n`finalize()` 方法在对象从内存中移除之前由垃圾器调用。它用于执行清理操作，如关闭文件流或数据库连接。\n\n```java\n\
  public class Myclass {\n    protected void finalize() {\n        System.out.println(\"\
  Object is being destroyed\");\n    }\n}\n```\n\n\n\n\n\n可以想象调用一个在对象最后销毁之前被调用的方法。此方法被称为\
  \ `finalize()`，它可以被用于确保项能够整洁地结束。例如，你可以利用 `finalize()` 来验证该对象拥有的打开记录已关闭。要向类中添加终结器（finalizer），你基本上调用\
  \ `finalize()` 即可。Java 会在准备重用该类对象的任何点调用该技术。\n\n在此函数内部，你将指出在对象被移除之前必须执行的活动。使用和实现此函数的语法如下：\n\
  \n```java\nprotected void finalize() {\n    //Statements\n}\n```\n\n用于该方法的访问修饰修饰符确保了该方法无法被特定类之外的元素访问。这意味着你无法知道该方法何时执行或如何执行。\n\
  \n## 文件处理\n\n在日常的 I/O 编程中，你可能需要的所有类都包含在 `java.io` 包中。该包中存在的流泛指了输出和输入位置。此外，Java 支持的流包括对象、基本数据类型和本地化字符。流可以简单地描述为顺序排列的数据。\n\
  \n虽然 `inputStream` 可用于从源输入数据，但 `OutputStream` 可用于向汇点输出数据。Java 提供的 I/O 支持是灵活且广泛的。本章似乎涵盖了\
  \ Java 文件处理的所有基本方面。\n\n### 字节流\n\nJava 中的字节流用于执行 8 位字节的输出和输入。尽管有很多与字节流识别的类，但最常用的类是\
  \ `FileOutputStream` 和 `FileInputStream`。这里有一个关于它们在实际编程中使用的示例。\n\n```java\nimport\
  \ java.io.*;\n\npublic class Filecopy {\n    public static void main(string args[])\
  \ throws IOException {\n        FileInputStream inputx = null;\n        FileOutputStream\
  \ outputx = null;\n        try {\n            inputx = new FileInputStream(\"inputfile.txt\"\
  );\n            outputx = new FileOutputStream(\"outputfile.txt\");\n          \
  \  int charx;\n            while ((charx = inputx.read()) != -1) {\n           \
  \     outputx.write(charx);\n            }\n        } finally {\n            if\
  \ (inputx != null) {\n                inputx.close();\n            }\n         \
  \   if (outputx != null) {\n                outputx.close();\n            }\n  \
  \      }\n    }\n}\n```\n\n目前我们应该有一个记录 `inputfile.txt`，其内容为：这仅用于测试目的。\n\n作为一个重要的步骤，编译并执行上述代码。代码的执行将导致\
  \ `outputfile.txt` 文件的创建。\n\n### 字符流\n\nJava 字节流用于执行 8 位字节的输出和输入。相反，Java 字符流用于执行\
  \ 16 位 Unicode 的输出和输入。\n\n尽管有很多与字符流识别的类，但最常用的类包括 `FileReader` 和 `FileWriter`。\n\n\
  这里值得提到 `FileReader` 的实现利用了 `FileInputStream`，`FileWriter` 利用了 `FileOutputStream`。这可能让你好奇两者之间的区别是什么。`FileReader`\
  \ 一次读取两个字节，而 `FileWriter` 一次组合两个字节。我们可以重新组合上面的示例，利用这两个类将一个信息记录（带有 Unicode 字符）复制到\
  \ `outputfile.txt` 中。\n\n```java\nimport java.io.*;\n\npublic class Mycopyfile {\n\
  \    public static void main(string args[]) throws IOException {\n        FileReader\
  \ inputx = null;\n        FileWriter outputx = null;\n        try {\n          \
  \  inputx = new FileReader(\"inputfile.txt\");\n            outputx = new FileWriter(\"\
  outputfile.txt\");\n            int charx;\n            while ((charx = inputx.read())\
  \ != -1) {\n                outputx.write(charx);\n            }\n        } finally\
  \ {\n            if (inputx != null) {\n                inputx.close();\n      \
  \      }\n            if (outputx != null) {\n                outputx.close();\n\
  \            }\n        }\n    }\n}\n```\n\n现在我们如何有一个记录 `inputfile.txt`，其对应的文本为：这仅用于测试目的。\n\
  \n编译并执行包含此代码的文件。该代码的执行应该创建一个输出文件 `outputfile.txt`。\n\n## 标准流\n\n所有的编程语言都支持标准 I/O，客户端代码可以从控制台获取信息，并在机器屏幕上交付相应的输出。如果你对\
  \ C 或 C++ 有一些了解，那么你必须注意三个标准工具，即 `STDIN`、`STDOUT` 和 `STDERR`。Java 提供了三个标准流，下文讨论：\n\
  \n- **标准错误 (Standard Error)**：用于产生客户端代码创建错误信息，通常使用机器屏幕作为标准错误流，并称为 `System.err`。\n\
  - **标准输出 (Standard Output)**：用于产生客户端代码创建的信息，通常使用机器屏幕作为标准输出流，并称为 `System.out`。\n\
  - **标准输入 (Standard Input)**：用于向客户端代码鼓励信息，通常使用控制台作为标准数据流，并称为 `System.in`。\n\n示例实现：\n\
  \n```java\nimport java.io.*;\n\npublic class Myreadconsole {\n    public static\
  \ void main(string args[]) throws IOException {\n        InputStreamReader cinx\
  \ = null;\n        try {\n            cinx = new InputStreamReader(System.in);\n\
  \            System.out.println(\"Input string, press “e” to exit.\");\n       \
  \     char charx;\n            do {\n                charx = (char) cinx.read();\n\
  \                System.out.print(charx);\n            } while(charx != 'e');\n\
  \        } finally {\n            if (cinx != null) {\n                cinx.close();\n\
  \            }\n        }\n    }\n}\n```\n\n上述代码必须保存在文件 `Myreadconsole.java` 中。在编译并执行此代码后，系统必须能够接收字符。\n\
  \n## 读取和写入文件\n\n如前所述，流可以被定义为信息的序列。`InputStream` 用于从源读取信息，`OutputStream` 用于向汇点输出信息。\n\
  \n这里是管理输入输出流的重要类。两个核心流是 `FileInputStream` 和 `FileOutputStream`，将在后续节介绍：\n\n### FileInputStream\n\
  \n此流用于从文件中读取信息。对象可以利用 `new` 关键字创建，并且有几种构造函数可用。`InputStream` 可以以下方式读取文件：\n\n```java\n\
  InputStream inputx = new FileInputStream(\"inputfile.txt\");\n```\n\n构造函数接受一个记录以创建数据流对象。最初，我们利用\
  \ `File()` 技术创建一个记录：\n\n```java\nFile myfx = new File(\"inputfile.txt\");\nInputStream\
  \ inputx = new FileInputStream(myfx);\n```\n\n当你控制 `InputStream` 对象时，有一系列辅助方法，可以用于读取流或对流执行不同的操作。\n\
  \n```java\nprotected void finalize() throws IOException {}\n```\n\n此系统清理与文件的任何关联，并确保该文件输出流的本地方法被调用。此外，此方法也可能抛出异常。\n\
  \n```java\npublic void close() throws IOException {}\n```\n\n此系统关闭文件的输出流并释放与其相关的任何框架资源。它也可能抛出异常。\n\
  \n```java\npublic int available() throws IOException {}\n```\n\n此函数返回一个 int，表示输入流仍可读取的字节数。\n\
  \n```java\npublic int read(int r) throws IOException {}\n```\n\nread 方法用于从 `InputStream`\
  \ 读取内容并返回 int 类型的下一个字节。然而，在到达文件末尾时它会返回 -1。\n\n```java\npublic int read(byte[] r)\
  \ throws IOException {}\n```\n\n此 read 方法的操作与上述 read 方法相似，区别在于它读取给定数组 `r` 的数据长度。该函数返回读取的字节数，并在到达文件末尾时返回\
  \ -1。\n\n\n\n\n\n其他输入流也可供使用。其中一些包括：`DataInputStream`、`ByteArrayInputStream`。\n\n\
  ### `FileOutputStream`\n\n`FileOutputStream` 用于创建文件并向其中写入文本。如果文件目前不存在，该流会在打开它进行输出之前创建一个文件。这里有两个可以用于创建\
  \ `FileOutputStream` 对象的构造函数。\n\n### 方法 1:\n```java\nOutputStream myfx = new FileOutputStream(\"\
  c:/java/hi\")\n```\n\n### 方法 2:\n```java\nFile myfx = new File(\"c:/java/hi\");\n\
  OutputStream myfx = new FileOutputStream(myfx);\n```\n\n当你控制一个 `OutputStream` 对象时，有一份辅助方法列表可以使用，这些方法可用于与流保持联系或对流执行不同的操作。\n\
  \n```java\npublic void write(int w) throws IOException {}\n```\n该方法将带标记的字节写入输出流。\n\
  \n```java\nprotected void finalize() throws IOException {}\n```\n此策略会清理与记录相关的任何关联。此外，它还保证了用于该文件输出流的本地方法被调用。此方法可能会抛出异常。\n\
  \n```java\npublic void close() throws IOException {}\n```\n此方法关闭文件的输出流。此外，它会释放与文档相关的任何框架资源。此方法也会抛出\
  \ `IOException`。\n\n```java\npublic void write(byte[] w)\n```\n该方法从指定的字节数组向 `OutputStream`\
  \ 写入 `w.length` 个字节。\n\n还有其他可用的命令输出流，如下：`ByteArrayOutputStream`、`DataOutputStream`。\n\
  \n### 示例实现:\n```java\nimport java.io.*;\n\npublic class Mytestfile{\n    public\
  \ static void main(string args[]){\n        try{\n            byte bytewrite []\
  \ = {45,64,22,49,1};\n            OutputStream myos = new FileOutputStream(\"mytest.txt\"\
  );\n            for(int i=0; i < bytewrite.length ; i++){\n                myos.write(\
  \ bytewrite[x] );\n            }\n            myos.close();\n            InputStream\
  \ myis = new FileInputStream(\"mytest.txt\");\n            int sizex = myis.available();\n\
  \            for(int z=0; z< sizex; z++){\n                System.out.print((char)myis.read()\
  \ + \" \");\n            }\n            myis.close();\n        }catch(IOException\
  \ e){\n            System.out.print(\"Exception Caught!\");\n        }\n    }\n\
  }\n```\n上述代码将创建一个文件 `mytest.txt`，并以并行组织组合给数字。同样的内容将输出到 `stdout` 屏幕。\n\n### 文件导航与\
  \ I/O\n\n我们通过接触几个不同的类来了解文件导航和 I/O 的基础知识。\n\n- `File` 类\n- `FileWriter` 类\n- `FileReader`\
  \ 类\n\n## 目录\n\n目录是一个 `File`，它可以包含一系列不同的目录和文件。你利用 `File` 对象创建目录，列出索引中可访问的文档。要了解完整要点，请查看可以访问\
  \ `File` 项的所有技术列表以及与索引标识的项。\n\n### 创建目录:\n有两个有用的 `File` 工具方法可以创建目录：`mkdirs()` 方法会同时创建目录和索引中的所有元素。`mkdir()`\
  \ 方法创建一个目录，成功时返回 true，失败时返回 false。失败表示 `File` 对象中指定的路径已存在，或者由于整个路径尚不存在而无法创建索引。\n\
  \n### 示例实现:\n```java\nimport java.io.File;\n\npublic class MyCreateDir {\n    public\
  \ static void main(String args[]) {\n        String directoryname = \"/tmp/user/java/bin\"\
  ;\n        File dir = new File(directoryname);\n        dir.mkdirs();\n    }\n}\n\
  ```\n\n### 列出目录:\n你可以利用 `File` 类提供的 `list()` 方法提供索引中所有可访问记录和目录的列表。\n\n### 示例实现:\n\
  ```java\nimport java.io.File;\n\npublic class MyReadDir {\n    public static void\
  \ main(String[] args) {\n        File myfile = null;\n        String[] paths;\n\
  \        try{\n            myfile = new File(\"/tmp\");\n            mypaths = file.list();\n\
  \            for(String path:mypaths)\n            {\n                System.out.println(path);\n\
  \            }\n        }catch(Exception e){\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n## 异常处理\n\n在程序执行期间，可能会遇到异常或特殊情况。由于这些情况，系统可能会崩溃。异常可能由于多种原因引起。其中一些包括：\n\
  - 找不到需要打开的文件。\n- 客户端输入了无效信息。\n- 通过程中丢失了系统关联或 `JVM` 耗尽了所有可用内存。\n\n这些特殊情况有些是由客户端错误引起的，有些是开发者疏忽造成的，还有一些是以某种方式进入你代码的物理故障。要了解\
  \ Java 中的异常处理如何工作，你必须理解异常的三种分类：\n\n- **错误 (Errors)**：这些完全不是特殊情况。因此，错误可以定义为超出客户端或软件工程师理解和控制范围的问题。在你的代码中，它们通常被忽略，因为你无法处理它们。\n\
  - **运行时异常 (Runtime Exceptions)**：这些是通常可以避免的特殊情况。它们在代码中通常被忽略。\n- **受检异常 (Checked\
  \ Exceptions)**：这些是开发者通常可以预料的特殊情况。例如，如果要打开的文件未找到，就会发生此类异常。这些异常情况在编译时不能被忽略。\n\n###\
  \ 异常层次\n所有异常类都是 `java.lang.Exception` 类的子类。该类是 `Throwable` 类的子类。除了异常类，还有一个名为 `Error`\
  \ 的子类，它自 `Throwable` 类派生。这些特殊情况通常不被 Java 程序捕获。错误是由运行时环境产生的故障。示例异常为“内存溢出”或“栈溢出”。`Exception`\
  \ 类有两个主要的子类：`IOException` 和 `RuntimeException`。\n\n### 异常方法:\n以下是 `Throwable` 类可用的方法列表。\n\
  \n```java\npublic Throwable getcause()\n```\n该方法返回由 `Throwable` 对象指定的异常原因。\n\n```java\n\
  public String getmessage()\n```\n该方法返回异常的完整消息和细节。此消息通常包含在 `Throwable` 构造中。\n\n```java\n\
  public void printstacktrace()\n```\n该方法将 `toString()` 的结果以及堆栈跟踪打印到 `System.err`（错误输出流）。\n\
  \n```java\npublic String tostring()\n```\n该方法返回类名以及 `getmessage()` 结果的字符串。\n\n```java\n\
  public Throwable fillinstacktrace()\n```\n该方法用当前的堆栈跟踪填充 `Throwable` 对象的栈，并添加到跟踪栈中的任何历史数据。\n\
  \n```java\npublic Stacktraceelement [] getstacktrace()\n```\n该方法返回一个包含堆栈跟踪中每个元素的数组。索引为\
  \ 0 的组件对应调用栈的最高点，而最后一个组件对应于调用栈底的系统。\n\n### 获取异常:\n系统利用 `try` 和 `catch` 关键字的组合来发现特殊情况。`try`\
  \ 范围围绕可能会产生异常的代码。此范围内的代码被称为安全代码，使用 try/catch 的结构如下：\n\n```java\ntry {\n    // 可能会产生异常的代码\n\
  }catch(nameofexception exp_1) {\n    // 发生异常时执行的代码\n}\n```\n\n\n\n\n\n`try` 块包含了对你尝试获取的异常类型的声明。如果在受保护的代码中发生了异常，将检查尝试后执行的\
  \ `catch` 块。如果在 `try` 块中发生了此类特殊情况，异常将传递到 `catch` 块，并也会作为系统参数传递。\n\n### 示例实现：\n\n\
  ```java\nimport java.io.*;\n\npublic class MyException{\n    public static void\
  \ main(string args[]){\n        try{\n            int myarr[] = new int[2];\n  \
  \          System.out.println(\"This statement attempts to access the third element\
  \ of the array:\" +\n            a[3]);\n        }catch(arrayindexoutofboundsexception\
  \ e_1){\n            System.out.println(\"The thrown exception is: ” + e_1);\n \
  \       }\n        System.out.println(\"Exception: Out of Bounds\");\n    }\n}\n\
  ```\n\n这将输出相应的结果：\n```\nThe thrown exception is: java.lang.arrayindexoutofboundsexception:\
  \ 3\nException: Out of Bounds\n```\n\n### 使用多个 try 块\n\n单段代码可以拥有多个 `catch` 块来捕获不同的异常。多个\
  \ `try/catch` 块的结构如下：\n\n```java\ntry {\n    // 要测试的语句\n}catch(exceptiontype1 e_1)\
  \ {\n    // catch 块 1\n}\ncatch(exceptiontype2 e_2) {\n    // catch 块 2\n}\ncatch(exceptiontype3\
  \ e_3) {\n    // catch 块 3\n}\n```\n\n这段代码使用了三个 catch。然而，你可以根据需要为代码使用任意数量的 catch\
  \ 块。如果在保护的代码中发生了异常，异常将被抛出并首先被第一个 `catch` 块捕获。如果异常类型匹配，则执行该 `catch` 块。但是，如果异常类型不匹配，异常将由下一个\
  \ `catch` 块捕获。此过程将持续，直到找到匹配的异常类型或检查完所有的 `catch` 块为止。\n\n### 示例实现：\n\n```java\ntry{\n\
  \    filex = new Fileinputstream(nameoffile);\n    num = (byte) filex.read();\n\
  }catch(IOException e_1) {\n    e_1.printstacktrace();\n    return -1;\n}catch(filenotfoundexception\
  \ f_1){\n    f_1.printstacktrace();\n    return -1;\n}\n```\n\n### throws 关键字\n\n\
  万一系统没有处理检查异常（checked exception），则该方法必须使用 `throws` 关键字对其进行声明。`throws` 关键字出现在方法签名的末尾。你可以利用\
  \ `throw` 关键字抛出异常，无论是新实例化的异常，还是你刚刚发现的特殊情况。\n\n### finally 关键字\n\n`finally` 关键字用于标记一段在程序中最后执行的代码。无论是否发生了异常，`finally`\
  \ 代码块都会可靠地执行。使用 `finally` 块允许你在无论受保护代码发生任何情况的情况下运行任何需要执行的清理类语句。\n\n### 创建异常\n\n\
  你可以在 Java 中创建自己的异常。在编写异常类时，请记住以下几点：\n\n- 所有异常必须是 `Throwable` 的子类。\n- 如果你需要编写一个自然符合“处理或声明规则”（Handle\
  \ or Declare Rule）的检查异常，你必须创建一个 `Exception` 类的扩展类。\n- 如果你需要编写一个运行时异常（runtime exception），你将创建一个\
  \ `RuntimeException` 类的扩展类。\n\n你可以使用以下结构创建自己的异常：`class MyNewException extends Exception{\
  \ }`\n\n### 常见异常\n\n在 Java 中，可以将异常（Exceptions）和错误（Errors）分为两类。\n\n1. **程序异常**：这些特殊情况由应用程序或\
  \ API 软件工程师明确抛出。示例：`Illegalargumentexception`、`IllegalStateException`。\n2. **JVM\
  \ 异常**：这些是完全或始终由 JVM 抛出的异常/错误。此类别的某些异常包括 `ArrayIndexOutOfBoundsException`、`NullPointerException`\
  \ 和 `ClassCastException`。\n\n## 接口与包\n\n抽象方法组合在一起形成一个包。类实现接口，从而继承接口的抽象方法。接口不是类。\n\
  \n编写接口就像编写类。但它们是两个独立的概念。类描述对象的属性的行为。接口包含了类应该实现的行为。除非实现接口的类是抽象类，否则接口的所有方法都需要在类中实现。\n\
  \n- 接口定义在具有 `.java` 扩展名的文件中，接口名称与文件名匹配。\n- 接口可以包含任意数量的方法。\n- 接口出现在包中，其相关的字节码文件必须位于与包名匹配的目录结构中。\n\
  - 接口的字节码出现在 `.class` 记录中。\n\n另一方面，接口在某些方面是独特且不同于类的。这些：\n\n- 接口不包含任何构造函数。\n- 接口不能实例化。\n\
  - 接口中不能包含实例字段。接口要求其主字段必须是 `final` 且 `static` 的。\n- 所有方法必须是抽象方法。\n- 接口可以扩展不同的接口。\n\
  - 类并不访问接口。实际上，类实现接口。\n\n### 声明接口\n\n为了声明接口，你必须使用 `interface` 关键字。这是一个用于声明接口的简单示例。声明接口的标准结构和语句顺序如下：\n\
  \n```java\nimport java.lang.*;\n\npublic interface Interfacename {\n    //语句\n}\n\
  ```\n\n接口具有以下属性：\n\n- 接口是动态的。声明接口时不需要使用 `abstract` 关键字。\n- 接口中的每个方法都是动态的，因此不需要 `abstract`\
  \ 关键字。\n- 接口方法显然是 `public` 的。\n\n示例实现\n```java\ninterface MyAnimal {\n    public\
  \ void eatinghabits();\n    public void walkinghabits();\n}\n```\n\n### 包\n\n包作为\
  \ Java 的一部分，用于避免命名冲突、控制访问、简化查找/放置和使用类、接口、标识和注解，以及其他许多目的。包可以被描述为相关类型（类、接口、标识和注解）的集合，提供访问安全和命名空间管理。\n\
  \nJava 中的一些包：\n\n- `java.io` – 所有输入输出类都可以在此包中可用。\n- `java.lang` – 所有核心类都可以在此包可用。\n\
  \n开发者可以创建自己的包，或者类/接口的包集合。\n\n\n\n\n\n为了运行一个程序（applet），你必须有一个网络浏览器。applet 可以是一个完全实用的\
  \ Java 应用程序，因为它可以可以使用整个 Java API。\n\napplet 与独立的 Java 应用程序之间存在一些本质区别，包括以下内容：\n\n\
  applet 不产生 `main()` 函数，且 applet 类不会定义 `main()`。\n\napplet 是一个继承并增强了 `java.applet.applet`\
  \ 类的 Java 类。\n\n当客户端看到一个包含 applet 的 ` HTML` 页面时，applet 的代码会自动下载到客户端的机器上。\n\napplet\
  \ 的设计初衷是插入到 ` HTML` 页面内部。\n\n客户端机器上的 `JVM` 会创建 applet 类的实例，并在 applet 的生命周期内创建不同的例程。\n\
  \napplet 的安全性要求非常严格。applet 的安全性经常被提及为沙箱安全，将 applet 比作在沙箱中玩耍的小孩，它必须模拟不同的决策。\n\n`JVM`\
  \ 是查看 applet 的基本要求。`JVM` 既可以是 Web 程序的一个模块，也可以是不同的运行时环境。\n\napplet 需要的其他类可以在单个 Java\
  \ 归档文件 (`JAR`) 中下载。\n\n## Applet 的生命周期\n\n创建任何 applet 都需要实现 `Applet` 类的四个方法。这些方法在下文中得到了讨论。\n\
  \n- `init`: 该方法用于你的 applet 需要的任何初始化。它在 applet 标签内部的 `param` 标签转换后调用。\n- `start`:\
  \ 该方法在程序调用 `init` 策略后自然会被调用。同样，当客户端在离开不同页面后返回包含 applet 的页面时，它也会被调用。\n- `stop`: 该方法在客户端离开\
  \ applet 所在的页面时随之调用。因此，它可以在同一个 applet 中被反复调用。\n- `destroy`: 该技术仅在程序关闭时被调用。由于 applet\
  \ 设计为存在于 ` HTML` 页面上，在客户端离开包含 applet 的页面后，你不应该经常放弃资源。\n\n- `paint`: 该方法在 `start()`\
  \ 方法之后立即被调用。此外，每当程序中 applet 需要重绘自身时，都需要调用此方法。`paint()` 方法继承自 `java.awt`。\n\n## 一个你好，世界”Applet\n\
  \n以下是一个名为 `BasicApplet.java` 的基础 applet：\n\n```java\nimport java.applet.*;\nimport\
  \ java.awt.*;\n\npublic class BasicApplet extends Applet {\n    public void paint\
  \ (Graphics gx) {\n        gx.drawstring (“Say Hello To The World!”, 35, 70);\n\
  \    }\n}\n```\n\n这些导入语句将类引入我们 applet 类的范围内：`java.awt.graphics`, `java.applet.applet`。没有这些导入语句，Java\
  \ 编译器将无法识别 applet 类引用的 `Applet` 和 `Graphics` 类。\n\n## Applet 类\n\n每个 applet 都是 `java.applet.applet`\
  \ 类的增强。基础 `Applet` 类提供了特定的 `Applet` 类可以调用的技术以从程序连接中获取数据和管理。这些包含了以下操作的技术：\n\n- 获取\
  \ applet 的参数\n- 获取包含 applet 的 HTML 记录的系统区域\n- 获取 applet 类注册表的系统区域\n- 在程序中打印状态消息\n\
  - 获取图片\n- 获取声音\n- 播放声音\n- 执行 applet 调整大小\n\n此外，`Applet` 类提供了一个接口，通过该接口查看器或程序获取有关\
  \ applet 的数据并控制 applet 的执行。查看器可以：\n- 请求有关 applet 表单、创建者版权的数据\n- 请求 applet 感知的参数的描述\n\
  - 执行 applet 初始化\n- 执行 applet 销毁\n- 开始 applet 的执行\n- 停止 applet 的执行\n\n`Applet` 类允许这些例程的默认用法。这些执行可以根据需要重写。“你好，世界！”applet\
  \ 本身是完整的。但作为实现的一部分，只重写了 `paint()` 函数。\n\n初学者 jQuery、JavaScript 和 HTML5 入门\n\n*软件工程师编写*\n\
  Scott Sanderson\n\n## 目录\n\n- [第 1 章：引言](https://docs.google.com/document/d/1PEmpr_dft0fjFxGmZpN0Vk8E1eNfbwhMsOYisITJptw/edit#heading=h.2xcytpi)\n\
  - [第 2 章：HTML5 基础](https://docs.google.com/document/d/1PEmpr_dft0fjFxGmZpN0Vk8E1eNfbwhMsOYisITJptw/edit#heading=h.1ci93xb)\n\
  - [第 3 章：JavaScript 基础](https://docs.google.com/document/d/12YBHe7wYK07gdt9Lpl8LCpRyx2SVBnKprZK1EWgGujM/edit#heading=h.3whwml4)\n\
  - [第 4 章：CSS3 基础](https://docs.google.com/document/d/12YBHe7wYK07gdt9Lpl8LCpRyx2SVBnKprZK1EWgGujM/edit#heading=h.2bn6wsx)\n\
  - [第 5 章：HTML5 详解](https://docs.google.com/document/d/1PEmpr_dft0fjFxGmZpN0Vk8E1eNfbwhMsOYisITJptw/edit#heading=h.2xcytpi)\n\
  \n\n\n\n\n## HTML（超文本标记语言）是一种用于创建网页的语言。事实上，这种语言从第一个网页被创建起就一直在使用。然而，随着更现代、更好的版本的推出，其功能也在不断演进。\n\
  \n众所周知这种语言源于 `SGML`（标准通用标记语言），它以前被用于文档出版。HTML 继承了来自 `SGML` 的格式化功能概念及其语法。\n\n对于浏览器而言，HTML\
  \ 使用最有趣且最有用的方面之一，是浏览器同时支持向后兼容和向前兼容。虽然向后兼容通常很容易实现，但向前兼容非常棘手，因为在在这种情况下，问题领域是无限大的。然而，为了实现这一点，浏览器被设计为忽略它们无法识别的标签。\n\
  \n多年来，HTML 一直是人们的需求。但随着时间的推移，人们觉得需要更多，而另一种技术 `XML`（可扩展标记语言）的出现催了这种需求。尽管 `XML` 与\
  \ `HTML` 有许多相似之处，但两者之间存在许多根本区别。首先，`XML` 要求标签匹配，这意味着对于每一个起始标签，必须存在一个闭合标签。\n\n此外，`XML`\
  \ 允许你创建自己的标签，因为它不像 `HTML` 那样拥有固定的标签集。\n\n`XML` 中使用的标签是元标签，或者描述包含起始标签和闭合标签之间的数据的标签。为了确保\
  \ `XML` 文档的有效性，使用名为 `XSD`（XML 架构定义）的技术。然而，这种技术无法验证 `HTML` 文档，因为 `HTML` 文档缺乏定义的结构。\n\
  \n`W3C`（世界维网联盟）引入了 `XHTML` 来尝试修复 `HTML` 的缺陷。根据 `XHTML` 规范，`HTML` 文档被强制遵循 `XML` 的格式规范。因此，这允许使用\
  \ `XSD` 工具对 `HTML` 文档进行验证。尽管在框架中集成 `XML` 了一些问题，但某些问题仍然不断出现。现代令人震惊的问题之一是对多媒体集成日益增长的需求。虽然\
  \ `CSS` 确实了一定程度的格式化，但它已无法满足用户日益增长的需求。\n\n为了给交互性和动画视觉提供支持，该组合增加了一种名为 `JavaScript`\
  \ 的可编程支持。然而，这种支持的初期对程序员来说难以理解，且执行速度缓慢。这导致了诸如 `Flash` 等插件的引入，以获得关注。这些插件执行了预期的任务，但浏览器与多媒体的集成在本质上仍然是松散。\n\
  \n`HTML5` 并不是 `XHTML` 的演进形式。相反，`HTML5` 可以被描述为 `HTML 4.01` 的重新定义形式，以及 `HTML`、`CSS`\
  \ 和 `JavaScript` 如何结合使用来解决用户日益增长的需求。\n\n## 语义标记\n`HTML5` 的基本特性是它强调行为、表现和结构的分离。网站开发的语义标记指定了文档的结构。换句话说，它指定了标签的含义以及它们将为你做什么。另一方面，行为和表现分别由\
  \ `CSS` 和 `JavaScript` 主管。\n\n## HTML5 元素\n在 `HTML` 中，一个元素简单来说包含起始标签、内容和闭合标签的语句。因此，当你写下时：\n\
  \n```html\n<div>\n  <b>This is my world!</b>\n</div>\n```\n\n在这个示例中，`div` 元素包含了从\
  \ `<div>` 到 `</div>` 的所有内容。因此，`<b></b>` 标签也是 `div` 元素的一部分。\n\n**这里必须说明，`HTML5` 是不区分大小写的。因此，无论你为加粗标签写\
  \ `<B>` 还是 `<b>`，浏览器都会认为它们是相同的。\n\n然而，`W3C` 标准建议对标签使用小写。\n\n## 在 HTML5 中使用元素\n`HTML5`\
  \ 定义了超过 100 个元素。这些元素及其定义在附录中提供。\n\n### 如何向元素添加属性？\n附加数据可以以属性的形式添加到起始标签中。属性通常可以表示为\
  \ `name=\"value\"`。属性名的值包含在引号内。对于起始标签，可以添加的属性数量没有限制。对于这些属性，属性有一个名称，但没有值。\n\n示例：\n\
  \n```html\n<div id=\"main\" class=\"mainContent\"></div>\n```\n\n在这里，`id` 和 `class`\
  \ 是属性，其中 `id` 唯一标识元素，`class` 指定了该 `div` 所属的 CSS 样式。\n\n### 布尔属性\n可以使用多种类型的属性。最常用的类型之一是布尔属性。布尔属性可以从允许的值集中取一个值。一些可能的值包括：\n\
  - Checked\n- Disabled\n- Selected\n- Readonly\n\n有两种方法指示布尔属性的值：\n\n```html\n<input\
  \ type=\"checkbox\" name=\"vegetable\" value=\"Broccoli\" checked />\n<input type=\"\
  checkbox\" name=\"vegetable\" value=\"Broccoli\" checked='checked' />\n```\n\n在第一情况下，没有给出值而是被假设的。尽管后者看起来是冗余的形式，但它是更优选的形式，特别是当你使用\
  \ `jQuery` 时。\n\n### 全局属性引用\n`HTML5` 中有一组命名属性可以与任何元素一起。这些属性包括 `accesskey`、`spellcheck`\
  \ 和 `draggable` 以及其他许多。\n\n### 空元素\n某些元素在任何情况下都不包含内容。这些元素包括 `<link>`、`<br>` 和 `<area>`\
  \ 以及其他许多。\n\n### 自闭标签\n如果你使用不包含任何内容的元素，可以使用自闭标签。这种标签的示例是 `<br/>`。但请注意，像 `<div>`\
  \ 这样的标签即使没有内容也必须写成 `</div>`。\n\n### 如何添加扩展属性\n你定义的任何属性扩展扩展属性。需要时，可以为自定义属性命名并赋值。\n\
  \n## 如何添加注释\n注释可以使用 `!` 和两个连字符 `--` 添加。添加注释的语法如下：\n\n```html\n<!--text-->\n```\n\
  \n你也可以使用以下语法添加条件注释：\n\n```html\n<!--[if lte IE7]><html class=\"no-js\" lang=\"en\"\
  ><![endif]-->\n```\n此注释判断使用的浏览器是否早于 IE7。\n\n## 如何创建 HTML 文档\nHTML 文档可以简单描述为包含元数据、内容的框架。\n\
  \nHTML 文档必须以 `<!DOCTYPE html>` 开始。在 `HTML5` 中，该声明指示浏览器以无怪模式或 HTML 兼容模式运行。\n\n下一个标签应该是\
  \ `<html>`。该元素内部包含了 `<head>` 和 `<body>`。`<head>` 元素可以包含 HTML 文档的元数据，使用 `<meta>`\
  \ 标签声明和定义。`<head>` 元素还包含 `<title>` 元素，它有以下作用：\n- 搜索引擎使用\n- 此内容显示在浏览器工具栏中\n- 为页面提供默认名称\n\
  \n`<body>` 元素包含了任何要在 HTML 文档上显示的其他信息。示例 HTML 文档如下：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n  <meta charset=\"utf-8\" />\n  <title>TITLE OF DOC</title>\n</head>\n\
  <body>\n  CONTENT\n</body>\n</html>\n```\n\n注意：\n1. 像 `>` 或 `<` 这样作为 HTML 语法部分的特殊字符可以使用它们的名称或数字在\
  \ HTML 文档中使用。它们的用法语法为：\n`&entity_name` 或 `&entity_number;`\n\n附录包含要使用的实体名称和数字表格。\n\
  \n\n\n\n\n2. 使用制表符、换行符和空格创建的空白会被 HTML 归一化为单个空格。因此，如果你想使用多个空格，必须使用不空空格字符（non-breaking\
  \ space）。例如，如果你想显示 `10 mph` 使 `10` 和 `mph` 之间不被换行分隔，你可以写 `10 &nbsp;mph`。\n\n## 如何嵌入内容\n\
  \n现在你已经知道如何用你的内容创建 HTML 文档，你可能想从其他源向文档嵌入内容。这些内容可能是来自另一个 HTML 文档的文本或 Flash 应用程序。\n\
  \n### 内联框架 (Inline Frames)\n\n内联框架用于在当前 HTML 文档的内容中嵌入 HTML 文档。因此，在某种意义上，此元素创建了嵌套浏览器，因为多个网页加载在同一个窗口中。这些是通过使用\
  \ `<iframe>` 元素实现的。可以使用以下方法导航嵌套浏览上下文：\n\n- `window.parent` – 此 `WindowProxy` 对象代表父浏览上下文。\n\
  - `window.top` – 此 `WindowProxy` 对象代表顶层浏览上下文窗口。\n- `window.frameElement` – 这代表浏览上下文容器，如果没有容器，则返回\
  \ `null`。\n\n`<iframe>` 元素的语法如下：\n\n```html\n<iframe src=“name”></</iframe>\n```\n\
  \n这里的 `name` 属性定义了浏览上下文的名称。该名称可以是任何字符串，如 ‘sample.html’。然而，强类型字符串不应以下划线开头，因为以下划线开头的名称保留给\
  \ `_blank` 等特殊键名。\n\n### 沙箱 (Sandboxing)\n\n沙箱用于避免在你的 HTML 文档中引入弹出窗口或其他任何恶意软件。为了实现这一点，使用了\
  \ `sandbox` 属性。你可以按照以下方式使用该属性：\n\n```html\n<iframe sandbox=”keywords” src=“name”></</iframe>\n\
  ```\n\n当你使用沙箱时，会对调用的上下文实施若干限制。这些限制包括禁用表单、脚本、插件以及自身以外的任何框架。你可以使用等关键词强制系统覆盖这些限制：\n\
  \n- `allow-same-origin`\n- `allow-scripts`\n- `allow-forms`\n- `allow-top-navigation`\n\
  \n可以使用空格分隔来使用多个关键词。\n\n### 无缝嵌入 (Seamless Embedding)\n\n`seamless` 属性可以在 `<iframe>`\
  \ 元素中使用，以这种方式嵌入的内容使得该内容看起来是主内容的一部分。该属性可以使用以下方式使用：\n\n```html\n<iframe seamless=””\
  \ src=“name”></</iframe>\n<iframe seamless src=“name”></iframe>\n<iframe seamless=“seamless”\
  \ src=“name”></iframe>\n```\n\n许多浏览器可能不支持此属性。因此，你可以使用 CSS 来实现类似的效果。\n\n### 超链接 (Hyperlinks)\n\
  \n超链接可以使用 `<a>` 元素实现。该元素可以用于链接外部（另一个 HTML 文档）以及内部（同一个 HTML 文档中的另一个位置）链接。\n\n所有链接都带有下划线，根据链接的性质，链接的颜色会\
  \ way。\n\n- 蓝色 - 未访问的链接\n- 紫色 - 已访问的链接\n- 红色 - 激活链接\n\n`<a>` 元素的第一个属性是 `href`，其值为\
  \ URL 的地址。\n\n外部链接的语法：\n```html\n<a href=”address”>Text</a>\n```\n\n内部链接的语法：\n```html\n\
  <a href=”#id”>Text</a>\n```\n\n这里的 `id` 是你想要链接跳转到的标签的 `id`。然而，如果你只使用 `#` 值，链接将跳转到页面顶部。\n\
  \n与 `<a>` 元素使用的另一个属性是 `target`，它允许你控制链接的行为。例如，如果你想让链接在另一个窗口中打开，则可以使用此属性指定此需求。\n\n\
  - `_blank`: 在新的浏览器窗口中打开链接。\n- `_parent`: 在父窗口中打开链接。\n- `_self`: 在当前窗口中打开链接，并是默认设置。\n\
  - `_top`: 在当前窗口的最顶层框架中打开链接。\n- `<iframe_name>`: 在指定名称的 `<*iframe*>`元素中打开链接。这通常用于菜单。\n\
  \n超链接还可以使用以下语法发送电子邮件：\n\n```html\n<a href=“mailto:email address”>Text</a>\n```\n\
  \n当用户点击链接时，一封电子邮件将发送指定的指定的地址。\n\n## 嵌入图像 (Embedding Images)\n\n`<img>` 元素用于向 HTML\
  \ 文档中添加图像。`<img>` 标签是一个空元素，不需要闭合标签。\n\n该元素所需的标签是 `src`，它指定了存储图像的绝对或相对地址。与 `<img>`\
  \ 标签配合使用的另一个属性是 `target`，用于指定在图像不可用时必须显示的文本。\n\n语法：\n```html\n<img src=”address”\
  \ target=”alternative text”>\n```\n\n需要注意的是，你只是提供了图像的引用，实际上并没有将其嵌入到 HTML 文档中。允许的图像格式有\
  \ `jpeg`、`svg`、`png` 和 `gif`。\n\n### 如何创建图像地图 (How to Create Image Map)\n\n`<map>`\
  \ 元素可以创建可点击的图像地图。为了在地图和图像之间创建链接，必须为地图设置 `name`，并在 `img` 标签的 `usemap` 属性中使用此名称。\n\
  \n`<map>` 元素可以创建可点击的图像地图。为了在地图和图像之间创建链接，必须为地图设置一个 `name`，并在 `img` 标签的 `usemap` 属性中使用此名称。\n\
  \n`<map>` 元素可以创建可点击的图像地图。为了在地图和图像之间创建链接，必须为地图设置一个 `name`，并在 `img` 标签的 `usemap` 属性中使用此名称。\n\
  \n`<map>` 元素可以创建可点击的图像地图。为了在地图和图像之间创建链接，必须为地图设置一个 `name`，并在 `img` 标签的 `usemap` 属性中使用此名称。\n\
  \n`<map>` 元素可以创建可点击的图像地图。为了在地图和图像之间创建链接，必须为地图设置一个 `name`，并在 `img` 标签的 `usemap` 属性中使用此名称。\n\
  \n（注：原文此处存在大量重复，已根据指令要求去重并保持逻辑翻译）\n\n示例：\n```html\n<img src=\"worldmap.gif” width=“145”\
  \ height=“126” alt=“World Map” usemap=”#country” />\n<map name=“country”>\n<area\
  \ shape=“circle” coords=“105,50,30” href=“China.html” alt=“China” />\n<area shape=“default”\
  \ href=“InvalidCountry.html” alt=“Please Again” />\n</map>\n```\n\n插件同样可以使用 `<embed>`\
  \ 和 `<object>` 元素嵌入到 HTML 文档中。虽然这两个元素执行相似的任务，但它们是由不同的浏览器创建的。因此，它们在 HTML5 中共存。虽然\
  \ `<embed>` 元素提供了便利性，但 `<object>` 元素为用户提供了更多功能。这两个元素的语法如下：\n\n### <embed> 标签\n\n\
  ```html\n<embed src=“Flash.swf\"></embed>\n```\n\n`src` 属性指定要嵌入的文件 URL 或地址。`<embed>`\
  \ 元素接受的其他属性包括：\n\n- `type`: 用于指定内容的 MIME 类型\n- `height`: 指定内容高度（像素）\n- `width`:\
  \ 指定内容宽度（像素）\n\n如之前所述，某些浏览器可能不支持 `<embed>` 元素。因此，如果在文档中使用它，必须添加备用内容规范。例如，如果你正在嵌入\
  \ flash 文件，如果浏览器不支持，你必须将用户重定向到 flash player 的下载链接。\n\n你可以按照以下方式操作：\n\n```html\n\
  <embed src=“Flash.swf” >\n  <a href=“link for downloading flash player”>\n    <img\
  \ src=”address of the image for download flash player” alt=“Download Adobe Flash\
  \ player” />\n  </a>\n</embed>\n```\n\n### <object> 标签\n\n`<object>` 标签允许嵌入各种媒体文件，如视频、音频、PDF、applet\
  \ 和 Flash。该元素接受以下属性：\n\n- `type`: 指定数据的 MIME 类型\n- `form`: 用于指定对象的表单 id 或多个 id\n\
  \n\n\n\n\n## 属性\n- `data` – 用于指定对象所使用的资源的 URL\n- `usemap` – 用于指定对象使用的客户端图像映射的名称\n\
  - `name` – 用于指定对象的名称\n- `height` – 用于指定对象以像素为单位的高度\n- `width` – 用于指定对象以像素为单位的宽度\n\
  \n在上述所有属性中，有必要提到 `data` 或 `type` 属性。\n\n数据可以使用 `<param>` 标签传递到 `<object>` 元素，标签是\
  \ `name` 和 `value` 属性的组合。可以使用此标签声明多个参数。\n\n```html\n<object data=\"file.wav\">\n\
  <param name=\"autoplay\" value=\"false\" />\n</object>\n```\n\n### 注意\n1. `<object>`\
  \ 元素必须始终在 `<body>` 元素内部。\n2. HTML5 仅支持上述列表属性以及 `<object>` 元素的全局属性。\n\n## 第 3 章：JAVASCRIPT\
  \ 基础\n\n交互是任何网站的重要方面。为了与观众建立更好的联系，为网站添加行为至关重要。这可以是简单的按钮，也可以是复杂的动画。这些任务可以使用 JavaScript\
  \ 完成，JavaScript 是一种 Web 和编程语言。本章将介绍 JavaScript，并将帮助你立即开始学习 JavaScript。\n\n### 背景\n\
  JavaScript 是客户端脚本的首选编程语言。与大众的认知相反的是，JavaScript 与 Java 没有任何关系。事实上，它与 ECMAScript 具有相似之处。此外，这种编程语言与\
  \ C 和 C++ 等其他编程语言的唯一共同点是它们使用大括号。JavaScript 的国际标准在 ISO/IEC 16262 和 ECMA-262 规范中给出。\n\
  \n这种编程语言最重要的特征之一是它是无类型的。换句话说，使用变量时不需要指定其类型。例如，如果你给一个变量赋值了一个字符串，稍后可以给同一个变量赋值一个整数。变量使用关键字\
  \ `var` 进行声明。\n\n## 数据与表达式\n任何程序都会访问、处理并向用户表示数据。数据以不同的类型和形式存在。这些数据可以很容易地分解为值。在 JavaScript\
  \ 中，数据可以表示为原始值、对象或函数。\n\n最低层级的数据表示称为原始数据类型，包括 `null`、`undefined`、`number`、`string`\
  \ 和 `Boolean`。\n\nJavaScript 中定义了几个内置对象。这些包括 `Object` 对象、全局对象、`Array` 对象、`Function`\
  \ 对象、`Boolean` 对象、`String` 对象、`Math` 对象、`Number` 对象、`RegExp` 对象、`Date` 对象、`Error`\
  \ 对象和 `JSON` 对象。\n\n任何可调用的对象都称为函数。如果函数与对象关联，则也可以称为方法。\n\n数据通过表达式产生，表达式是任何生成值的代码的名称。它可以直接被赋值，也可以通过替换和计算由操作数和运算符组成的表达式来计算值。需要注意的是，操作数也可以是另一个表达式。\n\
  \n### 数字数据类型\nnumber 数据类型是一种原始数据类型，它在内部被存储为浮点数，这是一种 64 位双精度数。这 64 位字段存储了符号、指数和尾数。最左侧的位留给符号，0\
  \ 到 51 位用于存储尾数，52-62 位用于指数。\n\n由于系统的内存限制，253 是可以存储的最大整数。\n\n需要注意的是，整数计算会产生精确的值。然而，小数数据的计算可能会给出不精确的结果。因此，这些值必须被截断。\n\
  \n除了数字和字符串外，JavaScript 还支持使用以下特殊字符：\n- `undefined` 指定该值尚未赋值。\n- `NaN` 代表“不是数字”。\n\
  - `-Infinity` 任何小于 -1.7976931348623157E + 10308 的数字都用 `Infinity` 表示。\n- `Infinity`:\
  \ 任何超过值 1.7976931348623157E + 10308 的数字都用 `Infinity` 表示。\n\n### 字符串数据类型\n字符串可以简单地描述为字符集合。当你在引号内声明字符时，系统都会解释为字符串。示例字符串包括：\n\
  - ‘Hello World!’\n- “Hello World!”\n\n然而，如果你想在字符串中包含引号，必须在字符之前添加 `\\'`。示例字符串：\n\
  - ‘You\\'re Welcome’\n- “You\\'re Welcome”\n\nJavaScript 支持其他转义序列，如用于制表的 `\\t` 和用于换行的\
  \ `\\n`。\n\n### 布尔数据类型\n`Boolean` 数据类型是一种二进制数据类型，返回 `true` 或 `false`。这些运算符通常用于指示比较结果。例如，`10\
  \ > 5` 将得到 ‘true’，而 `5 > 10` 将得到 ‘false’。\n\n### 数字数据类型上的操作\n为了执行计算，使用了运算符。JavaScript\
  \ 支持所有基础运算符，运算符的优先级如下：\n- 加法和减法的优先级相同。\n- 乘法和除法的优先级相同。\n- 乘法和除法的优先级高于加法和减法。\n- 如果一个表达式包含多个相同优先级的运算符，则从左到右计算。\n\
  \n除了基础运算符，JavaScript 还支持取模运算符 `%`。该运算符执行除法并返回余数。例如，`23%7` 等于 2。\n\n### 一元运算符\n虽然加法减法运算符需要操作数，但某些运算符只需要一个。此类运算符示例是\
  \ `typeof`，它返回数据的类型。例如，`typeof 12` 返回 ‘number’。请注意 `+` 和 `-` 也可以用一元运算符，当它们用于指定数字的符号时。\n\
  \n## 逻辑运算符\n提供了三种逻辑运算符，分别是非 (`!`)、或 (`||`) 和与 (`&&`)。涉及这些运算符的操作结果为布尔值（真或假）。结果按照以下方式计算：\n\
  - `&&` (与)：二进制运算符。两个条件都为真。\n- `||` (或)：二进制运算符。至少有一个条件为真。\n- `!` (非)：一元运算符。条件的数值被取反。\n\
  \n例如：\n- ‘Red’ != ‘Blue’ && 5 > 1 = ‘true’\n- ‘Red’ != ‘Blue’ && 5 < 1 = ‘false’\n\
  - ‘Red’ == ‘Blue’ && 5 < 1 = ‘false’\n\n对于条件运算符，JavaScript 使用短路求。换句话说，如果第一个条件的结果为\
  \ ‘false’，系统就不会评估另一个条件并直接给出结果。\n\n## 在 JavaScript 中编写代码\n任何以分号结尾的语句都是语句。与表达式不同，语句可能可能不产生值。\n\
  \n### 变量\n通过变量操作数据。数据存储在内存中，对该内存位置的命名引用称为变量。任何标识符通过在其前面加上关键字 `var` 来声明为变量。变量定义的示例如下：\n\
  \n```javascript\nvar result;\n```\n\n该语句声明了变量 `result`。你也可以在声明变量时定义它，如下语句所示：\n\n\
  ```javascript\nvar result = 0;\nvar result = 23*4+6;\n```\n\n\n\n\nJavaScript 关键字是保留的，不能使用。\n\
  \n请注意，JavaScript 与 HTML 不同，它是区分大小写的。因此 `VAL` 和 `val` 是两个不同的变量。此外，建议变量名能够描述其使用的用途。例如，如果我们将变量命名为\
  \ `result`，那么显而易见，该变量将包含代码计算出的结果值。\n\nJavaScript 中使用的另一个约定是变量命名时首字母使用小写。然而，变量名中的后续每个单词都以大字母开头。一个例子是变量名\
  \ `arrayResult`。此外，不建议使用下划线 `_` 和美元符号 `$`，但在 jQuery 对象中它们会被广泛使用。\n\n## 环境\n\n一组完整的变量及其包含的值构成了所谓的“环境”。因此，每当你在浏览器中加载新网页时，你都在创建一个新的环境。以\
  \ Windows 8 为例，它在应用程序启动时会创建一个环境，并在应用程序结束时销毁该环境。\n\n## 函数\n\n一组实现特定目的的语句被称为函数。使用函数的目的是代码复用。如果你的程序在多次使用某项功能，则将其实现为一个函数，并在需要时进行调用。由于函数是从代码内部调用的，因此可以从代码向函数发送参数。执行后，函数会将一个值返回给调用函数。函数声明和定义的语法如下：\n\
  \n```javascript\nfunction multiply(a, b){\n  return a*b;\n}\n```\n\n函数名之前必须始终带有\
  \ `function` 关键字。变量 `a` 和 `b` 是传递给函数的参数，函数返回通过计算 `a*b` 的值。这是一个简单的函数，但你可以根据所需的功能实现复杂且庞大的函数。\n\
  \n现在你已经实现了函数，可能在想知道如何调用函数的。这里有一个示例：\n\n```javascript\nvar x=2;\nvar y=5\nvar c=multiply(x,\
  \ y);\n```\n\n在这里，`x` 和 `y` 是函数 `multiply` 接收作为参数的实参。\n\nJavaScript 是一种弱类型语言。这意味着如果你传递给函数的参数多于它预期的，系统将仅使用所需的第一个\
  \ `n` 个参数并丢弃其余部分。这种功能的优势是，你可以使用已经实现的函数，并传递额外的参数来扩展该函数并为其添加功能。另一方面，如果你无意中传递了错误的参数数量，将无法获得任何错误提示。\n\
  \nJavaScript 还提供了一些与用户交互的内置函数。这些函数如下：\n\n### alert\n\n此函数会弹出一个带有消息的警报框，用户点击 OK 按钮后系统恢复操作。示例实现：\n\
  \n```javascript\nalert('Alert message!’);\n```\n\n### prompt\n\n此函数向用户显示一个文本框并要求其提供输入。你可以在显示的文本框中提供默认值，用户可以点击\
  \ OK 按钮来接受输入的值是正确的。示例实现：\n\n```javascript\nvar result = prompt('Enter a value’,\
  \ ‘default value’);\n```\n\n### confirm\n\n此消息让用户选择确认（OK）或取消（CANCEL）某个操作。示例实现：\n\
  \n```javascript\nvar result = confirm('Do you wish to proceed?’);\n```\n\n## 函数作用域\n\
  \n你定义的每个变量都拥有操作作用域，即该变量所在的函数。这被称为局部作用域。与其他许多语言通过变量所在的大括号来定义局部作用域不同，JavaScript 的局部作用域与函数作用域相同。\n\
  \n此外， JavaScript 还支持全局作用域的概念，在全局作用域中可以声明全局变量，从而可以在程序的任何地方使用。\n\n## 嵌套函数\n\n函数可以在任何层级进行嵌套。也就是说，一个函数可以在另一个函数内部被调用，而该函数又可能是从另一个函数被调用的。然而，重要的是，变量的作用域是在定义它的函数内部。\n\
  \n## 数据类型之间的转换\n\n上一个函数讨论的 `prompt` 函数返回一个字符串。然而，你要求用户输入一个数字。在这种情况下，可能需要字符串到数字的转换。在\
  \ JavaScript 中，可以使用以下函数将变量从一种类型转换为另一种：\n\n### Number Function\n\n此函数将传递的对象转换为数字数据类型。然而，如果函数无法执行转换，则返回\
  \ `NaN`。\n\n### String Function\n\n此函数将传递的对象转换为字符串数据类型。\n\n## 条件条件编程\n\n在编写代码时，你将遇到几种情况：如果条件为真，则执行一组指令；如果条件为假，则执行另一组指令。\n\
  \n### if-else\n\n为了实现此类场景，你可以使用 `if-else` 结构。\n\n语法：\n\n```javascript\nif(condition)\n\
  {\n  //code\n}\nelse\n{\n  //code\n}\n```\n\n考虑这样一个场景：你使用 `prompt` 函数要求用户输入其年龄。现在，在对提供的值进行任何计算之前，你必须验证该年龄是否为有效数字。这是实现条件编程的理想场景。该场景的示例实现如下：\n\
  \n```javascript\nvar userAge = prompt('Enter your age: ', ‘);\nif(isNaN(userAge))\n\
  {\n  alert('Age entered is invalid!’);\n}\nelse\n{\n  //code\n}\n```\n\n在此示例代码中，`if`\
  \ 子句检查输入的值是否为数字。如果条件为真（即输入值不是数字），则弹出警报。否则（如果条件为假），则执行 `else` 中的代码。\n\n在这里需要注意的是，对于单条语句，没有必要使用大括号。上述代码也可以写成：\n\
  \n```javascript\nvar userAge = prompt('Enter your age: ', ‘);\nif(isNaN(userAge))\n\
  \  alert('Age entered is invalid!');\nelse\n  //code\n```\n\n然而，为了方便以后添加代码，使用大括号是一个良好的习惯。\n\
  \n### if-else if\n\n另一种条件编程结构是 `else if` 结构。该结构允许你声明多个条件以及与之相关的操作。语法为：\n\n```javascript\n\
  if(condition)\n{\n  //code\n}\nelse if(condition)\n{\n  //code\n}\nelse\n{\n  //code\n\
  }\n```\n\n### Switch\n\n可以使用此结构实现多个 `else if`。这种条件编程结构的执行开销较高，因为需要按顺序检查条件的有效性。作为替代，可以使用另一个关键字\
  \ `switch`，它以跳转表的形式实现多个条件。因此，`switch` 的执行开销小于 `if-else if`。\n\n示例实现：\n\n```javascript\n\
  var userChoice = prompt('Choose an alphabet: a, b, c’, ‘e’);\nswitch (userChoice)\
  \ {\n  case ‘a’:\n    alert('a chosen\\n’);\n    break;\n  case ‘b’:\n    alert('b\
  \ chosen\\n’);\n    break;\n  case ‘c’:\n    alert('c chosen\\n’);\n    break;\n\
  \  default:\n    alert('None of the alphabets chosen\\n’);\n    break;\n};\n```\n\
  \n`switch` 结构将用户输入的值与 `case` 中的值进行匹配。如果找到了匹配的值，则执行该 `case`。然而，如果没有任何 `case` 值与输入的内容匹配，则执行\
  \ `default` 情况。此外，你也可以在 `case` 值中使用条件，并执行条件成立的那个 `case`。\n\n如果你在 `case` 代码后不使用 `break`\
  \ 语句，则匹配项之后的所有 `case` 都将被执行。例如，如果用户在上述示例中输入了 ‘b’，且 `case` 代码后没有 `break` 语句，那么输出将是：b\
  \ chosen\n\nc chosen\n\nNone of the alphabets chosen\n\n\n\n\n\n此外，在 `default` 分句中使用\
  \ `break` 语句也是一种良好的编程习惯。\n\n### 注意\n如果你想判断一个关键字是否已赋值任何值，可以使用以下代码：\n\n```\nif(c)\n\
  {\n    //code\n}\nelse\n{\n    //code\n}\n```\n\n如果变量 `c` 被赋值了一个非空值，则 `if` 条件为真，并执行相应的代码。相反，如果变量\
  \ `c` 的值为 `undefined` 或 `null`，则执行 `else` 结构中的代码。\n\n### 注意\n以下条件的值将始终为真：\n- `\"\
  \" == 0`\n- `null == undefined`\n- `'123' == 123`\n- `false == 0;`\n\n请注意，JavaScript\
  \ 在进行比较时会转换相关变量的类型以确保兼容性。然而，如果你想同时比较两个变量的值和类型，JavaScript 提供了另一组运算符，`===` 和 `!==`。当使用这组运算符对上述示例中提到的值进行比较时，结果将始终为假（false）。\n\
  \n### 实现代码循环\n循环是任何编程语言中重要且常用的结构。当你需要在给定的次数执行某组指令时，会遇到几种情况。为了实现这种场景，必须使用循环。JavaScript\
  \ 中提供的循环结构包括 `for`、`while` 和 `do-while`。\n\n`while` 循环包含一个条件，只要条件保持为真，循环就会执行。`do–while`\
  \ 循环是 `while` 循环的变体。如果 `while` 中的条件为假，则 `while` 循环将完全不执行。相反，即使 `while` 条件为假，`do-while`\
  \ 循环至少执行一次。\n\n#### while 循环的语法：\n```\nwhile(condition)\n{\n    //code\n}\n```\n\
  \n#### do-while 循环的语法：\n```\ndo\n{\n    //code\n}\nwhile(condition)\n```\n\nJavaScript\
  \ 中可用的最后一种循环是 `for` 循环。`for` 循环允许你在同一个语句中初始化循环变量、检查条件并修改循环变量。\n\n### 语法：\n```\n\
  for(initialize; condition; modify)\n{\n    //code\n}\n```\n\n#### 示例代码：\n```\nfor(i=0;\
  \ i<10; i=i+1)\n{\n    //code\n}\n```\n此循环将运行 10 次。\n\n### 注意\n1. 如果在任何时刻你想中断循环，可以使用\
  \ `break` 语句。\n2. 如果你没有指定条件，或者指定了一个始终为真的条件，循环将无限运行。\n\n## 异常处理\n异常可能会在你代码的几处发生。因此，最好实现一种可以帮助你处理这些异常并避免崩溃的机制。\n\
  \n异常可以描述为非法操作或任何意外之外且非正常的情况。异常的示例包括未经授权的内存访问。\n\n你可以通过在执行任何操作之前验证变量的值来进行异常处理。例如，在执行除法之前，建议检查分母的值是否为零。任何涉及除以零的操作都会引发除零异常。\n\
  \n然而，还有其他无法以此方式处理的情况。例如，如果网络连接突然中断，你无法采取先措施处理这种情况。因此，对于这类情况，使用了 `try`、`catch` 和\
  \ `finally` 关键字。\n\n预期抛出异常的代码放在 `try` 块中。该异常一旦发生，会被 `catch` 块捕获，该块将执行捕获异常后应当立即执行的代码。`catch`\
  \ 之后可能紧跟 `finally` 块，用于执行最后的清理。该块在 `try` 和 `catch` 块执行后运行。\n\n### 语法：\n```\ntry\n\
  {\n    //code\n}\ncatch(exception name)\n{\n    //code\n}\nfinally\n{\n    //code\n\
  }\n```\n\n#### 操作对象\nJavaScript 允许用户访问许多现有对象。其中一个对象就是数组。本节将讨论与本章相关的所有基础知识。在 JavaScript\
  \ 中处理对象还包括自定义对象的创建和处理。然而，这一主题将在 JavaScript 和 jQuery 章节介绍。\n\n## 数组\n一组连续排列的相似对象集合被称为数组。该数组有一个名称，每个元素可以使用索引器以以下形式访问：\n\
  \n假设 `arrName[]` 是一个存储名称的数组。元素 `arrName[2]` 指向数组的第三个元素。\n\n可以使用以下三种方法创建数组：\n\n**1.\
  \ 使用索引插入项**\n可以使用 `new` 关键字创建一个数组，然后通过给数组的独立元素赋值来将元素添加到数组。`new` 关键字使用相同的构造函数创建 `Array`\
  \ 对象的实例。\n\n示例实现：\n```\nvar arrName = new Array();\narrName[0] = 'Jack';\narrName[1]\
  \ = 'Alex';\n```\n\n**2. 紧凑数组**\n第二种实现也使用了 `new` 关键字。在这种情况下，值作为 `Array` 对象的构造函数的参数传递给元素。\n\
  \n示例实现：\n```\nvar arrName = new Array('Jack', 'Alex');\n```\n\n**3. 字面量数组**\n在这种类型的数组定义中，值位于方括号内。\n\
  \n示例实现：\n```\nvar arrName = ['Jack', 'Alex'];\n```\n\n使用第一种定义的优点允许你在代码的任何地方为元素赋值。相反，第二和第三种实现要求你事先准备好精确的元素列表。\n\
  \n所有对象都关联有一些属性。其中对你有帮助的属性是 `length`，它是一个只读值，调用时返回数组中存在的元素数量。你可以在循环和条件中使用该属性。\n\n\
  对象也可以有自己的函数。这些函数被称为方法。Array 可用的方法包括：\n\n- `concat`: 返回一个数组，它是提供的两个数组的合并结果。\n- `indexOf`:\
  \ 找到数组中相关元素的位置并返回索引。\n- `join`: 该方法连接数组中存在的所有值。然而，默认情况下所有这些值都用逗号分隔。你也可以指定自己的分隔符。\n\
  - `lastIndexOf`: 该方法的作用与 `indexOf` 类似，但它从数组的最后一个元素开始搜索。因此，它返回匹配标准的最后一个元素的索引。\n-\
  \ `pop`: 移除最后一个元素并返回其值。\n- `push`: 将相关元素添加到数组末尾并返回修改后的长度值。\n- `reverse`: 该方法反转数组元素的顺序。原始数组会被该方法修改。\n\
  - `shift`: 移除并返回第一个值。如果数组为空，则返回 `undefined`。\n- `slice`: 该方法需要两个参数，起始索引和结束索引。创建一个新数组，其元素与位于（起始索引）和（结束索引–1）处的元素相同。\n\
  - `sort`: 该方法对元素进行排序并修改原始数组。\n- `splice`: 该方法在指定的数组中删除和添加元素。该方法 get 的参数是起始索引（系统从哪里开始删除元素的索引）、要删除的元素个数以及要添加的元素。如果传递的元素个数的值为\
  \ 0，则不删除任何元素。相反，如果此值大于数组大小，则从起始索引到数组结束的所有元素都被删除。\n- `toString`: 该方法创建一个字符串，它是数组中存在的所有元素的逗号分隔的连接字符串。\n\
  - `unshift`: 该方法在数组的第一个位置添加元素并返回修改后的长度值。\n- `valueOf`: 返回数组的原始值。\n\n\n\n\n\n此方法返回一个字符串，该字符串是包含数组中所有值的逗号分隔的连接字符串。\n\
  \n### 注意事项：\n\n1. 在使用函数时，你可以传递整个数组（使用数组名称）或数组的特定元素（使用 `array name[indexer]`）。\n\
  2. 可以通过索引器访问元素来修改数组元素。例如，`arrName[1] = ‘Danny’`；将值 `‘Danny’` 赋值给数组的第二个元素。\n\n###\
  \ DOM 对象\n\n在构建应用程序时，你需要访问的主要对象是与其关联的 DOM 对象。这种访问对于你控制并获取网页上发生事件的通知是必要的。\n\nDOM\
  \ 是对象层级结构的表示。可以使用内置的 `document` 变量访问这些对象。该变量引用 DOM 并执行搜索，可能会返回一个活跃（live）或静态（static）\
  \ `NodeList`。由于活跃的 `NodeList` 包含一个不断变化的元素列表，而静态的 `NodeList` 包含不随时间变化的元素。由于获取静态的\
  \ `NodeList` 耗时较长，建议选择适用于活跃 `NodeList` 的搜索方法。\n\nDOM 可用的搜索方法包括：\n\n#### `getElementById`\n\
  此方法返回具有指定 ID 的第一个元素的引用。\n\n#### `getElementsByTagName`\n此方法返回具有指定标签名称的活跃 `NodeList`。\n\
  \n#### `getElementsByName`\n此方法返回具有指定名称的活跃 `NodeList`。这是单选按钮的首选方法。\n\n#### `getElementsByClass`\n\
  此方法返回具有指定类名称的活跃 `NodeList`。然而，此方法不支持 Internet Explorer 8 及更早版本。\n\n#### `querySelector`\n\
  此方法接受 CSS 选择器作为参数并返回第一个匹配元素。然而，此方法不支持 Internet Explorer 7 及更早版本。\n\n#### `querySelectorAll`\n\
  此方法接受 CSS 选择器作为参数并返回所有匹配元素。因此，它返回一个静态的 `NodeList`。然而，此方法不支持 Internet Explorer 7\
  \ 及更早版本。\n\n## 事件\n\n如果你将 JavaScript 视为引擎，那么事件就是赋予它所需的火花。\n\n事件可以在两种情况下发生。第一类事件是在用户交互期间发生的。用户可能会点击图像或输入文本。所有这些都被归类为事件。\n\
  \n此外，系统状态的变化也被视为事件。例如，如果视频开始或停止，就认为发生了一个事件。DOM 允许你捕获事件并执行相应的代码。\n\n在 JavaScript\
  \ 中，事件基于发布-订阅机制。在创建对象时，开发者可以发布与该对象相关的事件。此外，当使用该对象时，可以向该对象添加事件处理器。事件处理器函数会通知订阅的事件事件已经触发。此通知包含了有关事件的信息，如鼠标位置和按键按下，以及与事件相关的其他几个细节。\n\
  \n#### 捕获事件：\n可能会出现事件绑定到按钮点击上的情况，而该按钮可能位于超链接内部。在这种情况下，元素存在嵌套。因此，事件在触发时会沿着 DOM 层级结构向下传递。这个过程被称为事件捕获。然而，一旦事件到达元素，该事件就会向上层级冒泡。这个过程被称为事件冒泡。事件在层级结构中的移动为开发者提供了根据需要订阅或取消传播的机会。\n\
  \n#### 订阅事件：\n可以使用函数 `addEventListener` 进行订阅过程。该函数需要三个参数：事件、该事件发生被调用的函数，以及一个决定该函数是在捕获还是冒泡过程中被调用的布尔值（true\
  \ – 捕获，false – 冒泡）。大多数情况下，此值被设置为 false。这是 W3C 标准中提到的首选订阅方法。\n\n示例代码：\n```javascript\n\
  var btn = document.getElementById(‘btnDownload’);\n\nbtn.addEventListener(‘click’,\
  \ initiateDownload, false);\n```\n\n然而，其他其他方法，包括为 html 标签提供在线订阅。这会将事件订阅到冒泡过程中。使用这种方法的优点是它是最老且最被接受的方法。因此，你可以确定无论你使用什么种浏览器，这种方法都将有效。请查看下方的标签以了解如何操作。\n\
  \n```html\n<button id=‘btnDownload’ onclick=‘initiateDownload();’ >Download</button>\n\
  ```\n\n你也可以使用传统的订阅过程，即使用 JavaScript 订阅事件。\n\n```javascript\nvar btn = document.getElementById(‘btnDownload’);\n\
  \nbtn.onclick = initiateDownload;\n```\n\n### 取消订阅：\n可以使用函数 `removeEventListener`\
  \ 取消订阅，它接受与 `addEventListener` 相同的参数 set。对于上一个示例中使用的 `btn` ，可以通过以下方式实现：\n\n```javascript\n\
  var btn = document.getElementById(‘btnDownload’);\n\nbtn.removeEventListener(‘click’,\
  \ initiateDownload, false);\n```\n\n#### 如何取消传播？\n使用函数 `stopPropagation` 执行此项操作。可以通过以下方式实现：\n\
  \n```javascript\nvar btn = document.getElementById(‘btnDownload’);\n\nbtn.addEventListener(‘click’,\
  \ initiateDownload, false);\n\nfunction initiateDownload (e){\n//download\ne.stopPropagation();\n\
  }\n```\n\n#### 如何阻止默认操作？\n可以通过以下方式使用函数 `preventDefault` 实现：\n```javascript\nvar\
  \ hyperlink = document.getElementById(‘linkSave’);\n\nhyperlink.addEventListener(‘click’,\
  \ saveData, false);\n\nfunction saveData(e){\n//save data\ne.preventDefault();\n\
  }\n```\n\nJavaScript 还提供了 `this` 关键字，如果你希望频繁访问触发事件的元素，可以使用它。\n\n#### 窗口事件引用\n当前浏览器窗口由\
  \ `window` 变量表示，它是 Window 对象的实例。以下事件与此对象关联：afterprint, beforeonload, beforeprint,\
  \ error, blur, haschange, load, message, focus, online, offline, pageshow, pagehide,\
  \ redo, popstate, storage, resize, unload, undo。\n\n#### 表单事件引用\nHTML 表单内部发生的动作会触发以下事件：change,\
  \ blur, focus, contextmenu, forminput, formchange, invalid, input, submit, select。\n\
  \n#### 键盘事件引用\n键盘触发以下事件：keyup, keypress, keydown。\n\n#### 鼠标事件引用\n鼠标触发以下事件：click,\
  \ drag, drop, scroll, dblclick, dragenter, dragstart, dragend, dragover, dragagleave,\
  \ mousemove, mousedown, mouseover, mouseout, mousewheel, mouseup。\n\n#### 媒体事件引用\n\
  视频、图像和音频等媒体元素也会触发事件，如下：canplay, abort, waiting, durationchange, canplaythrough,\
  \ ended, emptied, loadeddata, error, loadstart, loadedmetadata, play, pause, progress,\
  \ playing, ReadyState, ratechange, seeking, seeked, suspend, stalled, volumechange,\
  \ timeupdate。\n\n## 第 4 章：CSS3 基础\n\n级联样式表或 CSS 提供了网页众闻的呈现效果。尽管 HTML 能够为网页提供基本结构，但\
  \ CSS 为开发者提供了大量的设计选择。此外，这项技术的最新版本是 CSS3，它是 50 个模块的集合。\n\n\n\n\n\nCSS 最强大的特性是它的层级联能力。简单来说，它允许网页从多个样式表中获取样式，使得后续读取的样式表中的更改将覆盖掉从一个或多个之前的样式表中已实现的样式。\n\
  \n## 如何定义和应用样式\n\n样式的定义和应用涉及两个方面或部分：选择器（selector）和声明（declaration）。选择器决定了网页中需要设置样式的区域，而声明块（declaration\
  \ block）描述了必须实现的样式规范。为了说明其工作原理，让我们考虑以下示例：\n\n```css\nbody {\ncolor: white;\n}\n\
  ```\n\n在这个示例中，选择器选择了网页的 `body`，声明块定义了字体颜色应更改为白色。这是一个简单的示例，声明和选择器可以比这要复杂得多。\n\n##\
  \ 如何添加注释\n\n可以使用以下格式在样式表中添加注释：\n\n```css\n/*在此处写下注释*/\n```\n\n## 如何创建内联样式\n\n每个元素都有一个关联的全局属性\
  \ `style`。可以在该元素的标签内对该全局属性进行操作，以修改该元素的外观。这种类型的样式不需要你指定选择选择器。只需要声明块即可。下面是这种操作的示例：\n\
  \n```html\n<body style='color: white;'>\n</body>\n```\n\n此 HTML 标签执行与上一节指定的 CSS\
  \ 代码相同的功能。使用这种方法的优点是，这种方式提供的样式信息会覆盖任何其他样式信息。因此，如果你需要为一个元素使用不同的样式，而文档的其他部分需要遵循不同的样式，你可以为文档使用样式表，并在标签中为该元素指定样式。\n\
  \n## 如何使用嵌入式样式\n\n实现内联样式相同结果的另一种方法是在相关元素内部使用 `<style>` 元素来定义其样式规范。以下是实现方法：\n\n```html\n\
  <!DOCTYPE html>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n<head>\n<title></title>\n\
  <style>\nbody {\ncolor: white;\n}\n</style>\n</head>\n<body>\n</body>\n</html>\n\
  ```\n\n## 如何创建外部样式表\n\n对于你希望对整个网页或多个网页使用相同样式的用例，最佳方法是使用外部样式表。\n\n可以通过以下方式将此外部样式表链接到\
  \ HTML 页面：\n\n```html\n<!DOCTYPE html>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n\
  <head>\n<title></title>\n<link rel='stylesheet' type='text/css' href='Content/mainstyle.css'\
  \ />\n</head>\n<body>\n</body>\n</html>\n```\n\n你必须在 `Content` 文件夹中创建一个名为 `mainstyle.css`\
  \ 的文件，并将指定的样式规则放入文件中。\n\n```css\nbody {\ncolor: white;\n}\n```\n\n## 定义媒体\n\n需要注意的是，样式表可以包含你想要的任意数量的样式规则。\n\
  \n此外，你还可以为不同的媒体链接不同的 CSS 文件。不同的媒体类型如下：\n\n- all\n- embossed\n- braille\n- print\n\
  - handheld\n- speech\n- screen\n- tv\n- tty\n\n使用的媒体可以通过以下方式定义：\n\n```html\n<link\
  \ rel='stylesheet' type='text/css' href='Content/all.css' media='all' />\n```\n\n\
  ## 定义字符编码\n\n你也可以使用以下格式定义所使用的字符编码。样式表：\n\n在样式表中的样式规则上方放置此行。\n\n```css\n@charset\
  \ 'UTF-8';\n```\n\nHTML 页面：\n\n你必须将此行放在 link 元素上方。\n\n```html\n<meta http-equiv='Content-Type'\
  \ content='text/html;charset=UTF-8' >\n```\n\n## 导入样式表\n\n随着你的网页变得复杂，使用的样式表也会变得复杂。\n\
  \n因此，你可能需要使用许多样式表。你可以使用以下方法将一个样式表中的样式规则导入到另一个：\n\n```css\n@import url('/Content/header.css');\n\
  ```\n\n在这里，导入了 `header.css`，`url` 给出了要导入样式表的相对地址。\n\n## 导入字体\n\n可以使用以下格式导入字体：\n\n\
  ```css\n@font-face {\nfont-family: newFont;\nsrc: url('New_Font.ttf'),\nurl('New_Font.eot');\
  \ /* IE9 */\n}\n```\n\n## 选择器、特殊性与层级\n\n选择器有三种类型：类选择器、ID 选择器和元素选择器。元素选择器类型最简单，要求你只需命名需要使用的元素。例如，如果你想更改\
  \ body 的背景颜色，那么使用的元素选择器就是 `body`。\n\n在声明任何元素时，你可以使用 `id` 属性为其分配一个 ID。你可以使用带有 `#`\
  \ 前缀的 ID 作为选择器。例如，如果你有一个 ID 为 `btnID` 的按钮，那么它的 ID 选择器就是 `#btnID`。同样，你可以使用 `class`\
  \ 属性为元素分配类名。类名可以使用以下方式以点 (`.`) 为前缀，即 `.className`。\n\n然而，如果你想选择网页中的所有元素，则对其使用星号\
  \ (`*`)。\n\n## 使用后代选择器和子选择器\n\n你可能希望为选择器的后代应用特定的样式。可以通过以下方式实现：\n\n```css\na {\n\
  color: black;\n}\n```\n\n另一方面，你可能只想在元素是选择器的直接子元素时对其设置样式。可以通过 `>` 分隔父元素和子元素来实现：\n\
  \n```css\na {\ncolor: white;\n}\n```\n\n## 伪元素与伪类选择器\n\n现在你已经知道如何对特定元素应用样式，让我们转向更具体的元素选择器。为了根据名称、内容或状态对元素分类，可以使用伪类。可用的伪类包括：\n\
  \n- :visited\n- :link\n- :hover\n- :active\n- :focus\n- :nth-last-child(n)\n- :not\n\
  - :only-child\n- :nth-child(n)\n- :lang(language)\n- :first-of-type\n- :only-of-type\n\
  \n如果你想访问其他无法访问的 DOM 树信息，可以使用伪元素。伪元素包括：\n\n- ::first-letter\n- ::first-line\n- ::after\n\
  - ::before\n\n## 选择器分组\n\n多个选择器可以用于同一个样式规则。这些选择器必须用逗号分隔。\n\n```css\nbody, button\
  \ {\ncolor: white;\n}\n```\n\n## 使用相邻选择器\n\n如果你想设置 div 或任何相邻元素中的第一个标题，选择器使用加号 (`+`)\
  \ 连接两个选择器。\n\n```css\ndiv + h1 {\ncolor: white;\n}\n```\n\n### 兄弟选择器\n\n兄弟选择器与相邻选择器相似，不同在于它会设置所有匹配元素，而相邻选择器只设置第一个匹配元素。选择器使用波浪号\
  \ (`~`) 连接两个选择器。\n\n```css\ndiv ~ h1 {\ncolor: white;\n}\n```\n\n## 使用属性选择器\n\n\
  此选择器选择所有具有指定属性的元素。选择器的写法如下：\n\n```css\na[title]\n```\n\n此选择器将选择所有指定了 `title` 属性的链接。\n\
  \n此外，可以通过以下方式指定属性值将此选择器修改为属性值选择器：\n\n```css\na[title = value]\n```\n\n## 浏览内置样式\n\
  \n每个浏览器都有一个内置样式表，应用于所有使用该浏览器打开的网页。事实上，此样式表位于任何其他样式表之前。你可以使用工具中的辅助访问选项为浏览器定义自己的样式表。然而，用户样式表是特定于浏览器的因此，如果你打开另一个浏览器，你定义的样式表可能无法访问。\n\
  \n\n\n\n\n在情况下，如果你希望用户定义的样式表能够覆盖 HTML 页面指定的任何其他样式，你可以使用 `!important` 修饰符。该修饰符为指定的样式语句设置最高优先级。示例实现：\n\
  \n```css\nbody {\n  color: white !important;\n}\n```\n\n### 样式级联\n\n样式的优先级和顺序基于以下参数决定的：\n\
  \n- 重要性 (Importance)\n- 特异性 (Specificity)\n- 文本顺序 (Textual Order)\n\n## 使用 CSS 属性\n\
  \n现在你已经熟悉了选择器的使用，下一步是查看 CSS 属性。\n\n### 颜色\n\n网页中最的属性之一是颜色，可以使用 `ARGB`、`RGB` 和颜色名称来定义。`RGB`\
  \ 值通常使用数字定义，介于 0-255 之间。\n\n- `white #ffffff`\n- `red #ff0000`\n- `black #000000`\n\
  - `green #008000`\n\n颜色值也可以代替颜色名称。下面给出了这种用法的的示例。\n\n```css\nbody {\n  color: #ffffff;\n\
  }\n```\n\n指定颜色的另一种方法是使用 `rgb()` 函数，它使用 0-255 之间的数字或百分比来指定参数值。这种类型的声明示例所示：\n\n```css\n\
  h1 { color: rgb(255,0,0); }\n```\n\n指定颜色的其他方式还有 `RGBA`它接受 4 个值）和 `HSL`它定义了色调、饱和度和亮度值）。\n\
  \n### 透明度\n\n透明度或不透明度由 0.0（不可见）到 1.0（不透明）之间的值定义。\n\n### 文本\n\n至于文本，可以指定 `font-face`\
  \ 和 `font-size`。这些属性可以用以下方式定义：\n\n```css\nh1 { font-family: arial, verdana, sans-serif;\
  \ }\nh1 { font-size: 12px; }\n```\n\n## CSS 盒模型\n\nCSS 盒模型假设网页可以被认为是盒子组成的。这些盒子之间的间距由\
  \ `margins`（外边距）和 `padding`（内边距）设置给出。这些属性可以用以下方式赋予值：\n\n```css\nmargin: 15px;\n\
  padding: 25px;\nborder: 10px;\n```\n\n### 定位 <div> 元素\n\n用于创建页面布局的元素是 `<div>`。虽然\
  \ HTML5 推荐使用语义化标记代替 `div` 元素，但它们仍然用于无法使用语义化标记进行样式化的的内容。 `div` 元素可以被想象为一个矩形块，并以以下方式声明：\n\
  \n```html\n<div>\n  <!--其他元素包含在此区域内-->\n</div>\n```\n\n用于定义 `div` 元素位置的属性包括：`div`\
  \ 元素的位置可以使用 `top`、`bottom`、`left` 和 `right` 属性以像素为定义。属性 `position` 用于定义指定的位置是静态的\
  \ (static) 还是相对的 (relative)。`float` 属性允许元素向右或向左浮动，定义为 `float: left` 或 `float: right`。`clear`\
  \ 属性在浮动元素之后放置一个清除元素。\n\n你还可以通过 `box-sizing` 属性来更改浏览器计算宽度的方式。该属性可以取三个值：`content-box`（默认设置）、`border-box`\
  \ 和 `padding-box`。\n\n### 居中内容\n\n如果你使用固定宽度，可以使用 `margin-left` 和 `margin-right`\
  \ 属性使 `div` 元素居中。如果你固定宽度并将边距设置为 `auto`，则边距上的额外空间将平均分配。可以通过以下方式实现：\n\n```css\n#container\
  \ {\n  width: 850px;\n  margin-left: auto;\n  margin-right: auto;\n}\n```\n\n##\
  \ 第 5 章：HTML5 详解\n\n本章专注于 HTML5 的基础知识以及如何使用它们来创建高性能的新一代页面。然而，该章解释的大多数元素包含了 HTML5\
  \ 从其前身继承的元素。本章将你在学习 HTML5 的道路上更进一步，引入了这项技术新新增的概念。\n\n在上一章关于 CSS 的章节中，我们向你介绍了 `<div>`\
  \ 元素的概念。在创建页面布局方面，该元素优于所有备选方案。虽然有些人也使用 `<table>` 元素，但它通常不是推荐的解决方案，因为它难以维护和使用。然而，这两个概念将在本章中进行详细阐述。\n\
  \n## 语义化标记\n\n`<div>` 和 `<span>` 元素是定位和格式化内容常用且推荐的元素。然而，建议你应该使用不同的 `<div>` 元素来指定页面的不同部分，如\
  \ `header` 和 `footer`。这将允许你以更有组织的方式单独对它们进行定位。因此，W3C 为这些新元素命名为 `<footer>` 和 `<header>`\
  \ 等名称。\n\n## 浏览器支持\n\n诚然，你的 HTML 代码不会被你的任何用户读取。然而，还有其他工具和机器在不断解析你的代码。这些工具包括用于索引网页以供搜索的网络爬虫，以及\
  \ `NVDA`（非视觉桌面访问）设备，许多有特殊需求的用户将其作为阅读和理解网页的替代方案。因此，它们要求你使用可理解的标签。\n\n## 如何创建 HTML5\
  \ 文档\n\n尽管上述讨论明确提到了使用语义标记的重要性并禁止使用像 `<div>` 和 `<span>` 这样的标签，你仍然需要为它们提供样式。随着阅读的，你会发现必须为标签提供含义。例如，你可能希望浏览器在打开时关注某个\
  \ `div` 元素。\n\n## 如何创建 HTML5 布局容器\n\n布局容器正如其名，是一个包含页面布局的容器。换句话说，该容器以这种方式包含了布局的不同部分。作为开发者，你可以根据类和\
  \ ID 轻松区分 `<div>` 元素。然而，对于浏览器并非如此。因此，必须有一种方式让浏览器解释元素。所有这些以及更多可以通过有助于浏览器和用户理解的方式表达元素的布局容器来实现。\n\
  \n创建布局容器的一些常用元素包括：\n\n- `<header>`：用于定义文档的头部部分或顶部。该元素也可以定义在 `<article>` 元素内部。\n\
  - `<footer>`：用于定义文档的页脚部分或底部。该元素也可以定义在 `<article>` 元素内部。\n- `<nav>`：用于定义包含所有链接的部分。\n\
  - `<aside>`：该元素通常用于侧边栏，并将 `<aside>` 元素中的内容与其外部的内容隔离开。\n- `<section>`：该元素定义了区域的一部分，并用\
  \ `<h1>`、`<h2>`、`<h3>`、`<h4>`、`<h5>` 和 `<h6>` 元素命名。\n- `<article>`：该元素定义了一个完整的内容单元，你可以从一个位置复制到另一个位置。这种单元的示例是博客文章。\n\
  \n### 使用角色 (Roles)\n\n`role` 属性可以声明在 `<div>` 和 `<aside>` 元素内部。角色类的层次结构以及为了提供特定含义而使用角色的方法（就访问性而言）是在\
  \ `WAI-ARIA`（Web 可访问倡议 - 丰富交互应用程序）中定义的。父角色类之一是地标角色类，它定义了网页上的导航地标。父角色类的子类包括：`banner`。\n\
  \n\n\n\n这定义了网站特定的内容，这些内容预计不会像页眉一样在网页之间发生变化。\n\n### application\n这定义了指定区域是一个 Web\
  \ 应用程序。\n\n### contentinfo\n这定义了网页中包含的关于网页的信息，例如版权信息。这些信息主要是页脚内容的一部分。\n\n### complementary\n\
  这定义了页面的一个部分，该部分在脱离页面时同样具有意义。\n\n### main\n主内容使用此子角色类（role class）来定义。\n\n### form\n\
  这定义了网页中预期接收网页输入的区域。\n\n### search\n该子角色类用于定义网页上用于从用户获取搜索查询并显示搜索结果的位置。\n\n### navigation\n\
  包含导航链接的区域是该子角色类的一部分。\n\n这些角色可以用于提供语义化。然而，HTML5 包含的新元素本身就具有语义。尽管如此，某些工具在 HTML5 中可用，对于这些工具，可以使用\
  \ `role` 属性。\n\n### 如何使用 `<div>` 元素控制格式？\n如前所述，`<div>` 元素本质上是不可见的，不会为元素提供任何语义。但是，如果你只想将其用于格式化目的，那么它非常适合这一用途。\n\
  \n### 如何添加主题性断开（Thematic Breaks）？\n空元素 `<hr/>` 可用于添加主题性断开，用于表示从一组内容到另一组内容的过渡。\n\n\
  ### 如何对内容注释？\n有几个元素可用于注释。这些包括你已经使用了很久的 `<b>` 和 `<i>`。然而，除了它们表示的样式之外，它们现在有了新的含义。例如，`<b>`\
  \ 元素表示“**粗**”样式。此外，HTML5 增加了“具有特殊关注的文本跨范围，但语气、重要性水平或隐含意义没有变化”的含义。\n\n尽管如此，虽然在这种语境下使用粗体样式更有意义，但你仍然可以使用此元素来表示评论中的产品名称或关键词。同样，`<strong>\
  \ 元素指示内容的相对重要性，而 `<i>` 表示相关内容语气或含义的变化。此外，`<em>` 元素用于读者可能会交替读音的文本。\n\n### 如何使用 `<abbr>`\
  \ 处理缩写和首字母？\n在 HTML 之前的版本中，`<acronym>` 元素用于此目的。然而，该元素已过时，用于此目的的新元素是 `<abbr>`。它是一个内联元素，通常与\
  \ `<em>` 和 `<strong>` 等其他内联元素一起使用。\n\n### 元素 - `<address>`\n此元素用于定义网页所有者或作者的联系信息。\n\
  \n### 引用和来源\n你可以使用 `<blockquote>` 元素指示特定文本为引用，它用于长段引用；使用 `<q>` 元素，它用于行内引用。你可以使用\
  \ `cite` 属性或 `<cite>` 元素提到引用的来源。\n\n然而，在 `<q>` 和 `<blockquote>` 元素内部使用 `<cite>`\
  \ 元素被认为是更好的方法。请记住，`<cite>` 元素只能提到作品的名称，像作者姓名和出版地等其他信息元素不包含在内。\n\n### 如何在 HTML5 中编写代码文档？\n\
  有两个元素 `<code>` 和 `<samp>` 用于记录代码。`<code>` 元素用于记录源代码，而 `<sample>` 元素用于代码的输出。下面给出了如何执行此操作的示例\
  \ HTML：\n\n```html\n<code class=\"maintainWhiteSpace\">\nechoContent('Screen');\n\
  \nfunction echoContent(name)\n{\n  alert('This is' + name + '.');\n}\n</code>\n\n\
  <samp class=\"maintainWhiteSpace\">\nThis is Screen.\n</samp>\n```\n\n### `<pre>`\
  \ 元素\n在这里需要提到，这些元素并不保留空白。因此，需要为此实现一个类。该类应该像：`style rule`。\n\n```css\n.maintainWhiteSpace\
  \ {\n  white-space: pre;\n}\n```\n\n某些浏览器可能不支持此样式规则。因此，对于此类浏览器，建议使用 `<pre>` 元素。因此，`<pre>`\
  \ 元素可以用于定义预格式规则。\n\n### `<var>` 元素\n此元素用于声明内部指定的文本是一个变量。例如：\n\n```html\n<p>\n  变量\
  \ <var>i</var> 代表循环执行的次数。\n</p>\n```\n\n### `<br/>` 和 `<wbr>` 元素\n`<br/>` 元素实现换行。另一方面，`<wbr/>`\
  \ 实现单词换行。\n\n### `<dfn>` 元素\n有时你可能想要定义一个术语。这可以使用 `<dfn>` 元素完成，它将标题作为属性之一。\n\n###\
  \ 处理插图（Figures）\n图像和插图是任何网页内容的不可或缺的一部分。因此，每个插图也可以被视为一个内容单元，它可能由标题和指向所属页面的引用组成。为了定义一个或多个图像，使用了\
  \ `<figure>` 元素。`<figcaption>` 元素可以用于定义插图的标题。\n\n然而，在这里需要提到，`<figure>` 元素并没有赋予插图位置任何重要性，且位置与内容一起。\n\
  \n如果插图的位置对你很重要，那么你必须考虑使用 `<div>` 元素。\n\n### `<summary>` 和 `<details>` 元素\n`<summary>`\
  \ 包含摘要，可以通过 `<details>` 元素以折叠列表的形式显示。因此，当你加载页面时，只有 `<summary>` 会显示，而 `<details>`\
  \ 的内容在点击时显示。\n\n### 其他注释\n除了上述提到的，还有一些注释可用：\n- `<s>` - 用于删除文本\n- `<u>` - 用于下划文本\n\
  - `<mark>` - 用于高亮文本\n- `<ins>` - 用于指示已插入文本\n- `<del>` - 用于指示已删除文本\n- `<small>` -\
  \ 用于指示以较小字体打印\n- `<sub>` - 表示文本是下标\n- `<sup>` - 文本是上标\n- `<time>` - 用于指示文本表示时间和和日期\n\
  - `<kbd>` - 用于指示文本是用户输入\n\n### 语言元素\n你可能需要在文本中使用中文、日语或韩语来源的字符。为了支持这种包含，可以使用 `<ruby>`\
  \ 元素。在此元素内部，其他元素如 `<bdi>` 和 `<bdo>` 用于定义文本的隔离和方向。此外，`<rt>` 和 `<rp>` 元素也可用于在 `<ruby>`\
  \ 元素的文本放置注释或括号。\n\n### 处理列表\n在 HTML5 中，存在定义无序列表、有序列表和描述列表的元素。还有第四类“自定义列表”允许开发者进行自定义。\n\
  \n所有这些列表项都使用 `<li>` 元素声明。此外，这三种列表都支持列表嵌套。\n\n### 有序列表\n有序列表使用 `<ol>` 元素声明，列表的“顺序”通过对包含的元素自动编号来实现。\n\
  \n用于有序列表的属性包括：\n- `start`: 用于设置列表的起始数字\n- `reversed`: 用于声明列表是否按升序或降序排列\n- `type`:\
  \ 用于声明列表的类型，可以是 A, a, 1 或 I。\n\n### 无序列表\n这种类型的列表使用 `<ul>` 元素声明，并且没有编号\n\n\n\n\n\
  此例中的元素。列表的元素被简单地表示为项目符号。\n\n### 描述列表\n这种类型的列表使用 `<dl>` 元素声明。使用此元素，你可以提供一个包含零或多个术语的描述。此外，列表的元素使用\
  \ `<dt>` 元素声明，用于指定术语，以及 `<dd>`，用于提供该术语的描述。\n\n### 自定义列表\n开发者可以使用 CSS 样式来创建自定义列表。在这种情况下，可以为嵌套列表的每一层创建不同的样式规则。\n\
  \n### 使用表格\n在网页中安排和展示数据的另一种格式是表格。表格使用 `<table>` 元素声明，并以行列的形式表示数据。表格的单元格使用 `<tr>`\
  \ 和 `<td>` 元素定义。其中 `<tr>` 用于行，而 `<td>` 用于列。\n\n尽管 HTML5 表格是开发者可以使用的最强大的结构之一，但理解如何以及在何处最恰当地使用表格至关重要。以下是不应使用表格的原因：：为网页创建的表格在读取到\
  \ `</table>` 标签之前不会进行渲染。相反，如果使用 `<div>` 元素创建相同的结构，内容将在读取时立即进行渲染。\n\n表格极难维护。\n\n\
  表格对于无障碍辅助设备来说难以解释。\n\n### 示例实现：\n```html\n<table>\n<tr>\n<td>Frank</td>\n<td>1978</td>\n\
  </tr>\n<tr>\n<td>David</td>\n<td>1967</td>\n</tr>\n<tr>\n<td>Alex</td>\n<td>1989</td>\n\
  </tr>\n</table>\n```\n\n上面创建的表格看起来像：\nFrank\n1978\nDavid 1967\nAlex\n1989\n\n当你观察表格时，你一定已经意识到，除非我们定义所谓的表头（table\
  \ headers），否则表格是不完整的。这可以使用 `<th>` 元素完成。你可以同时在垂直和水平方向创建表头。例如，我们可以在上面使用的代码中定义以下表头。\n\
  \n```html\n<table>\n<tr>\n<th>Name</th>\n<th>Year of Birth</th>\n</tr>\n<tr>\n<td>Franky</td>\n\
  <td>1978</td>\n</tr>\n<tr>\n<td>David</td>\n<td>1967</td>\n</tr>\n<tr>\n<td>Alex</td>\n\
  <td>1989</td>\n</tr>\n</table>\n```\n\n该代码生成的表格将如下所示：\nName\nYear of Birth\nFranky\
  \ 1978\nDavid\n1967\nAlex\n1989\n\n在上面的情况下，表头仅仅是字体大了一些。然而，你可以通过样式规则按你的意对它们进行样式。可以通过以下方式实现：\n\
  ```css\nth {\n  background-color: black;\n  color: white\n}\n```\n此样式规则将表头单元格涂成黑色，文本将写为白色。\n\
  \n大多数浏览器的默认行为是将所有 `<tr>` 元素自动放在 `<tbody>` 中，表示这是表格的主体。然而，显式定义 `<tbody>` 是一个良好的习惯。此外，还可以显式定义\
  \ `<thead>` 和 `<tfoot>`。可以使用 CSS 分别对表格的表头、主体和页脚设置样式。按照规定，你可以有一个表头元素、一个或多个主体元素和一个页脚元素。\n\
  \n上述创建的表格必须添加的下一个重要内容功能是表格标题（table caption）。为了定义表格标题，使用了 `<caption>` 元素。\n\n在某些情况下，你可能觉得需要对单列进行样式处理。考虑到\
  \ HTML 中的表格本质上是以行为了中心的，这似乎是一项艰巨的任务。虽然你有 `<tr>` 元素来识别行，但没有识别列的 `<tc>` 元素。然而，你仍然可以使用\
  \ `<colgroup>` 或 `<col>` 元素对单列设置样式。`<table>` 元素可以包含 `<colgroup>` 元素，它包含了 `<col>`\
  \ 元素，用于作为该元素组一部分的列。此外，`<col>` 元素还有一个 `span` 属性，用于定义属于该组的列。下面提供了一个解释其工作原理的示例实现：\n\
  \n```html\n<colgroup>\n  <col span=\"2\" class=\"vHeader\" />\n</colgroup>\n```\n\
  \n用于为此组列设置样式的 CSS 样式规则如下：\n```css\n.vHeader {\n  color: red;\n}\n```\n\n虽然为止讨论的表格都是普通表格，但\
  \ HTML5 也支持不表格（irregular tables），这可以描述为每行的列数不同的表格。可以使用 `rowspan` 和 `colspan` 属性来管理表格的布局。\n\
  \n## 第 6 章节：JAVASCRIPT 和 JQUERY\n你可能已经体会到了 JavaScript 的强大。在关于 JavaScript 的章节中，你已经学习了如何创建和添加\
  \ JavaScript 来使网页动态化。Web 开发最大的挑战是设计可以在任何浏览器上运行良好的的网页元素，因为不同的浏览器对不同的元素提供支持，这使得寻找共同点变得困难。\n\
  \n本章通过教你如何创建对象并使用它们，在 JavaScript 开发上更了一步。此外，它还向你介绍了 jQuery 的概念，它尝试创建浏览器兼容性。\n\n\
  ### 如何创建 JavaScript 对象\nJavaScript 中从数字到字符串的任何内容都是对象。因此，知道如何创建对象是非常重要的。创建对象简单的方法是使用对象字面量语法。\n\
  \n```javascript\nvar customer1 = {\n  yearOfBirth: 2000,\n  name: 'Alex',\n  getCustomerInfo:\
  \ function () {\n    return 'Customer: ' + this.name + ' ' + this.yearOfBirth;\n\
  \  }\n};\n```\n这段代码创建一个对象 `customer1`，具有数据成员 `name` 和 `yearOfBirth` 以及成员函数 `getCustomerInfo`。注意\
  \ `this` 关键字的使用也很重要，它可以正确地访问用于对象的值。\n\n此外，你还可以使用 `new` 关键字动态地创建对象。\n```javascript\n\
  function getCustomer(myName, myYearOfBirth) {\n  var newCust = new Object();\n \
  \ newCust.name = myName;\n  newCust.yearOfBirth = myYearOfBirth;\n  newCust.getCustomerInfo\
  \ = function () {\n    return 'Customer: ' + this.name + ' ' + this.yearOfBirth;\n\
  \  };\n  return newCust;\n}\n```\n这段代码动态地创建一个对象 `newCust`。可以按以下方式创建多个实例：\n```javascript\n\
  var cust1 = getCustomer('Alex', 1978);\nvar cust2 = getCustomer('David', 1986);\n\
  ```\n尽管 JavaScript 不支持特定的 `class` 关键字，但你可以使用上述方法来模拟类。\n\n### 命名空间\n没有特定的如 `namespace`\
  \ 的关键字用于实现命名空间。然而，可以使用类和对象的概念来实现命名空间。如果你将变量和方法分类到对象中并作为这些对象的实例来访问它们，那么你只是将这些对象的名称放在全局命名空间中，将变量的作用范围缩小到它们所属的对象。\n\
  \n### 实现继承\n你可以通过创建对象并根据共同特征对这些对象进行分类，在 JavaScript 中定义对象之间的“是一个”（is-a）关系。例如，如果你正在为公司的员工实现一个对象。你可以为特定类型的对象如\
  \ `managerTechnical`、`managerGeneral`、`technicalStaff`、`recruitmentStaff` 和 `officeStaff`\
  \ 创建对象，然后将它们分类为对象：`technicalStaff`（包括 `managerTechnical` 和 `technicalStaff`）以及 `adminStaff`（包括\
  \ `managerGeneral`、`recruitmentStaff` 和 `officeStaff`）。\n\n### 使用 jQuery\n\n\n\n\
  \n\nJQuery 是一个浏览器兼容的辅助函数库，你可以在代码中使用它来尽量减少输入、实现和测试所需的工作。这些函数本质上是用 JavaScript 编写的。因此，你也可以调用\
  \ `jquery`，这是一个 JavaScript 库。\n\njQuery 提供的功能列表包括：\n\n- **属性（Attributes）**：一组用于获取和设置\
  \ DOM 元素属性的方法。\n- **Ajax**：一组提供同步和异步服务器调用支持的方法。\n- **核心方法（Core Methods）**：基础 jQuery\
  \ 函数。\n- **回调对象（Callbacks object）**：提供的一个用于管理回调的对象。\n- **数据方法（Data Methods）**：促进\
  \ DOM 元素与任意数据之间建立关联的方法。\n- **CSS 方法（CSS Methods）**：用于获取和设置 CSS 相关属性的方法。\n- **尺寸（Dimensions）**：用于访问和操作\
  \ DOM 元素尺寸的方法。\n- **延迟对象（Deferred object）**：一种可以在注册多个回调的同时维护状态更改数据，并将状态从一个回调传递到下一个回调的对象。\n\
  - **表单（Forms）**：用于控制表单相关控件的方法。\n- **遍历（Traversing）**：一组提供 DOM 遍历支持的方法。\n- **效果（Effects）**：用于为网页创建动画的方法。\n\
  - **事件（Events）**：用于执行基于事件的操作的方法。\n- **选择器（Selectors）**：用于在 CSS 选择器中访问 DOM 元素的方法。\n\
  - **偏移量（Offset）**：用于为 DOM 元素定位的方法。\n- **工具方法（Utilities）**：一组工具方法。\n\n在使用 jQuery\
  \ 之前，你需要将它引入到你的项目中。一旦你安装了它并准备好将其用于你的项目，下一步就是学习如何使用它。\n\n首先，你需要按照以下方式在需要使用 jQuery\
  \ 的网页上引用 jQuery 库：\n\n```html\n<script type=\"text/javascript\" src=\"Scripts/qunit.js\"\
  ></script>\n<script src=\"Scripts/jquery-1.8.2.js\"></script>\n```\n\n接下来需要知道的是，你希望在\
  \ HTML 页面使用的 jQuery 代码位于 jQuery 命名空间中，该命名空间有一个别名 `$`。因此，在引用 jQuery 的功能时，你可以编写 `jQuery.jFeature`\
  \ 或 `$.jFeature`。\n\n在开始在网页中使用它之前，你还需要按照如下方式更改 `default.js` 文件：\n\n```javascript\n\
  function initialize() {\n    txtInput = $('#txtInput');\n    txtResult = $('#txtResult');\n\
  \    clear();\n}\n```\n\n这允许你通过使用 ID 匹配来使用 jQuery 和 CSS 选择器。\n\n此外，当你继续使用 jQuery\
  \ 进行编码时，记住在进行任何更改后使用 `Ctrl+F5` 刷新屏幕，因为浏览器可能无法立即捕获 JavaScript 的修改。此外，尽可能使用 jQuery\
  \ 对象，因为它们提供了跨浏览器兼容性。\n\n可以以以下方式从 jQuery 包装器引用 DOM 对象：`var domElement = $('#txtInput')[0];`。\n\
  \n这是一个在引用元素之前检查元素是否存在的简单代码：\n\n```javascript\nvar domElement;\nif($('#txtInput').length\
  \ > 0){\n    domElement = $('#txtInput')[0];\n}\n```\n\n### 如何为引用 DOM 元素创建 jQuery\
  \ 包装\n可以以以下方式从 DOM 元素引用创建 jQuery 包装：`var myDoc = $(document);`、`var inText = $(this).text();`。\n\
  \n第一条语句将包装的对象赋值给变量。另一方面，第二条语句包装了使用 `this` 用的对象。\n\n### 如何添加事件监听器\njQuery 提供了 `.on`\
  \ 方法来订阅事件。此外，你可以使用 `.off` 方法取消订阅。这些方法可以如下所示使用：\n\n```javascript\n$('#btnSubmitInfo').on('click',\
  \ onSubmit);\n$('#btnSubmitInfo').off('click', onSubmit);\n```\n\n### 如何触发事件处理器\n\
  JQuery 提供了触发器或 `triggerHandler` 方法，用于触发事件处理器或处理器代码的执行。可以通过以下方式实现：\n\n```javascript\n\
  $('#btnSubmitInfo').triggerHandler('click');\n```\n\n### 初始化代码\n你经常会遇到在 HTML 文档加载时运行初始化代码的需求。你可以通过以下方式使用\
  \ jQuery 实现：\n\n```html\n<script>\n$(document).ready(function () {\n    initializationFunction();\n\
  });\n</script>\n```\n\n这可以放在 HTML 文档的底部。它将调用 `initializationFunction`。\n\n## 第 7\
  \ 章：表单\n\n在之前的章节中，你已经学习了如何创建和操作 HTML 文档。借鉴这些内容，我们现在可以开始理解表单，表单是网页开发中最关键且最常用的内容单元之一。\n\
  \n简单来说，表单是收集数据并将其发送到处理位置的方法（在大多数情况下是服务器）。然而，由于我们还没有讨论服务器端脚本，我们将重点关注将数据发送到电子邮件地址。但是，需要注意的是，我们不建议这种做法，它仅用于理解目的。\n\
  \n### 网络通信\n在转向表单的工作之前，了解一些 HTTP 的基础知识非常重要。典型的网络通信由以下活动组成：\n1. 当用户浏览网页时，通过发送 `GET`\
  \ HTTP 请求来启动对 Web 服务器资源的访问。\n2. 服务器处理该请求并使用 HTTP 协议向浏览器发送响应。\n3. 浏览器处理服务器响应并以“表单”的形式呈现给用户。\n\
  4. 用户向表单输入内容，并在点击提交或回车键后，这些数据发送到服务器。\n5. 这些数据再次由服务器处理，服务器将其响应发布到浏览器并显示在网页上。\n\n\
  ### Web 服务器\n最初，Web 服务器设计用于接收和处理请求，并使用 HTTP 将结果传回浏览器。最初网页非常简单，这样的 Web 服务器能够在单位时间内处理大量请求。当时不涉及状态，因为发送和接收请求只是打开连接、传输数据并关闭连接。\n\
  \n新时代的 Web 服务器比这些简单的服务器配备得多。如今的 Web 服务器实现了所谓的“保持连接”（keep alive）功能，确保连接在规定时间内保持开启，以便同一浏览器的后续请求。\n\
  \n### 浏览器\nWeb 浏览器是一个桌面应用程序，用于显示网页并管理网页与服务器之间的交互。服务器与页面之间的通信通过 AJAX 和异步 JavaScript\
  \ 等技术建立。\n\n### 数据如何提交到 Web 服务器\n可以使用 `<form>` 元素按照如下方式创建 HTML 表单：\n\n```html\n\
  <form method=\"post\" action=\"getCustomerInformation.aspx\">\n输入客户号：\n<input type=\"\
  text\" name=\"Number\" />\n<input type=\"submit\" value=\"获取客户信息\" />\n</form>\n\
  ```\n\n此表单接收客户号并返回一个显示客户详情的页面。\n\n然而，需要注意的是，并不是所有元素都可以用于表单提交数据。为此目的的元素有：\n- `<textarea>`：用于多行输入。\n\
  - `<button>`：这是一个按钮，可以放置在任何内容或图像上。\n- `<select>`：这是一个下拉列表，允许多次选择。可以使用 jQuery 识别选中的选项：`$('option:selected')`。\n\
  - `<input type='checkbox'>`：这是一个复选框，具有一个用于设置以及读取复选框状态的属性。识别已选中复选框的 jQuery 为：`$('input[type=checkbox]:checked')`。\n\
  \n\n\n\n\n-   `<input type=’button’>` - 这是一个可点击按钮，带有文本提示。\n-   `<input type=’datetime’>`\
  \ - 这是一个控件，显示日期和时间（UTC）。\n-   `<input type=’date’>` - 这是一个控件，仅显示日期。\n-   `<input\
  \ type=’email’>` - 这是一个文件选择字段，带有一个浏览按钮用于上传文件。\n-   `<input type=’color’>` - 这是一个颜色选择器。\n\
  -   `<input type=’hidden’>` - 这是一个隐藏输入字段。\n-   `<input type=’datetime-local’>` -\
  \ 这是一个控件，显示日期和时间（任何时区）。\n-   `<input type=’month’>` - 这是一个月份-年份控件。\n-   `<input\
  \ type=’image’>` - 这是一个图像提交按钮。\n-   `<input type=’password’>` - 这是一个密码字段，字符会被掩码。\n\
  -   `<input type=’number’>` - 这是一个数值字段。\n-   `<input type=’range’>` - 这是一个控件，接受数值并定义允许的数值范围。\n\
  -   `<input type=’radio’>` - 这是一个选项按钮，带有 `value` 属性用于设置和读取按钮状态。用于识别已选单选按钮的 jQuery\
  \ 是 `$(‘input[type=radio]:checked’`。\n-   `<input type=’search’>` - 这是一个文本字段，用于输入搜索字符串。\n\
  -   `<input type=’reset’>` - 这是一个用于重置表单字段的按钮。\n-   `<input type=’url’>` - 这是一个 URL\
  \ 字段。\n-   `<input type=’tel’>` - 这是一个电话字段。\n-   `<input type=’submit’>` - 这是一个提交按钮。\n\
  -   `<input type=’time’>` - 这是一个控件，接受时间值。\n-   `<input type=’text’>` - 这是一个单行文本字段。\n\
  -   `<input type=’week’>` - 这是一个周-年份控件。\n\n## `<label>` 元素\n\n它是向用户传达元素含义的元素。此元素中的文本显示在文本框内，当用户点击它时，会自动移除。你还可以指定标签的样式。\n\
  \n## 指定父表单\n\n某些情况下，表单的提交元素可能不在同一个结构中。因此，在这种情况下，收集数据可能是一个巨大的挑战。为了解决这个问题，HTML5 提供了一个\
  \ `id` 属性，可以为多个表单元素设置它。这将允许一次性从不同的表单元素中收集数据。\n\n## 如何触发表单提交\n\n触发时，从表单或相同 id 的表单的提交元素收集的所有数据都将使用\
  \ HTTP 方法发送到服务器。`<input>` 元素可用于触发表单提交。此外，你也可以用 JavaScript 实现此目的。为了实现这一点，你必须给相关的表单一个\
  \ `id`，`myFirstForm`。链接到 HTML 文档的 `default.js` 文件必须包含以下代码：\n\n```\n$(document).ready(function\
  \ () {\n  $(‘#myFirstButton’).on(‘click’, submitMyFirstForm);\n});\n\nfunction submitMyFirstForm()\
  \ {\n  $(‘#myFirstForm’).submit();\n}\n```\n\n如果表单的 `method` 属性没有赋予值，则会被设置为默认 `GET`。\n\
  \n此外，`action` 属性也有默认值。因此，按钮点击将引用到当前页面。然而，URL 现在将包含一个 `QueryString`，它是用户选择或输入的值的组合。例如，如果表单要求用户输入\
  \ Customer ID，用户输入了 1245，那么 `QueryString` 将是：\n\n`customerID=1245`\n\n此 `QueryString`\
  \ 将按以下方式附加 URL：`Mywebpage.asp?customerID=1245`\n\n这里同样重要的是说明的是，`QueryString` 是经过\
  \ URI 编码的。因此，特殊字符由特定值表示。例如。\n\n\n\n\n\n```javascript\nhttp.createServer(function\
  \ (request, response) {\nresponse.writeHead(200, {‘Content-Type’: ‘text/plain’});\n\
  response.end(‘Hello World!\\n’);\nconsole.log(‘Handled request’);\n}).listen(8080,\
  \ ‘localhost’);\nconsole.log(‘Server running at http://localhost:8080/’);\n```第一行加载了\
  \ `http` 模块，第二行创建一个服务器对象。`createServer` 函数接收两个参数：`request` 和 `response`。所有的网站处理都通过这些函数完成。在这个示例中，`response`\
  \ 函数通过在屏幕上写入“Hello World”来结束。\n\n`createServer` 函数返回一个服务器对象，该对象调用 `listen` 函数。该函数在端口\
  \ `8080` 监听并将主机的 IP 地址设置为 `127.0.0.1`。因此，如果你的系统中安装了网络适配器，你的 Web 服务器将立即开始监听网络请求。最后一行会在屏幕上打印一行，让用户服务器正在运行并监听请求。\n\
  \n一旦你创建了文件并按照上述方法保存了文件内容，你必须打开命令行提示符并输入命令：\n\n`Node myFile.js`\n\n现在，保持命令行提示符活动，你必须打开\
  \ 浏览器并输入地址：`http://localhost:8080/`\n\n一旦发送请求并收到响应，将通过控制窗口通知用户。如果你成功完成了这些操作，那么你刚刚创建了你的第一个\
  \ node.js 网站。如果你想停止代码运行，只需按 `Ctrl+C`。\n\n现在你已经知道了请求是如何被接收的，是时候查看这些请求是如何被处理以及响应是如何生成的。你可能需要使用\
  \ `url` 模块来解析 `QueryString`。\n\n下面的代码了如何解析 URL 字符串并根据它生成响应。\n\n```javascript\nvar\
  \ http = require(‘http’);\nvar url = require(‘url’);\nhttp.createServer(function\
  \ (request, response) {\nvar url_parts = url.parse(request.url, true);\nresponse.writeHead(200,\
  \ {‘Content-Type’: ‘text/plain’}); response.end(‘Hey ‘ + url_parts.query.name +\
  \ ‘.\\n’);\nconsole.log(‘Handled request from ‘ + url_parts.query.name);\n}).listen(8080,\
  \ ‘localhost’);\nconsole.log(‘Server is running at: http://localhost:8080/’);\n\
  ```你可以以类似于之前代码的方式测试这段代码的运行。\n\n## 如何创建 Node.js 模块\n\n你可以通过以函数形式编写代码然后在主代码中调用这些模块来创建模块。\n\
  \n```javascript\nvar myHttp = require(‘http’);\nvar myUrl = require(‘url’);\nfunction\
  \ start(){\nhttp.createServer(function (request, response) {\nvar url_parts = url.parse(request.url,\
  \ true);\nresponse.writeHead(200, {‘Content-Type’: ‘text/plain’});\nresponse.end(‘Hello\
  \ ‘ + url_parts.query.name + ‘!\\n’);\nconsole.log(‘Handled request from ‘ + url_parts.query.name);\n\
  }).listen(8080, ‘localhost’);\nconsole.log(‘Server running at http://localhost:8080/’);\n\
  }\nexports.start = start;\n```当将这段代码保存到文件中时，一个模块就被创建了。这个模块可以被其他使用 `require` 函数的函数使用。例如，如果文件保存为\
  \ `sample1.js`，则可以在另一个函数中使用：`var samplex = require(‘./sample1.js’);`\n\n`sample1.start();`\n\
  \n## 如何创建 Node.js 包\n\n模块的集合被称为应用程序。一旦你发布了包，它就可以被安装和使用。考虑一个包含不同数学模块的包。\n\n根文件夹必须包含以下内容：\n\
  \n- `README.md`\n- `\\packName`\n- `\\lib`\n- `main.js`\n- `\\bin`\n- `mod1.js`\n\
  - `mod2.js`\n\n## 创建聚合模块\n\n你可能只想为用户提供一个对象。用户应该能够通过这个对象访问包的所有模块。为了实现这一点，必须在 `bin`\
  \ 文件夹中创建一个 `main.js` 模块，并在其中定义包含在 `module.exports` 中的模块。\n\n## 如何创建 README.md 文件\n\
  \n`README.md` 文件是一个帮助文件，开发者可以将其作为使用包的启动指南。该文件的扩展名是 `.md`，它是 mark-down 的缩写。这种格式为文件中编写的文本提供了可读性。\n\
  \n下面是这种类型的示例文件：\n\n```\nsamplePackage package\n====================\n```\n\n在 `samplePackage`\
  \ 中，可用以下函数：\n\n- `add` 执行两个数字相加并显示结果。\n- `sub` 执行一个数字减去另一个数字并显示结果。\n\n## 如何创建 package.json\
  \ 文件\n\n此文件包含包的元数据，可以使用命令手动创建：\n\n`npm init`\n\n此命令创建该文件，稍后可以对其进行编辑。示例如下：\n\n```json\n\
  {\n“name”: “sample”,\n“version”: “0.0.0”,\n“description”: “This”,\n“main”: “main.js”,\n\
  “scripts”: {\n“test”: “echo \\\"This is a test\\\" && exit 1”\n},\n“repository”:\
  \ \"\",\n“keywords”: [\n“sample”,\n“example”,\n“add”,\n“sub”\n],\n“author”: “XYZ”,\n\
  “license”: “ABC”\n}\n```\n\n## 如何发布包\n\n如之前所述，包是以文件夹的形式定义的。当你发布包时，它是对所有用户可见的。为了执行此操作，你必须在发布任何包之前创建一个账户：`adduser`。当你输入信息后，账户就会创建。\n\
  \n## 如何安装并使用包\n\n发布的包可以被任何用户下载和安装。你只需要进入文件夹并运行命令 `npm install samplePackage`。这将安装包。另一方面，如果你想全局安装包，可以使用命令\
  \ `npm install -g samplePackage`。对于全局安装，你需要使用 `npm link samplePackage` 为应用程序创建一个链接。你可以通过\
  \ `cd` 命令进入 `node_modules` 文件夹并返回。在文件夹内部，你可以运行 `npm install contoso` 来启动安装。现在你可以编写使用该包的代码。示例如下：\n\
  \n```javascript\nvar samplePackage = require(‘samplePackage’);\nvar finalResult\
  \ = 0;\nconsole.log();\nfinalResult = samplePackage.add (5,10);\nconsole.log(‘add\
  \ (5,10) = ‘ + finalResult);\nconsole.log();\nresult = samplePackage.sub (50,10);\n\
  console.log(‘sub(50,10) = ‘ + finalResult);\nconsole.log();\nconsole.log(‘done’);\n\
  ```\n\n这段代码测试了包的模块。你可以使用 `node main` 执行代码。\n\n可以使用以下命令本地卸载包：\n\n`npm uninstall samplePackage`\n\
  \n但如果你想全局卸载包，可以使用 `npm uninstall -g samplePackage`\n\n## 如何使用 Express\n\n1. 第一步是安装\
  \ Node.js 并创建一个存放所有 `.js` 文件和项目的示例。此外，你必须安装 Express，它是用于 Node.js 开发的 Web 应用程序框架。\n\
  \n2. 你可以使用以下命令和指令创建一个包。\n\n1. `npm init`\n\n2. 你可以创建一个包含内容的 `myPackage.js` 文件：\n\
  \n```json\n{\n“name”: “Sample”,\n“version”: “0.0.0”,\n“description”: “This is a\
  \ sample website.”,\n“main”: “main.js”,\n“scripts”: {\n```\n\n\n```json\n{\n  \"\
  test\": \"echo \\\"Error: Test not specified\\\" && exit 1\",\n  \"repository\"\
  : \"\",\n  \"author\": \"XYZ\",\n  \"license\": \"BSD\",\n  \"private\": true,\n\
  \  \"dependencies\": {\n    \"express\": \"3.0.0\"\n  }\n}\n```\n\n为了在 `Express`\
  \ 中使用该文件，必须添加依赖项。\n\n此外，如果你不将其设置为私有（private），当计算机尝试加载该页面时，可能会来自防火墙的错误。\n\n3. 执行安装命令：`npm\
  \ install`\n\n4. 你可以使用命令 `npm ls` 来查看该包是否存在于注册表中。\n\n4. 你可以使用以下指令集创建一个简单的应用程序：0.\
  \ 创建一个文件 `myApp.js` 并向文件中添加以下内容：\n```javascript\nvar express = require('express');\n\
  var app = express();\n```\n\n2. 你可以使用 `myApp.Method()` 语法来定义路由。\n```javascript\n\
  app.get('/', function(request, response){\n  response.send('Hey World!');\n});\n\
  ```\n上述代码将在接收到请求时发送响应 ‘Hey World!’。\n\n3. 必须添加的最后一段代码用于监听请求。该代码如下：\n```javascript\n\
  var port = 8080;\napp.listen(port);\nconsole.log('Listening on port: ' + port);\n\
  ```\n\n4. 一旦文件完成，你就可以保存并使用命令 `node app` 运行它。现在如果你打开浏览器并输入地址 `http://localhost:8080/`，你将获得响应\
  \ *Hey World!*。\n\n5. 你可以通过将 `app.get` 语句替换为 `app.use(express.static(__dirname +\
  \ '/public'));` 为应用程序添加网页。这将允许你为多个网页使用相同的代码。该概念的示例实现如下：\n```html\n<!DOCTYPE html>\n\
  <html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n  <title></title>\n</head>\n\
  <body>\n  <form method=\"get\" action=\"/submitHey\">\n    Enter First Name: <input\
  \ type=\"text\" name=\"firstName\" />\n    <input type=\"submit\" value=\"Submit\"\
  \ />\n  </form>\n</body>\n</html>\n```\n请注意 `action` 属性被设置为 `/submitHey`。换句话说，服务器调用此资源是为了处理通过\
  \ `QueryString` 传递给它的数据。`myApp.js` 文件应包含内容：\n```javascript\nvar express = require('express');\n\
  var app = express();\napp.use(express.static(__dirname + '/public'));\napp.get('/SubmitHey',\
  \ function (request, response) {\n  response.writeHead(200, { 'Content-Type': 'text/html'\
  \ }); \n  response.write('Hey ' + request.query.userName + '!<br />'); \n  response.end('Enjoy.');\n\
  \  console.log('Handled request from ' + request.query.userName);\n});\nvar port\
  \ = 8080;\napp.listen(port);\nconsole.log('Listening on port: ' + port);\n```\n\
  可以按照上述方式运行该应用。\n\n5. *formidable* 包可以用于回传数据。之前的方法使用了 GET 方法，而此方法使用 POST 方法。\n\n\
  1. 为了说明其工作原理，请创建一个如下 HTML：\n```html\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n<head>\n  <title></title>\n</head>\n<body>\n  <form method=\"post\" action=\"\
  /SubmitHeyPost\">\n    Enter Name: <input type=\"text\" name=\"firstName\" />\n\
  \    <input type=\"submit\" value=\"Submit\" />\n  </form>\n</body>\n</html>\n```\n\
  \n2. 现在，在命令提示符中，你需要输入命令来获取 formidable 包：`npm info formidable`\n\n3. 你也可以按照如下方式修改\
  \ `package.jason` 文件：\n```json\n{\n  \"name\": \"HelloExpress\",\n  \"version\"\
  : \"0.0.0\",\n  \"description\": \"Sample Website\",\n  \"main\": \"index.js\",\n\
  \  \"scripts\": {\n    \"test\": \"echo \\\"Error: test not specified\\\" && exit\
  \ 1\"\n  },\n  \"repository\": \"\",\n  \"author\": \"XYZ\",\n  \"license\": \"\
  BSD\",\n  \"private\": true,\n  \"dependencies\": {\n    \"formidable\": \"1.x\"\
  ,\n    \"express\": \"3.0.0\"\n  }\n}\n```\n\n4. 现在你可以在命令提示符中输入以下命令来安装 *formidable*\
  \ 包：`npm install`\n此命令将包安装在本地。因此，你需要在 `myApp.js` 中添加一行允许文件引用该包的代码：`var formidable\
  \ = require('formidable');`\n\n5. 一个示例 `myApp.js` 文件应如下：\n```javascript\nvar express\
  \ = require('express');\nvar app = express();\nvar formidable = require('formidable');\n\
  app.use('/forms', express.static(__dirname + '/public')); \napp.post('/SubmitHeyPost',\
  \ function (request, response) {\n  if (request.method.toLowerCase() == 'post')\
  \ {\n    var form = new formidable.IncomingForm();\n    form.parse(request, function\
  \ (err, fields) {\n      // 实现逻辑\n    });\n  }\n});\n```\n可以按照上述方式运行该应用。\n\n\n\n\
  这种类型的 Web 服务也称为大型 Web 服务。此类服务的示例是 `WCF` 或 `Windows Communication Foundation`（Windows\
  \ 通信框架）。任意 Web 服务通过不限于将其操作映射到协议的某些方面，扩展了其操作范围。\n\n结果是它们提供了更多功能，包括许多安全机制和消息路由。\n\n\
  这种类型的 Web 服务具有一种典型的接口格式，客户端可以使用它来读取和解析信息。因此，客户端可以立即调用该服务。一种常见的 API 格式是 `Web Services\
  \ Description Language (WSDL)`。对于任意 Web 服务，客户端必须在 `SOAP`（简单对象访问协议）消息的帮助下组装请求。这种\
  \ Web 服务不使用 `HTTP` 协议，而是使用 `TCP`。\n\n## 如何使用 Node.js 创建 RESTful Web 服务\n\n在之前提到的示例中，`samplePackage`\
  \ 可以暴露为 Web 服务。\n\n可以在该包上使用 `GET` 方法，并将操作作为参数传递。该包良好的 RESTful 实现可能像这样：`http://localhost:8080/samplePackage?operation=add&x=1&y=5`\n\
  \n## 如何使用 AJAX 调用 Web 服务\n\n可以使用 `AJAX` 异步调用 Web 服务，`AJAX` 实际上是 `JavaScript`。`AJAX`\
  \ 不是向服务器发送调用并重绘 HTML 文档，而是直接回调服务器。在这种情况下，屏幕不会重绘。下面给出了示例实现：\n\n可以使用以下代码创建一个 `MyPage.html`：\n\
  \n```html\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml”>\n<head>\n\
  <title></title>\n<script type=\"text/javascript\" src=\"/scripts/jquery-1.8.2.min.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"/scripts/default.js\"></script>\n\
  </head>\n<body>\n<form id=\"myForm\">\nEnter Value of X:<input type=\"text\" id=\"\
  x\" /><br />\nEnter Value of Y:<input type=\"text\" id=\"y\" /><br />\nResult of\
  \ Operation: <span id=\"result\"></span><br />\n<button id=\"btnAdd\" type=\"button\"\
  >Add the Numbers</button>\n</form>\n</body>\n</html>\n```\n\n必须修改 `default.js` 文件以包含处理这些函数所需的代码。务必检查\
  \ `jQuery` 的版本以及是否与你在 `default.js` 中提到的版本匹配。此处使用的 `<form>` 元素仅用于排列数据格式，数据实际上并未通过服务器发送。`JavaScript`\
  \ 和 `jQuery` 访问数据\n\n## 如何使用 XMLHttpRequest\n\n真正执行 `AJAX` 用的对象是 `XMLHttpRequest`，它可以发送/接收\
  \ `XML` 和其他类型的数据。该对象可以使用以下方式使用：\n\n```javascript\nvar xmlhttp=new XMLHttpRequest();\n\
  xmlhttp.open(\"GET\",\"/add?x=50&y=1\",false);\nxmlhttp.send();\n```\n\n第一行创建对象，第二行设置使用指定字符串的\
  \ `GET` 方法，并使用 `false` 表示该操作必须异步执行。下一行发送请求，最后一行将响应设置到一个变量，稍后可以读取并解析以处理响应。然而，生成的输出是\
  \ `JSON` 而不是 `XML`，因此 `default.js` 文件必须更改为：\n\n```javascript\n$(document).ready(function\
  \ () {\n    $(\"#btnAdd\").on('click', addTwo)\n});\n\nfunction addTwo() {\n   \
  \ var x = document.getElementById('x').value;\n    var y = document.getElementById('y').value;\n\
  \    var result = document.getElementById('finalResult');\n    var xmlhttp = new\
  \ XMLHttpRequest();\n    xmlhttp.open(\"GET\", \"/add?x=\" + x + \"&y=\" + y, false);\n\
  \    xmlhttp.send();\n    xmlhttp.onreadystatechange = function () {\n        if\
  \ (xmlhttp.readyState == 4 && xmlhttp.status == 200) {\n            var jsonObject\
  \ = JSON.parse(xmlhttp.response);\n            result.innerHTML = jsonObject.result;\n\
  \        }\n    };\n}\n```\n\n状态 `codes` 如下：\n- 0: 未初始化 (Uninitialized)\n- 1: 加载中\
  \ (Loading)\n- 2: 已加载 (Loaded)\n- 3: 交互中 (Interactive)\n- 4: 完成 (Completed)\n\n\
  如果服务器提供了进度事件，你可以订阅浏览器的进度事件。然后可以添加一个事件监听器，在事件触发时启动代码执行。可以通过以下方式实现：\n\n要测试页面，你可以输入命令：`node\
  \ app`\n该命令启动 Web 服务，之后你可以通过链接 `http://localhost:8080/SamplePage.html` 打开浏览器窗口，此代码现在可以运行。然而，你可能希望以异步方式进行\
  \ `AJAX` 调用。为此，你必须找到 `open` 方法并将 `false` 参数改为 `true`。此外，你还需要订阅 `onreadystatechange`\
  \ 来管理异步调用。\n\n# 文档目录\n\n- Java - 基础语法\n    - 第一个 Java 程序：\n    - 基础语法\n    - Java\
