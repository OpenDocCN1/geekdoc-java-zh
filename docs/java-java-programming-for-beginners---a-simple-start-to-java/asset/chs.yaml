  循环是你预计会经常遇到的常见编程情况。循环简单地描述为你可能需要重复执行同一块代码的情况。`Java` 支持三种循环结构，如下所示：\n\n- `for` 循环\n\
  - `do…while` 循环\n- `while` 循环\n\n此外，还存在 `foreach` 循环结构。然而，该结构将在数组的章节中进行解释。\n\n###\
