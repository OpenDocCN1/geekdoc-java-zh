  \ – 去除字符串开头和结尾的空白字符。\n\n## 数组\n\nJava 支持一种类似于簇（cluster）的信息结构。这种信息结构被称为数组。它能够存储相同数据类型组件的尺寸可变的连续累积。数组用于存储信息的累积，但将其考虑为存储同类变量的容器通常更有价值。\n\
  \n与声明单个变量（例如 `num0`、`num1` 和 `num99`）相比，可以声明一个数组。\n\n\n\n\n\n你可以利用 `new` 运算符配合以下语句来创建一个数组：`myarray\
  \ = new datatype[sizeofarray];`\n\n上述声明执行了两个操作：\n\n1. 它在 `new` 运算符的帮助下以以下方式创建了一个数组：`new\
  \ datatype[arraysize];`\n2. 它将最近创建的数组的引用赋值给变量 `myarray`。\n\n声明一个数组变量、创建数组并将该数组的引用分配给变量可以合并为一个声明，如所示：`datatype[]\
  \ myarray = new datatype[sizeofarray];`\n\n另一方面，你也可以通过以下方式创建聚类数组：`datatype[] myarray\
  \ = {val0, val1, …, valk};`\n\n数组的组件可以通过记录获取。数组列表是基于 0 索引的；也就是说，它们从 0 开始到 `myarray.length-1`\
  \ 结束。\n\n### 示例实现\n\n所示的声明定义了一个数组 `myarray`，创建了一个包含 10 个 `double` 类型组件的聚类，并将其引用赋值给\
  \ `myarray`：`double[] myarray = new double[10];`\n\n### 处理数组\n\n在处理数组组件时，我们经常使用\
  \ `for` 或 `foreach`，因为数组中的大多数组件都是相同类型，且数组的长度是已知的。\n\n### 示例\n\n```java\npublic class\
  \ Mytestarray {\n    public static void main(string[] args) {\n        double[]\
  \ myarray = {0.5, 1.2, 2.2, 3.4, 4.7};\n        for (int k = 0; k < myarray.length;\
  \ k++) {\n            System.out.println(myarray[k] + ” “);\n        }\n       \
  \ double aggregate = 0;\n        for (int k = 0; k < myarray.length; k++) {\n  \
  \          aggregate += myarray[k];\n        }\n        System.out.println(“Aggregate\
  \ value = ” + aggregate);\n        double maxval = myarray[0];\n        for (int\
  \ k = 1; k < mylist.length; k++) {\n            if (myarray[i] > maxval)\n     \
  \           maxval = myarray[k];\n        }\n        System.out.println(“Max Value\
  \ is ” + maxval);\n    }\n}\n```\n\n这将会产生相应的的结果：\n0.5 1.2 2.2 3.4 4.7\nAggregate\
  \ = 12.0\nMax Value is 4.7\n\n### foreach 循环\n\nJDK 1.5 提供了另一种 for 结构，被称为 `foreach`\
  \ 循环或扩展 for 循环。这种结构允许你在不使用额外变量的情况下连续遍历整个数组。\n\n### 示例实现\n\n```java\npublic class\
  \ Mytestarray {\n    public static void main(string[] args) {\n        double[]\
  \ myarray = {0.5, 1.2, 2.2, 3.4, 4.7};\n        for (double i: myarray) {\n    \
  \        System.out.println(i);\n        }\n    }\n}\n```\n\n这将会交付相应的的结果：\n0.5 1.2\
  \ 2.2 3.4 4.7\n\n### 将数组传递给方法\n\n通常，就像你可以将基本类型值传递给方法或函数一样，你也可以向系统传递数组。例如，下面的方法显示了\
  \ `int` 数组中的组件：\n\n```java\npublic static void printarr(int[] arr) {\n    for (int\
  \ k = 0; k < arr.length; k++) {\n        System.out.print(arr[k] + ” “);\n    }\n\
  }\n```\n\n你可以通过传递数组来调用它。例如，下面的声明调用了 `printarr` 函数来显示数组的元素：\n`printarr(new int[]{0,\
  \ 3, 5, 3, 1});`\n\n该代码的编译和执行产生以下结果：0 3 5 3 1\n\n### 方法如何返回数组\n\n方法也可以返回一个数组。例如，下面演示的方法返回一个另一个数组反转后的数组：`public\
  \ static int[] revarr(int[] myarr) { int[] resultarr = new int[myarr.length]; for\
  \ (int k = 0, i = resultarr.length - 1; k <= myarr.length/2; k++, i- -) { resultarr[j]\
  \ = myarr[k]; } return resultarr; }`\n\n### Arrays 类\n\n`java.util.arrays` 类包含了不同的函数，用于对数组进行排序、查找值、查看数组以及填充数组组件。这些函数适用于所有基本数据类型。\n\
  \n- `public static boolean equals(long[] a, long[] a2)` - 如果两个指定的数组相互相等，则返回 true。如果两个数组包含相同数量的组件，且两个数组中所有相关的组件集都是等等的，则认为这两个数组是等等的。如果两个数组相等，则返回\
  \ true。所有其他基本数据类型也可以使用相同的函数。\n- `public static int binarysearch(object[] an, Object\
  \ key)` - 使用二分查找在指定的 `Object` 数组中查找定义的值。在进行此调用之前必须对数组排序。如果键在列表中，则返回键的索引；通常为 `(-(插入点\
  \ + 1))`。\n- `public static void sort(Object[] a)` - 对数组进行排序。\n- `public static\
  \ void fill(Object[] a, int val)` - 将值填充到数组中。\n\n\n\n\n\n# 正则表达式语法\n\n- `\\Z`: 字符串末尾，但终止\
  \ `\\Z` 字符的最后一行外。\n- `re*`: 匹配表达式的 0 次或多次。\n- `re+`: 匹配表达式的 1 次或多次。\n- `re?`: 匹配表达式的\
  \ 0 次或 1 次。\n- `re{ n}`: 精确匹配 `n` 次表达式。\n- `re{ n,}`: 匹配指定的 `re` 表达式 `n` 次或多次。\n\
  - `re{ n, m}`: 匹配最少 `n` 次最多 `m` 次 `re{ n, m}` 表达式。\n- `a| b`: 匹配其中之一：`a` 或 `b`。\n\
  - `(re)`: 分组正则表达式。匹配的文本会被记录为 `(re)`。\n- `(?: re)`: 分组正则表达式。文本不会被记录为 `(?: re)`。\n\
  - `(?> re)`: 匹配独立模式。不支持回溯的 `(?> re)`。\n- `\\w`: 匹配单词字符。\n- `\\W`: 匹配非单词字符。\n- `\\\
  s`: 匹配空白字符。这些字符等于 `\\s` 到 `[\\t\\n\\r\\f]`。\n- `\\S`: 匹配非空白的空格。\n- `\\d`: 匹配数字。这些通常等于\
  \ `0` 到 `9`。\n- `\\D`: 匹配非数字。\n- `\\A`: 匹配字符串开头。\n- `\\Z`: 匹配在换行字符 `\\Z` 之前的字符串末尾。\n\
  - `\\z`: 匹配字符串末尾。\n- `\\G`: 匹配上一次匹配条件 `\\G` 所在的位置。\n- `\\n`: 分组数字 `n` 的反引用。\n- `\\\
  b`: 在不带括号使用时匹配单词边界。然而，在括号内使用 `\\b` 时匹配的是退格符。\n- `\\B`: 匹配非单词的边界。\n- `\\n, \\t, etc.`:\
  \ 匹配回车符、换行符和制表符。\n- `\\Q`: 转义所有字符，直到找到 `\\E`。\n- `\\E`: 结束任何以 `\\Q` 开始的引号。\n\n#\
