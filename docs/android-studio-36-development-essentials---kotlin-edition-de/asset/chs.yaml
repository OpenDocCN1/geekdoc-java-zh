  \ 33.8 总结\n\n如果用户界面包含的视图不对用户交互做出反应，那么它就没有任何实际用途。Android 通过事件监听器和回调方法桥起了用户界面与后端代码之间的关系。`View`\
  \ 类定义了一组事件监听器，可以注册在上面。每个事件监听器还关联了一个回调方法。\n\n当事件发生在用户界面上时，该事件会被放入事件队列，并由 Android\
  \ 运行时先顺序处理。如果发生事件的视图注册了匹配类型的监听器，将调用相应的回调方法或 lambda 表达式。该代码在返回之前执行执行活动所需的任何任务。\n\n\
  ## 34 Android 触摸与多点触摸\n\n大多数 Android 设备使用触摸屏作为用户与设备之间的主要界面。上一章介绍了屏幕触摸如何转化为运行中 Android\
  \ 应用程序的动作机制。然而，触摸事件处理远不止是响应视图上的单个手指点击。大多数 Android 设备可以，例如，同时检测到多个触摸。触摸也不限于设备上的单个点。当然，当用户在屏幕表面滑动一个或多个点时，触摸可以是动态的。\n\
  \n应用程序还可以将触摸解释为手势。例如，水平滑动通常用于翻页电子书，或者考虑捏合动作如何用于放大或缩小显示的图像。\n\n本章将解释涉及运动的触摸处理，并探索拦截多个并发触摸的概念。识别特定手势的主将在下一章介绍。\n\
  \n## 34.1 拦截触摸事件\n\n\n\n\n视图对象可以通过注册 `onTouchListener` 事件监听器并实现相应的 `onTouch()` 回调方法或\
  \ lambda 表达式来拦截触摸事件。例如，以下代码确保了在名为 `myLayout` 的 `ConstraintLayout` 视图实例上的任何触摸都会调用\
  \ lambda 表达式：\n\n```kotlin\nmyLayout.setOnTouchListener {v: View, m: MotionEvent\
  \ ->\n    // 在此处执行任务\n    true\n}\n```\n\n当然，上述代码也可以通过函数 own lambda 表达式来实现，如下所示，尽管\
  \ lambda 方式生成的代码更紧凑且更具可读性：\n\n```kotlin\nmyLayout.setOnTouchListener(object : View.OnTouchListener\
  \ {\n    override fun onTouch(v: View, m: MotionEvent): Boolean {\n        // 在此处执行任务\n\
  \        return true\n    }\n})\n```\n\n正如代码示例所示，lambda 表达式需要返回一个 `Boolean` 值，用于指示\
  \ Android 运行时系统应该将该事件传递给在同一视图上注册的其他事件监听器，还是将其丢弃。该方法传递了触发事件的视图引用以及一个类型为 `MotionEvent`\
  \ 的对象。\n\n## 34.2 MotionEvent 对象\n\n传递到 `onTouch()` 回调方法的 `MotionEvent` 对象是获取事件信息的关键。对象中包含的信息包括触摸在视图中的位置以及执行的操作类型。`MotionEvent`\
  \ 对象也是处理多点触摸的关键。\n\n## 34.3 理解触摸动作（Touch Actions）\n\n触摸事件处理的一个重要方面是能够识别用户执行的操作类型。与事件相关的操作类型可以通过调用传递到\
  \ `onTouch()` 回调方法的 `MotionEvent` 对象的 `getActionMasked()` 方法来获取。当视图上发生第一次触摸时，`MotionEvent`\
  \ 对象将包含类型为 `ACTION_DOWN` 的动作类型以及触摸坐标。当该触摸从屏幕上抬起时，会产生一个 `ACTION_UP` 事件。在 `ACTION_DOWN`\
  \ 和 `ACTION_UP` 事件之间的任何触摸移动都将由 `ACTION_MOVE` 事件表示。\n\n当在视图上同时进行多个触摸操作时，这些触摸被称为指针（pointers）。在多点触摸场景下，指针分别以类型为\
  \ `ACTION_POINTER_DOWN` 和 `ACTION_POINTER_UP` 的事件动作开始和结束。为了识别触发事件的指针索引，必须调用 `MotionEvent`\
  \ 对象的 `getActionIndex()` 回调方法。\n\n## 34.4 处理多点触摸\n\n标题为“Android 事件处理概述与示例”的章节开始在单次触摸事件的狭窄范围内探索事件处理。在实践中，大多数\
  \ Android 设备都具有响应多个连续触摸的能力（尽管需要注意的是，可以检测到的同时触摸数量取决于设备）。\n\n正如之前讨论的，在多点触摸情况下，每次触摸都被\
  \ Android 框架视为一个指针。每个指针反过来通过一个索引值被引用，并分配一个 ID。可以通过调用当前 `MotionEvent` 对象的 `getPointerCount()`\
  \ 方法获取当前指针的数量。当前指针列表中特定索引处的指针的 ID 可以通过调用 `MotionEvent.getPointerId()` 方法获取。例如，以下代码段获取了指针计数以及索引\
  \ 0 处指针的 ID：\n\n```kotlin\nmyLayout.setOnTouchListener {v: View, m: MotionEvent\
  \ ->\n    val pointerCount = m.pointerCount\n    val pointerId = m.getPointerId(0)\n\
  \    true\n}\n```\n\n注意，当 `onTouch` 监听器被触发时，指针计数将始终大于或等于 1（因为必须至少发生一次触摸才会触发回调函数）。\n\
  \n在视图上的触摸，特别是涉及跨屏幕移动的触摸，会在与屏幕的接触点抬起之前产生一系列事件。因此，应用程序可能需要跨多个触摸事件跟踪单个触摸。虽然特定触摸手势的\
  \ ID 不会从一个事件变为另一个事件，但重要的是，索引值（index value）会随着其他触摸事件的到来离开而改变。因此，在跨多个事件处理触摸手势时，必须使用\
  \ ID 值作为触摸引用，以确保跟踪的是同一个触摸。在调用需要索引值的方法时，应通过调用 `MotionEvent` 对象的 `findPointerIndex()`\
  \ 方法将触摸的 ID 转换为对应的索引值来获取。\n\n### 34.5 多点触摸应用示例\n\n在本章剩余部分中创建的示例应用程序将跟踪在布局视图上移动的最多多两个触摸手势。当每个触摸的事件被触发时，每个触摸的坐标、索引和\
  \ ID 将显示在屏幕上。\n\n从欢迎界面选择“Start a new Android Studio project”（新建 Android Studio 项目）快速启动选项，在生成的新项目对话框中，选择“Empty\
  \ Activity”模板，然后点击“Next”按钮。\n\n在 `Name` 字段中输入 `MotionEvent`，并指定 `com.ebookfrenzy.motionevent`\
  \ 为包名。在点击“Finish”按钮之前，将 Minimum API level 设置为 API 26。\n\n## 34.6 设计 Activity 界面\n\
  \n该 Activity 的用户界面将由一个包含两个 `TextView` 对象的 `ConstraintLayout` 视图组成。在 Project 窗口中，导航到\
  \ `app -> res -> layout` 并双击 `activity_main.xml` 资源文件将其加载到 Android Studio 编辑器。选择并删除默认的“Hello\
  \ World!” `TextView` 控件，然后在开启自动连接（autoconnect）的情况下，拖放一个新的 `TextView` 控件，使其水平居中并在布局的顶部边缘留有\
  \ 16dp 的间距。拖入第二个 `TextView` 控件，使其与第一个控件底部保持 32dp 的间距。使用 Attributes 窗口，将 `TextView`\
  \ 控件的 ID 分别更改为 `textView1` 和 `textView2`。将控件显示的文本更改为“Touch One”和“Touch Two”，并使用右上角的警告按钮将字符串提取到资源。在\
  \ Component Tree 中选择 `ConstraintLayout` 项，并使用 Attributes 面板将 ID 更改为 `activity_main`。\n\
  \n## 34.7 实现触摸监听器\n\n为了接收触摸事件通知，必须在 `MainActivity` Activity 类的 `onCreate()` 方法中为布局视图注册触摸监听器。从\
  \ Android 编辑器面板选择 `MainActivity.kt` 标签以显示源代码。在 `onCreate()` 方法中，添加注册监听器的代码，并实现在该情况下该代码将调用一个名为\
  \ `handleTouch()` 的第二个方法，并传递 `MotionEvent` 对象：\n\n```kotlin\npackage com.ebookfrenzy.motionevent\n\
  \nimport androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\nimport\
  \ android.view.MotionEvent\nimport android.widget.TextView\nimport kotlinx.android.synthetic.main.activity_main\n\
  \nclass MainActivity : AppCompatActivity() {\n    override fun onCreate(savedInstanceState:\
  \ Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_main)\n\
  \        activity_main.setOnTouchListener {_, m: MotionEvent ->\n            handleTouch(m)\n\
  \            true\n        }\n    }\n}\n```\n\n\n\n\n\n在测试应用程序之前的最后一项任务是实现由监听器调用的\
  \ `handleTouch()` 方法。该方法的代码如下：\n\n```kotlin\nprivate fun handleTouch(m: MotionEvent)\n\
  {\n    val pointerCount = m.pointerCount\n    for (i in 0 until pointerCount)\n\
  \    {\n        val x = m.getX(i)\n        val y = m.getY(i)\n        val id = m.getPointerId(i)\n\
  \        val action = m.actionMasked\n        val actionIndex = m.actionIndex\n\
  \        var actionString: String\n        when (action)\n        {\n          \
  \  MotionEvent.ACTION_DOWN -> actionString = \"DOWN\"\n            MotionEvent.ACTION_UP\
  \ -> actionString = \"UP\"\n            MotionEvent.ACTION_POINTER_DOWN -> actionString\
  \ = \"PNTR DOWN\"\n            MotionEvent.ACTION_POINTER_UP -> actionString = \"\
  PNTR UP\"\n            MotionEvent.ACTION_MOVE -> actionString = \"MOVE\"\n    \
  \        else -> actionString = \"\"\n        }\n        val touchStatus =\n   \
  \         \"Action: $actionString Index: $actionIndex ID: $id X: $x Y: $y\"\n  \
  \      if (id == 0)\n            textView1.text = touchStatus\n        else\n  \
  \          textView2.text = touchStatus\n    }\n}\n```\n\n在编译和运行应用程序之前，值得花时间系统地遍历这段代码，以突出正在执行的任务。\n\
  \n代码首先识别当前视图上有多少个活跃的指针：\n\n```kotlin\nval pointerCount = m.pointerCount\n```\n\n\
  接下来，使用 `pointerCount` 变量启动一个 `for` 循环，为每个活跃的指针执行一组任务。循环的前几行获取了触摸的 `X` 和 `Y` 坐标，以及相应的事件\
  \ ID、动作类型和动作索引。最后，声明了一个字符串变量：\n\n```kotlin\nfor (i in 0 until pointerCount)\n{\n\
  \    val x = m.getX(i)\n    val y = m.getY(i)\n    val id = m.getPointerId(i)\n\
  \    val action = m.actionMasked\n    val actionIndex = m.actionIndex\n    var actionString:\
  \ String\n```\n\n由于动作类型等同于整数值，因此使用 `when` 语句将动作类型转换为更有意义的字符串值，并将其存储在之前定义的 `actionString`\
  \ 变量中：\n\n```kotlin\nwhen (action)\n{\n    MotionEvent.ACTION_DOWN -> actionString\
  \ = \"DOWN\"\n    MotionEvent.ACTION_UP -> actionString = \"UP\"\n    MotionEvent.ACTION_POINTER_DOWN\
  \ -> actionString = \"PNTR DOWN\"\n    MotionEvent.ACTION_POINTER_UP -> actionString\
  \ = \"PNTR UP\"\n    MotionEvent.ACTION_MOVE -> actionString = \"MOVE\"\n    else\
  \ -> actionString = \"\"\n}\n```\n\n最后，使用 `actionString` 值、`actionIndex`、触摸 ID 以及\
  \ `X` 和 `Y` 坐标构建字符串消息。然后使用 `ID` 值来决定是否将该字符串显示在第一个或第二个 `TextView` 对象上：\n\n```kotlin\n\
  val touchStatus =\n    \"Action: $actionString Index: $actionIndex ID: $id X: $x\
  \ Y: $y\"\nif (id == 0)\n    textView1.text = touchStatus\nelse\n    textView2.text\
  \ = touchStatus\n```\n\n## 34.8 运行应用程序\n\n在编译和运行应用程序之前，值得花时间系统地遍历这段代码，以突出正在执行的任务。\n\
  \n代码首先识别当前视图上有多少个活跃的指针：\n\n```kotlin\nval pointerCount = m.pointerCount\n```\n\n\
  接下来，使用 `pointerCount` 变量启动一个 `for` 循环，为每个活跃的指针执行一组任务。循环的前几行获取了触摸的 `X` 和 `Y` 坐标，以及相应的事件\
  \ ID、动作类型和动作索引。最后，声明了一个字符串变量：\n\n```kotlin\nfor (i in 0 until pointerCount)\n{\n\
  \    val x = m.getX(i)\n    val y = m.getY(i)\n    val id = m.getPointerId(i)\n\
  \    val action = m.actionMasked\n    val actionIndex = m.actionIndex\n    var actionString:\
  \ String\n```\n\n由于动作类型等同于整数值，因此使用 `when` 语句将动作类型转换为更有意义的字符串值，并将其存储在之前定义的 `actionString`\
  \ 变量中：\n\n```kotlin\nwhen (action)\n{\n    MotionEvent.ACTION_DOWN -> actionString\
  \ = \"DOWN\"\n    MotionEvent.ACTION_UP -> actionString = \"UP\"\n    MotionEvent.ACTION_POINTER_DOWN\
  \ -> actionString = \"PNTR DOWN\"\n    MotionEvent.ACTION_POINTER_UP -> actionString\
  \ = \"PNTR UP\"\n    MotionEvent.ACTION_MOVE -> actionString = \"MOVE\"\n    else\
  \ -> actionString = \"\"\n}\n```\n\n最后，使用 `actionString` 值、`actionIndex`、触摸 ID 以及\
  \ `X` 和 `Y` 坐标构建字符串消息。然后使用 `ID` 值来决定是否将该字符串显示在第一个或第二个 `TextView` 对象上：\n\n```kotlin\n\
  val touchStatus =\n    \"Action: $actionString Index: $actionIndex ID: $id X: $x\
  \ Y: $y\"\nif (id == 0)\n    textView1.text = touchStatus\nelse\n    textView2.text\
  \ = touchStatus\n```\n\n## 34.9 总结\n\nAndroid SDK 提供了检测常见和自定义手势的机制。常见手势涉及点击、双击、长按或滑动等交互。\n\
  \n本章的目标是探索使用 `GestureDetector` 来检测设备上的常见手势。下一章标题为《在 Android 上实现自定义手势和缩放识别》，将涵盖更复杂的自定义手势。\n\
  \n\n\n\n\n在本章的剩余部分中，我们将通过创建一个示例项目，来将上述步骤付诸实践。\n\n# 35.2 创建示例手势检测项目\n\n该项目的目标是检测\
  \ `GestureDetectorCompat` 类当前支持的全范围常见手势，并向用户显示状态信息以指示检测到的手势类型。\n\n从欢迎界面选择`Start\
  \ a new Android Studio project`（新建 Android Studio 项目）快速启动选项，在出现的新项目对话框中，点击`Next`按钮之前选择`Empty\
  \ Activity`模板。\n\n在`Name`字段中输入`CommonGestures`，并指定包名为`com.ebookfrenzy.commongestures`。在点击`Finish`按钮之前，将`Minimum\
  \ API level`（最低 API 级别）设置为`API 26: Android 8.0 (Oreo)`，并将`Language`（语言）菜单设置为`Kotlin`。\n\
  \n新项目创建完成后，在 Project 工具窗口中导航到`app -> res -> layout -> activity_main.xml`文件，并双击将其加载到\
  \ Layout Editor（布局编辑器）工具中。\n\n在 Layout Editor 工具中，选择“Hello, World!” `TextView` 组件，并在\
  \ Attributes（属性）工具窗口中输入`gestureStatusText`作为 ID。\n\n## 35.3 实现监听器类\n\n如前所述，有必要创建一个实现\
  \ `GestureDetector.OnGestureListener` 接口的类，如果需要检测双击，则还需要实现 `GestureDetector.OnDoubleTapListener`\
  \ 接口。虽然这可以是一个全新的类，但在当前的 Activity 类中实现也是完全有效的。因此，为了本示例的目的，我们将修改`MainActivity` 类来实现这些监听器接口。编辑`MainActivity.kt`\
  \ 文件，使其内容如下：\n\n```kotlin\npackage com.ebookfrenzy.commongestures\n\nimport androidx.appcompat.app.AppCompatActivity\n\
  import android.os.Bundle\nimport android.view.GestureDetector\nimport android.widget.TextView\n\
  import android.view.MotionEvent\nimport kotlinx.android.synthetic.main.activity_main.*\n\
  \nclass MainActivity : AppCompatActivity(),\n    GestureDetector.OnGestureListener,\
  \ GestureDetector.OnDoubleTapListener\n{\n.\n.\n```\n\n声明该类实现了监听器接口意味着必须在类中也实现相应的方法：\n\
  \n```kotlin\nclass MainActivity : AppCompatActivity(),\n    GestureDetector.OnGestureListener,\
  \ GestureDetector.OnDoubleTapListener\n{\n    override fun onCreate(savedInstanceState:\
  \ Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_common_gestures)\n\
  \    }\n\n    override fun onDown(event: MotionEvent): Boolean {\n        gestureStatusText.text\
  \ = \"onDown\"\n        return true\n    }\n\n    override fun onFling(event1: MotionEvent,\
  \ event2: MotionEvent,\n                        velocityX: Float, velocityY: Float):\
  \ Boolean {\n        gestureStatusText.text = \"onFling\"\n        return true\n\
  \    }\n\n    override fun onLongPress(event: MotionEvent) {\n        gestureStatusText.text\
  \ = \"onLongPress\"\n    }\n\n    override fun onScroll(e1: MotionEvent, e2: MotionEvent,\n\
  \                          distanceX: Float, distanceY: Float): Boolean {\n    \
  \    gestureStatusText.text = \"onScroll\"\n        return true\n    }\n\n    override\
  \ fun onShowPress(event: MotionEvent) {\n        gestureStatusText.text = \"onShowPress\"\
  \n    }\n\n    override fun onSingleTapUp(event: MotionEvent): Boolean {\n     \
  \   gestureStatusText.text = \"onSingleTapUp\"\n        return true\n    }\n\n \
  \   override fun onDoubleTap(event: MotionEvent): Boolean {\n        gestureStatusText.text\
  \ = \"onDoubleTap\"\n        return true\n    }\n\n    override fun onDoubleTap(event:\
  \ MotionEvent): Boolean {\n        gestureStatusText.text = \"onDoubleTap\"\n  \
  \      return true\n    }\n\n    override fun onSingleConfirmed(event: MotionEvent):\
  \ Boolean {\n        gestureStatusText.text = \"onSingleConfirmed\"\n        return\
  \ true\n    }\n}\n```\n\n## 35.4 创建 GestureDetector 实例\n\n现在 Activity 已经更新并实现了监听器接口，下一步是创建\
  \ `GestureDetector` 实例。由于只需要在 Activity 创建时执行一次，因此此代码的最佳位置是`onCreate()` 方法中：\n\n\
  ```kotlin\npackage com.ebookfrenzy.commongestures\n\nimport androidx.appcompat.app.AppCompatActivity\n\
  import android.os.Bundle\nimport android.view.GestureDetector\nimport android.widget.TextView\n\
  import android.view.MotionEvent\nimport androidx.core.view.GestureCompat\nimport\
  \ kotlinx.android.synthetic.main.activity_main.*\n\nclass MainActivity : AppCompatActivity(),\
  \ GestureDetector.OnGestureListener, GestureDetector.OnDoubleTapListener\n{\n  \
  \  var gDetector: GestureDetector? = null\n\n    override fun onCreate(savedInstanceState:\
  \ Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_common_gestures)\n\
  \        gDetector = GestureDetector(this, this)\n        gDetector?.setOnDoubleTapListener(this)\n\
  \    }\n}\n```\n\n## 35.5 实现 onTouchEvent 方法\n\n如果此时编译并运行应用程序，在设备上执行手势将没有任何反应。这是因为还没有添加代码来拦截触摸事件并将它们传递给\
  \ `GestureDetector` 实例。为了实现这一点，有必要在 Activity 类中重写`onTouchEvent()` 方法并对其实现，使其调用 `GestureDetector`\
  \ 实例的`onTouchEvent()` 方法：\n\n```kotlin\noverride fun onTouchEvent(event: MotionEvent):\
  \ Boolean {\n    gDetector?.onTouchEvent(event)\n    // 确保调用父类的实现\n    return super.onTouchEvent(event)\n\
  }\n```\n\n## 35.6 测试应用程序\n\n在物理 Android 设备或 AVD 模拟器上编译并运行应用程序。启动后，尝试滑动、按下、滚动动作以及双击和单击。注意文本视图会更新以反映事件，如图\
  \ 35-1 所示所示：\n\n![](img/Image2425.png)\n\n图 35-1\n\n## 35.7 总结\n\n用户与设备屏幕之间的任何物理接触都可以视为手势。由于缺乏传统计算机系统的物理键盘和鼠标指针，手势被广泛用作用户与应用程序之间交互的方法。虽然手势可以是任何动作序列，但确实有一套触摸设备用户非常熟悉的常用手势。通过使用\
  \ Android Gesture Detector 类，可以在应用程序中轻松检测许多所谓的“常见手势”。在本章中，我们已经从理论和示例项目实现两个概述了该技术的使用。\n\
  \n在本章涵盖了常见手势之后，下一章将介绍更广泛的手势类型，包括设计和检测自定义手势的能力。\n\n\n\n\n\n上一章涵盖了如何从 Android 内部检测所谓的“常用手势”。然而，在实践中，一个手势理论上可以涉及\
  \ Android 设备屏幕上的几乎任何触摸动作序列。考虑到这一事实，Android SDK 允许应用程序开发者定义几乎任何性质的自定义手势，并在用户执行这些手势时触发事件。这是一个多阶段的过程，其细节是本章的主题。\n\
  \n## 3.1 Android Gesture Builder 应用程序\n\nAndroid SDK 允许开发者设计自定义手势，然后这些手势会被存储在与 Android\
  \ 应用程序包（APK）捆绑的手势文件中。这些自定义手势文件最简单的创建方法是使用 Gesture Builder 应用，该应用作为 Android SDK 提供的示例包的一部分提供的。创建手势文件涉及在物理设备或模拟器上启动\
  \ Gesture Builder 应用，并在屏幕上“绘制”应用程序需要检测的手势。一旦设计好手势，就可以将包含手势数据的文件从设备或模拟器的 SD 卡中提取并添加到应用程序项目中。在应用程序代码中，该文件会被加载到\
  \ `GestureLibrary` 类的实例中，并可以用它来搜索用户在设备屏幕上执行的任何手势的匹配项。\n\n## 3.2 GestureOverlayView\
  \ 类\n\n为了方便在应用程序内检测手势，Android SDK 提供了 `GestureOverlayView` 类。这是一个透明视图，可以放置在用户界面的其他视图之上，唯一目的是为了检测手势。\n\
  \n## 3.3 检测手势\n\n手势的检测是通过加载使用 Gesture Builder 应用创建的手势文件，然后在 `GestureOverlayView`\
  \ 类的实例上注册 `GesturePerformedListener` 事件监听器来实现的。然后声明封装类实现 `OnGesturePerformedListener`\
  \ 接口以及该接口所需的 `onGesturePerformed` 回调方法。当监听器检测到手势时，Android 运行时系统会触发对 `onGesturePerformed`\
  \ 回调方法的调用。\n\n## 3.4 识别特定手势\n\n当检测到手势时，`onGesturePerformed` 回调方法会被调用，并作为参数传递检测到手势的\
  \ `GestureOverlayView` 对象的引用，以及一个包含手势信息的 `Gesture` 对象。\n\n通过访问 `Gesture` 对象，可以使用\
  \ `GestureLibrary` 将检测到的手势与之前加载到应用程序的手势文件中所包含的手势进行比较。`GestureLibrary` 通过为每个手势计算预测分，报告用户执行的手势与手势文件条目匹配的概率。通常认为预测分达到\
  \ 1.0 或更高表示文件中存储的手势与用户在设备屏幕上执行的手势之间良好匹配。\n\n## 3.5 安装并运行 Gesture Builder 应用程序\n\n\
  创建手势文件最简单的方法是使用一个可以捕捉并保存手势动作的应用程序。虽然 Google 最初提供过一个此用途的程序，但它在较新版本的 Android 上已没有得到充分维护。幸运的是，由\
  \ Manan Gandhi 开发的 Gesture Builder 应用提供了替代方案，该应用可以通过以下 URL 从 Google Play Store 获取：\n\
  \nhttps://play.google.com/store/apps/details?id=pack.GestureApp\n\n注意，该应用在运行 Android\
  \ 9.0 (API 28) 或更旧版本的设备或模拟器上运行最好。\n\n## 3.6 创建手势文件\n\n一旦加载 Gesture Builder 应用，点击设备屏幕底部的\
  \ Add 按钮，在随后的屏幕上，如图 36-1 所示，使用屏幕上的圆形动作“绘制”手势。假设手势显示如预期（由设备屏幕上的黄色线条表示），点击保存 按钮将手势添加到手势文件中，并在提示输入名称时输入“Circle\
  \ Gesture”\n\n![](img/as_3.4_gesture_builder.png\n\n图 36-1\n\n手势保存后，返回主屏幕，Gesture\
  \ Builder 应用将显示当前定义的手势列表，此时该列表将仅包含新定义的 Circle Gesture。在继续之前，使用 Test 按钮验证手势是否按预期工作。\n\
  \n## 3.7 创建示例项目\n\n从欢迎界面选择 Start a new Android Studio project 快速启动选项，在生成的新项目对话框中，在点击\
  \ Next 按钮之前选择 Empty Activity 模板。\n\n在 Name 字段中输入 `CustomGestures`，并指定 `com.ebookfrenzy.customgestures`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置更改为 API 26: Android 8.0 (Oreo)，并将 Language\
  \ 菜单改为 Kotlin。\n\n## 3.8 从 SD 卡提取手势文件\n\n由于每个手势都是在 Gesture Builder 应用中创建的，它们被添加到位于运行应用程序的模拟器或设备存储空间中的名为\
  \ `gesture.txt` 的文件中。然而，在将此文件添加到 Android Studio 项目之前，必须先从设备存储中复制并保存到本地文件系统。这最简单的方法是使用\
  \ Android Studio 的 Device File Explorer 工具窗口。通过 View -> Tool Windows -> Device File\
  \ Explorer 菜单显示此工具。显示后，从下拉菜单中选择创建手势文件的设备或模拟器，然后浏览文件系统到以下文件夹：\n\nsdcard/Android/data/pack.GestureApp/files\n\
  \n在该文件夹中找到 `gesture.txt` 文件，右键点击它，选择 Save as… 菜单选项并将文件保存到临时位置，命名为 `gestures`。\n\n\
  ![](Images/as_3.5_gestures_file_in_device_explorer.png\n\n图 36-2\n\n一旦从设备存储提取了 gestures\
  \ 文件，就可以作为资源文件添加到 Android Studio 项目中。\n\n## 3.9 将手势文件添加到项目\n\n在 Android Studio 项目窗口中，定位并右键点击\
  \ app 下 `res` 文件夹，从生成的菜单中选择 New -> Directory。在 New Directory 对话框中输入 `raw` 作为文件夹名称并点击\
  \ OK 按钮。使用适用于你操作系统的文件资源管理器，找到之前从设备存储提取的手势文件，并将其复制到项目窗口中新的 `raw` 文件夹中。\n\n## 3.10\
  \ 设计用户界面\n\n示例应用程序需要一个简单的用户界面，由一个 `LinearLayout` 视图和一个叠加在其上的 `GestureOverlayView`\
  \ 组成，用于拦截用户执行的任何手势。找到 app -> res -> layout -> activity_main.xml 文件，双击将其加载到 Layout\
  \ Editor 工具中并删除默认的 TextView 小部件。\n\n切换到布局器的 Code 模式并修改 XML 如下：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n\n    <android.gesture.GestureOverlayView\n\
  \        android:id=\"@+id/gOverlay\"\n        android:layout_width=\"0dp\"\n  \
  \      android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n\n\n\n\
  \n```xml\n          app:layout_constraintEnd_toEndOf=\"parent\"\n          app:layout_constraintStart_toStartOf=\"\
  parent\"\n          app:layout_constraintTop_toTopOf=\"parent\" />\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n## 36.11 加载手势文件\n\n现在手势文件已添加到项目中，下一步是编写一些代码，以便在活动启动时加载该文件。为了本项目的目的，实现此目的的代码将添加到位于\
  \ `MainActivity.kt` 源文件的 `MainActivity` 类中，如下：\n\n```kotlin\npackage com.ebookfrenzy.customgestures\n\
  \nimport androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\nimport\
  \ android.gesture.GestureLibraries\nimport android.gesture.GestureLibrary\nimport\
  \ android.gesture.GestureOverlayView\nimport android.gesture.GestureOverlayView.OnGesturePerformedListener\n\
  import kotlinx.android.synthetic.main.activity_main.*\n\nclass MainActivity : AppCompatActivity(),\
  \ OnGesturePerformedListener {\n\n    var gLibrary: GestureLibrary? = null\n\n \
  \   override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n\
  \        setContentView(R.layout.activity_custom_gestures)\n        gestureSetup()\n\
  \    }\n\n    private fun gestureSetup() {\n        gLibrary = GestureLibraries.fromRawResource(this,\n\
  \            R.raw.gestures)\n        if (gLibrary?.load() == false) {\n       \
  \     finish()\n        }\n    }\n}\n```\n\n除了一些必要的导入指令外，上述代码还创建了一个名为 `gLibrary`\
  \ 的 `GestureLibrary` 实例，然后将位于 raw 资源文件夹的手势文件内容加载其中。活动类也已修改以实现 `OnGesturePerformedListener`\
  \ 接口，这要求实现 `onGesturePerformed` 回调方法（该方法将在章的后续部分创建）。\n\n## 36.12 注册事件监听器\n\n为了让活动能够接收用户在屏幕上执行手势的通知，必须按照如下代码片段所示注册\
  \ `OnGesturePerformedListener` 事件监听器：\n\n```kotlin\nprivate fun gestureSetup() {\n\
  \    gLibrary = GestureLibraries.fromRawResource(this,\n        R.raw.gesture)\n\
  \    if (gLibrary?.load() == false) {\n        finish()\n    }\n    gOverlay.addOnGesturePerformedListener(this)\n\
  }\n```\n\n## 36.13 实现 onGesturePerformed 方法\n\n在对应用程序进行首次运行之前，剩下的工作就是实现 `onGesturePerformed`\
  \ 回调方法。当在 `GestureOverlayView` 实例上执行手势时，就会调用此方法：\n\n```kotlin\npackage com.ebookfrenzy.customgestures\n\
  \nimport androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\nimport\
  \ android.gesture.GestureLibraries\nimport android.gesture.GestureLibrary\nimport\
  \ android.gesture.GestureOverlayView\nimport android.gesture.GestureOverlayView.OnGesturePerformedListener\n\
  import android.widget.Toast\nimport android.gesture.Gesture\nimport kotlinx.android.synthetic.main.activity_main.*\n\
  \nclass MainActivity : AppCompatActivity(), OnGesturePerformedListener {\n\n   \
  \ override fun onGesturePerformed(overlay: GestureOverlayView,\n               \
  \                     gesture: Gesture) {\n        val predictions = gLibrary?.recognize(gesture)\n\
  \        predictions?.let {\n            if (it.size > 0 && it[0].score > 1.0) {\n\
  \                val action = it[0].name\n                Toast.makeText(this, action,\
  \ Toast.LENGTH_SHORT).show()\n            }\n        }\n    }\n}\n```\n\n## 36.14\
  \ 测试应用程序\n\n在模拟器或物理设备上构建并运行应用程序，执行手势。注意，当手势被识别时，它会在屏幕上用亮黄色轮勒显示，而覆盖层不确定的手势则显示为淡黄色。这在开发期间很有用，但可能并不理想。\n\
  \n## 36.15 配置 GestureOverlayView\n\n默认情况下，`GestureOverlayView` 被配置为显示黄色线条。用于绘制识别和未识别手势的颜色可以通过\
  \ `android:gestureColor` 和 `android:uncertainGestureColor` 属性定义。例如，要隐藏手势线条，请如下修改\
  \ `activity_main.xml` 文件：\n\n```xml\n<android.gesture.GestureOverlayView\n    android:id=\"\
  @+id/gOverlay\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    android:gestureColor=\"#0000000\"\n    android:uncertainGestureColor=\"\
  #0000000\" />\n```\n\n重新运行应用程序后，手势应该是不可见的（因为它们在 `LinearLayout` 视图的背景上以白色绘制）。\n\n\
  ## 36.16 拦截手势\n\n如前所述，`GestureOverlayView` 是一个可以位于其他视图之上的透明覆盖层。这引出了问题：当手势被识别后，由覆盖层拦截的事件是否应该传递给底层视图？这通过\
  \ `GestureOverlayView` 实例的 `android:eventsInterceptionEnabled` 进行控制。当设置为 `true`\
  \ 时，识别出手势时手势事件不会传递给底层视图。当手势在可能配置滚动的视图上执行时，此设置可能特别有用。\n\n## 36.17 检测缩放手势\n\n在离开通用触摸处理和特别是手势识别之前，本章的最后一个主题是处理缩放手势。虽然可以使用本章之前节所述的步骤创建并检测各种手势，但实际上，使用目前为止讨论的技术无法检测缩放手势（即使用两个手指进行伸展和捏合动作，通常用于放大或缩小视图或图像）。\n\
  \n\n\n\n检测缩放手势最简单的方法是使用 Android 的 `ScaleGestureDetector` 类。通常来说，检测缩放手势涉及以下三个步骤：\n\
  \n1. 声明一个实现 `SimpleOnScaleGestureListener` 接口的新类，其中包含所需的 `onScale()`、`onScaleBegin()`\
  \ 和 `onScaleEnd()` 回调方法。\n2. 创建 `ScaleGestureDetector` 类的实例，并将步骤 1 中创建的类实例作为参数传递进去。\n\
  3. 在外层的的 activity 中实现 `onTouchEvent()` 回调方法，该方法反过来调用 `ScaleGestureDetector` 类的 `onTouchEvent()`\
  \ 方法。\n\n在本章的剩余部分中，我们将创建一个非常简单的示例，用于演示缩放手势识别的实现。\n\n## 36.18 缩放手势示例项目\n\n从欢迎界面选择\
  \ `Start a new Android Studio project` 快速启动选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Empty\
  \ Activity` 模板。\n\n在 `Name` 字段中输入 `PinchExample` 并指定 `com.ebookfrenzy.pinchexample`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单改为 `Kotlin`。\n\n在 `activity_main.xml` 文件中，选择默认的 `TextView` 对象并使用\
  \ `Attributes` 工具窗口将 `ID` 设置为 `myTextView`。\n\n找到并加载 `MainActivity.kt` 文件到 Android\
  \ Studio 编辑器并按如下 own 修改文件：\n\n```kotlin\npackage com.ebookfrenzy.pinchexample\n\n\
  import androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\nimport\
  \ android.view.MotionEvent\nimport android.view.ScaleGestureDetector\nimport android.view.ScaleGestureDetector.SimpleOnScaleGestureListener\n\
  import kotlinx.android.synthetic.main.activity_main.*\n\nclass MainActivity : AppCompatActivity()\
  \ {\n\n    var scaleGestureDetector: ScaleGestureDetector? = null\n\n    override\
  \ fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n\
  \        setContentView(R.layout.activity_main)\n        scaleGestureDetector =\
  \ ScaleGestureDetector(this,\n            MyOnScaleGestureListener())\n    }\n\n\
  \    override fun onTouchEvent(event: MotionEvent): Boolean {\n        scaleGestureDetector?.onTouchEvent(event)\n\
  \        return true\n    }\n\n    inner class MyOnScaleGestureListener : SimpleOnScaleGestureListener()\
  \ {\n\n        override fun onScale(detector: ScaleGestureDetector): Boolean {\n\
  \            val scaleFactor = detector.scaleFactor\n            if (scaleFactor\
  \ > 1) {\n                myTextView.text = \"Zooming Out\"\n            } else\
  \ {\n                myTextView.text = \"Zooming In\"\n            }\n         \
  \   return true\n        }\n\n        override fun onScaleBegin(detector: ScaleGestureDetector):\
  \ Boolean {\n            return true\n        }\n\n        override fun onScaleEnd(detector:\
  \ ScaleGestureDetector) {\n        }\n    }\n}\n```\n\n该代码声明了一个名为 `MyOnScaleGestureListener`\
  \ 的新类，它扩展了 Android 的 `SimpleOnScaleGestureListener` 类。该接口要求实现三个方法（`onScale()`、`onScaleBegin()`\
  \ 和 `onScaleEnd()`）。在此实例中，`onScale()` 方法识别比例因子并在视图上显示消息，指示检测到的缩放手势类型。\n\n在 `onCreate()`\
  \ 方法中创建了一个新的 `ScaleGestureDetector` 实例，并将外层 activity 的引用和我们新类 `MyOnScaleGestureListener`\
  \ 的实例作为参数传递。最后，为 activity 实现 `onTouchEvent()` 回调方法，它简单地调用 `ScaleGestureDetector`\
  \ 对象对应的 `onTouchEvent()` 方法，并将 `MotionEvent` 对象作为参数传递。\n\n在模拟器或物理 Android 设备上编译并运行应用程序，然后在屏幕上执行缩放手势。\n\
  \n# 37. Fragments 简介\n\n随着你对本书章节的不断学习，你会发现 Android 系统背后的许多设计概念在构思时目标就是复用。本章将探讨的这样一个领域涉及\
  \ Fragments。本章将从 Fragment 是什么以及如何使用它们方面提供基础知识的概述。\n\n## 37.1 什么是 Fragment？\n\nFragment\
  \ 是应用程序界面的一个自包含、模块化部分及其相应的行为，可以嵌入到 activity 中。Fragment 可以在设计阶段组合以创建一个 activity，并在运行时添加到或从\
  \ activity 中移除。Fragment 只能作为 activity 的一部分使用，不能作为独立元素实例化。尽管如此，一个 fragment 可以被视为一个“子活动”，它具有与完整\
  \ activity 相似的生命周期。Fragment 存储为 XML 布局文件的形式，可以通过在 activity 的布局文件中放置 `<fragment>`\
  \ 元素，或者直接通过 activity 类中的代码将其添加到 activity 中。\n\n## 37.2 创建 Fragment\n\n构成 fragment\
  \ 的两个组件是一个 XML 布局文件和一个对应的 Kotlin 类。fragment 的 XML 布局文件格式与任何其他 activity 布局相同，并且可以包含布局管理器和视图的任何组合和复杂度。例如，下面的\
  \ XML 布局用于一个仅由带有红色背景且包含单个 `TextView` 的 `RelativeLayout` 组成的 fragment：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<RelativeLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:background=\"@color/red\" >\n\n    <TextView\n        android:id=\"\
  @+id/textView1\"\n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:layout_centerHorizontal=\"true\"\n        android:layout_centerVertical=\"\
  true\"\n        android:text=\"@string/fragone_label_text\"\n        android:textAppearance=\"\
  ?android:attr/textAppearanceLarge\" />\n</RelativeLayout>\n```\n\n\n\n\n与布局对应的类\
  \ 必须是 `Fragment` 类的子类。该类至少应该重写 `onCreateView()` 方法，该方法负责加载 fragment 布局。例如：\n\n```kotlin\n\
  package com.example.myfragmentdemo\n\nimport android.os.Bundle\nimport android.view.LayoutInflater\n\
  import android.view.View\nimport android.view.ViewGroup\nimport androidx.fragment.app.Fragment\n\
  \nclass FragmentOne : Fragment() {\n    override fun onCreateView(inflater: LayoutInflater?,\n\
  \             container: ViewGroup?, savedInstanceState: Bundle?): View? {\n   \
  \     // 加载此 fragment 的布局\n        return inflater?.inflate(R.layout.activity_fragment_demo,\n\
  \            container, false)\n    }\n}\n```\n\n除了 `onCreateView()` 方法外，该类还可以重写标准的生命周期方法。\n\
  \n一旦创建了 fragment 布局和类，fragment 就可以在应用程序的活动中使用。\n\n## 37.3 使用布局 XML 文件向 Activity\
  \ 添加 Fragment\n\n可以通过编写 Kotlin 代码或将 fragment 嵌入到 activity 的 XML 布局文件中将其纳入活动。无论使用哪种方法，需要注意的关键点是：当使用支持库来兼容旧版本的\
  \ Android 发布时，任何使用 fragment 的 activity 必须实现为 `FragmentActivity` 的子类，而不是 `AppCompatActivity`\
  \ 类：\n\n```kotlin\npackage com.example.myFragmentDemo\n\nimport androidx.fragment.app.FragmentActivity\n\
  import android.os.Bundle\n\nclass MainActivity : FragmentActivity() {\n    override\
  \ fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n\
  \        setContentView(R.layout.activity_fragment_example)\n    }\n}\n```\n\nfragment\
  \ 使用 `<fragment>` 元素嵌入到 activity 布局文件中。下面的示例布局将本章上一节创建的 fragment 嵌入到 activity 布局中：\n\
  \n```xml\n<RelativeLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\">\n    <fragment\n        android:id=\"@+id/fragment_one\"\n    \
  \    android:name=\"com.example.myfragmentdemo.myfragmentdemo.FragmentOne\"\n  \
  \      android:layout_width=\"match_parent\"\n        android:layout_height=\"wrap_content\"\
  \n        android:layout_alignParentLeft=\"true\"\n        android:layout_centerVertical=\"\
  true\"\n        tools:layout=\"@layout/fragment_one_layout\" />\n</RelativeLayout>\n\
  ```\n\n`<fragment>` 元素中的关键属性是 `android:name`（它必须引用与 fragment 关联的类）以及 `tools:layout`（引用包含\
  \ fragment 布局的 XML 资源文件）。\n\n一旦添加到 activity 的布局，就可以在 Android Studio Layout Editor\
  \ 工具中查看和操作 fragment。例如，图 37-1 显示了 Android Studio Layout Editor 中带有嵌入 fragment 的布局：\n\
  \n![](img/Image24251.png)\n\n图 37-1\n\n## 37.4 在代码中添加和管理 Fragment\n\n通过 activity\
  \ 的 XML 布局文件向活动添加 fragment 虽然方便，但代价是活动在运行时无法移除 fragment。为了在运行时对 fragment 实现完全动态控制，必须通过代码添加这些活动。这种方法的优点是，可以在应用程序运行期间动态地添加、移除甚至让\
  \ fragment 相互替换。\n\n使用代码管理 fragment 时，fragment 本身仍然由一个 XML 布局文件和一个相应的类组成。区别在于在宿活动内部操作\
  \ fragment。使用代码向活动添加 fragment 时，有一套标准的步骤序列：\n\n1. 创建 fragment 类的实例。\n2. 将任何额外的 intent\
  \ 参数传递给该类实例。\n3. 获取 fragment manager 实例的引用。\n4. 在 fragment manager 实例上调用 `beginTransaction()`\
  \ 方法。这将返回一个 fragment 事务实例。\n5. 调用 fragment 事务实例的 `add()` 方法，并将要包含 fragment 的视图资源\
  \ ID 作为参数传递。\n6. 调用 `commit()` 方法。\n\n例如，下面的代码添加了一个 fragment：\n\n```kotlin\nval\
  \ firstFragment = FragmentOne()\nfirstFragment.arguments = intent\nval transaction\
  \ = supportManager.beginTransaction()\ntransaction.add(R.id.LinearLayout1, firstFragment)\n\
  transaction.commit()\n```\n\n上面的代码为了清晰起见将每一步拆分为单独语句。然而，最后四行可以缩写为一行代码：\n\n```kotlin\n\
  supportFragmentManager.beginTransaction().add(R.id.LinearLayout1, firstFragment).commit()\n\
  ```\n\n一旦添加到容器中，随后可以通过调用 fragment 事务实例的 `remove()` 方法来移除 fragment，并传递要移除 fragment\
  \ 的引用：\n\n```kotlin\ntransaction.remove(firstFragment)\n```\n\n同样，可以通过调用 fragment\
  \ 事务实例的 `replace()` 方法用一个 fragment 替换另一个。该方法的参数是包含 fragment 的视图 ID 和新的 fragment。被替换的\
  \ fragment 也可以放在所谓的返回栈（back stack）中，以便在用户返回时可以快速恢复。这通过在调用 `commit()` 之前调用 fragment\
  \ 事务的 `addToBackStack()` 方法来实现：\n\n```kotlin\nval secondFragment = FragmentTwo()\n\
  transaction.replace(R.id.LinearLayout1, secondFragment)\ntransaction.addToBackStack(null)\n\
  transaction.commit()\n```\n\n## 37.5 处理 Fragment 事件\n\n如前，fragment 非常像一个拥有自己的布局、类和生命周期的子活动。fragment\
  \ 内部的视图（如按钮和文本视图）能够像普通活动一样生成事件。这引发了一个问题：谁接收事件？是 fragment 本身还是嵌入它的活动？答案取决于事件处理程序的声明方式。\n\
  \n在 Android 事件处理概述与示例章节中，讨论了两种事件处理方法。第一种是在活动代码中配置事件监听器和回调方法。例如：\n\n```kotlin\nbutton.setOnClickListener\
  \ { // 点击按钮时执行的代码 }\n```\n\n在拦截点击事件的情况下，第二种方法是在 XML 布局文件中设置 `android:onClick` 属性：\n\
  \n```xml\n<Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:onClick=\"\
  onClick\"\n    android:text=\"Click me\" />\n```\n\nfragment 视图生成的事件的通用规则是：如果使用事件监听器和回调方法在\
  \ fragment 类中声明了监听器，则事件将首先由 fragment 处理。然而，如果使用了 `android:onClick` 资源，事件将直接传递给包含该\
  \ fragment 的活动。\n\n## 37.6 实现 fragment 间通信\n\n\n\n\n一旦一个或多个片段被嵌入活动中，很可能需要在片段与活动之间、以及片段与片段之间进行某种形式的通信。事实上，良好的做法要求片段之间不要直接相互通信。所有的通信都应该通过封装它们的活动进行。\n\
  \n为了让活动与片段进行通信，活动必须通过分配给片段的 ID 来识别片段对象。一旦获取了该引用，活动就可以简单调用片段对象的公共方法。\n\n反方向的通信（从片段到活动）则稍微复杂一些。首先，片段必须定义一个监听器接口，然后在活动类中实现该接口。例如，以下代码在类名为\
  \ `ToolbarFragment` 的片段类上声明了一个名为 `ToolbarListener` 的接口。代码还声明了一个变量，稍后将存储对活动的引用：\n\
  \n```kotlin\nclass ToolbarFragment : Fragment() {\n\n    var activityCallback: ToolbarFragment.ToolbarListener?\
  \ = null\n\n    interface ToolbarListener {\n        fun onButtonClick(fontsize:\
  \ Int, text: String)\n    }\n}\n```\n\n上述代码规定，任何实现 `ToolbarListener` 接口的类都必须实现名为\
  \ `onButtonClick` 的回调方法，该方法接受一个整数和一个 `String` 作为参数。\n\n接下来，需要重写并实现片段类的 `onAttach()`\
  \ 方法。当片段初始化并与活动关联时，Android 系统会自动调用此方法。该方法会接收包含该片段的活动引用。该方法必须存储对该活动的本地引用，并验证它实现了\
  \ `ToolbarListener` 接口：\n\n```kotlin\noverride fun onAttach(context: Context?) {\n\
  \    super.onAttach(context)\n    try {\n        activityCallback = context as ToolbarListener\n\
  \    } catch (e: ClassCastException) {\n        throw ClassCastException(context?.toString()\n\
  \            + \" must implement ToolbarListener\")\n    }\n}\n```\n\n执行此示例后，活动的引用将存储在本地变量\
  \ `activityCallback` 中，如果该活动没有实现 `ToolbarListener` 接口，则会抛出异常。\n\n下一步是从片段内部调用活动的回调方法。何时以及如何发生这种情况完全完全取决于片段需要联系活动的情况。例如，以下代码在按钮被点击时调用活动的回调方法：\n\
  \n```kotlin\noverride fun onButtonClick(arg1: Int, arg2: String) {\n    activityCallback.onButtonClick(arg1,\
  \ arg2)\n}\n```\n\n剩下的就是修改活动类，使其实现 `ToolbarListener` 接口。例如：\n\n```kotlin\nclass\
  \ MainActivity : FragmentActivity(),\n    ToolbarFragment.ToolbarListener {\n\n\
  \    override fun onButtonClick(arg1: Int, arg2: String) {\n        // 实现回调方法的代码\n\
  \    }\n}\n```\n\n从上面的代码中看到，活动声明了它实现了 `ToolbarFragment` 类的 `ToolbarListener` 接口，然后按照接口的要求实现了\
  \ `onButtonClick()` 方法。\n\n## 37.7 总结\n\n片段为创建可重用的用户界面布局和应用行为模块提供了一种强大的机制，这些模块一旦创建，就可以嵌入到活动中。片段可以通过将片段添加到活动的布局文件中，或者通过编写代码在运行时管理片段，从而在活动中使用片段。通过代码添加到活动中的片段可以在运行时动态地移除和替换。片段之间的所有通信都应该通过片段所嵌入的活动进行。\n\
  \n在本章涵盖了片段的基础知识后，下一章将通过一个教程，旨在强化本章概述的技术。\n\n# 38. 在 Android Studio 中使用片段 - 示例\n\n\
  如上一章所述，片段为创建包含用户界面部分部分和相应行为的应用功能可重用模块提供了一种方便的机制。一旦创建，片段就可以嵌入到活动中。\n\n在上一章探索了片段的整体理论后，本章的目标是使用\
  \ Android Studio 创建一个 Android 应用程序示例，演示创建和使用片段的实际步骤，并实现活动内片段与片段之间的通信。\n\n## 38.1\
  \ 关于示例片段应用程序\n\n在本章创建的应用程序将由单个活动和两个片段组成。第一个片段的用户界面将包含某种工具栏，由 `EditText` 视图、`SeekBar`\
  \ 和 `Button` 组成，所有元素都包含在一个 `RelativeLayout` 视图中。第二个片段将仅包含一个 `TextView` 对象，同样包含在一个\
  \ `RelativeLayout` 视图中。\n\n这两个片段将嵌入应用程序的主活动中，并实现如下通信：当第一个片段中的按钮被按下时，输入到 `EditText`\
  \ 视图中的文本将显示在第二个片段的 `TextView` 上，字体大小由第一个片段中 `SeekBar` 的位置决定。\n\n由于此应用程序旨在在较早版本的\
  \ Android 上运行，因此还需要使用 Android 支撑库。\n\n## 38.2 创建项目\n\n从欢迎界面选择 `Start new Android\
  \ project`（新建 Android 项目），并在生成的项目对话框中，选择 `Empty Activity` 模板。在 `Name` 字段中输入 `Example`，并指定\
  \ `com.ebookrenzy.fragment` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API` 级别更改为 `26: Android\
  \ 8.0 (Oreo)`，并将 `Language`（语言）菜单改为 `Kotlin`。\n\n### 38.3 创建第一个片段布局\n\n下一步是为活动中的第一个片段创建用户界面。此用户界面无疑存在于\
  \ XML 布局文件中，因此首先导航到项目窗口中 `app -> res` 下的 `layout` 文件夹。找到后，右键点击布局条目并选择 `New -> Layout\
  \ resource file`。\n\n在生成的对话框中，将布局命名为 `toolbar_fragment`，并在点击 `OK` 创建新资源文件之前将根元素更改为\
  \ `RelativeLayout`。\n\n新资源文件将出现在布局编辑器中，准备好进行设计。将布局编辑器切换到 `Code` 模式，并按照所示修改 XML，向布局中添加三个视图元素：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<RelativeLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\">\n\n    <Button\n        android:id=\"\
  @+id/button1\"\n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:layout_below=\"@+id/seekBar1\"\n        android:layout_centerHorizontal=\"\
  true\"\n        android:layout_marginTop=\"17dp\"\n        android:text=\"Change\
  \ Text\" />\n\n    <EditText\n        android:id=\"@+id/editText1\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:layout_alignParentTop=\"\
  true\"\n        android:layout_centerHorizontal=\"true\"\n        android:layout_marginTop=\"\
  16dp\"\n        android:ems=\"10\" />\n\n</RelativeLayout>\n```\n\n\n\n\n```xml\n\
  \        android:inputType=\"text\" >\n\n        <requestFocus />\n\n    </EditText>\n\
  \    <SeekBar\n        android:id=\"@+id/seekBar1\"\n        android:layout_width=\"\
  match_parent\"\n        android:layout_height=\"wrap_content\"\n        android:layout_alignParentStart=\"\
  true\"\n        android:layout_below=\"@+id/editText1\"\n        android:layout_marginTop=\"\
  14dp\" />\n</RelativeLayout>\n```\n\n完成更改后，将布局编辑器（Layout Editor）工具切换回设计（Design）模式，并点击设计区域右上角的警告按钮。选择硬编码文本警告，点击修复（Fix）按钮并将字符串分配给名为\
  \ `change_text` 的资源。\n\n完成这些步骤后，用户界面布局应该类似于图 38-2 所示：\n\n![](img/as_3.6_fragment_example_toolbar_ui.png)\n\
  \n图 38-2\n\n第一个片段（fragment）的布局实现后，下一步是创建一个与之对应的类。\n\n### 38.4 创建第一个片段类\n\n除了用户界面布局外，片段还需要一个关联的类来执行后台的实际工作。在\
  \ Project 工具窗口中展开 `app` -> `java` 文件夹，并右键点击项目创建时指定的包名（在本例中为 `com.ebookfrenzy.fragmentexample`），为项目添加一个为此目的的类。从弹出的菜单中，选择\
  \ `New` -> `Kotlin File/Class` 选项。在弹出的对话框中，将类命名为 `ToolbarFragment`，从列表中选择 `Class`\
  \ 并按下键盘上的回车键（Return）以创建新类。\n\n类创建后，它默认会出现在编辑面板中，内容如下：\n\n```kotlin\npackage com.ebookfrenzy.fragmentexample\n\
  \nclass ToolbarFragment {\n\n}\n```\n\n目前，对该类的更改只是添加了一些导入指令（import directives），并重写\
  \ `onCreateView()` 方法，以确保在活动中使用该片段时布局文件能够被加载（inflate）并显示。类声明还需要指示该类扩展了 `Android\
  \ Fragment` 类：\n\n```kotlin\npackage com.ebookfrenzy.fragmentexample\n\nimport android.os.Bundle\n\
  import android.view.LayoutInflater\nimport android.view.View\nimport android.view.ViewGroup\n\
  import androidx.fragment.app.Fragment\nimport android.widget.Button\n\nclass ToolbarFragment\
  \ : Fragment() {\n\n    override fun onCreateView(inflater: LayoutInflater,\n  \
  \                           container: ViewGroup?,\n                           \
  \  savedInstanceState: Bundle?): View? {\n        // 加载此片段的布局\n        val view\
  \ = inflater.inflate(R.layout.toolbar_fragment,\n                             container,\
  \ false)\n        return view\n    }\n}\n```\n\n在本章稍后的后的部分，将向此类添加更多功能。在此之前，我们需要创建第二个片段。\n\
  \n## 38.5 创建第二个片段布局\n\n向项目添加第二个新的 Android XML 布局资源文件，再次选择 `RelativeLayout` 作为根元素。将布局命名为\
  \ `text_fragment` 并点击确定。当布局加载到布局编辑器工具时，切换到代码（Code）模式并修改 XML 为片段布局中添加一个 `TextView`，如下：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<RelativeLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\">\n    <TextView\n        android:id=\"\
  @+id/textView1\"\n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:layout_centerHorizontal=\"true\"\n        android:layout_centerVertical=\"\
  true\"\n        android:text=\"Fragment\"\n        android:textSize=\"18sp\" />\n\
  </RelativeLayout>\n```\n*(注：原文中提供的 XML 片段不完整，此处根据上下文逻辑进行了必要的补全排版以保持结构清晰)*\n\n\n\n\
  \n当用户点击工具栏片段（toolbar fragment）中的按钮时，该片段类需要从 `EditText` 视图获取文本以及 `SeekBar` 的当前值，并将它们发送到文本片段。如“Android\
  \ Fragments 简介”所示概述，片段之间不应直接通信，而应该使用它们嵌入的 activity 作为中介。\n\n此过程的第一步是确保工具栏片段对按钮点击有响应。我们还需要实现一些代码来跟踪\
  \ `SeekBar` 视图的值。为了本示例的演示，我们将在 `ToolbarFragment` 类中实现这些监听器。选择 `ToolbarFragment.kt`\
  \ 文件并进行修改，使其内容如下列表所示：\n\n```kotlin\npackage com.ebookfrenzy.fragmentexample\n\n\
  import android.os.Bundle\nimport androidx.fragment.app.Fragment\nimport android.view.LayoutInflater\n\
  import android.view.View\nimport android.view.ViewGroup\nimport android.widget.Button\n\
  import android.widget.SeekBar\nimport android.content.Context\nimport kotlinx.android.synthetic.main.toolbar_fragment.*\n\
  \nclass ToolbarFragment : Fragment(), SeekBar.OnSeekBarChangeListener {\n\n    var\
  \ seekvalue = 10\n\n    override fun onCreateView(inflater: LayoutInflater,\n  \
  \        container: ViewGroup?, savedInstanceState: Bundle?): View? {\n        //\
  \ Inflate the layout for this fragment\n        val view = inflater?.inflate(R.layout.toolbar_fragment,\n\
  \              container, false)\n        val seekBar: SeekBar? = view?.findViewById(R.id.seekBar1)\n\
  \        val button: Button? = view?.findViewById(R.id.button1)\n        seekBar?.setOnSeekBarChangeListener(this)\n\
  \        button?.setOnClickListener { v: View -> buttonClicked(v) }\n        return\
  \ view\n    }\n\n    private fun buttonClicked(view: View) {\n    }\n\n    override\
  \ fun onProgressChanged(seekBar: SeekBar, progress: Int,\n                     \
  \                fromUser: Boolean) {\n        seekvalue = progress\n    }\n\n \
  \   override fun onStartTrackingTouch(arg0: SeekBar) {\n    }\n\n    override fun\
  \ onStopTrackingTouch(arg0: SeekBar) {\n    }\n}\n```\n\n在继续之前，我们需要花时间来解释上述代码更改。首先，该类被声明实现了\
  \ `OnSeekBarChangeListener` 接口。这是因为用户界面包含一个 `SeekBar` 实例，片段需要在用户滑动滑条更改字体大小时接收通知。实现\
  \ `OnSeekBarChangeListener` 接口要求实现 `onProgressChanged()`、`onStartTrackingTouch()`\
  \ 和 `onStopTrackingTouch()` 方法。这些方法已经实现，但实际上只需要 `onProgressChanged()` 方法来执行任务，在本例中，即是将新值存储在名为\
  \ `seekvalue` 的变量中，该变量在类开头已声明。还声明了一个变量用于存储 `EditText` 对象的引用。\n\n`onCreateView()`\
  \ 方法已通过修改，在按钮上设置了 `onClickListener`，配置为检测到点击事件时调用名为 `buttonClicked()` 的方法。该方法随后也被实现，尽管在此时它没有执行任何操作。\n\
  \n此过程的下一阶段是设置监听器，允许片段在按钮被点击时调用 activity。这遵循了一章中概述的机制：\n\n```kotlin\nclass ToolbarFragment\
  \ : Fragment(), SeekBar.OnSeekBarChangeListener {\n\n    var seekvalue = 10\n  \
  \  var activityCallback: ToolbarFragment.ToolbarListener? = null\n\n    interface\
  \ ToolbarListener {\n        fun onButtonClick(position: Int, text: String)\n  \
  \  }\n\n    override fun onAttach(context: Context) {\n        super.onAttach(context)\n\
  \        try {\n            activityCallback = context as ToolbarListener\n    \
  \    } catch (e: ClassCastException) {\n            throw ClassCastException(context.toString()\
  \ + \" must implement ToolbarListener\")\n        }\n    }\n\n    override fun onCreateView(inflater:\
  \ LayoutInflater,\n          container: ViewGroup?, savedInstanceState: Bundle?):\
  \ View? {\n        seekBar.setOnSeekBarChangeListener(this)\n        button.setOnClickListener\
  \ { v: View -> buttonClicked(v) }\n        // Inflate the layout for this fragment\n\
  \        return inflater?.inflate(R.layout.toolbar_fragment,\n          container,\
  \ false)\n    }\n\n    private fun buttonClicked(view: View) {\n        activityCallback?.onButtonClick(seekvalue,\n\
  \          editText.text.toString())\n    }\n}\n```\n\n上述实现将在按钮被点击时，在 activity 类中产生一个名为\
  \ `onButtonClick()` 的方法。因此，剩下的工作是声明 activity 类实现了新创建的 `ToolbarListener` 接口并实现 `onButtonClick()`\
  \ 方法。\n\n由于早期版本使用了 Android Support Library 进行支持，activity 也需要更改为子类 `FragmentActivity`\
  \ 而不是 `AppCompatActivity`。将这些要求整合在下面的 `MainActivity.kt` 文件中：\n\n```kotlin\npackage\
  \ com.ebookfrenzy.fragmentexample\nimport androidx.appcompat.app.AppCompatActivity\n\
  import androidx.fragment.app.FragmentActivity\nimport android.os.Bundle\n\nclass\
  \ MainActivity : FragmentActivity(),\n      ToolbarFragment.ToolbarListener {\n\
  \    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n\
  \        setContentView(R.layout.activity_fragment_example)\n    }\n    override\
  \ fun onButtonClick(fontsize: Int, text: String) {\n    }\n}\n```\n\n按照目前的代码更改，工具栏片段将检测用户何时点击按钮，并调用\
  \ activity 上的方法，传递 `EditText` 字段的内容和 `SeekBar` 视图的当前设置。现在是 activity 与文本片段通信并传递这些值的工作，以便片段更新\
  \ `TextView` 对象。\n\n### 38.8 让 Activity 与文本片段\n\n如“Android Fragments 简介”所示，activity\
  \ 可以通过获取片段实例的引用并调用其上的公共方法来与片段通信。因此，我们现在 `TextFragment` 类中实现一个名为 `changeTextProperties()`\
  \ 的公共方法，该方法接收一个用于字号整数和一个用于新文本的字符串。该方法将使用这些值来修改 `TextView` 对象。在 Android Studio 编辑面板中，找到并修改\
  \ `TextFragment.kt` 文件，添加此新方法，并在 `onCreateView()` 方法中添加获取 `TextView` 对象 ID 的代码：\n\
  \n```kotlin\npackage com.ebookfrenzy.fragmentexample\n\nimport android.os.Bundle\n\
  import android.support.v4.app.Fragment\nimport android.view.LayoutInflater\nimport\
  \ android.view.View\nimport android.view.ViewGroup\nimport androidx.fragment.app.Fragment\n\
  import kotlinx.android.synthetic.main.text_fragment.*\n\nclass TextFragment : Fragment()\
  \ {\n    override fun onCreateView(inflater: LayoutInflater?,\n          container:\
  \ ViewGroup?,\n          savedInstanceState: Bundle?): View? {\n        return inflater?.inflate(R.layout.text_fragment,\n\
  \          container, false)\n    }\n\n    fun changeTextProperties(fontsize: Int,\
  \ text: String) {\n        textView1.textSize = fontsize.toFloat()\n        textView1.text\
  \ = text\n    }\n}\n```\n\n\n\n\n\n当 `TextFragment` 碎片放置在活的布局中时，它被赋予了 ID `text_fragment`。通过此\
  \ ID，活动现在可以获取碎片实例的引用，并调用对象上的 `changeTextProperties()` 方法。编辑 `MainActivity.kt` 文件并修改\
  \ `onButtonClick()` 方法如下：\n\n```kotlin\noverride fun onButtonClick(fontsize: Int,\
  \ text: String) {\n    val textFragment = supportFragmentManager.findFragmentById(R.id.text_fragment)\
  \ as TextFragment\n    textFragment.changeTextProperties(fontsize, text)\n}\n```\n\
  \n## 38.9 测试应用程序\n\n现在该项目的编码工作已经完成，最后一个剩余任务是运行应用程序。当应用程序启动时，主活动将启动，并创建且显示两个碎片。当用户触摸工具栏碎片中的按钮时，工具栏碎片会调用\
  \ get 的 `onButtonClick()` 方法，并传递来自 `EditText` 视图的文本和 `SeekBar` 的当前值。随后活动将调用第二个碎片的\
  \ `changeTextProperties()` 方法，该方法将修改 `TextView` 以反映新的文本和字体大小：\n\n![](img/as_3.6_fragment_example_running.png)\n\
  \n图 38-8\n\n## 38.10 总结\n\n本章的目标是完成一个示例项目的创建，专门用于演示在 Android 应用程序中使用碎片的步骤。涵盖的主题包括使用\
  \ Android Support Library 以兼容在引入碎片之前的 Android 版本、在活动布局中包含碎片，以及实现碎片间的通信。\n\n## 39.\
  \ 使用 Jetpack 的现代 Android 应用架构\n\n直到最近，Google 并没有推荐一种构建 Android 应用程序的特定方法，而是提供工具和开发包，让开发者自行决定哪种方法最适合特定的项目或个人编程风格。这种情况在\
  \ 2017 年随着 Android Architecture Components 的引入而发生了改变，这些组件在 2018 年发布时成为了 Android\
  \ Jetpack 的一部分。\n\n本章的目的是提供 Jetpack 概念、Android 应用架构建议以及一些关键架构组件的概述。在涵盖基础知识后，这些主题将在后续章节进行更详细的讨论，并通过实际示例进行演示。\n\
  \n### 39.1 什么是 Android Jetpack？\n\nAndroid Jetpack 由 Android Studio、Android Architecture\
  \ Components 和 Android Support Library，以及一组建议 Android App 应该结构的指南组成。Android Architecture\
  \ Components 的设计旨在使开发 Android 应用时执行常用任务更快、更简单，同时也符合架构指南的核心原则。\n\n虽然本书将涵盖所有的 Android\
  \ Architecture Components，但本章的目标是介绍关键架构指南以及 `ViewModel`、`LiveData`、`Lifecycle` 组件，同时介绍数据绑定（Data\
  \ Binding）和仓库（Repositories）的使用。\n\n在继续之前，理解 Jetpack 应用开发方法并非强制性的这一点非常重要。尽管强调了一些多年来流行的其他技巧的缺点，但\
  \ Google 并没有完全谴责那些应用开发方法。Google 似乎采取了这样立场：虽然开发应用没有对错之分，但存在一种推荐的方法。\n\n## 39.2 “旧”架构\n\
  \n在题为 在 Android Studio 中创建示例 Android 应用 的章节中，创建了一个 Android 项目，它由一个单一活动组成，该活动包含了显示和管理用户界面的所有代码，以及应用程序的后端逻辑。在\
  \ Jetpack 引入之前，最常见的架构遵循这种范式，即应用由多个活动（应用中的每个屏幕对应一个）组成，每个活动类在某种程度上都混合了用户界面和后端代码。\n\
  \n这种方法导致了与应用生命周期的一系列问题（例如，用户每次旋转设备时，活动都会销毁并重建，导致任何保存到某种持久化存储形式的应用数据丢失），以及导航效率低的问题，涉及到为用户访问的每个应用屏幕启动一个新活动。\n\
  \n## 39.3 现代 Android 架构\n\n在最基础的层，Google 现在提倡单一活动应用，将不同的屏幕作为内容加载到同一个活动中。\n\n现代架构指南还建议将应用中的不同职责区域划分到完全独立的模块中（Google\
  \ 将此概念称为“关注点分离”这种方法的关键之一是 `ViewModel` 组件。\n\n### 39.4 ViewModel 组件\n\n`ViewModel`\
  \ 的目的是将应用程序与用户界面相关的数据模型和逻辑与负责实际显示、管理用户界面以及与操作系统交互的代码隔离开。当这样设计时，应用程序将由一个或多个 UI 控制器（如活动）以及负责处理这些控制器所需数据的\
  \ `ViewModel` 实例组成。\n\n实际上，`ViewModel` 只感知数据模型和相应的逻辑。它完全不知道用户界面，也不会尝试直接访问或响应与用户界面内视图相关的事件。当\
  \ UI 控制器需要用于显示的数据时，它只需请求 `ViewModel` 提供。同样，当用户向用户界面内的视图输入数据时，UI 控制器会将其传递给 `ViewModel`\
  \ 进行处理。\n\n这种职责分离解决了与 UI 控制器生命周期相关的问题。无论 UI 控制器在应用生命周期内被重建多少次，`ViewModel` 实例都会保留在内存中，从而保持数据一致性。例如，由活动使用的\
  \ `ViewModel` 将一直留在内存中，直到活动完全结束，而在单一活动应用中，这意味着直到应用程序退出为止。\n\n![](img/jetpack_diagram_1.png)\n\
  \n图 39-1\n\n### 39.5 LiveData 组件\n\n考虑一个显示实时数据（如金融股票价格）的应用程序。该应用可能会使用某种形式的股票价格网络服务持续更新\
  \ `ViewModel` 中的数据模型以最新信息。显然，如果这些实时数据不及时显示给用户，其用处不大。UI 控制器只有两种方式可以确保在用户界面上显示最新数据。一种方案是控制器持续检查\
  \ `ViewModel`，以发现自上次显示以来数据是否发生了变化。然而，这种方法的问题在于它效率低下。为了保持数据馈的实时性，UI 控制器必须在循环中运行，持续检查数据的变化。\n\
  \n更好的解决方案是 UI 控制器在 `ViewModel` 内部特定数据项更改时接收通知。这是通过使用 `LiveData` 组件实现的。`LiveData`\
  \ 是一种数据持有者，允许值变得可观察的。简单来说，可观察对象具有在其数据发生变化时通知其他对象的能力，从而解决了确保用户界面始终与 `ViewModel` 中的数据匹配的问题。\n\
  \n\n\n\n这意味着，例如，一个感兴趣 `ViewModel` 值的 UI 控制器可以设置一个观察者，该观察者会在值发生变化时被通知。在我们假设的应用中，例如，股票价格将被封装在\
  \ `ViewModel` 中的一个 `LiveData` 对象中，UI 控制器为该值分配一个观察者，声明一个在值变化时调用的方法。当该方法由数据变化触发时，将从\
  \ `ViewModel` 读取更新后的值并使用其来更新用户界面。\n\n![](img/Jetpack_diagram_2.png)\n\n图 39-2\n\n\
  `LiveData` 实例也可以被声明为可变的（mutable），允许观察实体更新 `LiveData` 对象中持有的底层值。例如，用户可能会在用户界面输入一个值，该值需要覆盖存储在\
  \ `ViewModel` 中的值。\n\n使用 `LiveData` 的另一个关键优势是它可以感知观察者的生命周期状态。例如，如果一个 activity 包含一个\
  \ `LiveData` 观察者，相应的 `LiveData` 对象将知道 activity 生命周期周期状态何时变化并做出相应响应。如果 activity 被暂停（可能是应用被放入后台），`LiveData`\
  \ 对象将停止向观察者发送事件。如果 activity 刚刚启动或在暂停后恢复，`LiveData` 对象将向观察者发送一个 `LiveData` 事件，以便\
  \ activity 拥有最新的值。同样，`LiveData` 实例将知道 activity 已销毁并移除观察者以释放资源。\n\n到目前为止，我们只讨论了 UI\
  \ 控制器使用观察者的情况。在实践中，观察者可以用于任何符合 Jetpack 生命周期管理方法的方法的对象中。\n\n### 39.6 ViewModel 状态保存\n\
  \nAndroid 允许用户将运行中的应用放入后台，并在在设备上执行其他任务（包括运行其他应用）后重新返回。当设备资源不足时，操作系统将通过终止后台应用进程来纠正这一问题，从最少使用的应用开始。然而，当用户返回被终止的后台应用时，它应该显示为与放入后台时相同的状态，无论它之前是否被终止过。在与\
  \ `ViewModel` 关联的数据方面，可以通过 `ViewModel Saved State` 模块来实现。该模块允许将值存储在应用的保存状态中，并在系统发起的进程终止时恢复这些值，该主题将在后续的章节\
  \ “An Android ViewModel Saved State Tutorial” 中介绍。\n\n### 39.7 LiveData 与数据绑定\n\n\
  Android Jetpack 包含了数据绑定库（Data Binding Library），它允许 `ViewModel` 中的数据直接映射到 XML 用户界面布局文件中的特定视图。在之前创建的\
  \ `AndroidSample` 项目中必须编写代码来获取 `EditText` 和 `TextView` 视图的引用，并设置和获取文本属性以反映数据变化。数据绑定允许存储在\
  \ `ViewModel` 中的 `LiveData` 值可以直接在 XML 布局文件中被引用，避免了编写代码来保持布局视图更新。\n\n![](img/Jetpack_diagram_3.png)\n\
  \n图 39-3\n\n数据绑定将从标题为 An Overview of Android Jetpack Data Binding” 的章节开始进行更详细的介绍。\n\
  \n### 39.8 Android 生命周期\n\n从 Android 组件创建到其被销毁的时间间隔被称为生命周期。在生命周期期间，组件将在不同的生命周期状态之间切换，通常受操作系统的控制并响应用户操作。例如，一个\
  \ activity 将从初始化状态开始，然后过渡到创建状态。一旦 activity 开始运行，它将切换到启动状态，并从该状态循环经过包括创建、启动、恢复和销毁在内的各种状态。\n\
  \n许多 Android Framework 类和组件允许其他对象访问它们的当前状态。也可以使用生命周期观察者（Lifecycle observers），以便对象在另一个对象的生命周期状态变化时接收通知。这是\
  \ `ViewModel` 组件在背后使用的技术，用于识别观察者何时重新启动或被销毁。此功能不仅局限于 Android 框架和架构组件，也可以构建在任何使用架构组件包含的生命周期组件的类中。\n\
  \n能够检测并响应其他对象生命周期状态变化的对象被称为生命周期感知的（lifecycle-aware），而提供其生命周期状态访问权限的对象被称为生命周期所有者（lifecycle-owners）。生命周期将在标题为\
  \ Working with Android Lifecycle-Aware Components” 的章节中进行更详细的介绍。\n\n### 39.9 仓库模块（Repository\
  \ Modules）\n\n如果 `ViewModel` 从一个或多个外部源（如数据库或网络服务）获取数据，那么将处理这些数据源的代码与 `ViewModel`\
  \ 类分离是非常重要的。毕竟，这样做将违反关注点分离（separation of concerns）的指南。为了避免将此功能与 `ViewModel` 混合，Google\
  \ 的架构指南建议将此代码放在单独的 `Repository` 模块中。\n\n仓库不是 Android 架构组件，而是由应用开发者创建的 `Java` 类，负责与各种数据源衔接。该类为\
  \ `ViewModel` 提供一个接口，允许将数据存储在模型中。\n\n![](img/Jetpack_diagram_4.png)\n\n图 39-4\n\n\
  ### 39.10 总结\n\n直到去年，Google 倾向于不推荐任何特定方法来构建 Android 应用。随着 Android Jetpack 的引入，情况现在发生了变化，Android\
  \ Jetpack 由一组工具、组件、库和架构指南组成。Google 现在建议将应用项目划分为不同的模块，每个模块负责一个特定的功能领域，即所谓的“关注点分离”。\n\
  \n特别是，指南建议将应用的视图数据模型与处理用户界面的代码分离。此外，负责从网络服务或数据库等数据源提取代码应该构建在独立的仓库模块中，而不是与视图模型绑定。\n\
  \nAndroid Jetpack 包含了 Android 架构组件（Android Architecture Components），这些组件经过专门设计，旨在让更容易开发出符合推荐指南的应用。本章引入了\
  \ `ViewModel`、`LiveData` 和生命周期组件。这些将从下一章开始进行更详细的介绍。本章未提到的其他架构组件将在书中后部分介绍。\n\n# 40.\
  \ Android Jetpack ViewModel 教程\n\n上一章介绍了 Android Jetpack 的核心概念并概述了现代 Android 应用的基础。Jetpack\
  \ 实际上定义了一组描述如何构建 Android 应用项目的建议，同时提供了一组库和组件，使其更容易符合这些指南，目标是使用更少的代码和更少的错误开发出可靠的应用。\n\
  \n为了帮助强化和澄清上一章提供的信息，本章将逐步引导创建一个使用 `ViewModel` 组件的示例应用项目。该示例将在下一章中通过包含 `LiveData`\
  \ 和数据绑定支持进行进一步增强。\n\n## 40.1 关于项目\n\n\n\n\n在标题为在 Android Studio 中创建一个示例 Android\
  \ 应用的章节中，创建了一个名为 `AndroidSample` 的项目，该应用的所有代码都封装在主 `Activity` 类文件中。在随后的章节中，我们创建了一个\
  \ AVD 模拟器并使用它运行该应用。在应用运行时，我们亲身经历了以这种方式开发应用时会发生的问题：当 `TextView` 小部件上显示的数据在设备旋转期间丢失时。\n\
  \n本章将再次实现相同的货币转换器应用，但这次将使用 `ViewModel` 组件并遵循 Google 的应用架构指南，以避免 `Activity` 生命周期的复杂性。\n\
  \n## 40.2 创建 ViewModel 示例项目\n\n此练习的第一步是创建一个新项目。首先启动 Android Studio，如有必要，使用 `File\
  \ -> Close Project` 菜单选项关闭任何当前打开的项目，以便显示欢迎界面。\n\n在创建 `AndroidSample` 项目时，选择了 `Basic\
  \ Activity` 模板作为项目的的基础。然而，对于本项目，将使用 `Fragment + ViewModel` 模板。这将生成一个结构符合架构指南的 Android\
  \ Studio 项目。\n\n从欢迎界面选择 `Start a new Android Studio project` 快速选项，在生成的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Fragment + ViewModel` 模板。\n\n在 `Name` 字段中输入 `ViewModelDemo` 并指定\
  \ `com.ebookfrenzy.viewmodeldemo` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为\
  \ `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单更改为 `Kotlin`。\n\n## 40.3 查看项目\n\n\
  使用 `Fragment + ViewModel` 模板创建项目时，其结构在许多方面与创建 `AndroidSample` 项目时使用的 `Empty Activity`\
  \ 有何。项目的关键组件如下：\n\n### 40.3.1 主 Activity\n\n首先需要注意的是，主 Activity 的用户界面结构已经过设计，允许单个活动作为最终完成的应用后所需的所有屏幕的容器。该活动的主用户界面布局包含在\
  \ `app -> res -> layout -> main_activity.xml` 文件中，并以 `FrameLayout` 的形式提供空容器空间（在图\
  \ 40-1 中突出显示），屏幕内容将显示其中\n\n![](img/android_studio_view_model_container_area.png)\n\
  \n图 40-1\n\n### 40.3.2 内容 Fragment\n\n`FrameLayout` 容器只是一个占位符，将在运行时由应用启动时第一个屏幕的内容替换。这些内容通常以\
  \ `Fragment` 的形式存在，由一个 XML 布局资源文件和相应的类文件组成。事实上，在创建项目时，Android Studio 为了此目的创建了一个初始\
  \ fragment。该 fragment 的布局资源文件可以在 `app -> res -> layout -> main_fragment.xml` 找到，当加载到布局编辑器时，它将如图\
  \ 40-2 所示显示：\n\n![](img/as_3.5_viewmodel_main_fragment.png)\n\n图 40-2\n\n默认情况下，该\
  \ fragment 仅包含一个显示“MainFragment”文本的 `TextView`，但已准备好进行修改以包含应用第一个屏幕的布局。此时，值得花些时间查看\
  \ Android Studio 已经生成的用于在活动容器区域内显示此 fragment 的代码。\n\n用 fragment 替换 `FrameLayout`\
  \ 占位符的过程开始于 `MainActivity` 类文件（`app -> java -> <package name> -> MainActivity`）。关键代码行出现在该类的\
  \ `onCreate()` 方法中，并将容器 id（已分配给 `FrameLayout` 占位符视图）替换为 `MainFragment` 类：\n\n```kotlin\n\
  override fun onCreate(savedInstanceState: Bundle?) {\n    super.onCreate(savedInstanceState)\n\
  \    setContentView(R.layout.main_activity)\n    if (savedInstanceState == null)\
  \ {\n        supportFragmentManager.beginTransaction()\n            .replace(R.id.container,\
  \ MainFragment.newInstance())\n            .commitNow()\n    }\n}\n```\n\n伴随 fragment\
  \ 代码可以在 `MainFragment.kt` 文件中找到（`app -> <package name> -> ui.main -> MainFragment`）。该文件中包含\
  \ `onCreateView()` 方法，该方法在 fragment 创建时被调用。该方法用于加载 `main_fragment.xml` 布局文件，使其在主活动布局的容器区域内显示：\n\
  \n```kotlin\noverride fun onCreateView(inflater: LayoutInflater, container: ViewGroup?,\n\
  \                         savedInstanceState: Bundle?): View {\n    return inflater.inflate(R.layout.main_fragment,\
  \ container, false)\n}\n```\n\n### 40.3.3 ViewModel\n\n该活动的 `ViewModel` 位于 `app\
  \ -> java -> ui.main -> MainViewModel` 的 `MainViewModel.kt` 类文件中。它被声明为 `ViewModel`\
  \ 架构类的子类，并已准备好修改以存储数据：\n\n```kotlin\npackage com.ebookfrenzy.viewmodeldemo.ui.main\n\
  import androidx.lifecycle.ViewModel\n\nclass MainViewModel : ViewModel() {\n   \
  \ // TODO: Implement the ViewModel\n}\n```\n\n## 40.4 设计 Fragment 布局\n\n下一步是设计 fragment\
  \ 的布局。在工具窗口中找到 `main_fragment.xml` 文件并双击它将其加载到布局编辑器。布局加载后，选择现有 `TextView` 并使用属性窗口将\
  \ `id` 更改为 `resultText`。\n\n从调色板中拖入 `Number (Decimal)` 视图并放置在现有 `TextView` 上方。选中视图后，参考属性窗口将\
  \ id 更改为 `dollarText`。\n\n将 `Button` 小部件拖到布局中，使其位于 `TextView` 下方，双击它编辑文本并将其更改为“Convert”。在选中按钮的情况下，将\
  \ `id` 属性更改为 `convertButton`。此时，布局应如图 40-3 所示：\n\n![](img/as_3.5_viewmodel_demo_ui.png)\n\
  \n图 40-3\n\n点击推断约束按钮（图 40-4）以添加任何缺失的布局约束：\n\n![](img/android_studio_layout_infer_constraints.png)\n\
  \n图 40-4\n\n最后点击布局编辑器右上角的警告图标，将硬编码字符串转换为资源。\n\n## 40.5 实现 View Model\n\n用户界面布局完成后，需要在视图模型中创建应用的数据模型。在工具窗口中找到\
  \ `MainViewModel.kt` 文件，双击它将其加载到代码编辑器并修改该类如下所示：\n\n```kotlin\npackage com.ebookfrenzy.viewmodeldemo.ui.main\n\
  import androidx.lifecycle.ViewModel\n\nclass MainViewModel : ViewModel() {\n   \
  \ private val usd_to_eu_rate = 0.74f\n    private var dollarText = \"\"\n    private\
  \ var result: Float = 0f\n\n    fun setAmount(value: String) {\n        this.dollarText\
  \ = value\n        result = value.toFloat() * usd_to_eu_rate\n    }\n\n    fun getResult():\
  \ Float? {\n        return result\n    }\n}\n```\n\n\n\n\n该类声明了变量用于存储当前的美元字符串值以及转换后的金额，并提供了\
  \ getter 和 setter 方法以提供对这些数据值的访问。当调用 `setAmount()` 方法时，它会将当前的美元金额作为参数并将其存储在局部变量\
  \ `dollarText` 中。随后，美元字符串值会被转换为浮点数，乘以一个虚拟的汇率，并将生成的欧元值[存储]在 `result` 变量中。另一方面，`getResult()`\
  \ 方法简单地返回赋值给 `result` 变量的当前值。\n\n## 40.6 将 Fragment 与 ViewModel 关联\n\n显然，Fragment\
  \ 需要某种方式来获取 `ViewModel` 的引用，以便能够访问模型并观察数据变化。`Fragment` 或 `Activity` 通过使用 `ViewModelProvider`\
  \ 类的实例来维护其赖以以数据的 `ViewModels` 的引用。\n\n在 `Fragment` 内部，使用 `ViewModelProviders` 类创建一个\
  \ `ViewModelProvider` 实例。当调用时，类初始化器会接收一个当前 `Fragment` 或 `Activity` 的引用，并按如下所示返回一个\
  \ `ViewModelProvider` 实例：\n\n```\nval viewModelProvider = ViewModelProvider(this)\n\
  ```\n\n一旦创建了 `ViewModelProvider` 实例，就可以在该实例上调用 `get()` 方法，并传递所需的特定 `ViewModel` 类。提供者将随后创建该\
  \ `ViewModel` 类的新实例，或者返回一个已存在的实例：\n\n```\nval viewModel = ViewModelProvider(this).get(MyViewModel::class.java)\n\
  ```\n\n编辑 `MainFragment.kt` 文件，并验证 Android Studio 是否已经在 `onActivityCreated()` 方法包含了此步骤（尽管为了简洁，该操作是通过代码代码完成的）：\n\
  \n```\nviewModel = ViewModelProvider(this).get(MainViewModel::class.java)\n```\n\
  \n在访问模型视图后，现在可以在 `Fragment` 中添加代码以开始处理数据模型。\n\n## 40.7 修改 Fragment\n\n现在需要更新 Fragment\
  \ 类以响应按钮点击并与存储在 `ViewModel` 中的数据值进行交互。该类还需要用户界面布局中三个视图的引用，以便响应按钮点击、提取当前的美元值并显示转换后的货币金额。\n\
  \n在题为在 Android Studio 中创建 Android 示例的章节中，`Button` 控件的 `onClick` 属性被用于指定用户点击按钮时要调用的方法。遗憾的是，该属性只能调用\
  \ `Activity` 的方法，不能用于调用 `Fragment` 中的方法。为了解决这一局限性，我们需要向 `Fragment` 类中添加一些代码，在按钮上设置\
  \ `onClick` 监听器。实现此操作的代码可以如下添加到 `MainFragment.kt` 文件的 `onActivityCreated()` 方法中：\n\
  \n```kotlin\nimport kotlinx.android.synthetic.main.main_fragment.*\n\noverride fun\
  \ onActivityCreated(savedInstanceState: Bundle?) {\n    super.onActivityCreated(savedInstanceState)\n\
  \    viewModel = ViewModelProviders.of(this).get(MainViewModel::class.java)\n  \
  \  convertButton.setOnClickListener {\n    }\n}\n```\n\n添加监听器后，每当用户点击按钮时，`onClick()`\
  \ 方法中的任何代码都会被调用。\n\n## 40.8 访问 ViewModel 数据\n\n点击按钮时，`onClick()` 方法需要从 `EditText`\
  \ 视图读取当前值，确认字段不为空，然后调用 `ViewModel` 实例的 `setAmount()` 方法。随后，该方法需要调用 `ViewModel` 的\
  \ `getResult()` 方法并将转换后的值显示在 `TextView` 控件上。\n\n由于项目尚未未使用 `LiveData`，因此在每次创建 `Fragment`\
  \ 时，都有必要从 `ViewModel` 获取最新的结果值。\n\n在 `MainFragment.kt` 文件中，按照如下方式在 `onActivityCreated()`\
  \ 方法实现这些需求：\n\n```kotlin\nimport androidx.lifecycle.ViewModelProvider\n\noverride\
  \ fun onActivityCreated(savedInstanceState: Bundle?) {\n    super.onActivityCreated(savedInstanceState)\n\
  \    viewModel = ViewModelProviders.of(this).get(MainViewModel::class.java)\n  \
  \  resultText.text = viewModel.getResult().toString()\n    convertButton.setOnClickListener\
  \ {\n        if (dollarText.text.isNotEmpty()) {\n            viewModel.setAmount(dollarText.text.toString())\n\
  \            resultText.text = viewModel.getResult().toString()\n        } else\
  \ {\n            resultText.text = \"No Value\"\n        }\n    }\n}\n```\n\n##\
  \ 40.9 测试项目\n\n完成项目开发阶段后，在模拟器或物理设备上构建并运行应用，输入美元值并点击 Convert 按钮。转换后的金额应该显示在 `TextView`\
  \ 上，这表明 UI 控制器和 `ViewModel` 的重构似乎按预期工作。\n\n当运行原始的 `AndroidSample` 应用时，旋转设备会导致 `resultText`\
  \ `TextView` 控件上显示的值丢失。现在用 `ViewModelDemo` 应用重复此测试，并注意当前欧元值被保留了。这是因为当 `Fragment`\
  \ 被销毁时，`ViewModel` 仍然留在内存中，并且添加了代码用结果值更新 `TextView`。\n\n虽然这对原始的 `AndroidSample`\
  \ 应用有所改进，但通过使用 `LiveData` 和数据绑定可以实现更多简化工作，这两者都是后续章节的主题。\n\n## 40.10 总结\n\n在本章节中，我们回顾了书中之前创建的\
  \ `AndroidSample` 项目，并创建了一个符合架构指南的新版本项目。章节概述了 `Fragment + ViewModel` 项目模板的结构，并解释了基于单个\
  \ `Activity` 并使用 `Fragments` 来展示不同屏幕的概念。示例项目还演示了如何使用 `ViewModels` 将数据处理与用户界面代码分离。最后，章节展示了\
  \ `ViewModel` 方法如何避免 Fragment 和 Activity 生命周期产生的一些问题。\n\n# 41. Android Jetpack LiveData\
  \ 教程\n\n上一章节开始了符合推荐 Jetpack 架构指南的应用设计过程。这些初始步骤涉及选择 `Fragment+ViewModel` 项目模板以及在\
  \ `ViewModel` 实例中实现应用用户界面的数据模型。\n\n本章节将通过使用 `LiveData` 架构组件进一步增强应用设计。在本章节添加 `LiveData`\
  \ 支持后，接下来的章节（从 Android Jetpack Data Binding 概述开始）将使用 Data Binding 库。\n\n### 41.1\
  \ LiveData - 回顾\n\n`LiveData` 之前在题为使用 Jetpack 构建现代 Android 应用架构的章节中介绍过。如前所述，`LiveData`\
  \ 组件可以作为视图内部数据值的封装。一旦包含在 `LiveData` 实例中，变量就可以被应用内的其他对象（通常是 `Activity` 和 `Fragment`\
  \ 等 UI 控制器）观察。这允许 UI 控制器在 `LiveData` 值变化时接收通知。通过创建 `Observer` 类的实例并定义在 `LiveData`\
  \ 值变化时调用的 `onChange()` 方法，可以设置观察者。\n\n\n\nLiveData 实例可以使用 `MutableLiveData` 类声明为可变，这允许\
  \ `ViewModel` 和 UI 控制器都对底层数据值进行更改。\n\n## 41.2 在 ViewModel 中添加 LiveData\n\n启动 Android\
  \ Studio，打开上一章节创建的 `ViewModelDemo` 项目，并编辑 `MainViewModel.kt` 文件，该文件目前的内容应如下：\n\n\
  ```kotlin\npackage com.ebookfrenzy.viewmodeldemo.ui.main\n\nimport androidx.lifecycle.ViewModel\n\
  \nclass MainViewModel : ViewModel() {\n    private val usd_to_eu_rate = 0.74f\n\
  \    private var dollarText = \"\"\n    private var result: Float = 0f\n    fun\
  \ setAmount(value: String) {\n        this.dollarText = value\n        result =\
  \ value.toFloat() * usd_to_eu_rate\n    }\n\n    fun getResult(): Float? {\n   \
  \     return result\n    }\n}\n```\n\n本章此阶段的目标是将 `result` 变量封装在 `MutableLiveData`\
  \ 实例中（该对象需要是可变的，以便在用户每次请求货币转换时都能更改值）。首先修改类，使其现在的内容如下，请注意在使用 `LiveData` 时需要导入额外的包：\n\
  \n```kotlin\npackage com.ebookfrenzy.viewmodeldemo.ui.main\n\nimport androidx.lifecycle.ViewModel\n\
  import androidx.lifecycle.MutableLiveData\n\nclass MainViewModel : ViewModel() {\n\
  \    private val usd_to_eu_rate = 0.74f\n    private var dollarText = \"\"\n   \
  \ private var result: Float = 0f\n    private var result: MutableLiveData<Float>\
  \ = MutableLiveData()\n    fun setAmount(value: String) {\n        this.dollarText\
  \ = value\n        result = value.toFloat() * usd_to_eu_rate\n    }\n\n    fun getResult():\
  \ Float? {\n        return result\n    }\n}\n```\n\n既然 `result` 变量已包含在可变的 `LiveData`\
  \ 实例中，`setAmount()` 和 `getResult()` 方法都 {进行修改。在 `setAmount()` 方法中，不能再使用赋值运算符（`=`）为\
  \ `result` 变量赋值了。相反，必须调用 `LiveData.setValue()` 方法，并将新值作为参数传递。按照目前的实现方式，`getResult()`\
  \ 方法声明返回 `Float` 值，现在需要更改为返回 `MutableLiveData` 对象。完成这些剩余更改后将得到以下类文件：\n\n```kotlin\n\
  package com.ebookfrenzy.viewmodeldemo.ui.main\n\nimport androidx.lifecycle.ViewModel\n\
  import androidx.lifecycle.MutableLiveData\n\nclass MainViewModel : ViewModel() {\n\
  \    private val usd_to_eu_rate = 0.74f\n    private var dollarText = \"\"\n   \
  \ private var result: MutableLiveData<Float> = MutableLiveData()\n    fun setAmount(value:\
  \ String) {\n        this.dollarText = value\n        result = value.toFloat() *\
  \ usd_to_eu_rate\n        result.setValue(value.toFloat() * usd_to_eu_rate)\n  \
  \  }\n\n    fun getResult(): MutableLiveData<Float> {\n        return result\n \
  \   }\n}\n```\n\n## 41.3 实现观察者\n\n现在转换结果包含在 `LiveData` 实例中，下一步是在 UI 控制器中配置一个观察者，在本例中，它是\
  \ `MainFragment` 类。找到 `MainFragment.kt` 类（`app -> java -> <package name> -> `MainFragment`），双击它将其加载到编辑器中，并修改\
  \ `onActivityCreated()` 方法以创建一个名为 `resultObserver` 的新 `Observer` 实例：\n\n```kotlin\n\
  import androidx.lifecycle.Observer\n\noverride fun onActivityCreated(savedInstanceState:\
  \ Bundle?) {\n    super.onActivityCreated(savedInstanceState)\n    viewModel = ViewModelProviders.of(this).get(MainViewModel::class.java)\n\
  \    resultText.text = viewModel.getResult().toString()\n    val resultObserver\
  \ = Observer<Float> {\n        result -> resultText.text = result.toString() }\n\
  }\n```\n\n`resultObserver` 实例声明了 lambda 代码，当调用时会传入当前结果值，然后将其转换为字符串并显示在 `result TextView`\
  \ 对象上。下一步是将观察者添加到结果 `LiveData` 对象中，可以通过调用 `ViewModel` 对象的 `getResult()` 方法获取该对象的引用。由于更新\
  \ `result TextView` 现在是 `onChanged()` 回调方法的职责，现在可以删除执行此任务的现有代码行：\n\n```kotlin\n\
  override fun onActivityCreated(savedInstanceState: Bundle?) {\n    super.onActivityCreated(savedInstanceState)\n\
  \    viewModel = ViewModelProvider(this).get(MainViewModel::class.java)\n    resultText.text\
  \ = viewModel.getResult().toString()\n    val resultObserver = Observer<Float> {\
  \ result -> resultText.text =\n    // ... 添加观察者的逻辑 ...\n}\n```\n\n\n\n\n数据绑定支持由\
  \ Android Jetpack Data Binding 库提供，其目的是提供一种简单的方法，将用户界面布局中的视图连接到存储在代码中的数据（通常位于 `ViewModel`\
  \ 实例中）。数据绑定还提供了一种方便的方法，将用户界面控件（如 `Button` 控件）映射到其他对象（如 UI 控制器和 `ViewModel` 实例）中的事件和监听器方法。\n\
  \n当数据绑定与 `LiveData` 组件结合使用时，会变得特别强大。例如，考虑使用数据绑定连接到 `ViewModel` 中 `LiveData` 变量的\
  \ `EditText` 视图。通过这种方式连接后，`ViewModel` 中数据值的任何更改将自动显示在 `EditText` 视图中；当使用双向绑定时，输入到\
  \ `EditText` 中的任何数据将自动用于更新 `LiveData` 的值。最令人印象深刻的是，这可以在初始设置绑定所需的代码之外，不需要任何额外的代码即可。\n\
  \n传统上，将交互式视图（如 `Button` 控件）连接到 UI 控制器中的方法需要开发者编写代码来实现一个监听器方法，以便在点击按钮时调用它。数据绑定使得这一过程变得简单，只需在布局\
  \ XML 文件的 `Button` 中引用要调用的方法即可。\n\n## 42.2 数据绑定的关键组件\n\n默认情况下，Android Studio 项目未配置数据绑定支持。事实上，在应用开始使用数据绑定之前，需要组合许多不同的元素。这些元素涉及项目构建配置、布局\
  \ XML 文件、数据绑定类以及数据绑定表达式语言的使用。虽然初初看起来可能有些复杂，但如果拆分开来，这些实际上是相当简单的步骤，一旦完成，在节省编码工作方面将是非常值得的。在本章的剩余部分中，将详细介绍这些元素中的每一个。在涵盖了这些基础知识后，下一章将通过一个详细的教程，在实际操作中演示这些步骤。\n\
  \n### 42.2.1 项目构建配置\n\n在项目可以使用数据绑定之前，必须首先配置为使用 Android Data Binding 库，并启用对数据绑定类和绑定表达式语法的支持。幸运的是，只需在模块级\
  \ `build.gradle` 文件中添加几行代码（即项目工具窗口中 Gradle Scripts 下列为 `build.gradle (Module: app)`\
  \ 的文件）即可实现。以下列出了启用了数据绑定的部分构建文件：\n\n```\napply plugin: 'com.android.application'\n\
  \nandroid {\n    compileSdkVersion 28\n    dataBinding {\n        enabled = true\n\
  \    }\n    defaultConfig {\n        applicationId \"com.ebookfrenzy.myapplication\"\
  \n    }\n```\n\n### 42.2.2 数据绑定布局文件\n\n正如我们在之前的章节中看到的，应用的用户界面通常包含在 XML 布局文件中。在这些布局文件中的视图利用数据绑定之前，必须先将布局文件转换为数据绑定布局文件。\n\
  \n正如书前面所述的，XML 布局文件定义了布局中组件的层次结构，从顶层或根视图开始。通常，此根视图的形式为布局容器，例如 `ConstraintLayout`、`FrameLayout`\
  \ 或 `LinearLayout` 实例，如 `ViewModelDemo` 项目中的 `main_fragment.xml` 文件：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/main\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    tools:context=\".ui.main.MainFragment\">\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n为了能够数据绑定，布局层次结构必须有一个布局组件作为根视图，该组件反过来成为当前根视图的父视图。\n\n在上述示例的情况下，这将需要对现有的布局文件进行以下更改：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n        xmlns:tools=\"http://schemas.android.com/tools\"\n        android:id=\"\
  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n### 42.2.3 布局文件数据元素\n\n数据绑定布局文件需要某种方式来声明项目中要绑定的类（例如 `ViewModel`\
  \ 或 UI 控制器）。拥有这些类后，布局文件还需要一个变量名来引用这些实例。这是通过使用 `data` 实现的，示例所示：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <data>\n        <variable\n            name=\"myViewModel\"\n           \
  \ type=\"com.ebookfrenzy.myapplication.ViewModel\" />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n```\n\n\
  `data` 元素还可以导入其他类，然后这些类可以在布局文件的其他地方被引用。例如，如果你有一个类，其中在值显示给用户之前需要调用一个方法，可以如下所示导入该类：\n\
  \n```xml\n<data>\n    <import type=\"com.ebookfrenzy.MyFormattingTools\" />\n  \
  \  <variable\n        name=\"viewModel\"\n        type=\"com.ebookfrenzy.myapplication.ui.main.ViewModel\"\
  \ />\n</data>\n```\n\n### 42.2.4 绑定类\n\n对于绑定布局文件中 `data` 元素引用的每个类，Android Studio\
  \ 自动生成对应的绑定类。该类是 `ViewDataBinding` 类的子类，并根据文件名使用单词大写字母和 `Binding` 后缀进行命名。因此，名为 `main_fragment.xml`\
  \ 布局文件的绑定类将命名为 `MainFragmentBinding`。绑定类包含了布局文件中指定的绑定，并将它们映射到被绑定对象中的变量和方法。\n\n尽管绑定类是自动生成的，但仍需要编写代码根据对应的数据绑定布局文件创建该类的实例。幸运的是，可以通过使用\
  \ `DataBindingUtil` 类来实现这一点。\n\n\n\n\n\n`Activity` 或 `Fragment` 的初始化代码通常会设置内容视图或“膨胀”（inflate）用户界面布局文件。这简单意味着代码打开了布局文件、解析\
  \ XML 并在内存中创建并配置所有的视图对象。对于现有的 `Activity` 类，实现此点的代码可以在 `onCreate()` 方法中找到，读取内容如下：\n\
  \n```\nsetContentView(R.layout.activity_main)\n```\n\n对于 `Fragment`，这一过程发生在 `onCreateView()`\
  \ 方法中：\n\n```\nreturn inflater.inflate(R.layout.main_fragment, container, false)\n\
  ```\n\n在 `Activity` 类中创建绑定类实例，只需按照如下方式修改此初始化代码即可：\n\n```kotlin\nlateinit var binding:\
  \ MainFragmentBinding\n\nbinding = DataBindingUtil.inflate(\n    inflater, R.layout.main_fragment,\
  \ container, false)\n```\n\n对于 `Fragment`，代码读取方式如下：\n\n```kotlin\nlateinit var binding:\
  \ MainFragmentBinding\n\nbinding = DataBindingUtil.inflate(\n    inflater, R.layout.main_fragment,\
  \ container, false)\n\nbinding.setLifecycleOwner(this)\n\nreturn binding.root\n\
  ```\n\n## 42.2.5 数据绑定变量配置\n\n如上所述，数据绑定布局文件包含一个 `data` 元素，该元素包含变量元素，由变量名和要建立绑定的类类型组成。例如：\n\
  \n```xml\n<data>\n    <variable\n        name=\"viewModel\"\n        type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\"\
  \ />\n    <variable\n        name=\"uiController\"\n        type=\"com.ebookfrenzy.viewmodeldemo_databinding.ui.main.MainFragment\"\
  \ />\n</data>\n```\n\n在上面的示例中，第一个变量知道它将绑定到类型为 `MainViewModel` 的 `ViewModel` 类实例，但尚未尚未连接到实际的\
  \ `MainViewModel` 对象实例。这需要一个额外的步骤，将应用内部使用的 `MainViewModel` 实例分配给布局文件中声明的变量。这是通过调用数据绑定实例的\
  \ `setVariable()` 方法实现的，该实例的引用已在上一节中获取：\n\n```kotlin\nvar MainViewModel viewModel\
  \ =\n    ViewModelProviders.of(this).get(MainViewModel::class.java)\n\nbinding.setVariable(myViewModel,\
  \ viewModel)\n```\n\n上述 `data` 元素中的第二个变量引用了名为 `MainFragment` 的 `Fragment` UI 控制器。在这种情况下，UI\
  \ 控制器（无论是 `Activity` 还是 `Fragment`）中的代码只需如下所示将自己分配给变量：\n\n```kotlin\nbinding.setVariable(uiController,\
  \ this)\n```\n\n## 42.2.6 绑定表达式（单向）\n\n绑定表达式定义了特定视图与绑定对象交互的方式。例如，`Button` 上的绑定表达式可能会声明响应点击时调用对象上的哪个方法。或者，绑定表达式可能会定义存储在\
  \ `ViewModel` 中的哪个数据值显示在 `TextView` 中，以及如何对其进行呈现和格式化。\n\n绑定表达式使用声明式语言，允许在决定如何使用绑定数据时使用逻辑以及和其他类和方法的访问。例如，表达式可以包含数学表达式、方法调用、字符串拼接、数组访问和比较操作。此外，默认导入了所有标准的\
  \ Java 语言库，因此在 Java 或 Kotlin 中可以实现的许多功能也可以在绑定表达式中执行。正如已经讨论过的，`data` 元素也可以用于导入自定义类，为表达式添加更多功能。\n\
  \n绑定表达式以 `@` 符号开头，后跟着用大括号 `{}` 包围的表达式。\n\n例如，考虑一个包含名为 `result` 变量的 `ViewModel` 实例。假设该类已分配给数据绑定布局文件中名为\
  \ `viewModel` 的变量，并需要绑定到 `TextView` 对象，以便视图始终显示最新的结果值。如果此值被存储为 `String` 对象，则在布局文件中声明如下：\n\
  \n```xml\n<TextView\n    android:id=\"@+id/resultText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"\
  @{viewModel.result}\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n \
  \   app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n在上面的 XML 中，`text`\
  \ 属性被设置为存储在 `viewModel` 对象中 `result` `LiveData` 属性中的值。\n\n然而，假设 `result` 在模型中存储为\
  \ `Float` 值而不是 `String`。如果是这样，上面的表达式将导致编译错误。显然，`Float` 值需要转换。\n\n```xml\nandroid:text=\"\
  @{String.valueOf(result)}\"\n```\n\n在进行此更改后运行应用，可能会出现以下警告：`myViewModel.result` 被装箱（boxed）但需要拆箱（unboxed）。要解决此，将出错的操作包裹在\
  \ `safeUnbox()` 调用中：\n\n```xml\nandroid:text=\"@{String.valueOf(myViewModel.result)}\"\
  \n```\n\n也可以使用字符串拼接。例如，要在结果值后包含“dollars”单词，将使用以下表达式：\n\n```xml\nandroid:text='@{String.valueOf(myViewModel.result))\
  \ + \" dollars\"}'\n```\n\n注意，由于附加的结果字符串使用了双引号，该表达式现在使用单引号封装以避免语法错误。\n\n表达式语法还允许声明三元语句。在下面的表达式中，根据结果值是否大于\
  \ 10 显示不同的文本：\n\n```xml\n@{myViewModel.result > 10 ? \"Out of range\" : \"In range\"\
  }\n```\n\n还可以构造表达式来访问数据数组中的特定元素：\n\n```xml\n@{myViewModel.resultsArray[3]}\n```\n\
  \n## 42.2.7 绑定表达式（双向）\n\n到为止涵盖的表达式类型被称为单向绑定。也就是说，当相应的值更改时，布局不断更新，但布局内部对值的更改不会更新存储的值。\n\
  \n相反，双向绑定允许响应布局的变化更新数据模型。例如，`EditText` 视图可以配置双向绑定，这样当用户输入不同的值时，该值将用于更新相应的数据模型值。声明双向表达式时，语法与单向表达式相似，但它以\
  \ `@=` 开头。例如：\n\n```xml\nandroid:text=\"@={myViewModel.result}\"\n```\n\n## 42.2.8\
  \ 事件和监听器绑定\n\n绑定表达式也可以响应视图事件触发方法调用。例如，`Button` 视图可以配置为在点击时调用方法。在之前的“在 Android Studio\
  \ 中创建示例 Android 应用”章节中，例如按钮的 `onClick` 属性被配置为调用主 Activity 中名为 `convertCurrency()`\
  \ 的方法。在 XML 文件中，其表示如下：\n\n```xml\nandroid:onClick=\"convertCurrency\"\n```\n\n`convertCurrency()`\
  \ 方法按如下行代码声明：\n\n```kotlin\nfun convertCurrency(view: View) {\n    // implementation\n\
  }\n```\n\n\n\n\n注意，这种类型的方法调用始终会传递发生事件的视图引用。在数据绑定中，可以使用以下表达式实现相同的效果（假设布局已绑定到变量名为\
  \ `uiController` 的类）：\n\n```xml\nandroid:onClick=\"@{uiController::convertCurrency}\"\
  \n```\n\n另一个选项（且提供了向方法传递参数的能力）被称为监听器绑定（listener binding）。以下表达式使用这种方法在同一个 `viewModel`\
  \ 实例上调用一个无参数的方法：\n\n```xml\nandroid:onClick='@{() -> myViewModel.methodOne()}'\n\
  ```\n\n接下来的表达式调用了一个期望三个参数的方法：\n\n```xml\nandroid:onClick='@{() -> myViewModel.methodTwo(viewModel.result,\
  \ 10, \"A String\")}'\n```\n\n绑定表达式提供了一种丰富且灵活的语言，用于将用户界面视图绑定到其他对象中的数据和方法，本章仅涵盖了最常见的用例。要了解更多关于绑定表达式的知识，请查阅\
  \ Android 在线文档：\n\nhttps://developer.android.com/topic/libraries/data-binding/expressions\n\
  \n## 42.3 总结\n\nAndroid 数据绑定提供了一套系统，可以在无需编写代码的情况下，在用户界面布局中的视图与应用架构中其他对象的数据和方法之间建立连接。完成一些初始配置步骤后，数据绑定只需涉及在布局文件的视图元素中使用绑定表达式。这些绑定表达式可以是单向或双向的，还可以用于绑定在响应用户界面中按钮点击等事件的回调方法。\n\
  \n# 43. Android Jetpack 数据绑定教程\n\n到本书为止，我们已经涵盖了现代 Android 应用架构的基础概念，并更详细地查看了 `ViewModel`\
  \ 和 `LiveData` 组件。数据绑定的概念在上一章也涵盖过，现在将在本章中使用它来进一步修改 `ViewModelDemo` 应用。\n\n### 43.1\
  \ 移除冗余代码\n\n如果你还没有执行此操作，请复制 `ViewModelDemo` 项目文件夹并将其保存为 `ViewModelDemo_LiveData`，以便在下一章中再次使用。复制完成后，打开原始的\
  \ `ViewModelDemo` 项目，准备实现数据绑定。\n\n在 `ViewModelDemo` 应用中实现数据绑定之前，将通过删除项目中所有在本章结束时不再需要的代码来演示数据绑定的威力。\n\
  \n启动 Android Studio，打开 `ViewModelDemo` 项目，编辑 `MainFragment.kt` 文件并按如下方式修改代码：\n\n\
  ```kotlin\npackage com.ebookfrenzy.viewmodeldemo.ui.main\n\nimport androidx.lifecycle.ViewModelProviders\n\
  import android.os.Bundle\nimport android.support.v4.app.Fragment\nimport android.view.LayoutInflater\n\
  import android.view.View\nimport android.view.ViewGroup\nimport com.ebookfrenzy.viewmodeldemo.R\n\
  import androidx.lifecycle.Observer\nimport kotlinx.android.synthetic.main.main_fragment.*\n\
  \nclass MainFragment : Fragment() {\n\n.\n\n.\n\n    override fun onActivityCreated(savedInstanceState:\
  \ Bundle?) {\n        super.onActivityCreated(savedInstanceState)\n        viewModel\
  \ = ViewModelProviders.of(this).get(MainViewModel::class.java)\n        val resultObserver\
  \ = Observer<Float> { result -> resultText.text = result.toString() }\n        viewModel.getResult().observe(this,\
  \ resultObserver)\n        convertButton.setOnClickListener {\n            if (dollarText.text.isNotEmpty())\
  \ {\n                viewModel.setAmount(dollarText.text.toString())\n         \
  \       //resultText.text = viewModel.getResult().toString()\n            } else\
  \ {\n                resultText.text = \"No Value\"\n            }\n        }\n\
  \    }\n}\n```\n\n接下来，编辑 `MainViewModel.kt` 文件并继续如下如下删除代码（同样注意 `dollarText` 变量转换为\
  \ `LiveData`）：\n\n```kotlin\npackage com.ebookfrenzy.viewmodeldemo.ui.main\n\nimport\
  \ androidx.lifecycle.ViewModel\nimport androidx.lifecycle.MutableLiveData\n\nclass\
  \ MainViewModel : ViewModel() {\n\n    private val usd_to_eu_rate = 0.74f\n    private\
  \ var dollarText = \"\"\n    var dollarValue: MutableLiveData<String> = MutableLiveData()\n\
  \    private var result: MutableLiveData<Float> = MutableLiveData()\n\n    fun setAmount(value:\
  \ String) {\n        this.dollarText = value\n        //result = value.toFloat()\
  \ * usd_to_eu_rate\n    }\n\n    fun getResult(): MutableLiveData<Float> {\n   \
  \     return result\n    }\n}\n```\n\n虽然我们在数据绑定的过程中会添加几行代码，但显然数据绑定显著减少了代码量。\n\n\
  ## 43.2 启用数据绑定\n\n使用数据绑定的第一步是在 Android Studio 中启用它。这涉及向 `build.gradle` 文件添加一个属性，因此打开此文件（Module:\
  \ app）：\n\n```gradle\napply plugin: 'com.android.application'\napply plugin: 'kotlin-android'\n\
  apply plugin: 'kapt'\n\nandroid {\n    dataBinding {\n        enabled = true\n \
  \   }\n    compileSdkVersion\n}\n```\n\n一旦添加了该项，编辑器顶部将出现一个带有 `Sync Now` 链接的黄色条。点击此链接重新同步项目。\n\
  \n### 43.3 添加布局元素\n\n正如“Android 数据绑定概述”中所述，为了能够使用数据绑定，布局层次结构必须以布局作为根。这需要对 `main_fragment.xml`\
  \ 文件（app -> layout -> `main_fragment.xml`）进行以下更改。在布局编辑器中打开此文件，切换到 Code 模式并进行这些更改：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n\n    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"\
  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n完成这些更改后，切换回 Design 模式，注意新的根视图虽然在布局画布上不可见，但现在已列在组件树中，如图所示。\n\n\
  构建并运行应用，以验证布局元素的添加没有任何方式更改用户界面外观。\n\n### 43.4 在布局文件中添加数据元素\n\n将布局文件转换为数据绑定布局文件的下一步是添加数据元素。对于此示例，布局将绑定到\
  \ `MainViewModel`，因此编辑 `main_fragment.xml` 文件以添加数据元素：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  >\n```\n\n\n\n\n\n```xml\n<xmlns:tools=\"http://schemas.android.com/tools\"\n  \
  \  xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <data>\n \
  \       <variable\n            name=\"myViewModel\"\n            type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\"\
  \ />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n    \
  \    android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\n \
  \       android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n```\n\n再次构建并运行应用以确保这些更改生效。\n\n### 43.5 使用绑定类（Binding Class）\n\n下一步是修改 `MainFragment.kt`\
  \ 文件中的代码，以获取绑定类实例的引用。最佳方法是重写 `onCreateView()` 方法：\n\n```kotlin\nimport androidx.databinding.DataBindingUtil\n\
  import com.ebookfrenzy.viewmodeldemo.databinding.MainFragmentBinding\n\nclass MainFragment\
  \ : Fragment() {\n    companion object {\n        fun newInstance() = MainFragment()\n\
  \    }\n    private lateinit var viewModel: MainViewModel\n    lateinit var binding:\
  \ MainFragmentBinding\n    override fun onCreateView(inflater: LayoutInflater, container:\
  \ ViewGroup?,\n                             savedInstanceState: Bundle?): View {\n\
  \        binding = DataBindingUtil.inflate(\n            inflater, R.layout.main_fragment,\
  \ container, false)\n        binding.setLifecycleOwner(this)\n        return binding.root\n\
  \    }\n}\n```\n\n旧代码简单地膨胀了 `main_fragment.xml` 布局文件（换句话说创建了包含所有视图对象的布局），并返回根视图（顶层布局容器）的引用。Data\
  \ Binding Library 包含一个工具类，它提供了一个特殊的膨胀方法，除了构建 UI，还会初始化并返回布局绑定类的实例。新代码调用此方法并将绑定类的实例引用存储在变量中：\n\
  \n```kotlin\nbinding = DataBindingUtil.inflate(\n    inflater, R.layout.main_fragment,\
  \ container, false)\n```\n\n`binding` 对象只需要在 fragment 存在期间留在内存中。为了确保在 fragment 消失时销毁该实例，将当前\
  \ fragment 声明为 `binding` 对象的生命周期所有者（lifecycle owner）。\n\n```kotlin\nbinding.setLifecycleOwner(this)\n\
  ```\n\n尽管 `onCreateView()` 方法的代码已经重写，但其返回布局根视图的基本要求没有改变。幸运的是，可以通过调用 `binding` 对象的\
  \ `getRoot()` 方法获取：\n\n```kotlin\nreturn binding.root\n```\n\n### 43.6 将 ViewModel\
  \ 实例赋值给数据绑定变量\n\n此时，数据绑定已经知道它将绑定到类型为 `MainViewModel` 的类实例，但尚未连接到实际的 `MainViewModel`\
  \ 对象。这需要一个额外的步骤，将应用内部使用的 `MainViewModel` 实例赋值给布局文件中声明的 `viewModel` 变量。由于 ViewModel\
  \ 的引用是在 `onActivityCreated()` 方法中获取的，因此在该处进行赋值是合理的：\n\n```kotlin\nimport com.ebookfrenzy.viewmodeldemo.BR.myViewModel\n\
  \noverride fun onActivityCreated(savedInstanceState: Bundle?) {\n    super.onActivityCreated(savedInstanceState)\n\
  \    viewModel = ViewModelProviders.of(this).get(MainViewModel::class.java)\n  \
  \  binding.setVariable(myViewModel, viewModel)\n}\n```\n\n完成这些更改后，下一步是开始在数据绑定布局文件的视图元素中插入一些绑定表达式。\n\
  \n### 43.7 添加绑定表达式\n\n第一个绑定表达式将 `resultText` TextView 绑定到模型中的结果值。编辑 `main_fragment.xml`\
  \ 文件，找到 `resultText` 元素并修改 `text` 属性，使元素内容如下：\n\n```xml\n<TextView\n    android:id=\"\
  @+id/resultText\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:text=\"MainFragment\"\n    android:text='@{Unbox(myViewModel.result)\
  \ == 0.0 ? \"Enter value\" : String.valueOf(Unbox(myViewModel.result)) + \" euros\"\
  }'\n    app:layout_constraintBottom=\"parent\"\n    app:layout_constraintEnd=\"\
  parent\"\n    app:layout_constraintStart_toStart=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n该表达式首先检查结果值当前是否为零，如果是，则显示一条指示用户输入数值的消息。然而，如果结果不为，则将该值转换为字符串，并与单词“euros”拼接后显示给用户。\n\
  \n布局中的结果值只是单向绑定，永远不需要更新 `ViewModel` 中的值。相反，`dollarValue` `EditText` 视图需要使用双向绑定，以便数据模型可以使用用户输入的最新值进行更新，并允许在发生如设备旋转触发的生命周期事件时，将当前值重新显示在视图中。`dollarText`\
  \ 元素现在应如下：\n\n```xml\n<EditText\n    android:id=\"@+id/dollarText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginTop=\"\
  96dp\"\n    android:ems=\"10\"\n    android:importantForAccessibility=\"no\"\n \
  \   android:inputType=\"numberDecimal\"\n    android:text=\"@={myViewModel.dollarValue}\"\
  \n    app:layout_constraintEnd=\"parent\"\n    app:layout_constraintHorizontal_bias=\"\
  0.50\"\n    app:layout_constraintStart_toStart=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n添加这些初始绑定表达式后，现在需要编写一个方法，以便用户点击 `Button` 组件时执行转换。\n\n### 43.8\
  \ 添加转换方法\n\n当点击 Convert 按钮时，它将调用 `ViewModel` 上的方法进行转换计算，并将欧元值放入 `result` 变量中。在 `MainViewModel.kt`\
  \ 文件中添加此方法：\n\n```kotlin\nclass MainViewModel : ViewModel() {\n    private val usd_to_eu_rate\
  \ = 0.74f\n    public var dollarValue: MutableLiveData<String> = MutableLiveData()\n\
  \    public var result: MutableLiveData<Float> = MutableLiveData()\n    fun convertValue()\
  \ {\n        dollarValue.let {\n            if (!it.value.equals(\"\")) {\n    \
  \            result.value = it.value?.toFloat()?.times(usd_to_eu_rate)\n       \
  \     } else {\n                result.value = 0f\n            }\n        }\n  \
  \  }\n}\n```\n\n注意，在没有有效美元值的情况下会被赋值零。这确保了分配给 `resultText` TextView 的绑定表达式在用户未输入时显示“Enter\
  \ value”消息。\n\n### 43.9 添加监听器绑定\n\n测试项目之前的最后一步是为布局文件中的 `Button` 元素添加监听器绑定表达式，以便点击按钮时调用\
  \ `convertValue()` 方法。再次以代码模式编辑 `main_fragment.xml`，找到 `convertButton` 元素并添加如下的\
  \ `onClick` ：\n\n```xml\n<Button\n    android:id=\"@+id/convertButton\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginTop=\"\
  77dp\"\n    android:onClick=\"@() -> myViewModel.convertValue()}\"\n    android:text=\"\
  Convert\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toBottomOf=\"@+id/resultText\" />\n```\n\n\
  ## 43.10 测试应用\n\n\n\n\n编译并运行应用，测试在美元字段中输入一个值并点击“Convert”（转换）按钮，是否会在 `TextView` 上显示正确的结果（带有“euros”后缀），以及在美元字段为空时尝试转换，是否会显示“Enter\
  \ value”（输入值）提示。此外，验证用户界面中显示的信息在设备旋转后仍然保留。\n\n## 43.11 总结\n\n本章的主要目标是完成设置项目使用数据绑定（data\
  \ binding）的步骤，并演示单向、双向和监听器绑定表达式的使用。本章还提供了一个实例，说明了通过结合数据绑定和 `LiveData` 将用户界面视图与应用的后端数据和逻辑连接，可以节省多少代码编写。\n\
  \n# 44 Android ViewModel 状态保存教程\n\n应用状态的保护与恢复关键在于当应用进入后台后，为用户在外观和行为上提供连续性。用户已经习惯了可以在不同应用之间进行切换，并在返回原始应用时，发现它正处于切换前的完全状态。\n\
  \n正如“理解 Android 应用程序和 Activity 生命周期”章节概述，当用户将应用置于后台时，如果资源受限，该应用就有可能被操作系统终止。当用户尝试将已终止的应用切回前台时，Android\
  \ 只是简单地在一个新进程中重新启动该应用。由于这一切对用户来说是不可见的，因此应用有责任将自己恢复到最初进入后台时的相同状态，而不是以其“初始启动”状态呈现。对于基于\
  \ `ViewModel` 的应用，大部分此类行为可以使用 `ViewModel` Saved State 模块来实现。\n\n## 44.1 理解 ViewModel\
  \ 状态保存\n\n如前面的章节所述，`ViewModel` 为应用开发带来了许多益处，包括在设备旋转等配置更改时恢复 UI 状态。为了查看其实效果，请运行 `ViewModelDemo`\
  \ 应用（如果你尚未创建该项目，请从书籍随附的示例代码下载中加载 `ViewModelDemo_LiveData` 项目到 Android Studio）。\n\
  \n运行后，输入一个美元值并转换为欧元。在美元和欧元值都显示的情况下，旋转设备或模拟器，并注意：一旦应用响应了方向变化，两个值仍然可见。\n\n但遺憾的是，这种行为并不适用于后台应用进程的终止。在应用仍在运行的情况下，点击设备主页键将\
  \ `ViewModelDemo` 应用置于后台，然后通过打开 Android Studio 中的 `Logcat` 工具窗口并点击图 44-1 中高亮的 terminate\
  \ 按钮（不要点击 Android Studio 工具栏上的停止按钮）：\n\n```![](img/as_3.5_logcat_terminate.png)```\n\
  \n图 44-1\n\n一旦应用被终止，返回设备或模拟器并从启动器中选择该应用（不要简单地从 Android Studio 内部重新运行应用）。一旦应用出现，它看起来就像刚刚启动的一样，之前的美元和欧元值都丢失了。然而，从用户的角度来看，应用仅仅是从后台恢复的，本应该仍然包含原始数据。在这种情况下，应用未能提供用户对\
  \ Android 应用所预期的连续性。\n\n## 44.2 实现 ViewModel 状态保存\n\n基础的 ViewModel 状态保存通过引入 `ViewModel`\
  \ Saved State 库得以。该库本质上扩展了 `ViewModel` 类，以支持通过后台进程终止及随后的重新启动维持状态。\n\n保存状态的关键是 `SavedStateHandle`\
  \ 类，它用于保存和恢复 view model 实例的状态。`SavedStateHandle` 对象包含一个键值映射，允许通过引用相应的键来保存和恢复数据值。\n\
  \n为了支持保存状态，需要声明一种不同的 `ViewModel` 子类，在本例中，它包含一个可以接收 `SavedStateHandle` 实例的构造函数。一旦声明，就可以在创建时包含一个\
  \ `SavedStateViewModelFactory` 对象来创建此类类型的 `ViewModel` 实例。考虑以下来自标准 `ViewModel` 声明的代码片段：\n\
  \n```kotlin\npackage com.example.viewmodeldemo.ui.main\n\nimport androidx.lifecycle.ViewModel\n\
  \nimport androidx.lifecycle.MutableLiveData\n\nclass MainViewModel : ViewModel()\
  \ {\n\n.\n.\n}\n```\n\n创建此类类实例的代码可能类似于：\n\n```kotlin\nprivate lateinit var viewModel:\
  \ MainViewModel\n\nviewModel = ViewModelProvider(this).get(MainViewModel::class.java)\n\
  ```\n\n另一方面，设计用于支持保存状态的 `ViewModel` 子类需要如下声明：\n\n```kotlin\npackage com.example.viewmodeldemo.ui.main\n\
  \nimport androidx.lifecycle.ViewModel\n\nimport androidx.lifecycle.MutableLiveData\n\
  \nimport androidx.lifecycle.SavedStateHandle\n\nclass MainViewModel(private val\
  \ savedStateHandle: SavedStateHandle) : ViewModel() {\n\n.\n.\n}\n```\n\n当创建上述 `ViewModel`\
  \ 实例时，必须如下所示向 `ViewModelProvider` 类初始化器传递一个 `SavedStateViewModelFactory` 实例：\n\n\
  ```kotlin\nprivate lateinit var viewModel: MainViewModel\n\nval factory = SavedStateViewModelFactory(activity.application,\
  \ this)\n\nviewModel = ViewModelProvider(this, factory).get(MainViewModel::class.java)\n\
  ```\n\n## 44.3 保存和恢复状态\n\n可以在 `ViewModel` 内部通过传递给 `SavedStateHandle` 实例的 `set()`\
  \ 方法来保存对象或值，提供检索时使用的键字符串：\n\n```kotlin\nval NAME_KEY = \"Customer Name\"\n\nsavedStateHandle.set(NAME_KEY,\
  \ customerName)\n```\n\n在使用 `LiveData` 对象时，可以使用 `SavedStateHandle` 实例的 `getLiveData()`\
  \ 方法恢复之前的值，再次引用键如下：\n\n```kotlin\nvar restoredName: LiveData<String> = savedStateHandle.getLiveData(NAME_KEY)\n\
  ```\n\n恢复恢复（非 LiveData）对象，只需使用 `SavedStateHandle` 的 `get()` 方法：\n\n```kotlin\nvar\
  \ restoredName: String? = savedStateHandle.get(NAME_KEY)\n```\n\n其他有用的 `SavedStateHandle`\
  \ 方法包括：\n\n- `contains(String key)` - 返回保存状态是否包含指定键的布尔值。\n- `remove(String key)`\
  \ - 从保存状态中移除值和键。返回被移除的值。\n- `keys()` - 返回保存状态中包含的所有键集合。\n\n## 44.4 为 ViewModelDemo\
  \ 项目添加状态支持\n\n在涵盖了 ViewModel 保存的基础后，可以扩展 `ViewModelDemo` 应用以包含此支持。首先将“Android Jetpack\
  \ LiveData 教程”中创建的 `ViewModelDemo_LiveData` 项目加载到 Android Studio（示例代码下载中也有项目的副本），打开\
  \ build.gradle (Module: app) 文件并添加 Saved State 库依赖（一如既往，检查是否有较新的库版本）：\n\n```gradle\n\
  dependencies {\n.\n.\n    implementation \"androidx.savedstate:savedstate:1.0.0\"\
  \n    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.2.0'\n\
  .\n.\n}\n```\n\n接下来，修改 `MainViewModel.kt` 文件，使构造函数接收一个 `SavedStateHandle` 实例。同时导入\
  \ `androidx.lifecycle.SavedStateHandle`，声明键字符串常量并修改结果 `LiveData` 变量，以便现在从保存状态中获取值：\n\
  \n```kotlin\npackage com.example.viewmodeldemo.ui.main\n```\n\n\n\n\n```kotlin\n\
  import androidx.lifecycle.ViewModel\nimport androidx.lifecycle.MutableLiveData\n\
  import androidx.lifecycle.SavedStateHandle\n\nconst val RESULT_KEY = \"Euro Value\"\
  \n\nclass MainViewModel(private val savedStateHandle: SavedStateHandle) : ViewModel()\
  \ {\n    private val usd_to_eu_rate = 0.74f\n    private var dollarText = \"\"\n\
  \    private var result: MutableLiveData<Float> = savedStateHandle.getLiveData(RESULT_KEY)\n\
  }\n```\n\n在 `MainViewModel.kt` 文件中，修改 `setAmount()` 方法，包含一段代码以便在每次计算新的欧元金额时都保存结果值：\n\
  \n```kotlin\nfun setAmount(value: String) {\n    this.dollarText = value\n    val\
  \ convertedValue = value.toFloat() * usd_to_eu_rate\n    result.value = convertedValue\n\
  \    savedStateHandle.set(RESULT_KEY, convertedValue)\n}\n```\n\n完成 `ViewModel`\
  \ 的更改后，打开 `MainFragment.kt` 文件并进行以下更改，以便在 `ViewModel` 过程中包含一个 `SavedState factory`\
  \ 实例：\n\n```kotlin\nimport androidx.lifecycle.SavedStateViewModelFactory\n\noverride\
  \ fun onActivityCreated(savedInstanceState: Bundle?) {\n    super.onActivityCreated(savedInstanceState)\n\
  \    activity?.application?.let {\n        val factory = SavedStateViewModelFactory(it,\
  \ this)\n        viewModel = ViewModelProviders.of(this, factory).get(MainViewModel::class.java)\n\
  \        val resultObserver = Observer<Float> {\n            result -> resultText.text\
  \ = result.toString()\n        }\n    }\n}\n```\n\n完成更改后，构建并运行应用并进行货币转换。当屏幕 UI 填充了美元和欧元值后，将应用置于后台，从\
  \ `Logcat` 工具窗口中终止它，然后从设备或模拟器屏幕上重新启动它。重启后，之前的货币金额应该仍然显示在 `TextView` 和 `EditText`\
  \ 组件中，这证实了状态已成功保存并恢复。\n\n## 44.5 总结\n\n一个设计良好的应用程序在从后台切前时，应该始终向用户呈现相同的状态，无论包含该应用的进程在此期间是否被操作系统终止。在处理\
  \ `ViewModels` 时，这可以通过利用 `ViewModel Saved State` 模块来实现这一点。这涉及修改 `ViewModel` 构造函数以接受一个\
  \ `SavedStateHandle` 实例，该实例可以通过一系列方法调用来保存和恢复数据值。在创建 `ViewModel` 实例时，必须传递一个 `SavedStateViewModelFactory`\
  \ 实例。一旦实现了这些步骤，应用将在后台终止期间自动保存和恢复状态。\n\n## 45. 与 Android 生命周期感知组件一起\n\n之前标题为“理解 Android\
  \ 应用和 Activity 生命周期`的章节描述了如何使用生命周期方法来跟踪 UI 控制器（如 activity 或 fragment）内部生命周期状态的变化。这些方法的主要问题之一是它们将处理生命周期更改的负担置于\
  \ UI 控制器上。从表面上看，这似乎是逻辑方法，因为 UI 控制器毕竟是经历状态更改的对象。然而，事实是，通常受状态更改影响的代码始终位于应用中的其他类中。这导致\
  \ UI 控制器中出现了复杂的代码，需要响应生命周期状态的变化来管理和操作其他对象。显然，在遵循 Android 架构指南时，这是最应该避免的场景。\n\n更清晰、更有逻辑的方法是让应用中的对象能够观察其他对象的生命周期状态，并负责对状态更改采取任何必要的行动。例如，负责跟踪用户位置的类可以观察\
  \ UI 控制器的生命周期状态，并在控制器进入暂停状态时挂位置更新。当控制器进入恢复状态时，重新开始跟踪。这是通过 Android 架构组件随附的 `Lifecycle`\
  \ 包提供的类和接口实现的。\n\n本章将引入使 Android 应用能够构建生命周期感知能力的术语和关键组件。\n\n### 45.1 生命周期感知\n\n\
  如果一个对象能够检测并响应生命周期的变化，则说它是生命感知的。\n\n### 45.2 生命周期所有者 (Lifecycle Owners)\n\n生命所有者只能观察实现了\
  \ `LifecycleOwner` 接口对象的状态。大多数 Android 框架组件（如 `activity` 和 `fragment`）都是生命所有者。自定义类也可以通过\
  \ `LifecycleRegistry` 配置为生命所有者。例如：\n\n```kotlin\nclass SampleOwner: LifecycleOwner\
  \ {\n    private val lifecycleRegistry: LifecycleRegistry\n\n    init {\n      \
  \  lifecycleRegistry = LifecycleRegistry(this)\n        lifecycle.addObserver(DemoObserver())\n\
  \    }\n\n    override fun getLifecycle(): Lifecycle {\n        return lifecycleRegistry\n\
  \    }\n}\n```\n\n除非生命所有者是另一个生命感知组件的子类，否则该类需要通过调用 `LifecycleRegistry` 的方法自行触发状态更改。可以使用\
  \ `markState()` 方法通过传递新的状态值来触发生命周期状态更改：\n\n```kotlin\nfun resuming() {\n    lifecycleRegistry.markState(Lifecycle.State.RESUMED)\n\
  }\n```\n\n上述调用也将导致调用相应的事件。或者，可以调用 `LifecycleRegistry.handleLifecycleEvent()` 方法并传递要触发的生命周期事件。例如：\n\
  \n```kotlin\nlifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START)\n\
  ```\n\n### 45.3 生命周期观察者 (Lifecycle Observers)\n\n为了让生命感知组件观察生命所有者的状态，它必须实现 `LifecycleObserver`\
  \ 接口，并包含它需要观察的任何生命周期更改的事件处理器。\n\n```kotlin\nclass DemoObserver: LifecycleObserver\
  \ {\n    // 生命周期事件方法写在这里\n}\n```\n\n然后创建此观察者类的实例并将其添加到 `Lifecycle` 对象维护的观察者列表中：\n\
  \n```kotlin\nlifecycle.addObserver(DemoObserver())\n```\n\n### 45.4 生命周期状态和事件\n\n\
  当生命所有者的状态发生时，分配的 `Lifecycle` 对象将用新状态更新。在任何给定时刻，生命所有者将处于以下五个状态之一：\n\n- `Lifecycle.State.INITIALIZED`\n\
  - `Lifecycle.State.CREATED`\n- `Lifecycle.State.STARTED`\n- `Lifecycle.State.RESUMED`\n\
  - `Lifecycle.State.DESTROYED`\n\n随着组件在不同状态之间转换，`Lifecycle` 对象将对任何已添加到列表的观察者触发事件。在生命周期观察者中可以实现以下事件：\n\
  \n- `Lifecycle.Event.ON_CREATE`\n- `Lifecycle.Event.ON_START`\n\n\n\n\n\n- `Lifecycle.Event.ON_RESUME`\n\
  - `Lifecycle.Event.ON_PAUSE`\n- `Lifecycle.Event.ON_STOP`\n- `Lifecycle.Event.ON_DESTROY`\n\
  - `Lifecycle.Event.ON_ANY`\n\n注解用于观察者类内部，将方法与生命周期事件关联。例如，下面的代码配置了观察者中的一个方法，使其在响应\
  \ `ON_RESUME` 生命周期事件时被调用：\n\n```\n@OnLifecycleEvent(Lifecycle.Event.ON_RESUME)\n\
  fun onResume() {\n    // 执行响应状态变为 RESUMED 状态的任务\n}\n```\n\n分配给 `ON_ANY` 事件的方法将在所有生命周期事件时被调用。该事件类型的方法将接收一个生命周期所有者（lifecycle\
  \ owner）的引用和一个事件对象，可以使用该对象来查找当前状态和事件类型。例如，下面的方法提取了当前状态和事件的名称：\n\n```kotlin\n@OnLifecycleEvent(Lifecycle.Event.ON_ANY)\n\
  fun onAny(owner: LifecycleOwner, event: Lifecycle.Event) {\n    var currentState\
  \ = owner.lifecycle.currentState.name\n    var eventName = event.name\n}\n```\n\n\
  当所有者状态需要处于特定的生命周期级别时，也可以使用当前状态对象的 `isAtLeast()` 方法：\n\n```kotlin\nif (owner.lifecycle.currentState.isAtLeast(Lifecycle.State.STARTED))\
  \ {\n}\n```\n\n图 45-2 中的流程图说明了生命周期所有者的状态变化序列，以及在每个状态转换之间会在观察者上触发的生命周期事件：\n\n![](img/android_lifecycle_states_diagram.png)\n\
  \n图 45-2\n\n## 45.5 总结\n\n本章介绍了生命周期感知的基础知识，以及包含在 Android Jetpack 中的 Android Lifecycle\
  \ 包的类和接口。该包包含了许多用于创建生命周期所有者、生命周期观察者和生命周期感知组件的类和接口。生命周期所有者被分配了一个 `Lifecycle` 对象，该对象维护了所有者状态的记录以及订阅的观察者列表。当所有者的状态发生变化时，会通过生命周期事件方法通知观察者，以便响应该变化。\n\
  \n下一章将创建一个 Android Studio 项目，演示如何使用和创建生命周期感知组件，包括生命周期观察者和所有者的创建，以及生命周期状态变化和事件的处理。\n\
  \n## 46. Android Jetpack 生命周期感知感知教程\n\n上一章概述了生命周期感知的概念，并概述了在 Android 应用项目内实现此点的关键类和接口。本章将在此知识的基础上，通过构建一个\
  \ Android Studio 项目来突出展示运行中的生命周期感知。\n\n## 46.1 创建示例生命周期项目\n\n从欢迎界面选择`Start a new\
  \ Android Studio project`（新建 Android Studio 项目）快速启动选项，在生成的新项目对话框中，点击`Next`（下一步）按钮之前选择`Fragment\
  \ + ViewModel`模板。\n\n在`Name`字段中输入 `LifecycleDemo` 并指定 `com.ebookfrenzy.lifecycledemo`\
  \ 为包名。在点击`Finish`（完成）按钮之前，将`Minimum API level`（最低 API 级别）设置为 `API 26: Android 8.0\
  \ (Oreo)`，并将`Language`（语言）菜单设置为 `Kotlin`。\n\n## 46.2 创建生命周期观察者\n\n正如之前讨论的，activity\
  \ 和 fragment 已经实现了 `LifecycleOwner` 接口，并准备好被其他对象观察。为了在实践中查看，本教程的下一步是向项目添加一个新类，该类能够观察\
  \ `MainFragment` 实例。\n\n要添加新类，在 Project 工具窗口右键点击 `app -> java -> com.ebookfrenzy.lifecycledemo`，并在生成的菜单中选择`New\
  \ -> Kotlin File/Class...`。在`New Class` 对话框中，将类命名为 `DemoObserver`，从列表中选择`Class`\
  \ 并按下键盘上的 `Return` 键创建 `DemoObserver.kt` 文件。新文件应自动在编辑器中打开，其内容如下：\n\n```kotlin\n\
  package com.ebookfrenzy.lifecycledemo\n\nclass DemoObserver {\n\n}\n```\n\n保持在编辑器中，修改类文件以声明它将实现\
  \ `LifecycleObserver` 接口：\n\n```kotlin\npackage com.ebookfrenzy.lifecycledemo\n\n\
  import androidx.lifecycle.LifecycleObserver\n\nclass DemoObserver: LifecycleObserver\
  \ {\n}\n```\n\n下一步是添加生命周期方法并将它们分配为生命周期事件处理器。在本例中，所有事件都将被处理，每个事件向 Logcat 面板输出显示事件类型的消息。按照下面的列表更新观察者类：\n\
  \n```kotlin\npackage com.ebookfrenzy.lifecycledemo\n\nimport android.util.Log\n\
  import androidx.lifecycle.LifecycleObserver\nimport androidx.lifecycle.Lifecycle\n\
  import androidx.lifecycle.OnLifecycleEvent\nimport androidx.lifecycle.LifecycleOwner\n\
  \nclass DemoObserver: LifecycleObserver {\n    private val LOG_TAG = \"DemoObserver\"\
  \n\n    @OnLifecycleEvent(Lifecycle.Event.ON_RESUME)\n    fun onResume() {\n   \
  \     Log.i(LOG_TAG, \"onResume\")\n    }\n\n    @OnLifecycleEvent(Lifecycle.Event.ON_PAUSE)\n\
  \    fun onPause() {\n        Log.i(LOG_TAG, \"onPause\")\n    }\n\n    @OnLifecycleEvent(Lifecycle.Event.ON_CREATE)\n\
  \    fun onCreate() {\n        Log.i(LOG_TAG, \"onCreate\")\n    }\n\n    @OnLifecycleEvent(Lifecycle.Event.ON_START)\n\
  \    fun onStart() {\n        Log.i(LOG_TAG, \"onStart\")\n    }\n\n    @OnLifecycleEvent(Lifecycle.Event.ON_STOP)\n\
  \    fun onStop() {\n        Log.i(LOG_TAG, \"onStop\")\n    }\n\n    @OnLifecycleEvent(Lifecycle.Event.ON_DESTROY)\n\
  \    fun onDestroy() {\n        Log.i(LOG_TAG, \"onDestroy\")\n    }\n\n    @OnLifecycleEvent(Lifecycle.Event.ON_ANY)\n\
  \    fun onAny(owner: LifecycleOwner, event: Lifecycle.Event) {\n        Log.i(LOG_TAG,\
  \ owner.lifecycle.currentState.name)\n    }\n}\n```\n\n为了能够相对于 fragment 当前状态跟踪事件，还将添加一个\
  \ `ON_ANY` 事件处理器。由于该方法接收生命周期所有者的引用，可以添加代码来获取当前状态。\n\n## 46.3 添加观察者\n\n观察者通过调用所有者\
  \ `Lifecycle` 对象的 `addObserver()` 方法添加到生命周期所有者，该对象通过调用 `getLifecycle()` 方法获取。编辑\
  \ `MainFragment.kt` 类并在 `onActivityCreated()` 方法中添加代码以添加观察者：\n\n```kotlin\n...\n\
  import com.ebookfrenzy.lifecycledemo.DemoObserver\n...\noverride fun onActivityCreated(savedInstanceState:\
  \ Bundle?) {\n    super.onActivityCreated(savedInstanceState)\n    viewModel = ViewModelProviders.of(this).get(MainViewModel::class.java)\n\
  \    lifecycle.addObserver(DemoObserver())\n}\n```\n\n## 46.4 测试观察者\n\n由于 `DemoObserver`\
  \ 类向 Logcat 控制台输出诊断信息，如果配置了过滤器仅显示 `DemoObserver` 消息，将更容易看到输出。使用之前在“Android Activity\
  \ 状态示例`中概述的步骤，在运行应用之前为 `DemoObserver` 标签的消息配置过滤器。\n\n成功启动应用后，Logcat 输出应指示以下生命周期状态变化和事件：\n\
  \nonCreate\nCREATED\nonStart\nSTARTED\nonResume\nRESUMED\n\n在应用运行时，旋转设备以触发 fragment\
  \ 的销毁和重建，产生以下额外的输出：\n\nonPause\nSTARTED\nonStop\nCREATED\nonDestroy\nDESTROYED\n\
  onCreate\nCREATED\nonStart\nSTARTED\nonResume\nRESUMED\n\n在移动到本章下一节之前，花些时间将应用的输出与上一章的图\
  \ 45-2 中的流程图进行对比。\n\n\n\n\n\n## 46.5 创建生命周期所有者 (Lifecycle Owner)\n\n本章最后一个任务是创建一个自定义生命周期所有者类，并演示如何在该类内部触发事件并修改生命周期状态。\n\
  \n在 Project 工具窗口中，右键点击 app -> `java` -> `com.ebookfrenzy.lifecycledemo` 项，选择 `New`\
  \ -> `Kotlin File/Class...` 菜单选项添加新类。在 `Create Class` 对话框中将类命名为 `DemoOwner`，选择 `Class`\
  \ 选项，然后按键盘上的 Return 键。当新的 `DemoOwner.kt` 文件加载到代码编辑器后，对其进行如下修改：\n\n```\npackage com.ebookfrenzy.lifecycledemo\n\
  \nimport androidx.lifecycle.Lifecycle\n\nimport androidx.lifecycle.LifecycleOwner\n\
  \nimport androidx.lifecycle.LifecycleRegistry\n\nclass DemoOwner: LifecycleOwner\
  \ {\n\n}\n```\n\n该类需要一个用自身引用初始化的 `LifecycleRegistry` 实例，以及一个配置为返回 `LifecycleRegistry`\
  \ 实例的 `getLifecycle()` 方法。声明一个变量来存储 `LifecycleRegistry` 引用，一个用于初始化 `LifecycleRegistry`\
  \ 实例的构造函数并添加 `getLifecycle()` 方法：\n\n```\npackage com.ebookfrenzy.lifecycledemo\n\
  \nimport androidx.lifecycle.Lifecycle\n\nimport androidx.lifecycle.LifecycleOwner\n\
  \nimport androidx.lifecycle.LifecycleRegistry\n\nclass DemoOwner: LifecycleOwner\
  \ {\n\n    private val lifecycleRegistry: LifecycleRegistry\n\n    init {\n    \
  \    lifecycleRegistry = LifecycleRegistry(this)\n    }\n\n    override fun getLifecycle():\
  \ Lifecycle {\n        return lifecycleRegistry\n    }\n}\n```\n\n接下来，该类需要通知注册表生命周期状态的变化。可以通过\
  \ `LifecycleRegistry` 对象的 `markState()` 方法标记状态，也可以通过 `handleLifecycleEvent()` 方法触发生命周期事件。自定义类中什么构成状态变化取决于类的用途。在本示例中，我们将添加一些方法，在调用时简单地触发生命周期事件：\n\
  \n```\nfun startOwner() {\n    lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START)\n\
  }\n\nfun stopOwner() {\n    lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_STOP)\n\
  }\n\noverride fun getLifecycle(): Lifecycle {\n    return lifecycleRegistry\n}\n\
  ```\n\n`DemoOwner` 类中的最后一项更改是将 `DemoObserver` 类作为观察者添加。此调用将在构造函数如下执行：\n\n```\ninit\
  \ {\n    lifecycleRegistry = LifecycleRegistry(this)\n    lifecycle.addObserver(DemoObserver())\n\
  }\n```\n\n将 `MainFragment.kt` 文件加载到代码编辑器，找到 `onActivityCreated()` 方法，并添加代码创建 `DemoOwner`\
  \ 类的实例并调用 `startOwner()` 和 `stopOwner()` 方法。请注意，添加 `DemoObserver` 作为观察者的调用已被移除。虽然一个观察者可以与多个所有者一起，但在这种情况下将其移除是为了避免在\
  \ Logcat 工具窗口中产生重复且混淆的输出：\n\n```\nimport com.ebookfrenzy.lifecycledemo.DemoOwner\n\
  \nprivate lateinit var demoOwner: DemoOwner\n\noverride fun onActivityCreated(savedInstanceState:\
  \ Bundle?) {\n    super.onActivityCreated(savedInstanceState)\n    viewModel = ViewModelProviders.of(this).get(MainViewModel::class.java)\n\
  \    demoOwner = DemoOwner()\n    demoOwner.startOwner()\n    demoOwner.stopOwner()\n\
  \    lifecycle.addObserver(DemoObserver())\n}\n```\n\n## 46.6 测试自定义生命周期所有者\n\n最后一次构建并运行应用，参考\
  \ Logcat 工具窗口并确认观察者按照以下顺序检测到创建、启动和停止生命周期事件：\n\n`onCreate`\n`CREATED`\n`onStart`\n\
  `STARTED`\n`onStop`\n`CREATED`\n\n注意，尽管没有添加代码，但“created”状态变化仍被触发了。\n\n## 46.7 总结\n\
  \n本章演示了在 Android 应用中实现生命周期感知实用步骤，包括创建生命周期所有者以及设计和实现观察者。\n\n# 47. 导航组件概览\n\n如今的 Android\
  \ 应用很少只有一个屏幕。事实上，大多数应用都包含多个屏幕，用户通过这些屏幕进行导航。在 Android Jetpack 引入之前，应用内的导航实现很大程度上是一个手动过程，没有简单的方法来处理复杂的导航路径。然而，随着导航组件的引入以及\
  \ Android Studio 对导航图的支持，这种情况得到了显著改善。\n\n## 47.1 理解导航\n\n每个应用在启动后都有一个屏幕（启动屏是应用加载时临时显示的屏幕）。从主屏幕开始，用户通常会执行任务导致其他屏幕的出现。这些屏幕通常以应用内其他\
  \ Activity 或 Fragment 的形式存在。例如，一个消息应用可能有一个列出消息的主屏幕，用户可以导航到联系人列表或设置屏幕。联系人列表屏幕可能允许用户导航到可以添加新用户或更新现有联系人的屏幕。图中，应用的导航图可以如图\
  \ 47-1 所示：\n\n(Images/jetpack_navigation_graph.png)\n\n图 47-1\n\n构成应用的每个屏幕（包括主屏幕）被称为目标，通常是\
  \ Fragment 或 Activity。Android 导航架构使用导航栈来跟踪用户遍历位置的路径。当应用首次启动时，主屏幕是第一个放入栈中的目标，并成为当前目标。当用户导航到另一个目标时，该屏幕成为当前目标并推入主屏幕之上。图\
  \ 47-2 显示了假设消息应用导航到“添加联系人”屏幕时导航栈的当前状态：\n\n(Images/jetpack_navigation_stack.png)\n\
  \n图 47-2\n\n当用户使用系统返回键返回屏幕时，每个目标都会从栈中弹出，直到主屏幕再次成为栈上的唯一目标。在图 47-3 中，用户已从添加联系人屏幕返回，将其弹出栈并使联系人列表屏幕成为当前目标：\n\
  \n(Images/jetpack_navigation_stack_pop.png)\n\n图 47-3\n\n处理目标间导航和管理导航栈的所有工作由导航控制器处理，导航控制器由\
  \ `NavController` 类表示。\n\n\n\n\n\n导航宿主（Navigation host）是一个特殊的片段（`NavHostFragment`），它嵌入到\
  \ activity 的用户界面布局中，并作为用户导航到目的地的占位符。例如，图 47-4 显示了一个典型的 activity 屏幕并高亮了由导航宿主片段表示的区域：\n\
  \n![](img/jetpack_navigation_navhost.png)\n\n图 47-4\n\n可以在 Android Studio 布局编辑器中通过从调色板的容器（Containers）部分拖放实例，或者通过如下所示手动编辑\
  \ XML，将 `NavHostFragment` 放置到 activity 布局中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<FrameLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/container\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\">\n    <fragment\n        android:id=\"@+id/demo_nav_host_fragment\"\
  \n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\n      \
  \  android:layout_width=\"match_parent\"\n        android:layout_height=\"match_parent\"\
  \n        app:defaultNavHost=\"true\"\n        app:navGraph=\"@navigation/navigation_graph\"\
  \ />\n</FrameLayout>\n```\n\n上述导航宿主片段元素中的注意点是：`name` 属性中对 `NavHostFragment` 的引用、`defaultNavHost`\
  \ 设置为 `true` 以及将包含导航图的文件分配给 `navGraph` 属性。\n\n当 activity 启动时，此导航宿主片段将被导航图中指定的首页目的地所替换。当用户在应用屏幕之间导航时，宿主片段将被对应目的地的适当片段所替换。\n\
  \n## 47.3 导航图\n\n导航图是一个 XML 文件，包含了包含在应用导航中的目的地。除了这些目的地外，该文件还包含定义目的地之间导航的动作（actions），以及用于从一个目的地传递数据到另一个目的地的可选参数（arguments）。Android\
  \ Studio 了一个导航图编辑器，可用于可视化或通过手动编辑 XML 来设计图并实现动作。\n\n图 47-5 显示了设计模式下的 Android Studio\
  \ 导航图编辑器：\n\n![](img/jetpack_navigation_editor.png)\n\n图 47-5\n\n目的地列表（A）提供了图中当前包含的所有目的地的列表。从列表中选择一个目的地将定位并选中图中的相应目的地（这对于在大型图中定位特定目的地特别有用）。导航图面板（B）为每个目的地都包含一个对话框，显示用户界面布局的表示。在例示例中，此图包含两个名为\
  \ `mainFragment` 和 `secondFragment` 的目的地。目的地之间的箭头（C）代表导航动作连接。可以通过将鼠标指针悬停在起点边缘直到出现一个圆圈，然后从圆圈点击并拖动到目的地来添加动作。属性面板（D）允许查看和修改当前选中的目的地或动作连接的属性。在上面的图中，显示了动作的属性。通过点击标记为\
  \ E 的按钮并从菜单中选择选项可以添加新目的地。可以选择添加现有的片段或 activity 作为目的地，也可以创建新的空白片段目的地。\n\n可以通过将编辑器切换到代码模式来查看和修改导航图的底层\
  \ XML。接下来的 XML 列表代表了上方 图 47-5 所示所示目的地和动作连接的导航图：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"main_fragment\"\n        tools:layout=\"@layout/main_fragment\"\
  >\n        <action\n            android:id=\"@+id/action1\"\n            app:destination=\"\
  @id/secondFragment\" />\n    </fragment>\n</navigation>\n```\n\n## 47.4 导航控制器\n\n\
  从一个目的地导航到另一个目的地通常是为了响应应用内的某种事件，例如按钮点击。在触发导航动作之前，代码必须先获取导航控制器（navigation controller）的引用。这需要调用\
  \ `Navigation` 或 `NavHostFragment` 类的 `findNavController()` 方法。例如，可以使用以下代码访问 activity\
  \ 的导航控制器。注意，为了使代码生效，activity 必须包含导航宿主：\n\n```kotlin\nval controller: NavController\
  \ = Navigation.findNavController(activity, R.id.demo_nav_host_fragment)\n```\n\n\
  在这种情况下，方法传递了 activity 的引用和嵌入 activity 布局的 `NavHostFragment` 的 id。\n\n或者，也可以通过将将视图传递给方法来识别与视图关联的导航控制器：\n\
  \n```kotlin\nval controller: NavController = Navigation.findNavController(button)\n\
  ```\n\n最后的选项是通过调用 `NavHostFragment` 类的 `findNavController()` 方法并传递片段的引用来查找片段的导航控制器：\n\
  \n```kotlin\nval controller: NavController = NavHostFragment.findNavController(fragment)\n\
  ```\n\n## 47.5 触发导航动作\n\n一旦找到导航控制器，就可以通过调用控制器的 `navigate()` 方法并传递要执行动作的资源 id 来触发导航动作。例如：\n\
  \n```kotlin\ncontroller.navigate(R.id.goToContactsList)\n```\n\n动作的 id 是在导航图编辑器选中动作连接时在属性面板中定义的。\n\
  \n## 47.6 传递参数\n\n在导航动作期间，可以使用在导航图中定义的参数（arguments）将数据从一个目的地传递到另一个目的地。参数由名称、类型和可选的默认值组成，可以在\
  \ XML 中手动添加，也可以在图中选中动作箭头或目的地时使用属性面板添加。例如，在图 47-6 中，声明了一个名为 `contactsCount` 的整数参数，默认值为\
  \ 0：\n\n一旦添加，参数将放置在接收目的地的 XML 元素中，例如：\n\n```xml\n<fragment\n    android:id=\"@+id/secondFragment\"\
  \n```\n\n\n\n\n\n```xml\n<fragment\n    android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n    android:label=\"fragment_second\"\n    tools:layout=\"@layout/fragment_second\"\
  \ >\n    <argument\n        android:name=\"contactsCount\"\n        android:defaultValue=0\n\
  \        app:type=\"integer\" />\n</fragment>\n```\n\n导航架构组件（Navigation Architecture\
  \ Component）提供了两种在目的地之间传递数据的技术。一种方法是将数据放入 `Bundle` 对象中，在执行操作（action）时将其传递给目的地，然后在目的地处进行解包并提取参数。\n\
  \n这种特定方法的主要缺点是它不是“类型安全的”（type safe）。换句话说，如果接收端目的地将参数处理为与声明不同的类型（例如，将字符串处理为整数），编译器将不会捕获此此错误，并可能在运行时引发问题。\n\
  \n更好的选择（也是本书所采用的方法）是使用 `safeargs`。`safeargs` 是 Android Studio Gradle 构建系统的一个插件，它能够自动生成特殊类，允许以类型安全的方式传递参数。下一章将描述并演示\
  \ `safeargs` 的参数传递方法（“An Android Jetpack Navigation Component Tutorial”）。\n\n##\
  \ 47.7 Summary\n\n在 Android 应用用户界面语境下，“导航”（Navigation）一词指的是用户在不同屏幕之间来回移动。曾经实现这一点非常耗时且难以组织，现在\
  \ Android Studio 和导航架构组件使得在 Android 项目中实现和管理导航变得更容易。\n\n应用中的不同屏幕被称为目的地（destinations），通常由片段（fragments）或活动（activities）表示。所有应用都有主目的地（home\
  \ destination），包括应用首次加载时显示的屏幕。该布局的内容区域被导航主机片段（navigation host fragment）取代，当用户导航应用时，该片段与其他目的地片段进行切换。导航路径由导航图文件定义，该文件由目的地、连接它们的操作（actions）以及目的地之间传递的任何参数组成。导航由导航控制器（navigation\
  \ controllers）处理，它们除了管理导航栈外，还提供了从应用代码启动导航操作的方法。\n\n# 48. An Android Jetpack Navigation\
  \ Component Tutorial\n\n上一章介绍了 Android Jetpack 导航组件以及它如何与 Android Studio 的导航图表功能集成，从而为\
  \ Android 应用屏幕之间实现导航提供了一种简单的方法。在本章中，将创建一个新的 Android Studio 项目，利用这些导航功能实现一个包含多个屏幕的简单应用。除了演示\
  \ Android Studio 导航图编辑器的使用外，示例项目还将实现使用类型安全参数在源屏幕和目的地屏幕之间传递数据。\n\n## 48.1 Creating\
  \ the NavigationDemo Project\n\n从欢迎界面选择“Start a new Android Studio project”（启动一个新的\
  \ Android Studio 项目）快速启动选项，在生成的新项目对话框中，点击 Next（下一步）按钮之前选择 Fragment + ViewModel 模板。\n\
  \n在 Name 字段中输入 `NavigationDemo`，并指定 `com.ebookfrenzy.navigationdemo` 为包名。在点击 Finish（完成）按钮之前，将\
  \ Minimum API level 级别设置更改为 `API 26: Android 8.0 (Oreo)`，并将 Language 菜单设置为 Kotlin。\n\
  \n## 48.2 Adding Navigation to the Build Configuration\n\n默认情况下，新的 Android Studio\
  \ 项目在构建配置文件中包含导航组件库。因此，在执行任何其他任务之前，第一步是修改 app 级别的 `build.gradle` 文件。在项目工具窗口中找到该文件（`Gradle\
  \ Scripts -> build.gradle (Module: app)`），双击它将其加载到代码编辑器中，并修改 dependencies 部分添加导航库：\n\
  \n```gradle\ndependencies {\n    implementation 'androidx.navigation:navigation-fragment-ktx:2.2.1'\n\
  \    implementation 'androidx.navigation:navigation-ui-ktx:2.2.1'\n}\n```\n\n注意，自本书出版以来，这些库可能已经发布了更新版本。要识别并使用更新版本的库，请将上述行添加到构建文件中，然后打开\
  \ Project Structure 对话框（`File -> Project Structure...`）。在 Project Structure 对话框中，选择\
  \ Suggestions 选项以显示可用更新。如果有新的库版本，点击 Update 按钮以确保在点击 Apply（应用）按钮之前 `build.gradle`\
  \ 文件使用了最新版本：\n\n![](img/as_3.4_project_structure_suggestions.png)\n图 48-1\n\n在文件中添加导航依赖项后，点击\
  \ `Sync Now` 链接重新同步项目的构建配置。\n\n## 48.3 Creating the Navigation Graph Resource File\n\
  \n在构建配置中添加了导航库后，现在可以向项目添加导航图资源文件了。正如 “An Overview of the Navigation Architecture\
  \ Component” 所述，这是一个 XML 文件，包含了用户可以导航的片段和活动，以及执行转换的操作以及在目的地之间传递的任何数据。\n\n在 Project\
  \ 工具窗口中，找到 `res` 文件夹（`app -> res`），右键点击并选择 `New -> Android Resource File` 菜单选项：\n\
  \n![](img/as_3.2_navigation_new_resource_menu.png)\n图 48-2\n\n选择菜单项后，将 New Resource\
  \ File 对话框。在此对话框中，将文件命名为 `navigation_graph`，并按照 Figure 48-3 所示将 Resource type 更改为\
  \ Navigation，然后点击 OK 按钮创建文件。\n\n![](img/as_3.2_navigation_new_file.png)\n图 48-3\n\
  \n导航图资源文件添加到项目后，它将出现在主面板中，准备好添加目的地。在添加任何目的地之前，将编辑器切换到 Code 模式并查看图表的 XML：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    android:id=\"@+id/navigation_graph\"\
  >\n\n</navigation>\n```\n\n将编辑器切换回 Design 模式，注意目的地面板中的 Host 部分显示项目中未检测到主机片段：\n\n\
  ![](img/as_3.2_navigation_no_hosts.png)\n图 48-4\n\n在导航图中添加任何目的地之前，下一步是向项目添加导航主机片段。\n\
  \n## 48.4 Declaring a Navigation Host\n\n在本项目中，导航主机片段将包含在主活动的布局中。这意味着导航图中的目的地片段将出现在当前由\
  \ `main_fragment.xml` 布局占据的应用内容区域。在项目工具窗口中找到活动布局文件（`app -> res -> layout -> main_activity.xml`）并将其加载到布局编辑器中。\n\
  \n当布局编辑器处于 Design 模式时，从 Palette 的 Containers 部分拖入 `NavHostFragment` 元素，将其释放到活动布局的容器区域，如\
  \ Figure 48-5 中的箭头所示：\n\n![](img/as_3.6_add_navhostfragment.png)\n图 48-5\n\n在生成的\
  \ Navigation Graphs 对话框中，选择上一节创建的 `navigation_graph.xml` 文件并点击 OK 按钮。\n\n在布局中选中新添加的\
  \ `NavHostFragment` 实例，使用 Attributes 工具窗口将元素的 ID 更改为 `demo_nav_host_fragment`。\n\
  \n\n\n将布局编辑器切换到 Code 模式并检查 XML 文件。注意，编辑器已正确配置导航图属性以引用 `navigation_graph.xml` 文件，且\
  \ `defaultNavHost` 属性已设置为 true：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<FrameLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\n\
  \    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/container\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    tools:context=\".MainActivity\"\
  \ >\n    <fragment\n        android:id=\"@+id/demo_nav_host_fragment\"\n       \
  \ android:name=\"androidx.navigation.fragment.NavHostFragment\"\n        android:layout_width=\"\
  match_parent\"\n        android:layout_height=\"match_parent\"\n        app:defaultNavHost=\"\
  true\"\n        app:navGraph=\"@navigation/navigation_graph\" />\n</FrameLayout>\n\
  ```\n\n在主活动布局文件中配置了 `NavHostFragment` 后，需要从 `MainActivity.kt` 类文件中删除一些代码，以防止 Activity\
  \ 在运行时加载 `main_fragment.xml` 文件。将此文件加载到代码编辑器，找到 `onCreate()` 方法并删除负责显示主 fragment\
  \ 的代码：\n\n```kotlin\noverride fun onCreate(savedInstanceState: Bundle?) {\n    super.onCreate(savedInstanceState)\n\
  \    setContentView(R.layout.main_activity)\n    if (savedInstanceState == null)\
  \ {\n        supportFragmentManager.beginTransaction()\n            .replace(R.id.container,\
  \ MainFragment.newInstance())\n            .commitNow()\n    }\n}\n```\n\n返回 `navigation_graph.xml`\
  \ 文件并确认已检测到 `NavHostFragment` 实例（在更改生效之前，可能需要关闭并重新打开文件）：\n\n![](img/as_3.6_navhostfragment_in_graph.png)\n\
  图 48-6\n\n## 48.5 添加导航目的地\n\n留在导航图中，现在是时候添加第一个目的地了。由于项目已经有一个用于第一个屏幕的 fragment（`main_fragment.xml`），这将是要添加到图中的第一个目的地。点击图\
  \ 48-7 中突出显示的新目的地按钮来选择或创建目的地：\n\n![](img/as_3.6_nav_graph_new_destination.png)\n\
  图 48-7\n\n选择 `main_fragment` 作为目的地，使其显示在导航图中：\n\n![](img/as_3.4_navigation_destination_added.png)\n\
  图 48-8\n\n位于目的地节点上方的房屋图标表示这是起始目的地。这意味着当包含 `NavHostFragment` 的 Activity 创建时，该目的地将是第一个显示的。要将起始目的地更改为另一个目的地，请选择图中的该节点并点击位于属性（Attributes）工具窗口的设置起始目的地（Set\
  \ Start Destination）按钮。\n\n通过将编辑器切换到 Code 模式检查导航图的 XML 内容：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"main_fragment\"\n        tools:layout=\"@layout/main_fragment\"\
  \ />\n</navigation>\n```\n\n在执行任何导航之前，图至少还需要另一个目的地。这次，将使用导航图编辑器来创建一个新的空白目的地。切换回\
  \ Design 模式并再次点击新目的地（New Destination）按钮，这次选择创建目的地（Create destination）。在弹出的对话框中，将\
  \ fragment 命名为 `SecondFragment`。稍短延迟后，新 fragment 将作为另一个目的地出现在图中：\n\n![](img/as_3.6_nav_destination.png)\n\
  图 48-9\n\n## 48.6 设计目的地布局\n\n在添加用于在目的地之间跳转的动作（actions）之前，是为 fragment 添加一些用户界面的好时机。双双击\
  \ `mainFragment` 目的地，使 `main_fragment.xml` 加载到编辑器中。选择并删除默认的 `TextView`，然后将一个 `Button`\
  \ 拖放到布局中，使其位置如图 48-10 所示：\n\n![](img/as_3.5_nav.png)\n图 48-10\n\n视图位置确定后，点击 Infer\
  \ 按钮以添加任何约束。选中 `TextView` 后，使用属性窗口将 ID 更改为 `userText`。返回 `navigation_graph.xml`\
  \ 并双击 `SecondFragment` 将 `fragment_second.xml` 加载到编辑器中，然后选择并删除 `TextView`。在组件树（Component\
  \ Tree）中，右键点击 `FrameLayout` 并选择从 `FrameLayout` 转换为 `ConstraintLayout` 选项，接受弹出对话框中的默认设置：\n\
  \n![](img/as_3.2_convert_framayout.png)\n图 48-11\n\n使用属性窗口将 `ConstraintLayout` 的\
  \ ID 更改为 `constraintLayout`。在 fragment 布局转换后，拖放一个新的 `TextView` 使其位于居中，并点击 Infer\
  \ 按钮添加任何约束。选中 `TextView` 后，将其 ID 更改为 `arg`。\n\n## 48.7 为导航图添加动作\n\n现在两个目的地已添加到图中并设计了相应的用户界面，项目现在需要一种从主\
  \ fragment 导航到第二个的方法。这将通过向图中添加动作来实现，动作可以在代码中引用。\n\n要建立以主 fragment 为起点、第二个 fragment\
  \ 为目的地的动作连接，打开导航图并将鼠标指针悬停在 `mainFragment` 目的地的垂直边缘，如图 48-12 所示：\n\n![](img/as_3.2_navigation_circle.png)\n\
  图 48-12\n\n点击圆内部并将连线拖到 `SecondFragment` 目的地：\n\n![](img/as_3.2_navigation_circle_connect.png)\n\
  图 48-13\n\n释放连线以建立起点和目的地之间的动作连接，此时线条将变为箭头，如图 48-14 所示：\n\n![](img/as_3.2_navigation_arrow.png)\n\
  图 48-14\n\n可以随时通过选择动作并按下键盘 Delete 键来删除。选中箭头后，查看属性窗口中的可用属性并将 ID 更改为 `mainToSecond`。这是代码引用引用动作的\
  \ ID。将编辑器切换到 Code 模式，注意动作已包含在 XML 中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/mainFragment\">\n    <action\n        android:id=\"\
  @+id/mainToSecond\"\n        app:destination=\"@id/SecondFragment\" />\n    <fragment\n\
  \        android:id=\"@+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"main_fragment\"\n        tools:layout=\"@layout/main_fragment\"\
  \ />\n</navigation>\n```\n\n\n\n\n\n```xml\n<fragment\n    android:id=\"@+id/mainFragment\"\
  \n    android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\n   \
  \ android:label=\"main_fragment\"\n    tools:layout=\"@layout/main_fragment\" >\n\
  \    <action\n        android:id=\"@+id/mainToSecond\"\n        app:destination=\"\
  @id/secondFragment\" />\n</fragment>\n\n<fragment\n    android:id=\"@+id/secondFragment\"\
  \n    android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\n    android:label=\"\
  fragment_second\"\n    tools:layout=\"@layout/fragment_second\" />\n```\n\n## 48.8\
  \ 实现 OnFragmentInteractionListener\n\n在添加触发动作的代码之前，需要修改 `MainActivity` 类以实现 `OnFragmentInteractionListener`\
  \ 接口。该接口是在导航图编辑器中创建空白 fragment 时，在 `SecondFragment` 类内部生成的。为了符合该接口，activity 需要实现一个名为\
  \ `onFragmentInteraction()` 的方法，该方法用于实现 fragment 与 activity 之间的通信。\n\n编辑 `MainActivity.kt`\
  \ 文件并进行修改如下：\n\n```kotlin\nimport android.net.Uri\n\nclass MainActivity : AppCompatActivity(),\n\
  \    SecondFragment.OnFragmentInteractionListener {\n    override fun onCreate(savedInstanceState:\
  \ Bundle?) {\n        super.onCreate(savedInstanceState) own        setContentView(R.layout.main_activity)\n\
  \    }\n    override fun onFragmentInteraction(uri: Uri) { own    }\n}\n```\n\n\
  如果 Android Studio 报告 `OnFragmentInteractionListener` 未定义（某些版本的 Android Studio 会自动添加它，而其他版本则不会），请编辑\
  \ `SecondFragment.kt` 文件并如下添加：\n\n```kotlin ownimport android.net.Uri\n\nclass SecondFragment\
  \ : Fragment() {\n    interface OnFragmentInteractionListener {\n        // TODO:\
  \ 更新参数类型和名称\n        fun onFragmentInteraction(uri: Uri)\n    }\n}\n```\n\n## 48.9\
  \ 触发动作\n\n现在动作已经添加到导航图中，下一步是在主 fragment 中添加一些代码，以便在点击 `Button` 挂件时触发该动作。找到 `MainFragment.kt`\
  \ 文件，将其加载到代码编辑器中并修改 `onActivityCreated()` 方法，获取按钮实例的引用，并配置一个 `onClickListener` 实例，在用户点击按钮时调用：\n\
  \n```kotlin\nimport androidx.navigation.Navigation\nimport kotlinx.android.synthetic.main.main_fragment.*\n\
  \nclass MainFragment : Fragment() {\n    override fun onActivityCreated(savedInstanceState:\
  \ Bundle?) {\n        super.onActivityCreated(savedInstanceState)\n        viewModel\
  \ = ViewModelProviders.of(this).get(MainViewModel::class.java)\n        button.setOnClickListener\
  \ {\n            Navigation.findNavController(it).navigate(\n                R.id.mainToSecond)\n\
  \        }\n    }\n}\n```\n\n上述代码获取了导航器的引用，并在实例上调用了 `navigate()` 方法，将导航动作的资源 ID\
  \ 作为参数传递。\n\n编译并运行应用，验证点击主 fragment 中的按钮是否跳转到第二个 fragment。\n\n作为这种设置监听器方法的替代方案，`Navigation`\
  \ 类还包含一个名为 `createNavigateOnClickListener()` 的方法，它提供了一种更高效的方法来设置监听器并导航到目的地。因此，可以使用以下单行代码启动跳转：\n\
  \n```kotlin\nbutton.setOnClickListener(Navigation.createNavigateOnClickListener(\n\
  \    R.id.mainToSecond))\n```\n\n## 48.10 使用 Safeargs 传递数据\n\n本教程的下一个目标是将输入的 `EditText`\
  \ 中的文本传递到第二个 fragment 并在那里显示。如上一节所述，Android Navigation 组件支持两种传递方法。本章将重点介绍安全传递（safe\
  \ passing）。\n\n使用 `safeargs` 的第一步是将插件添加到 Gradle 配置中。使用 `Project` 工具窗口，找到并编辑项目层级的\
  \ `build.gradle` 文件，将插件添加到 `dependencies` 中（请注意现在可能有更新的版本可用）：\n\n```gradle\nbuildscript\
  \ {\n    ext.kotlin_version = '1.3'\n    repositories {\n        google()\n    \
  \    jcenter()\n    }\n    dependencies {\n        classpath 'com.android.tools.build:gradle:3.6'\n\
  \        classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version\"\
  \n        classpath \"androidx.navigation:navigation-safe-args-gradle:2.3.0\"\n\
  \    }\n}\n```\n\n接下来，编辑 app 级别的 `build.gradle` (Module: App) 如下应用插件，并在提示时重新同步项目：\n\
  \n```gradle\napply plugin 'com.android.application'\napply plugin 'androidx.navigation.safeargs'\n\
  \nandroid {\n}\n```\n\n下一步是定义目的地（在本例中为第二个 fragment）接收的任何参数。编辑导航图，选择 `secondFragment`\
  \ 目的地，并在 Attributes 窗口中找到 `Arguments` 部分。点击 `+` 按钮添加新参数。将参数命名为 `message`，将类型设置为\
  \ `String` 并在默认值中输入 `No Message`。\n\n新配置的参数将如下出现在 `navigation_graph.xml` 文件的 `secondFragment`\
  \ 元素中：\n\n```xml\n<fragment\n    android:id=\"@+id/secondFragment\"\n    android:name=\"\
  com.ebookfrenzy.navigationdemo.SecondFragment\"\n    android:label=\"fragment_second\"\
  \n    tools:layout=\"@layout/fragment_second\" >\n    <argument\n        android:name=\"\
  message\"\n        android:defaultValue=\"No Message\"\n        app:argType=\"string\"\
  \ />\n</fragment>\n```\n\n接一步是在 `MainFragment.kt` 中添加代码，以从 `EditText` 提取文本并在导航动作期间将其传递给第二个\
  \ fragment。这将涉及使用由 `safeargs` 插件自动生成的特殊导航类。目前导航涉及 `MainFragment` 类、`SecondFragment`\
  \ 类、名为 `mainToSecond` 的导航动作以及名为 `message` 的参数。\n\n构建项目时，`safeargs` 插件将生成以下额外类，用于在导航期间传递和接收参数：\n\
  \n- `MainFragmentDirections`：该类代表导航动作的起点（使用导航源类名加上 \"Directions\"），并提供对动作对象的访问。\n\
  - `ActionMainToSecond`：代表执行跳转的动作类（根据导航图文件中分配给动作的 ID 命名，并加上 \"Action\"）。该类为目的地配置的每个参数包含一个\
  \ setter 方法。例如，由于第二个 fragment 目的地包含名为 `message` 的参数，该类包含一个名为 `setMessage()` 方法。配置完成后，将该类的实例传递给导航控制器的\
  \ `navigate()` 方法即可导航到目的地。\n\n\n\n\n\n- `SecondFragmentArgs` - 在目标 fragment 中使用的类，用于访问从源端传递的参数（使用导航目的地类名并在末尾附加“Args”来命名）。该类为传递到目的地的每个参数都包含一个\
  \ getter 方法（例如 `getMessage()`）。\n\n使用这些类，可以对 `MainFragment.kt` 文件中 `onActivityCreated()`\
  \ 方法内的 `onClickListener` 代码进行如下修改，以从 `EditText` 控件中提取当前文本，将其应用于操作（action）并启动到第二个\
  \ fragment 的过渡：\n\n```kotlin\nbutton.setOnClickListener {\n    var action: MainFragmentDirections.MainToSecond\
  \ =\n        MainFragmentDirections.mainToSecond()\n    action.setMessage(userText.text.toString())\n\
  \    Navigation.findNavController(it).navigate(action)\n}\n```\n\n上述代码获取 action\
  \ 对象的引用，使用 `setMessage()` 方法设置消息参数字符串，然后调用导航控制器的 `navigate()` 方法并传递 action 对象。\n\
  \n剩下的工作是修改 `SecondFragment.kt` 类文件，以便在导航执行后接收参数并显示在 `TextView` 控件上。在本例中，将使用 `onStart()`\
  \ 生命周期方法添加实现这些任务的代码。编辑 `SecondFragment.kt` 文件并添加该方法，使其内容如下：\n\n```kotlin\nimport\
  \ kotlinx.android.synthetic.main.fragment_second.*\n\noverride fun onStart() {\n\
  \    super.onStart()\n    arguments?.let {\n        var args = SecondFragmentArgs.fromBundle(it)\n\
  \        argText.text = args.message\n    }\n}\n```\n\n上述方法代码首先获取 `TextView` 控件的引用。接下来，调用\
  \ `SecondFragmentArgs` 类的 `fromBundle()` 方法来从源端提取 `SecondFragmentArgs` 对象。由于示例中的参数在\
  \ `navigation_graph.xml` 文件中命名为 `message`，因此在 `args` 对象上调用相应的 `getMessage()` 方法以获取字符串值。然后将该字符串显示在\
  \ `TextView` 控件上。\n\n编译并运行应用，在点击 `Button` 控件之前输入一些文本。当第二个 fragment 目的地出现时，`TextView`\
  \ 现在应该显示在主 fragment 中输入的文本，表明数据已成功在导航目的地之间传递。\n\n## 48.11 总结\n\n本章提供了一个实用示例，展示了如何使用导航架构组件（Navigation\
  \ Architecture Component）结合 Android Studio 导航图编辑器实现 Android 应用导航。涵盖的主题包括创建包含现有和新目的地\
  \ fragment 的导航图、在 activity 布局中嵌入宿主 fragment（host fragment）、编写触发导航事件的代码以及使用 Gradle\
  \ `safeargs` 插件在目的地之间传递参数。\n\n# 49. 在 Android 上创建和管理溢出菜单\n\n用户界面设计中一个书中尚未涵盖的领域与\
  \ Android 应用程序菜单（menus）的概念有关。菜单提供了一种机制，可以在用户界面布局中存在的视图组件之外为用户提供额外的选择。虽然 Android\
  \ 开发者可以使用多种不同的菜单系统，但本章将重点介绍更常用的溢出菜单（Overflow menu）。本章将涵盖如何通过 XML 手动创建菜单以及使用 Android\
  \ Studio 布局编辑器工具可视化地创建菜单。\n\n## 49.1 溢出菜单\n\n溢出菜单（也称为选项菜单 options menu）是用户可以通过设备屏幕访问的菜单，允许开发者包含应用程序界面中包含之外的其它应用程序选项。溢出菜单的位置取决于设备运行的\
  \ Android 版本。从 Android 4.0 及更高版本开始，溢出菜单按钮位于操作栏的右上角，由三个正方形堆叠图标表示：\n\n![](img/Image24253.png)\n\
  \n图 49-1\n\n## 49.2 创建溢出菜单\n\n菜单中的项可以在 XML 文件中声明，然后根据需要加载（inflate）并显示给用户。这涉及使用 `<menu>`\
  \ 元素，其中每个菜单项包含一个 `<item>` 子元素。例如，下面的 XML 定义了一个由两个与颜色选择相关的菜单项组成的菜单：\n\n```xml\n<menu\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    tools:context=\".MainActivity\" >\n    <item\n        android:id=\"@+id/menu_red\"\
  \n        android:ordinal=\"1\"\n        app:showAsAction=\"never\"\n        android:title=\"\
  @string/red\"/>\n    <item\n        android:id=\"@+id/menu_green\"\n        android:ordinal=\"\
  2\"\n        app:showAsAction=\"never\"\n        android:title=\"@string/green\"\
  />\n</menu>\n```\n\n在上述 XML 中，`android:ordinal` 属性决定了项出现的顺序。相反，`app:showAsAction`\
  \ 属性控制项作为操作项显示的条件。例如，如果设置为 `if`，该项将出现在操作栏（action bar）中。\n\n![](img/Image434.png)\n\
  \n图 49-2\n\n应节慎使用此属性以避免操作栏拥挤。默认情况下，Android Studio 在创建新的 Android 项目时会创建一个菜单 XML 文件。该文件位于\
  \ `app -> menu` 文件夹，并包含一个名为“Settings”的单个菜单项：\n\n```xml\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    tools:context=\".MainActivity\">\n    <item\n\
  \        android:id=\"@+id/action_settings\"\n        android:title=\"@string/action_settings\"\
  \n        android:ordinal=\"100\"\n        app:showAsAction=\"never\" />\n</menu>\n\
  ```\n\n此菜单已配置为在用户在界面上选择溢出菜单时显示，因此只需根据需要对其进行修改。\n\n## 49.3 显示溢出菜单\n\n溢出菜单通过重写对应方法的\
  \ `onCreateOptionsMenu()` 方法并加载菜单 XML 文件来创建。例如，以下代码创建了名为 `menu_main` 的 XML 文件中的菜单：\n\
  \n```kotlin\noverride fun onCreateOptionsMenu(menu: Menu): Boolean {\n    menuInflater.inflate(R.menu.menu_main,\
  \ menu)\n    return true\n}\n```\n\n与菜单 XML 文件一样，Android Studio 已在新创建的 Android 应用中重写了此方法。如果\
  \ activity 不需要溢出菜单，请删除或注释此方法。\n\n## 49.4 响应菜单项选择\n\n一旦实现了菜单，问题在于应用程序如何在用户选择菜单项时接收通知。activity\
  \ 接收菜单选择通知只需要重写 `onOptionsItemSelected()` 方法。作为参数传递给该方法的是所选菜单项的引用。然后可以调用该项目的 `getItemId()`\
  \ 方法来获取 ID，该 ID 可用于识别选择了哪一个项。例如：\n\n```kotlin\noverride fun onOptionsItemSelected(item:\
  \ MenuItem): Boolean {\n    when (item.itemId) {\n        R.id.menu_red -> {\n \
  \           return true\n        }\n        R.id.menu_green -> {\n```\n\n\n\n\n\n\
  ```kotlin\n        return true\n        }\n    else -> return super.onOptionsItemSelected(item)\n\
  \    }\n}\n```\n\n## 49.5 创建可检查项组\n\n除了配置独立的菜单项外，还可以创建菜单项组。这在创建可检查菜单项时特别有用，因为在任何时候只能从多个选项中选择一个。可以通过将菜单项封装在\
  \ `<group>` 标签中将将其分配给一个组。使用 `android:checkableBehavior` 属性将组声明为可检查，将其值设置为 `single`、`all`\
  \ 或 `none`。以下 XML 声明了两个菜单项组成一个组，其中在任何给定时间只能选择其中一项：\n\n```xml\n<menu xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <group android:checkableBehavior=\"single\">\n        <item\n           \
  \ android:id=\"@+id/menu_red\"\n            android:title=\"@string/red_string\"\
  />\n        <item\n            android:id=\"@+id/menu_green\"\n            android:title=\"\
  @string/green_string\"/>\n    </group>\n</menu>\n```\n\n当菜单组被配置为可检查时，菜单中的项旁边会出现一个一个小圆圈，如图图\
  \ 49-3 所示。需要注意的是，此指示器的设置和取消并不是自动发生的。因此，检查和取消勾选菜单项是应用程序的责任。\n\n![](img/Image2441.png)\n\
  图 49-3\n\n继续本章之前使用的颜色示例，其实现方式如下：\n\n```kotlin\noverride fun onOptionsItemSelected(item:\
  \ MenuItem): Boolean {\n    when (item.itemId) {\n        R.id.menu_red -> {\n \
  \           if (item.isChecked)\n                item.isChecked = false\n      \
  \      else\n                item.isChecked = true\n            return true\n  \
  \      }\n        R.id.menu_green -> {\n            if (item.isChecked)\n      \
  \          item.isChecked = false\n            else\n                item.isChecked\
  \ = true\n            return true\n        }\n        else -> return super.onOptionsItemSelected(item)\n\
  \    }\n}\n```\n\n## 49.6 菜单与 Android Studio 菜单编辑器\n\nAndroid Studio 允许通过只需将菜单资源文件加载到菜单编辑器工具中、从调色板拖放菜单元素并设置属性来视觉化设计菜单。这极地简化了菜单设计过程，但需要注意的是，仍然需要在\
  \ `onOptionsItemSelected()` 方法中编写代码来实现菜单行为。\n\n要视觉化设计菜单，请找到菜单资源文件并双击它将其加载到菜单编辑器工具中。例如，图\
  \ 49-4 显示了以设计模式加载到菜单编辑器的基础 Activity 默认菜单资源文件：\n\n![](img/Image24491.png)\n图 49-4\n\
  \n调色板 (A) 包含可以添加到设计区域 (C) 菜单中的项。组件树 (B) 是识别菜单层级结构的有用工具。属性面板 (D) 包含了当前所选项的常用属性子集。“查看所有”链接\
  \ (E) 可用于访问属性的完整列表。可以通过将对象拖放到布局画布或组件树上来向菜单中添加新元素。在布局编辑器工具中处理菜单时，有时将项丢到树上更容易，因为这对项的放置位置提供了更大的控制。这在例如向组中添加项时特别有用。尽管菜单编辑器提供了构建菜单的视觉化方法，但底层的菜单仍然以\
  \ XML 格式存储，可以通过使用上方标记为 F 的标签页从“设计”切换到“代码”来手动查看和编辑。\n\n## 49.7 创建示例\n\n要查看溢出菜单的运行，请从欢迎屏幕选择一个新的\
  \ Android Studio 项目，并在生成的项目对话框中，点击“Next”按钮之前选择“Basic Activity”模板。在点击“Finish”按钮之前，将\
  \ API 级别设置为 `26: Android 8.0 (Oreo)`，语言设置为 `Kotlin`，名称设置为 `Example`，包名设置为 `com.ebookfrenzy.menuexample`。项目完成后，导航到\
  \ `app -> res -> layout` 并双击 `activity_main.xml` 将加载到布局编辑器。\n\n## 49.8 设计菜单\n\n\
  在项目窗口中，找到项目的 `app -> res -> menu -> main.xml` 文件并双击它将其加载到菜单编辑器。如果必要，切换到设计模式并删除由\
  \ Android 添加的默认菜单项。从调色板点击并将菜单组对象拖到布局画布的标题栏上，如图图 49-5 所示：\n\n![](img/as_3_add.png)\n\
  图 49-5\n\n虽然添加了组，但它在布局中是不可见的。要验证元素的存在，请参考组件树，组将列在其中：\n\n![](img/as_3_group_in_tree.png)\n\
  图 49-6\n\n选择组件树中的组项，并在属性面板将 `checkableBehavior` 属性设置为 `single`，以便任何时候只能选择一个组项：\n\
  \n![](img/as_3_menu_setting.png)\n图 49-7\n\n接下来，从调色板拖四个菜单项元素并丢到组件树中的组元素上。选择第一项并在属性面板将标题更改为“Red”，并将\
  \ ID 更改为 `menu_red`：\n\n![](img/as_id_and_title.png)\n图 49-8\n\n对其余三个菜单项重复这些步骤，将标题设置为“Green”、“Yellow”和“Blue”，对应的\
  \ ID 为 `menu_green`、`menu_yellow` 和 `menu_blue`。使用组件树中菜单项右侧的按钮将字符串提取到资源：\n\n![](img/Image2489.png)\n\
  图 49-9\n\n完成这些步骤后，菜单布局应与下方图 49-10 所示：\n\n![](img/Image2498.png)\n图 49-10\n\n将布局编辑器切换到代码模式查看菜单的\
  \ XML 表示，它应该如下：\n\n```xml\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    tools:context=\"com.ebookfrenzy.menuexample.MainActivity\"\
  >\n    <group android:checkableBehavior=\"single\">\n        <item android:title=\"\
  @string/red_string\" android:id=\"@+id/menu_red\" />\n        <item android:title=\"\
  @string/green_string\" android:id=\"@+id/menu_green\" />\n        <item android:title=\"\
  @string/yellow_string\" android:id=\"@+id/menu_yellow\" />\n        <item android:title=\"\
  @string/blue_string\" android:id=\"@+id/menu_blue\" />\n    </group>\n</menu>\n\
  ```\n\n## 49.9 修改 onOptionsItemSelected() 方法\n\n当从菜单中选择项时，应用程序的重写 `onOptionsItemSelected()`\
  \ 方法将被调用。该方法的作用是识别选择了哪个项，并将布局视图的背景更改更改相应的颜色。找到并双击 `app -> java -> com.ebookfrenzy.menuexample\
  \ -> MainActivity` 文件并按如下方式修改方法：\n\n\n\n\n\n```kotlin\npackage com.ebookfrenzy.menuexample\n\
  \nimport kotlinx.android.synthetic.main.content_main.*\n\nclass MainActivity : AppCompatActivity()\
  \ {\n\n    override fun onCreateOptionsMenu(menu: Menu): Boolean {\n        // Inflate\
  \ the menu; this adds items to the action bar if it is present.\n        menuInflater.inflate(R.menu.menu_main,\
  \ menu)\n        return true\n    }\n\n    override fun onOptionsItemSelected(item:\
  \ MenuItem): Boolean {\n        when (item.itemId) {\n            R.id.menu_red\
  \ -> {\n                item.isChecked = !item.isChecked\n                layoutView.setBackgroundColor(android.graphics.Color.RED)\n\
  \                return true\n            }\n            R.id.menu_green -> {\n\
  \                item.isChecked = !item.isChecked\n                layoutView.setBackgroundColor(android.graphics.Color.GREEN)\n\
  \                return true\n            }\n            R.id.menu_yellow -> {\n\
  \                item.isChecked = !item.isChecked\n                layoutView.setBackgroundColor(android.graphics.Color.YELLOW)\n\
  \                return true\n            }\n            R.id.menu_blue -> {\n \
  \               item.isChecked = !item.isChecked\n                layoutView.setBackgroundColor(android.graphics.Color.BLUE)\n\
  \                return true\n            }\n            else -> return super.onOptionsItemSelected(item)\n\
  \        }\n    }\n}\n```\n\n## 49.10 测试应用程序\n在模拟器或物理设备上构建并运行应用程序。使用溢出菜单（overflow\
  \ menu）选择菜单项，并验证布局背景颜色是否发生了相应的变化。请注意，菜单会显示当前选中的颜色。\n\n## 49.11 总结\nAndroid 溢出菜单通过屏幕顶部操作工具栏的最右侧访问。该菜单为应用程序向用户提供额外选项的位置。菜单的结构最容易在\
  \ XML 文件中定义，而 activity 通过重写并实现 `onOptionsItemSelected()` 方法来接收菜单项选择的通知。\n\n### 50\
  \ 使用 Android 过渡框架制作用户界面\nAndroid 过渡框架（Transitions framework）作为 Android 4.4 KitKat\
  \ 版本的一部分引入，旨在让你作为 Android 开发者能够轻松为构成应用程序屏幕的视图添加动画效果。正如本章及后续章节将概述的那样，使用过渡框架时，只需几行代码即可实现动画效果，例如让用户界面中的视图轻轻淡入淡出，并平滑地滑动到屏幕上的新位置。\n\
  \n#### 50.1 介绍 Android 过渡与场景\n过渡允许在应用程序运行时，对用户界面中视图的布局和外观变化进行动画处理。虽然在应用程序代码内部实现过渡有多种方法，但可能最强大的机制涉及对场景（Scenes）的使用。一个场景代表整个用户界面屏幕的整个布局，或者是布局的一个子集（由\
  \ `ViewGroup` 表示）。\n\n要使用这种方法实现过渡，需要定义反映两种不同用户界面状态的场景（这些可以被视为“之前”和“之后”场景）。例如，一个场景可能由位于屏幕顶部的\
  \ `EditText`、`Button` 和 `TextView` 视图组成。第二个场景可能会移除 `Button` 视图，并将剩余的 `EditText`\
  \ 和 `TextView` 对象移动到屏幕底部，为引入 `MapView` 实例留出空间。使用过渡框架，这两个场景之间的变化可以进行动画处理，使得 `Button`\
  \ 淡出消失，`EditText` 和 `TextView` 滑动到新位置，并且地图轻轻地淡入视图。\n\n可以通过代码从 `ViewGroups` 创建场景，也可以在布局资源文件中实现场景，并在应用程序运行时加载到\
  \ `Scene` 实例中。\n\n过渡也可以从应用程序代码内部动态实现。使用这种方法，通过引用 `ViewGroups` 形式的用户界面视图集合来创建场景，然后使用\
  \ `TransitionManager` 类对这些元素执行过渡，该类提供了一系列方法来触发和管理场景之间的过渡。\n\n可能最简单的过渡形式涉及使用 `TransitionManager`\
  \ 类的 `beginDelayedTransition()` 方法。当调用该方法并传递代表场景的 `ViewGroup` 时，对该场景内任何视图的任何后续更改（如移动、调整大小、添加或删除视图）将由过渡框架进行动画处理。\n\
  \n实际的动画由过渡框架通过 `Transition` 类的实例处理。`Transition` 实例负责检测场景内视图的大小、位置和可见性的变化，并相应地对这些变化进行动画处理。\n\
  \n默认情况下，过渡将使用由 `AutoTransition` 类定义的标准进行动画处理。自定义过渡可以通过 XML 过渡文件中的设置创建或直接在代码中创建。多个过渡可以组合在\
  \ `TransitionSet` 中，并配置为并行或顺序执行。\n\n#### 50.2 在过渡中使用插值器（Interpolators）\n过渡框架大量利用了\
  \ Android 动画框架来实现动画效果。在使用过渡时，这一事实在很大程度上是偶然的，因为大部分工作都在后台完成，从而保护了开发者免受动画框架某些复杂性的影响。然而，在使用过渡时，某些关于动画框架的知识是有益的，涉及到插值器（interpolators）的概念。\n\
  \n插值器是 Android 动画框架的一个功能，允许以多种预定义方式修改动画。目前，动画框架提供了以下插值器，所有插值器均可自定义过渡：\n\n- `AccelerateDecelerateInterpolator`:\
  \ 默认情况下，动画以恒定速率执行。可以使用 `AccelerateDecelerateInterpolator` 使动画缓慢开始，在中间加速，然后在序列结束时逐渐减速。\n\
  - `AccelerateInterpolator`: 正如名称所示，`AccelerateInterpolator` 使动画缓慢开始，并以指定的速率加速，在结束时没有减速。\n\
  - `AnticipateInterpolator`: `AnticipateInterpolator` 提供一种类似于弹弓的效果。视图在向正确方向飞出之前，会先向配置的反方向移动一短距离。可以通过指定张力值来控制向后的力量。\n\
  - `AnticipateOvershootInterpolator`: 结合了 `AnticipateInterpolator` 的效果与动画对象越界并返回屏幕上目标位置的效果。\n\
  - `BounceInterpolator`: 使动画视图在到达目标位置时产生弹跳。\n- `CycleInterpolator`: 配置动画按指定的次数重复。\n\
  - `DecelerateInterpolator`: `DecelerateInterpolator` 使动画快速开始，并在接近结束时按指定的因子减速。\n\
  - `LinearInterpolator`: 用于指定动画以恒定速率执行。\n- `OvershootInterpolator`: 使动画视图在返回指定的边界位置之前先越界。可以通过指定张力值来配置越界效果。\n\
  \n正如在本章及随后的章节将演示的那样，插值器既可以在代码和 XML 文件中指定。\n\n#### 50.3 使用场景过渡\n\n\n\n\n场景可以通过 Android\
  \ Studio XML 布局文件的内容来表示。例如，以下 XML 可以用于表示一个在 `RelativeLayout` 父布局内包含三个按钮视图的场景：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<RelativeLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    android:id=\"@+id/RelativeLayout1\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:orientation=\"vertical\" >\n    <Button\n        android:id=\"@+id/button1\"\
  \n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:layout_alignParentLeft=\"true\"\n        android:layout_alignParentTop=\"\
  true\"\n        android:onClick=\"goToScene2\"\n        android:text=\"@string/one_string\"\
  \ />\n    <Button\n        android:id=\"@+id/button2\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:layout_alignParentRight=\"\
  true\"\n        android:layout_alignParentTop=\"true\"\n        android:onClick=\"\
  goToScene1\"\n        android:text=\"@string/two_string\" />\n    <Button\n    \
  \    android:id=\"@+id/button3\"\n        android:layout_width=\"wrap_content\"\n\
  \        android:layout_height=\"wrap_content\"\n        android:layout_centerHorizontal=\"\
  true\"\n        android:layout_centerVertical=\"true\"\n        android:text=\"\
  @string/three_string\" />\n</RelativeLayout>\n```\n\n假设上述布局位于项目 `res/layout` 文件夹下的\
  \ `scene1_layout.xml` 文件中，可以使用 `Scene` 类的 `getSceneForLayout()` 方法将布局加载到场景中。例如：\n\
  \n```kotlin\nval scene1 = Scene.getSceneForLayout(rootContainer, R.layout.scene1_layout,\
  \ this)\n```\n\n注意，该方法的调用需要一个根容器（root container）的引用。它是显示场景的视图层级顶部的视图。\n\n若要在无任何过渡动画的情况下向用户显示场景，可以在场景实例上调用\
  \ `enter()` 方法：\n\n```kotlin\nscene1.enter()\n```\n\n使用默认的 `AutoTransition` 类在两个场景之间进行过渡可以通过\
  \ `TransitionManager` 类的 `go()` 方法触发：\n\n```kotlin\nTransitionManager.go(scene2)\n\
  ```\n\n在代码中，通过将视图元素封装在一个或多个 `Views` 中并从这些组创建场景，可以创建创建实例。例如：\n\n```kotlin\nval scene1\
  \ = Scene(viewGroup1)\nval scene2 = Scene(viewGroup2, viewGroup3)\n```\n\n## 50.4\
  \ 代码中的自定义过渡和 TransitionSets\n\n本章之前列出的示例使用了默认过渡设置，其中缩放、淡入和运动是使用预配置的行为进行动画处理的。可以通过创建自定义过渡来修改这些，然后在过渡过程中引用它们。动画被分为边界变化（与视图的位置和大小变化有关）和淡入（与视图的可见性或其他状态有关）。\n\
  \n可以按如下方式创建单个 `Transition`：\n\n```kotlin\nval myChangeBounds = ChangeBounds()\n\
  ```\n\n之后在执行过渡时可以使用这个新过渡：\n\n```kotlin\nTransitionManager.go(scene2, myChangeBounds)\n\
  ```\n\n多个过渡可以组合到一个 `TransitionSet` 实例中。例如，以下代码创建了一个由边界变化和淡入过渡效果组成的新 `TransitionSet`\
  \ 对象：\n\n```kotlin\nval myTransition = TransitionSet()\nmyTransition.addTransition(ChangeBounds())\n\
  myTransition.addTransition(Fade())\n```\n\n过渡可以配置为针对特定的视图（通过视图 ID 引用）。例如，以下代码将之前的淡入过渡配置为仅针对\
  \ ID 匹配 `myButton1` 的视图：\n\n```kotlin\nval myTransition = TransitionSet()\nmyTransition.addTransition(ChangeBounds())\n\
  val fade = Fade()\nfade.addTarget(R.id.myButton1)\n```\n\n过渡的其他方面也可以进行自定义，例如持续。以下代码指定了持续时间：\n\
  \n```kotlin\nval myTransition = ChangeBounds()\nmyTransition.duration = 2000\n```\n\
  \n## 50.5 XML 中的自定义过渡\n\n虽然过渡可以在代码中实现，但通过 XML 实现通常更简单。XML 中的过渡应该存储在它们使用的 `res/transition`\
  \ 文件夹中。例如，以下 XML 定义了一个 `transitionSet`：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<transitionSet xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    android:transitionOrdering=\"together\">\n    <fade\n        android:duration=\"\
  2000\"\n        android:enterMode=\"fade-in\" />\n    <changeBounds\n        android:duration=\"\
  5000\" />\n</transitionSet>\n```\n\n默认情况下，`TransitionSet` 内的过渡是并行执行的。要指示 Transition\
  \ 框架按顺序执行动画，请向资源文件的 `transitionSet` 元素添加 `android:transitionOrdering` 属性：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<transitionSet xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    android:transitionOrdering=\"sequential\">\n    <fade\n        android:duration=\"\
  2000\"\n        android:exitMode=\"fade-out\" />\n    <changeBounds\n        android:duration=\"\
  5000\" />\n</transitionSet>\n```\n\n包含在 XML 中的过渡可以在代码中被加载。例如，以下代码加载了名为 `transition`\
  \ 的过渡：\n\n```kotlin\nval myTransition = TransitionInflater.from(this).inflate(R.transition.transition)\n\
  TransitionManager.go(scene1, myTransition)\n```\n\n## 50.6 使用 Interpolators\n\n\
  如之前所述，插值器可以通过多种方式修改过渡的行为，并可以在代码中指定，也可以通过过渡 XML 资源文件指定。\n\n在代码中工作时，可以通过调用所需插值器类的构造方法创建新的插值器实例，并在适当传递值以进一步修改插值器行为：\n\
  \n- `AccelerateDecelerateInterpolator()`\n- `AccelerateInterpolator(float factor)`\n\
  - `AnticipateInterpolator(float tension)`\n- `AnticipateOvershootInterpolator(float\
  \ tension)`\n- `BounceInterpolator()`\n- `CycleInterpolator(float cycles)`\n- `DecelerateInterpolator(float\
  \ factor)`\n- `LinearInterpolator()`\n- `OvershootInterpolator(float tension)`\n\
  \n创建后，可以使用 `Transition` 类的 `setInterpolator()` 方法将插值器实例附加到过渡中。例如，以下代码为边界变化过渡添加了弹跳插值器：\n\
  \n```kotlin\nval changeBounds = ChangeBounds()\nchangeBounds.interpolator = BounceInterpolator()\n\
  ```\n\n同样，以下代码为同一过渡添加了加速插值器，并指定了 1.2 的加速因子：\n\n```kotlin\nchangeBounds.interpolator\
  \ = AccelerateInterpolator(1.2f)\n```\n\n\n\n\n`changeBounds.interpolator = AccelerateInterpolator(1.2f)`\n\
  \n在基于 XML 的过渡资源的情况下，使用以下语法声明默认插值器（interpolator）：\n\n```xml\nandroid:interpolator=\"\
  @android:anim/<interpolator_element>\"\n```\n\n在上述语法中，必须将 `<interpolator_element>`\
  \ 替换为从下列表中选择的相应插值器的资源 ID：\n\n- `accelerate_decelerate_interpolator`\n- `accelerate_interpolator`\n\
  - `anticipate_interpolator`\n- `anticipate_overshoot_interpolator`\n- `bounce_interpolator`\n\
  - `cycle_interpolator`\n- `decelerate_interpolator`\n- `linear_interpolator`\n-\
  \ `overshoot_interpolator`\n\n例如，以下 XML 片段为包含在过渡集（transition set）中的边界变化过渡（change\
  \ bounds transition）添加了弹跳插值器：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<transitionSet\n  xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n  android:transitionOrdering=\"sequential\">\n  <changeBounds\n    android:interpolator=\"\
  @android:anim/bounce_interpolator\"\n    android:duration=\"2000\" />\n  <fade\n\
  \    android:duration=\"1000\"\n    android:fadingMode=\"fade_in\" />\n</transitionSet>\n\
  ```\n\n这种在 XML 资源中为过渡添加插值器的方法在需要插值器的默认行为时效果良好。当需要更改插值器的默认行为时，任务会变得稍微复杂一些。以循环插值器（cycle\
  \ interpolator）为例。该插值器的目的是让动画或过渡按指定的次数重复。在没有设置 `cycles` 属性（`cycles` attribute）的情况下，循环插值器将只执行一次循环。遗憾的是，当使用上述技术添加插值器时，无法直接指定循环次数（或任何其他插值器属性）。相反，必须创建一个自定义插值器，然后在过渡文件中引用它。\n\
  \n## 50.7 创建自定义插值器\n\n自定义插值器必须在单独的 XML 文件中声明，并存储在项目的 `res/anim` 文件夹中。XML 文件的名称将作为\
  \ Android 系统用于自定义插值器的资源 ID。\n\n在自定义插值器 XML 资源文件中，语法应如下：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<interpolatorElement xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \ android:attribute=\"value\" />\n```\n\n在上述语法中，必须将 `interpolatorElement` 替换为从下列表中选择的插值器的元素名称：\n\
  \n- `accelerateDecelerateInterpolator`\n- `accelerateInterpolator`\n- `anticipateInterpolator`\n\
  - `anticipateOvershootInterpolator`\n- `bounceInterpolator`\n- `cycleInterpolator`\n\
  - `decelerateInterpolator`\n- `linearInterpolator`\n- `overshootInterpolator`\n\n\
  `attribute` 关键字被需要更改其值的插值器的 `name` 属性所替换（例如，使用 `tension` 来更改越界插值器的张力属性）。最后，`value`\
  \ 代表分配给指定属性的值。例如，以下 XML 包含一个配置为循环 7 次的自定义循环插值器：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<cycleInterpolator xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \ android:cycles=\"7\" />\n```\n\n假设上述 XML 存储在项目 `res/anim` 文件夹名为 `my_cycle.xml`\
  \ 的资源文件中，可以使用以下 XML 语法将自定义插值器添加到过渡资源文件中：\n\n```xml\n<changeBounds\n  xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n  android:duration=\"5000\"\n  android:interpolator=\"\
  @anim/my_cycle\" >\n```\n\n## 50.8 使用 beginDelayedTransition 方法\n\n可能基于过渡（Transition）的用户界面动画最简单的形式涉及使用\
  \ `TransitionManager` 类的 `beginDelayedTransition()` 方法。该方法传递一个代表需要动画场景的视图组（viewgroup）根视图的引用。随后对子视图视图的变化将使用默认过渡设置进行动画处理：\n\
  \n```java\nTransitionManager.beginDelayedTransition(myLayout)\n//在此处对场景进行更改\n```\n\
  \n如果需要默认动画行为以外的行为，只需向方法调用传递一个配置适当的 `Transition` 或 `TransitionSet` 实例：\n\n```java\n\
  TransitionManager.beginDelayedTransition(myLayout, myTransition)\n```\n\n#### 50.9\
  \ 总结\n\nAndroid 4.4 KitKat SDK 发布了过渡框架（Transition Framework），其目的是简化为构成 Android 应用程序界面的视图添加动画的任务。通过一些简单的配置和几行代码，就可以利用过渡框架对视图的移动、可见性和调整大小等动画效果进行动画处理。有多种实现过渡的不同方法，涉及\
  \ Kotlin 代码和 XML 资源文件的组合。通过使用一系列插值器，还可以增强过渡的动画效果。\n\n在涵盖了 Android 过渡（Transitions）的一些理论后，接下来的两个章节将通过处理一些基于\
  \ Android Studio 的过渡实现，将这些理论付诸实践。\n\n## 51. 使用 beginDelayedTransition 的 Android\
  \ 过渡教程\n\n上一章标题为“使用 Android Transitions 动画用户界面”，介绍了使用 Transitions 框架进行用户界面动画。本章将使用教程的方法，通过\
  \ `TransitionManager` 类的 `beginDelayedTransition()` 方法演示过渡。\n\n下一章将创建一个更复杂的示例，使用布局文件和过渡资源文件来实现场景之间的过渡。\n\
  \n## 51.1 创建 Android Studio 项目\n\n在欢迎屏幕上选择 Start a new project（新建 Android 项目），并在出现的新项目对话框中选择\
  \ Empty Activity 模板。\n\n在 Name 字段中输入 TransitionDemo，并指定 `com.ebookfrenzy.transitiondemo`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API 级别设置为 API 26：Android 8.0 (Oreo)，语言设置为 Kotlin。\n\
  \n### 51.2 准备项目文件\n\n第一个示例动画将通过使用 `TransitionManager` 类的 `beginDelayedTransition()`\
  \ 方法来实现。如果 Android Studio 没有自动加载文件，请在 Project 面板中找到并双击 `app/res/layout/activity_main.xml`\
  \ 文件以加载布局编辑器。\n\n将布局编辑器切换到 Design 模式，删除“Hello World!”TextView，从布局编辑器色板的 Widget 部分拖入一个\
  \ Button 并放置在设备屏幕布局的左上角。放置完成后，选择按钮并使用 Attributes 工具窗口指定 ID  `myButton`。\n\n在组件树（Component\
  \ Tree）窗口中选择 `ConstraintLayout` 项，并使用 Attributes 窗口将其设置为 `myLayout`。\n\n### 51.3\
  \ 实现 beginDelayedTransition 动画\n\n本教程初始阶段目标是实现一个触摸处理器，当用户点击布局视图时，按钮视图移动到屏幕的右下角。\n\
  \n打开 `MainActivity.kt` 文件（位于 Project 窗口 `app/java/com.ebookfrenzy.transitiondemo`\
  \ 下），修改 `onCreate()` 方法以实现 `onTouch` 处理器：\n\n```kotlin\npackage com.ebookfrenzy.transitiondemo\n\
  \nimport androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\nimport\
  \ android.view.MotionEvent\nimport android.view.View\nimport androidx.constraintlayout.widget.ConstraintSet\n\
  import kotlinx.android.synthetic.main.activity_main.*\n```\n\n\n\n\n\n```kotlin\n\
  class MainActivity : AppCompatActivity() {\n\n    override fun onCreate(savedInstanceState:\
  \ Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_transition_demo)\n\
  \        myLayout.setOnTouchListener { v: View, m: MotionEvent ->\n            handleTouch()\n\
  \            true\n        }\n    }\n}\n```\n\n上述代码只是在 `ConstraintLayout` 容器上设置了一个触摸监听器，并配置其在检测到触摸时调用名为\
  \ `handleTouch()` 的方法。因此，接下来的任务如下实现 `handleTouch()` 方法：\n\n```kotlin\nprivate fun\
  \ handleTouch() {\n    myButton.minWidth = 500\n    myButton.minHeight = 350\n \
  \   val set = ConstraintSet()\n    set.connect(R.id.myButton, ConstraintSet.BOTTOM,\n\
  \              ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0)\n    set.connect(R.id.myButton,\
  \ ConstraintSet.RIGHT,\n              ConstraintSet.PARENT_ID, ConstraintSet.RIGHT,\
  \ 0)\n    set.constrainWidth(R.id.myButton, ConstraintSet.WRAP_CONTENT)\n    set.applyTo(myLayout)\n\
  }\n```\n\n此方法获取用户界面布局中按钮视图的引用，并设置新的最小高度和宽度属性，以便按钮尺寸增大。\n\n随后创建一个 `ConstraintSet`\
  \ 对象，并配置约束条件，这些约束将按钮放置在父布局的右下角。然后，将此约束集应用到布局中。\n\n通过编译并运行应用程序来测试目前的代码。启动后，触摸背景（而不是按钮），并注意按钮将如图\
  \ 51-1 所示所示移动并调整大小：\n\n![](img/Image24254.png)\n\n图 51-1\n\n尽管布局更改生效了，但它们是瞬间完成的，没有任何任何形式的动画。这时就需要调用\
  \ `TransitionManager` 类的 `beginDelayedTransition()` 方法了。要为此布局更改添加动画，只需要在实现布局更改之前添加一行代码。在保持\
  \ `MainActivity.kt` 文件不变的情况下，将代码修改如下：\n\n```kotlin\nimport android.transition.TransitionManager\n\
  \nprivate fun handleTouch() {\n    TransitionManager.beginDelayedTransition(myLayout)\n\
  \    myButton.minWidth = 500\n    myButton.minHeight = 350\n    val set = ConstraintSet()\n\
  \    set.connect(R.id.myButton, ConstraintSet.BOTTOM,\n              ConstraintSet.PARENT_ID,\
  \ ConstraintSet.BOTTOM, 0)\n    set.connect(R.id.myButton, ConstraintSet.RIGHT,\n\
  \              ConstraintSet.PARENT_ID, ConstraintSet.RIGHT, 0)\n    set.constrainWidth(R.id.myButton,\
  \ ConstraintSet.WRAP_CONTENT)\n    set.applyTo(myLayout)\n}\n```\n\n再次编译并运行应用程序，注意过渡现在具有动画效果了。\n\
  \n## 51.4 自定义过渡\n\n此示例中的最后一个任务是修改 `changeBounds` 过渡，使其在较长的时间内执行，并在视图到达新屏幕位置时包含弹跳效果。这涉及到创建一个具有适当持续插值器设置的\
  \ `Transition` 实例，该实例随后将作为参数传递给 `beginDelayedTransition()` 方法：\n\n```kotlin\nimport\
  \ android.transition.ChangeBounds\nimport android.transition.Transition\nimport\
  \ android.view.animation.BounceInterpolator\n\nprivate fun handleTouch() {\n   \
  \ val changeBounds: Transition = ChangeBounds()\n    changeBounds.duration = 3000\n\
  \    changeBounds.interpolator = BounceInterpolator()\n    TransitionManager.beginDelayedTransition(myLayout,\
  \ changeBounds)\n    myButton.minWidth = 500\n    myButton.minHeight = 350\n   \
  \ val set = ConstraintSet()\n    set.connect(R.id.myButton, ConstraintSet.BOTTOM,\n\
  \              ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0)\n    set.connect(R.id.myButton,\
  \ ConstraintSet.RIGHT,\n              ConstraintSet.PARENT_ID, ConstraintSet.RIGHT,\
  \ 0)\n    set.constrainWidth(R.id.myButton, ConstraintSet.WRAP_CONTENT)\n    set.applyTo(myLayout)\n\
  }\n```\n\n当应用程序执行时，布局将变慢以匹配新的持续时间，按钮将在到达时弹跳。\n\n## 51.5 总结\n\n最基础的过渡形式涉及 `TransitionManager`\
  \ 类的 `beginDelayedTransition()` 方法。一旦调用，下一帧中视图尺寸和位置的任何变化将具有动画效果。本章通过一个简单的示例演示了过渡。\n\
  \n## 52 实现场景过渡 – 教程\n\n本章将在使用 Transitions 动画用户界面 中概述的理论基础上，通过完成一个演示过渡的项目。\n\n##\
  \ 52.1 项目概述\n\n在本章创建的应用程序将包含两个场景，每个场景由一个 XML 布局文件表示。将使用过渡来制作从一个场景到另一个场景的变化。第一个场景将包含三个按钮视图。第二个场景将包含两个按钮。\n\
  \n### 52.2 创建 Android Studio SceneTransitions\n\n从欢迎界面选择“Start a new Android Studio\
  \ project”快速启动选项，在出现的新项目对话框中，选择 Empty Activity 模板。\n\n在 Name 字段输入 `SceneTransitions`\
  \ 并指定 `com.ebookfrenzy.scenetitions` 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置更改为\
  \ API 26: Android 8.0 (Oreo)，并将 Language 菜单设置为 Kotlin。\n\n### 52.3 识别并准备根容器\n\n\
  在处理过渡时，识别场景的根容器非常重要。这本质上是用于显示场景的父布局容器。当创建项目时，Android Studio 在 `app/res/layout` 文件夹中创建了一个名为\
  \ `activity_main.xml` 的布局资源文件，其中包含一个布局容器和 `TextView`。当应用程序启动时，这是在设备屏幕上向用户显示的第一个布局。\n\
  \n首先找到 `activity_main.xml` 布局资源文件，将其加载到 Android Editor 工具中并删除默认的 `TextView` 组件。在\
  \ Component Tree 窗口中选择 `ConstraintLayout` 项，并将 Attributes 工具窗口中的 ID 属性更改为 `rootContainer`。\n\
  \n### 52.4 设计第一个场景\n\n第一个场景将包含一个带有三个按钮视图的布局。通过右键点击 Project 窗口中的 `app/res/layout`\
  \ 项并选择 New -> Layout resource file… 菜单选项创建此布局资源文件。在出现的对话框中，将文件命名为 `scene1_layout`\
  \ 并输入 `androidx.constraintlayout.widget.ConstraintLayout` 作为根元素。\n\n当新创建的布局文件加载到\
  \ Layout Editor 工具时，检查 Autoconnect 模式已启用，从调色板的 Common 部分拖入 `Button` 视图到布局画布上，并将其放置在布局视图的左上角，如图\
  \ 52-1 所示。在此位置放上 Button 视图，选择它并在 Attributes 工具窗口中将 text 值更改为“One”。\n\n\n\n\n\n![](img/as_3.5_scene_transitions_add_button.png)\n\
  \n图 52-1\n\n从调板中拖入第二个 `Button` 视图并将其放置在布局视图的右上角，使边距指南出现。重复第一个按钮的操作，分配显示为“Two”（二）的文本。\n\
  \n拖入第三个 `Button` 视图并将其放置为在布局的水平和垂直方向上都居中，这次将按钮文本配置为“Three”（三）。\n\n点击布局编辑器（Layout\
  \ Editor）右上角的警告按钮，并处理硬编码文本警告列表，将三个按钮字符串提取到资源值中。\n\n完成上述步骤后，第一个场景的布局应类似于图 52-2 所示：\n\
  \n![](img/as_3.5_scene_transitions_ui_1.png)\n\n图 52-2\n\n选择“One”按钮，并使用属性（Attributes）工具窗口配置\
  \ `onClick` 属性以调用名为 `goToScene2` 的方法。对“Two”按钮重复此步骤，这次在 `onClick` 字段中输入名为 `goToScene1`\
  \ 的方法。\n\n## 52.5 设计第二个场景\n\n第二个场景只是第一个场景的修改版本。第一个和第二个按钮仍然存在，但将分别位于布局的右下角和左下角。另一方面，第二个场景不再出现三个按钮。\n\
  \n为了避免重复工作，第二个场景的布局文件将通过复制和修改 `scene1_layout.xml` 文件创建。在项目（Project）工具窗口中，找到 `app`\
  \ -> `res` -> `layout` -> `scene1_layout.xml` 文件，右键点击它并选择 `Copy`（复制）菜单。右键点击布局文件夹，这次选择\
  \ `Paste`（粘贴）菜单，并在提示时将文件名更改为 `scene2_layout.xml`。\n\n双击新的 `scene2_layout.xml` 文件将其加载到布局编辑器工具中，并在必要时切换到设计（Design）模式。使用工具栏上的\
  \ `Clear all Constraints`（清除所有约束）按钮移除布局中的当前约束。\n\n选择并删除“Three”按钮，并将第一个和第二个按钮移动到图\
  \ 52-3 所示的右下和左下位置：\n\n![](img/as_3.5_scene_transitions_ui_2.png)\n\n图 52-3\n\n##\
  \ 52.6 进入第一个场景\n\n如果现在运行应用程序，将只会显示由 `activity_main.xml` 文件表示的空白布局。因此，必须在 `MainActivity.kt`\
  \ 文件中的 `onCreate()` 方法中添加一些代码，以便在创建创建时显示第一个场景。可以通过以下方式实现：\n\n```kotlin\npackage\
  \ com.ebookfrenzy.scenetransitions\n\nimport androidx.appcompat.app.AppCompatActivity\n\
  import android.os.Bundle\nimport android.transition.Scene\nimport android.view.View\n\
  import android.transition.TransitionManager\nimport kotlinx.android.synthetic.main.activity_main.*\n\
  \nclass MainActivity : AppCompatActivity() {\n    var scene1: Scene? = null\n\n\
  \    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n\
  \        setContentView(R.layout.activity_main)\n        scene1 = Scene.getSceneForLayout(rootContainer,\n\
  \                    R.layout.scene1_layout, this)\n        scene1?.enter()\n  \
  \  }\n}\n```\n\n添加到活动 类中的代码声明了一些变量，用于存储对根容器和第一个场景的引用，并获取根容器视图的引用。然后使用 `Scene` 类的\
  \ `getSceneForLayout()` 方法从 `scene1_layout.xml` 文件中包含的布局创建场景，并将该布局转换为场景。然后通过调用 `enter()`\
  \ 方法进入场景，以便将其显示给用户。\n\n此时编译并运行应用程序，验证在应用程序启动后显示了场景 1。\n\n## 52.7 加载场景 2\n\n在实现第一个和第二个场景之间的过渡之前，首先需要添加一些代码将\
  \ `scene2_layout.xml` 文件中的布局加载到 `Scene` 实例中。因此，在 `MainActivity.kt` 文件中，添加如下代码：\n\
  \n```kotlin\nclass MainActivity : AppCompatActivity() {\n    var scene1: Scene?\
  \ = null\n    var scene2: Scene? = null\n\n    override fun onCreate(savedInstanceState:\
  \ Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_main)\n\
  \        scene1 = Scene.getSceneForLayout(rootContainer,\n                    R.layout.scene1_layout,\
  \ this)\n        scene2 = Scene.getSceneForLayout(rootContainer,\n             \
  \       R.layout.scene2_layout, this)\n        scene1?.enter()\n    }\n}\n```\n\n\
  ## 52.8 实现过渡\n\n第一个和第二个按钮已配置为在选择时分别调用名为 `goToScene2` 和 `goToScene1` 的方法。正如方法所示，这些方法的职责是触发两个场景之间的过渡。在\
  \ `MainActivity.kt` 文件中添加这两个方法，其读取内容如下：\n\n```kotlin\nfun goToScene2(view: View)\
  \ {\n    TransitionManager.go(scene2)\n}\n\nfun goToScene1(view: View) {\n    TransitionManager.go(scene1)\n\
  }\n```\n\n运行应用程序，注意选择第一个按钮会在两个场景之间切换布局。由于我们尚未配置任何过渡，这些布局没有动画。\n\n## 52.9 添加过渡文件\n\
  \n项目中所有的过渡效果将在单个过渡文件中实现。正如使用 Android 动画用户界面所述，过渡文件必须放置在 `app` -> `res` 文件夹中。因此，首先右键点击\
  \ `res` 文件夹并选择 `New` -> `Directory`（目录）。在生成的对话框中命名文件夹为 `transition` 并点击 OK。右键点击新文件夹，这次选择\
  \ `New` -> `Transition Resource File` 并命名新文件为 `transition`。\n\n选中新创建的 `transition.xml`\
  \ 文件并加载到编辑面板后，添加以下 XML 内容以添加带有持续时间的过渡集：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<transitionSet xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <changeBounds android:duration=\"2000\"/>\n</transitionSet>\n```\n\n## 52.10\
  \ 加载并使用过渡集\n\n虽然已创建并填充了过渡资源文件，但在添加代码将过渡加载到 `TransitionManager` 并在场景更改中引用它之前，不会产生任何效果。实现此目的的更改如下：\n\
  \n```kotlin\npackage com.ebookfrenzy.scenetransitions\n\nimport androidx.appcompat.app.AppCompatActivity\n\
  import android.os.Bundle\nimport android.transition.Scene\nimport android.view.View\n\
  import android.transition.TransitionManager\nimport android.transition.TransitionInflater\n\
  import android.transition.Transition\nimport kotlinx.android.synthetic.main.activity_main.*\n\
  \nclass MainActivity : AppCompatActivity() {\n    var scene1: Scene? = null\n  \
  \  var scene2: Scene? = null\n    var transitionMgr: Transition? = null\n\n    override\
  \ fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n\
  \        setContentView(R.layout.activity_main)\n        transitionMgr = TransitionInflater.from(this)\n\
  \            .inflateTransition(R.transition.transition)\n        scene1 = Scene.getSceneForLayout(rootContainer,\n\
  \                    R.layout.scene1_layout, this)\n        scene2 = Scene.getSceneForLayout(rootContainer,\n\
  \                    R.layout.scene2_layout, this)\n        scene1?.enter()\n  \
  \  }\n}\n```\n\n\n\n\n\n```kotlin\nTransitionManager.go(scene2, transitionMgr)\n\
  \n}\n\nfun goToScene1(view: View) {\n    TransitionManager.go(scene1, transitionMgr)\n\
  }\n```\n\n当现在运行应用程序时，两个按钮将在过渡期间平滑地滑动到它们的新位置。\n\n### 52.11 配置额外的过渡\n\n一旦过渡文件集成到项目项目中，就可以向文件中添加任意数量的额外过渡，而无需对\
  \ activity 的 Kotlin 源代码进行任何进一步更改。例如，对 `transition.xml` 文件进行以下更改，为边界变化过渡（change bounds\
  \ transition）添加一个弹性插值器（bounce interpolator），为第三个按钮引入淡入过渡，并修改过渡方式使其按顺序执行：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<transitionSet\n  xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n  android:transitionOrdering=\"sequential\" >\n    <fade\n        android:duration=\"\
  2000\"\n        android:fadingMode=\"fade_in\">\n        <targets>\n           \
  \ <target android:targetId=\"@id/button3\" />\n        </targets>\n    </fade>\n\
  \    <changeBounds\n        android:duration=\"2000\"\n        android:interpolator=\"\
  @android:anim/bounce_interpolator\">\n    </changeBounds>\n</transitionSet>\n```\n\
  \n按钮一和二现在到达终点时会弹跳，按钮三在从场景 2 过到场景 1 时将平滑地淡入视图。\n\n花时间通过更改 `transition.xml` 文件并重新运行应用程序来尝试不同的过渡和插值器。\n\
  \n### 52.12 总结\n\n基于场景的过渡为 Android 应用程序中用户界面布局变化的动画提供了一种灵活的方法。本章演示了表示两个布局资源文件的场景之间进行过渡动画的步骤。此外，示例还使用了过渡\
  \ XML 资源文件来配置两个场景之间的过渡动画效果。\n\n### 53. 使用悬浮动作按钮和 Snackbar\n\n本章的目标之一是提供材料设计（material\
  \ design）概念的概述。材料设计最初作为 Android 5.0 的引入，是一套设计指南，规定了 Android 用户界面以及运行在 Android 上的应用程序的外观和行为。\n\
  \n作为材料设计概念实现的一部分，Google 还引入了 Android 设计支持库（Android Design Support Library）。该库包含许多不同的组件，允许将材料设计的许多关键功能构建到\
  \ Android 应用程序中。这些组件中的悬浮动作按钮（floating action button）和 `Snackbar` 将在本章介绍许多其他组件之前先进行介绍。\n\
  \n## 53.1 材料设计\n\nAndroid 环境的整体外观由材料设计原则定义。材料设计由 Google 的 Android 团队创建，规定构成 Android\
  \ 用户界面和运行在其上的应用程序的元素在行为、阴影、动画和样式方面以某种方式出现和运行。材料设计的原则之一是用户界面的元素似乎具有物理深度，并且感觉项目是由物理材料层构建的。例如，按钮通过使用阴影效果似乎悬浮在它所处布局的表面之上。按下按钮会导致按钮弯曲和抬起，就像由薄材料制成的，释放时会产生涟漪。\n\
  \n材料设计还规定了许多标准用户界面元素的布局和行为。一个关键示例是位于屏幕顶部的应用栏的外观，以及它相对于活动主内容内发生的滚动活动的行为方式。\n\n事实上，材料设计涵盖了从推荐的颜色样式到对象动画方式的广泛领域。您可以在以下链接在线上找到材料设计概念和指南的完整描述，这是所有\
  \ Android 开发人员的推荐读物：\n\nhttps://www.google.com/design/spec/material-design/introduction.html\n\
  \n### 53.2 设计库\n\n实现采用材料设计原则的 Android 应用程序所需的许多构建块包含在 Android 设计支持库中。该库包含一组用户界面组件，可以包含在\
  \ Android 应用程序中以实现材料设计的大部分外观、感觉和行为。库中的两个组件——悬浮动作按钮和 `Snackbar` 将在本章介绍，而其他组件将在后续章节介绍。\n\
  \n### 53.3 悬浮动作按钮 (FAB)\n\n悬浮动作按钮是一个悬浮在应用程序用户界面表面方的按钮，通常用于促进用户界面屏幕中最常见的操作。例如，可以将悬浮动作按钮放置在屏幕上，允许用户向项目列表添加条目。\n\
  \n为了符合材料设计指南，使用悬浮动作按钮时应遵循许多规则。悬浮动作按钮必须是圆形的，尺寸可以是 56 x 56dp（默认）或 40 x 40dp（微型）。按钮在手机上距离屏幕边缘至少\
  \ 16dp，在桌面电脑和平板设备上至少 24dp。无论尺寸如何，按钮必须包含一个 24x24dp 大小的内部图标，并且建议每个用户界面屏幕只有一个悬浮动作按钮。\n\
  \n悬浮动作按钮可以进行动画处理，或设计为触摸时形变为其他形状。例如，悬浮动作按钮可以在被点击时旋转，或形变为另一个元素，如工具栏或面板。\n\n### 53.4\
  \ Snackbar\n\n`Snackbar` 组件提供了一种以屏幕底部面板的形式向用户展示信息的方法。`Snackbar` 实例包含一条短的文本消息和一个可选的操作按钮，该按钮在用户点击时将执行任务。一旦显示，`Snackbar`\
  \ 将自动超时消失，或者可以由用户通过滑动操作手动移除。在 `Snackbar` 显示期间，应用程序将继续运行并以正常方式响应用户交互。\n\n在本章的剩余部分，将创建一个示例应用程序，该程序利用悬浮动作按钮和\
  \ `Snackbar` 的基本功能向项目列表添加条目。\n\n### 53.5 创建示例项目\n\n从欢迎屏幕上选择新建 Android Studio 项目的快速启动选项，在生成的新项目对话框中选择\
  \ Basic Activity 模板，然后点击 Next 按钮。\n\n在 Name 字段中输入 FabExample，并将 com.ebookfrenzy.fabexample\
  \ 指定包包。在点击 Finish 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language\
  \ 菜单设置为 Kotlin。\n\n### 53.6 查看项目\n\n由于选择了 Basic Activity 模板，该活动 包含两个布局文件。`activity_main.xml`\
  \ 文件由一个 `CoordinatorLayout` 管理器组成，包含应用栏、工具栏和悬浮动作按钮的条目。\n\n\n\n\n`content_main.xml`\
  \ 文件代表了活动内容区域的布局，包含一个 `NavHostFragment` 实例。该文件通过以下 `include` 指令嵌入到 `activity_main.xml`文件中：\n\
  \n```xml\n<include layout=\"@layout/content_main\" />\n```\n\n`activity_main.xml`\
  \ 文件中的悬浮按钮（floating action button）元素如下：\n\n```xml\n<com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_margin=\"\
  @dimen/fab_margin\"\n    app:srcCompat=\"@android:drawable/ic_dialog_email\" />\n\
  ```\n\n这声明按钮将出现在屏幕的右下角，边距由 `values/dimens.xml` 文件中的 `fab_margin` 标识符表示（在此情况下设置为\
  \ 16dp）。XML 进一步声明按钮的内部图标将采用标准的内置可绘制邮件图标形式。\n\n空白模板还配置了悬浮按钮，当用户点击时会显示一个 `Snackbar`\
  \ 实例。实现此功能的代码可以在 `MainActivity.kt` 文件的 `onCreate()` 方法中找到，如下：\n\n```kotlin\nfab.setOnClickListener\
  \ { view ->\n    Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \        .setAction(\"Action\", null).show()\n}\n```\n\n该代码通过按钮 ID 获取悬浮按钮的引用，并为其添加了一个\
  \ `onClickListener` 处理程序，在按钮被点击时调用。此方法简单地显示了一个配置了消息但没有操作的 `Snackbar` 实例。\n\n当项目编译并运行后，悬浮按钮将出现在屏幕底部，如图图\
  \ 53-3 所示：\n\n![](img/as_3.6_fab_email.png)\n\n图 53-3\n\n点击悬浮按钮将触发 `onClickListener`\
  \ 处理方法，导致 `Snackbar` 显示在屏幕底部：\n\n![](img/as_3.6_fab_with_message.png)\n\n图 53-4\n\
  \n当 `Snackbar` 在较窄的设备上显示时（如上方图 53-4 所示），请注意悬浮按钮向上移动以为 `Snackbar` 的出现留出空间。这由 `activity_main.xml`\
  \ 布局资源文件 `CoordinatorLayout` 容器自动为我们处理。\n\n### 53.7 移除导航功能\n\n正如“Android Studio\
  \ 布局编辑器工具指南”所述，基础 Activity 模板包含多个 fragment 和按钮，用于在不同 fragment 之间进行导航。对于本教程而言，这些功能是不必要的，如果不移除，稍后会产生问题。在继续教程之前，请按照以下方式修改项目：\n\
  \n1. 在 Project 工具窗口中，导航并双击 `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n\
  2. 在编辑器中，选择 Destinations 面板中的 `SecondFragment` 条，并按键盘删除键将其从图中移除。\n3. 找到并删除 `SecondFragment.kt`（`app\
  \ -> java -> <package name> -> SecondFragment`）和 `fragment_second.xml`（`app -> res\
  \ -> layout -> fragment_second.xml`）文件。\n4. 找到 `FirstFragment.kt` 文件，双击它将其加载到编辑器，并移除\
  \ `onViewCreated()` 方法中的代码，使其内容如下：\n\n```kotlin\noverride fun onViewCreated(view:\
  \ View, savedInstanceState: Bundle?) {\n    super.onViewCreated(view, savedInstanceState)\n\
  \    view.findViewById<Button>(R.id.button_first).setOnClickListener {\n       \
  \ val action = FirstFragmentDirections.actionFirstFragmentToSecondFragment(\"From\
  \ FirstFragment\")\n        findNavController().navigate(action)\n    }\n}\n```\n\
  \n### 53.8 修改悬浮按钮\n\n由于此示例的目标是配置悬浮按钮以向列表添加条目，因此目前按钮上显示的邮件图标需要更改为更能指示所执行操作的内容。将用于按钮的图标名为\
  \ `ic_add_entry.png`，可以在从以下 URL 下载的示例代码 `project_icons` 文件夹中找到：\n\n[`www.ebookfrenzy.com/retail/as36kotlin/index.php`](https://www.ebookfrenzy.com/retail/as36kotlin/index.php)\n\
  \n在操作系统的文件系统导航器中找到此图像并复制图像文件。在 Project 工具窗口的 `app -> res -> drawable` 处点击右键并选择粘贴：\n\
  \n![](img/as_3.6_fab_email.png)\n\n图 53-\n\n接下来，编辑 `activity_main.xml` 文件，将图标源从\
  \ `@android:drawable/ic_email` 更改为 `@drawable/add_entry`：\n\n```xml\n<com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_margin=\"\
  @dimen/fab_margin\"\n    app:srcCompat />\n\n在布局预览中，内部图标已更改为加号。悬浮按钮的背景颜色由应用程序使用的\
  \ `colorAccent` 属性定义。该值在 `app -> res -> values` 的 `colors.xml` 文件中声明。编辑该文件并将 `colorAccent`\
  \ 更改为值：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n   \
  \ <color name=\"colorPrimary\">#008577</color>\n    <color name=\"colorPrimaryDark\"\
  >#0057B</color>\n    <color name=\"colorAccent\">#FFDE03</color>\n</resources>\n\
  ```\n\n返回 `activity_main.xml` 文件，验证悬浮按钮现在显示为黄色。\n\n### 53.9 添加 ListView\n\n教程的下一步是在\
  \ `fragment_first.xml` 中添加 `ListView` 实例。`ListView` 类提供了显示列表，可以在布局编辑器的 `Legacy`\
  \ 部分找到。\n\n将 `fragment_first.xml` 文件加载到布局编辑器，必要时选择设计模式，并删除默认的 `TextView` 和 `Button`\
  \ 对象。在调板的 `Legacy` 类别中找到 `ListView` 对象，并在启用自动连接的情况下将其拖到画布中心。选择 `ListView` 对象并在属性窗口中将\
  \ ID 更改为 `listView`。布局编辑器应该已调整 `ListView`  own 以填充整个容器并在所有边缘建立了约束，如图图 53-6 所示：\n\
  \n![](img/as_3.6_fab_listview.png)\n\n图 53-6\n\n选中 `ListView` 对象，使用属性窗口为顶部约束添加 `64dp`\
  \ 边距，以便在应用程序运行时不会被工具栏遮挡：\n\n![](img/as_3.6_fab_listview_top_margin.png)\n\n图 53-7\n\
  \n### 53.10 向 ListView 添加项目\n\n每当用户点击悬浮按钮时，就会以当前时间的格式向 `ListView` 添加新项目。为了实现这一功能，需要对\
  \ `MainActivity.kt` 文件进行修改。\n\n通过修改 `onStart()` 方法获取 `ListView` 实例的引用，并初始化 `adapter`\
  \ 实例以便我们以数组的形式向列表添加项目：\n\n```kotlin\nimport android.os.Bundle\nimport com.google.android.material.snackbar.Snackbar\n\
  import androidx.appcompat.app.AppCompatActivity\nimport android.view.Menu\nimport\
  \ android.view.MenuItem\nimport android.view.View\nimport android.widget.ArrayAdapter\n\
  import kotlinx.android.synthetic.main.activity_main.*\nimport kotlinx.android.synthetic.main.fragment_first.*\n\
  import java.util.ArrayList\n```\n\n\n\n\n```kotlin\nclass MainActivity : AppCompatActivity()\
  \ {\n\n    var listItems = ArrayList<String>()\n\n    var adapter: ArrayAdapter<String>?\
  \ = null\n\n    override fun onStart() {\n        super.onStart()\n        adapter\
  \ = ArrayAdapter(this,\n            android.R.layout.simple_list_item_1,\n     \
  \       listItems)\n        listView.adapter = adapter\n    }\n}\n```\n\n注意，这里使用了\
  \ `onStart()` 周期方法而不是常用的 `onCreate()` 方法。这是因为包含 `ListView` 对象的 fragment 在调用 `onCreate()`\
  \ 方法时尚未初始化，这会导致应用程序崩溃。\n\n`ListView` 需要一个项目项数组用于显示，一个用于管理该数组中项的 `adapter`，以及一个用于定义如何向用户展示项的布局定义。\n\
  \n在上述代码更改中，项存储在 `ArrayList` 实例中，并赋值给形式为 `ArrayAdapter` 的 `adapter`。添加到列表中的项将使用 `simple_list_item_1`\
  \ 布局在 `ListView` 中显示，该布局是 Android 提供的的，用于在 `ListView` 实例中显示基于字符串的简单项。\n\n接下来，编辑浮动操作按钮的\
  \ `OnClickListener` 代码，以便在 `Snackbar` 中显示不同的消息，并调用方法向列表添加一个项：\n\n```kotlin\nfab.setOnClickListener\
  \ { view ->\n    addListItem()\n    Snackbar.make(view, \"Item added to list\",\
  \ Snackbar.LENGTH_LONG)\n        .setAction(\"Action\", null).show()\n}\n```\n\n\
  在 `MainActivity.kt` 文件中，按照如下方式添加 `addListItem()` 方法：\n\n```kotlin\npackage com.ebookfrenzy.fabexample\n\
  \nimport java.text.SimpleDateFormat\nimport java.util.*\n\nclass MainActivity :\
  \ AppCompatActivity() {\n\n    private fun addListItem() {\n        val dateformat:\
  \ SimpleDateFormat =\n            SimpleDateFormat(\"HH:mm:ss MM/dd/yyyy\", Locale.US)\n\
  \        listItems.add(dateformat.format(Date()))\n        adapter?.notifyDataSetChanged()\n\
  \    }\n}\n```\n\n`addListItem()` 方法中的代码识别并格式化当前日期时间，将其添加到列表项数组中。通知分配给 `ListView`\
  \ 的数组适配器列表数据已更改，导致 `ListView` 更新以显示最新的列表项。\n\n编译并运行应用程序，测试点击浮动操作按钮是否向 `ListView`\
  \ 添加新的新的日期条目，并每次都如图 53-8 所示显示 `Snackbar`：\n\n![](img/as_3.6_fab_example_running.png)\n\
  \n图 53-8\n\n### 53.11 为 Snackbar 添加操作\n\n项目的最后一个任务是为 `Snackbar` 添加一个操作，允许用户撤销最近一次对列表的操作。编辑\
  \ `MainActivity.kt` 文件并修改 `Snackbar` 创建代码，添加一个标题为“Undo”（撤销）的操作，并配置名为 `undoOnClickListener`\
  \ 的 `onClickListener`：\n\n```kotlin\nfab.setOnClickListener { view ->\n    addListItem()\n\
  \    Snackbar.make(view, \"Item added to list\", Snackbar.LENGTH_LONG)\n       \
  \ .setAction(\"Undo\", undoOnClickListener).show()\n}\n```\n\n在 `MainActivity.kt`\
  \ 文件中添加监听器处理器：\n\n```kotlin\nvar undoOnClickListener: View.OnClickListener = View.OnClickListener\
  \ { view ->\n    listItems.removeAt(listItems.size - 1)\n    adapter?.notifyDataSetChanged()\n\
  \    Snackbar.make(view, \"Item removed\", Snackbar.LENGTH_LONG)\n        .setAction(\"\
  Action\", null).show()\n}\n```\n\n`onClick` 方法中的代码识别列表数组中最后一个项的位置，并在触发列表视图执行更新之前将其从列表中删除。然后会显示一个新的\
  \ `Snackbar`，指示最后一项已从列表中删除。\n\n再次运行应用程序，并向列表添加一些项。在最后一次添加时，点击 `Snackbar` 中的 Undo\
  \ 按钮（图 53-9）：\n\n![](img/Image249.png)\n\n图 53-9\n\n### 53.12 总结\n\n本章提供了对物化设计（Material\
  \ Design）、浮动操作按钮和 `Snackbar` 的概括介绍，随后介绍了一个使用这些特性的示例。浮动操作按钮和 `Snackbar` 都是设计方法的一部分。\n\
  \n### 54. 使用 TabLayout 组件创建标签页界面\n\n上一章概述了物化设计的概念，并引入了设计库提供的两个组件。本章将演示如何使用设计库的另一个组件\
  \ `TabLayout`，它可以与 `ViewPager` 结合创建标签页界面。\n\n#### 54.1 ViewPager 简介\n\n虽然 `ViewPager`\
  \ 不属于设计库，但在与 `TabLayout` 配合使用时，它是实现标签页界面的有用伴侣。`ViewPager` 的主要作用是允许用户翻阅不同的页面，每个页面通常由布局表示。与\
  \ `ViewPager` 关联的 fragment 由 `FragmentPagerAdapter` 实例管理。\n\n#### 54.2 TabLayout\
  \ 组件概述\n\n如前所述，`TabLayout` 是作为物化设计的一部分引入的组件之一，并包含在设计库中。`TabLayout` 的目的是向用户展示一行标签，用户可以通过选择这些标签来显示不同的页面。标签可以是固定的也可以是可滚动的，用户可以向左或向右滑动以查看当前屏幕上无法容下的更多标签。标签上显示的信息可以是基于文本的、图像或文本与图像的。\n\
  \n#### 54.3 创建 TabLayoutDemo 项目\n\n从欢迎界面选择“Start a new Android project”快速启动选项，在弹出的新项目对话框中，选择“Basic\
  \ Activity”模板并点击“Next”按钮。\n\n在 Name 字段中输入 TabLayoutDemo，并在包名中指定 `com.ebookfrenzy.tablayoutdemo`。在点击“Finish”按钮之前，将\
  \ Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language 菜单改为 Kotlin。\n\n\
  项目创建后，在布局编辑器工具中加载 `content_main.xml` 文件，选择 `NavHostFragment` 对象，然后将其删除。\n\n\n\n\n\
  \n`TabLayout` 上的每个标签页在选中时将显示不同的 fragment。在 Project 工具窗口中，右键点击 `app -> java -> com.ebookfrenzy.tablayoutdemo`\
  \ 节点，并选择 `New -> Fragment -> Fragment (Blank)` 选项来创建这些 fragment 中的第一个。在弹出的对话框中，在\
  \ `Fragment Name:` 字段中输入 `Tab1Fragment`并在 `Fragment Layout Name:` 字段中输入 `fragment_tab1`。启用\
  \ `Create layout XML?` 和 `Include fragment factory methods?` 选项。点击 `Finish` 按钮创建新\
  \ fragment：\n\n![](img/as_3.6_fab_tablayout_add_fragment.png)\n\n图 54-3\n\n编辑 `Tab1Fragment.kt`\
  \ 文件，如果 Android Studio 没有自动添加，请如下所示添加 `OnFragmentInteractionListener` 接口声明：\n\n\
  ```kotlin\n.\n.\nimport android.net.Uri\n.\n.\n    interface OnFragmentInteractionListener\
  \ {\n        fun onFragmentInteraction(uri: Uri)\n    }\n.\n.\n```\n\n将新创建的 `fragment_tab1.xml`\
  \ 文件（位于 `app -> res -> layout`）加载到 Layout Editor 工具中，右键点击 `Component Tree` 面板中的\
  \ `FrameLayout` 节点并选择 `Convert FrameLayout to ConstraintLayout` 菜单选项。在弹出的对话框中，在点击\
  \ `OK` 之前确保选中了所有转换选项。将布局的 ID 更改为 `constraintLayout`。\n\n一旦布局转换为 `ConstraintLayout`，从布局中删除\
  \ `TextView`。从 `Palette` 找到 `TextView` 控件并将其拖放到布局的中心位置。编辑对象的 text 属性，使其显示为“Tab 1\
  \ Fragment”，并将字符串提取到命名为 `tab_1_fragment` 的资源中，此时布局应与图 54-4 一致：\n\n\n\n![](img/as_3.5_tab_layout_fragment_ui.png)\n\
  \n图 54-4\n\n## 54.5 复制 Fragments\n\n到目前为止，项目包含了四个要求的 fragment 中的一个。与其使用之前的步骤创建其余三个\
  \ fragment，不如复制第一个 fragment 快得多。每个 fragment 都由一个布局 XML 文件和一个 Kotlin 类文件组成，这两个文件都需要复制。\n\
  \n在 Project 工具窗口中右键点击 `fragment_tab1.xml` 文件，并在弹出的菜单中选择 `Copy` 选项。右键点击布局节点，这次选择\
  \ `Paste` 选项。在弹出的对话框中，点击 `OK` 按钮之前将新布局文件命名为 `fragment_tab2.xml`。编辑新的 `fragment_tab2.xml`\
  \ 文件，并将 `Text View` 文本更改为“Tab 2 Fragment”，按照通常步骤将字符串提取到命名为 `tab_2_fragment` 的资源中。\n\
  \n要复制 `Tab1Fragment` 类文件，右键点击 `app -> java -> com.ebookfrenzy.tablayoutdemo` 下列出的类并选择\
  \ `Copy`。右键点击 `com.ebookfrenzy.tablayoutdemo` 节点并选择 `Paste`。在 `Copy Class` 对话框中，在\
  \ `New name:` 字段输入 `Tab2Fragment` 并点击 `OK`。编辑新的 `Tab2Fragment.kt` 文件，更改类名和 `onCreateView()`\
  \ 方法以加载 `fragment_tab2` 布局文件：\n\n```kotlin\n.\n.\nclass Tab2Fragment : Fragment()\
  \ {\n.\n.\noverride fun onCreateView(inflater: LayoutInflater?, container: ViewGroup?,\n\
  \                         savedInstanceState: Bundle?): View? {\n    // Inflate\
  \ the layout for this fragment\n    return inflater.inflate(R.layout.fragment_tab2,\
  \ container, false)\n}\n```\n\n再次执行上述复制步骤两次，为其余两个 fragment 创建布局和类文件。完成这些步骤后，项目结构应与图\
  \ 54-5 一致：\n\n![](img/Image2457.png)\n\n图 54-5\n\n## 54.6 添加 TabLayout 和 ViewPager\n\
  \n现在 fragment 创建过程已完成，下一步是向主活动布局文件添加 `TabLayout` 和 `ViewPager`。编辑 `activity_main.xml`\
  \ 文件并按照下面的 XML 列表所示添加这些元素。注意 `TabLayout` 组件嵌入在 `AppBarLayout` 元素中，而 `ViewPager`\
  \ 放置在 `AppBarLayout` 之后：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <androidx.coordinatorlayout.widget.CoordinatorLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    tools:context=\".MainActivity\"\
  >\n    <com.google.android.material.appbar.AppBarLayout\n        android:layout_width=\"\
  match_parent\"\n        android:layout_height=\"wrap_content\"\n        android:theme=\"\
  @style/AppTheme.Overlay\">\n        <androidx.appcompat.widget.Toolbar\n       \
  \     android:id=\"@+id/toolbar\"\n            android:layout_width=\"match_parent\"\
  \n            android:layout_height=\"?attr/actionBarSize\"\n            android:background=\"\
  ?attr/colorPrimary\"\n            app:popupTheme=\"@style/AppTheme.Overlay\">\n\
  \        <com.google.android.material.tabs.TabLayout\n            android:id=\"\
  @+id/tab_layout\"\n            android:layout_width=\"match_parent\"\n         \
  \   android:layout_height=\"wrap_content\"\n            app:tabMode=\"fixed\"\n\
  \            app:tabGravity=\"fill\"/>\n    </com.google.android.material.appbar.AppBarLayout>\n\
  \    <androidx.viewpager.widget.ViewPager\n        android:id=\"@+id/pager\"\n \
  \       android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:layout_behavior=\"@string/app_scrolling_view_behavior\"\
  \ />\n    <include layout=\"@layout/content_main\" />\n    <com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \        android:id=\"@+id/fab\"\n        android:layout_width=\"wrap_content\"\n\
  \        android:layout_height=\"wrap_content\"\n        android:layout_gravity=\"\
  bottom|end\"\n        android:layout_margin=\"@dimen/fab_margin\"\n        app:srcCompat=\"\
  @android:drawable/ic_email\" />\n</CoordinatorLayout>\n```\n\n## 54.7 创建 Pager Adapter\n\
  \n本示例将使用 `ViewPager` 方法来处理分配给 `TabLayout` 的 fragment。在使用 `ViewPager` 添加到布局资源文件后，需要在项目中添加一个子类化\
  \ `FragmentPagerAdapter` 的新类，用于管理用户选择项时显示的 fragment。\n\n在 Project 工具窗口中右键点击 `com.ebookfrenzy.tablayoutdemo`\
  \ 节点并选择 `New -> Kotlin File/Class` 选项。在新类对话框中，在 `Name:` 字段输入 `TabPagerAdapter`，选择列表中的\
  \ `Class` 项并按回车键。\n\n编辑 `TabPagerAdapter.kt` 文件，使其内容如下：\n\n```kotlin\npackage com.ebookfrenzy.tablayoutdemo\n\
  \nimport androidx.fragment.app.Fragment\nimport androidx.fragment.app.FragmentManager\n\
  import androidx.fragment.app.FragmentPagerAdapter\n\nclass TabPagerAdapter(fm: FragmentManager,\
  \ private var tabCount: Int) :\n         FragmentPagerAdapter(fm,\n            \
  \ FragmentPagerAdapter.BEHAVIOR_RESUME_ONLY_CURRENT_FRAGMENT) {\n    override fun\
  \ getItem(position: Int): Fragment {\n        when (position) {\n            0 ->\
  \ return Tab1Fragment()\n            1 -> return Tab2Fragment()\n            2 ->\
  \ return Tab3Fragment()\n            3 -> return Tab4Fragment()\n            else\
  \ -> return null\n        }\n    }\n\n    override fun getCount(): Int {\n     \
  \   return tabCount\n    }\n}\n```\n\n## 54.8 执行初始化任务\n\n\n\n\n剩余的任务涉及初始化 `TabLayout`、`ViewPager`\
  \ 和 `TabPagerAdapter` 实例，并声明主 Activity 类实现四个标签页 fragment 的片段交互监听器。编辑 `MainActivity.kt`\
  \ 文件，使其内容如下：\n\n```kotlin\npackage com.ebookfrenzy.tablayoutdemo\n\nimport android.os.Bundle\n\
