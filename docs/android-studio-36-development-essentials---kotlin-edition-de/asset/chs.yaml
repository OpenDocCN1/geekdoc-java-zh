  \nimport android.webkit.WebResourceRequest\nimport android.webkit.WebView\nimport\
  \ android.webkit.WebViewClient\nimport com.ebookfrenzy.masterdetailflow.dummy.DummyContent\n\
  \nclass WebsiteDetailFragment : Fragment() {\n    /**\n     * 此 fragment 展示的虚拟内容。\n\
