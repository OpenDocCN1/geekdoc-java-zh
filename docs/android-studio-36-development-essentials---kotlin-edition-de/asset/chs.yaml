  \ ID 更改为 `pipButton` 并配置该按钮调用名为 `enterPipMode` 的方法。\n\n## 82.3 进入画中画模式\n\n现在需要将\
  \ `enterPipMode` `onClick` 回调方法添加到 `MainActivity.kt` 类文件中。找到该文件，在代码编辑器中打开它并按所示添加该方法：\n\
  \n```kotlin\nimport android.app.PictureInPictureParams\nimport android.util.Rational\n\
  import android.view.View\nimport android.content.res.Configuration\n\nfun enterPipMode(view:\
  \ View) {\n    val rational = Rational(videoView1.width,\n               videoView1.height)\n\
