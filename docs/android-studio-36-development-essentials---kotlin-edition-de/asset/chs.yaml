  \ `onStart()` 方法内部调用。因此，编辑 `MainActivity.kt` 文件并进行如下修改：\n\n## 88. Android 自定义文档打印指南\n\
  \n正如我们在前面的章节中所看到的，只要内容是以图像或 HTML 标记的形式存在，Android 打印框架使得在应用程序中构建打印支持变得相对简单。更高级的打印需求可以通过使用打印框架的自定义文档打印功能来实现。\n\
  \n### 88.1 Android 自定义文档打印概述\n\n\n\n\n简单来说，自定义文档打印使用画布（canvases）来表示要打印的文档页面。应用程序以形状、颜色、文本和图像的形式将待打印的内容绘制到这些画布上。事实上，这些画布是由\
  \ Android `Canvas` 类的实例表示的，从而提供了丰富的绘图选项。一旦完成所有页面的绘制，文档就会被打印。\n\n虽然这听起来非常简单，但实际上实现这一过程需要执行许多步骤，这些步骤可以总结如下：\n\
  \n- 实现一个继承自 `PrintDocumentAdapter` 类的自定义打印适配器\n- 获取打印管理器服务（Print Manager Service）的引用\n\
  - 创建 `PdfDocument` 类的实例，并在其中存储文档页面\n- 以 `PdfDocument.Page` 实例的形式将页面添加到 `PdfDocument`\
  \ 中\n- 获取与文档页面关联的 `Canvas` 对象引用\n- 在画布上绘制内容\n- 将 PDF 文档写入由打印框架提供的目标输出流中\n- 通知打印框架文档已准备好可以打印\n\
  \n在本章中，将提供对这些步骤的概述，随后将提供一个详细的教程，旨在演示如何在 Android 应用程序中实现自定义文档打印。\n\n### 88.1.1 自定义打印适配器\n\
  \n打印适配器的作用是为打印框架提供待打印的内容，并确保其按照用户选择的偏好进行格式化（考虑纸张大小和页面方向等因素）。\n\n在打印 HTML 和图像时，大部分工作由\
  \ Android 打印框架提供的适配器完成，这些适配器是为这些特定的打印任务设计的。例如，在打印网页时，当我们调用 `WebView` 类实例的 `createPrintDocumentAdapter()`\
  \ 方法时，系统会我们创建一个打印适配器。\n\n然而，在自定义文档打印的情况下，设计打印适配器并实现绘制和格式化内容以准备打印是应用程序开发者的责任。\n\n\
  自定义打印适配器是通过子类 `PrintDocumentAdapter` 类并重写该类中的一组回调方法创建的，这些方法会在打印过程的不同阶段由打印框架调用。这些回调方法可以总结如下：\n\
  \n- `onStart()` – 该方法在打印过程开始时被调用，提供的目的是让应用程序代码有机会在创建打印作业之前执行任何必要的任务。在 `PrintDocumentAdapter`\
  \ 子类中实现此方法是可选的。\n- `onLayout()` – 该回调方法在调用 `onStart()` 方法后被调用，并且每当用户更改打印设置时（如更改方向、纸张大小或颜色设置）都会再次调用。此方法应根据需要调整内容和布局以适应这些更改。更改完成后，该方法必须返回要打印的页数。在\
  \ `PrintDocumentAdapter` 子类中实现 `onLayout()` 方法是强制的。\n- `onWrite()` – 该方法在每次调用 `onLayout()`\
  \ 后被调用，负责在待打印页面的画布上渲染内容。除了其他参数外，此方法还会接收一个文件描述符，渲染完成后必须生成的 PDF 文档写入其中。然后调用 `onWriteFinished()`\
  \ 回调方法，并传递一个包含打印页面范围信息的参数。在 `PrintDocumentAdapter` 子类中实现 `onWrite()` 方法是强制的。\n-\
  \ `onFinish()` – 一个可选方法，如果实现，它将在打印过程完成后由打印框架调用一次，从而为应用程序提供执行任何可能必要的清理操作的机会。\n\n\
  ### 88.2 准备自定义文档打印项目\n\n从欢迎界面选择“Start a new Android Studio project”（启动新的 Android\
  \ Studio 项目）快速启动选项，在生成的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty Activity”（空活动）模板。\n\n在\
  \ `Name` 字段中输入 `CustomPrint`，并指定 `com.ebookfrenzy.customprint` 为包名。在点击“Finish”（完成）按钮之前，将\
  \ Minimum API level 设置更改为 API 26: Android 8.0 (Oreo)，并将 Language 菜单设置为 Kotlin。\n\
  \n将 `activity_main.xml` 布局文件加载到 Layout Editor（布局编辑器）工具中，在 Design（设计）模式下，选择并删除“Hello\
  \ World!” `TextView` 对象。从调色板的 Form Widgets 部分拖入一个 `Button` 视图并将其放置在布局视图的中心。选中 `Button`\
  \ 视图后，将 text 属性更改为“Print Document”，并将字符串提取到新资源中。完成后，用户界面布局应与[图 88-1]所示所示。\n\n![](img/as_3.5_custom_print_ui.png)\n\
  图 88-1\n\n当在应用程序中选择按钮时，需要调用一个方法来启动文档打印过程。在 Attributes（属性）工具窗口中，将 `onClick` 属性设置为调用名为\
  \ `printDocument` 的方法。\n\n### 88.3 创建自定义打印适配器\n\n在 Android 应用程序内部打印自定义文档涉及的大部分工作涉及自定义打印适配器的实现。此示例将需要一个实现了\
  \ `onLayout()` 和 `onWrite()` 回调方法的打印适配器。在 `MainActivity.kt` 文件中添加此新类的模板，使其内容如下：\n\
  \n```kotlin\npackage com.ebookfrenzy.customprint\n\nimport androidx.appcompat.app.AppCompatActivity\n\
  \nimport android.os.Bundle\n\nimport android.os.ParcelFileDescriptor\n\nimport android.print.PageRange\n\
  \nimport android.print.PrintAttributes\n\nimport android.print.PrintDocumentAdapter\n\
  \nimport android.os.CancellationSignal\n\nimport android.content.Context\n\nclass\
  \ MainActivity : AppCompatActivity() {\n\n    inner class MyPrintDocumentAdapter(private\
  \ var context: Context) {\n```\n\n### 88.4 实现 onLayout() 回调方法\n\n继续留在 `MainActivity.kt`\
  \ 文件中，首先添加 `onLayout()` 方法代码所需的某些导入指令：\n\n```kotlin\npackage com.ebookfrenzy.customprint\n\
  \nimport android.print.PrintDocumentInfo\n\nimport android.print.pdf.PrintedPdfDocument\n\
  \nimport android.graphics.pdf.PdfDocument\n\nclass MainActivity : AppCompatActivity()\
  \ {\n```\n\n接下来，修改 `MyPrintDocumentAdapter` 类以声明 `onLayout()` 方法中使用的变量：\n\n```kotlin\n\
  inner class MyPrintDocumentAdapter(private var context: Context) :\n```\n\n\n\n\n\
  ```kotlin\nPrintDocumentAdapter() {\n    private var pageHeight: Int = 0\n    private\
  \ var pageWidth: Int = 0\n    private var myPdfDocument: PdfDocument? = null\n \
  \   private var totalpages = 4\n}\n```\n\n请注意，在本示例中，将打印一个四页的文档。在更复杂的情况下，应用程序可能需要根据内容数量相对于用户纸张尺寸和页面方向的选择，动态计算需要打印的页数。\n\
  \n声明变量后，请按照下面的代码列表实现 `onLayout()` 方法：\n\n```kotlin\noverride fun onLayout(oldAttributes:\
  \ PrintAttributes?,\n                    newAttributes: PrintAttributes?,\n    \
  \                cancellationSignal: CancellationSignal?,\n                    callback:\
  \ LayoutResultCallback?,\n                    metadata: Bundle?) {\n    myPdfDocument\
  \ = PrintedPdfDocument(context, newAttributes)\n    val height = newAttributes.mediaSize?.heightMils\n\
  \    val width = newAttributes.mediaSize?.heightMils\n    height?.let {\n      \
  \  pageHeight = it / 1000 * 72\n    }\n    width?.let {\n        pageWidth = it\
  \ / 1000 * 72\n    }\n    cancellationSignal?.let {\n        if (it.isCanceled)\
  \ {\n            callback?.onLayoutCancelled()\n            return\n        }\n\
  \    }\n    if (totalpages > 0) {\n        val builder =\n            PrintDocumentInfo.Builder(\"\
  print_output.pdf\").setContentType(\n                    PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n\
  \                    .setPageCount(totalpages)\n        val info = builder.build()\n\
  \        callback?.onLayoutFinished(info, true)\n    } else {\n        callback?.onLayoutFailed(\"\
  Page count is zero.\")\n    }\n}\n```\n\n显然，此方法执行了相当多的任务，每项任务都需要详细的解释。\n\n首先，会以\
  \ `PdfDocument` 类实例的形式创建一个新的 PDF 文档。当打印框架调用 `onLayout()` 方法时，传入的参数之一是一个类型为 `PrintAttributes`\
  \ 的对象，包含了用户为打印输出选择的纸张尺寸、分辨率和颜色设置的细节。在创建 PDF 文档时会使用这些设置，以及通过构造方法之前为我们存储的 activity\
  \ 环境：\n\n`myPdfDocument = PrintedPdfDocument(context, newAttributes)`\n\n该方法随后使用\
  \ `PrintAttributes` 对象提取文档页面的高度和宽度值。这些维度以英寸千分之一的形式存储在对象中。由于本示例中稍后使用这些值的方法是以 1/72\
  \ 英寸为单位的，因此这些数字在存储之前经过了转换：\n\n```kotlin\nval height = newAttributes?.mediaSize?.heightMils\n\
  val width = newAttributes?.mediaSize?.heightMils\nheight?.let {\n    pageHeight\
  \ = it / 1000 * 72\n}\nwidth?.let {\n    pageWidth = it / 1000 * 72\n}\n```\n\n\
  虽然此示例没有使用用户的颜色，但可以通过调用 `PrintAttributes` 对象的 `getColorMode()` 方法获取此属性，该方法将返回 `COLOR_MODE_COLOR`\
  \ 或 `COLOR_MODE_MONOCHROME` 值。\n\n当调用 `onLayout()` 方法时，会传入一个类型为 `LayoutResultCallback`\
  \ 的对象。该对象为方法提供了一种通过一组方法向打印框架反馈状态。例如，当用户取消打印时，会调用 `onLayout()` 方法。进程已取消的事实通过 `cancellationSignal`\
  \ 参数中的设置指示。如果检测到取消操作，`onLayout()` 方法必须调用 `LayoutResultCallback` 的 `onLayoutCancelled()`\
  \ 方法，以通知打印框架已收到取消且布局任务已取消：\n\n```kotlin\ncancellationSignal?.let {\n    if (it.isCanceled)\
  \ {\n        callback?.onLayoutCancelled()\n        return\n    }\n}\n```\n\n当布局工作完成后，该方法需要调用\
  \ `LayoutResultCallback` 对象的 `onLayoutFinished()` 方法并传递两个参数。第一个参数的形式为 `PrintDocumentInfo`\
  \ 对象，包含有关要打印文档的信息。这些信息包括 PDF 文档使用的名称、内容类型（在本例中是文档而非图像）以及页数。第二个参数是一个 `Boolean` 值，表示自上一次调用\
  \ `onLayout()` 方法以来布局是否发生了变化：\n\n```kotlin\nif (totalpages > 0) {\n    val builder\
  \ = PrintDocumentInfo.Builder(\"print_output.pdf\").setContentType(\n          \
  \  PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n            .setPageCount(totalpages)\n\
  \    val info = builder.build()\n    callback?.onLayoutFinished(info, true)\n} else\
  \ {\n    callback?.onLayoutFailed(\"Page count is zero.\")\n}\n```\n\n如果页数为零，代码将通过调用\
  \ `LayoutResultCallback` 对象的 `onLayoutFailed()` 方法向打印框架报告此失败。调用 `onLayoutFinished()`\
  \ 方法通知打印框架布局工作已完成，触发对 `onWrite()` 方法的调用。\n\n### 8.5 实现 `onWrite()` 回调方法\n\n`onWrite()`\
  \ 回调方法负责渲染文档页面，然后通知打印框架文档已准备好打印。完成后，`onWrite()` 方法如下：\n\n```kotlin\npackage com.ebookfrenzy.customprint\n\
  import java.io.FileOutputStream\nimport java.io.IOException\n\noverride fun onWrite(pageRanges:\
  \ Array<out PageRange>?,\n                    destination: ParcelFileDescriptor,\n\
  \                    cancellationSignal: android.os.CancellationSignal?,\n     \
  \               callback: WriteResultCallback?) {\n    for (i in 0 until totalpages)\
  \ {\n        if (pageInRange(pageRanges, i)) {\n            val newPage = PdfDocument.PageInfo.Builder(pageWidth,\n\
  \                    pageHeight, i).create()\n            val page = myPdfDocument?.startPage(newPage)\n\
  \            cancellationSignal?.let {\n                if (it.isCanceled) {\n \
  \                   callback?.onWriteCancelled()\n                    myPdfDocument?.close()\n\
  \                    myPdfDocument = null\n                    return\n        \
  \        }\n            }\n            page?.let {\n                drawPage(it,\
  \ i)\n            }\n            myPdfDocument?.finishPage(page)\n        }\n  \
  \  }\n\n    try {\n        myPdfDocument?.writeTo(FileOutputStream(destination?.fileDescriptor))\n\
  \    } catch (e: IOException) {\n        callback?.onWriteFailed(e.toString())\n\
  \        return\n    } finally {\n        myPdfDocument?.close()\n        myPdfDocument\
  \ = null\n    }\n\n    callback?.onWriteFinished(pageRanges)\n}\n```\n\n\n\n\n在将页面写入\
  \ PDF 文档时，`onWrite()` 方法必须采取措施，以确保只打印用户指定的页面。为了实现这一点，打印框架（Printing framework）会传递一个\
  \ `PageRange` 对象数组作为参数，用于指示要打印的页面范围。在上面的 `onWrite()` 实现中，会为每个页面调用一个名为 `pagesInRange()`\
  \ 的方法，以验证该页面是否在指定的范围内。`pagesInRange()` 方法的代码将在本章稍后实现。\n\n```kotlin\nfor (i in 0\
  \ until totalpages) {\n    if (pageInRange(pageRanges, i)) {\n```\n\n对于位于任何指定范围内的每个页面，都会创建一个新的\
  \ `PdfDocument.Page` 对象。在创建新页面时，会将之前由 `onLayout()` 方法存储的高度和宽度值作为参数传递，以便使页面大小与用户选择的打印选项匹配：\n\
  \n```kotlin\nval newPage = PageInfo.Builder(pageWidth, pageHeight, i).create()\n\
  val page = myPdfDocument?.startPage(newPage)\n```\n\n与 `onLayout()` 方法一样，`onWrite()`\
  \ 方法需要响应取消请求。在这种情况下，代码会在关闭并取消 `myPdfDocument` 变量引用之前，通知打印框架取消已执行：\n\n```kotlin\n\
  cancellationSignal?.let {\n    if (it.isCanceled) {\n        callback?.onWriteCancelled()\n\
  \        myPdfDocument?.close()\n        myPdfDocument = null\n        return\n\
  \    }\n}\n```\n\n只要打印过程没有被取消，该方法就会调用一个方法在当前页面上绘制内容，然后调用 `myPdfDocument` 对象的 `finishedPage()`\
  \ 方法：\n\n```kotlin\npage?.let {\n    drawPage(it, i)\n}\nmyPdfDocument?.finishPage(page)\n\
  ```\n\n`drawPage()` 方法负责将内容绘制到页面上，并在 `onWrite()` 方法完成后实现。\n\n当所需的页面数量已添加到 PDF 文档后，文档将通过作为\
  \ `onWrite()` 方法参数传递的文件符（file descriptor）写入目标流。如果由于任何原因写入操作失败，该方法将通过调用 `WriteResultCallback`\
  \ 对象的 `onWriteFailed()` 方法（同样也作为 `onWrite()` 方法的参数传递）来通知框架：\n\n```kotlin\ntry {\n\
  \    myPdfDocument?.writeTo(FileOutputStream(\n            destination?.fileDescriptor))\n\
  } catch (e: IOException) {\n    callback?.onWriteFailed(e.toString())\n    return\n\
  } finally {\n    myPdfDocument?.close()\n    myPdfDocument = null\n}\n```\n\n最后，调用\
  \ `WriteResultsCallback` 对象的 `onWriteFinish()` 方法，以通知打印框架文档已准备好打印。\n\n## 88.6 检查页面是否在范围内\n\
  \n如前所述，当调用 `onWrite()` 方法时，它会接收一个 `PageRange` 对象数组，用于指示文档内要打印的页面范围。`PageRange` 类设计用于存储页面范围的起始页和结束页，这些信息可以通过该类的\
  \ `getStart()` 和 `getEnd()` 方法进行访问。\n\n在上一节实现 `onWrite()` 方法时，调用了一个名为 `pageInRange()`\
  \ 的方法，该方法接受一个 `PageRange` 对象数组和一个页码作为参数。`pageInRange()` 方法的作用是识别指定的页码是否在指定的范围内，它可以如下所示在\
  \ `MainActivity.kt` 类的 `MyPrintDocumentAdapter` 类中实现：\n\n```kotlin\ninner class\
  \ MyPrintDocumentAdapter(private var context: Context) :\n    PrintDocumentAdapter()\
  \ {\n\n    private fun pageInRange(pageRanges: Array<out PageRange>?, page: Int):\
  \ Boolean {\n        pageRanges?.let {\n            for (i in it.indices) {\n  \
  \              if (page >= it[i].start && page <= it[i].end)\n                 \
  \   return true\n            }\n        }\n        return false\n    }\n```\n\n\
  ### 8.7\n我们现在已经到了需要编写代码来在页面上绘制内容的阶段，以便它们准备好打印。所绘制的内容完全取决于应用程序，并受到使用 `Canvas` 类所能实现内容的限制。然而，为了本示例，将在画布上绘制一些简单的文本和图形。`onWrite()`\
  \ 方法被设计为调用名为 `drawPage()` 的方法，该方法接受代表当前页面的 `PdfDocument.Page` 对象和一个代表页码的整数作为参数。在\
  \ `MainActivity.kt` 中，此方法现在应如下实现：\n\n```kotlin\npackage com.ebookrenzy.customprint\n\
  \nimport android.graphics.Color\nimport android.graphics.Paint\n\nclass MainActivity\
  \ : AppCompatActivity() {\n\n    inner class MyPrintDocumentAdapter(private var\
  \ context: Context) :\n        PrintDocumentAdapter() {\n\n        private fun drawPage(page:\
  \ PdfDocument.Page, pagenumber: Int) {\n            var pagenum = pagenumber\n \
  \           val canvas = page.canvas\n            pagen++ // 让页码从 1 开始\n       \
  \     val titleBaseLine = 72\n            val leftMargin = 5\n            val paint\
  \ = Paint()\n            paint.color = Color.BLACK\n            paint.textSize =\
  \ 40f\n            canvas.drawText(\n                \"Test Document Page \" + pagenum,\n\
  \                leftMargin.toFloat(),\n                titleBaseLine.toFloat(),\n\
  \                paint)\n            paint.textSize = 14f\n            canvas.drawText(\"\
  This is some test content to verify that custom document printing works\", leftMargin.toFloat(),\
  \ (titleBaseLine + 35).toFloat(), paint)\n            if (pagenum % 2 == 0)\n  \
  \              paint.color = Color.RED\n            else\n                paint.color\
  \ = Color.GREEN\n            val pageInfo = page.info\n            canvas.drawCircle((pageInfo.pageWidth\
  \ / 2).toFloat(),\n                (pageInfo.pageHeight / 2).toFloat(),\n      \
  \          150f, paint)\n        }\n}\n```\n\n在画布上绘制完成后，该方法将控制权返回给 `onWrite()` 方法。\n\
  \n随着 `drawPage()` 方法完成，`MyPrintDocumentAdapter` 类现在完成。\n\n## 88.8 启动打印任务\n\n\n\n\
  \n\n当用户点击“Print Document”（打印文档）按钮时，将调用 `printDocument()` onClick 事件处理方法。因此，在开始测试之前，剩下的工作是将此方法添加到\
  \ `MainActivity.kt` 文件中，并特别确保将其放置在 `MyPrintDocumentAdapter` 类之外：\n\n```kotlin\n\
  package com.ebookfrenzy.customprint\n\nimport android.print.PrintManager\nimport\
  \ android.view.View\n\nclass MainActivity : AppCompatActivity() {\n    fun printDocument(view:\
  \ View) {\n        val printManager = this\n            .getSystemService(Context.PRINT_SERVICE)\
  \ as PrintManager\n        val jobName = this.getString(R.string.app_name) + \"\
  \ Document\"\n        printManager.print(jobName, MyPrintDocumentAdapter(this),\
  \ null)\n    }\n}\n```\n\n该方法在创建一个新的 `String` 对象作为打印任务的名称之前，获取了设备上运行的 `Print Manager`（打印管理器）服务的引用。最后，调用\
  \ `Print Manager` 的 `print()` 方法来启动打印任务，并传递任务名称和我们自定义打印文档适配器类的实例。\n\n## 88.9 测试应用程序\n\
  \n在运行 Android 4.4 或更高版本的 Android 设备或模拟器上编译并运行应用程序。应用程序加载后，点击“Print Document”按钮以启动打印任务，并为输出选择合适的目标（“Save\
  \ to PDF”选项是避免浪费纸张和打印机墨水的实用选项）。\n\n检查打印输出，它应该包含包含文本和图形的 4 个页面。例如，图 88-3 显示了作为 `PDF`\
  \ 文件查看的四页文档，准备保存在设备上。\n\n尝试其他的打印配置选项，例如在打印面板中更改纸张大小、方向和页面设置。每个设置更改都应反映在打印输出中，这表明自定义打印文档适配器运行正常。\n\
  \n![](img/Image24432.png)\n\n图 88-3\n\n## 88.10 总结\n\n虽然实现自定义文档打印比 `Android Printing\
  \ framework` 的 HTML 和图像打印选项更复杂，但自定义文档打印在从 Android 内部打印复杂内容方面提供了相当大的灵活性。实现自定义文档打印的大部分工作涉及创建一个自定义的\
  \ `Print Adapter`（打印适配器）类，以便它不仅能在文档页面上绘制内容，还能在用户对打印设置（如页面大小和打印范围）进行更改时做出正确响应。\n\n\
  ## 89. Android App Links 简介\n\n随着技术的演进，Web 内容和移动内容之间的传统区别开始模糊。这一点最明显的一个领域是渐进式 Web\
  \ 应用（PWA）的日益普及，这些 Web 应用的外观和行为非常像传统的移动应用。\n\n另一个趋势是让移动应用中的内容可以在 Web 搜索和通过 URL 链接被发现。在\
  \ Android 应用开发背景下，`App Links`（应用链接）功能专门设计用于让用户更容易地发现和访问存储在 Android 应用中的内容，即使用户没有安装该应用。\n\
  \n### 89.1 Android App Links 概述\n\nApp link（应用链接）是一个标准的 `HTTP URL`，旨在作为一种从网站或应用等外部源直接链接到应用中特定位置的便捷方式。App\
  \ links（也称为深度链接）主要用于鼓励用户与应用交互，并允许用户分享应用内容。\n\nApp link 的实现是一个多步骤过程，涉及在项目清单文件中添加\
  \ `intent filters`（意图过滤器）、在关联应用 Activity 中实现链接处理代码，以及使用数字资产文件将应用与 Web 内容关联。\n\n\
  这些步骤可以通过手动修改项目更改来完成，也可以使用 `Android Studio App Links Assistant` 自动完成。\n\n本章的剩余部分将从对项目需要进行的更改来概述\
  \ app links 的实现。下一章（“Android Studio App Links Tutorial”）将演示如何使用 `App Links Assistant`\
  \ 实现相同的结果。\n\n### 89.2 App Link Intent Filters\n\nApp link URL 需要映射到应用项目中的特定 Activity。这是通过在项目的\
  \ `AndroidManifest.xml` 文件中添加 `intent filters` 实现的，这些过滤器旨在响应 `android.intent.action.VIEW`\
  \ 操作来启动 Activity。意图过滤器在要启动的 Activity 元素内声明，并且包含概述 app link URL 的 scheme（方案）、host（主机）和路径的数据。例如，下面的清单声明了一个意图过滤器，当检测到匹配\
  \ `http://www.example.com/welcome` 的 app link 时，启动名为 `MyActivity` 的 Activity：\n\n\
  ```xml\n<activity android:name=\"com.ebookfrenzy.myapp.MyActivity\">\n    <intent-filter>\n\
  \        <action android:name=\"android.intent.action.VIEW\" />\n        <category\
  \ android:name=\"android.intent.category.DEFAULT\" />\n        <category android:name=\"\
  android.intent.category.BROWSABLE\" />\n        <data android:scheme=\"http\" android:host=\"\
  www.example.com\" android:pathPrefix=\"/welcome\" />\n    </intent-filter>\n</activity>\n\
  ```\n\n处理歧义意图过滤器的顺序可以使用 intent-filter 标签的 `order` 属性指定，如下所示：\n\n```xml\n<application>\n\
  \    <activity android:name=\" com.ebookfrenzy.myapp.MyActivity\">\n        <intent-filter\
  \ order=\"1\">\n            ...\n        </intent-filter>\n    </activity>\n</application>\n\
  ```\n\n意图过滤器将导致 app link 启动正确的 Activity，但目标 Activity 仍需要实现代码来处理意图。\n\n### 89.3 处理\
  \ App Link Intents\n\n在大多数情况下，启动的 Activity 需要获取 app link URL 的访问，并根据 URL 的结构采取特定行动。继续上面的示例，当通过包含路径\
  \ `/welcome/newuser` 的 URL 启动时，Activity 显示的内容可能与路径设置为 `/welcome/existinguser` 的\
  \ URL 显示的内容不同。\n\n当通过链接启动 Activity 时，会传递一个 `intent` 对象，其中包含有关启动 Activity 操作的数据，包括一个包含\
  \ app link URL 的 `Uri` 对象。在 Activity 的初始化阶段，可以添加代码按如下提取这些数据：\n\n```kotlin\nval appLinkIntent\
  \ = intent\nval appLinkAction = appLinkIntent.action\nval appLinkData = appLinkIntent.data\n\
  ```\n\n获取 app link 的 `Uri` 后，可以使用构成 URL 路径的各种组件对在 Activity 内要执行的操作做出决策。在下面的代码示例中，URL\
  \ 的最后一个组件被用于识别为新用户还是现有用户显示内容：\n\n```kotlin\nval userType = appLinkData.lastPathSegment\n\
  if (userType == \"newuser\") {\n    // 显示新用户内容\n} else {\n    // 显示现有用户内容\n}\n```\n\
  \n### 89.4 将应用与网站关联\n\n默认情况下，Android 将为用户提供一组处理 app link 的选项，如 图 89-1 所示的面板。这通常包含\
  \ Chrome 浏览器和目标应用。\n\n![](img/Image242511.png)\n\n图 89-1\n\n为了防止这种情况发生，app link\
  \ URL 需要与其基础的网站进行关联。这是通过创建一个名为 `assetlinks.json` 的数字资产链接文件并将其安装在网站的 `.well-known`\
  \ 文件夹中实现的。注意，数字资产链接仅适用于基于 `https` 的网站。\n\n\n\n\n\n数字资产链接文件包含一个关系声明，用于允许目标应用使用网站的链接\
  \ URL 启动，以及一个目标声明，用于声明该项目的伴侣应用包名和 SHA-256 证书指纹。例如，典型的资源链接文件内容可能如下：\n\n```json\n\
  [{\n    \"relation\": [\"delegate_permission/common.handle_all_urls\"],\n    \"\
  target\" : { \"namespace\": \"android_app\",\n      \"package_name\": \"<app package\
  \ name here>\",\n      \"sha256_cert_fingerprints\": [\"<app certificate here>\"\
  ] }\n}]\n```\n\n`assetlinks.json` 文件可以包含多个数字资产链接，可能允许单个网站与多个伴侣应用关联。\n\n# 89.5 总结\n\
  Android App 链接（App Links）允许通过来自外部网站或其他应用程序的 URL 链接启动应用活动。App 链接是通过项目清单文件中的意图过滤器（intent\
  \ filters）与启动活动中的意图处理代码（intent handling code）结合实现的此外，通过使用数字资产链接文件（Digital Assets\
  \ Link file），可以将应用 链接中使用的域名与相应的网站关联。一旦建立关联，当使用 App 链接时，Android 就不再需要用户选择目标应用。\n\n\
  # 90. Android Studio App 链接教程\n本章的目标是为 Android 应用 链接和 Android Studio App 链接助手（App\
  \ Link Assistant）提供实际演示。\n\n本章将为现有的 Android 应用添加应用 链接支持，允许通过应用 链接 URL 启动活动。除了启动活动外，所显示的内容将在\
  \ URL 的路径中指定。\n\n## 90.1 关于示例应用\n本章使用的项目命名为 `AppLinking`，是一个基础应用，旨在让用户查找有关伦敦地标的信息。该应用使用通过标准\
  \ Android 内容提供者类（content provider class）访问的 `SQLite` 数据库。该应用提供了一个现有的数据库，其中包含伦敦一些热门旅游景点的记录。除了现有的数据库条目外，应用还允许用户添加和删除地标描述。\n\
  \n在目前的形式下，该应用允许搜索现有记录，并添加新记录和删除记录。\n\n该项目包含两个名为 `AppLinkingActivity` 和 `LandmarkActivity`\
  \ 的活动。`AppLinkingActivity` 是应用启动时启动的主活动。该活动允许用户输入搜索标准并向数据库中添加额外记录。当搜索找到匹配的记录时，`LandmarkActivity`\
  \ 将启动并显示相关地标的信息。\n\n本章的目标是增强该应用以添加对应用 链接的支持，以便可以使用 URL 在应用内显示特定的地标记录。\n\n## 90.2\
  \ 数据库模式\n示例应用的数据包含项目层次结构中 `app -> assets -> databases` 文件夹下的名为 `landmarks.db` 的文件中。数据库包含一个名为\
  \ `locations` 的单表，其结构概括如表 90-1 所示：\n\n| 列名 | 类型 | 描述 |\n| :--- | :--- | :--- |\n\
  | _id | String | 主索引，此列包含唯一标识数据库中地标的字符串值。 |\n| Title | String | 地标的名称（例如，伦敦桥）。 |\n\
  | description | String | 地标的描述。 |\n| personal | Boolean | 表示该记录是私人的还是公开的。对于用户添加的所有记录，此值被设置为\
  \ `true`。数据库提供的现有记录被设置为 `false`。 |\n\n表 90-1\n\n## 90.3 加载并运行项目\n该项目位于以下 URL 处的示例源码下载包的\
  \ `AppLinking` 文件夹中：\n[`www.ebookfrenzy.com/retail/as36kotlin/index.php`](http://www.ebookfrenzy.com/retail/as36kotlin/index.php)\n\
  \n找到文件夹后，在 Android Studio 中打开它并在设备或模拟器上运行应用。一旦应用启动，将出现图 90-1 所示的屏幕：\n\n![](img/Image24494.png)\n\
  图 90-1\n\n按照目前的实现方式，使用位置 ID 定位地标。默认数据库配置当前包含由 ID `londonbridge` 和 `toweroflondon`\
  \ 引用的两条记录。通过在 ID 字段中输入 `londonbridge` 并点击 `Find` 按钮测试搜索功能。当找到匹配的记录时，将启动第二个活动（`LandmarkActivity`）并传递用于显示的记录的信息。这些信息以添加到\
  \ `Intent` 对象的额外数据（extra data）的形式存在。`LandmarkActivity` 使用这些信息从数据库中提取记录，并使用图 90-2\
  \ 所示的屏幕显示给用户。\n\n![](img/Image24581.png)\n图 90-2\n\n## 90.4 添加 URL 映射\n现在应用已加载到\
  \ Android Studio 并经过测试，项目已准备好添加应用 链接支持。目标是让 `LandmarkActivity` 屏幕在响应应用 链接点击时启动并显示信息。这是通过将\
  \ URL 映射到 `LandmarkActivity` 实现的。对于此示例，URL 的格式如下：\n\n`http://<website domain>/landmarks/<landmarkId>`\n\
  \n完成所有步骤后，例如 URL 应导致应用显示伦敦塔的信息：\n`http://yourdomain.com/landmarks/toweroflondon`\n\
  \n要向项目添加 URL 映射，首先通过 `Tools -> App Links` 菜单选项打开 App 链接助手。打开后，助手将如图 90-3 所示：\n\n\
  ![](img/Image2462.png)\n图 90-3\n\n点击 `Open URL Mapping` 按钮开始将 URL 映射到活动。在映射屏幕内，点击\
  \ `+` 按钮（如图 90-4 所示）以添加新 URL：\n\n![](img/Image2473.png)\n图 90-4\n\n在 `Add URL Mapping`\
  \ 对话框的 `Host` 字段中，输入您的网站域名，如果没有则输入 `http://example.com`。\n\n`Path` 字段（在图 90-5 中标记为\
  \ A）是声明 URL 路径组件的地方。路径必须以 `/` 开头，因此在此字段中输入 `/landmarks`。\n\n`Path` 菜单（B）提供了以下三种匹配选项：\n\
  \n- `path`: URL 必须精确匹配 URL 的路径组件才能启动活动。如果路径设置为 `/landmarks`（例如），`http://example.com/landmarks`\
  \ 被视为匹配。然而，`http://example.com/landmarks/londonbridge` 则将不会被视为匹配。\n- `pathPrefix`:\
  \ 指定的路径仅被视为前缀。在 `/landmarks` 组件之后可以包含额外的路径组件（例如 `http://example.com/landmarks/londonbridge`\
  \ 仍被视为匹配）。\n- `pathPattern`: 允许使用基本正则表达式和通配符的形式指定路径，例如 `landmarks/*/[l-L]ondon/*`。\n\
  \n由于此示例中的路径是地标 ID 组件的前缀，请选择 `pathPrefix` 菜单选项。\n\n最后，使用 `Activity` 菜单（C）选择 `LandmarkActivity`\
  \ 作为响应应用 链接启动的活动：\n\n![](img/Image24812.png)\n图 90-5\n\n在对话框中完成设置后，点击 `OK` 按钮提交更改。通过在映射屏幕的\
  \ `Check URL Mapping` 字段中输入以下 URL（`<your domain>` 设置为上方 `Host` 字段中指定的域名），来检查 URL\
  \ 格式是否正确并分配给相应的活动：\n\n`http://<your domain>/landmarks/toweroflondon`\n\n\n\n\n\n\
  如果映射配置正确，`LandmarkActivity` 将列为映射的活动：\n\n![](img/Image24892.png)\n\n图 90-6\n\n最新版本的\
  \ Android 要求必须对 `HTTP` 和 `HTTPS` 协议都声明 App Links，即使只使用了其中一个。因此，在继续下一步之前，请重复上述步骤，将\
  \ `HTTPS` 版本的 URL 添加到列表中。\n\n下一步操作也将在 `App Links Assistant` 的 URL 映射屏幕中进行，因此请留在该屏幕。\n\
  \n## 90.5 添加 Intent Filter\n\n如上一章所的，需要一个意图过滤器（intent filter）来允许目标活动响应应用链接点击并启动。事实上，当添加\
  \ URL 映射时，意图过滤器已添加到项目清单文件中。在 `App Links Assistant` 的 URL 映射列表中选择了 URL 映射，向下滚动屏幕，直到意图过滤器的\
  \ `Preview`（预览）部分进入视野。预览应包含修改后的 `AndroidManifest.xml` 文件，其中包含了新添加的意图过滤器：\n\n![](img/Image2496.png)\n\
  \n图 90-7\n\n## 90.6 添加 Intent 处理代码\n\n到目前为止的步骤确保了在响应格式正确的应用链接 URL 时会启动正确的活动。下一步是在\
  \ `LandmarkActivity` 类中处理 intent，以便从数据库中提取正确的记录并将其显示给用户。在对 `LandmarkActivity.kt`\
  \ 文件中的代码进行任何更改之前，值得审查现有代码的某些区域。在代码编辑器中打开 `LandmarkActivity.kt` 文件，并找到 `onCreate()`\
  \ 和 `handleIntent()` 方法，它们目前的内容如下：\n\n```kotlin\noverride fun onCreate(savedInstanceState:\
  \ Bundle?) {\n    super.onCreate(savedInstanceState)\n    setContentView(R.layout.activity_landmark)\n\
  \    handleIntent(intent)\n}\n\nprivate fun handleIntent(intent: Intent) {\n   \
  \ val landmarkId = intent.getStringExtra(AppLinkingActivity.LANDMARK_ID)\n    displayLandmark(landmarkId)\n\
  }\n```\n\n在目前的形式下，代码期望在 `Intent` bundle 的额外数据中找到 landmark ID。由于活动现在也可以通过应用链接启动，因此此代码需要更改以处理这两种情况。首先删除\
  \ `onCreate()` 方法中对 `handleIntent()` 的调用：\n\n```kotlin\noverride fun onCreate(savedInstanceState:\
  \ Bundle?) {\n    super.onCreate(savedInstanceState)\n    setContentView(R.layout.activity_landmark)\n\
  \    handleIntent(intent)\n}\n```\n\n要添加初始的应用链接意图处理代码，返回 `App Links Assistant` 面板，并点击步骤\
  \ 2 下列出的 `Select Activity` 按钮。在活动选择对话框中，点击 `Insert Code` 按钮之前，选择 `LandmarkActivity`\
  \ 条目：\n\n![](img/Image2504.png)\n\n图 90-8\n\n返回 `LandmarkActivity.kt` 文件，注意以下代码已插入到\
  \ `onCreate()` 方法中（注意，如果 Android Studio 无法完成请求，您可以手动添加此代码）：\n\n```kotlin\n// ATTENTION:\
  \ This was auto-generated to handle app links.\n\nval appLinkIntent = intent\nval\
  \ appLinkAction = appLinkIntent.action\nval appLinkData = appLinkIntent.data\n```\n\
  \n此代码访问 `Intent` 对象并提取提取 `Action` 字符串和 `Uri`。如果活动启动是应用链接的结果，则 action 字符串将设置为 `android.intent.action.VIEW`，这与添加到清单文件中意图过滤器里声明的\
  \ action 匹配。相反，如果活动是通过主活动 `findLandmark()` 方法中的标准意图启动代码启动的，则 action 字符串将为空。通过检查分配给\
  \ action 字符串的值，可以编写代码来识别启动活动并采取适当的操作：\n\n```kotlin\noverride fun onCreate(savedInstanceState:\
  \ Bundle?) {\n    super.onCreate(savedInstanceState)\n    setContentView(R.layout.activity_landmark)\n\
  \    // ATTENTION: This was auto-generated to handle app links.\n    val appLinkIntent\
  \ = intent\n    val appLinkAction = appLinkIntent.action\n    val appLinkData =\
  \ appLinkIntent.data\n    val landmarkId = appLinkData?.lastPathSegment\n    if\
  \ (landmarkId != null) {\n        displayLandmark(landmarkId)\n    }\n}\n```\n\n\
  剩下的只需在该方法中添加一些额外代码以识别应用链接 URL 路径中的最后一个组件，并在查询数据库时将其作为 landmark ID 使用：\n\n```kotlin\n\
  override fun onCreate(savedInstanceState: Bundle?) {\n    super.onCreate(savedInstanceState)\n\
  \    setContentView(R.layout.activity_landmark)\n    // ATTENTION: This was auto-generated\
  \ to handle app links.\n    val appLinkIntent = intent\n    val appLinkAction =\
  \ appLinkIntent.action\n    val appLinkData = appLinkIntent.data\n    if (appLinkAction\
  \ != null) {\n        if (appLinkAction == \"android.intent.action.VIEW\") {\n \
  \           val landmarkId = appLinkData?.lastPathSegment\n            if (landmarkId\
  \ != null) {\n                displayLandmark(landmarkId)\n            }\n     \
  \   }\n    } else {\n        handleIntent(appLinkIntent)\n    }\n}\n```\n\n\n\n\n\
  要生成数字资产链接（Digital Asset Links）文件，请显示 App Links 助手并点击 Open Digital Asset Links File\
  \ Generator 按钮。这将显示如图 90-11 所示的面板：\n\n![](img/Image2529.png)\n\n图 90-11\n\n输入要上传资产文件的网站\
  \ URL，并验证应用 ID 是否与包名匹配。选择包含项目 SHA 签名密钥的密钥库文件（keystore），或使用菜单选择 Android Studio 的发布（release）或调试（debug）签名配置。请注意，在将应用发布到\
  \ Google Play 商店之前，需要将调试密钥替换为发布密钥。\n\n如果您的应用使用 Google 登录或其他支持的登录提供程序验证用户身份，并结合 Google\
  \ 的 Smart Lock 功能存储密码，则选择“在应用和网站之间共享凭据”选项将允许用户存储登录凭据，以便在两个平台登录时使用。\n\n配置好资产文件后，点击“Generate\
  \ Digital Asset Link File”按钮来预览并保存文件：\n\n![](img/Image25361.png)\n\n图 90-12\n\n\
  文件保存后，将其上传到上图中预览面板下方指定的路径，并点击“Link and Verify”按钮以完成流程。\n\n数字资产链接文件被链接并验证后，Android\
  \ 在启动标记活动（landmark activity）之前将不再显示选择面板。\n\n## 90.9 总结\n\n本章演示了在 Android 应用项目中实现\
  \ App Link 支持涉及的步骤。本章涵盖的内容包括在 Android Studio 中使用 App Link 助手、App Link URL 映射、意图过滤器（intent\
  \ filters）、使用数字资产文件项处理网站关联以及 App Link 测试。\n\n# 91. Android Studio Profiler 指南\n\n\
  Android Profiler 在 Android Studio 3.0 中引入，提供了一种在应用于设备或模拟器上运行时实时监控其 CPU、网络和内存指标的方法。这对于执行诸如识别应用性能瓶颈、检查应用是否恰当使用内存资源以及确保应用不使用过度网络数据带宽等任务是一个非常有价值的工具。本章将提供\
  \ Android Profiler 的引导，以便您可以开始使用它来监控自己的应用的行为和性能。\n\n## 91.1 访问 Android Profiler\n\
  \nAndroid Profiler 显示在工具窗口中，可以通过 `View -> Tool Windows -> Android Profiler` 菜单选项或任何用于显示\
  \ Android Studio 工具窗口的常规工具栏选项启动。显示后，Profiler 工具窗口将如图 91-1 所示：\n\n![](img/Image24275.png)\n\
  \n图 91-1\n\n在上方图中，在任何连接的设备或当前运行的模拟器上都未检测到进程。要查看分析（profiling）信息，需要启动应用。但在在此之前，可能需要配置项目以启用收集高级分析信息。\n\
  \n## 91.2 启用高级分析\n\n如果应用使用比 API 26 更旧的 SDK 构建，则必须在编译期间插入一些额外的监控代码来构建应用，以便监控 Android\
  \ Profiler 支持的所有指标。要启用高级分析，请通过使用 Android Studio 工具栏中如图 91-2 所示的菜单，开始编辑构建构建的构建配置设置：\n\
  \n![](img/as_3.5_profiler_edit_configurations.png)\n\n图 91-2\n\n在 `Run/Debug` 配置对话框中，选择\
  \ `Profiling` 选项卡，并在点击 `Apply` 和 `OK` 按钮之前启用 `Enable advanced profiling` 选项。\n\n\
  ## 91.3 Android Profiler 工具窗口\n\n监控运行应用的活跃 Profiler 工具窗口如图 91-3 所示。\n\n![](img/as_3.2_main_profiler_window.png)\n\
  \n图 91-3\n\n`Sessions` 面板（标记为 A）列出了当前分析会话以及自 Android Studio 上次启动以来执行的任何其他存储会话。`Sessions`\
  \ 面板的右侧是实时分析窗口。除非使用 `Live` 按钮（B）进行暂停，否则窗口将继续随最新指标进行滚动。再次点击该按钮将跳转到当前时间并恢复滚动。可以使用水平滚动在记录的时间轴内手动来回。\n\
  \n窗口的顶行（C）是事件时间轴，显示了应用活动状态的变化，以及如用户触摸屏幕、输入文本或更改设备方向等其他事件。底部的时间轴（D）记录了自应用启动以来的流逝时间。\n\
  \n其余的时间轴显示了 CPU、内存、网络和能量使用的实时数据。将鼠标指针悬停在时间轴的任意一点上（不点击）将显示类似于图 91-4 所示的额外信息：\n\n\
  ![](img/Image24515.png)\n\n图 91-4\n\n点击 CPU、内存、网络或能量时间轴内部将显示相应的分析器窗口，本章剩余部分将对每个窗口进行探讨。\n\
  \n## 91.4 Sessions 面板\n\n当应用运行并显示 Profiler 工具窗口时，分析器将自动附加到应用并开始分析。显示应用名称、运行它的设备或模拟器以及开始时间的条目将出现在\
  \ `Sessions` 面板中，如图 91-5 所示。时间旁边的绿色圆表示正在进行分析。点击红色停止按钮将结束当前会话，但数据和图将在 Android Studio\
  \ 退出之前保持可用。可以通过点击 `+` 按钮并选择设备和应用启动额外的分析会话：\n\n![](img/as_3.2_profiler_sessions.png)\n\
  \n图 91-5\n\n时间旁边的绿色圆表示正在进行分析。点击红色停止按钮将结束当前会话，但数据和图将在 Android Studio 退出之前保持可用。可以通过点击\
  \ `+` 按钮并选择设备和应用启动额外的分析会话：\n\n![](img/as_3.2_profiler_session_menu.png)\n\n图 91-6\n\
  \n`Load from file...` 菜单选项允许之前从 CPU 分析器保存的 CPU 跟踪加载到 Profiler 中进行检查。\n\n要在应用启动时自动开始分析（而不是在应用启动后手动启动分析会话），首先打开如图\
  \ 91-2 所示的 `Run / Debug Configurations` 对话框。\n\n在对话框中，选择 `Profiling` 屏幕并启用 `Start\
  \ recording CPU activity startup` 选项：\n\n![](img/as_3.5_profiler_startup.png)\n\n\
  图 91-7\n\n要使此设置生效，必须使用 Android Studio 的 `Run -> Profile ‘app’` 菜单选项启动应用。\n\n## 91.5\
  \ CPU 分析器\n\n显示后，CPU 分析器窗口将如图 91-8 所示。与主窗口一样，数据是实时显示的，包括事件时间轴（A）以及显示当前应用和设备上所有其他进程总和的\
  \ CPU 使用情况实时滚动图（B）：\n\n![](img/as_3.2_cpu_profiler_window.png)\n\n图 91-8\n\n\n\n\
  \n图表下方列出了与当前应用 (C) 关联的所有线程列表。这被称为线程活动时间线，它以滚动时间线的形式呈现，通过颜色块显示每个线程的状态（绿色表示活动，黄色表示活动但正在等待磁盘或网络\
  \ I/O 操作完成，灰色表示线程当前处于睡眠状态）。\n\nCPU 分析器支持两种类型的方法跟踪（换句话说，对运行中应用中的单个方法进行分析）。当前的跟踪类型（采样或插桩）通过标记为\
  \ D 的菜单进行选择。跟踪类型可以总结如下：\n\n- `Sampled (Java)`（采样）：以频繁的间隔捕捉方法调用堆栈，以收集 Java 代码执行的跟踪数据。虽然比插桩方法的侵入性较小，但如果方法调用发生在捕获间隔期间，采样跟踪可能会漏掉这些调用。可以通过选择类型选择菜单中的\
  \ `Edit configurations…` 按钮并创建新的自定义跟踪类型来更改快照频率。\n- `Instrumented (Java)`（插桩）：跟踪运行应用内执行的所有\
  \ Java 方法调用的开始和结束。这种方法的优点是分析过程中不会遗漏任何方法调用，但可能由于跟踪所有方法调用的开销而影响应用性能，导致误导性的性能数据。\n\
  - `Sampled (Native)`（原生采样）：以频繁的间隔捕捉方法调用堆栈，以收集应用内原生（例如 C 或 C++）代码执行的跟踪数据。\n- `System\
  \ Trace`（系统跟踪）：分析应用运行时运行时设备上的系统级 CPU 和线程活动（换句话说，发生在应用进程之外的 CPU 活动）。\n\n在点击记录按钮 (E)\
  \ 后才会开始方法跟踪，并持续到停止记录。一旦记录完成，分析器工具窗口将以调用图格式显示方法跟踪，如图 91-12 所示，包括有关方法执行时间的信息。记录的跟踪还将出现在\
  \ Sessions（会话）面板中。点击磁盘图标（如下方图 91-9 所示）可以将跟踪保存到文件中，以便日后在本章前面介绍的部分在分析器中进行检查：\n\n```\n\
  ![](img/as_3.2_profiler_save_trace.png)\n```\n图 91-9\n\n跟踪结果可以在 Top Down（自顶向下）、Bottom\
  \ Up（自底向上）、Call Chart（调用图）和 Flame Chart（火焰图）模式下查看，每种模式可以总结如下：\n\n- `Top Down`：以层级格式显示跟踪期间调用的方法。选择一个方法将展开层次结构的下一层，并显示该方法调用的任何方法：\n\
  ```\n![](img/Image2467.png)\n```\n图 91-10\n\n- `Bottom Up`：显示跟踪期间调用的方法的反向层级列表。选择一个方法将显示调用所选方法的方法列表：\n\
  ```\n![](img/Image24741.png)\n```\n图 91-11\n\n- `Call Chart`：提供方法跟踪列表的图形化表示，其中横轴表示方法调用的开始、结束和持续时间。在纵轴上，每一行代表由上方方法调用的方法。应用包含的方法显示为绿色，API\
  \ 方法为橙色，第三方方法显示为蓝色：\n```\n![](img/Image24821.png)\n```\n图 91-12\n\n- `Flame Chart`：提供方法跟踪列表的反向图形化表示，其中每个方法在横轴上的尺寸取决于其相对于其他方法的执行时间量。图表中较宽的条目代表相对于其他方法使用最多执行时间的方法，这易于识别哪些方法耗时最长。请注意，具有匹配调用堆栈的方法调用（换句话说，由于同一序列的前置方法调用结果导致方法被重复调用的情况）在此视图中会被合并，以提供方法在跟踪期间性能的整体表示：\n\
  ```\n![](img/Image24911.png)\n```\n图 91-13\n\n在上述任何视图中的方法条目上点击右键，提供了在代码编辑窗口中打开该方法源代码的选项。\n\
  \n## 91.6 内存分析器 (Memory Profiler)\n\n在 Android 分析器主工具窗口点击内存时间线时，会显示内存分析器，并如图 91-14\
  \ 所示：\n\n```\n![](img/as_3.2_memory_profiler_window.png)\n```\n图 91-14\n\n内存时间线显示了相对于时间线右侧刻度的不同范围的内存分配，如颜色例所示。虚线\
  \ (A) 代表相对于时间线图左侧刻度的为应用分配的对象数量。\n\n垃圾桶图标 (B) 表示垃圾回收事件。当 Android 运行时认为内存中的对象不再需要并自动将其移除以释放内存时，就会发生垃圾回收事件。\n\
  \n除了通常的时间线，窗口还包含按钮 (C)，用于强制执行垃圾回收事件和捕捉堆转储 (heap dump)。\n\n堆转储（图 91-15）列出了执行转储时使用内存的应用内所有对象，显示了堆中对象实例的数量（分配计数）、对象所有实例的大小（浅大小\
  \ shallow size）以及 Android 运行时系统为这些对象保留内存总量（保留大小 retained size）。\n\n```\n![](img/as_3.2_memory_profiler_window.png)\n\
  ```\n图 91-15\n\n在堆转储列表中双击一个对象将显示实例视图（Instance View）。从列表中选择一个实例将显示引用该对象的引用面板（References\
  \ panel）。如图 91-16 所示，例如显示了一个 `String` 实例被选中，并被位于 `MainActivity` 类中的变量 `myString`\
  \ 引用：\n\n```\n![](img/Image2514.png)\n```\n图 91-16\n\n右键点击引用将提供了堆堆列表 `MainActivity`\
  \ 类或跳转到该类源代码的选项。\n\n## 91.7 网络分析器 (Network Profiler)\n\n网络分析器是 Android 分析器提供的工具中最简单的。选中后，网络工具窗口如图\
  \ 91-17 所示：\n\n```\n![](img/as_3.2_network_profiler_window.png)\n```\n图 91-17\n\n\
  与其他分析器窗口一样，网络分析器窗口包含事件时间线。无线电时间线（如图 91-17 所示）显示了相对于 Wi-Fi 连接的电源状态。\n\n时间线图 (B) 包括发送和接收的数据以及当前连接数。在编写时，网络分析器只能监控基于\
  \ `HttpURLConnection` 和 `OkHttp` 连接执行的网络活动。\n\n要查看发送或接收的文件信息，在时间线上点击并拖动以选择一段时间。完成选择后，将出现图\
  \ 91-18 中标记为 A 的面板，列出文件。从列表中选择一个文件将显示详情面板 (B)，可以从中获取更多信息，包括响应、头部和调用堆栈信息：\n\n```\n\
  ![](img/Image2544.png)\n```\n图 91-18\n\n## 91.8 能量分析器 (Energy Profiler)\n\n能量分析器（图\
  \ 91-19）对当前运行应用的能量消耗进行实时分析，按 CPU、网络和位置跟踪活动进行分类。\n\n```\n![](img/as_3.2_energy_profiler_window.png)\n\
  ```\n图 91-19\n\n\n\n\n能量分析器包含一个事件时间线 (A) 和一个显示当前能量使用情况的图表 (B)。图表根据图例 (C) 着色，图例还显示了三个类别当前的能量使用水平。选择图表的某个部分将列出任何导致能量过度消耗的系统进程，例如报警和作业、位置请求或唤醒锁（wake\
  \ locks）。\n\n# 91. 总结\n\nAndroid Profiler 可以实时监控应用的 CPU、内存、网络和能量资源使用情况，提供了一个可视化环境，以便其中定位内存泄漏、性能问题以及过度或低效的电池使用量，或通过网络连接进行的数据传输。Android\
  \ Profiler 由不同的分析器视图组成，允许对详细指标进行监控、记录和分析。\n\n# 92. Android 生物识别认证教程\n\n触控传感器现在已内置在许多\
  \ Android 设备中，用于识别用户并提供对设备功能以及应用功能的访问权限，例如使用指纹识别的应用内支付选项。当然，指纹识别只是多种不同身份验证方法之一，包括密码、PIN\
  \ 码以及最近推出的面部识别。\n\n尽管目前市场上只有少数 Android 设备提供面部识别，但在很不久的将来，这可能会变得更加常见。为了应对这一趋势，Google\
  \ 已开始从以指纹为中心的应用身份认证方法转向一种不具特定性的方法，这种方法被称为“生物识别认证”。在 Android 8 的初始版本中，这些生物识别功能仅涵盖指纹认证，但这将在\
  \ Android 操作系统和 SDK 的后续版本和更新中发生变化。\n\n本章既提供了生物识别认证的概述，还提供了一个详细的逐步教程，演示了在 Android\
  \ 应用项目项目中实现生物识别认证的实用方法。\n\n## 92.1. 生物识别认证概述\n\n关键的生物识别认证组件是 `BiometricPrompt` 类。该类执行了许多在早期\
  \ Android 版本中通过编写代码才能完成的工作，包括显示标准对话框以引导用户完成认证过程、执行认证并将结果报告给应用。该类还处理了多次失败的认证尝试，并在用户再次尝试之前强制执行超时限制。\n\
  \n`BiometricPrompt` 类包含一个伴生类 `Builder`，可以使用它来配置和创建 `BiometricPrompt` 实例，包括定义显示在生物识别认证对话框中的文本，以及对对话框中出现的取消按钮（也称为否定按钮）进行自定义。\n\
  \n`BiometricPrompt` 实例还分配了一组认证回调，这些回调将被调用以向应用提供认证操作的结果。还使用 `CancellationSignal`\
  \ 实例来允许应用在认证进行过程中取消认证。\n\n在涵盖这些基础知识后，本章的剩余部分将在示例项目中实现基于指纹的生物识别认证。\n\n## 92.2. 创建生物识别认证项目\n\
  \n从欢迎界面选择“Start a new Android Studio project”（新建 Android 项目）快速启动选项，在生成的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty\
  \ Activity”（空活动）模板。\n\n在“Name”字段中输入 `BiometricDemo`，并指定 `com.ebookfrenzy.biometricdemo`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将“Minimum API level”（最低 API 级别）设置为 `API 29: Android 9.0\
  \ (Pie)`，并将“Language”（语言）菜单更改为 `Kotlin`。\n\n## 92.3. 配置设备指纹认证\n\n指纹认证仅适用于包含触控传感器且已采取适当配置步骤以保护设备并录入至少一个指纹的设备。有关配置模拟器会话以测试指纹认证的步骤，请参考标题为[Using\
  \ and Configuring the Android Studio AVD Emulator]的章节。\n\n要在设备上配置指纹认证，首先打开“Settings”（设置）应用并选择“Security”（安全）选项。在“Security”设置屏幕内，选择“Fingerprint”（指纹）选项。在生成的信息屏幕上，点击“Next”按钮进入指纹设置屏幕。在启用指纹安全之前，必须配置备份锁屏解锁方法（如\
  \ PIN 码）。如果锁屏尚未加密，请按照步骤配置 PIN、图案或密码安全。\n\n锁屏加密后，继续进入指纹检测屏幕，并在提示时触摸传感器，如果需要，重复此过程以添加更多指纹。\n\
  \n![](img/Image242512.png)\n\n图 92-1\n\n## 92.4. 在 Manifest 文件添加生物识别权限\n\n生物识别认证要求应用在项目清单文件中请求\
  \ `USE_BIOMETRIC` 权限。在 Android Studio 项目工具窗口中，找到并编辑 `app -> manifests -> AndroidManifest.xml`\
  \ 文件，按按如下方式添加权限请求：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.biometricdemo\"\
  >\n    <uses-permission\n        android:name=\"android.permission.USE_BIOMETRIC\"\
  \ />\n.\n``` \n\n## 92.5. 设计用户界面\n\n为了保持示例尽可能简单，用户界面中的唯一视觉元素将是一个 `Button` 。找到并选择\
  \ `activity_main.xml` 布局资源文件，将其加载到 Layout Editor（布局编辑器）工具中。\n\n删除示例 `TextView` 对象，从调色板的\
  \ Common 类别中拖入 `Button` 对象，并将其放置在布局画布的中心。使用 Attributes（属性）工具窗口，将按钮的 text（文本）属性更改为“Authenticate”，将其提取到资源中。最后，配置\
  \ `onClick` 属性调用名为 `authenticateUser` 的方法。\n\n完成上述步骤后，布局应与图 92-2 所示：\n\n![](img/as_3.5_biometric_demo_ui.png)\n\
  \n图 92-2\n\n## 92.6. 添加 Toast 方便方法\n\n在示例代码的各个点，应用将被设计为通过 `Toast` 消息向用户显示信息。为了避免重复相同的\
  \ Toast 代码，将在主活动中添加名为 `notifyUser()` 的方便方法。该方法接受单个 `String` 值，并以 Toast 消息的形式显示给用户。现在编辑\
  \ `MainActivity.kt` 文件并添加该方法：\n\n```\n.\n.\nimport android.widget.Toast\n.\n.\n\
  private fun notifyUser(message: String) {\n    Toast.makeText(this,\n          \
  \   message,\n             Toast.LENGTH_LONG).show()\n}\n```\n\n## 92.7. 检查安全设置\n\
  \n在本章之前，已在要测试应用的设备或模拟器上配置了锁屏并注册了指纹。然而，重要的是应用程序中包含防御性代码，以确保在尝试指纹认证之前满足这些要求。这些步骤将在\
  \ `MainActivity.kt` 文件中的 `onCreate` 方法中执行，并利用 `Keyguard` 和 `PackageManager` 管理服务。注意已添加代码来验证应用是否配置了\
  \ `USE_BIOMETRIC` 权限：\n\n``` becomeimport androidx.core.app.ActivityCompat\nimport\
  \ android.Manifest\nimport android.app.KeyguardManager\nimport android.content.Context\n\
  import android.content.pm.PackageManager\n```\n\n\n\n\n\n```kotlin\nclass MainActivity\
  \ : AppCompatActivity() {\n\n    override fun onCreate(savedInstanceState: Bundle?)\
  \ {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_biometric_demo)\n\
  \        checkBiometricSupport()\n    }\n\n    private fun checkBiometricSupport():\
  \ Boolean {\n        val keyguardManager = getSystemService(Context.KEYGUARD_SERVICE)\
  \ as KeyguardManager\n        if (!keyguardManager.isKeyguardSecure) {\n       \
  \     notifyUser(\"Lock screen security not enabled in Settings\")\n           \
  \ return false\n        }\n        if (ActivityCompat.checkSelfPermission(this,\
  \ Manifest.permission.USE_BIOMETRIC) != PackageManager.PERMISSION_GRANTED) {\n \
  \           notifyUser(\"Fingerprint authentication permission not enabled\")\n\
  \            return false\n        }\n        return if (packageManager.hasSystemFeature(PackageManager.FEATURE_FINGERPRINT))\
  \ {\n            true\n        } else true\n    }\n}\n```\n\n上述代码通过使用 `Keyguard`\
  \ 管理器来验证是否配置了备用解锁方法（换句话说，可以使用 PIN 或其他身份验证方法作为指纹认证的替代方案来解锁屏幕）。如果锁屏未设置安全，代码将向用户报告该问题并从方法返回。\n\
  \n随后，该方法会在在使用 `package manager` 验证设备是否支持指纹认证之前，检查用户是否已为该应用启用了生物识别身份验证权限。\n\n## 92.8\
  \ 配置身份验证回调\n\n当配置生物识别提示对话框时，需要为其分配一组身份验证回调方法，这些方法会被调用以通知应用身份验证过程的成功或失败。这些方法需要封装在\
  \ `BiometricPrompt.AuthenticationCallback` 类实例中。在 `MainActivity.kt` 文件中保持不变，添加一个方法来创建并返回该类的实例，并实现其中相应的方法：\n\
  \n```kotlin\nimport android.hardware.biometrics.BiometricPrompt\n\nprivate val authenticationCallback:\
  \ BiometricPrompt.AuthenticationCallback\n    get() = object : BiometricPrompt.AuthenticationCallback()\
  \ {\n        override fun onAuthenticationError(errorCode: Int, errString: CharSequence)\
  \ {\n            notifyUser(\"Authentication error: $errString\")\n            super.onAuthenticationError(errorCode,\
  \ errString)\n        }\n        override fun onAuthenticationHelp(helpCode: Int,\
  \ helpString: CharSequence) {\n            super.onAuthenticationHelp(helpCode,\
  \ helpString)\n        }\n        override fun onAuthenticationFailed() {\n    \
  \        super.onAuthenticationFailed()\n        }\n        override fun onAuthenticationSucceeded(result:\
  \ BiometricPrompt.AuthenticationResult) {\n            notifyUser(\"Authentication\
  \ Succeeded\")\n            super.onAuthenticationSucceeded(result)\n        }\n\
  \    }\n```\n\n## 92.9 添加 CancellationSignal\n\n一旦启动，生物识别身份验证过程将独立于应用执行。为了给应用提供取消操作的方法，会创建一个\
  \ `CancellationSignal` 类实例并传递给生物识别身份验证过程。该 `CancellationSignal` 实例可以在需要时取消该过程。取消实例可以配置一个监听器，在取消完成完成后会被调用。在活动中添加一个新方法，如下所示配置并返回\
  \ `CancellationSignal` 对象：\n\n```kotlin\nimport android.os.CancellationSignal\n\n\
  private var cancellationSignal: CancellationSignal? = null\n\nprivate fun getCancellationSignal():\
  \ CancellationSignal {\n    cancellationSignal = CancellationSignal()\n    cancellationSignal?.setOnCancelListener\
  \ {\n        notifyUser(\"Cancelled via signal\")\n    }\n    return cancellationSignal\
  \ as CancellationSignal\n}\n```\n\n## 92.10 启动生物识别提示\n\n剩下的工作是在 `authenticateUser()`\
  \ 方法中添加代码，以创建并配置 `BiometricPrompt` 实例并启动身份验证。如下添加 `authenticateUser()` 方法：\n\n```kotlin\n\
  import android.view.View\nimport android.content.DialogInterface\n\nfun authenticateUser(view:\
  \ View) {\n    val biometricPrompt = BiometricPrompt.Builder(this)\n        .setTitle(\"\
  Biometric Demo\")\n        .setSubtitle(\"Authentication is required to continue\"\
  )\n        .setDescription(\"This app uses biometric authentication to protect your\
  \ data.\")\n        .setNegativeButton(\"Cancel\", this.mainExecutor, DialogInterface.OnClickListener\
  \ { dialogInterface, i ->\n            notifyUser(\"Authentication cancelled\")\n\
  \        }).build()\n    biometricPrompt.authenticate(getCancellationSignal(), mainExecutor,\
  \ authenticationCallback)\n}\n```\n\n使用 `BiometricPrompt.Builder` 类来创建一个新的 `BiometricPrompt`\
  \ 实例，并配置了标题、副标题和描述文本，将显示在提示对话框中。负按钮被配置为显示“Cancel”文本，并配置了一个监听器在点击此按钮时显示消息。最后，调用 `BiometricPrompt`\
  \ 实例的 `authenticate()` 方法，并传入 `AuthenticationCallback` 和 `CancellationSignal` 实例。生物识别提示还需要知道在哪个线程上执行身份验证。这是通过传递一个为所需线程配置的\
  \ `Executor` 对象定义的。在这种情况下，使用 `getMainExecutor()` 方法将主 `Executor` 对象传递给 `BiometricPrompt`\
  \ 实例，以便身份验证过程在应用的主线程上进行。\n\n## 92.11 测试项目\n\n项目现在完成，在物理 Android 设备或模拟器会话上运行应用并点击\
  \ Authenticate（认证）按钮，如图 92-3 所示显示 `BiometricPrompt` 对话框：\n\n![](img/as_3.2_biometric_prompt.png)\n\
  \n图 92-3\n\n运行时，可以通过触摸指纹传感器或使用模拟器内的扩展控制面板来模拟指纹触摸，正如“使用和配置 Android Studio AVD 模拟器”章节概述的那样。假设检测到已注册指纹，提示对话框将返回主活动，此时将显示来自成功身份验证方法的提示。\n\
  \n再次点击 Authenticate 按钮，这次使用未注册的指纹尝试身份验证。这次生物识别提示对话框将指示指纹未被识别：\n\n![](img/as_3.2_biometric_prompt_failed.png)\n\
  \n图 92-4\n\n通过点击生物识别提示框之外的活动来验证错误处理回调是否正常。提示对话框将消失，并出现以下提示消息：\n\nAuthentication\
  \ error: Fingerprint operation cancelled by user.\n\n检查使用取消按钮取消提示对话框是否会触发“Authentication\
  \ Canceled”提示消息。最后，使用未注册的指纹多次尝试身份验证，并注意在尝试多次后，提示对话框会指示发生了过多失败，在稍后之前无法再次尝试。\n\n##\
  \ 92.12 总结\n\n本章概述了如何在 Android 应用项目中集成生物识别身份验证。这涉及对 `BiometricPrompt` 类的使用，一旦配置了适当的消息文本和回调，它将自动处理大部分身份验证过程。\n\
  \n\n\n\n\n一旦 Android 应用程序的开发工作完成并在各种 Android 设备上通过了测试，下一步就是准备将应用程序提交到 Google Play。然而，在提交之前，必须对应用程序进行发布打包并使用私钥签名。本章将详细介绍获取私钥、为项目准备\
  \ Android App Bundle（应用包）以及将其上传到 Google Play 的步骤。\n\n## 93.1 发布准备流程\n\n在本书的在此之前，我们一直在以适用于测试和调试的模式构建应用程序项目。另一方面，要通过\
  \ Google Play 向客户发布应用程序包，需要采取一些额外的步骤。第一个要求是应用程序必须以发布模式（release mode）而非调试模式（debug\
  \ mode）编译。其次，应用程序必须使用私密钥进行签名，该密钥用于唯一标识你作为应用程序的开发者。最后，应用程序必须打包成 Android App Bundle。\n\
  \n虽然这些任务都可以在 Android Studio 环境之外完成，但正如本章其余部分所述，使用 Android Studio 的构建机制可以更轻松地执行这些程序。不过，重要的是要进一步了解\
  \ Android App Bundle。\n\n## 93.2 Android App Bundles\n\n当用户从 Google Play 安装应用时，应用将以\
  \ `APK` 文件的形式下载。该文件包含了在用户设备上安装和运行应用的所有内容。在 Android Studio 3.2 引入之前，开发者会使用 Android\
  \ Studio 生成一个或多个 `APK` 文件并将其上传到 Google Play。为了支持多种设备类型、屏幕尺寸和语言，这需要创建并上传针对每个目标设备和语言定制的多个\
  \ `APK` 文件，或者生成一个包含所有不同配置资源和平台二进制文件的大型通用 `APK`。\n\n创建多个 `APK` 文件涉及大量工作，且每次更新应用时都需要重复，这给应用发布过程造成了相当的时间开销。\n\
  \n通用 `APK` 选项减轻了开发者的负担，但导致了一个完全意想不到的问题。通过分析应用安装指标，Google 发现安装 `APK` 文件越大（导致下载时间变长和设备存储占用增加），应用获得的转化率就越低。转化率的计算方式为在\
  \ Google Play 上查看应用后完成安装的用户的百分比。事实上，Google 估计 `APK` 文件大小每增加 6MB，应用的转化率就会下降 1%。\n\
  \nAndroid App Bundles 通过提供一种方式解决了这两个问题：开发者可以在 Android Studio 内部创建一个单一包，并让 Google\
  \ Play 为每个单独的支持配置自动生成自定义的 `APK` 文件（这一概念被称为动态交付 Dynamic Delivery）。\n\nAndroid App\
  \ Bundle 本质上是一个 `ZIP` 文件，包含了构建适用于项目内已支持的设备和语言的 `APK` 文件所需的所有文件。例如，项目可能包含针对不同屏幕尺寸的资源和图像。当用户安装应用时，Google\
  \ Play 会接收有关用户设备的信息，包括显示器、处理器架构和语言。利用这些信息，适当的预生成 `APK` 文件将传输到用户的设备上。\n\n动态交付的额外优点是能够将应用拆分为多个模块，称为动态功能模块（dynamic\
  \ feature modules），每个模块包含应用内特定功能区域的代码和资源。每个动态功能模块都包含在与基础模块分离的独立 `APK` 文件中，并且在用户需要该功能时才会下载到设备上。动态交付和应用包还允许创建即时动态功能模块，这些可以在无需安装整个应用的情况下立即在设备上运行。这些主题将从标题为\
  \ Android 动态功能模块概述 的章节开始进行详细介绍。\n\n尽管仍然可以从 Android Studio 生成 `APK` 文件，但应用包现在是向 Google\
  \ Play 上传应用的推荐方式。\n\n## 93.3 注册 Google Play 开发者控制台账户\n\n应用程序提交过程的第一步是创建 Google Play\
  \ 开发者控制台账户。访问 `https://play.google.com/apps/publish/signup/` 并按照说明完成注册过程。请注意，注册需要支付一次性\
  \ 25 美元的费用。一旦应用上市，Google 将保留与应用相关的所有收入的 30%。\n\n账户创建后，下一步是收集有关应用程序的信息。为了将您的应用推市场，需要以下信息：\n\
  \n*   标题（Title）——应用程序的标题。\n*   短描述（Short Description）——最多 80 个单词的应用描述。\n*   完整描述（Full\
  \ Description）——最多 4000 个单词的应用描述。\n*   截图（Screenshots）——至多 8 张应用程序运行截图（至少需要两个）。Google\
  \ 建议提交在 7 英寸或 10 英寸平板电脑上运行的应用截图。\n*   语言（Language）——应用的语言（默认为美式英语）。\n*   宣传文本（Promotional\
  \ Text）——当您的应用出现在 Google Play 环境内的特殊促销活动中时将使用的文本。\n*   应用类型（Application Type）——您的应用程序被视为游戏还是普通应用。\n\
  *   类别（Category）——最能描述应用程序的类别（例如：金融、健康与健身、教育、体育等）。\n*   地区（Locations）——您希望您的应用程序可以购买的地理位置。\n\
  *   联系详情（Contact Details）——用户可以通过哪些方式与您联系以获取应用支持。选项包括网页、电子邮件和电话。\n*   定价与发行（Pricing\
  \ & Distribution）——关于应用程序价格以及营销和销售地理位置的信息。\n\n收集上述信息后，点击 Google Play 控制台中的“创建应用”按钮开始创建过程。\n\
  \n## 93.4 在控制台中配置应用\n\n首次点击“创建应用”按钮时，将出现商店列表界面，如下图 93-1\n\n图 93-1\n\n## 93.5 启用\
  \ Google Play 应用签名\n\n一旦应用条目完全配置，下一步是启用应用签名并上传应用包。\n\n\n\n\n直到最近，Google Play 的上传是通过在\
  \ Android Studio 内部使用发布版应用签名密钥进行签名，然后上传到 Google Play 控制台。虽然此选项仍然可用，但现在推荐的上传方式是使用一种被称为“Google\
  \ Play 应用签名”（Google Play App Signing）的流程。对于新创建的应用，这涉及选择加入 Google Play 应用签名，然后生成一个上传密钥（upload\
  \ key），用于在 Android Studio 内部签名应用包文件（app bundle）。当上传由 Android Studio 生成的应用包文件时，Google\
  \ Play 控制台会移除上传密钥，然后使用安全存储在 Google Play 服务器中的应用签名密钥对文件进行签名。对于现有应用，需要一些额外的步骤来启用 Google\
  \ Play 签名，这将在本章末尾进行介绍。\n\n### 加入 Google Play 应用签名\n\n在 `Google Play console` 中，从仪表板选择新添加的应用条目，并点击左侧导航面板中的\
  \ `App releases`（应用发布）选项。在 `App releases` 界面，选择 `Internal test track`（内部测试轨道）部分中的\
  \ `Manage`（管理）按钮。内部测试轨道在应用开发周期早期进行测试或进行 Android App Bundles 实验时非常有用。应用最终将通过 Alpha\
  \ 和 Beta 测试，最后准备好进行正式发布。\n\n![](img/android_studio_3.2_internal_track.png)\n图 93-2\n\
  \n在随后的屏幕上，点击 `Create Release`（创建发布）按钮显示如图 93-3 所示的设置界面：\n\n![](img/android_studio_3.2_enroll_in_app_signing.png)\n\
  图 93-3\n\n要将应用加入 Google Play 应用签名，请点击上方图中显示的 `Continue`（继续）按钮。这将为应用生成一个应用签名证书，该证书将安全地存储在\
  \ Google Play 中。下一步是在 Android Studio 内部生成上传密钥。这是生成已签名应用包过程的一部分。\n\n### 93.6 创建 Keystore\
  \ 文件\n\n要创建 keystore 文件，选择 `Android Studio Build` -> `Generate Signed Bundle / APK…`\
  \ 菜单选项，以显示如图 93-4 所示的 `Generate Signed Bundle or APK Wizard` 对向框：\n\n![](img/android_studio_3.2_select_app_bundle.png)\n\
  图 93-4\n\n在点击 `Next`（下一步）按钮之前，确认已选中 `Android App Bundle` 选项。\n\n如果你有一个现有的发布版 keystore\
  \ 文件，请点击下一个屏幕上的 `Choose existing…`（选择现有…）按钮并导航选择该文件。如果你尚未创建 keystore 文件，点击 `Create\
  \ new…`（新建…）按钮显示 `New Key Store` 对话框（图 93-5）。点击 `Key store path` 字段右侧的按钮，导航到文件系统上的合适位置，为\
  \ keystore 文件输入名称（例如 `release.keystore.jks`），并点击 `OK` 按钮。\n\n`New Key Store` 对话框分为两个部分。顶部部分与\
  \ keystore 文件有关。在此部分中，在 `Password` 和 `Confirm` 字段中都输入一个强密码来保护 keystore 文件。对话框的下部部分与存储在\
  \ key store 文件中的上传密钥有关。\n\n![](img/Image2483.png)\n图 93-5\n\n在 `New Key Store` 对话框的\
  \ `Certificate`（证书）部分中，输入以下详细信息：\n\n- 引用密钥的别名。可以是任何字符序列，但系统仅使用前 8 个字符。\n- 用于保护密钥的强密码。\n\
  - 密钥有效的年数（Google 建议超过 25 年）。\n- 此外，必须为剩余字段中的至少一个提供信息（例如，你的姓和，或组织名称）。\n\n![](img/Image24921.png)\n\
  图 93-6\n\n信息输入完成后，点击 `OK` 按钮继续创建包。\n\n### 93.7 创建 Android App Bundle\n\n下一步是指示 Android\
  \ Studio 以发布模式构建应用包包文件，然后使用新创建的私钥对其进行签名。此时，`Generate Signed Bundle or APK` 对话框应仍显示，且\
  \ keystore 路径、密码和密钥别名字段已填充信息：\n\n![](img/android_studio_3.2_keystore_info.png)\n\
  图 93-7\n\n确保已启用 `Export Encrypted Key`（导出加密密钥）选项，并在假设其他设置正确的情况下，点击 `Next` 按钮进入应用包生成屏幕（图\
  \ 93-8）。在此屏幕中，检查 `Destination Folder:`（目标文件夹）设置，以验证生成应用包文件的位置是否可以接受。如果偏好另一个位置，请点击文本字段右侧的按钮，并导航到所需的文件系统位置。\n\
  \n![](img/android_studio_3.2_generate_app_bundle.png)\n图 93-8\n\n点击 `Finish`（完成）按钮并等待\
  \ `Gradle` 系统构建应用包。一旦构建完成，将出现一个对话框，提供在资源管理器窗口中打开包含应用包文件的文件夹的选项，或将文件加载到 `APK Analyzer`\
  \ 中：\n\n![](img/android_studio_3.2_app_bundle_generated.png)\n图 93-9\n\n此时已准备好提交到\
  \ Google Play。点击定位链接打开文件浏览器。该文件应命名为 `bundle.aab` 且位于 `app/release` 子目录下，除非指定了其他位置。在此过程中生成的私钥应在签名和发布未来的应用时使用，并妥善备份。\n\
  \n### 93.8 生成测试 APK 文件\n\n此阶段的一个可选步骤是从应用包生成 APK 文件并安装到设备或模拟器上。Google 提供了一个名为 `bundletool`\
  \ 的命令行工具专门为此设计，可以从以下 URL 下载：\n\n`https://github.com/bundletool/releases`\n\n在编写时，`bundletool`\
  \ 以 `.jar` 形式提供，可以如下从命令行执行（注意版本号可能已更改）：\n\n```\njava -jar bundletool-all-0.9.jar\n\
  ```\n\n运行上述命令将列出工具中的所有可用选项。从应用包生成 APK 文件，使用 `build-apks` 选项。生成可以安装到设备或模拟器上的 APK\
  \ 文件，还需要进行签名。为了实现这一点，包含 `--ks` 选项以指定在本章之前创建的 keystore 文件路径，以及 `--ks-key-alias` 选项以指定生成密钥时的别名。\n\
  \n最后，必须使用 `--output` 标志来指定生成 APK 文件的路径（称为 APK 集合）。该文件不能已存在，并且要求具有 `.apks` 扩展名。将这些要求结合起来，得到如下命令行（考虑到你操作系统路径的差异）：\n\
  \n```\njava -jar bundletool-all-0.9.jar build-apks --bundle=/tmp/MyApps/app/release/bundle.aab\
  \ --output=/tmp/MyApks.apks --ks=/MyKeys/release.keystore.jks --ks-key-alias=MyReleaseKey\n\
  ```\n\n要将相应的 APK 文件安装到连接的设备或模拟器上，使用类似于下面的命令：\n\n```\njava -jar bundletool-all-0.9.jar\
  \ install-apks --apks=/tmp/MyApks.apks\n```\n\n\n\n此命令将指示工具为连接的设备识别合适的 APK 文件并安装它们，以便启动和测试应用。\n\
  \n也可以从连接设备的 APK 集合（APK Set）中提取 APK 文件而无需安装它们。此过程的第一步是获取连接设备的规格，如下所示：\n\n```bash\n\
  java -jar bundletool-all-0.9.0.jar get-device-spec --output=/tmp/device.json\n```\n\
  \n上述命令将生成一个类似于下面的 JSON 文件：\n\n```json\n{\n  \"supportedAbis\": [\"x86\"],\n  \"\
  supportedLocales\": [\"en-US\"],\n  \"screenDensity\": 420,\n  \"sdkVersion\": 27\n\
  }\n```\n\n接下来，使用此规格文件从 APK Set 中提取匹配的 APK 文件：\n\n```bash\njava -jar bundletool-all-0.9.0.jar\
  \ extract-apks --apks=/tmp/MyApks.apks --output-dir=/tmp/nexus5_apks --device-spec=/tmp/device.json\n\
  ```\n\n执行时，通过 `--output-dir` 标志指定的目录将包含适用于指定设备配置的正确 APK 文件。\n\n将 Android 应用推向市场的下一步是将其提交到\
  \ Google Play 开发者控制台，以便进行测试。\n\n## 93.9 将应用包包上传到 Google Play 开发者控制台\n\n返回 Google\
  \ Play 控制台内的内部测试轨道屏幕，通过将应用包拖放到指定区域进行上传，或者点击按钮浏览应用包文件：\n\n![](img/android_studio_3.2_app_bundle_upload.png)\n\
  \n图 93-10\n\n应用包文件上传后，Google Play 将生成所有必要的 APK 文件以备测试。一旦生成了 APK 文件，向下滚动到屏幕底部并点击\
  \ `Save`（保存）按钮。保存设置后，点击 `Review`（审核）按钮。\n\n## 93.10 探索应用包\n\n在审核屏幕上，点击包名称以展开有关该包的信息，如图\
  \ 93-11 所示：\n\n![](img/google_play_console_app_bundle_review.png)\n\n图 93-11\n\n\
  屏幕的此部分提供了与应用包支持的 API 级别、屏幕布局和平台相关的摘要信息。如需更多信息，请点击上方图中显示的 `Explore App Bundle`（探索应用包）选项。这将显示与通用\
  \ APK 文件（在图 93-12 中标记为 A）相比的尺寸节省情况，并提供下载单个 APK 文件用于本地测试 (B) 的选项，作为使用 `bundletool`\
  \ 的替代方案：\n\n![](img/google_play_console_app_bundle_explorer.png)\n\n图 93-12\n\n\
  包探索器还列出了支持的屏幕密度 (C) 以及相应的安装 APK 大小。点击屏幕密度的 `View Devices`（查看设备）选项将显示 APK 文件支持的设备：\n\
  \n![](img/google_play_console_app_bundle_supported_devices.png)\n\n图 93-13\n\n此时，应用已准备好进行测试，但在控制台中设置好测试人员之前，无法发布。\n\
  \n## 93.11 管理测试人员\n\n如果应用仍处于内部、Alpha 或 Beta 测试阶段，可以通过在 Google Play 控制台中选择应用，点击导航面板中的\
  \ `App releases`（应用发布），选择发布类型的 `Manage`（管理）按钮，并展开发布屏幕上的 `Manage testers`（管理测试人员）部分（如图\
  \ 93-14 所示）来指定授权测试人员列表：\n\n![](img/google_play_console_manage_testers.png)\n\n图\
  \ 93-14\n\n应用测试可用选项：\n\n* **内部测试（Internal Testing）** – 向最多 100 个指定的内部测试人员提供。这是将应用提供给少数已知测试人员的最快方法。\n\
  * **封闭测试（Closed Testing）** – 仅对通过电子邮件地址或 Google Groups 和 Google+ 社区成员指定的用户开放测试。\n\
  * **开放测试（Open Testing）** – 向 Google Play Store 内的所有用户提供。用户在测试期间提供了向您提供反馈的机制。也可以指定测试人员的总数（但不能少于\
  \ 1000 人）。\n\n如需使用 `Choose testing method`（选择测试方法）菜单选择要执行的测试类型，点击 `Create List`（创建列表）按钮，并手动或通过上传\
  \ CSV 文件指定测试用户的电子邮件地址。\n\n应用发布进行测试后，将显示选择加入 URL（opt-in URL）。返回应用的审核页（App Releases\
  \ -> Manage -> Edit Release -> Review`）并点击 `Start Rollout to Internal Testers`（向内部测试人员发布）按钮。\n\
  \n现在可以从管理测试人员屏幕（上方图 93-14）复制 URL 并提供给测试人员，让他们接受测试邀请并下载应用。\n\n## 93.12 上传新的应用包版本\n\
  \n为您的应用程序上传的第一个应用包版本号始终为 `1`。如果尝试上传具有相同版本号的包文件，控制台将带有以下错误拒绝该文件：\n\n`You need to\
  \ use a different version code for your APK because you already have one.`\n\n要解决此问题，需要增加嵌入包文件的版本代码。这在项目的模块级\
  \ `build.gradle` 文件中进行，如图 93-15 所示：\n\n![](img/Image2561.png)\n\n图 93-15\n\n默认情况下，该文件内容如下：\n\
  \n```gradle\napply plugin: 'com.android.application'\n\nandroid {\n    compileSdkVersion\
  \ 28\n    defaultConfig {\n        applicationId \"com.example.myapplication\"\n\
  \        minSdkVersion 26\n        targetSdkVersion 29\n        versionCode 1\n\
  \        versionName \"1.0\"\n        testInstrumentationRunner \"android.support.test.AndroidJUnitRunner\"\
  \n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n\
  \            proguardFiles getDefaultProguardFile('proguard-optimize.txt'), 'proguard-rules.pro'\n\
  \        }\n    }\n}\n\ndependencies {\n    implementation fileTree(dir: 'libs',\
  \ include: ['*.jar'])\n    implementation 'com.android.support:appcompat7:28.0'\n\
  \    implementation 'com.android.support:support-v4:28.0'\n    implementation 'com.android.support:design:28.0'\n\
  \    implementation 'com.android.support.constraint:constraint-layout:1.1.3'\n \
  \   testImplementation 'junit:junit:4.12'\n    androidTestImplementation 'com.android.support.test.runner:1.0.2'\n\
  \    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'\n\
  }\n```\n\n要更改版本代码，只需更改 `versionCode` 声明的数字。要更改显示给用户的版本号，更改 `versionName` 字符串。例如：\n\
  \n```gradle\nversionCode 2\nversionName \"2.0\"\n```\n\n完成这些更改后，重新构建 APK 并再次上传。\n\
  \n## 93.13 分析应用包文件\n\nAndroid Studio 分析应用包文件的内容。要分析包文件，选择 Android Studio 的 `Build\
  \ -> Analyze APK…` 菜单，导航并选择要审核的包文件。加载后，工具将显示有关包原始大小和下载大小的信息，以及包结构列表，如图 93-16 所示：\n\
  \n![](img/android_studio_3.2_bundle_analyzer.png)\n\n图 93-16\n\n选择 `classes.dex`\
  \ 文件将在下方面板中显示文件的类结构。在此面板中，可以探索单个类的详细信息，一直到类的方法级别：\n\n![](img/Image2583.png)\n\n\
  图 93-17\n\n\n\n同样，在文件列表中选择资源或图像文件将在下方面板中显示该文件的内容。可以通过点击 `Compare with previous APK…`（与之前的\
  \ APK 对）按钮并选择第二个 bundle 文件来查看两个 bundle 文件之间的大小差异。\n\n### 93.14 为现有应用启用 Google Play\
  \ 签名\n\n要对已在 Google Play 控制台中注册的应用启用 Google Play 签名，首先从控制台仪表板的应用列表中选择该应用。选中后，点击如图\
  \ 93-18 所示的左侧导航面板中的`App signing`链接：\n\n![](img/Image2592.png)\n\n图 93-18\n\n第一步是点击按钮下载\
  \ `PEPK Tool` (A)，该工具将用于加密项目的应用签名密钥。下载后，将其复制到包含现有密钥库（keystore）文件的目录中，并运行以下命令（将 `<your\
  \ app signing key file>` 和 `<your alias>` 分别替换为您的密钥库文件名和相应的别名密钥）：\n\n```bash\njava\
  \ -jar pepk.jar --keystore=<your app signing key file> --alias=<your alias> --output=encrypted_private_key_path\
  \ --encryptionkey=<your app signing key>\n```\n\n在提示时输入密钥库和密钥密码，然后检查是否生成了名为 `encrypted_private_key_path`\
  \ 的文件。该文件包含了加密后上传到 Google Play 商店的应用签名密钥。返回 Google Play 控制台，点击`App Signing Key`按钮\
  \ (B) 并上传 `encrypted_private_key_path` 文件。\n\n接下来，按照本章之前介绍的步骤生成上传密钥并将其存储新的密钥库文件中。在终端或命令提示符窗口中，切换目录到上传密钥库文件所在的位置，运行以下命令将密钥转换为\
  \ PEM 证书格式文件：\n\n```bash\nkeytool -export -rfc -keystore <your upload key file>\
  \ -alias <your alias> -file upload_certificate.pem\n```\n\n生成文件后，点击 Google Play\
  \ 控制台中的`Upload Public Key Certificate`（上传公钥证书）按钮 (C) 并上传 PEM 证书文件。\n\n最后，点击`Enroll`按钮\
  \ (D) 将应用加入 Google Play 签名。一旦应用加入，每在 Android Studio 中生成签名的应用 bundle 文件时，都必须使用新的上传密钥库文件。\n\
  \n可以通过将 bundle 文件加载到 Android Studio 的 `APK Analyzer` 工具中随时查看 bundle 文件的内容。\n\n###\
  \ 94. Android 动态特性模块概述\n\n如前章所述，应用包（App Bundles）和动态交付（Dynamic Delivery）的引入显著减少了用户在\
  \ Android 设备上安装应用时需要下载的应用包文件的大小。虽然最初的意图是为每种可能的设备配置自动生成独立的包文件，但动态交付的另一个关键优势是能够将应用拆分为多个可以按需安装的动态特性模块。\n\
  \n在本章中，我们将开始探索动态特性模块的基本概念，为在下一章进行详细的实践示例做准备。\n\n### 94.1 动态特性模块概述\n\n动态交付的主要目标是缩短从应用商店安装应用所需的时间和带宽，同时确保应用在安装后仅占用最少的存储空间。\n\
  \n动态特性模块（也称为按需模块）允许将组成 Android 应用的不同功能打包到独立的模块中，只有在用户需要时，这些模块才会被下载并安装到设备上。例如，一个应用可能包含新闻和讨论功能。在这种情况下，应用可能默认只安装新闻功能，并将讨论功能拆分为动态特性模块。当用户尝试访问讨论功能时，应用将从\
  \ Google Play 商店下载该特性模块并启动它。如果用户从未访问该功能，该模块将永远不会被安装，从而确保应用仅使用绝对最少的存储空间。\n\n使用动态特性模块的应用可以完全控制模块的安装方式和时间。事实上，应用还可以监控用户访问特定功能的频率，并临时移除任何不经常使用的模块。\n\
  \n动态特性还可能被标记为“即时”（instant）模块。这取代了早期 Android 版本中的“即时应用”（Instant App）概念，允许在不安装应用的情况下在设备上运行动态特性模块。这使得应用可以在\
  \ Google Play 商店中显示一个“立即尝试”按钮，或者通过点击网络 URL 在设备上立即启动。\n\n### 94.2 动态特性模块架构\n\nAndroid\
  \ 从设计之初就考虑了模块化，特别是在 `Intents` 和 `Activities` 概念方面。动态特性将这种哲学推向了逻辑终，允许应用在用户需要的时候只安装用户需要的内容。鉴于这种能力的灵活性和强大，动态特性模块的实现相对简单。\n\
  \n简单来说，动态特性模块是使用拆分 APK 文件构建的，这些文件允许多个 APK 文件组合成一个单一应用。\n\n正如我们在创建、测试和上传 Android\
  \ 应用包中所学习的，动态交付和应用包通过生成自定义 APK 文件来工作，该文件包含在特定设备上运行应用所需的字节码和资源。在这种情况下，应用仍然通过单个 APK\
  \ 文件安装，尽管它是为用户定制的。\n\n相比之下，动态特性模块通过将应用拆分为多个称为拆分 APK 的来工作。\n\n当应用使用拆分 APK 文件时，在首次下载应用时仅安装基础模块（base\
  \ module）。基础模块通过可启动的 Activity 作为应用的入口，并包含应用基础功能的字节码和资源，以及应用其他部分所需的配置和构建资源。例如，基础模块清单文件包含了与应用打包的所有动态特性模块清单文件的合并。此外，所有动态特性模块的版本号由基础模块构建文件中的版本代码设置决定。\n\
  \n基础模块还包含了应用包中动态特性模块的列表，且所有动态特性模块必须在它们的构建中列出基础模块作为依赖。\n\n每个动态特性都以模块的形式存在，包含字节码、清单、资源和构建配置，以及该特定功能的任何其他资产（如图像或数据文件）。\n\
  \n\n\n\n当用户请求从应用商店安装应用时，商店将为该模块生成一个 `Base APK` 文件，该文件包含了所有设备配置通用的字节码和资源，此外还会生成一组专门针对用户设备配置的\
  \ `Configuration APK` 文件。同样，安装动态功能模块的请求除了会生成相应的 `Configuration APK` 文件外，还会生成一个 `Dynamic\
  \ Feature APK` 文件，如下方的图 94-1 所示：\n\n![](img/android_dynamic_feature_diagram.png)\n\
  \n图 94-1\n\n### 94.3 创建动态功能模块\n\n可以通过添加全新的模块或迁移现有模块来向项目中添加动态功能。如需添加新模块，只需选择 Android\
  \ Studio 的 `File` -> `New` -> `New Module...` 菜单选项。在弹出的对话框中，根据你正在创建的动态功能类型，选择 `Dynamic\
  \ Feature Module` 或 `Instant Dynamic Feature Module` 模板：\n\n![](img/as_3.4_add_new_dynamic_feature.png)\n\
  \n图 94-2\n\n选择合适的动态功能选项后，点击 `Next` 按钮，并在配置界面中命名模块并更改最小 API 设置，使其与基础模块选择的 API 级别相匹配（如果这些版本不匹配，项目将构建失败）。\n\
  \n再次点击 `Next` 按钮以配置 `On-Demand`（按需）选项：\n\n![](img/as_3.5_dynamic_feature_download_options.png)\n\
  \n图 94-3\n\n当启用 `Fusing` 选项时，在运行旧版本 Android（`Android 4.4 API 20` 或更早）且动态交付引入之前的设备上，模块将与\
  \ `base APK` 一起下载。`Module Title` 字符串长度可达 50 个字符，Google Play 在消息和通知中向用户描述该功能时将使用。\n\
  \n`Install-time`（安装时）包含菜单提供了选项，用于控制模块按需安装的条件，而不是包含在用户设备上应用的初始安装中。该菜单提供以下选项：\n\n\
  - **不要在安装时包含模块（仅按需）**：无论设备配置如何或用户国家为何，在应用请求之前，不会安装该模块。\n- **在安装时包含模块**：禁用所有设备和用户国家的按需动态安装。模块将在应用安装到设备时同时进行安装。\n\
  - **仅对具有特定功能的设备在安装时包含模块**：对于符合指定标准的设备配置和用户国家，将在安装时包含该模块。所有其他国家和设备配置将使用动态按需安装。选择此选项时，将出现额外选项允许输入设备功能。例如在图\
  \ 94-4 中，模块将在具有麦克风和指纹识别器的设备上于安装时包含。在所有其他设备上，该模块将根据需要动态动态安装：\n\n![](img/as_3.5_dynamic_feature_device_features.png)\n\
  \n图 94-4\n\n其他标准（如国家和 API 级别）必须在项目清单（`AndroidManifest.xml`）文件中声明。例如，以下条目将禁用法国用户以及运行\
  \ Android 版本低于 API 21 的设备的动态按需功能安装：\n\n```xml\n<dist:conditions>\n  <dist:user-countries\
  \ dist:exclude=\"true\">\n      <dist:country dist:code=\"FR\"/>\n  </dist:user-countries>\n\
  \  <dist:min-sdk dist:value=\"21\"/>\n</dist:conditions>\n```\n\n### 94.4 将现有模块转换为动态交付\n\
  \n如果应用包含一个非常适合动态交付的现有功能，可以通过几个基本步骤将其转换为动态功能。例如，考虑以下项目结构：\n\n![](img/andorid_dynamic_feature_convert_tree.png)\n\
  \n图 94-5\n\n在此项目中，`app` 模块将作为基础模块，而 `secondfeature` 模块是转换为动态功能模块的理想候选者。\n\n要将你的应用中的现有模块转换为动态功能模块，首先编辑模块层级的\
  \ `build.gradle` 文件（在上述示例中为 `Gradle Scripts` -> `build.gradle (Module: secondfeature)`），并修改为使用\
  \ `com.android.dynamic-feature` 代替 `com.android.application` 插件，并更改依赖关系使模块仅依赖于基础（`app`）模块。例如：\n\
  \n```gradle\napply plugin: 'com.android.application'\napply plugin: 'com.android.dynamic-feature'\n\
  \n...\n\ndependencies {\n    implementation fileTree(dir: 'libs', include: ['*.jar'])\n\
  \    api 'androidx.appcompat:appcompat:1.0.2'\n    api 'androidx.constraintlayout:constraintlayout:1.1.3'\n\
  \    testImplementation 'junit:junit:4.12'\n    androidTestImplementation 'androidx.test.ext:junit:1.1.1'\n\
  \    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'\n  \
  \  implementation project(':app')\n}\n```\n\n接下来，编辑模块的 `AndroidManifest.xml` 文件并进行如下修改（注意在此示例中，这是一个按需模块）：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\
  \n    package=\"frenzy.mymodule\">\n    <dist:module instant=\"false\"\n       \
  \ onDemand=\"true\"\n        dist:title=\"@string/dynamic_feature\">\n        <dist:fusing\
  \ include=\"true\" />\n    </dist:module>\n</manifest>\n```\n\n注意 `title` 属性引用了一个字符串资源，该资源需要在\
  \ `strings.xml` 文件中声明。接下来，基础模块的 `build.gradle` 文件（`build.gradle (Module: app)`）需要修改以引用该动态功能并添加库依赖：\n\
  \n```gradle\napply plugin: 'com.android.application'\n\nandroid {\n    compileSdkVersion\
  \ 29\n\n    dynamicFeatures = [\":secondfeature\"]\n}\n\ndependencies {\n    api\
  \ 'com.google.android.play:core:1.5.0'\n}\n```\n\n最后，编辑基础模块的 `AndroidManifest.xml`\
  \ 文件，将模块声明派自 `SplitCompat`：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"frenzy.mydemoapp\">\n    <application\n        android:name=\"com.google.android.play.core.splitcompat.SplitCompat\"\
  \n        android:allowBackup=\"true\">\n</application>\n</manifest>\n```\n\n###\
  \ 94.5 使用动态功能模块\n\n一旦应用项目添加了一个或多个动态功能模块，就需要编写代码来安装和管理这些模块。这涉及执行诸如检查模块是否已安装、安装模块、跟踪安装进度以及删除不再需要的已安装模块。所有这些任务都使用\
  \ Play Core 提供的 API 完成，大多数 API 调用涉及 `SplitInstallManager` 实例，可以通过以下方式创建：\n\n```\n\
  private lateinit var manager: SplitInstallManager\nmanager = SplitInstallManagerFactory.create(this)\n\
  ```\n\n通常，在允许用户启动动态功能之前的第一步是检查相应的模块是否已经安装。例如，以下代码获取已安装模块列表并检查特定模块是否安装：\n\n```\n\
  if (manager.installedModules.contains(\"my_dynamic_feature\")) {\n    // 模块已安装\n\
  }\n```\n\n通过构建 `SplitInstallRequest` 对象并将其传递 `SplitInstallManager` 实例的 `startInstall()`\
  \ 方法，可以安装一个或多个模块。\n\n\n\n\n\n```kotlin\nprivate var mySessionId = 0\n\nval request\
  \ = SplitInstallRequest.newBuilder()\n    .addModule(\"my_dynamic_feature\")\n \
  \   .build()\nmanager.startInstall(request)\n    .addOnSuccessListener { sessionId\
  \ ->\n        mySessionId = sessionId\n    }\n    .addOnFailureListener { exception\
  \ ->\n    }\n```\n\n当执行上述代码时，模块安装将立即开始。或者，也可以通过向 `deferredInstall()` 方法传递特性模块名称数组来执行延迟安装，如下：\n\
  \n```kotlin\nmanager.deferredInstall(Arrays.asList(\"my_dynamic_feature\", \"my_dynamic_feature2\"\
  ))\n```\n\n延迟下载将由操作系统根据情况在后台进行。\n\n虽然无法跟踪延迟安装的状态，但可以通过向连接器添加监听器来跟踪非延迟安装的状态：\n\n\
  ```kotlin\nprivate var listener: SplitInstallStateUpdatedListener =\n    SplitInstallStateUpdatedListener\
  \ { state ->\n        if (state.sessionId() == mySessionId) {\n            when\
  \ (state.status()) {\n                SplitInstallSessionStatus.DOWNLOADING ->\n\
  \                    // 模块正在下载\n                SplitInstallSessionStatus.INSTALLING\
  \ ->\n                    // 已下载的模块正在安装\n                SplitInstallSessionStatus.DOWNLOADED\
  \ ->\n                    // 模块下载已完成\n                SplitInstallSessionStatus.INSTALLED\
  \ ->\n                    // 模块已成功安装\n                SplitInstallSessionStatus.CANCELED\
  \ ->\n                    // 用户取消了下载\n                SplitInstallSessionStatus.PENDING\
  \ ->\n                    // 安装已延迟\n                SplitInstallSessionStatus.FAILED\
  \ ->\n                    // 安装失败\n            }\n        }\n    }\n```\n\n一旦实现了监听器，则需要将其向\
  \ `SplitInstallManager` 实例进行注册，并在不再需要时取消注册。\n\n```kotlin\nmanager.registerListener(listener)\n\
  manager.unregisterListener(listener)\n```\n\n# 94.6 处理大型动态特性模块\n\nAndroid 动态交付系统不允许在未向用户请求权限的情况下下载大于\
  \ 10MB 的动态特性模块。当请求下载大型特性模块时，监听器会被调用并传递 `REQUIRES_USER_CONFIRMATION` 状态。此时，由应用负责显示确认对话框，并可选地实现\
  \ `onActivityResult()` 方法来识别用户是批准还是拒绝了下载。\n\n```kotlin\nprivate val REQUESTCODE\
  \ = 101\n\nprivate var listener: SplitInstallStateUpdatedListener =\n    SplitInstallStateUpdatedListener\
  \ { state ->\n        if (state.sessionId() == mySessionId) {\n            when\
  \ (state.status()) {\n                SplitInstallSessionStatus.REQUIRES_USER_CONFIRMATION\
  \ -> {\n                    try {\n                        manager.startConfirmationDialog(\n\
  \                            state,\n                            this@MainActivity,\n\
  \                            REQUESTCODE\n                        )\n          \
  \          } catch (ex: IntentSender.SendIntentException) {\n                  \
  \      // 请求失败\n                    }\n                }\n            }\n      \
  \  }\n    }\n```\n\n上述代码启动了一个意，该意随后显示内置的确认对话框。该意将向 `onActivityResult()` 方法返回结果码，该方法可以实现如下：\n\
  \n```java\npublic override fun onActivityResult(requestCode: Int, resultCode: Int,\
  \ data: Intent?) {\n    if (requestCode == REQUESTCODE) {\n        if (resultCode\
  \ == Activity.RESULT_OK) {\n            // 用户批准安装\n        } else {\n          \
  \  // 用户拒绝安装\n        }\n    }\n}\n```\n\n如果用户批准了请求，动态特性模块将自动下载并安装。\n\n# 94.7 总结\n\
  \n动态特性模块允许将 Android 应用拆分为独立的特性，这些特性在用户需要时按需下载。动态特性模块还可以被配置为即时特性（instant features）。即时特性可以在不向设备上安装应用的情况下运行，用户可以通过应用商店页面上的“立即尝试”按钮或通过\
  \ Web URL 访问。\n\n动态特性的实现涉及将应用拆分为一个基础模块和一个或多个动态特性模块。可以在 Android Studio 中创建新的动态特性模块，并通过少量项目配置更改将现有模块转换为动态特性模块。\n\
  \n一旦将动态特性模块添加到应用中，这些模块的下载和管理将由应用通过 Play Core Library 中的 `SplitInstall` 类来处理。\n\n\
  # 95. Android Studio 动态特性教程\n\n在上一章中涵盖了 Android 动态交付和动态特性的基本概念后，本章将以示例项目的形式将这些理论付诸实践。在本章中创建的应用将包含两个\
  \ Activity，第一个将作为应用的基模块，而第二个将指定为从运行中的应用内部按需下载的动态特性。本教程将包括在 Android Studio 内部创建动态模块的步骤、将应用包上传到\
  \ Google Play 商店进行测试，以及使用 Play Core Library 下载和管理动态特性。本章还将探索延迟动态特性安装的使用。\n\n## 95.1\
  \ 创建 DynamicFeature 项目\n\n从欢迎界面选择“Start a new Android Studio project”（启动一个新的 Android\
  \ Studio 项目）快速启动选项，在生成的新项目对话框中，点击 Next（下一步）按钮之前选择“Empty Activity”模板。\n\n在 Name 字段中输入\
  \ `DynamicFeature`，并指定在 Google Play 生态系统中唯一标识您的应用的包名（例如 `com.<your company>.dynamicfeature`）。在点击\
  \ Finish（完成）按钮之前，将 Minimum API level（最低 API 级别）设置为 API 26: Android 8.0 (Oreo)，并将\
  \ Language（语言）菜单设置为 Kotlin。\n\n## 95.2 为项目添加动态支持\n\n在实现应用之前，需要对项目进行两项更改以支持动态特性。由于项目将大量使用\
  \ Play Core Library，因此需要在构建配置中添加指令以包含该库。在 Android Studio 中，打开应用层级的 `build.gradle`\
  \ 文件（Gradle Scripts -> `build.gradle (Module: app)`），找到 `dependencies` 部分并如下添加 Play\
  \ Core Library（请记住，一如既往，可能有更高版本可用）：\n\n```gradle\ndependencies {\n    implementation\
  \ 'com.google.android.play:core:1.6.5'\n}\n```\n\n一旦动态特性模块被下载，用户很可能需要立即访问组成特性的代码和资源资产。然而，在重启应用之前，新安装的特性模块对应用的其他部分无效。幸运的是，通过在项目中启用\
  \ `SplitCompat` 库可以避免这一缺陷。实现这一点简单的方法是在主 `AndroidManifest.xml` 文件（也称为基模块清单）中将应用程序声明为\
  \ `SplitCompatApplication` 的子类，如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.dynamicfeature\">\n\n<application\n    android:name=\"\
  com.google.android.play.core.splitcompat.SplitCompatApplication\"\n    android:allowBackup=\"\
  true\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
  >\n\n```\n\n\n\n\n\nandroid:roundIcon=\"@mipmap/ic_launcher_round\"\n\n# 95.3 设计基础\
  \ Activity 用户界面\n\n此时，项目包含一个 activity，它将作为应用基础模块的入口点。该基础模块将负责请求、安装和管理动态功能模块（dynamic\
  \ feature module）。\n\n为了演示动态功能的使用，基础 activity 由一系列按钮组成，这些按钮允许安装、启动和移除动态功能模块。用户界面还将包含一个\
  \ `TextView` 对象，用于显示与动态功能模块相关的状态信息。根据这些要求，将 `activity_main.xml` 布局文件加载到布局编辑器中，删除默认的\
  \ `TextView` 对象，并实现设计使其类似于下方的图 95-1。\n\n![](img/as_3.5_dynamic_feature_ui.png)\n\
  图 95-1\n\n一旦定位了这些对象，选择 `TextView` 小部件并使用属性（Attributes）工具窗口将 `id` 属性设置为 `status_text`。通过选择布局中的所有对象，开始应用布局约束：右键点击\
  \ `TextView` 对象并从菜单中选择 `Center -> Horizontally in Parent` 选项，从而将四个对象约束在屏幕的水平中心。\n\
  \n在所有对象仍被选的情况下，再次右键点击 `TextView`，这次选择 `Chains -> Create Vertical Chain` 菜单选项。在继续之前，将所有按钮文本字符串提取到资源，并配置三个按钮分别调用名为\
  \ `launchFeature`、`installFeature` 和 `deleteFeature` 的方法。\n\n# 95.4 添加动态功能模块\n\n\
  要向项目添加动态功能模块，选择 `File -> New -> New Module...` 菜单选项，并在生成的对话框中，如图 95-2 所示选择 Dynamic\
  \ Feature Module 选项：\n\n![](img/as_3.4_add_new_dynamic_feature1.png)\n图 95-2\n\n\
  选择 Dynamic Feature Module 后，点击 `Next` 按钮，并在配置屏幕上将模块命名为 `my_dynamic_feature`，并将最小\
  \ API 设置更改为 API 26：Android 8.0 (Oreo)，以便与为基础模块选择的 API 级别匹配：\n\n![](img/as_3.4_configure_dynamic_feature.png)\n\
  图 95-3\n\n再次点击 `Next` 按钮配置按需（On-Demand）选项，确保启用了 `Fusing` 选项。在 Module Title 字段中，输入文本“My\
  \ Example Dynamic Feature”：\n\n![](img/as_3.5_dynamic_feature_download_options2.png)\n\
  图 95-4\n\n为了本示例，在点击 `Finish` 按钮提交更改之前，将安装包含菜单设置为 `Do not include module at install\
  \ time (on-demand only)`，然后将动态功能模块添加到项目项目中。\n\n# 95.5 审查动态功能模块\n\n在进行下一步之前，值得花些时间查看\
  \ Android Studio 对项目所做的更改。理解这些更改在解决问题以及将现有应用功能转换为动态功能时都很有用。\n\n首先参考 `Project` 工具窗口，那里将出现一个新条目，代表包含新动态功能模块的文件夹：\n\
  \n![](img/as_3.5_dynamic_feature_in_project_window.png)\n图 95-5\n\n注意，该功能拥有自己的子结构，包括一个清单文件（manifest）、一个可以添加代码和资源的包以及一个\
  \ `res` 文件夹。打开并审查 `AndroidManifest.xml` 文件，它应该包含在功能创建过程中选选的属性设置，包括按需、融合（fusing）和功能标题值：\n\
  \n```xml\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\n    package=\"\
  com.ebookfrenzy.my_dynamic_feature\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:title=\"@string/title_my_dynamic_feature\">\n        <dist:delivery>\n\
  \            <dist:on-demand />\n        </dist:delivery>\n        <dist:fusing\
  \ dist:include=\"true\" />\n    </dist:module>\n</manifest>\n```\n\n特别感兴趣的一点是，模块标题字符串被存储为字符串资源，而不是直接输入到清单文件中。这是标题字符串的前提，可以在基础模块的\
  \ `strings.xml` 文件（`app -> res -> values -> strings.xml`）中找到并在必要时修改该资源。\n\n动态功能模块的构建配置可以在\
  \ `Gradle Scripts -> build.gradle (Module: my_dynamic_feature)` 文件中找到，内容如下：\n\n\
  ```gradle\napply plugin: 'com.android.dynamic-feature'\n\nandroid {\n    compileSdkVersion\
  \ 29\n    defaultConfig {\n        minSdkVersion 26\n        targetSdkVersion 29\n\
  \        versionCode 1\n        versionName \"1.0\"\n    }\n}\ndependencies {\n\
  \    implementation fileTree(dir: 'libs', include: ['*.'])\n    implementation project(':app')\n\
  }\n```\n\n该文件中的关键条目是 `com.android.dynamic-feature` 插件的 `application`，它确保该模块被视为动态功能，以及最后的\
  \ `implementation` 行，指示该功能依赖于基础模块（`app`）。基础模块的 `build.gradle` 文件也包含该动态功能的项：\n\n\
  ```gradle\napply plugin: 'com.android.application'\n\nandroid {\n    compileSdkVersion\
  \ 29\n    defaultConfig {\n        applicationId \"com.ebookrenzy.dynamicfeature\"\
  \n        minSdkVersion 26\n        targetSdkVersion 29\n        versionCode 1\n\
  \        versionName \"1.0\"\n        testRunner \"androidx.test.runner.AndroidJUnit\"\
  \n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n\
  \        }\n    }\n    dynamicFeatures = [\":my_feature\"]\n}\ndependencies {\n\
  ```\n\n添加到项目的任何动态功能也需要在此引用，例如：`dynamicFeatures = [\":my_feature\", \":second_feature\"\
  , ...]`\n\n# 95.6 添加动态功能 Activity\n\n从上方图 95-5 所示的 `Project` 工具窗口可以发现，此时动态功能除了清单文件。下一步是向模块添加一个活动。在\
  \ `Project` 工具窗口中，右键点击 `my_dynamic_feature -> java` 下的包并选择 `New -> Activity -> Empty\
  \ Activity` 菜单选项。将活动命名为 `MyFeatureActivity`，并在点击 `Finish` 按钮之前启用 `Generate Layout\
  \ File` 选项，但禁用 `Launcher Activity` 选项。\n\n![](img/as_3.4_dynamic_feature_add_activity.png)\n\
  图 95-6\n\n一旦活动已添加到模块，编辑 `AndroidManifest.xml` 文件并进行修改以添加意图过滤器（intent filter），允许基础模块启动该活动（将\
  \ `<com.yourcompany>` 替换为为了让您的应用在 Google Play 上唯一而选择的包名）：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\n    package=\"\
  com.ebookfrenzy.my_dynamic_feature\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:title=\"@string/title_my_dynamic_feature\">\n        <dist:delivery>\n\
  \            <dist:on-demand />\n        </dist:delivery>\n        <dist:fusing\
  \ dist:include=\"true\" />\n    </dist:module>\n    <application>\n        <activity\
  \ android:name=\".MyFeatureActivity\">\n            <intent-filter>\n          \
  \      <action android:name=\"android.intent.action.VIEW\" />\n```\n\n\n\n\n```xml\n\
  \"<com.yourcompany>.my_dynamic_feature.MyFeatureActivity\" />\n<category android:name=\"\
  android.intent.category.DEFAULT\" />\n</intent-filter>\n</activity>\n</application>\n\
  </manifest>\n```\n\n将 `activity_my_feature.xml` 文件加载到布局编辑器工具中，并添加一个显示“My Dynamic\
  \ Feature Module”文本的 `TextView` 对象，即可完成该功能：\n\n![](img/as_3.4_dynamic_feature_activity_ui.png)\n\
  \n图 95-7\n\n### 实现 `launchFeature()` 方法\n\n在项目结构和用户界面设计完成后，现在是使用 Play Core Library\
  \ 开始处理动态功能模块了。第一步是实现 `launchFeature()` 方法，其目的是使用 intent 启动动态功能 activity。然而，尝试启动尚未安装的动态功能模块中的\
  \ activity 将导致应用崩溃。因此，`launchFeature()` 方法需要包含一些防御性代码以确保动态功能已经安装。为了实现这一点，我们需要创建一个\
  \ `SplitInstallManager` 类的实例，并调用该对象的 `getInstalledModules()` 方法来检查 `my_dynamic_feature`\
  \ 模块是否已经安装。如果已安装，则可以安全地启动模块中的 activity，否则则需要在状态 `TextView` 上向用户显示消息。在 `MainActivity.kt`\
  \ 文件中，对类进行以下更改：\n\n```kotlin\n.\n.\nimport android.view.View\nimport android.content.Intent\n\
  import kotlinx.android.synthetic.main.activity_main.*\n.\n.\nimport com.google.android.play.core.splitinstall.SplitInstallManager\n\
  import com.google.android.play.core.splitinstall.SplitInstallManagerFactory\n.\n\
  .\nclass MainActivity : AppCompatActivity() {\n    private lateinit var manager:\
  \ SplitInstallManager\n    override fun onCreate(savedInstanceState: Bundle?) {\n\
  \        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_main)\n\
  \        manager = SplitInstallManagerFactory.create(this)\n    }\n    fun launchFeature(view:\
  \ View) {\n        if (manager.installedModules.contains(\"my_dynamic_feature\"\
  )) {\n            startActivity(Intent(\n                \"com.ebookfrenzy.my_dynamic_feature.MyFeatureActivity\"\
  ))\n        } else {\n            status_text.text = \"Feature not yet installed\"\
  \n        }\n    }\n}\n.\n.\n```\n\n### 上传 App Bundle 进行测试\n\n项目现在已准备好进行第一阶段测试。这涉及生成一个发布版\
  \ app bundle 并将其上传到 Google Play Console。实现这些步骤的操作在标题为创建、测试和上传 Android App Bundle\
  \ 的章节中概述过，但可以总结如下：\n\n1. 登录 Google Play Console 并创建一个新应用。\n2. 按照步骤在标题、描述、分类和图像资源（示例图像资源可以在随书附带的示例代码下载的\
  \ `image_assets` 文件夹中找到）配置应用，并保存草稿设置。\n3. 使用 Android Studio 的 `Build -> Generate\
  \ Signed App Bundle / APK...` 菜单生成签名的发布版 app bundle。\n4. 在 Google Play Console 中，从左侧导航面板选择\
  \ `App Releases` 选项，在结果屏幕中找到 `Internal test track` 部分，并点击 `Manage` 按钮。\n5. 在内部测试界面上，点击\
  \ `Create Release` 按钮并点击 `Continue` 以接受让 Google 管理密钥签名任务的选项。将上方生成的 app bundle 文件拖放到“Android\
  \ App Bundles and APKs to add”框中并点击 `Save`。\n6. 完成最后的配置步骤，包括 `Content Rating` 和\
  \ `Pricing & Distribution` 屏幕。\n7. 在控制台中导航到 `App Releases` 页面，点击位于 `Internal Test\
  \ track section` 中的 `Manage` 按钮。\n8. 在 `Manage testers` 部分，添加将用于在一个或多个物理设备上测试应用的账户邮箱地址。\n\
  9. 返回内部测试界面并点击 `Edit Release` 按钮。滚动到页面底部并点击 `Review` 按钮。\n10. 在确认屏幕上，点击 `Start Rollout\
  \ to Internal Test` 按钮。应用将列为 `Pending publication`（等待发布）。一旦通过 Google 的批准（此过程可能需要几分钟到几小时不等），应用即可进行测试。\n\
  \n一旦发布用于测试并并通过审核，将向内部测试轨道上的所有用户发送通知，要求他们加入应用的测试轨道。或者，复制 `Manage testers` 屏幕上列出的\
  \ `Opt-in URL` 并发送给测试用户。一旦用户加入，将提供一个链接，在设备上打开该链接将启动 Play Store 应用并打开 DynamicFeature\
  \ 应用的下载页，如图 95-8 所示：\n\n![](img/as_3.6_install_dynamic_feature_app.png)\n\n图 95-8\n\
  \n点击按钮安装应用，然后打开它并点击 `Launch Feature` 按钮。动态功能尚未安装的情况应反映在状态文本中。\n\n### 实现 `installFeature()`\
  \ 方法\n\n`installFeature()` 方法将为 `my_dynamic_feature` 模块创建一个 `SplitInstallRequest`\
  \ 对象，然后使用 `SplitInstallManager` 实例启动安装。还将实现监听器以显示指示状态的 Toast 消息。在 `MainActivity.kt`\
  \ 文件中，如下所示添加 `installFeature()` 方法：\n\n```kotlin\n.\n.\nimport android.widget.Toast\n\
  import com.google.android.play.core.splitinstall.SplitInstallRequest\n.\n.\nfun\
  \ installFeature(view: View) {\n    val request = SplitInstallRequest.newBuilder()\n\
  \        .addModule(\"my_dynamic_feature\")\n        .build()\n    manager.startInstall(request)\n\
  \        .addOnSuccessListener { sessionId ->\n            Toast.makeText(this@MainActivity,\n\
  \                \"Module started\",\n                Toast.LENGTH_SHORT).show()\n\
  \        }\n        .addOnFailureListener { exception ->\n            Toast.makeText(this@MainActivity,\n\
  \                \"Module failed: $exception\",\n                Toast.LENGTH_SHORT).show()\n\
  \        }\n}\n```\n\n编辑 `Gradle Scripts -> build.gradle (Module: app)` 文件并增加 `versionCode`\
  \ 和 `versionName` 值，以便上传新版本的 app bundle 以进行测试：\n\n```kotlin\nandroid {\n.\n.\n \
  \   versionCode 2\n    versionName \"2.0\"\n}\n```\n\n重复此步骤，在 `Gradle Scripts ->\
  \ build.gradle (Module: my_dynamic_feature)` 文件中声明匹配的版本号。\n\n\n\n\n按照以下步骤上传新的应用包并将其发布到内部测试。在测试设备上，打开\
  \ `Google Play Store` 应用并确保 `Install`（安装）按钮已变为 `Update`（更新）按钮（如果没有变为，请关闭 `App Store`\
  \ 应用并在几分钟后重试），然后更新到新版本。更新完成后，运行应用，点击 `Install Feature` 并检查 `Toast` 消息以确保安装已启动。在下载功能时，屏幕顶部的状态栏应短暂出现一个下载图标。下载完成后，点击\
  \ `Launch Feature`按钮显示第二个活动。\n\n如果安装失败或应用崩溃，通常可以通过 `LogCat` 输出识别原因。要查看此输出内容，请将设备连接到开发计算机，打开终端或命令提示窗口并执行以下命令：\n\
  \n```bash\nadb logcat\n```\n\n此 `adb` 命令将实时显示 `LogCat` 输出，包括应用遇到问题或崩溃时生成的任何异常或诊断错误。\n\
  \n## 95.10 添加更新监听器\n\n为了更详细地跟踪动态功能模块的安装进度，可以在应用中添加 `SplitInstallStateUpdatedListener`\
  \ 实例。由于可能同时安装多个功能模块，因此需要添加一些代码来跟踪分配给安装过程会话 ID。首先添加一些导入，在 `MainActivity.kt` 文件中声明一个包含当前会话\
  \ ID 的变量，并修改 `installFeature()` 方法以便每次成功启动安装时存储会话 ID 并注册监听器：\n\n```kotlin\nimport\
  \ com.google.android.play.core.splitinstall.SplitInstallStateUpdatedListener\nimport\
  \ com.google.android.play.core.splitinstall.model.SplitInstallSessionStatus\nimport\
  \ java.util.*\n\nclass MainActivity : AppCompatActivity() {\n    private lateinit\
  \ var manager: SplitInstallManager\n    private var mySessionId = 0\n\n    fun installFeature(view:\
  \ View) {\n        manager.registerListener(listener)\n        val request = SplitInstallRequest.newBuilder()\n\
  \            .addModule(\"my_dynamic_feature\")\n            .build()\n        manager.startInstall(request)\n\
  \            .addOnSuccessListener { sessionId ->\n                mySessionId =\
  \ sessionId\n                Toast.makeText(this@MainActivity,\n               \
  \     \"Module installation started\",\n                    Toast.LENGTH_SHORT).show()\n\
  \            }\n            .addOnFailureListener { exception ->\n             \
  \   Toast.makeText(this@MainActivity,\n                    \"Module installation\
  \ failed: $exception\",\n                    Toast.LENGTH_SHORT).show()\n      \
  \      }\n    }\n}\n```\n\n接下来，实现监听器代码，如下如下：\n\n```kotlin\nprivate var listener:\
  \ SplitInstallStateUpdatedListener =\n    SplitInstallStateUpdatedListener { state\
  \ ->\n        if (state.sessionId() == mySessionId) {\n            when (state.status())\
  \ {\n                SplitInstallSessionStatus.DOWNLOADING -> {\n              \
  \      val size = state.totalBytesToDownload()\n                    val downloaded\
  \ = state.bytesDownloaded()\n                    status_text.text =\n          \
  \              String.format(Locale.getDefault(),\n                        \"%d\
  \ of %d downloaded.\", downloaded, size)\n                }\n                SplitInstallSessionStatus.INSTALLING\
  \ -> {\n                    status_text.text = \"Installing feature\"\n        \
  \        }\n                SplitInstallSessionStatus.DOWNLOADED -> {\n        \
  \            status_text.text = \"Download Complete\"\n                }\n     \
  \           SplitInstallSessionStatus.INSTALLED -> {\n                    status_text.text\
  \ = \"Installed - Feature is ready\"\n                }\n                SplitInstallSessionStatus.CANCELED\
  \ -> {\n                    status_text.text = \"Installation cancelled\"\n    \
  \            }\n                SplitInstallSessionStatus.PENDING -> {\n       \
  \             status_text.text = \"Installation pending\"\n                }\n \
  \               SplitInstallSessionStatus.FAILED -> {\n                    status_text.text\
  \ =\n                        String.format(Locale.getDefault(),\n              \
  \          \"Installation Failed. Error code: %s\", state.errorCode())\n       \
  \         }\n            }\n        }\n    }\n```\n\n该监听器捕获许多常见的安装状态并相应地更新状态文本，包括有关下载大小和到目前已下载字节总数的信息。在继续之前，添加\
  \ `onPause()` 和 `onResume()` 周期方法，以确保在应用非活动时注销监听器：\n\n```kotlin\noverride fun onResume()\
  \ {\n    manager.registerListener(listener)\n    super.onResume()\n}\n\noverride\
  \ fun onPause() {\n    manager.unregisterListener(listener)\n    super.onPause()\n\
  }\n```\n\n通过增加两个模块级 `build.gradle` 文件中的版本号信息、生成并上传新的发布应用包并发布测试，来测试监听器代码是否有效。如果设备上已经安装了动态功能模块，`Play\
  \ Core Library` 类将忽略再次下载该模块的尝试。因此，为了充分测试监听器，必须在安装更新的发布之前从 `Play Store` 应用中卸载应用。当然，移除应用后将不会有\
  \ `Update` 按钮告诉我们新版本已就绪。若要确定 `Play Store` 应用将安装哪个版本，向下滚动应用页面到 `Read More` 按钮，选择它并检查\
  \ `App Info` 部分的 `Version` 字段。\n\n\n\n\n\n在测试这些代码更改之前，动态功能模块的大小需要增加到 10MB 限制以上。为了实现这一点，我们将把一个大文件作为资源添加到项目。。首先，在\
  \ Project（项目）工具窗口中右键点击 `my_dynamic_feature` 入口点，并选择 `New -> Folder -> Assets Folder`\
  \ 菜单选项。在配置对话框中，点击 `Finish` 按钮之前，将 `Target Source Set` 菜单更改为 `main`。\n\n接下来，将以下资源文件下载到你开发系统上的临时位置：\n\
  \n[`www.ebookfrenzy.com/code/LargeAsset.zip`](https://www.ebookfrenzy.com/code/LargeAsset.zip)\n\
  \n下载完成后，在文件系统浏览器中找到该文件，将其复制并粘贴到 Android Studio Project 工具窗口中的 assets 文件夹中，并在确认对话框中点击\
  \ `OK`：\n\n![](img/as_3.4_add_new_dynamic_large_asset.png)\n\n图 95-11\n\n按照通常步骤增加版本号、构建新的应用包（app\
  \ bundle）、将其上传到 Google Play 并发布测试。从设备中删除之前的版本，安装新版本，并尝试执行功能下载，以测试确认对话框是否如下方图 95-12\
  \ 所示所示：\n\n![](img/as_3.6_install_dynamic_feature_large.png)\n\n图 95-12\n\n## 95.12\
  \ 使用延迟安装\n\n延迟安装（Deferred installation）会导致动态功能模块在后台下载，并将由操作系统的决定完成。当启动延迟安装时，监听器（listener）将以待处理（pending）状态被调用，但除了检查模块是否已安装外，没有其他方法可以跟踪安装进度。\n\
  \n要尝试延迟安装，请修改 `installFeature()` 方法使其读取内容如下：\n\n```kotlin\nfun installFeature(view:\
  \ View) {\n    manager.deferredInstall(Arrays.asList(\"my_dynamic_feature\"))\n\
  }\n```\n\n注意，`deferredInstall()` 方法传递了一个数组，允许对多个模块进行延迟安装。\n\n## 95.13 移除动态模块\n\n\
  该项目的最后一个任务是在 `MainActivity.kt` 文件中按如下实现 `deleteFeature()` 方法：\n\n```kotlin\nfun\
  \ deleteFeature(view: View) {\n    manager.deferredUninstall(Arrays.asList(\"my_dynamic_feature\"\
  ))\n}\n```\n\n该功能的移除将在操作系统需要额外存储空间时在后台执行。与 `deferredInstall()` 方法一样，可以在单次调用中调度多个功能的移除。\n\
  \n## 95.14 总结\n\n本章详细介绍了一个示例应用的创建，该应用旨在演示如何在 Android 应用中使用动态功能模块。涵盖的主题包括动态功能模块的创建，以及使用\
  \ Play Core Library 的类和方法来安装和管理动态功能模块。\n\n## 96 Android Studio 中的 Gradle 概述\n\n\
  直到此时，在大多数情况下，人们都认为 Android Studio 会采取必要的步骤来编译和运行已创建的应用项目。Android Studio 一直通过一个名为\
  \ `Gradle` 的系统在后台实现这一点。\n\n现在是时候查看如何使用 `Gradle` 来编译并打包应用项目的各种元素，并开始探索当在 Android\
  \ Studio 中构建项目有更高级的需求时，如何配置此系统。\n\n### 96.1 Gradle 概述\n\n`Gradle` 是一个自动化构建工具包，允许通过一组构建配置文件来配置和管理项目的构建方式。这包括定义如何构建项目、项目成功构建需要满足哪些依赖项，以及构建过程的最终结果（或结果）应该是什么。\n\
  \n`Gradle` 的优势在于它为开发者提供的灵活性。`Gradle` 系统是一个自包含的、基于命令行的环境，可以通过插件（plug-ins）集成到其他环境中。在\
  \ Android Studio 的情况下，`Gradle` 集成是通过命名恰当的 Android Studio 插件提供的。\n\n尽管 Android Studio\
  \ 插件允许在 Android Studio 内部启动和管理 `Gradle` 任务，但仍然可以使用 `Gradle` 命令行封装（wrapper）来构建基于\
  \ Android Studio 的项目，包括在未安装 Android Studio 的系统上。\n\n构建项目的配置规则声明在基于 `Groovy` 语言的\
  \ `Gradle` 构建文件和脚本中。\n\n### 96.2 Gradle 与 Android Studio\n\n`Gradle` 为构建 Android\
  \ 应用项目带来了许多强大功能。其中一些关键功能如下：\n\n#### 96.2.1 性默认值\n\n`Gradle` 实现了一种被称为“约定优于配置”（convention\
  \ over configuration）的概念。这简单意味着 `Gradle` 拥有一套预定义的合理默认配置设置，除非它们被构建文件中的设置所覆盖，否则将使用。这意味着可以使用开发者所需的最少配置执行构建。只有当默认配置不能满足你的构建需求时，才需要对构建文件进行更改。\n\
  \n#### 96.2.2 依赖\n\n`Gradle` 功能的另一个关键领域是依赖项（dependencies）。例如，考虑 Android Studio 项目中的一个模块，它触发意图（intent）来加载项目中的另一个模块。第一个模块实际上对第二个模块有依赖，因为如果在运行时无法找到并启动第二个模块，应用程序将无法构建。这种依赖关系可以在第一个模块的\
  \ `Gradle` 构建文件中声明，以便包含第二个模块，或者在第二个模块无法找到或构建时标记错误。其他依赖示例是项目编译和运行所需的库和 JAR 文件。\n\n\
  `Gradle` 依赖可以分为本地和远程。本地依赖引用执行构建的计算机系统文件系统上的项。远程依赖引用远程服务器（通常称为仓库）上的项。\n\nAndroid\
  \ 项目使用另一个名为 `Maven` 的项目管理工具处理远程依赖。如果在 `Gradle` 构建文件中使用 `Maven` 语法声明了远程依赖，则该依赖将从指定的仓库自动下载并包含在构建过程中。例如，以下依赖会导致从\
  \ Google 仓库向项目添加 `AppCompat` 库：\n\n```gradle\napi 'androidx.appcompat:appcompat:1.0.2'\n\
  ```\n\n#### 96.2.3 构建变体\n\n除了依赖之外，`Gradle` 还为 Android 项目提供了构建变体（build variants）支持。这允许从单个项目构建应用程序的多个变。Android\
  \ 运行在许多设备上，涵盖各种处理器类型和屏幕尺寸。为了针对尽可能广泛的设备类型和尺寸，通常需要构建应用程序的多个变体（例如，一个适用于手机界面，另一个适用于平板电脑屏幕）。通过使用\
  \ `Gradle`，这在 Android Studio 中是可行的。\n\n#### 96.2.4 清单项\n\n每个 Android Studio 项目都关联有一个\
  \ `AndroidManifest.xml` 文件，包含有关应用的配置信息。可以在 `Gradle` 构建文件中指定许多清单项，这些项在构建项目时将自动生成到清单文件中。这种能力与构建变体功能互补，允许为每个构建变体配置不同的应用版本号、`application\
  \ ID` 和 `SDK` 版本信息。\n\n#### 96.2.5 APK 签名\n\n\n\n\n\n标题为创建、测试和上传 Android App Bundle\
  \ 的章节涵盖了如何使用 Android Studio 环境创建签名的发布版 APK 文件。此外，也可以通过 Android Studio 用户界面输入的签名信息包含在\
  \ Gradle 构建文件中，以便能够从命令行生成已签名的 APK 文件。\n\n## 96.2.6 ProGuard 支持\n\nProGuard 是 Android\
  \ Studio 自带的一个工具，它用于对 Java 字节码进行优化、收缩和混淆，使其更高效且更难被反向工程（反向工程是指他人通过分析编译后的 Java 字节码来识别应用程序逻辑的方法）。Gradle\
  \ 构建文件提供了在构建应用程序时控制是否对该应用运行 ProGuard 的功能。\n\n## 96.3 顶层 Gradle 构建文件\n\n一个完整的 Android\
  \ Studio 项目包含了构建 Android 应用所需的所有内容，由模块、库、清单文件（manifest files）和 Gradle 构建文件组成。\n\n\
  每个项目都包含一个顶层 Gradle 构建文件。该文件列为 `build.gradle` (Project: `<project name>`)，可以在项目窗口中找到，如图\
  \ 96-1 所示：\n\n![](img/Image24276.png)\n\n图 96-1\n\n默认情况下，顶层 Gradle 构建文件的内容如下：\n\n\
  ```gradle\n// 顶层构建文件，您可以在此处添加所有子项目/模块通配置选项。\n\nbuildscript {\n    ext.kotlin_version\
  \ = '1.3.61'\n    repositories {\n        google()\n        jcenter()\n    }\n \
  \   dependencies {\n        classpath 'com.android.tools.build:gradle:3.6.0-rc03'\n\
  \        classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version\"\
  \n        // 注意：不要在此处放置应用程序依赖项；它们属于\n        // 各个模块的 build.gradle 文件\n    }\n}\n\
  \nallprojects {\n    repositories {\n        google()\n        jcenter()\n    }\n\
  }\n\ntask clean(type: Delete) {\n    delete rootProject.buildDir\n}\n```\n\n目前，该文件的作用仅仅声明使用\
  \ jcenter 仓库获取远程库，并声明构建依赖于 Gradle 的 Android 插件。在大多数情况下，没有必要对此构建文件进行任何更改。\n\n## 96.4\
  \ 模块级 Gradle 构建文件\n\nAndroid Studio 项目由一个或多个模块组成。例如，假设有一个名为 `GradleDemo` 的应用程序项目，它包含两个分别名为\
  \ `Module1` 和 `Module2` 的模块。在这种情况下，每个模块都需要自己的 Gradle 构建文件。从项目结构的角度来看，这些文件的位置如下：\n\
  \n* `Module1/build.gradle`\n* `Module2/build.gradle`\n\n默认情况下，`Module1` 的 `build.gradle`\
  \ 文件将类似于下面的列表：\n\n```gradle\napply plugin: 'com.android.application'\napply plugin:\
  \ 'kotlin-android'\napply plugin: 'kotlin-android-extensions'\n\nandroid {\n   \
  \ compileSdkVersion 29\n    buildToolsVersion \"29.0.3\"\n    defaultConfig {\n\
  \        applicationId \"com.ebookfrenzy.module1\"\n        minSdkVersion 26\n \
  \       targetSdkVersion 29\n        versionCode 1\n        versionName \"1.0\"\n\
  \        testInstrumentationRunner \"androidx.test.runner.AndroidJUnitRunner\"\n\
  \    }\n    buildTypes {\n        release {\n            minifyEnabled false\n \
  \           proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),\
  \ 'proguard-rules.pro'\n        }\n    }\n}\n\ndependencies {\n    implementation\
  \ fileTree(dir: 'libs', include: ['*.jar'])\n    implementation \"org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version\"\
  \n    api 'androidx.appcompat:appcompat:1.1.0'\n    api 'androidx.core:core-ktx:1.2.0'\n\
  \    api 'androidx.constraintlayout:constraintlayout:1.1.3'\n    testImplementation\
  \ 'junit:4.12'\n    androidTestImplementation 'androidx.test.ext:junit:1.1.1'\n\
  \    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'\n  \
  \  api \"org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version\"\n}\n```\n\n从文件中可以看出，构建文件开头声明了使用\
  \ Android 应用程序插件：`apply plugin: 'com.android.application'`。文件的 `android` 部分说明了在构建\
  \ `Module1` 时使用的 SDK 版本：`android { compileSdkVersion 29 }`。`defaultConfig` 部分声明的项定义了将生成到模块\
  \ `AndroidManifest.xml` 中的元素。这些设置可以在构建文件中修改，它们是在创建模块时从 Android Studio 中获取的：\n\n\
  ```gradle\ndefaultConfig {\n    applicationId \"com.ebookfrenzy.module1\"\n    minSdkVersion\
  \ 26\n    targetSdkVersion 29\n    versionCode 1\n    versionName \"1.0\"\n    testInstrumentationRunner\
  \ \"androidx.test.runner.AndroidJUnitRunner\"\n}\n```\n\n`buildTypes` 部分包含了关于在构建应用程序发布版版本时，是否以及如何在\
  \ APK 上运行 ProGuard 的指令：\n\n```gradle\nbuildTypes {\n    release {\n        minifyEnabled\
  \ false\n        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),\
  \ 'proguard-rules.pro'\n    }\n}\n```\n\n按照目前的配置，在构建 `Module1` 时不会运行 ProGuard。要启用\
  \ ProGuard，需要将 `minifyEnabled` 项从 `false` 改为 `true`。`proguard-rules.pro` 文件可以在项目目录中找到。\n\
  \n## 96.5 在构建文件中配置签名设置\n\n本书的创建、测试和上传 Android App Bundle 章节涵盖了使用 Android Studio\
  \ 用户界面设置密钥和生成签名发布版 APK 文件的步骤。这些设置也可以在 `build.gradle` 文件的 `signingSettings` 部分声明。例如：\n\
  \n```gradle\napply plugin: 'com.android.application'\n\nandroid {\n    compileSdkVersion\
  \ 28\n    defaultConfig {\n        //\n    }\n    signingConfigs {\n        release\
  \ {\n            storeFile file(\"keystore.release\")\n            storePassword\
  \ \"your keystore password here\"\n            keyAlias \"your key alias here\"\n\
  \            keyPassword \"your key password here\"\n        }\n    }\n    buildTypes\
  \ {\n        //\n    }\n}\n```\n\n上面的示例将密钥密码信息直接嵌入到构建文件中。这种方法的替代方案是从系统环境变量中提取这些值：\n\
  \n```gradle\nsigningConfigs {\n    release {\n        storeFile file(\"keystore.release\"\
  )\n        storePassword System.getenv(\"KEYSTOREPASSWD\")\n    }\n}\n```\n\n\n\n\
  \n\n```gradle\nkeyAlias \"your key alias here\"\n\nkeyPassword System.getenv(\"\
  KEYPASSWD\")\n\n}\n}\n```\n\n另一种方法是配置构建文件，让 Gradle 在构建过程中提示输入要输入的密码：\n\n```gradle\n\
  signingConfigs {\n    release {\n        storeFile file(\"keystore.release\")\n\
  \        storePassword System.console().readLine(\"\\nEnter Keystore password: \"\
  )\n        keyAlias \"your key alias here\"\n        keyPassword System.console().readLIne(\"\
  \\nEnter Key password: \")\n    }\n}\n```\n\n## 96.6 从命令行运行 Gradle 任务\n\n每个 Android\
  \ Studio 项目都包含一个 Gradle 包装器工具（Gradle wrapper），用于允许从命令行调用 Gradle 任务。该工具位于每个项目文件夹的根目录下。虽然此包装器在\
  \ Windows 系统上是可执行的，但在 Linux 和 macOS 上使用之前，需要启用执行权限。要启用执行权限，请打开终端窗口，切换目录到需要该包装器的项目文件夹，并执行以下命令：\n\
  \n```bash\nchmod +x gradlew\n```\n\n一旦文件具有执行权限，则需要将该文件的位置添加到您的 `$PATH` 环境变量中，或者在名称名前加上\
  \ `./` 才能运行。例如：\n\n```bash\n./gradlew tasks\n```\n\nGradle 将项目构建视为许多不同的任务。通过在项目目录中运行以下命令，可以获取当前项目可用任务的完整列表（如果\
  \ macOS macOS 或 Linux 上运行，请记住在命令前加上 `./`）：\n\n```bash\ngradlew tasks\n```\n\n要构建适用于设备或模拟器测试的项目调试发布版本（debug\
  \ release），请使用 `assembleDebug` 选项：\n\n```bash\ngradlew assembleDebug\n```\n\n或者，要构建应用程序的发布版本：\n\
  \n```bash\ngradlew assembleRelease\n```\n\n## 96.7 总结\n\n在大多数情况下，Android Studio\
  \ 在后台执行应用构建，无需开发人员的任何干预。此构建过程是使用 Gradle 系统处理的，它 是一套自动化构建工具包，旨在允许通过一组构建配置文件来配置和管理项目的构建方式。虽然\
  \ Gradle 的默认行为已足以满足许多基础项目构建的需求，但对于更复杂的项目来说，配置构建过程的需求是不可避免的。本章概述了 Android Studio\
