  \    myButton.setOnClickListener {\n        statusText.text = \"Button clicked\"\
  \n    }\n    myButton.setOnLongClickListener {\n        statusText.text = \"Long\
  \ button click\"\n        true\n    }\n}\n```\n\n显然，当检测到长按时，lambda 代码将在文本视图上显示“Long\
