  \ 测试应用程序\n\n在设备或模拟器上编译并运行应用，确保选择标签页会导致相应的 fragment 出现在屏幕的内容区域：\n\n![](img/Image2461.png)\n\
  图 54-6\n\n### 54.10 自定义 TabLayout\n\n此示例中的 `TabLayout` 是使用固定模式（fixed mode）配置的。这种模式适用于标签数量有限且标题较短的情况。如图\
  \ 54-7 所示，如果标签数量更多或标题较长，使用固定模式会很快出现问题：\n\n![](img/Image2472.png)\n图 54-7\n\n为了尝试将标签页放入可用宽度内，`TabLayout`\
  \ 使用了多行文本。尽管如此，第二行明显被截断了，导致无法看到完整标题。解决此问题的方案是将 `TabLayout` 切换到可滚动模式（scrollable mode）。在这种模式下，标题将以全长度单行格式显示，允许用户水平滑动以查看可用项目，如图\
  \ 54-8 所示：\n\n![](img/Image2480.png)\n图 54-8\n\n要将 `TabLayout` 切换到可滚动模式，只需将 `activity_main.xml`\
  \ 布局文件中的 `app:tabMode` 属性从 \"fixed\" 更改为 \"scrollable\" 即可：\n\n```xml\n<android.support.design.widget.TabLayout\n\
  \    android:id=\"@+id/tab_layout\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"wrap_content\"\n    app:tabMode=\"scrollable\"\n  \
  \  app:tabGravity=\"fill\"/>\n</android.support.design.widget.AppBarLayout>\n```\n\
  \n在固定模式下，可以通过 `app:tabGravity` 属性配置 `TabLayout` 以控制标签项占据屏幕的空间。例如，设置为 \"fill\"，项目将分布整个\
  \ `TabLayout` 的宽度，如图 54-9 所示：\n\n![](img/Image2481.png)\n图 54-9\n\n将属性值更改为 \"center\"\
  会导致项目相对于标签栏中心对齐：\n\n![](img/Image2492.png)\n图 54-10\n\n在进行本章最后一步之前，将 `activity_main.xml`\
  \ 文件中的 `tabMode` 和 `tabGravity` 属性还原为 \"fixed\" 和 \"fill\"。\n\n### 54.11 显示图标标签\n\
  \n本教程的最后一步是将基于文本的标签替换为图标。通过修改 `MainActivity.kt` 文件中的 `onCreate()` 方法为标签项分配内置的 drawable\
  \ 图标来实现这一点：\n\n```kotlin\nprivate fun configureTabLayout() {\n    tab_layout.addTab(tab_layout.newTab().setIcon(\n\
  \            android.R.drawable.ic_dialog_email))\n    tab_layout.addTab(tab_layout.newTab().setIcon(\n\
  \            android.R.drawable.ic_dialog_dialer))\n    tab_layout.addTab(tab_layout.newTab().setIcon(\n\
  \            android.R.drawable.ic_dialog_map))\n    tab_layout.addTab(tab_layout.newTab().setIcon(\n\
  \            android.R.drawable.ic_dialog_info))\n}\n```\n\n代码不再使用标签项的 `setText()`\
  \ 方法，而是调用 `setIcon()` 方法并传递 drawable 图标引用。编译并运行时，标签栏应如图 54-11 所示。注意如果使用 Instant\
  \ Run，则需要使用 Ctrl+Shift+R 触发热替换使更改生效：\n\n![](img/Image25051.png)\n图 54-11\n\n###\
  \ 54.12 总结\n\nTabLayout 是 Android Material 设计实现引入的组件之一。`TabLayout` 组件的目的是呈现一系列标签项，被选中后向用户显示不同的内容。标签项可以显示文本、图像或两者的结合。与\
  \ `ViewPager` 类和 fragment 结合时，可以轻松地创建标签布局，每个标签项的选择都会显示不同的 fragment。\n\n### 55. 使用\
  \ RecyclerView 和 CardView 小部件\n\n\n\n\nRecyclerView 和 CardView 控件共同工作，为用户提供可滚动的信息列表，其中信息以单个卡片的形式呈现。在本章中，在进行示例项目的设计和实现之前，将介绍这两个类的详细信息。\n\
  \n## 55.1 RecyclerView 概述\n\n与标题为 “使用悬浮操作按钮和 Snackbar  的章节中概述的 `ListView` 类类似，`RecyclerView`\
  \ 的目的是允许以可滚动列表的形式向用户展示信息。然而，`RecyclerView` 比 `ListView` 提供了许多优势。特别是 `RecyclerView`\
  \ 在管理构成列表的视图方面要高效得多，它本质上是在列表项滚动出屏幕时，复用构成列表项的现有视图，而不是创建新视图（因此名为“recycler”，回收器）。这既提高了性能，又减少了列表占用的资源，这一特性在向用户展示大量数据时特别有益。\n\
  \n与 `ListView` 不同，`RecyclerView` 还提供了三种内置布局管理器的选择，以控制列表项呈现给用户的方式：\n\n*   `LinearLayoutManager`\
  \ – 列表项以水平或垂直滚动列表的形式呈现。\n\n![](img/Image2427.png)\n图 55-1\n\n*   `GridLayoutManager`\
  \ – 列表项以网格格式呈现。当列表项大小一致时，使用此管理器效果最佳。\n\n![](img/Image2436.png)\n图 55-2\n\n*   `StaggeredGridLayoutManager`\
  \ - 列表项以交错网格格式呈现。当列表项大小不一致时，使用此管理器效果最佳。\n\n![](img/Image2443.png)\n图 55-3\n\n对于三种内置管理器都无法提供所需布局的情况，可以通过子类\
  \ `RecyclerView.LayoutManager` 类来实现自定义布局管理器。\n\n在 `RecyclerView` 中显示的每个列表项都是作为 `ViewHolder`\
  \ 类的实例创建的。`ViewHolder` 实例包含了 `RecyclerView` 显示列表项所需的所有内容，包括要显示的信息和用于显示项的视图布局。\n\n\
  与 `ListView` 一样，`RecyclerView` 依赖于适配器（adapter）作为 `RecyclerView` 实例与要显示给用户的数据之间中介。适配器被创建为\
  \ `RecyclerView.Adapter` 类的子类，并且至少要实现以下方法，这些方法将由分配给适配器的 `RecyclerView` 对象在不同点调用：\n\
  \n*   `getItemCount()` – 此方法必须返回列表中要显示的项数。\n*   `onCreateViewHolder()` – 此方法创建并返回一个\
  \ `ViewHolder` 对象，该对象用用于显示数据的视图进行初始化。此视图通常通过膨胀 XML 布局文件创建。\n*   `onBindViewHolder()`\
  \ – 此方法接收由 `onCreateViewHolder()` 方法创建的 `ViewHolder` 对象，以及一个指示即将显示的列表项的整数值。`ViewHolder`\
  \ 对象中包含了由 `onCreateViewHolder()` 方法分配的布局。`onBindViewHolder()` 方法的责任是将布局中的视图填充与指定项对应的文本和图形，并将该对象返回给\
  \ `RecyclerView`，随后由其展示给用户。\n\n在布局中添加 `RecyclerView` 只需要在它出现的活动（activity）的 XML 内容布局文件中添加相应的元素即可。例如：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\"\n    tools:context=\"\
  .MainActivity\"\n    tools:showIn=\"@layout/activity_card_demo\">\n    <androidx.recyclerview.widget.RecyclerView\n\
  \        android:id=\"@+id/recycler_view\"\n        android:layout_width=\"0dp\"\
  \n        android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\"\n        tools:listItem=\"\
  @layout/card_layout\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n在上面的示例中，`RecyclerView` 被嵌入到主活动布局文件的 `CoordinatorLayout` 中，连同 AppBar 和 Toolbar。这提供了一些额外功能，例如配置\
  \ Toolbar 和 AppBar 使其滚动出屏幕。\n\n## 55.2 CardView 概述\n\n`CardView` 是一种允许使用卡片分组分组呈现信息的用户界面。卡片通常使用\
  \ `RecyclerView` 实例以列表的形式呈现，并可以配置阴影效果和圆角。\n\n![](img/Image2427.png)\n图 55-4\n\n\
  使用 `CardView` 展示的用户界面定义在 XML 文件中，并在运行时加载到 `CardView` 中。`CardView` 可以包含任何复杂性的布局，使用如\
  \ `RelativeLayout` 等标准布局。以下 XML 布局表示一个 `RelativeLayout` 的卡片布局：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n   \
  \ xmlns:card_view=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:layout_margin=\"5dp\"\n    card_view:cardRadius=\"12dp\"\n    card_view:cardElevation=\"\
  3dp\"\n    card_view:contentPadding=\"4dp\">\n    <RelativeLayout\n        android:layout_width=\"\
  match_parent\"\n        android:layout_height=\"wrap_content\"\n        android:padding=\"\
  16dp\">\n        <ImageView\n            android:id=\"@+id/item_image\"\n      \
  \      android:layout_width=\"100dp\"\n            android:layout_height=\"100dp\"\
  \n            android:layout_alignParentLeft=\"true\"\n            android:layout_alignParentTop=\"\
  true\"\n            android:layout_marginRight=\"16dp\" />\n    </RelativeLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n当与 `RecyclerView` 创建创建可滚动卡片列表时，视图的\
  \ `onCreateViewHolder()` 方法会膨胀卡片的布局资源文件将其将其给 `ViewHolder` 实例并返回给 `RecyclerView`\
  \ 实例。\n\n## 55.3 总结\n\n本章介绍了 Android `RecyclerView` 和 `CardView` 组件。`RecyclerView`\
  \ 为 Android 应用内显示可滚动视图列表提供了一种资源高效的方法。`CardView` 在以卡片形式呈现分组数据（例如姓名和地址列表）时非常有用。正如之前概述的，并在下一章包含的教程所示的那样，`RecyclerView`\
  \ 和 `CardView` 结合使用时特别有用。\n\n\n\n\n\n# 56. Android RecyclerView 和 CardView 教程\n\n\
  在本章将创建一个示例项目，该项目将同时使用 `CardView` 和 `RecyclerView` 组件创建一个可滚动的卡片列表。完成后的应用将显示包含图像和文本的卡片列表。除了显示卡片列表外，项目还将实现为选择卡片时会向用户显示消息，指示用户点击了哪一个卡片。\n\
  \n## 56.1 创建 CardDemo 项目\n\n从欢迎界面选择 `Start a new Android Studio project` 快速选项，在弹出的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Basic Activity` 模板。\n\n在 `Name` 字段中输入 `CardDemo`，并将包名（package name）指定为\
  \ `com.ebookfrenzy.carddemo`。点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26:\
  \ Android 8.0 (Oreo)`，并将 `Language` 菜单改为 `Kotlin`。\n\n项目创建完成后，在 `Layout Editor`\
  \ 工具中加载 `content_main.xml` 文件，并选择并删除“Hello World” `TextView` 对象。\n\n## 56.2 修改 Basic\
  \ Activity 项目\n\n由于选择了 `Basic Activity`，布局包含一个此项目并不需要的悬浮按钮（floating action button）。在\
  \ `Layout Editor` 工具中加载 `activity_main.xml` 布局文件，选择悬浮按钮并按下删除键从布局中移除该对象。编辑 `MainActivity.kt`\
  \ 文件，如下所示从 `onCreate` 方法中移除悬浮按钮代码：\n\n```kotlin\noverride fun onCreate(savedInstanceState:\
  \ Bundle?) {\n    super.onCreate(savedInstanceState)\n    setContentView(R.layout.activity_card_demo)\n\
  \    setSupportActionBar(toolbar)\n    fab.setOnClickListener { view ->\n      \
  \  Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \            .setAction(\"Action\", null).show()\n    }\n}\n```\n\n项目不需要默认的导航功能，因此打开\
  \ `content_main.xml` 文件并从布局中删除 `NavHostFragment` 对象，只保留 `ConstraintLayout` 父布局。\n\
  \n## 56.3 设计 CardView 布局\n\n卡片内视图的布局将在单独 XML 布局文件中定义。在 `Project` 工具窗口中，右键点击 `app`\
  \ -> `res` -> `layout` 项并选择 `New` -> `Layout resource file` 菜单选项。在 `New Resource\
  \ Dialog` 中，在 `File name:` 字段输入 `card_layout`，并在点击 `OK` 按钮之前在根元素字段输入 `androidx.cardview.widget.CardView`。\n\
  \n在 `Layout Editor` 工具中加载 `card_layout.xml` 文件，切换到 `Code` 模式并修改布局如下：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#81C784\"\n  \
  \  app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\" >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"\
  @+id/relativeLayout\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:padding=\"16dp\">\n        <ImageView\n        \
  \    android:id=\"@+id/item_image\"\n            android:layout_width=\"100dp\"\n\
  \            android:layout_height=\"100dp\"\n            app:layout_constraintLeft_toLeftOf=\"\
  parent\"\n            android:layout_constraintStart_toStartOf=\"parent\"\n    \
  \        app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n   \
  \         android:id=\"@+id/item_title\"\n            android:layout_width=\"236dp\"\
  \n            android:layout_height=\"39dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:textSize=\"30sp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/item_image\"\n            app:layout_constraintStart_toEndOf=\"@+id/item_image\"\
  \n            app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n\
  \            android:id=\"@+id/item_detail\"\n            android:layout_width=\"\
  236dp\"\n            android:layout_height=\"16dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:layout_marginTop=\"8dp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/item_image\"\n            app:layout_constraintStart_toEndOf=\"@+id/item_image\"\
  \n            app:layout_constraintTop_toBottomOf=\"@+id/item_title\" />\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n## 56.4 添加 RecyclerView\n\n选择 `content_main.xml`\
  \ 布局文件，从调色板（palette）的 `Containers` 部分将 `RecyclerView` 对象拖到布局中，使其位于屏幕中心，以便自动调整以填充整个屏幕。使用\
  \ `Infer constraints` 按钮添加任何的约束。使用 `Attributes` 窗口将 `RecyclerView` 实例的 `ID` 更改为\
  \ `recyclerView`，并将 `layout_width` 和 `layout_height` 属性更改为 `match_parent`。\n\n##\
  \ 56.5 创建 RecyclerView Adapter\n\n如章所述，`RecyclerView` 需要一个适配器来处理列表项。通过右键点击 `Project`\
  \ 工具窗口中的 `app` -> `java` -> `com.ebookfrenzy.carddemo` 项并选择 `New` -> `Kotlin File/Class`\
  \ 选项来向项目添加此新类。在新对话框中，在 `Name` 字段输入 `RecyclerAdapter`，按下回车键创建 Kotlin 类文件。\n\n编辑新的\
  \ `RecyclerAdapter.kt` 文件，添加一些导入指令并声明该类现在继承 `RecyclerView.Adapter`。与其创建一个单独的类来提供显示的数据，不如向适配器添加基础数组作为应用数据：\n\
  \n```kotlin\npackage com.ebookfrenzy.carddemo\n\nimport android.view.LayoutInflater\n\
  import android.widget.ImageView\nimport android.widget.TextView\nimport android.view.View\n\
  import android.view.ViewGroup\nimport androidx.recyclerview.widget.RecyclerView\n\
  \nclass RecyclerAdapter : RecyclerView.Adapter<RecyclerAdapter.ViewHolder>() {\n\
  \    private val titles = arrayOf(\"Chapter One\",\n        \"Chapter Two\", \"\
  Chapter Three\", \"Chapter Four\",\n        \"Chapter Five\", \"Chapter Six\", \"\
  Chapter Seven\",\n        \"Chapter Eight\")\n    private val details = arrayOf(\"\
  Item one details\", \"Item two details\",\n        \"Item three details\", \"Item\
  \ four details\",\n        \"Item five details\", \"Item six details\",\n      \
  \  \"Item seven details\", \"Item eight details\")\n    private val images = intArrayOf(R.drawable.android_image_1,\n\
  \        R.drawable.android_image_2, R.drawable.android_image_3,\n        R.drawable.android_image_4,\
  \ R.drawable.android_image_5,\n        R.drawable.android_image_6, R.drawable.android_image_7,\n\
  \        R.drawable.android_image_8)\n}\n```\n\n在 `RecyclerAdapter` 类中，我们现在需要 `ViewHolder`\
  \ 类的自己的实现，以引用 `card_layout.xml` 文件中的视图元素。留在 `RecyclerAdapter.kt` 文件中，如下实现此类：\n\n\
  ```kotlin\nclass RecyclerAdapter : RecyclerView.Adapter<RecyclerAdapter.ViewHolder>()\
  \ {\n    inner class ViewHolder(itemView: View) : RecyclerView.ViewHolder(itemView)\
  \ {\n        var itemImage: ImageView\n        var itemTitle: TextView\n       \
  \ var itemDetail: TextView\n\n        init {\n            itemImage = itemView.findViewById(R.id.item_image)\n\
  \            itemTitle = itemView.findViewById(R.id.item_title)\n            itemDetail\
  \ = itemView.findViewById(R.id.item_detail)\n        }\n    }\n}\n```\n\n\n\n\n\n\
  `ViewHolder` 类包含一个 `ImageView` 和两个 `TextView` 变量，并有一个构造方法，该方法将这些变量初始化为指向 `card_layout.xml`\
  \ 文件中三个视图项的引用。\n\n下一个要添加到 `RecyclerAdapter.kt` 文件中的条项是 `onCreateViewHolder()` 方法的实现：\n\
  \n```kotlin\noverride fun onCreateViewHolder(viewGroup: ViewGroup, i: Int): ViewHolder\
  \ {\n    val v = LayoutInflater.from(viewGroup.context)\n        .inflate(R.layout.card_layout,\
  \ viewGroup, false)\n    return ViewHolder(v)\n}\n```\n\n该方法将由 `RecyclerView` 调用以获取一个\
  \ `ViewHolder` 对象。它会加载 `card_layout.xml` 视图层级文件，并创建一个 `ViewHolder` 类的实例，用视图层级对其进行初始化，然后将其返回给\
  \ `RecyclerView`。\n\n`onBindViewHolder()` 方法的目的是在 `ViewHolder` 对象中的视图层级中填充要显示的数据。它接收一个\
  \ `ViewHolder` 对象和一个表示要位置的列表项的整数值。现在应该添加该方法，并使用项目编号作为数据数组的索引。这些数据随后将使用 `ViewHolder`\
  \ 类构造方法中创建的引用显示在布局视图上：\n\n```kotlin\noverride fun onBindViewHolder(viewHolder: ViewHolder,\
  \ i: Int) {\n    viewHolder.itemTitle.text = titles[i]\n    viewHolder.itemDetail.text\
  \ = details[i]\n    viewHolder.itemImage.setImageResource(images[i])\n}\n```\n\n\
  适配器类的最后一个要求是实现 `getItem()` 方法，在这种情况下，它简单地返回 `titles` 数组中项的数量：\n\n```kotlin\noverride\
  \ fun getItemCount(): Int {\n    return titles.size\n}\n```\n\n## 56.6 添加图像文件\n\n\
  除了两个 `TextView` 之外，卡片布局还包含一个 `ImageView`，`Recycler` 适配器已配置为显示图像。在测试项目之前，必须添加这些图像。项目将使用的图像命名为\
  \ `android_image_<n>.jpg`，可以在以下 URL 下载的示例代码的 `project_icons` 文件夹中找到：\n\n[`www.ebookfrenzy.com/retail/as36kotlin/index.php`](https://www.ebookfrenzy.com/retail/as36kotlin/index.php)\n\
  \n在操作系统的文件导航器中找到这些图像，选择并复制这八张图像。在 Project 工具窗口中右键点击 app -> `res` -> `drawable` 条目，并选择\
  \ `Paste` 将文件添加到文件夹中：\n\n![](img/Image24257.png)\n\n图 56-1\n\n## 56.7 初始化 RecyclerView\
  \ 组件\n\n此时，项目由一个 `RecyclerView` 实例、一个用于 `CardView` 实例的 XML 布局文件以及一个 `RecyclerView`\
  \ 适配器组成。在测试目前进展之前的最后一步是使用布局管理器（layout manager）初始化 `RecyclerView`，创建适配器实例，并将该实例分配给\
  \ `RecyclerView` 对象。出于本示例的考虑，`RecyclerView` 将被配置为使用 `LinearLayoutManager` 布局选项项。编辑\
  \ `MainActivity.kt` 文件并修改 `onCreate()` 方法以实现此初始化代码：\n\n```kotlin\npackage com.ebookfrenzy.carddemo\n\
  \nimport android.os.Bundle\nimport com.google.android.material.snackbar.Snackbar\n\
  import androidx.appcompat.app.AppCompatActivity\nimport android.view.Menu\nimport\
  \ android.view.MenuItem\nimport androidx.recyclerview.widget.LinearLayoutManager\n\
  import androidx.recyclerview.widget.RecyclerView\nimport kotlinx.android.synthetic.main.content_main.*\n\
  import kotlinx.android.synthetic.main.activity_main.*\n\nclass MainActivity : AppCompatActivity()\
  \ {\n    private var layoutManager: RecyclerView.LayoutManager? = null\n    private\
  \ var adapter: RecyclerView.Adapter<RecyclerAdapter.ViewHolder>? = null\n\n    override\
  \ fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n\
  \        setContentView(R.layout.activity_card_demo)\n        setSupportActionBar(toolbar)\n\
  \        layoutManager = LinearLayoutManager(this)\n        recycler_view.layoutManager\
  \ = layoutManager\n        adapter = RecyclerAdapter()\n        recycler_view.adapter\
  \ = adapter\n    }\n}\n```\n\n## 56.8 测试应用程序\n\n在物理设备或模拟器会话上编译并运行应用，滚动列表中的不同的卡片项：\n\
  \n![](img/Image24343.png)\n\n图 56-2\n\n## 56.9 响应卡片选择\n\n该项目的最后阶段是使列表中的卡片变为可选的，这样点击卡片就会触发应用内的事件。在例例中，卡片将被配置为在用户点击时在显示器上显示消息。为了响应点击，需要修改\
  \ `ViewHolder` 类，以便在每个项视图上分配一个 `onClickListener`。编辑 `RecyclerAdapter.kt` 文件并修改 `ViewHolder`\
  \ 类，使其内容如下：\n\n```kotlin\ninner class ViewHolder(itemView: View) : RecyclerView.ViewHolder(itemView)\
  \ {\n    var itemImage: ImageView\n    var itemTitle: TextView\n    var itemDetail:\
  \ TextView\n\n    init {\n        itemImage = itemView.findViewById(R.id.itemImage)\n\
  \        itemTitle = itemView.findViewById(R.id.itemTitle)\n        itemDetail =\
  \ itemView.findViewById(R.id.itemDetail)\n        itemView.setOnClickListener {\
  \ v ->\n        }\n    }\n}\n```\n\n在 `onClick` 处理器的体内部，现在可以添加代码来显示卡片被点击的消息。由于点击产生的操作可能取决于哪一张卡片，因此识别所选的卡片是重要的。这些信息可以通过调用\
  \ `RecyclerView` 的 `getPosition()` 方法获取。在 `RecyclerAdapter.kt` 文件中，为 `onClick` 处理器添加代码，使其如下：\n\
  \n```kotlin\nimport com.google.android.material.snackbar.Snackbar\n\nitemView.setOnClickListener\
  \ { v ->\n    var position: Int = getPosition()\n    Snackbar.make(v, \"Click detected\
  \ on item $position\", Snackbar.LENGTH_LONG).setAction(\"Action\", null).show()\n\
  }\n```\n\n最后一个任务是启用项被点击时显示的材料设计波纹效果（ripple effect）。这只需在 `card_layout.xml` 文件中 `CardView`\
  \ 的声明中添加一些属性：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:card_view=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#81C784\"\n  \
  \  app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\"\n    android:foreground=\"?selectableItemBackground\"\n    android:clickable=\"\
  true\" >\n```\n\n## 56.10 总结\n\n本章讲解了结合 `CardView` 和 `RecyclerView` 组件以显示可滚动卡片列表的步骤。示例还涵盖了对列表项点击的检测，包括识别所选项以及在被点击的\
  \ `CardView` 实例上启用波纹视觉反馈。\n\n## 57. 布局编辑器示例数据教程\n\n在前章节中创建的 `CardDemo` 项目提供了一个很好的例子，说明在测试完成的应用之前，很难从布局编辑器准确评估用户界面的外观。当用户界面中显示的内容只有在用户安装并运行应用后才会生成或获取时，这是一个经常出现的问题。\n\
  \n\n\n\n\n长期以来，Android Studio 布局编辑器一直提供了指定简单属性的能力，这些属性仅在设计布局时有效。例如，可以将一个仅在设计时使用的字符串资源分配给布局编辑器中的\
  \ `TextView`，而该资源在应用运行时不会显示。随着 Android Studio 布局编辑器引入了示例数据支持，这一功能得到了显著扩展，并在本章将利用该功能来改进\
  \ `CardDemo` 项目中的布局编辑器体验。\n\n## 57.1 为项目添加示例数据\n\n在用户界面布局的设计阶段，`RecyclerView` 实例（#图\
  \ 57-1]）与上一章末尾测试的运行中的应用几乎没有相似之处：\n\n![](img/as_3.6_recyclerview_no_sample_data.png)\n\
  \n图 57-1\n\n在书中前面的“使用 Jetpack 构建现代 Android 应用架构”章节中，已经介绍了示例数据的概念。为了演示示例数据的使用，现在将修改项目，使得完全填充的卡片能够在布局编辑器中显示在\
  \ `RecyclerView` 内部。然而，在此之前，值得注意的是，布局编辑器有一组预配置的示例数据模板，可以在设计用户界面时使用。要查看这些模板的实际效果，将\
  \ `content_main.xml` 布局文件加载到布局编辑器并选择 `RecyclerView` 实例。右键点击 `RecyclerView` 并选择 `Set\
  \ Sample Data`（设置示例数据）菜单，显示设计时视图属性面板：\n\n![](img/as_3.2_design_time_attributes.png)\n\
  \n图 57-2\n\n将模板更改为 `Email Client` 选项并将项目计数更改为 12，注意 `RecyclerView` 变化为显示来自模板的数据：\n\
  \n![](img/as_3.6_recyclerview_sample_data_email.png)\n\n图 57-3\n\n这些模板对于在不进行任何额外工作的情况下显示示例数据非常有用，并且通常提供足够完成布局设计的内容。然而，在这个示例中，将使用示例数据来显示\
  \ `RecyclerView` 中的卡片，就像它们在运行应用中出现一样。在 `content_main.xml` 文件仍加载在布局编辑器的情况下，切换到 Code（代码）模式并找到\
  \ `RecyclerView` 元素，其内容应如下：\n\n```xml\n<androidx.recyclerview.widget.RecyclerView\n\
  \    android:id=\"@+id/recycler_view\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    tools:itemCount=\"12\"\n    tools:listitem=\"@layout/recycler_view_item\"\
  \ />\n```\n\n注意当前配置的两个特殊 `tools` 属性，它们用于列表中显示 12 个项目，每个项目都使用位于 `recycler_view_item.xml`\
  \ 文件中的布局。布局编辑器提供了可在可在布局文件中配置的一系列 `tools` 选项。虽然涵盖所有这些设置超出了本书的范围，但在以下 URL 可以找到每个设置的完整描述：\n\
  \nhttps://developer.android.com/studio/write/tool-attributes#toolssample_resources\n\
  \n上述的 `recycler_view_item.xml` 文件是布局编辑器在选择示例数据模板时自动生成的，可以在项目工具窗口中找到。\n\n切换回 Design（设计）模式，在选中\
  \ `RecyclerView`，使用设计时视图属性面板将模板切回默认设置。`recycler_view_item.xml` 文件将从项目中移除，同时 `content_main.xml`\
  \ XML 文件中的两个 `tools` 属性行也会被移除。\n\n要切换到使用卡片布局显示示例数据，添加 `listitem` 属性以引用 `card_layout.xml`\
  \ 文件。在布局中选中 `RecyclerView`，在 Attributes（属性）工具窗口搜索 `listitem` 属性，并在属性字段中输入 `@layout/card_layout`，如图\
  \ 57-4]所示：\n\n![](img/as_3.5_sample_Data_add_listitem.png)\n\n图 57-4\n\n切换回 Design（设计）模式，注意现在每个列表项都显示了卡片布局，尽管没有任何图像且使用的是示例文本数据：\n\
  \n![](img/as_3.6_recyclerview_sample_data_car_layout.png)\n\n图 57-5\n\n下一步是在卡片布局的视图中显示一些图像和不同的文本。这既可以是布局编辑器提供的模板示例数据形式，也可以是专门为此项目添加的自定义示例数据。将\
  \ `card_layout.xml` 文件加载到布局编辑器，选中 `ImageView` 并按本章早些时候概述显示设计时视图属性面板。从 `srcCompat`\
  \ 菜单选择内置的 `backgrounds/scenic` 图像集，如图 57-6]所示：\n\n![](img/as_3.6_recyclerview_sample_data_background.png)\n\
  \n图 57-6\n\n接下来，右键点击 `item_title` `TextView`，选择 `Sample Data`（示例数据）选项，并在设计时面板中选择\
  \ `cities` 文本。对 `item_detail` 视图重复此步骤，如图 57-7]所示选择 `full_names` 选项：\n\n![](img/as_3.6_recyclerview_sample_data_full_names.png)\n\
  \n图 57-7\n\n在 Design 模式下打开 `content_main.xml` 文件，注意 `RecyclerView` 现在使用了内置图像和示例数据：\n\
  \n![](img/as_3.6_recyclerview_sample_data_cities.png)\n\n图 57-8\n\n## 57.2 使用自定义示例数据\n\
  \n本章的最后一步是在布局中使用自定义示例数据和图像。这需要创建一个示例数据目录并添加文本和图像文件。在项目窗口中，右键点击 `app` 并选择 `New ->\
  \ Sample Data`（新建 -> 示例数据）选项，此时项目窗口中会出现一个名为 `sampledata` 的目录。\n\n右键点击 `sampledata`\
  \ 目录，创建一个名为 `images` 的子目录，并按照上一章概述的步骤复制 Android 图像。再次显示 `ImageView` 的时视图属性面板，这次点击\
  \ `Browse`（浏览）链接并在资源对话框中选择新添加的 Android 图像（如果文件夹未出现，请重新构建项目）：\n\n![](img/as_3.6_recyclerview_sample_data_custom_images.png)\n\
  \n图 57-9\n\n再次右键点击 `sampledata` 目录，选择 `New File`（新建文件）选项，文件命名为 `chapters` 并类型设置为\
  \ `Text`。文件创建后，输入以下内容：\n\nChapter One\nChapter Two\nChapter Three\nChapter Four\n\
  Chapter Five\nChapter Six\nChapter Seven\nChapter Eight\n\n接下来，创建一个名为 `items` 的第二个文本文件，内容如下：Item\
  \ one details\nItem two details\nItem three details\nItem four details\nItem five\
  \ details\nItem six details\nItem seven details\nItem eight details\n\n创建示例文本后，剩下的就是在\
  \ `card_layout.xml` 文件的视图元素中如下引用它们：\n\n```xml\n<TextView\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/item_title\"\
  \n    android:layout_toEndOf=\"@+id/item_image\"\n    android:layout_toRightOf=\"\
  @+id/item_image\"\n    android:layout_alignParentTop=\"true\"\n    android:textSize=\"\
  30sp\"\n    tools:text=\"@sample/chapters\" />\n\n<TextView\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/item_detail\"\
  \n    android:layout_toEndOf=\"@+id/item_image\"\n    android:layout_toRightOf=\"\
  @+id/item_image\"\n    android:layout_below=\"@+id/item_title\"\n    tools:text=\"\
  @sample/items\" />\n```\n\n\n\n\n\n返回 `content_main.xml` 文件中的布局设计，此时自定义的样本数据和图像应该显示在\
  \ `RecyclerView` 列表中：\n\n![](img/as_3.6_sample_data_running.png)\n\n图 57-10\n\n\
  与其使用两个独立的文本文件并对图像集的引用，另一种方案是在 JSON 文件中声明样本数据。例如：\n\n```json\n{\n  \"mydata\": [\n\
  \    {\n      \"chapter\" : \"Chapter One\",\n      \"details\": \"Item one details\"\
  ,\n      \"image\": \"@sample/images\"\n    },\n    {\n      \"chapter\" : \"Chapter\
  \ Two\",\n      \"details\": \"Item two details\",\n      \"image\": \"@sample/images\"\
  \n    }\n  ]\n}\n```\n\n假设上述内容包含在一个名为 `chapterdata.json` 的文件中，那么在视图 XML 元素中引用样本数据的方式如下：\n\
  \n```xml\n<ImageView\n    tools:src=\"@sample/chapterdata.json/mydata/image\" />\n\
  <TextView\n    tools:text=\"@sample/chapterdata.json/mydata/chapter\" />\n<TextView\n\
  \    tools:text=\"@sample/chapterdata.json/mydata/details\" />\n```\n\n## 57.3 总结\n\
  \n本章演示了如何在布局编辑器中使用样本数据，以更真实地呈现用户界面在运行时的外观。本教程涵盖的步骤包括使用预先存在的样本数据模板以及自定义样本数据的集成。\n\
  \n### 58. 使用 AppBar 和折叠工具栏布局\n\n在本章中，我们将探索如何自定义 Activity 布局中的应用栏（app bar），并使其能够对屏幕上其他视图中发生的滚动事件做出响应。通过结合使用\
  \ `CoordinatorLayout`、`AppBarLayout` 和 `CollapsingToolbarLayout` 容器，可以配置应用栏显示图像并使其在视图中淡入淡出动画效果。例如，列表的向上滚动动作可以配置为：让应用栏从视图中退回，并在执行向下滚动动作时重新出现。\n\
  \n本章将从构成应用栏的元素概览开始，然后介绍各种应用栏配置的示例。\n\n## 58.1 AppBar 的结构\n\n应用栏是应用运行时显示在屏幕顶部的区域，它可以配置为包含各种不同的项目，包括状态栏、工具栏（toolbar）、标签栏（tab\
  \ bar）和弹性空间区域。例如，图 58-10 显示了一个包含状态栏、工具栏和标签栏的应用栏：\n\n![](img/Image24271.png)\n\n\
  图 58-1\n\n弹性空间区域可以用空白背景颜色填充，或者如图 58-2 所示，显示在 `ImageView` 对象上的图像：\n\n![](img/Image24361.png)\n\
  \n图 58-2\n\n正如本章其余部分将演示的那样，如果 Activity 用户界面布局的主内容区域包含可滚动的内容，则应用栏的元素可以根据屏幕内容滚动的情况进行展开和收缩。\n\
  \n## 58.2 示例项目\n\n为了本示例，将对早期章节中创建的 `CardDemo` 项目进行修改，该项目标题为 Android RecyclerView\
  \ 和 CardView 教程。首先启动 Android Studio 并加载此项目。\n\n项目加载后，运行应用，并注意当向上滚动列表时，工具栏保持可见，如图\
  \ 58-3 所示：\n\n![](img/Image24431.png)\n\n图 58-3\n\n第一步是进行配置更改，使工具栏在向上滚动过程中收缩，并在向下滚动时展开。\n\
  \n#### 58.3 协调 RecyclerView 和 Toolbar\n\n将 `activity_main.xml` 文件加载到布局编辑器工具中，切换到代码模式并查看\
  \ XML 布局设计，其层级结构由图 58-4 中的图所示：\n\n![](img/as3.0_appbar_coordinatorlayout_tree.png)\n\
  \n图 58-4\n\n层级结构的顶层是 `CoordinatorLayout`，正如其名所示，它协调其包含的各种子视图元素之间的交互。例如在“使用浮动按钮和\
  \ Snackbar”中强调的那样，`CoordinatorLayout` 会自动向上滑动浮动按钮以容纳 `Snackbar` 的出现，然后在该条消失后将按钮移回。\n\
  \n`CoordinatorLayout` 同样可以用于根据视图层级中某些视图的滚动动作，使应用栏的元素滑入或滑出视图。图 58-4 所示的布局层级结构中的其中一个元素是\
  \ `ConstraintLayout`。要实现这一点，必须在发生滚动的元素以及与滚动发生交互的元素上都设置属性。在滚动元素（在本例中为 `RecyclerView`）上，必须将\
  \ `android:layout_behavior` 属性设置为 `appbar_scrolling_behavior`。在 `content_main.xml`\
  \ 文件中，找到顶层 `ConstraintLayout` 元素，并注意该属性已设置：\n\n```xml\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_behavior\"\n    tools:context=\"\
  .MainActivity\"\n    tools:showIn=\"@layout/demo\">\n```\n\n接下来，在布局编辑器中打开 `activity_main.xml`\
  \ 文件，切换到代码模式并找到 `AppBarLayout` 元素。注意 `AppBarLayout` 的唯一子是 `Toolbar`。为了让工具栏响应 `RecyclerView`\
  \ 中发生的滚动事件，必须在该元素上设置 `app:layout_scrollFlags` 属性。赋值给该属性的值取决于所需的交互，并由以下一个或多个组成：\n\
  \n- `scroll`: 表示视图将滚动出屏幕。如果不设置此项，视图在滚动期间将保持在屏幕顶部。\n- `enterAlways`: 与 `scroll` 结合使用时，向上滚动会导致视图退回。在此模式下，任何向下滚动动作都会导致视图重新出现。\n\
  - `enterAlwaysCollapsed`: 设置在视图上，在向下滚动达到列表限制之前，视图不会从折叠状态展开。如果设置了 `minHeight` 属性，视图将在初始滚动期间出现，但直到达到最小高度。随后它将保持在该高度，直到到达列表顶部才会完全展开。注意此选项仅在结合使用\
  \ `enterAlways` 和 `scroll` 选项时有效。例如：`app:layout_scrollFlags=\"scroll|enterAlways|enterAlwaysCollapsed\"\
  ` `android:minHeight=\"20dp\"`\n- `exitUntilCollapsed`: 设置后，视图在向上滚动期间将折叠，直到满足 `minHeight`\
  \ 阈值，此时在滚动方向改变之前它将保持在该高度。\n\n为了本示例，`scroll` 和 `enterAlways` 选项将如下设置在 `Toolbar` 上：\n\
  \n```xml\n<androidx.appcompat.widget.Toolbar\n    android:id=\"@+id/toolbar\"\n\
  \    android:layout_width=\"match_parent\"\n    android:layout_height=\"?attr/actionBarSize\"\
  \n    android:background=\"?attr/colorPrimary\"\n    app:popupTheme=\"@style/AppTheme.PopupOverlay\"\
  \n    app:layout_scrollFlags=\"scroll|enterAlways\" />\n```\n\n\n\n\n\n设置好相应的属性后，再次运行应用，并在\
  \ `RecyclerView` 列表中执行向上滚动。这应该导致工具栏折叠并移出视线（图 58-5）。向下滚动动作将使工具栏重新出现。\n\n![](img/Image24591.png)\n\
  图 58-5\n\n## 58.4 引入折叠工具栏布局\n\n`CollapsingToolbarLayout` 容器通过提供更广泛的选项以及对应用栏及其元素在响应协调滚动动作时的折叠进行更深层次的控制，增强了标准工具栏的功能。`CollapsingToolbarLayout`\
  \ 类旨在作为 `AppBarLayout` 的子元素添加，并提供诸如功能，例如随着工具栏的折叠和展开自动调整工具栏标题的字体大小。`parallax`（视差）模式允许应用栏中的指定内容在折叠时淡出视图，而\
  \ `pin`（固定）模式则允许应用栏的元素在收缩期间保持固定位置。\n\n此外还有 `scrim`（遮罩）选项用于指定工具栏在折叠序列期间过渡的颜色。\n\n\
  为了直观看到这些功能，将修改 `activity_main.xml` 文件中包含的应用栏，使其使用 `CollapsingToolbarLayout` 类，并添加一个\
  \ `ImageView` 以更好地演示 `parallax` 模式的效果。使用 `CollapsingToolbarLayout` 的新视图层级如图图 58-6\
  \ 所示：\n\n![](img/as3.0_appbar_collapsing_tree.png)\n图 58-6\n\n在 `Code` 模式下将布局编辑器工具加载\
  \ `activity_main.xml` 文件，并修改布局使其如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\">\n    <com.google.android.material.appbar.AppBarLayout\n       \
  \ android:layout_width=\"match_parent\"\n        android:layout_height=\"wrap_content\"\
  \n        android:theme=\"@style/AppTheme.AppBarOverlay\">\n        <com.google.android.material.appbar.CollapsingToolbarLayout\n\
  \            android:id=\"@+id/collapsing_toolbar\"\n            android:layout_width=\"\
  match_parent\"\n            android:layout_height=\"match_parent\"\n           \
  \ app:layout_scrollFlags=\"scroll|enterAlways\"\n            android:fitsSystemWindows=\"\
  true\"\n            app:contentScrim=\"?attr/colorPrimary\"\n            app:expandedTitleMarginStart=\"\
  48dp\"\n            app:expandedTitleMarginEnd=\"64dp\">\n        <ImageView\n \
  \           android:id=\"@+id/backdrop\"\n            android:layout_width=\"match_parent\"\
  \n            android:layout_height=\"200dp\"\n            android:scaleType=\"\
  centerCrop\"\n            android:fitsSystemWindows=\"true\"\n            app:layout_collapseMode=\"\
  parallax\"\n            android:src=\"@drawable/appbar_image\" />\n        <androidx.appcompat.widget.Toolbar\n\
  \            android:id=\"@+id/toolbar\"\n            android:layout_width=\"match_parent\"\
  \n            android:layout_height=\"?attr/actionBarSize\"\n            android:background=\"\
  ?attr/colorPrimary\"\n            app:popupTheme=\"@style/AppTheme.PopupOverlay\"\
  \n            app:layout_scrollFlags=\"scroll|enterAlways\"\n            app:layout_collapseMode=\"\
  pin\" />\n        </com.google.android.material.appbar.CollapsingToolbarLayout>\n\
  \    </com.google.android.material.appbar.AppBarLayout>\n    <include layout=\"\
  @layout/content_main\" />\n</androidx.coordinatorlayout.widget.CoordinatorLayout\n\
  ```\n\n除了向布局中添加新元素外，还删除了 `background` 属性。此更改的优点是提供了一个透明的工具栏，允许应用栏显示更多的图像。\n\n使用操作系统的文件系统，在代码示例的\
  \ `project_icons` 文件夹中找到 `appbar_image.jpg` 文件并复制它。在 Project 窗口中右键点击 `res` -> `drawable`\
  \ 并选择粘贴。\n\n运行时，应用栏应如图 58-7 所示：\n\n![](img/Image2474.png)\n图 58-7\n\n向上滚动列表将导致应用栏逐渐折叠。在收缩过程中，图像将淡出到\
  \ `scrim` 属性定义的颜色，同时标题文本的字体大小将以相应的速率减小，直到只看到工具栏：\n\n![](img/Image2482.png)\n图 58-8\n\
  \n在滚动动作的初始阶段，工具栏保持可见（如果继续向上滚动，工具栏也将移出视线），这是因为 `activity_main.xml` 文件中的工具栏元素被配置为使用\
  \ `pin` 模式：`app:layout_collapseMode=\"pin\"`。如果将折叠模式设置为 `parallax`，工具栏将随图像视图一起收回。\n\
  \n继续向上滚动动作将导致工具栏也折叠，只留状态栏可见：\n\n![](img/Image2491.png)\n图 58-9\n\n由于 `CollapsingToolbarLayout`\
  \ 元素的 `scroll flags` 属性包含了 `enterAlways` 选项，向下滚动将使应用栏再次展开。为了固定工具栏位置使其在向上滚动期间不再收回，请将\
  \ `activity_main.xml` 文件中 `CollapsingToolbarLayout` 元素中的 `enterAlways` 替换为 `exitCollapsed`：\n\
  \n```xml\n<com.google.android.material.appbar.CollapsingToolbarLayout\n    android:id=\"\
  @+id/collapsing_toolbar\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    app:layout_scrollFlags=\"scroll|exitCollapsed\"\n    android:fitsSystemWindows=\"\
  true\"\n    app:contentScrim=\"?attr/colorPrimary\"\n    app:expandedTitleMarginStart=\"\
  48dp\"\n    app:expandedTitleMarginEnd=\"64dp\">\n```\n\n## 58.5 修改标题和遮罩颜色\n\n最后一个任务是编辑\
  \ `MainActivity.kt` 文件并在 `onCreate()` 方法中添加代码来更改折叠实例的标题并设置不同的遮罩颜色（注意遮罩颜色也可以在布局文件中设置）：\n\
  \n```kotlin\npackage com.ebookrenzy.carddemo\n\nimport android.graphics.Color\n\n\
  class MainActivity : AppCompatActivity() {\n    override fun onCreate(savedInstanceState:\
  \ Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_card_demo)\n\
  \        setSupportActionBar(toolbar)\n        collapsing_toolbar.title = \"My Toolbar\
  \ Title\"\n        collapsing_toolbar.setContentScrimColor(Color.GREEN)\n      \
  \  layoutManager = LinearLayoutManager(this)\n        recycler_view.layoutManager\
  \ = layoutManager\n        adapter = RecyclerAdapter()\n        recycler_view.adapter\
  \ = adapter\n    }\n}\n```\n\n最后运行一次应用，注意新标题出现在应用栏中，并且滚动会导致工具栏在收回时变为绿色。\n\n## 58.6\
  \ 总结\n\n大多数 Android 应用顶部的应用栏由多个不同的元素组成，包括工具栏、标签布局甚至是图像视图。当嵌入 `CoordinatorLayout`\
  \ 父布局时，可以使用许多选项来控制应用栏响应滚动事件的行为。为了对这种行为进行更好的控制，`CollapsingToolbarLayout` 管理器提供了一系列额外的控制级别，用于控制应用栏内容相对于滚动活动的扩展和收缩。\n\
  \n## 59. Android Studio 主界面/详情流教程\n\n\n\n\n本章将解释主列表/详情（Master/Detail）用户界面设计概念，然后详细介绍构成\
  \ Android Studio 带“主列表/详情流”模板的元素。随后，将创建一个示例应用程序，演示修改模板以满足应用程序开发者特定需求的各个步骤。\n\n#\
  \ 59.1 主列表/详情流\n\n主列表/详情流是一种界面设计概念，通过向用户显示项目列表（称为主列表）。当用户从列表中选择一个项目时，与该项目相关的附加信息将在详情窗格中呈现给用户。例如，一个电子邮件应用程序可能包含一个收件邮件主列表，其中包含发送者地址和邮件主题。当从主列表中选择一条消息后，邮件正文将出现在详情窗格中。\n\
  \n在横屏模式的平板电脑尺寸 Android 设备屏幕上，主列表显示在屏幕左侧的狭窄垂直面板中。屏幕的其余部分分配给详情窗格，这种布局被称为双窗格模式（two-pane\
  \ mode）。例如，图 59-1 展示了主列表/详情双窗格布局，其中列出了主列表，并在详情窗格中显示了项目一的内容：\n\n![](img/Image2428.png)\n\
  \n图 59-1\n\n在较小的手机尺寸 Android 设备上，主列表占据整个屏幕，而详情窗格则在从主列表中进行选择时显示在单独屏幕上。在模式模式下，详情屏幕包含一个用于返回主列表的操作栏条目。例如，图\
  \ 59-2 展示了在 4 英寸手机屏幕上同一项目列表的主列表和详情屏幕：\n\n![](img/Image24371.png)\n\n图 59-2\n\n#\
  \ 59.2 创建主列表/详情流 Activity\n\n在本章的下一节中，将详细介绍构成主列表/详情流模板的各个元素。实现此点的最佳方法是使用“主列表/详情流”模板创建一个项目，并在学习相关信息时进行操作。该项目随后将作为章节末教程的基础。\n\
  \n尽管项目创建向导包含了选择“主列表/详情流”模板的选项，但在创建项目后添加 Activity 可以在配置模板方面获得更大的灵活性。\n\n从欢迎界面选择 `Start\
  \ a new Android Studio project` 快速启动选项，在新建的项目对话框中，点击 `Next` 按钮之前选择 `Add No Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `MasterDetailFlow` 并指定 `com.ebookfrenzy.masterdetailflow`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Kotlin`。\n\n项目完成后，在 Project 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.masterdetailflow`\
  \ 项，选择 `New` -> `Activity` -> `Master/Detail Flow` 菜单选项。\n\n新建 Android Activity\
  \ 屏幕（图 59-3）提供了配置在主列表/详情 Activity 中显示的对象的机会。在本章后面的教程中，主列表将包含一些网站名称，选择这些名称时，会将所选网站加载到详情窗格内的\
  \ web view 中。考虑到这些需求，将 `Object Kind` 字段设置为“Website”，并将 `Object Kind Plural` 和 `Title`\
  \ 设置为“Websites”。\n\n![](img/as_3.6_master_detail_new_activity.png)\n\n图 59-3\n\n\
  在点击 `Finish` 按钮之前，确保启用 `Launcher Activity` 选项并将 `Source Language` 菜单设置为 `Kotlin`。\n\
  \n# 59.3 主列表/详情流模板的结构\n\n一旦使用主列表/详情流模板创建了新项目，会自动创建许多 Kotlin 和 XML 布局资源文件。理解这些不同文件对于使模板适应特定需求至关重要。在\
  \ Android Studio Project 工具窗口中查看项目将发现以下文件，其中 `<item>` 被创建项目时指定的 `Object Kind` 名称所替换（在\
  \ MasterDetailFlow 示例项目中即为“Website”）：\n\n* `activity_<item>_list.xml` – 主列表的顶层布局文件，该文件由\
  \ `<item>ListActivity` 类加载。此布局包含一个工具栏、一个浮动按钮并包含了 `<item>_list.xml` 文件。\n* `<item>ListActivity.kt`\
  \ – 负责显示和管理主列表（在 `activity_<item>_list.xml` 文件中声明）以及负责显示和响应列表内项目选择的 Activity 类。\n\
  * `<item>_list.xml` – 用于在单窗格模式下（主列表和详情窗格显示在不同屏幕上）显示项目主列表的布局文件。该文件包含一个配置为使用 `LinearLayoutManager`\
  \ 的 `RecyclerView` 对象。`RecyclerView` 元素声明主列表中的每个项目都使用 `<item>_list_content.xml`\
  \ 文件中定义的布局进行显示。\n* `<item>_list.xml (w900dp)` – 平板横屏模式下的主列表布局文件（列表和详情窗格并列显示）。此文件包含一个水平\
  \ `LinearLayout`，其中包含一个用于显示主列表的 `RecyclerView` 和一个包含详情内容的 `FrameLayout`。与该文件的单窗格变体一样，`RecyclerView`\
  \ 元素声明主列表中的每个项目都使用 `<item>_list_content.xml` 中的布局进行显示。\n* `<item>_list_content.xml`\
  \ – 主列表中每个项目的布局文件。默认情况下，它由嵌入在 `LinearLayout` 中的两个 `TextView` 对象组成，但可以根据应用程序需求进行更改。\n\
  * `activity_<item>_detail.xml` – 单窗格模式下详情窗格的顶层布局文件。此布局包含一个应用栏、折叠工具栏、滚动视图和一个浮动按钮。在运行时，该布局文件由\
  \ `<item>DetailActivity` 类加载并显示。\n* `<item>DetailActivity.kt` – 该类显示 `activity_<item>_detail.xml`\
  \ 定义的布局。该类还初始化并显示包含 `<item>_detail.xml` 和 `<item>DetailFragment.kt` 定义内容的片段。\n*\
  \ `<item>_detail.xml` – 随 `<item>DetailFragment` 类对应的布局文件，包含详情内容的区域布局。默认情况下，它包含单个\
  \ `TextView` 对象，但可以根据特定的应用程序需求进行更改。在单窗格模式下，此片段加载到由 `activity_<item>_detail.xml`\
  \ 定义的布局中。在双窗格模式下，此布局加载到 `<item>_list.xml (w900dp)` 文件的 `FrameLayout` 区域。\n* `<item>DetailFragment.kt`\
  \ – 负责显示 `<item>_detail.xml` 布局并填充详情窗格中显示内容的片段类。此片段在 `<item>DetailActivity.kt` 文件中初始化并显示，以为单窗格模式下的\
  \ `activity_<item>_detail.xml` 布局和双窗格模式下的 `<item>_list.xml (w900dp)` 布局提供内容。\n*\
  \ `DummyContent.kt` – 用于为模板提供示例数据的类文件。该类可以根据应用程序需求进行修改或完全替换。默认情况下，此类提供的内容仅由若干字符串项组成。\n\
  \n\n\n\n# 59.4 修改主/详情流模板\n\n虽然主/详情流模板的结构初看起来可能很困惑，但随着在本章的后续部分对默认模板进行修改，其核心概念将变得清晰。显而易见，对于许多主/详情实现需求，该模板提供的许多功能可以保持不变。\n\
  \n在本章的剩余部分，将对 `MasterDetailFlow` 项目进行修改，使主列表显示网站名称列表，并将详情面板更改为包含一个 `WebView` 对象而不是现的\
  \ `TextView`。当用户选择某个网站时，相应的网页将在详情面板中加载并显示。\n\n## 59.5 更改内容模型\n\n目前示例的内容由 `DummyContent`\
  \ 类文件定义。因此，请先选择 `DummyContent.kt` 文件（位于 Project 工具窗口 `app -> java -> com.ebookfrenzy.masterdetailflow\
  \ -> dummy` 文件夹下）并查看代码。在文件底部，有一个名为 `DummyItem` 的类声明，该类目前能够存储两个表示内容字符串和 ID 的 `String`\
  \ 对象。相比之下，更新后的项目需要每个项目对象包含一个 `ID` 字符串、一个网站名称字符串以及一个相应的网站 URL 字符串。为了添加这些功能，请修改 `DummyItem`\
  \ 类使其内容如下：\n\n```kotlin\ndata class DummyItem(val id: String, val website_name:\
  \ String,\n        val website_url: String) {\n\n    override fun toString(): String\
  \ = website_name\n}\n```\n\n注意，封装的 `DummyContent` 类目前包含一个 `for` 循环，通过多次调用名为 `createDummyItem()`\
  \ 和 `makeDetails()` 方法来添加 25 个项目。这些代码中的大部分将不再需要，应按如下方式从类中删除：\n\n```kotlin\nobject\
  \ DummyContent {\n    /**\n     * 示例（虚拟）项的数组。\n     */\n    val ITEMS: MutableList<DummyItem>\
  \ = ArrayList()\n\n    /**\n     * 按 ID 划分的示例（虚拟）项映射。\n     */\n    val ITEM_MAP:\
  \ MutableMap<String, DummyItem> = HashMap()\n\n    private val COUNT = 25\n\n  \
  \  init {\n        // 添加一些示例项。\n        for (i in 1..COUNT) {\n            addItem(createDummyItem(i))\n\
  \        }\n    }\n\n    private fun addItem(item: DummyItem) {\n        ITEMS.add(item)\n\
  \        ITEM_MAP.put(item.id, item)\n    }\n\n    private fun createDummyItem(position:\
  \ Int): DummyItem {\n        return DummyItem(position.toString(), \"Item \" +\n\
  \                position, makeDetails(position))\n    }\n\n    private fun makeDetails(position:\
  \ Int): String {\n        val builder = StringBuilder()\n        builder.append(\"\
  Details about Item: \").append(position)\n        for (i in 0..position - 1) {\n\
  \            builder.append(\"\\nMore details information here.\")\n        }\n\
  \        return builder.toString()\n    }\n}\n```\n\n此代码需要修改，以使用所需的网站数据初始化数据模型：\n\
  \n```kotlin\nval ITEMS: MutableList<DummyItem> = ArrayList()\n\ninit {\n    // 添加\
  \ 3 个示例项。\n    addItem(DummyItem(\"1\", \"eBookFrenzy\", \"https://www.ebookfrenzy.com\"\
  ))\n    addItem(DummyItem(\"2\", \"Amazon\", \"https://www.amazon.com\"))\n    addItem(DummyItem(\"\
  3\", \"New York Times\", \"https://www.nytimes.com\"))\n}\n```\n\n现在代码利用了修改后的 `DummyItem`\
  \ 类来存储每个项目的 ID、站点名称和 URL。\n\n## 59.6 更改详情面板\n\n当用户从主列表中选择一个项目时，显示给用户的详情信息目前通过 `website_detail.xml`\
