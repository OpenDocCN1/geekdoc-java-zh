  \n在示例项目的 `MainActivity.kt` 文件中，修改代码以检查是否已授予应用录音的权限：\n\n```kotlin\npackage com.ebookfrenzy.permissiondemo\n\
  \nimport androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\nimport\
  \ android.Manifest\nimport android.content.pm.PackageManager\nimport androidx.core.content.ContextCompat\n\
  import android.util.Log\n\nclass MainActivity : AppCompatActivity() {\n    private\
  \ val TAG = \"PermissionDemo\"\n\n    override fun onCreate(savedInstanceState:\
  \ Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_permission_demo)\n\
  \        setupPermissions()\n    }\n\n    private fun setupPermissions() {\n   \
  \     val permission = ContextCompat.checkSelfPermission(this,\n            Manifest.permission.RECORD_AUDIO)\n\
  \        if (permission != PackageManager.PERMISSION_GRANTED) {\n            Log.i(TAG,\
  \ \"Permission to record denied\")\n        }\n    }\n}\n```\n\n在运行 Android 6.0\
  \ 之前的版本的设备或模拟器上运行该应用，并检查 Android Studio 中的 Logcat 输出。应用启动后，Logcat 输出应包含“Permission\
  \ to record denied”消息。\n\n编辑 `AndroidManifest.xml` 文件（位于 Project 工具窗口的 `app -> manifests`\
  \ 目录下），并添加一行代码来请求录音权限：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.permissiondemoactivity\"\
  \ >\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n\
  \    <application\n        android:allowBackup=\"true\"\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@sxtring/app_name\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/AppTheme\" >\n        <activity android:name=\"\
  .MainActivity\" >\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n再次编译并运行应用，注意这次权限被拒绝的消息没有出现。显然，在旧版本 Android 上请求此权限所需要的所有工作都已完成。然而，在运行 Android\
  \ 6.0 或更高版本的设备或模拟器上运行应用时，你会发现尽管已在 manifest 文件中添加了权限，检查仍然报告权限被拒绝。这是因为 Android 6 及更高版本要求应用在运行时也请求危险权限。\n\
  \n## 83.4 在运行时请求权限\n\n权限请求是通过调用 `ActivityCompat` 类的 `requestPermissions()` 方法发出的。当调用此方法时，权限请求将进行异步处理，并在任务完成后调用一个名为\
  \ `onRequestPermissionsResult()` 的方法。\n\n`requestPermissions()` 方法的参数包括当前活动的引用、所请求权限的标识符以及一个请求代码。请求代码可以是任意整数值，用于标识是哪一个请求触发了\
  \ `onRequestPermissionsResult()` 方法的调用。修改 `MainActivity.kt` 文件以声明一个请求代码，并在权限检查失败时请求录音权限：\n\
  \n```kotlin\npackage com.ebookfrenzy.permissiondemo\n\nimport androidx.appcompat.app.AppCompatActivity\n\
  import android.os.Bundle\nimport android.Manifest\nimport android.content.pm.PackageManager\n\
  import androidx.core.content.ContextCompat\nimport android.util.Log\nimport androidx.core.app.ActivityCompat\n\
  \nclass MainActivity : AppCompatActivity() {\n    private val TAG = \"PermissionDemo\"\
  \n    private val RECORD_REQUEST_CODE = 101\n\n    private fun setupPermissions()\
  \ {\n        val permission = ContextCompat.checkSelfPermission(this,\n        \
  \    Manifest.permission.RECORD_AUDIO)\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\")\n            makeRequest()\n\
  \        }\n    }\n\n    private fun makeRequest() {\n        ActivityCompat.requestPermissions(this,\n\
  \            arrayOf(Manifest.permission.RECORD_AUDIO),\n            RECORD_REQUEST_CODE)\n\
  \    }\n}\n```\n\n接下来，实现 `onRequestPermissionsResult()` 方法，其内容如下：\n\n```kotlin\n\
  override fun onRequestPermissionsResult(requestCode: Int,\n    permissions: Array<String>,\
  \ grantResults: IntArray) {\n    when (requestCode) {\n        RECORD_REQUEST_CODE\
  \ -> {\n            if (grantResults.isEmpty() || grantResults[0] != PackageManager.PERMISSION_GRANTED)\
  \ {\n                Log.i(TAG, \"Permission denied by user\")\n            } else\
  \ {\n                Log.i(TAG, \"Permission granted by user\")\n            }\n\
  \        }\n    }\n}\n```\n\n在 Android 6 或更高版本的模拟器或设备上编译并运行应用，注意会出现一个请求录音权限的对话框，如图\
  \ 83-3 所示：\n\n![](img/as_3.5_request_audio_permission.png)\nFigure 83-3\n\n点击“允许”按钮，检查\
  \ Logcat 面板是否出现“Permission granted by user”消息。一旦用户授予了请求的权限，未来的 `checkSelfPermission()`\
  \ 调用将返回 `PERMISSION_GRANTED` 结果，除非用户卸载并重装应用或在设置中更改应用权限。\n\n## 83.5 为权限请求提供理由\n\n\
  从图 83-3 可以看出，用户拥有拒绝请求权限的选项。在这种情况下，除非用户在点击“拒绝”按钮之前选择了“不再询问”选项，否则应用在每次由用户启动时都会继续请求该权限。用户的反复拒绝可能表明用户不理解为什么应用需要该权限。因此，如果我们在请求时解释了需求的原因，用户可能可能会授予权限。遗憾的是，无法更改请求对话框的内容以包含此类解释。\n\
  \n最好的做法是将解释包含在一个独立的对话框中，并在向用户展示请求对话框之前显示。这引发了何时显示此解释对话框的问题。Android 文档建议仅在用户之前拒绝过权限的情况下才显示解释对话框，并提供了一个方法来识别何时存在这种情况。\n\
  \n\n\n\n\n调用 `ActivityCompat` 类的 `shouldShowRequestPermissionRationale()` 方法，如果用户之前拒绝过对特定权限的请求，则将返回\
  \ `true`；如果之前没有请求过该权限，则返回 `false`。如果结果为 `true`，应用程序应该显示一个包含该权限理由的对话框，并在用户阅读并关闭该对话框后，应重新请求权限。\n\
  \n要在示例应用程序中添加此功能，请修改 `onCreate()` 方法，使其内容如下：\n\n```kotlin\nimport android.app.AlertDialog\n\
  \nprivate fun setupPermissions() {\n    val permission = ContextCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.RECORD_AUDIO)\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        Log.i(TAG, \"Permission to record denied\")\n        if (ActivityCompat.shouldShowRequestPermissionRationale(this,\n\
  \                Manifest.permission.RECORD_AUDIO)) {\n            val builder =\
  \ AlertDialog.Builder(this)\n            builder.setMessage(\"Permission to access\
  \ the microphone is required for this app to record audio.\")\n                .setTitle(\"\
  Permission required\")\n            builder.setPositiveButton(\"OK\") { dialog,\
  \ id ->\n                Log.i(TAG, \"Clicked\")\n                makeRequest()\n\
  \            }\n            val dialog = builder.create()\n            dialog.show()\n\
  \        } else {\n            makeRequest()\n        }\n    }\n}\n```\n\n该方法仍然检查权限是否已授予，但现在还会识别是否需要显示理由。如果用户之前拒绝过请求，则会显示一个包含说明和“OK”按钮的对话框，并在该按钮上配置监听器，以便在点击按钮时调用\
  \ `makeRequest()` 方法。如果之前没有进行过权限请求，代码将直接跳转到请求权限。\n\n### 83.6 测试权限应用程序\n\n在进行测试的\
  \ Android 6 或更高版本的设备或模拟器会话上，启动 `Settings` 应用，选择 `Apps & notifications`选项，然后滚动并选择\
  \ `PermissionDemo` 应用程序。在应用设置屏幕上，点击卸载按钮从设备中移除该应用。\n\n再次运行应用程序，当权限请求对话框出现时，点击 `Deny`\
  \ 按钮。停止并重启应用程序，验证理由对话框是否出现。点击 `OK` 按钮，当权限请求对话框出现时，点击 `Allow` 按钮。\n\n返回 `Settings`\
  \ 应用，选择 `Apps` 选项并再次从列表中选择 `PermissionDemo` 应用程序。一旦列出应用的设置，请验证 `Permissions` 部分是否列出了\
  \ `Microphone` 权限：\n\n![](img/as_3.5_settings_app_permission.png)\n\n图 83-4\n\n\
  ### 83.7 总结\n\n在 Android 6.0 引入之前，应用程序请求访问某些功能权限的唯一步骤是在应用程序的清单文件（manifest file）中添加适当的代码行。用户在安装应用程序时会被提示批准该权限。对于大多数权限来说仍然如此，但一组被认为是“危险”的权限除外。被认为是危险的权限通常具有允许应用程序违反用户隐私的潜力，例如允许访问麦克风、联系人列表或外部存储。\n\
  \n正如本章概述，基于 Android 6 或更高版本的应用程序现在在启动时，除了在清单文件中包含权限请求外，还必须向用户请求危险权限批准。\n\n# 84.\
  \ 使用 MediaPlayer 和 MediaRecorder 进行 Android 音录制和播放\n\n本章将提供 `MediaRecorder` 类概述，并解释如何使用该类录制音频或视频的基础。还将涵盖使用\
  \ `MediaPlayer` 类播放音频的内容。在介绍基础之后，将创建一个示例应用程序来演示这些技术的实际应用。除了基础知识，本章还将涉及文件保存主题。\n\n\
  ## 84.1 播放音频\n\n可以使用 `MediaPlayer` 或 `AudioTrack` 执行音频播放。`MediaPlayer` 类提供了更简单的接口，并用于大多数播放场景。在典型的实现中，应用程序将实例化\
  \ `MediaPlayer` 对象，设置音频源，然后调用 `prepare()` 随后调用 `start()`。例如：\n\n```kotlin\nval mediaPlayer\
  \ = MediaPlayer()\nmediaPlayer?.setDataSource(\"https://www.yourcompany.com/myaudio.mp3\"\
  )\nmediaPlayer?.prepare()\nmediaPlayer?.start()\n```\n\n## 84.2 使用 MediaRecorder\
  \ 类录制音频和视频\n\n与音频播放一样，录制可以使用多种不同的技术。一种选择是使用 `MediaRecorder` 类，它与 `MediaPlayer` 类一样，提供了许多用于录制音频的方法：\n\
  \n- `setAudioSource()`：指定要录制的音频源（通常这将会是 `MediaRecorder.AudioSource.MIC`）。\n- `setVideoSource()`：指定要录制的视频源（例如\
  \ `MediaRecorder.VideoSource.CAMERA`）。\n- `setOutputFormat()`：指定存储录制的音频或视频的格式（例如\
  \ `MediaRecorder.OutputFormat.AAC_ADTS`）。\n- `setAudioEncoder()`：指定用于录制音频的音频编码器（例如\
  \ `MediaRecorder.AudioEncoder.AAC`）。\n- `setOutputFile()`：配置存储录制的音频或视频的文件路径。\n-\
  \ `prepare()`：准备 `MediaRecorder` 实例以开始录制。\n- `start()`：开始录制过程。\n- `stop()`：停止录制过程。一旦录制器停止，在重新启动之前需要完全重新配置并准备就。\n\
  - `reset()`：重置录制器。\n- `release()`：当录制器实例不再需要时应调用此方法。\n\n\n\n\n\n使用此 `MediaRecorder`\
  \ 的典型实现将设置源、输出、编码格式以及输出文件。随后将调用 `prepare()` 和 `start()` 方法。当录制结束时将调用 `stop()` 方法，然后是\
  \ `reset()` 方法。当应用程序不再需要录制器实例时，建议调用 `release()` 方法：\n\n```kotlin\nval mediaRecorder\
  \ = MediaRecorder()\n\nmediaRecorder?.setAudioSource(MediaRecorder.AudioSource.MIC)\n\
  \nmediaRecorder?.setOutputFormat(MediaRecorder.OutputFormat.THREE_GPP)\n\nmediaRecorder?.setAudioEncoder(MediaRecorder.AudioEncoder.AMR_NB)\n\
  \nmediaRecorder?.setOutputFile(audioFilePath)\n\nmediaRecorder?.prepare()\n\nmediaRecorder?.start()\n\
  \n.\n\n.\n\nmediaRecorder?.stop()\n\nmediaRecorder?.reset()\n\nmediaRecorder?.release()\n\
  ```\n\n为了录制音频，应用程序的清单文件必须包含 `android.permission.RECORD_AUDIO` 权限：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.RECORD_AUDIO\" />\n```\n\n正如在 Android 中请求运行时权限章节中所概述的，访问麦克风属于危险权限类别。因此，为了支持\
  \ Android 6，在应用程序启动时也必须对麦克风访问进行特定请求，相关步骤将在本章稍后部分介绍。\n\n## 84.3 关于示例项目\n\n本章的剩余部分将通过创建一个示例应用程序，旨在演示如何使用\
  \ `MediaPlayer` 和 `MediaRecorder` 类在 Android 设备上实现音频的录制和播放。\n\n在开发使用特定硬件功能的应用程序时（麦克风就是一个例子），在尝试在程序代码中访问该功能之前，检查该功能的可用性是非常重要的。因此，本章创建的应用程序还将包含检测设备上是否存在麦克风的代码。\n\
  \n完成后，该应用程序将提供一个非常简单的界面，允许用户录制和播放音频。录制的音频需要存储在设备上的音频文件中。既然如此，本教程还将简要探究使用 SD 卡存储的机制。\n\
  \n## 84.4 创建 AudioApp 项目\n\n从欢迎界面选择“Start a new Android Studio project”快速启动选项，在出现的新项目对话框中，点击“Next”按钮之前选择“Empty\
  \ Activity”模板。\n\n在 `Name` 字段中输入 `AudioApp`，并指定 `com.ebookfrenzy.audioapp` 为包名。在点击“Finish”按钮之前，将\
  \ Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language 菜单设置为 Kotlin。\n\n\
  ## 84.5 设计用户界面\n\n创建新项目后，从 Project 工具窗口选择 `activity_main.xml` 文件，并在 Design 模式下的\
  \ Layout Editor 工具中，选择“Hello World!” `TextView` 并将其从布局中删除。\n\n将三个 `Button` 视图拖放到布局中。按钮的位置对于本示例并不至关重要，尽管图\
  \ 84-1 显示了一个使用垂直链的建议布局。\n\n配置按钮以显示读取 Play、Record 和 Stop 的字符串资源，并分别为它们赋予 `playButton`、`recordButton`\
  \ 和 `stopButton` 视图 ID。\n\n选择 Play 按钮，并在 Attributes 面板中配置 `onClick` 属性，以便在用户选择时调用名为\
  \ `playAudio` 的方法。重复这些步骤配置其余按钮分别调用名为 `recordAudio` 和 `stopAudio` 的方法。\n\n![](img/as_3.5_audioapp_ui.png)\n\
  \n图 84-1\n\n## 84.6 检查麦克风可用性\n\n在没有麦克风的设备上尝试录制音频会导致 Android 系统抛出异常。因此，代码在进行此类尝试之前检查麦克风的存在至关重要。有多种方法可以实现，包括检查设备的物理存在。一种更简单且可能在不同\
  \ Android 设备上生效的方法是询问 Android 系统是否安装了针对特定功能的包。这涉及创建一个 `Android PackageManager` 类的实例，然后调用该对象的\
  \ `hasSystemFeature()` 方法。`PackageManager.FEATURE_MICROPHONE` 是本例中关注的功能。\n\n为了本示例，我们将创建一个名为\
  \ `hasMicrophone()` 的方法，可以调用它来检查麦克风的存在。在 Project 工具窗口中，找到并双击 `MainActivity.kt` 文件，并修改它以添加此方法：\n\
  \n```kotlin\npackage com.ebookfrenzy.audioapp\n\nimport androidx.appcompat.app.AppCompatActivity\n\
  import android.os.Bundle\nimport android.content.pm.PackageManager\n\nclass MainActivity\
  \ : AppCompatActivity() {\n\n    override fun onCreate(savedInstanceState: Bundle?)\
  \ {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_audio_app)\n\
  \    }\n\n    private fun hasMicrophone(): Boolean {\n        val pmanager = this.packageManager\n\
  \        return pmanager.hasSystemFeature(\n                PackageManager.FEATURE_MICROPHONE)\n\
  \    }\n}\n```\n\n## 84.7 执行 Activity 初始化\n\n下一步是修改 activity 以执行若干初始化任务。在 `MainActivity.kt`\
  \ 文件中，修改代码如下：\n\n```kotlin\nimport android.media.MediaRecorder\nimport android.os.Environment\n\
  import android.view.View\nimport android.media.MediaPlayer\nimport kotlinx.synthetic.main.activity_main\n\
  \nclass MainActivity : AppCompatActivity() {\n    private var mediaRecorder: MediaRecorder?\
  \ = null\n    private var mediaPlayer: MediaPlayer? = null\n    private var audioFilePath:\
  \ String? = null\n    private var isRecording = false\n\n    override fun onCreate(savedInstanceState:\
  \ Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_audio_app)\n\
  \        audioSetup()\n    }\n\n    private fun audioSetup() {\n        if (!hasMicrophone())\
  \ {\n            stopButton.isEnabled = false\n            playButton.isEnabled\
  \ = false\n            recordButton.isEnabled = false\n        } else {\n      \
  \      playButton.isEnabled = false\n            stopButton.isEnabled = false\n\
  \        }\n        audioFilePath = this.getExternalFilesDir(Environment.DIRECTORY_MUSIC)?.absolutePath\
  \ + \"/myaudio.3gp\"\n    }\n}\n```\n\n代码首先获取界面三个按钮的引用。接下来，调用之前实现的 `hasMicrophone()`\
  \ 方法来确定设备是否包含麦克风。如果没有，则禁用所有按钮，否则只禁用 Stop 和 Play 按钮。\n\n下一行代码需要更多的解释：\n\n`audioFilePath\
  \ = this.getExternalFilesDir(Environment.DIRECTORY_MUSIC)?.absolutePath + \"/myaudio.3gp\"\
  `\n\n此代码的目的是识别外部存储的位置（即使在许多 Android 设备上它是内部的，也被称为外部存储），并利用它创建一个名为 `myaudio.3gp`\
  \ 的文件路径。`getExternalFilesDir()` 方法的参数是所需的存储类型（在本例中，我们请求音乐目录的路径，尽管播客、有声书、电影、图片等选项可用）。\n\
  \n在处理外部存储时，必须注意应用程序的此类活动需要在应用程序清单文件中请求权限。例如：\n\n```xml\n<uses-permission android:name=\"\
  android.permission.WRITE_EXTERNAL_STORAGE\" />\n```\n\n## 84.8 实现 recordAudio()\
  \ 方法\n\n\n\n\n\n当用户点击录制（Record）按钮时，将调用 `recordAudio()` 方法。该方法需要启用和禁用相应的按钮，并配置 `MediaRecorder`\
  \ 实例，包含音频源信息、输出格式和编码，以及存储音频的文件位置信息。最后，需要调用 `MediaRecorder` 对象的 `prepare()` 和 `start()`\
  \ 方法。结合这些要求，在 `MainActivity.kt` 文件中实现了以下方法实现：\n\n```kotlin\nfun recordAudio(view:\
  \ View) {\n    isRecording = true\n    stopButton.isEnabled = true\n    playButton.isEnabled\
  \ = false\n    recordButton.isEnabled = false\n    try {\n        mediaRecorder\
  \ = MediaRecorder()\n        mediaRecorder?.setAudioSource(MediaRecorder.AudioSource.MIC)\n\
  \        mediaRecorder?.setOutputFormat(\n                MediaRecorder.OutputFormat.THREE_GPP)\n\
  \        mediaRecorder?.setOutputFile(audioFilePath)\n        mediaRecorder?.setAudioEncoder(MediaRecorder.AudioEncoder.AMR_NB)\n\
  \        mediaRecorder?.prepare()\n    } catch (e: Exception) {\n        e.printStackTrace()\n\
  \    }\n    mediaRecorder?.start()\n}\n```\n\n### 84.9 实现 `stopAudio()` 方法\n\n`stopAudio()`\
  \ 方法负责启用播放按钮、禁用停止按钮，然后停止并重置 `MediaRecorder` 实例。实现此目的的代码如下述列表所示，并应添加到 `MainActivity.kt`\
  \ 文件中：\n\n```kotlin\nfun stopAudio(view: View) {\n    stopButton.isEnabled = false\n\
  \    playButton.isEnabled = true\n    if (isRecording) {\n        recordButton.isEnabled\
  \ = false\n        mediaRecorder?.stop()\n        mediaRecorder?.release()\n   \
  \     mediaRecorder = null\n        isRecording = false\n    } else {\n        mediaPlayer?.release()\n\
  \        mediaPlayer = null\n        recordButton.isEnabled = true\n    }\n}\n```\n\
  \n### 84.10 实现 `playAudio()` 方法\n\n`playAudio()` 方法将创建一个新的 `MediaPlayer` 实例，将位于\
  \ SD 卡上的音频文件分配为数据源，然后准备并开始播放：\n\n```kotlin\nfun playAudio(view: View) {\n    playButton.isEnabled\
  \ = false\n    recordButton.isEnabled = false\n    stopButton.isEnabled = true\n\
  \    mediaPlayer = MediaPlayer()\n    mediaPlayer?.setDataSource(audioFilePath)\n\
  \    mediaPlayer?.prepare()\n    mediaPlayer?.start()\n}\n```\n\n### 84.11 配置并请求权限\n\
  \n在测试应用之前，必须在应用的清单（manifest）文件中为应用请求相应的权限。具体而言，应用需要录制音频和访问外部存储（SD 卡）的权限。在 Project\
  \ 工具窗口中，找到并双击 `AndroidManifest.xml` 文件将其加载到编辑器，并修改 XML 以添加两个权限标签：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.audioapp\" >\n    <uses-permission android:name=\n\
  \                \"android.permission.WRITE_EXTERNAL_STORAGE\" />\n    <uses-permission\
  \ android:name=\"android.permission.RECORD_AUDIO\" />\n    <application\n...\n```\n\
  \n上述步骤将确保当应用安装在运行 Android 6.0 之前版本的设备上时，用户会启用这些权限。在 Android 中，麦克风和外部存储访问被归类为危险权限，因为它们让应用具有可能损害用户隐私的风险。因此，为了让示例应用在\
  \ Android 6 或更高版本的设备上运行，需要添加代码以在应用运行时专门请求这两个权限。\n\n编辑 `MainActivity.kt` 文件，首先添加一些额外的导入指令和常量，以作为所请求权限的请求识别码：\n\
  \n```kotlin\n...\nimport android.Manifest\nimport android.widget.Toast\nimport androidx.core.app.ActivityCompat\n\
  import androidx.core.content.ContextCompat\n...\nclass MainActivity : AppCompatActivity()\
  \ {\n...\n    private val RECORD_REQUEST_CODE = 101\n    private val STORAGE_REQUEST_CODE\
  \ = 102\n...\n```\n\n接下来，需要在类中添加一个方法，该方法的作用是接收要请求的权限和相应的请求识别码作为参数。留在 `MainActivity.kt`\
  \ 类文件中，如下所示实现此方法：\n\n```kotlin\nprivate fun requestPermission(permissionType: String,\
  \ requestCode: Int) {\n    val permission = ContextCompat.checkSelfPermission(this,\n\
  \            permissionType)\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        ActivityCompat.requestPermissions(this,\n            arrayOf(permission),\
  \ requestCode)\n    }\n}\n```\n\n使用本书中“在 Android 中进行运行时请求”章节概述的步骤，上述方法在发出请求之前验证指定的权限是否尚未授予，并将识别码作为参数传递。当请求被处理后，将调用\
  \ Activity 上的 `onRequestPermissions()` 方法，并传递识别码和请求结果。因此，下一步是在 `MainActivity.kt`\
  \ 文件中如下实现此方法：\n\n```kotlin\noverride fun onRequestPermissions(requestCode: Int,\n\
  \        permissions: Array<String>, grantResults: IntArray) {\n    when (requestCode)\
  \ {\n        RECORD_REQUEST_CODE -> {\n            if (grantResults.isEmpty() ||\
  \ grantResults[0]\n            != PackageManager.PERMISSION_GRANTED) {\n       \
  \         recordButton.isEnabled = false\n                Toast.makeText(this,\n\
  \                    \"Record permission required\",\n                    Toast.LENGTH_LONG).show()\n\
  \            } else {\n                requestPermission(\n                    Manifest.permission.WRITE_EXTERNAL_STORAGE,\n\
  \                    STORAGE_REQUEST_CODE)\n            }\n            return\n\
  \        }\n        STORAGE_REQUEST_CODE -> {\n            if (grantResults.isEmpty()\
  \ || grantResults[0]\n            != PackageManager.PERMISSION_GRANTED) {\n    \
  \            recordButton.isEnabled = false\n                Toast.makeText(this,\n\
  \                    \"External Storage permission required\",\n               \
  \     Toast.LENGTH_LONG).show()\n            }\n            return\n        }\n\
  \    }\n}\n```\n\n上述代码检查请求识别码以确定哪个权限请求已返回，然后检查相应的权限是否已授予。如果用户授予了访问麦克风的权限，代码将继续请求访问外部存储。如果任何权限被拒绝，将向用户显示消息，指示应用将无法运行。在两种情况下，录制按钮都被禁用。\n\
  \n在测试应用之前，最后的操作是在应用启动时调用新添加的麦克风访问 `requestPermission()` 方法。在 `MainActivity.kt` 文件中，如下修改\
  \ `audioSetup()` 方法：\n\n```kotlin\nprivate fun audioSetup() {\n    if (!hasMicrophone())\
  \ {\n        stopButton.isEnabled = false\n        playButton.isEnabled = false\n\
  \        recordButton.isEnabled = false\n    } else {\n        playButton.isEnabled\
  \ = false\n        stopButton.isEnabled = false\n    }\n    audioFilePath = this.getExternalFilesDir(Environment.DIRECTORY_MUSIC)?.\n\
  \            absolutePath + \"/myaudio.3gp\"\n    requestPermission(Manifest.permission.RECORD_AUDIO,\n\
  \        RECORD_REQUEST_CODE)\n}\n```\n\n### 84.12 测试应用\n\n\n\n\n在带有麦克风的 Android\
  \ 设备上编译并运行应用程序，允许请求的权限并点击记录（Record）按钮。记录完成后，点击停止（Stop）然后播放（Play），此时录制的音频应通过设备扬声器播放。如果是在\
  \ Android 6.0 或更高版本上运行，请注意应用在首次启动时请求使用外部存储和录制音频的权限。\n\n# 84.13 总结\n\nAndroid SDK\
  \ 提供了多种实现录制和播放的机制。本章通过 `MediaPlayer` 和 `MediaRecorder` 类介绍了其中两种机制。在涵盖了使用这些技术的理论后，本章详细实现了一个用于录制并播放音频的示例应用程序。在在\
  \ Android 中处理音频的过程中，本章还研究了在尝试录制音频之前确保运行应用程序的设备具有麦克风的步骤。此外，还涵盖了以 SD 卡形式使用外部存储的内容。\n\
  \n# 85. 在 Android Studio 中使用 Google Maps Android API\n\n当 Google 在许多年前决定引入地图服务时，很难说他们是否曾预见到会有一个可以集成到移动应用程序中的版本。当\
  \ 2005 年推出最终被称为 Google Maps 的第一个 Web 版本时，iPhone 尚未点燃智能手机革命，而开发 Android  way 系统的公司在六个月后才被\
  \ Google 收购。无论 Google 对 Google Maps 的未来有何种愿景，考虑到现在可以通过 Google Maps Android API 直接通过\
  \ Android 应用程序访问 Google Maps 的所有功能，这都是非常令人惊叹。\n\n本章旨在概述 Google Maps 系统和 Google Maps\
  \ Android API。本章将概述组成 API 的不同元素，详细说明配置开发环境以使用 Google Maps 所需的步骤，并通过一些代码示例演示 Google\
  \ Maps Android 集成的一些基础知识。\n\n## 85.1 Google Maps Android API 的元素\n\nGoogle Maps\
  \ Android API 由一组核心类组成，这些类结合在一起为 Android 应用程序提供地图绘制功能。地图的关键元素如下：\n\n- `GoogleMap`\
  \ – Google Maps Android API 的主类。该类负责下载和显示地图瓦片，并显示和响应地图控制控件。`GoogleMap` 对象不是由应用程序直接创建的，而是在创建\
  \ `MapView` 或 `MapFragment` 实例时创建。在应用程序代码中，可以通过调用 `MapView`、`MapFragment` 或 `SupportMapFragment`\
  \ 实例的 `getMap()` 方法来获取 `GoogleMap` 对象的引用。\n- `MapView` - `View` 类的子类，该类提供视图画布，`GoogleMap`\
  \ 对象在其上绘制地图，允许将地图放置在 Activity 的用户界面布局中。\n- `SupportMapFragment` – `Fragment` 类的子类，该类允许将地图放置在\
  \ Android 布局中的 `Fragment` 中。\n- `Marker` – `Marker` 类的作用允许在地图上标记位置。通过获取与地图关联的 `GoogleMap`\
  \ 对象引用，然后调用该对象实例的 `addMarker()` 方法将标记添加到地图中。标记的位置通过 `Longitude`（经度）和 `Latitude`（纬度）定义。标记可以通过多种方式配置，包括指定标题、文本和图标。标记还可能被设置为“可拖拽的”（draggable），允许用户将标记移动到地图上的不同位置。\n\
  - `Shapes` – 在地图上绘制线条和形状是通过使用 `Polyline`、`Polygon` 和 `Circle` 类实现的。\n- `UiSettings`\
  \ – `UiSettings` 类提供了从应用程序内部控制地图上出现的用户界面控件显示的方法。例如，使用该类，应用程序可以控制地图上是否显示缩放、当前位置和罗指南控件。该类还可以用于配置地图识别哪些触摸屏手势。\n\
  - `My Location Layer`（我的位置层） – 启用后，我的位置层会在地图上显示一个按钮，用户选择后会将地图中心置于用户的当前地理位置。如果用户处于静止状态，该位置在地图上用蓝色标记表示。如果用户正在移动，位置将由一个指示用户行驶方向的箭头（chevron）表示。\n\
  \n熟悉 Google Maps Android API 的最佳方法是运行示例。本章的其余部分将创建一个基于 Google Maps 的简单应用程序同时突出 API\
  \ 的关键区域。\n\n## 85.2 创建 Google Maps 项目\n\n从欢迎界面选择“Start a new Android Studio project”（启动新的\
  \ Android Studio 项目）快速启动选项，在生成的新项目对话框中，点击“Next”（下一步）之前选择 Google Maps Activity 模板。\n\
  \n在 `Name` 字段中输入 `MapDemo` 并指定 `com.ebookfrenzy.mapdemo` 为包名。在点击“Finish”（完成）按钮之前，将\
  \ Minimum API level（最低 API 级别）设置为 `API 26: Android 8.0 (Oreo)`，并将 Language（语言）菜单更改为\
  \ `Kotlin`。\n\n## 85.3 获取您的开发者签名\n\n应用程序在使用 Google Maps Android API 之前，必须首先在 Google\
  \ APIs Console 中注册。然而，在注册应用程序之前，必须识别与您的开发环境相关的开发者签名（也称为 `SHA-1` 指纹）。该签名包含位于家目录下\
  \ `.android` 子目录下的 keystore 文件中，可以使用 Java SDK 提供的 `keytool` 工具获取。然而，为了使过程变得更简单，在创建项目期间选择\
  \ Google Maps 选项时，Android Studio 会向项目添加一些额外文件。其中一个文件名为 `google_maps_api.xml`，位于项目的\
  \ `app -> res -> values` 文件夹中。\n\n`google_maps_api.xml` 文件包含指向 Google 控制台的链接。复制并粘贴到浏览器窗口。加载后，将显示如下页面：\n\
  \n(Images/2427.png)\n图 85-1\n\n在点击“Continue”（继续）按钮之前，验证设置为创建项目。启用 API 后，点击“Create\
  \ API Key”按钮。稍后将创建项目并显示一个提供应用程序 API 密钥的面板。\n\n(Images/24364.png)\n图 85-2\n\n复制此密钥，返回\
  \ Android Studio 并 API 密钥粘贴到文件的 `YOUR_KEY_HERE` 部分：\n\n```xml\n<string name=\"google_maps_key\"\
  \ templateStrategy=\"preserve\" translatable=\"false\">YOUR_KEY_HERE</string>\n\
  ```\n\n## 85.4 添加 Apache HTTP 库要求由于由于示例项目针对 Android 9.0 或更高版本构建，因此需要在 `AndroidManifest.xml`\
  \ 文件的 `<application>` 部分添加以下声明：\n\n```xml\n<application\n    android:allowBackup=\"\
  true\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
  \n    android:roundIcon=\"@mipmap/ic_launcher_round\"\n    android:supportsRtl=\"\
  true\"\n    android:theme=\"@style/AppTheme\">\n\n    <uses-library\n        android:name=\"\
  org.apache.http.legacy\"\n        android:required=\"false\" />\n\n</application>\n\
  ```\n\n## 85.5 测试应用程序\n\n运行应用程序以验证 API 密钥是否配置正确。假设配置正确，应用程序将运行并在屏幕上显示地图。\n\n\n\n\
  如果地图未显示，请检查以下区域：\n\n- 如果应用程序运行在模拟器上，请确保模拟器运行的 Android 版本包含 `Google APIs`。可以通过选择\
  \ `Tools` -> `Android` -> `AVD Manager` 菜单选项来更改 `AVD` 配置的当前操作系统，点击 `AVD` 对应 `Actions`\
  \ 列中的铅笔图标，然后点击当前 Android 版本旁边的 `Change…` 按钮。在系统镜像对话框中，选择一个包含 `Google APIs` 的目标。\n\
  - 检查 `Logcat` 输出，是否有任何与 `Google Maps API` 认证问题的内容。这通常意味着 API 密钥输入错误，或者应用程序包名与生成\
  \ API 密钥时指定的名称不匹配。\n- 在 Google API 控制台中验证是否已在 `Services` 面板中启用了 `Google Maps Android\
  \ API`。\n\n# 85.6 理解地理编码和反向地理编码\n\n如果不预先介绍地理编码（Geocoding）主题，就无法谈论地图和地理位置。地理编码可以最好地描述为将基于文本的地理位置（如街道地址）转换为以经纬度表示的地理坐标的过程。\n\
  \n可以使用 Android `Geocoder` 类实现地理编码。例如，可以向 `Geocoder` 类实例传递一个表示位置的字符串，如城市名称、街道地址或机场代码。`Geocoder`\
  \ 将尝试查找该位置的匹配项，并返回一个可能与位置字符串匹配的 `Address` 对象列表，按顺序排序，最接近的匹配项位于列表的索引 `0`。随后可以从 `Address`\
  \ 对象中提取各种信息，包括可能匹配项的经纬度。\n\n例如，以下代码请求了华盛顿特区国家航空航天博物馆的位置：\n\n```kotlin\nimport android.location.Geocoder\n\
  import android.location.Address\nimport java.io.IOException\n\nval latitude: Double\n\
  val longitude: Double\nvar geocodeMatches: List<Address>? = null\n\ntry {\n    geocodeMatches\
  \ = Geocoder(this).getFromLocationName(\n        \"600 Independence Ave SW, Washington,\
  \ DC 20560\", 1)\n} catch (e: IOException) {\n    e.printStackTrace()\n}\n\nif (geocodeMatches\
  \ != null) {\n    latitude = geocodeMatches[0].latitude\n    longitude = geocodeMatches[0].longitude\n\
  }\n```\n\n注意，值 `1` 被作为第二个参数传递给 `getFromLocationName()` 方法。这只是告诉 `Geocoder` 在数组中只返回一个结果。鉴于所提供地址的特殊性，应该只有一个潜在的匹配项。然而，对于更模糊的位置名称，可能需要请求更多潜在匹配项并允许用户选择正确的那个。\n\
  \n上述代码是正向编码（forward-geocoding）的示例，即根据文本位置描述计算坐标。反向地理编码（Reverse-geocoding）顾其实义，涉及将地理坐标转换为人类可读的地址字符串。例如，考虑以下代码：\n\
  \n```kotlin\nimport android.location.Geocoder\nimport android.location.Address\n\
  import java.io.IOException\n\nvar geocodeMatches: List<Address>? = null\nval Address1:\
  \ String?\nval Address2: String?\nval State: String?\nval Zipcode: String?\nval\
  \ Country: String?\n\ntry {\n    geocodeMatches = Geocoder(this).getFromLocation(38.8874245,\
  \ -77.0200729, 1)\n} catch (e: IOException) {\n    e.printStackTrace()\n}\n\nif\
  \ (geocodeMatches != null) {\n    Address1 = geocodeMatches[0].getAddressLine(0)\n\
  \    Address2 = geocodeMatches[0].getAddressLine(1)\n    State = geocodeMatches[0].adminArea\n\
  \    Zipcode = geocodeMatches[0].postalCode\n    Country = geocodeMatches[0].countryName\n\
  }\n```\n\n在这种情况下，`Geocoder` 对象通过 `getFromLocation()` 方法使用经度和纬度值进行初始化。再次，仅请求了单个匹配结果。然后从生成的\
  \ `Address` 对象中提取基于文本的地址信息。\n\n需要注意的是，地理编码实际上并不是在 Android 设备上执行的，而是在服务器上执行，设备在需要翻译时连接到服务器，翻译完成后返回结果。因此，地理编码只有在设备具有活动\
  \ Internet 连接时才能发生。\n\n# 85.7 为应用程序添加地图\n\n向应用程序添加地图最简单的方法是在 Activity 的界面布局 XML\
  \ 文件中指定它。以下布局文件示例显示了 Android Studio 创建的 `activity_maps.xml` 文件添加了 `SupportMapFragment`\
  \ 实例：\n\n```xml\n<fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    android:id=\"@+id/map\"\
  \n    tools:context=\".MapsActivity\"\n    android:name=\"com.google.android.gms.SupportMapFragment\"\
  />\n```\n\n# 85.8 请求当前位置\n\n正如“运行时请求”章节概述的，某些权限被归类为危险权限，在 Android 6.0 或更高版本中需要进行处理。其中一种权限赋予应用程序识别用户位置的能力。默认情况下，Android\
  \ Studio 已在 `AndroidManifest.xml` 中放置了位置请求。在项目窗口的 `app -> manifests` 下找到此文件并定位以下行：\n\
  \n```xml\n<uses-permission android:name=\"android.permission.FINE_LOCATION\" />\n\
  ```\n\n这将确保在旧版本的 Android 上获得位置的机会，但为了支持 6.0 或更高版本，应用程序必须在运行时请求请求权限。要实现这一点，需要在 `MapsActivity.kt`\
  \ 文件中添加一些代码。首先添加一些导入：\n\n```kotlin\npackage com.frenzy.map\n\nimport androidx.core.content.ContextCompat\n\
  import androidx.core.app.ActivityCompat\nimport android.Manifest\nimport android.widget.Toast\n\
  import android.pm.PackageManager\n\nclass MapsActivity : FragmentActivity(), OnMapReadyCallback\
  \ {\n    private val LOCATION_REQUEST_CODE = 101\n    private lateinit var mMap:\
  \ GoogleMap = null\n```\n\n接下来，需要在类中添加一个方法向用户请求指定的权限：\n\n```kotlin\nprivate fun\
  \ requestPermission(permissionType: String, requestCode: Int) {\n    ActivityCompat.requestPermissions(this,\
  \ arrayOf(permissionType), requestCode)\n}\n```\n\n当用户响应权限请求时，Activity 将调用 `onRequestPermissionsResult()`。留在\
  \ `MapsActivity.kt` 文件中，实现此方法使其如下：\n\n```kotlin\noverride fun onRequestPermissionsResult(requestCode:\
  \ Int, permissions: Array<String>, grantResults: IntArray) {\n    when (requestCode)\
  \ {\n        LOCATION_REQUEST_CODE -> {\n            if (grantResults.isEmpty()\
  \ || grantResults[0] != PackageManager.PERMISSION_GRANTED) {\n                Toast.makeText(this,\
  \ \"Unable to show location - permission required\", Toast.LENGTH_LONG).show()\n\
  \            } else {\n                val mapFragment = supportFragmentManager.findFragmentById(R.id.map)\
  \ as SupportMapFragment\n                mapFragment.getMapAsync(this)\n       \
  \     }\n        }\n    }\n}\n```\n\n\n\n\n如果用户未授予权限，应用程序将显示一条消息，指示无法显示当前位置。相反，如果授予了权限，地图将进行刷新，以便显示位置标记。\n\
  \n## 85.9 显示用户的当前位置\n\n一旦授予了相应的权限，可以通过获取与显示的地图关联的 `GoogleMap` 对象的引用，并调用该实例的 `setMyLocationEnabled()`\
  \ 方法（传入 `true` 值），从而在地图上显示用户的当前位置。\n\n当地图准备好显示时，会调用 Activity 的 `onMapReady()` 方法。当地图在上述的\
  \ `onRequestPermissionsResult()` 方法中进行刷新时，该方法也会被调用。默认情况下，Android Studio 已经实现了此方法，并添加了一些代码，将地图对准澳大利亚，并在悉尼市上方放置一个标记。请找到并编辑\
  \ `MapsActivity.kt` 文件中的 `onMapReady()` 方法，以移除这些模板代码，并添加代码在启用显示用户当前位置之前检查是否已授予位置权限。如果未授予权限，将通过调用之前添加的\
  \ `requestPermission()` 方法向用户发出请求：\n\n```kotlin\noverride fun onMapReady(googleMap:\
  \ GoogleMap) {\n\n    mMap = googleMap\n    // Add a marker in Sydney and move the\
  \ camera\n    val sydney = LatLng(-34.0, 151.0)\n    mMap.addMarker(MarkerOptions().position(sydney).title(\"\
  Marker in Sydney\"))\n    mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney))\n\
  \    val permission = ContextCompat.checkSelfPermission(this,\n            Manifest.permission.ACCESS_FINE_LOCATION)\n\
  \    if (permission == PackageManager.PERMISSION_GRANTED) {\n        mMap.isMyLocationEnabled\
  \ = true\n    } else {\n        requestPermission(\n                Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \                LOCATION_REQUEST_CODE)\n    }\n}\n```\n\n现在运行应用程序，将出现图 85-3 所示的对话框，请求位置权限。如果授予了权限，地图上将出现一个蓝点，表示设备的当前位置。\n\
  \n![](img/as_3.5_location_request.png)\n\n图 85-3\n\n## 85.10 更改地图类型\n\n通过调用相应的 `GoogleMap`\
  \ 对象的 `setMapType()` 方法并传入以下值之一，可以动态修改显示的地图类型：\n\n* `GoogleMap.MAP_TYPE_NONE` –\
  \ 一个不显示任何地图瓦片的的空网格。\n* `GoogleMap.MAP_TYPE_NORMAL` – 由经典道路地图组成的标准视图。\n* `GoogleMap.MAP_TYPE_SATELLITE`\
  \ – 显示地图区域的卫星图像。\n* `GoogleMap.MAP_TYPE_HYBRID` – 显示叠加了道路地图的卫星图像。\n* `GoogleMap.MAP_TYPE_TERRAIN`\
  \ – 显示等高线和颜色等地形信息。\n\n例如，对 `onMapReady()` 方法进行以下代码更改，可以将地图切换到卫星模式：\n\n```kotlin\n\
  if (mMap != null) {\n    val permission = ContextCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.ACCESS_FINE_LOCATION)\n    if (permission == PackageManager.PERMISSION_GRANTED)\
  \ {\n        mMap.isMyLocationEnabled = true\n    } else {\n        requestPermission(\n\
  \                Manifest.permission.ACCESS_FINE_LOCATION,\n                LOCATION_REQUEST_CODE)\n\
  \    }\n}\n```\n\n（注：提供的文本包含重复逻辑和碎片化的 XML 风格片段，已为了提高可读性进行了清理，同时保留了核心逻辑。）\n\n\n\n\
  \n\n通过在屏幕上放置两个手指并进行圆周运动，当启用地图旋转手势时，用户可以旋转地图的方向。这种手势的支持可以通过代码中 `UiSettings` 实例的 `isRotateGesturesEnabled`\
  \ 属性来启用或禁用，例如：\n\n```\nval mapSettings = mMap.uiSettings\n\nmapSettings?.isRotateGesturesEnabled\
  \ = true\n```\n\n也可以使用 XML 布局资源文件中的 `map:uiRotateGestures` 属性来启用或禁用旋转手势。\n\n# 85.13\
  \ 创建地图标记 (Markers)\n\n标记用于通知用户地图上的位置，其形式可以是标准图标或自定义图标。标记还可能包含一个标题（title）和可选的文本（称为摘要，snippet），并可以配置为允许用户将其拖动到地图上的不同位置。当用户点击时，将出现信息窗口（info\
  \ window），显示有关标记位置的额外信息。\n\n标记由 `Marker` 类的实例表示，并通过调用相应 `GoogleMap` 对象的 `addMarker()`\
  \ 方法添加到地图上。传递给该方法的参数是一个 `MarkerOptions` 类的实例，它包含了标记所需的各种选项，如标题和摘要文本。标记的位置通过指定纬度和经度值来定义，这些值也包含在\
  \ `MarkerOptions` 实例中。例如，以下代码向地图上的特定位置添加了一个包含标题、摘要和位置的标记：\n\n```java\nimport com.google.android.gms.maps.model.LatLng\n\
  \nimport com.google.android.gms.maps.model.MarkerOptions\n\n.\n\nval position =\
  \ LatLng(38.8874245, -77.0200729)\n\nmMap.addMarker(MarkerOptions()\n        .position(position)\n\
  \        .title(\"Museum\")\n        .snippet(\"National Air and Space Museum\"\
  ))\n```\n\n执行上述代码后，将标记指定的的位置。点击该位置时，将显示一个包含标题和摘要的信息窗口，如图 85-4 所示：\n\n![](img/Image24514.png)\n\
  \n图 85-4\n\n# 85.14 控制地图相机\n\n由于 Android 设备屏幕是平面的，而地球是球体，Google Maps Android API\
  \ 使用墨卡托投影（Mercator projection）在平面上表示地球。地图的默认视图呈现给用户，就像通过一个悬挂在地图上方并直接指向地图的相机一样。Google\
  \ Maps Android API 允许在应用程序内部实时更改相机的目标（target）、缩放（zoom）、方位（bearing）和倾角（tilt）：\n\n\
  * **Target（目标）** – 地图在设备显示中的中心位置，以经纬度表示。\n* **Zoom（缩放）** – 相机的缩放级别，以级别为单位。缩放级别增加\
  \ 1.0，显示的地图宽度翻倍。\n* **Tilt（倾角）** – 相机的视角角度，表示为跨越可视地图区域正上方弧线上的位置，从弧顶开始测量角度（弧顶是弧的最低点，相机在此直接指向地图）。\n\
  * **Bearing（方位）** – 地图的方向，以从北向开始顺时针方向的角度表示。\n\n相机的更改通过创建一个具有适当设置的 `CameraUpdate`\
  \ 类实例来实现。`CameraUpdate` 实例是通过对 `CameraUpdateFactory` 类的方法调用来创建的。一旦创建了 `CameraUpdate`\
  \ 实例，就可以通过调用 `GoogleMap` 实例的 `moveCamera()` 方法将其应用于地图。为了在相机更改时获得平滑的动画效果，可以调用 `animateCamera()`\
  \ 方法而不是 `moveCamera()`。\n\n`CameraUpdateFactory` 方法的摘要如下：\n\n* `CameraUpdateFactory.zoomIn()`\
  \ – 提供一个放大一级的 `CameraUpdate` 实例。\n* `CameraUpdateFactory.zoomOut()` - 提供一个缩小一级的\
  \ `CameraUpdate` 实例。\n* `CameraUpdateFactory.zoomTo(float)` - 生成一个将缩放级别更改为指定值的 `CameraUpdate`\
  \ 实例。\n* `CameraUpdateFactory.zoomBy(float)` – 提供一个按指定量级增加或减少缩放层级的 `CameraUpdate`\
  \ 实例。\n* `CameraUpdateFactory.zoomBy(float, Point)` - 创建一个按指定值增加或减少缩放层级的 `CameraUpdate`\
  \ 实例。\n* `CameraUpdateFactory.newLatLng(LatLng)` - 创建一个更改相机目标纬度和经度的 `CameraUpdate`\
  \ 实例。\n* `CameraUpdateFactory.newLatLngZoom(LatLng, float)` - 生成一个更改相机纬度、经度和缩放的\
  \ `CameraUpdate` 实例。\n* `CameraUpdateFactory.newCameraPosition(CameraPosition)`\
  \ - 返回一个将相机移动到指定位置的 `CameraUpdate` 实例。可以使用 `CameraPosition.Builder()` 获取 `CameraPosition`\
  \ 实例。\n\n例如，以下代码使用动画将相机放大一级：\n\n```\nmMap.animateCamera(CameraUpdateFactory.zoomIn())\n\
  ```\n\n相反，以下代码在不使用动画的情况下将相机移动到新位置并将缩放级别调整为 10：\n\n```java\nval position = LatLng(38.8874245,\
  \ -77.0200729)\n\nmMap.moveCamera(CameraUpdateFactory.newLatLngZoom(position, 10f))\n\
  ```\n\n最后，下一个代码示例使用 `CameraPosition.Builder()` 创建了一个带有目标、缩放、方位和倾角更改的 `CameraPosition`\
  \ 对象。然后通过动画应用此更改：\n\n```java\nimport com.google.android.gms.maps.model.CameraPosition\n\
  \nimport com.google.android.gms.maps.model.CameraUpdateFactory\n\nval cameraPosition\
  \ = CameraPosition.Builder()\n    .target(position)\n    .zoom(50f)\n    .bearing(70f)\n\
  \    .tilt(25f)\n    .build()\n\nmMap.animateCamera(CameraUpdateFactory.newCameraPosition(cameraPosition))\n\
  ```\n\n# 85.15 总结\n\n本章概述了构成 Google Maps API 的关键类和方法，并概述了准备开发环境和应用程序项目以使用该 API 的步骤。\n\
  \n# 86 使用 Android 框架打印\n\n由于 Android 4.4 KitKat 版本的发布，已经可以在应用程序内部打印内容。虽然后续章节将详细探讨为自己的应用程序添加打印支持的选项，但本章将重点关注目前可用的各种打印选项。\n\
  \n## 86.1 Android 打印架构\n\nAndroid 打印由打印框架提供。简单来说，该框架由一个打印管理器和多个打印服务插件组成。打印管理器负责处理来自设备应用程序的打印请求，并与设备上安装的打印服务插件交互，从而确保打印请求得到履行。\n\
  \n\n\n\n\n可以通过加载 Google Play 应用并搜索“Print Service Plugin”（打印服务插件）来验证 Android 设备上是否存在\
  \ `Print Service Plugin`。一旦该插件出现在 Play 商店列表中，如果该插件尚未安装，则可以通过“安装”按钮进行安装。例如，图 86-1\
  \ 显示了 Google Play 中的 HP 打印服务插件。\n\n打印服务插件将自动检测 Android 设备当前连接到网络上的兼容打印机，并在从应用程序进行打印时将它们列为选项。\n\
  \n![](img/Image24501.png)\n\n图 86-1\n\n## 86.3 Google Cloud Print\n\nGoogle Cloud\
  \ Print 是由 Google 提供的一项服务，使您能够从任何连接互联网的地方通过网络将内容打印到自己的打印机上。Google Cloud Print 支持以云就绪（Cloud\
  \ Ready）和经典（Classic）打印机形式存在的设备和打印机型号。云就打印机内置了允许通过网页打印的技术。提供云就打印机的制造商包括兄弟（Brother）、佳能（Canon）、戴、爱普（Epson）、HP、柯达（Kodak）和三星（Samsung）。要识别您的打印机是否既云就绪又受\
  \ Google Cloud Print 支持，请查看以下 URL 上的打印机列表：\n\n[`www.google.com/cloudprint/learn/printers.html`](https://www.google.com/cloudprint/learn/printers.html)\n\
  \n对于经典的非云就绪打印机，Google Cloud Print 通过在连接到经典打印机的计算机系统（直接连接或通过家庭或办公室网络连接）上安装软件来提供云打印支持。\n\
  \n要设置 Google Cloud Print，请访问以下网页并使用您登录 Android 设备时相同的 Google 账户 ID 登录：\n\n[`www.google.com/cloudprint/learn/index.html`](https://www.google.com/cloudprint/learn/index.html)\n\
  \n一旦将打印机添加到您的 Google Cloud Print 账户，当您在设备上的 Android 应用程序中打印时，它们将列为打印目标选项。\n\n##\
  \ 86.4 打印到 Google Drive\n\n除了支持物理打印机外，还可以将打印输出保存到您的 Google Drive 账户中。从设备进行打印时，选择打印面板中的“保存到\
  \ Google Drive”选项。要打印的内容将被转换为 PDF 文件，并保存到与设备上当前激活 Google 账户 ID 关联的 Google Drive\
  \ 云存储中。\n\n## 86.5 保存为 PDF\n\nAndroid 提供的最后一个打印选项允许将打印内容以 PDF 文件的格式本地保存到 Android\
  \ 设备上。一旦选择此选项，系统将请求 PDF 文件名以及保存文档的设备位置。\n\n在测试自己的 Android 应用程序的打印功能时，“保存为 PDF”和“Google\
  \ Drive”选项在节约纸方面可能极具价值。\n\n## 86.6 从 Android 设备打印\n\nGoogle 建议提供打印内容能力的应用程序将打印选项放置在溢出菜单（Overflow\
  \ menu）中（该主题在名为“Android 上创建和管理溢出菜单”的章节中有详细介绍）。与 Android 捆绑的许多应用程序现在都包含了“打印……”菜单选项。例如，图\
  \ 86-2 显示了通过选择 Chrome 浏览器应用程序溢出菜单中的“共享……”选项来访问打印选项：\n\n![](img/as_3.5_chrome_print_option.png)\n\
  \n图 86-2\n\n一旦在应用程序内部选择了打印选项，将出现标准的 Android 打印屏幕，显示打印内容的预览，如图 86-3 所示：\n\n![](img/as_3.5_chrome_print_panel.png)\n\
  \n图 86-3\n\n点击屏幕顶部的面板将显示全范围的打印选项：\n\n![](img/as_3.5_save_as_pdf.png)\n\n图 86-4\n\
  \nAndroid 打印面板提供了常用的打印选项，如纸张大小、颜色、方向和打印份数。可以通过点击当前打印机或 PDF 输出选择来访问其他打印目标选项。\n\n\
  ## 86.7 在 Android 应用中构建打印支持的选项\n\n打印框架（Printing framework）为在 Android 应用程序中整合打印支持提供了选项。这些选项可以分类如下：\n\
  \n### 86.7.1 图像打印\n\n顾名，此选项允许将图像打印集成到 Android 应用程序中。向应用程序添加此功能时，第一步是创建 `PrintHelper`\
  \ 类的一个新实例：\n\n```\nval imagePrinter = PrintHelper(context)\n```\n\n接下来，可以通过调用 `PrintHelper`\
  \ 实例的 `setScaleMode()` 方法来指定打印图像的缩放模式。选项如下：\n\n- `SCALE_MODE_FIT` – 图像将缩放以适应纸张大小，而不进行任何裁剪或更改比例。这通常会导致在一个维度出现留白。\n\
  - `SCALE_MODE_FILL` – 图像将缩放以填充纸张大小，并在必要时进行裁剪，以避免打印输出中出现留白。\n\n在没有设置缩放模式的情况下，系统默认使用\
  \ `SCALE_MODE_FILL`。例如，以下代码对之前声明的 `PrintHelper` 实例将缩放设置为适应模式：\n\n```kotlin\nimagePrinter.setScaleMode(PrintHelper.SCALE_MODE_FIT)\n\
  ```\n\n同样，也可以配置颜色模式，以指示打印输出是彩色还是黑白。通过向 `setColorMode()` 方法传递以下选项来实现：\n\n- `COLOR_MODE_COLOR`\
  \ – 表示打印输出为彩色。\n- `COLOR_MODE_MONOCHROME` – 表示打印输出为黑白。\n\n除非按如下方式指定选项，否则打印框架将默认进行彩色打印：\n\
  \n```kotlin\nimagePrinter.colorMode = PrintHelper.COLOR_MONOCHROME\n```\n\n完成打印操作仅需要打印的图像，并调用\
  \ `PrintHelper` 实例的 `printBitmap()` 方法，传递一个表示打印任务名称的字符串以及图像的引用（位 对象或 Uri 引用）：\n\n\
  ```kotlin\nval bitmap = BitmapFactory.decodeResource(resources, R.drawable.oceanscene)\n\
  imagePrinter.printBitmap(\"My Print Job\", bitmap)\n```\n\n一旦启动打印任务，打印框架将显示打印对话框，并处理后续的用户交互以及在用户选择的打印目标上的打印。\n\
  \n### 86.7.2 创建并打印 HTML 内容\n\nAndroid 打印框架还提供了一种应用程序内部打印 HTML 内容的简单方法。这些内容可以是网页\
  \ URL 引用的 HTML 内容，也可以是在应用程序内部动态创建的 HTML 内容。\n\n为了启用 HTML 打印，`WebView` 类已经过扩展，以最少的代码需求支持打印。\n\
  \n动态创建 HTML 内容时（与加载和打印现有网页不同），该过程涉及创建一个 `WebView` 对象并与其关联一个 `WebViewClient` 实例。然后配置\
  \ web view client 在 HTML 加载到 WebView 后启动打印任务。在配置了 web view client 后，HTML 将被加载到 `WebView`，从而触发打印过程。\n\
  \n例如，考虑以下代码：\n\n```kotlin\nprivate fun printWebView() {\n    val webView = WebView(this)\n\
  \    webView.webViewClient = object : WebViewClient() {\n        override fun shouldOverrideUrlLoading(view:\
  \ WebView,\n```\n\n\n\n\n```kotlin\nrequest: WebResourceRequest): Boolean {\n  \
  \  return false\n}\n\noverride fun onPageFinished(view: WebView, url: String) {\n\
  \    createWebPrintJob(view)\n    myWebView = null\n}\n}\n}\nval htmlDocument =\
  \ \"<html><body><h1>Android Print Test</h1><p>\" +\n    \"This is some sample content.</p></body></html>\"\
  \nwebView.loadDataWithBaseURL(null, htmlDocument,\n    \"text/HTML\", \"UTF-8\"\
  , null)\nmyWebView = webView\n}\n```\n\n该方法中的代码首先声明了一个名为 `myWebView` 的变量，用于存储在方法中创建的\
  \ `WebView` 实例的引用。在 `printContent()` 方法内部，会创建一个 `WebView` 类的实例，并为其分配一个 `WebViewClient`\
  \ 实例。\n\n分配给 web view 对象的 `WebViewClient` 被配置为指示 HTML 内容的加载将由 `WebView` 实例处理（通过从\
  \ `shouldOverrideUrlLoading()` 方法返回 `false`）。更重要的是，声明并实现了一个 `onPageFinished()` 处理方法，用于调用名为\
  \ `createWebPrintJob()` 的方法。当所有 HTML 内容加载到 web view 时，`onPageFinished()` 回调方法会被调用。这确保了在内容准备绪之前不会启动打印任务，从而确保所有内容都能被打印。\n\
  \n接下来，创建一个包含某些 HTML 的字符串作为内容。然后将其加载到 web view 中。一旦 HTML 加载完成，`onPageFinished()`\
  \ 方法就会被触发。最后，该方法存储了 web view 对象的引用。如果没有这一至关的一步，Java 运行时系统可能会认为应用程序不再需要该 web view\
  \ 对象并将其丢弃以释放内存（在 Java 术语中称为“垃圾回收”），从而导致打印任务在完成之前就终止了。\n\n此示例中剩下的工作是按照如下方式实现 `createWebPrintJob()`\
  \ 方法：\n\n```kotlin\nprivate fun createWebPrintJob(webView: WebView) {\n    val printManager\
  \ = this\n        .getSystemService(Context.PRINT_SERVICE) as PrintManager\n   \
  \ val printAdapter = webView.createPrintDocumentAdapter(\"MyDocument\")\n    val\
  \ jobName = getString(R.string.app_name) + \" Document\"\n    printManager.print(jobName,\
  \ printAdapter,\n        PrintAttributes.Builder().build())\n}\n```\n\n该方法简单地获取\
  \ `PrintManager` 服务的引用，并指令 web view 实例创建一个打印适配器。创建一个新字符串来存储打印任务名称（在此情况下，该名称基于应用程序名称和“Document”一词）。\n\
  \n最后，通过调用打印管理器的 `print()` 方法启动打印任务，传递任务名称、打印适配器和一组默认打印属性。如果需要，可以对打印属性进行自定义，以指定分辨率（每英寸点数）、边距和颜色选项。\n\
  \n### 86.7.3 打印网页\n\n打印网页涉及的步骤与上述概述类似，不同之处在于传递给 web view 的要打印网页的 URL，而不是动态创建的 HTML，例如：\n\
  \n```\nmyWebView?.loadUrl(\"https://developer.android.com/google/index.html\")\n\
  ```\n\n同样重要的是，只有当网页在加载后需要自动打印时，才有必要配置 `WebViewClient`。如果打印是由用户在页面加载后选择菜单选项启动的，则只需要在应用程序代码中包含上述概述的\
  \ `createWebPrintJob()` 方法。下一章名为“Android HTML 和 Web 内容打印示例`，将演示这样一个场景。\n\n### 86.7.4\
  \ 打印自定义文档\n\n虽然打印框架引入的 HTML 和 Web 打印功能为从 Android 应用程序内部打印内容提供了方便的路径，但显然，这些选项对于更高级的打印需求过于简单。对于更复杂的打印任务，打印框架还提供了自定义文档打印支持。这允许将文本和图形形式的内容绘制到画布上然后进行打印。\n\
  \n与可以较容易实现的 HTML 和图像打印不同，自定义文档打印是一个更复杂、多阶段的过程，它将在“Android 文档打印指南`中进行概述。这些步骤可以总结如下：\n\
  \n- 连接到 Android 打印\n- 从 `PrintDocumentAdapter` 类创建自定义打印适配器子类\n- 创建 `PdfDocument`\
  \ 实例来表示页面，每个页面都关联着一个 `Canvas` 实例\n- 在页面上绘制内容\n- 通知打印框架文档已准备好打印\n\n### 86.8 总结\n\n\
  Android SDK 包含了从应用内部打印内容的能力。打印输出可以重定向到配置适当的打印机、本地 PDF 文件或通过 Google Drive 到云端。从 Android\
  \ 应用程序开发者的角度来看，可以通过使用打印框架在应用程序中使用这些功能。到目前，最容易实现的打印选项是涉及图像和 HTML 格式的内容。然而，更高级的打印可以使用自定义打印功能实现。\n\
  \n# Android HTML 和 Web 内容打印示例\n\n在前一章（名为`使用 Android 框架进行打印`）中概述，Android 打印框架可以用于打印网页和动态创建的\
  \ HTML 内容。虽然这两种打印方法之间有很多相似之处，但也存在一些需要考虑的细微差异。本章将通过创建两个示例应用程序，对这两种打印选项提供清晰说明。\n\n\
  ## 87.1 创建 HTML 打印示例\n\n从欢迎屏幕选择“新建 Android Studio 项目”快速启动，并在新项目对话框中选择“Empty Activity”模板，然后点击“Next”按钮。\n\
  \n在 Name 字段输入 `HTMLPrint` 并指定 `com.ebookfrenzy.htmlprint` 为包名。在点击“Finish”按钮之前，将\
  \ Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language 菜单设置为 Kotlin。\n\n\
  \n\n\n\n```kotlin\nimport android.webkit.WebResourceRequest\nimport android.webkit.WebView\n\
  import android.webkit.WebViewClient\nimport android.content.Context\n\nclass MainActivity\
  \ : AppCompatActivity() {\n    private var myWebView: WebView? = null\n\n    override\
  \ fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n\
  \        setContentView(R.layout.activity_html_print)\n        printWebView()\n\
  \    }\n\n    private fun printWebView() {\n        val webView = WebView(this)\n\
  \        webView.webViewClient = object : WebViewClient() {\n            override\
  \ fun shouldOverrideUrlLoading(view: WebView,\n                                \
  \                 request: WebResourceRequest): Boolean {\n                return\
  \ false\n            }\n            override fun onPageFinished(view: WebView, url:\
  \ String) {\n                createWebPrintJob(view)\n                myWebView\
  \ = null\n            }\n        }\n        val htmlDocument = \"<html><body><h1>Android\
  \ Print Test</h1><p>\" +\n                                   \"This is some sample\
  \ content.</p></body></html>\"\n        webView.loadDataWithBaseURL(null, htmlDocument,\n\
  \            \"text/HTML\", \"UTF-8\", null)\n        myWebView = webView\n    }\n\
  }\n```\n\n代码更改首先声明了一个名为 `myWebView` 的变量，其中将存储用于打印操作的 `WebView` 实例引用。在 `onCreate()`\
  \ 方法中，创建了一个 `WebView` 类的实例，并为其分配了一个 `WebViewClient` 实例。\n\n分配给 web view 对象的 `WebViewClient`\
  \ 配置为：HTML 内容的加载由 `WebView` 实例处理（通过从 `shouldOverrideUrlLoading()` 方法返回 `false`）。更重要的是，声明并实现了一个\
  \ `onPageFinished()` 处理程序方法，用于调用名为 `createWebPrintJob()` 的方法。当所有 HTML 内容加载到 web\
  \ view 时，`onPageFinished()` 方法将会被自动调用。正如上一章所述，在打印动态创建的 HTML 内容时，这一步是必要的，以确保在内容完全加载到\
  \ `WebView` 之前不会启动打印任务。\n\n接下来，创建了一个包含某些 HTML 的 `String` 对象作为内容，并将其加载到 web view\
  \ 中。一旦 HTML 加载完成，`onPageFinished()` 回调方法就会触发。最后，该方法将 web view 对象的引用存储在之前声明的 `myWebView`\
  \ 变量中。如果没有这个关键步骤，Java 运行时系统可能会认为应用程序不再需要该 web view 对象并将其丢弃以释放内存，导致打印任务在完成之前终止。\n\
  \n此示例中剩下的就是实现 `createWebPrintJob()` 方法，该方法目前配置为由 `onPageFinished()` 回调方法调用。因此，在\
  \ `MainActivity.kt` 文件中实现该方法，使其如下：\n\n```kotlin\nprivate fun createWebPrintJob(webView:\
  \ WebView) {\n    val printManager = this\n            .getSystemService(Context.PRINT_SERVICE)\
  \ as PrintManager\n    val printAdapter = webView.createPrintDocumentAdapter(\"\
  MyDocument\")\n    val jobName = getString(R.string.app_name) + \" Print Test\"\n\
  \    printManager.print(jobName, printAdapter,\n            PrintAttributes.Builder().build())\n\
  }\n```\n\n此方法获取 `PrintManager` 服务的引用，并指示 web view 实例创建一个打印适配器。创建一个新字符串来存储打印任务名称（在此例中，基于应用程序名称和“Print\
  \ Test”字样）。\n\n最后，通过调用打印管理器的 `print()` 方法启动打印任务，传入任务名称、打印适配器和一组默认打印属性。\n\n在运行 Android\
  \ 5.0 或更高版本的设备或模拟器上编译并运行该应用程序。启动后，将出现标准的 Android 打印页面，如图 87-1 所示。\n\n![](img/Image242510.png)\n\
