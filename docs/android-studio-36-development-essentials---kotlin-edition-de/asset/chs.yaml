  图 33-2\n\n## 33.6 事件监听器和回调方法\n\n用户界面布局完成后，下一步是注册事件监听器和回调方法。\n\n在本示例中，需要为 `myButton`\
  \ 视图注册一个 `onClickListener`。这通过调用按钮视图的 `setOnClickListener()` 方法来实现，传递一个新的 `OnClickListener`\
  \ 对象作为参数，并实现 `onClick()` 回调方法。由于这是一个只需要在活动创建时执行一次的任务，良好的位置是 `MainActivity` 类的 `onCreate()`\
  \ 方法。\n\n\n\n\n如果 `MainActivity.kt` 文件已经在编辑器会话中打开，请通过点击编辑器面板中的标签页来选择它。或者，在项目（Project）工具窗口中通过导航到\
