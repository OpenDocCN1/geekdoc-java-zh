  \n## 33.7 消费事件\n\n在视图上检测标准点击（相对于长按）是事件处理的一个非常简单的情况。现在将扩展该示例以包含对长按事件的检测，长按发生在用户点击并按住屏幕上的视图时，并由此涵盖了事件消费的主题。\n\
  \n考虑本章上一部分中 `onClick` 监听器的代码。分配给监听器的 lambda 代码不返回任何值值，也没有要求这样做。\n\n另一方面，分配给 `onLongClickListener`\
  \ 的代码需要向 Android 框架返回一个 `Boolean` 值。此返回值的目的是指示 Android 运行时回调是否已经消费了该事件。如果回调返回 `true`\
  \ 值，框架将丢弃该事件。相反，如果回调返回 `false` 值，Android 框架将认为该事件仍然有效，并因此将其传递给在同一视图上注册的下一个匹配的事件监听器。\n\
  \n与许多编程概念一样，这可能通过示例演示得最好。第一步是为示例活动中的按钮视图添加长按事件监听器：\n\n```kotlin\noverride fun onCreate(savedInstanceState:\
