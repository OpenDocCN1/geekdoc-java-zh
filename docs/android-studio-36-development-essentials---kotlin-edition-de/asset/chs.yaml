  \ 方法。\n\n\n\n\nAndroid Support Library 包含许多方法，用于在 Android 应用的代码中查找和管理危险权限。无论应用运行在哪个版本的\
  \ Android 系统上，这些 API 调用都是安全的，但只有在运行 Android 6.0 或更高版本的系统上执行时，它们才会执行有意义的任务。\n\n在应用尝试使用需要批准危险权限的功能之前，无论之前是否已授予权限，代码都必须检查该权限是否已授予。这可以通过调用\
  \ `ContextCompat` 类的 `checkSelfPermission()` 方法来实现，并将当前活动引用和请求的权限作为参数传递。该方法将检查权限是否已授予，并返回与\
