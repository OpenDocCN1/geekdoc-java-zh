  \n        android:theme=\"@style/AppTheme\" >\n```\n\n## 59.10 运行应用程序\n\n在配置适当的模拟器或连接的\
  \ Android 设备上编译并运行应用程序。根据显示屏的大小，应用程序将以小屏或双窗格模式显示。无论如何，主列表都应该预先加载内容模型中定义的三个网站的名称。选择一个项目将导致相应的网站出现在详情窗格中，如图\
  \ 59-5 中的双窗格模式所示：\n\n![](img/Image24682.png)\n\n图 59-5\n\n## 59.11 总结\n\n主/详情用户界面由一个项目主列表组成，当选择某项时，会在详情窗格中显示关于该选择的额外信息。主/详情流（Master/Detail\
  \ Flow）是 Android Studio 提供的一个模板，允许快速且相对轻松地创建主/详情布局。正如本章所示，通过对默认模板文件进行细小的修改，就可以极少的代码和设计工作实现广泛基于主/详情的功能。\n\
  \n# 60. Android Intent 概览\n\n到本书的这一阶段，读者应该已经清楚 Android 应用程序是由一个或多个活动（activity）组成的。然而，一个尚未详细介绍的领域是一个活动触发另一个活动启动的机制。正如“Android\
  \ 应用程序剖析”章节简要概述的那样，这主要通过使用 Intent 实现。\n\n在后续章节中通过基于 Android Studio 的 Intent 示例实现之前，本章的目标是以显式\
  \ Intent（explicit intents）和隐式 Intent（implicit intents）的形式提供 Intent 的概览，并介绍意图过滤器过滤器（intent\
  \ filters）。\n\n## 60.1 Intent 概览\n\nIntent（`android.content.Intent`）是一个活动能够启动另一个活动的消息系统。例如，一个活动可以发出一个\
  \ Intent 来请求启动同一应用程序中的另一个活动。然而，Intent 的概念还超出了这一范围，它允许活动请求设备上任何其他已适当注册并配置了权限的活动的服务。例如，考虑应用程序中包含一个需要加载并向用户显示网页的活动。应用程序不需要包含第二个活动来执行此任务，代码可以简单地向\
  \ Android 运行时发送一个 Intent，请求任何注册了显示网页能力的活动的服务。运行时系统会将该请求与设备上的可用活动进行匹配，并启动匹配的活动，或者在存在多个匹配的情况下，允许用户决定使用哪个活动。\n\
  \nIntent 还允许将数据从发送活动传输到接收活动。例如，在之前描述的场景中，发送活动需要将要显示的网页的 URL 发送给第二个活动。同样，接收活动也可以被配置为在完成所需任务后向发送活动返回数据。\n\
  \n虽然在后面的章节中才会介绍，但值得强调的是，除了启动活动外，Intent 还用于启动并与服务（services）以及广播接收器（broadcast receivers）通信。\n\
  \nIntent 分为显或隐式。\n\n## 60.2 显式 Intent\n\n显式 Intent 通过引用目标活动的组件名称（实际上是类名）来请求启动特定的活动。当启动与发送活动位于同一应用程序的活动时，这种方法常见（因为应用程序开发者知道类名）。\n\
  \n显式 Intent 是通过创建 `Intent` 类的实例发出的，传递活动上下文（context）和要启动的活动的组件名称。然后调用 `startActivity()`\
  \ 方法并将 Intent 对象作为参数传递。例如，以下代码段发出了启动类名为 `ActivityB` 活的 Intent：\n\n```kotlin\nval\
  \ i = Intent(this, ActivityB::class.java)\nstartActivity(i)\n```\n\n可以在启动 Intent\
  \ 之前，通过调用 Intent 对象的 `putExtra()` 方法将其添加到 Intent 对象中从而传输到接收活动。数据必须以键值对的形式添加。以下代码扩展了之前的示例，向\
  \ Intent 中分别添加键为 `myString` 和 `myInt` 的字符串和整数值：\n\n```kotlin\nval i = Intent(this,\
  \ ActivityB::class.java)\ni.putExtra(\"myString\", \"This is a message for ActivityB\"\
  )\ni.putExtra(\"myInt\", 100)\nstartActivity(i)\n```\n\n目标活动通过 `Bundle` 对象接收数据，该对象可以通过调用\
  \ `getIntent().getExtras()` 获取。`Activity` 类的 `getIntent()` 方法返回启动该活的 Intent，而 `Intent`\
  \ 类的 `getExtras()` 方法返回包含数据的 `Bundle` 对象。例如，提取传递给 `ActivityB` 的数据：\n\n```kotlin\n\
  val extras = intent.extras ?: return\nval myString = extras.getString(\"myString\"\
  )\nint myInt = extras.getInt(\"MyInt\")\n```在使用 Intent 启动同一应用程序内的其他活动时，在应用程序清单文件中列出这些活动是关重要的。以下\
  \ `AndroidManifest.xml` 内容为包含 `ActivityA` 和 `ActivityB` 的应用程序进行了正确配置：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.intent1.intent1\" >\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:theme=\"@style/AppTheme\" >\n        <activity\n            android:label=\"\
  @string/app_name\"\n            android:name=\"com.ebookfrenzy.intent1.intent1.ActivityA\"\
  \ >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n        <activity\n   \
  \         android:name=\"ActivityB\"\n            android:label=\"ActivityB\" >\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n## 60.3 从活动返回数据\n\n\
  \n\n\n如上一节示例所示，当数据传输到 `ActivityB` 时，没有办法将数据返回给第一个活动（我们将其称为 `ActivityA`）。然而，这可以通过将\
  \ `ActivityB` 启动为 `ActivityA` 的子活动来实现。通过通过调用 `startActivityForResult()` 方法而不是使用\
  \ `startActivity()`，可以启动一个作为子活的活动。除了 intent 对象外，此方法还接收一个请求码（request code）值，该值用于在子活动返回时识别返回的数据。例如：\n\
  \n```\nstartActivityForResult(i, REQUEST_CODE)\n```\n\n为了将数据返回给父活动，子活动必须实现 `finish()`\
  \ 方法，其目的是创建一个包含要返回数据的新 `Intent` 对象，然后调用封装活动的 `setResult()` 方法，传递一个结果代码和一个包含返回数据的\
  \ intent。结果代码通常为 `RESULT_OK` 或 `RESULT_CANCELED`，但也可以根据开发者的需求使用自定义值。如果子活动崩溃，父活动将收到\
  \ `RESULT_CANCELED` 结果代码。\n\n例如，以下代码说明了典型的子活动 `finish()` 方法的实现：\n\n```kotlin\noverride\
  \ fun finish() {\n    val data = Intent()\n    data.putExtra(\"returnString1\",\
  \ \"Message to parent activity\")\n    setResult(RESULT_OK, data)\n    super.finish()\n\
  }\n```\n\n为了获取并提取返回的数据，父活动必须实现 `onActivityResult()` 方法，例如：\n\n```kotlin\noverride\
  \ fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent) {\n    if\
  \ ((requestCode == request_code) &&\n        (resultCode == RESULT_OK)) {\n    \
  \    if (data.hasExtra(\"returnString1\")) {\n            val returnString = data.extras.getString(\"\
  returnString1\")\n        }\n    }\n}\n```\n\n注意，上述方法检查了返回的请求码值，以确保它与传递给 `startActivityForResult()`\
  \ 方法的值匹配。启动多个子活动时，使用请求码来跟踪哪个活动正在返回结果尤为重要，因为所有活动在退出时都会调用同一个 `onActivityResult()`\
  \ 方法。\n\n## 60.4 隐式意 (Implicit Intents)\n\n与显式意引用要启动的活动类名不同，隐式意通过指定要执行的操作（action）和接收活动要处理的数据类型来标识要启动的活动。例如，类型为\
  \ `ACTION_VIEW` 的操作伴以 `URI` 对象形式的网页 URL，将指示 Android 系统搜索并随后启动能够 浏览器的活动。以下隐式意在 Android\
  \ 设备上执行时，将导致指定的网页显示在 Web 活动中：\n\n```kotlin\nval intent = Intent(Intent.ACTION_VIEW,\
  \ Uri.parse(\"http://www.ebookzy.com\"))\nstartActivity(intent)\n```\n\n当由活动发布上述隐式意时，Android\
  \ 系统将通过称为“意图解析”（intent resolution）的过程在设备上搜索能够处理 `http` 方案下 `ACTION_VIEW` 请求的活动。如果找到一个匹配项，将启动该活动。如果找到多个匹配项，将提示用户从可用活动中进行选择。\n\
  \n## 60.5 使用意图过滤器 (Intent Filters)\n\n意图过滤器是活动向 Android 意图过程“宣告”其支持的操作和数据处理能力的机制。继续上一节的示例，一个能够显示网页的活动会在其清单文件中包含一个意图过滤器部分，指示支持对\
  \ `http` 方案数据的 `ACTION_VIEW` 类型意图请求。\n\n需要注意的是，发送活动和接收活动都必须为要执行的操作类型请求权限。这通过在两个活动的清单文件中添加\
  \ `<uses-permission>` 标签来实现。例如，以下清单请求了访问互联网和联系人的权限：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.READ_CONTACTS\" />\n<uses-permission android:name=\"\
  android.permission.INTERNET\"/>\n```\n\n以下 `AndroidManifest.xml` 文件说明了一个名为 `WebViewActivity`\
  \ 的活动的配置，该活动启用了意图过滤器和访问互联网的权限：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrency.WebView\"\n    android:versionCode=\"1\"\n    android:versionName=\"\
  1.0\" >\n    <uses-sdk android:SdkVersion=\"10\" />\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\" >\n        <activity\n            android:label=\"\
  @string/app_name\"\n            android:name=\".MainActivity\" >\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.VIEW\" />\n      \
  \          <category android:name=\"android.intent.category.DEFAULT\" />\n     \
  \           <data android:scheme=\"http\" />\n            </intent-filter>\n   \
  \     </activity>\n    </application>\n</manifest>\n```\n\n## 60.6 检查意图可用性\n\n假设某个活动对于特定意图总是可通常是不明智的，特别是因为缺少匹配的操作通常会导致应用程序崩溃。幸运的是，在向运行时系统发送意图之前，可以识别特定意图对应的可用活动。以下方法可用于识别指定意图操作类型的活动可用性：\n\
  \n```kotlin\nfun isIntentAvailable(context: Context, action: String): Boolean {\n\
  \    val packageManager = context.packageManager\n    val intent = Intent(action)\n\
  \    val list = packageManager.queryIntentActivities(intent,\n        PackageManager.MATCH_DEFAULT_ONLY)\n\
  \    return list.size > 0\n}\n```\n\n## 60.7 总结\n\n意图是一个 Android 活动可以启动另一个活动的消息机制。显式意图通过类类引用接收活动来引用要启动的特定活动。显式意图通常（但不限于）用于启动位于相同应用程序内的活动。隐式意图指定要执行的操作和要处理的数据类型，并让\
  \ Android 运行时找到匹配的活动进行启动。隐式意通常用于启动位于不同应用程序的活动。\n\n\n\n\n在本章创建的 Android Studio 示例项目中将演示如何使用显式意图（explicit\
  \ intent）启动活动，包括在发送活动和接收活动之间传输数据。下一章（Android 隐式意图——实例演示）将演示如何使用隐式意图。\n\n## 61.1\
  \ 创建显式意图示例应用程序\n\n从欢迎界面选择`Start a new Android Studio project`快速启动选项，在弹出的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `ExplicitIntent` 并指定 `com.ebookfrenzy.explicitintent`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`并将`Language`\
  \ 菜单改为 `Kotlin`。\n\n## 61.2 为 MainActivity 设计用户界面布局\n\n`MainActivity` 的用户界面将由一个\
  \ `ConstraintLayout` 视图组成，其中包含 `EditText`（纯文本）、`TextView` 和名为 `editText1`、`textView1`\
  \ 以及 `button1` 的 `Button` 视图。使用 `Project` 工具窗口找到 `MainActivity` 的 `activity_main.xml`\
  \ 资源文件（位于 `app -> res -> layout` 下），并双击将其加载到 `Android Studio Layout Editor` 工具中。选择并删除默认的“Hello\
  \ World!” `TextView`。\n\n从调色板拖入一个 `TextView` 小组件并将其放置在布局的位置，使用 `Attributes` 工具窗口为其分配\
  \ ID `textView1`。\n\n从调色板拖入一个 `Button` 对象并调整其位置，使其水平居中并位于 `TextView` 底部边缘下方。更改 `text`\
  \ 属性使其显示为“Ask Question”，并配置 `onClick` 属性以调用名为 `askQuestion` 的方法。\n\n接下来，添加一个 `Plain\
  \ Text` 对象，使其水平居中并位于 `TextView` 顶部上方。使用 `Attributes` 工具窗口移除分配给 `text` 属性的“Name”字符串，并将\
  \ ID 设置为 `editText1`。布局完成后，点击工具栏上的 `Infer constraints` 按钮以添加相应的约束：\n\n![](img/Image24344.png)\n\
  \n图 61-1\n\n最后，点击 `Layout Editor` 窗口右上角的红色警告按钮，并使用生成的面板将“Ask Question”字符串提取到名为 `ask_question`\
  \ 的资源中。\n\n布局完成后，用户界面应该类似于图 61-2 所示：\n\n![](img/as_3.5_explicit_intent_ui.png)\n\
  \n图 61-2\n\n## 61.3 创建第二个活动类\n\n当用户触碰“Ask Question”按钮时，将发出一个意图，请求启动第二个活动，用户可以在其中输入答案。因此，下一步是创建第二个活动。在\
  \ `Project` 工具窗口中，右键点击 `app -> java` 下的 `com.ebookfrenzy.explicitintent` 包名，选择 `New\
  \ -> Activity -> Empty Activity` 菜单选项，显示如图 61-3](#Explicit_Intents.xhtml__idTextAnchor1114)\
  \ 所示的 `New Android Activity` 对话框：\n\n![](img/as_3.6_explicit_intent_new_activity.png)\n\
  \n图 61-3\n\n在 `Activity Name` 和 `Title` 字段中输入 `ActivityB`，并将布局文件命名为 `activity_b`，将\
  \ `Language` 菜单改为 `Kotlin`。由于此活动在应用程序启动时不会启动（将在点击按钮时通过 `MainActivity` 的意图启动），因此在点击\
  \ `Finish` 按钮之前确保禁用 `Launcher Activity` 选项。\n\n## 61.4 为 ActivityB 设计用户界面布局\n\n\
  第二个活动用户界面所需的元素是 `Plain Text EditText`、`TextView` 和 `Button` 视图。根据这些需求，将 `activity_b.xml`\
  \ 布局加载到 `Layout Editor` 工具并添加视图。\n\n在设计过程中，注意按钮视图上的 `onClick` 属性已配置为调用名为 `answerQuestion`\
  \ 的方法，且 `TextView` 和 `EditText` 视图分别分配了 ID `textView1` 和 `editText1`。完成后，布局应该类似于图\
  \ 61-4 所示。注意按钮上的文本（显示为“Answer Question”）已提取到名为 `answer_question` 的字符串资源中。\n\n布局完成后，点击\
  \ `Infer constraints` 工具栏按钮为布局添加必要的约束：\n\n![](img/as_3.5_explicit_intent_ui_b.png)\n\
  \n图 61-4\n\n## 61.5 检查应用程序清单文件\n\n为了让 `MainActivity` 能够使用意图启动 `ActivityB`，必须在 `AndroidManifest.xml`\
  \ 文件中存在 `ActivityB` 的条目。在 `Project` 工具窗口中找到此文件 (`app -> manifests`），双击将其加载到编辑器中并验证\
  \ Android Studio 已自动添加了该活动的条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.explicitintent\">\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/AppTheme\">\n        <activity android:name=\"\
  .MainActivity\">\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n        <activity android:name=\"\
  .ActivityB\"></activity>\n    </application>\n</manifest>\n```\n\n在创建第二个活动并列在清单文件中后，现在需要在\
  \ `MainActivity` 中编写代码来发出意图。\n\n## 61.6 创建意图\n\n`MainActivity` 的目标是在用户触碰“Question”按钮时创建并启动意图。在创建意图的过程中，用户在\
  \ `EditText` 中输入的字符串将作为键值对添加到意图对象中。当创建 `MainActivity` 用户界面布局时，按钮已配置为在用户点击时调用名为 `askQuestion`\
  \ 的方法。现在需要向 `MainActivity.kt` 源文件添加该方法：\n\n```kotlin\npackage com.ebookfrenzy.explicitintent\n\
  \nimport androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\nimport\
  \ android.view.View\nimport android.content.Intent\nimport kotlinx.android.synthetic.main.activity_main\n\
  \nclass MainActivity : AppCompatActivity() {\n    override fun onCreate(savedInstanceState:\
  \ Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_a)\n\
  \    }\n\n    fun askQuestion(view: View) {\n        val i = Intent(this, ActivityB::class.java)\n\
  \        val myString = editText1.text.toString()\n        i.putExtra(\"qString\"\
  , myString)\n        startActivity(i)\n    }\n}\n```\n\n`askQuestion()` 方法的代码遵循\
  \ Android 意图概述 中概述的技术。\n\n编译并运行应用程序，触碰“Ask Question”按钮启动 `ActivityB`，然后点击返回键（位于显示器底部工具栏）返回\
  \ `MainActivity`。\n\n## 61.7 提取意图数据\n\n\n\n\n\n现在 `ActivityB` 正从 `MainActivity`\
  \ 启动，下一步是提取 `intent` 中包含的 `String` 数据值，并将其赋值给 `ActivityB` 用户界面中的 `TextView` 对象。这涉及到在\
  \ `ActivityB.kt` 源文件的 `onCreate()` 方法中添加一些代码：\n\n```kotlin\npackage com.ebookfrenzy.explicitintent\n\
  \nimport androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\nimport\
  \ android.view.View\nimport android.content.Intent\nimport kotlinx.android.synthetic.main.activity_b.*\n\
  \nclass ActivityB : AppCompatActivity() {\n    override fun onCreate(savedInstanceState:\
  \ Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_b)\n\
  \        val extras = intent.extras ?: return\n        val qString = extras.getString(\"\
  qString\")\n        textView1.text = qString\n    }\n}\n```\n\n在模拟器或物理 Android 设备上编译并运行应用程序。在点击“Ask\
  \ Question”按钮之前，在 `MainActivity` 的文本框中输入一个问题。现在，该问题应该出现在 `ActivityB` 用户界面的 `TextView`\
  \ 组件上。\n\n## 61.8 将 ActivityB 作为子 Activity \n\n为了让 `ActivityB` 能够向 `MainActivity`\
  \ 返回数据，`ActivityB` 必须作为 `MainActivity` 的子活动启动。这意味着 `MainActivity` 中 `askQuestion()`\
  \ 方法的 `startActivity()` 调用需要替换为 `startActivityForResult()` 的调用。与仅接受 `intent` 对象作为参数的\
  \ `startActivity()` 方法不同，`startActivityForResult()` 要求传递一个请求码（request code）。请求码可以是任意数字，用于标识哪个子\
  \ Activity 与哪组返回数据相关。为了本例的演示，将使用请求码 `5`，这让我们得到了一个如下修改后的 `MainActivity` 类：\n\n```kotlin\n\
  package com.ebookfrenzy.explicitintent\n\nimport android.content.Intent\nimport\
  \ androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\nimport android.view.View\n\
  import kotlinx.android.synthetic.main.activity_main.*\n\nclass MainActivity : AppCompatActivity()\
  \ {\n    private val request_code = 5\n    override fun onCreate(savedInstanceState:\
  \ Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_a)\n\
  \    }\n    fun askQuestion(view: View) {\n        val i = Intent(this, ActivityB::class.java)\n\
  \        val myString = editText.text.toString()\n        i.putExtra(\"qString\"\
  , myString)\n        startActivityForResult(i, request_code)\n    }\n}\n```\n\n\
  当子 Activity 退出时，父 Activity 的 `onActivityResult()` 方法会被调用，并作为参数传递与 `intent` 关联的 `request\
  \ code`、表示子 Activity 成功与否的结果码以及一个包含子 Activity 返回的任何数据的 `intent` 对象。留在 `MainActivity`\
  \ 类源文件中，按照如下方式实现此方法：\n\n```kotlin\noverride fun onActivityResult(requestCode: Int,\
  \ resultCode: Int, data: Intent?) {\n    super.onActivityResult(requestCode, resultCode,\
  \ data)\n    if ((requestCode == request_code) && (resultCode == RESULT_OK)) {\n\
  \        data?.let {\n            if (it.hasExtra(\"returnData\")) {\n         \
  \       val returnString = it.extras?.getString(\"returnData\")\n              \
  \  textView1.text = returnString\n            }\n        }\n    }\n}\n```\n\n上述方法中的代码首先检查\
  \ `request code` 是否与发布 `intent` 时使用的请求码匹配，并确保活动执行成功。然后从 `intent` 中提取返回数据并显示在 `TextView`\
  \ 对象上。\n\n## 61.9 从子 Activity 返回数据\n\n`ActivityB` 现在作为 `MainActivity` 的子活动启动，而 `MainActivity`\
  \ 反过来也经过修改以处理来自 `ActivityB` 的返回数据。剩下的工作是修改 `ActivityB.kt` 以实现 `finish()` 方法。\n\n\
  ```kotlin\nfun answerQuestion(view: View) {\n    finish()\n}\n\noverride fun finish()\
  \ {\n    val data = Intent()\n    val returnString = editText1.text.toString()\n\
  \    data.putExtra(\"returnData\", returnString)\n    setResult(RESULT_OK, data)\n\
  \    super.finish()\n}\n```\n\n## 61.10 测试应用程序\n\n编译并运行应用程序，在 `MainActivity` 的文本字段中输入一个问题并点击“Ask\
  \ Question”按钮。当 `ActivityB` 出现时，输入答案并使用返回键或“Submit”按钮返回 `MainActivity`，答案应该出现在文本视图中。\n\
  \n## 61.11 总结\n\n在上一章中涵盖了意图的基础知识后，本章的目标是完成一个应用程序项目的创建，以演示显式意（explicit intents）的使用，以及父活动与子活动之间数据传输的概念。\n\
  \n# 62. Android 隐式意 – 实例演示\n\n在本章中，将创建一个示例来演示隐式意（implicit intents）的实际实现。目标将是创建并发送一个意图，请求加载并显示特定网页的内容。由于示例应用程序本身不包含能够执行此任务的活动，因此将发布一个隐式意，以便触发\
  \ Android 意图解析算法从其他地方识别并启动一个合适的活动。这可能是 Android 操作系统自带的 Chrome 浏览器活动。\n\n在成功启动内置浏览器后，将创建一个包含可以显示网页的的项目。它将被安装到设备或模拟器上，并演示当两个活动符合隐式意标准时会发生什么。\n\
  \n## 62.1 创建 Android 示例项目\n\n在欢迎界面选择 Start a new Android project 快速启动选项，在出现的新项目对话框中选择\
  \ Empty Activity 模板，点击 Next 按钮。\n\n在 Name 字段输入 `ImplicitIntent`，并在 package name\
  \ 中指定 `com.ebookfrenzy.implicitintent`。在点击 Finish 按钮之前，将 Minimum API level 设置为 API\
  \ 26 并将 Language 菜单设置为 Kotlin。\n\n## 62.2 设计用户界面\n\n`MainActivity` 类的用户界面非常简单，仅由一个\
  \ `ConstraintLayout` 和一个 `Button` 对象组成。在 Project 工具窗口中，找到 `app -> res -> layout\
  \ -> activity_main.xml` 文件并双击将其加载到布局编辑器中。\n\n删除默认的 `TextView`，并在 Autoconnect 模式下，放置一个\
  \ `Button` 小部件使其在布局中居中。注意按钮上的文本（“Show Web Page”）已提取到名为 `show_web_page` 的字符串资源。\n\
  \n选中 `Button` 后，使用 Attributes 工具窗口配置 `onClick` 属性以调用名为 `showWebPage()` 的方法。\n\n\n\
  \n\n\n如上所述，隐式意将在一个名为 `showWebPage()` 的方法内部创建并发出，该方法需要在 `MainActivity` 类中实现，而该类位于\
  \ `MainActivity.kt` 源文件中。在 Project 工具窗口中找到该文件并双击它将其加载到编辑窗中。加载后，修改代码添加 `showWebPage()`\
  \ 方法以及若干必要的导入：\n\n```kotlin\npackage com.ebookfrenzy.implicitintent\n\nimport androidx.appcompat.app.AppCompatActivity\n\
  import android.os.Bundle\nimport android.content.Intent\nimport android.view.View\n\
  import android.net.Uri\n\nclass MainActivity : AppCompatActivity() {\n    override\
  \ fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n\
  \        setContentView(R.layout.activity_implicit_intent)\n    }\n    fun showWebPage(view:\
  \ View) {\n        val intent = Intent(Intent.ACTION_VIEW,\n            Uri.parse(\"\
  https://www.ebookfrenzy.com\"))\n        startActivity(intent)\n    }\n}\n```\n\n\
  该方法执行的任务非常简单。首先，创建了一个新的意图对象。然而，代码并没有指定意图的类名，而是使用 `ACTION_VIEW` 选项指示了意图的性质（向用户显示某些内容）。意图对象还包含一个包含要显示的\
  \ URL 的 `URI`。这告诉 Android 意图解析系统，该 Activity 请求显示一个网页。然后通过调用 `startActivity()` 方法发出意图。\n\
  \n在模拟器或物理 Android 设备上编译并运行应用程序，运行后，点击“Show Web Page”（显示网页）按钮。点击后，应该出现一个网络浏览器视图并加载由\
  \ URL 指定的网页。此时，一个成功的隐式意图已经执行完毕。\n\n## 62.4 添加第二个匹配的 Activity\n本章的剩余部分将用于演示：当设备上安装了多个符合隐式意图要求的\
  \ Activity 时会产生什么。为了实现这一点，将在设备或模拟器上创建并安装第二个应用程序。因此，首先在 Android Studio 中创建一个新项目，将应用程序名称设置为\
  \ `MyWebView`，使用与本章之前创建 `ImplicitIntent` 项目时相同的 SDK 配置选项，并再次选择 Empty Activity（空\
  \ Activity）。 \n\n## 62.5 为 UI 添加 Web View\n新 `MyWebView` 项目包含的唯一 Activity 的用户界面将由一个\
  \ Android `WebView` 组件的实例组成。在 Project 工具窗口中，找到 `activity_main.xml` 文件（该文件包含 Activity\
  \ 的用户界面描述），双击它将其加载到 Layout Editor（布局编辑器）工具中。\n\n在设计模式下的 Layout Editor 工具中，选择默认的\
  \ `TextView` 组件并使用键盘删除键将其从布局移除。从调色板的 Widgets（控件）部分拖放 `WebView` 对象到现有的 `ConstraintLayout`\
  \ 视图上，如图：\n\n![](img/as_3.5_implicit_intent_webview_ui.png)\n图 62-2\n\n在继续之前，将 `WebView`\
  \ 实例的 ID 更改为 `webView1`。\n\n## 62.6 获取意图 URL\n当创建用于显示浏览器窗口的隐式意图对象时，要显示的网页 URL 将封装在意图对象中的\
  \ `Uri` 对象中。`MainActivity` 类中 `onCreate()` 方法的任务是从意图对象中提取此 `Uri`，将其转换为 URL 字符串并赋值给\
  \ `WebView` 对象。为了实现此功能，修改 `MainActivity.kt` 文件如下：\n\n```kotlin\npackage com.ebookfrenzy.mywebview\n\
  \nimport androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\nimport\
  \ kotlinx.android.synthetic.main.activity_main.*\nimport java.net.URL\n\nclass MainActivity\
  \ : AppCompatActivity() {\n    override fun onCreate(savedInstanceState: Bundle?)\
  \ {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_my_web_view)\n\
  \        handleIntent()\n    }\n    private fun handleIntent() {\n        val intent\
  \ = this.intent\n        val data = intent.data\n        var url: URL? = null\n\
  \        try {\n            url = URL(data?.scheme,\n                data?.host,\n\
  \                data?.path)\n        } catch (e: Exception) {\n            e.printStackTrace()\n\
  \        }\n        webView1.loadUrl(url?.toString())\n    }\n}\n```\n\n添加到 `onCreate()`\
  \ 的新代码执行了以下操作：\n- 获取导致此 Activity 启动的意图引用\n- 从意图中提取 `Uri` 数据\n- 将 `Uri` 数据转换为 `URL`\
  \ 对象\n- 将 URL 加载到 web view 中，并将 URL 转换为 `String`\n\n`MyWebView` 项目的代码部分现在已完成。剩下的只需修改\
  \ manifest（清单）文件。\n\n## 2.7 修改 MyWebView Manifest 文件\n在测试之前，必须对 `MyWebView` 的 manifest\
  \ 文件进行若干更改。首先，该 Activity 需要请求访问互联网的权限（因为需要加载网页）。这通过在 manifest 中添加相应的行来实现：\n`<uses-permission\
  \ name=\"android.permission.INTERNET\" />`\n\n此外，检查 `MyWebView` 项目的 `AndroidManifest.xml`\
  \ 文件的意图过滤器内容，将发现以下内容：\n```xml\n<intent-filter>\n    <action name=\"android.intent.action.MAIN\"\
  \ />\n    <category name=\"android.intent.category.LAUNCHER\" />\n</intent-filter>\n\
  ```\n在上述 XML 中，`android.intent.action.MAIN` 表示该 Activity 是应用程序在没有数据输入时的入口点。另一方面，`android.intent.category.LAUNCHER`\
  \ 指令表示该 Activity 应出现在设备的应用程序列表中。\n\n由于该 Activity 不需要作为应用程序的入口、在没有数据输入（在此例为 URL）的情况下运行且不需要出现在启动器，因此该\
  \ Activity 的 manifest 文件不需要 `MAIN` 或 `LAUNCHER` 指令。然而，`MainActivity` Activity 的意图过滤器需要修改，以指示它可以处理\
  \ `http` 方案的 `ACTION_VIEW` 意图。\n\nAndroid 要求任何处理隐式意图但不包含 `MAIN` 和 `LAUNCHER` 项的\
  \ Activity 都在意图过滤器中包含所谓的 `browsable` 和 `default` 类别。因此，修改后的意图过滤器如下：\n```xml\n<intent-filter>\n\
  \    <action name=\"android.intent.action.VIEW\" />\n    <category name=\"android.intent.category.BROWSABLE\"\
  \ />\n    <category name=\"android.intent.category.DEFAULT\" />\n    <data scheme=\"\
  http\" />\n</intent-filter>\n```\n\n将这些要求结合起来，得到了完整的 `AndroidManifest.xml` 文件：\n\
  \n\n\n\n\n```xml\n<manifest>\n  <application>\n    <activity>\n      <intent-filter>\n\
  \        <data android:scheme=\"https\" />\n      </intent-filter>\n    </activity>\n\
  \  </application>\n</manifest>\n```\n\n通过双击 Project 工具窗口中的文件名，将 `AndroidManifest.xml`\
  \ 文件加载到清单文件（manifest）编辑器中。加载后，修改 XML 以匹配上述更改。\n\n对 manifest 文件进行适当的修改后，新的 activity\
  \ 就已准备好安装到设备上。\n\n## 62.8 在设备上安装 MyWebView 包\n\n在 `MyWebView` 主 activity 作为隐式意图的接收者之前，必须将其安装到设备上。这通过正常方式运行应用程序来实现。由于\
  \ manifest 文件既不包含 `android.intent.action.MAIN` 也不包含 `android.intent.category.LAUNCHER`\
  \ 设置，因此需要指示 Android Studio 只安装但不启动应用。要配置此行为，从工具栏上选择 `app -> Edit configurations…`\
  \ 菜单，如图 62-3 所示：\n\n![](img/as_3.5_implicit_intent_edit_configuration.png)\n\n图\
  \ 62-3\n\n在 `Run/Debug Configurations` 对话框中，将面板中 `Launch Options` 部分的 `Launch` 选项更改为\
  \ `Nothing`，点击 `Apply` 然后点击 `OK`：\n\n![](img/as_3.5_implicit_intent_launch_nothing.png)\n\
  \n图 62-4\n\n配置此设置后，照常运行应用。请注意应用已安装到设备上，但并未启动。\n\n## 62.9 测试应用程序\n\n为了测试 `MyWebView`，只需重新启动在本章之前创建的\
  \ `ImplicitIntent` 应用程序并点击 `Show Web Page` 按钮。然而，这次意图解析过程将找到两个与隐式意图过滤器匹配的 activity。因此，系统将显示一个对话框（图\
  \ 62-5），为用户提供要启动的 activity 选择。\n\n![](img/as_3.5_implicit_intent_chooser.png)\n\n\
  图 62-5\n\n选择 `MyWebView` 选项并点击 `Just once` 按钮将导致意图由我们新的 `MyWebView` 主 activity 处理，该\
  \ activity 随后将出现并显示指定的网页。\n\n如果网页加载到 `Chrome` 浏览器而没有出现上述选择对话框，可能是 `Chrome` 已被配置为设备上的默认浏览器。可以通过进入设备上的\
  \ `Settings -> Apps & notifications` 然后点击 `App info` 来更改。向下滚动应用列表并选择 `Chrome`。在\
  \ `Chrome` 应用的应用信息屏幕上，点击 `Open by default` 选项，然后点击 `Clear Defaults` 按钮。\n\n## 62.10\
  \ 总结\n\n隐式意图提供了一种机制，一个 activity 可以通过指定操作类型以及（可选的）执行该操作的数据，来请求另一个应用的服务。然而，为了成为隐式意图的目标候选者，activity\
  \ 必须配置为从传入的意图对象中提取适当的数据，并包含在正确配置的 manifest 文件中，包括适当的权限和意图过滤器。当在意图解析搜索期间找到多个匹配隐式意图的\
  \ activity 时，将提示用户选择使用哪一个。\n\n在本章中，创建了一个示例来演示隐式意图的发送，以及能够处理此类意图的示例 activity 的创建。\n\
  \n# 63. Android 广播意图和广播接收器\n\n意图不仅提供了启动应用 activity 的机制，还用于向系统的其他组件广播系统级消息。这涉及广播意图（Broadcast\
  \ Intents）和广播接收器（Broadcast Receivers）的实现，两者都是本章的主题。\n\n## 63.1 广播意图概述\n\n广播意图是通过调用\
  \ `Activity` 类的 `sendBroadcast()`、`sendStickyBroadcast()` 或 `sendOrderedBroadcast()`\
  \ 方法的 `Intent` 对象（后者在需要广播结果时使用）。除了在应用组件之间提供消息传递和事件系统外，Android 系统还使用广播意图来通知感兴趣的应用有关的关键系统事件（例如外部电源或耳机的连接或断开）。\n\
  \n当创建广播意图时，除了可选的数据和类别字符串外，它必须包含一个操作字符串。与标准意图一样，数据是使用意图对象的 `putExtra()` 方法结合键值对添加到广播意图中的。可选的类别字符串可以通过调用\
  \ `addCategory()` 方法分配给广播意图。\n\n用于标识广播事件的操作字符串必须是唯一的，并且通常使用应用程序的包名语法。例如，下面的代码段创建并发送了一个包含唯一操作字符串和数据的广播意图：\n\
  \n```kotlin\nval intent = Intent()\nintent.action = \"com.example.Broadcast\"\n\
  intent.putExtra(\"MyData\", 1000)\nsendBroadcast(intent)\n```\n\n上述代码将在运行 Android\
  \ 3.0 之前的版本的设备上成功启动相应的广播接收器。然而，在较新的 Android 版本上，意图将不会被广播接收器接收。这是因为 Android 3.0 引入了一种启动控制安全措施，防止通过意图启动已停止应用的组件。如果应用程序刚刚安装且之前没有启动过，或者被用户使用应用管理器手动停止，则该应用程序被认为处于停止状态。为了解决这个问题，可以在发送意图之前为其添加一个标记，指示允许意图启动已停止的组件。该标记是\
  \ `FLAG_STOPPED_PACKAGES`，使用如下代码适配所示：\n\n```kotlin\nval intent = Intent()\nintent.action\
  \ = \"com.example.Broadcast\"\nintent.putExtra(\"MyData\", 1000)\nintent.flags =\
  \ Intent.FLAG_STOPPED_PACKAGES\nsendBroadcast(intent)\n```\n\n## 63.2 广播接收器概述\n\n\
  应用程序通过注册广播接收器来监听特定的广播意图。广播接收器通过扩展 `BroadcastReceiver` 类并重写 `onReceive()` 方法来实现。广播接收器可以在代码中（例如在\
  \ activity 中）或 manifest 文件中注册。注册实现的一部分涉及创建意图过滤器以指示接收器需要监听的广播意图。这是通过引用广播意图的操作字符串实现的。当检测到匹配的广播时，会调用广播接收器的\
  \ `onReceive()` 方法，此时该方法有 5 秒的时间完成所有必要的任务。需要注意的是，广播接收器不需要一直运行。在检测到匹配意图的情况下，Android\
  \ 运行时系统会在调用 `onReceive()` 方法之前自动启动广播接收器。\n\n下面的代码概述了一个模板广播接收器子类：\n\n```kotlin\n\
  package com.ebookfrenzy.sendbroadcast\n\nimport android.content.BroadcastReceiver\n\
  import android.content.Context\nimport android.content.Intent\n\nclass MyReceiver\
  \ : BroadcastReceiver() {\n    override fun onReceive(context: Context, intent:\
  \ Intent) {\n        // TODO: 此方法在广播接收器接收意图广播时被调用\n        throw UnsupportedOperationException(\"\
  Not yet implemented\")\n    }\n}\n```\n\n在 manifest 文件中注册广播接收器时，必须为该接收器添加 `<receiver>`\
  \ 条目。\n\n\n\n\n\n以下示例 manifest 文件注册了上述示例广播接收器：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.example.broadcastdetector.broadcastdetector\"\n    android:versionCode=\"\
  1\"\n    android:versionName=\"1.0\" >\n    <uses-sdk android:minSdkVersion=\"17\"\
  \ />\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"\
  @string/app_name\" >\n        <receiver android:name=\"MyReceiver\" >\n        </receiver>\n\
  \    </application>\n</manifest>\n```\n\n在 Android 8.0 之前的版本上运行时，与接收器关联的意过滤器（intent\
  \ filters）可以放在 manifest 文件中的 receiver 元素内，如下所示：\n\n```xml\n<receiver android:name=\"\
  MyReceiver\" >\n    <intent-filter>\n        <action android:name=\"com.example.Broadcast\"\
  \ >\n    </action>\n    </intent-filter>\n</receiver>\n```\n\n在 Android 8.0 或更高版本上，接收器必须使用\
  \ `Activity` 类的 `registerReceiver()` 方法结合适当配置的 `IntentFilter` 对象在代码中进行注册：\n\n```kotlin\n\
  val filter = IntentFilter()\nfilter.addAction(\"com.example.Broadcast\")\nval receiver:\
  \ MyReceiver = MyReceiver()\nregisterReceiver(receiver, filter)\n```\n\n当代码中注册的广播接收器不再需要时，可以通过调用\
  \ activity 类的 `unregisterReceiver()` 方法进行注销，并传递接收器对象的引用作为参数。例如，以下代码将注销上述广播接收器：\n\
  \n```kotlin\nunregisterReceiver(receiver)\n```\n\n请记住，某些系统广播意图只有在广播接收器注册于代码中而非 manifest\
  \ 文件时才能被检测到。请查看 `Intent` 类文档以获取系统广播意图及相应要求的详细概述：\n\n[`developer.android.com/reference/android/content/Intent`](https://developer.android.com/reference/android/content/Intent)\n\
  \n## 63.3 从广播获取结果\n\n当使用 `sendBroadcast()` 方法发送广播意图时，发起的 activity 无法从接收广播的任何广播接收器处获取结果。如果需要返回结果，则必须使用\
  \ `sendOrderedBroadcast()` 方法。当使用此方法发送广播意图时，它将按照顺序传递给每个注册了感兴趣内容的广播接收器。\n\n调用 `sendOrderedBroadcast()`\
  \ 方法时会传入多个参数，包括指向另一个广播接收器的引用（称为结果接收器，result receiver），该接收器将在所有其他广播接收器处理完意图后收到通知，同时还有一组数据引用，这些接收器可以将结果数据存放在其中。当所有广播接收器都获得了处理广播的机会时，结果接收器的\
  \ `onReceive()` 方法将被调用并传入结果数据。\n\n## 63.4 粘性广播意图（Sticky Broadcast Intents）\n\n默认情况下，广播意图在发送并被任何感兴趣的广播接收器处理后就会消失。然而，广播意图可以被定义为“粘性”（sticky）。粘性意图及其包含的数据在完成后仍留存在系统中。可以通过调用\
  \ `registerReceiver()` 方法的返回值（使用通常的参数：广播接收器引用和意过滤器对象）获取存储在粘性广播意图中的数据。许多 Android\
  \ 系统广播都是粘性的，一个典型的例子是与电量状态相关的广播。\n\n粘性广播可以通过调用 `removeStickyBroadcast()` 方法随时移除，并传递要移除的广播意图的引用作为参数。\n\
  \n## 63.5 广播意图示例\n\n本章的剩余部分将详细介绍一个基于 Android Studio 的广播意图运行示例。首先，将创建一个简单的应用程序，用于发送自定义广播意图。随后，将创建一个相应的广播接收器，当检测到广播时，它将在\
  \ Android 设备的屏幕上显示消息。最后，将修改广播接收器以检测系统关于外部电源已从设备断开通知。\n\n## 63.6 创建示例应用程序\n\n从欢迎界面选择“Start\
  \ a new Android Studio project”（启动一个新的 Android Studio 项目）快速启动选项，在生成的新项目对话框中，点击 Next\
  \ 按钮之前选择 Empty Activity 模板。\n\n在 `Name` 字段中输入 `SendBroadcast`，并指定 `com.ebookfrenzy.sendbroadcast`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置更改为 API 26: Android 8.0 (Oreo)，并将 Language\
  \ 菜单设置为 Kotlin。\n\n一旦创建了新项目，在 Project 工具窗口的 `app -> res -> layout` 路径找到并加载 `activity_main.xml`\
  \ 布局文件，并在 Layout Editor 工具的 Design 模式下，将 `TextView` 对象替换为 `Button` 视图，并设置文本属性使其读取“Send\
  \ Broadcast”。一旦设置了文本值，按照通常步骤将字符串提取到命名为 `send_broadcast` 的资源中。\n\n在仍选中按钮的情况下，找到 `onClick`\
  \ 属性并配置其调用一个名为 `broadcastIntent` 的方法。\n\n## 63.7 创建并发送广播意图\n\n创建了 `SendBroadcast`\
  \ 应用程序的框架后，现在是实现发送意图代码了。这涉及实现之前指定的作为 Button 的 `onClick` 目标的 `broadcastIntent()`\
  \ 方法。找到并双击 `MainActivity.kt` 文件并对其进行修改以添加创建和发送意图的代码。修改后，该类的源代码应如下：\n\n```kotlin\n\
  package com.ebookfrenzy.sendbroadcast\n\nimport androidx.appcompat.app.AppCompatActivity\n\
  import android.os.Bundle\nimport android.content.Intent\nimport android.view.View\n\
  \nclass MainActivity : AppCompatActivity() {\n    override fun onCreate(savedInstanceState:\
  \ Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_broadcast)\n\
  \    }\n\n    fun broadcastIntent(view: View) {\n        val intent = Intent()\n\
  \        intent.action = \"com.ebookfrenzy.sendbroadcast\"\n        intent.flags\
  \ = Intent.FLAG_INCLUDE_STOPPED_PACKAGES\n        sendBroadcast(intent)\n    }\n\
  }\n```\n\n注意，在此实例中意图的动作字符串为 `com.ebookfrenzy.sendbroadcast`。在本章节后续创建广播接收器类时，意过滤器必须匹配此动作字符串。\n\
  \n发送广播意图的应用程序创建完成。剩下的就是构建匹配的广播接收器。\n\n## 63.8 创建广播接收器\n\n为了创建广播接收器，需要创建一个子自 `BroadcastReceiver`\
  \ 超类的类。在 Project 工具窗口中，导航到 `app -> java` 并右键点击包。从生成的菜单中选择 New -> Other -> Broadcast\
  \ Receiver，将类命名为 `MyReceiver` 并确保选中 Exported 和 Enabled 。这些设置允许 Android 系统在需要时启动接收器，并确保该类能够接收设备上其他应用程序发送的消息。配置完成后，点击\
  \ Finish。\n\n一旦创建，Android Studio 将自动将新的 `MyReceiver.kt` 类文件加载到编辑器中，其内容如下：\n\n```kotlin\n\
  package com.ebookfrenzy.sendbraodcast\n\nimport android.content.BroadcastReceiver\n\
  import android.content.Context\nimport android.content.Intent\n\nclass MyReceiver\
  \ : BroadcastReceiver() {\n}\n```\n\n\n\n\n```kotlin\noverride fun onReceive(context:\
  \ Context, intent: Intent) {\n    // 当 BroadcastReceiver 接收到 Intent 广播时调用此方法。\n\
  \    TODO(\"MyReceiver.onReceive() is not implemented\")\n}\n```\n\n如所示，Android\
  \ Studio 为新类生成了模板，并为 `onReceive()` 方法生成了存根代码。现在需要对该类进行一些更改以实现所需的行为。因此，在 `MyReceiver.kt`\
  \ 文件中，修改代码使其如下：\n\n```kotlin\npackage com.ebookfrenzy.sendbroadcast\n\nimport android.content.BroadcastReceiver\n\
  import android.content.Context\nimport android.content.Intent\nimport android.widget.Toast\n\
  \nclass MyReceiver : BroadcastReceiver() {\n    override fun onReceive(context:\
  \ Context, intent: Intent) {\n        // 当 BroadcastReceiver 接收到 Intent 广播时调用此方法。\n\
  \        throw UnsupportedOperationException(\"Not implemented\")\n        Toast.makeText(context,\
  \ \"Broadcast Intent.\",\n                     Toast.LENGTH_LONG).show()\n    }\n\
  }\n```\n\n广播接收器的代码已完成。\n\n## 63.9 注册广播接收器\n\n项目需要公示广播接收器的存在，并且必须包含一个意图过滤器来指定接收器感兴趣的广播意图。当上一节创建\
  \ `BroadcastReceiver` 类时，Android Studio 已在清单文件中添加了 `<receiver>` 元素。剩下的是在 `MainActivity.kt`\
  \ 文件中添加代码来创建意图过滤器并注册接收器：\n\n```kotlin\npackage com.ebookfrenzy.sendbroadcast\n\n\
  import androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\nimport\
  \ android.content.Intent\nimport android.view.View\nimport android.content.IntentFilter\n\
  import android.content.BroadcastReceiver\n\nclass MainActivity : AppCompatActivity()\
  \ {\n    var receiver: BroadcastReceiver? = null\n    override fun onCreate(savedInstanceState:\
  \ Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_send_broadcast)\n\
  \        configureReceiver()\n    }\n\n    private fun configureReceiver() {\n \
  \       val filter = IntentFilter()\n        filter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  )\n        receiver = MyReceiver()\n        registerReceiver(receiver, filter)\n\
  \    }\n// ...\n    override fun onDestroy() {\n        super.onDestroy()\n    \
  \    unregisterReceiver(receiver)\n    }\n}\n```\n\n当不再需要广播接收器时，注销它也是重要的：\n\n##\
  \ 63.10 测试示例\n\n为了测试广播发送端和接收端，在设备或 AVD 上运行 `SendBroadcast` 应用并等待其出现。运行后，点击按钮，“Broadcast\
  \ Intent Detected.” 消息将弹出几秒后消失。\n\n## 63.11 监听系统广播\n\n此示例的最后阶段是修改广播接收器的意图过滤器，以监听断开外部电源时广播的系统意。该动作是\
  \ `android.intent.action.ACTION_POWER_DISCONNECTED`。修改 `MainActivity.kt` 文件中的 `onCreate()`\
  \ 方法以添加此过滤器：\n\n```kotlin\nprivate fun configureReceiver() {\n    val filter = IntentFilter()\n\
  \    filter.addAction(\"com.ebookfrenzy.sendbroadcast\")\n    filter.addAction(\"\
  android.intent.action.ACTION_POWER_DISCONNECTED\")\n    receiver = MyReceiver()\n\
  \    registerReceiver(receiver, filter)\n}\n```\n\n由于 `onReceive()` 方法现在将监听两种广播意图，值得修改代码以便当前意图的动作字符串也显示在\
  \ toast 消息中。此字符串可以通过调用传递给 `onReceive()` 方法的 `intent` 对象的 `getAction()` 方法获取：\n\n\
  ```kotlin\noverride fun onReceive(context: Context, intent: Intent) {\n    val message\
  \ = \"Broadcast intent detected \" + intent.action\n    Toast.makeText(context,\
  \ message,\n                 Toast.LENGTH_LONG).show()\n}\n```\n\n通过修改后的动作测试接收器。现在点击按钮会导致以下\
  \ toast 消息：\n`Broadcast intent detected com.ebookfrenzy.sendbroadcast`\n\n接下来，断开设备电源，接收器应报告以下消息：\n\
  `Broadcast intent detected android.intent.action.ACTION_POWER_DISCONNECTED`\n\n\
  ## 63.12 总结\n\n广播意图是 Android 上多个组件使用的机制，通过注册 `Receiver` 来检测广播，接收器反会被配置为监听特定的动作字符串。通常情况下，广播接收器保持休眠状态，直到检测到匹配的意图时被系统唤醒。系统还使用广播意图发布事件通知，例如电量低或设备连接/断开外部电源。除了提供广播意图和接收器的概述外，本章还演示了发送广播意图的示例以及监听自定义和系统广播意图的广播接收器的实现。\n\
  \n# 64. 线程和 AsyncTask 概述\n\n下一章将是系列章节开启，旨在介绍使用 Service 在后台执行应用程序任务。然而，如果不先简单了解 Android\
  \ 应用中的线程概念，是不可能的理解实现 Service 所涉及的步骤。因此，线程和 `AsyncTask` 类是本章的主题。\n\n## 64.1 线程概述\n\
  \n线程是任何多任务操作系统的基石，可以被视为运行在主进程中的微进程，其目的是让应用程序内部至少出现并行执行路径。\n\n## 64.2 应用程序主线程\n\n\
  当 Android 应用首次启动时，运行时系统会创建一个线程，所有应用程序组件默认在该线程中运行。该线程通常被称为主线程。主线程的主要作用是在事件处理和与用户界面中的视图交互方面处理用户界面。在应用程序内启动的任何额外组件默认也会运行在主线程。\n\
  \n应用程序中任何使用主线程执行耗时任务的组件都会导致整个应用程序看起来锁死，直到任务完成。这通常会导致操作系统向用户显示“应用程序未响应”的警告。显然，这远不是任何应用程序所期望的行为。这可以通过简单将要执行的任务启动在单独线程中来避免，让主线程不受干扰地继续处理其他任务。\n\
  \n## 64.3 线程处理器 (Handlers)\n\n\n\n显然，Android 开发的关键规则之一是永远不要在应用程序的主线程上执行耗时操作。第二条同样重要的规则是，在任何情况下，在独立线程中的代码都绝不能直接更新用户界面的任何部分。对用户界面的任何更改都始终在主线程内执行。这是因为\
  \ Android UI 工具包不是线程安全的。在多个线程中尝试处理非线程安全的代码通常会导致间歇性问题和不可预测的应用程序行为。\n\n如果一个耗时任务需要在后台线程中运行并同时更新用户界面，最佳方法是通过子化\
  \ `AsyncTask` 类来实现一个异步任务。\n\n## 64.4 基础 AsyncTask 示例\n\n本章的剩余部分将通过一些简单的示例，旨在为线程的使用和\
  \ `AsyncTask` 类的使用提供基础介绍。第一步将强调在主线程之外的独立线程中执行耗时任务的重要性。\n\n从欢迎界面选择 `Start a new Android\
  \ Studio project`（新建 Android Studio 项目）快速启动选项，在弹出的新项目对话框中，点击 `Next`（下一步）按钮之前选择 `Empty\
  \ Activity`（空活动）模板。\n\n在 `Name`（名称）字段中输入 `AsyncDemo`，并指定 `com.ebookfrenzy.asyncdemo`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 26: Android\
  \ 8.0 (Oreo)`，并将 `Language`（语言）菜单改为 `Kotlin`。\n\n将项目的 `activity_main.xml` 文件加载到\
  \ Layout Editor 工具中。选择默认的 `TextView` 组件，并在 Attributes（属性）工具窗口中将视图的 ID 改为 `myTextView`。\n\
  \n在用户界面上添加一个 `Button` 视图，将其位于现有 `TextView` 对象正下方，如图图 64-1\n\n图 64-1\n\n接下来，加载 `MainActivity.kt`\
  \ 文件到编辑面板，并添加代码实现 `buttonClick()` 方法，该方法将在用户触摸 `Button` 视图时被调用。这里的目标是演示在主线程上执行耗时任务的问题，代码将会在在\
  \ `TextView` 对象上显示不同的文本之前简单暂停 20 秒：\n\n```kotlin\npackage com.ebookfrenzy.asyncdemo\n\
  \nimport androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\nimport\
  \ android.view.View\nimport kotlinx.android.synthetic.main.activity_main.*\n\nclass\
  \ MainActivity : AppCompatActivity() {\n\n    override fun onCreate(savedInstanceState:\
  \ Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_async_demo)\n\
  \    }\n\n    fun buttonClick(view: View) {\n        var i = 0\n        while (i\
  \ <= 20) {\n            try {\n                Thread.sleep(1000)\n            \
  \    i++\n            } catch (e: Exception) {\n            }\n        }\n     \
  \   myTextView.text = \"Button Pressed\"\n    }\n}\n```\n\n代码更改完成后，在物理设备或模拟器上运行应用程序。一旦应用程序运行，触摸\
  \ `Button`，此时应用程序将看起来冻结。例如，将无法第二次触摸按钮，在某些情况下，如图 64-2 所示，操作系统将报告应用程序无响应：\n\n![](img/Image24345.png)\n\
  \n图 64-2\n\n显然，在 `buttonClick()` 方法中任何需要时间完成的事务都必须在独立线程中执行。\n\n## 64.5 子化 AsyncTask\n\
  \n为了创建一个新线程，在 във线程中执行的代码需要在 `AsyncTask` 实例内执行。第一步是在 `MainActivity.kt` 文件中按如下所示子化\
  \ `AsyncTask`：\n\n```kotlin\npackage com.ebookfrenzy.asyncdemo\n\nimport android.os.AsyncTask\n\
  \nclass MainActivity : AppCompatActivity() {\n    private inner class MyTask : AsyncTask<String,\
  \ Void, String>() {\n        override fun onPreExecute() {\n        }\n        override\
  \ fun doInBackground(vararg params: String): String {\n        }\n        override\
  \ fun onProgressUpdate(vararg values: Int?) {\n        }\n        override fun onPostExecute(result:\
  \ String) {\n        }\n    }\n}\n```\n\n`AsyncTask` 类使用了三种类型，在类行中声明如下：\n`private\
  \ inner class MyTask : AsyncTask<Type 1, Type 2, Type 3>()`\n\n这三种类型分别对应于 `doInBackground()`、`onProgressUpdate()`\
  \ 和 `onPostExecute()` 方法的参数类型。如果方法不期望参数，则使用 `Void`，如上述代码中的 `onProgressUpdate()`\
  \ 所示。要更改方法的参数，请同时更改类声明和方法签名中的类型。对于此示例，`onProgressUpdate()` 方法将传递一个 `Integer`，因此按如下修改类声明：\n\
  `private inner class MyTask : AsyncTask<String, Int, String>()`\n\n`override fun\
  \ onProgressUpdate(vararg values: Int?) { }`\n\n`onPreExecute()` 方法在后台任务启动之前调用，可以用于初始化步骤。该方法在主线程上运行，可以更新用户界面。`doInBackground()`\
  \ 方法在与主线程不同的线程中执行，因此无法访问用户界面。然而，每当 `doInBackground()` 方法内部调用 `publishProgress()`\
  \ 方法时，`onProgressUpdate()` 方法就会被调用，并可以在主线程上通过进度信息更新用户界面。`onPostExecute()` 方法在 `doInBackground()`\
  \ 方法中执行的任务完成后被调用。它接收 `doInBackground()` 方法的返回值并在主线程中运行，允许进行用户界面更新。\n\n按如下将 `buttonClick()`\
  \ 方法中的计时代码移动到 `doInBackground()` 方法：\n\n```kotlin\noverride fun doInBackground(vararg\
  \ params: String): String {\n    var i = 0\n    while (i <= 20) {\n        try {\n\
  \            Thread.sleep(1000)\n            i++\n        } catch (e: Exception)\
  \ {\n            return(e.localizedMessage)\n        }\n    }\n    return \"Button\
  \ Pressed\"\n}\n```\n\n接下来，将 `TextView` 更新代码移动到 `onPostExecute()` 方法，它将显示由 `doInBackground()`\
  \ 返回的文本：\n\n```kotlin\noverride fun onPostExecute(result: String) {\n    myTextView.text\
  \ = result\n}\n```\n\n为了通过 `doInBackground()` 方法提供定期更新，修改类以在计时循环代码中添加 `publishProgress()`\
  \ 方法（传递当前的计数器），并在 `onProgressUpdate()` 方法中显示当前计数值：\n\n```kotlin\noverride fun doInBackground(vararg\
  \ params: String): String {\n    var i = 0\n    while (i <= 20) {\n        try {\n\
  \            Thread.sleep(1000)\n            publishProgress(i)\n            i++\n\
  \        } catch (e: Exception) {\n            return(e.localizedMessage)\n    \
  \    }\n    }\n    return \"Button Pressed\"\n}\n\noverride fun onProgressUpdate(vararg\
  \ values: Int?) {\n    super.onProgressUpdate(*values)\n    val counter = values.get(0)\n\
  \    myTextView.text = \"Counter = $counter\"\n}\n```\n\n最后，修改 `buttonClick()` 方法以开始异步任务执行：\n\
  \n```kotlin\nfun buttonClick(view: View) {\n    val task = MyTask().execute()\n\
  }\n```\n\n\n\n\n默认情况下，异步任务是串行执行的。换句话说，如果应用执行了多个任务，只有第一个任务会开始执行。剩余的任务被放置在队列中，并在每个任务完成后按顺序执行。要并行执行异步任务，必须如下使用\
  \ `AsyncTask` 线程池执行器执行这些任务：\n\n```kotlin\nval task = MyTask().executeOnExecutor(AsyncTask.THREAD_POOL_EXECUTOR)\n\
  ```\n\n使用这种方法并行执行的任务数量受设备上核心池大小的限制，而核心池大小又取决于可用的 CPU 核心数。在应用内部可以使用以下代码识别设备上的可用 CPU\
  \ 核心数：\n\n```kotlin\nval cpu_cores = Runtime.getRuntime().availableProcessors()\n\
  ```\n\nAndroid 使用一种算法来计算池线程的默认数量。最小线程数为 2，而最大默认值等于 4 或 CPU 核心数减 1（取两者中较小的一个）。任何设备上线程池可用的最大线程数是通过\
  \ CPU 核心数乘以 2 再加 1 计算得的。\n\n## 64.6 测试应用程序\n\n现在运行应用程序时，点击按钮会导致延迟在一个新的线程中执行，从而主线程继续处理用户界面，包括响应额外的按钮点击。在延迟期间，用户界面将每秒更新一次以显示计数器值。超时完成后，`TextView`\
  \ 将显示“Button Pressed”消息。\n\n### 64.7 取消任务\n\n可以通过调用任务对象的 `cancel()` 方法来取消正在运行的任务，并传递一个布尔值，表示在进行中的任务完成之前是否可以中断任务：\n\
  \n```kotlin\nval task = MyTask().execute()\n\ntask.cancel()\n```\n\n### 64.8 总结\n\
  \n本章概述了 Android 应用中的线程。当应用程序首次在进程中启动时，运行时系统会创建一个主线程，所有随后启动的应用组件默认在该线程中运行。主线程的主要作用是处理用户界面，因此在该线程中执行任何耗时任务都会导致应用假死的假象。因此，将可能需要时间完成的任务在单独线程中启动是关重要的。\n\
  \n由于 Android 用户界面工具包不是线程安全的，因此不应在主线程之外任何线程中更改用户界面。可以通过子类 `AsyncTask` 类并实现类方法来执行任务并更新用户界面，从而在单独线程中执行后台任务。\n\
  \n### 65. Kotlin 协程简介\n\n上一章引入了 Android 线程的概念，并解释了应用的用户界面如何在主线程上运行。为了避免降低或中断用户界面的响应能力，确保耗时任务不阻塞主线程的执行至关重要。如上一章所述，一种方案是将任何此类任务在后台线程中运行，从而让主线程继续管理用户界面。这可以通过直接使用线程句柄（thread\
  \ handlers）或利用 `AsyncTask` 类来实现。\n\n尽管 `AsyncTask` 和线程句柄提供了一种在单独线程上执行任务的方法，但实现它们可能非常耗时，而且在应用项目里阅读和维护相关代码会非常令人困惑。当应用需要大量线程时，这种方法也并非最高效的解决方案。\n\
  \n幸运的是，Kotlin 以协程（Coroutines）的形式提供了一种轻量级的替代方案。在本章中，我们将引入协程的基本概念，包括调度器（dispatchers）、协程作用域（coroutine\
  \ scope）、挂起函数（suspend functions）、协程构建器（coroutine builders）和结构化并发（structured concurrency）。本章还将介绍协程之间基于通道的通信的基本概念。\n\
  \n## 65.1 什么是协程？\n\n协程是异步执行的代码块，且不会阻塞其启动的线程。实现协程时，无需担心构建复杂的 `AsyncTask` 实现或直接管理多个线程。由于其实现方式，协程比使用传统的多线程选项要高效得多，资源消耗也更少。协程还使得代码变得更容易编写、理解和维护，因为它允许按顺序编写代码，而无需编写回调函数来处理线程相关的事件和结果。\n\
  \n尽管协程是 Kotlin 较晚添加的功能，但协程本身并没有新奇或创新。各种形式的协程自 20 世纪 60 年代以来存在于编程语言中，并且基于名为通信顺序进程（Communicating\
  \ Sequential Processes, CSP）的模型。事实上，Kotlin 在后台仍然使用多线程，尽管其执行方式非常高效。\n\n#### 65.2\
  \ 线程 vs 协程\n\n线程的问题在于它们是有限的资源，在 CPU 能力和系统开销方面非常昂贵。在后台，创建、调度和销毁一个线程涉及大量工作。尽管现代 CPU\
  \ 能够运行大量线程，但任何时刻可并行运行的实际线程数量受到 CPU 核心数的限制（尽管较新的 CPU 有 8 个核心，但大多数 Android 设备包含具有\
  \ 4 个核心的 CPU）。当需要的线程多于 CPU 核心数时，系统必须执行线程调度，以决定这些线程的执行如何在可用核心之间共享。\n\n为了避免这些开销，Kotlin\
  \ 并没有为每个协程启动新线程并在协程退出时销毁它，而是维护一个活跃线程池并管理如何将协程分配到这些线程。当一个活跃协程挂起时，它会被 Kotlin 运行时保存，并恢复另一个协程来接替。当协程恢复时，它只需被恢复到池中一个现有的空闲线程中继续执行，直到它完成或被挂起。通过这种方法，可以使用有限的线程高效地执行异步任务，并可能执行大量并发任务，而不会出现标准多线程中固有的性能下降。\n\
  \n#### 65.3 协程作用域\n\n所有协程都必须在一个特定的作用域内运行，以便能够作为一个组而不是单个协程来管理它们。这在取消和清理协程时（例如当 Fragment\
  \ 或 Activity 被销毁时）特别重要，确保协程不会“泄漏”（换句话说，在应用不再需要它们时仍在后台运行）。通过将协程分配给作用域，它们在不再需要时可以被批量取消。\n\
  \nKotlin 提供了了一些内置作用域，以及使用 `CoroutineScope` 类创建自定义作用域的选项。内置作用域总结如下：\n\n- `GlobalScope`：`GlobalScope`\
  \ 用于启动顶层协程，其生命周期与整个应用程序挂钩。由于该作用域中的协程可能在不需要时继续运行（例如当 Activity 退出时），因此不建议在 Android\
  \ 应用中使用此作用域。在 `GlobalScope` 中运行的协程被认为使用了非结构化并发。\n- `ViewModelScope`：专门为在使用 Jetpack\
  \ 架构组件 ViewModel 的 `ViewModel` 实例提供。当相应的 `ViewModel` 实例被销毁时，从该实例在该作用域中启动的协程会被 Kotlin\
  \ 运行时系统自动取消。\n\n\n\n\n对于所有其他需求，通常会使用自定义作用域。例如，下面的代码创建了一个名为 `myCoroutineScope` 的自定义作用域：\n\
  \n```kotlin\nprivate val myCoroutineScope = CoroutineScope(Dispatchers.Main)\n```\n\
  \n`coroutineScope` 定义了用于运行协程的调度器（尽管这可以被覆盖），并且如果要把协程包含在作用域内，则每次启动协程时必须引用它。作用域中所有运行中的协程都可以通过调用该实例的\
  \ `cancel()` 方法来取消：\n\n```kotlin\nmyCoroutineScope.cancel()\n```\n\n## 65.4 挂起函数\
  \ (Suspend Functions)\n\n挂起函数是一种特殊的 Kotlin 函数，它包含协程的代码。它使用 Kotlin 的 `suspend` 关键字声明，该关键字告诉\
  \ Kotlin 该函数可以被挂起并在稍后恢复，从而允许耗时计算在执行时不会阻塞主线程。\n\n以下是一个挂起函数的示例：\n\n```kotlin\nsuspend\
  \ fun mySlowTask() {\n    // 在此处执行耗时任务\n}\n```\n\n## 65.5 协程调度器 (Coroutine Dispatchers)\n\
  \nKotlin 为不同类型的异步活动维护了线程，在启动协程时，需要从以下选项中选择合适的调度器：\n\n* `Dispatchers.Main` – 在主线程上运行协程，适用于需要更改\
  \ UI 的协程，并可作为执行轻量任务的通用选项。\n* `Dispatchers.IO` – 推荐用于执行网络、磁盘或数据库操作的协程。\n* `Dispatchers.Default`\
  \ – 用于 CPU 密集型任务，例如对数据排序或执行复杂的计算。\n\n调度器负责将协程分配给相应的线程，并在协程的生命周期内挂起和恢复协程。除了预定义的调度器外，还可以为您自定义的线程池创建调度器。\n\
  \n## 65.6 协程构建器 (Coroutine Builders)\n\n协程构建器汇集了目前为止的所有组件，并实际启动协程使其开始执行。为此，Kotlin\
  \ 提供了以下六种构建器：\n\n* `launch` – 启动协程且不阻塞当前线程，并且不向调用者返回结果。当在传统函数内部调用挂起函数，且不需要处理协程结果时，请使用此构建器（有时被称为“发后即忘”协程）。\n\
  * `async` – 启动协程并允许调用者使用 `await()` 函数等待结果，而不会阻塞当前线程。当有多个需要并行运行的协程时，请使用 `async`。`async`\
  \ 构建器只能在另一个挂起函数内部使用。\n* `withContext` – 允许协程在与父协程不同的上下文中启动。例如，一个使用 `Main` 上下文运行的协程可以使用此构建器在\
  \ `Default` 上下文中启动子协程。`withContext` 构建器在从协程返回结果时，也提供了 `async` 的有用替代方案。\n* `coroutineScope`\
  \ – `coroutineScope` 构建器非常适用于以下情况：一个挂起函数启动了多个并行运行的协程，并且只有在所有协程完成后才需要执行某些操作。如果这些协程是使用\
  \ `coroutineScope` 构建器启动的，则调用将在所有子协程完成之前不会返回。使用 `coroutineScope` 时，任何一个协程的失败都会导致所有其他协程被取消。\n\
  * `supervisorScope` – 与上述的 `coroutineScope` 类似，不同之处其中一个子协程的失败不会导致其他协程的取消。\n* `runBlocking`\
  \ - 启动协程并阻塞当前线程直到协程完成。这通常与协程所希望的效果完全相反，但对于测试代码以及集成遗留代码和库非常有用。在其他情况下应避免。\n\n## 65.7\
  \ Jobs\n\n每次对如 `launch` 或 `async` 等协程构建器的调用都会返回一个 `Job` 实例，该实例反过来可以用于跟踪和管理相应协程的生命周期。在协程内部的后续构建器调用会创建新的\
  \ `Job` 实例，这些实例将成为直接父级 `Job` 的子级，形成一个父子关系树，其中取消父级 `Job` 会递归地取消所有子级。然而，取消子级不会取消父级，但在使用\
  \ `launch` 构建器创建的子级内部发生未捕获的异常可能会导致父级的取消（使用 `async` 构建器创建的子级则不会如此，因为它会将异常封装在返回给父级的结果中）。\n\
  \n可以通过访问关联 `Job` 对象的 `isActive`、`isCompleted` 和 `isCancelled` 属性来识别协程的状态。除了这些属性外，`Job`\
  \ 实例上还提供了许多方法。例如，可以通过调用 `Job` 对象的 `cancel()` 方法取消 `Job` 及其所有子级，而调用 `cancelChildren()`\
  \ 方法将取消所有子协程。\n\n可以调用 `join()` 方法来挂起与该任务关联的协程，直到其所有子任务完成。要执行此任务并在所有子任务完成后取消该 `Job`，只需调用\
  \ `cancelAndJoin()` 方法即可。\n\n这种分级的 `Job` 结构结合协程作用域共同构成了结构化并发的基础，其目标是确保协程的运行时间不会超过所需时间，而无需手动保留每个协程的引用。\n\
  \n## 65.8 协程 – 挂起与恢复 (Coroutines – Suspending and Resuming)\n\n为了更好地理解协程的挂起，查看协程运行的简单示例会有帮助。首先，假设我们有一个简单的\
  \ Android 应用，包含一个按钮，点击时会调用名为 `startTask()` 的函数。该函数的职责是使用 `Main` 协程调度器调用名为 `performSlowTask()`\
  \ 的挂起函数。代码可能如下：\n\n```kotlin\nprivate val myCoroutineScope = CoroutineScope(Dispatchers.Main)\n\
  \nfun startTask(view: View) {\n    myCoroutineScope.launch(Dispatchers.Main) {\n\
  \        performSlowTask()\n    }\n}\n```\n\n在上面的代码中，在 `launch` 构建器的调用定义并引用了自定义作用域，进而调用了\
  \ `performSlowTask()` 挂起函数。注意，由于 `startTask()` 不是挂起函数，必须使用 `launch` 构建器而不是 `async`\
  \ 构建器。\n\n接下来，我们可以这样声明 `performSlowTask()` 挂起函数：\n\n```kotlin\nsuspend fun performSlowTask()\
  \ {\n    Log.i(TAG, \"performSlowTask before\")\n    delay(5000) // 模拟耗时任务\n   \
  \ Log.i(TAG, \"performSlowTask after\")\n}\n```\n\n按照目前的实现，该函数的作用是在执行 5 秒延迟前后输出诊断信息，模拟一个耗时任务。在\
  \ 5 秒延迟期间，用户界面将继续保持响应，因为主线程没有被阻塞。为了理解为什么，探索幕后发生的情况会有帮助。\n\n\n\n\n当 `delay()` 函数执行完成后，挂起的协程将恢复并恢复到线程池中的一个线程，在那里它可以显示\
  \ Log 消息并返回到 `startTask()` 函数。\n\n在 Android Studio 中处理协程时，代码编辑器中的挂起点（suspend points）如图所示：\n\
  \n![](img/as_3.6_editor_suspend_points.png)\n\n图 65-1\n\n### 65.9 从协程返回结果\n\n上面的示例以协程的形式运行了一个挂起函数，但并没有演示如何返回结果。然而，假假设\
  \ `performSlowTask()` 函数需要返回一个字符串值，该值将通过 `TextView` 对象显示给用户。\n\n为了实现这一点，我们需要重写该挂起函数以返回一个\
  \ `Deferred` 对象。`Deferred` 对象本质上是承诺在未来的某个点提供一个值。通过在 `Deferred` 对象上调用 `await()` 函数，Kotlin\
  \ 运行时将在协程返回值时传递该值。因此，我们 `startTask()` 函数中的代码可能被重写如下：\n\n```kotlin\nfun startTask(view:\
  \ View) {\n    coroutineScope.launch(Dispatchers.Main) {\n        statusText.text\
  \ = performSlowTask().await()\n    }\n}\n```\n\n现在的问题是，我们需要使用 `launch` 构建器来启动协程，因为\
  \ `startTask()` 不是一个挂起函数。正如本章早期概述，只有在使用 `async` 构建器时才可能返回结果。为了解决这个问题，我们必须调整挂起函数使用\
  \ `async` 构建器启动另一个返回 `Deferred` 结果的协程：\n\n```kotlin\nsuspend fun performSlowTask():\
  \ Deferred<String> =\n    coroutineScope.async(Dispatchers.Default) {\n        Log.i(TAG,\
  \ \"performSlowTask before\")\n        delay(5_000)\n        Log.i(TAG, \"performSlowTask\
  \ after\")\n        return@async \"Finished\"\n}\n```\n\n现在当应用运行时，当 `performSlowTask()`\
  \ 协程完成后，“Finished”结果字符串将显示在 `TextView` 对象上。再次，等待结果的过程将在后台进行，而不会阻塞主线程。\n\n### 65.10\
  \ 使用 withContext\n\n正如我们所看到的，协程是在指定的范围内并使用特定的调度器启动的。默认情况下，任何子协程都会继承与父协程相同的相同的调度器。考虑以下代码，用于在挂起函数内部调用多个函数：\n\
  \n```kotlin\nfun startTask(view: View) {\n    coroutineScope.launch(Dispatchers.Main)\
  \ {\n        performTasks()\n    }\n}\n\nsuspend fun performTasks() {\n    performTask1()\n\
  \    performTask2()\n    performTask3()\n}\n\nsuspend fun performTask1() {\n   \
  \ Log.i(TAG, \"Task 1 ${Thread.currentThread().name}\")\n}\n\nsuspend fun performTask2()\
  \ {\n    Log.i(TAG, \"Task 2 ${Thread.currentThread().name}\")\n}\n\nsuspend fun\
  \ performTask3 () {\n    Log.i(TAG, \"Task 3 ${Thread.currentThread().name}\")\n\
  }\n```\n\n由于 `performTasks()` 函数是使用 `Main` 调度器启动的，所有三个函数将默认位于主线程。为了证明这一点，这些函数被编写为输出它们运行的线程名称。执行时，Logcat\
  \ 面将包含以下输出：\n\nTask 1 main\nTask 2 main\nTask 3 main\n\n然而，假设 `performTask2()` 函数执行某些更适合\
  \ `IO` 调度器的网络密集型操作。可以使用 `withContext` 启动器轻松实现这一点，它允许在保持在相同协程范围的同时更改协程的上下文。以下更改将\
  \ `performTask2()` 协程切换到 `IO` 线程：\n\n```kotlin\nsuspend fun performTasks() {\n \
  \   performTask1()\n    withContext(Dispatchers.IO) { performTask2() }\n    performTask3()\n\
  }\n```\n\n执行时，输出将如下所示，表明 Task 2 协程不再主线程上：\n\nTask 1 main\nTask 2 DefaultDispatcher-worker-1\n\
  Task 3 main\n\n`withContext` 构建器还为返回结果时提供了一个使用 `async` 构建器和 `Deferred` 对象 `await()`\
  \ 调用的有趣替代方案。使用 `withContext`，上一节的代码可以重写如下：\n\n```kotlin\nfun startTask(view: View)\
  \ {\n    coroutineScope.launch(Dispatchers.Main) {\n        statusText.text = performSlowTask()\n\
  \    }\n}\n\nsuspend fun performSlowTask(): String =\n    withContext(Dispatchers.Main)\
  \ {\n        Log.i(TAG, \"performSlowTask before\")\n        delay(5_000)\n    \
  \    Log.i(TAG, \"performSlowTask after\")\n        return@withContext \"Finished\"\
  \n    }\n```\n\n### 65.11 Channel 通信\n\nChannel（通道）提供了一种实现协程与流之间通信的简单方法。在最简单的形式，这涉及创建\
  \ `Channel` 实例并调用 `send()` 方法发送数据。一旦发送，传输的数据可以通过同一个 `Channel` 的 `receive()` 方法在另一个协程中接收。\n\
  \n例如，以下代码将整数从一个协程传递到另一个协程：\n\n```kotlin\nimport kotlinx.coroutines.channels.*\n\n\
  val channel = Channel<Int>()\n\nsuspend fun channelDemo() {\n    coroutineScope.launch(Dispatchers.Main)\
  \ {\n        task1()\n    }\n    coroutineScope.launch(Dispatchers.Main) {\n   \
  \     task2()\n    }\n}\n\nsuspend fun task1() {\n    (1..6).forEach {\n       \
  \ channel.send(it)\n    }\n}\n\nsuspend fun task2() {\n    repeat(6) {\n       \
  \ Log.d(TAG, \"Received: ${channel.receive()}\")\n    }\n}\n```\n\n执行时，将生成以下输出：\n\
  \nReceived: 1\nReceived: 2\nReceived: 3\nReceived: 4\nReceived: 5\nReceived: 6\n\
  \n## 65.12 总结\n\nKotlin 协程提供了比多线程更简单更高效的方法来实现异步任务。协程允许以结构化的方式实现异步任务。本章介绍了协程的基本概念，包括任务、范围、构建器、挂起函数、结构化并发和基于通道的通信。\n\
  \n### 66. Kotlin 协程教程\n\n上一章介绍了在 Android 应用中使用协程执行异步任务的关键概念。本章将基于这些知识创建一个可以启动数千个协程的示例应用。\n\
  \n#### 66.1 创建协程示例应用程序\n\n从欢迎屏幕选择 Start a new project 快速启动，并在出现的新项目对话框中选择 Empty\
  \ Activity 模板，然后点击 Next 按钮。\n\n在 Name 字段中输入 CoroutineDemo，并指定 com.ebookzy.coroutinedemo\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language\
  \ 菜单更改为 Kotlin。\n\n#### 66.2 为项目添加协程支持\n\n当前版本的 Android Studio 不会自动为新创建的项目包含协程支持。因此，在继续之前，编辑\
  \ Gradle Scripts -> build.gradle (Module: app) 文件，并在 dependencies 部分添加以下行（注意，一如既往，可能有更新版本的库）：\n\
  \n```gradle\ndependencies {\n    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.2'\n\
  \    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.2'\n}\n\
  ```\n\n进行更改后，点击编辑器顶部的 Sync Now 链接提交更改。\n\n#### 66.3 设计用户界面\n\n用户界面将包含一个用于启动协程的按钮以及一个用于指定每次点击按钮时异步启动多少个协程的\
  \ Seekbar。当协程执行时，TextView 将会在单个协程开始和结束时更新。\n\n\n\n\n首先加载 `activity_main.xml` 布局文件并添加\
  \ `Button`、`TextView` 和 `SeekBar` 对象，使布局外观类似于图 66-1 所示：\n\n![](img/as_3.6_coroutinedemo_ui.png)\n\
  \n图 66-1\n\n要实现上述所示的布局约束，首先使用工具栏按钮清除布局上的所有约束。按住 Shift 并点击四个对象以全部选中它们，右键点击最上方的 `TextView`\
  \ 并选择 `Center -> Horizontally`（居中水平）菜单选项。再次右键点击，这次选择 `Chains -> Create Vertical\
  \ Chain`（链 -> 创建垂直链）选项。\n\n选择 `SeekBar` 将 `layout_width` 属性更改为 `0dp`（`match_constraints`），然后如图\
  \ 66-2 所示，在左右两侧添加 `24dp` 的外边距：\n\n![](img/as_3.6_coroutinedemo_seekbar_margins.png)\n\
  \n图 66-2\n\n修改 `Button` 的 `onClick` 属性以调用名为 `launchCoroutines` 的方法，并将最上方 `TextView`、`SeekBar`\
  \ 和下方的 `TextView` 的 `ids` 分别更改为 `countText`、`seekBar` 和 `statusText`。最后，将 `Button`\
  \ 上的文本改为“Launch Coroutines”，并将其文本提取到字符串资源中。\n\n## 66.4 实现 SeekBar\n\n`SeekBar` 控制每次点击按钮时启动的异步协程数量，范围从\
  \ 1 到 2000 不等。留在 `activity_main.xml` 文件中，选择 `SeekBar` 并使用 `Attributes` 工具窗口将 `max`\
  \ 属性更改为 `2000`。接下来，编辑 `MainActivity.kt` 文件，添加一个变量来存储当前的滑块设置，并修改 `onCreate()` 方法以添加一个\
  \ `SeekBar` 监听器：\n\n```kotlin\nimport android.widget.SeekBar\nimport kotlinx.android.synthetic.main.activity_main.*\n\
  \nclass MainActivity : AppCompatActivity() {\n    private var count: Int = 1\n\n\
  \    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n\
  \        setContentView(R.layout.activity_main)\n        seekBar?.setOnSeekBarChangeListener(object\
  \ :\n            SeekBar.OnSeekBarChangeListener {\n                override fun\
  \ onProgressChanged(seek: SeekBar,\n                                           \
  \   progress: Int, fromUser: Boolean) {\n                    count = progress\n\
  \                    countText.text = \"${count} coroutines\"\n                }\n\
  \                override fun onStartTrackingTouch(seek: SeekBar) {\n          \
  \      }\n                override fun onStopTrackingTouch(seek: SeekBar) {\n  \
  \              }\n            })\n    }\n}\n```\n\n当滑块滑动时，当前值将存储在 `count` 变量中显示在\
  \ `countText` 视图上。\n\n## 66.5 添加挂起函数\n\n当用户点击按钮时，应用需要启动 `SeekBar` 中选择数量的协程。`launchCoroutines()`\
  \ `onClick` 方法将使用协程启动器通过执行 `suspend` 函数来实现这一目标。由于 `suspend` 函数将返回一个状态字符串并显示在 `statusText`\
  \ `TextView` 对象上，因此它需要使用 `async` 构建器来实现。所有这些操作都需要在一个也需要声明的协程作用范围内执行。在 `MainActivity.kt`\
  \ 文件中进行以下更改：\n\n```kotlin\nimport kotlinx.coroutines.*\n\nclass MainActivity : AppCompatActivity()\
  \ {\n    private val coroutineScope = CoroutineScope(Dispatchers.Main)\n\n    suspend\
  \ fun performTask(tasknumber: Int): Deferred<String> =\n        coroutineScope.async(Dispatchers.Main)\
  \ {\n            delay(5_000)\n            return@async \"Finished Coroutine $tasknumber\"\
  \n        }\n}\n```\n\n由于 `suspend` 函数将返回一个状态字符串并显示在 `statusText` `TextView` 对象上，因此它需要使用\
  \ `async` 构建器来实现。所有这些操作都需要在一个也需要声明的协程作用范围内执行。\n\n## 66.6 实现 launchCoroutines 方法\n\
  \n最后一个任务是添加 `launchCoroutines`：\n\n```kotlin\nimport android.view.View\n\nfun launchCoroutines(view:\
  \ View) {\n    (1..count).forEach {\n        coroutineScope.launch(Dispatchers.Main)\
  \ {\n            statusText.text = \"Started Coroutine\"\n            performTask(it).await()\n\
  \            statusText.text = \"Completed Coroutine\"\n        }\n    }\n}\n```\n\
  \n## 66.7 测试应用\n\n在设备或模拟器上构建并运行应用。将 `SeekBar` 设置为一个低数字（例如 10）并点击按钮。大约点击 15 次后，Logcat\
  \ 将开始显示类似下面的消息：\n\nI/Choreographer: Skipped 52 frames! The application may be doing\
  \ too much work on its main thread.\n\n尽管应用仍在运行，但显然运行的协程数量已开始导致主线程过载。只有在执行成数万个协程时才会发生这种情况，这证明了\
  \ Kotlin 协程的效率。将 `SeekBar` 设置为 2000 重复此过程并反复点击按钮直到主线程被阻塞。\n\n## 66.8 总结\n\n在 Kotlin\
  \ 协程简介（此处此处）所涵盖的信息的基础上，本章通过创建一个示例应用介绍了如何在 Android 应用中使用协程。该示例演示了如何使用主调度器启动数千个异步协程，包括返回结果。\n\
  \n\n\n\n默认情况下，服务将在与启动它的应用程序进程相同的主线程中运行（称为本地服务）。因此，至关重要的是，任何 CPU 密集型任务都应该在服务内部的新线程中执行。要让服务在独立的进程中运行（因此被称为远程服务），则需要在清单文件（manifest）中进行配置更改。\n\
  \n除非服务被专门配置为私有（再次通过清单文件中的设置实现），否则该服务可以被同一 Android 设备上的其他组件启动。这是通过使用 `Intent` 机制实现的，其方式与前面的章节所述的一个\
  \ activity 启动另一个 相同。\n\n已启动的服务（Started services）通过调用 `startService()` 方法启动，并传递一个标识要启动服务的\
  \ `Intent` 对象作为参数。当启动的服务完成任务后，它应该通过调用 `stopSelf()` 方法自行停止。或者，运行中的服务可以通过另一个组件通过调用\
  \ `stopService()` 方法来停止，并传递一个与要停止的服务匹配的 `Intent` 作为参数。\n\nAndroid 系统赋予服务极高的优先级，它们通常是释放资源时最后被终止的服务。\n\
  \n## 67.2 Intent Service\n\n如前所述，服务默认在与启动它的组件相同的主线程中运行。因此，服务需要执行的任何 CPU 密集型任务应该在新线程中进行，以避免影响调用应用程序的性能。\n\
  \n`IntentService` 类是一个便利类（继承自 `Service` 类），它设置了一个工作线程（worker thread）来处理后台任务，并以异步方式处理每个请求。一旦服务处理完了所有队列中的请求，它就会直接退出。使用\
  \ `IntentService` 类时，只需要实现 `onHandleIntent()` 方法，并在其中包含为每个请求执行的代码即可。\n\n对于不需要同步处理请求的服务，`IntentService`\
  \ 是推荐的选项。然而，需要同步处理请求的服务将需要继承自 `Service` 类，并手动实现和管理线程，以高效地处理任何 CPU 密集型任务。\n\n## 67.3\
  \ Bound Service\n\n绑定服务（Bound service）类似于启动服务，不同之处在于，启动的服务通常不会返回结果，也不允许与启动它的组件进行交互。相反，绑定服务允许启动组件与服务进行交互并从服务处接收结果。通过实现进程间通信（IPC），这种交互也可以跨进程边界进行。例如，一个\
  \ activity 可能会启动一个服务来处理音频播放。该 activity 很有可能包含一个用户界面，为用户提供控制功能以暂停播放或跳到下一曲目。同样，服务很可能需要向调用它的\
  \ activity 通信信息，指示当前音频轨道已完成，并提供即将开始播放的下一曲目的详情。\n\n组件（在此文中也称为客户端）通过调用 `bindService()`\
  \ 方法启动并绑定到一个绑定服务。此外，多个组件可以同时绑定到一个服务。当客户端不再需要服务绑定关系时，应该调用 `unbindService()` 方法。当最后一个绑定的客户端从服务取消绑定时，Android\
  \ 运行时系统将终止该服务。需要注意的是，绑定服务也可以通过调用 `startService()` 启动。一旦启动，组件就可以通过 `bindService()`\
  \ 调用绑定到它。当通过调用 `startService()` 启动一个绑定服务时，即使在最后一个客户端从它处取消绑定后，它仍将继续运行。\n\n绑定服务必须包含\
  \ `onBind()` 方法的实现，该方法在服务首次创建以及其他客户端随后绑定到运行中的服务时都会被调用。该方法的目的是向绑定的客户端返回一个 `IBinder`\
  \ 类型的对象，该对象包含了客户端与服务通信所需的信息。\n\n在实现客户端与绑定服务之间的通信方面，推荐的技术取决于客户端和服务是否位于相同或不同的进程中，以及该服务是否对客户端是私有的。本地通信可以通过扩展\
  \ `Binder` 类并在 `onBind()` 方法中返回一个实例来实现。另一方面，进程间通信需要 `Messenger` 和 `Handler` 的实现。这两种方法的细节将在后面的章节中介绍。\n\
  \n## 67.4 服务的结构分析\n\n如前提到的，服务必须创建为 Android `Service` 类的子类（具体为 `android.app.Service`）或其子类（如\
  \ `android.app.IntentService`）。在子类化过程中，取决于所创建的服务的具体性质，必须重写以下一个或多个父类回调方法：\n\n- `onStartCommand()`\
  \ – 当另一个组件通过调用 `startService()` 方法启动服务时调用的该方法。绑定服务不需要实现此方法。\n- `onBind()` – 当组件通过调用\
  \ `bindService()` 方法绑定到服务时调用。在实现绑定服务时，此方法必须返回一个 `IBinder` 对象以促进与客户端的通信。对于启动服务，此方法必须实现并返回\
  \ `NULL` 值。\n- `onCreate()` – 旨在执行初始化任务的地方，该方法在调用 `onStartCommand()` 或首次调用 `onBind()`\
  \ 方法之前立即调用。\n- `onDestroy()` – 当服务被销毁时调用。\n- `onHandleIntent()` – 仅适用于 `IntentService`\
  \ 子类。调用此方法来处理服务的逻辑。它在独立于主程序的线程中执行。\n\n注意，`IntentService` 类包含了 `onStartCommand()`\
  \ 和 `onBind()` 回调方法的实现，因此在子类中不需要重新实现它们。\n\n## 67.5 控制销毁服务的重启选项\n\n`onStartCommand()`\
  \ 回调方法要求返回一个整数值，以定义当服务被 Android 运行时系统销毁时发生的情况。这些方法的可能返回值如下：\n\n- `START_NOT_STICKY`\
  \ – 指示系统在服务被销毁时不要重启它，除非有等待交付的意图。\n- `START_STICKY` – 指示如果服务在 `onStartCommand()`\
  \ 方法返回后被销毁，则应尽快重启它。如果没有等待交付的意图，则调用 `onStartCommand()` 回调方法时传入 `NULL` 意图。在服务销毁时正在处理的意图将被丢弃。\n\
  - `START_REDELIVER_INTENT` – 指示如果服务从 `onStartCommand()` 回调方法返回后被销毁，则应重启服务，并将当前意图重新交付给\
  \ `onStartCommand()` 方法，随后再交付任何待处理的意图。\n\n## 67.6 在清单文件中声明服务\n\n为了使服务可用，必须首先在清单文件中声明。这涉及到在现有的\
  \ `<application>` 条目中嵌入一个配置适当的 `<service>` 元素。至少，`<service>` 元素必须包含一个声明服务类名的属性，如下\
  \ XML 片段所示：\n\n```xml\n.\n```\n\n\n\n\n```xml\n<manifest>\n<application\n    android:icon=\"\
  @mipmap/ic_launcher\"\n    android:label=\"@string/app_name\" >\n    <activity\n\
  \        android:label=\"@string/app_name\"\n        android:name=\".MainActivity\"\
  \ >\n        <intent-filter>\n            <action android:name=\"android.intent.action.MAIN\"\
  \ />\n            <category android:name=\"android.intent.category.LAUNCHER\" />\n\
  \        </intent-filter>\n    </activity>\n    <service android:name=\"MyService\"\
  >\n    </service>\n</application>\n</manifest>\n```\n\n默认情况下，服务被声明为公开的，这意味着它们可以被其所在应用程序包之外的组件访问。为了将服务设为私有，必须在清单文件的\
  \ `<service>`元素元素将 `android:exported` 属性声明为 `false`。例如：\n\n```xml\n<service android:name=\"\
  MyService\"\nandroid:exported=\"false\">\n</service>\n```\n\n如前所述的，服务默认在与调用组件相同的进程中运行。为了强制服务在自己的独立进程中运行，请向\
  \ `<service>` 元素添加 `android:process` 属性，并声明一个以冒号（`:`）为缀的进程名称：\n\n```xml\n<service\
  \ android:name=\"MyService\"\nandroid:exported=\"false\"\nandroid:process=\":myprocess\"\
  >\n</service>\n```\n\n冒号前缀表示新进程对于本地应用程序是私有的。然而，如果进程名以小写字母而不是冒号开头，则该进程将是全局的。\n\n\
  最后，通过使用与活动相同的意图过滤器机制，服务还可以向运行设备上的其他应用程序发布功能。有关意图过滤器的更多细节，请参阅“Android Intent 概述”章节。\n\
  \n## 67.7 在系统启动时启动运行的服务\n\n考虑到服务的后台性质，在 Android 系统首次启动时需要启动一个服务并不罕见。这可以通过创建一个广播接收器来实现，并配置其意图过滤器以监听系统\
  \ `android.intent.action.BOOT_COMPLETED` 意图。当检测到此类意图时，广播接收器只需调用必要的服务然后返回。请注意，为了能够运行，此类广播接收器需要请求\
  \ `android.permission.RECEIVE_BOOT_COMPLETED` 权限。\n\n## 67.8 总结\n\nAndroid 服务是一种强大的机制，允许应用程序在后台执行任务。服务一旦启动，无论调用应用程序是否为前台任务，它都会继续运行，即使在启动服务的组件被销毁的情况下也是如此。\n\
  \n服务继承自 `Android Service` 类，并分为启动服务或绑定服务两类。启动服务一直运行直到被停止或销毁，它们本身并不提供一种与其他组件进行交互或数据交换的机制。另一方面，绑定服务为其他客户端组件提供了通信接口，并且通常一直运行直到最后一个客户端从服务解绑为止。\n\
  \n默认情况下，服务在与调用应用程序相同的进程和主线程中本地运行。因此，应该在服务内部创建一个新线程，用于处理 CPU 密集型任务。通过对应用程序清单文件中对应的\
  \ `<service>` 条目进行细小的配置更改，可以在单独的进程中启动远程服务。\n\n`IntentService` 类（本身是 `Android Service`\
  \ 类的子类）提供了一种在单独工作线程中处理异步服务请求的便利机制。\n\n## 68. 实现一个 Android 启动服务 – 实例示例\n\n上一章涵盖了大量关于\
  \ Android 服务的信息，在此时，服务的概念可能看起来有些无从。。为了加强上一章中信息的记忆，本章将通过一个 Android Studio 教程，旨在逐步引入启动服务实现的概念。\n\
  \n在本章中，将创建一个示例应用并将其作为实现 Android 服务的基础。首先，将使用 `IntentService` 类创建服务。此示例随后将进行扩展，以演示\
  \ `Service` 类的用法。最后，将实现在使用 `Service` 类时在单独线程中执行任务的步骤。在本章涵盖了启动服务后，下一章（标题为“Android\
  \ 本地绑定服务 – 实例示例”）将关注绑定服务的实现和客户端与服务之间的通信。\n\n### 68.1 创建示例项目\n\n从欢迎界面选择“启动新的 Android\
  \ Studio 项目”快速启动选项，在出现的新项目对话框中，点击“下一步”（Next）按钮之前选择“空活动”（Empty Activity）模板。\n\n在`Name`字段中输入\
  \ `ServiceExample`，并指定 `com.ebookfrenzy.serviceexample` 为包名。在点击“完成”（Finish）按钮之前，将最低\
  \ API 级别更改为 `26: Android 8.0 (Oreo)`并将语言改为 Kotlin。\n\n### 68.2 创建服务类\n\n在编写任何代码之前，第一步是向项目添加一个新类来包含服务。本教程中演示的第一种服务类型将基于\
  \ `IntentService` 类。正如前一章（“启动和绑定服务概述”）所述，`IntentService` 类的目的是为开发者提供一种便利的机制，用于创建在调用应用程序独立线程中执行任务的服务。\n\
  \n通过右键点击项目窗口中 `app` -> `java` 下的 `com.ebookfrenzy.serviceexample` 包名，并选择 `New` ->\
  \ `Kotlin File/Class` 来向项目添加新类。在弹出的对话框中，将新类命名为 `MyIntentService` 并选择 `Class`。最后，按下键盘回车键创建新类。\n\
  \n查看 Android Studio 编辑器中新的 `MyIntentService.kt` 文件，其内容如下：\n\n```kotlin\npackage\
  \ com.ebookfrenzy.serviceexample\n\nclass MyIntentService {\n\n}\n```\n\n该类需要被修改以继承\
  \ `IntentService` 类。在继承 `IntentService` 类时，必须遵循两个规则：首先，必须实现该类的构造函数，调用父类构造函数并传递类名称。其次，类必须重写\
  \ `onHandleIntent()` 方法。因此，修改 `MyIntentService.kt` 文件中的代码，使其内容如下：\n\n```kotlin\n\
  package com.ebookfrenzy.serviceexample\n\nimport android.app.IntentService\nimport\
  \ android.content.Intent\n\nclass MyIntentService : IntentService(\"MyIntentService\"\
  ) {\n\n    override fun onHandleIntent(arg0: Intent?) {\n\n    }\n}\n```\n\n此时剩下的是在\
  \ `onHandleIntent()` 方法中实现一些代码，以便服务在调用时实际执行操作。通常，这涉及执行需要时间完成的任务，例如下载大文件或播放音频。然而，对于本示例而言，处理程序将向\
  \ Android Studio Logcat 面板输出消息：\n\n```kotlin\npackage com.ebookfrenzy.serviceexample\n\
  \nimport android.app.IntentService\nimport android.content.Intent\nimport android.util.Log\n\
  \nclass MyIntentService : IntentService(\"MyIntentService\") {\n\n    private val\
  \ TAG = \"ServiceExample\"\n\n    override fun onHandleIntent(arg0: Intent?) {\n\
  \        Log.i(TAG, \"Intent Service started\")\n    }\n\n}\n```\n\n### 68.3 将服务添加到清单文件中\n\
  \n\n\n\n\n在调用服务之前，它必须先被添加到所属应用的清单文件（manifest）中。至少，这涉及到添加一个 `<service>` 元素以及服务的类名。\n\
  \n双击当前项目的 `AndroidManifest.xml` 文件（app -> manifests）将其加载到编辑器中，并修改 XML 如下列表所示添加服务元素：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.serviceexample\"\
  >\n    <application\n        android:allowBackup=\"true\"\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/AppTheme\">\n        <activity android:name=\"\
  .MainActivity\">\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n        <service android:name=\"\
  .MyIntentService\" />\n    </application>\n</manifest>\n```\n\n## 68.4 启动服务\n\n\
  现在服务已经实现并在清单文件中声明，下一步是添加代码在应用程序启动时启动该服务。通常情况下，此类代码的理想位置是活动 类的 `onCreate()` 回调方法（在本例中，可以在\
  \ `MainActivity.kt` 文件中找到）。找到并加载此文件到编辑器中，修改 `onCreate()` 方法以添加启动服务的代码：\n\n```kotlin\n\
  package com.ebookfrenzy.serviceexample\n\nimport androidx.appcompat.app.AppCompatActivity\n\
  import android.os.Bundle\nimport android.content.Intent\n\nclass MainActivity :\
  \ AppCompatActivity() {\n    override fun onCreate(savedInstanceState: Bundle?)\
  \ {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_main)\n\
  \        val intent = Intent(this, MyIntentService::class.java)\n        startService(intent)\n\
  \    }\n}\n```\n\n所添加的代码只需创建一个新的 `Intent` 对象，并准备好服务的类名以启动，然后将其作为 `startService()`\
  \ 方法的参数使用。\n\n## 68.5 测试 IntentService 示例\n\n现在基于 `IntentService` 的服务示例已完成并准备好进行测试。由于服务显示的消息将出现在\
  \ Logcat 面板中，因此在 Android Studio 环境中进行配置至关重要。\n\n首先显示 Logcat 工具窗口，然后点击面板右上角的菜单（该目前可能显示为\
  \ \"Show only selected application\"）。从该菜单中，选择 `Edit Filter Configuration`（编辑过滤器配置）选项。\n\
  \n在 `Create New Logcat Filter` 对话框中将过滤器命名为 `ServiceExample`，并在 `by Log Tag` 字段中输入\
  \ `MyIntentService.kt` 中声明的 `TAG` 值（在上面的代码示例中该值为 `ServiceExample`）。\n\n更改完成后，点击\
  \ `OK` 按钮创建过滤器并关闭对话框。Android 工具窗口中现在应该选择了新创建的过滤器。\n\n配置好过滤器后，在物理设备或 AVD 模拟器会话上运行应用程序，注意\
  \ Logcat 面板中出现了“Intent Service Started”消息。请注意，应用程序启动后可能需要将过滤器菜单设置改回 `ServiceExample`：\n\
  \n```\n06-29 09:05:16.887 3389-3948/com.ebookfrenzy.serviceexample I/ServiceExample:\
  \ Intent Service started\n```\n\n如果服务被分配了长期任务，该服务将在独立的线程中后台继续运行，直到任务完成，允许应用程序继续运行并响应用户响应。由于我们所有的服务只是记录了一条消息，它在完成后将简单地停止运行。\n\
  \n## 68.6 使用 Service 类\n\n虽然 `IntentService` 类允许用最少的代码实现服务，但在某些情况下，需要 `Service`\
  \ 类的灵性和同步特性。正如本章将证明的，这涉及额外的工作。\n\n## 68.7 创建新服务\n\n出于本示例的目的，将向项目添加一个新类。在 `app` ->\
  \ `java` 下的包名上点击右键，选择 `New` -> `Service`。创建一个名为 `MyService` 的类并勾选 `Exported` 选项。\n\
  \n```kotlin\npackage com.ebookfrenzy.serviceexample\n\nimport android.app.Service\n\
  import android.content.Intent\nimport android.os.IBinder\nimport android.util.Log\n\
  \nclass MyService : Service() {\n    private val TAG = \"ServiceExample\"\n\n  \
  \  override fun onCreate() {\n        Log.i(TAG, \"onCreate\")\n    }\n\n    override\
  \ fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {\n       \
  \ Log.i(TAG, \"onStartCommand \" + startId)\n        var i: Int = 0\n        while\
  \ (i <= 3) {\n            try {\n                Thread.sleep(10000)\n         \
  \       i++\n            } catch (e: Exception) {\n            }\n            Log.i(TAG,\
  \ \"Service running\")\n        }\n        return START_STICKY\n    }\n\n    override\
  \ fun onBind(intent: Intent?): IBinder {\n        Log.i(TAG, \"onBind\")\n     \
  \   TODO(\"not implemented\")\n    }\n\n    override fun onDestroy() {\n       \
  \ Log.i(TAG, \"onDestroy\")\n    }\n}\n```\n\n服务实现后，将 `AndroidManifest.xml` 文件加载到编辑器中，验证\
  \ Android Studio 是否已为新服务添加了相应的条目，内容如下：\n\n```xml\n<service android:name=\".MyService\"\
  \n    android:enabled=\"true\"\n    android:exported=\"true\" >\n```\n\n## 68.8\
  \ 修改用户界面\n\n正如运行应用程序时将所示，未能为服务创建新线程来执行任务会导致严重的可用性问题。为了充分理解此问题的严重性，需要在 `MainActivity`\
  \ 的用户界面添加一个 `Button` 视图，并配置其在用户“点击”时调用方法。\n\n在 Project 工具窗口中找到并加载 `activity_main.xml`\
  \ 文件（app -> res -> layout -> activity_main.xml）。删除 `TextView` 并向布局添加一个 `Button`\
  \ 视图。选择新按钮，将文本更改为“Start Service”，并将其提取为名为 `start_service` 的资源。\n\n在选中新按钮的情况下，在 Attributes\
  \ 面板中找到 `onClick` 属性，并为其分配一个名为 `buttonClick` 的方法。\n\n接下来，编辑 `MainActivity.kt` 文件以添加\
  \ `buttonClick()` 方法，并删除 `onCreate()` 方法中之前添加的启动 `MyIntentService` 服务的代码。\n\n\n\n\
  \n\n```kotlin\nimport android.os.Bundle\n\nimport android.content.Intent\n\nimport\
  \ android.view.View\n\nclass MainActivity : AppCompatActivity() {\n\n    override\
  \ fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n\
  \        setContentView(R.layout.activity_main)\n        val intent = Intent(this,\
  \ MyIntentService::class.java)\n        startService(intent)\n    }\n    fun buttonClick(view:\
  \ View)\n    {\n        intent = Intent(this, MyService::class.java)\n        startService(intent)\n\
  \    }\n}\n```\n\n`buttonClick()` 方法所做的只是为新服务创建一个 intent 对象并启动它。\n\n# 68.9 运行应用程序\n\
  \n运行应用程序，加载完成后，点击 Start Service（启动服务）按钮。在 Logcat 工具窗口中（使用之前创建的 `ServiceExample`\
  \ 过滤器），日志消息将会出现，指示 `onCreate()` 方法已被调用，且 `onStartCommand()` 方法中的循环正在执行。\n\n在最后一条循环消息出现之前，尝试第二次点击\
  \ Start Service 按钮。注意此时该按钮没有响应。大约 20 秒后，系统可能会显示一个包含“ServiceExample isn’t responding”（ServiceExample\
  \ 未响应）消息的警告对话框。这是因为应用程序的主线程在执行循环任务时被服务阻塞了。这不仅阻止了应用程序响应用户，也阻止了响应系统，系统最终会认为应用程序由于某种原因锁定了。\n\
  \n显然，需要修改服务的代码，以便在主线程的单独线程中执行任务。\n\n# 68.10 使用协程处理服务任务\n\n正如“线程和 AsyncTask 基础概述”中所述，当\
  \ Android 应用程序首次启动时，运行时系统会创建一个单线程，所有应用程序组件默认都会在该线程中运行。该线程通常被称为主线程。主线程的主要作用是处理用户界面，包括事件处理以及与用户界面视图的交互。在应用程序内启动的任何额外组件默认也会运行在主线程上。\n\
  \n解决此问题的非常非常的方案是在 Kotlin 协程（Coroutine）中执行服务任务。首先，编辑 Gradle Scripts -> `build.gradle`\
  \ (Module: app) 文件，在 dependencies 部分添加以下行：\n\n```gradle\ndependencies {\n    .\n\
  \    .\n    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.2'\n\
  \    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.2'\n \
  \   .\n    .\n}\n```\n\n完成更改后，点击编辑器面板顶部的 Sync Now（立即同步）链接以提交更改。\n\n接下来，修改 `MyService.kt`\
  \ 文件如下：\n\n```kotlin\n.\n.\nimport kotlinx.coroutines.*\nclass MyService : Service()\
  \ {\n    private val coroutineScope = CoroutineScope(Dispatchers.Default)\n.\n.\n\
  ```\n\n声明作用后，将循环代码从 `onStartCommand()` 函数中提取出来并放入 `suspend` 函数中（注意，sleep 调用被替换为\
  \ `delay()` 挂起函数的调用）：\n\n```kotlin\noverride fun onStartCommand(intent: Intent?,\
  \ flags: Int, startId: Int): Int {\n    Log.i(TAG, \"Service onStartCommand \" +\
  \ startId)\n    var i: Int = 0\n    while (i <= 3) {\n        try {\n          \
  \  Thread.sleep(10000)\n            i++\n        } catch (e: Exception) {\n    \
  \    }\n        Log.i(TAG, \"Service running\")\n    }\n    return Service.START_STICKY\n\
  }\n\nsuspend fun performTask(startId: Int) {\n    Log.i(TAG, \"Service onStartCommand\
  \ \" + startId)\n    var i: Int = 0\n    while (i <= 3) {\n        try {\n     \
  \       delay(10_000)\n            i++\n        } catch (e: Exception) {\n     \
  \   }\n        Log.i(TAG, \"Service running\")\n    }\n}\n```\n\n\n\n在本章剩余部分中创建的示例应用程序将由一个\
  \ activity 和一个绑定服务组成。该绑定服务的目的是从系统获取当前时间，并将该信息返回给 activity，以便在 activity 中显示给用户。该绑定服务将是本地的，并且仅与\
  \ activity 相同的应用程序可见。\n\n从欢迎界面选择 `Start a new Android Studio project`（启动新的 Android\
  \ Studio 项目）快速选项，并在弹出的新项目对话框中点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入\
  \ `LocalBound`，并指定 `com.ebookfrenzy.localbound` 为包名。在点击 `Finish` 按钮之前，将 `Minimum\
  \ API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单更改为 `Kotlin`。\n\n\
  项目创建完成后，下一步是添加一个新类作为绑定服务。\n\n## 69.4 向项目添加绑定服务\n\n要向项目添加新类，请在 Project 工具窗口中，右键点击包名（位于\
  \ `app -> java -> com.ebookfrenzy.localbound` 下），并选择 `New -> Service -> Service`\
  \ 菜单选项。指定 `BoundService` 为类名，并在点击 `Finish` 创建类之前，确保勾选了 `Exported` 和 `Enabled` 选项。默认情况下，Android\
  \ Studio 将将 `BoundService.kt` 文件加载到编辑器中，其内容如下：\n\n```kotlin\npackage com.ebookfrenzy.localbound\n\
  \nimport android.app.Service\nimport android.content.Intent\nimport android.os.IBinder\n\
  \nclass BoundService : Service() {\n    override fun onBind(intent: Intent): IBinder\
  \ {\n        TODO(\"Return the communication channel to the service.\")\n    }\n\
  }\n```\n\n## 69.5 实现 Binder\n\n如前所述，本地绑定服务可以通过向客户端传递适当配置的 `Binder` 对象来与绑定客户端进行通信。这是通过在绑定服务类中创建一个\
  \ `Binder` 子类，并通过添加一个或多个客户端可以调用的新方法来扩展它的。在大多数情况下，这只需实现一个返回绑定服务实例引用的方法。有了该实例的引用，客户端就可以直接访问数据并调用绑定服务中的方法。\n\
  \n因此，出于本示例的目的，需要对上一节创建的模板类 `BoundService` 进行一些更改。首先，需要声明一个 `Binder` 子类。该类将包含一个名为\
  \ `getService()` 的方法，该方法只需返回当前服务对象实例的引用（由 `this` 关键字表示）。考虑到这些要求，编辑 `BoundService.kt`\
  \ 文件并进行如下修改：\n\n```kotlin\npackage com.ebookfrenzy.localbound\n\nimport android.app.Service\n\
  import android.content.Intent\nimport android.os.IBinder\nimport android.os.Binder\n\
  \nclass BoundService : Service() {\n    private val myBinder = MyLocalBinder()\n\
  \n    override fun onBind(intent: Intent): IBinder {\n        TODO(\"Return the\
  \ communication channel to the service.\")\n    }\n\n    inner class MyLocalBinder\
  \ : Binder() {\n        fun getService() : BoundService {\n            return this@BoundService\n\
  \        }\n    }\n}\n```\n\n对类进行修改后，值得花时间回顾一下这里执行的步骤。首先，声明了一个 `Binder` 的新子类（命名为\
  \ `MyLocalBinder`）。该类包含一个方法，唯一目的是返回 `BoundService` 类当前实例的引用。创建了 `MyLocalBinder`\
  \ 类的新实例并将其赋值给 `myBinder` `IBinder` 引用（由于 `Binder` 是 `IBinder` 的子类，因此此类赋值不存在类型不）。\n\
  \n接下来，需要修改 `onBind()` 方法以返回 `myBinder` 对象的引用，并实现一个新的公共方法，以便在被任何绑定到服务的客户端调用时返回当前时间：\n\
  \n```kotlin\npackage com.ebookfrenzy.localbound\n\nimport android.app.Service\n\
  import android.content.Intent\nimport android.os.Binder\nimport android.os.IBinder\n\
  import java.text.SimpleDateFormat\nimport java.util.*\n\nclass BoundService : Service()\
  \ {\n    private val myBinder = MyLocalBinder()\n\n    override fun onBind(intent:\
  \ Intent): IBinder? {\n        return myBinder\n    }\n\n    fun getCurrentTime():\
  \ String {\n        val dateformat = SimpleDateFormat(\"HH:mm:ss MM/dd/yyyy\", Locale.US)\n\
  \        return dateformat.format(Date())\n    }\n\n    inner class MyLocalBinder\
  \ : Binder() {\n        fun getService() : BoundService {\n            return this@BoundService\n\
  \        }\n    }\n}\n```\n\n到此时，绑定服务已完成，准备好添加到项目清单文件中。在工具窗口中找到并双击 `LocalBound`\
  \ 项目的 `AndroidManifest.xml` 文件，一旦加载到 Manifest 编辑器中，验证 Android Studio 是否已按如下所示为服务了\
  \ `<service>` 条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.localbound\"\
  >\n    <application\n        android:allowBackup=\"true\"\n        android:icon=\"\
  @mipmap/launcher\"\n        android:label=\"@app_name\"\n        android:theme=\"\
  @style/AppTheme\" >\n        <service\n            android:name=\".BoundService\"\
  \n            android:enabled=\"true\"\n            android:exported=\"true\" >\n\
  \        <activity\n            android:name=\".MainActivity\" >\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.MAIN\" />\n      \
  \          <category android:name=\"android.intent.category.LAUNCHER\" />\n    \
  \        </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n下一个阶段是在 activity 中实现必要的代码以绑定到服务并调用 `getCurrentTime()` 方法。\n\n## 69.6 将客户端绑定到服务\n\
  \n出于本教程的目的，客户端是运行中的 `MainActivity` 实例。如之前所述，为了成功绑定到服务并接收 `onBind()` 方法返回的 `IBinder`\
  \ 对象，有必要创建一个 `ServiceConnection` 子类并实现 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 回调方法。编辑 `MainActivity.kt` 文件并进行如下修改：\n\n```kotlin\npackage com.ebookfrenzy.localbound\n\
  \nimport androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\nimport\
  \ android.content.ComponentName\nimport android.content.Context\nimport android.content.ServiceConnection\n\
  import android.os.IBinder\nimport android.content.Intent\n\nclass MainActivity :\
  \ AppCompatActivity() {\n    var myService: BoundService? = null\n    var isBound\
  \ = false\n\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n\
  \        setContentView(R.layout.activity_local_bound)\n    }\n\n    private val\
  \ myConnection = object : ServiceConnection {\n        override fun onServiceConnected(className:\
  \ ComponentName, service: IBinder) {\n            val binder = service as BoundService.MyLocalBinder\n\
  \            myService = binder.getService()\n            isBound = true\n     \
  \   }\n        override fun onServiceDisconnected(name: ComponentName) {\n     \
  \       isBound = false\n        }\n    }\n}\n```\n\n当客户端成功绑定到服务时，将调用 `onServiceConnected()`\
  \ 方法。该方法作为参数接收服务的 `onBind()` 方法返回的 `IBinder` 对象。该参数被转换为 `MyLocalBinder` 类型的对象，然后调用\
  \ binder 对象的 `getService()` 方法以获取服务实例的引用，随后将其赋值给 `myService`。使用一个布尔标志来指示连接已建立。\n\
  \n\n\n\n`onServiceDisconnected()` 方法在连接结束时被调用，它简单地将 `Boolean` 标志设置为 false。\n\n建立连接后，下一步是修改活动以绑定到该服务。这涉及创建一个\
  \ `intent` 并调用 `bindService()` 方法，这些操作可以在传入的 `onCreate()` 方法中执行：\n\n```kotlin\n\
  override fun onCreate(savedInstanceState: Bundle?) {\n    super.onCreate(savedInstanceState)\n\
  \    setContentView(R.layout.activity_main)\n    val intent = Intent(this, BoundService::class.java)\n\
  \    bindService(intent, myConnection, Context.BIND_AUTO_CREATE)\n}\n```\n\n## 69.7\
  \ 完成示例\n\n剩下的工作就是实现一种调用 `getCurrentTime()` 方法并并将结果显示给用户的机制。按照惯例，Android Studio 已经为该活动创建了一个\
  \ `activity_main.xml` 模板文件，其中只包含一个 `TextView`。将此文件加载到布局编辑器（Layout Editor）工具中，并在设计模式下选择\
  \ `TextView` 组件并将 ID 更改为 `myTextView`。在 `TextView` 下方添加一个 `Button` 视图，并将按钮上的文本更改为“Show\
  \ Time”，将文本提取到名为 `show_time` 的字符串资源。完成这些更改后，布局应该类似于图 69-1 所示所示。如果缺少任何约束，点击布局编辑器工具栏上的“Infer\
  \ Constraints”（推约束）按钮。\n\n![](img/as_3.5_localbound_ui.png)\n\n图 69-1\n\n通过选择 `Button`\
  \ 并配置 `onClick` 属性调用名为 `showTime` 的方法来完成用户界面设计。\n\n最后，编辑 `MainActivity.kt` 文件中的代码以实现\
  \ `showTime()` 方法。该方法简单地调用服务的 `getCurrentTime()` 方法（得益于 `onServiceConnected()` 方法，现在可以通过\
  \ `myService` 引用从活动内部访问并将并将字符串赋值给 `TextView`：\n\n```kotlin\npackage com.ebookfrenzy.localbound\n\
  \nimport android.content.ComponentName\nimport android.content.Context\nimport android.content.ServiceConnection\n\
  import androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\nimport\
  \ android.os.IBinder\nimport android.content.Intent\nimport android.view.View\n\
  import kotlinx.android.synthetic.main.activity_main.*\n\nclass MainActivity : AppCompatActivity()\
  \ {\n    var myService: BoundService? = null\n    var isBound = false\n    fun showTime(view:\
  \ View) {\n        val currentTime = myService?.getCurrentTime()\n        myTextView.text\
  \ = currentTime\n    }\n}\n```\n\n## 69.8 测试应用程序\n\n代码更改完成后，对应用程序进行测试运行。一旦可见，触摸按钮并注意文本视图将更改为显示当前日期和时间。该示例已成功启动并绑定到一个服务，然后调用了该服务的方法以执行任务并将结果返回给活动。\n\
  \n## 69.9 总结\n\n当绑定服务是本地的且对某个应用程序私有时，该应用程序内的组件就可以与服务进行交互，而无需诉助于进程间通信（IPC）。通常情况下，服务的\
  \ `onBind()` 方法返回一个 `IBinder` 对象，该对象包含对运行服务实例的引用。客户端组件实现 `ServiceConnection` 子类，该子类包含回调方法，这些方法在服务连接和断开连接时被调用。前一个方法接收由\
  \ `onBind()` 方法返回的 `IBinder` 对象，从而允许调用服务内的公共方法。\n\n在涵盖了本地绑定服务的实现后，下一章将重点介绍使用 IPC\
  \ 与远程绑定服务进行交互。\n\n## 70. Android 远程绑定服务 - 实例详解\n\n在这一关于 Android 服务的最后一章节中，将开发一个示例应用程序，以演示使用\
  \ `messenger` 和 `handler` 配置来促进客户端与远程绑定服务之间的交互。\n\n### 70.1 客户端到远程服务的通信\n\n正如上一章所述，客户端与本地服务之间的交互可以通过向客户端返回一个包含对服务对象引用的\
  \ `IBinder` 对象来实现。然而，对于远程服务，这种方法行不通，因为远程服务运行在不同的进程中，因此无法从客户端直接访问。\n\n在远程服务的情况下，必须创建一个\
  \ `Messenger` 和 `Handler` 配置，以允许消息在客户端和服务端之间跨越进程边界进行传递。\n\n具体而言，服务会创建一个 `Handler`\
  \ 实例，当接收到来自客户端的消息时将调用它。在初始化方面，`Handler` 的工作是创建一个 `Messenger` 对象，该对象反过来又创建一个 `IBinder`\
  \ 对象，并在 `onBind()` 方法中返回给客户端。客户端使用此 `IBinder` 对象创建 `Messenger` 对象的实例，随后将消息发送给服务处理器。客户端每发送一次消息，处理器的\
  \ `handleMessage()` 方法就会被调用一次，并传递 `message` 对象。\n\n在本章创建的简单示例将包含一个运行在单独进程中的活动和一个绑定服务。将使用\
  \ `Messenger/Handler` 机制向服务发送一个字符串，然后服务将在 `Toast` 消息中显示该字符串。\n\n### 70.2 创建示例应用程序\n\
  \n从欢迎界面选择“Start a new Android Studio project”快速启动选项，在生成的新项目对话框中，点击 Next 按钮之前选择 `Empty\
  \ Activity` 模板。\n\n在 `Name` 字段中输入 `RemoteBound` 并指定 `com.ebookfrenzy.remotebound`\
  \ 为包名。在点击 Finish 按钮之前，将 `Minimum API level` 设置为 `26: Android 8.0 (Oreo)`并将 `Language`\
  \ 菜单设置为 `Kotlin`。\n\n## 70.3 设计用户界面\n\n在项目窗口中找到 `activity_main.xml` 文件并双击它将其加载到布局编辑器中。在设计模式下的布局编辑器中，右键点击默认的\
  \ `TextView` 实例，选择 `Convert view...` 选项，从对话框中选择 `Button` 视图并点击 Apply。将按钮的文本属性更改为“Send\
  \ Message”，将其提取到名为 `send_message` 的资源。\n\n最后，配置 `onClick` 属性调用名为 `sendMessage` 方法。\n\
  \n### 70.4 实现远程绑定服务\n\n为了实现示例的远程绑定服务，通过右键点击项目窗口中的包名（位于 `app -> java` 下）向项目添加新类并选择\
  \ `New -> Service -> Service` 选项。指定 `RemoteService` 为类名，并在点击 Finish 之前确保 `Exported`\
  \ 和 `Enabled` 选项均已选中。\n\n下一步是为新服务实现处理器类。这通过扩展 `Handler` 类并实现 `handleMessage()` 方法来实现。该方法在接收到来自客户端的消息时被调用。它将接收一个\
  \ `Message` 对象作为参数，包含客户端需要传递给服务的任何数据。在此实例中，这将包含要显示给用户的字符串的 `Bundle` 对象。实现后，`RemoteService.kt`\
  \ 文件中的修改后的类应如下：\n\n```kotlin\npackage com.ebookfrenzy.remotebound\n\nimport android.app.Service\n\
  import android.content.Intent\nimport android.os.IBinder\nimport android.os.Handler\n\
  import android.os.Message\nimport android.os.Messenger\nimport android.widget.Toast\n\
  \nclass RemoteService : Service() {\n    inner class IncomingHandler : Handler()\
  \ {\n        override fun handleMessage(msg: Message) {\n            val data =\
  \ msg.data\n            val dataString = data.getString(\"MyString\")\n        \
  \    Toast.makeText(applicationContext,\n```\n\n\n\n\n\n```kotlin\n            dataString,\
  \ Toast.LENGTH_SHORT).show()\n        }\n    }\n\n    override fun onBind(intent:\
  \ Intent): IBinder? {\n        // TODO: 将通信通道返回给服务。\n        throw UnsupportedOperationException(\"\
  Not yet implemented\")\n    }\n}\n```\n\n在实现了 handler 后，服务代码方面唯一的任务是修改 `onBind()`\
  \ 方法，使其返回一个包含 `Messenger` 对象的 `IBinder` 对象，而该 `Messenger` 对象又包含对 handler 的引用：\n\n\
  ```kotlin\nprivate val myMessenger = Messenger(IncomingHandler())\n\noverride fun\
  \ onBind(intent: Intent): IBinder {\n  return myMessenger.binder\n}\n```\n\n上述代码片段的第一行创建了我们\
  \ handler 类的新实例，并将其传递给新 `Messenger` 对象的构造函数。在 `onBind()` 方法中，调用 messenger 对象的 `getBinder()`\
  \ 方法来返回 messenger 的 `IBinder` 对象。\n\n## 70.5 在 Manifest 文件中配置远程服务\n\n为了准确地描述客户端与远程服务之间的通信，有必要配置服务运行在与应用程序其他部分独立的进程中。这通过在清单文件中服务的\
  \ `<service>` 标签内添加 `android:process` 属性来实现。为了启动远程服务，还需要为服务提供一个意图过滤器（intent filter）。要实现这些更改，请修改\
  \ `AndroidManifest.xml` 文件添加所需的条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.remotebound\" >\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/AppTheme\"\
  \ >\n        <service\n            android:name=\".RemoteService\"\n           \
  \ android:enabled=\"true\"\n            android:exported=\"true\"\n            android:process=\"\
  :my_process\" >\n        </service>\n        <activity\n            android:name=\"\
  .MainActivity\" >\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n## 70.6 启动并绑定到远程服务\n\n与本地绑定服务一样，客户端组件需要实现 `ServiceConnection` 类实例，并包含 `onServiceConnected()`\
  \ 和 `onServiceDisconnected()` 方法。同样，与本地服务相同，`onServiceConnected()` 方法将接收由远程服务 `onBind()`\
  \ 方法返回的 `IBinder` 对象，并将用于向服务器 handler 发送消息。在本例中，客户端是 `MainActivity`，其代码位于 `MainActivity.kt`。加载此文件并进行修改，添加\
  \ `ServiceConnection` 类和一个用于存储接收到的 `Messenger` 对象引用的变量，以及一个用于指示是否已连接的 `Boolean`\
  \ 标记：\n\n```kotlin\npackage com.ebookfrenzy.remotebound\n\nimport androidx.appcompat.app.AppCompatActivity\n\
  import android.os.Bundle\nimport android.content.ComponentName\nimport android.content.ServiceConnection\n\
  import android.os.*\nimport android.view.View\n\nclass MainActivity : AppCompatActivity()\
  \ {\n    var myService: Messenger? = null\n    var isBound: Boolean = false\n  \
  \  override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n\
  \        setContentView(R.layout.activity_main)\n    }\n    private val myConnection\
  \ = object : ServiceConnection {\n        override fun onServiceConnected(className:\
  \ ComponentName, service: IBinder) {\n            myService = Messenger(service)\n\
  \            isBound = true\n        }\n        override fun onServiceDisconnected(className:\
  \ ComponentName) {\n            myService = null\n            isBound = false\n\
  \        }\n    }\n}\n```\n\n接下来，需要添加一些代码来绑定到远程服务。这涉及到创建一个与清单文件中声明的服务意图过滤器匹配的 `intent`，然后调用\
  \ `bindService()` 方法，并将 `intent` 和 `ServiceConnection` 实例引用作为参数提供。为了本示例，此代码将在 activity\
  \ 的 `onCreate()` 方法中实现：\n\n```kotlin\nimport android.content.Context\nimport android.content.Intent\n\
  \noverride fun onCreate(savedInstanceState: Bundle?) {\n    super.onCreate(savedInstanceState)\n\
  \    setContentView(R.layout.activity_main)\n    val intent = Intent(applicationContext,\
  \ RemoteService::class.java)\n    bindService(intent, myConnection, Context.BIND_AUTO_CREATE)\n\
  }\n```\n\n## 70.7 向远程服务发送消息\n\n在测试应用程序之前，剩下的工作是在 `MainActivity` 类中实现 `sendMessage()`\
  \ 方法，该方法被配置为点击用户界面上的按钮时调用。此方法需要检查服务是否已连接，创建一个包含由服务器显示的字符串的 `bundle` 对象，将其添加到 `Message`\
  \ 对象并发送到服务器：\n\n```kotlin\nfun sendMessage(view: View) {\n    if (!isBound) return\n\
  \    val msg = Message.obtain()\n    val bundle = Bundle()\n    bundle.putString(\"\
  MyString\", \"Message Received\")\n    msg.data = bundle\n    try {\n        myService?.send(msg)\n\
  \    } catch (e: RemoteException) {\n        e.printStackTrace()\n    }\n}\n```\n\
  \n代码完成后，编译并运行应用程序。加载后，点击用户界面上的按钮，会出现显示“Message Received”的 Toast 消息。\n\n## 70.8 总结\n\
  \n为了实现客户端与远程服务之间的交互，有必要实现一个 handler/消息通信框架。本章涵盖了该技术的基本概念，并实现了一个运行在独立进程中的客户端和服务服务的示例应用程序。\n\
  \n# 71. Android 通知教程\n\n通知提供了一种在应用程序未运行或处于后台时向用户传递消息的方式。例如，消息应用可能会发布通知，让用户知道来自某人的新消息。通知可以分类为本地或远程。本地通知由运行设备上的应用程序本身触发。而远程通知则由远程服务器启动并传递到设备上向用户展示。通知出现在从状态栏下拉的通知屉中，每个通知都可以包含发送通知的应用程序的操作。\n\
  \n本章的目标是概述并演示 Android 应用中本地通知的实现。下一章（“Android 直接回复通知教程”）将涵盖直接回复通知的实现。\n\n## 71.1\
  \ 通知概述\n\n当在 Android 设备上启动通知时，它会作为状态栏中的图标出现。图 71-1 所示了一个带有多个通知图标的状态栏：\n\n![](img/Image24258.png)\n\
  \n图 71-1\n\n要查看通知，用户需要从状态栏开始向下滑动动作以拉下通知屉，如图 71-2 所示：\n\n\n\n\n\n![](img/Image24352.png)\n\
  \n图 71-2\n\n在运行 `Android 8` 或更高版本的设备上，长按应用启动器图标将显示与该应用关联的所有待处理通知，如图 71-3 所示：\n\n\
  ![](img/Image2442.png)\n\n图 71-3\n\n`Android 8` 及更高版本还支持通知点，当有通知等待用户查看时，该点会出现在应用启动器图标上。\n\
  \n典型的通知会简单地显示一条消息，点击后将启动发布该通知的应用。通知还可能包含操作按钮，点击这些按钮会执行对应应用程序的特定任务。例如，图 71-4 显示了一个包含两个操作按钮的通知，允许用户删除或保存收到的消息。\n\
  \n![](img/Image2450.png)\n\n图 71-4\n\n用户还可以在通知中输入内联文本回复并发送给应用，如下方的图 71-5 所示。这允许用户无需将相应的应用程序调到前台即可对通知做出响应。\n\
  \n![](img/Image2458.png)\n\n图 71-5\n\n本章的剩余部分将介绍创建和发布包含操作的简单通知的步骤。关于直接回复支持的话题将在下一节介绍，标题为“Android\
  \ 直接回复通知教程”。\n\n## 71.2 创建 NotifyDemo 项目\n\n从欢迎界面选择 `Start a new Android Studio\
  \ project`（启动新的 Android Studio 项目）快速启动选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `NotifyDemo` 并指定 `com.ebookfrenzy.notifydemo` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单改为\
  \ `Kotlin`。\n\n## 71.3 设计用户界面\n\n主活动（main activity）将包含一个按钮，其目的是创建并发布一个意。找到并加载 `activity_main.xml`\
  \ 文件到 `Layout Editor` 工具中，并删除默认的 `TextView` 组件。\n\n在启用 `Autoconnect`（自动连接）的情况下，从面板中将\
  \ `Button` 对象拖放到布局画布的中心，如图 71-6 所示。\n\n在布局中选中 `Button` 组件后，使用 `Attributes` 面板配置\
  \ `onClick` 属性以调用名为 `sendNotification` 的方法。\n\n![](img/as_3.5_notifydemo_ui.png)\n\
  \n图 71-6\n\n选择 `Button` 组件，在 `Attributes` 工具窗口中将 `text` 属性更改为“Notify”，并将属性值提取到字符串资源。\n\
  \n## 71.4 创建第二个 Activity\n\n为了本例演示，应用将包含第二个 Activity，用户将能够从通知内部启动该 Activity。通过右键点击\
  \ `app -> java` 下的 `com.ebookfrenzy.notifydemo` 包名，选择 `New -> Activity -> Empty\
  \ Activity` 菜单选项显示 `New Android Activity` 对话框，从而添加此新 Activity。\n\n在 `Activity Name`\
  \ 字段中输入 `ResultActivity` 并布局文件命名为 `activity_result`。由于此 Activity 在应用启动时不会启动（而是将通过通知内部的\
  \ `intent` 启动），在点击 `Finish` 按钮之前，确保禁用 `Launcher Activity` 选项。\n\n打开第二个 Activity\
  \ 的布局（`app -> res -> layout -> activity_result.xml`），并拖放一个 `TextView` 组件使其位于布局中心。编辑\
  \ `TextView` 的文本显示为“Result Activity”，并将属性值提取到字符串资源。\n\n## 71.5 创建通知通道\n\n在应用发送通知之前，必须先创建一个通知通道。通知通道由一个在应用内唯一标识该通道的\
  \ ID、一个通道名称和一个通道描述组成（其中只有后两个对用户可见）。通道是通过配置 `NotificationChannel` 实例，然后将该对象传递给 `NotificationManager`\
  \ 类的 `createNotificationChannel()` 方法来创建的。对于本例，应用将包含一个名为“NotifyDemo News”的单一通知通道。编辑\
  \ `MainActivity.kt` 文件并实现应用启动时创建通道的代码：\n\n```kotlin\nimport android.app.NotificationChannel\n\
  import android.app.NotificationManager\nimport android.content.Context\nimport android.graphics.Color\n\
  \nclass MainActivity : AppCompatActivity() {\n    private var notificationManager:\
  \ NotificationManager? = null\n\n    override fun onCreate(savedInstanceState: Bundle?)\
  \ {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_main)\n\
  \        notificationManager =\n            getSystemService(Context.NOTIFICATION_SERVICE)\
  \ as NotificationManager\n        notificationManager?.createNotificationChannel(\n\
  \                \"com.ebookfrenzy.notifydemo\",\n                \"NotifyDemo News\"\
  ,\n                \"Example Channel\")\n    }\n\n    private fun createNotificationChannel(id:\
  \ String, name: String, description: String) {\n        val importance = NotificationManager.IMPORTANCE_LOW\n\
  \        val channel = NotificationChannel(id, name, importance)\n        channel.description\
  \ = description\n        channel.enableLights(true)\n        channel.lightColor\
  \ = Color.RED\n        channel.enableVibration(true)\n        channel.vibrationPattern\
  \ = longArrayOf(100, 200, 300, 400, 500, 400, 300, 200, 400)\n        notificationManager?.createNotificationChannel(channel)\n\
  \    }\n}\n```\n\n## 7.6 创建并发布基础通知\n\n通知使用 `Notification.Builder` 类创建，并且必须包含图标、标题和内容。打开\
  \ `MainActivity.kt` 文件并按如下所示实现 `sendNotification()` 方法以构建基础通知：\n\n```kotlin\nimport\
  \ android.view.View\n\nfun sendNotification(view: View) {\n    val channelID = \"\
  com.ebookfrenzy.notifydemo.news\"\n}\n```\n\n\n\n\n\n```kotlin\nval notification\
  \ = Notification.Builder(this@MainActivity, channelID)\n    .setContentTitle(\"\
  Example Notification\")\n    .setContentText(\"This is an example notification.\"\
  )\n    .setSmallIcon(android.R.drawable.ic_dialog_info)\n    .setChannelId(channelID)\n\
  \    .build()\n```\n\n一旦构建了通知，就需要使用 `NotificationManager` 实例的 `notify()` 方法进行发布。访问\
  \ `NotificationManager` 并发布通知的代码需要添加到 `sendNotification()` 方法中，如下：\n\n```kotlin\n\
  fun sendNotification(view: View) {\n    val notificationID = 101\n    val channelID\
  \ = \"com.ebookfrenzy.notifydemo.news\"\n    val notification = Notification.Builder(this@MainActivity,\
  \ channelID)\n        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setChannelId(channelID)\n        .build()\n    notificationManager?.notify(notificationID,\
  \ notification)\n}\n```\n\n注意，当发布通知时，会为其分配一个通知 ID。这可以是任何整数，并可能在以后更新通知时使用。\n\n编译并运行应用，点击主活动上的按钮。当通知图标出现在状态栏中时，从状态栏向下触摸并滑动以查看完整通知：\n\
  \n![](img/Image24811.png)\n图 71-8\n\n点击并向右滑动通知，然后选择设置齿轮图标以查看有关通知的更多信息：\n\n![](img/as_3.5_notification_settings.png)\n\
  图 71-9\n\n接下来，将应用置于后台，导航到显示所有应用启动器图标的桌面，并注意如 图 71-10 所示，NotifyDemo 启动器图标上出现了一个通知点：\n\
  \n![](img/Image2499.png)\n图 71-10\n\n如果没有出现该点，请检查“设置”应用中 NotifyDemo 的通知选项，以确认已按照本章前面介绍的方法启用了“通知点”。如果该点仍未出现，请长按设备主屏幕的空白区域，从弹出的菜单中选择`主屏幕设置`选项并启用“通知点”选项。\n\
  \n长按启动器图标将显示一个包含通知的弹出窗口：\n\n![](img/as_3.5_notifydemo_long_press_popup.png)\n图 71-11\n\
  \n如果一个应用有多个待处理通知，长按菜单弹出窗口将包含通知数量计数（如上图所示）。此数字可以通过在构建通知时调用 `setNumber()` 方法在应用内部进行配置：\n\
  \n```kotlin\nval notification = Notification.Builder(this@MainActivity, channelID)\n\
  \    .setContentTitle(\"Example Notification\")\n    .setContentText(\"This is an\
  \ example notification.\")\n    .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \    .setChannelId(channelID)\n    .setNumber(10)\n    .build()\n```\n\n按照目前的实现，无论在何处访问，点击通知都没有效果。下一步是配置通知，以便在点击时启动一个活动（Activity）。\n\
  \n### 71.7 从通知启动活动\n\n理想情况下，通知应该允许用户执行某些形式的操作，例如启动相应的应用，或响应通知采取其他形式的操作。一个常见的需求是，当用户点击通知时，简单启动属于该应用的活动。\n\
  \n这种方法需要启动一个活动以及一个用于启动该活动的 `Intent`。假设应用包含一个名为 `ResultActivity` 的活动，则 `intent` 的创建方式如下：\n\
  \n`val resultIntent = Intent(this, ResultActivity::class.java)`\n\n此 `intent` 需要被封装在\
  \ `PendingIntent` 实例中。`PendingIntent` 对象的设计用于将 `intent` 传递给其他应用程序，实质上授予这些应用程序在未来的某个时间执行该意图的。在这种情况下，`PendingIntent`\
  \ 对象被用于为通知系统提供一种方式在用户点击通知时启动 `ResultActivity`：\n\n`val pendingIntent = PendingIntent.getActivity(this,\
  \ 0, resultIntent, PendingIntent.FLAG_UPDATE_CURRENT)`\n\n剩下的工作是在构建通知期间使用 `setContentIntent()`\
  \ 方法分配 `PendingIntent` 对象。将这些更改整合后，得到修改后的 `sendNotification()` 方法，内容如下：\n\n```kotlin\n\
  import android.app.PendingIntent\nimport android.content.Intent\nimport android.graphics.drawable.Icon\n\
  \nclass MainActivity : AppCompatActivity() {\n    fun sendNotification(view: View)\
  \ {\n        val notificationID = 101\n        val resultIntent = Intent(this, ResultActivity::class.java)\n\
  \        val pendingIntent = PendingIntent.getActivity(\n            this,\n   \
  \         0,\n            resultIntent,\n            PendingIntent.FLAG_UPDATE_CURRENT\n\
  \        )\n        val channelID = \"com.ebookfrenzy.notifydemo.news\"\n      \
  \  val notification = Notification.Builder(this@MainActivity, channelID)\n     \
  \       .setContentTitle(\"Example Notification\")\n            .setContentText(\"\
  This is an example notification.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(channelID)\n            .setContentIntent(pendingIntent)\n\
  \            .build()\n        notificationManager?.notify(notificationID, notification)\n\
  \    }\n}\n```\n\n再次编译并运行应用，点击按钮并显示通知栏。然而这一次，点击通知将导致 `ResultActivity` 启动。\n\n###\
  \ 71.8 为通知添加操作\n\n为通知添加交互性的另一种方法是创建操作（Actions）。这些操作以按钮的形式出现在通知消息下方，并被设计为在用户点击时触发特定的意图。如果将以下代码添加到\
  \ `sendNotification()` 方法中，它将添加一个标记为“打开”的操作按钮，在选择时会启动引用的等待意图：\n\n```kotlin\nval\
  \ icon: Icon = Icon.createWithResource(this, android.R.drawable.ic_dialog_info)\n\
  val action: Notification.Action =\n    Notification.Action.Builder(icon, \"Open\"\
  , pendingIntent).build()\nval notification = Notification.Builder(this@MainActivity,\
  \ channelID)\n    .setContentTitle(\"Example Notification\")\n    .setContentText(\"\
  This is an example notification.\")\n    .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \    .setChannelId(channelID)\n    .setContentIntent(pendingIntent)\n    .setActions(action)\n\
  \    .build()\n\nnotificationManager?.notify(notificationID, notification)\n```\n\
  \n将上述代码添加到方法中并运行应用。发布通知并注意通知内出现的“打开”操作（取决于 Android 版本，可能需要下拉通知面板以显示“打开”操作）：\n\n\
  ![](img/as_3.5_notification_with_action.png)\n图 71-12\n\n点击该操作将触发等待意图并启动 `ResultActivity`。\n\
  \n### 71.9 捆绑通知\n\n如果一个应用倾向于定期发布通知，可能会导致这些通知迅速占满状态栏和通知栏，为用户提供欠佳的体验。这对于新闻或消息应用尤为如此，这些应用每当有突发新闻或收到联系人的新消息时都会发送通知。例如，考虑图\
  \ 71-13 中的通知：\n\n\n\n\n\n![](img/as_3.2_unbundled_notifications.png)\n\n图 71-13\n\
  \n现在想象一下如果收到了十条甚至二十条新消息。为了避免这类问题，Android 允许将通知打包成组。\n\n要打包通知，必须通过 `setGroup()` 方法将每条通知指定为属于同一个组，并且必须发布并配置一条额外的通知作为摘要通知（summary\
  \ notification）。例如，下面的代码创建并发布了上方 图 71-13 所示的三个通知，但将它们打包到了同一个组中。该代码还发布了一个通知作为摘要：\n\
  \n```kotlin\nval GROUP_KEY_NOTIFY = \"group_key_notify\"\n\nvar builderSummary:\
  \ Notification.Builder = Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"A Bundle Example\")\n        .setContentText(\"You have\
  \ 3 new messages\")\n        .setGroup(GROUP_KEY_NOTIFY)\n        .setGroupSummary(true)\n\
  \nvar builder1: Notification.Builder = Notification.Builder(this, channelID)\n \
  \       .setSmallIcon(android.R.drawable.ic_dialog_info)\n        .setContentTitle(\"\
  New Message\")\n        .setContentText(\"You have a new message from Kassidy\"\
  )\n        .setGroup(GROUP_KEY_NOTIFY)\n\nvar builder2: Notification.Builder = Notification.Builder(this,\
  \ channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n       \
  \ .setContentTitle(\"New Message\")\n        .setContentText(\"You have a new message\
  \ from Caitlyn\")\n        .setGroup(GROUP_KEY_NOTIFY)\n\nvar builder3: Notification.Builder\
  \ = Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"New Message\")\n        .setContentText(\"You have a\
  \ new message from Jason\")\n        .setGroup(GROUP_KEY_NOTIFY)\n\nvar notificationId0\
  \ = 100\nvar notificationId1 = 101\nvar notificationId2 = 102\nvar notificationId3\
  \ = 103\n\nnotificationManager?.notify(notificationId1, builder1.build())\nnotificationManager?.notify(notificationId2,\
  \ builder2.build())\nnotificationManager?.notify(notificationId3, builder3.build())\n\
  notificationManager?.notify(notificationId0, builderSummary.build())\n```\n\n当代码执行时，尽管应用程序实际上发布了四条通知，状态栏中也只会出现一个通知图标。在通知栏中，会显示一个单一的摘要通知，列出每个打包通知的信息：\n\
  \n![](img/Image2528.png)\n\n图 71-14\n\n进一步向下滑动通知条目可以展开面板，显示每个打包通知的详细信息：\n\n![](img/Image2536.png)\n\
  \n图 71-15\n\n## 71.10 总结\n\n通知为应用程序提供了一种在未运行或当前处于后台时向用户传递消息的方法。通知显示在状态栏和通知栏中。本地通知由运行的应用程序在设备上触发，而远程通知则由远程服务器启动并递送到设备。本地通知使用\
  \ `NotificationCompat.Builder` 类创建，并使用 `NotificationManager` 服务发布。\n\n正如本章所演示的，可以通过利用操作（actions）、意图（intents）和\
  \ `PendingIntent` 类配置通知为用户提供选项（例如启动活动或保存消息）。通知打包提供了一种将通知分组的机制，为发布大量通知的应用程序提供了更好的体验。\n\
  \n## 72. Android 直接回复通知教程\n\n直接回复（Direct reply）是 Android 7 中引入的一项功能，允许用户在通知中输入文本并发送到与通知关联的应用程序。这使用户无需启动应用程序内的活动即可在通知中回复消息。本章将基于上一章学到的知识，创建一个使用此通知功能的示例应用程序。\n\
  \n### 72.1 创建 DirectReply 项目\n\n从欢迎界面选择“Start a new Android Studio project”快速启动选项，在弹出的新项目对话框中，点击\
  \ Next 按钮之前选择“Empty Activity”模板。\n\n在 `Name` 字段中输入 `DirectReply`，并指定包名为 `com.ebookfrenzy.directreply`。\n\
  \n## 72.2 设计用户界面\n\n加载 `activity_main.xml` 文件到布局。在启用自动连接（Autoconnect）的情况下，在现有的“World!”标签下方添加一个\
  \ `Button` 对象。在布局中选中 `Button`，使用属性工具将 `onClick` 属性设置为调用方法 `sendNotification`。\n\n\
  ![](img/as_3.2_unbundled_notifications.png)\n图 71-13\n\n在继续之前，选择“World!”对应的 `TextView`\
  \ 并将 `id` 更改为 \"Notify\"。\n\n### 72.3 创建通道\n\n与上一章的示例一样，在发送通知之前必须创建一个通道。编辑 `MainActivity.kt`\
  \ 并添加代码创建新通道：\n\n```kotlin\nimport android.app.NotificationChannel\nimport android.app.NotificationManager\n\
  import android.content.Context\nimport android.graphics.Color\n\nclass MainActivity\
  \ : AppCompatActivity() {\n    private var notificationManager: NotificationManager?\
  \ = null\n    private val channelID = \"com.ebookfrenzy.directreply.news\"\n\n \
  \   override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n\
  \        setContentView(R.layout.activity_main)\n        notificationManager = getSystemService(Context.NOTIFICATION_SERVICE)\
  \ as NotificationManager\n        createNotificationChannel(channelID, \"Direct\
  \ News\", \"Example Channel\")\n    }\n\n    private fun createNotificationChannel(id:\
  \ String, name: String, description: String) {\n        val importance = NotificationManager.IMPORTANCE_HIGH\n\
  \        val channel = NotificationChannel(id, name, importance)\n        channel.description\
  \ = description\n        channel.enableLights(true)\n        channel.lightColor\
  \ = Color.RED\n        channel.enableVibration(true)\n        channel.vibrationPattern\
  \ = longArrayOf(100, 200, 300, 400, 500, 400, 300, 200, 400)\n        notificationManager?.createNotificationChannel(channel)\n\
  \    }\n}\n```\n\n### 72.4 构建 RemoteInput 对象\n\n使通知内实现直接回复回复文本的关键元素是 `RemoteInput`\
  \ 类。之前的章节介绍了 `PendingIntent` 类，并解释了它如何允许应用程序创建一个意图，然后授予其他应用程序或服务在原始应用程序之外启动该意图的能力。在标题为\
  \ An Notifications Tutorial 的章节中，创建了一个等待意图，允许从通知内部启动原始应用程序中的活动。`RemoteInput` 类允许将用户输入请求包含在\
  \ `PendingIntent` 对象中并与意图一同。\n\n\n\n\n在通知中实现直接回复的第一步是创建 `RemoteInput` 对象。这是通过使用\
  \ `RemoteInput.Builder()` 方法实现的。构建 `RemoteInput` 对象时，需要一个键字符串（key），用于从生成的意 中提取输入内容。该对象还需要一个标签字符串（label），它将显示在通知的文本输入字段中。编辑\
  \ `MainActivity.kt` 文件并开始实现 `sendNotification()` 方法。请注意添加了一些导入指令和变量，它们将在后续章节进展中被用到：\n\
  \n```kotlin\npackage com.ebookfrenzy.directreply\n\n.\n\nimport android.content.Intent\n\
  import android.app.RemoteInput\nimport android.view.View\nimport android.app.PendingIntent\n\
  \nclass MainActivity : AppCompatActivity() {\n    private val notificationId = 101\n\
  \    private val KEY_TEXT_REPLY = \"key_text_reply\"\n    private var notificationManager:\
  \ NotificationManager? = null\n    private val channelID = \"com.ebookfrenzy.directreply.news\"\
  \n\n    fun sendNotification(view: View) {\n        val replyLabel = \"Enter your\
  \ reply here\"\n        val remoteInput = RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \            .setLabel(replyLabel)\n            .build()\n    }\n}\n}\n```\n\n现在\
  \ `RemoteInput` 对象已经创建并使用键和标签字符串进行了初始化，它需要被放置在通知动作对象中。在执行该步骤之前，需要创建 `PendingIntent`\
  \ 实例。\n\n### 72.5 创建 PendingIntent\n\n创建 `PendingIntent` 的步骤与“Android 通知教程”章节中概述的步骤相同，不同之处该意图（intent）将配置为启动\
  \ `MainActivity`。留在 `MainActivity.kt` 文件中，添加以下代码来创建 `PendingIntent`：\n\n```kotlin\n\
  fun sendNotification(view: View) {\n    val replyLabel = \"Enter your reply here\"\
  \n    val remoteInput = RemoteInput.Builder(KEY_TEXT_REPLY)\n            .setLabel(replyLabel)\n\
  \            .build()\n    val resultIntent = Intent(this, MainActivity::class.java)\n\
  \    val resultPendingIntent = PendingIntent.getActivity(\n            this,\n \
  \           0,\n            resultIntent,\n            PendingIntent.FLAG_UPDATE_CURRENT\n\
  \    )\n}\n```\n\n### 72.6 创建回复动作\n\n内联回复可以通过通知中的动作按钮访问。现在需要创建此动作，并为其配置图标、显示在按钮上的标签、`PendingIntent`\
  \ 对象以及 `RemoteInput` 对象。修改 `sendNotification()` 方法以添加创建此动作的代码：\n\n```kotlin\n.\n\
  import android.graphics.drawable.Icon\nimport android.app.Notification\n.\n\nfun\
  \ sendNotification(view: View) {\n    val replyLabel = \"Enter your reply here\"\
  \n    val remoteInput = RemoteInput.Builder(KEY_TEXT_REPLY)\n            .setLabel(replyLabel)\n\
  \            .build()\n    val resultIntent = Intent(this, MainActivity::class.java)\n\
  \    val resultPendingIntent = PendingIntent.getActivity(\n            this,\n \
  \           0,\n            resultIntent,\n            PendingIntent.FLAG_UPDATE_CURRENT\n\
  \    )\n    val icon = Icon.createWithResource(this@MainActivity,\n            android.R.drawable.ic_dialog_info)\n\
  \    val replyAction = Notification.Action.Builder(\n            icon,\n       \
  \     \"Reply\", resultPendingIntent)\n            .addRemoteInput(remoteInput)\n\
  \            .build()\n}\n```\n\n在教程的这个阶段，我们已经构建了可用的 `RemoteInput`、`PendingIntent`\
  \ 和 `Action` 对象。下一阶段是构建并发布通知：\n\n```kotlin\n.\nimport androidx.core.content\n.\n\
  \nfun sendNotification(view: View) {\n    val replyLabel = \"Enter your reply here\"\
  \n    val remoteInput = RemoteInput.Builder(KEY_TEXT_REPLY)\n            .setLabel(replyLabel)\n\
  \            .build()\n    val resultIntent = Intent(this, MainActivity::class.java)\n\
  \    val resultPendingIntent = PendingIntent.getActivity(\n            this,\n \
  \           0,\n            resultIntent,\n            PendingIntent.FLAG_UPDATE_CURRENT\n\
  \    )\n    val icon = Icon.createWithResource(this@MainActivity,\n            android.R.drawable.ic_dialog_info)\n\
  \    val replyAction = Notification.Action.Builder(\n            icon,\n       \
  \     \"Reply\", resultPendingIntent)\n            .addRemoteInput(remoteInput)\n\
  \            .build()\n    val newMessageNotification = Notification.Builder(this,\
  \ channelID)\n            .setColor(ContextCompat.getColor(this,\n             \
  \   R.color.colorPrimary))\n            .setSmallIcon(\n                android.R.drawable.ic_dialog_info)\n\
  \            .setContentTitle(\"My Notification\")\n            .setContentText(\"\
  This is a test message\")\n            .addAction(replyAction).build()\n    val\
  \ notificationManager = getSystemService(\n            Context.NOTIFICATION_SERVICE)\
  \ as NotificationManager\n    notificationManager.notify(notificationId,\n     \
  \       newMessageNotification)\n}\n```\n\n完成更改后，编译并运行应用，测试点击按钮是否能成功发布通知。当查看通知栏时，通知应该如图\
  \ 72-2 所示：\n\n![](img/as_3.5_direct_reply_notification.png)\n图 72-2\n\n点击 `Reply`\
  \ 动作按钮，使文本输入字段出现并显示创建 `RemoteInput` 对象时嵌入的回复标签。\n\n![](img/as_3.5_direct_reply_reply.png)\n\
  图 72-3\n\n输入文本并点击输入字段末尾的发送按钮。\n\n### 72.7 接收直接回复输入\n\n现在通知已成功获取用户的输入，应用需要对该输入进行某些处理。本教程的目标是让用户输入的文本显示在\
  \ Activity 的 `TextView` 中。\n\n当用户输入文本并点击发送按钮时，通过 `PendingIntent` 对象中的意图启动 `MainActivity`。该意图中包含了输入的文本。在\
  \ Activity 的 `onCreate()` 方法中，调用 `getIntent()` 方法将返回意图副本。将此意图传递给 `RemoteInput.getResultsIntent()`\
  \ 方法将返回一个包含回复文本的 `Bundle` 对象，可以提取并赋值给 `TextView`。这使得 `MainActivity.kt` 文件中的 `onCreate()`\
  \ 方法修改如下：\n\n```kotlin\n.\nimport kotlinx.android.synthetic.main.activity_main\n\
  .\n\noverride fun onCreate(savedInstanceState: Bundle?) {\n    super.onCreate(savedInstanceState)\n\
  \    setContentView(R.layout.activity_main)\n    notificationManager = getSystemService(Context.NOTIFICATION_SERVICE)\
  \ as NotificationManager\n    createNotificationChannel(channelID, \"DirectReply\
  \ News\", \"Example News Channel\")\n    handleIntent()\n}\n\nprivate fun handleIntent()\
  \ {\n    val intent = this.intent\n    val remoteInput = RemoteInput.getResultsIntent(intent)\n\
  \    if (remoteInput != null) {\n        val inputString = remoteInput.getCharSequence(KEY_TEXT_REPLY).toString()\n\
  \        textView.text = inputString\n    }\n}\n```\n\n完成这些代码更改后，再次构建并运行应用。点击按钮发布通知，并在通知面板内输入并发送文本。注意\
  \ `MainActivity` 中的 `TextView` 控件已更新，显示了输入的内联文本。\n\n## 72.8 更新通知\n\n在通知中回复后，你可能注意到通知面板中的进度指示器仍在旋转，如图\
  \ 72-4 所示：\n\n![](img/Image24492.png)\n图 72-4\n\n\n\n\n\n通知正在显示此指示器，是因为它正在等待活动确认已收到发送文本的响应。执行此任务的推荐方法是更新通知，显示一条新消息指示回复已收到并处理。由于原始通知在发布时已分配了一个\
  \ ID，可以再次使用该 ID 来执行更新。将以下代码添加到 `handleIntent()` 方法中执行此任务：\n\n```kotlin\nprivate\
  \ fun handleIntent() {\n    val intent = this.intent\n    val remoteInput = RemoteInput.getResultsFromIntent(intent)\n\
  \    if (remoteInput != null) {\n        val inputString = remoteInput.getCharSequence(\n\
  \                KEY_TEXT_REPLY).toString()\n        textView.text = inputString\n\
  \        val repliedNotification = Notification.Builder(this, channelID)\n     \
  \           .setSmallIcon(\n                        android.R.drawable.ic_dialog_info)\n\
  \                .setContentText(\"Reply received\")\n                .build()\n\
  \        notificationManager?.notify(notificationId,\n                repliedNotification)\n\
  \    }\n}\n```\n\n最后测试一次应用程序，并验证在发送内联回复文本后进度指示器会消失，并且会出现一个新面板表示回复已收到：\n\n![](img/Image24571.png)\n\
  \n图 72-5\n\n## 72.9 总结\n直接回复通知功能允许用户在通知内输入文本，并通过 intent 传递给相应应用程序的活动。直接回复的实现依赖于\
  \ `RemoteInput` 类，该类的实例可以嵌入到操作中，并与通知一起打包。在处理直接回复通知时，让 `NotificationManager` 服务知道回复已收到并处理是非常重要的。实现这一点的最佳方法是简单地使用在首次发布通知时提供的\
  \ `notification ID` 来更新通知消息。\n\n### 73. 折叠屏设备和多窗口支持\n无论我们是否准备好，折叠屏设备都会到来（或者对于第一代三星\
  \ Galaxy Fold 来说，可能在设备本身准备好之前就出现了）。为了给这种新类型的设备做准备，注意一些应该采取的额外步骤，以确保你的应用在折叠屏设备上运行正常。。幸运的是，Android\
  \ 支持折叠屏设备的大部分行为已经以多窗口支持的形式存在。\n\n#### 73.1 折叠屏与多窗口支持\n当应用在折叠屏设备上运行时，它可能会与其他应用共享屏幕，并遇到重大的配置更改（例如用户折叠或展开显示器导致屏幕尺寸变化）。如果你的应用已经设计可以处理设备方向的变化，那么它可能也能处理由屏幕折叠引起的变化，尽管建议进行彻底测试。\n\
  \n多窗口支持最初在 Android 7 中引入。与之前的 Android 版本不同，Android 7 中的多窗口支持允许在设备屏幕上同时显示多个活动。\n\n\
  Android 中的多窗口支持提供了不同形式的窗口支持。分屏模式在大多数手机、折叠屏设备和平板电脑上可用，它提供了一个分屏环境，其中两个活动并排显示或一在上一下。它提供了一个可移动的分割线，当用户拖动它时，会调整分配给每个相邻活动的屏幕百分比：\n\
  \n![](img/Image24272.png)\n\n图 73-1\n\n自由窗口模式（Freeform mode）为屏幕较大的设备提供了一个窗口化环境，目前由设备制造商决定启用。自由窗口模式与分屏模式的区别在于，它允许每个活动在独立的、可调整大小的窗口中出现，并且不限于同时显示两个活动。例如，图\
  \ 73-2 显示了一个处于自由窗口模式的设备，计算器和第二个应用显示在独立的窗口中：\n\n![](img/Image24362.png)\n\n图 73-2\n\
  \n画中画（Picture-in-picture）支持顾如其名，允许视频在用户执行其他任务时在较小的窗口中继续播放，该主题将在题为 Android 画中画模式”的章节开始介绍。\n\
  \n## 73.2 使用折叠屏模拟器\n尽管在编写时，市场上还没有用于测试的折叠屏设备，但 Android SDK 包含了折叠屏模拟器。要创建一个折叠屏模拟器，选择\
  \ Android Studio Tools -> AVD Manager 菜单，点击 Create Virtual Device 按钮，在硬件选择屏幕上，选择下方图\
  \ 73-3 所示的 Foldable 选项之一：\n\n![](img/733.png)\n\n图 73-3\n\n在选择折叠屏后，继续创建过程，选择 Android\
  \ 29 或更高版本作为系统镜像。一旦模拟器启动，工具栏中会出现一个额外的按钮，允许模拟器在折叠和展开配置之间进行切换：\n\n![](img/734.png)\n\
  \n图 73-4\n\n#### 73.3 进入多窗口模式\n可以通过显示概览（Overview）屏幕、长按工具栏中的应用图标并选择如图 73-5 所示的“分屏”（Split\
  \ screen）菜单选项来进入分屏模式：\n\n![](img/735.png)\n\n图 73-5\n\n一旦进入分屏模式，概览按钮将变为显示两个矩形（在图\
  \ 73-6 中标记为 A），当前活动将占据屏幕的一部分（B），概览屏幕出现在相邻相邻部分允许选择第二个活动（C）：\n\n![](img/736.png)\n\
  \n图 73-6\n\n一旦选择了第二个应用，屏幕将如上文图 73-1 所示被均匀分割。\n\n要退出分屏模式，只需拖动两个活动之间的分割线到边缘，使一个活动占据整个屏幕，或者长按概览按钮直到它恢复为正方形。\n\
  \n#### 73.4 启用并使用自由窗口支持\n尽管并非在所有设备上都正式支持，但在大屏设备和模拟器上启用自由窗口多窗口模式。要启用此模式，在模拟器运行时或设备连接时运行以下\
  \ `adb` 命令：\n\n```bash\nadb shell settings put global enable_freeform_support 1\n\
  ```\n\n在进行此更改后，可能需要重启设备使设置生效。启用后，在概览屏幕中长按应用图标时会出现一个额外的选项，如图 73-7 所示：\n\n![](img/737.png)\n\
  \n图 73-7\n\n#### 73.5 检查自由窗口支持\n\n\n\n\n\n正如本章开头概述的，Google 将是否启用自由窗口多窗口模式的选择权交给了各个\
  \ Android 设备制造商。由于自由窗口模式仅在较大的设备上使用才才有意义，因此无法保证在每个可能运行该 App 的设备上都支持自由窗口模式。幸运的是，如果设备不支持自由窗口模式，系统将忽略所有与自由窗口特定的方法和属性，因此使用这些内容不会导致\
  \ App 在不支持自由窗口的设备上崩溃。然而，可能会出现某些情况，检测设备是否支持自由窗口多窗口模式是有用的。幸运的是，可以通过检查包管理器（package\
  \ manager）中的自由窗口窗口管理功能来实现。下面的代码示例检查了对自由窗口多窗口的支持，并根据测试结果返回 `Boolean` 值：\n\n```kotlin\n\
  fun checkFreeform(): Boolean {\n    return packageManager.hasSystemFeature(\n  \
  \          PackageManager.FEATURE_FREEFORM_WINDOW_MANAGEMENT)\n}\n```\n\n## 73.6\
  \ 在 App 中启用多窗口支持\n\n清单文件中的 `android:resizableActivity` 设置控制 App 是否支持多窗口行为。该设置可以在应用程序级别或单个\
  \ activity 级别进行配置。例如，下面的代码片段配置了名为 `MainActivity` 的 activity，使其支持分屏和自由窗口多窗口模式：\n\n\
  ```xml\n<activity\n    android:name=\".MainActivity\"\n    android:resizeableActivity=\"\
  true\"\n    android:label=\"@string/app_name\"\n    android:theme=\"@style/AppTheme.NoActionBar\"\
  >\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n将该属性设置为 `false` 将防止该 activity 出现在分屏或自由窗口模式下，且相应的按钮将不会出现在\
  \ App 的概览（Overview）菜单中。在分屏配置中选择一个禁用多窗口支持的 activity 作为第二个 activity，将显示一条消息，指示该 App\
  \ 可能不支持多窗口模式。\n\n## 73.7 指定多窗口属性\n\n`<layout>` 元素提供了许多属性，用于指定 activity 在多窗口模式下启动时的尺寸和位置。当\
  \ activity 在自由窗口模式下启动时，初始高度、宽度和位置可以使用以下属性指定：\n\n* `android:defaultWidth` – 指定 activity\
  \ 的默认宽度。\n* `android:defaultHeight` – 指定 activity 的默认高度。\n* `android:gravity` –\
  \ 指定 activity 的初始位置（start、end、left、right、top 等）。\n\n注意，上述属性仅在 activity 于自由窗口模式下显示时才生效。下面的示例配置了\
  \ activity 在屏幕起始边缘顶部以特定的高度和宽度显示：\n\n```xml\n<activity android:name=\".MainActivity\
  \ \">\n    <layout android:defaultHeight=\"350dp\"\n             android:defaultWidth=\"\
  450dp\"\n             android:gravity=\"start|end\" />\n</activity>\n```\n\n以下 `<layout>`\
  \ 属性可以指定 activity 在分屏视图或自由窗口模式下可以缩小的最小宽度和高度：\n\n* `android:minimalHeight` – 指定 activity\
  \ 在分屏模式或自由窗口模式下可以缩小的最小最小高度。\n* `android:minimalWidth` - 指定 activity 在分屏模式或自由窗口模式下可以缩小的最小最小宽度。\n\
  \n当用户将分屏分割线滑出最小高度或宽度边界时，系统将停止调整收缩中 activity 的布局，并简单裁剪用户界面以为相邻的 activity 留出空间。\n\n\
  下面的清单文件片段为 activity 实现了最小宽度和高度属性：\n\n```xml\n<activity android:name=\".MainActivity\
  \ \">\n    <layout android:minimalHeight=\"400dp\"\n             android:minimalWidth=\"\
  290dp\" />\n</activity>\n```\n\n## 73.8 在 Activity 中检测多窗口模式\n\n可能会出现某些情况，activity\
  \ 需要检测当前是否正以多窗口模式显示给用户。可以通过调用 `Activity` 类的 `isInMultiWindowMode()` 方法获取当前状态。调用此方法时，它返回\
  \ `true` 或 `false` 值，取决于 activity 当前是否处于全屏状态：\n\n```kotlin\nif (this.isInMultiWindowMode())\
  \ {\n    // Activity 正在多窗口模式运行\n} else {\n    // Activity 不在多窗口模式\n}\n```\n\n##\
  \ 73.9 接收多窗口通知\n\n如果 activity 重写了 `onMultiWindowModeChanged()` 回调方法，它将接收进入或退出多窗口模式的通知。传递给方法的第一个参数在进入多窗口模式时为\
  \ `true`，在 activity 退出该模式时为 `false`。新的配置设置包含在作为第二个参数传递的 `Configuration` 对象中：\n\n\
  ```kotlin\noverride fun onMultiWindowModeChanged(isInMultiWindowMode: Boolean, newConfig:\
  \ Configuration?) {\n    super.onMultiWindowModeChanged(isInMultiWindowMode, newConfig)\n\
  \    if (isInMultiWindowMode) {\n        // Activity 进入了多窗口模式\n    } else {\n  \
  \      // Activity 已退出多窗口模式\n    }\n}\n```\n\n正如“处理 Activity 状态更改”章节中所概述的，Android\
  \ 10 及更高版本允许多个 activity 处于恢复状态（也称为多恢复，multi-resume）。最近与之交互的 activity 被称为顶部恢复 activity（topmost\
  \ resumed activity）。为了跟踪 activity 获得和丢失顶部状态，可以在 activity 中实现 `onTopResumedChanged()`\
  \ 方法，例如：\n\n```kotlin\noverride fun onTopResumedChanged(isTopResumed: Boolean) {\n\
  \    super.onTopResumedChanged(isTopResumed)\n    if (isTopResumed) {\n        //\
  \ Activity 现在是顶部恢复 activity\n    } else {\n        // Activity 不再是顶部恢复 activity\n\
  \    }\n}\n```\n\n在某些运行 9 的设备上，通过在 App 清单中启用以下属性，也可以利用多恢复：\n\n```xml\n<meta-data\
  \ name=\"android.allow_resumed_activities\" value=\"true\" />\n```\n\n## 73.10 在多窗口模式下启动\
  \ Activity\n\n在本书的“Android 显式 Intent – 工作示例”章节中，创建了一个示例 App，其中 activity 使用 intent\
  \ 启动另一个 activity。默认情况下，通过 intent 启动的 activity 被认为位于源 activity 相同的任务栈中。然而，通过传递 intent\
  \ 传递标志，可以启动到一个新的任务栈。\n\n当多窗口模式下的 activity 在同一任务栈中启动另一个 activity 时，新 activity 将替换分屏或自由窗口中的源\
  \ activity（用户通过返回键回到原始 activity）。\n\n然而，在分屏模式下启动新的任务栈时，第二个 activity 将出现在原始 activity\
  \ 相邻的窗口中，允许同时查看两个 activity。在自由窗口模式下，启动的 activity 将出现在原始 activity 的独立窗口中。\n\n为了将\
  \ activity 启动到新的任务栈，必须启动 intent 前设置以下标志：\n\n* `Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT`\n\
  * `Intent.FLAG_ACTIVITY_MULTIPLE_TASK`\n* `Intent.FLAG_ACTIVITY_NEW_TASK`\n\n下面的代码示例配置并启动了设计为在独立窗口显示的第二个\
  \ activity：\n\n```kotlin\nval i = Intent(this, SecondActivity::class.java)\n```\n\
  \n\n\n\n\n```kotlin\ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT or\n      \
  \     Intent.FLAG_ACTIVITY_MULTIPLE_TASK or\n           Intent.FLAG_ACTIVITY_NEW_TASK)\n\
  startActivity(i)\n```\n\n## 73.11 配置自由窗口活动的大小和位置\n\n默认情况下，在自由窗口（freeform）模式下启动到不同任务栈的活动将位于屏幕中心，其大小由系统决定。此窗口的位置和维度可以通过通过\
  \ `ActivityOptions` 类将启动边界设置（launch bounds settings）传递给 `intent` 来控制。此过程的第一步是创建一个\
  \ `Rect` 对象，并配置代表活动窗口的矩形的左侧（X）、顶部（Y）、右侧（X）和底部（Y）坐标。例如，以下代码创建了一个 `Rect` 对象，其左上角位于坐标\
  \ (0, 0)，右下角位于 (100, 100)：\n\n```kotlin\nval rect = Rect(0, 0, 100, 100)\n```\n\n\
  下一步是创建 `ActivityOptions` 类的基本实例，并通过 `setLaunchBounds()` 方法使用 `Rect` 设置对其初始化：\n\n\
  ```kotlin\nval options = ActivityOptions.makeBasic()\nval bounds = options.setLaunchBounds(rect)\n\
  ```\n\n最后，将 `ActivityOptions` 实例转换为 `Bundle` 对象并与 `Intent` 对象一起传递给 `startActivity()`\
  \ 方法：\n\n```kotlin\nstartActivity(i, bounds.toBundle())\n```\n\n将这些步骤结合起来，代码序列如下：\n\
  \n```kotlin\nval i = Intent(this, SecondActivity::class.java)\ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT\
  \ or\n           Intent.FLAG_ACTIVITY_MULTIPLE_TASK or\n           Intent.FLAG_ACTIVITY_NEW_TASK)\n\
  val rect = Rect(0, 0, 100, 100)\nval options = ActivityOptions.makeBasic()\nval\
  \ bounds = options.setLaunchBounds(rect)\nstartActivity(i, bounds.toBundle())\n\
  ```\n\n当源活动处于自由窗口模式时，通过 `intent` 启动第二个活动，新的活动活动窗口将以 `Rect` 对象中定义的位置和维度出现。\n\n##\
  \ 73.12 总结\n\nAndroid 7 引入了多窗口支持，该系统允许屏幕上同一时间显示多个活动。此功能现在构成了为折叠设备提供支持的基础。多窗口支持提供的三种模式是分屏（split-screen）、自由窗口（freeform）和画中（picture-in-picture）。在分屏模式下，屏幕水平或垂直分为两个窗格，每个窗格中显示一个活动。自由窗口模式仅支持某些\
  \ Android 设备，允许每个活动出现在独立的、可移动且可调整大小的窗口中。如本章概述，Android SDK 中提供了许多方法和属性设置，用于检测、响应和控制应用内部的多窗口行为。\n\
  \n# 74. Android SQLite 数据库概览\n\n不需要存储至少某些持久化数据的移动应用寥寥无几。数据库的使用大多数应用程序必不可少的方面，从几乎完全由数据驱动的应用，到只需要存储少量数据（例如游戏的当前得分）的应用都是。\n\
  \n考虑到典型 Android 应用具有某种短暂的生命周期，持久化数据存储的重要性变得更加明显。由于 Android 运行时系统随时存在终止应用程序组件以释放资源的风险，制定一个避免数据丢失的全面数据存储策略是任何应用开发策略设计和实施的关键因素。\n\
  \n本章将提供与 Android 操作系统绑定的 SQLite 数据库管理系统的概述，并概述提供的 Android SDK 类，以便从 Android 内部实现基于\
  \ SQLite 的持久化数据库存储。然而，在深入探讨 Android 开发背景下的 SQLite 细节之前，将对数据库和 SQL 进行简要概述。\n\n##\
  \ 74.1 理解数据库表\n\n数据库表（Database Tables）提供了数据库中最基础的数据结构级别。每个数据库都可能包含多个表，每个表都设计用于持有特定类型的信息。例如，数据库可能包含一个客户表，其中包含特定业务每个客户的名称、地址和电话。同一个数据库可能还包含一个产品表，用于存储该业务销售的商品描述以及相关的产品代码。\n\
  \n数据库中的每个表都分配有一个名称，该名称在该特定数据库中必须唯一。表名一旦分配给某个数据库中的表，除非在另一个数据库范围内，否则不能用于另一个表。\n\n\
  ## 74.2 引入数据库模式（Schema）\n\n数据库模式（Database Schemas）定义了存储在数据库表中的数据的特征。例如，客户表的模式可能定义客户名称为长度不超过\
  \ 20 个字符的字符串，客户电话为特定格式的数值数据字段。\n\n模式还用于定义整个数据库的结构以及每个数据库包含的各种表之间的关系。\n\n## 74.3\
  \ 列和数据类型\n\n在此阶段，将数据库表视为类似于电子表格是有帮助的，数据存储在行和列中。\n\n每一列（Column）代表对应表中的一个数据字段。例如，表中的名称、地址和电话数据字段都是列。\n\
  \n每一列反过来被定义包含某种类型的数据。因此，设计用于存储数字的列将被定义为包含数值数据。\n\n## 74.4 数据库行\n\n每个保存到表的新记录都存储在行（Row）中。每一行反过来由与保存记录相关的列组成。再次考虑本章之前描述的电子表格类比。客户表中的每个条目等同于表格中的行，每一列包含客户的数据。当向表中添加新客户时，会创建一个新行并将该客户的数据存储在相应的列中。行也被称为记录或条目，这些术语通常可以换使用。\n\
  \n## 74.5 引入主键\n\n每个数据库表都应该包含一个或多个可以唯一标识表中每一行的列。这在数据库术语中被称为主键（Primary Keys）。例如，一个表可以使用银行账户号码列作为主键。或者，客户表可以使用客户的社会安全码作为主键。主键允许数据库管理系统唯一地标识表中的特定行。没有主键，将无法检索或删除表中的特定行，因为无法确定选择了正确的行。例如，假设有一个表将客户的姓氏定义为主键。那么，请想象一下如果数据库中记录了多个姓“Smith”的客户，可能会出现什么问题。如果没有某种保证可以唯一标识特定行的方法，就无法确保在任何时候访问正确的数据。\n\
  \n主键可以由表中的单列或多列组成。要符合单列主键的条件，没有两个行包含相同的主键值。当使用多个列来构建主键时，单个列的值不需要唯一，但所有列的值组合在一起必须是唯一的。\n\
  \n## 74.6 什么是 SQLite?\n\n\n\n\nSQLite 是一种嵌入式关系型数据库管理系统（RDBMS）。大多数关系型数据库（以 Oracle、SQL\
  \ Server 和 MySQL 为例）都是独立的服务器进程，它们与需要数据库访问的应用程序独立运行并相互协作。SQLite 被称为嵌入式，是因为它是以库的形式提供的，并链接到应用程序中。因此，后台没有运行独立的数据库服务器。所有的数据库操作都是通过调用\
  \ SQLite 库中包含的函数，在应用程序内部处理的。\n\nSQLite 的开发者已将该技术归入公共领域，因此它现在已成为广泛部署的数据库解决方案。\n\n\
  SQLite 使用 C 语言编写，因此 Android SDK 为底层数据库接口提供了一个基于 Java 的“封装器”。这本质上包含了一组类，可以在应用程序的\
  \ Java 或 Kotlin 代码中使用这些类来创建和管理基于 SQLite 的数据库。\n\n有关 SQLite 的更多信息，请参阅 [`www.sqlite.org`](http://www.sqlite.org)。\n\
  \n## 74.7 结构化查询语言 (SQL)\n\nSQLite 数据库中的数据通过一种名为结构化查询语言的高级语言访问。这通常缩写为 `SQL`，读音为 sequel。`SQL`\
  \ 是大多数关系型数据库管理系统所使用的标准语言。SQLite 大部分符合 `SQL-92` 标准。\n\n`SQL` 本质上是一种非常简单且易于使用的语言，专门设计用于启用读写数据库数据。由于\
  \ `SQL` 包含一小部分关键字，可以快速学习。此外，大多数 DBMS 实现之间的 `SQL` 语法或多程度上相同，因此在学习了某个系统的 `SQL` 后，你的技能很可能会迁移到其他数据库管理系统。\n\
  \n虽然本章将使用一些基础的 `SQL` 语句，但对 `SQL` 的详细概述超出了本书的范围。然而，还有许多其他资源可以提供比我们在此章节中能够提供的要好得多的\
  \ `SQL` 概述。\n\n## 74.8 在 Android 虚拟设备 (AVD) 上尝试 SQLite\n\n对于对通用数据库（特别是 SQLite）不熟悉的读者来说，直接开始创建一个使用\
  \ SQLite 的 Android 应用程序可能看起来有些令人生畏。幸运的是，Android 自带预装了 SQLite，包括一个交互式环境，允许从连接到运行中的\
  \ Android AVD 模拟器实例的 `adb shell` 会话发出 `SQL` 命令。这既是学习 SQLite 和 `SQL` 的有效方法，也是识别模拟器中运行应用程序所创建的数据库问题的宝贵工具。\n\
  \n要启动交互式 SQLite 会话，首先运行 AVD 会话。这可以通过 Android Studio 启动 Android 虚拟设备管理器（Tools ->\
  \ AVD Manager），选择一个之前配置过的 AVD 并点击启动按钮来实现。\n\n一旦 AVD 启动并运行，打开终端（Terminal）或命令提示符（Command-Prompt）窗口，使用\
  \ `adb` 命令行工具连接到模拟器（注意 `-e` 标志指示工具查找要连接的模拟器，而不是物理设备）：\n\n```bash\nadb –e shell\n\
  ```\n\n连接后，shell 环境将提供一个命令提示符，可以在其中输入命令。首先使用 `su` 命令获取超级用户权限：\n\n```\nGeneric_x86:/\
  \ su\nroot@android:/ #\n```\n\n如果出现消息表示不允许超级用户权限，则可能是该 AVD 实例包含了 Google Play 支持。要解决这个问题，请创建一个新的\
  \ AVD，并在“Choose a device definition”屏幕上选择一个在“Play Store”列没有标记的设备。\n\n存储在 SQLite\
  \ 数据库中的数据实际上存储在运行应用程序的 Android 设备的文件系统的数据库文件中。默认情况下，这些数据库文件的文件系统路径如下：\n\n`/data/data/<package\
  \ name>/databases/<database filename>.db`\n\n例如，如果一个包名为 `com.example.MyDBApp` 的应用程序创建了一个名为\
  \ `mydatabase.db` 的数据库，则设备上的文件路径如下：\n\n`/data/data/com.example.MyDBApp/databases/mydatabase.db`\n\
  \n出于本次练习的目的，请在 `adb shell` 中切换目录到 `/data/data` 并创建一个适用于 SQLite 实验的子目录结构：\n\n```bash\n\
  cd /data/data\nmkdir com.example.dbexample\ncd com.example.dbexample\nmkdir databases\n\
  cd databases\n```\n\n为数据库文件创建了合适的位置后，如下方式启动交互式 SQLite 工具：\n\n```\nroot@android:/data/data/databases\
  \ # sqlite3 ./mydatabase.db\nsqlite3 ./mydatabase.db\nSQLite version 3.8.10.2 2015-05-20\
  \ 18:17:19\nEnter \".help\" for usage hints.\nsqlite>\n```\n\n在 `sqlite>` 提示符下，可以输入命令来执行任务，如创建表、插入和检索数据。例如，要在我们的数据库中创建一个包含存储\
  \ ID、名称、地址和电话号码字段的新表，需要以下语句：\n\n```sql\ncreate table contacts (_id integer primary\
  \ key autoincrement, name text, address text, phone text);\n```\n\n注意，表中的每行都应该有一个对于该行唯一的主键。在上面的示例中，我们将\
  \ `_id` 字段指定为主键，将其声明为 `integer` 类型，并要求 SQLite 在每次添加新行时自动增加该数字。这是确保每行都有有唯一主键的常用方法。在大多数其他平台上，主键名称的选择是任意的。但在\
  \ Android 的情况下，将键命名为 `_id` 是至关重要的，以便使用所有的 Android 数据库类来访问数据库。其余字段均声明为 `text` 类型。\n\
  \n要列出当前选择数据库中的表，使用 `.tables` 语句：\n\n```sql\nsqlite> .tables\ncontacts\n```\n\n向表中插入记录：\n\
  \n```sql\nsqlite> insert into contacts (name, address, phone) values (\"Bill Smith\"\
  , \"123 Main Street, California\", \"123-555-2323\");\nsqlite> insert into contacts\
  \ (name, address, phone) values (\"Mike Parks\", \"10 Upping Street, Idaho\", \"\
  444-444-1212\");\n```\n\n从表中检索所有行：\n\n```sql\nsqlite> select * from contacts;\n\
  1|Bill Smith|123 Main Street, California|123-555-2323\n2|Mike Parks|10 Upping Street,\
  \ Idaho|444-444-1212\n```\n\n提取符合特定标准的行：\n\n```sql\nsqlite> select * from contacts\
  \ where name=\"Mike Parks\";\n2|Mike Parks|10 Upping Street, Idaho|444-444-1212\n\
  ```\n\n退出 sqlite3 交互环境：\n\n```sql\nsqlite> .exit\n```\n\n当在模拟器环境中运行 Android 应用程序时，任何数据库文件将按照讨论的路径约定创建在模拟器的文件系统中。这样做的好处是你可以通过\
  \ `adb` 连接、导航到数据库文件位置、将其加载到 `sqlite3` 交互工具并对数据进行操作，以识别应用程序代码中可能出现的问题。\n\n同样重要的是，虽然可以通过\
  \ `adb shell` 连接到物理 Android 设备，但默认情况下 shell 并未获得足够的权限来创建和管理 SQLite 数据库。因此，数据库问题的调试最好使用\
  \ AVD 会话进行。\n\n## 74.9 Android Room 持久化库\n\n\n\n如前所述，SQLite 是用 `C` 语言编写的，而 Android\
  \ 应用程序主要使用 `Java` 或 `Kotlin` 开发。为了弥补过去的这种“语言鸿沟”，`Android SDK` 包含了一组类，它们在 `SQLite`\
  \ 数据库管理系统之上提供了一个层。尽管这些类在 `SDK` 中仍然可用，但使用这些类仍需编写大量的代码，并且没有利用新的架构指南以及如 `LiveData`\
  \ 和生命周期管理等特性。为了解决这些缺点，`Android Jetpack Architecture Components` 包含了 `Room` 持久化库。该库在\
  \ `SQLite` 数据库系统之上提供了一个层级接口，使其能够以极少的代码在 Android 设备上本地存储数据，同时符合现代应用程序架构的建议。\n\n接下来的几章将提供使用\
  \ `Room` 持久化库进行 `SQLite` 数据库管理的概述和教程。\n\n## 74.10 总结\nSQLite 是一个轻量级的嵌入式关系型数据库管理系统，作为\
  \ Android 框架的一部分，并为 Android 应用程序实现组织的持久化数据存储提供了机制。与 `Room` 持久化库结合时，Android 提供了一种在\
  \ Android 内部实现数据存储的现代方式。\n\n本章的目标是在 Android 应用程序开发的背景下，提供通用数据库以及 `SQLite` 的概述。接下来的章节将提供\
  \ `Room` 持久化库的概述，之后我们将学习创建一个示例应用程序。\n\n# 75. Android Room 持久化库\n`Room` 持久化库包含在 `Android\
  \ Architecture Components` 中，专门设计用于更方便地为 Android 应用程序添加数据库存储支持，且这种方式与 Android 架构指南保持一致。在上一章涵盖了\
  \ `SQLite` 数据库的基础知识后，本章将探索基于 `Room` 的数据库管理的基本概念、在 Android 应用程序中协同工作实现 `Room` 支持的关键元素，以及这些元素在架构和编码方面是如何实现的。在涵盖这些主题后，接下来的两章将以示例\
  \ `Room` 数据库项目的形式将理论付诸实践。\n\n### 75.1 重新审视现代应用架构\n名为“使用 Jetpack 构建现代 Android 应用架构”章节介绍了现代应用架构的概念，并强调了分离应用内不同责任区域的重要性。图\
  \ 75-1 所示的图概述了典型 Android 应用程序的推荐架构：\n\n![](img/room_diagram_1.png)\n图 75-1\n\n由于本书之前的章节已详细介绍了该架构架构的前三个层级，现在是时候在\
  \ `Room` 持久化库的范围内开始探索仓库和数据库架构层了。\n\n### 75.2 Room 数据库持久化的关键元素\n在章节稍后进行更详细的讨论之前，首先值得总结使用\
  \ `Room` 持久化库操作 `SQLite` 数据库涉及的关键元素：\n\n### 75.2.1 仓库 (Repository)\n如前所述，仓库模块包含了直接处理应用程序所用所有数据源所需代码。这避免了\
  \ UI 控制器和 `ViewModel` 需要包含直接访问数据库或网络服务等源的代码。\n\n### 75.2.2 Room 数据库 (Room Database)\n\
  `room database` 对象提供了指向底层 `SQLite` 数据库的接口。它还为仓库提供了访问数据访问对象（`DAO`）的权限。应用程序应该只有一个\
  \ `room database` 实例，该实例可以被用于访问多个数据库表。\n\n### 75.2.3 数据访问对象 (DAO)\n`DAO` 包含了仓库在\
  \ `SQLite` 数据库中插入、检索和删除数据所需的 `SQL` 语句。这些 `SQL` 语句映射到方法，然后从仓库内部调用这些方法来执行相应的查询。\n\n\
  ### 75.2.4 实体 (Entities)\n实体是定义数据库中表模式的类，它定义了表名、列名和数据类型，并标识哪一列是主键。除了声明表结构外，实体类还包含\
  \ getter 和 setter 方法，以提供对这些数据字段的访问。`DAO` 响应 `SQL` 查询方法调用返回给仓库的数据将以这些实体类实例的形式存在。然后调用\
  \ getter 方法从实体对象中提取数据。同样地，当仓库需要向数据库写入新记录时，它会创建一个实体实例，通过 setter 调用在对象上配置值，然后调用 `DAO`\
  \ 中声明的 `insert` 方法，传递要保存的实体实例。\n\n### 75.2.5 SQLite 数据库 (SQLite Database)\n负责存储和提供数据访问的实际\
  \ `SQLite` 数据库。应用程序代码（包括仓库）绝不应直接访问此底层数据库。所有的数据库操作都通过 `room database`、`DAOs` 和实体的组合来完成。\n\
  \n图 75-2 中的架构图说明了这些不同元素如何交互以便在 Android 应用程序中提供基于 `Room` 的数据库存储：\n\n![](img/room_architecture_diagram.png)\n\
  图 75-2\n\n上述架构图中的编号的连接可以总结如下：\n1. 仓库与 `Room Database` 交互以获取数据库实例，该实例反过来用于获取 `DAO`\
  \ 实例的引用。\n2. 仓库创建实体并配置数据，然后将它们传递给 `DAO` 用于搜索和插入操作。\n3. 仓库调用 `DAO` 的方法并传递要插入数据库的实体，并在响应搜索查询时返回实体实例。\n\
  4. 当 `DAO` 有结果要返回给仓库时，它会将这些结果封装成实体对象。\n5. `DAO` 与 `Room Database` 交互以启动数据库操作并处理结果。\n\
  6. `Room Database` 处理与底层 `SQLite` 数据库的所有底层交互，提交查询并接收结果。\n\n在了使用 `Room` 持久库进行数据库访问的基本元素后，现在是时候详细探索实体、`DAOs`、`room\
  \ databases` 和仓库了。\n\n## 75.3 理解实体\n每个数据库表都有一个关联的实体类。该类定义了表的模式，并呈现为一个插了一些特殊 `Room`\
  \ 注解的标准 Kotlin 类。一个声明要存储在数据库表中的 Kotlin 类示例如下：\n\n```kotlin\nclass Customer {\n \
  \   var id: Int = 0\n    var name: String? = null\n    var address: String? = null\n\
  \n    constructor() {}\n\n    constructor(id: Int, name: String, address: String)\
  \ {\n        this.id = id\n        this.name = name\n        this.address = address\n\
  \    }\n\n    constructor(name: String, address: String) {\n        this.name =\
  \ name\n        this.address = address\n    }\n}\n```\n\n按照目前的实现方式，上述代码声明了一个基础 Kotlin\
  \ 类，包含若干代表数据库表字段的变量以及一组 getter 和 setter 方法。然而，该类尚不是实体。为了使该类成为实体并使其在 `SQL` 语句中可用，需要按如下添加一些\
  \ `Room` 注解：\n\n```kotlin\n@Entity(tableName = \"customers\")\nclass Customer {\n\
  \    @PrimaryKey(autoGenerate = true)\n    @NonNull\n    @ColumnInfo(name = \"customerId\"\
  )\n```\n\n\n\n\n```kotlin\nclass Customer {\n    var id: Int = 0\n\n    @ColumnInfo(name\
  \ = \"customerName\")\n    var name: String? = null\n    var address: String? =\
  \ null\n\n    constructor() {}\n\n    constructor(id: Int, name: String, address:\
  \ String) {\n        this.id = id\n        this.name = name\n        this.address\
  \ = address\n    }\n\n    constructor(name: String, address: String) {\n       \
  \ this.name = name\n        this.address = address\n    }\n}\n```\n\n上述注解首先声明该类表示一个实体，并分配了表名“customers”。该名称是在\
  \ DAO SQL 语句中引用该表时将使用的名称：\n\n```kotlin\n@Entity(tableName = \"customers\")\n```\n\
  \n每个数据库表都需要一个列作为主键。在这种情况下，customer id 被声明为主键。还添加了注解，以指定一个在 SQL 查询中引用的列名，并指示该字段不能存储空值。最后，`id`\
  \ 值被配置为自动生成。这意味着分配给新记录的 `id` 将由系统自动生成，以避免键冲突。\n\n```kotlin\n@PrimaryKey(autoGenerate\
  \ = true)\n@NonNull\n@ColumnInfo(name = \"customerId\")\nvar id: Int = 0\n```\n\n\
  customer name 字段也分配了一个列名。但请注意，`address` 字段没有分配列名。这意味着 `address` 数据仍然存储在数据库中，但不需要在\
  \ SQL 语句中引用。如果实体中的某个字段不需要存储在数据库中，只需使用 `@Ignore` 注解即可：\n\n```kotlin\n@Ignore\nvar\
  \ MyString: String? = null\n```\n\n注解也可以包含在实体类中，以使用被称为“外键”的关系型数据库概念与其他实体建立关系。外键允许一个表引用另一个表中的主键。例如，可以在名为\
  \ `Purchase` 的实体与我们现有的 `Customer` 实体之间建立如下关系：\n\n```kotlin\n@Entity(ForeignKeys\
  \ = @ForeignKey(entity = Customer.class,\n        parentColumns = \"id\", childColumns\
  \ = \"purchaseId\"))\nclass Purchase {\n    @PrimaryKey(autoGenerate = true)\n \
  \   @NonNull\n    @ColumnInfo(name = \"purchaseId\")\n    var int id: Int = 0\n\
  \    @ColumnInfo(name = \"productName\")\n    var name: String? = null\n}\n```\n\
  \n## 75.4 数据访问对象 (Data Access Objects)\n\n数据访问对象提供了一种访问存储在 SQLite 数据库中的数据的方法。`DAO`\
  \ 被声明为一个标准的 Kotlin 接口，带有一些额外的注解，将特定的 SQL 语句映射到方法，这些方法随后可以由仓库调用。\n\n第一步是创建接口并使用 `@Dao`\
  \ 注解将其声明为 DAO：\n\n```kotlin\n@Dao\ninterface CustomerDao {\n}\n```\n\n接下来，添加由 SQL\
  \ 语句和对应方法名的条目。例如，下面的声明允许通过调用名为 `getAllCustomers()` 的方法检索 `customers` 表中的所有行：\n\n\
  ```kotlin\n@Dao\ninterface CustomerDao {\n    @Query(\"SELECT * FROM customers\"\
  )\n    fun getAllCustomers: LiveData<List<Customer>>\n}\n```\n\n注意，`getAllCustomers()`\
  \ 方法返回一个 `List` 对象，其中包含从数据库表中检索出的对应每条记录的 `Customer` 实体对象。`DAO` 还使用了 `LiveData`，以便仓库能够观察数据库的变化。\n\
  \n参数也可以传递给方法并在相应的 SQL 语句中引用。考虑下面的 DAO 声明，它搜索与客户名称匹配的数据库记录（注意 `WHERE` 条件中引用的列名是分配给实体类中列的）：\n\
  \n```kotlin\n@Query(\"SELECT * FROM customers WHERE name = :customerName\")\nfun\
  \ findCustomer(customerName: String): List<Customer>\n```\n\n在这个示例中，方法传递了一个字符串值，该值通过在变量名前前加冒号\
  \ (`:`) 包含在 SQL 语句中。\n\n基础的插入操作可以使用 `@Insert` 方便注解声明如下：\n\n```kotlin\n@Insert\n\
  fun addCustomer(Customer customer)\n```\n\n这被称为方便注解，因为 Room 持久库可以推断出传递给 `addCustomer()`\
  \ 方法的 `Customer` 实体将插入数据库，而不需要提供 SQL 插入语句。也可以在单个事务中插入多条数据库记录，如下：\n\n```kotlin\n\
  @Insert\nfun insertCustomers(Customer... customers)\n```\n\n下面的 DAO 声明删除了所有与提供的客户名称匹配的记录：\n\
  \n```kotlin\n@Query(\"DELETE FROM customers WHERE name = :name\")\nfun deleteCustomer(String\
  \ name)\n```\n\n除了使用 `@Query` 注解执行删除操作外，还可以使用 `@Delete` 方便注解。在下面的示例中，传递给 `deleteCustomers()`\
  \ 方法的所有记录将被删除：\n\n```kotlin\n@Delete\nfun deleteCustomers(Customer... customers)\n\
  ```\n\n`@Update` 注解在更新记录时提供了类似的行为：\n\n```kotlin\n@Update\nfun update(Customer...\
  \ customers)\n```\n\n这些类型操作的 DAO 方法也可以声明返回一个 `int`，表示受影响的行数，例如：\n\n```kotlin\nfun\
  \ deleteCustomers(Customer... customers): int\n```\n\n`Room` 数据库通过扩展 `RoomDatabase`\
  \ 类创建，并作为实际数据库之层。该类负责创建新实例并提供对 DAO 实例的访问。Room 库了一个用于创建实例的构建器。每个 Android 应用都应该有一个数据库实例，因此最好在类内部实现代码以防止出现多个实例。以下代码概述了一个使用的\
  \ Room 实现：\n\n```kotlin\nimport android.content.Context\nimport android.arch.room.Database\n\
  import android.arch.room.Room\n\n@Database(entities = [Customer::class], version\
  \ = 1)\nabstract class CustomerDatabase : RoomDatabase() {\n    abstract fun customerDao():\
  \ CustomerDao\n\n    companion object {\n        private var INSTANCE: CustomerDatabase?\
  \ = null\n\n        internal fun getDatabase(context: Context): CustomerDatabase?\
  \ {\n            if (INSTANCE == null) {\n                synchronized(CustomerDatabase::class.java)\
  \ {\n                    if (INSTANCE == null) {\n                        INSTANCE\
  \ = Room.databaseBuilder<CustomerDatabase>(\n                            context.applicationContext,\n\
  \                            CustomerDatabase::class.java,\n                   \
  \         \"customer_database\"\n                        ).build()\n           \
  \         }\n                }\n            }\n            return INSTANCE\n   \
  \     }\n    }\n}\n```\n\n上述示例中重要的区域是类声明上方的注解（声明工作的实体）、检查类实例是否已创建的代码以及为实例分配名称“customer_database”。\n\
  \n## 75.6 仓库 (Repository)\n\n仓库负责获取 Room 数据库实例，使用该实例访问关联的 DAO，然后调用 DAO 方法执行数据库操作。一个为\
  \ Room 数据库设计的典型构造函数如下：\n\n```kotlin\nclass CustomerRepository(application: Application)\
  \ {\n    private var customerDao: CustomerDao?\n    init {\n        val db: CustomerDatabase?\
  \ = CustomerDatabase.getDatabase(application)\n    }\n}\n```\n\n\n\n\n\n```kotlin\n\
  customerDao = db?.customerDao()\n```\n\n一旦仓库访问了 `DAO`，它就可以调用数据访问方法。例如，下面的代码调用了 `getAllCustomers()`\
  \ DAO 方法：\n\n```kotlin\nval allCustomers: LiveData<List<Customer>>?\nallCustomers\
  \ = customerDao.getAllCustomers()\n```\n\n在调用 DAO 方法时，需要注意这一点：除非该方法返回一个 `LiveData`\
  \ 实例（该实例会自动在单独线程上运行查询），否则不能在应用的主线程上执行该操作。事实上，尝试这样做会导致应用崩溃，并输出如下诊断信息：\n\n`Cannot\
  \ access database on the main thread since it may potentially lock the UI for a\
  \ long period of time`\n\n由于某些数据库事务可能需要更长时间才能完成，因此在单独线程上运行这些操作可以避免应用出现死锁假顿现象。正如在标题为“Android\
  \ Room 数据库和仓库教程”的章节中所所示，通过使用 `AsyncTask` 类可以轻松解决这个问题（如需更多信息或回顾如何使用 `AsyncTask`，请参阅标题为“线程和\
  \ AsyncTask 概述”的章节）。\n\n## 75.7 内存数据库\n\n本章概述的示例使用了存在于 Android 设备持久化存储上的数据库文件的 `SQLite`\
  \ 数据库。这确保了数据在应用进程终止后仍然存在。\n\n`Room` 数据库持久化库也支持内存数据库。这些数据库完全驻留在内存中，并在应用终止时丢失。与内存数据库工作时唯一需要的更改是调用\
  \ `Room Database` 类的 `Room.inMemoryDatabaseBuilder()` 方法，而不是 `Room.databaseBuilder()`。下面的代码显示了方法调用之间的区别（注意内存数据库不需要数据库名称）：\n\
  \n```kotlin\n// 创建一个基于文件存储的数据库\nINSTANCE = Room.databaseBuilder<CustomerRoomDatabase>(context.applicationContext,\n\
  \        CustomerRoomDatabase::class.java, \"customer_database\")\n        .build()\n\
  \n// 创建一个内存数据库\nINSTANCE = Room.inMemoryDatabaseBuilder<CustomerRoomDatabase>(\n\
  \                context.getApplicationContext(),\n                CustomerRoomDatabase.class)\n\
  \            .build()\n```\n\n## 75.8 总结\n\nAndroid `Room` 持久化库包含在 Android 架构组件中，并作为底层\
  \ `SQLite` 数据库之上的抽象层。该库的设计旨在使其符合 Android 架构指南的同时，使数据库操作变得简单。本章介绍了在 Android 应用项目中构建基于\
  \ `Room` 的数据库存储的不同交互元素，包括实体（entities）、仓库（repositories）、数据访问对象（DAO）、注解以及 `Room Database`\
  \ 实例。\n\n在涵盖了 `SQLite` 和 `Room` 架构组件的基础之后，下一步是创建一个将这些理论付诸的示例应用程序。由于示例的用户界面需要基于表单的布局，下一章标题为“Android\
  \ TableLayout 和 TableRow 教程”，它将稍微偏离核心主题，介绍 `TableLayout` 和 `TableRow` 视图的基础。\n\n\
  # 76. Android TableLayout 和 TableRow 教程\n\n在开始编写本书的下一章（“Android Room 数据库和仓库教程”）时，最初打算包含为\
  \ `Room` 数据库示例应用设计用户界面布局的步骤。然而，很快发现实现用户界面的最佳方法是使用 Android 的 `TableLayout` 和 `TableRow`\
  \ 视图，并且这一主题领域值得一个独立的章节。因此，本章将专门关注下一章要完成的数据库应用程序的用户界面设计，并在此过程中花一些时间介绍 Android Studio\
  \ 中表格布局的基本概念。\n\n### 76.1 TableLayout 和 TableRow 布局视图\n\n`TableLayout` 容器视图的目的是允许用户界面元素以行和列组成的表格格式组织在屏幕上。`TableLayout`\
  \ 中的每一行都由一个 `TableRow` 实例占据，而 `TableRow` 又被划分为多个单元格，每个单元格包含一个子视图（该单元格本身也可以是一个包含多个子视图的容器）。\n\
  \n表格中的列数由列数最多的行决定，默认情况下，每列的宽度由该列中最宽的单元格定义。列可以配置为可收缩或可伸展（或两者兼有），使其相对于相对于父 `TableLayout`\
  \ 发生变化。此外，单个单元格可以配置为跨越多个列。\n\n考虑图 76-1 所示的用户界面布局：\n\n![](img/as3.2_tablelayout_complete_ui.png)\n\
  \n图 76-1\n\n从布局的视觉外观来看，很难识别用于设计界面的 `TableLayout` 结构。然而，图 76-2 所示的层级树使得结构稍微更容易理解：\n\
  \n![](img/as3.2_tablelayout_tree.png)\n\n图 76-2\n\n显然，布局由一个带有 `TableLayout`、`LinearLayout`\
  \ 和 `RecyclerView` 子视图的父 `LinearLayout` 视图组成。`TableLayout` 包含三个 `TableRow` 子视图，代表表格中的三行。`TableRows`\
  \ 包含两个子视图，每个子视图代表表格列的内容。`LinearLayout` 子视图包含三个 `Button` 子视图。\n\n图 76-2 所示的布局是下一章完成的数据库示例所需的精确布局。因此，本章的剩余部分将使用\
  \ Android Studio 布局工具逐步完成该用户界的设计。\n\n## 76.2 创建 Room 数据库项目\n\n在欢迎界面选择 Start a Android\
  \ project，在弹出的新项目对话框中选择 Fragment + ViewModel 模板，然后点击 Next 按钮。\n\n在 Name 字段输入 `RoomDemo`，并指定\
  \ `com.ebookrenzy.roomdemo` 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 26：Android\
  \ 8.0 (Oreo)，并将 Language 设置 Kotlin。\n\n## 76.3 转换为 LinearLayout\n\n在 Project 窗口（app\
  \ -> res -> layout）找到 `main_fragment.xml` 文件并双击将其加载到 Layout Editor 工具。默认情况下，Android\
  \ Studio 使用 `ConstraintLayout` 作为用户界面的根布局元素。这需要转换为垂直方向的 `LinearLayout`。在 Layout\
  \ Editor 的 Design 模式下，在 Component Tree 中找到主 `ConstraintLayout` 组件并右键点击显示图 76-3 所示的菜单，并选择\
  \ Convert View... 选项：\n\n![](img/as_3.4_table_convert_to_linear.png)\n\n图 76-3\n\
  \n在结果对话框（图 76-4）中选择转换为 `LinearLayout` 的选项，然后点击 Apply 按钮：\n\n![](img/as3.2_convert_to_linearlayout_option.png)\n\
  \n图 76-4\n\n默认情况下，布局编辑器会将 `ConstraintLayout` 转换为水平的 `LinearLayout`，因此在 Component\
  \ Tree 窗口中选择布局组件，参考 Attributes 工具窗口并将 orientation 属性更改为 vertical：\n\n![](img/as_3.4_linearlayout_change_orientation.png)\n\
  \n图 76-5\n\n\n\n\n转换完成后，选择并删除布局中默认的 `TextView` 控件。\n\n## 76.4 在用户界面中添加 TableLayout\n\
  \n在 `main_fragment.xml` 文件中，参考 `Palette`（调色板）中的 `Layouts`（布局）类别，拖放一个 `TableLayout`\
  \ 视图，使其位于 `LinearLayout` 画布区域的顶部。\n\n完成这些初始步骤后，布局的 `Component Tree`（组件树）应该类似于 图\
  \ 76-6 所示的图。\n\n![](img/as3.2_tablelayout_in_tree.png)\n\n图 76-6\n\n显然，Android Studio\
  \ 已自动向 `TableLayout` 添加了四个 `TableRow` 实例。由于此示例只需要三行，请选择并删除第四个 `TableRow` 实例。您可以随时从调色板中拖动\
  \ `TableRow` 对象并将其释放到 `Component Tree` 工具窗口中的 `TableLayout` 条目上，从而向 `TableLayout`\
  \ 添加额外的行。\n\n在选选中 `TableLayout` 后，使用 `Attributes`（属性）工具窗口将 `layout_height` 属性更改为\
  \ `wrap_content`并将 `layout_width` 更改为 `match_parent`。\n\n## 76.5 配置 TableRows\n\n\
  从调色板的 `Text` 部分，将两个 `TextView` 对象拖放到 `Component Tree` 中最顶部的 `TableRow` 条目上（图 76-7）：\n\
  \n![](img/as3.2_tablerow_textviews.png)\n\n图 76-7\n\n选择屏幕布局中最左侧的 `TextView`，并在 `Attributes`\
  \ 工具窗口中将 `text` 属性更改为“Product ID”。对最右侧的 `TextView` 重复此步骤，这次将文本更改为“Not assigned”并指定\
  \ `ID` 值为 `productID`。\n\n将另一个 `TextView` 控件拖放到 `Component Tree` 中的第二个 `TableRow`\
  \ 条目上，并将视图上的文本更改为“Product Name”。在调色板中找到 `Plain Text`（纯文本）对象并将其拖放，使其位于 图 76-8 所示的\
  \ `Product Name` `TextView` 下方。选中 `TextView`，将 `inputType` 属性从 `textPersonName`\
  \ 更改为 `none`，从 `text` 属性中删除“Name”字符串并将 `ID` 设置为 `productName`。\n\n![](img/as_3.6_tablelayout_produnt_name_row.png)\n\
  \n图 76-8\n\n将另一个 `TextView` 和一个 `Number (Decimal) Text Field`（数字文本框）拖放到第三个 `TableRow`\
  \ 上，使 `TextView` 在层次结构中位于 `Text Field` 上方。将 `TextView` 文本更改为 Product Quantity，并将\
  \ `Text Field` 对象的 `ID` 更改为 `productQuantity`。\n\n按住 Shift 点击选择布局中的所有控件（如下 图 76-9\
  \ 所示），并使用 `Attributes` 工具窗口将所有对象的 `textSize` 属性设置为 `18sp`。\n\n![](img/as_3.5_roomdemo_layout.png)\n\
  \n图 76-9\n\n在继续之前，请确保将上述步骤中添加的所有 `text` 属性提取到字符串资源中。\n\n## 76.6 向布局中添加按钮栏\n\n下一步向父\
  \ `LinearLayout` 视图添加一个 `LinearLayout (Horizontal)`（水平布局）视图，位置紧邻 `TableLayout` 视图下方。首先点击\
  \ `Component Tree` 中 `TableLayout` 条目左侧的小展开箭头，使 `TableRows` 折叠隐藏。从 `Layout Editor`\
  \ 调色板的 `Layouts` 部分拖动一个 `LinearLayout (horizontal)` 实例，将其释放到 `Component Tree` 面板中\
  \ `TableLayout` 条目的正下方，并将 `layout_height` 属性更改为 `wrap_content`：\n\n![](img/as3.2_tablelayout_add_linearlayout.png)\n\
  \n图 76-10\n\n将三个 `Button` 控件拖放到新的 `LinearLayout` 中，并为每个按钮分配内容分别为“Add”、“Find”和“Delete”的字符串资源。此类按钮栏布局中的按钮通常应以无框样式显示。对于每个按钮，使用\
  \ `Attributes` 工具窗口将样式设置更改为 `Widget.AppCompat.Button.Borderless`。将按钮的 `ID` 分别更改为\
  \ `addButton`、`deleteButton` 和 `findButton`。\n\n![](img/as_3.4_change_button_style.png)\n\
  \n图 76-11\n\n在 `Component Tree` 中选中新的水平 `LinearLayout` 视图，将 `gravity` 属性更改为 `center_horizontal`，以便按钮在显示区域水平居中。\n\
  \n## 76.7 添加 RecyclerView\n\n在 `Component Tree` 中，点击新添加的水平 `LinearLayout` 条目右侧的展开箭头，折叠所有子项。\n\
  \n从调色板的 `Containers`（容器）部分拖动 `RecyclerView` 实例并将其释放到 `Component Tree` 上，使其位于 图 76-12\
  \ 所示的按钮栏 `LinearLayout` 下方。确保 `RecyclerView` 是作为父垂直 `LinearLayout` 视图的直接子级，而不是水平按钮栏\
  \ `LinearLayout` 的子级。\n\n![](img/as_3.6_tablelayout_recyclerview.png)\n\n图 76-12\n\
  \n当 `RecyclerView` 添加到布局时，Android Studio 可能会提供将相应库添加到项目中的选项，如下所示。在继续之前点击此项：\n\n\
  ![](img/as3.5_add_dependency.png)\n\n图 76-13\n\n在布局中选中 `RecyclerView`，将视图的 `ID`\
  \ 更改为 `product_recycler`并将 `layout_height` 设置为 `match_parent`。在继续之前，检查 `Component\
  \ Tree` 中的布局结构是否与下图所示：\n\n![](img/as3.2_completed.png)\n\n图 76-14\n\n## 76.8 调整布局间距\n\
  \n只需调整部分布局间距。首先点击 `Component Tree` 面板中的第一个 `TableRow` 条目使其选中。按住键盘上的 `Cmd/Ctrl` 键并点击第二个、三个\
  \ `TableRow`、水平 `LinearLayout` 以及 `RecyclerView`，使所有五个项目被选中。在 `Attributes` 面板中找到\
  \ `layout_margin` 属性，找到后将其值更改为 `10dp`，如 图 76-15 所示：\n\n![](img/as_3.4_layout_margin.png)\n\
  \n图 76-15\n\n设置间距后，用户界面应如 图 76-1 所示。\n\n## 76.9 总结\n\nAndroid `TableLayout` 容器视图提供了一种按行列配置安排视图的方法。虽然\
  \ `TableLayout` 视图提供了整体容器，但每一行及其包含的单元格都是通过 `TableRow` 实例来实现的。在本章中，我们使用 `TableLayout`\
  \ 和 `TableRow` 设计了用户界面。\n\n# 77. Room 数据库与存储库教程\n\n本章将把 The Android Room Persistence\
  \ Library 中学到的知识与上一节创建的初始项目相结合，提供一个详细教程，演示如何使用 Room 存储库实现基于 SQLite 的存储。根据 Android\
  \ 架构指南，项目将使用 ViewModel 和 Repository（仓库）。教程将利用 The Android Room Persistence Library\
  \ 中涵盖的所有元素，包括实体、数据访问对象（DAO）、Room 数据库和异步数据库查询。\n\n## 77.1 关于 RoomDemo 项目\n\n\n\n\n\
  在前章节中创建的用户界面布局是创建一个简单的库存管理应用的第一步，该应用旨在存储产品的名称和数量。完成后，该应用将提供添加、删除和搜索数据库条目的功能，同时还会显示当前存储在数据库中的所有产品的可滚动列表。当数据库条目被添加或删除时，此产品列表将自动更新。\n\
  \n## 77.2 修改构建配置\n\n首先，启动 Android Studio 并打开上一章开始的 `RoomDemo` 项目。在向项目添加任何新类之前，第一步是在构建配置中添加一些额外的库，特别是\
  \ Room 持久化库和 RecyclerView 库。找到模块级 `build.gradle` 文件（`app -> Gradle Scripts -> build.gradle\
  \ (Module: app)`）并进行如下修改：\n\n```gradle\napply plugin: 'com.android.application'\n\
  apply plugin: 'kotlin-android'\napply plugin: 'kotlin-android-extensions'\napply\
  \ plugin: 'kotlin-kapt'\n\ndependencies {\n    implementation fileTree(dir: 'libs',\
  \ include: ['*.jar'])\n    implementation 'androidx.recyclerview:recyclerview:1.0.0'\n\
  \    implementation \"androidx.room:room-runtime:2.1.0\"\n    kapt \"androidx.room:room-compiler:2.1.0\"\
  \n}\n```\n\n## 77.3 构建实体\n\n该项目将从创建实体开始，实体定义了数据库表的结构。实体将包含一个用于产品 id 的整数、一个存储产品名称的字符串列以及另一个存储数量的整数值。product\
  \ id 列将作为主键并自动生成。表 77-1 总结了实体的结构：\n\n| 列名 | 数据类型 |\n| :--- | :--- |\n| productid\
  \ | Integer / 主键 / 自动递增 |\n| productname | String |\n| productquantity | Integer\
  \ |\n\n在 Project 工具窗口中右键点击 `app -> java -> com.ebookfrenzy.roomdemo` 项，选择 `New ->\
  \ Kotlin File/Class` 菜单选项来为实体添加类文件。在新类对话框中，将类命名为 `Product`，在列表中选择 `Class` 项并按回车键生成文件。\n\
  \n当 `Product.kt` 文件在编辑器中打开时，将其修改为如下内容：\n\n```kotlin\npackage com.ebookfrenzy.roomdemo\n\
  \nclass Product {\n    var id: Int = 0\n    var productName: String? = null\n  \
  \  var quantity: Int = 0\n\n    constructor() {}\n\n    constructor(id: Int, productname:\
  \ String, quantity: Int) {\n        this.id = id\n        this.productName = productname\n\
  \        this.quantity = quantity\n    }\n\n    constructor(productname: String,\
  \ quantity: Int) {\n        this.productName = productname\n        this.quantity\
  \ = quantity\n    }\n}\n```\n\n该类现在有了数据库表列的变量以及对应的 getter 和 setter 方法。当然，在对类添加注解之前，它不会成为实体。在编辑器中仍保留类文件的情况下，添加注解和相应的导入语句：\n\
  \n```kotlin\npackage com.ebookfrenzy.roomdemo\n\nimport androidx.annotation.NonNull\n\
  import androidx.room.ColumnInfo\nimport androidx.room.Entity\nimport androidx.room.PrimaryKey\n\
  \n@Entity(tableName = \"products\")\nclass Product {\n    @PrimaryKey(autoGenerate\
  \ = true)\n    @NonNull\n    @ColumnInfo(name = \"productId\")\n    var id: Int\
  \ = 0\n    @ColumnInfo(name = \"productName\")\n    var productName: String? = null\n\
  \    var quantity: Int = 0\n\n    constructor() {}\n\n    constructor(id: Int, productname:\
  \ String, quantity: Int) {\n        this.id = id\n        this.productName = productname\n\
  \        this.quantity = quantity\n    }\n\n    constructor(productname: String,\
  \ quantity: Int) {\n        this.productName = productname\n        this.quantity\
  \ = quantity\n    }\n}\n```\n\n这些注解声明此类为名为 `products` 的表的实体，并为 `id` 和 `name` 变量分配了列名。`id`\
  \ 列也被配置为主键并自动生成。由于主键永远不会为空，因此应用了 `@NonNull` 注解。由于在 SQL 查询中没有必要引用 `quantity` 列，因此没有为\
  \ `quantity` 变量分配列名。\n\n## 77.4 创建数据访问对象 (DAO)\n\n在定义了产品实体后，下一步是创建 DAO 接口。再次参考 Project\
  \ 工具窗口，右键点击 `app -> java -> com.ebookfrenzy.roomdemo` 项，选择 `New -> Kotlin File/Class`\
  \ 菜单选项。在新类对话框中，在 `Name` 字段输入 `ProductDao` 并从列表中选择 `Interface`。\n\n点击 OK 生成新接口，并在\
  \ `ProductDao.kt` 文件加载到代码编辑器后，进行以下更改：\n\n```kotlin\npackage com.ebookfrenzy.roomdemo\n\
  \nimport androidx.lifecycle.LiveData\nimport androidx.room.Dao\nimport androidx.room.Insert\n\
  import androidx.room.Query\n\n@Dao\ninterface ProductDao {\n    @Insert\n    fun\
  \ insert(product: Product)\n\n    @Query(\"SELECT * FROM products WHERE productName\
  \ = :name\")\n    fun find(name: String): Product?\n\n    @Query(\"DELETE FROM products\
  \ WHERE productName = :name\")\n    fun delete(name: String)\n\n    @Query(\"SELECT\
  \ * FROM products\")\n    fun getAllProducts(): LiveData<List<Product>>\n}\n```\n\
  \n`DAO` 实现 `insert`、`find` 和 `delete` 方法。`insert` 方法接收一个要存储的 `Product` 对象，而 `find`\
  \ 和 `delete` 方法接收产品名称。`getAllProducts()` 方法返回一个包含所有记录的 `LiveData` 对象。\n\n## 77.5\
  \ 添加数据库\n\n在添加仓库之前的最后一个任务是实现 Room 数据库。向项目中添加一个名为 `RoomDatabase` 的新类。文件生成后，将其修改如下如下：\n\
  \n```kotlin\npackage com.ebookfrenzy.roomdemo\n\nimport android.content.Context\n\
  import androidx.room.Database\nimport androidx.room.Room\nimport androidx.room.RoomDatabase\n\
  \n@Database(entities = [Product::class], version = 1)\nabstract class RoomDatabase\
  \ : RoomDatabase() {\n    abstract fun productDao(): ProductDao\n\n    companion\
  \ object {\n        private var INSTANCE: RoomDatabase? = null\n\n        fun getDatabase(context:\
  \ Context): RoomDatabase? {\n            if (INSTANCE == null) {\n             \
  \   synchronized(RoomDatabase::class.java) {\n                    if (INSTANCE ==\
  \ null) {\n                        INSTANCE = Room.databaseBuilder(\n          \
  \                  context.applicationContext,\n                            RoomDatabase::class.java,\n\
  \                            \"product_database\"\n                        ).build()\n\
  \                    }\n                }\n            }\n            return INSTANCE\n\
  \        }\n    }\n}\n```\n\n## 77.6 添加仓库\n\n向项目中添加一个名为 `ProductRepository` 的新类，并选择\
  \ `Class` 选项。\n\n\n\n\n`repository` 类负责代表 `ViewModel` 与 `Room` 数据库进行交互，并需要提供使用 `DAO`\
  \ 插入、删除和查询产品记录的方法。除了 `getAllProducts()` DAO 方法（返回一个 `LiveData` 对象）外，这些数据库操作都需要使用\
  \ `AsyncTask` 类在主线程之外的线程上执行。\n\n在 `ProductRepository.kt` 文件中，添加用于搜索的 `AsyncTask`\
  \ 代码。还要添加一个名为 `asyncFinished()` 的方法，该方法将被查询 `AsyncTask` 调用，以便搜索结果返回给仓库线程：\n\n```kotlin\n\
  package com.ebookfrenzy.roomdemo\n\nimport android.app.Application\nimport android.os.AsyncTask\n\
  import androidx.lifecycle.LiveData\nimport androidx.lifecycle.MutableLiveData\n\n\
  class ProductRepository(application: Application) {\n    val searchResults = MutableLiveData<List<Product>>()\n\
  \n    fun asyncFinished(results: List<Product>) {\n        searchResults.value =\
  \ results\n    }\n\n    private class QueryAsyncTask constructor(val asyncTaskDao:\
  \ ProductDao?) :\n        AsyncTask<String, Void, List<Product>>() {\n        var\
  \ delegate: ProductRepository? = null\n        override fun doInBackground(vararg\
  \ params: String): List<Product>? {\n            return asyncTaskDao?.findProduct(params[0])\n\
  \        }\n        override fun onPostExecute(result: List<Product>) {\n      \
  \      delegate?.asyncFinished(result)\n        }\n    }\n}\n```\n\n上述代码声明了一个名为\
  \ `searchResults` 的 `MutableLiveData` 变量，当异步搜索任务完成时，搜索结果就会存储其中（在随后的教程中，`ViewModel`\
  \ 内部的观察者将监控此活动数据对象）。\n\n`AsyncTask` 类包含一个构造方法，必须向其传递 `DAO` 对象的引用。`doInBackground()`\
  \ 方法接收一个包含产品名称的 `String`（用于执行搜索），将其传递给 `DAO` 的 `findProduct()` 方法，并返回匹配的 `Product`\
  \ 实体对象列表，这些对象随后会被传递给 `onPostExecute()` 方法。最后，`onPostExecute()` 方法将匹配的产品列表存储在 `searchResults`\
  \ `MutableLiveData` 对象中。\n\n仓库还需要包含以下 `AsyncTask` 实现，用于向数据库插入产品：\n\n```kotlin\n\
  private class InsertAsyncTask constructor(private val asyncTaskDao: ProductDao?)\
  \ : AsyncTask<Product, Void, Void>() {\n    override fun doInBackground(vararg params:\
  \ Product): Void? {\n        asyncTaskDao?.insertProduct(params[0])\n        return\
  \ null\n    }\n}\n```\n\n再次通过构造方法传递了 `DAO` 对象的引用，但这次 `doInBackground()` 方法传递的是一个要插入数据库的\
  \ `Product` 实体对象数组。由于应用程序一次允许添加一个新产品，该方法通过调用 `insertProduct()` DAO 方法将数组中的第一个 `Product`\
  \ 插入数据库。在这种情况下，任务不需要返回任何结果。\n\n最后一个 `AsyncTask` 将用于从数据库中删除产品，并应如下添加到 `insertAsyncTask`\
  \ 声明下方：\n\n```kotlin\nprivate class DeleteAsyncTask constructor(private val asyncTaskDao:\
  \ ProductDao?) : AsyncTask<String, Void, Void>() {\n    override fun doInBackground(vararg\
  \ params: String): Void? {\n        asyncTaskDao?.deleteProduct(params[0])\n   \
  \     return null\n    }\n}\n```\n\n定义好 `AsyncTask` 类后，`repository` 类现在需要一些可以由 `ViewModel`\
  \ 调用以启动这些操作的方法。这些方法将创建并调用适当的 `AsyncTask` 实例，并传递 `DAO` 的引用。然而，为了实现这一点，仓库需要通过 `ProductRoomDatabase`\
  \ 实例获取 `DAO` 引用。为 `ProductRepository` 类添加一个构造方法来执行这些任务：\n\n```kotlin\nclass ProductRepository(application:\
  \ Application) {\n    val searchResults = MutableLiveData<List<Product>>()\n   \
  \ private var productDao: ProductDao?\n    init {\n        val db: ProductRoomDatabase?\
  \ = ProductRoomDatabase.getDatabase(application)\n        productDao = db?.productDao()\n\
  \    }\n```\n\n有了 `DAO` 引用，就可以将这些方法添加到类中了：\n\n```kotlin\nfun insertProduct(newproduct:\
  \ Product) {\n    val task = InsertAsyncTask(productDao)\n    task.execute(newproduct)\n\
  }\n\nfun deleteProduct(name: String) {\n    val task = DeleteAsyncTask(productDao)\n\
  \    task.execute(name)\n}\n\nfun findProduct(name: String) {\n    val task = QueryAsyncTask(productDao)\n\
  \    task.delegate = this\n    task.execute(name)\n}\n```\n\n完成仓库还需要最后一项任务。用户界面中的\
  \ `RecyclerView` 需要保持数据库中存储的当前产品列表更新。`DAO` 类已经包含一个 `getAllProducts()` 方法，它使用查询选择数据库中的所有内容并将其封装在\
  \ `LiveData` 对象中返回。仓库需要在初始化后调用此方法，并将结果存储在 `LiveData` 对象中，该对象可以被 `ViewModel` 以及 UI\
  \ 控制器观察到。\n\n```kotlin\nclass ProductRepository(application: Application) {\n  \
  \  val allProducts: LiveData<List<Product>>?\n    init {\n        val db: ProductRoomDatabase?\
  \ = ProductRoomDatabase.getDatabase(application)\n        val productDao = db?.productDao()\n\
  \        allProducts = productDao?.getAllProducts()\n    }\n}\n```\n\n### 77.7 修改\
  \ ViewModel\n\n`ViewModel` 负责创建 `repository` 实例，并提供 UI 控制器利用的方法和 `LiveData` 对象，以保持界面与底层数据库同步。正如\
  \ `ProductRepository.kt` 实现所示，构造函数需要访问上下文以便获取 `Room` 数据库实例。为了在 `ViewModel` 内部访问上下文并将其传递给仓库，`ViewModel`\
  \ 需要子类 `AndroidViewModel` 而不是 `ViewModel`。因此，首先编辑 `MainViewModel.kt` 文件（位于项目工具窗口的\
  \ `app` -> `java` -> `com.ebookfrenzy.roomdemo` -> `ui.main` 下），将类改为 `AndroidViewModel`\
  \ 并实现默认构造函数：\n\n```kotlin\npackage com.ebookfrenzy.roomdemo.ui.main\n\nimport android.app.Application\n\
  import androidx.lifecycle.AndroidViewModel\nimport androidx.lifecycle.LiveData\n\
  import androidx.lifecycle.MutableLiveData\nimport com.ebookfrenzy.roomdemo.Product\n\
  import com.ebookfrenzy.roomdemo.ProductRepository\nimport androidx.lifecycle.ViewModel\n\
  \nclass MainViewModel(application: Application) : AndroidViewModel(application)\
  \ {\n    private val repository: ProductRepository = ProductRepository(application)\n\
  \    private val allProducts: LiveData<List<Product>>?\n    private val searchResults:\
  \ MutableLiveData<List<Product>>\n\n    init {\n        allProducts = repository.allProducts\n\
  \        searchResults = repository.searchResults\n    }\n}\n```\n\n\n\n\n构造函数本质上创建了一个存储库实例，然后使用它来获取结果和实时数据对象的引用，以便\
  \ UI 控制器可以观察到它们。现在 `ViewModel` 中剩下的工作是实现这些方法，这些将在 UI 控制器响应按钮点击以及在 `LiveData` 对象上设置观察者时被调用：\n\
  \n```kotlin\nfun insertProduct(product: Product) {\n    repository.insertProduct(product)\n\
  }\n\nfun findProduct(name: String) {\n    repository.findProduct(name)\n}\n\nfun\
  \ deleteProduct(name: String) {\n    repository.deleteProduct(name)\n}\n\nfun getSearchResults():\
  \ MutableLiveData<List<Product>> {\n    return searchResults\n}\n\nfun getAllProducts():\
  \ LiveData<List<Product>>? {\n    return allProducts\n}\n```\n\n## 77.8 创建产品项布局\n\
  \n数据库中的每个产品名称将出现在主用户界面的 `RecyclerView` 列表中。这需要一个简单的布局资源文件，其中包含一个用于列表每行的 `TextView`。现在，通过在\
  \ Project 工具窗口中右键点击 `app` -> `res` -> `layout` 项，并选择 `New` -> `Layout resource file`\
  \ 菜单选项添加此文件。将文件命名为 `product_list_item`，并在点击 `OK` 创建文件并将其加载到布局编辑器之前，将根元素更改为 `LinearLayout`。在布局编辑器的\
  \ Design（设计）模式下，从调色板拖 `TextView` 对象到布局中，它默认将出现在布局的顶部：\n\n![](img/as_3.5_roomdemo_item_layout.png)\n\
  \n图 77-2\n\n在布局中选中 `TextView`，使用 Attributes（属性）工具窗口将视图的 ID 设置为 `product_row`并将 `layout_height`\
  \ 设置为 `30dp`。在 Component Tree 窗口中选择 `LinearLayout` 项，并将 `layout_height` 属性设置为 `wrap_content`。\n\
  \n## 77.9 添加 RecyclerView 适配器\n\n正如“与 RecyclerView 和 CardView 组件一起工作”章节详细概述的那样，`RecyclerView`\
  \ 需要一个适配器类来提供要显示的数据。现在，通过在 Project 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.roomdemo`\
  \ -> `ui.main` 项，并选择 `New` -> `Kotlin File/Class...` 菜单。在对话框中，将类命名为 `ProductListAdapter`\
  \ 并从列表中 `Class`，然后按下键盘回车键。将生成的 `ProductListAdapter.kt` 类加载到编辑器中，按如下实现该类：\n\n```kotlin\n\
  package com.ebookfrenzy.roomdemo.ui.main\n\nimport android.view.LayoutInflater\n\
  import android.view.View\nimport android.view.ViewGroup\nimport android.widget.TextView\n\
  import androidx.recyclerview.widget.RecyclerView\nimport com.ebookfrenzy.roomdemo.Product\n\
  import com.ebookfrenzy.roomdemo.R\n\nclass ProductListAdapter(private val productItemLayout:\
  \ Int) :\n    RecyclerView.Adapter<ProductListAdapter.ViewHolder>() {\n\n    private\
  \ var productList: List<Product>? = null\n\n    override fun onBindViewHolder(holder:\
  \ ViewHolder, listPosition: Int) {\n        val item = holder.item\n        productList.let\
  \ {\n            item.text = it!![listPosition].productName\n        }\n    }\n\n\
  \    override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder\
  \ {\n        val view = LayoutInflater.from(parent.context).inflate(\n         \
  \   productItemLayout, parent, false)\n        return ViewHolder(view)\n    }\n\n\
  \    fun setProductList(products: List<Product>) {\n        productList = products\n\
  \        notifyDataSetChanged()\n    }\n\n    override fun getItemCount(): Int {\n\
  \        return if (productList == null) 0 else productList!!.size\n    }\n\n  \
  \  class ViewHolder(itemView: View) : RecyclerView.ViewHolder(itemView) {\n    \
  \    var item: TextView = itemView.findViewById(R.id.product_row)\n    }\n}\n```\n\
  \n## 77.10 准备主 Fragment\n\n最后一个需要修改的组件是 `MainFragment` 类，它需要并在 `Button` 视图上配置监听器，并在\
  \ `ViewModel` 中的实时数据对象上配置观察者。在添加此代码之前，需要进行一些准备工作以添加导入、变量并获取 id 的引用。编辑 `MainFragment.kt`\
  \ 文件并进行如下修改：\n\n```kotlin\npackage com.ebookfrenzy.roomdemo.ui.main\n\nimport androidx.lifecycle.Observer\n\
  import androidx.recyclerview.widget.LinearLayoutManager\nimport androidx.recyclerview.widget.RecyclerView\n\
  import com.ebookfrenzy.roomdemo.Product\nimport kotlinx.android.synthetic.main_fragment.*\n\
  import java.util.*\n\nclass MainFragment : Fragment() {\n    private var adapter:\
  \ ProductListAdapter? = null\n\n    override fun onActivityCreated(savedInstanceState:\
  \ Bundle?) {\n        super.onActivityCreated(savedInstanceState)\n        viewModel\
  \ = ViewModelProviders.of(this).get(MainViewModel::class.java)\n        listenerSetup()\n\
  \        observerSetup()\n        recyclerViewSetup()\n    }\n```\n\n在代码的各个阶段，应用需要清除用户界面中的产品信息。为了避免代码重复，请添加以下\
  \ `clearFields()` 便利函数：\n\n```kotlin\nprivate fun clearFields() {\n    productID.text\
  \ = \"\"\n    productName.setText(\"\")\n    productQuantity.setText(\"\")\n}\n\
  ```\n\n在应用构建和测试之前，需要将从 `onActivityCreated()` 方法调用的三个设置方法添加到类中。\n\n## 77.11 添加监听器\n\
  \n主 fragment 用户界面布局包含三个按钮，每个按钮在被用户点击时都需要执行特定任务。编辑 `MainFragment.kt` 文件并添加 `listenerSetup()`\
  \ 方法：\n\n```kotlin\nprivate fun listenerSetup() {\n    addButton.setOnClickListener\
  \ {\n        val name = productName.text.toString()\n        val quantity = productQuantity.text.toString()\n\
  \        if (name != \"\" && quantity != \"\") {\n            val product = Product(name,\
  \ Integer.parseInt(quantity))\n            viewModel.insertProduct(product)\n  \
  \          clearFields()\n        } else {\n            productID.text = \"Incomplete\
  \ information\"\n        }\n    }\n    findButton.setOnClickListener { viewModel.findProduct(productName.text.toString())\
  \ }\n    deleteButton.setOnClickListener {\n        viewModel.deleteProduct(productName.text.toString())\n\
  \        clearFields()\n    }\n}\n```\n\n`addButton` 监听器执行基础验证，确保用户输入了产品名称和数量，并使用这些数据创建一个新的\
  \ `Product` 实体（注意数量字符串被转换为整数以匹配实体类型）。随后调用 `ViewModel insertProduct()` 方法并传递 `Product`\
  \ 对象，然后清除字段。\n\n`findButton` 和 `deleteButton` 监听器将产品名称传递给 `ViewModel findProduct()`\
  \ 或 `deleteProduct()` 方法。\n\n## 77.12 添加 LiveData 观察者\n\n用户界面现在需要添加观察者，以与 `ViewModel`\
  \ 中的 `searchResults` 和 `allProducts` 实时数据对象保持同步。在 `Mainfragment.kt` 文件中，按如下实现观察者设置方法：\n\
  \n```kotlin\nprivate fun observerSetup() {\n    viewModel.getAllProducts()?.observe(this,\
  \ Observer { products ->\n        products?.let {\n            adapter?.setProductList(it)\n\
  \        }\n    })\n    viewModel.getSearchResults().observe(this, Observer { products\
  \ ->\n        products?.let {\n            if (it.isNotEmpty()) {\n            \
  \    productID.text = String.format(Locale.US, \"%d\", it[0].id)\n             \
  \   productName.setText(it[0].productName)\n                productQuantity.setText(String.format(Locale.US,\
  \ \"%d\", it[0].quantity))\n            } else {\n                productID.text\
  \ = \"No Match\"\n            }\n        }\n    })\n}\n```\n\n“所有产品”观察者只是简单地将当前产品列表传递给\
  \ `RecyclerAdapter` 的 `setProductList()` 方法，从而更新显示的列表。\n\n\n\n\n\n“搜索结果”观察者会检查数据库中是否至少找到了匹配的结果，从列表中提取第一个匹配的\
  \ `Product` 实体对象，从该对象获取数据，在必要时对其进行转换，并赋值给布局中的 `TextView` 和 `EditText` 视图。如果产品搜索失败，则将通过显示在产品\
  \ ID `TextView` 上的消息通知用户。\n\n### 77.13 初始化 RecyclerView\n\n添加以下最终设置方法来初始化和配置 `RecyclerView`\
  \ 适配器：\n\n```kotlin\nprivate fun recyclerSetup() {\n    adapter = ProductListAdapter(R.layout.product_list_item)\n\
  \    val recyclerView: RecyclerView? = view?.findViewById(R.id.product_recycler)\n\
  \    recyclerView?.layoutManager = LinearLayoutManager(context)\n    recyclerView?.adapter\
  \ = adapter\n}\n```\n\n### 77.14 测试 RoomDemo 应用\n\n在设备或模拟器上编译并运行应用，添加一些产品并确保它们自动显示在\
  \ `RecyclerView` 中。对现有产品进行搜索，并验证产品 ID 和数量字段是否相应更新。最后，输入一个现有产品的名称，将其从数据库中删除，并确认它已从\
  \ `RecyclerView` 产品列表中移除。\n\n### 77.15 总结\n\n本章演示了使用 `Room` 持久化库在 `SQLite` 数据库中存储数据。完成的项目使用了仓库（repository）将\
  \ `ViewModel` 与所有数据库操作分离，并演示了实体、`DAO` 和 room 数据库实例的创建，包括在执行某些数据库操作时使用异步任务。\n\n#\
  \ 78. 使用 Android 存储访问框架访问云存储\n\n近年来，远程存储服务（又称为“云存储”）被广泛用于存储用户文件和数据。驱动这一增长的因素有两个。其之一是，大多数移动设备现在都提供持续、高速的互联网连接，从而使得数据传输既快速又廉价。第二个因素是，与传统的计算机系统（如台式电脑和笔记本电脑）相比，这些移动设备在内部存储资源受到限制。例如，今天一台高规格的\
  \ Android 平板通常具有 128Gb 的存储容量。与带有 750Gb 硬盘驱动器的中端笔记本系统相比，文件的无缝远程存储是今天许多移动应用的一个关键需求。\n\
  \n由于这一事实，Google 在 Android 4.4 SDK 中引入了 `Storage Access Framework`（存储访问框架）。本章将提供存储访问框架的高级概述，为下一章中更详细的教程做准备，该章节标题为\
  \ An Android Storage Access Framework Example。\n\n## 78.1 存储访问框架\n\n从用户的角度来看，`Storage\
  \ Access Framework` 提供了一个直观的用户界面，允许用户在 Android 内部浏览、选择、删除和创建由存储服务（也称为文档提供者）托管的文件。通过此浏览界面（也称为选择器），用户可以浏览其所选文档提供者托管的文件（如文档、音频、图像和视频）。例如，图\
  \ 78-1 显示了选择器界面展示了由文档提供者服务托管的一系列文件：\n\n![](img/as3.0_storage_demo_picker.png)\n\n\
  图 78-1\n\n文档提供者可以从云服务到运行在客户端应用程序同一设备上的本地文档提供者不等。在编写时，与 `Storage Access Framework`\
  \ 兼容的最著名的文档提供者是 `Box`，以及意而之中的 `Google Drive`。很有可能其他云存储提供者和应用程序开发者很快也会提供符合 `Storage\
  \ Access Framework` 的服务。\n\n除了云端文档提供者外，选择器还提供了设备内部存储的访问，为应用程序用户提供一系列文件存储选项。\n\n\
  通过一组 `Intents`，Android 应用程序开发者只需几行代码即可将这些存储能力集成到应用程序中。从开发者角度来看，`Storage Access Framework`\
  \ 特别吸引人的一点是，用户选择的底层文档提供者对应用程序是完全透明的。一旦在应用程序中使用该框架实现了存储功能，它将与所有文档提供者配合，无需任何代码修改。\n\
  \n`Storage Access Framework` 的 intents 可以总结如下：\n\n- `ACTION_OPEN_DOCUMENT` – 为用户提供选择器界面的权限，以便从设备上配置的文档提供者中选择文件。选中的文件以\
  \ `Uri` 对象的格式传回应用程序。\n- `ACTION_CREATE_DOCUMENT` – 允许用户选择文档提供者、该提供者存储上的一个位置以及新文件的文件名。一旦选择，文件将由\
  \ `Storage Access Framework` 创建，并将该文件的 `Uri` 返回给应用程序进行进一步处理。\n\n## 78.3 过滤选择器文件列表\n\
  \n当启动 intent 时，选择器界面中列出的文件可以使用多种选项进行过滤。例如，考虑以下启动 `ACTION_OPEN_DOCUMENT` intent 的代码：\n\
  \n```kotlin\nval OPEN_REQUEST_CODE = 41\nval intent = Intent(Intent.ACTION_OPEN_DOCUMENT)\n\
  startActivityForResult(intent, OPEN_REQUEST_CODE)\n```\n\n执行上述代码将显示选择器界面，允许用户浏览并选择由可用文档提供者托管的文件。一旦用户选择了文件，应用程序将以\
  \ `Uri` 对象的形式获得该文件的引用。随后应用程序可以使用 `openFileDescriptor` 方法打开文件。然而，存在某种风险，并非文档提供者列出的所有文件都能通过这种方式打开。通过\
  \ `CATEGORY_OPENABLE` 选项修改 intent 可以在选择器中排除此类文件。例如：\n\n```kotlin\nval OPEN_REQUEST_CODE\
  \ = 41\nval intent = Intent(Intent.ACTION_OPEN_DOCUMENT)\nintent.addCategory(Intent.CATEGORY_OPENABLE)\n\
  startActivityForResult(intent, OPEN_REQUEST_CODE)\n```\n\n现在显示选择器时，无法使用 `openFileDescriptor()`\
  \ 方法打开的文件将被列出但不可供用户选择。\n\n另一种有效的过滤方法允许根据文件类型限制可选择的文件。这涉及指定应用程序能够处理的文件类型。例如，图像编辑应用程序可能只想向用户提供从文档提供者选择图像文件的选项。这是通过为\
  \ intent 对象配置供用户选择的文件的 MIME 类型来实现的。以下代码指定了只有图像文件适用于选择器中的选择：\n\n```kotlin\nval intent\
  \ = Intent(Intent.ACTION_OPEN_DOCUMENT)\nintent.addCategory(Intent.CATEGORY_OPENABLE)\n\
  intent.type = \"image/*\"\nstartActivityForResult(intent, OPEN_REQUEST_CODE)\n```\n\
  \n\n\n\n这可以进一步优化，将选择限制为 JPEG 图片：\n\n```kotlin\nintent.type = \"image/jpeg\"\n```\n\
  \n或者，音频播放器应用可能只能处理音频文件：\n\n```kotlin\nintent.type = \"audio/*\"\n```\n\n该音频应用可能进一步限制为仅支持播放\
  \ MP4 格式的音频文件：\n\n```kotlin\nintent.type = \"audio/mp4\"\n```\n\n在配合 `Storage Access\
  \ Framework` 时，可以使用多种 MIME 类型设置，其中更常见的可以在线上的列表中找到：\n\nhttps://en.wikipedia.org/wiki/Internet_media_type#List_of_common_media_types\n\
  \n# 78.4 处理 Intent 结果\n\n当一个 `intent` 将控制权返回给应用程序时，它是通过调用启动该 `intent` 的 activity\
  \ 的 `onActivityResult()` 方法来实现的。该方法接收了启动时传递给 `intent` 的 `requestCode`、一个指示 `intent`\
  \ 是否执行成功的 `resultCode` 以及一个包含所选文件 `Uri` 的 `resultData` 对象。例如，下面的代码可以作为处理上一节概述的 `ACTION_OPEN_DOCUMENT`\
  \ intent 结果的基础：\n\n```kotlin\npublic override fun onActivityResult(requestCode:\
  \ Int, resultCode: Int, resultData: Intent?) {\n    var currentUri: Uri? = null\n\
  \    if (resultCode == Activity.RESULT_OK) {\n        if (requestCode == OPEN_REQUEST_CODE)\
  \ {\n            resultData?.let {\n                currentUri = it.data\n     \
  \           try {\n                    val content = readFileContent(currentUri)\n\
  \                    fileText.setText(content)\n                } catch (e: IOException)\
  \ {\n                    // 在此处处理错误\n                }\n            }\n        }\n\
  \    }\n}\n```\n\n上述方法验证了 `intent` 是否成功，检查 `requestCode` 是否与文件打开请求的匹配，然后从 `intent`\
  \ 数据中提取 `Uri`。随后可以使用该 `Uri` 来读取文件内容。\n\n# 78.5 读取文件内容\n\n读取由文档提供程序托管的文件所需的具体步骤很大程度上取决于文件的类型。例如，从文本文件中读取行的步骤与读取图像或音频文件的步骤不同。\n\
  \n通过从 `Uri` 对象中提取文件描述符，然后将图像解码为 `BitmapFactory` 实例，可以将图像文件分配给 `Bitmap` 对象。例如：\n\n\
  ```kotlin\nval pFileDescriptor = contentResolver.openFileDescriptor(uri, \"r\")\n\
  val fileDescriptor = pFileDescriptor.fileDescriptor\nval image = BitmapFactory.decodeFileDescriptor(fileDescriptor)\n\
  pFileDescriptor.close()\n\nval myImageView = ImageView(this)\nmyImageView.setImageBitmap(image)\n\
  ```\n\n注意，文件描述符是以“r”模式打开的。这表示文件将用于用于读取。其他选项包括用于写访问的“w”以及用于读写写访问的“rwt”，其中文件中现有的内容将被新内容截断。\n\
  \n读取文本文件的内容需要稍多的工作并并使用 `InputStream` 对象。例如，下面的代码从文本文件中读取行：\n\n```kotlin\nval inputStream\
  \ = contentResolver.openInputStream(uri)\nval reader = BufferedReader(InputStreamReader(inputStream))\n\
  var currentline = reader.readLine()\nwhile (currentline != null) {\n    // 对文件中的每一行进行某些操作\n\
  }\ninputStream.close()\n```\n\n# 78.6 向文件写入内容\n\n写入由文档提供程序托管的打开文件与读取类似，区别在于使用的是输出流而不是输入流。例如，下面的代码将文本写入指定的\
  \ `Uri` 所引的存储文件的输出流中：\n\n```kotlin\ntry {\n    val pfd = contentResolver.openFileDescriptor(uri,\
  \ \"w\")\n    val fileOutputStream = FileOutputStream(pfd.fileDescriptor)\n    val\
  \ textContent = fileText.toString()\n    fileOutputStream.write(textContent.toByteArray())\n\
  \    fileOutputStream.close()\n    pfd.close()\n} catch (e: FileNotFoundException)\
  \ {\n    e.printStackTrace()\n} catch (e: IOException) {\n    e.printStackTrace()\n\
  }\n```\n\n首先，从 `Uri` 中提取文件描述符，随后用它获取输出流。\n\n# 78.7 删除文件\n\n能否从存储中删除文件取决于提供程序是否支持删除。假设允许删除，可以如下所示对\
  \ `Uri` 执行删除：\n\n```kotlin\nif (DocumentsContract.deleteDocument(contentResolver,\
  \ uri)) {\n    // 删除成功\n} else {\n    // 删除失败\n}\n```\n\n# 78.8 获取对文件的持久访问权限\n\n\
  当应用程序通过 `Storage Access Framework` 获取文件权限时，该访问将一直有效，直到运行该应用程序的设备重启。可以通过“获取”必要的权限来获得对特定文件的持久访问权限。例如，下面的代码对\
  \ `Uri` 持久化了读写权限：\n\n```kotlin\nval takeFlags = intent.flags and (Intent.FLAG_GRANT_READ_PERMISSION\
  \ or Intent.FLAG_GRANT_WRITE_PERMISSION)\ncontentResolver.takePersistablePermission(uri,\
  \ takeFlags)\n```\n\n一旦应用程序获取了文件的权限，并且假设 `Uri` 已经被应用程序保存，用户应该能够继续访问该文件，而无需用户从选择器中重新选择。\n\
  \n如果在任何时候不再需要这些持久权限，可以通过调用 `content resolver` 的 `releasePersistablePermission()`\
  \ 方法来释放：\n\n```kotlin\nval takeFlags = intent.flags and (Intent.FLAG_GRANT_READ_PERMISSION\
  \ or Intent.FLAG_GRANT_WRITE_PERMISSION)\ncontentResolver.releasePersistablePermission(uri,\
  \ takeFlags)\n```\n\n# 78.9 总结\n\n考虑多年来人们对存储定义的演是非常有趣的。“存储”一词曾与大容量内置硬盘等同名词，但现在它同样可能指的是托管在远程云端并通过互联网连接访问的存储空间。随着资源受限、始终连接且内部存储容量的移动设备的广泛采用，这种情况变得日益普遍。\n\
  \n`Storage Access Framework` 为用户和应用程序开发者提供了无缝访问云文件的简单机制。通过使用一组 intent 以及用于选择文档提供程序和文件的内置用户界面，现在可以用极少的代码将全面的云存储集成到\
  \ Android 应用程序中。\n\n# 79. 一个 Android Storage Access Framework 示例\n\n## 79.1 关于 Storage\
  \ Access Framework 示例\n\n\n\n\n本章创建的 Android 应用将以基础文本编辑器的形式存在，旨在创建并将文本文件远程存储到云端存储服务中。在实践中，该示例适用于任何兼容存储访问框架（Storage\
  \ Access Framework）的云端文档存储提供商，但为了示例演示，我们假设使用 Google Drive。\n\n从功能角度来看，应用程序将为用户提供一个多行文本视图，用户可以在其中输入和编辑文本，并提供一组允许创建、打开和保存基于存储的文本文件的按钮。\n\
  \n## 79.2 创建存储访问框架示例\n\n从欢迎界面选择“Start a new Android Studio project”（启动新的 Android\
  \ Studio 项目）快速启动选项，在生成新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name`\
  \ 字段中输入 `StorageDemo`，并指定 `com.ebookfrenzy.storagedemo` 为包名。在点击 `Finish` 按钮之前，将\
  \ `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单改为 Kotlin。\n\
  \n## 79.3 设计用户界面\n\n用户界面将需要由三个 `Button` 视图和一个 `EditText` 视图组成。在 Project 工具窗口中，导航到位于\
  \ `app -> res -> layout` 的 `activity_main.xml` 布局文件并双击它加载到 Layout Editor 工具中。在工具的\
  \ Design 模式下，选择并删除 Hello World! `TextView` 对象。\n\n在布局的左上角拖动并放置一个 `Button` 组件，以便在释放组件之前同时出现左侧和顶部的虚线边距引导线。放置第二个\
  \ `Button`，使其中心和顶部边距引导线出现。第三个 `Button` 组件应被放置在出现顶部和右侧边距引导线的位置。\n\n将三个按钮的文本属性分别更改为“New”、“Open”和“Save”。接下来，放置一个\
  \ `Plain Text` 组件，使其水平居中并位于中间的 `Button` 下方，以便用户界面的布局与图 79-1 所示所示。使用 Layout Editor\
  \ 工具栏上的 `Infer Constraints`（推约束）按钮添加任何缺失的约束。\n\n在布局中选择 `Plain Text` 组件，删除当前的文本属性设置使该字段初始为空，并将\
  \ `ID` 设置为 `fileText`，记住将所有字符串属性提取到资源值：\n\n![](img/as_3.5_storage_demo_ui.png)\n\
  \n图 79-1\n\n使用 Attributes 工具窗口配置 `Button` 组件上的 `onClick` 属性，分别调用名为 `newFile`、`openFile`\
  \ 和 `saveFile` 的方法。\n\n## 79.4 声明请求代码\n\n在存储访问框架中处理文件涉及根据要执行的具体操作触发各种意图（intent）。这通常会导致框架显示存储选择器用户界面，使用户可以指定存储位置（例如\
  \ Google Drive 上的目录和文件名）。当意图的工作完成后，应用程序将通过调用名为 `onActivityResult()` 的方法接收通知。\n\n\
  由于来自单个 Activity 的意图都会调用同一个 `onActivityResult()` 方法，因此需要一种机制来识别是哪个意图触发了调用。这可以通过启动意图时传递一个请求代码来实现。该代码随后由意图传递给\
  \ `onActivityResult()` 方法，使方法能够识别用户请求了哪种操作。在实现创建、保存和打开文件的 `onClick` 处理器之前，第一步是为这三个操作声明一些请求代码。\n\
  \n找到并加载 `MainActivity.kt` 文件到编辑器，并为应用程序执行的三个操作声明常量值。\n\n```kotlin\npackage com.ebookfrenzy.storagedemo\n\
  \nimport androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\n\n\
  class MainActivity : AppCompatActivity() {\n    private val CREATE_REQUEST_CODE\
  \ = 40\n    private val OPEN_REQUEST_CODE = 41\n    private val SAVE_REQUEST_CODE\
  \ = 42\n}\n}\n```\n\n## 79.5 创建新的存储文件\n\n当选择 New 按钮时，应用程序需要触发一个 `ACTION_CREATE_DOCUMENT`\
  \ 意图，该意图配置为创建一个纯文本 MIME 类型的文件。在设计用户界面时，New 按钮被配置为调用名为 `newFile()` 的方法。需要在该方法内部启动适当的意图。\n\
  \n留在 `MainActivity.kt` 文件中，如下方式实现此方法：\n\n```kotlin\npackage com.ebookfrenzy.storagedemo\n\
  \nimport android.app.Activity\nimport androidx.appcompat.app.AppCompatActivity\n\
  import android.os.Bundle\nimport android.content.Intent\nimport android.view.View\n\
  import android.net.Uri\nimport kotlinx.android.synthetic.main.activity_main.*\n\n\
  class MainActivity : AppCompatActivity() {\n    private val CREATE_REQUEST_CODE\
  \ = 40\n    private val OPEN_REQUEST_CODE = 41\n    private val SAVE_REQUEST_CODE\
  \ = 42\n\n    fun newFile(view: View) {\n        val intent = Intent(Intent.ACTION_CREATE_DOCUMENT)\n\
  \        intent.addCategory(Intent.CATEGORY_OPENABLE)\n        intent.type = \"\
  text/plain\"\n        intent.putExtra(Intent.EXTRA_TITLE, \"new.txt\")\n       \
  \ startActivityForResult(intent, CREATE_REQUEST_CODE)\n    }\n}\n```\n\n此代码创建了一个\
  \ `ACTION_CREATE_DOCUMENT` 意图。该意图随后配置为仅返回可以打开的文件（通过 `CATEGORY_OPENABLE`）。接下来指定要打开的文件是纯文本，并提供文件名（用户可以更改）。最后，启动意图并传递\
  \ `CREATE_REQUEST_CODE`。\n\n## 79.6 onActivityResult 方法\n\n`onActivityResult()`\
  \ 方法将由应用程序生命周期内调用的所有意图共享。在每种，该方法都会接收一个请求代码、结果代码和包含存储文件 Uri 的结果数据。该方法的实现需要能够检查意图的执行结果、识别操作类型并从结果中提取\
  \ Uri。在教程的目前阶段，方法只需要处理新文件的创建，因此修改 `MainActivity.kt` 文件添加此方法：\n\n```kotlin\noverride\
  \ fun onActivityResult(requestCode: Int, resultCode: Int, resultData: Intent?) {\n\
  \    super.onActivityResult(requestCode, resultCode, resultData)\n    var currentUri:\
  \ Uri? = null\n    if (resultCode == Activity.RESULT_OK) {\n        if (requestCode\
  \ == CREATE_REQUEST_CODE) {\n            if (resultData != null) {\n           \
  \     fileText.setText(\"\")\n            }\n        }\n    }\n}\n```\n\n此方法的代码非常直观。检查活动的结果，如果成功，则将请求代码与\
  \ `CREATE_REQUEST_CODE` 值进行比较，以验证用户正在创建新文件。如果是这样，清除编辑视图中之前的文本以表示新文件的创建。\n\n编译并运行应用程序，选择\
  \ New 按钮。存储访问框架随后应显示如图 79-3 所示的下载用户界面：\n\n![](img/as_3.5_storage_downloads_screen.png)\n\
  \n图 79-2\n\n\n\n\n\n点击上方高亮的菜单按钮，选择 `Drive` 选项，然后选择 `My Drive`，并导航到你 Google Drive\
  \ 存储空间中的合适位置以保存文件。在选择器界面底部的文本字段中，在选择 Save（保存）选项之前，将名称从“newfile.txt”更改为合适的名称（但保留\
  \ `.txt` 扩展名）。\n\n![](img/as_3.5_storage_destination_.png)\n\n图 79-3\n\n一旦创建了新文件，应用程序应该返回主活动，并且通知面板中会出现一条显示“1\
  \ file uploaded”（1 文件已上传）的通知。\n\n![](img/as_3.5_storage_upload_notification.png)\n\
  \n图 79-4\n\n此时，应该能够在浏览器窗口中登录 Google Drive 账号，并在请求的位置找到新创建的文件。如果文件丢失，请确保运行应用程序的 Android\
  \ 设备已连接到互联网。也可以通过运行 Google Drive 应用来验证设备对 Google Drive 的访问，该应用在许多 Android 设备上默认安装，并可从\
  \ Google Play 商店下载。\n\n## 79.7 保存到存储文件\n\n现在应用程序能够创建新的存储基础文件了，下一步是添加将用户输入的任何文本保存到文件的功能。用户界面配置为在用户选择\
  \ Save（保存）按钮时调用 `saveFile()` 方法。该方法将负责启动一个类型为 `ACTION_OPEN_DOCUMENT` 的新意图（intent），这将导致选择器界面出现，用户可以选择存储文本的文件。由于我们只处理纯文本文件，因此意图需要配置，以将用户的选择选项限制为匹配\
  \ `text/plain` MIME 类型的现有文件。在确定了 `saveFile()` 方法要执行的操作后，现在将其添加到 `MainActivity.kt`\
  \ 类文件中，如下所示：\n\n```kotlin\nfun saveFile(view: View) {\n    val intent = Intent(Intent.ACTION_OPEN_DOCUMENT)\n\
  \    intent.addCategory(Intent.CATEGORY_OPENABLE)\n    intent.type = \"text/plain\"\
  \n    startActivityForResult(intent, SAVE_REQUEST_CODE)\n}\n```\n\n由于 `SAVE_REQUEST_CODE`\
  \ 已经传递给了意图，现在必须扩展 `onActivityResult()` 方法来处理保存操作：\n\n```kotlin\nclass MainActivity\
  \ : AppCompatActivity() {\n// ...\n    public override fun onActivityResult(requestCode:\
  \ Int, resultCode: Int,\n                                     resultData: Intent?)\
  \ {\n        super.onActivityResult(requestCode, resultCode, resultData)\n     \
  \   var currentUri: Uri? = null\n        if (resultCode == Activity.RESULT_OK) {\n\
  \            if (requestCode == CREATE_REQUEST_CODE) {\n                if (resultData\
  \ != null) {\n                    fileText.setText(\"\")\n                }\n  \
  \          } else if (requestCode == SAVE_REQUEST_CODE) {\n                resultData?.let\
  \ {\n                    currentUri = it.data\n                    currentUri?.let\
  \ {\n                        writeFileContent(it)\n                    }\n     \
  \           }\n            }\n        }\n    }\n}\n```\n\n该方法现在检查保存请求，提取用户在存储选择器中选择的文件的\
  \ `Uri`，并调用方法 `writeFileContent()`，将要写入文本的文件 `Uri` 传递。。留在 `MainActivity.kt` 文件中，实现该方法使其读取方式如下：\n\
  \n```kotlin\npackage com.ebookrenzy.storagedemo\nimport java.io.FileOutputStream\n\
  import java.io.IOException\n// ...\nclass MainActivity : AppCompatActivity() {\n\
  \    private fun writeFileContent(uri: Uri) {\n        try {\n            val pfd\
  \ = contentResolver.openFileDescriptor(uri, \"w\")\n            val fileOutputStream\
  \ = FileOutputStream(\n                pfd?.fileDescriptor)\n            val textContent\
  \ = fileText.text.toString()\n            fileOutputStream.write(textContent.toByteArray())\n\
  \            fileOutputStream.close()\n            pfd?.close()\n        } catch\
  \ (e: Throwable) {\n            e.printStackTrace()\n        } catch (e: IOException)\
  \ {\n            e.printStackTrace()\n        }\n    }\n}\n```\n\n该方法首先从用户选择的文件\
  \ `Uri` 获取并打开文件描述符。由于代码需要向文件写入内容，因此描述符以写入模式 (`w`) 打开。然后使用该文件描述符作为创建输出流的基础，以便应用程序能够写入文件。用户输入的文本从编辑框对象中提取，并在文件描述符和流关闭之前写入输出流中。还添加了代码来处理文件写入过程中遇到的任何\
  \ IO 异常。\n\n添加新方法后，编译并运行应用程序，在文本视图中输入一些文本并选择 Save 按钮。从选择器界面中，找到 Google Drive 存储中之前创建的文件，以便将文本保存到该文件中。返回浏览器窗口中的\
  \ Google Drive 账号并选择文本文件以显示内容。文件现在应该包含在 Android 设备 StorageDemo 应用程序中输入的文本。\n\n##\
  \ 79.8 打开并读取存储文件\n\n在编写了创建和保存文本文件的代码后，最后的任务是添加一些从存储器打开并读取文件的功能。这将涉及编写 `openFile()`\
  \ 点击事件处理方法并实现它，使其启动 `ACTION_OPEN_DOCUMENT` 意图：\n\n```kotlin\nfun openFile(view:\
  \ View) {\n    val intent = Intent(Intent.ACTION_OPEN_DOCUMENT)\n    intent.addCategory(Intent.CATEGORY_OPENABLE)\n\
  \    intent.type = \"text/plain\"\n    startActivityForResult(intent, OPEN_REQUEST_CODE)\n\
  }\n```\n\n在此代码中，意图被配置为过滤应用程序可以打开的文件。启动活动时，它传递了打开请求常量，该常量现在需要在 `onActivityResult()`\
  \ 方法中处理：\n\n```kotlin\npublic override fun onActivityResult(requestCode: Int, resultCode:\
  \ Int,\n                                     resultData: Intent?) {\n    super.onActivityResult(requestCode,\
  \ resultCode, resultData)\n    var currentUri: Uri? = null\n    if (resultCode ==\
  \ Activity.RESULT_OK) {\n        if (requestCode == CREATE_REQUEST_CODE) {\n   \
  \         if (resultData != null) {\n                fileText.setText(\"\")\n  \
  \          }\n        } else if (requestCode == SAVE_REQUEST_CODE) {\n         \
  \   resultData?.let {\n                currentUri = it.data\n                currentUri?.let\
  \ {\n                    writeFileContent(it)\n                }\n            }\n\
  \        } else if (requestCode == OPEN_REQUEST_CODE) {\n            resultData?.let\
  \ {\n                currentUri = it.data\n                currentUri?.let {\n \
  \                   try {\n                        val content = readFileContent(it)\n\
  \                        fileText.setText(content)\n                    } catch\
  \ (e: IOException) {\n                        e.printStackTrace()\n            \
  \        }\n                }\n            }\n        }\n    }\n}\n```\n\n上述用于处理打开请求的新代码从选择器用户界面获取用户选择的文件\
  \ `Uri`，并将其传递给 `readFileContent()` 方法，该方法预期以 String 对象的形式返回所选文件的内容。结果字符串被赋值给编辑视图的文本属性。显然，下一个任务是实现\
  \ `readFileContent()` 方法：\n\n```kotlin\nprivate fun readFileContent(uri: Uri): String\
  \ {\n    val inputStream = contentResolver.openInputStream(uri)\n    val reader\
  \ = BufferedReader(InputStreamReader(\n        inputStream))\n}\n```\n\n\n\n\n\n\
  ```kotlin\nval stringBuilder = StringBuilder()\n\nvar currentline = reader.readLine()\n\
  while (currentline != null) {\n    stringBuilder.append(currentline + \"\\n\")\n\
  \    currentline = reader.readLine()\n}\ninputStream?.close()\nreturn stringBuilder.toString()\n\
  }```\n\n此方法首先开始提取所选文本文件的描述符并将其打开以进行读取。随后打开与 `Uri` 关联的输入流，并将其作为 `BufferedReader`\
  \ 实例的输入源。文件中的每一行都会被读取并存储在 `StringBuilder` 对象中。一旦所有行都读取完毕，输入流和文件描述符都将被关闭，并将文件内容作为\
  \ `String` 对象返回。\n\n# 79.9 测试存储访问应用程序\n\n编码阶段完成后，该应用程序现在已准备好进行全面测试。首先，在配置了你的 Google\
  \ 账户身份的 Android 设备或 AVD 上启动应用程序，并点击“新建”（New）按钮。在生成的存储选择器界面中，选择一个 Google Drive 位置，并将文本文件命名为\
  \ `storagedemo.txt`，然后点击文件名字段右侧的保存（Save）选项。\n\n当控制权返回到你的应用程序时，寻找文件上传通知，然后在选择“保存”（Save）按钮之前向文本区域输入一些文本。从选择器中选择之前创建的\
  \ `storagedemo.txt` 文件将内容保存到文件中。返回应用程序后，删除文本并选择“打开”（Open）按钮，再次选择 `storagedemo.txt`\
  \ 文件。当控制权返回到应用程序时，文本视图应该已经填充了文本文件的内容。\n\n需要注意的是，如果 Android 设备缺少活跃的互联网连接，存储访问框架（Storage\
  \ Access Framework）将会在本地缓存存储文件。然而，一旦重新建立连接，任何缓存数据都将与远程存储服务同步。因此，作为对应用程序的最终测试，请在浏览器窗口中登录你的\
  \ Google Drive 账户，导航到 `storagedemo.txt` 文件并点击它查看内容，在一切顺利的情况下，该内容应该包含应用程序保存的文本。\n\
  \n# 79.10 总结\n\n本章详细介绍了如何创建一个 Android Studio 应用程序示例，该示例程序是一个非常原始的文本编辑器，旨在使用 Android\
  \ 存储访问框架利用云存储来创建、保存和打开文件。\n\n# 80. 使用 VideoView 和 MediaController 类在 Android 上实现视频播放\n\
  \n智能手机和平板电脑的主要用途之一是提供在线内容的访问。一种被广泛使用的内容形式（特别是平板电脑设备）是视频。\n\nAndroid SDK 包含了两个类，它们在开发应用程序时使得在\
  \ Android 设备上实现视频播放变得极其简单。本章将在介绍创建一个简单的视频播放应用程序之前，对 `VideoView` 和 `MediaController`\
  \ 这两个类进行概述。\n\n## 80.1 介绍 Android VideoView 类\n\n目前为止，在 Android 应用程序中视频的最简单的方法是使用\
  \ `VideoView` 类。这是一个视觉组件，当它被添加到 Activity 的布局时，它提供了一个可以播放视频的表面。Android 目前支持以下视频格式：\n\
  \n* H.263\n* H.264 AVC\n* H.265 HEVC\n* MPEG-4 SP\n* VP8\n* VP9\n\n`VideoView` 类有一系列方法可以调用，以管理视频播放。一些较常用的方法如下：\n\
  \n* `setVideoPath(String path)` – 指定要播放的视频媒体的路径（字符串形式）。这可以是远程视频文件的 URL，也可以是设备本地的视频文件。\n\
  * `setVideoUri(Uri uri)` – 执行与 `setVideoPath()` 方法相同的任务，但接受 `Uri` 对象作为参数而不是字符串。\n\
  * `start()` – 开始视频播放。\n* `stopPlayback()` – 停止视频播放。\n* `pause()` – 暂停视频播放。\n* `isPlaying()`\
  \ – 返回一个布尔值，表示视频是否正在播放。\n* `setOnPreparedListener(MediaPlayer.OnPreparedListener)`\
  \ – 允许在视频准备好播放时调用回调方法。\n* `setOnErrorListener(MediaPlayer.OnErrorListener)` - 允许在视频播放期间发生错误时调用回调方法。\n\
  * `setOnCompletionListener(MediaPlayer.OnCompletionListener)` - 允许在视频结束时调用回调方法。\n\
  * `getDuration()` – 返回视频时长。除非在 `OnPreparedListener()` 回调方法中调用，否则通常会返回 -1。\n* `getCurrentPosition()`\
  \ – 返回指示当前播放位置的整数值。\n* `setMediaController(MediaController)` – 指定一个 `MediaController`\
  \ 实例，允许向用户显示播放控制。\n\n## 80.2 介绍 Android MediaController 类\n\n如果仅使用 `VideoView` 类播放视频，用户将无法对播放进行任何控制，视频将一直运行到结束。这个问题可以通过将\
  \ `MediaController` 类的实例挂载到 `VideoView` 实例来解决。`MediaController` 将提供一组控制，允许用户管理播放（例如暂停以及在视频时间轴上后退/向前进）。\n\
  \n控制控件的位置通过将控制器实例锚定到视图（view）来指定。一旦挂载并锚定，控制在播放开始时会短暂显示，随后用户可以通过点击其所锚定的视图在任何时候恢复它。\n\
  \n该类的一些关键方法是：\n\n* `setAnchorView(View view)` – 指定控制器要锚定的视图。这决定了控制在屏幕上的位置。\n* `show()`\
  \ – 显示控制。\n* `show(int timeout)` – 在指定时间（毫秒）内显示控制。\n* `hide()` – 向用户隐藏控制。\n* `isShowing()`\
  \ – 返回一个指示控制是否可见的布尔值。\n\n## 80.3 创建视频播放示例\n\n本章剩余部分将创建一个示例应用程序，该程序旨在使用 `VideoView`\
  \ 和 `MediaController` 类播放 MPEG-4 视频文件。\n\n欢迎界面上选择 Start a new Android Studio project\
  \ 快速选项，并在生成的新项目对话框中选择 Empty Activity 模板，然后点击 Next 按钮。\n\n在 Name 字段输入 `VideoPlayer`\
  \ 并指定 `com.ebookfzy.videoplayer` 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 API\
  \ 26: Android 8.0 (Oreo)，并将 Language 菜单设置为 Kotlin。\n\n## 80.4 设计 VideoPlayer 布局\n\
  \n主 Activity 的界面将仅由 `VideoView` 类的实例组成。使用 Project 工具窗口找到 `app -> res -> layout ->\
  \ activity_main.xml` 文件，双击它，将 Layout Editor 工具切换到 Design 模式并删除默认的 `TextView` 组件。\n\
  \n从 Palette 面板的 Widgets 类别中将 `VideoView` 实例拖入布局中，使其如图 80-1 所示填充可用画布区域。使用 Attributes\
  \ 面板，将 `layout_width` 和 `layout_height` 属性分别更改为 `match_constraint` 和 `wrap_content`。同时移除连接\
  \ `VideoView` 底部与父 `ConstraintLayout` 底部的约束。最后，将组件的 ID 更改为 `videoView1`。\n\n## 80.5\
  \ 下载视频文件\n\n\n\n\n由 `VideoPlayer` 应用播放的视频是一个 MPEG-4 格式编码的短动画电影片段。使用网络浏览器，导航到以下 URL\
  \ 播放视频：\n\n`https://www.ebookfrenzy.com/android_book/movie.mp4`\n\n在浏览器窗口内，右键点击视频播放区域并选择保存或下载视频到本地文件的选项，选择一个合适的临时文件系统位置，并将文件命名为\
  \ `movie.mp4`。\n\n在 Android Studio 中，在 `Project` 工具窗口中找到 `res` 文件夹，右键点击它并选择 `New\
  \ -> Directory` 菜单选项，在点击 `OK` 按钮之前在名称字段输入 `raw`。使用你操作系统的文件系统导航器找到上述下载的 `movie.mp4`\
  \ 文件并将其复制。返回 Android Studio，右键点击新创建的 `raw` 目录并选择 `Paste` 选项将视频文件复制到项目中。添加完成后，`raw`\
  \ 文件夹应与 `Project` 工具窗口中的图 80-2 一致：\n\n![](img/as_3.6_video_player_raw_file_added.png)\n\
  \n图 80-2\n\n### 80.6 配置 VideoView\n\n下一步是为 `VideoView` 配置要播放的视频路径并开始播放。这将在主活动初始化后执行，因此将\
  \ `MainActivity.kt` 文件加载到编辑器并按照以下列表概述进行修改：\n\n```kotlin\npackage com.ebookfrenzy.videoplayer\n\
  \nimport androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\nimport\
  \ android.net.Uri\nimport kotlinx.android.synthetic.main.activity_main.*\n\nclass\
  \ MainActivity : AppCompatActivity() {\n    override fun onCreate(savedInstanceState:\
  \ Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_video_player)\n\
  \        configureVideoView()\n    }\n\n    private fun configureVideoView() {\n\
  \        videoView1.setVideoURI(Uri.parse(\"android.resource://\"\n            \
  \          + getPackageName() + \"/\" + R.raw.movie))\n        videoView1.start()\n\
  \    }\n}\n```\n\n这段代码的作用是获取布局中 `VideoView` 实例的引用，为其分配一个指向位于 `raw` 资源目录中的电影文件的 `URI`\
  \ 对象，然后开始播放视频。\n\n在物理 Android 设备上运行应用程序以测试它。应用程序启动后，在播放开始之前，视频内容缓冲可能会有短暂延迟（图 80-3）。\n\
  \n![](img/as_3.6_video_player_playing.png)\n\n图 80-3\n\n这说明了将视频播放集成到 Android 应用中是多么简单。在本示例中到为止的所有内容都是使用一个\
  \ `VideoView` 实例和三行代码实现的。\n\n### 80.7 在 Video View 中添加 MediaController\n\n目前 `VideoPlayer`\
  \ 应用的状态是用户无法控制播放。如前所述，这可以通过 `MediaController` 类来实现。若要为 `VideoView` 添加控制器，请再次修改 `configureVideoView()`\
  \ 方法：\n\n```kotlin\npackage com.ebookfrenzy.videoplayer\n\n...\n\nimport android.widget.MediaController\n\
  import kotlinx.android.synthetic.main.activity_main.*\n\nclass MainActivity : AppCompatActivity()\
  \ {\n    private var mediaController: MediaController? = null\n\n...\n\n    private\
  \ fun configureVideoView() {\n        videoView1.setVideoURI(Uri.parse(\"android.resource://\"\
  \n                      + getPackageName() + \"/\" + R.raw.movie))\n        mediaController\
  \ = MediaController(this)\n        mediaController?.setAnchorView(videoView1)\n\
  \        videoView1.setMediaController(mediaController)\n        videoView1.start()\n\
  \    }\n}\n```\n\n当实现这些更改并启动应用程序时，点击 `VideoView` 画布将使媒体控件出现在视频播放上层。这些控件应包含一个进度条以及快进、后退和播放/暂停按钮。在控件从视线中消失后，可以通过再次点击\
  \ `VideoView` 画布随时恢复它们。只需额外三行代码，图 80-4：\n\n![](img/as_3.6_video_player_controls.png)\n\
  \n图 80-4\n\n### 80.8 设置 onPreparedListener\n\n作为处理多媒体的最后一个示例，现在将扩展该活动以演示监听器。在这种情况下，将实现一个监听器，在\
  \ Android Studio Logcat 中输出视频持续时间：\n\n```kotlin\npackage com.ebookfrenzy.videoplayer\n\
  \n...\n\nimport android.util.Log\n\n...\n\nclass MainActivity : AppCompatActivity()\
  \ {\n    private var TAG = \"VideoPlayer\"\n\n...\n\n    private fun configureVideoView()\
  \ {\n        videoView1.setVideoURI(Uri.parse(\"android.resource://\"\n        \
  \              + getPackageName() + \"/\" + R.raw.movie))\n        mediaController\
  \ = MediaController(this)\n        mediaController?.setAnchorView(videoView1)\n\
  \        videoView1.setMediaController(mediaController)\n        videoView1.setOnPrepared\
  \ { mp ->\n            mp.isLooping = true\n            Log.i(TAG, \"Duration =\
  \ \" + videoView1.duration)\n        }\n        videoView1.start()\n    }\n}\n```\n\
  \n### 80.9 总结\n\nAndroid 设备是交付内容的优秀平台，特别是视频形式。如本章所述，Android SDK 提供了两个类，即 `VideoView`\
  \ 和 `MediaController`，它们结合使得将视频播放集成到 Android 应用中变得快捷简单。\n\n# 81 Android 画中画模式\n\n\
  在前面的章节中介绍 Android 的多任务处理时，画中画（PiP）模式被简单提到，但没有进行详细介绍。PiP 模式主要为视频播放设计，它允许活动屏幕缩小并放置在屏幕的任何位置。在此状态下，活动继续运行，无论设备上运行其他活动，窗口都会保持可见。这允许用户例如在执行检查电子邮件或处理电子表格等任务的同时继续观看视频。\n\
  \n本章将提供画中画模式的概述，并在下一章 `VideoPlayer` 项目中添加画中画支持。\n\n### 81.1 画中画功能\n\n正如本章后面介绍的，通过运行的应用内部的\
  \ API 调用进入 PiP 模式。进入 PiP 模式后，可以指定配置选项来控制 PiP 窗口的宽高比，并定义包含在窗口中的活动屏幕区域。例如图 81-1 显示了处于\
  \ PiP 模式的视频播放活动：\n\n![](img/Image24273.png)\n\n图 81-1\n\n\n\n\n图 81-2 显示了被用户点击后的画中画（PiP）模式窗口。在此模式下，窗口看起来会变大，并在中心包含一个全屏操作按钮，点击该按钮会将窗口恢复到全屏模式；同时右上角有一个退出按钮，用于关闭窗口并将应用程序置于后台。任何添加到\
  \ PiP 窗口的自定义操作也会在显示此模式下时显示在屏幕上。如图 81-2 所示，PiP 窗口包含了自定义的播放和暂停操作按钮：\n\n![](img/Image24363.png)\n\
  \n图 81-2\n\n本章的剩余部分将概述如何在 Android 应用程序内部启用和管理 PiP 模式。\n\n## 81.2 启用画中画模式\n\nPiP\
  \ 模式目前仅支持运行 `API 26`：即 Android 8.0（Oreo）或更高版本的设备。实现 PiP 模式的第一步是在项目的清单文件（manifest）中启用它。通过在每个需要\
  \ PiP 支持的 activity 元素添加以下行，可以按 activity 配置 PiP 模式：\n\n```xml\n<activity android:name=\"\
  .MyActivity\"\n    android:supportsPictureInPicture=\"true\"\n    android:configChanges=\n\
  \        \"screenSize|smallestScreenSize|screenLayout|orientation\"\n    <intent-filter>\n\
  \        <action android:name=\"android.intent.action.MAIN\" />\n        <category\
  \ android:name=\"android.intent.category.LAUNCHER\" />\n    </intent-filter>\n</activity>\n\
  ```\n\n`android:supportsPictureInPicture` 条目启用该 activity 的 PiP 功能，而 `android:configChanges`\
  \ 属性通知 Android 该 activity 能够处理布局配置更改。如果没有此设置，每次 activity 进入或退出 PiP 模式，activity 都会重新启动，导致在切换期间视频从头重新播放。\n\
  \n## 81.3 配置画中画参数\n\nPiP 行为通过使用 `PictureInPictureParams` 类定义，可以使用 `Builder` 类创建其实例，如下：\n\
  \n```kotlin\nval params = PictureInPictureParams.Builder().build()\n```\n\n上述代码创建了一个带有已定义特殊参数的默认\
  \ `PictureInPictureParams` 实例。还可以使用以下可选方法调用来自定义参数：\n\n*   `setActions()` – 用于定义\
  \ activity 在处于 PiP 模式时从 PiP 窗口内执行的操作。将在本章稍后部分详细介绍操作。\n*   `setAspectRatio()` – 声明\
  \ PiP 窗口显示的优选宽高比。该方法接收一个 `Rational` 对象作为参数，该对象包含高度/宽度比例。\n*   `setSourceRectHint()`\
  \ – 接收一个 `Rect` 对象作为参数，定义要在 PiP 窗口中显示的 activity 屏幕区域。\n\n例如，以下代码在 `PictureInPictureParams`\
  \ 对象中配置了宽高比和操作参数。对于宽高比，它是使用 `VideoView` 实例的宽度和高度维度定义的：\n\n```kotlin\nval rational\
  \ = Rational(videoView.width,\n        videoView.height)\nval params = PictureInPictureParams.Builder()\n\
  \    .setAspectRatio(rational)\n    .setActions(actions)\n    .build()\n```\n\n\
  一旦定义，可以随时使用 `setPictureInPictureParams()` 方法设置 PiP 参数，如下：\n\n```kotlin\nsetPictureInPictureParams(params)\n\
  ```\n\n在进入 PiP 模式时也可以指定参数。\n\n## 81.4 进入画中画模式\n\n通过调用 `enterPictureInPictureMode()`\
  \ 方法并传递 `PictureInPictureParams` 对象，可以将 activity 画中画模式：\n\n```kotlin\nenterPictureInPictureMode(params)\n\
  ```\n\n如果不需要参数，只需按照上一节所述创建一个默认的 `PictureInPictureParams` 对象即可。如果之前已使用 `setPictureInPictureParams()`\
  \ 方法设置了参数，则这些参数将与在 `enterPictureInPictureMode()` 方法调用时指定的参数合并。\n\n## 81.5 检测画中画模式的变化\n\
  \n当 activity 进入 PiP 模式时，隐藏任何不必要的视图是非常重要的，这样 PiP 窗口内只显示视频播放。当 activity 重新进入全屏模式时，需要恢复任何隐藏的用户界面组件。这些以及任何其他特定于应用程序的任务可以通过重写\
  \ `onPictureInPictureModeChanged()` 方法来实现。当此方法添加到 activity 后，每次 activity 在 PiP 模式和全屏模式之间切换时都会被调用，并传递一个\
  \ `Boolean` 值，指示 activity 当前是否处于 PiP 模式：\n\n```kotlin\noverride fun onPictureInPictureModeChanged(\n\
  \        isInPictureInPictureMode: Boolean, newConfig: Configuration?) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode)\n\
  \    if (isInPictureInPictureMode) {\n        // 进入了画中画模式\n    } else {\n      \
  \  // 进入了全屏模式\n    }\n}\n```\n\n## 81.6 添加画中画操作\n\n画中画操作在 PiP 窗口被点击时会以图标的形式出现。实现\
  \ PiP 操作是一个多步骤过程，首先要实现让 PiP 窗口通知 activity 已选择操作的方法。这通过在 activity 内部设置广播接收器（broadcast\
  \ receiver），然后创建一个该广播接收器监听的意来实现。PiP 操作使用 `RemoteAction` 实例声明，并使用图标、标题和描述进行初始化。\n\
  \n以下代码片段演示了在应用 PictureInPictureParams 之前创建这些对象：\n\n```kotlin\nval actions = ArrayList<RemoteAction>()\n\
  val actionIntent = Intent(\"MY_ACTION\")\nval pendingIntent = PendingIntent.getBroadcast(this@MyActivity,\n\
  \        REQUEST_CODE, actionIntent, 0)\n\nval icon = Icon.createResource(this,\
  \ R.drawable.action_icon)\nval remoteAction = RemoteAction(icon,\n        \"My Action\
  \ Title\",\n        \"My Action Description\",\n        pendingIntent)\n\nactions.add(remoteAction)\n\
  \nval params = PictureInPictureParams.Builder()\n    .setActions(actions)\n    .build()\n\
  \nsetPictureInPictureParams(params)\n```\n\n\n\n\n\n# 82. Android 画中画教程\n\n接续之前的章节，本章将对现有的\
  \ `VideoPlayer` 项目进行增强，以添加画中画（Picture-in-Picture，PiP）支持，包括检测 PiP 模式的变化以及添加一个用于显示当前运行视频信息的\
  \ PiP 动作。\n\n## 82.1 在 Manifest 中添加画中画支持\n\n在 Android 项目中添加 PiP 支持的第一步是在项目的 Manifest\
  \ 文件中启用它。打开 `manifests` -> `AndroidManifest.xml` 文件并修改 `activity` 元素以启用 PiP 支持：\n\
  \n```xml\n<activity android:name=\".MainActivity\"\n  android:supportsPictureInPicture=\"\
  true\"\n  android:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  >\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n## 82.2 添加画中画按钮\n\n按照目前的设计，`VideoPlayer`\
  \ activity 的布局仅包含一个 `VideoView` 实例。现在将在布局中添加一个按钮，用于切换到 PiP 模式。将 `activity_main.xml`\
  \ 文件加载到布局编辑器中，从调色板拖入 `Button` 对象到布局中，使其位置如图 82-1 所示：\n\n![](img/as_3.6_video_player_pip_button.png)\n\
