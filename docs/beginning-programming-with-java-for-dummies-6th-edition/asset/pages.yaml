    +   - **Index**: In the case of the Java Motel array, the index is the room number
    (from 0 to 9).

    - **Value**: In the Java Motel array, the value is the number of guests in a given
    room (a number stored in a component of the array).


    Using an array saves you from having to declare ten separate variables: guest0,
    guestsIn1, guestsIn2, and so on. To declare an array with ten values in it, you
    can write two fairly short lines of code:


    ```

    int[] guestsIn;

    guestIn = new int[10];

    ```


    You can squash these two lines into one longer line:


    ```

    int[] guestsIn = new int[10];

    ```


    And, under the right circumstances, you can avoid repeating yourself by using
    the word var:


    ```

    var guestsIn = new int[10];

    ```


    In any of these code snippets, notice the use of the number 10. This tells the
    computer to make the guestsIn array have a name of its own. The starting component
    is named guestsIn[0], the next is named guestsIn[1], and so on. The last of the
    ten components is named guestsIn[9].


    # CHAPTER 19 Out of Many, One 453'
