    # STATEMENTS AND BLOCKS (PLAGIARIZINGnMY OWN SENTENCES FROM CHAPTER 9)


    Java''s while statements have a lot in common with if statements. Like an if statement,
    a while statement is a compound statement — that is, a while statement includes
    other statements within it. Also, both if statements and while statements typically
    include blocks of statements. When you surround a bunch of statements with curly
    braces, you get what''s called a block, and a block behaves, in all respects,
    like a single.


    In a while statement, you want the computer to repeat several smaller statements
    over and again. To repeat several smaller statements, you combine those statements
    into one big statement. To do this, you make a block using curly braces.


    In Listing 11-1, the block


    ```

    {ndie1=myRandom.nextInt(6)+1;

    die2=myRandom.nextInt(6)+1;


    out.print(die1);

    nout.print(" ");

    out.println(die2);

    }

    ```


    it''s a single statement. It''s a statement that has, within it, five smaller
    statements. So this big block (this single statement) serves as one big statement
    inside the while statement in Listing 11-1.


    That''s the story about while statements and blocks. To find out how this stuff
    applies to if statements, see the "Statements and blocks" sidebar near the end
    of Chapter 9.'
