  md: "# STATEMENTS AND BLOCKS\n\nAn elegant way to think about if statements is to\
    \ realize that you can put only one statement inside each clause of an if statement:\n\
    \n```\nif (Condition)\n    oStatement\nelse\n    anotherStatement\n```\n\nOn your\
    \ first reading of this 1-statement rule, you're probably thinking that there's\
    \ a misprint. After all, in Listing 9-4, each clause (the if clause and the else\
    \ clause) seems to contain four statements, not just one.\n\nBut technically,\
    \ the if clause in Listing 9-4 has only one statement, and the else clause in\
    \ Listing 9-4 has only one statement. The trick is, when you surround a bunch\
    \ of statements with curly braces, you get what's called a block, and a block\
    \ behaves, in all respects, like a statement. In fact, the official Java documentation\
    \ lists a block as a kind of statement (of many different kinds of statements).\
    \ So, in Listing 9-4, the block\n\n```\n{\n    out.print(\"Hankees\");\n    out.println(hankees);\n\
    \    out.print(\"Socks\");\n    out.println(socks);\n}\n```\n\nis a single statement.\
    \ It is statement that has smaller statements within it. So this big block, this\
    \ single statement, serves as the one-and-only statement inside the if clause\
    \ in Listing 9-4.\n\nThat's how the 1-statement rule works. In an if statement,\
    \ when you want the computer to execute several statements, you combine those\
    \ statements into one big statement. To do this, you make a block using curly\
    \ braces.\n\n# Some handy import declarations\n\nWhen I wrote this section's example,\
    \ I was tired of writing the word System. After all, Listing 9-4 has ten System.out.print\
    \ lines. By this point in the book, shouldn't my computer remember what out.print\
    \ means?\n\nOf course, computers don't work that way. If you want a computer to\
    \ \"know\" out.print means, you have to code that knowledge somewhere inside the\
    \ Java compiler."
