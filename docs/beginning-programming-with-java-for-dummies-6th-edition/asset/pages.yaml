    I write about this experiment to make an important point. When you don''t understand
    something about computer programming, it often helps to write a test program.
    Make an experiment and see how the computer responds.


    I guessed that a capital R to theUpperCase method would give me an error message,
    but I was wrong. See the answers to questions aren''t handed from heaven. The
    people who created the Java API made decisions. They made some obvious choices,
    and they also made some unexpected choices. No one knows about Java''s features,
