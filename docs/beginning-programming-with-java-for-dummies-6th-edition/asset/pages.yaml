    "SnSoft is featured proudly in\n" + \

    "Chapter 6. And remember, four out\n" + \

    "of five doctors recommend\n" + \

    "SnSoft to their patients.");

    ```


    Code of this kind isn''t pleasant to write. When I write it, I always make mistakes.
