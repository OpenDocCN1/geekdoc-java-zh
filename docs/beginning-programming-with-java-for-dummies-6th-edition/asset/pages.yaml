- img_proc: true
  md: 'You''re a carpenter, you may think differently about chairs. You think about
    wood, nails, hammers, screwdrivers, glue, the cost of materials, marketability
    of your design, and other things.


    You don''t need nails or hammers to sit down on a chair. Likewise, you don''t
    need a programmer''s software tools to run an existing Java program. To run a
    Java program that someone else created, the only software you need is a Java runtime
    environment (JRE). But to create new programs, you need more tools. This big bunch
    of tools is known as a Java development kit (JDK).


    This book is about creating Java programs. So, if a website makes you choose between
    a JRE and a JDK, download the JDK.


    Other languages have their own development kits. In general, any one of these
    is called a software development kit (SDK).


    ![](img/3bfd2290819a44830f5fb8cead595a57_53_0.png)


    # Java evolves over time


    If you want to drive yourself crazy, try making sense of Java''s version numbering.
    It all started in 1996 with JDK 1.0. Next came JDK 1.1 in 1998, with market people
    decided on Java 2 SE 1.2. (The additional number 2 was quite confusing, that''s
    beside the point.)Things marked along until Java 1.5 was renamed Java 5.0 (but
    only for numbering purposes). Java 6 had to do without any .part.


    The road from Java 1.0 to Java 9 took 21 years. But, in 2017, Oracle changed to
    a 6-month cycle for new versions of Java. So, in March 2018, Oracle released Java
    10. And, in September 2018, Oracle released Java 11.


    Java 11 was declared to a long-term support (LTS) release. Oracle promised assistance
    with Java 11 for several years after the software''s 2018 debut. When you see
    version numbers like Java 11.0.10, it''s because Oracle was posting Java 11 updates
    as long as three years after the introduction of Java 11.


    Other versions, as Java 10 and Java 12, came with no-term support. For example,
    Oracle released Java 12 in March 2019, Java 12.0.1 is a month later, and Java
    12.0.2 three months later. But in September 2019, Oracle released Java 13 and
    bid farewell to Java 12. If you wanted help with Java 12, Oracle said, "We''re
    done with Java 12. Go ask somebody else."


    Oracle''s plan is to create long-term support releases every three years. After
    Java 11 in September 2018, the next long-term Java release is Java 17 in September
    2021. After that, you have Java 23 in September 2024.


