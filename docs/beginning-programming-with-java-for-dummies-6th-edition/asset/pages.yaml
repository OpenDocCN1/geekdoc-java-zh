  md: '# Unravelling Java''s import declarations


    In Java, you can group a bunch of classes into something called a package. In
    fact, the classes in Java''s standard API are divided into about 200 packages.
    This book''s examples make heavy use of three packages: the packages named java.util,
    java.lang, and java.io.


    # The class java.util.Scanner


    The package java.util contains about 75 classes, including the useful Scanner.
    Like most other classes, this Scanner class has two names: a fully qualified name
    and an abbreviated simple name. The class''s fully qualified name is java.util.Scanner,
    and the class''s simple name is Scanner. You get the fully qualified name by adding
    the package name to the class''s simple name. (That is, you get the package name
    java.util to the simple name Scanner. You get java.util.Scanner.)


    An import declaration lets you abbreviate a class''s name. With the declaration


    ```

    import java.util.Scanner;

    ```


    the java compiler figures out where to look for the Scanner class. So than write
    java.util.Scanner throughout your code, you can write Scanner.


    # The class java.lang.System


    The package java.lang contains about 100 classes, including the ever-popular System
    class (The class''s fully qualified name is java.lang.System and the class''s
    simple name is System). Rather than write java.lang.System throughout your code,
    you can just use System. You don''t need an import declaration.


    Among all Java''s packages, the java.lang package is special. Without an import
    declaration, the compiler imports everything in the java.lang package. You can
    start your program with import java.lang.System. But if you don''t, the compiler
    adds this declaration automatically.


    ![](img/3bfd2290819a44830f5fb8cead595a57_350_0.png)


    # The static System.out variable


    What kind of importing you do in order to advertise System.out.println? How can
    you shorten it to out.println? An import declaration lets abbreviate a class''s
    name. In the expression System.out, the word isn''t a class. The word out is a
    static variable. (The out variable refers to the place where a Java program sends
    text output.) So you can''t


    ```

    //This code is bogus. Don''t use it:

    import java.lang.System.out;

    ```'
