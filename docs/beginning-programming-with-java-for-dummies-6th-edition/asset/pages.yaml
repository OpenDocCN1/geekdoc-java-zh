    # Chapter 13

    Programming with Objects and Classes


    Chapters 7 and 8 introduce Java''s primitive types — things like int, double,
    char, and boolean. That''s great, but how often does a real-world deal deal exclusively
    with such simple values? Consider an exchange between a merchant and a customer.
    The customer makes a purchase, which can involve item names, model numbers, credit
    card info, sales tax rates, and lots of other staff. It''s more complicated than
    a double value. How do you represent an entire purchase in a Java program?


    In computer programming languages, you treat an entire purchase like a big pile
    of unbundled laundry. Imagine a world of socks, shirts, and other items of clothing.
    You have no basket, so you grab as much as you can manage. As you walk to the
    washer, you drop a few — a sock here and a cloth there. This is the old way of
    storing the values in a purchase. In older languages, there''s no purchase. There
    are only double values, char values, and other items. You put the purchase in
    one variable, the customer''s name in order, and the sales tax data somewhere
    else. That''s awful. You intend to drop things on your way to the compiler. With
    small errors in a program, you can easily drop an here and a customer''s name
    there.


    With laundry and computer programming, you''re better off if you have a basket.
    The newer programming languages, like Java, allow you to combine values


    CHAPTER 13 Programming with Objects and Classes 295'
