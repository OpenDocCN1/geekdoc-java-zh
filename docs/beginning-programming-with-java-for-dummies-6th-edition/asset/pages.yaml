    # When to initialize?


    Take a look at Listing 10-1 and notice the price variable''s initialization:


    ```

    double price = 0.00;

    ```


    This line declares the price variable and sets the variable''s starting value
    to 0.00. When I omit this initialization, I get an error message:


    ```

    The local variable price may not have been initialized

    ```


    What''s the deal here? I don''t initialize the age variable, but the compiler
    doesn''t complain about that. Why is the compiler fussing over the price variable?


    The answer is in the placement of the code''s assignment statements. Consider
    the following two:


    +   The statement that assigns a value to the age variable (age = keyboard.nextInt())
    isn''t inside an if statement.


    +   Both statements that assign a value to the price variable (price = 9.25 and
    price = 5.25) are inside if statements.


    That assignment always gets executed, (and as long as extraordinary happens) the
    age variable is sure to be assigned a value.

    If you look at Figure 10-3, you see that every group is covered. No one shows
    up at the ticket counter with any age forces if conditions to be false. Whenever
    you run the Ticket+Price program, either the first or the second price assignment
    is executed.


    The problem is that the compiler isn''t enough to check all of this. The compiler
    sees the structure in Figure 10-4 and becomes scared the computer won''t take
    either of the true detects.

    (If for some unforeseen reason) both of the if statements'' conditions are false,
    then the variable price isn''t assigned a value. So, without an initialization,
    price has no value. (More precisely, price has no value that''s intention-ally
    given in the code.)


