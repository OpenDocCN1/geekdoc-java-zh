    edition, a holographic image will extend this line to the right of the book''s
    physical page!)


    If you don''t like lines of code, you can combine the use of escape sequences
    and string concatenation:


    ```

    out.println("Today''s game is brought to you\n" + \

    "SnSoft, the number one software\n" + \

