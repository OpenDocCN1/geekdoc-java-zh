- img_proc: true
  md: 'For a JFrame has one of several different layouts. For example, a border layout
    divides the JFrame into five regions: the NORTH, SOUTH, EAST, WEST, and CENTER
    regions. An item in the CENTER region is usually the largest. It''s the centerpiece
    of the JFrame. Items in the other border layout regions live on the four edges
    of the JFrame.


    With a grid layout, you put items into table cells, and with a flow layout, you
    place items one after another in a row.


    # JOptionPane


    For a quick-and-easy graphical user interface, use a JOptionPane. Here''s some
    code:


    ```

    String word = JOptionPane.showInputDialog("Enter a word");

    JOptionPane.showMessageDialog(null, word);

    String string = JOptionPane.showInputDialog("Enter an int value");

    int number = Integer.parseInt(string);

    number++;

    JOptionPane.showMessageDialog(null, "One more is " + number);

    ```


    When you run this code, you see the dialog boxes in Figures 21-1 through 21-4.


    ![](img/3bfd2290819a44830f5fb8cead595a57_521_0.png)


    FIGURE 21-1:

    Input dialog box.


    ![](img/3bfd2290819a44830f5fb8cead595a57_521_1.png)


    FIGURE 21-2:

    Message dialog box.


    CHAPTER 21 Ten Useful Classes in the Java API 507'
