    the variable total stores an int value, while the literals "From " and " cents
    you get" are strings. To understand this, remember that the value of total isn''t
    a string of digit characters like "138". Instead, total is an amount such as 138.
    In everyday life, the difference between "138" and 138 is rarely important. But
    in computer programming, the difference is a big deal.


    Fortunately, Java''s plus sign concatenates strings to numbers and numbers to
    strings. When you put a plus sign between two such values, you get a string, not
    a number. For example, in Listing 7-3, Java sees


