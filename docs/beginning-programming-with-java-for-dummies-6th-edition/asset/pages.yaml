  md: "When you run the code in Listing 17-5, you see the same old stuff — the output\
    \ in Figure 17-1. But compare Listing 17-5 with Listings 17-1 and 17-2. This new\
    \ Listing 17-5 has much more baggage. To get the same results with randomNumber\
    \ 4 and 5, you have to write\n\n```\ncase 4:\ncase 5:\n    out.println(\"No, and\
    \ don't ask again.\");\n    break;\n```\n\nThe reason for this is a feature called\
    \ fall-through. With this old form of the switch statement, execution falls through\
    \ case after case until it encounters a break statement. For example, when randomNumber\
    \ is 4, the computer follows the path shown in Figure 17–4.\n\n```\nswitch (randomNumber)\
    \ {\n    case 3:\n        out.println(\"Yessir, yessir! Three bags full.\");\n\
    \        break;\n    case 4:\ncase 5:\n        out.println(\"No, and don't ask\
    \ again.\");\n        break;\n    case 6:\n        out.println(\"Sure, whatever.\"\
    );\n        break;\n    case 10:\n        out.println(\"No, not until Nell squeezes\
    \ Rover.\");\n        break;\n    default:\n        out.println(\"My random number\
    \ generator is broken!\");\n}\n```\n\nFIGURE 17-4:\nFollow thenbouncing ball.\n\
    \nThe break statement tells the computer, \"Go directly to whatever statement\
    \ comes after the end of the switch statement. Do not pass default. Do not print\
    \ My random number generator is broken!\"\n\nYou have to know about this old form\
    \ of the switch statement because you find it in so many Java programs, but I\
    \ don't recommend writing new code this way. Besides being horribly verbose, the\
    \ use of break statements is an endless source of errors."
