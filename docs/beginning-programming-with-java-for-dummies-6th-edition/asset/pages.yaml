- img_proc: true
  md: "programming, bundle data and functionality into a lump called a class. Just\
    \ remember Barry's immortal words from Chapter 13:\n\nA class... describes the\
    \ way in which you intend to combine and use pieces of data.\n\nAnd why are these\
    \ words so important? They're important because, objectoriented programming, chunks\
    \ of data take responsibility for themselves. object-oriented programming, everything\
    \ you have to know about a string is located in the file String.java. So, if people\
    \ have problems with the strings, they know where to look for all the code. That's\
    \ great!\n\nThis is the deal: Objects contain methods. Chapter 14 shows you how\
    \ to use an object's methods, and this chapter shows you how to create an object's\
    \ methods.\n\n# Making a method\n\nImagine a table containing the information\
    \ about three accounts. (If you have trouble imagining such a thing, just look\
    \ at Figure 15-1.) In the figure, each account has a last name, an identification\
    \ number, and a balance. In addition (and here's the intended part), each account\
    \ knows how to display itself on the screen. Each row of the table has its own\
    \ copy of a display method.\n\n| lastName | id | balance | display |\n|---|---|---|---|n|\
    \ Aju | 9936 | $6,734.00 | (method to display account info) |\n| Lap | 3492 |\
    \ $6,718.00 | (method to display account info) |\n| Ngp | 2151 | $1,008.00 | (method\
    \ to display account info) |\n\nFIGURE 15-1:\nA table of accounts.\n\nThe last\
    \ names in Figure 15-1 may seem strange to you. That's because I generated the\
    \ table's data randomly. Each name is a haphazard combination of three letters:\
    \ one uppercase followed by two lowercase letters.\n\nThough it may seem strange,\
    \ generating values at random is common practice. When you write new code, you\
    \ test the code to find out whether it runs correctly. You can make up your own\
    \ data (values like \"Smith\",u0000,\0). But to give your code a challenging workout,\
    \ you should use unexpected values. If you have values from real-life case studies,\
    \ you should use them. But if you don't have real data, randomly generated values\
    \ are easy to create.\n\n![](img/3bfd2290819a44830f5fb8cead595a57_362_0.png)"
