    3. **Right-click the mouse. On the resulting context menu, choose Refactor ↩ Rename.**

    As a result, IntelliJ suggests some alternatives for the name keyboard. (See Figure
    5-22).

    4. **Type userInput.**

    As you type, IntelliJ changes all occurrences of the word keyboard. (See Figure
    5-23).'
