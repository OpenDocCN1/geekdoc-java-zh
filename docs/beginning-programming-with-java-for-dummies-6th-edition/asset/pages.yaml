    \ takes the place of ten assignment statements because the computer executes the\
    \ statement guestsIn[roomNum] = 1 times. The first time around, the value of roomNum\
    \ is 0, so in effect, the computer executes\n\n```\nguestsIn[0] = 1;\n```\n\n\
    In the next iteration, the value of roomNum is 1, so the computer executes the\
    \ equivalent of the following statement:\n\n```\nguestsIn[1] = 1;\n```\n\nDuring\
    \ the next iteration, the computer behaves as though it's executing\n\n```\nguestsIn[2]\
    \ = 1;\n```\n\nAnd so on. When roomNum gets to 9, the computer executes the equivalent\
    \ of the following statement:\n\n```\nguestsIn[9] = 1;\n```\n\nNotice that the\
    \ counter goes from 0 to 9. Compare this with Figure 19-6 and remember that the\
    \ indices of an array go from 0 to fewer than the number of components in the\
    \ array. Looping with room numbers from 0 to 9 covers all rooms in the Java Motel.\n\
    \nWhen you work with an array and step through the array's components using a\
    \ loop, you normally start the loop counter at 0. To form the condition that tests\
    \ for another iteration, you often write an expression like roomNum < arraySize,\
    \ where arraySize is the number of components in the array.\n\n![](img/3bfd2290819a44830f5fb8cead595a57_469_0.png)\n\
    \n# Creating a report\n\nThe code to represent the report in Figure 19-5 is shown\
