    TABLE 8-1:


    | Operator Symbol | Meaning | Example |

    |---|---|--|

    | == | is equal to |Guess == winningNumber |

    | != | is not equal to | 5 != numberCows |

    | < | is less than | strikes < 3 |

    | > | is greater than | numberOfBotops > 1000 |

    | <= | is less than equal to | lowNumber + highNumber <= 25 |

    | >= | is greater than equal to | gumballsPerKid >= 10 |


    With the operators in Table 8-1, you can compare both numbers.


    Notice the double equal sign in the first row of Table 8-1. Don''t try to use
    a single equal sign to compare two values. The expression myGuess = winningNumber
    (with a single equal sign) doesn''t compare myGuess with winningNumber. Instead,
    myGuess = winningNumber changes the value of myGuess. (It assigns the value of
