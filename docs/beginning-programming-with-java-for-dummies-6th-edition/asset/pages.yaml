    many languages. For example, the Unicode representation of an uppercase letter
    C is 67. The representation of a Hebrew letter x is 1488. (and to take a more
    obscure example) the representation for the voiced retroflex approximant in phonetics
    is 63. But don''t worry about all of this. The only reason I''m writing about
    the char type''s being numeric is to save face among my techie friends.


