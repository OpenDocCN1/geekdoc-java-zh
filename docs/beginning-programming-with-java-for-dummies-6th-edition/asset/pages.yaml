  md: 'brand-new. So the compiler lets the line pass. You get no complaints from your
    old friend, the compiler.


    But then, when you try to run the code, the computer gets ballistic. The Java
    virtual machine (JVM) runs your code. (For details, see Chapter 1.) The JVM needs
    to find a place to start executing statements in your code, so it looks for a
    point named main, with a small m. If the JVM doesn''t see anything named main,
    it gets upset. "Main method not found in class EchoLine." At runtime, the JVM,
    and not the compiler, gives you an error message.


    # What problem? I don''t see a problem


    I end this chapter on an upbeat note by showing some of the things you can change
    in Listing 5-1 without rocking the boat.


    # The identifiers that you create


    If you create an identifier, that name is up for grabs. For example, in Listing
    5-1, you can change keyboard to userInput:


    ```

    Scanner userInput = new Scanner(System.in);

    System.out.println(userInput.nextLine());

    userInput.close();

    ```


    A change of this is fine as long as you make that change throughout your program.
    Here''s the best way to change a name in your program:


    +   1. **Start with Listing 5-1 in the IntelliJ editor.**

    For details, refer to the earlier "Typing and running a program" section.

    2. **In the intellij editor, click on any occurrence of the word keyboard.**

    When you do, IntelliJ highlights all occurrences of the word keyboard. That''s
