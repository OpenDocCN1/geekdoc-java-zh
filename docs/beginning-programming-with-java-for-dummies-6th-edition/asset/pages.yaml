  md: '(continued)


    information on letters being stored as numbers, see the discussion of Unicode
    at the end of Chapter 8.


    +   * Applying (char) to a number turns the number into a char value.


    To store letters ''A'' through ''Z'', the computer puts the numbers 65 through
    90 in its memory. So, applying (char) to a number from 65 to 90 turns the number
    into an uppercase letter. For more information about applying things like (char),
    see the discussion of casting in a sidebar in Chapter 7.


    Pause for a brief summary. The expression (char) (myRandom.nextInt(26) + ''A'')
    represents a randomly generated uppercase letter. In a similar way, (char) (myRandom.nextInt(26)
    + ''a'') represents a randomly generated lowercase letter.


    Watch out! The next couple of steps can be tricky:


    +   * Java doesn''t allow you to assign a char value to a string variable.


    In List 15-3, the following statement would lead to a compiler error:


    ```

    // Bad statement:

    anAccount.lastName = (char) (myRandom.nextInt(26) + ''A'');

    ```


    +   * In Java, you can use a plus sign to add a char value to a string. When you
    do, the result is a string:


    So, " + (char) (myRandom.nextInt(26) + ''A'') is a string containing one randomly
    generated character. And when you add (char) (myRandom.nextInt(26) + ''a'') to
    the end of that string, you get another string—a string containing two randomly
    generated characters. Finally, when you add (char) (myRandom.nextInt(26) + ''a'')
    to the end of that string, you get a string containing three randomly generated
    characters. So you can assign that to anAccount.lastName. That''s how the statement
    in List 15-3 works.


    When you write a program like the one in List 15-3, you have to be careful with
    numbers, char values, and strings. I don''t know this from programming every day
    of the week—before I got this section''s example to work, I had many false starts.
    That''s I''m persistent.


