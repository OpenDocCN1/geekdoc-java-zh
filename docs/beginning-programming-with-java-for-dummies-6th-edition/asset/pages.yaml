    # WHO DOES WHAT, AND HOW?


    When you write a program, you’re called a programmer, but when you run a program,
    you’re called a user. So when you test your own code, you’re both the programmer
    and the user.


    Suppose that your program contains a keyboard.nextSomething() call, like the calls
    in Listings 5-1 (in Chapter 5) and 6-2. Then your program gets input from the
    user. But when the program runs, how does the user know to type something on the
    keyboard? If the user and the programmer are the same person, and the programmer
    is fairly simple,


