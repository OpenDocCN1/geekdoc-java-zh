  md: '# # Misspelling words (and other missteps)


    You''ve found an old family recipe for deviled eggs (one of my favorites). You
    follow every step as carefully as you can, but you leave out the salt because
    of your grandmother''s high blood pressure. You hand your grandmother an egg (a
    finished masterpiece). "Not enough pepper," she says, and she walks away.


    The next course is beef bourignon. You took an unsalted slice to dear old Granny.
    "Not sweet enough," she groans, and she leaves the room. "But that''s impossible,"
    you think. "There''s no sugar in beef bourignon. Even you, so you go back to the
    kitchen and prepare mashed potatoes. You used unsalted butter, of course. "She''ll
    love it this time," you think.


    "Sour potatoes? Yuck! Granny says, as she goes to the sink to spit it out. Because
    you have a strong ego, you''re not insulted by your grandmother''s behavior. But
    you''re somewhat confused. Why is she saying such things about three unsalted
    recipes? Maybe there are some subtle differences that you don''t know.


    Well, the kind of things you''re writing computer programs. You can make the same
    kind of mistake twice (or at least, make what you think is the same kind of mistake
    twice) and get error messages each time.


    For example, if you change the spelling or capitalization of println in Listing
    5-1, Intelli tells you the method Cannot resolve ''Printlin'' in ''Print-Stream''.
    But if you change System to system, Intelli says that Cannot resolve ''system''.
    And with System misspelled, Intelli doesn''t notice whether println is properly
    corrected.


    In Listing 5-1, if you change the spelling of args, nothing program compiles and
    runs correctly. But if you change the spelling of main, you face some unusual
    difficulties. (If you don''t believe me, read the "Runtime error messages" section,
    a little later in this chapter.)


    Still in Listing 5-1, change the number of close braces at the end of the program.
    With two braces, everybody''s happy. If you accidentally type only one close brace,
    Intelli tells you back on course, telling you that ''}'' expected. But if you
    go crazy and type three close braces, Intelli misinterprets everything and says
    ''class or ''interface'' expected. Unfortunately, adding either word (class or
    interface) is no help at all. (See Figure 5-20.)


    Java responds to errors in many different ways. Two changes in your code might
    look alike, but similar changes don''t always lead to similar results. Result
    in your code requires its own, individualized attention.


    ![](img/3bfd2290819a44830f5fb8cead595a57_132_0.png)


