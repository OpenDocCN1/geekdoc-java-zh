  md: '# Chapter 7


    # Numbers and Types


    Not so long ago, people thought computers did nothing but perform big, number-crunching
    calculations. Computers solved arithmetic problems, and that was the end of the
    story.


    In the 1980s, with the widespread use of word processing programs, the myth of
    the big metal math brain went by the wayside. But even then, computers made great
    calculators. After all, computers are very fast and accurate. Computers never
    need to count on their fingers. Best of all, computers don''t feel bored when
    they do arithmetic. I hate ending a meal in a good restaurant by worrying about
    tax and tip, but computers don''t mind that at all. (Even so, computers seldom
    go out to eat.)


    # Using Whole Numbers


    Let me tell you, it''s no fun being an adult. Right now I have four little kids
    in my living room. They''re all staring at me because I have a bag full of gumballs
    in my hand. With 30 gumballs in the bag, the kids are all thinking, “Who''s the
    best? Who gets gumballs than the others? And who''s going to be treated unfairly?”
    They insist on a complete, gumball count, with each kid getting exactly the same
    number of tasty treats. I must be careful. If I''m not, I''ll never hear the end
    of it.


    With 30 gumballs and four kids, there''s no way to divide the gumballs evenly.
    Of course, if I get rid of a kid, I can give 10 gumballs to each kid. The trouble
    is,'
