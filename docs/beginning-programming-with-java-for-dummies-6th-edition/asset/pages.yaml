    # Assignment operators


    If you''ve read the previous section — the section about operators that add 1
    — you may be wondering whether you can manipulate these operators to add 2 or
    add 5 or add 1000000. You can write gumballs++++ and still call yourself a Java
    programmer? Well, you can''t. If you try it, IntelliJ will give you an error message:


    Variable expected


    If you don''t use IntelliJ, you may see a different error message:


    ```

    error: unexpected type

    gumballs++++;

    ^

    required: variable

    found: value

    ```


    IntelliJ or no IntelliJ, the bottom line is the same: Namely, your code contains
    an error, and you have to fix it.


    How can you add values other than 1? As luck would have it, Java has plenty of
    assignment operators you can use. With an assignment operator, you can add, subtract,
    multiply, or divide anything you want. You can do cooler operations, too.


    For example, you can add 1 to the kids variable by writing


    ```

    kids += 1;

    ```


    Is this better kids++ or kids = kids + 1? No, it''s not better. It''s just an
    alternative. But you can add 5 to the kids variable by writing


    ```

    kids += 5;

    ```


