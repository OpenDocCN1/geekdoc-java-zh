    # Enumerating the Possibilities


    Chapter 8 describes Java''s boolean type — the type with only two values (true
    and false). The boolean type is handy, but sometimes you need more values. After
    all, a traffic light''s colors can be green, yellow, or red. A playing card''s
    suit can be spade, club, heart, or diamond. A weekday can be Monday, Tuesday,
    Wednesday, Thursday or Friday.


    Life is filled with small sets of possibilities, and Java has a feature that can
    reflect these possibilities. The feature is called enum type.


    # Creating an enum type


    The story in Listing 10-6 has three possible ends — the Hankees win, the Socks
    win, or the game is tied. You can represent the possibilities with the following-line
    of Java code:


    ```

    enum WhoWins(home, visitor, neither)

    ```


    This week''s game is played at Hankeeville''s Snitft Stadium, so the value home
    represents a win for the Hankees, and the value visitor represents a win for the
    Socks.


    One goal in computer programming is for your program''s structure to mirror whatever
    problem the program solves. When a program reminds you of its underlying problem,
    the program is easy to understand and inexpensive to maintain. For example, a
    program to tabulate customer accounts should use names like customer and account.
    And a program deals with three possible outcomes (home'
