    # FORGET WHAT YOU''VE SEEN


    In Listing 6-1, and in other examples throughout this book, I do something experienced
    programmers avoid doing: I put actual numbers, such as 5 .95 and 25 .0, in my
    Java code. This is called *hard-coding* the values. Hard-coded values to keep
    these introductory programming examples as simple as possible.


    But in most real-life applications, hard-coding is bad. Imagine a day when SnSoft
    raises its shipping-handling fee from $25.00 to $35.00. The program in Listing
    6-1 no works correctly. Someone has to launch Intelli, look over the code, change
    the code, test the new, and distribute the new code to the people who run it.
    What a pain! For the 10-line program in Listing 6-1, this process takes minutes.
    For a 10,000-line program in a real-life setting, this process might take days,
    weeks, or months.


    Rather than hard-code values, you should type values on the keyboard during the
    run of the program. If that is not practical, your program can read values from
    a computer''s hard disk (Chapter 16 has the scoop on reading from disk files).
    One way or another, you should design your program to work with all values, not
    only with specific values such as 5 .95 and 25 .0.


    Keep reading this book''s examples. When you see your hard-coded values, remember
    that I use hard-coded values to keep you from being distracted by input and output
    problems. I keep you focused on whatever new ideas each has to offer. I do not
    hard-coding to convince you that hard-coding is good programming practice. In
    fact, it''s not.


