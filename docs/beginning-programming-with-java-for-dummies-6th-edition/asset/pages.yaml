    \ I need alternative names for parts of an if statement. I call them the if clause\
    \ and the else clause:\n\n```\nif (Condition) {\n    if clause\n} else {\n   \
    \ else clause\n}\n```\n\nAn if statement is an example of a compound statement\
    \ — a statement that includes other statements within it. The if statement in\
