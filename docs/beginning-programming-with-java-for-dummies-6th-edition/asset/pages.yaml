  md: 'To cram a double value into an int variable, you need something called casting.
    When you cast a value, you essentially say, "I''m aware that I''m trying to squish
    a double value into an int variable. It''s a tight fit, but I want to do it anyway.


    To casting, select Intelli''s Cast to ''int'' quick fix. Casting puts the name
    of a type in parentheses, as follows:


    ```

    //This works!

    total = (int) (amount * 100);

    ```


    The casting notation (int) turns the double value 138.0 into the int value 138,
    and everybody''s happy. (See the second figure in this sidebar.)


