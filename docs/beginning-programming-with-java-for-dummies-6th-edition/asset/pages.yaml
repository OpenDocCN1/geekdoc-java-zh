    # Computers Are Stupid


    Handy as they are, all computers do the same thing: They do *exactly* what they
    tell them to do, and sometimes that''s unfortunate. For example, in 1962, a Mariner
    spacecraft to Venus was destroyed just four minutes after its launch. It was destroyed
    by a missing keystroke in a FORTRAN program. Around the same time, NASA scientists
    caught an error that could have trashed the Mercury flights. (Yup these were flights
    with people on board!) The error was a line with a period instead of a comma.
    (A computer programmer wrote DO 1-1 .10 instead of DO 10 1=1,10.)


    With all respect to my buddy Robojees, and his computer cousins are all incredibly
    stupid. Sometimes they look as though they''re-guessing humans, but actually they''re
    just doing what other humans tell them to do. They can toss virtual coins and
    use elaborate schemes to make creative behavior, but they never really think on
    their own. If you say, "Jump," they do what they''re programmed to do in response
    to the letters j-u-m-p.


    So, when you write a computer program, you have to imagine that a genie has granted
    you three wishes. Don''t ask for eternal love because, if you do, the genie will
    give you a slobering, admitting — someone you doesn''t like at all. And don''t
    ask for a million dollars unless you want the genie to turn you into a bank robber.


    Everything you write in a computer program has to be precise. Take a look at an
    example next.'
