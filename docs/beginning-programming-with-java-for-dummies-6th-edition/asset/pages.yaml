  md: '# WHAT CAN POSSIBLY GO WRONG


    Ridding the editor of red words and jagged underlines is cause for celebration.
    IntelliJ likes the look of your code, from that point on, it''s smooth sailing.
    Right?


    Well, it isn''t necessarily so. In addition to some conspicuous compile-time errors,
    your code can have no other, less obvious errors.


    Imagine someone telling you to "go to the intersection and run right." You notice
    immediately that the speaker made a mistake, and you respond with a polite "Huh?"
    The nonsensical run right phase is like a compile-time error. Your "Huh" is like
    the jagged lines in IntelliJ''s editor. As a listening human being, you may be
    able to guess what run tight means, but IntelliJ''s editor never dares to fix
    your code''s mistakes.


    In addition to compile-time errors, some other kinds of gremlins hide inside a
    Java program:


    +   **Unchecked runtime exceptions:** You have no compile-time errors, but when
    you run your program, the run ends prematurely. Somewhere in the middle of the
    run, your instructions tell Java to do something that can''t be done. For example,
    if you''re running the Mortgage program in the earlier "Running the code" section,
    you type 1,000,000.00 instead of 100,000.00. Java doesn''t like the commas in
    the number, so your program crashes and displays a nasty-looking message, as shown
    in the sidebar figure.


    ![](img/3bfd2290819a44830f5fb8cead595a57_73_0.png)


    This is an example of an unchecked runtime exception — the equivalent of someone
    telling you to run right at the intersection when the only thing to right is a
    big wall. IntelliJ''s editor doesn''t warn you about an unchecked runtime exception,
    because, until you run the program, the computer can''t predict that the exception
    will occur.


    +   **Logic errors:** You have no error markers in IntelliJ''s editor, and when
    you run your code, the program runs to completion. The answer isn''t correct.
    Instead of $552.20 the output is $552,203,702.14. (See the next side figure.)
    The program wrongly tells you to pay thousands of times what your house is worth
    and tells you to pay this amount each month! The effort of being to turn right
    instead of turning left. You can drive in the wrong direction for a very long
    time.


    (continued)


    CHAPTER 3 Running Programs 59'
