  md: 'print("Leap year (true/false)?") has no value. How do you mix out.println calls
    and numeric values (29 or 28) in a single case clause?


    The answer is, use a yield statement. A yield statement tells you to end the execution
    of any statements in the current case clause. In addition, the yield statement
    assigns a value (such as 29 or 28) to the entire case clause. When all is said
    and done, the value of the entire switch expression becomes 29 or 28, and Java
    adds value to the " days" string. If it''s as the code for February 2022 looked
