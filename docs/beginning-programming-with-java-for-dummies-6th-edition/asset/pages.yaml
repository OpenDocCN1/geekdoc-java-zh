    This way of writing a while statement is no accident. The look of the statement\
    \ emphasizes an important point — that the computer always checks the condition\
    \ before executing any of the repeated code.\n\nIf the loop's condition is never\
    \ true, the stuff inside the loop is not executed — not even once. In fact, you\
    \ can easily cook up a while loop whose statements are never executed (although\
    \ I can't think of a reason why you would ever want to do that):\n\n```\n// This\
    \ doesn't print anything:\nint twoPlusTwo = 2 + 2;\nwhile (twoPlusTwo == 5) {\n\
    \    System.out.println(\"Are you sure 2+2 doesn't equal 5.\");\n    Everyone\
    \ knows that 2+2 equals 3.\"\n}\n```\n\nIn this spite twoPlusTwo example, the\
    \ while statement turns out to be the most useful of Java's looping constructs.\
    \ In particular, the while loop is good for situations in which you must look\
    \ before you leap. For example: \"Money is in my account, write a mortgage check\
    \ every month.\" When you first encounter this statement, if your account has\
    \ a zero balance, don't write to a mort-gage — not even one check.\n\nBut at times\
    \ (not many), you want to look before you. In a situation when you're asking the\
    \ user for a response, maybe the user's response makes sense, or it doesn't. Maybe\
    \ the user's finger slipped, or the user doesn't understand the question. In many\
    \ situations, it's important to correctly interpret the user's response. If the\
    \ user's response doesn't make sense, you must ask.\n\n# Holding out for a trustworthy\
    \ response\n\nConsider a program that deletes a file. Before deleting it, the\
    \ program asks for confirmation from the user. If the user types Y, delete; if\
    \ the user types N, don't delete. Of course, deleting a file is serious mistake.\
