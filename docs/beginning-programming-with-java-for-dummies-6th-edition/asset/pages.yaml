    # COPY TEXT TO A TEXT FIELD


    Use IntelliJ''s GUI Designer to create a frame with a button and two text fields.
    When the user clicks the button, Java copies text from the first text field to
    the second text field.


    # COPY TO A LABEL


    In Java Swing, a label is similar to a text field. Like a text field, a label
    may display the text. In fact, JLabel component has a setText method, like the
    setText method used in Listing 20-5.


    But a label looks different. A label''s appearance doesn''t invite the user to
    change the label''s text. A label looks like text that''s planted permanently
    on the frame. Of course, the text isn''t permanent, your code can change a label''s
    text.


    Use the GUI Designer to create a frame with a JButton, a JTextFieldField, and
    a JLabel. When the user clicks the button, Java copies text from the text field
    to the label.


    # COPY BETWEEN TEXT FIELDS


    Use the GUI Designer to create a frame with two buttons and two text fields. When
    the user clicks the first button, Java copies text from the first text field to
    the second text field. When the user clicks the second button, Java copies text
    from the second text field to the first text field.


    Hint: Follow Steps 2 through 6 two times in this chapter''s earlier section “Taking
    action”— once for button1 and a second time for button2.'
