    ![](img/3bfd2290819a44830f5fb8cead595a57_522_1.png)


    # # Math


    Do you have numbers to crunch? Do you use your computer to do exotic calculations?
    If so, try Java''s Math class. (It''s a piece of code, not a place to sit down
    and listen to lectures about algebra.) The Math class deals with uc, e, logarithms,
    trig functions, square roots, and all those mathematical doodads that give most
    people the creeps.


    # # NumberFormat


    Chapter 14 has a section about the NumberFormat.getCurrencyInstance. With this
    method, you can turn 20.3385000000000003 into $20.34. If the United States is
    not your home, or if your company sells products worldwide, you can enhance your
    currency instance with a Java Locale. For example, with euro-NumberFormat.getCurrencyInstance(Locale.FRANCE),
    a call to euro-format(3) returns €3 instead of $3.


    The NumberFormat class also has methods for displaying things that aren''t currency
    amounts. For example, you can display a number with or without commas, or without
    leading zeros, and with as many digits beyond the decimal point as you care to
    include.


    508 PART 6 The Part of the Tens'
  merge: -1
  pgno: 522
- img_proc: true
  md: '# Scanner


    Java''s Scanner class can do more than what it does in this book''s examples.
    Like the Format class, the Scanner can handle numbers from various locales. For
    example, to input 3,5 and have it mean “three-and-a-half,” you can type myScanner.use(Locale.FRANCE).
    You can also tell a Scanner to skip input strings or use numeric bases other than
    10. In all, the Scanner class is quite versatile.


    # String


    Chapter 14 examines Java''s String class. The chapter describes (in gory detail)
    a method named equals. The String class has many other useful methods. For example,
    with the length method, you find the number of characters in a string. With replaceAll,
    you can easily change the phrase “my fault” to “your fault” wherever “my fault”
    appears inside a string, and compareTo, you can sort strings alphabetically.


    # System


    You''re probably familiar with System.in and System.out. What about System.getProperty?
    The getProperty method reveals all kinds of information about your computer. Some
    of the information you can find includes your operating system''s name, your processor''s
    architecture, your Java virtual machine version, your classpath, your username,
    and whether your system uses a backslash or forward slash to separate folder names
    from one another. Sure, you may already know all this stuff. But does your Java
    code need to discover it on the fly?'
