  md: '# CREATE A SMALL CALCULATOR


    Use the GUI Designer to create a frame with two text fields, a button, and a label.
    The user types a number in one of the text fields and another number in the other
    text field. When the user clicks the button, Java displays the sum of the two
    numbers in the label.


    **Hint:** Whatever Java gets from a text field''s getText method has String type.
    When you put a plus sign (+) between two String values, Java simply pastes the
    values together — for example, "42" + "98" is "4298". Before you can add these
    values together, you have convert them to numbers. You do this with Java''s Integer.parseInt
    method. (Refer to Chapter 14.)


    When you call a label''s setText method, the call''s parameter must have the String
    type. To get a String value from an int value, use the Integer.toString method
    — for example, Integer.toString(86) is "86".'
