  md: '# Check


    | number | amount | payee | print |

    |---|---|---|--|

    | 1705 | $25.09 | The Butcher | (method to cut the check) |

    | 1699 | $31.27 | The Baker | (method to cut the check) |

    | 1702 | $12.35 | The Candlestick Maker | (method to cut the check) |


    FIGURE 14-7:

    The Check class and some Check objects.


    You''d like to print the checks in numerical order. You need a method to sort
    the checks. The checks in Figure 14-7 were sorted, with the check with number
    1699 would come first, and the check with number 1705 would come last.


    The big question is, should each check have its own sort method? Does the check
    with number 1699 need to sort itself? And the answer is no. Some methods shouldn''t
    belong to the objects in a class.


    Where do methods belong? How can you have a sort method without separating a sort
    for each check?


    Here''s the answer: You make the sort method static. Anything that''s static belongs
    to a whole class, not to any particular instance of the class. If the sort method
    is static, the entire Check class has just one copy of the sort method. This copy
    stays with the entire Check class. How many instances of the Check you create
    — three, ten, or none — you have just one sort method.


    For an illustration of this concept, refer to Figure 14-7. The whole class has
    just one sort method. The sort method is static. No matter how you call the sort
    method, that method uses the same values to do its work. The data in Figure 14-7,
    a single call to the sort method uses all three rows (the 1705, 1699, and 1702
    rows).


    Of course, each individual check (each object, each row of the table in Figure
    14-7) has its own number, its own amount, its own payee, and its own print method.
    When you print the first check, you get one amount, and when you print the second
    check, you get another. Because there''s a number, an amount, a payee, and a print
