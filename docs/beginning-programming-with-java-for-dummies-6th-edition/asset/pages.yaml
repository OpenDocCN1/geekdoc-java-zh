  md: '# Not enough punctuation


    In English and Java, you using the; proper! punctuation is important


    Take, for example, the semicolons in Listing 5-1. What happens if you forget to
    type a semicolon?


    ```

    //The following code is incorrect:

    System.out.println(keyboard.nextLine());

    keyboard.close();

    ```


    If you leave off the semicolon, you see the message shown in Figure 5-15.


    ![](img/3bfd2290819a44830f5fb8cead595a57_126_0.png)


    A message like the one in Figure 5-15 makes your life much simpler. I don''t have
    to explain the message, and you don''t have puzzle over the message''s meaning.
    Just take the message '';'' expected at its face value. Insert the semicolon between
    the end of the System.out.println(keyboard.nextLine()) statement and whatever
    code comes after the statement. (For code that''s easier to read and understand,
    take the semicolon at the end of the System.out.println(keyboard.nextLine()) statement.)


    # Too much punctuation


    In junior high school, my English teacher said I should use a comma whenever I
    normally use a pause for a breath. This advice doesn''t work well during allergy
    season, when my sentences have two commas for three or four words. As a paid author,
    I have trouble deciding where the commas should go, so I often add commas for
    good measure. This makes more work for my copy editor, Becky, who has a trash
    full of commas by the desk in her office.


    It''s same way in a Java program. You can get away with punctuation. Consider,
    for example, the main method header in Listing 5-1. This line is a dangerous curve
    for novice programmers.


    For information on the terms method header and method body, refer to Chapter 4.'
