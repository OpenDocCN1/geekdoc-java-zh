    downloading your own copy of the API docs using the links found at www.oracle.com/technetwork/java/javase/downloads/index.html.


    # Your Java Programming Toolset


    To write Java programs, you need the tools described previously in this chapter:


    +   >> **You need a compiler.** Refer to the section "Translating code."

    >> **You need a JVM.** Refer to the section "Running code."

    >> **You need the Java API.** Refer to the section "Code you can use."

    >> **You need access to the Java API documentation.** Again, refer to the "Code
    you can use" section.


    You also need less exotic tools:


    +   >> **You need an editor to compose your Java programs.** Listing 1-1 contains
    part of a computer program. When you come right down to it, a computer program
    is a bunch of text. So, write to a computer program, you need an *editor* — a
    tool for creating text documents.


    An editor is like Microsoft Word, or any other word processing program. The difference
    is that an editor adds no formatting to your text—no bold, italic, or distinctions
    among fonts. Computer programs have no formatting whatever. They have nothing
    except plain old letters, numbers, and other keyboard characters.


    When you edit a program, you may see text bold, italic text, and text in several
    colors. If your program contains no of this formatting. If you see stuff that
    looks like formatting, syntax highlighting, an editor makes the text appear to
    be formatted in order to help you understand the structure of your program. Believe
