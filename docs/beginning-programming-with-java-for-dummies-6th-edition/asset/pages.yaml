- img_proc: true
  md: '# Are Books Other than Barry’s Good for Learning Java and Android Development?


    Yes, I''d love to recommend some, but I''m not conscientious enough to carefully
    read and review other people'' books.


    # Which Computer Programming Language(s) Should I Learn?


    The answer depends on your goals and (if you plan to work as a developer) on-the-job
    opportunities where you live. The TIOBE Programming Community Index (www.tioobe.com/index.php/content/paperinfo/tpci)
    provides monthly ratings for popular programming languages. But the TIOBE Index
    might not apply specifically to your situation. In June 2021, the Haskell language
    ranks only 47th among the languages used around the world. But there may a hotbed
    of Haskell programming in the town where you live.


    Do you want to write applications for large enterprises? Then Java is a must-have
    language. Do you want to write code for the iPhone? You probably want to learn
    Swift. Do you want to create web pages? Learn HTML, CSS, and JavaScript.


    # What Skills Other than Computer Coding Should I Learn?


    Sorry to disappoint you, but you''re asking someone who has an ax to grind. I''m
    a college professor. I believe that no learning, no matter impractical it might
    seem to be, is ever wasted.


    If you insist on a more definitive answer, go learn a little about databases.
    Database work isn''t necessarily coding, but it''s important stuff. Also, read
    as much as you can about software engineering — the study of techniques for the
    effective design and maintenance of computer code. Don''t be afraid of math, either
    (because learning math stretches your logical-thinking muscles). And, whenever
    you can, hone your communication skills. The better you communicate, the more
    valuable your work is to other people.'
  merge: -1
  pgno: 527
- img_proc: true
  md: '# # How Should I Continue My Learning as a Software Developer?


    Practice, practice, practice. Take the examples you find in my book (or anywhere
    else) and think of ways to change the code. Add an option here or a button there.


    Find out what happens when you try to improve the code. If it works, think of
    another way to make a change. If it doesn''t, search the documentation for a solution
    to your problem. If the documentation doesn''t help (and, documentation doesn''t
    help) search the web for answers to your problem. Post questions at an online
    forum. If you don''t find an answer, put the problem aside for while and let it
    incubate in your mind.


    You don''t learn programming by only reading about — you have to scrape some knuckles
    while writing code and seeking solutions. Only after trying, failing, and trying
    again you can appreciate the work involved in developing software.


    ![](img/3bfd2290819a44830f5fb8cead595a57_528_0.png)


    # # How Else Should I Continue My Learning as a Developer?


    Did you know that I have a second suggestion? I recommend finding like-minded
    people where you live and getting together with them regularly. These you can
    find tech user groups in almost every corner of the globe. Find a Java user group
    that meets in your area and attend the group''s meetings frequently. If you''re
    a novice, you might not understand much of the discussion, but you''ll be exposed
    to the issues that concern today''s Java developers.


    Look for more tech groups and attend their meetings. Find meetings about programming
    languages, other technologies, and other topics that aren''t solely about technology.
    Meet people face-to-face and find out which topics will be in next year''s books.


    To complement those face-to-face meetings, search the web for screen-to-screen
    meetings. You can find free online sessions almost any day of the year.'
  merge: -1
  pgno: 528
- img_proc: true
  md: '# # How Can I Get a Job Developing Software?


    Do all the things you''d normally do when you look for a job, but don''t forget
    about the advice in the previous two paragraphs. User groups are fantastic places
    for networking.


    Go to meetings and be a good listener. Don''t think about selling yourself. Be
    patient and enjoy the ride. I landed a great consulting opportunity only after
    years of attending one group''s meetings. In the meantime, I learned a lot about
    software (and quite a bit about dealing with other people).


    # # I Still Don''t Know What to Do with My Life


    That''s not a question. But it''s okay anyway.


    Everyone has to make ends meet. If you manage to put lifetime on your table, the
    next step is to find out what you love to do. I''ve spent a lifetime teaching
    college students, writing books, and developing computer code — and I love all
    of it. (Well, I like most of it. I dislike grading papers, and I dislike proofreading
    my own work.)


    Fortunately, I can make money teaching, writing, and developing. I could make
    more money working 9–5 for a big company, managing a software team or creating
    the next big start-up, but I don''t like doing things. My life has been enriched
    by what I do like doing, whether I''m working or not.


    My advice is, find the best match of the things you like to do and the things
    that help you earn a living. Compromise, if you must, but be honest with yourself
    about the things that make you happy. (Of course, these things shouldn''t make
    other people unhappy.)


    CHAPTER 22 Ten Bits of Advice for New Software Developers 515'
  merge: -1
