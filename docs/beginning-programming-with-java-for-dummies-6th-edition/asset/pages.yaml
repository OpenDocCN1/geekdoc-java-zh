    # Shining light on filename extensions


    The filenames displayed in Windows File Explorer or macOS Finder can be misleading.
    You may browse one of your folders and see the real name might be idealIC-2021.exe,
    idealIC-2021.dmg, idealIC-2021.somethingElse, or plain old idealIC-2021. Filename
    endings like .exe and .dmg are called filename extensions.


    The ugly truth is that, by default, Windows and Macs hide many filename extensions.
    This awful feature tends to confuse programmers. So, if you don''t want to be
    confused, change your computer''s system-wide settings. Here''s how you do it:


    +   **In Windows 10:** In the taskbar''s Search box, type File Explorer Options
    and then press Enter. When the File Explorer Options dialog box appears, click
    the View tab. Look for the Hide Extensions for Known File Types option. Make sure
    that this box isn''t selected.


    +   **In macOS OS:** On the menu bar for Finder, find Finder Preferences. In the
    dialog box, select the Advanced tab and for the Show All Filename extensions.
    Make sure that this box is selected.


    +   **In Linux:** Linux distributions do not hide filename extensions. So, if
    you use Linux, you probably don''t have to worry about it. But I''ve checked all
    Linux distributions. If your IntelliJ download is named idealIC instead of idealIC.tar.gz
    or idealIC.whatever, check the documentation specific to your Linux distribution.'
