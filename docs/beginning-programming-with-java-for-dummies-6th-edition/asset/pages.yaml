  md: 'gift stands for something one person bestows upon another in a box covered
    in brightly colored paper and ribbons:


    Look! I''m giving you a gift!


    But in German, the word gift means "poison":


    Let me give you some gift, my dear.


    And in Swedish, gift can mean either "married" or "poison":


    As soon they got gift, she slipped a gift into his drink.


    Then there''s French. In France, there''s a candy bar named "Gift":


    He came for the holidays, and all he gave was a bar of Gift.


    What do the letters g-i-f really mean? Well, they mean nothing until you decide
    on a way to interpret them. The same is true of the o''s and 1''s inside a computer''s
    circuitry.


    Take, for example, the sequence 01001010. This sequence can stand for the letter
    J, but it also for the number 74. That sequence of zeros and ones can stand as
    1.0369068636003646-10⁻⁶³. And when interpreted as screen pixels, the same sequence
    can represent the pixels shown in Figure 6-6. The meaning of 01001010 depends
    entirely on the software interprets this sequence.


    ![](img/3bfd2290819a44830f5fb8cead595a57_147_0.png)


