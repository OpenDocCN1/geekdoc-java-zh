    # # Running code


    Several years ago, I spent a week in Copenhagen. I hung out with a friend who
    spoke both Danish and English fluently. As we chatted in the public park, I vagely
    noticed some kids orbiting around us. I don''t speak a word of Danish, so I assumed
    the kids were talking about ordinary kid stuff.


    Then my friend told me the kids weren''t speaking Danish. "What language are they
    speaking?" I asked.


    “They''re talking gibberish,” she said. "It''s just nonsense syllables. They don''t
    understand English, so they''re imitating you.


    Now to return to present-day matters. I look at the stuff in the way my computer
    talks. But then I''d be just like the kids in Copenhagen. What''s meanness to
    me can perfect sense to my computer. When the zeros and ones in 1-1 percolate
    through my computer-circuits, the computer “thinks” the thoughts shown in 1-3.


    Everyone knows that computers don''t think, but a computer can carry out the instructions
    depicted in 1-3. With many programming languages (like C++ and COBOL, for example),
    a computer does exactly what I''m describing. A computer gobbles up some object
    code and does whatever the object code says to.


    That''s how it works in many programming languages, but that''s not how it works
    in Java. With Java, the computer executes a different set of instructions. The
    computer executes instructions using the ones and ones in 1-4.


    The instructions in 1-2 tell the computer how to follow other instructions. Starting
    with `Get colNumber from memory`, the computer''s first instruction is, "Do what
    it says to do in the bytecode file." (Of course, in the bytecode-file, the first
    instruction happens to be `Get colNumber from memory.)


    A special piece of software carries out the instructions in 1-4. That special
    piece of software is called the Java Virtual Machine (JVM). The JVM walks your
    computer through the execution of some bytecode instructions. When you run a Java
    program, your computer is really running the JVM. That JVM examines your bytecode,
    zero by zero, one by one, and carries out the instructions described in the bytecode.'
