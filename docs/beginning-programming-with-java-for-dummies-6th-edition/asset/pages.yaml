    Because all three variables are the same type (the double), I can modify the code
    and declare all three variables in one free sweep:


    ```

    double flashDrivePrice, shippingHandling, total;

    ```


    Which is one declaration or three declarations? Neither is better. It''s a matter
    of personal style.


    You can even add initializations to a combined declaration. When you do, initialization
    applies to only one variable. For example, with the line


    ```

    double flashDrivePrice, shippingHandling = 25.00;

    ```


    the value of shippingHandling becomes 25.00, the variables flashDrivePrice and
    total get no particular value.


    Would you like some practice with this section''s concepts? You got it!


    # THE PARKING ATTENDANT


    An online blog advises a $2 tip when a parking attendant fetches your car in a
