  md: 'To generate numbers in a truly random fashion, you need a big tub of ping-pong
    balls, like the kind they use in lottery drawings. The problem is, most computers
    don''t come with big tubs of ping-pong balls among their peripherals. So, strictly
    speaking, the numbers generated by Java''s Random class are not random. Instead,
    scientists call these numbers pseudorandom.


    +   - If you have a big tub of ping-pong balls, you can find other ways to generate
    numbers randomly. For example, a quantum computer can create something called
    a qubit and put the qubit in a state that''s halfway between 0 and 1. When you
    measure the qubit''s state, you don''t see the halfway business. You always observe
    either regular 0 or regular old 1. Quantum theory dictates that the outcome of
    the measurement (0 or 1) is truly random.


    In 1935, a famous Erwin Schrödinger considered making a qubit out of a real live
    cat. Schrödinger''s cat could be alive (1) or dead (0), and only the random of
    nature would determine the cat''s state of being. Things went well until Schrödinger
    tried to generate 100 values in a row. His landlord heard the meowing, smelled
    the cat boxes, and immediately called the local health department. Schrödinger''s
    experiment came to an abrupt end.


    Rumors about an experiment named "Schrödinger''s Landlady" persist to this day.


    +   - It surprises us all, knowing one randomly generated value is of no help
    in predicting the next randomly generated value.


    For example, if you toss a coin twice and it lands heads-up both times, is it
    more likely to land tails-up on the third flip? No, it''s 50-50.


    If you have two sons and you''re expecting a fourth child, is the fourth child
    more likely to be a girl? No gender has nothing to do with the genders of the
    older children. (I ignoring any biological effects, which I know absolutely about.
    Wait! I know some biological trivia: A newborn child is more likely to be a boy
    than a girl. In the United States, for every 21 newborn boys, there are only 20
    newborn girls. Boys are weaker, so guys like me die faster. That''s why nature
    makes of us at birth.)


