  md: '# IF THINE OFFENDS THEE, CAST OUT


    The run in Figure 7-6 seems artificial. Why would you start with 138 cents? Why
    not use the more familiar $1.38? The reason is that the number 1.38 isn''t a whole
    number, and whole numbers are more accurate than other kinds of numbers. In fact,
    without whole numbers, the remainder operator isn''t very useful. For example,
    the value of 1.38 % .25 is 0.12999999999. All these nines are tough to work with.
    Imagine reading your card statement and seeing that you owe $0.1299999999999999.
    You''d probably pay $0.13 and let the credit card company keep the change. After
    years of rounding numbers, the credit card company would make a fortune! Chapter
    8 describes in a bit more detail, inaccuracies that may come from using double
    values.


    Through this book, I illustrate java''s double type with programs about money.
    Many authors do the same thing. But for greater accuracy, avoid using double values
    for money. Instead, you should use int or the long values that I describe in the
    last section of this chapter. Even better, look up BigInteger and BigDecimal in
    Java''s API documentation. These BigSomethingOrTypes are complex to use, but they
    provide industrial-strength numeric range and accuracy.


    Now, if you want to multiply 1.38 and then have the program take your it into
    138 cents? How can you get your program to do this?


    My first idea is to multiply 1.38 by 100:


    ```

    //This doesn''t quite work.

    double amount;

    int total;

    amount = keyboard.nextDouble();

    total = amount+100;

    ```


    In everyday arithmetic, multiplying by 100 does do the trick. But computers are
    fussy. With a computer, you have to be very careful when you mix int and double
    values. (See the first figure in this sidebar.)


    ```

    System.out.print("How much money do you have?");

    amount = keyboard.nextDouble();

    total = amount * 100;

    ```


    | | Required type: |

    | :--- | :--- |

    | quarters = total / 2 | int |

    | whatLeft = total % | double |

    | dimes = whatLeft / 100 | More actions...'
