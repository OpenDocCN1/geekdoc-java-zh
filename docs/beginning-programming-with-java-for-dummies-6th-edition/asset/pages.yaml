  md: '# Diagnosing a problem


    The "Typing and running a program" section, earlier in this chapter, tells you
    how to run the EchoLine program. If all goes well, your screen ends up looking
    like the one shown in Figure 5-1. But things don''t always go well. Sometimes
    your finger slips, inserting a typo into your program. Sometimes you ignore one
    of the details in Listing 5-1 and you get a nasty error message.


    Of course, some things in Listing 5-1 are okay to change. Not every word in Listing
    5-1 is cast in stone. Here''s a nasty wrinkle: I can''t tell you that you must
    always retry Listing 5-1 exactly as it appears. Some changes are okay; others
    are not. Keep reading for "f rinstances."


    # Case sensitivity


    Java is case-sensitive. Among other things, case-sensitive means that, in a Java
    program, the letter P isn''t the same as the letter p. If you send me some email
    and start with "Hi Barry" instead of "Hi", I still know what you mean. But Java
    doesn''t work that way.


    Change just one character in a Java program, and instead of an eventful compilation,
    you get a big headache! Change p to P, like so:


    ```

    //The following line is incorrect:

    System.out.println(keyboard.nextLine());

    ```


    When you type it in IntelliJ''s, you get the ugliness shown in Figure 5-13.


    ![](img/3bfd2290819a44830f5fb8cead595a57_124_0.png)


    | System.out.println(keyboard.nextLine()); | |

    | :--- | :--- |

    | Cannot resolve method ''println'' in ''PrintStream'' | |

    | Rename reference ⏎ | More actions... ⏎ |


    When you see error markers like the one in Figure 5-13, your best bet is to call
    and read the messages carefully. The messages contain useful hints. (Of course,
    sometimes they don''t.) The message in Figure 5-13 is Cannot resolve method ''println''
    in ''PrintStream''. In plain English, this means, "The compiler cannot interpret
    the word println." (The message stops of saying, "Don''t type the word println,
    you dummy!") In any case, if the compiler proves you are one of dummies, you should
    take it as a compliment.) Now, for plenty of reasons the compiler may not be able
    to understand word like


