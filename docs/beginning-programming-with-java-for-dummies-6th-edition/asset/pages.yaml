  md: '# 4 < age && < 8


    The value of the.. age variable is greater than 4 and is less than 8. The numbers
    5, 6, 7, 8, 9... are all greater than 4. Among these numbers, only 5, 6, and 7
    are less than 8. So only the numbers 5, 6, and 7 satisfy this combined condition.


    # age < 4 || || < age


    The value of the age variable is less than 4 or greater than 8. To create the
    condition, use two pipe symbols. On US English keyboards, you can find the pipe
    symbol immediately above the Enter key (the same key as the backslash, shifted).


    In this condition, the value of the age variable is less than 4 or greater than
    8. For example, if a number is less than 4, the number satisfies the condition.
    Numbers 1, 2, and 3 are all less than 4, so these numbers satisfy the condition.


    Also, if a number is greater than 8, the number satisfies the condition. Numbers
    like 9, 10, and 11 are all greater than 8, so these numbers satisfy the condition.


    # !eachKidGetsTen


    If I were experienced with computer programming languages, I''d be confused by
    the exclamation point. I think that eachKidGetsTen means, "Yes, each kid does
    get ten." But that''s not what this expression means. The expression says, "The
    variable eachKidGetsTen does not have the value true." In Java and other programming
    languages, an exclamation point stands for negative, for no way, for not.


    Listing 8-4 (refer to Chapter 8) has a boolean variable named eachKidGetsTen.
    A boolean variable''s value is either true or false. Because it means not, the
    expressions eachKidGetsTen and eachKidGetsTen have opposite values. So, when eachKidGetsTen
    is true, eachKidGetsTen is false (and vice versa).


    > Java''s || is inclusive. This means that you get true whenever the left side
    is true, the on the right side is true, or both are true. For example, the condition
    2 < 10 || 20 < 3 is true.


    ![](img/3bfd2290819a44830f5fb8cead595a57_235_0.png)


    In Java, you can''t combine comparisons the way you do in English. In English,
    you may say, "We''ll have between three and ten people at the dinner table." But
    in Java, you will get an error message if you write 3 <= people = 10. To do this
    comparison, you need something like 3 <= people && people <= 10.


    ![](img/3bfd2290819a44830f5fb8cead595a57_235_1.png)'
