    # # Stuffing values into an array


    In 19–4, you put values into the guestsIn array by repeatedly reading numbers
    from a disk file and storing the numbers, element by element, in the array. Rather
    than drop array values one by one, you can populate an array in one fell swoop.
    This section describes a few ways for you to do it:


    +   >> You can use java''s fill method.


    When your hotel is brand-spanking-new, you start off no guests in any of the rooms.
    You can put zeros in each room with the following statement:


    ```

    Arrays.fill(guestsIn, 0);

    ```


    If some reason you want to put two guests in each room, you''d do this:


    ```

    Arrays.fill(guestsIn, 2);

    ```


    The only prerequisite is an import declaration at the start of your program:


    ```

    import java.util.Arrays;

    ```


    What''s going when you call Arrays.fill?Java has a class named Arrays, and that
    class has a static method named fill. For more static methods, refer to Chapter
    14.


