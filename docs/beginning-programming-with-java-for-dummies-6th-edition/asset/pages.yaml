    # # The Elements in a Java Program


    That both English and Java are called languages is no coincidence. You use a language
    to express ideas. English expresses ideas to people, and Java expresses ideas
    to computers. What''s more, both English and Java have things like words, names,
    and punctuation. In fact, the biggest difference between the two languages is
    that Java is easier to learn English. (If English were easy, computers would understand
    English. Unfortunately, they can''t.)


    Take an ordinary English sentence and compare it with the code in Listing 4-1.
    Here''s the sentence:


    > Ann doesn''t pronounce the "r" sound because she''s from New York.


    In your high school grammar class, you worried about verbs, adjectives, and other
    parts of speech. In this book, you think in terms of keywords and identifiers,
    as summarized in Figure 4-2.


    Keywords:

    Ann doesn''t pronounce the "r" sound because she''s from New York.

    An identifier that you or I can define:

    Ann doesn''t pronounce the "r" sound because she''s from New York .

    An identifier with a commonly agreed upon meaning:

    Ann doesn''t pronounce the "r" sound because she''s from New York.

    A literal:

    Ann doesn''t pronounce the "r" sound because she''s from New York.

    Punctuation:

    Ann doesn''t pronounce the "r" sound because she''s from New York.

    A comment:

    Ann doesn''t pronounce the "r" sound because she''s from New York. (That''s a
    sentence.)


    FIGURE 4-2:

    The things you find in a simple sentence.


    Ann''s sentence has all kinds of things in it. They''re the same kinds of things
    that you find in a computer program. So here''s the plan: Compare the elements
    in Figure 4-2 with similar elements in Listing 4-1. You understand English, so
    you can use this understanding to figure out new things about Java.'
