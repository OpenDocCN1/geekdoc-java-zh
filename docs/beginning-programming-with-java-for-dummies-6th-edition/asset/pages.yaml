    \ class has three fields — namely, the unitPrice field, the quantity field, and\
    \ the taxable field.\n\nAfter you've created an object, you use dots to refer\
    \ to the object's fields. For example, in Listing 13-3, I put a value into the\
    \ onePurchase object's field with the following code:\n\n```\nonePurchase.unitPrice\
    \ = keyboard.nextDouble();\n```\n\nLater in Listing 13-3, I get the unitPrice\
    \ field's value with the following code:\n\n```\ndouble total = onePurchase.unitPrice\
    \ + onePurchase.quantity;\n```\n\nThis business logic may look cumbersome, but\
    \ it really helps programmers when they're trying to organize the code. In Listing\
    \ 13-1, each variable is a separate entity. In Listing 13-3, each use of the word\
