  md: '# Chapter 16

    nPiles of Files: Dealing with Information Overload


    Consider these scenarios:


    +   >> You''re a business owner who handles hundreds of invoices each day. You
    store invoice data in a file on your hard drive. You need customized code to sort
    and classify the invoices.


    +   >> You''re an astronomer with data from scans of the night sky. When you''re
    ready to analyze a chunk of data, you load the chunk onto your computer''s hard
    drive.


    +   >> You''re the author of a popular self-help book. Last year''s fad was the
    Self-Mirroring Method. This year craze is the Make Your Cake System. You can''t
    modify your manuscript without converting to the publisher''s new specifications.
    You need software to make the task bearable.'
  merge: -1
