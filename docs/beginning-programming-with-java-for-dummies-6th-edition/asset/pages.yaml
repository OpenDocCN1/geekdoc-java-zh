    The \ncombination of characters is an example of an escape sequence. Think of
    \nas a temporary escape from the burden of displaying the characters in the quoted
    string. When you run the code, you don''t see night\nAnd IntelliJ''s tool window.
    Instead, you use the word night followed by the start of a new line and then the
    word. It''s as if the string of characters looked like this:


    ```

