    You''ve probably used a computer to do word processing: Type a letter, print it,
    and then send the printout to someone you love. If you have easy access to a computer,
    you''ve probably surf the web: Visit a page, click a link, and see another page.
    It''s easy, right?


    Well, it''s easy only because someone told the computer exactly what to do. If
    you take a computer fresh from the factory and no instructions to it, it can''t
    word processing, it can''t surf the web, and it can''t do anything. All a computer
    can do is follow the instructions that people give to it.


    Now that you''re using Microsoft Word to write the great American novel and you
    come to the end of a line. (You''re not at the end of a sentence; just the end
    of a line.) As you type the next word, the computer''s cursor jumps automatically
    to the next line of type. What''s going on here?'
