    # Chapter 22

    Ten Bits of Advice for New Software Developers


    > enjoy hearing from the people who read my books. "Nice job!" one reader says.
    Another reader asks, "Can I run Java programs without installing IntelliJ?" Yet
    another posts this comment: "You''re Barry Burd. Does that mean you are related
    to Larry Bird?


    In all questions I receive from readers, one of the popular themes is "What to
    do next?" More specifically, people ask me what else to learn, what else to read,
    how to get writing software, how to find work, and other questions of that. I''m
    flattered to be asked, but I''m reluctant to think of myself as an authority on
    such matters. No two people give you the same answers to these questions, and
    if you ask enough people, you''re sure to find disagreement.


    This article contains ten pieces of advice based on questions I''ve received from
    readers. Remember that, in addition to these hints for living and learning, I
    have one additional, overriding piece of advice:


    Think critically about the advice you receive. When in doubt, trust your intuition.


    CHAPTER 22 Ten Bits of Advice for New Software Developers 511'
