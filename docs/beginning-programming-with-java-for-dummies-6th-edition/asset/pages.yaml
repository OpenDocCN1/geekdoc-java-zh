  md: '# WHY CAN''T THE COMPUTER FIX IT?


    How often do you get to finish someone else''s sentence? "Please," says your supervisor,
    go over there and connect the —


    "Wires," you say. "I''ll connect the wires." If you know what someone means to
    say, why wait for them to say it?


    This same question comes up in connection with computer error messages. Take a
    look at the message in Figure 5-15. The computer expects a semicolon after the
    statement on Line 8. Well, Mr. Computer, if you know where you want a semicolon,
    just add the semicolon and be done with it. Why are you bothering me it?


    The answer is simple: The computer isn''t interested in taking any chances. What
    if you don''t really want a semicolon after the statement on Line 8? What if the
    missing semicolon represents a profound problem? If the computer added the extra
    semicolon, it could potentially do more harm than good?


    Returning to you and your supervisor:


    "Please," says your supervisor, "go over there and connect the —


    "Wires," you say. "I''ll connect the wires."


    Boom! A big explosion. "Not the wires, dummy. The dots. I wanted to connect the
    dots.


    "Sorry," you say.


    Normally, you shouldn''t end a method header with a semicolon. But people add
    semicolons anyway. Maybe, in some subtle way, a method header looks like it should
    end with a semicolon:


    ```

    //The following line is incorrect:

    public static void main(String[] args) {

    ```


    If you add this extraneous semicolon to the code in Listing 5-1, you get the message
    shown in Figure 5-16.


    The error message in Figure 5-16 is a bit misleading. The message says Missing
    method body, or declare abstract. But the method has a body. Doesn''t it?'
