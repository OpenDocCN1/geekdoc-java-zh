  md: '# Using punctuation


    In 15-3, notice the use of dots. To refer to the lastName stored in the anAccount
    object, you write


    ```

    anAccount.lastName

    ```


    To get the anAccount object to display itself, you write


    ```

    anAccount.display();

    ```


    That''s great! When you refer to an object''s field or call an object''s method,
    the only difference is parentheses:


    +   - To refer to an object''s field, you don''t use parentheses.

    - To call an object''s method, you use parentheses.


    When you call a method, you put parentheses after the method''s name. This even
    if you have nothing to put inside the parentheses.


    ![](img/3bfd2290819a44830f5fb8cead595a57_368_0.png)


    # Combining characters


    In 15-3, the statement


    ```

    anAccount.lastName = "" + +

    (char)(myRandom.nextInt(26) + ''A'') +

    (char)(myRandom.nextInt(26) + ''a'') +

    (char)(myRandom.nextInt(26) + ''a'');

    ```


    has many plus signs, and each concatenates them together. The first is an empty
    string (""). This string contains no characters, so it''s invisible. It doesn''t
    get in the way of your seeing the second, third, and fourth things. The later
    "Generating strings randomly" sidebar reveals the mysterious purpose of using
    empty string.


    Upon the empty string, the program concatenates a second. This second thing is
    the value of the expression (char)(myRandom.nextInt(26) + ''A''). The expression
    may look complicated, but it''s really no big deal. This expression represents
    an uppercase letter (any uppercase, generated randomly). Once again, the later
    "Generating strings randomly" sidebar tells a complete story.


    Upon the empty string and the uppercase letter, the program concatenates a third.
    This third thing is the value of the expression (char)(myRandom.nextInt(26) +
    ''a''). This expression represents a lowercase letter (any lower- letter, generated
    randomly).


