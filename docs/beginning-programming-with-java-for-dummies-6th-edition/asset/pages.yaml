    # # The Java smorgabord


    I could write a whole book about the different kinds and models of Java over the
    years. If I did, the book would be painful to read — like a dictionary, but with
    interesting word-origin stories. Anyway, this explains some of the methodology
    as you travel through the Java ecosystem.


    # ## Medium Java, little Java, and gigantic Java


    At some point, you will see mention of Java SE, Java ME, or Java EE. Here''s the
    lowdown on these three kinds of "Java E":


    +   - Java Standard Edition (Java SE): This is the only edition you should think
    about (for now, anyway). Java SE includes all the code you need in order to create
    general-purpose applications on a typical computer. Nowadays, when you hear the
    word Java, it almost always refers to Java SE.


    +   - Java Micro Edition (Java ME): The Micro Edition contains code for special-purpose
    devices such as television sets, printers, and other gadgets. The book that you''re
    reading contains no Java ME examples.


    +   - Java Enterprise Edition (Java EE): In 1999, the Java released an edition
    that was tailored for the needs of big companies. The starring role in this edition
    was a framework called Enterprise JavaBeans — a way of managing storage across
    connected computers. In 2017, Oracle walked away from Java EE, handing it over
    to the Eclipse Foundation, which renamed it Jakarta EE.


    The rest of this book deals exclusively with Java Standard Edition.


    # ## Java for developers and Java for consumers


    What comes to mind when you think about a chair? If you''re a typical consumer,
    you think about a horizontal surface — a place to put your bottom. You may also
    think about a supporting structure for the chair (such as four legs) and some
    extra parts for resting your arms and your back.'
