  md: '# Creating New Values by Applying Operators


    What could be more comfortable than your old friend the plus sign? It was the
    first thing you learned in elementary school math. Almost everybody knows how
    to add two and two. In fact, in English usage, adding two and two is a metaphor
    for something that''s easy to do. Whenever you see a plus sign, one of your brain
    cells says, “Thank goodness, it could be something more complicated.”


    So Java has a plus sign. You can use the plus sign to add two numbers:


    ```

    int apples, oranges, fruit;

    apples = 5;

    oranges = 16;

    fruit = apples + oranges;

    ```


    Of course, the old minus sign is available,


    ```

    apples = fruit - oranges;

    ```


    Use an asterisk for multiplication and a forward slash for division:


    ```

    double rate, withholding;

    int hours;


    rate = 6.25;

    hours = 35;

    pay = rate * hours;

    withholding = pay / 3.0;

    ```


    When you divide an int by another int value, you get an int value. The computer
    doesn''t round off any remainder. If you put System.println(11 / 4) in your program,
    the computer prints 2, 75. If you need a decimal answer, either (or both) of the
    numbers you''re dividing values. For example, if you use System.println(11.0 /
    4) in your program, the computer divides a double value, 11.0, by an int value,
    4. Because at least one of the values is double, the computer prints 2.75.


    ![](img/3bfd2290819a44830f5fb8cead595a57_168_0.png)


    # Finding a remainder


    There''s a useful arithmetic operator called the remainder operator. The symbol
    for the remainder operator is the percent (%). When you use System.out.println(11
    % 4) in your program, the computer prints 3. It is because 4 goes into 11-cares-how-many,
    with a remainder of 3.


    PART 2 Writing Your Own Java Programs'
