  md: '# COMPRESSED ARCHIVE FILES


    When you visit http://beginprog.allmycode.com and you download this book''s Java
    examples, you download a file named BeginProgJavaummies6.zip. .zip file is a single
    file that encodes a bunch of files and folders. For example, my BeginProgJavaummies6.zip
    file encodes folders Chapter 03, Chapter 04, and so on. The Chapter 06 folder
    contains subfolders, which in turn contain files (The folder named 06–02 contains
    the code in Listing 6–2—the second listing in Chapter 6).


    A .zip file is an example of a compressed file. Other examples of compressed archives
    are .tar .gz files, .tar files, and .7 files. Uncompressing a file means extracting
    the original files stored inside the big archive file. (For a .zip file, another
    for uncompressing is unzipping)Uncompressing normally re-creates the folder structure
    encoded in the file. So, after uncompressing my BeginProgJavaummies6.zip file,
    your drive has a folder named BeginProgJavaummies6 with subfolders Chapter 03,
    Chapter 04, and so on. Each subfolder contains subfolders of own.


    When you download BeginProgJavaummies6.zip, your browser may uncompress the file
    for you. If the icon next to BeginProgJavaummies6 in File Explorer or Finder looks
    like a typical folder icon, then your browser has done uncompressing. If not,
    you have to tell your computer to uncompress the .zip file.


    Don''t get started listing the dozens of ways to uncompress a .zip file! Some
    ways work on certain systems; other ways work on some other systems. If you''re
    not sure how to uncompress my .zip file, try one of these tricks:


    +   - On Windows: In File Explorer, navigate to the folder containing the .zip
    file. Right-click the .zip file. In the resulting context menu, select Extract
    All. In the resulting dialog box, put a check mark in the Show Files When Complete
    check box, and then press Extract. Windows displays the contents of your new uncompressed
    BeginProgJavaummies6 folder.

    - On a Mac: In a Finder, navigate to the folder containing the .zip file. When
    you double-click this .zip file, your Mac creates a brand-new folder with the
    name BeginProgJavaummies6. (The icon for this item looks like a typical folder''s
    icon). This new folder contains the uncompressed versions of the files that were
    encoded in the .zip file.'
