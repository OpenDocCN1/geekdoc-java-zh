- img_proc: true
  md: 'Each situation calls for a new computer program, and each program reads from
    a large data file. On top of all of that, each program creates a brand-new file
    con-taining, shiny results.


    In previous chapters, the examples get input from the keyboard and send output
    to Intelli''s Run window. That''s fine for small tasks, but you can''t have the
    computer prompt you for each bit of night data. For big programs, you need lots
    of data, and the best place to store the data is on a computer''s hard drive.


    # # Running a Disk-Oriented Program


    To deal with volumes of data, you need tools for reading from (and writing to)
    disk files. At the mere mention of disk files, some people''s hearts start to
    palpit with fear. After all, a disk file is elusive and invisible. It''s stored
    somewhere inside your computer, with some magic magnetic.


    The truth is, getting data from a disk is like getting data from the keyboard.
    And printing data to a disk is like printing data to the computer screen.


    In this book, displaying a program''s text output "on the computer screen" means
    displaying text in Intelli''s Run window. If you shun Intelli in favor of a different
    IDE (like Eclipse or NetBeans) or shun all IDEs of your system''s command window,
    then you, on the computer screen means something slightly different. Please read
    before the lines as necessary. I''m well aware that many computers have SSD drives
    with no-to-goodness inside them. So, terms like disk-oriented and disk files are
    showing signs of age. But let''s face facts: a "record store" no longer focuses
    on vinyl records, and in US measurement, 12 inches is no longer the length of
    the king''s foot. Today''s LCD screens no longer need saving. And, unlike the
    old mechanical car, radio buttons don''t mark your favorite stations.


    ![](img/3bfd2290819a44830f5fb8cead595a57_392_0.png)


    Consider the scenario when you run the code in earlier chapters. You type some
    stuff on the keyboard. The program takes this and spits out some of its own. The
    program sends this new stuff to the Run window. In effect, the flow of data goes
    from the keyboard to the computer''s innards and then to the screen, as shown
    in Figure 16.


    Of course, the goal in this chapter is illustrated in Figure 16–2. It shows a
    file-containing data on a hard drive. The program takes data from the disk file
    and spits out brand-new data. The program sends this new data to another file
    on the hard drive. In effect, the flow of data goes from a disk file to the computer''s
    innards and on to another disk file.'
