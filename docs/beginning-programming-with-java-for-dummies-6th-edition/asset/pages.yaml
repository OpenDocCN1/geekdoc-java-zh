  md: '# Why bother?


    On the surface, the code in Listing 13-3 is longer, more complicated, and harder
    to read. But think about a big pile of laundry: It may take time to find a basket
    and to shovel socks into the basket, but when you have clothes in the basket,
    the clothes are much easier to carry. It''s the same way with the code in Listing
    13-3. When you have your data in a Purchase basket, it''s much easier to do complicated
    things with purchases.


    # AN ANALOGY OF SORTS (ALONG WITH AN EXCUSE!)


    As far as many professional programmers are concerned, the code in Listings 13-2
    and 13-3 is quite simple. In fact, it''s too simple. Java programmers don''t like
    expressions such as onePurchase.unitPrice, and they hate declarations such as
    double unitPrice. They prefer private double unitPrice along expressions as onePurchase.getUnitPrice().These
    programmers will tell you that "the code in Burd''s examples isnt safe,"Burd''s
    examples promote bad programming practices," "In the summertime, Burd wears colors
    that don''t match." In fact, these pros are absolutely correct.


    But in my opinion, you learn to walk before you learn to run. Classes and objects
    are difficult concepts, so I present them in a simple form as I possible. Object-oriented
    programming is an art as well as a science. A way of thinking — whose mastery
    requires time and patience. I have students at the university (some outstanding
    students) who spend months wrestling with the fundamentals of classes and objects.


    In this book, I don''t present the most-honored, expert-approved way of dealing
    with classes and objects. Instead, I follow the simplest path to get classes and
    objects into your consciousness. You can learn the better way of doing things
    after you''ve become comfortable dealing problems into their object-oriented parts.


    And besides, for all the nasty things someone might say about this chapter''s
    simple examples, the examples aren''t fake. They run, they produce output, and
    they illustrate the separating of a class from the main program''s code. At the
    core, that''s object-oriented programming is all about.


    So there!'
