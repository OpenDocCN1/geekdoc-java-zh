    Have you ever heard that wonderful joke about a circus acrobat jumping over mice?
    Unfortunately, I''d get sued for copyright infringement if I included the joke
    in this book.


    Anyway, the joke is about starting small and working your way up to bigger things.
    That''s what you do when you read Beginning Programming with Java For Dummies,
    6th Edition.


    Most of the examples in this book are command line programs. A command line program
    has no windows, no dialog boxes—nothing of that kind. With a command line program,
    the user types characters in Console view, and the program displays output in
    the same Console view.


    These days, the few available programs are command line. Almost all programs use
    a GUI — a graphical user interface. So if you''ve read every word of this book
    so far, you''re probably saying to yourself, “When am I going to find out how
    to create a GUI?


    Well, now''s the time! This chapter introduces you to the world of GUI programming
    in Java.


    You can see GUI versions of many examples from this book by visiting the book''s
    website (http://beginprog.allmycode.com).


