  md: "# How you choose to do things\n\nA program is like a fingerprint. No two programs\
    \ look much alike. Say that I discuss a programming problem with a colleague.\
    \ Then we go our separate ways and write our own programs to solve the same problem.\
    \ Sure, we're duplicating the effort. But will we create the exact same code?\
    \ Absolutely not. Everyone has their own style, and everyone's style is unique.\n\
    \nI asked Java programmer David Herst to write his own EchoLine program, without\
    \ showing my code from Listing 5-1. Here's what he wrote:\n\n```\nimport java.io.BufferedReader;\n\
    import java.io.InputStreamReader;\nimport java.io.IOException;\n\npublic class\
    \ EchoLine {\n    public static void main(String[] args) throws IOException {\n\
    \        InputStreamReader isr = new InputStreamReader(System.in);\n        BufferedReader\
    \ br = new BufferedReader(isr);\n        String input = br.readLine();\n     \
    \   System.out.println(input);\n    }\n}\n```\n\nDon't worry about BufferedReader,\
    \ InputStreamReader, or things like that. Just notice that, like snowflakes, no\
    \ two programs are written alike, even if they accomplish the task at hand. It\
    \ means that your code, however different, can be as good as the next person's.\
    \ That's encouraging.\n\n# COMPILE-TIME ERRORS\n\nThe MCV vaccine helps you build\
    \ an immunity to measles by giving you a mild case of measles. In the same way,\
    \ you can enhance your immunity against programming errors by making mistakes\
    \ intentionally in small, throwaway Java programs.\n\nNo matter how many years\
    \ you spend writing code, you'll always have some programming errors in any new\
    \ code you write. Even the most experienced programmers make mistakes. But by\
    \ practicing, you can discover some errors that beginners make most often, and\
    \ become accustomed to the \"code, test, fix, code again\" cycle.\n\n![](img/3bfd2290819a44830f5fb8cead595a57_138_0.png)\n\
    \n124 PART 2 Writing Your Own Java Programs"
