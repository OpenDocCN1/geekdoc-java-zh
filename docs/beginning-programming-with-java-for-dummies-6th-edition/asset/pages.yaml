  md: '# ESOTERIC GENERICS


    In the ArrayList of Listing 19-6, each element is a String. The declaration''s
    generic parameter tells you so:


    ```

    var people = new ArrayList<String>();

    ```


    You can choose almost any type into a generic parameter. For example, in Chapter
    13, you declare your own Purchase class. You can create an ArrayList to store
    purchase instances:


    ```

    var recentPurchases = new ArrayList<Purchase>();

    ```


    In Chapter 15, you declare your own Account class. You can make an ArrayList to
    hold your Account instances:


    ```

    var activeAccounts = new ArrayList<Account>();

    ```


    Imagine a program that reads from ten different files. You can create an ArrayList
    of File objects and an ArrayList of Scanner objects.


    The only gotcha for a novice programmer is that you can not store primitive types
    in an ArrayList. For example, you can write


    ```

    var tallies = new ArrayList<int>(); //Bad!

    ```


    Chapter 7 lists six of Java''s primitive types, but that chapter doesn''t describe
    the corre- wrapper types. You get a glimpse of the wrapper types in Chapter 14,
    you encounter Java''s Integer class. The word Integer represents a class, and
    a class can have methods. So, in Chapter 14, you use the Integer class''s parseInt
    method:


    ```

    numberOfChips = Integer.parseInt(reply);

    ```


    Best of all, Integer can be a generic parameter.


    ```

    var tallies = new ArrayList<Integer>(); // Good!

    tallies.add(150);

    tallies.add(225);

    out.println(tallies.get(0) + tallies.get(1)); // Displays 375

    ```


    Each of Java''s primitive types has a corresponding wrapper class. The Table 19-1
    tells you all about it.'
