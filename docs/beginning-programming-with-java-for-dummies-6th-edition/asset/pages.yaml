  md: 'Here is something interesting. The parameter in the addInterest method''s header
    is rate. But, inside the ProcessNiceAccounts class, the parameter in the method
    call is interestRate. That''s okay. In fact, it''s standard practice.


    In Listings 15-6 and 15-7, the names of the parameters don''t have to be the same.
    The only thing that matters is both parameters (rate and interestRate) have the
    same type. In Listings 15-6 and 15-7, both of these parameters are of type double.
    So everything is fine.


    Inside the addInterest method, the = assignment operator adds balance (rate /
    100.0) to the existing value. For some info about the +=-operator, see Chapter
    7.


    # Working with a method header


    In the next few, I make some observations about the addInterest method header
    (in Listing 15-6):


    +   > The void tells the computer that when the addInterest method is called,
    the addInterest method doesn''t send a value back to the place that it calls.


    The next section has an example in which a method sends a value back.


    +   > The addInterest is the method''s name.


    That''s the name you use to call the method when you''re writing the code for
    the ProcessNiceAccounts class. (See Listing 15-7).


    +   > The parentheses in the header contain placeholders for all the things you''re
    going to pass to the method when you call it.


    When you call a method, you can pass information to the method on the fly. This
    information is the method''s parameter list. The addInterest method''s header
    says that the addInterest method takes one of information, and that piece of information
    is of type double:


    ```

    addInterest(double rate)

    ```


    Sure, if you look at the call to addInterest (down in the ProcessNiceAccounts
    class''s main method), that call has the variable interestRate in it. and interestRate
    is type double. When you call addInterest, I''m giving the method value of type
    double.'
