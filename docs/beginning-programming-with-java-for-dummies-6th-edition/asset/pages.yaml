    # Running code


    A single project may contain several code files. When you''re ready to test your
    code, click the Run button, shown in Figure 2-5. That''s usually okay. But once
    in a while, you get some unexpected results. IntelliJ starts running one of your
    project''s files. How does IntelliJ decide which file to run?


    The safest way around this is to avoid clicking the Run button. Figure 2-10 shows
    parts of the main window for a project containing three code files. The files''
    names are MyData, MyFrame, and ShowFrame.


