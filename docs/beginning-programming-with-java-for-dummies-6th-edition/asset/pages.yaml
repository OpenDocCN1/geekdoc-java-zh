  md: 'In this section, each newly defined term describes an aspect of IntelliJ IDEA.
    So, before you read all this IntelliJ terminology, I provide the following disclaimers:


    +   **This section is optional reading.** Refer to this section if you have trouble
    understanding some of this book''s instructions. But if you have no trouble navigating
    IntelliJ, don''t complicate things by fussing over the terminology in this section.


    +   **This section provides explanations of terms, not formal definitions of terms.**
    My, my explanations are fairly precise, but no, they''re not airtight. Almost
    every description in this section has hidden exceptions, omissions, exemptions,
    and exclusions. The paragraphs in this section to be friendly reminders, not legal
    contracts.


    +   **This is a very useful tool.** But IntelliJ isn''t officially part of the
    Java ecosystem. I don''t describe details in this book, you can write Java programs
    without using IntelliJ.


    In this section, you get an overview of IntelliJ IDEA''s main window. I focus
    on the most useful features that you create Java programs, but keep in mind that
    IntelliJ IDEA has hundreds of features and many ways to access each feature.


    # Starting up


    Each Java program belongs to a project. You can have dozens of projects on your
    computer''s hard drive. When you run IntelliJ, each of your projects is either
    open or closed. An *open* project appears in a window (its own window) on your
    computer. A *closed* project doesn''t appear in a window.


    Several of your projects can be open at the same time. You can switch between
    projects by moving window to window.


    I often refer to an open project as IntelliJ IDEA''s *main window*. This term
    can be slightly misleading, with several projects open at a time, you have several
    windows "main" than the others. When I say *main window*, I''m referring to the
    window whose project you''re working on at that moment.


    ![](img/3bfd2290819a44830f5fb8cead595a57_76_0.png)


    If IntelliJ is running and there are no projects, IntelliJ displays its Welcome
    screen. (See Figure 3-17.) The Welcome screen may display some recently closed
    projects. If so, you can open a project by clicking its name on the Welcome screen.
    For an existing project that''s not on the Recent Projects list, you can click
    the Welcome screen''s Open button.'
