    # # How Long Does It Take to Learn Java?


    The answer depends on you — on your goals, on your existing knowledge, and on
    your

    capacity to think logically, on the amount of spare time you have, and on your

    interest in the subject.


    The more excited you are about computer programming, the quicker you learn.

    The more ambitious your goals, the longer it takes to achieve them.


    There''s no such thing as “knowing all about Java.” No matter how much you

    know, you have more to learn. I''ve written several Java books and, as far

    i I''m concerned, I''ve barely scratched the surface.


    ![](img/3bfd2290819a44830f5fb8cead595a57_526_0.png)


    # # Which of Barry’s Books Should I Read?


    Funny you do ask! I''ve written several books, including these three:


    +   - Beginning Programming with Java For Dummies

    - Java For Dummies

    - Java Programming for Android Developers For Dummies


    Each book starts from scratch, so you don''t need to know anything about app

    development to read any of these books. But each book covers (roughly) twice as

    material as the previous book in this. For example, Java For Dummies goes

    tice as fast and covers as much material as Beginning Programming with

    Java For Dummies. Which book you read depends on your level of comfort with

    technical subjects. If you''re in doubt about where to start, find some sample
    pages

    from any of these books to help you determine which book is best for you.'
