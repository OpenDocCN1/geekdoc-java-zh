  md: "# The case clauses in a switch statement don't have to be in order.\n\nHere's\
    \ some code:\n\n```\nswitch (randomNumber) {\n    case 2 -> out.println(\"What\
    \ part of 'no' don't you understand?\");\n    case 1 -> out.println(\"Yes. Isn't\
    \ it obvious?\");\n    case 3 -> out.println(\"Yesir, yesir! Three bags full.\"\
    );\n    // ...\n}\n```\n\nThis mixing of case clauses may slow you down when you're\
    \ trying to read and understand a program, but it's legal, nonetheless.\n\n# You\
    \ don't need a case for each expected value of the Selector. You can leave some\
    \ expected values to the default.\n\nHere's an example:\n\n```\nswitch (randomNumber)\
    \ {\n    case 1 -> out.println(\"Yes. Isn't it obvious?\");\n    case 4, 5 ->\
    \ out.println(\"No, and don't ask again.\");\n    case 10 -> out.println(\"No,\
    \ not until Nell squeezes Rover.\");\n    default -> out.println(\"Sorry, I just\
    \ can't decide.\");\n}\n```\n\n# The default clause is optional.\n\nIf you have\
    \ no default case and a value that's not covered by any of the cases comes up,\
    \ the switch statement does nothing. The computer marches on and executes whatever\
    \ comes immediately after the switch statement.\n\nWhat happens if you make one\
    \ tiny change to the code in Listing 17-1? The answer is that nothing happens.\
    \ The value of myRandom.nextInt(10) + 1 is always a number from 1 to 10. The program\
    \ runs correctly, and all's right with the world. So, why bother with a default\
    \ case in the first place? The computer will never execute the switch statement\
    \ default clause.\n\nNo, that's right. Real-life programming problems are quite\
    \ complicated. Determining that variables have the values you expect is never\
    \ simple. What if another programmer on your team changes the way randomNumber\
    \ gets its value? When you anticipate the things that can go wrong with your code,\
    \ you build a more secure line of defense. It's always best to guard against possible\
    \ problems — problems that you know can occur and problems that you will never\
    \ occur. Put a default clause in each of your switch statements.\n\nCHAPTER 17\
    \ How to Flick a Virtual Switch 407"
