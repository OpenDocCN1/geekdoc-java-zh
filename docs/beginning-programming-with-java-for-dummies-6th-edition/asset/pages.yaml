  md: 'This section deals with the normal, expected errors that you see when you compile
    and run a program for the first time. Everyone makes these mistakes, the most
    seasoned travelers. The key is keeping a cool head. Here''s my general advice:


    +   >> Don''t expect a program that you type to compile the first time.


    Prepared to return to your editor and fix some mistakes.


    +   >> Don''t expect a program that compiles flawlessly to run correctly.


    Even with no error markers in IntelliJ''s editor, your program might still contain
    flaws. After IntelliJ compiles your program, you still have to run it successfully,
    and that display the correct output.


    You compile, and then you run. Getting a program to compile without errors is
    the easier of the two tasks.


    +   >> Read what''s in the IntelliJ editor, not what you assume is the IntelliJ
    editor.


    Don''t assume that you''ve typed words correctly, you''ve capitalized words correctly,
    or you''ve matched curly braces or parentheses correctly. Compare the code you
    typed with any sample code that you have. Make sure that every detail is in order.


    +   >> Be patient.


    Every programming effort takes a long time to get right. If you don''t understand
    something right away, be persistent. Stick with it (or put it away for a while
    and come back to it). There''s nothing you can''t understand if you put in enough
    time.


    +   >> Don''t become frustrated.


    Don''t throw your pie crust. Frustration (not lack of knowledge) is your enemy.
    If you''re frustrated, you can''t accomplish anything.


    +   >> Don''t think you''re the only person who''s slow to understand.


    I''m slow, and I''m proud of it. (Becky, Chapter 6 will be two weeks late.)


    +   >> Don''t be timid.


    If your code isn''t working and you can''t figure out why it''s not working, ask
    someone. Post a message in an online forum. And don''t be afraid of anyone''s
    snide or sarcastic answer. (For a list of gestures you can make in response to
    people'' snoty answers, see Appendix 2).


    To ask me directly, send me an email message, tweet me, or post to me on Facebook.
    (Send email to BeginProg@allmycode.com, tweets to @allmycode, or posts to Facebook
    /allmycode)


    CHAPTER 5 Composing a Program 109'
