  md: '# # DON''T LOOK BACK!


    In my travels as a *For Dummies* author, readers sometimes ask me if they should
    avoid versions of Java beyond the ones I mention in my books. This book refers
    to Java 17, but when you read the book, IntelliJ IDEA offers to install Java 19.
    What to do?


    In general, the higher the version number, the better your Java experience. The
    people who manage Java''s versions maintain a strict policy of backward compatibility,
    so the code that you and I don''t break over time. An app that ran correctly with
    Java 1.0 is very likely to run under with Java 17, 18, 19, 20, and beyond.


    Backward compatibility is a wonderful thing. Professional programmers work with
    programs that are thousands (and even millions) of lines long. With backward compatibility,
    programmers avoid fishing through old programs to fix bugs caused by new releases.


    ![](img/3bfd2290819a44830f5fb8cead595a57_54_0.png)


    Over the years, Java''s numbering system has taken all of twists and turns. The
    name Java 1.8.0_241 means something to some people, but it''s of no concern to
    you as a novice programmer.


    # ## Everyone gets into the act


    Oracle has two versions of the Java JDK. One of them is called *Oracle JDK*; the
    other is called *OpenJDK*. The difference between the two is the licensing agreement.
    Where OpenJDK is free and open-source, Oracle JDK is mainly for commercial use.


    In addition, many other companies have their own versions of Java. For example,
    Amazon publishes an open-source JDK named *Corretto*. The Eclipse has a Java machine
    called *Open9*.


    The first time you run IntelliJ, you may be prompted to choose between OpenJDK,
    Amazon Corretto, Zulu, and other flavors of Java. Should you stress for more than
    a millisecond about this choice? No, you shouldn''t. The differences among these
    products are of concern to big companies running massive applications, but they
    don''t matter at all for the running of this book''s examples. Just install a
    copy of Java and then sit back and enjoy the ride.'
