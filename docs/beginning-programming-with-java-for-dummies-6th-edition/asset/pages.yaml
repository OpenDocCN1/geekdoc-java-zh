  md: '# Using a variable


    The code in Listing 6-1 makes use of a variable amount. A variable is a placeholder.
    You can stick a number like 5.95 into a variable. After you''ve placed a number
    in the variable, you can change your mind and put a different number, like 30.95,
    into the variable. (That''s what varies in a variable.) Of course, when you put
    a new number in a variable, the old number is no longer there. If you didn''t
    save the old value somewhere else, the old number is gone.


    Figure 6-2 gives a before-and-after picture of the code in Listing 6-1. When the
    computer executes amount = 5.95, the variable amount has the 5.95 in it. Then,
    after the amount = amount + 25.00 statement is executed, the variable amount suddenly
    becomes 30.95 in it. When you think about a variable, a picture in the computer''s
    memory where wires and transistors store 5.95, 30.95, or whatever. In Figure 6-2,
    imagine that each box is surrounded by millions of other boxes.


    | amount = 5.95; | amount = 5.95; |

    | amount = amount + 25.00; | amount = amount + 25.00; |

    | | |

    | amount | amount |

    | | 5.95 | 30.95 |


    FIGURE 6-2:

    A variable (before and after).

    amount = amount + 25.00;


    Now you need some terminology. (You can follow the thing stored in a variable
    is called a value. A variable''s value can change during the run of a program
    (when KnitSoft handles the shipping-and-handling cost, for example). The value
    stored in a variable isn''t necessarily a number. (You, for example, create a
    variable that always stores a letter.) The kind of value stored in a variable
    is a variable''s type. (You can read more about the rest of this chapter and in
    the next two chapters.)


