  md: '# # Put Some Swing in Your Step


    Java’s Swing classes create graphical objects on a computer screen. The objects
    can include buttons, icons, text fields, check boxes, and other good things that
    make windows so useful.


    # ## JAVA GUIs


    Java comes with three sets of classes for creating GUI applications:


    +   * The Abstract Window Toolkit (AWT): The original set of classes, dating back
    to JDK 1.0.


    Classes in this set belong to packages whose name begin with java.awt. Components
    in this set have names like Button, TextField, Frame, and so on.


    The AWT implements only the kinds of components that were available on all operating
    systems in the mid-1990s. So, using AWT, you can add a button to your application,
    but you can''t easily add a table or a tree.


    +   * Java Swing: A set of classes created to fix some of the difficulties posed
    by the use of the AWT. Swing was introduced in 1998 as part of Java 1.2 (also
    known as JSE 1.2).


    Classes in this set belong to packages whose name begin with java.swing. Components
    in this set have names like JButton, JTextField, and JFrame.


    In a Swing program, you can create table components, tree components, and many
    other kinds of components. Java’s Swing classes replace some (but not all) of
    the classes in the old AWT. To use some of the Swing classes, you have to call
    on the old AWT.


    +   * JavaFX: An alternative to Swing, announced in May 2007. JavaFX comes with
    (new) versions of Java 7 and with all later versions of Java.


    Classes in this set belong to packages whose name begin with javafx.


    JavaFX supports over 100 kinds of components. (Sure, you want a Button component?
    But do you also want an Accordion component? JavaFX has one.) In addition, JavaFX
    supports multitouch operations and takes advantage of processor’s specialized
    graphics capabilities. Unlike AWT and Swing, the Java platform isn’t included
    as part of the standard Java SDK. So, if you want to create a JavaFX application,
    you have to do some additional project steps.


    For more information about JavaFX, visit http://openjfx.io.'
