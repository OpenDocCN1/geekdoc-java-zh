  md: '# About the Author


    Barry Burd received an MS degree in Computer Science at Rutgers University and
    a PhD in Mathematics at the University of Illinois. As a teaching assistant in
    Champaign-Urbanana, Illinois, he was elected five times to the university-wide
    List of Teachers Ranked as Excellent by Their Students.


    Since 1980, Barry has been a professor in the Department of Mathematics and Computer
    Science at Drew University in Madison, New Jersey. He has spoken at conferences
    in the United States, Europe, Australia, and Asia. In 2020, he was named a Java
    Champion as part of a project sponsored by Oracle. He is the author of several
    articles and books, including Java For Dummies, Flutter For Dummies, and Java
    Programming For Android Developers For Dummies, all by Wiley Publishing.


    Barry lives in Madison, New Jersey, with his wife of n years, where n > 40. As
    an avid indoors enthusiast, Barry enjoys sleeping, talking, and eating. You can
    reach him at BeginProg@alleycode.com.


    # Dedication


    > For

    Abram and Katie, Benjamin and Jennie,

    Sam and Ruth, Harriet, and Jennie.'
