  md: '![](img/3bfd2290819a44830f5fb8cead595a57_77_0.png)


    FIGURE 3-17: Look familiar?


    If you have any open projects, IntelliJ doesn''t display the Welcome screen. In
    that case, you can open another project by choosing File:Open or File:Open again
    in an open project''s window. To close a project, you can choose File:Close Project,
    or do whatever you normally to close one of the windows on your computer. (On
    a PC, click the X in the window''s upper right corner. On a Mac, click the little
    red button in the window''s upper left corner.)


    IntelliJ IDEA remembers which projects were open from one run to the next. If
    you quit IntelliJ, these projects open again (with your main windows showing)
    the next time you launch IntelliJ. You can override this behavior (so that only
    the Welcome screen appears each time you launch IntelliJ) by Behavior:System Settings.
    With IntelliJ on a Mac, choose IntelliJ IDEA:Preferences: Appearance and Behavior:
    System Settings. In either case, uncheck the Reopen Projects on Startup box.


    # # The main window


    IntelliJ''s main window is divided into several areas. Some of these areas can
    appear and disappear on your command. What comes next is a description of the
    areas in Figure 3-18, moving from the top of the main window to the bottom.


    The areas you see on your computer may differ from the areas in Figure 3-18. Usually,
    that''s okay. You can make areas come and go by choosing certain menu options,
    including the View option on IntelliJ''s main menu bar. You can also click the
    little tool buttons on the edges of the main window.


