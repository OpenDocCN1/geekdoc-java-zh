    to 138 cents. With minor tweaking, you can make the code work in any country''s
    coinage. You can always get a set of coins adding up to a total. But, for the
    denominations of coins in some countries, you won''t always get the smallest number
    of coins that add up to a total. Before 1970, England''s currency included 6 pence,
    12 pence, 24 pence, and 30 pence. With input 48, a program like the one in Listing
