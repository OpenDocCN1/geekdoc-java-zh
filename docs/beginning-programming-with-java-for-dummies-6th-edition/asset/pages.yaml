  md: '# Handing off a value


    When you call a method, you can pass information to the method on the fly. This
    information is in the method''s parameter list. Listing 15-7 has a call to the
    addInterest method:


    ```

    anAccount.addInterest(interestRate);

    ```


    The first time through the loop, the value of interestRate is 2.0. (Remember,
    I''m using the data in Figure 15-5). At that point in the program''s run, the
    method behaves as though it''s the following statement:


    ```

    anAccount.addInterest(2.0);

    ```


    The computer is about to run the code inside the addInterest method (a method
    in Listing 15-6). But first, the computer passes the value 2.0 to the parameter
    in the addInterest method''s header. Inside the addInterest method, the value
    of rate becomes 2.0. For an illustration of this, see Figure 15-6.


