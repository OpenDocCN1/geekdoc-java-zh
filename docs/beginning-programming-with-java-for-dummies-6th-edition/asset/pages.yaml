  md: 'The components with indices 0 through 824 are being used, and the components
    with indices 825 through 999 are waiting quietly to be filled.


    One day, a brand-new customer shows up. Because your customers are stored in order
    (alphabetically by last name or numerically by Social Security number or whatever),
    you want to squeeze this customer into the correct component of your array. The
    trouble is that this customer belongs very early on the array, at the component
    with index 7. What happens then?


    You take the name in component number 824 and move it to component 825. Then you
    take the name in component 823 and move it to component 824. You keep doing this
    until you''ve moved the name in component 7. Then you put the new customer''s
    name into component 7. What a pain! Sure, the customer doesn''t comply. (If the
    computer has feelings, it probably likes this kind of busy work.) But as you move
    around all these names, you waste processing time, you waste power, and waste
    all of resources.


    > In my next life, I''ll leave three empty components between every names.\ And,
    of course, your business expands. Eventually, you find that three aren''t enough.


    # What to Do When Arrays Awry


    The issues raised in the previous section aren''t new. Computer scientists have
    been working on these issues for a long time. They haven''t discovered any one-size-fits-all
    solution, but they''ve discovered clever tricks.


    The Java API has a bunch of classes known as collection classes. Each collection
    has methods for storing bunches of values, and each collection class methods some
    clever tricks. For you, the bottom line is: Certain classes deal with as efficiently
    as possible with the issues raised in the previous section. If you have to deal
    with such issues when writing code, you can use these collections and call the
    class methods. Rather than fret about a customer whose name belongs in position
    7, you can just call a class''s add method. The method inserts the name at a position
    of your choice and deals reasonably with whatever ripple effects to take place.
    In the best circumstances, the insertion is very efficient. In the worst circumstances,
    you can rest assured that the code everything the best way it can.


    # Using an ArrayList


    One of the most versatile of Java''s collection classes is the ArrayList. Listing
    19-6 shows you how it works.'
