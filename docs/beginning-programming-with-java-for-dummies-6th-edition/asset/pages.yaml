- img_proc: true
  md: '> You need a way to issue commands. You need a way to say things like "compile
    this program" and "run the JVM." Every computer provides ways of issuing commands.
    (You can double-click icons or type verbose commands in a Run dialog box.) But
    when you rely on your computer''s facilities, you''re forced to jump from one
    window to another. You open one window to read Java documentation, another window
    to edit a Java program, and a third window to start up the Java compiler. The
    process can be tedious.


    # A tool for creating code


    In the best of all possible worlds, you do all your program editing, documentation
    reading, and command issuing through one nice interface. This interface is called
    an integrated development environment (IDE).


    A typical IDE divides your screen''s work area into several panes — one pane for
    editing programs, another pane for listing the names of programs, a third pane
    for issuing commands, other panes to help you compose and test programs. You can
    arrange the panes for quick access. Better yet, if you change the information
    in one pane, the IDE automatically updates the information in all the others.


    An IDE helps you move seamlessly from one part of the programming endeavor to
    another. With an IDE, you don''t have to worry about the mechanics of editing,
    compiling, and running a JVM. Instead, you can worry about the logic of writing
    programs. (Wouldn''t you know it? One way or another, you always have some worry
    about!)


    In the chapters that follow, I describe basic features of the IntelliJ IDEA IDE
    (known as "IntelliJ") by most Java professionals). IntelliJ has many bells and
    whistles, but you can ignore most of them and learn to repeat a few sequences
    of steps. After using IntelliJ a few times, your brain automatically performs
    the routines. From then on, you can stop worrying about IntelliJ and concentrate
    on Java programming.


    As you read my paragraphs about IntelliJ, remember that Java and IntelliJ aren''t
    wedded to one another. The programs in this book work with any IDE that can run
    Java. Instead of using IntelliJ, you can use Eclipse, NetBeans, Blue, or any other
    IDE. In fact, if you enjoy roughing it, you can write and run this book''s programs
    without an IDE. You can use Notepad, TextEdit, or vi, along with your operating
    system''s command prompt or Terminal. It is all up to you.'
