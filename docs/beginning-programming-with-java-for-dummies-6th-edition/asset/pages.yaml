    \n# Esprit de for\n\nA typical for statement looks like this:\n\n```\nfor (Initialization;\
    \ Condition; Update) {\n  Statements\n}\n```\n\nAfter the word for, you put three\
    \ things in parentheses: an initialization, a condition, and an update.\n\nEach\
    \ of the three items in parentheses plays its own, distinct role:\n\n+   >> Initialization:\
    \ The initialization is executed once, when the run of your program first reaches\
