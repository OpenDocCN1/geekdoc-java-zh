    # How the EchoLine program works


    When you are a tiny newborn, resting comfortably in your mother''s arms, she

    told you how to send characters to the computer screen:


    ```

    System.out.println(whatever text you want displayed);

    ```


    What didn''t tell you how to fetch characters from the computer keyboard.

    There are lots of ways to do it, but the one I recommend in this chapter is


    ```

    keyboard.nextLine();

    ```


    Now, here''s the fun part. Calling the nextLine method doesn''t just scoop char-

    ters the keyboard. When the computer runs your program, the computer

    substitutes whatever you type on the keyboard in place of the text keyboard.

    nextLine();


