    +   • With the same input, the call findWithHorizon("\d\d\d", 11) returns 123.
    It returns 123 because the first 11 characters of the input (characters Testing
    123) don''t contain three consecutive digits.


    +   • With the same input, the call findWithHorizon("\d\d\d", 12) returns 442.
    It returns 442 because, the first 12 characters of the input (characters A57B442123
    Test), the first consisting of three consecutive digits is the sequence 442.


    Wait! To grab a single character from the keyboard, call char(0). What is the
    role of charAt(0) in reading a single character? Unfortunately, any findWithHorizon
    behaves as if it''s finding a bunch of characters, just a single character. When
    you call findWithHorizon(".", 0) and the computer fetches one letter from the
    keyboard, the Java program treats that letter as one of possibly many characters.


    The call to charAt(0) takes care of the multicharacter problem. This charAt(0)
    calls Java to pick the initial character from any of the characters that findWithin
    fetches.


    Yes, it''s complicated. And yes, I don''t like having to explain it. But no, you
    don''t have to understand any of the details in this sidebar. Just read the details
    if you want to understand and skip the details if you don''t care.


    > **findWithHorizon(".", 0).charAt(0), you don''t type blank spaces between characters.**

    If I type po, then successive calls to findWithHorizon(".", 0). charAt(0) read
