    \ object\" to describe an instance of the Purchase class. The difference between\
    \ object and instance isn't terribly important. But it's important to remember\
    \ that the words object and instance have the same meaning. (Okay!) They have\
    \ nearly the same meaning.\n\n# Making reference to an object's parts\n\nIn the\
    \ Purchase code of Listing 13-2, I declare three variables: a unit variable, a\
