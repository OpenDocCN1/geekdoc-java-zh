    \ a semicolon at the end of the switch expression in Listing 17-2.\n\n# Can you\
    \ switch between two kinds of switch?\n\nJava's switch expression looks a lot\
    \ like Java's switch statement, but with a few differences:\n\n+   **In a switch\
    \ expression, each case clause must have a value.**\nFor example, the following\
