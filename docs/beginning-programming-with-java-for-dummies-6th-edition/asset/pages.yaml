  md: '# Dealing with a Mac''s security features


    If you have a Mac, you might encounter some speed bumps during your IntelliJ installation:


    +   The Safari browser may ask whether you want to allow downloads from www..jetbrains.com.

    If so, click Allow.


    +   You may see a troubling dialog box warning that you “IntelliJ IDEA is an app
    downloaded from the Internet” and asking, “Are you sure you want to open it?”

    If so, your answer should be “Yes. Open it.”


    +   Your Mac might be set up to install only App Store software.

    If you''ll see a message saying “IntelliJ IDEA CE can''t be opened because it
    was not downloaded from the App Store,” or something like that. Here''s how you
    deal with that problem:

    1. Choose Apple -> System Preferences & Privacy.

    2. In the Security & Privacy dialog box, select the General tab.

    3. Click the lock in the dialog box''s lower-left corner and confirm the unlocking
    by typing your account password.

    It''s the same password you use whenever you log on to the computer.

    In the Security & Privacy dialog box, a group of radio buttons begins with the
    prompt Allows Apps From Downloaded.

    4. Select the radio button labeled App Store and Identified Developers.

    Hooray! The company that makes IntelliJ IDEA is an identified developer.

    5. Close the Security & Privacy dialog box.


    # Using IntelliJ IDEA with finesse


    On a cold day one January, while I was rushing to the Milwaukee airport, my car
    turned off. I got out of the car, looked under the hood, and noticed some unattended
    cables. I had been taking an introductory auto mechanics course, so I didn''t
    have to wait for a repair service to arrive. I reattached the cables and was immediately
    on my way.


    What I had learned in the auto mechanics course had paid off! Sure, I knew how
    to drive a car. But, on that day in Milwaukee, getting to the airport required
    knowing a tiny bit more than the absolute minimum.'
