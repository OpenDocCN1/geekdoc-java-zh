    # # What''s All That Stuff in the IntelliJ IDEA?


    Believe it or not, an editor once rejected one of my book proposals. In the margins,
    the editor scribbled, "This is not a word" to things like can''t, it''s, and I''ve.
    To this day, I do not know what this editor did like contractions. My opinion
    is that language always needs to expand. Where would we be without new words —
    like crowdfunding, livestream, and cryptocurrency?


    Even the Oxford English Dictionary (the last word in any argument about words)
    grows by more than 4,000 entries each year. That''s an increase of more than 1
    percent per year. It''s about 11 new words per day!


    The fact is, human thought is like a big high-rise building: You can''t build
    the 50th floor you''ve built at least part of the 49th. You can''t talk about
    spam until you have a word like email. With all that goes on these days, you need
    verbal building blocks. That''s why this section contains a bunch of new terms.


    CHAPTER 3 Running Programs 61'
