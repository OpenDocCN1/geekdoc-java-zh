  md: '# GRABBING INPUT HERE AND THERE


    Listing 19-2 illustrates some pithy issues surrounding the input of data. For
    one thing, the program gets input from both the keyboard and a disk file. (The
    program gets a number room from the keyboard. Then the program gets the number
    of guests in room from the occupancy file.) To make this, Listing 19-2 uses two
    Scanner declarations: one declare the keyboard and a second diskScanner.


    Later in the program, the keyboard.nextInt reads from the keyboard, and diskScanner.nextInt
    reads from the file. Within the program, you can read from the keyboard or the
    disk as many times as you want. You can even intermingle the calls reading from
    the keyboard, and then three times from the disk, and then twice from the keyboard,
    and so on. All you have to do is remember using the keyboard whenever you read
    from the keyboard and use diskScanner whenever you read from the disk.


    Another interest tid in Listing 19-2 concerns the occupancy file. Many of this
    chapter''s examples read from an occupancy file, and I use the data in each of
    the examples (I use the data shown in Figure 19-1). To run an example, I copy
    the occupancy file from IntelliJ project to another. (Before running the code
    in Listing 19-2, right-click the occupancy file in IntelliJ''s Project tool window
    and choose Copy from the context menu. Then I right-click the topmost branch in
    the Project tool window for Listing 19-2. On the right context menu, I choose
    Paste.)


    In real life, having several copies of a data file can be dangerous. You can modify
    one copy and then accidentally read out-date data from a different copy. Sure,
    you should have backup copies, but you should have only one master copy—the copy
    from all programs get the same input.


    In a real-life program, you do not copy the occupancy file from one project to
    another. What do you do instead? You put an occupancy file in one place on your
    hard drive and then have each program refer to the file using the names of the
    file''s directories. For example, if your occupancy file is in the c:\Oct\22 directory,
    you write


    ```

    var diskScanner = new Scanner(new File("c:\Oct\22\occupancy"));

    ```


    The "Name that" sidebar in Chapter 16 has more details about filenames and double
    backslashes.'
