  md: "# Nested Development\n\nThe previous section describes an email system administrator’s\
    \ problem — creating a file filled with usernames from a file filled with email\
    \ addresses. The code in Listing 18-1 solves part of the problem — it extracts\
    \ just one email address. That’s a good start, but to get just one username, you\
    \ don’t need a computer program. A pencil and some paper do the trick.\n\nDon't\
    \ keep the email administrator waiting any longer. In this section, you develop\
    \ a program that processes dozens, hundreds, and even thousands of email addresses\
    \ from a file on your hard drive.\n\nFirst, you need a strategy to create the\
    \ program. Take the statements in Listing 18-1 and run them over and over again.\
    \ Better yet, have the statements themselves over and over again. Fortunately,\
    \ you already know how to do something over and over again: You use a loop. (See\
    \ Chapter 11 for the basics on loops.)\n\nHere’s the strategy: Take the statements\
    \ in Listing 18-1 and enclose them in a larger loop:\n\n```\nwhile (not at the\
    \ end of the email.txt file) {\n    Execute the statements in Listing 18-1\n}\n\
    ```\n\nLooking back at the code in Listing 18-1, you see that the statements in\
    \ that code have a while loop of their own. This strategy involves putting one\
    \ loop inside another loop:\n\n```\nwhile (not at the end of the email.txt file)\
    \ {\n  //blah-blah\n\n  while (symbol != '@') {\n    //blah-blah-blah\n  }\n\n\
    \  //Blah-blah-blah-blah\n}\n```\n\nBecause one loop is inside the other, they’re\
    \ called nested loops. The old loop (the symbol != '@' loop) is the inner loop.\
    \ The new loop (end-of-file loop) is called the outer loop.\n\nCHAPTER 18 Creating\
    \ Loops within 427"
  merge: -1
