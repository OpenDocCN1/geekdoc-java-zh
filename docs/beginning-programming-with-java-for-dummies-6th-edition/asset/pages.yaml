  md: '# A QUICK LOOK AT JAVA''S DISK ACCESS FACILITIES


    Templates like the ones in Listings 16-3 and 16-4 look very nice. But knowing
    how the templates work is even better. Here are a few tidbits describing the inner
    workings of Java''s disk access code:


    +   * A PrintStream is something you can use for writing output.


    A PrintStream is like a Scanner. The big difference is that a Scanner is for reading-input,
    and a PrintStream is for writing output. To see what I mean, look at Listing 16-2.
    Notice the similarity between the statements that use Scanner and the statements
    that use PrintStream.


    The word PrintStream is defined in the Java API.


    +   * In 16-2, the expression new File("rawData.txt") plays the same role as System.in
    in many other programs.


    Just as System.in. stands for the computer''s keyboard, the expression new File("rawData.txt")
    stands for a file on your computer''s hard drive. When the computer calls new
    File("rawData.txt"), the computer creates something like System—something you
    can stuff inside the new Scanner() parentheses.


    The word File is defined in the Java API.


    +   * A FileNotFoundException is something that can go wrong during an attempt
    to read input from a file (or an attempt to write output to a disk file).


    Disk access is loaded with pitfalls. Even the best programs run into disk access
    occasionally. To brace against such pitfalls, Java insists on adding some extra
    words to your code.


    In 16-2, the added words FileNotFoundException form a clause. A throws clause
    is a kind of disclaimer. Putting a throws clause in your code is like saying,
    "I realize that this code can run into trouble"


    Of course, in real, you have no choice about signing disclaimers. "If you don''t
    sign this disclaimer, the surgeon won''t operate on you." Okay then, I''ll sign
    it. The same is true with a Java throws clause. If you put things like new PrintStream("cookedData.txt")
    in your code and don''t add anything like throws FileNotFoundException, the java
    compiler refuses to compile your code.'
  merge: -1
  pgno: 400
- img_proc: true
  md: 'So, when you need this throws FileNotFoundException clause, and when should
    you do without it? Well, having certain things in your code — things like new
    PrintStream("cookedData.txt") — forces you to create a throws clause. You can
    spend some time learning all about the kinds of things that throws clauses. But
    at this point, it''s better to concentrate on other programming issues. Because
    you''re a beginner Java programmer, the safest thing to do is to follow the templates
    in Listings 16-3 and 16-4.


    The word FileNotFoundException is — you guessed it — defined in the Java API.


    +   * **To create this chapter''s code, I made the names diskScanner and diskWriter.**


    The diskScanner and diskWriter don''t come from the Java API. In place of diskScanner
    and diskWriter, you can use any names you want. All you have to use the names
    consistently within each of your programs.


    +   * **A call to the close method ends the connection between your program and
    the file.**


    In many of this book''s examples, you see the connection between your program
    and the computer keyboard by calling close(). The same is true when you call the
    close method for a disk scanner or a disk file''s'' instance. The close method
    reminds Java to finish all pending read or write operations and to break the program''s
    connection to the disk file or the keyboard or whatever else holds the data for
    program.


    This book''s examples are simple. If you omit a close method in one of these examples,
    you might get a warning message from IntelliJ, but the world doesn''t end. (That,
    is, your program runs correctly.) However, in a serious, make-it-or-break-it application,
    the proper placement of close calls is important. These close calls ensure the
    proper completion of the program''s input and output actions and help free disk
    resources for use by other running programs.


    # Running disk-oriented code


    Testing the code in Listing 16-2 is a three-step process. Here''s an outline of
    the three steps:


    +   1. **Create the rawData.txt file.**

    2. **Run the code in Listing 16-2.**

    3. **View the contents of the newly created cookedData.txt file.**


    The next few sections cover each step in detail.'
