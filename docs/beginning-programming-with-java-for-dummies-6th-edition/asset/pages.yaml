    # # Following the flow


    Suppose you''re running the code in Listing 15-3. The computer reaches the display
    method call:


    ```

    anAccount.display();

    ```


    At that point, the computer starts running the code inside the display method.
    In other words, the computer jumps to the middle of the Account class''s code
    (code in Listing 15-1).


    After executing the display method''s code (that forest of print and println calls),
    the computer returns to the point where it departed from Listing 15-3. That is,
    the computer goes back to the display method call and continues from there.


    When you run the code in Listing 15-3, the flow of action in each iteration isn''t
    exactly from the top to the bottom. Instead, the action goes for to the display
