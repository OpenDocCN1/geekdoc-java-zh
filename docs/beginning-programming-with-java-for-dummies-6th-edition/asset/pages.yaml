  md: '# Examining the method''s header


    Listing 15-1 contains the display method''s declaration. Like a main method''s
    declaration, the display declaration has a header and a body. (See Chapter 4.)
    The method has two words and some parentheses:


    +   The word void tells the computer that, when the display method is called,
    the display method doesn''t return anything to the place that it called.


    Later in this chapter, a method does return something. For now, the display method
    returns nothing.


    +   The word display is the method''s name.


    Every method must have a name. Otherwise, you don''t have a way to call the method.


    +   The parentheses contain all the things you''re going to pass to the method
    when you call it.


    When you call a method, you can pass information to that method on the fly. This
    display example, with its empty parentheses, looks strange. That''s because no
    information is passed to the display method when you call it. That''s okay, I
    give a better example later in this chapter.


    # Examining the method''s body


    The display method''s body contains some println calls. The interest-thing here
    is that the body makes reference to the lastName, id, and balance fields. A method''s
    body can do that. But with each object having its own lastName, id, and balance
    variables, what does a variable in the display method''s body mean?


    Well, when I use the Account class, I create little account objects. Maybe I create
    an object for each row of the table in Figure 15-1. Each object has its own lastName,
    id, and balance variables, and each object has its own copy of the display method.


    Take the first display method in Figure 15-1 — the method for Aju''s account.
    The display method for object behaves as though it had the code in Listing 15-2.'
