    In example in Chapter 7, Java''s remainder operator (%) gives you the answer 0.1299999999999999
    instead of 0.13 that you expect. The same strange kind of things happens in this
    section''s example. But this section doesn''t use an exotic remainder operator.
    This section''s code uses your old division, multiplication, and addition.


    Be careful when you compare two numbers for equality (==) or for inequality (!).
    Little inaccuracies can creep almost anywhere when you work with Java''s double
    type or Java''s float type. Several little inaccuracies can build on one another
    to become very large inaccuracies. When you compare double values or two float
    values, the values are almost never dead-equal to one another.


    If your program isnt doing what you think it should do, check your suspicions
    about the values of variables. Add print and println statements to your code.


    When you compare double values, give yourself some leeway. Instead of comparing
    for exact accuracy, ask whether a particular value is reasonably close to the
    expected value. For example, use a condition like fahrenheit >= 69.8 - 0.01 &&
    fahrenheit <= 69.8 + 0.01 to find out fahrenheit is within 0.01 of the value 69.8.
    To read more about conditions containing Java''s && operator, see Chapter 10.'
