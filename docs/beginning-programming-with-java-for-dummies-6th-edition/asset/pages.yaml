  md: '(continued)


    knowing what to type is no big deal. For example, when you start running the code
    in Listing 5-1, you have this book in front of you, and the book says “The computer
    is waiting for you to type something. You type one line of text.” and press Enter.
    Everything is fine.


    But few programs come with their own books. In many instances, when a program
    starts running, the user has to stare at the screen to figure out what to do next.
    In Listing 6-2 in this start-at-the-screen scenario. In Listing 6-2, the first
    call to print puts an informative message (What’s the price of a flash drive?)
    on the user’s screen. A message of this kind is called a prompt.


    When you start writing programs, you can easily confuse the rules of the prompt
    and the user’s input. Remember: No predefined relationship exists between a prompt
    and the subsequent input. To create a prompt, you call print or println. Then,
    to read the user’s input, you call nextLine, nextDouble, or one of the Scanner:class’s
    other nextSomething methods. These print and next calls in two separate states.
    Java has no commonly used, single statement that does both the prompting and the
    “next—ing.”


    As the programmer, your job is to combine the prompting and the next-ing. You
    can combine prompting and next-ing in all kinds of ways. Some ways are helpful
    to the user, and some ways aren’t, as described in this list:


    +   * If you don’t have a call to print or println, the user sees no prompt. A
    blinking cursor sits quietly and waits for the user to type something. The user
    guesses that’s okay, but usually it isn’t.

    * If you call print or println but you don’t call a keyboard, the computer doesn’t
    wait for the user to type anything. The program races to execute whatever comes
    immediately after the print or println.

    * If your prompt displays a misleading message, you misled the user. Java has
    no built-in feature that checks the appropriateness of a prompt. That’s not surprising.
    Most computer languages have no prompt-checking feature.


    Be careful with your prompts. Be nice to your user. Remember that you were once
    a humble computer user, too.


