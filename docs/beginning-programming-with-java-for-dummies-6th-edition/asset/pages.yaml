    # WRITE ONCE, RUN ANYWHERE


    When Java first hit the tech scene in 1995, the language became popular almost
    immediately. This happened in part because of the JVM. The JVM is like a foreign
    language interpreter, turning Java bytecode into whatever native language a particular
    computer understands. So, if you hand your Windows computer a Java bytecode file,
    the computer''s JVM interprets the file for the environment. If you hand the same
    Java bytecode file to my colleague''s Macintosh, the Macintosh JVM interprets
    that same code for the Mac environment.


    Look again at Figure 1-5. Without a virtual machine, you need a different kind
    of code for each operating system. But with the JVM, you just one piece of bytecode
    works on Windows machines, Unix boxes, Macs, or whatever. In the computing programming
    world, portability is a precious commodity. Think about all the people using computers
    to browse the Internet. These people don''t run Microsoft Windows, but each person''s
    computer can have its own bytecode interpreter — its own JVM.


    The marketing folks at Oracle call it the *Write Once, Run Anywhere* model of
    computing. I call it a great way to create software.'
