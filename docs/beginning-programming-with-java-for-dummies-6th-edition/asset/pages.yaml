  md: '# Getting numbers, words, and other things


    In Listing 5-1, the words `keyboard.nextLine()` get an entire line of text from
    the computer keyboard. If you type


    ```

    Testing 1 2 3

    ```


    the program in Listing 5-1 echoes the entire `Testing 1 2 3` line of text.


    Sometimes you don''t want a program to get an entire line of text. Instead, you
    want the program to get a piece of a line. For example, when you want `1 2 3`,
    you may want the computer to get the number 1 for one customer or something like
    that.). In such situations, you don''t put `keyboard.nextLine()` in your program.
    Instead, you use `keyboard.nextInt()`


    Table 5-1 shows a few variations on the `keyboard.next...`. Unfortunately, the
    entries aren''t very predictable. To read a line of input, you can call `next()`.
    But to read a word of input, you don''t call `nextword`. (The Java API has no
    `nextword` method.). Instead, to read a word, you call next.


    # TABLE 5-1: Some Scanner Methods


    | To Read This | Make This Method Call |

    | A number with no decimal point in it | nextInt() |

    | A number with a decimal point in it | nextDouble() |

    | A word (ending in a blank space, for example) | next() |

    | A line (or what remains of a line after you''ve already read some data from
    the line) | nextLine() |

    | A single character (such as a letter, digit, or punctuation character) | findWithinHorizon(".",0).charAt(0)
    |


    Also, the table''s story has a surprising ending. To read a single character,
    you don''t call `nextSomething`. Instead, you can call the bizarre `findWithinHorizon(".",0).charAt(0)`
    combination of methods. (You''ll have to excuse the folks who created the Scanner
    class. They created Scanner from a specialized point of view.)


    To see more of methods, check other programs in this book. Chapters 6, 7, and
    8 have some particularly nice examples.'
