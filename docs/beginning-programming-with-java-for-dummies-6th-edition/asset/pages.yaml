  md: 'In creating an array, you always specify the number of components. The array''s
    indices always start with 0 and end with the number''s one fewer than the total
    number of components. For example, if your array has ten components (and you declare
    the array with new int[10]), the array''s indices goes from 0 to 9.


    When you create an array variable, you can put square brackets after either the
    type name or the variable name. In other words, you can write


    ```

    int[] guests;

    ```


    as I do in this section, and you can write


    ```

    int guests[];

    ```


    as some programmers do. Either way, you''re defining exactly the array variable.
    In the same way, you see


    ```

    public static void main(String[] args) args

    ```


    and you also see


    ```

    public static void main(String[] args);

    ```


    These two method headers have precisely the same meaning.


    # Storing values in an array


    After you''ve created an array, you can put values into the array''s components.
    For example, the guests in Room 6 are fed up with all those mint candies that
    you put on beds. So they check out and Room 6 becomes vacant. You should put the
    value Ø into the 6 component. You can do it with this assignment statement:


    ```

    guests[6] = 0;

    ```


