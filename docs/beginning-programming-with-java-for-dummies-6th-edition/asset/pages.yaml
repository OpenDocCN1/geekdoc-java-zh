  md: '# IN THIS CHAPTER

    >> Finding out more about classes

    >> Discovering other helpful classes


    # Chapter 21

    Ten Useful Classes in the Java API


    > ''m proud of myself. I''ve written around 400 pages in this book about Java
    using fewer than 30 classes from the Java API. The standard API has thousands
    of classes, so I think I''m doing very well.


    Anyway, to help acquaint you with some of my favorite Java classes, this chapter
    contains a brief list. Some of the classes in this list appear in examples throughout
    this book. Others are so darn that I can''t finish the book without including
    them.


    For more information on the classes in this chapter, check Java''s online API
    documentation at https://docs.oracle.com/en/java/javase/17/docs/api.


    # ArrayList


    How often do you deal with many things at once? You have many customers, many
    contacts, many bills to pay, many social media posts — many, many, many! Each
    Java collection has its own, special characteristics. A Queue ignores older things
    in favor of more recent things. A wait to take their turn. A Set has no ordering.
    A Map connects names with their values.


    CHAPTER 21 Ten Useful Classes in the Java API 505'
  merge: -1
  pgno: 519
- img_proc: true
  md: 'My go-to collection class is the ArrayList. An ArrayList is like an array,
    except that ArrayList objects grow and shrink as needed. You can also insert new
    values without using the ArrayList class''s add method. ArrayList objects are
    useful-because they do all kind of nice things that arrays can''t.


    To get started with the ArrayList class, refer to Chapter 19.


    # # File


    Talk about your useful Java classes! The File class does a bunch of things that
    aren''t included in this book''s examples. Method canRead tells you whether you
    can read from a file. Method canWrite tells you whether you can write to a file.
    Calling method setReadOnly ensures that you can''t accidentally write to a file.
    Method deleteExit crashes a file, but not until your program stops running. Method
    exists checks whether you have a particular file. Methods is, lastModified and
    length give you more information about a file. You can create a new directory
    by calling the mkdir method. This File class is powerful!


    Want to read about the File class? Refer to Chapters 12 and 16.


    # # Integer


    Chapter 14 describes the Integer class and its parseInt method. The Integer class
    has lots of other features that come in handy when you work with int values. For
    example, Integer.MAX_VALUE stands for the number 2147483647. That''s the largest
    value that an int can store. (Refer to Chapter 7.) The expression Integer.MIN_VALUE
    stands for the number -2147483648 (the smallest value that an int variable can
    store). A call to Integer.toBinaryString takes an int and returns its base 2 (binary)
    representation. And what Integer.toBinaryString does for base 2, Integer.toHexString
    for base 16 (hexadecimal).


    # # JFrame


    Chapter 20 has a JFrame example. A JFrame can be the starting point for an app''s
    appearance on the screen. A JFrame is like a window, so you can put buttons, fields,
    and other widgets on a JFrame. In Chapter 20, I put an image on a JFrame.


    PART 6 The Part of Tens'
