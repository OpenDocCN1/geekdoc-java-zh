  \n### 6.3 使用位运算符交换两个数字\n\n使用位异或 运算符交换两个数字的 Java 程序。此 Java 程序使用位异或 运算符交换两个数字。在查看程序之前，让我们看看什么是位异异或运算符：位异或比较两个操作数的对应二进制位，如果它们相等则返回\
  \ 1，如果不相等则返回 0。例如：\n\n`num1 = 11 ;` /* 等于 00001011*/ \n`num2 = 22 ;` /* 等于 00010110\
  \ */ \n`num1 ^ num2` 比较 `num1` 和 `num2` 的对应位，如果它们不等则生成 1，否则返回 0。在我们的示例中，它将返回 29，等于\
  \ 00011101。让我们在 Java 程序中写下它：\n\n示例：\n```java\nimport java.util.Scanner ;\npublic\
  \ class JavaExample{\n    public static void main(String args[]){\n        int num1,\
  \ num2;\n        Scanner scanner = new Scanner (System .in );\n        System.out.print\
  \ (\"Enter first number:\" );\n        num1 = scanner.nextInt();\n        System.out.print\
  \ (\"Enter second number:\" );\n        num2 = scanner.nextInt();\n        /* 为了让你理解，假设我正\n\
  \         * 输入第一个数字的值为 10，第二个\n         * 为 5。10 的二进制等效值是 1010，5 是\n         * 0101\
  \ */\n        //num1 变为 1111 = 15\n        num1 = num1 ^ num2;\n        //num2 变为\
  \ 1010 = 10\n        num2 = num1 ^ num2;\n        //num1 变为 0101 = 5\n        num1\
  \ = num1 ^ num2;\n        scanner.close();\n        System.out.println(\"The First\
  \ number after swapping:\"+num1);\n        System.out.println(\"The Second number\
  \ after swapping:\"+num2);\n    }\n}\n```\n输出：输入第一个数字：10\n输入第二个数字：5\n交换后的第一个数字：5\n\
  交换后的第二个数字：10\n\n### 6.4 使用三元运算符找到三个数中的最大\n\n使用三元运算符找到三个数中最大的 Java 程序。此程序使用三元运算符找到三个数中的最大。在查看程序之前，让我们理解什么是三元运算符：三元运算符求值布尔表达式并根据结果赋值。\n\
  \n`variable num = (expression) ? value if true : value if false`\n如果表达式结果为真，则将冒号（`:`）之前的第一个赋值赋值变量\
  \ `num`，否则将第二个值赋值给 `num`。\n\n示例：使用三元运算符查找最大数的程序。在此程序中，我们使用了两次三元运算符来比较三个数，然而，你可以使用三元运算符在一个语句中比较所有三个数，如下：\n\
  `result = num3 > (num1>num2 ? num1:num2) ? num3:((num1>num2) ? num1:num2);`\n\n\
  但是，如果你觉得难以理解，请像我在下面的示例所示那样使用它：\n\n```java\nimport java.util.Scanner ;\npublic class\
  \ JavaExample{\n    public static void main(String [] args){\n        int num1,\
  \ num2, num3, result, temp;\n        /* Scanner 用于获取用户输入.*\n         * scanner 的\
  \ nextInt() 方法读取\n         * 用户输入的整数.*/\n        Scanner scanner = new Scanner (System\
  \ .in );\n        System.out.println(\"Enter First Number:\" );\n        num1 =\
  \ scanner.nextInt();\n        System.out.println(\"Enter Second Number:\" );\n \
  \       num2 = scanner.nextInt();\n        System.out.println(\"Enter Third Number:\"\
  \ );\n        num3 = scanner.nextInt();\n        scanner.close();\n        /* 在第一步中我们只比较\
  \ num1 和\n         * num2，并将最大的数存储在\n         * temp 变量中，然后比较 temp 和\n         *\
  \ num3 以得到最终结果.*/\n        temp = num1>num2 ? num1:num2;\n        result = num3>temp\
  \ ? num3:temp;\n        System.out.println(\"Largest Number is:\"+result);\n   \
  \ }\n}\n```\n输出：输入第一个数字：89\n输入第二个数字：109\n输入第三个数字：8\n最大数字是：109\n\n# 6.5 检查闰年的 Java\
  \ 程序\n\n检查闰年的 Java 程序。我们将编写一个 Java 程序来检查年份是否为闰年。在查看程序之前，让我们看看如何确定一个年份是否为闰年：\n\n\
  1. 如果年份能被 4 整除，转到第 2 步。\n2. 如果年份能被 100 整除，转到第 3 步。\n3. 如果年份能被 400 整除，转到第 4 步。\n\
  4. 该年份是闰年（有 366 天）。\n5. 该年份不是闰年（有 365 天）。\n\n示例：检查年份是否为闰年的程序。我们使用 `Scanner` 类获取用户输入，然后使用\
  \ `if-else` 语句编写逻辑。要理解这个程序，你应该具备 Java 基础知识：\n\n```java\nimport java.util.Scanner\
  \ ;\npublic class Demo {\n    public static void main(String [] args) {\n      \
  \  int year;\n        Scanner scan = new Scanner (System .in );\n        System.out.println(\"\
  Enter any Year:\" );\n        year = scan.nextInt();\n        scan.close();\n  \
  \      boolean isLeap = false;\n        if (year % 4 == 0) {\n            if (year\
  \ % 100 == 0) {\n                if (year % 400 == 0) {\n                    isLeap\
  \ = true;\n                } else {\n                    isLeap = false;\n     \
  \           }\n            } else {\n                isLeap = true;\n          \
  \  }\n        } else {\n            isLeap = false;\n        }\n        if (isLeap\
  \ == true ) {\n            System.out.println(year + \" is a Leap Year.\" );\n \
  \       } else {\n            System.out.println(year + \" is not Leap Year.\" );\n\
  \        }\n    }\n}\n```\n输出：输入任意年份：2001\n2001 不是闰年\n\n### 6.6 反转数字\n\n使用 `for`、`while`\
  \ 和递归反转数字的 Java 程序。Java 有三种方法反转数字：\n1. 使用 `while` 循环\n2. 使用 `for` 循环\n3. 使用递归\n\
  4. 无需交互反转数字\n\n### 程序 1：使用 while 循环反转数字\n\n程序提示用户输入数字，然后使用 `while` 循环反转相同的数字。\n\n\
  ```java\nimport java.util.Scanner ;\nclass ReverseNumberWhile{\n    public static\
  \ void main(String args[]){\n        int num = 0;\n        int reverse = 0;\n  \
  \      System.out.println(\"Input your number and enter: \");\n        // 输入存储在\
  \ number 中\n        Scanner in = new Scanner (System .in );\n        num = in.nextInt();\n\
  \        // While 循环：找到反转的逻辑\n        while (num != 0 ) {\n            reverse =\
  \ reverse * 10;\n            reverse = reverse + num % 10;\n            num = num\
  \ / 10;\n        }\n        System.out.println(\"Reverse of input is: \" + reverse);\n\
  \    }\n}\n```\n输出：输入数字：45689\n数字的反转为：98654\n\n### 程序 2：使用 for 循环反转数字\n\n```java\n\
  import java.util.Scanner ;\nclass ForLoopDemo{\n    public static void main(String\
  \ args[]){\n        int num = 0;\n        int reverse = 0;\n        System.out.println(\"\
  Input your number and enter: \" );\n        // 此语句获取用户输入\n        Scanner in = new\
  \ Scanner (System .in );\n        // 输入存储在 number 中\n        num = in.nextInt();\n\
  \        // for 循环：初始化部分 num 已经初始化\n        // 递增/递减部分 num/10 减少了 num 的值\n     \
  \   for ( ; num != 0 ; ) {\n            reverse = reverse * 10;\n            reverse\
  \ = reverse + num % 10;\n            num = num / 10;\n        }\n        System.out.println(\"\
  Reverse of specified number is: \" + reverse);\n    }\n}\n```\n输出：输入数字：56789\n数字的反转为：19875\n\
  \n### 程序 3：使用递归反转\n\n```java\nimport java.util.Scanner ;\nclass RecursionDemo{\n\
  \    // 反转的方法\n    public static void reverseMethod(int number) {\n        if (number\
  \ < 10 ) {\n            System.out.println(number);\n            return ;\n    \
  \    } else {\n            System.out.print(number % 10 );\n            // 方法调用自己：递归\n\
  \            reverseMethod(number / 10 );\n        }\n    }\n    public static void\
  \ main(String args[]){\n        int num = 0;\n        System.out.println(\"Input\
  \ your number and enter: \" );\n        Scanner in = new Scanner (System .in );\n\
  \        num = in.nextInt();\n        System.out.print(\"Reverse of the input is:\"\
  \ );\n        reverseMethod(num);\n        System.out.println();\n    }\n}\n```\n\
  输出：输入数字：5678901\n数字的反转为：198765\n\n#### 示例：反转已初始化的数字\n\n```java\nclass ReverseNumberDemo{\n\
  \    public static void main(String args[]){\n        int num = 123456789 ;\n  \
  \      int reverse = 0;\n        while (num != 0 ) {\n            reverse = reverse\
  \ * 10;\n            reverse = reverse + num % 10;\n            num = num / 10;\n\
  \        }\n        System.out.println(\"Reverse of specified number is: \" + reverse);\n\
  \    }\n}\n```\n输出：指定数字的反转为：987654321\n\n### 6.7 计算圆面积的程序\n\n计算圆面积和周长的 Java 程序。有两种方法：\n\
  1. 与用户交互：程序提示用户输入圆的半径。\n2. 无交互：半径值在程序中指定。\n\n### 程序 1：与用户交互\n\n```java\nimport java.util.Scanner\
  \ ;\nclass CircleDemo{\n    static Scanner sc = new Scanner (System .in );\n   \
  \ public static void main(String args[]){\n        System.out.print(\"Enter the\
  \ radius: \");\n        // 我们将输入的半径存储在 double 中，因为用户可以输入小数\n        double radius\
  \ = sc.nextDouble();\n        // 面积 = PI*radius*radius\n        double area = Math.PI\
  \ * (radius * radius);\n        System.out.println(\"The area of circle is: \" +\
  \ area);\n        // 周长 = 2*PI*radius\n        double circumference = Math.PI *\
  \ 2 * radius;\n        System.out.println(\"The circumference of circle is:\" +\
