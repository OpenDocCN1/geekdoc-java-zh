  \n\n\n- `start` 方法创建运行线程所需的系统资源，调度线程运行，并调用线程的 `run` 方法。\n- 当发生以下事件之一时，线程会变为“不可运行”（Not\
  \ Runnable）状态：\n    1. 调用了 `sleep` 方法。\n    2. 线程调用了 `wait` 方法。\n    3. 线程在 I/O\
  \ 操作上阻塞。\n- 当 `run` 方法退出时，线程自然死亡。\n\n下方的图清晰地描绘了 Java 中线程生命周期的各个阶段。![java 线程生命周期](img/image11193.jpg)\n\
  \n## 2. 线程调度\n\n- 在单个 CPU 上按某种顺序执行多个线程被称为调度。\n- 通常情况下，优先级最高的可运行（runnable）线程处于活跃状态（运行）。\n\
  - Java 采用优先级抢占机制：\n    1. 如果一个高优先级线程唤醒，而此时一个低优先级线程正在运行。\n    2. 那么高优先级线程将立即运行。\n\
  - 允许按需处理。\n- 高效利用 CPU。\n\n### 调度类型\n\n### 等待与通知\n- `Waiting` [`wait()`] 和 `notifying`\
  \ [`notify()`, `notifyAll()`] 为在同一对象上同步的线程提供了通信手段。\n- `wait()`：当在对象上调用 `wait()`\
  \ 方法时，执行该代码的线程会立即放弃对该对象的锁，并将线程移动到等待状态（wait）。\n- `notify()`：唤醒在同一对象上调用过 `wait()`\
  \ 的线程，并将它们移动到就绪状态（ready）。\n- `notifyAll()`：唤醒所有在同一对象上调用过 `wait()` 的线程。\n\n### 运行与让出\n\
  - `Yield()` 用于给相同优先级的其他线程执行的机会，即导致当前运行的线程移动到可运行（runnable）状态。\n\n### 休眠与唤醒\n- `sleep()`\
  \ 用于暂停线程指定一段时间，即将当前运行的线程移动到睡眠（Sleep）状态，持续指定的时间后再回到可运行状态。`Thread.sleep(no. of milliseconds);`\n\
  \n### 线程优先级\n- 当创建一个 Java 线程时，它会继承创建它的线程的优先级。\n- 你可以在线程创建后的任何时间使用 `setPriority`\
  \ 方法修改线程的优先级。\n- 线程优先级是介于 `MIN_PRIORITY` (1) 到 `MAX_PRIORITY` (10) 之间的整数。整数越高，优先级越高。通常线程优先级为\
  \ 5。\n\n### isAlive() 和 join() 方法\n- `isAlive()` 方法用于判断线程是否仍然存。它是判断一个线程已启动但尚未完成其\
  \ `run()` 方法的最佳方法。\n```java\nfinal boolean isAlive();\n```\n- `Thread` 类的非静态 `join()`\
  \ 方法允许一个线程“连接到另一个线程的末尾”。该方法会一直等待直到调用它的线程终止。\n```java\nfinal void join();\n```\n\n\
  ### 阻塞线程\n- 从流中读取数据时，如果输入不可用，线程将阻塞。\n- 线程会被挂起（阻塞），直到 I/O 可用。\n- 允许其他线程自动激活。\n- 当\
  \ I/O 可用时，线程再次唤醒：\n    1. 变为“可运行”（runnable），即进入就绪状态。\n\n### 线程分组\n- 线程组（Thread groups）提供了一种机制，可以将多个线程收集到一个单一对象中并一次性地操作这些线程，而不是逐个操作。\n\
  - 要将新线程放入线程组，必须在创建线程时显式指定该组：\n    - `public Thread(ThreadGroup group, Runnable runnable)`\n\
  \    - `public Thread(ThreadGroup group, String name)`\n    - `public Thread(ThreadGroup\
  \ group, Runnable runnable, String name)`\n- 线程创建后无法移动到新组。\n- 当 Java 首次启动时，Java\
  \ 运行时系统会创建一个名为 `main` 的 `ThreadGroup`。\n- Java 线程组由 `java.lang.ThreadGroup` 类实现。\n\
  \n\n\n\n\n# 多任务 vs 多线程 vs 多进程 vs 并行处理\n\n如果你是 Java 初学者，可能会对这些术语感到困惑，因为在我们讨论多线程时，这些术语被频繁使用。让我们简要讨论一下。\n\
  \n- **多任务 (Multitasking)**：同时执行多个任务的能力被称为多任务处理。\n- **多线程 (Multithreading)**：我们已经讨论过它。它是同时执行多个线程的过程。多线程也被称为基于线程的多任务。\n\
  - **多进程 (Multiprocessing)**：与多任务相同，但在多进程中涉及多个 `CPUs`。相比之下，多任务只涉及一个 `CPU`。\n- **并行处理\
  \ (Parallel Processing)**：指的是在单个计算机系统中对多个 `CPUs` 的利用。\n\n### 在 Java 中创建线程\n\n在 Java\
  \ 中创建线程有两种方法：\n1. 通过扩展 `Thread` 类。\n2. 通过实现 `Runnable` 接口。\n\n在开始编写线程的程序（代码）之前，让我们先来看看\
  \ `Thread` 类的这些方法。我们在下面的示例中使用了其中几个方法。\n\n- `getName()`：用于获取线程名称。\n- `getPriority()`：获取线程的优先级。\n\
  - `isAlive()`：确定线程是否仍在运行。\n- `join()`：等待线程终止。\n- `run()`：线程的入口点。\n- `sleep()`：挂起线程一段时间。\n\
  - `start()`：通过调用其 `run()` 方法启动线程。\n\n## 方法 1：通过扩展 Thread 类创建线程\n\n### 示例 1：\n```java\n\
  class MultithreadingDemo extends Thread {\n  public void run(){\n  System .out .println(\"\
  My thread is in running state.\" );\n  }\n  public static void main(String args[]){\n\
  \  MultithreadingDemo obj=new MultithreadingDemo ();\n  obj.start();\n  }\n}\n```\n\
  **输出：**\nMy thread is in running state.\n\n### 示例 2：\n```java\nclass Count extends\
  \ Thread{\nCount (){\n    super (\"my extending thread\" );\n    System .out .println(\"\
  my thread created\" + this );\n    start();\n}\npublic void run(){\n    try{\n \
  \       for (int i=0 ;i<10 ;i++){\n            System .out .println(\"Printing the\
  \ count \" + i);\n            Thread .sleep(1000 );\n        }\n    }catch (InterruptedException\
  \ e){\n        System .out .println(\"my thread interrupted\" );\n    }\n    System\
  \ .out .println(\"My thread run is over\" );\n}\n}\nclass ExtendingExample{\n  \
  \  public static void main(String args[]){\n        Count cnt = new Count ();\n\
  \        try{\n            while (cnt.isAlive()){\n                System .out .println(\
  \ \"Main thread will be alive till the child thread is live\" );\n             \
  \   Thread .sleep( 1500 );\n            }\n        }catch (InterruptedException\
  \ e){\n            System .out .println(\"Main thread interrupted\" );\n       \
  \ }\n        System .out .println(\"Main thread's run is over\" );\n    }\n}\n```\n\
