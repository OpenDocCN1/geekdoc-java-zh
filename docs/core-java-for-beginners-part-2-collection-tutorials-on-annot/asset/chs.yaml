  \ 的更多信息：\n`public static Comparator reverseOrder()` 返回一个比较器，该比较器对实现 `Comparable`\
  \ 接口的对象集合施加自然顺序的反向排序。（自然顺序是由对象自身的 `compareTo` 方法施加的顺序。）这使得对实现 `Comparable` 接口的对象的集合（或数组）以反自然顺序进行排序（或维护）提供了一种简单的写法。例如，假设\
  \ `a` 是字符串数组。那么：`Arrays.sort(a, Collections.reverseOrder());` 将按反字典顺序（字母顺序）对数组进行排序。返回的比较器是可序列化的。\n\
  返回：一个比较器，对实现 `Comparable` 接口的对象集合施加自然顺序的反向排序。\n\n### 4) 从 TreeMap 获取子 Map 的示例 –\
