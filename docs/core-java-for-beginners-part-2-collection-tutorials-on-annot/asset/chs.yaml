  语法：\n`public static String format(Locale l,String format,Object ... args)`\n使用指定的\
  \ locale、格式字符串和参数返回格式化字符串。\n`public static String format(String format,Object ...\
  \ args)`\n使用指定的格式和参数返回格式化字符串。\n\n**Java format() 方法的简单示例**\n```java\nclass Example\
  \ {\n  public static void main(String args[]){\n    String str = \"just a string\"\
  \ ;\n    //使用 format 拼接字符串\n    String formatted = String.format(\"My String is\
