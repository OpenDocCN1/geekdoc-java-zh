  ```\n输出：\n`Element1`\n`Element2`\n`Element3`\n`Element4`\n\n### 6) HashSet 对比 HashMap\n\
  在本文中，我们将讨论 `HashSet` 类和 `HashMap` 类之间的区别。\n\n| HASHSET | HASHMAP |\n| :--- | :---\
  \ |\n| `HashSet` 类实现了 `Set` 接口 | `HashMap` 类实现了 `Map` 接口 |\n| 在 `HashSet` 中，我们存储对象（元素或值），例如，如果我们有一个字符串元素的\
  \ `HashSet`，那么它可以描述一组 `HashSet` 元素：{“Hello”, “Hi”, “Bye”, “Run”} | `HashMap` 用于存储键值对。简而言之，它维护了键与值的映射（`HashMap`\
  \ 类大致等于 `Hashtable`，区别在于是非同步的并且允许 `null`）。如果它有整数键和字符串类型的值，你可以这样表示 `HashMap` 元素：例如：{1->“Hello”,\
  \ 2->“Hi”, 3->“Bye”, 4->“Run”} |\n| `HashSet` 不允许重复元素，这意味着你不能在 `HashSet` 中存储重复的值。\
  \ | `HashMap` 不允许重复的键，但它允许有重复的值。 |\n\n\n\n\n\n| `HashSet` 允许存在单个 null 值 | `HashMap`\
  \ 允许单个 null key 和任意数量的 null 值。 |\n\n#### 相似点\n1) `HashMap` 和 `HashSet` 都是非同步的，这意味着除非显式地同步，否则它们不适用于线程安全的操作单元。以下是你可以显式地对它们进行同步的方法：\n\
  \   - `HashSet`: `Set s = Collections.synchronizedSet(new HashSet (...));`\n   -\
  \ `HashMap`: `Map m = Collections.synchronizedMap(new HashMap (...));`\n2) 这两个类都不保证其元素顺序随时间推移保持不变。\n\
  3) 如果你查看 `HashSet` 的源码，可能会发现它是由一个 `HashMap` 支撑的。因此基本上它在内部使用 `HashMap` 来执行其所有操作。\n\
  4) 它们都为添加元素、删除元素等基本操作提供了常数时间性能。\n\n#### HashSet 示例\n```java\nimport java.util.HashSet\
  \ ;\nclass HashSetDemo {\n    public static void main(String [] args) {\n      \
  \  // 创建一个 HashSet\n        HashSet <String > hset = new HashSet <String >();\n\
  \        // 向 HashSeth 添加元素\n        hset.add(\"AA\" );\n        hset.add(\"BB\"\
  \ );\n        hset.add(\"CC\" );\n        hset.add(\"DD\" );\n        // 显示 HashSet\
  \ 元素\n        System .out .println(\"HashSet contains: \" );\n        for (String\
  \ temp : hset){\n            System .out .println(temp);\n        }\n    }\n}\n\
  ```\n输出:\n`HashSet contains: AABBCCDD`\n\n#### HashMap 示例\n```java\nimport java.util.HashMap\
  \ ;\nclass HashMapDemo {\n    public static void main(String [] args) {\n      \
  \  // 创建一个 HashMap\n        HashMap <Integer , String > hmap = new HashMap <Integer\
  \ , String >();\n        // 向 HashMap 添加元素\n        hmap.put(1 , \"AA\" );\n   \
  \     hmap.put(2 , \"BB\" );\n        hmap.put(3 , \"CC\" );\n        hmap.put(4\
  \ , \"DD\" );\n        // 显示 HashMap 元素\n        System .out .println(\"HashMap\
  \ contains: \" +hmap);\n    }\n}\n```\nOutput:\n`HashMap contains: {1 =AA, 2 =BB,\
  \ 3 =CC, 4 =DD}`\n\n### HashSet 和 TreeSet 区别\n#### HashSet vs TreeSet\n1) 对于 `add`、`remove`、`contains`、`size`\
  \ 等操作，`HashSet` 的性能比 `TreeSet` 好。`HashSet` 提供常数时间复杂度，而 `TreeSet` 对此类操作提供 `log(n)`\
  \ 时间复杂度。\n2) `HashSet` 不维护元素的任何顺序，而 `TreeSet` 元素默认按升序排序。\n\n#### 相似点\n1) `HashSet`\
  \ 和 `TreeSet` 都不包含重复元素，这意味着它们都是不重复的。\n2) 如果你需要一个排序的 `Set`，那么将元素先添加到 `HashSet` 然后将其转换为\
  \ `TreeSet` 比直接创建一个 `TreeSet` 并向其添加元素更好。\n3) 这两个类都不是同步的，这意味着它们不是线程安全的，在需要线程安全操作时应该显式地进行同步。\n\
  \n#### 示例\n#### HashSet 示例\n```java\nimport java.util.HashSet ;\nclass HashSetDemo\
  \ {\n    public static void main(String [] args) {\n        // 创建一个 HashSet\n  \
  \      HashSet <String > hset = new HashSet <String >();\n        hset.add(\"Abhi\"\
  \ );\n        hset.add(\"Ram\" );\n        hset.add(\"Kevin\" );\n        hset.add(\"\
  Singh\" );\n        hset.add(\"Rick\" );\n        // 移除重复元素\n        hset.add(\"\
  Ram\" );\n        // 显示 HashSet 元素\n        System .out .println(\"HashSet contains:\
  \ \" );\n        for (String temp : hset){\n            System .out .println(temp);\n\
  \        }\n    }\n}\n```\n输出:\n`HashSet contains: RickSinghRamKevinAbhi`\n\n####\
  \ TreeSet 示例\n```java\nimport java.util.TreeSet ;\nclass TreeSetDemo {\n    public\
  \ static void main(String [] args) {\n        // 创建一个 TreeSet\n        TreeSet <String\
  \ > tset = new TreeSet <String >();\n        tset.add(\"Abhi\" );\n        tset.add(\"\
  Ram\" );\n        tset.add(\"Kevin\" );\n        tset.add(\"Singh\" );\n       \
  \ tset.add(\"Rick\" );\n        // 移除重复元素\n        tset.add(\"Ram\" );\n       \
  \ // 显示 TreeSet 元素\n        System .out .println(\"TreeSet contains: \" );\n   \
  \     for (String temp : tset){\n            System .out .println(temp);\n     \
  \   }\n    }\n}\n```\nOutput:\n`Elements are sorted in ascending order.`\n`TreeSet\
  \ contains: AbhiKevinRamRickSingh`\n\n### 1.18 Java 中的 TreeSet 类\n`TreeSet` 与 `HashSet`\
