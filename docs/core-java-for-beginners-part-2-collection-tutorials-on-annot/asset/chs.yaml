  `key: 1 : Brad`\n`key: 2 : Arun`\n`key: 4 : Sachin`\n`key: 44 : Ajith`\n`key: 88\
  \ : XYZ`\n\n### 12) ArrayList 和 HashMap 的区别\n\n`ArrayList` 和 `HashMap` 都是 Java 框架中常用的类，但它们存储和处理数据的方式完全不同。\n\
  \n#### ArrayList 与 HashMap\n\n1. **实现**：`ArrayList` 实现了 `List` 接口，而 `HashMap` 实现\
  \ `Map` 接口。\n2. **内存消耗**：`ArrayList` 在内部存储元素，而 `HashMap` 在内部存储键值对。\n   ```java\n\
  \   ArrayList <String > arraylist = new ArrayList<>();\n   arraylist.add(\"Test\
  \ String\");\n   ```\n   ```java\n   HashMap <Integer , String > hmap = new HashMap<>();\n\
  \   hmap.put(123, \"Test String\");\n   ```\n3. **顺序**：`ArrayList` 按照插入顺序维护元素，而\
  \ `HashMap` 不保证顺序。\n4. **重复**：`ArrayList` 允许重复元素，但 `HashMap` 不允许重复键。\n5. **空值**：`ArrayList`\
  \ 可以包含空元素。`HashMap` 允许一个空键和任意数量的值。\n6. **get 方法**：在 `ArrayList` 中通过索引获取元素；在 `HashMap`\
  \ 中通过键获取。\n\n### 13) HashMap 和 Hashtable 的区别\n\n`HashMap` 和 `Hashtable` 都实现了 `java.util.Map`\
  \ 接口，但它们的工作方式和用法存在差异。我们将讨论这些类的区别。\n\n#### HashMap 与 Hashtable\n\n1. **同步**：`HashMap`\
  \ 是同步的，这意味着如果在多线程环境中使用，多个线程可以同时访问并处理 `HashMap`。`Hashtable` 是同步的，它确保在某一时刻只有一个线程可以访问\
  \ `Hashtable`。操作 `Hashtable` 的线程会获取锁，其他线程必须等待工作完成。\n2. **空值**：`HashMap` 允许一个空键和任意数量的值。\n\
  3. **顺序**：`HashMap` 的实现 `LinkedHashMap` 维护插入顺序，`TreeMap` 根据键的升序进行排序。`Hashtable`\
  \ 不保证任何顺序，它不按特定顺序维护映射。\n4. **框架**：最初 `Hashtable` 并不是集合框架的一部分，在重构实现 `Map` 接口后才成为集合框架的成员。`HashMap`\
  \ 从一开始就是集合框架的一部分。\n5. **另一个区别**：`HashMap` 的 `Iterator` 是快速失败（fail-fast），如果除了迭代器自身的\
  \ `remove()` 方法外，任何其他线程修改了 map 的结构，都会立即抛出 `ConcurrentModificationException`。`Hashtable`\
  \ 的 `Enumerator` 则不是快速失败的。\n\n#### 示例\n\n**HashMap**:\n```java\nHashMap hm= new\
  \ HashMap ();\nSet keys = hm.keySet();\nfor (Object key : keys) {\n    // 这里会抛出\
  \ ConcurrentModificationException\n    hm.put(object & value pair here);\n}\n```\n\
  **Hashtable**:\n```java\nHashtable ht= new Hashtable ();\nEnumeration keys = ht.keys();\n\
  for (Enumeration en = ht.elements() ; en.hasMoreElements() ; en.nextElement()) {\n\
  \    // 这里不会抛出异常\n    ht.put(key & value pair here);\n}\n```\n\n### 14) HashSet\
  \ 和 HashMap 的区别\nHashSet 与 HashMap 的区别：\n\n\n\n\n\n#### HashSet vs HashMap\n\n|\
  \ HASHSET | HASHMAP |\n| :--- | :--- |\n| `HashSet` 类实现了 `Set` 接口。 | `HashMap` 类实现了\
  \ `Map` 接口。 |\n| 在 `HashSet` 中我们存储对象（`elements` 或 `values`），例如：如果我们有一个包含 `string`\
  \ 元素的 `HashSet`，它可能描述一组 `HashSet` 元素：`{“Hello”, “Hi”, “Bye”, “Run”}` | `HashMap`\
  \ 用于存储键值值对。简单来说，它维护了键与值的映射关系（`HashMap` 类类似于 `Hashtable`，不同之处它是非同步的，且允许 null 值）。如果\
  \ `HashMap` 具有整数类型的键和 `String` 类型的值，你可以这样表示 `HashMap` 元素：例如：`{1->”Hello”, 2->”Hi”,\
  \ 3->”Bye”, 4->”Run”}` |\n| `HashSet` 不允许重复元素，这意味着你不能在 `HashSet` 中存储重复的值。 | `HashMap`\
  \ 不允许重复的键，但允许有重复的值。 |\n| `HashSet` 允许有一个单个 null 值。 | `HashMap` 允许单个 null 键和任意数量的\
  \ null 值。 |\n\n###get 点\n1. `HashMap` 和 `HashSet` 都是非同步的，这意味着除非显式同步，否则它们不适用于线程安全操作。你可以通过以下方式显式同步它们：\n\
  \   - `HashSet`: `Set s = Collections.synchronizedSet(new HashSet (...));`\n   -\
  \ `HashMap`: `Map m = Collections.synchronizedMap(new HashMap (...));`\n2. 这两个类都不保证元素的顺序会随时间保持不变。\n\
  3. 如果你查看 `HashSet` 的源码，可能会发现它是由 `HashMap` 支持的。所以基本上，它在内部使用 `HashMap` 来执行所有操作。\n\
  4. 它们在基本操作（如添加、删除元素等）方面都提供常数级性能。\n\n#### HashSet 示例\n```java\nimport java.util.HashSet\
  \ ;\nclass HashSetDemo {\n    public static void main(String [] args) {\n      \
  \  // Create a HashSet\n        HashSet <String > hset = new HashSet <String>();\n\
  \        //add elements to HashSeth\n        hset.add(\"AA\" );\n        hset.add(\"\
  BB\" );\n        hset.add(\"CC\" );\n        hset.add(\"DD\" );\n        // Displaying\
  \ HashSet elements\n        System .out .println(\"HashSet contains: \" );\n   \
  \     for (String temp : hset){\n            System .out .println(temp);\n     \
  \   }\n    }\n}\n```\n**输出:**\n`HashSet contains:` `AABBCCDD`\n\n#### HashMap 示例\n\
  ```java\nimport java.util.HashMap ;\nclass HashMapDemo {\n    public static void\
  \ main(String [] args) {\n        // Create a HashMap\n        HashMap <Integer\
  \ , String > hmap = new HashMap <Integer , String>();\n        //add elements to\
  \ HashMap\n        hmap.put(1 , \"AA\" );\n        hmap.put(2 , \"BB\" );\n    \
  \    hmap.put(3 , \"CC\" );\n        hmap.put(4 , \"DD\" );\n        // Displaying\
  \ HashMap elements\n        System .out .println(\"HashMap contains: \" +hmap);\n\
  \    }\n}\n```\n**输出:**\n`HashMap contains:` `{1 =AA, 2 =BB, 3 =CC, 4 =DD}`\n\n\
  ### 1.15 Java 中的 TreeMap\n\nJava 中的 `TreeMap` 是基于红黑树的 `NavigableMap` 实现。它根据键的自然顺序进行排序。`TreeMap`\
  \ 类实现了 `Map` 接口，类似于 `HashMap` 类。它们之间的主要区别在于 `HashMap` 是无序集合，而 `TreeMap` 是按键的升序排序的。`TreeMap`\
  \ 是非同步集合类，这意味着除非显式同步，否则它不适用于线程安全操作。\n\n#### TreeMap 示例\n在此示例中，我们将键值映射存储到 `TreeMap`\
  \ 中，并在从 `TreeMap` 获取数据时，我们获得一个排序后的键值映射。\n\n```java\nimport java.util.TreeMap ;\n\
  import java.util.Set ;\nimport java.util.Iterator ;\nimport java.util.Map ;\npublic\
  \ class Details {\n    public static void main(String args[]) {\n        /* This\
  \ is how to declare TreeMap */\n        TreeMap <Integer , String > tmap =new TreeMap\
  \ < Integer , String >();\n        /*Adding elements to TreeMap*/\n        tmap.put(1\
  \ , \"Data1\" );\n        tmap.put(23 , \"Data2\" );\n        tmap.put(70 , \"Data3\"\
  \ );\n        tmap.put(4 , \"Data4\" );\n        tmap.put(2 , \"Data5\" );\n   \
  \     /* Display content using Iterator*/\n        Set set = tmap.entrySet();\n\
  \        Iterator iterator = set .iterator();\n        while (iterator.hasNext())\
  \ {\n            Map .Entry mentry = (Map .Entry )iterator.next ();\n          \
  \  System .out .print (\"key is: \" + mentry.getKey() + \" & Value is: \" );\n \
  \           System .out .println(mentry.getValue());\n        }\n    }\n}\n```\n\
  **输出:**\n`key is : 1 & Value is : Data1`\n`key is : 2 & Value is : Data5`\n`key\
  \ is : 4 & Value is : Data4`\n`key is : 23 & Value is : Data2`\n`key is : 70 & Value\
  \ is : Data3`\n\n你可以看到，我们是随机顺序插入数据的，但当我们显示 `TreeMap` 内容时，我们得到了按键升序排列的排序。\n\n###\
  \ 1.16 TreeMap 教程\n* 按值排序 `TreeMap` \n* `TreeMap` Iterator 示例\n* 逆序遍历 `TreeMap`\n\
