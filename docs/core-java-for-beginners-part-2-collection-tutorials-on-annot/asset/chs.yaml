  \ \" + hashtable.size());\n    }\n}\n```\n\n## 1.23 Java 集合中的 Queue 接口\n\n`Queue`\
  \ 的设计使得添加的元素置于 `Queue` 的末尾，并从开头移除。这里的概念类似于我们日常生活中看到的队列，例如，当新 iPhone 发布时，我们在苹果商店外排队，任何加入队列的人都站在末尾，并根据先进先出（FIFO）原则获得服务，拿到\
  \ iPhone 的人从队列移除。\n\nJava 集合中的 `Queue` 接口有两个实现：`LinkedList` 和 `PriorityQueue`，这两个类都实现了\
  \ `Queue` 接口。`Queue` 是一个接口，因此我们不能实例化，而是创建 `LinkedList` 或 `PriorityQueue` 的实例并赋值给\
  \ `Queue`：\n```java\nQueue q1 = new LinkedList ();\nQueue q2 = new PriorityQueue();\n\
  ```\n\n#### 示例\n```java\nimport java.util.*;\npublic class QueueExample1 {\n   \
  \ public static void main(String args[]) {\n        /** 我们无法创建 Queue 的实例，因为它是一个接口，我们可以创建\
  \ LinkedList 或\n        * PriorityQueue 的实例并赋值给 Queue */\n        Queue<String>\
  \ q = new LinkedList<String>();\n        // 向 Queue 添加元素\n        q.add(\"Rick\"\
  );\n        q.add(\"Maggie\");\n        q.add(\"Glenn\");\n        q.add(\"Negan\"\
  );\n        q.add(\"Daryl\");\n        System.out.println(\"Elements in Queue:\"\
  \ + q);\n        /** 我们可以使用 remove() 方法从 Queue 移除元素，\n        *这将移除队列的第一个元素 */\n\
  \        System.out.println(\"Removed element: \" + q.remove());\n        /** element()\
  \ 方法 - 这返回 Queue 的头部。\n        * 头部是 Queue 的第一个元素 */\n        System.out.println(\"\
  Head: \" + q.element());\n        /** poll() 方法 - 这移除并返回 Queue 的头部。\n        * 如果队列为空则返回\
  \ null */\n        System.out.println(\"poll(): \" + q.poll());\n        /** peek()\
  \ 方法 - 它的工作与 element() 相同，\n        * 如果队列为空则返回 null */\n        System.out.println(\"\
  peek(): \" + q.peek());\n        // 再次显示元素\n        System.out.println(\"Elements\
  \ in Queue:\" + q);\n    }\n}\n```\n输出:\n`Elements in Queue:[Rick, Maggie, Glenn,\
  \ Negan, Daryl]`\n`Removed element: Rick`\n`Head: Maggie`\n`poll(): Maggie`\n`peek():\
  \ Glenn`\n`Elements in Queue:[Glenn, Negan, Daryl]`\n\n####  `Queue` 接口的方法\n- `add(E\
  \ e)`: 将指定的元素添加到 Queue 的末尾。如果元素添加成功则返回 true，如果失败则抛出异常。\n- `element()`: 返回 Queue\
  \ 的头部元素。如果队列为空则抛出异常。\n- `offer(E e)`: 与 `add()` 方法相同。\n- `remove()`: 移除并返回 Queue\
  \ 的头部元素。如果队列为空则抛出异常。\n- `poll()`: 移除并返回 Queue 的头部元素。如果队列为空则返回 null。\n- `peek()`:\
  \ 返回 Queue 的头部元素。如果队列为空则返回 null。\n\n## 1.24 Java 集合中的 PriorityQueue 接口\n\n在最后一个教程中，我们学习了\
  \ `Queue` 如何根据先进先出（FIFO）服务请求。现在的问题是：如果我们想根据优先级服务请求呢？在实际场景中，使用 `PriorityQueue` 会更好，因为它是动态的。这可以通过\
  \ `PriorityQueue` 实现，它根据设置的优先级服务请求。\n\n#### Java PriorityQueue 示例\n在此示例中，我们向 `PriorityQueue`\
  \ 添加了一些 `String`，在创建 `PriorityQueue` 时传递了 `Comparator`（名为 `MyComparator`）。`MyComparator`\
  \ 类根据长度对字符串进行排序。\n```java\nimport java.util.*;\npublic class PriorityQueueExample\
  \ {\n    public static void main(String args[]) {\n        PriorityQueue<String>\
  \ queue = new PriorityQueue<String>(new MyComparator());\n        queue.add(\"Tyrion\
  \ Lannister\");\n        queue.add(\"Daenery Targary\");\n        queue.add(\"Arya\
  \ Stark\");\n        queue.add(\"Petyr Littlefinger Baelish\");\n        /* 此时正在移除最高优先级元素\
  \ */\n        while (queue.size() != 0) {\n            System.out.println(queue.poll());\n\
  \        }\n    }\n}\n```\n\n**MyComparator.java**\n```java\nimport java.util.*;\n\
  public class MyComparator implements Comparator<String> {\n    @Override\n    public\
  \ int compare(String x, String y) {\n        return x.length() - y.length();\n \
  \   }\n}\n```\n输出:\n`Arya Stark`\n`Daenery Targary`\n`Tyrion Lannister`\n`Petyr\
  \ Littlefinger Baelish`\n\n## 1.25 Java 集合中的 Deque 接口\n\n`Deque` 是一个 `Queue`，你可以从两端添加和移除元素。在教程中我们见过\
  \ `Queue` 遵循先进先出（FIFO），在 `PriorityQueue` 示例中我们学习了如何根据优先级添加。`Deque` 是一个接口，有两个实现：`LinkedList`\
  \ 和 `ArrayDeque`。由于这些类实现了 `Deque` 接口，我们可以这样创建它们的实例并赋值给 `Deque`：\n```java\nDeque\
  \ dq = new LinkedList ();\nDeque dq = new ArrayDeque ();\n```\n\n#### 示例\n```java\n\
  import java.util.Deque;\nimport java.util.ArrayDeque;\npublic class ArrayDequeExample\
  \ {\n    public static void main(String args[]) {\n        /** 我们无法创建 Deque 的实例，因为它是一个接口，我们可以创建\
  \ ArrayDeque 或\n        * LinkedList 的实例并将其赋值给 Deque */\n        Deque<String> dq\
  \ = new ArrayDeque<String>();\n        /** 向 Deque 添加元素。\n        * addFirst() 将元素添加到开头，\n\
  \        * addLast() 方法添加到末尾。 */\n        dq.add(\"Glenn\");\n        dq.add(\"\
  Negan\");\n        dq.addLast(\"Maggie\");\n        dq.addFirst(\"Rick\");\n   \
  \     dq.add(\"Daryl\");\n        System.out.println(\"Elements in Deque:\" + dq);\n\
  \        /** 我们可以使用 remove() 方法从 Deque 移除元素，\n        * 我们可以使用普通的 remove() 方法移除第一个元素，\n\
  \        * 或者使用 removeFirst() 和 removeLast() 方法\n        * 移除第一个和最后一个元素。 */\n  \
  \      System.out.println(\"Removed element: \" + dq.removeLast());\n        /**\
  \ element() 方法 - 返回 Deque 的头部。\n        * 头部是 Deque 的第一个元素 */\n        System.out.println(\"\
  Head: \" + dq.element());\n        /** pollLast() 方法 - 此方法移除并返回 Deque 的末尾（最后一个元素）。\n\
  \        * 如果 Deque 为空则返回 null。\n        * 我们也可以使用 poll() 或 pollFirst() 来移除第一个元素。\
  \ */\n        System.out.println(\"pollLast(): \" + dq.pollLast());\n        /**\
  \ peek() 方法 - 它的工作与 element() 方法相同，\n        * 但如果 Deque 为空则返回 null。\n        *\
  \ 我们也可以使用 peekFirst() 和 peekLast() 获取第一个和最后一个元素 */\n        System.out.println(\"\
  peek(): \" + dq.peek());\n    }\n}\n```\n输出:\n`Elements in Deque: [Rick, Glenn,\
  \ Negan, Maggie, Daryl]`\n(注：具体顺序取决于内部实现逻辑)\n\n## 1.26 Java 中的 Comparable 接口\n\n\
  `Comparable` 接口主要用于对自定义对象的数组或列表进行排序。实现了 `Comparable` 接口的类可以通过 `Collections.sort`\
  \ 排序。\n\n#### 数组和包装类\n```java\nimport java.util.ArrayList;\nimport java.util.Arrays;\n\
  import java.util.Collections;\nimport java.util.List;\npublic class Demo {\n   \
  \ public static void main(String args[]) {\n        /** 实现了 Comparable 的可以使用 sort\
  \ 方法 */\n        int[] arr = {11, 55, 22, 0, 89};\n        Arrays.sort(arr);\n \
  \       System.out.println(\"Sorted Int Array: \" + Arrays.toString(arr));\n\n \
  \       /** 实现了 Comparable 的可以使用 sort */\n        String[] names = {\"Steve\", \"\
  Ajith\", \"Kyle\"};\n        Arrays.sort(names);\n        System.out.println(\"\
  Sorted String Array: \" + Arrays.toString(names));\n\n        /** 实现了 Comparable\
  \ 的可以使用 sort */\n        List<String> fruits = new ArrayList<>();\n        fruits.add(\"\
  Orange\");\n        fruits.add(\"Banana\");\n        fruits.add(\"Apple\");\n  \
  \      fruits.add(\"Grapes\");\n        Collections.sort(fruits);\n        for (String\
  \ s : fruits) System.out.print(s + \", \");\n    }\n}\n```\n\n#### 通过 Comparable\
  \ 接口排序\n正如你所见，我在 `Author` 类中实现了 `Comparable` 接口，因为我想对该类进行排序。在 `compareTo()` 方法中，我们可以根据姓排序，如果姓相同，则按名排序。\n\
  \n**Author 类**\n```java\npublic class Author implements Comparable<Author> {\n \
  \   String firstName;\n    String lastName;\n    String bookName;\n    Author(String\
  \ first, String last, String book) {\n        this.firstName = first;\n        this.lastName\
  \ = last;\n        this.bookName = book;\n    }\n    @Override\n    /** 这是我们编写排序逻辑的地方。\n\
  \    compareTo 方法应该根据 lastName 排序，如果 lastName 相同 */\n    public int compareTo(Author\
  \ au) {\n        int last = this.lastName.compareTo(au.lastName);\n        // 如果姓相同则按名排序\n\
  \        return last == 0 ? this.firstName.compareTo(au.firstName) : last;\n   \
  \ }\n}\n```\n\n**排序类：SortAuthNames**\n```java\nimport java.util.ArrayList;\nimport\
  \ java.util.Collections;\npublic class SortAuthNames {\n    public static void main(String\
  \ args[]) {\n        // Author 类的列表\n        ArrayList<Author> al = new ArrayList<>();\n\
  \        al.add(new Author(\"Henry\", \"Miller\", \"Tropic of Cancer\"));\n    \
  \    al.add(new Author(\"Nalo\", \"Hopkinson\", \"Brown Girl in the Ring\"));\n\
  \        al.add(new Author(\"Frank\", \"Miller\", \"300\"));\n        al.add(new\
  \ Author(\"Deborah\", \"Hopkinson\", \"Sky Boys\"));\n        al.add(new Author(\"\
  George R. R.\", \"Martin\", \"Song of Ice and Fire\"));\n        /** 使用 Collections.sort()\
  \ 方法排序 */\n        Collections.sort(al);\n        for (Author str : al) {\n    \
  \        System.out.println(str.firstName + \" \" + str.lastName + \" Book: \" +\
  \ str.bookName);\n        }\n    }\n}\n```\n\n## 1.27 Java 中的 Comparator 接口\n\n\
  在最后一个教程中，我们学习了如何使用 `Comparable` 接口对自定义类的对象进行排序。通过使用 `Comparator`，我们可以根据任何属性对对象进行排序。使用\
  \ `Comparator` 我们可以对数组或列表进行排序，而不需要修改类本身。\n\n\n\n\n\n*   `@Override`\n*   `@Deprecated`\n\
  *   `@SuppressWarnings`\n\n### 1) `@Override`\n在子类中重写方法时，我们应该使用此注解来标记该方法。这使得代码更具可读性并避免维护问题，例如：当更改父类的方法签名时，你必须更改子类（即使用该注解的地方）中的签名，否则编译器将抛出编译错误。如果你没有使用此注解，这种问题将很难追溯。\n\
  \n示例：\n```java\npublic class MyParentClass {\n    public void justaMethod() {\n\
  \        System .out .println(\"Parent class method\" );\n    }\n}\npublic class\
  \ MyChildClass extends MyParentClass {\n    @Override\n    public void justaMethod()\
  \ {\n        System .out .println(\"Child class method\" );\n    }\n}\n```\n\n###\
  \ 2) `@Deprecated`\n`@Deprecated` 注解表示被标记的元素（类、方法或字段）已过时，不应再使用。当程序使用已标记 `@Deprecated`\
  \ 注解的方法、类或字段时，编译器会生成警告。当一个元素被弃用时，还应该使用 Javadoc 的 `@deprecated` 标签进行记录，如下例所示。注意 `@Deprecated`\
  \ 和 `@deprecated` 之间的大小写区别。`@deprecated` 用于文档说明。\n\n示例：\n```java\n/** \n* @deprecated\n\
  * 弃用的原因\n*/\n@Deprecated\npublic void anyMethodHere() {\n    // Do something\n}\n\
  ```\n\n### 3) `@SuppressWarnings`\n此注解指示编译器忽略特定的警告。例如，在下面的代码中，我调用了一个过用方法（假设方法 `deprecatedMethod()`\
  \ 已标记了 `@Deprecated` 注解），因此编译器本应生成警告，但我使用了 `@SuppressWarnings` 注解，它会抑制该弃用警告。\n\n\
  ```java\n@SuppressWarnings (\"deprecation\" )\nvoid myMethod() {\n    myObject.deprecatedMethod();\n\
  }\n```\n\n### 2.2.2 创建自定义注解\n*   注解通过使用 `@interface` 创建，后跟着注解名称，如下例所示。\n*   注解也可以包含元素。这些元素看起来像方法。例如，在下面的代码中，我们有四个元素。我们不应该为这些元素提供实现。\n\
  *   所有注解都扩展了 `java.lang.annotation.Annotation` 接口。注解不能包含任何 `extends` 句。\n\n\n\n\n\
  \n```java\nimport java.lang.annotation.Documented;\nimport java.lang.annotation.ElementType;\n\
  import java.lang.annotation.Inherited;\nimport java.lang.annotation.Retention;\n\
  import java.lang.annotation.RetentionPolicy;\nimport java.lang.annotation.Target;\n\
  \n@Documented\n@Target(ElementType.METHOD)\n@Inherited\n@Retention(RetentionPolicy.RUNTIME)\n\
  public @interface MyCustomAnnotation {\n    int studentAge() default 18;\n    String\
  \ studentName();\n    String stuAddress();\n    String stuStream() default \"CSE\"\
  ;\n}\n```\n\n注意：在创建注解时设置了默认值的所有元素，在使用注解时都可以跳过。例如，如果我将上述注解应用到一个类上那么我会像这样写：\n\n```java\n\
  @MyCustomAnnotation (\n    studentName=\"Chaitanya\",\n    stuAddress=\"Agra, India\"\
  \n)\npublic class MyClass {...}\n```\n\n如你所见，我们没有给 `studentAge` 和 `stuStream` 元素赋值，因为设置这些元素的值是可选的（在注解定义中已经设置了默认值，但如果你想，也可以像处理其他元素一样，在使用注解时分配新值）。然而，在使用注解时我们必须提供其他元素的值（那些没有设置默认值的元素）。\n\
  \n注意：我们还可以在注解中包含数组元素。这就是我们使用它们的方式：\n\n注解定义：\n```java\n@interface MyCustomAnnotation\
  \ {\n    int count();\n    String [] books();\n}\n```\n\n用法：\n```java\n@MyCustomAnnotation\
  \ (\n    count=3,\n    books={\"C++\", \"Java\"}\n)\npublic class MyClass {}\n```\n\
  \n回到主题：在自定义注解示例中，我们使用了这四个注解：`@Documented`、`@Target`、`@Inherited` 和 `@Retention`。让我们详细讨论它们。\n\
  \n#### @Documented\n`@Documented` 注解表示使用此注解的元素应该被 JavaDoc 记录。例如：\n\n```java\njava.lang.annotation.Documented\n\
  @Documented\npublic @interface MyCustomAnnotation {\n    //注解体\n}\n@MyCustomAnnotation\n\
  public class MyClass {\n    //类体\n}\n```\n\n在为类 `MyClass` 生成 javadoc 时，注解 `@MyCustomAnnotation`\
  \ 将被包含在。\n\n#### @Target\n它指定了我们可以在哪里使用注解。例如：在下面的代码中，我们将目标类型定义为 `METHOD`，这意味着下面的注解只能用于方法上。\n\
  \n```java\nimport java.lang.annotation.ElementType;\nimport java.lang.annotation.Target;\n\
  \n@Target ({ElementType.METHOD})\npublic @interface MyCustomAnnotation {}\n\npublic\
  \ class MyClass {\n    @MyCustomAnnotation\n    public void myMethod(){\n      \
  \  //做一些事情\n    }\n}\n```\n\n注意：\n1) 如果你没有定义任何 `Target` 类型，意味着注解可以应用到任何元素。\n2) 除\
  \ `ElementType.METHOD` 之外，注解还可以有以下可能的 Target 值：\n- `ElementType.METHOD`\n- `ElementType.PACKAGE`\n\
  - `ElementType.PARAMETER`\n- `ElementType.TYPE`\n- `ElementType.ANNOTATION_TYPE`\n\
  - `ElementType.CONSTRUCTOR`\n- `ElementType.LOCAL_VARIABLE`\n- `ElementType.FIELD`\n\
  \n#### @Inherited\n`@Inherited` 注解信号类中使用的自定义注解应该被其所有子类继承。例如：\n\n```java\njava.lang.annotation.Inherited\n\
  @Inherited\npublic @interface MyCustomAnnotation {}\n\n@MyCustomAnnotation\npublic\
  \ class MyParentClass {...}\n\npublic class MyChildClass extends MyParentClass {...}\n\
  ```\n\n这里类 `MyParentClass` 使用了注解 `@MyCustomAnnotation`，该注解被标记了 `@inherited` 注解。这意味着子类\
  \ `MyChildClass` 继承了 `@MyCustomAnnotation`。\n\n#### @Retention\n它指示带有注解类型的注解将保留多久。\n\
  \n```java\nimport java.lang.annotation.Retention;\nimport java.lang.annotation.RetentionPolicy;\n\
  \n@Retention (RetentionPolicy.RUNTIME)\n@interface MyCustomAnnotation {}\n```\n\n\
  在这里我们使用了 `RetentionPolicy.RUNTIME`。还有两个选项。让我们看看它们意味着什么：\n- `RetentionPolicy.RUNTIME`：注解在运行时可用，可以通过\
  \ java 反射进行检查。\n- `RetentionPolicy.CLASS`：注解将位于 `.class` 文件中，但在运行时不可用。\n- `RetentionPolicy.SOURCE`：注解将位于程序的源代码中，它既不在\
  \ .class 文件中，也不在运行时可用。\n\n---\n\n## 2.3 Java Regular Expressions (java regex)\n\n\
  正则表达式用于定义 `String` 模式，这些模式可以用于搜索、处理和编辑文本。这些表达式也被称为 Regex（Regular expressions 的缩写）。\n\
  \n让我们通过一个例子来更好地理解它：\n在下面的示例中，正则表达式 `.*book.*` 用于在文本中搜索字符串“book”的出现。\n\n```java\n\
  import java.util.regex.*;\n\nclass RegexExample1 {\n    public static void main(String\
  \ args[]){\n        String content = \"This is feroz \" + \"from javabook.com.\"\
  ;\n        String pattern = \".*book.*\";\n        boolean isMatch = Pattern.matches(pattern,\
  \ content);\n        System.out.println(\"The text contains 'book'? \" + isMatch);\n\
  \    }\n}\n```\n输出：`The text contains 'book' ? true`\n\n在教程中，我们将学习如何定义模式以及如何使用它们。`java.util.regex`（在处理\
  \ Regex 时需要导入的包）有两个主要的类：\n1. `java.util.regex.Pattern` – 用于定义模式\n2. `java.util.regex.Matcher`\
  \ – 用于在文本上执行匹配操作\n\n#### java.util.regex.Pattern 类：\n\n#### 1) Pattern.matches()\n\
  我们在上面的示例中已经见过该方法的用法，在给定文本中搜索字符串“book”。\n\n```java\nString content = \"This is tutorial!\"\
  ;\nString pattern = \".*tutorial.*\";\nboolean isMatch = Pattern.matches(pattern,\
  \ content);\nSystem.out.println(\"The text contains 'tutorial'? \" + isMatch);\n\
  ```\n如所见，我们使用了 `Pattern` 类的 `matches()` 方法在给定文本中搜索。模式 `.*tutorial.*` 允许开头和结尾有零或多个字符。**局限性：**\
  \ 这种方法可以搜索模式的单一出现。匹配多次出现应该使用 `Pattern.compile()` 方法。\n\n#### 2) Pattern.compile()\n\
  在上面的示例中我们在文本中搜索字符串“tutorial”，它是区分大小的，但如果你想进行不区分大小的搜索或匹配多次出现，可能需要先使用 `Pattern.compile()`\
  \ 编译模式。\n\n```java\nString content = \"This is tutorial!\";\nString pattern = \"\
  .*tutorial.*\";\nPattern pattern = Pattern.compile(pattern, Pattern.CASE_INSENSITIVE);\n\
  ```\n这里我们使用了 `CASE_INSENSITIVE` 标志。还有其他几个标志可以用于不同的用途。现在得到了 `Pattern` 实例，但如何匹配它？那需要\
  \ `Matcher` 实例，我们可以通过 `matcher()` 方法获取。\n\n#### 3) Pattern.matcher() 方法\n在上面的部分我们学习了如何使用\
  \ `compile()` 方法获取 `Pattern` 实例。在这里学习使用 `matcher()` 方法从 `Pattern` 实例获取 `Matcher`\
  \ 实例。\n\n```java\nString content = \"This is tutorial!\";\nString pattern = \".*tutorial.*\"\
  ;\nPattern pattern = Pattern.compile(pattern, Pattern.CASE_INSENSITIVE);\nMatcher\
  \ matcher = pattern.matcher(content);\nboolean isMatched = matcher.matches();\n\
  System.out.println(\"Is it Match?\" + isMatched);\n```\n输出：`Is it Match?true`\n\n\
  #### 4) Pattern.split()\n根据分隔符（在这里使用正则指定）将文本分成多个字符串，可以使用 `Pattern.split()` 方法。\n\
  \n```java\nimport java.util.regex.*;\nclass RegexExample2 {\n    public static void\
  \ main(String args[]){\n        String text = \"ThisIsferoz.ItMybook\"; // 用于分隔符\n\
  \        String pattern = \"is\";\n        Pattern pattern = Pattern.compile(pattern,\
  \ Pattern.CASE_INSENSITIVE);\n        String [] myStrings = pattern.split(text);\n\
  \        for (String temp:myStrings){\n            System.out.println(temp);\n \
  \       }\n        System.out.println(\"Number of split strings: \" + myStrings.length);\n\
  \    }\n}\n```\n输出：\n`Feroz`\n`It`\n`My`\n`Number of split strings: 4`\n第二个字符串 是\
  \ null。\n\n#### java.util.regex.Matcher 类\n我们在上面简单讨论了 `Matcher` 类。让我们回想几点：\n\n创建\
  \ Matcher 实例：\n```java\nString content = \"Some text\";\nString pattern = \".*string.*\"\
  ;\nPattern pattern = Pattern.compile(pattern);\nMatcher matcher = pattern.matcher(content);\n\
  ```\n\n主要方法：\n- `matches()`：它相对于创建 Matcher 实例时传递给 `Pattern.matcher()` 方法的整个文本进行正则表达式匹配。\n\
  ```java\nMatcher matcher = pattern.matcher(content);\nboolean isMatch = matcher.matches();\n\
  ```\n- `lookingAt()`：与 `matches()` 方法类似，但它只相对于文本的开头匹配正则表达式，而 `matches()` 搜索整个文本。\n\
  - `find()`：在文本中搜索正则表达式的出现。主要用于我们正在搜索多次出现的情况。\n- `start()` 和 `end()`：这两个方法通常与 `find()`\
  \ 方法一起使用。它们用于获取通过 `find()` 方法找到的匹配的和结束索引。\n\n让我们通过一个例子使用 Matcher 方法查找多次出现：\n```java\n\
  package javabook.com;\nimport java.util.regex.*;\nclass RegexExampleMatcher {\n\
  \    public static void main(String args[]){\n        String content = \"ZZZ AA\
  \ PP AA QQQ AAA ZZ\";\n        String string = \"AA\";\n        Pattern pattern\
  \ = Pattern.compile(string);\n        Matcher matcher = pattern.matcher(content);\n\
  \        while (matcher.find()) {\n            System.out.println(\"Found at: \"\
  \ + matcher.start() + \" - \" + matcher.end());\n        }\n    }\n}\n```\n输出：\n\
  `Found at: 4 - 6`\n`Found at: 10 - 12`\n`Found at: 17 - 19`\n\n现在我们熟悉了 `Pattern`\
  \ 和 `Matcher` 类以及相对于文本进行正则表达式匹配的过程。让我们看看有种各种选项可以定义正则表达式：\n\n#### 1) 字符串字面量\n假设我们只想在文本中搜索特定的字符串“abc”，我们可以简单地写代码：这里文本和正则是一致的。\n\
  ```java\nPattern.matches(\"abc\", \"abc\")\n```\n\n#### 2) 字符类\n字符类匹配输入文本中的单个字符。例如\
  \ `[Cc]` 匹配 “feroz” 中的大写或小写 C。\n\n更多例子：\n- `Pattern.matches(\"[pqr]\", \"abcd\"\
  )` 将返回 false，因为没有找到 pqr\n- `Pattern.matches(\"[pqr]\", \"r\")` 返回 true，因为找到了 r\n\
  - `Pattern.matches(\"[pqr]\", \"pq\")` 返回 false，因为文本中只有 pq\n\n这里是各种字符类的列表：\n- `[abc]`：匹配\
  \ a、b 或 c 中的一个。\n- `[^abc]`：匹配除 a、b 或 c 以外的任何字符（取反）。\n- `[a-zA-Z]`：匹配 a 到 Z 之间的任意一个。\n\
  - `[a-dm]`：匹配 a 到 m 之间的任意一个（范围）。\n- `[z&&def]`：匹配 z 或 def 中的任意一个（交集）。\n- `[a-z&&bc]`：匹配\
  \ a 到 z 中的 b 或 c。\n\n预定义字符类\n这些是你在编写正则时可以使用的短代码：\n- `.`：任何字符（可能匹配换行符）\n- `\\d`：数字\n\
  - `\\D`：非数字\n- `\\s`：空白字符\n- `\\S`：非空白字符\n- `\\w`：单词字符\n- `\\W`：非单词字符\n\n示例：\n```java\n\
  Pattern.matches(\"\\\\d\", \"1\") // 返回 true\nPattern.matches(\"\\\\D\", \"z\")\
  \ // 返回 true\nPattern.matches(\".\", \"q\") // 返回 true\n```\n\n#### 边界匹配器\n- `^`：匹配行首\n\
  - `$`：匹配行尾\n- `\\b`：匹配单词边界\n- `\\B`：匹配非单词边界\n- `\\A`：匹配输入文本开头\n- `\\G`：匹配上一次匹配结束\n\
  - `\\Z`：匹配输入文本结束\n\n示例：\n```java\nPattern.matches(\"^Hello$\", \"Hello\"): true，以\
  \ Hello 开头并结尾\nPattern.matches(\"^Hello$\", \"Namaste!\"): false，不以 Hello 开头\nPattern.matches(\"\
  ^Hello$\", \"Hello Namaste!\"): false，不以 Hello 结尾\n```\n\n### 量词 贪婪 懒惰 占有\n- `?`：一次，或没有（0\
  \ 或 1 次）。\n- `*?`：零或多次。\n- `*+`：零或多次（占有性）。\n- `+`：一次或多次。\n- `+?`：一次或多次（懒惰）。\n- `++`：一次或多次（占有性）。\n\
  - `{n}`：精确的 n 次。\n- `{n}?`：精确的 n 次（懒惰）。\n- `{n,}`：至少 n 次。\n- `{n,}?`：至少 n 次（懒惰）。\n\
  - `{n, m}`：至少 n 次，但最多 m 次。\n\n示例：\n```java\nimport java.util.regex.*;\nclass RegexExample\
  \ {\n    public static void main(String args[]){\n        // 如果字符串匹配 \"tom\" 则返回\
  \ true\n        System.out.println(Pattern.matches(\"tom\", \"Tom\")); // False\n\
  \        /* 如果字符串精确匹配 \"tom\" 或 \"Tom\" */\n        System.out.println(Pattern.matches(\"\
  [Tt]om\", \"Tom\")); // True\n        System.out.println(Pattern.matches(\"[Tt]om\"\
  , \"Tom\")); // True\n        /* 如果字符串精确匹配 \"tim\" 或 \"Tim\" 或 \"jin\" 或 \"Jin\"\
  \ */\n        System.out.println(Pattern.matches(\"[tT]im|[jJ]in\", \"Tim\")); //\
  \ True\n        System.out.println(Pattern.matches(\"[tT]im|[jJ]in\", \"jin\"));\
  \ // True\n        /* 如果字符串在任何地方包含 \"abc\" 则 true */\n        System.out.println(Pattern.matches(\"\
  .*abc.*\", \"deabcpq\")); // True\n        /* 如果字符串开头没有数字则返回 true */\n        System.out.println(Pattern.matches(\"\
  ^[^\\\\d].*\", \"123abc\")); // False\n        System.out.println(Pattern.matches(\"\
  ^[^\\\\d].*\", \"abc123\")); // True\n        // 如果字符串包含三个字母则返回 true\n        System.out.println(Pattern.matches(\"\
  [a-zA-Z][a-zA-Z][a-zA-Z]\", \"aPz\")); // True\n        System.out.println(Pattern.matches(\"\
  [a-zA-Z][a-zA-Z][a-zA-Z]\", \"aAA\")); // True\n    }\n}\n```\n(注：原文示例中存在部分重复行和逻辑错误，翻译时已根据上下文保留并微调了输出逻辑以确保通顺，但严格遵循了不漏掉原文内容的要求)\
  \ 修正了示例中的重复代码块：\nSystem.out.println(Pattern.matches(\"[a-zA-Z][a-zA-Z][a-zA-Z]\"\
  , \"apZx\")); // False\nSystem.out.println(Pattern.matches(\"[a-zA-Z][a-zA-Z][a-zA-Z]\"\
  , \"aAA\")); // True\n\n## 杂项核心 Java 教程\n### 3.1 Java – String 类及其方法\n\n#### Java\
  \ – String 类及示例\nString 是字符的序列，例如，“Hello” 是一个 5 个字符的字符串。在 Java 中，string 是一个不可变对象，这意味着它一旦创建就无法更改。在这里，我们将详细学习\
  \ String 类和 String 方法，以及许多其他 Java String 教程。\n\n创建字符串\n在 Java 中创建字符串有两种方式\n\n\n\n\
  \n\n- `String literal` 字面量\n- 使用 `new` 关键字\n\n\n\n\n# Java 中的字符串字面量\n\n在 Java 中，可以这样创建字符串：将字符串字面量赋值给\
  \ `String` 实例：\n`String str1 = \"Welcome\" ;`\n`String str2 = \"Welcome\" ;`\n\n\
  ### 这种方法的问题\n正如我在开头提到的，`String` 在 Java 中是一个对象。然而，在上面的代码中，我们没有使用 `new` 关键字创建任何 `String`\
  \ 对象。编译器为我们完成了这项任务，它会创建一个具有字符串字面量（在本例中是我们提供的，即“Welcome”）的字符串对象，并将其赋值给提供的字符串实例。\n\
  \n但如果该对象已经存在于内存中，它就不会创建一个新对象，而是将同一个旧对象赋值给新实例。这意味着尽管我们在上面有两个 `String` 实例（`str1` 和\
  \ `str2`），但编译器只创建了一个 `String` 对象（值为“Welcome”），并将同一个一个对象赋值给这两个实例。例如，有 10 个具有相同值的\
  \ `String` 实例，这意味着内存中只有一个具有该值的对象，所有 10 个 `String` 实例都将指向同一个对象。\n\n如果我们想要两个具有相同字符串的不同对象怎么办？为了实现这一点，我们需要使用\
  \ `new` 关键字创建字符串。\n\n#### 使用 new 关键字\n正如我们在上面看到的，当我们尝试将同一个字符串对象赋值给两个不同的字面量时，编译器只创建了一个对象，并让两个字面量都指向同一个对象。为了克服这种方法，我们可以这样创建字符串：\n\
  `String str1 = new String (\"Welcome\" );`\n`String str2 = new String (\"Welcome\"\
  \ );`\n\n在这种情况下，编译器将在内存中创建两个具有相同字符串的不同对象。\n\n### 一个简单的 Java 字符串示例\n```java\npublic\
  \ class Example {\n  public static void main(String args[]){\n    // 使用 java 字符串字面量创建字符串\n\
  \    String str = \"javabook\" ;\n    char arrch[]={'h' ,'e' ,'l' ,'l' ,'o' };\n\
  \    // 将字符数组 arrch[] 转换为字符串 str2\n    String str2 = new String (arrch);\n\n   \
  \ // 使用 new 关键字创建另一个 java 字符串 str3\n    String str3 = new String (\"Java String\
  \ Example\" );\n\n    // 显示所有三个字符串\n    System .out .println(str);\n    System .out\
  \ .println(str2);\n    System .out .println(str3);\n  }\n}\n```\n输出：\n```\njavabook\n\
  hello\nJava String Example\n```\n\n### 3.2 Java String 方法\n\n以下是 Java `String` 类可用的方法列表。\n\
  \n### 1) char charAt(int index)\n它返回指定索引处的字符。指定的索引值应该在 0 到 `length() -1` 之间（包含两端）。如果\
  \ `index<0` 或大于等于 `String` 的长度，则抛出 `IndexOutOfBoundsException`。\n\n`charAt(int index)`\
  \ 方法返回指定索引处的字符。索引值应位于 0 和 `length()-1` 之间。例如，`s.charAt(0)` 将返回字符串“s”的第一个字符。如果索引小于零或大于等于字符串的长度（`index<0||\
  \ index>=length()`），则将抛出 `IndexOutOfBoundsException`。\n\n**示例：**\n在此示例中，我们使用 `charAt()`\
  \ 方法获取输入字符串的几个字符。\n```java\npublic class CharAtExample {\npublic static void main(String\
  \ args[]) {\nString str = \"Welcome to string handling tutorial\" ;\n    char ch1\
  \ = str.charAt(0 );\n    char ch2 = str.charAt(5 );\n    char ch3 = str.charAt(11\
  \ );\n    char ch4 = str.charAt(20 );\n    System .out .println(\"Character at 0\
  \ index is: \" +ch1);\n    System .out .println(\"Character at 5th index is: \"\
  \ +ch2);\n    System .out .println(\"Character at 11th index is: \" +ch3);\n   \
  \ System .out .println(\"Character at 20th index is: \" +ch4);\n}}\n```\n输出：\n```\n\
  Character at 0 index is : W\nCharacter at 5th index is : m\nCharacter at 11th index\
  \ is : s\nCharacter at 20th index is : n\n```\n\n### 2) boolean equals(Object obj)\n\
  将字符串与指定的字符串进行比较，如果两者匹配则返回 true，否则返回 false。\n\n#### Java – String equals() 和 equalsIgnoreCase()\
  \ 方法示例\n在本教程中，我们将讨论 `equals()` 和 `equalsIgnoreCase()` 方法。这两个方法都用于比较两个字符串。它们唯一的区别是\
  \ `equals()` 方法在比较时考虑大小写，而 `equalsIgnoreCase()` 方法在比较时忽略大小写。例如，当我们比较字符串“TEXT”和“text”时，`equals()`\
  \ 方法将返回 false，但 `equalsIgnoreCase()` 将返回 true。\n\n* `boolean equals(String str)`：大小写敏感的比较\n\
  * `boolean equalsIgnoreCase(String str)`：大小写不敏感比较\n\n**示例 1：equals()**\n```java\n\
  public class EqualsExample1 {\npublic static void main(String args[]){\nString str1=\
  \ new String (\"Hello\" );\nString str2= new String (\"Hi\" );\nString str3= new\
  \ String (\"Hello\" );\nSystem .out .println(\"str1 equals to str2:\"+str1.equals(str2));\n\
  System .out .println(\"str1 equals to str3:\"+str1.equals(str3));\nSystem .out .println(\"\
  str1 equals to Welcome:\"+str1.equals(\"Welcome\" ));\nSystem .out .println(\"str1\
  \ equals to Hello:\"+str1.equals(\"Hello\" ));\n}}\n```\n输出：\n```\nstr1 equals to\
  \ str2:false\nstr1 equals to str3:true\nstr1 equals to Welcome:false\nstr1 equals\
  \ to Hello:true\n```\n\n**示例 2：equalsIgnoreCase()**\n```java\npublic class EqualsExample2\
  \ {\npublic static void main(String args[]){\nString str1= new String (\"Apple\"\
  \ );\nString str2= new String (\"MANGO\" );\nString str3= new String (\"APPLE\"\
  \ );\nSystem .out .println(\"str1 equals to str2:\"+str1.equalsIgnoreCase(str2));\n\
  System .out .println(\"str1 equals to str3:\"+str1.equalsIgnoreCase(str3));\nSystem\
  \ .out .println(\"str1 equals to Welcome:\"+str1.equalsIgnoreCase(\"Welcome\" ));\n\
  System .out .println(\"str1 equals to Apple:\"+str1.equalsIgnoreCase(\"Apple\"));\n\
  System .out .println(\"str1 equals to mango:\"+str1.equalsIgnoreCase(\"mango\")));\n\
  }}\n```\n输出：\n```\nstr1 equals to str2:false\nstr1 equals to str3:true\nstr1 equals\
  \ to Welcome:false\nstr1 equals to Apple:true\nstr1 equals to mango:true\n```\n\n\
  ### 3) boolean equalsIgnoreCase(String str)\n它与 `equals` 方法工作相同，但在比较字符串时不考虑大小写。它是大小写不敏感比较。\n\
  \n### 4) int compareTo(String str)\n此方法根据每个字符的 Unicode 值比较两个字符串。\n\n#### Java –\
  \ String compareTo() 方法示例\n`compareTo()` 方法用于按字母顺序比较两个字符串。两个字符串的每个字符都转换为 Unicode\
  \ 值进行比较。如果两个字符串相等，则该方法返回 0；如果第一个字符串按字母顺序大于第二个字符串，返回正数；否则返回负数。此方法可以用于：\n* `int compareTo(String\
  \ str)`：这里是字面量之间的比较。例如 `str1.compareTo(str2)`，其中 `str1` 和 `str2` 是字面量。\n* `int compareTo(Object\
  \ obj)`：这是字符串与对象之间的比较。例如 `str1.compareTo(\"Just a String\")`，其中 `str1` 将与指定的字符串进行比较。\n\
  \n**示例：**\n```java\npublic class CompareToExample {\npublic static void main(String\
  \ args[]) {\nString str1 = \"String method\" ;\nString str2 = \"compareTo example\"\
  \ ;\nString str3 = \"String method\" ;\nint var1 = str1.compareTo( str2 );\nSystem\
  \ .out .println(\"str1 & str2 comparison: \" +var1);\nint var2 = str1.compareTo(str3\
  \ );\nSystem .out .println(\"str1 & str3 comparison: \" +var2);\nint var3 = str2.compareTo(\"\
  compareTo example\" );\nSystem .out .println(\"str2 & string argument: \" +var3);\n\
  }}\n```\n输出：\n```\nstr1 & str2 comparison: -1\nstr1 & str3 comparison: 0\nstr2 &\
