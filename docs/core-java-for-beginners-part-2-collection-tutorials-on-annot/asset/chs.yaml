  ## 序列化/同步\n- 序列化 HashMap\n- 同步 HashMap\n\n\n\n\n\n### 1) 如何在 Java 中序列化 HashMap\n\
  \n`HashMap` 类默认是可序列化的，这意味着我们不需要实现 `Serializable` 接口即可使其符合序列化条件。在分享这段完整代码之前，让我先简要介绍一下序列化（Serialization）和反序列化（De-serialization）。\n\
  \n**序列化（Serialization）**：将 `Object` 及其属性和内容写入文件的过程。它在内部将对象转换为字节流。\n\n**反序列化（De-Serialization）**：从文件中读取\
  \ `Object` 及其属性，以及该对象的内容的过程。\n\n#### 示例：HashMap 的序列化\n在下面的类中，我们把 `HashMap` 的内容存储在一个名为\
  \ `hashmap.ser` 的序列化文件中。一旦运行以下代码，它将生成一个 `hashmap.ser` 文件。该文件将在下一个类中用于反序列化。\n\n```java\n\
  package javabook.com;\nimport java.io.*;\nimport java.util.HashMap ;\n\npublic class\
  \ Details{\n    public static void main(String [] args) {\n        HashMap <Integer\
  \ , String > hmap = new HashMap <Integer , String >();\n        //向 HashMap 中添加元素\n\
  \        hmap.put(11 , \"AB\" );\n        hmap.put(2 , \"CD\" );\n        hmap.put(33\
  \ , \"EF\" );\n        hmap.put(9 , \"GH\" );\n        hmap.put(3 , \"IJ\" );\n\
  \        try {\n            FileOutputStream fos =new FileOutputStream ( \"hashmap.ser\"\
  \ );\n            ObjectOutputStream oos = new ObjectOutputStream (fos);\n     \
  \       oos.writeObject(hmap);\n            oos.close();\n            fos.close();\n\
  \            System . out .printf( \"Serialized HashMap data is saved in hashmap.ser\"\
  \ );\n        } catch (IOException ioe) {\n            ioe.printStackTrace();\n\
  \        }\n    }\n}\n```\n**输出**：`Serialized HashMap data is saved in hashmap.ser`\n\
  \n#### 反序列化\n在这里，我们从运行上述代码创建的序列化文件中重现 `HashMap` 对象及其内容。\n\n```java\npackage javabook.com;\n\
  import java.io.*;\nimport java.util.HashMap ;\nimport java.util.Map ;\nimport java.util.Iterator\
  \ ;\nimport java.util.Set ;\n\npublic class Student{\n    public static void main(String\
  \ [] args) {\n        HashMap <Integer , String > map = null ;\n        try {\n\
  \            FileInputStream fis = new FileInputStream (\"hashmap.ser\" );\n   \
  \         ObjectInputStream ois = new ObjectInputStream (fis);\n            map\
  \ = (HashMap ) ois.readObject();\n            ois.close();\n            fis.close();\n\
  \        } catch (IOException ioe) {\n            ioe.printStackTrace();\n     \
  \       return ;\n        } catch (ClassNotFoundException c) {\n            System\
  \ .out .println(\"Class not found\" );\n            c.printStackTrace();\n     \
  \       return ;\n        }\n        System .out .println(\"Deserialized HashMap..\"\
  \ );\n        // 使用 Iterator 显示内容\n        Set set = map.entrySet();\n        Iterator\
  \ iterator = set .iterator();\n        while (iterator.hasNext()) {\n          \
  \  Map .Entry mentry = (Map .Entry )iterator.next();\n            System .out .print\
  \ (\"key: \" + mentry.getKey() + \" & Value: );\n            System .out .println(mentry.getValue());\n\
  \        }\n}\n}\n```\n**输出**：\n`key: 9 & Value : GH`\n`key: 2 & Value : CD`\n`key:\
  \ 11 & Value : AB`\n`key: 33 & Value : EF`\n`key: 3 & Value : IJ`\n\n### 2) 在 Java\
  \ 中同步 HashMap 的方法示例\n\n`HashMap` 是一个非同步的集合类。如果我们需要对它执行线程安全的操作，就必须显式地对其进行同步。在本教程中，我们将学习如何同步\
  \ `HashMap`。\n\n#### 示例\n在这个示例中，我们有一个 `HashMap<Integer, String>`，它包含整数类型的键和 String\
  \ 类型的值。为了对其进行同步，我们使用了 `Collections.synchronizedMap(hashmap)`，它会返回一个由指定的 `HashMap`\
  \ 支持的线程安全的 map。\n\n**下方示例中需要注意的重要点**：即使我们显式地同步了 `HashMap`（如我们在下面的代码中所所示），也应该在同步块中使用\
  \ `Iterator`。\n\n**语法**：\n```java\nMap map = Collections .synchronizedMap(new HashMap\
  \ ());\n...\n// 这不需要在同步块中\nSet set = map.keySet();\n// 对 map 进行同步，而不是对 set\nsynchronized\
  \ (map) {\n    // Iterator 必须在同步块中\n    Iterator iterator = set .iterator();\n \
  \   while (iterator.hasNext()){\n        ...\n    }\n}\n```\n\n#### 完整代码\n```java\n\
  package javabook.com;\nimport java.util.Collections ;\nimport java.util.HashMap\
