  \ , \"Brad\" );\n        hmap.put(4 , \"Sachin\" );\n        hmap.put(88 , \"XYZ\"\
  \ );\n        Map map= Collections .synchronizedMap(hmap);\n        Set set = map.keySet();\n\
  \        synchronized (map) {\n            // Iterator 必须在同步块中\n            Iterator\
  \ iterator = set .iterator();\n            while (iterator.hasNext()){\n       \
  \         Map .Entry mentry = (Map .Entry )iterator.next();\n                System\
