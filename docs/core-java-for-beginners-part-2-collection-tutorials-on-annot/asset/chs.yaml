  }\n```\n**输出：**\nMy thread is in running state.\n\n### 示例程序 2：\n观察此程序的输出，并尝试理解程序中发生了什么。如果你已经理解了每个线程方法的用法，那么理解这个示例时应该应该遇到任何问题。\n\
