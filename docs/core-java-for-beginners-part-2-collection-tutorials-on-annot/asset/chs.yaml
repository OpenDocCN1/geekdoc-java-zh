  \ `%1$`, `%2$... 标识符来指定参数的位置。这里 `%1$` 代表第一个参数，`%2$` 代表第二个，以此类推。\n```java\nclass\
  \ Example {\n  public static void main(String args[]){\n    String str1 = \"cool\
