  After clear, TreeMap: {}\n\n### 1.16 Java 中的 HashSet 类\n\nJava HashSet 类及示例\n\n\
  该类实现了 `Set` 接口，由哈希表（实际上是 `HashMap` 实例）支持。它不保证集合的迭代顺序；特别是，它不保证顺序随时间推移保持不变。该类允许 null\
  \ 元素。该类不是同步的。但是你可以像这样显式地同步它：`Set s = Collections.synchronizedSet(new HashSet(...));`\n\
  关于 HashSet 的注意事项：\n\n\n\n\n\n1. `HashSet` 不维护任何顺序，元素将以随机顺序返回。\n2. `HashSet` 不允许重复元素。如果你尝试向\
  \ `HashSet` 中添加重复元素，旧值将被被覆盖。\n3. `HashSet` 允许 `null` 值，但如果你插入了多个 `null` 值，它仍然只会返回一个\
  \ `null` 值。\n4. `HashSet` 是非同步的。\n5. 此类返回的 `iterator` 是快速失败的（fail-fast），这意味着如果在创建\
  \ `iterator` 后，`HashSet` 被 `iterator` 自身的 `remove` 方法以外的任何方式修改过，`iterator` 将抛出 `ConcurrentModificationException`。\n\
  \n#### HashSet 示例\n\n```java\nimport java.util.HashSet ;\npublic class HashSetExample\
  \ {\n    public static void main(String args[]) {\n        // HashSet declaration\n\
  \        HashSet <String > hset =new HashSet < String>();\n        // Adding elements\
  \ to the HashSeth\n        hset.add(\"Apple\" );\n        hset.add(\"Mango\" );\n\
  \        hset.add(\"Grapes\" );\n        hset.add(\"Banana\" );\n        hset.add(\"\
  Fig\" );\n        // Addition of duplicate elements\n        hset.add(\"Apple\"\
  \ );\n        hset.add(\"Mango\" );\n        // Addition of null values\n      \
  \  hset.add(null );\n        hset.add(null );\n        // Displaying HashSet elements\n\
  \        System .out .println(hset);\n    }\n}\n```\n\n输出:\n`[null , Mango , Grapes\
  \ , Apple , Banana , Fig ]`\n如你所见，输出中不存在所有的重复值，包括重复的 `null` 值。\n\n### 17 个 HashSet\
  \ 教程\n\n* 从 `HashSet` 中删除所有元素\n* 如何遍历 `HashSet`\n* 将 `HashSet` 转换为数组\n* 将 `HashSet`\
  \ 转换为 `TreeSet`\n* 将 `HashSet` 转换为 `List/ArrayList`\n* `HashSet` 对比 `HashMap`\n\
  * `HashSet` 对 `TreeSet`\n\n## HashSet 方法：\n\n1. `boolean add(Element e)`: 它将元素 `e`\
  \ 添加到列表中。\n2. `void clear()`: 它移除列表中所有的元素。\n3. `Object clone()`: 此方法返回 `HashSet`\
  \ 的浅拷贝。\n4. `boolean contains(Object o)`: 它检查指定的对象 `o` 是否存在于列表中。如果找到了对象，则返回 `true`，否则返回\
  \ `false`。\n5. `boolean isEmpty()`: 如果 `Set` 中不存在元素，则返回 `true`。\n6. `int size()`:\
  \ 它给出 `Set` 中元素的数量。\n7. `boolean remove(Object o)`: 它从 `Set` 中移除指定的对象 `o`。\n\n###\
  \ 1) 从 HashSet 中删除所有元素\n在这里我们将看到如何一次性移除 `HashSet` 的所有元素。我们可以通过调用 `HashSet` 类的 `clear()`\
  \ 方法来实现。。\n\n示例：\n```java\nimport java.util.HashSet ;\nclass EmptyHashSetExample\
  \ {\n  public static void main(String [] args) {\n    // Create a HashSet\n    \
  \  HashSet <String > hset = new HashSet < String >();\n    //add elements to HashSet\n\
  \      hset.add(\"Element1\" );\n      hset.add(\"Element2\" );\n      hset.add(\"\
  Element3\" );\n      hset.add(\"Element4\" );\n      hset.add(\"Element5\" );\n\
  \    // Display HashSet elements\n      System .out .println(\"Before: HashSet contains:\
  \ \" + hset);\n    /* public void clear(): It removes all the elements\n      *\
  \ from HashSet. The set becomes empty after this\n      * method gets called.\n\
  \      */\n      hset.clear();\n    // Display HashSet content again\n      System\
  \ .out .println(\"After: HashSet contains: \" + hset);\n  }\n}\n```\n输出：\n`Before\
  \ : HashSet contains: [Element1 , Element2 , Element3 , Element4 , Element5 ]`\n\
  `After : HashSet contains: []`\n\n### 2) 如何遍历 Set/HashSet\n遍历 `HashSet` 有以下两种方式：\n\
  1) 使用 `Iterator`\n2) 不使用 `Iterator`\n\n示例示例 1：使用 Iterator\n```java\nimport java.util.HashSet\
  \ ;\nimport java.util.Iterator ;\nclass IterateHashSet {\n    public static void\
  \ main(String [] args) {\n        // Create a HashSet\n        HashSet <String >\
  \ hset = new HashSet < String >();\n        //add elements to HashSeth\n       \
  \ hset.add(\"Chandru\" );\n        hset.add(\"Rahul\" );\n        hset.add(\"Tomy\"\
  \ );\n        hset.add(\"Rick\" );\n        hset.add(\"Hari\" );\n        Iterator\
  \ <String > it = hset.iterator();\n        while (it.hasNext()){\n            System\
  \ .out .println(it.next ());\n        }\n    }\n}\n```\n输出：\n`Chandru`\n`Rick`\n\
  `Hari`\n`Rahul`\n`Tomy`\n\n示例 2：不使用 Iterator 遍历\n```java\nimport java.util.HashSet\
  \ ;\nimport java.util.Set ;\nclass IterateHashSet {\n  public static void main(String\
  \ [] args) {\n    // Create a HashSet\n      Set <String > hset = new HashSet <\
  \ String >();\n    //add elements to HashSet\n      hset.add(\"Chandru\" );\n  \
  \    hset.add(\"Rahul\" );\n      hset.add(\"Tomy\" );\n      for (String temp :\
  \ hset) {\n          System .out .println(temp);\n      }\n  }\n}\n```\n输出：\n`Chandru`\n\
  `Rahul`\n`Tomy`\n\n### 3) 将 HashSet 转换为数组\n这里是将 `HashSet` 转换为数组的代码。\n\n```java\n\
