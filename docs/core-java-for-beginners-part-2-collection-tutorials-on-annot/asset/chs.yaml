  ```由于 HashMap 中有 5 个键值对，`size()` 方法返回数字 5。此外，在上面的示例中我们使用了 Integer 键和 String 值，如果你需要，可以这样更改泛型：`HashMap<String,\
  \ String> hashmap = new HashMap<String, String>();`。如果你有 String 键和值，请这样添加键值对：`hashmap.put(\"\
  11\", \"Value1\");`。\n\n### 5) Java – 从 HashMap 移除映射的示例\n\n在此示例中，我们将学习如何使用键值对的值从\
