  在此示例中，我们将看到 `TreeSet` 示例以及 `TreeSet `。\n\n### 1.19 Java 中的 LinkedHashMap\n`LinkedHashMap`\
  \ 是哈希表和链表的实现，具有可预测的迭代顺序。这种实现与 `HashMap` 的不同在于它维护了一个贯穿所有条目的双链表。\n\n- `HashMap` 不维护任何顺序。\n\
  - `TreeMap` 按键的升序排序。\n- `LinkedHashMap` 维护插入顺序。\n\n让我们通过示例来理解 `LinkedHashMap`：\n\
  \n```java\nimport java.util.LinkedHashMap ;\nimport java.util.Set ;\nimport java.util.Iterator\
  \ ;\nimport java.util.Map ;\npublic class LinkedHashMapDemo {\n    public static\
  \ void main(String args[]) {\n        // HashMap 声明\n        LinkedHashMap <Integer\
  \ , String > lhmap =new LinkedHashMap < Integer , String >();\n        // 向 LinkedHashMap\
  \ 添加元素\n        lhmap.put(22 , \"Abey\" );\n        lhmap.put(33 , \"Dawn\" );\n\
  \        lhmap.put(1 , \"Sherry\" );\n        lhmap.put(2 , \"Karon\" );\n     \
  \   lhmap.put(100 , \"Jim\" );\n        // 生成条目的 Set\n        Set set = lhmap.entrySet();\n\
  \        // 显示 LinkedHashMap 的元素\n        Iterator iterator = set .iterator();\n\
  \        while (iterator.hasNext()) {\n            Map . Entry me = ( Map . Entry\
  \ )iterator. next ();\n            System .out . print ( \"Key is: \" + me.getKey()\
  \ +\"& Value is: \" +me.getValue()+ \"\\n\" );\n        }\n    }\n}\n```\n输出:\n\
  `Key is : 22 & Value is : Abey`\n`Key is : 33 & Value is : Dawn`\n`Key is : 1 &\
  \ Value is : Sherry`\n`Key is : 2 & Value is : Karon`\n`Key is : 100 & Value is\
  \ : Jim`\n`你可以看到值是按照它们插入的顺序返回的。\n\n### 1.20 Java 中的 LinkedHashSet 类\nLinkedHashSet\
  \ 类及及示例\n之前我们分享了 `HashSet` 和 `TreeSet` 的教程。`LinkedHashSet` 也是 `Set` 接口的一种实现，它与 `HashSet`\
  \ 和 `TreeSet` 相似，但有以下不同点：\n\n- `HashSet` 不维护元素的任何顺序。\n- `TreeSet` 按升序排序元素。\n- `LinkedHashSet`\
  \ 维护插入顺序。元素按照它们被添加到 `Set` 的顺序进行排序。\n\n\n\n\n\n#### 示例\n\n```java\nimport java.util.LinkedHashSet;\n\
  public class LinkedHashSetExample {\n    public static void main(String args[])\
  \ {\n        // String 类型的 LinkedHashSet\n        LinkedHashSet<String> lhset =\
  \ new LinkedHashSet<String>();\n        // 向 LinkedHashSet 添加元素\n        lhset.add(\"\
  Z\");\n        lhset.add(\"PQ\");\n        lhset.add(\"N\");\n        lhset.add(\"\
  O\");\n        lhset.add(\"KK\");\n        lhset.add(\"FGH\");\n        System.out.println(lhset);\n\
  \        // Integer 类型的 LinkedHashSet\n        LinkedHashSet<Integer> lhset2 = new\
  \ LinkedHashSet<Integer>();\n        // 添加元素\n        lhset2.add(99);\n        lhset2.add(7);\n\
  \        lhset2.add(0);\n        lhset2.add(67);\n        lhset2.add(89);\n    \
  \    lhset2.add(66);\n        System.out.println(lhset2);\n    }\n}\n```\n输出:\n\
  `[Z, PQ, N, O, KK, FGH]`\n`[99, 7, 0, 67, 89, 66]`\n\n## 1.21 Java 中的 Hashtable\n\
  \n### 带有示例的 Java Hashtable\n该类实现了一个哈希表，它将键映射到值。任何非空对象都可以作为键或值。`Hashtable` 与 `HashMap`\
  \ 相似，不同在于它是同步的。\n\n```java\nimport java.util.Hashtable;\nimport java.util.Enumeration;\n\
  public class HashtableExample {\n    public static void main(String[] args) {\n\
  \        Enumeration names;\n        String key;\n        // 创建一个 Hashtable\n  \
  \      Hashtable<String, String> hashtable = new Hashtable<String, String>();\n\
  \        // 向 Hashtable 添加键值对\n        hashtable.put(\"Key1\", \"Chandru\");\n \
  \       hashtable.put(\"Key2\", \"Ajith\");\n        hashtable.put(\"Key3\", \"\
  Peter\");\n        hashtable.put(\"Key4\", \"Ricky\");\n        hashtable.put(\"\
  Key5\", \"Mona\");\n        names = hashtable.keys();\n        while (names.hasMoreElements())\
  \ {\n            key = (String) names.nextElement();\n            System.out.println(\"\
  Key: \" + key + \" & Value: \" + hashtable.get(key));\n        }\n    }\n}\n```\n\
  输出:\n`Key : Key4 & Value : Ricky`\n`Key : Key3 & Value : Peter`\n`Key : Key2 & Value\
  \ : Ajith`\n`Key : Key1 & Value : Chandru`\n`Key : Key5 & Value : Mona`\n\n### 1.21.1\
  \ Hashtable 类的方法\n1. `void clear()`: 从 `Hashtable` 中移除所有键值映射并使其为空。清空此哈希表，使其不包含任何键。\n\
  2. `Object clone()`: 创建此哈希表的浅拷贝。复制哈希表本身的整个结构，但不克隆键和值。这是一项开销较大的操作。\n3. `boolean contains(Object\
  \ value)`: 测试此哈希表中是否有某个键映射到指定的值。此操作比 `containsKey` 方法开销更大。注意，该方法的功能与 `containsValue`\
  \ 相同（它是集合框架中 `Map` 接口的一部分）。\n4. `boolean isEmpty()`: 测试此哈希表是否没有键映射到值。\n5. `Enumeration\
  \ keys()`: 返回哈希表中包含的键的枚举器。\n6. `Object put(Object key, Object value)`: 将指定的键映射到此哈希表中指定的值。\n\
  7. `void rehash()`: 增加哈希表的大小并重新哈希其所有键。\n8. `Object remove(Object key)`: 从此哈希表中移除键及其对应的值。\n\
  9. `int size()`: 返回 `Hashtable` 中存在的键值映射的数量。\n10. `String toString()`: 返回哈希表的字符串表示。\n\
  11. `boolean containsKey(Object key)`: 测试指定的对象是否为哈希表的键。\n12. `boolean containsValue(Object\
  \ value)`: 测试指定的对象是否为哈希表的值。如果哈希表中存在等于 `value` 的值则返回 true，否则返回 false。\n13. `Enumeration\
  \ elements()`: 返回哈希表中包含的值枚举器。\n14. `Object get(Object key)`: 返回指定的键映射的值，如果 map 中没有该映射则返回\
  \ null。\n\n## 1.22 Hashtable 教程\n\n### 如何在 Java 中排序 Hashtable\n`Hashtable` 不保留插入顺序，这意味着无论你插入什么键和值，结果都不会按照特定顺序排列。使用\
  \ `Collections.list` 和 `Collections.sort` 排序 `Hashtable` 的方法是使用 `LinkedHashMap`\
  \ 或 `TreeMap`。\n- 使用 `LinkedHashMap`: 当你想保留插入顺序时。\n- 使用 `TreeMap`: 当你想根据键进行排序时。\n\
  \n#### 使用 LinkedHashMap\n```java\nimport java.util.*;\npublic class LinkedHashMapDemo\
  \ {\n    public static void main(String args[]) {\n        LinkedHashMap<Integer,\
  \ String> lhm = new LinkedHashMap<>();\n        lhm.put(10, \"Chandru\");\n    \
  \    lhm.put(1, \"Ajith\");\n        lhm.put(11, \"Test\");\n        lhm.put(9,\
  \ \"Demo\");\n        lhm.put(3, \"Anuj\");\n        // 获取键值对集合\n        Set<Map.Entry<Integer,\
  \ String>> set = lhm.entrySet();\n        // 获取迭代器\n        Iterator<Map.Entry<Integer,\
  \ String>> i = set.iterator();\n        // 显示元素\n        while (i.hasNext()) {\n\
  \            Map.Entry<Integer, String> me = i.next();\n            System.out.print(me.getKey()\
  \ + \": \");\n        }\n    }\n}\n```\n输出:\n`10 : 1 : 11 : 9 : 3 : ` (注：保持了插入顺序)\n\
  \n#### 使用 TreeMap\n```java\nimport java.util.*;\npublic class TreeMapDemo {\n  \
  \  public static void main(String args[]) {\n        TreeMap<Integer, String> tm\
  \ = new TreeMap<>();\n        tm.put(10, \"Chandru\");\n        tm.put(1, \"Ajith\"\
  );\n        tm.put(11, \"Test\");\n        tm.put(9, \"Demo\");\n        tm.put(3,\
  \ \"Anuj\");\n        // 获取键值对集合\n        Set<Map.Entry<Integer, String>> set =\
  \ tm.entrySet();\n        // 获取迭代器\n        Iterator<Map.Entry<Integer, String>>\
  \ i = set.iterator();\n        // 显示元素\n        while (i.hasNext()) {\n        \
  \    Map.Entry<Integer, String> me = i.next();\n            System.out.print(me.getKey()\
  \ + \": \");\n        }\n    }\n}\n```\n输出:\n`1 : 3 : 9 : 10 : 11 : ` (注：按键自然排序)\n\
  \n### Hashtable 迭代器示例\n以下程序使用了 `Hashtable` 类和 `Iterator` 接口的方法。\n```java\nimport\
  \ java.util.Hashtable;\nimport java.util.Set;\nimport java.util.Iterator;\npublic\
  \ class IterateHashtable {\n    public static void main(String args[]) {\n     \
  \   String str;\n        // 创建一个 Hashtable 实例\n        Hashtable<String, String>\
  \ hashtable = new Hashtable<String, String>();\n        // 向 Hashtable 添加键值对\n \
  \       hashtable.put(\"A\", \"Apple\");\n        hashtable.put(\"B\", \"Orange\"\
  );\n        hashtable.put(\"C\", \"Mango\");\n        hashtable.put(\"D\", \"Banana\"\
  );\n        hashtable.put(\"E\", \"Grapes\");\n        System.out.println(\"Hashtable\
  \ contains:\");\n        Set<String> keys = hashtable.keySet();\n        // 获取键集合的迭代器\n\
  \        Iterator<String> itr = keys.iterator();\n        // 显示键值对\n        while\
  \ (itr.hasNext()) {\n            // 获取键\n            str = itr.next();\n       \
  \     System.out.println(\"Key: \" + str + \" & Value: \" + hashtable.get(str));\n\
  \        }\n    }\n}\n```\n\n### Hashtable 中键与值的检查示例\n在此示例中，我们将学习如何检查 `Hashtable`\
  \ 中键和值是否存在。我们将使用以下两个方法来执行检查：\n- `containsKey(Object key)`: 检查键是否存在于 `Hashtable`。\n\
  - `containsValue(Object value)`: 检查值是否存在于 `Hashtable`。\n```java\nimport java.util.Hashtable;\n\
  public class CheckKeyValueExample {\n    public static void main(String args[])\
