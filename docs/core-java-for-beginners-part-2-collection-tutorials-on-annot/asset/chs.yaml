  \ regex, int limit)\n它分割字符串并返回匹配给定正则表达式的子字符串数组。`limit` 是阈值。\n\n#### Java – split()\
  \ 方法示例\n`split()` 方法用于根据指定的分隔符分割字符串。该方法有多种变体：\n* `String[] split(String regex)`：从指定的分隔符开始到字符串末尾的子字符串。如果\
  \ `limit` 大于等于字符串长度，则返回所有子字符串。\n* `String[] split(String regex, int limit)`：通过 `limit`\
  \ 限制返回的子字符串数量。如果 `limit` 为负数，则返回尽可能多的子字符串；如果 `limit` 为 0，则丢弃末尾的空字符串；如果 `limit` 为正数，则最多返回\
  \ `limit` 个子字符串。\n\n**让我们通过一个示例来帮助理解这一点：**\n```java\nString s=\"bbaaccaa\" ;\nString\
  \ arr1[]= s.split(\"a\" , -1 );\nString arr2[]= s.split(\"a\" , 0 );\n```\n在这种情况下，`arr1`\
  \ 将包含 {\"bb\", \" \", \"cc\", \" \", \" \"}而 `arr2` 将包含 {\"bb\", \" \", \"cc\"}\
  \ 因为限制为 0 会排除末尾的空字符串。\n\n### 29) String[] split(String regex)\n与 `split(String regex,\
  \ int limit)` 方法相同，但它没有阈值限制。\n\n### 30) String toLowerCase(Locale locale)\n根据指定的\
