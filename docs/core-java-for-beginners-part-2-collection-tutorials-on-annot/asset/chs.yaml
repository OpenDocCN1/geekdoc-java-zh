  \ Date: \" + sdf2.format(file.lastModified()));`\n输出：Last Modified Date : 01-03-14\
  \ PM\n\n## 5.9 Java 中使文件只读\n在 Java 中将文件设置为只读很容易。在本教程中，我们将学习三点：\n1. 如何将文件设置为只读\n\
  2. 如何检查现有文件是否处于只读模式\n3. 如何在 Java 中让只读文件变为可写\n\n### 1) 将文件设置为只读\n为了将文件只读，可以使用 `setReadOnly()`\
  \ 方法。该方法在文件成功设置为只读时返回 true，否则返回 false。我们可以通过 `setReadOnly()` 方法来验证文件是否是只读。\n```java\n\
  import java.io.File ;\nimport java.io.IOException ;\npublic class ReadOnlyExample\
  \ {\n    public static void main(String [] args){\n        try {\n            File\
  \ file = new File (\"C:\\\\newfile.txt\" );\n            // 将文件设置为只读\n         \
  \   boolean flag = file.setReadOnly();\n            if (flag){\n               \
  \ System.out.println(\"File has been created successfully\" );\n            }\n\
  \            else {\n                System.out.println(\"File already present at\
  \ location\" );\n            }\n        } catch (IOException e) {\n            System.out.println(\"\
  Exception Occurred:\" );\n            e.printStackTrace();\n        }\n    }\n}\n\
  ```\n只：：\n\n### 2) 检查文件是否可写\n为了检查文件是否处于只读模式，可以使用 `canWrite()` 方法。该方法在文件是可写的时返回 true，否则返回\
  \ false。\n```java\nimport java.io.File ;\nimport java.io.IOException ;\npublic class\
  \ CheckAttributes{\n    public static void main(String [] args){\n        File file\
  \ = new File (\"C:\\\\newfile.txt\" );\n        // 检查文件是否可写\n        if (file.canWrite())\
  \ {\n            System.out.println(\"File is writable.\" );\n        } else {\n\
  \            System.out.println(\"File is read only.\" );\n        }\n    }\n}\n\
  \n### 3) 在 Java 中让只读文件变为可写\n为了让只读文件变为可写，可以使用 `setWritable(boolean)` 方法。该方法在文件被设置为可写时返回\
  \ true，否则返回 false。\n```java\nimport java.io.File ;\nimport java.io.IOException ;\n\
  public class MakeWritable{\n    public static void main(String [] args) {\n    \
  \    File file = new File (\"C:\\\\newfile.txt\" );\n        // 将文件设置为可写\n     \
  \   boolean flag = file.setWritable(true);\n        if (flag){\n            System.out.println(\"\
  File has been created successfully\" );\n        } else {\n            System.out.println(\"\
  File already present at location\" );\n        }\n    }\n}\n```\n\n\n\n\n## Java\n\
  \n## Java 中的 for 循环\n## Java – while 循环\n\n\n\n\n# 示例：使用 for 循环查找阶乘\n\n```java\n\
