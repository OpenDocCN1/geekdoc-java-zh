  \ over\n```\n\n\n\n\n\n## 同步\n\n```\nSynchronized (object ){//要同步的语句}\n```\n\n###\
  \ 线程间通信\nJava 线程之间通过极少数的方法进行相互通信。这些方法是 `wait()`、`notify()`、`notifyAll()`。所有这些方法都只能在\
  \ `synchronized` 方法内部调用。\n\n1. 为了理解同步，Java 有一个 `monitor`（监视器）的概念。`Monitor` 可以被认为只能容纳一个线程的盒子。一旦某个线程进入\
  \ monitor 器，所有其他线程都必须等待直到该线程退出 monitor 器。\n2. `wait()` 通知调用线程放弃 monitor 器并进入睡眠，直到其他线程进入同一个\
  \ monitor 器并调用 `notify()`。\n3. `notify()` 唤醒在同一对象上调用 `wait()` 的第一个线程。`notifyAll()`\
  \ 唤醒所有在同一对象上调用 `wait()` 的线程。优先级最高的线程首先运行。\n\n## 3.5 Java 序列化\n### 什么是 Java 序列化？\n\
  序列化是一种将对象转换为字节流的机制，以便将其写入文件、通过网络传输或存储到数据库中。反序列化则是相反的过程。简单来说，序列化是将对象转换为字节流，而反序列化是从字节流重建对象。Java\
  \ 序列化 API 提供了执行序列化和反序列化的功能。类必须实现 `java.io.Serializable` 接口才有资格序列化。\n\n让我们通过一个例子来更好地理解这些概念：\n\
  ### 示例：\n该类实现了 `Serializable` 接口，这意味着它可以被序列化。该类的所有字段在转换为字节流后都可以写入文件，但声明为 `transient`\
  \ 的字段除外。在下面的示例中，我们有两个 `transient` 字段，这些字段将不参与序列化。\n\n`Student.java`\n```java\npublic\
  \ class Student implements java.io.Serializable {\n    private int stuRollNum;\n\
  \    private int stuAge;\n    private String stuName;\n    private transient String\
  \ stuAddress;\n    private transient int stuHeight;\n    public Student (int roll,\
  \ int age, String name,String address, int height) {\n        this .stuRollNum =\
  \ roll;\n        this .stuAge = age;\n        this .stuName = name;\n        this\
  \ .stuAddress = address;\n        this .stuHeight = height;\n    }\n    public int\
  \ getStuRollNum() {return stuRollNum;}\n    public void setStuRollNum(int stuRollNum)\
  \ { this .stuRollNum = stuRollNum; }\n    public int getStuAge() {return stuAge;}\n\
  \    public void setStuAge(int stuAge) { this .stuAge = stuAge; }\n    public String\
  \ getStuName() {return stuName;}\n    public void setStuName(String stuName) { this\
  \ .stuName = stuName; }\n    public String getStuAddress() {return stuAddress;}\n\
  \    public void setStuAddress(String stuAddress) { this .stuAddress = stuAddress;\
  \ }\n    public int getStuHeight() {return stuHeight;}\n    public void setStuHeight(int\
  \ stuHeight) { this .stuHeight = stuHeight;}}\n}\n```\n\n### 3.5.1 对象的序列化\n该类将 `Student`\
  \ 类的对象写入 `Student.ser` 文件。我们使用 `FileOutputStream` 和 `ObjectOutputStream` 将对象写入文件。\n\
  注意：根据 Java 序列化的最佳实践，文件名应该具有 `.ser` 扩展名。\n\n```java\nimport java.io.FileOutputStream\
  \ ;\nimport java.io.ObjectOutputStream ;\nimport java.io.IOException ;\npublic class\
  \ SendClass{\n    public static void main(String args[]){\n        Student obj =\
  \ new Student (101 , 25 , \"Chaitanya\" , \"Agra\" , 6 );\n        try {\n     \
  \       FileOutputStream fos = new FileOutputStream (\"Student.ser\" );\n      \
  \      ObjectOutputStream oos = new ObjectOutputStream (fos);\n            oos.writeObject(obj);\n\
  \            oos.close();\n            fos.close();\n            System .out .println(\"\
  Serialzation Done!!\" );\n        }catch(IOException ioe){\n            System .out\
  \ .println(ioe);\n        }\n    }\n}\n```\n输出：\n`Serialzation Done !!`\n\n### 3.5.2\
  \ 对象的反序列化\n该类从文件中读取字节流后重建 `Student` 类的对象。观察该类的输出，学生地址和身高字段连续地拥有 `null` 和 `0` 值。这是因为这些字段在\
  \ `Student` 类中被声明为 `transient`。\n\n```java\nimport java.io.FileInputStream ;\nimport\
  \ java.io.ObjectInputStream ;\nimport java.io.IOException ;\npublic class AcceptClass\
  \ {\n    public static void main(String args[]){\n        Student o=null ;\n   \
  \     try {\n            FileInputStream fis = new FileInputStream (\"Student.ser\"\
  \ );\n            ObjectInputStream ois = new ObjectInputStream (fis);\n       \
  \     o = (Student )ois.readObject();\n            ois.close();\n            fis.close();\n\
  \        }catch(IOException ioe){\n            ioe.printStackTrace();\n        \
  \    return ;\n        }catch(ClassNotFoundException cnfe){\n            System\
  \ .out .println(\"Student Class is not found.\" );\n            cnfe.printStackTrace();\n\
  \            return ;\n        }\n        System .out .println(\"Student Name:\"\
  +o.getStuName());\n        System .out .println(\"Student Age:\"+o.getStuAge());\n\
  \        System .out .println(\"Student Roll No:\"+o.getStuRollNum());\n       \
  \ System .out .println(\"Student Address:\"+o.getStuAddress());\n        System\
  \ .out .println(\"Student Height:\"+o.getStuHeight());\n    }\n}\n```\n输出：\n`Student\
  \ Name:Chandru`\n`Student Age:25`\n`Student Roll No:101`\n`Student Address:null`\n\
  `Student Height:0`\n\n## 3.6 Java AWT 教程\nAWT 代表 Abstract Window Toolkit（抽象窗口工具包），用于为\
  \ Java 创建图形用户界面（GUI）。\n\n### 为什么 AWT 是平台依赖的？\nAWT 调用操作系统的原生程序来创建如文本框、复选框等组件。在 Windows、Mac\
  \ 和 Unix 等平台之间，AWT 按钮具有不同的外观和感觉，这是因为它们调用不同的原生程序。简单来说，基于 AWT 的应用程序在 Windows 上运行时看起来像\
  \ Windows 应用，在 Mac 上运行时看起来像 Mac 应用。\n\nAWT 现在很少使用，因为它具有平台依赖性和重量级的特性。AWT 组件是由底层操作系统生成的。例如，如果你在\
  \ AWT 中实例化文本框，你实际上是在请求操作系统创建一个文本框。\n\nSwing 是基于 AWT 构建的，它是平台无关且轻量级的。相比 AWT，Swing\
  \ 提供了更强大且灵活的组件。除了熟悉的按钮和标签，Swing 还提供了许多高级组件，如标签页面板、滚动面板、树形和列表。我们将在后续教程中讨论 Swing。\n\
  \n### 组件和容器\n按钮、文本字段、滚动条等所有元素被称为组件。在 AWT 中，每个组件都有对应的类。为了将它们放置在屏幕上的特定位置，我们需要容器。容器包含并控制组件的布局。\n\
  \n### 容器的类型：\n如上，容器是放置文本字段、按钮、复选框等的地方。AWT 有四种容器：Window、Frame、Dialog 和 Panel。如所示，Frame\
  \ 和 Dialog 是 Window 的子类。\n\n- **Window**：Window 类实例没有边界和标题。\n- **Dialog**：Dialog\
  \ 类具有边界和标题。Dialog 类实例不能没有关联的 Frame 类。\n- **Panel**：Panel 不包含标题栏、菜单栏或边界。它是存放组件的通用容器。\n\
  - **Frame**：Frame 有标题、边界和菜单栏。它可以包含按钮、文本字段等多个组件。这是开发 AWT 应用时广泛使用的容器。\n\n### Java\
  \ AWT 示例\n我们可以通过两种方式使用 Frame 创建 GUI：\n1) 继承 Frame 类\n2) 创建 Frame 的实例\n让我们看看每一个示例。\n\
  \n#### AWT 示例 1：通过扩展类创建 Frame\n```java\nimport java.awt.*;\n/* 我们在这里扩展了 Frame 类，\n\
  * 因此我们的 \"SimpleExample\" 类将像 Frame 一样运行 */\npublic class SimpleExample extends\
  \ Frame {\n    SimpleExample (){\n        Button b=new Button (\"Button!!\"); //\
  \ 在屏幕上设置按钮\n        b.setBounds(50 ,50 ,50 );\n        // 将按钮添加到 frame\n       \
  \ add(b);\n        // 设置 Frame 的宽度和高度\n        setSize(500 ,300 );\n        // 设置\
  \ Frame 的标题\n        setTitle(\"This is my First AWT example\" );\n        // 设置\
  \ Frame 的布局\n        setLayout(new FlowLayout ());\n        /* 默认情况下 frame 是不可见的，\n\
  * 所以我们将可见性设置为 true\n* 使其可见 */\n        setVisible(true );\n    }\n    public static\
  \ void main(String args[]){\n        // 创建 Frame 的实例\n        SimpleExample fr=new\
  \ SimpleExample ();\n    }\n}\n```\n输出： \n\n#### AWT 示例 2：通过创建 Frame 类实例创建 Frame\n\
  ```java\nimport java.awt.*;\npublic class Example2 {\n    Example2 (){\n       \
  \ // 创建 Frame\n        Frame fr=new Frame ();\n        // 创建标签\n        Label lb\
  \ = new Label (\"UserId: \" // 将标签添加到 frame\n        fr.add(lb);\n        // 创建文本字段\n\
  \        TextField t = new TextField ();// 将文本字段添加到 frame\n        fr.add(t);\n\
  \        // 设置 frame 大小\n        fr.setSize(500 , 300 );\n        // 设置 Frame 的布局\n\
  \        fr.setLayout(new FlowLayout ());\n        fr.setVisible(true );\n    }\n\
  \    public static void main(String args[]){\n        Example2 ex = new Example2\
  \ ();\n    }\n}\n```\n\n## 3.7 Java Swing 教程\nSwing 是 Java Foundation（JFC）的一部分，JFC\
  \ 的其他部分是 java2D 和抽象窗口工具包（AWT）。AWT、Swing 和 Java 2D 用于在 Java 中构建图形用户界面（GUI）。在本教程中，我们将主要讨论\
  \ Swing API，它用于在 AWT 之上构建 GUI，并且比 AWT 要轻量得多。\n\n### 示例：\n在下面的示例中，我们将使用许多你到为止还没有学过的\
  \ Swing 组件。我们将在后续教程中详细讨论每一个。下面的 Swing 程序创建一个登录界面。\n\n```java\nimport javax.swing.JButton\
  \ ;\nimport javax.swing.JFrame ;\nimport javax.swing.JLabel ;\nimport javax.swing.JPanel\
  \ ;\nimport javax.swing.JPasswordField ;\nimport javax.swing.JTextField ;\npublic\
  \ class SwingFirstExample {\n    public static void main(String [] args) {\n   \
  \     // 创建 JFrame 实例\n        JFrame frame = new JFrame (\"My First Swing \");\n\
  \        // 设置 frame 的宽度和高度\n        frame.setSize(350 ,200 );\n        frame.setDefaultCloseOperation(JFrame\
  \ .EXIT_ON_CLOSE);/* 创建面板。这与 HTML 标签相同，\n* 我们可以创建多个面板并将它们添加到特定位置。在面板内部可以添加字段、按钮和其他组件。*/\n\
  \        JPanel panel = new JPanel (); 将面板添加到 frame\n        /* 调用定义方法将组件添加到面板。*/\n\
  \        placeComponents(panel);\n        // 设置 frame 的可见性为 true\n        frame.setVisible(true\
  \ );\n    }\n    private static void placeComponents(JPanel panel) {\n        /*\
  \ 我们将在教程的后续部分讨论布局。\n* 现在我们设置布局为 null */\n        panel.setLayout(null ); 创建 JLabel\n\
  \        JLabel userLabel = new JLabel (\"User\" );/* 指定位置和大小，\n* 这里 (x,y) 是顶部的坐标，剩余两个参数是宽度和高度。*/\n\
  \        userLabel.setBounds(20 ,80 ,25 );panel.add(userLabel);// 创建文本字段，用户在此处输入名称。\n\
  \        JTextField userText = new JTextField (20 );userText.setBounds(100 ,20 ,165\
  \ );panel.add(userText); 创建密码 label\n        JLabel passwordLabel = new JLabel (\"\
  Password\" );/* 类似于文本字段，但它隐藏了输入的数据，并在 GUI 上显示为点。*/\n        passwordLabel.setBounds(50\
  \ ,80 ,25 );panel.add(passwordLabel);/* 类似于登录屏幕的。*/\n        PasswordField passwordText\
  \ = new JPasswordField (20 );passwordText.setBounds(100 ,50 ,165 );panel.add(passwordText);//\
  \ 创建登录按钮\n        JButton loginButton = new JButton (\"login\" );loginButton.setBounds(10\
  \ ,80 ,25 );panel.add(loginButton);\n    }\n}\n```\n\n- **JFrame**：frame 是 JFrame\
  \ 的实例。Frame 是一个带有标题、边界、按钮、字段和其他组件的窗口。Swing 应用必须有一个 frame 才能添加组件。\n- **JPanel**：panel\
  \ 是 JPanel 的实例。frame 可以有多个面板，每个面板可以有多个组件。面板用于分组组件并放置在 frame 中的合适位置。\n- **JLabel**：label\
  \ 是 JLabel 的实例。label 是不可选择的文本和图像。如果你想在 frame 上显示字符串或图像，可以使用标签。在上面的示例中，我们在文本字段之前显示“User”和“Password”，是通过创建并添加标签实现的。\n\
  - **JTextField**：用于捕捉用户输入，这些是用户输入数据的框。\n- **JPasswordField**：类似于文本字段，但输入的数据隐藏并在\
  \ GUI 上显示为点。\n- **JButton**：按钮是 JButton 的实例。在上面的示例中我们有一个“Login”按钮。\n\n### 3.8 自动装箱和拆箱\n\
  ### 自动装箱和拆箱示例\nJava 1.5 引入了基本类型到相应包装类及其反之的自动转换特殊功能。\n\n- **自动装箱**：基本类型到包装类对象的自动转换称为自动装箱。例如——`int`\
  \ 到 `Integer`，`long` 到 `Long`，`double` 到 `Double`。\n- **拆箱**：自动装箱的相反过程。将包装类对象自动转换为对应的基本类型称为拆箱。例如——`Integer`\
  \ 到 `int`，`Long` 到 `long`，`Double` 到 `double`。\n\n| 基本类型 | 包装类 |\n| :--- | :---\
  \ |\n| boolean | `Boolean` |\n| byte | `Byte` |\n| char | `Character` |\n| float\
  \ | `Float` |\n| int | `Integer` |\n| long | `Long` |\n| short | `Short` |\n| double\
  \ | `Double` |\n\n### Java 中何时发生自动装箱和拆箱\n#### 自动装箱：\n让我们通过几个示例来看发生自动装箱的情况。\n\n####\
  \ 情况 1：当方法期望包装类对象但作为参数传递的值是基本类型时。例如在下面的代码中，`myMethod()` 方法期望一个 `Integer` 包装类对象，但我们传递了一个基本类型\
  \ `int` 类型。由于编译器执行自动装箱（`int` 到 `Integer`），程序运行正常。\n\n```java\nclass AutoboxingExample1{\n\
  \    public static void myMethod(Integer num){\n        System .out .println(num);\n\
  \    }\n    public static void main(String [] args){//传递了 int (基本类型)，它会在运行时\n* 转换为\
  \ Integer 对象*/\n        myMethod(2 );\n    }\n}\n```\n输出：`2`\n\n#### 情况 2：当在某个时刻，你将基本类型值赋值给包装类对象时。例如：下面的语句是有效的，因为编译器执行自动装箱。\n\
  ```java\nInteger inum = 3 ; // int 到 Integer：自动装箱\nLong lnum = 32L ; // long 到 Long：自动装箱\n\
  ```\n\n#### 情况 3：处理集合框架类时：\n```java\nArrayList <Integer > arrayList = new ArrayList\
  \ <Integer>();\narrayList.add(1 ); //自动装箱 - int 到 Integer\narrayList.add(2 ); //自动装箱\
  \ - int 到 Integer\n```\n\n\n\n\n\n| 原生类型 | 包装类 |\n| :--- | :--- |\n| BooleanCharByteIntLongFloatdouble\
  \ | BooleanCharacterByteShortIntegerLongFloatDouble |\n\n\n\n\n# 为什么在 Java 中我们需要包装类\
  \ (wrapper class)？\n\n正如我上面提到的，我们需要包装类的原因之一是在集合 API 中使用它们。另一方面，包装对象占据的内存比基本类型要多得多。因此，当你需要效率时，使用基本类型；当你需要对象而不是基本类型时，使用包装类。\n\
  \n基本数据类型不是对象，因此它们不属于任何类。在存储于只支持对象的数据结构中时，需要先将基本类型转换为对象，我们可以通过使用包装类来实现。\n\n示例：`HashMap<Integer,\
  \ String> hm = new HashMap<Integer, String>();`\n\n因此，为了类型安全，我们使用包装类。这样我们就能确保此 `HashMap`\
  \ 的键将是 `integer` 类型，值将是 `string` 类型。\n\n## 2. 包装类对象允许 null 值，而基本数据类型不允许。。\n\n让我们通过几个例子来理解转换是如何运作的：\n\
  \n### 包装类示例 1：将基本类型转换为包装对象\n```java\npublic class JavaExample {\n    public static\
  \ void main(String args[]){\n        //将 int 基本类型转换为 Integer 对象\n        int num=100\
  \ ;\n        Integer obj=Integer.valueOf(num);\n        System.out.println(num+\
  \ \" \" + obj);\n    }\n}\n```\n输出：100 100\n如你所示，基本数据类型和对象具有相同的值。在任何需要传递 `num` 的值作为对象传递，你可以用\
  \ `obj` 代替 `num`。\n\n### 包装类示例 2：将包装类对象转换为基本类型\n```java\npublic class JavaExample\
  \ {\n    public static void main(String args[]){\n        //创建包装类对象\n        Integer\
  \ obj = new Integer (100 );\n        //将包装对象转换为基本类型\n        int num = obj.intValue();\n\
  \        System.out.println(num+ \" \" + obj);\n    }\n}\n```\n输出：100 100\n\n# Java\
  \ 8 教程\n\n## 4.1 Java Lambda 表达式\n\n### Java Lambda 表达式教程\nLambda 表达式是 Java 8 中引入的新特性。Lambda\
  \ 表达式是一个匿名函数。一个没有名称且不属于任何类的函数。Lambda 表达式的概念最早是在 LISP 编程语言中引入的。\n\n### Java Lambda\
  \ 表达式语法\n要创建一个 Lambda 表达式，我们在 Lambda 运算符 `->` 的左侧指定输入参数（如果有的话），并在 Lambda 运算符的右侧放置表达式或语句块。例如，Lambda\
  \ 表达式 `(x, y) -> x + y` 指定该 Lambda 表达式接收两个参数 `x` 和 `y` 并返回它们的和。\n\n//lambda 表达式的语法\n\
  ```\n(parameter_list) -> {function_body}\n```\n\n### Java 中 Lambda 表达式与方法的区别\nJava\
  \ 中的方法（或函数）具有以下主要部分：\n1. 名称\n2. 参数列表\n3. 方法体\n4. 返回类型。\n\nJava 中的 Lambda 表达式具有以下主要部分：\n\
  Lambda 表达式只有方法体和参数列表。\n1. 无名称 – 函数是匿名的，所以我们不关心名称\n2. 参数列表\n3. 方法体 – 这是函数的主要部分。\n\
  4. 无返回类型 – Java 8 编译器能够通过检查代码推断返回类型。你不需要显式地提到它。\n\n### 在 Java 中何使用 Lambda\n要使用 Lambda\
  \ 表达式，你只需要创建自己的函数式接口，或者使用 Java 提供的预定义函数式接口。只有一个抽象抽象方法的接口被称为函数式接口（或单抽象方法接口），例如：`Runnable`、`callable`、`ActionListener`\
  \ 等。\n\n使用函数式接口：\n- **Java 8 之前：** 我们创建匿名内部类。\n- **Java 8 之后：** 你可以使用 Lambda 表达式代替匿名内部类。\n\
  \n### Java Lambda 表达式示例\n\n#### 不使用 Lambda 表达式：在 Java 8 之前，我们使用匿名内部类来实现函数式接口的唯一抽象方法。\n\
  ```java\nimport java.awt.*;\nimport java.awt.event.*;\npublic class ButtonListenerOldWay\
  \ {\n    public static void main(String [] args) {\n        Frame frame=new Frame\
  \ (\"ActionListener Before Java8\" );\n        Button b=new Button (\"Click Here\"\
  \ );\n        b.setBounds(50 ,100 ,80 ,50 );\n        b.addActionListener(new ActionListener\
  \ (){\n            public void actionPerformed(ActionEvent e){\n               \
  \ System.out.println(\"Hello World!\" );\n            }\n        });\n        frame.add(b);\n\
  \        frame.setSize(200 ,200 );\n        frame.setLayout(null );\n        frame.setVisible(true\
  \ );\n    }\n}\n```\n\n#### 使用 Lambda 表达式：与其创建匿名内部类，我们可以像这样创建一个 Lambda 表达式：\n```java\n\
  import java.awt.*;\npublic class ButtonListenerNewWay {\n    public static void\
  \ main(String [] args) {\n        Frame frame=new Frame (\"ActionListener java8\"\
  \ );\n        Button b=new Button (\"Click Here\" );\n        b.setBounds(50 ,100\
  \ ,80 ,50 );\n        b.addActionListener(e -> System.out.println(\"Hello World!\"\
  \ ));\n        frame.add(b);\n        frame.setSize(200 ,200 );\n        frame.setLayout(null\
  \ );\n        frame.setVisible(true );\n    }\n}\n```\n\n**注意：**\n1. 如你所示，使用 Lambda\
  \ 表达式使用了更少的代码。\n2. 向后兼容性：当你将项目迁移到 java 8 时，可以在旧代码中使用 lambda 表达式。\n\n让我们看更多 Lambda\
  \ 表达式示例。\n\n#### 示例 1：无参数的 Java Lambda 表达式\n```java\n@FunctionalInterface\ninterface\
  \ MyFunctionalInterface {\n    //无参数的方法\n    String sayHello();\n}\npublic class\
  \ Example {\n    public static void main(String args[]) {\n        //lambda 表达式\n\
  \        MyFunctionalInterface msg = () -> {\n            return \"Hello\";\n  \
  \      };\n        System.out.println(msg.sayHello());\n    }\n}\n```\n输出：Hello\n\
  \n#### 示例 2：单参数的 Java Lambda 表达式\n```java\n@FunctionalInterface\ninterface MyFunctionalInterface\
  \ {\n    //单参数的方法\n    int incrementByFive(int a);\n}\npublic class Example {\n\
  \    public static void main(String args[]) {\n        //带参数的 lambda 表达式\n     \
  \   MyFunctionalInterface f = (num) -> num+5 ;\n        System.out.println(f.incrementByFive(2));\n\
  \    }\n}\n```\n输出：7\n\n#### 示例 3：多参数的 Java Lambda 表达式\n```java\ninterface StringConcat\
  \ {\n    String sconcat(String a, String b);\n}\npublic class Example {\n    public\
  \ static void main(String args[]) {\n        //带多个参数的 lambda 表达式\n        StringConcat\
  \ s = (str1, str2) -> str1 + str2;\n        System.out.println(\"Result: \" + s.sconcat(\"\
  Hello \", \"World\"));\n    }\n}\n```\n输出：Result: Hello World\n\n#### 示例 4：使用 foreach\
  \ 遍历集合\n```java\nimport java.util.*;\npublic class Example {\n    public static\
  \ void main(String [] args) {\n        List <String > list=new ArrayList <String>();\n\
  \        list.add(\"Rock\");\n        list.add(\"an\");\n        list.add(\"Daryl\"\
  );\n        list.add(\"Glenn\");\n        list.add(\"Carl\");\n        list.forEach(\n\
  \            // lambda 表达式\n            (names)->System.out.println(names)\n   \
  \     );\n    }\n}\n```\n\n### Lambda 表达式——遍历 Map 和 List\n使用 `forEach` 遍历 `Map`\
  \ 和 `List`。\n\n#### 使用 Lambda 表达式在 Java 8 中遍历 Map\n```java\npackage com.javabook;\n\
  import java.util.HashMap;\nimport java.util.Map;\npublic class IterateMapUsingLambda\
  \ {\n    public static void main(String [] args) {\n        Map <String , Integer\
  \ > prices = new HashMap <>();\n        prices.put(\"Apple\" , 50 );\n        prices.put(\"\
  Orange\" , 20 );\n        prices.put(\"Banana\" , 10 );\n        prices.put(\"Grapes\"\
  \ , 40 );\n        prices.put(\"Mango\" , 50 );\n        /* 使用 Lambda 遍历\n     \
  \   for (Map.Entry<String, Integer> entry : prices.entrySet()) {\n            System.out.println(\"\
  Fruit: \" + entry.getKey() + \", Price: \" + entry.getValue());\n        }\n   \
  \     */\n        prices.forEach((k,v)->System.out.println(\"Fruit: \" + k + \"\
  , Price: \" + v));\n    }\n}\n```\n输出：\nFruit: Apple, Price: 50\nFruit: Grapes,\
  \ Price: 40\nFruit: Mango, Price: 50\nFruit: Orange, Price: 20\nFruit: Banana, Price:\
  \ 10\n\n#### 使用 Lambda 表达式在 Java 8 中遍历 List\n```java\npackage com.javabook;\nimport\
  \ java.util.List;\nimport java.util.ArrayList;\npublic class IterateListUsingLambda\
  \ {\n    public static void main(String [] argv) {\n        List names = new ArrayList\
  \ <>();\n        names.add(\"Ajay\" );\n        names.add(\"Ben\" );\n        names.add(\"\
  Cathy\" );\n        names.add(\"Dinesh\" );\n        names.add(\"Tomy\" );\n   \
  \     /* 不使用 Lambda 遍历\n        Iterator iterator = names.iterator();\n        while\
  \ (iterator.hasNext()) {\n            System.out.println(iterator.next());\n   \
  \     }\n        */\n        names.forEach(name->System.out.println(name));\n  \
  \  }\n}\n```\n输出：\nAjay\nBen\nCathy\nDinesh\nTomy\n\n## 4.2 Java 8 中的方法引用\n方法引用是调用方法的\
  \ Lambda 表达式简写。例如：\n如果你的 Lambda 表达式是这样的：`str -> System.out.println(str)`\n那么你可以将其替换为方法引用：`System.out::println`\n\
  `::` 运算符在方法引用中用于分离类或对象与方法名（我们将通过示例学习）。\n\n### 方法引用的四种类型\n1. 实例化方法引用——`object::instanceMethod`\n\
  2. 类的静态方法引用——`Class::staticMethod`\n3. 特定类型任意对象的实例化引用引用`Class::instanceMethod`\n\
  4. 构造方法引用——`Class::new`\n\n### 1. 实例化方法引用\n```java\n@FunctionalInterface\ninterface\
  \ MyInterface {\n    void display();\n}\npublic class Example {\n    public void\
  \ myMethod(){\n        System.out.println(\"Instance Method\" );\n    }\n    public\
  \ static void main(String [] args) {\n        Example obj = new Example ();\n  \
  \      // 使用类对象的方法引用\n        MyInterface ref = obj::myMethod;\n        // 调用函数式接口的方法\n\
  \        ref.display();\n    }\n}\n```\n输出：Instance Method\n\n### 2. 类的静态方法引用\n\
  ```java\nimport java.util.function.BiFunction;\nclass Multiplication {\n    public\
  \ static int multiply(int a, int b){\n        return a*b;\n    }\n}\npublic class\
  \ Example {\n    public static void main(String [] args) {\n        // 使用静态方法引用\n\
  \        BiFunction<Integer, Integer, Integer> product = Multiplication::multiply;\n\
  \        int pr = product.apply(1, 5 );\n        System.out.println(\"Product of\
  \ given: \" + pr);\n    }\n}\n```\n输出：Product of given: 5\n\n### 3. 特定类型任意对象的实例化引用\n\
  ```java\nimport java.util.Arrays ;\nclass Example {\n    public static void main(String\
  \ [] args) {\n        String [] stringArray = {\"Stefen\", \"Rick\", \"Aditya\"\
  , \"Negan\", \"Lucy\", \"Sansa\"};\n        /* 任意对象的实例化方法引用 */\n        Arrays.sort(stringArray,\
  \ String ::compareToIgnoreCase);\n        for (String str:stringArray){\n      \
  \      System.out.println(str);\n        }\n    }\n}\n```\n输出：\nAditya\nLucy\nNegan\n\
  Rick\nSansa\nStefen\n\n### 4. 构造方法引用\n```java\n@FunctionalInterface\ninterface MyInterface\
  \ {\n    void display(String say);\n}\nclass Hello {\n    public Hello(String say){\n\
  \        System.out.println(say);\n    }\n}\npublic class Example {\n    public\
  \ static void main(String [] args) {\n        // 使用构造方法引用\n        MyInterface ref\
  \ = Hello::new;\n        // 调用函数式接口的方法\n        ref.display(\"Hello World!\");\n\
  \    }\n}\n```\n输出：Hello World!\n\n## 4.3 Java 函数式接口\n只有一个抽象方法的接口被称为函数式接口（或单抽象方法接口），例如：`Runnable`、`callable`、`ActionListener`\
  \ 等。\n\n要使用 Lambda 表达式，你只需要创建自己的函数式接口，或者使用 Java 提供的预定义函数式接口。\n- **Java 8 之前：** 我们创建匿名内部类。\n\
  - **Java 8 之后：** 你可以使用 Lambda 表达式代替匿名内部类。\n\n## 4.4 Java 8 接口变化\n接口的所有方法默认是抽象的。Java\
  \ 8 允许接口拥有 `default` 和 `static` 方法。\n\n### 为什么需要默认方法？\n例如，如果多个类如 `A`、`B`、`C` 和 `D`\
  \ 都实现了 `XYZInterface`，那么如果我们向 `XYZInterface` 添加一个新方法，必须更改所有类的代码（A, B, C 和 D）。在这个示例中只有四个类实现了该接口，但想象一下如果有数百个类实现，更改所有代码几乎是不可能的。\n\
  \n注意：我们可以说默认方法的引入是为了在 Java 8 中以后后兼容的方式向现有接口中添加新方法。接口中的静态方法与默认方法不同，我们不能在类中重写这些方法。\n\
  \n## 4.5 Java 8 Stream 教程\n在之前的教程中我们学习了 Java 8 的接口变化。在本指南中，我们将讨论 Java 8 的另一个新 Stream\
  \ API。该 API 的所有类和接口都在 `java.util.stream` 包中。\n\n### 如何在 Java 中使用 Stream\n如上面的示例所示，流的工作可以分为三个阶段：\n\
  1. 创建流\n2. 对初始流执行中间操作将其转换为另一个流，并继续后续中间操作。在上面的示例中，`filter()` 操作是中间操作，可以有多个中间操作。\n\
  3. 在最终流上执行终端操作以获取结果。在上面的示例中，`count()` 操作是终端操作。\n\n1. `Stream` 不存储元素。它只是执行聚合操作（如上面示例中看到的\
  \ `filter()` 和 `count()`）来获取所需流。\n2. 在集合、数组或任何数据源上执行的聚合操作不会更改源数据。\n3. 所有流操作在本质上都是惰性的，这意味着在需要它们之前不会执行。例如，如果我们只想显示列表的前\
  \ 2 个元素，流操作将在第二次迭代时停止。\n\n## 4.6 Java 8 Stream 过滤器\n我建议你在阅读本教程之前先阅读该指南。在本指南中，我们将讨论\
  \ Java 流过滤器。`filter()` 是一个中间操作，它从流中读取数据并在根据给定条件转换数据后返回新流。\n\n### Java 流过滤器的简单示例\n\
  在这个示例中，我们使用 `stream()` 方法从名称列表中创建流，然后使用 `filter()` 创建另一个长名称流。正如我上面提到的，流过滤器将一个流的数据转换为另一个流。\n\
  ```java\nimport java.util.Arrays ;\nimport java.util.List ;\nimport java.util.stream.Stream\
  \ ;\npublic class Example {\n    public static void main(String [] args) {\n   \
  \     List <String> names = Arrays.asList(\"Melisandre\", \"Sansa\", \"Jony\", \"\
  Daenerys\", \"Joffery\");\n        // 创建流\n        Stream <String> allNames = names.stream();\n\
  \        // 使用 filter() 创建长名称流\n        Stream <String> longNames = allNames.filter(str\
  \ -> str.length() > 6 );\n        // 显示长名称\n        longNames.forEach(str->System.out.print(str));\n\
  \    }\n}\n```\n输出：Melisandre Daenerys Joffery\n\n## 4.7 Java 8 – 按键值过滤 Map\n我们将学习如何使用\
  \ `filter()` 方法按键值过滤 Map。\n\n## 4.8 Java 8 – 从 Stream 中过滤值\n在这个示例中，我们有一个带有空值的流。\n\
  \n```：\n下面的代码将一个指定的文件压缩为 GZip 格式。在下面的示例中，我们在 B 盘的“Java”下有一个文本文件，我们正在同一个文件夹内压缩并生成\
  \ GZip 文件。\n```java\nimport java.io.File ;\nimport java.io.FileInputStream ;\nimport\
  \ java.io.FileOutputStream ;\nimport java.io.IOException ;\nimport java.util.zip.GZIPOutputStream\
  \ ;\npublic class GZipExample {\n    public static void main(String [] args ){\n\
  \        GZipExample zipObj = new GZipExample ();\n        zipObj.gzipFile();\n\
  \    }\n    public void gzipFile(){\n        byte [] buffer = new byte [1024 ];\n\
  \        try{\n            // 指定输出 GZip 文件的名称和路径\n            GZIPOutputStream gos\
  \ = new GZIPOutputStream (new FileOutputStream (\"B://Java/file.gz\" ));\n     \
  \       // 指定输入文件的位置\n            FileInputStream fis = new FileInputStream (\"\
  B://Java/file.txt\" );\n            // 从输入文件读取并写入 GZip 文件\n            int length;\n\
  \            while ((length = fis.read(buffer)) > 0 ){\n                // 使用缓冲区写入输出流\n\
  \                gos.write(buffer, 0, length);\n            }\n            // 关闭\
  \ GZIPOutputStream\n            gos.close();\n        } catch (IOException ioe){\n\
  \            ioe.printStackTrace();\n        }\n    }\n}\n```\n输出：File Compressed\n\
  \n## 4.9 Java 8 – forEach\n在 Java 8 中，我们新引入了 `forEach` 方法来遍历集合和流。在本指南中，我们将学习如何使用\
  \ `forEach()` 和 `forEachOrdered()` 方法遍历特定的集合和流。\n\n### forEach 遍历 Map\n```java\n\
  import java.util.Map ;\nimport java.util.HashMap ;\npublic class Example {\n   \
  \ public static void main(String [] args) {\n        Map <String , Integer > map\
  \ = new HashMap <<>();\n        map.put(\"Monkey\" , 1 );\n        map.put(\"Dog\"\
  \ , 2 );\n        map.put(\"Cat\" , 3 );\n        map.put(\"Lion\" , 4 );\n    \
  \    map.put(\"Bear\" , 6 );\n        /* forEach 遍历并显示 HashMap 的每个键值对 */\n     \
  \   map.forEach((key,value)->System.out.println(key+\" - \" +value));\n    }\n}\n\
  ```\n\n### forEach 显示特定键的值\n```java\nimport java.util.Map ;\nimport java.util.HashMap\
  \ ;\npublic class Example {\n    public static void main(String [] args) {\n   \
  \     Map <String , Integer > map = new HashMap <<>();\n        map.put(\"Monkey\"\
  \ , 1 );\n        map.put(\"Dog\" , 2 );\n        map.put(\"Cat\" , 3 );\n     \
  \   map.put(\"Lion\" , 4 );\n        map.put(\"Tiger\" , 5 );\n        map.put(\"\
  Bear\" , 6 );\n        /* forEach 遍历 Map 并显示与特定值的键 */\n        map.forEach((key,value)->\n\
  \            if (key == 4 ){\n                System.out.println(\"Value associated\
  \ with 4 is: \" +value);\n            }\n        );\n    }\n}\n```\n\n### forEach\
  \ 遍历 List\n```java\nimport java.util.List ;\nimport java.util.ArrayList ;\npublic\
  \ class Example {\n    public static void main(String [] args) {\n        List <String>\
  \ fruits = new ArrayList <String>();\n        fruits.add(\"Apple\" );\n        fruits.add(\"\
  Orange\" );\n        fruits.add(\"Banana\" );\n        fruits.add(\"Pear\" );\n\
  \        fruits.add(\"Kiwi\" );\n        // forEach 方法中的 lambda 表达式\n        fruits.forEach(str->System.out.println(str));\n\
  \    }\n}\n```\n输出：\nApple\nOrange\nBanana\nPear\nKiwi\n\n### forEach 方法遍历 Stream\n\
  ```java\nimport java.util.List ;\nimport java.util.ArrayList ;\npublic class Example\
  \ {\n    public static void main(String [] args) {\n        List <String> names\
  \ = new ArrayList <String>();\n        names.add(\"Maggie\" );\n        names.add(\"\
  Michonne\" );\n        names.add(\"Rick\" );\n        names.add(\"Merle\" );\n \
  \       names.add(\"Governor\" );\n        names.stream() // 创建流\n        .filter(f->f.startsWith(\"\
  M\")) // 过滤以 M 开头的名称\n        .forEach(System.out.println); // 使用 forEach 显示\n \
  \   }\n}\n```\n输出：\nMaggie\nMichonne\nMerle\n\n### Stream – forOrdered() 方法\n对于顺序流，元素的顺序与源相同，因此当你处理并行流时，可能需要使用\
  \ `forEachOrdered()` 方法，因为它保证元素的顺序与源的相同。\n\n```java\nimport java.util.List ;\nimport\
  \ java.util.ArrayList ;\npublic class Example {\n    public static void main(String\
  \ [] args) {\n        List <String> names = new ArrayList <String>();\n        names.add(\"\
  Ajith\" );\n        names.add(\"Negan\" );\n        names.add(\"Adityan\" );\n \
  \       names.add(\"Stefen\" );\n        // 对于顺序流，元素的顺序与源相同\n        // 但当你处理并行流时，可能需要使用\
  \ forEachOrdered() 方法\n        // 因为它保证元素的顺序与源的相同\n        names.parallelStream().forEachOrdered(System.out.println);\n\
  \    }\n}\n```\n\n## 4.10 Java 8 – Collectors 类\nCollectors 是一个扩展 `Object` 的最终类。在本节中，我们将通过\
  \ Lambda 表达式、Stream 和 Java 8 的其他新特性查看 Collectors。\n\n### groupingBy 和 counting 示例\n\
  在这个示例中，我们使用 Collectors 的 `groupingBy()` 方法对列表元素进行分组，并打印列表中每个元素的出现次数。\n\n```java\n\
  import java.util.stream.Collectors ;\nimport java.util.List ;\nimport java.util.Map\
  \ ;\nimport java.util.function.Function ;\npublic class Example {\n    public static\
  \ void main(String [] args) {\n        List<String> names = Arrays.asList(\"Jon\"\
  , \"Ajith\", \"Stefen\", \"Jon\", \"Ajith\");\n        Map <String , Long> map =\
  \ names.stream().collect(Collectors.groupingBy(Function.identity(), Collectors.counting()));\n\
  \        System.out.println(map);\n    }\n}\n```\n输出：{Stefen=1, Jon=2, Ajith=3}\n\
  \n### 获取 List 的 示例\n```java\nimport java.util.stream.Collectors ;\nimport java.util.List\
  \ ;\nimport java.util.ArrayList ;\nclass Student {\n    int id;\n    String name;\n\
  \    int age;\n    Student (int id, String name, int age) {\n        this.id = id;\n\
  \        this.name = name;\n        this.age = age;\n    }\n}\npublic class Example\
  \ {\n    public static void main(String [] args) {\n        List <Student> studentlist\
  \ = new ArrayList <Student>();\n        // 添加学生\n        studentlist.add(new Student(11,\
  \ \"Jony\", 22));\n        studentlist.add(new Student(22, \"Stefen\", 18));\n \
  \       studentlist.add(new Student(33, \"Lucy\", 22));\n        studentlist.add(new\
  \ Student(44, \"Sansa\", 23));\n        studentlist.add(new Student(55, \"Maggie\"\
  , 18));\n        // 获取学生名称作为 List\n        List <String> names = studentlist.stream().map(n->n.name).collect(Collectors.toList());\n\
  \        System.out.println(names);\n    }\n}\n```\n输出：[Jony, Stefen, Lucy, Sansa,\
  \ Maggie]\n\n### 示例 – 收集为 Set\n在这个示例中，我们将学生列表转换为流，然后应用 Java 过滤器从流中获取指定的记录，之后使用 `.toSet()`\
  \ 方法将流转换为集合。\n\n```java\nimport java.util.stream.Collectors ;\nimport java.util.List\
  \ ;\nimport java.util.Set ;\nimport java.util.ArrayList ;\nclass Student {\n   \
  \ int id;\n    String name;\n    int age;\n    Student (int id, String name, int\
  \ age) {\n        this.id = id;\n        this.name = name;\n        this.age = age;\n\
  \    }\n}\npublic class Example {\n    public static void main(String [] args) {\n\
  \        List <Student> studentlist = new ArrayList <Student>();\n        // 添加学生\n\
  \        studentlist.add(new Student(11, \"Jony\", 22));\n        studentlist.add(new\
  \ Student(22, \"Stefen\", 18));\n        studentlist.add(new Student(33, \"Lucy\"\
  , 22));\n        studentlist.add(new Student(44, \"Sansa\", 23));\n        studentlist.add(new\
  \ Student(55, \"Maggie\", 18));\n        // 获取学生数据作为 Set\n        Set <Student>\
  \ students = studentlist.stream().filter(n-> n.id > 22 ).collect(Collectors.toSet());\n\
  \        // 遍历 Set\n        for (Student stu : students) {\n            System.out.println(stu.id+\"\
  \ \" +stu.name);\n        }\n    }\n}\n```\n输出：\n44 Sansa\n33 Lucy\n55 Maggie\n\n\
  # 5. Java 输入/输出教程\n\n## 5.1 在 Java 中创建文件\n在本教程中，我们将学习如何使用 `createNewFile()` 方法在\
  \ Java 中创建文件。如果文件在指定位置不存在，该方法将创建一个空文件并返回 true。如果文件已经存在，则该方法返回 false。它会抛出：\n- `IOException`\
  \ – 如果创建文件期间发生输入输出错误。\n- `SecurityException` – 如果存在安全管理器且其拒绝访问文件。\n\n完整代码：下面的代码将在\
  \ C 盘创建一个名为“newfile.txt” 的文件。你可以更改代码中的路径在不同的目录或驱动器中创建文件。\n\n```java\npackage javabook.com;\n\
  import java.io.File ;\nimport java.io.IOException ;\npublic class CreateFileDemo\
  \ {\n    public static void main(String [] args){\n        try {\n            File\
  \ file = new File (\"C:\\\\newfile.txt\" );\n            // 如果文件被创建，createNewFile()\
  \ 方法将返回 true，如果文件已存在则返回 false\n            boolean fvar = file.createNewFile();\n\
  \            if (fvar){\n                System.out.println(\"File has been created\
  \ successfully\" );\n            }\n            else {\n                System.out.println(\"\
  File already present at location\" );\n            }\n        } catch (IOException\
  \ e) {\n            System.out.println(\"Exception Occurred:\" );\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n## 5.2 在 Java 中读取文件\n我们将学习使用 `FileInputStream` 和 `BufferedInputStream`\
  \ 读取文件。以下是详细步骤：\n1. 通过提供文件的完整路径创建 `File` 实例。\n2. 将 `File` 实例传递给 `FileInputStream`\
  \ 打开实际文件的连接。\n3. 将 `FileInputStream` 实例传递给 `BufferedInputStream` 创建 `BufferedInputStream`\
  \ 并保存其参数供以后使用。使用缓冲区读取提供了良好的性能。\n4. 使用 `while` 循环读取文件。`available()` 方法用于检查文件末尾，当指针到达文件末尾时它返回\
  \ 0。使用 `read()` 方法的 `FileInputStream` 读取文件内容。\n\n```java\npackage javabook.com;\n\
  import java.io.*;\npublic class ReadFileDemo {\n    public static void main(String\
  \ [] args) {\n        // 指定文件的路径\n        File file = new File (\"C://myfile.txt\"\
  \ );\n        BufferedInputStream bis = null;\n        FileInputStream fis= null\
  \ ;\n        try{\n            // FileInputStream 读取文件\n            fis = new FileInputStream\
  \ (file);\n            // 将 FileInputStream 传递给 BufferedInputStream\n          \
  \  bis = new BufferedInputStream (fis);\n            // 使用缓冲区读取\n            while\
  \ ( bis.available() > 0 ){\n                System.out.print (( char )bis.read());\n\
  \            }\n        } catch (FileNotFoundException fnfe){\n            System.out.println(\"\
  The specified file not found\" +fnfe);\n        } catch (IOException ioe){\n   \
  \         System.out.println(\"I/O Exception: \" + ioe);\n        }finally{\n  \
  \          try {\n                if (bis != null && fis!= null ){\n           \
  \         fis.close();\n                    bis.close();\n                }\n  \
  \          } catch ( IOException){\n                System.out.println( \"Error\
  \ in InputStream close(): \" + ioe);\n            }\n        }\n    }\n}\n\n\n##\
  \ 5.3 在 Java 中写入文件\n我们将学习使用 `FileOutputStream` 在 Java 中写入文件。我们将使用 `FileOutputStream`\
  \ 的 `write()` 方法将内容写入指定的文件。这里是 `write()` 方法的签名：\n`public void write(byte [] b) throws\
  \ IOException`\n它将指定字节数组的 `b.length` 个字节写入文件输出流。如你所示，此方法需要字节数组才能写入文件。因此，在写入文件之前我们需要将内容转换为字节数组。\n\
  \n完整代码：写入文件\n在下面的示例中，我们向文件写入 `String`。为了将 `String` 转换为字节数组，我们使用了 `String` 类的 `getBytes()`\
  \ 方法。\n\n```java\nimport java.io.File ;\nimport java.io.FileOutputStream ;\nimport\
  \ java.io.IOException ;\npublic class WriteFileDemo {\n    public static void main(String\
  \ [] args) {\n        FileOutputStream fos = null ;\n        File file;\n      \
  \  String mycontent = \"This is my Data which needs\" + \" to be written into the\
  \ file\";\n        try{\n            // 指定文件路径\n            file = new File (\"\
  C:/myfile.txt\" );\n            fos = new FileOutputStream (file);\n           \
  \ /* 此逻辑将检查文件是否存在。如果未在指定位置找到文件，它将创建一个\n            * 新文件*/\n            if (!file.exists()){\n\
  \                file.createNewFile();\n            }\n            /*String 不能直接写入文件。\n\
  \            * 它需要转换为字节*/\n            byte [] bytesArray = mycontent.getBytes();\n\
  \            fos.write(bytesArray);\n            fos.flush();\n            System.out.println(\"\
  File Written Successfully\" );\n        } catch (IOException ioe) {\n          \
  \  ioe.printStackTrace();\n        }finally {\n            try {\n             \
  \   if (fos != null ) {\n                    fos.close();\n                }\n \
  \           } catch (IOException ioe) {\n                System.out.println(\"Error\
  \ in closing the Stream\" );\n            }\n        }\n    }\n}\n```\n\n## 5.4\
  \ 在 Java 中追加文件\n使用 `BufferedWriter`、`PrintWriter` 在 Java 中追加文件。有两种方法：\n1. 使用 `FileWriter`\
  \ 和 `BufferedWriter`：在这种方法中，我们在文件中追加更多字符串。使用 `BufferedWriter` 由于它维护了缓冲区而改进了性能。\n\
  2. 使用 `PrintWriter`：这是向文件追加内容的最佳方式。使用 `PrintWriter` 对象会将内容追加到文件末。\n\n### 1) 使用 FileWriter\
  \ 和 BufferedWriter 追加文件\n```java\nimport java.io.File ;\nimport java.io.FileWriter\
  \ ;\nimport java.io.BufferedWriter ;\nimport java.io.IOException ;\nclass AppendFileDemo\
  \ {\n    public static void main(String [] args){\n        try {\n            String\
  \ content = \"This is my content would be appended \" + \"at the end of the specified\
  \ file\";\n            // 指定文件名和路径\n            File file = new File (\"C://myfile.txt\"\
  \ );\n            /* 如果文件不存在，此逻辑将创建文件 */\n            if (!file.exists()){\n   \
  \             file.createNewFile();\n            }\n            // true 表示追加内容\n\
  \            FileWriter fw = new FileWriter (file,true );\n            // BufferedWriter\
  \ 改进了性能\n            BufferedWriter bw = new BufferedWriter (fw);\n            bw.write(content);\n\
  \            // 关闭 BufferedWriter\n            bw.close();\n        } catch (IOException\
  \ ioe){\n            ioe.printStackTrace();\n        }\n    }\n}\n```\n\n### 2)\
  \ 使用 PrintWriter 追加文件\n```java\nimport java.io.File ;\nimport java.io.FileWriter\
  \ ;\nimport java.io.BufferedWriter ;\nimport java.io.PrintWriter ;\nimport java.io.IOException\
  \ ;\nclass AppendFileDemo2 {\n    public static void main(String [] args){\n   \
  \     try{\n            String content = \"This is my content would be appended\
  \ \" + \"at the 指定 file\";\n            File file = new File (\"C://myfile.txt\"\
  \ );\n            /* 如果文件不存在，此逻辑将创建文件 */\n            if (!file.exists()){\n   \
  \             file.createNewFile();\n            }\n            // true 表示追加内容\n\
  \            FileWriter fw = new FileWriter (file,true );\n            BufferedWriter\
  \ bw = new BufferedWriter (fw);\n            PrintWriter pw = new PrintWriter (bw);\n\
  \            pw.println(content);\n            // 关闭 PrintWriter\n            pw.close();\n\
  \        } catch (IOException ioe){\n            ioe.printStackTrace();\n      \
  \  }\n    }\n}\n```\n\n## 5.5 在 Java 中删除文件\n使用 `delete()` 方法删除文件。\n`public boolean\
