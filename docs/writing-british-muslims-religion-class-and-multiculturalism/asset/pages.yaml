    as a ‘push’ factor, propelling those who were already migration to Britain into.¹106
    In the 1950s most South Asian Muslims were young men with their compatriots and
    working shifts in factories, before they were joined by wives, children and elderly
    parents in the following decades. Religious observance tended to be a priority
    for these male sojourners, drinking and extra-marital sex were commonplace. Their
    priority was to earn money for their families that they worked on behalf.¹107
    According to Ansari, it was the arrival of families that led Muslims to begin
