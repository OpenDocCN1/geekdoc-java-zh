  md: '# Anti-racism, liberalism and caste in The Satanic Verses and the Rushdie affair


    (p.66) Throughout the 1980s, the non-white groups identified in the Labour Force
    Survey, Pakistanis and Bangladeshis have suffered the highest rates of unemployment,
    have the lowest number of educational qualifications and the highest profile in
    manual work; and this is true in each respect just for women but also men, and
    not just for the middle-aged (the first generation) also.


    These facts suggest that, if Sam argued, the local politics of Bradford led to
    the heightened tensions at the time of the Rushdie affair; this local politics
    was partly symptomatic of structures of disadvantage that operated on a broader
    scale. Further, the record in prejudice against Asians, as opposed to Afro-Caribians,
    during the 1980s suggests the increasing centrality of cultural and religious
    practices to racism in Britain and reconfiguring the protest as part of a multi-faceted
    anti-racist struggle. Arif Kureshi, in his 1986 essay “Bradford”, considers the
    city as a microcosm of multicultural Britain. For him, the events of the preceding
    years made Bradford a place that had to be ‘because so many important issues of
    race, culture, nationalism, and education, were evident in an extremely concentrated
    way— These issues were to remain of what it was to be British and what would mean
    in the future. Bradford seemed to be a microcosm of a larger British society that
    was struggling to find a sense of itself.¹⁰ Kureshi''s comments here are present:
    many of the issues he explores in the events were to become prominent on a national
    level in subsequent decades, in particular the co-segregation of working-Muslim
    communities and their primary identification in terms of their faith. Their discomfort
    with the community''s mobilisation for a public recognition of their faith (discussed
    in Chapter 3) points to the tensions that were to come from the fury of the Rushdie
    affair. Further, the antagonism shown by one of the anti-racist Bradford towards
    Kureshi because of his controversial My Beautiful Lahore perceived as a denigrating
    representation of their culture¹¹ gestures towards the gaps within and fracturing
    of a ‘universal’ anti-racism that became darkly visible during the controversy.


    This fracturing is evident in the city''s Community Relations Council''s ambivalent
    response to the protest against The Satanic Verses. When Bradford''s Council for
    Mosques asked the CRC to support the protest, the CRC was respected for his views
    on anti-racism and ‘caught in a dilemma: Salman Rushdie (p.67) materials were
    widely used’¹ They decided to remain neutral, justifying this decision by claiming
    that ‘the specific issues relating to the concerns of the Muslim community ...
    are of a religious nature — the best people to represent [their] concerns ...
    are the properly constituted religious organizations in the city’¹⁴ But, as Lewis
    points out, this was in contradiction to their open support for the Council for
    Mosques on the prohibition of halal meat in schools - also an issue of a ‘religious
    nature’. The wheal meat controversy hit the limits of a secular liberal reality
    raising the issue of racism, the Rushdie affair drew into sharp relief its limits
    and contradictions by positioning a committed and vocal anti-racist against a
    racialised and particularly vulnerable minority group (and one which Rushdie is
    affiliated). Liberal commentators resisted this contradiction either by denouncing
    the protesters as misguided, ignorant or even barbaric (‘liberal’, in short),
    at the very best, with the exhortation ‘Fight racism, not Rushdie’, demonstrating
    their ‘desire’ to be on the same side as the Muslims and simultaneous to allow
    a minority group to define their oppression according to how they experienced
    it.¹⁵'
