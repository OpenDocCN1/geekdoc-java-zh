    # The Novel''s Reception


    Monica Ali''s 2003 debut novel, *Brick Lane*, was published to considerable acclaim.
    Lauded by a host of literary critics and journalists, the novel was shortlisted
    for the Man Booker Prize, the Guardian Writers'' Prize and the US National Book
    Critics Circle award, and Ali was announced as one of the decade''s finest young
    novelists highlighted by every one of the spectrum. *Granta* magazine won her
    the WhSmith''s Choice Award and was chosen for the first reward and Judy Book
    Club in 2004. Its story opens in Bangladesh, with the first protagonist Nazeen,
    the move of the novel is situated in the ''enclaved'' East End Bengali community
    which migrates when barely a woman to an older man.³ Nazeen''s transcontinental
    journey underpins her of self-development (p.125) as a Muslim Bangladeshi negotiating
    the complexities of working-class immigrant life within the confines of a Tower
    Hamlets community that forms its focus. *Brick Lane* was the first fiction to
    depict the lives of working-class South Asian Muslims; Salman Rush''s *The Islamic
    Verses*, Manzur Ismail''s collection of short stories *The Makmakers of Spitalfields*
    (1998) and Abdullah Hussein''s *Émigré* (2000) all this territory in very different
    ways. It was, however, the first by a writer of British heritage to engage closely
    with a community besetled as to in the context of events, including the 2001 race
    riots and the 9/11 terror attacks, that have caused a spotlight on British Muslims''
    population. As such, the level of interest generated in a media and reading public
    for a ‘understanding’ of British Muslims is perhaps unsurprising⁴


    No surprising, this chapter suggests, was the impact of its publication, as well
    as its adaptation into film, on some Tower Hamlets Bengali community who read
    the novel as a representation of their already besieged community at a time of
    particular vulnerability and scrutiny by government, and the majority public.
    In December 2003, shortly after the publication of *Brick Lane*, the Greater Syl
    Development and Welfare Council (GWC), a nationwide voluntary organisation which
    cites the welfare of Sylheti Bangladeshis in Britain as its primary concern, wrote
    an eight-page letter to Monica John Carey, chair of their fear concern. The main
    point was that their community had been represented in a ‘shameful’ way — that
    Bangladesh (Sylhet, in particular) had been portrayed as ‘backward, undetected
    and unsophisticated.’⁵ Some years later, the filming of the novel on Brick Lane
    itself and the surrounding streets proved further distance. A group of around
    one hundred protesters, many of whom were Bengali members and traders affiliated
    to the Brick Lane Business Association, marched through the streets shouting slogans
    such as, ‘Community, Bangladeshi community’ and ‘Monica’s book, full of lies.’
    The protest was spearheaded by Abdus Salique, a local sweetshop owner, Labour
    Party member and future mayor of Tower Hamlets (2008-9). The film company was
    eventually forced to withdraw and and produce the final scenes of the film elsewhere.⁶
