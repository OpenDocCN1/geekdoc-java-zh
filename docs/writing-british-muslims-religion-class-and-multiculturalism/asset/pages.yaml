    A different representation of British Muslim culture can be found in Sudanese
    writer Leila Abouela''s 2005 novel Minaret.¹11 But here, too, faith is a positive
    component of identity and here, the protagonist Najwa journeys from a vague identification
    with Islam to a profound and enabling piety. For Muntaha, for Najwa, the hijab
    makes (p.219) a deepening of faith and becomes a source of strength. Further,
    in Minaret, Islam enables the formation of a supportive community of women around
    Regent''s Park Mosque, where faith worship, contrasts sharply with the community
    in Maps for Lost Lovers which fractures at the point of coming together, apart
    by the oppression inflicted from inside and outside its premises. There is in
    Abouela''s novel a sense of the religious collective as enabling rather naively
    silenced subjectivity. Significantly, while the novel gives voice to a naively
    silenced polity combined with modesty and vulnerability that her religious identity
    remains largely within the private sphere. Faith, for her, is primarily a retreat
    from the material to the spiritual. Despite, the faithful collective in the novel,
    there is little sense of a community that is grounded in a particular locale;
    the worshippers are brought together by a faith which is largely detached from
    class, race nor place. In this respect, the novel is contained and detached from
    normative Britishness.


    Even in The Road from Damascus, the faith-based identities of the characters are
    enacted at considerable distance from Phillips'' ''black-hole'' ghettos, the downward
    mobility some have endured, and displaced for political reasons, they are, so
    degree, rootless in London.¹12 Thus and notwithstanding Muntaha''s younger brother
    Amary''s overtly (and misrudly) political, ''street'' Muslim identity, which is
    has own by Yassin-Kassab - they are at a relatively safe remove from the working-class,
    and largely South Asian, Muslim communities that are at the root of the phobia
