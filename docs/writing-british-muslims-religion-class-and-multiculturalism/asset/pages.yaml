  md: '# Anti-racism, liberalism and class in The Satanic Verses and the Rushdie affair


    (Tariq Modood²)


    ‘Racism, Not Rushdie’: The Satanic Verses Controversy

    The Satanic Verses controversy has been described as a transitional event for
    Britain''s South Asian Muslim minority. Their protest against the novel''s publication,
    operating alongside (and often conflicted with) Ayatollah Khomeini''s fatwa and
    closely succeeded by the First Gulf War and further British Muslim anger, led
    to ‘dramatic destabilisation’ within the public sphere.³ This protest must be
    contextualised within an extended socio-historical narrative. As Yunus Samad shows,
    the British Muslim protest against the novel was fiercer and more prolonged in
    the west Yorkshire city of Bradford than outside the UK, including London, which
    was, at the time, home to some Bangladeshi Muslims.⁴ leaves a reason for the uneven
    geography of the protest and its concentration in Bradford of the specifics of
    the city''s social history of the late 1970s and the 1980s: the exacerbation of
    Asian-white antagonism that resulted from widespread unemployment after the 1977
    recession; the subsequent increase in the activities of (p.65) the British National
    Party and the National Front within the town; the trial and subsequent acquittal
    of the Bradford Twelve in 1981; had the malay contest in 1984; and the Honeyfair
    affair afterwards in 1984-85. The latter was particularly divisive, entrening
    the Pakistani Muslim community (whose origins lie predominantly in the Kashmiri
    district of Mirpur) from the white majority.⁵ Thus the anti-Rushdie agitation
    is presented as the culmination of a chain of social and racial antagonisms, as
    well as a product of religious sensitivities.


    Illuminating here is Samad''s description of the anger of Bradford''s youth at
    the publication of The Satanic Verses in the wake of the Honeyfair affair:


    It was perceived that they were humiliated for making religious consciousness
    dominant over other identities. There was no increase in religiosity and students
    served alcohol and attendance for prayer in the mosques remained them... The youth
    were resorting to Islamic idioms and metaphors to express their discontent against
    society which refused to accept them on an equal footing. Symbolically this was
    emphasised by their exclusion from the Yorkshire Cricket Club, despite being excellent
    cricketers who were born and bred in Bradford.⁶


    This account holds on the dialectical relationship between class, race and religious
    affiliation. The manifestation of their anger in ‘Islamic idioms and metaphors’
    is a product not of their Islamic piety but of their oppression as Muslims. It
    is not just that the dimensions of the antagonism were so social and racial as
    well religious, but that these dimensions cannot be conveniently separated. The
    distinction between Islam as a personal, faith and Islamism as a political ideology—a
    distinction that is reiterated by Rushdie in his essays and journal that is current
    among commentators across the political spectrum—is thus exposed problematic⁷
    There is a strong probability that Muslim identity will become politicised and
    enter the public sphere when it is under attack, and this polarisation is not
    necessarily the same as Islam.


    On the larger scale of Britain as a whole, the poverty of South Asian Muslim communities
    at the time of the affair and during the preceding years also serve to highlight
    the intersection of class and religious affiliation and the significant class
    of the protest. Modood shows that'
