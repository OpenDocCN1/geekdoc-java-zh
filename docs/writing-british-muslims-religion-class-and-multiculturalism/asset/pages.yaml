  md: '# Anti-racism, liberalism and class in The Satanic Verses and the Rushdie affair


    ![](img/b162f64f90faf63e06a5faa547806fd7_53_0.png)


    # Writing British Muslims: Religion, class and multiculturalism


    Ahmed Rehana


    Print publication date: 2015

    Print ISBN-13: 9780719087400

    Published to University Press Scholarship Online: January 2016

    DOI: 10.7228/manchester/9780719087400.001.001


    Anti-racism, liberalism and class in The Satanic Verses and the Rushdie affair


    Ahmed Rehana


    DOI:10.7228/manchester/9780719087400.003.0065


    # Abstract and Keywords


    This chapter provides a crucial context to to the British-based controversy surrounding
    the publication of Salman Rushdie''s 1988 novel *The Satanic Verses*, establishing
    the importance of a dialectical understanding of race, class and religious affiliation
    and the protests in their material conditions. It reads the novel alongside and
    argues the dispute that it generated: an engagement with the social context illuminates
    the presence of ideological contradictions within the novel which turn shed light
    on the complexities and contradictions of multicultural politics in 1980s Britain.
    Focusing primarily on Rushdie''s representations of the fictional area ''Brickhill''
    in London, the chapter argues that the oppositional anti-racism that underpins
    the representation of the largely Muslim community''s struggle against the racism
    of Thatcher''s Britain is in tension with the endorsement of secular individualism
    against religious communism that permeates the novel. The chapter reveals the
    strategies by which the novel attempts to manage and resolve this tension which
    is embedded within it which emerged in the form of protests and book-burnings
    after its publication.


    *Keywords*: Salman Rushdie, Rushdie affair, The Satanic Verses, freedom of expression,
    controversy, offense, anti-racism, multicultural politics, secular individualism,
    religious communism


    In Europe and the United States, the stormtroopers of various ''sensitivities''
    seek to limit our freedom of speech. It has never been more important to continue
    to defend those values which make the art of literature possible.


    (Salman Rushdie¹)


    It is surely not Muslims alone who oppose the libertarianism sees the artist as
    a Nietzschean *ubermensch*, towering conventional morality with perfect liberty
    to publish imaginative explorations regarding social consequences. For indeed,
    the artist without social responsibility who provokes anger instead of dialogue
    threatens the field of discourse itself.


    Page 1 of 22'
