    # (p.6) Muslims, Multiculturalism and Class in Contemporary Britain


    Writing British Muslims: Religion, Class and Multiculturalism seeks to intervene
    in debates surrounding multiculturalism and Islam in Britain by examining a selection
    of contemporary literary texts. Offering readings of a range of texts by writers
    of South Asian Muslim heritage, including fiction by Salman Rushdie, Hari Kureshi,
    Monica Ali and Nadeem Alam five British Muslim memoir, it explores the ways in
    which literature can add to our understanding of multicultural Britain and the
    class of South Asian Muslims'
