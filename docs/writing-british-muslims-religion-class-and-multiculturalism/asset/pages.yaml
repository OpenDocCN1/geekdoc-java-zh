    This construction of the novel as a critique of Muslim misogyny, and the protest
    as a defence or cover-up of such misogyny is reductive and tedious but nevertheless
    significant because it shows how reading of fiction is inevitably imbued with
    context, events and ideologies that prevail in the social world.¹69 and how a
    fictional representation of Bangladeshi immigrants of a Tower Hamlets council
    will easily be as representative of British Muslims (as a homogeneous group defined
    in terms of their religious affiliation regardless of their self-definition) and
    co-opted into preconceptions about that community.


    What is at stake not just the fictional representation of a specific location
    on a map, inhabited by individuals (as James when he considers the effect of a
    novel titled Rosevale Gardens, N4 6 UT, for example), but of that specific community
    occupies a subordinate class position in Britain and rarely has to cultural discourse
    or self-representation. Added to this is the fact that, because their subordinate
    position in British society, working-class British Bangladeshis are more likely
    to draw strength and pride from identification as part of a group, defined in
    terms of their faith as well as in their cultural terms⁷⁰ It is not surprising,
    then, that the readers read this representation of Tower Hamlets as a distorted
    reflection of their own community, just as the majority representing public –
    including those Bangladeshis who claimed to identify with the novel''s depiction
    of the community⁷¹ – read it as an ‘authentic reflection.’⁷² My aim here is not
    to make a case for the protestors’ right to substitute their ‘community’ for Ali’s
