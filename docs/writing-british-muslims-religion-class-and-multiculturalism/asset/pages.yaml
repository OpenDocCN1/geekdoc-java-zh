    # Writing British Muslims: Religion, class and multiculturalism


    Ahmed Rehana


    Print publication date: 2015

    Print ISBN-13: 9780719087400

    Published to University Press Scholarship Online: January 2016

    DOI: 10.7228/manchester/9780719087400.001.001


    # Reason to believe? Five British Muslim memoirs


    Ahmed Rehana


    DOI:10.7228/manchester/9780719087400.003


    # Abstract and Keywords


    This chapter considers a selection of post-9/11 autobiographical memoirs by young
    Muslims: Ed Husain''s *The Islamic* (2007), Sarfarraz Manzor''s *Greetings from
    Bury Park: Race, Religion and Rock ‘n’* (2007), Shelina Zahra Jahnamomed''s *A
    Headscarf* (2009) and Zaiba Malik''s *We Are a Muslim, Please* (2010). It considers
    how these narratives de-weigh the weighty burden of representation that they carry
    as the reading public seeks ‘inside’ knowledge of the ‘authentic’ Muslim Other.
    Each memoir considers the role of religious faith and culture in the life of a
    young Muslim in politics; the competing demands of secular modernity, *mahalla*
    and mosque; and the complex relationship between individual, family, community
    and nation. The chapter investigates how they negotiate these issues in their
    articulation of British Muslim selfhoods, and how they intervene in Muslim-majority
    relations and mediate intercultural understanding in post-9/11 Britain.


    *Keywords:* memoir; Ed Husain; Sarfarraz Manzor; Yasmin Hai; Shelina Zahra Jahnamomed;
    Zaiba Malik; intercultural understanding, burden of representation, paretextual


