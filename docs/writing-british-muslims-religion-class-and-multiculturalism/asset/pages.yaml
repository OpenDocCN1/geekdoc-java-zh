    # After 7/7


    Kureishi''s novel Something to Tell You in 2005, shortly after the 7/7 terror
    attacks the narrator, Jamal, a psychoanalyst of mixed Pakistani-white British
    heritage, laments the devastation of Bloomsbury Tavistock Square, not just for
    the loss but also for its symbolic meaning:


    That beautiful London square was Ajita, Valentin and I had attended many philosophy
    lectures ... It was Dickens wrote Bleak House, and Wool Three Guineas; where Lenin
    stayed, and the Hogarth published James Strath Freud in the basement of number
    52. There is also a place to commemorate conscientious objectors in the First
    World War, as well as another for the victims of Hiroshima, with a statue of Gandhi.


    (313)


    (p.117) This urban space is identified with the cultural iconoclasm and political
    radicalism of the Bloomsbury Group. As Sara Blair shows, the geographical area
    of Bloomsbury was a zone of class instability and transgression where the literary
    group had; indeed, it was this very instability that made it fertile for the group''s
    cultural oppositionality.⁸ In Kureishi''s vision of the space, there is a familiar
    contrasting of literature (Dickens, Woolf, Hogarth), as well as cultural thought
    (Lenin, Freud, philosophy lectures), with Islam and the terror signed by the bomb.
    The attack, it is implied, on critical culture as well as the on embodied by the
    conscientious objects in the First World War and M. K. Gandhi. The allusion to
    Hiroshima, as well as Gandhi and the war, with the cultural diversity of the three
    friends inhabiting the square - Jamal, Aisha and Valentin (who is Bulgarian) -
    underlines the transnational of the space. In turn returns the frequent counter-opposition
    in the wake of the 7/7 bombings of the multicultural character of London and the
    victims, seen to emblemise ''our'' inclusive, open and diverse culture, to the
    bombers'' singular, homogenising bid to destroy the capital''s easy-going money.⁹
    In such a construction, London''s diversity (as well as the victims) repels any
    suggestion that the capital and its relation with the rest of the world are shaped
    and operate through oppressive neo-imperial hierarchies.'
