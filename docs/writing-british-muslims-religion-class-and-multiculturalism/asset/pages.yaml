    The Islamist (2007), Sarfanz Mazmor’s Greetings from Bury Park; Race, Religion
    and Rock ‘n Roll (2007), Yasmin Hai’s Making of My Father: Becoming British (2008),
    Shelina Zahra Janahomed’s Love in a Headscarf and Zaiba Malik’s We are Muslim,
    Please (2010). The various ways in which these narratives are shaped and by discourses
    surrounding British Muslims, and how they negotiate the burden ‘inside’ knowledge
    of the ‘authentic’ Muslim Other. Each memoir charts the author’s personal history
    in the context of wider social and cultural issues relating to Islam and multiculturalism.
    Each considers the religious faith and culture in the life of a young British
    Muslim; the rise in ‘Islamic fundamentals’ among British Muslims; the politics
    of religion; the competing demands of secular modernity, mahalla and mosque; the
    complex relationship between individual, family, community and nation. The chapter
    investigates the ways they negotiate these issues in articulation of British Muslims
    selves, and explores how they interfere in Muslim-majority regions and mediate
    intercultural understanding post-9/11 British.


