    it. It takes its impetus from a number of concerns captured in the brief snapshot
    of multicultural Britain above: the frequent occurrence of material structures
    of power benefit images of an ‘inclusive diversity; the liberal discomfort with
    expressions and manifestations of religion, especially Islam, in the public sphere;
    the cultural racism that underpins dissenting discourses of integration versus
    separat, especially where Muslims are concerned; the criticism and attack that
    multiculturalism has withstood over the last three decades or so; and the importance
    of local space when considering multicultural controversies in Britain. Tariq
    Moodood has written about the historical depth of a culturalist race – one that
    builds on biological racism a further discourse that explores cultural differences
    from an aged British, constructed to nullify, marginalize, or demand assimilation
    from groups who suffer from biological racism’. Forms of cultural racism such
    as Anti-Semitism and Islamophobia are far from the oldest in Europe, Moodood points
    out, while the contemporary view of culturalist racism can be traced back to the
    Commonwealth migration to and settlement in Britain.26 The centrality of cultural
    difference to racism has meant, moreover; that Muslims in particular, the majority
    of whom are Pakistani or Bangladeshi heritage, have been the target of verbal
    and physical attacks, as a group who want to maintain and assert elements of their
    culture and religion which are not easily assimilable to a majoritarian British
    way of life.27


    Several events over the last and a half decades in particular have sharpened hostility
    towards Muslims. The Satanic forces of 1988-89 cast a long shadow over perceptions
    of Muslims and Islam in the decade that followed. The July 2001 riots in Bradford,
    Burnley and Oldham and the terror attacks of 11 September 2001 and 7 (p.7) July
    2005, as as the ‘on war on terror’ and the Muslim anger it provoked, reductive
    and stigmatising images of Muslims male youth in particular and heightened Islamophobic
    feeling. A range of controversies and episodes have punctuated the years in between
    and since, in both Britain and other European countries, including the murder
    of schoolboy Richard Everitt in 1994 by a group of Bangladeshi boys; the Madrid
    bombings of 2004; the murder of Dutch filmmaker Theo Van Gogh by self-confessed
    Islamic Mohammed Bouyeri in the same year; the publication of cartoons depicting
    the Prophet Muhammad in Dutch newspaper Jlands-Posten in 2005; Labour Member of
    Parliament Jack Straw the construction of the niqab as a visible statement of
    separation and difference’ which sparked anger among Muslims in 2006,28 and l’affaire
    du foulard in France which erupted in ‘honour killings’, as well as grooming cases
    involving Pakistani men, who have triggered debate and entrenched culturalist
    fears of a regressive and violent Muslim patriarchy. Muslims and Islam have come
    to figure increasingly as secular modernity’s fundamentalist Other. As Peter Morey
    and Aminina Yaasin observe:


    The headlines scream out at every day from front pages and television screens
    seem unusual to unlightened others who, they may live and work in the West, still
    have an allegiance to values different from those recognized in Europe and North
    America. Whether the controversy is over winning, cartoons of the Prophet Muhammad,
    in Afghanistan, Iraq, and Israel-Palestine, or protests about the knighthood given
    to Salman Rushdie, Muslims appear always as a problematic, troubling those values
