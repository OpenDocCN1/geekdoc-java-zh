    # Introduction


    Ahmed Rehana


    DOI:10.7228/manchester/9780719087400.003


    # Abstract and Keywords


    The introduction offers a snapshot of twenty-first century multicultural Britain
    by turning the spotlight on the diverse London borough of Newham, site of the
    2012 Olympic Games, to explore and interrogate debates surrounding the integration
    of its minority ethnic inhabitants and multiculturalism more generally. It goes
    to outline the hostility towards Muslims and liberalism. Crucially, it demonstrates
    manifestations of Islam in the public sphere, and the criticism that multiculturalism
    has withstood the last three decades or so. Drawing on the work of Tariq Modood,
    it posits a multiculturalism that is not colour- culture-blind but recognises
    and respects differences, accommodates collectives or groups (including religious
    groups) as well as individuals, and breaches the public-private division that
    is essential to liberalism. It demonstrates the centrality of space to political
    politics in Britain, as well as the significance of space and the importance of
    a materialistic approach to space when considering literary controversies involving
    British Muslims. Finally, it outlines the scope of the book and the chapters that
    follow.


    *Keywords*: integration, segregation, multiculturalism, class, materialistic approach,
    Newham, Tariq Modood


