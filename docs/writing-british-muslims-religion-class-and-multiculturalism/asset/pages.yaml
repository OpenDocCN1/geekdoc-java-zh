    The raging and violent Islamic columnist; his manipulated, gullible and sheep-like
    male prey; the oppressed, veiled woman; and the scheming but servile matriarch:
    these stereotypes circulate and saturate the media that we consume in large doses.
    It is not just Islamic groups such as the English Defence League, or right-wing
    journalists as Melanie Philipps or Richard Littlejohn, who help create and perpetuate
    these images, but also media commentators and politicians on the liberal face
    of the political spectrum. As Elizabeth Poles of the left-of-centre Guardian in
    her study of media representations of British Muslims in the 1990s, ''its exclusive
    form of liberalism did not extend to Muslims unless its secular approach … marginalizes
    the private realm. Its liberal approach to human rights (p.8) further rendered
    “Islamic” practices irrational and barbaric.³ Indeed, the so-called exorcistic
    discourse of the EDI, as Lentin and Title describe, ‘a product of a decade of
    recited truths’ circulating in politically mainstream discourse, ‘an almost genealogical
    research of the secular liberalism and heroic to an exclusionary, demanded culturalism’⁴


    Inextricable from these stereotypical constructions of Muslims is a sustained
    attack on British multiculturalism. For the British Muslim has become a cipher
    for the excesses of multiculturalism. As a critique of multicultural practices
    and policies can function as means of marginalising and stigmatising Muslims,
    so the supposed excesses of Muslims provide a useful vehicle for criticizing multiculturalism.
    Lentin and Title describe how the hijab, niqab and burqa become


    nodal signifies for significant lines of multicultural dissent, standing for the
    theocratic and patriarchal suppression or oppression of women; as manifestations
    of parallel communities and weak integration; as an assault on the secular nature
    of public institutions and, in places, public space; and perhaps all, as a relativist
    affront to the exceptional cultures of gender equality which has prospered in
    the West.³nThe obvious focus on Muslim practices by political and media commentators
    over the last or two decades have been traced to the powerful signifying function
    of this simple item of clothing; to use as means of discrediting multiculturalism
    and legitimising liberalism’s exclusions, as well as justifying the invasion of
    Afghanistan as a mission to rescue President Bush’s power; benighted ‘women of
    cover’. Clearly evident here is the deployment of gender in criticisms of Muslims
    and multiculturalism. The image of the subversive female victim of retrogressive
    patriarchal practices bolsters stereotypes of the brutal, barbaric and irrational
    Islamic male, and vice versa, while attacks on multiculturalism are predicated
    on a gender conceptualisation of Muslim communities as oppressive (to those women),
    self-segregating (in order to control their women’s freedom) and symbolised by
    the women’s hijabs and niqabs. Thus in liberal discourses about British Muslims
    and multiculturalism, gender – specifically a misguided Eurocentric feminist concept
    of gender – can work as a smokescreen, corroborating the emancipatory action of
    liberalism, which seeks to protect and liberate women from oppression, while obfuscating
    its plurality and exclusions, especially where communal religious identities and
    practices (p.9) are concerned. The polarisation of gender equality and cultural
    equality that emerges from such discourses is highly problematic.³³


