    # Writing British Muslims: Religion, class and multiculturalism


    Ahmed Rehana


    Print publication date: 2015

    Print ISBN-13: 9780719087400

    Published to University Press Scholarship Online: January 2015

    DOI: 10.7228/manchester/9780719087400.001.0001


    # Creative freedom and community constraint in Nadeem Aslam’s Maps for Lost Lovers


    Ahmed Rehana


    DOI: 10.7228/manchester/9780719087400.003.0006


    # Abstract and Keywords


    While not is the subject of a controversy, Nadeem Aslam’s 2004 novel Maps for
    Lost Lovers, the focus of Chapter 5, examines and explores the policies of minority
    offence and the binary of individual freedom versus cultural consensus and censorship
    that has framed responses to controversies surrounding artistic representations
    of Islam and Muslims. In tracing the presence and complication of this binary
    in Maps for Lost Lovers, the chapter explores how far the novel gets beyond the
    gendered cultural discourses that have underpinned pronouncements on the ‘failure’
    of multiculturalism from both left and right. It argues that despite contextualising
    the oppressors’ behaviour within Britain, the novel appears to present two just
    alternatives: individual withdrawal and dissent from community, culture and faith,
    or complicity with the community’s oppressive practices whose victims are primarily
    its women and children. The potential for a multiculturalism formed around religion
    is constantly deflected or stymied, often through a focus on the abuse of women,
    a thorough multiculturalism predicated on a ‘politics of recognition’ and a commitment
    to gender equality is held in tension.


    Keywords: Nadeem Aslam, Maps for Lost Lovers, multiculturalism, gender equality,
    politics of recognition, failure of multiculturalism, creative freedom, censorship,
    censure, honour crime


