    # Space, Time and British Modernities


    Nadeem Aslam has remarked, upon visiting Ground Zero, ‘I asked myself whether
    in my personal life and as I had been rich enough in stories to condemn the small
    scale September 11s that go every day (p.172) … Jugnu and Chanda are the September
    11 of this book.’⁵⁴ Thus, he appears to equate two different crimes – a terror
    attack and an honour killing – via his association with Islam, observing the heterogeneity
    of factors that contribute to and potentially feeding reductive, cultural discourses
    surrounding the religion. When, we at the Royal Festival Hall on 8 July 2004,
    Aslam explained his relation to September 11 in different terms: he pointed to
    the fact that, just as the initial attack of 9/11 concealed a complexity that
    defied explanations, so in his novel the reader does not know what the characters’
    motivations are and assumptions are frequently disturbed. Indeed, Jugnu and Chanda
    are described in the novel as ‘a Rorschach blot: people see different things in
    what has happened’ (137). The fact that the crime and the perpetrators have been
    identified before the narrative begins means that its focus is not on who but
    but rather on the mesh of stories that lead to and, circle around, the crime.
    These stories, moreover, are focalised through several different characters, giving
    a multiplicity of perspectives. This, together with the contradictory nature of
    Kaku in particular, and the fact that narrative strands are left hanging and questions
    undisturbed, establishes reality of the central events.⁵⁵ The contrasting interpretations
    of an analogy with honour killing point to a central ambience in the novel: while
