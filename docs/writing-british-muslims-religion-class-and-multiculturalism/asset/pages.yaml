    A number of scholars challenged these attacks on multiculturalism. Key among them
    is Tariq Modood whose pioneering scholarship, which draws on that of Taylor and
    Bhikhoo Parekh among others, is to include itself. Modood argues that multiculturalism
    or ‘politics of difference’ that is not colour-blind but recognises and respects
    differences, accommodates communities or groups (including religious groups) as
    well, as individuals, and breaches the public-private division that is essential
    to liberalism. He refutes arguments that the recognition of the collective is
    based on the erroneous notion of a natural essence and blanks over internal heterogeneity.
    Yet he, argues group identities are no less real for this: ‘The non-white (p.10)
    groups that the focus of multiculturalism have a visibility and are subject to
    forms of exclusion that continue to sustain group identity; above all, there can
    be passionate commitments to identities in personal, institutional and political
    ways that believe these identities are symbolic or cultural heirs.³37 Further,
    he debunks the idea of the neutrality of the public sphere, arguing that the latter
    is inevitably shaped by the dominant group in society and so isolation is necessarily
    a marginalised of these identities.³38 Equality can only be obtained by practising
    ‘equal respect’ alongside ‘equal dignity’: the latter is concerned with what people
    have in common, the former is concerned with the importance of difference for
    understanding and equal relations and rights. The denial or invisisalisation of
    a group identity, Modood argues, is a form of oppression which makes equal respect
