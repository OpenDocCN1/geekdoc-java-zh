    # Writing British Muslims: Religion, class and multiculturalism


    Ahmed Rehana


    Print publication date: 2015

    Print ISBN-13: 9780719087400

    Published to University Press Scholarship Online: January 2015

    DOI: 10.7228/chester/9780719087400.001.0001


    # Muslim culture, class and controversy in twentieth-century Britain


    Ahmed Rehana


    DOI:10.7228/chester/9780719087400.003.0002


    # Abstract and Keywords


    This chapter explores the presence and practices of South Asian Muslims in Britain
    from the early twentieth century to the 1980s, historicising the ideological narratives
    and counternarratives that surround British Muslims. Focusing on the activities
    of the working-class South Asian Muslims who worshipped in East London in the
    1930s and 1940s, as well as their counterparts at the Shah Jahan Mosque, Woking,
    it shows how South Asian Muslims in Britain have been forming collectives and
    communities, and mobilising for the right to practise their faith in the public
    sphere, for least a century. As well as investigating controversies involving
    the Jamiat-ul-Muslim (a group affiliated to the East London Mosque), it considers
    the literary and political culture enacted by elite South Asian Muslims in Britain
    towards the end of empire to demonstrate the different ways in which religion,
    class, gender, race and place form a narrative of resistance. Finally, a brief
    exploration of the secular forms of anti-racist activism that dominated after
    the Second War seeks to challenge the thesis that the rise of religious identities
    from the 1980s was the unfortunate offspring of multicultural policies imposed
    from above.


    Keywords: historicisation, East London Mosque, Jamiat-ul-Muslim, Shah Jahan Mosque,
    public sphere, resistance, controversy, H. G. Wells, Sajad Zaheer


    At the setting of the sun three men prostrated themselves towards Mecca, placing
