    Lane* as the product is disrupted by the rulers. The challenge to the anthropological
    gaze of the filmmaker within the novel, which, Naazeen avoids rather than confronts,
    is enacted by the Bangladeshi protesters beyond the novel. But the antagonism
    that is repressed within the novel emerges at the point of its reception, it is
