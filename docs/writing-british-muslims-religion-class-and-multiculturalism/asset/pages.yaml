  md: '# Anti-racism, liberalism and class in The Satan Verses and the Rushdie affair


    Joseph Anton, too, Rushdie sets ‘human nature’ and ‘the universality of his rights
    and ethics and freedoms’ against the terror attacks and ‘the fallacies of relativism
    that were at the heart of theive of the religious (we hate because we aren''t
    like you)’ (66). Implicit is here an echo of Kenan Malik’s critique of the thesis
    that denies Enlightenment values for their status as a universal necessary for
    the advancement of ‘political rights and social justice’ to a ‘weapon in the class
    of civilizations’. On the grounds of their supposed relativism, Malik links the
    ‘class of civilizations’ theory to the ‘multicultural argument’ that suggests
    ‘every community should be encouraged to express its own identity, every its own
    history, formulate its own values, pursue its own lifestyles’.70 Like Malik, Rushdie
    asserts a universal liberal humanism with its basis in Enlightenment rationalism.
    Yet, the assertion of this universal can only be reached in the creation of exception,.71
    which will inevitably lead to a ‘class of civilizations’ or a ‘class of fundamentals’.72
    Rushdie has his exclusions which are invisilised in their dematerialised cosmopolitan
    understanding of the world, just as a limited liberal-pluralist approach to Britain’s
    cultural diversity obscures the inequalities of the public sphere which exclude
    working-class minorities.


    In his commencement address for Bard College, New York, Rushdie tells his audience:
    ‘Do not know your place.’73 This echoes the choice in which this essay appears,
    Step across this Line, and captures retheme throughout his work: the transgression
    of boundaries. A spatial metaphor for rules, which incorporates, is frequently
    used to describe disobedience against a generalised notion of truth. The idea
    of disobedience or freedom is abstracted into elements as diverse as ‘kissing
    in public places, ban sandwiches, disagreement, cutting-edge fashion, literature,
    generosity, a more equitable distribution of the world’s resources, movies, music,
    freedom of thought, beauty, love’. This listing of freedoms, which equates transgression
    as a value and a more material socialist oppositional stance that can be traced
    in The Satanic Verses.74 Just as Rushdie acts free out of his context, he is (p.87)
    the individual who doesn’t ‘know his place’ out of the social conditions of privilege
    which enables him or her freedom of choice. For it is many who have the freedom
    to opt out of collective identities through individual consumption.75 In Rushdie’s
    use, then, spatial metaphors remain largely disconnected from the material, while
    in the social context of The Satanic Verses and the protests it sparked in the
    rich (east London and Bradford) divisions of class are entrenched in space and
    a dematerialised understanding of transgressive boundary-crossing or of the multicultural
    resists is to sustain.’76 To ‘free’ the working classes of the East End and Bradford
    from that material them from the world or ‘regenerate’ surrounds them and that
    material is engineered in the cities or country homes of the rich. It is enough
    to tell them to ‘step across this line’ or to refuse their ‘place.’ The idea of
    not refusing or refusing one place also forms the work of Slav Žižek who advocates
    the rejection of one’s subordinate place in the social-political edifice and an
    identification with the ‘point of exception’ of the social order - that is, with
    those who do not benefit from classification. For Žižek, it is by identifying
    this exception that a ‘true universality’ can be attained.77 This construction
    of a rejection of one places Rushdie and his supporters represented The Satanic
    Verses as breaking taboos and transgressing boundaries. In a material sense, it
    is rather the working-class Bradford protesters who transgressed boundaries by
    refusing to act their ‘subordinate place’ within neoliberal capitalist’s structures.'
