    The chapter argues that the Bangladeshi community that forms the focus of Brick
    Lane is largely abstracted from its context so that the problems of the community
    are rooted uniquely in its (religious) culture and excluded from the exclusions
    of majority Britain. Hence, the trajectory from constraint to freedom that the
    protagonist Nazheen follows is shaped by patriarchal structures within the community’s
    members and their subversion, and there is little sense of the pressures that
    are exerted on the community’s members from outside this space. The chapter explores
    the reception of the novel by literary establishment and the contrasting response
    of members of the Bangladeshi community, and argues the social contradictions
    that are repressed in Brick Lane emerge at the point of reception of the novel
    and its filming. It exposes the raciality and the British Muslims who inhabit
    the Brick Lane and culturally (including religiously) coded nature of the principle
    of freedom of expression, and offers an account of the protest as a struggle for
    recognition and self-representation and against the structures of inequality which
    obstruct its protagonists’ path to these rights.


    *Keywords:* Monica Ali, Brick Lane, reception, controversy, freedom of expression,
    protest, class, community, patriarchy


