    # Conclusion


    Ahmed Rehana


    DOI:10.7228/manchester/9780719087400.003.008


    +   [-] Abstract and Keywords


    The Conclusion argues that the Rushdie affair established, or at least embedded,
    the normative terms of conceptualising freedom of expression controversies, and
    that its influence on perceptions of Islam and Muslims in Britain has been pervasive
    and persistent. It suggests, further, that the controversy influenced the craft
    of British writers of South Asian Muslim heritage, which of is, in varying ways,
    hamstring by a secular liberalism in its representation of societies and communities
    of faith. Finally, the Conclusion offers an exploration of two Muslim writers
    who trace their heritage to other parts of the world, British Syrian Robin Yassin-Kassab
    and Sudanese Leila Aboule, to suggest that their fiction moves beyond the binary
    of secular liberalism versus religious communalism that the book explores and
    deconstruct.


    Keywords: The Rushdie affair, Joseph Anton, Robin Yassin-Kassab, Leila Aboule,
    intercultural understanding


    Salman Rushdie''s use of the third person in his 2012 memoir Joseph Anton might
    suggest a desire on part to draw a clear distinction between the narrator and
    the narrated subject, between his himself and the man who undermines the ordeals
    he describes. This turn could imply that the passage of time has brought about
    a shift in perspective, perhaps added nuance to his views on the global controversy
    triggered by 1988 and subsequent disputes concerning freedom of expression or
    religious cultural offence. Yet, there is no evidence of this in Joseph Anton:
    towards the end of the book, the protagonist, now released from Khomeini''s fatwa,
    expresses his intention to defend his fellow artists, as he had been defied, ''to
    try to do the same for others ... those who punished, transgressed and, blasphed;
    all artists who do not have power of pen or the cloth to draw lines in the sand
    and not come to us''. A typically reductive polarisation of art and religion -
    with the former under the latter - stands for the complexities of artistic controversies,
    their actual power dimensions and the interplay of contextual factors in shaping
    them, and there is no ironic detachment from the part of the narrative from its
    almost messianic protagonist. Significantly, the protagonist''s story ends just
    after the 9/11 attacks,'
