    that makes her positive claim on Britishness at (p.140) the end of the novel is
    significant - for, if she can so, ''cannot?'' – despite her material disadvantage,
    her character can be accommodated within normative British culture without significant
    disruption.54 The thirteen years that are missing from the novel (1998 to 2001)
    can be read as signing the loss at the end of the first section of Naazen and
    Ch''s baby son, which defines language. This period, bridged by Naazen''s sister
    Hina''s sisters from Bangladesh, contained events that were highly significant
    for Britain''s Muslim minority, not the Rushdie affaire and the First Gulf War,
    which illuminated tensions in multicultural Britain that had hitherto remained
    beneath the immediate need to combat the colour racism and nostalgia for empire
    of decades. Its such absence could additionally be read as another marker of the
    limits of the novel''s speech.55 In its simultaneous movement towards and from
    quelling of the disruptive potential of Islam in Britain, Brick Lane might be
    frustrated as a transitional novel, a product of the period immediately following
    9/11 when engagement with the fraught politics of this contemporary moment was
    pressed and yet stunned by the dominance of secular discourses; an early-9/11
    novel of a different character to those that dominates discourses of this genre,
    one that manifests different features.


    # Brick Lane (The Street)


    The isolation of the community from its wider social context within the novel
    is reflected in Ali''s own comments about it, as well as a number of reviews of
    the novel. In an interview with the writer Dian Adebayo, Ali marks:


    I''m interested in how people have given this book some of the examples you cited
    earlier – you know the idea of being Bombay Dreams and aren''t we all living in
    a multicultural melting pot now. That isn''t the picture I paint in the book and
    that''s not I see it happening. That''s not a reality, for the people about I''m
    mentioning. What''s interesting to me is that people are prepared to see this
    other side of Britain and recognize it is a world apart but it''s of what makes
    England now.57


    With these comments, Ali justifiably sets her novel apart from the easily consumable
    ''multicultural melting pot'' of Britain, highlighting its focus on the ‘other
    side’ – the disadvantaged and bounded minority communities who are not such an
    obvious resource for the (p.141) multicultural niche of the book market; the use
    of ‘timescape compression’ that enables the privileged consumer to sample different
    cultures – whether through purchasing the £75 ban Ch spices in a shop window or
    the fashionable clothing that Naazen and Razia''s collective plans to so, or through
    travel (209, 402-4).58 The novel''s immersion in a poor Muslim community seems
    at odds with considerable consideration, especially with some sections of the
    market. The right-Evening Standard, for example, repeatedly distorts and stigmatises
    Britain''s Muslim minority, lauded Brick Lane as revealing a ‘rich, fresh and
    new world.’59 A reason for the reception of Brick Lane can be located within the
    parallels Ali''s final sentence and the brief publicity quote from the Standard''s
    review: while this other side of Britain is ‘part of what makes England now’,
    it is also ‘a world apart’ (in Ali''s words) or a ‘hidden world’ (in words of
    the Standard). These two phrases highlight the detachment of the community from
    normative Britain that can be traced within the novel itself. This detachment
    is implicit in the publicity quote from gave Margaret Forster, which appeared
    on the cover of the hardback edition of the book: ‘it gave everything I craved
    in a novel, taking me into a life and culture I know'
