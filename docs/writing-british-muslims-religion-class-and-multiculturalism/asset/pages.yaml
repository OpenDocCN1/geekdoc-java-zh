  md: 'pride.¹⁷⁴ Similarly, in the *Brick Lane* affair, the space of literary fiction
    (which working-class Bangladesh can access) and that of the street Brick Lane
    and its environs (which a large community of working-class Bangladesh has settled,
    shaped and made their home) are brought together with volatile effect⁷⁵ Just as
    the community within the novel is detached from its context, so the social fact
    occupies a middle-class liberal domain that must be kept discrete; the GSDWC and
    protesters threatened that social exclusivity and in doing so threatened the antagonistic
    relations of class that connect a working-class community to the liberal middle
    classes and literary establishment.¹⁷⁶


    Describing how its status has shifted from that of an intermediary (connecting)
    places to that of a place in itself, Lefebvre writes of the street: ''A site of
    coming and going, of intrusion, confusion and an anachronistic reversal turns
    into the image of the things it connects, more alive than those.'' (p. 145) is
    a site of the spectacle, where fetishisation is taken to extreme. He goes on contrast
    the site of consumption to the site of production and the site of the labourers''
    home life: ''Far away, in the factories (that produce the wonderful objects, or
    produce the means of producing them), everything is functional ... Far away, in
    the functional, a signal of the repetitive actions that maintain the workforce
    in their everyday life.''⁷⁷ The street Brick Lane is not just a site of commodityification
    and sells: a book marketable commodity that sells, and sells a book. Another reason
    why writing a novel *Brick Lane* is not the same as writing a novel *Rosevale
    Gardens* is that it signifies not just a specific working-class minority but also
    a specific consumer type (''multiculturalism''). The geographical distance that
    separates the site of consumption from the working-class residential district
    in Lefebvre''s Paris does not apply to London, where matter divisions occur on
    a micro scale, the distance between Lefebvre''s streets and factories are seen
    in the distance between these two meanings of ''Brick Lane''. Brick Lane brings
    immigrant labour (or the site of production) and the street-as-commodity image
    into the space, and the image must represent the labour that the social relations
    connect image and labour remain concealed. This occlusion of the unevenness of
    the discursive arena can be traced by majoritarian liberals to the protests, including
    in Ali''s one. Her assertion that those commentators who supported the protesters
    against her novel because of ''misqueued'' for ''silenced'' other minority voices,
    as those of Rushdie, Kaur Bhatti and implies an uneasy connection between working-class
    Bangladesh and Asian members of the literary establishment.¹⁷⁸


