  md: '# Reason to believe? British Muslim memoirs


    Memour, the Muslim and the Market

    In the wake of 9/11 and the ''war on terror'', the ''Muslim'' has become an object
    of curiosity and at times fearful for a western reading public. The demands of
    the market are evidenced in the proliferation of autobiographical memoirs by writers
    of Muslim heritage on both sides of the Atlantic. In North America, Iranian-American
    Nazar Nafisi''s Lolita in Tehran: A Memoir in Books (2003) achieved both commercial
    success and critical acclaim, while memoirs journalists reporting on the ''war
    on terror'' such as Anne Garerel''s Naked in Baghdad (2003) has assured increasing
    prominence. The ''veiled-seller'' - romantic 밝혔 of Muslims as well as Noor Khouri''s
    highly successful hoax testimony, ''knowledge'' of Muslim Other'' (formerly dummy)
    Somaiya Aan Hirsi''s ghostwritten Infinite: My Life in Modern-Day Jung (2003),
    affirms the public hunger for greater written memoir. My Life (2007) was also
    a New York bestseller as a commercial success in the Netherlands, where it was
    launched; in Britain, especially 7/7 when the reality of ''hidden-grown'' terror
    enters the spotlight: the Muslim youth of the nation (p.184) memoirs by writers
    of Muslim heritage have secured a spot in the marketplace. This chapter focuses
    on five recent examples of autobiographical memoir to explore the ways in which
    they intervene in Muslim-majority relations and mediate-cross understanding in
    multicultural Britain: Ed Hasan The Islamist (2007), Sarfaraz Manzoor''s Greetings
    from Bury Park: Race, Religion and Rock ''n'' Roll (2007), Yasmin Hai'' The Making
    of My Daughter: Becoming Rising (2008), Zaiba Malik''s We are a Muslim, Please
    (2010) and Shehra Janhanamed''s In a Headscarf (2009). These autobiographical
    works are important examples of British Muslims ''transforming'' themselves from
    objects of representation to Subjects of self-representation, asserting their
    identities in the context of the homogenising neo-colonial discourses that surround
    Muslims. They inevitably carry a heavy burden of representation in a climate of
    fear and perceived threat - a burden that they shoulder knowingly and kindly,
    in order to make an intervention in representations that circulate about British
    Muslims. Their designated status as ''insider'' accounts that are representative
    of ''Muslim experience'' endow them with a particular potency to challenge but
    also, alternatively, to reproduce and confirm such discourses. The chapter considers
    the ''double agency'' of the memoirs; their ability to work in very different
    interests and constituencies at the same time; to facilitate dialogue across cultures
    while also, at times, obscuring the power relations that underpin dialogue and,
    potentially, excluding from those who are too ''different''.


