    and contradictions in the fabric of the work.


    Lost Lovers is the gap or difference between its materialism - its grounding of
    the behaviour and practices of these Muslims in their disenfranchisement, poverty,
    race and religion, and consequent erasure of a liberal culturalism - its contradictory
    valorisation of individualism communism is what it most understands. This conflict
    of discourses is traceable in the novel''s form. Maps for Lost Lovers adheres
    to the form of the social realist in many ways, and it also departs from in its
    circular trajectory and lack of narrative development, as well as its pastoral
    imagery, aesthetics (p.177) language and elements of surreal. The combination
    of social realism with a more self-consciously aesthetic form suggests the tension
    between the novel''s material grounding and the liberalism that persists through.
    It gets beneath discourse that align Muslim culture within patriarchal creed and
    community, suggesting to this minority community, and yet is simultaneously hampered
    by an inability to think its way out of the polity of minority communitarianism
    ultimately adhering to an individualist liberalism. The novel is framed by a quote
    from Octavio Paz: ''A human being is never what he is but what he seeks.'' The
    emphasis here is on becoming, yet there is little space in Maps for Lost Lovers
    for the notion of a faith-based British Muslim community.


