- "# Java LeanFT 实战\n\n\n\n![](img/image8.jpg)\n![](img/image8.jpg)\n\n# 关于作者\nPaul\
  \ Watson 是一位技术爱好者，在 Web 应用开发、自动化测试、构建自动化、持续集成和部署技术等多种技术领域拥有丰富的经验。他参与过大多数技术栈的工作。\n\
  \n他在 `UFT`、`LeanFT`、`Selenium` 和 `Appium` 上拥有实战经验。他曾结合 `Selenium` 使用 `JUnit`、`TestNG`\
  \ 和 `Cucumber` 等测试框架。他还接触过 `Struts`、`Spring`、`Bootstrap` 和 `Angular JS`。他的爱好包括去新的旅游景点旅行、看篮球、板球以及学习最新的技术事物。\n\
  \n## 给妻子的特别感谢\n我想将这本书献给我亲爱的妻子，感谢她对我如此深爱并帮助我完成了这本书。没有她的支持，这本书将无法实现。\n\n# 这本书适合谁读\n\
  这本书适用于想要学习使用 `LeanFT` 在 `Java` 中实现 Web 和 Windows 应用程序自动化的自动化工程师。假设读者具备 `Java` 语言的基础编程技能。无论你是初学者还是经验丰富的开发者，这本书都将帮助你掌握\
  \ `LeanFT` 的技能。\n\n## 书籍概述\n本书从介绍 `LeanFT` 开始，然后深入探讨下述的核心概念：支持的应用程序、安装、`LeanFT`\
  \ 设置、核心概念、在 `IntelliJ IDEA` 中创建新的 `LeanFT` 项目、在 `Eclipse` 中 `LeanFT` 项目、对象识别与管理、Web\
  \ 应用自动化、Windows 应用程序自动化、同步、断言与报告、`LeanFT` 框架、将 `UFT` 对象库转换为 `LeanFT` 中的应用模型、将 `LeanFT`\
  \ 测试与 CI 服务器集成（如 [Bamboo](http://www.softpost.org/bamboo/adding-maven-task-in-bamboo/)、[Jenkins](http://www.softpost.org/jenkins/creating-and-configuring-the-builds-in-jenkins/)\
  \ 和 [TeamCity](http://www.softpost.org/teamcity/build-steps-for-maven-project-in-teamcity/)）、挑战与解决方案、`LeanFT`\
  \ 常见问题及解决方案、`LeanFT`与其他工具的对比、`LeanFT` Java 参考。\n\n\n# 1. 简介\nLeanFT 代表功能测试。。由 HP\
  \ 开发的工具，与 Ranorex 非常相似。关于 LeanFT 的注意事项如下：\n\n1. 它是一项授权工具。\n2. 由 HP 在 2015 年开发。\n\
  3. 它是 `UFT` (`QTP`) 的轻量级版本。\n4. 通过 LeanFT，你可以使用 .Net 语言以及 Java 编写测试。\n5. LeanFT\
  \ 为 Visual Studio 和 Eclipse 提供了插件。\n6. LeanFT 使用描述编程以及应用模型来识别对象。\n\n## [2. 支持的应用程序](http://www.softpost.org/automation-testing/leanft-with-c-net/supported-applications-by-leanft/)\n\
  LeanFT 支持以下类型的应用程序：\n\n1. IE、Chrome、Firefox、Microsoft Edge Web 应用程序\n2. Windows\
  \ 应用程序 - WPF、Silverlight 等\n3. SAP 应用程序\n4. Java 应用程序\n5. 标准窗口和表单\n\n\n\n\n\n事实上，所有由\
  \ UFT (QTP) 支持的应用也都 LeanFT 支持。\n\n# 3. 安装\n\n## 3.1 安装 LeanFT 及 IDE 插件\n首先访问 [https://saas.hpe.com/en-us/software/leanft]\
  \ 并下载 LeanFT 试用。\n在开始 LeanFT 安装过程之前，请确保以下几点：\n\n1. 你的系统中已经安装了 `node.js` 和 IDE 工具（`Visual\
  \ Studio`、`IntelliJ IDEA`、`Eclipse`）。\n2. 已禁用杀毒软件。\n\n在安装时，你将选择安装哪些插件。\n\n默认情况下，LeanFT\
  \ 安装在 `C:\\Program Files (x86)\\HP\\LeanFT`。\n\n安装完成后，启动 LeanFT 引擎（从安装目录或 Windows\
  \ 开始菜单）。默认情况下，LeanFT 服务运行在端口 `5095`。下图显示了安装过程中的安装选项。请选择勾选 visual studio 和 Eclipse\
  \ 选项的完整安装![](img/image163.jpg)\n\n如果你在系统中安装了 IntelliJ，将看到下面的界面。只需勾选 IntelliJ IDEA\
  \ 旁边的复选框，即可为 IntelliJ IDEA 安装 LeanFT 插件![](img/image168.jpg)\n\n### LeanFT 插件\n\
  安装 LeanFT 后，如如下所示所示运行时引擎。默认情况下，引擎运行在端口 `5095`![](img/image175.jpg)\n\n## 3.2 安装浏览器扩展\n\
  安装 LeanFT 后，你可以在 LeanFT 安装目录下的以下位置查看浏览器扩展文件![](img/image182.jpg)\n\n### LeanFT 浏览器扩展\n\
  只需将扩展文件拖放到浏览器中。当你将这些扩展文件拖入浏览器时，浏览器将安装这些扩展。\n如果没有在浏览器中安装并启用这些扩展，你将无法自动化 Web 应用。下图显示了在\
  \ Chrome 浏览器中启用的 LeanFT 扩展![](img/image190.jpg)\n\n### Chrome 中的 LeanFT 扩展\n\n#\
  \ 4. 入门\n\n## 4.1 LeanFT 设置\n你可以从 IntelliJ IDEA IDE 内查看并编辑 LeanFT 设置，如下所示![](img/image203.jpg)\n\
  \n### LeanFT 引擎和对象识别设置![](img/image208.jpg)\n### LeanFT 中的加载项![](http://www.softpost.org/wp-content/uploads/2016/07/Engine-connection-and-object-synchronization-timeout-in-LeanFT.png)\n\
  ### LeanFT 中的引擎连接和对象同步超时![](img/image220.jpg)\n\n### LeanFT 中的对象识别设置\n以下是最重要的 LeanFT\
  \ 设置：\n\n1. **Add-ins (加载项)**：在此部分，我们可以指定想要加载的加载项。\n2. **Engine connection and Run-time\
  \ settings (引擎连接和运行时设置)**：在此部分，我们可以指定引擎端口和引擎空闲超时。我们还可以指定对象同步超时。LeanFT 在抛出异常之前将等待足够的时间。\n\
  3. **Mobile Settings (移动设置)**：在此设置中，我们可以指定移动中心服务器地址，以便使用 LeanFT 自动化移动应用。\n4. **Object\
  \ Identification settings (对象识别设置)**：在此选项卡中，我们可以指定使用哪些属性来识别对象。\n\n## 4.2 LeanFT\
  \ 中的许可证类型\nLeanFT 带有 4 种许可证，如下所示：\n\n1. **Seat License (节点许可)** - 绑定到一台机器\n2. **Concurrent\
  \ license (并发许可)** - 多台机器可以使用此许可\n3. **Commuter license (通勤型许可)**\n4. **Remote commuter\
  \ license (远程通勤型许可)**\n![](http://www.softpost.org/wp-content/uploads/2015/09/license-wizard.jpg)\n\
  \n# 5. 核心概念\n\n## 5.1 对象识别中心 (Object Identification Center)\n对象识别中心就像 QTP/UFT 中的\
  \ Object Spy。\n对象识别中心以两种模式运行：\n\n1. `simple` - 允许你查看对象的属性值\n2. `edit` - 允许你查看并编辑对象的属性值\n\
  \n对象识别中心允许你执行以下操作：\n\n1. 检查对象。\n2. 了解对象的父详情、层级结构。\n3. 了解对象的属性和值。\n4. 对象识别中心的一个酷功能是可以生成\
  \ Java 或 C# 代码段。\n5. 高亮对象。\n6. 我们还可以捕捉对象的截图。\n7. 它还允许将对象添加到应用程序模型（Application model）。\n\
  \n你可以从 IntelliJ IDEA 启动对象识别中心，如下所示![](img/image269.jpg)\n**在 IntelliJ IDE 中启动 LeanFT\
  \ 对象识别中心**\n下图显示了如何使用对象识别中心检查网页内部的元素![](http://www.softpost.org/wp-content/uploads/2016/07/Object-Identification-Center-in-LeanFT.png)\n\
  ### LeanFT 中的对象识别中心\n\n## 5.2 了解 LeanFT SDK API\n以下列出了 LeanFT API 中一些重要的包和类：\n\n\
  1. `com.hp.lft.report` - `Reporter` 类可用于在报告中导出数据。\n2. `com.hp.lft.sdk` - 核心功能。\n\
  3. `com.hp.lft.sdk.insight` - 用于根据图像识别对象。\n4. `com.hp.lft.sdk.apitesting.uft` -\
  \ LeanFT 中使用的 UFT API。\n5. `com.hp.lft.sdk.java` - 用于自动化 Java 应用（`Swing`/`AWT` 等）的\
  \ API。\n6. `com.hp.lft.sdk.mobile` - 用于移动应用的 API。\n7. `com.hp.lft.sdk.sap.gui` 和\
  \ `com.hp.lft.sdk.sap.ui5` - 用于 SAP 应用的 API。\n8. `com.hp.lft.sdk.stdwin` - 用于标准\
  \ Windows 应用的 API。\n9. `com.hp.lft.sdk.utils` - 辅助方法。\n10. `com.hp.lft.sdk.web`\
  \ - 用于标准 Web 应用的 API。\n11. `com.hp.lft.sdk.winforms` 和 `com.hp.lft.sdk.wpf` - 用于\
  \ .Net 应用的 API。\n12. `com.hp.lft.unittesting` 和 `com.hp.lft.unittesting.datadriving`\
  \ - 用于 LeanFT 单元测试框架的 API。\n13. `com.hp.lft.verifications` - 它提供了 `Verify` 类，可用于断言预期值。\n\
  \n\n\n\n\n# 6. 在 IntelliJ IDEA 中新建 LeanFT 项目\n\n## 6.1 在 Maven 仓库中安装 LeanFT jar\
  \ 文件\n要将 LeanFT 与 `Maven` 集成，你必须将 LeanFT 库文件安装到本地 Maven 仓库。执行以下命令将 LeanFT jar 文件安装到本地仓库。\n\
  \n```bash\nmvn install:install-file -Dfile=\"com.hp.lft.sdk-standalone.jar\" -DgroupId=\"\
  com.hp.lft\" -DartifactId=\"com.hp.lft.sdk\" -Dversion=\"12.53.0\" -Dpackaging=\"\
  jar\" -DgeneratePom=true\nmvn install:install-file -Dfile=\"com.hp.lft.report.jar\"\
  \ -DgroupId=\"com.hp.lft\" -DartifactId=\"com.hp.lft.report\" -Dversion=\"12.53.0\"\
  \ -Dpackaging=\"jar\" -DgeneratePom=true\nmvn install:install-file -Dfile=\"com.hp.lft.unittesting.jar\"\
  \ -DgroupId=\"com.hp.lft\" -DartifactId=\"com.hp.lft.unittesting\" -Dversion=\"\
  12.53.0\" -Dpackaging=\"jar\" -DgeneratePom=true\nmvn install:install-file -Dfile=\"\
  com.hp.lft.verifications.jar\" -DgroupId=\"com.hp.lft\" -DartifactId=\"com.hp.lft.verifications\"\
  \ -Dversion=\"12.53.0\" -Dpackaging=\"jar\" -DgeneratePom=true\n```\n\n然后将在你的 `POM`\
  \ 文件中添加以下依赖。\n\n```xml\n<dependency>\n    <groupId>com.hp.lft</groupId>\n    <artifactId>com.hp.lft.sdk</artifactId>\n\
  \    <version>12.53.0</version>\n</dependency>\n<dependency>\n    <groupId>com.hp.lft</groupId>\n\
  \    <artifactId>com.hp.lft.report</artifactId>\n    <version>12.53.0</version>\n\
  </dependency>\n<dependency>\n    <groupId>com.hp.lft</groupId>\n    <artifactId>com.hp.lft.unittesting</artifactId>\n\
  \    <version>12.53.0</version>\n</dependency>\n<dependency>\n    <groupId>com.hp.lft</groupId>\n\
  \    <artifactId>com.hp.lft.verifications</artifactId>\n    <version>12.53.0</version>\n\
  </dependency>\n```\n\n有时你可能需要将 jar 文件部署到组织中央仓库。下面的示例命令显示了如何将 LeanFT jar 文件部署到中央仓库。\n\
  \n```bash\nmvn deploy:deploy-file -DgroupId=\"com.hp.lft\" -DartifactId=\"com.hp.lft.sdk\"\
  \ -Dversion=\"12.53.0\" -Dpackaging=jar -Dfile=\"com.hp.lft.sdk-standalone.jar\"\
  \ -DrepositoryId=<id-in-settings.xml> -Durl=<url-of-the-central-repository>\n```\n\
  \n## 6.2 创建 LeanFT Maven 项目\n我们可以像下面的图片所示在 IntelliJ IDEA 中创建一个新的 LeanFT maven 项目。注意，一旦创建了项目，你就可以\
  \ `POM.xml` 文件中添加所需的依赖。\n\n![](img/image375.jpg)\nIntelliJ IDE 中的 LeanFT Junit Maven\
  \ 项目\n\n然后为你的项目输入 group id 和 artifact id，并指定项目名称。一旦 maven 项目创建完成，如如下所示添加 LeanFT\
  \ 依赖。\n\n![](img/image382.jpg)\n在 IntelliJ IDEA 中向 Maven 项目添加 LeanFT 库\n\n之后，你就可以编写测试用例并享受使用\
  \ LeanFT 进行自动化测试了。\n\n## 6.3 使用 Gradle 和 TestNG 创建 LeanFT 项目\n要使用 `Gradle` 和 `TestNG`\
  \ 创建 LeanFT 项目，请遵循以下步骤。\n\n首先，在 IntelliJ IDEA 中创建一个示例 Gradle 项目。然后在根目录下添加一个 `libs`\
  \ 目录，并将来自 `C:\\Program Files (x86)\\LeanFT\\SDK\\Java` 的所有 LeanFT 库文件复制到该目录中。\n\n\
  然后，确保你的 `build.gradle` 文件包含以下内容。\n\n```gradle\ngroup 'org.soft'\nversion '1.0-SNAPSHOT'\n\
  apply plugin: 'java'\nrepositories {\n    mavenCentral\n}\ndependencies {\n    testCompile\
  \ group: 'org.testng', name: 'testng', version: '6.9.10'\n    compileTree (dir:\
  \ 'libs', include: '*.jar')\n}\ntest {\n    useTestNG {\n        suites 'src/test/resources/testng.xml'\n\
  \    }\n}\n```\n\n此之后，创建一个示例 TestNG 测试类，并如下例所示添加 LeanFT 测试。注意，你必须在开始测试之前初始化 LeanFT\
  \ SDK，并在测试结束后清理 SDK。\n\n```java\npackage soft ;\nimport com.hp.lft.report.Reporter;\n\
  import org.testng.annotations.AfterClass;\nimport org.testng.annotations.AfterMethod;\n\
  import org.testng.annotations.BeforeClass;\nimport org.testng.annotations.BeforeMethod;\n\
  import org.testng.annotations.Test;\nimport com.hp.lft.sdk.*;\nimport com.hp.lft.verifications.*;\n\
  import java.net.URI;\npublic class SimpleLeanFTTest{\n    @BeforeClass\n    public\
  \ void beforeClass () {\n    }\n    @AfterClass\n    public void afterClass () {\n\
  \    }\n    @BeforeMethod\n    public void beforeMethod () {\n        try {\n  \
  \          ModifiableSDKConfiguration config = new ModifiableSDKConfiguration ();\n\
  \            config . setServerAddress ( new URI ( \"ws://localhost:5095\" ));\n\
  \            SDK . init ( config );\n            Reporter . init ();\n        }\
  \ catch ( Exception ex ){\n            System . out . println ( \"Exception occured\
  \ \" + ex . toString());\n        }\n    }\n    @AfterMethod\n    public void afterMethod\
  \ () throws Exception {\n        Reporter . generateReport ();\n        SDK . cleanup\
  \ ();\n    }\n    @Test\n    public void test () throws GeneralLeanFtException {\n\
  \        Verify . areEqual ( 22 , 22 , \"Verify that 22 == 22\" );\n    }\n}\n```\n\
  此之后构建你的项目并运行。\n\n## 6.4 LeanFT 属性\n当我们使用模板创建 LeanFT 项目时，会创建一个属性文件 (`leanft.properties`)\
  \ 并存储在 resources 目录中。以下是文件中我们可以使用的最重要的设置。\n\n1. `serverAddress` - 指定 LeanFT 引擎地址\n\
  2. `SDK Mode` - 回放模式（Replay）或交互模式（Interactive）\n3. `LeanFT Service Address` - `ws://localhost:5095`\n\
  4. `Connection timeout` - 60 秒\n5. `Response timeout` - 600 秒\n6. `Server autolaunch`\
  \ - true\n\n以下是与 LeanFT 报告相关的最重要的设置\n\n1. `title` - 报告名称。默认为 Run Results。\n2. `description`\
  \ - 报告描述。默认为空。\n3. `targetDirectory` - 报告存储的目录。默认是当前目录。\n4. `overrideExisting` -\
  \ 是否覆盖现有报告。其默认值为 true。\n5. `report folder` - RunResults\n6. `override existing`\
  \ - true\n7. `filter level` - 所有（All）、警告（Warning）、错误（Error）、关闭（Off）\n8. `snapshot\
  \ level` - 所有（All）、错误时（OnError）、关闭（Off）\n\n## 6.5 在 IntelliJ IDEA 中配置 LeanFT 项目\n\
  在本主题中，我们将介绍如何在 IntelliJ IDEA 中配置 LeanFT 项目。我们可以通过 2 方式创建新的 LeanFT 项目。\n\n1. 使用 LeanFT\
  \ 模板\n2. 自定义框架\n\n\n\n\n\n如果你已经安装了 IntelliJ IDEA 的 LeanFT 插件，你可以像下图所示从模板创建新项目。注意，我们可以根据\
  \ 4 种模板创建项目。\n\n![](http://www.softpost.org/wp-content/uploads/2016/07/New-LeanFT-project-in-IntelliJ-IDEA.png)\n\
  IntelliJ IDEA 中新建 LeanFT 项目\n\n![](http://www.softpost.org/wp-content/uploads/2016/07/Sample-LeanFT-project-structure.png)\n\
  LeanFT 项目结构示例\n\n要创建你自己的自定义框架，你必须像下面的示例所示初始化并清理 SDK。注意，在接下来的所有示例中，我们都继承了 `BaseTest`\
  \ 类。\n\n```java\npackage leanft;\nimport com.hp.lft.report.Reporter;\nimport com.hp.lft.sdk.ModifiableSDKConfiguration;\n\
  import com.hp.lft.sdk.SDK;\nimport org.junit.After;\nimport org.junit.Before;\n\
  import java.net.URI;\n\npublic class BaseTest {\n    @Before\n    public void test()\
  \ throws Exception {\n        ModifiableSDKConfiguration config = new ModifiableSDKConfiguration();\n\
  \        config.setServerAddress(new URI(\"ws://localhost:5095\"));\n        SDK.init(config);\n\
  \        Reporter.init();\n    }\n\n    @After\n    public void clean() throws Exception\
  \ {\n        Reporter.generateReport();\n        SDK.cleanup();\n    }\n}\n```\n\
  \n然后我们可以像下面的示例编写测试方法。\n\n```java\npackage leanft;\nimport com.hp.lft.report.Reporter;\n\
  import com.hp.lft.report.Status;\nimport com.hp.lft.sdk.ModifiableSDKConfiguration;\n\
  import com.hp.lft.sdk.SDK;\nimport com.hp.lft.sdk.web.*;\nimport com.hp.lft.sdk.web.EditField;\n\
  import com.hp.lft.sdk.web.EditFieldDescription;\nimport org.junit.Test;\nimport\
  \ java.net.URI;\nimport static org.junit.Assert.assertEquals;\n\npublic class ChromeTest\
  \ extends BaseTest {\n    @Test\n    public void test() throws Exception {\n   \
  \     Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n        try\
  \ {\n            //Navigate to http://www.softpost.org/selenium-test-page/\n   \
  \         browser.navigate(\"http://www.softpost.org/selenium-test-page/\");\n \
  \           browser.sync();\n        } catch (AssertionError ex) {\n           \
  \ //Report the Exception\n            Reporter.reportEvent(\"Exception\", \"Test\
  \ failed\", Status.Failed, ex);\n            throw ex;\n        } finally {\n  \
  \          //Close the browser\n            browser.close();\n        }\n    }\n\
  }\n```\n\n# 7. Eclipse 中的 LeanFT 项目\n\n## 7.1 在 Eclipse 中创建带有 JUnit 的 LeanFT maven\
  \ 项目\n下面的图片将帮助你理解如何在 Eclipse 中创建带有 JUnit 和 LeanFT 的 maven 项目。点击 New project 菜单然后点击\
  \ Other。\n\n![]\nEclipse 中的 LeanFT - 带有 JUnit 的 Maven 项目\n\n然后如如下所示选择 LeanFT JUnit\
  \ Maven project。\n\n![]\nEclipse 中的 LeanFT - Maven JUnit 模板\n\n为你的项目提供 group id\
  \ 和 Artifact id。\n\n![]\nEclipse 中的 LeanFT - Maven JUnit 项目\n\n项目创建如如下所示。\n\n![]\n\
  然后如如下所示为 LeanFT 添加外部 jars 包。\n\n![]\n作为外部 jars 包添加 LeanFT 库\n\n在运行 maven build 之后，你应该能够在\
  \ `RunResults` 目录中看到结果。\n\n## 7.2 在 Eclipse 中创建带有 TestNG 的 maven 项目\n下面的图片将帮助你理解如何在\
  \ Eclipse 中设置带有 TestNG 的 LeanFT maven 项目。\n\n![]\nEclipse 中的 LeanFT - 带有 JUnit Maven\
  \ 项目\n\n![]\nEclipse 中的 LeanFT TestNG group Id\n\n![]\nEclipse 中的 LeanFT TestNG\
  \ Maven 项目\n\nLeanFT 将测试放在 `src/main/java` 目录中。你应该将这些测试类移动到 `src/test/java`，因为 maven\
  \ 总是会在 `src/text/java` 目录中查找任何执行的测试。\n\n# 8. 对象识别与管理\n\n## 8.1 描述编程\n通常在 UFT 中，我们使用对象库（LeanFT\
  \ 中的应用程序模型）来存储应用程序内部的对象。因此，我们可以在自动化代码中使用这些对象，但我们也可以使用描述编程（description programming）在代码本身中定义新的测试对象。\n\
  \n下面的示例展示了如何在 LeanFT 中使用描述编程定义新的测试对象。我们使用了描述编程来定义了 2 个类型为 `EditField` 和 `Link` 的对象。注意，我们可以使用多个属性-值对来识别这些对象。\n\
  \n```java\n//Navigate to http://www.softpost.org/selenium-test-page/\nbrowser.navigate(\"\
  http://www.softpost.org/selenium-test-page/\");\nbrowser.sync();\n\n//Build edit\
  \ box object and set value in it\nbrowser.describe(EditField.class, new EditFieldDescription.Builder().id(\"\
  fn\").build()).setValue(\"Sagar\");\n\n//Build link object and click on it.\nbrowser.describe(Link.class,\
  \ new LinkDescription.Builder().tagName(\"A\").innerText(\"Home\").build()).click();\n\
  ```\n\n## 8.2 应用程序模型\n应用程序模型类似于 UFT 中的对象库。我们可以像下图所示在 IntelliJ IDEA 中创建新的应用程序模型。\n\
  \n![]\nIntelliJ IDE 中新建 LeanFT 应用程序模型项\n\n![]\n下图显示了示例的 `AppModel.tsrx` 文件。在设计模式下，我们可以向应用程序模型添加或删除对象。\n\
  \n![]\n下图展示了如何使用对象识别中心（Object Identification Center）将对象添加到应用程序模型中。\n\n注意，创建新的应用程序模型后会生成\
  \ 2 个文件。\n\n1. `YourModel.tsrx` 文件 -这是一个 XML 文件。我们也可以在设计模式下查看此文件并在其中添加和编辑对象。\n2.\
  \ `YourModel.java` 文件包含表示应用程序模型对象的代码。\n\n\n\n\n以下代码展示了如何使用应用模型（application model）编写测试。\n\
  \n```java\npackage leanft;\nimport com.hp.lft.sdk.web.Browser;\nimport com.hp.lft.sdk.web.BrowserFactory;\n\
  import com.hp.lft.sdk.web.BrowserType;\nimport org.junit.Test;\n/**\n  * Created\
  \ by Sagar on 22 - 07 - 2016.\n*/\npublic class AppModelTest extends BaseTest{\n\
  \    @Test\n    public void test1() throws Exception {\n        Browser browser\
  \ = BrowserFactory.launch(BrowserType.CHROME);\n        browser.navigate( \"http://www.softpost.org/selenium-test-page/\"\
  \ );\n        AppModel model = new AppModel(browser);\n        model.SeleniumTestPage().firstName().setValue(\
  \ \"Sagar\" );\n    }\n}\n```\n\n另一个需要注意的重要点是，我们可以应用模型结合描述编程（description programming）来识别对象，如下示例代码所示。注意，我们使用了应用模型中的\
  \ `SeleniumTestPage` 对象，但我们使用了描述编程来识别 `page.model.SeleniumTestPage().describe(EditField.class,new\
  \ EditFieldDescription.Builder().id(\"fn\").build()).setValue(\"Salunke\");` 的 `EditField`\
  \ 对象。\n\n### 8.3 在属性值中使用正则表达式\n要定义对象的属性值，我们可以使用正则表达式。下面的示例展示了如何使用正则表达式来定义属性值。注意，我们正在点击一个内部文本匹配正则表达式\
  \ `.*Dev.*` 的链接。\n\n```java\npackage leanft;\nimport com.hp.lft.report.Reporter;\n\
  import com.hp.lft.report.Status;\nimport com.hp.lft.sdk.RegExpProperty;\nimport\
  \ com.hp.lft.sdk.web.*;\nimport org.junit.Test;\npublic class RegularExpressionTest\
  \ extends BaseTest{\n    @Test\n    public void test() throws Exception {\n    \
  \    Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n        Try {\n\
  \            //Navigate to http://www.softpost.org/selenium-test-page/\n       \
  \     browser.navigate( \"http://www.softpost.org/selenium-test-page/\" );\n   \
  \         browser.sync();\n            //set value in edit box\n            browser.describe(EditField.class,\
  \ new EditFieldDescription.Builder()\n            .id( \"fn\" ).build()).setValue(\
  \ \"Sagar\" );\n            //click on link containing Dev substring\n         \
  \   browser.describe(Link.class, new LinkDescription.Builder()\n            .tagName(\
  \ \"A\" ).index(1).innerText( RegExpProperty( \".*Dev.*\" )).build()).click();\n\
  \            //Wait until page loads\n            Thread .sleep(300);\n        }\
  \ catch (AssertionError ex) {\n            //Report the Exception\n            Reporter.reportEvent(\
  \ \"Exception\" , \"Test failed\" , Status.Failed, ex);\n            throw ex;\n\
  \        } Finally {\n            //Close the browser\n            browser.close();\n\
  \        }\n    }\n}\n```\n我们还可以使用正则表达式来指定应用模型中对象属性的值。\n\n---\n\n# 9. 自动化 Web 应用\n\
  \n## 9.1 第一个 Web 应用测试\n这里是使用 LeanFT 的第一个 Web 应用测试。在下面的代码中，我们启动了 Chrome 浏览器然后导航到\
  \ `http://www.softpost.org/selenium-test-page/`。之后，我们在编辑框中输入值并点击 Home 链接。相同的代码在其他浏览器（Firefox,\
  \ Internet Explorer, Edge）上同样有效。要启动其他浏览器，你需要在启动方法中更改浏览器类型。\n\n```java\npackage leanft;\n\
  import com.hp.lft.report.Reporter;\nimport com.hp.lft.report.Status;\nimport com.hp.lft.sdk.ModifiableSDKConfiguration;\n\
  import com.hp.lft.sdk.SDK;\nimport com.hp.lft.sdk.web.*;\nimport com.hp.lft.sdk.web.EditField;\n\
  import com.hp.lft.sdk.web.EditFieldDescription;\nimport org.junit.Test;\nimport\
  \ java.net.URI;\nimport static org.junit.Assert.assertEquals;\npublic class ChromeTest\
  \ extends BaseTest{\n    @Test\n    public void test() throws Exception {\n    \
  \    Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n        Try {\n\
  \            //Navigate to http://www.softpost.org/selenium-test-page/\n       \
  \     browser.navigate( \"http://www.softpost.org/selenium-test-page/\" );\n   \
  \         browser.sync();\n            //set value in edit box\n            browser.describe(EditField.class,\
  \ new EditFieldDescription.Builder()\n            .id( \"fn\" ).build()).setValue(\
  \ \"Sagar\" );\n            //click on Home link\n            browser.describe(Link.class,\
  \ new LinkDescription.Builder()\n            .tagName( \"A\" ).innerText( \"Home\"\
  \ ).build()).click();\n            //Wait until page loads\n            browser.sync();\n\
  \        } catch (AssertionError ex) {\n            //Report the Exception\n   \
  \         Reporter.reportEvent( \"Exception\" , \"Test failed\" , Status.Failed,\
  \ ex);\n            throw ex;\n        } Finally {\n            //Close the browser\n\
  \            browser.close();\n        }\n    }\n}\n```\n注意，`BaseTest` 类提供了初始化和清理\
  \ LeanFT SDK 的代码。\n\n```java\npackage leanft;\nimport com.hp.lft.report.Reporter;\n\
  import com.hp.lft.sdk.ModifiableSDKConfiguration;\nimport com.hp.lft.sdk.SDK;\n\
  import org.junit.After;\nimport org.junit.Before;\nimport java.net.URI;\npublic\
  \ class BaseTest{\n    @Before\n    public void init() {\n        try {\n      \
  \      ModifiableSDKConfiguration config = new ModifiableSDKConfiguration();\n \
  \           config.setServerAddress( new URI( \"ws://localhost:095\" ));\n     \
  \       SDK.init(config);\n            Reporter.init();\n        } catch ( Exception\
  \ ex) {\n            System.out.println( \"Exception \" + ex.toString());\n    \
  \    }\n    }\n    @After\n    public void clean() throws Exception {\n        Reporter.generateReport();\n\
  \        SDK.cleanup();\n    }\n}\n```\n\n#### 9.2 使用 XPATH 和 CSS 识别 Web 元素\n我们可以使用\
  \ `XPATH` 和 CSS` 选择器来识别 Web 元素。下面的示例说明了如何在 LeanFT 中使用 `XPATH`。在下面的示例中，我们使用 `XPATH`\
  \ 识别了编辑框。对于更高级的 `XPATH` 表达式，你可以访问 - `http://selenium-interview-questions.blogspot.in/2014/02/how-to-identify-elements-using-xpath-in.html`。对于更高级的\
  \ CSS 表达式，你可以访问 - `http://selenium-interview-questions.blogspot.in/2014/02/how-to-identify-elements-using.html`。\n\
  \n```java\npackage leanft;\nimport com.hp.lft.report.Reporter;\nimport com.hp.lft.report.Status;\n\
  import com.hp.lft.sdk.web.*;\nimport org.junit.Test;\npublic class CsspathTest extends\
  \ BaseTest{\n    @Test\n    public void test() throws Exception {\n        Browser\
  \ browser = BrowserFactory.launch(BrowserType.CHROME);\n        Try {\n        \
  \    //Navigate to http://www.softpost.org/selenium-test-page/\n            browser.navigate(\
  \ \"http://www.softpost.org/selenium-test-page/\" );\n            browser.sync();\n\
  \            //set value in edit box using xpath\n            browser.describe(EditField.class,\
  \ new EditFieldDescription.Builder()\n            .xpath( \"//input[id='fn']\" ).build()).setValue(\
  \ \"Sagar\" );\n            //set value in edit box using css\n            browser.describe(EditField.class,\
  \ new EditFieldDescription.Builder()\n            .cssSelector( \"input[id='fn']\"\
  \ ).build()).setValue( \"Salunke\" );\n        } catch (AssertionError ex) {\n \
  \           //Report the Exception\n            Reporter.reportEvent( \"Exception\"\
  \ , \"Test failed\" , Status.Failed, ex);\n            throw ex;\n        } Finally\
  \ {\n            //Close the browser\n            browser.close();\n        }\n\
  \    }\n}\n```\n\n## 9.3 使用视觉标识符识别对象\n这是 UFT 和 LeanFT 中的一项高级功能，允许根据相邻对象的位置来识别对象。在下面的图中，我们可以通过关联的文本识别编辑框。\n\
  \nLeanFT 中的 VRI\n这是一个完整的示例，展示了如何在 LeanFT 中使用 VRI。注意，我们可以为对象提供多个视觉标识符。\n\n```java\n\
  package leanft;\nimport com.hp.lft.report.Reporter;\nimport com.hp.lft.report.Status;\n\
  import com.hp.lft.sdk.HorizontalVisualRelation;\nimport com.hp.lft.sdk.VisualRelation;\n\
  import com.hp.lft.sdk.web.*;\nimport org.junit.Test;\npublic class Vri extends BaseTest{\n\
  \    @Test\n    public void test() throws Exception {\n        Browser browser =\
  \ BrowserFactory.launch(BrowserType.CHROME);\n        Try {\n            //Navigate\
  \ to http://www.softpost.org/selenium-test-page/\n            browser.navigate(\
  \ \"http://www.softpost.org/selenium-test-page/\" );\n            browser.sync();\n\
  \            //set value in edit box\n            browser.describe(EditField.class,\
  \ new EditFieldDescription.Builder()\n            .id( \"fn\" ).build()).setValue(\
  \ \"Sagar\" );\n            WebElement e2 = browser.describe(WebElement.class, new\
  \ WebElementDescription.Builder()\n            .xpath( \"//td[text()='Last Name']\"\
  \ ).build());\n            browser.describe(EditField.class, new EditFieldDescription.Builder()\n\
  \            .vri( new VisualRelation().setTestObject(e2).setHorizontalRelation(HorizontalVisualRelation.LEFT_AND_INLINE)).build())\n\
  \            .setValue( \"Salunke\" );\n            //click on Home link\n     \
  \       browser.describe(Link.class, new LinkDescription.Builder()\n           \
  \ .tagName( \"A\" ).innerText( \"Home\" ).build()).click();\n            //Wait\
  \ until page loads\n            browser.sync();\n        } catch (AssertionError\
  \ ex) {\n            //Report the Exception\n            Reporter.reportEvent( \"\
  Exception\" , \"Test failed\" , Status.Failed, ex);\n            throw ex;\n   \
  \     } Finally {\n            //Close the browser\n            browser.close();\n\
  \        }\n    }\n}\n```\n\n## 9.4 处理 Windows 应用中的嵌入浏览器控件\n有时，Windows 应用包含嵌入浏览器控件的元素。要将浏览器控件内部的元素识别为\
  \ Web 元素，你需要在 LeanFT 中注册该浏览器控件。要在 LeanFT 中注册浏览器控件，请按照以下步骤操作。\n\n\n\n\n\n# 注册步骤\n\
  \n1. 启动实用程序 - `C:\\Program Files (x86)\\HP\\LeanFT\\bin\\SettingNewBrowserControlApplication.exe`\n\
  \n2. 然后在程序窗口中输入包含浏览器控制的应用程序路径并点击注册（register）\n\n3. 最后，你需要重启 LeanFT 引擎。\n\n\n\n\n\
  ![](img/image1026.jpg)\n\n# 在 LeanFT 中注册浏览器控件\n一旦注册了浏览器控件，其内部的所有对象都将被识别为 Web 对象。请注意，LeanFT\
  \ 只能处理基于 IE 引擎的浏览器控件！\n\n## 9.5 使用 LeanFT 在 Web 元素上触发事件\n我们可以使用 LeanFT 中的 `EventInfo`\
  \ 类在任何 Web 元素上触发如 `click`、`change` 等 html 事件。这里是一个完整的示例，说明了如何触发事件。\n\n```java\n\
  package leanft;\nimport com.hp.lft.report.Reporter;\nimport com.hp.lft.report.Status;\n\
  import com.hp.lft.sdk.NativeObject;\nimport com.hp.lft.sdk.web..*;\nimport org.junit.Test;\n\
  import java.util.List;\npublic class ChromeNativeObjectTest extends BaseTest{\n\
  \    @Test\n    public void test() throws Exception {\n        Browser browser =\
  \ BrowserFactory.launch(BrowserType.CHROME);\n        try {\n            //Navigate\
  \ to http://www.softpost.org/selenium-test-page/\n            browser.navigate(\"\
  http://www.softpost.org/selenium-test-page/\");\n            browser.sync();\n \
  \           //set value in edit box\n            browser.describe(EditField.class,\
  \ new EditFieldDescription.Builder()\n                .id(\"fn\").build()).setValue(\"\
  Sagar\");\n            browser.describe(Link.class, new LinkDescription.Builder()\n\
  \                .tagName(\"A\").innerText(\"Home\").build()).fireEvent(EventInfoFactory.createEvent(\"\
  click\"));\n            Thread.sleep(3000);\n        } catch (AssertionError ex){\n\
  \            //Report the Exception\n            Reporter.reportEvent(\"Exception\"\
  , \"Test failed\", Status.Failed, ex);\n            throw ex;\n        } Finally\
  \ {\n            //Close the browser\n            browser.close();\n        }\n\
  \    }\n}\n```\n\n此外，你也可以使用以下语法执行自定义 JavaScript。\n`String html = browser.getPage().runJavaScript(\"\
  document.body.innerHTML;\");`\n\n若要在 id 为 -fn 的元素上触发 change 事件，你可以将下面的 Javascript\
  \ 作为 `runJavaScript()` 方法的参数。\n```javascript\nvar evt = document.createEvent('HTMLEvents');\n\
  evt.initEvent('change', true, true);\ndocument.findElementById('fn').dispatchEvent(evt);\n\
  ```\n\n## 9.6 在网页中执行 JavaScript\n在自动化 Web 应用时，你可能需要执行 JavaScript 来执行某些操作。LeanFT\
  \ 允许你像下面的示例所示执行自定义 JavaScript。我们可以使用 `Page` 类的 `runJavaScript` 方法来执行任何有效的 JavaScript。\n\
  \n```java\npackage leanft ;\nimport com.hp.lft.report.Reporter ;\nimport com.hp.lft.report.Status\
  \ ;\nimport com.hp.lft.sdk.web.*;\nimport com.hp.lft.verifications.Verify ;\nimport\
  \ org.junit.Test ;\npublic class ExecuteJavaScriptTest extends BaseTest{\n    @Test\n\
  \    public void test () throws Exception {\n        Browser browser = BrowserFactory.launch(BrowserType.INTERNET_EXPLORER);\n\
  \        Try {\n            //Navigate to http://www.softpost.org/selenium-test-page/\n\
  \            browser.navigate(\"http://www.softpost.org/selenium-test-page/\");\n\
  \            browser.sync();\n            String html = browser.getPage().runJavaScript(\"\
  document.body. innerHTML;\");\n            System.out.println(\"HTML Source of the\
  \ page\" + html);\n            System.out.println(\"Scrolling to 20,100\");\n  \
  \          browser.getPage().runJavaScript(\"window.scrollTo(20,100);\");\n    \
  \        String documentState = browser.getPage().runJavaScript(\"document.readyState\"\
  );\n            System.out.println(\"Document is \" + documentState);\n        }\
  \ catch ( AssertionError ex ){\n            //Report the Exception\n           \
  \ Reporter.reportEvent(\"Exception\", \"Test failed\", Status, ex);\n          \
  \  throw ex;\n        } Finally {\n            //Close the browser\n           \
  \ browser.close ();\n        }\n    }\n}\n```\n\n# 10. 自动化 Windows \n\n## 10.1 自动化标准\
  \ Windows 应用\n要自动化标准的 Windows 应用，你需要在 LeanFT 项目中导入以下包 `com.hp.lft.sdk.stdwin`。这里是一个启动记事本并在其中输入文本的示例应用程序。然后它会尝试关闭记事本。之后，它点击了对话框上的“不保存”按钮。\n\
  \n```java\npackage leanft;\nimport com.hp.lft.sdk.Desktop;\nimport com.hp.lft.sdk.stdwin.*;\n\
  import org.junit.Test;\nimport static org.junit.Assert.assertEquals;\npublic class\
  \ NotepadTest extends BaseTest{\n    @Test\n    public void test() throws Exception\
  \ {\n        new ProcessBuilder(\"C:\\\\Windows\\\\System32\\\\notepad.exe\").start();\n\
  \        Thread.sleep(3000);\n        Window notepadWin = Desktop.describe(Window.class,\n\
  \            new WindowDescription.Builder().windowTitleRegExp(\"Notepad\").build());\n\
  \        Editor editor = notepadWin.describe(Editor.class,\n            new EditorDescription.Builder().nativeClass(\"\
  Edit\").windowClassRegExp(\"Edit\").build());\n        editor.sendKeys(\"This is\
  \ automated text\");\n        Thread.sleep(3000);\n        notepadWin.close();\n\
  \        Desktop.describe(Window.class, new WindowDescription.Builder()\n      \
  \      .ownedWindow(false).childWindow(false).windowClassRegExp(\"Notepad\").windowTitleRegExp(\"\
  Notepad\").build())\n            .describe(Dialog.class, new DialogDescription.Builder()\n\
  \                .text(\"Don't save\").build()).click();\n    }\n}\n```\n\n## 10.2\
