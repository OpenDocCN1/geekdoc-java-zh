  ![](img/image1682.jpg)\nTeamCity 中的 maven 构建日志\n\n### 16. 挑战与解决方案\n#### 16.1 LeanFT\
  \ 自动化挑战\n以下是主要的 `LeanFT` 挑战列表。\n\n1. `LeanFT` 不支持第三方控件。我们必须使用 `Native` 对象。\n2. 嵌套表格中的动态元素如复选框、按钮、单选按钮。我们必须使用\
  \ `HTML DOM` 处理。\n\n#### 16.2 使用 Native 属性和方法操作第三方对象\n下面的示例说明了如何在 `LeanFT` 中访问 `native\
  \ 属性`。在下面的示例中，我们使用 `native value` 属性设置输入框的值。我们还使用了 `native click` 方法进行点击。\n\n```java\n\
  package leanft;\nimport com.hp.ft.report.Reporter;\nimport com.hp.ft.report.Status;\n\
  import com.hp.ft.sdk.NativeObject;\nimport org.junit.Test;\nimport java.util.List;\n\
  \npublic class ChromeTest extends BaseTest {\n    @Test\n    public void test()\
  \ throws Exception {\n        Browser browser = BrowserFactory.launch(BrowserType.ROME);\n\
  \        try {\n            //导航到 http://soft.post.org/test-page/\n            browser.navigate(\"\
  http://soft.post.org/test-page/\");\n            browser.sync();\n            //在输入框设置值\n\
  \            browser.describe(EditField.class, new EditField.Builder()).id(\"fn\"\
  ).build()).setValue(\"S\");\n            //获取原生对象\n            NativeObject obj\
  \ = browser.describe(EditField.class, new EditField.Builder()).id(\"fn\").build()).getNativeObject();\n\
  \            //列出对象的成员\n            List<String> list = obj.getMembers();\n    \
  \        for (String s : list) {\n                System.out.println(s);\n     \
  \       }\n            obj.setProperty(\"value\", \"Native\");\n            Thread.sleep(3000);\n\
  \            //使用原生方法点击 Home 链接\n            browser.describe(Link.class, new Link.Builder()).tagName(\"\
  A\").innerText(\"Home\").build()).getNativeObject().invokeMethod(\"click\");\n \
  \       } catch (AssertionError ex) {\n            //报告异常\n            Reporter.reportEvent(\"\
  Exception\", \"测试失败\", Status.Failed, ex);\n            throw ex;\n        } finally\
  \ {\n            //关闭浏览器\n            browser.close();\n        }\n    }\n}\n```\n\
  \n### 17. LeanFT 常见问题与解决方案\n列出了在使用 `LeanFT` 工作期间可能遇到的常见问题及其解决方案。\n\n1. `无法连接到位于....\
  \ 的 LeanFT 运行时` 此异常发生在 `LeanFT` 运行时未运行时。只需启动引擎，该错误就会消失。\n2. `发生内部问题，请确保已正确初始化 LeanFT\
  \ SDK....` 此异常发生在你未初始化 `LeanFT SDK` 时。为了消除此异常，请在代码开头添加以下行。\n\n```java\nModifiableSDKConfiguration\
  \ config = new ModifiableSDKConfiguration();\nconfig.setServerAddress(new URI(\"\
  ws://localhost:5095\"));\nSDK.init(config);\n```\n3. `启用 LeanFT 插件时 IntelliJ IDEA\
  \ 无法启动` – 要修复此此问题，请在进程管理器中结束 `IntelliJ IDEA` 的 `LeanFT` 插件。\n\n\n\n\n\n### 4. 异常说明\n\
  - `com.hp.lft.sdk.ReplayObjectNotUniqueException`: 对象不唯一 – 当 LeanFT 找到多个匹配描述的对象时抛出此异常。要解决此问题，你需要添加更多属性以便识别出唯一对象。\n\
  - `Object not found` – 未找到对象 – 当 LeanFT 无法在应用程序中找到对象时抛出此异常。要解决此问题，请确保该对象确实存在于应用程序中，并且使用的是正确的描述来识别该对象。\n\
  \n### 18. LeanFT 与与其他工具对比\n\n#### 18.1 HP UFT 与 LeanFT 的区别\n以下是 UFT 和 LeanFT 之间的主要差异列表。\n\
  \n1. UFT 脚本只能使用 VBScript 编写。\n2. LeanFT 脚本可以使用 `Java`、`C#.Net` 和 JavaScript 等。\n\
  3. LeanFT 不支持 `Oracle`、`Siebel`、`PeopleSoft`、`Delphi`、`Power Builder`、`Stingray`、`Flex`、`VisualAge`\
  \ 等技术的自动化。UFT 支持所有这些平台。\n\n#### 18.2 LeanFT 与 Selenium 及 Ranorex 的比较\n根据我的经验，我可以说\
  \ LeanFT 和 Ranorex 在功能上是对同的。\n\n##### Selenium 与 LeanFT 的区别\n1. Selenium 与 LeanFT（以及\
  \ Ranorex）之间最大的区别是 Selenium 仅支持网页自动化，不支持窗口应用程序。但 LeanFT 和 Ranorex 可以非常轻松地自动化 Web\
  \ 应用以及窗口和表单。\n2. Selenium 与另外两个工具的另一个主要区别是 Selenium 是免费的！\n\n##### LeanFT 与 Ranorex\
  \ 的区别\n1. LeanFT 由 HP 开发，而 Ranorex 由 Ranorex Gmbh 开发。\n2. Ranorex 编码只能用 `C#.Net`\
  \ 完成，而 LeanFT 既可以使用 `C#.Net` 也可以使用 `Java`。\n3. Ranorex 使用 `xpath` 来识别窗口以及 Web 中的对象。LeanFT\
  \ 使用属性值对来识别 Windows 应用中的对象。LeanFT 也支持 Web 应用中的 `xpath`。\n\n### 19. LeanFT Java 参考\n\
  你可以在以下 URL 找到 LeanFT 资源。\n\n1. `http://leanft-help.saas.hpe.com/en/12.52/HelpCenter/Content/HelpCenterRoot/DemoApps.htm`\
  \ - HP 提供的示例应用程序\n2. `http://leanft-help.saas.hpe.com/en/12.52/JavaSDKReference/index.html?com/hp/lft/sdk/example-files/master-examples-list.html`\
  \ - Java 示例\n3. `http://leanft-help.saas.hpe.com/en/12.52/JavaSDKReference/index.html`\
  \ - LeanFT Java SDK\n4. `http://leanft-help.saas.hpe.com/en/12.52/HelpCenter/Content/HowTo/UFT_OR_Converter.htm`\
  \ - 将 UFT 对象库转换为 LeanFT 中的应用程序模型\n5. `http://leanft-help.saas.hpe.com/en/12.52/HelpCenter/Content/HowTo/RunRemotely.htm`\
  \ - 在 LeanFT 中远程执行测试\n6. `http://leanft-help.saas.hpe.com/en/12.52/HelpCenter/Content/HowTo/CI_Tools.htm`\
  \ - 将 LeanFT 与 TeamCity 等 CI 服务器集成\n\n"
