  \ SAP 包 `com.hp.lft.sdk.sap.*`。\n\n# 11. 同步\n默认情况下，LeanFT 在尝试查找对象时等待 20 秒。如果 20\
  \ 秒内未识别对象，则会抛出异常。你可以在 LeanFT 设置对话框中更改超时时间。此外，你还可以添加自定义等待条件。\n\n```java\npackage\
  \ leanft;\nimport com.hp.lft.sdk.GeneralLeanFtException;\nimport com.hp.lft.sdk.*;\n\
  import com.hp.lft.sdk.stdwin.ToolBar;\nimport com.hp.lft.sdk.stdwin.Window;\nimport\
  \ com.hp.lft.sdk.stdwin.WindowDescription;\nimport org.junit.Assert;\nimport org.junit.Test;\n\
  /**\n * Created by Sagar on 21 - 07 - 2016.*/\npublic class SynchTest extends BaseTest{\n\
  \    @Test\n    public void test1() throws Exception {\n        WaitUntilTestObjectState.WaitUntilEvaluator<\
  \ Window > evaluator = new WaitUntilTestObjectState.WaitUntilEvaluator< Window >()\
  \ {@Override\n            public boolean evaluate( Window testObject) throws GeneralLeanFtException{\n\
  \                return testObject.getWindowState()==WindowState.MAXIMIZED;}};\n\
  \        new ProcessBuilder(\"C:\\\\Windows\\\\System32\\\\notepad.exe\").start();\n\
  \        Thread.sleep(3000);\n        Window notepadWindow = Desktop.describe(Window.class,\n\
  \            new WindowDescription.Builder().windowClassRegExp(\"Notepad\").windowTitleRegExp(\"\
  Notepad\").build());\n        notepadWindow.maximize();\n        Assert.assertTrue(evaluator.evaluate(notepadWindow));\n\
  \    }\n}\n```\n\n# 12. 断言与报告\n\n## 12.1 LeanFT 中的断言\n我们可以使用 Validations 命名空间下的\
  \ `Verify` 类在 LeanFT 中进行断言。该类允许你在代码中放置断言。这里是一个显示 `Verify` 类用用的示例。注意 `Verify` 类提供了以下方法。\n\
  \n\n\n\n\n## 验证方法\n\n1. `areEqual`, `areNotEqual`\n2. `isTrue`, `isFalse`\n3. `startsWith`,\
  \ `contains`, `endsWith`\n4. `lessOrEqual`, `less`, `greater`, `greaterOrEqual`\n\
  5. `isMatch`\n6. `isNullOrEmpty`, `isNotNullOrEmpty`\n\n```java\npackage leanft;\n\
  import com.hp.lft.report.Reporter;\nimport com.hp.lft.report.Status;\nimport com.hp.lft.sdk.ModifiableSDKConfiguration;\n\
  import com.hp.lft.sdk.SDK;\nimport com.hp.lft.sdk.web.*;\nimport com.hp.lft.sdk.web.EditField;\n\
  import com.hp.lft.sdk.web.EditFieldDescription;\nimport com.hp.lft.verifications.Verify;\n\
  import org.junit.Test;\nimport java.net.URI;\nimport static org.junit.Assert.assertEquals;\n\
  public class ChromeTest extends BaseTest{\n    @Test\n    public void test() throws\
  \ Exception    {\n        Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n\
  \        Try {\n            //导航到 http://www.softpost.org/selenium-test-page/\n\
  \            browser.navigate( \"http://www.softpost.org/selenium-test-page/\" );\n\
  \            browser.sync();\n            //在输入框中设置值\n            browser.describe(EditField.class,\
  \ new EditFieldDescription.Builder()\n                .id( \"fn\" ).build()).setValue(\
  \ \"Sagar\" );\n            //点击 Home 链接\n            browser.describe(Link.class,\
  \ new LinkDescription.Builder()\n                .tagName( \"A\" ).innerText( \"\
  Home\" ).build()).click();\n            //等待页面加载\n            browser.sync();\n\
  \            Verify.isTrue(browser.getTitle().toLowerCase().contains( \"tutorial\"\
  \ ), \"Verifying the title of Home page\" );\n        } catch (AssertionError ex){\n\
  \            //报告异常\n            Reporter.reportEvent( \"Exception\" , \"Test failed\"\
  \ , Status.Failed, ex);\n            throw ex;\n        } Finally {\n          \
  \  //关闭浏览器\n            browser.close();\n        }\n    }\n}\n```\n\n这里是显示验证点的\
  \ HTML 报告。\n![](img/image1384.jpg)\nLeanFT 中的 Verify 类。\n\n## 12.2 生成带有截图和录屏的报告\n\
  \nLeanFT 中可以通过两种方式生成报告。\n\n1. 使用 `Reporter` 和 `TestObject.GetSnapshot` 截屏。\n2. 使用\
  \ Microsoft expression encoder 进行测试执行的视频录制。\n\n默认情况下，LeanFT 在 Java 项目根目录下的 `RunResults`\
  \ 文件夹中创建报告。但你可以像下面的示例一样使用 `ModifiableReportConfiguration` 类进行更改。你也可以使用以下方法将你的日志消息发送到报告。\n\
  \n### `Reporter.reportEvent` \n\n```java\npackage leanft;\nimport com.hp.lft.report.*;\n\
  import com.hp.lft.sdk.Desktop;\nimport com.hp.lft.sdk.stdwin.Window;\nimport com.hp.lft.sdk.stdwin.WindowDescription;\n\
  import com.hp.lft.sdk.web.*;\nimport com.hp.lft.verifications.Verify;\nimport org.junit.Test;\n\
  import java.awt.image.RenderedImage;\npublic class ChromeReportTest extends BaseTest\
  \ {\n    @Test\n    public void test () throws Exception{\n        ModifiableReportConfiguration\
  \ reportConfig = ReportConfigurationFactory.createDefaultReportConfiguration();\n\
  \        reportConfig.setOverrideExisting( true );\n        reportConfig.setTargetDirectory(\
  \ \"RunResults\" ); // 该文件夹必须在 C:\\ 下存在\n        reportConfig.setReportFolder( \"\
  myreportdirectory\" );\n        reportConfig.setTitle( \"My Report\" );\n      \
  \  reportConfig.setDescription( \"Report Description\" );\n        reportConfig.setSnapshotsLevel(Level.OnError);\n\
  \        Reporter.init(reportConfig);\n        Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n\
  \        Try {\n            //导航到 http://www.softpost.org/selenium-test-page/\n\
  \            browser.navigate( \"http://www.softpost.org/selenium-test-page/\" );\n\
  \            browser.sync();\n            //在输入框中设置值\n            EditField firstName\
  \ = browser.describe(EditField.class , EditFieldDescription.Builder()\n        \
  \        .id( \"fn\" ).build());\n            firstName.setValue( \"Sagar\" );\n\
  \            //截图\n            RenderedImage img = browser.getPage().getSnapshot();\n\
  \            if (firstName.getValue().equalsIgnoreCase( \"sagar\" )) {\n       \
  \         Reporter.reportEvent( \"Verify Editbox\" , \"Value is sagar\" , Status.Passed,img);\n\
  \            } else {\n                Reporter.reportEvent( \"Verify Editbox\"\
  \ , \"Value is not sagar\" , Status.Failed,img);\n            }\n        } catch\
  \ (AssertionError ex){\n            //报告异常\n            Reporter.reportEvent( \"\
  Exception\" , \"Test failed\" , Status.Failed, ex);\n            throw ex;\n   \
  \     } Finally {\n            //关闭浏览器\n            browser.close();\n        }\n\
  \    }\n}\n```\n\n这里是使用上述代码生成的示例报告。\n![](img/image1451.jpg)\nLeanFT 中显示运行期间捕获截图的\
  \ HTML 报告\n\n## 13. LeanFT 框架\n\n### 13.1 与 Cucumber 的 LeanFT\n\n我们可以将 LeanFT 测试与\
  \ Cucumber BDD 框架集成。如果你知道如何使用 Cucumber，就可以轻松地集成 LeanFT。请按照以下步骤操作：\n\n1. 使用 Cucumber\
  \ 创建 LeanFT 测试。\n2. 在 pom.xml 中添加 `cucumber` 和 `selenium` 依赖。\n3. 编写 feature 文件。\n\
  4. 为场景编写步骤定义。\n5. 执行 feature 文件。\n\n这里是需要添加 cucumber 的依赖：\n\n```xml\n<dependency>\n\
  \    <groupId>info</groupId>\n    <artifactId>cucumber-java</artifactId>\n    <version>1.4</version>\n\
  \    <scope>test</scope>\n</dependency>\n```\n\n然后你需要按照下面的示例创建 feature 文件：\n\n```gherkin\n\
  Feature: My feature\nScenario: My Scenario\nGiven I am on softpost.org page\nThen\
  \ I verify that title contains tutorial\n```\n\n之后你可以按照示例创建步骤定义：\n\n```java\npackage\
  \ org.softpost;\nimport com.hp.lft.report.Reporter;\nimport com.hp.lft.sdk.ModifiableReportConfiguration;\n\
  import com.hp.lft.sdk.SDK;\nimport com.hp.lft.sdk.web.Browser;\nimport com.hp.lft.sdk.web.BrowserFactory;\n\
  import com.hp.lft.sdk.web.BrowserType;\nimport cucumber.api.java.After;\nimport\
  \ cucumber.api.java.Before;\nimport cucumber.api.java.en.Given;\nimport cucumber.api.java.en.Then;\n\
  import org.junit.Assert;\nimport java.net.URI;\n/**\n * 由 Sagar 创建于 23 -2016.*/\n\
  public class Steps{\n    Browser browser;\n    @Before\n    public void init() throws\
  \ Exception {\n        ModifiableSDKConfiguration config = new ModifiableSDKConfiguration();\n\
  \        config.setServerAddress( new URI( \"ws://localhost:5095\" ));\n       \
  \ SDK.init(config);\n        Reporter.init();\n    }\n    @Given( \"^I am on softpost\\\
  .org page$\" )\n    public void i_am_on_softpost_page() throws Throwable{\n    \
  \    browser = BrowserFactory.launch(BrowserType.CHROME);\n        browser.navigate(\
  \ \"http://www.softpost.org\" );\n    }\n    @Then( \"^I verify that title contains\
  \ tutorial$\" )\n    public void i_verify_that_title_contains_tutorial() throws\
  \ Throwable {\n        Assert.assertTrue(browser.getTitle().toLowerCase().contains(\
  \ \"tutorial\" ));\n    }\n    @After\n    public void clean() throws Exception\
  \ {\n        browser.close();\n        SDK.cleanup();\n    }\n}\n```\n\n### 13.2\
  \ 关键字驱动框架\n\n关键字驱动框架在 LeanFT 中非常流行。请按照以下步骤创建关键字驱动框架：\n\n1. 查找应用程序的主要操作和功能。\n2. 将每个功能映射到关键字。\n\
  3. 编写自动化特定关键字的代码。\n4. 创建由一个或多个关键字组成的测试用例。你可以将测试表存储在 Excel 文件、数据库或 `JUnit` 或 `TestNG`\
  \ 测试类中。\n5. 除非你使用 `JUnit` 或 `TestNG` 执行测试，否则你可能需要创建一个驱动脚本来执行每个用例。\n\n这里是 HP 提供的\
  \ WPF 应用程序案例研究。在此应用程序中我们可以为每个主要功能创建一个关键字，如登录应用程序、搜索航班、选择航班、下单、搜索订单、删除订单、取消订单、预订机票、验证航班。然后我们可以使用上述相同的关键字创建各种用户场景的测试用例。这里是使用上述关键字创建的两个用例。注意，在下面的用例中，我们重用了登录关键字。\n\
  \n这里是搜索航班的测试用例：\n\n1. 登录航班应用程序。\n2. 搜索下周从伦敦飞往巴黎的单人航班。\n\n\n\n\n\n### 3. 验证仅显示从伦敦到巴黎的航班。\n\
  \n这里是搜索订单的测试用例。\n\n1. 登录 `Flight` 应用程序。\n2. 预订航班并记录订单号，例如 `88`。\n3. 搜索 ID 为 `88`\
  \ 的订单。\n4. 验证航班详情是否显示正确。\n\n### 13.3 数据驱动框架\n当你需要使用各种类型的数据对应用程序进行测试时，就会数据驱动框架。你可以按照以下格式存储数据。\n\
  \n1. Microsoft Excel 文件\n2. 数据库\n\n在数据驱动框架中，我们测试同一个功能，但使用不同的数据集。例如，在 HP 航班应用程序中，我们可以使用\
  \ `User Id` 和 `Password` 的不同组合来测试 `Login` 功能。请注意，此处的 `Login` 功能是相同的，但在每次运行期间测试数据是不同的。\n\
  \n### 14. 将 UFT 对象库转换为 LeanFT 中的应用程序模型\n我们可以使用下面的命令行工具将对象库转换为 LeanFT 中的应用程序模型。\n\
  ![](img/image1586.jpg)\n\n#### Java 版 OR2AppModelConverter\n以下是该工具的语法。\n\n```\n\
  OR2AppModelConverter myuftOR.tsr myAppModel.tsrx myLogFile.log\n```\n**警告**：第一个参数是对象库文件的路径。第二个参数是应用程序模型文件的路径。第三个参数是日志文件的路径，最后一个参数是日志级别（可以是\
  \ `Info`、`Warning` 或 `Error`）。\n\n### 15. 将 FT 测试集成到 CI 服务器\n#### 15.1 在 Bamboo\
