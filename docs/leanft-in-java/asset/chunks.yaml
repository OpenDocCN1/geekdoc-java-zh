    ### 4. 异常说明

    - `com.hp.lft.sdk.ReplayObjectNotUniqueException`: Object not unique – This exception
    comes comes when LeanFT finds more than one object matching the description. To
    fix this issue, you need to add more properties so that only one object is identified
    .

    - `Object not found` – This exception comes when LeanFT is not able to find the
    object in the application. To fix this issue, ensure that object really exists
    in the application and you are using correct description to identify the object.


    ### 18. Comparing LeanFT with other tools


    #### 18.1 Difference between HP UFT and LeanFT

    Here is the list of main differences between UFT and LeanFT.


    1. UFT scripts can be written in VBScript only.

    2. LeanFT scripts can be written in languages like `Java`, `C#.Net` and Java script.

    3. LeanFT does not support automation of various technologies like `Oracle`, `Siebel`,
    `PeopleSoft`, `Delphi`, `Power Builder`, `Stingray`, `Flex`, `VisualAge`. UFT
    supports all these platforms.


    #### 18.2 Comparison of LeanFT with Selenium and Ranorex

    Based upon my experience, I can say that LeanFT and Ranorex are equivalent in
    terms of features.


    ##### Difference between Selenium and LeanFT

    1. Biggest difference between Selenium and LeanFT (and Ranorex) is that Selenium
    can only support automation of web pages and not windows applications. But LeanFT
    and Ranorex can automate the windows and forms very easily along with web application.

    2. Another major difference between Selenium and other 2 tools is that Selenium
    is free !


    ##### Difference between LeanFT and Ranorex

    1. LeanFT is developed by HP while Ranorex is developed by Ranorex Gmbh.

    2. Ranorex coding can be done only in `C#.Net` While LeanFT can be coded in `C#.Net`
    as well as `Java`.

    3. Ranorex uses `xpath` to identify objects in windows as well as web applications.
    LeanFT uses property value pairs to identify the objects in Windows apps. LeanFT
    also supports `xpath` in web applications.


    ### 19. LeanFT Java References

    You can find the LeanFT resources at below urls.


    1. `http://leanft-help.saas.hpe.com/en/12.52/HelpCenter/Content/HelpCenterRoot/DemoApps.htm`
    - Demo applications provided by HP

    2. `http://leanft-help.saas.hpe.com/en/12.52/JavaSDKReference/index.html?com/hp/lft/sdk/example-files/master-examples-list.html`
    - Sample examples in Java

    3. `http://leanft-help.saas.hpe.com/en/12.52/JavaSDKReference/index.html` - LeanFT
    Java SDK

    4. `http://leanft-help.saas.hpe.com/en/12.52/HelpCenter/Content/HowTo/UFT_OR_Converter.htm`
    - Coverting UFT Object repository into Application models in LeanFT

    5. `http://leanft-help.saas.hpe.com/en/12.52/HelpCenter/Content/HowTo/RunRemotely.htm`
    - Executing the tests remotely in LeanFT

    6. `http://leanft-help.saas.hpe.com/en/12.52/HelpCenter/Content/HowTo/CI_Tools.htm`
    - Integrating LeanFT with CI servers like TeamCity

    '
