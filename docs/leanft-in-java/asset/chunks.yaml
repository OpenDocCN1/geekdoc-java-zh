    \ new ModifiableSDKConfiguration();\n        config.setServerAddress( new URI(\
    \ \"ws://localhost:5095\" ));\n        SDK.init(config);\n        Reporter.init();\n\
    \    }\n    @Given( \"^I am on www\\.softpost\\.org page$\" )\n    public void\
