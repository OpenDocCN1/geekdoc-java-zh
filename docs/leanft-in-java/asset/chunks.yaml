    \ \"tutorial\" ));\n    }\n    @After\n    public void clean() throws Exception\
    \ {\n        browser.close();\n        SDK.cleanup();\n    }\n}\n```\n\n### 13.2\
    \ Keyword Driven frameworks\n\nKeyword driven frameworks are very popular in LeanFT.\
    \ Please follow below steps to create keyword driven framework.\n\n1. Find main\
    \ operations and features of the application.\n2. Map each feature or operation\
    \ to a keyword.\n3. Write a code to automate specific keyword.\n4. Create test\
    \ sheet containing test cases made up of one or more keywords. You can store the\
