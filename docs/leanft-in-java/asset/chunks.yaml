  trans: "\n\n如果你已经安装了 IntelliJ IDEA 的 LeanFT 插件，你可以像下图所示从模板创建新项目。注意，我们可以根据 4 种模板创建项目。\n\
    \n![](http://www.softpost.org/wp-content/uploads/2016/07/New-LeanFT-project-in-IntelliJ-IDEA.png)\n\
    IntelliJ IDEA 中新建 LeanFT 项目\n\n![](http://www.softpost.org/wp-content/uploads/2016/07/Sample-LeanFT-project-structure.png)\n\
    LeanFT 项目结构示例\n\n要创建你自己的自定义框架，你必须像下面的示例所示初始化并清理 SDK。注意，在接下来的所有示例中，我们都继承了 `BaseTest`\
    \ 类。\n\n```java\npackage leanft;\nimport com.hp.lft.report.Reporter;\nimport com.hp.lft.sdk.ModifiableSDKConfiguration;\n\
    import com.hp.lft.sdk.SDK;\nimport org.junit.After;\nimport org.junit.Before;\n\
    import java.net.URI;\n\npublic class BaseTest {\n    @Before\n    public void\
    \ test() throws Exception {\n        ModifiableSDKConfiguration config = new ModifiableSDKConfiguration();\n\
    \        config.setServerAddress(new URI(\"ws://localhost:5095\"));\n        SDK.init(config);\n\
    \        Reporter.init();\n    }\n\n    @After\n    public void clean() throws\
    \ Exception {\n        Reporter.generateReport();\n        SDK.cleanup();\n  \
    \  }\n}\n```\n\n然后我们可以像下面的示例编写测试方法。\n\n```java\npackage leanft;\nimport com.hp.lft.report.Reporter;\n\
    import com.hp.lft.report.Status;\nimport com.hp.lft.sdk.ModifiableSDKConfiguration;\n\
    import com.hp.lft.sdk.SDK;\nimport com.hp.lft.sdk.web.*;\nimport com.hp.lft.sdk.web.EditField;\n\
    import com.hp.lft.sdk.web.EditFieldDescription;\nimport org.junit.Test;\nimport\
    \ java.net.URI;\nimport static org.junit.Assert.assertEquals;\n\npublic class\
    \ ChromeTest extends BaseTest {\n    @Test\n    public void test() throws Exception\
    \ {\n        Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n  \
    \      try {\n            //Navigate to http://www.softpost.org/selenium-test-page/\n\
    \            browser.navigate(\"http://www.softpost.org/selenium-test-page/\"\
    );\n            browser.sync();\n        } catch (AssertionError ex) {\n     \
    \       //Report the Exception\n            Reporter.reportEvent(\"Exception\"\
    , \"Test failed\", Status.Failed, ex);\n            throw ex;\n        } finally\
    \ {\n            //Close the browser\n            browser.close();\n        }\n\
    \    }\n}\n```\n\n# 7. Eclipse 中的 LeanFT 项目\n\n## 7.1 在 Eclipse 中创建带有 JUnit 的\
    \ LeanFT maven 项目\n下面的图片将帮助你理解如何在 Eclipse 中创建带有 JUnit 和 LeanFT 的 maven 项目。点击 New\
    \ project 菜单然后点击 Other。\n\n![]\nEclipse 中的 LeanFT - 带有 JUnit 的 Maven 项目\n\n然后如如下所示选择\
    \ LeanFT JUnit Maven project。\n\n![]\nEclipse 中的 LeanFT - Maven JUnit 模板\n\n为你的项目提供\
    \ group id 和 Artifact id。\n\n![]\nEclipse 中的 LeanFT - Maven JUnit 项目\n\n项目创建如如下所示。\n\
    \n![]\n然后如如下所示为 LeanFT 添加外部 jars 包。\n\n![]\n作为外部 jars 包添加 LeanFT 库\n\n在运行 maven\
    \ build 之后，你应该能够在 `RunResults` 目录中看到结果。\n\n## 7.2 在 Eclipse 中创建带有 TestNG 的 maven\
    \ 项目\n下面的图片将帮助你理解如何在 Eclipse 中设置带有 TestNG 的 LeanFT maven 项目。\n\n![]\nEclipse 中的\
    \ LeanFT - 带有 JUnit Maven 项目\n\n![]\nEclipse 中的 LeanFT TestNG group Id\n\n![]\n\
    Eclipse 中的 LeanFT TestNG Maven 项目\n\nLeanFT 将测试放在 `src/main/java` 目录中。你应该将这些测试类移动到\
    \ `src/test/java`，因为 maven 总是会在 `src/text/java` 目录中查找任何执行的测试。\n\n# 8. 对象识别与管理\n\
    \n## 8.1 描述编程\n通常在 UFT 中，我们使用对象库（LeanFT 中的应用程序模型）来存储应用程序内部的对象。因此，我们可以在自动化代码中使用这些对象，但我们也可以使用描述编程（description\
    \ programming）在代码本身中定义新的测试对象。\n\n下面的示例展示了如何在 LeanFT 中使用描述编程定义新的测试对象。我们使用了描述编程来定义了\
    \ 2 个类型为 `EditField` 和 `Link` 的对象。注意，我们可以使用多个属性-值对来识别这些对象。\n\n```java\n//Navigate\
    \ to http://www.softpost.org/selenium-test-page/\nbrowser.navigate(\"http://www.softpost.org/selenium-test-page/\"\
    );\nbrowser.sync();\n\n//Build edit box object and set value in it\nbrowser.describe(EditField.class,\
    \ new EditFieldDescription.Builder().id(\"fn\").build()).setValue(\"Sagar\");\n\
    \n//Build link object and click on it.\nbrowser.describe(Link.class, new LinkDescription.Builder().tagName(\"\
    A\").innerText(\"Home\").build()).click();\n```\n\n## 8.2 应用程序模型\n应用程序模型类似于 UFT\
    \ 中的对象库。我们可以像下图所示在 IntelliJ IDEA 中创建新的应用程序模型。\n\n![]\nIntelliJ IDE 中新建 LeanFT\
    \ 应用程序模型项\n\n![]\n下图显示了示例的 `AppModel.tsrx` 文件。在设计模式下，我们可以向应用程序模型添加或删除对象。\n\n![]\n\
    下图展示了如何使用对象识别中心（Object Identification Center）将对象添加到应用程序模型中。\n\n注意，创建新的应用程序模型后会生成\
    \ 2 个文件。\n\n1. `YourModel.tsrx` 文件 -这是一个 XML 文件。我们也可以在设计模式下查看此文件并在其中添加和编辑对象。\n\
    2. `YourModel.java` 文件包含表示应用程序模型对象的代码。\n\n"
- fmt: "\nBelow code shows how to use the application model to write the tests.\n\n\
    ```java\npackage leanft;\nimport com.hp.lft.sdk.web.Browser;\nimport com.hp.lft.sdk.web.BrowserFactory;\n\
    import com.hp.lft.sdk.web.BrowserType;\nimport org.junit.Test;\n/**\n  * Created\
    \ by Sagar on 22 - 07 - 2016.\n*/\npublic class AppModelTest extends BaseTest{\n\
    \    @Test\n    public void test1() throws Exception {\n        Browser browser\
    \ = BrowserFactory.launch(BrowserType.CHROME);\n        browser.navigate( \"http://www.softpost.org/selenium-test-page/\"\
    \ );\n        AppModel model = new AppModel(browser);\n        model.SeleniumTestPage().firstName().setValue(\
    \ \"Sagar\" );\n    }\n}\n```\n\nAnother important point to note is that we can\
    \ use Application model together with description programming to identify the\
    \ objects as shown in below sample code. Note that we have used `SeleniumTestPage`\
    \ object from the Application model but we have used description programming to\
    \ identify the `EditField` object inside `page.model.SeleniumTestPage().describe(EditField.class,new\
    \ EditFieldDescription.Builder().id(\"fn\").build()).setValue(\"Salunke\");`.\n\
    \n### 8.3 Using regular expression in property values\nTo define the property\
    \ values of a object, we can use the regular expressions. Below example shows\
    \ how to use regular expressions to define the property values. Note that we are\
    \ clicking on such a link with inner text matching regular expression `.*Dev.*`.\n\
    \n```java\npackage leanft;\nimport com.hp.lft.report.Reporter;\nimport com.hp.lft.report.Status;\n\
    import com.hp.lft.sdk.RegExpProperty;\nimport com.hp.lft.sdk.web.*;\nimport org.junit.Test;\n\
    public class RegularExpressionTest extends BaseTest{\n    @Test\n    public void\
    \ test() throws Exception {\n        Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n\
    \        Try {\n            //Navigate to http://www.softpost.org/selenium-test-page/\n\
    \            browser.navigate( \"http://www.softpost.org/selenium-test-page/\"\
    \ );\n            browser.sync();\n            //set value in edit box\n     \
    \       browser.describe(EditField.class, new EditFieldDescription.Builder()\n\
    \            .id( \"fn\" ).build()).setValue( \"Sagar\" );\n            //click\
    \ on link containing Dev substring\n            browser.describe(Link.class, new\
    \ LinkDescription.Builder()\n            .tagName( \"A\" ).index(1).innerText(\
    \ RegExpProperty( \".*Dev.*\" )).build()).click();\n            //Wait until page\
    \ loads\n            Thread .sleep(300);\n        } catch (AssertionError ex)\
    \ {\n            //Report the Exception\n            Reporter.reportEvent( \"\
    Exception\" , \"Test failed\" , Status.Failed, ex);\n            throw ex;\n \
    \       } Finally {\n            //Close the browser\n            browser.close();\n\
    \        }\n    }\n}\n```\nWe can also use regular expressions to specify values\
    \ of object properties in Application Models.\n\n---\n\n### 9. Automating Web\
    \ applications\n\n#### 9.1 First web application test\nHere is the first web application\
    \ test using LeanFT. In below code, we are launching the chrome browser then navigating\
    \ to `http://www.softpost.org/selenium-test-page/`. After that we are entering\
    \ value in edit box and clicking on Home link. Same code will work on other browsers\
    \ (Firefox, Internet Explorer, Edge) as well. To launch other browsers, you need\
    \ to change the browser type in launch method.\n\n```java\npackage leanft;\nimport\
    \ com.hp.lft.report.Reporter;\nimport com.hp.lft.report.Status;\nimport com.hp.lft.sdk.ModifiableSDKConfiguration;\n\
    import com.hp.lft.sdk.SDK;\nimport com.hp.lft.sdk.web.*;\nimport com.hp.lft.sdk.web.EditField;\n\
    import com.hp.lft.sdk.web.EditFieldDescription;\nimport org.junit.Test;\nimport\
    \ java.net.URI;\nimport static org.junit.Assert.assertEquals;\npublic class ChromeTest\
    \ extends BaseTest{\n    @Test\n    public void test() throws Exception {\n  \
    \      Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n        Try\
    \ {\n            //Navigate to http://www.softpost.org/selenium-test-page/\n \
    \           browser.navigate( \"http://www.softpost.org/selenium-test-page/\"\
    \ );\n            browser.sync();\n            //set value in edit box\n     \
    \       browser.describe(EditField.class, new EditFieldDescription.Builder()\n\
    \            .id( \"fn\" ).build()).setValue( \"Sagar\" );\n            //click\
    \ on Home link\n            browser.describe(Link.class, new LinkDescription.Builder()\n\
    \            .tagName( \"A\" ).innerText( \"Home\" ).build()).click();\n     \
    \       //Wait until page loads\n            browser.sync();\n        } catch\
    \ (AssertionError ex) {\n            //Report the Exception\n            Reporter.reportEvent(\
    \ \"Exception\" , \"Test failed\" , Status.Failed, ex);\n            throw ex;\n\
    \        } Finally {\n            //Close the browser\n            browser.close();\n\
    \        }\n    }\n}\n```\nNote that `BaseTest` class provides code to initialize\
    \ and clean up the LeanFT SDK.\n\n```java\npackage leanft;\nimport com.hp.lft.report.Reporter;\n\
    import com.hp.lft.sdk.ModifiableSDKConfiguration;\nimport com.hp.lft.sdk.SDK;\n\
    import org.junit.After;\nimport org.junit.Before;\nimport java.net.URI;\npublic\
    \ class BaseTest{\n    @Before\n    public void init() {\n        try {\n    \
    \        ModifiableSDKConfiguration config = new ModifiableSDKConfiguration();\n\
    \            config.setServerAddress( new URI( \"ws://localhost:095\" ));\n  \
    \          SDK.init(config);\n            Reporter.init();\n        } catch (\
    \ Exception ex) {\n            System.out.println( \"Exception \" + ex.toString());\n\
    \        }\n    }\n    @After\n    public void clean() throws Exception {\n  \
    \      Reporter.generateReport();\n        SDK.cleanup();\n    }\n}\n```\n\n####\
    \ 9.2 Identifying the Web elements using XPATH and CSS\nWe can use `XPATH` and\
    \ CSS` selectors to identify the web elements. Below example illustrates how to\
    \ use `XPATH` in LeanFT. In below example, we identified edit box using `XPATH`.\
    \ For more advanced `XPATH` expressions, you can visit - `http://selenium-interview-questions.blogspot.in/2014/02/how-to-identify-elements-using-xpath-in.html`.\
    \ For more advanced CSS expressions, you can visit - `http://selenium-interview-questions.blogspot.in/2014/02/how-to-identify-elements-using.html`.\n\
    \n```java\npackage leanft;\nimport com.hp.lft.report.Reporter;\nimport com.hp.lft.report.Status;\n\
    import com.hp.lft.sdk.web.*;\nimport org.junit.Test;\npublic class CsspathTest\
    \ extends BaseTest{\n    @Test\n    public void test() throws Exception {\n  \
    \      Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n        Try\
    \ {\n            //Navigate to http://www.softpost.org/selenium-test-page/\n \
    \           browser.navigate( \"http://www.softpost.org/selenium-test-page/\"\
    \ );\n            browser.sync();\n            //set value in edit box using xpath\n\
    \            browser.describe(EditField.class, new EditFieldDescription.Builder()\n\
    \            .xpath( \"//input[@id='fn']\" ).build()).setValue( \"Sagar\" );\n\
    \            //set value in edit box using css\n            browser.describe(EditField.class,\
    \ new EditFieldDescription.Builder()\n            .cssSelector( \"input[id='fn']\"\
    \ ).build()).setValue( \"Salunke\" );\n        } catch (AssertionError ex) {\n\
    \            //Report the Exception\n            Reporter.reportEvent( \"Exception\"\
    \ , \"Test failed\" , Status.Failed, ex);\n            throw ex;\n        } Finally\
    \ {\n            //Close the browser\n            browser.close();\n        }\n\
    \    }\n}\n```\n\n#### 9.3 Identifying objects using Visual Relational Identifiers\
    \ – VRI\nThis is the advanced feature in UFT and LeanFT that allows you to identify\
    \ the objects based upon the position of adjacent objects. For example in below\
    \ image we can identify the edit box using text associated with it.\n\n####RI\
    \ in LeanFT\nHere is the complete example that shows how to use VRI in LeanFT.\
    \ Note that we can provide multiple visual relational identifiers to identify\
    \ a object.\n\n```java\npackage leanft;\nimport com.hp.lft.report.Reporter;\n\
    import com.hp.lft.report.Status;\nimport com.hp.lft.sdk.HorizontalVisualRelation;\n\
    import com.hp.lft.sdk.VisualRelation;\nimport com.hp.lft.sdk.web.*;\nimport org.junit.Test;\n\
    public class Vri extends BaseTest{\n    @Test\n    public void test() throws Exception\
    \ {\n        Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n  \
    \      Try {\n            //Navigate to http://www.softpost.org/selenium-test-page/\n\
    \            browser.navigate( \"http://www.softpost.org/selenium-test-page/\"\
    \ );\n            browser.sync();\n            //set value in edit box\n     \
    \       browser.describe(EditField.class, new EditFieldDescription.Builder()\n\
    \            .id( \"fn\" ).build()).setValue( \"Sagar\" );\n            WebElement\
    \ e2 = browser.describe(WebElement.class, new WebElementDescription.Builder()\n\
    \            .xpath( \"//td[text()='Last Name']\" ).build());\n            browser.describe(EditField.class,\
    \ new EditFieldDescription.Builder()\n            .vri( new VisualRelation().setTestObject(e2).setHorizontalRelation(HorizontalVisualRelation.LEFT_AND_INLINE)).build())\n\
    \            .setValue( \"Salunke\" );\n            //click on Home link\n   \
    \         browser.describe(Link.class, new LinkDescription.Builder()\n       \
    \     .tagName( \"A\" ).innerText( \"Home\" ).build()).click();\n            //Wait\
    \ until page loads\n            browser.sync();\n        } catch (AssertionError\
    \ ex) {\n            //Report the Exception\n            Reporter.reportEvent(\
    \ \"Exception\" , \"Test failed\" , Status.Failed, ex);\n            throw ex;\n\
    \        } Finally {\n            //Close the browser\n            browser.close();\n\
    \        }\n    }\n}\n```\n\n#### 9.4 Handling embedded browser control in Windows\
    \ app\nSometimes, Windows application have elements that embed the browser control.\
    \ To identify the elements inside the browser control as Web elements, you will\
    \ have to register the browser control with LeanFT. To register the browser control\
    \ with LeanFT, follow below steps.\n"
