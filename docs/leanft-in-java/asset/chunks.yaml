    事实上，所有由 UFT (QTP) 支持的应用也都 LeanFT 支持。


    # 3. 安装


    ## 3.1 安装 LeanFT 及 IDE 插件

    首先访问 [https://saas.hpe.com/en-us/software/leanft] 并下载 LeanFT 试用。

    在开始 LeanFT 安装过程之前，请确保以下几点：


    1. 你的系统中已经安装了 `node.js` 和 IDE 工具（`Visual Studio`、`IntelliJ IDEA`、`Eclipse`）。

    2. 已禁用杀毒软件。


    在安装时，你将选择安装哪些插件。


    默认情况下，LeanFT 安装在 `C:\Program Files (x86)\HP\LeanFT`。


    安装完成后，启动 LeanFT 引擎（从安装目录或 Windows 开始菜单）。默认情况下，LeanFT 服务运行在端口 `5095`。下图显示了安装过程中的安装选项。请选择勾选
    visual studio 和 Eclipse 选项的完整安装![](img/image163.jpg)


    如果你在系统中安装了 IntelliJ，将看到下面的界面。只需勾选 IntelliJ IDEA 旁边的复选框，即可为 IntelliJ IDEA 安装 LeanFT
    插件![](img/image168.jpg)


    ### LeanFT 插件

    安装 LeanFT 后，如如下所示所示运行时引擎。默认情况下，引擎运行在端口 `5095`![](img/image175.jpg)


    ## 3.2 安装浏览器扩展

    安装 LeanFT 后，你可以在 LeanFT 安装目录下的以下位置查看浏览器扩展文件![](img/image182.jpg)


    ### LeanFT 浏览器扩展

    只需将扩展文件拖放到浏览器中。当你将这些扩展文件拖入浏览器时，浏览器将安装这些扩展。

    如果没有在浏览器中安装并启用这些扩展，你将无法自动化 Web 应用。下图显示了在 Chrome 浏览器中启用的 LeanFT 扩展![](img/image190.jpg)


    ### Chrome 中的 LeanFT 扩展


    # 4. 入门


    ## 4.1 LeanFT 设置

    你可以从 IntelliJ IDEA IDE 内查看并编辑 LeanFT 设置，如下所示![](img/image203.jpg)


    ### LeanFT 引擎和对象识别设置![](img/image208.jpg)

    ### LeanFT 中的加载项![](http://www.softpost.org/wp-content/uploads/2016/07/Engine-connection-and-object-synchronization-timeout-in-LeanFT.png)

    ### LeanFT 中的引擎连接和对象同步超时![](img/image220.jpg)


    ### LeanFT 中的对象识别设置

    以下是最重要的 LeanFT 设置：


    1. **Add-ins (加载项)**：在此部分，我们可以指定想要加载的加载项。

    2. **Engine connection and Run-time settings (引擎连接和运行时设置)**：在此部分，我们可以指定引擎端口和引擎空闲超时。我们还可以指定对象同步超时。LeanFT
    在抛出异常之前将等待足够的时间。

    3. **Mobile Settings (移动设置)**：在此设置中，我们可以指定移动中心服务器地址，以便使用 LeanFT 自动化移动应用。

    4. **Object Identification settings (对象识别设置)**：在此选项卡中，我们可以指定使用哪些属性来识别对象。


    ## 4.2 LeanFT 中的许可证类型

    LeanFT 带有 4 种许可证，如下所示：


    1. **Seat License (节点许可)** - 绑定到一台机器

    2. **Concurrent license (并发许可)** - 多台机器可以使用此许可

    3. **Commuter license (通勤型许可)**

    4. **Remote commuter license (远程通勤型许可)**

    ![](http://www.softpost.org/wp-content/uploads/2015/09/license-wizard.jpg)


    # 5. 核心概念


    ## 5.1 对象识别中心 (Object Identification Center)

    对象识别中心就像 QTP/UFT 中的 Object Spy。

    对象识别中心以两种模式运行：


    1. `simple` - 允许你查看对象的属性值

    2. `edit` - 允许你查看并编辑对象的属性值


    对象识别中心允许你执行以下操作：


    1. 检查对象。

    2. 了解对象的父详情、层级结构。

    3. 了解对象的属性和值。

    4. 对象识别中心的一个酷功能是可以生成 Java 或 C# 代码段。

    5. 高亮对象。

    6. 我们还可以捕捉对象的截图。

    7. 它还允许将对象添加到应用程序模型（Application model）。


    你可以从 IntelliJ IDEA 启动对象识别中心，如下所示![](img/image269.jpg)

    **在 IntelliJ IDE 中启动 LeanFT 对象识别中心**

    下图显示了如何使用对象识别中心检查网页内部的元素![](http://www.softpost.org/wp-content/uploads/2016/07/Object-Identification-Center-in-LeanFT.png)

    ### LeanFT 中的对象识别中心


    ## 5.2 了解 LeanFT SDK API

    以下列出了 LeanFT API 中一些重要的包和类：


    1. `com.hp.lft.report` - `Reporter` 类可用于在报告中导出数据。

    2. `com.hp.lft.sdk` - 核心功能。

    3. `com.hp.lft.sdk.insight` - 用于根据图像识别对象。

    4. `com.hp.lft.sdk.apitesting.uft` - LeanFT 中使用的 UFT API。

    5. `com.hp.lft.sdk.java` - 用于自动化 Java 应用（`Swing`/`AWT` 等）的 API。

    6. `com.hp.lft.sdk.mobile` - 用于移动应用的 API。

    7. `com.hp.lft.sdk.sap.gui` 和 `com.hp.lft.sdk.sap.ui5` - 用于 SAP 应用的 API。

    8. `com.hp.lft.sdk.stdwin` - 用于标准 Windows 应用的 API。

    9. `com.hp.lft.sdk.utils` - 辅助方法。

    10. `com.hp.lft.sdk.web` - 用于标准 Web 应用的 API。

    11. `com.hp.lft.sdk.winforms` 和 `com.hp.lft.sdk.wpf` - 用于 .Net 应用的 API。

    12. `com.hp.lft.unittesting` 和 `com.hp.lft.unittesting.datadriving` - 用于 LeanFT
    单元测试框架的 API。

    13. `com.hp.lft.verifications` - 它提供了 `Verify` 类，可用于断言预期值。


    '
- fmt: "\n# 6. New LeanFT project in IntelliJ IDEA\n\n## 6.1 Installing the LeanFT\
    \ jar files in Maven Repository\nTo integrate the LeanFT with `Maven`, you will\
    \ have to install the LeanFT library files in local maven repositories. Execute\
    \ below commands to install the LeanFT jar files in a local repository.\n\n```bash\n\
    mvn install:install-file -Dfile=\"com.hp.lft.sdk-standalone.jar\" -DgroupId=\"\
    com.hp.lft\" -DartifactId=\"com.hp.lft.sdk\" -Dversion=\"12.53.0\" -Dpackaging=\"\
    jar\" -DgeneratePom=true\nmvn install:install-file -Dfile=\"com.hp.lft.report.jar\"\
    \ -DgroupId=\"com.hp.lft\" -DartifactId=\"com.hp.lft.report\" -Dversion=\"12.53.0\"\
    \ -Dpackaging=\"jar\" -DgeneratePom=true\nmvn install:install-file -Dfile=\"com.hp.lft.unittesting.jar\"\
    \ -DgroupId=\"com.hp.lft\" -DartifactId=\"com.hp.lft.unittesting\" -Dversion=\"\
    12.53.0\" -Dpackaging=\"jar\" -DgeneratePom=true\nmvn install:install-file -Dfile=\"\
    com.hp.lft.verifications.jar\" -DgroupId=\"com.hp.lft\" -DartifactId=\"com.hp.lft.verifications\"\
    \ -Dversion=\"12.53.0\" -Dpackaging=\"jar\" -DgeneratePom=true\n```\n\nThen add\
    \ below dependencies in your `POM` file.\n\n```xml\n<dependency>\n    <groupId>com.hp.lft</groupId>\n\
    \    <artifactId>com.hp.lft.sdk</artifactId>\n    <version>12.53.0</version>\n\
    </dependency>\n<dependency>\n    <groupId>com.hp.lft</groupId>\n    <artifactId>com.hp.lft.report</artifactId>\n\
    \    <version>12.53.0</version>\n</dependency>\n<dependency>\n    <groupId>com.hp.lft</groupId>\n\
    \    <artifactId>com.hp.lft.unittesting</artifactId>\n    <version>12.53.0</version>\n\
    </dependency>\n<dependency>\n    <groupId>com.hp.lft</groupId>\n    <artifactId>com.hp.lft.verifications</artifactId>\n\
    \    <version>12.53.0</version>\n</dependency>\n```\n\nSometimes you might need\
    \ to deploy the jar files in organization central repository. Below sample command\
    \ shows how to deploy LeanFT jar file to central repository.\n\n```bash\nmvn deploy:deploy-file\
    \ -DgroupId=\"com.hp.lft\" -DartifactId=\"com.hp.lft.sdk\" -Dversion=\"12.53.0\"\
    \ -Dpackaging=jar -Dfile=\"com.hp.lft.sdk-standalone.jar\" -DrepositoryId=<id-in-settings.xml>\
    \ -Durl=<url-of-the-central-repository>\n```\n\n## 6.2 Creating LeanFT Maven Project\n\
    We can create a new LeanFT maven project in IntelliJ IDEA as shown in below images.\
    \ Note that once the project is created, you can add required dependencies in\
    \ `POM.xml` file.\n\n![](image375.jpg)\nLeanFT Junit Maven project in IntelliJ\
    \ IDE AT\n\nThen enter group id and artifact id for your project and also give\
    \ the name of the project. Once the maven project is created, add LeanFT dependencies\
    \ as shown in below image.\n\n![](image382.jpg)\nAdding LeanFT libraries to Maven\
    \ project in IntelliJ IDEA\n\nAfter that, you can write your tests and enjoy automating\
    \ applications using LeanFT.\n\n## 6.3 Creating LeanFT Project with Gradle and\
    \ TestNG\nTo create a LeanFT project with `Gradle` and `TestNG`, follow below\
    \ steps.\n\nFirst of all, create a sample Gradle project in IntelliJ IDEA. Then\
    \ add `libs` directory under root directory and copy all LeanFT library files\
    \ from `C:\\Program Files (x86)\\LeanFT\\SDK\\Java` in it.\n\nThen ensure that\
    \ your `build.gradle` file contains below.\n\n```gradle\ngroup 'org.soft'\nversion\
    \ '1.0-SNAPSHOT'\napply plugin: 'java'\nrepositories {\n    mavenCentral\n}\n\
    dependencies {\n    testCompile group: 'org.testng', name: 'testng', version:\
    \ '6.9.10'\n    compileTree (dir: 'libs', include: '*.jar')\n}\ntest {\n    useTestNG\
    \ {\n        suites 'src/test/resources/testng.xml'\n    }\n}\n```\n\nAfter this,\
    \ create a sample TestNG test class and add LeanFT test as shown in below example.\
    \ Notice that you will have to initialize the LeanFT SDK before starting the tests\
    \ and clean up SDK at the end of tests.\n\n```java\npackage soft ;\nimport com.hp.lft.report.Reporter;\n\
    import org.testng.annotations.AfterClass;\nimport org.testng.annotations.AfterMethod;\n\
    import org.testng.annotations.BeforeClass;\nimport org.testng.annotations.BeforeMethod;\n\
    import org.testng.annotations.Test;\nimport com.hp.lft.sdk.*;\nimport com.hp.lft.verifications.*;\n\
    import java.net.URI;\npublic class SimpleLeanFTTest{\n    @BeforeClass\n    public\
    \ void beforeClass () {\n    }\n    @AfterClass\n    public void afterClass ()\
    \ {\n    }\n    @BeforeMethod\n    public void beforeMethod () {\n        try\
    \ {\n            ModifiableSDKConfiguration config = new ModifiableSDKConfiguration\
    \ ();\n            config . setServerAddress ( new URI ( \"ws://localhost:5095\"\
    \ ));\n            SDK . init ( config );\n            Reporter . init ();\n \
    \       } catch ( Exception ex ){\n            System . out . println ( \"Exception\
    \ occured \" + ex . toString());\n        }\n    }\n    @AfterMethod\n    public\
    \ void afterMethod () throws Exception {\n        Reporter . generateReport ();\n\
    \        SDK . cleanup ();\n    }\n    @Test\n    public void test () throws GeneralLeanFtException\
    \ {\n        Verify . areEqual ( 22 , 22 , \"Verify that 22 == 22\" );\n    }\n\
    }\n```\nAfter this build your project and then run the .\n\n## 6.4 LeanFT Properties\n\
    When we create a LeanFT project using templates, one properties file (`leanft.properties`)\
    \ is created and stored in resources directory. Here are the most important settings\
    \ in this file that we can use.\n\n1. `serverAddress` - specify the LeanFT engine\
    \ address\n2. `SDK Mode` - Replay or Interactive\n3. `LeanFT Service Address`\
    \ - `ws://localhost:5095`\n4. `Connection timeout` - 60 sec\n5. `Response timeout`\
    \ - 600 sec\n6. `Server autolaunch` - true\n\nHere are the most important settings\
    \ related to LeanFT Report\n\n1. `title` - Name of the report. By default, it\
    \ is Run Results.\n2. `description` - Description of the report. By default, it\
    \ is empty.\n3. `targetDirectory` - Directory where report should be stored. By\
    \ default it is current directory.\n4. `overrideExisting` - Whether to override\
    \ existing report. By default, it's value is true.\n5. `report folder` - RunResults\n\
    6. `override existing` - true\n7. `filter level` - All, Warning, Error, Off\n\
    8. `snapshot level` - All, OnError, Off\n\n## 6.5 Setting up LeanFT project in\
    \ IntelliJ IDEA\nIn this topic, we will see how to set up a LeanFT project in\
    \ IntelliJ IDEA. We can create a new LeanFT project in 2 ways.\n\n1. Using LeanFT\
    \ templates\n2. Custom framework\n"
