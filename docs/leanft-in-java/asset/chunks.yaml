  trans: "\n\n### 3. 验证仅显示从伦敦到巴黎的航班。\n\n这里是搜索订单的测试用例。\n\n1. 登录 `Flight` 应用程序。\n2.\
    \ 预订航班并记录订单号，例如 `88`。\n3. 搜索 ID 为 `88` 的订单。\n4. 验证航班详情是否显示正确。\n\n### 13.3 数据驱动框架\n\
    当你需要使用各种类型的数据对应用程序进行测试时，就会数据驱动框架。你可以按照以下格式存储数据。\n\n1. Microsoft Excel 文件\n2. 数据库\n\
    \n在数据驱动框架中，我们测试同一个功能，但使用不同的数据集。例如，在 HP 航班应用程序中，我们可以使用 `User Id` 和 `Password` 的不同组合来测试\
    \ `Login` 功能。请注意，此处的 `Login` 功能是相同的，但在每次运行期间测试数据是不同的。\n\n### 14. 将 UFT 对象库转换为\
    \ LeanFT 中的应用程序模型\n我们可以使用下面的命令行工具将对象库转换为 LeanFT 中的应用程序模型。\n![](img/image1586.jpg)\n\
    \n#### Java 版 OR2AppModelConverter\n以下是该工具的语法。\n\n```\nOR2AppModelConverter myuftOR.tsr\
    \ myAppModel.tsrx myLogFile.log\n```\n**警告**：第一个参数是对象库文件的路径。第二个参数是应用程序模型文件的路径。第三个参数是日志文件的路径，最后一个参数是日志级别（可以是\
    \ `Info`、`Warning` 或 `Error`）。\n\n### 15. 将 FT 测试集成到 CI 服务器\n#### 15.1 在 Bamboo\
    \ 中添加 maven 任务\n`maven` 任务的重要设置如下所示。\n\n1. 提供 `maven` 可执行文件的路径。\n2. 提供任何有效的 [maven\
    \ 目标](http://www.softpost.org/maven/maven-commands/)\n\n下图显示了如何在 `Bamboo` 中配置\
    \ `maven` 任务。我们已经设置了 clean test 目标。\n![](img/image1605.jpg)\nBamboo 中的 maven 任务\n\
    \n下图显示了使用 `maven` 任务的构建计划的示例输出。\n![](img/image1611.jpg)\nBamboo 中的 maven 输出\n\n\
    #### 15.2 在 Jenkins 中创建和配置构建\n现在让我们了解如何在 `Jenkins` 中创建和配置一个典型的构建。要创建新构建（也称为任务），点击\
    \ `Jenkins` 页上的 `New Item` 链接。它将打开下面的页面。\n![](img/image1620.jpg)\n新建 Jenkins 构建项目\n\
    \n然后输入项目名称，选择 `freestyle project` 并点击 `OK`。它将打开如下所示的构建配置页面。输入项目描述，如果你想向构建传递任何参数，请添加参数。\n\
    ![](img/image1625.jpg)\nJenkins 构建配置 - 构建名称、描述、参数\n\n接下来，你需要像下图所示配置 `git` 等 SCM。在这个示例中，我们使用\
    \ `GITHUB` 上的仓库。但你可以使用任何其他版本控制软件。\n![](img/image1630.jpg)\nJenkins 构建中的 git -\
    \ 源码管理\n\n接下来 - 你必须指定构建触发器。你可以以 `Cron` 表达式的形式指定触发器。你也可以定期轮询 `SCM`，如果检测到更改，将运行构建。\n\
    ![](img/image1637.jpg)\nJenkins 构建触发器\n\n你的任务/项目由多个构建步骤组成。因此，你可以如下所示添加构建步骤。请注意，除非你安装了适当的插件，否则你将不会看到图中所示的所有构建步骤。例如\
    \ - 除非你在 `Jenkins` 中安装了 `MSBuild` 插件，否则 `MSBuild` 步骤将不可。\n![](img/image1643.jpg)\n\
    Jenkins 构建步骤\n![](img/image1648.jpg)\nJenkins 中的 maven 构建步骤\n\n最后你需要做的是配置构建后操作。下图显示了你可以执行可能的构建后操作。\n\
    ![](img/image1654.jpg)\nJenkins 中的构建后操作\n\n上述步骤是可选的。所以只需点击 `Save` 按钮即可。做得好！你刚刚在\
    \ `Jenkins` 中创建了一个示例构建。要查看你的构建项目，只需进入主页。你将看到如下所示的构建（黄色高亮）。\n![](img/image1660.jpg)\n\
    仪表板上的 Jenkins 构建\n\n#### 15.3 TeamCity 中 Maven 项目的构建步骤\n在本主题中，你将学习如何在 `TeamCity`\
    \ 中为 `maven` 项目设置构建步骤。如下所示，你必须选择运行器类型为 `Maven`。然后你必须提供要执行的目标。默认情况下，它使用项目根目录下的\
    \ `POM.xml`。你也可以在运行测试目标的同时运行代码覆盖过程，这将提供关于测试覆盖了多少类的报告。这里是一些常用的 `maven` 目标的列表。\n\
    \n1. `test` - 使用 `surefire` 插件执行测试。我们也可以向 `maven JUnit test goal` 和 `maven testNG\
    \ test goal` 传递各种参数。\n2. `verify` - 执行单元测试并执行插件提供的验证。\n3. `install`\n4. `site`\n\
    5. `deploy`\n\n![](img/image1675.jpg)\nTeamCity 中的 maven 构建步骤\n\n下图显示了示例构建日志。\n\
    ![](img/image1682.jpg)\nTeamCity 中的 maven 构建日志\n\n### 16. 挑战与解决方案\n#### 16.1 LeanFT\
    \ 自动化挑战\n以下是主要的 `LeanFT` 挑战列表。\n\n1. `LeanFT` 不支持第三方控件。我们必须使用 `Native` 对象。\n2.\
    \ 嵌套表格中的动态元素如复选框、按钮、单选按钮。我们必须使用 `HTML DOM` 处理。\n\n#### 16.2 使用 Native 属性和方法操作第三方对象\n\
    下面的示例说明了如何在 `LeanFT` 中访问 `native 属性`。在下面的示例中，我们使用 `native value` 属性设置输入框的值。我们还使用了\
    \ `native click` 方法进行点击。\n\n```java\npackage leanft;\nimport com.hp.ft.report.Reporter;\n\
    import com.hp.ft.report.Status;\nimport com.hp.ft.sdk.NativeObject;\nimport org.junit.Test;\n\
    import java.util.List;\n\npublic class ChromeTest extends BaseTest {\n    @Test\n\
    \    public void test() throws Exception {\n        Browser browser = BrowserFactory.launch(BrowserType.ROME);\n\
    \        try {\n            //导航到 http://soft.post.org/test-page/\n          \
    \  browser.navigate(\"http://soft.post.org/test-page/\");\n            browser.sync();\n\
    \            //在输入框设置值\n            browser.describe(EditField.class, new EditField.Builder()).id(\"\
    fn\").build()).setValue(\"S\");\n            //获取原生对象\n            NativeObject\
    \ obj = browser.describe(EditField.class, new EditField.Builder()).id(\"fn\").build()).getNativeObject();\n\
    \            //列出对象的成员\n            List<String> list = obj.getMembers();\n  \
    \          for (String s : list) {\n                System.out.println(s);\n \
    \           }\n            obj.setProperty(\"value\", \"Native\");\n         \
    \   Thread.sleep(3000);\n            //使用原生方法点击 Home 链接\n            browser.describe(Link.class,\
    \ new Link.Builder()).tagName(\"A\").innerText(\"Home\").build()).getNativeObject().invokeMethod(\"\
    click\");\n        } catch (AssertionError ex) {\n            //报告异常\n       \
    \     Reporter.reportEvent(\"Exception\", \"测试失败\", Status.Failed, ex);\n    \
    \        throw ex;\n        } finally {\n            //关闭浏览器\n            browser.close();\n\
    \        }\n    }\n}\n```\n\n### 17. LeanFT 常见问题与解决方案\n列出了在使用 `LeanFT` 工作期间可能遇到的常见问题及其解决方案。\n\
    \n1. `无法连接到位于.... 的 LeanFT 运行时` 此异常发生在 `LeanFT` 运行时未运行时。只需启动引擎，该错误就会消失。\n2. `发生内部问题，请确保已正确初始化\
    \ LeanFT SDK....` 此异常发生在你未初始化 `LeanFT SDK` 时。为了消除此异常，请在代码开头添加以下行。\n\n```java\n\
    ModifiableSDKConfiguration config = new ModifiableSDKConfiguration();\nconfig.setServerAddress(new\
    \ URI(\"ws://localhost:5095\"));\nSDK.init(config);\n```\n3. `启用 LeanFT 插件时 IntelliJ\
    \ IDEA 无法启动` – 要修复此此问题，请在进程管理器中结束 `IntelliJ IDEA` 的 `LeanFT` 插件。\n\n"
