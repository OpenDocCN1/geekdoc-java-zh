- fmt: "\n![](image8.jpg)\n![](image8.jpg)\n\n# About the Author\nPaul Watson is a\
    \ technology enthusiast and has massive experience in various technologies like\
    \ web application development, automation testing, build automation, continuous\
    \ integration and deployment technologies. He has worked on most of the technology\
    \ stacks.\n\nHe has hands on experience on `UFT`, `LeanFT`, `Selenium` and `Appium`.\
    \ He has used testing frameworks like `JUnit`, `TestNG`, `Cucumber` with `Selenium`.\
    \ He has also worked on `Struts`, `Spring`, `Bootstratp`, `Angular JS`. His hobbies\
    \ include travelling to new tourist places, watching basketball, cricket and learning\
    \ latest technological stuff.\n\n## A special note of Thanks to My Wife\nI would\
    \ like to dedicate this book to my lovely wife for loving me so much and helping\
    \ me write this book. Without her support, this book would not have been a reality.\n\
    \n# Who this book is for\nThis book is for automation engineers who want to learn\
    \ `LeanFT` to automate the web and windows applications in `Java`. It is assumed\
    \ that reader has basic programming skills in `Java` language. Whether you are\
    \ a beginner or an experienced developer, this book will help you master the skills\
    \ on `LeanFT`.\n\n## Book Overview\nThe book starts with introduction of `LeanFT`\
    \ and then dives into key concepts as mentioned below:\nSupported applications,\
    \ Installation, `LeanFT` settings, Core Concepts, New `LeanFT` project in `IntelliJ\
    \ IDEA`, `LeanFT` Project in `Eclipse`, Object Identification and Management,\
    \ Automating Web applications, Automating windows applications, Synchronization,\
    \ Assertions and Reports, `LeanFT` Frameworks, Converting the `UFT` Object Repository\
    \ to Application models in `LeanFT`, Integrating the `LeanFT` tests with CI servers\
    \ like [Bamboo](http://www.softpost.org/bamboo/adding-maven-task-in-bamboo/),\
    \ [Jenkins](http://www.softpost.org/jenkins/creating-and-configuring-the-builds-in-jenkins/)\
    \ and [TeamCity](http://www.softpost.org/teamcity/build-steps-for-maven-project-in-teamcity/),\
    \ Challenges and Solutions, `LeanFT` common issues and solutions, Comparing `LeanFT`\
    \ with other tools, `LeanFT` Java References.\n\n# Table of Contents\n- [About\
    \ the Author](#part0001.xhtml)\n- [A special note of Thanks to My Wife](#part0002.xhtml)\n\
    - [Who this book is for](#part0003.xhtml)\n- [1. Introduction](#part0005.xhtml)\n\
    - [2. Supported applications](#part0006.xhtml)\n- [3. Installation](#part0007.xhtml)\n\
    \    - [3.1 Installation of LeanFT and plugins for IDEs](#part0007.xhtml_toc5_3.1_Installation_of_LeanFT_and_plugins_for_IDEs)\n\
    \    - [3.2 Installing browser Extensions](#part0007.xhtml_toc6_3.2_Installing_browser_Extensions)\n\
    - [4. Getting Started](#part0008.xhtml)\n    - [4.1 LeanFT settings](#part0008.xhtml_lMgFRRDpRtGIftZBV7KV3A1829)\n\
    \    - [4.2 License types in LeanFT](#part0008.xhtml_lMgFRRDpRtGIftZBV7KV3A1830)\n\
    - [5. Core Concepts](#part0009.xhtml)\n    - [5.1 Object identification Center](#part0009.xhtml_toc11_5.1_Object_identification_Center)\n\
    \    - [5.2 Understanding LeanFT SDK API](#part0009.xhtml_toc12_5.2_Understanding_LeanFT_SDK_API)\n\
    - [6. New LeanFT project in IntelliJ IDEA](#part0010.xhtml)\n    - [6.1 Installing\
    \ the LeanFT jar files in Maven Repository](#part0010.xhtml_lMgFRRDpRtGIftZBV7KV3A1835)\n\
    \    - [6.2 Creating LeanFT Maven Project](#part0010.xhtml_lMgFRRDpRtGIftZBV7KV3A1836)\n\
    \    - [6.3 Creating LeanFT Project with Gradle and TestNG](#part0010.xhtml_lMgFRRDpRtGIftZBV7KV3A1837)\n\
    \    - [6.4 LeanFT Properties](#part0010.xhtml_toc17_6.4_LeanFT_Properties)\n\
    \    - [6.5 Setting up LeanFT project in IntelliJ IDEA](#part0010.xhtml_lMgFRRDpRtGIftZBV7KV3A1839)\n\
    - [7. LeanFT Project in Eclipse](#part0011.xhtml)\n    - [7.1 Creating maven project\
    \ with JUnit with LeanFT in Eclipse](#part0011.xhtml_toc20_7.1_Creating_maven_project_with_JUnit_with_LeanFT_in_Eclipse)\n\
    \    - [7.2 Creating maven project with TestNG in Eclipse](#part0011.xhtml_lMgFRRDpRtGIftZBV7KV3A1842)\n\
    - [8. Object Identification and Management](#part0012.xhtml)\n    - [8.1 Description\
    \ programming](#part0012.xhtml_lMgFRRDpRtGIftZBV7KV3A1844)\n    - [8.2 Application\
    \ model](#part0012.xhtml_lMgFRRDpRtGIftZBV7KV3A1845)\n    - [8.3 Using regular\
    \ expression in property values](#part0012.xhtml_lMgFRRDpRtGIftZBV7KV3A1846)\n\
    - [9. Automating Web applications](#part0013.xhtml)\n    - [9.1 First web application\
    \ test](#part0013.xhtml_lMgFRRDpRtGIftZBV7KV3A1848)\n    - [9.2 Identifying the\
    \ Web elements using XPATH and CSS](#part0013.xhtml_toc28_9.2_Identifying_the_Web_elements_using_XPATH_and_CSS)\n\
    \    - [9.3 Identifying objects using Visual Relational Identifiers – VRI](#part0013.xhtml_toc29_9.3_Identifying_objects_using_Visual_Relational_Identifiers___VRI)\n\
    \    - [9.4 Handling browser control in Windows app](#part0013.xhtml_lMgFRRDpRtGIftZBV7KV3A1851)\n\
    \    - [9.5 Firing events on Web using LeanFT](#part0013.xhtml_lMgFRRDpRtGIftZBV7KV3A1852)\n\
    \    - [9.6 Executing JavaScript in web page](#part0013.xhtml_toc32_9.6_Executing_JavaScript_in_web_page)\n\
    - [10. Automating windows applications](#part0014.xhtml)\n    - [10.1 Automating\
    \ standard application](#part0014.xhtml_lMgFRRDpRtGIftZBV7KV3A1855)\n    - [10.2\
    \ Automating Java Application](#part0014.xhtml_toc35_10.2_Automating_Java_Application)\n\
    \    - [10.3 Automating WPF applications](#part0014.xhtml_lMgFRRDpRtGIftZBV7KV3A1857)\n\
    \    - [10.4 Automating SAP Application](#part0014.xhtml_lMgFRRDpRtGIftZBV7KV3A1858)\n\
    - [11. Synchronization](#part0015.xhtml)\n- [12. Assertions and Reports](#part0016.xhtml)\n\
    \    - [12.1 Assertions in LeanFT](#part0016.xhtml_lMgFRRDpRtGIftZBV7KV3A1861)\n\
    \    - [12.2 Generating reports with screenshots and recordings](#part0016.xhtml_toc41_12.2_Generating_reports_with_screenshots_and_recordings)\n\
    - [13. LeanFT Frameworks](#part0017.xhtml)\n    - [13.1 LeanFT with Cucumber](#part0017.xhtml_lMgFRRDpRtGIftZBV7KV3A1864)\n\
    \    - [13.2 Keyword Driven frameworks](#part0017.xhtml_lMgFRRDpRtGIftZBV7KV3A1865)\n\
    \    - [13.3 Data Driven Frameworks](#part0017.xhtml_lMgFRRDpRtGIftZBV7KV3A1866)\n\
    - [14. Converting the UFT Object Repository to Application models in LeanFT](#part0018.xhtml)\n\
    - [15. Integrating the LeanFT tests with CI servers](#part0019.xhtml)\n    - [15.1\
    \ Adding maven task in Bamboo](#part0019.xhtml_toc48_15.1_Adding_maven_task_in_Bamboo)\n\
    \    - [15.2 Creating and Configuring the builds in Jenkins](#part0019.xhtml_toc49_15.2_Creating_and_Configuring_the_builds_in_Jenkins)\n\
    \    - [15.3 Build steps for Maven project in TeamCity](#part0019.xhtml_toc50_15.3_Build_steps_for_Maven_project_in_TeamCity)\n\
    - [16. Challenges and Solutions](#part0020.xhtml)\n    - [16.1 Challenges of LeanFT\
    \ automation](#part0020.xhtml_toc52_16.1_Challenges_of_LeanFT_automation)\n  \
    \  - [16.2 Working with third party objects using](#part0020.xhtml_toc53_16.2_Working_with_third_party_objects_using)\n\
    \    - [Native Object properties and methods](#part0020.xhtml_lMgFRRDpRtGIftZBV7KV3A1875)\n\
    - [17. LeanFT common issues and solutions](#part0021.xhtml)\n- [18. Comparing\
    \ LeanFT with other tools](#part0022.xhtml)\n    - [18.1 Difference between HP\
    \ UFT and LeanFT](#part0022.xhtml_lMgFRRDpRtGIftZBV7KV3A1878)\n    - [18.2 Comparison\
    \ of LeanFT with Selenium and Ranorex](#part0022.xhtml_toc58_18.2_Comparison_of_LeanFT_with_Selenium_and_Ranorex)\n\
    - [19. LeanFT Java References](#part0023.xhtml)\n\n# 1. Introduction\nLeanFT stands\
    \ for Lean Functional testing. This is a tool developed by HP and very similar\
    \ to the Ranorex. Key points to note about LeanFT are given below.\n\n1. It's\
    \ a licensed tool.\n2. Developed by HP in 2015.\n3. It's light version of `UFT`\
    \ (`QTP`).\n4. With LeanFT, you can write tests in .Net language as well as Java.\n\
    5. LeanFT plugin are available for Visual Studio and Eclipse.\n6. LeanFT uses\
    \ description programming as well as Application models to identify the objects.\n\
    \n## 2. Supported applications](http://www.softpost.org/automation-testing/leanft-with-c-net/supported-applications-by-leanft/)\n\
    LeanFT supports below types of applications.\n\n1. Web applications on IE, Chrome,\
    \ Firefox, Microsoft Edge\n2. Windows application - WPF, Silverlight and more\n\
    3. SAP applications\n4. Java applications\n5. Standard windows and forms\n"
