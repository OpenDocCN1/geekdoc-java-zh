  trans: "\n\n# 6. 在 IntelliJ IDEA 中新建 LeanFT 项目\n\n## 6.1 在 Maven 仓库中安装 LeanFT jar\
    \ 文件\n要将 LeanFT 与 `Maven` 集成，你必须将 LeanFT 库文件安装到本地 Maven 仓库。执行以下命令将 LeanFT jar\
    \ 文件安装到本地仓库。\n\n```bash\nmvn install:install-file -Dfile=\"com.hp.lft.sdk-standalone.jar\"\
    \ -DgroupId=\"com.hp.lft\" -DartifactId=\"com.hp.lft.sdk\" -Dversion=\"12.53.0\"\
    \ -Dpackaging=\"jar\" -DgeneratePom=true\nmvn install:install-file -Dfile=\"com.hp.lft.report.jar\"\
    \ -DgroupId=\"com.hp.lft\" -DartifactId=\"com.hp.lft.report\" -Dversion=\"12.53.0\"\
    \ -Dpackaging=\"jar\" -DgeneratePom=true\nmvn install:install-file -Dfile=\"com.hp.lft.unittesting.jar\"\
    \ -DgroupId=\"com.hp.lft\" -DartifactId=\"com.hp.lft.unittesting\" -Dversion=\"\
    12.53.0\" -Dpackaging=\"jar\" -DgeneratePom=true\nmvn install:install-file -Dfile=\"\
    com.hp.lft.verifications.jar\" -DgroupId=\"com.hp.lft\" -DartifactId=\"com.hp.lft.verifications\"\
    \ -Dversion=\"12.53.0\" -Dpackaging=\"jar\" -DgeneratePom=true\n```\n\n然后将在你的\
    \ `POM` 文件中添加以下依赖。\n\n```xml\n<dependency>\n    <groupId>com.hp.lft</groupId>\n\
    \    <artifactId>com.hp.lft.sdk</artifactId>\n    <version>12.53.0</version>\n\
    </dependency>\n<dependency>\n    <groupId>com.hp.lft</groupId>\n    <artifactId>com.hp.lft.report</artifactId>\n\
    \    <version>12.53.0</version>\n</dependency>\n<dependency>\n    <groupId>com.hp.lft</groupId>\n\
    \    <artifactId>com.hp.lft.unittesting</artifactId>\n    <version>12.53.0</version>\n\
    </dependency>\n<dependency>\n    <groupId>com.hp.lft</groupId>\n    <artifactId>com.hp.lft.verifications</artifactId>\n\
    \    <version>12.53.0</version>\n</dependency>\n```\n\n有时你可能需要将 jar 文件部署到组织中央仓库。下面的示例命令显示了如何将\
    \ LeanFT jar 文件部署到中央仓库。\n\n```bash\nmvn deploy:deploy-file -DgroupId=\"com.hp.lft\"\
    \ -DartifactId=\"com.hp.lft.sdk\" -Dversion=\"12.53.0\" -Dpackaging=jar -Dfile=\"\
    com.hp.lft.sdk-standalone.jar\" -DrepositoryId=<id-in-settings.xml> -Durl=<url-of-the-central-repository>\n\
    ```\n\n## 6.2 创建 LeanFT Maven 项目\n我们可以像下面的图片所示在 IntelliJ IDEA 中创建一个新的 LeanFT maven\
    \ 项目。注意，一旦创建了项目，你就可以 `POM.xml` 文件中添加所需的依赖。\n\n![](img/image375.jpg)\nIntelliJ\
    \ IDE 中的 LeanFT Junit Maven 项目\n\n然后为你的项目输入 group id 和 artifact id，并指定项目名称。一旦\
    \ maven 项目创建完成，如如下所示添加 LeanFT 依赖。\n\n![](img/image382.jpg)\n在 IntelliJ IDEA 中向\
    \ Maven 项目添加 LeanFT 库\n\n之后，你就可以编写测试用例并享受使用 LeanFT 进行自动化测试了。\n\n## 6.3 使用 Gradle\
    \ 和 TestNG 创建 LeanFT 项目\n要使用 `Gradle` 和 `TestNG` 创建 LeanFT 项目，请遵循以下步骤。\n\n首先，在\
    \ IntelliJ IDEA 中创建一个示例 Gradle 项目。然后在根目录下添加一个 `libs` 目录，并将来自 `C:\\Program Files\
    \ (x86)\\LeanFT\\SDK\\Java` 的所有 LeanFT 库文件复制到该目录中。\n\n然后，确保你的 `build.gradle` 文件包含以下内容。\n\
    \n```gradle\ngroup 'org.soft'\nversion '1.0-SNAPSHOT'\napply plugin: 'java'\n\
    repositories {\n    mavenCentral\n}\ndependencies {\n    testCompile group: 'org.testng',\
    \ name: 'testng', version: '6.9.10'\n    compileTree (dir: 'libs', include: '*.jar')\n\
    }\ntest {\n    useTestNG {\n        suites 'src/test/resources/testng.xml'\n \
    \   }\n}\n```\n\n此之后，创建一个示例 TestNG 测试类，并如下例所示添加 LeanFT 测试。注意，你必须在开始测试之前初始化 LeanFT\
    \ SDK，并在测试结束后清理 SDK。\n\n```java\npackage soft ;\nimport com.hp.lft.report.Reporter;\n\
    import org.testng.annotations.AfterClass;\nimport org.testng.annotations.AfterMethod;\n\
    import org.testng.annotations.BeforeClass;\nimport org.testng.annotations.BeforeMethod;\n\
    import org.testng.annotations.Test;\nimport com.hp.lft.sdk.*;\nimport com.hp.lft.verifications.*;\n\
    import java.net.URI;\npublic class SimpleLeanFTTest{\n    @BeforeClass\n    public\
    \ void beforeClass () {\n    }\n    @AfterClass\n    public void afterClass ()\
    \ {\n    }\n    @BeforeMethod\n    public void beforeMethod () {\n        try\
    \ {\n            ModifiableSDKConfiguration config = new ModifiableSDKConfiguration\
    \ ();\n            config . setServerAddress ( new URI ( \"ws://localhost:5095\"\
    \ ));\n            SDK . init ( config );\n            Reporter . init ();\n \
    \       } catch ( Exception ex ){\n            System . out . println ( \"Exception\
    \ occured \" + ex . toString());\n        }\n    }\n    @AfterMethod\n    public\
    \ void afterMethod () throws Exception {\n        Reporter . generateReport ();\n\
    \        SDK . cleanup ();\n    }\n    @Test\n    public void test () throws GeneralLeanFtException\
    \ {\n        Verify . areEqual ( 22 , 22 , \"Verify that 22 == 22\" );\n    }\n\
    }\n```\n此之后构建你的项目并运行。\n\n## 6.4 LeanFT 属性\n当我们使用模板创建 LeanFT 项目时，会创建一个属性文件 (`leanft.properties`)\
    \ 并存储在 resources 目录中。以下是文件中我们可以使用的最重要的设置。\n\n1. `serverAddress` - 指定 LeanFT 引擎地址\n\
    2. `SDK Mode` - 回放模式（Replay）或交互模式（Interactive）\n3. `LeanFT Service Address` -\
    \ `ws://localhost:5095`\n4. `Connection timeout` - 60 秒\n5. `Response timeout`\
    \ - 600 秒\n6. `Server autolaunch` - true\n\n以下是与 LeanFT 报告相关的最重要的设置\n\n1. `title`\
    \ - 报告名称。默认为 Run Results。\n2. `description` - 报告描述。默认为空。\n3. `targetDirectory`\
    \ - 报告存储的目录。默认是当前目录。\n4. `overrideExisting` - 是否覆盖现有报告。其默认值为 true。\n5. `report\
    \ folder` - RunResults\n6. `override existing` - true\n7. `filter level` - 所有（All）、警告（Warning）、错误（Error）、关闭（Off）\n\
    8. `snapshot level` - 所有（All）、错误时（OnError）、关闭（Off）\n\n## 6.5 在 IntelliJ IDEA 中配置\
    \ LeanFT 项目\n在本主题中，我们将介绍如何在 IntelliJ IDEA 中配置 LeanFT 项目。我们可以通过 2 方式创建新的 LeanFT\
    \ 项目。\n\n1. 使用 LeanFT 模板\n2. 自定义框架\n\n"
- fmt: "\nIf you have installed the LeanFT plugin for IntelliJ IDEA, you can create\
    \ new project from templates as shown in below image. Note that we can create\
    \ a project based on 4 types of templates.\n\n[![](image570.jpg)](http://www.softpost.org/wp-content/uploads/2016/07/New-LeanFT-project-in-IntelliJ-IDEA.png)\n\
    New LeanFT project in IntelliJ IDEA\n\n[![](image576.jpg)](http://www.softpost.org/wp-content/uploads/2016/07/Sample-LeanFT-project-structure.png)\n\
    Sample LeanFT project structure\n\nTo create your own custom framework, you will\
    \ have to initialize and clean up SDK as shown in below example. Note that in\
    \ all upcoming examples, we have inherited `BaseTest` class.\n\n```java\npackage\
    \ leanft;\nimport com.hp.lft.report.Reporter;\nimport com.hp.lft.sdk.ModifiableSDKConfiguration;\n\
    import com.hp.lft.sdk.SDK;\nimport org.junit.After;\nimport org.junit.Before;\n\
    import java.net.URI;\n\npublic class BaseTest {\n    @Before\n    public void\
    \ test() throws Exception {\n        ModifiableSDKConfiguration config = new ModifiableSDKConfiguration();\n\
    \        config.setServerAddress(new URI(\"ws://localhost:5095\"));\n        SDK.init(config);\n\
    \        Reporter.init();\n    }\n\n    @After\n    public void clean() throws\
    \ Exception {\n        Reporter.generateReport();\n        SDK.cleanup();\n  \
    \  }\n}\n```\n\nThen we can write test methods as shown in below example.\n\n\
    ```java\npackage leanft;\nimport com.hp.lft.report.Reporter;\nimport com.hp.lft.report.Status;\n\
    import com.hp.lft.sdk.ModifiableSDKConfiguration;\nimport com.hp.lft.sdk.SDK;\n\
    import com.hp.lft.sdk.web.*;\nimport com.hp.lft.sdk.web.EditField;\nimport com.hp.lft.sdk.web.EditFieldDescription;\n\
    import org.junit.Test;\nimport java.net.URI;\nimport static org.junit.Assert.assertEquals;\n\
    \npublic class ChromeTest extends BaseTest {\n    @Test\n    public void test()\
    \ throws Exception {\n        Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n\
    \        try {\n            //Navigate to http://www.softpost.org/selenium-test-page/\n\
    \            browser.navigate(\"http://www.softpost.org/selenium-test-page/\"\
    );\n            browser.sync();\n        } catch (AssertionError ex) {\n     \
    \       //Report the Exception\n            Reporter.reportEvent(\"Exception\"\
    , \"Test failed\", Status.Failed, ex);\n            throw ex;\n        } finally\
    \ {\n            //Close the browser\n            browser.close();\n        }\n\
    \    }\n}\n```\n\n# 7. LeanFT Project in Eclipse\n\n## 7.1 Creating maven project\
    \ with JUnit with LeanFT in Eclipse\nBelow images will help you understand how\
    \ to create a maven project with JUnit and LeanFT in Eclipse. Click on New project\
    \ menu and then click on Other.\n\n[![](image661.jpg)]\nLeanFT - Maven project\
    \ with JUnit in Eclips e\n\nThen Select LeanFT JUnit Maven project as shown in\
    \ below image.\n\n[![](image667.jpg)]\nLeanFT - Maven Junit Template in Eclips\
    \ e\n\nProvide the group id and Artifact id for your project.\n\n[![](image674.jpg)]\n\
    LeanFT - Maven JUnit project in Eclipse\n\nProject is created as shown in below\
    \ image.\n\n[![](image680.jpg)]\nThen add external jars for LeanFT as shown in\
    \ below image.\n\n[![](image685.jpg)]\nAdd LeanFT libraries as external jars\n\
    \nAfter running maven build, you should be able to see the results in `RunResults`\
    \ Directory.\n\n## 7.2 Creating maven project with TestNG in Eclipse\nBelow images\
    \ will help you understand how to set up a LeanFT maven project with TestNG in\
    \ Eclipse.\n\n[![](image693.jpg)]\nLeanFT - Maven project with JUnit in Eclipse\n\
    \n[![](image698.jpg)]\nLeanFT TestNG group Id in Eclipse\n\n[![](image703.jpg)]\n\
    LeanFT TestNG Maven Project in Eclipse\n\nLeanFT puts the tests in `src/main/java`\
    \ directory. You should move those test classes to `src/test/java` because maven\
    \ always looks in `src/text/java` directory for any tests to be executed.\n\n\
    # 8. Object Identification and Management\n\n## 8.1 Description programming\n\
    Usually in UFT, we use object repository (Application model in LeanFT) to store\
    \ the objects inside application. So we can use those objects in automation code\
    \ but we can also use description programming to define new test objects in the\
    \ code itself.\n\nBelow example shows how to define new test object using description\
    \ programming in LeanFT. We have used description programming to define 2 objects\
    \ of type - `EditField` and `Link`. Note that we can multiple property-value pairs\
    \ to identify the objects.\n\n```java\n//Navigate to http://www.softpost.org/selenium-test-page/\n\
    browser.navigate(\"http://www.softpost.org/selenium-test-page/\");\nbrowser.sync();\n\
    \n//Build edit box object and set value in it\nbrowser.describe(EditField.class,\
    \ new EditFieldDescription.Builder().id(\"fn\").build()).setValue(\"Sagar\");\n\
    \n//Build link object and click on it.\nbrowser.describe(Link.class, new LinkDescription.Builder().tagName(\"\
    A\").innerText(\"Home\").build()).click();\n```\n\n## 8.2 Application model\n\
    Application models are similar to the object repository in UFT. We can create\
    \ a new application model in IntelliJ IDEA as shown in below image.\n\n[![](image732.jpg)]\n\
    Creating new LeanFT Application model item in IntelliJ IDE\n\n[![](image739.jpg)]\n\
    Below image shows sample `AppModel.tsrx` file. In designer mode, we can add, remove\
    \ objects in application model.\n\n[![](image745.jpg)]\nBelow image shows how\
    \ to add the objects to application model using Object Identification Center.\n\
    \nNote that 2 files are created after new Application model is created.\n\n1.\
    \ `YourModel.tsrx` file -It is an XML file. We can also view this file in design\
    \ mode where we can add and edit the objects.\n2. `YourModel.java` file containing\
    \ the code representing the objects in the application model.\n"
