  trans: "\n\n## 验证方法\n\n1. `areEqual`, `areNotEqual`\n2. `isTrue`, `isFalse`\n3.\
    \ `startsWith`, `contains`, `endsWith`\n4. `lessOrEqual`, `less`, `greater`, `greaterOrEqual`\n\
    5. `isMatch`\n6. `isNullOrEmpty`, `isNotNullOrEmpty`\n\n```java\npackage leanft;\n\
    import com.hp.lft.report.Reporter;\nimport com.hp.lft.report.Status;\nimport com.hp.lft.sdk.ModifiableSDKConfiguration;\n\
    import com.hp.lft.sdk.SDK;\nimport com.hp.lft.sdk.web.*;\nimport com.hp.lft.sdk.web.EditField;\n\
    import com.hp.lft.sdk.web.EditFieldDescription;\nimport com.hp.lft.verifications.Verify;\n\
    import org.junit.Test;\nimport java.net.URI;\nimport static org.junit.Assert.assertEquals;\n\
    public class ChromeTest extends BaseTest{\n    @Test\n    public void test() throws\
    \ Exception    {\n        Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n\
    \        Try {\n            //导航到 http://www.softpost.org/selenium-test-page/\n\
    \            browser.navigate( \"http://www.softpost.org/selenium-test-page/\"\
    \ );\n            browser.sync();\n            //在输入框中设置值\n            browser.describe(EditField.class,\
    \ new EditFieldDescription.Builder()\n                .id( \"fn\" ).build()).setValue(\
    \ \"Sagar\" );\n            //点击 Home 链接\n            browser.describe(Link.class,\
    \ new LinkDescription.Builder()\n                .tagName( \"A\" ).innerText(\
    \ \"Home\" ).build()).click();\n            //等待页面加载\n            browser.sync();\n\
    \            Verify.isTrue(browser.getTitle().toLowerCase().contains( \"tutorial\"\
    \ ), \"Verifying the title of Home page\" );\n        } catch (AssertionError\
    \ ex){\n            //报告异常\n            Reporter.reportEvent( \"Exception\" ,\
    \ \"Test failed\" , Status.Failed, ex);\n            throw ex;\n        } Finally\
    \ {\n            //关闭浏览器\n            browser.close();\n        }\n    }\n}\n\
    ```\n\n这里是显示验证点的 HTML 报告。\n![](img/image1384.jpg)\nLeanFT 中的 Verify 类。\n\n## 12.2\
    \ 生成带有截图和录屏的报告\n\nLeanFT 中可以通过两种方式生成报告。\n\n1. 使用 `Reporter` 和 `TestObject.GetSnapshot`\
    \ 截屏。\n2. 使用 Microsoft expression encoder 进行测试执行的视频录制。\n\n默认情况下，LeanFT 在 Java\
    \ 项目根目录下的 `RunResults` 文件夹中创建报告。但你可以像下面的示例一样使用 `ModifiableReportConfiguration`\
    \ 类进行更改。你也可以使用以下方法将你的日志消息发送到报告。\n\n### `Reporter.reportEvent` \n\n```java\npackage\
    \ leanft;\nimport com.hp.lft.report.*;\nimport com.hp.lft.sdk.Desktop;\nimport\
    \ com.hp.lft.sdk.stdwin.Window;\nimport com.hp.lft.sdk.stdwin.WindowDescription;\n\
    import com.hp.lft.sdk.web.*;\nimport com.hp.lft.verifications.Verify;\nimport\
    \ org.junit.Test;\nimport java.awt.image.RenderedImage;\npublic class ChromeReportTest\
    \ extends BaseTest {\n    @Test\n    public void test () throws Exception{\n \
    \       ModifiableReportConfiguration reportConfig = ReportConfigurationFactory.createDefaultReportConfiguration();\n\
    \        reportConfig.setOverrideExisting( true );\n        reportConfig.setTargetDirectory(\
    \ \"RunResults\" ); // 该文件夹必须在 C:\\ 下存在\n        reportConfig.setReportFolder(\
    \ \"myreportdirectory\" );\n        reportConfig.setTitle( \"My Report\" );\n\
    \        reportConfig.setDescription( \"Report Description\" );\n        reportConfig.setSnapshotsLevel(Level.OnError);\n\
    \        Reporter.init(reportConfig);\n        Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n\
    \        Try {\n            //导航到 http://www.softpost.org/selenium-test-page/\n\
    \            browser.navigate( \"http://www.softpost.org/selenium-test-page/\"\
    \ );\n            browser.sync();\n            //在输入框中设置值\n            EditField\
    \ firstName = browser.describe(EditField.class , EditFieldDescription.Builder()\n\
    \                .id( \"fn\" ).build());\n            firstName.setValue( \"Sagar\"\
    \ );\n            //截图\n            RenderedImage img = browser.getPage().getSnapshot();\n\
    \            if (firstName.getValue().equalsIgnoreCase( \"sagar\" )) {\n     \
    \           Reporter.reportEvent( \"Verify Editbox\" , \"Value is sagar\" , Status.Passed,img);\n\
    \            } else {\n                Reporter.reportEvent( \"Verify Editbox\"\
    \ , \"Value is not sagar\" , Status.Failed,img);\n            }\n        } catch\
    \ (AssertionError ex){\n            //报告异常\n            Reporter.reportEvent(\
    \ \"Exception\" , \"Test failed\" , Status.Failed, ex);\n            throw ex;\n\
    \        } Finally {\n            //关闭浏览器\n            browser.close();\n    \
    \    }\n    }\n}\n```\n\n这里是使用上述代码生成的示例报告。\n![](img/image1451.jpg)\nLeanFT 中显示运行期间捕获截图的\
    \ HTML 报告\n\n## 13. LeanFT 框架\n\n### 13.1 与 Cucumber 的 LeanFT\n\n我们可以将 LeanFT\
    \ 测试与 Cucumber BDD 框架集成。如果你知道如何使用 Cucumber，就可以轻松地集成 LeanFT。请按照以下步骤操作：\n\n1. 使用\
    \ Cucumber 创建 LeanFT 测试。\n2. 在 pom.xml 中添加 `cucumber` 和 `selenium` 依赖。\n3. 编写\
    \ feature 文件。\n4. 为场景编写步骤定义。\n5. 执行 feature 文件。\n\n这里是需要添加 cucumber 的依赖：\n\n```xml\n\
    <dependency>\n    <groupId>info</groupId>\n    <artifactId>cucumber-java</artifactId>\n\
    \    <version>1.4</version>\n    <scope>test</scope>\n</dependency>\n```\n\n然后你需要按照下面的示例创建\
    \ feature 文件：\n\n```gherkin\nFeature: My feature\nScenario: My Scenario\nGiven\
    \ I am on softpost.org page\nThen I verify that title contains tutorial\n```\n\
    \n之后你可以按照示例创建步骤定义：\n\n```java\npackage org.softpost;\nimport com.hp.lft.report.Reporter;\n\
    import com.hp.lft.sdk.ModifiableReportConfiguration;\nimport com.hp.lft.sdk.SDK;\n\
    import com.hp.lft.sdk.web.Browser;\nimport com.hp.lft.sdk.web.BrowserFactory;\n\
    import com.hp.lft.sdk.web.BrowserType;\nimport cucumber.api.java.After;\nimport\
    \ cucumber.api.java.Before;\nimport cucumber.api.java.en.Given;\nimport cucumber.api.java.en.Then;\n\
    import org.junit.Assert;\nimport java.net.URI;\n/**\n * 由 Sagar 创建于 23 -2016.*/\n\
    public class Steps{\n    Browser browser;\n    @Before\n    public void init()\
    \ throws Exception {\n        ModifiableSDKConfiguration config = new ModifiableSDKConfiguration();\n\
    \        config.setServerAddress( new URI( \"ws://localhost:5095\" ));\n     \
    \   SDK.init(config);\n        Reporter.init();\n    }\n    @Given( \"^I am on\
    \ softpost\\.org page$\" )\n    public void i_am_on_softpost_page() throws Throwable{\n\
    \        browser = BrowserFactory.launch(BrowserType.CHROME);\n        browser.navigate(\
    \ \"http://www.softpost.org\" );\n    }\n    @Then( \"^I verify that title contains\
    \ tutorial$\" )\n    public void i_verify_that_title_contains_tutorial() throws\
    \ Throwable {\n        Assert.assertTrue(browser.getTitle().toLowerCase().contains(\
    \ \"tutorial\" ));\n    }\n    @After\n    public void clean() throws Exception\
    \ {\n        browser.close();\n        SDK.cleanup();\n    }\n}\n```\n\n### 13.2\
    \ 关键字驱动框架\n\n关键字驱动框架在 LeanFT 中非常流行。请按照以下步骤创建关键字驱动框架：\n\n1. 查找应用程序的主要操作和功能。\n2.\
    \ 将每个功能映射到关键字。\n3. 编写自动化特定关键字的代码。\n4. 创建由一个或多个关键字组成的测试用例。你可以将测试表存储在 Excel 文件、数据库或\
    \ `JUnit` 或 `TestNG` 测试类中。\n5. 除非你使用 `JUnit` 或 `TestNG` 执行测试，否则你可能需要创建一个驱动脚本来执行每个用例。\n\
    \n这里是 HP 提供的 WPF 应用程序案例研究。在此应用程序中我们可以为每个主要功能创建一个关键字，如登录应用程序、搜索航班、选择航班、下单、搜索订单、删除订单、取消订单、预订机票、验证航班。然后我们可以使用上述相同的关键字创建各种用户场景的测试用例。这里是使用上述关键字创建的两个用例。注意，在下面的用例中，我们重用了登录关键字。\n\
    \n这里是搜索航班的测试用例：\n\n1. 登录航班应用程序。\n2. 搜索下周从伦敦飞往巴黎的单人航班。\n\n"
- fmt: "\n### 3. Verify that flights are displayed from London to Paris only.\n\n\
    Here is the test case to search for a order.\n\n1. Login to the `Flight` application.\n\
    2. Book a flight and note down order number say `88`.\n3. Search for order with\
    \ id `88`.\n4. Verify that flight details are correctly displayed.\n\n### 13.3\
    \ Data Driven Frameworks\nData driven framework are used when you need to test\
    \ the application with various types of data. You can store the data in below\
    \ formats.\n\n1. Microsoft Excel Files\n2. Databases\n\nIn data driven frameworks,\
    \ we test the same feature but with different set of data. For example, in HP\
    \ flight application, we can test the `Login` functionality with various combination\
    \ of `User Id` and `Password`. Note that here `Login` functionality is same but\
    \ Test data is different during each run.\n\n### 14. Converting the UFT Object\
    \ Repository to Application models in LeanFT\nWe can use below command line utility\
    \ to convert the Object repository to Application models in LeanFT.\n![](image1586.jpg)\n\
    \n#### OR2AppModelConverter in Java\nHere is the syntax of this utility.\n\n```\n\
    OR2AppModelConverter myuftOR.tsr myAppModel.tsrx myLogFile.log\n```\n**Warning**:\
    \ First argument is the path of the object repository file. Second argument is\
    \ the path of the application model file. Third argument is the path of the log\
    \ file and last argument is the log level (It can be `Info`, `Warning` or `Error`).\n\
    \n### 15. Integrating the LeanFT tests with CI servers\n#### 15.1 Adding maven\
    \ task in Bamboo\nThe important settings of `maven` task are given below.\n\n\
    1. Provide the path of `maven` executable.\n2. Provide any valid [maven goal](http://www.softpost.org/maven/maven-commands/)\n\
    \nBelow image shows how to configure the `maven` task in `Bamboo`. We have set\
    \ up the clean test goal.\n![](image1605.jpg)\nmaven task in Bamboo\n\nBelow image\
    \ shows the sample output of the build plan using `maven` task.\n![](image1611.jpg)\n\
    maven output in Bamboo\n\n#### 15.2 Creating and Configuring the builds in Jenkins\n\
    Now let us understand how to create and configure a typical build in `Jenkins`.\
    \ To create new build (also called as job), click on `New Item` link on `Jenkins`\
    \ Home page. It will open below page.\n![](image1620.jpg)\nNew Jenkins Build project\n\
    \nThen enter name of project, select `freestyle project` option and click on `OK`.\
    \ It will open Build configuration page as shown below. Enter project description\
    \ and add parameter if you want pass any parameter to the build.\n![](image1625.jpg)\n\
    Build configuration in Jenkins - Build name, description, parameters\n\nNext you\
    \ need to configure the SCM like `git` as shown in below image. In this example,\
    \ we are using repository on `GITHUB`. But you can use any other version control\
    \ software.\n![](image1630.jpg)\ngit - Source code management in Jenkins build\n\
    \nNext - you have to specify the build triggers. You can specify the trigger in\
    \ the form of `Cron` expressions. You can also poll `SCM` at regular intervals\
    \ and if changes are detected, build will be run.\n![](image1637.jpg)\nBuild triggers\
    \ in Jenkins\n\nYour job/project is made up of multiple build steps. So you can\
    \ add build steps as shown in below image. Note that you will not see all build\
    \ steps as shown in below image unless you have installed proper plugins. For\
    \ examples - `MSBuild` step will not be available unless you install `MSBuild`\
    \ plugin in `Jenkins`.\n![](image1643.jpg)\nBuild steps in Jenkins\n![](image1648.jpg)\n\
    maven build step in Jenkins\n\nLast thing you need to do is configure post-build\
    \ actions. Below image shows possible post-build actions that you can do.\n![](image1654.jpg)\n\
    post-build actions in Jenkins\n\nAbove step is optional. So just go ahead and\
    \ click on `Save` button. Well done! You have just created a sample build in `Jenkins`.\
    \ To view your build project, just go to homepage. You will see your build(Highlighted\
    \ in yellow color) as shown in below image.\n![](image1660.jpg)\nJenkins build\
    \ on Dashboard\n\n#### 15.3 Build steps for Maven project in TeamCity\nIn this\
    \ topic, you will learn how to set up a build steps for `maven` project in `TeamCity`.\
    \ As shown in below image, you have to select runner type as `Maven`. Then you\
    \ have to provide the goals to be executed. By default, it uses `POM.xml` in the\
    \ root directory of the project. You may also run code coverage process along\
    \ with test goal which gives report on how many classes were covered by tests.\
    \ Here is the list of some of the popular `maven` goals that can be used.\n\n\
    1. `test` - execute tests using `surefire` plugin. We can also pass various parameters\
    \ to `maven JUnit test goal` and `maven testNG test goal`\n2. `verify` - executes\
    \ unit tests as well as does verification provided by plugins\n3. `install`\n\
    4. `site`\n5. `deploy`\n\n![](image1675.jpg)\nmaven build step in TeamCity\n\n\
    Below image shows that sample build log.\n![](image1682.jpg)\nmaven build log\
    \ in TeamCity\n\n### 16. Challenges and Solutions\n#### 16.1 Challenges of LeanFT\
    \ automation\nHere is the list of main `LeanFT` challenges.\n\n1. `LeanFT` does\
    \ not support third party controls. We have to use `Native` objects to automate\
    \ such third party objects.\n2. Dynamic Elements like check boxes, buttons, radio\
    \ buttons inside nested tables. We have to use `HTML DOM` to handle such elements.\n\
    \n#### 16.2 Working with third party objects using Native Object properties and\
    \ methods\nBelow example illustrates how to access `native object properties`\
    \ in `LeanFT`. In below example, we have set the value in edit box using `native\
    \ value` property. We have also used `native click` method to click on.\n\n```java\n\
    package leanft;\nimport com.hp.ft.report.Reporter;\nimport com.hp.ft.report.Status;\n\
    import com.hp.ft.sdk.NativeObject;\nimport org.junit.Test;\nimport java.util.List;\n\
    \npublic class ChromeTest extends BaseTest {\n    @Test\n    public void test()\
    \ throws Exception {\n        Browser browser = BrowserFactory.launch(BrowserType.ROME);\n\
    \        try {\n            //Navigate to http://soft.post.org/test-page/\n  \
    \          browser.navigate(\"http://soft.post.org/test-page/\");\n          \
    \  browser.sync();\n            //set value in edit box\n            browser.describe(EditField.class,\
    \ new EditField.Builder()).id(\"fn\").build()).setValue(\"S\");\n            //get\
    \ native object\n            NativeObject obj = browser.describe(EditField.class,\
    \ new EditField.Builder()).id(\"fn\").build()).getNativeObject();\n          \
    \  //list native members of the object\n            List<String> list = obj.getMembers();\n\
    \            for (String s : list) {\n                System.out.println(s);\n\
    \            }\n            obj.setProperty(\"value\", \"Native\");\n        \
    \    Thread.sleep(3000);\n            //click on Home link using native method\n\
    \            browser.describe(Link.class, new Link.Builder()).tagName(\"A\").innerText(\"\
    Home\").build()).getNativeObject().invokeMethod(\"click\");\n        } catch (AssertionError\
    \ ex) {\n            //Report the Exception\n            Reporter.reportEvent(\"\
    Exception\", \"Test failed\", Status.Failed, ex);\n            throw ex;\n   \
    \     } finally {\n            //Close the browser\n            browser.close();\n\
    \        }\n    }\n}\n```\n\n### 17. LeanFT common issues and solutions\nI have\
    \ listed down common issues and solutions that you may encounter while working\
    \ with `LeanFT`.\n\n1. `Failed to connect to LeanFT run time engine on....` This\
    \ exception comes when `LeanFT` run time engine is not running. Just start the\
    \ engine and this error should vanish.\n2. `An Internal problem has occurred,\
    \ please make sure the LeanFT SDK was properly initialized....` This exception\
    \ comes when you have not initialized `LeanFT SDK`. To get rid of this exception,\
    \ add below lines at the beginning of the code.\n\n```java\nModifiableSDKConfiguration\
    \ config = new ModifiableSDKConfiguration();\nconfig.setServerAddress(new URI(\"\
    ws://localhost:5095\"));\nSDK.init(config);\n```\n3. `IntelliJ IDEA does not start\
    \ when LeanFT is plugin is enabled` – To fix this issue kill the `LeanFT` plugin\
    \ for `IntelliJ IDEA` in process explorer.\n"
