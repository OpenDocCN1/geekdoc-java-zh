  trans: "\n以下代码展示了如何使用应用模型（application model）编写测试。\n\n```java\npackage leanft;\n\
    import com.hp.lft.sdk.web.Browser;\nimport com.hp.lft.sdk.web.BrowserFactory;\n\
    import com.hp.lft.sdk.web.BrowserType;\nimport org.junit.Test;\n/**\n  * Created\
    \ by Sagar on 22 - 07 - 2016.\n*/\npublic class AppModelTest extends BaseTest{\n\
    \    @Test\n    public void test1() throws Exception {\n        Browser browser\
    \ = BrowserFactory.launch(BrowserType.CHROME);\n        browser.navigate( \"http://www.softpost.org/selenium-test-page/\"\
    \ );\n        AppModel model = new AppModel(browser);\n        model.SeleniumTestPage().firstName().setValue(\
    \ \"Sagar\" );\n    }\n}\n```\n\n另一个需要注意的重要点是，我们可以应用模型结合描述编程（description programming）来识别对象，如下示例代码所示。注意，我们使用了应用模型中的\
    \ `SeleniumTestPage` 对象，但我们使用了描述编程来识别 `page.model.SeleniumTestPage().describe(EditField.class,new\
    \ EditFieldDescription.Builder().id(\"fn\").build()).setValue(\"Salunke\");` 的\
    \ `EditField` 对象。\n\n### 8.3 在属性值中使用正则表达式\n要定义对象的属性值，我们可以使用正则表达式。下面的示例展示了如何使用正则表达式来定义属性值。注意，我们正在点击一个内部文本匹配正则表达式\
    \ `.*Dev.*` 的链接。\n\n```java\npackage leanft;\nimport com.hp.lft.report.Reporter;\n\
    import com.hp.lft.report.Status;\nimport com.hp.lft.sdk.RegExpProperty;\nimport\
    \ com.hp.lft.sdk.web.*;\nimport org.junit.Test;\npublic class RegularExpressionTest\
    \ extends BaseTest{\n    @Test\n    public void test() throws Exception {\n  \
    \      Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n        Try\
    \ {\n            //Navigate to http://www.softpost.org/selenium-test-page/\n \
    \           browser.navigate( \"http://www.softpost.org/selenium-test-page/\"\
    \ );\n            browser.sync();\n            //set value in edit box\n     \
    \       browser.describe(EditField.class, new EditFieldDescription.Builder()\n\
    \            .id( \"fn\" ).build()).setValue( \"Sagar\" );\n            //click\
    \ on link containing Dev substring\n            browser.describe(Link.class, new\
    \ LinkDescription.Builder()\n            .tagName( \"A\" ).index(1).innerText(\
    \ RegExpProperty( \".*Dev.*\" )).build()).click();\n            //Wait until page\
    \ loads\n            Thread .sleep(300);\n        } catch (AssertionError ex)\
    \ {\n            //Report the Exception\n            Reporter.reportEvent( \"\
    Exception\" , \"Test failed\" , Status.Failed, ex);\n            throw ex;\n \
    \       } Finally {\n            //Close the browser\n            browser.close();\n\
    \        }\n    }\n}\n```\n我们还可以使用正则表达式来指定应用模型中对象属性的值。\n\n---\n\n### 9. 自动化 Web\
    \ 应用\n\n#### 9.1 第一个 Web 应用测试\n这里是使用 LeanFT 的第一个 Web 应用测试。在下面的代码中，我们启动了 Chrome\
    \ 浏览器然后导航到 `http://www.softpost.org/selenium-test-page/`。之后，我们在编辑框中输入值并点击 Home\
    \ 链接。相同的代码在其他浏览器（Firefox, Internet Explorer, Edge）上同样有效。要启动其他浏览器，你需要在启动方法中更改浏览器类型。\n\
    \n```java\npackage leanft;\nimport com.hp.lft.report.Reporter;\nimport com.hp.lft.report.Status;\n\
    import com.hp.lft.sdk.ModifiableSDKConfiguration;\nimport com.hp.lft.sdk.SDK;\n\
    import com.hp.lft.sdk.web.*;\nimport com.hp.lft.sdk.web.EditField;\nimport com.hp.lft.sdk.web.EditFieldDescription;\n\
    import org.junit.Test;\nimport java.net.URI;\nimport static org.junit.Assert.assertEquals;\n\
    public class ChromeTest extends BaseTest{\n    @Test\n    public void test() throws\
    \ Exception {\n        Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n\
    \        Try {\n            //Navigate to http://www.softpost.org/selenium-test-page/\n\
    \            browser.navigate( \"http://www.softpost.org/selenium-test-page/\"\
    \ );\n            browser.sync();\n            //set value in edit box\n     \
    \       browser.describe(EditField.class, new EditFieldDescription.Builder()\n\
    \            .id( \"fn\" ).build()).setValue( \"Sagar\" );\n            //click\
    \ on Home link\n            browser.describe(Link.class, new LinkDescription.Builder()\n\
    \            .tagName( \"A\" ).innerText( \"Home\" ).build()).click();\n     \
    \       //Wait until page loads\n            browser.sync();\n        } catch\
    \ (AssertionError ex) {\n            //Report the Exception\n            Reporter.reportEvent(\
    \ \"Exception\" , \"Test failed\" , Status.Failed, ex);\n            throw ex;\n\
    \        } Finally {\n            //Close the browser\n            browser.close();\n\
    \        }\n    }\n}\n```\n注意，`BaseTest` 类提供了初始化和清理 LeanFT SDK 的代码。\n\n```java\n\
    package leanft;\nimport com.hp.lft.report.Reporter;\nimport com.hp.lft.sdk.ModifiableSDKConfiguration;\n\
    import com.hp.lft.sdk.SDK;\nimport org.junit.After;\nimport org.junit.Before;\n\
    import java.net.URI;\npublic class BaseTest{\n    @Before\n    public void init()\
    \ {\n        try {\n            ModifiableSDKConfiguration config = new ModifiableSDKConfiguration();\n\
    \            config.setServerAddress( new URI( \"ws://localhost:095\" ));\n  \
    \          SDK.init(config);\n            Reporter.init();\n        } catch (\
    \ Exception ex) {\n            System.out.println( \"Exception \" + ex.toString());\n\
    \        }\n    }\n    @After\n    public void clean() throws Exception {\n  \
    \      Reporter.generateReport();\n        SDK.cleanup();\n    }\n}\n```\n\n####\
    \ 9.2 使用 XPATH 和 CSS 识别 Web 元素\n我们可以使用 `XPATH` 和 CSS` 选择器来识别 Web 元素。下面的示例说明了如何在\
    \ LeanFT 中使用 `XPATH`。在下面的示例中，我们使用 `XPATH` 识别了编辑框。对于更高级的 `XPATH` 表达式，你可以访问 - `http://selenium-interview-questions.blogspot.in/2014/02/how-to-identify-elements-using-xpath-in.html`。对于更高级的\
    \ CSS 表达式，你可以访问 - `http://selenium-interview-questions.blogspot.in/2014/02/how-to-identify-elements-using.html`。\n\
    \n```java\npackage leanft;\nimport com.hp.lft.report.Reporter;\nimport com.hp.lft.report.Status;\n\
    import com.hp.lft.sdk.web.*;\nimport org.junit.Test;\npublic class CsspathTest\
    \ extends BaseTest{\n    @Test\n    public void test() throws Exception {\n  \
    \      Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n        Try\
    \ {\n            //Navigate to http://www.softpost.org/selenium-test-page/\n \
    \           browser.navigate( \"http://www.softpost.org/selenium-test-page/\"\
    \ );\n            browser.sync();\n            //set value in edit box using xpath\n\
    \            browser.describe(EditField.class, new EditFieldDescription.Builder()\n\
    \            .xpath( \"//input[id='fn']\" ).build()).setValue( \"Sagar\" );\n\
    \            //set value in edit box using css\n            browser.describe(EditField.class,\
    \ new EditFieldDescription.Builder()\n            .cssSelector( \"input[id='fn']\"\
    \ ).build()).setValue( \"Salunke\" );\n        } catch (AssertionError ex) {\n\
    \            //Report the Exception\n            Reporter.reportEvent( \"Exception\"\
    \ , \"Test failed\" , Status.Failed, ex);\n            throw ex;\n        } Finally\
    \ {\n            //Close the browser\n            browser.close();\n        }\n\
    \    }\n}\n```\n\n#### 9.3 使用视觉标识符识别对象\n这是 UFT 和 LeanFT 中的一项高级功能，允许根据相邻对象的位置来识别对象。在下面的图中，我们可以通过关联的文本识别编辑框。\n\
    \nLeanFT 中的 VRI\n这是一个完整的示例，展示了如何在 LeanFT 中使用 VRI。注意，我们可以为对象提供多个视觉标识符。\n\n```java\n\
    package leanft;\nimport com.hp.lft.report.Reporter;\nimport com.hp.lft.report.Status;\n\
    import com.hp.lft.sdk.HorizontalVisualRelation;\nimport com.hp.lft.sdk.VisualRelation;\n\
    import com.hp.lft.sdk.web.*;\nimport org.junit.Test;\npublic class Vri extends\
    \ BaseTest{\n    @Test\n    public void test() throws Exception {\n        Browser\
    \ browser = BrowserFactory.launch(BrowserType.CHROME);\n        Try {\n      \
    \      //Navigate to http://www.softpost.org/selenium-test-page/\n           \
    \ browser.navigate( \"http://www.softpost.org/selenium-test-page/\" );\n     \
    \       browser.sync();\n            //set value in edit box\n            browser.describe(EditField.class,\
    \ new EditFieldDescription.Builder()\n            .id( \"fn\" ).build()).setValue(\
    \ \"Sagar\" );\n            WebElement e2 = browser.describe(WebElement.class,\
    \ new WebElementDescription.Builder()\n            .xpath( \"//td[text()='Last\
    \ Name']\" ).build());\n            browser.describe(EditField.class, new EditFieldDescription.Builder()\n\
    \            .vri( new VisualRelation().setTestObject(e2).setHorizontalRelation(HorizontalVisualRelation.LEFT_AND_INLINE)).build())\n\
    \            .setValue( \"Salunke\" );\n            //click on Home link\n   \
    \         browser.describe(Link.class, new LinkDescription.Builder()\n       \
    \     .tagName( \"A\" ).innerText( \"Home\" ).build()).click();\n            //Wait\
    \ until page loads\n            browser.sync();\n        } catch (AssertionError\
    \ ex) {\n            //Report the Exception\n            Reporter.reportEvent(\
    \ \"Exception\" , \"Test failed\" , Status.Failed, ex);\n            throw ex;\n\
    \        } Finally {\n            //Close the browser\n            browser.close();\n\
    \        }\n    }\n}\n```\n\n#### 9.4 处理 Windows 应用中的嵌入浏览器控件\n有时，Windows 应用包含嵌入浏览器控件的元素。要将浏览器控件内部的元素识别为\
    \ Web 元素，你需要在 LeanFT 中注册该浏览器控件。要在 LeanFT 中注册浏览器控件，请按照以下步骤操作。\n\n"
