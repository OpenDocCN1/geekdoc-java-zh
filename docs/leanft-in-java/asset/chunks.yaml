- fmt: "\n![](image1026.jpg)\n\n# Registering browser control with LeanFT\nOnce the\
    \ browser control is registered, all objects inside it will be identified as web\
    \ objects. Note that LeanFT can handle browser control based on IE engine only!\n\
    \n## 9.5 Firing events on Web Elements using LeanFT\nWe can fire html events like\
    \ `click`, `change` etc on any Web element using `EventInfo` class in LeanFT.\
    \ Here is the complete example that illustrates how to fire events. \n\n```java\n\
    package leanft;\nimport com.hp.lft.report.Reporter;\nimport com.hp.lft.report.Status;\n\
    import com.hp.lft.sdk.NativeObject;\nimport com.hp.lft.sdk.web..*;\nimport org.junit.Test;\n\
    import java.util.List;\npublic class ChromeNativeObjectTest extends BaseTest{\n\
    \    @Test\n    public void test() throws Exception {\n        Browser browser\
    \ = BrowserFactory.launch(BrowserType.CHROME);\n        try {\n            //Navigate\
    \ to http://www.softpost.org/selenium-test-page/\n            browser.navigate(\"\
    http://www.softpost.org/selenium-test-page/\");\n            browser.sync();\n\
    \            //set value in edit box\n            browser.describe(EditField.class,\
    \ new EditFieldDescription.Builder()\n                .id(\"fn\").build()).setValue(\"\
    Sagar\");\n            browser.describe(Link.class, new LinkDescription.Builder()\n\
    \                .tagName(\"A\").innerText(\"Home\").build()).fireEvent(EventInfoFactory.createEvent(\"\
    click\"));\n            Thread.sleep(3000);\n        } catch (AssertionError ex){\n\
    \            //Report the Exception\n            Reporter.reportEvent(\"Exception\"\
    , \"Test failed\", Status.Failed, ex);\n            throw ex;\n        } Finally\
    \ {\n            //Close the browser\n            browser.close();\n        }\n\
    \    }\n}\n```\n\nAlternatively, you can also execute custom JavaScript using\
    \ below syntax.\n`String html = browser.getPage().runJavaScript(\"document.body.innerHTML;\"\
    );`\n\nTo fire change event on element with id -fn, You can use below Javascript\
    \ as argument to `runJavaScript()` method.\n```javascript\nvar evt = document.createEvent('HTMLEvents');\n\
    evt.initEvent('change', true, true);\ndocument.findElementById('fn').dispatchEvent(evt);\n\
    ```\n\n## 9.6 Executing JavaScript in web page\nWhile automating web applications,\
    \ you might need to execute the JavaScript to perform certain operations. LeanFT\
    \ allows you to execute custom JavaScript as shown in below example. We can use\
    \ `runJavaScript` method of `Page` class to execute any valid JavaScript.\n\n\
    ```java\npackage leanft ;\nimport com.hp.lft.report.Reporter ;\nimport com.hp.lft.report.Status\
    \ ;\nimport com.hp.lft.sdk.web.*;\nimport com.hp.lft.verifications.Verify ;\n\
    import org.junit.Test ;\npublic class ExecuteJavaScriptTest extends BaseTest{\n\
    \    @Test\n    public void test () throws Exception {\n        Browser browser\
    \ = BrowserFactory.launch(BrowserType.INTERNET_EXPLORER);\n        Try {\n   \
    \         //Navigate to http://www.softpost.org/selenium-test-page/\n        \
    \    browser.navigate(\"http://www.softpost.org/selenium-test-page/\");\n    \
    \        browser.sync();\n            String html = browser.getPage().runJavaScript(\"\
    document.body. innerHTML;\");\n            System.out.println(\"HTML Source of\
    \ the page\" + html);\n            System.out.println(\"Scrolling to 20,100\"\
    );\n            browser.getPage().runJavaScript(\"window.scrollTo(20,100);\");\n\
    \            String documentState = browser.getPage().runJavaScript(\"document.readyState\"\
    );\n            System.out.println(\"Document is \" + documentState);\n      \
    \  } catch ( AssertionError ex ){\n            //Report the Exception\n      \
    \      Reporter.reportEvent(\"Exception\", \"Test failed\", Status, ex);\n   \
    \         throw ex;\n        } Finally {\n            //Close the browser\n  \
    \          browser.close ();\n        }\n    }\n}\n```\n\n# 10. Automating windows\
    \ applications\n\n## 10.1 Automating standard windows application\nTo automate\
    \ the standard windows apps, you will need to import below packages in LeanFT\
    \ projectcom.hp.lft.sdk.stdwinHere is the sample application that launches the\
    \ notepad and enters text in it. Then it tries to close the notepad. After that\
    \ it clicks on Don't save button on the Dialog.\n\n```java\npackage leanft;\n\
    import com.hp.lft.sdk.Desktop;\nimport com.hp.lft.sdk.stdwin.*;\nimport org.junit.Test;\n\
    import static org.junit.Assert.assertEquals;\npublic class NotepadTest extends\
    \ BaseTest{\n    @Test\n    public void test() throws Exception {\n        new\
    \ ProcessBuilder(\"C:\\\\Windows\\\\System32\\\\notepad.exe\").start();\n    \
    \    Thread.sleep(3000);\n        Window notepadWin = Desktop.describe(Window.class,\n\
    \            new WindowDescription.Builder().windowTitleRegExp(\"Notepad\").build());\n\
    \        Editor editor = notepadWin.describe(Editor.class,\n            new EditorDescription.Builder().nativeClass(\"\
    Edit\").windowClassRegExp(\"Edit\").build());\n        editor.sendKeys(\"This\
    \ is automated text\");\n        Thread.sleep(3000);\n        notepadWin.close();\n\
    \        Desktop.describe(Window.class, new WindowDescription.Builder()\n    \
    \        .ownedWindow(false).childWindow(false).windowClassRegExp(\"Notepad\"\
    ).windowTitleRegExp(\" Notepad\").build())\n            .describe(Dialog.class,\
    \ new DialogDescription.Builder()\n            .ownedWindow(true).childWindow(false).text(\"\
    Notepad\").nativeClass(\"#32770\").build())\n            .describe(Button.class,\
    \ new ButtonDescription.Builder()\n            .text(\"Do&n't Save\").nativeClass(\"\
    Button\").build()).click();\n    }\n}\n```\n\n## 10.2 Automating Java Application\n\
    Automating the Java applications is just like that of Standard windows applications.\
    \ Only difference is that you need to import classes in below package. `import\
    \ com.hp.lft.sdk.java.*;`\nHere is the sample example that identifies the Java\
    \ window with title - XYZ and then clicks on the check box with attached text\
    \ as \"Gender\" inside a frame.\n\n```java\npackage leanft;\nimport com.hp.lft.sdk.CheckedState;\n\
    import com.hp.lft.sdk.Desktop;\nimport com.hp.lft.sdk.java.*;\nimport org.junit.Test;\n\
    public class JavaTest extends BaseTest{\n    @Test\n    public void test() throws\
    \ Exception{\n        Window javaWin = Desktop.describe(Window.class, new WindowDescription.Builder()\n\
    \            .title(\"XYZ\").build());\n        CheckBox checkBox = javaWin.describe(InternalFrame.class,\
    \ new InternalFrameDescription.Builder()\n            .title(\"Frame\").build()).describe(CheckBox.class,\
    \ new CheckBoxDescription.Builder()\n            .attachedText(\"Gender\").build());\n\
    \        checkBox.setState(CheckedState.CHECKED);\n    }\n}\n```\n\n## 10.3 Automating\
    \ WPF applications\nBelow example illustrates how to automate WPF application\
    \ using LeanFT. Note that need to import classes from belowcom.hp.lft.sdk.wpfIn\
    \ below example, we are first identifying the WPF window with title - Bus Application.\
    \ After that we have identified the ComboBox with name sourceCity and finally\
    \ we have listed all the options in sourceCity. \n\n```java\npackage leanft;\n\
    import com.hp.lft.sdk.Desktop;\nimport com.hp.lft.sdk.wpf.ComboBox;\nimport com.hp.lft.sdk.wpf.ComboBoxDescription;\n\
    import com.hp.lft.sdk.wpf.Window;\nimport com.hp.lft.sdk.wpf.WindowDescription;\n\
    import org.junit.Test;\n/**\n * Created by Sagar on 20 - 07 - 2016.*/\npublic\
    \ class WpfTest extends BaseTest{\n    @Test\n    public void test1() throws Exception\
    \ {\n        Window win = Desktop.describe(Window.class, new WindowDescription.Builder()\n\
    \            .objectName(\"Bus Application\").fullType(\"window\").windowTitleRegExp(\"\
    Bus Application\").build());\n        ComboBox box= win.describe(ComboBox.class,\
    \ new ComboBoxDescription.Builder()\n            .objectName(\"sourceCity\").build());\n\
    \        for (String s :box.getItems()){\n            System.out.println(s);\n\
    \        }\n    }\n}\n```\n\n## 10.4 Automating SAP Application\nAutomating SAP\
    \ applications is very much similar to automation of standard windows applications.\
    \ Please note that you will have to use classes from below SAP com.hp.lft.sdk.sap.gui.*;import\
    \ com.hp.lft.sdk.sap.ui5.*; \n\n# 11. Synchronization\nBy default, LeanFT will\
    \ wait for 20 seconds when trying to find the objects. If it doesn't identify\
    \ the object with 20 seconds, exception is thrown. You can change this timeout\
    \ from LeanFT settings dialog. Additionally you also add custom wait conditions.\n\
    \n```java\npackage leanft;\nimport com.hp.lft.sdk.GeneralLeanFtException;\nimport\
    \ com.hp.lft.sdk.*;\nimport com.hp.lft.sdk.stdwin.ToolBar;\nimport com.hp.lft.sdk.stdwin.Window;\n\
    import com.hp.lft.sdk.stdwin.WindowDescription;\nimport org.junit.Assert;\nimport\
    \ org.junit.Test;\n/**\n * Created by Sagar on 21 - 07 - 2016.*/\npublic class\
    \ SynchTest extends BaseTest{\n    @Test\n    public void test1() throws Exception\
    \ {\n        WaitUntilTestObjectState.WaitUntilEvaluator< Window > evaluator =\
    \ new WaitUntilTestObjectState.WaitUntilEvaluator< Window >() {@Override\n   \
    \         public boolean evaluate( Window testObject) throws GeneralLeanFtException{\n\
    \                return testObject.getWindowState()==WindowState.MAXIMIZED;}};\n\
    \        new ProcessBuilder(\"C:\\\\Windows\\\\System32\\\\notepad.exe\").start();\n\
    \        Window notepadWindow = Desktop.describe(Window.class,\n            new\
    \ WindowDescription.Builder().windowClassRegExp(\"Notepad\").windowTitleRegExp(\"\
    Notepad\").build());\n        notepadWindow.maximize();\n        Assert.assertTrue(evaluator.evaluate(notepadWindow));\n\
    \    }\n}\n```\n\n# 12. Assertions and Reports\n\n## 12.1 Assertions in LeanFT\n\
    We can do assertions in LeanFT using `Verify` class in Validations namespace.\
    \ This class allows you to put the assertions in the code. Here is the sample\
    \ example showing usage of `Verify` class. Note that `Verify` class provides below\
    \ methods.\n"
  raw: '![](image1026.jpg)Registering browser control with LeanF TOnce the browser
    control is registered, all objects inside it will be identified as web objects.Note
    that LeanFT can handle browser control based on IE engine only!9.5 Firing events
    on Web Elements using LeanFTWe can fire html events like click, change etc on
    any Web element using EventInfo class in LeanFT.Here is the complete example that
    illustrates how to fire events.package leanft;import com.hp.lft.report.Reporter;import
    com.hp.lft.report.Status;import com.hp.lft.sdk.NativeObject;import com.hp.lft.sdk.web.
    * ;import org.junit.Test;import java.util.List;public class ChromeNativeObjectTest
    extends BaseTest{@Test     public void test() throws Exception     {Browser browser
    = BrowserFactory.launch(BrowserType.CHROME);         try {             //Navigate
    to http://www.softpost.org/selenium-test-page/            browser.navigate( "http://www.softpost.org/selenium-test-page/"
    ) ;browser.sync();             //set value in edit box            browser.describe(EditField.class,
    new EditFieldDescription.Builder()            .id( "fn" ).build()).setValue( "Sagar"
    );           browser.describe(Link.class, new LinkDescription.Builder()                    .tagName(
    "A" ).innerText( "Home" ).build()).fireEvent(EventInfoFactory.createEventInfo(
    "click" ));             Thread .sleep(3000);}         catch (AssertionError ex){           
    //Report the Exception           Reporter.reportEvent( "Exception" , "Test failed"
    , Status.Failed, ex);            throw ex;}         Finally         {            
    //Close the browserbrowser.close();}}}Alternatively, you can also execute custom
    JavaScript using below syntax.String html =   browser . getPage (). runJavaScript
    ( "document.body.innerHTML;" );To fire change event on element with id -fn, You
    can use below Javascript as argument to runJavaScript() method.var evt = document
    .createEvent( ''HTMLEvents'' );evt.initEvent ( ''change'' , true , true );document
    .findElementById( ''fn'' ).dispatchEvent( evt);9.6 Executing JavaScript in web
    pageWhile automating web applications, you might need to execute the JavaScript
    to perform certain operations.LeanFT allows you to execute custom JavaScript as
    shown in below example. We can use runJavaScript method of Page class to execute
    any valid JavaScript.package leanft ;import com.hp.lft.report.Reporter ;import
    com.hp.lft.report.Status ;import com.hp.lft.sdk.web.* ;import com.hp.lft.verifications.Verify
    ;import org.junit.Test ;public class ExecuteJavaScriptTest extends BaseTest{    
    @Test     public void test () throws Exception     {        Browser browser =
    BrowserFactory . launch ( BrowserType . INTERNET_EXPLORER );         Try        
    {             //Navigate to http://www.softpost.org/selenium-test-page/            browser
    . navigate ( "http://www.softpost.org/selenium-test-page/" );         browser
    . sync ();            String html =   browser . getPage (). runJavaScript ( "document.body.
    innerHTML;" );            System . out . println ( "HTML Source of the page" +
    html );            System . out . println ( "Scrolling to 120,100" );            browser
    . getPage (). runJavaScript ( "window.scrollTo(120,100);" );            String
    documentState = browser . getPage (). runJavaScript ( "document.readyState" );            System
    . out . println ( "Document State is " + documentState );         }         catch
    ( AssertionError ex ){            //Report the Exception           Reporter .
    reportEvent ( "Exception" , "Test failed" , Status . Failed , ex );           
    throw ex ;         }         Finally         {             //Close the browser            browser
    . close ();         }     }}10\. Automating windows applications10.1 Automating
    standard windows applicationTo automate the standard windows apps, you will need
    to import below packages in LeanFT project.com.hp.lft.sdk.stdwinHere is the sample
    application that launches the notepad and enters text in it. Then it tries to
    close the notepad. After that it clicks on Don''t save button on the Dialog box.package
    leanft;import com.hp.lft.sdk.Desktop;import com.hp.lft.sdk.stdwin. * ;import org.junit.Test;import
    static org.junit.Assert.assertEquals;public class NotepadTest extends BaseTest{@Test    
    public    void test() throws Exception     {         new ProcessBuilder( "C:\\Windows\\System32\\notepad.exe"
    ).start();         Thread .sleep(3000);         Window notepadWin = Desktop.describe(
    Window .class,                 new WindowDescription.Builder().windowTitleRegExp(
    "Notepad" ).build()) ;Editor editor = notepadWin.describe(Editor.class,                
    new EditorDescription.Builder().nativeClass( "Edit" ).windowClassRegExp( "Edit"
    ).build());        editor.sendKeys( "This is automated text" );         Thread
    .sleep(3000);notepadWin.close();        Desktop.describe( Window .class, new WindowDescription.Builder()                .ownedWindow(
    false ).childWindow( false ).windowClassRegExp( "Notepad" ).windowTitleRegExp(
    " Notepad" ).build())                .describe( Dialog .class, new DialogDescription.Builder()                .ownedWindow(
    true ).childWindow( false ).text( "Notepad" ).nativeClass( "#32770" ).build())                .describe(
    Button .class, new ButtonDescription.Builder()                .text( "Do&n''t
    Save" ).nativeClass( "Button" ).build()).click();}}10.2 Automating Java ApplicationAutomating
    the Java applications is just like that of Standard windows applications. Only
    difference is that you need to import classes in below package.import com.hp.lft.sdk.java.*;Here
    is the sample example that identifies the Java window with title - XYZ and then
    clicks on the check box with attached text as "Gender" inside a frame.package
    leanft;import com.hp.lft.sdk.CheckedState;import com.hp.lft.sdk.Desktop;import
    com.hp.lft.sdk.java. * ;import org.junit.Test;public class JavaTest extends BaseTest{@Test    
    public void test() throws Exception{         Window javaWin = Desktop.describe(
    Window .class, new WindowDescription.Builder()                .title( "XYZ" ).build());        CheckBox
    checkBox = javaWin.describe(InternalFrame.class, new InternalFrameDescription.Builder()                .title(
    "Frame1" ).build()).describe(CheckBox.class, new CheckBoxDescription.Builder()                .attachedText(
    "Gender" ).build()) ;checkBox.setState(CheckedState.CHECKED);}}10.3 Automating
    WPF applicationsBelow example illustrates how to automate WPF application using
    LeanFT. Note that we need to import classes from below package.com.hp.lft.sdk.wpfIn
    below example, we are first identifying the WPF window with title - Bus Application.
    After that we have identified the ComboBox with name sourceCity and finally we
    have listed down all the options in sourceCity ComboBox.package leanft;import
    com.hp.lft.sdk.Desktop;import com.hp.lft.sdk.wpf.ComboBox;import com.hp.lft.sdk.wpf.ComboBoxDescription;import
    com.hp.lft.sdk.wpf.Window;import com.hp.lft.sdk.wpf.WindowDescription;import org.junit.Test;/** 
    * Created by Sagar on 20 - 07 - 2016.*/public class WpfTest extends BaseTest{@Test    
    public void test1() throws Exception     {         Window win = Desktop.describe(
    Window .class, new WindowDescription.Builder()                .objectName( "Bus
    Application" ).fullType( "window" ).windowTitleRegExp( "Bus Application" ).build());       ComboBox
    box= win.describe(ComboBox.class, new ComboBoxDescription.Builder()                .objectName(
    "sourceCity" ).build());         for ( String s :box.getItems()){            
    System .out.println(s);}}}10.4 Automating SAP ApplicationAutomating SAP applications
    is very much similar to automation of standard windows applications.Please note
    that you will have to use classes from below SAP packages.import com.hp.lft.sdk.sap.gui.*
    ;import com.hp.lft.sdk.sap.ui5.* ;11\. SynchronizationBy default, LeanFT will
    wait for 20 seconds when trying to find the objects. If it doesn''t identify the
    object withing 20 seconds, exception is thrown.You can change this timeout from LeanFT
    settings dialog.Additionally you can also add custom wait conditions.package leanft;import
    com.hp.lft.sdk.GeneralLeanFtException;import com.hp.lft.sdk. * ;import com.hp.lft.sdk.stdwin.ToolBar;import
    com.hp.lft.sdk.stdwin.Window;import com.hp.lft.sdk.stdwin.WindowDescription;import
    org.junit.Assert;import org.junit.Test;/**  * Created by Sagar on 21 - 07 - 2016.*/public
    class SynchTest extends BaseTest{@Test     public void test1() throws Exception    
    {        WaitUntilTestObjectState.WaitUntilEvaluator< Window > evaluator = new
    WaitUntilTestObjectState.WaitUntilEvaluator< Window >() {@Override            
    public boolean evaluate( Window testObject) throws GeneralLeanFtException{               
      return testObject.getWindowState()==WindowState.MAXIMIZED;}};         new ProcessBuilder(
    "C:\\Windows\\System32\\notepad.exe" ).start();         Window notepadWindow =
    Desktop.describe( Window .class,                 new WindowDescription.Builder().windowClassRegExp(
    "Notepad" ).windowTitleRegExp( "Notepad" ).build());notepadWindow.maximize();Assert.assertTrue(evaluator.evaluate(notepadWindow));}}12\.
    Assertions and Reports12.1 Assertions in LeanFTWe can do assertions in LeanFT using
    Verify class in Validations namespace.This class allows you to put the assertions
    in the code. Here is the sample example showing usage of Verify class.Note that
    Verify class provides below methods.'
