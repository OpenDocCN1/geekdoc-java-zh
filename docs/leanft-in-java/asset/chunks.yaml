  trans: "\n\n![](img/image1026.jpg)\n\n# 在 LeanFT 中注册浏览器控件\n一旦注册了浏览器控件，其内部的所有对象都将被识别为\
    \ Web 对象。请注意，LeanFT 只能处理基于 IE 引擎的浏览器控件！\n\n## 9.5 使用 LeanFT 在 Web 元素上触发事件\n我们可以使用\
    \ LeanFT 中的 `EventInfo` 类在任何 Web 元素上触发如 `click`、`change` 等 html 事件。这里是一个完整的示例，说明了如何触发事件。\n\
    \n```java\npackage leanft;\nimport com.hp.lft.report.Reporter;\nimport com.hp.lft.report.Status;\n\
    import com.hp.lft.sdk.NativeObject;\nimport com.hp.lft.sdk.web..*;\nimport org.junit.Test;\n\
    import java.util.List;\npublic class ChromeNativeObjectTest extends BaseTest{\n\
    \    @Test\n    public void test() throws Exception {\n        Browser browser\
    \ = BrowserFactory.launch(BrowserType.CHROME);\n        try {\n            //Navigate\
    \ to http://www.softpost.org/selenium-test-page/\n            browser.navigate(\"\
    http://www.softpost.org/selenium-test-page/\");\n            browser.sync();\n\
    \            //set value in edit box\n            browser.describe(EditField.class,\
    \ new EditFieldDescription.Builder()\n                .id(\"fn\").build()).setValue(\"\
    Sagar\");\n            browser.describe(Link.class, new LinkDescription.Builder()\n\
    \                .tagName(\"A\").innerText(\"Home\").build()).fireEvent(EventInfoFactory.createEvent(\"\
    click\"));\n            Thread.sleep(3000);\n        } catch (AssertionError ex){\n\
    \            //Report the Exception\n            Reporter.reportEvent(\"Exception\"\
    , \"Test failed\", Status.Failed, ex);\n            throw ex;\n        } Finally\
    \ {\n            //Close the browser\n            browser.close();\n        }\n\
    \    }\n}\n```\n\n此外，你也可以使用以下语法执行自定义 JavaScript。\n`String html = browser.getPage().runJavaScript(\"\
    document.body.innerHTML;\");`\n\n若要在 id 为 -fn 的元素上触发 change 事件，你可以将下面的 Javascript\
    \ 作为 `runJavaScript()` 方法的参数。\n```javascript\nvar evt = document.createEvent('HTMLEvents');\n\
    evt.initEvent('change', true, true);\ndocument.findElementById('fn').dispatchEvent(evt);\n\
    ```\n\n## 9.6 在网页中执行 JavaScript\n在自动化 Web 应用时，你可能需要执行 JavaScript 来执行某些操作。LeanFT\
    \ 允许你像下面的示例所示执行自定义 JavaScript。我们可以使用 `Page` 类的 `runJavaScript` 方法来执行任何有效的 JavaScript。\n\
    \n```java\npackage leanft ;\nimport com.hp.lft.report.Reporter ;\nimport com.hp.lft.report.Status\
    \ ;\nimport com.hp.lft.sdk.web.*;\nimport com.hp.lft.verifications.Verify ;\n\
    import org.junit.Test ;\npublic class ExecuteJavaScriptTest extends BaseTest{\n\
    \    @Test\n    public void test () throws Exception {\n        Browser browser\
    \ = BrowserFactory.launch(BrowserType.INTERNET_EXPLORER);\n        Try {\n   \
    \         //Navigate to http://www.softpost.org/selenium-test-page/\n        \
    \    browser.navigate(\"http://www.softpost.org/selenium-test-page/\");\n    \
    \        browser.sync();\n            String html = browser.getPage().runJavaScript(\"\
    document.body. innerHTML;\");\n            System.out.println(\"HTML Source of\
    \ the page\" + html);\n            System.out.println(\"Scrolling to 20,100\"\
    );\n            browser.getPage().runJavaScript(\"window.scrollTo(20,100);\");\n\
    \            String documentState = browser.getPage().runJavaScript(\"document.readyState\"\
    );\n            System.out.println(\"Document is \" + documentState);\n      \
    \  } catch ( AssertionError ex ){\n            //Report the Exception\n      \
    \      Reporter.reportEvent(\"Exception\", \"Test failed\", Status, ex);\n   \
    \         throw ex;\n        } Finally {\n            //Close the browser\n  \
    \          browser.close ();\n        }\n    }\n}\n```\n\n# 10. 自动化 Windows \n\
    \n## 10.1 自动化标准 Windows 应用\n要自动化标准的 Windows 应用，你需要在 LeanFT 项目中导入以下包 `com.hp.lft.sdk.stdwin`。这里是一个启动记事本并在其中输入文本的示例应用程序。然后它会尝试关闭记事本。之后，它点击了对话框上的“不保存”按钮。\n\
    \n```java\npackage leanft;\nimport com.hp.lft.sdk.Desktop;\nimport com.hp.lft.sdk.stdwin.*;\n\
    import org.junit.Test;\nimport static org.junit.Assert.assertEquals;\npublic class\
    \ NotepadTest extends BaseTest{\n    @Test\n    public void test() throws Exception\
    \ {\n        new ProcessBuilder(\"C:\\\\Windows\\\\System32\\\\notepad.exe\").start();\n\
    \        Thread.sleep(3000);\n        Window notepadWin = Desktop.describe(Window.class,\n\
    \            new WindowDescription.Builder().windowTitleRegExp(\"Notepad\").build());\n\
    \        Editor editor = notepadWin.describe(Editor.class,\n            new EditorDescription.Builder().nativeClass(\"\
    Edit\").windowClassRegExp(\"Edit\").build());\n        editor.sendKeys(\"This\
    \ is automated text\");\n        Thread.sleep(3000);\n        notepadWin.close();\n\
    \        Desktop.describe(Window.class, new WindowDescription.Builder()\n    \
    \        .ownedWindow(false).childWindow(false).windowClassRegExp(\"Notepad\"\
    ).windowTitleRegExp(\"Notepad\").build())\n            .describe(Dialog.class,\
    \ new DialogDescription.Builder()\n                .text(\"Don't save\").build()).click();\n\
    \    }\n}\n```\n\n## 10.2 自动化 Java 应用\n自动化 Java 应用与标准 Windows 应用非常相似。不同在于你需要导入下面的包\
    \ `com.hp.lft.sdk.java`。这里有一个示例，它识别了窗口并点击了带有“Gender”文本的复选框。\n\n```java\npackage\
    \ leanft;\nimport com.hp.lft.sdk.Desktop;\nimport com.hp.lft.sdk.java.*;\nimport\
    \ org.junit.Test;\npublic class JavaTest extends BaseTest{\n    @Test\n    public\
    \ void test() throws Exception {\n        new ProcessBuilder(\"C:\\\\Windows\\\
    \\System32\\\\notepad.exe\").start();\n        Thread.sleep(3000);\n        Window\
    \ javaWin = Desktop.describe(Window.class,\n            new WindowDescription.Builder().windowTitleRegExp(\"\
    Notepad\").build());\n        Frame frame = javaWin.describe(Frame.class,\n  \
    \          new FrameDescription.Builder().title(\"Frame\").build());\n       \
    \ CheckBox checkBox = frame.describe(CheckBox.class,\n            new CheckBoxDescription.Builder().text(\"\
    Gender\").build());\n        checkBox.select();\n    }\n}\n```\n\n## 10.3 自动化\
    \ WPF 应用\n下面的示例展示了如何使用 LeanFT 自动化 WPF 应用。注意需要导入下面的包 `com.hp.lft.sdk.wpf`。我们首先识别了标题为“Bus\
    \ Application”的窗口，然后列出了该窗口中的所有选项。\n\n```java\npackage leanft;\nimport com.hp.lft.sdk.Desktop;\n\
    import com.hp.lft.sdk.wpf.*;\nimport org.junit.Test;\npublic class WpfTest extends\
    \ BaseTest{\n    @Test\n    public void test() throws Exception {\n        new\
    \ ProcessBuilder(\"C:\\\\Windows\\\\System32\\\\notepad.exe\").start();\n    \
    \    Thread.sleep(3000);\n        Window win = Desktop.describe(Window.class,\n\
    \            new WindowDescription.Builder().windowTitleRegExp(\"Bus Application\"\
    ).build());\n        ComboBox box = win.describe(ComboBox.class,\n           \
    \ new ComboBoxDescription.Builder().objectName(\"sourceCity\").build());\n   \
    \     for (String s : box.getItems()){\n            System.out.println(s);\n \
    \       }\n    }\n}\n```\n\n## 10.4 自动化 SAP 应用\n自动化 SAP 应用与标准 Windows 应用非常相似。请注意你需要使用下面的\
    \ SAP 包 `com.hp.lft.sdk.sap.*`。\n\n# 11. 同步\n默认情况下，LeanFT 在尝试查找对象时等待 20 秒。如果 20\
    \ 秒内未识别对象，则会抛出异常。你可以在 LeanFT 设置对话框中更改超时时间。此外，你还可以添加自定义等待条件。\n\n```java\npackage\
    \ leanft;\nimport com.hp.lft.sdk.GeneralLeanFtException;\nimport com.hp.lft.sdk.*;\n\
    import com.hp.lft.sdk.stdwin.ToolBar;\nimport com.hp.lft.sdk.stdwin.Window;\n\
    import com.hp.lft.sdk.stdwin.WindowDescription;\nimport org.junit.Assert;\nimport\
    \ org.junit.Test;\n/**\n * Created by Sagar on 21 - 07 - 2016.*/\npublic class\
    \ SynchTest extends BaseTest{\n    @Test\n    public void test1() throws Exception\
    \ {\n        WaitUntilTestObjectState.WaitUntilEvaluator< Window > evaluator =\
    \ new WaitUntilTestObjectState.WaitUntilEvaluator< Window >() {@Override\n   \
    \         public boolean evaluate( Window testObject) throws GeneralLeanFtException{\n\
    \                return testObject.getWindowState()==WindowState.MAXIMIZED;}};\n\
    \        new ProcessBuilder(\"C:\\\\Windows\\\\System32\\\\notepad.exe\").start();\n\
    \        Thread.sleep(3000);\n        Window notepadWindow = Desktop.describe(Window.class,\n\
    \            new WindowDescription.Builder().windowClassRegExp(\"Notepad\").windowTitleRegExp(\"\
    Notepad\").build());\n        notepadWindow.maximize();\n        Assert.assertTrue(evaluator.evaluate(notepadWindow));\n\
    \    }\n}\n```\n\n# 12. 断言与报告\n\n## 12.1 LeanFT 中的断言\n我们可以使用 Validations 命名空间下的\
    \ `Verify` 类在 LeanFT 中进行断言。该类允许你在代码中放置断言。这里是一个显示 `Verify` 类用用的示例。注意 `Verify` 类提供了以下方法。\n\
    \n"
- fmt: "\n## Verification Methods\n\n1. `areEqual`, `areNotEqual`\n2. `isTrue`, `isFalse`\n\
    3. `startsWith`, `contains`, `endsWith`\n4. `lessOrEqual`, `less`, `greater`,\
    \ `greaterOrEqual`\n5. `isMatch`\n6. `isNullOrEmpty`, `isNotNullOrEmpty`\n\n```java\n\
    package leanft;\nimport com.hp.lft.report.Reporter;\nimport com.hp.lft.report.Status;\n\
    import com.hp.lft.sdk.ModifiableSDKConfiguration;\nimport com.hp.lft.sdk.SDK;\n\
    import com.hp.lft.sdk.web.*;\nimport com.hp.lft.sdk.web.EditField;\nimport com.hp.lft.sdk.web.EditFieldDescription;\n\
    import com.hp.lft.verifications.Verify;\nimport org.junit.Test;\nimport java.net.URI;\n\
    import static org.junit.Assert.assertEquals;\npublic class ChromeTest extends\
    \ BaseTest{\n    @Test\n    public void test() throws Exception    {\n       \
    \ Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n        Try {\n\
    \            //Navigate to http://www.softpost.org/selenium-test-page/\n     \
    \       browser.navigate( \"http://www.softpost.org/selenium-test-page/\" );\n\
    \            browser.sync();\n            //set value in edit box\n          \
    \  browser.describe(EditField.class, new EditFieldDescription.Builder()\n    \
    \            .id( \"fn\" ).build()).setValue( \"Sagar\" );\n            //click\
    \ on Home link\n            browser.describe(Link.class, new LinkDescription.Builder()\n\
    \                .tagName( \"A\" ).innerText( \"Home\" ).build()).click();\n \
    \           //Wait until page loads\n            browser.sync();\n           \
    \ Verify.isTrue(browser.getTitle().toLowerCase().contains( \"tutorial\" ), \"\
    Verifying the title of Home page\" );\n        } catch (AssertionError ex){\n\
    \            //Report the Exception\n            Reporter.reportEvent( \"Exception\"\
    \ , \"Test failed\" , Status.Failed, ex);\n            throw ex;\n        } Finally\
    \ {\n            //Close the browser\n            browser.close();\n        }\n\
    \    }\n}\n```\n\nHere is the HTML report showing verification point.\n![](image1384.jpg)\n\
    Verify class in LeanFT.\n\n## 12.2 Generating reports with screenshots and recordings\n\
    \nReports can be generated in 2 ways in LeanFT.\n\n1. Screenshots using `Reporter`\
    \ and `TestObject.GetSnapshot`\n2. Video recordings of test execution using Microsoft\
    \ expression encoder.\n\nBy default, LeanFT creates the reports in `RunResults`\
    \ folder in the root directory of Java project. But you can change that using\
    \ the `ModifiableReportConfiguration` class as shown in below example. You can\
    \ also use below method to send your log messages to the report.\n\n### `Reporter.reportEvent`\
    \ \n\n```java\npackage leanft;\nimport com.hp.lft.report.*;\nimport com.hp.lft.sdk.Desktop;\n\
    import com.hp.lft.sdk.stdwin.Window;\nimport com.hp.lft.sdk.stdwin.WindowDescription;\n\
    import com.hp.lft.sdk.web.*;\nimport com.hp.lft.verifications.Verify;\nimport\
    \ org.junit.Test;\nimport java.awt.image.RenderedImage;\npublic class ChromeReportTest\
    \ extends BaseTest {\n    @Test\n    public void test () throws Exception{\n \
    \       ModifiableReportConfiguration reportConfig = ReportConfigurationFactory.createDefaultReportConfiguration();\n\
    \        reportConfig.setOverrideExisting( true );\n        reportConfig.setTargetDirectory(\
    \ \"RunResults\" ); // The folder must exist under C:\\\n        reportConfig.setReportFolder(\
    \ \"myreportdirectory\" );\n        reportConfig.setTitle( \"My Report\" );\n\
    \        reportConfig.setDescription( \"Report Description\" );\n        reportConfig.setSnapshotsLevel(Level.OnError);\n\
    \        Reporter.init(reportConfig);\n        Browser browser = BrowserFactory.launch(BrowserType.CHROME);\n\
    \        Try {\n            //Navigate to http://www.softpost.org/selenium-test-page/\n\
    \            browser.navigate( \"http://www.softpost.org/selenium-test-page/\"\
    \ );\n            browser.sync();\n            //set value in edit box\n     \
    \       EditField firstName = browser.describe(EditField.class , EditFieldDescription.Builder()\n\
    \                .id( \"fn\" ).build());\n            firstName.setValue( \"Sagar\"\
    \ );\n            //take screenshot\n            RenderedImage img = browser.getPage().getSnapshot();\n\
    \            if (firstName.getValue().equalsIgnoreCase( \"sagar\" )) {\n     \
    \           Reporter.reportEvent( \"Verify Editbox\" , \"Value is sagar\" , Status.Passed,img);\n\
    \            } else {\n                Reporter.reportEvent( \"Verify Editbox\"\
    \ , \"Value is not sagar\" , Status.Failed,img);\n            }\n        } catch\
    \ (AssertionError ex){\n            //Report the Exception\n            Reporter.reportEvent(\
    \ \"Exception\" , \"Test failed\" , Status.Failed, ex);\n            throw ex;\n\
    \        } Finally {\n            //Close the browser\n            browser.close();\n\
    \        }\n    }\n}\n```\n\nHere is the sample report generated by above code.\n\
    ![](image1451.jpg)\nHTML report in LeanFT showing screenshot captured during run\n\
    \n## 13. LeanFT Frameworks\n\n### 13.1 LeanFT with Cucumber\n\nWe can integrate\
    \ LeanFT tests with Cucumber BDD framework. If you know how to use `JUnit` with\
    \ Cucumber, you will find it very easier to integrate LeanFT with Cucumber. Please\
    \ follow below steps to integrate the LeanFT with Cucumber.\n\n1. Create a maven\
    \ project using LeanFT template.\n2. Add `cucumber` and `selenium` dependency\
    \ in `POM.xml`.\n3. Write feature files and scenarios.\n4. Write the step definitions\
    \ for steps in `Scenario`.\n5. Execute feature file.\n\nHere is the dependency\
    \ that you will have to add for cucumber:\n\n```xml\n<dependency>\n    <groupId>\
    \ info.cukes </groupId>\n    <artifactId> cucumber-java </artifactId>\n    <version>\
    \ 1.2.4 </version>\n    <scope> test </scope>\n</dependency>\n```\n\nThen you\
    \ have to create a feature file as shown in below example.\n\n```gherkin\nFeature:\
    \ My feature\nScenario: My Scenario\nGiven I am on www.softpost.org page\nThen\
    \ I verify that title contains tutorial word\n```\n\nAfter that you can create\
    \ step definitions as shown in below example.\n\n```java\npackage org.softpost;\n\
    import com.hp.lft.report.Reporter;\nimport com.hp.lft.sdk.ModifiableSDKConfiguration;\n\
    import com.hp.lft.sdk.SDK;\nimport com.hp.lft.sdk.web.Browser;\nimport com.hp.lft.sdk.web.BrowserFactory;\n\
    import com.hp.lft.sdk.web.BrowserType;\nimport cucumber.api.java.After;\nimport\
    \ cucumber.api.java.Before;\nimport cucumber.api.java.en.Given;\nimport cucumber.api.java.en.Then;\n\
    import org.junit.Assert;\nimport java.net.URI;\n/**\n * Created by Sagar on 23\
