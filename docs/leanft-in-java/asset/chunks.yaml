  trans: "\n\n![](img/image8.jpg)\n![](img/image8.jpg)\n\n# 关于作者\nPaul Watson 是一位技术爱好者，在\
    \ Web 应用开发、自动化测试、构建自动化、持续集成和部署技术等多种技术领域拥有丰富的经验。他参与过大多数技术栈的工作。\n\n他在 `UFT`、`LeanFT`、`Selenium`\
    \ 和 `Appium` 上拥有实战经验。他曾结合 `Selenium` 使用 `JUnit`、`TestNG` 和 `Cucumber` 等测试框架。他还接触过\
    \ `Struts`、`Spring`、`Bootstrap` 和 `Angular JS`。他的爱好包括去新的旅游景点旅行、看篮球、板球以及学习最新的技术事物。\n\
    \n## 给妻子的特别感谢\n我想将这本书献给我亲爱的妻子，感谢她对我如此深爱并帮助我完成了这本书。没有她的支持，这本书将无法实现。\n\n# 这本书适合谁读\n\
    这本书适用于想要学习使用 `LeanFT` 在 `Java` 中实现 Web 和 Windows 应用程序自动化的自动化工程师。假设读者具备 `Java`\
    \ 语言的基础编程技能。无论你是初学者还是经验丰富的开发者，这本书都将帮助你掌握 `LeanFT` 的技能。\n\n## 书籍概述\n本书从介绍 `LeanFT`\
    \ 开始，然后深入探讨下述的核心概念：支持的应用程序、安装、`LeanFT` 设置、核心概念、在 `IntelliJ IDEA` 中创建新的 `LeanFT`\
    \ 项目、在 `Eclipse` 中 `LeanFT` 项目、对象识别与管理、Web 应用自动化、Windows 应用程序自动化、同步、断言与报告、`LeanFT`\
    \ 框架、将 `UFT` 对象库转换为 `LeanFT` 中的应用模型、将 `LeanFT` 测试与 CI 服务器集成（如 [Bamboo](http://www.softpost.org/bamboo/adding-maven-task-in-bamboo/)、[Jenkins](http://www.softpost.org/jenkins/creating-and-configuring-the-builds-in-jenkins/)\
    \ 和 [TeamCity](http://www.softpost.org/teamcity/build-steps-for-maven-project-in-teamcity/)）、挑战与解决方案、`LeanFT`\
    \ 常见问题及解决方案、`LeanFT`与其他工具的对比、`LeanFT` Java 参考。\n\n# 目录\n- 关于作者\n- 给妻子的特别感谢\n-\
    \ 这本书适合谁读\n- 1. 简介\n- 2. 支持的应用程序\n- 3. 安装\n    - 3.1 安装 LeanFT 及 IDE 插件\n    -\
    \ 3.2 安装浏览器扩展\n- 4. 入门\n    - 4.1 LeanFT 设置\n    - 4.2 LeanFT 中的许可证类型\n- 5. 核心概念\n\
    \    - 5.1 对象识别中心\n    - 5.2 理解 LeanFT API\n- 6. 在 IntelliJ IDEA 中创建 LeanFT 项目\n\
    \    - 6.1 在 Maven 仓库安装 LeanFT jar 文件\n    - 6.2 创建 LeanFT Maven 项目\n    - 6.3\
    \ 使用 Gradle 和 TestNG 创建 LeanFT 项目\n    - 6.4 LeanFT 属性\n    - 6.5 在 IntelliJ IDEA\
    \ 中设置 LeanFT 项目\n- 7. 在 Eclipse 中 LeanFT 项目\n    - 7.1 在 Eclipse 中使用 JUnit 创建\
    \ maven 项目\n    - 7.2 在 Eclipse 中使用 TestNG 创建 maven 项目\n- 8. 对象识别与管理\n    - 8.1\
    \ 描述编程\n    - 8.2 应用模型\n    - 8.3 在属性值中使用正则表达式\n- 9. Web 应用自动化\n    - 9.1 第一个\
    \ Web 应用测试\n    - 9.2 使用 XPATH 和 CSS 识别 Web 元素\n    - 9.3 使用视觉关系标识符 VRI 识别对象\n\
    \    - 9.4 Windows 应用中的浏览器控制\n    - 9.5 使用 LeanFT 在 Web 上触发事件\n    - 9.6 在网页中执行\
    \ JavaScript\n- 10. Windows 应用程序自动化\n    - 10.1 标准应用程序自动化\n    - 10.2 Java 应用自动化\n\
    \    - 10.3 WPF 应用自动化\n    - 10.4 SAP 应用自动化\n- 11. 同步\n- 12. 断言与报告\n    - 12.1\
    \ LeanFT 中的断言\n    - 12.2 使用截图和录制生成报告\n- 13. LeanFT 框架\n    - 13.1 使用 Cucumber\
    \ 的 LeanFT\n    - 13.2 关键字驱动框架\n    - 13.3 数据驱动框架\n- 14. 将 UFT 对象库转换为 LeanFT 中的应用模型\n\
    - 15. 将 LeanFT 测试与 CI 服务器集成\n    - 15.1 在 Bamboo 中添加 Maven 任务\n    - 15.2 在 Jenkins\
    \ 中创建和配置构建\n    - 15.3 在 TeamCity 中 Maven 项目的构建步骤\n- 16. 挑战与解决方案\n    - 16.1 LeanFT\
    \ 自动化的挑战\n    - 16.2 使用第三方对象处理\n    - 原生对象属性和方法\n- 17. LeanFT 常见问题及解决方案\n- 18.\
    \ LeanFT 与其他工具的对比\n    - 18.1 HP UFT 和 LeanFT 的区别\n    - 18.2 LeanFT 与 Selenium\
    \ 和 Ranorex 的对比\n- 19. LeanFT Java 参考\n\n# 1. 简介\nLeanFT 代表功能测试。。由 HP 开发的工具，与\
    \ Ranorex 非常相似。关于 LeanFT 的注意事项如下：\n\n1. 它是一项授权工具。\n2. 由 HP 在 2015 年开发。\n3. 它是\
    \ `UFT` (`QTP`) 的轻量级版本。\n4. 通过 LeanFT，你可以使用 .Net 语言以及 Java 编写测试。\n5. LeanFT 为\
    \ Visual Studio 和 Eclipse 提供了插件。\n6. LeanFT 使用描述编程以及应用模型来识别对象。\n\n## [2. 支持的应用程序](http://www.softpost.org/automation-testing/leanft-with-c-net/supported-applications-by-leanft/)\n\
    LeanFT 支持以下类型的应用程序：\n\n1. IE、Chrome、Firefox、Microsoft Edge Web 应用程序\n2. Windows\
    \ 应用程序 - WPF、Silverlight 等\n3. SAP 应用程序\n4. Java 应用程序\n5. 标准窗口和表单\n\n"
- fmt: '

    In fact, all applications supported by UFT (QTP) are also supported by LeanFT.


    # 3. Installation


    ## 3.1 Installation of LeanFT and plugins for IDEs

    First visit [https://saas.hpe.com/en-us/software/leanft] and download the trail
    version of LeanFT.

    Before starting the installation process of LeanFT, ensure below things:


    1. You have a `node.js` and IDE tools (`Visual Studio`, `IntelliJ IDEA`, `Eclipse`)
    already installed on your system.

    2. Anti-virus software is disabled.


    At the time of installation, you will choose which plugins to be installed.


    By default, LeanFT is installed at `C:\Program Files (x86)\HP\LeanFT`.


    Once installed, start the LeanFT engine (from installation directory or from Start
    menu of Windows). By default, LeanFT service runs on port `5095`. Below screen
    shot shows the installation options during installation process. Please select
    full installation with visual studio and Eclipse options checked.![](image163.jpg)


    If you have got IntelliJ installed on your system, you will see below screen.
    Just select the checkbox next to IntelliJ IDEA to install the LeanFT plugin for
    IntelliJ IDEA.![](image168.jpg)


    ### LeanFT plugins

    After installation of LeanFT, start the runtime engine as shown in below image.
    By default, engine runs on the port `5095`.![](image175.jpg)


    ## 3.2 Installing browser Extensions

    After installation of LeanFT, you can view the browser extension files at below
    location in LeanFT installation directory.![](image182.jpg)


    ### Browser extensions for LeanFT

    Just drag and drop the extension files on the browsers. Browser will install these
    extensions when you drop these extension files on it.

    Without installing and enabling these extensions in browsers, you will not be
    able to automate the web application.

    Below image shows the LeanFT extension enabled in chrome browser.![](image190.jpg)


    ### LeanFT extension in Chrome


    # 4. Getting Started


    ## 4.1 LeanFT settings

    You can view and edit the LeanFT settings from within IntelliJ IDEA IDE as shown
    in below image.![](image203.jpg)


    ### LeanFT Engine and Object Identification Settings![](image208.jpg)

    ### Add-ins in LeanFT[![](image214.jpg)](http://www.softpost.org/wp-content/uploads/2016/07/Engine-connection-and-object-synchronization-timeout-in-LeanFT.png)

    ### Engine connection and object synchronization timeout in LeanFT![](image220.jpg)


    ### Object Identification settings in LeanFT

    There are the most important LeanFT settings:


    1. **Add-ins**: In this section, we can specify which add-ins you want to load.

    2. **Engine connection and Run-time settings**: In this section, we can specify
    the port of engine and Engine Idle time out. We can also specify object synchronization
    timeout. LeanFT will wait for this much time before throwing the exception.

    3. **Mobile Settings**: In this setting we can specify the mobile center server
    address to automate the mobile applications with LeanFT.

    4. **Object Identification settings**: In this tab, we can specify which properties
    should be used to identify the objects.


    ## 4.2 License types in LeanFT

    LeanFT comes with 4 types of licenses as shown in below image:


    1. **Seat License** - Tied to one machine

    2. **Concurrent license** - Multiple machines can use this license

    3. **Commuter license**

    4. **Remote commuter license**

    [![](image242.jpg)](http://www.softpost.org/wp-content/uploads/2015/09/license-wizard.jpg)


    # 5. Core Concepts


    ## 5.1 Object identification Center

    Object Identification Center is just like Object Spy in QTP/UFT.

    Object Identification Center runs in 2 modes:


    1. `simple` - allows you to just view the object property - values

    2. `edit` - allows you to view and edit the object property values


    Object identification center allows you to do below things:


    1. Inspect the objects.

    2. Learn about the object parent details, hierarchy.

    3. Learn about the object properties and values.

    4. One cool feature of Object Identification center is that generation of code
    snippets in Java or C#

    5. Highlight the object.

    6. We can also capture the screenshot of the object.

    7. It also allows you to add the object to Application model.


    You can launch the Object Identification center from IntelliJ IDEA as shown in
    below image.![](image269.jpg)

    **Launching LeanFT Object Identification Center in IntelliJ IDE**

    Below image shows how to inspect the elements inside web page using Object Identification
    Center.[![](image277.jpg)](http://www.softpost.org/wp-content/uploads/2016/07/Object-Identification-Center-in-LeanFT.png)

    ### Object Identification Center in LeanFT


    ## 5.2 Understanding LeanFT SDK APIs

    Some of the most important packages and classes in LeanFT API are mentioned below:


    1. `com.hp.lft.report` - `Reporter` class can be used to dump data in report

    2. `com.hp.lft.sdk` - Core functionality

    3. `com.hp.lft.sdk.insight` - used to identify the objects based on images

    4. `com.hp.lft.sdk.apitesting.uft` - UFT API used in LeanFT

    5. `com.hp.lft.sdk.java` - API to automate Java application (`Swing`/`AWT` etc)

    6. `com.hp.lft.sdk.mobile` - API to automate mobile applications

    7. `com.hp.lft.sdk.sap.gui` and `com.hp.lft.sdk.sap.ui5` - API to automate SAP
    applications

    8. `com.hp.lft.sdk.stdwin` - API to automate Standard windows applications

    9. `com.hp.lft.sdk.utils` - helper methods

    10. `com.hp.lft.sdk.web` - API to automate Standard Web applications

    11. `com.hp.lft.sdk.winforms` and `com.hp.lft.sdk.wpf` - API to automate .Net
    applications

    12. `com.hp.lft.unittesting` and `com.hp.lft.unittesting.datadriving` - API to
    work with Unit testing framework of LeanFT

    13. `com.hp.lft.verifications` - It provides `Verify` class that can be used to
    assert the expected values

