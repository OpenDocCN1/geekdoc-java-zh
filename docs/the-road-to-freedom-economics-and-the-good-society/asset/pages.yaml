  md: 'roles in society that our parents and others expect us to play. A better understanding
    of how our preferences are shaped and how they are affected by peer pressure can
    be freeing.


    Education also plays an important role in shaping our preferences and actions.
    We may become more cooperative and trustworthy as we better understand how important
    these traits are for a society to function well.


    A liberal education also allows us to see the flaws in current economic arrangements
    and to understand why, for instance, unfettered markets are the problem and not
    the solution. This is why people in favor of continuing current norms (such as
    restricted gender roles or the primacy of markets) regardless of the merits fight
    so strongly against a liberal education. They do so even in the US, which has
    in its foundations of success the very advanced advances in knowledge that rest
    on a strong educational system based on Enlightenment values.


    # Democracy


    The democracy part of the progressive capitalism/rejuvenated social democracy
    agenda is crucial, but it necessitates restoring the social justice part, too.
    This raises critical questions. Circumscribing excessive inequalities and the
    role of money in politics and the media, is there anything else we can do to prevent
    capitalists’ interests from distorting our social, economic, and political system?
    Is there anything we can do to make democratic progressive capitalism more sustainable,
    or more likely to be sustained? While there is no magic formula, there are some
    things we can do. We can attempt to inculcate democratic values deeply, so people
    will be suspicious of the agglomeration of power in any form. We can install a
    stronger commitment to freedom of the press and the necessity of a diversified
    press and media, so the wealthy do not have a disproportionate say. We can strengthen
    systems of checks and balances in our society. It is not just branch of government
    checking other branches but the private, public, and civil society spheres checking
    each other, and the fourth estate checking them all.


    And, of course, we have to ensure we have a democracy at all. While earlier concerns
    were about a majority suppressing minority rights, today the concern in the US
    is about a minority suppressing majority rights. Voter'
