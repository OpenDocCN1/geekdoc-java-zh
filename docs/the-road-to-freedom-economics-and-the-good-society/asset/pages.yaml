  md: '# # CHAPTER 14

    # Democracy, Freedom, Social Justice, and the Good Society


    Any discussion of freedom must begin with a discussion of whose freedom we’re
    talking about. The freedom of some to harm others, or the freedom of others not
    to be harmed? Too often, we have not balanced the equation well: gun owners versus
    victims of gun violence; chemical companies versus the millions who suffer from
    toxic pollution; drug companies versus patients who die or whose health worsens
    because they can’t afford to buy medicines. We know whose freedom prevailed. The
    list of injustices is long.


    It is remarkable how, in spite of all the failures and inequities of the current
    system, so many still champion the free-market economy. This in spite of the daily
    frustrations of dealing with health insurance companies, telephone companies,
    landlords, or airlines. It boggles the mind that anyone who lives within twenty-first-century
    capitalism, alone reads about the myriad abuses, can believe in unfettered markets
    or the inevitable inefficiency of “free” enterprise.


    To put it bluntly, ordinary citizens around the world have been sold a bill of
    goods. When there’s a problem, they’ve been told “leave it to the market.” They’ve
    even told that the market can solve problems of externalities, coordination, and
    public goods. That’s purely wishful thinking, and I’ve explained why. A well-functioning
    society needs rules, regulations, public institutions, and public expenditures
    financed by taxes.'
