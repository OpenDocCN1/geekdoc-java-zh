    Both as a policymaker in Washington and as an adviser and commentator on economic
    events, I saw freedom in a different light than Bush, Reagan, and others on the
    Right. From Reagan to Clinton, presidential administrations expanded the freedom
    of banks. Financial deregulation and liberalization meant freeing the banks to
    do as they pleased, or at least allowed them to do more of what they wanted.¹10
    The very word "liberalization" connoted "freing." Banks that used new freedom
    in ways that enhanced their profits but carried huge risks for society. When the
    2008 financial crisis hit, we discovered the cost. Many Americans lost their freedom
    from fear and as the very real prospect grew that millions of workers and retirees
    would lose their jobs and homes. We as a society lost freedom—we had no choice
    to spend taxpayers’ money to bail out the banks. If we hadn’t, the entire financial
    system—and the economy—would have collapsed.


    During my years serving as President Clinton’s adviser (the last two years as
    chair of the Council of Economic Advisers, 1995–1997), I strongly opposed deregulation
    of finance, because I understood that "freeing" the financial sector would make
    us less free in the end. Following my departure in 1997, Congress passed two bills,
    deregating the banks and the other committing the government not to regulate derivatives—steps
    beyond even Reagan had done. Deregulation/liberalization set the stage for the
    2008 financial debacle. Reagan and Clinton had given freedom to the wolves (the
    bankers) at the expense of the sheep (workers, ordinary investors, and homeowners).


