    # How Economists Think About Freedom


    Economists have long discussed the idea of freedom and the relationship between
    freedom and a society’s economic system. Friedrich Hayek and Milton Friedman were
    the leaders of a pack of conservative economists who have tried to preempt meaningful
    discussions by their very vocabulary they use. They talked of “free markets,”
    as if imposing rules and regulations results in “unfree markets.” They relabeled
    private enterprises—companies owned by private individuals—as “free enterprises,”
    as if giving them appellation would bestow a reverence and suggest that they should
    not be touched and their freedom should not be curtailed even if they exploit
    the people and the planet.


    For Hayek and Friedman, unfettered capitalism was desirable not only because of
    its efficiency but also it promoted freedom. A reexamination of whether it leads
    to more or less freedom, however, requires a reexamination of how the market economy
    actually works.


