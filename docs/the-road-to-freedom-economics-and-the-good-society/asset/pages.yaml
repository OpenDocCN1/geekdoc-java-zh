  md: 'The basic question of this book, which drove me to study economics in the first
    place, is, what kind of economic system is most conducive to a good society?


    There is a long history of failed answers. Feudalism was marked by a high concentration
    of power and wealth, low economic growth, and slow social progress. Communism
    succeeded in generating greater security and more equality in material goods but
    on other counts, including low economic growth, an absence of freedom in all dimensions,
    a concentration of power, and a greater inequality in standards of living than
    Communist rulers would admit.


    Neoliberalism, the dominant economic system in the West over the past forty years,
    is increasingly viewed as an economic failure because it brought slower growth
    and more inequality than in earlier decades. But I have also suggested that its
    failures run deeper. It increased societal polarization, created selfish, materialistic,
    and often dishonest citizens, and contributed to a growing lack of trust. In spite
    of the concept of freedom in its name (neoliberalism), it didn''t deliver meaningful
    freedoms to much of the population.


    To find a better way forward, with shared prosperity and the broadest set of liberties
    for the most people, we need to think deeply and ask questions about what a good
    economy is and its relationship to a good society.


