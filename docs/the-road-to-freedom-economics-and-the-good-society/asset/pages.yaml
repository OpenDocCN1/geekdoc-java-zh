  pgno: 255
- img_proc: true
  md: 'I believe there is broad consensus on many of the key elements of what constitutes
    a good and decent society and what kind of economic system supports that society.
    A good society, for instance, must live in harmony with nature. Our current capitalism
    hasn''t been doing an adequate job of this; progressive capitalism, with a commitment
    to environmental regulation, would put this in front and center.


    A good society allows individuals to flourish and live up to their potential.
    Our current capitalism is failing large portions of the population. Progressive
    capitalism again addresses these both through pre-distribution and redistribution.


    A good economic system would encourage people to be honest and empathetic, with
    the ability to cooperate with others. The current capitalist system too often
    encourages the antithesis; the rich ecology of institutional arrangements under
    progressive capitalism would do better.


    Moreover, when there is no consensus on how to make certain critical decisions,
    the philosophical traditions of the utilarians/Benthams (those who follow the
    nineteenth-century philosopher Jeremy Bentham) and John Rawls can help us think
    through what set of rules makes sense in a good society; they can also provide
    at least frameworks for thinking about the sum total of the rules that constitute
    a society.


    Politics is about navigating a world in which there might be large differences
    in opinion on what should be done collectively. In some cases, there can be horse
    trading, an agreement on the overall package, with some accepting a set of decisions
    in one domain that they think is wrong, or at least not ideal, in return for others
    accepting decisions in another domain about which they are unconvinced. There
    is harmony in the overall outcome, disagreement in the details. There might even
    be near unanimity in the end, with citizens understanding the benefits of the
    social cohesion that results from widespread agreement.


    Unfortunately, this is often not the case. Some argue that we should narrow the
    space of collective decision-making because there are differences that cannot
    be resolved. I have explained that this comes at a high price. There are enormous
    benefits from collective actions associated with public goods like research and
    development, education, and health care. But more fundamentally, we simply can''t
    avoid collective decisionmaking. We must have a common set of rules to govern
    us.'
