    # American exceptionalism


    Perhaps we should not be surprised by where the US has landed. It is a country
    now so divided that even a peaceful transition of power is difficult; where life
    expectancy is the lowest among advanced nations and where we can''t agree about
    truth or how it might be ascertained or verified. Conspiracy theories abound,
    and the Enlightenment has to be religated daily.


    There are good reasons to worry whether America’s form of ersatz capitalism is
    sustainable. The incongruities between lofty ideals and stark realities are too
    great. It''s a political system that claims to cherish freedom above all else
    but in many ways is structured to deny or restrict freedoms of most of its citizenry.
    The real danger is that the populism to which neoliberalism have given rise will
    lead to even worse dialogues than we have already shown up.


    We don''t have to continue this road. We are at a moment in which the faults of
    the current system are apparent, in which a majority are calling for change, and
    in which most agree with the values, policies, and programs underlying progressive
