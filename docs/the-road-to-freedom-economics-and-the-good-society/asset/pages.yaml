    # Guardrails


    To put it differently, a free-market, competitive, neoliberal economy combined
    with a liberal democracy does not constitute a stable equilibrium, not without
    strong guardrails and a broad societal consensus on the need to curb wealth inequality
    and money’s role in politics. This kind of strong democracy is necessary to sustain
    a competitive, free economy. Whether America’s political and economic system today
    has enough safeguards to sustain meaningful economic and political freedoms is
    questionable.


    I talked about some of the constituent elements of the requisite guardrails, such
    as competition policy, to prevent the creation, maintenance, and abuse of market
    power. We need checks and balances, not just within government, as everyschool
    in the US learns, but more broadly within society. Strong democracy, with widespread
    participation, is also part of what is required, which means legislation to strike
    down laws intended to decrease democratic participation like associated with voter
    suppression.


    These guardrails and checks and balances are a core part of progressive capitalism,
    with its curbs on market power and excessive inequality and with its robust diversity
    of institutional arrangements. There will certainly be constant pressures to remove
    the guardrails, weaken the checks and balances, and allow inequalities to grow.
    We see that today even in the strongest of social democracies.'
