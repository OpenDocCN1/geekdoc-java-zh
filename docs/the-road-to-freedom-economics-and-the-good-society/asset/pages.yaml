  md: '# Democracy, Power, and the Global Economic Architecture


    In this chapter, we''ve seen how a central theme of this book—expanding one person’s
    freedom may lead to the unfreedom of others—plays out at the international level.
    The effects on the economic development of poorer countries have been devastating.
    Latin America had a lost decade because of its debt crisis. Many countries in
    Africa experienced a last quarter century in which they moved backward—there was
    actually a process of deindustrialization³² that made these countries more reliant
    on natural resources and left their economies less diversified and less resilient
    than they otherwise would.


    But there were equally pernicious effects on democratic development. The conditions
    placed on these countries in return for receiving financial assistance attempted
    to impose a version of neoliberal capitalism, with the emphasis on the private
    sector and privatization. The result was to impair the development of a robust
    state, undermining the possibility of the kind of concerted collective action
    necessary for economic success in the twentyfirst century. The US, as I noted,
    has now embraced industrial policies. But the developing countries were told to
    shun them and so didn’t develop the capacity to advance their industries or undertake
    policies and programs that would help close the gap with the more advanced countries.
    Moreover, the rules imposed on developing countries exacerbated poor imbalances
    within their countries and in some cases effectively gave veto power to foreigners,
    the worst possible manifestation of neocolonialism.


    An effective democracy requires limiting corporate power and curbing wealth inequalities.
    The conditions imposed by the IMF and the World Bank often entailed weakening
