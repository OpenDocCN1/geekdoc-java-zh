    The four freedoms are (1) freedom to work, (2) freedom to enjoy the fruits of
    one''s labor, (3) freedom to own and control one''s property, and (4) the freedom
    to participate in a free market—to contract freely for goods and services and
    to achieve one''s full potential without government limits on opportunity, economic
    independence, and growth. (italics maine)


