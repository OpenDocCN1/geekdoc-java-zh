  md: '# # Resolving Disputes over Freedom in a Divided Society


    What happens if, even after a society closely examines and extensively debates
    whose rights are more important, people still don''t agree? Almost by definition
    a society can have only one assignment of rights. Citizens must agree on that
    assignment collectively by some mechanism of collective decision-making.


    We also have to make a collective decision about the regulations that govern our
    society. We need environmental regulations, traffic regulations, zoning regulations,
    financial regulations; we need regulations in all the constituents of our economy.
    In a twenty-first-century economy, a complex set of rules and regulations is necessary.


    We would all like to live in a society with like-minded people who, when they
    reason together, come with congruent answers to fundamental questions. We also
    like to live in a world in which all countries share our views about human rights
    and democracy. But we don''t.


    Some small communities can achieve a broad consensus (but typically far from unanimity).
    Larger societies have a harder time of it. Many of the critical values and prescriptions
    are what economists, philosophers, and mathematicians refer to as *primitives*,
    underlying assumptions that, while they can be debated, cannot be resolved. Still,
    given the importance of living together and the need to make at least a limited
    number of collective decisions, we must ask, is there anything that can be done
    to find areas of agreement? To answer that it is useful to understand what gives
    rise to societal divides and why the divides have widened.


    # The role of income and wealth inequality


    I believe a large part of the answer is related to two problems of neoliberalism
    that I''ve called attention to: the growing economy and wealth divide that marks
    twentieth and twenty-first century neoliberal capitalism and the polarization
    caused by the media. Making matters worse is that current rules allow the rich
    and elites to have a disproportionate voice in shaping both the policies and societal
    narratives. All of which leads'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'enhanced sense by those who are not wealthy the system is rigged and unfair,
    which makes it all the more difficult to heal divisions.


    As income inequalities grow, people wind up living in different worlds and don''t
    interact. There is a large body of evidence showing economic segregation is growing
    and has consequences, for instance, on how each side thinks and feels about the
    other. The poorest members of society see the world as stacked against them and
    give up on their aspirations; the wealthiest develop a sense of entitlement, and
    their wealth helps to ensure that the system is rigged. But these individual opinions
    about the economic divide only increase the societal divide.


    # The divisive role of the media


    The media, including social media, provides another source for this division.
    Media has immense power to shape societal narratives and has played a role in
    societal polarization. As I noted, the business model of much of the media entails
    seeking divides. Fox News, for instance, discovered that it was better to have
    a devoted right-wing audience attracted by its distorted reporting that watched
    Fox than to have a broader audience attracted to more balanced reporting. Social
    media has discovered that it''s profitable to get engagement by engagement, and
    that it can develop its algorithms to effectively refine whom to target even if
    the practice leads to societal polarization by providing different information
    to different users.


    # Reasoning as a resolution


    A premise of this book is that reasoning, a core Enlightenment value, and discourse
    based on reasoning can enable us to better understand the full complexities of
    what is issue and help to reach common ground in the pursuit of the common good.
    For instance, reasoning about the meaning and nature of freedom leads to the conclusion
    that the worldview of the libertarian Right is fundamentally incoherent simply
    it doesn''t recognize that one person''s freedom is another''s unfreedom. I have
    attempted to provide a more coherent and meaningful analysis of freedoms within
    an interdependent modern society.'
