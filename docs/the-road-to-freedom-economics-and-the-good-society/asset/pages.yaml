    # Words matter


    Modern behavioral economics has explained that “framing” matters, and that means
    the words we use matter. A bonus for doing the right thing is perceived as different
    from a penalty for doing the wrong thing, even though in classical economics the
    two can be equivalent and can induce the same actions.


    The language of freedom, as it now plays out, has constrained our ability to reason
    soundly about what kind of economic, political, and social system best enhances
    the well-being of society—including what kind of system is most likely to deliver
    meaningful freedom and well-being to the largest number of people. The language
    of coercion and freedom has become an emotive part of our political vocabulary.
    Freedom is good; coercion is bad. Indeed, there is a prevailing, simplistic reasoning
    that sees freedom and coercion as mere antitheses of each other. In one case,
    an individual has the freedom to wear a mask or not, to get a vaccine or not,
    to contribute financially to the defense of the country or not, or to give money
    to the poor or not. The state has the power to take away these freedoms. It may
    compel or coerce me to wear a mask, get a vaccine, taxes to fund a defense force,
    or support people with lower incomes.


    The same dichotomy exists at the level of the nation-state in its relation to
    other nation-states. States may feel forced into doing what they don’t want to,
    either by threat of military action or through threats of economic actions that
    would impact their economy so severely they believe they have no choice.'
