  md: '# Freedom from a twenty-first-century perspective


    Ultimately, I will show that the true advocates of deep, meaningful freedom are
    aligned with the progressive movement both in the US and abroad. They and the
    center-left parties that represent them need to reclaim the freedom agenda. For
    Americans, particularly, that entails a reconsideration of the country''s history
    and founding myths.


    The first objective of this book is to provide a coherent and straightforward
    explication of freedom from the perspective of twenty-first-century economics,
    as John Stuart Mill did in the middle of the nineteenth century in his classic
    book On Liberty (1859). The world has changed in the more than a century and a
    half since, and so as has our understanding of the economy and society. What is
    debated today is different from what was on the political agenda long ago. Then,
    memories of state oppression of religion (in particular by the British government,
    with some migration to the US motivated by this oppression) were still alive,
    and it was this legacy as much as anything that shaped people''s views. Today,
    we grapple with climate change, gas, pollution, the right to abortion, and the
    freedom to express gender identity. More broadly we debate the role of social
    coercion and the coercive reactions against it. Our present-day challenges require
    a rethinking of basic concepts, including freedom. Indeed, Mill himself said that
    freedoms need to be rethought as the economy and society change.


    While I believe economists have much to add to our understanding of the meaning
    of freedom and its relationship to our economic and social system, the peculiar
    and specific lens through which they typically see the world is also limiting;
    there is much more to the subject that is not well captured within the distinct
    perspectives that economists bring, and at various places in the text I call attention
    to these limitations.¹12, ¹13


