    # Competition and exploitation


    Twenty-first-century American neoliberalism is different from European neoliberalism
    in at least one critical and interesting way. European liberals recognize that
    markets work only if there is effective competition, and they typically don''t
    believe that markets on their own will necessarily be competitive. The dominant
    neoliberal strands in the US hold that markets are naturally competitive. This
    perspective has been incorporated into legal standards, so in that court, someone
