    It has long been evident that there are connections between economic and political
    freedoms. The debate about which freedom should be given primacy was central to
    the Cold War. The West argued that political freedoms (clearly in short supply
    in the Communist world) were more important; Communists argued that without some
    basic economic rights, political rights meant little. But could a nation have
    one of rights without the other? Economists such as John Stuart Mill, Milton Friedman,
    and Friedrich Hayek weighed into this debate¹¹ and addressed the question of what
    kind of economic and political system best delivers these twin freedoms and enhances
    individual and societal well-being. This book looks at the same questions from
    a twenty-first-century perspective, arriving at answers markedly different from
    Friedman''s and Hayek''s in the middle of the last century.


    The concept of trade-offs sits at the center of economics, and this idea offers
    another reason that economists have much to add to discussions of freedom. As
    will become clear, I believe there are few, if any, absolutes in this area. Economics
    provides tools to think about the nature of the trade-offs that should be central
    to discussions about freedom and how trade-offs should be addressed.


    Moreover, once we get beneath the Right''s superficial allegiance to freedom,
    we uncover a hoard of conundrums, including the key insight that mild coercion—forcing
    someone to do something that he is of own volition would not do—can, in some instances,
    enhance everyone''s freedom, even the freedom of those being coerced. As I will
    demonstrate, economics provides an explanation for the many important instances
    in which collective action—doing together what individuals could not do on their
    own—is desirable. But often, collective action is not possible without a modicum
    of coercion because of what are called free-rider problems, which we will consider
    later.'
