    the planet, George W. Bush, who served as president when the financial crisis
    occurred, put what was at issue as follows:


    While reforms in the financial sector are essential, the long-term solution to
    today''s problems is sustained economic growth. And the surest path to growth
    is free markets and free people.4


    Before Bush, Ronald Reagan, whose presidency (1981–1989) was widely viewed as
    a turning point towards the right and a full-throated embrace of free markets,
    had enumerated an Economic Bill of Rights.5He regretted that the Constitution
