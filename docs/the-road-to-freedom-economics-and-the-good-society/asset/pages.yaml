- img_proc: true
  md: 'We also need regulations and laws to make sure that there are no concentrations
    of economic power. We''ve seen not only that business seeks to collude and would
    do so more in the absence of antitrust laws, but even playing within current laws
    there''s a strong tendency for the agglomeration of power. The liberal ideal of
    free, competitive markets would, without government intervention, be evanescent.


    And we''ve also seen that with power too often do what they can maintain it. They
    write the rules to sustain and enhance power, not curb or diminish it. Competition
    laws are eviscerated, incapable of responding to new technologies and firms''
    new ways to get and exercise market power. Enforcement is weakened. In this world
    of neoliberal capitalism, wealth and power are ever ascendant.


    # Neoliberalism politically sustainable and consistent with a sustainable democracy?


    Neoliberalism is not economically sustainable, and it undermines the sustainability
    of democracy—just the opposite of Hayek and Friedman claimed.


    We have created a vicious cycle of economic and political inequality, one that
    cements more freedom for the rich and less for the poor, at least in the United
    States, where money plays such a large role in politics. There are many ways in
    which economic power gets translated political power and undermines the fundamental
    democratic value of one person having one vote. The reality is that some people''s
    voices are much, much louder than others. In some countries, it''s crude as buying
    votes, with the wealthy having money to buy votes. In advanced countries, the
    wealthy use their influence in the media and elsewhere to create narratives, and
    they are in the best position to make their narratives become the conventional
    wisdom. For instance, certain rules and regulations and government interventions
    that are in the interest of the rich and powerful are in the national interest,
    they claim—and too often they are successful in persuading others that this is
    true.


    Fear is a key instrument the powerful wield to persuade others to go along with
    their agenda: If the banks are not bailed out, the economic system will collapse,
    and everyone will be worse off. If the corporate tax'
