  md: '# PREFACE


    Freedom is a core human value. Many of freedom’s advocates seldom ask what the
    idea really means. Freedom for whom? What happens when one person’s freedom comes
    at the expense of another’s? The Oxford philosopher Isaiah Berlin¹ put it well
    when he said, “Freedom for the wolves has often meant death to the sheep.”²


    How are we balance political and economic freedoms? What is the meaning of the
    right to vote for someone who’s starving? What about the freedom to live up to
    one’s potential, which may only be possible if we tax the rich and deprive them
    of the freedom to spend as they want?


    The Right in the United States³ seized on the rhetoric of freedom several decades
    ago, claiming it as their own just as they claimed patriotism and the American
    flag as their own. Freedom is an important value that we do and cherish, but it
    is more complex and more nuanced than the Right’s invocation. The current conservative
    reading of what freedom means is superficial, misguided, and ideologically motivated.
    The Right claims to be the defender of freedom, but I’ll show that the way the
    word and purse has led it to the opposite result, vastly reducing the freedoms
    of most citizens.


    A good initial and central place in which these shortcomings can be identified
    the conflation of free markets with economic freedom, and economic freedom with
    political freedom. A few quotes from Republican leaders convey the spirit of what
    I have in mind.


    As the US economy was on the verge of a meltdown in 2008 after decades of financial
    deregulation, and the government was about to'
  merge: -1
  pgno: 5
