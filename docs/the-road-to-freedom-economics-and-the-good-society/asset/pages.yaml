    not one in which there were unfettered property rights.


    In the US and other countries, governments often turn to financial and business
    leaders for advice on the laws and regulations for governing commerce. This is
    especially true in complex areas like financial regulation or international trade.
    But Adam Smith warned about asking the advice of these leaders:


    > The interest of [businessmen] is always in some respects different from, and
    even opposite to, that of the public . The proposal of any new law or regulation
