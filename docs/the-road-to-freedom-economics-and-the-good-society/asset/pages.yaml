    Inextricably linked to these political freedoms are protections for the economic....
    While the Constitution sets our political freedoms in greater detail, these economic
    freedoms are part and parcel of.... There are four economic freedoms. Freedom
    are what life itself is liberty, what enables an individual to control his own
    destiny, what makes self-government and personal independence part of the American
