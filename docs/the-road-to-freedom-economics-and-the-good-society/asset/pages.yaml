  md: '# # ACKNOWLEDGMENTS


    This book builds on and extends a lifetime of scholarship on the questions at
    hand, and so it is impossible to acknowledge all those who have contributed to
    my understanding of these issues.


    Externalities and collective action are the center of attention of any economist
    working in the economics of the public sector, and that was a field which I began
    early in my career, inspired by and working with a young cohort of scholars in
    what was referred to as the New Public Finance, including Jim Mirlees, Peter Diamond,
    Agnar Sandmo, and my students Tony Atkinson, Richard Arnott, and Geoff Heal.


    Only a few economists have been willing to engage directly in the discussion employing
    terms like “freedom” and “rights,” and two of these are whose influence will be
    apparent: Partha Dasgupta and Amartya Sen.


    I have learned a lot from lawyers, those more directly concerned with freedoms
