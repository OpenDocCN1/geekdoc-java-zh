  md: 'In the US, the guardrails look pretty shaky. Some, such as Martin Wolf, the
    Financial Times''s chief economic commentator, worry that matters are so bad America
    might soon no longer be a functioning democracy.9


    An awareness of the threat posed by the dynamics of any version of capitalism
    where wealth, power, and inequalities can compound, is part of the answer to how
    democracy can be sustained. One of the objectives of this book is to enhance that
    awareness.


    # The road to populism


    Under the name of freedom, neoliberals and even more, the radical Right, have
    advocated policies that restrict the opportunities and freedoms (both political
    and economic) of the many in favor of the few. All these economic and political
    failures associated with neoliberalism have hurt large factions of the citizenry,
    many of whom have responded by turning to populism, drawn to authoritarian figures
    like Trump, Bolsonaro, Putin, and Modi. They meanwhile search for scapegoat to
    explain what goes wrong and provide simplistic answers to complex questions.


    We can''t reach conclusions that are just the opposite of Friedman''s and Hayek''s.
    They misread history—I suspect deliberately. The severe bout of authoritarianism—Hitler,
    Mussolini, Stalin—from which the world was recovering at the time Hayek and Friedman
    were writing was not caused by governments having played too large a role.10 Instead,
    these heinous regimes were brought about by extreme reactions to government not
    doing enough. It was not then and it is not today, the case that authoritarianism
    was arising in social democratic states with large governments, but rather in
    countries marked by extremes of inequality and high levels of unemployment, where
    governments have done too little.


    We''ve seen that it is the social democracies—the countries that most approximate
    our progressive capitalism—that have sustained the strongest democracies. The
    countries that have adopted the tenets of neoliberalism have traveled down the
    road to populism and serfdom.


    In short, Hayek and Friedman were wrong. Unfettered, neoliberal capitalism is
    antithetical to sustainable democracy. Hayek''s famous book The Road to Serfdom
    claimed that a too-big state was paving the way to our loss of freedom. It is
    evident today that free and unfettered markets'
