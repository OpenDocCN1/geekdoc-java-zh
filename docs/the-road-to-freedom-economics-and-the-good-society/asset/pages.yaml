  md: 'What doesn’t work typifies the US and a few places: people who hold the levers
    of power using them to maintain, amplify, and extend their power while making
    limited efforts to find or create a political consensus. The US has a political
    system created more than 200 years ago that allows disproportionate political
    weight to some parts of the country and gives the states the ability to partially
    disenfranchise citizens through gerrymandering and voter suppression. History
    has long taught that governments and political systems marked by such disparities
    between the governing and the governed—even when there is a facade of democracy—cannot
    survive. Inevitably, trust in the government and belief in its legitimacy will
    erode.


    I still believe if we could move the discussion out of the realms of ideology,
    identity, and absolutist positions into the realm of healthy debate, a consensus
    might emerge, not on every matter, but on a broader range of issues, which would
    allow us to move more easily toward a good society.³3


    # Neoliberalism and Sustained Democracy


    For a long time, the Right has tried to establish a monopoly over the invocation
    of “freedom,” almost as if they had a trademark on it. It’s time to call out the
    Right and reclaim the word.


    Milton Friedman and Friedrich Hayek argued that economic and political freedoms
    are intimately connected, with the former necessary for the latter. But I’ve argued
    that the economic system that has evolved—largely under the influence of these
    thinkers and others like them— undermines meaningful democracy and political freedom.
    Meaningful political freedom can only be ensured in the context of an economic
    system such as progressive capitalism, which ensures a modicum of shared prosperity
    and where power—money—doesn’t have an improper role in the outcomes.


    The tenor of both Friedman’s and Hayek’s argument was that free and unfettered
    markets on their own are efficient. If only government is kept at a distance,
    they maintained, competitive markets are self-sustaining and necessary mechanisms
    to keep democracy running smoothly. To prevent'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'descent into "serfdom," one needs to keep government small, using it

    mainly to enforce property rights and contracts, and steering it away from

    providing public goods, regulating, or redistributing.

    I’ve explained why they (and the myriad others who share their view)

    wrong. Markets on their own are essentially never efficient.


    # Are free markets sustainable without a stronger democracy? Why

    eoliberal capitalism devours itself


    Not only are neoliberal economies inefficient, but neoliberalism as an

    econom system is not sustainable. There are many reasons to believe that

    eoliberal market economy is prone to devour itself. A market economy

    runs on train. Adam Smith emphasized the importance of trust, recognizing

    that society couldn''t survive if people brazenly followed their own self-interest
    rather than good codes of conduct:


    > The regard to those general rules of conduct, is what is properly called a sense
    of duty, a

    principle of greatest consequence in human life, and the only principle by which
    the

    bulk of mankind is capable of directing their actions.... [U]pon the tolerable

    observance of these duties, depends the very existence of human society, which
    would

    cumble into nothing if mankind were not generally impressed with a reverence for
    those

    important rules of conduct.


    For instance, contracts have to be honored. The cost of enforcing every

    contract through the courts would be unbearable. And with no trust in the

    future, why would anybody save? The incentives of neoliberal capitalism

    focus on self-interest and material well-being and have done much to

    weaken trust (evidences so clearly in the financial sector in the run-up to

    the 2008 financial crisis). Without adequate regulation, too many people, in

    t pursuit of their own self-interest, will conduct themselves in an

    trustworthy way, sliding to the edge of what is legal, overstepping the

    bounds of what is moral. We have seen, too, how neoliberalism helps create

    selfish and untrustworthy people. A “businessman” like Donald Trump can

    flourish for years, even decades, taking advantage of others. If Trump were

    t norm rather than the exception, commerce and industry would grind to a halt.'
  merge: -1
