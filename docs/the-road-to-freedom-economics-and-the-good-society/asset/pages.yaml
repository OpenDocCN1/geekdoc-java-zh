    of freedom, the term is especially evocative. it’s important that we think carefully
    about what the word then and, two centuries later, what it means now. There were
    ambiguities and inconsistencies in the founding, and the underlying conceptual
    problems have only become clearer since. Freedom then didn’t mean freedom for
    everyone. It didn’t'
