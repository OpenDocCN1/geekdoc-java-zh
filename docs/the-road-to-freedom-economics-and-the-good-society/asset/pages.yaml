  md: '# CHAPTER 8


    # Social Coercion and Social Cohesion


    We are all social animals, sensitive to what others think of us. What we view
    as “acceptable” is shaped by our society. In some societies, it is acceptable
    to litter, unmasked during a pandemic, spit in the street, or wear pants if you’re
    a woman; in other societies, these behaviors are unacceptable. One might say in
    each instance the norms constraining what a person could do are no less constraining
    than a government fine and, in some cases, far more constraining. In that sense,
    norms could be viewed as coercive.


    This chapter examines in closer detail how we form beliefs and the quandaries—and
    dangers—associated with social coercion. While I raise some hard-to-resolve questions,
    what emerges more clearly is that the current form of capitalism—neoliberal, unfettered
    capitalism—shapes people in ways that not only represent the antithesis of a good
    society but that actually undermine capitalism.


    # The Social Formation of Beliefs and Preferences


    Twenty-first-century behavioral economics emphasizes that preferences are endogenous—they
    can change with our experiences—and that they are largely socially determined.
    We are who we are because of the people who surround us, influenced greatly (but
    not exclusively) by parents and teachers.'
