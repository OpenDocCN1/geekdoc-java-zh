    # Progressive Capitalism, Social Democracy, and Social Justice


    I have laid out an alternative road, simply put, because we have to head somewhere
    better than where we are going now. And this brings me back to the links between
    freedom and the progressive capitalism (rejuvenated social democracy) agenda,
    with its focus on equality, social justice, and democracy.


    The freeing role of a liberal education


    Educational systems—and our knowledge system more broadly, including research
    universities and think tanks—play a central role in creating sustainable, free
    societies by inculcating the kinds of values that are required and by helping
    free individuals from social coercion and enhancing their autonomy. The lens through
    which we see the world is influenced by the people around us and the events we
    experience in ways we usually don''t notice. A good liberal arts education helps
    us to understand these forces. It allows us to see that we don''t have to assume
    the'
