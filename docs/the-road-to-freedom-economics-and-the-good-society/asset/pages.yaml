    A strong democracy can’t be sustained with a neoliberal economy for another reason.
    Neoliberalism has given rise to “rents,” the monopoly profits that are a major
    source of today’s inequalities. Much is at stake, especially for many in the top
    1 percent, centered on the enormous accretion of wealth that the system has allowed.


    Democracy requires compromise if it is to remain politically sustainable, but
    the middle ground has become increasingly difficult in today’s polarized society.
    And neoliberalism has contributed to this situation in so many ways, not least
    in the huge economic divides it created. Compromise is also difficult when there
    is so much at stake in terms of both economic and political power. No wonder then
    that the Right has adopted a “prisoner take all” attitude. One might have thought
