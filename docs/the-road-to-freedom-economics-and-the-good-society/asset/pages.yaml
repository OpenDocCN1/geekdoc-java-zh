    (government) institutions versus private (for-profit) companies. This perspective
    unnecessarily narrows the discussion. Any well-functioning economy or society
    requires a mix of institutions, not only public and private for-profit, but also
    cooperatives, private-not-profit, and so on. And the governmental institutions
    need to operate at multiple levels, including local, state or provincial, national,
    and global. These institutions need to exert checks and balances on each other,
