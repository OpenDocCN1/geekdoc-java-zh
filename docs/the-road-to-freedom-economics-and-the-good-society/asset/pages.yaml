    ideals are torn asunder. The collision of the two represents an special threat.


    When we successfully dismantle the myths about freedom that have been propagated
    by the Right and arrive at a more nuanced and balanced perspective, we will have
    taken our first and most important step toward creating a good society, where
    the freedoms of citizens to flourish, to live'
