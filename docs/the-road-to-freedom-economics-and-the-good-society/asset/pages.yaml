  md: '# CHAPTER 1


    # Introduction


    # Freedom in Danger


    Freedom is in danger. By most accounts, the number of people around the world
    living in free and democratic societies has been in decline. Freedom House, a
    nonprofit organization in the US that compiles an annual assessment of trends
    in freedom, said in its 2022 report that there had been sixteen consecutive years
    of declining freedoms. Today, 80 percent of the world’s population lives in countries
    that Freedom House describes as authoritarian or as only partially free—that is,
    lacking a key ingredient of a free society such as an independent press. The European
    Union, committed as it is to democracy and human rights, has not been spared.
    Hungary has been governed since May 29, 2010, by Viktor Orbán, who has declared
    himself in favor of “illiberal democracy” and taken steps against a free presidency
    and independence. On the other side of the Atlantic, Donald Trump has clear authoritarian
    tendencies, interfering with the peaceful transfer of power after he lost the
    2020 election. Yet despite multiple indictments and civil suits ranging from fraud
    to rape, he remains a strong candidate for the presidency as this book goes to
    press and is likely to be nominated by the Republican Party.


    We are in a global, intellectual, and political war to protect and preserve freedom.
    Do democracies and free societies deliver what citizens want and care about and
    can they do it better than authoritarian regimes? This is a'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'battle for the hearts and minds of people everywhere. I firmly believe that
    democracies and free societies can provide for their citizens far more effectively
    than authoritarian systems. However, in several key areas, most notably in economics,
    our free societies are failing. But—and this is important—these failures are not
    inevitable and are partially because the Right''s incorrect conception of freedom
    has led us down the wrong path. There are other paths that deliver more of the
    goods and services they want, with more of the security that they want, but that
    also provide more freedom for more people.¹


    This book approaches the questions of freedom from the perspective and language
    of economists, it focuses, at least at first, on what might be called economic
    freedom, as opposed to what is usually referred to as political freedoms (although
    I argue later that really, these are inseparable).


    # Freedom in a world of interdependence


    To consider the meaning of freedom, we must begin by recognizing our interdependence.
    As poet John Donne famously put it in 1624, “No man is an island ever of itself.”
    This is especially true in our modern, interconnected society, far different from
    the agrarian society of the preindustrial era, in which many people lived in single-family
    houses, sometimes at great distances from one another. In dense urban communities,
    what one person affects others, from honking horns to cleaning up the sidewalk
    after a pet. And in our industrial world, with cars and factories and industrial
    farming, the pollution from each person or company gradually contributes to an
    overload of greenhouse gases in the atmosphere, leading to global warming that
    affects us all.


    A refrain throughout this book is that one person’s freedom can often amount to
    another’s been; or put another way, the enhancement of one person’s freedom often
    comes at the expense of another’s. Cicero said some thousand years ago, “We are
    slaves of the law so that we may be able to be free.”² Only through collective
