    rights (more rights to exploit) being offset by societal benefits of innovation.
    Here, I''ve argued that in comparing arrangements with what we might see behind
    the veil of ignorance, it''s clear they are simply the outcome of the naked use
    of political power. The second goes further, asking whether there are better ways
    to organize our innovation system—to produce more knowledge and make the fruits
    of that knowledge more accessible. That is, are there other economic arrangements
    in which we might not have to face the balancing of freedoms so intensely? There
    are, especially in areas of health (but not universally). Government can finance
    the researchers themselves and/or it can provide a prize to the innovator. Of
    course, the “right to exploit”—the monopoly right granted to the innovator—can
    be thought of as a prize, but it’s a very distorting and inefficient one. A cash
    prize would be more efficient and (per dollar) more effective.³30 The irony is
    that in current arrangements, we’ve managed to get the worst of all worlds. The
    government finances much of the research—the mRNA platform on which the Pfizer
