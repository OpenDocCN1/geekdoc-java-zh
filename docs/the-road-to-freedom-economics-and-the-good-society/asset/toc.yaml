- - '##'
  - 右派的观点
- - '##'
  - 哪些私有合同应该是执行的？合同本身在伦理上是中性的；它们既可以促进社会不理想的交易，也可以促进理想的交易。良好的社会契约不会鼓励社会不理想的行为，因此，政府不应执行此类行为的私有合同。这显而易见的事——正如反对偷窃和杀人的监管需求一样。强迫某人做违法行为的合同本身应该是非法的，而且显然不应执行。然而，右派通过强调“合同的神圣性”，并没有承认社会好合同与坏合同之间的区别。
