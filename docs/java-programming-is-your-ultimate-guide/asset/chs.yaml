  \ 选择配置好的 JDK 并开始编码。\n\n![Rectangle Rectangle](img/image.png)\n\n### 安装 Eclipse\n\
  \n1. 下载：\n   - 访问 Eclipse 下载页面。\n   - 下载 `Eclipse IDE for Java Developers` 软件包。\
  \ \n2. 安装：\n   - 解压下载的文件（无需安装程序）。\n   - 运行 `eclipse` 可执行文件。\n3. 启动：\n   - 首次启动时，设置工作区。\n\
  4. 配置 JDK：\n   - 转到 `Window > Preferences > Java > Installed JREs`。\n   - 添加你的 JDK\
  \ 安装路径。\n\n![Rectangle Rectangle](img/image.png)\n\n### 安装 NetBeans\n\n1. 下载：\n\
  \   - 访问 [NetBeans 下载](https://netbeans.apache.org/download/) `NetBeans Downloads`。\n\
  2. 安装：\n   - 运行安装程序并按照提示操作。\n3. 启动：\n   - 打开 `NetBeans`。\n\n\n\n\n\n## 2. 编译\n\n\
  源代码使用 Java 编译器 (`javac`) 编译为字节码。\n\n命令：\n\n```bash\njavac HelloWorld.java\n```\n\
  \n- 输入：`HelloWorld.java`（源文件）。\n- 输出：`HelloWorld.class`（字节码文件）。\n\n### 编译过程中发生了什么？\n\
  \n- **词法分析**：\n    - 源代码被分词为标记（例如：关键字、标识符、操作符）。\n    - 检测语法错误，例如缺少分号或括号不匹配。\n- **语法分析与语义分析**：\n\
  \    - 将标记排列成语法树。\n    - 检查语义化规则（例如：变量声明、类型兼容性）。\n- **中间代码生成**：\n    - 将语法树转换为中间字节码。\n\
  - **优化**：\n    - 对生成的字节码进行某些优化，以提高其执行效率。\n- **字节码生成**：\n    - 编译器生成一个包含与平台无关的字节码的\
  \ `.class` 文件。\n\n![Rectangle Rectangle](img/image.png)\n\n## 3. 加载字节码\n\nJVM 将\
  \ `.class` 文件加载到内存中。\n\n- **类加载器**：\n    - 从文件系统或网络将字节码加载到内存。\n    - 验证字节码的正确性和安全性。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n## 4. JVM 执行\n\nJVM 解释或将字节码编译为机器码并执行。\n\
  \n### 执行模式：\n\n- **解释**：\n    - JVM 逐条读取并执行字节码指令。\n- **即时编译 (JIT)**：\n    - 将频繁执行的字节码部分编译为原生机器码，以获得更快的性能。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 编译流程图\n\n```\n源代码 (.java)\n↓\n编译器\
  \ (javac)\n↓\n字节码 (.class)\n↓\nJVM 类加载器\n↓\n字节码验证\n↓\n即时编译\n↓\n机器码执行\n```\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 编译涉及的关键组件\n\n1. **Java 编译器 (`javac`)**：\n   \
  \ - 将 Java 源代码转换为字节码。\n2. **字节码**：\n    - 程序的一种中间、与平台无关的表示。\n    - 存储在 `.class`\
  \ 文件中。\n3. **Java 虚拟机 (JVM)**：\n    - 在宿主机上执行字节码。\n    - 通过提供必要的运行时环境来确保平台无关性。\n\
  4. **即时编译器 (JIT)**：\n    - 在运行时将字节码转换为机器码以提高性能。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### Java 编译过程的优势\n\n1. **平台无关性**：\n    - 字节码可以在任何安装了 JVM 的系统上运行，确保“编写一次，到处运行”(WORA)。\n\
  2. **错误检测**：\n    - 编译在运行之前即可检测许多错误（例如：语法错误和类型错误）。\n3. **优化**：\n    - 编译器和 `JIT`\
  \ 应用各种优化来提高运行时效率。\n\n![Rectangle Rectangle](img/image.png)\n\n### 示例：编译实战\n\n####\
  \ 源代码 (HelloWorld.java):\n\n```java\npublic class HelloWorld {\n    public static\
  \ void main(String[] args) {\n        System.out.println(\"Hello, World!\");\n \
  \   }\n}\n```\n\n#### 编译：\n\n```bash\njavac HelloWorld.java\n```\n- 创建 `HelloWorld.class`。\n\
  \n#### 执行：\n\n```bash\njava HelloWorld\n```\n输出：\nHello, World!\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 总结\n\nJava 编译过程确保了 Java 程序是平台无关、安全且高效的。通过将代码编译为字节码并通过 `JVM` 执行，Java 为软件开发提供了灵活性和健壮性。\n\
  \n# Java 编程基础\n\n## Java 语法与结构\n\nJava 的语法和结构定义了程序的的编写和组织方式。Java 的设计强调可读性、一致性和简单性，使其成为最广泛使用的编程语言之一。以下是\
  \ Java 结构的详细说明，包含一个示例以及对代码和输出的解释。\n\n![Rectangle Rectangle](img/image.png)\n\n###\
  \ Java 程序的基本结构\n\n```java\n// 这是一个单行注释\n\n/*\n* 这是一个多行注释\n* 编译器会忽略这些注释。\n*/\n\n\
  // 类声明\npublic class HelloWorld {\n    // 主方法：任何 Java 程序的入口\n    public static void\
  \ main(String[] args) {\n        // 向控制台打印消息\n        System.out.println(\"Hello,\
  \ Java!\");\n    }\n}\n```\n\n![Rectangle Rectangle](img/image.png)\n\n### 代码详细拆析\n\
  \n1. **注释**：\n    - 单行 (`//`) 和多行 (`/* */`) 注释会被编译器忽略。\n2. **类声明**：\n    - `public\
  \ class HelloWorld`\n3. **主方法**：\n    - `public static void main(String[] args)`\
  \ 是入口点。\n    - `System.out.println(\"Hello, Java!\");` 向控制台打印消息。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 执行流程\n\n1. **编写代码**：将文件保存为 `HelloWorld.java`。\n\
  2. **编译**：使用 `javac HelloWorld.java` 生成 `HelloWorld.class`。\n3. **运行**：使用 `java\
  \ HelloWorld` 执行程序。\n\n![Rectangle Rectangle](img/image.png)\n\n### 输出解释\n\n####\
  \ 代码：\n```java\npublic class HelloWorld {\n    public static void main(String[]\
  \ args) {\n        System.out.println(\"Hello, Java!\");\n    }\n}\n```\n\n####\
  \ 输出：\nHello, Java!\n\n- `System.out.println` 向控制台写入 \"Hello, Java!\"。\n- 程序在执行完\
  \ main 方法后终止。\n\n![Rectangle Rectangle](img/image.png)\n\n### 更多语法特性\n\n#### 1.\
  \ 数据类型\n\nJava 支持多种数据类型：\n\n| 类型 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `int` |\
  \ 整数 | `int age = 25;` |\n| `double` | 小数 | `double pi = 3.14;` |\n| `char` | 单字符\
  \ | `char grade = 'A';` |\n| `boolean` | 逻辑值 (true/false) | `boolean isJavaFun =\
  \ true;` |\n| `String` | 字符序列 | `String name = \"Java\";` |\n\n#### 示例：\n```java\n\
  public class DataTypeExample {\n    public static void main(String[] args) {\n \
  \       int age = 25;\n        double height = 5.9;\n        char grade = 'A';\n\
  \        boolean isJavaFun = true;\n        String message = \"Learning Java\";\n\
  \        System.out.println(\"Age: \" + age);\n        System.out.println(\"Height:\
  \ \" + height);\n        System.out.println(\"Grade: \" + grade);\n        System.out.println(\"\
  Is Java fun? \" + isJavaFun);\n        System.out.println(\"Message: \" + message);\n\
  \    }\n}\n```\n\n#### 输出：\nAge: 25\nHeight: 5.9\nGrade: A\nIs Java fun? true\n\
  Message: Learning Java\n\n![Rectangle Rectangle](img/image.png)\n\n#### 2. 条件语句\n\
  \n用于控制程序的执行流。\n\n示例：\n```java\npublic class ConditionExample {\n    public static\
  \ void main(String[] args) {\n        int number = 10;\n        if (number > 0)\
  \ {\n            System.out.println(\"Positive number\");\n        } else {\n  \
  \          System.out.println(\"Non-positive number\");\n        }\n    }\n}\n```\n\
  输出：\nPositive number\n\n![Rectangle Rectangle](img/image.png)\n\n#### 3. 循环\n\n\
  用于重复操作。\n\n示例（for 循环）：\n```java\npublic class LoopExample {\n    public static void\
  \ main(String[] args) {\n        for (int i = 1; i <= 5; i++) {\n            System.out.println(\"\
  Count: \" + i);\n        }\n    }\n}\n```\n输出：\nCount: 1\nCount: 2\nCount: 3\nCount:\
  \ 4\nCount: 5\n\n\n\n\n\n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\nJava\
  \ 语法直观且遵循结构化格式。它通过以下方式确保清晰性：\n\n<bdi>●</bdi>类作为方法和数据的容器。\n<bdi>●</bdi>`main` 方法作为起点。\n\
  <bdi>●</bdi>方法内部的语句和表达式。\n\n程序的每个部分都构建特定的功能，使得 Java 在构建健壮的应用方面既简单强大。\n\n## Java\
  \ 中的数据类型和变量\n\n![Rectangle Rectangle](img/image.png)\n\nJava 是一种静态类型语言，这意味着每个变量必须声明数据类型。数据类型指定了变量可以存储的数据种类，例如整数、小数、字符或字符串。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 数据类型的分类\n\n1. **基本数据类型**：\n<bdi>○</bdi>内置于\
  \ Java。\n<bdi>○</bdi>包括 `int`、`double`、`char`、`boolean` 等类型。\n\n2. **引用数据类型**：\n\
  <bdi>○</bdi>表示对象和数组。\n<bdi>○</bdi>包括 `String`、自定义类和数组。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 基本数据类型\n\n| 类型 | 大小 | 默认值 | 说明 | 示例 |\n| :--- | :--- | :--- | :--- | :---\
  \ |\n| `byte` | 1 字节 | 0 | 存储 -128 到 127 之间的整数。 | `byte a = 10;` |\n| `short` |\
  \ 2 字节 | 0 | 存储 -32,768 到 32,767 之间的整数。 | `short b = 2000;` |\n| `int` | 4 字节 |\
  \ 0 | 存储 -2³¹ 到 2³¹-1 之间的整数。 | `int num = 100;` |\n| `long` | 8 字节 | 0L | 存储大整数。\
  \ | `long num = 100000L;` |\n| `float` | 4 字节 | 0.0f | 存储小数，单精度。 | `float pi = 3.14f;`\
  \ |\n| `double` | 8 字节 | 0.0 | 存储小数，双精度。 | `double e = 2.718;` |\n| `char` | 2 字节\
  \ | '\\u0000' | 存储单个字符。 | `char c = 'A';` |\n| `boolean` | 1 位 | false | 存储真/假值。\
  \ | `boolean isJavaFun = true;` |\n\n![Rectangle Rectangle](img/image.png)\n\n###\
  \ 引用数据类型\n\n<bdi>●</bdi>**字符串 (Strings)**：\n<bdi>○</bdi>字符序列。\n<bdi>○</bdi>示例：`String\
  \ name = \"Java\";`\n\n<bdi>●</bdi>**数组 (Arrays)**：\n<bdi>○</bdi>相同类型值的集合。\n<bdi>○</bdi>示例：`int[]\
  \ numbers = {1, 2, 3};`\n\n<bdi>●</bdi>**对象 (Objects)**：\n<bdi>○</bdi>类的实例。\n<bdi>○</bdi>示例：`Person\
  \ p = new Person();`\n\n![Rectangle Rectangle](img/image.png)\n\n### Java 中的变量\n\
  \n变量是用于存储数据的命名容器。变量必须：\n1. 有一个名称（标识符）。\n2. 被分配一个数据类型。\n3. 可选地分配一个初始值。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 声明变量\n\n#### 语法：\n\n```\ndataType variableName\
  \ = value;\n```\n\n#### 示例：\n```java\nint age = 25; // 声明一个名为 \"age\" 值为 25 的整数变量。\n\
  ```\n\n![Rectangle Rectangle](img/image.png)\n\n### 变量的类型\n\n1. **局部变量 (Local Variables)**：\n\
  <bdi>○</bdi>在方法或块内部声明。\n<bdi>○</bdi>仅在方法或块内可访问。\n\n2. **实例变量 (Instance Variables)**：\n\
  <bdi>○</bdi>在类内部但在任何方法之外声明。\n<bdi>○</bdi>属于类的实例。\n\n3. **静态变量 (Static Variables)**：\n\
  <bdi>○</bdi>使用 `static` 关键字声明。\n<bdi>○</bdi>属于类，而不是单个对象。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 带解释的示例代码\n\n```java\npublic class DataTypeExample {\n    // 实例变量\n    static\
  \ String course = \"Java Programming\";\n\n    public static void main(String[]\
  \ args) {\n        // 局部变量\n        int age = 20;\n        double gpa = 3.8;\n \
  \       char grade = 'A';\n        boolean isEnrolled = true;\n\n        // 打印变量\n\
  \        System.out.println(\"Course: \" + course);\n        System.out.println(\"\
  Age: \" + age);\n        System.out.println(\"GPA: \" + gpa);\n        System.out.println(\"\
  Grade: \" + grade);\n        System.out.println(\"Enrolled: \" + isEnrolled);\n\
  \    }\n}\n```\n\n![Rectangle Rectangle](img/image.png)\n\n### 代码解释\n\n1. **静态变量**：\n\
  <bdi>○</bdi>`static String course = \"Java Programming\";`\n<bdi>■</bdi>该变量属于 `DataTypeExample`\
  \ 类。\n<bdi>■</bdi>无需创建实例即可访问。\n\n2. **局部变量**：\n<bdi>○</bdi>`int age = 20;`, `double\
  \ gpa = 3.8;`, `char grade = 'A';`, `boolean isEnrolled = true;`\n这些变量在 `main` 方法中声明。\n\
  \n\n\n\n\n双精度值 `3.14159` 被截断为整数 `3`，丢失了它的小数部分。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 非数值类型之间的类型转换\n\nJava 允许数值和字符类型之间的类型转换，因为 `char` 在内部由整数（Unicode 值）表示。\n\n####\
  \ 代码示例：\n\n```java\npublic class CharCasting {\n    public static void main(String[]\
  \ args) {\n        char letter = 'A'; // 字符 'A'\n        int ascii = letter; //\
  \ 隐式转换为 int\n        char nextLetter = (char) (letter + 1); // 显式转换回 char\n    \
  \    System.out.println(\"Character: \" + letter);\n        System.out.println(\"\
  ASCII Value: \" + ascii);\n        System.out.println(\"Next Character: \" + nextLetter);\n\
  \    }\n}\n```\n\n#### 代码解释：\n\n1. `char letter = 'A';`:\n- 了一个值为 `'A'` 的 `char`\
  \ 变量 `letter`。\n\n2. `int ascii = letter;`:\n- 将 `char` 隐式转换为其 ASCII 整数值（`65`）。\n\
  \n3. `char nextLetter = (char) (letter + 1);`:\n- 将 `letter` 的 ASCII 值加 1，并将结果转换回\
  \ `char`。\n\n#### 输出：\n\nCharacter: A\nASCII Value: 65\nNext Character: B\n\n输出解释：\n\
  \n- `'A'` 被转换为其 ASCII 值 65。\n- 加 1 得到结果 66，它对应于字符 'B'。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 不兼容类型的强制转换\n\nJava 不允许不兼容类型之间的直接转换（例如从 `String` 到 `int`）。然而，可以使用辅助方法实现转换。\n\
  \n#### 代码示例：\n\n```java\npublic class IncompatibleCasting {\n    public static void\
  \ main(String[] args) {\n        String number = \"100\";\n        int parsedNumber\
  \ = Integer.parseInt(number); // 将 String 转换为 int\n        System.out.println(\"\
  String: \" + number);\n        System.out.println(\"Integer: \" + parsedNumber);\n\
  \    }\n}\n```\n\n#### 代码解释：\n\n1. `String number = \"100\";`:\n- 定义了一个包含 `\"100\"\
  ` 的 `String` 变量 `number`。\n\n2. `int parsedNumber = Integer.parseInt(number);`:\n\
  - 使用 `Integer.parseInt` 方法将 `String` 转换为 `int`。\n\n#### 输出：\n\nString: 100\nInteger:\
  \ 100\n\n输出解释：\n\n- 字符串 `\"100\"` 解析为整数 100。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 数组转换\n\n数组不能直接转换，但如果元素兼容，可以对其元素单独进行转换。\n\n#### 代码示例：\n\n```java\npublic class\
  \ ArrayCasting {\n    public static void main(String[] args) {\n        double[]\
  \ numbers = {1.1, 2.2, 3.3};\n        int[] integers = new int[numbers.length];\n\
  \        for (int i = 0; i < numbers.length; i++) {\n            integers[i] = (int)\
  \ numbers[i]; // 显式转换\n        }\n        for (int num : integers) {\n         \
  \   System.out.println(num);\n        }\n    }\n}\n```\n\n#### 输出：\n\n1\n2\n3\n\n\
  输出解释：\n\n- `numbers` 数组中的每个双精度值都被截断为其整数部分并存储在 `integers` 数组中。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 注意事项\n\n1. **精度丢失**：\n- 窄转换可能会导致数据丢失（例如小数的截断）。\n\n2. **不兼容的转换**：\n- 不相关类型之间的转换（例如从\
  \ `String` 到 `int`）需要显式的解析方法。\n\n3. **安全转换**：\n- 宽转换是安全的，因为较大的类型可以完全表示较小类型的值。\n\n\
  ## 运算符和表达式\n\n运算符是会对变量和值执行操作的符号，而表达式将变量、常量和运算符结合以产生结果。理解运算符和表达式对于在 Java 程序中进行计算、决策和构建逻辑至关重要。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 运算符分类\n\n1. 算术运算符\n2. 关系（比较）运算符\n\
  3. 逻辑运算符\n4. 位运算符\n5. 赋值运算符\n6. 一元运算符\n7. 三元（条件）运算符\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 1. 算术运算符\n\n算术运算符执行基础数学运算。\n\n| 运算符 | 描述 | 示例 | 结果 |\n| :--- | :--- | :---\
  \ | :--- |\n| + | 加法 | `5 + 3` | `8` |\n| - | 减法 | `5 - 3` | `2` |\n| * | 乘法 | `5\
  \ * 3` | `15` |\n| / | 除法 | `5 / 2` | `2` (整数除法) |\n| % | 取模（余数） | `5 % 2` | `1`\
  \ |\n\n#### 代码示例：\n\n```java\npublic class ArithmeticExample {\n    public static\
  \ void main(String[] args) {\n        int a = 10, b = 3;\n        System.out.println(\"\
  Addition: \" + (a + b));\n        System.out.println(\"Subtraction: \" + (a - b));\n\
  \        System.out.println(\"Multiplication: \" + (a * b));\n        System.out.println(\"\
  Division: \" + (a / b));\n        System.out.println(\"Modulus: \" + (a % b));\n\
  \    }\n}\n```\n\n输出：\nAddition: 13\nSubtraction: 7\nMultiplication: 30\nDivision:\
  \ 3\nModulus: 1\n\n### 2. 关系（比较）运算符\n\n关系运算符比较值并返回布尔值。\n\n| 运算符 | 描述 | 示例 | 结果 |\n\
  | :--- | :--- | :--- | :--- |\n| == | 等于 | `5 == 3` | `false` |\n| != | 不等于 | `5\
  \ != 3` | `true` |\n| > | 大于 | `5 > 3` | `true` |\n| < | 小于 | `5 < 3` | `false`\
  \ |\n| >= | 大于等于 | `5 >= 3` | `true` |\n| <= | 小于等于 | `5 <= 3` | `false` |\n\n####\
  \ 代码示例：\n\n```java\npublic class RelationalExample {\n    public static void main(String[]\
  \ args) {\n        int x = 5, y = 10;\n        System.out.println(\"x == y: \" +\
  \ (x == y));\n        System.out.println(\"x != y: \" + (x != y));\n        System.out.println(\"\
  x > y: \" + (x > y));\n        System.out.println(\"x < y: \" + (x < y));\n    \
  \    System.out.println(\"x >= y: \" + (x >= y));\n        System.out.println(\"\
  x <= y: \" + (x <= y));\n    }\n}\n```\n\n输出：\nx == y: false\nx != y: true\nx >\
  \ y: false\nx < y: true\nx >= y: false\nx <= y: true\n\n### 3. 逻辑运算符\n\n逻辑运算符组合布尔表达式。\n\
  \n| 运算符 | 描述 | 示例 | 结果 |\n| :--- | :--- | :--- | :--- |\n| && | 逻辑与（两者为真） | `true\
  \ && false` | `false` |\n| \\|\\| | 逻辑或（至少一个为真） | `true \\| false` | `true` |\n\
  | ! | 逻辑非（取反） | `!true` | `false` |\n\n#### 代码示例：\n\n```java\npublic class LogicalExample\
  \ {\n    public static void main(String[] args) {\n        boolean a = true, b =\
  \ false;\n        System.out.println(\"a && b: \" + (a && b));\n        System.out.println(\"\
  a || b: \" + (a || b));\n        System.out.println(\"!a: \" + (!a));\n    }\n}\n\
  ```\n\n输出：\na && b: false\na || b: true\n!a: false\n\n### 4. 位运算符\n\n位运算符在位级别执行操作。\n\
  \n| 运算符 | 描述 | 示例 | 结果 |\n| :--- | :--- | :--- | :--- |\n| & | 位与 | `5 & 3` | `1`\
  \ |\n| \\| | 位或 | `5 \\| 3` | `7` |\n| ^ | 位异异 | `5 ^ 3` | `6` |\n| ~ | 位取反 | `~5`\
  \ | `-6` |\n| << | 左移 | `5 << 1` | `10` |\n| >> | 右移 | `5 >> 1` | `2` |\n\n####\
  \ 代码示例：\n\n```java\npublic class BitwiseExample {\n    public static void main(String[]\
  \ args) {\n        int a = 5, b = 3;\n        System.out.println(\"a & b: \" + (a\
  \ & b));\n        System.out.println(\"a | b: \" + (a | b));\n        System.out.println(\"\
  a ^ b: \" + (a ^ b));\n        System.out.println(\"~a: \" + (~a));\n        System.out.println(\"\
  a << 1: \" + (a << 1));\n        System.out.println(\"a >> 1: \" + (a >> 1));\n\
  \    }\n}\n```\n\n输出：\na & b: 1\na | b: 7\na ^ b: 6\n~a: -6\na << 1: 10\na >> 1:\
  \ 2\n\n### 5. 赋值运算符\n\n赋值运算符将值赋给变量。\n\n| 运算符 | 示例 | 等于 |\n| :--- | :--- | :--- |\n\
  | = | `x = 5` | 赋值值 |\n| += | `x += 3` | `x = x + 3` |\n| -= | `x -= 3` | `x = x\
  \ - 3` |\n| *= | `x *= 3` | `x = x * 3` |\n| /= | `x /= 3` | `x = x / 3` |\n| %=\
  \ | `x %= 3` | `x = x % 3` |\n\n#### 代码示例：\n\n```java\npublic class AssignmentExample\
  \ {\n    public static void main(String[] args) {\n        int x = 5;\n        System.out.println(\"\
  x: \" + x);\n        x += 3;\n        System.out.println(\"x += 3: \" + x);\n  \
  \      x -= 2;\n        System.out.println(\"x -= 2: \" + x);\n        x *= 2;\n\
  \        System.out.println(\"x *= 2: \" + x);\n        x /= 4;\n        System.out.println(\"\
  x /= 4: \" + x);\n        x %= 3;\n        System.out.println(\"x %= 3: \" + x);\n\
  \    }\n}\n```\n\n输出：\nx: 5\nx += 3: 8\nx -= 2: 6\nx *= 2: 12\nx /= 4: 3\nx %= 3:\
  \ 0\n\n### 6. 一元运算符\n\n一元运算符作用于单个操作数。\n\n| 运算符 | 描述 | 示例 | 结果 |\n| :--- | :--- |\
  \ :--- | :--- |\n| + | 一元加 | `+5` | `5` |\n| - | 一元减 | `-5` | `-5` |\n| ++ | 自增\
  \ | `x++` | `x + 1` |\n| -- | 自减 | `x--` | `x - 1` |\n| ! | 逻辑非 | `!true` | `false`\
  \ |\n\n#### 代码示例：\n\n```java\npublic class UnaryExample {\n    public static void\
  \ main(String[] args) {\n        int x = 5;\n        System.out.println(\"+x: \"\
  \ + (+x));\n        System.out.println(\"-x: \" + (-x));\n        System.out.println(\"\
  x++: \" + (x++));\n        System.out.println(\"x after x++: \" + x);\n        System.out.println(\"\
  --x: \" + (--x));\n        System.out.println(\"x after --x: \" + x);\n        boolean\
  \ b = true;\n        System.out.println(\"!b: \" + (!b));\n    }\n}\n```\n\n输出：\n\
  +x: 5\n-x: -5\nx++: 5\nx after x++: 6\n--x: 6\nx after --x: 5\n!b: false\n\n###\
  \ 7. 三元（条件）运算符\n\n三元运算符是 if-else 的简写。\n\n语法：\n\n`条件 ? 真为值 : 假为值`\n\n#### 代码示例：\n\
  \n```java\npublic class TernaryExample {\n    public static void main(String[] args)\
  \ {\n        int age = 20;\n        String result = (age >= 18) ? \"Adult\" : \"\
  Minor\";\n        System.out.println(\"Result: \" + result);\n    }\n}\n```\n\n\
  输出：\nResult: Adult\n\n\n\n\n\n#### 代码示例：\n\n```java\npublic class TernaryExample\
  \ {\n\n    public static void main(String[] args) {\n        int a = 10, b = 20;\n\
  \        int max = (a > b) ? a : b;\n        System.out.println(\"Max: \" + max);\n\
  \    }\n}\n```\n\n#### 输出：\n\nMax: 20\n\n#### 解释：\n\n<bdi>●</bdi>如果 `a > b` 为真，则将\
  \ `a` 赋值给 `max`。否则赋值 `b`。\n\n![Rectangle Rectangle](img/image.png)\n\n### 表达式\n\n\
  表达式是变量、常量和运算符的组合，产生一个值。\n\n#### 示例：\n\n```java\nint result = (10 + 5) * 3; // Expression\n\
  ```\n\n#### 解释：\n\n<bdi>●</bdi>`(10 + 5)` 求值结果为 `15`。\n\n<bdi>●</bdi>`15 * 3` 求值结果为\
  \ `45`。\n\n![Rectangle Rectangle](img/image.png)\n\n### 练习题\n\n编写一个程序，演示在一个表达式中使用算术运算符、关系运算符和逻辑运算符。\n\
  \n#### 代码示例：\n\n```java\npublic class ExpressionExample {\n\n    public static void\
  \ main(String[] args) {\n        int a = 10, b = 20, c = 5;\n        boolean result\
  \ = (a + b > c) && (a < b);\n        System.out.println(\"Result: \" + result);\n\
  \    }\n}\n```\n\n#### 输出：\n\nResult: true\n\n#### 解释：\n\n<bdi>●</bdi>`(a + b >\
  \ c)` 求值结果为 `true` (30 > 5)。\n\n<bdi>●</bdi>`(a < b)` 求值结果为 `true`。\n\n<bdi>●</bdi>逻辑与\
  \ (`&&`) 将两者结合，结果为 `true`。\n\n## 决策语句\n\nJava 中的决策语句用于评估条件并根据结果执行特定的代码块。这些语句实现了条件逻辑，使程序能够适应不同的场景。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 决策语句的类型\n\n1. `if` 语句\n2. `if-else`\
  \ 语句\n3. `if-else-if` 阶梯\n4. `switch` 语句\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 1. `if` 语句\n\n`if` 语句仅在指定的条件评估为真时才执行代码块。\n\n#### 语法：\n\n```java\nif (condition)\
  \ {\n    // 如果条件为真，则执行的代码\n}\n```\n\n#### 代码示例：\n\n```java\npublic class IfExample\
  \ {\n\n    public static void main(String[] args) {\n        int number = 10;\n\
  \        if (number > 5) {\n            System.out.println(\"Number is greater than\
  \ 5\");\n        }\n    }\n}\n```\n\n#### 输出：\n\nNumber is greater than 5\n\n####\
  \ 解释：\n\n<bdi>●</bdi>条件 `number > 5` 求值结果为 `true`。\n\n<bdi>●</bdi>结果执行了 `if` 块内部的\
  \ `System.out.println` 语句。\n\n![Rectangle Rectangle](img/image.png)\n\n### 2. `if-else`\
  \ 语句\n\n`if-else` 语句在条件评估为假时提供另一种 way 路径。\n\n#### 语法：\n\n```java\nif (condition)\
  \ {\n    // 如果条件为真，则执行的代码\n} else {\n    // 如果条件为假，则执行的代码\n}\n```\n\n#### 代码示例：\n\
  \n```java\npublic class IfElseExample {\n\n    public static void main(String[]\
  \ args) {\n        int number = 3;\n        if (number > 5) {\n            System.out.println(\"\
  Number is greater than 5\");\n        } else {\n            System.out.println(\"\
  Number is less than or equal to 5\");\n        }\n    }\n}\n```\n\n#### 输出：\n\n\
  Number is less than or equal to 5\n\n#### 解释：\n\n<bdi>●</bdi>条件 `number > 5` 求值结果为\
  \ `false`。\n\n<bdi>●</bdi>执行了 `else` 块中的代码。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 3. `if-else-if` 阶梯\n\n`if-else-if` 阶梯用于需要顺序检查多个条件的情况。如果其中一个条件成立，则执行对应的块并跳过其余部分。\n\
  \n#### 语法：\n\n```java\nif (condition1) {\n    // 如果 condition1 为真，则执行代码\n} else\
  \ if (condition2) {\n    // 如果 condition2 为真，则执行代码\n} else {\n    // 如果所有条件为假，则执行代码\n\
  }\n```\n\n#### 代码示例：\n\n```java\npublic class IfElseIfExample {\n\n    public static\
  \ void main(String[] args) {\n        int marks = 85;\n        if (marks >= 90)\
  \ {\n            System.out.println(\"Grade: A+\");\n        } else if (marks >=\
  \ 80) {\n            System.out.println(\"Grade: A\");\n        } else if (marks\
  \ >= 70) {\n            System.out.println(\"Grade: B\");\n        } else {\n  \
  \          System.out.println(\"Grade: C\");\n        }\n    }\n}\n```\n\n#### 输出：\n\
  \nGrade: A\n\n#### 解释：\n\n<bdi>●</bdi>条件 `marks >= 90` 求值结果为 `false`。\n\n<bdi>●</bdi>`marks\
  \ >= 80` 求值结果为 `true`，因此执行该语句。其余条件被跳过。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 4. `switch` 语句\n\n`switch` 语句评估表达式并与多个标签匹配。当找到匹配项时，执行相应的代码。\n\n#### 语法：\n\n\
  ```java\nswitch (expression) {\n    case value1:\n        // value1 的代码\n    case\
  \ value2:\n        // value2 的代码\n    default:\n        // 无匹配时的默认代码\n}\n```\n\n\
  #### 代码示例：\n\n```java\npublic class SwitchExample {\n\n    public static void main(String[]\
  \ args) {\n        int day = 3;\n        switch (day) {\n            case 1:\n \
  \               System.out.println(\"Monday\");\n            case 2:\n         \
  \       System.out.println(\"Tuesday\");\n            case 3:\n                System.out.println(\"\
  Wednesday\");\n                break;\n            default:\n                System.out.println(\"\
  Invalid day\");\n        }\n    }\n}\n```\n\n#### 输出：\n\nWednesday\n\n#### 解释：\n\
  \n<bdi>●</bdi>`day` 的值为 `3`。\n\n<bdi>●</bdi>匹配到 `case 3`，执行 `System.out.println(\"\
  Wednesday\")`。\n\n<bdi>●</bdi>`break` 语句阻止了后续 case 的执行。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 嵌套 if\n\n在另一个 `if` 语句内部的 `if` 语句被称为嵌套 if。\n\n#### 代码示例：\n\n```java\npublic\
  \ class NestedIfExample {\n\n    public static void main(String[] args) {\n    \
  \    int age = 25;\n        boolean isCitizen = true;\n        if (age >= 18) {\n\
  \            if (isCitizen) {\n                System.out.println(\"Eligible to\
  \ vote\");\n            } else {\n                System.out.println(\"Not a citizen\"\
  );\n            }\n        } else {\n            System.out.println(\"Not eligible\
  \ to vote\");\n        }\n    }\n}\n```\n\n#### 输出：\n\nEligible to vote\n\n####\
  \ 解释：\n\n<bdi>●</bdi>外部条件 `age >= 18` 求值结果为 `true`。\n\n<bdi>●</bdi>内部条件 `isCitizen`\
  \ 也是 `true`，因此执行 `System.out.println(\"Eligible to vote\")`。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 常见场景\n\n#### 对 `char` 使用 `switch`\n\n```java\npublic class SwitchCharExample\
  \ {\n\n    public static void main(String[] args) {\n        char grade = 'A';\n\
  \        switch (grade) {\n            case 'A':\n                System.out.println(\"\
  Excellent\");\n                break;\n            case 'B':\n                System.out.println(\"\
  Good\");\n                break;\n            default:\n                System.out.println(\"\
  Needs Improvement\");\n        }\n    }\n}\n```\n\n#### 输出：\n\nExcellent\n\n####\
  \ 解释：\n\n<bdi>●</bdi>`grade` 的值为 `'A'`。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 默认分支\n\n如果没有任何 case 匹配，则 `switch` 语句执行 `default` 块。\n\n#### 代码示例：\n\n```java\n\
  public class DefaultCaseExample {\n\n    public static void main(String[] args)\
  \ {\n        int choice = 5;\n        switch (choice) {\n            case 1:\n \
  \               System.out.println(\"Option 1\");\n                break;\n    \
  \        case 2:\n                System.out.println(\"Option 2\");\n          \
  \      break;\n            default:\n                System.out.println(\"Invalid\
  \ option\");\n        }\n    }\n}\n```\n\n#### 输出：\n\nInvalid option\n\n#### 解释：\n\
  \n<bdi>●</bdi>`choice` 不匹配任何 case，因此执行 `default` 块。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 记忆要点\n\n1. `if-else` 与 `switch`：\n   使用 `if-else` 处理范围范围条件。\n   使用 `switch`\
  \ 处理离散值的匹配。\n2. `break` 语句：\n   阻止 `switch` 中后续 case 的执行。\n3. 逻辑运算符：\n   使用 `&&`\
  \ (与)、`||` (或) 和 `!` (非) 组合多个条件。\n4. 默认执行：\n   在 `if-else` 和 `switch` 中，均确保对未匹配条件有备用逻辑。\n\
  \n## 循环\n\n循环用于重复执行代码块，直到满足指定的条件。Java 提供了多种循环来处理重复性任务。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### Java 中的循环类型\n\n1. `for` 循环\n2. 增强 `for` 循环 (for-each 循环)\n3. `while` 循环\n\
  4. `do-while` 循环\n\n### 1. `for` 循环\n\n当提前知道迭代次数时使用 `for` 循环。它由三部分组成：\n\n<bdi>●</bdi>初始化：设置循环控制变量。\n\
  \n<bdi>●</bdi>条件：评估循环是否继续。\n\n<bdi>●</bdi>更新：在每次迭代后修改控制变量。\n\n#### 语法：\n\n```java\n\
  for (initialization; condition; update) {\n    // Code to execute\n}\n```\n\n####\
  \ 代码示例：\n\n```java\npublic class ForLoopExample {\n\n\n\n\n```java\npublic static\
  \ void main(String[] args) {\n    for (int i = 1; i <= 5; i++) {\n        System.out.println(\"\
  Count: \" + i);\n    }\n}\n```\n\n#### Output:\nCount: 1\nCount: 2\nCount: 3\nCount:\
  \ 4\nCount: 5\n\n#### Explanation:\n\n1. Initialization: `int i = 1` sets `i` to\
  \ `1`.\n2. Condition: `i <= 5` ensures the loop runs while `i` is less than or equal\
  \ to `5`.\n3. Update: `i++` increments `i` by `1` after each iteration.\n4. The\
  \ loop executes the `System.out.println` statement five times, printing the values\
  \ of `i`.\n\n![Rectangle Rectangle](img/image.png)\n\n### 2. Enhanced for Loop (for-each\
  \ Loop)\n\nThe enhanced for loop is used to iterate over arrays or collections.\n\
  \n#### Syntax:\n\n```java\nfor (type variable : collection) {\n    // Code to execute\n\
  }\n```\n\n#### Code Example:\n\n```java\npublic class ForEachExample {\n    public\
  \ static void main(String[] args) {\n        int[] numbers = {10, 20, 30, 40, 50};\n\
  \        for (int num : numbers) {\n            System.out.println(\"Number: \"\
  \ + num);\n        }\n    }\n}\n```\n\n#### Output:\nNumber: 10\nNumber: 20\nNumber:\
  \ 30\nNumber: 40\nNumber: 50\n\n#### Explanation:\n\n1. The for-each loop iterates\
  \ through each element of the `numbers` array.\n2. On each iteration, the current\
  \ array element is assigned to `num` and printed.\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 3. while Loop\n\nThe while loop is used when the number of iterations is not\
  \ known in advance and depends on a condition.\n\n#### Syntax:\n\n```java\nwhile\
  \ (condition) {\n    // Code to execute\n}\n```\n\n#### Code Example:\n\n```java\n\
  public class WhileLoopExample {\n    public static void main(String[] args) {\n\
  \        int i = 1;\n        while (i <= 5) {\n            System.out.println(\"\
  Count: \" + i);\n            i++;\n        }\n    }\n}\n```\n\n#### Output:\nCount:\
  \ 1\nCount: 2\nCount: 3\nCount: 4\nCount: 5\n\n#### Explanation:\n\n1. Initialization:\
  \ `int i = 1`.\n2. The while loop checks the condition `i <= 5`.\n3. If the condition\
  \ is true, the code block executes, and `i` is incremented by `1`.\n4. The loop\
  \ terminates when `i > 5`.\n\n![Rectangle Rectangle](img/image.png)\n\n### 4. do-while\
  \ Loop\n\nThe do-while loop is similar to the `while` loop but guarantees that the\
  \ code block is executed at least once before checking the condition.\n\n#### Syntax:\n\
  \n```java\ndo {\n    // Code to execute\n} while (condition);\n```\n\n#### Code\
  \ Example:\n\n```java\npublic class DoWhileExample {\n    public static void main(String[]\
  \ args) {\n        int i = 6;\n        do {\n            System.out.println(\"Count:\
  \ \" + i);\n            i++;\n        } while (i <= 5);\n    }\n}\n```\n\n#### Output:\n\
  Count: 6\n\n#### Explanation:\n\n1. The `do` block executes first, printing `Count:\
  \ 6`.\n2. After the first iteration, the condition `i <= 5` is checked and evaluates\
  \ to false, terminating the loop.\n\n![Rectangle Rectangle](img/image.png)\n\n###\
  \ 5. Nested Loops\n\nLoops can be nested within other loops to handle multidimensional\
  \ data or repeated tasks within repeated tasks.\n\n#### Code Example:\n\n```java\n\
  public class NestedLoopExample {\n    public static void main(String[] args) {\n\
  \        for (int i = 1; i <= 3; i++) {\n            for (int j = 1; j <= 2; j++)\
  \ {\n                System.out.println(\"Outer: \" + i + \", Inner: \" + j);\n\
  \            }\n        }\n    }\n}\n```\n\n#### Output:\nOuter: 1, Inner: 1\nOuter:\
  \ 1, Inner: 2\nOuter: 2, Inner: 1\nOuter: 2, Inner: 2\nOuter: 3, Inner: 1\nOuter:\
  \ 3, Inner: 2\n\n#### Explanation:\n\n- The outer loop runs from `i = 1` to `i =\
  \ 3`.\n- For each iteration of the outer loop, the inner loop runs from `j = 1`\
  \ to `j = 2`.\n- Each combination of `i` and `j` is printed.\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 6. Infinite Loops\n\nA loop with no terminating condition results in an infinite\
  \ loop.\n\n#### Code Example:\n\n```java\npublic class InfiniteLoopExample {\n \
  \   public static void main(String[] args) {\n        while (true) {\n         \
  \   System.out.println(\"This is an infinite loop!\");\n            break; // To\
  \ prevent endless execution\n        }\n    }\n}\n```\n\n#### Output:\nThis is an\
  \ infinite loop!\n\n#### Explanation:\n\n- The condition `true` ensures the loop\
  \ runs indefinitely.\n- The `break` statement exits the loop after the first iteration.\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 7. Breaking and Continuing in Loops\n\
  \n#### break Statement:\n\nExits the loop immediately.\n\nCode Example:\n\n```java\n\
  public class BreakExample {\n    public static void main(String[] args) {\n    \
  \    for (int i = 1; i <= 5; i++) {\n            if (i == 3) break;\n        }\n\
  \    }\n}\n```\n\n#### continue Statement:\n\nSkips the current iteration and proceeds\
  \ to the next.\n\nCode Example:\n\n```java\npublic class ContinueExample {\n   \
  \ public static void main(String[] args) {\n        for (int i = 1; i <= 5; i++)\
  \ {\n            if (i == 3) continue;\n        }\n    }\n}\n```\n\n\n\n\n```java\n\
  public static void main(String[] args) {\n    // 定义一个锯齿数组\n    int[][] jaggedArray\
  \ = {\n        {1, 2},\n        {3, 4, 5},\n        {6}\n    };\n\n    // 访问打印元素\n\
  \    for (int i = 0; i < jaggedArray.length; i++) {\n        for (int j = 0; j <\
  \ jaggedArray[i].length; j++) {\n            System.out.print(jaggedArray[i][j]\
  \ + \" \");\n        }\n        System.out.println(); // 每个子数组换行\n    }\n}\n```\n\
  \n#### 输出:\n```\n1 2\n3 4 5\n6\n```\n\n#### 解析:\n1. `jaggedArray` 包含长度不相同的子数组。\n\
  2. 嵌套循环访问每个子数组并打印其元素。\n\n![Rectangle Rectangle](img/image.png)\n\n## 数组的常用操作\n\n\
  ### 1. 获取数组的长度\n`int length = arrayName.length;`\n\n#### 代码示例:\n```java\npublic\
  \ class ArrayLengthExample {\n    public static void main(String[] args) {\n   \
