  \n## Maven 命令\n\n### 1. 编译项目：\n\n```\nmvn compile\n```\n\n### 2. 运行单元测试：\n\n```\n\
  mvn test\n```\n\n### 3. 构建项目（创建 JAR）：\n\n```\nmvn package\n```\n\n输出：\n```\n[INFO]\
