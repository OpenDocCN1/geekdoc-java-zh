  \ 需要预测数量的线程。 |\n| 缓存线程池 | 动态创建线程并重用空闲线程。 | 短寿命、突发性的任务。 |\n| 单线程执行器 | 在单个线程中按顺序执行任务。\
  \ | 确保任务顺序。 |\n| 调度线程池 | 在延迟后或定期执行任务。 | 调度或循环执行的任务。 |\n\n![Rectangle Rectangle](img/image.png)\n\
  \n## 最佳实践\n\n1. 重用线程:\n<bdi>○</bdi>使用线程池避免重复创建和销毁线程的开销。\n\n2. 关闭执行器:\n<bdi>○</bdi>在任务执行后始终调用\
  \ `shutdown()` 或 `shutdownNow()` 以释放资源。\n\n3. 异常处理:\n<bdi>○</bdi>处理任务中的异常以避免线程终止。\n\
  \n4. 避免过载:\n<bdi>○</bdi>监控线程池大小和队列容量以防止资源耗尽。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 总结\n\nExecutors 框架简化了线程管理并为并发编程提供了强大的抽象：\n\n1. 核心组件:\n<bdi>○</bdi>`Executors`、`ExecutorService`、`ScheduledExecutorService`\
  \ 和 `Callable`。\n\n2. 线程池:\n<bdi>○</bdi>用于不同场景的固定、缓存、单线程和调度线程池。\n\n3. 关键优势:\n<bdi>○</bdi>线程重用、任务调度和灵活的配置。\n\
  \n## Lambda 表达式\n\nLambda 表达式是 Java 8 引入的一种特性，通过以函数式风格表示匿名方法，允许开发者编写更整洁、简洁的代码。它们通常与函数式接口配合使用，实现函数编程结构。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### Lambda 表达式的关键特性\n\n1. 简洁性:\n<bdi>○</bdi>通过减少样板代码简化了匿名类的创建。\n\
  \n2. 函数式编程:\n<bdi>○</bdi>通过函数式接口促进函数式编程风格。\n\n3. 提高可读性:\n<bdi>○</bdi>允许内联行为，提高代码清晰度。\n\
  \n4. 与 Stream 集成:\n<bdi>○</bdi>与 Java Streams API 无缝协作进行数据处理。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### Lambda 表达式的语法\n\n`(parameter list) -> { body }`\n\n<bdi>●</bdi>参数列表：逗号分隔的参数列表。\n\
  <bdi>●</bdi>箭头标记 (`->`)：分隔参数和主体。\n<bdi>●</bdi>主体：包含要执行的逻辑或表达式。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 函数式接口\n\n函数式接口是一个只有一个抽象方法的接口。Lambda 表达式可以提供该抽象方法的实现。\n\nJava 中常见的函数式接口：\n\n\
  1. `Runnable` - 方法：`void run()`\n2. `Callable<T>` - 方法：`T call()`\n3. `Comparator<T>`\
  \ - 方法：`int compare(T o)`\n\n## 1. 带有函数接口的 Lambda 表达式\n\n函数式接口是一个只有一个抽象方法的接口。Lambda\
  \ 表达式可以提供该抽象方法的实现。\n\nJava 中常见的函数式接口：\n\n1. `Runnable` - 方法：`void run()`\n2. `Callable<T>`\
  \ - 方法：`T call()`\n3. `Comparator<T>` - 方法：`int compare(T o)`\n\n## 2. 带有多个参数的 Lambda\
  \ 表达式\n\n`(parameter list) -> { body }`\n\n<bdi>●</bdi>参数列表：逗号分隔的参数列表。\n<bdi>●</bdi>箭头标记\
  \ (`->`)：分隔参数和主体。\n<bdi>●</bdi>主体：包含要执行的逻辑或表达式。\n\n## 3. 带有集合的 Lambda 表达式\n\nGreeting:\n\
  <bdi>○</bdi>Lambda 表达式可以提供该抽象方法的实现。\n\n## 4. 带有谓词的 Lambda 表达式\n\n```:\n\n 示例:\n\n\
  ```java\n```\n\n\n\n\n○ 以函数和声明式的风格处理数据。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 5. 使用 Lambda 返回值\n\n#### 代码示例：\n\n```java\n@FunctionalInterface\ninterface\
  \ Square {\n    int calculate(int x);\n}\n\npublic class LambdaReturnValues {\n\
  \    public static void main(String[] args) {\n        // 带有返回值的 Lambda 表达式\n  \
  \      Square square = x -> x * x;\n        System.out.println(\"Square of 4: \"\
  \ + square.calculate(4));\n        System.out.println(\"Square of 7: \" + square.calculate(7));\n\
  \    }\n}\n```\n\n#### 输出：\n```\nSquare of 4: 16\nSquare of 7: 49\n```\n\n#### 解释：\n\
  \n1. **返回值**：\n   ○ Lambda 返回输入 `x` 的平方。\n2. **简洁性**：\n   ○ 单表达式方法体不需要大括号或显式的 `return`\
  \ 语句。\n\n![Rectangle Rectangle](img/image.png)\n\n### 6. 带 Lambda 的方法引用\n\n方法引用是调用特定方法的\
  \ Lambda 表达式的简写。\n\n#### 代码示例：\n\n```java\nimport java.util.Arrays;\nimport java.util.List;\n\
  \npublic class LambdaMethodReference {\n    public static void main(String[] args)\
  \ {\n        List<String> names = Arrays.asList(\"Alice\", \"Bob\", \"Charlie\"\
  );\n        // 使用方法引用\n        names.forEach(System.out::println);\n    }\n}\n```\n\
  \n#### 输出：\n```\nAlice\nBob\nCharlie\n```\n\n#### 解释：\n\n1. **方法引用**：\n   ○ `System.out::println`\
  \ 是 `name -> System.out.println(name)` 的简写。\n2. **精简代码**：\n   ○ 提高了可读性并减少了模板代码。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 7. 组合函数式接口\n\n#### 代码示例：\n\n```java\n\
  import java.util.function.Predicate;\n\npublic class LambdaCombiningPredicates {\n\
  \    public static void main(String[] args) {\n        Predicate<Integer> isEven\
  \ = n -> n % 2 == 0;\n        Predicate<Integer> isPositive = n -> n > 0;\n    \
  \    int number = 4;\n        if (isEven.and(isPositive).test(number)) {\n     \
  \       System.out.println(number + \" is positive and even.\");\n        }\n  \
  \  }\n}\n```\n\n#### 输出：\n```\n4 is positive and even.\n```\n\n#### 解释：\n\n1. **组合谓词**：\n\
  \   ○ `and()` 组合了 `isEven` 和 `isPositive` 条件。\n2. **声明式条件**：\n   ○ 组合后的条件提高了可读性。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### Lambda 表达式的优势\n\n1. **简洁性**：\n  \
  \ ○ 消消了匿名类的模板代码。\n2. **提高可读性**：\n   ○ 行内行为定义增强了代码的清晰度。\n3. **函数式编程**：\n   ○ 允许使用\
  \ `Streams` 和声明式编码风格。\n4. **高效使用函数式接口**：\n   ○ 简化了常见行为的实现。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n## 最佳实践\n\n1. **使用函数式接口**：\n   ○ 确保目标接口是函数式接口。\n2. **保持 Lambda 简单**：\n   ○ 避免在\
  \ Lambda 表达式内部编写复杂的逻辑。\n3. **尽可能使用方法引用**：\n   ○ 使用方法引用以提高可读性。\n4. **避免副作用**：\n \
  \  ○ 保持 Lambda 表达式无状态以获得更好的维护性。\n\n![Rectangle Rectangle](img/image.png)\n\n###\
  \ 总结\n\n● **语法**：\n  ○ `(parameters) -> { body }` 是 Lambda 表达式的基本语法。\n● **函数式接口**：\n\
  \  ○ 与 `Runnable`、`Predicate`、`Function` 等接口无缝衔接。\n● **集成**：\n  ○ Lambda 增强了 Java\
  \ 的 `Streams API` 用于函数式编程。\n● **示例**：\n  ○ 包含了排序、过滤、自定义行为和方法引用。\n\nLambda 表达式是现代\
  \ Java 的基石，使其更具表达力且简洁。它们允许开发者在保留 Java 面向对象根的同时拥抱函数式编程。\n\n### 函数式接口\n\nJava 中的函数式接口是包含恰好一个抽象方法的接口。这些接口作为\
  \ Java 8 引入的 Lambda 表达式和方法引用的基础，实现了函数式编程结构。\n\n函数式接口可以有其他方法，例如 `default` 和 `static`\
  \ 方法，但它们必须仅有一个抽象方法才能资格成为函数式接口。\n\n![Rectangle Rectangle](img/image.png)\n\n### 函数式接口的特征\n\
  \n1. **单个抽象方法 (SAM)**：\n   ○ 函数式接口也被称为 SAM 接口，因为它们只有一个抽象方法。\n2. **@FunctionalInterface\
  \ 注解**：\n   ○ 虽然强制，但强烈建议使用 `@FunctionalInterface` 注解函数式接口，以在编译时强制执行约束。\n3. **Lambda\
  \ 支持**：\n   ○ 函数式接口可以使用 Lambda 表达式实现以获得简洁的代码。\n4. **预定义接口**：\n   ○ Java 在 `java.util.function`\
  \ 中提供了许多函数式接口。\n\n![Rectangle Rectangle](img/image.png)\n\n### 定义函数式接口\n\n#### 代码示例：\n\
  \n```java\n@FunctionalInterface\ninterface Greeting {\n    void sayHello(String\
  \ name);\n}\n```\n\n#### 解释：\n\n1. **单个抽象方法**：\n   ○ 接口有一个抽象方法 `sayHello`。\n2. **@FunctionalInterface\
  \ 注解**：\n   ○ 确保不会意外添加抽象方法。\n\n![Rectangle Rectangle](img/image.png)\n\n### 内置函数式接口\n\
  \n`java.util.function` 包提供了许多预定义的函数式接口，分类如下：\n\n| 接口 | 方法 | 描述 |\n| :--- | :---\
  \ | :--- |\n| `Predicate<T>` | `boolean test(t)` | 表示条件。返回真或假。 |\n| `Function<T,\
  \ R>` | `R apply(t)` | 将类型 `T` 转换为类型 `R`。 |\n| `Consumer<T>` | `void accept(t)`\
  \ | 对类型 `T` 执行操作。 |\n| `Supplier<T>` | `T get()` | 提供类型为 `T` 的值。 |\n| `UnaryOperator<T>`\
  \ | `T apply(t)` | `Function<T, T>` 的特化，输入输出类型 `T` 相同。 |\n| `BinaryOperator<T>`\
  \ | `T apply(t1, t2)` | `BiFunction<T, T, T>` 的特化，输入输出类型均为 `T`。 |\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 1. 自定义函数式接口示例\n\n#### 代码示例：\n\n```java\n@FunctionalInterface\n\
  interface Calculator {\n    int operate(int a, int b);\n}\n\npublic class FunctionalInterfaceExample\
  \ {\n    public static void main(String[] args) {\n        // 使用 lambda 表达式\n  \
  \      Calculator addition = (a, b) -> a + b;\n        Calculator subtraction =\
  \ (a, b) -> a - b;\n        System.out.println(\"Addition: \" + addition.operate(10,\
  \ 5));\n        System.out.println(\"Subtraction: \" + subtraction.operate(10, 5));\n\
  \    }\n}\n```\n\n#### 解释：\n\n1. **Lambda 表达式**：\n   ○ 为 `operate` 方法提供了简洁的实现。\n\
  2. **复用性**：\n   ○ 同一个接口用于不同的操作。\n\n### 2. 使用预定义函数式接口\n\n#### Predicate（条件检查）\n\n\
  #### 代码示例：\n\n```java\nimport java.util.function.Predicate;\n\npublic class PredicateExample\
  \ {\n    public static void main(String[] args) {\n        Predicate<Integer> isEven\
  \ = n -> n % 2 == 0;\n        System.out.println(\"Is 4 even? \" + isEven.test(4));\n\
  \        System.out.println(\"Is 7 even? \" + isEven.test(7));\n    }\n}\n```\n\n\
  #### 输出：\n```\nIs 4 even? true\nIs 7 even? false\n```\n\n#### Function（转换）\n\n####\
  \ 代码示例：\n\n```java\nimport java.util.function.Function;\n\npublic class FunctionExample\
  \ {\n    public static void main(String[] args) {\n        Function<String, Integer>\
  \ stringLength = str -> str.length();\n        System.out.println(\"Length of 'hello':\
  \ \" + stringLength.apply(\"hello\"));\n        System.out.println(\"Length of 'functional\
  \ interfaces': \" + stringLength.apply(\"functional interfaces\"));\n    }\n}\n\
  ```\n\n#### 输出：\n```\nLength of 'hello': 5\nLength of 'functional interfaces': 21\n\
  ```\n\n\n\n\n```java\nConsumer<String> printMessage = message -> System.out.println(\"\
  Message: \" + message);\n\nprintMessage.accept(\"Hello, world!\");\n\nprintMessage.accept(\"\
  Functional programming in Java.\");\n```\n\n#### 输出:\nMessage: Hello, world!\nMessage:\
  \ Functional programming in Java.\n\n![Rectangle Rectangle](img/image.png)\n\n####\
  \ Supplier (值生成)\n\n#### 代码示例:\n\n```java\nimport java.util.function.Supplier;\n\
  \npublic class SupplierExample {\n\n    public static void main(String[] args) {\n\
  \        Supplier<Double> randomValue = () -> Math.random();\n        System.out.println(\"\
  Random Value 1: \" + randomValue.get());\n        System.out.println(\"Random Value\
  \ 2: \" + randomValue.get());\n    }\n}\n```\n\n#### 输出:\nRandom Value 1: 0.123456789\n\
  Random Value 2: 0.987654321\n\n![Rectangle Rectangle](img/image.png)\n\n### 3. 组合函数接口\n\
  \n#### 代码示例:\n\n```java\nimport java.util.function.Function;\nimport java.util.function.Predicate;\n\
  \npublic class CombiningFunctionalInterfaces {\n\n    public static void main(String[]\
  \ args) {\n        Predicate<Integer> isPositive = n -> n > 0;\n        Function<Integer,\
  \ Integer> square = n -> n * n;\n        int number = 4;\n        if (isPositive.test(number))\
  \ {\n            System.out.println(\"Square of \" + number + \": \" + square.apply(number));\n\
  \        }\n\n        int negativeNumber = -3;\n        if (!isPositive.test(negativeNumber))\
  \ {\n            System.out.println(negativeNumber + \" is not positive.\");\n \
  \       }\n    }\n}\n```\n\n#### 输出:\nSquare of 4: 16\n-3 is not positive.\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 关于函数接口的关键点\n\n1. **默认方法和静态方法**:\n   - 函数接口可以有默认方法和静态方法，但只能有一个抽象方法。\n\
  \n2. **与 Lambda 的集成**:\n   - Lambda 表达式简化了函数接口的实现。\n\n3. **可重用工具类**:\n   - `java.util.function`\
  \ 包提供了丰富的预定义接口。\n\n4. **自定义接口**:\n   - 开发者可以使用 `@FunctionalInterface` 注解来定义自己的函数接口。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n## 最佳实践\n\n1. **使用预定义接口**:\n   - 优先使用内置函数接口而非自定义接口，以提高代码的一致性和可读性。\n\
  \n2. **保持 Lambda 简单**:\n   - 避免在 lambda 表达式中编写复杂的逻辑；如果需要，使用方法引用或辅助方法。\n\n3. **注解函数接口**:\n\
  \   - 使用 `@FunctionalInterface` 来强制执行单方法约束。\n\n4. **避免副作用**:\n   - 确保 lambda 和函数接口是无状态且无副作用的。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\n- **定义**:\n  - 函数接口只有一个抽象方法并支持\
  \ lambda。\n- **预定义接口**:\n  - 常见示例包括 `Predicate`、`Function`、`Consumer` 和 `Supplier`。\n\
  - **自定义接口**:\n  - 允许开发者定义可重用且具表现性的函数结构。\n- **集成**:\n  - 与 lambda 表达式、流和 Java 集合框架无缝集成。\n\
  \n函数接口是现代 Java 编程的基石，实现了简洁的函数式编程风格。\n\n## 注解 (Annotations)\n\nJava 中的注解为编译器、JVM\
  \ 或工具提供了关于代码的元数据。它们不会影响程序的执行，但为处理代码提供了指令。注解从 Java 5 开始引入，用于编译器检查、运行时处理和代码生成等目的。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 注解的关键特征\n\n1. **元数据提供者**:\n   - 注解提供了关于类、方法、变量等的元数据。\n\
  2. **可定制**:\n   - 开发者可以创建自己的注解。\n3. **注解处理器**:\n   - 工具和框架可以在编译时或运行时处理注解，以执行特定操作。\n\
  4. **与框架集成**:\n   - 广泛应用于 Spring、Hibernate 和 JUnit 等框架。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 内置注解\n\n| 注解 | 描述 |\n| :--- | :--- |\n| `@Override` | 表示方法重写了父类方法。 |\n| `@Deprecated`\
  \ | 标记方法、类或字段为已废用。 |\n| `@SuppressWarnings` | 抑制特定问题的编译器警告。 |\n| `@FunctionalInterface`\
  \ | 确保接口恰好有一个抽象方法。 |\n| `@SafeVarargs` | 抑制可变参数操作的警告。 |\n| `@Retention` | 指定注解的保留时长（运行时、编译时等）。\
  \ |\n| `@Target` | 指定注解可以应用于哪些元素类型（类、方法等）。 |\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 1. 内置注解示例\n\n#### 代码示例:\n\n```java\nclass Parent {\n    @Deprecated\n    public\
  \ void oldMethod() {}\n}\n\nclass Child extends Parent {\n    @Override\n    public\
  \ void oldMethod() {\n        System.out.println(\"Overriding method.\");\n    }\n\
  }\n\npublic class BuiltInExample {\n    @SuppressWarnings(\"deprecation\")\n   \
  \ public static void main(String[] args) {\n        Child parent = new Child();\n\
  \        parent.oldMethod();\n    }\n}\n```\n\n#### 输出:\nOverriding method.\n\n\
  #### 解释:\n- `@Deprecated`: 将 `oldMethod` 标记为已废用，指示其不再使用。\n- `@Override`: 确保该方法重写了父类方法。\n\
  - `@SuppressWarnings`: 抑制关于使用废用方法的警告。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 2. 保留 (Retention) 和 目标 (Target) 注解\n\n注解可以使用 `@Retention` 和 `@Target` 指定它们的保留时长以及应用位置。\n\
  \n#### 代码示例:\n\n```java\nimport java.lang.annotation.ElementType;\nimport java.lang.annotation.Retention;\n\
  import java.lang.annotation.RetentionPolicy;\nimport java.lang.annotation.Target;\n\
  \n@Retention(RetentionPolicy.RUNTIME)\n@Target({ElementType.METHOD, ElementType.TYPE})\n\
  @interface CustomAnnotation {\n    String value();\n}\n\n@CustomAnnotation(value\
  \ = \"Class Annotation\")\nclass AnnotatedClass {\n    @CustomAnnotation(value =\
  \ \"Method Annotation\")\n    public void annotatedMethod() {\n        System.out.println(\"\
  This method is annotated.\");\n    }\n}\n\npublic class RetentionTargetExample {\n\
  \    public static void main(String[] args) throws Exception {\n        // 获取类注解\n\
  \        CustomAnnotation classAnnotation = AnnotatedClass.class.getAnnotation(CustomAnnotation.class);\n\
  \        System.out.println(\"Class Annotation: \" + classAnnotation.value());\n\
  \n        // 获取方法注解\n        CustomAnnotation methodAnnotation = AnnotatedClass.class\n\
  \                .getMethod(\"annotatedMethod\")\n                .getAnnotation(CustomAnnotation.class);\n\
  \        System.out.println(\"Method Annotation: \" + methodAnnotation.value());\n\
  \    }\n}\n```\n\n#### 输出:\nClass Annotation: Class Annotation\nMethod Annotation:\
  \ Method Annotation\n\n#### 解释:\n- `@Retention`: `RUNTIME` 表示注解在运行时可以通过可用。\n- `@Target`:\
  \ 指定注解只能应用于类和方法。\n\n![Rectangle Rectangle](img/image.png)\n\n### 3. 创建自定义注解\n\n\
  #### 代码示例:\n\n```java\nimport java.lang.annotation.Retention;\nimport java.lang.annotation.RetentionPolicy;\n\
  \n@Retention(RetentionPolicy.RUNTIME)\n@interface Info {\n    String author();\n\
  \    String date();\n    int version() default 1;\n}\n\n@Info(author = \"Alice\"\
  , date = \"2023-12-03\", version = 2)\npublic class CustomAnnotationExample {\n\
  \    public static void main(String[] args) {\n        Info annotation = CustomAnnotationExample.class.getAnnotation(Info.class);\n\
  \        System.out.println(\"Author: \" + annotation.author());\n        System.out.println(\"\
  Date: \" + annotation.date());\n        System.out.println(\"Version: \" + annotation.version());\n\
  \    }\n}\n```\n\n#### 输出:\nAuthor: Alice\nDate: 2023-12-03\nVersion: 2\n\n####\
  \ 解释:\n- **默认值**: 注解元素在未指定时可以拥有默认值。\n\n\n\n\n\n`version` 属性有一个默认值，因此在注解中使用时是可选的。\n\
  \n### 1. 保留策略 (Retention):\n\n- 注解在运行时被保留，允许通过反射访问。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 4. 标记注解 (Marker Annotations)\n\n标记注解是不带有任何属性的注解，用作标记或标志位。\n\n#### 代码示例：\n\n\
  ```java\nimport java.lang.annotation.ElementType;\nimport java.lang.annotation.Retention;\n\
  import java.lang.annotation.RetentionPolicy;\nimport java.lang.annotation.Target;\n\
  \n@Retention(RetentionPolicy.RUNTIME)\n@Target(ElementType.METHOD)\n@interface Marker\
  \ {}\n\nclass MarkerDemo {\n    @Marker\n    public void markedMethod() {\n    \
  \    System.out.println(\"This method is marked.\");\n    }\n}\n\npublic class MarkerAnnotationExample\
  \ {\n    public static void main(String[] args) throws Exception {\n        if (MarkerDemo.class.getMethod(\"\
  markedMethod\").isAnnotationPresent(Marker.class)) {\n            System.out.println(\"\
  Marker annotation is present.\");\n        }\n    }\n}\n```\n\n#### 输出：\n\nMarker\
  \ annotation is present.\n\n#### 解释：\n\n1. **标记注解**：\n   - 用于指示某个方法被标记为具有特殊行为。\n\
  2. **反射**：\n   - 在运行时检查注解是否存在。\n\n![Rectangle Rectangle](img/image.png)\n\n### 5.\
  \ 可重复注解 (Repeatable Annotations)\n\nJava 8 引入了可重复注解，允许将同一个注解多次应用到单个元素上。\n\n####\
  \ 代码示例：\n\n```java\nimport java.lang.annotation.Repeatable;\nimport java.lang.annotation.Retention;\n\
  import java.lang.annotation.RetentionPolicy;\n\n@Retention(RetentionPolicy.RUNTIME)\n\
  @Repeatable(Schedules.class)\n@interface Schedule {\n    String day();\n}\n\n@Retention(RetentionPolicy.RUNTIME)\n\
  @interface Schedules {\n    Schedule[] value();\n}\n\n@Schedule(day = \"Monday\"\
  )\n@Schedule(day = \"Wednesday\")\n@Schedule(day = \"Friday\")\nclass RepeatableExample\
  \ {}\n\npublic class RepeatableAnnotationExample {\n    public static void main(String[]\
  \ args) {\n        Schedule[] schedules = RepeatableExample.class.getAnnotationsByType(Schedule.class);\n\
  \        for (Schedule schedule : schedules) {\n            System.out.println(\"\
  Day: \" + schedule.day());\n        }\n    }\n}\n```\n\n#### 输出：\n\nDay: Monday\n\
  Day: Wednesday\nDay: Friday\n\n#### 解释：\n\n1. **可重复注解**：\n   - 使用 `@Repeatable`\
  \ 和容器注解（`@Schedules`）定义。\n2. **反射**：\n   - 使用 `getAnnotationsByType()` 获取注解的所有实例。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 6. 元注解 (Meta-Annotations)\n\n元注解应用于其他注解的注解，用于定义它们的行为。\n\
  \n| 元注解 | 说明 |\n| :--- | :--- |\n| `@Retention` | 指定注解保留的时间（例如 `SOURCE`、`CLASS`、`RUNTIME`）。\
  \ |\n| `@Target` | 指定注解可以应用的位置（例如类、方法、字段）。 |\n| `@Documented` | 表示该注解应该包含在 Javadoc\
  \ 中。 |\n| `@Inherited` | 允许注解被子类继承。 |\n| `@Repeatable` | 允许注解在同一个元素上重复出现。 |\n\n\
  ![Rectangle Rectangle](img/image.png)\n\n### 注解的优势\n\n1. **提高代码清晰度**：\n   - 提供关于代码元素行为的元数据。\n\
  2. **工具集成**：\n   - 框架和工具（如 `Spring`、`Hibernate`）使用注解进行配置。\n3. **运行时处理**：\n   - 实现动态行为和代码生成。\n\
  4. **减少样板代码**：\n   - 用代码内注解替换外部配置文件。\n\n![Rectangle Rectangle](img/image.png)\n\n\
  ## 最佳实践\n\n1. **使用描述性名称**：\n   - 为自定义注解定义有意义的名称。\n2. **利用内置注解**：\n   - 尽可能使用 `@Override`\
  \ 和 `@Deprecated` 等标准注解。\n3. **保留策略**：\n   - 根据用途设置合适的保留策略（`RUNTIME`、`CLASS` 或 `SOURCE`）。\n\
  4. **避免过度使用**：\n   - 审慎使用注解，以防止代码冗余并维护可读性。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 总结\n\n- **注解**：\n  - 为编译器、工具或框架提供元数据。\n- **内置注解**：\n  - 包括 `@Override`、`@Deprecated`、`@FunctionalInterface`\
  \ 等。\n- **自定义注解**：\n  - 允许开发者定义复用的元数据。\n- **可重复注解**：\n  - 允许多次应用同一个注解。\n- **元注解**：\n\
  \  - 控制注解的行为和适用性。\n\n\n\n\n\n日期：2023-12-03\n\n版本：2\n\n#### 解释：\n\n1. 多重属性：\n<bdi>○</bdi>`Info`\
  \ 注解有三个属性：`author`、`date` 和 `version`。\n\n2. 默认值：\n<bdi>○</bdi>如果没有指定 `version`，则使用默认值\
  \ `1`。\n\n![Rectangle Rectangle](img/image.png)\n\n### 3. 限制注解目标\n\n#### 代码示例：\n\
  \n```java\nimport java.lang.annotation.ElementType;\nimport java.lang.annotation.Retention;\n\
  import java.lang.annotation.RetentionPolicy;\nimport java.lang.annotation.Target;\n\
  \n@Retention(RetentionPolicy.RUNTIME)\n@Target({ElementType.FIELD, ElementType.METHOD})\
  \ // 将用法限制在字段和方法\n@interface FieldMethodAnnotation {\n    String description();\n\
  }\n\npublic class TargetAnnotationExample {\n    @FieldMethodAnnotation(description\
  \ = \"Annotated Field\")\n    private String field;\n\n    @FieldMethodAnnotation(description\
  \ = \"Annotated Method\")\n    public void annotatedMethod() {\n        System.out.println(\"\
  Annotated Method.\");\n    }\n\n    public static void main(String[] args) throws\
  \ Exception {\n        TargetAnnotationExample example = new TargetAnnotationExample();\n\
  \        FieldMethodAnnotation fieldAnnotation = TargetAnnotationExample.class\n\
  \            .getDeclaredField(\"field\")\n            .getAnnotation(FieldMethodAnnotation.class);\n\
  \        System.out.println(\"Field Annotation: \" + fieldAnnotation.description());\n\
  \n        FieldMethodAnnotation methodAnnotation = TargetAnnotationExample.class\n\
  \            .getMethod(\"annotatedMethod\")\n            .getAnnotation(FieldMethodAnnotation.class);\n\
  \        System.out.println(\"Method Annotation: \" + methodAnnotation.description());\n\
  \    }\n}\n```\n\n#### 输出：\n```\nField Annotation: Annotated Field\nMethod Annotation:\
  \ Annotated Method\n```\n\n#### 解释：\n\n1. @Target:\n<bdi>○</bdi>将注解的使用限制在字段和方法。\n\
  \n2. 反射：\n<bdi>○</bdi>访问字段和方法上的注解。\n\n![Rectangle Rectangle](img/image.png)\n\n\
  ### 4. 标记注解\n\n标记注解没有属性，充当标记位。\n\n#### 代码示例：\n\n```java\nimport java.lang.annotation.ElementType;\n\
  import java.lang.annotation.Retention;\nimport java.lang.annotation.RetentionPolicy;\n\
  import java.lang.annotation.Target;\n\n@Retention(RetentionPolicy.RUNTIME)\n@Target(ElementType.METHOD)\n\
  @interface Marker {}\n\nclass MarkerExample {\n    @Marker\n    public void markedMethod()\
