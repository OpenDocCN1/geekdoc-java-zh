  \ 异常处理是一种处理运行时错误的机制，确保程序的正常流程。异常是中断程序执行的事件。Java 提供了健壮的特性来优雅地处理这些异常。\n\n### 1. 异常处理的核心概念\n\
  \n#### 什么是异常？\n\n异常是程序执行过程中发生的非预期或意外的事件。\n示例：除以零、无效的索引访问。\n\n#### 什么是异常处理？\n\n通过捕获和解决异常来响应异常，防止程序异常终止。\n\
  \n#### 异常层次结构\n\n所有异常的根类是 `Throwable`。\n`Throwable` 有两个子类：\n1. `Exception`：可恢复的问题（例如\
  \ `IOException`）。\n2. `Error`：不可恢复的问题（例如 `OutOfMemoryError`, `StackOverflowError`）。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 2. 异常处理关键字\n\n| 关键字 | 目的 |\n| :---\
  \ | :--- |\n| `try` | 定义一个测试异常的代码块。 |\n| `catch` | 定义处理异常的代码块。 |\n| `finally` |\
  \ 定义无论异常是否被处理都会执行的代码块。 |\n| `throw` | 用于显式地抛出异常。 |\n| `throws` | 声明方法可能抛出的异常，允许调用者处理它们。\
  \ |\n\n![Rectangle Rectangle](img/image.png)\n\n### 3. 基础结构\n\n```java\ntry {\n\
  \    // 可能抛出异常的代码\n} catch (ExceptionType1 e1) {\n    // 处理 ExceptionType1\n} catch\
  \ (ExceptionType2 e2) {\n    // 处理 ExceptionType2\n} finally {\n    // 始终执行的代码（可选）\n\
  }\n```\n\n![Rectangle Rectangle](img/image.png)\n\n### 4. 异常类型\n\n#### 异常\n\n在编译时检查。\n\
  示例：`IOException`, `SQLException`。\n\n#### 非检异常\n\n在运行时发生（编译时不检查）。\n示例：`ArithmeticException`,\
  \ `NullPointerException`。\n\n![Rectangle Rectangle](img/image.png)\n\n### 5. 代码示例\n\
  \n#### 示例 1：处理 ArithmeticException\n\n```java\npublic class ArithmeticExceptionExample\
  \ {\n    public static void main(String[] args) {\n        try {\n            int\
  \ result = 10 / 0; // 这将抛出 ArithmeticException\n            System.out.println(\"\
  Result: \" + result);\n        } catch (ArithmeticException e) {\n            System.out.println(\"\
  Error: 不允许除零.\");\n        } finally {\n            System.out.println(\"执行完成.\"\
  );\n        }\n    }\n}\n```\n\n#### 输出:\nError: 不允许除零。\n执行完成。\n\n#### 解析:\n1. `try`\
  \ 块尝试除以零，抛出 `ArithmeticException`。\n2. `catch` 块处理异常并打印错误信息。\n3. `finally` 块无论是否发生异常都会执行。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n#### 示例 2：处理多个异常\n\n```java\npublic class\
  \ MultipleExceptionsExample {\n    public static void main(String[] args) {\n  \
  \      try {\n            int[] numbers = {1, 2, 3};\n            System.out.println(numbers[5]);\
  \ // 这将抛出 ArrayIndexOutOfBoundsException\n        } catch (ArithmeticException e)\
  \ {\n            System.out.println(\"捕获 Arithmetic 异常.\");\n        } catch (ArrayIndexOutOfBoundsException\
  \ e) {\n            System.out.println(\"捕获索引越界异常.\");\n        } finally {\n  \
  \          System.out.println(\"执行完成.\");\n        }\n    }\n}\n```\n\n#### 输出:\n\
  捕获索引越界异常。\n执行完成。\n\n#### 解析:\n1. `try` 块尝试越界访问，抛出 `ArrayIndexOutOfBoundsException`。\n\
  2. `catch` 块处理特定的异常。\n3. `finally` 块无论是否发生异常都会执行。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 示例 3：使用 throw\n\n```java\npublic class ThrowExample {\n    public static\
  \ void validateAge(int age) {\n        if (age < 18) {\n            throw new IllegalArgumentException(\"\
  年龄必须在 18 岁及以上。\");\n        }\n        System.out.println(\"年龄有效.\");\n    }\n\n\
  \    public static void main(String[] args) {\n        try {\n            validateAge(15);\n\
  \        } catch (IllegalArgumentException e) {\n            System.out.println(\"\
  捕获异常: \" + e.getMessage());\n        }\n    }\n}\n```\n\n#### 输出:\n捕获异常: 年龄必须在 18\
  \ 岁及以上。\n\n#### 解析:\n1. `validateAge` 方法在年龄小于 18 岁时抛出一个新的 `IllegalArgumentException`。\n\
  2. `main` 方法捕获该异常并打印消息。\n\n#### 示例 4：使用 throws\n\n```java\nimport java.io.BufferedReader;\n\
  import java.io.FileReader;\nimport java.io.IOException;\n\npublic class ThrowsExample\
  \ {\n    public static void readFile() throws IOException {\n        BufferedReader\
  \ reader = new BufferedReader(new FileReader(\"nonexistent.txt\"));\n        System.out.println(reader.readLine());\n\
  \        reader.close();\n    }\n\n    public static void main(String[] args) {\n\
  \        try {\n            readFile();\n        } catch (IOException e) {\n   \
  \         System.out.println(\"捕获 IOException: \" + e.getMessage());\n        }\n\
  \    }\n}\n```\n\n#### 输出:\n捕获 IOException: nonexistent.txt (找不到文件或目录)\n\n#### 解析:\n\
  1. `readFile` 方法声明了 `throws IOException`，因为它可能抛出异常。\n2. 调用者（`main`）通过 `try-catch`\
  \ 块处理该异常。\n\n### 6. 自定义异常\n\n自定义异常允许开发者定义应用程序特定的错误处理。\n\n#### 代码示例：\n\n```java\n\
