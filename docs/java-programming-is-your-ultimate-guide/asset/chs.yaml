  \ (MarkerExample.class.getMethod(\"markedMethod\").isAnnotationPresent(Marker.class))\
  \ {\n            System.out.println(\"Marker annotation is present.\");\n      \
  \  }\n    }\n}\n```\n\n#### 输出：\n```\nMarker annotation is present.\n```\n\n####\
  \ 解释：\n\n1. 标记注解：\n<bdi>○</bdi>充当标记位，不带任何属性。\n\n2. 反射：\n<bdi>○</bdi>检查注解是否存在。\n\n\
  ![Rectangle Rectangle](img/image.png)\n\n### 5. 可重复注解\n\nJava 8 引入了可重复注解，允许多次应用同一种注解。\n\
  \n#### 代码示例：\n\n```java\nimport java.lang.annotation.Repeatable;\nimport java.lang.annotation.Retention;\n\
  import java.lang.annotation.RetentionPolicy;\n\n@Retention(RetentionPolicy.RUNTIME)\n\
  @Repeatable(Schedules.class)\n@interface Schedule {\n    String day();\n}\n\n@Retention(RetentionPolicy.RUNTIME)\n\
  @interface Schedules {\n    Schedule[] value();\n}\n\n@Schedule(day = \"Monday\"\
  )\n@Schedule(day = \"Wednesday\")\n@Schedule(day = \"Friday\")\nclass RepeatableAnnotationExample\
  \ {}\n\npublic class RepeatableDemo {\n    public static void main(String[] args)\
