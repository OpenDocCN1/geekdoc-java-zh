  \n## Android 中的 Java\nJava 是开发 Android 应用的主要语言之一。它是 Android 开发的首个官方语言，由于其简单、健壮以及在\
  \ Android 生态中的广泛支持，目前仍被广泛使用。\n\n![Rectangle Rectangle](img/image.png)\n\n### 为什么用\
  \ Java 开发 Android\n- 特定框架：\n  Java 与 Android SDK 和 API 无缝集成。\n- 丰富的库：\n  提供了大量用于\
  \ UI、数据存储、网络通信和媒体的库。\n- 面对象编程：\n  鼓励模块化、可重用和易维护的代码。\n- 社区支持：\n  庞大的社区确保了获取教程、库和工具。\n\
  - 兼容性：\n  Java 允许支持旧版本的 Android，从而扩大应用的使用范围。\n\n### 配置 Android 开发环境\n#### 1. 安装\
  \ Android Studio\n\n\n\n\n\n- Android Studio 是 Android 开发的官方集成开发环境 (IDE)。\n- 从 [Android\
  \ Developers](https://developer.android.com/studio) 下载 [ ](https://developer.android.com/studio)。\n\
  \n## 2. 配置 SDK 和工具\n\n- 通过 Android Studio 中的 `SDK Manager` 安装 Android SDKs、工具和模拟器设备。\n\
  \n## 3. 创建新的 Android 项目\n\n- 选择一个项目模板（例如，`Empty Activity`）。\n- 将编程语言设为 `Java`。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 理解 Android 应用结构\n\n一个 Android 应用由以下关键组件组成：\n\
  \n1. Activities（活动）：\n   - 代表应用的界面。\n   - 继承 `Activity` 类并管理应用的 UI 和交互。\n2. Fragments（碎片）：\n\
  \   - Activity 内部的模块化 UI 部分。\n3. Layouts（布局）：\n   - 定义 UI 结构的 `XML` 文件（例如 `activity_main.xml`）。\n\
  4. `AndroidManifest.xml`：\n   - 描述应用的配置、权限和组件。\n5. Gradle 构建文件：\n   - `build.gradle`\
  \ 文件管理依赖和构建配置。\n\n![Rectangle Rectangle](img/image.png)\n\n### 基础示例：Hello World\
  \ 应用\n\n#### 1. MainActivity.java\n\n```java\npackage com.example.helloworld;\n\n\
