  \ \" + e.getMessage());\n        }\n    }\n}\n```\n\n\n\n\n\n| 定义 | 编译时检查。 | 运行时发生（不检查）。\
  \ |\n| :--- | :--- | :--- |\n| 示例 | `IOException`, `SQLException`。 | `ArithmeticException`,\
  \ `NullPointerException`。 |\n| 声明 | 必须用 `throws` 声明。 | 不需要声明。 |\n| 可恢复性 | 通常可以恢复。\
  \ | 通常表示错误。 |\n\n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\n<bdi>●</bdi>关键字：`try`,\
  \ `catch`, `finally`, `throw`, `throws`。\n\n<bdi>○</bdi>异常类型：\n\n<bdi>○</bdi>检查异常（编译时）和非检查异常（运行时）。\n\
  \n<bdi>●</bdi>自定义异常：\n\n<bdi>○</bdi>用于特定的应用程序场景。\n\n<bdi>●</bdi>最佳实践：\n\n<bdi>○</bdi>捕获特定异常，使用\
  \ `finally` 进行清理，并避免静默失败。\n\n## Java 集合框架\n\nJava 集合框架是一个用于存储和操作对象组的统一架构。它提供了几个接口、类和算法来高效地管理对象集合。以下是概述：\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 1. 核心概念\n\n<bdi>●</bdi>集合：一组对象（元素），例如列表、集合或队列。\n\
  \n<bdi>●</bdi>框架组件：\n\n<bdi>○</bdi>接口：定义抽象数据类型（例如 `List`, `Set`, `Map`）。\n\n<bdi>○</bdi>实现类：实现接口的具体类（例如\
  \ `ArrayList`, `HashSet`, `HashMap`）。\n\n<bdi>○</bdi>算法：由 `Collections` 类提供的工具方法（例如\
  \ `sort`, `shuffle`）。\n\n![Rectangle Rectangle](img/image.png)\n\n### 2. 主要接口\n\n\
  #### a. Collection 接口\n大多数集合类型的根接口，其关键的子接口包括：\n\n<bdi>●</bdi>List：有序集合（例如 `ArrayList`,\
  \ `LinkedList`）。\n\n<bdi>●</bdi>Set：不允许重复元素的集合（例如 `HashSet`, `TreeSet`）。\n\n<bdi>●</bdi>Queue：用于在处理前保存元素的集合，通常遵循先先出（FIFO）顺序（例如\
  \ `PriorityQueue`）。\n\n<bdi>●</bdi>Deque：双端队列，允许在两端进行插入/删除（例如 `ArrayDeque`）。\n\n\
  #### b. Map 接口\n不是 `Collection` 的子类型。表示键值对：\n\n<bdi>●</bdi>实现类：`HashMap`, `TreeMap`,\
  \ `LinkedHashMap`。\n\n![Rectangle Rectangle](img/image.png)\n\n### 3. 关键类\n\n####\
  \ a. List 实现类\n1. `ArrayList`: <bdi>○</bdi>由动态数组支持。<bdi>○</bdi>随机访问快。<bdi>○</bdi>在中间插入/删除较慢。\n\
  2. `LinkedList`: <bdi>○</bdi>由双向链表支持。<bdi>○</bdi>在中间插入/删除快。<bdi>○</bdi>随机访问慢。\n\
  3. `Vector`: <bdi>○</bdi>`ArrayList` 的同步版本。\n4. `Stack`: <bdi>○</bdi>实现后先出（LIFO）行为的\
  \ `Vector` 子类。\n\n#### b. Set 实现类\n1. `HashSet`: <bdi>○</bdi>由哈希表支持。<bdi>○</bdi>不保证元素的顺序。\n\
  2. `LinkedHashSet`: <bdi>○</bdi>维护插入顺序。<bdi>○</bdi>由哈希表和链表支持。\n3. `TreeSet`: <bdi>○</bdi>由红黑树支持。<bdi>○</bdi>保持元素的排序状态。\n\
  \n#### c. Map 实现类\n1. `HashMap`: <bdi>○</bdi>由哈希表支持。<bdi>○</bdi>不保证顺序。\n2. `LinkedHashMap`:\
  \ <bdi>○</bdi>维护插入顺序。\n3. `TreeMap`: <bdi>○</bdi>由红黑树支持。<bdi>○</bdi>保持键的排序状态。\n\
  4. `Hashtable`: <bdi>○</bdi>旧的同步实现。\n\n#### d. Queue/Deque 实现类\n1. `PriorityQueue`:\
  \ <bdi>○</bdi>根据自然排序或比较器对元素进行排序。\n2. `ArrayDeque`: <bdi>○</bdi>用于 `Deque` 的可缩数组实现。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 4. 工具类\n1. `Collections`: 包含用于静态方法：\n\
  <bdi>○</bdi>排序 (`sort`)\n<bdi>○</bdi>搜索 (`binarySearch`)\n<bdi>○</bdi>同步集合 (`synchronizedList`)\n\
  <bdi>○</bdi>使集合变为不可变 (`unmodifiableList`)。\n2. `Arrays`: 包含将数组作为集合处理的静态方法。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 5. 框架架构\n\n<bdi>●</bdi>接口：定义 ADT（`Collection`,\
  \ `Set`, `Map`）。\n\n<bdi>●</bdi>抽象类：提供骨架实现（`AbstractList`, `AbstractSet`）。\n\n<bdi>●</bdi>具体类：提供实际实现（`ArrayList`）。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 6. 优点\n1. 它是可缩的数组。\n2. 允许重复元素。\n\
  3. 维护插入顺序。\n4. 支持通过索引随机访问。\n5. 不同步（可以使用 `synchronizedList` 进行同步）。\n\n### 7. 常用方法\n\
  - `add(E e)`：向列表添加元素。\n- `add(int index, E e)`：在指定索引添加元素。\n- `remove(Object o)`\
  \ 或 `remove(int index)`：按值或索引删除元素。\n- `get(int index)`：按索引获取元素。\n- `set(int index,\
  \ E e)`：替换索引处的元素。\n- `contains(Object o)`：检查列表是否包含特定元素。\n- `size()`：返回列表的大小。\n\n\
  ### 8. 示例代码\n\n```java\nimport java.util.ArrayList;\nimport java.util.Collections;\n\
  \npublic class ArrayListExample {\n    public static void main(String[] args) {\n\
  \        // 步骤 1：创建一个 ArrayList\n        ArrayList<String> fruits = new ArrayList<>();\n\
  \n        // 步骤 2：向 ArrayList 添加元素\n        fruits.add(\"Apple\");\n        fruits.add(\"\
  Banana\");\n        fruits.add(\"Cherry\");\n        fruits.add(\"Apple\"); // 重复\n\
  \n        // 步骤 3：访问元素\n        System.out.println(\"索引 1 元素: \" + fruits.get(1));\n\
  \n        // 步骤 4：修改元素\n        fruits.set(1, \"Blueberry\");\n        System.out.println(\"\
  修改索引 1 后: \" + fruits);\n\n        // 步骤 5：删除元素\n        fruits.remove(\"Apple\"\
  ); // 删除第一个匹配项\n        System.out.println(\"删除 'Apple' 后: \" + fruits);\n    }\n\
  }\n```\n\n\n\n\n```java\nboolean containsCherry = fruits.contains(\"Cherry\");\n\
  \nSystem.out.println(\"Does the list contain 'Cherry'? \" + containsCherry);\n\n\
  // Step 7: 排序 ArrayList\n\nCollections.sort(fruits);\n\nSystem.out.println(\"Sorted\
  \ ArrayList: \" + fruits);\n\n// Step 8: 获取 ArrayList 的大小\n\nSystem.out.println(\"\
  Size of the ArrayList: \" + fruits.size());\n\n}\n\n}\n```\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 代码解释\n\n创建 ArrayList：`ArrayList<String> fruits = new ArrayList<>();`\n\n创建了一个\
  \ `String` 类型的 `ArrayList`，允许存储字符串元素。\n\n添加元素：`fruits.add(\"Apple\");`\n`fruits.add(\"\
  Banana\");`\n`fruits.add(\"Cherry\");`\n`fruits.add(\"Apple\");`\n向 `ArrayList`\
  \ 添加元素。\n\n`ArrayList` 允许重复的 `\"Apple\"`。\n\n访问元素：`System.out.println(\"Element\
  \ at index 1: \" + fruits.get(1));`\n\n使用 `get()` 方法获取索引为 1 的元素。\n\n索引从 0 开始。\n\n\
  修改元素：`fruits.set(1, \"Blueberry\");`\n\n使用 `set()` 方法将索引为 1 的元素替换为 `\"Blueberry\"\
  `。\n\n删除元素：`fruits.remove(\"Apple\");`\n\n使用 `remove(Object)` 方法从列表中删除第一个 `\"Apple\"\
  `。\n\n检查元素：`boolean containsCherry = fruits.contains(\"Cherry\");`\n\n使用 `contains()`\
  \ 方法检查列表中是否存在 `\"Cherry\"`。\n\n排序 ArrayList：`Collections.sort(fruits);`\n\n使用 `Collections.sort()`\
  \ 按自然顺序排序列表元素。\n\n获取大小：`System.out.println(\"Size of the ArrayList: \" + fruits.size());`\n\
  \n使用 `size()` 获取列表中元素的数量。\n\n![Rectangle Rectangle](img/image.png)\n\n### 输出解释\n\
  \n#### 输出：\n索引 1：Banana\n修改索引 1：[Apple, Blueberry, Apple]\n移除 'Apple'：[Blueberry,\
  \ Apple]\n列表包含 'Cherry' 吗？true\n排序 ArrayList：[Apple, Cherry]\nArrayList 的大小：3\n\n\
  1. **索引 1：**\n   使用 `get(1)` 获取第二个元素是 \"Banana\"。\n2. **修改索引 1：**\n   \"Banana\"\
  \ 被替换为 \"Blueberry\"。列表变为：[Apple, Blueberry, Apple]。\n3. **移除 \"Apple\"：**\n   删除了第一个\
  \ \"Apple\"。列表变为：[Blueberry, Apple]。\n4. **检查 \"Cherry\"：**\n   列表中存在 \"Cherry\"\
  ，所以 `contains(\"Cherry\")` 返回 `true`。\n5. **排序 ArrayList：**\n   列表按字母顺序排序。最终顺序是：[Apple,\
  \ Cherry]。\n6. **ArrayList 的大小：**\n   排序后，列表包含三个元素，所以 `size()` 返回 3。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### ArrayList 的优点\n\n1. **动态调整大小**：随着元素的添加自动增长。\n\
  2. **易用**：提供了常用操作的内置方法。\n3. **随机访问**：使用索引快速检索元素。\n\n### ArrayList 的缺点\n\n1. **非线程安全**：使用\
  \ `Collections.synchronizedList()` 实现线程安全。\n2. **插入/删除慢**：在中间添加/删除元素可能会因为移动元素而开销较大。\n\
  \n## LinkedList\n\n`LinkedList` 是一种线性数据结构，元素（节点）通过指针连接。Java 在 `java.util` 包中提供了内置的\
  \ `LinkedList` 类，实现了 `List`、`Deque` 和 `Queue` 接口。\n\n与使用动态数组存储的 `ArrayList` 不同，`LinkedList`\
  \ 使用双链表结构。这种差异使得 `LinkedList` 在某些操作（如插入和删除）上更高。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### LinkedList 的特性\n\n1. **动态大小**：与数组不同，`LinkedList` 的大小不是固定的。\n2. **高效的插入/删除**：插入和删除比\
  \ `ArrayList` 快，特别是在开头或中间。\n3. **双向链**：每个节点包含指向上一个节点和下一个节点的指针。\n4. **实现多个接口**：实现了有序集合的\
  \ `List` 接口；实现了用于队列操作的 `Deque` 和 `Queue` 接口。\n5. **允许空元素**：与其他 `List` 实现类似，它支持 `null`\
  \ 元素。\n\n![Rectangle Rectangle](img/image.png)\n\n### 层次结构\n\n`LinkedList` 是 Java\
  \ 集合框架的一部分：\n`java.lang.Object`\n↳ `java.util.AbstractCollection`\n↳ `java.util.AbstractList`\n\
  ↳ `java.util.LinkedList`\n\n![Rectangle Rectangle](img/image.png)\n\n### 1. LinkedList\
  \ 的基本操作\n\n#### 代码示例：\n```java\nimport java.util.LinkedList;\n\npublic class LinkedListExample\
  \ {\n    public static void main(String[] args) {\n        // 创建一个 LinkedList\n\
  \        LinkedList<String> names = new LinkedList<>();\n        // 添加元素\n     \
  \   names.add(\"Alice\");\n        names.add(\"Bob\");\n        names.add(\"Charlie\"\
  );\n        System.out.println(\"Initial LinkedList: \" + names);\n        // 在开头添加元素\n\
  \        names.addFirst(\"Zara\");\n        System.out.println(\"After addFirst:\
  \ \" + names);\n        // 在末尾添加元素\n        names.addLast(\"Daisy\");\n        System.out.println(\"\
  After addLast: \" + names);\n    }\n}\n```\n\n#### 输出：\nInitial LinkedList：[Alice,\
  \ Bob, Charlie]\nAfter addFirst：[Zara, Alice, Bob, Charlie]\nAfter addLast：[Zara,\
  \ Alice, Bob, Charlie, Daisy]\n\n#### 解释：\n1. **添加元素**：`add()`、`addFirst()` 和 `addLast()`\
  \ 用于在不同位置插入元素。\n2. **删除元素**：`remove(\"Bob\")` 移除指定的元素。\n3. **访问元素**：`getFirst()`\
  \ 和 `getLast()` 获取第一个和最后一个元素。\n\n### 2. 遍历 LinkedList\n\n#### 代码示例：\n```java\nimport\
  \ java.util.LinkedList;\nimport java.util.Iterator;\n\npublic class LinkedListIteration\
  \ {\n    public static void main(String[] args) {\n        LinkedList<Integer> numbers\
  \ = new LinkedList<>();\n        numbers.add(10);\n        numbers.add(20);\n  \
  \      numbers.add(30);\n        numbers.add(40);\n        // 使用 for-each 循环\n \
  \       System.out.println(\"Using for-each loop:\");\n        for (int number :\
  \ numbers) {\n            System.out.println(number);\n        }\n        // 使用\
  \ Iterator\n        System.out.println(\"\\nUsing Iterator:\");\n        Iterator<Integer>\
  \ iterator = numbers.iterator();\n        while (iterator.hasNext()) {\n       \
  \     System.out.println(iterator.next());\n        }\n    }\n}\n```\n\n#### 输出：\n\
  Using for-each loop:\n10\n20\n30\n40\n\nUsing Iterator:\n10\n20\n30\n40\n\n####\
  \ 解释：\n1. **For-each 循环**：简化了实现 `Iterable` 的集合遍历。\n2. **Iterator**：提供了一种传统的遍历元素的方式，适用于并发修改。\n\
  \n### 3. 将 LinkedList 作为队列\n\n`LinkedList` 类实现了 `Deque` 和 `Queue` 接口，使其适用于类似队列的操作。\n\
  \n#### 代码示例：\n```java\nimport java.util.LinkedList;\n\npublic class LinkedListAsQueue\
  \ {\n    public static void main(String[] args) {\n        LinkedList<String> queue\
  \ = new LinkedList<>();\n        // 向队列添加元素\n        queue.offer(\"Task1\");\n \
  \       queue.offer(\"Task2\");\n        queue.offer(\"Task3\");\n        System.out.println(\"\
  Queue: \" + queue);\n        // 检查头部元素\n        System.out.println(\"Front Element:\
  \ \" + queue.peek());\n        // 处理并移除队列中的元素\n        while (!queue.isEmpty())\
  \ {\n            System.out.println(\"Processing: \" + queue.poll());\n        }\n\
  \        System.out.println(\"Queue after processing: \" + queue);\n    }\n}\n```\n\
  \n#### 输出：\nQueue: [Task1, Task2, Task3]\nFront Element: Task1\nProcessing: Task1\n\
  Processing: Task2\nProcessing: Task3\nQueue after processing: []\n\n#### 解释：\n1.\
  \ **offer()**：将元素添加到队列末尾。\n2. **peek()**：获取头部元素但不移除它。\n3. **poll()**：移除并返回头部元素。\n\
  \n\n\n\n○ 获取并移除首部元素。\n\n![Rectangle Rectangle](img/image.png)\n\n### 4. 将 LinkedList\
  \ 作为 Deque 使用\n\nDeque（双端队列）允许从两端添加或移除元素。\n\n#### 代码示例：\n\n```java\nimport java.util.LinkedList;\n\
  \npublic class LinkedListAsDeque {\n    public static void main(String[] args) {\n\
  \        LinkedList<String> deque = new LinkedList<>();\n        // 向两端添加元素\n  \
  \      deque.addFirst(\"Front\");\n        deque.addLast(\"Back\");\n        System.out.println(\"\
  Deque: \" + deque);\n        // 从两端移除元素\n        System.out.println(\"Removed from\
  \ front: \" + deque.removeFirst());\n        System.out.println(\"Removed from back:\
  \ \" + deque.removeLast());\n        System.out.println(\"Deque after removals:\
  \ \" + deque);\n    }\n}\n```\n\n#### 输出:\n```\nDeque: [Front, Back]\nRemoved from\
  \ front: Front\nRemoved from back: Back\nDeque after removals: []\n```\n\n#### 解释：\n\
  1. `addFirst()` 和 `addLast()`:\n   ○ 向队列的头部和末尾添加元素。\n2. `removeFirst()` 和 `removeLast()`:\n\
  \   ○ 从头部和末尾移除元素。\n\n![Rectangle Rectangle](img/image.png)\n\n### 5. 比较：LinkedList\
  \ vs ArrayList\n\n| 特性 | LinkedList | ArrayList |\n| :--- | :--- | :--- |\n| 数据结构\
  \ | 双向链表。 | 动态数组。 |\n| 插入/删除 | 频繁插入/删除时更快，特别是在开头或中间。 | 由于元素移动，较慢。 |\n| 访问时间 | 随机访问较慢（O(n)\
  \ 复杂度）。 | 随机访问较快（O(1) 复杂度）。 |\n| 内存占用 | 由于存在额外的指针，占用较高。 | 使用连续内存，占用较低。 |\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 6. 最佳实践与使用场景\n\n1. 何时使用 LinkedList：\n   ○ 在列表的开头或中间频繁插入和删除。\n\
  \   ○ 用作队列或双端队列。\n2. 何时避免使用 LinkedList：\n   ○ 需要频繁进行随机访问。\n   ○ 关注内存开销。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 总结\n\n● 主要方法：\n   ○ `add()`, `addFirst()`, `addLast()`,\
  \ `remove()`, `getFirst()`, `getLast()`。\n   ○ `offer()`, `poll()`, `peek()` 用于队列操作。\n\
  \   ○ `addFirst()` 和 `removeLast()` 用于双端队列操作。\n● 效率：\n   ○ 插入/删除更快。\n   ○ 与 `ArrayList`\
  \ 相比，随机访问较慢。## TreeSet\n\n`TreeSet` 是 Java `java.util` 包的一部分，是 Java 集合框架的成员。它实现了\
  \ `NavigableSet` 接口，该接口扩展了 `SortedSet`。`TreeSet` 以排序顺序（自然顺序或自定义顺序）存储元素，并确保没有重复。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### TreeSet 的关键特性\n1. 排序顺序：\n   ○ 按元素的自然顺序或由\
  \ `Comparator` 定义的自定义顺序维护元素。\n2. 唯一元素：\n   ○ 不允许重复元素。\n3. 平衡树：\n   ○ 内部使用红黑树存储元素，提供高效的性能。\n\
  4. 性能：\n   ○ `add`、`remove` 和 `search` 等操作需要 O(log n) 时间。\n5. NavigableSet 特性：\n\
  \   ○ 提供导航集合的方法（`higher`, `lower`, `ceiling`, `floor`）。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### TreeSet 类层次结构\n`java.lang.Object`\n↳ `java.util.AbstractCollection`\n↳ `java.util.AbstractSet`\n\
  ↳ `java.util.TreeSet`\n\n![Rectangle Rectangle](img/image.png)\n\n### 构造函数\n\n|\
  \ 构造函数 | 描述 |\n| :--- | :--- |\n| `TreeSet()` | 创建一个自然排序的空 `TreeSet`。 |\n| `TreeSet(Comparator<?\
  \ super E> comp)` | 创建一个带有自定义比较器的空 `TreeSet`。 |\n| `TreeSet(Collection<? extends\
  \ E> col)` | 创建一个包含指定集合元素的 `TreeSet`。 |\n| `TreeSet(SortedSet<E> set)` | 创建一个包含指定排序集合元素的\
  \ `TreeSet`。 |\n\n![Rectangle Rectangle](img/image.png)\n\n### 1. TreeSet 的基本操作\n\
  \n#### 代码示例：\n\n```java\nimport java.util.TreeSet;\n\npublic class TreeSetExample\
  \ {\n    public static void main(String[] args) {\n        TreeSet<Integer> numbers\
  \ = new TreeSet<>();\n        // 添加元素\n        numbers.add(50);\n        numbers.add(20);\n\
  \        numbers.add(10);\n        numbers.add(40);\n        numbers.add(30);\n\
  \        System.out.println(\"TreeSet: \" + numbers);\n        // 移除一个元素\n     \
  \   numbers.remove(20);\n        System.out.println(\"After removing 20: \" + numbers);\n\
  \        // 检查元素是否存在\n        System.out.println(\"Contains 30? \" + numbers.contains(30));\n\
  \        // 获取第一个和最后一个元素\n        System.out.println(\"First Element: \" + numbers.first());\n\
  \        System.out.println(\"Last Element: \" + numbers.last());\n    }\n}\n```\n\
  \n#### 输出:\n```\nTreeSet: [10, 20, 30, 40, 50]\nAfter removing 20: [10, 30, 40,\
  \ 50]\nContains 30? true\nFirst Element: 10\nLast Element: 50\n```\n\n#### 解释：\n\
  1. 排序顺序：\n   元素按自然顺序存储。\n2. 移除：\n   `remove(20)` 移除元素。\n3. 包含：\n   `contains(30)`\
  \ 检查是否存在。\n4. 第一个和最后一个：\n   `first()` 和 `last()` 分别获取元素。\n\n### 2. 带 Comparator\
  \ 的 TreeSet\n\n你可以使用 `Comparator` 来定义顺序。\n\n#### 代码示例：\n\n```java\nimport java.util.TreeSet;\n\
  import java.util.Comparator;\n\npublic class CustomComparator {\n    public static\
  \ void main(String[] args) {\n        TreeSet<Integer> numbers = new TreeSet<>(Comparator.reverseOrder());\n\
  \        numbers.add(10);\n        numbers.add(20);\n        numbers.add(30);\n\
  \        numbers.add(40);\n        System.out.println(\"TreeSet (reverse): \" +\
  \ numbers);\n    }\n}\n```\n\n#### 输出:\n```\nTreeSet (reverse): [40, 30, 20, 10]\n\
  ```\n\n#### 解释：\n1. 自定义比较器：\n   使用 `Comparator.reverseOrder()` 反转排序。\n\n### 3. NavigableSet\
  \ 方法\n\n`TreeSet` 提供了用于导航集合的方法。\n\n#### 代码示例：\n\n```java\nimport java.util.TreeSet;\n\
  \npublic class NavigableTreeSetExample {\n    public static void main(String[] args)\
  \ {\n        TreeSet<Integer> numbers = new TreeSet<>();\n        numbers.add(10);\n\
  \        numbers.add(20);\n        numbers.add(30);\n        numbers.add(40);\n\n\
  \        System.out.println(\"Higher than 25: \" + numbers.higher(25));\n      \
  \  System.out.println(\"Lower than 25: \" + numbers.lower(25));\n        System.out.println(\"\
  Ceiling of 25: \" + numbers.ceiling(25));\n        System.out.println(\"Floor of\
  \ 25: \" + numbers.floor(25));\n    }\n}\n```\n\n#### 输出:\n```\nHigher than 25:\
  \ 30\nLower than 25: 20\nCeiling of 25: 30\nFloor of 25: 20\n```\n\n#### 解释：\n1.\
  \ `higher(e)`：返回大于指定元素的最小元素。\n2. `lower(e)`：返回小于指定元素的最大元素。\n3. `ceiling(e)`：返回大于或等于指定元素的最小元素。\n\
  4. `floor(e)`：返回小于或等于指定元素的最大元素。\n\n\n\n\n\n| 性能 | 较慢 (添加/删除为 O(log n)) | 较快 (添加/删除为\
  \ O(1)) |\n| :--- | :--- | :--- |\n| 使用场景 | 当需要排序数据时。 | 当需要快速操作时。 |\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 6. 使用对象的 TreeSet\n\n你可以通过实现 `Comparable` 接口或使用\
  \ `Comparator` 在 `TreeSet` 中自定义对象。\n\n#### 代码示例：\n\n```java\nimport java.util.TreeSet;\n\
  \nclass Person implements Comparable<Person> {\n    String name;\n    int age;\n\
  \n    Person(String name, int age) {\n        this.name = name;\n        this.age\
  \ = age;\n    }\n\n    @Override\n    public int compareTo(Person other) {\n   \
  \     return Integer.compare(this.age, other.age);\n    }\n\n    @Override\n   \
  \ public String toString() {\n        return name + \" (\" + age + \")\";\n    }\n\
  }\n\npublic class TreeSetWithObjects {\n    public static void main(String[] args)\
  \ {\n        TreeSet<Person> people = new TreeSet<>();\n        people.add(new Person(\"\
  Alice\", 30));\n        people.add(new Person(\"Bob\", 25));\n        people.add(new\
  \ Person(\"Charlie\", 35));\n        System.out.println(\"People TreeSet: \" + people);\n\
  \    }\n}\n```\n\n#### 输出：\n`People TreeSet: [Bob (25), Alice (30), Charlie (35)]`\n\
  \n#### 解释：\n\n1. **自定义 Comparable**：\n   `Person` 类实现了 `Comparable` 接口以根据 `age`\
  \ 进行排序。\n\n2. **带对象的 TreeSet**：\n   `TreeSet` 根据 `compareTo` 方法对 `Person` 对象进行自动排序。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 最佳实践与用例\n\n1. **何时使用 TreeSet**：\n\
  \   - 当需要排序数据时。\n   - 用于范围查询（`subSet`、`headSet`、`tailSet`）。\n\n2. **何时避免使用 TreeSet**：\n\
  \   - 如果需要快速操作（改用 `HashSet`）。\n\n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\
  \n- **核心特性**：\n  - 保持元素的有序且唯一。\n  - 提供高效的导航和范围操作。\n- **性能**：\n  - 插入、删除和查找的复杂度为\
  \ `O(log n)`。\n- **常用方法**：\n  - `add()`、`remove()`、`first()`、`last()`、`higher()`、`lower()`。\n\
  \n## HashMap\n\n`HashMap` 是 Java 中 `java.util` 包的一个类。它实现了 `Map` 接口，允许你存储键值对。`HashMap`\
  \ 是最常用的数据结构之一，因为它通过键提供了快速的访问、插入和删除。\n\n![Rectangle Rectangle](img/image.png)\n\n\
  ### HashMap 的核心特性\n\n1. **键值对**：\n   - 每个键都映射到一个特定的值。\n   - 键必须是唯一的，但值可以重复。\n\n\
  2. **高性能**：\n   - 在假设哈希函数良好的情况下，`get()` 和 `put()` 等基本操作的时间复杂度为 `O(1)`。\n\n3. **允许为空**：\n\
  \   - 允许 `null` 值和单个 `null` 键。\n\n4. **非同步**：\n   - 默认不是线程安全的，这使其速度更快，但在多线程环境中需要同步。\n\
  \n5. **无序**：\n   - 不维护插入顺序；元素根据哈希码存储。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### HashMap 类层次结构\n\n`java.lang.Object`\n↳ `java.util.AbstractMap`\n↳ `java.util.HashMap`\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 构造函数\n\n| 构造函数 | 说明 |\n| :--- | :---\
  \ |\n| `HashMap()` | 创建一个具有默认容量 (16) 和负载因子 (0.75) 的空 `HashMap`。 |\n| `HashMap(int\
  \ initialCapacity)` | 创建具有指定初始容量的 `HashMap`。 |\n| `HashMap(int initialCapacity,\
  \ float loadFactor)` | 创建具有指定初始容量和负载因子的 `HashMap`。 |\n| `HashMap(Map<? extends K,\
  \ ? extends V> m)` | 创建由指定 map 的条目初始化的 `HashMap`。 |\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 1. 基本操作\n\n#### 代码示例：\n\n```java\nimport java.util.HashMap;\n\npublic class\
  \ HashMapExample {\n    public static void main(String[] args) {\n        // 创建一个\
  \ HashMap\n        HashMap<Integer, String> map = new HashMap<>();\n        // 添加键值对\n\
  \        map.put(1, \"Alice\");\n        map.put(2, \"Bob\");\n        map.put(3,\
  \ \"Charlie\");\n        System.out.println(\"Initial HashMap: \" + map);\n    \
  \    // 获取一个值\n        System.out.println(\"Value for key 2: \" + map.get(2));\n\
  \        // 删除一个键值对\n        map.remove(1);\n        System.out.println(\"After\
  \ removing key 1: \" + map);\n        // 检查键是否存在\n        System.out.println(\"\
  Contains key 3? \" + map.containsKey(3));\n        // 检查值是否存在\n        System.out.println(\"\
  Contains value 'Bob'? \" + map.containsValue(\"Bob\"));\n        // map 的大小（由原文上下文暗示）\n\
  \    }\n}\n```\n\n#### 输出：\n`Initial HashMap: {1=Alice, 2=Bob, 3=Charlie}`\n`Value\
  \ for key 2: Bob`\n`After removing key 1: {2=Bob, 3=Charlie}`\n`Contains key 3?\
  \ true`\n`Contains value 'Bob'? true`\n\n#### 解释：\n\n1. **键值对**：\n   使用 `map.put()`\
  \ 添加键值对。\n2. **获取值**：\n   使用 `map.get()` 获取值。\n3. **删除键值对**：\n   使用 `map.remove()`\
  \ 删除键值对。\n4. **检查键是否存在**：\n   使用 `map.containsKey()` 检查键是否存在。\n5. **检查值是否存在**：\n\
  \   使用 `map.containsValue()` 检查值是否存在。\n\n\n\n\n\n| 空值处理 | 允许一个 null 键和多个 null 值。\
  \ | 不允许 null 键。 | 允许一个 null 键和多个 null 值。 |\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 6. 使用自定义对象的 HashMap\n\n#### 代码示例：\n\n```java\nimport java.util.HashMap;\n\n\
  class Person {\n    String name;\n    int age;\n\n    Person(String name, int age)\
  \ {\n        this.name = name;\n        this.age = age;\n    }\n\n    @Override\n\
  \    public String toString() {\n        return name + \" (\" + age + \")\";\n \
  \   }\n}\n\npublic class HashMapCustomObjects {\n    public static void main(String[]\
  \ args) {\n        HashMap<Integer, Person> people = new HashMap<>();\n        people.put(1,\
  \ new Person(\"Alice\", 30));\n        people.put(2, new Person(\"Bob\", 25));\n\
  \        System.out.println(\"HashMap with custom objects:\");\n        for (var\
  \ entry : people.entrySet()) {\n            System.out.println(entry.getKey() +\
  \ \": \" + entry.getValue());\n        }\n    }\n}\n```\n\n#### 输出：\n\n```\nHashMap\
  \ with custom objects:\n1: Alice (30)\n2: Bob (25)\n```\n\n#### 解释：\n\n- ● `Person`\
  \ 类被用作 `HashMap` 中的值。\n- ● `toString()` 方法定义了对象的打印方式。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n## 最佳实践\n\n1. **哈希函数：**\n   - ○ 确保键具有适当的 `hashCode()` 和 `equals()` 实现，以保持行为一致。\n\
  2. **在多线程环境中避免 null 键：**\n   - ○ 使用 `ConcurrentHashMap` 来避免与 null 相关的问题。\n3. **明智使用初始容量：**\n\
  \   - ○ 通过设置合适的初始容量来避免频繁重扩。\n\n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\
  \n- ● **核心特性：**\n  - ○ 存储具有关联键唯一唯一键。\n  - ○ 允许 null 键和值。\n  - ○ 无序存储，操作速度快。\n- ●\
  \ **常用方法：**\n  - ○ `put()`, `get()`, `remove()`, `replace()`, `containsKey()`, `entrySet()`。\n\
  - ● **使用场景：**\n  - ○ 快速查找。\n  - ○ 缓存。\n  - ○ 键值数据存储。\n\n## TreeMap\n\nJava 中的 `TreeMap`\
  \ 是 `java.util` 包的一部分，并实现了 `Map` 接口。它是一个按照顺序存储键值对的集合，这种顺序可以基于键的自然排序或自定义的 `Comparator`。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### TreeMap 的核心特性\n\n1. **排序顺序：**\n \
  \  - ○ 默认按升序排列键（自然排序）。\n   - ○ 可以 `Comparator` 定义自定义的排序顺序。\n2. **NavigableMap：**\n\
  \   - ○ `TreeMap` 实现了 `NavigableMap` 接口，提供了如 `ceilingKey`、`floorKey`、`higherKey`\
  \ 和 `lowerKey` 等导航方法。\n3. **高效操作：**\n   - 由红黑树支持，为 `put`、`get`、`remove` 和导航操作提供\
  \ `O(log n)` 时间复杂度。\n4. **唯一键：**\n   - 键必须是唯一的，且不允许 `null` 作为键。\n5. **线程安全：**\n\
  \   - 不是线程安全的；在并发场景下请使用 `Collections.synchronizedMap` 或 `ConcurrentSkipListMap`。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 层级结构\n\n`java.lang.Object`\n↳ `java.util.AbstractMap`\n\
  ↳ `java.util.TreeMap`\n\n![Rectangle Rectangle](img/image.png)\n\n### 构造函数\n\n|\
  \ 构造函数 | 描述 |\n| :--- | :--- |\n| `TreeMap()` | 创建具有自然排序的空 `TreeMap`。 |\n| `TreeMap(Comparator<?\
  \ super K> comp)` | 创建使用指定比较器进行排序的空 `TreeMap`。 |\n| `TreeMap(Map<? extends K, ?\
  \ extends V> m)` | 创建包含与指定 map 相同映射的 `TreeMap`。 |\n| `TreeMap(SortedMap<K, ? extends\
  \ V> m)` | 创建具有给定 `SortedMap` 映射和排序的 `TreeMap`。 |\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 1. TreeMap 的基本操作\n\n#### 代码示例：\n\n```java\nimport java.util.TreeMap;\npublic\
  \ class TreeMapExample {\n    public static void main(String[] args) {\n       \
  \ // 创建一个 TreeMap\n        TreeMap<Integer, String> map = new TreeMap<>();\n   \
  \     // 添加键值对\n        map.put(3, \"Three\");\n        map.put(1, \"One\");\n \
  \       map.put(4, \"Four\");\n        map.put(2, \"Two\");\n        System.out.println(\"\
  Initial TreeMap: \" + map);\n        // 获取键的对应值\n        System.out.println(\"Value\
  \ for key 2: \" + map.get(2));\n        // 移除一个键值对\n        map.remove(3);\n   \
  \     System.out.println(\"After removing key 3: \" + map);\n        // 检查键和值\n\
  \        System.out.println(\"Contains key 4? \" + map.containsKey(4));\n      \
  \  System.out.println(\"Contains value 'Five'? \" + map.containsValue(\"Five\"));\n\
  \    }\n}\n```\n\n#### 输出：\n\n```\nInitial TreeMap: {1=One, 2=Two, 3=Three, 4=Four}\n\
  Value for key 2: Two\nAfter removing key 3: {1=One, 2=Two, 4=Four}\n```\n\n####\
  \ 解释：\n\n1. **排序顺序：**\n   - 默认按升序排列键。\n2. **访问：**\n   - `map.get(2)` 获取键 2 的值。\n\
  3. **移除：**\n   - `map.remove(3)` 删除了键 3。\n4. **检查：**\n   - `containsKey(4)` 检查是否存在键\
  \ 4。\n   - `containsValue(\"Five\")` 检查是否存在值 \"Five\"。\n\n### 2. 自定义排序\n\n#### 代码示例：\n\
  \n```java\nimport java.util.TreeMap;\nimport java.util.Comparator;\n\npublic class\
  \ CustomOrdering {\n    public static void main(String[] args) {\n        // 使用反向排序创建\
  \ TreeMap\n        TreeMap<Integer, String> map = new TreeMap<>(Comparator.reverseOrder());\n\
  \        map.put(1, \"One\");\n        map.put(3, \"Three\");\n        map.put(4,\
  \ \"Four\");\n        map.put(2, \"Two\");\n        System.out.println(\"Custom\
  \ TreeMap: \" + map);\n    }\n}\n```\n\n#### 输出：\n\n```\nCustom TreeMap: {4=Four,\
  \ 3=Three, 2=Two, 1=One}\n```\n\n#### 解释：\n\n1. **自定义比较器：**\n   - `Comparator.reverseOrder()`\
  \ 改变了默认排序。\n2. **构造：**\n   - 在构造函数中传递比较器。\n\n### 3. 导航 TreeMap\n\n| 方法 | 描述 |\n\
  | :--- | :--- |\n| `higherKey(k)` | 返回大于 k 的最小键。 |\n| `lowerKey(k)` | 返回小于 k 的最大键。\
  \ |\n| `ceilingKey(k)` | 返回大于或等于 k 的最小键。 |\n| `floorKey(k)` | 返回小于或等于 k 的最大键。 |\n\
  \n#### 代码示例：\n\n```java\nimport java.util.TreeMap;\npublic class TreeMapNavigation\
  \ {\n    public static void main(String[] args) {\n        TreeMap<Integer, String>\
  \ map = new TreeMap<>();\n        map.put(10, \"Ten\");\n        map.put(20, \"\
  Twenty\");\n        map.put(30, \"Thirty\");\n        map.put(40, \"Forty\");\n\n\
  \        System.out.println(\"TreeMap: \" + map);\n        System.out.println(\"\
  Higher Key than 25: \" + map.higherKey(25));\n        System.out.println(\"Lower\
  \ Key than 25: \" + map.lowerKey(25));\n        System.out.println(\"Ceiling Key\
  \ of 25: \" + map.ceilingKey(25));\n        System.out.println(\"Floor Key of 25:\
  \ \" + map.floorKey(25));\n    }\n}\n```\n\n#### 输出：\n\n（此处代码逻辑的预期输出）\n```\nTreeMap:\
  \ {10=Ten, 20=Twenty, 30=Thirty, 40=Forty}\nHigher Key than 25: 30\nLower Key than\
  \ 25: 20\nCeiling Key of 25: 30\nFloor Key of 25: 20\n```\n\n#### 解释：\n\n1. **导航方法：**\n\
  \   - 这些方法提供了根据特定值进行范围搜索的能力。\n\n### 4. 遍历 TreeMap\n\n#### 代码示例：\n\n```java\nimport\
  \ java.util.TreeMap;\nimport java.util.Map;\npublic class TreeMapIteration {\n \
  \   public static void main(String[] args) {\n        TreeMap<String, Integer> map\
  \ = new TreeMap<>();\n        map.put(\"Alice\", 30);\n        map.put(\"Bob\",\
  \ 25);\n        map.put(\"Charlie\", 35);\n\n        // 使用 entrySet() 遍历\n     \
  \   System.out.println(\"Using entrySet:\");\n        for (Map.Entry<String, Integer>\
  \ entry : map.entrySet()) {\n            System.out.println(entry.getKey() + \"\
  : \" + entry.getValue());\n        }\n\n        // 使用 keySet() 遍历\n        System.out.println(\"\
  \\nUsing keySet:\");\n        for (String key : map.keySet()) {\n            System.out.println(key\
  \ + \": \" + map.get(key));\n        }\n    }\n}\n```\n\n\n\n\n\n```java\nfor (String\
  \ key : map.keySet()) {\n    System.out.println(key + \": \" + map.get(key));\n\
  }\n}\n```\n\n#### 输出:\n使用 entrySet:\nAlice: 30\nBob: 25\nCharlie: 35\n\n使用 keySet:\n\
  Alice: 30\nBob: 25\nCharlie: 35\n\n#### 解析:\n1. **Entry Set**:\n   <bdi>○</bdi>遍历键值对（key-value）。\n\
  2. **Key Set**:\n   <bdi>○</bdi>遍历键并使用 `get()` 获取值。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 5. 使用自定义对象的 TreeMap\n\n#### 代码示例:\n```java\nimport java.util.TreeMap;\n\n\
  class Person implements Comparable<Person> {\n    String name;\n    int age;\n\n\
  \    Person(String name, int age) {\n        this.name = name;\n        this.age\
  \ = age;\n    }\n\n    @Override\n    public int compareTo(Person other) {\n   \
  \     return Integer.compare(this.age, other.age);\n    }\n\n    @Override\n   \
  \ public String toString() {\n        return name + \" (\" + age + \")\";\n    }\n\
  }\n\npublic class TreeMapCustomObjects {\n    public static void main(String[] args)\
  \ {\n        TreeMap<Person, String> map = new TreeMap<>();\n        map.put(new\
  \ Person(\"Alice\", 30), \"Engineer\");\n        map.put(new Person(\"Bob\", 25),\
  \ \"Doctor\");\n        map.put(new Person(\"Charlie\", 35), \"Teacher\");\n   \
  \     System.out.println(\"TreeMap with custom objects:\");\n        for (var entry\
  \ : map.entrySet()) {\n            System.out.println(entry.getKey() + \": \" +\
  \ entry.getValue());\n        }\n    }\n}\n```\n\n#### 输出:\nTreeMap with custom\
  \ objects:\nBob (25): Doctor\nAlice (30): Engineer\nCharlie (35): Teacher\n\n####\
  \ 解析:\n<bdi>●</bdi>`Person` 类实现了 `Comparable` 接口以按年龄排序。\n<bdi>●</bdi>`TreeMap` 根据年龄对\
  \ `Person` 对象进行排序。\n\n![Rectangle Rectangle](img/image.png)\n\n### TreeMap vs HashMap\n\
  \n| 特性 | TreeMap | HashMap |\n| :--- | :--- | :--- |\n| 排序 | 有排序顺序（自然顺序或自定义）。 |\
  \ 无序。 |\n| 性能 | 因为排序导致较慢 (O(log n))。 | 基本操作更快 (O(1))。 |\n| 空值处理 | 不允许 null key。\
  \ | 允许一个 null key。 |\n\n![Rectangle Rectangle](img/image.png)\n\n## 最佳实践\n1. 需要排序的键时使用\
  \ `TreeMap`。\n2. 在不需要排序的大数据集上避免使用 `TreeMap`（请改用 `HashMap`）。\n3. 对于线程安全操作，考虑使用 `ConcurrentSkipListMap`。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 总结\n<bdi>●</bdi>核心特性：\n<bdi>○</bdi>按排序顺序存储键值对。\n\
  <bdi>○</bdi>允许用于范围查询的导航方法。\n<bdi>●</bdi>性能：\n<bdi>○</bdi>对排序数据高效，但比 `HashMap` 慢。\n\
  <bdi>●</bdi>常用方法：\n<bdi>○</bdi>`put()`, `get()`, `remove()`, `higherKey()`, `lowerKey()`。\n\
  \n## 迭代器 (Iterators)\n\n`Iterator` 是 Java 中的一种对象，允许你逐个遍历集合中的元素。它提供了在不暴露集合内部结构的情况下遍历集合集合的方法。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 迭代器的关键特性\n1. **顺序访问**:\n   <bdi>○</bdi>允许对集合中的元素进行顺序遍历。\n\
  2. **通用性**:\n   <bdi>○</bdi>适用于任何实现了 `java.util.Collection` 接口的类。\n3. **修改**:\n\
  \   <bdi>○</bdi>某些迭代器允许修改（如 `remove()`），而其他则不允许（例如 `forEach`）。\n4. **快速失败机制**:\n\
  \   <bdi>○</bdi>如果在迭代期间对集合发生了结构性修改，迭代器将抛出 `ConcurrentModificationException`（除非使用并发集合）。\n\
  5. **高级迭代器**:\n   <bdi>○</bdi>特化的迭代器包括 `ListIterator` 和 `Spliterator`。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### Iterator 接口\n`java.util.Iterator` 接口有三个主要方法：\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `boolean hasNext()` | 如果迭代还有更多元素，则返回 true。 |\n\
  | `E next()` | 返回迭代中的下一个元素。 |\n| `void remove()` | 移除上一个由 `next()` 返回的元素（可选操作）。\
  \ |\n\n![Rectangle Rectangle](img/image.png)\n\n### 1. 基础迭代器示例\n\n#### 代码示例:\n```java\n\
  import java.util.ArrayList;\nimport java.util.Iterator;\n\npublic class IteratorExample\
  \ {\n    public static void main(String[] args) {\n        ArrayList<String> list\
  \ = new ArrayList<>();\n        list.add(\"Alice\");\n        list.add(\"Bob\");\n\
  \        list.add(\"Charlie\");\n        // 获取一个迭代器\n        Iterator<String> it\
  \ = list.iterator();\n        while (it.hasNext()) {\n            System.out.println(it.next());\n\
  \        }\n    }\n}\n```\n\n### 2. 使用 remove()\n#### 代码示例:\n```java\nIterator<String>\
  \ it = list.iterator();\nwhile (it.hasNext()) {\n    String name = it.next();\n\
  \    if (name.equals(\"Bob\")) {\n        it.remove();\n    }\n}\n```\n\n### 3.\
  \ 使用 ListIterator\n`ListIterator` 是 `Iterator` 的扩展，允许双向遍历。\n\n| 方法 | 描述 |\n| :---\
  \ | :--- |\n| `boolean hasPrevious()` | 如果向后还有元素，则返回 true。 |\n| `E previous()` |\
  \ 返回上一个元素。 |\n| `void add(E e)` | 在当前位置插入元素。 |\n| `void set(E e)` | 上一个由 `next()`\
  \ 或 `previous()` 返回的元素。 |\n\n\n\n\n\n#### 代码示例：\n\n```java\nimport java.util.ArrayList;\n\
  import java.util.Spliterator;\n\npublic class SpliteratorExample {\n    public static\
  \ void main(String[] args) {\n        ArrayList<String> list = new ArrayList<>();\n\
  \        list.add(\"Alice\");\n        list.add(\"Bob\");\n        list.add(\"Charlie\"\
  );\n\n        // 获取一个 Spliterator\n        Spliterator<String> spliterator = list.spliterator();\n\
  \n        #### 使用 tryAdvance\n        System.out.println(\"Using tryAdvance:\");\n\
  \        spliterator.tryAdvance(System.out::println);\n\n        // 使用 forEachRemaining\n\
  \        System.out.println(\"\\nUsing forEachRemaining:\");\n        spliterator.forEachRemaining(System.out::println);\n\
  \    }\n}\n```\n\n#### 输出：\n\n```\nUsing tryAdvance:\nAlice\nUsing forEachRemaining:\n\
  Bob\nCharlie\n```\n\n#### 解释：\n\n1. `tryAdvance`:\n<bdi>○</bdi>处理下一个元素并移动迭代器向前。\n\
  \n2. `forEachRemaining`:\n<bdi>○</bdi>处理 `Spliterator` 中所有剩余元素。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 5. 快速失败迭代器\n\nJava 中的迭代器是快速失败的（fail-fast），这意味着如果在迭代器创建后对集合进行了结构性修改（通过迭代器本身除外），它将抛出\
  \ `ConcurrentModificationException`。\n\n#### 代码示例：\n\n```java\nimport java.util.ArrayList;\n\
  import java.util.Iterator;\n\npublic class FailFastExample {\n    public static\
  \ void main(String[] args) {\n        ArrayList<String> list = new ArrayList<>();\n\
  \        list.add(\"Alice\");\n        list.add(\"Bob\");\n\n        Iterator<String>\
  \ iterator = list.iterator();\n        while (iterator.hasNext()) {\n          \
  \  System.out.println(iterator.next());\n            list.add(\"Charlie\"); // 结构性修改\n\
  \        }\n    }\n}\n```\n\n#### 输出：\n\n```\nException in thread \"main\" java.util.ConcurrentModificationException\n\
  ```\n\n#### 解释：\n\n<bdi>●</bdi>在迭代期间直接修改集合会触发 `ConcurrentModificationException`。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 6. 迭代器的最佳实践\n\n1. 避免结构性修改：\n<bdi>○</bdi>在迭代期间仅通过迭代器修改集合。\n\
  \n2. 尽可能使用增强型 for 循环：\n<bdi>○</bdi>对于非修改类操作，更加简单、简洁。\n\n3. 使用并发集合：\n<bdi>○</bdi>在多线程环境中使用\
  \ `CopyOnWriteArrayList` 或 `ConcurrentHashMap` 以实现安全迭代。\n\n4. 使用 Spliterator 进行并行处理：\n\
  <bdi>○</bdi>对于函数式编程和大型数据集非常高效。\n\n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\
  \n<bdi>●</bdi>迭代器 (Iterators):\n<bdi>○</bdi>允许对集合进行顺序遍历。\n<bdi>○</bdi>提供 `hasNext`、`next()`\
  \ 和 `remove()` 等方法。\n\n<bdi>●</bdi>列表迭代器 (ListIterator):\n<bdi>○</bdi>允许双向遍历和修改。\n\
  \n<bdi>●</bdi>分割迭代器 (Spliterator):\n<bdi>○</bdi>支持并行性和函数式风格操作。\n\n<bdi>●</bdi>快速失败行为\
  \ (Fail-Fast Behavior):\n<bdi>○</bdi>确保结构性修改期间的安全性。\n\n## 流与并行流\n\nJava 流在 Java\
  \ 8 中引入，是 `java.util.stream` 包的一部分。它们允许开发者对集合和其他数据源执行函数式风格的操作。并行流（Parallel Stream）是流的特殊版本，能够启用并发处理，利用多个线程的优势。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 流的关键特性\n\n1. 函数式编程：\n<bdi>○</bdi>流使用\
  \ Lambda 表达式以声明的方式处理数据。\n\n2. 惰性求值（Lazy Evaluation）：\n<bdi>○</bdi>中间操作只有在调用终端操作时才会求值。\n\
  \n3. 非破坏性（Non-Destructive）：\n<bdi>○</bdi>流不会修改原始数据源。\n\n4. 管道化（Pipelining）：\n<bdi>○</bdi>多个操作可以链式形成管道。\n\
  \n5. 无状态操作（Stateless Operations）：\n<bdi>○</bdi>操作不依赖于可变的共享状态，使其是线程安全的。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n## 流与并行流\n\n| 维度 | 流 (Stream) | 并行流 (Parallel Stream)\
  \ |\n| :--- | :--- | :--- |\n| 执行 | 顺序（单线程）。 | 并发（多线程）。 |\n| 性能 | 适用于小型数据集。 | 适用于大型数据集。\
  \ |\n| 顺序保留 | 保留元素的顺序。 | 可能不保留顺序。 |\n| 开销 | 最小的线程管理开销。 | 由于拆分和合并产生额外开销。 |\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 流 API 操作\n\n### 1. 中间操作\n\n| 方法 | 描述 |\n| :---\
  \ | :--- |\n| `filter()` | 根据谓词过滤元素。 |\n| `map()` | 使用函数转换元素。 |\n| `distinct()`\
  \ | 去除重复元素。 |\n| `sorted()` | 按自然顺序或自定义顺序排序元素。 |\n| `limit()` | 将流截断到指定大小。 |\n\n\
  ### 2. 终端操作\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `forEach()` | 对每个元素执行操作。 |\n| `collect()`\
  \ | 将元素转换为集合或其他格式。 |\n| `reduce()` | 将元素归约为单个值。 |\n| `count()` | 返回元素的数量。 |\n| `anyMatch()`\
  \ | 如果有任何元素匹配则返回 true。 |\n\n#### 1. 代码示例：\n\n```java\nimport java.util.ArrayList;\n\
  import java.util.Spliterator;\n\npublic class SpliteratorExample {\n    public static\
  \ void main(String[] args) {\n        ArrayList<String> list = new ArrayList<>();\n\
  \        list.add(\"Alice\");\n        list.add(\"Bob\");\n        list.add(\"Charlie\"\
  );\n\n        // 获取一个 Spliterator\n        Spliterator<String> spliterator = list.spliterator();\n\
  \n        // 使用 tryAdvance\n        System.out.println(\"Using tryAdvance:\");\n\
  \        spliterator.tryAdvance(System.out::println);\n\n        // 使用 forEachRemaining\n\
  \        ..out.println(\"\\nUsing forEachRemaining:\");\n        spliterator.forEachRemaining(System.out::println);\n\
  \    }\n}\n```\n\n#### 输出：\n\n```\nUsing tryAdvance:\nAlice\nUsing forEachRemaining:\n\
  Bob\nCharlie\n```\n\n#### 解释：\n\n1. `tryAdvance`:\n<bdi>○</bdi>处理下一个元素并移动迭代器向前。\n\
  \n2. `forEachRemaining`:\n<bdi>○</bdi>处理 `Spliterator` 中所有剩余元素。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 5. 快速失败迭代器\n\n```java\nimport java.util.ArrayList;\nimport java.util.Iterator;\n\
  \npublic class FailFastExample {\n    public static void main(String[] args) {\n\
  \        ArrayList<String> list = new ArrayList<>();\n        list.add(\"Alice\"\
  );\n        list.add(\"Bob\");\n\n        Iterator<String> iterator = list.iterator();\n\
  \        while (iterator.hasNext()) {\n            System.out.println(iterator.next());\n\
  \            list.add(\"Charlie\"); // 结构性修改\n        }\n    }\n}\n```\n\n#### 输出：\n\
  \n```\nException in thread \"main\" java.util.ConcurrentModificationException\n\
  ```\n\n#### 解释：\n\n<bdi>●</bdi>在迭代期间直接修改集合会触发 `ConcurrentModificationException`。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 6. 迭代器的最佳实践\n\n1. 避免结构性修改：\n<bdi>○</bdi>在迭代期间仅通过迭代器修改集合。\n\
  \n2. 尽可能使用增强型 for 循环：\n<bdi>○</bdi>对于非修改类操作，更加简单、简洁。\n\n3. 使用并发集合：\n<bdi>○</bdi>在多线程环境中使用\
  \ `CopyOnWriteArrayList` 或 `ConcurrentHashMap` 以实现安全迭代。\n\n4. 使用 Spliterator 进行并行处理：\n\
  <bdi>○</bdi>对于函数式编程和大型数据集非常高效。\n\n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\
  \n<bdi>●</bdi>迭代器 (Iterators):\n<bdi>○</bdi>允许对集合进行顺序遍历。\n<bdi>○</bdi>提供 `hasNext`、`next()`\
  \ 和 `remove()` 等方法。\n\n<bdi>●</bdi>列表迭代器 (ListIterator):\n<bdi>○</bdi>允许双向遍历和修改。\n\
  \n<bdi>●</bdi>分割迭代器 (Spliterator):\n<bdi>○</bdi>支持并行性和函数式风格操作。\n\n<bdi>●</bdi>快速失败行为\
  \ (Fail-Fast Behavior):\n<bdi>○</bdi>确保结构性修改期间的安全性。\n\n### 1. 基础流示例：\n\n```java\n\
  import java.util.ArrayList;\nimport java.util.List;\n\npublic class StreamExample\
  \ {\n    public static void main(String[] args) {\n        ArrayList<Integer> list\
  \ = new ArrayList<>();\n        list.add(1);\n        list.add(2);\n        list.add(3);\n\
  \n        List<Integer> result = list.stream()\n            .filter(n -> n % 2 ==\
  \ 0)\n            .map(n -> n * 2)\n            .toList();\n\n        System.out.println(\"\
  Processed List: \" + result);\n    }\n}\n```\n\n#### 输出：\n\n```\nProcessed List:\
  \ [4]\n```\n\n#### 解释：\n\n1. `filter`:\n<bdi>○</bdi>`n % 2 == 0` 保留偶数。\n\n2. `map`:\n\
  <bdi>○</bdi>`n * 2` 将每个数字翻倍。\n\n3. `toList`:\n<bdi>○</bdi>将流转换为 `List`。\n\n### 2.\
  \ 并行流示例：\n\n```java\nimport java.util.stream.IntStream;\n\npublic class ParallelStreamExample\
  \ {\n    public static void main(String[] args) {\n        int sum = IntStream.rangeClosed(1,\
  \ 10)\n            .parallel()\n            .sum();\n        System.out.println(\"\
  Sum: \" + sum);\n    }\n}\n```\n\n#### 输出：\n\n```\nSum: 55\n```\n\n#### 解释：\n\n\
  1. `rangeClosed(1, 10)`:\n<bdi>○</bdi>创建一个从 1 到 10 的数字流。\n\n2. `parallel()`:\n<bdi>○</bdi>启用多线程处理。\n\
  \n3. `sum()`:\n<bdi>○</bdi>将所有元素合并为单个结果。\n\n### 3. 流操作：\n\n```java\nimport java.util.Arrays;\n\
  import java.util.List;\nimport java.util.stream.Collectors;\n\npublic class StreamOperations\
  \ {\n    public static void main(String[] args) {\n        List<String> names =\
  \ Arrays.asList(\"Alice\", \"Bob\", \"Charlie\", \"David\");\n\n        List<String>\
  \ result = names.stream()\n            .filter(name -> name.startsWith(\"A\"))\n\
  \            .map(String::toUpperCase)\n            .collect(Collectors.toList());\n\
  \n        System.out.println(\"Processed Names: \" + result);\n    }\n}\n```\n\n\
  #### 输出：\n\n```\nProcessed Names: [ALICE]\n```\n\n#### 解释：\n\n1. `filter`:\n<bdi>○</bdi>`name.startsWith(\"\
  A\")` 保留以 A 开头的名称。\n\n2. `map`:\n<bdi>○</bdi>`String::toUpperCase` 将名称转换为大写。\n\n\
  3. `collect`:\n<bdi>○</bdi>将结果收集到 `List`。\n\n### 4. 排序与去重：\n\n```java\nimport java.util.Arrays;\n\
  import java.util.List;\n\npublic class StreamDistinctSorted {\n    public static\
  \ void main(String[] args) {\n        List<Integer> numbers = Arrays.asList(4, 2,\
  \ 7, 4, 2, 9, 5);\n\n        List<Integer> result = numbers.stream()\n         \
  \   .distinct()\n            .sorted()\n            .toList();\n\n        System.out.println(\"\
  Sorted and Distinct Numbers: \" + result);\n    }\n}\n```\n\n#### 输出：\n\n```\nSorted\
  \ and Distinct Numbers: [2, 4, 5, 7, 9]\n```\n\n#### 解释：\n\n1. `distinct`:\n<bdi>○</bdi>去除重复元素。\n\
  \n2. `sorted`:\n<bdi>○</bdi>按升序排列元素。\n\n\n\n\n\n#### 代码示例：\n\n```java\nimport java.util.stream.IntStream;\n\
  \npublic class StreamPerformance {\n\n    public static void main(String[] args)\
  \ {\n        long startTime, endTime;\n\n        // 顺序流\n        startTime = System.currentTimeMillis();\n\
  \        IntStream.range(1, 1_000_000).sum();\n        endTime = System.currentTimeMillis();\n\
  \        System.out.println(\"Sequential Stream Time: \" + (endTime - startTime)\
  \ + \" ms\");\n\n        // 并行流\n        startTime = System.currentTimeMillis();\n\
  \        IntStream.range(1, 1_000_000).parallel().sum();\n        endTime = System.currentTimeMillis();\n\
  \        System.out.println(\"Parallel Stream Time: \" + (endTime - startTime) +\
  \ \" ms\");\n    }\n}\n```\n\n#### 输出（示例，取决于硬件）：\n\nSequential Stream Time: 20 ms\n\
  Parallel Stream Time: 5 ms\n\n#### 解析：\n\n1. 顺序流：\n<bdi>○</bdi>在单线程中处理元素。\n\n2.\
  \ 并行流：\n<bdi>○</bdi>将工作负载分到多个线程中，提高大型数据集的性能。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 5. 使用 reduce 进行自定义聚合\n\n#### 代码示例：\n\n```java\nimport java.util.Arrays;\n\
  import java.util.List;\n\npublic class StreamReduceExample {\n\n    public static\
  \ void main(String[] args) {\n        List<Integer> numbers = Arrays.asList(1, 2,\
  \ 3, 4, 5);\n\n        // 计算所有数字的积\n        int product = numbers.stream()\n   \
  \         .reduce(1, (a, b) -> a * b);\n\n        System.out.println(\"Product of\
  \ Numbers: \" + product);\n    }\n}\n```\n\n#### 输出：\n\nProduct of Numbers: 120\n\
  \n#### 解析：\n\n1. 恒等值（Identity）：\n<bdi>○</bdi>1 是乘法的起始值。\n\n2. 累加器（Accumulator）：\n\
  <bdi>○</bdi>(`(a, b) -> a * b` 将每个元素与累加结果相乘。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 并行流的关键点\n\n1. 用场景：\n<bdi>○</bdi>并行流适用于大型数据集或计算密集型操作。\n\n2. 避免开销：\n<bdi>○</bdi>对于小型数据集，并行流可能会引入不必要的开销。\n\
  \n3. 线程安全：\n<bdi>○</bdi>确保操作是无状态的，以避免并发问题。\n\n4. Fork/Join 框架：\n<bdi>○</bdi>并行流内部使用\
  \ Fork/Join 框架来拆分任务。\n\n![Rectangle Rectangle](img/image.png)\n\n## 最佳实践\n\n1. 使用\
  \ Stream 进行清晰且声明式数据处理。\n2. 审慎使用并行流，考虑数据大小和开销。\n3. 避免在并行流中修改共享数据结构。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 总结\n\n<bdi>●</bdi>Stream（流）：\n<bdi>○</bdi>实现集合的函数式处理。\n\
  <bdi>○</bdi>适用于顺序、非线程操作。\n\n<bdi>●</bdi>Parallel Streams（并行流）：\n<bdi>○</bdi>使用多个线程进行并发处理。\n\
  <bdi>○</bdi>适用于大型数据集或计算密集型任务。\n\n## 泛型\n\nJava 泛型是一项特性，允许类、接口和方法在编译时对由程序员指定的类型进行操作。它们为集合和其他数据结构提供了类型安全、可重用性和可读性。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 泛型的关键特征\n\n1. 类型安全：\n<bdi>○</bdi>确保只有兼容类型被添加到集合或方法中，避免\
  \ `ClassCastException`。\n2. 代码可重用：\n<bdi>○</bdi>允许同一段代码适用于不同的类型。\n3. 消除类型转换：\n<bdi>○</bdi>从集合中获取元素时避免显式强制转换。\n\
  4. 编译时检查：\n<bdi>○</bdi>错误在编译时被捕获，而不是运行时。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 1. 泛型类\n\n泛型类允许你定义一个可以操作不同类型的类。\n\n#### 代码示例：\n\n```java\nclass Box<T> {\n\
  \    private T item;\n\n    public void setItem(T item) {\n        this.item = item;\n\
  \    }\n\n    public T getItem() {\n        return item;\n    }\n}\n\npublic class\
  \ GenericClassExample {\n    public static void main(String[] args) {\n        //\
  \ 类型的 Box\n        Box<String> stringBox = new Box<>();\n        stringBox.setItem(\"\
  Hello\");\n        System.out.println(\"String Box: \" + stringBox.getItem());\n\
  \n        // Integer 类型的 Box\n        Box<Integer> integerBox = new Box<>();\n \
  \       integerBox.setItem(123);\n        System.out.println(\"Integer Box: \" +\
  \ integerBox.getItem());\n    }\n}\n```\n\n#### 输出：\n\nString Box: Hello\nInteger\
  \ Box: 123\n\n#### 解析：\n\n1. 泛型参数 `<T>`：\n<bdi>○</bdi>`T` 是一个类型参数，将被替换为指定的类型（`String`、`Integer`\
  \ 等）。\n2. 类型安全：\n<bdi>○</bdi>无法将非 String 类型添加到 stringBox。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 2. 泛型方法\n\n泛型方法允许通过类型参数定义方法，使其适用于不同的类型。\n\n<bdi>○</bdi>Bounded Type `<T extends\
  \ Number>` 限制类型。\n\n#### 代码示例：\n\n```java\nclass GenericMethod {\n    public static\
  \ <T> void printArray(T[] array) {\n        for (T element : array) {\n        \
  \    System.out.print(element + \" \");\n        }\n    }\n\n    public static void\
  \ main(String[] args) {\n        Integer[] intArray = {1, 2, 3};\n        String[]\
  \ strArray = {\"Hello\", \"World\"};\n        printArray(intArray);\n        printArray(strArray);\n\
  \    }\n}\n```\n\n#### 输出：\n\n1 2 3\nHello World\n\n#### 解析：\n\n1. 泛型方法语法：\n<bdi>○</bdi>`T>`\
  \ 指定了类型参数。\n2. 边界类型 `<T extends Number>`：\n<bdi>○</bdi>限制 `T` 必须是 `Number` 及其子类。\n\
  \n### 3. 边界泛型\n\n可以使用边界限制泛型的类型。\n\n#### 代码示例：\n\n```java\nclass BoundedType<T extends\
  \ Number> {\n    private T number;\n\n    public void setNumber(T number) {\n  \
  \      this.number = number;\n    }\n\n    public double square() {\n        return\
  \ number.doubleValue() * number.doubleValue();\n    }\n\n    public static void\
  \ main(String[] args) {\n        BoundedType<Integer> intObj = new BoundedType<>();\n\
  \        intObj.setNumber(5);\n        System.out.println(\"Square of 5: \" + intObj.square());\n\
  \n        BoundedType<Double> doubleObj = new BoundedType<>();\n        doubleObj.setNumber(3.14);\n\
  \        System.out.println(\"Square of 3.14: \" + doubleObj.square());\n    }\n\
  }\n```\n\n#### 输出：\n\nSquare of 5: 25.0\nSquare of 3.14: 9.8596\n\n### 4. 泛型中的通配符\n\
  \n当你不知道泛型类或方法的具体类型时使用通配符。\n\n| 通配符 | 说明 |\n| :--- | :--- |\n| `<?>` | 无界通配符：接受任何类型。\
  \ |\n| `<? extends Type>` | 上界通配符：接受 `Type` 或其子类。 |\n| `<? super Type>` | 下界通配符：接受\
  \ `Type` 或其父类。 |\n\n#### 示例：无界通配符：\n\n```java\nimport java.util.List;\nimport java.util.ArrayList;\n\
  \npublic class UnboundedWildcardExample {\n    public static void printList(List<?>\
  \ list) {\n        for (Object obj : list) {\n            System.out.print(obj +\
  \ \" \");\n        }\n        System.out.println();\n    }\n\n    public static\
  \ void main(String[] args) {\n        List<Integer> intList = List.of(1, 2, 3);\n\
  \        List<String> strList = List.of(\"A\", \"B\", \"C\");\n        printList(intList);\n\
  \        printList(strList);\n    }\n}\n```\n\n#### 输出：\n\n1 2 3\nA B C \n\n####\
  \ 示例：上界通配符：\n\n```java\nimport java.util.List;\n\npublic class UpperBoundedWildcardExample\
  \ {\n    public static double sumList(List<? extends Number> list) {\n        double\
  \ sum = 0.0;\n        for (Number num : list) {\n            sum += num.doubleValue();\n\
  \        }\n        return sum;\n    }\n\n    public static void main(String[] args)\
  \ {\n        List<Integer> intList = List.of(1, 2, 3);\n        List<Double> doubleList\
  \ = List.of(1.1, 2.2, 3.3);\n        System.out.println(\"Sum of intList: \" + sumList(intList));\n\
  \        System.out.println(\"Sum of doubleList: \" + sumList(doubleList));\n  \
  \  }\n}\n```\n\n#### 输出：\n\nSum of intList: 6.0\nSum of doubleList: 6.6\n\n\n\n\n\
  \n#### 示例：下界通配符\n\n```java\nimport java.util.List;\nimport java.util.ArrayList;\n\
  \npublic class LowerBoundedWildcardExample {\n\n    public static void addNumbers(List<?\
  \ super Integer> list) {\n        list.add(1);\n        list.add(2);\n        list.add(3);\n\
  \    }\n\n    public static void main(String[] args) {\n        List<Number> numList\
  \ = new ArrayList<>();\n        addNumbers(numList);\n        System.out.println(\"\
  添加数字后的列表: \" + numList);\n    }\n}\n```\n\n#### 输出：\n\n添加数字后的列表：[1, 2, 3]\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 5. 集合中的泛型\n\n泛型常用于 Java 集合，例如 `List`、`Set` 和\
  \ `Map`。\n\n#### 代码示例：\n\n```java\nimport java.util.ArrayList;\n\npublic class GenericCollectionsExample\
  \ {\n\n    public static void main(String[] args) {\n        // 字符串列表\n        ArrayList<String>\
  \ names = new ArrayList<>();\n        names.add(\"Alice\");\n        names.add(\"\
  Bob\");\n        names.add(\"Charlie\");\n\n        for (String name : names) {\n\
  \            System.out.println(name);\n        }\n    }\n}\n```\n\n#### 输出：\n\n\
  Alice\nBob\nCharlie\n\n#### 解析：\n\n1. 泛型集合：\n   ○ 确保类型安全，允许列表中仅包含 `String` 值。\n\n\
  ![Rectangle Rectangle](img/image.png)\n\n### 泛型的优势\n\n1. 类型安全：\n   ○ 在编译时检测与类型相关的错误。\n\
  2. 代码复用性：\n   ○ 泛型类和方法适用于任何类型。\n3. 消除类型转换：\n   ○ 减少样板代码。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 总结\n\n1. 泛型语法：\n   ○ `<T>` 用于类和方法。\n   ○ `<T extends Class>` 用于有边界参数。\n2.\
  \ 通配符：\n   ○ `<?>`、`<? extends T>`、`<? super T>` 用于灵活的类型处理。\n3. 用场景：\n   ○ 集合、工具方法、自定义类。\n\
  \n## 枚举\n\nJava 中的枚举（`enum`）是一种特殊的类型，用于定义一组命名的常量。枚举通过将相关的常量组合在一起，提高了代码的可读性和安全性。它们在\
  \ Java 5 中被引入，是 `java.lang` 包的一部分。\n\n![Rectangle Rectangle](img/image.png)\n\n\
  ### 枚举的关键特征\n\n1. 类型安全：\n   ○ 枚举常量是类型安全的，这意味着你不能为它们分配不相关的值。\n2. 隐式类：\n   ○ 枚举是 `java.lang.Enum`\
  \ 的隐式子类，可以拥有字段、方法和构造函数。\n3. 常量集：\n   ○ 枚举定义了固定的常量集合（例如 `DAYS`、`COLORS`、`DIRECTIONS`）。\n\
  4. 可读代码：\n   ○ 用枚举代替硬编码的常量使代码更具可维护性和表现力。\n5. 内置方法：\n   ○ 枚举提供了 `values()`、`ordinal()`\
  \ 和 `name()` 等方法，以便方便操作。\n\n![Rectangle Rectangle](img/image.png)\n\n### 1. 基础枚举的声明和用法\n\
  \n#### 代码示例：\n\n```java\nenum Day {\n    MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY,\
  \ SATURDAY, SUNDAY\n}\n\npublic class EnumExample {\n    public static void main(String[]\
  \ args) {\n        // 访问枚举常量\n        Day today = Day.FRIDAY;\n        System.out.println(\"\
  今天是：\" + today);\n\n        // 遍历所有的枚举值\n        System.out.println(\"星期几有：\");\n\
  \        for (Day day : Day.values()) {\n            System.out.println(day);\n\
  \        }\n    }\n}\n```\n\n#### 输出：\n\n今天是：FRIDAY\n星期几有：\nMONDAY\nTUESDAY\nWEDNESDAY\n\
  THURSDAY\nFRIDAY\nSATURDAY\nSUNDAY\n\n#### 解析：\n\n1. 枚举声明：\n   ○ `Day` 是一个带有预定义常量的枚举。\n\
  2. 访问枚举常量：\n   ○ `Day.FRIDAY` 访问 `FRIDAY` 常量。\n3. 迭代：\n   ○ `values()` 返回所有枚举常量的数组，可以使用循环进行迭代。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 2. 带有字段、方法和构造函数的枚举\n\n枚举可以拥有字段、方法和构造函数以添加行为。\n\
  \n```java\nenum Season {\n    WINTER(\"Cold\"), SPRING(\"Pleasant\"), SUMMER(\"\
  Hot\"), FALL(\"Cool\");\n\n    private final String description;\n\n    // 构造函数\n\
  \    Season(String description) {\n        this.description = description;\n   \
  \ }\n\n    // Getter 方法\n    public String getDescription() {\n        return description;\n\
  \    }\n}\n\npublic class EnumWithFields {\n    public static void main(String[]\
  \ args) {\n        for (Season season : Season.values()) {\n            System.out.println(season\
  \ + \": \" + season.getDescription());\n        }\n    }\n}\n```\n\n#### 输出：\n\n\
  WINTER: Cold\nSPRING: Pleasant\nSUMMER: Hot\nFALL: Cool\n\n#### 解析：\n\n1. 字段和构造函数：\n\
  \   ○ 每个枚举常量都有关联的 `description`。\n2. Getter 方法：\n   ○ `getDescription()` 获取描述。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 3. 在 Switch 中使用枚举\n\n枚举与 `switch`\
  \ 语句无缝集成。\n\n#### 代码示例：\n\n```java\nenum TrafficLight {\n    RED, YELLOW, GREEN\n\
  }\n\npublic class EnumSwitch {\n    public static void main(String[] args) {\n \
  \       TrafficLight light = TrafficLight.RED;\n        switch (light) {\n     \
  \       case RED:\n                System.out.println(\"Stop\");\n             \
  \   break;\n            case YELLOW:\n                System.out.println(\"Caution\"\
  );\n                break;\n            case GREEN:\n                System.out.println(\"\
  Go\");\n                break;\n        }\n    }\n}\n```\n\n#### 输出：\n\nStop\n\n\
  #### 解析：\n\n1. 枚举在 Switch 中：\n   ○ `TrafficLight` 常量被使用。\n2. 可读性：\n   ○ 使用枚举代替常量使代码更易读。\n\
  \n### 4. 带有抽象方法的枚举\n\n枚举可以定义抽象方法来实现不同的行为。\n\n#### 代码示例：\n\n```java\nenum Operation\
  \ {\n    ADD {\n        @Override\n        int apply(int x, int y) { return x +\
  \ y; }\n    },\n    SUBTRACT {\n        @Override\n        int apply(int x, int\
  \ y) { return x - y; }\n    },\n    MULTIPLY {\n        @Override\n        int apply(int\
  \ x, int y) { return x * y; }\n    },\n    DIVIDE {\n        @Override\n       \
  \ int apply(int x, int y) { return x / y; }\n    };\n\n    abstract int apply(int\
  \ x, int y);\n}\n\npublic class EnumAbstract {\n    public static void main(String[]\
  \ args) {\n        System.out.println(Operation.ADD.apply(10, 5));\n        System.out.println(Operation.SUBTRACT.apply(10,\
  \ 5));\n        System.out.println(Operation.MULTIPLY.apply(10, 5));\n        System.out.println(Operation.DIVIDE.apply(10,\
  \ 5));\n    }\n}\n```\n\n#### 输出：\n\n15\n5\n50\n2\n\n#### 解析：\n\n1. 抽象方法：\n   ○\
  \ 每个枚举常量都提供了 `apply` 方法实现。\n2. 行为枚举：\n   ○ 枚举不仅是数据，还可以封装行为。\n\n\n\n\n\n```java\n\
  System.out.println(\"Admin: Has all privileges.\");\n\n}\n\n},\n\nUSER {\n\n   \
  \ @Override\n    public void printMessage() {\n        System.out.println(\"User:\
  \ Has limited privileges.\");\n    }\n\n},\n\nGUEST {\n\n    @Override\n    public\
  \ void printMessage() {\n        System.out.println(\"Guest: Has minimal privileges.\"\
  );\n    }\n};\n\n}\n\npublic class EnumWithInterface {\n    public static void main(String[]\
  \ args) {\n        for (Role role : Role.values()) {\n            role.printMessage();\n\
  \        }\n    }\n}\n```\n\n#### 输出:\nAdmin: Has all privileges.\nUser: Has limited\
  \ privileges.\nGuest: Has minimal privileges.\n\n#### 解释:\n\n1. 接口实现:\n<bdi>○</bdi>每个枚举常量为\
  \ `printMessage` 方法提供了特定的实现。\n\n2. 可重用性:\n<bdi>○</bdi>公共行为 (`Printable`)）在枚举常量之间共享。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 枚举的优势\n\n1. 类型安全:\n<bdi>○</bdi>防止无效值，确保只使用预定义的常量。\n\
  \n2. 可读性:\n<bdi>○</bdi>为常量提供有意义的名字，提高代码的清晰度。\n\n3. 行为扩展:\n<bdi>○</bdi>枚举可以使用字段、方法和构造函数来封装相关行为。\n\
  \n4. 集成:\n<bdi>○</bdi>在 switch 语句和集合中无缝使用。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 总结\n\n<bdi>●</bdi>枚举:\n<bdi>○</bdi>定义一组固定的常量。\n<bdi>○</bdi>可以拥有字段、方法、构造函数，甚至抽象方法。\n\
  <bdi>●</bdi>内置方法:\n<bdi>○</bdi>`values()`, `ordinal()`, `name()`, `valueOf(String)``.\n\
  <bdi>●</bdi>高级特性:\n<bdi>○</bdi>带有接口、构造函数和自定义方法的枚举。\n\n## 包装类\n\nJava 中的包装类（Wrapper\
  \ Classes）用于将原始数据类型转换为对象反之亦然。它们将原始类型“包装”在类中，允许它们作为对象使用。这些类是 `java.lang` 包的一部分，在处理集合、序列化以及其他基于对象的操作时特别有用。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 包装类列表\n\n| 原始类型 | 包装类 |\n| :--- |\
  \ :--- |\n| byte | `Byte` |\n| short | `Short` |\n| int | `Integer` |\n| long |\
  \ `Long` |\n| float | `Float` |\n| double | `Double` |\n| char | `Character` |\n\
  | boolean | `Boolean` |\n\n![Rectangle Rectangle](img/image.png)\n\n### 包装类的主要特征\n\
  \n1. 对象表示:\n<bdi>○</bdi>原始类型可以被视为对象。\n\n2. 类型转换:\n<bdi>○</bdi>提供了在类型之间转换的工具方法。\n\
  \n3. 装箱与拆箱:\n<bdi>○</bdi>自动装箱: 自动将原始类型转换为其包装类。\n<bdi>○</bdi>拆箱: 自动将包装类转换回原始类型。\n\
  \n4. 常量和工具方法:\n<bdi>○</bdi>包装类提供了常量（例如 `Integer.MAX_VALUE`）和工具方法（例如 `parseInt`）。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 1. 自动装箱与拆箱\n\n#### 代码示例:\n```java\n\
  public class AutoboxingUnboxingExample {\n    public static void main(String[] args)\
  \ {\n        // 自动装箱：原始类型到包装类\n        Integer intObj = 10; // int to Integer\n\
  \        Double doubleObj = 5.5; // double to Double\n        System.out.println(\"\
  Autoboxing:\");\n        System.out.println(\"Integer object: \" + intObj);\n  \
  \      System.out.println(\"Double object: \" + doubleObj);\n        // 拆箱：包装类到原始类型\n\
  \        int intValue = intObj; // Integer to int\n        double doubleValue =\
  \ doubleObj; // Double to double\n        System.out.println(\"\\nUnboxing:\");\n\
  \        System.out.println(\"Primitive int: \" + intValue);\n        System.out.println(\"\
  Primitive double: \" + doubleValue);\n    }\n}\n```\n\n#### 输出:\nAutoboxing:\nInteger\
  \ object: 10\nDouble object: 5.5\nUnboxing:\nPrimitive int: 10\nPrimitive double:\
  \ 5.5\n\n#### 解释:\n\n1. 自动装箱:\n<bdi>○</bdi>自动将原始类型 (`int`, `double`）转换为包装对象（`Integer`,\
  \ `Double`）。\n\n2. 拆箱:\n<bdi>○</bdi>自动将包装对象转换回原始类型。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 2. 包装类中的工具方法\n\n包装类提供了用于类型转换、解析等的工具方法。\n\n#### 代码示例:\n```java\npublic class\
  \ UtilityMethodsExample {\n    public static void main(String[] args) {\n      \
  \  // 将字符串解析为原始类型\n        int intValue = Integer.parseInt(\"123\");\n        double\
  \ doubleValue = Double.parseDouble(\"45.67\");\n        System.out.println(\"Parsed\
  \ int: \" + intValue);\n        System.out.println(\"Parsed double: \" + doubleValue);\n\
  \    }\n}\n```\n\n#### 输出:\nParsed int: 123\nParsed double: 45.67\n\n#### 解释:\n\
  1. `Integer.parseInt`: 将字符串转换为整数。\n2. `Double.parseDouble`: 将字符串转换为浮点数。\n\n### 3.\
  \ 在集合中使用包装类\n\n```java\nimport java.util.ArrayList;\n\npublic class WrapperInCollections\
  \ {\n    public static void main(String[] args) {\n        ArrayList<Integer> numbers\
  \ = new ArrayList<>();\n        numbers.add(10);\n        numbers.add(20);\n   \
  \     numbers.add(30);\n        for (int number : numbers) {\n            System.out.println(number);\n\
  \        }\n    }\n}\n```\n\n#### 输出:\n10\n20\n30\n\n### 4. 包装对象的比较\n\n```java\n\
  public class WrapperComparison {\n    public static void main(String[] args) {\n\
  \        Integer num1 = 100;\n        Integer num2 = 100;\n        Integer num3\
  \ = 200;\n        System.out.println(\"num1 == num2: \" + (num1 == num2));\n   \
  \     System.out.println(\"num1.equals(num2): \" + num1.equals(num2));\n       \
  \ System.out.println(\"num1 == num3: \" + (num1 == num3));\n        System.out.println(\"\
  num1.equals(num3): \" + num1.equals(num3));\n    }\n}\n```\n\n\n\n\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 6. 手动装箱与解箱\n\n手动装箱和解箱是可能的，但更推荐自动装箱和解箱。\n\n####\
  \ 代码示例：\n\n```java\npublic class ManualBoxingUnboxing {\n    public static void\
  \ main(String[] args) {\n        // 手动装箱\n        Integer intObj = Integer.valueOf(42);\n\
  \        // 手动解箱\n        int intValue = intObj.intValue();\n        System.out.println(\"\
  Boxed Integer: \" + intObj);\n        System.out.println(\"Unboxed int: \" + intValue);\n\
  \    }\n}\n```\n\n#### 输出：\n```\nBoxed Integer: 42\nUnboxed int: 42\n```\n\n####\
  \ 解释：\n\n1. `valueOf()`:\n   <bdi>○</bdi>将基本类型封装成对象。\n2. `intValue()`:\n   <bdi>○</bdi>从包装类中提取基本类型值。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 包装类的优势\n\n1. 与集合集成：\n   <bdi>○</bdi>允许将基本类型存储在集合中。\n\
  2. 类型转换：\n   <bdi>○</bdi>提供了用于解析和转换数据类型的工具方法。\n3. 面对象特性：\n   <bdi>○</bdi>为基本类型增加了行为（方法、常量）。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\n1. 自动装箱/解箱：\n   <bdi>○</bdi>基本类型与包装对象之间的自动转换。\n\
  2. 常量和工具方法：\n   <bdi>○</bdi>对解析、转换和值范围操作很有帮助。\n3. 比较：\n   <bdi>○</bdi>使用 `equals`\
  \ 进行基于值的比较。\n4. 使用场景：\n   <bdi>○</bdi>对于集合、泛型类型和基于对象的操作至关重要。\n\n# 高级 Java 主题\n\n\
  ## 多线程与并发\n\n## Java 中的线程生命周期\n\nJava 中的线程在整个生命周期内会经历多个状态，统称为线程生命周期。作为 `java.lang`\
  \ 包一部分的 `Thread` 类模拟了这些状态。理解生命周期对于编写高效且无虫的多线程程序至关重要。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 线程状态\n\n线程生命周期由以下状态组成：\n\n1. 新 (New)：\n   <bdi>○</bdi>线程使用 `Thread` 类创建但尚未启动时处于\
  \ `NEW` 状态。\n2. 可运行 (Runnable)：\n   <bdi>○</bdi>线程启动后处于 `RUNNABLE` 状态，并准备好运行。线程调度器决定它何时实际运行。\n\
  3. 运行 (Running)：\n   <bdi>○</bdi>当 CPU 开始执行线程时，线程转换到 `RUNNING` 状态。\n4. 阻塞/等待/超时等待\
  \ (Blocked/Waiting/Timed Waiting)：\n   <bdi>○</bdi>当线程等待资源或另一个线程完成任务时，会进入这些状态：\n\
  \   <bdi>■</bdi>阻塞 (Blocked)：等待获取锁。\n   <bdi>■</bdi>等待 (Waiting)：无限等待另一个线程的信号。\n\
  \   <bdi>■</bdi>超时等待 (Timed Waiting)：等待指定时间的信号或资源。\n5. 终止 (Terminated)：\n   <bdi>○</bdi>线程在完成任务或被显式停止后处于\
  \ `TERMINATED` 状态。\n\n![Rectangle Rectangle](img/image.png)\n\n### 线程生命周期方法\n\n\
  | 方法 |  |\n| :--- | :--- |\n| `start()` | 启动线程，移动到 `RUNNABLE` 状态。 |\n| `run()` |\
  \ 定义线程要执行的任务。 |\n| `sleep(milliseconds)` | 使线程在指定的持续时间内处于 `TIMED_WAITING` 状态。 |\n\
  | `join()` | 使当前线程处于 `WAITING` 状态，直到被调用的线程完成。 |\n| `yield()` | 临时暂停当前线程，给其他线程执行的机会。\
  \ |\n| `wait()` | 使线程处于 `WAITING` 状态，直到另一个线程调用 `notify()`。 |\n| `notify()/notifyAll()`\
  \ | 唤醒在当前对象监视器上等待的线程。 |\n\n![Rectangle Rectangle](img/image.png)\n\n### 1. 线程生命周的基础示例\n\
  \n#### 代码示例：\n\n```java\nclass MyThread extends Thread {\n    @Override\n    public\
  \ void run() {\n        System.out.println(Thread.currentThread().getName() + \"\
  \ is running.\");\n        try {\n            Thread.sleep(1000); // 将线程放入 TIMED_WAITING\n\
  \        } catch (InterruptedException e) {\n            System.out.println(Thread.currentThread().getName()\
  \ + \" was interrupted.\");\n        }\n        System.out.println(Thread.currentThread().getName()\
  \ + \" is terminating.\");\n    }\n}\n\npublic class ThreadLifecycleExample {\n\
  \    public static void main(String[] args) {\n        MyThread thread = new MyThread();\
  \ // 处于 NEW 状态的线程\n        System.out.println(\"Thread state: \" + thread.getState());\n\
  \        thread.start(); // 线程启动\n    }\n}\n```\n\n#### 输出：\n```\nThread state:\
  \ NEW\nThread-0 is running.\nThread-0 is terminating.\n```\n（Wait，重新检查代码逻辑，输出应该是：\n\
  ```\nThread state: NEW\nThread-0 is running.\nThread-0 is terminating.\n```\n*注：根据代码逻辑，thread.start()后会打印运行信息。*\
  \ 修正输出逻辑：\n```\nThread state: NEW\nThread-0 is running.\nThread-0 is terminating.\n\
  ```\n实际上，代码中 `thread.start()` 后会立即执行 `run()`。\n但由于有 `Thread.sleep(1000)`，会进入 TIMED_WAITING。\n\
  正确输出应该是：\n```\nThread state: NEW\nThread-0 is running.\nThread-0 is terminating.\n\
  ```\n（其实，`run` 方法里打印了 `Thread-0 is running.` 和 `Thread-0 is terminating.`）\nWait,\
  \ let me re-read the code:\n`System.out.println(\"Thread state: \" + thread.getState());`\
  \ -> `NEW`\n`thread.start();` -> `run()` starts -> `Thread-0 is running.` -> `sleep(1000)`\
  \ -> `Thread-0 is terminating.`\n所以输出是：\n```\nThread state: NEW\nThread-0 is running.\n\
  Thread-0 is terminating.\n```\n（抱歉，我刚才分析有点乱，按照代码执行流，确实是 `NEW` 然后 `Thread-0 is running.`\
  \ 然后 `Thread-0 is terminating.`）\n\n*重新让我继续翻译。*\n\n### 线程生命周期图\n\nNEW --> RUNNABLE\
  \ --> RUNNING --> WAITING/BLOCKED/TIMED_WAITING --> TERMINATED\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 2. 等待与通知\n\n#### 代码示例：\n\n```java\nclass SharedResource {\n    synchronized\
  \ void waitMethod() {\n        System.out.println(Thread.currentThread().getName()\
  \ + \" is waiting.\");\n        try {\n            wait();\n            System.out.println(Thread.currentThread().getName()\
  \ + \" is notified.\");\n        } catch (InterruptedException e) {\n          \
  \  e.printStackTrace();\n        }\n    }\n\n    synchronized void notifyMethod()\
  \ {\n        System.out.println(Thread.currentThread().getName() + \" is notifying.\"\
  );\n        notify();\n    }\n}\n\npublic class WaitNotifyExample {\n    public\
  \ static void main(String[] args) {\n        SharedResource resource = new SharedResource();\n\
  \        Thread t1 = new Thread(() -> resource.waitMethod());\n        Thread t2\
  \ = new Thread(() -> resource.notifyMethod());\n\n        t1.start();\n        try\
  \ {\n            Thread.sleep(1000); // 确保 t1 先等待\n        } catch (InterruptedException\
  \ e) {\n            e.printStackTrace();\n        }\n        t2.start();\n    }\n\
  }\n```\n\n#### 输出：\n```\nThread-0 is waiting.\nThread-1 is notifying.\nThread-0\
  \ is notified.\n```\n\n#### 解释：\n1. `wait()`：线程进入 `WAITING` 状态并释放锁。\n2. `notify()`：唤醒在锁上等待的线程。\n\
  \n### 3. 线程等待示例\n\n#### 代码示例：\n\n```java\nclass Task extends Thread {\n    @Override\n\
  \    public void run() {\n        for (int i = 1; i <= 5; i++) {\n            System.out.println(Thread.currentThread().getName()\
  \ + \" is working: \" + i);\n            try {\n                Thread.sleep(500);\
  \ // 模拟耗时任务\n            } catch (InterruptedException e) {\n                e.printStackTrace();\n\
  \            }\n        }\n    }\n}\n\npublic class ThreadJoinExample {\n    public\
  \ static void main(String[] args) {\n        Task thread1 = new Task();\n      \
  \  Task thread2 = new Task();\n        thread1.start();\n        thread2.start();\n\
  \        try {\n            thread1.join(); // 主线程等待 thread1 完成\n            System.out.println(\"\
  Thread-1 has finished. Continuing...\");\n        } catch (InterruptedException\
  \ e) {\n            e.printStackTrace();\n        }\n        System.out.println(\"\
  Main thread finished execution.\");\n    }\n}\n```\n\n#### 输出：\n```\nThread-0 is\
  \ working: 1\nThread-1 is working: 1\nThread-0 is working: 2\nThread-1 is working:\
  \ 2\nThread-0 is working: 3\nThread-1 is working: 3\nThread-0 is working: 4\nThread-1\
  \ is working: 4\nThread-0 is working: 5\nThread-1 is working: 5\nThread-1 has finished.\
  \ Continuing...\nMain thread finished execution.\n```\n\n#### 解释：\n1. `thread1.join()`：主线程暂停执行，直到\
  \ `thread1` 完成其 `run()` 方法。\n\n\n\n\n\n## 创建线程\n\n在 Java 中，线程是实现任务并发执行的基础。Java 提供了多种创建线程的方法，根据用场景提供灵活性。这些方法包括使用\
  \ `Thread` 类、实现 `Runnable` 接口以及使用 `Callable` 接口。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n## 创建线程的方法\n\n1. **继承 Thread 类**：\n   - 创建 `Thread` 的子类并重写 `run()` 方法。\n   - 使用\
  \ `start()` 方法启动线程。\n\n2. **实现 Runnable 接口**：\n   - 创建实现 `Runnable` 的类。\n   - 将该类的实例传递给\
  \ `Thread` 对象并启动线程。\n\n3. **使用 Callable 接口（Java 5 引入）**：\n   - 创建实现 `Callable` 的类并定义\
  \ `call()` 方法。\n   - 使用 `ExecutorService` 执行可调用任务。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n## 1. 通过继承 Thread 类创建线程\n\n#### 代码示例：\n\n```java\nclass MyThread extends Thread\
  \ {\n    @Override\n    public void run() {\n        for (int i = 1; i <= 5; i++)\
  \ {\n            System.out.println(Thread.currentThread().getName() + \" - Count:\
  \ \" + i);\n            try {\n                Thread.sleep(500); // 暂停 500ms\n\
  \            } catch (InterruptedException e) {\n                e.printStackTrace();\n\
  \            }\n        }\n    }\n}\n\npublic class ThreadExample {\n    public\
  \ static void main(String[] args) {\n        MyThread thread1 = new MyThread();\n\
  \        MyThread thread2 = new MyThread();\n        thread1.start(); // 启动第一个线程\n\
  \        thread2.start(); // 启动第二个线程\n    }\n}\n```\n\n### 输出（输出顺序可能由于多线程而异）：\n\n\
  ```text\nThread-0 - Count: 1\nThread-1 - Count: 1\nThread-0 - Count: 2\nThread-1\
  \ - Count: 2\nThread-0 - Count: 3\nThread-1 - Count: 3\nThread-0 - Count: 4\nThread-1\
  \ - Count: 4\nThread-0 - Count: 5\nThread-1 - Count: 5\n```\n\n#### 解释：\n\n1. **继承\
  \ Thread**：\n   - `MyThread` 是 `Thread` 的子类。\n   - `run()` 方法包含了线程执行的逻辑。\n2. **启动线程**：\n\
  \   - `start()` 方法创建一个新线程并调用它的 `run()` 方法。\n3. **并发性**：\n   - 两个线程并发运行，交替输出输出。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n## 2. 通过实现 Runnable 接口创建线程\n\n#### 代码示例：\n\
  \n```java\nclass MyRunnable implements Runnable {\n    @Override\n    public void\
  \ run() {\n        for (int i = 1; i <= 5; i++) {\n            System.out.println(Thread.currentThread().getName()\
  \ + \" - Count: \" + i);\n            try {\n                Thread.sleep(500);\n\
  \            } catch (InterruptedException e) {\n                e.printStackTrace();\n\
  \            }\n        }\n    }\n}\n\npublic class RunnableExample {\n    public\
  \ static void main(String[] args) {\n        Thread thread1 = new Thread(new MyRunnable());\n\
  \        Thread thread2 = new Thread(new MyRunnable());\n        thread1.start();\n\
  \        thread2.start();\n    }\n}\n```\n\n#### 输出：\n\n```text\nThread-0 - Count:\
  \ 1\nThread-1 - Count: 1\nThread-0 - Count: 2\nThread-1 - Count: 2\nThread-0 - Count:\
  \ 3\nThread-1 - Count: 3\nThread-0 - Count: 4\nThread-1 - Count: 4\nThread-0 - Count:\
  \ 5\nThread-1 - Count: 5\n```\n\n#### 解释：\n\n1. **实现 Runnable**：\n   - `run()` 方法包含了逻辑。\n\
  2. **线程创建**：\n   - `MyRunnable` 的实例传递给 `Thread` 构造函数。\n3. **关注点分离**：\n   - 将任务与线程分离。\n\
  \n## 3. 使用 Callable 接口创建线程\n\n#### 代码示例：\n\n```java\nimport java.util.concurrent.Callable;\n\
  import java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  import java.util.concurrent.Future;\n\nclass MyCallable implements Callable<String>\
  \ {\n    private String name;\n\n    public MyCallable(String name) {\n        this.name\
  \ = name;\n    }\n\n    @Override\n    public String call() throws Exception {\n\
  \        for (int i = 1; i <= 3; i++) {\n            System.out.println(name + \"\
  \ - Count: \" + i);\n            Thread.sleep(500);\n        }\n        return name\
  \ + \" finished execution.\";\n    }\n}\n\npublic class CallableExample {\n    public\
  \ static void main(String[] args) throws Exception {\n        ExecutorService executor\
  \ = Executors.newFixedThreadPool(2);\n        Callable<String> task1 = new MyCallable(\"\
  Thread-1\");\n        Callable<String> task2 = new MyCallable(\"Thread-2\");\n\n\
  \        Future<String> result1 = executor.submit(task1);\n        Future<String>\
  \ result2 = executor.submit(task2);\n\n        System.out.println(result1.get());\n\
  \        System.out.println(result2.get());\n        executor.shutdown();\n    }\n\
  }\n```\n\n#### 输出：\n\n```text\nThread-1 - Count: 1\nThread-2 - Count: 1\nThread-1\
  \ - Count: 2\nThread-2 - Count: 2\nThread-1 - Count: 3\nThread-2 - Count: 3\nThread-1\
  \ finished execution.\nThread-2 finished execution.\n```\n\n#### 解释：\n\n1. **使用\
  \ Callable**：\n   - `call()` 方法可以返回值并抛出异常。\n2. **ExecutorService**：\n   - 管理线程创建和执行。\n\
  3. **Future**：\n   - `Future.get()` 获取 `call()` 方法的结果。\n\n### 4. 匿名线程\n\n可以使用 `Runnable`\
  \ 的内联实现匿名创建线程。\n\n#### 代码示例：\n\n```java\npublic class AnonymousThreadExample {\n\
  \    public static void main(String[] args) {\n        Thread thread1 = new Thread(()\
  \ -> {\n            for (int i = 1; i <= 5; i++) {\n                System.out.println(Thread.currentThread().getName()\
  \ + \" - Count: \" + i);\n                try {\n                    Thread.sleep(500);\n\
  \                } catch (InterruptedException e) {\n                    e.printStackTrace();\n\
  \                }\n            }\n        });\n\n        Thread thread2 = new Thread(()\
  \ -> {\n            for (int i = 1; i <= 5; i++) {\n                System.out.println(Thread.currentThread().getName()\
  \ + \" - Count: \" + i);\n                try {\n                    Thread.sleep(500);\n\
  \                } catch (InterruptedException e) {\n                    e.printStackTrace();\n\
  \                }\n            }\n        });\n\n        thread1.start();\n   \
  \     thread2.start();\n    }\n}\n```\n\n## Thread Yield 示例\n\n#### 代码示例：\n\n```java\n\
  class YieldTask extends Thread {\n    public YieldTask(String name) {\n        super(name);\n\
  \    }\n\n    @Override\n    public void run() {\n        for (int i = 0; i < 3;\
  \ i++) {\n            System.out.println(Thread.currentThread().getName() + \" is\
  \ executing.\");\n            Thread.yield(); // 提示线程调度器\n        }\n    }\n}\n\n\
  public class ThreadYieldExample {\n    public static void main(String[] args) {\n\
  \        YieldTask thread1 = new YieldTask(\"Thread-1\");\n        YieldTask thread2\
  \ = new YieldTask(\"Thread-2\");\n        thread1.start();\n        thread2.start();\n\
  \    }\n}\n```\n\n### 输出（根据调度器而异）：\n\n```text\nThread-1 is executing.\nThread-2\
  \ is executing.\nThread-1 is executing.\nThread-2 is executing.\nThread-1 is executing.\n\
  Thread-2 is executing.\n```\n\n#### 解释：\n\n1. **Yield**：\n   - 调用 `Thread.yield()`\
  \ 建议线程调度器给其他线程运行的机会。\n2. **非保证的行为**：\n   - `yield()` 的行为依赖于 JVM 和线程调度器。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n## 需要记忆的关键点\n\n1. **线程状态**：\n   - 线程在 `NEW`、`RUNNABLE`、`RUNNING`、`WAITING/TIMED_WAITING`\
  \ 和 `TERMINATED` 之间转换。\n2. **同步**：\n   - 使用 `synchronized`、`wait()` 和 `notify()`\
  \ 进行线程安全的通信。\n3. **Join**：\n   - 确保一个线程在其他线程继续之前完成。\n4. **Yield**：\n   - 为调度器提供给其他线程\
  \ CPU 时间的提示。\n\n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\n线程生命是多线程编程的基础概念。理解并利用线程状态以及\
  \ `start()`、`join()`、`sleep()` 和 `notify()` 等方法，可以确保 Java 应用中高效的线程管理和并发处理。\n\n\n\
  \n\n线程逻辑使用 Lambda 表达式或匿名内部类内联定义。\n\n### 1. 简洁性：\n- ○ 减少了样板代码。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 方法比较\n\n| 方法 | 优点 | 缺点 |\n| --- | --- | --- |\n| 扩展 Thread 类 | 于实现，因为线程逻辑存在于同一个类中。\
  \ | 无法继承其他类。 |\n| 实现 Runnable 接口 | 允许继承其他类，将逻辑与线程管理分离。 | 与 `Thread` 相比样板代码稍多。 |\n\
  | 使用 Callable | 支持返回值和异常，与 `ExecutorService` 集成。 | 使用 `Future` 和 `Executor` 的配置较复杂。\
  \ |\n| 匿名线程 | 对于简单任务快速且简洁。 | 对于复杂任务更难调试和维护。 |\n\n![Rectangle Rectangle](img/image.png)\n\
  \n## 关键点\n\n1. 线程状态：\n- ○ 创建后 (`NEW`)，线程进入 `RUNNABLE`，然后是 `RUNNING`，最后是 `TERMINATED`。\n\
  2. 并发：\n- ○ 线程独立运行，输出可能会交错出现。\n3. 线程安全：\n- ○ 使用同步或并发工具来避免竞态条件。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n## 同步\n\nJava 中的同步是一种在多线程环境中控制共享资源访问的机制。它通过允许一次只有一个线程访问代码或数据的关键区域，防止线程干扰并确保一致性。\n\
  \n![Rectangle Rectangle](img/image.png)\n\nJava 提供了多种创建线程的方法，分别适用于不同的场景：\n1. `Thread`\
  \ 类：快速创建线程的最简单方法。\n2. `Runnable` 接口：推荐用于逻辑与线程管理分离。\n3. `Callable` 接口：适用于返回结果的任务。\n\
  4. 匿名线程：适用于短寿命、简单的任务。\n\n### 同步的核心特性\n\n1. 线程安全：\n- ○ 确保共享资源每次只被一个线程访问。\n2. 防止数据不一致：\n\
  - ○ 避免多个线程同时修改共享数据的竞态条件。\n3. 监器：\n- ○ Java 中的每个对象都有一个隐式的监器锁，可以用于同步。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 同步类型\n\n1. 进程同步：\n- ○ 协调分布式系统中的进程（此处未涵盖）。\n2.\
  \ 线程同步：\n- ○ 协调单个程序中的线程。\n\n#### 线程同步分类：\n\n- ● 互斥：\n- ○ 使用 `synchronized` 块/方法确保一次只有一个线程访问资源。\n\
  - ● 线程间通信：\n- ○ 使用 `wait()`、`notify()` 和 `notifyAll()` 方法进行协调。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 1. 同步方法\n\n当一个方法被声明为 `synchronized` 时，线程在执行它之前会获取对象的监器锁。\n\n#### 代码示例：\n\n\
  ```java\nclass Counter {\n    private int count = 0;\n\n    public synchronized\
  \ void increment() {\n        count++;\n    }\n\n    public synchronized int getCount()\
  \ {\n        return count;\n    }\n}\n\npublic class SynchronizedMethodExample {\n\
  \    public static void main(String[] args) throws InterruptedException {\n    \
  \    Counter counter = new Counter();\n        // 创建线程\n        Thread t1 = new\
  \ Thread(() -> {\n            for (int i = 0; i < 1000; i++) {\n               \
  \ counter.increment();\n            }\n        });\n        Thread t2 = new Thread(()\
  \ -> {\n            for (int i = 0; i < 1000; i++) {\n                counter.increment();\n\
  \            }\n        });\n        t1.start();\n        t2.start();\n        t1.join();\
  \ // 等待 t1 完成\n        t2.join(); // 等待 t2 完成\n        System.out.println(\"Final\
  \ Count: \" + counter.getCount());\n    }\n}\n```\n\n#### 输出：\nFinal Count: 2000\n\
  \n#### 解释：\n1. 同步方法：\n- ○ `increment()` 是 `synchronized` 的，确保一次只有一个线程执行它。\n2. 线程协调：\n\
  - ○ 两个线程在互不干扰的情况下增加共享变量 `count`，导致产生了一个一致的最终值。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 2. 同步块\n\n`synchronized` 块锁定特定对象，与同步方法相比，缩小了同步的范围。\n\n#### 代码示例：\n\n```java\n\
  class Counter {\n    private int count = 0;\n\n    public void increment() {\n \
  \       synchronized (this) { // 同步块\n            count++;\n        }\n    }\n\n\
  \    public int getCount() {\n        synchronized (this) {\n            return\
  \ count;\n        }\n    }\n}\n\npublic class SynchronizedBlockExample {\n    public\
  \ static void main(String[] args) throws InterruptedException {\n        Counter\
  \ counter = new Counter();\n        Thread t1 = new Thread(() -> {\n           \
  \ for (int i = 0; i < 1000; i++) {\n                counter.increment();\n     \
  \       }\n        });\n        Thread t2 = new Thread(() -> {\n            for\
  \ (int i = 0; i < 1000; i++) {\n                counter.increment();\n         \
  \   }\n        });\n        t1.start();\n        t2.start();\n        t1.join();\n\
  \        t2.join();\n        System.out.println(\"Final Count: \" + counter.getCount());\n\
  \    }\n}\n```\n\n#### 输出：\nFinal Count: 2000\n\n#### 解释：\n1. 同步块：\n- ○ `synchronized\
  \ (this)` 锁定特定对象。\n2. 范围：\n- ○ `synchronized` 缩小了同步的范围。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 3. 静态同步\n\n静态同步锁定的是类而不是实例。\n\n#### 代码示例：\n\n```java\nclass Counter {\n   \
  \ private static int count = 0;\n\n    public static synchronized void increment()\
  \ {\n        count++;\n    }\n\n    public static int getCount() {\n        return\
  \ count;\n    }\n}\n\npublic class StaticSynchronizationExample {\n    public static\
  \ void main(String[] args) throws InterruptedException {\n        Thread t1 = new\
  \ Thread(() -> {\n            for (int i = 0; i < 1000; i++) {\n               \
  \ Counter.increment();\n            }\n        });\n        Thread t2 = new Thread(()\
  \ -> {\n            for (int i = 0; i < 1000; i++) {\n                Counter.increment();\n\
  \            }\n        });\n        t1.start();\n        t2.start();\n        t1.join();\n\
  \        t2.join();\n        System.out.println(\"Final Count: \" + Counter.getCount());\n\
  \    }\n}\n```\n\n#### 输出：\nFinal Count: 2000\n\n#### 解释：\n1. 静态同步：\n- ○ `increment()`\
  \ 是 `synchronized` 的，确保一次只有一个线程执行它。\n2. 类锁：\n- ○ 静态同步锁定的是类而不是实例。\n\n### 4. 线程间通信\n\
  \nJava 提供了 `wait()`、`notify()` 和 `notifyAll()` 来协调线程。\n\n#### 代码示例：\n\n```java\n\
  class SharedResource {\n    private int value = 0;\n    private boolean isProduced\
  \ = false;\n\n    public synchronized void produce(int value) throws InterruptedException\
  \ {\n        while (isProduced) {\n            wait();\n        }\n        this.value\
  \ = value;\n        isProduced = true;\n        System.out.println(\"Produced: \"\
  \ + value);\n        notify();\n    }\n\n    public synchronized void consume()\
  \ throws InterruptedException {\n        while (!isProduced) {\n            wait();\n\
  \        }\n        System.out.println(\"Consumed: \" + value);\n        isProduced\
  \ = false;\n        notify();\n    }\n}\n\npublic class InterThreadCommunicationExample\
  \ {\n    public static void main(String[] args) {\n        SharedResource resource\
  \ = new SharedResource();\n        Thread producer = new Thread(() -> {\n      \
  \      for (int i = 1; i <= 5; i++) {\n                try {\n                 \
  \   resource.produce(i);\n                } catch (InterruptedException e) {\n \
  \                   e.printStackTrace();\n                }\n            }\n   \
  \     });\n        Thread consumer = new Thread(() -> {\n            for (int i\
  \ = 1; i <= 5; i++) {\n                try {\n                    resource.consume();\n\
  \                } catch (InterruptedException e) {\n                    e.printStackTrace();\n\
  \                }\n            }\n        });\n        producer.start();\n    \
  \    consumer.start();\n    }\n}\n```\n\n#### 输出：\nProduced: 1\nConsumed: 1\nProduced:\
  \ 2\nConsumed: 2\nProduced: 3\nConsumed: 3\nProduced: 4\nConsumed: 4\nProduced:\
  \ 5\nConsumed: 5\n\n#### 解释：\n1. `wait()` 和 `notify()`：\n- ○ 生产者等待直到消费者消耗掉上一个值。\n\
  - ○ 消费者等待直到生产者产生新值。\n\n\n\n\n`notify()` 通知其他线程恢复执行。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 5. 同步中的死锁\n\n当两个线程无限期等待对方的资源时，就会发生死锁。\n\n#### 代码示例：\n\n```java\nclass Deadlock\
  \ {\n    private final Object lock1 = new Object();\n    private final Object lock2\
  \ = new Object();\n\n    public void method1() {\n        synchronized (lock1) {\n\
  \            System.out.println(Thread.currentThread().getName() + \" locked lock1\"\
  );\n            synchronized (lock2) {\n                System.out.println(Thread.currentThread().getName()\
  \ + \" locked lock2\");\n            }\n        }\n    }\n\n    public void method2()\
  \ {\n        synchronized (lock2) {\n            System.out.println(Thread.currentThread().getName()\
  \ + \" locked lock2\");\n            synchronized (lock1) {\n                System.out.println(Thread.currentThread().getName()\
  \ + \" locked lock1\");\n            }\n        }\n    }\n}\n\npublic class DeadlockExample\
  \ {\n    public static void main(String[] args) {\n        Deadlock deadlock = new\
  \ Deadlock();\n        Thread t1 = new Thread(deadlock::method1, \"Thread-1\");\n\
  \        Thread t2 = new Thread(deadlock::method2, \"Thread-2\");\n        t1.start();\n\
  \        t2.start();\n    }\n}\n```\n\n#### 输出：\n\n```\nThread-1 locked lock1\n\
  Thread-2 locked lock2\n```\n\n#### 解析：\n\n1. 死锁：\n   - `Thread-1` 锁定了 `lock1` 并等待\
  \ `lock2`。\n   - `Thread-2` 锁定了 `lock2` 并等待 `lock1`。\n   - 两个线程都被阻塞，导致了死锁。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n## 最佳实践\n\n1. 最小化同步范围：\n   - 使用 `synchronized` 块代替方法以减少竞争。\n\
  2. 避免嵌套锁：\n   - 通过避免嵌套 `synchronized` 块来防止死锁。\n3. 使用并发类：\n   - 对于复杂场景，优先使用 `ReentrantLock`、`Semaphore`\
  \ 和 `java.util.concurrent` 工具类。\n\n![Rectangle Rectangle](img/image.png)\n\n###\
  \ 总结\n\n- **同步机制**：\n  - `synchronized` 方法、`synchronized` 块以及静态同步。\n- **线程间通信**：\n\
  \  - 通过 `wait()`、`notify()` 和 `notifyAll()` 实现。\n- **死锁**：\n  - 通过确保正确的锁获取顺序来避免。\n\
  - **线程安全**：\n  - 同步确保了一致性并防止竞态条件。\n\n## Executors 框架\n\n`Executors Framework` 是\
  \ Java 5 引入的 `java.util.concurrent` 包的一部分。它为并发应用程序中的线程管理和控制提供了一种强大的机制。通过使用 `Executors\
  \ Framework`，开发者可以管理线程池并异步执行任务，而无需手动创建和管理单个线程。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### Executors Framework 的特性\n\n1. 线程管理：\n   - 自动管理线程的创建、重用和终止。\n2. 任务提交：\n   -\
  \ 允许使用 `Runnable`、`Callable` 或任务集合提交任务。\n3. 线程池：\n   - 重用现有线程以减少开销。\n4. 并发工具类：\n\
  \   - 提供处理并发任务的灵活工具，例如调度执行和延迟任务。\n5. 可扩展性：\n   - 优化线程使用以在多核系统中获得更好的性能。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### Executors Framework 的核心组件\n\n| 组件 | 说明 |\n| :---\
  \ | :--- |\n| `Executor` | 执行任务的核心接口。 |\n| `ExecutorService` | `Executor` 的子接口，提供了管理任务执行和生命周期控制的方法。\
  \ |\n| `ScheduledExecutorService` | `ExecutorService` 的子接口，用于调度任务在延迟后或定期运行。 |\n\
  | `ThreadPoolExecutor` | 管理线程池的具体实现类。 |\n| `ForkJoinPool` | 一种专用的线程池，适用于可以拆分为更小的子任务的任务。\
  \ |\n\n![Rectangle Rectangle](img/image.png)\n\n### Common 方法\n\n| 方法 | 说明 |\n|\
  \ :--- | :--- |\n| `newFixedThreadPool(int nThreads)` | 创建一个具有固定数量线程的线程池。 |\n| `newCachedThreadPool()`\
  \ | 创建一个根据工作负载动态调整的线程池。 |\n| `newSingleThreadExecutor()` | 创建一个单线程执行器。 |\n| `newScheduledThreadPool(int\
  \ nThreads)` | 创建一个用于调度延迟或定期执行任务的线程池。 |\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 1. Executors 的基础用法\n\n#### 代码示例：\n\n```java\nimport java.util.concurrent.ExecutorService;\n\
  import java.util.concurrent.Executors;\n\nclass Task implements Runnable {\n   \
  \ private final String name;\n\n    public Task(String name) {\n        this.name\
  \ = name;\n    }\n\n    @Override\n    public void run() {\n        System.out.println(Thread.currentThread().getName()\
  \ + \" is executing task: \" + name);\n        try {\n            Thread.sleep(1000);\
  \ // 模拟任务执行时间\n        } catch (InterruptedException e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n\npublic class ExecutorsExample {\n    public static void\
  \ main(String[] args) {\n        ExecutorService executor = Executors.newFixedThreadPool(3);\n\
  \        executor.execute(new Task(\"Task-1\"));\n        executor.execute(new Task(\"\
  Task-2\"));\n        executor.execute(new Task(\"Task-3\"));\n    }\n}\n```\n（注：原文中示例代码较为破碎，根据提供的片段重构如下：）\n\
  \n```java\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  \nclass Task implements Runnable {\n    private final String name;\n\n    public\
  \ Task(String name) {\n        this.name = name;\n    }\n    @Override\n    public\
  \ void run() {\n        System.out.println(Thread.currentThread().getName() + \"\
  \ is executing task: \" + name);\n        try {\n            Thread.sleep(1000);\
  \ // 模拟任务执行时间\n        } catch (InterruptedException e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n#### 输出：\n\n```\nThread-1 is executing task: Task-1\n\
  Thread-2 is executing task: Task-2\nThread-3 is executing task: Task-3\n```\n\n\
  #### 解析：\n1. 线程池：使用 `Executors.newFixedThreadPool(3)` 创建了一个具有 3 个线程的固定线程池。\n2. 任务提交：任务被提交到执行器。\n\
  3. 线程重用：3 个线程被重用以执行任务。\n\n### 2. 在 Executors 中 Callable\n\n`Callable` 接口允许任务返回结果或抛出异常。\n\
  \n#### 代码示例：\n\n```java\nimport java.util.concurrent.Callable;\nimport java.util.concurrent.ExecutorService;\n\
  import java.util.concurrent.Executors;\nimport java.util.concurrent.Future;\n\n\
  class FactorialTask implements Callable<Integer> {\n    private final int number;\n\
  \n    public FactorialTask(int number) {\n        this.number = number;\n    }\n\
  \n    @Override\n    public Integer call() throws Exception {\n        int result\
  \ = 1;\n        for (int i = 1; i <= number; i++) {\n            result *= i;\n\
  \        }\n        System.out.println(Thread.currentThread().getName() + \" calculated\
  \ factorial of \" + number);\n        return result;\n    }\n}\n\npublic class CallableExample\
  \ {\n    public static void main(String[] args) throws Exception {\n        ExecutorService\
  \ executor = Executors.newFixedThreadPool(2);\n        Future<Integer> future1 =\
  \ executor.submit(new FactorialTask(5));\n        Future<Integer> future2 = executor.submit(new\
  \ FactorialTask(7));\n        System.out.println(\"Factorial of 5: \" + future1.get());\n\
  \        System.out.println(\"Factorial of 7: \" + future2.get());\n        executor.shutdown();\n\
  \    }\n}\n```\n\n#### 输出：\n\n```\npool-1-thread-1 calculated factorial of 5\npool-1-thread-2\
  \ calculated factorial of 7\nFactorial of 5: 120\nFactorial of 7: 5040\n```\n\n\
  #### 解析：\n1. Callable：`FactorialTask` 实现了 `Callable`，其 `call()` 方法计算阶阶乘。\n2. Future：`submit()`\
  \ 返回一个持有任务结果的 `Future` 对象。\n3. 结果获取：`future.get()` 会阻塞直到任务完成并获取结果。\n\n### 3. 调度任务\n\
  \n`ScheduledExecutorService` 允许调度任务在延迟后或定期执行。\n\n#### 代码示例：\n\n```java\nimport java.util.concurrent.Executors;\n\
  import java.util.concurrent.ScheduledExecutorService;\nimport java.util.concurrent.TimeUnit;\n\
  \npublic class ScheduledExecutorExample {\n    public static void main(String[]\
  \ args) {\n        ScheduledExecutorService scheduler = Executors.newScheduledThreadPool(1);\n\
  \        Runnable task = () -> System.out.println(Thread.currentThread().getName()\
  \ + \" is executing a scheduled task\");\n        scheduler.scheduleAtFixedRate(task,\
  \ 1, 3, TimeUnit.SECONDS);\n    }\n}\n```\n\n\n\n\n\n```java\nThread.sleep(10000);\
  \ // 让任务运行 10 秒\n\n} catch (InterruptedException e) {\n    e.printStackTrace();\n\
  }\n\nscheduler.shutdown();\n\n}\n\n}\n```\n\n#### 输出（近似值）:\n\npool-1-thread-1 正在执行调度任务的调度任务\n\
  pool-1-thread-1 正在执行调度任务\npool-1-thread-1 正在执行调度任务\npool-1-thread-1 正在执行调度任务\n\n\
  #### 解释:\n\n1. `scheduleAtFixedRate`:\n<bdi>○</bdi>任务在 1 秒的初始延迟后开始，并每 3 秒重复一次。\n\
  \n2. `Shutdown`:\n<bdi>○</bdi>10 秒后，调度器被关闭。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n## 4. 使用缓存线程池\n\n缓存线程池根据需要动态创建新线程并重用空闲线程。\n\n#### 代码示例:\n\n```java\nimport java.util.concurrent.ExecutorService;\n\
  import java.util.concurrent.Executors;\n\npublic class CachedThreadPoolExample {\n\
  \    public static void main(String[] args) {\n        ExecutorService executor\
  \ = Executors.newCachedThreadPool();\n        for (int i = 1; i <= 5; i++) {\n \
  \           final int taskId = i;\n            executor.submit(() -> {\n       \
  \         System.out.println(Thread.currentThread().getName() + \" is executing\
  \ task: \" + taskId);\n                try {\n                    Thread.sleep(1000);\n\
  \                } catch (InterruptedException e) {\n                    e.printStackTrace();\n\
  \                }\n            });\n        }\n        executor.shutdown();\n \
  \   }\n}\n```\n\n#### 输出（输出可能因线程重用而异）:\n\npool-1-thread-1 is executing task: 1\n\
  pool-1-thread-2 is executing task: 2\npool-1-thread-3 is executing task: 3\npool-1-thread-4\
  \ is executing task: 4\npool-1-thread-5 is executing task: 5\n\n#### 解释:\n\n1. 动态线程创建:\n\
  <bdi>○</bdi>如果没有空闲线程可用，则创建一个新线程。\n\n2. 线程重用:\n<bdi>○</bdi>空闲线程会被重用于后续任务。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n## 线程池比较\n\n| 线程池 | 描述 | 用场景 |\n| :--- | :--- | :---\
  \ |\n| 固定线程池 | 创建固定数量的线程。 | 需要预测数量的线程。 |\n| 缓存线程池 | 动态创建线程并重用空闲线程。 | 短寿命、突发性的任务。\
  \ |\n| 单线程执行器 | 在单个线程中按顺序执行任务。 | 确保任务顺序。 |\n| 调度线程池 | 在延迟后或定期执行任务。 | 调度或循环执行的任务。\
  \ |\n\n![Rectangle Rectangle](img/image.png)\n\n## 最佳实践\n\n1. 重用线程:\n<bdi>○</bdi>使用线程池避免重复创建和销毁线程的开销。\n\
  \n2. 关闭执行器:\n<bdi>○</bdi>在任务执行后始终调用 `shutdown()` 或 `shutdownNow()` 以释放资源。\n\n3.\
  \ 异常处理:\n<bdi>○</bdi>处理任务中的异常以避免线程终止。\n\n4. 避免过载:\n<bdi>○</bdi>监控线程池大小和队列容量以防止资源耗尽。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\nExecutors 框架简化了线程管理并为并发编程提供了强大的抽象：\n\
  \n1. 核心组件:\n<bdi>○</bdi>`Executors`、`ExecutorService`、`ScheduledExecutorService`\
  \ 和 `Callable`。\n\n2. 线程池:\n<bdi>○</bdi>用于不同场景的固定、缓存、单线程和调度线程池。\n\n3. 关键优势:\n<bdi>○</bdi>线程重用、任务调度和灵活的配置。\n\
  \n## Lambda 表达式\n\nLambda 表达式是 Java 8 引入的一种特性，通过以函数式风格表示匿名方法，允许开发者编写更整洁、简洁的代码。它们通常与函数式接口配合使用，实现函数编程结构。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### Lambda 表达式的关键特性\n\n1. 简洁性:\n<bdi>○</bdi>通过减少样板代码简化了匿名类的创建。\n\
  \n2. 函数式编程:\n<bdi>○</bdi>通过函数式接口促进函数式编程风格。\n\n3. 提高可读性:\n<bdi>○</bdi>允许内联行为，提高代码清晰度。\n\
