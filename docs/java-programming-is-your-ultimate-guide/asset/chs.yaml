  ### 使用 Java 访问数据\n\n#### 1. SharedPreferences\n本地存储少量的键值对数据。\n\n代码示例：\n\n```java\n\
  SharedPreferences sharedPreferences = getSharedPreferences(\"MyPrefs\", MODE_PRIVATE);\n\
  SharedPreferences.Editor editor = sharedPreferences.edit();\neditor.putString(\"\
