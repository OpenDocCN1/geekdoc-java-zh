  4. `File I/O`:\n   - 有用于从文件中读取和写入数据。\n\n# 面向对象编程 (OOP)\n\n## 面向对象编程 (OOP) 的原则\n\n\
  1. **封装 (Encapsulation)**：`封装` 是限制直接访问对象某些组件的机制，并确保对象的内部表示对外部隐藏。这通过使用访问修饰符（`private`、`protected`、`public`）以及通过\
  \ `getters` 和 `setters` 等方法提供受控访问来实现。\n\n   - 优势：\n     - 通过防止未经授权或有害的更改保护对象的完整性。\n\
  \     - 使代码更易维护和理解。\n\nJava 示例：\n```java\npublic class Person {\n    private String\
  \ name;\n    private int age;\n\n    // name 的 Getter\n    public String getName()\
  \ {\n        return name;\n    }\n\n    // name 的 Setter\n    public void setName(String\
  \ name) {\n        this.name = name;\n    }\n\n    // age 的 Getter\n    public int\
  \ getAge() {\n        return age;\n    }\n\n    // age 的 Setter\n    public void\
  \ setAge(int age) {\n        if (age > 0) {\n            this.age = age;\n     \
  \   }\n    }\n}\n```\n\n2. **继承 (Inheritance)**：`继承` 允许一个类（子类）从另一个类（父类）获取属性和行为（方法）。这促进了代码复用，并在类之间建立了层级关系。\n\
  \n   - 核心概念：\n     - Java 中使用 `extends` 关键字。\n     - 子类可以重写父类的方法。\n\nJava 示例：\n\
  ```java\npublic class Animal {\n    public void eat() {\n        System.out.println(\"\
  This animal eats food.\");\n    }\n}\n\npublic class Dog extends Animal {\n    @Override\n\
  \    public void eat() {\n        System.out.println(\"This dog eats bones.\");\n\
  \    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n\
  \        Animal animal = new Animal();\n        animal.eat();\n        Dog dog =\
  \ new Dog();\n        dog.eat();\n    }\n}\n```\n\n3. **多态 (Polymorphism)**：`多态`\
  \ 意味着“多种形式”，允许方法根据上下文或对象执行不同的操作。它可以通过以下方式实现：\n\n   - **方法重载 (Method Overloading)**：相同的方法名具有不同的参数。\n\
  \   - **方法重写 (Method Overriding)**：子类为其超类中已定义的方法提供特定实现。\n\nJava 示例：\n```java\npublic\
  \ class Shape {\n    public void draw() {\n        System.out.println(\"Drawing\
  \ a shape.\");\n    }\n}\n\npublic class Circle extends Shape {\n    @Override\n\
  \    public void draw() {\n        System.out.println(\"Drawing a circle.\");\n\
  \    }\n}\n\npublic class Square extends Shape {\n    @Override\n    public void\
  \ draw() {\n        System.out.println(\"Drawing a square.\");\n    }\n}\n\npublic\
  \ class Main {\n    public static void main(String[] args) {\n        Shape shape;\n\
  \        shape = new Circle();\n        shape.draw();\n        shape = new Square();\n\
  \        shape.draw();\n    }\n}\n```\n\n4. **抽象 (Abstraction)**：`抽象` 侧重于隐藏实现细节，同时暴露对象的本质特征。它可以通过以下方式实现：\n\
  \n   - **抽象类 (Abstract classes)**：无法实例化的类，可能包含抽象（未实现的）方法。\n   - **接口 (Interfaces)**：完全抽象的类，所有方法必须由继承类实现。\n\
  \nJava 示例：\n```java\n// 抽象类示例\nabstract class Vehicle {\n    abstract void start();\n\
  \    public void stop() {\n        System.out.println(\"Vehicle stopped.\");\n \
  \   }\n}\n\nclass Car extends Vehicle {\n    @Override\n    void start() {\n   \
  \     System.out.println(\"Car starts with a key.\");\n    }\n}\n\npublic class\
  \ Main {\n    public static void main(String[] args) {\n        Vehicle car = new\
  \ Car();\n        car.start();\n        car.stop();\n    }\n}\n```\n\n## 类与对象\n\n\
  Java 是一种面向对象的编程语言，这意味着它是基于类和对象的概念。这些是 Java 程序的构建模块。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 1. 什么是类？\n\n类是创建对象的蓝图。它定义了对象可以拥有的属性（字段）和行为（方法）。\n\n语法：\n```java\nclass ClassName\
  \ {\n    // 字段（属性）\n    // 方法（行为）\n}\n```\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 2. 什么是对象？\n\n对象是类的实例。它代表现实世界的实体，并具有：\n- 状态：由字段（属性）表示。\n- 行为：由方法（方法）表示。\n\n\
  #### 类与对象的示例\n```java\npublic class Person {\n    // 字段（属性）\n    String name;\n\
  \    int age;\n\n    // 方法（行为）\n    void introduce() {\n        System.out.println(\"\
  My name is \" + name + \" and I am \" + age + \" years old.\");\n    }\n\n    public\
  \ static void main(String[] args) {\n        // 创建对象\n        Person person1 = new\
  \ Person();\n        person1.name = \"Alice\";\n        person1.age = 25;\n    \
  \    // 调用方法\n        person1.introduce();\n    }\n}\n```\n输出：\n`My name is Alice\
  \ and I am 25 years old.`\n\n解释：\n1. `Person` 类定义了两个字段：`name` 和 `age`。\n2. 它有一个方法\
  \ `introduce`，用于打印细节。\n3. `Person person1 = new Person();` 创建 `Person` 类的实例。\n4.\
  \ `person1.name = \"Alice\";` 将 `\"Alice\"` 赋值给 `name` 字段。\n5. `person1.age = 25;`\
  \ 将 `25` 赋值给 `age` 字段。\n6. `person1.introduce();` 调用 `introduce` 方法。\n\n### 3. 访问修饰符\n\
  \n访问修饰符控制类成员（字段和方法）的可见性。\n\n| 修饰符 | 访问范围 |\n| :--- | :--- |\n| `public` | 处可见 |\n\
  | `private` | 仅类内可见 |\n| `protected` | 包内及子类可见 |\n| (默认) | 包内可见 |\n\n### 4. 构造函数\n\
  \n构造函数是用于初始化对象的特殊方法。它与类名相同且没有返回类型。\n\n示例：\n```java\npublic class Person {\n    String\
  \ name;\n    int age;\n\n    // 构造函数\n    Person(String personName, int personAge)\
  \ {\n        name = personName;\n        age = personAge;\n    }\n\n    void introduce()\
  \ {\n        System.out.println(\"My name is \" + name + \" and I am \" + age +\
  \ \" years old.\");\n    }\n\n    public static void main(String[] args) {\n   \
  \     // 使用构造函数初始化对象\n        Person person1 = new Person(\"Bob\", 30);\n      \
  \  person1.introduce();\n    }\n}\n```\n输出：\n`My name is Bob and I am 30 years old.`\n\
  \n解释：\n1. 构造函数 `Person(String personName, int personAge)` 在创建对象时初始化字段 `name` 和 `age`。\n\
  2. `new Person(\"Bob\", 30)` 自动调用构造函数，并将 `\"Bob\"` 和 `30` 作为参数传递。\n\n### 5. 方法\n\
  \n方法定义类的行为。它们可以：\n- 接收参数。\n- 返回值。\n\n示例：\n```java\npublic class Calculator {\n \
  \   int add(int a, int b) {\n        return a + b;\n    }\n\n    public static void\
  \ main(String[] args) {\n        Calculator calc = new Calculator();\n        int\
  \ sum = calc.add(5, 7);\n        System.out.println(\"Sum: \" + sum);\n    }\n}\n\
  ```\n输出：\n`Sum: 12`\n\n### 6. this 关键字\n\n`this` 关键字指向类的当前实例。\n\n```java\npublic\
  \ class Person {\n```\n\n\n\n\n```java\npublic class Person {\n    String name;\n\
  \n    Person(String name) {\n        this.name = name; // 指向当前对象的字段\n    }\n\n \
  \   void introduce() {\n        System.out.println(\"Hi, my name is \" + this.name);\n\
  \    }\n\n    public static void main(String[] args) {\n        Person person1 =\
  \ new Person(\"Charlie\");\n        person1.introduce();\n    }\n}\n```\n\n####\
  \ 输出:\nHi, my name is Charlie\n\n![Rectangle Rectangle](img/image.png)\n\n### 7.\
  \ 静态成员\n\n<bdi>●</bdi>静态字段和方法属于类，而不是特定的对象。\n\n<bdi>●</bdi>使用类名进行访问。\n\n#### 代码示例:\n\
  ```java\npublic class MathUtils {\n    static int square(int x) {\n        return\
  \ x * x;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(\"\
  Square of 4: \" + MathUtils.square(4));\n    }\n}\n```\n\n#### 输出:\nSquare of 4:\
  \ 16\n\n解释:\n<bdi>●</bdi>`square` 方法是静态的，因此使用类名 `MathUtils` 进行调用。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 8. 封装\n\n封装通过使用私有访问修饰符并提供 getter 和 setter 方法来限制对字段的直接访问。\n\
  \n#### 代码示例:\n```java\npublic class BankAccount {\n    private double balance;\n\
  \    // Getter\n    public double getBalance() {\n        return balance;\n    }\n\
  \n    // Setter\n    public void deposit(double amount) {\n        if (amount >\
  \ 0) {\n            balance += amount;\n        }\n    }\n\n    public static void\
  \ main(String[] args) {\n        BankAccount account = new BankAccount();\n    \
  \    account.deposit(500.0);\n        System.out.println(\"Balance: \" + account.getBalance());\n\
  \    }\n}\n```\n\n#### 输出:\nBalance: 500.0\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 9. 类中的面向对象概念\n\n1. 继承：\n<bdi>○</bdi>类可以使用 `extends` 关键字从另一个类继承字段和方法。\n\n2.\
  \ 多态：\n<bdi>○</bdi>类可以重写其父类的方法。\n\n3. 抽象：\n<bdi>○</bdi>抽象类和接口为子类定义了蓝图。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 总结\n<bdi>●</bdi>类定义了对象的蓝图。\n\n<bdi>●</bdi>对象代表类的实例。\n\
  \n<bdi>●</bdi>方法定义行为，而字段存储状态。\n\n<bdi>●</bdi>构造函数初始化对象。\n\n<bdi>●</bdi>访问修饰符（`public`,\
  \ `private`, `protected`）控制可见性。\n\n<bdi>●</bdi>封装通过 getter 和 setter 方法保护字段的安全。\n\
  \n### Java 中的实例变量和方法\n\n实例变量和实例方法是 Java 面向对象编程模型的基础概念。它们代表了从类创建的单个对象的状态和行为。\n\n\
  ![Rectangle Rectangle](img/image.png)\n\n### 1. 实例变量\n\n实例变量是定义在类内部但在任何方法、构造函数或块之外的非静态变量。类的每个对象都拥有这些变量的副本。\n\
  \n#### 实例变量的关键特性\n<bdi>●</bdi>声明在类级别（在方法外部）。\n\n<bdi>●</bdi>每个对象都获得自己的副本。\n\n<bdi>●</bdi>值在不同对象之间是独立的。\n\
  \n<bdi>●</bdi>可以有不同的访问修饰符（`private`, `public` 等）。\n\n<bdi>●</bdi>默认值：\n<bdi>○</bdi>数值类型：0\n\
  <bdi>○</bdi>boolean：false\n<bdi>○</bdi>对象引用：null\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 代码示例：实例变量\n```java\npublic class Car {\n    // 实例变量\n    String brand;\n\
  \    int year;\n\n    public static void main(String[] args) {\n        // 创建 Car\
  \ 类的对象\n        Car car1 = new Car();\n        Car car2 = new Car();\n        //\
  \ 为实例变量赋值\n        car1.brand = \"Toyota\";\n        car1.year = 2020;\n       \
  \ car2.brand = \"Honda\";\n        car2.year = 2018;\n        // 打印实例变量的值\n    \
  \    System.out.println(\"Car 1: \" + car1.brand + \", \" + car1.year);\n      \
  \  System.out.println(\"Car 2: \" + car2.brand + \", \" + car2.year);\n    }\n}\n\
  ```\n\n#### 输出:\nCar 1: Toyota, 2020\nCar 2: Honda, 2018\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 代码解释\n1. 实例变量：\n<bdi>○</bdi>`brand` 和 `year` 是实例变量。\n<bdi>○</bdi>每个 `Car`\
  \ 对象（`car1` 和 `car2`）都有这些变量的自己的副本。\n\n2. 对象特定的值：\n<bdi>○</bdi>`car1.brand` 被赋值为\
  \ \"Toyota\"，`car1.year` 被赋值为 2020。\n<bdi>○</bdi>`car2.brand` 被赋值为 \"Honda\"，`car2.year`\
  \ 被赋值为 2018。\n\n### 2. 实例方法\n\n实例变量和实例方法是 Java 面向对象编程模型的基础概念。它们代表了从类创建的单个对象的状态和行为。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n#### 实例方法的关键特性\n<bdi>●</bdi>实例方法在单个对象上操作。\n\
  <bdi>●</bdi>它们可以访问并修改实例变量。\n\n\n\n\n○ 示例：`Person` 对象的 `name`、`age` 和 `balance`。\n\
  \n● 封装：\n\n○ 使用 `private` 实例变量并提供 `public` getter/`setter` 方法来实现受控的访问。\n\n● 对象特定操作：\n\
  \n○ 示例：计算特定对象的工资、等级 `grade` 或利率 `interest`。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 实例成员与静态成员的比较\n\n| 特性 | 实例变量/方法 | 静态变量/方法 |\n| :--- | :--- | :--- |\n| 所属关系\
  \ | 特定对象 | 类本身 |\n| 是否需要对象 | 是 | 否 |\n| 访问方式 | 可以同时访问实例和静态成员 | 只能直接访问静态成员 |\n| 内存占用\
  \ | 每个对象拥有独立的内存 | 所有对象共享同一内存 |\n\n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\
  \n● 实例变量：\n\n○ 存储特定于对象的数据。\n○ 每个对象都有自己的拷贝。\n\n● 实例方法：\n\n○ 在实例变量上进行操作。\n○ 需要对象来调用它们。\n\
  \n● `this` 关键字：\n\n○ 指向当前对象，用于区分实例变量和参数。\n\n### 构造函数\n\n构造函数是 `Java` 中一种特殊的方法，用于在创建对象时初始化它。它的名称与类相同，并在实例化新对象时自动调用。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 构造函数的关键特征\n\n1. 与类同名：构造函数的名称必须与类名相同。\n\
  2. 无返回值：构造函数没有返回值，甚至连 `void` 也没有。\n3. 自动调用：在创建对象时，构造函数会被调用。\n4. 重载：构造函数可以被重载（多个具有不同参数列表的构造函数）。\n\
  5. 默认构造函数：如果没有定义构造函数，`Java` 会提供一个无参数的默认构造函数。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 构造函数的类型\n\n1. 默认构造函数\n2. 参数化构造函数\n3. 无参数构造函数\n4. 拷贝构造函数（手动实现）\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 1. 默认构造函数\n\n如果类中没有定义构造函数，`Java` 会提供一个默认的无参数构造函数。\n\
  \n#### 代码示例：\n```\npublic class DefaultConstructorExample {\n    int number;\n \
  \   String name;\n\n    public static void main(String[] args) {\n        DefaultConstructorExample\
  \ obj = new DefaultConstructorExample();\n        System.out.println(\"Number: \"\
  \ + obj.number); // 默认值为 0\n        System.out.println(\"Name: \" + obj.name); //\
  \ 默认值为 null\n    }\n}\n```\n\n#### 输出：\n```\nNumber: 0\nName: null\n```\n\n####\
  \ 解释：\n1. `Java` 提供了一个默认构造函数，将 `number` 初始化为 `0`，并将 `name` 初始化为 `null`。\n2. 在创建对象时，会自动调用默认构造函数。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 2. 参数化构造函数\n\n接收参数以初始化实例变量的构造函数。\n\
  \n#### 代码示例：\n```java\npublic class ParameterizedConstructorExample {\n    int number;\n\
  \    String name;\n\n    // 参数化构造函数\n    public ParameterizedConstructorExample(int\
  \ num, String str) {\n        number = num;\n        name = str;\n    }\n\n    public\
  \ static void main(String[] args) {\n        ParameterizedConstructorExample obj\
  \ = new ParameterizedConstructorExample(10, \"Alice\");\n        System.out.println(\"\
  Number: \" + obj.number);\n        System.out.println(\"Name: \" + obj.name);\n\
  \    }\n}\n```\n\n#### 输出：\n```\nNumber: 10\nName: Alice\n```\n\n#### 解释：\n1. 参数化构造函数使用对象创建期间传递的值来初始化\
  \ `number` 和 `name`。\n2. `new ParameterizedConstructorExample(10, \"Alice\")` 调用了带有参数\
  \ `10` 和 `\"Alice\"` 的构造函数。\n\n![Rectangle Rectangle](img/image.png)\n\n### 3. 无参数构造函数\n\
  \n无参数构造函数是显式定义的，没有任何任何参数。\n\n#### 代码示例：\n```java\npublic class NoArgumentConstructorExample\
  \ {\n    int number;\n    String name;\n\n    // 无参数构造函数\n    public NoArgumentConstructorExample()\
  \ {\n        number = 0;\n        name = \"Default Name\";\n    }\n\n    public\
  \ static void main(String[] args) {\n        NoArgumentConstructorExample obj =\
  \ new NoArgumentConstructorExample();\n        System.out.println(\"Number: \" +\
  \ obj.number);\n        System.out.println(\"Name: \" + obj.name);\n    }\n}\n```\n\
  \n#### 输出：\n```\nNumber: 0\nName: Default Name\n```\n\n#### 解释：\n● 无参数构造函数将 `number`\
  \ 初始化为 `0`，将 `name` 初始化为 `\"Default Name\"`。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 4. 构造函数重载\n\n类中可以多个构造函数，每个构造函数都有不同的参数列表。\n\n#### 代码示例：\n```java\npublic class\
  \ ConstructorOverloadingExample {\n    int number;\n    String name;\n\n    // 无参数构造函数\n\
  \    public ConstructorOverloadingExample() {\n        number = -1;\n        name\
  \ = \"Unknown\";\n    }\n\n    // 参数化构造函数\n    public ConstructorOverloadingExample(int\
  \ num, String str) {\n        number = num;\n        name = str;\n    }\n\n    public\
  \ static void main(String[] args) {\n        ConstructorOverloadingExample obj1\
  \ = new ConstructorOverloadingExample();\n        ConstructorOverloadingExample\
  \ obj2 = new ConstructorOverloadingExample(20, \"Bob\");\n        System.out.println(\"\
  Number: \" + obj1.number);\n        System.out.println(\"Name: \" + obj1.name);\n\
  \        System.out.println(\"Number: \" + obj2.number);\n        System.out.println(\"\
  Name: \" + obj2.name);\n    }\n}\n```\n\n\n\n\n\n1. `this` 关键字用于避免命名冲突或调用其他的构造函数。\n\
  1. 使用构造函数来确保对象始终在有效状态下创建。\n\n构造函数在 Java 中是基础性的，因为它们允许你控制对象的初始化方式，并确保对象创建的一致性。\n\n\
  ## 静态与实例成员\n\n在 Java 中，类成员（变量和方法）可以是静态的（static），也可以是实例的（instance）。这些分类决定了它们属于类本身还是属于从该类创建的单个对象。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 主要区别：静态成员 vs 实例成员\n\n| 维度 | 静态成员\
  \ | 实例成员 |\n| :--- | :--- | :--- |\n| 所属 | 属于类（所有对象共享）。 | 属于单个对象（每个对象唯一）。 |\n| 访问方式\
  \ | 使用类名或对象引用访问。 | 仅使用对象引用访问。 |\n| 内存占用 | 存储在内存中（类级别）。 | 为每个对象分配单独的内存。 |\n| 关键字\
  \ | 使用 `static` 关键字声明。 | 无特殊关键字。 |\n| 行为 | 独立于对象实例。 | 依赖于对象实例。 |\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 静态成员\n\n静态成员与类本身相关，而与类的任何特定实例无关。\n\n#### 静态成员的主要特征\n\
  \n1. 使用 `static` 关键字声明。\n2. 类的所有对象共享。\n3. 可以直接使用类名访问。\n4. 无法直接访问实例成员（不通过对象引用的情况下）。\n\
  5. 通常用于工具函数或常量。\n\n![Rectangle Rectangle](img/image.png)\n\n#### 静态变量\n\n静态变量在类的所有对象之间共享。它们通常用于常量或计数器。\n\
  \n#### 代码示例：\n\n```java\npublic class StaticVariableExample {\n    static int counter\
  \ = 0; // 静态变量\n\n    public StaticVariableExample() {\n        counter++;\n   \
  \ }\n\n    public static void main(String[] args) {\n        StaticVariableExample\
  \ obj1 = new StaticVariableExample();\n        StaticVariableExample obj2 = new\
  \ StaticVariableExample();\n        System.out.println(\"Counter: \" + StaticVariableExample.counter);\n\
  \    }\n}\n```\n\n#### 输出：\n```\nCounter: 2\n```\n\n#### 解析：\n1. `counter` 变量是 `static`\
  \ 的，所以它在所有实例之间共享。\n2. 每创建一个新对象，构造函数就会增加 `counter` 的值。\n3. 使用类名访问 `counter` 的值。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n#### 静态方法\n\n静态方法可以在不创建类实例的情况下调用。\n\n\
  #### 代码示例：\n\n```java\npublic class StaticMethodExample {\n    static int square(int\
  \ x) {\n        return x * x;\n    }\n\n    public static void main(String[] args)\
  \ {\n        int result = StaticMethodExample.square(5);\n        System.out.println(\"\
  Square of 5: \" + result);\n    }\n}\n```\n\n#### 输出：\n```\nSquare of 5: 25\n```\n\
  \n#### 解析：\n1. `square` 方法是 `static` 的，所以使用类名进行调用。\n2. 它独立于任何实例进行执行计算。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 实例成员\n\n实例成员与特定的对象相关。每个对象都有自己的实例变量副本，并可以独立调用实例方法。\n\
  \n#### 实例变量\n\n实例变量存储每个对象特有的数据。\n\n#### 代码示例：\n\n```java\npublic class InstanceVariableExample\
  \ {\n    int id; // 实例变量\n    String name;\n\n    public InstanceVariableExample(int\
  \ id, String name) {\n        this.id = id;\n        this.name = name;\n    }\n\n\
  \    public static void main(String[] args) {\n        InstanceVariableExample obj1\
  \ = new InstanceVariableExample(1, \"Alice\");\n        InstanceVariableExample\
  \ obj2 = new InstanceVariableExample(2, \"Bob\");\n        System.out.println(\"\
  Object 1: ID = \" + obj1.id + \", Name = \" + obj1.name);\n        System.out.println(\"\
  Object 2: ID = \" + obj2.id + \", Name = \" + obj2.name);\n    }\n}\n```\n\n####\
  \ 输出：\n```\nObject 1: ID = 1, Name = Alice\nObject 2: ID = 2, Name = Bob\n```\n\n\
  #### 解析：\n1. 每个对象都有自己的 `id` 和 `name` 实例变量。\n2. 对一个对象的修改不会影响另一个。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 实例方法\n\n实例方法在实例变量上操作，并需要对象才能调用。\n\n#### 代码示例：\n\n```java\npublic class InstanceMethodExample\
  \ {\n    String name;\n\n    public InstanceMethodExample(String name) {\n     \
  \   this.name = name;\n    }\n\n    void display() {\n        System.out.println(\"\
  Name: \" + name);\n    }\n\n    public static void main(String[] args) {\n     \
  \   InstanceMethodExample obj = new InstanceMethodExample(\"Charlie\");\n      \
  \  obj.display();\n    }\n}\n```\n\n#### 输出：\n```\nName: Charlie\n```\n\n#### 解析：\n\
  1. `display` 方法是实例方法，所以必须在对象（`obj`）上调用。\n2. 它访问特定于对象的 `name` 实例变量。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 访问静态和实例成员\n\n#### 代码示例：\n\n```java\npublic class\
  \ StaticInstanceExample {\n    static String staticVar = \"Static\";\n    String\
  \ instanceVar = \"Instance\";\n\n    static void staticMethod() {\n        System.out.println(\"\
  Inside static method\");\n    }\n\n    void instanceMethod() {\n        System.out.println(\"\
  Inside instance method\");\n    }\n\n    public static void main(String[] args)\
  \ {\n        // 访问静态成员\n        System.out.println(\"Static Variable: \" + StaticInstanceExample.staticVar);\n\
  \        StaticInstanceExample.staticMethod();\n\n        // 访问实例成员\n        StaticInstanceExample\
  \ obj = new StaticInstanceExample();\n        obj.instanceMethod();\n    }\n}\n\
  ```\n\n#### 输出：\n```\nStatic Variable: Static\nInside static method\nInside instance\
  \ method\n```\n\n#### 解析：\n1. `staticVar` 通过类名 `StaticInstanceExample.staticVar`\
  \ 访问。\n2. `staticMethod()` 通过 `StaticInstanceExample.staticMethod()` 调用。\n3. `instanceVar`\
  \ 和 `instanceMethod()` 通过对象引用 `obj` 访问。\n\n\n\n\n方法重载（Method Overloading）发生在同一个类中多个方法具有相同名称，但参数列表不同（类型、数量或顺序不同的情况。它提供了编译时多态性。\n\
  \n## 方法重载的关键特性\n\n1. 方法必须具有相同的名称，但参数列表必须不同。\n2. 重载的方法可以不同的返回值。\n3. 它允许同一个方法名处理不同类型或数量的参数。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n#### 代码示例：方法重载\n\n```java\npublic class\
  \ MethodOverloadingExample {\n\n    // 有一个参数的方法\n    void display(int number) {\n\
  \        System.out.println(\"Number: \" + number);\n    }\n\n    // 两个参数的重载方法\n\
  \    void display(int number, String message) {\n        System.out.println(\"Number:\
  \ \" + number + \", Message: \" + message);\n    }\n\n    // 不同参数类型的重载方法\n    void\
  \ display(String message) {\n        System.out.println(\"Message: \" + message);\n\
  \    }\n\n    public static void main(String[] args) {\n        MethodOverloadingExample\
  \ obj = new MethodOverloadingExample();\n        obj.display(10); // 调用第一个方法\n \
  \       obj.display(20, \"Hello\"); // 调用第二个方法\n        obj.display(\"Overloading\
  \ Example\"); // 调用第三个方法\n    }\n}\n```\n\n#### 输出：\n\n```\nNumber: 10\nNumber:\
  \ 20, Message: Hello\nMessage: Overloading Example\n```\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 代码解释\n\n1. 第一次方法调用：`obj.display(10)` 匹配具有一个 int 参数的方法：`void display(int number)`。\n\
  2. 第二次方法调用：`obj.display(20, \"Hello\")` 匹配具有两个参数的方法：`void display(int number, String\
  \ message)`。\n3. 第三次方法调用：`obj.display(\"Overloading Example\")` 匹配具有一个 String 参数的方法：`void\
  \ display(String message)`。\n\n![Rectangle Rectangle](img/image.png)\n\n## 方法重载的规则\n\
  \n1. 参数参数列表：\n   方法必须在类型、数量或顺序上有所不同。\n   示例：`void print(int a);`, `void print(double\
  \ b);`, `void print(int a, int b);`\n2. 不能仅通过返回值进行重载：\n   仅更改返回值不允许重载的。\n   示例：`void\
  \ print(int a);`, `int print(int a);` // 错误：方法已定义\n\n![Rectangle Rectangle](img/image.png)\n\
  \n## 2. 方法重写（Method Overriding）\n\n方法重写发生在子类为其父类中已经定义的方法提供特定实现的情形。它提供了运行时多态性。\n\n\
  ## 方法重写的关键特性\n\n1. 子类中的方法必须具有：\n   - 与父类中方法相同的名称。\n   - 相同的参数列表。\n2. 重写的方法在子类中替换了父类的方法。\n\
  3. 返回值类型必须相同（或是协变的）。\n4. 可以使用 `@Override` 注解来提高代码清晰度。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 代码示例：方法重写\n\n```java\nclass Animal {\n    void sound() {\n        System.out.println(\"\
  Animals make sound\");\n    }\n}\n\nclass Dog extends Animal {\n    @Override\n\
  \    void sound() {\n        System.out.println(\"Dogs bark\");\n    }\n}\n\npublic\
  \ class MethodOverridingExample {\n    public static void main(String[] args) {\n\
  \        Animal animal = new Animal();\n        animal.sound(); // 调用 Animal 类中的方法\n\
  \        Dog dog = new Dog();\n        dog.sound(); // 调用 Dog 类中的重写方法\n        Animal\
  \ ref = new Dog();\n        ref.sound(); // 由于运行时多态性调用重写方法\n    }\n}\n```\n\n####\
  \ 输出：\n\n```\nAnimals make sound\nDogs bark\nDogs bark\n```\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 代码解释\n\n1. 重写方法：`Dog` 类重写了 `Animal` 类的 `sound` 方法。\n2. 多态：当类型为 `Animal` 的引用\
  \ `ref` 指向 `Dog` 类型的对象时，在运行时调用 `Dog` 中的重写方法。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n## 方法重写的规则\n\n1. 相同的方法签名：\n   方法必须具有与父类中方法相同的名称、参数和返回值类型。\n2. 访问修饰符：\n   重写方法不能降低父类方法的可见性。\n\
  \   示例：`public void sound();` // 父类，`protected void sound();` // 子类中报错\n3. 使用 @Override\
  \ 注解：\n   确保该方法正确地重写了父类方法。\n   示例：`@Override void sound();`\n4. final 方法：\n   在父类中声明为\
  \ `final` 的方法不能被重写。\n5. 静态方法：\n   静态方法不会被重写；它们被隐藏了。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n## 方法重载与重写的区别\n\n| 方面 | 方法重载 (Method Overloading) | 方法重写 (Method Overriding) |\n\
  | :--- | :--- | :--- |\n| 定义 | 相同的方法名不同的参数列表。 | 相同的方法签名。 |\n| 多态性 | 编译时多态性。 | 运行时多态性。\
  \ |\n| 返回类型 | 可以不同。 | 必须相同或协变。 |\n| 访问修饰符 | 无限制。 | 不能降低可见性。 |\n\n\n\n\n\n`private`\
  \ 修饰符将访问权限限制在同一个类内部。声明为 `private` 的成员无法在类之外访问。\n\n#### 代码示例：\n\n```java\npublic\
  \ class PrivateExample {\n\n    private String message = \"This is a private message\"\
  ;\n\n    private void display() {\n        System.out.println(message);\n    }\n\
  \n    public void show() {\n        display(); // 在类内允许\n    }\n\n    public static\
  \ void main(String[] args) {\n        PrivateExample obj = new PrivateExample();\n\
  \        obj.show(); // 访问访问私有方法\n    }\n}\n```\n\n#### 输出：\n\n```\nThis is a private\
  \ message\n```\n\n#### 解析：\n\n1. `message` 变量和 `display` 方法是 `private` 的，不能在类外部直接访问。\n\
  2. `show` 方法提供了对私有 `display` 方法的间接访问。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 3. 默认访问（无修饰符）\n\n当未指定访问修饰符时，成员具有包级别的可见性。这意味着它仅在同一个包内可访问。\n\n#### 代码示例：\n\n\
  文件：`DefaultExample.java`\n\n```java\nclass DefaultExample {\n    String message\
  \ = \"This is a default message\";\n\n    void display() {\n        System.out.println(message);\n\
  \    }\n}\n```\n\n文件：`MainClass.java`（同一包）：\n\n```java\npublic class MainClass {\n\
  \    public static void main(String[] args) {\n        DefaultExample obj = new\
  \ DefaultExample();\n        obj.display(); // 因为它们在同一个包中，所以可以访问\n    }\n}\n```\n\
  \n#### 输出：\n\n```\nThis is a default message\n```\n\n#### 解析：\n\n- <bdi>●</bdi>`message`\
  \ 变量和 `display` 方法在同一个包内可访问。\n- <bdi>●</bdi>如果 `MainClass` 在不同的包中，则无法访问。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 4. protected 访问修饰符\n\n`protected` 修饰符允许在同一个包以及其他包中的子类中访问。\n\
  \n#### 代码示例：\n\n文件：`ParentClass.java`\n\n```java\npackage example1;\n\npublic class\
  \ ParentClass {\n    protected String message = \"This is a protected message\"\
  ;\n\n    protected void display() {\n        System.out.println(message);\n    }\n\
  }\n```\n\n文件：`ChildClass.java`\n\n```java\npackage example2;\n\nimport example1.ParentClass;\n\
  \npublic class ChildClass extends ParentClass {\n    public static void main(String[]\
  \ args) {\n        ChildClass obj = new ChildClass();\n        obj.display(); //\
  \ 因为 ChildClass 是子类，所以可以访问\n    }\n}\n```\n\n#### 输出：\n\n```\nThis is a protected\
  \ message\n```\n\n#### 解析：\n\n1. `message` 变量和 `display` 方法是 `protected` 的，因此由于\
  \ `ChildClass` 继承了 `ParentClass`，它们在 `ChildClass` 中是可以访问的。\n2. `protected` 成员无法被其他包中的无关类直接访问。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 访问级别总结\n\n| 修饰符 | 同一类 | 同一包 | 子类（其他包）\
  \ | 世界（其他包） |\n| :--- | :--- | :--- | :--- | :--- |\n| public | 是 | 是 | 是 | 是 |\n\
  | protected | 是 | 是 | 是 | 否 |\n| Default | 是 | 是 | 否 | 否 |\n| private | 是 | 否 |\
  \ 否 | 否 |\n\n![Rectangle Rectangle](img/image.png)\n\n#### 所有访问修饰符的实际示例\n\n####\
  \ 文件：`AccessModifiersExample.java`\n\n```java\npackage example1;\n\npublic class\
  \ AccessModifiersExample {\n    public String publicVar = \"Public\";\n    protected\
  \ String protectedVar = \"Protected\";\n    String defaultVar = \"Default\";\n \
  \   private String privateVar = \"Private\";\n\n    public void publicMethod() {\n\
  \        System.out.println(\"Public Method\");\n    }\n\n    protected void protectedMethod()\
  \ {\n        System.out.println(\"Protected Method\");\n    }\n\n    void defaultMethod()\
  \ {\n        System.out.println(\"Default Method\");\n    }\n\n    private void\
  \ privateMethod() {\n        System.out.println(\"Private Method\");\n    }\n\n\
  \    public void accessAll() {\n        System.out.println(publicVar);\n       \
  \ System.out.println(protectedVar);\n        System.out.println(defaultVar);\n \
  \       System.out.println(privateVar);\n        publicMethod();\n        protectedMethod();\n\
  \        defaultMethod();\n        privateMethod();\n    }\n}\n```\n\n#### 文件：`AccessTest.java`\n\
  \n```java\npackage example1;\n\npublic class AccessTest {\n    public static void\
  \ main(String[] args) {\n        AccessModifiersExample obj = new AccessModifiersExample();\n\
  \        // 访问变量\n        System.out.println(obj.publicVar); // 可访问\n        System.out.println(obj.protectedVar);\
  \ // 可访问（同一包）\n        System.out.println(obj.defaultVar); // 可访问（同一包）\n       \
  \ // System.out.println(obj.privateVar); // 错误：私有访问\n\n        // 访问方法\n       \
  \ obj.publicMethod(); // 可访问\n        obj.protectedMethod(); // 可访问（同一包）\n     \
  \   obj.defaultMethod(); // 可访问（同一包）\n        // obj.privateMethod(); // 错误：私有权限\n\
  \    }\n}\n```\n\n#### 输出：\n\n```\nPublic\nProtected\nDefault\nPublic Method\nProtected\
  \ Method\nDefault Method\n```\n\n![Rectangle Rectangle](img/image.png)\n\n\n\n\n\
  ```java\n}\n\n// Abstract method\nabstract void drive();\n\n// Concrete method\n\
  void displayBrand() {\n    System.out.println(\"Brand: \" + brand);\n}\n\n}\n\n\
  class Car extends Vehicle {\n    Car(String brand) {\n        super(brand); // 调用抽象类的构造函数\n\
  \    }\n\n    @Override\n    void drive() {\n        System.out.println(\"Driving\
  \ a car...\");\n    }\n}\n\npublic class AbstractWithConstructorExample {\n    public\
  \ static void main(String[] args) {\n        Vehicle myCar = new Car(\"Toyota\"\
  );\n        myCar.displayBrand(); // 访问继承的具体方法\n        myCar.drive(); // 使用重写的方法\n\
  \    }\n}\n```\n\n#### 输出:\nBrand: Toyota\nDriving a car...\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 代码解释\n\n1. **带有构造函数的抽象类**:\n   <bdi>○</bdi>`Vehicle` 类有一个构造函数来初始化 `brand`\
  \ 字段。\n\n2. **子类构造函数**:\n   <bdi>○</bdi>`Car` 类使用 `super()` 来调用 `Vehicle` 的构造函数。\n\
  \n3. **具体方法与重写方法**:\n   <bdi>○</bdi>`displayBrand()` 被继承并在未更改的情况下调用。\n   <bdi>○</bdi>`drive()`\
  \ 在子类中被实现。\n\n![Rectangle Rectangle](img/image.png)\n\n### 3. 多个子类的抽象类\n\n抽象类用于为多个相关的类定义一个公共接口。\n\
  \n#### 代码示例:\n```java\nabstract class Shape {\n    abstract double calculateArea();\n\
  }\n\nclass Circle extends Shape {\n    double radius;\n    Circle(double radius)\
  \ {\n        this.radius = radius;\n    }\n\n    @Override\n    double calculateArea()\
  \ {\n        return Math.PI * radius * radius;\n    }\n}\n\nclass Rectangle extends\
  \ Shape {\n    double length, width;\n    Rectangle(double length, double width)\
  \ {\n        this.length = length;\n        this.width = width;\n    }\n\n    @Override\n\
  \    double calculateArea() {\n        return length * width;\n    }\n}\n\npublic\
  \ class AbstractClassShapeExample {\n    public static void main(String[] args)\
  \ {\n        Shape circle = new Circle(5.0);\n        Shape rectangle = new Rectangle(4.0,\
  \ 6.0);\n        System.out.println(\"Circle Area: \" + circle.calculateArea());\n\
  \        System.out.println(\"Rectangle Area: \" + rectangle.calculateArea());\n\
  \    }\n}\n```\n\n#### 输出:\nCircle Area: 78.53981633974483\nRectangle Area: 24.0\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 代码解释\n\n1. **抽象类 Shape**:\n   <bdi>○</bdi>定义了抽象方法\
  \ `calculateArea()`。\n\n2. **子类**:\n   <bdi>○</bdi>`Circle` 和 `Rectangle` 为 `calculateArea()`\
  \ 提供了具体实现。\n\n3. **多态**:\n   <bdi>○</bdi>`circle` 和 `rectangle` 的类型都是 `Shape`，但它们的\
  \ `calculateArea()` 调用会解析到各自各自的实现。\n\n![Rectangle Rectangle](img/image.png)\n\n\
  ### 4. 抽象类 vs 接口\n\n| 特性 | 抽象类 | 接口 |\n| :--- | :--- | :--- |\n| 方法 | 可以同时拥有抽象和具体方法。\
  \ | 所有方法都是抽象的（Java 8 之前）。 |\n| 字段 | 可以拥有实例变量和常量。 | 只有常量（隐式 public static final）。\
  \ |\n| 构造函数 | 可以有构造函数。 | 不能有构造函数。 |\n| 继承 | 一个类只能继承一个抽象类。 | 一个类可以实现多个接口。 |\n| 访问修饰符\
  \ | 方法可以是任何访问修饰符。 | 方法隐式为 public。 |\n\n![Rectangle Rectangle](img/image.png)\n\n\
  ### 抽象类的实际场景\n\n1. **公共行为**:\n   <bdi>○</bdi>使用抽象类为相关类定义公共字段和方法。\n   <bdi>○</bdi>示例：用于\
  \ `Dog` 和 `Cat` 的 `Animal`。\n\n2. **部分实现**:\n   <bdi>○</bdi>将抽象方法与具体方法结合以部分实现行为。\n\
  \   <bdi>○</bdi>示例：用于 `Car` 和 `Bike` 的 `Vehicle`。\n\n3. **限制实例化**:\n   <bdi>○</bdi>抽象类防止直接实例化，强制要求使用子类。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\n<bdi>●</bdi>**抽象类**:\n<bdi>○</bdi>作为类的蓝图。\n\
  <bdi>○</bdi>允许子类之间共享代码。\n<bdi>○</bdi>可以包含状态（字段）。\n\n<bdi>●</bdi>**接口**:\n<bdi>○</bdi>定义行为的契约。\n\
  <bdi>○</bdi>一个类可以实现多个接口。\n\n\n\n\n\n```java\nclass CreditCardPayment implements\
  \ Payment {\n    @Override\n    public void pay() {\n        System.out.println(\"\
  Paying with credit card.\");\n    }\n}\n\npublic class DefaultStaticExample {\n\
  \    public static void main(String[] args) {\n        Payment.welcomeMessage();\
  \ // Call static method directly\n        Payment payment = new CreditCardPayment();\n\
  \        payment.pay();\n        payment.printReceipt(); // Call default method\n\
  \    }\n}\n```\n\n#### 输出:\n```\nWelcome to the payment system!\nPaying with credit\
  \ card.\nPrinting receipt...\n```\n![Rectangle Rectangle](img/image.png)\n\n## 解析\n\
  \n1. **默认方法**:\n   - `printReceipt()` 在 `Payment` 接口中提供了一个默认实现。\n   - 类可以直接使用它，也可以对其进行重写。\n\
  \n2. **静态方法**:\n   - `welcomeMessage()` 是一个静态方法，并通过接口名称进行调用。\n\n3. **实现**:\n   -\
  \ `CreditCardPayment` 实现了 `Payment` 接口并为 `pay()` 方法提供了实现。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 4. 多接口与多继承\n\n一个类可以实现多个接口，允许它从多个源继承行为。\n\n#### 代码示例:\n```java\ninterface Flyable\
  \ {\n    void fly();\n}\n\ninterface Swimable {\n    void swim();\n}\n\nclass Bird\
  \ implements Flyable, Swimable {\n    @Override\n    public void fly() {\n     \
  \   System.out.println(\"Bird is flying.\");\n    }\n    @Override\n    public void\
  \ swim() {\n        System.out.println(\"Bird is swimming.\");\n    }\n}\n\npublic\
  \ class MultipleInterfacesExample {\n    public static void main(String[] args)\
  \ {\n        Bird bird = new Bird();\n        bird.fly();\n        bird.swim();\n\
  \    }\n}\n```\n\n#### 输出:\n```\nBird is flying.\nBird is swimming.\n```\n![Rectangle\
  \ Rectangle](img/image.png)\n\n## 解析\n- `Bird` 类实现了 `Flyable` 和 `Swimable` 两个接口。\n\
  - 它为这两个中的所有抽象方法提供了实现。\n\n![Rectangle Rectangle](img/image.png)\n\n### 5. 函数式接口 (Java\
  \ 8)\n\n函数式接口是一个恰好只有一个抽象方法的接口。这些接口与 lambda 表达式配合使用。\n\n#### 代码示例:\n```java\n@FunctionalInterface\n\
  interface Greeting {\n    void sayHello(String name);\n}\n\npublic class FunctionalInterfaceExample\
  \ {\n    public static void main(String[] args) {\n        // 使用 lambda 表达式实现接口\n\
  \        Greeting greeting = name -> System.out.println(\"Hello, \" + name);\n \
  \       greeting.sayHello(\"Alice\");\n    }\n}\n```\n\n#### 输出:\n```\nHello, Alice\n\
  ```\n![Rectangle Rectangle](img/image.png)\n\n## 解析\n\n1. **函数式接口**:\n   - `Greeting`\
  \ 只有一个抽象方法 `sayHello()`，使其成为一个函数式接口。\n   - 使用了 `@FunctionalInterface` 注解以增加清晰度。\n\
  \n2. **Lambda 表达式**:\n   - Lambda 表达式 `name -> System.out.println(\"Hello, \" +\
  \ name)` 为 `sayHello()` 提供了实现。\n\n![Rectangle Rectangle](img/image.png)\n\n### 接口与抽象类的对比\n\
  \n| 维度 | 接口 | 抽象类 |\n| :--- | :--- | :--- |\n| 方法 | 所有方法都是抽象的（Java 8 之前）。 | 可以同时拥有抽象方法具体方法。\
  \ |\n| 字段 | 仅包含常量 (public static final)。 | 可以有实例变量和常量。 |\n| 构造方法 | 不能有构造方法。 | 可以有构造方法。\
  \ |\n| 多继承 | 类可以实现多个接口。 | 一个类只能扩展一个抽象类。 |\n| 默认/静态方法 | 支持 (Java 8+)。 | 不适用。 |\n\n\
  ![Rectangle Rectangle](img/image.png)\n\n### 关键点总结\n\n1. **多继承**:\n   - 接口允许类从多个源继承行为。\n\
  \   - 抽象类不支持多继承。\n2. **默认实现**:\n   - 在接口中使用 `default` 方法来实现可选的或通用的行为 (Java 8+)。\n\
  3. **函数式接口**:\n   - 简化了 Java 中的函数式编程，特别是结合 lambda 表达式时。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 实际应用场景\n\n- **接口**:\n  - 为不相关的类定义通用契约。\n  - 示例：`Runnable`, `Comparable`。\n\
  - **抽象类**:\n  - 为相关的类提供部分实现。\n  - 示例：`Shape`, `Vehicle`。\n\n## 内部类与匿名类\n\n内部类和匿名类是\
  \ Java 的高级特性，能够使代码更加模块化和组织化。它们允许在类内部定义类，使得两者之间的关系更紧密并有助于封装。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 1. 内部类\n\n内部类是在另一个类内部定义的类。内部类可以访问外部类的所有成员，包括私有成员。\n\n#### 内部类的类型\n1. 非静态嵌套类（内部类）\n\
  2. 静态嵌套类\n3. 局部内部类\n4. 匿名内部类\n\n![Rectangle Rectangle](img/image.png)\n\n### 1.1\
  \ 非静态内部类\n\n非静态内部类（简单称为内部类）与外部类的实例绑定。它可以访问外部类的实例成员。\n\n#### 代码示例:\n```java\npublic\
  \ class Outer {\n    private String message = \"Hello from Outer\";\n\n    class\
  \ Inner {\n        void display() {\n            System.out.println(message);\n\
  \        }\n    }\n\n    public static void main(String[] args) {\n        Outer\
  \ outer = new Outer();\n        Inner inner = outer.new Inner();\n        inner.display();\n\
  \    }\n}\n```\n\n#### 输出:\n```\nHello from Outer\n```\n\n## 解析\n- `Inner` 类是实例级别的内部类，需要\
  \ `Outer` 的实例。\n- `display()` 方法访问了 `message`。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 1.2 静态嵌套类\n\n静态嵌套类与类本身关联，而不是实例。它只能访问静态成员。\n\n#### 代码示例:\n```java\npublic class\
  \ Outer {\n    private static String staticMessage = \"Hello from Static\";\n\n\
  \    static class StaticNested {\n        void display() {\n            System.out.println(staticMessage);\n\
  \        }\n    }\n\n    public static void main(String[] args) {\n        Outer.StaticNested\
  \ nested = new Outer.StaticNested();\n        nested.display();\n    }\n}\n```\n\
  \n#### 输出:\n```\nHello from Static\n```\n\n## 解析\n- `StaticNested` 类是静态嵌套类，不需要创建\
  \ `Outer` 的实例。\n- 它可以访问 `Outer` 类的静态成员 `staticMessage`。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 1.3 局部内部类\n\n局部内部类定义在方法、构造函数或块中。它局限于作用域，在外部无法访问。\n\n#### 代码示例:\n```java\n\
  public class Outer {\n    void printMessage() {\n        final String localMessage\
  \ = \"Hello from Local Inner Class\";\n\n        class LocalInner {\n          \
  \  void display() {\n                System.out.println(localMessage);\n       \
  \     }\n        }\n\n        LocalInner localInner = new LocalInner();\n      \
  \  localInner.display();\n    }\n\n    public static void main(String[] args) {\n\
  \        Outer outer = new Outer();\n        outer.printMessage();\n    }\n}\n```\n\
  \n#### 输出:\n```\nHello from Local Inner Class\n```\n\n## 解析\n- `LocalInner` 类定义在\
  \ `printMessage` 方法内部。\n- 因为 `localMessage` 被声明为 `final`（或有效 final），所以它可以被访问。\n\n\
  ![Rectangle Rectangle](img/image.png)\n\n### 1.4 匿名内部类\n\n匿名内部类是没有名字的内部类。它用于在一步之内创建实现接口或扩展类的类的对象。\n\
  \n#### 代码示例:\n```java\ninterface Greeting {\n    void sayHello();\n}\n\npublic class\
  \ AnonymousClassExample {\n    public static void main(String[] args) {\n      \
  \  Greeting greeting = new Greeting() {\n            @Override\n            public\
  \ void sayHello() {\n                System.out.println(\"Hello from Anonymous Class\"\
  );\n            }\n        };\n        greeting.sayHello();\n    }\n}\n```\n\n\n\
  \n\n\n```java\nSystem.out.println(\"Hello from Anonymous Inner Class\");\n}\n\n\
  };\n\ngreeting.sayHello();\n\n}\n\n}```\n\n#### 输出:\n\nHello from Anonymous Inner\
  \ Class\n\n#### 解析:\n\n1. 匿名内部类实现了 `Greeting` 接口，而没有给类命名。\n2. 它为 `sayHello` 方法提供了内联实现。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 2. 实际用例\n\n#### 用例：使用匿名内部类排序\n\n\
  ```java\nimport java.util.Arrays;\nimport java.util.Comparator;\n\npublic class\
  \ SortingExample {\n    public static void main(String[] args) {\n        String[]\
  \ fruits = {\"Banana\", \"Apple\", \"Cherry\"};\n        // 用于自定义排序的匿名内部类\n    \
  \    Arrays.sort(fruits, new Comparator<String>() {\n            @Override\n   \
  \         public int compare(String o1, String o2) {\n                return o2.compareTo(o1);\
  \ // 按降序排序\n            }\n        });\n        System.out.println(Arrays.toString(fruits));\n\
  \    }\n}\n```\n\n#### 输出:\n\n[Cherry, Banana, Apple]\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 内部类类型比较\n\n| 类型 | 范围 | 对外部类的访问权限 | 用例 |\n| :--- | :--- | :--- | :--- |\n|\
  \ 非静态内部类 | 所在类的实例。 | 可完全访问外部实例。 | 建立类与类之间紧密关系的建模。 |\n| 静态嵌套类 | 所在类（无外部实例）。 | 仅可访问静态成员。\
  \ | 嵌套工具类或辅助类。 |\n| 局部内部类 | 局限于方法或代码块。 | 可完全访问局部变量。 | 方法内部的封装。 |\n| 匿名内部类 | 内联实现（无名）。\
  \ | 可完全访问外部实例。 | 接口或抽象类的一次性使用场景。 |\n\n![Rectangle Rectangle](img/image.png)\n\n\
