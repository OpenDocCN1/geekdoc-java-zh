  \ to PostgreSQL database.\n\n#### 解释：\n\n1. 多个驱动：\n\n○ 代码连接了 MySQL 和 PostgreSQL。\n\
  \n2. 驱动加载：\n\n○ 每个数据库需要各自的驱动。\n\n![Rectangle Rectangle](img/image.png)\n\n### JDBC\
  \ 问题调试\n\n1. 找不到驱动：\n\n○ 确保驱动在类路径中。\n示例：`java.sql.SQLException: No suitable driver\
  \ for jdbc:mysql://localhost:3306/testdb`\n\n2. URL 错误：\n\n○ 检查 JDBC URL 和凭据。\n\n\
  3. 驱动兼容性：\n\n\n\n4. 网络问题：\n\n○ 连接远程数据库时检查防火墙或网络配置。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### JDBC 使用最佳实践\n\n1. 使用连接池：\n\n○ 使用 HikariCP 等库提高性能。\n\n2. 关闭连接：\n\n○ 始终关闭 `Connection`、`Statement`\
  \ 和 `ResultSet` 以防止泄漏。\n\n3. 异常处理：\n\n○ 对数据库连接问题进行适当异常处理。\n\n4. 驱动管理：\n\n○ 确保驱动版本与数据库和\
  \ JVM 兼容。\n\n5. 安全凭据：\n\n○ 安全地存储数据库凭据，避免硬编码。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 使用 JDBC 进行 CRUD 操作\n\nCRUD 代表增、查、改、删，是对数据库执行的基础操作。JDBC（Java 数据库连接）提供了使用 SQL\
  \ 执行这些操作的 API。\n\n### 设置\n\n数据库表示例：假设 MySQL 数据库中有一个名为 `employees` 的表\n```sql\nCREATE\
  \ TABLE employees (\nid INT AUTO_INCREMENT PRIMARY KEY,\nname VARCHAR(50),\nposition\
  \ VARCHAR(50),\nsalary DECIMAL(10, 2)\n);\n```\n\nJDBC 依赖：对于 Maven，添加 MySQL 驱动依赖：\n\
  \n```xml\n<dependency>\n<groupId>mysql</groupId>\n<artifactId>mysql-connector-java</artifactId>\n\
  <version>8.0.33</version>\n</dependency>\n```\n\n\n\n\n\n</dependency>\n\n数据库连接详情：`String\
  \ url = \"jdbc:mysql://localhost:3306/testdb\";`\n\n`String username = \"root\"\
  ;`\n\n`String password = \"password\";`\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 1. 创建 (插入) 操作\n\n#### 代码示例：\n\n```java\nimport java.sql.Connection;\nimport\
  \ java.sql.DriverManager;\nimport java.sql.PreparedStatement;\npublic class CreateExample\
  \ {\n    public static void main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/testdb\"\
  ;\n        String username = \"root\";\n        String password = \"password\";\n\
  \        try (Connection conn = DriverManager.getConnection(url, username, password))\
  \ {\n            String sql = \"INSERT INTO employees (name, position, salary) VALUES\
  \ (?, ?, ?)\";\n            PreparedStatement pstmt = conn.prepareStatement(sql);\n\
  \            pstmt.setString(1, \"Alice\");\n            pstmt.setString(2, \"Manager\"\
  );\n            pstmt.setBigDecimal(3, new java.math.BigDecimal(\"75000.00\"));\n\
  \            int rowsInserted = pstmt.executeUpdate();\n            System.out.println(\"\
  Rows inserted: \" + rowsInserted);\n        } catch (Exception e) {\n          \
  \  e.printStackTrace();\n        }\n    }\n}\n```\n\n#### 输出：\nRows inserted: 1\n\
  \n#### 解释：\n1. `PreparedStatement`:\n   - 使用参数化查询 (`?`) 来防止 SQL 注入。\n2. `setString`\
  \ 和 `setBigDecimal`:\n   - 将值绑定到查询中的占位符。\n3. `executeUpdate`:\n   - 执行 `INSERT`\
  \ 语句并返回影响的行数。\n\n![Rectangle Rectangle](img/image.png)\n\n### 2. 读取 (查询) 操作\n\n\
  #### 代码示例：\n\n```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\n\
  import java.sql.PreparedStatement;\nimport java.sql.ResultSet;\npublic class ReadExample\
  \ {\n    public static void main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/testdb\"\
  ;\n        String username = \"root\";\n        String password = \"password\";\n\
  \        try (Connection conn = DriverManager.getConnection(url, username, password))\
  \ {\n            String sql = \"SELECT * FROM employees\";\n            PreparedStatement\
  \ pstmt = conn.prepareStatement(sql);\n            ResultSet rs = pstmt.executeQuery();\n\
  \            while (rs.next()) {\n                System.out.println(\"ID: \" +\
  \ rs.getInt(\"id\"));\n                System.out.println(\"Name: \" + rs.getString(\"\
  name\"));\n                System.out.println(\"Position: \" + rs.getString(\"position\"\
  ));\n                System.out.println(\"Salary: \" + rs.getBigDecimal(\"salary\"\
  ));\n                System.out.println(\"---------------------------\");\n    \
  \        }\n        } catch (Exception e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n#### 输出：\nID: 1\nName: Alice\nPosition: Manager\nSalary:\
  \ 75000.00\n---------------------------\n\n#### 解释：\n1. `ResultSet`:\n   - 存储 `SELECT`\
  \ 查询的结果。\n2. 迭代：\n   - `rs.next()` 将光标移动到结果集中的下一行。\n3. 列访问：\n   - 使用 `getInt`、`getString`\
  \ 和 `getBigDecimal` 等方法获取列值。\n\n![Rectangle Rectangle](img/image.png)\n\n### 3.\
  \ 更新操作\n\n#### 代码示例：\n\n```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\n\
  import java.sql.PreparedStatement;\npublic class UpdateExample {\n    public static\
  \ void main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/testdb\"\
  ;\n        String username = \"root\";\n        String password = \"password\";\n\
  \        try (Connection conn = DriverManager.getConnection(url, username, password))\
  \ {\n            String sql = \"UPDATE employees SET salary = ? WHERE name = ?\"\
  ;\n            PreparedStatement pstmt = conn.prepareStatement(sql);\n         \
  \   pstmt.setBigDecimal(1, new java.math.BigDecimal(\"80000.00\"));\n          \
  \  pstmt.setString(2, \"Alice\");\n            int rowsUpdated = pstmt.executeUpdate();\n\
  \            System.out.println(\"Rows updated: \" + rowsUpdated);\n        } catch\
  \ (Exception e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n\
  #### 输出：\nRows updated: 1\n\n#### 解释：\n1. 动态查询：\n   - 更新名为 \"Alice\" 的员工薪资。\n2.\
  \ 参数：\n   - `setBigDecimal` 和 `setString` 将值绑定到查询中。\n3. `executeUpdate`:\n   - 返回受更新影响的行数。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 4. 删除操作\n\n#### 代码示例：\n\n```java\n\
  import java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.PreparedStatement;\n\
  public class DeleteExample {\n    public static void main(String[] args) {\n   \
  \     String url = \"jdbc:mysql://localhost:3306/testdb\";\n        String username\
  \ = \"root\";\n        String password = \"password\";\n        try (Connection\
  \ conn = DriverManager.getConnection(url, username, password)) {\n            String\
  \ sql = \"DELETE FROM employees WHERE name = ?\";\n            PreparedStatement\
  \ pstmt = conn.prepareStatement(sql);\n            pstmt.setString(1, \"Alice\"\
  );\n            int rowsDeleted = pstmt.executeUpdate();\n            System.out.println(\"\
  Rows deleted: \" + rowsDeleted);\n        } catch (Exception e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n#### 输出：\nRows deleted: 1\n\n#### 解释：\n1. 动态查询：\n \
  \  - 删除名为 \"Alice\" 的员工。\n2. `executeUpdate`:\n   - 返回受影响的行数。\n\n---\n\n### 完整的\
  \ CRUD 操作示例\n\n```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\n\
  import java.sql.PreparedStatement;\nimport java.sql.ResultSet;\npublic class CRUDExample\
  \ {\n    public static void main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/testdb\"\
  ;\n        String username = \"root\";\n        String password = \"password\";\n\
  \        try (Connection conn = DriverManager.getConnection(url, username, password))\
  \ {\n            // 创建\n            String sql = \"INSERT INTO employees (name,\
  \ position, salary) VALUES (?, ?, ?)\";\n            PreparedStatement pstmt = conn.prepareStatement(sql);\n\
  \            pstmt.setString(1, \"Alice\");\n            pstmt.setString(2, \"Manager\"\
  );\n            pstmt.setBigDecimal(3, new java.math.BigDecimal(\"75000.00\"));\n\
  \            int rowsInserted = pstmt.executeUpdate();\n            System.out.println(\"\
  Rows inserted: \" + rowsInserted);\n\n            // 读取\n            sql = \"SELECT\
  \ * FROM employees\";\n            PreparedStatement selectStmt = conn.prepareStatement(sql);\n\
  \            ResultSet rs = selectStmt.executeQuery();\n            while (rs.next())\
  \ {\n                System.out.println(\"ID: \" + rs.getInt(\"id\"));\n       \
  \         System.out.println(\"Name: \" + rs.getString(\"name\"));\n           \
  \     System.out.println(\"Position: \" + rs.getString(\"position\"));\n       \
  \         System.out.println(\"Salary: \" + rs.getBigDecimal(\"salary\"));\n   \
  \             System.out.println(\"---------------------------\");\n           \
  \ }\n\n            // 更新\n            sql = \"UPDATE employees SET salary = ? WHERE\
  \ name = ?\";\n            PreparedStatement updateStmt = conn.prepareStatement(sql);\n\
  \            updateStmt.setBigDecimal(1, new java.math.BigDecimal(\"80000.00\"));\n\
  \            updateStmt.setString(2, \"Alice\");\n            int rowsUpdated =\
  \ updateStmt.executeUpdate();\n            System.out.println(\"Rows updated: \"\
  \ + rowsUpdated);\n\n            // 删除\n            sql = \"DELETE FROM employees\
  \ WHERE name = ?\";\n            PreparedStatement deleteStmt = conn.prepareStatement(sql);\n\
  \            deleteStmt.setString(1, \"Alice\");\n            int rowsDeleted =\
  \ deleteStmt.executeUpdate();\n            System.out.println(\"Rows deleted: \"\
  \ + rowsDeleted);\n        } catch (Exception e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n### JDBC CRUD 操作最佳实践\n\n1. **try-with-resources**:\n\
  \   - 自动关闭 `Connection`、`PreparedStatement` 和 `ResultSet`。\n2. **参数化查询**：\n   -\
  \ 使用占位符防止 SQL 注入。\n3. **连接池**：\n   - 使用 HikariCP 等连接池库来提高性能。\n4. **异常处理**：\n   -\
  \ 使用适当的异常处理来管理 SQL 错误。\n5. **日志记录**：\n   - 记录 SQL 查询和结果以便调试和审计。\n\n\n\n\n数据库连接池是一种技术，通过重用预先建立的连接池来高效地管理应用程序中的数据库连接，而不是为每个请求都创建并关闭连接。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n## 为什么要使用连接池？\n\n1. **性能提升**：\n   - 建立和销毁连接是资源密集型操作。连接池可以最小化这种开销。\n\
  2. **高效资源利用**：\n   - 重用有限的连接，而不是为每个请求创建新连接。\n3. **可扩展性**：\n   - 动态管理连接以处理增加的负载。\n\
  4. **集中化管理**：\n   - 为数据库连接提供集中化的配置。\n\n![Rectangle Rectangle](img/image.png)\n\n\
  ## 连接池如何工作\n\n1. **初始化**：\n   - 在应用程序启动时，会创建预定义数量的连接并存储在池中。\n2. **请求处理**：\n   -\
  \ 当发出数据库连接请求时，连接池会提供一个可用的连接。\n3. **回收**：\n   - 使用后，连接将返回池中而不是被关闭。\n4. **动态管理**：\n\
  \   - 连接池可以根据需求增长或缩小，直到达到配置的限制。\n\n![Rectangle Rectangle](img/image.png)\n\n## 流行的连接池库\n\
  \n| 库 | 描述 |\n| :--- | :--- |\n| HikariCP | 高性能连接池。 |\n| Apache DBCP | 来自 Apache\
  \ Commons 项目的连接池。 |\n| C3P0 | 具有高级功能的易用库。 |\n| Tomcat JDBC | Apache Tomcat 服务器使用的连接池。\
  \ |\n\n![Rectangle Rectangle](img/image.png)\n\n## 1. 使用 HikariCP 使用连接池\n\nHikariCP\
  \ 是 Java 应用中最流行且高性能的连接池库之一。\n\n### 设置\n\n添加以下 Maven 依赖：\n\n```xml\n<dependency>\n\
  \  <groupId>com.zaxxer</groupId>\n  <artifactId>HikariCP</artifactId>\n  <version>5.0.1</version>\n\
  </dependency>\n<dependency>\n  <groupId>mysql</groupId>\n  <artifactId>mysql-connector-java</artifactId>\n\
  \  <version>8.0.33</version>\n</dependency>\n```\n\n#### 代码示例：\n\n```java\nimport\
  \ com.zaxxer.hikari.HikariConfig;\nimport com.zaxxer.hikari.HikariDataSource;\n\
  import java.sql.Connection;\nimport java.sql.PreparedStatement;\nimport java.sql.ResultSet;\n\
  \npublic class HikariCPExample {\n    public static void main(String[] args) {\n\
  \        // HikariCP 配置\n        HikariConfig config = new HikariConfig();\n   \
  \     config.setJdbcUrl(\"jdbc:mysql://localhost:3306/testdb\");\n        config.setUsername(\"\
  root\");\n        config.setPassword(\"password\");\n        config.setMaximumPoolSize(10);\
  \ // 池中最大连接数\n        config.setMinimumIdle(2); // 池中最小空闲连接数\n        config.setIdleTimeout(30000);\
  \ // 空闲超时时间（毫秒）\n        config.setMaxLifetime(1800000); // 连接最大寿命\n\n        //\
  \ 初始化连接池\n        HikariDataSource dataSource = new HikariDataSource(config);\n\
  \        try (Connection conn = dataSource.getConnection()) {\n            String\
  \ sql = \"SELECT * FROM employees\";\n            PreparedStatement pstmt = conn.prepareStatement(sql);\n\
  \            ResultSet rs = pstmt.executeQuery();\n            while (rs.next())\
  \ {\n                System.out.println(\"ID: \" + rs.getInt(\"id\"));\n       \
  \         System.out.println(\"Name: \" + rs.getString(\"name\"));\n           \
  \     System.out.println(\"Position: \" + rs.getString(\"position\"));\n       \
  \         System.out.println(\"---------------------------\");\n            }\n\
  \        } catch (Exception e) {\n            e.printStackTrace();\n        } finally\
  \ {\n            // 关闭数据源\n            dataSource.close();\n        }\n    }\n}\n\
  ```\n\n#### 输出：\n\n```\nID: 1\nName: Alice\nPosition: Manager\n---------------------------\n\
  ID: 2\nName: Bob\nPosition: Engineer\n---------------------------\n```\n\n#### 解释：\n\
  \n1. **HikariConfig**: 配置数据库 URL、凭据和池属性。\n2. **连接池**: `HikariDataSource` 管理连接。\n\
  3. **动态管理**: 根据负载重用或动态创建连接。\n4. **性能**: `HikariCP` 确保了快速且可靠的连接管理。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n## 2. 使用 Apache DBCP 使用连接池\n\nApache DBCP (数据库连接池)\
  \ 是一个稳定且广泛使用的连接池库。\n\n### 设置\n\n添加以下 Maven 依赖：\n\n```xml\n<dependency>\n  <groupId>org.apache.commons</groupId>\n\
  \  <artifactId>commons-dbcp2</artifactId>\n  <version>2.10.0</version>\n</dependency>\n\
  <dependency>\n  <groupId>mysql</groupId>\n  <artifactId>mysql-connector-java</artifactId>\n\
  \  <version>8.0.33</version>\n</dependency>\n```\n\n#### 代码示例：\n\n```java\nimport\
  \ org.apache.commons.dbcp2.BasicDataSource;\nimport java.sql.Connection;\nimport\
  \ java.sql.PreparedStatement;\nimport java.sql.ResultSet;\n\npublic class DBCPExample\
  \ {\n    public static void main(String[] args) {\n        // 配置连接池\n        BasicDataSource\
  \ dataSource = new BasicDataSource();\n        dataSource.setUrl(\"jdbc:mysql://localhost:3306/testdb\"\
  );\n        dataSource.setUsername(\"root\");\n        dataSource.setPassword(\"\
  password\");\n        dataSource.setMaximumPoolSize(10);\n        dataSource.setMinimumIdle(2);\n\
  \n        try (Connection conn = dataSource.getConnection()) {\n            String\
  \ sql = \"SELECT * FROM employees\";\n            PreparedStatement pstmt = conn.prepareStatement(sql);\n\
  \            ResultSet rs = pstmt.executeQuery();\n            while (rs.next())\
  \ {\n                System.out.println(\"ID: \" + rs.getInt(\"id\"));\n       \
  \         System.out.println(\"Name: \" + rs.getString(\"name\"));\n           \
  \     System.out.println(\"Position: \" + rs.getString(\"position\"));\n       \
  \         System.out.println(\"---------------------------\");\n            }\n\
  \        } catch (Exception e) {\n            e.printStackTrace();\n        } finally\
  \ {\n            // 关闭数据源\n            dataSource.close();\n        }\n    }\n}\n\
  ```\n\n\n\n\n职位：工程师\n\n## 解释\n\n1. **Tomcat JDBC Pool**:\n   - 轻量级且高效的池化机制。\n2.\
  \ **PoolProperties**:\n   - 配置最大连接和空闲连接等属性。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 连接池的最佳实践\n\n1. 设置合适的限制：\n   - 避免设置过高的 `maxPoolSize` 以防资源耗尽。\n2. 监控池性能：\n \
  \  - 使用监控工具观察连接使用情况和池的健康状况。\n3. 凭据安全：\n   - 使用安全方法存储和检索数据库凭据。\n4. 正确关闭连接：\n   -\
  \ 始终使用 `try-with-resources` 将连接返回到池中。\n5. 优化池配置：\n   - 通过调整 `idleTimeout` 和 `maxLifetime`\
  \ 等参数，在性能和资源消耗之间取得平衡。\n\n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\n- **连接池**：\n\
  \  - 重用连接以减少延迟和资源消耗。\n- **常用库**：\n  - `HikariCP`、`Apache DBCP` 和 `Tomcat JDBC Pool`。\n\
  - **配置**：\n  - 设置最大连接、空闲超时和生存属性。\n- **最佳实践**：\n  - 确保数据库交互的安全、高效和可扩展。\n\n连接池是优化数据库操作的关键实践，特别是在高并发环境下。适当配置池可以增强性能、扩展性和资源管理。\n\
  \n## Hibernate 简介\n\nHibernate 是一个用于 Java 应用程序强大开源对象关系映射（ORM）框架。它通过将 Java 对象映射到数据库表，允许开发者使用高层面向对象的原则而非\
  \ SQL 来操作数据库。\n\n![Rectangle Rectangle](img/image.png)\n\n### Hibernate 的核心特性\n\n\
  1. **对象关系映射 (ORM)**：\n   - 将 Java 类映射到数据库表，将 Java 对象映射到行。\n2. **数据库独立性**：\n   -\
  \ 支持多种数据库（例如 `MySQL`、`PostgreSQL`、`Oracle`），无需更改代码。\n3. **HQL (Hibernate 查询语言)**：\n\
  \   - 一种类似于 SQL 的查询语言，但它作用于 Java 对象而非数据库表。\n4. **懒性加载**：\n   - 在访问相关数据之前推迟加载，从而优化性能。\n\
  5. **缓存**：\n   - 内置缓存机制以提高查询性能。\n6. **自动创建表**：\n   - 可以根据映射生成数据库架构。\n7. **事务管理**：\n\
  \   - 与 JTA 及其他事务 API 集成，实现健壮的事务处理。\n8. **注解和 XML 映射**：\n   - 支持通过注解或 XML 文件配置。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 为什么使用 Hibernate？\n\n1. **简化开发**：\n\
  \   - 消除了用于 JDBC 和手动处理 SQL 的样板代码。\n2. **可移植性**：\n   - 无需更改应用程序逻辑即可轻松切换数据库。\n3. **效率**：\n\
  \   - 为数据库操作提供高级 API，缩短开发时间。\n4. **可维护性**：\n   - 集中映射和配置简化了架构管理。\n5. **性能**：\n \
  \  - 缓存和批处理等特性增强了应用程序效率。\n\n![Rectangle Rectangle](img/image.png)\n\n### Hibernate\
  \ 核心组件\n\n| 组件 | 描述 |\n| :--- | :--- |\n| Configuration | 加载 Hibernate 设置和数据库连接属性。\
  \ |\n| SessionFactory | 创建 `Session` 对象的工厂。线程安全且不可变。 |\n| Session | 代表与数据库的连接，用于\
  \ `CRUD` 操作。 |\n| Transaction | 管理数据库事务。 |\n| Query | 执行 `HQL` 或原生 SQL 查询。 |\n|\
  \ Criteria API | 以编程方式创建动态查询。 |\n\n![Rectangle Rectangle](img/image.png)\n\n###\
  \ Hibernate 架构\n\n1. **Java 应用程序**：\n   - 包含业务逻辑并与 Hibernate 交互。\n2. **Hibernate\
  \ 框架**：\n   - 使用 XML 或注解将 Java 对象映射到数据库表。\n3. **数据库**：\n   - 存储和检索数据的关系型数据库。\n\n\
  ![Rectangle Rectangle](img/image.png)\n\n### Hibernate 工作流\n\n1. **配置**：\n   - 设置\
  \ Hibernate 配置文件或注解，将 Java 类映射到数据库表。\n2. **SessionFactory**：\n   - 从配置构建 `SessionFactory`。\n\
  3. **Session**：\n   - 获取 `Session` 对象以与数据库交互。\n4. **Transaction**：\n   - 事务以确保操作的原子性。\n\
  5. **操作**：\n   - 使用 session 执行 `CRUD` 操作。\n6. **提交/关闭**：\n   - 提交事务并关闭 session 以释放资源。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 设置 Hibernate\n\n### 1. 添加依赖\n\n对于\
  \ Maven：\n\n```xml\n<dependency>\n  <groupId>org.hibernate</groupId>\n  <artifactId>hibernate-core</artifactId>\n\
  \  <version>5.6.16.Final</version>\n</dependency>\n<dependency>\n  <groupId>mysql</groupId>\n\
  \  <artifactId>mysql-connector-java</artifactId>\n  <version>8.0.33</version>\n\
  </dependency>\n```\n\n![Rectangle Rectangle](img/image.png)\n\n#### 2. 创建 Hibernate\
  \ 配置文件\n\n`hibernate.cfg.xml`:\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<!DOCTYPE hibernate-configuration PUBLIC\n\"-//Hibernate/Hibernate Configuration\
  \ DTD 3.0//EN\"\n\"http://hibernate.sourceforge.net/hibernate-configuration-3.0.dtd\"\
  >\n<hibernate-configuration>\n  <session-factory>\n    <!-- Database Connection\
  \ Settings -->\n    <property name=\"hibernate.connection.driver_class\">com.mysql.cj.jdbc.Driver</property>\n\
  \    <property name=\"hibernate.connection.url\">jdbc:mysql://localhost:3306/testdb</property>\n\
  \    <property name=\"hibernate.connection.username\">root</property>\n    <property\
  \ name=\"hibernate.connection.password\">password</property>\n    <!-- Hibernate\
  \ Properties -->\n    <property name=\"hibernate.dialect\">org.hibernate.dialect.MySQLDialect</property>\n\
  \    <property name=\"hibernate.show_sql\">true</property>\n    <property name=\"\
  hibernate.hbm2ddl.auto\">update</property>\n    <!-- Mapping Class -->\n    <mapping\
  \ class=\"com.example.Employee\"/>\n  </session-factory>\n</hibernate-configuration>\n\
  ```\n\n![Rectangle Rectangle](img/image.png)\n\n### 3. 创建 Java 类\n\n`Employee.java`:\n\
  \n```java\npackage com.example;\n\nimport javax.persistence.*;\n\n@Entity\n@Table(name\
  \ = \"employees\")\npublic class Employee {\n    @Id\n    @GeneratedValue(strategy\
  \ = GenerationType.IDENTITY)\n    private int id;\n\n    @Column(name = \"name\"\
  )\n    private String name;\n\n    @Column(name = \"position\")\n    private String\
  \ position;\n\n    @Column(name = \"salary\")\n    private double salary;\n\n  \
  \  // Getters and Setters\n    public int getId() {\n        return id;\n    }\n\
  \    public void setId(int id) {\n        this.id = id;\n    }\n\n    public String\
  \ getName() {\n        return name;\n    }\n    public void setName(String name)\
  \ {\n        this.name = name;\n    }\n\n    public String getPosition() {\n   \
  \     return position;\n    }\n    public void setPosition(String position) {\n\
  \        this.position = position;\n    }\n\n    public double getSalary() {\n \
  \       return salary;\n    }\n    public void setSalary(double salary) {\n    \
  \    this.salary = salary;\n    }\n}\n```\n\n### 4. 执行 CRUD 操作\n\n`Main.java`:\n\
  \n```java\npackage com.example;\n\nimport org.hibernate.Session;\nimport org.hibernate.SessionFactory;\n\
  import org.hibernate.Transaction;\nimport org.hibernate.cfg.Configuration;\n\npublic\
  \ class Main {\n    public static void main(String[] args) {\n        // Load Hibernate\
  \ Configuration\n        Configuration config = new Configuration().configure();\n\
  \        SessionFactory sessionFactory = config.buildSessionFactory();\n\n     \
  \   // Open Session\n        Session session = sessionFactory.openSession();\n \
  \       Transaction transaction = session.beginTransaction();\n\n        // Create\
  \ an Employee\n        Employee employee = new Employee();\n        employee.setName(\"\
  Alice\");\n        employee.setPosition(\"Manager\");\n    }\n}\n```\n\n\n\n\n\n\
  ```java\nemployee.setSalary(75000);\n\n// 保存员工\nsession.save(employee);\n\n// 提交事务\n\
  transaction.commit();\n\n// ... (代码部分省略)\n```\n\n### 输出\n\n当应用程序运行时：\n\n1. 会创建一个名为\
  \ `employees` 的表（如果不存在）。\n\n插入一条带有以下值的新记录：ID：自动生成\n名称：Alice\n职位：经理\n薪资：75000\n\n\
  2. `Hibernate` 会记录执行在数据库上的 SQL 查询。\n\n![Rectangle Rectangle](img/image.png)\n\n\
  ### 解释\n\n1. 配置：\n<bdi>○</bdi>``hibernate.cfg.xml` 包含数据库连接和 Hibernate 设置。\n\n2.\
  \ 注解：\n<bdi>○</bdi>``@Entity`、`@Table` 和 `@Column` 将 Java 类和字段映射到数据库表和列。\n\n3. 会话：\n\
  <bdi>○</bdi>``Session` 对象管理与数据库的交互。\n\n4. 事务：\n<bdi>○</bdi>确保操作过程期间的原子性和一致性。\n\n\
  5. CRUD 操作：\n<bdi>○</bdi>``session.save()` 将数据插入数据库中。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### Hibernate 的优点\n\n1. 易于使用：\n<bdi>○</bdi>通过自动生成 SQL 简化了数据库操作。\n\n2. 可移植性：\n\
  <bdi>○</bdi>只需极少更改即可适用于各种关系型数据库。\n\n3. 高性能：\n<bdi>○</bdi>缓存和懒性加载等优化提升了效率。\n\n4.\
  \ 完善的 API：\n<bdi>○</bdi>支持批处理和分页等高级数据库功能。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### Hibernate 的缺点\n\n1. 学习曲线：\n<bdi>○</bdi>与原生 ``JDBC` 相比，学习曲线更陡。\n\n2. 开销：\n\
  <bdi>○</bdi>对于数据库交互极少的简单应用程序，可能会引入开销。\n\n3. 复杂性：\n<bdi>○</bdi>对于大型应用程序，配置和调试可能非常复杂。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\n<bdi>●</bdi>``Hibernate`：\n\
  <bdi>○</bdi>一个功能强大的 Java ORM 框架，简化了数据库交互。\n\n<bdi>●</bdi>特性：\n<bdi>○</bdi>ORM、``HQL`、缓存和自动创建表。\n\
  \n<bdi>●</bdi>设置：\n<bdi>○</bdi>需要配置文件、带注解的 Java 类和会话管理。\n\n<bdi>●</bdi>用例：\n<bdi>○</bdi>非常适用于需要频繁数据库交互的级级应用程序。\n\
  \n``Hibernate` 是构建数据库驱动应用程序的 Java 开发者的必修课程，它为基于 ``JDBC` 的手动操作提供了一个稳健的替代方案。\n\n#\
  \ GUI 开发\n\n## Swing 简介\n\n``Swing` 是 Java 标准库的一部分，用于为桌面应用程序构建图形用户界面（GUI）。它是一个轻量级、平台无关且可扩展的框架，在旧的抽象窗口工具包（``AWT`）的基础上，提供了更复杂、更灵活的组件。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### Swing 的关键特性\n\n1. 丰富的组件集：\n<bdi>○</bdi>提供按钮、表格、树和菜单等可以自定义的组件。\n\
  \n2. 轻量级：\n<bdi>○</bdi>```Swing` 组件不绑定到原生操作系统（OS）组件，使其具有可移植性。\n\n3. MVC 架构：\n<bdi>○</bdi>遵循模型-视图-控制器架构，实现逻辑与呈现分离。\n\
  \n4. 可插件的外观和感觉（Look and Feel）：\n<bdi>○</bdi>```Swing` 允许动态更改 GUI 的外观（例如 Windows、Metal、Nimbus）。\n\
  \n5. 事件驱动编程：\n<bdi>○</bdi>使用监听器处理按钮点击或鼠标移动等用户交互。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### Swing vs. AWT\n\n| 特性 | ``Swing` | ``AWT` |\n| :--- | :--- | :--- |\n| 架构\
  \ | 轻量级（不依赖操作系统组件）。 | 重量级（使用原生操作系统组件）。 |\n| 灵活性 | 高可自定义组件。 | 灵活性有限。 |\n| 外观和感觉 |\
  \ 可插件的外观和感觉。 | 取决于操作系统外观。 |\n| 组件 | 更丰富、先进（例如 ``JTable`、``JTree`）。 | 基本组件。 |\n\n\
  ![Rectangle Rectangle](img/image.png)\n\n### Swing 核心组件\n\n| 组件 | 说明 |\n| :--- |\
  \ :--- |\n| ``JFrame` | 主容器窗口。 |\n| ``JPanel` | 用于组织组件的通用容器。 |\n| ``JLabel` | 显示文本或图像。\
  \ |\n| ``JButton` | 表示可点击的按钮。 |\n| ``JTextField` | 单行文本输入框。 |\n| ``JTextArea` |\
  \ 多行文本区域。 |\n| ``JComboBox` | 下拉列表。 |\n| ``JTable` | 显示表格数据。 |\n| ``JScrollPane`\
  \ | 为组件添加滚动功能。 |\n\n![Rectangle Rectangle](img/image.png)\n\n### Swing 应用程序的基本结构\n\
  \n1. 创建一个 ``JFrame`：\n<bdi>○</bdi>这是放置其他组件的主容器窗口。\n\n2. 添加组件：\n<bdi>○</bdi>添加按钮、标签或文本框。\n\
  \n3. 处理事件：\n<bdi>○</bdi>使用监听器处理用户交互。\n\n4. 显示窗口：\n<bdi>○</bdi>使框架可见。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n\n\n\n\n```java\nframe.setLayout(new BorderLayout());\n\
  \nframe.add(label, BorderLayout.CENTER);\n\nframe.add(button, BorderLayout.SOUTH);\n\
  \n// 显示 Frame\n\nframe.setVisible(true);\n\n}\n\n}\n```\n\n#### 输出：\n\n<bdi>●</bdi>一个带有标签“Click\
  \ the button:”的窗口。\n\n<bdi>●</bdi>点击按钮会将标签更改为“Button Clicked!”。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 解释析：\n\n1. 动作监听器 (Action Listener)：\n\n<bdi>○</bdi>捕获按钮点击事件并执行指定的动作。\n\n\
  2. 事件处理：\n\n<bdi>○</bdi>`ActionEvent` 包含有关按钮点击的详细信息。\n\n<bdi>○</bdi>`setText()`\
  \ 动态更新标签文本。\n\n![Rectangle Rectangle](img/image.png)\n\n### 4. 使用布局管理器\n\nSwing\
  \ 提供了各种布局管理器来排列组件：\n\n| 布局管理器 | 描述 |\n| :--- | :--- |\n| FlowLayout | 水平排列组件。 |\n\
  | BorderLayout | 将容器分为五个区域（北、南、东、西、中）。 |\n| GridLayout | 在行和列的网格中排列组件。 |\n| BoxLayout\
  \ | 垂直或水平排列组件。 |\n\n#### GridLayout 的代码示例：\n\n```java\nimport javax.swing.*;\nimport\
  \ java.awt.*;\n\npublic class GridLayoutExample {\n\n    public static void main(String[]\
  \ args) {\n        JFrame frame = new JFrame(\"GridLayout Example\");\n        frame.setSize(400,\
  \ 300);\n        frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n       \
  \ frame.setLayout(new GridLayout(2, 2)); // 2 行，2 列\n        frame.add(new JButton(\"\
  Button 1\"));\n        frame.add(new JButton(\"Button 2\"));\n        frame.add(new\
  \ JButton(\"Button 3\"));\n        frame.add(new JButton(\"Button 4\"));\n     \
  \   frame.setVisible(true);\n    }\n}\n```\n\n#### 输出：\n\n<bdi>●</bdi>一个 2x2 的网格，四个按钮按行和列排列。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 5. 创建真实世界的应用\n\n#### 代码示例：登录表单\n\n\
  ```java\nimport javax.swing.*;\nimport java.awt.*;\nimport java.awt.event.ActionEvent;\n\
  import java.awt.event.ActionListener;\n\npublic class LoginForm {\n\n    public\
  \ static void main(String[] args) {\n        JFrame frame = new JFrame(\"Login Form\"\
  );\n        frame.setSize(300, 200);\n        frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \        frame.setLayout(new GridLayout(3, 2));\n\n        // 创建组件\n        JLabel\
  \ userLabel = new JLabel(\"Username:\");\n        JTextField userField = new JTextField();\n\
  \        JLabel passLabel = new JLabel(\"Password:\");\n        JPasswordField passField\
  \ = new JPasswordField();\n        JButton loginButton = new JButton(\"Login\");\n\
  \        JLabel messageLabel = new JLabel(\"\", SwingConstants.CENTER);\n\n    \
  \    // 为登录按钮添加 ActionListener\n        loginButton.addActionListener(new ActionListener()\
  \ {\n            @Override\n            public void actionPerformed(ActionEvent\
  \ e) {\n                String username = userField.getText();\n               \
  \ String password = new String(passField.getPassword());\n                if (username.equals(\"\
  admin\") && password.equals(\"1234\")) {\n                    messageLabel.setText(\"\
  Login Successful!\");\n                } else {\n                    messageLabel.setText(\"\
  Invalid Credentials.\");\n                }\n            }\n        });\n\n    \
  \    // 将组件添加到 Frame\n        frame.add(userLabel);\n        frame.add(userField);\n\
  \        frame.add(passLabel);\n        frame.add(passField);\n        frame.add(loginButton);\n\
  \        frame.add(messageLabel);\n        frame.setVisible(true);\n    }\n}\n```\n\
  \n#### 输出：\n\n<bdi>●</bdi>一个包含用户名、密码字段和登录按钮的登录表单。\n\n<bdi>●</bdi>根据输入显示“Login Successful!”或“Invalid\
  \ Credentials.”。\n\n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\n1. Swing\
  \ 特性：\n\n<bdi>○</bdi>轻量级、平台无关且丰富的 GUI 组件。\n\n2. 核心组件：\n\n<bdi>○</bdi>包括 `JFrame`、`JButton`、`JTextField`\
  \ 等。\n\n3. 事件处理：\n\n<bdi>○</bdi>使用 `ActionListener` 等监听器进行交互。\n\n4. 布局管理器：\n\n<bdi>○</bdi>在框架内动态地排列组件。\n\
  \n5. 真实世界应用：\n\n<bdi>○</bdi>构建表单、仪表板和其他桌面应用程序。\n\nSwing 是一个用于开发 Java 桌面 GUI 应用的多功能且广泛使用的库。它简化了用户友好且具有交互性的界面的创建。\n\
  \n## JavaFX 简介\n\nJavaFX 是一个用于用 Java 构建丰富的桌面和 Web 应用程序的现代强大框架。它是 Swing 的继任者，提供了更高级的工具来创建视觉吸引力的用户界面，并支持高级图形、动画和多媒体。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### JavaFX 的关键特性\n\n1. 丰富的 UI 组件：\n\n\
  <bdi>○</bdi>包括图表、表格和树形等高级组件。\n\n2. CSS 样式：\n\n<bdi>○</bdi>使用 CSS 自定义应用程序的外观。\n\n\
  3. FXML：\n\n<bdi>○</bdi>一种基于 XML 的声明式语言。\n\n4. 绑定与属性：\n\n<bdi>○</bdi>简化 UI 组件之间的数据同步。\n\
  \n5. 多媒体支持：\n\n<bdi>○</bdi>内置音频、视频支持。\n\n6. 动画与效果：\n\n<bdi>○</bdi>支持过渡、动画和图形效果。\n\
  \n7. 跨平台：\n\n<bdi>○</bdi>在 Windows、macOS 和 Linux 上运行。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### JavaFX 架构\n\nJavaFX 遵循 `Stage`-`Scene`-`Node` 层级结构：\n\n<bdi>●</bdi>`Stage`:顶层容器（窗口）。\n\
  \n<bdi>●</bdi>`Scene`:包含所有内容（例如，布局）。\n\n<bdi>●</bdi>`Nodes`:视觉元素，如按钮、标签。\n\n###\
  \ 设置 JavaFX\n\n在 Maven 中添加依赖：\n\n```xml\n<dependency>\n    <groupId>org.openjfx</groupId>\n\
  \    <artifactId>javafx-controls</artifactId>\n    <version>20</version>\n</dependency>\n\
  <dependency>\n    <groupId>org.openjfx</groupId>\n    <artifactId>javafx-fxml</artifactId>\n\
  \    <version>20</version>\n</dependency>\n```\n\n运行 JavaFX 时添加以下 VM 参数：\n\n`--module-path\
  \ path-to-javafx/lib --add-modules controls,fxml`\n\n### JavaFX 应用的基本结构\n\nJavaFX\
  \ 应用扩展 `Application` 类并重写 `start` 方法，在此构建并显示 UI。\n\n### 1. 创建简单的 JavaFX 应用\n\n####\
  \ 代码示例：\n\n```java\nimport javafx.application.Application;\nimport javafx.scene.Scene;\n\
  import javafx.scene.control.Label;\nimport javafx.stage.Stage;\n\npublic class SimpleFXApp\
  \ extends Application {\n\n    @Override\n    public void start(Stage stage) {\n\
  \        // 创建 Label\n        Label label = new Label(\"Welcome to JavaFX!\");\n\
  \n        // 创建 Scene\n        Scene scene = new Scene(label, 400, 300);\n\n   \
  \     // 设置 Stage\n        stage.setTitle(\"SimpleFX Application\");\n        stage.setScene(scene);\n\
  \        stage.show();\n    }\n\n    public static void main(String[] args) {\n\
  \        launch();\n    }\n}\n```\n\n#### 输出：\n\n<bdi>●</bdi>一个标题为“SimpleFX Application”的窗口，显示“Welcome\
  \ to JavaFX!”。\n\n![Rectangle Rectangle](img/image.png)\n\n#### 解释：\n\n1. `Application`\
  \ 类：所有 JavaFX 应用的基础类。\n2. `Stage`：应用的主窗口。\n3. `Scene`：包含所有 组件（例如 Label）。\n4. `launch()`：启动\
  \ JavaFX 应用。\n\n### 2. 添加多个组件\n\n#### 代码示例：\n\n```java\nimport javafx.application.Application;\n\
  import javafx.scene.Scene;\nimport javafx.scene.control.Button;\nimport javafx.scene.control.Label;\n\
  import javafx.scene.control.TextField;\nimport javafx.scene.layout.VBox;\nimport\
  \ javafx.stage.Stage;\n\npublic class MultiComponentApp extends Application {\n\n\
  \    @Override\n    public void start(Stage stage) {\n        // 创建组件\n        Label\
  \ label = new Label(\"Enter your name:\");\n        TextField textField = new TextField();\n\
  \        Button button = new Button(\"Submit\");\n\n        // 事件处理\n        button.setOnAction(e\
  \ -> label.setText(\"Hello, \" + textField.getText() + \"!!\"));\n\n        // 布局\n\
  \        VBox layout = new VBox(10, label, textField, button);\n\n        // 创建\
  \ Scene\n        Scene scene = new Scene(layout, 400, 200);\n\n        // 设置 Stage\n\
  \        stage.setScene(scene);\n        stage.show();\n    }\n}\n```\n\n\n\n\n\n\
  ```java\nstage.setTitle(\"Multi-Component JavaFX App\");\n\nstage.setScene(scene);\n\
  \nstage.show();\n\n}\n\npublic static void main(String[] args) {\n    launch();\n\
  }\n\n}\n```\n\n#### 输出：\n\n<bdi>●</bdi>一个包含标签、文本字段和按钮的窗口。\n\n<bdi>●</bdi>输入名称并点击按钮会将标签更新为“Hello,\
  \ [Name]!”。\n\n![Rectangle Rectangle](img/image.png)\n\n#### 解释：\n\n1. 事件处理：\n\n\
  <bdi>○</bdi>`setOnAction` 方法监听按钮点击。\n\n2. 布局管理器：\n\n<bdi>○</bdi>`VBox` 以 10 像素的间距垂直排列组件。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 3. 使用 CSS 进行样式设置\n\n#### 代码示例：\n\n\
  ```java\nimport javafx.application.Application;\n\nimport javafx.scene.Scene;\n\
  import javafx.scene.control.Button;\nimport javafx.scene.layout.StackPane;\nimport\
  \ javafx.stage.Stage;\n\npublic class CSSExample extends Application {\n\n    @Override\n\
  \    public void start(Stage stage) {\n        // 创建一个按钮\n        Button button\
  \ = new Button(\"Click Me\");\n        button.setId(\"myButton\");\n\n        //\
  \ 布局\n        StackPane layout = new StackPane(button);\n\n        // 创建一个场景\n \
  \       Scene scene = new Scene(layout, 300, 200);\n\n        // 应用 CSS\n      \
  \  scene.getStylesheets().add(\"styles.css\");\n\n        // 设置舞台\n        stage.setTitle(\"\
  JavaFX with CSS\");\n        stage.setScene(scene);\n        stage.show();\n   \
  \ }\n\n    public static void main(String[] args) {\n        launch();\n    }\n\
  }\n```\n\n`styles.css`:\n\n```css\n#myButton {\n    -fx-font-size: 16px;\n    -fx-background-color:\
  \ #4CAF50;\n    -fx-text-fill: white;\n    -fx-padding: 10px;\n    -fx-border-radius:\
  \ 5px;\n    -fx-background-radius: 5px;\n}\n```\n\n#### 输出：\n\n<bdi>●</bdi>一个具有绿色背景、白色文字和圆角的样式化按钮。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n#### 解释：\n\n1. CSS 样式设置：\n\n<bdi>○</bdi>使用外部样式表设置组件样式。\n\
  \n2. 选择器：\n\n<bdi>○</bdi>可以通过 `id` 或类名定位组件。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 4. 使用 FXML 创建登录表\n\nFXML 是一种基于 XML 的语言，用于定义 UI 结构。\n\n#### FXML 文件 (login.fxml):\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<?import javafx.scene.control.*?>\n\
  <?import javafx.scene.layout.*?>\n<VBox xmlns:fx=\"http://javafx.com/fxml\" spacing=\"\
  10\" alignment=\"CENTER\">\n    <Label text=\"Username:\" />\n    <TextField fx:id=\"\
  usernameField\" />\n    <Label text=\"Password:\" />\n    <PasswordField fx:id=\"\
  passwordField\" />\n    <Button text=\"Login\" onAction=\"#handleLogin\" />\n  \
  \  <Label fx:id=\"messageLabel\" />\n</VBox>\n```\n\n#### 代码示例：\n\n```java\nimport\
  \ javafx.application.Application;\nimport javafx.fxml.FXML;\nimport javafx.fxml.FXMLLoader;\n\
  import javafx.scene.Parent;\nimport javafx.scene.Scene;\nimport javafx.scene.control.Label;\n\
  import javafx.scene.control.PasswordField;\nimport javafx.scene.control.TextField;\n\
  import javafx.stage.Stage;\n\npublic class FXMLLoginApp extends Application {\n\n\
  \    @FXML\n    private TextField usernameField;\n\n    @FXML\n    private PasswordField\
  \ passwordField;\n\n    @FXML\n    private Label messageLabel;\n\n    @Override\n\
  \    public void start(Stage stage) throws Exception {\n        Parent root = FXMLLoader.load(getClass().getResource(\"\
  login.fxml\"));\n        Scene scene = new Scene(root);\n        stage.setTitle(\"\
  FXML Login Form\");\n        stage.setScene(scene);\n        stage.show();\n   \
  \ }\n\n    @FXML\n    private void handleLogin() {\n        String username = usernameField.getText();\n\
  \        String password = passwordField.getText();\n        if (username.equals(\"\
  admin\") && password.equals(\"1234\")) {\n            messageLabel.setText(\"Login\
  \ Successful!\");\n        } else {\n            messageLabel.setText(\"Invalid\
  \ Credentials.\");\n        }\n    }\n\n    public static void main(String[] args)\
  \ {\n        launch();\n    }\n}\n```\n\n#### 输出：\n\n<bdi>●</bdi>一个包含用户名和密码字段的登录表。\n\
  \n<bdi>●</bdi>根据输入显示“Login Successful!”或“Invalid Credentials.”。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 解释：\n\n1. FXML：\n\n<bdi>○</bdi>在 XML 中定义 UI 结构。\n\n2. 控制器：\n\n<bdi>○</bdi>使用\
  \ `@FXML` 等注解将 UI 组件与 Java 逻辑连接起来。\n\n3. 事件绑定：\n\n<bdi>○</bdi>FXML 中的 `onAction`\
  \ 属性将按钮点击绑定到 Java 方法。\n\n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\n<bdi>●</bdi>JavaFX\
  \ 特性：\n\n<bdi>○</bdi>包含 CSS 样式和 FXML 声明式设计。\n\n核心组件：\n\n<bdi>○</bdi>提供了 `Stage`、`Scene`\
  \ 以及各种组件。\n\n## Servlet 简介\n\nServlet 是扩展服务器能力的服务器端 Java 程序，接收来自客户端（通常是浏览器）的请求并生成内容。\n\
  \n### Servlet 特性\n\n1. 服务器端执行：\n\n<bdi>○</bdi>运行在服务器上。\n\n2. 协议处理：\n\n<bdi>○</bdi>处理\
  \ HTTP 协议。\n\n3. 可移植性：\n\n<bdi>○</bdi>独立于平台，在任何 Java 上。\n\n4. 会话管理：\n\n<bdi>○</bdi>内置会话支持。\n\
  \n5. 集成：\n\n<bdi>○</bdi>可以与数据库和其他 API 交互。\n\n### Servlet 生命周期\n\n1. 加载与实例化：\n\n\
  <bdi>○</bdi>Servlet 由 Servlet 容器加载并实例化。\n\n2. 初始化 (init 方法)：\n\n<bdi>○</bdi>当 Servlet\
  \ 被初始化时调用一次。\n\n3. 请求处理 (service 方法)：\n\n<bdi>○</bdi>为每个客户端请求调用。根据 HTTP 方法将工作委托给\
  \ `doGet`、`doPost` 等。\n\n4. 销毁 (destroy 方法)：\n\n<bdi>○</bdi>当 Servlet 停止服务时调用一次。\n\
  \n### Servlet 开发设置\n\n1. 安装 Servlet 容器：\n\n<bdi>○</bdi>Apache Tomcat 是常用的 Servlet\
  \ 容器。\n\n添加依赖项：对于 Maven，包含 servlet 依赖：\n\n```xml\n<dependency>\n    <groupId>javax.servlet</groupId>\n\
  \    <artifactId>servlet-api</artifactId>\n    <version>4.0.1</version>\n    <scope>provided</scope>\n\
  </dependency>\n```\n\n2. 配置部署符 (web.xml)：\n\n<bdi>○</bdi>将 Servlet 映射到 URL 模式。\n\
  \n### Servlet 的基本结构\n\nServlet 类继承 `HttpServlet` 并重写如 `doGet` 或 `doPost` 等方法。\n\n\
  ### 1. 简单的 Servlet\n\n#### 代码示例：\n\n```java\nimport java.io.IOException;\nimport\
  \ javax.servlet.ServletException;\nimport javax.servlet.annotation.WebServlet;\n\
  import javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
  import javax.servlet.http.HttpServletResponse;\n\n@WebServlet(\"/hello\")\npublic\
  \ class HelloServlet extends HttpServlet {\n\n    @Override\n    protected void\
  \ doGet(HttpServletRequest request, HttpServletResponse response)\n    throws ServletException,\
  \ IOException {\n        response.setContentType(\"text/html\");\n        response.getWriter().println(\"\
  <h1>Welcome to Java Servlets!</h1>\");\n    }\n}\n```\n\n#### 输出：\n\n当访问 `http://localhost:8080/your-app/hello`\
  \ 时，浏览器显示：Welcome to Java Servlets!\n\n#### 解释：\n\n1. `@WebServlet` 注解：\n\n<bdi>○</bdi>将\
  \ Servlet 映射到 `/hello`。\n\n2. `doGet` 方法：\n\n<bdi>○</bdi>处理 HTTP GET 请求。\n\n3. 响应处理：\n\
  \n<bdi>○</bdi>设置内容类型为 `text/html` 并向响应中写入 HTML 输出。\n\n### 2. 处理表单数据 (POST 方法)\n\n\
  #### 代码示例：\n\n```java\nimport java.io.IOException;\n```\n\n\n\n\n\n```java\nimport\
  \ javax.servlet.ServletException;\nimport javax.servlet.annotation.WebServlet;\n\
  import javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
  import javax.servlet.http.HttpServletResponse;\nimport java.io.IOException; // Added\
  \ missing import based on usage in code\n\n@WebServlet(\"/submit\")\npublic class\
  \ SubmitServlet extends HttpServlet {\n\n    @Override\n    protected void doPost(HttpServletRequest\
  \ request, HttpServletResponse response)\n            throws ServletException, IOException\
  \ {\n        String name = request.getParameter(\"name\");\n        response.setContentType(\"\
  text/html\");\n        response.getWriter().println(\"<h1>Hello, \" + name + \"\
  !</h1>\");\n    }\n}\n```\n\nHTML 表单：\n\n```html\n<form action=\"submit\" method=\"\
  POST\">\n    <label for=\"name\">Enter your name:</label>\n    <input type=\"text\"\
  \ id=\"name\" name=\"name\">\n    <button type=\"submit\">Submit</button>\n</form>\n\
  ```\n\n#### 输出：\n1. 用户通过表单提交他们的姓名。\nServlet 响应为：Hello, [姓名]!\n\n#### 解释：\n1. `doPost`\
  \ 方法：\n   - 处理 HTTP POST 请求。\n2. `getParameter`：\n   - 获取请求中发送的表单数据。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 3. 带有初始化参数的 Servlet\n\n#### 代码示例：\n\n```java\n\
  import java.io.IOException;\nimport javax.servlet.ServletConfig;\nimport javax.servlet.ServletException;\n\
  import javax.servlet.annotation.WebServlet;\nimport javax.servlet.http.HttpServlet;\n\
  import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
  \n@WebServlet(\"/config\")\npublic class ConfigServlet extends HttpServlet {\n \
  \   private String appName;\n\n    @Override\n    public void init(ServletConfig\
  \ config) throws ServletException {\n        super.init(config);\n        appName\
  \ = config.getInitParameter(\"AppName\");\n    }\n\n    @Override\n    protected\
  \ void doGet(HttpServletRequest request, HttpServletResponse response)\n       \
  \     throws ServletException, IOException {\n        response.setContentType(\"\
  text/html\");\n        response.getWriter().println(\"<h1>Welcome to \" + appName\
  \ + \"!</h1>\");\n    }\n}\n```\n\nweb.xml 配置：\n\n```xml\n<servlet>\n    <servlet-name>ConfigServlet</servlet-name>\n\
  \    <servlet-class>ConfigServlet</servlet-class>\n    <init-param>\n        <param-name>AppName</param-name>\n\
  \        <param-value>My Awesome App</param-value>\n    </init-param>\n</servlet>\n\
  <servlet-mapping>\n    <servlet-name>ConfigServlet</servlet-name>\n    <url-pattern>/config</url-pattern>\n\
  </servlet-mapping>\n```\n\n#### 输出：\n访问 `http://localhost:8080/your-app/config`\
  \ 显示：Welcome to My Awesome App!\n\n#### 解释：\n1. 初始化参数：\n   - `init` 从 `web.xml`\
  \ 获取配置参数。\n2. 可重用性：\n   - 无需更改 Servlet 代码即可自定义参数。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 4. 在 Servlet 中管理会话 (Sessions)\n\n#### 代码示例：\n\n```java\nimport java.io.IOException;\n\
  import javax.servlet.ServletException;\nimport javax.servlet.annotation.WebServlet;\n\
  import javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
  import javax.servlet.http.HttpServletResponse;\nimport javax.servlet.http.HttpSession;\n\
  \n@WebServlet(\"/session\")\npublic class SessionServlet extends HttpServlet {\n\
  \    @Override\n    protected void doGet(HttpServletRequest request, HttpServletResponse\
  \ response)\n            throws ServletException, IOException {\n        HttpSession\
  \ session = request.getSession();\n        Integer count = (Integer) session.getAttribute(\"\
  count\");\n        if (count == null) {\n            count = 1;\n        } else\
  \ {\n            count++;\n        }\n        session.setAttribute(\"count\", count);\n\
  \        response.setContentType(\"text/html\");\n        response.getWriter().println(\"\
  <h1>Page Visits: \" + count + \"</h1>\");\n    }\n}\n```\n\n#### 输出：\n● 用户每次刷新页面，访问次数就会就会增加。\n\
  \n#### 解释：\n1. `HttpSession`：\n   - 跨多个请求管理用户会话。\n2. 属性 (Attributes)：\n   - `getAttribute`\
  \ 获取会话数据。\n   - `setAttribute` 存储会话数据。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 5. 重定向 (Redirects) 与 转发 (Forwarding)\n\n#### 代码示例（重定向）：\n\n```java\n@WebServlet(\"\
  /redirect\")\npublic class RedirectServlet extends HttpServlet {\n    @Override\n\
  \    protected void doGet(HttpServletRequest request, HttpServletResponse response)\n\
  \            throws ServletException, IOException {\n        response.sendRedirect(\"\
  https://example.com\");\n    }\n}\n```\n\n#### 输出：\n● 将用户重定向到 `https://example.com`。\n\
  \n#### 代码示例（转发）：\n\n```java\n@WebServlet(\"/forward\")\npublic class ForwardServlet\
  \ extends HttpServlet {\n    @Override\n    protected void doGet(HttpServletRequest\
  \ request, HttpServletResponse response)\n            throws ServletException, IOException\
  \ {\n        request.getRequestDispatcher(\"/hello\").forward(request, response);\n\
  \    }\n}\n```\n\n#### 输出：\n● 将请求转发到 `/hello` servlet。\n\n#### 解释：\n1. 重定向 (Redirect)：\n\
  \   - 向客户端发送新请求，改变 URL。\n2. 转发 (Forward)：\n   - 将请求传递给另一个资源，而不改变 URL。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### Servlet 最佳实践\n\n1. 使用注解：\n   - 优先使用 `@WebServlet`\
  \ 而非 `web.xml` 以保持代码简洁。\n2. 线程安全：\n   - 避免使用实例变量以防止多线程环境下的数据损坏。\n3. 逻辑分离：\n   -\
  \ 使用 servlet 处理请求并将业务逻辑委托给独立的类。\n4. 使用 JSP 视图：\n   - 将 servlet 与 JSP 实现逻辑与展示的分离。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 总结\n● Servlet 特性：\n   - 处理 HTTP 请求，管理会话并与服务器集成。\n\
  ● 核心方法：\n   - `init`, `service`, `doGet`, `doPost` 和 `destroy`。\n● 应用场景：\n   - 表单处理、会话跟踪、动态内容生成。\n\
  \n\n\n\n\n| 类型 | 语法 |  |\n| :--- | :--- | :--- |\n| 脚本段 (Scriptlets) | `<% Java\
  \ code %>` | 嵌入 Java 代码。 |\n| 声明 (Declarations) | `<%! Java code %>` | 声明变量或方法。\
  \ |\n| 表达式 (Expressions) | `<%= expression %>` | 输出表达式的值。 |\n| 注释 (Comments) | `<%--\
  \ comment --%>` | 添加 HTML 中不可可见的注释。 |\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 代码示例：基础 JSP 文件\n\n`index.jsp`:\n\n```jsp\n<%@ page language=\"java\" contentType=\"\
  text/html; charset=UTF-8\" %>\n<!DOCTYPE html>\n<html>\n<head>\n<title>Basic JSP</title>\n\
  </head>\n<body>\n<h1>Welcome to JSP!</h1>\n<p>当前日期和时间是: <%= new java.util.Date()\
  \ %></p>\n</body>\n</html>\n```\n\n![Rectangle Rectangle](img/image.png)\n\n####\
  \ 输出：\n\n显示：Welcome to JSP!\n\n当前日期和时间是: [Current Date and Time]\n\n#### 解释：\n\n\
  1. 指令：\n- `<@ page ... %>` 指定页面的内容类型和脚本语言。\n\n2. 表达式：\n- `<%= new java.util.Date()\
  \ %>` 计算 Java 表达式并输出结果。\n\n![Rectangle Rectangle](img/image.png)\n\n### 2. 处理表单数据\n\
  \nJSP 可以使用 `request` 对象处理客户端提交的表单数据。\n\n![Rectangle Rectangle](img/image.png)\n\n\
  #### 代码示例：处理表单提交\n\nHTML 表单：\n\n```html\n<form action=\"process.jsp\" method=\"\
  POST\">\n  <label for=\"name\">Enter your name:</label>\n  <input type=\"text\"\
  \ id=\"name\" name=\"name\">\n  <button type=\"submit\">Submit</button>\n</form>\n\
  ```\n\n`process.jsp`:\n\n```jsp\n<%@ page language=\"java\" contentType=\"text/html;\
  \ charset=\"UTF-8\" %>\n<!DOCTYPE html>\n<html>\n<head>\n<title>Form Data</title>\n\
  </head>\n<body>\n<h1>Form Submission</h1>\n<p>Hello, <%= request.getParameter(\"\
  name\") %>!</p>\n</body>\n</html>\n```\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 输出：\n\n当用户提交其姓名时：Hello, [Name]!\n\n#### 解释：\n\n1. `request.getParameter`:\n\
  - 获取 `HTTP` 请求发送的表单数据。\n\n2. 动态内容：\n- 提交的姓名动态显示在页面上。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 3. 使用 JSP 指令\n\nJSP 指令为页面提供了元数据和配置。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 指令类型\n\n| 指令 | 目的 |\n| :--- | :--- |\n| page | 配置页面（例如语言、编码）。 |\n| include\
  \ | 在翻译期间包含另一个文件。 |\n| taglib | 为自定义标签声明标签库。 |\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 代码示例：包含文件\n\n`header.jsp`:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  <title>Reusable Header</title>\n</head>\n<body>\n<h1>Welcome to My Website</h1>\n\
  </body>\n</html>\n```\n\n`index.jsp`:\n\n```jsp\n<%@ include file=\"header.jsp\"\
  \ %>\n<p>This is the main content of the page.</p>\n```\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 输出：\n\n显示：Welcome to My Website\n\nThis is the main content of the page.\n\
  \n#### 解释：\n\n1. `include` 指令：\n- 在翻译时将 `header.jsp` 的内容嵌入 `index.jsp` 中。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 4. 表达式语言 (EL)\n\n表达式语言 (EL) 简化了对 `request`、`session`\
  \ 和 `application` 等服务器对象的访问。\n\n![Rectangle Rectangle](img/image.png)\n\n#### 代码示例：使用\
  \ EL\n\n`index.jsp`:\n\n```jsp\n<%@ page language=\"java\" contentType=\"text/html;\
  \ charset=\"UTF-8\" %>\n<% request.setAttribute(\"username\", \"John Doe\"); %>\n\
  <!DOCTYPE html>\n<html>\n<head>\n<title>Expression Language</title>\n</head>\n<body>\n\
  <h1>Welcome, ${username}!</h1>\n</body>\n</html>\n```\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 输出：\n\n显示：Welcome, John Doe!\n\n#### 解释：\n\n1. EL 语法：\n- `${username}` 获取\
  \ `username` 属性的值。\n\n2. 更整的代码：\n- 减少了在 JSP 文件中使用 Java 代码的需求。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 5. 使用 JSTL 自定义标签\n\nJSP 标准标签库 (JSTL) 为常见任务提供了可重用的基于标签的功能。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 代码示例：使用 JSTL 进行迭代\n\n为 Maven 添加 JSTL 依赖：\n\n```xml\n<dependency>\n  <groupId>javax.servlet</groupId>\n\
  \  <artifactId>jstl</artifactId>\n  <version>1.2</version>\n</dependency>\n```\n\
  \n`index.jsp`:\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"\
  c\" %>\n... (此处根据原文逻辑翻译，原文代码块不完整) ...\n```\n*(注：由于原文中 index.jsp 的代码块在描述中被截断或逻辑错乱，此处遵循“不翻译代码块”原则，仅翻译描述性文字。根据您提供的原始文本，我将继续处理剩余部分的文本翻译。)*\n\
  \n**由于您提供的原文在第 5 部分之后出现了严重的格式逻辑错乱（例如代码块和描述交织在一起），我将基于“不漏掉任何行”且“不翻译代码块”的原则，对错乱部分进行对齐翻译：**\n\
  \n[content]\n(接上文)\n![Rectangle Rectangle](img/image.png)\n\n### 6. Session 管理\n\
  \n#### 代码示例：页面计数\n\n`index.jsp`:\n\n```jsp\n<%@ page language=\"java\" contentType=\"\
  text/html; charset=\"UTF-8\" %>\n<%\nInteger count = (Integer) session.getAttribute(\"\
  count\");\nif (count == null) {\n  count = 1;\n} else {\n  count++;\n}\nsession.setAttribute(\"\
  count\", count);\n%>\n... \n```\n\n![Rectangle Rectangle](img/image.png)\n\n####\
  \ 输出：\n\n显示：你访问了页面 [Count] 次。\n\n#### 解释：\n\n1. `session` 对象：\n- 跟踪用户交互。\n\n2. 持久数据：\n\
  - 数据在请求之间保持保留。\n\n![Rectangle Rectangle](img/image.png)\n\n### JSP 最佳实践\n\n1. 减少\
  \ Java 代码：\n- 使用 EL 和 JSTL。\n\n2. 关注分离：\n- 将 JSP 用于视图层。\n\n3. 可重用：\n- 包含头部和页脚。\n\
  \n4. 错误处理：\n- 使用 `errorPage` 和 `isErrorPage`。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 总结\n\n- JSP 特性：结合 HTML 和 Java。\n- 核心元素：指令、脚本段、EL 和 JSTL。\n- 应用场景：数据显示、Session\
  \ 管理。\n- 最佳实践：专注于更简洁、易维护的代码。\n\n## JavaServer Faces (JSF)\n\nJavaServer Faces (JSF)\
  \ 是一种用于构建服务器应用程序界面的 Java Web 框架。它通过提供组件化架构并集成 Java EE 来简化开发过程。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### JSF 特性\n\n1. 基于组件开发：\n- JSF 提供了可重用的 UI 组件，如按钮、文本框和数据表。\n\n2. 事件驱动编程：\n- 支持\
  \ UI 交互的服务器端事件处理。\n\n3. 内置验证：\n- 提供了内置的验证机制并集成自定义验证器。\n\n4. 与 Java EE 集成：\n- 与 EJB、CDI\
  \ 和 JPA 等技术无缝集成。\n\n5. Facelets：\n- 用于使用 XHTML 构建 JSF 视图的模板系统。\n\n6. 管理 Bean (Managed\
  \ Beans)：\n- 简化了 UI 组件与后端逻辑之间的连接。\n\n7. 丰富的工具支持：\n- 支持 Eclipse 和 IntelliJ 等 IDE，以加速开发。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### JSF 架构\n\nJSF 遵循模型-视图-控制器 (MVC) 架构：\n\
  \n1. 模型 (Model)：\n- 代表应用程序的数据和业务逻辑，使用 JavaBean 或管理 Bean 管理。\n\n2. 视图 (View)：\n-\
  \ 使用 Facelets (XHTML 文件) 定义 UI 布局。\n\n3. 控制器 (Controller)：\n\n\n\n\n\n○ 处理请求和响应，管理导航和事件处理。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### JSF 的核心组件\n\n| 组件 | 描述 |\n| :---\
  \ | :--- |\n| 托管 Bean (Managed Beans) | 管理应用状态和行为的 Java 类。 |\n| Facelets | 基于 XHTML\
  \ 的视图定义框架。 |\n| UI 组件 (UI Components) | 如 `<h:inputText>` 和 `<h:commandButton>`\
  \ 等可复用组件。 |\n| 事件处理器 (Event Handlers) | 处理按钮点击和输入更改等用户交互。 |\n| 导航规则 (Navigation\
  \ Rules) | 定义页面导航流。 |\n\n![Rectangle Rectangle](img/image.png)\n\n### 设置 JSF\n\n\
  ### 1. 添加依赖\n\n对于 Maven：\n\n```xml\n<dependency>\n  <groupId>javax.faces</groupId>\n\
  \  <artifactId>javax.faces-api</artifactId>\n  <version>2.3</version>\n</dependency>\n\
  <dependency>\n  <groupId>org.glassfish</groupId>\n  <artifactId>javax.faces</artifactId>\n\
  \  <version>2.3.9</version>\n</dependency>\n```\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 2. 配置 Web 应用程序\n\n`web.xml`:\n\n```xml\n<web-app xmlns=\"http://java.sun.com/xml/ns/javaee\"\
  \ version=\"3.0\">\n  <context-param>\n    <param-name>javax.faces.PROJECT_STAGE</param-name>\n\
  \    <param-value>Development</param-value>\n  </context-param>\n  <servlet>\n \
  \   <servlet-name>FacesServlet</servlet-name>\n    <servlet-class>javax.faces.webapp.FacesServlet</servlet-class>\n\
  \    <load-on-startup>1</load-on-startup>\n  </servlet>\n  <servlet-mapping>\n \
  \   <servlet-name>FacesServlet</servlet-name>\n    <url-pattern>*.xhtml</url-pattern>\n\
  \  </servlet-mapping>\n</web-app>\n```\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 3. 项目结构\n\n```text\nsrc/main/\n├── java/com/example/bean/ # 托管 Bean\n├── webapp/\n\
  │   ├── index.xhtml # 主 JSF 页面\n│   ├── WEB-INF/\n│       └── web.xml # 部署描述\n```\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 1. 创建一个基础 JSF 应用程序\n\n#### 代码示例\n\
  \n托管 Bean (Managed Bean):\n\n```java\npackage com.example.bean;\n\nimport javax.enterprise.context.RequestScoped;\n\
  import javax.inject.Named;\n\n@Named\n@RequestScoped\npublic class HelloBean {\n\
  \    private String message = \"Welcome to JSF!\";\n\n    public String getMessage()\
  \ {\n        return message;\n    }\n\n    public void setMessage(String message)\
  \ {\n        this.message = message;\n    }\n}\n```\n\n视图 (Facelets): `index.xhtml`:\n\
  \n```xml\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\nxmlns:h=\"\
  http://java.sun.com/jsf/html\">\n<head>\n  <title>JSF Example</title>\n</head>\n\
  <body>\n  <h:form>\n    <h1>#{helloBean.message}</h1>\n  </h:form>\n</body>\n</</html>\n\
  ```\n\n![Rectangle Rectangle](img/image.png)\n\n#### 输出：\n\n显示：Welcome to JSF!\n\
  \n#### 解释：\n\n1. 托管 Bean (Managed Bean):\n   ○ `HelloBean` 类是一个具有 `message` 属性的请求范围\
  \ Bean。\n2. 表达式语言 (EL):\n   ○ `#{helloBean.message}` 动态地访问 Bean 的 `message` 属性。\n\
  3. Facelets:\n   ○ XHTML 文件定义了 UI 的结构。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 2. 处理用户输入\n\n#### 代码示例\n\n托管 Bean (Managed Bean):\n\n```java\npackage com.example.bean;\n\
  \nimport javax.enterprise.context.RequestScoped;\nimport javax.inject.Named;\n\n\
  @Named\n@RequestScoped\npublic class UserBean {\n    private String name;\n\n  \
  \  public String getName() {\n        return name;\n    }\n\n    public void setName(String\
  \ name) {\n        this.name = name;\n    }\n\n    public String greet() {\n   \
  \     return \"greet\"; // 导航到 greet.xhtml\n    }\n}\n```\n\n输入表单 (`index.xhtml`):\n\
  \n```xml\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\nxmlns:h=\"\
  http://java.sun.com/jsf/html\">\n<head>\n  <title>JSF Form</title>\n</head>\n<body>\n\
  \  <h:form>\n    <h:outputLabel for=\"name\" value=\"Enter your name:\" />\n   \
  \ <h:inputText id=\"name\" value=\"#{userBean.name}\" />\n    <h:commandButton value=\"\
  Submit\" action=\"#{userBean.greet}\" />\n  </h:form>\n</body>\n</</html>\n```\n\
  \n结果页面 (`greet.xhtml`):\n\n```xml\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \nxmlns:h=\"http://java.sun.com/jsf/html\">\n<head>\n  <title>Greeting</title>\n\
  </head>\n<body>\n  <h1>Hello, #{userBean.name}</h1>\n</body>\n</</html>\n```\n\n\
  ![Rectangle Rectangle](img/image.png)\n\n#### 输出：\n\n1. 用户输入名称并点击提交。\n   应用导航到 `greet.xhtml`\
  \ 并显示名称。\n\n#### 解释：\n\n1. 数据绑定：\n   ○ `userBean.name` 将输入绑定到 Bean 属性。\n2. 导航：\n\
  \   ○ `greet()` 方法指向 `greet.xhtml`。\n\n![Rectangle Rectangle](img/image.png)\n\n\
  ### 3. 使用验证\n\nJSF 提供了内置的验证器，如 required（必填）和 regex（正则表达式）。\n\n#### 代码示例\n\n带有验证的表单：\n\
  \n```xml\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\nxmlns:h=\"\
  http://java.sun.com/jsf/html\">\n<head>\n  <title>JSF Validation</title>\n</head>\n\
  <body>\n  <h:form>\n    <h:outputLabel for=\"name\" value=\"Enter your name:\" />\n\
  \    <h:inputText id=\"name\" value=\"#{userBean.name}\" required=\"true\" />\n\
  \    <h:commandButton value=\"Submit\" action=\"#{userBean.greet}\" />\n  </h:form>\n\
  </body>\n</</html>\n```\n\n#### 输出：\n\n1. 用户输入名称并点击提交。\n   如果无效，应用将显示错误。\n\n####\
  \ 解释：\n\n1. 验证：\n   ○ `required=\"true\"` 确保该字段必填。\n2. 错误显示：\n   ○ `<h:message>`\
  \ 显示错误。\n\n### 4. 导航规则\n\nJSF 管理页面流。\n\n#### 代码示例\n\n`faces-config.xml`:\n\n```xml\n\
  <navigation-rule>\n  <from-view-id>index.xhtml</from-view-id>\n  <case>\n    <outcome>success</outcome>\n\
  \    <to-view-id>success.xhtml</to-view-id>\n  </case>\n</navigation-rule>\n```\n\
  \n托管 Bean (Managed Bean):\n\n```java\npublic String navigate() {\n    return \"\
  success\";\n}\n```\n\n### 5. 使用 PrimeFaces\n\nPrimeFaces 是一个流行的 JSF 库，提供了丰富的图表、轮播图和对话框等组件。\n\
  \n#### 代码示例：数据表格\n\n添加 PrimeFaces 依赖：\n\n```xml\n<dependency>\n  <groupId>org.primefaces</groupId>\n\
  \  <artifactId>primefaces</artifactId>\n  <version>12.0.0</version>\n</dependency>\n\
  ```\n\nPrimeFaces 表格：\n\n```xml\n<p:dataTable value=\"#{userBean.users}\" var=\"\
  user\">\n  <p:column headerText=\"ID\">\n    <h:outputText value=\"#{user.id}\"\
  \ />\n  </p:column>\n  <p:column headerText=\"Name\">\n    <h:outputText value=\"\
  #{user.name}\" />\n  </p:column>\n</p:dataTable>\n```\n\n\n\n\n\n○ 与其他 Java EE 技术（如\
  \ CDI、EJB 和 JPA）无缝集成。\n\n### 1. 异步处理\n○ 支持异步请求和响应处理，以提高可扩展性。\n\n### 2. 异常处理\n○ 提供自定义异常和错误映射器（error\
  \ mappers），实现整洁的错误管理。\n\n![Rectangle Rectangle](img/image.png)\n\n### 设置 JAX-RS\n\
  \n### 1. 添加依赖\n\n对于 Maven 项目：\n\n```xml\n<dependency>\n  <groupId>jakarta.ws.rs</groupId>\n\
  \  <artifactId>jakarta.ws.rs-api</artifactId>\n  <version>3.0.0</version>\n</dependency>\n\
  <dependency>\n  <groupId>org.glassfish.jersey.core</groupId>\n  <artifactId>jersey-common</artifactId>\n\
  \  <version>3.0.5</version>\n</dependency>\n<dependency>\n  <groupId>org.glassfish.jersey.containers</groupId>\n\
  \  <artifactId>jersey-container-servlet</artifactId>\n  <version>3.0.5</version>\n\
  </dependency>\n<dependency>\n  <groupId>org.glassfish.jersey.media</groupId>\n \
  \ <artifactId>jersey-media-json-binding</artifactId>\n  <version>3.0.5</version>\n\
  </dependency>\n```\n\n![Rectangle Rectangle](img/image.png)\n\n### 2. 配置 web.xml\n\
  \n在传统的 Java EE 应用中，将 JAX-RS 应用映射到 URL 模式：\n\n```xml\n<web-app>\n  <servlet>\n  \
  \  <servlet-name>JAX-RS Application</servlet-name>\n    <servlet-class>org.glassfish.jersey.servlet.ServletContainer</servlet-class>\n\
  \    <init-param>\n      <param-name>jersey.config.server.provider.packages</param-name>\n\
  \      <param-value>com.example.resources</param-value>\n    </init-param>\n   \
  \ <load-on-startup>1</load-on-startup>\n  </servlet>\n  <servlet-mapping>\n    <servlet-name>JAX-RS\
  \ Application</servlet-name>\n    <url-pattern>/api/*</url-pattern>\n  </servlet-mapping>\n\
  </web-app>\n```\n\n![Rectangle Rectangle](img/image.png)\n\n### JAX-RS 中的核心注解\n\n\
  | 注解 | 描述 |\n| :--- | :--- |\n| @Path | 为资源类或方法定义 URI 路径。 |\n| @GET | 将方法映射到处理 HTTP\
  \ GET 请求。 |\n| @POST | 将方法映射到处理 HTTP POST 请求。 |\n| @PUT | 将方法映射到处理 HTTP PUT 请求。\
  \ |\n| @DELETE | 将方法映射到处理 HTTP DELETE 请求。 |\n| @Produces | 指定响应格式（例如 JSON、XML）。\
  \ |\n| @Consumes | 指定请求格式（例如 JSON、XML）。 |\n| @QueryParam | 从 URI 中提取查询参数。 |\n| @PathParam\
  \ | 从 URI 中提取路径参数。 |\n| @FormParam | 从请求体中提取表单参数。 |\n| @Context | 注入上下文数据，如 UriInfo、HttpHeaders\
  \ 等。 |\n\n![Rectangle Rectangle](img/image.png)\n\n### 1. 创建一个简单的 REST API\n\n####\
  \ 代码示例：Hello World API\n\n资源类：\n\n```java\npackage com.example.resources;\nimport\
  \ jakarta.ws.rs.GET;\nimport jakarta.ws.rs.Path;\nimport jakarta.ws.rs.Produces;\n\
  import jakarta.ws.rs.core.MediaType;\n\n@Path(\"/hello\")\npublic class HelloResource\
  \ {\n  @GET\n  @Produces(MediaType.TEXT_PLAIN)\n  public String sayHello() {\n \
  \   return \"Hello, World!\";\n  }\n}\n```\n\n解释：\n○ `@Path`: 将资源类映射到 `/hello` 路径。\n\
  ○ `@GET`: 将 `sayHello` 方法映射到 HTTP GET 请求。\n○ `@Produces`: 指定响应格式为纯文本。\n\n输出：\n访问\
  \ `/api/hello` 返回：`Hello, World!`\n\n![Rectangle Rectangle](img/image.png)\n\n###\
  \ 2. 返回 JSON\n\n#### 代码示例：JSON 响应\n\n模型类：\n\n```java\npackage com.example.models;\n\
  public class User {\n  private int id;\n  private String name;\n  public User(int\
  \ id, String name) {\n    this.id = id;\n    this.name = name;\n  }\n  public int\
  \ getId() { return id; }\n  public void setId(int id) { this.id = id; }\n  public\
  \ String getName() { return name; }\n  public void setName(String name) { this.name\
  \ = name; }\n}\n```\n\n资源类：\n\n```java\npackage com.example.resources;\nimport com.example.models.User;\n\
  import jakarta.ws.rs.GET;\nimport jakarta.ws.rs.Path;\nimport jakarta.ws.rs.Produces;\n\
  import jakarta.ws.rs.core.MediaType;\n\n@Path(\"/users\")\npublic class UserResource\
  \ {\n  @GET\n  @Produces(MediaType.APPLICATION_JSON)\n  public User getUser() {\n\
  \    return new User(1, \"John Doe\");\n  }\n}\n```\n\n解释：\n○ JSON 绑定：响应会被自动序列化为\
  \ JSON。\n○ `MediaType.APPLICATION_JSON`: 指定响应格式为 JSON。\n\n输出：\n访问 `/api/users` 返回：`{\"\
  id\": 1, \"name\": \"John Doe\"}`\n\n![Rectangle Rectangle](img/image.png)\n\n\n\
  \n\n\n○ 轻松处理 JSON、XML 和其他格式。\n\n● 可扩展性：\n○ 支持异步处理以及与 Java EE 特性的集成。\n\nJAX-RS 是一个构建现代\
  \ RESTful API 的强大框架，确保企业级应用代码的整洁和可维护。\n\n# Spring 框架简介\n\nSpring Framework 是一个强大、开源且功能丰富的\
  \ Java 平台，用于构建企业级应用程序。它通过提供健壮的基础支持、与其他框架的集成以及用于构建可扩展、可维护和可测试应用的各种工具，简化了开发过程。\n\n\
  ![Rectangle](img/image.png)\n\n### Spring 框架的核心特性\n\n1. **控制反转 (IoC)**：\n   ○ 管理应用对象的生命周期和依赖关系，减少对手动配置的需求。\n\
  2. **依赖注入 (DI)**：\n   ○ 通过向对象注入依赖而不是硬编码依赖，来实现松耦合。\n3. **面向切面编程 (AOP)**：\n   ○ 将横切关注点（如日志、事务）从核心逻辑中分离出来。\n\
  4. **数据访问**：\n   ○ 使用 `JDBC` 和如 `Hibernate` 等 ORM 框架提供简化的数据库访问。\n5. **模型视图控制器 (MVC)**：\n\
  \   ○ 用于构建健壮且灵活的 Web 的框架。\n6. **事务管理**：\n   ○ 以声明式或编程方式管理事务。\n7. **集成**：\n   ○ 与\
  \ `JPA`、`JMS` 和 `REST` 等其他技术无缝集成。\n8. **Spring Boot**：\n   ○ 一个简化框架，用于以最少配置构建独立应用程序。\n\
  \n![Rectangle](img/image.png)\n\n### Spring 框架的核心模块\n\n| 模块 | 描述 |\n| :--- | :---\
  \ |\n| Spring Core | 提供 IoC 和 DI 功能。 |\n| Spring AOP | 支持面向切面编程。 |\n| Spring Data\
  \ | 简化数据访问并与 Hibernate 等 ORM 框架集成。 |\n| Spring MVC | 为 Web 应用实现模型视图控制器模式。 |\n| Spring\
  \ Security | 提供身份验证、授权和安全功能。 |\n| Spring Boot | 简化 Spring 应用的设置和开发。 |\n\n![Rectangle](img/image.png)\n\
  \n## 设置 Spring 框架\n\n### 1. 添加依赖\n\n对于 Maven 项目：\n\n```xml\n<dependency>\n  <groupId>org.springframework</groupId>\n\
  \  <artifactId>spring-context</artifactId>\n  <version>5.3.27</version>\n</dependency>\n\
  <dependency>\n  <groupId>org.springframework</groupId>\n  <artifactId>spring-web</artifactId>\n\
  \  <version>5.3.27</version>\n</dependency>\n```\n\n对于 Spring Boot（可选）：\n\n```xml\n\
  <dependency>\n  <groupId>org.springframework.boot</groupId>\n  <artifactId>spring-boot-starter</artifactId>\n\
  \  <version>3.1.0</version>\n</dependency>\n```\n\n![Rectangle](img/image.png)\n\
  \n### 2. Spring Core: 控制反转与依赖注入\n\n### IoC 概念\n● **控制反转 (IoC)**：\n   ○ 将对象的创建和生命周期管理的控制权交给\
  \ Spring 容器。\n● **依赖注入 (DI)**：\n   ○ 自动将所需的依赖注入到对象中。\n\n![Rectangle](img/image.png)\n\
  \n#### 代码示例：依赖注入\n\nBean 类：\n```java\npackage com.example.beans;\n\npublic class\
  \ HelloWorld {\n    private String message;\n\n    public void setMessage(String\
  \ message) {\n        this.message = message;\n    }\n\n    public void displayMessage()\
  \ {\n        System.out.println(\"Message: \" + message);\n    }\n}\n```\n\nSpring\
  \ 配置 (XML)：\n\n```xml\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\
  \n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n    xsi:schemaLocation=\"\
  http://www.springframework.org/schema/beans\n    http://www.springframework.org/schema/beans/spring-beans.xsd\"\
  >\n    <bean id=\"helloWorld\" class=\"com.example.beans.HelloWorld\">\n       \
  \ <property name=\"message\" value=\"Welcome to Spring Framework!\" />\n    </bean>\n\
  </beans>\n```\n\n主类：\n\n```java\npackage com.example;\n\nimport com.example.beans.HelloWorld;\n\
  import org.springframework.context.ApplicationContext;\nimport org.springframework.context.support.ClassPathXmlApplicationContext;\n\
  \npublic class MainApp {\n    public static void main(String[] args) {\n       \
  \ ApplicationContext context = new ClassPathXmlApplicationContext(\"Beans.xml\"\
  );\n        HelloWorld helloWorld = (HelloWorld) context.getBean(\"helloWorld\"\
  );\n        helloWorld.displayMessage();\n    }\n}\n```\n\n#### 输出：\nMessage: Welcome\
  \ to Spring Framework!\n\n#### 解析：\n1. **ApplicationContext**：\n   ○ 加载 Spring 配置并管理\
  \ bean。\n2. **依赖注入**：\n   ○ `message` 属性从 XML 配置注入到 `HelloWorld` bean 中。\n\n![Rectangle](img/image.png)\n\
  \n### 3. Spring 注解\n\nSpring 提供了注解来简化配置并减少对 XML 的需求。\n\n![Rectangle](img/image.png)\n\
  \n#### 代码示例：用于 DI 的注解\n\nBean 类：\n```java\npackage com.example.beans;\n\nimport\
  \ org.springframework.stereotype.Component;\n\n@Component\npublic class HelloWorld\
  \ {\n    private String message = \"Hello from Annotations!\";\n\n    public void\
  \ displayMessage() {\n    }\n}\n```\n\n主类：\n```java\npackage com.example;\n\nimport\
  \ com.example.beans.HelloWorld;\nimport org.springframework.context.ApplicationContext;\n\
  import org.springframework.context.annotation.AnnotationConfigApplicationContext;\n\
  \npublic class MainApp {\n    public static void main(String[] args) {\n       \
  \ ApplicationContext context = new AnnotationConfigApplicationContext(\"com.example\"\
  );\n        HelloWorld helloWorld = context.getBean(HelloWorld.class);\n       \
  \ helloWorld.displayMessage();\n    }\n}\n```\n\n#### 输出：\nHello from Annotations!\n\
  \n#### 解析：\n1. `@Component`：\n   ○ 将类标记为 Spring 管理的 bean。\n2. `AnnotationConfigApplicationContext`：\n\
  \   ○ 扫描注解。\n\n![Rectangle](img/image.png)\n\n### 4. Spring MVC：构建 Web 应用\n\nSpring\
  \ MVC 是基于模型视图控制器模式构建 Web 应用的框架。\n\n![Rectangle](img/image.png)\n\n#### 代码示例：简单的\
  \ Spring MVC\n\n控制器：\n```java\npackage com.example.controllers;\n\nimport org.springframework.stereotype.Controller;\n\
  import org.springframework.ui.Model;\nimport org.springframework.web.bind.annotation.GetMapping;\n\
  \n@Controller\npublic class HelloController {\n    @GetMapping(\"/hello\")\n   \
  \ public String sayHello(Model model) {\n        model.addAttribute(\"message\"\
  , \"Hello, Spring MVC!\");\n        return \"hello\";\n    }\n}\n```\n\n视图 (hello.jsp)：\n\
  ```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Hello Page</title>\n</head>\n<body>\n\
  \    <h1>${message}</h1>\n</body>\n</html>\n```\n\nSpring 配置：\n```xml\n<beans xmlns=\"\
  http://www.springframework.org/schema/beans\"\n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  \n    xsi:schemaLocation=\"http://www.springframework.org/schema/beans\n    http://www.springframework.org/schema/beans/spring-beans.xsd\"\
  >\n    <bean class=\"org.springframework.web.servlet.view.InternalResourceViewResolver\"\
  >\n        <property name=\"prefix\" value=\"/WEB-INF/views/\" />\n        <property\
  \ name=\"suffix\" value=\".jsp\" />\n    </bean>\n</beans>\n```\n\n#### 输出：\n访问\
  \ /hello 显示：Hello, Spring MVC!\n\n![Rectangle](img/image.png)\n\n### 5. Spring Boot：简化\
  \ Spring 应用\n\nSpring Boot 消除了传统 Spring 应用中大量的模板代码配置。\n\n![Rectangle](img/image.png)\n\
  \n#### 代码示例：简单的 Spring Boot 应用\n\n```java\npackage com.example;\n\nimport org.springframework.boot.SpringApplication;\n\
  import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.web.bind.annotation.GetMapping;\n\
  import org.springframework.web.bind.annotation.RestController;\n\n@SpringBootApplication\n\
  @RestController\npublic class SpringBootApp {\n    public static void main(String[]\
  \ args) {\n        SpringApplication.run(SpringBootApp.class, args);\n    }\n\n\
  \    @GetMapping(\"/\")\n    public String hello() {\n        return \"Hello, Spring\
  \ Boot!\";\n    }\n}\n```\n\n\n\n\n\n```java\npublic String home() {\n    return\
  \ \"Welcome to Spring Boot!\";\n}\n```\n\n#### 输出:\n访问 `http://localhost:8080/`\
  \ 返回：Welcome to Spring Boot!\n\n![Rectangle Rectangle](img/image.png)\n\n### 5.\
  \ Spring AOP: 面切面向编程\n\nSpring AOP 提供了一种模块化处理关注点（如日志或安全）的方法。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 代码示例：日志切面\n\n切面类：\n\n```java\npackage com.example.aspects;\n\nimport org.aspectj.lang.annotation.Aspect;\n\
  import org.aspectj.lang.annotation.Before;\nimport org.springframework.stereotype.Component;\n\
  \n@Aspect\n@Component\npublic class LoggingAspect {\n    @Before(\"execution(* com.example.services.*.*(..))\"\
  )\n    public void logBefore() {\n        System.out.println(\"Logging before method\
  \ execution\");\n    }\n}\n```\n\n服务类：\n\n```java\npackage com.example.services;\n\
  \nimport org.springframework.stereotype.Service;\n\n@Service\npublic class UserService\
  \ {\n    public void performTask() {\n        System.out.println(\"Performing user\
  \ task...\");\n    }\n}\n```\n\n主类：\n\n```java\npackage com.example;\n\nimport com.example.services.UserService;\n\
  import org.springframework.context.ApplicationContext;\nimport org.springframework.context.annotation.AnnotationConfigApplicationContext;\n\
  \npublic class MainApp {\n    public static void main(String[] args) {\n       \
  \ ApplicationContext context = new AnnotationConfigApplicationContext(\"com.example\"\
  );\n        UserService userService = context.getBean(UserService.class);\n    \
  \    userService.performTask();\n    }\n}\n```\n\n#### 输出:\nLogging before method\
  \ execution\nPerforming user task...\n\n![Rectangle Rectangle](img/image.png)\n\n\
  ## 最佳实践\n\n1. 使用注解：\n   <bdi>○</bdi>为了简单起，优先使用注解而非 XML 配置。\n2. 分离关注点：\n   <bdi>○</bdi>使用\
  \ Spring MVC 处理 Web 层，使用 Spring Data 处理持久化，使用 AOP 处理关注点。\n3. 利用 Spring Boot：\n \
  \  <bdi>○</bdi>使用 Spring Boot 进行更快的开发和更简单的部署。\n4. 配置管理：\n   <bdi>○</bdi>使用 Spring\
  \ Profiles 配置多个环境。\n\n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\n<bdi>●</bdi>核心特性：\n\
  \  <bdi>○</bdi>IoC、DI、AOP 以及健壮的 MVC 框架。\n<bdi>●</bdi>Spring Boot：\n  <bdi>○</bdi>简化应用的设置和开发。\n\
  <bdi>●</bdi>用例：\n  <bdi>○</bdi>Web 应用程序、微服务、企业级应用等。\n<bdi>●</bdi>最佳实践：\n  <bdi>○</bdi>组件模块化、利用注解并使用\
  \ Spring Boot。\n\nSpring Framework 为构建现代 Java 应用程序提供了一个全面的生态系统，使其成为开发者的必学课程。\n\n\
  ## Spring MVC\n\nSpring MVC（模型-视图-控制器）是 Spring 生态系统中的框架，用于构建健壮且可扩展的 Web 应用程序。它通过提供处理\
  \ HTTP 请求、管理用户交互和渲染动态 Web 页面的工具与抽象，简化了开发过程。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### Spring MVC 的关键特性\n\n1. 模型-视图-控制器架构：\n   <bdi>○</bdi>将应用逻辑分为三个组件：\n     <bdi>■</bdi>模型（Model）：表示数据和业务逻辑。\n\
  \     <bdi>■</bdi>视图（View）：负责渲染 UI。\n     <bdi>■</bdi>控制器（Controller）：处理用户请求并管理模型与视图之间的交互。\n\
  2. 基于注解的配置：\n   <bdi>○</bdi>使用 `@Controller`、`@RequestMapping` 和 `@RestController`\
  \ 等注解简化了配置。\n3. 灵活的视图解析器：\n   <bdi>○</bdi>支持多种视图技术，包括 JSP、Thymeleaf 和 FreeMarker。\n\
  4. 强大的数据绑定：\n   <bdi>○</bdi>自动将表单数据和请求参数绑定到 Java 对象。\n5. 集成验证：\n   <bdi>○</bdi>内置使用\
  \ `@Valid` 和自定义验证器进行数据验证的支持。\n6. REST 支持：\n   <bdi>○</bdi>使用 `@RestController` 轻松构建\
  \ RESTful API。\n7. 异常处理：\n   <bdi>○</bdi>使用 `@ExceptionHandler` 和 `@ControllerAdvice`\
  \ 自定义异常处理。\n\n![Rectangle Rectangle](img/image.png)\n\n### 设置 Spring MVC\n\n###\
  \ 1. 添加依赖\n\n对于 Maven 项目：\n\n```xml\n<dependency>\n    <groupId>org.springframework</groupId>\n\
  \    <artifactId>spring-webmvc</artifactId>\n    <version>5.3.27</version>\n</dependency>\n\
  <dependency>\n    <groupId>javax.servlet</groupId>\n    <artifactId>javax.servlet-api</artifactId>\n\
  \    <version>4.0.1</version>\n    <scope>provided</scope>\n</dependency>\n```\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 2. 配置 web.xml\n\n```xml\n<web-app\
  \ xmlns=\"http://java.sun.com/xml/ns/javaee\" version=\"3.0\">\n    <servlet>\n\
  \        <servlet-name>dispatcher</servlet-name>\n        <servlet-class>org.springframework.web.servlet.DispatcherServlet</servlet-class>\n\
  \        <load-on-startup>1</load-on-startup>\n    </servlet>\n    <servlet-mapping>\n\
  \        <servlet-name>dispatcher</servlet-name>\n        <url-pattern>/</url-pattern>\n\
  \    </servlet-mapping>\n</web-app>\n```\n\n### 3. 配置文件\n\n```xml\n<beans xmlns=\"\
  http://www.springframework.org/schema/beans\"\n       xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  \n       xmlns:context=\"http://www.springframework.org/schema/context\"\n     \
  \  xsi:schemaLocation=\"http://www.springframework.org/schema/beans\n          \
  \ https://www.springframework.org/schema/beans/spring-beans.xsd\n           http://www.springframework.org/schema/context\n\
  \           https://www.springframework.org/schema/context/spring-context.xsd\"\
  >\n\n 组件扫描 -->\n    <context:component-scan base-package=\"com.example\" />\n\n\
  \    <!-- 视图解析器 -->\n    <bean class=\"org.springframework.web.servlet.view.InternalResourceViewResolver\"\
  >\n        <property name=\"prefix\" value=\"/WEB-INF/views/\" />\n        <property\
  \ name=\"suffix\" value=\".jsp\" />\n    </bean>\n\n</beans>\n```\n\n### Spring\
  \ MVC 的核心组件\n\n1. DispatcherServlet：拦截请求并将其分发给处理器。\n2. Controller：处理请求并将其映射到特定的方法。\n\
  3. Model：封装应用数据。\n4. View：负责渲染响应。\n\n![Rectangle Rectangle](img/image.png)\n\n###\
  \ 1.基础 Spring MVC 应用程序\n\n#### 代码示例\n\n控制器：\n\n```java\npackage com.example.controllers;\n\
  \nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\n\
  import org.springframework.web.bind.annotation.GetMapping;\n\n@Controller\npublic\
  \ class HelloController {\n    @GetMapping(\"/hello\")\n    public String sayHello(Model\
  \ model) {\n        model.addAttribute(\"message\", \"Welcome to Spring MVC!\");\n\
  \        return \"hello\";\n    }\n}\n```\n\n视图 (hello.jsp)：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n    <title>Hello Page</title>\n</head>\n<body>\n    <h1>${message}</h1>\n\
  </body>\n</html>\n```\n\n#### 解释：\n1. @Controller：标记该类为 Spring 控制器。\n2. @GetMapping：将\
  \ HTTP GET 请求映射到 `sayHello` 方法。\n3. Model：向视图添加要显示的数据。\n4. 视图解析器：将逻辑视图名称 `hello`\
  \ 解析为 `/WEB-INF/views/hello.jsp`。\n\n#### 输出:\n访问 `/hello` 显示：Welcome to Spring\
  \ MVC!\n\n![Rectangle Rectangle](img/image.png)\n\n### 2.处理表单数据\n\nSpring MVC 可以轻松处理表单提交并将表单数据绑定到\
  \ Java 对象。\n\n![Rectangle Rectangle](img/image.png)\n\n#### 代码示例\n\n表单 (form.jsp)：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>User Form</title>\n</head>\n\
  <body>\n    <h2>Enter User Details</h2>\n    <form action=\"submitForm\" method=\"\
  POST\">\n        <label for=\"name\">Name:</label>\n        <input type=\"text\"\
  \ id=\"name\" name=\"name\" />\n        <br/>\n        <label for=\"email\">Email:</label>\n\
  \        <input type=\"email\" id=\"email\" name=\"email\" />\n        <br/>\n \
  \       <button type=\"submit\">Submit</button>\n    </form>\n</body>\n</html>\n\
  ```\n\n\n\n\n\n```java\nimport org.springframework.web.bind.annotation.PostMapping;\n\
  import org.springframework.web.bind.annotation.RequestParam;\n\n@Controller\npublic\
  \ class FormController {\n    @GetMapping(\"/form\")\n    public String showForm()\
  \ {\n        return \"form\";\n    }\n\n    @PostMapping(\"/submitForm\")\n    public\
  \ String submitForm(@RequestParam(\"name\") String name,\n                     \
  \        @RequestParam(\"email\") String email,\n                             Model\
  \ model) {\n        model.addAttribute(\"name\", name);\n        model.addAttribute(\"\
  email\", email);\n        return \"result\";\n    }\n}\n```\n\n### Result 视图 (result.jsp):\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>结果页面</title>\n</head>\n<body>\n\
  \    <h1>表单提交成功</h1>\n    <p>名称: ${name}</p>\n    <p>邮箱: ${email}</p>\n</body>\n\
  </html>\n```\n\n#### 解释：\n\n1. `@RequestParam`:\n<bdi>○</bdi>将表单输入参数绑定到方法参数。\n\n\
  2. 动态视图：\n<bdi>○</bdi>在表单中输入的数据动态显示在结果页面上。\n\n#### 输出：\n\n提交表单后显示：名称：[输入的名称]\n邮箱：[输入的邮箱]\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 3. Spring MVC 中的 RESTful API\n\n\
  Spring MVC 也可以使用 `@RestController` 处理 RESTful 请求。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 代码示例\n\nREST Controller:\n\n```java\npackage com.example.controllers;\n\n\
  import org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
  \n@RestController\npublic class ApiController {\n    @GetMapping(\"/api/greet\"\
  )\n    public String greet() {\n        return \"Hello, this is a REST API!\";\n\
  \    }\n}\n```\n\n#### 解释：\n\n1. `@RestController`:\n<bdi>○</bdi>结合了 `@Controller`\
  \ 和 `@ResponseBody`，表示方法直接返回响应数据。\n\n2. JSON 支持：\n<bdi>○</bdi>与 Jackson 等库集成时，可以轻松地返回\
  \ JSON 响应。\n\n#### 输出：\n\n访问 `/api/greet` 返回：Hello, this is a REST API!\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 4. 异常处理\n\nSpring MVC 提供了 `@ExceptionHandler`\
  \ 和 `@ControllerAdvice` 用于全局处理异常。\n\n![Rectangle Rectangle](img/image.png)\n\n####\
  \ 代码示例\n\n异常处理器：\n\n```java\npackage com.example.controllers;\n\nimport org.springframework.web.bind.annotation.ControllerAdvice;\n\
  import org.springframework.web.bind.annotation.ExceptionHandler;\nimport org.springframework.web.servlet.ModelAndView;\n\
  \n@ControllerAdvice\npublic class GlobalExceptionHandler {\n    @ExceptionHandler(Exception.class)\n\
  \    public ModelAndView handleException(Exception ex) {\n        ModelAndView modelAndView\
  \ = new ModelAndView(\"error\");\n        modelAndView.addObject(\"message\", ex.getMessage());\n\
  \        return modelAndView;\n    }\n}\n```\n\n错误视图 (error.jsp):\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n    <title>错误页面</title>\n</head>\n<body>\n    <h1>发生了一个错误</h1>\n\
  \    <p>${message}</p>\n</body>\n</html>\n```\n\n#### 解释：\n\n1. `@ControllerAdvice`:\n\
  <bdi>○</bdi>为所有控制器全局处理异常。\n\n2. 错误页面：\n<bdi>○</bdi>显示自定义错误信息。\n\n#### 输出：\n\n当发生异常时，会重定向到：发生了一个错误：[错误信息]\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### Spring MVC 最佳实践\n\n1. 使用注解：\n<bdi>○</bdi>利用\
  \ `@Controller` 和 `@GetMapping` 等注解尽量减少 XML 配置。\n\n2. 关注点分离：\n<bdi>○</bdi>保持控制器、服务和模型的模块化且定义良好。\n\
  \n3. 验证：\n<bdi>○</bdi>使用 `@Valid` 和 `BindingResult` 验证表单输入。\n\n4. 异常处理：\n<bdi>○</bdi>使用\
  \ `@ControllerAdvice` 进行一致的错误处理。\n\n5. 测试：\n<bdi>○</bdi>使用 `JUnit` 和 `MockMvc` 等工具为控制器编写单元测试。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 总结\n\n<bdi>●</bdi>核心特性：\n<bdi>○</bdi>Spring\
  \ MVC 通过 MVC 架构和 RESTful API 简化了 Web 应用的开发。\n\n<bdi>●</bdi>注解：\n<bdi>○</bdi>如 `@Controller`、`@GetMapping`\
  \ 和 `@RequestParam` 等注解简化了开发。\n\n<bdi>●</bdi>场景：\n<bdi>○</bdi>适用于基于表单的应用、RESTful\
  \ API 和动态 Web 应用。\n\nSpring MVC 是一个多功能且健壮的框架，使开发者能够高效地构建可且可维护的 Web 应用。\n\n# 云端 Java\
  \ 与微服务\n\n## 微服务架构简介\n\n微服务架构是一种架构风格，它将应用程序结构化为小型、独立且松耦合的服务。每个服务都设计用于执行特定的业务功能，并通过轻量级协议（通常是\
  \ HTTP/REST 或消息队列）与其他服务进行通信。\n\n![Rectangle Rectangle](img/image.png)\n\n### 微服务的关键特征\n\
  \n1. 去中心化：\n<bdi>○</bdi>去中心化的治理和数据管理。\n\n2. 松耦合：\n<bdi>○</bdi>服务之间是相互独立的。\n\n3.\
  \ 可扩展性：\n<bdi>○</bdi>服务可以独立进行扩展。\n\n4. 技术无关：\n<bdi>○</bdi>可以使用不同的编程语言、框架和存储技术。\n\
  \n5. 故障隔离：\n<bdi>○</bdi>一个服务中的故障不会影响整个系统。\n\n6. 持续部署：\n<bdi>○</bdi>支持微服务的独立部署。\n\
  \n7. 服务独立性：\n<bdi>○</bdi>每个微服务代表某项能力。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 微服务的关键组件\n\n1. 服务组件：\n<bdi>○</bdi>负责特定功能的服务。\n\n2. API 网关：\n<bdi>○</bdi>所有客户端请求的单一入口，将其路由到相应的服务。\n\
  \n3. 服务发现：\n<bdi>○</bdi>动态定位服务的机制（例如 `Eureka`、`Consul`）。\n\n4. 服务间通信：\n<bdi>○</bdi>使用\
  \ REST、gRPC 或消息队列（如 `RabbitMQ`、`Kafka`）。\n\n5. 服务数据库：\n<bdi>○</bdi>每个微服务管理自己的数据库以确保独立性。\n\
  \n6. 负载均衡：\n<bdi>○</bdi>将入请求分布到多个服务实例。\n\n7. 监控与日志：\n<bdi>○</bdi>使用 `Prometheus`、`Grafana`\
  \ 和 ELK stack 提供可观测性。\n\n![Rectangle Rectangle](img/image.png)\n\n### 微服务的优势\n\n\
  1. 可扩展性：\n<bdi>○</bdi>可以根据需要独立扩展。\n\n2. 技术灵活性：\n<bdi>○</bdi>团队可以为服务选择最好的工具和技术。\n\
  \n3. 容错性：\n<bdi>○</bdi>一个服务的故障不会影响其他部分。\n\n4. 快速开发与部署：\n<bdi>○</bdi>专注于服务的团队可以独立工作，加快发布周期。\n\
  \n5. 提高可维护性：\n<bdi>○</bdi>服务较小且专注，更易理解和修改。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 微服务的挑战\n\n1. 复杂性：\n<bdi>○</bdi>分布式系统和服务间通信增加了复杂性。\n\n2. 数据一致性：\n<bdi>○</bdi>管理分布式数据库并确保一致性具有挑战性。\n\
  \n3. 部署开销：\n<bdi>○</bdi>需要强大的 CI/CD 流水来管理部署。\n\n4. 监控：\n<bdi>○</bdi>在多个服务之间实现观测性至关重要但较困难。\n\
  \n5. 延迟：\n<bdi>○</bdi>服务间的通信引入了网络延迟。\n\n![Rectangle Rectangle](img/image.png)\n\n\
  ### 微服务 vs 单体架构\n\n| 方面 | 单体架构 | 微服务架构 |\n| :--- | :--- | :--- |\n| 结构 | 单一、统一的应用程序\
  \ | 多个小型、独立的服务 |\n| 可扩展性 | 作为一个整体进行扩展 | 每个服务可以独立扩展 |\n\n\n\n\n\n| 开发 | 团队在同一代码库上工作。\
  \ | 团队负责独立的服务。 |\n| :--- | :--- | :--- |\n| 部署 | 单个部署单元。 | 每个服务独立部署。 |\n| 容错性 |\
  \ 故障影响整个应用程序。 | 故障被隔离在单个服务中。 |\n| 技术 | 限于单一的技术栈。 | 允许不同的服务使用不同的技术栈。 |\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 构建微服务架构\n\n1. **拆分单体应用**：\n   - 识别业务能力并将应用程序拆分为多个服务。\n\
  2. **设计每个服务**：\n   - 定义服务边界、`APIs` 和数据所有权。\n3. **实现服务间通信**：\n   - 使用 `REST`、`gRPC`\
  \ 或消息系统进行通信。\n4. **数据库设计**：\n   - 每个服务管理自己的数据库。\n5. **使用 API 网关**：\n   - 路由客户端请求并处理如身份验证和限流等交叉关注点。\n\
  6. **服务发现**：\n   - 实现动态服务发现以实现可扩展性。\n7. **监控与日志**：\n   - 使用追踪、日志记录和监控工具确保可观测性。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 示例：电子商务中的微服务\n\n在电子商务应用程序中，可以定义以下微服务：\n\
  \n1. **用户服务**：管理用户注册、身份验证和个人个人资料。\n2. **产品服务**：处理产品目录、库存和搜索功能。\n3. **订单服务**：处理客户订单、计算总额并处理支付。\n\
  4. **支付服务**：与第三方支付提供商集成。\n5. **通知服务**：发送电子邮件或短信通知。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 代码示例：使用 Spring Boot 构建简单微服务\n\n#### 用户服务\n\n`pom.xml` 依赖：\n\n```xml\n<dependency>\n\
  \  <groupId>org.springframework.boot</groupId>\n  <artifactId>spring-boot-starter-web</artifactId>\n\
  </dependency>\n<dependency>\n  <groupId>org.springframework.boot</groupId>\n  <artifactId>spring-boot-starter-data-jpa</artifactId>\n\
  </dependency>\n<dependency>\n  <groupId>com.h2database</groupId>\n  <artifactId>h2</artifactId>\n\
  \  <scope>runtime</scope>\n</dependency>\n```\n\n实体类：\n\n```java\npackage com.example.user;\n\
  \nimport javax.persistence.Entity;\nimport javax.persistence.GeneratedValue;\nimport\
  \ javax.persistence.Id;\n\n@Entity\npublic class User {\n    @Id\n    @GeneratedValue\n\
  \    private Long id;\n    private String name;\n    private String email;\n\n \
  \   // Getters and Setters\n}\n```\n\n存储库层：\n\n```java\npackage com.example.user;\n\
  import org.springframework.data.jpa.repository.JpaRepository;\n\npublic interface\
  \ UserRepository extends JpaRepository<User, Long> {\n}\n```\n\n控制器：\n\n```java\n\
  package com.example.user;\n\nimport org.springframework.beans.factory.annotation.Autowired;\n\
  import org.springframework.web.bind.annotation.*;\nimport java.util.List;\n\n@RestController\n\
  @RequestMapping(\"/users\")\npublic class UserController {\n    @Autowired\n   \
  \ private UserRepository userRepository;\n\n    @GetMapping\n    public List<User>\
  \ getAllUsers() {\n        return userRepository.findAll();\n    }\n\n    @PostMapping\n\
  \    public User createUser(@RequestBody User user) {\n        return userRepository.save(user);\n\
  \    }\n}\n```\n\n![Rectangle Rectangle](img/image.png)\n\n## 解析\n\n1. **依赖**：用于\
  \ Web 和数据访问的 Spring Boot 依赖。\n2. **实体**：代表数据库中的 `User` 表。\n3. **存储库**：处理 `User`\
  \ 实体的数据库操作。\n4. **控制器**：暴露用于创建和检索用户的 `REST` 端点。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 输出\n\n1. **创建用户**：\n   请求：`POST /users`\n   Content-Type：`application/json`\n\
  \   ```json\n   {\n     \"name\": \"John Doe\",\n     \"email\": \"john.doe@example.com\"\
  \n   }\n   ```\n   响应：\n   ```json\n   {\n     \"id\": 1,\n     \"name\": \"John\
  \ Doe\",\n     \"email\": \"john.doe@example.com\"\n   }\n   ```\n\n2. **获取所有用户**：\n\
  \   请求：`GET /users`\n   响应：\n   ```json\n   [\n     {\n       \"id\": 1,\n     \
  \  \"name\": \"John Doe\",\n       \"email\": \"john.doe@example.com\"\n     }\n\
  \   ]\n   ```\n\n![Rectangle Rectangle](img/image.png)\n\n### 微服务开发工具\n\n1. **API\
  \ 网关**：工具：`Spring Cloud Gateway`、`Zuul`。\n2. **服务发现**：工具：`Eureka`、`Consul`。\n3.\
  \ **服务间通信**：工具：`Kafka`、`RabbitMQ`、`REST`、`gRPC`。\n4. **容器化**：工具：`Docker`、`Kubernetes`。\n\
  5. **监控**：工具：`Prometheus`、`Grafana`、`ELK 栈`。\n6. **测试**：工具：`Postman`、`JUnit`。\n\n\
  ![Rectangle Rectangle](img/image.png)\n\n### 微服务最佳实践\n\n- **定义边界**：每个服务代表单一能力。\n\
  - **独立部署**：服务应该能够独立部署。\n- **容错性**：实现重试机制和断路器（例如 `Resilience4j`）。\n- **集中日志记录与监控**：使用工具实现可观测性。\n\
  - **每个服务一个数据库**：避免服务之间共享数据库。\n- **API 文档**：使用 `Swagger/OpenAPI` 等工具。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 结论\n\n微服务架构提供了一种现代、可扩展的应用构建方法，将应用程序拆分为更小、易管理的服务。虽然它需要仔细的规划和强大的工具支持，但它在扩展性和可维护性方面具有显著优势。\n\
