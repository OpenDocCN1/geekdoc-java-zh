  <bdi>○</bdi>运行时：\n\n# Java 开发工具\n\n## 调试\n\n调试是识别并修复问题的过程。在 Java 中，调试涉及代码。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 调试的关键工具\n\n1. 使用工具：\n集成开发环境（IDE）如 `Eclipse`、`IntelliJ\
  \ IDEA` 和 `NetBeans` 调试器。\n\n2. 使用日志：\n日志框架如 `SL4J`、`Log4j` 或 `java.util.logging`\
  \ 用于打印信息。\n\n3. 使用 System.out.println：\n通过打印到控制台来调试变量。\n\n4. 异常处理：\n分析堆栈跟踪以识别错误。\n\
  \n5. 分析转储：\n帮助诊断 JVM 中的问题。\n\n6. 使用性能分析工具：\n`VisualVM` 和 `JProfiler` 等工具帮助内存分析。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 1. 使用 IDE 调试（断点）\n\n#### 代码示例：\n\n\
  ```java\npublic class DebuggingExample {\n    public static void main(String[] args)\
  \ {\n        int number = 10;\n        int result = calculateFactorial(number);\n\
  \        System.out.println(\"Factorial of \" + number + \" is: \" + result);\n\
  \    }\n\n    public static int calculateFactorial(int n) {\n        if (n == 1)\
  \ {\n            return 1;\n        }\n        return n * calculateFactorial(n -\
  \ 1); // 递归调用\n    }\n}\n```\n\n#### IDE 调试步骤：\n\n1. 设置断点：\n在递归调用 `n * calculateFactorial(n\
  \ - 1)` 上放置断点。\n\n2. 开始调试：\n以调试模式运行程序。\n\n3. 逐过程（Step Over）：执行下一行而不进入方法调用。\n\n4.\
  \ 单步（Step Into）：\n进入被调用的方法以调试其内部执行情况。\n\n5. 检查变量：\n在调试器的变量视图查看 `n` 的值和中间结果。\n\n\
  #### 调试器输出：\n<bdi>●</bdi>你将看到递归栈逐步展开。\n<bdi>●</bdi>n 的值：\n<bdi>○</bdi>n = 10\n<bdi>○</bdi>n\
  \ = 9\n<bdi>○</bdi>...\n<bdi>○</bdi>n = 1\n\n### 2. 使用 System.out.println 调试\n\n\
  #### 代码示例：\n\n```java\npublic class DebuggingWithPrint {\n    public static void\
  \ main(String[] args) {\n        int number = 10;\n        int result = calculateFactorial(number);\n\
  \        System.out.println(\"Factorial of \" + number + \" is: \" + result);\n\
  \    }\n```\n\n\n\n\n\n```java\nSystem.out.println(\"Calculating factorial for n\
  \ = \" + n);\n\nif (n == 1) {\n    return 1;\n}\n\nint partialResult = n * calculateFactorial(n\
  \ - 1);\n\nSystem.out.println(\"Intermediate result for n = \" + n + \": \" + partialResult);\n\
  \nreturn partialResult;\n}\n\n}\n\n```\n\n#### 输出：\n\nCalculating factorial for\
  \ n = 10\nCalculating factorial for n = 9\nCalculating factorial for n = 8\n...\n\
  Intermediate result for n = 2: 2\nIntermediate result for n = 3: 6\n...\n10 的阶乘结果结果为:\
  \ 3628800\n\n#### 解释：\n\n1. 打印语句：\n\n<bdi>○</bdi>打印 `n` 的当前值和中间结果。\n\n2. 追踪执行：\n\
  \n<bdi>○</bdi>帮助追踪递归流并验证正确性。\n\n￼![Rectangle Rectangle](img/image.png)\n\n### 3.\
  \ 使用日志框架进行调试\n\n#### 代码示例：\n\n```java\nimport org.slf4j.Logger;\nimport org.slf4j.LoggerFactory;\n\
  \npublic class LoggingExample {\n    private static final Logger logger = LoggerFactory.getLogger(LoggingExample.class);\n\
  \n    public static void main(String[] args) {\n        int number = 10;\n     \
  \   int result = calculateFactorial(number);\n        logger.info(\"Factorial of\
  \ {} is {}\", number, result);\n    }\n\n    public static int calculateFactorial(int\
  \ n) {\n        logger.debug(\"Calculating factorial for n = {}\", n);\n       \
  \ if (n == 1) {\n            return 1;\n        }\n        int partialResult = n\
  \ * calculateFactorial(n - 1);\n        logger.debug(\"Intermediate result for n\
  \ = {}: {}\", n, partialResult);\n        return partialResult;\n    }\n}\n```\n\
  \n#### 输出（日志）：\n\nDEBUG [main] - Calculating factorial for n = 10\nDEBUG [main]\
  \ - Calculating factorial for n = 9\n...\nDEBUG [main] - Intermediate result for\
  \ n = 2: 2\nDEBUG [main] - Intermediate result for n = 3: 6\nINFO [main] - Factorial\
  \ of 10 is 3628800\n\n#### 解释：\n\n1. 日志级别：\n\n<bdi>○</bdi>使用 `DEBUG` 用于详细的执行流，使用\
  \ `INFO` 用于关键结果。\n\n2. 优势：\n\n<bdi>○</bdi>可以通过配置控制日志，以显示或隐藏特定级别的日志。\n\n￼![Rectangle\
  \ Rectangle](img/image.png)\n\n### 4. 使用异常处理进行调试\n\n#### 代码示例：\n\n```java\npublic\
  \ class ExceptionHandlingExample {\n    public static void main(String[] args) {\n\
  \        try {\n            int result = divideNumbers(10, 0);\n            System.out.println(\"\
  Result: \" + result);\n        } catch (ArithmeticException e) {\n            System.err.println(\"\
  Error: Division by zero.\");\n            e.printStackTrace();\n        }\n    }\n\
  \n    public static int divideNumbers(int a, int b) {\n        return a / b; //\
  \ 此处发生除以零\n    }\n}\n```\n\n#### 输出：\n\nError: Division by zero.\njava.lang.ArithmeticException:\
  \ / by zero\n<bdi>at ExceptionHandlingExample.divideNumbers(ExceptionHandlingExample.java:10)</bdi>\n\
  <bdi>at ExceptionHandlingExample.main(ExceptionHandlingExample.java:6)</bdi>\n\n\
  #### 解释：\n\n1. 堆栈跟踪：\n\n<bdi>○</bdi>准确定位异常发生的地点（第 10 行的 `divideNumbers`）。\n\n2.\
  \ 错误处理：\n\n<bdi>○</bdi>通过捕获异常防止程序终止。\n\n￼![Rectangle Rectangle](img/image.png)\n\
  \n### 5. 使用性能分析器进行性能调试\n\n#### 性能分析器：\n\n<bdi>●</bdi>使用如 `VisualVM`、`JProfiler`\
  \ 或 `YourKit` 等工具分析内存、CPU 使用和线程性能。\n\n#### 步骤：\n\n1. 将性能分析器附加到运行的应用程序。\n2. 监控：\n\
  \n<bdi>○</bdi>CPU 密集型方法。\n<bdi>○</bdi>内存使用和垃圾回收。\n<bdi>○</bdi>死锁或线程竞争。\n3. 优化：\n\
  \n<bdi>○</bdi>识别瓶颈并改进它们。\n\n￼![Rectangle Rectangle](img/image.png)\n\n### 6. 分析死锁\n\
  \n#### 代码示例：\n\n```java\nclass SharedResource {\n    synchronized void methodA()\
  \ {\n        System.out.println(Thread.currentThread().getName() + \" locked methodA\"\
  );\n        try { Thread.sleep(100); } catch (InterruptedException e) {}\n     \
  \   synchronized (this) {\n            System.out.println(Thread.currentThread().getName()\
  \ + \" locked methodB\");\n        }\n    }\n\n    synchronized void methodB() {\n\
  \        System.out.println(Thread.currentThread().getName() + \" locked methodB\"\
  );\n        try { Thread.sleep(100); } catch (InterruptedException e) {}\n     \
  \   synchronized (this) {\n            System.out.println(Thread.currentThread().getName()\
  \ + \" locked methodA\");\n        }\n    }\n}\n\npublic class DeadlockDebuggingExample\
  \ {\n    public static void main(String[] args) {\n        SharedResource resource\
  \ = new SharedResource();\n        Thread t1 = new Thread(() -> resource.methodA(),\
  \ \"Thread-1\");\n        Thread t2 = new Thread(() -> resource.methodB(), \"Thread-2\"\
  );\n        t1.start();\n        t2.start();\n    }\n}\n```\n\n#### 调试死锁的步骤：\n\n\
  1. 将性能分析器附加到运行的应用程序。\n2. 监控：\n\n<bdi>○</bdi>CPU 密集型方法。\n<bdi>○</bdi>内存使用和垃圾回收。\n\
  <bdi>○</bdi>死锁或线程竞争。\n3. 优化：\n\n<bdi>○</bdi>识别瓶颈并改进它们。\n\n输出：\nThread-1 locked methodA\n\
  Thread-2 locked methodB\n...\nThread-1 locked methodB\nThread-2 locked methodA\n\
  \n### 7. 常用调试命令\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `jstack` | 打印线程储储 |\n| `jmap`\
  \ | 打印内存使用情况 |\n| `jconsole` | 监控 JVM | |\n| `visualvm` | 可视化线程 |\n\n### 调试的最佳实践\n\
