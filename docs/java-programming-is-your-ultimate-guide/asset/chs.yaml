  #### 代码示例:\n```java\npublic class ArrayCopyExample {\n    public static void main(String[]\
  \ args) {\n        int[] original = {1, 2, 3};\n        int[] copy = new int[3];\n\
  \        System.arraycopy(original, 0, copy, 0, original.length);\n        for (int\
