  \n# 用于现代应用的 Java\n\n## Java 与大数据：Hadoop 集成\nJava 在大数据生态系统中扮演着重要角色，主要由于其对 Hadoop\
  \ 等工具的兼容性。Hadoop 是一个分布式框架。\n\n![Rectangle Rectangle](img/image.png)\n\n### 什么是 Hadoop？\n\
  Hadoop 是一个用于处理和存储分布式计算框架。它包含以下核心组件：\n1. **HDFS (Hadoop 分布式文件系统)：**\n<bdi>○</bdi>提供高吞吐访问应用程序数据的分布式文件系统。\n\
  2. **YARN (另一个资源调度器)：**\n<bdi>○</bdi>管理资源并调度作业。\n3. **MapReduce：**\n<bdi>○</bdi>一种用于分布式数据处理的模型。\n\
  4. **Hadoop 生态系统：**\n<bdi>○</bdi>包括 Hive、Pig、HBase 和 Spark 等工具。\n\n### Hadoop 与\
  \ Java\nHadoop 使用 Java 编写，使其成为 Java 开发者与框架交互的自然选择。Java 与 Hadoop 集成的原因包括：\n1. **原生支持：**\
  \ Hadoop 的 API 基于 Java，允许开发者编写 MapReduce 作业并与 HDFS 交互。\n2. **可扩展性：** Java 允许通过自定义\
  \ InputFormat、OutputFormat 和自定义处理逻辑来扩展 Hadoop 功能。\n3. **工具集成：** Java 与 Hadoop 生态系统中的\
  \ Hive、Pig 和 HBase 等工具无缝集成。\n\n### Hadoop 中的 Java 关键概念\n1. **HDFS：**\n<bdi>○</bdi>Java\
  \ API 允许读取和写入 HDFS。\n2. **MapReduce：**\n<bdi>○</bdi>开发者在 Java 类中编写自定义的 Mapper 和\
  \ Reducer 类来处理分布式数据集。\n3. **YARN ：**\n\n\n\n\n\n○ Java 应用程序可以提交到 Hadoop YARN 进行资源管理和执行。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n# 使用 Java 设置 Hadoop\n\n## 前提条件\n\n1.\
  \ 安装 Java (`JDK 8` 或更高版本)。\n2. 安装 Hadoop：\n   * 从 [Apache Hadoop](https://hadoop.apache.org/)\
  \ 下载 Hadoop。\n   * 配置 `HADOOP_HOME` 并将其添加到系统 `PATH` 中。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n## 1. 使用 Java 访问 HDFS\n\n代码示例：在 HDFS 中读读数据\n\n```java\nimport org.apache.hadoop.conf.Configuration;\n\
  import org.apache.hadoop.fs.FileSystem;\nimport org.apache.hadoop.fs.Path;\nimport\
  \ java.io.BufferedReader;\nimport java.io.InputStreamReader;\nimport java.io.OutputStream;\n\
  \npublic class HDFSExample {\n    public static void main(String[] args) {\n   \
  \     try {\n            // Hadoop Configuration\n            Configuration conf\
  \ = new Configuration();\n            conf.set(\"fs.defaultFS\", \"hdfs://localhost:9000\"\
  );\n            FileSystem fs = FileSystem.get(conf);\n\n            // Write to\
  \ HDFS\n            Path writePath = new Path(\"/user/hadoop/test.txt\");\n    \
  \        OutputStream os = fs.create(writePath);\n            os.write(\"Hello,\
  \ Hadoop!\".getBytes());\n            os.close();\n            System.out.println(\"\
  File written to HDFS.\");\n\n            // Read from HDFS\n            Path readPath\
  \ = new Path(\"/user/hadoop/test.txt\");\n            BufferedReader br = new BufferedReader(new\
  \ InputStreamReader(fs.open(readPath)));\n            String line;\n           \
  \ while ((line = br.readLine()) != null) {\n                System.out.println(\"\
  Read from HDFS: \" + line);\n            }\n            br.close();\n        } catch\
  \ (Exception e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n\
  ![Rectangle Rectangle](img/image.png)\n\n#### 解析：\n\n1. 配置：\n   * `Configuration`\
  \ 对象指定了 HDFS 的 URI。\n2. FileSystem API：\n   * `FileSystem.create` 将数据写入 HDFS。\n\
  \   * `FileSystem.open` 从 HDFS 读取数据。\n\n#### 输出：\nFile written to HDFS.\nRead from\
  \ HDFS: Hello, Hadoop!\n\n![Rectangle Rectangle](img/image.png)\n\n## 2. 使用 Java\
  \ 编写 MapReduce 任务\n\n代码示例：Hadoop 中的单词计数\n\n```java\nimport org.apache.hadoop.conf.Configuration;\n\
  import org.apache.hadoop.fs.Path;\nimport org.apache.hadoop.io.IntWritable;\nimport\
  \ org.apache.hadoop.io.Text;\nimport org.apache.hadoop.mapreduce.Job;\nimport org.apache.hadoop.mapreduce.Mapper;\n\
  import org.apache.hadoop.mapreduce.Reducer;\nimport org.apache.hadoop.mapreduce.lib.input.FileInputFormat;\n\
  import org.apache.hadoop.mapreduce.lib.output.FileOutputFormat;\nimport java.io.IOException;\n\
  \npublic class WordCount {\n    // Mapper Class\n    public static class TokenizerMapper\
  \ extends Mapper<Object, Text, Text, IntWritable> {\n        private final static\
  \ IntWritable one = new IntWritable(1);\n        private Text word = new Text();\n\
  \n        @Override\n        public void map(Object key, Text value, Context context)\
  \ throws IOException, InterruptedException {\n            String[] words = value.toString().split(\"\
  \\\\s+\");\n            for (String str : words) {\n                word.set(str);\n\
  \                context.write(word, one);\n            }\n        }\n    }\n\n\
  \    // Reducer Class\n    public static class IntSumReducer extends Reducer<Text,\
  \ IntWritable, Text, IntWritable> {\n        private IntWritable result = new IntWritable();\n\
  \n        @Override\n        public void reduce(Text key, Iterable<IntWritable>\
  \ values, Context context) throws IOException, InterruptedException {\n        \
  \    int sum = 0;\n            for (IntWritable val : values) {\n              \
  \  sum += val.get();\n            }\n            result.set(sum);\n            context.write(key,\
  \ result);\n        }\n    }\n\n    // Main Method\n    public static void main(String[]\
  \ args) throws Exception {\n        Configuration conf = new Configuration();\n\
  \        Job job = Job.getInstance(conf, \"word count\");\n        job.setJarByClass(WordCount.class);\n\
  \        job.setMapperClass(TokenizerMapper.class);\n        job.setCombinerClass(IntSumReducer.class);\n\
  \        job.setReducerClass(IntSumReducer.class);\n        job.setOutputKeyClass(Text.class);\n\
  \        job.setOutputValueClass(IntWritable.class);\n        FileInputFormat.addInputPath(job,\
  \ new Path(args[0]));\n        FileOutputFormat.setOutputPath(job, new Path(args[1]));\n\
  \        System.exit(job.waitForCompletion(true) ? 0 : 1);\n    }\n}\n```\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n#### 解析：\n\n1. Mapper：\n   * 将行拆分为单词，并为每个单词输出一个计数为\
  \ 1。\n2. Reducer：\n   * 聚合单词计数。\n3. Driver 代码：\n   * 配置并提交 MapReduce 任务。\n\n###\
  \ 运行任务：\n`hadoop jar WordCount.jar WordCount /input /output`\n\n#### 输出：\nhello\
  \ 2\nhadoop 3\nworld 1\n\n![Rectangle Rectangle](img/image.png)\n\n### 3. 使用 Java\
  \ 访问 Hive\n\nHive 是构建在 Hadoop 之上的数据仓库。Java 应用程序可以使用 JDBC 驱动执行 Hive。\n\n代码示例：执行 Hive\n\
  \n```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.ResultSet;\n\
  import java.sql.Statement;\n\npublic class HiveIntegration {\n    public static\
  \ void main(String[] args) {\n        try {\n            // 加载驱动\n            Class.forName(\"\
  org.apache.hive.jdbc.HiveDriver\");\n            // 连接\n            Connection conn\
  \ = DriverManager.getConnection(\"jdbc:hive2://localhost:10000/default\", \"user\"\
  , \"password\");\n            Statement stmt = conn.createStatement();\n\n     \
  \       // 创建表\n            stmt.execute(\"CREATE TABLE IF NOT EXISTS employees\
  \ (id INT, name STRING)\");\n            System.out.println(\"Table created.\");\n\
  \n            // 插入数据\n            stmt.execute(\"INSERT INTO employees VALUES (1,\
  \ 'Alice'), (2, 'Bob')\");\n            System.out.println(\"Data inserted.\");\n\
  \n            // 查询数据\n            ResultSet rs = stmt.executeQuery(\"SELECT * FROM\
  \ employees\");\n            while (rs.next()) {\n                System.out.println(\"\
  ID: \" + rs.getInt(\"id\") + \", Name: \" + rs.getString(\"name\"));\n         \
  \   }\n            conn.close();\n        } catch (Exception e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n#### 解析：\n1. JDBC 连接：使用 JDBC 驱动连接 Hive。\n2. 查询执行：执行创建、插入和检索数据的\
  \ Hive 查询。\n\n#### 输出：\nTable created.\nData inserted.\nID: 1, Alice\nID: 2, Bob\n\
  \n\n\n\n\n支持 `.arff`（属性关系文件格式）和 `.csv`。\n\n### 1. 扩展性：\n\n- 允许自定义算法开发。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n#### 安装 Weka\n\n1.1. 独立工具：\n\n- 从 Weka 官方网站下载 GUI\
  \ 版本。\n\nMaven 依赖（用于 Java 集成）：\n```xml\n<dependency>\n  <groupId>nz.ac.waikato.cms.weka</groupId>\n\
  \  <artifactId>weka-stable</artifactId>\n  <version>3.8.6</version>\n</dependency>\n\
  ```\n\n![Rectangle Rectangle](img/image.png)\n\n#### 示例：使用 Weka 进行分类\n\n代码示例：训练并测试决策树\n\
  \n```java\nimport weka.classifiers.Classifier;\nimport weka.classifiers.trees.J48;\n\
  import weka.core.Instances;\nimport weka.core.converters.ConverterUtils.DataSource;\n\
  \npublic class WekaExample {\n    public static void main(String[] args) {\n   \
  \     try {\n            // Load dataset\n            DataSource source = new DataSource(\"\
  iris.arff\");\n            Instances data = source.getDataSet();\n            //\
  \ Set class index to the last attribute\n            if (data.classIndex() == -1)\
  \ {\n                data.setClassIndex(data.numAttributes() - 1);\n           \
  \ }\n            // Build classifier\n            Classifier classifier = new J48();\
  \ // Decision Tree\n            classifier.buildClassifier(data);\n            //\
  \ Output model\n            System.out.println(classifier);\n        } catch (Exception\
  \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n#### 解析：\n\n1.1. 加载数据集：\n\n- 使用 Weka 的 `DataSource`\
  \ 类读取 `iris.arff` 数据集。\n\n1.2. 设置类索引：\n\n- 指定分类的目标变量（类）。\n\n1.3. 构建分类器：\n\n- 使用\
  \ `J48` 算法（C4.5 决策树的变体）。\n\n1.4. 输出：\n\n- 显示决策树模型。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 输出：\n\nJ48 剪枝树\n\n------------------\n\npetalwidth <= 0.6: Iris-setosa (50.0)\n\
  \npetalwidth > 0.6: ...\n\n![Rectangle Rectangle](img/image.png)\n\n#### Weka 的用场景：\n\
  \n1.1. 教育：\n\n- 教学机器学习概念的理想人选。\n\n1.2. 原型制作：\n\n- 在数据集上快速测试算法。\n\n1.3. 数据探索：\n\n\
  - 使用 GUI 对数据进行预处理和可视化。\n\n![Rectangle Rectangle](img/image.png)\n\n### 2. Deeplearning4j\
  \ (DL4J)\n\nDeeplearning4j (DL4J) 是一个为 Java 设计的深度学习库，旨在顾性能和可扩展性。它支持分布式训练，与 Apache\
  \ Spark 集成，并提供了用于构建神经网络的 API。\n\n#### DL4J 的核心特性\n\n1.1. 神经网络支持：\n\n- 构建 `CNNs`、`RNNs`\
  \ 和 `GANs` 等深度学习架构。\n\n1.2. 分布式训练：\n\n- 在 Apache Spark 或 `Hadoop` 集群上训练模型。\n\n1.3.\
  \ 互操作性：\n\n- 与其他库如 `TensorFlow`、`PyTorch`（通过 `ONNX`）和 `ND4J`（Java 数值计算）集成。\n\n1.4.\
  \ 硬件加速：\n\n- 支持 `GPUs` 以加速训练。\n\n![Rectangle Rectangle](img/image.png)\n\n#### 安装\
  \ DL4J\n\nMaven 依赖：\n```xml\n<dependency>\n  <groupId>org.deeplearning4j</groupId>\n\
  \  <artifactId>deeplearning4j-core</artifactId>\n  <version>1.0.0-M2</version>\n\
  </dependency>\n```\n\n![Rectangle Rectangle](img/image.png)\n\n#### 示例：构建和训练神经网络\n\
  \n代码示例：简单前馈神经网络\n\n```java\nimport org.deeplearning4j.nn.api.OptimizationAlgorithm;\n\
  import org.deeplearning4j.nn.conf.MultiLayerConfiguration;\nimport org.deeplearning4j.nn.conf.NeuralNetConfiguration;\n\
  import org.deeplearning4j.nn.conf.layers.DenseLayer;\nimport org.deeplearning4j.nn.conf.layers.OutputLayer;\n\
  import org.deeplearning4j.nn.multilayer.MultiLayerNetwork;\nimport org.deeplearning4j.optimize.listeners.ScoreIterationListener;\n\
  import org.nd4j.linalg.activations.Activation;\nimport org.nd4j.linalg.dataset.DataSet;\n\
  import org.nd4j.linalg.factory.Nd4j;\nimport org.nd4j.linalg.lossfunctions.LossFunctions;\n\
  import org.nd4j.linalg.ndarray.INDArray;\n\npublic class DL4JExample {\n    public\
  \ static void main(String[] args) {\n        // Define configuration\n        MultiLayerConfiguration\
  \ config = new NeuralNetConfiguration.Builder()\n            .seed(123)\n      \
  \      .optimizationAlgo(OptimizationAlgorithm.STOCHASTIC_GRADIENT_DESCENT)\n  \
  \          .list()\n            .layer(0, new DenseLayer.Builder()\n           \
  \     .nIn(2) // Input features\n                .nOut(3) // Hidden units\n    \
  \            .activation(Activation.RELU)\n                .build())\n         \
  \   .layer(1, new OutputLayer.Builder(LossFunctions.LossFunction.MSE)\n        \
  \        .nIn(3)\n                .nOut(1) // Output units\n                .activation(Activation.SIGMOID)\n\
  \                .build())\n            .build();\n\n        // Initialize the network\n\
  \        MultiLayerNetwork model = new MultiLayerNetwork(config);\n        model.init();\n\
  \        model.setListeners(new ScoreIterationListener(100));\n\n        // Training\
  \ data\n        INDArray input = Nd4j.create(new double[][]{{0,0}, {0,1}, {1,0},\
  \ {1,1}}); // XOR\n        INDArray labels = Nd4j.create(new double[][]{{0}, {1},\
  \ {1}, {0}});\n        DataSet dataSet = new DataSet(input, labels);\n\n       \
  \ // Train the model\n        for (int i = 0; i < 100; i++) {\n            model.fit(dataSet);\n\
  \        }\n\n        // Test the model\n        INDArray output = model.output(input);\n\
  \        System.out.println(\"Predictions: \" + output);\n    }\n}\n```\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n#### 解析：\n\n1.1. 定义配置：\n\n- 使用 `DenseLayer` 和 `OutputLayer`\
  \ 配置一个带隐藏层的前馈神经网络。\n\n1.2. 训练数据：\n\n- 使用 `XOR` 数据作为输入和 `labels`。\n\n1.3. 训练模型：\n\
  \n- `fit` 方法对网络进行 100 次迭代。\n\n1.4. 测试模型：\n\n- 训练后的模型预测 XOR 输出。\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### 输出：\n\nPredictions: [[0], [1], [1], [0]]\n\n![Rectangle Rectangle](img/image.png)\n\
  \n#### DL4J 的用场景：\n\n1.1. 深度学习应用：\n\n- 图像识别、自然语言处理（NLP）和时间序列预测。\n\n1.2. 大数据集成：\n\
  \n- 使用 Spark 和 `Hadoop` 进行分布式训练。\n\n1.3. 企业级应用：\n\n- 生产环境的可扩展机器学习解决方案。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### Weka 和 DL4J 的比较\n\n| 维度 | Weka | DL4J |\n| :---\
  \ | :--- | :--- |\n| 关注点 | 传统机器学习算法 | 深度学习和神经网络 |\n| 易用性 | 对初学者友好 | 高级，需要理解深度学习\
  \ |\n| 数据预处理 | 内置预处理工具 | 限制；需要外部库如 `ND4J` |\n| 分布式训练 | 不支持 | 支持 Spark 或 Hadoop |\n\
  | 性能 | 适用于中小型数据集 | 专为大规模数据集设计 |\n| 集成 | 独立运行或嵌入 Java 项目 | 与大数据工具集成 |\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 结论\n\nWeka 是快速实验传统机器学习算法和处理小型数据集的极佳选择。它的简单性和\
  \ GUI 使其非常适合教学目的和原型制作。\n\nDeeplearning4j 则更适用于涉及深度学习和分布式训练的高级用例。它提供了企业级的可扩展性以及与大数据工具的集成。\n\
  \n选择 Weka 还是 DL4J 取于问题的复杂性和数据集的规模。这两个库都能让 Java 开发者在应用程序中利用机器学习。\n\n## 用于 IoT 应用的\
  \ Java\n\n物联网（IoT）涉及通信和交换数据的互连设备、传感器和系统。由于其具有平台独立性、健壮的库和可扩展性，Java 是开发 IoT 应用的流行语言。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 为什么为 IoT 使用 Java？\n\n1.1. 平台独立性：\n\
  \n- Java 的“编写一次，到处运行”（WORA）能力允许部署在不同的 IoT 硬件上。\n\n1.2. 丰富的生态系统：\n\n- 一如 Eclipse\
  \ IoT、MQTT 客户端和 Java ME Embedded 等库和框架提供了即用工具。\n\n1.3. 多线程：\n\n- Java 的线程能力非常适合处理多个并发\
  \ IoT 进程。\n\n1.4. 可扩展性：\n\n- 可以轻松从边缘设备扩展到基于云的 IoT 管理系统。\n\n\n\n\n\n# 安全性\n- `SSL/TLS`、安全套接和强大的身份验证机制等功能使\
  \ Java 成为安全的选择。\n\n# 协议兼容性\n- Java 支持 `MQTT`、`CoAP`、`HTTP` 和 `WebSockets` 等 IoT\
  \ 通信协议。\n\n![Rectangle Rectangle](img/image.png)\n\n## Java 在 IoT 中的常见用途\n\n###\
  \ 1. 边缘设备编程\n- 管理传感器、执行器关。\n\n### 2. 数据聚合\n- 收集并预处理来自多个 IoT 设备的数据。\n\n### 3. 云端集成\n\
  - 与 `AWS IoT`、`Azure IoT Hub` 或 `Google IoT Core` 等 IoT 平台通信。\n\n### 4. 实时处理\n-\
  \ 处理传感器数据以获取可操作的洞察。\n\n![Rectangle Rectangle](img/image.png)\n\n## Java IoT 框架和库\n\
  \n### 1. Eclipse IoT\n- 提供用于 IoT 协议、数据建模和设备管理的工具。\n\n### 2. Eclipse Paho (MQTT)\n\
  - 用于 `MQTT` 消息的 Java 库。\n\n### 3. Pi4J\n- 简化 `Raspberry Pi` 设备的硬件交互。\n\n### 4. Java\
  \ ME Embedded\n- 针对资源有限的 IoT 设备优化的轻量级 Java 环境。\n\n### 5. OpenHAB\n- 基于 Java 的智能家居自动化开源平台。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n## 配置 IoT 开发环境\n\n### 1.set 工具\n- Java\
  \ 开发包 (`JDK`)。\n- 用于 `MQTT` 通信的 `Eclipse Paho` 等 IoT 库。\n- IoT 硬件（例如 `Raspberry\
  \ Pi`、`Arduino`）。\n- 用于测试的传感器和执行器（例如温度传感器、`LEDs`）。\n\n### 2. 连接硬件\n对于 `Raspberry\
  \ Pi` 等硬件：\n\n使用以下命令安装 Java：\n```bash\nsudo apt update\nsudo apt install openjdk-11-jdk\n\
  ```\n\n- 使用 `Pi4J` 等库进行 `GPIO` 交互。\n\n![Rectangle Rectangle](img/image.png)\n\n\
  ## Java IoT 示例\n\n### 1. 从温度传感器读取数据\n代码示例：在 `Raspberry Pi` 上使用 `Pi4J`\n\n```java\n\
  import com.pi4j.io.gpio.GpioController;\nimport com.pi4j.io.gpio.GpioFactory;\n\
  import com.pi4j.io.gpio.GpioPinDigitalInput;\nimport com.pi4j.io.gpio.PinPullResistance;\n\
  import com.pi4j.io.gpio.RaspiPin;\n\npublic class TemperatureSensorExample {\n \
  \   public static void main(String[] args) throws InterruptedException {\n     \
  \   // 创建 GPIO 控制器\n        final GpioController gpio = GpioFactory.getInstance();\n\
  \        // 为输入准备一个 GPIO 引\n        final GpioPinDigitalInput tempSensor = gpio.provisionDigitalInputPin(\n\
  \            RaspiPin.GPIO_01, PinPullResistance.PULL_DOWN);\n        while (true)\
  \ {\n            boolean isHigh = tempSensor.isHigh();\n            System.out.println(\"\
  Temperature Sensor State: \" + (isHigh ? \"HIGH\" : \"LOW\"));\n            Thread.sleep(1000);\n\
  \        }\n    }\n}\n```\n\n![Rectangle Rectangle](img/image.png)\n\n#### 解释说明：\n\
  1. `Pi4J` 库：\n- 为 `GPIO` 引脚提供简单的 API。\n2. 传感器读取：\n- 从连接到温度传感器的 `GPIO` 引脚读取数字输入。\n\
  \n#### 输出：\nTemperature Sensor State: LOW\nTemperature Sensor State: HIGH\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 2. 使用 MQTT 进行 IoT 消息传递\n代码示例：订阅 MQTT Broker\n\
  \n```java\nimport org.eclipse.paho.client.mqttv3.*;\n\npublic class MqttExample\
  \ {\n    public static void main(String[] args) {\n        String broker = \"tcp://broker.hivemq.com:1883\"\
  ;\n        String clientId = \"JavaIoTClient\";\n        String topic = \"iot/sensors\"\
  ;\n        try {\n            // 创建 MQTT 客户端\n            MqttClient client = new\
  \ MqttClient(broker, clientId);\n            MqttConnectOptions options = new MqttConnectOptions();\n\
  \            options.setCleanSession(true);\n            // 连接到 broker\n       \
  \     client.connect(options);\n            System.out.println(\"Connected to MQTT\
  \ broker\");\n            // 发布消息\n            String message = \"Temperature: 22.5°C\"\
  ;\n            client.publish(topic, new MqttMessage(message.getBytes()));\n   \
  \         System.out.println(\"Message published: \" + message);\n            //\
  \ 订阅主题\n            client.subscribe(topic, (receivedTopic, mqttMessage) -> {\n\
  \                System.out.println(\"Received message: \" + new String(mqttMessage.getPayload()));\n\
  \            });\n            // 保持连接\n            Thread.sleep(5000);\n       \
  \     client.disconnect();\n        } catch (Exception e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n![Rectangle Rectangle](img/image.png)\n\n#### 解释说明：\n\
  1. `MQTT` Broker：\n- 连接到公共 `MQTT` broker (`broker.hivemq.com`)。\n2. 发布：\n- 发送消息。\n\
  3. 订阅：\n- 监听消息。\n\n#### 输出：\nConnected to MQTT broker\nMessage published: Temperature:\
  \ 22.5°C\nReceived message: Temperature: 22.5°C\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 3. 智能家居：控制 LED\n代码示例：开启和关闭 LED\n\n```java\nimport com.pi4j.io.gpio.GpioController;\n\
  import com.pi4j.io.gpio.GpioFactory;\nimport com.pi4j.io.gpio.GpioPinDigitalOutput;\n\
  import com.pi4j.io.gpio.PinPullResistance;\nimport com.pi4j.io.gpio.RaspiPin;\n\n\
  public class LEDControl {\n    public static void main(String[] args) throws InterruptedException\
  \ {\n        // 创建 GPIO 控制器\n        final GpioController gpio = GpioFactory.getInstance();\n\
  \        // 为输出准备一个 GPIO 引\n        final GpioPinDigitalOutput led = gpio.provisionDigitalOutputPin(\n\
  \            RaspiPin.GPIO_01, PinPullResistance.PULL_DOWN);\n        for (int i\
  \ = 0; i < 5; i++) {\n            led.toggle();\n            System.out.println(\"\
  LED state: \" + (led.isHigh() ? \"ON\" : \"OFF\"));\n            Thread.sleep(1000);\n\
  \        }\n        // 关闭 GPIO 器\n        gpio.shutdown();\n    }\n}\n```\n\n####\
  \ 解释说明：\n1. `GPIO` 交互：\n- 使用 `Pi4J` 控制 `GPIO` 引脚。\n2. `LED` 切换：\n- 切换 LED 状态。\n\n\
  #### 输出：\nLED state: ON\nLED state: OFF\n...\n\n## Java IoT 最佳实践\n1. 针对资源受限设备进行优化：\n\
