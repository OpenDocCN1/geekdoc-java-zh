  。\n\n![Rectangle Rectangle](img/image.png)\n\n### 处理用户交互\n\n#### 代码示例：按钮点击事件\n\n\
  MainActivity.java:\n\n```java\npackage com.example.buttonclick;\n\nimport android.os.Bundle;\n\
