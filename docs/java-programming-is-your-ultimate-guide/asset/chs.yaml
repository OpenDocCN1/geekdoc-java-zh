  \ \" + numbers.length);\n    }\n}\n```\n\n#### 输出:\n```\nArray Length: 3\n```\n\n\
  #### 解析:\n<bdi>●</bdi>`length` 属性返回数组的大小。\n\n![Rectangle Rectangle](img/image.png)\n\
