  Day: Wednesday\nDay: Friday\n```\n\n#### 解释：\n\n1. 可重复注解：\n<bdi>○</bdi>`@Repeatable`\
  \ 注解允许多次使用 `@Schedule`。\n\n2. 容器注解：\n<bdi>○</bdi>`@Schedules` 充多个 `@Schedule` 注解的容器。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### 自定义注解的最佳实践\n\n1. 使用元注解：\n<bdi>○</bdi>始终使用\
