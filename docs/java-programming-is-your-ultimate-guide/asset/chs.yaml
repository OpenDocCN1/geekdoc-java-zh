  \  <artifactId>gson</artifactId>\n  <version>2.8.9</version>\n</dependency>\n```\n\
  \n运行 `mvn compile` 以下载并包含依赖。\n\n![Rectangle Rectangle](img/image.png)\n\n# 2. 使用\
