  \nJDBC 是 Java 应用中数据库交互的基石，提供了与关系型数据库交互的灵活且标准的方法。\n\n## JDBC 驱动\n\nJDBC 驱动是基于 Java\
  \ 的库，有助于 Java 应用程序与关系型数据库之间的连接。这些驱动将 Java 调用转换为数据库特定的调用，实现与数据库的无缝交互。\n\n￼![Rectangle\
  \ Rectangle](img/image.png)\n\n### JDBC 驱动的类型\n\nJDBC 驱动根据架构分为四类：\n\n| 驱动类型 | 描述\
  \ | 优点 | 缺点 |\n| :--- | :--- | :--- | :--- |\n| 类型 1 (JDBC-ODBC 桥) | 使用 ODBC 驱动连接数据库。在\
  \ JDK 8 中已弃用。 | 简单易用。 | 依赖 ODBC；性能较慢。 |\n| 类型 2 (原生 API) | 使用中间件将 JDBC 调用转换为数据库特定的原生\
  \ API 调用。 | 比类型 1 快；适用于本地数据库。 | 需要原生库。 |\n| 类型 3 (网络协议) | 将 JDBC 调用转换为发送到中间件服务器的与数据库无关的协议。\
  \ | 不需要客户端数据库库。 | 中间件增加了复杂度。 |\n| 类型 4 (薄驱动) | 直接将 JDBC 调用转换为数据库特定的协议。 | 平台无关；高性能。\
  \ | 特定于数据库厂商。 |\n\n￼![Rectangle Rectangle](img/image.png)\n\n### 常见 JDBC 驱动\n\n\
  | 数据库 | 驱动 | JDBC URL 格式 |\n| :--- | :--- | :--- |\n| MySQL | `com.mysql.cj.jdbc.Driver`\
  \ | `jdbc:mysql://hostname:port/dbname` |\n| PostgreSQL | `org.postgresql.Driver`\
  \ | `jdbc:postgresql://hostname:port/dbname` |\n| Oracle | `oracle.jdbc.OracleDriver`\
  \ | `jdbc:oracle:thin:@hostname:port:SID` |\n| Microsoft SQL Server | `com.microsoft.sqlserver.jdbc.SQLServerDriver`\
  \ | `jdbc:sqlserver://hostname:port;databaseName=db` |\n| SQLite | `org.sqlite.JDBC`\
  \ | `jdbc:sqlite:filename` |\n\n￼![Rectangle Rectangle](img/image.png)\n\n### 如何加载\
  \ JDBC 驱动\n\n在 Java 6 之前，必须使用 `Class.forName()` 显式加载驱动：\n\n```java\nClass.forName(\"\
  com.mysql.cj.jdbc.Driver\");\n```\n\n自 Java 6 起，如果驱动在类路径中，JDBC 4.0+ 会自动加载它。\n\n\
  ￼![Rectangle Rectangle](img/image.png)\n\n### 设置 JDBC 驱动\n\n1. 将驱动添加到类路径:\n对于 Maven：\n\
  ```xml\n<dependency>\n  <groupId>mysql</groupId>\n  <artifactId>mysql-connector-java</artifactId>\n\
  \  <version>8.0.33</version>\n</dependency>\n```\n\n2. 指定 JDBC URL:\nMySQL 示例：`jdbc:mysql://localhost:3306/testdb`\n\
  \n3. 身份验证:\n<bdi>○</bdi>提供数据库用户名和密码。\n\n￼![Rectangle Rectangle](img/image.png)\n\
  \n### 示例：使用 JDBC 连接 MySQL\n\n#### 代码示例:\n```java\nimport java.sql.Connection;\n\
  import java.sql.DriverManager;\nimport java.sql.SQLException;\n\npublic class JDBCDriverExample\
  \ {\n    public static void main(String[] args) {\n        // 数据库连接详情\n        String\
  \ url = \"jdbc:mysql://localhost:3306/testdb\";\n        String username = \"root\"\
  ;\n        String password = \"password\";\n\n        try {\n            // 连接数据库\n\
  \            Connection connection = DriverManager.getConnection(url, username,\
  \ password);\n            if (connection != null) {\n                System.out.println(\"\
  成功连接到数据库！\");\n            }\n        } catch (SQLException e) {\n            System.out.println(\"\
  连接数据库失败\");\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n\n\n\n\
  ○ 促进 Java 应用程序与关系型数据库之间的通信。\n\n● 类型：\n\n○ Type-4 驱动因其简单高效而被最广泛使用。\n\n● 示例：\n\n○\
  \ 展示了如何使用各自的驱动连接到 MySQL 和 PostgreSQL。\n\n● 最佳实践：\n\n○ 确保安全、高效且健壮的数据库交互。\n\nJDBC\
  \ 驱动是 Java 数据库编程的重要组成部分，确保应用程序与数据库之间的无缝集成。适当的配置和使用可以保证数据库连接的稳定高效。\n\n## JDBC 驱动\n\
  \nJDBC 驱动是基于 Java 的库，有助于 Java 应用程序与关系型数据库之间的连接。这些驱动将 Java 调用转换为特定的数据库调用，实现与数据库的无缝交互。\n\
  \n![Rectangle Rectangle](img/image.png)\n\n### JDBC 驱动的类型\n\nJDBC 驱动根据架构分为四类：\n\n\
  | 驱动类型 | 描述 | 优点 | 缺点 |\n| :--- | :--- | :--- | :--- |\n| Type-1 (JDBC-ODBC 桥接)\
  \ | 使用 ODBC 驱动连接到数据库。在 JDK 8 中已弃用。 | 简单易用。 | 依赖 ODBC；性能较慢。 |\n| Type-2 (原生 API)\
  \ | 使用中间件将 JDBC 调用转换为特定数据库的原生 API 调用。 | 比 Type-1 快；适用于本地数据库。 | 需要原生库。 |\n| Type-3\
  \ (网络协议) | 将 JDBC 调用转换为发送到中间件服务器的独立协议。 | 无需客户端数据库库。 | 中间件增加了复杂度。 |\n| Type-4 (薄型驱动)\
  \ | 直接将 JDBC 调用转换为特定的数据库协议。 | 平台无关；高性能。 | 针对特定数据库厂商。 |\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 常见 JDBC 驱动\n\n| 数据库 | 驱动 | JDBC URL 格式 |\n| :--- | :--- | :--- |\n| MySQL\
  \ | com.mysql.cj.jdbc.Driver | jdbc:mysql://hostname:port/dbname |\n| PostgreSQL\
  \ | org.postgresql.Driver | jdbc:postgresql://hostname:port/dbname |\n| Oracle |\
  \ oracle.jdbc.OracleDriver | jdbc:oracle:thin:@hostname:port:SID |\n| Microsoft\
  \ SQL Server | com.microsoft.sqlserver.jdbc.SQLServerDriver | jdbc:sqlserver://hostname:port;databaseName=db\
  \ |\n| SQLite | org.sqlite.JDBC | jdbc:sqlite:filename |\n\n![Rectangle Rectangle](img/image.png)\n\
  \n### 如何加载 JDBC 驱动\n\n在 Java 6 之前，必须显式使用 `Class.forName()` 加载驱动：\n\n```java\nClass.forName(\"\
  com.mysql.cj.jdbc.Driver\");\n```\n\n从 Java 6 开始，如果驱动在类路径中，JDBC 4.0+ 会自动加载驱动。\n\n\
  ![Rectangle Rectangle](img/image.png)\n\n### 设置 JDBC 驱动\n\n1. 将驱动添加到类路径：\n\n对于 Maven：\n\
  ```xml\n<dependency>\n<groupId>mysql</groupId>\n<artifactId>mysql-connector-java</artifactId>\n\
  <version>8.0.33</version>\n</dependency>\n```\n\n2. 指定 JDBC URL：\n\nMySQL 示例：`jdbc:mysql://localhost:3306/testdb`\n\
  \n3. 身份验证：\n\n○ 提供数据库的用户名和密码。\n\n![Rectangle Rectangle](img/image.png)\n\n### 示例：使用\
  \ JDBC 连接到 MySQL\n\n#### 代码示例：\n\n```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\n\
  import java.sql.SQLException;\n\npublic class JDBCDriverExample {\n    public static\
  \ void main(String[] args) {\n        // 数据库连接详情\n        String url = \"jdbc:mysql://localhost:3306/testdb\"\
  ;\n        String username = \"root\";\n        String password = \"password\";\n\
  \        try {\n            // 连接到数据库\n            Connection connection = DriverManager.getConnection(url,\
  \ username, password);\n            if (connection != null) {\n                System.out.println(\"\
  Connected to the database successfully!\");\n            }\n        } catch (SQLException\
  \ e) {\n            System.out.println(\"Error connecting to the database.\");\n\
  \            e.printStackTrace();\n        }\n    }\n}\n```\n\n#### 输出：\n\nConnected\
  \ to the database successfully!\n\n#### 解释：\n\n1. JDBC URL：\n\n○ 指定协议 (`jdbc`)、数据库类型\
  \ (`mysql`)、主机名 (`localhost`)、端口 (`3306`) 和数据库名称 (`testdb`)。\n\n2. DriverManager：\n\
  \n○ 自动加载适当 JDBC 驱动并建立连接。\n\n3. Connection：\n\n○ 代表与数据库的连接。如果成功，则表示已连通。\n\n![Rectangle\
  \ Rectangle](img/image.png)\n\n### 示例：使用多个驱动\n\n#### 代码示例：\n\n```java\nimport java.sql.Connection;\n\
  import java.sql.DriverManager;\n\npublic class MultipleDriversExample {\n    public\
