  \n## 27.4 创建 GestureDetectorCompat 实例\n\n现在活动类已更新为实现监听器接口，下一步是创建 `GestureDetectorCompat`\
  \ 类的实例。由于这只需要在活动创建时执行一次，因此此代码的最佳位置是 `onCreate()` 方法中。由于我们还想检测双击，代码还需要调用 `GestureDetectorCompat`\
  \ 实例的 `setOnDoubleTapListener()` 方法：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\
  import android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\nimport\
  \ android.view.GestureDetector;\nimport android.widget.TextView;\nimport android.view.MotionEvent;\n\
  import android.support.v4.view.GestureDetectorCompat;\n\npublic class MainActivity\
  \ extends AppCompatActivity\n    implements GestureDetector.OnGestureListener, GestureDetector.OnDoubleTapListener\
  \ {\n    private TextView gestureText;\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_common_gestures);\n\
  \        gestureText =(TextView)findViewById(R.id.gestureStatusText);\n        gDetector\
  \ = new GestureDetectorCompat(this);\n        gDetector.setOnDoubleTapListener(this);\n\
  \    }\n}\n```\n\n## 27.5 实现 onTouchEvent 方法\n\n如果在此编译并运行应用程序，即使在设备上执行了手势，什么都不会发生，因为还没有添加代码来拦截事件并通过\
  \ `GestureDetectorCompat` 实例传递它们。为了实现这一点，必须重写活动类中的 `onTouchEvent()` 方法并实现如下：\n\n\
  ```java\n@Override\npublic boolean onTouchEvent(MotionEvent event) {\n    this.gDetector.onTouchEvent(event);\
  \ // 调用父类\n    return super.onTouchEvent(event);\n}\n```\n\n## 27.6 测试应用程序\n\n在物理设备或\
  \ AVD 模拟器上编译并运行应用程序。一旦启动，尝试滑动、按下和双击。注意视图将更新以反映这些事件。\n\n## 27.7 总结\n\n用户与设备触摸屏之间的任何物理接触都可以认为是“手势”。由于缺乏传统系统的物理键盘和鼠标指针，手势被广泛用于用户与应用程序之间交互的方法。虽然手势可以由任何动作序列组成，但有一套触摸屏设备用户熟悉的常用手势。通过使用\
  \ Android GestureDetector 类，可以在应用程序中轻松检测许多“常用手势”。在本章中，通过理论和示例项目概述了这种技术的使用。在涵盖常用手势后，下一章将介绍更广泛的手势类型，包括设计和检测自己的手势。\n\
  \n## 28 在 Android 上实现自定义手势和识别\n\n上一章涵盖了 Android 应用程序内部的“常用手势”检测。但在实践中，手势可能涉及 Android\
  \ 设备屏幕上的任何触摸动作。由于这一事实，Android SDK 允许应用程序定义任何类型的自定义手势并在用户执行时触发事件。这是一个多阶段的过程，其细节是本章的主题。\n\
  \n### 28.1 Gesture Builder 应用程序\n\nAndroid SDK 允许开发者设计自定义手势，然后将其存储在随 Android 包一起的手势文件中。这些文件最简单的方法是使用作为\
  \ Android SDK 部分提供的 Gesture Builder 应用程序。创建手势文件涉及在物理设备或模拟器上启动 Gesture Builder 应用程序，并“绘制”应用程序需要检测的手势。一旦设计好手势，包含手势的数据就可以从设备或模拟器的\
  \ SD 卡中提取并添加到应用程序项目中。在应用程序代码中，随后将其加载到 `GestureLibrary` 类的实例中，用于搜索用户在设备显示上执行的任何手势的匹配。\n\
  \n### 28.2 GestureOverlayView 类\n\n为了方便在应用程序中检测手势，Android SDK 提供了 `GestureOverlayView`\
  \ 类。这是一个透明视图，可以放在用户界面其他视图之上，专门用于检测手势。\n\n### 28.3 检测手势\n\n通过加载使用 Gesture Builder\
  \ 应用创建的手势文件，然后在 `GestureOverlayView` 实例上注册 `GestureListener` 事件监听器来检测手势。随后将封装类声明实现\
  \ `OnGestureListener` 接口以及该接口所需的 `onGesturePerformed` 回调方法。当监听器检测到手势时，Android 运行时系统会触发\
  \ `onGesturePerformed` 回调方法的调用。\n\n### 28.4 识别特定手势\n\n当检测到手势时，调用 `onGesturePerformed`\
  \ 回调方法，并传递检测到手势的 `GestureOverlayView` 对象的引用，以及一个包含手势信息的 `Gesture` 对象。访问 `Gesture`\
  \ 对象后，可以使用 `GestureLibrary` 将检测到的手势与之前加载到应用程序的手势文件内容进行比较。`GestureLibrary` 通过计算每个手势的预测得分来报告用户执行的手势与手势文件条目匹配的概率。1.0\
  \ 或更高的得分通常被认为是文件中存储的手势与用户在设备显示上执行的手势之间的良好匹配。\n\n### 28.5 构建并运行 Gesture Builder 应用程序\n\
  \nGesture Builder 应用程序默认包含在某些 SDK 的 AVD 模拟器配置中。然而，它并没有在大多数物理 Android 设备上预装。如果该工具已预装，它将列在设备或\
  \ AVD 实例的其他应用程序列表中。如果没有安装，该工具的源代码包含在提供的示例中。如果你尚未下载，使用以下链接下载：`https://www.ebookfrenzy.com/retail/androidstudio3/index.php`\n\
  \nGesture Builder 应用程序的源代码位于名为 `GestureBuilder` 的文件夹中。从 Android Studio 欢迎界面打开 `GestureBuilder`\
  \ 项目并在设备或模拟器上运行。\n\n### 28.6 创建手势文件\n\n一旦 Gesture Builder 应用加载，它应该指示尚未创建手势。要创建一个手势，点击设备底部的\
  \ `Add gesture` 按钮，在 `Name` 框中输入 `Circle Gesture`，然后在屏幕上使用圆形动作“绘制”手势。假设手势显示（如黄色线条所示），点击\
  \ `Done` 按钮将手势添加到手势文件中。手势保存后，Gesture Builder 将显示当前定义的手势列表，此时只有 `Circle Gesture`。\n\
  \n### 28.7 创建项目\n\n从欢迎界面选择`Start a new Android Studio project`快速启动选项，在出现的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。在 `Name` 字段中输入 `Gestures` 并指定 `com.ebookfrenzy.customgestures`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n### 28.8 从 SD 卡提取手势\n\n由于每个手势都在 Gesture Builder 应用中创建的，它们被添加到模拟器或设备的\
  \ SD 卡上名为 `gestures` 的文件中。在将此文件添加到 Android Studio 项目之前，必须先从 SD 卡提取并保存到本地文件。使用 Android\
  \ Studio Device Explorer 工具最容易实现。通过 `View -> Windows -> Device Explorer` 显示此工具。一旦显示，从下拉菜单选择创建手势文件的设备，然后导航到\
  \ `/sdcard` 文件夹。找到文件夹中的 `gestures` 文件，右键点击它并选择 `Save as...` 方法将文件保存到临时位置。一旦手势文件创建并从\
  \ SD 卡提取，就可以作为资源文件添加到 Android Studio 项目中。\n\n### 28.9 将手势添加到项目\n\n在 Android Studio\
  \ 项目窗口中，找到 `app` 下的 `res` 文件夹并选择 `New -> Directory`。在 New Directory 对话中输入 `raw`\
  \ 作为文件夹名并点击 OK。使用适当的文件资源管理器，找到之前从 SD 卡提取的手势文件并将其粘贴到 `raw` 文件夹。\n\n### 28.10 设计用户界面\n\
  \n此示例应用程序需要一个 `LinearLayout` 视图和一个叠加在其上的 `GestureOverlayView` 来拦截用户执行的任何手势。找到 `app\
  \ -> res -> layout -> activity_main.xml` 文件，双击它将其加载到 Layout Editor 并删除默认的 `TextView`\
  \ 小部件。切换到布局编辑器模式并修改 XML 如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<android.support.constraint.ConstraintLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    tools:context=\".MainActivity\"\
  >\n\n    <android.gesture.GestureOverlayView\n        android:id=\"@+id/gOverlay\"\
  \n        android:layout_width=\"0dp\"\n        android:layout_height=\"0dp\"\n\
  \        app:layout_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n\n</android.support.constraint.ConstraintLayout>\n```\n\n### 28.11\
  \ 加载手势\n\n现在手势文件已添加到项目中，下一步是编写代码以便在活动启动时加载该文件。对于本项目，实现此点的代码将添加到 `MainActivity.java`\
  \ 源文件的 `MainActivity` 类中，如下：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\
  import android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\nimport\
  \ android.gesture.GestureLibraries;\nimport android.gesture.GestureLibrary;\nimport\
  \ android.gesture.GestureOverlayView;\nimport android.gesture.GestureOverlayView.OnGesturePerformedListener;\n\
  \npublic class MainActivity extends AppCompatActivity\n    implements OnGesturePerformedListener\
  \ {\n    private GestureLibrary gLibrary;\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_custom_gestures);\n\
  \        gestureSetup();\n    }\n    private void gestureSetup() {\n        gLibrary\
  \ = GestureLibraries.fromRawResource(this,R.raw.gestures);\n        if (!gLibrary.load())\
  \ {\n            finish();\n        }\n    }\n}\n```\n\n除了一些必要的导入指令外，上述代码还创建了名为\
  \ `gLibrary` 的 `GestureLibrary` 实例。活动类也修改为实现 `GestureListener`（将在将在后续章节中创建）。\n\n\
  ### 28.12 注册事件监听器\n\n为了让活动接收用户在屏幕上执行手势的通知，有必要在 `gLayout` 视图上注册 `GestureListener`\
  \ 事件监听器，其引用可以通过 `findViewById` 方法获取，代码片段所示：\n\n```java\nprivate void gestureSetup()\
  \ {\n    gLibrary = GestureLibraries.fromRawResource(this,R.raw.gestures);\n   \
  \ if (!gLibrary.load()) {\n        finish();\n    }\n    GestureOverlayView gOverlay\
  \ = findViewById(R.id.gOverlay);\n    gOverlay.addOnGesturePerformedListener(this);\n\
  }\n```\n\n### 28.13 实现 onGesturePerformed 方法\n\n在对应用程序进行首次测试之前，最后只需实现 `onGesturePerformed`\
  \ 回调方法。这是当在 `GestureOverlayView` 实例上执行手势时将调用的方法：\n\n```java\n@Override\npublic void\
  \ onGesturePerformed(GestureOverlayView overlay, Gesture gesture) {\n    ArrayList<Prediction>\
  \ predictions = gLibrary.recognize(gesture);\n    if (predictions.size() > 0 &&\
  \ predictions.get(0).score > 1.0){\n        String action = predictions.get(0).name;\n\
  \        Toast.makeText(this, action, Toast.LENGTH_SHORT).show();\n    }\n}\n```\n\
  \n\n\n\n\n1. 声明一个新类，它实现了 `SimpleOnScaleGestureListener` 接口，包含了所需的 `onScale()`、`onScaleBegin()`\
  \ 和 `onScaleEnd()` 回调方法。\n\n2. 创建 `ScaleGestureDetector` 类的实例，并将步骤 1 中创建的类实例作为参数传递进去。\n\
  \n3. 在所属 Activity 中实现 `onTouchEvent()` 回调方法，该方法反过来调用 `ScaleGestureDetector` 类的 `onTouchEvent()`\
  \ 方法。\n\n\n\n\n在本章的剩余部分中，我们将创建一个非常简单的示例，用于演示缩放手势识别的实现。\n\n## 28.18 缩放手势示例项目\n\n\
  从欢迎界面选择 `Start a new Android Studio project` 快速启动选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择\
  \ `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `PinchExample` 并指定 `com.ebookfrenzy.pinchexample`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单改为 `Java`。\n\n在 `activity_main.xml` 文件中，选择默认的 `TextView` 对象并使用 `Attributes`\
  \ 工具窗口将 `ID` 设置为 `myTextView`。找到并将 `MainActivity.java` 文件加载到 Android Studio 编辑器中，并如下所示修改文件：\n\
  \n```java\npackage com.ebookfrenzy.pinchexample;\nimport android.support.v7.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.view.MotionEvent;\nimport android.view.ScaleGestureDetector;\n\
  import android.view.ScaleGestureDetector.SimpleOnScaleGestureListener;\nimport android.widget.TextView;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    TextView scaleText;\n\
  \    ScaleGestureDetector scaleGestureDetector;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_pinch_example);\n        scaleText = (TextView)findViewById(R.id.myTextView);\n\
  \        scaleGestureDetector = new ScaleGestureDetector(this, new MyOnScaleGestureListener());\n\
  \    }\n\n    @Override\n    public boolean onTouchEvent(MotionEvent event) {\n\
  \        scaleGestureDetector.onTouchEvent(event);\n        return true;\n    }\n\
  \n    public class MyOnScaleGestureListener extends SimpleOnScaleGestureListener\
  \ {\n        @Override\n        public boolean onScale(ScaleGestureDetector detector)\
  \ {\n            float scaleFactor = detector.getScaleFactor();\n            if\
  \ (scaleFactor > 1) {\n                scaleText.setText(\"Zooming Out\");\n   \
  \         } else {\n                scaleText.setText(\"Zooming In\");\n       \
  \     }\n            return true;\n        }\n\n        @Override\n        public\
  \ boolean onScaleBegin(ScaleGestureDetector detector) {\n            return true;\n\
  \        }\n\n        @Override\n        public void onScaleEnd(ScaleGestureDetector\
  \ detector) {\n        }\n    }\n}\n```\n\n该代码声明了一个名为 `MyOnScaleGestureListener`\
  \ 的新类，它继承了 Android 的 `SimpleOnScaleGestureListener` 类。此接口实现三个方法（`onScale()`、`onScaleBegin()`\
  \ 和 `onScaleEnd()`）。在此实例中，`onScale()` 方法识别缩放因子，并在文本视图上显示消息，指示检测到的缩放手势类型。\n\n在 `onCreate()`\
  \ 方法中，获取文本视图对象的引用并赋值给变量 `scaleText`。接下来，创建一个新的 `ScaleGestureDetector` 实例，并将包含它的活动引用和我们新类\
  \ `MyOnScaleGestureListener`实例作为参数传递。最后，为活动实现了一个 `onTouchEvent()` 回调方法，该方法简单地调用\
  \ `ScaleGestureDetector` 对象对应的 `onTouchEvent()` 方法，并将 `MotionEvent` 对象作为参数传递。\n\n\
  在模拟器或物理 Android 设备上编译并运行应用程序，并在屏幕上执行缩放手势，注意文本视图将根据缩放动作显示放大或缩小消息。在模拟器中可以通过按住 `Ctrl`（或\
  \ `Cmd`）键并点击拖动鼠标指针来模拟缩放手势，如图图 28-3 所示：![](img/image5332.jpg)\n\n图 28-3\n\n### 28.19\
  \ 总结\n\n手势本质上是触摸屏幕上接触点的运动，涉及一个或多个笔画，可以作为用户与应用程序之间的通信方法。Android 允许使用 `Gesture Builder`\
  \ 设计手势。一旦创建，手势就可以保存到手势文件中，并在应用程序运行时使用 `GestureLibrary` 加载到活动中。通过将透明的 `GestureOverlayView`\
  \ 类实例覆盖在现有视图上并实现 `OnGesturePerformedListener` 事件监听器，可以在显示区域上检测手势。使用 `GestureLibrary`\
  \ 可以生成用户执行的手势与存储在手势文件中的手势之间的匹配排序列表，并使用预测分数来决定手势是否足够匹配。\n\n缩放手势可以通过实现 `ScaleGestureDetector`\
  \ 类来检测，本章也提供了该类的示例。\n\n# 29. Android Fragment（片段）简介\n\n随着你对本书章节的不断学习，你会越来越明显，Android\
  \ 系统背后的许多设计概念其初衷都是为了促进构成应用程序的不同元素之间的复用和交互。本章将探讨的其中一个领域涉及 `Fragments`（片段）的使用。\n\n\
  本章将提供关于片段基础的概述，介绍它们是什么以及如何在应用程序中创建和使用它们。下一章将通过一个教程展示在 Android Studio 中开发应用程序时片段的运行情况，包括片段之间通信的实现。\n\
  \n### 29.1 什么是片段？\n\n片段是应用程序界面中自包含的、模块化的部分，是可以嵌入活动中的相应行为。片段可以在应用程序设计阶段组装，并在运行时添加到或从活动中移除以创建动态用户界面。\n\
  \n片段只能作为活动的一部分，不能作为独立元素实例化。尽管如此，片段可以被视为具有与活动相似生命周期的子活动”。片段以 XML 布局文件的形式存储，可以通过在活动布局文件中放置适当的\
  \ `<fragment>` 元素或通过活动类中的代码直接添加到活动。\n\n### 29.2 创建片段\n\n构成片段的两个组件是一个 XML 布局文件和一个\
  \ Java 类。片段的 XML 布局格式与其他任何布局相同，并包含任何视图组合。以下是 XML：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<RelativeLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:background=\"@color/red\">\n\n    <TextView\n        android:id=\"\
  @+id/textView\"\n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:text=\"Large\" />\n</RelativeLayout>\n```\n\n与布局对应的类必须是\
  \ Android `Fragment` 类的子类。该类至少应该重写 `onCreateView()` 方法。例如：\n\n```java\npackage com.example.fragmentdemo;\n\
  import android.os.Bundle;\nimport android.view.LayoutInflater;\nimport android.view.View;\n\
  import android.view.ViewGroup;\nimport android.support.v4.app.Fragment;\n\npublic\
  \ class FragmentOne extends Fragment {\n    @Override\n    public View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container, Bundle savedInstanceState) {\n        // 加载此片段的布局\n\
  \        return inflater.inflate(R.layout.fragment_one, container, false);\n   \
  \ }\n}\n```\n\n### 29.3 使用布局文件将片段添加到活动\n\n通过活动的 XML 布局文件添加片段的便利代价是无法在运行时移除片段。为了在运行时对片段进行完全动态控制，必须通过代码添加这些活动。\n\
  \n当使用代码管理片段时，片段本身仍然由 XML 布局文件和相应的类组成。区别在于在主机活动内部处理片段。使用代码向活动添加片段时有一系列标准步骤：\n\n\n\
  \n\n\n\n\n1. 创建片段类的一个实例。\n2. 将任何额外的意图（intent）参数传递给类实例。\n3. 获取片段管理器（fragment manager）实例的引用。\n\
  4. 在片段管理器实例上调用 `beginTransaction()` 方法。这将返回一个片段事务（fragment transaction）实例。\n5. 调用片段事务实例的\
  \ `add()` 方法，并将包含片段的视图资源 ID 和片段类实例作为参数传递进去。\n6. 调用片段事务的 `commit()` 方法。\n\n\n\n\n\
  # Android 中的 Fragment 管理\n\n例如，以下代码添加了 `FragmentOne` 类定义的 fragment，使其显示在 ID 为 `LinearLayout1:FragmentOne`\
  \ 的容器视图中：\n\n```java\nFragment firstFragment = new FragmentOne();\nfirstFragment.setArguments(getIntent().getExtras());\n\
  FragmentManager fragManager = getSupportFragmentManager();\nFragmentTransaction\
  \ transaction = fragManager.beginTransaction();\ntransaction.add(R.id.LinearLayout1,\
  \ firstFragment);\ntransaction.commit();\n```\n\n上述代码为了清晰起见将每个步骤拆分为单独语句。然而，最后四行可以缩写为单行代码，如下：\n\
  \n```java\ngetSupportFragmentManager().beginTransaction().add(R.id.LinearLayout1,\
  \ firstFragment).commit();\n```\n\n一旦添加到容器中，后续可以通过调用 fragment 事务实例的 `remove()` 方法将其移除，调用时传递要移除的\
  \ fragment 实例引用：\n\n```java\ntransaction.remove(firstFragment);\n```\n\n同样，可以通过调用\
  \ fragment 事务实例的 `replace()` 方法用另一个 fragment 替换它。该方法接收的参数是包含 fragment 的视图的 ID 以及新\
  \ fragment 的实例。被替换的 fragment 还可以放置在所谓的“回退栈”中，以便在用户导航返回时能够快速恢复。这是通过在调用 `commit()`\
  \ 方法之前调用 fragment 事务对象的 `addToBackStack()` 方法实现的：\n\n```java\nFragmentTwo secondFragment\
  \ = new FragmentTwo();\ntransaction.replace(R.id.LinearLayout1, secondFragment);\n\
  transaction.addToBackStack(null);\ntransaction.commit();\n```\n\n## 处理 Fragment\
  \ 事件\n\n如之前所述，fragment 非常别像一个子 activity，拥有它自己的布局、类和生命周期。fragment 内部的视图组件（如按钮和文本视图）能够像普通\
  \ activity 一样产生事件。这产生了一个问题：哪个类来接收来自 fragment 中视图的事件；是 fragment 本身，还是嵌入该 fragment\
  \ 的 activity？这个问题的答案取决于事件处理程序的声明方式。\n\n在名为“Android 事件处理概述与示例”的章节中，讨论了两种处理事件的方法。第一种涉及在\
  \ activity 代码中配置事件监听器和回调方法。例如：\n\n```java\nbutton.setOnClickListener(new Button.OnClickListener()\
  \ {\n    public void onClick(View v) {\n        // 点击按钮时要执行的代码\n    }\n});\n```\n\
  \n在拦截点击事件的情况下，第二种方法涉及在 XML 布局文件中设置 `android:onClick` 属性：\n\n```xml\n<Button\n  \
  \  android:id=\"@+id/button1\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:onClick=\"onClick\"\n    android:text=\"Click me\" />\n\
  ```\n\nfragment 中视图生成的事件的通用规则是：如果事件监听器是使用事件监听器和回调方法在 fragment 类中声明的，那么事件将首先由 fragment\
  \ 处理。然而，如果使用了 `android:onClick` 资源，事件将直接传递给包含该 fragment 的 activity。\n\n## 实现 Fragment\
  \ 通信\n\n一旦一个或多个 fragment 被嵌入到 activity 中，那么很有可能在 fragment 与 activity 之间、以及 fragment\
  \ 与 fragment 之间需要进行某种形式的通信。事实上，良好的实践要求 fragment 之间互不直接通信。所有通信都应该通过封装的 activity 进行。\n\
  \n为了让 activity 与 fragment 通信，activity 必须通过分配给它的 ID 识别 fragment 对象。一旦获得了该引用，activity\
  \ 就可以直接调用 fragment 对象的公共方法。\n\n反向通信（从 fragment 到 activity）则稍微复杂一些。首先，fragment 必须定义一个监听器接口，然后在\
  \ activity 类中实现该接口。例如，以下代码在名为 `ToolbarFragment` 的 fragment 类上声明了一个名为 `ToolbarListener`\
  \ 的接口：\n\n```java\npublic class ToolbarFragment extends Fragment {\n    ToolbarListener\
  \ activityCallback;\n    public interface ToolbarListener {\n        public void\
  \ onButtonClick(int position, String text);\n    }\n}\n```\n\n上述代码规定任何实现 `ToolbarListener`\
  \ 接口的类都必须实现名为 `onButtonClick` 的回调方法，该方法接受一个整数和一个 `String` 作为参数。\n\n接下来，需要重写并实现 fragment\
  \ 类的 `onAttach()` 方法。当 fragment 初始化并与 activity 关联时，Android 系统会自动调用此方法。该方法传递包含该 fragment\
  \ 的 activity 的引用。该方法必须存储此 activity 的本地引用，并验证它是否实现了 `ToolbarListener` 接口：\n\n```java\n\
  @Override\npublic void onAttach(Context context) {\n    super.onAttach(context);\n\
  \    try {\n        activityCallback = (ToolbarListener) activity;\n    } catch\
  \ (ClassCastException e) {\n        throw new ClassCastException(activity.toString()\
  \ + \" must implement ToolbarListener\");\n    }\n}\n```\n\n下一步是从 fragment 内部调用\
  \ activity 的回调方法。例如，以下代码在按钮被点击时调用 activity 上的回调方法：\n\n```java\npublic void buttonClicked(View\
  \ view) {\n    activityCallback.onButtonClick(arg1, arg2);\n}\n```\n\n剩下的只是修改 activity\
  \ 类使其实现 `ToolbarListener` 接口。例如：\n\n```java\npublic class MainActivity extends FragmentActivity\
  \ implements ToolbarFragment.ToolbarListener {\n    public void onButtonClick(String\
  \ arg1, int arg2) {\n        // 回调方法实现\n    }\n}\n```\n\n# 使用 Jetpack 构建现代 Android\
  \ 架构\n\n在此之前，Google 并没有推荐构建 Android 应用的具体方法，除了让开发者根据特定项目或个人风格做出决定。这种情况在 2017 年随着架构组件的引入发生了改变，这些组件在\
  \ 2018 年发布时成为了 Jetpack 的一部分。\n\n## 什么是 Android Jetpack\n\nJetpack 包含 Android Studio、支持库以及关于\
  \ Android 应用如何结构的指南。架构组件的设计旨在遵循最佳实践使开发变得更快、更简单。\n\n## ViewModel 组件\n\n`ViewModel`\
  \ 的目的是是将 UI 相关数据与视图层分离。这使得数据可以在配置更改（如旋转）中生存。\n\n## LiveData 组件\n\n`LiveData` 是一种允许值变为可观察的数据容器。简单来说，可观察对象能够在数据发生变化时通知其他对象。这使得当\
  \ `LiveData` 值变化时，UI 控制器可以接收通知。\n\n通过创建 `Observer` 类的实例并定义 `LiveData` 值变化时调用的 `onChange()`\
  \ 方法来设置观察者。一旦创建了 `Observer` 实例，通过调用 `LiveData` 对象的 `observe()` 方法将其附加：\n\n```java\n\
  viewModel.observe(this, new Observer<String>() {\n    @Override\n    public void\
  \ onChanged(String data) {\n        // 使用数据更新 UI\n    }\n});\n```\n\n## Android\
  \ 数据绑定概述\n\nAndroid Jetpack 包含绑定库，它可以将 ViewModel 中的数据直接映射到 XML 用户界面布局文件中的特定视图。这消除了对\
  \ `findViewById()` 调用和手动更新的需求。\n\n## 数据绑定布局\n\n数据绑定布局文件需要某种方式来声明与布局中视图绑定的项目类。这是通过使用\
  \ `<data>` 元素实现的：\n\n```xml\n<layout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <data>\n        <variable\n            name=\"viewModel\"\n            type=\"\
  com.ebookfrenzy.myapp.ui.main.MainViewModel\" />\n    </data>\n    <RelativeLayout\n\
  \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\">\n        <!-- 此处放置视图 -->\n    </RelativeLayout>\n</layout>\n```\n\
  \n\n\n\n\n```java\nmViewModel.getResult().observe(this, resultObserver);\n```\n\n\
  ```java\nconvertButton.setOnClickListener(new View.OnClickListener(){\n    @Override\n\
  \    public void onClick(View v) {\n```\n\n\n\n\n```java\nif (!dollarText.getText().toString().equals(\"\
  \")) {\n    mViewModel.setAmount(dollarText.getText().toString());\n} else {\n \
  \   resultText.setText(\"No Value\");\n}\n});}}}}\n```\n\n接下来，编辑 `MainViewModel.java`\
  \ 文件并继续按所示删除代码（注意 `dollarText` 变量到 `LiveData` 的转换）：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  import android.arch.lifecycle.MutableLiveData;\nimport android.arch.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ usd_to_eu_rate = 0.74F;\n    public MutableLiveData<String> dollarValue = new\
  \ MutableLiveData<>();\n    private String dollarText = \"\";\n    private public\
  \ MutableLiveData<Float> result = new MutableLiveData<>();\n\n    public void setAmount(String\
  \ value) {\n        this.dollarText = value;\n        result.setValue(Float.valueOf(dollarText)*usd_to_eu_rate);\n\
  \    }\n\n    public MutableLiveData<Float> getResult(){\n        return result;\n\
  \    }\n}\n```\n\n虽然我们在实现数据绑定（data binding）的过程中会添加一些额外的代码，但显然数据绑定显著减少了需要编写的代码量。\n\
  \n### 35.2 启用数据绑定\n\n使用数据绑定的第一步 Android Studio 项目中启用它。这涉及在 Module 级别的 `build.gradle`\
  \ 文件中添加新属性，因此打开此文件（`app` -> `Gradle Scripts` -> `build.gradle (Module: app)`），如图\
  \ 35-1 所示：![](img/image6453.jpg)\n图 35-1\n\n在 `build.gradle` 文件中，添加所示元素以在项目内启用数据绑定：\n\
  \n```gradle\napply plugin: 'com.android.application'\nandroid {\n    dataBinding\
  \ {\n        enabled = true\n    }\n    compileSdkVersion 28\n}\n```\n\n一旦添加了该项，编辑器屏幕顶部会出现一个黄色条，其中包含一个\
  \ `Sync Now` 链接。点击此链接以新的构建配置设置重新同步项目：![](img/image6469.jpg)\n图 35-2\n\n### 35.3\
  \ 添加布局元素\n\n正如“Android Jetpack Data Binding 概述” 中描述，为了能够使用数据绑定，布局层次结构必须有一个布局组件作为根视图。这需要对\
  \ `main_fragment.xml` 布局文件（`app` -> `res` -> `layout` -> `main_fragment.xml`）进行以下更改。在布局编辑器工具中打开此文件，切换到\
  \ Text 模式进行这些更改：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout\
  \ xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <android.support.constraint.ConstraintLayout\n\
  \        xmlns:android=\"http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n        xmlns:tools=\"http://schemas.android.com/tools\"\
  \n        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n        ..\n    </android.support.constraint.ConstraintLayout>\n</layout>\n```\n\
  \n完成这些更改后，切换回 Design 模式，注意新的根视图虽然在布局画布中不可见，但现在已列在组件树中，如图 35-3 所示：![](img/image6493.jpg)\n\
  图 35-3\n\n构建并运行应用，以验证布局元素的添加没有以任何方式改变用户界面的外观。\n\n### 35.4 在布局文件中添加数据元素\n\n将布局文件转换为数据绑定布局文件的下一步是添加数据元素。在本例中，布局将绑定到\
  \ `MainViewModel`，因此编辑 `main_fragment.xml` 文件按所示添加数据元素：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <data>\n        <variable name=\"myViewModel\" type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\"\
  \ />\n    </data>\n    <android.support.constraint.ConstraintLayout\n        android:id=\"\
  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n        ..\n \
  \   </android.support.constraint.ConstraintLayout>\n</layout>\n```\n\n再次构建并运行应用，以确保这些更改生效。\n\
  \n### 35.5 使用绑定类\n\n下一步是修改 `MainFragment.java` 文件中的代码以获取绑定类实例的引用。这最好通过重写 `onCreateView()`\
  \ 方法来实现：\n\n```java\nimport android.databinding.DataBindingUtil;\nimport com.ebookfrenzy.viewmodeldemo.databinding.MainFragmentBinding;\n\
  \npublic class MainFragment extends Fragment {\n    private MainViewModel mViewModel;\n\
  \    public MainFragmentBinding binding;\n\n    ..\n    @Nullable\n    @Override\n\
  \    public View onCreateView(@NonNull LayoutInflater inflater, @Nullable ViewGroup\
  \ container, @Nullable Bundle savedInstanceState) {\n        binding = DataBindingUtil.inflate(inflater,\
  \ R.layout.main_fragment, container, false);\n        binding.setLifecycleOwner(this);\n\
  \        return binding.getRoot();\n    }\n    return inflater.inflate(R.layout.main_fragment,\
  \ container, false);\n    ..\n```\n\n旧代码简单地膨胀了 `main_fragment.xml` 布局文件（换句话说包含了视图的所有布局）并返回了根视图的引用。数据绑定库包含一个特殊的方法，除了初始化\
  \ UI 外，还返回布局的实例。新代码调用此方法并存储绑定类的引用：`binding = DataBindingUtil.inflate(inflater, R.layout.main_fragment,\
  \ container, false);`。\n\n绑定对象只要 fragment 存在就需要留在内存中。为了确保在 fragment 销毁，当前 fragment\
  \ 被声明为生命周期所有者：`binding.setLifecycleOwner(this);`。\n\n尽管 `onCreateView()` 代码已重写，但返回布局根视图的基本要求没有改变。这可以通过调用绑定对象的\
  \ `getRoot()` 方法获得：`binding.getRoot();`。\n\n### 35.6 将 ViewModel 赋值给数据变量\n\n此时，数据绑定知道它将绑定到\
  \ `MainViewModel` 类型实例，但尚未连接到实际的 `MainViewModel` 对象。这需要将应用内使用的 `ViewModel` 实例赋值给布局中声明的\
  \ `viewModel` 变量。由于是在 `onActivityCreated()` 方法中获取 `ViewModel` 引用的，因此在这里进行赋值是合理的：\n\
  \n```java\nimport static com.ebookfrenzy.viewmodeldemo.BR.myViewModel;\n\n@Override\n\
  public void onActivityCreated(@Nullable Bundle savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n\
  \    mViewModel = ViewModelProviders.of(this).get(MainViewModel.class);\n    binding.setVariable(myViewModel,\
  \ mViewModel);\n}\n```\n\n完成这些更改后，下一步是在数据绑定布局的视图元素中插入绑定表达式。\n\n### 35.7 添加绑定表达式\n\
  \n第一个绑定表达式将 `resultText` TextView 绑定到模型中的值。编辑 `main_fragment.xml` 文件，找到 `resultText`\
  \ 元素并修改 `text` 属性如下：\n\n```xml\n<TextView\n    android:id=\"@+id/resultText\"\n\
  \    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"MainFragment\"\n    android:text='@{unbox(myViewModel.result)\
  \ == 0 ? \"Enter value\" : String.valueOf(unbox(myViewModel.result)) + \" euros\"\
  }'\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n该表达式首先检查结果是否为零，如果是，则向用户显示消息。然而，如果结果不是零，则将值转换为字符串并连接“euros”单词后再显示给用户。\n\
  \n结果值只需要单向绑定，因为布局不需要更新存储在 `ViewModel` 中的值。另一方面，`dollarValue` `EditText` 视图需要双向绑定，以便可以使用用户输入的值更新模型，并在生命周期事件（如设备旋转）期间视图中重新显示当前值。`dollarText`\
  \ 元素现在声明如下：\n\n```xml\n<EditText\n    android:id=\"@+id/dollarText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginTop=\"\
  96dp\"\n    android:ems=\"10\"\n    android:importantForAutofill=\"no\"\n    android:inputType=\"\
  numberDecimal\"\n    android:text=\"@={myViewModel.dollarValue}\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintHorizontal_bias=\"0.50\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n添加这些初始绑定表达式后，现在需要编写方法在用户点击\
  \ `Button` 小部件时执行转换。\n\n### 35.8 添加转换方法\n\n点击 Convert 按钮时，将调用 `ViewModel` 上的方法执行转换并将欧元值放入\
  \ `result` `LiveData` 变量中。现在在 `MainViewModel.java` 文件中添加此方法：\n\n```java\npublic\
  \ class MainViewModel extends ViewModel {\n    private static final Float usd_to_eu_rate\
  \ = 0.74F;\n    public MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    public MutableLiveData<Float> result = new MutableLiveData<>();\n\n    public\
  \ void convertValue() {\n        if ((dollarValue.getValue() != null) && (!dollarValue.getValue().equals(\"\
  \")) {\n            result.setValue(Float.valueOf(dollarValue.getValue())*usd_to_eu_rate);\n\
  \        } else {\n            result.setValue(0F);\n        }\n    }\n}\n```\n\n\
  注意，在没有有效美元值的情况下，零值会被赋值给 `LiveData` 变量。这确保了如果用户没有输入值，赋值给 `resultText` TextView 的绑定表达式将显示“Enter\
  \ value”消息。\n\n### 35.9 添加监听器绑定\n\n在测试项目之前的最后一步是在布局文件内的 `Button` 元素添加监听器绑定表达式，以便在点击按钮时调用\
  \ `convertValue()` 方法。再次以文本模式编辑 `main_fragment.xml` 文件，找到 `convertButton` 元素并按所示添加\
  \ `onClick` ：\n\n```xml\n<Button\n    android:id=\"@+id/convertButton\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginTop=\"\
  77dp\"\n    android:onClick=\"@{myViewModel.convertValue()}\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" /> />\n\n### 35.10 测试应用\n\n（注：提供的文本在 35.9 处突然中断，但结构遵循逻辑流）。\n\n## 生命周期感知\n\
  \n如果一个对象能够检测并响应生命周期状态的变化，则称它是生命感知的。某些 Android 组件（以 LiveData 为主例）已经是生命感知的。\n\n##\
  \ 生命周期所有者\n\n如果一个对象能够检测并响应生命周期状态的变化，则称它是生命感知的。某些 Android 组件（以 LiveData 为主例）已经是生命感知的。可以通过实现\
  \ `LifecycleObserver` 接口将任何类配置为生命感知。\n\n## 生命周期观察者\n\n生命感知知的组件可以观察生命所有者的状态。生命所有者实现\
  \ `LifecycleOwner` 接口并被分配一个 `Lifecycle` 对象。大多数 Android 组件（如 `Activity` 和 `Fragment`）都是生命所有者。自定义类也可以通过\
  \ `LifecycleRegistry` 类配置为生命所有者。例如：\n\n```java\npublic class SampleOwner implements\
  \ LifecycleOwner {\n    private LifecycleRegistry lifecycleRegistry;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        lifecycleRegistry = new LifecycleRegistry(this);\n    }\n\n    @NonNull\n\
  \    @Override\n    public Lifecycle getLifecycle() {\n        return lifecycleRegistry;\n\
  \    }\n}\n```\n\n除非生命所有者是生命感知组件的子类，否则它需要通过调用 `LifecycleRegistry` 的方法来触发状态更改。`markState()`\
  \ 方法用于触发状态更改，并传递新的状态值：\n\n```java\npublic void resuming() {\n    lifecycleRegistry.markState(Lifecycle.State.RESUMED);\n\
  }\n```\n\n上述调用也将导致相应的事件处理程序。或者，可以调用 `LifecycleRegistry handleLifecycleEvent()` 方法并传递要触发的生命事件。例如：\n\
  \n```java\nlifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n```\n\
  \n## 生命周期观察者\n\n为了让生命感知组件观察生命所有者的状态，它必须实现 `LifecycleObserver` 接口并包含它需要观察的生命事件处理器。\n\
  \n```java\npublic class SampleObserver implements LifecycleObserver {\n    // 生命周期事件方法\n\
  }\n```\n\n然后创建此观察者的实例并添加到 `Lifecycle` 对象维护的观察者列表中：\n\n```java\ngetLifecycle().addObserver(new\
  \ SampleObserver());\n```\n\n如果观察者不再需要跟踪生命周期状态，可以随时将其从 `Lifecycle` 对象中移除。图 36-1\
  \ 明了提供生命感知的关键元素之间的关系：![](img/image6673.jpg)\n图 36-1\n\n## 生命周期状态和事件\n\n当生命所有者的状态发生变化时，分配的\
  \ `Lifecycle` 对象将更新新状态。在任何给定时刻，生命所有者将处于以下五个状态之一：\n\n\n\n\n\n* `Lifecycle.State.INITIALIZED`\n\
  * `Lifecycle.State.CREATED`\n* `Lifecycle.State.STARTED`\n* `Lifecycle.State.RESUMED`\n\
  * `Lifecycle.State.DESTROYED`\n\n当组件在不同的状态之间切换时，`Lifecycle` 对象将会在已添加到列表的任何观察者上触发事件。生命周期观察者可以实现以下事件：\n\
  \n* `Lifecycle.Event.ON_CREATE`\n* `Lifecycle.Event.ON_START`\n* `Lifecycle.Event.ON_RESUME`\n\
  * `Lifecycle.Event.ON_PAUSE`\n* `Lifecycle.Event.ON_STOP`\n* `Lifecycle.Event.ON_DESTROY`\n\
  * `Lifecycle.Event.ON_ANY`\n\n\n\n\n注解用于 `observer` 类内部，用于将方法与生命周期事件关联。例如，以下代码配置了\
  \ `observer` 内部的一个方法，使其在响应 `ON_RESUME` 生命周期事件时被调用：\n\n```java\n@OnLifecycleEvent(Lifecycle.Event.ON_RESUME)\n\
  public void onResume() {\n    // 在响应状态更改为 RESUMED 时执行任务\n}\n```\n\n分配给 `ON_ANY`\
  \ 事件的方法将在所有生命周期事件发生时被。此类型事件的方法将传递一个生命周期所有者（lifecycle owner）的引用和一个事件对象，该对象可用于查找当前状态和事件类型。例如，以下方法提取了当前状态和事件的名称：\n\
  \n```java\n@OnLifecycleEvent(Lifecycle.Event.ON_ANY)\npublic void onAny(LifecycleOwner\
  \ owner, Lifecycle.Event event) {\n    String currentState = getLifecycle().getCurrentState().name();\n\
  \    String eventName = event.name();\n}\n```\n\n当所有者状态需要处于特定的生命周期级别时，也可以使用当前状态对象的\
  \ `isAtLeast()` 方法：\n\n```java\nif (getLifecycle().getCurrentState().isAtLeast(Lifecycle.State.STARTED))\
  \ {}\n```\n\n图 36-2 中的流程图说明了生命周期所有者的状态变化序列，以及在每个状态转换之间触发在观察者上的生命周期事件：\n\n![](img/image6722.jpg)\n\
  图 36-2\n\n## 36.5 总结\n本章介绍了生命周期感知的基础，以及包含在 Android Jetpack 中的 Android `Lifecycle`\
  \ 软件包的类和接口。该包包含许多用于用于创建生命周期所有者（lifecycle owners）、生命周期观察者（lifecycle observers）和生命周期感知组件的类和接口。生命周期所有者被分配了一个\
  \ `Lifecycle` 对象，该对象维护了所有者状态的记录和订阅的观察者列表。当所有者的状态发生变化时，会通过生命周期事件方法通知观察者，以便对更改做出响应。\n\
  \n下一章将创建一个 Android Studio 项目，演示如何使用和创建生命周期感知组件，包括生命周期观察者和所有者的创建，以及生命周期状态更改和事件的处理。\n\
  \n## 37. Android Jetpack 生命周期感知感知教程\n上一章提供了生命周期感知的概述，并概述了在 Android 应用项目中实现此点的关键类和接口。本章将在此知识的基础上，通过构建一个\
  \ Android Studio 项目，旨在突出展示实际运行中的生命周期感知。\n\n### 37.1 创建示例生命周期项目\n从欢迎界面选择 `Start a\
  \ new Android Studio project`（启动一个新的 Android Studio 项目）快速启动选项，在生成的新项目对话框中，点击 `Next`（下一步）按钮之前选择\
  \ `Add No Activity` 模板。\n\n在 `Name` 字段输入 `LifecycleDemo` 并指定 `com.ebookfrenzy.lifecycledemo`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 26`：Android\
  \ 8.0 (Oreo)，并将 `Language`（语言）菜单更改为 `Java`。\n\n在 `Project` 工具窗口中找到 `app` -> `java`\
  \ -> `com.ebookfrenzy.lifecycledemo` 条目，右键点击它，并在弹出的菜单中选择 `New` -> `Activity` ->\
  \ `Fragment + ViewModel`。在 `New Android Activity` 对话框中，启用 `Launcher Activity`（启动活动）选项，将源语言更改为\
  \ `Java` 并点击 `Finish` 按钮创建活动类，其余字段将设置为默认值。\n\n### 37.2 创建生命周期观察者\n如之前讨论的，活动和 fragment\
  \ 已经实现了 `LifecycleOwner` 接口，并准备好被其他对象观察。为了在实践中看到这一点，教程的下一步是向项目添加一个新类，该类能够观察 `MainFragment`\
  \ 实例。\n\n要添加新类，在 `Project` 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.lifecycledemo`，从弹出菜单中选择\
  \ `New` -> `Java Class...`。在 `Create New Class` 对话框中将类命名为 `DemoObserver` 并点击 `OK`\
  \ 按钮创建 `DemoObserver.java` 文件。新文件应自动在编辑器中打开，其内容如下：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\
  public class DemoObserver {}\n```\n\n留在编辑器中，修改类文件以声明它将实现 `LifecycleObserver` 接口：\n\
  \n```java\npackage com.ebookfrenzy.lifecycledemo;\nimport android.arch.lifecycle.LifecycleObserver;\n\
  public class DemoObserver implements LifecycleObserver {}\n```\n\n下一步是添加生命周期方法并将它们分配为生命周期事件处理器。在本例示例中，所有事件都将被处理，每个事件都会向\
  \ Logcat 面板输出显示事件类型的消息。按照以下说明更新观察者类：\n\n```java\npackage com.ebookrenzy.lifecycledemo;\n\
  import android.util.Log;\nimport android.arch.lifecycle.Lifecycle;\nimport android.arch.lifecycle.LifecycleObserver;\n\
  import android.arch.lifecycle.LifecycleOwner;\nimport android.arch.lifecycle.OnLifecycleEvent;\n\
  public class DemoObserver implements LifecycleObserver {\n    private String LOG_TAG\
  \ = \"DemoObserver\";\n    @OnLifecycleEvent(Lifecycle.Event.ON_RESUME)\n    public\
  \ void onResume() {\n        Log.i(LOG_TAG, \"onResume\");\n    }\n    @OnLifecycleEvent(Lifecycle.Event.ON_PAUSE)\n\
  \    public void onPause() {\n        Log.i(LOG_TAG, \"onPause\");\n    }\n    @OnLifecycleEvent(Lifecycle.Event.ON_CREATE)\n\
  \    public void onCreate() {\n        Log.i(LOG_TAG, \"onCreate\");\n    }\n  \
  \  @OnLifecycleEvent(Lifecycle.Event.ON_START)\n    public void onStart() {\n  \
  \      Log.i(LOG_TAG, \"onStart\");\n    }\n    @OnLifecycleEvent(Lifecycle.Event.ON_STOP)\n\
  \    public void onStop() {\n        Log.i(LOG_TAG, \"onStop\");\n    }\n    @OnLifecycleEvent(Lifecycle.Event.ON_DESTROY)\n\
  \    public void onDestroy() {\n        Log.i(LOG_TAG, \"onDestroy\");\n    }\n\
  ```\n\n为了能够跟踪与 fragment 当前状态状态的事件，还将添加一个 `ON_ANY` 事件处理器。由于此方法传递了生命周期所有者的引用，可以添加代码来获取当前状态。在\
  \ `DemoObserver.java` 文件中添加以下方法：\n\n```java\n@OnLifecycleEvent(Lifecycle.Event.ON_ANY)\n\
  public void onAny(LifecycleOwner owner, Lifecycle.Event event) {\n    Log.i(LOG_TAG,\
  \ owner.getLifecycle().getCurrentState().name());\n}\n```\n\n完成 `DemoObserver` 类后，下一步将其作为观察者添加到\
  \ `MainFragment` 类。\n\n### 37.3 添加观察者\n观察者通过调用所有者 `Lifecycle` 对象的 `addObserver()`\
  \ 方法添加，该对象的引用通过 `getLifecycle()` 方法获取。编辑 `MainFragment.java` 类并在 `onActivityCreated()`\
  \ 方法中添加代码以添加观察者：\n\n```java\nimport com.ebookrenzy.lifecycledemo.DemoObserver;\n\
  @Override\npublic void onActivityCreated(@Nullable Bundle savedInstanceState) {\n\
  \    super.onActivityCreated(savedInstanceState);\n    mViewModel = ViewModelProviders.of(this).get(MainViewModel.class);\n\
  \    getLifecycle().addObserver(new DemoObserver());\n}\n```\n\n观察者创建并添加到所有者的 `Lifecycle`\
  \ 对象后，应用就可以进行测试了。\n\n### 37.4 测试观察者\n由于 `DemoObserver` 类输出诊断信息到 Logcat 控制台，如果配置过滤器仅显示\
  \ `DemoObserver` 消息，查看输出将变得更容易。使用之前在 Android Activity State Changes 中概述的步骤，在设备或模拟器上运行应用之前配置与\
  \ `DemoObserver` 相关的过滤器。\n\n应用成功启动后，Logcat 输出指示以下生命周期更改和事件：\n\n```\nonCreateCREATED\
  \ STARTEDRESUMED\n```\n\n在应用运行时，执行设备旋转以触发 fragment 的销毁和重建，产生额外的输出：\n\n```\nonStopCREATEDDESTROYED\n\
  onCreateCREATED STARTEDRESUMED\n```\n\n在移动本章的下一节之前，花些时间将应用的输出与图 36-2 中的流程图进行比较。\n\
  \n### 37.5 创建生命周期所有者\n本章的最后一个任务是创建一个自定义生命周期所有者类，并演示如何在类内部触发事件并修改生命周期状态。在 `Project`\
  \ 工具窗口中右键点击 `app` -> `java` -> `com.ebookrenzy.lifecycledemo` 条目，选择 `New` -> `Java\
  \ Class...` 菜单选项。在 `Create Class` 对话框中点击 `OK` 按钮之前将类命名为 `DemoOwner`。将新的 `DemoOwner.java`\
  \ 文件加载到代码编辑器中，对其进行如下修改：\n\n```java\npackage com.ebookrenzy.lifecycledemo;\nimport\
  \ android.arch.lifecycle.Lifecycle;\nimport android.arch.lifecycle.LifecycleOwner;\n\
  import android.arch.lifecycle.LifecycleRegistry;\npublic class DemoOwner implements\
  \ LifecycleOwner {}\n```\n\n该类需要一个用引用初始化的 `LifecycleRegistry` 实例，以及一个配置为返回 `LifecycleRegistry`\
  \ 实例的 `getLifecycle()` 方法。声明一个变量来存储 `LifecycleRegistry` 引用、初始化 `LifecycleRegistry`\
  \ 实例的构造函数并添加 `getLifecycle()` 方法：\n\n```java\npublic class DemoOwner implements\
  \ LifecycleOwner {\n    private LifecycleRegistry lifecycleRegistry;\n    public\
  \ DemoOwner() {\n        lifecycleRegistry = new LifecycleRegistry(this);\n    }\n\
  \    @Override\n    public Lifecycle getLifecycle() {\n        return lifecycleRegistry;\n\
  \    }\n}\n```\n\n接下来，该类需要通知注册表生命周期状态更改。这可以通过使用 `LifecycleRegistry` 对象的 `markState()`\
  \ 方法标记状态，或者通过使用 `handleLifecycleEvent()` 方法触发生命周期事件来实现。在自定义类中什么构成状态更改取决于类的用途。对于此示例，我们将添加一些在调用时简单触发生命周期事件的方法：\n\
  \n```java\nprivate LifecycleRegistry lifecycleRegistry;\npublic void startOwner()\
  \ {\n    lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n}\n\
  public void stopOwner() {\n    lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_STOP);\n\
  }\n@Override\npublic Lifecycle getLifecycle() {\n    return lifecycleRegistry;\n\
  }\n```\n\n`DemoOwner` 类中的最终更改是将 `DemoObserver` 类作为观察者添加。此调用构造函数内进行：\n\n```java\n\
  public DemoOwner() {\n    lifecycleRegistry = new LifecycleRegistry(this);\n   \
  \ getLifecycle().addObserver(new DemoObserver());\n}\n```\n\n加载 `MainFragment.java`\
  \ 文件，找到 `onActivityCreated()` 方法并添加代码创建 `DemoOwner` 实例并调用 `startOwner()` 方法。注意，作为观察者的\
  \ `DemoObserver` 调用已被移除。\n\n```java\nimport com.ebookrenzy.lifecycledemo.DemoOwner;\n\
  private DemoOwner demoOwner;\n@Override\npublic void onActivityCreated(Nullable\
  \ Bundle savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n\
  \    mViewModel = ViewModelProviders.of(this).get(MainViewModel.class);\n    demoOwner\
  \ = new DemoOwner();\n    demoOwner.startOwner();\n}\n```\n\n### 37.6 测试所有者\n最后一次构建并运行应用，查看\
  \ Logcat 窗口以确认检测到了 `create`、`start` 和 `stop` 事件：\n\n```\nCREATED STARTEDonStopCREATED\n\
  ```\n注意，尽管没有在 `DemoOwner` 类中手动添加代码，“created”状态更改被触发了。\n\n### 37.7 总结\n本章提供了在 Android\
  \ 应用中实现生命周期感知的步骤演示。这包括生命周期观察者的创建以及基础生命周期所有者的设计和实现。\n\n## 38. 导航架构概述\n如今很少有 Android\
  \ 应用只有一个屏幕。事实上，大多数应用包含通过手势、按钮点击和菜单选择导航的多个屏幕。在 Android Jetpack 之前，应用内导航的实现很大程度上是一个手动过程，没有简单的方法来查看和组织复杂的导航路径。然而，随着\
  \ Android Architecture 组件的引入以及 Android Studio 对导航图的支持，这种情况得到了极大改善。\n\n### 38.1 理解导航\n\
  每个应用都有在应用启动和任何启动屏出现后的主屏幕（应用加载时临时显示的启动屏）。从这个主屏幕，用户通常将执行导致其他屏幕的任务。这些屏幕通常是应用内的其他活动和\
  \ fragment。例如，一个消息应用可能有一个列出当前消息的主屏幕，用户可以那里导航到联系人列表或设置屏幕。联系人列表可以让用户导航到添加新用户或更新现有联系人的屏幕。在视觉上，应用的导航图可能如图\
  \ 38-1 所示：\n\n![](img/image6909.jpg)\n图 38-1\n\n构成应用的每个屏幕（包括主屏幕）被称为目的地，通常是一个 fragment\
  \ 或活动。Android 导航架构使用导航栈来跟踪用户在应用内目的地之间的路径。当应用首次启动时，主屏幕是第一个放入栈的目的地并成为当前目的地。当用户导航到另一个目的地时，该屏幕成为当前目的地并推入主目的地上方。当用户导航到其他屏幕时，它们也被推入栈中。图\
  \ 38-2 显示了用户启动应用并导航到“添加联系人”屏幕后导航栈的当前状态：\n\n![](img/image6915.jpg)\n图 38-2\n\n当用户使用系统返回键返回屏幕时，每个目的地都会从栈中弹出，直到主屏幕再次成为栈上的唯一目的地。在图\
  \ 38-3 中，用户从添加联系人屏幕返回，将其从栈中弹出并将联系人列表屏幕变为当前目的地：\n\n![](img/image6921.jpg)\n图 38-3\n\
  \n目的地导航和管理导航栈的所有工作都由 `NavController` 类表示的导航控制器处理。使用 Navigation Architecture 组件向\
  \ Android 项目添加导航是一个简单的过程，涉及导航主机、导航图、导航操作以及极少的代码编写以获取导航控制器的引用并与其交互。\n\n### 38.2 声明导航主机\n\
  导航主机一个特殊的 fragment（`NavHostFragment`），它被嵌入活动的用户界面布局中，作为用户导航的目的地的占位符。图 38-4 显示了一个典型的活动屏幕并突出了由导航主机\
  \ fragment 表示的区域：\n\n![](img/image6930.jpg)\n图 38-4\n\n可以将 `NavHostFragment` 放入\
  \ Android Studio 布局编辑器中的活动布局中，可以通过从调色板的 Containers 部分拖放实例，也可以通过手动编辑 XML 如下所示：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<FrameLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android/tools\"\n    android:id=\"@+id/container\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <fragment\n        android:id=\"@+id/demo_host_fragment\"\
  \n        name=\"androidx.navigation.fragment.NavHostFragment\"\n        android:layout_width=\"\
  match_parent\"\n        android:layout_height=\"match_parent\"\n        app:defaultHost=\"\
  true\"\n        app:navGraph=\"@navigation/navigation_graph\" />\n</FrameLayout>\n\
  ```\n\n主机元素中注意的点是 `name` 属性的 `NavHostFragment` 引用、`defaultHost` 设置为 `true` 以及 `navGraph`\
  \ 属性的赋值。当活动启动时，此主机 fragment 被图表中指定的目的地所替换。当用户导航应用时，主机 fragment 被相应的目的地所替换。\n\n###\
  \ 38.3 导航图\n导航图是一个 XML 文件，包含了包含在应用中的目的地。这些目的地外，文件还包含定义目的地之间导航的操作，以及从一个目的地传递到另一个目的地的可选参数。Android\
  \ Studio 包含一个导航图编辑器，可以使用可视化方式或手动编辑 XML 来设计图表。图 38-5 显示了设计模式下的导航图：\n\n![](img/image6957.jpg)\n\
  图 38-5\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android/tools\"\n    android:id=\"@+id/navigation_graph\"\
  \n    app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        name=\"com.ebookrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"main_fragment\"\n        tools:layout=\"@layout/main_fragment\"\
  >\n        <action\n            android:id=\"@+id/mainToSecond\"\n            app:destination=\"\
  @id/secondFragment\" />\n    </fragment>\n    <fragment\n        android:id=\"@+id/secondFragment\"\
  \n        name=\"com.ebookrenzy.navigationdemo.SecondFragment\"\n        android:label=\"\
  fragment_second\"\n        tools:layout=\"@layout/fragment_second\" />\n</navigation>\n\
  ```\n\n如果需要，导航图也可以拆分为多个文件以改进组织并促进重用。通过这种结构方式，嵌套图被嵌入到根图中。要创建嵌套图，只需 shift 点击要嵌套的目的地，右键点击第一个目的地并选择\
  \ `Move to Nested Graph` -> `New Graph` 选项。嵌套图将作为图中的新节点出现。要访问嵌套图，只需双击嵌套图节点将图文件加载到编辑器。\n\
  \n### 38.4 获取导航控制器\n从一个目的地导航到另一个通常响应应用内的某种事件，例如按钮点击或菜单选择。在触发导航操作之前，代码必须获取导航控制器的实例引用。这需要调用\
  \ `Navigation` 或 `NavHostFragment` 类的 `findNavController()` 方法。例如，可以使用以下代码访问活动的导航控制器：\n\
  \n```java\nNavController controller = Navigation.findNavController(activity, R.id.demo_nav_host_fragment);\n\
  ```\n\n在这种情况下，方法调用传递了活动的引用和嵌入活动布局的 `NavHostFragment` 的 `id`。或者，与任何视图相关的导航控制器可以通过将该视图传递给方法来标识：\n\
  \n```java\nButton button = getView().findViewById(R.id.button);\nNavController controller\
  \ = Navigation.findNavController(button);\n```\n\n最后的选项是通过调用 `NavHostFragment` 类的\
  \ `findNavController()` 方法来查找 fragment 的导航控制器，传递 fragment 的引用：\n\n```java\nNavController\
  \ controller = NavHostFragment.findNavController(fragment);\n```\n\n### 38.5 触发导航操作\n\
  一旦找到导航控制器，通过调用控制器的 `navigate()` 方法并传递要执行的操作资源 ID 来触发导航操作。例如：\n\n```java\ncontroller.navigate(R.id.goToContacts);\n\
  ```\n\n当选择操作连接时，图编辑器的 `Attributes` 面板定义了操作的 `id`。\n\n### 38.6 传递参数\n在导航操作期间，可以使用图文件中声明的参数将数据从一个目的地传递到另一个。参数由名称、类型和可选的默认值组成，可以在\
  \ XML 中手动添加，也可以在选择操作或目的地时使用 `Attributes` 面板。例如，图 38-6 中声明了一个名为 `contactsCount` 的整数参数，默认值为\
  \ 0：\n\n![](img/image7004.jpg)\n图 38-6\n\n一旦添加，参数放置在接收目的地的 XML 元素中，例如：\n\n```xml\n\
  <fragment\n    android:id=\"@+id/secondFragment\"\n    name=\"com.ebookrenzy.navigationdemo.SecondFragment\"\
  \n    android:label=\"fragment_second\"\n    tools:layout=\"@layout/fragment_second\"\
  >\n    <argument\n        android:name=\"contactsCount\"\n        android:defaultValue=\"\
  0\"\n        app:type=\"integer\" />\n</fragment>\n```\n\nNavigation Architecture\
  \ 组件提供了在目的地之间传递数据的技术。一种方法是将数据放入 `Bundle` 对象并在操作期间传递到目的地。这种方法的主要缺点是不是“类型安全的”。也就是说，如果接收目的地将参数视为与声明不同的类型（例如将字符串视为整数），编译器不会捕获此错误，可能会在运行时产生问题。更好的选项是使用\
  \ `safeargs`。`safeargs` 是 Android 构建系统的一个插件，它允许以类型安全的方式传递参数。下一章将描述并演示 `safeargs`\
  \ 参数传递方法（Android Jetpack NavigationR2QDSlRad3lJQMA20）。\n\n### 38.7 总结\n在 Android\
  \ 应用的上下文中，“导航”是指用户在不同屏幕之间移动的能力。一旦耗时实现且难以组织，Android Studio 和 Navigation Architecture\
  \ 组件使得在应用内实现导航变得更容易。应用内的不同屏幕被称为目的地，通常由 fragment 或活动表示。所有应用都有在应用首次加载时显示的主屏幕。此布局的内容区域被导航主机\
  \ fragment 替换，并在用户导航时交换其他目的地。导航路径由导航图文件定义，由连接它们的目的地和操作组成。导航由导航控制器处理，除了管理导航栈外，还提供了从应用内部启动导航操作的方法。\n\
  \n## 39. Android Jetpack Navigation 组件教程\n上一章描述了 Android Jetpack Navigation 组件以及它如何与\
  \ Android Studio 的绘图功能集成，为应用屏幕之间的导航提供简单的方法。在本章将创建一个 Android Studio 项目，利用这些导航功能实现一个包含多个屏幕的简单应用。除了演示\
  \ Android 导航图编辑器外，示例项目还将使用类型安全的参数在源和目的地之间传递数据。\n\n### 39.1 创建导航项目\n从欢迎界面选择 `Start\
  \ a new Android Studio project` 快速启动选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Add No Activity`\
  \ 模板。\n\n在 `Name` 字段输入 `NavigationDemo` 并指定 `com.ebookfrenzy.navigationdemo` 为包名。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26`：Android 8.0 (Oreo)，并将 `Language`\
  \ 菜单更改为 `Java`。\n\n在 `Project` 工具窗口中找到 `app` -> `java` -> `com.ebookrenzy.navigationdemo`\
  \ 条目，右键点击它并选择 `New` -> `Activity` -> `Fragment + ViewModel`。在 `New Android Activity`\
  \ 对话框中，启用 `Launcher Activity` 选项，将源语言更改为 `Java` 并点击 `Finish` 按钮创建活动类，其余字段将设置为默认值。\n\
  \n### 39.2 在构建配置中添加导航\n新的 Android Studio 项目默认不会在构建文件中包含导航组件库。因此，在执行任何其他任务之前，第一步是修改应用级的\
  \ `build.gradle` 文件。在项目工具窗口找到该文件（`Gradle Scripts` -> `build.gradle (Module: app)`），双击它将其加载到代码编辑器中，并修改\
  \ `dependencies` 部分以添加导航库：\n\n```gradle\ndependencies {\n    implementation \"android.arch.navigation:navigation-fragment:1.0.0-alpha07\"\
  \n    implementation \"android.arch.navigation:navigation-ui:1.0.0-alpha07\"\n}\n\
  ```\n\n注意自本书出版以来可能发布了这些库的新版本。要查找最新版本，请参考以下 URL：https://developer.android.com/topic/libraries/architecture/adding-components#navigation\n\
  \n在文件中添加导航依赖后，点击 `Sync Now` 链接重新同步项目的构建配置。\n\n### 39.3 创建导航图资源文件\n在构建配置中添加导航库后，现在可以将导航图资源文件添加到项目中了。如\
  \ Navigation Architecture 组件的概述\n图 39-1\n\n选择菜单项后，会出现 `New Resource File` 对话框。在此对话框中，将文件命名为\
  \ `navigation_graph`并将 `Resource type` 设置为 `Navigation`，如图 39-2 所示，在点击 `OK` 按钮之前创建文件。如果\
  \ `Navigation` 类型不可用，选择 `File` -> `Settings`（macOS 为 `Preferences`），显示屏幕并开启 `Enable\
  \ Navigation Editor` 选项。\n\n![](img/image7059.jpg)\n图 39-2\n\n导航图资源文件添加到项目后，它将出现在\
  \ `main` 面板中，准备好新的目的地。将编辑器切换到 `Text` 模式并在添加任何目的地之前查看 XML：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android/tools\"\n    android:id=\"@+id/navigation_graph\"></navigation>\n\
  ```\n\n切换回编辑器的 `Design` 模式，注意 `Destinations` 面板显示项目内没有主机 fragment：\n\nimage7071.jpg)\n\
  图 39-3\n\n### 39.4 声明导航主机\n对于此项目，导航主机 fragment 将包含在活动的用户界面布局中。这意味着导航图中的目的地将出现在位于\
  \ `main_activity.xml` 的区域。在 `Project` 工具窗口中找到活动布局文件（`app` -> `res` -> `layout` ->\
  \ `main_activity.xml`）并将其加载到布局编辑器。\n\n在布局编辑器的 `Design` 模式下，从 `Palette` 的 `Containers`\
  \ 部分拖入 `NavHostFragment` 元素，将其放置到活动布局的 `container` 区域，如[图 39-4]所示：\n\nimage7080.jpg)\n\
  图 39-4\n\n选择菜单项后，会出现 `New Resource File` 对话框。在此对话框中，将文件命名为 `navigation_graph` 并将\
  \ `Resource type` 设置为 `Navigation`，如图 39-2 所示，在点击 `OK` 按钮之前创建文件。如果 `Navigation`\
  \ 类型不可用，选择 `File` -> `Settings`（macOS 为 `Preferences`），显示屏幕并开启 `Enable Navigation\
  \ Editor` 选项。\n\nimage7059.jpg)\n图 39-2\n\n在导航图资源文件添加到项目后，它将出现在 `main` 面板中，准备好新的目的地。将编辑器切换到\
  \ `Text` 模式并在添加任何目的地之前查看 XML：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\n \
  \   xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android/tools\"\
  \n    android:id=\"@+id/navigation_graph\"></navigation>\n```\n\n切换回编辑器的 `Design`\
  \ 模式，注意 `Destinations` 面板显示项目内没有主机 fragment：\n\nimage7071.jpg)\n图 39-3\n\n### 39.5\
