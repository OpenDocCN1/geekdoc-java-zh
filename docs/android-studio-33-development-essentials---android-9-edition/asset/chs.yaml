  fragment_second\"\n        tools:layout=\"@layout/fragment_second\" />\n</navigation>\n\
  ```\n\n如果需要，导航图也可以拆分为多个文件以改进组织并促进重用。通过这种结构方式，嵌套图被嵌入到根图中。要创建嵌套图，只需 shift 点击要嵌套的目的地，右键点击第一个目的地并选择\
