  在配置好的模拟器上编译并运行应用程序。根据显示大小，应用程序将以双窗格模式出现。无论如何，主列表应该显示定义的网站名称。选择项目应导致相应的网站出现在详情窗中，如图\
  \ 51-5 所示![](img/image984.jpg)\n图 51-5\n\n## 51.11 总结\n主/详情用户界面由项目主列表组成，选择项目时会在详情窗中显示额外信息。Android\
  \ 提供的主/详情流模板允许快速创建这种主/详情布局。如本章所示，通过对默认文件进行细微修改，可以用极少的代码和设计实现广泛的主/详情功能。\n\n## 2 Android\
  \ Intent 概述\n到本书的这一阶段，应该清楚 Android 应用程序由一个或多个 activity 。尚未详细介绍的领域是 activity 触发另一个\
  \ activity 的机制。在“Android 应用程序结构”章节中简要概述了这一点主要是通过使用 `Intent` 实现的。在后续章节中基于 Android\
  \ Studio 实现意图之前，本章的目标是以显式和隐式意图的形式提供意图概述并介绍意图过滤器。\n\n### 2.1 Intent 概述\nIntent（`android.content.Intent`）是\
  \ activity 启动另一个 activity 的消息系统。例如，一个 activity 可以发布意图请求启动同一应用程序内的另一个 activity。然而，Intent\
  \ 还扩展了这一概念，允许 activity 请求设备上任何其他已注册 activity 的服务。例如，考虑应用程序内一个需要加载并向用户显示网页的 activity。与其包含第二个\
  \ activity 来执行此任务，代码只需发送一个意图请求任何 activity。运行时系统会将请求与设备上的可用 activity 进行匹配，启动匹配的 activity，或者在有多个匹配时允许用户决定使用哪个。\n\
  \nIntent 还允许数据从发送 activity 传输到接收 activity。在之前概述的场景中，发送 activity 需要将要显示的网页 URL 发送到第二个\
  \ activity。同样，接收 activity 也可以配置为完成所需任务后向发送 activity 返回数据。虽然后续章节才会介绍，但值得强调的是，意图除了启动\
  \ activity，还用于启动和与服务以及广播接收通信。Intent 分显式或隐式。\n\n### 2.2 显式意图（Explicit Intent）\n显式意图通过引用目标\
  \ activity 的组件名称（实际上是类名）请求启动特定的 activity。这种方法在启动与发送 activity 位于同一应用程序的 activity\
  \ 时常见（因为开发者知道类名）。\n\n显式意图通过创建 `Intent` 类的实例，传递 activity 环境和要启动的 activity 组件名称来发布。然后调用\
  \ `startActivity()` 方法，并将意图对象作为参数传递。例如，以下代码段发布了启动类名为 `ActivityB` 的 activity 的意图：\n\
  \n```java\nIntent i = new Intent(this, ActivityB.class);\nstartActivity(i);\n```\n\
  在启动之前，通过调用意图对象的 `putExtra()` 方法将数据传输到接收 activity。数据必须以键值对的形式添加。以下代码扩展了之前的示例，分别向意图添加键为\
  \ `myString` 和 `myInt` 的字符串和整数值：\n\n```java\nIntent i = new Intent(this, ActivityB.class);\n\
  i.putExtra(\"myString\", \"This is a message for ActivityB\");\ni.putExtra(\"myInt\"\
  , 100);\nstartActivity(i);\n```\n数据作为 `Bundle` 对象的一部分被目标 activity 接收，可以通过 `getIntent().getExtras()`\
  \ 获取。`Activity` 类的 `getIntent()` 方法返回启动该 activity 的意图，而 `Intent` 类的 `getExtras()`\
  \ 方法返回数据。\n\n```java\nBundle extras = getIntent().getExtras();\nif (extras != null)\
  \ {\n    String myString = extras.getString(\"myString\");\n    int myInt = extras.getInt(\"\
  myInt\");\n}\n```\n当使用意图启动同一应用程序内的 activity 时，将这些 activity 在 manifest 中列出是至关重要的。以下\
  \ `AndroidManifest.xml` 内容正确配置了包含 `ActivityA` 和 `ActivityB` 的应用程序：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.intent\">\n    <application\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\">\n        <activity\n\
  \            android:label=\"@string/app_name\"\n            android:name=\".MainActivity\"\
  >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n        <activity android:name=\"\
  .ActivityB\"/>\n    </application>\n</manifest>\n```\n\n### 2.3 从 Activity 返回数据（Returning\
  \ Data from an Activity）\n如上一节所示，当数据传输到 `ActivityB` 时，没有方法将数据返回给第一个 activity（我们称为\
  \ `ActivityA`）。然而，可以通过启动 `ActivityB` 作为子 activity 实现。通过调用 `startForResult()` 方法而不是\
  \ `startActivity()` 来启动子 activity。此方法还传递了一个请求代码。为了返回数据，子 activity 必须实现 `finish()`\
  \ 方法，其目的是创建一个数据的新 intent。结果代码通常是 `RESULT_OK`，但也可以取决于开发者。\n\n```java\npublic void\
  \ finish() {\n    Intent data = new Intent();\n    data.putExtra(\"returnString\"\
  , \"Message to parent activity\");\n    setResult(RESULT_OK, data);\n    super.finish();\n\
  }\n```\n为了获取并提取返回的数据，父 activity 必须实现 `onActivityResult()` 方法，例如：\n\n```java\nprotected\
  \ void onActivityResult(int requestCode, int resultCode, Intent data) {\n    String\
  \ returnString;\n    if (requestCode == REQUEST_CODE && resultCode == RESULT_OK)\
  \ {\n        returnString = data.getExtras().getString(\"returnString\");\n    }\n\
  }\n```\n\n### 2.4 隐式意图（Implicit Intent）\n与引用启动 activity 的类名的显式意图不同，隐式意图通过指定要执行的操作和接收\
  \ activity 处理的数据类型来识别要启动的 activity。例如，`ACTION_VIEW` 操作类型配合 URI 对象形式的网页 URL 将指示 Android\
  \ 系统搜索并随后启动能够浏览器的 activity。以下隐式意图在 Android 设备上执行时，将导致指定的网页出现在浏览器 activity 中：\n\n\
  ```java\nIntent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(\"https://www.ebookrenzy.com\"\
  ));\nstartActivity(intent);\n```\n当 activity 发布上述隐式意图时，Android 系统将搜索设备上具有处理方案数据的\
  \ `ACTION_VIEW` 请求能力的 activity，这一过程被称为意图解析。如果发现单个匹配，将启动该 activity。如果发现多个匹配，将提示用户从可用\
  \ activity 选项中选择。\n\n### 2.5 使用 Intent Filter\nIntent 过滤器 是 activity 向 Android 意图解析过程“宣传”支持的操作和数据处理能力的机制。继续上一节的示例，能够显示网页的\
  \ activity 会在其 manifest 文件中包含一个 intent filter 部分，表示对方案数据的 `ACTION_VIEW` 类型意图请求的支持。注意的是，发送和接收\
  \ activity 必须都请求了执行的操作类型的权限。这是通过向两个 activity 的 manifest 文件添加 `<uses-permission>`\
  \ 标签实现的。例如，以下 manifest 行请求访问互联网和联系人数据库的权限：\n\n```xml\n<uses-permission android:name=\"\
  android.permission.READ_CONTACTS\" />\n<uses-permission android:name=\"android.permission.INTERNET\"\
  />\n```\n以下 `AndroidManifest.xml` 文件说明了名为 `WebViewActivity` 的 activity 的配置，启用了 intent\
  \ filters 和访问互联网的权限：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfreny.WebView\"\
  \n    android:versionCode=\"1\"\n    android:versionName=\"1.0\">\n    <uses-sdk\
  \ android:minSdkVersion=\"10\" />\n    <uses-permission android:name=\"android.permission.INTERNET\"\
  \ />\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"\
  @string/app_name\">\n        <activity\n            android:label=\"@string/app_name\"\
  \n            android:name=\".MainActivity\">\n            <intent-filter>\n   \
  \             <action android:name=\"android.intent.action.VIEW\" />\n         \
  \       <category android:name=\"android.intent.category.DEFAULT\" />\n        \
  \        <data android:scheme=\"http\" />\n            </intent-filter>\n      \
  \  </activity>\n    </application>\n</manifest>\n```\n\n### 2.6 检查意图可用性（Checking\
  \ Intent Availability）\n假设某个意图对应的 activity 可是不明智的，因为缺少匹配的操作会导致应用程序崩溃。幸运的是，在意图发送到运行时之前，可以识别特定意图的可用\
  \ activity。以下方法可以识别指定意图类型 activity 的可用性：\n\n```java\npublic static boolean isIntentAvailable(Context\
  \ context, String action) {\n    PackageManager packageManager = context.getPackageManager();\n\
  \    Intent intent = new Intent(action);\n    List<ResolveInfo> list = packageManager.queryIntent(intent,\
  \ PackageManager.MATCH_DEFAULT_ONLY);\n    return list.size() > 0;\n}\n```\n\n###\
  \ 2.7 总结\nIntent 是一个 Android activity 可以启动另一个 activity 的消息机制。显式意图通过引用接收 activity\
  \ 的类名来引用启动特定的 activity。显式意图通常（但不仅限于）用于在同一应用程序内启动 activity。隐式意图指定要执行的操作和处理的数据类型，让\
  \ Android 运行时找到匹配的 activity 并启动。隐式意图通常用于启动位于不同应用程序的 activity。activity 可以通过将数据以键值对的形式封装在\
  \ intent 对象中将其发送到接收 activity。当 activity 作为发送 activity 的子 activity 启动时，可以从 activity\
  \ 返回数据。activity 通过在 manifest 文件中指定 intent filters 向意图解析过程宣传能力。发送和接收 activity 都必须请求访问设备联系人或互联网的权限。\n\
  \n## 3 Android 隐式意图 – 示例（Android Implicit Intents – A Worked Example）\n在本章中，将在 Android\
  \ Studio 中创建一个示例应用程序来演示隐式意图的实际实现。目标是创建并发送意图，请求加载并向用户显示特定网页。由于示例应用程序本身不包含执行此任务的 activity，将发布隐式意图，以便可以使用\
  \ Android 意图解析算法识别并启动另一个应用程序中合适的 activity。这最可能是 Android 操作系统内置的 Chrome 浏览器的 activity。成功启动内置浏览器后，将创建一个包含显示网页的\
  \ activity 的新项目。这将安装在设备或模拟器上，并用于演示当两个 activity 符合隐式意图的标准时会发生什么。\n\n### 3.1 创建显式意图示例（Creating\
  \ the Explicit Intent Example）\n从欢迎屏幕选择 Start a new Android Studio project 选项，在新对话框中点击\
  \ Next 按钮之前选择 Empty Activity 模板。在 Name 字段中输入 `ExplicitIntent` 并指定 `com.ebookfrenzy.explicitintent`\
  \ 为包名。点击 Finish 按钮之前，将最低 API 级别更改为 26：Android 8.0 (Oreo)，并将语言菜单改为 Java。\n\n### 3.2\
  \ 设计 MainActivity 用户界面布局（Designing the User Interface Layout for MainActivity）\n\
  `MainActivity` 的用户界面将由 `ConstraintLayout` 视图组成，包含名为 `editText1`、`textView1` 和对应的\
  \ `EditText`（Plain Text）、TextView 和 Button。在 Project 工具窗口中，找到 `MainActivity` 的 `activity_main.xml`\
  \ 资源文件（位于 `app -> res -> layout`），并双击它将其加载到 Layout Editor 工具中。选择并删除默认的 \"Hello World!\"\
  \ `TextView`。在本教程中，布局完成后使用 Inference 模式添加约束。因此，首先使用图 53-1 所示的工具栏按钮关闭 Layout Editor\
  \ 的 Autoconnect 功能![](img/image981.jpg)\n从调板中拖入 `TextView` 组件并将其放置在布局正中央，并使用 Attributes\
  \ 工具窗口分配 ID `textView1`。从调板中拖入 `Button` 对象，并将其置为水平居中并位于 `TextView` 的下方。更改文本属性使其显示为\
  \ \"Ask Question\"，并配置 `onClick` 属性调用名为 `onClick` 的方法。接下来，添加一个 Plain Text 对象，使其水平居中并位于\
  \ `TextView` 的上方。使用 Attributes 工具窗口，移除分配给文本属性的 \"Name\" 字符串，并将 ID 设置为 `editText1`。布局完成后，点击工具栏上的\
  \ Infer constraints 按钮添加适当的约束![](img/image989.jpg)\n图 53-2\n最后，点击 Layout Editor\
  \ 窗口右上角的红色警告按钮，并使用生成的面板将 \"Ask Question\" 字符串提取到名为 `ask_question` 的资源中。一旦布局完成，用户界面应该与图\
  \ 53-3 所示相似![](img/image996.jpg)\n图 53-3\n\n### 3.3 创建第二个 Activity 类（Creating the\
  \ Second Activity Class）\n当用户点击 \"Ask Question\" 按钮时，将发布意图请求启动第二个 activity，用户可以在其中输入答案。因此下一步是创建第二个\
  \ activity。在 Project 工具窗口中，右键点击 `com.ebookfrenzy.explicitintent` 包（位于 `app -> java`），选择\
  \ New -> Activity -> Empty Activity 菜单，如图 4 所示![](img/image00.jpg)\n图 4\n在 Name\
  \ 字段中输入 `ActivityB` 并命名布局文件 `activity_b`，并将语言改为 Java。由于该 activity 在 MainActivity\
  \ 通过意图启动时，在点击 Finish 按钮之前，重要的是确保禁用 Launcher 选项。\n\n### 3.4 设计 ActivityB 用户界面布局（Designing\
  \ the User Interface Layout for ActivityB）\n第二个 activity 的用户界面元素是 `EditText`（Plain\
  \ Text）、`TextView` 和 Button。根据这些要求，将 `activity_b.xml` 布局加载到 Layout Editor，在 Layout\
  \ Editor 中关闭 Autoconnect 模式并添加视图。设计过程中，注意按钮上的 `onClick` 属性已配置为调用名为 `onClick` 的方法，`TextView`\
  \ 和 `EditText` 视图分别分配了 ID `textView1` 和 `editText1`。一旦完成，布局应如图 5 所示![](img/image01.jpg)\n\
  图 5\n注意按钮上的文本（显示为 \"Answer Question\"）已提取为字符串 `answer_question`。\n\n### 3.5 查看应用程序\
  \ Manifest（Reviewing the Application Manifest）\n为了 MainActivity 能够通过意图启动 ActivityB，需要在\
  \ `AndroidManifest.xml` 中存在 ActivityB。在 Project 窗口（app -> manifests）中找到该文件，双击将其加载到编辑器，并验证\
  \ Android Studio 已自动添加了 activity 的条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.explicitintent\">\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:supportsR=\"true\"\n        android:theme=\"@style/AppTheme\"\
  >\n        <activity android:name=\".MainActivity\">\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.MAIN\" />\n      \
  \          <category android:name=\"android.intent.category.LAUNCHER\" />\n    \
  \        </intent-filter>\n        </activity>\n        <activity android:name=\"\
  .ActivityB\"></\n</application>\n</manifest>\n```\n\n###3.6 创建 Intent（Creating the\
  \ Intent）\nMainActivity 的目标是在用户点击 \"Ask Question\" 按钮时创建并启动意图。在意图创建过程中，用户在 `EditText`\
  \ 视图输入的字符串将作为键值对添加到意图对象中。当创建 MainActivity 的用户界面时，按钮对象已配置为在用户点击时调用名为 `onClick()`\
  \ 的方法。现在需要将此方法添加到 MainActivity 类 `MainActivity.java` 中：\n\n```java\npackage com.ebookfrenzy.explicitintent;\n\
  \nimport android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.content.Intent;\nimport android.view.View;\nimport android.widget.EditText;\n\
  import android.widget.TextView;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_a);\n\
  \    }\n\n    public void onClick(View view) {\n        Intent i = new Intent(this,\
  \ ActivityB.class);\n        EditText editText1 = (EditText)findViewById(R.id.editText1);\n\
  \        String myString = editText1.getText().toString();\n        i.putExtra(\"\
  qString\", myString);\n        startActivity(i);\n    }\n}\n```\nonClick() 方法的代码遵循“Android\
  \ Intent 概述”中概述的技术。首先创建一个新的 Intent 实例，并将当前 activity 和 ActivityB 的类名作为参数传递。接下来，将\
  \ EditText 对象中的文本作为键值对添加到意图对象中，并通过调用 `startActivity()` 启动意图，传递意图对象作为参数。编译并运行应用程序，触摸\
  \ \"Ask Question\" 按钮启动 ActivityB，并点击返回键（位于显示底部底部工具栏中）返回 MainActivity。\n\n###3.7\
  \ 提取意图数据（Extracting Intent Data）\n现在 ActivityB 正从 MainActivity 启动，下一步是提取意图中包含的 String\
  \ 数据值并将其分配给 ActivityB 用户界面中的 TextView 对象。这涉及在 ActivityB.java 源文件中 ActivityB 的 `onCreate()`\
  \ 方法中添加一些代码：\n\n```java\npackage com.ebookfrenzy.explicitintent;\n\nimport android.support.v7.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.content.Intent;\nimport android.view.View;\n\
  import android.widget.TextView;\nimport android.widget.EditText;\n\npublic class\
  \ ActivityB extends AppCompatActivity {\n    public void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_b);\n\
  \        Bundle extras = getIntent().getExtras();\n        if (extras == null) {\n\
  \            return;\n        }\n        String qString = extras.getString(\"qString\"\
  );\n        final TextView textView = (TextView)findViewById(R.id.textView1);\n\
  \        textView.setText(qString);\n    }\n}\n```\n在模拟器或物理设备上编译并运行应用程序。在 MainActivity\
  \ 的文本框中输入一个问题，然后点击 \"Ask Question\" 按钮。问题现在出现在 TextView 组件上。\n\n###3.8 将 ActivityB\
  \ 作为子 Activity 启动（Launching ActivityB as Sub-Activity）\n为了让 ActivityB 能够向 MainActivity\
  \ 返回数据，必须将 ActivityB 作为 MainActivity 的子 activity 启动。这意味着 onClick 方法中的 startActivity()\
  \ 调用需要替换为 startForResult()。与只需要意图对象作为参数的 startActivity() 方法不同，ForResult() 需要请求代码。请求代码可以是任意数字，用于识别与数据相关的子\
  \ activity。对于本例，将使用请求代码 5，给出如下的 MainActivity 类：\n\n```java\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private final int request_code = 5;\n\n    @Override\n\
  \    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.main);\n    }\n\n    public void onClick(View view)\
  \ {\n        Intent i = new Intent(this, ActivityB.class);\n        EditText editText1\
  \ = (EditText)findViewById(R.id.editText1);\n        String myString = editText1.getText().toString();\n\
  \        i.putExtra(\"qString\", myString);\n        startForResult(i, request_code);\n\
  \    }\n}\n```\n当子 activity 退出时，调用父 activity 的 onActivityResult() 方法并传递与意图相关的请求代码：\n\
  \n```java\nprotected void onActivityResult(int requestCode, int resultCode, Intent\
  \ data) {\n    if (requestCode == request_code && resultCode == RESULT_OK) {\n \
  \       TextView textView1 = findViewById(R.id.textView1);\n        String returnString\
  \ = data.getStringExtra(\"returnData\");\n        textView1.setText(returnString);\n\
  \    }\n}\n\n```3.9 从子 Activity 返回数据（Returning Data from a Sub-Activity）\nActivityB\
  \ 现在作为 MainActivity 的子 activity 启动，MainActivity 修改以处理从 ActivityB 返回的数据。剩下的是修改 ActivityB.java\
  \ 以实现 finish() 方法，并为点击 \"Answer Question\" 按钮时的 onClick 方法添加代码。当 activity 退出时（例如用户选择设备上的返回键时），会触发\
  \ finish() 方法：\n\n```java\npublic void onClick(View view) {\n    finish();\n}\n\n\
  @Override\npublic void finish() {\n    Intent data = new Intent();\n    EditText\
  \ editText1 = findViewById(R.id.editText1);\n    String returnString = editText1.getText().toString();\n\
  \    data.putExtra(\"returnData\", returnString);\n    setResult(RESULT_OK, data);\n\
  \    super.finish();\n}\n```\n\n## 4 Android 隐式意图 – 示例（Android Implicit Intents\
  \ – A Worked Example）\n在本章中，将在 Android Studio 中创建一个示例应用程序来演示隐式意图的实际实现。目标是创建并发送意图，请求加载并向用户显示特定网页。由于示例应用程序本身不包含执行此任务的\
  \ activity，将发布隐式意图，以便可以使用 Android 意图解析算法识别并启动另一个应用程序中合适的 activity。这最可能是 Android\
  \ 操作系统内置的 Chrome 浏览器的 activity。借此指示 Android 系统搜索并随后启动能够浏览器的 activity。成功启动内置浏览器后，将创建一个包含显示网页的\
  \ activity 的新项目。这将安装在设备或模拟器上，并用于演示当两个 activity 符合隐式意图的标准时会发生什么。\n\n### 4.1 创建 Android\
  \ Studio 隐式意图项目（Creating the Android Studio Implicit Intent Project）\n从欢迎屏幕选择 Start\
  \ a new Android Studio project 选项，在新对话框中点击 Next 按钮之前选择 Empty Activity 模板。在 Name\
  \ 字段中输入 `ImplicitIntent` 并指定 `com.ebookfrenzy.implicitintent` 为包名。点击 Finish 按钮之前，将最低\
  \ API 级别更改为 26：Android 8.0 (Oreo)，并将语言菜单改为 Java。\n\n### 4.2 设计用户界面（Designing the\
  \ User Interface）\nMainActivity 类的用户界面非常简单，由 ConstraintLayout 和 Button 对象组成。在 Project\
  \ 工具窗口中，找到 app -> res -> layout -> activity_main.xml 文件并双击它将其加载到 Layout Editor 工具中。删除默认的\
  \ TextView，并在启用 Autoconnect 模式，在布局中放置一个 Button 组件。注意按钮上的文本（\"Show Page\"）已提取为资源\
  \ `show_page`![](img/image0156.jpg)\n图 54-1\n选中 Button 后，使用 Attributes 工具窗口配置 onClick\
  \ 属性以调用名为 showPage() 的方法。\n\n### 4.3 创建隐式意图（Creating the Implicit Intent）\n如上所述，隐式意图将在名为\
  \ showPage() 的方法内创建并发布，其代码位于 MainActivity.java 源文件中。在 Project 工具窗口中找到该文件：\n\n```java\n\
  package com.ebookfrenzy.implicitintent;\n\nimport android.support.v7.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.content.Intent;\nimport android.view.View;\n\
  import android.net.Uri;\n\npublic class MainActivity extends AppCompatActivity {\n\
  \    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n     \
  \   super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    public void showPage() {\n        Intent intent = new Intent(Intent.ACTION_VIEW,\
  \ Uri.parse(\"https://www.ebookrenzy.com\"));\n        startActivity(intent);\n\
  \    }\n}\n```\n上述方法通过检查意图发布时使用的请求代码来确保 activity 成功。随后从意图中提取返回数据并显示在 TextView 对象上。\n\
  \n### 4.5 使用 Intent Filter（Using Intent Filter）\nIntent 过滤器 是 activity 向 Android\
  \ 意图解析过程“宣传”支持的操作和数据处理能力的机制。继续上一节的示例，能够显示网页的 activity 会在其 manifest 文件中包含一个 intent\
  \ filter 部分，表示对方案数据的 `ACTION_VIEW` 类型意图请求。注意的是，发送和接收 activity 必须都请求了执行的操作类型的权限。这是通过向两个\
  \ activity 的 manifest 文件添加 `<uses-permission>` 标签实现的。例如，以下 manifest 行请求访问互联网和联系人数据库的权限：\n\
  \n```xml\n<uses-permission android:name=\"android.permission.READ_CONTACTS\" />\n\
  <uses-permission android:name=\"android.permission.INTERNET\"/>\n```\n以下 AndroidManifest.xml\
  \ 文件说明了名为 WebViewActivity 的 activity 的配置，启用了 intent filters 和访问互联网的权限：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfreny.WebView\"\n    android:versionCode=\"1\"\n    android:versionName=\"\
  1.0\">\n    <uses-sdk android:minSdkVersion=\"10\" />\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\">\n        <activity\n            android:label=\"\
  @string/app_name\"\n            android:name=\".MainActivity\">\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.VIEW\" />\n      \
  \          <category android:name=\"android.intent.category.DEFAULT\" />\n     \
  \           <data android:scheme=\"http\" />\n            </intent-filter>\n   \
  \     </activity>\n    </application>\n</manifest>\n```\n\n### 4.6 检查意图可用性（Checking\
  \ Intent Availability）\n假设某个意图对应的 activity 可是不明智的，因为缺少匹配的操作会导致应用程序崩溃。幸运的是，在意图发送到运行时之前，可以识别特定意图的可用\
  \ activity。以下方法可以识别指定意图类型 activity 的可用性：\n\n```java\npublic static boolean isIntentAvailable(Context\
  \ context, String action) {\n    PackageManager packageManager = context.getPackageManager();\n\
  \    Intent intent = new Intent(action);\n    List<ResolveInfo> list = packageManager.queryIntent(intent,\
  \ PackageManager.MATCH_DEFAULT_ONLY);\n    return list.size() > 0;\n}\n```\n\n###\
  \ 4.7 总结\nIntent 是一个 Android activity 可以启动另一个 activity 的消息机制。显式意图通过引用接收 activity\
  \ 的类名来引用启动特定的 activity。显式意图通常（但不仅限于）用于在同一应用程序内启动 activity。隐式意图指定要执行的操作和处理的数据类型，让\
  \ Android 运行时找到匹配的 activity 并启动。隐式意图通常用于启动位于不同应用程序的 activity。activity 可以通过将数据以键值对的形式封装在\
  \ intent 对象中将其发送到接收 activity。\n\n\n\n\n- 获取导致此 Activity 启动的 `intent` \n- 从 `intent`\
  \ 对象中提取 `Uri` 数据\n- 将 `Uri` 数据转换为 `URL` 对象\n- 获取用户界面中 `WebView` 对象的引用\n- 将 `URL`\
  \ 加载到视图中，在此过程中将 `URL` 转换为 `String`\n\n\n\n`MyWebView` 项目的代码部分已经完成。剩下的工作就是修改清单（manifest）文件。\n\
  \n## 54.7 修改 MyWebView 项目的清单文件\n\n在进行测试之前，必须对 `MyWebView` 的清单文件进行多项更改。首先，该活动（activity）需要请求访问互联网的权限（因为它需要加载网页）。这通过在清单文件中添加适当的权限行来实现：\n\
  \n```xml\n<uses-permission android:name=\"android.permission.INTERNET\" />\n```\n\
  \n此外，通过对 `MyWebView` 项目的 `AndroidManifest.xml` 文件中意图过滤器（intent filter）部分的内容进行审查，可以发现以下设置：\n\
  \n```xml\n<intent-filter>\n    <action android:name=\"android.intent.action.MAIN\"\
  \ />\n    <category android:name=\"android.intent.category.LAUNCHER\" />\n</intent-filter>\n\
  ```\n\n在上述 XML 中，`android.intent.action.MAIN` 项表示该活动在没有任何数据输入启动时，是应用程序的入口点。另一方面，`android.intent.category.LAUNCHER`\
  \ 指令表示该活动应该列在设备的应用程序启动器屏幕中。\n\n由于该活动不需要作为应用程序的入口点启动，在没有数据输入（在此例中为 URL）的情况下无法运行，且不需要在启动器中出现，因此该活动的清单文件中不需要\
  \ `MAIN` 或 `LAUNCHER` 指令。\n\n然而，`MainActivity` 活动的意图过滤器需要进行修改，以表明它能够处理针对 `http`\
  \ 数据方案的 `ACTION_VIEW` 意图动作。Android 还要求，任何能够处理隐式意图（implicit intents）且不包含 `MAIN` 和\
  \ `LAUNCHER` 项的活动，其意图过滤器也必须包含所谓的可浏览（browsable）和默认（default）类别。因此，修改后的意图过滤器部分应该如下所示：\n\
  \n```xml\n<intent-filter>\n    <action android:name=\"android.intent.action.VIEW\"\
  \ />\n    <category android:name=\"android.intent.category.BROWSABLE\" />\n    <category\
  \ android:name=\"android.intent.category.DEFAULT\" />\n    <data android:scheme=\"\
  http\" />\n</intent-filter>\n```\n\n将这些需求结合在一起，得到了完整的 `AndroidManifest.xml` 文件：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\" package=\"com.ebookfrenzy.mywebview\"\
  >\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application\
  \ android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\n \
  \       android:label=\"@string/app_name\"\n        android:theme=\"@style/AppTheme\"\
  >\n        <activity android:name=\".MainActivity\"\n            android:label=\"\
  @string/app_name\">\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.VIEW\" />\n                <category android:name=\"android.intent.category.BROWSABLE\"\
  \ />\n                <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n                <data android:scheme=\"https\" />\n            </intent-filter>\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n通过双击 Project 工具窗口中的文件名，将\
  \ `AndroidManifest.xml` 文件加载载到清单编辑器中。加载后，修改 XML 以匹配上述更改。对清单文件进行适当修改后，新活动已准备好安装到设备上。\n\
  \n## 54.8 在设备上安装 MyWebView 包\n\n在 `MyWebView` 主活动可以作为隐式意图的接收者之前，必须先将其安装到设备上。这通过正常方式运行应用程序来实现。由于清单文件不包含\
  \ `android.intent.action.MAIN` 包含 `android.intent.category.LAUNCHER` 设置，因此需要指示 Android\
  \ Studio 安装但不启动该应用。要配置此行为，请从工具栏选择 app -> `Edit configurations…` 菜单，如图 54-3 所示：![](img/image10285.jpg)\n\
  \n图 54-3\n\n在 Run/Debug Configurations 对话框中，将面板 Launch Options 部分的 Launch 选项更改为\
  \ `Nothing`，然后点击 Apply 并点击 OK：![](img/image10291.jpg)\n\n图 54-4\n\n配置此设置后，按通常常运行应用。注意，应用已安装在设备上，但尚未启动。\n\
  \n## 54.9 测试应用程序\n\n为了测试 `MyWebView`，只需重新启动本章之前创建的 `ImplicitIntent` 应用程序并点击 Show\
  \ Web Page 按钮。然而，这一次，意图解析过程将找到两个具有匹配隐式意图意图过滤器的活动。因此，系统将显示一个对话框（图 54-5），为用户提供要启动活动的选择。![](img/image10299.jpg)\n\
  \n图 54-5\n\n选择 `MyWebView` 选项，然后点击 Just once 按钮，应该会导致意图由我们新的 `MyWebView` 主活动处理，该活动随后将出现并显示网页。\n\
  \n如果网页加载到 Chrome 浏览器而没有出现上述对话框，可能是 Chrome 被配置为设备的默认浏览器。可以通过进入 Settings -> Apps &\
  \ notifications -> App info 来更改这一点：在应用列表中滚动找到 Chrome。在 Chrome 应用信息屏幕上点击 Open by\
  \ default，然后点击 Clear Defaults 按钮。\n\n## 54.10 总结\n\n隐式意图提供了一种机制，一个活动可以通过指定动作类型以及可选的数据，来请求另一个活动的服务。然而，为了成为隐式意图的目标候选，活动必须配置为从传入的意图中提取适当的数据，并包含在正确配置的清单文件中，包括适当的权限和意图过滤器。在意图解析期间，如果发现多个匹配隐式意图的活动，将提示用户选择使用哪一个。在本章中，创建了一个示例演示了发布隐式意图，以及能够处理此类意图的活动的创建。\n\
  \n## 55 广播意图和广播接收器\n\n除了提供启动活动的机制外，意图还用于向系统上的其他组件广播消息。这涉及广播意图和广播接收器的实现，两者都是本章的主题。\n\
  \n### 5.1 广播意图概述\n\n广播意图是 `Intent` 对象，通过 `sendBroadcast()`、`sendStickyBroadcast()`\
  \ 或 `sendOrderedBroadcast()` 方法（当需要结果时）进行广播。除了在应用程序组件之间提供消息和事件外，广播意图也被 Android 系统用于通知系统事件（例如电源连接或断开）。创建广播意图时，除了可选的数据和类别字符串外，还包含一个动作字符串。与标准意图一样，数据通过键值对结合对象的\
  \ `putExtra()` 方法添加到广播意图中。可选的类别字符串可以通过调用 `addCategory()` 分配给广播意图。标识广播事件的动作字符串必须唯一的，通常使用应用程序的包名。例如，以下代码创建并发送了一个包含唯一动作字符串的广播意图：\n\
  \n```java\nIntent intent = new Intent();\nintent.setAction(\"com.example.Broadcast\"\
  );\nintent.putExtra(\"MyData\", 1);\nsendBroadcast(intent);\n```\n\n上述代码将在运行低于 Android\
  \ 3.0 的设备上成功启动相应的广播接收器。在较新的 Android 版本中，广播接收器不会接收意图，因为 Android 3.0 引入了一种防止通过意图启动已停止应用程序的措施。如果应用程序刚刚安装尚未启动，或被用户使用设备管理器手动停止，则被认为处于停止状态。为了解决这个问题，可以在发送意图之前添加一个标记，指示允许启动停止应用程序的组件。该标记是\
  \ `FLAG_INCLUDE_STOPPED_PACKAGES`，并在如下代码中使用：\n\n```java\nIntent intent = new Intent();\n\
  intent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\nintent.setAction(\"com.example.Broadcast\"\
  );\nintent.putExtra(\"MyData\", 1);\nsendBroadcast(intent);\n```\n\n### 5.2 广播接收器概述\n\
  \n应用程序通过注册广播接收器监听特定的广播意图。广播接收器通过扩展 `BroadcastReceiver` 类并重写 `onReceive()` 方法来实现。然后可以在代码中（例如在活动中）或清单文件中注册广播接收器。注册实现涉及创建意图过滤器，以指示接收器需要监听的广播意图。这是通过引用广播意图的动作字符串实现的。当检测到匹配的广播时，会调用广播接收器的\
  \ `onReceive()` 方法，此时方法有几秒钟执行任何必要的任务。注意的是，广播接收器不需要一直运行。在检测到匹配意图的情况下，Android Runtime\
  \ 会在调用 `onReceive()` 方法之前自动启动广播接收器。以下代码概述了一个广播接收器子类：\n\n```java\npackage com.example.broadcastdetector;\n\
  import android.content.BroadcastReceiver;\nimport android.content.Context;\nimport\
  \ android.content.Intent;\n\npublic class MyReceiver extends BroadcastReceiver {\n\
  \    public MyReceiver() {}\n    @Override\n    public void onReceive(Context context,\
  \ Intent intent) {\n        // 在检测到广播时执行此处的代码\n    }\n}\n```\n\n在清单文件中注册广播接收器时，必须为接收器添加\
  \ `<receiver>` 项。下面的示例清单文件注册了上述示例广播接收器：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \ package=\"com.example.broadcastdetector.broadcastdetector\"\n    android:versionCode=\"\
  1\" android:versionName=\"1.0\">\n    <uses-sdk android:minSdkVersion=\"17\" />\n\
  \    <application android:icon=\"@mipmap/ic_launcher\" android:label=\"@string/app_name\"\
  >\n        <receiver android:name=\"MyReceiver\" />\n    </application>\n</manifest>\n\
  ```\n\n在早于 Android 8.0 的 Android 版本上运行时，与接收器相关的意图过滤器可以放在清单文件的 receiver 元素中，如下：\n\
  \n```xml\n<receiver android:name=\"MyReceiver\">\n    <intent-filter>\n        <action\
  \ android:name=\"com.example.Broadcast\" />\n    </intent-filter>\n</receiver>\n\
  ```\n\n在 Android 8.0 或更高版本上，必须使用 `Activity` 类的 `registerReceiver()` 方法配合适当配置的 `IntentFilter`\
  \ 对象在代码中注册接收器：\n\n```java\nIntentFilter filter = new IntentFilter(\"com.example.Broadcast\"\
  );\nMyReceiver receiver = new MyReceiver();\nregisterReceiver(receiver, filter);\n\
  ```\n\n当不再需要代码中注册的广播接收器时，可以通过调用类的 `unregisterReceiver()` 方法取消注册，并将接收器作为参数：\n\n```java\n\
  unregisterReceiver(receiver);\n```\n\n记住，某些系统意图只有在代码中而非清单文件中注册时才能被广播接收器检测到。请查看 Android\
  \ Intent 文档获取系统广播的详细概述：https://developer.android.com/reference/android/content/Intent.html。\n\
  \n### 5.3 从广播获取结果\n\n使用 `sendBroadcast()` 方法发送广播意图时，没有方法可以从任何广播接收结果。如果需要结果，则必须使用\
  \ `sendOrderedBroadcast()` 方法。当使用此方法发送广播意图时，它会按顺序传递给每个感兴趣的接收器。\n\n### 5.4 粘性意图（Sticky\
  \ Intent）\n\n默认情况下，广播意图一旦发送并被任何接收器处理就会消失。然而，广播意图可以定义为“粘性”。粘性意图在完成后仍留在系统中。存储在粘性意图中的数据可以通过\
  \ `registerReceiver()` 方法的返回值获取（引用广播接收器和意图对象）。许多 Android 系统广播都是粘性的，电量水平就是一个示例。粘性广播可以随时通过调用\
  \ `removeSticky()` 方法移除。\n\n### 5.5 意图示例\n\n本章的剩余部分将通过创建广播意图的 Android 示例来进行。首先，创建一个简单的应用程序用于发布自定义广播意图。然后将创建一个广播接收器，在检测到广播时在设备上显示消息。最后，将修改广播接收器以检测系统发布的通知。\n\
  \n### 5.6 创建应用程序\n\n从欢迎屏幕选择 Start new Android project 选项，并在结果的项目对话框中点击 Next 按钮之前选择\
  \ Empty Activity 模板。在 Name 字段输入 SendBroadcast，并指定 `com.ebookfrenzy.sendbroadcast`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将语言设置为\
  \ Java。\n\n创建新项目后，在 Project 工具窗口的 `app -> res -> layout` 下找到并加载 `activity_main.xml`\
  \ 布局文件，并在 Design 模式下将 `TextView` 对象替换为 `Button` 视图，并设置文本属性为“Send Broadcast”。设置文本值后，按照通常步骤将字符串提取到名为\
  \ `send_broadcast` 的资源。在布局中仍选中按钮，在 Attributes 面板中找到 `onClick` 属性并将其配置为调用名为 `broadcastIntent`\
  \ 的方法。\n\n### 5.7 创建并发送意图\n\n创建 SendBroadcast 应用程序框架后，现在是实现发送广播意图的代码了。这涉及到实现之前作为用户界面\
  \ `Button` 视图 `onClick` 目标的 `broadcastIntent()` 方法。找到并双击 `MainActivity.java` 文件，修改它以添加创建和发送广播意图的代码。修改后，该类的源代码应如下：\n\
  \n```java\npackage com.ebookfrenzy.sendbroadcast;\nimport android.support.v7.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.content.Intent;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_send_broadcast);\n    }\n\n    public\
  \ void broadcastIntent(View view) {\n        Intent intent = new Intent();\n   \
  \     intent.setAction(\"com.ebookfrenzy.sendbroadcast\");\n        intent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\n\
  \        sendBroadcast(intent);\n    }\n}\n```\n\n注意在此例中，意图的动作字符串是 `com.ebookfrenzy.sendbroadcast`。在本章的后续部分创建广播接收器类时，意图过滤器匹配此动作字符串至关重要。这结束了发送广播意图应用程序的创建。剩下的工作是构建匹配的广播接收器。\n\
  \n### 5.8 创建广播接收器\n\n为了创建广播接收器，需要创建一个继承 `BroadcastReceiver` 父类的新类。在 Project 工具窗口中，导航到\
  \ `app -> java` 并右键点击包名。在结果菜单中，选择 `New -> Other -> Broadcast Receiver` 选项，将类命名为\
  \ `MyReceiver` 并确保选择了 `Exported` 和 `Enabled` 选项。配置好类后，点击 Finish。一旦创建，Android Studio\
  \ 会自动加载新的 `MyReceiver.java` 文件到编辑器中，其内容如下：\n\n```java\npackage com.ebookrenzy.sendbroadcast;\n\
  import android.content.BroadcastReceiver;\nimport android.content.Context;\nimport\
  \ android.content.Intent;\n\npublic class MyReceiver extends BroadcastReceiver {\n\
  \    public MyReceiver() {}\n    @Override\n    public void onReceive(Context context,\
  \ Intent intent) {\n        // TODO: 当广播接收器接收意图时调用此方法\n        throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n    }\n}\n```\n\n如代码所示，Android Studio 生成了新类的模板以及 `onReceive()`\
  \ 方法的存根。现在需要对类进行若干更改来实现所需的行为。在 `MyReceiver.java` 文件中，修改代码如下：\n\n```java\npackage\
  \ com.ebookrenzy.sendbroadcast;\nimport android.content.BroadcastReceiver;\nimport\
  \ android.content.Context;\nimport android.content.Intent;\nimport android.widget.Toast;\n\
  \npublic class MyReceiver extends BroadcastReceiver {\n    public MyReceiver() {}\n\
  \    @Override\n    public void onReceive(Context context, Intent intent) {\n  \
  \      // TODO: 当广播接收器接收意图时调用此方法\n        Toast.makeText(context, \"Broadcast Intent.\"\
  , Toast.LENGTH_LONG).show();\n    }\n}\n```\n\n广播接收器的代码已完成。\n\n### 5.9 注册广播接收器\n\
  \n项目需要公开广播接收器的存在，并包含一个意图过滤器来指定接收器感兴趣的广播意图。在上一节创建 `BroadcastReceiver` 类时，Android\
  \ Studio 自动在清单文件中添加了 `<receiver>` 元素。因此，剩下的工作是在 `MainActivity.java` 文件中创建意图过滤器并注册接收器：\n\
  \n```java\npackage com.ebookrenzy.sendbroadcast;\nimport android.content.BroadcastReceiver;\n\
  import android.content.Intent;\nimport android.content.IntentFilter;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    BroadcastReceiver receiver;\n\n\
  \    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n     \
  \   super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_send_broadcast);\n\
  \        configureReceiver();\n    }\n\n    private void configureReceiver() {\n\
  \        IntentFilter filter = new IntentFilter();\n        filter.addAction(\"\
  com.ebookrenzy.sendbroadcast\");\n        filter.addAction(\"android.intent.action.POWER_DISCONNECTED\"\
  );\n        receiver = new MyReceiver();\n        registerReceiver(receiver, filter);\n\
  \    }\n\n    // 当不再需要广播接收器时，取消注册广播接收器也是重要的：\n    @Override\n    protected void\
  \ onDestroy() {\n        super.onDestroy();\n        unregisterReceiver(receiver);\n\
  \    }\n}\n\n### 5.10 测试广播示例\n\n为了测试广播发送者和接收器，在设备或 AVD 上运行 `SendBroadcast` 应用程序并等待它出现。运行后，点击按钮，此时“Broadcast\
  \ Intent.”的 Toast 消息将弹出几秒钟后消失。\n\n### 5.11 监听系统广播\n\n本示例的最后阶段是修改广播接收器的意图过滤器，以监听设备电源断开时广播的系统意图。该动作是\
  \ `android.intent.action.POWER_DISCONNECTED`。在 `MainActivity.java` 文件的 `onCreate()`\
  \ 方法中添加此过滤器：\n\n```java\nprivate void configureReceiver() {\n    IntentFilter filter\
  \ = new IntentFilter();\n    filter.addAction(\"com.ebookrenzy.sendbroadcast\");\n\
  \    filter.addAction(\"android.intent.action.POWER_DISCONNECTED\");\n    receiver\
  \ = new MyReceiver();\n    registerReceiver(receiver, filter);\n}\n```\n\n由于 `onReceive()`\
  \ 方法现在将监听两种广播意图，修改代码将当前意图的动作字符串也显示在 Toast 消息中是有的：\n\n```java\npublic void onReceive(Context\
  \ context, Intent intent) {\n    String message = \"Broadcast intent detected \"\
  \ + intent.getAction();\n    Toast.makeText(context, message, Toast.LENGTH_LONG).show();\n\
  }\n```\n\n通过重新安装修改后的 `BroadcastReceiver` 包测试接收器。在 `SendBroadcast` 应用程序中点击按钮现在会产生包含自定义动作字符串的新消息：`Broadcast\
  \ intent detected com.ebookrenzy.sendbroadcast`。接下来，移除当前为 Android 设备供电的 USB 连接，此时接收器应该在\
  \ Toast 消息中报告以下内容。如果应用运行在模拟器上，显示扩展控制，选择 Battery 选项并将充电器连接设置改为 None。`Broadcast intent\
  \ detected android.intent.action.POWER_DISCONNECTED`。\n\n为了避免设备每次断开电源时都出现此消息，启动设备上的\
  \ Settings 应用并选择 Apps & notifications 选项。从结果列表中选择 `BroadcastReceiver` 应用并点击卸载按钮。\n\
  \n### 5.12 总结\n\n广播意图是一种机制，一个活动可以向另一个组件发布意图。广播意图通过注册 `BroadcastReceiver` 来被检测到。当检测到匹配的意图时，就会在清单文件中注册的活动。广播意图还被\
  \ Android 系统用于发布通知，例如电量低警告、连接或断开。\n\n## 6 线程和 AsyncTask 概述\n\n本章将通过创建广播意图的示例来介绍在后台线程执行应用程序任务。然而，在首先理解\
  \ Android 应用程序线程概念之前是不可能的。线程和 `AsyncTask` 类是本章的主题。\n\n### 1 线程概述\n\n线程是任何多任务操作系统的基石，可以被视为在主进程中运行的并行执行路径。\n\
  \n### 2 主线程\n\n当 Android 应用程序首次启动时，运行时创建一个单线程，所有随后启动的组件默认在该线程运行。主线程的主要作用是处理用户界面以及与用户界面的事件交互。在主线程中执行耗时任务将导致整个应用程序看起来卡死。这通常会导致操作系统显示“应用程序未响应”警告。通过在单独线程中启动任务可以避免这种情况，允许主线程不受阻碍地继续。\n\
  \n### 3 处理器（Handlers）\n\n显然，Android 开发的关键规则之一是不要在主线程上执行耗时操作。同样重要的规则是，单独线程中的代码绝不能直接更新用户界面，必须从主线程执行。这是因为\
  \ Android UI 工具不是线程安全的。在多个线程中尝试处理非安全的代码会导致间歇性问题和不可预测的应用程序行为。如果耗时任务需要在后台线程运行并更新用户界面，最佳方法是通过子类\
  \ `AsyncTask` 来实现异步任务。\n\n### 4 基础 AsyncTask 示例\n\n本章的剩余部分将通过简单示例提供线程的基础介绍以及 `AsyncTask`\
  \ 类的使用。第一步将强调在单独线程中执行耗时任务的重要性。从欢迎屏幕选择 Start new Android project 快速选项，并在结果的项目对话框中点击\
  \ Next 按钮之前选择 Empty Activity 模板。在 Name 字段输入 `AsyncTask` 并指定 `com.ebookrenzy.asyncdemo`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将语言设置为\
  \ Java。\n\n创建新项目后，在 Project 工具窗口的 `app -> res -> layout` 下找到并加载 `activity_main.xml`\
  \ 布局文件，在布局编辑器中选择默认的 `TextView` 组件，并将视图的 ID 更改为 `myTextView`。禁用自动连接模式，在现有 `TextView`\
  \ 对象正下方添加 `Button` 视图。将文本更改为“Press Me”，并将字符串提取到名为 `press_me` 的资源。在布局中仍选中按钮，找到 `onClick`\
  \ 属性并输入 `buttonClick` 作为方法名。将 `MainActivity.java` 文件加载到编辑面板，添加代码实现 `buttonClick()`\
  \ 方法，该方法将在用户触摸 `Button` 视图时被调用：\n\n```java\npackage com.ebookrenzy.asyncdemo;\n\
  import android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\nimport\
  \ android.view.View;\nimport android.widget.TextView;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private TextView myTextView;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_thread_example);\n        myTextView =\
  \ findViewById(R.id.myTextView);\n    }\n\n    public void buttonClick(View view)\
  \ {\n        int i = 0;\n        while (i <= 20) {\n            try {\n        \
  \        Thread.sleep(1000);\n                i++;\n            } catch (Exception\
  \ e) {\n        }\n        myTextView.setText(\"Button Pressed\");\n    }\n}\n```\n\
  \n代码更改完成后，在物理设备或模拟器上运行应用程序。一旦应用程序运行，点击 `Button`，此时应用程序将看起来冻结。例如，将无法再次点击按钮，在某些情况下，操作系统会报告应用程序无响应：图\
  \ 56-2!(image10563.jpg)\n\n显然，任何在 `buttonClick()` 方法中需要时间完成的任务都需要在单独线程中执行。\n\n###\
  \ 5 子类化 AsyncTask\n\n为了创建一个线程，在该线程中执行的代码需要在 `AsyncTask` 实例中执行。第一步是子类化 `AsyncTask`，在\
  \ `MainActivity.java` 文件中如下：\n\n```java\nimport android.os.AsyncTask;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private class MyTask extends\
  \ AsyncTask<String, Void, String> {\n        @Override\n        protected void onPreExecute()\
  \ {}\n        @Override\n        protected String doInBackground(String... params)\
  \ {}\n        @Override\n        protected void onProgressUpdate(Void... values)\
  \ {}\n        @Override\n        protected void onPostExecute(String result) {}\n\
  \    }\n}\n```\n\n`AsyncTask` 类使用了不同的类型，在类签名行中声明：`private class MyTask extends AsyncTask<Type\
  \ 1, Type 2, Type 3>`。这三个类型分别对应 `doInBackground()`、`onProgressUpdate()` 和 `onPostExecute()`\
  \ 方法。如果方法不期望参数，则使用 `Void`。为了更改方法的参数类型，需要在类声明和方法签名中进行更改，如下：\n\n```java\nprivate class\
  \ MyTask extends AsyncTask<String, Integer, String> {\n    @Override\n    protected\
  \ void onPreExecute() {}\n    @Override\n    protected String doInBackground(String...\
  \ params) {}\n    @Override\n    protected void onProgressUpdate(Integer... values)\
  \ {}\n    @Override\n    protected void onPostExecute(String result) {}\n}\n```\n\
  \n`onPreExecute()` 方法在后台任务启动之前调用，在主线程上运行，可以用于初始化步骤。`onPostExecute()` 方法在 `doInBackground()`\
  \ 方法完成后调用，在主线程上运行，可以用于更新用户界面。`onProgressUpdate()` 方法在每次从 `doInBackground()` 方法调用时被调用，可以用于进度信息更新用户界面。\n\
  \n第一步将强调在单独线程中执行耗时任务的重要性。从欢迎屏幕选择 Start new Android project 快速选项，并在结果的项目对话框中点击 Next\
  \ 按钮之前选择 Empty Activity 模板。在 Name 字段输入 `AsyncTask` 并指定 `com.ebookrenzy.asyncdemo`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将语言设置为\
  \ Java。\n\n使用这种方法并行执行的任务数量受设备上核心池大小的限制，由可用 CPU 的数量决定：`int cpu_cores = Runtime.getRuntime().availableProcessors();`\n\
  \nAndroid 使用算法计算默认池线程数。最小线程数为 2，而最大默认值等于 4 或核心数减 1（以较小者为准）。\n\n### 6 测试应用程序\n\n\
  应用程序现在运行时，点击按钮会导致延迟在新线程中执行，让主线程继续处理用户界面，包括响应额外的按钮点击。在延迟期间，用户界面每秒更新一次计数器值。超时结束后，TextView\
  \ 将显示“Button Pressed”消息。\n\n### 7 取消任务\n\n运行的任务可以通过调用任务对象的 `cancel()` 方法来取消，传递一个布尔值指示在进行中的任务完成之前是否可以中断：\n\
  \n```java\nAsyncTask task = new MyTask().execute();\ntask.cancel(true);\n```\n\n\
  ### 8 总结\n\n本章提供了 Android 应用程序中线程的概述。当应用程序首次在进程中启动时，运行时创建一个主线程，所有随后启动的组件默认在该线程运行。主线程的主要作用是处理用户界面，因此在该线程中执行任何耗时任务都会让应用程序看起来卡死。因此，可能需要时间完成的任务必须在单独线程中启动。因为\
  \ Android 用户界面工具不是线程安全的，不应在主线程之外的线程中更改用户界面。后台任务可以通过子类化 `AsyncTask` 类并实现执行任务和更新用户界面的类方法在单独线程中执行。\n\
  \n## 7 Android 启动和绑定服务概述\n\nAndroid Service 类专门设计允许应用程序启动并执行后台任务。与广播接收器不同（广播接收器旨在快速执行任务然后退出），服务设计用于执行需要很长时间的任务（例如通过互联网连接下载文件或向用户流式传输音乐但不需要用户界面。在本章中，将概述提供的不同服务类型，包括启动服务（started\
  \ services）、绑定服务（bound services）和意图服务（intent services）。涵盖这些基础知识后，后续章节将介绍广播意图的示例。\n\
  \n### 7.1 启动服务\n\n启动服务是通过带有 `Intent` 的发送的，`Intent` 包含了服务所需的信息。启动服务适用于不需要返回结果的任务，例如下载文件或向服务器上传数据。如果服务需要结果，则应该使用绑定服务或\
  \ `JobService` 的子类。\n\n### 7.2 绑定服务\n\n绑定服务与启动服务类似，但启动服务通常不返回结果也不允许与组件交互。另一方面，通过实现进程间通信（IPC），这种交互也可以跨进程边界进行。活动可能会启动一个服务来处理音频播放。该活动极有可能包含一个用户界面，为用户提供暂停播放或跳到下一曲的控制。同样，服务很可能需要向活动通信，以指示当前音频轨道已完成并提供下一曲的详细信息。\n\
  \n\n\n\n\n注意，`IntentService` 类包含了其 `onStartCommand()` 和 `onBind()` 回调方法的实现，因此不需要在子类中重新实现这些方法。\n\
  \n### 5. 控制已销毁的服务重启选项\n\n`onStartCommand()` 回调方法需要返回一个整数值，以定义当服务被 Android 运行时系统销毁时，应该如何处理该服务。这些可能的返回值如下：\n\
  \n- \n- \n- \n\n\n\n\n\n# 57.6 在清单文件中声明服务\n\n为了使服务（service）可用，必须首先在清单文件（manifest\
  \ file）中声明。这涉及将配置适当的 `<service>` 元素嵌入现有的 `<application>` 条目中。至少`<service>` 元素必须包含一个声明服务类名的属性，如下所示\
  \ XML 片段所示：\n\n```xml\n<manifest>\n  <application android:icon=\"@mipmap/ic_launcher\"\
  \ android:label=\"@string/app_name\">\n    <activity android:label=\"@string/app_name\"\
  \ android:name=\".MainActivity\">\n      <intent-filter>\n        <action android:name=\"\
  android.intent.action.MAIN\" />\n        <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n      </intent-filter>\n    </activity>\n    <service android:name=\"MyService\"\
  ></service>\n  </application>\n</manifest>\n```\n\n默认情况下，服务被声明为公开的，这意味着它们可以被所在应用程序包之外的组件访问。为了将服务设置为私有，必须在清单文件的\
  \ `<service>` 元素中将 `android:exported` 属性声明为 `false`。例如：\n\n```xml\n<service android:name=\"\
  MyService\" android:exported=\"false\"></service>\n```\n\n如之前讨论过的，服务默认在与调用组件相同的进程中运行。为了强制服务运行在自己的进程中，请向\
  \ `<service>` 元素添加 `android:process` 属性，并声明一个以冒号（:`）为前缀的进程名称：\n\n```xml\n<service\
  \ android:name=\"MyService\" android:exported=\"false\" android:process=\":myprocess\"\
  ></service>\n```\n\n冒号前缀表示新进程是本地应用程序私有的。如果进程名称以小写字母而不是冒号开头，该进程将是全局的并供其他组件使用。\n\n\
  最后，使用与活动相同的意图过滤器（intent filter）机制，服务还可以向设备上运行的其他应用程序发布功能。有关意图过滤器的更多细节，请参阅“Android\
  \ Intent 概述”章节。\n\n# 57.7 在系统启动时启动运行的服务\n\n考虑到服务的后台性质，在基于 Android 系统首次启动时需要启动服务并不罕见。这可以通过创建一个广播接收器（broadcast\
  \ receiver）来实现，该接收器配置了意图过滤器，以监听系统 `android.intent.action.BOOT_COMPLETED` 意图。当检测到此类意图时，广播接收器只需调用必要的服务然后返回。请注意，为了运行，此类广播接收器需要请求\
  \ `android.permission.RECEIVE_BOOT_COMPLETED` 权限。\n\n# 57.8 总结\n\nAndroid 服务是一种强大的机制，允许应用程序在后台执行任务。服务一旦启动，无论调用应用程序是否为前台任务，它都将继续运行，即使在启动服务的组件被销毁的情况下也是。\n\
  \n服务继承自 `Android Service` 类，并分为启动服务（started services）或绑定服务（bound services）两类。启动的服务会一直运行直到被停止或销毁，并且它们本身不提供提供与其他组件进行交互或数据交换的机制。另一方面，绑定服务为其他客户端组件提供了通信接口，并且通常一直运行到最后一个客户端从服务解绑为止。\n\
  \n默认情况下，服务在与调用应用程序相同的进程和主线程中本地运行。因此，应该在服务内部创建一个新线程用于处理 CPU 密集型任务。通过对应用程序清单文件中对应的\
  \ `<service>` 条目进行细小的配置更改，可以在单独的进程中启动远程服务。\n\n`IntentService` 类（本身是 `Android Service`\
  \ 类的子类）为在单独的辅助线程中处理异步服务请求提供了一种方便的机制。\n\n# 58. 实现一个 Android 启动服务 – 实例示例\n\n上一章涵盖了大量与\
  \ Android 服务相关的信息，到此时，服务的概念可能看起来有些无从从心。为了加强上一章中的信息，本章将通过一个 Android Studio 教程，旨在逐步引入启动服务的实现概念。\n\
  \n在本章中，将创建一个示例应用程序并将其作为实现 Android 服务的基础。首先，服务将使用 `IntentService` 类创建。随后，该示例将进行扩展，以演示\
  \ `Service` 类的使用。最后，将实现在使用 `Service` 类时在单独线程中执行任务的步骤。在本章涵盖启动服务后，下一章（标题为“Android\
  \ 本地绑定服务 – 实例示例”）将关注绑定服务的实现和客户端-服务的通信。\n\n## 58.1 创建示例项目\n\n从欢迎界面选择“Start a new\
  \ Android Studio project”（启动新的 Android Studio 项目）快速启动选项，在出现的新项目对话框中，点击 `Next`（下一步）按钮之前选择\
  \ `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `ServiceExample`，并指定 `com.ebookfrenzy.serviceexample`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 Minimum API level 设置更改为 `API 26`: `Android 8.0 (Oreo)`，并将\
  \ `Language`（语言）菜单设置为 `Java`。\n\n## 58.2 创建服务类\n\n在编写代码之前，第一步是向项目添加一个新类来包含服务。教程中演示的第一种服务将基于\
  \ `IntentService` 类。如上一章所述，`IntentService` 类的目的是为开发者提供一种方便的机制，用于创建在调用应用程序单独线程中异步执行任务的服务。\n\
  \n通过右键点击 `app -> java` 下的 `com.ebookfrenzy.serviceexample` 包名并选择 `New -> Java Class`，向项目添加新类。在\
  \ Create New Class 对话中，将新类命名为 `MyIntentService`。最后点击 `OK` 按钮创建类。查看 Android Studio\
  \ 编辑器中的 `MyIntentService.java` 文件，其内容应如下：\n\n```java\npackage com.ebookfrenzy.serviceexample;\n\
  public class MyIntentService {}\n```\n\n需要修改该类以继承 `IntentService` 类。在继承 `IntentService`\
  \ 类时，必须遵循两个规则：首先，必须实现类的构造函数并传递服务的类名；其次，类必须重写 `onHandleIntent()` 方法。修改 `MyIntentService.java`\
  \ 文件中的代码，其内容如下：\n\n```java\npackage com.ebookfrenzy.serviceexample;\nimport android.app.IntentService;\n\
  import android.content.Intent;\nimport android.util.Log;\npublic class MyIntentService\
  \ extends IntentService {\n    private static final String TAG =\"ServiceExample\"\
  ;\n    public MyIntentService() {\n    }\n    // 注意：此处应有 onHandleIntent 的重实现\n}\n\
  ```\n\n## 58.3 将服务添加到清单文件\n\n在调用服务之前，必须先将其添加到所属应用程序的清单文件中。至少涉及添加一个带有服务类名的 `<service>`\
  \ 元素。双击当前项目的 `AndroidManifest.xml` (`app -> manifests`) 将其加载到编辑器，并修改 XML 添加服务：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\" package=\"com.ebookfrenzy.serviceexample\"\
  >\n  <application android:allowBackup=\"true\" android:icon=\"@mipmap/ic_launcher\"\
  \ android:label=\"@string/app_name\" android:supportsRtl=\"true\" android:theme=\"\
  @style/AppTheme\">\n    <activity android:name=\".MainActivity\">\n      <intent-filter>\n\
  \        <action android:name=\"android.intent.action.MAIN\" />\n        <category\
  \ android:name=\"android.intent.category.LAUNCHER\" />\n      </intent-filter>\n\
  \    </activity>\n    <service android:name=\".MyIntentService\" />\n  </application>\n\
  </manifest>\n```\n\n## 58.4 启动服务\n\n现在服务已并在清单文件中声明，下一步是在应用程序启动时启动服务的代码。通常情况下，此类代码的理想位置是活动类的\
  \ `onCreate()` 方法（在本例中 `MainActivity.java` 文件中找到）。找到并加载该文件，修改 `onCreate()` 方法以添加启动代码：\n\
  \n```java\npackage com.ebookfrenzy.serviceexample;\nimport android.support.v7.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.content.Intent;\npublic class MainActivity\
  \ extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_service_example);\n\
  \        Intent intent = new Intent(this, MyIntentService.class);\n        startService(intent);\n\
  \    }\n}\n```\n\n添加的代码需要做的只是创建一个带有要启动的服务类名的 `Intent` 对象，然后将其作为 `startService()`\
  \ 方法的参数。\n\n## 58.5 测试 IntentService 示例\n\n基于 `IntentService` 的服务示例现在已完成并准备就。由于服务显示的消息将出现在\
  \ Logcat 面板中，因此在 Android Studio 环境中进行配置很重要。\n\n首先显示 Logcat 工具窗口，然后点击面板右上角的菜单（可能显示为\
  \ Show only selected application）。从该菜单中选择 Edit Filter Configuration（编辑过滤器配置）选项。\n\
  \n在 Create New Logcat Filter 对话中将过滤器命名为 `ServiceExample`，并在 `by Log Tag` 字段中输入 `MainActivity.java`\
  \ 中声明的 `TAG` 值（在上面的代码示例中为 `ServiceExample`）。\n\n更改完成后，点击 `OK` 按钮创建过滤器并关闭对话框。Android\
  \ 工具窗口中现在应该选择了新创建的过滤器。配置过滤器后，在物理设备或 AVD 模拟器上运行应用程序，注意 Logcat 面板中出现了“Intent Service\
  \ Started”消息。注意，在应用程序启动后可能需要将过滤器设置改回 `ServiceExample`：\n\n`06-29 09:05:16.887 3389-3948/com.ebookfrenzy.serviceexample\
  \ I/ServiceExample: Intent Service started`\n\n如果服务被分配了一项长期活动，服务将在单独线程中继续后台运行直到任务完成，允许应用程序继续运行并响应用户。由于我们的服务只是记录了一条条消息，它在完成后将简单地停止。\n\
  \n## 58.6 使用服务类\n\n虽然 `IntentService` 类允许实现服务，但在某些情况下需要 `Service` 类的灵活性同步性。正如本章将所示，为了避免在调用应用程序的相同线程中执行耗时任务，此地创建的示例将在新线程运行运行。\n\
  \n## 58.7 创建新服务\n\n出于本示例的目的，将向项目添加一个继承 `Service` 类的新类。因此，右键点击 `app -> java` 下的 `com.ebookfrenzy.serviceexample`\
  \ 包名并选择 `New -> Service` 菜单。创建一个名为 `MyService` 的类，并勾选 `Exported` 和 `Enabled` 选项。一旦实现了\
  \ `Service` 类，下一步是为新服务实现处理类。这通过扩展 `Handler` 类并实现 `handleMessage()` 方法来实现。当从客户端接收到消息时，该方法将被调用，传递一个客户端需要传递给服务的\
  \ `Message` 对象。一旦实现，修改后的 `RemoteService.java` 文件应如下：\n\n```java\npackage com.ebookfrenzy.serviceexample;\n\
  import android.app.Service;\nimport android.content.Intent;\nimport android.os.IBinder;\n\
  import android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Message;\n\
  import android.widget.Toast;\n\npublic class RemoteService extends Service {\n \
  \   public RemoteService() {}\n\n    class IncomingHandler extends Handler {\n \
  \       @Override\n        public void handleMessage(Message msg) {\n          \
  \  Bundle data = msg.getData();\n            String dataString = data.getString(\"\
  MyString\");\n            Toast.makeText(getApplicationContext(),dataString, Toast.LENGTH_SHORT).show();\n\
  \        }\n    }\n\n    @Override\n    public IBinder onBind(Intent intent) {\n\
  \        // TODO: 返回通信通道\n        throw new UnsupportedException(\"Not implemented\"\
  );\n    }\n}\n```\n\n等待，提供的文本在命名上存在不一致（RemoteService vs MyService）。我将遵循提供的文本结构。\n\
  \n服务代码唯一剩余的任务是修改 `onBind()` 方法，使其返回一个包含 `Messenger` 对象的 `IBinder` 对象，该对象引用了处理器：\n\
  \n```java\nfinal Messenger myMessenger = new Messenger(new IncomingHandler());\n\
  @Override\npublic IBinder onBind(Intent intent) {\n    return myMessenger.getBinder();\n\
  }\n```\n\n服务完成后，加载 `AndroidManifest.xml` 文件并验证 Android Studio 已添加新服务的适当条目，其应如下：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\" package=\"com.ebookfrenzy.serviceexample\"\
  >\n  <application android:allowBackup=\"true\" android:icon=\"@mipmap/ic_launcher\"\
  \ android:label=\"@string/app_name\" android:supportsRtl=\"true\" android:theme=\"\
  @style/AppTheme\">\n    <activity android:name=\".MainActivity\">\n      <intent-filter>\n\
  \        <action android:name=\"android.intent.action.MAIN\" />\n        <category\
  \ android:name=\"android.intent.category.LAUNCHER\" />\n      </intent-filter>\n\
  \    </activity>\n    <service android:name=\".RemoteService\" android:enabled=\"\
  true\" android:exported=\"true\" />\n  </application>\n</manifest>\n```\n\n## 58.8\
  \ 修改用户界面\n\n正如应用程序运行时所示，未为服务创建新线程会导致严重的用用问题。为了充分理解此问题的严重，需要在 `MainActivity` 的用户界面上添加一个\
  \ `Button` 视图，并配置它在用户“点击”时调用方法。\n\n在 Project 窗口中找到并加载 `activity_main.xml` 文件 (`app\
  \ -> res -> layout -> activity_main.xml`)。删除 `TextView` 并向布局添加一个 `Button` 视图。选择新按钮，将文本改为“Start\
  \ Service”并将字符串提取到名为 `start_service` 的资源。在 `Button` 仍被选中的，在 Attributes 面板中找到 `onClick`\
  \ 属性并将其分配给名为 `buttonClick` 的方法。\n\n接下来，编辑 `MainActivity.java` 文件添加 `buttonClick()`\
  \ 方法，并移除之前添加到 `onCreate()` 方法中启动 `MyIntentService` 服务的代码：\n\n```java\npackage com.ebookfrenzy.serviceexample;\n\
  import android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\nimport\
  \ android.content.Intent;\nimport android.view.View;\npublic class MainActivity\
  \ extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_service_example);\n\
  \    }\n    public void buttonClick(View view){\n        Intent intent = new Intent(this,\
  \ MyIntentService.class);\n        startService(intent);\n    }\n}\n```\n\n`buttonClick()`\
  \ 方法需要做的只是创建一个带有要启动的服务类名的 `Intent` 对象，然后将其作为 `startService()` 方法的参数。\n\n## 58.9\
  \ 运行应用程序\n\n运行应用程序并在加载后点击`Start Service`按钮。在 Logcat 工具窗口中（使用之前创建的 `ServiceExample`\
  \ 过滤器），将出现调用了 `onCreate()` 方法且 `onStartCommand()` 方法正在执行的消息。在循环消息出现之前，尝试再次点击`Start\
  \ Service`按钮。注意按钮无响应。大约 20 秒后，系统可能会显示包含“ServiceExample isn’t responding”的警告对话。原因是应用程序的主线程正被执行循环的服务所占用。这不仅阻止了应用程序响应用户，也导致了系统以某种方式锁死。显然，服务的代码需要修改，以便在单独线程中执行任务。\n\
  \n## 58.10 为任务创建 AsyncTask\n\n如“Threads and AsyncTasks 概述”所述，当 Android 应用程序首次启动时，运行时系统创建一个所有应用程序组件默认运行的单线程。该线程通常被称为\
  \ `main thread`（主线程）。主线程的主要作用是处理用户界面的事件处理和用户界面交互。如上一节所示，在应用程序启动的任何额外组件默认也会在主线程上运行。在主线程上执行耗时操作会导致应用程序变得无响应。因此，Android\
  \ 提供了一个允许应用程序创建和使用额外线程的 API。解决此问题的简单方法是在 `AsyncTask` 实例中执行服务任务：\n\n```java\nimport\
  \ android.os.AsyncTask;\nprivate class SrvTask extends AsyncTask<Integer, String>\
  \ {\n    @Override\n    protected String doInBackground(Integer... params) {\n \
  \       int startId = params[0];\n        int i = 0;\n        while (i <= 3) {\n\
  \            try {\n                Thread.sleep(10000);\n                i++;\n\
  \            } catch (Exception e) {}\n        }\n        return \"Service running\
  \ \" + startId;\n    }\n    @Override\n    protected void onPostExecute(String result)\
  \ {\n        Log.i(TAG, result);\n    }\n}\n```\n\n为了向应用添加此支持，修改 `MyService.java`\
  \ 以创建一个包含 `onStartCommand()` 方法代码的 `AsyncTask` 子类：\n\n```java\n@Override\npublic\
  \ int onStartCommand(Intent intent, int flags, int startId) {\n    AsyncTask task\
  \ = new SrvTask();\n    task.executeOnExecutor(AsyncTask.THREAD_POOL_EXECUTOR, startId);\n\
  \    return Service.START_STICKY;\n}\n```\n\n现在运行应用程序，应该可以多次点击 Start 按钮。这样做时，Logcat\
  \ 输出指示多个运行的任务：\n\n`ServiceExample: Service Running 1`\n`ServiceExample: Service\
  \ Running 2`\n`ServiceExample: Service Running 3`\n`ServiceExample: Service Running\
  \ 4`\n`ServiceExample: Service Running 5`\n`ServiceExample: Service Running 6`\n\
  \n由于服务现在主线程之外处理请求，应用程序对用户和 Android 系统保持响应。\n\n# 58.11 总结\n\n本章通过 `IntentService`\
  \ 和 `Service` 类实现了 Android 启动服务的示例。示例还演示了在服务中使用异步任务以避免应用程序主线程无响应。\n\n# 59 Android\
  \ 本地绑定服务 – 实例示例\n\n如前章节详细所述，绑定服务与启动服务不同，提供了一种在 Android 服务与一个多个客户端组件之间实现通信的机制。本章的目标是在“Android\
  \ Started and Bound Services 概述”提供的概述基础上，开始本地绑定服务的运行示例。\n\n## 59.1 理解绑定服务\n\n与启动服务相同，绑定服务允许应用程序在后台执行任务。然而，与启动服务不同，多个客户端组件可以绑定到一个服务，并在绑定后使用各种不同的机制与该服务交互。\n\
  \n绑定服务作为 `Android Service` 类的子类创建，并且至少必须实现 `onBind()` 方法。客户端组件通过调用 `bindService()`\
  \ 方法绑定服务。对绑定服务的首次绑定请求将导致调用服务的 `onBind()` 方法（随后的绑定请求不会触发 `onBind()` 调用）。想要绑定服务的客户端还必须实现\
  \ `ServiceConnection` 子类，包含 `onServiceConnected()` 和 `onServiceDisconnected()` 方法，这些方法将在客户端-服务器连接建立或断开后分别调用。在\
  \ `onServiceConnected()` 方法的情况下，将传递一个 `IBinder` 对象，其中包含了客户端与服务交互所需的信息。\n\n## 59.2\
  \ 绑定服务交互选项\n\n实现客户端组件与绑定服务之间交互有两种推荐的机制。如果绑定服务是本地的且与客户端组件属于同一个应用程序（也就是说，它在相同的进程中运行并且对其他应用程序的组件可用），推荐的方法是创建一个\
  \ `Binder` 类的子类并扩展它以为服务提供接口。然后由 `onBind()` 方法返回该 `Binder` 对象的实例，客户端组件直接访问服务内部的方法和数据。\n\
  \n在服务不是本地的情况下（也就是说它在与客户端不同的进程中运行），最佳交互是使用 `Messenger/Handler` 实现。在本章的剩余部分，将创建一个示例以演示创建、启动和与本地私有绑定服务的步骤。\n\
  \n## 59.3 Android Studio 本地绑定服务示例\n\n本章的示例由一个活动和一个绑定服务组成。绑定服务的目的是从系统获取当前时间并将该信息显示给用户。\n\
  \n从欢迎界面选择“Start a new Android Studio project”（启动新的 Android Studio 项目）快速启动选项，在出现的新项目对话框中，点击\
  \ `Next`（下一步）按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `LocalBound` 并指定 `com.ebookfrenzy.localbound`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 Minimum API level 设置更改为 `API 26`: `Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。\n\n一旦项目创建，下一步是添加一个类作为绑定服务。\n\n## 59.4 将绑定服务添加到项目\n\n\
  要向项目添加新类，右键点击 `app -> java` 下的 `com.ebookfrenzy.localbound` 包名并选择 `New -> Service\
  \ -> Service` 菜单。指定 `BoundService` 为类名，并在点击 `Finish` 创建类之前确保勾选了 `Exported` 和 `Enabled`\
  \ 选项。\n\n```java\npackage com.ebookfrenzy.localbound;\nimport android.app.Service;\n\
  import android.content.Intent;\nimport android.os.IBinder;\n\npublic class BoundService\
  \ extends Service {\n    public BoundService() {}\n    @Override\n    public IBinder\
  \ onBind(Intent intent) {\n        // TODO: 返回通信通道\n        throw new UnsupportedException(\"\
  Not implemented\");\n    }\n}\n```\n\n## 59.5 实现 Binder\n\n如之前所述，绑定服务通过向客户端传递配置适当的\
  \ `Binder` 对象来与绑定客户端通信。这是通过在服务类中创建一个 `Binder` 子类并扩展一个或多个可以被客户端调用的方法来实现。\n\n```java\n\
  package com.ebookfrenzy.localbound;\nimport android.app.Service;\nimport android.content.Intent;\n\
  import android.os.IBinder;\nimport java.text.SimpleDateFormat;\nimport java.util.Date;\n\
  import java.util.Locale;\nimport android.util.Log;\n\npublic class BoundService\
  \ extends Service {\n    private final IBinder myBinder = new MyLocalBinder();\n\
  \    public BoundService() {}\n    @Override\n    public IBinder onBind(Intent intent)\
  \ {\n        return myBinder;\n    }\n    public String getCurrentTime() {\n   \
  \     SimpleDateFormat dateformat = new SimpleDateFormat(\"HH:mm:ss MM/dd/yyyy\"\
  ,Locale.US);\n        return (dateformat.format(new Date()));\n    }\n    class\
  \ MyLocalBinder extends android.os.Binder {\n        BoundService getService() {\n\
  \            return (BoundService)BoundService.this;\n        }\n    }\n}\n```\n\
  \n## 59.6 将客户端绑定到服务\n\n对于本教程，客户端是运行应用程序的 `MainActivity` 实例。如之前所述，为了成功绑定服务并接收服务 `onBind()`\
  \ 方法返回的 `IBinder` 对象，需要创建一个 `ServiceConnection` 子类并实现 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 回调方法。编辑 `MainActivity.java` 文件并修改如下：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  import android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\nimport\
  \ android.os.IBinder;\nimport android.content.Context;\nimport android.content.Intent;\n\
  import android.content.ComponentName;\nimport android.content.ServiceConnection;\n\
  import com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\npublic class MainActivity\
  \ extends AppCompatActivity {\n    BoundService myService;\n    boolean isBound\
  \ = false;\n    private ServiceConnection myConnection = new ServiceConnection()\
  \ {\n        @Override\n        public void onServiceConnected(ComponentName className,\
  \ IBinder service) {\n            MyLocalBinder binder = (MyLocalBinder) service;\n\
  \            myService = binder.getService();\n            isBound = true;\n   \
  \     }\n        @Override\n        public void onServiceDisconnected(ComponentName\
  \ name) {\n            isBound = false;\n        }\n    };\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_local_bound);\n        Intent intent =\
  \ new Intent(this, BoundService.class);\n        bindService(intent, myConnection,\
  \ Context.BIND_AUTO_CREATE);\n    }\n}\n```\n\n## 59.7 完成示例\n\n剩余的是实现一种调用 `getCurrentTime()`\
  \ 方法并将结果显示给用户的机制。按照现在的惯例，Android Studio 将为该活动创建一个 `activity_main.xml` 文件，其中仅包含一个\
  \ `TextView`。将此文件加载到布局编辑器中，使用设计模式，选择 `TextView` 组件并将 ID 更改为 `myTextView`。在 `TextView`\
  \ 下方添加一个 `Button` 视图，并将按钮文本改为“Show Time”。将字符串提取到名为 `show_time` 的资源。通过选择 `Button`\
  \ 并配置 `onClick` 属性来调用名为 `showTime` 的方法来完成用户界面设计。最后，在 `MainActivity.java` 文件中编辑代码以实现\
  \ `showTime()` 方法：\n\n```java\npackage com.ebookfrenzy.localbound;\nimport android.support.v7.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.os.IBinder;\nimport android.content.Context;\n\
  import android.content.Intent;\nimport android.content.ComponentName;\nimport android.content.ServiceConnection;\n\
  import com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    BoundService myService;\n\
  \    boolean isBound = false;\n    private ServiceConnection myConnection = new\
  \ ServiceConnection() {\n        @Override\n        public void onServiceConnected(ComponentName\
  \ className, IBinder service) {\n            MyLocalBinder binder = (MyLocalBinder)\
  \ service;\n            myService = binder.getService();\n            isBound =\
  \ true;\n        }\n        @Override\n        public void onServiceDisconnected(ComponentName\
  \ name) {\n            isBound = false;\n        }\n    };\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_local_bound);\n        Intent intent =\
  \ new Intent(this, BoundService.class);\n        bindService(intent, myConnection,\
  \ Context.BIND_AUTO_CREATE);\n    }\n    public void showTime(View view) {\n   \
  \     if (isBound) {\n            String currentTime = myService.getCurrentTime();\n\
  \            TextView myTextView = (TextView)findViewById(R.id.myTextView);\n  \
  \          myTextView.setText(currentTime);\n        }\n    }\n}\n```\n\n# 59.8\
  \ 总结\n\n直接回复功能允许用户在通知内输入文本，并通过意图传递给相应的活动。直接回复通过 `RemoteInput` 类实现，该类的一个实例可以嵌入通知中。在处理回复通知时，重要的是让\
  \ `NotificationManager` 知道已收到回复。这种最佳方法是使用首次通知时提供的通知 ID 更新通知消息。\n\n# 61 Android 通知\
  \ 教程\n\n通知提供了一种在应用程序未运行或当前处于后台时向用户传递消息的方式。通知出现在状态栏和通知抽屉中。本地通知由运行的应用程序触发，而远程通知由远程服务器发起并传递给设备。\n\
  \n（等待，文本继续...)\n\n# 63 Android 多窗口支持简介\n\nAndroid 7 引入了多窗口支持形式的新功能。与 Android 之前的版本不同，多窗口支持允许在设备屏幕上同时显示多个活动。在本章中，将从用户和应用程序两个视角提供多窗口模式的概述。\n\
  \n## 63.1 分屏、自由屏和画中画模式\n\nAndroid 中的多窗口支持提供了不同形式的支持。分屏模式在大多数手机和平板设备上可用，提供了一个分屏环境，两个活动并排或上下显示。它提供了一个可移动的分割线，用户拖动它可以调整每个相邻活动占屏幕的比例。自由屏模式在屏幕较大的设备上提供了窗口环境，目前由设备制造商决定启用。自由屏与分屏模式的区别在于，它允许每个活动出现在独立的可调整大小窗口中，并且不限于同时显示两个活动。画中画支持正如名称所示，允许在用户执行其他任务时在较小的窗口中继续视频播放。目前此功能仅在\
  \ Android TV 上可用，因此不在本书的范围内。\n\n## 63.2 进入多窗口\n\n可以通过长按正方形 Overview 按钮直到显示切换模式进入分屏模式。一旦进入分屏模式，Overview\
  \ 按钮将变为显示两个矩形，当前活动占据屏幕的一半。Overview 屏幕出现在另一半屏幕，允许选择第二个活动进行显示。或者，可以通过显示 Overview 屏幕、长按列表应用程序的标题栏，然后将应用程序释放到屏幕的高亮区域来进入分屏模式。要退出分屏模式，只需将分离两个活动的分割线拖到边缘，使一个活动充满屏幕。\n\
  \n## 63.3 启用自由屏支持\n\n尽管在所有设备上都没有正式支持，但在大屏幕设备和模拟器上启用自由屏多窗口模式。要启用此模式，请在模拟器运行或设备已连接时运行以下\
  \ `adb` 命令：\n\n`adb shell settings put global enable_freeform_support 1`\n\n在做出更改后，可能需要重启设备设置才会生效。\n\
  \n\n\n\n\n* `android:defaultWidth` – 指定 activity 的默认宽度。\n* `android:defaultHeight`\
  \ – 指定 activity 的默认高度。\n* `android:gravity` – 指定 activity 的初始位置（start、end、left、right、top\
  \ 等）。\n\n注意，上述属性仅当 activity 在自由窗口模式（freeform mode）下显示时才生效。以下示例配置了一个 activity，使其在屏幕边缘顶部以特定的高度和宽度显示：\n\
  \n```xml\n<activity android:name=\".MainActivity \"><layout android:defaultHeight=\"\
  350dp\"android:defaultWidth=\"450dp\"android:gravity=\"start|end\" /></activity>\n\
  ```\n\n可以使用以下 `<layout>` 属性指定 activity 在分屏模式（split-view）或自由窗口模式下可以缩小的最小宽度和高度：\n\n\
  * `android:minimalHeight` – 指定 activity 在分屏模式或自由窗口模式下可以缩小的最小最小高度。\n* `android:minimalWidth`\
  \ - 指定 activity 在分屏模式或自由窗口模式下可以缩小的最小最小宽度。\n\n当用户滑动分屏分割线越过最小高度或宽度边界时，系统将停止调整收缩中 activity\
  \ 布局的大小，并简单地裁剪用户界面为相邻的 activity 留空间。以下清单文件片段实现了 activity 的最小宽度和高度属性：\n\n```xml\n\
  <activity android:name=\".MainActivity \"><layout android:minimalHeight=\"400dp\"\
  android:minimalWidth=\"290dp\" /></activity>\n```\n\n## 63.7 在 Activity 中检测多窗口模式\n\
  \n在某些情况下，activity 可能需要检测其当前是否正以多窗口模式显示给用户看。可以通过调用 `Activity` 类的 `isInMultiWindowMode()`\
  \ 方法获取当前状态。当调用此方法时，它将根据 activity 当前是否为全屏返回 true 或 false 布值：\n\n```java\nif (this.isInMultiWindowMode())\
  \ {\n    // Activity 正在多窗口模式下运行\n} else {\n    // Activity 不在多窗口模式\n}\n```\n\n##\
  \ 63.8 接收多窗口通知\n\n如果 activity 重写了 `onMultiWindowModeChanged()` 回调方法，它将接收进入或退出多窗口模式的通知。传递给该方法的第一个参数在进入多窗口模式时为\
  \ true，在 activity 退出该模式时为 false。新的配置设置包含在作为第二个参数传递的 `Configuration` 对象中：\n\n```java\n\
  @Override\npublic void onMultiWindowModeChanged(boolean isInMultiWindowMode,Configuration\
  \ newConfig) {\n    super.onMultiWindowModeChanged(isInMultiWindowMode, newConfig);\n\
  \    if (isInMultiWindowMode) {\n        // Activity 进入多窗口模式\n    } else {\n   \
  \     // Activity 退出多窗口模式\n    }\n}\n```\n\n## 63.9 在多窗口模式下启动 Activity\n\n在本书的“Android\
  \ 显式意图——示例”章节中，创建了一个示例应用，其中 activity 使用 intent 启动了第二个 activity。默认情况下，通过 intent 启动的\
  \ activity 被认为与源 activity 处于同一个任务栈（task stack）中。然而，通过向 intent 传递适当标志，可以将 activity\
  \ 启动到新的任务栈中。\n\n当多窗口模式下的 activity 启动同一任务栈内的另一个 activity 时，新 activity 将替换分屏或自由窗口窗口中的源\
  \ activity（用户通过返回键回到原始 activity）。然而，当在分屏模式下启动到新的任务栈时，第二个 activity 将出现在原始 activity\
  \ 相邻的窗口中，允许两个 activity 同时可见。在自由窗口模式下，启动的 activity 将出现在与原始 activity 独立的窗口中。\n\n为了将\
  \ activity 启动到新的任务栈，必须在启动之前在 intent 上设置以下标志：\n\n* `Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT`\n\
  * `Intent.FLAG_ACTIVITY_MULTIPLE_TASK`\n* `Intent.FLAG_ACTIVITY_NEW_TASK`\n\n\n\n\
  \n\n例如，以下代码配置并启动了另一个设计在独立窗口中显示的 activity：\n\n```\nIntent i = new Intent(this, SecondActivity.class);\n\
  i.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|Intent.FLAG_ACTIVITY_MULTIPLE_TASK|Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  startActivity(i);\n```\n\n## 63.10 配置自由窗口 activity 的大小和位置\n默认情况下，在自由窗口（freeform）模式下启动到不同任务栈的\
  \ activity 将将位于屏幕中心，其大小由系统决定。通过通过 `ActivityOptions` 类向 intent 传递启动边界设置，可以控制此窗口的位置和尺寸。\n\
  \n此过程的第一步是创建一个 `Rect` 对象，并配置其代表 activity 窗口的矩形的左侧（X）、顶部（Y）、右侧（X）和底部（Y）坐标。例如，以下代码创建了一个\
  \ `Rect` 对象，其左上角位于坐标 (0, 0)，右下角位于 (100, 100)：\n\n```\nRect rect = new Rect(100,\
  \ 800, 900, 700);\n```\n\n下一步是创建 `ActivityOptions` 类的基本实例，并通过 `setLaunchBounds()`\
  \ 方法通过 `Rect` 设置对其初始化：\n\n```\nActivityOptions options = ActivityOptions.makeBasic();\n\
  ActivityOptions bounds = options.setLaunchBounds(rect);\n```\n\n最后，将 `ActivityOptions`\
  \ 实例转换为 `Bundle` 对象，并同 `Intent` 对象一起传递给 `startActivity()` 方法：\n\n```\nstartActivity(i,\
  \ bounds.toBundle());\n```\n\n将这些步骤结合起来，得到的代码序列如下：\n\n```\nIntent i = new Intent(this,\
  \ SecondActivity.class);\ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|Intent.FLAG_ACTIVITY_MULTIPLE_TASK|Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  Rect rect = new Rect(100, 800, 900, 700);\nActivityOptions options = ActivityOptions.makeBasic();\n\
  ActivityOptions bounds = options.setLaunchBounds(rect);\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n当源 activity 处于自由窗口模式时，通过 intent 启动第二个 activity，新的 activity 窗口将按照 `Rect` 对象中定义的位置和尺寸出现。\n\
  \n## 63.11 总结\nAndroid 7 引入了多窗口支持，该系统允许屏幕上任何时刻显示多个 activity。多窗口支持提供的三种模式是分屏（split-screen）、自由窗口（freeform）和画中画（picture-in-picture）。\n\
  \n- 在**分屏模式**下，屏幕被水平或垂直划分为两个窗格，每个窗格显示一个 activity。\n- **自由窗口模式**仅在某些 Android 设备上支持，允许每个\
  \ activity 在独立的、可移动且可调整大小的窗口中出现。\n- **画中画模式**仅在 Android TV 上可用，允许用户在执行其他任务时在小窗口中继续播放视频。\n\
  \n正如本章概述的那样，Android SDK 提供了许多方法和属性设置，用于检测、响应和控制应用内部的多窗口行为。\n\n## 64. Android Studio\
  \ 多窗口分屏与自由窗口教程\n在上一节涵盖了 Android 多窗口支持的基础知识后，本章将详细介绍在 Android 应用中实现多窗口支持的各个步骤。该项目将用于演示在多\
  \ activity 应用中配置和管理分屏及自由窗口行为的步骤。\n\n### 64.1 创建多窗口项目\n从欢迎界面选择 `Start a new Android\
  \ Studio project` 快速启动选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在\
  \ `Name` 字段中输入 `MultiWindow` 并指定 `com.ebookfrenzy.multiwindow` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单改为\
  \ `Java`。\n\n### 64.2 设计 MainActivity 用户界面\n用户界面需要由单个 `Button` 和一个 `TextView` 组成。在\
  \ Project 工具窗口中，导航到 `app -> res -> layout` 下的 `activity_main.xml` 布局文件并双击将其加载到 Layout\
  \ Editor 工具中。\n\n在启用 `Autoconnect` 模式的情况下，拖入一个 `Button` 对象并放在默认 `TextView` 下方。编辑\
  \ `Button` 上的文本使其显示为“Launch”。如果布局中缺少任何约束（constraints），只需点击 Layout Editor 工具栏上的 `Infer\
  \ Constraints` 按钮即可添加它们。完成这些步骤后，布局应类似于图 64-1 所示。\n\n在属性面板中，将 `TextView` 的控件 ID 更改为\
  \ `myTextView`，并为按钮分配一个 `onClick` 属性，以便在用户选择时调用名为 `launchIntent` 的方法。\n\n### 64.3\
  \ 添加第二个 Activity\n当用户点击第一个 activity 中的按钮时，将启动第二个 activity。通过右键点击 `app -> java` 下的\
  \ `com.ebookfrenzy.multiwindow` 包名，选择 `New -> Activity -> Empty Activity` 菜单选项显示新\
  \ Android Activity 对话框。\n\n在 `Activity Name` 和 `Title` 字段中输入 `SecondActivity`并将布局文件命名为\
  \ `activity_second`。由于此 activity 在应用程序启动时不会启动（而是通过 `MainActivity` 的 `intent` 启动），因此在点击\
  \ `Finish` 按钮之前，禁用 `Launcher Activity` 选项。\n\n打开第二个 activity 的布局（`app -> res ->\
  \ layout -> activity_second`），拖入一个 `TextView` 控件使其位于布局中心。编辑 `TextView` 的文本使其显示为“Second\
  \ Activity”。\n\n### 64.4 第二个 Activity\n下一步是在 `MainActivity.java` 文件中添加一些代码来实现 `launchIntent()`\
  \ 方法。编辑 `MainActivity.java` 文件并按如下方式实现：\n\n```java\npackage com.frenzy.multiwindow;\n\
  import android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\nimport\
  \ android.view.View;\nimport android.content.Intent;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_first);\n\
  \    }\n    public void launchIntent(View view) {\n        Intent i = new Intent(this,\
  \ SecondActivity.class);\n        startActivity(i);\n    }\n}\n```\n\n编译并运行应用，点击\
  \ Launch 按钮启动第二个 activity。\n\n### 64.5 启用多窗口模式\n编辑 `AndroidManifest.xml` 文件，按如下指令为应用启用多窗口支持：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\npackage=\"com.frenzy.multiwindow\"\
  >\n<application\n    android:allowBackup=\"true\"\n    android:icon=\"@mipmap/ic_launcher\"\
  \n    android:label=\"@string/app_name\"\n    android:supportsR=\"true\"\n    android:theme=\"\
  @style/AppTheme\">\n    <activity\n        android:name=\".MainActivity\"\n    \
  \    android:resizeable=\"true\" >\n        <intent-filter>\n            <action\
  \ android:name=\"android.intent.action.MAIN\" />\n            <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n        </intent-filter>\n    </activity>\n\
  \    <activity android:name=\".SecondActivity\"></activity>\n</application>\n</manifest>\n\
  ```\n\n注意，在编写时，多窗口支持默认开启。但为了完整性以及防止未来可能发生变化，建议执行上述步骤。\n\n### 64.6 测试多窗口支持\n再次构建运行应用，运行时按照上一节所述长按\
  \ Overview 按钮切换到分屏模式。从屏幕右半部分的 Overview 屏幕选择一个应用显示在相邻面板中。\n\n如果应用运行在支持自由窗口模式的设备或模拟器上，或者按照上一节启用了自由窗口模式，再次长按\
  \ Overview 按钮直到退出多窗口模式。再次点击 Overview 按钮，在生成的 Overview 屏幕中选择 MultiWindow 应用标题栏上的自由窗口按钮。一旦选择，activity\
  \ 将以自由窗口模式出现。\n\n### 64.7 在不同窗口启动第二个 Activity\n为了防止第二个 activity 替换第一个 activity，修改\
  \ `launchIntent()` 方法在不同的任务栈中启动第二个 activity：\n\n```java\npublic void launchIntent(View\
  \ view) {\n    Intent i = new Intent(this, SecondActivity.class);\n    i.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|Intent.FLAG_ACTIVITY_MULTIPLE_TASK|Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  \    startActivity(i);\n}\n```\n\n此更改后，重新运行应用，进入分屏模式并启动第二个 activity。第二个 activity\
  \ 现在应该出现在第一个 activity 的相邻面板中。重复上一节的步骤进入自由窗口模式，验证第二个 activity 出现在与第一个完全独立的窗口中。\n\n\
  ## 64.8 总结\n本章通过实现一个示例项目演示了在 Android 应用中启用和使用多窗口支持的一些基础知识。特别是，此示例重点关注了启用多窗口支持并将第二个\
  \ activity 启动到新的任务栈。\n\n## 65. Android SQLite 数据库概述\n不需要存储至少某些持久数据的移动应用寥寥无几。使用数据库是大多数应用的一个重要方面，从几乎完全由数据驱动的应用，到只需要存储少量数据（如游戏当前分）的应用。\n\
  \n在考虑到典型 Android 应用瞬即逝的生命周期时，持久性数据存储的重要性变得更加明显。由于 Android 运行时系统随时存在终止应用程序组件以释放资源的风险，因此，避免数据丢失的全面数据存储策略是任何应用开发策略设计和实现的关键因素。\n\
  \n本章将提供 SQLite 数据库管理系统的概述。\n\n### 65.1 理解数据库表\n表提供了数据库中最基础的数据结构。每个数据库可以包含多个表，每个表都设计用于持有特定类型的信息。数据库中的每个表都分配有一个名称，该名称在数据库中必须是唯一的。行（rows）有时也被称为记录（records）或条目（entries）。\n\
  \n### 65.2 引入数据库 Schema\nSchema 定义了数据库中数据的特征。Schema 还用于定义整个数据库的结构以及表之间的关系。\n\n###\
  \ 65.3 列和数据类型\n在此阶段，将数据库表视为电子表格是有帮助的，数据存储在行和列中。每一列定义了对应表中的某种类型的数据。\n\n### 65.4 数据库行\n\
  保存到表的每条新记录都存储在行中。每一行由关联的列组成。当向表中添加新数据时，会创建一个新行。\n\n### 65.5 引入主键\n每个数据库表应该包含一个或多个列，用于唯一标识表中的每一行。这在数据库术语中被称为主键（Primary\
  \ Key）。主键允许数据库管理系统识别表中的特定行。\n\n### 65.6 什么是 SQLite?\n正如前面，SQLite 是一个嵌入式关系型数据库管理系统（RDBMS）。大多数关系型数据库（如\
  \ Oracle、SQL Server 和 MySQL）是独立运行的进程。SQLite 被称为嵌入式，是因为它是以库的形式链接到应用程序中的。所有的数据库操作都在应用程序内部处理。\n\
  \n### 65.7 结构化查询语言 (SQL)\n在 SQLite 数据库中使用一种高级语言访问数据，称为结构化查询语言，缩写为 SQL（读作 sequel）。这是大多数关系型数据库系统使用的标准语言。SQLite\
  \ 基本符合 SQL-92 标准。\n\n### 65.8 在 Android 虚拟设备 (AVD) 上尝试 SQLite\nAndroid 预装了 SQLite，包括一个交互环境。要启动交互式\
  \ SQLite 会话，在 Android Studio 中启动 Android Device Manager，选择已配置的 AVD 并点击启动按钮。使用 `adb`\
  \ 命令行工具连接到模拟器：\n\n```bash\nadb -e shell\n```\n\n连接后，shell 环境将提供可以输入命令的提示符。通过 `su`\
  \ 命令获取超级用户权限：\n\n```bash\nroot@android:/\n```\n\n如果出现不允许超级用户权限的消息，创建一个新的 AVD 并在“Choose\
  \ device”屏幕上选择一个没有标记的设备。存储在 SQLite 数据库中的数据实际上存储在运行应用程序的 Android 设备的文件系统中。默认情况下，这些数据库文件的文件系统路径为：\n\
  `/data/data/<package name>/databases/<database filename>.db`\n\n例如，如果包名为 `com.example.MyDBApp`\
  \ 的应用创建了一个名为 `mydatabase.db` 的数据库，在设备上的文件路径将：\n`/data/data/com.example.MyDBApp/databases/mydatabase.db`\n\
  \n为了本次练习，在 `adb shell` 中切换目录到 `/data/data` 并创建一个适用于 SQLite 实验的子目录：\n\n```bash\n\
  cd /data/data\nmkdir com.example\ncd com.example\nmkdir databases\ncd databases\n\
  ```\n\n为数据库文件创建合适的位置后，如下启动交互式 SQLite 工具：\n\n```bash\nroot@android:/data/databases\
  \ # sqlite3 ./mydatabase.db\nSQLite version 3.8\n```\n\n输入 `.help` 查看提示。在 `sqlite>`\
  \ 提示符下，可以输入命令执行创建表等任务。例如，要在数据库中创建一个持有 ID、地址和电话号码的新表，需要以下语句：\n\n```sql\ncreate table\
  \ contacts(id integer primary key autoincrement, name text, address text, phone\
  \ text);\n```\n\n注意表中的每一行都应该有一个行唯一的主键。在上面的示例中，我们将 `id` 字段指定为主键，将其声明为 `integer` 类型，并要求\
  \ SQLite 在每次添加行时自动增加数字。这是确保每行都有主键的常用方法。在大多数其他平台上，主键名称的选择是任意的。但在 Android 中，为了能够使用所有\
  \ Android 相关类完全访问数据库，该键必须命名为 `_id`。要列出当前选择数据库中的表，使用 `.tables` 语句：\n\n```sql\n.tables\n\
  contacts\n```\n\n向表中插入记录：\n\n```sql\ninsert into contacts (name, address, phone)\
  \ values (\"Bill Smith\", \"123 Main Street, California\", \"123-555-2323\");\n\
  insert into contacts (name, address, phone) values (\"Mike Parks\", \"10 Upping\
  \ Street, Idaho\", \"444-444-1212\");\n```\n\n从表中检索所有行：\n\n```sql\nselect * from\
  \ contacts;\n```\n\n提取符合特定标准的行：\n\n```sql\nselect * from contacts where name=\"\
  Mike Parks\";\n```\n\n退出 sqlite3 环境：\n\n```sql\n.exit\n```\n\n\n\n\n\n1. 仓库与 `Room\
  \ Database` 交互以获取数据库实例，该实例随后被用于获取 `DAO` 实例的引用。\n2. 仓库创建实体实例并为其配置数据，然后将它们传递给 `DAO`，用于搜索和插入操作。\n\
  3. 仓库调用 `DAO` 的方法并传递要插入数据库的实体，同时接收查询返回的实体实例作为响应。\n4. 当 `DAO` 有结果需要返回给仓库时，它会将这些结果封装成实体对象。\n\
  5. `DAO` 与 `Room Database` 交互以启动数据库操作并处理结果。\n6. `Room Database` 处理所有与底层 `SQLite`\
  \ 数据库的低级交互，包括提交查询和接收结果。\n\n\n\n在涵盖了使用 Room 持久化库进行数据库访问的关键元素概述后，现在是时候详细探索实体（Entities）、DAO、Room\
  \ 数据库和仓库（Repositories）了。\n\n## 66.3 理解实体 (Entities)\n每个数据库表都将关联一个实体类。该类定义了表的结构，其形式为标准的\
  \ Java 类，并穿插了一些特殊的 Room 注解。一个声明要存储在数据库表中的数据的 Java 类示例如下：\n\n```java\npublic class\
  \ Customer {\n    private int id;\n    private String name;\n    private string\
  \ address;\n    public Customer(String name, String address) {\n        this.id\
  \ = id;\n        this.name = name;\n        this.address = address;\n    }\n   \
  \ public int getId() {\n        return this.id;\n    }\n    public String getName()\
  \ {\n        return this.name;\n    }\n    public int getAddress() {\n        return\
  \ this.address;\n    }\n    public void setId(int id) {\n        this.id = id;\n\
  \    }\n    public void setName(String name) {\n        this.name = name;\n    }\n\
  \    public void setAddress(int quantity) {\n        this.address = address;\n \
  \   }\n}\n```\n\n按照目前的实现，上述代码声明了一个基础 Java 类，包含若干表示数据库表字段的变量以及一组 getter 和 setter\
  \ 方法。然而，该类尚未还一个实体。要将此类转换为实体并使其能够在 SQL 语句中访问，需要按照如下所示添加一些 Room 注解：\n\n```java\n@Entity(tableName\
  \ = \"customers\")\npublic class Customer {\n    @PrimaryKey(autoGenerate = true)\n\
  \    @NonNull\n    @ColumnInfo(name = \"customerId\")\n    private int id;\n   \
  \ @ColumnInfo(name = \"customerName\")\n    private String name;\n    private string\
  \ address;\n    public Customer(String name, String address) {\n        this.id\
  \ = id;\n        this.name = name;\n        this.address = address;\n    }\n   \
  \ public int getId() {\n        return this.id;\n    }\n    public String getName()\
  \ {\n        return this.name;\n    }\n    public int getAddress() {\n        return\
  \ this.address;\n    }\n    public void setId(@NonNull int id) {\n        this.id\
  \ = id;\n    }\n    public void setName(String name) {\n        this.name = name;\n\
  \    }\n    public void setAddress(int quantity) {\n        this.address = address;\n\
  \    }\n}\n```\n\n上述注解通过声明该类代表一个实体并分配 `customers` 表名开始，这是 DAO SQL 语句中引用表的名称：\n\n\
  `@Entity(tableName = \"customers\")`\n\n每个数据库表都需要一个列作为主键。在这种情况下，`id` 被声明为主键。还添加了注解以便在\
  \ SQL 查询中分配列名，并指示该字段无法存储空值。最后，`id` 值被配置为自动生成。这意味着分配给新记录的 `id` 将由系统自动生成以避免冲突。\n\n\
  `@PrimaryKey(autoGenerate = true)`\n`@NonNull`\n`@ColumnInfo(name = \"customerId\"\
  )`\n`private int id;`\n\ncustomer name 字段也分配了列名。然而，`address` 字段没有分配列名，这意味着 `address`\
  \ 数据仍将存储在数据库中，但在 SQL 语句中不需要引用。如果实体中的某个字段不需要存储在数据库中，只需使用 `@Ignore` 注解：\n\n`@Ignore`\n\
  `private String address;`\n\n最后，`id` 变量 setter 方法被修改以防止分配空值：\n`public void setId(@NonNull\
  \ int id) {this.id = id;}`\n\n实体类中还可以包含注解，使用外键（foreign keys）概念与其他实体建立关系。外键允许表引用另一个表的主键。例如，可以在名为\
  \ `Purchase` 的实体与现有的 `Customer` 实体之间建立如下关系：\n\n```java\n@Entity(ForeignKeys = @ForeignKey(entity\
  \ = Customer.class, parentColumns = \"id\", childColumns = \"purchaseId\"))\npublic\
  \ class Purchase {\n    @PrimaryKey(autoGenerate = true)\n    @NonNull\n    @ColumnInfo(name\
  \ = \"purchaseId\")\n    private int id;\n    @ColumnInfo(name = \"name\")\n   \
  \ private String name;\n}\n```\n\n## 66.4 数据访问对象 (Data Access Objects)\n数据访问对象（DAO）提供了访问存储在\
  \ SQLite 数据库中的数据的方法。DAO 被声明为一个标准的 Java 接口，带有一些额外的注解，将 SQL 语句映射到方法，然后由仓库调用。\n\n第一步是创建接口并使用\
  \ `@Dao` 注解将其声明为 DAO：\n\n```java\n@Dao\npublic interface CustomerDao {}\n```\n\n\
  接下来添加包含 SQL 语句的对应方法。下面的声明允许通过调用 `getAllCustomers()` 方法检索 `customers` 表中的所有行：\n\n\
  ```java\n@Dao\npublic interface CustomerDao {\n    @Query(\"SELECT * FROM customers\"\
  )\n    LiveData<List<Customer>> getAllCustomers();\n}\n```\n\n注意 `getAllCustomers()`\
  \ 方法返回一个包含从数据库检索的每条记录的 `Customer` 对象。DAO 还使用了 `LiveData`，以便能够能够数据库的变化。参数也可以传递给方法并在\
  \ SQL 语句中引用。考虑以下搜索 customer 名的 DAO 声明，`WHERE` 条件中的列名分配给实体类：\n\n```java\n@Query(\"\
  SELECT * FROM customers WHERE name = :customerName\")\nList<Customer> findCustomer(String\
  \ customerName);\n```\n\n在此示例中，通过在变量名前加上冒号（`:`）将字符串值包含在 SQL 语句中。基础插入操作可以使用 `@Insert`\
  \ 方便注解声明如下，因为 Room 持久化库可以推断传递给 `addCustomer()` 方法的 `Customer` 实体要插入数据库，无需提供 SQL\
  \ 插入语句。多个数据库记录可以在单个事务中插入：\n\n```java\n@Insert\npublic void insertCustomers(Customer...\
  \ customers);\n```\n\n下面的 DAO 删除所有匹配提供的 customer 名的记录：\n\n```java\n@Query(\"DELETE\
  \ FROM customers WHERE name = :name\")\nvoid deleteCustomer(String name);\n```\n\
  \n作为使用 `@Query` 注解执行删除的替代，也可以使用 `@Delete` 方便注解。在下面的示例中，传递 `deleteCustomers()` 方法的所有\
  \ `Customer` 记录将从数据库中删除：\n\n```java\n@Delete\npublic void deleteCustomers(Customer...\
  \ customers);\n```\n\n`@Update` 方便注解在更新记录时提供类似的行为：\n\n（此处省略原文）\n\n这些类型数据库操作的 DAO\
  \ 方法也可以声明为返回一个指示受影响行数的 `int`，例如：\n\n```java\n@Delete\npublic int deleteCustomers(Customer...\
  \ customers);\n```\n\n## 66.5 Room 数据库\nRoom 数据库类通过扩展 `RoomDatabase` 创建，并作为嵌入 Android\
  \ 操作系统的实际 SQLite 数据库之层。该类负责创建并返回一个新的 Room 实例，并提供与数据库关联的 DAO 实例的访问。Room 持久化库提供了用于创建数据库的构建器。每个\
  \ Android 应用应该只有一个 Room 数据库实例，因此在类中实现防御性代码以防止创建多个实例。与示例表使用的 Room 数据库实现示例如下所示：\n\n\
  ```java\nimport android.content.Context;\nimport android.arch.persistence.room.Database;\n\
  import android.arch.persistence.room.Room;\nimport android.arch.persistence.room.RoomDatabase;\n\
  \n@Database(entities = {Customer.class}, version = 1)\npublic class CustomerRoomDatabase\
  \ extends RoomDatabase {\n    public abstract CustomerDao customerDao();\n    private\
  \ static RoomDatabase INSTANCE;\n    static RoomDatabase getDatabase(final Context\
  \ context) {\n        if (INSTANCE == null) {\n            synchronized (RoomDatabase.class)\
  \ {\n                if (INSTANCE == null) {\n                    INSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \                            CustomerRoomDatabase.class, \"customer_database\").build();\n\
  \                }\n            }\n        }\n        return INSTANCE;\n    }\n\
  }\n```\n\n上述示例中需要注意的重要区域是：类上方声明数据库要工作的实体的注解、检查类实例是否已经创建的代码，以及对名称的分配。\n\n## 66.6\
  \ 仓库 (Repository)\n仓库负责获取 Room 数据库实例，使用该实例访问 DAO 并调用 DAO 方法执行数据库操作。设计用于与 Room 数据库工作的典型构造函数如下：\n\
  \n```java\npublic class CustomerRepository {\n    private CustomerDao customerDao;\n\
  \    private CustomerRoomDatabase db;\n    public CustomerRepository(Application\
  \ application) {\n        db = CustomerRoomDatabase.getDatabase(application);\n\
  \        customerDao = db.customerDao();\n    }\n}\n```\n\n一旦仓库有了 DAO，就可以调用数据访问方法。下面的代码示例调用了\
  \ `getAllCustomers()` 方法：\n\n```java\nprivate LiveData<List<Customer>> allCustomers;\n\
  allCustomers = customerDao.getAllCustomers();\n```\n\n调用 DAO 方法时重要的是，除非方法返回 `LiveData`\
  \ 实例（自动在单独线程运行查询），否则无法在应用的主线程上执行操作。由于某些数据库事务可能需要长时间才能完成，在单独线程上运行可以避免应用卡死。这个问题可以通过使用\
  \ `AsyncTask` 类轻松解决。\n\n## 66.7 内存数据库 (In-Memory Databases)\n本章概述的示例涉及作为 Android\
  \ 设备持久存储的 SQLite 数据库。Room 持久化库也支持内存数据库。这些数据库完全位于内存中，并在应用终止时丢失。使用内存数据库的唯一更改是调用 Room\
  \ 类的 `inMemoryDatabaseBuilder()` 方法而不是 `databaseBuilder()`：\n\n```java\n// 创建基于文件的存储数据库\n\
  INSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n        CustomerRoomDatabase.class,\
  \ \"customer_database\").build();\n\n// 创建内存数据库\nINSTANCE = Room.inMemoryDatabaseBuilder(context.getApplicationContext(),\n\
  \        CustomerRoomDatabase.class).build();\n```\n\n## 66.8 总结\nAndroid 持久化库与\
  \ Android 架构打包，并作为底层 SQLite 数据库之抽象层。该库的设计是为了符合 Android 架构更容易操作数据库。本章介绍了构建 Android\
  \ 应用的的不同元素，包括实体、数据访问对象和 Room 数据库实例。在 SQLite 基础的基础上，下一步是创建一个示例应用将此理论付诸实践。\n\n## 67.\
  \ Android TableLayout 和 TableRow 教程\n由于示例应用的用户界面需要基于表单的布局，本章将通过 `TableLayout` 和\
  \ `TableRow` 基础稍微偏离核心主题。在开始本章工作时，最初打算是使用 `TableLayout` 和 `TableRow` 视图设计用户界面。\n\n\
  ### 67.1 TableLayout 和 TableRow 视图\nTableLayout 容器视图的目的是以行的表格格式在屏幕上组织用户界面元素。TableLayout\
  \ 中的每一行由 `TableRow` 实例占据，并被分为单元格，每个单元格包含一个子视图。表格的列数由列最多的行决定，默认情况下，每列的宽度由最大的单元格定义。列可以相对于父\
  \ TableLayout 配置大小。此外，单个单元格可以配置为跨多列。\n\n### 67.2 创建 Room 数据库项目\n从欢迎屏幕选择 `Start a\
  \ new Android Studio project` 选项，在生成的项目对话框中选择 `Add No Activity` 模板。在 Name 字段输入 `RoomDemo`\
  \ 并指定 `com.roomdemo` 为包名。在点击 `Finish` 按钮之前，将 Minimum API level 设置为 `API 26: Android\
  \ 8.0 (Oreo)`并将 Language 菜单更改为 `Java`。\n\n### 67.3 转换为 LinearLayout\n在项目工具窗口 (`app\
  \ -> res -> layout`) 中找到 `main_fragment.xml` 文件并双击它将其加载到 Layout Editor。默认情况下，Android\
  \ Studio 使用 `ConstraintLayout` 作为用户界面的根布局元素。这需要转换为垂直方向的 `LinearLayout`。在 Layout\
  \ Editor 工具的设计模式下，在组件树中找到主 `ConstraintLayout` 组件并右键点击它显示菜单并选择 `Convert View...`\
  \ 选项。在生成的对话框中，在点击 `Apply` 按钮之前选择转换为 `LinearLayout`。默认情况下，布局编辑器会将 `ConstraintLayout`\
  \ 转换为水平 `LinearLayout`，因此在 Component Tree 窗口中选择布局组件，参考 Attributes 工具窗口并将 `orientation`\
  \ 属性更改为 `vertical`。转换完成后，从布局删除默认的 `TextView` 组件。\n\n### 67.4 将 TableLayout 添加到用户界面\n\
  留在 `main_fragment.xml` 文件中并参考调板的 `Layouts` 类别，拖放一个 `TableLayout` 视图使其位于 `LinearLayout`\
  \ 画布区域的顶部。一旦完成这些初始步骤，布局的组件树应该类似于图中所示。显然，Android Studio 已自动向 `TableLayout` 添加了四个\
  \ `TableRow` 实例。由于此示例只需要三行，选择并删除第四个 `TableRow` 实例。可以随时从调板拖动 `TableRow` 对象并将其到 `TableLayout`\
  \ 条目上添加额外的行。\n\n\n\n\n| 列 |\n| :--- |\n| 产品 ID |\n| 产品名称 |\n| 产品数量 |\n\n\n\n\n##\
  \ 68.2 为实体添加类文件\n\n在 `Project` 工具窗口中，右键点击 `app` -> `java` -> `com.ebookfrenzy.roomdemo`\
  \ 项，选择 `New` -> `Java Class` 菜单选项为实体添加一个类文件。在 `Create New Class` 对话框中，将类命名为 `Product`\
  \ 并点击 `OK` 按钮生成该文件。\n\n当 `Product.java` 文件在编辑器中打开时，对其进行修改如下：\n\n```java\npackage\
  \ com.ebookfrenzy.roomdemo;\npublic class Product {\n    private int id;\n    private\
  \ String name;\n    private int quantity;\n\n    public Product(String name, int\
  \ quantity) {\n        this.id = id;\n        this.name = name;\n        this.quantity\
  \ = quantity;\n    }\n\n    public int getId() {\n        return this.id;\n    }\n\
  \n    public String getName() {\n        return this.name;\n    }\n\n    public\
  \ int getQuantity() {\n        return this.quantity;\n    }\n\n    public void setId(int\
  \ id) {\n        this.id = id;\n    }\n\n    public void setName(String name) {\n\
  \        this.name = name;\n    }\n\n    public void setQuantity(int quantity) {\n\
  \        this.quantity = quantity;\n    }\n}\n```\n\n该类现在拥有对应数据库表列的变量以及相应的 getter\
  \ 和 setter 方法。当然，在该类被注解之前，它不会成为实体。在编辑器中保持类文件打开的情况下，添加注解和相应的导入语句：\n\n```java\npackage\
  \ com.ebookfrenzy.roomdemo;\nimport android.support.annotation.NonNull;\nimport\
  \ android.arch.persistence.room.ColumnInfo;\nimport android.arch.persistence.room.Entity;\n\
  import android.arch.persistence.room.PrimaryKey;\n\n@Entity(tableName = \"products\"\
  )\npublic class Product {\n    @PrimaryKey(autoGenerate = true)\n    @NonNull\n\
  \    @ColumnInfo(name = \"productId\")\n    private int id;\n\n    @ColumnInfo(name\
  \ = \"productName\")\n    private String name;\n\n    private int quantity;\n  \
  \  ..\n```\n\n这些注解声明该类为名为 `products` 表的实体，并为 `id` 和 `name` 变量分配了列名。`id` 列也被配置为主键并自动生成。由于主键永远不能为空，因此也应用了\
  \ `@NonNull` 注解。由于在 SQL 查询中不需要引用 `quantity` 列，因此没有为 `quantity` 变量分配列名。\n\n## 68.4\
  \ 创建数据访问对象 (DAO)\n\n定义产品实体后，下一步是创建 DAO 接口。再次参考 `Project` 工具窗口，右键点击 `app` -> `java`\
  \ -> `com.ebookfrenzy.roomdemo` 项并选择 `New` -> `Java Class` 菜单选项。在 `Create New Class`\
  \ 对话框中，在 `Name` 字段中输入 `ProductDao`，并在 `Kind` 菜单中选择 `Interface`，如图 68-1 所示：![](img/image12721.jpg)\n\
  \n图 68- 1\n\n点击 `OK` 生成新接口，并在 `ProductDao.java` 文件加载到代码编辑器后，进行以下更改：\n\n```java\n\
  package com.ebookfrenzy.roomdemo;\nimport java.util.List;\nimport android.arch.lifecycle.LiveData;\n\
  import android.arch.persistence.room.Dao;\nimport android.arch.persistence.room.Insert;\n\
  import android.arch.persistence.room.Query;\n\n@Dao\npublic interface ProductDao\
  \ {\n    @Insert\n    void insertProduct(Product product);\n\n    @Query(\"SELECT\
  \ * FROM products WHERE productName = :name\")\n    List<Product> findProduct(String\
  \ name);\n\n    @Query(\"DELETE FROM products WHERE productName = :name\")\n   \
  \ void deleteProduct(String name);\n\n    @Query(\"SELECT * FROM products\")\n \
  \   LiveData<List<Product>> getAllProducts();\n}\n```\n\nDAO 实现了插入、查找和删除 `products`\
  \ 数据库中记录的方法。插入方法接收一个包含要存储数据的 `Product` 实体对象，而查找和删除记录的方法接收一个包含要操作产品名称的字符串。`getAllProducts()`\
  \ 方法返回包含数据库中所有记录的 `LiveData` 对象。此方法将用于保持用户界面布局中的 `RecyclerView` 产品列表与数据库同步。\n\n\
  ## 68.5 添加 Room 数据库\n\n在向项目添加仓库之前，最后一个任务是实现 Room 数据库实例。向项目添加一个名为 `ProductRoomDatabase`\
  \ 的新类，这次将 `Kind` 菜单设置为 `Class`，并在 `Modifiers` 部分启用 `Abstract` 选项![](img/image12747.jpg)\n\
  \n图 68- 2\n\n一旦文件生成，请按照“The Android Room Persistence Library”章节概述的步骤对其进行修改：\n\n\
  ```java\npackage com.ebookfrenzy.roomdemo;\nimport android.content.Context;\nimport\
  \ android.arch.persistence.room.Database;\nimport android.arch.persistence.room.Room;\n\
  import android.arch.persistence.room.RoomDatabase;\n\n@Database(entities = {Product.class},\
  \ version = 1)\npublic abstract class ProductRoomDatabase extends RoomDatabase {\n\
  \    public abstract ProductDao productDao();\n    private static ProductRoomDatabase\
  \ INSTANCE;\n\n    static ProductRoomDatabase getDatabase(final Context context)\
  \ {\n        if (INSTANCE == null) {\n            synchronized (ProductRoomDatabase.class)\
  \ {\n                if (INSTANCE == null) {\n                    INSTANCE = Room.databaseBuilder(context.getApplicationContext(),\
  \ ProductRoomDatabase.class, \"product_database\").build();\n                }\n\
  \            }\n        }\n        return INSTANCE;\n    }\n}\n```\n\n## 68.6 添加仓库\n\
  \n向项目添加一个名为 `ProductRepository` 的新类，在 `Create New Class` 对话框中将 `Kind` 菜单设置为 `Class`，并在\
  \ `Modifiers` 部分启用 `None`。\n\n仓库类负责代表 `ViewModel` 与 Room 数据库交互，并需要提供使用 `DAO` 插入、删除和查询产品记录的方法。除了\
  \ `getAllProducts()` 方法（返回一个 `LiveData` 对象）外，这些数据库操作都需要使用 `AsyncTask` 类在单独线程上执行。在\
  \ `ProductRepository.java` 文件中，添加 `AsyncTask` 代码。。添加一个名为 `asyncFinished()` 的方法，该方法将被\
  \ `AsyncTask` 调用以返回结果：\n\n```java\npackage com.ebookfrenzy.roomdemo;\nimport android.os.AsyncTask;\n\
  import java.util.List;\nimport android.arch.lifecycle.MutableLiveData;\n\npublic\
  \ class ProductRepository {\n    private MutableLiveData<List<Product>> searchResults\
  \ = new MutableLiveData<>();\n\n    private void asyncFinished(List<Product> results)\
  \ {\n        searchResults.setValue(results);\n    }\n\n    static class QueryAsyncTask\
  \ extends AsyncTask<String, Void, List<Product>> {\n        private ProductDao taskDao;\n\
  \        private ProductRepository delegate;\n\n        QueryAsyncTask(ProductDao\
  \ dao) {\n            taskDao = dao;\n        }\n\n        @Override\n        protected\
  \ List<Product> doInBackground(String... params) {\n            return taskDao.findProduct(params[0]);\n\
  \        }\n\n        @Override\n        protected void onPostExecute(List<Product>\
  \ result) {\n            if (delegate != null) {\n                delegate.asyncFinished(result);\n\
  \            }\n        }\n    }\n}\n```\n\n上述代码声明了一个名为 `searchResults` 的 `MutableLiveData`\
  \ 变量，每当搜索操作完成时，结果都会存储其中（在教程的稍后部分，`ViewModel` 内部的观察者将监控此数据）。\n\n`AsyncTask` 类包含一个构造方法，必须传递\
  \ DAO 对象的引用。`doInBackground()` 方法接收用于执行搜索的 `String`，将其传递给 `DAO` 的 `findProduct()`\
  \ 方法，并返回匹配的对象列表，随后将被传递给 `onPostExecute()` 方法。最后，`onPostExecute()` 方法将产品列表存储在 `searchResults`\
  \ `MutableLiveData` 对象中。仓库还需要包含以下插入产品到数据库的 `AsyncTask` 实现：\n\n```java\nstatic class\
  \ InsertAsyncTask extends AsyncTask<Product, Void, Void> {\n    private ProductDao\
  \ taskDao;\n\n    InsertAsyncTask(ProductDao dao) {\n        taskDao = dao;\n  \
  \  }\n\n    @Override\n    protected Void doInBackground(Product... params) {\n\
  \        taskDao.insertProduct(params[0]);\n        return null;\n    }\n}\n```\n\
  \n构造方法再次传递 DAO 对象的引用，这次 `doInBackground()` 方法接收要插入到数据库的 `Product` 对象数组。由于应用一次只添加一个新产品，通过调用\
  \ `insertProduct()` DAO 方法来执行。在这种情况下，不需要从任务返回结果。\n\n```java\nstatic class DeleteAsyncTask\
  \ extends AsyncTask<String, Void, Void> {\n    private ProductDao taskDao;\n\n \
  \   DeleteAsyncTask(ProductDao dao) {\n        taskDao = dao;\n    }\n\n    @Override\n\
  \    protected Void doInBackground(String... params) {\n        taskDao.deleteProduct(params[0]);\n\
  \        return null;\n    }\n}\n```\n\n定义 `AsyncTask` 类后，仓库类现在需要提供一些可以由 `ViewModel`\
  \ 调用以启动这些操作的方法。这些方法将创建相应的 `AsyncTask` 实例并传递 `DAO`。为了实现这一点，仓库需要通过 `ProductRoomDatabase`\
  \ 实例获取 DAO 引用。\n\n```java\nimport android.app.Application;\n\npublic class ProductRepository\
  \ {\n    private MutableLiveData<List<Product>> searchResults = new MutableLiveData<>();\n\
  \    private ProductDao productDao;\n\n    public ProductRepository(Application\
  \ application) {\n        ProductRoomDatabase db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n    }\n}\n```\n\n存储 `DAO` 引用后，方法准备好添加到类文件中：\n\
  \n```java\npublic void insertProduct(Product newproduct) {\n    InsertAsyncTask\
  \ task = new InsertAsyncTask(productDao);\n    task.execute(newproduct);\n}\n\n\
  public void deleteProduct(String name) {\n    DeleteAsyncTask task = new DeleteAsyncTask(productDao);\n\
  \    task.execute(name);\n}\n\npublic void findProduct(String name) {\n    QueryAsyncTask\
  \ task = new QueryAsyncTask(productDao);\n    task.delegate = this;\n    task.execute(name);\n\
  }\n```\n\n在插入和删除方法的情况下，创建了相应的 `AsyncTask` 实例并传递了必要的参数。在 `findProduct()` 方法的情况下，类的\
  \ `delegate` 属性被设置为仓库实例，以便在搜索完成后调用 `asyncFinished()` 方法。\n\n完成仓库类还剩最后一个任务。用户界面布局中的\
  \ `RecyclerView` 需要能够更新数据库中存储的当前列表。`ProductDao` 类已经包含一个名为 `getAllProducts()` 的方法，它使用\
  \ SQL 查询所有数据库记录并将其封装在 `LiveData` 对象中返回。仓库需要在初始化时调用此方法，并将结果存储在 `LiveData` 对象中，该对象可以被\
  \ `ViewModel` 观察，进而被 UI 控制器观察。一旦设置好，每当数据库表发生变化时，UI 控制器观察者将将收到通知，`RecyclerView` 就可以更新最新的产品列表。在\
  \ `ProductRepository.java` 文件中，添加一个 `LiveData` 变量并在构造函数中调用 DAO 的 `getAllProducts()`\
  \ 方法：\n\n```java\nimport android.arch.lifecycle.LiveData;\n\npublic class ProductRepository\
  \ {\n    private MutableLiveData<List<Product>> searchResults = new MutableLiveData<>();\n\
  \    private LiveData<List<Product>> allProducts;\n    private ProductDao productDao;\n\
  \n    public ProductRepository(Application application) {\n        ProductRoomDatabase\
  \ db = ProductRoomDatabase.getDatabase(application);\n        productDao = db.productDao();\n\
  \        allProducts = productDao.getAllProducts();\n    }\n}\n```\n\n为了完成仓库，添加\
  \ `ViewModel` 可以调用以获取 `allProducts` 和 `searchResults` 直接数据对象引用的方法：\n\n```java\n\
  public LiveData<List<Product>> getAllProducts() {\n    return allProducts;\n}\n\n\
  public MutableLiveData<List<Product>> getSearchResults() {\n    return searchResults;\n\
  }\n```\n\n## 68.7 修改 ViewModel\n\n`ViewModel` 负责创建仓库实例，并提供 UI 控制器利用以保持用户界面与数据库同步的方法和\
  \ `LiveData` 对象。正如在 `ProductRepository.java` 中实现的，仓库构造函数需要访问 `application` 上以便获取\
  \ Room 数据库实例。为了让 `ViewModel` 访问 `application` 上并将其传递给仓库，`ViewModel` 需要继承 `AndroidViewModel`\
  \ 而不是 `ViewModel`。因此，通过编辑 `MainViewModel.java` 文件（位于 `app` -> `java` -> `com.ebookfrenzy.roomdemo`\
  \ -> `ui.main`）并将类更改为 `AndroidViewModel` 并实现默认构造函数：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\
  import android.app.Application;\nimport com.ebookfrenzy.roomdemo.Product;\nimport\
  \ com.ebookfrenzy.roomdemo.ProductRepository;\nimport java.util.List;\nimport android.arch.lifecycle.AndroidViewModel;\n\
  import android.arch.lifecycle.LiveData;\nimport android.arch.lifecycle.MutableLiveData;\n\
  import android.arch.lifecycle.ViewModel;\n\npublic class MainViewModel extends AndroidViewModel\
  \ {\n    private ProductRepository repository;\n    private LiveData<List<Product>>\
  \ allProducts;\n    private MutableLiveData<List<Product>> searchResults;\n\n  \
  \  public MainViewModel(Application application) {\n        super(application);\n\
  \        repository = new ProductRepository(application);\n        allProducts =\
  \ repository.getAllProducts();\n        searchResults = repository.getSearchResults();\n\
  \    }\n}\n```\n\n构造函数创建仓库实例并使用它获取结果和直接数据引用，以便它们被 UI 控制器观察。在 `ViewModel` 中剩余的是从\
  \ UI 控制器响应按钮点击调用的方法，并在 `LiveData` 对象设置观察者：\n\n```java\nMutableLiveData<List<Product>>\
  \ getSearchResults() {\n    return searchResults;\n}\n\nLiveData<List<Product>>\
  \ getAllProducts() {\n    return allProducts;\n}\n\npublic void insertProduct(Product\
  \ product) {\n    repository.insertProduct(product);\n}\n\npublic void findProduct(String\
  \ name) {\n    repository.findProduct(name);\n}\n\npublic void deleteProduct(String\
  \ name) {\n    repository.deleteProduct(name);\n}\n```\n\n## 68.8 创建产品布局\n\n数据库中的每个产品名称将出现在主用户界面的\
  \ `RecyclerView` 列表中。这需要一个包含 `TextView` 的简单布局文件用于每行。通过在 `Project` 工具窗口中点击 `app`\
  \ -> `res` -> `layout` 项并选择 `New` -> `Layout resource file` 选项来添加此文件。将文件命名为 `product_list_item`\
  \ 并将根元素更改为 `LinearLayout`。在布局设计模式下，从调色板拖出一个 `TextView` 对象，它将默认出现在布局顶部：![](img/image2940.jpg)\n\
  \n图 68-3\n\n在布局中选中 `TextView`，使用 `Attributes` 工具窗口将视图的 ID 设置为 `product_row`并将 `layout_height`\
  \ 设置为 `30dp`。在 `Component Tree` 窗口中选择 `LinearLayout` 项并将 `layout_height` 属性设置为 `wrap_content`。\n\
  \n## 68.9 添加 RecyclerView Adapter\n\n正如“Working with RecyclerView and CardView”章节详细概述，`RecyclerView`\
  \ 实例需要一个适配器类来提供显示的数据。通过点击 `app` -> `java` -> `com.ebookfrenzy.roomdemo` -> `ui.main`\
  \ 项并选择 `New` -> `Java Class...` 选项来添加此类。在 `Create New Class` 对话框中，将类命名为 `ProductListAdapter`。当\
  \ `ProductListAdapter.java` 类加载到编辑器后，如下如下实现类：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  import android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import android.widget.TextView;\nimport java.util.List;\nimport android.support.v7.widget.RecyclerView;\n\
  import com.ebookfrenzy.roomdemo.Product;\nimport com.ebookfrenzy.roomdemo.R;\n\n\
  public class ProductListAdapter extends RecyclerView.Adapter<ProductListAdapter.ViewHolder>\
  \ {\n    private int productItemLayout;\n    private List<Product> productList;\n\
  \n    public ProductListAdapter(int layoutId) {\n        productItemLayout = layoutId;\n\
  \    }\n\n    public void setProductList(List<Product> products) {\n        productList\
  \ = products;\n        notifyDataSetChanged();\n    }\n\n    @Override\n    public\
  \ int getItemCount() {\n        return productList == null ? 0 : productList.size();\n\
  \    }\n\n    @Override\n    public ViewHolder onCreateViewHolder(ViewGroup parent,\
  \ int viewType) {\n        View view = LayoutInflater.from(parent.getContext()).inflate(productItemLayout,\
  \ parent, false);\n        ViewHolder myViewHolder = new ViewHolder(view);\n   \
  \     return myViewHolder;\n    }\n\n    @Override\n    public void onBindViewHolder(final\
  \ ViewHolder holder, int listPosition) {\n        TextView item = holder.item;\n\
  \        item.setText(productList.get(listPosition).getName());\n    }\n\n    static\
  \ class ViewHolder extends RecyclerView.ViewHolder {\n        TextView item;\n\n\
  \        ViewHolder(View itemView) {\n            super(itemView);\n           \
  \ item = itemView.findViewById(R.id.product_row);\n        }\n    }\n}\n```\n\n\
  ## 68.10 准备 Main Fragment\n\n最后需要修改的组件是 `MainFragment` 类，它需要对 `Button` 视图配置监听器并对\
