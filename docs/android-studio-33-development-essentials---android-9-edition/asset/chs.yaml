  \ 总结\n（已翻译）\n\n\n\n\n\n![](img/image8716.jpg)图 46-1\n\n![](img/image8727.jpg)图 46-2\n\
  \n![](img/image8738.jpg)图 46-3\n\n对于三个内置管理器都无法提供所需布局的情况，可以通过派生 `RecyclerView.LayoutManager`\
  \ 类来实现自定义的布局管理器。\n\n在 `RecyclerView` 中显示的每个列表项都是作为 `ViewHolder` 类的实例被创建的。`ViewHolder`\
  \ 实例包含了 `RecyclerView` 显示列表项所需的所有内容，包括要显示的信息以及用于显示该项的视图布局。\n\n与 `ListView` 一样，`RecyclerView`\
  \ 依赖于适配器（adapter）来充当 `RecyclerView` 实例与显示给用户的数据之间的中间媒介。适配器被创建为 `RecyclerView.Adapter`\
  \ 类的子类，并且至少必须实现以下方法，这些方法会被分配给适配器的 `RecyclerView` 对象在不同时间点调用：\n\n\n\n\n将 `RecyclerView`\
  \ 添加到布局中，简单来说在它要显示的 activity 的 XML 内容布局文件中添加相应的元素即可。例如：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<android.support.constraint.ConstraintLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  xmlns:tools=\"http://schemas.android.com/tools\" android:layout_width=\"match_parent\"\
  \ android:layout_height=\"match_parent\" app:layout_behavior=\"@string/appbar_scrolling_view_behavior\"\
  tools:context=\".MainActivity\"tools:showIn=\"@layout/activity_card_demo\">\n  \
  \  <android.support.v7.widget.RecyclerView android:id=\"@+id/recycler_view\" android:layout_width=\"\
  0dp\" android:layout_height=\"0dp\" app:layout_constraintBottom_toBottomOf=\"parent\"\
  \ app:layout_constraintEnd_toEndOf=\"parent\" app:layout_constraintStart_toStartOf=\"\
  parent\" app:layout_constraintTop_toTopOf=\"parent\"tools:listItem=\"@layout/card_layout\"\
  \ />\n</android.support.constraint.ConstraintLayout>\n```\n\n在上面的示例中，`RecyclerView`\
  \ 被嵌入到主 activity 布局文件的 `CoordinatorLayout` 中，并与 `AppBar` 和 `Toolbar` 一起使用。这提供了一些额外功能，例如配置\
  \ `Toolbar` 和 `AppBar`，当用户在 `RecyclerView` 中向上滑动时，它们会滚出屏幕（该主题在“使用 AppBar 和折叠 Toolbar\
  \ 布局”章节中会有更详细的介绍）。\n\n## 46.2 CardView 概述\n\n`CardView` 类是一种用户界面视图，允许使用卡片比喻以分组形式展示信息。卡片通常使用\
  \ `RecyclerView` 实例以列表形式呈现，并可能配置为阴影效果和圆角出现。例如，[图 46-4] 显示了三个配置好的 `CardView` 实例，它们显示一个由一个\
  \ `ImageView` 和两个 `TextView` 组成的布局：\n\n![](img/image8785.jpg)\n图 46-4\n\n要用 `CardView`\
  \ 实例展示的用户界面布局定义在 XML 布局资源文件中，并在运行时加载到 `CardView` 中。`CardView` 布局可以包含任何复杂性的布局，使用\
  \ `RelativeLayout` 和 `LinearLayout` 等标准布局管理器。下面的 XML 布局文件表示一个由 `RelativeLayout`\
  \ 和单个 `ImageView` 组成的卡片视图布局。卡片配置为提升以创建阴影效果，并带有圆角显示：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<android.support.v7.widget.CardView xmlns:card_view=\"\
  http://schemas.android.com/apk/res-auto\"xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \ android:id=\"@+id/card_view\" android:layout_width=\"match_parent\" android:layout_height=\"\
  wrap_content\" android:layout_margin=\"5dp\"card_view:cardCornerRadius=\"12dp\"\
  card_view:cardElevation=\"3dp\"card_view:contentPadding=\"4dp\">\n    <RelativeLayout\
  \ android:layout_width=\"match_parent\" android:layout_height=\"wrap_content\" android:padding=\"\
  16dp\" >\n        <ImageView android:layout_width=\"100dp\" android:layout_height=\"\
  100dp\" android:id=\"@+id/item_image\" android:layout_alignParentLeft=\"true\" android:layout_alignParentTop=\"\
  true\" android:layout_marginRight=\"16dp\" />\n    </RelativeLayout>\n</android.support.v7.widget.CardView>\n\
  ```\n\n当与 `RecyclerView` 结合创建一个可滚动的卡片列表时，列表的 `onCreateViewHolder()` 方法会充气卡片的布局资源文件，将其分配给\
  \ `ViewHolder` 实例并返回给 `RecyclerView` 实例。\n\n## 46.3 将库添加到项目\n\n为了使用 `RecyclerView`\
  \ 和 `CardView` 组件，必须将相应的库添加到项目的 Gradle 构建依赖中。因此，在模块级 `build.gradle` 文件中，需要在 `dependencies`\
  \ 部分添加以下几行：\n\n```gradle\ndependencies {\n  implementation 'com.android.support:recyclerview-v7:28.0.0'\n\
  \  implementation 'com.android.support:cardview-v7:28..0'\n}\n```\n\n## 46.4 总结\n\
  \n本章介绍了 Android `RecyclerView` 和 `CardView` 组件。`RecyclerView` 提供了一种资源高效的方法，用于在 Android\
  \ 应用中显示可滚动视图列表。`CardView` 在以卡片形式呈现数据组（如名称和地址列表）时非常有用。正如之前概述的那样，并在下一章的教程中所演示的那样，`RecyclerView`\
  \ 和 `CardView` 结合使用时特别有用。\n\n## 47. Android RecyclerView 和 CardView 教程\n\n在本章中，将创建一个示例项目，该项目将同时使用\
  \ `CardView` 和 `RecyclerView` 组件来创建一个滚动的卡片列表。完成后的应用将显示一个包含图像和文本的卡片列表。除了显示卡片列表外，项目的实现还使得选择卡片时会向用户显示消息，指示用户点击了哪张卡片。\n\
  \n### 47.1 创建 CardDemo 项目\n\n从欢迎界面选择“Start a new Android Studio project”快速启动选项，在出现的新项目对话框中，点击“Next”按钮之前选择“Basic\
  \ Activity”模板。在 Name 字段中输入 `CardDemo`，并指定包名为 `com.ebookrenzy.carddemo`。在点击“Finish”按钮之前，将\
  \ Minimum API level 设置为 API 26: Android Oreo，语言设置为 Java。一旦项目创建，加载 `content_main.xml`\
  \ 文件并选择删除“Hello World” `TextView`。\n\n### 47.2 移除悬按钮\n\n由于选择了 Basic Activity，布局包含一个此项目不需要的悬按钮。将\
  \ `menu.xml` 布局加载到布局编辑器，选择悬按钮并按删除键从布局中移除。编辑 `MainActivity.java` 文件，从 `onCreate`\
  \ 方法中移除悬按钮代码：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_demo);\n\
  \    Toolbar toolbar = findViewById(R.id.toolbar);\n    setSupportActionBar(toolbar);\n\
  \    FloatingActionButton fab = findViewById(R.id.fab);\n    fab.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            Snackbar.make(view, \"Replace with action\", Snackbar.LENGTH_LONG).show();\n\
  \        }\n    });\n}\n```\n\n### 47.3 添加 RecyclerView 和 CardView 库\n\n在项目窗口中找到并选择模块级\
  \ `build.gradle` 文件，修改文件的 `dependencies` 部分以添加 `RecyclerView` 和 `CardView` 的支持库：\n\
  \n```gradle\ndependencies {\n  implementation 'com.android.support:recyclerview-v7:28.0.0'\n\
  \  implementation 'com.android.support:cardview-v7:28.0.0'\n}\n```\n\n提示时点击 Sync\
  \ Now 重新同步 Gradle 配置。\n\n### 47.4 设计 CardView 布局\n\n卡片内部视图的布局将定义在一个独立的 XML 文件中。在项目窗口中右键点击\
  \ `app` -> `res` -> `layout` 并选择 New -> Layout resource file。在点击 OK 按钮之前，在 New Resource\
  \ 对话框的 File name 中输入 `card_layout`，并在根元素中输入 `android.support.v7.widget.CardView`。在布局编辑器加载布局\
  \ 文件，切换到 Text 模式并修改布局如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <android.support.v7.widget.CardView xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  xmlns:app=\"http://schemas.android.com/apk/res-auto\"xmlns:tools=\"http://schemas.android.com/tools\"\
  \ android:layout_width=\"match_parent\" android:layout_height=\"wrap_content \"\
  \ android:id=\"@+id/card_view\" android:layout_margin=\"5dp\"app:cardBackgroundColor=\"\
  #81C784\"app:cardCornerRadius=\"12dp\"app:cardElevation=\"3dp\"app:contentPadding=\"\
  4dp\">\n    <RelativeLayout android:layout_width=\"match_parent\" android:layout_height=\"\
  wrap_content\" android:padding=\"16dp\" >\n        <ImageView android:layout_width=\"\
  100dp\" android:layout_height=\"100dp\" android:id=\"@+id/item_image\" android:layout_alignParentStart=\"\
  true\" android:layout_alignParentLeft=\"true\" android:layout_alignParentTop=\"\
  true\" android:layout_marginEnd=\"16dp\" android:layout_marginRight=\"16dp\" />\n\
  \        <TextView android:layout_width=\"match_parent\" android:layout_height=\"\
  wrap_content\" android:id=\"@+id/item_title\" android:layout_toEndOf=\"@+id/item_image\"\
  \ android:layout_toRightOf=\"@+id/item_image\" android:layout_alignParentTop=\"\
  true\" android:textSize=\"30sp\" />\n        <TextView android:layout_width=\"match_parent\"\
  \ android:layout_height=\"wrap_content\" android:id=\"@+id/item_detail\" android:layout_toEndOf=\"\
  @+id/item_image\" android:layout_toRightOf=\"id/item_image\" android:layout_below=\"\
  @+id/item_title\" />\n    </RelativeLayout>\n</android.support.v7.widget.CardView>\n\
  ```\n\n### 47.5 添加 RecyclerView\n\n选择 `content_main.xml` 布局文件，并将调板的 Containers 部分将\
  \ `RecyclerView` 对象拖到布局上，使其位于屏幕中心，它应该自动调整大小以填充整个屏幕。使用 Infer constraints 工具栏按钮为视图添加任何缺失的布局约束。使用\
  \ Attributes 工具窗口将 `RecyclerView` 实例的 ID 更改为 `recycler_view`，并将 `layout_width` 和\
  \ `layout_height` 属性更改为 `match_constraint`。\n\n### 47.6 创建 RecyclerView 适配\n\n如上一章所述，`RecyclerView`\
  \ 需要一个适配器来处理列表项的创建。在项目窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.carddemo` 条目并选择\
  \ New -> Java Class，将此新类添加到项目中。在 Create New Class 对话框中，在 Name: 字段中输入 `RecyclerAdapter`，点击\
  \ OK 按钮之前将 Kind 菜单更改为 Class 以创建新的 Java 类。编辑 `RecyclerAdapter.java` 文件添加一些导入指令并声明类继承\
  \ `RecyclerView.Adapter`。与其创建一个单独的类来提供显示的数据，不如向适配器添加一些基础数组作为数据：\n\n```java\npackage\
  \ com.ebookrenzy.carddemo;\nimport android.support.v7.widget.RecyclerView;\nimport\
  \ android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import android.widget.ImageView;\nimport android.widget.TextView;\npublic class\
  \ RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder> {\n \
  \ private String[] titles = {\"Chapter One\",\"Chapter Two\",\"Chapter Three\",\"\
  Chapter Four\",\"Chapter Five\",\"Chapter Six\",\"Chapter Seven\",\"Chapter Eight\"\
  };\n  private String[] details = {\"Item one details\",\"Item two details\",\"Item\
  \ three details\",\"Item four details\",\"Item five details\",\"Item six details\"\
  ,\"Item seven details\",\"Item eight\"};\n  private int[] images = { R.drawable.android_image_1,R.drawable.android_image_2,R.drawable.android_image_3,R.drawable.android_image_4,R.drawable.android_image_5,R.drawable.android_image_6,R.drawable.android_image_7,R.drawable.android_image_8\
  \ };\n```\n\n在 `RecyclerAdapter` 类中，我们需要我们的 `ViewHolder` 类实现来引用 `card_layout.xml`\
  \ 中的视图元素。在 `RecyclerAdapter.java` 文件中实现该类：\n\n```java\npublic class RecyclerAdapter\
  \ extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder> {\n  class ViewHolder\
  \ extends RecyclerView.ViewHolder {\n    public ImageView itemImage;\n    public\
  \ TextView itemTitle;\n    public TextView itemDetail;\n    public ViewHolder(View\
  \ itemView) {\n      super(itemView);\n      itemImage = (ImageView)itemView.findViewById(R.id.item_image);\n\
  \      itemTitle = (TextView)itemView.findViewById(R.id.item_title);\n      itemDetail\
  \ = (TextView)itemView.findViewById(R.id.item_detail);\n    }\n}\n```\n\n`RecyclerAdapter.java`\
  \ 文件的下一个项目是 `onCreateViewHolder()` 方法的实现：\n\n```java\n@Override\npublic ViewHolder\
  \ onCreateViewHolder(ViewGroup viewGroup, int i) {\n    View v = LayoutInflater.from(viewGroup.getContext()).inflate(R.layout.card_layout,\
  \ viewGroup, false);\n    ViewHolder viewHolder = new ViewHolder(v);\n    return\
  \ viewHolder;\n}\n```\n\n此方法将被 `RecyclerView` 调用以获取 `ViewHolder` 对象。它充气视图层级 `card_layout`\
  \ 并在返回给 `RecyclerView` 之前初始化我们的 `ViewHolder` 类。`onBindViewHolder()` 方法的目的是填充 `ViewHolder`\
  \ 对象中的视图层级。它传递了 `ViewHolder` 对象和一个指示要显示的列表项的整数值。现在应该添加此方法，使用项目作为数据数组的索引。\n\n```java\n\
  @Override\npublic void onBindViewHolder(ViewHolder viewHolder, int i) {\n    viewHolder.itemTitle.setText(titles[i]);\n\
  \    viewHolder.itemDetail.setText(details[i]);\n    viewHolder.itemImage.setImageResource(images[i]);\n\
  }\n```\n\n适配器的最后一个要求是 `getItem()` 方法的实现，在这种情况下只需返回 `titles` 数组中的项数：\n\n```java\n\
  @Override\npublic int getItemCount() {\n  return titles.length;\n}\n```\n\n### 47.7\
  \ 添加图像文件\n\n除了两个 `TextView` 外，卡片布局还包含一个配置为显示图像的 `ImageView`。在测试项目之前，必须添加这些图像。项目使用的图像命名为\
  \ `android_image_<n>.jpg`，可以在从以下 URL 下载的示例代码的 `project_icons` 文件夹找到：[`www.ebookfrenzy.com/retail/androidstudio33/index.php`](https://www.ebookfrenzy.com/retail/androidstudio33/index.php)\n\
  \n在操作系统的文件导航器中找到这些图像，选择并复制这八张图像。在项目窗口中右键点击 `app` -> `res` -> `drawable` 条目并选择粘贴将文件添加到文件夹中：\n\
  \n![](img/image998.jpg)\n图 47-1\n\n### 47.8 初始化 RecyclerView 组件\n\n此时，项目由 `RecyclerView`\
  \ 实例、`CardView` 实例的 XML 布局文件和 `RecyclerView` 的适配器组成。在测试目前进展之前的最后一步是使用布局管理器初始化 `RecyclerView`，创建适配器实例并将将其分配给\
  \ `RecyclerView` 对象。对于本示例，`RecyclerView` 将配置为使用 `LinearLayoutManager` 布局选项。编辑 `MainActivity.java`\
  \ 文件并修改 `onCreate()` 方法来实现此初始化代码：\n\n```java\npackage com.ebookfrenzy.carddemo;\n\
  import android.os.Bundle;\nimport android.support.v7.app.AppCompatActivity;\nimport\
  \ android.support.v7.widget.Toolbar;\nimport android.view.Menu;\nimport android.view.MenuItem;\n\
  import android.support.v7.widget.LinearLayoutManager;\nimport android.support.v7.widget.RecyclerView;\n\
  public class MainActivity extends AppCompatActivity {\n  RecyclerView recyclerView;\n\
  \  RecyclerView.LayoutManager layoutManager;\n  RecyclerView.Adapter adapter;\n\
  \  @Override\n  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_demo);\n    Toolbar toolbar = findViewById(R.id.toolbar);\n\
  \    setSupportActionBar(toolbar);\n    recyclerView = findViewById(R.id.recycler_view);\n\
  \    layoutManager = new LinearLayoutManager(this);\n    recyclerView.setLayoutManager(layoutManager);\n\
  \    adapter = new RecyclerAdapter();\n    recyclerView.setAdapter(adapter);\n \
  \ }\n```\n\n### 47.9 测试应用程序\n\n在物理设备或模拟器上编译并运行应用，滚动列表中的不同卡片：\n\n![](img/image934.jpg)\n\
  图 47-2\n\n### 47.10 响应\n\n项目的最后一个阶段是使列表中的卡片可选，以便点击卡片时触发事件。对于此示例，卡片将被配置为在用户点击时在屏幕上显示消息。为了响应点击，需要修改\
  \ `ViewHolder` 类，在每个项上分配一个 `OnClickListener`。编辑 `RecyclerAdapter.java` 文件并修改 `ViewHolder`\
  \ 类声明，使其如下：\n\n```java\nimport android.support.design.widget.Snackbar;\nclass ViewHolder\
  \ extends RecyclerView.ViewHolder {\n  public ImageView itemImage;\n  public TextView\
  \ itemTitle;\n  public TextView itemDetail;\n  public ViewHolder(View itemView)\
  \ {\n    super(itemView);\n    itemImage = (ImageView)itemView.findViewById(R.id.item_image);\n\
  \    itemTitle = (TextView)itemView.findViewById(R.id.item_title);\n    itemDetail\
  \ = (TextView)itemView.findViewById(R.id.item_detail);\n    itemView.setOnClickListener(new\
  \ View.OnClickListener() {\n      @Override\n      public void onClick(View v) {\n\
  \      }\n  });\n}\n```\n\n在 `onClick` 处理体体中，现在可以添加代码来指示卡片已被点击。由于点击的结果取决于点击了哪张卡片，识别所选卡片也很重要。此信息可以通过调用\
  \ `RecyclerView` 类的 `getPosition()` 方法获得：\n\n```java\n@override\npublic void onClick(View\
  \ v) {\n    int position = getPosition();\n    Snackbar.make(v, \"Click detected\
  \ on item \" + position, Snackbar.LENGTH_LONG).show();\n}\n```\n\n最后的任务是启用应用程序内点击项时出现的\
  \ Material 设计波纹效果。这仅涉及在 `card_layout.xml` 文件的 `CardView` 实例声明添加某些属性，如下：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<android.support.v7.widget.CardView\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \ android:layout_width=\"match_parent\" android:layout_height=\"match_parent\" android:id=\"\
  @+id/card_view\" android:layout_margin=\"5dp\"app:cardBackgroundColor=\"#81C784\"\
  app:cardCornerRadius=\"12dp\"app:cardElevation=\"3dp\"app:contentPadding=\"4dp\"\
  \ android:foreground=\"?selectableItemBackground\" android:clickable=\"true\">\n\
  ```\n\n再次运行应用，验证点击列表中的卡片是否触发了接触处的标准波纹效果以及报告所选项的 `Snackbar` 的出现。\n\n### 47.11 总结\n\
  \n本章讲解了结合 `CardView` 和 `RecyclerView` 组件以显示可滚动卡片列表的步骤。示例还涵盖了对列表项点击检测，包括识别所选项以及在被点击的\
  \ `CardView` 实例上启用波纹效果。\n\n## 48. 布局编辑器示例数据教程\n\n上一章创建的 `CardDemo` 项目是一个很好的示例，说明了在测试完成的应用之前，很难从布局编辑器内部评估界面将是什么样。这个问题经常发生，当用户界面中显示的内容只有在用户安装并运行应用后才能生成或获取。长期以来，Android\
  \ Studio 布局编辑器一直提供指定仅在设计布局时激活简单属性的能力。例如，可以将仅限设计时的字符串资源分配给布局编辑器中的 `TextView`，它在应用运行时不会显示。此功能在\
  \ Android Studio 布局编辑器中引入示例数据后得到了极大扩展，本章将用于改进 `CardDemo` 项目的布局编辑器体验。\n\n### 48.1\
  \ 为项目添加示例数据\n\n在用户布局的设计阶段，`RecyclerView` 实例（[图 48-1]）与上一章末测试的运行应用几乎没有相似之处：\n\n![](img/image099.jpg)\n\
  图 48-1\n\n在书中之前的“使用 Jetpack 构建现代应用架构”章节介绍了示例数据的概念。为了演示示例数据的使用，现在将修改项目以便布局编辑器显示完全填充的卡片。在此之前，值得注意的是布局编辑器有一预配置的示例数据模板可以在设计用户界面时使用。要查看这些效果，将\
  \ `content_main.xml` 布局加载到布局编辑器并选择 `RecyclerView` 实例。将鼠标悬停在视图上，直到出现[图 48-2]所示的按钮：\n\
  \n![](img/image105.jpg)\n图 48-2\n\n点击显示扳手图标的按钮显示设计属性面板：\n\n![](img/image111.jpg)\n\
  图 48-3\n\n将模板选项更改为 Email 选项，并注意 `RecyclerView` 显示数据：\n\n![](img/image117.jpg)\n\
  图 48-4\n\n这些模板可以在不需要任何额外工作的情况下显示示例数据，通常足以完成布局。对于本示例，将使用示例数据在 `RecyclerView` 中显示卡片，以便在运行应用中出现。在\
  \ `content_main.xml` 文件仍加载到布局编辑器的情况下，切换到 Text 模式并定位 `RecyclerView` 元素，其如下：\n\n```xml\n\
  <android.support.v7.widget.RecyclerView android:id=\"@+id/recycler_view\" android:layout_width=\"\
  0dp\" android:layout_height=\"0dp\" app:layout_behavior=\"@string/app_scrolling_view_behavior\"\
  app:layout_constraintBottom_toBottomOf=\"parent\"app:layout_constraintEnd_toEndOf=\"\
  parent\"app:layout_constraintStart_toStartOf=\"parent\"app:layout_constraintTop_toTopOf=\"\
  parent\"tools:itemCount=\"10\"tools:listitem=\"@layout/card_view\" />\n```\n\n注意用于在列表中显示\
  \ 10 个项的特殊 tools 属性。虽然这些设置超出了本书的范围，但每个项的完整描述可以在以下 URL 获取：[`developer.android.com/studio/write/tool-attributes#samples_resources`](https://developer.android.com/studio/write/tool-attributes#samples_resources)\n\
  \n上述 `view_item.xml` 文件是在选择示例数据模板时由布局编辑器自动生成的，可以在项目窗口中找到。切换回 Design 模式并选择 `RecyclerView`，使用设计属性面板将模板切回默认设置。从\
  \ `content_main.xml` 文件中移除 `view_item.xml` 文件以及两个 tools 行。为了使用卡片布局切换示例数据，添加 `listItem`\
  \ 属性：\n\n```xml\ntoolslistItem=\"@layout/card_layout\"\n```\n\n切换回 Design 模式，注意卡片布局现在出现在每个项中，尽管还没有任何图像，并使用示例文本：\n\
  \n---\n\n### 48.2 使用自定义示例数据\n\n本章的最后一步是在布局编辑器中使用自定义示例数据和图像。这需要创建一个示例数据目录并添加一些文本和图像文件。在项目窗口中右键点击\
  \ `app` 条目并选择 New -> Sample Data，此时项目窗口会出现一个名为 `sampledata` 的新目录。\n\n右键点击 `sampledata`\
  \ 目录，创建一个名为 `images` 的子目录，并按照章节所述步骤将 Android 图像复制并粘贴到新文件夹中。再次显示设计属性面板，这次点击 Browse\
  \ 链接并在资源对话框中选择新添加的 Android 图像（如果 `images` 文件夹没有出现，尝试重建项目）：\n\n![](img/image168.jpg)\n\
  图 48-9\n\n再次右键点击 `sampledata` 目录，选择 New File，文件命名为 `chapters`并将类型设置为 Text。文件创建后，输入以下内容：\n\
  \nChapter One\nChapter Two\nChapter Three\nChapter Four\nChapter Five\nChapter Six\n\
  Chapter Seven\nChapter Eight\n\n接下来，创建第二个名为 `items` 的文本文件，内容如下：\n\nItem one details\n\
  Item two details\nItem three details\nItem four details\nItem five details\nItem\
  \ six details\nItem seven details\nItem eight details\n\n创建示例数据文本文件后，剩下的就是在 `card_layout.xml`\
  \ 文件的视图元素中引用它们：\n\n```xml\n<TextView android:layout_width=\"wrap_content\" android:layout_height=\"\
  wrap_content\" android:id=\"@+id/item_title\" android:layout_toEndOf=\"@+id/item_image\"\
  \ android:layout_toRightOf=\"@+id/item_image\" android:layout_alignParentTop=\"\
  true\" android:textSize=\"30sp\"tools:text=\"@sample/chapters\" />\n<TextView android:layout_width=\"\
  wrap_content\" android:layout_height=\"wrap_content\" android:id=\"@+id/item_detail\"\
  \ android:layout_toEndOf=\"@+id/item_image\" android:layout_toRightOf=\"@+id/item_image\"\
  \ android:layout_below=\"@+id/item_title\"tools:text=\"@sample/items\" />\n```\n\
  \n返回 `content_main.xml` 文件中的布局设计，自定义示例数据和图像现在应该显示在 `RecyclerView` 列表中：\n\n![](img/image210.jpg)\n\
  图 48-10\n\n\n\n\n- `app:layout_scrollFlags=\"scroll|enterAlways|enterAlwaysCollapsed\"\
  `\n- `android:minHeight=\"20dp\"`\n\n\n\n\n为了本示例，`Toolbar` 的 `scroll` 和 `enterAlways`\
  \ 选项将按照如下方式设置：\n\n```xml\n<android.support.v7.widget.Toolbar\n    android:id=\"\
  @+id/toolbar\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  ?attr/actionBarSize\"\n    android:background=\"?attr/colorPrimary\"\n    app:popupTheme=\"\
  @style/AppTheme.PopupOverlay\"\n    app:layout_scrollFlags=\"scroll|enterAlways\"\
  \ />\n```\n\n设置好相应的属性后，再次运行应用，并在 `RecyclerView` 列表中执行向上滑动动作。这将导致工具栏折叠出视图（图 49-54\
  \ )）。向下的滑动动作将使工具栏重新出现。![](img/image9331.jpg)图 49- 54\n\n## 49.4 引入折叠式工具栏布局\n\n`CollapsingToolbarLayout`\
  \ 容器通过提供更多选项以及在响应协调滚动动作时对应用栏及其子项折叠的更高控制级别，增强了标准工具栏。`CollapsingToolbarLayout` 类旨在作为\
  \ `AppBarLayout` 的子项添加，并提供了许多功能，例如随着工具栏的折叠和展开自动调整工具栏标题的字体大小。视差模式（parallax mode）允许应用栏中的指定内容在折叠时从视图中消失，而\
  \ `pin` 模式则允许应用栏的元素在收缩期间保持在固定位置。\n\n还提供了 `scrim`（遮罩层）选项，用于指定工具栏在折叠序列期间转换的颜色。\n\n\
  为了看到这些功能的实际效果，将修改 `activity_main.xml` 文件中包含的应用栏，使其使用 `CollapsingToolbarLayout` 类，并添加\
  \ `ImageView` 以更好地演示视差模式的效果。使用 `CollapsingToolbarLayout` 的新视图层级结构由图 49-6 中的图表所示：![](img/image9340.jpg)图\
  \ 49- 6\n\n在文本模式下将 `activity_main.xml` 文件加载到布局编辑器工具中，并修改布局使其内容如下：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<android.support.design.widget.CoordinatorLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:fitsSystemWindows=\"true\"\n    tools:context=\".MainActivity\">\n\
  \    <android.support.design.widget.AppBarLayout\n        android:layout_height=\"\
  200dp\"\n        android:layout_width=\"match_parent\"\n        android:theme=\"\
  @style/AppTheme.AppBarOverlay\">\n        <android.support.design.widget.CollapsingToolbarLayout\n\
  \            android:id=\"@+id/collapsing_toolbar\"\n            android:layout_width=\"\
  match_parent\"\n            android:layout_height=\"match_parent\"\n           \
  \ app:layout_scrollFlags=\"scroll|enterAlways\"\n            android:fitsSystemWindows=\"\
  true\"\n            app:contentScrim=\"?attr/colorPrimary\"\n            app:expandedTitleMarginStart=\"\
  48dp\"\n            app:expandedTitleMarginEnd=\"64dp\">\n            <ImageView\n\
  \                android:id=\"@+id/backdrop\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"200dp\"\n              \
  \  android:scaleType=\"centerCrop\"\n                android:fitsSystemWindows=\"\
  true\"\n                app:layout_collapseMode=\"parallax\"\n                android:src=\"\
  @drawable/appbar_image\" />\n            <android.support.v7.widget.Toolbar\n  \
  \              android:id=\"@+id/toolbar\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"?attr/actionBarSize\"\n\
  \                android:background=\"?attr/colorPrimary\"\n                app:popupTheme=\"\
  @style/AppTheme.PopupOverlay\"\n                app:layout_scrollFlags=\"scroll|enterAlways\"\
  \n                app:layout_collapseMode=\"pin\" />\n        </android.support.design.widget.CollapsingToolbarLayout>\n\
  \    </android.support.design.widget.AppBarLayout>\n    <include layout=\"@layout/content_card_demo\"\
  \ />\n</android.support.design.widget.CoordinatorLayout>\n```\n\n除了向上述布局中添加新元素外，还删除了背景颜色属性设置。此更改的优点是提供了一个透明的工具栏，允许应用栏中显示更多图像。\n\
