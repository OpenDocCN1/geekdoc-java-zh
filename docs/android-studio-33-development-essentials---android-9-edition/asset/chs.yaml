  \n## 71.2 介绍 Android MediaController 类\n\n`VideoView` 类拥有大量方法，可用于管理视频播放。以下是一些较常用的方法：\n\
  \n如果仅使用 `VideoView` 类播放视频，用户将无法对播放进行任何控制，视频将一直运行到结束。这个问题可以通过将 `MediaController`\
  \ 类实例挂载（attach）到 `VideoView` 实例上来解决。此时，`MediaController` 将提供一组控件，允许用户管理播放（例如暂停以及在视频时间轴上向后或向前跳转）。\n\
  \n控件的位置通过将控制器实例锚定（anchoring）到用户界面布局中的特定视图来指定。一旦挂载并锚定，控件将在播放开始时短暂出现，随后用户可以通过点击锚定该实例的视图，在任何时间重新恢复控件显示。\n\
  \n该类的一些关键方法如下：\n\n\n\n\n\n# 71.3 创建视频播放示例\n本章的剩余部分将创建一个示例应用程序，旨在使用 `VideoView` 和\
  \ `MediaController` 类来播放基于网络的 MPEG-4 视频文件。从欢迎界面选择 `Start a new Android Studio project`（新建\
  \ Android Studio 项目）快速启动选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n\
  在 `Name` 字段中输入 `VideoPlayer`，并指定 `com.ebookfrenzy.videoplayer` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单设置为\
  \ `Java`。\n\n# 71.4 设计 VideoPlayer 布局\n主 Activity 的界面将仅由一个 `VideoView` 类的实例组成。使用\
  \ `Project` 工具窗口找到 `app -> res -> layout -> activity_main.xml` 文件，双击该它，将 `Layout\
  \ Editor` 工具切换到 `Design` 模式，并删除默认的 `TextView` 组件。\n\n从 `Palette` 面板的 `Widgets` 类别中，将\
  \ `VideoView` 实例拖放到布局上，使其填充可用的画布区域，如图 71-1 所示。使用 `Attributes` 面板，将 `layout_width`\
  \ 和 `layout_height` 属性分别更改 `match_constraint` 和 `wrap_content`。此外，移除连接 `VideoView`\
  \ 底部到父 `ConstraintLayout` 底部的约束。最后，将组件的 ID 更改为 `videoView1`![](img/image13647.jpg)\n\
  图 71-1\n\n布局设计完成后，布局的 XML 资源应如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<android.support.constraint.ConstraintLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \ xmlns:app=\"http://schemas.android.com/apk/res-auto\" xmlns:tools=\"http://schemas.android.com/tools\"\
  \ android:layout_width=\"match_parent\" android:layout_height=\"match_parent\" tools:context=\"\
  .MainActivity\">\n    <VideoView android:id=\"@+id/videoView1\" android:layout_width=\"\
  0dp\" android:layout_height=\"wrap_content\" app:layout_constraintEnd_toEndOf=\"\
  parent\" app:layout_constraintStart_toStartOf=\"parent\" app:layout_constraintTop_toTopOf=\"\
  parent\" />\n</android.support.constraint.ConstraintLayout>\n```\n\n# 71.5 配置 VideoView\n\
  下一步是为 `VideoView` 配置要播放的视频路径，然后开始播放。将在主 Activity 初始化时执行，因此将 `MainActivity.java`\
  \ 文件加载到编辑器并按照下面的列表对其进行修改：\n\n```java\npackage com.ebookfrenzy.videoplayer;\nimport\
  \ android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\nimport android.widget.VideoView;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private VideoView videoView;\n\
  \    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n     \
  \   super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_video_player);\n\
  \        configureVideoView();\n    }\n    private void configureVideoView() {\n\
  \        videoView = findViewById(R.id.videoView1);\n        videoView.setVideoPath(\"\
  https://www.ebookfrenzy.com/android_book/movie.mp4\");\n        videoView.start();\n\
  \    }\n}\n```\n\n这段代码的作用只是获取布局中 `VideoView` 实例的引用，设置其视频路径指向托管在网站上的 MPEG-4 文件，然后开始播放视频。\n\
  \n# 71.6 添加互联网权限\n此时尝试运行应用程序将导致程序启动失败，Android 设备上会出现一个错误对话框，显示“Unable to Play Video.\
  \ Sorry, this video cannot be played”（无法播放视频。抱歉，无法播放此视频）。这不是由于代码错误或视频文件格式不。问题在于应用程序尝试通过互联网访问文件，但未能请求适当的权限。要解决这个问题，请编辑项目的\
  \ `AndroidManifest.xml` 文件并添加一行请求互联网访问的代码：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \ package=\"com.ebookfrenzy.videoplayer\" >\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application android:allowBackup=\"true\"\
  \ android:icon=\"@mipmap/ic_launcher\" android:label=\"@string/app_name\" android:supportsRtl=\"\
  true\" android:theme=\"@style/AppTheme\" >\n        ...\n    </application>\n</manifest>\n\
  ```\n\n在物理 Android 设备上运行应用程序以测试它。应用程序启动后，在播放开始之前，视频内容缓冲可能会有短暂延迟（图 71-2）。![](img/image13709.jpg)\n\
  图 71-2\n\n这说明了将视频播放集成到 Android 应用程序是多么简单。到目前为止，示例中的一切都是使用 `VideoView` 实例和三行代码实现的。\n\
  \n# 71.7 为 Video View 添加 MediaController\n目前 `VideoPlayer` 应用程序没有方法控制播放。如前所述，可以使用\
  \ `MediaController` 类来实现。为为 VideoView 添加控制器，请再次修改 `configureVideoView()` 方法：\n\n\
  ```java\npackage com.ebookfrenzy.videoplayer;\nimport android.support.v7.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.widget.VideoView;\nimport android.widget.MediaController;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private VideoView videoView;\n\
  \    private MediaController mediaController;\n  ..\n    private void configureVideoView()\
  \ {\n        final VideoView videoView = findViewById(R.id.videoView1);\n      \
  \  videoView.setVideoPath(\"https://www.ebookfrenzy.com/android_book/movie.mp4\"\
  );\n        mediaController = new MediaController(this);\n        mediaController.setAnchorView(videoView);\n\
  \        videoView.setMediaController(mediaController);\n        videoView.start();\n\
  \    }\n```\n\n当实现这些更改并启动应用程序时，点击 `VideoView` 画布将在视频播放上方显示控件。这些控件应包含进度条以及快进、倒退和播放/暂停按钮。控件消失后，可以通过可以通过点击\
  \ `VideoView` 画布即可随时恢复。只需另外三行代码，我们的视频播放器现在就有媒体控件，如图 71-3 所示![](img/image3739.jpg)\n\
  图 3\n\n# 71.8 设置 onPreparedListener\n作为处理视频媒体的最后一个示例，现在将扩展 activity 以演示配置监听器的机制。在这种情况下，将实现一个监听器在\
  \ Android Studio Logcat 中输出视频时长。监听器还将配置视频播放循环：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\
  import android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\nimport\
  \ android.widget.VideoView;\nimport android.widget.MediaController;\nimport android.util.Log;\n\
  import android.media.MediaPlayer;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private VideoView videoView;\n    private MediaController mediaController;\n\
  \    String TAG = \"VideoPlayer\";\n    private void configureVideoView() {\n  \
  \      final VideoView videoView = findViewById(R.id.videoView1);\n        videoView.setVideoPath(\"\
  http://www.ebookfrenzy.com/android_book/movie.mp4\");\n        MediaController mediaController\
  \ = new MediaController(this);\n        mediaController.setAnchorView(videoView);\n\
  \        videoView.setMediaController(mediaController);\n        videoView.setOnPreparedListener(new\
  \ MediaPlayer.OnPreparedListener() {\n            @Override\n            public\
  \ void onPrepared(MediaPlayer mp) {\n                mp.setLooping(true);\n    \
  \            Log.i(TAG, \"Duration = \" + videoView.getDuration());\n          \
  \  }\n        });\n        videoView.start();\n    }\n}\n```\n\n现在在视频播放开始之前，Android\
  \ Studio Logcat 面板将一条类似如下的消息，视频在结束后将重启：\n`1-05 10:27:52.256-12/com.ebookfrenzy.videoplayer/VideoPlayer:\
  \ Duration = 687`\n\n### 71.9 总结\nAndroid 设备是向用户交付内容的优秀平台，特别是视频媒体形式。如本章所述，Android\
  \ SDK 提供了两个类，即 `VideoView` 和 `MediaController`，它们使得将视频播放集成到 Android 应用程序中变得快速简单，通常只需要几行\
  \ Java 代码。\n\n# 72 Android 画中画模式\n在前面的章节中涵盖 Android 的多任务处理时，曾简要提到了画中画（PiP）模式，但没有进行详细介绍。PiP\
  \ 模式主要用于视频播放，允许 activity 屏幕缩小尺寸并放置在屏幕上的任何位置。在此状态下，activity 继续运行，无论设备上运行着任何其他活动，窗口都会保持可见。这允许用户例如在执行检查电子邮件或处理电子表格等任务的同时继续观看视频播放。本章将在下一章为\
  \ VideoPlayer 项目添加画中画支持之前提供其概述。\n\n## 72.1 画中画功能\n正如本章后部分将解释的以及下一章将演示的，activity\
  \ 通过运行应用程序内部的 API 调用进入 PiP 模式。进入 PiP 模式后，可以指定配置选项来控制 PiP 窗口的宽高比，并定义包含在窗口内的 activity\
  \ 屏幕区域。图 72-1 例如，显示了 PiP 模式下的视频播放活动![](img/image3792.jpg)\n图 72-1\n\n图 72-2 显示用户点击后的\
  \ PiP 模式窗口。在这种模式下，窗口全全屏，并在右上角有一个退出按钮可以将应用程序置于后台。添加到 PiP 窗口的任何自定义操作在显示时也会出现在屏幕上。如图\
  \ 72-2 所示。\n\n本章的剩余部分将概述如何在 Android 内部启用并管理 PiP 模式。\n\n## 72.2 启用画中画模式\nPiP 模式目前仅支持运行\
  \ `API 26: Android 8.0 (Oreo)` 或更高版本的设备。实现 PiP 模式的第一步是在项目清单文件中启用它。通过在每个需要的 activity\
  \ 元素添加以下行来按 activity 配置 PiP 模式：\n\n```xml\n<activity android:name=\".MyActivity\"\
  \ android:supportsPictureInPicture=\"true\" android:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  >\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n`android:supportsPictureInPicture` 项为\
  \ activity 启用 PiP，而 `android:configChanges` 属性通知 Android 该活动能够处理布局更改。如果没有此设置，每次\
  \ activity 进出 PiP 模式时 activity 都会重启，导致视频在过渡期间重新开始。\n\n## 72.3 配置画中画参数\nPiP 行为通过使用\
  \ `PictureInPictureParams` 类来定义，其实例可以使用 `Builder` 类如下创建：\n\n```java\nPictureInPictureParams\
  \ params = new PictureInPictureParams.Builder().build();\n```\n\n上述代码创建了一个默认的 `PictureInPictureParams`\
  \ 实例，具有特殊参数。也可以使用以下可选方法调用来自定义参数：\n\n\n\n\n- \n- \n- \n\n\n\n例如，以下代码在 `PictureInPictureParams`\
  \ 对象中配置了画幅比和操作参数。对于宽高比，它是使用 `VideoView` 实例的宽度和高度维度定义的：\n\n```\nRational rational\
  \ = new Rational(videoView.getWidth(),videoView.getHeight());\nPictureInPictureParams\
  \ params =new PictureInPictureParams.Builder().setAspectRatio(rational).setActions(actions).build();\n\
  ```\n一旦定义好，可以使用 `setPictureInPictureParams()` 方法随时设置画中画（PiP）参数：\n\n```\nsetPictureInPictureParams(params);\n\
  ```\n在进入 PiP 模式时也可以指定参数。\n\n## 72.4 进入画中画模式\n通过调用 `enterPictureInPictureMode()`\
  \ 方法并传递 `PictureInPictureParams` 对象，可以将 Activity 置画中画模式：\n\n```\nenterPictureInPictureMode(params);\n\
  ```\n如果不需要任何参数，只需按照上一节所述创建一个默认的 `PictureInPictureParams` 对象。如果之前已使用 `setPictureInPictureParams()`\
  \ 方法设置过参数，则这些参数将与调用 `enterPictureInPictureMode()` 方法时指定的参数合并。\n\n## 72.5 检测画中画模式变化\n\
  当 Activity 进入 PiP 模式时，隐藏任何不需要的视图，这样 PiP 窗口内只显示视频播放。当 Activity 重新进入全屏模式时，需要恢复任何隐藏的用户界面组件。这些以及任何其他特定特定的任务可以通过重写\
  \ `onPictureInPictureModeChanged()` 方法来实现。当该方法添加到 Activity 后，每当 Activity 在 PiP 和全屏模式之间切换时都会调用该方法，并传递一个\
  \ `Boolean` 值，表示 Activity 当前是否处于 PiP 模式：\n\n```java\n@Override\npublic void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \    if (isInPictureInPictureMode) {\n        // Activity 进入画中画模式\n    } else {\n\
  \        // Activity 进入全屏模式\n    }\n}\n```\n\n## 72.6 添加画中画操作\n当用户点击 PiP 窗口时，画中画操作将以图标的形式出现。实现\
  \ PiP 操作是一个多步骤的过程，首先要实现让 PiP 窗口通知 Activity 已选择某项操作的方法。这通过在 Activity 中设置广播接收器来实现，然后在\
  \ PiP 操作中创建一个 `pending intent`，该意图随后被配置为广播一个广播接收器正在监听的意图。当广播接收器由意图触发时，可以使用意图中存储的数据来识别所执行的操作，并在\
  \ Activity 中采取必要的行动。\n\nPiP 操作使用 `RemoteAction` 实例声明，这些实例使用图标、标题、描述和 `PendingIntent`\
  \ 对象进行初始化。一旦创建了一个或多个操作，就会将它们添加到 `ArrayList` 中，并在构建 `PictureInPictureParams` 对象时传递给\
  \ `setActions()` 方法。\n\n以下代码段演示了 `Intent`、`PendingIntent` 和 `RemoteAction` 对象的创建，以及一个\
  \ `PictureInPictureParams` 实例，然后将该实例应用于 Activity 的 PiP 设置：\n\n```java\nfinal ArrayList<RemoteAction>\
  \ actions = new ArrayList<>();\nIntent actionIntent = new Intent(\"MY_PIP_ACTION\"\
  );\nfinal PendingIntent pendingIntent =PendingIntent.getBroadcast(MyActivity.this,REQUEST_CODE,\
  \ actionIntent, 0);\nfinal Icon icon = Icon.createWithResource(MyActivity.this,R.drawable.action_icon);\n\
  RemoteAction remoteAction = new RemoteAction(icon,\"My Action Title\",\"My Action\
  \ Description\",pendingIntent);\nactions.add(remoteAction);\nPictureInPictureParams\
  \ params =new PictureInPictureParams.Builder().setActions(actions).build();\nsetPictureInPictureParams(params);\n\
  ```\n\n## 72.7 总结\n画中画模式是 Android 8.0 引入的一种多任务功能，专门用于允许用户在执行其他应用和 Activity 任务时继续小窗口播放视频。在使用\
  \ PiP 模式之前，必须在清单文件中为支持 PiP 的 Activity 启用它。\n\nPiP 模式的行为使用 `PictureInPictureParams`\
  \ 类实例进行配置，并通过 Activity 内部调用 `enterPictureInPictureMode()` 方法启动。在 PiP 模式下，应只显示视频播放，这要求在选择全屏模式之前隐藏任何其他用户界面元素。这些以及其他与模式切换相关的任务可以通过重写\
  \ `onPictureInPictureModeChanged()` 方法来实现。\n\nPiP 操作在用户点击 PiP 窗口时以图标形式叠加在 PiP 窗口上。当选中时，这些操作会触发\
  \ Activity 内部的行为。PiP 窗口通过广播接收器和 pending intents 通知 Activity 已执行操作。\n\n## 73. Android\
  \ 画中画教程\n接上章节，本章将采用现有的 `VideoPlayer` 项目并对其增强，以添加画中画支持，包括检测 PiP 模式变化以及添加用于显示当前运行视频信息的\
  \ PiP 操作。\n\n### 73.1 在清单文件中添加画中画支持\n在 Android 应用项目中添加 PiP 支持的第一步是在项目的 Manifest\
  \ 文件中启用它。打开 `manifests -> AndroidManifest.xml` 文件并修改 activity 元素以启用 PiP 支持：\n\n\
  ```xml\n<activity android:name=\".MainActivity\"\n    android:supportsPictureInPicture=\"\
  true\"\n    android:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  \ >\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n### 73.2 添加画中画按钮\n按照目前的设计，`VideoPlayer`\
  \ activity 的布局仅包含一个 `VideoView` 实例。现在将在布局中添加一个按钮用于切换到 PiP 模式。将 `activity_main.xml`\
  \ 文件加载到布局编辑器中，从调色板拖入 `Button` 对象到布局中，使其位置如图 73-1 所示。\n\n更改按钮上的文本显示为“Enter PiP Mode”，并将字符串提取到名为\
  \ `enter_pip_mode` 的资源中。在继续下一步之前，将按钮的 ID 更改为 `pipButton` 并配置按钮调用名为 `enterPipMode`\
  \ 的方法。\n\n### 73.3 进入画中画模式\n`enterPipMode` 回调方法现在需要添加到 `MainActivity.java` 文件。找到该文件，在代码编辑器中打开并添加此方法：\n\
  \n```java\nimport android.view.View;\nimport android.app.PictureInPictureParams;\n\
  import android.util.Rational;\nimport android.widget.Button;\n\npublic void enterPipMode(View\
  \ view) {\n    Button pipButton = findViewById(R.id.pipButton);\n    Rational rational\
  \ = new Rational(videoView.getWidth(),videoView.getHeight());\n    PictureInPictureParams\
  \ params=new PictureInPictureParams.Builder().setAspectRatio(rational).build();\n\
  \    pipButton.setVisibility(View.INVISIBLE);\n    videoView.setMediaController(null);\n\
  }\n```\n该方法通过获取 `Button` 的引用开始，创建一个包含 `VideoView` 宽度和高度的 `Rational` 对象。然后使用 `PictureInPictureParams.Builder`\
  \ 创建 `PictureInPictureParams`，并将 `Rational` 对象作为视频播放的画幅比传递。由于按钮在 PiP 模式下不需要可见，因此将其设置为隐藏。为了让视频视图在\
  \ PiP 模式下不被遮挡，在运行 Android 8 或更高版本的设备或模拟器上编译并运行应用，在点击 PiP 模式按钮之前等待视频播放。视频播放应在 PiP\
  \ 窗口中最小化，如图 73-2。尽管视频现在于 PiP 窗口中播放，但视图被标准的 action bar 遮挡。这需要更改应用主题。在 Android Studio\
  \ 中，找到并编辑 `app -> res -> styles.xml` 文件，修改 `AppTheme` 元素使用 `NoActionBar` 主题：\n\n\
  ```xml\n<resources>\n    <!-- Base application theme. -->\n    <style name=\"AppTheme\"\
  \ parent=\"Theme.AppCompat.Light.NoActionBar\">\n        <!-- Customize your theme\
  \ here. -->\n        <item name=\"colorPrimary\">@color/colorPrimary</item>\n  \
  \      <item name=\"colorPrimaryDark\">@color/colorPrimaryDark</item>\n        <item\
  \ name=\"colorAccent\">@color/colorAccent</item>\n    </style>\n</resources>\n```\n\
  编译并运行应用，将视频播放放入 PiP 模式，如图 73-3 所示。点击 PiP 窗口使其尺寸增大，然后当 Activity 返回全屏模式时，注意按钮和媒体播放控件仍然隐藏。显然需要在\
  \ Activity 中添加一些代码来检测 PiP 模式的变化。\n\n### 73.4 检测画中画模式变化\n正如上一节所述，通过重写 Activity 内部的\
  \ `onPictureInPictureModeChanged()` 方法来检测 PiP 模式变化。在这种情况下，需要在 `MainActivity.java`\
  \ 文件编写该方法：\n\n```java\n@Override\npublic void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \    Button pipButton = findViewById(R.id.pipButton);\n    if (isInPictureInPictureMode)\
  \ {\n    } else {\n        pipButton.setVisibility(View.VISIBLE);\n        videoView.setMediaController(mediaController);\n\
  \    }\n}\n```\n当该方法被调用时，传递一个 `Boolean` 值表示 Activity 现在是否处于 PiP 模式。上述方法检查此值以决定是否显示\
  \ PiP 按钮并重新激活播放控件。\n\n### 73.5 添加广播接收器\n项目的最后一步是在 PiP 窗口中添加一个操作。此操作的目的是显示包含正在播放视频名称的\
  \ `Toast` 消息。这需要在 PiP 窗口和 Activity 之间进行通信。实现此最简单的方法之一是在 Activity 中实现广播接收器，并使用 pending\
  \ intent 从 PiP 窗口向 Activity 广播消息。每次 Activity 进入 PiP 模式都需要执行这些步骤，因此需要在 `onPictureInPictureModeChanged()`\
  \ 方法中添加代码。现在找到该方法并通过添加一些代码创建意图过滤器并初始化广播接收器：\n\n```java\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.content.IntentFilter;\n\
  import android.widget.Toast;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private BroadcastReceiver receiver;\n    private VideoView videoView;\n\
  \    private MediaController mediaController;\n    String TAG = \"VideoPlayer\"\
  ;\n\n    @Override\n    public void onPictureInPictureModeChanged(boolean isInPictureInPictureMode)\
  \ {\n        super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n  \
  \      Button pipButton = findViewById(R.id.pipButton);\n        if (isInPictureInPictureMode)\
  \ {\n            IntentFilter filter = new IntentFilter();\n            filter.addAction(\"\
  com.ebookrenzy.videoplayer.VIDEO_INFO\");\n            receiver = new BroadcastReceiver()\
  \ {\n                @Override\n                public void onReceive(Context context,\
  \ Intent intent) {\n                    Toast.makeText(context,\"Favorite Movie\
  \ Clips\",Toast.LENGTH_LONG).show();\n                }\n            };\n      \
  \      registerReceiver(receiver, filter);\n        } else {\n            pipButton.setVisibility(View.VISIBLE);\n\
  \            videoView.setMediaController(mediaController);\n            if (receiver\
  \ != null) {\n                unregisterReceiver(receiver);\n            }\n   \
  \     }\n    }\n}\n```\n\n### 73.6 添加画中画操作\n实现广播接收器后，下一步是创建一个配置了图像的 `RemoteAction`，以代表\
  \ PiP 窗口中的操作。对于本例，将使用名为 `ic_info_24dp.xml` 的图像文件。该文件可以在从以下 URL 下载源代码的 `project_icons`\
  \ 文件夹中找到：https://www.ebookrenzy.com/retail/androidstudio33/index.php\n\n找到此图标文件并将其粘贴到项目\
  \ `app -> res -> drawable` 文件夹中：图 73-4。\n\n下一步是创建一个发送给广播接收器的 `Intent`。然后，该意图需要封装在\
  \ `PendingIntent` 对象中，允许稍后用户点击 PiP 窗口中的操作按钮时触发该意图。编辑 `MainActivity.java` 文件以添加创建\
  \ `Intent` 和 `PendingIntent` 对象的方法：\n\n```java\npublic class MainActivity extends\
  \ AppCompatActivity {\n    private static final int REQUEST_CODE = 101;\n\n    private\
  \ void createPipAction() {\n        Intent actionIntent = new Intent(\"com.ebookrenzy.videoplayer.VIDEO_INFO\"\
  );\n        final PendingIntent pendingIntent =PendingIntent.getBroadcast(MainActivity.this,REQUEST_CODE,\
  \ actionIntent, 0);\n    }\n}\n```\n现在 `Intent` 对象和 `PendingIntent` 实例已创建，需要创建一个包含图标以显示在\
  \ PiP 窗口中的 `RemoteAction` 对象：\n\n```java\nimport android.app.RemoteAction;\nimport\
  \ android.graphics.drawable.Icon;\nimport java.util.ArrayList;\n\n// ... 在 createPipAction\
  \ 中 ...\nfinal Icon icon = Icon.createWithResource(MyActivity.this,R.drawable.action_icon);\n\
  RemoteAction remoteAction = new RemoteAction(icon,\"My Action Title\",\"My Action\
  \ Description\",pendingIntent);\nArrayList<RemoteAction> actions = new ArrayList<>();\n\
  actions.add(remoteAction);\nPictureInPictureParams params =new PictureInPictureParams.Builder().setActions(actions).build();\n\
  setPictureInPictureParams(params);\n```\n在 `createPipAction()` 方法中添加以下代码以创建 `RemoteAction`\
  \ 对象以及一个 `PictureInPictureParams` 实例：\n\n```java\n// ... 之前的代码 ...\nactions.add(remoteAction);\n\
  PictureInPictureParams params =new PictureInPictureParams.Builder().setActions(actions).build();\n\
  setPictureInPictureParams(params);\n```\n\n### 73.7 测试画中画操作\n再次编译并运行应用，将 Activity\
  \ 置于画中画模式。点击 PiP 窗口使新操作出现，如图 73-5 所示。点击操作按钮等待显示视频名称的 Toast 消息：图 73-6。\n\n### 73.8\
  \ 总结\n本章演示了 Android 项目 添加画中画支持，包括启用 PiP 模式和 PiP 操作的实现。[总结部分已省略]\n\n## 74. 使用相机在\
  \ Android 上录制视频和捕捉图像\n许多 Android 设备都配备有一个摄像头。有多种方法允许用户通过内置摄像头在应用内录制视频，但简单的方法是使用\
  \ Android 系统包含的意图。当用户完成录制后，意图将返回应用，传递录制视频的文件引用。\n\n### 74.1 检查相机支持\n在尝试访问 Android\
  \ 设备上的相机之前，必须实施防御性代码来验证硬件的存在。这非常重要，因为并非所有 Android 设备都包含相机。相机的存在可以通过调用 `hasSystemFeature()`\
  \ 方法识别。为了检查前摄像头的存在，需要检查 `PackageManager.FEATURE_FRONT`：\n\n```java\nprivate boolean\
  \ hasCamera() {\n    return (getPackageManager().hasSystemFeature(PackageManager.FEATURE_FRONT));\n\
  }\n```\n同样可以使用 `PackageManager.FEATURE_ANY` 验证是否存在相机。\n\n### 74.2 调用\n使用视频捕捉意图至少涉及调用该意图并处理来自\
  \ Activity 的返回：\n\n```java\nprivate static final int VIDEO_CAPTURE = 101;\nIntent\
  \ intent = new Intent(MediaStore.ACTION_VIDEO_CAPTURE);\nstartActivityForResult(intent,\
  \ VIDEO_CAPTURE);\n```\n\n### 74.3 调用\n除了视频捕捉意图，Android 还包含了使用内置相机拍摄静态照片的意图：\n\n\
  ```java\nprivate static final int IMAGE_CAPTURE = 102;\nIntent intent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);\n\
  startActivityForResult(intent, IMAGE_CAPTURE);\n```\n\n### 74.4 创建 Android 录制项目\n\
  在本章的剩余部分，将创建一个简单的应用来演示视频捕捉意图的使用。该应用由单个按钮组成，该按钮将启动视频捕捉意图。一旦录制视频且视频捕捉意图被关闭，应用程序将通过\
  \ Toast 消息显示视频文件的路径。\n\n### 74.5 设计用户界面布局\n导航到 `app -> res -> layout` 并双击 `activity_main.xml`\
  \ 布局文件将其加载到布局编辑器中。在设计模式的布局编辑器中，删除默认的“Hello World!”文本视图，并替换为位于画布中心的 `Button` 视图。更改按钮上的文本为“Record\
  \ Video”，将其提取到字符串资源中。此外，为按钮分配 `onClick` 属性，以便在用户选择时调用名为 `startRecording` 的方法：图 74-2。\n\
  \n在属性窗口中，将 ID 更改为 `recordButton`。\n\n### 74.6 检查相机\n在尝试启动视频捕捉意图之前，应用首先需要验证运行它的设备实际上具有摄像头。对于本例，我们将简单使用之前概述的\
  \ `hasCamera()` 方法，这次检查任何类型的摄像头。如果不存在相机，“Record Video”按钮将被禁用。\n\n```java\npackage\
  \ com.ebookrenzy.cameraapp;\nimport android.support.v7.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.content.pm.PackageManager;\nimport android.widget.Button;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_camera_app);\n        Button recordButton\
  \ =findViewById(R.id.recordButton);\n        if (!hasCamera())\n            recordButton.setEnabled(false);\n\
  \    }\n\n    private boolean hasCamera() {\n        return (getPackageManager().hasSystemFeature(PackageManager.FEATURE_CAMERA));\n\
  \    }\n}\n```\n\n\n\n\n| 权限组 |\n| 日历 |\n| 相机 |\n| 联系人 |\n| 位置 |\n| 麦克风 |\n| 电话\
  \ |\n| 传感器 |\n| 短信 |\n| 存储 |\n\n\n\n\n# 75.2 创建权限示例项目\n\n从欢迎界面选择 `Start a new Android\
  \ Studio project` 快速启动选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。在 `Name`\
  \ 字段中输入 `PermissionDemo`，并指定 `com.ebookfrenzy.permissiondemo` 为包名。在点击 `Finish` 按钮之前，将\
  \ `Minimum API level` 设置更改为 `API 26`：`Android 8.0 (Oreo)`，并将 `Language` 菜单设置为 `Java`。\n\
  \n### 75.3 检查权限\n\nAndroid 支持库（Android Support Library）包含许多方法，可用于在 Android 应用中查找和管理危险权限。无论运行该应用的的\
  \ Android 版本如何，这些 API 调用都是安全的，但只有在在 Android `6.0` 或更高版本的系统上执行时，它们才会执行有意义的任务。\n\n\
  在应用尝试使用某个需要批准危险权限的功能之前，无论之前是否已授予了该权限，代码都必须检查该权限是否已授予。这可以通过调用 `ContextCompat` 类的\
  \ `checkSelfPermission()` 方法来实现，并将当前 activity 的引用和请求的权限作为参数传递。该方法将检查权限是否之前已授予，并返回与\
  \ `PackageManager.PERMISSION_GRANTED` 或 `PackageManager.PERMISSION_DENIED` 匹配的整数值。在示例项目的\
  \ `MainActivity.java` 文件中，修改代码以检查是否已授予应用录音的权限：\n\n```java\npackage com.ebookfrenzy.permissiondemoactivity;\n\
  import android.support.v7.app.AppCompatActivity;\nimport android.support.v4.content.ContextCompat;\n\
  import android.os.Bundle;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.support.v4.content.ContextCompat;\nimport android.util.Log;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private static String TAG\
  \ = \"PermissionDemo\";\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_permission_demo);\n\
  \        setupPermissions();\n    }\n    private void setupPermissions() {\n   \
  \     int permission = ContextCompat.checkSelfPermission(this,Manifest.permission.RECORD_AUDIO);\n\
  \        if (permission != PackageManager.PERMISSION_GRANTED) {\n            Log.i(TAG,\
  \ \"Permission to record denied\");\n        }\n    }\n}\n```\n\n在运行 Android `6.0`\
  \ 之前的版本的设备或模拟器上运行应用，并检查 Android Studio 中的 `Logcat` 输出。应用启动后，`Logcat` 输出应包含“Permission\
  \ to record denied”消息。编辑 `AndroidManifest.xml` 文件（位于 Project 工具窗口的 `app` -> `manifests`\
  \ 下），并添加以下一行代码来请求录音权限：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"package=\"com.ebookfrenzy.permissiondemoactivity\"\
  \ >\n  <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n  <application\
  \ android:allowBackup=\"true\"android:icon=\"@mipmap/ic_launcher\"android:label=\"\
  @sxtring/app_name\" android:supportsRtl=\"true\"android:theme=\"@style/AppTheme\"\
  \ >\n    <activity android:name=\".MainActivity\" >\n      <intent-filter>\n   \
  \     <action android:name=\"android.intent.action.MAIN\" />\n        <category\
  \ android:name=\"android.intent.category.LAUNCHER\" />\n      </intent-filter>\n\
  \    </activity>\n  </application>\n</manifest>\n```\n\n再次编译并运行应用，并注意这次权限拒绝的消息没有出现。显然，在较旧版本的\
  \ Android 上请求此权限所需的所有工作都已完成。然而，在运行 Android `6.0` 或更高版本的设备或模拟器上运行应用，你会发现尽管 manifest\
  \ 文件中添加了权限，检查仍然会报告权限被拒绝。这是因为 Android `6` 或更高版本要求应用还必须在运行时请求危险权限。\n\n# 75.4 在运行时请求权限\n\
  \n权限请求是通过调用 `ActivityCompat` 类的 `requestPermissions()` 方法发出的。当调用此方法时，权限请求将进行异步处理，并在任务完成后调用一个名为\
  \ `onRequestPermissionsResult()` 的方法。\n\n`requestPermissions()` 方法的参数包括当前 activity\
  \ 的引用、所请求权限的标识符以及请求代码。请求代码可以是任意整数值，并将用于识别是哪个请求触发了对 `onRequestPermissionsResult()`\
  \ 方法的调用。修改 `MainActivity.java` 文件，声明一个请求代码并在权限检查失败时请求录音权限：\n\n```java\nimport android.support.v4.app.ActivityCompat;\n\
  public class MainActivity extends AppCompatActivity {\n    private static String\
  \ TAG = \"PermissionDemo\";\n    private static final int RECORD_REQUEST_CODE =\
  \ 101;\n\n    @Override\n    private void setupPermissions() {\n        int permission\
  \ = ContextCompat.checkSelfPermission(this,Manifest.permission.RECORD_AUDIO);\n\
  \        if (permission != PackageManager.PERMISSION_GRANTED) {\n            Log.i(TAG,\
  \ \"Permission to record denied\");\n            makeRequest();\n        }\n   \
  \ }\n    protected void makeRequest() {\n        ActivityCompat.requestPermissions(this,new\
  \ String[]{Manifest.permission.RECORD_AUDIO},RECORD_REQUEST_CODE);\n    }\n}\n```\n\
  \n接下来，实现 `onRequestPermissionsResult()` 方法，其内容如下：\n\n```java\n@Override\npublic\
  \ void onRequestPermissionsResult(int requestCode,String permissions[], int[] grantResults)\
  \ {\n    switch (requestCode) {\n        case RECORD_REQUEST_CODE: {\n         \
  \   if (grantResults.length == 0|| grantResults[0] !=PackageManager.PERMISSION_GRANTED)\
  \ {\n                Log.i(TAG, \"Permission has been denied by user\");\n     \
  \       } else {\n                Log.i(TAG, \"Permission has been granted by user\"\
  );\n            }\n        }\n    }\n}\n```\n\n在 Android `6` 或更高版本的模拟器或设备上编译并运行应用，注意会出现请求录音的对话框。点击\
  \ Allow 按钮，当权限请求对话框出现时，检查 Logcat 是否出现了“Permission has been granted by user”。一旦用户授予了权限，`checkSelfPermission()`\
  \ 方法将返回 `PERMISSION_GRANTED` ，直到用户卸载应用或在 `Settings` 中更改应用权限。\n\n# 75.5 为权限请求提供理由\n\
  \n从图 75-3 所示，用户拥有拒绝权限的选项。在这种情况下，除非用户在点击拒绝按钮之前选择了“不再询问”，否则应用每次启动时都会继续请求权限。用户多次拒绝可能表明用户不理解为什么需要该权限。因此，如果在请求时解释了原因，用户更有可能授予权限。遗憾的是，无法更改请求对话框的内容来包含此类解释。最好的做法是在向用户展示请求对话框之前，在一个独立的对话框中包含解释。Android\
  \ 文档建议只有在用户之前拒绝过权限时才显示解释对话框。`ActivityCompat` 类的 `shouldShowPermissionRationale()`\
  \ 方法在用户之前拒绝过请求时将返回 `true`，如果之前未请求过，则返回 `false`。在结果为 `true` 的情况下，应用应显示包含权限理由的对话框。为了向示例应用添加此功能，修改\
  \ `onCreate()` 方法如下：\n\n```java\nimport android.app.AlertDialog;\nimport android.content.DialogInterface;\n\
  \nprivate void setupPermissions() {\n    int permission = ContextCompat.checkSelfPermission(this,Manifest.permission.RECORD_AUDIO);\n\
  \    if (permission != PackageManager.PERMISSION_GRANTED) {\n        Log.i(TAG,\
  \ \"Permission to record denied\");\n        if (ActivityCompat.shouldShowPermissionRationale(this,Manifest.permission.RECORD_AUDIO))\
  \ {\n            AlertDialog.Builder builder =new AlertDialog.Builder(this);\n \
  \           builder.setMessage(\"Permission to access the microphone is required\
  \ for this app to record audio.\")\n            .setTitle(\"Permission required\"\
  );\n            builder.setPositiveButton(\"OK\",new DialogInterface.OnClickListener()\
  \ {\n                public void onClick(DialogInterface dialog, int id) {\n   \
  \                 Log.i(TAG, \"Clicked\");\n                    makeRequest();\n\
  \                }\n            });\n            AlertDialog dialog = builder.create();\n\
  \            dialog.show();\n        } else {\n            makeRequest();\n    \
  \    }\n    }\n}\n```\n\n该方法仍然检查权限是否已授予，但现在还会识别是否需要显示理由。如果用户之前拒绝了请求，将显示一个包含解释和 OK\
  \ 按钮的对话框，点击该按钮时会调用 `makeRequest()` 方法。如果之前未请求过权限，代码将直接请求权限。\n\n# 75.6 测试权限应用\n\n\
  在执行测试的 Android 6 或更高版本的设备或模拟器席上，启动 `Settings` 应用，选择 `Apps & notifications` 选项，滚动并选择\
  \ `PermissionDemo` 应用。在应用设置界面，点击 `uninstall` 按钮从设备删除应用。再次运行应用，当权限请求对话框出现时，点击 `Deny`\
  \ 按钮。终止应用，第二次运行并验证理由对话框是否出现。点击 OK 按钮，当权限请求对话框出现时，点击 Allow 按钮。返回 `Settings` 应用，选择\
  \ `Apps` 选项，再次从列表中选择 `PermissionDemo` 应用。一旦列出应用设置，验证 `Permissions` 部分是否列出了 `Microphone`\
  \ 权限。\n\n## 75.7 总结\n\n在 Android `6.0` 引入之前，应用请求访问某些功能的唯一步骤是向应用程序的 manifest 文件添加适当的行。随后用户在安装应用时会被提示批准该权限。对于大多数权限，情况仍然如此，但一组被认为是危险的权限除外。被认为是危险的权限通常具有允许应用违反用户隐私的可能，例如允许访问麦克风、联系人列表或外部存储。如本章所述，基于\
  \ Android 6 或更高版本的应用现在在启动时，除了在 manifest 文件中包含请求外，还向用户请求危险权限批准。\n\n## 76. 使用 MediaPlayer\
  \ 和 Recorder 进行 Android 录制和播放\n\n本章将提供 `MediaRecorder` 类的概述，并解释如何使用该类录制音频或视频的基本知识。还将涵盖使用\
  \ `MediaPlayer` 类播放音频。在介绍基础知识后，将创建一个示例应用来演示这些技术。除了查看音频和视频处理外，本章还将触及将文件保存到 SD 卡的主题。\n\
  \n## 76.1 播放音频\n\n在音频播放方面，大多数 Android 实现支持 `AAC LC/LTP`、`HE-AACv1 (AAC+)`、`HE-AACv2\
  \ (enhanced AAC+)`、`AMR-NB`、`AMR-WB`、`MP3`、`MIDI`、`Ogg Vorbis` 和 `PCM/WAVE` 格式。可以使用\
  \ `MediaPlayer` 或 `AudioTrack` 类执行音频播放。`AudioTrack` 是更高级的选项，它使用流音频缓冲区并提供更大的控制力。相反，`MediaPlayer`\
  \ 类为实现音频播放提供了更简单的编程接口，并满足大多数音频需求。`MediaPlayer` 类有一系列方法，应用程序可以调用它们来执行特定任务。该类的一些关键方法的子集如下：\n\
  \n\n\n\n在典型的实现中，应用程序将实例化 `MediaPlayer` 类的实例，设置要播放的音频源，然后调用 `prepare()` 接着调用 `start()`。例如：\n\
  \n```\nMediaPlayer mediaPlayer = new MediaPlayer();\nmediaPlayer.setDataSource(\"\
  https://www.yourcompany.com/myaudio.mp3\");\nmediaPlayer.prepare();\nmediaPlayer.start();\n\
  ```\n\n### 76.2 使用 MediaRecorder 类录制音频和视频\n\n对于音频播放，可以使用多种不同的技术进行录制。其中一种方案是使用 `MediaRecorder`\
  \ 类，它与 `MediaPlayer` 类一样，提供了许多用于录制音频的方法：\n\n- `setAudioSource()` – 指定要录制的音频源（对于设备麦克风，这通常将是\
  \ `MediaRecorder.AudioSource.MIC`）。\n- `setVideoSource()` – 指定要录制的视频源（例如 `MediaRecorder.VideoSource.CAMERA`）。\n\
  - `setOutputFormat()` – 指定录制的音频或视频要存储的格式（例如 `MediaRecorder.OutputFormat.AAC_ADTS`）。\n\
  - `setAudioEncoder()` – 指定录制音频使用的音频编码器（例如 `MediaRecorder.AudioEncoder.AAC`）。\n-\
  \ `setOutputFile()` – 配置存储录制的音频或视频的文件路径。\n- `prepare()` – 准备 `MediaRecorder` 实例以开始录制。\n\
  - `start()` – 开始录制过程。\n- `stop()` – 停止录制过程。录制机停止后，需要重新完全配置并准备才能重新启动。\n- `reset()`\
  \ – 重置录制机。实例在重新启动前需要重新完全配置并准备。\n- `release()` – 当录制机实例不再需要时应调用此方法。该方法确保实例持有的所有资源都被释放。\n\
  \n\n\n使用 `MediaRecorder` 类的典型实现将设置源、输出、编码格式以及输出文件。随后将调用 `prepare()` 和 `start()`\
  \ 方法。当录制结束时将调用 `stop()` 方法，然后调用 `reset()` 方法。当应用程序不再需要录制器实例时，建议调用 `release()` 方法：\n\
  \n```\nMediaRecorder mediaRecorder = new MediaRecorder();\nmediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.AAC_ADTS);\nmediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);\n\
  mediaRecorder.setOutputFile(audioFilePath);\nmediaRecorder.prepare();\nmediaRecorder.start();\n\
  mediaRecorder.stop();\nmediaRecorder.reset();\nmediaRecorder.release();\n```\n\n\
  为了录制音频，应用程序的清单必须包含 `android.permission.RECORD_AUDIO` 权限：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.RECORD_AUDIO\" />\n```\n\n正如章节\"在 Android 中请求运行时权限\"\
  \ 中所述，访问麦克风属于危险权限类别。因此，为了支持 Android 6，在应用程序启动时必须对麦克风访问进行特定请求，相关步骤将在本章稍后介绍。\n\n###\
  \ 76.3 关于示例项目\n本章的剩余部分将通过创建一个示例应用程序，旨在演示如何使用 `MediaPlayer` 和 `MediaRecorder` 类在\
  \ Android 设备上实现音频的录制和播放。\n\n在开发使用特定硬件功能的应用程序（例如麦克风）时，在尝试代码尝试访问它之前，检查该功能的可用性至关重要。因此，在本章创建的应用程序还将包含检测设备是否存在麦克风的代码。\n\
  \n完成后，该应用程序将提供一个非常简单的界面，允许用户录制和播放音频。录制的音频需要存储在设备上的一个音频文件中。既然如此，本教程还将简要探索使用 SD 卡存储的机制。\n\
  \n### 76.4 创建 AudioApp 项目\n从欢迎界面选择“Start a new Android Studio project”（启动新的 Android\
  \ Studio 项目）快速启动选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name`\
  \ 字段中输入 `AudioApp`，并指定 `com.ebookfrenzy.audioapp` 为包名。在点击 `Finish` 按钮之前，将 Minimum\
  \ API level 设置为 `API 26: Android 8.0 (Oreo)`，并将 Language 菜单改为 `Java`。\n\n### 76.5\
  \ 设计用户界面\n创建新项目后，从 Project 工具窗口中选择 `activity_main.xml` 文件，并在 Design 模式下使用 Layout\
  \ Editor 工具，选择“Hello World!” `TextView` 并将其从布局中删除。\n\n将三个 `Button` 视图拖放到布局中。按钮的布局对于本示例来说并不重要，但图\
  \ 76-1 显示了一个使用垂直链的建议布局。\n\n配置按钮以显示内容为 `Play`、`Record` 和 `Stop` 的字符串资源，并分别为它们赋予 `playButton`、`recordButton`\
  \ 和 `stopButton` 视图 ID。\n\n选择 Play 按钮，并在 Attributes 面板中配置 `onClick` 属性，以便在用户选择时调用名为\
  \ `playAudio` 的方法。重复这些步骤配置剩余按钮分别调用名为 `recordAudio` 和 `stopAudio` 的方法。\n\n![](img/image14624.jpg)\n\
  图 76-1\n\n### 76.6 检查麦克风可用性\n在没有麦克风的设备上尝试录制音频会导致 Android 系统抛出异常。因此，代码在进行此类尝试之前检查麦克风的存在至关重要。有很多种方法，包括检查设备的物理是否存在。一种更容易且更有可能在不同\
  \ Android 设备上生效的方法是询问 Android 系统是否安装了针对特定功能的包。这涉及创建一个 `PackageManager` 类的实例，然后调用对象的\
  \ `hasSystemFeature()` 方法。`PackageManager.FEATURE_MICROPHONE` 是本例中关注的功能。\n\n为了本示例，我们将创建一个名为\
  \ `hasMicrophone()` 的方法，可以通过调用来检查麦克风是否存在。在 Project 工具窗口中，找到并双击 `MainActivity.java`\
  \ 文件并进行修改添加此方法：\n\n```java\npackage com.ebookfrenzy.audioapp;\nimport android.support.v7.app.AppCompatActivity;\n\
  import android.content.pm.PackageManager;\nimport android.os.Bundle;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_audio_app);\n\
  \    }\n    protected boolean hasMicrophone() {\n        PackageManager pmanager\
  \ = this.getPackageManager();\n        return pmanager.hasSystemFeature(PackageManager.FEATURE_MICROPHONE);\n\
  \    }\n}\n```\n\n### 76.7 执行 Activity 初始化\n下一步是修改 activity 以执行多项初始化任务。在 `MainActivity.java`\
  \ 文件中修改代码如下：\n\n```java\npackage com.ebookfrenzy.audioapp;\nimport java.io.IOException;\n\
  import android.support.v7.app.AppCompatActivity;\nimport android.content.pm.PackageManager;\n\
  import android.os.Bundle;\nimport android.media.MediaRecorder;\nimport android.os.Environment;\n\
  import android.widget.Button;\nimport android.view.View;\nimport android.media.MediaPlayer;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private static MediaRecorder\
  \ mediaRecorder;\n    private static MediaPlayer mediaPlayer;\n    private static\
  \ String audioFilePath;\n    private static Button stopButton;\n    private static\
  \ Button playButton;\n    private static Button recordButton;\n    private boolean\
  \ isRecording = false;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_audio_app);\n\
  \        audioSetup();\n    }\n    private void audioSetup() {\n        recordButton\
  \ = findViewById(R.id.recordButton);\n        playButton = findViewById(R.id.playButton);\n\
  \        stopButton = findViewById(R.id.stopButton);\n        if (!hasMicrophone())\
  \ {\n            stopButton.setEnabled(false);\n            playButton.setEnabled(false);\n\
  \            recordButton.setEnabled(false);\n        } else {\n            playButton.setEnabled(false);\n\
  \            stopButton.setEnabled(false);\n        }\n        audioFilePath = Environment.getExternalStorageDirectory()\
  \ + \"/audio.3gp\";\n    }\n}\n```\n\n添加的代码从获取三个按钮的引用开始。接下来调用之前实现的 `hasMicrophone()`\
  \ 方法来确定设备是否包含麦克风。如果没有，则禁用所有按钮。接下来的一行代码需要一点解释：`audioFilePath = Environment.getExternalStorageDirectory()\
  \ + \"/audio.3gp\"` 的目的是识别设备上的 SD 卡存储位置并创建一个名为 `audio.3gp` 的路径。SD 卡路径（在许多 Android\
  \ 设备上是内部存储）是通过调用 `Environment` 类的 `getExternalStorageDirectory()` 获取的。处理外部存储时，重要的是要在应用程序清单中请求权限。例如：\n\
  \n```xml\n<uses-permission android:name=\"android.permission.WRITE_STORAGE\" />\n\
  ```\n\n### 76.8 实现 recordAudio() 方法\n当用户触摸 Record 按钮时，将调用 `recordAudio()` 方法。该方法需要启用相应的按钮并配置\
  \ `MediaRecorder` 实例的音频源、输出格式和编码以及存储音频的文件。最后，需要调用 `MediaRecorder` 对象的 `prepare()`\
  \ 和 `start()` 方法。这些要求在 `MainActivity.java` 文件中形成了如下实现：\n\n```java\npublic void recordAudio(View\
  \ view) {\n    isRecording = true;\n    stopButton.setEnabled(true);\n    playButton.setEnabled(false);\n\
  \    recordButton.setEnabled(false);\n    try {\n        mediaRecorder = new MediaRecorder();\n\
  \        mediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n        mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.THREE_GPP);\n\
  \        mediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AMR_NB);\n   \
  \     mediaRecorder.setOutputFile(audioFilePath);\n        mediaRecorder.prepare();\n\
  \        mediaRecorder.start();\n    } catch (Exception e) {\n        e.printStackTrace();\n\
  \    }\n}\n```\n\n### 76.9 实现 stopAudio() 方法\n`stopAudio()` 方法负责启用 Play 按钮、禁用 Stop\
  \ 按钮，然后停止并重置 `MediaRecorder` 实例。实现此目的的代码如列表所示，并应添加到 `MainActivity.java` 文件中：\n\n\
  ```java\npublic void stopAudio(View view) {\n    stopButton.setEnabled(false);\n\
  \    playButton.setEnabled(true);\n    if (isRecording) {\n        recordButton.setEnabled(false);\n\
  \        mediaRecorder.stop();\n        mediaRecorder.release();\n        mediaRecorder\
  \ = null;\n        isRecording = false;\n    } else {\n        mediaPlayer.release();\n\
  \        mediaPlayer = null;\n        recordButton.setEnabled(true);\n    }\n}\n\
  ```\n\n### 76.10 实现 playAudio() 方法\n`playAudio()` 方法将创建一个新的 `MediaPlayer` 实例，将位于\
  \ SD 卡上的音频文件分配为数据源，然后准备并开始播放：\n\n```java\npublic void playAudio(View view) throws\
  \ IOException {\n    playButton.setEnabled(false);\n    recordButton.setEnabled(false);\n\
  \    stopButton.setEnabled(true);\n    mediaPlayer = new MediaPlayer();\n    mediaPlayer.setDataSource(audioFilePath);\n\
  \    mediaPlayer.prepare();\n    mediaPlayer.start();\n}\n```\n\n### 76.11 配置并请求权限\n\
  在测试应用程序之前，必须在应用程序的清单文件中请求适当权限。特别是应用程序需要录制音频和访问外部存储（SD 卡）的权限。在 Project 工具窗口中，找到并双击\
  \ `AndroidManifest.xml` 文件将其加载到编辑器中并修改 XML 添加两个权限标签：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.audioapp\">\n    <uses-permission android:name=\"\
  android.permission.WRITE_STORAGE\" />\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"\
  \ />\n    <application\n        android:allowBackup=\"true\"\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\n        android:theme=\"\
  @style/AppTheme\">\n        <activity android:name=\".MainActivity\"\n         \
  \   android:label=\"@string/app_name\">\n            <intent-filter>\n         \
  \       <action android:name=\"android.intent.action.MAIN\" />\n               \
  \ <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n上述步骤将确保在 Android 6\
  \ 之前的版本上安装应用时用户启用这些权限。麦克风和外部存储访问在 Android 中都被归类为危险权限，因为它们可能会损害用户的隐私。因此，为了让示例应用在\
  \ Android 6 或更高设备上运行，需要添加代码在运行时专门请求这两种权限。编辑 `MainActivity.java` 文件并开始添加一些额外的导入指令和常量，作为所请求权限的标识码：\n\
  \n```java\nimport android.support.v4.app.ActivityCompat;\nimport android.support.v4.content.ContextCompat;\n\
  import android.widget.Toast;\n\nprivate static final int REQUEST_CODE_AUDIO = 101;\n\
  private static final int REQUEST_CODE_STORAGE = 102;\n```\n\n\n\n\n熟悉 Google Maps\
  \ Android API 的最佳方法是通过示例进行。本章的剩余部分将创建一个基于 Google Maps 的简单应用程序，同时重点介绍 API 的关键区域。\n\
  \n### 77.2 创建 Google Maps 项目\n从欢迎界面选择 `Start a new Android Studio project`（新建 Android\
  \ Studio 项目）快速启动选项，在出现的新项目对话框中，点击 `Next`（下一步）按钮之前，选择 `Google Maps Activity` 模板。\n\
  \n在 `Name`（名称）字段中输入 `MapDemo` 并指定 `com.ebookfrenzy.mapdemo` 为包名。在点击 `Finish`（完成）按钮之前，将\
  \ `Minimum API level`（最低 API 级别）设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language`（语言）菜单设置为\
  \ `Java`。\n\n### 77.3 获取开发者签名\n在应用程序可以使用 Google Maps Android API 之前，必须先在 Google\
  \ APIs 控制台中进行注册。然而，在注册应用程序之前，必须识别与你的开发环境相关的开发者签名（也称为 `SHA-1 fingerprint`）。它包含在位于主目录下\
  \ `.android` 子目录中的 `keystore` 文件中，并可以使用下文所述的 Java SDK 提供的 `keytool` 工具获取。\n\n为了使该过程更简单，当在项目创建过程中选择\
  \ `Google Maps Activity` 选项时，Android Studio 会项目中添加一些额外文件。其中一个文件名为 `google_maps_api.xml`，位于项目的\
  \ `app -> res -> values` 文件夹中。\n\n`google_maps_api.xml` 文件包含指向 Google 开发者控制台的链接。将此链接复制并粘贴到浏览器窗口。加载后，将出现类似下面的页面：\n\
  ![](img/image14915.jpg)\n图 77-1 在点击 `Continue`（继续）按钮之前，确保菜单已设置为 `Create a new project`（新建项目）。一旦启用\
  \ API，点击 `Create API Key`（创建 API 密钥）按钮。稍等片，新项目将被创建并出现一个面板（图 77-2），为应用程序提供 API 密钥。\n\
  ![](img/image14921.jpg)\n图 77- 2 复制此密钥，返回 Android Studio，并将 API 密钥粘贴到文件的 `YOUR_KEY_HERE`\
  \ 部分：\n\n```xml\n<string name=\"google_maps_key\"templateMergeStrategy=\"preserve\"\
  \ translatable=\"false\">YOUR_KEY_HERE</string>\n```\n\n### 77.4 添加 Apache HTTP\
  \ 遗留库依赖\n由于此示例项目将为 Android 9.0 或更高版本的版本构建，需要在 `AndroidManifest.xml` 文件的 `<application>`\
  \ 部分中添加如下的声明：\n\n```xml\n<application\n    android:allowBackup=\"true\"\n    android:icon=\"\
  @mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\n    android:roundIcon=\"\
  @mipmap/ic_launcher_round\"\n    android:supportsRtl=\"true\"\n    android:theme=\"\
  @style/AppTheme\">\n    <uses-library\n        android:name=\"org.apache.http.legacy\"\
  \n        android:required=\"false\" />\n</application>\n```\n\n### 77.5 测试应用程序\n\
  对应用程序进行测试运行以验证 API 密钥是否配置正确。假设配置正确，应用程序将运行并在屏幕上显示地图。\n\n如果未显示地图，请检查以下区域：\n\n*  \
  \ 如果应用程序在模拟器上运行，请确保模拟器运行的是包含 Google APIs 的 Android 版本。可以通过选择 `Tools -> Android ->\
  \ AVD Manager` 菜单选项，点击 `AVD` `Actions` 列中的铅笔图标，然后点击当前 Android 版本旁边的 `Change…` 按钮，来更改\
  \ `AVD` 配置的当前操作系统。在系统镜像对话框中，选择包含 Google APIs 的目标。\n*   检查 `Logcat` 输出中是否有任何与 Google\
  \ Maps API 身份验证问题的内容。这通常意味着 API 密钥输入错误，或者应用程序包名与生成 API 密钥时指定的包名不匹配。\n*   在 Google\
  \ API 控制台中验证 `Services`（服务）面板中是否已启用 Google Maps Android API。\n\n\n\n\n\n## 77.6\
  \ 理解地理编码与反向地理编码\n\n如果不先介绍地理编码（Geocoding），就无法谈论地图和地理位置。地理编码最好的描述是：将基于文本的地理位置（如街道地址）转换为以经纬度表示的地理坐标的过程。\n\
  \n可以使用 Android 的 `Geocoder` 类来实现地理编码。例如，可以向 `Geocoder` 类的实例传递一个表示位置的字符串，如城市名、街道地址或机场代码。`Geocoder`\
  \ 将尝试查找该位置的匹配项，并返回 `Address` 对象列表，这些对象可能与位置字符串匹配，并按匹配程度排序，最匹配的项位于列表的第 0 位。随后，可以从\
  \ `Address` 对象中提取各种信息，包括潜在匹配项的经度和纬度。\n\n例如，以下代码请求位于华盛顿特区的国家航空航天博物馆的位置：\n\n```java\n\
  import java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\ndouble latitude;\ndouble longitude;\nList<Address>\
  \ geocodeMatches = null;\ntry {\n    geocodeMatches = new Geocoder(this).getFromLocationName(\"\
  600 Independence Ave SW, Washington, DC 20560\", 1);\n} catch (IOException e) {\n\
  \    // TODO Auto-generated catch block\n    e.printStackTrace();\n}\nif (!geocodeMatches.isEmpty())\
  \ {\n    latitude = geocodeMatches.get(0).getLatitude();\n    longitude = geocodeMatches.get(0).getLongitude();\n\
  }\n```\n\n注意，值 `1` 作为第二个参数传递给 `getFromLocationName()` 方法。这仅仅是告诉 `Geocoder` 在数组中只返回一个结果。鉴于所提供的地址具有特定性，应该只有一个潜在的匹配项。然而，对于更模糊的位置名称，可能需要请求更多的潜在匹配项并允许用户选择正确的一个。\n\
  \n上述代码是正向地理编码的示例，因为坐标是基于文本位置描述计算的。反向地理编码（Reverse-geocoding）顾其实义，涉及将地理坐标转换为人类可读的地址字符串。例如考虑以下代码：\n\
  \n```java\nimport java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\nList<Address> geocodeMatches = null;\nString\
  \ Address1;\nString Address2;\nString State;\nString Zipcode;\nString Country;\n\
  try {\n    geocodeMatches = new Geocoder(this).getFromLocation(38.8874245, -77.0200729,\
  \ 1);\n} catch (IOException e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n\
  }\nif (!geocodeMatches.isEmpty()) {\n    Address1 = geocodeMatches.get(0).getAddressLine(0);\n\
  \    Address2 = geocodeMatches.get(0).getAddressLine(1);\n    State = geocodeMatches.get(0).getAdminArea();\n\
  \    Zipcode = geocodeMatches.get(0).getPostalCode();\n    Country = geocodeMatches.get(0).getCountryName();\n\
  }\n```\n\n在这种情况下，`Geocoder` 对象通过 `getFromLocation()` 方法使用经度和纬度值进行初始化。同样，只请求单个匹配结果。然后从生成的\
  \ `Address` 对象中提取基于文本的地址信息。\n\n需要注意的是，地理编码实际上并不是在 Android 设备上执行的，而是在服务器上执行的，当需要翻译时设备连接到该服务器，翻译完成后返回结果。因此，地理编码只有在设备具有活动网络连接时才能进行。\n\
  \n## 77.7 在应用程序中添加地图\n\n向应用程序添加地图最简单的方法是在 activity 的用户界面布局 XML 文件中指定。下面的示例布局文件显示了添加到\
  \ Android Studio 创建的 `activity_maps.xml` 文件中的 `SupportMapFragment` 实例：\n\n```xml\n\
  <fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    android:id=\"@+id/map\"\n    tools:context=\"\
  .MapsActivity\"\n    android:name=\"com.google.android.gms.maps.SupportMapFragment\"\
  />\n```\n\n# 77.8 请求当前位置权限\n\n正如“在 Android 中请求运行时权限”章节概述的，某些权限被归类为危险权限，对于 Android\
  \ 6.0 或更高版本需要特殊处理。其中一种权限赋予了应用程序识别用户当前位置的能力。默认情况下，Android Studio 已在 `AndroidManifest.xml`\
  \ 文件中放置了位置权限请求。在项目工具窗口的 `app -> manifests` 下找到该文件，并找到以下权限行：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n```\n\n这将确保在旧版本的\
  \ Android 上安装应用时，应用有机会提供提供以获取位置信息的权限，但为了完全支持 Android 6.0 或更高版本，应用还必须在运行时专门请求此权限。为了实现这一点，需要编写一些代码。首先，在\
  \ `MapsActivity.java` 中添加一些导入指令和一个常量：\n\n```java\npackage com.example;\n\nimport\
  \ android.support.v4.content.ContextCompat;\nimport android.Manifest;\nimport android.widget.Toast;\n\
  import android.content.pm.PackageManager;\n\npublic class MapsActivity extends FragmentActivity\
  \ implements OnMapReady {\n    private static final int LOCATION_REQUEST_CODE =\
  \ 101;\n    private GoogleMap mMap;\n}\n```\n\n接下来，在 `MapsActivity.java` 中添加以下方法以请求权限：\n\
  \n```java\nprotected void requestPermission(String permissionType, int requestCode)\
  \ {\n    ActivityCompat.requestPermissions(this, new String[]{permissionType}, requestCode);\n\
  }\n```\n\n当用户做出响应后，`onRequestPermissionsResult()` 方法将被调用。在 `MapsActivity.java` 文件中实现此方法：\n\
  \n```java\n@Override\npublic void onRequestPermissionsResult(int requestCode, String\
  \ permissions[], int[] grantResults) {\n    switch (requestCode) {\n        case\
  \ LOCATION_REQUEST_CODE:\n            if (grantResults.length == 0 || grantResults[0]\
  \ != PackageManager.PERMISSION_GRANTED) {\n                Toast.makeText(this,\
  \ \"无法显示位置 - 需要权限\", Toast.LENGTH_LONG).show();\n            } else {\n        \
  \        SupportMapFragment mapFragment = (SupportMapFragment) getSupportFragmentManager().findFragmentById(R.id.map);\n\
  \                mapFragment.getMapAsync(this);\n            }\n    }\n}\n```\n\n\
  ## 77.9 显示用户当前位置\n\n一旦授予了适当的权限，可以通过获取与显示地图相关的 `GoogleMap` 对象并调用该实例的 `myTransformEnabled()`\
  \ 方法在地图上显示用户的当前位置。\n\n当地图准备就同时，activity 的 `onMapReady()` 方法将被调用。上述方法也会在 `onRequestPermissionsResult()`\
  \ 方法刷新地图时调用。默认情况下，Android Studio 实现了此方法并将地图定位到悉尼。\n\n在 `MapsActivity.java` 文件中定位并编辑\
  \ `onMapReady()` 方法，删除模板代码并添加检查权限是否已授予以启用位置显示。如果尚未授予，将通过调用之前添加的 `requestPermission()`\
  \ 方法向用户请求：\n\n```java\n@Override\npublic void onMapReady(GoogleMap googleMap) {\n\
  \    mMap = googleMap;\n    // 在悉尼添加标记并移动相机\n    LatLng sydney = new LatLng(-34,\
  \ 151);\n    mMap.addMarker(new MarkerOptions().position(sydney).title(\"悉尼标记\"\
  ));\n    mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney));\n    if (mMap !=\
  \ null) {\n        int permission = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION);\n\
  \        if (permission == PackageManager.PERMISSION_GRANTED) {\n            mMap.setMyLocationEnabled(true);\n\
  \        } else {\n            requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\
  \ LOCATION_REQUEST_CODE);\n        }\n    }\n}\n```\n\n现在运行应用程序时，将出现如图 77-3 所示的对话框，请求权限。如果授予了权限，地图上将出现一个蓝点表示设备的当前位置。\n\
  \n![](img/image15096.jpg)\n图 77-3\n\n## 77.10 修改地图类型\n\n通过调用相应 `GoogleMap` 对象的 `setMapType()`\
  \ 方法并传递以下值之一，可以动态修改显示的地图类型：\n\n\n\n\n\n例如，对 `onMapReady()` 方法进行以下代码更改可以将地图切换到卫星模式（Satellite\
  \ mode）：\n\n```java\nif (mMap != null) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ Manifest.permission.ACCESS_FINE_LOCATION);\n    if (permission == PackageManager.PERMISSION_GRANTED)\
  \ {\n        mMap.setMyLocationEnabled(true);\n    } else {\n        requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\
  \ LOCATION_REQUEST_CODE);\n    }\n    mMap.setMapType(GoogleMap.MAP_TYPE_SATELLITE);\n\
  }\n```\n\n或者，也可以在嵌入地图的 XML 布局文件中使用 `map:mapType` 属性配合 `none`、`normal`、`hybrid`、`satellite`\
  \ 或 `terrain` 值指定地图类型。例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:map=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:id=\"@+id/map\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    map:mapType=\"hybrid\"\
  \n    android:name=\"com.google.android.gms.maps.SupportMapFragment\"/>\n```\n\n\
  ## 77.11 向用户显示地图控件\n\nGoogle Maps Android API 提供了一系列可选的向用户显示的控件，包括放大/缩小按钮、“我的位置”按钮和指南针。\n\
  \n缩放和指南针控件的显示可以通过编程控制，也可以在 XML 布局资源中的地图元素中控制。若要通过编程配置控件，必须获取与 `GoogleMap` 对象关联的\
  \ `UiSettings` 对象的引用：\n\n```java\nimport com.google.android.gms.maps.UiSettings;\n\
  \nUiSettings mapSettings;\nmapSettings = mMap.getUiSettings();\n```\n\n缩放控制通过调用\
  \ `UiSettings` 对象的 `setZoomControlsEnabled()` 方法来启用或禁用。例如：\n\n```java\nmapSettings.setZoomControlsEnabled(true);\n\
  ```\n\n或者，可以在 XML 资源文件的地图元素中设置 `map:uiZoomControls` 属性：\n\n```xml\nmap:uiZoomControls=\"\
  false\"\n```\n\n指南针可以通过调用 `UiSettings` 实例的 `setCompassEnabled()` 方法显示，也可以通过 XML\
  \ 资源使用 `map:uiCompass` 属性显示。请注意，指南针图标仅在地图相机倾斜或旋转偏默认方向时才会出现。\n\n“我的位置”按钮只有在在本章前面介绍的“我的位置”模式启用时才会出现。即使在该模式下，也可以通过调用\
  \ `UiSettings` 实例的 `setMyLocationButtonEnabled()` 方法来防止按钮显示。\n\n## 77.12 处理地图手势交互\n\
  \nGoogle Maps Android API 能够响应多种不同的用户交互。这些交互可以用于更改显示的地图区域、缩放级别甚至视角角度（例如为某些城市显示地图区域的\
  \ 3D 表示）。\n\n### 77.12.1 地图缩放手势\n\n可以使用与 `GoogleMap` 实例关联的 `UiSettings` 对象的 `setZoomGesturesEnabled()`\
  \ 方法来启用或禁用与地图放大和缩小相关的手势。例如，以下代码禁用了示例地图的缩放手势：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = map.getUiSettings();\nmapSettings.setZoomGesturesEnabled(false);\n\
  ```\n\n在 XML 资源文件中通过将 `map:uiZoomGestures` 属性设置为 `true` 或 `false` 也可以实现相同的结果。\n\n\
  启用后，当用户在屏幕上进行捏合手势时将发生缩放。同样，双击会放大，而双指轻触会缩小。另一方面，单指缩放手势是通过双轻点两次但不释放第二次点击，然后在屏幕上上下滑动手指分别进行放大或缩小来实现的。\n\
  \n### 77.12.2 地图滚动/平移手势\n\n滚动（或平移）手势允许用户通过单指动作在屏幕上拖动地图来在地图上移动。可以通过调用 `UiSettings`\
  \ 实例的 `setScrollGesturesEnabled()` 方法在代码中启用滚动手势：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = mMap.getUiSettings();\nmapSettings.setScrollGesturesEnabled(true);\n\
  ```\n\n或者，可以在 XML 资源布局文件中使用 `map:uiScrollGestures` 属性启用地图实例上的滚动。\n\n### 77.12.3\
  \ 地图倾斜手势\n\n倾斜手势允许用户通过将两个手指放在屏幕上并上下移动它们来调整地图的投影角度。可以通过调用 `UiSettings` 实例的 `setTiltGesturesEnabled()`\
  \ 方法来启用或禁用倾斜手势，例如：\n\n```java\nUiSettings mapSettings;\nmapSettings = mMap.getUiSettings();\n\
  mapSettings.setTiltGesturesEnabled(true);\n```\n\n也可以在 XML 布局资源文件中使用 `map:uiTiltGestures`\
  \ 属性来启用和禁用倾斜手势。\n\n### 77.12.4 地图旋转手势\n\n当启用地图旋转手势时，用户可以通过将两个手指放在屏幕上并圆周运动旋转来旋转地图的方向。该手势的支持可以通过调用\
  \ `UiSettings` 对象的 `setRotateGesturesEnabled()` 方法在代码中启用，例如：\n\n```java\nUiSettings\
  \ mapSettings;\nmapSettings = mMap.getUiSettings();\nmapSettings.setRotateGesturesEnabled(true);\n\
  ```\n\n可以使用 XML 布局文件中的 `map:uiRotate` 属性启用或禁用旋转手势。\n\n## 77.13 创建地图标记（Markers）\n\
  \n地图标记用于通知用户地图上的位置，其形式可以是标准图标或自定义图标。标记还可以包含标题和可选文本（称为 snippet），并配置为允许用户将其拖动到地图上的不同位置。点击时将弹出一个信息窗口显示有关标记的信息。标记由\
  \ `Marker` 类的实例表示，并通过调用相应 `GoogleMap` 对象的 `addMarker()` 方法添加到地图上。作为此方法的参数传递的是 `MarkerOptions`\
  \ 实例，包含了标记所需的各种选项，如标题和 snippet。标记的位置通过指定经纬度值来定义，这些值也包含 `MarkerOptions` 实例中。例如，以下代码在地图上的特定位置添加包含标题、snippet\
  \ 和位置的标记：\n\n```java\nimport com.google.android.gms.maps.model.Marker;\nimport com.google.android.gms.maps.model.LatLng;\n\
  import com.google.android.gms.maps.model.MarkerOptions;\n\nLatLng position = new\
  \ LatLng(38.8874245, -77.0200729);\nMarker museum = mMap.addMarker(new MarkerOptions().position(position).title(\"\
  Museum\").snippet(\"国家航空航天博物馆\"));\n```\n\n执行后，上述代码将标记指定的位置，点击时将显示如图 77-4 所示的标题和\
  \ snippet 信息窗口。\n\n## 77.14 控制地图相机\n\n由于 Android 设备屏幕是平面的，而地球是球体，Google Maps Android\
  \ API 使用墨卡托投影将地球表示在平面上。地图的默认视图呈现给用户，就像通过悬挂在地图上方并正对着地图的相机一样。Google Maps Android API\
  \ 允许在应用程序内部更改相机的目标、缩放、方向和倾斜：\n\n*   目标（Target）：以经纬度指定的设备显示器地图中心的位置。\n*   缩放（Zoom）：以级别指定的相机缩放级别。缩放级别增加\
  \ 1.0，显示的地图宽度增加一倍。\n*   倾斜（Tilt）：相机的视角角度，指定为跨越可视地图区域中心弧线上的位置，从弧顶开始度数（弧顶是相机正对着地图的极底点）。\n\
  \n\n\n\n\n- `Bearing` – 从北方向开始顺时针方向的地图角度，以度为单位。\n\n通过创建一个具有适当设置的 `CameraUpdate`\
  \ 类实例来实现摄像头的更改。`CameraUpdate` 实例是通过调用 `CameraUpdateFactory` 类的方法创建的。一旦创建了 `CameraUpdate`\
  \ 实例，就可以通过调用 `GoogleMap` 实例的 `moveCamera()` 方法将其应用到地图。为了在摄像头变化时获得平滑的动画效果，可以调用 `animateCamera()`\
  \ 方法代替 `moveCamera()`。`CameraUpdateFactory` 方法的摘要如下所示：\n\n- `CameraUpdateFactory.zoomIn()`\
  \ – 提供一个放大一级的 `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomOut()` - 提供一个缩小一级的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomTo(float)` - 生成一个将缩放级别更改为指定值的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.zoomBy(float)` – 提供一个缩放级别按指定量增加或减少的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.zoomBy(float, Point)` - 创建一个缩放级别按指定值增加或减少的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.newLatLng(LatLng)` - 创建一个更改摄像头目标纬度和经度的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.newLatLngZoom(LatLng, float)` - 生成一个更改摄像头纬度、经度和缩放\
  \ own `CameraUpdate` 实例。\n- `CameraUpdateFactory.newCameraPosition(CameraPosition)`\
  \ - 返回一个将摄像头移动到指定位置的 `CameraUpdate` 实例。可以使用 `CameraPosition.Builder()` 获取 `CameraPosition`\
  \ 实例。\n\n\n\n\n例如，以下代码通过动画将摄像头放大一级：\n```\nmMap.animateCamera(CameraUpdateFactory.zoomIn());\n\
  ```\n另一方面，以下代码将相机移动到新位置并将缩放级别调整为 10，且不使用动画：\n```java\nprivate static final LatLng\
  \ position =new LatLng(38.8874245, -77.0200729);\nmMap.moveCamera(CameraUpdateFactory.newLatLngZoom(position,\
  \ 10));\n```\n最后，下一个代码示例使用 `CameraPosition.Builder()` 创建了一个具有目标、缩放、方位和倾斜角变化的 `CameraPosition`\
  \ 对象。然后使用动画将此更改应用于相机：\n```java\nimport com.google.android.gms.maps.model.CameraPosition;\n\
  import com.google.android.gms.maps.CameraUpdateFactory;\n\nCameraPosition cameraPosition\
  \ = new CameraPosition.Builder().target(position).zoom(50).bearing(70).tilt(25).build();\n\
  mMap.animateCamera(CameraUpdateFactory.newCameraPosition(cameraPosition));\n```\n\
  \n## 77.1 总结\n本章提供了构成 Google Maps Android API 的关键类和方法的概述，并概述了准备开发环境和应用程序项目以使用该 API\
  \ 的步骤。\n\n## 78 使用 Android 打印框架进行打印\n随着 Android 4.4 KitKat 的发布，从 Android 应用程序内部打印内容已成为可能。虽然后续章节将更详细地探讨为自己的应用程序添加打印支持的选项，但本章将关注现在\
  \ Android 中可提供的各种打印选项以及启用这些选项的步骤。在涵盖这些初始主题后，本章将概述 Android 开发者在为应用程序构建打印支持方面可以使用的各种打印功能。\n\
  \n### 78.1 Android 打印架构\nAndroid 打印由 `Printing framework`（打印框架）提供。简单来说，该框架由一个 `Print\
  \ Manager`（打印管理器）和多个打印服务插件组成。`Print Manager` 负责处理设备上应用程序的打印请求，并与设备上安装的打印服务插件交互，从而确保打印请求。。默认情况下，许多\
  \ Android 设备安装了打印服务插件，以便使用 `Google Cloud Print` 和 `Google Drive` 服务进行打印。其他打印类型的\
  \ `Print Services Plugins`（打印服务插件）如果尚未安装，也可以从 Google Play 商店获取。目前 `Print Service\
  \ Plugins` 适用于 HP、爱普生、三星和佳能打印机，未来其他打印机制造商的插件很可能会发布，尽管 `Google Cloud Print` 服务插件也可以从\
  \ Android 设备打印到几乎任何类型和型号的打印机。本书的目的，我们将使用 `HP Print Services Plugin` 作为参考示例。\n\n\
  ### 78.2 打印服务插件\n`Print Service plugins` 的目的是允许应用程序能够打印到通过局域无线网络或蓝牙对 Android 设备可见的兼容打印机。\n\
  \n通过加载 Google Play 应用并搜索“Print Service Plugin”，可以验证 Android 设备上是否存在 `Print Service\
  \ Plugin`。一旦插件在 Play 商店中列出，且在插件尚未安装的情况下，可以选择 `Install` 按钮进行安装。例如，图 78-1 显示了 Google\
  \ Play 中的 HP 打印服务插件。\n\n`Print Services plugins` 会自动检测 Android 设备当前连接的网络上的兼容打印机，并在从应用程序打印时将它们列为选项。\n\
  ![](img/image15276.jpg)\n图 78- 1\n\n### 78.3 Google Cloud Print\n`Google Cloud Print`\
  \ 是 Google 提供的一项服务，允许从任何具有互联网连接的地方通过网络将内容打印到自己的打印机上。`Google Cloud Print` 支持 `Cloud\
  \ Ready`（云可用）和 `Classic`（经典）打印机形式的各种设备和打印机型号。`Cloud Ready` 打印机内置了网络打印的技术。提供云可用打印机的制造商包括兄弟、佳能、戴尔、爱普生、HP、柯达和三星。要确定您的打印机是否既云可用又支持\
  \ `Google Cloud Print`，请访问以下 URL 查看打印机列表：`https://www.google.com/cloudprint/learn/printers.html`\n\
  \n对于经典的非云可用打印机，“Google Cloud Print` 通过在连接经典打印机的计算机系统（直接连接或通过家庭或办公室网络连接）上安装软件提供云打印支持。\n\
  \n要设置 `Google Cloud Print`，请访问网页并并与登录 Android 设备时相同的 Google 账号 ID 登录：`https://www.google.com/cloudprint/learn/index.html`\n\
  一旦打印机添加到您的 `Google Cloud Print` 账户，当您从设备上的 Android 应用程序打印时，它们将列为打印目标选项。\n\n### 78.4\
  \ 打印到 Google Drive\n除了支持物理打印机，还可以将打印输出保存到您的 `Google Drive` 帐户。从设备打印时，选择打印面板中的 `Save\
  \ to Google Drive`（保存到 Google Drive）选项。要打印的内容将被转换为 `PDF` 文件并保存到与设备上当前激活的 Google\
  \ 账号 ID 关联的 Google Drive 云存储中。\n\n### 78.5 保存为 PDF\nAndroid 提供的最后一个打印选项允许将打印内容本地保存为\
  \ Android 设备上的 `PDF` 文件。一旦选择，该选项将要求为 `PDF` 文件命名并指定设备上保存文档的位置。\n\n`Save as PDF`（保存为\
  \ PDF）和 `Google Drive` 选项在测试自己的应用程序功能时，在节省纸方面可能是无价的。\n\n### 78.6 从 Android 设备打印\n\
  Google 建议提供打印内容能力的应用程序通过将打印选项放在溢出菜单中（该主题在“在 Android 上创建和管理溢出菜单”#part0042.xhtml_id_7_ZenzR2QDSlRad3lJQMA\
  \ 章节中进行了详细介绍）。许多与 Android 捆的应用程序现在都包含“打印...”菜单选项。例如，图 78-2 显示了通过选择 Chrome 浏览器应用程序溢出菜单中的“共享...”选项来访问打印选项：\n\
  ![](img/image15295.jpg)\n图 78- 2\n一旦在应用程序内部选择了打印选项，将出现标准的 Android 打印屏幕，显示要打印内容的预览，如图\
  \ 78-3 所示：\n![](img/image15301.jpg)\n图 78- 3\n点击顶部面板将显示完整的打印选项：\n![](img/image15307.jpg)\n\
  图 78-4\nAndroid 打印面板提供了常用的打印选项，如纸张大小、颜色、方向和副本数量。可以通过点击当前打印机或 PDF 输出选择访问其他打印目标选项。\n\
  \n## 78.7 为 Android 应用构建打印支持的选项\n打印框架提供了多种为 Android 应用程序集成打印支持的选项。这些选项分类如下：\n\n\
  ### 78.7.1 图像打印\n正如名称所示，此选项允许图像打印集成到 Android 应用程序中。向应用程序添加此功能时，第一步是创建 `PrintHelper`\
  \ 类的实例：\n```java\nPrintHelper imagePrinter = new PrintHelper(context);\n```\n接下来，通过调用\
  \ `PrintHelper` 实例的 `setScaleMode()` 方法指定打印图像的缩放模式。选项如下：\n\n\n\n\n\n在未设置缩放模式的情况下，系统将默认使用\
  \ `SCALE_MODE_FILL`。例如，下面的代码将之前声明的 `PrintHelper` 实例的缩放模式设置为适应（fit）：\n```java\nimagePrinter.setScaleMode(PrintHelper.SCALE_MODE_FIT);\n\
  ```\n同样，也可以配置颜色模式，以指示打印输出是彩色还是黑白。这是通过向 `PrintHelper` 实例的 `setColorMode()` 方法传递以下选项之一来实现的：\n\
  \n打印框架将默认进行彩色打印，除非按如下方式指定了单色选项：\n```java\nimagePrinter.setColorMode(PrintHelper.COLOR_MODE_MONOCHROME);\n\
  ```\n完成打印操作仅需要一张待打印的图像，并调用 `PrintHelper` 实例的 `printBitmap()` 方法，该方法需要传递一个代表打印任务名称的字符串以及图像的引用（形式为\
  \ `Bitmap` 对象或指向图像的 `Uri` 引用）：\n```java\nBitmap bitmap = BitmapFactory.decodeResource(getResources(),R.drawable.oceanscene);\n\
  imagePrinter.printBitmap(\"My Test Print Job\", bitmap);\n```\n一旦启动打印任务，打印框架将显示打印对话框，并处理后续与用户的交互以及在用户选择的打印目标上打印图像的操作。\n\
  \n### 7.7.2 创建并打印 HTML 内容\nAndroid 打印框架还提供了一种在应用程序内部打印基于 HTML 内容的简便方法。这些内容可以是通过网站上托管的页面\
  \ URL 引用的 HTML 内容，也可以是在应用程序内部动态创建的 HTML 内容。\n\n为了为了启用 HTML 打印，`WebView` 类已经过扩展，包含了对以极少代码要求即可进行打印的支持。在动态创建\
  \ HTML 内容（而不是加载并打印现有的网页）时，该过程涉及创建一个 `WebView` 对象并与其关联一个 `WebViewClient` 实例。然后配置该\
  \ web view 客户端，以便在 HTML 加载到 `WebView` 后启动打印任务。在配置好 web view 客户端后，HTML 将被加载到 `WebView`\
  \ 中，此时将触发打印过程。\n\n例如，考虑以下代码：\n```java\npublic void printContent(){\n    WebView\
  \ webView = new WebView(this);\n    webView.setWebViewClient(new WebViewClient()\
  \ {\n        public boolean shouldOverrideUrlLoading(WebView view,String url){\n\
  \            return false;\n        }\n        @Override\n        public void onPageFinished(WebView\
  \ view, String url) {\n            createWebPrintJob(view);\n            myWebView\
  \ = null;\n        }\n    });\n    String htmlDocument =\"<html><body><h1>Android\
  \ Print Test</h1><p>\"+ \"This is some sample content.</p></body></html>\";\n  \
  \  webView.loadDataWithBaseURL(null, htmlDocument,\"text/HTML\", \"UTF-8\", null);\n\
  \    myWebView = webView;\n}\n```\n`printContent()` 方法的代码首先声明了一个名为 `myWebView` 的变量，其中将存储方法中创建的\
  \ `WebView` 实例引用。在 `printContent()` 方法内部，创建了一个 `WebView` 类的实例，并为其分配了一个 `WebViewClient`\
  \ 实例。\n\n分配给 web view 对象的 `WebViewClient` 被配置为指示 HTML 内容的加载将由 `WebView` 实例处理（通过从\
  \ `shouldOverrideUrlLoading()` 方法返回 `false`）。更重要的是，声明并实现了一个名为 `onPageFinished()`\
  \ 的处理方法，用于调用名为 `createWebPrintJob()` 的方法。当所有 HTML 内容加载到 web view 中时，`onPageFinished()`\
  \ 回调方法将被自动调用。这确保了在内容就绪之前不会启动打印任务，从而确保所有内容都能被打印。\n\n接下来，创建一个包含某些 HTML 的字符串作为内容。然后将其加载到\
  \ web view 中。一旦 HTML 加载完成，`onPageFinished()` 方法将触发触发。最后，该方法存储了 web view 对象的引用。如果没有这至关重要的一步，Java\
  \ 运行时系统可能会认为应用程序不再需要该 web view 对象并将其丢弃以释放内存（Java 术语中这种概念被称为**垃圾回收**），从而导致打印任务在完成之前就终止。\n\
  \n此示例中剩下的只需按照如下方式实现 `createWebPrintJob()` 方法：\n```java\nprivate void createWebPrintJob(WebView\
  \ webView) {\n    PrintManager printManager = (PrintManager) this.getSystemService(Context.PRINT_SERVICE);\n\
  \    PrintDocumentAdapter printAdapter =webView.createPrintDocumentAdapter(\"MyDocument\"\
  );\n    String jobName = getString(R.string.app_name) + \" Document\";\n    PrintJob\
  \ printJob = printManager.print(jobName, printAdapter,new PrintAttributes.Builder().build());\n\
  }\n```\n此方法仅用于获取 `PrintManager` 服务的引用，并指令 web view 实例创建一个打印适配器。创建一个新字符串来存储打印任务名称（在此情况下，该名称基于应用程序名称和单词“Document”）。\n\
  \n最后，通过调用打印管理器的 `print()` 方法启动打印任务，传递任务名称、打印适配器和一组默认打印属性。如果需要，可以自定义打印属性以指定分辨率（每英寸点数）、边距和颜色选项。\n\
  \n### 7.7.3 打印网页\n打印网页的步骤与上述概述相似，区别在于向 web view 传递打印网页的 URL，而不是动态创建的 HTML，例如：\n\
  ```java\nmyWebView.loadUrl(\"https://developer.android.com/google/index.html\");\n\
  ```\n同样重要的是，`WebViewClient` 配置只有在网页加载后自动打印时才是必要的。如果打印是由用户在加载后选择菜单选项启动的，则只需要包含上述\
  \ `createWebPrintJob()` 方法中的代码。下一章“HTML 和 Web 内容打印示例”将演示这样一种场景。\n\n### 7.7.4 打印自定义文档\n\
  虽然打印框架引入的 HTML 和 Web 打印功能为在 Android 应用程序内部打印内容提供了简便路径，但显然对于更高级的打印需求，这些选项将过于简单。对于更复杂的打印任务，打印框架还提供了自定义文档打印支持。这允许将文本和图形形式的内容绘制在画布上并打印。\n\
  \n与可以相对实现的 HTML 和图像打印不同，自定义文档打印是一个更复杂的阶段过程，将在本书的“Android 自定义文档指南指南章节中概述。这些步骤总结如下：\n\
  \n-   连接到 打印管理器\n-   创建一个子自 `PrintDocumentAdapter` 类的自定义打印适配器\n-   创建一个 `PdfDocument`\
  \ 实例来表示文档页\n-   获取 `PdfDocument` 实例页面的引用，每个页面都关联了一个 `Canvas` 实例\n-   在页面画布上绘制内容\n\
  -   通知打印框架文档已准备好进行打印\n\n\n\n\n上述步骤中概述的自定义打印适配器需要实现若干方法，Android 系统会在打印过程中调用这些方法以执行特定任务。其中最重要的是\
  \ `onLayout()` 方法，它负责根据用户对设置（如纸张大小或页面方向）的更改重新排列文档布局；以及 `onWrite()` 方法，它负责渲染要打印的页面。本主题将在名为“Android\
  \ 自定义文档打印指南”的章节中详细介绍。\n\n## 78.8 总结\nAndroid SDK 包含了在运行的应用程序内部打印内容的能力。打印输出可以重定向到配置适当的打印机、本地\
  \ PDF 文件或通过 Google Drive 传输到云端。从 Android 应用开发者的角度来看，可以通过使用 `Printing` 框架在应用程序中使用这些功能。到目前为止，实现最容易的打印选项是涉及图像和\
  \ HTML 格式的内容。然而，更高级的打印可以使用该框架的自定义文档打印功能来实现。\n\n## 79. 一个 Android HTML 和 Web 内容打印示例\n\
  正如上一章“使用 Android 打印框架打印”中概述的那样，Android `Printing` 框架可以用于打印网页和动态创建的 HTML 内容。虽然这两种打印方法有许多相似之处，但也存在一些需要考虑的细微差别。本章将通过创建两个示例应用程序来为这两种打印选项提供清晰的说明。\n\
  \n### 79.1 创建 HTML 打印示例应用程序\n从欢迎界面选择“Start a new Android Studio project”（启动新的 Android\
  \ Studio 项目）快速启动选项，在出现的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty Activity”（空活动）模板。在 Name（名称）字段中输入\
  \ `HTMLPrint`，并指定 `com.ebookfrenzy.htmlprint` 为包名。在点击 Finish（完成）按钮之前，将 Minimum API\
  \ level（最低 API 级别）设置更改为 `API 26: Android 8.0 (Oreo)`，并将 Language（语言）菜单更改为 `Java`。\n\
  \n### 79.2 打印动态 HTML 内容\n本教程的第一阶段是向项目添加代码以创建一些 HTML 内容，并以打印作业的形式发送到 `Printing` 框架。首先，找到\
  \ `MainActivity.java` 文件（位于 `Project` 工具窗口的 `app -> java -> com.ebookfrenzy.htmlprint`\
  \ 下）并将其加载到编辑面板中。加载后，修改代码如下列表所示：\n\n```java\npackage com.ebookfrenzy.htmlprint;\n\
  android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\nimport android.webkit.WebView;\n\
  import android.webkit.WebViewClient;\nimport android.webkit.WebResourceRequest;\n\
  import android.print.PrintAttributes;\nimport android.print.PrintDocumentAdapter;\n\
  import android.print.PrintManager;\nimport android.content.Context;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private WebView myWebView;\n   \
  \ @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_htmlprint);\n        printWebView();\n\
  \    }\n    private void printWebView() {\n        WebView webView = new WebView(this);\n\
  \        webView.setWebViewClient(new WebViewClient() {\n            public boolean\
  \ shouldOverrideUrlLoading(WebView view,WebResourceRequest request) {\n        \
  \        return false;\n            }\n            @Override\n            public\
  \ void onPageFinished(WebView view, String url) {\n                createWebPrintJob(view);\n\
  \                myWebView = null;\n            }\n        });\n        String htmlDocument\
  \ =\"<html><body><h1>Android Print Test</h1><p>\"+ \"This is some sample content.</p></body></html>\"\
  ;\n        webView.loadDataWithBaseURL(null, htmlDocument,\"text/HTML\", \"UTF-8\"\
  , null);\n        myWebView = webView;\n    }\n}\n```\n\n代码更改从声明一个名为 `myWebView`\
  \ 的变量开始，其中将存储用于打印操作的 `WebView` 实例引用。在 `onCreate()` 方法中，创建 `WebView` 类的实例，然后为其分配一个\
  \ `WebViewClient` 实例。\n\n分配给 web 对象的 `WebViewClient` 被配置为指示 HTML 内容的加载由 `WebView`\
  \ 实例处理（通过从 `shouldOverrideUrlLoading()` 方法返回 `false`）。更重要的是，声明并实现了一个 `onPageFinished()`\
  \ 处理方法来调用名为 `createWebPrintJob()` 的方法。当所有 HTML 内容加载到 web view 时，`onPageFinished()`\
  \ 方法将被自动调用。正如上一章概述，当打印动态创建的 HTML 内容时，此步骤是必要的，以确保在内容完全加载到 `WebView` 之前启动打印作业。\n\n\
  接下来，创建一个包含一些 HTML 的 `String` 对象作为内容，并随后加载到 web view 中。一旦 HTML 加载，`onPageFinished()`\
  \ 回调方法将触发。最后，该方法将 web 对象的引用存储在之前声明的 `myWebView` 变量中。如果没有这一至关重要的步骤，Java 运行系统极可能会认为应用程序不再需要\
  \ web view 对象并将其丢弃以释放内存，导致打印作业提前终止。\n\n本示例中剩下的工作是实现 `createWebPrintJob()` 方法，该方法目前配置为由\
  \ `onPageFinished()` 回调方法调用。在 `MainActivity.java` 文件中实现该方法如下：\n\n```java\nprivate\
  \ void createWebPrintJob(WebView webView) {\n    PrintManager printManager = (PrintManager)\
  \ this.getSystemService(Context.PRINT_SERVICE);\n    PrintDocumentAdapter printAdapter\
  \ = webView.createPrintDocumentAdapter(\"MyDocument\");\n    String jobName = getString(R.string.app_name)\
  \ + \" Print Test\";\n    printManager.print(jobName, printAdapter, new PrintAttributes.Builder().build());\n\
  }\n```\n\n此方法获取 `PrintManager` 服务的引用并指示 web view 实例创建适配器。创建一个字符串来存储作业名称（在此情况下基于应用程序的名称“Print\
  \ Test”）。最后，通过调用打印管理器的 `print()` 方法传递作业名称、适配器和一组默认属性启动打印作业。在运行 Android 5.0 或更高版本的设备或模拟器上编译并运行应用程序。一旦启动，将出现如图\
  \ 79-1 所示的标准 Android 打印页面。打印到物理打印机、保存到 Google Drive，或者选择保存到 PDF 文件。注意，使用保存到 PDF\
  \ 选项，系统会请求 PDF 文件的文件和位置。`Downloads` 文件夹是一个很好的选项，可以通过选择设备上的其他应用程序图标查看其内容。\n\n###\
  \ 79.3 创建 Web 页面示例\n在本章中创建的第二个示例应用程序将为用户提供在 `WebView` 实例内显示网页的菜单。从欢迎界面选择“Start a\
  \ new Android Studio project”（启动新的 Android Studio 项目）快速启动选项，在出现的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty\
  \ Activity”（空活动）模板。在 Name（名称）字段中输入 `WebPrint` 并指定 `com.ebookfrenzy.webprint` 为包名。在点击\
  \ Finish（完成）按钮之前，将 Minimum API level（最低 API 级别）设置更改为 `API 26: Android 8.0 (Oreo)`并将\
  \ Language（语言）菜单更改为 `Java`。\n\n### 79.4 移除悬按钮\n选择 Basic Activity 模板提供了上下文菜单和悬按钮。由于应用程序不需要悬按钮，因此可以在继续之前将其移除。将\
  \ `activity_main.xml` 布局文件加载到布局编辑器中，选择悬按钮并按 Delete 键从布局中移除。编辑 `MainActivity.java`\
  \ 文件，从 `onCreate` 方法中移除悬按钮代码如下：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_web_print);\n\
  \    Toolbar toolbar = findViewById(R.id.toolbar);\n    setSupportActionBar(toolbar);\n\
  \    // FloatingActionButton fab = findViewById(R.id.fab);\n    // fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    //     @Override\n    //     public void onClick(View\
  \ view) {\n    //         Snackbar.make(view, \"Replace with your action\",\n  \
  \  //             Snackbar.LENGTH_LONG).setAction(\"Action\", null).show();\n  \
  \  //     }\n    // });\n}\n```\n\n### 79.5 设计用户界面布局\n如果尚未加载，将 `content_main.xml`\
  \ 布局资源文件加载到布局编辑器工具，并在设计模式下选择并删除“Hello World!” `TextView` 对象。从调板的 Widgets 部分将 `WebView`\
  \ 对象拖到设备屏幕中心。使用 Attributes（属性）工具窗口，将 `WebView` 的 `layout_width` 和 `layout_height`\
  \ 属性更改为 `match_parent`，使其填充整个布局画布，如图 79-2 所示。选择新添加的 WebView 实例并将视图的 ID 更改为 `myWebView`。在继续教程的下一步之前，需要向项目添加额外的权限，以便\
  \ `WebView` 对象能够访问互联网并下载网页打印。通过在 Project 工具窗口中找到 `AndroidManifest.xml` 文件并双击将其加载到编辑面板来添加此权限。加载后，编辑\
  \ XML 内容以添加如下列表所示的相应权限行：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\npackage=\"\
  com.ebookfrenzy.webprint\">\n    <uses-permission android:name=\"android.permission.INTERNET\"\
  \ />\n    <application\n        android:allowBackup=\"true\"\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/AppTheme\" >\n        <activity\n       \
  \     android:name=\".MainActivity\"\n            android:label=\"@string/app_name\"\
  \n            android:theme=\"@style/AppTheme.NoActionBar\" >\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.MAIN\" />\n      \
  \          <category android:name=\"android.intent.category.LAUNCHER\" />\n    \
  \        </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n### 79.6 将网页加载到 WebView\n在打印网页之前，需要将其加载到 `WebView` 实例中。对于本教程而言，这将通过调用 `WebView`\
  \ 实例的 `loadUrl()` 方法来实现，该方法将放在命名为 `configureWebView()` 的方法中，并在 `MainActivity` 类的\
  \ `onCreate()` 方法内部调用。因此，修改 `MainActivity.java` 文件如下：\n\n\n\n\n* 实现一个继承自 `PrintDocumentAdapter`\
  \ 类的自定义打印适配器\n* 获取打印管理器服务（Print Manager Service）的引用\n* 创建 `PdfDocument` 类的实例，用于存储文档页面\n\
  * 以 `PdfDocument.Page` 实例的形式将页面添加到 `PdfDocument` 中\n* 获取与文档页面关联的 `Canvas` 对象的引用\n\
  * 在 `Canvas` 上绘制内容\n* 将 PDF 文档写入由打印框架提供的目标输出流\n* 通知打印框架文档已准备就绪，可以打印\n\n在本章中，将提供对这些步骤的概述，随后将提供一个详细的教程，旨在演示如何在\
  \ Android 应用中实现自定义文档打印。\n\n### 80.1.1 自定义打印适配器\n\n打印适配器的作用是为打印框架提供要打印的内容，并确保这些内容根据用户的偏好设置进行了正确的格式化（考虑了纸张大小和页面方向等因素）。\n\
  \n在打印 HTML 和图像时，大部分工作是由 Android 打印框架中提供的打印适配器完成的，这些适配器专为这些特定的打印任务设计。例如，在打印网页时，当我们调用\
  \ `WebView` 类实例的 `createPrintDocumentAdapter()` 方法时，系统会为我们创建一个打印适配器。\n\n然而，在自定义文档打印的情况下，由应用程序开发人员设计打印适配器并实现绘制和格式化内容的代码以准备打印。\n\
  \n自定义打印适配器是通过子类 `PrintDocumentAdapter` 类并重写该类中的一组回调方法创建的，这些回调方法会在打印过程的各个阶段由打印框架调用。这些回调方法可以总结如下：\n\
  \n| · | |\n| --- | --- |\n| · | |\n| · | |\n| · | |\n\n\n\n\n### 80.2 准备自定义文档打印项目\n\
  \n从欢迎界面选择 `Start a new Android Studio project` 快速启动选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择\
  \ `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `CustomPrint` 并指定 `com.ebookfrenzy.customprint`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单改为 `Java`。\n\n将 `activity_main.xml` 布局文件加载到 `Layout Editor` 工具中，并在\
  \ `Design` 模式下，选择并删除“Hello World!” `TextView` 对象。从调色板的 `Form Widgets` 部分拖入一个 `Button`\
  \ 视图并将其放置在布局视图的中心。选中 `Button` 视图后，将 `text` 属性更改为“Print Document”，并将该字符串提取到新的资源中。完成后，用户界面的布局应与图\
  \ 80-1 所示：![](img/image15717.jpg)图 80-1\n\n当在应用程序内选中按钮时，需要调用一个方法来启动文档打印过程。保持 `Attributes`\
  \ 工具窗口打开，将 `onClick` 属性设置为调用名为 `printDocument` 的方法。\n\n### 80.3 创建自定义打印适配器\n\n在\
  \ Android 应用程序打印自定义文档的大部分工作涉及自定义打印适配器的实现。此示例将需要一个实现了 `onLayout()` 和 `onWrite()`\
  \ 回调方法的打印适配器。在 `MainActivity.java` 文件中，添加此新类的模板，使其内容如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\
  \nimport android.os.CancellationSignal;\nimport android.os.ParcelFileDescriptor;\n\
  import android.print.PageRange;\nimport android.print.PrintAttributes;\nimport android.print.PrintDocumentAdapter;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    public class MyPrintDocumentAdapter extends PrintDocumentAdapter {\n  \
  \      Context context;\n        public MyPrintDocumentAdapter(Context context)\
  \ {\n            this.context = context;\n        }\n        @Override\n       \
  \ public void onLayout(PrintAttributes oldAttributes, PrintAttributes newAttributes,\
  \ CancellationSignal cancellationSignal, LayoutResultCallback callback, Bundle metadata)\
  \ {}\n        @Override\n        public void onWrite(final PageRange[] pageRanges,\
  \ final ParcelFileDescriptor destination, final CancellationSignal cancellationSignal,\
  \ final WriteResultCallback callback) {}\n    }\n}\n```\n\n目前这个新类，它包含一个构造方法，该方法在创建类的新实例时会被调用。构造方法接收调用传入的\
  \ `context` 作为参数，然后对其进行存储，以便在后的两个回调方法中引用它。在建立类的大纲后，下一步是开始实现两个回调方法，从 `onLayout()`\
  \ 开始。\n\n### 80.4 实现 onLayout() 回调方法\n\n保持在 `MainActivity.java` 文件中，开始添加 `onLayout()`\
  \ 方法代码所需的某些导入指令：\n\n```java\npackage com.ebookfrenzy.customprint;\n\nimport android.print.PrintDocumentInfo;\n\
  import android.print.pdf.PrintedPdfDocument;\nimport android.graphics.pdf.PdfDocument;\n\
  \npublic class MainActivity extends AppCompatActivity {\n//..\n}\n```\n\n接下来，修改\
  \ `MyPrintDocumentAdapter` 类以声明在 `onLayout()` 方法中使用的变量：\n\n```java\npublic class\
  \ MyPrintDocumentAdapter extends PrintDocumentAdapter {\n    Context context;\n\
  \    private int pageHeight;\n    private int pageWidth;\n    public PdfDocument\
  \ myPdfDocument;\n    public int totalpages = 4;\n}\n}\n```\n\n注意，为了本示例，将打印一份四页的文档。在更复杂的情况下，应用程序可能需要根据内容数量、布局相对于用户的纸张尺寸和方向的选择，动态计算要打印的页数。\n\
  \n声明变量后，按照下面的代码列表实现 `onLayout()` 方法：\n\n```java\n@Override\npublic void onLayout(PrintAttributes\
  \ oldAttributes, PrintAttributes newAttributes, CancellationSignal cancellationSignal,\
  \ LayoutResultCallback callback, Bundle metadata) {\n    myPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes);\n    pageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72;\n    pageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;\n\
  \    if (cancellationSignal.isCanceled() ) {\n        callback.onLayoutCancelled();\n\
  \        return;\n    }\n    if (totalpages > 0) {\n        PrintDocumentInfo.Builder\
  \ = new PrintDocumentInfo.Builder(\"print_output.pdf\")\n            .setContentType(PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n\
  \            .setPageCount(totalpages);\n        PrintDocumentInfo info = builder.build();\n\
  \        callback.onLayoutFinished(info, true);\n    } else {\n        callback.onLayoutFailed(\"\
  Page count is zero.\");\n    }\n}\n```\n\n显然，这个方法执行了相当多的任务，每项任务都需要详细的解释。\n\n首先，以\
  \ `PdfDocument` 类实例的形式创建一个新的 PDF 文档。当打印框架调用 `onLayout()` 方法时，传入的参数之一是类型为 `PrintAttributes`\
  \ 对象，包含了纸张尺寸、分辨率和用户为打印输出选择的设置。这些设置在使用我们的构造方法之前存储的 `context` 用于创建 PDF 文档：`myPdfDocument\
  \ = new PrintedPdfDocument(context, newAttributes);`\n\n然后，该方法使用 `PrintAttributes`\
  \ 对象提取文档页的高度和宽度。这些尺寸存储在对象中，以英寸千分之一的形式存在。由于示例中后续使用这些值是以 1/72 英寸为单位，因此在存储之前进行了转换：`pageHeight\
  \ = newAttributes.getMediaSize().getHeightMils()/1000 * 72;` `pageWidth = newAttributes.getMediaSize().getWidthMils()/1000\
  \ * 72;`\n\n尽管本示例没有使用用户的颜色选择，但可以通过 `PrintAttributes` 对象的 `getColorMode()` 方法获取该属性，它将返回\
  \ `COLOR_MODE_COLOR` 或 `COLOR_MODE_MONOCHROME`。\n\n当调用 `onLayout()` 方法时，传入一个类型为\
  \ `LayoutResultCallback` 对象。该对象提供了方法向打印框架通信状态的方法。`CancellationSignal` 参数指示进程已取消。如果检测到取消，`onLayout()`\
  \ 方法必须调用 `LayoutResultCallback` 对象的 `onLayoutCancelled()`：\n\n```java\nif (cancellationSignal.isCanceled()\
  \ ) {\n    callback.onLayoutCancelled();\n    return;\n}\n```\n\n布局工作完成后，方法需要通过两个参数调用\
  \ `LayoutResultCallback` 对象的 `onLayoutFinished()`。第一个参数的形式为 `PrintDocumentInfo`，包含了打印文档的名称、内容类型（在此情况下是文档而非图像）和页数。第二个参数是一个布尔值，指示自上次调用\
  \ `onLayout()` 方法以来布局是否发生了变化：\n\n```java\nif (totalpages > 0) {\n    PrintDocumentInfo.Builder\
  \ builder = new PrintDocumentInfo.Builder(\"print_output.pdf\")\n        .setContentType(PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n\
  \        .setPageCount(totalpages);\n    PrintDocumentInfo info = builder.build();\n\
  \    callback.onLayoutFinished(info, true);\n} else {\n    callback.onLayoutFailed(\"\
  Page count is zero.\");\n}\n```\n\n如果页数为零，代码通过调用 `LayoutResultCallback` 对象的 `onLayoutFailed()`\
  \ 向打印框架报告此失败。`onLayoutFinished()` 方法触发触发 `onWrite()` 方法。\n\n### 80.5 实现 onWrite()\
  \ 回调方法\n\n`onWrite()` 回调方法负责渲染文档的页面，然后通知打印框架文档已就绪。完成后，`onWrite()` 方法如下：\n\n```java\n\
  package com.ebookfrenzy.customprint;\n\nimport java.io.FileOutputStream;\nimport\
  \ java.io.IOException;\nimport android.graphics.pdf.PdfDocument.PageInfo;\n\n@Override\n\
  public void onWrite(final PageRange[] pageRanges, final ParcelFileDescriptor destination,\
  \ final CancellationSignal cancellationSignal, final WriteResultCallback callback)\
  \ {\n    for (int i = 0; i < totalpages; i++) {\n        if (pageInRange(pageRanges,\
  \ i)) {\n            PageInfo newPage = new PageInfo.Builder(pageWidth, pageHeight,\
  \ i).create();\n            PdfDocument.Page page = myPdfDocument.startPage(newPage);\n\
  \            if (cancellationSignal.isCanceled()) {\n                callback.onWriteCancelled();\n\
  \                myPdfDocument.close();\n                myPdfDocument = null;\n\
  \                return;\n            }\n            drawPage(page, i);\n      \
  \      myPdfDocument.finishPage(page);\n        }\n    }\n    try {\n        myPdfDocument.writeTo(new\
  \ FileOutputStream(destination.getFileDescriptor()));\n    } catch (IOException\
  \ e) {\n        callback.onWriteFailed(e.toString());\n        return;\n    } finally\
  \ {\n        myPdfDocument.close();\n        myPdfDocument = null;\n    }\n    callback.onWriteFinished(pageRanges);\n\
  }\n```\n\n`onWrite()` 方法通过遍历文档中的每一页开始。然而，重要的是要考虑到用户可能没有请求打印组成文档的所有页面。事实上，打印框架的用户界面面板提供了指定打印特定页面或页范围的选项。例如，图\
  \ 80-2 显示打印面板被配置为打印文档的第 1-4 页、第 8 和 9 页以及第 11-13 页。image15886.jpg)图 80-2\n\n在将页面写入\
  \ PDF 文档时，`onWrite()` 方法必须采取措施确保只打印用户指定的页面。为了实现这一点，打印框架传递一个 `PageRange` 对象数组作为参数，指示要打印的页面范围。在上面的\
  \ `onWrite()` 实现中，对于每一页都会调用名为 `pagesInRange()` 的方法来验证该页是否在指定的范围内。`pagesInRange()`\
  \ 方法将在本章后续实现：\n\n```java\nfor (int i = 0; i < totalpages; i++) {\n    if (pageInRange(pageRanges,\
  \ i)) {\n//\n```\n\n对于任何指定范围内的页，都会创建一个 `PdfDocument.Page` 对象。在创建新页时，`onLayout()`\
  \ 方法之前存储的高度和宽度值作为参数传递，匹配用户选择的打印选项：\n\n```java\nPageInfo newPage = new PageInfo.Builder(pageWidth,\
  \ pageHeight, i).create();\nPdfDocument.Page page = myPdfDocument.startPage(newPage);\n\
  ```\n\n与 `onLayout()` 方法一样，`onWrite()` 方法需要响应取消请求。在关闭 `myPdfDocument` 变量之前，代码通知打印框架已执行取消：\n\
  \n```java\nif (cancellationSignal.isCanceled()) {\n    callback.onWriteCancelled();\n\
  \    myPdfDocument.close();\n    myPdfDocument = null;\n    return;\n}\n```\n\n\
  只要打印进程没有取消方法在调用 `myPdfDocument` 对象的 `finishPage()` 方法之前，会在当前页面上绘制内容：\n\n```java\n\
  drawPage(page, i);\nmyPdfDocument.finishPage(page);\n```\n\n当足够的页数已添加到 PDF 文档后，使用作为\
  \ `onWrite()` 方法参数的文件描述符将文档写入 `destination`。由于某种原因写入操作失败，方法通过调用 `WriteResultCallback`\
  \ 对象的 `onWriteFailed()` 方法通知框架：\n\n```java\ntry {\n    myPdfDocument.writeTo(new\
  \ FileOutputStream(destination.getFileDescriptor()));\n} catch (IOException e) {\n\
  \    callback.onWriteFailed(e.toString());\n    return;\n} finally {\n    myPdfDocument.close();\n\
  \    myPdfDocument = null;\n}\n```\n\n最后，调用 `WriteResultCallback` 对象的 `onWriteFinished()`\
  \ 方法通知打印框架文档已就绪。\n\n### 80.6 检查范围\n\n所述，当调用 `onWrite()` 方法时，传递一个指示文档页范围的 `PageRange`\
  \ 对象数组。`PageRange` 类用于存储页的结束页。`pageInRange()` 方法可以在 `MainActivity.java` 类的 `MyPrintDocumentAdapter`\
  \ 类中如下实现：\n\n```java\npublic class MyPrintDocumentAdapter extends PrintDocumentAdapter\
  \ {\n    private boolean pageInRange(PageRange[] pageRanges, int i) {\n        for\
  \ (int i = 0; i < pageRanges.length; i++) {\n            if (i >= pageRanges[i].getStart()\
  \ && i <= pageRanges[i].getEnd()) {\n                return true;\n            }\n\
  \        }\n        return false;\n    }\n}\n```\n\n### 80.7 在页面上绘制内容\n\n我们现在到了需要编写代码在页面上绘制内容以便准备打印的程度了。绘制的内容完全取决于应用程序，并受到使用\
  \ `Canvas` 类可以实现的限制。然而，对于本示例，将在画布上绘制一些文本和图形。`onWrite()` 方法被设计为调用名为 `drawPage()`\
  \ 的方法，该方法接收代表当前页的 `PdfDocument.Page` 对象代表页码的整数。在 `MainActivity.java` 文件中该方法现在实现如下：\n\
  \n```java\npackage com.ebookfrenzy.customprint;\n\nimport android.graphics.Canvas;\n\
  import android.graphics.Color;\nimport android.graphics.Paint;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    public class MyPrintDocumentAdapter extends PrintDocumentAdapter\
  \ {\n        private void drawPage(PdfDocument.Page page, int pagenumber) {\n  \
  \          Canvas canvas = page.getCanvas();\n            pagenumber++; // 确保页码从\
  \ 1 开始\n            int titleBaseLine = 72;\n            int leftMargin = 54;\n\
  \            Paint paint = new Paint();\n            paint.setColor(Color.BLACK);\n\
  \            paint.setTextSize(40);\n            canvas.drawText(\"Test Print Document\
  \ Page \" + pagenumber, leftMargin, titleBaseLine, paint);\n            paint.setTextSize(14);\n\
  \            canvas.drawText(\"This is some test content to verify custom document\
  \ printing works\", leftMargin, titleBaseLine + 35, paint);\n            if (pagenumber\
  \ % 2 == 0) {\n                paint.setColor(Color.RED);\n            } else {\n\
  \                paint.setColor(Color.GREEN);\n            }\n            PageInfo\
  \ pageInfo = page.getInfo();\n            canvas.drawCircle(pageInfo.getPageWidth()/2,\
  \ pageInfo.getPageHeight()/2, 150, paint);\n        }\n    }\n}\n```\n\n代码中的页码从\
  \ 0 开始。由于文档传统上从第 1 页开始，方法通过增加存储的页码开始。然后获取与页面相关的 `Canvas` 对象引用，并声明一些边距和基线值：\n\n```java\n\
  Canvas canvas = page.getCanvas();\npagenumber++;\nint titleBaseLine = 72;\nint leftMargin\
  \ = 54;\n```\n\n接下来，代码创建 `Paint` 和 `Color` 对象用于绘制，设置字体大小并绘制页面标题，包括当前页码：\n\n```java\n\
  Paint paint = new Paint();\npaint.setColor(Color.BLACK);\npaint.setTextSize(40);\n\
  canvas.drawText(\"Test Print Document Page \" + pagenumber, leftMargin, titleBaseLine,\
  \ paint);\n```\n\n然后缩小字体大小并在标题下方绘制正文文本：\n\n```java\npaint.setTextSize(14);\ncanvas.drawText(\"\
  This is some test content to verify custom document printing works\", leftMargin,\
  \ titleBaseLine + 35, paint);\n```\n\n该方法的最后项任务是绘制一个圆（偶数页为红色，奇数页为绿色）。在确定页面是奇数还是偶数后，使用这些信息将圆放置在页面中心：\n\
  \n```java\nif (pagenumber % 2 == 0) {\n    paint.setColor(Color.RED);\n} else {\n\
  \    paint.setColor(Color.GREEN);\n}\nPageInfo pageInfo = page.getInfo();\ncanvas.drawCircle(pageInfo.getPageWidth()/2,\
  \ pageInfo.getPageHeight()/2, 150, paint);\n```\n\n在画布上绘制完成后，方法将控制权返回给 `onWrite()`\
  \ 方法。随着 `drawPage()` 方法的完成，`MyPrintDocumentAdapter` 类完成。# 80.8 启动打印任务\n\n当用户触摸“打印文档”按钮时，将调用\
  \ `printDocument()` `onClick` 事件处理器。开始测试之前的所有工作是将此方法添加到 `MainActivity.java` 文件中，特别注意确保将其放置在\
  \ `MyPrintDocumentAdapter` 类之外：\n\n```java\npackage com.ebookfrenzy.customprint;\n\
  \nimport android.print.PrintManager;\nimport android.view.View;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    public void printDocument(View view)\
  \ {\n        PrintManager printManager = (PrintManager) this.getSystemService(Context.PRINT_SERVICE);\n\
  \        String jobName = this.getString(R.string.app_name) + \" Document\";\n \
  \       printManager.print(jobName, new MyPrintDocumentAdapter(this), null);\n \
  \   }\n}\n```\n\n该方法获取设备上运行的 `PrintManager` 服务引用，然后创建一个作为任务名的 `String` 对象。最后，调用\
  \ `PrintManager` 的 `print()` 方法启动打印任务，传递任务名和自定义打印适配器的实例。# 80.9 测试应用程序\n\n在运行 Android\
  \ 4.4 或更高版本的 Android 设备或模拟器上编译并运行应用程序。当应用程序加载后，触摸“打印文档”按钮启动打印任务并选择输出目标（“保存为 PDF”是一个实用的选项）。检查打印输出，它应该包含文本和图形的\
  \ 4 页图 80-3。image16044.jpg)图 80-3\n\n实验其他打印配置选项，例如更改面板内的纸张尺寸和方向设置。每个设置更改都应反映在打印输出中，表明打印适配器工作正常。\n\
  \n### 80.10 总结\n\n虽然实现比 Android 打印框架复杂，但自定义文档打印在 Android 应用程序内部打印复杂内容提供了相当的灵活性。实现自定义打印的大部分工作涉及创建一个打印适配器类，它不仅在页面上绘制内容，还能对用户对打印设置（如页码和页范围）的更改做出正确响应。\n\
  \n# App Links 简介\n\n随着技术的演变，网页和移动内容的传统区别开始模糊。这一点特别真实的领域是渐进式 Web 应用的日益流行，Web 应用的行为类似于传统的移动应用。另一个趋势是让移动应用中的内容可以通过网页搜索和\
  \ URL 链接发现。在 Android 应用程序开发中，App Links 和 Instant Apps 功能专门设计用于使用户更容易发现和访问存储在 Android\
  \ 应用程序中的内容，即使用户没有安装该程序。在本章和后续章节中将涵盖 App Links 主题。一旦解释了 App Links，标题为“Instant App\
  \ Tutorial`](part0086.xhtml_id_7_ZenzR2QDSlRad3lJQMAA2018)”的章节将开始介绍 Android Instant\
  \ Apps。\n\n## Android App Links 概述\n\nApp link 是一个标准的 HTTP URL，旨在提供从外部源（如网站或应用）直接链接到应用程序特定位置的简单方法。App\
  \ links（也称为深层链接）主要用于鼓励用户与应用程序交互并允许用户共享应用内容。App links 还为 Instant Apps 的构建提供了基础。App\
  \ link 实现是一个多步骤过程，涉及向项目清单添加意图过滤器（intent filters）、在相关的应用 activity 中实现链接处理代码以及使用数字资产文件关联应用和基于网络的内容。这些步骤可以通过手动修改项目来完成，也可以使用\
  \ Android Studio App Links 助手自动完成。\n\n## App Link Intent Filter\n\nApp link URL\
  \ 需要映射到应用中的特定 activity。这是通过在项目的 `AndroidManifest.xml` 文件中添加设计用于响应 `android.intent.VIEW`\
  \ 动作的意图过滤器来实现。意图过滤器声明在要启动的 activity 元素内部，并且包含 app link URL 的方案、主机和路径。下面的清单片段示例了检测到匹配\
  \ `http://www.example.com/welcome` 的 app link 时，启动名为 `MyActivity` 的 activity：\n\n\
  ```xml\n<activity android:name=\"com.ebookfrenzy.myapp.MyActivity\">\n    <intent-filter>\n\
  \        <action android:name=\"android.intent.VIEW\" />\n        <category android:name=\"\
  android.intent.category.DEFAULT\" />\n        <category android=\"name=\"android.intent.category.BROWSABLE\"\
  \ />\n        <data android:scheme=\"http\" android=\"host=\"www.example.com\" android:pathPrefix=\"\
  /welcome\" />\n    </intent-filter>\n</activity>\n```\n\n处理歧义意图过滤器的顺序可以使用意图过滤器标签的\
  \ `order` 属性来指定，如下：\n\n```java\n<application>\n    <activity android:name=\"com.ebookfrenzy.myapp.MyActivity\"\
  >\n        <intent-filter android:order=\"1\">\n```\n\n意图过滤器会导致 app link 启动正确的 activity，但目标\
  \ activity 中仍需要实现代码来处理意图。下一章节（Instant App Tutorial）将演示使用 App Links 助手来实现相同结果。\n\n\
