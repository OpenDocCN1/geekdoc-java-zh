  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_landmark);\n\
  \    titleText = findViewById(R.id.titleText);\n    descriptionText = findViewById(R.id.descriptionText);\n\
  \    deleteButton = findViewById(R.id.deleteButton);\n    handleIntent(getIntent());\n\
  }\n```\n\n要添加初始的应用链接意图处理代码，返回 App Links 助手面板并点击步骤 2 下列出的 `Select Activity` 按钮。在活动选择对话框中，在点击\
  \ `Insert Code` 按钮之前选择 `LandmarkActivity` ：![](img/image16267.jpg) 图 82-8\n\n返回\
  \ `LandmarkActivity.java` 文件，注意以下代码已插入到 `onCreate()` 方法中：\n\n```java\n// ATTENTION：这是为了处理应用链接自动生成的。\n\
  Intent appLinkIntent = getIntent();\nString appLinkAction = appLinkIntent.getAction();\n\
  Uri appLinkData = appLinkIntent.getData();\n```\n\n此代码访问 `Intent` 对象并提取 `Action`\
  \ 字符串和 `Uri`。如果活动启动是由于应用链接的结果，则 action 字符串将设置为 `android.intent.action.VIEW`，这与清单文件中添加的意图过滤器声明的\
  \ action 相匹配。相反，如果活动是由主活动 `findLandmark()` 方法中的标准意图启动代码启动的，则 action 字符串为 `null`。通过检查赋值给\
  \ action 字符串的值，可以编写代码来识别启动活动的方式并采取适当的操作：\n\n```java\nimport android.net.Uri;\n\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_landmark);\n    ...\n    // ATTENTION：这是为了处理应用链接自动生成的。\n\
  \    Intent appLinkIntent = getIntent();\n    String appLinkAction = appLinkIntent.getAction();\n\
  \    Uri appLinkData = appLinkIntent.getData();\n    String landmarkId = appLinkData.getLastPathSegment();\n\
  \    if (landmarkId != null) {\n        displayLandmark(landmarkId);\n    }\n}\n\
  ```\n\n剩下的是在方法中添加一些额外代码以识别应用链接 URL 路径中的最后一个组件，并在查询数据库时将其作为地标 ID：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_landmark);\n    titleText = findViewById(R.id.titleText);\n\
  \    descriptionText = findViewById(R.id.descriptionText);\n    deleteButton = findViewById(R.id.deleteButton);\n\
