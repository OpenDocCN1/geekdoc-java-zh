  \n## 82.9 总结\n\n本章演示了在 Android 应用项目中实现 App Link 支持的涉及的步骤。本章涵盖的内容包括在 Android Studio\
  \ 中使用 App Link 助手、App Link URL 映射、意图过滤器、使用 Digital Asset File 条目处理网站关联以及 App Link\
  \ 测试。\n\n## 83. Android 即时应用 (Instant Apps) 简介\n\n之前的章节涵盖了 Android App Links，并解释了如何使用这些链接来使\
  \ Android 应用的内容更容易被发现和与其他用户共享。然而，App Links 只是解决方案的一部分。App Links 的一个限制是，只有当用户已经安装了相应的应用时，应用链接才有效。通过将\
  \ App Links 与 Android Instant App 功能结合解决了这个问题。\n\n本章将提供 Android Instant Apps 是什么以及它们如何工作的概述。后续章节将演示如何在新的和现有的\
  \ Android Studio 项目实现 Instant App 支持。\n\n### 83.1 Android Instant Apps 概述\n\n传统的\
  \ Android 应用（也称为已安装的应用）由包含构成应用的各种组件的 APK 文件组成，包括类、资源文件和图像。应用开发完成后，APK 文件发布到 Google\
  \ Play 商店，潜在用户可以在那里找到并安装应用。当应用使用 Instant Apps 时，它被分为一个或多个模块，每个模块包含在一个独立的特征 APK 中。各个功能\
  \ APK 随后封装成一个 instant app APK，然后上传到开发者控制台。应用内的功能被分配 App Links，可用于启动。当点击链接或在意图中使用时，Google\
  \ Play 匹配 URL 与功能模块，仅下载所需的特征文件并启动入口活动。这允许用户无需手动去 Play 商店安装整个应用即可快速访问特定应用。考虑一个显示详细描述的酒店预订应用，已安装应用的用户可以向朋友发送应用链接以显示酒店信息。如果应用支持\
  \ Instant Apps，点击链接将自动下载酒店特征的 APK 文件。\n\n### 83.2 Instant App 模块\n\n为了支持 Instant\
  \ Apps，项目需要被分成多个特征模块。特征模块应至少包含一个活动并代表应用的逻辑独立子集。特征模块实际上可以被视为包含特定应用代码的共享库。所有项目必须包含一个\
  \ `base` 模块。如果应用由一个特征组成，那么`base`模块将包含应用的所有功能。如果应用有多个特征，每个特征将在`base`模块之外自己的特征模块。在多特征应用中，`base`模块通常包含一个需要与特征模块共享的任何资源。当请求特征模块时，`base`模块始终会在特征模块之外被下载。这确保了特征模块可以使用共享资源。\n\
  \n### 83.3 Instant App 结构\n\nAndroid Studio 项目如果要支持 instant apps，需要符合特定的结构。事实上，项目需要能够支持已安装应用即时应用。此项目结构由\
  \ `app` 模块和 `instant-app` 模块组成。`app` 模块负责构建用户点击 Play 商店中“安装”按钮时安装的标准可安装 APK 文件。`instant-app`\
  \ 模块负责生成每个特征 APK 文件。`app` 模块和 `instant-app` 模块本质上都是构成应用功能的特征模块的容器。两个模块的构建文件只需声明必要的特征模块作为依赖。图\
  \ 83-1 显示了简单的特征项目的结构：![](img/image16391.jpg) 图 83-1\n\n### 83.4 应用和特征构建插件\n\n构建项目时，构建系统使用\
  \ `app` 和 `instant-app` 模块的 `Gradle` 文件中的设置来决定输出结构。`app` 模块的 `build.gradle` 文件将使用标准的\
  \ `com.android.application` 插件构建单个可安装 APK 文件，并在 `dependencies` 部分包含声明的特征模块：\n\n\
  ```gradle\napply plugin: 'com.android.application'\nandroid {\n    compileSdkVersion\
  \ 28\n}\ndependencies {\n    implementation project(':myappbase')\n    implementation\
  \ project(':myappdetail')\n}\n```\n\n相反，`instant-app` 模块的 `build.gradle` 文件将使用 `com.android.instantapp`\
  \ 插件为 `dependencies` 部分引用的特征构建单独特征 APK 文件。注意特征依赖使用 `implementation project()` 声明进行引用：\n\
  \n```gradle\napply plugin: 'com.android.instantapp'\ndependencies {\n    implementation\
  \ project(':myappbase')\n    implementation project(':myappfeature')\n}\n```\n\n\
  构成应用的非 base 特征模块也将使用 `com.android.feature` 插件的 `build.gradle` 文件，例如：\n\n```gradle\n\
  apply plugin: 'com.android.feature'\nandroid {\n    compileSdkVersion 28\n}\ndependencies\
  \ {\n    implementation project(':myappbase')\n}\n```\n\n`base` 特征模块的 `build.gradle`\
  \ 文件是一个特殊情况，必须包含 `baseFeature true` 声明。该文件还对任何特征模块依赖使用 `feature project()` 声明，并带有引用已安装应用模块\
  \ `application project()` 条目，例如：\n\n```gradle\napply plugin: 'com.android.feature'\n\
  android {\n    baseFeature true\n    compileSdkVersion 28\n}\ndependencies {\n \
  \   implementation fileTree(dir: 'libs', include: ['*.jar'])\n    application project(':myappapk')\n\
  \    feature project(':myappfeature')\n}\n```\n\n### 83.5 安装 Instant Apps SDK\n\n\
  在 Android Studio 中处理 Instant Apps 之前，必须安装 Instant Apps SDK。为后续章节做准备，启动 Android Studio\
  \ 并选择 `Configure -> SDK Manager` 选项（如果已打开项目，请使用 `Tools -> SDK Manager`）。在 SDK manager\
  \ 屏幕中，选择 `SDK Tools` 选项并定位启用 `Instant Apps Development SDK`：![](img/image6441.jpg)\
  \ 图 83-2\n\n选中 SDK 后，点击 `OK` 按钮执行安装。\n\n### 83.6 总结\n\nAndroid Instant Apps 与 App\
  \ Links 结合，为用户提供了共享和发现应用内容的简单方法。Instant Apps 被拆分为多个特征模块，可以通过应用链接进行启动。当选择链接时，如果用户设备上尚未安装该应用，则由\
  \ Google 下载应用的特征代码并启动。每个应用项目必须包含一个 `app` 模块以包含标准可安装 APK 文件，以及一个 `instant-app` 模块用于生成单独\
  \ APK。`app` 模块和 `instant-app` 模块均作为构成应用功能的特征模块的容器。应用必须包含至少一个特征模块，并可能包含其他特征的模块。在介绍了\
  \ instant apps 的基础后，下一章将解释如何在新项目中添加 instant app 支持。\n\n## 84. Android Instant App\
  \ 教程\n\n在 Android Studio 3.0 中引入的 Android Profiler 提供了一种在应用于设备或模拟器上运行时监控 CPU、网络和内存指标的方法。它是识别应用性能瓶颈、检查应用是否合理使用内存以及确保应用没有过度网络带宽的宝贵工具。本章将提供\
  \ Android Profiler 的引导介绍，以便你可以使用它监控应用的行为和性能。\n\n### 84.1 使用 Android Profiler\n\n\
  Android Profiler 可通过 `View -> Tool Windows -> Android Profiler` 选项或显示 Android Studio\
  \ 工具栏的任何可用选项启动。一旦显示，Profiler 窗口将如图 84-1 所示出现：![](img/image6671.jpg) 图 84-1\n\n在图中，任何连接的设备或运行的模拟器上都未检测到进程。要查看分析信息，需要启动应用。在此之前，可能需要配置项目以启用高级分析。\n\
  \n### 84.2 启用分析\n\n如果应用使用的 SDK 于 26，则需要在编译期间插入一些监控代码来构建应用，以监控 Android Profiler 支持的所有指标。要启用高级分析，从\
  \ Android Studio 工具栏如图 84-2 所示处开始编辑构建目标配置：![](img/image6679.jpg) 图 84-2\n\n在 `Run/Debug`\
  \ 对话框中，选择 `Profiling` 标签并在点击 `Apply` 和 `OK` 按钮之前启用 `Enable profiling` 选项。\n\n###\
  \ 84.3 Android Profiler 工具窗口\n\n监控运行应用的活跃 Profiler 工具窗口如图 84-3 所示：![](img/image6687.jpg)\
  \ 图 84-3\n\n`Sessions` 面板（标记为 `A`）列出了当前的分析会话以及自 Android Studio 启动以来任何其他会话。`Sessions`\
  \ 面板右侧是实时分析窗口。使用 `Live` 按钮 (`B`) 暂停，窗口将继续滚动最新指标。再次点击该按钮将跳转到当前时间并恢复滚动。水平滚动可以在记录的时间轴内来移动。窗口的顶行\
  \ (`C`) 是事件时间轴，显示应用活动状态的变化，以及用户触摸屏幕、打字或更改设备方向等其他事件。底部时间轴 (`D`) 绘制了自应用启动以来经过的时间。剩余的时间轴显示\
  \ CPU、内存和能量使用的实时数据。将鼠标指针悬停在时间轴上的任意点（不点击）将显示类似于图 84-4 所示的额外信息：![](img/image6695.jpg)\
  \ 图 84-4\n\n点击 `CPU`、`memory` 或 `energy` 时间轴将显示相应的 profiler 窗口，本章剩余部分将探索每一个。\n\n\
  ### 84.4 Sessions 面板\n\n当应用运行时并显示 Profiler 工具窗口时，Profiler 将自动附加到应用并开始分析。`Sessions`\
  \ 面板将如图 84-5 所示显示应用名称、其运行的设备或模拟器以及开始时间：![](img/image16703.jpg) 图 84-5\n\n时间旁边的绿色圆表示活跃的分析会话。按下红色停止按钮将结束当前会话，数据和图表将可以浏览直到\
  \ Android Studio 退出。点击 `+` 按钮并选择设备和应用可以启动额外的分析会话：![](img/image16709.jpg) 图 84-6\n\
  \n`Load from file...` 菜单选项允许从 profiler 内部以前保存的 CPU 跟踪加载到 Profiler 中进行检查。要在应用启动时自动为应用开始分析，从图\
  \ 84-2 所示处使用 Android Studio 工具栏开始编辑构建配置：![](img/image6717.jpg) 图 84-7\n\n### 84.5\
  \ CPU Profile\n\n当显示时，CPU Profiler 窗口如图 84-8 所示：![](img/image6724.jpg) 图 84-8\n\n\
  \n\n\n- **采样法 (Java)** – 以频繁的间隔捕捉方法调用堆栈，以收集 Java 代码执行的追踪数据。虽然与插桩追踪（instrumented\
  \ tracing）相比其侵入性较小，但如果方法调用发生在捕捉之间的间隔期间，采样追踪可能会漏掉。可以通过点击类型选择菜单中的 `Edit configurations…`\
  \ 按钮并创建新的自定义追踪类型来更改快照频率。\n- **插桩法 (Java)** – 跟踪在运行应用内执行的所有 Java 方法调用的开始和结束。这种方式的优势是由于性能分析过程中不会漏掉任何方法调用，但由于跟踪所有方法调用的开销，可能会影响应用性能，从而导致误导性的性能数据。\n\
  - **采样法 (Native)** - 以频繁的间隔捕捉方法调用堆栈，以收集应用内原生（例如 C 或 C++）代码执行的追踪数据。\n- **系统追踪 (System\
  \ Trace)** - 在应用运行时，分析设备上的系统级 CPU 和线程活动（换句话说，发生在应用进程之外的 CPU 活动）。\n\n方法追踪在点击记录按钮\
  \ `(E)` 后才会开始，并一直持续到停止录制。一旦录制完成，Profiler 工具窗口将以调用图（call chart）格式显示方法追踪，如图 86-12\
  \ 所示，其中包含方法执行时间的信息。录制的追踪还将出现在 Sessions 面板中。点击磁盘图标（如下方的图 86-9 所示），可以将追踪结果保存为文件，以便稍后在本章节前面所述的性能分析器中进行检查：\n\
  \n![](img/image16740.jpg)\n图 86- 9\n追踪结果可以在自向下（Top Down）、自底向上（Bottom Up）、调用图（Call\
  \ Chart）和火焰图（Flame Chart）模式下查看，每种模式可以总结如下：\n\n| • |\n![](img/image16752.jpg)\n图\
  \ 86-10\n\n| • |\n![](img/image16762.jpg)\n图 86-11\n\n| • |\n![](img/image16773.jpg)\n\
  图 86-11 2\n\n| • |\n\n\n\n\n\n![](img/image16784.jpg)图 86-13 在上述任何视图中的方法项上点击右键，可以提供在代码编辑窗口中打开该方法源代码的选项。\n\
  \n## 86.6 内存分析 (Memory Profile)\n\n在主 Android Profiler 工具窗口中点击内存时间轴时，会显示内存分析器，其显示如\
  \ 图 86-14 所示：![](img/image16792.jpg)图 86-14\n\n内存时间轴显示了根据颜色图例指示的不同类别的内存分配相对于时间轴右侧刻度的情况。虚线（`A`）代表相对于时间轴图左侧刻度的应用程序分配的对象数量。\n\
  \n垃圾桶图标（`B`）表示垃圾回收（garbage collection）事件。当 Android 运行时认为内存中的某个对象不再需要并自动将其移除以释放内存时，就会发生垃圾回收事件。\n\
  \n除了通常的时间轴外，窗口还包含按钮（`C`），用于强制触发垃圾回收事件和捕获堆转储（heap dump）。堆转储（图 86-15`）列出了执行转储时正在使用内存的应用程序中的所有对象，显示了堆中对象的实例数量（分配计数）、该对象所有实例的大小（浅层大小\
  \ shallow size）以及 Android 运行时系统为这些对象持有的内存总量（保留大小 retained size）。![](img/image16801.jpg)图\
  \ 86-15\n\n双击堆列表中的对象将显示实例视图（Instance View）面板（在 图 86-16 中标记为 `A`），显示该程序内该对象的实例列表。从列表中选择一个实例将显示引用面板（`B`），列出对象被引用的位置。例如，图\
  \ 86-16 显示已选择了一个 String 实例，并列出它被应用程序 `MainActivity` 类中名为 `myString` 的变量引用：![](img/image16807.jpg)图\
  \ 86-16\n\n右键点击该引用将提供跳转到堆列表中 `MainActivity` 类的选项，或直接跳转到该类的源代码。\n\n## 86.7 网络分析 (Network\
  \ Profile)\n\n网络分析器是 Android Profiler 提供的工具中复杂度最低的。选中后，会出现网络工具窗口，如 图 86-17 所示：![](img/image16815.jpg)图\
  \ 86-17\n\n与其他分析器窗口一样，网络分析器窗口包含一个事件时间轴。无线电（Radio）时间（在 图 86-17 中标记为 `A`）显示了相对于可用\
  \ Wi-Fi 连接（如果有的话）无线电的功率状态。\n\n时间轴图（`B`）包含了发送和接收的数据以及当前连接数的计数。在编写时，网络分析器仅能够监控由于 `HttpURLConnection`\
  \ 和 `OkHttp` 连接产生的网络活动。\n\n要查看发送或接收的文件信息，请在时间轴上点击并拖动以选择时间段。完成选择后，将 图 86-18 中标记为\
  \ `A` 的面板，列出文件。从列表中选择一个文件将显示详细面板（`B`），从中可以获取更多信息，包括响应、标头和调用栈信息：![](img/image16822.jpg)图\
  \ 86-18\n\n## 86.8 能量分析 (Energy Profiler)\n\n能量分析器（图 86-19`）对当前运行应用程序所消耗的能量进行实时分析，按\
  \ CPU、网络和位置跟踪活动进行分类。![](img/image16828.jpg)图 86-19\n\n能量分析器包含一个事件时间轴（`A`）和一个指示当前能量使用的图（`B`）。图根据图例（`C`）着色，图例还指示了三个类别当前的能量使用水平。选择图的某部分将列出任何导致过度耗能系统进程，例如闹钟和作业、位置请求或唤醒锁（wake\
  \ locks）。\n\n## 86.9 总结\n\nAndroid Profiler 监控应用程序的 CPU、内存、网络和能量资源使用，提供了一个可视化环境，用于定位内存泄漏、性能问题以及过度或低效的电池使用或通过网络连接传输数据。Android\
  \ Profiler 由不同的分析器视图组成，允许对详细指标进行监控、记录和分析。\n\n## 87 Android 生物识别认证 (Android Biometric\
  \ Authentication)\n\n触摸传感器现在已内置于许多 Android 设备中，用于识别用户并提供设备及应用功能的访问，例如应用内支付。指纹识别当然是多种认证方法之一，包括密码、PIN\
  \ 以及最近的面脸识别。尽管目前市场上只有少数 Android 设备提供面脸识别，但在不久的将来这可能会变得更加常见。针对这一点，Google 开始从以指纹为中心的方法转向更通用的生物识别认证。在\
  \ Android 8 的初始版本中，这些生物识别功能仅涵盖指纹，但在 Android 操作系统的后续版本和更新中将发生变化。本章提供了生物认证的概述，以及一个在\
  \ Android 应用中实现生物认证的详细步骤教程。\n\n### 87.1 认证概述\n\n关键的生物认证组件是 `BiometricPrompt`。该类执行了早期版本需要编写代码完成的工作，包括显示标准对话框引导用户通过认证过程、执行认证并将结果报告给应用程序。该类还处理过度尝试，并在用户尝试之前强制超时。\n\
  \n`BiometricPrompt` 类包含一个配套的 `Builder` 类，用于配置和创建 `BiometricPrompt` 实例，包括定义生物认证对话框中显示的文本以及取消按钮（也称为否定按钮）的自定义。`BiometricPrompt`\
  \ 实例还分配了一组认证回调，将向应用程序提供认证结果。`Cancellation` 实例也用于允许应用程序在处理过程中取消认证。涵盖了这些基础知识后，本章的剩余部分将在示例中实现指纹认证。\n\
  \n### 87.2 创建项目\n\n通过启动 Android Studio 环境并创建一个新项目开始此示例，在 Application name 输入 `BiometricDemo`，在\
  \ Domain 设置输入 `ebookfrenzy.com`，然后点击 Next。在 form factors 屏幕启用 Phone 和 Tablet 选项，并将最小\
  \ SDK 设置为 API 28：Android 9.0 (Pie)。继续通过设置屏幕，请求名为 `BiometricDemoActivity` 的空 Activity，以及相应的布局\
  \ `activity_main`。\n\n### 87.3 配置认证\n\n指纹认证适用于带有触摸传感器的设备，且已采取适当的配置步骤来保护设备并至少注册一个指纹。关于配置模拟器以测试指纹认证的步骤，请参考“使用和配置\
  \ Android Studio AVD](#part0007.xhtml_id_7_ZenzR2QDSlRad3lJQMAA1998)”。要在物理设备上配置指纹认证，打开打开\
  \ 应用并选择 Security & Location 选项。在安全设置屏幕内，选择 Fingerprint 选项。点击 Next 进入指纹设置屏幕。在启用指纹安全之前，必须配置备用解锁方法（如\
  \ PIN 码）。如果锁屏尚未锁定，按照步骤配置 PIN、模式或密码安全。锁屏锁定后，进入指纹检测屏幕并在提示时触摸传感器（图 87-1`），重复此过程添加额外的指纹。![](img/image16857.jpg)图\
  \ 87-1\n\n### 87.4 向 Manifest 文件添加生物权限\n\n生物认证要求应用程序在项目 manifest 文件请求 `USE_BIOMETRIC`\
  \ 权限。在 Android Studio Project 窗口中找到并编辑 `app -> manifests -> AndroidManifest.xml`\
  \ 文件，如下所示添加权限请求：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"com.ebookfrenzy.biometricdemo\"\
  >\n<uses-permission android:name=\"android.permission.USE_BIOMETRIC\" />\n</manifest>\n\
  ```\n\n### 87.5 设计用户界面\n\n为了保持示例尽可能简单，用户界面中的唯一视觉元素将是一个 `Button` 视图。找到并选择 `activity_main.xml`\
  \ 布局资源文件将其加载到 Layout Editor 工具中。删除示例 `TextView` 对象，从调板的 Common 类别拖放一个 `Button` 对象并放置在布局画布的中心。使用\
  \ Attributes 工具窗口将按钮上的 text 属性更改为“Authenticate”，并将字符串提取到资源。最后，配置 `onClick` 属性调用名为\
  \ `authenticateUser` 的方法。完成上述步骤后，布局应与 图 87-2 所示：![](img/image16875.jpg)图 87-2\n\n\
  ### 87.6 添加 Toast 便利方法\n\n在示例代码的各个地方，应用程序将设计为通过 Toast 消息向用户显示信息。与其多次重复相同的 Toast\
  \ 代码，将在主 Activity 中添加一个名为 `notifyUser()` 的便利方法。该方法将接受单个 `String` 值并以 Toast 消息的形式显示给用户。现在编辑\
  \ `MainActivity.java` 文件并如下添加此方法：\n\n```java\nimport android.widget.Toast;\n\nprivate\
  \ void notifyUser(String message) {\n    Toast.makeText(this, message, Toast.LONG).show();\n\
  }\n```\n\n### 87.7 检查安全设置\n\n在本章早些部分，已采取了在设备或模拟器上配置锁屏和注册指纹的步骤。但在尝试认证之前需要在应用程序中包含防御性代码以确保这些需求。这些步骤将在\
  \ `MainActivity.java` 文件中执行，使用 `Keyguard` 和 `PackageManager` 服务。注意还添加了代码以验证为应用程序配置了\
  \ `USE_BIOMETRIC` 权限：\n\n```java\npackage com.ebookfrenzy.biometricdemo;\n\nimport\
  \ android.support.v7.app.AppCompatActivity;\nimport android.support.v4.app.ActivityCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.app.KeyguardManager;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.biometric_demo);\n\
  \        checkBiometricSupport();\n    }\n\n    private Boolean checkBiometricSupport()\
  \ {\n        KeyguardManager keyguardManager = (KeyguardManager) getSystemService(KEYGUARD_SERVICE);\n\
  \        PackageManager packageManager = getPackageManager();\n        if (!keyguardManager.isKeyguardSecure())\
  \ {\n            notifyUser(\"Lock screen security not enabled\");\n           \
  \ return false;\n        }\n        if (ActivityCompat.checkSelfPermission(this,\
  \ Manifest.permission.USE_BIOMETRIC) != PackageManager.PERMISSION_GRANTED) {\n \
  \           notifyUser(\"Fingerprint authentication not enabled\");\n          \
  \  return false;\n        }\n        if (packageManager.hasSystemFeature(PackageManager.FINGERPRINT))\
  \ {\n            return true;\n        }\n        return true;\n    }\n}\n```\n\n\
  上述代码通过使用 Keyguard 配置备用解锁方法（例如，可以使用 PIN 或其他认证方法解锁屏幕）。在锁屏未加密的情况下，代码向用户报告问题并从方法返回。该方法随后检查应用程序是否启用生物权限。\n\
  \n### 87.8 配置认证回调\n\n当配置生物识别对话框时，将需要分配一组认证回调，以通知应用程序认证过程的成功或失败。这些方法需要包装在 `BiometricPrompt.AuthenticationCallback`\
  \ 实例中。在 `MainActivity.java` 文件中，添加一个方法来创建并返回一个实现了相应类的实例：\n\n```java\nimport android.hardware.biometrics.BiometricPrompt;\n\
  \nprivate BiometricPrompt.AuthenticationCallback getAuthenticationCallback() {\n\
  \    return new BiometricPrompt.AuthenticationCallback() {\n        @Override\n\
  \        public void onAuthenticationError(int errorCode, CharSequence errString)\
  \ {\n            notifyUser(\"Authentication error: \" + errString);\n         \
  \   super.onAuthenticationError(errorCode, errString);\n        }\n        @Override\n\
  \        public void onAuthenticationHelp(int helpCode, CharSequence helpString)\
  \ {\n            super.onAuthenticationHelp(helpCode, helpString);\n        }\n\
  \        @Override\n        public void onAuthenticationFailed() {\n           \
  \ super.onAuthenticationFailed();\n        }\n        @Override\n        public\
  \ void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {\n\
  \            notifyUser(\"Authentication Succeeded\");\n            super.onAuthenticationSucceeded(result);\n\
  \        }\n    };\n}\n```\n\n### 87.9 添加 CancellationSignal\n\n一旦启动，生物认证过程将独立于应用程序执行。为了给应用程序提供取消操作的方法，创建一个\
  \ `CancellationSignal` 类的实例并将其传递给生物认证过程。该 `CancellationSignal` 实例可以在需要时取消过程。取消信号实例可以配置一个监听器，在取消完成后会被调用。在\
  \ Activity 类中添加一个新方法来配置并返回 `CancellationSignal` 对象，如下：\n\n```java\nimport android.os.CancellationSignal;\n\
  \nprivate CancellationSignal cancellationSignal;\n\nprivate CancellationSignal getCancellationSignal()\
  \ {\n    cancellationSignal = new CancellationSignal();\n    cancellationSignal.setOnCancelListener(new\
  \ CancellationSignal.OnCancelListener() {\n        @Override\n        public void\
  \ onCancel() {\n            notifyUser(\"Cancelled via signal\");\n        }\n \
  \   });\n    return cancellationSignal;\n}\n```\n\n### 87.10 启动生物提示\n\n只需在 `authenticateUser()`\
  \ 方法中添加代码创建并配置 `BiometricPrompt` 实例并启动认证。如下添加 `authenticateUser()` 方法：\n\n```java\n\
  import android.view.View;\nimport android.content.DialogInterface;\n\npublic void\
  \ authenticateUser(View view) {\n    BiometricPrompt biometricPrompt = new BiometricPrompt.Builder(this)\n\
  \        .setTitle(\"Biometric Demo\")\n        .setSubtitle(\"Authentication is\
  \ required to continue\")\n        .setDescription(\"This app uses biometric authentication\
  \ to protect your data.\")\n        .setNegativeButton(\"Cancel\", this.getMainExecutor(),\
  \ new DialogInterface.OnClickListener() {\n            @Override\n            public\
  \ void onClick(DialogInterface dialogInterface, int i) {\n                notifyUser(\"\
  Authentication cancelled\");\n            }\n        }).build();\n    biometricPrompt.authenticate(getCancellationSignal(),\
  \ getMainExecutor(), getAuthenticationCallback());\n}\n```\n\n`BiometricPrompt.Builder`\
  \ 类用于创建一个新的 `BiometricPrompt` 实例，配置在提示对话框中的标题、副标题和描述文本。否定按钮被配置为显示“Cancel”文本，并配置了一个在点击该按钮时会被监听器。最后，调用\
  \ `BiometricPrompt` 实例的 `authenticate()` 方法并传递 `AuthenticationCallback` 和 `CancellationSignal`\
  \ 实例。\n\n### 87.11 测试项目\n\n项目完成后，在物理 Android 设备或模拟器会话中运行应用程序，并点击 Authenticate 按钮显示\
  \ `BiometricPrompt` 对话框，如 图 87-3 所示：![](img/image17023.jpg)图 87-3\n\n运行时，只需触摸指纹传感器或使用指纹识别即可。\n\
  \n\n\n\n\n* `Title` – 应用程序标题。\n* `Short Description` - 最多 80 个单词的应用程序描述。\n* `Full\
  \ Description` – 最多 4000 个字的应用程序描述。\n* `Screenshots` – 最多 8 张应用程序运行的截图（至少需要两张）。Google\
  \ 建议提交在 7 英寸或 10 英寸平板电脑上运行的截图。\n* `Language` – 应用程序的语言（默认为美式英语）。\n* `Promotional\
  \ Text` – 当您的应用程序出现在 Google Play 环境中的特殊促销活动中时将使用的文本。\n* `Application Type` – 您的应用程序被视为游戏还是应用程序。\n\
  * `Category` – 最能描述您应用程序的类别（例如：金融、健康与健身、教育、运动等）。\n* `Locations` – 您希望提供应用程序购买的地理位置。\n\
  * `Contact Details` – 用户可以通过哪些方式与您联系以获取应用程序的支持。选项包括网页、电子邮件和电话。\n* `Pricing & Distribution`\
  \ – 关于应用程序价格以及其营销和销售地理位置的信息。\n\n收集完上述信息后，点击 Google Play Console 中的 `Create Application`\
  \ 按钮开始创建过程。\n\n## 88.4 在控制台中配置应用\n当首次点击 `Create Application` 按钮时，将出现商店列表屏幕，如下方的图\
  \ 88-1 所示。您也可以通过选择导航面板中的 `Store listing` 选项（标记为 A）来访问该屏幕。一旦满足商店列表屏幕的所有要求，还必须完成 `Content\
  \ rating` (B) 和 `Pricing & distribution` (C) 屏幕：\n\n![](img/image17086.jpg)\n图 88-\
  \ 1\n\n一旦完全配置了应用项目，下一步是启用应用签名并上传应用包。\n\n## 88.5 启用 Google Play 应用签名\n直到最近，Google\
  \ Play 的上传是通过 `Android Studio` 内部的发布应用签名密钥进行签名，然后上传到 Google Play 控制台。虽然此选项仍然可用，但现在推荐的文件上传方法是使用被称为\
  \ `Google Play App Signing` 的过程。对于新创建的应用，这涉及加入 `Google Play App Signing`，然后生成一个用于在\
  \ `Android Studio` 中签名应用包文件的上传密钥。当上传由 `Android Studio` 生成的应用包文件时，Google Play 控制台会移除上传密钥，然后使用存储在\
  \ Google Play 服务器中的应用签名密钥对文件进行签名。对于现有应用，需要一些额外的步骤来启用 `Google Play Signing`，这些将在本末尾介绍。\n\
  \n在 Google Play 控制台中，从仪表板选择新添加的应用项目，点击左侧导航面板中的 `App releases` 选项。在 `App releases`\
  \ 屏幕上，选择 `Internal test track` 部分中的 `Manage` 按钮。在应用开发周期早期进行测试或在实验 `Android App Bundles`\
  \ 时，内部测试轨道特别别用。最终，应用将通过 Alpha 和 Beta 测试，最后才准备好投入生产发布。\n\n![](img/image17095.jpg)\n\
  图 88-2\n\n在随后的屏幕上，点击 `Create Release` 按钮显示如图 88-3 所示的设置屏幕：\n\n![](img/image171101.jpg)\n\
  图 88- 3\n\n要将应用加入 `Google Play App Signing`，请点击上方指定的 `Continue` 按钮。这将为应用生成一个应用签名证书，该证书将安全地存储在\
  \ Google Play 中。\n\n下一步是在 `Android Studio` 内部生成上传密钥。这是生成签名应用包过程的一部分部分。\n\n## 88.6\
  \ 启用 ProGuard\n在生成应用程序包时，可以在创建包的过程中使用 `ProGuard` 选项。`ProGuard` 执行一系列优化和验证任务，从而产生更小且更高效的字节码。为了使用\
  \ `ProGuard`，必须在生成应用包文件之前，在 `Project Structure` 设置中启用此功能。\n\n启用 `ProGuard` 的步骤如下：\n\
  \n1. 显示 `Project Structure` 框（`File` -> `Project Structure`）。\n2. 选择最左侧面板中的 `app`\
  \ 模块。\n3. 在主面板中选择 `Build Types` 标签，并在中间面板选择 `release` 项。\n4. 将 `Minify Enabled`\
  \ 选项从 `false` 改为 `true` 并点击 `OK`。\n5. 按照步骤创建密钥库文件并构建应用包文件。\n\n项目配置好用于发布构建后，下一步是创建一个包含上传密钥的密钥库文件。\n\
  \n## 88.7 创建密钥库文件\n要创建密钥库文件，选择 `Build` -> `Generate Signed Bundle / APK…` 菜单选项，显示如图\
  \ 88-4 所示的 `Generate Signed Bundle or APK Wizard` 对话：\n\n![](img/image17125.jpg)\n\
  图 88- 4\n\n在点击 `Next` 按钮之前，确认已选择 `Android App Bundle` 选项。\n\n如果有现有发布密钥库文件，请在下一个屏幕上点击\
  \ `Choose existing…` 并选择该文件。尚未创建密钥库文件，请点击 `Create new…` 显示图 88-5 的 `New Key Store`\
  \ 对话。点击 `Key store path` 字段右侧的按钮，导航到文件系统上的合适位置，为密钥库文件命名（例如 `release.keystore.jks`）并点击\
  \ `OK` 按钮。\n\n`New Key Store` 对话分为两个部分。顶部部分涉及密钥库文件。在此部分，输入保护密钥库文件的强密码到 `Password`\
  \ 和 `Confirm` 字段中。对话的下部部分涉及存储在密钥库中的上传密钥。\n\n![](img/image17133.jpg)\n图 88- 5\n\n\
  在 `New Key Store` 对话的 `Certificate` 部分中，输入以下信息：\n\n* 用于引用密钥的 `alias`（可以是任何字符序列，但系统仅使用前\
  \ 8 个）。\n* 用于保护密钥的足够强密码。\n* 密钥有效期年数（Google 建议超过 25 年）。\n\n\n\n\n\n此外，必须为剩余字段中的至少一个字段提供信息（例如，您的姓和名，或组织名称）。![](img/image17147.jpg)\
  \ 图 88-6\n\n输入信息后，点击 `OK` 按钮继续创建应用包。\n\n## 88.8 创建 Android App Bundle\n\n下一步是指示\
  \ Android Studio 以发布模式构建应用程序 app bundle 文件，然后用新创建的私钥对其进行签名。此时，`Generate Signed Bundle\
  \ or APK` 对话框应仍然显示，并且密钥库路径、密码和密钥别名字段已填充了信息：![](img/image17155.jpg) 图 88-7\n\n确保已启用\
  \ `Export Encrypted Key` 选项，并在假设其他设置正确的情况下，点击 `Next` 按钮进入应用包生成屏幕（图 88-8 )）。在此屏幕中，检查\
  \ `Destination Folder:` 设置，以验证生成 app bundle 文件的位置是否可以接受。如果倾向于其他位置，请点击文本字段右侧的按钮并导航到所需的文件系统位置。![](img/image17160.jpg)\
  \ 图 88-8\n\n点击 `Finish` 按钮并等待 `Gradle` 系统构建应用包。构建完成后，将出现一个对话框，提供在资源管理器窗口中打开包含 app\
  \ bundle 文件的文件夹，或将文件加载到 `APK Analyzer`：![](img/image17166.jpg) 图 88-9\n\n此时，应用程序已准备提交到\
  \ Google Play。点击 `locate` 链接打开文件系统浏览器窗口。该文件应名为 `bundle.aab`，并位于项目文件夹的 `app/release`\
  \ 子目录中，除非指定了其他位置。在此过程中生成的私钥应在签名和发布未来的应用程序时使用，因此应将其保存在安全的地方并进行安全备份。\n\n## 88.9 生成测试\
  \ APK 文件\n\n此阶段的一个可选步骤是从应用 bundle 生成 APK 文件，并在设备或模拟器会话上安装并运行它们。Google 提供了一个名为 `bundletool`\
  \ 的命令行工具专门为此目的设计，可以从以下 URL 下载：[`github.com/google/bundletool/releases`](https://github.com/google/bundletool/releases)\n\
  \n在编写时，`bundletool` 以 `.jar` 格式提供，可以如下所示从命令行执行（注意版本号自本书出版以来可能已经更改）：\n\n```\njava\
  \ -jar bundletool-all-0.3.3.jar\n```\n\n运行上述命令将列出工具中所有可用选项。从应用 bundle 生成 APK 文件，使用\
  \ `build-apks` 选项。要生成可以安装到设备或模拟器上的 APK 文件，这些文件还需要签名。为了实现这一点，请包含 `--ks` 选项指定在本章之前创建的密钥库文件路径，并配合\
  \ `--ks-key-alias` 选项指定生成密钥时提供的别名。\n\n最后，必须使用 `--output` 标志来指定生成 APK 文件的文件路径（称为\
  \ APK 集合）。该文件不能已存在，并且需要具有 `.apks` 文件扩展名。将这些要求结合起来得到如下命令行（考虑到您的操作系统路径结构可能存在差异）：\n\
  \n```\njava -jar bundletool-all-0.3.3.jar build-apks --bundle=/tmp/MyApps/app/release/bundle.aab\
  \ --output=/tmp/MyApks.apks --ks=/MyKeys/release.keystore.jks --ks-key-alias=MyReleaseKey\n\
  ```\n\n执行此命令时，将在生成 APK 文件到指定的 APK 集合文件之前出现提示请求密钥库密码。APK 集合文件仅为包含从应用 bundle 生成的所有\
  \ APK 文件的 ZIP 文件。\n\n要在连接的设备或模拟器上安装适当的 APK 文件，请使用类似下面的命令：\n\n```\njava -jar bundletool-all-0.3.3.jar\
  \ install-apks --apks=/tmp/MyApks.apks\n```\n\n此命令将指示工具识别连接设备的适当 APK 文件并安装它们，以便启动和测试应用程序。\n\
  \n还可以从 APK 集合中提取适用于连接设备的 APK 文件，而无需安装它们。此过程的第一步是按如下方式获取连接设备的规范：\n\n```\njava -jar\
  \ bundletool-all-0.3.3.jar get-device-spec --output=/tmp/device.json\n```\n\n上述命令将生成一个类似下面的\
  \ JSON 文件：`{\"supportedAbis\": [\"x86\"],\"supportedLocales\": [\"en-US\"],\"screenDensity\"\
  : 420,\"sdkVersion\": 27}`\n\n接下来，使用此规范文件从 APK 集合中提取匹配的 APK 文件：\n\n```\njava -jar\
  \ bundletool-all-0.3.3.jar extract-apks --apks=/tmp/MyApks.apks --output-dir=/tmp/nexus5_apks\
  \ --device-spec=/tmp/device.json\n```\n\n执行时，通过 `--output-dir` 标志指定的目录将包含对应设备配置的正确\
  \ APK 文件。\n\n将 Android 应用程序推市场的下一步是将其提交到 Google Play Console 以供测试。\n\n## 88.10 将应用\
  \ bundle 提交到 Google Play Console\n\n返回 Google Play Console 内的内部测试屏幕，通过拖放到指定区域上传应用\
  \ bundle，或点击按钮浏览文件:(image17200.jpg) 图 88-10\n\n应用 bundle 文件上传后，Google Play 将生成所有所需的\
  \ APK 文件准备测试。一旦 APK 文件生成，滚动到屏幕底部并点击 `Save` 按钮。设置保存后，点击 `Review` 按钮。\n\n## 88.11\
  \ 探索应用 bundle\n\n在审核屏幕上，点击 bundle 名称以展开有关 bundle 的信息，如 图 88-11 所示:(image17208.jpg)\
  \ 图 88-1\n\n此屏幕提供了有关应用 bundle 支持的 API 级别、布局和平台的摘要信息。要获取更多信息，点击突出显示的 `Explore App\
  \ Bundle` 选项。这将显示与通用 APK 文件相比节省的大小（图 88-12），并提供下载用于本地测试的单个 APK 选项，作为使用 bundletool\
  \ 的替代方案:(image17214.jpg) 图 88-2\n\nbundle 探索器还列出了支持的屏幕密度以及相应的安装大小。点击屏幕密度的 `View\
  \ Devices` 选项将显示支持该文件的设备:(image17220.jpg) 图 88-3\n\n此时，应用程序已准备好测试，但在控制台中设置某些测试者之前无法发布。\n\
  \n## 88.12 管理测试者\n\n如果应用程序仍处于内部、Alpha 或 Beta 测试阶段，可以通过在 Google Play Console 中选择应用程序来指定授权测试者列表，点击导航面板中的\
  \ `App releases`，选择相应发布类型的 `Manage` 按钮，并展开发布屏幕上的 `Manage testers` 部分，如下所示。\n\n\n\
  \n\n\n# 公开测试\n\n- 该应用已向 Google Play 商店中的所有用户开放。\n- 用户在测试期间可以通过提供的机制为您提供反馈。\n- 也可以指定测试人员的总数（但不能少于\
  \ 1000 人）。\n\n\n\n要配置测试，请使用“选择测试方法”菜单选择要执行的测试类型，点击 `Create List` 按钮并手动或通过上传 CSV\
  \ 文件指定测试用户的电子邮件地址。当应用发布进行测试后，将显示选择加入 URL。返回应用的审核页面（`App Releases` -> `Manage` ->\
  \ `Edit Release` -> `Review`）并点击 `Start Rollout to Internal Testers` 按钮。现在可以从管理测试人员屏幕（见上方\
  \ 图 88-14）复制 URL 并将其提供给测试用户，以便他们接受测试邀请并下载应用。\n\n## 88.13 上传即时应用包 (Instant App Bundles)\n\
  上传即时应用包文件的过程与上传标准应用包相似。在 Google Play 控制台中，从仪表板选择该应用，然后选择导航面板中的 Android Instant Apps\
  \ 选项，如 图 88-15 所示：![](img/image17246.jpg)图 88-15 \n\n选择用于开发、预发布或测试目的的上传 APK 选项。如果是为了开发或预发布测试而上传\
  \ APK，请使用后续屏幕中的 `Manage testers` 部分输入测试应用用户的 Gmail 电子邮件地址列表，然后点击 `Save` 按钮，随后点击\
  \ `Create Release` 按钮：![](img/image17252.jpg)图 88-16\n\n返回 Android Studio 并按照之前的步骤使用发布模式（release\
  \ mode）构建项目的即时应用模块，并生成签名的即时应用 APK 文件版本。构建完成后，即时应用 APK 文件将封装在项目目录中 `<module name>/release`\
  \ 文件夹下的 ZIP 文件中。可以直接将此文件上传到控制台，而无需先提取单独的 APK 文件。\n\n## 88.14 上传新的应用包版本\n为您的应用程序上传的上应用包文件版本号始终为\
  \ `1`。如果尝试上传另一个具有相同版本号的包文件，控制台将拒绝该文件并显示以下错误：`You need to use a different version\
  \ code for your APK because you already have one with version code 1`（你需要为 APK 使用不同的版本号，因为你已经有一个版本号为\
  \ 1 的版本）。\n\n要解决这个问题，需要增加嵌入包文件中的版本号。这在项目模块级的 `build.gradle` 文件中进行，如 图 88-17 中高亮所示![](img/image17263.jpg)图\
  \ 88-17\n\n默认情况下，该文件的内容如下：\n```gradle\napply plugin: 'com.android.application'\n\
  android {\n    compileSdkVersion 28\n    defaultConfig {\n        applicationId\
  \ \"com.example.myapplication\"\n        minSdkVersion 26\n        targetSdkVersion\
  \ 28\n        versionCode 1\n        versionName \"1.0\"\n        testInstrumentationRunner\
  \ \"android.support.test.AndroidJUnitRunner\"\n    }\n    buildTypes {\n       \
  \ release {\n            minifyEnabled false\n            proguardFiles getDefaultProguardFile('proguard-optimize.txt'),\
  \ 'proguard-rules.pro'\n        }\n    }\n}\ndependencies {\n    implementation\
  \ fileTree(dir: 'libs', include: ['*.jar'])\n    implementation 'com.android.support:appcompat-v7:28.0.0'\n\
  \    implementation 'com.android.support:support-v4:28.0.0'\n    implementation\
  \ 'com.android.support:design:28.0.0'\n    implementation 'com.android.support:constraint-layout:1.1.3'\n\
  \    testImplementation 'junit:4.12'\n    androidTestImplementation 'com.android.support.test:runner:1.0.2'\n\
  \    androidTestImplementation 'com.android.support.test:espresso-core:3.0.2'\n\
  }\n```\n要更改版本号，只需更改 `versionCode` 边的数字。要更改向用户显示的版本号，请更改 `versionName` 字符串。例如：\n\
  ```gradle\nversionCode 2\nversionName \"2.0\"\n```\n完成更改后，重新构建 APK 文件并再次上传。\n\n\
  ## 88.15 分析应用包文件\nAndroid Studio 提供分析应用包文件内容的功能。要分析包文件，请选择 `Android Studio Build\
  \ -> Analyze APK…` 菜单，导航并选择要查看的包文件。加载到工具后，将显示包的原始大小以及包的文件结构列表，如 图 88-18 所示![](img/image17303.jpg)图\
  \ 88-18\n\n选择 `classes.dex` 文件将在底部显示文件的类的结构。在该面板中，可以在方法级别浏览类的细节![](img/image17309.jpg)图\
  \ 88-19\n\n同样，选择文件列表中的资源或图像文件将在底部显示文件内容。可以通过点击 `Compare with previous APK…` 按钮并选择第二个包文件来查看两个包文件之间的大小差异。\n\
  \n## 88.16 为现有应用启用 Google Play 签名\n要为已在 Google Play 控制台中注册的应用启用 Google Play 签名，首先从控制台的应用列表中选择该应用。选中后，点击左侧导航面板中的\
  \ `App signing` 链接，如 图 88-20 所示![](img/image17318.jpg)图 88-20\n\n第一步是点击按钮下载 PEPK\
  \ 工具 (A)，该工具将用于加密项目的签名密钥。下载后，将其复制到包含现有密钥文件的目录，并运行以下命令，其中 `<your signing key file>`\
  \ 和 `<your alias>` 分别替换为您的密钥文件名和相应的别名：\n```\njava -jar pepk.jar --keystore=<your\
  \ signing key file> --alias=<your alias> --output=encrypted_private_key_path --encryption=<your\
  \ signing key>\n```\n根据提示输入密钥和密码，然后检查是否生成了名为 `encrypted_private_key_path` 的文件。此文件包含上传到\
  \ Google Play Store 的应用签名密钥。返回 Google Play 控制台，点击 App Signing Key 按钮 (B) 并上传 `encrypted_private_key_path`。接下来按照前面的步骤生成上传密钥并将其存储在新的密钥文件中。在终端或命令提示符窗口中，切换到密钥文件所在目录并运行以下命令将密钥转换为\
  \ PEM 证书格式：\n```\nkeytool -export -rfc -keystore <upload key file> -alias <alias>\
  \ -file upload_certificate.pem\n```\n生成文件后，点击 Google Play 控制台中的 Upload Public Certificate\
  \ 按钮 (C) 并上传 PEM 文件。最后，点击 Enroll 按钮 (D) 将应用加入 Google Play 签名。一旦应用加入，在在 Android Studio\
  \ 中生成签名的应用包时，必须使用新的上传密钥文件。\n\n## 88.17 总结\n一旦应用项目完成或准备好用户测试，即可将其上传到 Google Play\
  \ 控制台并发布用于生产、内部、alpha 或 beta 测试。在上传应用之前，必须在控制台中创建一个应用条目，包括应用信息。然后生成发布版 App Bundle\
  \ 文件，并使用 Android Studio 中的上传密钥对其进行签名。包文件上传后，Google Play 会移除上传密钥并将其替换为安全存储的密钥，应用即可准备发布。可以通过将其加载到\
  \ Android Studio 分析器随时查看包的内容。\n\n## 89 Android Studio 中的 Gradle 概述\n到为止，大部分情况下，Android\
  \ Studio 会采取必要的步骤来编译和运行已创建的应用。Android Studio 是通过一个名为 Gradle 的系统在后台实现此点的。现在是查看如何使用\
  \ Gradle 来编译和打包应用的各种元素，并在构建需要更高级需求时如何配置该系统。\n\n### 89.1 Gradle 概述\nGradle 是一个自动化构建工具包，允许通过一组配置文件来配置和管理项目的构建方式。这包括如何构建项目、成功构建项目所需的依赖以及构建过程的最终结果（或结果）。Gradle\
  \ 的优势在于它为开发者提供的灵活性。Gradle 系统是一个自包含的命令行环境，可以集成到其他环境中。在 Android Studio 的情况下，通过相应的\
  \ Android Studio 插件提供了集成。虽然 Android Studio 插件允许在内部启动和管理 Gradle 任务，但 Gradle 命令行封装器用于未安装\
  \ Android Studio 的系统上构建 Android 项目。构建项目的规则在基于 Groovy 语言文件中\n\n### 89.2 Gradle 和\
  \ Android Studio\nGradle 为构建 Android 项目带来了许多强大功能。一些关键功能如下：\n\n#### 89.2.1 合理默认\n\
  Gradle 实现了“约定优于配置”（convention over configuration）的概念。这意味着 Gradle 有一套预定义的合理配置设置，除非被构建文件中的设置覆盖。这意味着可以使用开发者所需的最小配置执行构建。只有当默认配置不满足构建需求时，才需要对构建文件进行更改。\n\
  \n#### 89.2.2 依赖\nGradle 功能的另一个关键领域是依赖。例如，考虑 Android Studio 项目中的一个模块，它触发加载另一个模块的意图。如果找不到或无法第二个模块，应用程序将无法构建。可以在第一个模块的构建文件中声明此依赖，以便第二个模块包含在应用构建中。Gradle\
  \ 依赖分为本地或远程。本地依赖指向执行构建的计算机本地文件系统。远程依赖指向远程服务器上的项目（通常称为仓库）。Android Studio 项目使用另一个名为\
  \ Maven 项目管理工具处理远程依赖。如果在 Gradle 构建文件中使用 Maven 语法声明远程依赖，则该依赖将从指定的仓库自动下载并包含在构建过程中。例如，以下依赖将\
  \ AppCompat 库添加到项目中：\n```\nimplementation 'com.android.support:appcompat-v7:28.0.0'\n\
  ```\n\n#### 89.2.3 构建变体 (Build Variant)\n除了依赖，Gradle 还提供了构建支持。这允许从单个项目构建应用的多个变体。针对各种设备类型和尺寸，通常需要构建不同的变体（例如，一个用于手机，另一个用于平板电脑屏幕）。\n\
  \n#### 89.2.4 清单条目\n每个 Android 项目都关联一个 `AndroidManifest.xml` 文件。在 Gradle 构建文件中可以指定许多清单条目，这些条目会自动生成到清单中。这允许为构建变体配置应用\
  \ ID 和 SDK 版本等元素。\n\n#### 89.2.5 APK 签名\n“创建、测试和上传应用包”章节涵盖了使用 Android Studio 环境创建签名\
  \ APK 内容。也可以通过用户界面包含签名信息，以便从命令行生成签名的 APK 文件。\n\n#### 89.2.6 Google Play 签名\n文件生成后，点击\
  \ Enroll 按钮将应用加入 Google Play 签名。一旦应用加入，在在 Android Studio 中生成签名的应用包时，必须使用新的上传密钥文件。\n\
  \n#### 89.2.7 ProGuard 支持\nProGuard 是 Android Studio 自带的一个工具，它可以优化、压缩和混淆 Java 字节码，使其更高效且更难反向工程（他人通过分析编译代码来识别应用逻辑的方法）。Gradle\
  \ 构建文件提供了控制是否在应用上运行 ProGuard 的功能。\n\n### 89.3 顶层构建文件\n一个完整的 Android Studio 项目包含了构建\
  \ Android 应用所需的所有内容，由模块、库、清单文件和 Gradle 构建文件组成。每个项目包含一个顶层 Gradle 构建文件。该文件列为 `build.gradle`（项目:\
  \ `<project name>`），可以在项目工具窗口中找到，如 图 89-1 所示：![](img/image1766.jpg)图 89-1\n\n默认情况下，顶层文件的内容如下：\n\
  ```gradle\n// 顶层构建文件，可以在此处为所有子项目/模块添加配置选项\nbuildscript {\n    repositories {\n \
  \       google()\n        jcenter()\n    }\n    dependencies {\n        classpath\
  \ 'com.android.tools.build:gradle:3.2.0'\n        // 注意：不要将应用依赖放在这里；它们属于\n     \
  \   // 个模块的构建文件\n    }\n}\nallprojects {\n    repositories {\n        google()\n\
  \        jcenter()\n    }\n}\ntask clean(type: Delete) {\n    delete rootProject.buildDir\n\
  }\n```\n正如目前所显示的，该文件只是声明了远程库使用 jcenter 仓库，并且构建依赖于 Android 插件。在大多数情况下，不需要对此文件进行任何更改。\n\
  \n\n\n\n* `Module1/build.gradle`\n* `Module2/build.gradle`\n\n\n\n默认情况下，`Module1`\
  \ 的 `build.gradle` 文件将类似于下面的所示：\n\n```gradle\napply plugin: 'com.android.application'\n\
  android {\n    compileSdkVersion 28\n    defaultConfig {\n        applicationId\
  \ \"com.ebookfrenzy.module1\"\n        minSdkVersion 18\n        targetSdkVersion\
  \ 28\n        versionCode 1\n        versionName \"1.0\"\n        testInstrumentationRunner\
  \ \"android.support.test.runner.AndroidJUnitRunner\"\n    }\n    buildTypes {\n\
  \        release {\n            minifyEnabled false\n            proguardFiles getDefaultProguardFile('proguard-android.txt'),\
  \ 'proguard-rules.pro'\n        }\n    }\n}\ndependencies {\n    implementation\
  \ fileTree(dir: 'libs', include: ['*.jar'])\n    implementation 'com.android.support:appcompat-v7:26.0.2'\n\
  \    implementation 'com.android.support:constraint:constraint-layout:1.0.2'\n \
  \   testImplementation 'junit:junit:4.12'\n    androidTestImplementation 'com.android.support.test:runner:1.0.2'\n\
  \    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'\n\
  }\n```\n\n从文件内容可以看出，构建文件首先声明使用 Gradle Android 插件：`apply plugin: 'com.android.application'`。\n\
  \n随后，文件的 `android` 部分说明了在构建 `Module1` 时使用的 SDK 版本。\n\n```gradle\nandroid {\n   \
  \ compileSdkVersion 28\n}\n```\n\n`defaultConfig` 节中定义的项定义了在构建期间将生成到模块 `AndroidManifest.xml`\
  \ 文件中的元素。这些设置可以在构建文件中进行修改，它们源自最初创建模块时在 Android Studio 中输入的设置：\n\n```gradle\ndefaultConfig\
  \ {\n    applicationId \"com.ebookfrenzy.module1\"\n    minSdkVersion 18\n    targetSdkVersion\
  \ 28\n    versionCode 1\n    versionName \"1.0\"\n}\n```\n\n`buildTypes` 节包含了关于在构建应用发布版本时，是否以及如何对\
  \ APK 文件运行 ProGuard 的指令：\n\n```gradle\nbuildTypes {\n    release {\n        runProguard\
  \ false\n        proguardFiles getDefaultProguardFile('proguard-android.txt'),'proguard-rules.pro'\n\
  \    }\n}\n```\n\n按照当前的配置，构建 `Module1` 时不会运行 ProGuard。要启用 ProGuard，需要将 `runProguard`\
  \ 项从 `false` 更改为 `true`。`proguard-rules.pro` 文件可以在项目的模块目录中找到。对此文件的更改将覆盖位于 Android\
  \ SDK 安装目录下 `sdk/tools/proguard` 下的 `proguard-android.txt` 文件的默认设置。\n\n由于此文件中没有声明调试\
  \ `buildType`，将将使用默认值（不带 ProGuard 进行构建，使用调试密钥进行签名，并启用了调试符号）。\n\n模块构建文件中还可以包含一个标题为\
  \ `productFlavors` 的额外节，以便创建多个构建变体。\n\n最后，`dependencies` 节列出了模块所依赖的任何本地和远程依赖项。第一个依赖项如下：`implementation\
  \ fileTree(dir: 'libs', include: ['*.jar'])`。这是一行标准代码，它告诉 Gradle 系统，位于模块 `lib` 子目录中的任何\
  \ JAR 文件都将包含在项目构建中。例如，如果项目的 `GradleDemo/Module1/lib` 文件夹中存在一个名为 `myclasses.jar`\
  \ 的 JAR 文件，则该 JAR 文件将被视为模块依赖并包含在构建过程中。\n\n上述示例文件的最后几行依赖指定了需要从 Android 仓库包含的 Android\
  \ 库：`implementation 'com.android.support:appcompat-v7:26.0.2'` 和 `implementation\
  \ 'com.android.support:constraint:constraint-layout:1.0.2'`。注意，依赖声明可以包含版本号，以指示包含哪个版本的库。\n\
  \n## 8.5 在构建文件中配置签名设置\n\n本书的“创建、测试和上传 Android App Bundle”章节涵盖了使用 Android Studio\
  \ 用户界面设置密钥和生成签名发布 APK 文件的步骤。这些设置也可以在 `build.gradle` 文件的 `signingSettings` 节中声明。例如：\n\
  \n```gradle\napply plugin: 'com.android.application'\nandroid {\n    compileSdkVersion\
  \ 28\n    defaultConfig {\n        applicationId \"com.ebookfrenzy.gradledemo.module1\"\
  \n        minSdkVersion 28\n        targetSdkVersion 28\n        versionCode 1\n\
  \        versionName \"1.0\"\n    }\n    signingConfigs {\n        release {\n \
  \           storeFile file(\"keystore.release\")\n            storePassword \"your\
  \ keystore password here\"\n            keyAlias \"your key alias here\"\n     \
  \       keyPassword \"your key password here\"\n        }\n    }\n    buildTypes\
  \ {...}\n}\n```\n\n上面的示例将密钥密码信息直接嵌入到构建文件中。这种方法的替代方案是从系统环境变量中提取这些值：\n\n```gradle\n\
  signingConfigs {\n    release {\n        storeFile file(\"keystore.release\")\n\
  \        storePassword System.getenv(\"KEYSTOREPASSWD\")\n        keyAlias \"your\
  \ key alias here\"\n        keyPassword System.getenv(\"KEYPASSWD\")\n    }\n}\n\
  ```\n\n另一种方法是配置构建文件，让 Gradle 在构建过程中提示输入密码：\n\n```gradle\nsigningConfigs {\n    release\
  \ {\n        storeFile file(\"keystore.release\")\n        storePassword System.console().readLine(\"\
  \\nEnter Keystore password: \")\n        keyAlias \"your key alias here\"\n    \
  \    keyPassword System.console().readLine(\"\\nEnter Key password: \")\n    }\n\
  }\n```\n\n## 8.6 从命令行运行 Gradle 任务\n\n每个 Android Studio 项目都包含一个 Gradle 包装器，用于从命令行调用\
  \ Gradle 任务。该工具位于每个项目文件夹中。虽然此包装器在 Windows 系统上是可以执行的，但在 Linux 和 macOS 上需要启用执行权限。要启用执行权限，请打开终端窗口，进入需要该包装器的项目目录并执行以下命令：\n\
  \n```bash\nchmod +x gradlew\n```\n\n一旦具有执行权限，则需要将文件路径添加到 `$PATH` 环境变量中，或者在运行时名前加上\
  \ `./`。例如：\n\n```bash\n./gradlew tasks\n```\n\n通过多个不同的任务查看项目构建。当前项目可用任务的完整列表可以通过运行以下命令获得（如果在\
  \ macOS 或 Linux 上运行，请在命令前加上 `./`）：\n\n```bash\n./gradlew tasks\n```\n\n要构建适用于设备或模拟器的调试版本，请使用\
  \ `assembleDebug` ：\n\n```bash\n./gradlew assembleDebug\n```\n\n或者，构建应用的发布版本：\n\n\
  ```bash\n./gradlew assembleRelease\n```\n\n## 8.7 总结\n\n在大多数情况下，Android Studio 在没有人员干预的情况下后台执行应用构建。此构建过程由\
  \ Gradle 系统处理，Gradle 是一种自动化构建工具，允许通过一组配置文件来管理和构建项目。虽然 Gradle 的默认行为对于许多基础项目需求是足够了，但对于更复杂的项目，配置构建过程的需求是不可避免的。本章概述了\
  \ Android 项目背景下的 Gradle 构建系统和配置文件。\n"
