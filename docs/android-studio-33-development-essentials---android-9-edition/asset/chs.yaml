  \");\n    productQuantity.setText(\"\");\n}\n```\n\n在应用构建和测试之前，需要从 `onActivityCreated()`\
  \ 方法调用的三个 setup 方法添加到类中。\n\n## 68.11 添加按钮监听器\n\n主 fragment 用户界面布局包含三个按钮，当用户点击时需要执行特定任务。编辑\
