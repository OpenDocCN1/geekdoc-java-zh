  \ mode）允许应用栏中的指定内容在折叠时从视图中消失，而 `pin` 模式则允许应用栏的元素在收缩期间保持在固定位置。\n\n还提供了 `scrim`（遮罩层）选项，用于指定工具栏在折叠序列期间转换的颜色。\n\
