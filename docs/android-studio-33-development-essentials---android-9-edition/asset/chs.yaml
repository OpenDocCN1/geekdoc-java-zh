  \ 中。对现有产品进行搜索并验证 ID 和数量字段相应更新。最后，输入现有产品的名称，从数据库中删除它，并确认它已从 `RecyclerView` 产品列表中移除。\n\
  \n## 68.15 总结\n\n本章演示了使用 Room 持久库在 SQLite 数据库中存储数据。完成的项目使用了仓库将 `ViewModel` 与所有数据库操作分离，并演示了实体、DAO\
  \ 和 Room 数据库实例创建，包括执行某些数据库操作时使用异步任务。\n\n## 69.1 使用 Android Storage Access Framework\
  \ 访问云存储\n\n近年来，远程存储服务（也称为“云存储”）被广泛用于存储用户文件和数据。驱动这种增长有两个关键因素。其一个是大多数移动设备现在提供持续、高速的互联网连接，从而使数据传输快速且廉价。第二个因素是，相对于传统的计算机系统（如台式机和笔记本电脑），这些移动设备在内部存储资源受到限制。例如，今天高规格的\
  \ Android 平板通常具有 128GB 的存储容量。与带有 750GB 硬盘的中端笔记本电脑系统相比，无缝存储文件是今天许多应用程序的关键需求。由于这一事实，Google\
  \ 在 Android 4.4 SDK 部分中引入了 Storage Access Framework。本章将提供存储框架的高级概述\n\n### 69.1 The\
  \ Storage Access Framework\n\n从用户的角度来看，Storage Access Framework 提供了一个直观的用户界面，允许用户在\
  \ Android 内部浏览、选择、删除和创建由存储服务（也称为文档提供者）托管的文件。使用此浏览界面（也称为选择器），用户可以例如浏览他们选定的文档提供者托管的文件（如文档、音频、图像）。图\
  \ 69-1](#part0071.xhtml_id_7_ZenzR2QDSlRad3lJQMAA19877)，例如显示了由文档提供者服务的文件的选择器界面：![](img/3148.jpg)\n\
  \n图 69- 1\n\n文档提供者的范围从云端服务到在与客户端设备上运行的本地文档提供者。\n\n\n\n\n\n- •\n- •\n\n\n\n\n## 69.3\
  \ 过滤选择器文件列表\n\n当启动 intent 时，选择器用户界面中列出的文件可以使用多种选项进行过滤。例如，考虑以下用于启动 `ACTION_OPEN_DOCUMENT`\
  \ intent 的代码：\n\n```java\nprivate static final int OPEN_REQUEST_CODE = 41;\nIntent\
  \ intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\nstartActivityForResult(intent,\
  \ OPEN_REQUEST_CODE);\n```\n\n执行上述代码后，将显示选择器用户界面，允许用户浏览并选择由可用文档提供者托管的任何文件。一旦用户选择了文件，应用程序将以\
  \ `Uri` 对象的形式获得该文件的句引用。随后，应用程序可以使用 `openFileDescriptor(Uri, String)` 方法打开文件。然而，存在某种风险，即并非所有文档提供者列出的文件都能通过这种方式打开。可以通过使用\
  \ `CATEGORY_OPENABLE` 选项修改 intent 来在选择器中排除此类文件。例如：\n\n```java\nprivate static final\
  \ int OPEN_REQUEST_CODE = 41;\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  intent.addCategory(Intent.CATEGORY_OPENABLE);\nstartActivityForResult(intent, OPEN_REQUEST_CODE);\n\
  ```\n\n现在显示选择器时，无法使用 `openFileDescriptor()` 方法打开的文件将列出，但用户无法选择。\n\n另一种实用的过滤方法允许根据文件类型限制可供选择的文件。这涉及指定应用程序能够处理的文件类型。例如，图像编辑应用程序可能只想为用户提供从文档提供者选择图像文件的选项。这是通过配置\
  \ intent 对象并指定用户可以选择的文件的 MIME 类型来实现的。例如，以下代码指定了只有图像文件适合在选择器中选择：\n\n```java\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"image/*\");\nstartActivityForResult(intent, OPEN_REQUEST_CODE);\n\
  ```\n\n这可以进一步精化，将选择限制为 JPEG 图像：\n```java\nintent.setType(\"image/jpeg\");\n```\n\
  \n或者，音频播放器应用可能只能处理音频文件：\n```java\nintent.setType(\"audio/*\");\n```\n\n音频应用可能还会被进一步限制为仅支持播放基于\
  \ MP4 的音频文件：\n```java\nintent.setType(\"audio/mp4\");\n```\n\n在使用 Storage Access\
  \ Framework 时，可以使用广泛的 MIME 类型设置，其中更常见的可以在网上找到：https://en.wikipedia.org/wiki/Internet_media_type#List_of_common_media_types\n\
  \n## 69.4 处理 Intent 结果\n\n当 intent 将控制权返回给应用程序时，它通过调用启动 intent 的 activity 的 `onActivityResult()`\
  \ 方法来实现。该方法接收在启动时传递给 intent 的请求码、一个指示 intent 是否成功的结果代码，以及一个包含所选文件 `Uri` 的结果数据对象。例如，以下代码可以作为处理上一节中概述的\
  \ `ACTION_OPEN_DOCUMENT` intent 结果的基础：\n\n```java\npublic void onActivityResult(int\
  \ requestCode, int resultCode, Intent resultData) {\n    Uri currentUri = null;\n\
  \    if (resultCode == Activity.RESULT_OK) {\n        if (requestCode == OPEN_REQUEST_CODE)\
  \ {\n            if (resultData != null) {\n                currentUri = resultData.getData();\n\
  \                readFileContent(currentUri);\n            }\n        }\n    }\n\
  }\n```\n\n上述方法验证了 intent 是否成功，检查请求码是否与文件打开请求匹配，然后从 intent 数据中提取 `Uri`。该 `Uri` 可以用于读取文件内容。\n\
  \n## 69.5 读取文件内容\n\n读取由文档提供者托管的文件内容所需的精确步骤在很大程度上取决于文件的类型。例如，从文本文件中读取行的步骤与图像或音频文件的步骤不同。\n\
  \n通过从 `Uri` 对象中提取文件描述符并将图像解码为 `BitmapFactory` 实例，可以将图像文件分配给 `Bitmap` 对象。例如：\n\n\
  ```java\nParcelFileDescriptor pFileDescriptor = getContentResolver().openFileDescriptor(uri,\
  \ \"r\");\nFileDescriptor fileDescriptor = pFileDescriptor.getFileDescriptor();\n\
  Bitmap image = BitmapFactory.decodeFileDescriptor(fileDescriptor);\npFileDescriptor.close();\n\
  myImageView.setImageBitmap(image);\n```\n\n注意文件描述符是以 `\"r\"` 模式打开的。这表示以读取打开打开。其他选项有\
  \ `\"w\"`（写访问）和 `\"rwt\"`（读写访问），其中文件中的现有内容会被新内容截断。\n\n读取文本文件的内容需要稍多工作，并使用 `InputStream`\
  \ 对象。例如，以下代码从文本文件中读取行：\n\n```java\nInputStream inputStream = getContentResolver().openInputStream(uri);\n\
  BufferedReader reader = new BufferedReader(new InputStreamReader(inputStream));\n\
  String readline;\nwhile ((readline = reader.readLine()) != null) {\n    // 对文件中的每一行进行某些操作\n\
  }\ninputStream.close();\n```\n\n## 69.6 向文件写入内容\n\n写入由文档提供者托管的打开文件与读取类似，不同之处使用的是输出流而不是输入流。例如，以下代码向指定的\
  \ `Uri` 引用的输出流写入文本：\n\n```java\ntry {\n    ParcelFileDescriptor pFileDescriptor\
  \ = getContentResolver().openFileDescriptor(uri, \"w\");\n    FileOutputStream fileOutputStream\
  \ = new FileOutputStream(pFileDescriptor.getFileDescriptor());\n    String textContent\
  \ = \"Some sample text\";\n    fileOutputStream.write(textContent.getBytes());\n\
  \    fileOutputStream.close();\n    pFileDescriptor.close();\n} catch (FileNotFoundException\
  \ e) {\n    e.printStackTrace();\n} catch (IOException e) {\n    e.printStackTrace();\n\
  }\n```\n\n首先，从 `Uri` 提取文件描述符并目标文件的写入权限。随后，使用文件描述符获取文件的输出流引用。然后将内容（在本例中为某些示例文本）写入输出流。\n\
  \n## 69.7 删除文件\n\n是否可以从存储器删除文件取决于文档提供者是否支持删除。假设允许删除，可以如下对指定的 `Uri` 执行删除：\n\n```java\n\
  if (DocumentsContract.deleteDocument(getContentResolver(), uri)) {\n    // 删除成功\n\
  } else {\n    // 删除失败\n}\n```\n\n# 69.8 获取文件的持久访问\n\n当应用程序通过 Storage Access Framework\
  \ 获取文件的访问时，该访问将一直有效，直到 Android 设备重启。可以通过“获取” `Uri` 的必要权限获取特定文件的持久访问。例如，以下代码：\n\n\
  ```java\nint takeFlags = intent.getFlags() & (Intent.FLAG_READ_PERMISSION | Intent.FLAG_WRITE_PERMISSION);\n\
  getContentResolver().takePersistableUriPermission(fileUri, takeFlags);\n```\n\n\
  一旦获取了文件的权限并保存了 `Uri`，用户应该能够在设备重启后继续访问文件，而无需重新从选择界面选择。如果不再需要持久权限，可以通过调用 content resolver\
  \ 的 `releasePersistableUriPermission()` 方法释放：\n\n```java\nint releaseFlags = intent.getFlags()\
  \ & (Intent.FLAG_READ_PERMISSION | Intent.FLAG_WRITE_PERMISSION);\ngetContentResolver().releasePersistableUriPermission(fileUri,\
  \ releaseFlags);\n```\n\n## 69.9 总结\n\n考虑这些年来对存储的感知变化是非常有趣的。“存储”曾与大容量内部磁盘驱动器同义，而现在这个词同样可能指代托管在云端并通过互联网连接访问的存储空间。随着资源受限的“始终连接”的移动设备的广泛采用，这种情况变得越来越普遍。\n\
  \nAndroid Storage Access Framework 为用户和应用程序开发者提供了一种简单的机制，以无缝访问存储在云端的文件。通过使用一组 intent\
  \ 和用于选择文档提供者文件的内置用户界面，现在可以将全面的云存储集成到 Android 应用程序中。\n\n# 70. Storage Access Framework\
  \ 示例\n\n如前，Storage Access Framework 极大地简化将云存储访问集成到 Android 应用程序的过程中。由于包含选择器用户界面和一组新的\
  \ intent，现在可以相对轻松地构建 Google Drive 和 Box 等文档提供者的文件访问。在前节介绍 Storage Access Framework\
  \ 基础之后，本章将通过创建一个使用 Storage Access Framework 存储和管理文件的示例应用程序来实现。\n\n## 70.1 关于 Storage\
  \ Access Framework 示例\n\n在本章中创建的 Android 应用程序将以原始文本编辑器的形式存在，旨在创建并存储文本文件到云端存储服务。在实践中，该示例将与任何兼容\
  \ Storage Access Framework 的云端文档提供者一起，但本示例假设使用 Google Drive。从功能上说，应用程序将向用户提供一个多行文本视图，可以在其中输入和编辑文本，以及一组允许创建、打开和保存存储文本文件的按钮。\n\
  \n## 70.2 创建 Storage Access Framework 示例\n\n从欢迎界面选择 Start new Android Studio project\
  \ 快速启动选项，在出现的新项目对话框中，选择 Empty Activity 模板，然后点击 Next 按钮。在 Name 字段中输入 `StorageDemo`，并指定\
  \ `com.ebookfzy.storagedemo` 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置更改为 API 26:\
  \ Android 8.0 (Oreo)，并将 Language 语言菜单更改为 Java。\n\n### 70.3 设计用户界面\n\n用户界面需要由三个 `Button`\
  \ 视图和一个 `EditText` 视图组成。在 Project 工具窗口中，导航到位于 `app -> res -> layout` 的 `activity_main.xml`\
  \ 布局文件并双击它将其加载到 Layout Editor 工具。在工具的 Design 模式下，选择并删除 Hello World! `TextView` 对象。在布局的左上角拖动并放置\
  \ `Button` 组件，在放置组件之前显示左侧和顶部的虚线网格线。放置第二个 `Button`，使中间和顶部网格线出现。第三个 `Button` 组件应被放置在显示顶部和右侧网格线的位置。将三个按钮上的文本属性分别更改为“New”、“Open”和“Save”。接下来，放置\
  \ Plain Text 组件，使其水平居中并位于中间 `Button` 下方。使用 Layout Editor 中的 Constraints 按钮添加任何缺失的约束。在布局中选择\
  \ Plain Text 组件，删除文本属性设置使其为空，并将 ID 设置为 `fileText`。使用 Attributes 工具窗口，配置 `Button`\
  \ 的 `onClick` 属性分别调用 `newFile`、`openFile` 和 `saveFile`。\n\n## 70.4 声明请求码\n\n在 Storage\
  \ Access Framework 中处理文件涉及根据特定操作触发多种 intent。这始终会导致显示存储用户界面，以便用户可以指定存储位置（例如 Google\
  \ Drive 上的目录以及文件名）。当 intent 工作完成后，通过调用名为 `onActivityResult` 的方法通知应用程序。由于来自 activity\
  \ 的 intent 都会调用 `onActivityResult()` 方法，因此需要一种机制来识别哪个 intent。这可以通过启动 intent 时传递请求码来实现。在实现创建、保存和打开文件的\
  \ `onClick` 处理器之前，第一步是为这三个操作声明请求码。找到并加载 `MainActivity.java` 文件并为应用程序的操作声明常量值：\n\n\
  ```java\npackage com.ebookzy.storagedemo;\nimport android.support.v7.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.widget.EditText;\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static EditText textView;\n    private\
  \ static final int CREATE_REQUEST_CODE = 40;\n    private static final int OPEN_REQUEST_CODE\
  \ = 41;\n    private static final int SAVE_REQUEST_CODE = 42;\n    @Override\n \
  \   protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_storage_demo);\n        textView = findViewById(R.id.fileText);\n\
  \    }\n```\n\n## 70.5 创建新的存储文件\n\n当选择 New 按钮时，应用程序需要触发一个 `ACTION_CREATE_DOCUMENT`\
  \ intent 来创建一个文本 MIME 类型的文件。在设计用户界面时，New 按钮被配置为调用名为 `newFile()` 的方法。在该方法内启动适当的 intent。在\
  \ `MainActivity.java` 文件中实现此方法：\n\n```java\npackage com.ebookfzy.storagedemo;\n\
  import android.app.Activity;\nimport android.support.v7.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.widget.EditText;\nimport android.content.Intent;\n\
  import android.view.View;\nimport android.net.Uri;\npublic class MainActivity extends\
  \ AppCompatActivity {\n    private static EditText textView;\n    private static\
  \ final int CREATE_REQUEST_CODE = 40;\n    private static final int OPEN_REQUEST_CODE\
  \ = 41;\n    private static final int SAVE_REQUEST_CODE = 42;\n    public void newFile(View\
  \ view) {\n        Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);\n\
  \        intent.addCategory(Intent.CATEGORY_OPENABLE);\n        intent.setType(\"\
  text/plain\");\n        intent.putExtra(Intent.EXTRA_TITLE, \"newfile.txt\");\n\
  \        startActivityForResult(intent, CREATE_REQUEST_CODE);\n    }\n}\n```\n\n\
  此代码创建一个新的 `ACTION_CREATE_DOCUMENT` `Intent` 对象。随后配置此 intent，仅返回可以使用文件描述符打开的文件（通过\
  \ `Intent.CATEGORY_OPENABLE` 设置）。接下来，代码指定要打开的文件为纯文本 MIME 类型，并提供占位文件名（用户可以在选择器界面中更改）。最后，启动\
  \ intent 并传递之前声明的 `CREATE_REQUEST_CODE`。当执行此方法且 intent 完成任务时，将调用应用程序的 `onActivityResult()`\
  \ 方法，并传递新创建文档的 `Uri` 以及启动 intent 时使用的请求码。现在是实现此方法的理想机会。\n\n### 70.6 onActivityResult()\
  \ 方法\n\n`onActivityResult()` 方法将被应用程序生命期间调用的所有 intent 共享。在每情况下，方法将接收一个请求码、结果代码和一个包含存储文件\
  \ `Uri` 的结果数据集。该方法需要实现，以检查 intent 操作是否成功、识别执行的操作类型并从结果数据中提取文件 `Uri`。在教程的此时，方法只需要处理在所选的文档提供者上创建新文件，因此修改\
  \ `MainActivity.java` 文件添加此方法：\n\n```java\npublic void onActivityResult(int requestCode,\
  \ int resultCode, Intent resultData) {\n    if (resultCode == Activity.RESULT_OK)\
  \ {\n        if (requestCode == CREATE_REQUEST_CODE) {\n            if (resultData\
  \ != null) {\n                textView.setText(\"\");\n            }\n        }\n\
  \    }\n}\n```\n\n此方法中的代码基本上是直接的。检查 activity 的结果，如果成功，则将请求码与 `CREATE_REQUEST_CODE`\
  \ 值比较，以验证用户正在创建一个新文件。如果是这样，清除 edit text 视图中的任何文本表示新文件的创建。编译并运行应用程序并选择 New 按钮。Storage\
  \ Access Framework 随后应显示“保存到”存储的选择器界面，如图 70-2 所示。此时，应该可以在浏览器窗口中登录 Google Drive 账户并找到新创建的文件。如果文件缺失，请确保运行应用程序的\
  \ Android 设备已连接网络。Google Drive 应用可以通过 Google Play 商店下载，许多 Android 设备上已默认安装。\n\n\
  ### 70.7 保存到存储文件\n\n现在应用程序能够创建新的存储文件，下一步是添加将用户输入的文本保存到文件的能力。当用户选择 Save 按钮时，用户界面调用\
  \ `saveFile()` 方法。此方法启动类型为 `ACTION_OPEN_DOCUMENT` 的新 intent，会导致选择器界面出现，以便用户可以选择保存的文件。在识别了\
  \ `saveFile()` 方法的操作后，现在将其添加到 `MainActivity.java` 类中，如下：\n\n```java\npublic void\
  \ saveFile(View view) {\n    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  \    intent.addCategory(Intent.CATEGORY_OPENABLE);\n    intent.setType(\"text/plain\"\
  );\n    startActivityForResult(intent, SAVE_REQUEST_CODE);\n}\n```\n\n由于 `SAVE_REQUEST_CODE`\
  \ 通过 intent 传递，现在必须扩展 `onActivityResult()` 方法来处理保存操作：\n\n```java\npublic void onActivityResult(int\
  \ requestCode, int resultCode, Intent resultData) {\n    Uri currentUri = null;\n\
  \    if (resultCode == Activity.RESULT_OK) {\n        if (requestCode == CREATE_REQUEST_CODE)\
  \ {\n            if (resultData != null) {\n                textView.setText(\"\"\
  );\n            }\n        } else if (requestCode == SAVE_REQUEST_CODE) {\n    \
  \        if (resultData != null) {\n                currentUri = resultData.getData();\n\
  \                writeFileContent(currentUri);\n            }\n        }\n    }\n\
  }\n```\n\n该方法现在检查保存请求码，提取用户在选择器中选择的 `Uri` 并调用名为 `writeFileContent()` 的方法。在 `MainActivity.java`\
  \ 文件中实现此方法以便读取：\n\n```java\npackage com.ebookfzy.storagedemo;\nimport java.io.FileNotFoundException;\n\
  import java.io.FileOutputStream;\nimport java.io.IOException;\nimport android.app.Activity;\n\
  import android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\nimport\
  \ android.widget.EditText;\nimport android.content.Intent;\nimport android.view.View;\n\
  import android.net.Uri;\nimport android.os.ParcelFileDescriptor;\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private void writeFileContent(Uri uri) {\n  \
  \      try {\n            ParcelFileDescriptor pfd = this.getContentResolver().openFileDescriptor(uri,\
  \ \"w\");\n            FileOutputStream fileOutputStream = new FileOutputStream(pfd.getFileDescriptor());\n\
  \            String textContent = textView.getText().toString();\n            fileOutputStream.write(textContent.getBytes());\n\
  \            fileOutputStream.close();\n            pfd.close();\n        } catch\
  \ (FileNotFoundException e) {\n            e.printStackTrace();\n        } catch\
  \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\
  \n# 70.8 打开并读取存储文件\n\n在编写了创建和保存文本文件的代码后，最后的任务是添加从存储器打开和读取文件的功能。这将编写 `openFile()`\
  \ onClick 事件处理方法并实现它，以启动 `ACTION_OPEN_DOCUMENT` intent：\n\n```java\npublic void\
  \ openFile(View view) {\n    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  \    intent.addCategory(Intent.CATEGORY_OPENABLE);\n    intent.setType(\"text/plain\"\
  );\n    startActivityForResult(intent, OPEN_REQUEST_CODE);\n}\n```\n\n由于 intent\
  \ 传递了 `SAVE_REQUEST_CODE`，`onActivityResult()` 方法现在必须扩展以处理保存操作：\n\n```java\npublic\
  \ void onActivityResult(int requestCode, int resultCode, Intent resultData) {\n\
  \    Uri currentUri = null;\n    if (resultCode == Activity.RESULT_OK) {\n     \
  \   if (requestCode == CREATE_REQUEST_CODE) {\n            if (resultData != null)\
  \ {\n                textView.setText(\"\");\n            }\n        } else if (requestCode\
  \ == SAVE_REQUEST_CODE) {\n            if (resultData != null) {\n             \
  \   currentUri = resultData.getData();\n                writeFileContent(currentUri);\n\
  \            }\n        }\n    }\n}\n```\n\n该方法现在检查保存请求码，提取用户在选择器中选择的 `Uri` 并调用名为\
  \ `writeFileContent()` 的方法。在 `MainActivity.java` 文件中实现此方法以便读取：\n\n```java\npackage\
  \ com.ebookfzy.storagedemo;\nimport java.io.FileNotFoundException;\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\nimport android.app.Activity;\nimport android.support.v7.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.widget.EditText;\nimport android.content.Intent;\n\
  import android.view.View;\nimport android.net.Uri;\nimport android.os.ParcelFileDescriptor;\n\
  public class MainActivity extends AppCompatActivity {\n    private void writeFileContent(Uri\
  \ uri) {\n        try {\n            ParcelFileDescriptor pfd = this.getContentResolver().openFileDescriptor(uri,\
  \ \"w\");\n            FileOutputStream fileOutputStream = new FileOutputStream(pfd.getFileDescriptor());\n\
  \            String textContent = textView.getText().toString();\n            fileOutputStream.write(textContent.getBytes());\n\
  \            fileOutputStream.close();\n            pfd.close();\n        } catch\
  \ (FileNotFoundException e) {\n            e.printStackTrace();\n        } catch\
