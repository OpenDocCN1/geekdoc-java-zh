  +landmark.getID());\n            Intent intent = new Intent(Intent.ACTION_VIEW,\
  \ uri);\n            startActivity(intent);\n        } else {\n            titleText.setText(\"\
  No Match\");\n        }\n    }\n```\n\n这种技术的优点是不需要编写代码来识别如何启动活动，但缺点是除非应用链接与网站关联，否则可能会触发如图\
