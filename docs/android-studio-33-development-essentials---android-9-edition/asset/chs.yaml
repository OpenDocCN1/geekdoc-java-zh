  \ `AndroidManifest.xml` 文件：![](img/image16236.jpg) 图 82-7\n\n## 82.6 添加意图处理代码\n\n\
  到为止为止的操作确保了在响应格式正确的应用链接 URL 时会启动正确的活动。下一步是在 `LandmarkActivity` 类中处理意图（intent），以便从数据库中提取正确的记录并显示给用户。在修改\
  \ `LandmarkActivity.java` 文件中的任何代码之前，回顾现有代码的某些区域是值得的。在代码编辑器中打开 `LandmarkActivity.java`\
  \ 文件，并找到 `onCreate()` 和 `handleIntent()` 方法，它们目前的内容如下：\n\n```java\n@Override\nprotected\
  \ void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_landmark);\n    titleText = findViewById(R.id.titleText);\n\
  \    descriptionText = findViewById(R.id.descriptionText);\n    deleteButton = findViewById(R.id.deleteButton);\n\
  \    handleIntent(getIntent());\n}\nprivate void handleIntent(Intent intent) {\n\
