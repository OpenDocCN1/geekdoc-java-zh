  \n### 39.4 获取导航控制器\n从一个目的地导航到另一个通常响应应用内的某种事件，例如按钮点击或菜单选择。在触发导航操作之前，代码必须首先获取导航控制器的实例引用。这需要调用\
  \ `Navigation` 或 `NavHostFragment` 类的 `findNavController()` 方法。例如，可以使用以下代码访问活动的导航控制器：注意为了为了代码工作，活动必须包含导航主机\
  \ fragment：\n\n```java\nNavController controller = Navigation.findNavController(activity,\
  \ R.id.demo_nav_host_fragment);\n```\n\n在这种情况下，方法调用传递了活动的引用和嵌入活动布局的 `NavHostFragment`\
  \ 的 `id`。或者，与任何视图相关的导航控制器可以通过将该视图传递给方法来标识：\n\n```java\nButton button = getView().findViewById(R.id.button);\n\
  NavController controller = Navigation.findNavController(button);\n```\n\n最后的选项是通过调用\
  \ `NavHostFragment` 类的 `findNavController()` 方法来查找 fragment 的导航控制器，传递 fragment 的引用：\n\
  \n```java\nNavController controller = NavHostFragment.findNavController(fragment);\n\
  ```\n\n### 39.5 触发导航操作\n一旦找到导航控制器，通过调用控制器的 `navigate()` 方法并传递要执行的操作资源 ID 来触发导航操作。例如：\n\
  \n```java\ncontroller.navigate(R.id.goToContacts);\n```\n\n当选择操作连接时，图编辑器的 `Attributes`\
  \ 面板定义了操作的 `id`。\n\n### 39.6 传递参数\n在导航操作期间，可以使用图文件中声明的参数将数据从一个目的地传递到另一个。参数由名称、类型和可选的默认值组成，可以在\
  \ XML 中手动添加，也可以在选择操作或目的地时使用 `Attributes` 面板。例如，图 38-6 中声明了一个名为 `contactsCount` 的整数参数，默认值为\
  \ 0：\n\nimage7004.jpg)\n图 38-6\n\n一旦添加，参数放置在接收目的地的 XML 元素中，例如：\n\n```xml\n<fragment\n\
  \    android:id=\"@+id/secondFragment\"\n    name=\"com.ebookrenzy.navigationdemo.SecondFragment\"\
  \n    android:label=\"fragment_second\"\n    tools:layout=\"@layout/fragment_second\"\
  >\n    <argument\n        android:name=\"contactsCount\"\n        android:defaultValue=\"\
  0\"\n        app:type=\"integer\" />\n</fragment>\n```\n\nNavigation Architecture\
  \ 组件提供了在目的地之间传递数据的技术。一种方法是将数据放入 `Bundle` 对象并在操作期间传递到目的地，然后在目的地被解包。这种方法的主要缺点是不是“类型安全的”。也就是说，如果接收目的地将参数视为与声明不同的类型（例如将字符串视为整数），编译器不会捕获此错误，可能会在运行时产生问题。更好的选项是使用\
  \ `safeargs`。`safeargs` 是 Android 构建系统的一个插件，它允许以类型安全的方式传递参数。`safeargs` 参数传递方法将在下一章描述并演示（Android\
  \ Jetpack Navigation）。\n\n### 38.7 总结\n在 Android 应用的上下文中，“导航”是指用户在不同屏幕之间移动的能力。一旦耗时实现且难以组织，Android\
  \ Studio 和 Navigation Architecture 组件使得在应用内实现导航变得更容易。应用内的不同屏幕被称为目的地，通常由 fragment\
  \ 或活动表示。所有应用都有在应用首次加载时显示的主屏幕。此布局的内容区域被导航主机 fragment 替换，并在用户导航时交换其他目的地。导航路径由导航图文件定义，由连接它们的目的地和操作组成。导航由导航控制器处理，除了管理导航栈外，还提供了从应用内部启动导航操作的方法。\n\
  \n## 39. Android Jetpack Navigation 组件教程\n上一章描述了 Android Jetpack Navigation 组件以及它如何与\
  \ Android Studio 的绘图功能集成，为应用屏幕之间的导航提供简单的方法。在本章将创建一个 Android Studio 项目，利用这些导航功能实现一个包含多个屏幕的简单应用。除了演示\
  \ Android 导航图编辑器外，示例项目还将使用类型安全的参数在源和目的地之间传递数据。\n\n### 39.1 创建导航项目\n从欢迎界面选择 `Start\
  \ a new Android Studio project` 快速启动选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Add No Activity`\
  \ 模板。\n\n在 `Name` 字段输入 `NavigationDemo` 并指定 `com.ebookfrenzy.navigationdemo` 为包名。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26`：Android 8.0 (Oreo)，并将 `Language`\
  \ 菜单更改为 `Java`。\n\n在 `Project` 工具窗口中找到 `app` -> `java` -> `com.ebookrenzy.navigationdemo`\
  \ 条目，右键点击它并在弹出的菜单中选择 `New` -> `Activity` -> `Fragment + ViewModel`。在 `New Android\
  \ Activity` 对话框中，启用 `Launcher Activity` 选项，将源语言更改为 `Java` 并点击 `Finish` 按钮创建活动类，其余字段将设置为默认值。\n\
  \n### 39.2 在构建配置中添加导航\n新的 Android Studio 项目默认不会在构建文件中包含导航组件库。因此，在执行任何其他任务之前，第一步是修改应用级的\
  \ `build.gradle` 文件。在项目工具窗口找到该文件（`Gradle Scripts` -> `build.gradle (Module: app)`），双击它将其加载到代码编辑器中，并修改\
  \ `dependencies` 部分以添加导航库：\n\n```gradle\ndependencies {\n    implementation \"android.arch.navigation:navigation-fragment:1.0.0-alpha07\"\
  \n    implementation \"android.arch.navigation:navigation-ui:1.0.0-alpha07\"\n}\n\
  ```\n\n注意自本书出版以来可能发布了这些库的新版本。要查找最新版本，请参考以下 URL：https://developer.android.com/topic/libraries/architecture/adding-components#navigation\n\
  \n在文件中添加导航依赖后，点击 `Sync Now` 链接重新同步项目的构建配置。\n\n### 39.3 创建导航图资源文件\n在构建配置中添加导航库后，现在可以将导航图资源文件添加到项目中了。如\
  \ Navigation Architecture 组件的概述所示，这是一个包含用户可以导航的 fragment 和活动的 XML 文件，连同执行转换的操作以及目的地之间传递的数据。\n\
  \n在 `Project` 工具窗口中找到 `res` 文件夹（`app` -> `res`），右键点击它并选择 `New` -> `Android Resource\
  \ File`：\n\nimage7053.jpg)\n图 39-1\n\n选择菜单项后，会出现 `New Resource File` 对话框。在此对话框中，将文件命名为\
  \ `navigation_graph` 并将 `Resource type` 设置为 `Navigation`，如图 39-2 所示，在点击 `OK` 按钮之前创建文件。如果\
  \ `Navigation` 类型不可用，选择 `File` -> `Settings`（macOS 为 `Preferences`），显示屏幕并开启 `Enable\
  \ Navigation Editor` 选项。\n\nimage7059.jpg)\n图 39-2\n\n导航图资源文件添加到项目后，它将出现在 `main`\
  \ 面板中，准备好新的目的地。将编辑器切换到 `Text` 模式并在添加任何目的地之前查看 XML：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android/tools\"\n    android:id=\"@+id/navigation_graph\"></navigation>\n\
  ```\n\n切换回编辑器的 `Design` 模式，注意 `Destinations` 面板显示项目内没有主机 fragment：\n\nimage7071.jpg)\n\
  图 39-3\n\n### 39.4 声明导航主机\n对于此项目，导航主机 fragment 将包含在活动的用户界面布局中，作为用户导航的目的地的占位符。在 `Project`\
  \ 工具窗口中找到活动布局文件（`app` -> `res` -> `layout` -> `main_activity.xml`）并将其加载到布局编辑器。\n\
  \n在布局编辑器的 `Design` 模式下，从 `Palette` 的 `Containers` 部分拖入 `NavHostFragment` 元素，将其放置到活动布局的\
  \ `container` 区域，如[图 39-4]所示：\n\nimage7080.jpg)\n图 39-4\n\n选择菜单项后，会出现 `New Resource\
  \ File` 对话框。在此对话框中，将文件命名为 `navigation_graph` 并将 `Resource type` 设置为 `Navigation`，如图\
  \ 39-2 所示，在点击 `OK` 按钮之前创建文件。如果 `Navigation` 类型不可用，选择 `File` -> `Settings`（macOS\
  \ 为 `Preferences`），显示屏幕并开启 `Enable Navigation Editor` 选项。\n\nimage7059.jpg)\n图 39-2\n\
  \n导航图资源文件添加到项目后，它将出现在 `main` 面板中，准备好新的目的地。将编辑器切换到 `Text` 模式并在添加任何目的地之前查看 XML：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android/tools\"\n    android:id=\"@+id/navigation_graph\"\
  ></navigation>\n```\n\n### 38.3 导航图\n导航图是一个 XML 文件，包含了包含在应用中的目的地。这些目的地外，文件还包含定义目的地之间导航的操作，以及从一个目的地传递到另一个目的地的可选参数。Android\
  \ Studio 包含一个导航图编辑器，可以使用可视化方式或手动编辑 XML 来设计图表。图 38-5 显示了设计模式下的导航图：\n\nimage6957.jpg)\n\
  图 38-5\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android/tools\"\n    android:id=\"@+id/navigation_graph\"\
  \n    app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        name=\"com.ebookrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"main_fragment\"\n        tools:layout=\"@layout/main_fragment\"\
  >\n        <action\n            android:id=\"@+id/mainToSecond\"\n            app:destination=\"\
  @id/secondFragment\" />\n    </fragment>\n    <fragment\n        android:id=\"@+id/secondFragment\"\
  \n        name=\"com.ebookrenzy.navigationdemo.SecondFragment\"\n        android:label=\"\
  fragment_second\"\n        tools:layout=\"@layout/fragment_second\" />\n</navigation>\n\
  ```\n\n如果需要，导航图也可以拆分为多个文件以改进组织并促进重用。通过这种结构方式，嵌套图被嵌入到根图中。要创建嵌套图，只需 shift 点击要嵌套的目的地，右键点击第一个目的地并选择\
  \ `Move to Nested Graph` -> `New Graph` 选项。嵌套图将作为图中的新节点出现。要访问嵌套图，只需双击嵌套图节点将图文件加载到编辑器。\n\
  \n### 38.4 获取导航控制器\n从一个目的地导航到另一个通常响应应用内的某种事件，例如按钮点击或菜单选择。在触发导航操作之前，代码必须首先获取导航控制器的实例引用。这需要调用\
  \ `Navigation` 或 `NavHostFragment` 类的 `findNavController()` 方法。例如，可以使用以下代码访问活动的导航控制器：注意为了让代码工作，活动必须包含导航主机\
  \ fragment：\n\n```java\nNavController controller = Navigation.findNavController(activity,\
  \ R.id.demo_nav_host_fragment);\n```\n\n在这种情况下，方法调用传递了活动的引用和嵌入活动布局的 `NavHostFragment`\
  \ 的 `id`。或者，与任何视图相关的导航控制器可以通过将该视图传递给方法来标识：\n\n```java\nButton button = getView().findViewById(R.id.button);\n\
  NavController controller = Navigation.findNavController(button);\n```\n\n最后的选项是通过调用\
  \ `NavHostFragment` 类的 `findNavController()` 方法来查找 fragment 的导航控制器，传递 fragment 的引用：\n\
  \n```java\nNavController controller = NavHostFragment.findNavController(fragment);\n\
  ```\n\n### 38.5 触发导航操作\n一旦找到导航控制器，通过调用控制器的 `navigate()` 方法并传递要执行的操作资源 ID 来触发导航操作。例如：\n\
  \n```java\ncontroller.navigate(R.id.goToContacts);\n```\n\n当选择操作连接时，图编辑器的 `Attributes`\
  \ 面板定义了操作的 `id`。\n\n### 38.6 传递参数\n在导航操作期间，可以使用图文件中声明的参数将数据从一个目的地传递到另一个。参数由名称、类型和可选的默认值组成，可以在\
  \ XML 中手动添加，也可以在选择操作或目的地时使用 `Attributes` 面板。例如，图 38-6 中声明了一个名为 `contactsCount` 的整数参数，默认值为\
  \ 0：\n\nimage7004.jpg)\n图 38-6\n\n一旦添加，参数放置在接收目的地的 XML 元素中，例如：\n\n```xml\n<fragment\n\
  \    android:id=\"@+id/secondFragment\"\n    name=\"com.ebookrenzy.navigationdemo.SecondFragment\"\
  \n    android:label=\"fragment_second\"\n    tools:layout=\"@layout/fragment_second\"\
  >\n    <argument\n        android:name=\"contactsCount\"\n        android:defaultValue=\"\
  0\"\n        app:type=\"integer\" />\n</fragment>\n```\n\n\n\n\n\n- `MainFragmentDirections`\
  \ - 此类表示导航动作的起点（命名方式为导航起点的类名并在末尾添加“Directions”），并提供对动作对象的访问权限。\n\n- `ActionMainToSecond`\
  \ - 此类表示执行转换时使用的动作（命名基于在导航图文件中分配给动作的 ID，并在开头添加前缀“Action”）。该类为目标地上配置的每个参数都包含了一个设置方法（setter\
  \ method）。例如，由于第二个片段目标地包含一个名为 `message` 的参数，该类就包含一个名为 `setMessage()` 的方法。配置完成后，该类的实例将被传递给导航控制器的\
  \ `navigate()` 方法，以跳转到目标地。\n\n- `SecondFragmentArgs` - 此类在目标片段中使用，用于访问从起点传递的参数（命名方式为导航目的地的类名并在末尾添加“Args”）。该类为每个传递到目的地的参数都包含了一个获取方法（getter\
  \ method），例如 `getMessage()`。\n\n\n\n\n使用这些类，可以对 `MainFragment.java` 文件中 `onActivityCreated()`\
  \ 方法内的 `onClickListener` 代码进行如下修改，以从 `EditText` 控件提取当前文本，将其应用于操作并启动到第二个 fragment\
  \ 的跳转：\n\n```java\nimport android.widget.EditText;\nbutton.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        EditText userText = getView().findViewById(R.id.userText);\n        MainFragmentDirections.MainToSecond\
  \ action = MainFragmentDirections.mainToSecond();\n        action.setMessage(userText.getText().toString());\n\
  \        Navigation.findNavController(view).navigate(action);\n    }\n});\n```\n\
  \n上述代码获取 action 对象的引用，使用 `setMessage()` 方法设置消息参数字符串，然后调用导航控制器的 `navigate()` 方法并传递\
  \ action 对象。剩下的工作是修改 `SecondFragment.java` 类文件，在导航执行后接收参数并将其显示在 `TextView` 控件上。在本示例中，将使用\
  \ `onStart()` 周期方法添加实现这些任务的代码。编辑 `SecondFragment.java` 文件并添加此方法，使其内容如下：\n\n```java\n\
  import android.widget.TextView;\n@Override\npublic void onStart() {\n    super.onStart();\n\
  \    TextView argText = getView().findViewById(R.id.argText);\n    SecondFragmentArgs\
  \ args = SecondFragmentArgs.fromBundle(getArguments());\n    String message = args.getMessage();\n\
  \    argText.setText(message);\n}\n```\n\n上述方法代码首先获取 `TextView` 控件的引用。接下来，调用 `SecondFragmentArgs`\
  \ 类的 `fromBundle()` 方法提取从源接收到的 `SecondFragmentArgs` 对象。由于此示例中的参数在 `navigation_graph.xml`\
  \ 文件中名为 `message`，因此在 `args` 对象上调用相应的 `getMessage()` 方法来获取字符串值。然后将该字符串显示在 `TextView`\
  \ 控件上。编译并运行应用，在点击 `Button` 控件之前输入文本。当第二个 fragment 目标出现时，`TextView` 现在应该显示在主 fragment\
  \ 中输入的文本，这表明数据已在导航目标之间成功传递。\n\n### 39.11 总结\n本章提供了一个实用示例，展示了如何使用导航架构组件（Navigation\
  \ Architecture Component）结合 Android Studio 导航图编辑器实现 Android 应用导航。涵盖的主题包括创建包含现有和新目标\
  \ fragment 的导航图、在 activity 布局中嵌入导航主机 fragment（navigation host fragment）、编写触发导航事件的代码，以及使用\
  \ Gradle `safeargs` 插件在目标之间传递参数。\n\n# 40. 在 Android 上创建和管理溢出菜单\n本书尚未涵盖的一个用户界面设计领域涉及\
  \ Android 应用程序中的菜单概念。菜单提供了一种机制，可以在用户界面布局中存在的视图组件之外为用户提供额外的选择。虽然 Android 应用开发者可以使用多种不同的菜单系统，但本章将重点介绍更常用的溢出菜单（Overflow\
  \ menu）。本章将涵盖通过 XML 手动创建菜单以及使用 Android Studio 布局编辑器可视化地创建菜单。\n\n### 40.1 溢出菜单\n\
  溢出菜单（也称为选项菜单 options menu）是用户可以通过设备屏幕访问的菜单，它允许开发者包含应用程序用户界面中之外的其他应用程序选项。溢出菜单的位置取决于设备上运行的\
  \ Android 版本。从 Android 4.0 及更高版本开始，溢出菜单按钮位于操作栏（action toolbar）的右上角，表现为三个正方形堆叠的图标：\n\
  \n![](img/image7358.jpg)\n图 40-1\n\n### 40.2 创建溢出菜单\n菜单中的项可以在 XML 文件中声明，然后根据需要将其加载并显示给用户。这涉及使用\
  \ `<menu>` 元素，每个菜单项包含一个 `<item>` 子元素。例如，以下 XML 定义了一个由两个与颜色选择项组成的菜单：\n\n```xml\n\
  <menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    tools:context=\".MainActivity\">\n    <item android:id=\"@+id/menu_red\"\n\
  \        android:priority=\"1\"\n        app:showAsAction=\"never\"\n        android:title=\"\
  @string/red_string\"/>\n    <item android:id=\"@+id/menu_green\"\n        android:priority=\"\
  2\"\n        app:showAsAction=\"never\"\n        android:title=\"@string/green_string\"\
  />\n</menu>\n```\n\n在上面的 XML 中，`android:priority` 属性规定了菜单显示时项在菜单中出现的顺序。相反，`app:showAsAction`\
  \ 属性控制了对应项作为操作栏（action bar）本身中的项出现的条件。例如，如果设置为 `ifRoom`，当空间足够时，该项将出现在操作栏中。\n\n![](img/image7382.jpg)\n\
  图 40-2\n\n应节制使用此属性，以避免操作栏过于拥挤。默认情况下，在创建新的 Android 应用项目时，Android Studio 会创建一个菜单 XML\
  \ 文件。该文件位于 `app -> res -> menu` 项目文件夹中，包含一个名为“Settings”的单个菜单项：\n\n```xml\n<menu\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    tools:context=\".MainActivity\">\n    <item android:id=\"@+id/action_settings\"\
  \n        android:priority=\"0\"\n        app:showAsAction=\"never\"/>\n</menu>\n\
  ```\n\n此菜单已配置为在应用运行时当用户选择溢出菜单时显示，只需根据需要修改此处即可。\n\n### 40.3 显示溢出菜单\n溢出菜单是通过重写相应 activity\
  \ 的 `onCreateOptionsMenu()` 方法并加载菜单的 XML 文件创建的。例如，以下代码在名为 `menu_main` 的 XML 文件中的菜单：\n\
  \n```java\n@Override\npublic boolean onCreateOptionsMenu(Menu menu) {\n    getMenuInflater().inflate(R.menu.menu_main,\
  \ menu);\n    return true;\n}\n```\n\n作为 XML 文件，Android Studio 在新创建的 Android 应用的主\
  \ activity 中重写了此方法。如果 activity 不需要溢出菜单，请删除或注释掉此方法。\n\n### 40.4 响应菜单选择\n一旦实现了菜单，问题变为应用程序如何在用户选择菜单项时接收通知。activity\
  \ 只需要重写 `onOptionsItemSelected()` 方法。传递给此方法的参数是被选中菜单项的引用。可以在项上调用 `getItemId()` 方法来获取\
  \ ID，例如：\n\n```java\n@Override\npublic boolean onOptionsItemSelected(MenuItem item)\
  \ {\n    switch (item.getItemId()) {\n        case R.id.menu_red:\n            //\
  \ 选择了红色项\n            return true;\n        case R.id.menu_green:\n            //\
  \ 选择了绿色项\n            return true;\n        default:\n            return super.onOptionsItemSelected(item);\n\
  \    }\n}\n```\n\n### 40.5 创建可检查项组\n除了配置独立的菜单项，还可以创建菜单项组。这在创建一次只能选择多个选择之一的可检查菜单项时特别有用。可以通过将菜单项封装在\
  \ `<group>` 标签中将其分配给组。使用 `android:checkableBehavior` 属性声明组的可检查，将其设置为 `single`、`all`\
  \ 或 `none`。以下 XML 声明两个菜单项组成一个组，其中任何时间只能一项：\n\n```xml\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\">\n    <group android:checkableBehavior=\"\
  single\">\n        <item android:id=\"@+id/menu_red\" android:title=\"@string/red_string\"\
  />\n        <item android:id=\"@+id/menu_green\" android:title=\"@string/green_string\"\
  />\n    </group>\n</menu>\n```\n\n当菜单组被配置为可检查时，菜单中的项旁边会出现一个小圆圈，如图 40-3 所示。重要的是，此指示的设置和取消不会自动发生。因此，检查和取消标记菜单项是应用程序的责任。\n\
  \n![](img/7436.jpg)\n图 40-3\n\n继续本章之前使用的颜色示例，其实现如下：\n\n```java\n@Override\npublic\
  \ boolean onOptionsItemSelected(MenuItem item) {\n    switch (item.getItemId())\
  \ {\n        case R.id.menu_red:\n            if (item.isChecked()) item.setChecked(false);\n\
  \            else item.setChecked(true);\n            return true;\n        case\
  \ R.id.menu_green:\n            if (item.isChecked()) item.setChecked(false);\n\
  \            else item.setChecked(true);\n            return true;\n        default:\n\
  \            return super.onOptionsItemSelected(item);\n    }\n}\n```\n\n### 40.6\
  \ 菜单与 Android Studio 菜单编辑器\nAndroid Studio 允许通过将菜单资源文件加载到菜单编辑器工具、从调色板拖放菜单元素并设置属性来可视化地设计菜单。这极大地简化了菜单设计过程，但重要的是，仍然需要在\
  \ `onOptionsItemSelected()` 方法中编写代码以实现菜单行为。\n\n要可视化地设计菜单，找到菜单资源文件并双击它将其加载到菜单编辑器工具。例如，图\
  \ 40-4 显示了加载到菜单编辑器的基础 activity 的默认菜单资源文件：\n\n![](img/7460.jpg)\n图 40-4\n\n调色板 (A)\
  \ 包含可以添加到设计区域 (C) 菜单中的项。组件树 (B) 是识别菜单层次结构的工具。属性面板 (D) 包含当前选中项的常用属性子集。“查看所有属性”链接\
  \ (E) 可用于访问完整的属性列表。可以通过将对象拖放到布局画布或组件树上向菜单中添加新元素。当在布局编辑器工具中处理菜单时，有时将项拖到组件树上会更简单，因为这对项在树中的放置位置提供了更大的控制。这在向组添加项时特别有用。\n\
  \n尽管菜单编辑器提供了构建菜单的可视化方法，但底层菜单仍然存储在 XML 格式中，可以通过上图中标记为 F 的标签页手动查看和编辑。\n\n### 40.7\
  \ 创建项目\n要查看溢出菜单的作用，从欢迎屏幕选择 Start a new Android project，在生成的新项目对话框中选择 Basic Activity\
  \ 模板。在 Name 字段输入 Example 并指定 `ebookrenzy.menueample` 为包名。点击 Finish 按钮之前，将 Minimum\
  \ API level 设置为 26 (Android 8.0)，语言选择 Java。项目完成后，导航到项目窗口中的 `app -> res -> layout`\
  \ 文件夹并双击 `content_main.xml` 文件将其加载到 Android 编辑器。切换到 Design 模式，从组件树面板选择 ConstraintLayout\
  \ 并在 ID 字段中输入 `layoutView`。\n\n### 40.8 设计菜单\n在项目窗口中，找到项目的 `app -> res -> menu ->\
  \ menu_main.xml` 文件并双击将其加载到布局工具。如有必要，切换到 Design 模式并删除 Android Studio 添加的默认菜单项，以便菜单没有项。从调色板点击并将一个\
  \ group 对象拖到图 40-5 所示的布局标题栏上。\n\n![](img/7475.jpg)\n图 40-5\n\n尽管 group 项已添加，但它在布局中是不可见的。要验证元素的存在，参考组件树面板：选择\
  \ group 条目，并在属性面板将 `checkableBehavior` 属性设置为 `single`，以便一组菜单项可以随时被选中：\n\n![](img/7481.jpg)\n\
  图 40-6\n\n接下来，从调色板拖入四个 Menu Item 元素到组件树中的 group 元素上。选择第一项并使用属性面板将标题改为“Red”，将 ID\
  \ 改为 `menu_red`：\n\n![](img/7493.jpg)\n图 40-7\n\n对剩余三个项重复这些步骤，将标题设置为“Green”、“Yellow”和“Blue”，对应的\
  \ ID 为 `menu_green`、`menu_yellow` 和 `menu_blue`。使用组件树面板中菜单项右侧的按钮提取字符串：\n\n![](img/7498.jpg)\n\
  图 40-8\n\n完成这些步骤后，菜单布局应与图 40-9 所示：\n\n![](img/7504.jpg)\n图 40-9\n\n将布局编辑器切换到 Text\
  \ 模式并检查菜单的 XML 表示，它应该如下：\n\n```xml\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    tools:context=\"com.ebookrenzy.menueample.MainActivity\"\
  >\n    <group android:checkableBehavior=\"single\">\n        <item android:id=\"\
  @+id/menu_red\" android:title=\"@string/red_string\"/>\n        <item android:id=\"\
  @+id/menu_green\" android:title=\"@string/green_string\"/>\n        <item android:id=\"\
  @+id/menu_yellow\" android:title=\"@string/yellow_string\"/>\n        <item android:id=\"\
  @+id/menu_blue\" android:title=\"@string/blue_string\"/>\n    </group>\n</menu>\n\
  ```\n\n### 40.9 修改 onOptionsItemSelected() 方法\n从菜单中选择项时，将调用应用重写的 `onOptionsSelected()`\
  \ 方法。该方法的作用是识别选择了哪一项，并将布局视图的背景颜色改为相应的颜色。找到并双击 `app -> java -> com.ebookrenzy.menueample\
  \ -> MainActivity` 文件并进行如下修改：\n\n```java\npackage com.ebookrenzy.menueample;\n\n\
  import android.os.Bundle;\nimport android.support.design.widget.FloatingActionButton;\n\
  import android.support.design.widget.Snackbar;\nimport android.support.v7.app.AppCompatActivity;\n\
  import android.support.v7.widget.Toolbar;\nimport android.view.View;\nimport android.view.Menu;\n\
  import android.view.MenuItem;\nimport android.support.constraint.ConstraintLayout;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    @Override\n    public\
  \ boolean onOptionsItemSelected(MenuItem item) {\n        ConstraintLayout mainLayout\
  \ = findViewById(R.id.layoutView);\n        switch (item.getItemId()) {\n      \
  \      case R.id.menu_red:\n                if (item.isChecked()) item.setChecked(false);\n\
  \                else item.setChecked(true);\n                mainLayout.setBackgroundColor(android.graphics.Color.RED);\n\
  \                return true;\n            case R.id.menu_green:\n             \
  \   if (item.isChecked()) item.setChecked(false);\n                else item.setChecked(true);\n\
  \                mainLayout.setBackgroundColor(android.graphics.Color.GREEN);\n\
  \                return true;\n            case R.id.menu_yellow:\n            \
  \    if (item.isChecked()) item.setChecked(false);\n                else item.setChecked(true);\n\
  \                mainLayout.setBackgroundColor(android.graphics.Color.YELLOW);\n\
  \                return true;\n            case R.id.menu_blue:\n              \
  \  if (item.isChecked()) item.setChecked(false);\n                else item.setChecked(true);\n\
  \                mainLayout.setBackgroundColor(android.graphics.Color.BLUE);\n \
  \               return true;\n            default:\n                return super.onOptionsItemSelected(item);\n\
  \        }\n    }\n}\n```\n\n### 40.10 测试应用\n在模拟器或物理 Android 设备上构建并运行应用。使用溢出菜单，选择菜单项并验证布局背景颜色是否发生了相应的变化。注意，当前选中的颜色会显示。\n\
  \n\n\n\n在本章及后续章节中将演示，插值器可以在可以在代码和 XML 文件中指定。\n\n### 41.3 操作场景（Scene）\n\n场景可以用 Android\
  \ Studio XML 布局文件的内容来表示。例如，下面的 XML 可以表示一个在 `RelativeLayout` 父容器内包含三个按钮视图的场景：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<RelativeLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\" android:id=\"@+id/RelativeLayout1\"\
  \ android:layout_width=\"match_parent\"android:layout_height=\"match_parent\"android:orientation=\"\
  vertical\" >\n    <Button android:id=\"@+id/button1\" android:layout_width=\"wrap_content\"\
  \ android:layout_height=\"wrap_content\" android:layout_alignParentLeft=\"true\"\
  \ android:layout_alignParentTop=\"true\" android:onClick=\"goToScene2\" android:text=\"\
  @string/one_string\" />\n    <Button android:id=\"@+id/button2\" android:layout_width=\"\
  wrap_content\" android:layout_height=\"wrap_content\" android:layout_alignParentRight=\"\
  true\" android:layout_alignParentTop=\"true\" android:onClick=\"goToScene1\" android:text=\"\
  @string/two_string\" />\n    <Button android:id=\"@+id/button3\" android:layout_width=\"\
  wrap_content\" android:layout_height=\"wrap_content\" android:layout_centerHorizontal=\"\
  true\" android:layout_centerVertical=\"true\" android:text=\"@string/three_string\"\
  \ />\n</RelativeLayout>\n```\n\n假设上述布局位于项目 `res/layout` 文件夹下名为 `scene1_layout.xml`\
  \ 的文件中，可以使用 `Scene` 类的 `getSceneForLayout()` 方法将布局加载到场景中。例如：\n\n```java\nScene scene1\
  \ = Scene.getSceneForLayout(rootContainer,R.layout.scene1_layout, this);\n```\n\n\
  注意，该方法调用需要根容器的引用。该容器是要显示场景的视图层级结构顶部的视图。\n\n要在没有任何过渡动画的情况下向用户显示场景，可以在场景实例上调用 `enter()`\
  \ 方法：\n\n```java\nscene1.enter();\n```\n\n使用默认的 `AutoTransition` 类在两个场景之间进行切换可以通过\
  \ `TransitionManager` 类的 `go()` 方法触发：\n\n```java\nTransitionManager.go(scene2);\n\
  ```\n\n在代码中，可以通过将视图元素组合在一个或多个 `Views` 中并从这些组创建场景来轻松创建 `Scene` 实例。例如：\n\n```java\n\
  Scene scene1 = Scene(viewGroup1);\nScene scene2 = Scene(viewGroup2, viewGroup3);\n\
  ```\n\n### 41.4 代码中的自定义过渡和过渡集（TransitionSets）\n\n本章列出的示例使用了默认的过渡设置，其中尺寸缩放、淡入和运动是使用预配置的行为进行动画化的。可以通过创建自定义过渡来修改这些设置，然后在过渡过程中引用它们。动画被分为边界变化（change\
  \ bounds，与视图的位置和大小有关）和淡入（fade，与视图的可见性或其他状态有关）。\n\n可以如下创建一个单个的 `Transition`：\n\n\
  ```java\nTransition myChangeBounds = new ChangeBounds();\n```\n\n之后在执行过渡时，可以使用此新过渡：\n\
  \n```java\nTransitionManager.go(scene2, myChangeBounds);\n```\n\n可以将多个过渡组合成一个 `TransitionSet`\
  \ 实例。例如，下面的代码创建了一个包含边界变化和淡入过渡效果的新 `TransitionSet` 对象：\n\n```java\nTransitionSet\
  \ myTransition = new TransitionSet();\nmyTransition.addTransition(new ChangeBounds());\n\
  myTransition.addTransition(new Fade());\n```\n\n可以配置过渡以针对特定的视图（通过视图 ID 引用）。例如，下面的代码将之前的淡入过渡配置为仅针对\
  \ ID  `myButton1` 的视图：\n\n```java\nTransitionSet myTransition = new TransitionSet();\n\
  myTransition.addTransition(new ChangeBounds());\nTransition fade = new Fade();\n\
  fade.addTarget(R.id.myButton1);\nmyTransition.addTransition(fade);\n```\n\n过渡的其他方面也可以被自定义，例如动画的持续时间。下面的代码指定了执行动画持续的时间：\n\
  \n```java\nTransition changeBounds = new ChangeBounds();\nchangeBounds.setDuration(2000);\n\
  ```\n\n与 `Transition` 实例一样，一旦创建了 `TransitionSet` 实例，就可以通过 `TransitionManager` 类在过渡中使用。例如：\n\
  \n```java\nTransitionManager.go(scene1, myTransition);\n```\n\n### 41.5 XML 中的自定义过渡和过渡集\n\
  \n虽然自定义过渡可以在代码中实现，但通过 XML 过渡文件使用 `<fade>` 和 `<changeBounds>` 标签结合一些额外选项通常更为简单。下面的\
  \ XML 包含一个 `changeBounds` 过渡：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<changeBounds/>\n```\n\n与基于代码的过渡方法一样，资源文件中的每个过渡条目都可以被自定义。例如，下面的 XML 为边界变化过渡配置了持续时间：\n\
  \n```xml\n<changeBounds android:duration=\"5000\" >\n```\n\n可以使用 `<transitionSet>`\
  \ 元素将多个过渡组合：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<transitionSet\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\" >\n    <fade android:duration=\"\
  2000\" android:fadingMode=\"fade_out\" />\n    <changeBounds android:duration=\"\
  5000\" >\n        <targets><target android:id=\"@+id/button2\"/></targets>\n   \
  \ </changeBounds>\n    <fade android:duration=\"2000\" android:fadingMode=\"fade_in\"\
  \ />\n</transitionSet>\n```\n（注：此处 XML 示例根据上下文逻辑进行了补全，原文片段可能不完整）\n\n将值从 `sequential`\
  \ 改为 `together`，以表示以并行方式执行动画序列。\n\n### 41.6 操作插值器（Interpolator）\n\n如前所述，插值器可以通过多种方式修改过渡的行为，并可以在代码中指定，也可以通过过渡\
  \ XML 资源文件的设置进行指定。在代码工作时，可以通过调用所需插值器类的构造方法，并在需要时传递值来创建新的插值器实例：\n\n创建后，可以使用 `Transition`\
  \ 类的 `setInterpolator()` 方法将插值器实例附加到过渡。例如，下面的代码为边界变化过渡添加了弹性插值器：\n\n```java\nTransition\
  \ changeBounds = new ChangeBounds();\nchangeBounds.setInterpolator(new BounceInterpolator());\n\
  ```\n\n同样，下面的代码为同一过渡添加了加速插值器，并指定了 1.2 的加速因子：\n\n```java\nchangeBounds.setInterpolator(new\
  \ AccelerateInterpolator(1.2f));\n```\n\n对于 XML 类的过渡资源，使用以下语法声明默认插值器：\n\n`android:interpolator=\"\
  @android:anim/<interpolator_element>\"`\n\n在上述语法中，`<interpolator_element>` 必须替换为从列表中选择的相应插值器资源\
  \ ID：\n\n\n\n\n\n例如，下面的 XML 片段为包含过渡集（transition set）中的边界变化（change bounds）过渡添加了一个弹性插值器（bounce\
  \ interpolator）：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<transitionSet\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\" android:transitionOrdering=\"\
  sequential\">\n    <changeBounds android:interpolator=\"@android:anim/bounce_interpolator\"\
  \ android:duration=\"2000\" />\n    <fade android:duration=\"1000\" android:fadingMode=\"\
  fade_in\" />\n</transitionSet>\n```\n\n这种在 XML 资源中为过渡添加插值器的方法，在需要插值器默认行为时非常有效。但当需要更改插值器的默认行为时，任务就会变得复杂一些。以循环插值器（cycle\
  \ interpolator）为例，该插值器的目的是让动画或过渡重复指定的次数。在没有设置 `cycles` 属性的情况下，循环插值器将只执行一个循环。遗憾的是，在使用上述技术添加插值器时，无法直接指定循环次数（或任何其他插值器属性）。相反，必须创建一个自定义插值器，然后在过渡文件中引用它。\n\
  \n### 41.7 创建自定义插值器\n\n自定义插值器必须在单独的 XML 文件中声明，并存储在项目的 `res/anim` 文件夹中。XML 文件的名称将被\
  \ Android 系统用作自定义插值器的资源 ID。\n\n在自定义插值器 XML 资源文件中，语法应如下所示：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<interpolatorElement xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \ android:attribute =\"value \" />\n```\n\n在上述语法中，必须将 `interpolatorElement` 替换为从列表中选择所需的插值器元素名称：\n\
  \n- `accelerateDecelerateInterpolator`\n- `accelerateInterpolator`\n- `anticipateInterpolator`\n\
  - `anticipateOvershootInterpolator`\n- `bounceInterpolator`\n- `cycleInterpolator`\n\
  - `decelerateInterpolator`\n- `linearInterpolator`\n- `overshootInterpolator`\n\n\
  \n\n\n\n`attribute` 关键字将被替换为要更改其值的插值器的 `name` 属性（例如，通过 `tension` 更改 `overshoot interpolator`\
  \ 器的 `tension` 属性）。最后，`value` 代表要分配给指定属性的值。例如，下面的 XML 包含一个配置为循环 7 次的自定义循环插值器（cycle\
  \ interpolator）：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<cycleInterpolator\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\" android:cycles=\"\
  7\" />\n```\n\n假设上述 XML 存储在位于项目 `res/anim` 文件夹下名为 `my_cycle.xml` 的资源文件中，可以使用以下 XML\
  \ 语法将自定义插值器添加到过渡（transition）资源文件中：\n\n```xml\n<changeBounds xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \ android:duration=\"5000\" android:interpolator=\"@anim/my_cycle\" >\n```\n\n##\
  \ 41.8 使用 beginDelayedTransition 方法\n\nTransition 的用户界面动画最简单的形式可能涉及使用 `TransitionManager`\
  \ 类的 `beginDelayedTransition()` 方法。该方法接收一个代表需要动画场景的视图组（viewgroup）根视图的引用。随后对该子视图内视图的任何更改将使用默认过渡设置进行动画处理：\n\
  \n```java\nmyLayout = findViewById(R.id.myLayout);\nTransitionManager.beginDelayedTransition(myLayout);\n\
  // 在此处对场景进行更改\n```\n\n如果需要默认动画行为以外的行为，只需向方法调用传递一个配置适当的 `Transition` 或 `TransitionSet`\
  \ 实例即可：\n\n```java\nTransitionManager.beginDelayedTransition(myLayout, myTransition);\n\
  ```\n\n## 41.9 总结\n\nAndroid 4.4 KitKat SDK 版本引入了 Transition 框架，其目的是简化为构成 Android\
  \ 应用程序用户界面的视图添加动画的任务。通过一些简单的配置和几行代码，就可以利用 Transition 框架对视图的移动、可见性和大小调整等动画效果进行动画处理。有多种实现过渡的不同方法，涉及\
  \ Java 代码和 XML 资源文件的结合。通过使用一系列插值器（interpolators），还可以增强过渡的动画效果。\n\n在涵盖了 Android 过渡的一些理论后，接下来的两个章节将通过处理一些基于\
  \ Android Studio 的过渡实现示例，将这些理论付诸实践。\n\n## 42. 使用 beginDelayedTransition 的 Android\
  \ 过渡教程\n\n上一章标题为“使用 Android 过渡框架制作用户界面动画”，介绍了使用 Android 过渡框架进行用户界面动画。本章将采用基于教程的方法，使用\
  \ `TransitionManager` 类的 `beginDelayedTransition()` 方法演示 Android 过渡的应用。\n\n下一章将创建一个更复杂的示例，使用布局文件和过渡资源文件来制作应用程序内从一个场景到另一个场景的过渡。\n\
  \n### 42.1 创建 Android Studio TransitionDemo 项目\n\n从欢迎界面选择“Start a new Android Studio\
  \ project”快速启动选项，在生成的新项目对话框中，点击“Next” 按钮之前选择“Empty Activity”模板。\n\n在 `Name` 字段中输入\
  \ `TransitionDemo`，并指定 `com.ebookfrenzy.transitiondemo` 为包名。在点击“Finish” 按钮之前，将 `Minimum\
  \ API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为 `Java`。\n\n### 42.2 准备项目文件\n\
  \n第一个过渡动画将通过使用 `TransitionManager` 类的 `beginDelayedTransition()` 方法来实现。如果 Android\
  \ Studio 没有自动加载文件，请在 Project 工具窗口面板中找到并双击 `app -> res -> layout -> activity_main.xml`\
  \ 文件，将其加载到 Layout Editor 工具中。\n\n将 Layout Editor 切换到 Design（设计）模式，删除“Hello World!”\
  \ `TextView`，从 Layout Editor 调色板（palette）的 Widget 部分拖入一个 `Button`，并将其放置在设备屏幕布局的左上角。放置后，选择该按钮并使用\
  \ Attributes 工具窗口指定 `ID` 值为 `myButton`。在 Component Tree 工具窗口中选择 `ConstraintLayout`\
  \ 条目，并使用 Attributes 窗口将 `ID` 设置为 `myLayout`。\n\n### 42.3 实现 beginDelayedTransition\
  \ 动画\n\n本教程初始阶段的目标是实现一个触摸处理器，以便当用户点击布局视图时，按钮视图移动到屏幕的右下角。\n\n打开 `MainActivity.java`\
  \ 文件（位于 Project 工具窗口的 `app -> java -> com.ebookfrenzy.transitiondemo` 下），并修改 `onCreate()`\
  \ 方法以实现 `onTouch` 处理器：\n\n```java\npackage com.ebookfrenzy.transitiondemo;\nimport\
  \ android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\nimport android.support.constraint.ConstraintLayout;\n\
  import android.support.constraint.ConstraintSet;\nimport android.view.MotionEvent;\n\
  import android.widget.Button;\nimport android.view.View;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    ConstraintLayout myLayout;\n    @Override\n \
  \   protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_transition_demo);\n        myLayout =\
  \ findViewById(R.id.myLayout);\n        myLayout.setOnTouchListener(new ConstraintLayout.OnTouchListener()\
  \ {\n            public boolean onTouch(View v,MotionEvent m) {\n              \
  \  handleTouch();\n                return true;\n            }\n        });\n  \
  \  }\n```\n\n上述代码只是简单地在 `ConstraintLayout` 上设置了一个触摸监听器，并在检测到触摸时配置名为 `handleTouch()`\
  \ 的方法。因此，下一个任务是实现 `handleTouch()` 方法：\n\n```java\npublic void handleTouch() {\n\
  \    Button button = findViewById(R.id.myButton);\n    button.setMinimumWidth(500);\n\
  \    button.setMinimumHeight(350);\n    ConstraintSet set = new ConstraintSet();\n\
  \    set.connect(R.id.myButton, ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID, 0);\n\
  \    set.connect(R.id.myButton, ConstraintSet.RIGHT, ConstraintSet.PARENT_ID, 0);\n\
  \    set.constrainWidth(R.id.myButton, ConstraintSet.WRAP_CONTENT);\n    set.applyTo(myLayout);\n\
  }\n```\n\n此方法获取用户界面中按钮视图的引用，并设置新的宽高使按钮增大。然后创建一个 `ConstraintSet` 对象，并配置将按钮放置在父布局右下角的约束。将此约束应用于布局。\n\
  \n通过编译并运行应用程序来测试代码。启动后，触摸背景（而不是按钮），注意按钮是如何所示移动并调整大小的。虽然布局发生了变化，但它们瞬间发生的，没有任何动画。这就是调用\
  \ `TransitionManager` 类的 `beginDelayedTransition()` 方法的地方。要为此布局添加动画，只需在布局更改之前添加一行代码。在\
  \ `MainActivity.java` 文件中，修改代码如下：\n\n```java\nimport android.transition.TransitionManager;\n\
  // ...\npublic void handleTouch() {\n    TransitionManager.beginDelayedTransition(myLayout);\n\
  \    Button button = findViewById(R.id.myButton);\n    button.setMinimumWidth(500);\n\
  \    button.setMinimumHeight(350);\n    ConstraintSet set = new ConstraintSet();\n\
  \    set.connect(R.id.myButton, ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID, 0);\n\
  \    set.connect(R.id.myButton, ConstraintSet.RIGHT, ConstraintSet.PARENT_ID, 0);\n\
  \    set.constrainWidth(R.id.myButton, ConstraintSet.WRAP_CONTENT);\n    set.applyTo(myLayout);\n\
  }\n```\n\n再次编译并运行应用程序，注意过渡现在是动画化的。\n\n### 42.4 自定义过渡\n\n本示例的最后一个任务是修改 `changeBounds`\
  \ 过渡，使其在较长的持续时间内执行，并在视图到达新位置时包含弹跳效果。这涉及到创建一个带有适当持续插值器的 `Transition` 实例，并将其作为参数传递给\
  \ `beginDelayedTransition()` 方法：\n\n```java\nimport android.transition.ChangeBounds;\n\
  import android.transition.Transition;\nimport android.view.animation.BounceInterpolator;\n\
  // ...\npublic void handleTouch() {\n    Button button = findViewById(R.id.myButton);\n\
  \    Transition changeBounds = new ChangeBounds();\n    changeBounds.setDuration(3000);\n\
  \    changeBounds.setInterpolator(new BounceInterpolator());\n    TransitionManager.beginDelayedTransition(myLayout,changeBounds);\n\
  \    TransitionManager.beginDelayedTransition(myLayout);\n}\n```\n\n现在执行应用程序，动画将减慢以匹配新的时长设置，按钮将在到达显示右下角时弹跳。\n\
  \n### 42.5 总结\n\n最基本的过渡动画形式涉及使用 `TransitionManager` 类的 `beginDelayedTransition()`\
  \ 方法。一旦调用，定义视图组内在一个用户界面帧中视图的大小和位置的任何更改将使用指定的过渡进行动画处理。本章通过一个简单的 Android Studio 示例，演示了这种实现过渡的方法。\n\
  \n## 43. 实现 Android 场景过渡 – 教程\n\n本章将通过创建一个演示使用 Android 过渡框架从一个场景过渡到另一个场景的项目，建立在“使用\
  \ Android 过渡框架制作用户界面”章节中概述的理论之上。\n\n### 43.1 场景过渡项目概述\n\n在本章创建的应用程序将包含两个场景，每个场景由一个\
  \ XML 布局资源文件表示。然后将使用过渡制作从一个场景到另一个场景的变化。第一个场景将包含三个按钮视图。第二个场景将包含第一个场景中的两个按钮，它们位于屏幕上的不同位置。第二个场景将缺少第三个按钮。一旦实现了过渡，前两个按钮的移动将带有弹跳效果进行动画处理。当应用程序从第二个场景过渡回第一个场景时，第三个按钮将逐渐淡入视中。\n\
  \n### 43.2 创建 Android Studio SceneTransitions 项目\n\n从欢迎界面选择“Start a new Android\
  \ Studio project”快速启动选项，在生成的新项目对话框中，点击“Next” 按钮之前选择“Empty Activity”模板。\n\n在 `Name`\
  \ 字段中输入 `SceneTransitions`，并指定 `com.ebookfrenzy.scenetitions` 为包名。在点击“Finish” 按钮之前，将\
  \ `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为 `Java`。\n\n###\
  \ 43.3 识别根容器\n\n在处理过渡时，重要的是识别场景的根容器，即显示场景的父布局。当创建项目时，Android Studio 在 `app -> res\
  \ -> layout` 中创建了一个名为 `activity_main.xml` 的布局文件，包含单个布局容器和 `TextView`。通过定位 `activity_main.xml`\
  \ 布局文件并将其加载到 Layout Editor 工具中，删除默认的 `TextView`。在 Component Tree 窗口中选择 `ConstraintLayout`\
  \ 并将 ID 更改为 `rootContainer`。\n\n### 43.4 设计第一个场景\n\n第一个场景将由包含三个按钮视图的布局组成。通过右键点击项目窗口中的\
  \ `app -> res -> layout` 并选择 `New -> Layout resource file` 创建此布局资源文件。在生成的对话框中将文件命名为\
  \ `scene1_layout`，并在点击 OK 之前输入 `android.support.constraint.ConstraintLayout`。当新创建的布局文件加载到\
  \ Layout Editor 时，检查是否启用了 Auto-connect（自动连接）模式，从调色板拖入一个 `Button` 视图到布局画布，将其放置在布局的左上角，使虚线出现。在该处选择该\
  \ `Button` 视图，并将 Attributes 工具中的文本值更改为 `One`。从调色板拖入第二个 `Button` 视图，将其放置在布局的右上角，使虚线出现。重复第一个按钮的步骤，将其文本赋值为\
  \ `Two`。拖入第三个 `Button` 视图，使其在布局中水平和垂直方向上居中，此时将按钮文本配置为 `Three`。点击 Layout Editor 右上角的按钮，将三个按钮的硬编码文本提取到资源值。\n\
  \n完成上述步骤后，第一个场景的布局应所示。选择 `One` 按钮，使用 Attributes 工具将 `onClick` 属性配置为调用名为 `goToScene2`\
  \ 方法。对 `Two` 按钮重复此步骤，在 `onClick` 字段中输入名为 `goToScene1` 方法。\n\n### 43.5 设计第二个场景\n\n\
  第二个场景只是第一个场景的修改版本。两个按钮仍然存在，但分别位于布局的右下和左角。另一方面，第三个按钮将不再出现在第二个场景中。\n\n为了避免重复工作，通过复制和修改\
  \ `scene1_layout.xml` 文件创建第二个场景的布局文件。在 Project 工具窗口中找到 `app -> res -> layout ->\
  \ scene1_layout.xml` 文件，右键点击它并选择 `Copy`。右键点击布局文件夹，此时选择 `Paste` 菜单选项并在提示时将文件名更改为\
  \ `scene2_layout`。双击 `scene2_layout.xml` 文件将其加载到 Layout Editor 工具，必要时切换到 Design\
  \ 模式。使用工具栏上的 `Clear all Constraints` 按钮移除布局的当前约束。选择并删除 `Three` 按钮，并将两个按钮移动到右下和左下。\n\
  \n### 43.6 进入第一个场景\n\n如果现在运行应用程序，只会显示 `activity_main.xml` 文件表示的空白布局。因此，必须在 `MainActivity.java`\
  \ 文件的 `onCreate()` 方法中添加代码，以便在活动创建时呈现第一个场景。可以通过以下方式实现：\n\n```java\npackage com.ebookfrenzy.scenetransitions;\n\
  import android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\nimport\
  \ android.transition.Scene;\nimport android.transition.Transition;\nimport android.transition.TransitionManager;\n\
  import android.view.ViewGroup;\nimport android.view.View;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    ViewGroup rootContainer;\n    Scene scene1;\n\
  \    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n     \
  \   super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_scene_transitions);\n\
  \        rootContainer = findViewById(R.id.rootContainer);\n        scene1 = Scene.getSceneForLayout(rootContainer,R.layout.scene1_layout,\
  \ this);\n        scene1.enter();\n    }\n}\n```\n\n添加到活动类中的代码声明了一些变量用于存储根容器和第一个场景的引用，并获取根容器视图的引用。然后使用\
  \ `Scene` 类的 `getSceneForLayout()` 方法从 `scene1_layout.xml` 文件中的布局创建一个场景，将该布局转换为场景。随后通过调用\
  \ `enter()` 方法进入场景，以便向用户显示。此时编译并运行应用程序，验证在应用程序启动后显示了场景 1。\n\n### 43.7 加载场景 2\n\n\
  在实现第一个和第二个场景之间的过渡之前，首先需要添加一些代码将 `scene2_layout.xml` 文件加载到 `Scene` 实例中。在 `MainActivity.java`\
  \ 文件中，添加如下代码：\n\n```java\npublic class MainActivity extends AppCompatActivity {\n\
  \    ViewGroup rootContainer;\n    Scene scene1;\n    Scene scene2;\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_scene_transitions);\n        rootContainer\
  \ = findViewById(R.id.rootContainer);\n        scene1 = Scene.getSceneForLayout(rootContainer,R.layout.scene1_layout,\
  \ this);\n        scene2 = Scene.getSceneForLayout(rootContainer,R.layout.scene2_layout,\
  \ this);\n        scene1.enter();\n    }\n}\n```\n\n### 43.8 实现过渡\n\n两个按钮已配置为调用名为\
  \ `goToScene2` 和 `goToScene1` 方法。正如方法所示，触发两个场景之间的过渡是这些方法的职责。在 `MainActivity.java`\
  \ 文件中添加这两个方法：\n\n```java\npublic void goToScene2(View view) {\n    TransitionManager.go(scene2);\n\
  }\npublic void goToScene1(View view) {\n    TransitionManager.go(scene1);\n}\n```\n\
  \n### 43.9 添加过渡\n\n此项目的所有过渡效果将在一个 XML 资源文件中实现。正如“使用 Android 过渡框架制作用户界面”章节所述，过渡资源文件必须放在项目的\
  \ `app -> res -> transition` 文件夹中。因此，右键点击 `res` 文件夹并选择 `New -> Directory`。在生成的对话框中将新文件夹命名为\
  \ `transition` 并点击 OK。右键点击新文件夹，此时选择 `New -> Transition Resource File` 并将文件命名为 `transition.xml`。\n\
  \n在新创建的 `transition.xml` 文件进入编辑面板，添加以下 XML 内容以添加带有 `duration` 属性的 `changeBounds`\
  \ 动画集：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<transitionSet xmlns:android=\"\
  http://schemas.android.com/apk/res/android\">\n    <changeBounds android:duration=\"\
  2000\"/>\n</transitionSet>\n```\n\n### 43.10 加载并使用过渡\n\n虽然创建了过渡资源文件并填充了 `changeBounds`\
  \ 过渡，直到添加一些代码将过渡加载到 `TransitionManager` 实例并在场景更改中引用它。实现此点的更改如下：\n\n```java\npackage\
  \ com.ebookfrenzy.scenetransitions;\nimport android.support.v7.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.transition.Scene;\nimport android.transition.Transition;\n\
  import android.transition.TransitionManager;\nimport android.transition.TransitionInflater;\n\
  import android.view.ViewGroup;\nimport android.view.View;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    ViewGroup rootContainer;\n    Scene scene1;\n\
  \    Scene scene2;\n    Transition transitionMgr;\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_scene_transitions);\n        rootContainer\
  \ = findViewById(R.id.rootContainer);\n        transitionMgr = TransitionInflater.from(this).inflateTransition(R.transition.transition);\n\
  \        scene1 = Scene.getSceneForLayout(rootContainer,R.layout.scene1_layout,\
  \ this);\n        scene2 = Scene.getSceneForLayout(rootContainer,R.layout.scene2_layout,\
  \ this);\n        scene1.enter();\n    }\n    public void goToScene2(View view)\
  \ {\n        TransitionManager.go(scene2, transitionMgr);\n    }\n    public void\
  \ goToScene1(View view) {\n        TransitionManager.go(scene1, transitionMgr);\n\
  \    }\n}\n```\n\n### 43.11 配置额外的过渡\n\n将过渡文件集成到项目后，可以在文件中添加任意额外的过渡，而无需对 的 Java 源代码进行进一步更改。例如，对\
  \ `transition.xml` 文件进行以下更改，为 `changeBounds` 过渡添加 `bounce` 插值器，引入针对第三个按钮的 `fade-in`\
  \ 过渡，并更改过渡使其按顺序执行：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<transitionSet\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\" android:transitionOrdering=\"\
  sequential\">\n    <fade android:duration=\"2000\" android:fadingMode=\"fade_in\"\
  >\n        <targets>\n            <target android:targetId=\"@id/button3\"/>\n \
  \       </targets>\n    </fade>\n    <changeBounds android:duration=\"2000\" android:interpolator=\"\
  @android:anim/bounce_interpolator\"/>\n</transitionSet>\n```\n\n现在按钮一和二将在到达终点时将弹跳，第三个按钮在从场景\
  \ 2 过渡到场景 1 时将逐渐淡入视中。\n\n### 43.12 总结\n\n基于场景的过渡为 Android 应用程序内的用户界面布局变化提供了一种灵活的方法。本章演示了制作场景之间过渡动画的涉及的步骤。此外，示例还使用了过渡资源文件来配置场景之间的过渡效果。\n\
  \n## 44. 使用悬浮操作按钮和 Snackbar\n\n本章的一个目标是提供 material 设计的概述。最初作为 Android 5.0 部分引入的\
  \ material design 是一套设计指南，规定了 Android 用户界面如何显示和行为。作为实现 material 设计概念的一部分，Google\
  \ 还引入了 `Android Design Library`。该库包含许多不同的组件，允许构建 Android 应用程序的关键功能。其中两个组件——悬浮操作按钮和\
  \ Snackbar 将在本章中介绍。\n\n### 44.1 Material Design\n\nAndroid 环境的整体外观由 material 设计定义。material\
  \ design 由 Android 团队创建，并规定了构成用户界面的元素如何显示。material design 的设计原则之一是元素具有深度和层次感。按下按钮会导致按钮抬起。例如，按钮放置在距离屏幕边缘\
  \ 16dp（在桌面和平板设备上为 24dp）。无论大小如何，按钮必须包含一个大小为 24x24dp 的内部图标，并且建议每个用户界面屏幕有一个悬浮操作按钮。\n\
  \n### 44.2 Design Library\n\n实现 Android 应用程序所需的许多 material 设计构建模块都包含在 Android Design\
  \ Library 中。该库包含一组组件。\n\n### 44.3 悬浮操作按钮 (FAB)\n\n悬浮操作按钮是一个悬浮在用户界面表面的按钮，通常用于执行用户界面中最常见的操作。为了符合\
  \ material 设计指南，使用悬浮操作按钮时应遵循若干规则：悬浮操作按钮必须是圆形的，大小可以是 56dp（默认）或 40dp（微）。按钮应放置在距离屏幕边缘\
  \ 16dp 处。\n\n### 44.4 Snackbar\n\n`Snackbar` 组件提供以屏幕底部面板的形式向用户提供信息，如图 44-2 所示。Snackbar\
  \ 实例包含一条短文本消息和一个可选按钮，用户点击时将执行任务。一旦显示，Snackbar 将自动超时或由用户通过滑动操作手动移除。在 Snackbar 显示期间，应用程序将继续运行并以正常方式响应用户交互。\n\
  \n在本章的剩余部分，将创建一个示例应用程序，利用悬浮操作按钮和 Snackbar 向列表添加项目。\n\n### 44.5 创建示例项目\n\n从欢迎界面选择“Start\
  \ a new Android Studio project”快速启动选项，在生成的新项目对话框中，点击“Next” 按钮之前选择“Basic Activity”模板。\n\
  \n在 `Name` 字段中输入 `FabExample`，并指定 `com.ebookfrenzy.fabexample` 为包名。在点击“Finish” 按钮之前，将\
  \ `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为 `Java`。\n\n###\
  \ 44.6 审查项目\n\n由于选择了 Basic Activity 模板，该活动包含两个布局文件。`activity_main.xml` 文件由一个 `CoordinatorLayout`\
  \ 器组成，包含应用栏、工具栏和悬浮操作按钮的项目。`content_main.xml` 文件代表活动内容区域的布局，包含一个 `ConstraintLayout`\
  \ 实例和一个 `TextView`。该文件通过以下包含指令嵌入到 `activity_main.xml` 文件中：\n\n```xml\n<include layout=\"\
  @layout/content_fab_example\" />\n```\n\n`activity_main.xml` 文件中的悬浮操作按钮元素如下：\n\n\
  ```xml\n<android.support.design.widget.FloatingActionButton\n    android:id=\"@+id/fab\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:layout_gravity=\"bottom|end\"\n    android:layout_margin=\"@dimen/fab\"\
  \n    android:src=\"@android:drawable/ic_dialog_email\" />\n```\n\n这声明按钮将出现在屏幕右下角，边距由\
  \ `values/dimens.xml` 文件中的 `fab_margin` 标识符表示（在此情况下设置为 16dp）。空白模板也配置了悬浮操作按钮显示 Snackbar。代码通过按钮的\
  \ `ID` 获取悬浮操作按钮的引用，并在按钮被点击时为其添加一个 `OnClickListener` 处理器：\n\n```java\nFloatingActionButton\
  \ fab = findViewById(R.id.fab);\nfab.setOnClickListener(new View.OnClickListener()\
  \ {\n    @Override\n    public void onClick(View view) {\n        Snackbar.make(view,\
  \ \"Replace with your action\",\n            Snackbar.LENGTH_LONG).show();\n   \
  \ }\n});\n```\n\n编译项目后，悬浮操作按钮将出现在屏幕底部，如图 44-3 所示。点击按钮将触发 `OnClickListener` 处理器，导致\
  \ Snackbar 出现在屏幕底部。当 Snackbar 出现在较窄的设备上（如图 44-4 所示），布局会移动以为 Snackbar 留出空间。这由 `activity_main.xml`\
  \ 布局中的 `CoordinatorLayout` 容器处理。\n\n### 44.7 修改悬浮操作按钮\n\n由于本示例的目标是配置悬浮操作按钮向列表添加项目，按钮上当前显示的图标需要更改为执行的操作指示。用于按钮的图标是\
  \ `ic_add_entry.png`，可以从以下 URL 下载：https://www.ebookfrenzy.com/retail/androidstudio3/index.php\n\
  \n在文件系统中找到此图像。在 Project 窗口的 `app -> res -> drawable` 条目上右键点击。接下来，编辑 `activity_main.xml`\
  \ 文件，更改图标源如下：\n\n```xml\n<android.support.design.widget.FloatingActionButton\n \
  \   android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_margin=\"\
  @dimen/fab\"\n    app:srcCompat=\"@drawable/add_entry\" />\n```\n\n在布局预览中，按钮的图标将更改为加号。悬浮操作按钮的背景颜色由应用程序使用的\
  \ `colorAccent` 属性定义。此值位于 `app -> res -> values` 下的 `colors.xml` 文件中。编辑此文件并将 `colorAccent`\
  \ 属性更改为不同的颜色：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n\
  \    <color name=\"colorPrimary\">#008577</color>\n    <color name=\"colorPrimaryDark\"\
  >#0574B</color>\n    <color name=\"colorAccent\">#D81B60</color>\n</resources>\n\
  ```\n\n返回 `activity_main.xml` 文件，验证悬浮操作按钮现在显示橙色背景。\n\n### 44.8 在布局中添加 ListView\n\
  \n教程的下一步是将 `ListView` 实例添加到 `content_main.xml` 文件中。`ListView` 类提供了列表格式显示项目的方法，可以在\
  \ Layout Editor 调色板的 `Legacy` 部分找到。将 `content_main.xml` 文件加载到 Layout Editor 工具，必要时切换到\
  \ Design 模式并删除默认的 `TextView` 对象。在调色板的 `Legacy` 类中找到 `ListView` 对象，开启自动连接模式，将其拖到布局画布中心。选择\
  \ `ListView` 对象并在 Attributes 窗口将 `ID` 更改为 `listView`。Layout Editor 应该将 `ListView`\
  \ 调整为填充整个容器，并如图 44-6 所示在四边上建立了约束。\n\n### 44.9 向 ListView 中添加项目\n\n每当用户点击悬浮操作按钮时，就会以当前时间和日期的形式向\
