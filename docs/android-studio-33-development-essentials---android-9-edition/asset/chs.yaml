  \ *\n* *\n* *\n\n\n\n\n# 25.4 事件处理示例\n\n在本章的剩余部分中，我们将完成一个简单的 Android Studio 项目创建，用于演示如何实现事件监听器和相应的回调方法，以检测用户何时点击了按钮。回调方法中的代码将更新文本视图（TextView），以指示事件已处理。\n\
  \n从欢迎界面选择 `Start a new Android Studio project`（启动新的 Android Studio 项目）快速启动选项，在弹出的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。在 `Name` 字段中输入 `EventExample`，并指定 `com.ebookfrenzy.eventexample`\
  \ 为包名。在点击 `Finish` 之前，将 `Minimum API level`（最低 API 级别）设置改为 `API 26`：`Android 8.0\
  \ (Oreo)`，并将 `Language` 菜单改为 `Java`。\n\n# 25.5 设计用户界面\n\n本示例中 `MainActivity` 类的用户界面布局由一个\
  \ `ConstraintLayout`、一个 `Button` 和一个 `TextView` 组成，如图图 25-1 所示![](img/image4626.jpg)\n\
  图 25-1\n\n找到并选择由 Android Studio 创建的 `activity_main.xml` 文件（位于 Project 工具窗口的 `app\
  \ -> res -> layouts` 路径下），双击它将其加载到 `Layout Editor`（布局编辑器）工具中。确保已启用 `Autoconnect`（自动连接），然后从调色板中拖出一个\
  \ `Button` 组件，并移动它使其位于布局的水平中心且位于现有的 `TextView` 组件下方。当位置正确后，将组件放置在目标位置，让 `autoconnect`\
  \ 系统添加相应的约束。点击布局编辑器工具栏上的 `Infer Constraints`（推断约束）按钮添加任何缺失的约束![](img/image4633.jpg)\n\
  图 25-2\n\n选中 `Button` 组件后，使用 `Attributes`（属性）面板将 `text` 属性设置为 `Press Me`。使用布局编辑器右上角的黄色警告按钮（图\
  \ 25-3）显示警告列表，并点击 `Fix` 按钮将按钮上的文本字符串提取到名为 `press_me` 的资源中![](img/image4639.jpg)\n\
  图 25-3\n\n选择“Hello World!” `TextView` 组件，使用 `Attributes` 面板将 `ID` 设置为 `statusText`。重复此步骤将\
  \ `Button` 组件的 `ID` 更改为 `myButton`。\n\n用户界面布局完成后，下一步是注册事件监听器和回调方法。\n\n# 25.6 事件监听器和回调方法\n\
  \n在本示例中，需要为 `myButton` 视图注册一个 `onClickListener`。这通过调用按钮视图的 `setOnClickListener()`\
  \ 方法实现，传递一个新的 `OnClickListener` 对象作为参数并实现 `onClick()` 回调方法。由于这是一个只需要在 Activity 创建时执行的任务，良好的位置是\
  \ `MainActivity` 类的 `onCreate()` 方法。\n\n如果 `MainActivity.java` 文件已在编辑器会话中打开，点击编辑器面板中的标签选择它。或者，在\
  \ Project 工具窗口中导航至 (`app -> java -> com.ebookfrenzy.eventexample -> MainActivity`)\
  \ 找到它并双击加载到代码编辑器中。加载后，找到模板 `onCreate()` 方法并修改它以获取按钮视图的引用、注册事件监听器并实现 `onClick()`\
  \ 回调方法：\n\n```java\npackage com.ebookfrenzy.eventexample;\nimport android.support.v7.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.view.View;\nimport android.widget.Button;\n\
  import android.widget.TextView;\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_event_example);\n\
  \        Button button = (Button)findViewById(R.id.myButton);\n        button.setOnClickListener(new\
  \ Button.OnClickListener() {\n            public void onClick(View v) {\n      \
  \  }});\n    }\n}...\n```\n\n上述代码现在已经在按钮上注册了事件监听器并实现了 `onClick()` 方法。然而，如果此时运行应用程序，将没有任何指示表明按钮上安装的事件监听器正在工作，因为\
  \ `onClick()` 回调方法的体内尚未实现任何代码。本示例的目标是在点击按钮时在 `TextView` 上显示消息，因此需要进行一些进一步的代码更改：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_event_example);\n\
  \    Button button = (Button)findViewById(R.id.myButton);\n    button.setOnClickListener(new\
  \ Button.OnClickListener() {\n        public void onClick(View v) {\n          \
  \  TextView statusText =(TextView)findViewById(R.id.statusText);\n            statusText.setText(\"\
  Button clicked\");\n        }\n    });\n}\n```\n\n通过在 AVD 模拟器或物理 Android 设备上编译并运行应用程序来完成本教程的阶段。触摸并释放按钮视图（即“点击”），文本视图应更改为“Button\
  \ clicked”。\n\n# 25.7 消费事件\n\n检测视图上的标准点击而非长点击）是事件处理的一个非常简单的情况。示例现在将扩展为检测用户点击并按住视图时发生的长点击事件，从而涵盖事件消费的主题。考虑本节中\
  \ `onClick()` 方法的代码。回调被声明为 `void`，因此执行后没有向 Android 框架返回值。相反，分配给 `onClickListener`\
  \ 的代码需要返回一个 `Boolean` 值，告知 Android 运行时回调是否已消费事件。如果回调返回 `true` 值，事件将被框架丢弃。如果回调返回\
  \ `false` 值，Android 框架将认为该事件仍然激活，并将其传递给视图上注册的下一个监听器。\n\n正如许多编程概念一样，这最好通过示例演示。第一步是为按钮添加长点击事件监听器和回调方法：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_event_example);\n\
  \    Button button = (Button)findViewById(R.id.myButton);\n    button.setOnClickListener(new\
  \ Button.OnClickListener() {\n        public void onClick(View v) {\n          \
  \  TextView statusText =(TextView)findViewById(R.id.statusText);\n            statusText.setText(\"\
  Button clicked\");\n        }\n    });\n    button.setOnLongClickListener(new Button.OnLongClickListener()\
  \ {\n        public boolean onLongClick(View v) {\n            TextView statusText\
  \ =(TextView)findViewById(R.id.statusText);\n            statusText.setText(\"Long\
  \ click\");\n            return true;\n        }\n    });\n}\n```\n\n显然，当检测到长点击时，`onLongClick()`\
  \ 回调方法会在视图上显示“Long click”。在释放按钮时，文本视图继续显示“Long click”。接下来，修改代码使 `onLongClickListener`\
  \ 现在返回 `false`：\n\n```java\nbutton.setOnLongClickListener(new Button.OnLongClickListener()\
  \ {\n    public boolean onLongClick(View v) {\n        TextView myTextView = (TextView)findViewById(R.id.statusText);\n\
  \        myTextView.setText(\"Long button click\");\n        return false;\n   \
  \ }\n});\n```\n\n再次编译并运行应用程序，在按钮上执行长点击直到出现长点击消息。这次在释放按钮时，注意 `onClick` 监听器也被触发了，文本变为“Button\
  \ click”。这是因为 `onLongClickListener` 返回的 `false` 值指示 Android 框架事件未被消费，可以传递给视图上的下一个监听器。在这种情况下，运行时确认调用了\
  \ `onClick` 监听器。\n\n# 25.8 总结\n\n如果用户界面包含的视图对用户交互没有任何反应，它的意义不大。Android 通过事件监听器和回调方法的概念桥起了用户界面与应用程序后端之间的差距。`View`\
  \ 类定义了一组事件监听器，每个事件监听器也关联一个回调方法。当事件发生在用户界面上的视图时，该事件被放入事件队列，并由 Android 运行时按先顺序处理。如果发生事件的视图注册了匹配事件类型的监听器，将调用相应的回调方法。某些回调方法需要返回\
  \ `Boolean` 值，以指示将其传递给其他监听器还是丢弃。在涵盖事件处理的基础后，下一章将深入探讨多点主题。\n\n# 26 Android 触摸和多点事件处理\n\
  \n大多数 Android 设备使用触摸屏作为用户与设备之间的主要接口。上一章介绍了屏幕触摸转换为动作的机制。触摸处理远比响应视图上的单指点击要复杂得多。例如，大多数\
  \ Android 设备可以同时检测到多个触摸。触摸也不限于设备上的一点。当然，当用户在屏幕表面上滑动一个或多个点时，触摸可以是动态的。应用程序还可以将触摸解释为手势。例如，考虑水平滑动用于翻页电子书，或如何使用捏动作来缩放屏幕显示的图像。本章将解释涉及运动的触摸处理，并探索拦截触摸和识别不同手势的概念。\n\
  \n## 26.1 拦截触摸事件\n\n视图可以通过注册 `onTouchListener` 并实现相应的 `onTouch()` 回调方法来拦截触摸事件。例如，以下代码确保对名为\
  \ `myLayout` 的 `ConstraintLayout` 实例的任何触摸都会调用 `onTouch()` 方法：\n\n```java\nmyLayout.setOnTouchListener(new\
  \ ConstraintLayout.OnTouchListener() {\n    public boolean onTouch(View v, MotionEvent\
  \ m) {\n        // 在此处执行任务\n        return true;\n    }\n});\n```\n\n正如代码示例所示，`onTouch()`\
  \ 回调需要返回一个 `Boolean` 值，告知 Android 运行时事件是否应该传递给同一视图上注册的其他监听器还是丢弃。该方法传递了触发事件的视图引用和一个类型为\
  \ `MotionEvent` 对象。\n\n## 26.2 MotionEvent 对象\n\n通过 `onTouch()` 回调方法传递的 `MotionEvent`\
  \ 对象是获取事件信息的关键。对象包含的信息包括视图内的触摸位置以及执行的操作类型。`MotionEvent` 对象也是处理多点触摸的关键。\n\n## 26.3\
  \ 理解触摸动作\n\n事件处理的一个重要方面是能够识别用户执行的操作类型。与事件相关的动作类型可以通过调用 `MotionEvent` 对象的 `getAction()`\
  \ 方法获得。当视图上发生第一次触摸时，`MotionEvent` 对象将包含 `ACTION_DOWN` 动作类型。当触摸离开屏幕时，会生成 `ACTION_UP`\
  \ 事件。`ACTION_DOWN` 和 `ACTION_UP` 事件之间的任何运动将由 `ACTION_MOVE` 事件表示。在多点触摸场景下，触摸被称为“指针（pointers）”，分别以\
  \ `ACTION_POINTER_DOWN` 和 `ACTION_POINTER_UP` 开始和结束。为了识别触发事件的指针索引，必须调用 `MotionEvent`\
  \ 对象的 `getActionIndex()` 方法。\n\n## 26.4 处理多点触摸\n\n标题为“Android 事件处理概述与示例”的章节在单点触摸事件范围内探索了事件处理。实践中，大多数\
  \ Android 设备具有响应多个连续触摸的能力（尽管之前提到，多点情况下的每次触摸都被 Android 框架视为一个指针）。每个指针又通过索引值引用并分配一个\
  \ ID。当前指针的数量可以通过调用当前 `MotionEvent` 对象的 `getPointerCount()` 方法获得。指针列表中特定索引的指针 ID\
  \ 可以通过 `MotionEvent.getPointerId()` 方法获得。例如，以下代码片段获取指针计数以及索引为 0 的指针 ID：\n\n```java\n\
  public boolean onTouch(View v, MotionEvent m) {\n    int pointerCount = m.getPointerCount();\n\
  \    int pointerId = m.getPointerId(0);\n    return true;\n}\n```\n\n注意，当触发 `onTouch`\
  \ 监听器时，指针计数始终大于等于 1（因为触发回调至少一次触摸）。视图上的触摸，特别是跨屏幕的运动，会在接触点离开屏幕前产生一系列事件。因此，应用程序可能需要跨多个事件跟踪单个触摸。虽然特定手势的\
  \ ID 在一个事件到下一个事件之间改变，但在多个事件上处理手势时，请记住索引值会随着其他事件的到来而变化。通过调用 `MotionEvent` 对象的 `findPointerIndex()`\
  \ 将触摸的 ID 转换为相应的索引值。\n\n## 26.5 多点应用程序示例\n\n在本章剩余部分创建的示例应用程序将跟踪跨布局视图移动的多两个触摸手势。当每个触摸事件触发时，屏幕上将显示每个触摸的坐标和\
