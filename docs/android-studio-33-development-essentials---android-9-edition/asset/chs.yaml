  \n\n\n\n# 51.4 修改主/详情流模板\n\n虽然主/详情流模板的结构初看起来可能很令人困惑，但随着在本章的后续章节中对默认模板进行修改，这些概念将变得清晰。显而易见，对于许多主/详情实现需求，该模板提供的许多功能可以保持不变。\n\
