  \ android:layout_width=\"match_parent\" android:layout_height=\"match_parent\" />\n\
  \    <android.support.design.widget.NavigationView android:id=\"@+id/nav_view\"\
  \ android:layout_width=\"wrap_content\" android:layout_height=\"match_parent\" android:layout_gravity=\"\
  start\" android:fitsSystemWindows=\"true\" app:headerLayout=\"@layout/nav_header_main\"\
  \ app:menu=\"@menu/activity_main_drawer\" />\n</android.support.v4.widget.DrawerLayout>\n\
  ```\n\n## 50.2 打开和关闭抽屉\n当用户点击应用栏中的抽屉指示时，抽屉将自动出现。抽屉当前是否打开可以通过调用 `DrawerLayout` 对象的\
  \ `isDrawerOpen()` 方法并传递重力设置来识别：\n\n```java\nif (drawer.isDrawerOpen(GravityCompat.START))\
  \ {\n    // 抽屉已打开\n}\n```\n\n`GravityCompat.START` 设置表示抽屉沿布局的 x 轴打开。打开的抽屉可以通过调用\
  \ `closeDrawer()` 方法来关闭：\n`drawer.closeDrawer(GravityCompat.START);`\n\n相反，可以使用\
  \ `openDrawer()` 方法打开抽屉：\n`drawer.openDrawer(GravityCompat.START);`\n\n## 50.3 响应导航抽屉项的选择\n\
  在导航抽屉内处理选择是一个两步过程。第一步是指定一个对象作为项选择监听器。这通过获取布局中 `NavigationView` 实例的引用，并调用其 `setNavigationItemSelectedListener()`\
  \ 方法来实现，同时传递一个要充当监听器的对象引用。通常，监听器将配置为当前活动（activity），例如：\n\n```java\nNavigationView\
  \ navigationView = findViewById(R.id.nav_view);\nnavigationView.setNavigationItemSelectedListener(this);\n\
  ```\n\n第二步是在指定的监听器中实现 `onNavigationItemSelected()` 方法。每当在导航抽屉中进行选择时，该方法就会被调用一次，并将选中的菜单项引用作为参数传递进来，然后可以使用该参数来提取并识别选中的项\
  \ ID：\n\n```java\n@Override\npublic boolean onNavigationItemSelected(MenuItem item)\
  \ {\n    // 在此处处理导航视图项的点击事件。\n    int id = item.getItemId();\n    if (id == R.id.nav_slideshow)\
  \ {\n    } else if (id == R.id.nav_manage) {\n    } else if (id == R.id.nav_share)\
  \ {\n    } else if (id == R.id.nav_send) {\n    }\n    DrawerLayout drawer = findViewById(R.id.drawer_layout);\n\
  \    drawer.closeDrawer(GravityCompat.START);\n    return true;\n}\n```\n\n如果合适的话，并且如上述示例所示，在项被选中后关闭抽屉也是重要的。\n\
  \n## 50.4 使用导航抽屉活动模板\n虽然可以在任何活动（activity）中实现导航抽屉，但简单的方法是在创建新项目或向现有项目添加新活动时，选择导航抽屉活动模板：\n\
  \n![](img/image9537.jpg)\n图 50-2\n\n此模板创建了实现导航抽屉所需的所有组件和要求，只需在需要的地方调整默认设置即可。\n\n\
  ## 50.5 创建导航抽屉模板项目\n从欢迎屏幕选择“Start a new Android Studio project”快速启动选项，在生成的新项目对话框中，点击“Next”按钮之前，选择“Navigation\
  \ Drawer Activity”模板。\n\n在 `Name` 字段中输入 `NavDrawerDemo` 并指定 `com.ebookfrenzy.navdrawerdemo`\
  \ 为包名。在点击“Finish”按钮之前，将最小 API 级别设置更改为 `API 26: Android 8.0 (Oreo)`并将语言菜单更改为 `Java`。\n\
  \n## 50.6 模板布局资源文件\n项目创建后，它将包含项目工具窗口 `app -> res -> layout` 下的以下 XML 资源文件：\n\n*\
  \ `activity_main.xml` – 这是顶层布局资源文件。它包含 `DrawerLayout` 容器和 `NavigationView` 子组件。该文件中的\
  \ `NavigationView` 声明表示抽屉头部布局包含在 `nav_header_main.xml` 文件中，抽屉菜单选项位于 `activity_main_drawer.xml`\
  \ 文件。此外，它还包含了对 `app_bar_nav_drawer.xml` 文件的引用。\n* `app_bar_main.xml` – 此布局资源文件由\
  \ `activity_main.xml` 文件包含，它是在前面的章节中过的通过 `CoordinatorLayout` 容器构建的标准应用栏布局文件。与之前的示例一样，该文件还包含一个包含内容文件的指令，在此情况下，该文件名为\
  \ `content_main.xml`。\n* `content_main.xml` – 活动布局内容区域的标准布局。此布局由一个 `ConstraintLayout`\
  \ 容器和一个“Hello World!” `TextView` 组成。\n* `nav_header_main.xml` 被 `activity_nav_drawer.xml`\
  \ 文件中的 `NavigationView` 元素引用，它是抽屉的占位符头部布局。\n\n\n\n\n\n## 50.7 头部颜色资源文件\n除了布局资源文件外，位于\
  \ `app -> res -> drawable` 下的 `side_nav_bar.xml` 文件也可以修改，以更改应用于抽屉头的颜色。默认情况下，该文件声明了一个矩形渐变，从深绿色到浅绿色进行水平过渡。\n\
  \n## 50.8 模板菜单资源文件\n导航抽屉中显示的菜单选项可以在项目工具窗口 `app -> res -> menu` 下的 `activity_main.xml`文件中找到。默认情况下，菜单由一组基于文本的标题以及随附图标组成（这些文件均位于\
  \ `drawable` 文件夹中）。有关菜单资源文件的更多信息，请参阅标题为在 Android 上创建和管理溢出菜单的章节。\n\n## 50.9 模板代码\n\
  位于 `MainActivity.java` 文件中的 `onCreate()` 方法执行了导航抽屉的大部分初始化工作：\n\n```java\nDrawerLayout\
  \ drawer = findViewById(R.id.drawer_layout);\nActionBarDrawerToggle toggle = new\
  \ ActionBarDrawerToggle(this, drawer, toolbar,R.string.navigation_drawer_open,R.string.navigation_drawer_close);\n\
  drawer.setDrawerListener(toggle);\ntoggle.syncState();\nNavigationView navigationView\
  \ = (NavigationView)findViewById(R.id.nav_view);\nnavigationView.setNavigationItemSelectedListener(this);\n\
  ```\n\n该代码获取了 `DrawerLayout` 对象的引用，然后创建了一个 `ActionBarDrawerToggle` 对象，并使用当前活动的引用、`DrawerLayout`\
  \ 对象、应用栏包含的工具栏以及两个用于无辅助功能的描述抽屉打开和关闭动作的字符串对其进行初始化。随后，将 `ActionBarDrawerToggle` 对象分配为抽屉的监听器并进行同步。\n\
  \n接着，代码获取了 `NavigationView` 实例的引用，然后将当前活动声明为导航抽屉内任何项目选择的监听器。\n\n由于当前活动已声明为抽屉监听器，因此在\
  \ `MainActivity.java` 文件中也实现了 `onNavigationItemSelected()` 方法。该方法在活动中的实现与本章早些概述的内容一致。\n\
  \n最后，Android Studio 为活动添加了一个名为 `onBackPressed()` 的额外方法。添加此方法是为了处理活动具有“返回”按钮以返回上一个活动屏幕的情况。该方法中的代码确保在应用切换回上一个活动屏幕之前关闭抽屉：\n\
  \n```java\n@Override\npublic void onBackPressed() {\n    DrawerLayout drawer = findViewById(R.id.drawer_layout);\n\
  \    if (drawer.isDrawerOpen(GravityCompat.START)) {\n        drawer.closeDrawer(GravityCompat.START);\n\
  \    } else {\n        super.onBackPressed();\n    }\n}\n```\n\n## 50.10 运行应用\n\
  编译并运行项目，注意如图 50-3 所示的抽屉指示器的外观：![](img/image9588.jpg)\n图 50- 3\n\n点击指示器，并注意当导航抽屉出现时图标会旋转：![](img/image9594.jpg)\n\
  图 50-4\n\n## 50.11 总结\n导航抽屉是一个当用户选择指示器时，从活动屏幕左边缘延伸出的面板。抽屉包含可供选择的菜单选项，并符合材料设计指南的实用应用导航工具。虽然可以在任何活动中添加导航抽屉，但最快的方法是使用\
  \ Android Studio 的导航抽屉活动模板，然后根据特定需求对其进行定制。本章概述了构成导航抽屉的组件，并强调了这些组件如何在模板中实现。\n\n##\
  \ 51. Android Studio 主/详情流教程\n本章将先解释主/详情（Master/Detail）用户界面设计概念，然后详细探索 Android Studio\
  \ 包含的主/详情流模板所包含的元素。随后将创建一个示例应用程序，演示修改模板以满足应用开发者特定需求所需的步骤。\n\n### 51.1 主/详情流\n主/详情流是一种界面设计概念，其中向用户显示一个项目列表（称为“主列表”）。当从列表中选择一个项目时，与该项目相关的额外信息将在详情窗格中呈现给用户。例如，一个电子邮件应用程序可能包含一个收到的消息主列表，其中包含发件人地址和消息主题。当从主列表中选择一条消息后，邮件正文将显示在详情窗格中。\n\
  \n在横屏模式的平板尺寸 Android 设备屏幕上，主列表显示在屏幕左边缘的窄垂直面板中。屏幕的其余部分用于详情窗格，这种布局被称为“双窗格模式”。例如，图\
  \ 51-1 显示了主/详情双窗格布局，其中列出了主列表项目，并将项目 1 的内容显示在详情窗格中：![](img/image9611.jpg)\n图 51-\
  \ 1\n\n在较小的手机尺寸的 Android 设备上，主列表占据整个屏幕，而详情窗格则在从主列表中进行选择时出现在另一个单独屏幕上。在这种模式下，详情屏幕包含一个返回到主列表的操作栏条目。图\
  \ 51-2 例如展示了手机屏幕上的主、详情界面：![](img/image9617.jpg)\n图 51- 2\n\n### 51.2 创建主/详情流\n在本章的下一节中，将详细介绍组成模板的不同元素。实现此点的最佳方法是使用主/详情模板创建一个项目。该项目将作为本章结尾教程的基础。从欢迎屏幕选择新建\
  \ Android 项目快速启动，在出现的新项目对话框中选择 No Activity 模板，点击 Next 按钮。在 Name 字段输入 MasterFlow，并指定\
  \ `com.ebookrenzy.masterdetailflow` 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为\
  \ 26: Android 8.0 (Oreo)，并将 Language 设置为 Java。\n\n项目创建后，右键点击项目工具窗口中的 `app -> java\
  \ -> com.ebookrenzy.masterdetailflow` 项，选择 New -> Activity -> Master/Detail Flow\
  \ 菜单选项。新建 Android Activity 屏幕（图 51-3））提供了配置主/详情活动中显示对象的机会。在本章随后的教程中，主列表将包含多个网站名称，选择后将把选定的网站加载到详情窗格中的\
  \ web view 中。考虑到这些需求，将 Object Kind 字段设置为“Website”，并将 Object Kind Plural 和 Title\
  \ 设置为“Websites”。image9629.jpg)\n图 51- 3 在点击 Finish 按钮之前，确保启用 Launcher Activity 选项并将\
  \ Source Language 设置为 Java。\n\n### 51.3 主/详情流模板的构造分析\n使用主/详情流模板新建项目后，系统会自动创建许多 Java\
