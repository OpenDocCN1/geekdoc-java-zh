  如果 action 字符串不是 `null`，则会进行检查其是否设置为 `android.intent.action.VIEW`，在提取 `Uri` 路径的最后一个组件之前，然后在查询数据库时将其作为地标\
  \ ID。相反，调用位于 `AppLinkingActivity.java` 文件中的 `handleIntent()` 方法从意图数据中提取 ID。识别活动启动方式的另一种选项是修改\
  \ `AppLinkingActivity.java` 中的 `findLandmark()` 方法，使其使用 `View` 意图启动：\n\n```java\n\
  public void findLandmark(View view) {\n    if (!idText.getText().equals(\"\")) {\n\
