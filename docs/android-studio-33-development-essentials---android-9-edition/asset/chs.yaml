- "# Android Studio 3.3 开发核心指南 - Android 9 版本：使用 Android Studio 3.3、Java 和 Android\
  \ Jetpack 开发 Android 9 应用\n\n\n\n![](img/image8.jpg)\n\n\n\n\n\n\n\n\n\n\n\n13.7\
  \ 总结\n“画胜千言”的古语在学习新范式时同样适用。在本章中，我们创建了一个示例应用程序，用于演示活动可能通过的不同生命周期状态。在下一章中，我们将扩展 `StateChange`\
  \ 示例来演示如何保存和恢复活动的状态。\n\n# 14. 保存和恢复 Android 活动的状态\n如果前面的几个章节实现了目标，现在对于活动生命周期特定点保存和恢复用户界面状态的重要性应该更清晰了。保存和恢复状态的关键组件是使用\
  \ Android SDK `Bundle` 类，该主题也将在涵盖。\n\n14.1 保存动态状态\n正如我们已经学过的，活动通过运行时调用 `onSaveInstanceState()`\
  \ 方法提供了保存动态状态的机会。作为方法的参数传递一个 `Bundle` 对象的引用，该方法需要存储任何需要保存的数据。`Bundle` 对象由运行时代表活动存储，并在如果被调用，作为参数传递给活动的\
  \ `onCreate()` 方法。\n\n14.2 用户界面的默认保存\n在前章节中，`StateChange` 应用的诊断输出显示，当运行设备旋转触发方向更改时，活动会经历状态变化。再次启动\
  \ `StateChange` 应用，这次在执行设备旋转之前在 `EditText` 字段输入一些文本（在运行 Android 9 的设备或模拟器上，必须点击状态栏中的旋转按钮来完成旋转）。旋转设备后，Logcat\
  \ 窗口中应出现以下状态变化序列：\n```\nonPause\nonStop\nonSaveInstanceState\nonCreate\nonStart\n\
  onRestoreInstanceState\n```\n显然，这导致了活动的销毁和重建。然而，查看运行应用程序的用户界面，应该显示输入 `EditText`\
  \ 字段的文本被保留了。由于活动被销毁并重建，且我们没有添加任何特定代码来确保文本保存并恢复，这种行为需要一些解释。事实上，Android SDK 包含的大多数视图都实现了活动重启时自动保存和恢复状态的行为。启用此行为的唯一要求是活动中的\
  \ `onSaveInstanceState()` 和 `onRestoreInstanceState()` 重写方法包含对父类对应方法的调用：\n\n```java\n\
  \    @Override\n    protected void onSaveInstanceState(Bundle outState) {\n    \
  \    super.onSaveInstanceState(outState);\n    }\n    @Override\n    protected void\
  \ onRestoreInstanceState(Bundle savedInstanceState) {\n        super.onRestoreInstanceState(savedInstanceState);\n\
  \    }\n```\n\n在 XML 布局文件中通过将 `android:saveEnabled` 属性设置为 `false` 可以禁用用户界面视图的自动保存。为了示例，我们将禁用用户界面布局中\
  \ `EditText` 视图的自动保存机制，然后向应用程序添加代码以手动保存和恢复视图状态。为了配置 `EditText` 视图在活动重启时状态不会被保存和恢复，编辑\
  \ `content_main.xml` 文件，使视图的条目如下：\n\n```xml\n<EditText\n    android:id=\"@+id/editText\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:ems=\"10\"\n    android:inputType=\"text\"\n    android:saveEnabled=\"\
  false\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n更改后，运行应用程序，输入文本并旋转设备，以验证文本不再保存并恢复。\n\n14.3 Bundle 类\n对于需要超出界面视图提供的默认功能保存状态的情况，`Bundle`\
  \ 类提供了一个使用键值对存储数据的容器。键的形式为字符串值，而与这些键关联的值可以是原始类型或任何实现了 `Parcelable` 接口的对象。许多类已经实现了\
  \ `Parcelable` 接口。通过实现 `Parcelable` 接口定义的方法，可以将自定义类变为“parcelable”，详情可以在 Android\
  \ 文档中找到：[`developer.android.com/reference/android/os/Parcelable.html`](https://developer.android.com/reference/os/Parcelable.html)\n\
  \n`Bundle` 类还包含一组方法，用于获取和设置各种数据的键值对，包括原始类型（如 boolean、char、double 和 float）以及对象（如\
  \ Strings 和 `CharSequence`）。为了本示例，并且已经禁用了 `EditText` 视图的文本保存，我们需要确保输入 `EditText`\
  \ 字段的文本保存到 `Bundle` 对象并随后恢复。这将通过使用 `Bundle` 类的 `putCharSequence()` 和 `getCharSequence()`\
  \ 方法来实现。\n\n14.4 保存状态\n扩展 `StateChange` 应用的第一步是在活动的 `onSaveInstanceState()` 方法中从\
  \ `EditText` 组件中提取用户输入的文本，并作为键值对保存到 `Bundle` 对象中。为了从 `EditText` 对象提取文本，首先需要在用户界面中识别该对象。这显然涉及活动的\
  \ Java 代码（位于 `MainActivity.java` 源代码中）与 XML 表示界面（位于 `content_main.xml` 资源文件中）之间的差距。用户界面中的每个组件都关联有一个唯一标识符。默认情况下，如果布局中包含相同类型的视图，`Layout\
  \ Editor` 为新添加的组件构造的 ID 为数字（尽管可以将其更改为有意义的内容）。通过检查 Android Studio 主窗口中 `content_main.xml`\
  \ 文件对应的组件面板可以看到，`EditText` 组件已分配 ID `editText`：\n\n```java\nfinal EditText editText\
  \ = findViewById(R.id.editText);\n```\n\n获取 `EditText` 对象引用并赋值给变量后，现在可以通过 `getText()`\
  \ 方法获取包含的文本：\n\n```java\nCharSequence userText = editText.getText();\n```\n\n最后，我们可以使用\
  \ `Bundle` 对象的 `putCharSequence()` 方法保存文本，传递键（可以是任何字符串值，但在本例中我们将声明为“savedText”）和\
  \ `userText` 对象作为参数：将这一切整合在一起，我们在 `MainActivity.java` 文件中得到了修改后的 `onSaveInstanceState()`\
  \ 方法如下（注意对 `android.widget.EditText` 的额外导入指令）：\n\n```java\n    @Override\n    protected\
  \ void onSaveInstanceState(Bundle outState) {\n        super.onSaveInstanceState(outState);\n\
  \        Log.i(TAG, \"onSaveInstanceState\");\n        final EditText editText =\
  \ findViewById(R.id.editText);\n        CharSequence userText = editText.getText();\n\
  \        outState.putCharSequence(\"savedText\", userText);\n    }\n```\n\n现在已经了保存状态的步骤，下一阶段是确保在需要时恢复。\n\
  \n14.5 恢复状态\n保存动态状态可以在传递 `Bundle` 对象作为参数的生命周期方法中恢复。这让开发者可以选择 `onCreate()` 或 `onRestoreInstanceState()`。使用哪个方法取决于活动的性质。在活动初始化任务完成后状态状态的情况下，`onRestoreInstanceState()`\
  \ 方法通常更合适。为了本示例，我们将在 `onRestoreInstanceState()` 方法中添加代码，使用“savedText”键从 `Bundle`\
  \ 中提取保存的状态。然后我们可以使用对象的 `setText()` 方法在 `editText` 组件上显示文本：\n\n```java\n    @Override\n\
  \    protected void onRestoreInstanceState(Bundle savedInstanceState) {\n      \
  \  super.onRestoreInstanceState(savedInstanceState);\n        Log.i(TAG, \"onRestoreInstanceState\"\
  );\n        final EditText editText = findViewById(R.id.editText);\n        CharSequence\
  \ userText = savedInstanceState.getCharSequence(\"savedText\");\n        editText.setText(userText);\n\
  \    }\n```\n\n14.6 测试应用程序\n剩下的只是再次构建并运行 `StateChange` 应用程序。运行并在前台后，触摸 `EditText`\
  \ 组件并输入一些文本，然后将设备旋转到另一个方向。之前文本更改会丢失，现在得益于我们在本章向活动添加的代码，新文本被保留在 `editText` 组件中。\n\
  \n验证代码按预期运行后，注释掉这两个方法中的 `super.onSaveInstanceState()` 和 `super.onRestoreInstanceState()`\
  \ 调用，重新启动应用并注意设备旋转后文本仍然被保留。默认的保存和恢复系统本质上被自定义实现所取代，从而提供了一种动态和选择性保存及恢复活动状态的方法。\n\n\
  \n\n\n\n## 15.4 视图层级结构\n\n在考虑 Android 应用程序用户界面中的布局时，值得记住，正如下一节将概述的，这些布局可以相互嵌套，以创建出任何所需复杂程度的用户界面设计。\n\
  \n用户界面中的每个视图（view）都代表显示器上的一个矩形区域。视图负责在该矩形内绘制的内容，并响应发生在屏幕该部分的事件（例如触摸事件）。\n\n用户界面屏幕由一个视图层级结构组成，其中根视图（root\
  \ view）位于树的顶部，子视图位于下方的分支上。容器视图的子视图显示在其父视图之上，并限制显示在父视图显示区域的边界内。例如，考虑图 15-1 所示的用户界面：![](img/image3044.jpg)图\
  \ 15-1\n\n除了可见的按钮和复选框视图外，用户界面实际上包含了许多布局视图，这些视图控制着可见视图的布局。图 15-2 显示了用户界面的另一种视图，这次重点强调了布局视图与子视图之间的关系：![](img/image3050.jpg)图\
  \ 15-2\n\n正如之前讨论过的，用户界面是以视图层级结构的形式构建的，顶部有一个根视图。既然如此，我们也可以用图 15-3 所示的视图树形式将上述用户界面示例视觉化：![](img/image3056.jpg)图\
  \ 15-3\n\n视图层级结构图为构成图 15-1 所示用户界面的各种视图之间的关系提供了（可能是）最清晰的概览。当用户界面显示给用户时，Android 运行时会遍历视图层级结构，从根视图开始沿树向下移动，并渲染每个视图。\n\
  \n## 15.5 创建用户界面\n\n在对视图、布局和视图层级结构的概念有了更清晰的理解后，接下来的章节将重点关注为 Android 活动（activities）创建用户界面的步骤。事实上，用户界面设计有三种不同的方法：使用\
  \ Android Studio 布局编辑器工具、手动编写 XML 布局资源文件或编写 Java 代码，每种方法都将被涵盖。\n\n## 15.6 总结\n\n\
  Android 应用程序用户界面屏幕中的每个元素都是视图，它们最终继承自 `android.view.View` 类。每个视图代表设备显示器的一个矩形区域，既负责该矩形内出现的内容，又负责处理视图边界内的事件。可以将多个视图组合起来创建一个单一复合视图（composite\
  \ view）。复合视图中的视图是容器视图的子视图，容器视图通常是 `android.view.ViewGroup` 的子类（而其又是 `android.view.View`\
  \ 的子类）。用户界面是由视图层级结构形式构建的视图组成的。\n\nAndroid SDK 包含了一系列预构建视图，可用于创建用户界面。这些包括文本字段和按钮等基本组件，以及一系列可用于控制子视图位置的布局管理器。如果提供的视图不能满足特定需求，可以创建自定义视图，可以通过扩展或组合现有视图，也可以通过派生\
  \ `android.view.View` 并创建一个全新的视图类。\n\n用户界面可以使用 Android Studio 布局编辑器工具、手动编写 XML 布局资源文件或编写\
  \ Java 代码来创建。这些方法中的每一种将在后续章节中介绍。\n\n# 16. Android Studio 布局编辑器工具指南\n\n很难想象出一个不需要某种形式用户界面的\
  \ Android 应用程序概念。大多数 Android 设备都配备了触摸屏和键盘（虚拟或物理），点击和滑动是用户与应用程序之间交互的主要形式。这些交互不可避免地通过应用程序的用户界面进行。\n\
  \n设计良好且实现良好的用户界面是创建成功且流行的 Android 应用程序的重要因素，根据单个应用程序的设计需求，其可以从简单到极其复杂不等。无论复杂程度如何，Android\
  \ Studio 布局编辑器工具都显著简化了设计和实现 Android 用户界的工作。\n\n## 16.1 基础活动与空活动模板\n\n正如标题为“Android\
  \ 应用程序结构” 的章节所述，Android 应用程序由一个或多个活动（activities）组成。活动是应用程序功能的一个独立模块，通常直接对应单个用户界面屏幕。因此，当使用\
  \ Android Studio 布局编辑器时，我们总是在为某个活动编写布局。\n\n创建新的 Android Studio 项目时，有许多不同的模板可以作为主活动用户界面的起点。这些模板中最基础的是“基础活动”（Basic\
  \ Activity）模板和“空活动”（Empty Activity）模板。尽管它们乍看起来很相似，但这两个选项之间实际上存在显著差异。\n\n空活动模板创建一个单一的布局文件，其中包含一个带有\
  \ `TextView` 对象的 `ConstraintLayout` 管理器，如图 16-1 所示所示![](img/image3079.jpg)图 16-1\n\
  \n另一方面，基础活动包含两个布局文件。顶层布局文件具有 `CoordinatorLayout` 作为根视图、一个可配置的标题栏、一个预配置了单个菜单项的菜单（如图\
  \ 16-2 中的 A）、一个悬浮操作按钮（B）以及对第二个布局文件的引用，第二个文件声明了用户界面内容区域的布局：![](img/image3085.jpg)图\
  \ 16-2\n\n显然，如果你的活动不需要悬浮操作按钮或菜单，也不需要 `CoordinatorLayout` 提供的特殊标题栏行为（例如在某些滚动操作期间标题栏从视图中折叠的选项，该主题在“使用\
  \ AppBar 和折叠工具栏布局” 的章节中有所介绍），那么空活动模板就是实用的。然而，基础活动的用处在于它默认就提供了这些元素。事实上，使用基础活动模板创建新活动并删除不需要的元素，通常比使用空活动模板并手动实现折叠标题栏、菜单或悬浮操作按钮等行为要快得多。但由于本书中并非所有示例都需要基础活动模板的功能，因此本章的大多数示例将使用空活动模板，除非示例需要基础活动模板提供的某项或其他功能。为了以后参考，如果你需要菜单但不需要悬浮操作按钮，请使用基础活动并按照以下步骤删除悬浮操作按钮：\n\
  \n1. 在项目工具窗口中，位于 `app -> res -> layout` 下的双击主活动布局文件，将其加载到布局编辑器中。这将是以 `activity_`\
  \ 前缀的布局文件，而不是以 `content_` 为缀的文件。\n\n2. 将布局加载到布局编辑器工具后，选择悬浮操作按钮并按下键盘上的 Delete 键将该对象从布局中移除。\n\
  \n\n\n\n\n### 3. 定位并编辑 Activity 的 Java 代码\n\n位于 `app` -> `java` -> `<package name>`\
  \ -> `<activity class name>`，如下所示从 `onCreate` 方法中删除悬浮按钮的代码：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n    Toolbar toolbar = findViewById(R.id.toolbar);\n\
  \    setSupportActionBar(toolbar);\n    FloatingActionButton fab = findViewById(R.id.fab);\n\
  \    fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n  \
  \      public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with your own action\", Snackbar.LENGTH_LONG).setAction(\"Action\", null).show();\n\
  \        }\n    });\n}\n```\n\n如果你需要悬浮按钮但不需要菜单，请使用 Basic Activity 模板并按照以下步骤操作：\n\
  \n1. 编辑 Activity 类文件并删除 `onCreateOptionsMenu` 和 `onOptionsItemSelected` 方法。\n2.\
  \ 在 Project 工具窗口中选择 `res` -> `menu` 项，按下键盘上的 Delete 键，从项目中删除该文件夹及相应的菜单资源文件。\n\n\n\
  \n\n\n## 16.2 Android Studio 布局编辑器\n之前的章节中已经演示了 Android Studio 布局编辑器。布局编辑器工具提供了一个“所见即所得”（WYSIWYG）的环境，在该环境中，可以从调色板中选择视图，然后将其放置在代表\
  \ Android 设备显示的画布上。一旦视图放置在画布上，就可以对其进行移动、删除和调整大小（受父视图约束的限制）。此外，可以使用 `Attributes`（属性）工具窗口修改与所选视图相关的各种属性。在底层，布局编辑器工具实际上构建了一个包含正在设计的用户界面定义的\
  \ XML 资源文件。因此，布局编辑器工具以两种截然不同的模式运行，分别称为 `Design`（设计）模式和 `Text`（文本）模式。\n\n## 16.3\
  \ 设计模式\n在设计模式下，用户可以通过操作视图调色板和布局的图形表示来视觉化地操控用户界面。图 16-3 展示了设计模式下 Android Studio 布局编辑器工具的关键区域：\n\
  \n![](img/image3134.jpg)\n图 16-3\n\n*   **A – Palette（调色板）** – 调色板提供了 Android SDK\
  \ 提供的一系列视图组件。这些组件被分类以便于导航。可以通过从调色板中拖动视图组件并释放到布局上的所需位置来向布局中添加项。\n*   **B – Device\
  \ Screen（设备屏幕）** – 设备屏幕提供了正在设计中的用户界面布局的视觉化“所见即所得”表示。该布局允许对设计进行直接操作，允许对视图进行选择、删除、移动和调整大小。可以使用工具栏上的菜单随时更改布局所代表的设备模型。\n\
  *   **C – Component Tree（组件树）** – 如前一章（“理解 Android 视图、视图组和布局”））所示，用户界面是使用层级结构构建的。组件树提供了用户界面设计层级的视觉概览。从组件树中选择一个元素将导致布局中相应的视图被选中。同样，从设备屏幕布局中选择一个视图将会在组件树层级中选中该视图。\n\
  *   **D – Attributes（属性）** – 调色板列出的所有组件视图都带有一组属性，用于调整该视图的行为和外观。布局编辑器的属性面板提供了对布局中当前选中视图属性的访问，允许进行更改。\n\
  *   **E – Toolbar（工具栏）** – 布局编辑器工具栏提供了各种选项的快速访问，包括但不限于：缩放设备屏幕布局、更改当前显示的设备模型、在竖屏和横屏之间旋转布局，以及切换到不同的\
  \ Android SDK API 级别。工具栏还有一组上下文敏感按钮，当在设备屏幕布局中选择相关的视图类型时，这些按钮将会出现。\n*   **F – Mode\
  \ Switching Tabs（模式切换标签页）** – 位于布局编辑器底部的标签页提供了在布局编辑器工具的文本和设计模式之间来回切换。\n\n## 16.4\
  \ 调色板\n布局编辑器调色板组织为两个面板，旨在方便定位和预览用于添加到布局设计中的视图组件。类别面板（标记为 图 16-4 A 中的 A）列出了 Android\
  \ SDK 支持的不同视图组件类别。从列表中选择一个类别时，第二个面板 (B) 将更新以显示属于该类别的组件列表：\n\n![](img/image3147.jpg)\n\
  图 16-4\n\n要从调色板将组件添加到布局画布上，只需简单从组件列表或预览面板中选择该项，将其拖到画布上的所需位置并释放到位。如果要在当前选定的类别中搜索特定组件，可以点击调色板工具栏中的搜索按钮（标记为\
  \ 图 16-4 C 中的 C）并输入组件名称来启动搜索。随着字符的输入，匹配的结果将实时显示在组件列表面板中。如果您不确定组件位于哪个类别中，只需在搜索操作之前或期间简单选择\
  \ `All`（全部）类别即可。\n\n## 16.5 设计与布局视图\n当布局编辑器工具处于设计（Design）模式时，可以通过两种不同的方式查看布局。上方\
  \ 图 16-3 所示的视图是 `Design` 视图，显示了布局和控件在运行的应用程序中的外观。第二种模式被称为 `Layout`（布局）或 `Blueprint`（蓝图）视图，可以替代\
  \ `Design` 视图显示，也可以与其并发显示。图 16-5 所示的工具栏菜单提供了显示 `Design`、`Blueprint` 或两种视图的选项。第四个选项\
  \ `Force Refresh Layout`（强制刷新布局）会导致布局重新构建并重绘。当布局进入意外状态或未能准确反映当前设置时，这非常有用：\n\n![](img/image3156.jpg)\n\
  图 16-5\n\n显示布局视图、设计视图或两者取决于个人偏好。一种很好的方法是从同时显示两者开始，如 图 16-6 所示：\n\n![](img/image3161.jpg)\n\
  图 16-6\n\n## 16.6 文本模式\n在使用 Android Studio 布局编辑器时，重要的是记住它实际上是在提供一种易于的方法来创建 XML 资源文件。在设计过程的任何时候，都可以点击布局编辑器底部的\
  \ `Text` 标签来查看并直接编辑底层 XML。要返回设计模式，只需点击 `Design` 标签。图 16-7 展示了文本模式下 Android Studio\
  \ 布局工具的关键区域：\n\n![](img/image3169.jpg)\n图 16-7\n\n*   **A – Editor（编辑器）** – 编辑器面板显示构成用户界面的\
  \ XML。这是完整的 Android Studio 编辑器，包含了 Android 编辑器基础中概述的所有功能。\n*   **B – Preview（预览）**\
  \ – 当对编辑器中的 XML 进行更改时，这些更改会在预览窗口中视觉反映。这为 XML 的更改提供了即时反馈，从而避免了在文本和设计模式之间来回切换。预览还允许像设计模式一样对布局进行直接操作和设计，视觉更改反映在编辑器面板中。与设计模式一样，`Design`\
  \ 和 `Layout` 视图可以使用 图 16-5 中的工具栏按钮显示。\n*   **C – Toolbar（工具栏）** – 文本模式下的工具栏提供了设计模式中可用的的功能。\n\
  *   **D – Mode Switching Tabs（模式切换标签页）** – 位于布局编辑器底部的标签页提供了在布局编辑器的 `Text` 和 `Design`\
  \ 模式之间来回切换。\n\n## 16.7 设置属性\n`Attributes`（属性）面板提供了当前选中组件的所有可用。默认情况下，属性面板显示布局中当前选中组件最常用的更改属性。图\
  \ 16-8， 例如显示了 `TextView` 组件的这部分属性：\n\n![](img/image3180.jpg)\n图 16-8\n\n要访问当前选中组件的所有属性，请点击\
