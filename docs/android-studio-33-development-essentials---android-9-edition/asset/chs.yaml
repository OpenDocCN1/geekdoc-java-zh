  \n也可以通过选择属性窗口工具栏中的搜索按钮并输入属性名称来搜索特定属性。在搜索之前或期间选择 `View all attributes`按钮或链接，以确保当前选中组件的所有属性都包含在结果中。某些属性包含显示三个点的按钮。这表示有一个设置对话框协助选择合适的属性值。要显示对话框，只需点击该按钮。具有有限数量可用选项的属性将呈现下拉菜单\
  \ (图 16-10 ))，可以从中进行选择。\n\n![](img/image3192.jpg)\n图 16-10\n\n## 16.8 配置收藏属性\n包含在初始属性列表中的属性可以通过配置收藏属性来扩展。要将属性添加到收藏列表，显示当前选中组件的所有属性，并将鼠标指针悬停在属性工具窗口内属性条目的最左侧。属性名称左侧会出现一个星形图标，点击它将会将该属性添加到收藏列表。图\
  \ 16-11， 例如显示了配置为收藏属性的 `TextView` 组件的 `autoText`、`background` 和 `backgroundTint`\
  \ 属性：\n\n![](img/image3199.jpg)\n图 16-11\n\n一旦作为收藏，属性将列在主题属性列表 `Favorite Attributes`（收藏属性）部分下方：\n\
  \n![](img/image3205.jpg)\n图 16-12\n\n## 16.9 转换视图\n在布局中将视图从一种类型更改另一种类型（例如将 `TextView`\
  \ 转换为 `EditText`）可以在 Android Studio 布局编辑器中轻松完成，只需在屏幕布局或 `Component tree`（组件树）窗口内右键点击视图，并选择\
  \ `Convert view...`（转换视图...）菜单选项。点击 图 16-9 中高亮的按钮，可以访问所有可的：\n\n![](img/image3205.jpg)\n\
  一旦作为收藏，属性将列在这些可转换的。图 16-13 ， 例如显示了 `TextView` 组件的这些可转换的，其在运行的应用程序中的外观。\n\n## 16.10\
  \ 显示数据\n在使用 Android Studio 布局编辑器时，重要的是记住它实际上是在提供一种易于的方法来创建 XML 资源文件。在设计过程的任何时候，都可以点击布局编辑器底部的\
  \ `Text` 标签来查看并直接编辑底层 XML。要返回设计模式，只需点击 `Design` 标签。图 16-7 展示了文本模式下 Android Studio\
  \ 布局工具的关键区域：\n\n![](img/image3169.jpg)\n图 16-7\n\n*   **A – Editor（编辑器）** – 编辑器面板显示构成用户界面的\
  \ XML。这是完整的 Android Studio 编辑器，包含了 Android 编辑器基础中概述的所有。\n*   **B – Preview（预览）**\
  \ – 当对编辑器中的 XML 进行更改时，这些更改会在预览窗口中视觉反映。这为 XML 的更改提供了即时反馈，从而避免了在文本和设计模式之间来回切换。预览还允许像设计模式一样对布局进行直接操作和设计，视觉更改反映在编辑器面板中。与设计模式一样，`Design`\
  \ 和 `Layout` 视图可以使用 图 16-5 中的工具栏按钮显示。\n*   **C – Toolbar（工具栏）** – 文本模式下的工具栏提供了设计模式中可用的的功能。\n\
  *   **D – Mode Switching Tabs（模式切换标签页）** – 位于布局编辑器底部的标签页提供了在布局编辑器的 `Text` 和 `Design`\
  \ 模式之间来回切换。\n\n# 17. Android ConstraintLayout 指南\n正如标题为理解 Android 视图、视图组和布局 的章节所示，Android\
  \ 提供了许多布局管理器用于设计用户界面。在 Android 7 中，Google 引入了一种新的布局，旨在解决许多旧布局器的缺点。这种新布局被称为 `ConstraintLayout`，它将简单、灵活且灵活的布局系统与\
  \ Android Studio 布局工具中强大的功能相结合，以便创建自动适应不同屏幕尺寸和设备方向变化的响应式用户界面布局。本章将概述 `ConstraintLayout`\
  \ 的基本概念，而下一章将详细概述如何在 Android Studio 布局工具中使用 `ConstraintLayout` 创建基于约束的布局。\n\n##\
  \ 17.1 ConstraintLayout 如何工作\n与其他布局一样，`ConstraintLayout` 负责管理它包含的视觉组件（也称为组件）的位置和大小行为。它是根据设置在每个子组件上的约束连接来实现此的。为了完全理解和使用\
  \ `ConstraintLayout`，理解以下关键概念是重要的：\n\n\n\n\n\n# 约束\n\n*   约束 (Constraints)\n*  \
  \ 边距 (Margins)\n*   相对约束 (Opposing Constraints)\n*   约束偏移 (Constraint Bias)\n* \
  \  链 (Chains)\n*   链样式 (Chain Styles)\n*   障碍 (Barriers)\n\n### 17.1.1 约束\n`Constraints`\
  \ 本质上是一组规则，规定了组件相对于其他组件、`ConstraintLayout`边缘以及名为 `guidelines` 的特殊元素的对齐和距离方式。`Constraints`\
  \ 还决定了 Activity 的界面布局如何响应设备方向的变化，或者在不同屏幕尺寸的设备上显示。为了正确配置，组件必须具有足够的约束连接，以便 `ConstraintLayout`\
  \ 布局引擎能够在水平和垂直平面上解析其位置。\n\n### 17.1.2 边距\n边距是一种指定固定距离的约束。考虑一个需要放置在设备屏幕右上角的 `Button`\
  \ 对象。这可以通过实现 `Button` 顶部和右边缘的边距约束，并连接到父级 `ConstraintLayout` 的相应侧来实现，如图 17-1 所示：![](img/image3284.jpg)Figure\
  \ 17-1\n\n如上图所示，这些约束连接中的每一个都关联着一个边距值，规定了组件距离父布局两个侧的固定距离。在此配置下，无论屏幕大小或设备方向如何，`Button`\
  \ 对象将始终根据两个约束连接的指定，分别距离父级 `ConstraintLayout` 的顶部和右边缘 20 和 15 个设备无关像素（`dp`）。虽然上述配置在某些情况下是可以接受的，但它并没有为让\
  \ `ConstraintLayout` 布局引擎通过调整组件位置来以响应设备旋转并支持不同尺寸的屏幕提供任何灵活性。为了给布局添加这种响应性，有必要实现相对约束。\n\
  \n### 17.1.3 相对约束\n在单个组件上沿同一轴运行的两个约束被称为相对约束。换句话说，左侧和右侧均具有约束的组件被认为具有水平相对约束。例如，图 17-2\
  \ 展示了在之前的布局中同时添加水平和垂直相对约束：![](img/image3293.jpg)Figure 17-2\n\n这里需要理解的关键点是，一旦在特定轴上实现了相对约束，组件的位置将基于百分比而非坐标。例如，组件不再被固定在距离布局顶部\
  \ 20dp 处，而是位于在距离布局顶部 30% 的位置。在不同的方向以及在更大或更小的屏幕上运行时，`Button` 将始终处于相对于父布局尺寸的相同位置。\n\
  \n现在重要的是要理解，图 17-2 中概述的布局不仅是通过相对约束实现的，还通过应用了约束偏移来实现的。\n\n### 17.1.4 约束偏移\n现在已经确定，`ConstraintLayout`\
  \ 中的组件可能会受到相对约束连接的影响。默认情况下，相对约束是相等的，导致相应的组件在相对轴上居中。例如，图 17-3 显示了一个使用水平和垂直相对约束在包含它的\
  \ `ConstraintLayout` 内部居中的组件：![](img/image3302.jpg)Figure 17-3\n\n为了在存在相对约束的情况下调整组件位置，`ConstraintLayout`\
  \ 实现了一种名为“约束偏移”（constraint bias）的功能。约束偏移允许组件沿相对轴的定位根据指定的百分比向其中一个约束倾斜。例如，图 17-4 显示了之前的约束布局，具有\
  \ 75% 的水平偏移和 10% 的垂直偏移：![](img/image3308.jpg)Figure 17-4\n\n下一章标题为“在 Android Studio\
  \ 中使用 ConstraintLayout 指南，将更详细地介绍这些概念，并解释这些功能是如何集成到 Android Studio 布局编辑器工具中的。然而，在此期间，还需要涵盖\
  \ `ConstraintLayout` 类的其他领域。\n\n### 17.1.5 链\n`ConstraintLayout` 链提供了一种将两个或多个组件的布局行为定义为组的方法。链可以在垂直或水平轴上声明，并配置为以定义链中组件的间距和大小。当组件通过双向约束连接在一起时，它们就形成了链。例如，图\
  \ 17-5 展示了以这种方式链的三个组件：![](img/image3317.jpg)Figure 17-5\n\n链中的第一个元素是链头（chain head），它在垂直链中对应顶部组件，在水平链中则对应最左侧的组件。整个链的布局行为主要通过设置链头的属性来配置。\n\
  \n### 17.1.6 链样式\n`ConstraintLayout` 链的布局行为由应用于链头的链样式决定。`ConstraintLayout` 类目前支持以下链样式：\n\
  \n*   ![](img/image3331.jpg)Figure 17-6\n*   ![](img/image3343.jpg)Figure 17-7\n\
  *   ![](img/image3354.jpg)Figure 17-8\n*   ![](img/image3365.jpg)Figure 17-9\n\n\
  ## 17.2 基准线对齐\n到目前为止，本章仅提到了相对于组件边缘的对齐约束（通常称为侧边约束）。然而，一个常见的需求是让组件相对于其显示的内容进行对齐，而不是组件本身的边界。为了满足这一需求，`ConstraintLayout`\
  \ 提供了基准线（baseline）支持。\n\n例如，假设图 17-1 之前的布局需要一个 `TextView` 组件位于 `Button` 左侧 40dp\
  \ 处。在这种情况下，`TextView` 需要与 `Button` 对齐基线。这意味着 `Button` 的文本需要与 `TextView` 中的文本垂直对齐。该布局的额外约束需要如图\
  \ 17-10 所示进行连接：![](img/image3373.jpg)Figure 17-10\n\n`TextView` 现在垂直对齐 `Button`\
  \ 的基准线，并在水平上距离 `Button` 40dp。\n\n## 17.3 使用指南\n`guidelines` 是 `ConstraintLayout`\
  \ 中提供的特殊元素，提供了可以连接到约束的额外目标。可以在 `ConstraintLayout` 实例中添加多个指南，这些指南可以配置为水平或垂直方向。一旦添加，就可以从布局中的组件到指南建立约束连接。这在多个组件需要沿某个轴线对齐时特别有用。例如，图\
  \ 17-11 显示了 `ConstraintLayout` 中的三个 `Button` 对象沿垂直指南进行约束![](img/image3381.jpg)Figure\
  \ 17-11\n\n## 17.4 配置组件尺寸\n控制组件的尺寸是用户界面设计过程中的关键要素。`ConstraintLayout` 提供了三种选项，可以设置在单个组件上以管理尺寸行为。这些设置针对高度和宽度维度单独配置的：\n\
  \n*   固定 (Fixed) – 组件固定为指定的尺寸。\n\n\n\n\n\n- `Match Constraint` – 允许布局引擎调整组件的大小以满足现行的约束条件。也被称为\
  \ `AnySize` 或 `MATCH_CONSTRAINT` 选项。\n- `Wrap Content` – 组件的大小由其包含的内容（即文本或图形）决定。\n\
  \n\n\n\n## 17.5 使用屏障 (Barriers)\n与指南（guidelines）类似，屏障是用于约束布局内视图的虚拟视图。与指南一样，屏障可以是垂直或水平方向的，并且一个或多个视图可以被约束在其（为了避免混淆，这些视图被称为**受约束视图**）。然而，与指南在布局中保持固定位置不同，屏障的位置是由一组所谓的**参考视图**（reference\
  \ views）定义的。引入屏障是为了解决某些经常发生的视图重叠问题。例如，考虑下方的图 17-12 所示的布局：\n\n![](img/image3397.jpg)\n\
  图 17-1 2\n\n上述布局需要注意的关键点是：`View 3` 的宽度被设置为匹配约束模式，且该视图的左边缘连接到 `View 1` 的右边缘。按照目前的实现方式，增加\
  \ `View 1` 的宽度将产生预期效果，即减小 `View 3` 的宽度：\n\n![](img/image3403.jpg)\n图 17-13\n\n然而，如果增加的是\
  \ `View 2` 而不是 `View 1`，就会出现问题：\n\n![](img/image3409.jpg)\n图 17-14\n\n显然，由于 `View\
  \ 3` 只受到 `View 1` 的约束，它不会调整大小来适应 `View 2` 宽度的增加，导致视图重叠。\n\n解决此问题的方法是添加一个垂直屏障并将 `Views\
  \ 1` 和 `Views 2` 分为屏障的参考视图，以便它们控制屏障的位置。`View 3` 的左边缘将相对于屏障进行约束，使其成为受约束视图。\n\n现在当\
  \ `View 1` 或 `View 2` 的宽度增加时，屏障将移动以适应两个视图中较宽的一个，导致 `View 3` 的宽度相对于新的屏障位置发生变化：\n\n\
  ![](img/image3417.jpg)\n图 17-15\n\n在使用屏障时，与单个屏障关联的参考视图和受约束视图的数量没有限制。\n\n## 17.6\
  \ 比例 (Ratios)\n小组件的尺寸可以使用比例设置来定义。例如，可以使用比例设置来约束小组件，使得无论任何缩放行为如何，其宽度始终是高度的两倍。\n\n\
  ## 17.7 ConstraintLayout 的优势\nConstraintLayout 提供了足够的灵活性，使得可以在单个布局实例中实现旧版布局的许多功能，而以前可能需要嵌套多个布局。这样做的好处是允许设计所谓的“扁平化”或“浅层”布局层级，从而避免了布局嵌套固有的问题，使布局不再那么复杂，并提高了运行时用户界面的渲染性能。\n\
  \n实现 ConstraintLayout 的初衷是为了解决当今市面上广泛的 Android 设备屏幕尺寸问题。ConstraintLayout 的灵活性使得设计能够响应并适应运行\
  \ App 设备的用户界面变得更加容易。\n\n最后，正如题为在 Android Studio 中使用 ConstraintLayout 的指南的章节将演示的，Android\
  \ Studio 布局编辑器工具已专门针对基于 ConstraintLayout 的用户界面设计进行了增强。\n\n## 17.8 ConstraintLayout\
  \ 的可用性\n尽管 ConstraintLayout 是随 Android 7 引入的，但它是作为主 Android SDK 的独立支持库提供的，并兼容低至\
  \ API 级别 9 (Gingerbread) 的旧版本 Android 版本。这使得使用这种新布局的应用程序可以在运行较旧版本 Android 的设备上运行。\n\
  \n## 17.9 总结\nConstraintLayout 是随 Android 7 引入的布局管理器。它的设计旨在便于创建灵活的布局，以适应目前市面上许多\
  \ Android 设备的尺寸和方向。ConstraintLayout 使用约束来控制小组件相对于父 ConstraintLayout 实例、指南、屏障以及布局中其他小组件的对齐和定位。ConstraintLayout\
  \ 是新创建的 Android Studio 项目的默认布局，也是设计用户界面布局时的推荐选择。通过这种简单而灵活的布局管理方法，可以以惊人的简单性实现复杂的响应式用户界面。\n\
  \n# 18. 在 Android Studio 中使用 ConstraintLayout 的指南\n正如在前面的章节中多次提到的，Google 对 Android\
  \ Studio 布局编辑器工具进行了重大更改，其中许多更改纯粹是为了支持使用 ConstraintLayout 进行用户界面布局设计。既然上一章已经概述了 ConstraintLayout\
  \ 的基本概念，本章将详细探讨这些概念，同时概述布局编辑器工具允许设计和实现基于 ConstraintLayout 的用户界面的方法。\n\n## 18.1 设计与布局视图\n\
  题为“Android Studio 布局编辑器工具指南的章节解释了，Android Studio 布局编辑器工具提供了两种方式以设计（Design）和布局（Layout，也称为蓝图\
  \ blueprint）视图的形式查看 Activity 的界面布局。这些布局视图可以单独显示，也可以像图 18-1 所示并排显示：\n\n![](img/image3441.jpg)\n\
  图 18- 1\n\n设计视图（位于上方左侧）提供了布局的“所见即所得”表示，即布局在应用中的外观。另一方面，布局视图显示的是蓝图风格，其中小组件由阴影表示。如上方图\
  \ 18-1 所示，布局视图也显示约束连接（在此例中用于在布局内居中）。当选择布局中的特定小组件或鼠标指针悬停在设计区域时，这些约束也会叠加到设计视图上，如图\
  \ 18-2 所示（注：原文为 18-2）：\n\n![](img/image3447.jpg)\n图 18- 2\n\n两个视图中约束连接的外观可以使用图 18-3\
  \ 所示的工具栏进行更改：\n\n![](img/image3453.jpg)\n图 18- 3\n\n除了显示界面布局的两种模式外，布局编辑器工具还提供了三种建立特定布局约束的方法。\n\
  \n## 18.2 自动连接模式 (Autoconnect Mode)\n自动连接如其所示，在项添加到布局时会自动建立约束连接。可以使用图 18-4 所示的工具栏按钮启用或禁用自动连接模式：\n\
  \n![](img/image3461.jpg)\n图 18- 4\n\n自动连接模式使用算法根据小组件的位置以及与父布局边界和布局其他元素的距离来决定建立的最佳约束。如果自动连接未能提供预期的行为，可以在本章后续部分进行手动更改。\n\
  \n## 18.3 推断模式 (Inference Mode)\n推断模式使用启发式方法、算法和概率，在小组件添加到布局后自动实现约束连接。这种模式通常用于关闭自动连接功能且在没有任何约束连接的情况下将对象添加到布局时。这允许通过简单地从调板将对象拖到画布上并进行尺寸和位置更改来设计布局。本质上，这涉及到在不担心约束的情况下“绘制”布局。在设计过程中任何时候都可以推断模式来填充布局中缺失的约束。当点击图\
  \ 18-5 推断按钮时，约束会自动添加到布局中：\n\n![](img/image3470.jpg)\n图 18- 5\n\n使用自动连接模式，始终存在布局编辑器工具推断错误约束的可能性，尽管这些可以手动修改和纠正。\n\
  \n## 18.4 手动操作约束\n实现约束连接的第三种选择是手动操作。在操作时，理解布局编辑器工具中小组件周围出现的各种句柄将很有帮助。例如考虑图 18-6\
  \ 所示的小组件：\n\n![](img/image3478.jpg)\n图 18- 6\n\n显然，弹簧状线条（`A`）代表从小组件侧到目标的已建立约束连接。对象每个角的小方形标记（`B`）是调整句柄，点击并拖动它们可以调整小组件的大小。位于小组件每侧的小圆句柄（`C`）是侧约束锚点。要创建约束连接，点击句柄并将生成的线拖到要连接的元素上（如指南或父布局或另一个小组件的侧边），如图\
  \ 18-7 所示。连接到另一个小组件的侧边时，只需将线拖到该小组件的侧约束句柄，并在变绿时释放线。\n\n![](img/image3484.jpg)\n图\
  \ 18- 7\n\n额外的标记指示基线约束的锚点，其中小组件内部的内容（而不是边缘）被用作对齐点。要显示此标记，只需点击显示字母 `ab` 的按钮（图 18-6\
  \ 中的标记 `D` ）。从基线约束句柄建立约束连接，只需将鼠标指针悬停在句柄上直到它开始闪烁，然后点击并拖动到目标（如图 18-8 所示的另一个小组件的基线锚点）。当目标锚点开始闪绿时，释放鼠标按钮建立约束连接：\n\
  \n![](img/image3490.jpg)\n图 18- 8\n\n隐藏基线锚点只需再次点击基线按钮。\n\n## 18.5 在检查器 (Inspector)\
  \ 中添加约束\n也可以使用图 18-9 所示的属性窗口中的检查器面板向布局编辑器中的视图添加约束。中间的正方形表示当前选中的视图以及周围的应用到视图相应侧边的区域：\n\
  \n![](img/image3498.jpg)\n图 18- 9\n\n视图侧缺失约束由指向带有加号蓝圈的虚线表示（如视图底部的情况）。要添加约束，只需点击此蓝圈，布局编辑器将在它认为最合适的位置添加约束。\n\
  \n## 18.6 删除约束\n要删除单个约束，只需点击其连接的锚点。该约束将从布局中删除（悬停在锚点上它会发红以指示删除）：\n\n![](img/image3506.jpg)\n\
  图 18- 10\n\n或者，通过选择小组件并点击在布局中被选中时出现在图 18-11 旁边的“全部删除”按钮来移除小组件的所有约束：\n\n![](img/image3512.jpg)\n\
  图 18- 11\n\n要移除布局中每个小组件的所有约束，使用图 18-12 所示的工具栏按钮：\n\n![](img/image3518.jpg)\n图 18-\
  \ 2\n\n## 18.7 调整比例 (Bias)\n在上一章中概述了使用比例设置倾向于另一种相反约束的概念。Android Studio 布局编辑器中的比例使用属性窗口中的检查器进行调整，如图\
  \ 18-13 所示。图中指示的两个滑块用于控制当前选中小组件的垂直和水平相反约束的比例：\n\n![](img/image3525.jpg)\n图 18- 3\n\
  \n## 18.8 理解 ConstraintLayout 间距\n可以配合间距来实现小组件与另一个元素（例如另一个小组件、指南或父布局的侧边）之间的固定间隙。例如考虑图\
  \ 18-14 应用于按钮对象的水平约束：\n\n![](img/image3532.jpg)\n图 18- 4\n\n按照目前的配置，水平约束运行到父 ConstraintLayout\
  \ 的左右边缘。因此，小组件具有相反水平约束，表示 ConstraintLayout 布局引擎对运行时小组件的实际定位具有裁量权。这使得布局具有灵活性来适应不同的屏幕尺寸和设备方向。水平比例设置还可以控制小组件的位置直到布局的右侧。例如，图\
  \ 18-15 显示了应用了 100% 水平比例的同一个按钮：\n\n![](img/image3538.jpg)\n图 18- 5\n\nConstraintLayout\
  \ 间距可以出现在约束连接末端，代表一个固定间隙，即使调整比例或响应 Activity 其他处的布局更改，小组件也无法移动。在图 18-16 中，右侧约束现在包含一个\
  \ 50dp 的间距，尽管比例仍设为 100%，小组件也无法移动。\n\n![](img/image3544.jpg)\n图 18- 6\n\n小组件上现有的间距值可以在检查器内部进行修改。如图\
  \ 18-17 所示，正在使用下拉菜单将当前选中小组件的右侧间距更改为 16dp。或者，点击当前值也允许在字段中输入数字。\n\n![](img/image3550.jpg)\n\
  图 18- 7\n\n新约束的默认间距可以随时使用图 18-18 所示的工具栏中的选项进行更改：\n\n![](img/image3556.jpg)\n图 18-\
  \ 8\n\n## 18.9 相反约束和比例的重要性\n正如上一章讨论的，相反约束、间距和比例构成了使用 ConstraintLayout 时 Android\
  \ 响应式布局设计的基石。当小组件在没有相反约束连接的情况下被约束时，这些约束本质上是间距约束。这在布局编辑器中通过带有间距测量的实线视觉化，如图 18-19\
  \ 所示：\n\n![](img/image3563.jpg)\n图 18- 9\n\n上述约束本质上将小组件固定在该位置。结果是，如果设备旋转到横屏模式，由于垂直约束将其推出了屏幕顶部，它将不再可见（如果\
  \ App 在比设计时更小的屏幕上运行，也会出现类似的问题）。\n\n![](img/image3569.jpg)\n图 18- 2\n\n实现相反约束时，约束连接由弹簧状线条表示（弹簧比喻旨在表示小组件的位置没有固定的\
  \ X 和 Y 坐标）：\n\n![](img/image3575.jpg)\n图 18- 21\n\n在上述布局中，垂直和水平比例设置已配置，使得小组件始终位于距离底部\
  \ 90% 和距离左边缘 35% 的位置。因此，旋转后，小组件相对于屏幕尺寸仍然可见且位置相同。\n\n在设计响应式和自适应用户界面布局时，手动设计用户界面布局和纠正自动创建的约束时，考虑到比例和相反约束是非常重要的。\n\
  \n使用了 ConstraintLayout 的基本概念，本章将详细探讨这些概念，同时概述布局编辑器工具允许设计和实现基于 ConstraintLayout 的用户界面的方法。\n\
  \n## 18.10 配置小组件尺寸\nConstraintLayout 内部小组件的尺寸也可以使用检查器进行配置。正如上一章概述的，小组件尺寸可以设置为封装内容、固定或匹配约束模式。当前选中小组件的每个维度的现有设置显示在检查器中代表小组件的正方形内，如图\
  \ 18-23 所示：\n\n![](img/image589.jpg)\n图 18- 23\n\n在上述图中，水平和垂直维度都被设置为封装内容模式（由向内的箭头指示）。检查器使用以下视觉指示来表示这三种维度模式：\n\
  \n\n\n\n\n| 固定大小 |\n| 匹配约束 |\n| 裹内容 |\n\n\n\n\n要更改当前设置，只需点击指示器即可在三个不同的设置之间循环切换。当布局编辑器内视图的维度设置为“匹配约束”（match\
  \ constraint）模式时，视图对应的侧边将使用类似弹簧线条代替普通的直线绘制。例如，在图 18-24 中，仅视图的宽度被设置为匹配约束：\n\n![](img/image3627.jpg)图\
  \ 18-22 4\n\n此外，可以使用`水平扩展（Expand horizontally）`和`垂直扩展（Expand vertically）`选项将组件的大小水平或垂直方向扩展到约束以及布局其他组件允许的最大值。可以通过右键点击布局中的组件并在弹出的菜单中选择`组织（Organize）`选项来访问这些功能（图\
  \ 18-25）。使用时，当前选中的组件将水平或垂直增大尺寸以填充其周围的可用空间。\n\n![](img/image3632.jpg)图 18-2 5\n\n\
  ### 18.1 添加辅助线\n辅助线提供了可以锚定约束的元素。可以通过右键点击布局并选择`添加垂直辅助线（Add Vertical Guideline）`或`添加水平辅助线（Add\
  \ Horizontal Guideline）`菜单选项，或者使用工具栏选项（如图 18-26 所示）来添加辅助线：\n\n![](img/image3639.jpg)图\
  \ 18-2 6\n\n添加后，辅助线将以虚线的形式出现在布局中，可以通过点击拖动线条进行移动。要与辅助线建立约束连接，点击组件的约束处理器并在释放前拖动到辅助线。在图\
  \ 18-27 中，两个`按钮`的左侧通过约束连接到一条垂直辅助线。\n\n垂直辅助线的位置可以指定为相对于父布局左侧或右侧的绝对距离（水平辅助线为顶部或底部）。例如，上图中的垂直辅助线位于父布局左边缘\
  \ `96dp` 处。\n\n![](img/image3646.jpg)图 18-2 7\n\n或者，辅助线也可以相对于父布局总宽度或高度的百分比进行定位。要在这三种模式之间切换，选择辅助线并点击辅助线顶部或起始处的圆圈（取决于辅助线是垂直还是水平）。例如，图\
  \ 18-28 显示了一个基于百分比定位的辅助线：\n\n![](img/image3652.jpg)图 18-2 8\n\n### 18.12 添加屏障\n\
  通过右键点击布局并在`辅助工具（Helpers）`菜单中选择`添加垂直屏障（Add Vertical Barrier）`或`添加水平屏障（Add Horizontal\
  \ Barrier）`选项，或者如之前在图 18-26 所示使用工具栏选项来添加屏障。一旦向布局添加屏障，它将作为`组件树（Component Tree）`面板条目出现：\n\
  \n![](img/image3660.jpg)图 18-2 9\n\n要将视图作为引用视图（即控制屏障位置的视图），只需将`组件树`中的组件拖动到屏障条目上。例如，在图\
  \ 18-30 中，名为`textView1`和`textView2`的组件被分配为`barrier1`的引用组件：\n\n![](img/image3667.jpg)图\
  \ 18-3 0\n\n添加引用视图后，需要配置屏障以指定屏障相对于这些视图的方向。这是屏障方向设置，当在`组件树`面板中选择屏障时，在`属性（Attributes）`工具窗口中定义：\n\
  \n![](img/image3675.jpg)图 18-3 31\n\n下图显示了一个包含屏障的布局，其中`textView1`和`textView2`作为引用视图，`textview3`作为受约束的视图。由于屏障是从引用视图的末端向受约束视图推动，因此屏障方向已设置为`结束（end）`：\n\
  \n![](img/image3682.jpg)图 18-3 2\n\n### 18.13 组件组对齐与分布\nAndroid Studio 布局编辑器工具在布局中选择两个或多个组件时，提供了一系列对齐和分布操作。只需\
  \ shift-点击每个要包含在操作中的组件，右键点击布局并从`对齐（Align）`菜单中显示的许多选项中进行选择：\n\n![](img/image3689.jpg)图\
  \ 18-3 3\n\n如图 18-34 所示，这些选项也以按钮形式出现在布局工具栏中：\n\n![](img/image3695.jpg)图 18-3 4\n\
  \n同样，`打包（Pack）`菜单（图 18-35）可以重新排列选中组件，使其垂直或水平打包。这通过更改组件的绝对`x`和`y`坐标实现，但不应用任何约束。另一方面，`打包`菜单中的两个分布选项移动选中组件使其在垂直或水平轴上均匀分布，并应用视图间的约束。\n\
  \n![](img/image3701.jpg)图 18-3 5\n\n### 18.14 将布局转换为 ConstraintLayout\n对于使用一个或多个其他布局（如`RelativeLayout`或`LinearLayout`）的现有用户界面，布局编辑器提供了将用户界面转换为`ConstraintLayout`的选项。当布局编辑器打开并处于`设计（Design）`模式时，`组件树`面板会显示。要转换布局，在`组件树`中找到它，右键点击并选择`转换为布局（Convert\
  \ layout to）`选项：\n\n![](img/image3709.jpg)图 18-3 6\n\n选择此菜单选项时，Android Studio 将选中布局转换为`ConstraintLayout`并使用推理建立匹配原始布局类型的约束。\n\
  \n### 18.15 总结\n重新设计的布局编辑器结合`ConstraintLayout`使得在 Android Studio 中设计复杂的用户界面布局变得快速直观。本章涵盖了约束、间距和偏移（bias）的概念，并将基于`ConstraintLayout`的设计集成到了布局编辑器中。\n\
  \n# 19 在 Android Studio 中使用链和比例\n之前的章节介绍了`ConstraintLayout` 类的关键功能，并概述了在 Android\
  \ Studio 布局编辑器中基于`ConstraintLayout`的用户界面设计的最佳实践。虽然在`Android ConstraintLayout 指南（A\
  \ Guide to the Android ConstraintLayout``）章节中概述了链和比例的概念，但我们尚未解决如何在布局编辑器中使用这些功能。因此，本章的重点是提供使用`ConstraintLayout`类创建和管理链与比例的实际步骤。\n\
  \n### 19.1 创建链（Chain）\n可以通过向活动的 XML 布局文件添加几行或使用布局编辑器的特定功能来实现链。考虑由三个`按钮`组件组成的布局，它们被约束在`ConstraintLayout`父布局的左上、顶部和右上，如图\
  \ 19-1 所示：\n\n![](img/image3727.jpg)图 19-1\n\n为了表示这种布局，XML 资源布局可能包含以下按钮条目：\n```xml\n\
  <Button android:id=\"@+id/button1\" android:layout_width=\"wrap_content\" android:layout_height=\"\
  wrap_content\" android:layout_marginStart=\"8dp\" android:layout_marginTop=\"16dp\"\
  \ android:text=\"Button\" android:layout_constraintHorizontal_bias=\"0.5\" android:layout_constraintStart_toStartOf=\"\
  parent\" android:layout_constraintTop_toTopOf=\"parent\" />\n<Button android:id=\"\
  @+id/button2\" android:layout_width=\"wrap_content\" android:layout_height=\"wrap_content\"\
  \ android:layout_marginEnd=\"8dp\" android:layout_marginStart=\"8dp\" android:layout_marginTop=\"\
  16dp\" android:text=\"Button\" android:layout_constraintHorizontal_bias=\"0.5\"\
  \ android:layout_constraintEnd_toStartOf=\"@+id/button3\" android:layout_constraintStart_toEndOf=\"\
  @+id/button1\" android:layout_constraintTop_toTopOf=\"parent\" />\n<Button android:id=\"\
  @+id/button3\" android:layout_width=\"wrap_content\" android:layout_height=\"wrap_content\"\
  \ android:layout_marginEnd=\"8dp\" android:layout_marginTop=\"16dp\" android:text=\"\
  Button\" android:layout_constraintHorizontal_bias=\"0.5\" android:layout_constraintEnd_toEndOf=\"\
  parent\" android:layout_constraintTop_toTopOf=\"parent\" />\n```\n目前的配置没有双向约束来将这些组件组成一条链。为了解决这个问题，需要从`button1`的右侧向`button2`的左侧，以及从`button3`的左侧向`button2`的右侧添加额外的约束，如下：\n\
  ```xml\n<Button android:id=\"@+id/button1\" android:layout_width=\"wrap_content\"\
  \ android:layout_height=\"wrap_content\" android:layout_marginStart=\"8dp\" android:layout_marginTop=\"\
  16dp\" android:text=\"Button\" android:layout_constraintHorizontal_bias=\"0.5\"\
  \ android:layout_constraintStart_toStartOf=\"parent\" android:layout_constraintTop_toTopOf=\"\
  parent\" android:layout_constraintEnd_toStartOf=\"@+id/button2\" />\n<Button android:id=\"\
  @+id/button2\" android:layout_width=\"wrap_content\" android:layout_height=\"wrap_content\"\
  \ android:layout_marginEnd=\"8dp\" android:layout_marginStart=\"8dp\" android:layout_marginTop=\"\
  16dp\" android:text=\"Button\" android:layout_constraintHorizontal_bias=\"0.5\"\
  \ android:layout_constraintEnd_toStartOf=\"@+id/button3\" android:layout_constraintStart_toEndOf=\"\
  @+id/button1\" android:layout_constraintTop_toTopOf=\"parent\" />\n<Button android:id=\"\
  @+id/button3\" android:layout_width=\"wrap_content\" android:layout_height=\"wrap_content\"\
  \ android:layout_marginEnd=\"8dp\" android:layout_marginTop=\"16dp\" android:text=\"\
  Button\" android:layout_constraintHorizontal_bias=\"0.5\" android:layout_constraintEnd_toEndOf=\"\
  parent\" android:layout_constraintTop_toTopOf=\"parent\" android:layout_constraintStart_toEndOf=\"\
  @+id/button2\" />\n```\n通过这些更改，组件现在具有双向约束。这本质上构成了一个在布局编辑器中通过链连接表示的`ConstraintLayout`\
  \ 链，如图 19-2 所示：\n\n![](img/image3801.jpg)图 19-2\n\n也可以通过右键点击视图并选择`链 -> 创建水平链（Chains\
  \ -> Create Horizontal Chain）`或`链 -> 创建垂直链（Chains -> Create Vertical Chain）`来创建链。\n\
  \n### 19.2 更改链样式\n如果没有配置链样式，`ConstraintLayout`将默认设置为`分布（spread）`样式。可以通过选择链中的任何组件并点击图\
  \ 19-3 所示的`循环样式（Cycle Style）`按钮来更改样式：\n\n![](img/image3809.jpg)图 19-3\n\n每当点击链按钮时，样式就会在分布、内部分布（spread\
  \ inside）和打包（packed）之间切换。或者，也可以在`属性`工具窗口中点击`查看全部（View all）`链接，展开`约束`部分并根据链的方向更改`horizontal_chainStyle`或`vertical_chainStyle`属性：\n\
  \n![](img/image3816.jpg)图 19-4\n\n### 19.3 内部分布（Spread Inside）样式\n图 19-5 展示了使用上述技术将链样式改为内部分布（spread\
  \ inside）的效果：\n\n![](img/image3823.jpg)图 19-5\n\n### 19.4 打包（Packed）样式\n使用相同的技术，将`chainStyle`属性设置为`packed`会导致布局发生如图\
  \ 19-6 所示的变化：\n\n![](img/image3830.jpg)图 19-6\n\n### 19.5 带有偏移（Bias）的打包样式\n打包链的位置可能会受到偏移值的影响。偏移可以是`0.0`到`1.0`之间的任何值，其中`0.5`代表父布局的中心。偏移通过选择链头组件并在`属性`面板的`horizontal_bias`或`vertical_bias`属性中赋值来控制。图\
  \ 19-7 显示了一个水平偏移设置为`0.2`的打包链：\n\n![](img/image3837.jpg)图 19-7\n\n### 19.6 权重链（Weighted\
  \ Chain）\n链的最后一个区域涉及对单个组件进行加权，以控制每个组件在可用空间内占据的空间。权重链仅使用分布样式实现，并且链中任何响应权重属性的组件必须将其相应的维度属性（垂直链为高度，水平链为宽度）配置为匹配约束（match\
  \ constraint）模式。组件维度的匹配约束可以通过选择组件、显示`属性`面板并将维度更改为`match_constraint`来配置。例如，在图 19-8\
  \ 中，`button1`的`layout_width`约束设置为`match_constraint`，表示组件的宽度将根据现约束设置确定：\n\n![](img/image3844.jpg)图\
  \ 19-8\n\n假设已选择分布样式，并且所有三个按钮都配置为宽度维度设置为匹配约束，则链中的组件将相等扩展以填充可用空间：\n\n![](img/image3850.jpg)图\
  \ 19-9\n\n每个组件相对于链中其他组件占据的空间量可以通过向组件添加权重属性来控制。图 19-10 显示了将`button1`的`horizontal_weight`属性设置为`4`，将`button2`和`button3`都设置为`2`的效果：\n\
  \n![](img/image3856.jpg)图 19-10\n\n由于这些权重值，`button1`占据空间的一半（4/8），而`button2`和`button3`分别占据四分之一（2/8）。\n\
  \n### 19.7 使用比例（Ratios）\n`ConstraintLayout`比例允许组件的一个维度相对于其另一个维度进行调整（也称为宽高比）。例如，可以在`ImageView`上应用比例设置以确保宽度始终是高度的两倍。维度约束是通过将受约束维度设置为匹配模式并配置该组件的`layout_constraintDimensionRatio`属性来实现的。此比例值可以是浮点值或`width:height`比例设置。例如，以下\
  \ XML 片段在`ImageView`上配置了`2:1`的比例：\n\n```xml\n<ImageView\n    android:layout_width=\"\
  0dp\"\n    android:layout_height=\"100dp\"\n    android:id=\"@+id/imageView\"\n\
  \    app:layout_constraintDimensionRatio=\"2:1\" />\n```\n上面的示例演示了当仅一个维度设置为匹配约束时如何配置比例。当两个维度都设置为匹配约束时，也可以应用比例，比例前加以`H`或`W`。考虑以下`ImageView`的\
  \ XML 片段：\n\n```xml\n<ImageView\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    android:id=\"@+id/imageView\"\n    app:layout_toBottomOf=\"parent\"\n\
  \    app:layout_constraintRight_toRightOf=\"parent\"\n    app:layout_constraintLeft_toLeft=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\"\n    app:layout_constraintDimensionRatio=\"\
  W,1:3\" />\n```\n在上面的示例中，高度取决于应用的的。约束将其附加到父布局的顶部和底部，本质上将其拉伸到整个父布局的高度。另一方面，宽度被约束为`ImageView`的高度的三分之一。因此，无论布局显示什么尺寸，`ImageView`的高度与父布局相同，宽度为高度的三分之一。不需要手动编辑\
  \ XML 文件也可以获得相同的结果。每当组件维度设置为匹配约束时，属性面板的`Inspector`区域就会出现比例控制控件。例如，图 19-11 显示了布局宽度和高度分别设置为匹配约束和`100dp`，并在组件预览中高亮了比例控制控件：\n\
  \n![](img/image3884.jpg)图 19-11\n\n默认情况下，比例调整是关闭的。点击该控件可以启用比例约束并显示可以更改比例的额外字段：\n\
  \n![](img/image3890.jpg)图 19-12 （注：此处图片未在原文中显示）\n\n### 19.8 总结\n链和比例都是`ConstraintLayout`类的强大功能，旨在为\
  \ Android 应用程序中设计灵活的响应式用户界面布局提供额外选项。正如本章概述，Android Studio 布局编辑器已经增强，以便在用户界面设计过程中更容易使用这些功能。\n\
  \n# 20 Android Studio 布局编辑器 ConstraintLayout 教程\n为 Android 应用程序设计用户界面最简单且最高效的方法是使用布局编辑器工具。本章的目标是概述如何使用这种方法创建基于`ConstraintLayout`的用户界面。本章包含的练习也将作为从“空壳”Android\
  \ Studio 项目开始创建活动的机会。在介绍 Android Studio 布局编辑器的使用后，本章还将引入布局检查（Layout Inspector）工具。\n\
  \n### 20.1 布局工具示例\n示例阶段的第一步是创建一个新的 Android Studio 项目。因此，首先启动 Android Studio 并通过选择`文件\
  \ -> 关闭项目`菜单选项关闭之前打开的项目。在欢迎界面选择`新建 Android 项目（Start a new Android project）`快速启动选项。在之前的示例中，我们要求\
  \ Android Studio 为项目创建一个模板活动。然而，我们将使用此教程学习如何手动创建一个全新的活动和相应的布局资源文件，因此在点击`下一步`按钮之前，确保选择了`无活动（No\
  \ Activity）`选项。在`名称`字段中输入`LayoutSample`并指定`com.ebookrenzy.layoutsample`为包名。在点击`完成`按钮之前，将最小\
  \ API 级别设置为`API 26: Android 8.0 (Oreo)`并将语言菜单设置为`Java`。\n\n### 20.2 创建新活动\n一旦项目创建完成，将出现\
  \ Android Studio 主窗口且没有打开工具窗口。项目的下一步是创建一个新活动。这将是一个非常有价值的学习练习，因为在开发 Android 应用程序的过程中有很多情况需要从零创建新活动。首先使用`Alt-1/Cmd-1`快捷键显示`项目`工具窗口。显示后，点击项目窗口条目右侧的箭头以展开层级。这里的目标是访问项目层级中的`app\
  \ -> java -> com.ebookrenzy.layoutsample`文件夹。一旦包名可见，右键点击它并如图 20-1 所示选择`新建活动 -> 空活动（New\
  \ Activity -> Empty Activity）`菜单选项：\n\n![](img/image3913.jpg)图 20-1\n\n在弹出的`新建活动`对话框中，将活动命名为`MainActivity`，布局命名为`activity_main`。该活动当然需要一个布局资源文件，因此确保启用了`生成布局（Generate\
  \ Layout File）`选项。在点击`完成`按钮之前，确保该活动被指定为启动活动（launcher activity）。此时，Android Studio\
  \ 应该已经向项目添加了两个文件。Java 源代码文件位于`app -> java -> com.ebookrenzy.layoutsample`。此外，用户界面的\
  \ XML 布局文件位于`app -> res -> layout`。最后，新活动应添加到`AndroidManifest.xml`文件中：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \ package=\"com.ebookrenzy.layoutsample\">\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/AppTheme\">\n        <activity android:name=\"\
  .MainActivity\">\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n### 20.3 准备布局编辑器\n找到`app -> res -> layout`文件夹并双击`activity_main.xml`布局文件将其加载到布局编辑器。由于本教程的目的是获得约束的经验，请关闭布局编辑器工具栏上的`自动连接（Autoconnect）`功能。禁用后，该按钮将出现一条穿过的线，如图\
  \ 20-2 所示：\n\n![](img/image3948.jpg)图 20-2\n\n### 20.4 向用户界面添加组件\n在`常用（Common）`调板中，将`ImageView`组件拖入显示视图的中心。注意水平和垂直虚线显示了中心。居中时，释放鼠标按钮将视图放置在该位置。一旦放置在布局中，将出现`资源（Resources）`对话框，请求在视图中显示图像。在对话框顶部的搜索栏中输入`galaxy`以找到如图\
  \ 20-4 所示的`galaxys6.png`资源：\n\n![](img/image3963.jpg)图 20-4\n\n选择图像并点击`确定`将其分配给`ImageView`对象。如有必要，使用调整句柄调整`ImageView`的大小并重新放置在布局中心。此时，布局应符合如图\
  \ 20-5 所示：\n\n![](img/image3969.jpg)图 20-5\n\n从调色板的`常用`部分点击并拖动`TextView`对象，并将其放置在位于`ImageView`上方，如图\
  \ 20-6 所示：使用`属性（Attributes）`面板，将`textSize`属性更改为`24sp`，将`文本对齐（textAlignment）`设置为居中并将文本更改为“Samsung\
  \ Galaxy S6”。\n\n![](img/image3976.jpg)图 20-6\n\n在布局底部添加三个`按钮`组件，并将这些视图的文本属性设置为“立即购买”、“定价”和“详情”。完成后的布局现在应符合图\
  \ 20-7 所示：\n\n![](img/image3982.jpg)图 20-7\n\n此时，组件的约束尚不充分，布局引擎能够在运行时对组件进行定位和调整大小。如果现在运行应用，所有组件将位于屏幕的左上角。在布局中添加组件后，使用布局编辑器工具栏上的设备旋转按钮（如图\
  \ 20-8 所示的箭头所示）以横向模式查看用户界面：\n\n![](img/image3989.jpg)图 20-8\n\n缺少约束会导致布局无法适应设备方向的变化，导致内容偏离中心，图像以及三个按钮都位于可视区域之外。显然还需要进行一些工作来使其成为响应式用户界面。\n\
  \n### 20.5 添加约束\n约束是创建适应设备方向和不同屏幕尺寸布局的关键。通过将布局旋转回竖向并选择位于`ImageView`上方的`TextView`组件开始。约束组件后，将`TextView`的左侧、右侧和顶部连接到父布局相应的侧边，如图\
  \ 20-9 所示：\n\n![](img/image3997.jpg)图 20-9\n\n约束`TextView`后，选择`ImageView`实例，并在左侧和右侧建立相对于父布局相应侧边的对应约束。接下来，将`ImageView`的顶部连接到`TextView`的底部，将`ImageView`的底部连接到中心。如有必要，点击并拖动`ImageView`使其位于布局的垂直中心。当`ImageView`仍被选中时，使用`属性`面板中的检查器（Inspector）将其顶部和底部间距分别设置为`24`和`8`，并将高度和宽度维度都设置为匹配约束（match_constraint），以便组件调整大小以匹配约束：\n\
  \n![](img/image4004.jpg)图 20-10\n\n最后的任务是为三个`按钮`组件添加约束。在本例中，按钮将放置在链中。首先通过点击布局编辑器中的开启`自动连接（Autoconnect）`（如图\
  \ 20-2 所示）。接下来点击`立即购买`按钮，然后 shift-点击另外两个按钮。从弹出的菜单中选择`链 -> 创建水平链（Chains -> Create\
  \ Horizontal Chain）`。默认情况下，链将使用分布样式显示，这是本例的正确行为。最后，在`立即购买`按钮的底部和布局的底部之间建立约束。对剩余按钮重复此步骤。\n\
  \n![](img/image4019.jpg)图 20-12\n\n### 20.6 测试布局\n在布局中添加约束后，将屏幕旋转到横向并验证布局适应新的屏幕尺寸。虽然布局编辑器工具提供了一个设计用户界面布局的有用视觉环境，但在测试方面没有运行应用程序的替代品。在物理设备或模拟器上启动应用，并验证用户界面反映了在布局编辑器中创建的布局。如图\
  \ 20-13 所示，横向模式下的运行应用：\n\n![](img/image4027.jpg)图 20-13\n\n非常简单的用户界面设计现在完成。设计更复杂的用户界面布局是上述步骤的延续。只需将视图拖到显示器，根据需要定位、约束并设置属性。\n\
  \n### 20.7 使用布局检查\n可以使用布局检查器工具随时查看构成用户界面布局的组件层级。为了访问这些信息，应用必须在设备或模拟器上运行。应用运行后，选择`工具\
  \ -> 布局检查（Tools -> Layout Inspector）`菜单选项，然后执行检查过程。一旦检查器加载，最左侧面板（A）显示构成用户界面布局的组件层级。中间面板（B）显示布局设计的视觉表示。在视觉布局中点击组件将使该项在层级列表中高亮，从而轻松找到视觉组件相对于整个布局层级的位置。最后，最右侧面板（在图\
  \ 20-14 中标记为 C）包含当前选中组件的所有属性设置，允许对组件的内部配置进行深度分析。\n\n![](img/image4037.jpg)图 20-14\n\
  \n### 20.8 总结\nAndroid Studio 中的布局编辑器工具与`ConstraintLayout`类紧密集成。本章通过创建一个示例用户界面，概述了如何使用布局编辑器工具在添加组件和设置约束方面来实现基于`ConstraintLayout`的用户界面。本章还引入了布局检查工具，该工具对于分析用户界面布局的结构组成非常有用。\n\
  \n# 21. 手动 XML 布局设计\n虽然使用布局编辑器设计布局极大提高了效率，但仍然可以通过编辑 XML 来创建布局。本章将介绍 Android XML\
  \ 布局格式的基础。\n\n### 21.1 手动创建布局\nXML 布局文件的结构实际上非常简单，遵循视图树的分层次处理方法。XML 资源文件的第一行应包含以下标准声明：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n```\n该声明之后是布局的根元素，通常是一个容器视图。这通过开启和闭合标签以及任何设置在视图上的属性来表示。例如，以下\
  \ XML 声明了一个 `ConstraintLayout`视图作为根元素，分配了 ID `activity_main` 并设置了 `match_parent`\
  \ 属性以填充设备显示的所有空间：\n\n```xml\n<android.support.constraint.ConstraintLayout \n   \
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/activity_main\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:paddingLeft=\"16dp\"\n\
  \    android:paddingRight=\"16dp\"\n    android:paddingTop=\"16dp\"\n    android:paddingBottom=\"\
  16dp\"\n    tools:context=\".MainActivity\">\n</android.support.constraint.ConstraintLayout>\n\
  ```\n\n\n\n\n\n* `in` – 英寸。\n* `mm` – 毫米。\n* `pt` – 磅（1/72 英寸）。\n* `dp` – 密度无关像素。一种抽象测量单位，基于设备显示屏相对于\
  \ `160dpi` 显示基准的物理密度进行计算。\n* `sp` – 缩放无关像素。与 `dp` 类似，但会根据用户的字体偏好进行缩放。\n* `px` –\
  \ 实际屏幕像素。不建议使用该单位，因为不同的显示器的每英寸像素数不同。请优先使用 `dp` 而非此单位。\n\n\n\n\n任何需要添加到 `ConstraintLayout`\
  \ 父布局的子元素必须嵌套在起始标签和结束标签之间。在下面的示例中，一个 `Button` 组件被添加 `ConstraintLayout` 的子元素：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<android.support.constraint.ConstraintLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  xmlns:tools=\"http://schemas.android.com/tools\"android:id=\"@+id/activity_main\"\
  android:layout_width=\"match_parent\"android:layout_height=\"match_parent\"android:paddingLeft=\"\
  16dp\"android:paddingRight=\"16dp\"android:paddingTop=\"16dp\"android:paddingBottom=\"\
  16dp\"tools:context=\".MainActivity\"><Buttonandroid:text=\"Button\"android:layout_width=\"\
  wrap_content\"android:layout_height=\"wrap_content\"android:id=\"@+id/button\" /></android.support.constraint.ConstraintLayout>\n\
  ```\n\n按照目前的实现，该按钮没有约束连接。因此，在运行时，按钮将出现在屏幕的左上角（尽管由于父布局分配的内边距缩进了 16dp）。然而，如果在按钮两侧添加了相反的约束，它将显示在布局正中央：\n\
  \n```xml\n<Buttonandroid:id=\"@+id/button\"android:layout_width=\"wrap_content\"\
  android:layout_height=\"wrap_content\"android:text=\"Button\"app:layout_constraintBottom_toBottomOf=\"\
  parent\"app:layout_constraintEnd_toEndOf=\"parent\"app:layout_constraintStart_toStartOf=\"\
  parent\"app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n请注意，每个约束都连接到名为 `activity_main`\
  \ 的元素上，在这种情况下，它是父级 `ConstraintLayout` 实例。要向布局中添加第二个组件，只需将其嵌入 `ConstraintLayout`\
  \ 元素的正文中即可。例如，下面的修改向布局中添加了一个 `TextView` 组件：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<android.support.constraint.ConstraintLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  xmlns:app=\"http://schemas.android.com/apk/res-auto\"xmlns:tools=\"http://schemas.android.com/tools\"\
  android:id=\"@+id/activity_main\"android:layout_width=\"match_parent\"android:layout_height=\"\
  match_parent\"android:paddingLeft=\"16dp\"android:paddingTop=\"16dp\"android:paddingRight=\"\
  16dp\"android:paddingBottom=\"16dp\"tools:context=\".MainActivity\"><Buttonandroid:id=\"\
  @+id/button\"android:layout_width=\"wrap_content\"android:layout_height=\"wrap_content\"\
  android:text=\"Button\"app:layout_constraintBottom_toBottomOf=\"parent\"app:layout_constraintEnd_toEndOf=\"\
  parent\"app:layout_constraintStart_toStartOf=\"parent\"app:layout_constraintTop_toTopOf=\"\
  parent\" /><TextViewandroid:text=\"TextView\"android:layout_width=\"wrap_content\"\
  android:layout_height=\"wrap_content\"android:id=\"@+id/textView\" /></android.support.constraint.ConstraintLayout>\n\
  ```\n\n再次，新添加的 `TextView` 缺少约束会导致它在运行时出现在布局的左上角。下面的修改添加了连接到父布局的相反约束以使组件水平居中，同时添加了一个将\
  \ `TextView` 底部连接到 `button` 顶部的约束，间距为 72dp：\n\n```xml\n<TextViewandroid:layout_width=\"\
  wrap_content\"android:layout_height=\"wrap_content\"android:text=\"Hello World!\"\
  app:layout_constraintBottom_toTopOf=\"@+id/button\"app:layout_constraintStart_toStartOf=\"\
  parent\"app:layout_constraintEnd_toEndOf=\"parent\"android:layout_marginBottom=\"\
  72dp\" />\n```\n\n此外，请注意 `Button` 和 `TextView` 声明了多个属性。两个视图都分配了 ID，并配置为显示由名为 `button_string`\
  \ 和 `text_string` 的字符串资源表示的字符串。此外，两个对象都声明了 `wrap_content` 高宽属性，以便它们的大小能够适应内容（在这种情况下，由字符串资源值引用的文本）。\n\
  \n从布局编辑器文本模式的预览面板中查看，上述布局将呈现如图 21-1 所示：![](img/image4153.jpg)\n\n图 21-1 121.2 手动\
  \ XML vs. 视觉布局设计\n\n## 手动 XML vs. 视觉布局设计\n\n手动编写 XML 而不是使用设计模式下的布局编辑器工具取决于个人喜好。然而，使用设计模式具有其优势。\n\
  \n首先，设计模式通常会更快，因为它避免了输入多行 XML 的必要性。此外，设计模式避免了学习 Android SDK 视图类各种属性值复杂性的需要。与其不断参考\
  \ Android 文档来寻找正确的关键字和值，大多数大多数属性可以通过引用属性（Attributes）面板来找到。\n\n抛开设计模式的所有优势不谈，重要的是，用户界面设计的这两种方法完全不是互斥的。作为应用程序开发者，你很有可能会在设计模式下创建用户界面，而在进行微调和调整时直接编辑生成的\
  \ XML。毕竟，两种用户界面设计方式在 Android Studio 环境中并排显示，使得在 XML 和视觉布局之间进行工作变得容易。\n\n### 21.3\
  \ 总结\n\nAndroid Studio 布局编辑器工具提供了一种直观的方法来设计用户界面。通过拖放范式结合一组属性编辑器，该工具为开发者提供了巨大的生产力优势。用户界面设计也可以通过手动编写\
  \ XML 资源来实现，其格式良好且易于理解。布局编辑器生成 XML 资源的这一事实意味着这两种用户界面设计方法可以结合提供“两者兼得”的方法。\n\n## 使用\
  \ ConstraintSets 管理约束\n\n到为止，所有的用户界面设计任务都是使用布局编辑器在文本或设计模式下完成的。编写 XML 资源或布局编辑器的替代方案是编写\
  \ Java 代码来直接创建、配置和操作组成用户界面的对象。在本章中，在描述布局的一些关键概念之前，我们将探索编写 Java 代码的一些优点。在下一章中，将创建一个示例来演示这种方法的某些典型步骤。\n\
  \n### 22.1 Java 代码 vs. 布局\n\n使用 XML 资源设计用户界面与编写 Java 代码有许多关键优势。事实上，Android 文档详尽阐述了\
  \ XML 优于 Java 代码的优点。XML 方法的一个关键优势包括可以使用布局编辑器工具，它本身会生成 XML 资源。第二个优势是，一旦创建了应用程序，可以通过简单的修改\
  \ XML 文件来更改用户界面，从而避免了重新编译的必要性。此外，即使在编写 XML 布局时，也可以通过布局编辑器的预览功能对用户界面外观获得即时反馈。在 Java\
  \ 代码方面，可能最重要的优势是在处理动态用户界面时。XML 资源在定义静态布局时本质上有用，而 Java 代码在运行时根据外部因素动态创建用户界面时特别有用。最后，一些开发者简单倾向于编写\
  \ Java 代码而不是使用布局工具和 XML。\n\n### 22.2 创建视图\n\n如前所述，Android SDK 包含了视图工具箱以满足大多数用户界面设计需求。在\
  \ Java 中创建视图只需创建这些类的实例，并将引用传递 activity。第一个视图（通常是可以添加额外视图的容器视图）通过调用 activity 的 `ContentView()`\
  \ 方法显示。使用 Java 代码操作 XML 布局文件中的视图时，必须获取视图的 ID。对于 Java 创建的视图同样适用，因此需要为后续 Java 代码所需的任何视图分配\
  \ ID。在后的代码中，可以通过对象的 `getId()` 方法获取视图的 ID。\n\n### 22.3 视图属性\n\n每个视图类都关联一系列属性。这些属性设置直接在视图实例上，并通常定义视图对象如何显示或行为。属性的示例包括\
  \ `Button` 对象上显示的文本，或 `ConstraintLayout` 视图的背景颜色。Android SDK 中的每个视图类都有一组预定义的方法，允许用户设置和获取这些属性值。例如，`Button`\
  \ 类有一个 `setText()` 方法，可以在 Java 代码中调用以将按钮上显示的设置为特定的字符串值。另一方面，`ConstraintLayout` 对象的背景颜色可以通过对象的\
  \ `setBackgroundColor()` 方法设置。\n\n### 22.4 约束集\n\n虽然属性设置是视图内部的并决定视图如何显示和行为，但约束集用于控制视图相对于父视图和其他兄弟视图的显示。每个\
  \ `ConstraintLayout` 实例都关联一组约束，定义了其子视图如何定位和约束。在 Java 代码中处理约束集的关键是 `ConstraintSet`\
  \ 类。该类包含一系列方法，允许执行创建、配置和将约束应用于 `ConstraintLayout` 实例的任务。此外，`ConstraintLayout` 实例的当前约束可以复制到\
  \ `ConstraintSet` 对象中，并将相同的约束应用于其他布局（无论是否修改）。`ConstraintSet` 实例的创建就像任何其他 Java 对象一样：\n\
  \n```\nConstraintSet set = new ConstraintSet();\n```\n\n一旦创建了约束集，就可以在实例上调用方法来执行广泛的任务。\n\
  \n### 22.4.1 连接\n\n`ConstraintSet` 类的 `connect()` 方法用于建立视图之间的约束连接。下面的代码配置了一个约束集，其中\
  \ `Button` 视图的左侧连接到 `EditText` 视图的右侧，间距为 70dp：\n\n```\nset.connect(button1.getId(),\
  \ ConstraintSet.LEFT, editText.getId(), ConstraintSet.RIGHT, 70);\n```\n\n### 22.4.2\
  \ 将约束应用于布局\n\n一旦配置了约束集，必须将其应用于 `ConstraintLayout` 实例之前使其生效。通过调用 `applyTo()` 方法并传递布局引用来应用约束集：\n\
  \n```\nset.applyTo(myLayout);\n```\n\n### 22.4.3 父级连接\n\n通过引用 `ConstraintSet.PARENT_ID`\
  \ 常量在子视图与其父级 `ConstraintLayout` 之间建立连接。在下面的示例中，约束集将 `Button` 视图的顶部连接到父布局的顶部，间距为\
  \ 100dp：\n\n```\nset.connect(button1.getId(), ConstraintSet.TOP, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.TOP, 100);\n```\n\n### 22.4.4 尺寸约束\n\n有许多方法可以控制视图的尺寸行为。下面的代码将 `Button`\
  \ 的水平尺寸设置为 `wrap_content`，并将 `ImageView` 的垂直尺寸最大设置为 250dp：\n\n```\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.constrainMaxHeight(imageView.getId(), 250);\n\
  ```\n\n### 22.4.5 约束偏移\n\n正如“在 Android Studio 中使用 ConstraintLayout”章节概述，当视图具有相反的约束时，它沿着约束轴（即水平或垂直）居中。使用\
  \ Android Studio 编辑器时通过属性窗口实现。然而，在使用约束集时，可以使用 `setHorizontalBias()` 和 `setVerticalBias()`\
  \ 方法添加偏移，引用视图 ID 和 0 到 1 之间的浮点值。下面的代码将 `Button` 的左右侧约束到父布局的相应侧，然后应用 25% 的水平偏移：\n\
  \n```\nset.connect(button1.getId(), ConstraintSet.LEFT, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.LEFT, 0);\nset.connect(button1.getId(), ConstraintSet.RIGHT, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.RIGHT, 0);\nset.setHorizontalBias(button1.getId(), 0.25f);\n```\n\
  \n### 22.4.6 对齐约束\n\n也可以使用约束集应用对齐。Android Studio 编辑器中提供的完整对齐选项也可以通过 `centerVertically()`\
  \ 和 `centerHorizontally()` 方法配置，这两个方法的参数取决于配置的对齐方式。此外，`center()` 方法用于在两个视图之间居中视图。在下面的代码中，`button2`\
  \ 被相对于 `button1` 水平对齐：\n\n```\nset.centerHorizontally(button2.getId(), button1.getId());\n\
  ```\n\n### 22.4.7 复制和应用约束集\n\n`ConstraintLayout` 实例的当前约束可以通过 `clone()` 方法复制到 `ConstraintSet`\
  \ 对象中。下面的代码将名为 `myLayout` 的 `ConstraintLayout` 实例的约束设置复制到约束集对象：\n\n```\nset.clone(myLayout);\n\
  ```\n\n一旦复制，可以将约束集直接应用于另一个布局，或者如下面的示例所示，在应用于第二个布局之前对其进行修改：\n\n```java\nConstraintSet\
  \ set = new ConstraintSet();\nset.clone(myLayout);\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.applyTo(secondLayout);\n```\n\n### 22.4.8 ConstraintLayout\
  \ 链\n\n在约束集中可以使用 `createHorizontalChain()` 和 `createVerticalChain()` 方法创建垂直和水平链。使用这些方法的语法如下：\n\
  \n`createHorizontalChain(int leftId, int leftSide, int rightId, int rightSide, int[]\
  \ chainIds, float[] weights, int style);`\n\n根据上述语法，下面的示例创建了一个从 `button1` 开始到 `button4`\
  \ 结束的水平分布链。这些视图之间是 `button2` 和 `button3`，它们的权重都设置为零：\n\n```java\nint[] chainViews\
  \ = {button2.getId(), button3.getId()};\nfloat[] chainWeights = {0, 0};\nset.createHorizontalChain(button1.getId(),\
  \ ConstraintSet.LEFT, button4.getId(), ConstraintSet.RIGHT, chainViews, chainWeights,\
  \ ConstraintSet.CHAIN_SPREAD);\n```\n\n可以通过将要删除视图的 ID 传递给 `removeFromHorizontalChain()`\
  \ 或 `removeFromVerticalChain()` 方法从链中移除视图。可以使用 `addToHorizontalChain()` 或 `addToVerticalChain()`\
  \ 方法将视图添加到现有链中。在两种情况下，方法的参数为要插入新视图的视图之间的 ID，如下：\n\n```\nset.addToHorizontalChain(newViewId,\
  \ leftViewId, rightViewId);\n```\n\n### 22.4.9 引导线\n\n使用 `create()` 方法将引导线添加到约束集中，然后使用\
  \ `setGuidelineBegin()`、`setGuidelineEnd()` 或 `setGuidelinePercent()` 方法进行定位。在下面的代码中，创建了一个垂直引导线并将其定位在布局宽度的\
  \ 50% 处。然后将 `button` 视图的左侧连接到引导线，没有间距：\n\n```\nset.create(R.id.myGuideline, ConstraintSet.VERTICAL_GUIDELINE);\n\
  set.setGuidelinePercent(R.id.myGuideline, 0.5f);\nset.connect(button1.getId(), ConstraintSet.LEFT,\
  \ R.id.myGuideline, ConstraintSet.RIGHT, 0);\nset.applyTo(layout);\n```\n\n### 22.4.10\
  \ 移除约束\n\n在约束集中使用 `clear()` 方法从视图中移除约束，传递视图 ID 和要移除约束的锚点：\n\n```\nset.clear(button.getId(),\
  \ ConstraintSet.LEFT);\n```\n\n同样，可以通过 `clear()` 方法在一个步骤中移除视图上的所有约束：\n\n```\nset.clear(button.getId());\n\
  ```\n\n### 22.4.11 缩放\n\n可以使用 `setScale()` 和 `setScaleY()` 方法调整布局内视图的缩放，这些方法的参数为执行操作的视图。在下面的代码中，按钮对象被缩放为原始宽度的两倍和高度的一半：\n\
  \n```java\nsetScaleX(myButton.getId(), 2f);\nsetScaleY(myButton.getId(), 0.5f);\n\
  ```\n\n### 22.4.12 旋转\n\n可以使用 `setRotationX()` 和 `setRotationY()` 方法在 X 或 Y 轴上旋转视图，必须传递视图\
  \ ID 和表示旋转角的浮点值。旋转发生的轴点可以通过调用 `setTransformPivot()`、`setTransformPivotX()` 和 `setTransformPivotY()`\
  \ 方法来定义。下面的代码使用位于 500 的轴点在 Y 轴上旋转按钮 30 度：\n\n```java\nset.setTransformPivot(button.getId(),\
  \ 500, 500);\nset.setRotationY(button.getId(), 30);\n```\n\n在涵盖了代码内部创建约束集和用户界面的理论后，下一章通过创建一个示例应用程序将这些理论付诸实践。关于\
  \ `ConstraintSet` 类的更多细节，请参考 [`developer.android.com/reference/support/ConstraintSet.html`](https://developer.android.com/reference/support/ConstraintSet.html)\n\
  \n### 22.5 总结\n\n作为编写 XML 资源或使用布局工具的替代方案，也可以在 Java 代码中动态创建用户界面。在 Java 代码中创建布局包括创建类实例并在这些对象上设置属性以定义所需的行为。视图相对于父布局和任何兄弟视图是通过使用约束集定义的。约束集由\
  \ `ConstraintSet` 类的实例表示，一旦创建，就可以使用广泛的方法调用来执行建立约束连接、控制视图行为和创建链等任务。在本章涵盖了 `ConstraintSet`\
  \ 类的基础后，下一章将通过教程将这些功能实际应用。\n\n# 23 Android ConstraintSet 教程\n\n上一章引入了使用 `ConstraintLayout`\
  \ 和 `ConstraintSet` 类在 Java 代码中创建和修改用户界面布局的基本概念。本章将通过完全在 Java 代码中创建且不使用 Android\
  \ Studio 编辑器的示例布局将这些概念实践。\n\n### 23.1 在 Android Studio 中创建项目\n\n启动 Android Studio，并在欢迎屏幕的快速启动菜单中选择新的\
  \ Android Studio 项目，在新项目对话框中选择 Empty Activity 模板。在 Name 字段输入 Java 并指定 `com.ebookfrenzy.javayout`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 API 26 (Android 8.0)，并将 Language 设置为\
  \ Java。一旦项目创建，`MainActivity.java` 文件将自动加载到编辑面板。正如我们预期的，Android Studio 创建了一个模板活动并重写了\
  \ `onCreate()` 方法，为添加 Java 代码创建用户界面提供了理想位置。\n\n### 23.2 向 Activity 添加视图\n\n`onCreate()`\
  \ 方法目前设计为使用资源布局文件创建用户界面。因此，首先从方法中删除此行：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_java_layout);\n\
  }\n```\n\n下一个修改是向活动添加一个带有单个 `Button` 视图子元素的 `ConstraintLayout` 对象。这涉及创建 `ConstraintLayout`\
  \ 和 `Button` 类的新实例。然后需要将 `Button` 视图作为 `ConstraintLayout` 视图的子元素添加，而后者通过调用活动实例的\
  \ `setContentView()` 方法显示：\n\n```java\npackage com.ebookfrenzy.javayout;\nimport\
  \ android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\nimport android.support.constraint.ConstraintLayout;\n\
  import android.widget.Button;\nimport android.widget.EditText;\npublic class MainActivity\
  \ extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        configureLayout();\n\
  \    }\n    private void configureLayout() {\n        Button myButton = new Button(this);\n\
  \        ConstraintLayout myLayout = new ConstraintLayout(this);\n        myLayout.addView(myButton);\n\
  \        setContentView(myLayout);\n    }\n}\n```\n\n当以这种方式创建用户界面实例时，构造方法必须传递被创建对象的上下文（context）。由于上述代码位于活动中，通过标准的\
  \ `this` 关键字引用上下文：\n\n```\nButton myButton = new Button(this);\n```\n\n一旦完成了上述添加，编译并运行应用程序（物理设备或模拟器）。启动后，`ConstraintLayout`\
  \ 视图的左上角将如图 23-1 所示显示一个按钮：![](img/431.jpg)\n\n### 23.3 设置视图属性\n\n为了练习，我们需要 `ConstraintLayout`\
  \ 视图的背景设置为蓝色，`Button` 视图显示“Press Me”。这两项任务可以通过在 Java 代码中的视图上设置属性来实现。为了让按钮上的文本容易翻译，将其作为字符串资源添加：\n\
  \n```xml\n<resources>\n    <string name=\"app_name\">JavaLayout</string>\n    <string\
  \ name=\"press_me\">Press Me</string>\n</resources>\n```\n\n虽然这是在代码中直接引用字符串的推荐方法，一旦字符串存储为资源，就可以在代码中访问：`getString(R.string.press_me)`。然后：\n\
  \n```java\nimport android.graphics.Color;\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private void configureLayout() {\n        Button myButton = new Button(this);\n\
  \        myButton.setText(getString(R.string.press_me));\n        myButton.setBackgroundColor(Color.YELLOW);\n\
  \        ConstraintLayout myLayout = new ConstraintLayout(this);\n        myLayout.setBackgroundColor(Color.BLUE);\n\
  \        myLayout.addView(myButton);\n    }\n}\n```\n\n现在编译并运行应用程序，布局将反映蓝色背景，按钮将显示黄色背景文本。\n\
  \n### 23.4 创建视图 ID\n\n布局完成后将由 `Button` 和 `EditText` 视图组成。在使用 `ConstraintSet` 类的方法之前，必须为这些视图分配唯一的\
  \ ID。过程的第一步是创建一个包含这些 ID 的新资源文件：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<resources>\n    <item name=\"myButton\" type=\"id\" />\n    <item name=\"editText\"\
  \ type=\"id\" />\n</resources>\n```\n\n在教程的此点，只创建了 `Button`，所以编辑 `configureLayout()`\
  \ 方法为对象分配相应的 ID：\n\n```java\nprivate void configureLayout() {\n    Button myButton\
  \ = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n   \
  \ myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  }\n```\n\n### 23.5 配置约束集\n\n在没有任何约束的情况下，`ConstraintLayout` 视图将 `Button` 视图放在屏幕的左上角。为了指示布局将按钮放在不同的位置（在这里是水平居中），需要创建\
  \ `ConstraintSet` 实例，使用适当设置进行初始化并应用于布局。再次编辑 `onCreate()` 方法来实现这些更改：\n\n```java\n\
  import android.support.constraint.ConstraintSet;\nprivate void configureLayout()\
  \ {\n    Button myButton = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  \    ConstraintLayout myLayout = new ConstraintLayout(this);\n    myLayout.setBackgroundColor(Color.BLUE);\n\
  \    myLayout.addView(myButton);\n    setContentView(myLayout);\n    ConstraintSet\
  \ set = new ConstraintSet();\n    set.constrainHeight(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n\
  \    set.constrainWidth(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.LEFT, ConstraintSet.PARENT_ID, ConstraintSet.LEFT, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.RIGHT, ConstraintSet.PARENT_ID, ConstraintSet.RIGHT, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0);\n   \
  \ set.applyTo(myLayout);\n}\n```\n\n配置了初始约束后，编译并运行应用程序，验证 `Button` 视图现在出现在布局中心：![](img/439.jpg)\n\
  \n### 23.6 添加 EditText 视图\n\n下一个要添加到布局的项是 `EditText` 视图。第一步是创建 `EditText` 对象，分配其为在声明中声明的\
  \ ID。为了执行操作的视图，在 Java 代码中调整如下：\n\n```java\nprivate void configureLayout() {\n  \
  \  Button myButton = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  \    EditText editText = new EditText(this);\n    editText.setId(R.id.editText);\n\
  \    ConstraintLayout myLayout = new ConstraintLayout(this);\n    myLayout.setBackgroundColor(Color.BLUE);\n\
  \    myLayout.addView(myButton);\n    myLayout.addView(editText);\n    setContentView(myLayout);\n\
  }\n```\n\n该 `EditText` 组件被设计为位于 `Button` 视图上方的 70dp 处，水平居中。在使用约束集时，可以使用 `setHorizontalBias()`\
  \ 和 `setVerticalBias()` 方法添加偏移，引用视图 ID 和 0 到 1 之间的浮点值。下面的代码将 `Button` 的左右侧约束到父布局的相应侧，然后应用\
  \ 25% 的水平偏移：\n\n```java\nset.connect(button1.getId(), ConstraintSet.LEFT, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.LEFT, 0);\nset.connect(button1.getId(), ConstraintSet.RIGHT, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.RIGHT, 0);\nset.setHorizontalBias(button1.getId(), 0.25f);\n```\n\
