    to death. Freezing is a painful and inappropriate way to kill according to the
    World Organisation for Animal Health (OIE) and other guidelines.


    JAVA sees these as problematic and continues to press the Ministry of Environment
    together with PEACE, an animal rights group. In September 2021, we submitted a
    written request to the Minister of the Environment. We also lobbied members of
    the Diet.


    Our requests are:


    - Revise the Invasive Alien Species Act to ban importing, breeding and selling
    red-eared sliders. However, the current owners of red-eared sliders should be
    allowed to continue keeping them without any permission, and giving red-eared
    sliders to new owners from those who are no longer able to keep them shall not
    be prohibited.


    - Abolish the capture and killing of red-eared sliders by other veterinarians.


    # Background of the Request 1


    Red-eared sliders in the wild were originally imported and sold as “pets”. They
    can live for as long as up to 40 years in captivity, and their carapace can grow
    up to 20 cm in length. It is obvious that keeping them as pets are not easy. Nevertheless,
    the government has allowed the sale of such an animal. Their negligence caused
    a serious problem that many red-eared sliders have been released to the wild.


    The current Invasive Species Act regulates raising and importing of animals as
    invasive alien species, but millions of red-eared sliders have already been in
    captivity (according to the data from the Ministry of Environment, about 1 million
    households keep them). Therefore, the regulation of raising may encourage abandonment
    and killing.


    We oppose prohibiting giving red-eared sliders to new owners who are no longer
    able to keep them because some people want to become new owners. In order to prevent
    abandonment, transferring ownership should be allowed.


    The best solution is not to increase their number any more. So, importation and
    distributing but must be ceased. Therefore, we ask that the Ministry of Environment
    should legally ban importing and selling red-eared sliders. There are some red-eared
    slider maniacs who breed them. If this is not prohibited by the law, population
    red-eared sliders keep on increasing. JAVA NEWS No.108 English ver. So, breeding
    should be banned as well, to stop the increase of red-eared sliders kept as pets.


    # Background of the Request


    The manual for the extermination of red-eared sliders drawn by the Ministry of
    Environment in 2019 recommends administrative officials and citizens who don''t
    have any professional knowledge to trap rivers or ponds to capture red-eared sliders
    and put them in a freezer at minus 20°C to kill.


    Killing by freezing is one of the most inhumane ways, and in the OIE Terrestrial
    Animal Health Code on the KILLING OF REPTILES FOR THEIR SKINS, MEAT AND OTHER
    PRODUCTS, killing by freezing is listed as one of the methods that are unacceptable
    for stunning and killing reptiles.


    As Japan is a member of the OIE, the Ministry of the Environment must know the
    Terrestrial Animal Health Code. Nevertheless, they completely ignore the Code
    and encourage the public to kill red-eared sliders by freezing.


    The Act on Welfare and Management of Animals states that in the case where an
    animal must be destroyed, a method that minimizes as much as possible the pain
    and distress to the animal must be used.


    As the method described above requires advanced professional knowledge and technique,
    only veterinarians are qualified to perform it properly.


    Our ultimate goal is to ensure an extermination of red-eared sliders, but in the
    current situation the Ministry of Environment and the Ministry of Agriculture,
    Forestry and Fisheries promote extermination of red-eared sliders, the best we
    can do is is replace the cruel method of killing by freezing with a method minimizing
    the pain and distress as much as possible.


    # The Ministry of Environment took a stance to introduce regulations


    Both response from the Ministry of Environment to our requests and an outlined
    policy by an expert group set up by the Ministry indicated that some regulation
    is we have requested.


    On the other hand, as for a method of killing, the Ministry didn''t show their
