    # 31 animal protection organizations present joint statement for WC11


    The 11th World Congress on Alternatives and Animal Use in the Life Sciences (WC11)
    was held at the Virtual Congress from August 23 to September 2, 2021. On August
    18, animal protection groups from many countries working for the abolition of
    animal testing gathered for the “WC11 animal protection satellite meeting” (Virtual).
    JAVA also participated in the meeting.


    ![](img/04b75edb5a21eab8871f2055748d81f6_4_0.png)


    In the meeting, there were presentations from nine groups on their activities
    and discussion on alternatives replacing carcinogenicity. A joint statement was
    issued jointly by 31 groups and organizations, asking to recognize the importance
    of alternative methods and to promote strategies to end the use of animals.


    # Statement addressed to all attendees of the 11th World Congress on Alternatives
    and Animal Use in the Life Sciences, Virtual Congress, August 2021


    Recognising that:


    - advances in science and technology are increasing the opportunities for the
    replacement of animals used in education, research and testing;

    - ethical considerations require the replacement of animals in education, research
    and testing;

    - where replacement has already been achieved, the benefits to science and education,
    as well as humans and other animals are clear;

    - more could be done to avoid and replace the use of animals;

    - despite the efforts of scientists and regulators over the last 30 years, since
    the first World Congress in 1993, the number of animals used in research and testing
    has not decreased significantly;

    - many organizations and institutions are now focused on the development of strategies
    to phase-out the use of animals;

    - and, that a sustainable and equitable future protecting humans, other animals
    and the environment depends on a new standard based on non-animal science.


    We, the undersigned organisations:


    - call on decision-makers to implement policy and regulation changes to accelerate
    the uptake of nonanimal methods as replacements for animals in education, research
    and testing;

    - call on conference attendees to promote institution-level strategies for the
    phase-out of the use of animals;

    - call on World Congress organisers to focus on accelerating the implementation
    of non-animal approaches at future World Congresses.


    # The Japan’s largest exhibition of exotic animals “Tokyo Reptiles World 2021
    winter"


    On December 4 and 5, 2021, “Tokyo Reptiles World 2021 winter” was held in Ikebukuro,
    Tokyo. The event places approximately 10,000 exotic animals, including reptiles
    and birds of prey imported from around the world for display and sale. The event
    is known for its extremely inappropriate display method, and the following horrible
    treatment of the animals remains the same.


    ![](img/04b75edb5a21eab8871f2055748d81f6_5_0.png)


    Lizards in plastic cups for sale


    ![](img/04b75edb5a21eab8871f2055748d81f6_5_1.png)


    Snake bending its body in small plastic cup


    ![](img/04b75edb5a21eab8871f2055748d81f6_5_2.png)


    Turtle unable to move in a small container


    ![](img/04b75edb5a21eab8871f2055748d81f6_5_3.png)


    Owl on a leash and is displayed on styrofoam


    ![](img/04b75edb5a21eab8871f2055748d81f6_5_4.png)


    Bantams in a small cage


    ![](img/04b75edb5a21eab8871f2055748d81f6_6_0.png)


    A small tufted capuchin (Cebus apella) in a cage reaching its right hand out through
    a gap in the cage and squeezing a visitor''s finger tightly as it squeaked. It
    has kept gripping her finger. The visitor was upset but finally managed to remove
    the monkey''s hand and left. The monkey then sucked its own little toe in its
    mouth, and after that, it is kept on squerofoam.


    Animals are placed in unnatural environments and subjected to long-term stress.
    In order, the Act on Welfare and Management of Animals must be revised.


