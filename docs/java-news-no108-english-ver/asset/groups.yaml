    使用兔子进行的测试，在日版指南中被描述为参考信息，尽管日本尚未完全转型为替代方法。


    此外，同一份指南中还包含了使用重构人皮肤模型的体外刺激测试方法，并推荐用于医疗器械的皮肤刺激测试。它也可以作为细胞内反应测试的替代方案。


    此外，海岛博士概述了医疗器械领域动物实验替代方法的最新信息。目前正在开发针对豚鼠和小鼠的过敏测试的替代方案，以及针对隐形眼镜的兔子眼刺激测试，但在实际应用方面存在许多问题。


    ## ■ 食品


    国际生命科学日本分会（ILSI Japan）高桥裕树博士介绍了 ILSI Japan 在促进食品领域动物实验替代方案方面所做的努力。


    根据他的说法：

    不用说对动物福利的考虑，特别是在食品安全评估领域已经是一个问题，因此人们对传统动物测试替代方案的期待日益增加。对于食用经验不足的食品需要安全评估，但在该领域动物测试替代方案的发展已经完成。


    ILSI Japan 正在开发可在食品领域使用的动物测试替代方案，并启动了替代动物测试（AAT）项目，目标是提高食品安全评估的完善和效率。几家公司参与了该项目，并与学术界合作实施以下三个主题：(1)“收集信息”，“2)“促进研究”，“(3)“传播信息”。例如，在(2)中，以建立食品安全评估新策略为目标，ILSI
    Japan 正在推进“包含用于预测食品成分安全性的毒性信息的食品成分毒性数据库”以及“预测肠道吸收和血浓度的计算机预测”。


    ## MPS 作为替代方法备受关注


    MPS（微生理系统），如器官芯片，是正在研究的重点替代方法。在今年的会议上，举办了名为“MPS 现状：开发、工业化和标准化”的座讨会，五位演讲者发表了演讲。


    其中三位介绍了 MPS 的国内外趋势和现状，以及日本的项目。


    - MPS 预计将用于从药物发现到制药研发的临床开发的广泛领域，包括对动物实验替代方法的贡献，从而提高研发生产力。近年来，它作为动物化学产品、化妆品和食品的替代品也引起了广泛关注。


    - 它在美、欧已达到实际应用阶段。相比之下，日本通过经济产业省和日本医疗研究开发机构（AMED）于 2017 年启动的 AMED-MPS 项目，MPS 的存在终于为人知。通过与制药公司、学术界、设备制造商和医药医疗器综合机构（PMDA）的合作，建立了一个使用
    MPS 的药物发现评估生态系统。相关方现在正渴望追赶美欧美。


    - 此外，作为促进国内终端用户理解和创建 MPS 评估方法的活动，2021 年在“人类 iPSC 细胞安全评估联合会”内新建立了安全评估中的 MPS 应用，约
    20 家制药公司和 CRO 公司参与并在日本启动。


    - 领先的商用 MPS 和 AMED-MPS 项目开发的 MPS 的目标之一，是为药物安全评估的审查文件、药代动力学预测以及化学物质对人体健康影响的评估提供数据。


    在具体的 MPS 研究方面，东京大学的木村广博士介绍了他正在参与商业化的肾脏和肠-肝体外模型微生理系统。


    此外，北本大学药学院的前田和博士发表了题为“利用源自人体标本的肠干细胞预测肠道吸收的实验模型建立”的报告。


    ## 毛皮新闻


    无毛皮联盟（FFA）是一个由 50 多个动物保护组织组成的国际联盟，致力于协作消除毛皮。JAVA 是其成员。


    ## 好消息


    无毛皮联盟（FFA）是一个由 50 多个动物保护组织组成的国际联盟，致力于协作消除毛皮。目前，两个品牌已转向无毛皮。


    无毛皮联盟（FFA）是一个由 50 多个动物保护组织组成的国际联盟，致力于协作消除毛皮。目前，两个品牌已转向无毛皮。


    ## ■ 兔子测试


    使用兔子进行的测试，在日版指南中被描述为参考信息，尽管日本尚未完全转型为替代方法。


    此外，同一份指南中包含了使用重构人皮肤模型的体外刺激测试方法，并推荐用于医疗器械的皮肤刺激测试。它也可以作为细胞内反应测试的替代方案。


