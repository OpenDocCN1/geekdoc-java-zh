    ![](img/04b75edb5a21eab8871f2055748d81f6_6_0.png)


    A small tufted capuchin (Cebus apella) in a cage reaching its right hand out through
    a gap in the cage and squeezing a visitor''s finger tightly as it squeaked. It
    has kept gripping her finger. The visitor was upset but finally managed to remove
    the monkey''s hand and left. The monkey then sucked its own little in its mouth,
    and after that, it is kept on squeaking.


    Animals are placed in unnatural environments and subjected to long, grueling exhibitions
    due to the selfishness of humans. The physical and mental strain on the animals
    is immeasurable.


    In order to improve the situation of those who continue to exhibit animals in
    a horrible way, current Care Management Standards for Animals other than dogs
    and cats under the Act on Welfare and Management of Animals must be revised to
    stricter standards.


    # The participation report about the 34th Annual Meeting of the Japanese Society
    for Alternatives to Animal Experiments November 11 to 13, 2021


    Affected by COVID-19, last year it was held virtually, but this year it was the
    hybrid meeting held at Okinawa Institute of Science and Technology Graduate University
    (OIST). JAVA participated in the virtual meeting. The number of participants was
    475 (announced by the organizer).


    The theme of the meeting is "Science based on 3Rs, 3Rs support Science". We would
    like to report on the presentation which we attended.


    # Use of MRI reduced the number of animals used for experiments


    In the "Contribution of MRI to the 3Rs" by Dr. Keigo Higikishima from National
    Institute of Advanced Industrial Science and Technology (AIST), he explained that
    MRI (Magnetic Resonance Imaging) is an attractive tool used not only in clinical
    but also in preclinical on laboratory animals, because of its non-invasiveness,
    and MRI machine is widely used for the development of diagnostic techniques, and
    for the evaluation of disease progression and therapeutic effects for pathological
    models.


    From the perspective of 3Rs, for example, when evaluating the therapeutic effect,
    MRI contributes to a reduction in the number of animals used, as it can obtain
    data repeatedly from the same animal without having to dissect it.


    On the other hand, MRI costs more than 200 million yen (approximately US$ 1,500,000)
    and is expensive to install and maintain. Furthermore, there are few experts in
    the field of measurement and analysis, therefore they are not readily available.
    Incidentally, is the principle is the same for human MRI and animal MRI. The'
