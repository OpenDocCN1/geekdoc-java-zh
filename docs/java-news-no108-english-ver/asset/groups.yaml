    # JAVA 参加了“2022年东京地球日”


    4月16日和17日，JAVA 在东京代代木公园举办的“2022年东京地球日”活动中设立展位。与去年一样，我们采取了严谨的新冠肺炎防护措施。


    在 JAVA 展位，我们展示了展板、派发了传单、销售了 JAVA 原创教育周边，并设置了留言板。人们可以在留言板上写下对动物的想法，并支持拯救印度尼西亚猴群的请愿活动（详见第
    4 页）。


    尽管人数不如新冠疫情发生前那么许多，但仍有许多人了解了动物实验和皮草的现状，我们得以为动物开展了有意义的活动。


    ![](img/04b75edb5a21eab8871f2055748d81f6_12_0.png)


