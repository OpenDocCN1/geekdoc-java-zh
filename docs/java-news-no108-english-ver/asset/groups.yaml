    Dr. Kazhiro Endo of Jichi medical university who is developing human resources
    for surgical medicine, made a presentation under the title of “Structured surgical
    training for upper-level medical students: dry-lab training, ex-vivo training
    and live animal training” by systematic surgery training for 5th and 6th grade
    medical students who desired surgical education after compulsory training.


    Since this was a meeting on alternative methods, we expected to hear more about
    practical training that do not use live animals. Actually they use artificial
    models and harvested organs in training. However, we were disappointed to hear
    Dr. Endo insist on the importance of using live pigs, saying that the texture
    and dynamic biological reaction and the feel of the body can only be with the
    real humans.


    All medical schools in the U.S. and Canada do not have animal-sacrificing practices.
    According to Endo, the use of human organs is advanced in Japan than in other
