    thus are small in size but cost the same as those for humans.


    Furthermore, the images obtained by MRI have not yet recognized as a publicly
    accepted method, so Dr. Hikishima et al. are developing MRI-based histological
    imaging. He also reported that his work is underway to create a framework for
    the widespread use of animal MRI.


