    - ■ Citizens'' awareness of opposition to fur is increasing


    FFA has also produced a map that summarizes public opinion polls on the pros and
    cons of fur and farming in Western countries. The surveys are not uniform, and
    there are data from countries that have been around for several years, but it
    serves as a guide for understanding current opinion. The latest version is of
    April 2022. The latest version includes new data from Spain, Canada, and the United
    States. Thus, in Western countries it can be said that the majority of citizens
    oppose fur and fur farming.


