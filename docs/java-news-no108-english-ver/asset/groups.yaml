    # JAVA participated in "Earth Day Tokyo 2022"


    On April 16th and 17th, JAVA exhibited a booth at "Earth Day Tokyo 2022" in Yoyogi
    Park, Tokyo. Thorough measures against COVID-19 infection were taken same as last
    year.


    At the JAVA booth, we exhibited panels, handed out flyers, sold JAVA original
    educational goods, and set up a message board where people could write their thoughts
    on animals and call for support for the petition to save monkeys in Indonesia,
    as described on page 4.


    Although there were not as many people before the Corona disaster, many people
    learned about the reality of animal testing and fur, and we were able to conduct
    meaningful activities for animals.


    ![](img/04b75edb5a21eab8871f2055748d81f6_12_0.png)


    # News from other countries


    In these pages, we introduced some news articles selected from the newsletters
    and email news sent from overseas organizations. JAVA NEWS No.108 carries the
    following six articles. The six articles were translated into Japanese to share
    with the readers.


    You can read the original articles in JAVA NEWS No.108 at the URL below:


