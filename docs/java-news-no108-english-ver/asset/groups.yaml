    two Italian brands have sworn to be fur and free have joined the ranks of the
    Italian brand ARMANI, GUCCI, PRADA.


    ## ■ Moncler


    January 25, 2022, Italian luxury brand Moncler pledged to stop using real fur
    from all its collections after Fall/Winter 2023.


    Moncler will stop sourcing fur in 2022 and the last collection to feature fur
    will be Fall/Winter 2023. After working together with FFA member LAV, Moncler
    announced that it will join the Global Free Retailer Program.


    Source

    https://furfreeretail.com/blog/2022/01/25/moncler-drops-animal-fur-and-joins-for-free-retailer/?fbclid=iWAR0kjEG0nH4ZAf1gMX692fZEXV4jXcXCOOzemApqVlHzKJJrK_BnrBNM3Wyec


    ![](img/04b75edb5a21eab8871f2055748d81f6_10_0.png)


    ## ■ Dolce&Gabbana


    January 31, 2022, Italian brand Dolce&Gabbana announced that it will use no animal
    fur in any of its collections starting in 2022. Dolce&Gabbana will be working
    with furriers to transition to eco-friendly fur in response to changing consumer
    tastes.


    Source

    https://www.furfreealliance.com/dolce-gabbana-goes-for-fur-free/


    ## Republic of Ireland banned fur farming!


    March 29, 2022, the legislation banned fur farming in the Republic of Ireland
    passed the final stages of the parliamentary process. Having completed its passage
    through the Dáil (House of Representatives) in early 2022, the Bill completed
    its final stage in the Seanad (Senate) on evening of Tuesday March 29, 2022. The
    Bill now goes to the President to be signed into. The three fur farms are expected
    to close this year. This is the result of many years of work by FFA member Respect
    for Animals and the Irish Society for the Prevention of Cruelty towards Animals
    (ISPCA). (Information as of the end of March 2022)


    Source

    https://www.furfreealliance.com/republic-of-ireland-bans-fur-farming/


    ## FFA-produced latest map of fur and farming


    - ■ More countries are banned fur by low


    FFA has produced a map that summarizes the legal and regulatory status of fur
    and farming. The first country to ban fur farming was the United Kingdom. Since
    then, over the past two decades, and more European countries have banned fur farming.
    Israel became the world''s first country to prohibit the sale of fur. (Information
    as of April 2022)


