- pgno: 8
  md: 'test using rabbits, is described in the Japanese guidance as reference information,
    although Japan has not yet made a complete transition to the alternative method.


    Also, in vitro irritation test method using reconstructed human skin model are
    included in the same guidance, and it is recommended for skin irritation testing
    of medical devices. It can also be used as an alternative for intracellular reactivity
    test.


    In addition, Dr. Haishima outlined the latest information on alternatives to animal
    experiments in the medical device field, which the development of alternatives
    for sensitization tests using guinea pigs and mice and ocular irritation using
    rabbits for contact lenses is underway currently, but there are many problems
    in putting them into practical use.


    # ■ Food


    Dr. Yuuki Takahashi of International Life Sciences Japan (ILSI Japan) presented
    ILSI Japan''s efforts to promote alternatives to animal experiments in the food
    sector.


    According to him:

    Not to mention the consideration of animal welfare, especially in the field of
    food safety assessment, is an issue, and so expectations are rising for alternatives
    to traditional animal testing. Safety assessment is required for foods with insufficient
    eating experience, however the development of alternatives to animal testing has
    been already done in the field.


    ILSI Japan is developing alternatives to animal testing that can be used in the
    food sector and has launched the Alternative Animal Testing (AAT) project with
    the goal of advancing the refining and efficiency of food safety assessments and
    functionality evaluations. Several companies are participating in this project
    and are implementing the following three themes in collaboration with academia,
    (1) “Gathering information”, (2) “Promoting research”, (3) “Disseminating information”.
    For example, in (2), with the goal of establishing a new strategy for food safety
    assessment, ILSI Japan is proceeding with the construction of “food components
    toxicity database containing toxicity information used for predicting the safety
    of food components” and “in silico prediction for intestinal absorption and blood
    concentration that can predict exposure.


    # MPS attracting attention as an alternative method


    MPS (Microphysiological System), such as organ chips, is a focus alternative method
    that is being researched. At this year’s conference, a symposium entitled “Current
    status of MPS: development, industrialization and standardization” was held, and
    five speakers made presentations.


    Three of them introduced the domestic and international trends and current status
    of MPS, as well as projects in Japan.


    +   MPS is expected to be used in a wide range of fields from drug discovery to
    clinical development of'
