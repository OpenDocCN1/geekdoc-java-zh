    # Fur News


    Fur Free Alliance (FFA) is an international coalition of more than 50 animal protection
    organizations working collaboratively to eliminate fur. JAVA is also a member
    of this coalition. Here are some news related to FFA.


    # Good News!!


    # Two luxury fashion brands are now fur free!


    FFA has the world’s leading program “Free Retailer Program” which recognizes retailers
    who have committed to a no fur policy. At present, more than 1,500 brands have
    abandoned fur fashion and are participating in this program. Recently, the following
    two Italian brands have sworn to be fur and free have joined the ranks of the
    Italian brand ARMANI, GUCCI, PRADA.'
