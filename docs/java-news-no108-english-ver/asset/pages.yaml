    # The participation report about the 34th Annual Meeting of the Japanese Society
    for Alternatives to Animal Experiments November 11 to 13, 2021


    Affected by COVID-19, last year it was held virtually, but this year it was the
    hybrid meeting held at Okinawa Institute of Science and Technology Graduate University
    (OIST). JAVA participated in the virtual meeting. The number of participants was
    475 (announced by the organizer).


    The theme of the meeting is "Science based on 3Rs, 3Rs support Science". We would
    like to report on the presentation which we attended.


    # Use of MRI reduced the number of animals used for experiments


    In the "Contribution of MRI to the 3Rs" by Dr. Keigo Higikishima from National
    Institute of Advanced Industrial Science and Technology (AIST), he explained that
    MRI (Magnetic Resonance Imaging) is an attractive tool used not only in clinical
    but also in preclinical on laboratory animals, because of its non-invasiveness,
    and MRI machine is widely used for the development of diagnostic techniques, and
    for the evaluation of disease progression and therapeutic effects for pathological
    models.


    From the perspective of 3Rs, for example, when evaluating the therapeutic effect,
    MRI contributes to a reduction in the number of animals used, as it can obtain
    data repeatedly from the same animal without having to dissect it.


    On the other hand, MRI costs more than 200 million yen (approximately US$ 1,500,000)
    and is expensive to install and maintain. Furthermore, there are few experts in
    the field of measurement and analysis, therefore they are not readily available.
    Incidentally, is the principle is the same for human MRI and animal MRI. The'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'magnets for animals are stronger because they need to see in fine pixels, and
    thus are small in size but cost the same as those for humans.


    Furthermore, the images obtained by MRI have not yet recognized as a publicly
    accepted method, so Dr. Hikishima et al. are developing MRI-based histological
    imaging. He also reported that his work is underway to create a framework for
    the widespread use of animal MRI.


    ![](img/04b75edb5a21eab8871f2055748d81f6_7_0.png)


    # Japanese medical schools in Japan are not making full use of donated bodies


    Dr. Kazhiro Endo of Jichi medical university who is developing human resources
    for surgical medicine, made a presentation under the title of “Structured surgical
    training for upper-level medical students: dry-lab training, ex-vivo training
    and live animal training” by systematic surgery training for 5th and 6th grade
    medical students who desired surgical education after compulsory training.


    Since this was a meeting on alternative methods, we expected to hear more about
    practical training that do not use live animals. Actually they use artificial
    models and harvested organs in training. However, we were disappointed to hear
    Dr. Endo insist on the importance of using live pigs, saying that the texture
    and dynamic biological reaction and the feel of the body can only be with the
    real humans.


    All medical schools in the U.S. and Canada do not have animal-sacrificing practices.
    According to Endo, the use of human organs is advanced in Japan than in other
    countries. Specialized doctors with special skills it use, but that constructing
    surgical t training using donated body is difficult. However, if we do not overcome
    that, the sacrifice of animals will never stop. We strongly hope that the use
    of human body donation will become more widespread that the system will be improved.


    # Expectations for alternatives to animal experiments in the medical device and
    food sector


    At this society, the majority were research presentations on alternatives to animal
    experiments in cosmetics. Many of the supporting members are cosmetics companies.
    However, we think that the number of presentations in fields is increasing these.
    Two companies in the food sector have also become the supporting members, partly
    due to the recommendations of JAVA.


    At the symposium entitled “New application fields and Further Advances in Alternative
    Research - Medical Devices, Foods and Cosmetics-”, the following presentations
    were made on alternatives in the medical device and food fields in addition to
    cosmetics field.


    +   ■ Medical devices


    Dr. Yuji Haishima (National Institute of Health Sciences) gave the following explanation.
    In the biological safety evaluation of medical devices, it is a principle to reduce
    animal studies as much as possible and perform appropriate evaluation. They consider
    the value of omitting the test to make the maximum use of data and information
    on equivalence with approved products. Moreover, if they have no choice but to
    carry animal studies, it is recommended to select the in vitro alternatives.


    For example, HCPT (Human Cell-based Pyrogen Test) using human cells, which is
    an alternative to pyrogen'
  merge: -1
