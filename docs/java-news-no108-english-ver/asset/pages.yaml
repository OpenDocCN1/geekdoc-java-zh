  md: '# The Japan’s largest exhibition of exotic animals “Tokyo Reptiles World 2021
    winter"


    On December 4 and 5, 2021, “Tokyo Reptiles World 2021 winter” was held in Ikebukuro,
    Tokyo. The event places approximately 10,000 exotic animals, including reptiles
    and birds of prey imported from around the world for display and sale. The event
    is known for its extremely inappropriate display method, and the following horrible
    treatment of the animals remains the same.


    ![](img/04b75edb5a21eab8871f2055748d81f6_5_0.png)


    Lizards in plastic cups for sale


    ![](img/04b75edb5a21eab8871f2055748d81f6_5_1.png)


