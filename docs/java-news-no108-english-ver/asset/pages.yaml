  md: '# # Save monkeys in Indonesia!

    Stop cruel capture and export of monkeys for experiments


    In February 2022, JAVA was asked to help with the campaign to stop the capture
    and export of long-tailed macaques for research in Indonesia by Action for Primates,
    a project set up to the campaign on behalf of non-human primates worldwide. Please
    help us to save them.


    Please refer to the website of Action for Primates for the details.

    https://actionforprimates.org/public/afp_take_action_20220125


    The video released by Action for Primates evidently shows how cruel and miserable
    the capture is.

    https://actionforprimates.org/public/references/AfP_logo_public_Indonesia_monkey_film.mp4


    On March 28, JAVA sent a letter and an email to Dr. Siti Nurbaya Bakar, Minister
    of Environment and Forestry and Ambassador Extraordinary and Plenipotentiary of
    the Republic of Indonesia, urging them to immediately ban the capture, export
    and breeding of long-tailed macaques for research.

    We also produced a Japanese version of the video released by Action for Primates
    and spread it.

    Then we called on our supporters to sign the Action for Primate''s Petition, and
    to send letters and emails to the ambassador Extraordinary and Plenipotentiary
    of the Republic of Indonesia.


    Action for Primates'' petition page

    https://www.thepetitions.com/517/718/020/indonesia-end-capture-amp-export-of-wild-monkeys-to-laboratories//


    ![](img/04b75edb5a21eab8871f2055748d81f6_3_0.png)


    JAVA NEWS No.108 English ver.'
