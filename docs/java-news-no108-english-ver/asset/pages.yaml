    experiments, thereby improving R&D productivity. It has also attracted a lot of
    attention in recent years as alternatives to animal chemical products, cosmetics,
    and foods.


    +   - has reached the stage of practical use in US and EU. In Japan, in contrast,
    the existence of MPS has finally become known, by AMED-MPS project started in
