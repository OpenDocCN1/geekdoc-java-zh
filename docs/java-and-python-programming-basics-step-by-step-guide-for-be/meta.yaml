    | not or and | Logical operators |'
- md: "## Python Comments\n\nIn any programming language, comments are needed. It\
    \ makes our program more readable, and the Python interpreter ignores the commented\
    \ code.\n\nIn Python code, there are two ways to use comments. It's a good idea\
    \ to practice using comments in code to make it easier to understand. Code can\
    \ be perplexing without comments. If we want to illustrate a code statement without\
    \ executing it, we can do so by commenting it. While a comment is not part of\
    \ the code, it improves readability.\n\n### Single-line Comment\n\nThe # (hash)\
    \ character is used at the beginning of the line to make a single-line comment.\
    \ At the end of the line, it is immediately terminated. For example:\n\n#### Example\
    \ 1\n\n```python\n#This is a single-line comment in Python\nprint(\"Welcome to\
    \ tutorialandexample\")\n```\n\n#### Output\n\nWelcome to tutorialandexample\n\
    \n### Multiline Comment\n\nInside the triple quotes, a multiline statement can\
    \ be made. For Example:\n\n```python\nprint(\"Welcome to tutorialexample\")\n\"\
    \"\"This is the example of\n    multiline comment\n    using the triple quotes.\n\
    \    Use in your code\"\"\"\n```\n\n## Python if statement\n\nAny programming\
    \ language must have the ability to make decisions. The power of decision-making\
    \ is condition testing. Many decision-making statements are available in Python,\
    \ including:\n\n- If statement\n- If-else statement\n- elif statement\n\n**if\
    \ statement**\nThe if conditional statement is the most straightforward. It's\
    \ used to see if a certain condition exists. A block of code (if statement block)\
    \ will be executed if the condition is valid.\n\n**Syntax:**\n```python\nif expression:\n\
    \    statement\n```\n\n**Flow chart of if statement:** The flowchart of if statement\
    \ is following\n\n![Flowchart of if statement](img/948933b8e6c2313f8ad91bccc30c7b94_106_0.png)\n\
    \nIn the flowchart above, the condition is first checked to see if it is valid,\
    \ and then conditional code (if statement) is executed. If the condition is incorrect,\
    \ the first collection of code following the ‘if’ assertion will be run.\n\nAny\
    \ non-zero and non-null value is assumed to be TRUE in the Python programming\
    \ language. If it is zero, it is presumed that the values are FALSE.\n\n## Indentation\
    \ in Python\n\nThe block of code is declared using indentation. All of the statements\
    \ in a block are supposed to be indented at the same stage. Curly braces and parentheses\
    \ are not permitted in block-level Python code. Python's indentation makes programming\
    \ quick and straightforward.\n\n**Example:** Following is an example of an if\
    \ statement.\n\n1. **Write a program to check number is even**\n\n```python\n\
    n = int(input(\"Enter the number:\"))\nif(n%2==0):\n    print(\"The number is\
    \ even\")\nelse:\n    print(\"The number is odd\")\n```\n\n**Output**\n\nEnter\
    \ the number: 10\nThe number is even\n\n2. **Create a program to check the passenger's\
    \ baggage weight.**\n\n```python\nweight = float(input(\"How many Kilograms(kg)\
    \ does your luggage?: \"))\nif (weight <30):\n    print(\"You have charged ₹ 300\
    \ for heavy luggage .\")\nprint(\"Thank you for your business.\")\n```\n\n**Output**\n\
    \nHow many Kilograms does your suitcase weigh?: 35\nThere is a 250 charge for\
    \ heavy luggage.\nThank you for your business\n\n3. **Create a program that prints\
    \ the highest of the three numbers.**\n\n```python\na = int(input(\"Enter the\
    \ First number:\"))\nb = int(input(\"Enter the Second number:\"))\nc = int(input(\"\
    Enter the Third number:\"))\nif(a>b) and (a>c):\n    print(a, 'is largest number'\
    \ )\nif(b>a) and (b>c):\n    print(b, 'is largest number')\nif (c>a) and (c>b):\n\
    \    print(c, \"c is largest\");\n```\n\n**Output**\n\nEnter the First number:\
    \ 100\nEnter the Second number: 145\nEnter the Third number: 200\n200 is largest\n\
    \n4. **Make a program to determine whether a given number is positive or negative.**\n\
    \n```python\nnum = 3\nif num >0:\n    print(num, \"is a positive number.\")\n\
    print(\"This is always printed.\")\nnum = -1\nif num >0:\n    print(num, \"is\
    \ a positive number.\")\nprint(\"This is also always printed.\")\n```\n\n**Output**\n\
    \n3 is a positive number.\nThis is always printed.\nThis is also always printed.\n\
    \n## Python elif\n\n**Python elif**\nThe elif statement is used to validate multiple\
    \ conditions and execute a particular block of statements based on which one is\
    \ valid.\n\n**Syntax**\n\n```python\nif expression1:\n    statement\nelif expression2:\n\
    \    statement\nelif expression3:\n    statement\nelse:\n    statement\n```\n\n\
    Elif statements, such as else, may be optional. If the if expression evaluates\
    \ true, the declaration of expression 1 is printed; otherwise, control moves to\
    \ the elif expression; if the elif condition evaluates false, control moves to\
    \ the next elif. It will go through all of the elif expressions before it finds\
    \ one that is real. Python, unlike other programming languages, does not have\
    \ a switch or case statement.\n\n![Flowchart of elif](img/948933b8e6c2313f8ad91bccc30c7b94_111_0.png)\n\
    \nPython tests each expression (i.e., the condition) one by one in the flow diagram\
    \ above, and if a true condition is found, the statement block under that expression\
    \ is executed. If the false condition is found, the statement block will be executed\
    \ under the else condition.\n\nWe used if, a sequence of elifs, and else to determine\
    \ the type of a variable in the following example.\n\n1. **Create a program to\
    \ check the student's score.**\n\n```python\nmarks = int(input(\"Enter the marks\
    \ \"))\nif marks >85 and marks <= 100:\n    print(\"Congrats ! you scored grade\
    \ A \")\nelif marks >60 and marks <= 85:\n    print(\"You scored grade B + \"\
    )\nelif marks >40 and marks <= 60:\n    print(\"You scored grade B \")\nelif marks\
    \ >30 and marks <= 40:\n    print(\"You scored grade C \")\nelse:\n    print(\"\
    You are fail \")\n```\n\n**Output**\n\nEnter the marks 60\nYou scored grade B\n\
    \n2. **Write a program that determines whether it is morning, noon, or night.**\n\
    \n```python\ntime= int(input(\"Enter the time\"))\nif time >= 6 and time <12:\n\
    \    print(\"Good Morning\")\nelif time == 12:\n    print(\"Good Noon\")\nelif\
    \ time >12 and time <= 17:\n    print(\"Good Afternoon\")\nelif time >17 and time\
    \ <= 20:\n    print(\"Good Evening\")\nelif (time >20 and time <=24) or (time\
    \ >= 0 and time <=6):\n    print(\"Good Night\")\nelse:\n    print(\"Invalid time!\"\
    )\n```\n\n**Output**\n\nEnter the time12\nGood Noon\n\n3. **Create a basic calculator\
    \ program.**\n\n```python\na=int(input(\"Enter the first number\"))\nb=int(input(\"\
    Enter the second number\"))\nprint(\"1. Add\")\nprint(\"2. Sub\")\nprint(\"3.\
    \ Mul\")\nprint(\"4. Div\")\nchoice=input(\"Enter your choice\")\nif(choice=='1'):\n\
    \    print(\"The addition is:\",a+b)\nelif(choice=='2'):\n    print(\"The subtracion\
    \ is:\",a-b)\nelif(choice=='3'):\n    print(\"The multiplication is:\",a*b)\n\
    elif(choice=='4'):\n    print(\"The divide is:\",a/b)\nelse:\n    print(\"Enter\
    \ the valid choice\")\n```\n\n**Output**\n\nEnter the first number:30\nEnter the\
    \ second number:20\n\n1. Add\n2. Sub\n3. Mul\n4. Div\n\nEnter your choice:3\n\
    The multiplication is: 600\n\n4. **Create a program to determine the triangle\
    \ type.**\n\n```python\na=int(input(\"Enter the first angle:\"))\nb=int(input(\"\
    Enter the second angle:\"))\nc=int(input(\"Enter the third angle:\"))\nif a<b+c\
    \ or b<a+c or c<a+b:\n    print(\"The triangle does not exist\")\nelif a==b and\
    \ a==c:\n    #An equilateral triangle has three angles of 60°, and three equal\
    \ sides.\n    print(\"Equilateral triangle\")\nelif a==b or b==c or c==a:\n  \
    \  # An isosceles triangle has two angles that are equal, and two equal sides.\n\
    \    print(\"Isosceles triangle\")\nelse:\n    # An obtuse triangle has one and\
    \ only one obtuse angle.\n    print(\"Obtuse triangle\")\n```\n\n**Output**\n\n\
    Enter the first angle: 60\nEnter the second angle:60\nEnter the third angle:45\n\
    Isosceles triangle\n\n## Python for loop\n\nIn Python, a for loop repeats a block\
    \ of code based on a given sequence for a specified number of times. Python's\
    \ for loop is unlike any other programming language, such as C or Pascal. It traverses\
    \ Python data structures such as lists, dictionaries, and tuples.\n\n### Syntax\n\
    \n```python\nfor iterating_var in sequence:\n    statements\n```\n\nThe expression\
    \ list in a sequence is evaluated first. The iterating variable iterating var\
    \ is then assigned to the first item in the sequence. After that, the statements\
    \ block is run. The statement block is executed until the entire sequence is terminated;\
    \ each item in the list is allocated to iterating var.\n\n![Flow diagram of for\
    \ loop](img/948933b8e6c2313f8ad91bccc30c7b94_117_0.png)\n\n### Flow diagram\n\n\
    Iterate over the series in the above flow diagram for loop. It executes the statement\
    \ block using the first element of the chain. It continues on the next."
  mdcn: "## Python 注释\n\n在任何编程语言中，注释都是必需的。它使我们的程序更具可读性，并且 Python 解释器会忽略被注释的代码。\n\n\
    在 Python 代码中，有两种使用注释的方式。在代码中练习使用注释是一个好主意，这能使代码更容易理解。没有注释的代码可能会令人困惑。如果我们想说明一段代码语句而不执行它，可以通过注释来实现。虽然注释不是代码的一部分，但它提高了可读性。\n\
    \n### 单行注释\n\n在行首使用 `#`（井号）字符来创建单行注释。在行尾，注释立即终止。例如：\n\n#### 示例 1\n\n```python\n\
    #This is a single-line comment in Python\nprint(\"Welcome to tutorialandexample\"\
    )\n```\n\n#### 输出\n\nWelcome to tutorialandexample\n\n### 多行注释\n\n在三引号内部，可以创建多行语句。例如：\n\
    \n```python\nprint(\"Welcome to tutorialexample\")\n\"\"\"This is the example\
    \ of\n    multiline comment\n    using the triple quotes.\n    Use in your code\"\
    \"\"\n```\n\n## Python if 语句\n\n任何编程语言都必须具备决策能力。决策的能力在于条件测试。Python 中有许多决策语句，包括：\n\
    \n- If 语句\n- If-else 语句\n- elif 语句\n\n**if 语句**\nif 条件语句是最直接的。它用于检查是否存在某个条件。如果条件有效，将执行一个代码块（if\
    \ 语句块）。\n\n**语法：**\n```python\nif expression:\n    statement\n```\n\n**if 语句流程图：**\
    \ if 语句的流程图如下\n\n![if 语句流程图](img/948933b8e6c2313f8ad91bccc30c7b94_106_0.png)\n\
    \n在上面的流程图中，首先检查条件是否有效，然后执行条件代码（if 语句）。如果条件不正确，将运行 'if' 断言之后的第一组代码。\n\n在 Python\
    \ 编程语言中，任何非零和非空值都被假定为 TRUE。如果为零，则假定值为 FALSE。\n\n## Python 中的缩进\n\n代码块使用缩进来声明。块中的所有语句都应该缩进到同一级别。块级\
    \ Python 代码中不允许使用花括号和圆括号。Python 的缩进使编程变得快速而简单。\n\n**示例：** 以下是 if 语句的一个示例。\n\n\
    1.  **编写一个程序来检查数字是否为偶数**\n\n```python\nn = int(input(\"Enter the number:\"))\n\
    if(n%2==0):\n    print(\"The number is even\")\nelse:\n    print(\"The number\
    \ is odd\")\n```\n\n**输出**\n\nEnter the number: 10\nThe number is even\n\n2. \
    \ **创建一个程序来检查乘客的行李重量。**\n\n```python\nweight = float(input(\"How many Kilograms(kg)\
    \ does your luggage?: \"))\nif (weight <30):\n    print(\"You have charged ₹ 300\
    \ for heavy luggage .\")\nprint(\"Thank you for your business.\")\n```\n\n**输出**\n\
    \nHow many Kilograms does your suitcase weigh?: 35\nThere is a 250 charge for\
    \ heavy luggage.\nThank you for your business\n\n3.  **创建一个程序，打印三个数字中的最大值。**\n\
    \n```python\na = int(input(\"Enter the First number:\"))\nb = int(input(\"Enter\
    \ the Second number:\"))\nc = int(input(\"Enter the Third number:\"))\nif(a>b)\
    \ and (a>c):\n    print(a, 'is largest number' )\nif(b>a) and (b>c):\n    print(b,\
    \ 'is largest number')\nif (c>a) and (c>b):\n    print(c, \"c is largest\");\n\
    ```\n\n**输出**\n\nEnter the First number: 100\nEnter the Second number: 145\nEnter\
    \ the Third number: 200\n200 is largest\n\n4.  **编写一个程序来确定给定的数字是正数还是负数。**\n\n\
    ```python\nnum = 3\nif num >0:\n    print(num, \"is a positive number.\")\nprint(\"\
    This is always printed.\")\nnum = -1\nif num >0:\n    print(num, \"is a positive\
    \ number.\")\nprint(\"This is also always printed.\")\n```\n\n**输出**\n\n3 is a\
    \ positive number.\nThis is always printed.\nThis is also always printed.\n\n\
    ## Python elif\n\n**Python elif**\nelif 语句用于验证多个条件，并根据哪个条件有效来执行特定的语句块。\n\n**语法**\n\
    \n```python\nif expression1:\n    statement\nelif expression2:\n    statement\n\
    elif expression3:\n    statement\nelse:\n    statement\n```\n\nElif 语句，如 else，可以是可选的。如果\
    \ if 表达式求值为 true，则打印表达式 1 的声明；否则，控制权转移到 elif 表达式；如果 elif 条件求值为 false，则控制权转移到下一个\
    \ elif。它将遍历所有 elif 表达式，直到找到一个为真的表达式。Python 与其他编程语言不同，没有 switch 或 case 语句。\n\n\
    ![elif 流程图](img/948933b8e6c2313f8ad91bccc30c7b94_111_0.png)\n\n在上面的流程图中，Python\
    \ 逐一测试每个表达式（即条件），如果找到一个为真的条件，则执行该表达式下的语句块。如果找到一个为假的条件，则执行 else 条件下的语句块。\n\n在下面的例子中，我们使用了\
    \ if、一系列 elif 和 else 来确定变量的类型。\n\n1.  **创建一个程序来检查学生的成绩。**\n\n```python\nmarks\
    \ = int(input(\"Enter the marks \"))\nif marks >85 and marks <= 100:\n    print(\"\
    Congrats ! you scored grade A \")\nelif marks >60 and marks <= 85:\n    print(\"\
    You scored grade B + \")\nelif marks >40 and marks <= 60:\n    print(\"You scored\
    \ grade B \")\nelif marks >30 and marks <= 40:\n    print(\"You scored grade C\
    \ \")\nelse:\n    print(\"You are fail \")\n```\n\n**输出**\n\nEnter the marks 60\n\
    You scored grade B\n\n2.  **编写一个程序来确定是早晨、中午还是晚上。**\n\n```python\ntime= int(input(\"\
    Enter the time\"))\nif time >= 6 and time <12:\n    print(\"Good Morning\")\n\
    elif time == 12:\n    print(\"Good Noon\")\nelif time >12 and time <= 17:\n  \
    \  print(\"Good Afternoon\")\nelif time >17 and time <= 20:\n    print(\"Good\
    \ Evening\")\nelif (time >20 and time <=24) or (time >= 0 and time <=6):\n   \
    \ print(\"Good Night\")\nelse:\n    print(\"Invalid time!\")\n```\n\n**输出**\n\n\
    Enter the time12\nGood Noon\n\n3.  **创建一个基本的计算器程序。**\n\n```python\na=int(input(\"\
    Enter the first number\"))\nb=int(input(\"Enter the second number\"))\nprint(\"\
    1. Add\")\nprint(\"2. Sub\")\nprint(\"3. Mul\")\nprint(\"4. Div\")\nchoice=input(\"\
    Enter your choice\")\nif(choice=='1'):\n    print(\"The addition is:\",a+b)\n\
    elif(choice=='2'):\n    print(\"The subtracion is:\",a-b)\nelif(choice=='3'):\n\
    \    print(\"The multiplication is:\",a*b)\nelif(choice=='4'):\n    print(\"The\
    \ divide is:\",a/b)\nelse:\n    print(\"Enter the valid choice\")\n```\n\n**输出**\n\
    \nEnter the first number:30\nEnter the second number:20\n\n1. Add\n2. Sub\n3.\
    \ Mul\n4. Div\n\nEnter your choice:3\nThe multiplication is: 600\n\n4.  **创建一个程序来确定三角形的类型。**\n\
    \n```python\na=int(input(\"Enter the first angle:\"))\nb=int(input(\"Enter the\
    \ second angle:\"))\nc=int(input(\"Enter the third angle:\"))\nif a<b+c or b<a+c\
    \ or c<a+b:\n    print(\"The triangle does not exist\")\nelif a==b and a==c:\n\
    \    #An equilateral triangle has three angles of 60°, and three equal sides.\n\
    \    print(\"Equilateral triangle\")\nelif a==b or b==c or c==a:\n    # An isosceles\
    \ triangle has two angles that are equal, and two equal sides.\n    print(\"Isosceles\
    \ triangle\")\nelse:\n    # An obtuse triangle has one and only one obtuse angle.\n\
    \    print(\"Obtuse triangle\")\n```\n\n**输出**\n\nEnter the first angle: 60\n\
    Enter the second angle:60\nEnter the third angle:45\nIsosceles triangle\n\n##\
    \ Python for 循环\n\n在 Python 中，for 循环根据给定的序列重复执行一个代码块指定的次数。Python 的 for 循环与任何其他编程语言（如\
    \ C 或 Pascal）都不同。它遍历 Python 数据结构，如列表、字典和元组。\n\n### 语法\n\n```python\nfor iterating_var\
    \ in sequence:\n    statements\n```\n\n首先对序列中的表达式列表进行求值。然后将迭代变量 `iterating_var`\
    \ 赋值给序列中的第一个项目。之后，执行语句块。语句块会一直执行，直到整个序列终止；列表中的每个项目都会被分配给 `iterating_var`。\n\n\
    ![for 循环流程图](img/948933b8e6c2313f8ad91bccc30c7b94_117_0.png)\n\n### 流程图\n\n在上面的流程图中遍历\
    \ for 循环的序列。它使用链中的第一个元素执行语句块。然后继续下一个。"
