    because of this.


    +   - **Secure:** Java is the most stable programming language because it offers
    a runtime environment that requires virtually no interaction with the operating
    system. Because of the customizable "Sandbox" based security model, a Java program
    can run safely without posing a risk to the system or users.


    Cryptography, authentication and authorization, public key infrastructure, and
    several other security features are built-in.


    +   - **Robust:** Java has excellent memory management and error handling capabilities.
    It removes the error-prone situation by focusing on compile-time and runtime error
    checking primarily. Automatic Garbage Collection is a Java feature that allows
    you to get rid of artifacts that are no longer required in your application and
    free up memory.


    +   - **Architecture-neutral:** Since the Java language has no implementation-dependent
    aspects, it is architecture-neutral, allowing compiled code to run on a wide range
    of processors with JRE.


    +   - **Portable:** Compilated codes can be run on a wide range of processors
    thanks to the lack of implementation dependencies. This emphasizes its portability.


    +   - **Multi-threaded:** The Java application can perform multiple tasks at the
    same time thanks to this function. A thread is a different program that runs at
    the same time. Multi-threading has the benefit of sharing the common memory region,
    which means no memory is lost.


    +   - **Interpreted:** Java bytecodes are converted to native machine instructions
    on the fly and are not saved anywhere.


    +   - **High Performance:** The performance of a program can be improved by using
    a JIT (Just in Time Compiler).'
  - '[PAGE 8]


    +   - **Distributed:** The ability to build a distributed application is provided
    by Java. To create distributed applications, RMI and EJB are used. It allows us
    to access files by invoking methods from any computer connected to the internet.

    - **Dynamic:** It is a dynamic language since it allows for dynamic class loading,
    which means that the class files are loaded at runtime. Java has an automatic
    memory management feature that allows it to be dynamic.'
