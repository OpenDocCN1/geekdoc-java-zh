  md: '# Object Oriented Programming (OOPs)


    We have been changing since the beginning of time. When something unacceptable
    for the community is discovered, the need for evaluation arises with the goal
    of enhancing current structures. The same can be said about programming languages.
    We also want advancements in programming languages. Before we get into what led
    to the creation of OOP, let''s take a look at why such a system was needed in
    the first place.


    Beginning with the introduction of the first programming language in the nineteenth
    century, we have continued to evolve in response to the needs and limitations
    of previous languages.


    Then there was a need for a standardized, efficient high-level language that could
    potentially replace assembly code. As a result, the C language, which was a Procedure
    Oriented Programming Language, was developed (POP).


    # Procedure Oriented Programming Language (POP)


    The instructions in POP are written under the main function, and each line defines
    the command that the machine should execute.


    The software is divided into many user-defined functions as the code size grows.
    The data is given second priority in POP.


    POP''s codes were created for a particular reason and could not be used in any
    other way.


    The C programming language shook the computing world; it seemed as if a perfect
    language had been discovered, one that is well prepared and adequate for developing
