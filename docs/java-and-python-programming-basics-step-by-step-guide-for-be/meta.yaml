- md: "## Java For Loop\n\nA for loop is a programming construct that executes a series\
    \ of statements a predetermined number of times. It has the following structure:\n\
    \n```\nfor (initialization; condition; update) {\n    statements;\n}\n```\n\n\
    The for loop distinguishes three types of sentences, which are separated by semicolons\
    \ ( ; )\n\n- Initialization statements\n- Termination condition\n- Update clause\
    \ (executable statement)\n\nExample:\n\n```\npublic class Myclass {\n    public\
    \ static void main(String[] args) {\n        int tableOf = 25;\n        for (int\
    \ ctr = 1; ctr <= 5; ctr++) {\n            System.out.println(tableOf * ctr);\n\
    \        }\n    }\n}\n```\n\nOUTPUT\n\n25\n50\n75\n100\n125\n\nThe code above\
    \ will run five times. It begins with a value of 1 for the variable ctr and runs\
    \ until it reaches a value of less than or equal to 5. ( ctr++ ) The value of\
    \ ctr will increase by one.\nFor ctr values 1, 2, 3, 4, and 5, the code runs.\
    \ The for loop now completes its execution without executing the collection of\
    \ statements since 6 = 5 evaluates to false.\n\n![](img/948933b8e6c2313f8ad91bccc30c7b94_29_0.png)\n\
    \nThe for loop works in the following way.\n**Step 1: Initialization**. It controls\
    \ the loop by setting the value of the loop control variable, which serves as\
    \ a counter. Only one instance of the initialization expression is run.\n\n**Step\
    \ 2: Condition.** I'm guessing it's a Boolean expression. The loop control variable\
    \ is compared to a preset value. If this expression is true, the loop's body is\
    \ executed. If the result is incorrect, the loop stops.\n\n**Step 3: Iteration.**\
    \ The loop control variable is normally incremented or decremented by this expression.\
    \ For each pass, the loop iterates, first evaluating the conditional expression,\
    \ then executing the loop body, and finally executing the iteration expression.\
    \ The cycle continues until the governing expression is incorrect.\n\nThe update\
    \ clause runs after the for loop body's statements have completed. Multiple initialization\
    \ statements can be described in the initialization portion, which only runs once.\
    \ Multiple statements can be specified in the update clause. A for loop, on the\
    \ other hand, may only have one termination condition.\n\n## Java Enhanced For\
    \ Loop (For-each Loop)\n\nThe for-each loop, also known as the improved for loop,\
    \ has several advantages over the usual for loop. A for-each loop is used to cycle\
    \ through a set of items from beginning to end in a sequential manner.\n\nThe\
    \ for-each variant of the for loop takes the following general form:\nfor(type\
    \ count_var : collection) statement-block\n\nThe type defines the variable count\
    \ var's type.\n\nIt iterates from beginning to end, receiving elements from a\
    \ series one at a time.\n\nThe next element in the array is retrieved and stored\
    \ in count var with each iteration of the loop.\n\nThe loop is repeated until\
    \ all of the collection's elements have been collected. The form of the iteration\
    \ variable must be the same as(or compatible with) the elements stored in the\
    \ collection since it receives values from the collection.\n\nAs a result, when\
    \ iterating over arrays, type must be consistent with the array's element type.\n\
    \nUsing the improved for loop, we can easily iterate through nested arrays.\n\n\
    Example:\n\n```\nimport java.util.ArrayList;\npublic class Myclass {\npublic static\
    \ void main(String[] args) {\nArrayList<String> myList = new ArrayList<String>();\n\
    myList.add(\"Java\");\nmyList.add(\"Loop\");\nmyList.add(\"for-each\");\nfor (String\
    \ val : myList) {\nSystem.out.println(val);\n}\n}\n}\n```\n\nOUTPUT\n\nJava\n\
    Loop\nfor-each\n\nOne thing to think about is what happens if we try to change\
    \ the loop variable in the improved for loop.\nIf we're traversing through an\
    \ entity or primitive form, the answer is in the fact that. Manipulation of the\
    \ loop variable would never alter the value of the array being iterated if we're\
    \ iterating through an array of primitive values, since the primitive values are\
    \ transferred by value to the loop variable in an improved for loop.\nThe value\
    \ of the array is transferred by reference to the loop variable while we iterate\
    \ through a collection of objects. As a result, if the value of the loop variable\
    \ is changed by calling methods on it, the new value will be reflected in the\
    \ loop variable's value.\n\n### Limitation of enhanced for loop\n\n- It isn't\
    \ possible to delete or erase elements from a list of it: - Since we can't call\
    \ the remove process, the improved for loop masks the iterator used to iterate\
    \ through the elements of an array. We can't use it to remove or erase current\
    \ collection values.\n- Multiple list arrays cannot be iterated over in the same\
    \ loop.\n- You can't use the improved for loop to create an array or change its\
    \ components.\n\n## Object Oriented Programming (OOPs)\n\nWe have been changing\
    \ since the beginning of time. When something unacceptable for the community is\
    \ discovered, the need for evaluation arises with the goal of enhancing current\
    \ structures. The same can be said about programming languages. We also want advancements\
    \ in programming languages. Before we get into what led to the creation of OOP,\
    \ let's take a look at why such a system was needed in the first place.\n\nBeginning\
    \ with the introduction of the first programming language in the nineteenth century,\
    \ we have continued to evolve in response to the needs and limitations of previous\
    \ languages.\n\nThen there was a need for a standardized, efficient high-level\
    \ language that could potentially replace assembly code. As a result, the C language,\
    \ which was a Procedure Oriented Programming Language, was developed (POP).\n\n\
    ## Procedure Oriented Programming Language (POP)\n\nThe instructions in POP are\
    \ written under the main function, and each line defines the command that the\
    \ machine should execute.\n\nThe software is divided into many user-defined functions\
    \ as the code size grows. The data is given second priority in POP.\n\nPOP's codes\
    \ were created for a particular reason and could not be used in any other way.\n\
    \nThe C programming language shook the computing world; it seemed as if a perfect\
    \ language had been discovered, one that is well prepared and adequate for developing\
    \ system code.\n\nFor any perfect thing, there are some drawbacks, and C was no\
    \ exception. Small and medium-sized codes were simple to control and manipulate,\
    \ but long-sized codes were more complicated.\n\n### Procedure Oriented Programming\
    \ Language's Drawbacks (POP)\n\nThe following were some of the drawbacks of this\
    \ programming approach:\n\nSince every function had access to global variables,\
    \ it was important to make adjustments to the function description so that data\
    \ values could be manipulated only when necessary.\nThis programming methodology\
    \ was unsuitable for real-world problems.\nIt was a difficult job to add new functionality\
    \ to existing code.\nIt was necessary to develop a programming framework that\
    \ would enable us to monitor and resolve the issues listed above.\nThe focus is\
    \ primarily on data.\n\nAfter it has been written, it can be reused for other\
    \ purposes.\nWithout having to rewrite the entire code, new methods and variables\
    \ could be added to the current code as needed.\nAs a result of this, the object-oriented\
    \ programming framework was developed.\n\n## Object-oriented Programming\n\nObject\
    \ Oriented Programming (OOP) is a method of standardizing programs.\nThe methods\
    \ and data are stored in a separate memory region.\nThis programming approach\
    \ is based on 'objects,' which are nothing more than real-world entities.\nUsing\
    \ principles of inheritance, polymorphism, and data abstraction, this programming\
    \ approach aids in the organization of complex programs.\nIn simple terms, in\
    \ OOP, the solution is to first construct a class with a large number of methods\
    \ and variables, and then use the class to evaluate the state of properties.\n\
    As a result, class is nothing more than a blueprint for deciding the state of\
    \ objects, and objects are the actual entities in the real world.\nLet us take\
    \ a look at the concepts of OOP"
  mdcn: "## Java For 循环\n\nFor 循环是一种编程结构，它会按预定次数执行一系列语句。其结构如下：\n\n```\nfor (initialization;\
    \ condition; update) {\n    statements;\n}\n```\n\nFor 循环区分三种类型的语句，它们由分号（;）分隔：\n\
    \n- 初始化语句\n- 终止条件\n- 更新子句（可执行语句）\n\n示例：\n\n```\npublic class Myclass {\n    public\
    \ static void main(String[] args) {\n        int tableOf = 25;\n        for (int\
    \ ctr = 1; ctr <= 5; ctr++) {\n            System.out.println(tableOf * ctr);\n\
    \        }\n    }\n}\n```\n\n输出\n\n25\n50\n75\n100\n125\n\n上面的代码将运行五次。它从变量 ctr\
    \ 的值为 1 开始运行，直到其值小于或等于 5 为止。（ctr++）ctr 的值每次增加一。\n当 ctr 的值为 1、2、3、4 和 5 时，代码会运行。由于\
    \ 6 <= 5 的结果为 false，for 循环现在完成执行，不再执行语句集合。\n\n![](img/948933b8e6c2313f8ad91bccc30c7b94_29_0.png)\n\
    \nFor 循环的工作方式如下。\n**步骤 1：初始化**。它通过设置循环控制变量的值来控制循环，该变量用作计数器。初始化表达式只运行一次。\n\n**步骤\
    \ 2：条件。** 我猜这是一个布尔表达式。循环控制变量与预设值进行比较。如果此表达式为 true，则执行循环体。如果结果为 false，则循环停止。\n\n\
    **步骤 3：迭代。** 此表达式通常递增或递减循环控制变量。每次循环时，循环都会迭代，首先计算条件表达式，然后执行循环体，最后执行迭代表达式。循环持续进行，直到控制表达式为\
    \ false。\n\n更新子句在 for 循环体的语句完成后运行。初始化部分可以描述多个初始化语句，该部分只运行一次。更新子句中可以指定多个语句。然而，for\
    \ 循环只能有一个终止条件。\n\n## Java 增强型 For 循环（For-each 循环）\n\nFor-each 循环，也称为增强型 for 循环，比常规\
    \ for 循环有几个优点。For-each 循环用于按顺序从头到尾遍历一组项目。\n\nFor 循环的 for-each 变体采用以下通用形式：\nfor(type\
    \ count_var : collection) statement-block\n\ntype 定义了变量 count_var 的类型。\n\n它从头到尾迭代，一次从序列中接收一个元素。\n\
    \n在循环的每次迭代中，都会检索数组中的下一个元素并将其存储在 count_var 中。\n\n循环重复进行，直到收集完集合的所有元素。由于迭代变量从集合接收值，因此其形式必须与集合中存储的元素相同（或兼容）。\n\
    \n因此，在遍历数组时，type 必须与数组的元素类型一致。\n\n使用增强型 for 循环，我们可以轻松地遍历嵌套数组。\n\n示例：\n\n```\n\
    import java.util.ArrayList;\npublic class Myclass {\npublic static void main(String[]\
    \ args) {\nArrayList<String> myList = new ArrayList<String>();\nmyList.add(\"\
    Java\");\nmyList.add(\"Loop\");\nmyList.add(\"for-each\");\nfor (String val :\
    \ myList) {\nSystem.out.println(val);\n}\n}\n}\n```\n\n输出\n\nJava\nLoop\nfor-each\n\
    \n需要考虑的一点是，如果我们尝试在增强型 for 循环中修改循环变量会发生什么。\n如果我们遍历的是对象或基本类型，答案就在于此。如果我们在遍历基本类型值的数组，那么对循环变量的操作永远不会改变正在迭代的数组的值，因为在增强型\
    \ for 循环中，基本类型值是按值传递给循环变量的。\n当我们遍历对象集合时，数组的值是通过引用传递给循环变量的。因此，如果通过调用循环变量的方法来改变其值，新值将反映在循环变量的值中。\n\
    \n### 增强型 for 循环的局限性\n\n- 无法从其列表中删除或擦除元素：- 由于我们无法调用 remove 过程，增强型 for 循环隐藏了用于遍历数组元素的迭代器。我们不能用它来删除或擦除当前集合的值。\n\
    - 不能在同一个循环中遍历多个列表数组。\n- 不能使用增强型 for 循环来创建数组或修改其组件。\n\n## 面向对象编程（OOP）\n\n自时间伊始，我们就在不断变化。当发现某些对社会不可接受的事物时，评估的需求就会出现，目的是改进现有结构。编程语言也是如此。我们也希望编程语言有所进步。在探讨是什么导致了\
    \ OOP 的诞生之前，让我们先看看为什么首先需要这样一个系统。\n\n从十九世纪第一种编程语言的引入开始，我们就根据先前语言的需求和局限性不断演进。\n\n\
    然后，需要一种标准化的、高效的高级语言来潜在地替代汇编代码。因此，C 语言应运而生，它是一种面向过程的编程语言（POP）。\n\n## 面向过程的编程语言（POP）\n\
    \nPOP 中的指令写在主函数下，每一行定义了机器应执行的命令。\n\n随着代码规模的增长，软件被划分为多个用户定义的函数。在 POP 中，数据被置于次要地位。\n\
    \nPOP 的代码是为特定目的而创建的，不能以任何其他方式使用。\n\nC 编程语言震撼了计算界；似乎发现了一种完美的语言，它准备充分且足以开发系统代码。\n\
    \n任何完美的事物都有缺点，C 也不例外。中小型代码易于控制和操作，但大型代码则更为复杂。\n\n### 面向过程的编程语言的缺点（POP）\n\n这种编程方法的一些缺点如下：\n\
    \n由于每个函数都可以访问全局变量，因此必须对函数描述进行调整，以便仅在必要时操作数据值。\n这种编程方法不适合解决现实世界的问题。\n向现有代码添加新功能是一项艰巨的任务。\n\
    有必要开发一种编程框架，使我们能够监控和解决上述问题。\n重点主要放在数据上。\n\n编写完成后，它可以被重用于其他目的。\n无需重写整个代码，可以根据需要向当前代码添加新的方法和变量。\n\
    因此，面向对象的编程框架得以发展。\n\n## 面向对象编程\n\n面向对象编程（OOP）是一种标准化程序的方法。\n方法和数据存储在单独的内存区域中。\n\
    这种编程方法基于“对象”，而对象不过是现实世界的实体。\n使用继承、多态和数据抽象等原则，这种编程方法有助于组织复杂的程序。\n简单来说，在 OOP 中，解决方案是首先构建一个包含大量方法和变量的类，然后使用该类来评估属性的状态。\n\
    因此，类不过是决定对象状态的蓝图，而对象是现实世界中的实际实体。\n让我们来看看 OOP 的概念"
