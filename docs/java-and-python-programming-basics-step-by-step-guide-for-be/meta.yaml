    # Java Virtual Machine (JVM)


    The Java Virtual Machine (JVM) is a virtual runtime environment for executing
    Java bytecodes.


    The JVM isn''t aware of the keywords we used in our code. As a result, it''s translated
    to bytecode.


    It manages Java program execution and provides features including automatic exception
    handling and garbage collection.


    Any Java file is converted into a.class file, which contains the bytecodes, when
    it is compiled. When we run the ".class" file, it delves into the number of measures.
    The JVM is defined by the whole process.


    ![](img/948933b8e6c2313f8ad91bccc30c7b94_14_0.png)


    # ClassLoader


    Handles three activities


    +   - Loading: It reads the.class file and converts it to binary data, which it
    saves in the method field. It saves fully qualified names of the loaded class,
    its immediate parent class, constructor, variables, and method information in
    the method area for each.class file. After loading the.class file, the JVM creates
    a Class object in heap memory.'
  - '[PAGE 15]


    +   - Linking: It determines whether or not the.class file is correctly formatted
    and created by a valid compiler. If the check fails, it throws a run-time exception.
    The JVM allocates memory for class variables and sets the memory value to the
    default.

    - Initialization: The JVM assigns values to all of the code''s static variables.
    It uses a top-to-bottom method in the class hierarchy, with values allocated from
    top to bottom or parent to child.


    In Java, there are three built-in class loaders:


    +   1. Bootstrap ClassLoader: This is the superclass of the Extension classloader,
    and it loads the rt.jar file, which includes all the class files for Java Standard
    Edition packages like java.lang, java.net, and java.util, among others.

    2. Extension ClassLoader: This is a child and parent classloader for Bootstrap
    that loads jar files from the $JAVA HOME/jre/lib/ext directory or any other directory
    defined by the java.ext.dirs device property.

    3. System/Application ClassLoader: This is the Extension classloader''s child
    classloader. It uses the Environment Variable associated with java.class.path
    to load classes from the application classpath.


    # JVM Memory


    The memory region of the JVM is divided into the following sections:

    The method area contains all class-level information, such as the class name,
    immediate parent class name, variables (including static variables), and method
    details, among other things.

    Heap area: At runtime, the heap area is a shared resource that stores all object
    information.

    Stack area: A private JVM stack is generated for each thread at the same time
    as the thread is created. It retains local variables and stores frames, as well
    as participating in process invocation and return. The thread''s runtime stack
    will'
