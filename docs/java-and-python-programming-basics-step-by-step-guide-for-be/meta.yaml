    Java is a platform-independent, object-oriented, robust, and stable programming
    language. We can create terminal, window, network, business, and mobile applications
    with the help of Java programming.


    The Java programming language was created in 1995 by James Gosling, who is known
    as the "Father of Java." On January 23, 1996, the first version of Java was released.


    Java is divided into three editions: Java SE (Java Standard Edition), Java EE
    (Java Enterprise Edition), and Java ME (Java Micro Edition) (Java Micro Edition).


    # ## Java Hello World Example


    ```

    class HelloWorldJava

    {

    public static void main(String[] args)

    {

    System.out.println("Hello World!");

    }

    }

    ```


    # ### OUTPUT


    Hello World!'
