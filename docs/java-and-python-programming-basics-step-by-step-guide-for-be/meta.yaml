  md: '# Python Dictionary


    A Python dictionary is a mutable list of data with key-value pairs that are not
    in any particular order. It keeps track of both the key and the value, allowing
    a key to access the value it represents.


    A Python dictionary is a set of dictionary items that can be quickly retrieved
    using their key.


    Inside a dictionary, the keys must be unique. The meaning of the dictionary may
    be any data type, but the keys must be immutable data types like numbers, strings,
    or tuples.


