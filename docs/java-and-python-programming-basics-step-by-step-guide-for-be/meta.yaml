    # Java Enhanced For Loop (For-each Loop)


    JAVA ENHANCED FOR LOOP


    The for-each loop, also known as the improved for loop, has several advantages
    over the usual for loop. A for-each loop is used to cycle through a set of items
    from beginning to end in a sequential manner.


    The for-each variant of the for loop takes the following general form:

