  md: '# Features of Java


    The Java programming language was created with portability, stability, and simplicity
    in mind. Despite this, Java has a range of features that make it a common programming
    language.


    The following is a list of Java''s most essential features.


    Object-Oriented: In the Java programming language, everything is an object.


    We structure our application as a set of different types of objects that contain
    both data and actions, which is known as object-oriented programming.


    The following are the fundamental principles of Object-Oriented Programming:


    +   - Object

    - Class

    - Inheritance

    - Polymorphism

    - Abstraction

    - Encapsulation


    +   - **Simple:** Because of its plain and easy-to-understand syntax, the language
    is simple to learn. In comparison to C++, it has also omitted several complex
    methods (e.g. explicit pointers, operator overloading, etc...).


    +   - **Platform Independent:** Other programming languages, such as C and C++,
    are compiled as platform-specific code, whereas Java is not. Java, on the other
    hand, is a platform-independent language that is guaranteed to be a write-once,
    run-anywhere language.


    Java is a software-based platform for various operating systems that consists
    of two parts:


    +   - Runtime Environment'
