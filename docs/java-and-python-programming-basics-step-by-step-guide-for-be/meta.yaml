  - '[PAGE 22]


    # Java Variable


    In a program, the variable is the fundamental storage unit. In Java, we use an
    identifier, a type, and an optional initializer to define a variable.

    Variables in Java must first be declared before they can be used. Variables in
    Java can be dynamically initialized with any expression that is true at the time
    the variable is declared.


    # Declaration


    ```

    int x = 15 ;

    int y = Math.sqrt(a * a + b * b); // Here variable y will get the value dynamically

    //depending to the values of a, b.

    ```


    # Scope


    The scope is defined by the opening and closing of the curly braces. What items
    are accessible to other sections of our software is determined by a scope. It
    also decides how long those artifacts will last.

    When a variable''s scope is entered, it is established, and when it is exited,
    it is destroyed.

    It means that variables declared within a method will not retain their values
    outside of it. Also, when a block is exited, a variable declared within it loses
    its value.


    As a result, a variable''s life-cycle is included in its definition.'
  - '[PAGE 23]


    Here are the available scopes of variables:


    +   - Local variables (also known as method-local variables)

    - Method parameters (also known as method arguments)

    - Instance variables (also known as attributes, fields, and non-static variables)

    - Class variables (also known as static variables)


    # Local variables:-


    Within a process, constructor, or block, local variables are specified. Access
    modifiers cannot be applied to local variables.

    Only within the scope of a declared process, block, or constructor are local variables
    observable.

    Until using the local variable for the first time, it should be allocated.

    The scope of a local variable is determined by where it is declared within a system.

    These curly braces restrict the scope of local variables specified within a loop,
    if – else, switch statement, or code block (marked with ).

    Local variables specified outside of each of these constructs can be accessed
    within the process.


    # Method parameters:-


    Method parameters are variables that accept values in a method signature.

    They can only be accessed via the system that identifies them.


    # Instance variables:-


    An instance variable is declared outside of all methods in a class. All instance
    (or non-static) methods specified in a class have access to it.


    # Class variables:-


    The static keyword is used to describe a class variable. A class variable is associated
    with the class as a whole, not with individual objects within the class. A class
    variable is a variable that is shared by all objects. The class'
  - '[PAGE 24]


    variables are not duplicated in objects. To access a class variable, we don''t
    even need an entity. The name of the class in which it is described may be used
    to access it:


    *Comparing the use of local variable in different scope.*


    +   - Local variables are defined within a method and are normally used to store
    the intermediate results of a calculation.

    - Method parameters are used to pass values to a method. These values can be manipulated
    and may also be assigned to instance variables.

    - Instance variables are used to store the state of an object. These are the values
    that need to be accessed by multiple methods.

    - Class variables are used to store values that should be shared by all the objects
    of a class.'
