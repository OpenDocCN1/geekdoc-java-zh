    \                divisibleBy7 = true;\n            num--;\n        } while (divisibleBy7\
    \ == false);\n    }\n}\n```\n\n**输出**\n\n9\n8\n7\n\n![](img/948933b8e6c2313f8ad91bccc30c7b94_26_0.png)\n\
    \ndo while循环中的控制流\n\n### Java While循环\n\nwhile循环用于只要其条件评估为真就连续执行一系列语句。在开始执行语句之前，此循环会测试条件。\n\
    \n**示例：**\n\n```\npublic class Myclass {\n    public static void main(String[]\
    \ args) {\n        int num = 9;\n        boolean divisibleBy7 = false;\n     \
    \   while (!divisibleBy7) {\n            System.out.println(num);\n          \
    \  if (num % 7 == 0)\n                divisibleBy7 = true;\n            --num;\n\
    \        }\n    }\n}\n```\n\n**输出**\n\n9\n8\n7\n\n由于while循环在循环顶部测试条件表达式，如果条件一开始就不正确，循环体甚至不会执行一次。"
