    Handles three activities


    +   - Loading: It reads the.class file and converts it to binary data, which it
    saves in the method field. It saves fully qualified names of the loaded class,
    its immediate parent class, constructor, variables, and method information in
    the method area for each.class file. After loading the.class file, the JVM creates
    a Class object in heap memory.'
