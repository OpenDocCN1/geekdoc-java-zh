    - 转到“变量值”字段并选择它。在python.exe文件的路径前添加一个分号（;）。\n\n## Python关键字\n\n关键字是为编译器保留的词，具有特定含义。它们不允许用作变量。关键字是语法的一部分，例如：\n\
