- md: "## Rules for abstract class\n\nUntil you create an abstract class, keep the\
    \ following points in mind. We may refer to them as guidelines.\n\n- We must inherit\
    \ an abstract class from another class in order to use it.\n- To use an abstract\
    \ class, you must first construct a class that extends it.\n- A class derived\
    \ from a parent abstract class must have all of the parent class's methods.\n\
    - The abstract class's object cannot be produced.\n- Declare the child class as\
    \ an abstract class if it does not include any of the methods of the parent class.\n\
    \n## Why we need an abstract class?\n\nAssume you have a Student class with the\
    \ method info() and its subclasses, as well as name, id, and so on. Since each\
    \ name has a unique id, such as ‘a' with id 111 and ‘b' with id 222, it is pointless\
    \ to implement this method in the parent class since each child class overrides\
    \ the method to provide implementation information.\n\nWhen we know that all of\
    \ the student classes can circumvent this process, it makes no sense to enforce\
    \ it in the parent class. As a result, making this approach abstract is a viable\
    \ choice. We compel all child classes to follow this method by rendering it abstract.\n\
    \n## Abstract methods\n\nA method that only has the method description is called\
    \ an abstract method.\nA method that is abstract does not have an implementation\
    \ or a body.\nIt only specifies the method's signature. `abstract void method(double\
    \ X, double Y);`\nA class should be called abstract if it includes at least one\
    \ abstract method.\nDeclare fields / declare nonabstract methods `abstract void\
    \ method(); public abstract class Demo;`\n\nWhen an abstract class is subclassed,\
    \ the subclass can follow all of the parent class's abstract methods.\n\nHowever,\
    \ if the subclass may not include the implementation, it must be declared abstract.\n\
    \n## Example 1\n\n```java\nabstract class Food{\n    abstract void eat();\n}\n\
    //in abstraction, implementation is unknown by end user\nclass Pizza extends Food{\n\
    \    void eat(){System.out.println(\"Pizza is fantastic\");}\n}\nclass Burger\
    \ extends Food{\n    void eat(){System.out.println(\"Burger is delicious\");}\n\
    }\n//In abstraction, method is called by programmer or user\nclass TestAbstraction{\n\
    \    public static void main(String args[]){\n        Food obj=new Burger();//In\
    \ Abstraction, object is provided through method\n        obj.eat();\n    }\n\
    }\n```\n\n### OUTPUT\n\n```\nBurger is delicious\n```\n\nFood is the abstract\
    \ class in this case, and the Pizza and Burger classes provide its implementation.\n\
    \nMost implementation information is hidden from us (and from the end user), and\
    \ the factory method returns an implementation class object.\n\n## Example 2\n\
    \nAn abstract class, an abstract function, a method body (non-abstract method),\
    \ a data member, a constructor, and even the main() method can all be found in\
    \ a Java program.\n\nTake a look at the example below.\n\n```java\nabstract class\
    \ Pc{\n    Pc(){System.out.println(\"PC repaired successfully\");}\n    abstract\
    \ void performance();\n    void changeOS(){\n        System.out.println(\"Win\
    \ 10 installation is successful\");\n    }\n}\n//Creating a Child class which\
    \ inherits Abstract class\nclass Hp extends Pc{\n    void performance(){System.out.println(\"\
    performance is Superb..\");}\n}\n//Creating a Test class which calls abstract\
    \ and non-abstract methods\nclass TestAbstraction1{\n    public static void main(String\
    \ args[]){\n        Pc obj = new Hp();\n        obj.performance();\n        obj.changeOS();\n\
    \    }\n}\n```\n\n### OUTPUT\n\n```\nPC repaired successfully\nPerformance is\
    \ Superb..\nWin 10 installation is successful\n```\n\n## Interface in Java\n\n\
    The interface in Java is similar to a class with only static constants and abstract\
    \ methods. It's used to achieve polymorphism such that multiple inheritance can\
    \ be implemented. The Interface class's methods are all implicitly public and\
    \ abstract.\n\nMore than one interface can be implemented by a Java class (multiple\
    \ interfaces). An interface may be used in a class by appending the keyword \"\
    implements\" after the class name and then the interface name.\n\nThe following\
    \ are some main features of the interface.\n\n- The interface method's body is\
    \ provided by the class.\n- By default, interface methods are abstract and public.\n\
    - A constructor is never present in an interface.\n- The nested interface is the\
    \ interface declared inside the interface.\n\n### Declaration\n\n```java\ninterface\
    \ <interface name>\n{\n    //constants declaration\n    //methods declaration\n\
    \    //default\n}\n```\n\n### Use of interface in java\n\nInterfaces are used\
    \ in Java for a variety of reasons, including:\n- achieving complete abstraction;\
    \ and\n- achieving multiple inheritance.\n- To make abstraction work.\n- To cover\
    \ unnecessary data and only show the most important facts.\n- To ensure safety.\n\
    - The aim is to achieve a loose coupling.\n\nTo use several interfaces, use a\
    \ comma to distinguish each one (,). Objects cannot be created using interfaces.\n\
    \nTake a look at the example below.\n\n## Example 1\n\n```java\ninterface First\n\
    {\n    public void method1();\n}\ninterface Second\n{\n    public void method2();\n\
    }\nclass TestDemo implements First, Second\n{\n    public void method1()\n   \
    \ {\n        System.out.println(\"Text 1\");\n    }\n    public void method2()\n\
    \    {\n        System.out.println(\"Text 2\");\n    }\n}\nclass MyClass\n{\n\
    \    public static void main(String[] args)\n    {\n        TestDemo obj=new TestDemo();\n\
    \        obj.method1();\n        obj.method2();\n    }\n}\n```\n\n### OUTPUT\n\
    \n```\nText 1\nText 2\n```\n\n## Real World example\n\n## Example 2\n\nThe Vehicle\
    \ interface has only one method in this case. Car and Bike are the groups that\
    \ enforce it. An interface is specified by someone else in Java, but it is implemented\
    \ by various implementation providers.\nIt is also in use by someone else.\nThe\
    \ implementation aspect of the method is concealed from the user of the interface\
    \ during this process.\n\n```java\ninterface Vehicle{\n    void run();\n}\n//Implementation\
    \ by second user\nclass Car implements Vehicle{\n    public void run(){System.out.println(\"\
    Car is running\");}\n}\nclass Bike implements Vehicle{\n    public void run(){System.out.println(\"\
    Bike is running\");}\n}\n//Using interface by third user\nclass TestInterface{\n\
    \    public static void main(String args[]){\n        Vehicle obj=new Bike();//object\
    \ is provided by method\n        obj.run();\n    }\n}\n```\n\n### OUTPUT\n\n```\n\
    Bike is running\n```\n\n## In Java, you can have Multiple inheritance based on\
    \ the interface.\n\nMultiple inheritance occurs when an interface extends multiple\
    \ interfaces or a class implements multiple interfaces.\n\n## Example\n\n```java\n\
    interface Printable{\n    void printMsg();\n}\ninterface Showable{\n    void showMsg();\n\
    }\nclass TestInterface2 implements Printable,Showable{\n    public void printMsg(){System.out.println(\"\
    Get to the Safe zone\");}\n    public void showMsg(){System.out.println(\"Message\
    \ Displayed\");}\n    public static void main(String args[]){\n        TestInterface2\
    \ obj = new TestInterface2();\n        obj.printMsg();\n        obj.showMsg();\n\
    \    }\n}\n```\n\n### OUTPUT\n\n```\nGet to the Safe zone\nMessage Displayed\n\
    ```\n\n## Static Method - Interface\n\nStatic approaches are assisted by interfaces.\
    \ They can be used in user interfaces.\nTake a look at the example below.\n\n\
    ```java\ninterface Vehicle{\n    void run();\n    static int cube(int x){return\
    \ x*x*x;}\n}\nclass Car implements Vehicle{\n    public void run(){System.out.println(\"\
    Car is running\");}\n}\nclass Bike implements Vehicle{\n    public void run(){System.out.println(\"\
    Bike is running\");}\n}\nclass TestInterface{\n    public static void main(String\
    \ args[]){\n        Vehicle obj=new Bike();\n        obj.run();\n        System.out.println(Vehicle.cube(7));\n\
    \    }\n}\n```\n\n### OUTPUT\n\n```\nBike is running\n343\n```\n\n## PYTHON PROGRAMMING\
    \ BASICS\n\n## STEP BY STEP GUIDE FOR BEGINNERS\n\nJAKE BOND\n\n## Python Tutorial\n\
    \nPython tutorial is a commonly used programming language that enables both beginners\
    \ and experts to quickly grasp the fundamentals of Python programming.\n\nPython\
    \ is a high-level, simple, interpreted, general-purpose, and dynamic programming\
