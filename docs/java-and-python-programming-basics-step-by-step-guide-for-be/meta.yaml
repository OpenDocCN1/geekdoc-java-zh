    # Java inheritance with Example


    Inheritance in Java is a process by which a child object inherits all of its parent''s
    properties and behaviors.

    It facilitates code reuse and creates a link between different classes.

    It''s a necessary component of oops (object-oriented programming system).

    In real life, a son inherits his father''s estate in the same way that inheritance
    works in Java.

    Java is based on the premise of a son and father relationship.

    A parent-child relationship, also known as an IS-A relationship, is represented
    by Java inheritance.

    There are two classes in Java.


    +   - Parent class / Superclass / Base class

    - Child class/ Subclass /Derived class


    A parent class inherits properties from its children, while a child class inherits
    from its parents.

    The ‘extends'' keyword in Java is used to inherit a class''s attributes and methods.

