  md: '# How to read the file


    Read () is a Python function that reads the contents of a file. The read () method
    takes a string from a file and returns it. The following is the syntax:


    **Fileobj.read(count)**


    The count statement takes a positive number and counts the characters in the string.For
    example:


    ```

    fs = open(''myfile.txt'',''r'')

    z=fs.read(10)

    y = type(z)

