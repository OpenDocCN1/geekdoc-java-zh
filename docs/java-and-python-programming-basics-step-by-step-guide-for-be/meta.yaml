    \n## Java基本数据类型\n\n在编程语言中，基本数据类型是最基本的数据类型。它们是语言内置的。基本类型的名称相当描述性地说明了它们可以存储的值。Java中指定了以下八种基本数据类型：\n\
    \nchar, byte, short, int, long, float, double, boolean\n\n**boolean:** - 布尔变量的两个可能值是真或假。它用于只有两种可能结果的情况。\n\
