    \n### 实例变量：\n\n实例变量在类的所有方法之外声明。类中指定的所有实例（或非静态）方法都可以访问它。\n\n### 类变量：\n\nstatic关键字用于描述类变量。类变量与整个类相关联，而不是与类中的单个对象相关联。类变量是所有对象共享的变量。类变量不会在对象中重复。要访问类变量，我们甚至不需要一个实体。可以使用描述它的类的名称来访问它：\n\
    \n*比较局部变量在不同作用域中的使用。*\n\n- 局部变量在方法内定义，通常用于存储计算的中间结果。\n- 方法参数用于将值传递给方法。这些值可以被操作，也可以分配给实例变量。\n\
    - 实例变量用于存储对象的状态。这些是需要被多个方法访问的值。\n- 类变量用于存储应由类的所有对象共享的值。\n\n## Java循环\n\n### Java\
    \ Do While循环\n\ndo-while循环用于在循环结束时评估退出条件。由于条件表达式位于循环底部，do-while循环仍然至少执行一次循环体。\n\
