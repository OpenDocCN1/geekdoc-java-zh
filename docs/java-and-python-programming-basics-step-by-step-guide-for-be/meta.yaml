    \n5. **动态类型**\n\nPython 是一种动态类型语言，这意味着在声明变量时，数据类型不委托。\n值的类型是在运行时确定的，而不是预先确定的。\n\
    当我们用值声明一个变量时，该值被保存在内存中，并将变量附加到内存容器。\n例如，我们可以将字符串值 x=\"Hello world\" 分配给一个字符串变量。\n\
