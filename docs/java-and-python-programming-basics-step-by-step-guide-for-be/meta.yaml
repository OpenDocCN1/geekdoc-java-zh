  mdcn: "## 抽象类的规则\n\n在创建抽象类之前，请记住以下几点。我们可以将它们视为指导原则。\n\n- 我们必须从另一个类继承抽象类才能使用它。\n\
    - 要使用抽象类，你必须首先构建一个扩展它的类。\n- 从父抽象类派生的类必须包含父类的所有方法。\n- 抽象类的对象无法被创建。\n- 如果子类不包含父类的任何方法，则将其声明为抽象类。\n\
    \n## 为什么我们需要抽象类？\n\n假设你有一个包含 `info()` 方法及其子类的 `Student` 类，以及 `name`、`id` 等属性。由于每个名字都有唯一的\
