    - A bytecode interpreter that executes the bytecode line by line.

    - A Just-In-Time (JIT) compiler compiles bytecode and converts it to native code.


    # Java Native Interface (JNI)


    JNI communicates with Native Method Libraries and makes its libraries necessary
    for execution accessible. It also interacts with libraries written in other languages
