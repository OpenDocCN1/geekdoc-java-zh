    \ A block is typically used to group several statements together so that they\
    \ can be used on the requirement.\n\nAn example of a simple block is shown below.\n\
    \n```\n{ //block start\n    int a = 50;\n    a++;\n} //block end\n```\n\n## Java\
    \ example for objects and classes\n\n### Example 1\n\n```\nclass Shop{\n//fields\n\
    float mrp; //instance variable\nString name;\n//main method\npublic static void\
    \ main(String args[]){\n    Shop s1=new Shop(); //creating an object of Shop\n\
    \    //Printing values\n    System.out.println(s1.mrp); //accessing member variable\n\
    \    System.out.println(s1.name);\n}\n}\n```\n\n## OUTPUT\n\n0.0\n\nnull\n\n##\
    \ Constructor in Java with Example\n\n**Java Constructor**\n\nThe constructor\
    \ is used to initialize an entity. It's a code block that sets up a newly generated\
    \ entity.\n\nIt consists of a set of statements that are executed when an object\
    \ is created. Although it is not necessary for a programmer to write a constructor\
    \ for a class, we do so for program efficiency and protection.\n\nIf a class's\
    \ constructor is not specified, the compiler sets member variables to their default\
    \ values.\n\nThe following are some instructions for writing a Java constructor:\n\
    \n- The constructor should have the same name as the class.\n- No value should\
    \ be returned by a constructor (not even void).\n- Abstract, final, static, and\
    \ synchronize constructors should be avoided.\n- A constructor's access can be\
    \ managed using the access modifier in the constructor declaration.\n\n**Example**\n\
    \n```\npublic class Demo{\n//This is the constructor\nDemo()\n{\n}\n..\n}\n```\n\
    \nAfter a Constructor is built, the question of how it functions arises. The response\
    \ is that when an object is generated with the new keyword, a constructor is called\
    \ to initialize the object.\n\n```\nDemo obj= new Demo()\n```\n\nIn this case,\
    \ the new keyword creates an object of the class Demo and calls the constructor\
    \ to initialize it.\n\n### Example\n\n```\npublic class Hello {\n    String name;\n\
    //Constructor\nHello(){\nthis.name = \"Java Constructor.\";\n    }\npublic static\
    \ void main(String[] args) {\n        Hello obj = new Hello();\nSystem.out.println(obj.name);\n\
    \    }\n}\n```\n\n## OUTPUT\n\nJava Constructor.\n\n## Types of constructors\n\
    \nConstructors are divided into three categories.\n\n- Default constructor\n-\
    \ Parameterized constructor\n- No-argument constructor\n\n## Default constructor\n\
    \nBy default, Java uses a constructor to initialize a class's object. If you don't\
    \ write any constructors in your Java program, the Java compiler adds a Default\
    \ constructor.\nThe default constructor gives the objects default values based\
    \ on their type.\nSee the diagram below to see how a default constructor works.\n\
    \nAs shown in the diagram, there is a user-created.java file. The Java compiler\
    \ compiles the code, converts it to a.class file, and creates a constructor for\
    \ the provided class.\n\n## Parameterized constructor\n\nParameterized constructors\
    \ are constructors that accept arguments or parameters. Attribute initialization\
    \ is done with these parameters.\n\n### Example\n\n```\npublic class ExDemo{\n\
    int x;\npublic ExDemo(int y) {\nx = y;\n}\npublic static void main(String[] args)\
    \ {\nExDemo Obj = new ExDemo(5);\nSystem.out.println(Obj.x);\n}\n}\n```\n\n##\
    \ OUTPUT\n\n5\n\n## No-argument constructor\n\nThe term \"No-argument constructor\"\
    \ refers to a constructor that has no parameters or arguments. The signature of\
    \ the No-argument constructor is identical to that of the default constructor;\
    \ however, unlike the default constructor, the body can contain any code.\n\n\
    The compiler does not generate a default constructor if you write a constructor\
    \ with arguments or no arguments.\n\n### Example\n\n```\nclass ExDemo1\n{\npublic\
    \ ExDemo1()\n    {\nSystem.out.println(\"In No-arg constructor\");\n    }\npublic\
    \ static void main(String args[]) {\n    new ExDemo1();\n    }\n}\n```\n\n## OUTPUT\n\
    \nIn No-arg constructor\n\n## Constructor overloading\n\nOverloading is possible\
    \ with constructors, just as it is with methods. Constructor overloading is a\
    \ Java technique that allows a class to have as many constructors as it wants,\
    \ as long as each constructor has a different parameter list. The number of parameters\
    \ and their types are used by the compiler to classify constructors.\n\nTake a\
    \ look at the example below.\n\n### Example\n\n```\nclass Student\n    {\nint\
    \ Roll_no;\n        String SName;\ndouble Marks;\nStudent(int R, String N, double\
    \ M) //Constructor 1\n{\nRoll_no = R;\nSName = N;\nMarks = M;\n}\nStudent(String\
    \ N, double M, int R) //Constructor 2\n{\nRoll_no = R;\nSName = N;\nMarks = M;\n\
    }\nvoid Display()\n{\nSystem.out.print(\"\\n\\t\" + Roll_no+\"\\t\" + SName+\"\
    \\t\" + Marks);\n}\npublic static void main(String[] args)\n{\nStudent S1 = new\
    \ Student(1,\"akash mishra\",85.57); // Statement 2\nStudent S2 = new Student(2,\"\
    vaibhav Saxena\",87.65); // Statement 1\nSystem.out.print(\"\\n\\tRoll_no\\tSName\\\
    tMarks\\n\");\nS1.Display();\nS2.Display();\n}\n}\n```\n\n## OUTPUT\n\n| Roll_no\
    \ | SName | Marks |\n|---|---|---|\n| 1 | akash mishra | 85.57 |\n| 2 | vaibhav\
    \ Saxena | 87.65 |\n\n## Constructor chaining\n\nConstructor chaining is a method\
    \ of invoking one constructor from another in the context of the current item.\
    \ You may use a variety of constructors to pass the parameters. You can manage\
    \ all of your initializations in one place. There are two ways to use constructor\
    \ chaining.\n\n- **Within same class**\n- **From base class**\n\nThe this() keyword\
    \ of the constructor of the same class can be used to chain constructors within\
    \ the same class.\n\nThe super() keyword, which calls the constructor from the\
    \ base class, can be used to chain constructors from the base class.\n\n### Constructor\
    \ chaining within the same class using this()\n\n- For constructor chaining, this()\
    \ should always be the first declaration of the constructor.\n- For constructor\
    \ chaining, constructors can be in any order; they don't have to be in that order.\n\
    - There should be at least one constructor that does not use the this() keyword.\n\
    \n```\nclass ExDemo2\n{\n    ExDemo2()\n    {\n        this(11);\n        System.out.println(\"\
    \ Default constructor\");\n    }\n    ExDemo2(int x)\n    {\n        this(10,\
    \ 12);\n        System.out.println(x);\n    }\n    ExDemo2(int x, int y)\n   \
    \ {\n        System.out.println(x * y);\n    }\n    public static void main(String\
    \ args[])\n    {\n        new ExDemo2();\n    }\n}\n```\n\n## OUTPUT\n\n120\n\
    11\nDefault constructor\n\n## Java static keyword\n\nThe static keyword is used\
    \ in Java to manipulate memory. It's compatible with variables, methods, blocks,\
    \ and nested classes. It's used to share a variable method across several classes.\
    \ The key method of a class is usually labeled as static.\n\nTo make a member\
    \ static, use the keyword static before declaring it. A static member can be accessed\
    \ without referencing any object and before any members of its class are created.\
    \ A static method cannot be called as a non-static method.\n\nThe following members\
    \ can be static in Java:\n\n- **Method (class methods)**\n- **Variable (class\
    \ variable)**\n- **Block**\n- **Nested class**\n\nTake a look at the example below\
    \ to grasp the idea of the static keyword.\n\n```\npublic class Demo{\nstatic\
    \ void method1()\n{\nSystem.out.println(\"This is method1\");\n}\npublic static\
    \ void main(String[] args)\n{\nmethod1();\n}\n}\n```\n\n## OUTPUT\n\nThis is method1\n\
    \n## Java static methods\n\nA static method is one that does not interact with\
    \ the class's instance variables. The static keyword is used to declare a static\
    \ process. Since the JVM first executes the static method before creating the\
    \ object, the static method does not operate on instance variables.\n\nThe main()\
    \ method is the most common example of a static method. A static method is part\
    \ of the class; it is not part of the class's object. Static data members can\
    \ be accessed by static methods. It has the potential to alter the meaning of\
    \ a static data member. It can be accessed before the class's objects are created.\n\
    \n### Example\n\nWe'll learn how to use the static keyword with the aid of this\
    \ example. This is a simple calculation example.\n\n```\nclass Calc{\n    static\
    \ int cube(int a){\n        return a*a*a;\n    }\n    public static void main(String\
    \ args[]){\n        int result=Calc.cube(7);\n        System.out.println(result);\n\
    \    }\n}\n```\n\n## OUTPUT\n\n343\n\nStatic approaches have certain limitations.\n\
    The following are the limitations of a static method:\n\n- These methods can only\
    \ call other static methods directly.\n- These approaches can only access static\
    \ data directly.\n- These methods cannot make any reference to this or super."
  mdcn: "## Java 中的代码块\n\n一个或多个用花括号括起来的语句构成一个代码块。代码块通常用于将多个语句组合在一起，以便根据需求使用。\n\n下面是一个简单代码块的示例。\n\
    \n```\n{ //block start\n    int a = 50;\n    a++;\n} //block end\n```\n\n## Java\
    \ 对象和类的示例\n\n### 示例 1\n\n```\nclass Shop{\n//fields\nfloat mrp; //instance variable\n\
    String name;\n//main method\npublic static void main(String args[]){\n    Shop\
    \ s1=new Shop(); //creating an object of Shop\n    //Printing values\n    System.out.println(s1.mrp);\
    \ //accessing member variable\n    System.out.println(s1.name);\n}\n}\n```\n\n\
    ## 输出\n\n0.0\n\nnull\n\n## Java 中的构造函数及示例\n\n**Java 构造函数**\n\n构造函数用于初始化一个实体。它是一个代码块，用于设置新生成的实体。\n\
    \n它由一组在创建对象时执行的语句组成。虽然程序员不一定要为类编写构造函数，但为了程序效率和保护，我们通常会这样做。\n\n如果未指定类的构造函数，编译器会将成员变量设置为它们的默认值。\n\
    \n以下是编写 Java 构造函数的一些说明：\n\n- 构造函数应与类同名。\n- 构造函数不应返回任何值（甚至不能是 void）。\n- 应避免使用 abstract、final、static\
    \ 和 synchronize 构造函数。\n- 可以在构造函数声明中使用访问修饰符来管理构造函数的访问权限。\n\n**示例**\n\n```\npublic\
    \ class Demo{\n//This is the constructor\nDemo()\n{\n}\n..\n}\n```\n\n构造函数构建完成后，就会产生它如何工作的问题。答案是，当使用\
    \ `new` 关键字生成对象时，会调用构造函数来初始化该对象。\n\n```\nDemo obj= new Demo()\n```\n\n在这种情况下，`new`\
    \ 关键字创建了 `Demo` 类的一个对象，并调用构造函数对其进行初始化。\n\n### 示例\n\n```\npublic class Hello {\n\
    \    String name;\n//Constructor\nHello(){\nthis.name = \"Java Constructor.\"\
    ;\n    }\npublic static void main(String[] args) {\n        Hello obj = new Hello();\n\
    System.out.println(obj.name);\n    }\n}\n```\n\n## 输出\n\nJava Constructor.\n\n\
    ## 构造函数的类型\n\n构造函数分为三类。\n\n- 默认构造函数\n- 带参构造函数\n- 无参构造函数\n\n## 默认构造函数\n\n默认情况下，Java\
    \ 使用构造函数来初始化类的对象。如果你在 Java 程序中没有编写任何构造函数，Java 编译器会添加一个默认构造函数。\n默认构造函数根据对象的类型为其赋予默认值。\n\
    请参阅下图，了解默认构造函数的工作原理。\n\n如图所示，有一个用户创建的 .java 文件。Java 编译器编译代码，将其转换为 .class 文件，并为提供的类创建一个构造函数。\n\
    \n## 带参构造函数\n\n带参构造函数是接受参数或实参的构造函数。属性初始化通过这些参数完成。\n\n### 示例\n\n```\npublic class\
    \ ExDemo{\nint x;\npublic ExDemo(int y) {\nx = y;\n}\npublic static void main(String[]\
    \ args) {\nExDemo Obj = new ExDemo(5);\nSystem.out.println(Obj.x);\n}\n}\n```\n\
    \n## 输出\n\n5\n\n## 无参构造函数\n\n“无参构造函数”是指没有参数或实参的构造函数。无参构造函数的签名与默认构造函数相同；然而，与默认构造函数不同的是，其主体可以包含任何代码。\n\
    \n如果你编写了一个带参数或不带参数的构造函数，编译器就不会生成默认构造函数。\n\n### 示例\n\n```\nclass ExDemo1\n{\npublic\
    \ ExDemo1()\n    {\nSystem.out.println(\"In No-arg constructor\");\n    }\npublic\
    \ static void main(String args[]) {\n    new ExDemo1();\n    }\n}\n```\n\n## 输出\n\
    \nIn No-arg constructor\n\n## 构造函数重载\n\n构造函数可以像方法一样进行重载。构造函数重载是一种 Java 技术，它允许一个类拥有任意数量的构造函数，只要每个构造函数具有不同的参数列表即可。编译器使用参数的数量和类型来区分构造函数。\n\
    \n请看下面的示例。\n\n### 示例\n\n```\nclass Student\n    {\nint Roll_no;\n        String\
    \ SName;\ndouble Marks;\nStudent(int R, String N, double M) //Constructor 1\n\
    {\nRoll_no = R;\nSName = N;\nMarks = M;\n}\nStudent(String N, double M, int R)\
    \ //Constructor 2\n{\nRoll_no = R;\nSName = N;\nMarks = M;\n}\nvoid Display()\n\
    {\nSystem.out.print(\"\\n\\t\" + Roll_no+\"\\t\" + SName+\"\\t\" + Marks);\n}\n\
    public static void main(String[] args)\n{\nStudent S1 = new Student(1,\"akash\
    \ mishra\",85.57); // Statement 2\nStudent S2 = new Student(2,\"vaibhav Saxena\"\
    ,87.65); // Statement 1\nSystem.out.print(\"\\n\\tRoll_no\\tSName\\tMarks\\n\"\
    );\nS1.Display();\nS2.Display();\n}\n}\n```\n\n## 输出\n\n| Roll_no | SName | Marks\
    \ |\n|---|---|---|\n| 1 | akash mishra | 85.57 |\n| 2 | vaibhav Saxena | 87.65\
    \ |\n\n## 构造函数链\n\n构造函数链是在当前对象的上下文中从一个构造函数调用另一个构造函数的方法。你可以使用各种构造函数来传递参数。你可以将所有的初始化操作集中在一个地方管理。使用构造函数链有两种方式。\n\
    \n- **在同一类中**\n- **从基类**\n\n可以使用同一类构造函数的 `this()` 关键字在同一类中链接构造函数。\n\n可以使用 `super()`\
    \ 关键字（它调用基类的构造函数）来链接来自基类的构造函数。\n\n### 使用 this() 在同一类中进行构造函数链\n\n- 对于构造函数链，`this()`\
    \ 应始终是构造函数中的第一个声明。\n- 对于构造函数链，构造函数可以是任何顺序；它们不必按特定顺序排列。\n- 至少应有一个构造函数不使用 `this()`\
    \ 关键字。\n\n```\nclass ExDemo2\n{\n    ExDemo2()\n    {\n        this(11);\n   \
    \     System.out.println(\" Default constructor\");\n    }\n    ExDemo2(int x)\n\
    \    {\n        this(10, 12);\n        System.out.println(x);\n    }\n    ExDemo2(int\
    \ x, int y)\n    {\n        System.out.println(x * y);\n    }\n    public static\
    \ void main(String args[])\n    {\n        new ExDemo2();\n    }\n}\n```\n\n##\
    \ 输出\n\n120\n11\nDefault constructor\n\n## Java static 关键字\n\n`static` 关键字在 Java\
    \ 中用于操作内存。它适用于变量、方法、代码块和嵌套类。它用于在多个类之间共享变量或方法。类的主要方法通常被标记为 static。\n\n要使成员成为静态的，请在声明它之前使用\
    \ `static` 关键字。静态成员可以在不引用任何对象的情况下访问，并且可以在其类的任何成员创建之前访问。静态方法不能像非静态方法那样被调用。\n\n\
    以下成员在 Java 中可以是静态的：\n\n- **方法（类方法）**\n- **变量（类变量）**\n- **代码块**\n- **嵌套类**\n\n\
    请看下面的示例，以理解 `static` 关键字的概念。\n\n```\npublic class Demo{\nstatic void method1()\n\
    {\nSystem.out.println(\"This is method1\");\n}\npublic static void main(String[]\
    \ args)\n{\nmethod1();\n}\n}\n```\n\n## 输出\n\nThis is method1\n\n## Java 静态方法\n\
    \n静态方法是不与类的实例变量交互的方法。使用 `static` 关键字来声明静态过程。由于 JVM 在创建对象之前首先执行静态方法，因此静态方法不操作实例变量。\n\
    \n`main()` 方法是静态方法最常见的例子。静态方法是类的一部分；它不是类对象的一部分。静态数据成员可以被静态方法访问。它有可能改变静态数据成员的含义。它可以在类的对象创建之前被访问。\n\
    \n### 示例\n\n我们将通过这个示例学习如何使用 `static` 关键字。这是一个简单的计算示例。\n\n```\nclass Calc{\n  \
    \  static int cube(int a){\n        return a*a*a;\n    }\n    public static void\
    \ main(String args[]){\n        int result=Calc.cube(7);\n        System.out.println(result);\n\
    \    }\n}\n```\n\n## 输出\n\n343\n\n静态方法有一些局限性。\n以下是静态方法的局限性：\n\n- 这些方法只能直接调用其他静态方法。\n\
    - 这些方法只能直接访问静态数据。\n- 这些方法不能引用 `this` 或 `super`。"
