    # JVM Stacks


    Each thread has its own stack, which is generated at the same time as the thread.


    Every stack is divided into frames, which are individual pieces. These frames
    are used to store data and partial outcomes, as well as to perform dynamic linking,
    process return values, and exception dispatch.


    The frame of each stack is divided into three parts.


    +   - Local variable storage area

    - Operand stack

    - Frame data.


    +   - All local variables will be stored in the Local variable storage field,
    any operations on top of the variable will be processed and stored in the Operand
    stack, and any exceptions will be stored in the frame data if they occur during
    method execution.

    - Stacks can be static or dynamic in size. It can be chosen at any time during
    the stack construction process.


    # Native Method Stacks


    Native Method Stacks are stacks that are written in a language other than Java.
    When threads are formed, these memory areas are usually assigned to them. This
    memory area''s size can be set or dynamic.


