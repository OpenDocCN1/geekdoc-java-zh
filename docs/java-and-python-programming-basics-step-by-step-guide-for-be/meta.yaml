    \ end: step]\n\n- **start** refers to the starting position of the list element.\n\
    - **stop** refers to the index of the element where we should **stop** just before\
    \ to finishing of our slice.\n- **step** allows you to take each nth-element within\
    \ a **start:stop** range.\n\nLet’s look at this concept using below example:\n\
    Example-1:\n\n```\nlist = [10,20,30,40,50,60,70,80,90]\nprint(list[2:6])\n```\n\
    \n## Output\n\n[30, 40, 50, 60]\n\nSince the start is equal to 2, slicing begins\
    \ at the second position in the example above. Index 2 has a value of 30.\n\n\
    The value of the stop indicates the list's final part, which is 60. As a result,\
    \ it will come to a halt just before the stop index.\n\nEach nth-element can be\
    \ taken within a start:stop range using the steps.\n\n![](img/948933b8e6c2313f8ad91bccc30c7b94_130_0.png)\n\
    \nWe can skip the start index and it will return to starting at 0. For example:\n\
    \n```\nlist = [10,20,30,40,50,60,70,80,90]\nprint(list[:4])\n```\n\n## Output\n\
    \n[10, 20, 30, 40]\n\nSo, list[:4] is the same as the list[0:4]. It's a quick\
