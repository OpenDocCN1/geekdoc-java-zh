    # Why we need an abstract class?


    Assume you have a Student class with the method info() and its subclasses, as
    well as name, id, and so on. Since each name has a unique id, such as ‘a'' with
    id 111 and ‘b'' with id 222, it is pointless to implement this method in the parent
    class since each child class overrides the method to provide implementation information.


    When we know that all of the student classes can circumvent this process, it makes
    no sense to enforce it in the parent class. As a result, making this approach
    abstract is a viable choice. We compel all child classes to follow this method
    by rendering it abstract.


    # Abstract methods


    A method that only has the method description is called an abstract method.

    A method that is abstract does not have an implementation or a body.

    It only specifies the method''s signature. Abstract void method(double X, double
    Y); Syntax abstract void method(double X, double Y);

    A class should be called abstract if it includes at least one abstract method.'
