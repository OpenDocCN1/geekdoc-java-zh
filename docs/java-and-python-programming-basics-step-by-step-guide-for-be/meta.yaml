    \n```\nEx: float average = 10.124F;\n```\n\n**long:** - Long基本数据类型用于存储大整数，范围从-9,223,372,036,854,775,808到9,223,372,036,854,775,807\n\
    \n```\nEx: long e = 1515l;\n```\n\n**int:** - int数据形式表示一个32位有符号二进制补码整数。如果存在内存问题，整数通常用作整数值的默认数据形式。\n\
    \n```\nEx: int d = 123;\n```\n\n**short:** - short数据形式是一个16位有符号二进制补码整数。与byte数据类型一样，short数据类型也可用于节省内存。short的大小是整数的两倍。\n\
    \n```\nEx: short C = 11111;\n```\n\n**byte:** - byte是一个8位有符号二进制补码整数数据形式。由于byte比整数小四倍，它用于在大型数组中节省空间，通常代替整数。\n\
