    # Closing a file


    After completing a file process, we must properly close the file. To close a file,
    Python provides the close () process.

    The close () function releases resources that were previously bound to the file.
    While Python has a garbage collector, it is a good idea to use close () to properly
    close the file.


    ```

    fs = open(''myfile.txt'',''w'')<br>#perform file operation<br> fs.close()

    ```


    # How to write into file


    Write () is a Python function that allows you to write to a file. It must be opened
    in write mode (w or a). Consider the following illustration:


    ```

    # In write mode, open the file myfile.txt. If no such file exists, it creates
    one.

    fs = open(''myfile.txt'',''w'')

    #writing the content to the file

    fs.write("We are writing this line into the file")

    fs.write("Python is the most popular programming language")

    #closing the opened file

    fs.close()

    ```


    # myfile.txt


    We are writing this line into the file. Python is the most popular programming
    language.'
