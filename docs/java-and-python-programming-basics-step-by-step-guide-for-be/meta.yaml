- md: "## JRE (Java Runtime Environment)\n\nJRE is a software kit that installs on\
    \ any operating system and allows you to run Java programs.\n\nIt has little to\
    \ do with the application creation process. It's included in the Java Development\
    \ Kit (JDK).\n\nIt's a software package that includes the Java Class Library,\
    \ tools, and a standalone JVM.\n\n![](img/948933b8e6c2313f8ad91bccc30c7b94_11_0.png)\n\
    \nJRE is the most popular environment for running Java programs on mobile devices.\n\
    \nThe source code is compiled and then converted into Java bytecode.\n\nIf we\
    \ want to run this bytecode on any Operating System, we simply need a JRE for\
    \ that OS, which is freely available on the Oracle website.\n\nThe JRE fetches\
    \ classes, verifies memory access, and retrieves system resources that the generated\
    \ program requires.\n\nThe Java Runtime Environment is a layer that sits on top\
    \ of the operating system and includes:\n\n- It contains technologies such as\
    \ Java Web Start and Java plug-in that are included in the deployment.\n- JRE\
    \ includes user interface toolkits such as Java 2D, AWT (Abstract Window Toolkit),\
    \ Swing, Image I/O, print service, sound, and so on.\n- It includes integration\
    \ libraries such as JDBC and JNDI (Java Naming and Directory Interface), IDL (Interface\
    \ Definition Language), RMI (Remote Method Invocation), and others.\n- It includes\
    \ lang, util, zip, Java Archive (JAR), instrument, reflection, Collections, Concurrency\
    \ Utilities, management, versioning, logging, and the Preferences API, among other\
    \ things.\n- Input/output (I/O), extension mechanisms, Beans, JMX (Java Management\
    \ Extension), Java Native Interface, and JAX-WS are examples of other base libraries\
    \ (Java for XML Processing).\n\n## Working of JRE\n\nAll source code that we write\
    \ must be saved with the .java extension.\n\nNext, we use the \"javac\" command\
    \ in the command prompt to compile our software (no need in any IDE). It converts\
    \ the code to bytecode, which is platform-agnostic.\n\nWhen we compile our software,\
    \ it produces a .class file that contains the bytecode for the equivalent java\
    \ file.\n\nAnd that bytecode can be run on any device that has the JRE installed.\
    \ The procedure is outlined below.\n\n- ClassLoader: It dynamically loads the\
    \ various classes needed for program execution in the JVM (Java Virtual Machine).\
    \ Following are the three class loaders that are used after JVM starts:\n    -\
    \ Bootstrap class loader\n    - Extension class loader\n    - System class loader\n\
    - Byte code verifier: It checks the bytecode during execution to ensure that it\
    \ does not cause the interpreter any problems. Only if the codes pass the bytecode\
    \ verifier's checks, which search for formatting and illegal code, are they interpreted.\n\
    - Interpreter: When the class is loaded and the code is tested, it reads the assembly\
    \ code line by line and executes the two functions below:\n    - It is responsible\
    \ for executing the Byte Code.\n    - Make the required calls to the built-in\
    \ hardware.\n\n## Java Virtual Machine (JVM)\n\nThe Java Virtual Machine (JVM)\
    \ is a virtual runtime environment for executing Java bytecodes.\n\nThe JVM isn't\
    \ aware of the keywords we used in our code. As a result, it's translated to bytecode.\n\
    \nIt manages Java program execution and provides features including automatic\
    \ exception handling and garbage collection.\n\nAny Java file is converted into\
    \ a .class file, which contains the bytecodes, when it is compiled. When we run\
    \ the \".class\" file, it delves into the number of measures. The JVM is defined\
    \ by the whole process.\n\n![](img/948933b8e6c2313f8ad91bccc30c7b94_14_0.png)\n\
    \n## ClassLoader\n\nHandles three activities:\n\n- Loading: It reads the .class\
    \ file and converts it to binary data, which it saves in the method field. It\
    \ saves fully qualified names of the loaded class, its immediate parent class,\
    \ constructor, variables, and method information in the method area for each .class\
    \ file. After loading the .class file, the JVM creates a Class object in heap\
    \ memory.\n- Linking: It determines whether or not the .class file is correctly\
    \ formatted and created by a valid compiler. If the check fails, it throws a run-time\
    \ exception. The JVM allocates memory for class variables and sets the memory\
    \ value to the default.\n- Initialization: The JVM assigns values to all of the\
    \ code's static variables. It uses a top-to-bottom method in the class hierarchy,\
    \ with values allocated from top to bottom or parent to child.\n\nIn Java, there\
    \ are three built-in class loaders:\n\n1. Bootstrap ClassLoader: This is the superclass\
    \ of the Extension classloader, and it loads the rt.jar file, which includes all\
    \ the class files for Java Standard Edition packages like java.lang, java.net,\
    \ and java.util, among others.\n2. Extension ClassLoader: This is a child and\
    \ parent classloader for Bootstrap that loads jar files from the $JAVA_HOME/jre/lib/ext\
    \ directory or any other directory defined by the java.ext.dirs system property.\n\
    3. System/Application ClassLoader: This is the Extension classloader's child classloader.\
    \ It uses the Environment Variable associated with java.class.path to load classes\
    \ from the application classpath.\n\n## JVM Memory\n\nThe memory region of the\
    \ JVM is divided into the following sections:\n\n- The method area contains all\
    \ class-level information, such as the class name, immediate parent class name,\
    \ variables (including static variables), and method details, among other things.\n\
    - Heap area: At runtime, the heap area is a shared resource that stores all object\
    \ information.\n- Stack area: A private JVM stack is generated for each thread\
    \ at the same time as the thread is created. It retains local variables and stores\
    \ frames, as well as participating in process invocation and return. The thread's\
    \ runtime stack will be lost after it is terminated.\n\n## Execution Engine\n\n\
    The execution engine reads the byte-code line by line and executes the .class\
    \ file. It includes the following:\n\n- A virtual processor.\n- A bytecode interpreter\
    \ that executes the bytecode line by line.\n- A Just-In-Time (JIT) compiler compiles\
    \ bytecode and converts it to native code.\n\n## Java Native Interface (JNI)\n\
    \nJNI communicates with Native Method Libraries and makes its libraries necessary\
    \ for execution accessible. It also interacts with libraries written in other\
    \ languages such as C/C++.\n\n## Native Method Libraries\n\nA series of libraries\
    \ written in another language, such as C/C++, that the Execution Engine needs.\n\
    \n## Memory Areas in Java\n\nLet's take a look at how Java does memory management.\
    \ We'll talk about how artifacts are destroyed, how garbage collectors operate,\
    \ and what the JVM is in charge of (Java Virtual Machine).\n\nA programmer must\
    \ understand how memory management works in order to build a high-performance\
    \ program that will not crash or, if it does, will know how to debug and recover\
    \ from the crash.\n\nMemory management is essential in the allocation and deallocation\
    \ of memory areas in any coding language because it requires special attention.\n\
    \nMemory allocation is controlled by the JVM and the Garbage Collector in Java.\n\
    \n## Structure of Java Memory Areas\n\nWhen we run our code, the JVM specifies\
    \ a number of runtime data areas. Some data areas are generated when JVM is started\
    \ and destroyed when JVM is not present, and data areas created during thread\
    \ initialization are destroyed when the thread is not present.\n\n## Heap\n\n\
    Heap denotes the runtime storage field of memory where the actual object is stored.\
    \ It's formed when the virtual machine first boots up.\n\nAny instance of a class\
    \ is given a certain amount of memory. The heap's size is determined by the system's\
    \ configuration.\n\nWhen a new keyword is used, the object is given a heap memory\
    \ field, but the object's reference is kept on the stack.\n\n## Method Areas\n\
    \n- The method area stores class structures, method data, and constructor field\
    \ data, as well as the class's special methods.\n- When the JVM begins, it creates\
    \ it.\n- While the method area is logically a part of the heap, it may or may\
    \ not be garbage collected.\n- The method's size may be set or extended according\
    \ to the computation's needs, and it can also be contracted if the method region\
    \ is being used excessively.\n\n## JVM Stacks\n\nEach thread has its own stack,\
    \ which is generated at the same time as the thread.\n\nEvery stack is divided\
    \ into frames, which are individual pieces. These frames are used to store data\
    \ and partial outcomes, as well as to perform dynamic linking, process return\
    \ values, and exception dispatch.\n\nThe frame of each stack is divided into three\
    \ parts:\n\n- Local variable storage area\n- Operand stack\n- Frame data\n\nAll\
    \ local variables will be stored in the Local variable storage field, any operations\
    \ on top of the variable will be processed and stored in the Operand stack, and\
    \ any exceptions will be stored in the frame data if they occur during method\
    \ execution.\n\nStacks can be static or dynamic in size. It can be chosen at any\
    \ time during the stack construction process.\n\n## Native Method Stacks\n\nNative\
    \ Method Stacks are stacks that are written in a language other than Java. When\
    \ threads are formed, these memory areas are usually assigned to them. This memory\
    \ area's size can be set or dynamic.\n\n## Program Counter (PC) Registers\n\n\
    It saves the address of the currently running Java virtual machine instruction.\n\
    \nEach thread in Java has its own PC register.\n\nSome native libraries are included\
    \ in a Java framework. The program counter"
  mdcn: "## JRE（Java运行时环境）\n\nJRE是一个可以安装在任何操作系统上的软件套件，允许你运行Java程序。\n\n它与应用程序创建过程关系不大。它包含在Java开发工具包（JDK）中。\n\
    \n它是一个包含Java类库、工具和独立JVM的软件包。\n\n![](img/948933b8e6c2313f8ad91bccc30c7b94_11_0.png)\n\
    \nJRE是移动设备上运行Java程序最流行的环境。\n\n源代码被编译，然后转换成Java字节码。\n\n如果我们想在任何操作系统上运行这个字节码，我们只需要为该操作系统准备一个JRE，这可以在Oracle网站上免费获取。\n\
    \nJRE获取类、验证内存访问，并检索生成程序所需的系统资源。\n\nJava运行时环境是位于操作系统之上的一层，包括：\n\n- 它包含部署中包含的Java\
    \ Web Start和Java插件等技术。\n- JRE包括用户界面工具包，如Java 2D、AWT（抽象窗口工具包）、Swing、Image I/O、打印服务、声音等。\n\
    - 它包括集成库，如JDBC和JNDI（Java命名和目录接口）、IDL（接口定义语言）、RMI（远程方法调用）等。\n- 它包括lang、util、zip、Java归档（JAR）、instrument、reflection、Collections、并发工具、管理、版本控制、日志记录和首选项API等。\n\
    - 输入/输出（I/O）、扩展机制、Beans、JMX（Java管理扩展）、Java本机接口和JAX-WS（用于XML处理的Java）是其他基础库的示例。\n\
    \n## JRE的工作原理\n\n我们编写的所有源代码都必须以.java扩展名保存。\n\n接下来，我们在命令提示符中使用“javac”命令来编译我们的软件（在任何IDE中都不需要）。它将代码转换为字节码，这是与平台无关的。\n\
    \n当我们编译软件时，它会生成一个.class文件，其中包含对应java文件的字节码。\n\n而该字节码可以在任何安装了JRE的设备上运行。流程概述如下。\n\
    \n- 类加载器：它动态加载JVM（Java虚拟机）中程序执行所需的各种类。JVM启动后使用以下三个类加载器：\n    - 引导类加载器\n    - 扩展类加载器\n\
    \    - 系统类加载器\n- 字节码验证器：它在执行期间检查字节码，以确保它不会给解释器带来任何问题。只有当代码通过字节码验证器的检查（检查格式和非法代码）时，才会被解释。\n\
    - 解释器：当类被加载并且代码被测试后，它逐行读取汇编代码并执行以下两个功能：\n    - 它负责执行字节码。\n    - 对内置硬件进行必要的调用。\n\
    \n## Java虚拟机（JVM）\n\nJava虚拟机（JVM）是执行Java字节码的虚拟运行时环境。\n\nJVM不知道我们在代码中使用的关键字。因此，它被翻译成字节码。\n\
    \n它管理Java程序的执行，并提供包括自动异常处理和垃圾收集在内的功能。\n\n任何Java文件在编译时都会转换成一个.class文件，其中包含字节码。当我们运行“.class”文件时，它会深入执行一系列措施。整个过程定义了JVM。\n\
    \n![](img/948933b8e6c2313f8ad91bccc30c7b94_14_0.png)\n\n## 类加载器\n\n处理三个活动：\n\n\
    - 加载：它读取.class文件并将其转换为二进制数据，保存在方法区。对于每个.class文件，它将加载类的完全限定名、其直接父类、构造函数、变量和方法信息保存在方法区。加载.class文件后，JVM在堆内存中创建一个Class对象。\n\
    - 链接：它确定.class文件格式是否正确以及是否由有效的编译器创建。如果检查失败，它会抛出一个运行时异常。JVM为类变量分配内存，并将内存值设置为默认值。\n\
    - 初始化：JVM为代码的所有静态变量赋值。它在类层次结构中使用自顶向下的方法，值从上到下或从父到子分配。\n\n在Java中，有三个内置的类加载器：\n\n\
    1. 引导类加载器：这是扩展类加载器的超类，它加载rt.jar文件，该文件包含Java标准版包（如java.lang、java.net和java.util等）的所有类文件。\n\
    2. 扩展类加载器：这是引导类加载器的子类加载器和父类加载器，它从$JAVA_HOME/jre/lib/ext目录或java.ext.dirs系统属性定义的任何其他目录加载jar文件。\n\
    3. 系统/应用程序类加载器：这是扩展类加载器的子类加载器。它使用与java.class.path关联的环境变量从应用程序类路径加载类。\n\n## JVM内存\n\
    \nJVM的内存区域分为以下部分：\n\n- 方法区包含所有类级别的信息，如类名、直接父类名、变量（包括静态变量）和方法详情等。\n- 堆区：在运行时，堆区是一个共享资源，存储所有对象信息。\n\
    - 栈区：在创建线程的同时，会为每个线程生成一个私有的JVM栈。它保留局部变量并存储帧，同时参与过程调用和返回。线程终止后，其运行时栈将丢失。\n\n##\
    \ 执行引擎\n\n执行引擎逐行读取字节码并执行.class文件。它包括以下内容：\n\n- 一个虚拟处理器。\n- 一个逐行执行字节码的字节码解释器。\n\
    - 一个即时（JIT）编译器，它编译字节码并将其转换为本机代码。\n\n## Java本机接口（JNI）\n\nJNI与本机方法库通信，并使其执行所需的库可访问。它还与用其他语言（如C/C++）编写的库交互。\n\
    \n## 本机方法库\n\n执行引擎需要的一系列用其他语言（如C/C++）编写的库。\n\n## Java中的内存区域\n\n让我们看看Java是如何进行内存管理的。我们将讨论工件是如何销毁的、垃圾收集器如何运行以及JVM负责什么（Java虚拟机）。\n\
    \n程序员必须了解内存管理的工作原理，才能构建高性能程序，使其不会崩溃，或者即使崩溃，也知道如何调试和从崩溃中恢复。\n\n内存管理在任何编码语言中内存区域的分配和释放中都至关重要，因为它需要特别关注。\n\
    \n在Java中，内存分配由JVM和垃圾收集器控制。\n\n## Java内存区域的结构\n\n当我们运行代码时，JVM会指定多个运行时数据区域。一些数据区域在JVM启动时创建，在JVM不存在时销毁；在线程初始化期间创建的数据区域在线程不存在时销毁。\n\
    \n## 堆\n\n堆表示内存的运行时存储字段，实际对象存储在其中。它在虚拟机首次启动时形成。\n\n类的任何实例都会被分配一定量的内存。堆的大小由系统配置决定。\n\
    \n当使用new关键字时，对象被分配一个堆内存字段，但对象的引用保存在栈上。\n\n## 方法区\n\n- 方法区存储类结构、方法数据和构造函数字段数据，以及类的特殊方法。\n\
    - 当JVM启动时，它创建方法区。\n- 虽然方法区在逻辑上是堆的一部分，但它可能被垃圾回收，也可能不被垃圾回收。\n- 方法区的大小可以根据计算的需要进行设置或扩展，如果方法区使用过度，也可以收缩。\n\
    \n## JVM栈\n\n每个线程都有自己的栈，它在线程创建的同时生成。\n\n每个栈被划分为帧，这些帧是独立的部分。这些帧用于存储数据和部分结果，以及执行动态链接、过程返回值和异常分派。\n\
    \n每个栈的帧分为三个部分：\n\n- 局部变量存储区\n- 操作数栈\n- 帧数据\n\n所有局部变量将存储在局部变量存储区，变量上的任何操作将被处理并存储在操作数栈中，如果在方法执行期间发生任何异常，将存储在帧数据中。\n\
    \n栈的大小可以是静态的，也可以是动态的。可以在栈构建过程中的任何时间进行选择。\n\n## 本机方法栈\n\n本机方法栈是用Java以外的语言编写的栈。当线程形成时，这些内存区域通常被分配给它们。这个内存区域的大小可以是设置的，也可以是动态的。\n\
    \n## 程序计数器（PC）寄存器\n\n它保存当前正在运行的Java虚拟机指令的地址。\n\nJava中的每个线程都有自己的PC寄存器。\n\n一些本机库包含在Java框架中。程序计数器"
