  md: "# Python Function\n\nA Python function is a reusable, well-organized code block\
    \ that performs a specific task. The functions are a good way to break down a\
    \ large program into manageable chunks. It also allows our program to be reused.\
    \ The feature can be used to reuse a code block.\n\nPython is more versatile than\
    \ other programming languages since all functions are viewed as objects.\n\nThere\
    \ are two types of functions in Python:\n\n+   - **Built-in functions** – The\
    \ Python libraries and packages contain these features.\n- **User-defined functions**\
    \ – These functions are specified by the user according to their needs. In this\
    \ tutorial, we will learn about the user-defined feature.\n\n# Creating a function\n\
    \nThe basic steps for creating a user-defined feature are outlined below.\n\n\
    +   - To describe a function, use the def keyword followed by the function name.\n\
    - Arguments should be written within the function's opening and closing parentheses,\
    \ and the statement should end with a colon.\n- Inside the function body, write\
    \ the program statements to be executed.\n- The return statement is not needed.\
    \ It must appear at the end of the feature.\n\nThe syntax is given below:\n\n\
    ```\ndef function_name(argument list):\n    The function body\n    ....................\n\
    \    ....................\n```"
