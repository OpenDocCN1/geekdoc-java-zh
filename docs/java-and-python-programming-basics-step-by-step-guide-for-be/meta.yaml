  md: '# Memory Areas in Java


    Let''s take a look at how Java does memory management. We''ll talk about how artifacts
    are destroyed, how garbage collectors operate, and what the JVM is in charge of
    (Java Virtual Machine).

    A programmer must understand how memory management works in order to build a high-performance
    program that will not crash or, if it does, will know how to debug and recover
    from the crash.

    Memory management is essential in the allocation and deallocation of memory areas
    in any coding language because it requires special attention.

    Memory allocation is controlled by the JVM and the Garbage Collector in Java.


    # Structure of Java Memory Areas


    When we run our code, the JVM specifies a number of runtime data areas. Some data
    areas are generated when JVM is started and destroyed when JVM is not present,
    and data areas created during thread initialization are destroyed when the thread
    is not present.


    # Heap:


    Heap denotes the runtime storage field of memory where the actual object is stored.
    It''s formed when the virtual machine first boots up.

    Any instance of a class is given a certain amount of memory. The heap''s size
    is determined by the system''s configuration.

    When a new keyword is used, the object is given a heap memory field, but the object''s
    reference is kept on the stack.


    # Method Areas


    +   - The method area stores class structures, method data, and constructor field
    data, as well as the class''s special methods.

