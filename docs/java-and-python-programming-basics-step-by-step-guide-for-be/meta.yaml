- md: "# PYTHON PROGRAMMING BASICS\n\nSTEP BY STEP GUIDE FOR BEGINNERS\n\nJAKE BOND\n\
    \n# JAVA PROGRAMMING BASICS\n\nSTEP BY STEP GUIDE FOR BEGINNERS\n\nJAKE BOND\n\
    \n# JAVA AND PYTHON PROGRAMMING BASICS\n\n# STEP BY STEP GUIDE FOR BEGINNERS\n\
    \nJAKE BOND\n\n[JAVA](JAVA)\n\n[FEATURES OF JAVA](FEATURES OF JAVA)\n\n[JAVA HELLO\
    \ WORLD](JAVA HELLO WORLD)\n\n[JRE (JAVA RUNTIME ENVIRONMENT)](JRE (JAVA RUNTIME\
    \ ENVIRONMENT))\n\n[JAVA VIRTUAL MACHINE (JVM)](JAVA VIRTUAL MACHINE (JVM))\n\n\
    [MEMORY AREAS IN JAVA](MEMORY AREAS IN JAVA)\n\n[JAVA PRIMITIVE DATA TYPES](JAVA\
    \ PRIMITIVE DATA TYPES)\n\n[JAVA VARIABLE](JAVA VARIABLE)\n\n[JAVA LOOPS](JAVA\
    \ LOOPS)\n\n[JAVA DO WHILE LOOP](JAVA DO WHILE LOOP)\n\n[JAVA WHILE LOOP](JAVA\
    \ WHILE LOOP)\n\n[JAVA FOR LOOP](JAVA FOR LOOP)\n\n[JAVA ENHANCED FOR LOOP (FOR-EACH\
    \ LOOP)](JAVA ENHANCED FOR LOOP (FOR-EACH LOOP))\n\n[OBJECT ORIENTED PROGRAMMING\
    \ (OOPS)](OBJECT ORIENTED PROGRAMMING (OOPS))\n\n[OBJECTS AND CLASSES IN JAVA](OBJECTS\
    \ AND CLASSES IN JAVA)\n\n[CONSTRUCTOR IN JAVA WITH EXAMPLE](CONSTRUCTOR IN JAVA\
    \ WITH EXAMPLE)\n\n[JAVA STATIC KEYWORD](JAVA STATIC KEYWORD)\n\n[JAVA INHERITANCE\
    \ WITH EXAMPLE](JAVA INHERITANCE WITH EXAMPLE)\n\n[ABSTRACT CLASSES IN JAVA](ABSTRACT\
    \ CLASSES IN JAVA)\n\n[INTERFACE IN JAVA](INTERFACE IN JAVA)\n\n[PYTHON TUTORIAL](PYTHON\
    \ TUTORIAL)\n\n[FEATURES OF PYTHON](FEATURES OF PYTHON)\n\n[PYTHON SETUP GUIDE\
    \ AND INSTALLATION](PYTHON SETUP GUIDE AND INSTALLATION)\n\n[PYTHON KEYWORDS](PYTHON\
    \ KEYWORDS)\n\n[PYTHON OPERATORS](PYTHON OPERATORS)\n\n[PYTHON COMMENTS](PYTHON\
    \ COMMENTS)\n\n[PYTHON IF STATEMENT](PYTHON IF STATEMENT)\n\n[PYTHON ELIF](PYTHON\
    \ ELIF)\n\n[PYTHON FOR LOOP](PYTHON FOR LOOP)\n\n[PYTHON WHILE LOOP](PYTHON WHILE\
    \ LOOP)\n\n[PYTHON LIST](PYTHON LIST)\n\nPYTHON TUPLE METHODS\n\nPYTHON DICTIONARY\n\
    \nPYTHON FUNCTION\n\nPYTHON FILE HANDLING\n\n# JAVA PROGRAMMING BASICS\n\n# STEP\
    \ BY STEP GUIDE FOR BEGINNERS\n\nJAKE BOND\n\n# JAVA\n\nJava is a platform-independent,\
    \ object-oriented, robust, and stable programming language. We can create terminal,\
    \ window, network, business, and mobile applications with the help of Java programming.\n\
    \nThe Java programming language was created in 1995 by James Gosling, who is known\
    \ as the \"Father of Java.\" On January 23, 1996, the first version of Java was\
    \ released.\n\nJava is divided into three editions: Java SE (Java Standard Edition),\
    \ Java EE (Java Enterprise Edition), and Java ME (Java Micro Edition).\n\n## Java\
    \ Hello World Example\n\n```\nclass HelloWorldJava\n{\n    public static void\
    \ main(String[] args)\n    {\n        System.out.println(\"Hello World!\");\n\
    \    }\n}\n```\n\n### OUTPUT\n\nHello World!\n\n# Features of Java\n\nThe Java\
    \ programming language was created with portability, stability, and simplicity\
    \ in mind. Despite this, Java has a range of features that make it a common programming\
    \ language.\n\nThe following is a list of Java's most essential features.\n\n\
    Object-Oriented: In the Java programming language, everything is an object.\n\n\
    We structure our application as a set of different types of objects that contain\
    \ both data and actions, which is known as object-oriented programming.\n\nThe\
    \ following are the fundamental principles of Object-Oriented Programming:\n\n\
    - Object\n- Class\n- Inheritance\n- Polymorphism\n- Abstraction\n- Encapsulation\n\
    \n- **Simple:** Because of its plain and easy-to-understand syntax, the language\
    \ is simple to learn. In comparison to C++, it has also omitted several complex\
    \ methods (e.g. explicit pointers, operator overloading, etc.).\n\n- **Platform\
    \ Independent:** Other programming languages, such as C and C++, are compiled\
    \ as platform-specific code, whereas Java is not. Java, on the other hand, is\
    \ a platform-independent language that is guaranteed to be a write-once, run-anywhere\
    \ language.\n\nJava is a software-based platform for various operating systems\
    \ that consists of two parts:\n\n- Runtime Environment\n- API (Application Programming\
    \ Interface)\n\nJava programs can run on a variety of platforms, including Windows,\
    \ Linux, and Mac OS X. The compiler compiles the code and converts it to bytecode,\
    \ which is platform agnostic. These bytecodes are portable, meaning they can be\
    \ used on a variety of platforms. Java is a WORA (Write Once, Run Anywhere) programming\
    \ language because of this.\n\n- **Secure:** Java is the most stable programming\
    \ language because it offers a runtime environment that requires virtually no\
    \ interaction with the operating system. Because of the customizable \"Sandbox\"\
    \ based security model, a Java program can run safely without posing a risk to\
    \ the system or users.\n\nCryptography, authentication and authorization, public\
    \ key infrastructure, and several other security features are built-in.\n\n- **Robust:**\
    \ Java has excellent memory management and error handling capabilities. It removes\
    \ the error-prone situation by focusing on compile-time and runtime error checking\
    \ primarily. Automatic Garbage Collection is a Java feature that allows you to\
    \ get rid of artifacts that are no longer required in your application and free\
    \ up memory.\n\n- **Architecture-neutral:** Since the Java language has no implementation-dependent\
    \ aspects, it is architecture-neutral, allowing compiled code to run on a wide\
    \ range of processors with JRE.\n\n- **Portable:** Compiled codes can be run on\
    \ a wide range of processors thanks to the lack of implementation dependencies.\
    \ This emphasizes its portability.\n\n- **Multi-threaded:** The Java application\
    \ can perform multiple tasks at the same time thanks to this function. A thread\
    \ is a different program that runs at the same time. Multi-threading has the benefit\
    \ of sharing the common memory region, which means no memory is lost.\n\n- **Interpreted:**\
    \ Java bytecodes are converted to native machine instructions on the fly and are\
    \ not saved anywhere.\n\n- **High Performance:** The performance of a program\
    \ can be improved by using a JIT (Just in Time Compiler).\n\n- **Distributed:**\
    \ The ability to build a distributed application is provided by Java. To create\
    \ distributed applications, RMI and EJB are used. It allows us to access files\
    \ by invoking methods from any computer connected to the internet.\n\n- **Dynamic:**\
    \ It is a dynamic language since it allows for dynamic class loading, which means\
    \ that the class files are loaded at runtime. Java has an automatic memory management\
    \ feature that allows it to be dynamic.\n\n# Java Hello World\n\nWrite the software\
    \ in any text editor or integrated development environment (IDE) (Eclipse, Netbeans,\
    \ etc.) and save it as a .java file.\n\nTo compile the file, type \"javac filename.java\"\
    \ in the command prompt or terminal in Linux, or press the play button on the\
    \ toolbar in any IDE.\n\nType \"java filename\" in the terminal/command prompt\
    \ to run your program.\n\n```\npublic class MyClass //class\n{\n    //this is\
    \ the main method\n    public static void main(String[] args)\n    {\n       \
    \ //displaying Hello World\n        System.out.println(\"Hello World\");\n   \
    \ }\n}\n```\n\nEvery line of code that runs in Java must be written within the\
    \ class. In our example, we named the class MyClass and wrote the code inside\
    \ it.\n\nThe entry point or starting point is the key method in the above program.\n\
    \nThe following is an overview of the keywords used in the main method:\n\n- **public**\
    \ - anyone has access to this method\n- **static** - Without creating an instance\
    \ of the class containing the main method, the method can run.\n- **void** - method\
    \ doesn't return any value.\n- **main** - main is the name of the method.\n- **String[]**\
    \ - The method accepts a single argument: an array of elements of type String.\n\
    \nThe body of the key method is written in curly braces:\n\nSystem.out.println()\n\
    \n- The println method displays a single line of text in the output window.\n\
    - The println method is accessed using the System class and the out stream.\n\n\
    Note: Each statement in Java must end with a semicolon. Semicolons, on the other\
    \ hand, can not be used after process or class declarations.\n\n**Comments:**\
    \ In the program, there are two ways to compose comments. It can be a single-line\
    \ or multiple-line statement.\n\n**Single line comment:** The double forward slash\
    \ ( // ) at the beginning of any line defines it.\n\n**Multiline Comment:** At\
    \ both ends of the paragraph, a single forward slash and an asterisk (/* comment\
    \ */) characterize it."
  mdcn: "# JAVA 编程基础\n\n初学者分步指南\n\nJAKE BOND\n\n# JAVA 编程基础\n\n初学者分步指南\n\nJAKE BOND\n\
    \n# JAVA 与 PYTHON 编程基础\n\n# 初学者分步指南\n\nJAKE BOND\n\n[JAVA](JAVA)\n\n[JAVA 的特性](FEATURES\
    \ OF JAVA)\n\n[JAVA HELLO WORLD](JAVA HELLO WORLD)\n\n[JRE (JAVA 运行时环境)](JRE (JAVA\
    \ RUNTIME ENVIRONMENT))\n\n[JAVA 虚拟机 (JVM)](JAVA VIRTUAL MACHINE (JVM))\n\n[JAVA\
    \ 中的内存区域](MEMORY AREAS IN JAVA)\n\n[JAVA 基本数据类型](JAVA PRIMITIVE DATA TYPES)\n\n\
    [JAVA 变量](JAVA VARIABLE)\n\n[JAVA 循环](JAVA LOOPS)\n\n[JAVA DO WHILE 循环](JAVA DO\
    \ WHILE LOOP)\n\n[JAVA WHILE 循环](JAVA WHILE LOOP)\n\n[JAVA FOR 循环](JAVA FOR LOOP)\n\
    \n[JAVA 增强 FOR 循环 (FOR-EACH 循环)](JAVA ENHANCED FOR LOOP (FOR-EACH LOOP))\n\n[面向对象编程\
    \ (OOPS)](OBJECT ORIENTED PROGRAMMING (OOPS))\n\n[JAVA 中的对象和类](OBJECTS AND CLASSES\
    \ IN JAVA)\n\n[JAVA 构造函数及示例](CONSTRUCTOR IN JAVA WITH EXAMPLE)\n\n[JAVA 静态关键字](JAVA\
    \ STATIC KEYWORD)\n\n[JAVA 继承及示例](JAVA INHERITANCE WITH EXAMPLE)\n\n[JAVA 中的抽象类](ABSTRACT\
    \ CLASSES IN JAVA)\n\n[JAVA 中的接口](INTERFACE IN JAVA)\n\n[PYTHON 教程](PYTHON TUTORIAL)\n\
    \n[PYTHON 的特性](FEATURES OF PYTHON)\n\n[PYTHON 设置指南与安装](PYTHON SETUP GUIDE AND\
    \ INSTALLATION)\n\n[PYTHON 关键字](PYTHON KEYWORDS)\n\n[PYTHON 运算符](PYTHON OPERATORS)\n\
    \n[PYTHON 注释](PYTHON COMMENTS)\n\n[PYTHON IF 语句](PYTHON IF STATEMENT)\n\n[PYTHON\
    \ ELIF](PYTHON ELIF)\n\n[PYTHON FOR 循环](PYTHON FOR LOOP)\n\n[PYTHON WHILE 循环](PYTHON\
    \ WHILE LOOP)\n\n[PYTHON 列表](PYTHON LIST)\n\nPYTHON 元组方法\n\nPYTHON 字典\n\nPYTHON\
    \ 函数\n\nPYTHON 文件处理\n\n# JAVA 编程基础\n\n# 初学者分步指南\n\nJAKE BOND\n\n# JAVA\n\nJava\
    \ 是一种平台无关、面向对象、健壮且稳定的编程语言。借助 Java 编程，我们可以创建终端、窗口、网络、业务和移动应用程序。\n\nJava 编程语言由 James\
    \ Gosling 于 1995 年创建，他被誉为“Java 之父”。1996 年 1 月 23 日，Java 的第一个版本发布。\n\nJava 分为三个版本：Java\
    \ SE（Java 标准版）、Java EE（Java 企业版）和 Java ME（Java 微型版）。\n\n## Java Hello World 示例\n\
    \n```\nclass HelloWorldJava\n{\n    public static void main(String[] args)\n \
    \   {\n        System.out.println(\"Hello World!\");\n    }\n}\n```\n\n### 输出\n\
    \nHello World!\n\n# Java 的特性\n\nJava 编程语言在创建时就考虑了可移植性、稳定性和简洁性。尽管如此，Java 仍具有一系列特性，使其成为一种通用的编程语言。\n\
    \n以下是 Java 最基本的特性列表。\n\n面向对象：在 Java 编程语言中，一切都是对象。\n\n我们将应用程序构建为包含数据和操作的不同类型对象的集合，这被称为面向对象编程。\n\
    \n以下是面向对象编程的基本原则：\n\n- 对象\n- 类\n- 继承\n- 多态\n- 抽象\n- 封装\n\n- **简单：** 由于其语法简洁易懂，该语言易于学习。与\
    \ C++ 相比，它还省略了一些复杂的方法（例如显式指针、运算符重载等）。\n\n- **平台无关：** 其他编程语言（如 C 和 C++）被编译为特定于平台的代码，而\
    \ Java 则不是。另一方面，Java 是一种平台无关的语言，保证是“一次编写，到处运行”的语言。\n\nJava 是一个基于软件的平台，适用于各种操作系统，由两部分组成：\n\
    \n- 运行时环境\n- API（应用程序编程接口）\n\nJava 程序可以在多种平台上运行，包括 Windows、Linux 和 Mac OS X。编译器编译代码并将其转换为与平台无关的字节码。这些字节码是可移植的，意味着它们可以在多种平台上使用。因此，Java\
    \ 是一种 WORA（一次编写，到处运行）的编程语言。\n\n- **安全：** Java 是最稳定的编程语言，因为它提供了一个几乎不需要与操作系统交互的运行时环境。由于其可定制的基于“沙箱”的安全模型，Java\
    \ 程序可以安全运行，不会对系统或用户构成风险。\n\n内置了加密、认证和授权、公钥基础设施以及许多其他安全功能。\n\n- **健壮：** Java 具有出色的内存管理和错误处理能力。它主要通过关注编译时和运行时错误检查来消除容易出错的情况。自动垃圾回收是\
    \ Java 的一项功能，它允许你摆脱应用程序中不再需要的工件并释放内存。\n\n- **架构中立：** 由于 Java 语言没有依赖于实现的方面，因此它是架构中立的，允许编译后的代码在配备\
    \ JRE 的各种处理器上运行。\n\n- **可移植：** 由于没有实现依赖性，编译后的代码可以在各种处理器上运行。这强调了其可移植性。\n\n- **多线程：**\
    \ 借助此功能，Java 应用程序可以同时执行多个任务。线程是同时运行的不同程序。多线程的好处是共享公共内存区域，这意味着不会浪费内存。\n\n- **解释型：**\
    \ Java 字节码被即时转换为本机机器指令，不会保存在任何地方。\n\n- **高性能：** 可以通过使用 JIT（即时编译器）来提高程序的性能。\n\n\
    - **分布式：** Java 提供了构建分布式应用程序的能力。RMI 和 EJB 用于创建分布式应用程序。它允许我们通过从任何连接到互联网的计算机调用方法来访问文件。\n\
    \n- **动态：** 它是一种动态语言，因为它允许动态类加载，这意味着类文件在运行时加载。Java 具有自动内存管理功能，使其能够动态化。\n\n# Java\
    \ Hello World\n\n在任何文本编辑器或集成开发环境（IDE）（Eclipse、Netbeans 等）中编写软件，并将其保存为 .java 文件。\n\
    \n要编译文件，请在命令提示符或 Linux 终端中键入“javac filename.java”，或在任何 IDE 中单击工具栏上的播放按钮。\n\n在终端/命令提示符中键入“java\
    \ filename”以运行你的程序。\n\n```\npublic class MyClass //class\n{\n    //this is the\
    \ main method\n    public static void main(String[] args)\n    {\n        //displaying\
    \ Hello World\n        System.out.println(\"Hello World\");\n    }\n}\n```\n\n\
    在 Java 中运行的每一行代码都必须写在类内部。在我们的示例中，我们将类命名为 MyClass 并在其中编写了代码。\n\n上述程序中的关键方法是入口点或起点。\n\
    \n以下是 main 方法中使用的关键字概述：\n\n- **public** - 任何人都可以访问此方法\n- **static** - 无需创建包含 main\
    \ 方法的类的实例，该方法即可运行。\n- **void** - 方法不返回任何值。\n- **main** - main 是方法的名称。\n- **String[]**\
    \ - 该方法接受一个参数：一个 String 类型的元素数组。\n\n关键方法的主体写在花括号中：\n\nSystem.out.println()\n\n\
    - println 方法在输出窗口中显示一行文本。\n- println 方法通过 System 类和 out 流进行访问。\n\n注意：Java 中的每个语句都必须以分号结尾。但是，过程或类声明后不能使用分号。\n\
    \n**注释：** 在程序中，有两种编写注释的方式。它可以是单行或多行语句。\n\n**单行注释：** 任何行开头的双斜杠（ // ）定义它。\n\n**多行注释：**\
    \ 在段落的两端，一个斜杠和一个星号（/* comment */）来标识它。"
