    这意味着在方法内声明的变量在方法外不会保留其值。同样，当退出一个块时，在其中声明的变量会失去其值。\n\n因此，变量的生命周期包含在其定义中。\n\n以下是变量的可用作用域：\n\
    \n- 局部变量（也称为方法局部变量）\n- 方法参数（也称为方法实参）\n- 实例变量（也称为属性、字段和非静态变量）\n- 类变量（也称为静态变量）\n\
    \n### 局部变量：\n\n局部变量在过程、构造函数或块内指定。访问修饰符不能应用于局部变量。\n局部变量仅在声明的过程、块或构造函数的作用域内可见。\n\
