    1. *Class*: A class is a model for forming real-world entities known as objects.
    A class is made up of several variables and methods. Class does not exist physically,
    and it does not occupy any room of its own.


    E.g. Fruit, Building, Shape, Vehicle, etc.


    2. *Objects*: They are the heart and soul of the OOP. They exist in the real world
    and have a state and behaviour. Objects and their actions are used to evaluate
    every application. Objects are aligned with groups, and the class provides them
    with structure. More than one object may be associated with the same class. Each
    of these items has the ability to interact with one another. Objects take up room
    in our memories.


    *E.g.* mango, banana, apple, car, bus, person, etc.


    3. *Inheritance*: An inheritance is a crucial concept in OOP. It is a property
    that allows one class to succeed another. Hierarchical programming is supported.
    We have a class with some methods and variables defined; if we need to create
    a class that inherits all of the properties of the previous class while still
    adding some new features, we can use inheritance. The parent class or superclass
    is the previously defined class, and the child class is the class that inherits
    the features of the previously defined class.


    4. *Polymorphism*: Poly stands for "many" and "morph" stands for "form." Polymorphism
    is described as the ability to take several different forms. Remember when you
    were a kid and you were watching ghost shows and the ghost could take the form
    of any person, animal, or other imaginable object depending on what he needed?
    This is the concept of polymorphism. An entity can take many different forms as
    and when necessary.


    There are two types of polymorphism:


    **Compile time polymorphism**


    **Run time polymorphism**


    5. *Encapsulation*: The act of encapsulating or binding data and code into a single
    entity is known as encapsulation. It''s important because it aids in data hiding
    and data protection in our code. It can be accomplished in a variety of ways.
    One of them is to take advantage of the numerous access specifiers available.
    Another option is to use class nesting, in which the private code is'
