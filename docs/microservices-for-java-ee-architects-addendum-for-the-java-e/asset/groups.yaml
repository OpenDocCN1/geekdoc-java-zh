    ## 提高开发速度


    假设所需服务的合约以及这些服务之间的依赖关系已完全定义，那么让更多的开发团队加入正在进行的工作就会变得更容易。引入额外开发者的担忧在于，这通常意味着更多的通信开销。由于开销的增加，开发者的生产力会产生递减收益。你每增加一个开发者，所获得的生产力就越少。


    虽然微服务团队中单个开发者的生产力确实会增加，因为他们没有那么多通信开销，但任何单个开发者能带来的生产力提升都是有限的。你的速度实际上来自于添加新团队的简易程度。当开发者在一个小而专注的团队中埋头开发时，他们永远看不到也受不受他们所做的整体工作规模的影响。因此，管理层更容易将开发工作扩展到更大数量的开发者。请注意，在所有服务合约都完全定义的情况下，你还必须识别出合约之间的任何依赖关系；某些服务可能要求在完成特定服务的工作之前完成其他服务。请注意，任何开发团队都可以对依赖服务进行存根（stub），并在依赖服务完成之前开始工作。


    这里真正发生的情况是，扩展开发的限制因素转移到了负责识别单个服务并规范服务合约的管理层和企业架构师。随着工作规模扩大，会有更多的协调点。由于某些服务会调用其他服务，那些依赖服务需要先构建。工作流向开发团队的顺序需要进行协调。


    ## 技术栈自由


    在微服务世界中，服务是容器化的。也就是说，部署产物包含了操作系统及其所需的其他软件（例如 Java JVM、PHP、Python、GoLang 等）。每个服务都可以轻松地在这些技术的不同层上运行。结果是，新技术可以更容易地引入或升级。这使得你能够比传统的单体
    Web 应用快得多地利用更新颖的技术。


    对于传统的 Web 应用来说，代码库要大得多。因此，升级的影响会大得多，并且需要更广泛的回归测试。此外，在较大的代码库中切换开发语言要困难得多。


    这是一项技术上的优势，但我认为它也是一项管理上的优势。经理们一直在寻找更快交付软件的新方法。提高开发者生产力的途径之一是可用工具集的技术进步。通过微服务架构，你利用新开发的工具集并带来业务所期望的生产力提升的能力，比传统的
    Web 部署更好。


    ## 扩展阅读


    如果你对微服务架构感兴趣，我可以向你推荐一些额外的资源。


    我对微服务的兴趣始于看到 Fred George 的这场演讲。我是偶然发现它的，但他所阐述的微服务架构的影响令我着迷。本质上，是他发起了这本书，尽管他可能对此并不知。具体来说，我被服务是“可弃的”这一观点所吸引。


    关于微服务架构是什么以及该范式定义的权威指南，是 Fowler 和 Lewis 编写的《Microservices》。你可能记得我将微服务定义为大多数微服务都具备的特征列表。我希望我能声称那是原创想法，但我做不到。Fowler/Lewis
    的文章是微服务特质列表的权威标准。我选择了最重要需要强调的特征。


    Fowler 在微服务架构的先决条件（此处）也做出了非常有价值的工作；即在大规模尝试微服务架构之前，你应该具备的能力。


    关于领导者级微服务的另一个想法是 Adrian Cockcroft。可以在这个视频中找到他的作品。我关注他的 Twitter Feed馈。


    我密切关注该领域的两个开源项目。第一个是 Netflix 产品套。他们必须支持惊人的吞吐量，并慷慨地开放了支持这些内容的源码。第二个是 Apache Mesos，它本质上让计算资源无处不在。也就是说，它允许你通用地查看计算资源，而不必担心资源托管在哪里。由于微服务架构产生了大量的部署产物，这对于减少部署管理问题非常有前景。


    感谢你花时间阅读这本书。如果你有意见或问题，请随时通过 derek.ashmore@dvtconsulting.com 或 LinkedIn 与我联系。我总是对反馈感兴趣。

