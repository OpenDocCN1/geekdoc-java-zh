    \ 3.2。开发者需要访问你微服务库的非生产环境实现进行开发，还需要任何所需的数据库和其他资源的非生产环境版本。\n\n图 3.2：微服务库的网络访问\n\n\
    ## 微服务安全\n![](img/fc4ff849e7f45c45b878bf5b4a675ecf_82_0.png)\n\n## 用户级安全\n\n##\
    \ 网络级和/或服务级安全\n为你的微服务库使用网络访问安全的优势有几点：它简单又全面。当你实现安全层时，对微服务本身或其打包完全没有影响；而且这可以在不逐个部署最细微服务的情况下进行增强和更改。网络访问安全在开发者端不需要规划；然而，某些服务需要额外的安全。\n\
    \n为需要额外安全的建立服务级帐户。这与通常保护数据的方式非常相似。终端用户凭据不用于数据库连接；建立服务帐户是为了可以使用连接池。大多数微服务使用 OAuth，因为它们通常提供\
    \ restful 接口。使用 OAuth 安全 restful Web 服务的方法并没有不同，书中不会直接讨论。\n\n不要直接为终端用户配置微服务访问。当\
    \ Web 应用依赖微服务库时，其终端用户安全性应该是相同的。终端用户凭据通常用于允许/限制用户访问应用程序的功能。但是，不要将终端用户凭据传递给你的服务库。那会增加巨大的复杂度，并且不会提供额外的好处。\n\
    \n## 合约测试程序和要求\n出于几个原因，定时和自动化的合约测试程序至关重要。本节将讨论这些问题。\n\n微服务的持续集成是必要的。微服务架构有助于提高开发吞吐量。这意味着更频繁的生产部署和更少的手动测试机会。这意味着微服务库的自动化合约测试是必不可少的。如果没有持续集成以及随之而来的自动化合约测试的保障，你将发现缺陷迁移到了生产环境。持续集成是防止向生产部署缺陷的主要保障。微服务内部代码的单元测试虽然有用，但作为微服务架构的保障并不有效。\n\
    \n持续集成补偿了开发者的近视。在开发者一次只处理一个服务并日益依赖服务调用的世界中，他们并不清楚如果部署了缺陷，从业务角度会破坏什么。你可能认为这是一个负面因素，但这是范式有意的一部分，旨在让开发者更专注、更高效。\n\
    \n持续集成允许单个微服务变得真正可丢弃。在一个服务趋于“可丢弃”的世界中——即可以很容易丢弃一个服务版本并完全重写它——新版本的服务需要与旧版本完全相同的功能。通过良好的自动\n\
