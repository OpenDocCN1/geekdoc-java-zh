    # # Microservice Architecture


    ![](img/fc4ff849e7f45c45b878bf5b4a675ecf_11_0.png)


    We''re going to see that each microservice has its own data store or database.
    This eliminates coupling at the database level and ensures that database structure
    changes don''t impact more than one service. We''re going to see that the autonomous
    nature of microservices allow technology choices.


    For an excellent article on the definition of microservices architecture, consult
    Microservices by Fowler and Lewis.


    # ## Contrast with traditional application architectures


    Let''s contrast this with traditional application architectures, such as what
    was discussed in the Java EE Architect''s Handbook. Traditional application architecture
    is like a layer cake, as illustrated in Figure 1.2. Typically it has layers to
    provide a user interface, data access, and business logic; and depending on its
    feature set, it might have other additional layers. Another way to express this
    idea is coupling is high.'
