    might mean calls to multiple services in your microservice library. Any data from
    those microservice calls are consolidated and returned to the caller. All the
    chatty microservice traffic is on your local network, and that can be properly
    tuned by your network engineers. That local network can also be properly scaled
    to provide service for the extra network traffic that microservices architecture
    requires.


