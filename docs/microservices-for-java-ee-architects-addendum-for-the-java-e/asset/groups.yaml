    \n## 服务安全\n安全是分层实现的。每一层都代表了攻击者的一个“障碍”。受保护资源越敏感，在其周围设置的安全层就越多；使得对受保护资源的未经授权访问变得更加困难。这是我们随处利用的基本安全概念。作为一个安全层的简单示例，组织使用防火墙在内部资源周围设置安全级别；你必须至少拥有防火墙的内部访问权限才能访问内部\
    \ Web 应用和资源。组织不会止于此；他们通常会使用访问组（例如 LDAP 组）添加另一层，以区分哪些用户可以访问哪些资源——你明白我的意思。每一层都为攻击者提供了障碍，使资源更难攻破。微服务安全也不例外，并且非常好地符合这一范式。\n\
    \n**限制对你生产环境微服务库的网络访问。** 第一道防线是网络。将你的整个服务器端网络架构（包括你的微服务库）放在防火墙后面，并限制可以访问它的虚拟机\
