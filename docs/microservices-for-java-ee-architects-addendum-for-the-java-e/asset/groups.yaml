    过程依赖其他服务来完成其工作。过程服务可能有数据库资源，但并非总是如此。


    ## 分区是一门艺术


    决定服务边界或确定服务的使命具有欺骗性的困难。此外，我无法提供一个一个的公式来确定服务的使命。如果你定义得太宽泛，将会得到几个单体而不是微服务。如果你让服务操作过于细粒，将会导致过度网络往返，性能受损。


    ## 微服务与领域驱动设计


    Evans 的领域驱动设计（DDD）概念在确定服务边界方面起着作用。DDD 将世界分为“领域（Domains）”和“子领域（Sub-domains）”。领域是知识的领域。它们始终用业务术语表示，并且是纯分析的构造。子领域是领域的任意划分，它们也都是用业务术语表示的。在子领域内部划分了边界上下文（bounded
