    application architectures.


    Process rely on other services to complete their work. The StudentClasses service
    in Figure 2.2 is one of these. Process services may have a database resource,
    but not always.


    # Partitioning Is an Art


    Deciding on a service boundary or determining microservice mission statements
    is deceptively difficult. Moreover, there is no objective formula I can give you
    for determining a services mission statement. If you have services too much or
    define their mission too broadly, you will end up with several monoliths instead
    of a microservice library. If you make service operations too fine-grained, you’ll
    get excessive network chattiness and performance will suffer.


    # Microservices and Domain Driven Design


    Evans’ Domain Driven Design (DDD) concept has a part to play in determining service
    boundaries. DDD divides the world into “Domains” and “Sub-domains.” Domains are
    a sphere of enterprise knowledge. They are always expressed in business terms
    and are a purely analytical construct. They represent an area of the enterprise
    that Sub-domains are arbitrary divisions of a domain and they too are all expressed
    in business terms. Sub-domains are also an analytical construct and don’t necessarily
    correspond one-to-one to deployed services. Within sub-domains, bounded contexts
    are drawn.


    A bounded context in DDD is an arbitrary boundary that resides in one and only
    sub-domain. Typically, a bounded context is a physical construct and very often
    has a service'
  - '[PAGE 32]


    deployment representation. Relationships between bounded contexts are explicitly
    defined. Usually, the intention is to reflect this context in code so that the
    code more closely resembles the way the enterprise actually works. Core microservices
    manage data for one and only one bounded context. They never span bounded contexts.


    Process services manage complex processes. processes These can involve one or
    more bounded contexts. In essence, process services can describe the relationships
    between bounded contexts. Relationships between bounded contexts are processes
    managed by separate services.


    # Service Mission Checks


    Given the awful nature of partitioning, it''s hard to provide an objective algorithm
    for determining the mission statement for a service. I can, however, provide detailed
    warning signs that may indicate that a service definition needs refinement.


    # Boundary Mission Sanity Check


    You should be able to express the business function of a service in one sentence
    business terms. If you can''t, it''s a red-flag that the service isn''t well defined.


    Examples of business functions:


    +   - The Student service is the system of record for Professor information

    - The Registration service registers students for classes

    - The Discipline service suspends students

    - The Student Payment service records student payments

    - The Transcript service produces official transcripts


    What''s common about all of these examples? They are all written in business terms.
    Besides the term inherent in the service titles, there isn''t a technical term
    in the lot.


    Let''s contrast this with examples of poorly defined services. Below are ''anti-pattern''
    examples that you should not follow, and I discuss what''s wrong with them.


    # Anti-Pattern Examples'
