    通常，整个代码库共享数据库资源。这意味着对数据库的更改可能会影响整个应用程序代码库。是的，我们试图像《Java EE 架构师手册》中讨论的那样，通过分离数据访问层来使应用程序免受这些更改的影响，但这种策略并非总是
    100% 有效。数据库的更改需要修改 Entity 类，并可能对其他层产生影响这种情况并不常见。


    ## 什么是单体架构？


    通常，代码库在变得不可维护之前，其规模和复杂性是有的。接近这一点的应用程序被称为单体架构（Monoliths）。


    单体应用的部署通常有很长的质量保证/测试周期。对于单体应用，由于功能集非常庞大，执行完整的回归测试需要大量时间。是的，自动化测试序列缩短了开发人员的工作流程，但用户
    QA 测试通常包含大量的手动操作部分。


    随着每一次更改，单体应用往往会遇到意想不到后果的问题。也就是说，你修复了一个问题，却因为该更改意外创建了新的 bug。从这个意义上说，在单体中修复 bug
    就像在“打地鼠”。是的，你的自动化单元测试和集成测试有助于缓解这种情况，但该测试用具并非 100% 有效。


    单体架构通常与其技术栈紧密结合。这意味着，在单体应用中升级或更换依赖项要困难得多。例如，如果单体应用使用 Hibernate ORM 产品进行数据访问，那么很难更换为其他
    ORM 产品（如 iBatis）。使用 MyBatis 不仅会导致应用程序代码内部不一致；而且对于一个实际上并不直接产生业务价值的东西来说，测试工作量将相当巨大。


    在单体应用中，新开发者的磨合时间要长得多，因为有太多东西要学。代码库通常非常大且相互关联。其庞大的规模无论涉及哪些技术库和框架，都为新开发者引入了学习曲线。


    作为这一点的推论，开发者无法轻易从一个应用程序迁移到另一个应用程序。这种学习曲线是每个单体应用特有的。单体架构的这一特点为资源分配和调整优先级以满足业务优先级的变化制造了管理限制。


    在单体架构上，**诊断内存和性能问题通常会更困难**，因为“捞草堆”（代码库的大小）通常要大得多。寻找内存泄漏可能是开发者经历过最令人沮丧且最耗时的活动之一。此外，工具通常不会直接揭示泄漏原因，因此涉及手动分析。在微服务架构中，至少可能成为祸首的代码库规模要小得多，从而能够更快地诊断内存泄漏并更快速地解决。


    **微服务的 QA 测试周期，由于它们具有单一的功能目的，要短得多且更易于管理。** 微服务通常足够聚焦，其技术栈的组件可以轻松升级或更换，而不会影响服务的消费者。由于代码库通常要小得多，诊断局于单个服务的内存问题和性能问题通常也更容易。


    ## 微服务库组织


    微服务库通常按业务能力进行组织。也就是说，它们根据对业务重要的主题进行组织。领域驱动设计（DDD）将这些主题称为**领域（domains）**。领域是一种分析性构件，本质上代表一个独立模型。如果需要，DDD
    进一步将领域拆分为**子领域（sub-domains）**，并结合**边界上下文（bounded contexts）**。子领域只是更详细、更具体的领域。边界上下文代表构成领域或子区域的物理构件。你可以将微服务视为边界上下文的一个示例。例如，一所学院或大学的领域划分可能如图
