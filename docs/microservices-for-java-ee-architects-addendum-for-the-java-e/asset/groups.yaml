    \ architecture; any standardized interface will do. Most use REST for microservices\
    \ architecture because its reliance on resources (a.k.a. nouns) naturally lends\
    \ itself to microservice boundaries.\n\n# Service Boundaries\n\nThe most important\
    \ design consideration for a microservice is defining its mission. That is, defining\
