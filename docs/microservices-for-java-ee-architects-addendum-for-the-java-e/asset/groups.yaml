    \ nouns, as that’s what most business facts are. The same mental discipline you\
    \ use to identify RESTful web service resources can be used to identify core services.\
    \ You can usually express a core service ‘mission’ as being the ‘service of record\
    \ for a __’. Fill in the blank on the noun. The format of the mission statement\
