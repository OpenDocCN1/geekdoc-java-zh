    network traffic can cause architects to be concerned regarding performance. After
    all, service calls are dreadfully expensive when compared to a local method call.
    Also, since architects may ‘assume’ that microservices architecture uses services
    that are fine-grained, this can also contribute to their concern. But this assumption
    is false. All that you learned from SOA about being coarse-grained still applies;
    but even with coarse-grained service calls, network traffic increases with microservices
    architecture. Fortunately there are design tactics we can use to mitigate the
    performance impact of increased service call traffic.


    # Coding Patterns for Performance


    There are several coding patterns that they help to mitigate the performance impact
    of service call traffic. I''ll take you through them.


    One of these patterns, dispatch via messaging, is also a failure design pattern
    discussed in a previous section and not will be described again here. It''s also
    a performance pattern that by working offline, it provides users with a perceived
    performance gain as the portion of work they see is shorter.


    # Back-ends to Front-ends (API Gateway)


    The back-ends to front-ends pattern improves performance by ensuring that microservice
    traffic is on your local network and not on the internet. This pattern uses gateway
    services that consolidate microservice calls for web applications / user interface
    products. The idea is that the browser portion of the application will make one
    or two calls to its application service provider. That provider will make the
    numerous microservice calls (either directly or indirectly) that are needed to
    accomplish the work requested by a user in the web application.


    I’m using the term ‘application service provider’ to describe that gateway service
    consolidates user interface calls and responses.


    Another name for this pattern is ‘API Gateway.’ However, I do not use that term
    as there is general confusion between the API Gateway pattern and API Gateway
    products, such as WSO2. API gateway products are about routing and governance
    and not about any kind of call consolidation activity. I''m talking exclusively
    about the pattern.


    Application service providers consolidate service calls. That is, a call to them'
