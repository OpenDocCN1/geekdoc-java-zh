    a consumer doesn''t specify a version at all, they get the most current version
    available. Similarly, the return data can default. If you separate the version
    specification into a separate header, then it''s easier for consumers to let the
    version default and specify the format or vice versa.


    Versioning by header does require some type of router that interrogates the header
    value and redirects requests to the appropriate version. I''m not aware of product
    support for header versioning, but it would be easy enough to generalize it and
