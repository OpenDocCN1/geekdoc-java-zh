    **Continuous integration prevents developer mistakes from proceeding to production.**
    From a management perspective, contract testing is your bulkhead against rogue
    developers. We''ve all had to manage developers that don''t seem to take direction
    and want to do their own thing, sometimes not for the good of the organization.
    Microservices architecture gives you an opportunity to put a container around
    rogue developers, particularly if you have rigorous contract testing in place.


    ## Consumer-based Contract Testing


    There''s a comparatively recent development with contract testing that''s worth
    considering. Most of us are used to writing contract tests for services we publish.
    In a world where services are more reliant on other services, some organizations
    are having consumers test the functionality of services they depend on. That is,
    you consume a service, and you contribute automated tests for features in that
    service that you rely on. That can''t deploy until it passes all of its consumer-provided
    tests as well as those provided by the service publisher.


    For process services – that is, those that rely on other services – you can argue
    that this is merely a semantic change. Contract tests for process services, by
    definition, test services they rely on. In this way, everyone implementing microservices
    will, in effect, be implementing consumer-based testing at some level. However,
    with most process service tests, there won''t be a direct correlation between
    that test failure and the effective failure of one of the services it relies on.
    That is, without some type of investigation, it won''t be obvious that a service
    contract change is the cause of a process service test failure.


    While this creates more work for service publishers, it adds safety. You could
    also look at it as optimizing support resources. Is it more efficient to react
    when a defect goes into production or is it easier to prevent it? Many organizations
    have come to the conclusion that it''s cheaper and easier to prevent it; hence
    consumer-based testing.


    Consumer-based testing guards against unannounced contract changes in the services
    you consume. If a service can''t proceed to production without passing all consumer-based
    contract tests, developers for that service will be much less likely to introduce
    contract-breaking changes. It will (properly) be put as a last resort for them.


    ## Tooling Support for Contract Testing


    Fortunately, as RESTful web services and SOA architectures have been around for
    a long time, the tooling needed to support contract testing for microservices
    is plentiful. Some products to consider are the following:


    - Apache HttpClient for RESTful web service contract testing

    - SoapUI for either Soap or RESTful web service contract testing

    - ActiveMQ for JMS or AQMP testing. They have an effective embedded broker that
    works for testing

    - Jenkins for automated and scheduled builds.


    ## Chapter 4: Microservice Usage Guidelines


    This chapter provides advice on when to use microservices architecture. Hint:
    it''s not all the time. When new paradigms arrive, they tend to be over-used.
    Microservice usage is no exception. This chapter will provide guidance on when
    microservices architecture can provide benefit, and it will attempt to separate
    the wheat from the chaff. That is, it will tell you where the marketing fluff
    is – hint: there is some!


    ## When to Use Microservices Architecture


    Microservices architecture isn''t appropriate for all applications. Any distributed
    application paradigm, such as microservices, is by definition more complex and
    takes more resources to maintain. This section will detail when microservices
    architecture should be considered.


    **Evolve into a microservices architecture.** As a general rule, applications
    should be initially created as traditional applications and evolve into hybrid
    or microservices architecture as their complexity grows. Traditional web applications
    are easier to initially build and support. YAGNI (You Aren''t Going to Need It)
    applies. Many applications won''t grow to complex enough to warrant microservices
    architecture. Don''t go to the trouble and expense before it''s warranted.


    **Microservices architecture isn''t all or nothing.** It''s possible for a traditional
    application to rely on a handful of microservices; it''s not necessary for the
    entire application to evolve into a microservices architecture. In fact, as a
    traditional web application evolves into a microservices architecture, the transition
    involves deployments where a traditional web application relies on a small microservice
    library for some portion of the work that it does.


    **Initial attempts developing microservices should be small and targeted.** As
    with most paradigms, a measured migration to microservices architecture is warranted.
    You need the experience utilizing microservices, along with DevOps procedures
    to support a greatly increased number of deployables, before you will be effective
    at maintaining a large microservices library. Good initial proof of concept microservices
    should be important enough to be noticed, but contained enough so that business
    risk can be managed.


    **Multiple applications need the same functionality.** With traditional web applications,
    you can share a common library of some sort, or publish services in one application
    that are consumed by another. This becomes complex when external resources, such
    as database resources, are needed by this shared functionality. This shared functionality
    is a prime candidate for separation into a separate, independent deployable with
    its own database.


    **Parts of an application have different scaling requirements.** Separating microservices
    allows functionality to scale differently. For example, one microservice might
    only need three nodes in a cluster while another might need dozens due to its
    larger transaction volume.


    **Parts of an application may have higher availability requirements.** Separating
    out functionality into microservices not only allows increased throughput but
    makes the service less likely to be completely down. In other words, the increased
    scale also lessen the chance that all nodes of a service cluster would be down,
    making the service unavailable.


    Warning signs that your traditional application is too large:

    Given that most applications *evolved* into using microservices architectures
    and didn''t start there, how do you know your application(s) has reached a point
    where microservices architecture should be considered? There''s no objective rule,
    but I can provide some guidelines.


    **Changes come with unintended consequences.** When applications get large and
    complex, it becomes harder to make isolated and targeted without unintended consequences.
    With these applications, when you fix one problem, other problems appear. It''s
    like playing whack-a-mole game where you hit one only to see another appear.


    **Release testing / QA cycles become unreasonably large.** This is a sign that
    an application has become too complex to manage as a unit. In these cases, breaking
    the large problem into more manageable problems can reduce support costs. Microservices
    architecture can be useful in situations like this.


    **Development teams for a single application become too large to manage effectively.**
    I go with the Jeff Bezos quote: ‘If you can’t feed the team on two large pizzas,
    then the team is too large.’ Microservices architecture can make it easier to
    manage large development efforts as work units are broken into independent, more
    manageable teams.


