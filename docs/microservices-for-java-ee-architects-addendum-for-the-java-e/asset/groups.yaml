    > 注意：微服务的开发可以更容易地外包！


    这意味着你能够更好地不受不听话的开发者（rogue developers）的影响。我们曾管理过产生不可维护代码的开发者；但通过微服务，这些不听话的开发者被限制在一个微小且集中的代码库中，因此他们能造成的破坏是有限的。此外，如果该代码库很小、专注且定义明确，那么在需要时它更具可替代性。你不会让不听话的开发者在
    50 万行的单体应用中大作魔为，造成更大范围的混乱。


    ## 微服务提供了更好的可用性和恢复能力（如果实现得当）


    微服务之间的依赖关系迫使开发者在构建时考虑容错能力，并在设计和开发中将故障视为“一等公民”。根据定义，故障和停机局限于可识别的组件。我们将学习到，水平扩展单个服务的能力可以让你缩短停机时间。


    ## 使用微服务架构的缺点


    如果设计不当，微服务可能更难管理。我们将看到企业架构和合约管理至关重要。如果没有这些，采用微服务的优势将会大幅削弱。我们将看到，采用 DevOps 文化是大规模实施微服务的前提。通常情况下，采用微服务的组织也采用了持续交付。底线是：实施微服务对于管理层以及开发者和架构师来说，都是的一场范式转移。


    微服务的实现更加复杂。是的，每个独立的微服务由于规模较小且专注，对开发者来说更容易处理。然而，在微服务世界中，涉及的部件多得多。这使得交付可能涉及多个微服务的业务功能在设计和管理变得更加困难。此外，这种复杂性使得缺陷更难诊断，性能问题更难调查。


    如果合约设计不当，微服务的实现将导致完全的混乱。我将在书后的部分介绍关于设计微服务合约的一些建议。如果合约设计得糟糕，开发者将花费更多时间在消费服务和支持活动上。这些时间会侵蚀你的开发速度，并对最初采用微服务的优势产生负面影响。从管理的角度来看，请考虑专门的合约管理人员。某些架构师比其他人更擅长此道。


    值得注意的是，迁移到微服务架构要求你的组织具备 DevOps 能力等。我在第五章标题为“采用微服务架构的前提”的节中提供了这些前提的概述。


    ## 微服务架构与 SOA 的对比


    许多人问：“微服务架构不单是换了包装的 SOA 吗？”答案在很大程度上是“是”的。请记住，SOA 遭受着与微服务相同的定义疾病——在 SOA 中，并没有一个具体的定义。SOA
    对不同的人有不同的含义。


    它们在许多方面都是相似的，除了队列/管道的复杂性。SOA 在在队列中移动数据时，通常有非常复杂的管道系统（plumbing）。通常使用 Mule 或 Camel
    工作流来转换、复制或重新排序传输中的数据，并适应数据在不同服务之间移动时产生的任何格式差异。


    在微服务世界中，进程服务（我们将学到它们是依赖其他服务运行的复杂服务）有效地协调复杂业务功能的交付。编排的角色被委托给了进程服务，而不是 Mule 或 Camel
    工作流。


    微服务架构使用“愚蠢管道”和“智能端点”。微服务使用队列，但没有你可能在面向服务的架构（SOA）世界中发现的任何转换。通常情况下，没有复杂的流（例如 Mule
    或 Camel）对从服务到服务传输的消息数据进行格式化、过滤或排序更改。以你音响系统的电源供应作为此类管道的例子。电力要么开启，要么关闭，中间没有其他状态。一个“管道”不会再更简单了，管道本身绝对没有任何智能性。


    ## 重构为微服务架构


    通常，应用开始时并不是微服务架构的。通常情况下，应用是单体应用，随着规模变大，被重构为微服务架构。


    它们在许多方面都是相似的，除了队列/管道的复杂性。SOA 在在队列中移动数据时，通常有非常复杂的管道系统。通常使用 Mule 或 Camel 工作流来转换、复制或重新排序传输中的数据，并适应数据在不同服务之间移动时产生的任何格式差异。


