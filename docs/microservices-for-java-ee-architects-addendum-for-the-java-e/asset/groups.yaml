    | Operations | 学生不能同时被安排到其他课程；学生和时间表分配必须有效，会导致错误，不支持部分更新 |

    | PATCH | 删除分隔符界定的属性列表；所有支持的过滤器操作指令均可更新；限制返回的项目最大数量 |


