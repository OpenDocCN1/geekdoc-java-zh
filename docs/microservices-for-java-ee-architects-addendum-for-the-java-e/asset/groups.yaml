    ![](img/fc4ff849e7f45c45b878bf5b4a675ecf_46_0.png)


    Yes, this means that the consolidating call will likely return a larger amount
    of data. Let''s work that a bit. The cost of the network portion of a service
    call can be thought of in two parts: the cost of establishing a connection with
    the service host, and then the data transfer of the request/response. By consolidating
    service calls, back-ends for front-ends drastically reduces the connection establishment
    portion of the traffic.


    Transfer cost might also be reduced in that the gateway service sorts through
    all microservice output and streamlines the result to include only what specific
    web application needs to function. For example, it is not unusual for core services
    to provide information about a business topic that the caller doesn''t need. ‘extra’
    information is weeded out by the application gateway manager and not sent to the
    browser. In this way, the data transfer portion of the cost is optimized.


    **Do not expose microservice traffic directly to the browser.** This is a bad
    idea and anti-pattern. Use the back-ends to front-ends pattern instead of directly
    exposing your microservice library to the browser. You don''t control the network
    between the browser and your service library for external sites. Users will get
    varying performance experiences depending on how they are connected to the internet.
    You''llt be in any position to really help them. For this reason and this alone,
    all browser service calls should be consolidated.


