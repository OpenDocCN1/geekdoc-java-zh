    headache; there is additional coding and testing in performing the copy, and that
    copy can have issues. All too often, defects arise because the copies of the same
    data aren''t in sync. I elect to avoid the problem altogether by having only one
    source for each item of information and making extra calls to get it when needed.


    If you opt for a copy strategy, I''d recommend publish/subscribe. That is, the
    service that ''owns'' the business data publishes the fact that a piece of information
    changes on a persistent queue. Any service interested in those changes subscribes
    to that queue and records the necessary events in its own database.


    In corporate America, we''ve really been into recording a fact once and only once.
    Consequently, it''s not uncommon to find sites that have multiple applications,
    sometimes dozens, maintaining the same database data. For those organizations,
    refactoring to the point where each microservice has its own database is a tall
    order. There is a compromise available.


    If you can''t give each microservice its own database, at least refactor to the
    point that one and only one service updates, inserts, deletes each data item.
    That reduces the haystack you need to look through to solve data corruption bugs.


    **You do not need separate physical database servers/licenses for each microservice.**
    The goal is to remove coupling at the database level. Using separate database
    schemas is enough to achieve this level of decoupling. Of course, it''s important
    not to create any referential integrity rules (e.g., foreign key constraints)
    between tables used by two different microservices as this is unwanted coupling.'
