    # Managing Service Versions


    Managing versions of services is hard enough with traditional web applications.
    In a microservice world, the problem exponentiates as the number of services exponentiates.
    There are two popular versioning strategies in use. The first literally places
    a version in the URL for the service. The second allows the client to request
    a service version in the header. Should they not request a version, they default
    to the most current version. I will go through both versioning methods. But first,
    let''s discuss different types of changes and your civic duty as a producer or
    consumer of a service.


    # Breaking vs. non-breaking changes


    **A breaking change is one that causes existing service calls to error out.**
    Breaking changes forces consumers to change code to avoid errors. Yes, you can
    mitigate the effect of this by adopting a deprecation strategy (which I will discuss
    later), but still, you force change. By definition, forced change is going to
    get prioritized above most other tasks for the consuming application team and
    will likely usurp other feature enhancements that are supported on work. From
    the consuming team''s perspective, that change comes out of the blue and isn''t
    as easily manageable as scheduling feature enhancements.


    Not all changes are breaking changes. If a service call requesting information
    about a topic suddenly returns a few additional items of information, this should
    be a non-breaking change. It''s non-breaking because consumers shouldn''t pay
    any attention to the additional information provided since they don''t have the
    logic to process it. Should they make a decision to process those additional information
    items, they can enhance their service on their own schedule. In fact, they might
    not need the additional items of information to enhance their service at all.


    **As a service publisher, your civic duty is to introduce a breaking change only
    as a last resort.** Only introduce breaking changes if absolutely nothing else
    is possible. This can happen despite despite the best of intentions. It could
    be that a dependent service introduced a breaking change, thus forcing a reaction.
    It could be that a feature was can no longer be supported because the required
    functionality from dependent services is no longer there. It could be that'
  - '[PAGE 53]


    the organization has decided to deprecate a business process, and as a result,
    you need to introduce a breaking change to accommodate that business decision.
    Note that this probably isn''t a complete list of what could force a breaking
    change.


    **As a consumer, your civic duty is to ignore any piece of information returned
    in a service call that you don''t need.** The reason is that this makes your consuming
    service more resilient and less impacted by changes in services you call. You
    won''t be affected by additions to your result set or the removal of attributes
    you don''t really need. This decreases the chance that changes to the services
    you call will affect the consuming service.


    **As a service provider, you need to establish a deprecation strategy.** That
    is, you can''t just introduce a breaking change and make consumers scramble to
    adjust. For a period of time, you need to support the old *and* the new service.
    You also need a communication mechanism that allows you to announce version changes
    and also to announce the point where support for specific versions will no longer
    be provided.


    **Versioning is *only* needed for breaking changes.** Non-breaking changes can
    be published under the same version; providers shouldn''t have to maintain separate
    versions if changes are non-breaking. This incentives consumers to ignore returned
    data they don''t use as it minimizes the impact of change their experience as
    the services they call are enhanced.


    That leaves several questions. If clients, in effect, manage their own migration
    schedule from *version a* to version *b* of a service, there needs to be a way
    for clients to specify which version of the service they would like. On the provider
    side, architects need a sensible strategy for supporting both versions of a service
    for a period of time. I say ‘both’ because ideally, at any time, you should have
    one version in deprecation and one current version.


    # Versioning by URL


    One popular way to version is to version by URL. That is, encode the version number
    somewhere in the URL and make consumers change their request URL when they move
    from *version a* to version *b*. Examples of URL versioning can be found in Listing
    2.6.


    Listing 2.6: URL Versioning Examples'
