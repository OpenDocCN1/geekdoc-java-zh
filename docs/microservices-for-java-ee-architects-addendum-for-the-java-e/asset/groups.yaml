- md: "\nIf you use a logging abstraction like Slf4j, providing a default logging\
    \ configuration is as easy as including a logback.xml file in the Spring Boot\
    \ jar. Spring Boot will already list Logback as a dependency as it's the default\
    \ logging API used. As the logging configuration is really default at this level,\
    \ I send all output to the console. I don't want to make any file or disk assumptions\
    \ about where this might run. These decisions are logically made at deployment\
    \ time.\n\nSpring Boot has a way to configure database connection pools using\
    \ the application.properties file. The reference has a complete list, but I've\
    \ included a sample in listing 3.5.\n\n# Listing 3.5: Spring Boot Connection Pool\
    \ application.properties\n\n```properties\n# Connection pool definition\nspring.datasource.driver-class=org.hsqdb.jdbc.JDBCDriver\n\
    spring.datasource.name=testdb\nspring.datasource.url=jdbc:hsqdb:mem:my-sample\n\
    spring.datasource.username=SA\nspring.datasource.password=\nspring.datasource.continue-on-error=true\n\
    # Pooling properties\nspring.datasource.max-active=5\nspring.datasource.min-idle=1\n\
    spring.datasource.test-on-borrow=true\nspring.datasource.test-on-return=false\n\
    spring.datasource.test-while-idle=false\nspring.datasource.time-between-eviction-runs-millis=1\n\
    spring.datasource.validation-query=SELECT CURRENT_DATE AS today, CURRENT_TIME\
    \ AS now FROM (VALUES(null))\n```\n\nIn high-volume deployments, it's often necessary\
    \ to configure lower level container settings, minimum, maximum, and idle timeout\
    \ settings for container worker threads. There are other settings that I want\
    \ to be concerned with in high-volume deployments, but here I want to illustrate\
    \ how you might do that using Spring Boot. This can be accomplished by overriding\
    \ the servletContainer method in the application class. An example of how to do\
    \ this can be found in my sample and in listing 3.6.\n\n# Listing 3.6: Spring\
    \ Boot Container Configuration example\n\n```java\n@Bean\npublic EmbeddedServletContainerFactory\
    \ servletContainer() { // JettyEmbeddedServletContainerFactory\n    JettyEmbeddedServletContainerFactory\
    \ factory = new JettyEmbeddedServletContainerFactory();\n    factory.addUserCustomizers(new\
    \ JettyServerCustomizer() {\n        public void customize(final Server server)\
    \ {\n            // Tweak the connection pool by Jetty to handle incoming\n  \
    \          // HTTP connections\n            Integer localMaxThreads = deriveValue(serverMaxThreads,\n\
    \                DEFAULT_SERVER_MAX_THREADS);\n            Integer localMinThreads\
    \ = deriveValue(serverMinThreads,\n                DEFAULT_SERVER_MIN_THREADS);\n\
    \            Integer localIdleTimeout = deriveValue(serverIdleTimeout,\n     \
    \           DEFAULT_SERVER_IDLE_TIMEOUT);\n\n            logger.info(\"Container\
    \ Max Threads: {}\", localMaxThreads);\n            logger.info(\"Container Min\
    \ Threads: {}\", localMinThreads);\n            logger.info(\"Container Idle Timeout:\
    \ {}\", localIdleTimeout);\n            final QueuedThreadPool threadPool = server.getBean(QueuedThreadPool.class);\n\
    \            threadPool.setMaxThreads(Integer.valueOf(localMaxThreads));\n   \
    \         threadPool.setMinThreads(Integer.valueOf(localMinThreads));\n      \
    \      threadPool.setIdleTimeout(Integer.valueOf(localIdleTimeout));\n       \
    \ }\n    });\n    return factory;\n}\n```\n\nSource: org.moneta.config.spring.MonetaSpringBootApplication\
    \ from Moneta (https://github.com/Direk-Ashmore/moneta)\n\nSpring Boot has an\
    \ add-on Actuator for health checks, performance metrics, and diagnostics. If\
    \ you're using Spring Boot, you should use Actuator. Note that if your application\
    \ has custom health checks, it's relatively easy to write an adapter that these\
    \ custom health checks will work with Actuator. All that's required is to implement\
    \ the HealthIndicator interface, which requires one method. You can find an example\
    \ here.\n\n# Dropwizard\n\nDropwizard packages Java web applications into a single\
    \ executable jar file that can be executed via a single command:\n\n`java -jar\
    \ MyApp.jar server MyAppConfig.yaml`\n\nThat deployable jar contains an embedded\
    \ Jetty container and contains every dependency class needed to run your application.\
    \ Note that Dropwizard also requires additional arguments. The server argument\
    \ specifies that the application is to be run as an HTTP server. The yaml file\
    \ input is your configuration. While not strictly required, it's where container\
    \ configuration items are listed.\n\nLike Spring Boot, Dropwizard requires an\
    \ application configuration class with a main() that loads an application configuration,\
    \ installs health checks, and activates performance metrics collection and JMX.\
    \ You can find an example Dropwizard application class here.\n\nThe application\
    \ class also defines any servlets or filters needed by the application. In this\
    \ world, servlets and filters are not defined in the web.xml configuration file.\
    \ An example servlet configuration can be found in listing 3.7. An example filter\
    \ configuration can be found in listing 3.8.\n\n# Listing 3.7: Dropwizard Servlet\
    \ Configuration example\n\n```java\nServletHolder topicHolder = new ServletHolder(Source.EMBEDDED);\n\
    topicHolder.setHeldClass(MonetaServlet.class);\ntopicHolder.setInitOrder(0);\n\
    topicHolder.setInitParameter(\n    MonetaServlet.CONFIG_IGNORED_CONTEXT_PATH_NODES,\
    \ \"moneta,topic\";\n    environment.getApplicationContext())\n.getServletHandler()\n\
    .addServletWithMapping(topicHolder, \"/moneta/topic/*\");\n```\nSource: org.moneta.config.dropwizard.MonetaDropwizardApplication\
    \ from Moneta (https://github.com/Derek-Ashmore/moneta)\n\n# Listing 3.8: Dropwizard\
    \ Filter Configuration example\n\n```java\nFilterHolder perfFilterHolder = new\
    \ FilterHolder(Holder.Source.EMBEDDED);\nperfFilterHolder.setHeldClass(MonetaPerformanceFilter.class);\n\
    perfFilterHolder.setInitParameter(\n    MonetaPerformanceFilter.PARM_MAX_TRANSACTION_TIME_THRESHOLD_IN_MILLIS,\n\
    \    \"3000\",\n    environment.getApplicationContext())\n.addFilter(perfFilterHolder,\
    \ \"/moneta/*\", null);\n```\nSource: org.moneta.config.dropwizard.MonetaDropwizardApplication\
    \ from Moneta (https://github.com/Derek-Ashmore/moneta)\n\nLike Spring Boot, Dropwizard\
    \ uses Logback logging by default. At this level, logging configuration is likely\
    \ for developer convenience. When the service is deployed, a production logging\
    \ configuration will likely override what is placed in the spring boot deployable.\
    \ Look at the logging configuration at this level as ‘default,’ nothing more.\n\
    \nLogging configuration for Dropwizard is configured in the yaml file you supply\
    \ when the container starts (example here). I prefer to supply a default configuration,\
    \ including logging, for developer convenience. Dropwizard, by default, accepts\
    \ only a file reference for configuration with no option to load it from the classpath.\
    \ Frankly, that is easy to change. The application configuration is controlled\
    \ by a class that implements the ConfigurationSourceProvider interface. I have\
    \ developed an enhancement that will look for the configuration on the classpath\
    \ as well as (here). You must also add the new configuration provider to the application\
    \ bootstrap in the application class. To accomplish this, you just need to override\
    \ the application initialization process. An example can be found in listing 3.9.\n\
    \n# Listing 3.9: Example for Enhancing Application Configuration Override\n\n\
    ```java\n@Override\npublic void initialize(Bootstrap<MonetaDropwizardConfiguration>\
    \ bootstrap) {\n  bootstrap.setConfigurationSourceProvider(new MonetaConfigurationSourceProvider());\n\
    \  super.initialize(bootstrap);\n}\n```\nSource: Class org.moneta.config.dropwizard.MonetaDropwizardApplication\
    \ from Moneta (https://github.com/Derek-Ashmore/moneta)\n\nDatabase connection\
    \ pooling can be configured with Dropwizard. I wish the documentation for it were\
    \ more centrally located, however. All options are in the database category and\
    \ described in the product's javadoc documentation here. All the features we commonly\
    \ use, such as configuring maximum and minimum pool size, validation behavior,\
    \ and idle timeout behavior, are here. An example of this section of the configuration\
    \ can be found in listing 3.10.\n\n# Listing 3.10: Example Dropwizard Connection\
    \ Pool Settings\n\n```yaml\n# Connection Pool settings\ndatabase:\n  driverClass:\
    \ org.h2.jdbc.Driver\n  url: jdbc:h2:mem:my-sample\n  user: SA\n  password:\n\
    \  autoCommentsEnabled: false\n\n  # Sizing options\n  initialSize: 1\n  minSize:\
    \ 1\n  maxSize: 10\n  maxWaitForConnection: 30 seconds\n```\n"
