    - 1. The Customer Relationship Management (CRM) service maintains people who will
    be marketed to. These people include high school students, students attending
    other colleges, and parents of these student types.

    - 2. The Donation service updates the donation database with people who have been,
    or solicited, for donations, as well as donations received. This includes alumni,
    parents of alumni, corporate benefactors and anyone else who might be solicited.


    **Mission statements should not contain technical terms.** Use of the CRM in the
    first example refers to a specific class of software product. It is a technical
    term and should not be part of a microservice mission statement. The second example
    refers to a ‘database’, which really micromanages how information is to be stored.
    Technical implementation details for microservices should be hidden. Storage mechanisms
    and specific product features should be private and subject to change without
    notice to service consumers.


    **Microservices should not attempt to maintain information for multiple business
    concepts.** The Donation service (second anti-pattern example) does too much inside
    one service. Microservices are meant to do one job and do it. This service tracks
    candidates who may be solicited for donations and *also* the amounts given. I
    would separate the business of tracking solicitation prospects from the business
    of recording solicitation events and donations received. Services to handle donations
    and record interactions to elicit donations may well use the service that tracks
    solicitation prospects in some way.


    It’s worth noting that while microservices have one *purpose*, they can be used
    in multiple business *contexts*. For example, the Donation service we’re discussing
    might be used by a service to identify marketing targets or by a service implementing
    marketing campaigns of different types. In other words, having a single business
    purpose doesn’t keep the service from having multiple consumers.


    I would rewrite the “CRM service” mission statement as follows:


    - The Marketing Prospect service is the system of record for information about
    people who will be marketed to.


    In addition to being more than one sentence, the CRM service mission statement
    contains the term ''CRM,'' which is a technical term. CRM applications not only
    track customers and customer representatives for marketing campaigns, but are
    also used to manage sales force effectiveness and marketing campaigns of different
    types. It is not necessary to wrap all CRM functions with technology agnostic
    microservices. It is not unusual to use a portion of the features offered by a
    software product. Only portions of CRM functionality that will need to be utilized
    by other services and applications need to be created. The mission statement concerns
    with the portion of CRM functionality that manages marketing campaign prospects
    – a ''prospect'' being a potential customer or customer representative that will
    potentially be the subject of some type of marketing campaign or customer interaction.


    I would rewrite the ''Donation service'' mission statement and separate it into
    multiple services:


    - The Donation prospect service is the system of record for people who may potentially
    be solicited for donations.

    - The Solicitation service tracks attempts to solicit donations from donation
    prospects.

    - The Donation Receipt service tracks pledges from donation prospects as well
    as actual donation receipts.


    In addition to being more than one sentence, the reference to ''the donation database,''
    is a technical construct and not a business term. In addition, the ''Donation
    service'' is in danger of doing too much. Microservices do one job and do it well.
    This service tracks candidates who may be solicited for donations and also the
    amounts given. I would separate the business of tracking solicitation prospects
    from the business of recording solicitation events and donations received. Services
    to handle donations and record interactions to elicit donations could use the
    service that tracks solicitation prospects in some way.


    # Context Independence Check


    When other teams show up and want to call your service, are you nervous? You start
    asking questions like:


    - What are you calling before us and after us?

    - Why are you calling us?

    - Exactly what business process are we going to be a part of, and what do you
    expect us to do?


    These are all red-flags that your service isn’t truly context independent. It
    makes assumptions about the business conditions under which it''s being called.
    A well-defined service should be agnostic as to when/how it''s called. If it has
    inputs and resources, and the inputs are valid, it does its job; that’s it. The
    reaction you should have when other teams show up and want to call your service
    should be: “Here’s the doc. Please let us know if you have any questions. Bye....


    More detailed questions to ask among these lines:


    - Does your service have multiple consumers? Could it without ill effects?

    - Does your service care if it''s executed in batch instead of indirectly initiated
    by a user web application?

    - Do you spend time analyzing the flow between services?


    # Designing to accommodate failure


    With traditional architectures, most calls are local. If the application is up
    to make the call, resources are generally available. With microservices, it''s
    common for services to rely on other services. We need to design for the possibility
    that a dependent service is down.


    Designing for failure happens in layers. The first line of defense against your
    service is horizontal scaling/clustering. That is, running several copies of your
    service on different virtual machines, thus increasing the probability that at
    least one copy of a service is available. The likelihood that the entire cluster
    is down is less if there are multiple copies of that. We do this with traditional
    applications as well.


    There are legitimate reasons for a cluster to be down. It might be down for maintenance,
    or a resource it depends on may be down in its entirety. Bottom line: horizontal
    scaling isn''t enough of a defense against outages in a microservices world.


    Fail sooner than later. Have you ever surfed to an unavailable site? Typically,
    after 60 or 90 seconds, your browser tells you that the service isn''t available.
    The same thing happens with web service calls, such as those that microservices
    make.

