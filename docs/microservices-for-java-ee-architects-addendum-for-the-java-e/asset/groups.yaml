    We can’t leave the database out of the refactoring altogether. Having multiple
    services use the same database/schema is in fact ‘coupling,’ which a microservices
    architecture tries to avoid. It’s not coupling in the sense we usually think of
    it (that is, code coupling). However, any data structure change after a first-stage
    refactoring will affect multiple services. For this reason, microservices architecture
    really incents you to separate databases.


    Each microservice ‘owns’ its own database. Look at it in the same way that you
    look at instance-level fields in a Java class. An illustration of our higher education
    example with each service having its own database can be found in Figure 1.5


