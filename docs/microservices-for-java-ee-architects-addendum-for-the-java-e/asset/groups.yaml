    \ confines ourselves to merely maintaining student personal information. This\
    \ service example is visually depicted in Figure 2.1.\n\n# Figure 2.1: Core Service\
    \ Definition Example\n\n![](img/fc4ff849e7f45c45b878bf5b4a675ecf_26_0.png)\n\n\
    The service name, Students, is in the center. To the left, there is a one-sentence\
    \ description of the service in business terms. All operations are detailed in\
    \ terms of the HTTP methods that support them (e.g., PUT, POST, GET, etc.). All\
