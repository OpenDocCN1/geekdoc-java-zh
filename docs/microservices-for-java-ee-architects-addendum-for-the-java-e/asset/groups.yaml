    许多用户确实选择进行集成，以便他们能够在短时间内指数级地增加他们所支持的虚拟机数量。


    ## 对数据库管理人员的需求将会增加。

    大多数人考虑到的是运维人员的额外需求。微服务架构也增加了数据库的数量以及可部署单元的数量，对新模式（schema)/数据库创建和增强的需求也会随之增加。这意味着对数据库管理员的需求也会随之增加。有些组织将数据库管理工作迁移到微服务团队内部，但无论如何组织，工作并不会消失。虽然并不经常讨论，但数据库管理员也需要采用
    DevOps 文化，并将其工作的大部分实现自动化。


    ## 服务契约管理


    关于微服务团队如何获取其功能增强任务，目前还没有很多相关的论。微服务的本质提供了用户请求的能力的核心部分，但并非以那些用户可能理解的语境呈现出来。用户更有可能向提供
    Web 应用程序或用户界面的团队提出功能请求。当团队意识到他们没有能力交付该功能请求时，该团队需要将请求中的非 GUI 部分交给一个或多个微服务团队来实现。例如，假设一个
    UI 团队接收到了存储某特定课程教授大纲的请求，而目前没有能够记录该信息的可用服务。有人需要引导该请求，弄清楚它属于哪个服务，确保该功能请求包含足够的可操作信息，并对其进行适当路由。这里有一系列工作需要以某种方式完成并妥善处理。大多数组织利用某种任务管理软件（例如
    Jira）来管理和跟踪此类功能请求。


    **管理是至关重要的。** 你可以让开发者作为一种自发努力来设计和发布服务契约。在其他情况下，让他们随心所欲而你不予关注。起初，这是最容易的管理方法。然而，随着部署服务数量的增加，开发者将无法“见树木而不见森林”。你会遇到大量的重复工作，并且在创建和部署的服务中遇到大量的不一致性。最终，这些缺陷将随着服务列表的增加而增长，并侵蚀你从微服务架构中获得的某些收益。


    我永远不会建议你在部署和使用之前，强制通过一个正式流程来审查并批准所有服务契约。那会阻碍开发速度，而这是微服务架构的预期收益之一。然而，应该有人跟在开发团队后面，以所有人（包括管理层）都能使用的标准格式对发布的服务进行分类。这样他们就可以记录服务的不一致之处，向服务团队发送更改建议，并帮助开发者采用现有服务——而不是发明现有服务的新版本。他们还可以向管理层指出潜在的风险区域（如果有的话）。


    ## 管理契约变更将是至关重要的。在微服务世界中，契约的质量将极大影响你从采用微服务架构中获得的收益。定义不当的契约会导致混乱和无序，并对新功能的开发速度产生负面影响。有些组织谨慎地限制任何时间点的更改量，以保持高质量并防止对开发速度产生负面影响。


    ## 功能增强任务对于微服务团队成员来说必须是不模糊且清晰的。请记住，更高的开发速度来自于开发者的专注能力，并且免于通信开销。给他们不明确的功能分配意味着他们将需要去请求功能的用户那里获取清晰度。需要建立一套用于梳理和跟踪功能增强的流程。


    ## 服务测试与部署自动化


    对自动化测试的投资是至关重要的。随着开发速度的提高，生产环境部署率也会呈指数级增长。如果没有测试自动化，缺陷将迅速给你的生产环境带来灾难。自动化契约测试对于减轻这些影响至关重要，在这个世界里，通常没有时间进行手动测试。这种自动化不是免费的；它需要投入人力进行设置，以及后期的维护和管理。它还需要强制。


    自动化部署是至关重要的。随着开发速度的增加，每次部署都进行人工干预不再像以前那样可行了。有一种论点认为部署中的手动步骤实际上增加了风险，因为它们增加了错误的概率。是的，这个说法假设了一个编写良好、测试充分的部署过程，这种过程通常没有失败记录。不而喻之，只有通过测试套件的产品才被允许进入生产环境。


    **数据库更改也应该是自动化。** 数据库更改通常伴随着新服务的部署。如今，这些更改也可以是自动化的。像 FlywayDb 这样的产品非常适合此类更改。是的，回滚或失败的部署仍然需要一定的人为干预，但希望失败的部署只占总数的一小部分。


    **考虑提供一种基于消费者的测试流程。** 基于消费者的测试需要是自动化的，并作为针对服务运行的测试套件的一部分。你可以将其视为一种测试添加，必须通过（显示绿色）才能进行生产部署。唯一的区别是这些测试是由团队提供并维护的。我会将其视为消费其他服务的服务团队的一种“选项”，而不是要求。在过去，我曾不得不依赖被证明不可靠的服务，导致测试失败。对于不可靠的服务，在*开始时*就知道依赖的服务已崩溃且你得到的测试失败是意之中的将是非常好的。这节省了调查时间。


    ## 团队管理


    **管理团队的契约交付物，而不是团队本身的内部管理。** 微服务架构的好处之一是消除了通信开销。通过交付物管理而不是微观管理团队有助于消除开销。只要你以可接受的速率和质量获得功能增强，团队选择组织方式可以留给他们。


    **开发者一次只处理一个服务。** 这有助于防止对在特定顺序或语境下使用服务的业务流程做出假设。我这么说，是因为你不会有一个开发者同时处理一个服务及其调用的服务。这有助于保持专注而不受干扰，并保持他们的高速度。在这个世界里，任何拖慢开发速度的东西都会牺牲你从微服务架构中获得的收益。


    **发布服务的开发者应该被要求支持它。** 这激励了明智的产品决策以及编写可维护的高质量代码。换句话说，开发者要“自食狗粮”（自用自己的产品）。大多数开发者都想要良好的家庭生活，这种范式支持了这一点。只要他们产生高质量且低缺陷的服务，他们花在支持上的时间就会降到最低。


    ## 服务健康监控


    对缺陷的自动响应是至关重要的。随着开发速度的提高，生产部署率呈指数级增长。健康监控对于快速发现故障和缺陷至关重要。我的一些客户使用 Splunk 或 Logstash
    在生产环境中遇到错误时自动在工系统中创建缺陷工单。决定在遇到错误时通知哪个服务团队需要一些思考和规划。例如，一个因错误输入出错的服务应该属于调用团队，而不是生产服务的团队。显然，任何类型的非计划异常都应该生产服务的团队。


