    services should be as easily usable in a user interface in a batch process. All
    services and service calls should be stateless. For instance, there should be
    no context (e.g., session variable content) that travels from call to call. If
    the service uses a database, all service calls are complete units of work. No
    open transactions are left when a service call completes.


    ## Are Microservices easier for developers to understand?


    One of the selling points for microservices architecture is that it makes problems
    small enough to fit into the developers’ heads, but in reality, the answer is
    ‘no’. It is easier for a developer to understand one particular service in isolation.
    No argument with this. It’s a smaller base. Set just smaller and more focused.


    Where this selling point is misleading is that, in a microservices world, it can
    have dozens of services working in concert to provide a given piece of business
    functionality. If you’ve drawn boundaries effectively, developers can look at
    services as ‘black boxes’ and not delve into the underlying mechanics of exactly
    how that service does what it does. The large number of them means that the entire
    service set is like a complex API that developers need to understand to write
    process services effectively. Essentially, the complexity is no different than
    understanding a large number of packages in a traditional application.


    There is a reason that I didn’t list this as a benefit before; I don’t agree with
    the assertion that microservice development is less complex. While it is easier
    to understand one individual part of the entire application, it is not easier
    to understand the application as a whole.


    ## Do Microservices increase development throughput?


    That is, does developer velocity increase for efforts using microservices architecture?
    The answer is ‘maybe’.


    **You must be good at contract management.** As explained earlier, your ability
    here directly impacts communication overhead. Communication overhead drastically
    reduces your velocity and development throughput.


    The goal is ‘increasing the speed at which you deliver functionality to end-users
    and to business units.’ While it’s easier to measure developer velocity for individual
    teams, it’s functionality delivered to the business that is really important.
    It’s common for new business level features to require multiple new services or
    feature enhancements to several microservices. This means effective contract management
    really means coordinating contract enhancements across multiple service teams.
    Without that coordination, developer velocity might increase, but velocity at
    business functionality is delivered might not. This coordination is required in
    order to be effective.


    ## Are Microservices truly disposable?


    Microservices are certainly more disposable than traditional web applications.
    That said, this benefit is a bit over-stated. Let''s think this through.


    A replacement for a service better exactly what its predecessor did, or you''ll
    have defects and unintended consequences. Furthermore, the replacement service
    needs to address all cross-cutting concerns as its predecessor did. In order to
    effectively replace a service without introducing defects, you need rigorous contract
    testing.


    Replace a microservice exactly before making changes; never combine changes with
    the replacement. This simplifies testing. You can run your test suite against
    the old and the new – and you should always get the same answer. If there are
    intended changes in the new version, then it''s much harder to do this. This begs
    the question: do you duplicate any bugs you discover in the process of rewriting
    a service? I say ''yes''; it keeps testing simple. It''s possible that one of
    your consumers discovered your bug and is currently coded to work around it; fixing
    that bug would break a consumer.


    You must be good at contract testing. Without rigorous contract testing capabilities,
    deploying a rewritten version of a service is a risk. Run your test suite against
    both service versions and it should pass. The implication here is that the test
    suite is specific to the contract being tested, but not the underlying service
    specifically.


    You must be good at providing robust application architecture support. You don''t
    want developers of new services spending more than configuration / set-up time
    on addressing cross-cutting concerns. If you do, that increases the cost of establishing
    new services. It also makes it more difficult to replace services as they need
    to address these cross-cutting concerns as well.


    ## Best Practices and Common Mistakes


    As with all new paradigms, best practices and common mistakes in usage of that
    paradigm emerge as it matures. We''re starting to see that now with microservices
    architecture. This section will detail some of them.


    ## Best Practices


    ### Record Microservice Requests and Responses


    This helps support developers diagnose problems that don''t result in an exception.
    Often, this log is a rolling log that only keeps transactions for a configurable
    period of time for space reasons. This tremendously saves developer time as often
    as you don''t need to take time to build/replicate a transaction that produced
    unexpected/unwanted results; transaction already exists in your history and it
    is often quicker to fix it rather than re-create it.


    Correlate service requests with the response. I''ve stated that a management software
    implementation, such as Splunk or Logstash, is essential for microservices architecture.
    Recording requests and responses can be as simple as logging them and making logs
    available to developers. It''s imperative that developers be able to match the
    request and response for each service call. If you utilize technique of associating
    each log entry with a unique transaction or correlation id, as described in a
    preceding chapter, all you will need to do log all the requests and responses,
    and developers will have this information.


    ## Common Mistakes


    As with any technology paradigm, microservices architecture can be misused.


    ### Inappropriate service boundaries


    Services should be truly loosely coupled and self-sufficient. If you find that
    one change requires deployment of multiple services, it most likely means that
    you have coupling you shouldn''t have or are intentionally introducing a contract-breaking
    change. While the latter is sometimes unavoidable, the former usually indicates
    a boundary design flaw.


    Services shouldn''t be about execution context. For instance, they should be just
    as usable as a user interface and batch process. If you experience unintended
    consequences when you acquire new consumers, it most likely means that the service
    isn''t truly context independent; that it has some contextual requirement that
    your new consumer somehow isn''t meeting. This is most likely some type of contract
    boundary design flaw as well.


    ### Exposing microservices to the browser


    Microservices are not meant for public consumption. Much of the reasoning for
    this was presented with the ‘back ends for front-ends’ pattern for deploying user
    interfaces. Organizations do not control performance on the public internet. Combine
    with the fact that user actions often involve multiple service calls and it becomes
    obvious that some consolidation is needed for user requests.


    ### Infective transaction logging


    The amount of time spent localizing problems (figuring out which service contains
    the root cause of a problem) is much greater with microservices architecture.
    Effective logging of microservice requests and responses can reduce this time
    tremendously. With the increased number of deployables inherent with microservices
    architecture, localizing the services in which defects occur will be a time-consuming
    problem without access to service requests and responses.


    ### Infective exception handling


    A high percentage of exception reports should contain enough information in the
    exception to at least localize the root cause of the problem, if not make the
    root cause visible. Without that information, support developers are left with
    time-consuming trial-and-error to attempt to replicate the issue in a test environment.
    This burns time.


    ### Infective request validation


    Catching errors earlier than later will always save time in the long run. Letting
    invalid requests through and eventually degenerating into some type of derivative
    exception will always cost developers more time than having the exception reported
    earlier and closer to the scene of the crime.


    ### Infective response validation


    Have you received null pointer exceptions or other types of derivative exceptions
    because a service you called didn’t return what was expected? If you rely on the
    results, it’s better to validate those values on return so that developers get
    a clearer error message. The reasoning here is very similar to why it’s important
    to validate request data.

