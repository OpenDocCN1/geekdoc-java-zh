    许多人问：“微服务架构不单是换了包装的 SOA 吗？”答案在很大程度上是“是”的。请记住，SOA 遭受着与微服务相同的定义疾病——在 SOA 中，并没有一个具体的定义。SOA
    对不同的人有不同的含义。


    它们在许多方面都是相似的，除了队列/管道的复杂性。SOA 在在队列中移动数据时，通常有非常复杂的管道系统。通常使用 Mule 或 Camel 工作流来转换、复制或重新排序传输中的数据，并适应数据在不同服务之间移动时产生的任何格式差异。


    在微服务世界中，进程服务（我们将学到它们是依赖其他服务运行的复杂服务）有效地协调复杂业务功能的交付。编排的角色被委托给了进程服务，而不是 Mule 或 Camel
    工作流。


    微服务架构使用“愚蠢管道”和“智能端点”。微服务使用队列，但没有你可能在面向服务的架构（SOA）世界中发现的任何转换。通常情况下，没有复杂的流（例如 Mule
    或 Camel）对从服务到服务传输的消息数据进行格式化、过滤或排序更改。以你音响系统的电源供应作为此类管道的例子。电力要么开启，要么关闭，中间没有其他状态。一个“管道”不会再更简单了，管道本身绝对没有任何智能性。


    ## 重构为微服务架构


    通常，应用开始时并不是微服务架构的。通常情况下，应用是单体应用，随着规模变大，被重构为微服务架构。

