    This gives us loose coupling, but also a couple of problems. What do we do with
    common business data? All organizations have data that are common throughout the
    enterprise; that is, data that multiple services need.


    Consider a higher-ed example. Universities have ‘campuses.’ Indiana University,
    which I attended, has campuses in Bloomington, South Bend, Indianapolis, and many
    other locations. Multiple services with a microservices architecture will need
    this information. If each service has its own database, that means they are not
    using a central data store somewhere. The two choices are service call or copy.
    That is, define a service that ‘owns’ campus information and make all other microservices
    call to get that information. The other option is to arrange to ‘copy’ that data
    to all services that need it.


    Personally, I prefer using the service method. (Don’t worry; I’ll present ways
    to mitigate the performance impact for the additional service calls.) I prefer
    not to copy data from one service to another because it usually creates a maintenance'
