    图 2.9: 自定义回滚模式


    ![](img/fc4ff849e7f45c45b878bf5b4a675ecf_51_0.png)


    这种策略并非完美。反向事务也可能出错，或者在发布反向事务之前进程服务就会崩溃。无论何种，存储的数据都将处于不一致的状态，因此需要某种类型的修复。通常，这是手动完成的。


    编写自定义回滚事务需要耗力，因此你不想在所有场景中都使用这种模式。基本上，你有两个选择：编写自定义回滚以减少对人工干预的需求，或者在错误发生时手动保持数据一致。通常，组织从人工干预开始，然后使用代码自定义回滚来处理故障频率最高的区域。


    这种模式极其难以泛化并提供产品支持。反向事务所需的特定逻辑需要自定义编码。


    ## 管理服务版本


    在传统的 Web 应用中，管理服务版本已经足够困难了。在微服务世界，随着服务数量呈指数级增长，问题也随之倍增。目前有两种流行的版本控制策略。第一种是直接将版本号放在服务的
    URL 中。第二种允许客户端在请求头（header）中请求服务版本。如果他们没有请求版本，则默认使用最新版本。我将介绍这两种版本控制方法。在此之前，让我们讨论不同类型的更改以及你作为服务生产者或消费者应承担的公民义务。


    ## 破坏性变更与非破坏性变更


    **破坏性变更（Breaking change）会导致现有服务调用报错的变更。** 破坏性变更强制消费者必须更改代码以避免错误。是的，你可以通过采用弃用策略（我稍后会讨论）来缓解这种影响，但尽管如此，你仍然强制了改变。根据定义，强制性变更对于消费应用团队来说，其优先级高于大多数其他任务，并可能抢占其他正在开发中的功能增强。从消费团队的角度来看，这种更改是如其来的，不像调度功能增强那样容易管理。


    并不是所有的更改都是破坏性变更。如果一个请求主题信息的服务调用突然返回了几个额外的额外信息，这应该是一个非破坏性变更。它是非破坏性的，因为消费者不应该关注提供的额外信息，因为他们没有处理这些信息的逻辑。如果他们决定处理这些额外信息项，可以按照自己的计划来增强服务。事实上，他们可能根本不需要这些额外信息来增强服务。


    **作为服务发布者，你的公民义务是仅在万万不得已的情况下引入破坏性变更。** 只有在绝对没有其他办法时才引入破坏性变更。尽管主观意良好，这种情况仍可能发生。可能是因为依赖的服务引入了破坏性变更，从而迫使你做出反应。可能是因为依赖服务所需的功能不再存在，导致某项功能无法再支持。也可能是组织决定废弃某项业务流程，结果是你需要引入破坏性变更来适应该业务决策。请注意，这可能不是导致破坏性变更的原因的完整列表。


    **作为消费者，你的公民义务是忽略服务调用中返回的任何你不需要的信息。** 原因是，这会让你的消费端服务更具韧性，并且受你所调用的服务变化的影响更小。你不会受到结果集中新增或你真正需要的属性被移除的影响。这降低了你所调用的服务变化影响消费服务的概率。


    **作为服务提供者，你需要建立一套弃用策略。** 也就是说，你不能仅仅引入一个破坏性变更就让消费者手忙脚措地调整。在一段时间内，你需要同时支持旧服务*和*新服务。你还需要一种通信机制，允许你发布版本变更，并宣布特定版本将不再提供支持的时间点。


    **版本控制*仅*适用于破坏性变更。** 非破坏性变更可以在相同版本下发布；如果更改是非破坏性的，提供者不应被迫维护独立版本。这激励了消费者忽略他们不使用的返回数据，因为这样当他们调用的服务得到增强时，可以将对其体验的影响降至最低。


    这留下了几个问题。如果客户端实际上在管理自己从服务的*版本 a*到*版本 b*的迁移计划，那么就需要一种方法让客户端指定他们想要的服务版本。在提供者端，架构师需要一个合理的策略，在一段时间内支持服务的两个版本。我之所以说“两个”，是因为理想情况下，在任何时候你都应该有一个弃用版本和一个当前版本。


    ## 通过 URL 进行版本控制


    一种流行的版本控制方法是通过 URL 进行的。也就是说，将版本号编码在 URL 的某处，让消费者在从*版本 a*移动到*版本 b*时更改其请求 URL。URL
    版本控制示例可以在列表 2.6 中找到。


    列表 2.6: URL 版本控制示例


    - https://university.edu/services/Students-1.0/12345

    - https://university.edu/services/Courses-2.1/PY101


    通过 URL 版本控制最初看起来很有吸引力，因为 Web 服务器软件可以轻松支持。你可以部署多个版本的服务，Web 服务器软件可以将客户端路由到正确的版本。例如，Web
    服务器软件可以轻松区分 Students-1.0 和 Students-1.1，并自动将客户端路由到他们请求的版本。当某个版本被弃用时，尝试使用它的客户端可以接收
    426（“需要升级”的 HTTP 状态码）或被重定向。


    如果你通过 HATEOAS 提供引用，就会出现问题，因为提供 HATEOAS 的服务需要感知所引用服务的版本变化。例如，如果 Students-1.0 提供指向
    StudentClasses-1.1 的 HATEOAS 引用，当引入 StudentClasses 新版本时，该服务需要更改。这使得提供 HATEOAS
    引用变得复杂且麻烦。


    此外，你无法控制何时这些 URL 的何时。在提供和使用之间，编码可能已经被弃用了。这也是我倾向于通过头部进行版本控制（下文）的原因。


    ## 通过头部进行版本控制


    一种版本控制方法是允许客户端在服务的请求头中请求特定版本。没有标准的头部名称可以解决这个问题。有人建议使用 ACCEPT 头来同时指定版本和预期的格式。对我来说，使用
    ACCEPT 头是关注点的泄漏。ACCEPT 实际上是关于格式的。版本规范意味着除了 GET 之外的区别。列表 2.7a 和 2.7b 是通过头部进行版本的示例。


    # 列表 2.7a: 示例


    ```

    URL: https://university.edu/services/Students/12345

    ACCEPT-VERSION: 1.0

    ACCEPT: application/json

    ```


    # 列表 2.7b 使用 ACCEPT 头进行版本的示例


    ```

    URL: https://university.edu/services/Students/12345

    ACCEPT: application/vnd.students.v1.0+json

    ```


    我倾向于引入自定义头部，如列表 2.7a 所示，因为没有任何标准的头部名称适用于此。这也让 ACCEPT 可以自由指定格式，以防你的服务支持多种表现形式。例如，客户端在调用
    Students 服务时可能会指定 ACCEPT-VERSION=1.0 请求头。如果该版本已被弃用，则最旧支持的版本将尝试满足请求。也许有效，也许可能无效。毕竟，如果消费者不听从你的弃用公告，他们得到什么就只能什么。如果消费者完全没有指定版本，他们将获得最新的可用版本。通过头部进行版本控制确实需要某种类型的路由器来查询头部值并将请求重定向到适当的版本。我不了解任何针对头部版本控制的产品支持，但对其进行泛化并提供是容易的。


    图 2.10: 头部版本控制示例


