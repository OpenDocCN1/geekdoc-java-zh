    逻辑结论是，如果依赖的资源不存在，服务应该尽可能地失败。这种失败将具有描述性，而且显然不是根因类型的问题。管理员能够快速查出根源，而不需要不可用服务的工作可以继续进行。这是性能调优中一个有趣的视角。


    关于“立即且显式失败”这一概念的进一步阅读，可以参考 Jim Shore 的文章《快速失败 (Fail Fast)》。


    ## 故障编码模式 (Coding Patterns for Failure)


    本节描述了用于更快速失败并在无人工干预的情况下自动恢复的编码模式。


    ## 重试模式 (Retry Pattern)


    重试模式简单地不断重试请求的任务，直到最终成功。这让我想起了那句老话：疯狂就是不断地做同样的事情，并最终获得不同的结果。该算法如图 2.3 所示。


    图 2.3: 重试模式


    ![](img/fc4ff849e7f45c45b878bf5b4a675ecf_38_0.png)


    重试机制中通常有两个重试配置选项。可以在 GitHub 上的开源项目 Insanity 中找到重试模式的一个示例实现。


    - 放弃操作前的最大重试次数

    - 每次重试之间的时间间隔


    对于想要开发者级别细节的人来说，Insanity 的默认算法提供了间隔和最大重试的配置选项。列表 2.1 提供了一个使用 10,000 毫秒重试间隔和 2
    次最大重试的使用示例。Insanity 要求你将需要重试的代码嵌入实现 JDK `Callable` 接口的类中。是的，如果你愿意，Insanity 允许你编写接受不同配置选项的重试算法。


    ## 列表 2.1: 使用 Insanity 的 RetryAlgorithm 示例


    ```

    DefaultRetryAlgorithm algorithm = new DefaultRetryAlgorithm(2, 10L);

    RetryManager<String> retryManager = new RetryManager<String>(algorithm);

    MyCallable callable = new MyCallable();

    String call result = retryManager.invoke(callable);

    ```


    重试模式基于故障是暂时的假设——最终会恢复服务，请求的操作将完成。重试模式在工作异步的情况下效果最好，请谨慎使用。在微服务世界中，我们不应该关心执行上下文。


    该模式有产品支持。它由 Apache Httpclient 产品提供（因此 CXF 也有支持，因为它依赖于 Httpclient）。Spring batch
    提供了一个实现此模式的 `RetryTemplate`。


    ## 断路器模式 (Circuit Breaker Pattern)


    这种模式是房屋或公寓中电路接线盒的软件版本。电路要么是关闭的，要么是打开的。如果它是关闭的，那么电路上的所有设备都有电并可以运行。当发生故障时，电路会跳闸并打开。在电路打开的状态下，电路上的任何设备都没有电或无法运行。当你重置配电盒中的电路时，该电路上的每个设备都会恢复电源。


    断路器模式的工作原理是相同的。当遇到错误阈值时，它会跳闸并立即报错。在可配置的时间范围内，任何后续的调用也会立即报错。可以在我的开源 GitHub 项目 CircuitBreaker
    中找到断路器模式的示例实现。


    图 2.4: 断路器模式


    电路处于“关闭”状态

    电路跳闸并处于“打开”状态

    电路处于“半开”状态


    在可配置的间隔后，服务请求操作将作为“测试”通过。如果测试成功，电路将自动关闭并允许所有服务调用。换句话说，服务在没有人工干预的情况下自动恢复。


    断路器的软件版本通常具有这些配置选项：


    - 触发电路跳闸并关闭服务所需的连续错误次数。

    - 关闭服务到允许“测试”服务调用继续之间的时间间隔。


    对于想要细节的人来说，CircuitBreaker 的默认算法提供了时间间隔和连续错误次数的配置选项。列表 2.2 提供了一个使用 10,000 毫秒时间间隔和连续错误阈值的配置使用示例。Insanity
    要求你将需要重试的代码嵌入实现 JDK `Callable` 接口的类中。如果你愿意，CircuitBreaker 允许你编写接受不同配置选项的算法。


    ## 列表 2.2: 使用 CircuitBreaker 的 Circuit algorithm 示例


    ```

    DefaultCircuitBreakerAlgorithm algorithm = new DefaultCircuitBreakerAlgorithm(10L,
    2L);

    Circuit<String> circuit = new Circuit<String>(algorithm);

    MyCallable callable = new MyCallable();

    ```


    ```

    String callResult = circuit.invoke(callable);

    ```


    `Circuit` 类保留了状态（例如，跟踪连续错误的数量，并知道何时允许测试执行），该变量声明实际上至少应该在实例级别。


    Hystrix 产品套件中隐藏了该模式的产品支持。如果你出于其他原因使用 Hystrix 套件，你绝对应该利用他们的实现。如果不是的话，那个产品的开销非常大。在这种情况下，我会使用更窄的实现，比如我示例中的那种。


    断路器的使用最好放置在客户端代理或适配器中。这样一来，当它跳闸时，你就可以避免调用的网络交互。


    ## 通过消息分发 (Dispatch via Messaging)


    我们将其用于传统的 Web 应用程序。其核心思想是将服务指令编码为消息并将其放在持久化队列中。即一个记录指令并保证的队列。


    图 2.5: 通过消息分发


    ![](img/fc4ff849e7f45c45b878bf5b4a675ecf_41_0.png)


    注意，这也是一种性能模式。虽然它并没有真正让工作变得更快，但它通过让工作异步为用户提供了速度提升的错觉。


    ## 服务调用中介者 (Service Call Mediator)


    服务应该具备部分运行的韧性。核心思想是提供降级服务优于提供无服务。一个例子是经营飞机上销售 WiFi 的业务。


    图 2.6: 服务调用中介者模式


    ![](img/fc4ff849e7f45c45b878bf5b4a675ecf_43_0.png)


    由于发起服务接收到默认/正常的响应，它会照常处理。发起服务中为了提供部分功能所需的代码量被到了最低。然而，从发起服务的角度来看，服务调用中介者记录了错误并启动了任何需要的支持。


    对于想要更多代码级示例的人，列表 2.3 提供了一个使用 `TaskMediator` 的服务中介者模式示例。


    ## 列表 2.3: 使用 TaskMediator 的服务调用中介者算法


    ```

    TaskMediator<String> taskMediator = new TaskMediator<String>(DEFAULT_RESPONSE);

    MyCallable myCallable = new MyCallable();

    String callResult = taskMediator.invoke(callable);

    ```


    注意可以将中介者模式与断路器模式相结合。通过这种方式，你可以获得更早失败且消耗更少资源的处，同时也获得了提供部分功能的益处。使用 CircuitBreaker
    实现此点的示例可以在列表 2.4 中找到。


    ## 列表 2.4: 结合服务调用中介者与断路器的示例


    ```

    DefaultCircuitBreakerAlgorithm algorithm = new DefaultCircuitBreakerAlgorithm(10L,
    2L);

    Circuit<String> circuit = new Circuit<String>(algorithm);

    MyCallable myCallable = new MyCallable();

    CallableCircuit<String> circuitCallable = new CallableCircuit<String>(circuit,myCallable);

    TaskMediator<String> taskMediator = new TaskMediator<String>(DEFAULT_RESPONSE);

    String callResult = taskMediator.invoke(callable);

    ```


