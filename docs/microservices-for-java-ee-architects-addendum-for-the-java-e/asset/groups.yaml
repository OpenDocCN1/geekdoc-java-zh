    \ service attributes about students are listed, as well as any supporting services.\
    \ An explanation of the different HTTP methods and their implications are presented\
    \ in table 2.1.\n\n# Table 2.1: HTTP Method Usage\n\n| HTTP Method | Usage Notes\
    \ |\n|---|---|\n| GET | Used for information retrieval only. It is assumed that\
    \ GET operations do not change data in any way. |\n| POST | Used to create a resource\
    \ only. It is assumed that the resource doesn't already exist and is being newly\
    \ created. |\n| PUT | Used to update a resource. It is assumed that all information\
    \ on a resource is being updated. |\n| PATCH | Used for partial resource updates\
    \ (e.g., a selected number of resource attributes). |\n| DELETE | Used to delete\
    \ a resource. |\n\nBy itself, the diagram in Figure 2.1 might not be complete\
    \ enough for a team to develop from it. However, at the planning stage, it certainly\
    \ suffices and definitively developers with a starting point from which they can\
    \ ask intelligent questions. As an aside, I used the open source product Freemind\
    \ to produce the diagram in Figure 2.1. I use Freemind for the initial planning\
    \ of RESTful web services like this.\n\nOf course, there may be multiple operations\
    \ to support cross-cutting concerns, such as health checks, performance metrics,\
    \ runtime diagnostics, etc. Those operations are important, but they exist for\
    \ support purposes and don't have anything to do with the service's reason for\
    \ existing. I divide the world up into two categories of services: core services\
    \ and process services.\n\n# Core Services\n\nCore services store business facts\
