    \ GET 等）。右侧是支持这些服务的属性以及 HATEOAS 链接。这些 HTTP 方法的用途呈现在表 2.1 中。\n\n# 表 2.1：HTTP 方法用途\n\
    \n| HTTP 方法 | 用途 |\n|---|---|\n| GET | 仅用于信息检索。假设资源不会发生变化。 |\n| POST | 用于创建新资源。假设资源不存在且正在被创建。\
    \ |\n| PUT | 用于更新资源。假设资源正在更新。 |\n| PATCH | 用于资源的部分更新（例如，资源的属性）。 |\n| DELETE |\
    \ 用于删除资源。 |\n\n从本质上讲，图 2.1 展示了这种核心服务的示例。核心服务通常以名词命名，因为大多数业务事实都是如此。用于识别 RESTful\
