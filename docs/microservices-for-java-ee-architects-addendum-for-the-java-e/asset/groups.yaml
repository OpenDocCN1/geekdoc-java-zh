    ## 过程服务 (Process Services)


    过程服务管理复杂的业务任务。它们通常代表特定的业务动作或过程。通常，过程服务依赖其他服务获取处理所需的大部分数据。有时，过程服务需要持久化数据，但并非总是如此。


    你通常可以将一个过程服务的“使命”描述为“负责处理 ________ 的服务”。例如，课程类服务（StudentClasses service）负责为学生注册课程并报告学生选课情况。与核心服务示例类似，图
