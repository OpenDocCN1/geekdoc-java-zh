    # Adapter Services for Third Party Products


    With traditional web application deployments, it is not uncommon to use adapters
    for interfacing third party products (SalesForce, Microsoft Dynamics, Great Plains,
    etc.). These adapters translate between your service''s internal domain model
    and that used by the third party product.


    In a microservices world, we do the same. The only difference is that the adapter
    is an entire service, not just a class. If we left the adapter as a set of classes,
    changes to that third party service, such as product switches or upgrades, would
    affect multiple services. That''s not what''s wanted in this world.


    **It is imperative that the adapter service be product-generic.** Any part of
    the product domain model used by your service contract represents an unwanted
    coupling. The benefit to that is that product switches or upgrades should *only*
    affect the adapter; nothing else.


    **Log all requests and responses to third party products/services.** This is needed
    for support reasons. Should you need to call a provider for support, you don''t
    want to confuse the issue by talking about your code internally. Figure out what
    you need to correct with your service request and work backwards to what you need
    to change in your code.


    **Design adapters to handle failure for third party products or services.** You
    don''t directly control the availability or performance of third party products
    or services. Because of this, it''s uncommon for adapter services to implement'
