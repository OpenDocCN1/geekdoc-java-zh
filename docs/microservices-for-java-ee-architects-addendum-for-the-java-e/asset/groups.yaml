    # Preface


    Readers of the Java EE Architect''s Handbook, Second Edition are well acquainted
    with traditional application architectures. Since this book was published, microservices
    architecture has emerged. It is an important architecture with a variety of uses
    that Java architects should understand and be able to use.


    This book details microservices architecture and is an addendum to the Java EE
    Architect''s Handbook, Second Edition. This book will define microservices architecture
    and provide an overview of costs and benefits. As with the Architect''s Handbook,
    I will go on to address architecture, design, and implementation concerns specific
    to reader to microservices architecture.


    This book will take the reader to the point of producing a microservice. Beyond
    deployable, there''s the very interesting world of DevOps that addresses how to
    deploy, manage, and cluster microservice.


    # How this book is organized


    The first chapter defines microservices and contrasts it with traditional application
    architecture. The second chapter dives into design considerations for microservices.
    The third chapter discusses cross-cutting concerns for microservices. The fourth
    chapter discusses microservice usage guidelines. The fifth chapter discusses managing
    microservices development.


    # Description of common resources


    This book often makes references to the following open-source projects:


    - Apache HttpClient (https://hc.apache.org/)

    - Apache CXF (https://cxf.apache.org/)

    - Docker (https://www.docker.com/)

    - Spring Boot (https://projects.spring.io/)

    - Dropwizard (https://dropwizard.io/)

    - Hystrix (https://github.com/Netflix/Hystrix)

    - SoapUI (http://www.soapui.org/)

    - Google Guava (https://code.google.com/p/guava)

    - Apache Commons (https://commons.apache.org/lang/)

    - GitHub (https://github.com/Derek-Ashmore)


    # Feedback


    I''m always interested in reading comments and suggestions that will improve future
    editions of this book. Please send feedback directly to me at derek.ashmore@dvtpress.com.
    If your comment or suggestion is the first of its kind and is used in the next
    edition, I will gladly send you a copy of my book. Additionally, reader questions
    are sometimes selected and answered in my blog http://www.derekash.com/


    # About the Author


    Derek Ashmore is a senior technology expert with over 25 years of experiences
    in a wide variety of technologies. His past roles include Application Architect,
    Cloud Architect, Project Manager, Application Developer, and Database Administrator.
    He has extensive experience with custom application development as well as integrating
    applications with commercial products such as Great Plains, Salesforce, Microsoft
    Dynamics, DocuSign, and others. Derek has been designing and leading Java-related
    projects since 1999.


    Derek is also the author of The Java EE Architect''s Handbook, Second Edition,
    which is also available from DVT Press.


    If you need a project assessment for your Java-related project, Derek can be retained
    by contacting sales@dvtpress.com.


    Derek can be contacted by the following:


    - Email: derek.ashmore@dvtpress.com

    - LinkedIn: http://www.linkedin.com/in/derekashmore

    - Facebook: https://www.facebook.com/JavaEEArchitectHand

    - Twitter: https://twitter.com/Derek_Ashmore


    # Acknowledgments


    This book could not been written without a large amount of assistance. Several
    colleagues helped tremendously to refine the book concept and edit the drafts,
    thanks keeping me from mass marketing mediocrity. They have my undying gratitude.
    I could not have written the book without the assistance of the following people:
    Budi Kurniawan, David Arthurs, David Greenfield, James Gibbs, Ken Liu, Michael
    Spuzzica, Peeyush Maharshi, Pradeep Sadhu, Rick Miller, Scott Kramer, Scott Wheeler,
    and Silvio de Morais.


    Many thanks to my editor, Kathy Reed, who painstakingly my numerous grammar mistakes
    and graciously pointed out places where my verbiage was less than clear. Many
    thanks to Sherry and Tony Roberts and their colleagues at the Roberts Group for
    fantastic cover art, typesetting, indexing, and general wizardry to make the book
    aesthetically pleasing.


    Many thanks to my wife Beth and my children Zachary and Morgan.

