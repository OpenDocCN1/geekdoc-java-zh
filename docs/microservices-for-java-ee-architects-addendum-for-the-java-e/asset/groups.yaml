    formally supported by the platform. It has the same list of advantages and disadvantages
    – compared to microservices architecture – that Jigsaw does. In fact, you can
    look at Jigsaw as filling the same goals as OSGi.


    There are several differences when comparing OSGi to microservices architecture.
