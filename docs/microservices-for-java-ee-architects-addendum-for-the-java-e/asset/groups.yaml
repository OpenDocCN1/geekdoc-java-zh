    Security is implemented in layers. Each layer represents a ‘hurdle’ for an attacker.\
    \ The more sensitive the secured resource is, the more layers of security are\
    \ placed around it; making unauthorized access to the secured resource more difficult.\
    \ This is a basic security concept that we utilize everywhere. As a simple example\
    \ of a security layer, organizations use firewalls to place a security level around\
    \ internal resources; and you must have at least internal access per firewall\
    \ to access internal web applications and resources. Organizations don't stop\
    \ with this layer; they normally add another layer using access groups (e.g.,\
    \ LDAP groups) to differentiate which users can access which resources – but you\
    \ get the idea. Each layer presents an obstacle for attackers, making the resource\
    \ harder to breach. Microservice security is no exception and fits into this paradigm\
    \ rather well.\n\n**Restrict network access to your production microservice library.**\
    \ The first line of defense is networking. It's not uncommon to put your entire\
    \ server-side network architecture, including your microservice library, behind\
    \ a firewall and restrict virtual machines (VMs) that have access to it. That\
    \ is, the firewall allows consumers for your microservice library in, but nothing\
    \ else. If you implement the API Gateway pattern, your web applications (both\
    \ internal and external) are the only consumers of your microservice library and\
    \ are VMs that truly need access. Support personnel can be provided remote access\
