    # Coding Patterns for Failure


    This section describes coding patterns that can be used to fail more quickly and
    automatically recover with no human intervention.


    # Retry Pattern


    The retry pattern simply retries the requested work until it eventually succeeds.
    This reminds me of the old saying that insanity is the act of doing the same thing
    over and over and eventually obtaining a different result. This algorithm is illustrated
    in Figure 2.3.


    Figure 2.3: Retry Pattern'
