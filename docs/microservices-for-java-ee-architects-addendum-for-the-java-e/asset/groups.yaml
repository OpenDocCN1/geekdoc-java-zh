    # Contract Testing Procedures and Requirements


    Scheduled and automated contract testing procedures for microservice libraries
    are critical for several reasons. This section will discuss these concerns.


    Continuous integration for microservices is essential. Microservices architecture
    facilitates higher development throughput. That means a higher frequency of production
    deployments and less opportunity for manual integration testing. The implication
    here is that automated contract testing for microservice libraries is essential.
    Without the safeguard of continuous integration and the automated contract testing
    that comes with it, you''ll find defects migrated to production. Continuous integration
    is the main safeguard against deploying defects to production. Unit testing for
    code within microservices, while useful, isn''t as effective as a safeguard in
    microservices architecture. Some even advocate abandoning unit testing altogether
    in favor of


    contract testing, but I''m not quite willing to go for that far.


    Continuous integration compensates for developer myopia. In a world where developers
    work on one service at a time and increasingly relying on service calls, they
    don''t understand exactly what might break from a business perspective should
    they deploy a defect. You might see this as a negative, but it''s purposely part
    of the paradigm to make developers more focused and productive. My point is that
    developer myopia needs mitigation, and continuous integration and automated testing
    is that mitigation.


    Continuous integration allows individual microservices to be truly disposable.
    In a world where services approach being ‘disposable’ – that is, it’s relatively
    easy to scrap one version of a service and completely rewrite it – a new version
    of a service needs to do exactly what the old one did. With a healthy automated'
