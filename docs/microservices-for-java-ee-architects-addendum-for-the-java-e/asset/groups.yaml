    ## Supporting Multiple Version Deployments

    Deploy all versions as separate applications. Do not attempt to commingle multiple
    versions in the same service. There’s too great a risk that unintended changes
    inadvertently make made to previous versions. In addition, it makes the service
    code much more complex.


    Horizontally scale versions separately. It is conceivable that consumer load isn’t
    identical across versions. For example, it’s possible that load for version 1.0
    of your service is less than version 1.1 or 1.2. Consequently, version clusters
    might be configured differently. If your clustering is supported by DNS round-robin,
    use subdomains to distinguish different versions (e.g., students_1_1.university.edu).


    All versions of the service should use the same database. It’s possible that feature
    enhancements introduced in newer versions require a database refactoring that
    can make support of older versions of a service problematic. The book Refactoring
    Databases provides numerous patterns that can assist with resolving these problems.


    An illustration of these concepts can be found in Figure 2.11.


    # Figure 2.11: Version Deployment Example


    ![](img/fc4ff849e7f45c45b878bf5b4a675ecf_57_0.png)


    # Adapter Services for Third Party Products


    With traditional web application deployments, it is not uncommon to use adapters
    for interfacing third party products (SalesForce, Microsoft Dynamics, Great Plains,
    etc.). These adapters translate between your service''s internal domain model
    and that used by the third party product.


    In a microservices world, we do the same. The only difference is that the adapter
    is an entire service, not just a class. If we left the adapter as a set of classes,
    changes to that third party service, such as product switches or upgrades, would
    affect multiple services. That''s not what''s wanted in this world.


    **It is imperative that the adapter service be product-generic.** Any part of
    the product domain model used by your service contract represents an unwanted
    coupling. The benefit to that is that product switches or upgrades should *only*
    affect the adapter; nothing else.


    **Log all requests and responses to third party products/services.** This is needed
    for support reasons. Should you need to call a provider for support, you don''t
    want to confuse the issue by talking about your code internally. Figure out what
    you need to correct with your service request and work backwards to what you need
    to change in your code.


    **Design adapters to handle failure for third party products or services.** You
    don''t directly control the availability or performance of third party products
    or services. Because of this, it''s uncommon for adapter services to implement
    circuit breakers or call mediators to more gracefully operate during outages of
    third parties.


    # Common Enterprise Code for Microservices


    A question I''m frequently asked is if there can be common code between services.
    The answer is a qualified ‘yes.’ The bottom line is that you version common code
    and treat it the same as you treat third-party products like Hibernate or Apache
    Commons Lang. Individual services decide when/if to upgrade.


    Changes or enhancements to common code cannot force deployments of multiple services.
    This would create a high degree of coupling between services and thus defeat the
    benefits of using microservices architecture. Consequently, it''s rare that business
    logic is in common code. We don''t want changes to the business to affect multiple
    services.


    Common code should be versioned just like any third-party library you use. Individual
    services utilizing the common code base should be completely free to decide when
    they upgrade to newer versions. Version upgrades for common code products should
    never be forced upon them.


    # Chapter 3: Cross-cutting Concerns for Microservices


    This chapter deals with numerous cross-cutting non-functional concerns that all
    microservices must address, regardless of which technical stack they employ. These
    cross-cutting concerns include being able to effectively monitor services, detect
    failure, and diagnose and fix reported defects. Satisfying non-functional requirements
    make it possible for operations staff to support microservices architecture once
    it is deployed to production. Some of these requirements exist for traditional
    web applications, but become more imperative with microservices as the number
    of deployments increases exponentially.


    There are non-functional requirements that all microservices should meet, regardless
    of which technical platform or language they employ. Typically, these non-functional
    requirements are also cross-cutting concerns. That is, they are not specific to
    the business functionality they provide; they exist to make deployed services
    more supportable. As architects, we should establish reusable and easily implementable
    ways of satisfying non-functional requirements. This chapter will detail what
    those requirements are and provide options for easily satisfying them. Microservices
    should have the following to make them easier to support:


    - health checks (typically by URL)

    - performance metrics and alerts

    - resource consumption alerts

    - logging and error handling

    - deployment formats (e.g., Docker image).


    All of these non-functional requirements should be a part of the application architecture.
    Individual service teams should not have to ''develop'' tooling to satisfy any
    of these requirements. Install and configure, yes. Develop, no.


    One of the advantages of writing microservices using Java, or at least one of
    the interpreted languages running on the Java Virtual Machine, is the ease with
    which functionality to address non-functional requirements needed by microservices
    can be written and merely consumed. This architecture is allowing developers to
    concentrate on functionality they are providing instead of getting bogged down
    by technology and infrastructure concerns.

