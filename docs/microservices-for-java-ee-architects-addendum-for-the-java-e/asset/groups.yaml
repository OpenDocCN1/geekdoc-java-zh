    service is horizontal scaling/clustering. That is, running several copies of your
    service on different virtual machines, thus increasing the probability that at
    least one copy of a service is available for consumers. The likelihood that the
    entire cluster is down is less if there are multiple copies of that service running.
    We do this with traditional applications as well.


    There are legitimate reasons for a cluster to be down. It might be down for maintenance,
    or a resource it depends on may be down in its entirety. Bottom line: horizontal
    scaling isn''t enough of a defense against outages in a microservices world.


    Fail sooner than later. Have you ever surfed to an unavailable site? Typically,
    after 60 or 90 seconds, your browser tells you that the service isn''t available.
    The same thing happens with web service calls, such as those that microservices
    make.


    Why is this more of a problem than any other? In a world where service calls are
    nested – that is, service calls call other services – it doesn''t take much for
    a single failure to cascade to other services. Let''s explore this a bit.


    Suppose you have a microservice that''s scaled to support 20 concurrent transactions
    in terms of memory, database resources, container worker threads, etc. Suppose
    further, that each call normally takes less than 200 milliseconds (ms) to complete.
    Imagine what would happen if each of those calls suddenly had to wait for 30,
    60, or 90 seconds to fail. You would see lots of derivative errors: out of memory
    conditions, not enough worker threads, not enough database connections in the
    services connection pools. Soon, that service that''s dependent on the unavailable
    service would be non-operational. And the cascading of the failure would continue.
    Soon it would be harder to figure out what was the root cause, and a large percentage
    of your service library would be inoperative.'
- md: '

    The logical conclusion is that services should fail as quickly as possible if
    dependent resources aren''t there. The failure would be descriptive and obviously
    not a root cause type of issue. Administrators would be able to ferret the root
    cause quickly, and work that could continue without the unavailable service would
    continue. This is an interesting twist on performance tuning.


    Further reading on the concept of failing immediately and explicitly can be found
    in the article “Fail Fast” by Jim Shore.


    ## Coding Patterns for Failure


    This section describes coding patterns that can be used to fail more quickly and
    automatically recover with no human intervention.


    ## Retry Pattern


    The retry pattern simply retries the requested work until it eventually succeeds.
    This reminds me of the old saying that insanity is the act of doing the same thing
    over and over and eventually obtaining a different result. This algorithm is illustrated
    in Figure 2.3.


    Figure 2.3: Retry Pattern


    ![](img/fc4ff849e7f45c45b878bf5b4a675ecf_38_0.png)


    There are usually a couple of Retry configurable options on the retry. An example
    implementation of the Retry pattern can be found on GitHub in the Insanity project,
    which is open source.


    - The maximum number of retries before the operation is given up

    - The time interval between each retry.


    For people who want developer level detail, Insanity''s default algorithm provides
    the interval and max retry configuration options. Listing 2.1 provides a usage
    example using a 10,000 millisecond retry interval and 2 maximum retries. Insanity
    requires you to embed the code to be retried into a class implementing the Callable
    interface from the JDK. Yes, if you want to, Insanity allows you to code your
    own retry algorithm that accepts different configuration options.


    ## Listing 2.1: RetryAlgorithm example using Insanity


    ```

    DefaultRetryAlgorithm algorithm = new DefaultRetryAlgorithm(2, 10L);

    RetryManager<String> retryManager = new RetryManager<String>(algorithm);

    MyCallable callable = new MyCallable();

    String call result = retryManager.invoke(callable);

    ```


    The retry pattern operates on the assumption that an outage is temporary — that
    somebody will eventually restore service and the requested operation will complete.
    The retry pattern works best in cases where the work is asynchronous, so use it
    with care. In a microservice world, we''re not supposed to care about execution
    context.


    There is product support for this pattern. It is provided by the Apache Httpclient
    product (and thus CXF also has support because it relies on Httpclient). Spring
    batch provides a RetryTemplate that implements this pattern.


    ## Circuit Breaker Pattern


    This pattern is a software version of the circuit junction box in your house or
    apartment. Circuits are either closed or open. If they are closed, then everything
    on the circuit has power and can operate. When something bad happens, the circuit
    trips and opens. With an open circuit, nothing on that circuit has power or can
    operate. When you reset the circuit in the junction box, the power is restored
    to every device on that circuit.


    The circuit breaker pattern works the same way. Upon meeting an error threshold,
    it trips and errors out immediately. Any subsequent calls for a configurable period
    of time are also erroed out immediately. An example implementation of the circuit
    breaker pattern can be found on my GitHub project CircuitBreaker, which is open
    source.


    Figure 2.4: Circuit Breaker Pattern


    Circuit is "closed"

    Circuit trips and is "open"

    Circuit is "half-open"


    After a configurable interval, a service request operation is let through as a
    ''test.'' If the test succeeds, the circuit is automatically closed and all service
    calls are allowed. Put another way, service is restored automatically without
    human intervention.


    The software version of a circuit breaker usually has these configuration options:


    - The number of consecutive errors required to trip the circuit and shut down
    service.

    - The time interval between shut down and allowing a ''test'' service call to
    proceed.


    For people who want level detail, CircuitBreaker''s default algorithm provides
    configuration options for the time interval and the number of consecutive errors.
    Listing 2.2 provides a usage example with a configuration using a 10,000 millisecond
    time interval and a consecutive errors threshold. Insanity requires you to embed
    the code to be retried in a class implementing the Callable interface from the
    JDK. If you want to, CircuitBreaker allows you to code your algorithm that accepts
    different configuration options.


    ## Listing 2.2: Circuit Bre algorithm example using CircuitBreaker


    ```

