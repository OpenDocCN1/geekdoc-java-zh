    other service teams. Combined with the fact that they have low communication overhead
    and defined deliverables, they can be anywhere in the world in any time zone.
    It doesn''t matter whether they are in-sourced in a corporate office somewhere
    or off-shore.


    Given that the work of the team is confined to the focused requirements for the
    service, worries about code quality, etc. are at least contained to the small
    service code base. In other words, there''s a limit to how much code that team
    can mess up and thus create maintenance issues.


    # This means that development for microservices services can be more easily outsourced.


    This also means that you''re better insulated from rogue developers. We''ve all
    managed developers who produce unmaintainable code. As rogue developers are confined
    to one small and focused code base, there''s a limit to how much damage they can
    do to that code base. Furthermore, that code base is small, focused, and well-defined;
    it''s more replaceable if need be. You''re not letting rogue developers loose
    in a 500K monolithic application to cause havoc on a wider scale.


    # Increased Development Velocity


    Assuming contracts for needed services are fully defined, along with the dependencies
    between those services, it''s easier to bring larger number of development teams
    on ongoing efforts. The concern about bringing in additional developers is that
    this typically means more communication overhead. As a result of increased overhead,
    developer productivity has diminishing returns. You get less and less productivity
    out of each additional developer.


    While individual developer productivity does increase in microservice teams because
    they don''t have as much communication overhead, there is a limit to how much
    productivity increase you''ll get with any individual developer. Your velocity
    really comes from the ease with which new teams can be added. Developers never
    see or are impacted by the size of the overall effort they are doing heads-down
    development in a small, focused team. Consequently, it''s easier for management
    to scale development to larger numbers of developers. Note that in having all
    service contracts fully defined, you also have to have identified any dependencies
    between contracts; some services might require that other services are completed
    before work on a particular service can'
  - '[PAGE 103]


    finish. Note that any development team can stub dependent services and start work
    before dependent services are finished.


    What really happens here is that the constraint to scaling development shifts
    to management and enterprise architects responsible for identifying individual
    services and specifying the service contracts. With larger efforts will come more
    coordination points. As some services call other services, those dependent services
    need to be built first. The order in which work flows down to development teams
    needs to be coordinated.


    # Technical Stack Freedom


    In a microservices world, services are containerized. That is, the deployment
    artifact has an operating system and other software that it needs (e.g., Java
    JVM, PHP, Python, GoLang, etc.). Each service can easily operate at different
    levels of these technologies. The corollary is that new technologies can be more
    easily introduced or upgraded. That makes it easier for you to capitalize on newer
    technologies much more quickly than you can with traditional monolithic web applications.


    With traditional web applications, the code base is much larger. Therefore, the
    impact of upgrades will be much larger and require more extensive regression testing.
    Moreover, switching development languages is much more difficult with the larger
    code base.


    This is a technical benefit, but I believe it to be a management benefit as well.
    Managers are always looking for new ways to deliver software faster. One of the
    avenues for increased developer productivity is technology advances with the available
    toolsets. Your ability to utilize newly developed toolsets and bring about productivity
    increases that the business wants better with microservices architecture than
    with traditional web deployments.'
  - '[PAGE 104]


    # Further Reading


    If you''re interested in microservices architecture, there are several additional
    resources I can point you to.


    My interest in microservices began when I viewed this presentation by Fred George.
    I ran into it by accident, but I was fascinated by the ramifications of microservices
    architecture that he articulates. In essence, he-instigated this book, although
    he probably has no knowledge of this. Specifically, I was intrigued by the notion
    of services being ‘disposable.’


    The definitive guide on what microservices architecture is, and defining the paradigm,
    is Microservices by Fowler and Lewis. You may recall that I defined microservices
    as a list of characteristics that most microservices have. I wish I could claim
    that original thought, but I can''t. The Fowler/Lewis article is the definitive
    standard for a list of traits that microservices have. I chose what to be the
    most important traits to highlight.


    Fowler has also done valuable work on prerequisites for microservices architecture
    (here); that is, capabilities you should have in place before attempting microservices
    architecture on a large scale.


    Another thought on leader microservices is Adrian Cockcroft. A sample of his work
    can be found on this video. I follow his twitter feed.


    I closely follow two open projects in this space. The first is the Netflix product
    suite. They have to support an incredible amount of throughput and have been generous
    enough to open the source they built to support it. The second is Apache Mesos,
    which essentially makes computing resources ubiquitous. That is, it allows you
    to look at computing resources generically and not be concerned with where resources
    are hosted. With the large number of deployables that microservices architecture
    produces, this is very promising for reducing deployment management issues.


    Thank you for taking the time to read this book. Feel free to contact me at derek.ashmore@dvtconsulting.com
    or via LinkedIn if you have comments or questions. I''m always interested in feedback.'
