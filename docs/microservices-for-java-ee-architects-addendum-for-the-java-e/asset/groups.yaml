    many users do choose to integrate so they have the flexibility to exponentially
    grow the number of virtual machines they support in a short period of time.


    ## Demands on Database Administration Staff will increase.

    Most people think of additional demands on operations staff. A microservices architecture
    also increases the number of databases as well as the number of deployables, demands
    for new schema/database creations and enhancements will also increase. This means
    that demands on database administrators will also increase. Some organizations
    migrate onto the microservices teams themselves, but the work doesn''t go away
    no matter how it''s organized. It not often discussed, but database administrators
    will also need to adopt a DevOps culture and automate more of what they do.


    ## Service Contract Management


    Not a lot has been written about how microservice teams get their feature enhancement
    assignments. Microservices, by their very nature, provide the guts of the capabilities
    users request, but not in a context that those users are likely to understand.
    It''s more likely that users will make a feature request of the team providing
    them a web application or user interface. Upon realizing that they don''t have
    the capability to deliver on the feature request, the team will need to pass the
    non-GUI portions of the request onto one or more microservice teams to implement.
    For instance, suppose a UI team receives a request to store a professor''s syllabus
    for a specific class and there''s no service currently available that has the
    ability to remember that information. Somebody needs to shepherd that request,
    figure out which service it belongs in, ensure that the feature request contains
    enough information to be actionable, and route it appropriately. There''s a body
    of work here that needs to be accomplished and accommodated somehow. Most organizations
    utilize some type of task management software (e.g., Jira) to manage and track
    feature requests such as.


    **Management will be essential.** You can let developers design and publish service
    contracts as a grassroots effort. In other orders, let them do what they want
    and pay no attention. Initially, this is the easiest way to manage. However, as
    the number of deployed services grows, the developers won''t be able to see the
    forest for the trees. You''ll get lots of duplication, and you''ll get lots of
    inconsistency in the services that are created and deployed. Eventually, these
    defects will grow as the list of services increases and will erode some of the
    benefits you get from microservices architecture.


    I would never suggest that you impose a formal process to review and bless all
    service contracts before they are deployed and used. That would hinder developer
    velocity, which is one of the intended benefits of microservices architecture.
    However, somebody should trail behind the development teams and catalog published
    services in a standard format available to everyone, including management. They
    would then be in a position to document service inconsistencies, send change recommendations
    to service teams, and help facilitate developers adopting existing services –
    as opposed to inventing new versions of existing services. They would also be
    to point out potential risk areas to management, there should be any.


    ## Managing contract change will be essential. In a microservices world, the quality
    of the contracts will greatly impact the amount of benefit you receive from adopting
    microservices architecture. Poorly defined contracts will lead to confusion and
    chaos and negatively impact development velocity for new features. Some organizations
    are careful to limit the amount of change at any one time to keep quality high
    and guard against negatively impacting developer velocity.


    ## Feature enhancement assignments need to be unambiguous and clear to microservice
    team members. Remember that higher developer velocity is coming from the developer’s
    ability to be focused, and free from communication overhead. Giving them unclear
    feature assignments means that they will need to go and gather clarity from the
    users requesting them. Some process for grooming and tracking feature enhancement
    needs to be in place.


    ## Service Testing and Deployment Automation


    Investment in automated testing is essential. With higher development velocity
    comes an exponentially higher production deployment rate. Without testing automation,
    defects will quickly wreak havoc on your production environment. Automated contract
    testing is essential for mitigating these effects, in this world there often isn''t
    time for manual testing. This automation isn''t free; it requires labor to set
    up as well as care and feeding. It also requires enforcement.


    Automated deployments are essential. With increased development velocity, manual
    intervention with each deployment isn’t as possible as it used to be. An argument
    can also be made that manual steps in deployments actually add risk because they
    add a chance of error. Yes, this statement assumes a well-written, well-tested
    deployment process that typically doesn''t have a failure history. It goes without
    saying that only products with green test suites should be allowed into production.


    **Database changes should be automated too.** Often database changes accompany
    service deployments of new features. These days, it''s possible for those changes
    to also be automated. Products like FlywayDb are good for managing changes like
    this. Yes, back out or failed deployments will still require a certain amount
    of manual intervention, but hopefully, failed deployments will be a small percentage
    of the total.


    **Consider providing a process for consumer-based testing.** Consumer-based tests
    need to be automated and to be part of the test suite run against services. You
    can treat this as a test addition that must be green in for a production deployment
    to proceed. The only difference is that the team is providing and maintaining
    them. I would treat this as an ''option'' for service teams consuming other services
    rather than a requirement. In the past, I''ve had to rely on services that proved
    to be less reliable, resulting in failing tests. For unreliable services, it''s
    nice to know at the *outset* that dependent services are down and the test failures
    you''re getting are expected. It saves investigation time.


    ## Team Management


    **Manage the contract deliverables for teams, not the internal management of the
    teams themselves.** One of the benefits of microservices architecture is the elimination
    of communication overhead. Managing by deliverable, and not micromanaging teams,
    helps eliminate overhead. As long as you''re getting feature enhancements at an
    acceptable rate and quality, the way the team chooses to organize can be left
    to them.


    **Developers should be working on one service at a time.** This helps guard against
    making assumptions about business processes using services in a specific order
    or context. I say this because you won''t have a developer working on a service
    and its consuming service at the same time. This also helps focus without distractions
