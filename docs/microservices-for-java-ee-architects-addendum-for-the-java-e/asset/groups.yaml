    leaving data in a consistent state.


    Figure 2.9: Custom Rollback Pattern


    ![](img/fc4ff849e7f45c45b878bf5b4a675ecf_51_0.png)


    This strategy isn’t perfect. It’s possible that the reversing transaction will
    error out too or that the process service will tank before the reversing transaction
    can be issued. Either way, stored data will be left in an inconsistent state,
    thus requiring some type of fix. Usually, this is a manual one.


    Writing custom rollback transactions takes labor, so you don’t want to use this
    pattern on everything. Basically, you have two choices: to code custom rollbacks
    to reduce the need for manual intervention, or to manually make data consistent
    when errors happen. Usually, organizations start with manual intervention and
    then use code custom rollbacks to address areas with the highest frequency of
    failure.


    This pattern is incredibly hard to generalize and provide product support for.
    The specific logic needed for a reversing transaction needs to be custom coded.


    ## Managing Service Versions


    Managing versions of services is hard enough with traditional web applications.
    In a microservice world, the problem exponentiates as the number of services exponentiates.
    There are two popular versioning strategies in use. The first literally places
    a version in the URL for the service. The second allows the client to request
    a service version in the header. Should they not request a version, they default
    to the most current version. I will go through both versioning methods. But first,
    let''s discuss different types of changes and your civic duty as a producer or
    consumer of a service.


    ## Breaking vs. non-breaking changes


    **A breaking change is one that causes existing service calls to error out.**
    Breaking changes forces consumers to change code to avoid errors. Yes, you can
    mitigate the effect of this by adopting a deprecation strategy (which I will discuss
    later), but still, you force change. By definition, forced change is going to
    get prioritized above most other tasks for the consuming application team and
    will likely usurp other feature enhancements that are supported on work. From
    the consuming team''s perspective, that change comes out of the blue and isn''t
    as easily manageable as scheduling feature enhancements.


    Not all changes are breaking changes. If a service call requesting information
    about a topic suddenly returns a few additional items of information, this should
    be a non-breaking change. It''s non-breaking because consumers shouldn''t pay
    any attention to the additional information provided since they don''t have the
    logic to process it. Should they make a decision to process those additional information
    items, they can enhance their service on their own schedule. In fact, they might
    not need the additional items of information to enhance their service at all.


    **As a service publisher, your civic duty is to introduce a breaking change only
    as a last resort.** Only introduce breaking changes if absolutely nothing else
    is possible. This can happen despite the best of intentions. It could be that
    a dependent service introduced a breaking change, thus forcing a reaction. It
    could be that a feature can no longer be supported because the required functionality
    from dependent services is no longer there. It could be that the organization
    has decided to deprecate a business process, and as a result, you need to introduce
    a breaking change to accommodate that business decision. Note that this probably
    isn''t a complete list of what could force a breaking change.


    **As a consumer, your civic duty is to ignore any piece of information returned
    in a service call that you don''t need.** The reason is that this makes your consuming
    service more resilient and less impacted by changes in services you call. You
    won''t be affected by additions to your result set or the removal of attributes
    you don''t really need. This decreases the chance that changes to the services
    you call will affect the consuming service.


    **As a service provider, you need to establish a deprecation strategy.** That
    is, you can''t just introduce a breaking change and make consumers scramble to
    adjust. For a period of time, you need to support the old *and* the new service.
    You also need a communication mechanism that allows you to announce version changes
    and also to announce the point where support for specific versions will no longer
    be provided.


    **Versioning is *only* needed for breaking changes.** Non-breaking changes can
    be published under the same version; providers shouldn''t have to maintain separate
    versions if changes are non-breaking. This incentives consumers to ignore returned
    data they don''t use as it minimizes the impact of change their experience as
    the services they call are enhanced.


    That leaves several questions. If clients, in effect, manage their own migration
    schedule from *version a* to version *b* of a service, there needs to be a way
    for clients to specify which version of the service they would like. On the provider
    side, architects need a sensible strategy for supporting both versions of a service
    for a period of time. I say ‘both’ because ideally, at any time, you should have
    one version in deprecation and one current version.


    ## Versioning by URL


    One popular way to version is to version by URL. That is, encode the version number
    somewhere in the URL and make consumers change their request URL when they move
    from *version a* to version *b*. Examples of URL versioning can be found in Listing
    2.6.


    Listing 2.6: URL Versioning Examples


    - https://university.edu/services/Students-1.0/12345

    - https://university.edu/services/Courses-2.1/PY101


    Versioning by URL is initially appealing as it is easily supported by web server
    software. You can have multiple versions of a service deployed and web server
    software can route clients to the correct version. For instance, web server software
    can easily distinguish between Students-1.0 and Students-1.1 and route clients
    automatically to the version they request. When a version is deprecated, clients
    attempting to use it can either receive a 426 (HTTP status code for ''upgrade
    required'') or be automatically forwarded to a new version.


    This becomes problematic if you provide references via HATEOAS because it requires
    services providing HATEOAS link content to be aware of version changes in those
    referred services. For example, the Students-1.0 services provide a HATEOAS reference
    to StudentClasses-1.1, that service needs to change when new versions of the StudentClasses
    service are introduced. This makes providing HATEOAS references more complicated
    and problematic.


    Additionally, you have no control over when clients who have been provided with
    those urls will use them. Encoding could be deprecated between the time they are
    provided and when they are used. This is another reason I prefer versioning by
    header (described below).


    ## Versioning by header


    One way to version is to allow the client to request a specific version in the
    header of the service request. There are no standard header names that address
    this. Some have suggested using the ACCEPT header to specify both the version
    and the data format expected. To me, using the ACCEPT header is a leakage of concerns.
    ACCEPT is really about the expected format. Version specification implies possible
    behavior differences besides GET. Listings 2.7a and 2.7b are examples of versioning
    by header.


    # Listing 2.7a: Versioning Example


    ```

    URL: https://university.edu/services/Students/12345

    ACCEPT-VERSION: 1.0

    ACCEPT: application/json

    ```


    # Listing 2.7b: Versioning Example using ACCEPT header for versioning


    ```

    URL: https://university.edu/services/Students/12345

    ACCEPT: application/vnd.students.v1.0+json

    ```


    I prefer to introduce a custom header, as with listing 2.7a, since none of the
    standard header names really apply. This also leaves ACCEPT free to specify format
    in case your service supports multiple presentations. For example, a client might
    specify an ACCEPT-VERSION=1.0 request header in a call to the Students service.
    If that version has been deprecated, then the oldest supported version attempts
    to satisfy the request. Maybe it works, maybe not. After all, if a consumer isn''t
    going to listen to your deprecation announcements, they get what they get. If
    a consumer doesn''t specify a version at all, they get the most current version
    available.Versioning by header does require some type of router that interrogates
    the header value and redirects requests to the appropriate version. I''m not aware
    of product support for header versioning, but it would be easy enough to generalize
    it and provide it.


    Figure 2.10: Header Versioning Example

