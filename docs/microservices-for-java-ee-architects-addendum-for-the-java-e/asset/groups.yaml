    # Why Now?


    SOA and modularizing functionality via services has been around for a long time,
    so microservices architecture isn’t an entirely new idea. That begs the question:
    why now?


    # Virtualization and Cloud Advances make microservices architecture feasible.


    When SOA was popular, finding and installing hardware for a plethora of new services
    was a real issue. Now, most organizations have adopted hybrid clouds and an administrator
    can easily establish any new virtual machines that are needed to host new services.


    When SOA was popular, supporting an exponentially larger number of deployables
    was a real issue for operations staff. Back in those days, set-ups were manual
    and often re-invented. In a dev ops world, new environments can be configured
    and deployment happens in an automated fashion, thanks to tools like Docker, Chef,
    and Puppet; not nearly as much manual effort is needed.


    +   **Hardware and network infrastructure is cheaper than it’s ever been.**


    In the old days, tuning resource consumption was more imperative, as equipment
    was extremely expensive. Now the extra memory and process overhead required by
    microservices architecture isn’t nearly as much of a concern.


    # Future Directions for Modularity


    Microservices architecture isn’t the only paradigm for modularizing Java EE applications.
    This section will briefly describe other attempts to modularize Java EE and contrast
    them with microservices architecture.


    # Java 9 with Jigsaw


    Jigsaw formally introduces modularity to the Java platform. An early release is
    available, although a production release isn''t expected until 2016. Essentially,
    this feature comes with a new deployable (the module library or jmod) that does
    work in-process but is guaranteed its own mini-runtime environment. More detail
    about Jigsaw can be found.


    There are several differences when comparing Jigsaw to microservices architecture.


    Jigsaw has a couple of advantages:'
