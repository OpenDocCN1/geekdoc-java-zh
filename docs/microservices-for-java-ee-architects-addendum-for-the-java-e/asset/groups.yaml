    organization is inherently ''taxed'' as it needs to supply the capability for
    meeting non-functional requirements. For new technical stacks, strategies to address
    non-functional requirements may not exist within the enterprise and need to be
    identified and possibly developed. Ideally, the microservice team adopting a technology
    new to the enterprise will develop this capability in a way that others can reuse
    for other services. For example, if an enterprise adopts the JRuby framework and
    decides to write microservices using it, capabilities to incorporate health checks
    and performance metrics, and to address other non-functional requirements, may
    need to be identified and established.


    # Health Checks


    A health check is typically a URL that provides some type of indication that the
    service is responsive and able to fulfill its function. That URL is invoked by
    some type of monitoring tool (e.g., Nagios) that is capable of alerting an administrator
    if the health check fails. The simplest alert is that the microservice JVM is
    unresponsive. The question then becomes: what is your definition of ''responsive?''
    Often just to respond with an HTTP 200 isn''t sufficient.


    In addition to verifying that the service itself is able to respond to a URL without
    error, I like to check access to external resources and dependencies. For example,
    I like to check database connection pool health. Yes, databases and other external
    resources should also be monitored with separate health checks, but checking the
    health of the connection pool used for database access also verifies that the
    pool is sized properly for the transaction volume that the service is currently
    handling. This kind of check can only be performed within the'
  - '[PAGE 62]


    microservice process itself and cannot effectively be monitored from the outside.
    That kind of condition can also happen with traditional web applications and isn''t
    really new with microservices.


    Health checks, regardless of the technical stack used for the microservices you
    are writing, should be part of the application architecture provided by the enterprise.
    There is no reason why service producer should not build their own. I usually
    utilize the Dropweaver metrics library to code health checks.


    Those looking for a code-level example of such a health check can find one here.
    This example checks the connection pool to validate that the number of transactions
    waiting for a database connection is less than a configurable number (it defaults
    to three). That is, if too many transactions are waiting for database connections,
    then the service isn''t healthy because consumers are suffering performance issues.
    In this case, the connection pool might need to be resized for the load that the
    service is handling. In addition, I validate a connection from the pool to make
    sure not that the database is available, but also that network connectivity between
    the service and database is available.


    # Performance Metrics and Alerts


    Performance metrics aid developers in investigating performance problems. I track
    performance metrics, as performance for each page in the application, for traditional
    web applications as well. In receiving vague reports of slow performance, it''s
    useful to know exactly where performance currently is when compared to performance
    history, if you have it. More importantly, it also speeds up performance investigations.


    With microservices architecture, user actions can involve multiple services. Localizing
    a performance problem (i.e., determining which service(s) are contributing to
    that performance problem) becomes a time-consuming issue. Having that performance
    data for all services in hand greatly supports the developer''s time.


    Traditional web application performance is easier to measure. Typically, performance
    metrics are gathered at a URL / web page level. Tools to gather performance metrics
    for individual pages/URLs for a traditional web application are plentiful. I use
    Admin4J, but there are other product options.


    With RESTful web services, performance measurement is a bit more difficult'
  - '[PAGE 63]


    because URLs contain identifiers, and behavior differs by operation (GET, POST,
    DELETE, etc.). To elaborate, measuring by strict URL doesn''t make sense for RESTful
    web services as URLs contain data identifiers. For example, it''s not meaningful
    to measure GET operations for URLs /students/1 and students/2 separately. They
    are identical lookups, on different students. It would be better to have consolidated
    measurement for the entire mask /students/*. This gets even more difficult if
    your services have options for returning related items. For example, if the service
    supports /students/1/classes, the behavior for a class search result would be
    different than for the student search result and it might be useful to differentiate.
    Admin4J will consolidate performance metrics for RESTful web calls; at the time
    of my writing I haven''t found any other product that will.


    At the very least, measure the average call time and the total number of calls
    for each service. With the large number of deployables that most microservices
    architecture projects have, knowing the number of calls allows you to concentrate
    effort on tuning the most used services. Having the average call time helps localize
    performance issues where user actions involve multiple services. While I''m used
    to also having the minimum, maximum, and standard deviations of call times, along
    with the average and total number, that information is less useful and can be
    looked at as optional.


    Place automatic alerts for service times beyond a configurable threshold. This
    allows developers to start proactively diagnosing and fixing performance problems
    before users report them. Determining a sensible threshold for each service will
    involve some amount of trial and error. Having a threshold that''s too low will
    produce false alerts, or alerts that turn out not to be indications of material
    performance problems.


    # Resource Consumption Alerts and Responses


    There are some resource consumption issues within a JVM process that are effectively
    service health issues, they should occur.


    Monitor memory usage for deployed services. When you look at the way that the
    JVM allocates memory, it''s not the aggregate memory usage at the process level
    that most relevant, because that measurement includes native memory allocated
    by the JVM whether or not it''s actually used by Java code running within. What''s
    most relevant is consumed and available heap memory'
  - '[PAGE 64]


    within the JVM. Available heap memory is available to Java classes and can actually
    be consumed. I use Admin4J to monitor memory usage and issue alerts for shortages,
    but there are other tools available.


    In diagnosing memory shortages, the first question is whether the memory spike
    detected was caused by a memory leak of some type or not. If the cause was a memory
    leak, allocating additional memory will not help you. If the cause was normal
    usage, it''s possible there''s a capacity planning issue, and that either memory
    needs to be allocated or additional occurrences of the service need to be defined
    within the cluster.


    It is possible, with the Oracle JVM, to trigger a memory dump when an OutOfMemoryError
    is generated through the HeapDumpOutOfMemoryError option. This is rather limiting
    as this event can only happen once. Should the JVM recover from the memory shortage,
    additional occurrences will not generate heap dumps.


    **Monitor concurrent load for deployed services.** This information is needed
    for capacity planning. Increases in concurrent load will increase required memory
    and often increase average transaction time. In past, I''ve monitored concurrent
    load from within the JVM using Admin4J. These days, with cloud vendors providing
    scaling capabilities, it might make sense to monitor load from outside the JVM.


    Alerts for resource consumption issues are usually handled via log management
    software. That is, those, ''alerts'' are recorded in the log at an ERROR level,
    and log management software initiates some type of alert (e.g., initiate email
    or work ticket) to an administrator.


    # Logging and Error Handling


    **With microservices architecture, the ability to easily search all logs from
    all services is essential.** In the world, the number of deployables exponentially
    increases, and it''s not practical for support personnel to manually search individual
    log files from those deployables. With microservices architecture, using some
    type of log management system transitions transitions from being a ''nice to have''
    to be an absolute requirement.


    Log management software, such as LogStash or Splunk, gathers individual log entries
    and centrally stores them. Furthermore, these tools provide a central way'
- md: "\n**Log exceptions only once.** Logging exceptions multiple times will greatly\
    \ inflate your logs and make a specific exception pertaining to a reported defect\
    \ much harder to find. You can avoid the problem of repeating log messages by\
    \ logging exceptions at the entry points only. For example, it's easy to implement\
    \ a servlet filter that will log exceptions for any web transactions. This ensures\
    \ that exceptions are logged only once. This advice assumes that you've bundled\
    \ any additional information needed to resolve the error with the exception itself,\
    \ as described earlier in this chapter. Listing 3.2 illustrates a servlet filter\
    \ of this type.\n\n# Listing 3.2: Logging Servlet Filter example\n\n```\npublic\
    \ void doFilter(ServletRequest request, ServletResponse response, FilterChain\
    \ chain) throws\n IOException, ServletException {\n    try (chain.doFilter(request,\
    \ response));\n    catch (Throwable t) {\n        logger.error(\"Web Transaction\
    \ Error\", t);\n        ServletUtils.reThrowFilterException(t);\n    }\n}\n```\n\
    Source: Class net.admin4j.ui.filters.ErrorLoggingFilterFrom Admin4J (http://www.admin4j.net)\n\
    \nThis technique reduces application code and increases the chance that generated\
    \ exceptions are logged. Furthermore, if you leverage the Admin4J product, which\
    \ has an error handling filter, you'll get the request URL and a dump of any request\
    \ and session attributes at the time of the exception. In other words, you can\
    \ leverage an open source product to accomplish this, rather than creating your\
    \ own servlet filter for this purpose.\n\nIncidentally, you'll need to provide\
    \ similar architectural support for batch job classes, EJB classes, and Message-Driven\
    \ beans. Leaving exception logging to application code increases the probability\
    \ that an exception doesn't get properly logged.\n\n**Do not commit transaction\
    \ logs with normal application logging.** Transaction logs (e.g., user Fred changed\
    \ the address of customer Acme) have a different purpose. Often, transaction logs\
    \ are needed by normal business processes and really aren't directed at product\
    \ support. Most logging products will allow you to direct transaction logs to\
    \ a separate output for this purpose.\n\nNote that log retention and storage concerns\
    \ are a completely separate topic. Most logging products support storing logs\
    \ in a variety of formats, including file or database formats. Application code\
    \ should only be concerned with issuing log messages, not with the specifics of\
    \ how they are stored or for how long they are retained.\n\n**Provide a default\
    \ logging configuration that can be overridden at deployment.** This is purely\
    \ a convenience for developers that may need to run a build but might not have\
    \ taken the trouble to configure their local deployment. Furthermore, it's not\
    \ possible for developers to anticipate logging needs for specific deployments.\
    \ Consequently, it's important that administrators be able to easily configure\
    \ logging at deployment time.\n\n## Posting Change Events\n\nGiven that each microservice\
    \ has its own database, there are two options for accommodating common business\
    \ data that is needed by several services. (I highlighted this issue earlier.)\
    \ The first option, which I prefer, is not to duplicate common data but rather\
    \ to call the service responsible for maintaining that data when it's needed.\
    \ The second option is to 'copy' common business data to all services instead\
    \ of nesting service calls, copies are generally accomplished using publishing/subscribe\
    \ messaging.\n\nThe microservice responsible for maintaining common business data\
    \ would publish any change (e.g., add, change, or delete) under an established\
    \ topic in a consistent format. For example, a service responsible for maintaining\
    \ campus information (e.g., a Campus microservice) at a university might publish\
    \ the addition of a new campus or a change in status for an existing campus under\
    \ the topic CampusEvent.\n\nAny interested services would listen on that topic\
    \ and process any published changes. Typically, services listening for those changes\
    \ would need to publish a listener to monitor that topic. For example, a Course\
    \ microservice might listen to the CampusEvent topic and process any changes received.\
    \ The Course microservice would record any changes received in its own database.\n\
    \nDevelop a way to refresh copied data from its source. Copy processes can have\
    \ defects too. When that happens, a 'copy' of data will become out of sync. In\
    \ our example, the Course service copy of campus information won't match what\
    \ the Campus service has if an event is somehow missed or the recording of a change\
    \ errors out in the Course service. As all code has defects, this issue will happen\
    \ if you copy data between services. For that reason, support developers need\
    \ a way to refresh a data copy if it gets corrupted.\n\n## Packaging Options for\
    \ Microservices\n\nIn years past, with traditional web application deployments,\
    \ it was common some organizations to deploy multiple web applications per container.\
    \ Often this was a result of licensing costs for commercial containers which incentiv\
    \ reducing the number of containers as much as possible. That combination strategy\
    \ doesn't happen in a microservice world. Microservices are deployed as independent\
    \ processes, and that separate JVMs.\n\nThere are multiple products that facilitate\
    \ deploying java services as a single process. The two most popular products at\
    \ the time of writing appear to be Spring Boot and DropWizard. Yes, there are\
    \ others and they work just fine, I’m concentrating on the two products that are\
    \ most popular at the time of this writing.\n\nIn addition to those two products,\
    \ I’ll discuss a virtualization product useful for microservices; it’s called\
    \ Docker. Docker standardizes processes and provides supporting tools to support\
    \ deployments of services. We’re going to see that Docker goes a long way toward\
    \ decoupling developers from operations.\n\n## Spring Boot\n\nSpring Boot packages\
    \ web applications into a single executable jar file that can be executed via\
    \ a single command: java -jar myFunction.jar\n\nThat deployable jar contains an\
    \ embedded container (either Tomcat or Jetty) and contains every dependency class\
    \ needed to run your application.\n\nBesides your service, Spring Boot requires\
    \ you to create an Application class implementing main() that it can be run from\
    \ a command prompt. That application class handles most configuration items (connection\
    \ pools, number of threads, etc.). In addition, you can add properties specific\
    \ to your application. Spring Boot uses an application.properties file in the\
    \ classpath. An example of properties can be found here.\n\nSpring Boot does automatically\
    \ consume an application.properties file. These properties are mainly application-specific.\
    \ This mechanism allows you to configure at least application from outside. Everything\
    \ else is coded in the application class. Let’s consider an example of a spring\
    \ boot application class that I've open-sourced and published here. You can find\
    \ an example servlet definition with listing 3.3 and a filter example in listing\
    \ 3.4.\n\n# Listing 3.3: Spring Boot Servlet Configuration example\n\n```\n@Bean\n\
    public ServletRegistrationBean monetaServlet() {\n    ServletRegistrationBean\
    \ registration =\n        new ServletRegistrationBean(new MonetaServlet),\n  \
    \      \"/moneta/topic/*\");\nregistration.addInitParameter(\n        MonetaServlet.CONFIG_IGNORED_CONTEXT_PATH_NODES,\
    \ \"moneta,topic\");\n    return registration;\n}\n```\nSource: Class org.moneta.config.springboot.MonetaSpringBootApplication\
    \ from Moneta (https://github.com/Derek-Ashmore/moneta)\n\n# Listing 3.4: Spring\
    \ Boot Filter Configuration example\n\n```\n@Bean\npublic FilterRegistrationBean\
    \ monetaPerformanceFilter() {\n    FilterRegistrationBean registration =\n   \
    \     new FilterRegistrationBean(new MonetaPerformanceFilter),\n        monetaServlet,monetaTopicListFilter());\n\
    \    return registration;\n}\n```\nSource: Class org.moneta.config.springboot.MonetaSpringBootApplication\
    \ from Moneta (https://github.com/Derek-Ashmore/moneta)\n\nAs you might expect,\
    \ this class has a main that loads an application configuration, installs health\
    \ checks, and activates performance metrics collection and JMX. In addition, this\
    \ class defines several servlets and servlet filters. With traditional web applications,\
    \ these are defined in the web.xml configuration file; but Spring Boot configuration\
    \ is different.\n\nSpring Boot uses Logback logging by default. At this level,\
    \ a logging configuration is likely for developer convenience. When the service\
    \ is deployed, a production logging configuration will likely override what's\
    \ placed in the spring boot deployable. Look at the logging configuration at this\
    \ level as a ‘default,’ but nothing more.\n"
  mdcn: "\n\n**仅记录一次异常。** 多次记录异常会极大地膨胀日志文件，并使得与报告缺陷相关的特定异常变得难以查找。你可以通过仅在入口点记录异常来避免重复日志消息的问题。例如，实现一个\
    \ servlet 过滤器（servlet filter）非常简单，它可以记录任何 Web 事务的异常。这确保了异常只被记录一次。此建议假设你已经在本章之前描述的那样，将解决错误所需的任何附加信息封装在异常本身中。列表\
    \ 3.2 展示了此类 servlet 过滤器。\n\n# 列表 3.2：Servlet 过滤器日志示例\n\n```\npublic void doFilter(ServletRequest\
    \ request, ServletResponse response, FilterChain chain) throws\n IOException,\
    \ ServletException {\n    try (chain.doFilter(request, response));\n    catch\
    \ (Throwable t) {\n        logger.error(\"Web Transaction Error\", t);\n     \
    \   ServletUtils.reThrowFilterException(t);\n    }\n}\n```\nSource: Class net.admin4j.ui.filters.ErrorLoggingFilterFrom\
    \ Admin4J (http://www.admin4j.net)\n\n这种技术减少了应用程序代码，并增加了生成的异常被记录的概率。此外，如果你利用具有错误处理过滤器的\
    \ Admin4J 产品，你将获得异常发生时的请求 URL 以及任何请求和会话（session）属性的转储。换句话说，你可以利用开源产品来实现这一点，而不是为了此目的创建自己的\
    \ servlet 过滤器。\n\n顺便提一下，你还需要为批处理作业类、EJB 类和消息驱动 豆（Message-Driven beans）提供类似的架构支持。将异常日志留给应用程序代码会增加异常无法被正确记录的概率。\n\
    \n**不要将事务日志与普通应用程序日志一起提交。** 事务日志（例如，用户 Fred 更改了客户 Acme 的地址）具有不同的目的。通常，普通业务流程需要事务日志，它们并不是针对产品支持的。大多数日志产品都允许你为了此目的将事务日志重定向到单独的输出。\n\
    \n注意，日志保留和存储问题是一个完全独立的话题。大多数日志产品支持以多种格式存储日志，包括文件或数据库格式。应用程序代码应该只关注发布日志消息，而不应关注如何存储的具体细节或保留多久。\n\
    \n**提供一个可以在部署时进行覆盖的默认日志配置。** 这纯粹是为了开发者的便利，他们可能需要运行构建，但可能没有花精力配置本地部署。此外，开发人员无法预测特定部署的日志需求。因此，管理员能够在部署时轻松地配置日志至关重要。\n\
    \n## 发布变更事件\n\n鉴于每个微服务都有自己的数据库，对于多个服务共同需要的通用业务数据，有两种方案。（我之前在这里强调过这个问题。）第一种方案（也是我偏倾向的方案）是不复制通用数据，而是在需要时调用维护该数据的服务。第二种方案是将通用业务数据“复制”到所有服务，而不是嵌套服务调用，复制通常通过发布/订阅（publishing/subscribe）消息机制完成。\n\
    \n负责维护通用业务数据的微服务将在已建立的主题（topic）下以一致的格式发布任何更改（例如：添加、更改或删除）。例如，大学中负责维护园区信息的服务（例如\
    \ Campus 微服务）可能会在 `CampusEvent` 主题下发布新校区的添加或现有校区状态的变更。\n\n感兴趣的服务都会订阅该主题并处理任何发布的更改。通常，监听这些更改的服务需要发布一个监听器（listener）来监控该主题。例如，一个课程（Course）微服务可能会监听\
    \ `CampusEvent` 主题并处理收到的任何更改。课程微服务会将收到的任何更改记录在自己的数据库中。\n\n**开发一种从源刷新复制数据的方法。**\
    \ 复制过程也存在缺陷。当这种情况发生时，数据的“副本”将不同步。在我们的示例中，如果由于原因丢失了事件，或者课程服务在记录更改时出错，那么课程服务中的园区信息副本将与\
    \ Campus 服务所拥的不符。由于所有代码都有缺陷，如果你在服务之间复制数据，这个问题就会发生。因此，支持开发人员需要一种方法在数据副本损坏时对其进行刷新。\n\
    \n## 微服务的打包选项\n\n在过去的几年里，在传统的 Web 应用程序部署中，某些组织在每个容器中部署多个 Web 应用是常见做法。这通常是由于商业容器的许可费用导致的，从而尽可能减少容器的数量。这种组合策略在微服务世界中是不存在的。微服务作为独立的进程部署，并运行在独立的\
    \ JVM 中。\n\n有多个产品可以方便将 Java 服务部署为单个进程。在本书期间，最流行的两个产品似乎是 Spring Boot 和 DropWizard。是的，还有其他产品，且它们运行良好，我专注于专注于写作时最流行的两个产品。\n\
    \n除了这两个产品之外，我还将讨论一种对微服务非常有用的虚拟化产品；它被称为 Docker。Docker 标准化了进程并提供了支持服务部署的工具。我们将看到\
    \ Docker 在解耦开发人员与运维方面发挥了巨大作用。\n\n## Spring Boot\n\nSpring Boot 将 Web 应用程序打包成单个可执行的\
    \ jar 文件，可以通过单个命令执行：`java -jar myFunction.jar`。\n\n该可部署的 jar 包包含一个嵌入式容器（Tomcat\
    \ 或 Jetty），并包含了运行你的应用程序所需的每个依赖类。\n\n除了你的服务之外，Spring Boot 还要求你创建一个实现 `main()` 方法的应用程序类，以便可以从命令行运行它。该应用程序类处理大多数配置项（连接池、线程数等）。此外，你还可以添加特定于应用程序的属性。Spring\
    \ Boot 使用类路径下的 `application.properties` 文件。\n\n"
