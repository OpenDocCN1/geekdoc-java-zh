    \ the system of record for a <business term>.\n\nAs an example, consider the Student\
    \ service defined in 2.1:\n\nThe Student service is the system of record for personal\
    \ information, such as their name, address, age, emergency contact and other information.\n\
    \nLet’s delve a little deeper into the example illustrated in 2.1. You might question\
