    # Preface


    Readers of the Java EE Architect''s Handbook, Second Edition are well acquainted
    with traditional application architectures. Since this book was published, microservices
    architecture has emerged. It is an important architecture with a variety of uses
    that Java architects should understand and be able to use.


    This book details microservices architecture and is an addendum to the Java EE
    Architect''s Handbook, Second Edition. This book will define microservices architecture
    and provide an overview of costs and benefits. As with the Architect''s Handbook,
    I will go on to address architecture, design, and implementation concerns specific
    to reader to microservices architecture.


    This book will take the reader to the point of producing a microservice. Beyond
    deployable, there''s the very interesting world of DevOps that addresses how to
    deploy, manage, and cluster microservice and connect it to the resources it needs
    to function. While this is a very interesting world and one I encourage you to
    take an interest in, it is out of scope for this book.


    # How this book is organized


    The first chapter defines microservices architecture and contrasts it with a layered
    web application architecture described in the Java EE Architect''s Handbook. I''ll
    summarize the benefits and costs of using microservices architecture. I''ll also
    discuss similarities and differences between microservices and service oriented
    architectures (SOA).


    The second chapter dives into design considerations for microservices. New paradigms
    have coding patterns, and microservices architecture is no exception. I''ll detail
    coding patterns to enhance performance and to increase resiliency to service failure.
    I''ll also discuss how to make microservices easier to support.


    The third chapter discusses cross-cutting concerns for microservices and various
    ways of incorporating them into services written in Java. I''ll discuss easy ways
    to package and deploy microservices as well as to instrument them for health checks
    and performance measurement.


    The fourth chapter discusses when using microservices architecture is appropriate.
    I also identify current marketing hype surrounding microservices architecture
    and the fine print required to reap the benefits from it. We''re going'
