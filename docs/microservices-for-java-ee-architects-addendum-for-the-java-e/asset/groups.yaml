    \ However, in a microservices architecture, that information is in separate data\n"
  mdcn: "\n这令人头疼；在执行复制时需要额外的编码和测试，而且这些复制可能会出现问题。缺陷往往是因为同一份数据的多个副本没有同步导致的。我选择从根本避免这个问题，即为每项信息只保留一个源，并在需要时通过额外的调用来获取它。\n\
    \n如果你选择复制策略，我建议使用发布/订阅模式（publish/subscribe）。也就是说，“拥有”业务数据的服务在持久化队列（persistent\
    \ queue）上发布信息变更的事实。任何对这些更改感兴趣的服务都订阅该队列，并在它们自己的数据库中记录必要的事件。\n\n在企业级应用中，我们非常推崇“事实记录且仅记录一次”。因此，发现某些站点有多个应用程序（有时是几十个）维护着相同的数据库数据并不罕见。对于这些组织来说，将架构重构到每个微服务都拥有自己的数据库的程度是一项艰巨的任务。但有一个折中方案。\n\
    \n如果你不能为每个微服务提供独立的数据库，至少要重构到：由一个且仅有一个服务负责更新、插入和删除每项数据项。这可以减少你在解决数据损坏 bug 时需要搜索的“大海针”。\n\
    \n**你不需要为每个微服务准备独立的物理数据库服务器/许可证。** 目标是消除数据库层面的耦合。使用独立的数据库模式（schemas）就足以实现这种程度的解耦。当然，重要的是不要在两个不同微服务使用的表之间创建任何引用完整性规则（例如外键约束），因为这是我们不希望看到的耦合。\n\
    \n# 第 2 章：微服务架构的设计考虑因素\n\n本章详细介绍了微服务架构的重要设计考虑因素。与任何技术范式一样，使用微服务架构也可能编写出过于复杂且难以维护的软件。本章将帮助你避免这种情况。\n\
    \n大多数实现微服务的人都使用 REST 风格的 Web 服务。在这里，我展示的所有示例都假设使用 RESTful Web 服务接口。需要注意的是，REST\
    \ 并不是实现微服务架构的必要条件；任何标准化接口都可以。大多数微服务架构之所以使用 REST，是因为它对资源（即“名词”）的依赖自然地契合微服务的边界。\n\
    \n# 服务边界\n\n微服务最重要的设计考虑因素是定义它的使命（mission）。也就是说，定义它必须履行的单一业务目的。处理这个主题有几种方法：一种是像识别\
    \ REST 服务资源一样来识别服务边界；另一种是从领域驱动设计（DDD）的角度来识别服务边界，并将你的领域模型精炼到足够具体的程度，以便在定义微服务时使用。两者之间，我通常按\
    \ REST 资源来思考。这是一种自然的契合，因为大多数用户倾向于将微服务实现为 RESTful 服务。\n\n# 定义微服务\n\n一个微服务的定义包含以下内容：\n\
    \n- 有意义的名称\n- 用业务术语编写的服务的业务功能\n- 支持该业务功能的 RESTful Web 服务资源或资源层级结构\n- 操作细节，例如：\n\
    \    - 请求参数\n    - 输入的 post 数据格式\n    - 输出数据格式\n- 保留的资源层级结构属性\n- 范围细节\n    - 关于哪些业务功能不受此服务管理的显式细节。\n\
    \n让我们来看一个例子。以学院或大学的“学生（Student）”业务概念为例。这些机构通常有记录学生详细信息的需求（例如：学生姓名、分配的学生标识符、出生日期、性别、地址、电子邮件、电话号码等）。还有涉及学生的更复杂的业务流程（例如：选课、维护成绩单、处理缴费等），但对于本示例，让我们仅限于维护学生的个人信息。这个服务示例在图\
    \ 2.1 中直观地展示。\n\n# 图 2.1：核心服务定义示例\n\n![](img/fc4ff849e7f45c45b878bf5b4a675ecf_26_0.png)\n\
