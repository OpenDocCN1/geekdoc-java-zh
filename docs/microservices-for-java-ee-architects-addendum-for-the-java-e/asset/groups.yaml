    point of view.


    Typically, the entire codebase shares database resources. This means that changes
    to that database potentially impact the entire application code base. Yes, we
    try to insulate the application from these changes by separating out data access
    layer, as discussed in the Java EE Architect''s Handbook, but that tactic isn''t
    always 100% effective. It''s not uncommon for database changes to require Entity
    class changes that potentially have effects on other layers.


    ## What is a Monolith?


    Typically, there are limits to how large and complex a code base can be before
    it starts to become unmaintainable. Applications that approach that point are
    called monoliths.


    Monoliths typically have long quality assurance / testing cycles for deployment.
    With monoliths, the feature set is so large that executing a full regression test
    uses a large amount of time. Yes, automated testing sequences shorten the process
    for development staff, but user QA testing often has a large manual component.


    With every change, monoliths often experience issues with unintended consequences.
    That is, you fix one issue and accidentally create new bugs as a result of that
    change. In this sense, fixing bugs in a monolith is like playing ‘whack-a-mole.’
    Yes, your automated unit tests and integration tests help to mitigate this, but
    that test harness is not 100% effective.


    Monoliths are typically married to their technical stack. That is, it''s much
    more difficult to upgrade or swap out a dependency in a monolith. For example,
    if the monolith uses the Hibernate ORM product for data access, it would be difficult
    to swap in a replacement ORM product (such as iBatis). Not only would use of MyBatis
    make code for the application internally inconsistent; the testing effort would
    be fairly large for something that really doesn''t directly add business value.


    Burn-in time for new developers is much longer on monoliths as there is so much
    to learn. The code base is usually very large and interconnected. The sheer size
    of it introduces a learning curve for new developers, regardless of the technical
    libraries and frameworks involved.


    As a corollary to this point, developers cannot be transferred easily from one
    application to another. That learning curve is specific to each monolith. This
    facet of monoliths creates management constraints to allocating resources and
    shifting priorities to meet any changes in business priorities.


    **Diagnosing memory and performance issues is often more difficult** on monoliths
    as the haystack (size of the code base) is typically much larger. Finding memory
    leaks can be one of the most frustrating and time-consuming activities developers
    go through. Furthermore, the tooling often doesn''t directly reveal the cause
    of the leak, so manual analysis is involved. With microservices architecture,
    at least the size of the code base that could be the culprit is much less, leading
    to quicker diagnosis for memory leaks and a quicker resolution.


    **QA test cycles for microservices, because they have a single functional purpose,
    are much shorter and more manageable.** Microservices are typically focused enough
    that components of their technical stack can easily be upgraded or swapped out
    without affecting consumers of the service. As the code base is typically much
    smaller, it is often easier to diagnose memory issues and performance issues localized
    to one service.


    ## Microservice Library Organization


    Microservice libraries are typically organized by business competency. That is,
    they organize by topics important to the business. Domain Driven Design (DDD)
    calls these topics **domains**. Domains are an analytical construct that essentially
    represents an independent model. DDD further breaks down domains into **sub-domains**,
    if needed, and by **bounded contexts**. Sub-domains are just a more detailed and
    specific domain. Bounded contexts represent physical constructs that make up a
    domain or sub-domain. You can think of a microservice as an example of a bounded
    context. For example, a domain breakdown for a college or university might look
    like Figure 1.3.


    Figure 1.3: Domain Example


    ## Domain-Oriented Architecture Sketch


    ![](img/fc4ff849e7f45c45b878bf5b4a675ecf_16_0.png)


    The other theoretical construct applicable to microservices architecture is Conway’s
    Law. Conway’s Law (1968) basically states that corporations build applications
    that follow their internal communication structure. Microservices architecture
    is is no exception. To paraphrase this concept, microservices follow the org chart.


    Microservices function by breaking large business problems into many smaller business
    problems. It’s easier to get an understanding of what a microservices architecture
    looks like by comparing it to traditional web application architecture, which
    you already know.


    ## The Benefits of Using Microservices Architecture


    Microservices reduce/eliminate technical stack lock-in. How many of us have seen
    it as an act of God to do a JDK version upgrade? As in a traditional world, it
    takes coordination from system administrators, and often other development teams,
    and it''s difficult. In a microservices world, it''s easy to have different services
    at different versions of the JDK; the service can get upgraded in isolation.


    The technical lock-in point goes even further than just version upgrades. In this
    world, services can choose different database platforms as they effectively ''own''
    them. One might use a nosql database like Cassandra, while another might stick
    to a relational db.


    That said, organizations get economies of scale with their available database
    choices. But and sometimes recoveries need to be performed. This takes technical
    expertise that most organizations centralize for economic reasons. Just because
    one of the barriers to making different choices has been removed, doesn''t mean
    that you should go crazy and have 50 different database platforms. From a management
    perspective, it''s important to place boundaries or guidelines on technology choices
    so that what''s created can be supported.


    Microservices architecture speeds delivery to market. That is, overall development
    production rates will increase using a microservices architecture. For example,
    at last report, Amazon''s deployment rate has been reported at 23,000 per day.
    Netflix''s deployment rate has been reported at 5,500 per day. To be fair, most
    organizations implementing microservices on a large scale implement DevOps and
    continuous delivery. It''s reasonable to expect that DevOps and continuous delivery
    also contributed to their deployment rates.


    The additional productivity depends on reduction in communication overhead for
    developers. That is, developers are able to be ''heads down'' and don''t need
    to coordinate their effort as much with others.


    In order to achieve that reduction in communication overhead, you must get good
    at contract management. That is, you need detailing the contract that will be
    implemented. Developers shouldn’t have to communicate with other teams regarding
    the interface; they should be able to be heads down.


    Each team is able to work independently without forced interaction from other
    teams. That is, they have their own development/deployment schedule.


    As an architect, most of your time will be spent in contract management; that
    is, detailing the contract specification in enough detail that developers can
    implement. The questions you get back from developers are feedback to the architect.
    If the number and scope of questions are minimal, the contract was adequately
    specified. If developers are confused, the contract specification needs work.


    You must be good at contract management. Contract management gives your development
    team independence and frees them from communication overhead. That contract specification
    can also be re-used as documentation of the service for consumers, which alleviates
    communication overhead for both producers and consumers. It’s reduction in communication
    overhead that provides the development velocity increase.


    Microservices provide resource staffing flexibility. Microservices development
    teams are small and focused. Developers *only* work on one service at a time.
    That service is supposed to have a firm contract that developers are coding to,
    preferably with containerized deliverables (i.e., Docker). The point is they’re
    mainly doing heads-down development. They shouldn’t be burdened (or have to be
    burdened) with communication overhead except with other developers working on
    that service.


    They are working as an independent team, completely asynchronously from all other
    service teams. Combined with the fact that they have low communication overhead
    and defined deliverables, they can be anywhere in the world in time zone. It doesn’t
    matter whether they are in-sourced in some corporate office nearby or somewhere
    off-shore.


