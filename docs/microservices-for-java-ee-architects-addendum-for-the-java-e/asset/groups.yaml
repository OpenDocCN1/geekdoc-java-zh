    \ 3.2. Developers will need access to a non-production implementation of your\
    \ microservice library for development, as well as non-production versions of\
    \ any required databases and other resources.\n\nFigure 3.2: Network Access for\
    \ Microservice Libraries\n\n## Microservice Security\n![](img/fc4ff849e7f45c45b878bf5b4a675ecf_82_0.png)\n\
    \n## User-Level Security\n\n## Network-Level and/or Service-Level Security\nThe\
    \ advantages to using network access security for your microservice library are\
    \ several: It's easy and comprehensive. There's absolutely no impact on the microservices\
    \ themselves or the packaging of them when you implement the security layer; and\
    \ this can be enhanced and changed without individually deployed microservices\
    \ in the smallest. Network access security takes no planning on the developer\
    \ side; however, there are some services that are more sensitive than others.\
    \ Examples I can think of of human resources (e.g., salaries and sensitive personal\
    \ information about employees) or medical records. Some services and data are\
    \ going to need an additional level of security.\n\nEstablish service level accounts\
    \ for services that need additional security. This is very similar to how database\
    \ data is usually secured. End user security credentials aren't used for database\
    \ connections; service accounts are established so we can utilize connection pooling.\
    \ Services are no different. Most microservices use OAUTH as they typically provide\
    \ a restful web interface. The mechanics of securing restful web services using\
    \ OAUTH are no different for microservices and won't be directly addressed in\
    \ this book.\n\nDon't provision microservice access directly to end users. End\
    \ user security for web applications shouldn't be any different now that they\
    \ are relying on a microservice library. End user credentials are often needed\
    \ to allow/restrict individual users from specific features of the application.\
    \ However, do not pass end user credentials onto your service library. That would\
    \ add an extreme level of complexity managing and would not provide any additional\
    \ benefits.\n\n## Contract Testing Procedures and Requirements\nScheduled and\
    \ automated contract testing procedures for microservice libraries are critical\
    \ for several reasons. This section will discuss these concerns.\n\nContinuous\
    \ integration for microservices is essential. Microservices architecture facilitates\
    \ higher development throughput. That means a higher frequency of production deployments\
    \ and less opportunity for manual testing. The implication here is that automated\
    \ contract testing for microservice libraries is essential. Without the safeguard\
    \ of continuous integration and the automated contract testing that comes with\
    \ it, you'll find defects migrated to production. Continuous integration is the\
    \ main safeguard against deploying defects to production. Unit testing for code\
    \ within microservices, while useful, isn't as effective as a safeguard in microservices\
    \ architecture.\n\nContinuous integration compensates for developer myopia. In\
    \ a world where developers work on one service at a time and increasingly relying\
    \ on service calls, they don't understand exactly what might break from a business\
    \ perspective should they deploy a defect. You might see this as a negative, but\
    \ it's purposely part of the paradigm to make developers more focused and productive.\n\
    \nContinuous integration allows individual microservices to be truly disposable.\
    \ In a world where services approach being ‘disposable’ – that is, it’s relatively\
    \ easy to scrap one version of a service and completely rewrite it – a new version\
    \ of a service needs to do exactly what the old one did. With a healthy automated\n"
