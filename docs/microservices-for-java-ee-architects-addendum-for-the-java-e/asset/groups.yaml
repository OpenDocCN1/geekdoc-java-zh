    提高支持团队的效率。随着微服务的实施使得部署单元的数量指数级增长，它也极大地增加了日志的数量和数据量。


    ## 为微服务开发并记录非功能性需求，并在企业范围内强制。无论特定的微服务选择了何种语言和工具，整个企业都需要能够利用该服务。这意味着能够部署它并监控其健康状况和资源消耗。


    微服务团队负责确保其服务满足所有非功能性需求。实际上，这意味着选择对组织而言是“新”的技术栈固然是带有“税收”的，因为它需要提供满足非功能性需求的能力。对于新的技术栈，企业内部可能不存在处理非功能性需求的策略，需要对其进行识别并可能进行开发。理想情况下，采用企业新技术的微服务团队应该以一种其他人可以复用到其他服务的方式开发这种能力。例如，如果一个企业采用了
    JRuby 框架并决定使用它编写微服务，则可能需要识别并建立整合健康检查、性能指标以及处理其他非功能性需求的能力。


    ## 健康检查 (Health Checks)


    健康检查通常是一个 URL，提供某种指示表明服务正在响应并能够履行其功能。该 URL 由某种监控工具（例如 Nagios）调用，如果健康检查失败，该工具能够向管理员发出报警。最简单的报警是微服务的
    JVM 未响应。问题随变为：你对“响应”的定义是什么？通常，仅响应 HTTP 200 是不够的。


    除了验证服务本身能够无错误地响应 URL 之外，我还喜欢检查对外部资源和依赖项的访问。例如，我喜欢检查数据库连接池的健康状况。是的，数据库和其他外部资源也应该通过独立的健康检查进行监控，但检查用于数据库访问的连接池的健康状况，也可以验证连接池的大小对于服务当前处理的事务量是否合适。这种检查只能在微服务进程内部执行，无法从外部进行有效监控。这种情况在传统的
    Web 应用程序中也会发生，对于微服务来说并不新奇。


    无论你编写的微服务使用了何种技术栈，健康检查都应该是企业提供的应用程序架构的一部分。没有理由服务生产者不构建自己的检查。我通常利用 Dropweaver 指标库来编写健康检查代码。


    寻找此类健康检查代码级示例的人可以在此处找到。此示例检查连接池，以验证等待数据库连接的事务数少于一个可配置数字（默认为三）。也就是说，如果有太多的事务等待数据库连接，那么该服务就是健康的，因为消费者正遭受性能问题。在这种情况下，连接池可能需要根据服务处理的负载重新调整大小。此外，我还会验证池中的连接，以确保不仅数据库是用的，而且服务与数据库之间的网络连通性也是可用的。


    ## 性能指标与报警 (Performance Metrics and Alerts)


    性能指标有助于开发者调查性能问题。我会跟踪性能指标，对于传统的 Web 应用程序也包括应用中每个页面的性能。在收到关于性能缓慢的模糊报告时，如果有历史数据，那么确切知道当前性能与历史性能相比处于什么水平是非常有用的。更重要的是，它还能加速性能调查。


    在微服务架构下，用户操作可能涉及多个服务。定位性能问题（即确定是哪些服务导致了该性能问题）会变成一个耗费时间的问题。掌握所有服务的性能数据将极大地节省开发者的时间。


    传统 Web 应用程序的性能更容易衡量。通常，性能指标是在 URL/网页级别收集的。用于收集传统 Web 应用程序单个页面/URL 性能指标的工具非常胜许多。我使用
    Admin4J，但也有其他产品选择。


    对于 RESTful Web 服务，性能测量稍微困难一些，因为 URL 包含标识符，且行为随操作（GET, POST, DELETE 等）而不同。详细来说，对于
    RESTful Web 服务，按严格的 URL 进行衡量没有意义，因为 URL 包含数据标识符。例如，分别衡量 URL /students/1 和 students/2
    的 GET 操作是没有意义的。它们是相同的查询，只是针对不同的学生。如果对整个通配符 /students/* 进行合并测量效果会更好。如果你的服务提供了返回相关项的选项，这会变得更加困难。例如，如果服务支持
    /students/1/classes，那么课程搜索结果的行为将与学生搜索结果不同，对它们进行区分是有用的。Admin4J 会合并 RESTful Web
    调用的性能指标；在我写这些时，我还没有发现其他能实现此点的产品。


    至少，要衡量每个服务的平均调用时间和总调用次数。由于大多数微服务架构项目拥有大量的部署单元，了解调用次数可以让你集中精力对最频繁使用的的服务进行调优。平均调用时间有助于在用户操作涉及多个服务时定位性能问题。虽然我习惯于拥有调用时间的最小值、最大值和标准差，以及平均值和总数，但这些信息的用性较小，可以视为可选的。


    为超过可配置阈值的服务时间设置自动报警。这允许开发者在用户报告之前开始主动诊断并修复性能问题。为每个服务确定一个合理的阈值将涉及某种程度的尝试。阈值过低会产生虚假报警，或者产生并非指示实质性性能问题的报警。


    ## 资源消耗报警与响应 (Resource Consumption Alerts and Responses)


    JVM 内部存在一些资源消耗问题实际上是服务问题，它们本应该发生。


    监控部署服务的内存使用情况。当你查看 JVM 分配的内存时，进程级别的聚合内存并不是相关的，因为测量包含了未使用的原生内存。最相关的是 JVM 内部的消耗和可用内存。我使用
    Admin4J 监控内存使用并发布报警，但也有其他可用工具。

