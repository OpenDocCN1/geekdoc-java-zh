    \n# Chapter 2: Design Considerations for Microservices Architecture\n\nThis chapter\
    \ details important design considerations for microservices architecture. As with\
    \ any technology paradigm, it's possible to write overly complicated and difficult-to-support\
    \ software using microservices architecture. This chapter will help you avoid\
    \ that.\n\nMost people implementing microservices do using REST-style web services.\
    \ Here, all examples I present will assume a RESTful web service interface. It\
