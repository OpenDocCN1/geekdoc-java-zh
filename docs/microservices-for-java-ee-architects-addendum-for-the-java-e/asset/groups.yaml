    \ think in terms of REST resources. It's a natural fit as most users tend to implement\
    \ microservices as RESTful services.\n\n## Defining a Microservice\n\nA microservice\
    \ definition contains the following:\n\n- Meaningful name\n- Business function\
    \ of the service written in business terms\n- RESTful web service resource or\
    \ resource hierarchy supporting the business function\n- Operation details such\
    \ as\n    - request parameters\n    - input post data format\n    - output data\
    \ format\n- Attributes retained about the resource hierarchy\n- Scope details\n\
    \    - Explicit detail as to what business functions are not managed by this service.\n\
    \nLet's work through an example. Take the business concept of “Student” for a\
    \ college or university. Those institutions commonly have a need to record specifics\
    \ about students (i.e., student name, assigned student identifier, birth date,\
    \ sex, addresses, email address, phone numbers, etc.). There are more complicated\
