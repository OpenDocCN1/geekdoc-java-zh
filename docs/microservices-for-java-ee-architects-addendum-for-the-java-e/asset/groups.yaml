    图 1.3：领域示例


    ## 领域导向架构图


    ![](img/fc4ff849e7f45c45b878bf5b4a675ecf_16_0.png)


    另一个适用于微服务架构的理论构件是康威法则（Conway’s Law）。康威法则（1968年）基本上表示，企业构建的应用遵循其内部的通信结构。微服务架构也不例外。换句话说这个概念，微服务遵循组织架构图。


    微服务通过将庞大的业务问题拆分为许多较小的业务问题来运作。通过将其与已经熟悉的传统的 Web 应用架构进行比较，更容易理解微服务架构的样貌。


    ## 使用微服务架构的好处


    微服务减少/消除了技术栈锁定。我们有多少人曾将 JDK 版本升级看作是一场“上天之过”？在传统世界中，这需要系统管理员以及其他开发团队的协调，而且非常困难。在微服务世界中，让不同的服务运行不同版本的
    JDK 是很容易的；服务可以独立地进行升级。


    技术锁定点甚至比版本升级更深远。在这个世界里，服务可以选择不同的数据库平台，因为它们实际上“拥有”这些平台。一个可能使用像 Cassandra 这样的 NoSQL
    数据库，而另一个可能坚持使用关系型数据库。


    尽管如此，组织在可选的数据库选择中获得了规模效应。但有时需要执行恢复工作。这需要技术专家，大多数组织出于经济考虑会将这些专家集中管理。仅仅因为一个做出不同选择的障碍之一被移除了，并不意味着你应该疯狂地拥有
    50 个不同的数据库平台。从管理的角度来看，对技术选择设定边界或准则是重要的，以确保所创建的内容是可以支持的。


    微服务架构加速了交付到市场。也就是说，使用微服务架构，整体开发生产率将提高。例如，根据上份的报告，Amazon 的部署率报告为每天 23,000 次。Netflix
    的部署率报告为每天 5,500 次。公平地说，大多数大规模实施微服务的组织都实施了 DevOps 和持续交付。可以预计 DevOps 和持续交付也贡献了这些部署率。


    额外的生产力取决于通信开销的减少。也就是说，开发者能够“埋头工作”，而不需要与他人进行大量的协调。


    为了实现这种通信开销的减少，你必须精通合同管理。也就是说，你需要详细说明将要实现的合同。开发者不需要就接口与其他团队进行通信；他们应该能够独立工作。


    每个团队都能独立工作，而没有强制性的团队交互。也就是说，他们有自己的开发/部署计划。


    作为架构师，你的大部分时间将花在合同管理上；即详细说明规范，以便开发者实施。开发者提出的问题是对架构师的反馈。如果问题数量和范围很小，说明规范到位。如果开发者感到困惑，说明规范需要改进。


    你必须精通合同管理。合同管理赋予了开发团队独立性，并让他们摆了通信开销。该合同规范也可以作为服务的文档复用，从而减轻双方的通信开销。正是通信开销的减少提供了开发速度的提升。


