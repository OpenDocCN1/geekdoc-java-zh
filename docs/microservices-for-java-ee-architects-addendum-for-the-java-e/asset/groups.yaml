    ACCEPT is really only about the expected format. Version specification implies
    possible behavior differences in operations besides GET. Listings 2.7a and 2.7b
    are examples of versioning by header.


    # Listing 2.7a: Header Versioning Example


    ```

    URL: https://university.edu/services/Students/12345

    ACCEPT-VERSION: 1.0

    ACCEPT: application/json

    ```


