    # The Benefits of Using Microservices Architecture


    Microservices reduce/eliminate technical stack lock-in. How many of us have seen
    it as an act of God to do a JDK version upgrade? As in a traditional world, it
    takes coordination from system administrators, and often other development teams,
    and it''s difficult. In a microservices world, it''s easy to have different services
    at different versions of the JDK; the service can get upgraded in isolation.


    The technical lock-in point goes even further than just version upgrades. In this
    world, services can choose different database platforms as they effectively ''own''
    them. One might use a nosql database like Cassandra, while another might stick
    to a relational db.


    That said, organizations get economies of scale with their available database
    choices. But and sometimes recoveries need to be performed. This takes technical
    expertise that most organizations centralize for economic reasons. Just because
    one of the barriers to making different choices has been removed, doesn''t mean
    that you should go crazy and have 50 different database platforms. From a management
    perspective, it''s important to place boundaries or guidelines on technology choices
    so that what''s created can be supported.


    Microservices architecture speeds delivery to market. That is, overall development
    production rates will increase using a microservices architecture. For example,
    at last report, Amazon''s deployment rate has been reported at 23,000 per day.
    Netflix''s deployment rate has been reported at 5,500 per day. To be fair, most
    organizations implementing microservices on a large scale implement continuous
    delivery and DevOps. It''s reasonable to expect that DevOps and continuous delivery
    implementations at Amazon and Netflix also contributed to their high deployment
    rates.


    The additional productivity depends on reduction in communication overhead for
    developers. That is, developers are able to be ''heads down'' in development mode
    and don''t need to coordinate their effort as much with others.


    In order to achieve that reduction in communication overhead, you must get'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'good at contract management. That is, you need to be good at explicitly detailing
    the contract that will be implemented and the behavior that those service operations
    will implement. Developers shouldn’t have to communicate with other teams regarding
    the interface; they should be able to be heads down.


    Each team is able to work independently without forced interaction from other
    teams. That is, they have their own development/deployment schedule.


    As an architect, most of your time will be spent in contract management; that
    is, detailing the contract specification in enough detail that developers can
    implement. The questions you get back from developers are feedback to the architect.
    If the number and scope of questions are minimal, the contract was adequately
    specified. If developers are confused, the contract specification needs work.


    You must be good at contract management. Contract management gives your development
    team independence and frees them from communication overhead. That contract specification
    can also be re-used as documentation of the service for consumers, which alleviates
    communication overhead for both producers and consumers. It’s reduction in communication
    overhead that provides the development velocity increase.


    Developers should only be assigned to one and only one service at a time. It reduces
    context switching time for developers and increases velocity.


    Microservices provide resource staffing flexibility. Microservices development
    teams are small and focused. Developers *only* work on one service at a time.
    That service is supposed to have a firm contract that developers are coding to,
    preferably with containerized deliverables (i.e., Docker). The point is they’re
    mainly doing heads-down development. They shouldn’t be burdened (or have to be
    burdened) with communication overhead except with other developers working on
    that service.


    They are working as an independent team, completely asynchronously from all other
    service teams. Combined with the fact that they have low communication overhead
    and defined deliverables, they can be anywhere in the world in time zone. It doesn’t
    matter whether they are in-sourced in some corporate office nearby or somewhere
    off-shore.


    Given that the work of the team is confined to the focused requirements for the'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'service, worries about code quality, etc. are at least contained to the small
    service source code base. In other words, there''s a limit to how much code that
    team can mess up and thus create maintenance issues.


    > Note: Development for microservices can more easily be outsourced!


    This also means that you''re better insulated from rogue developers. We''ve managed
    developers who produce unmaintainable code; but with microservices, rogue developers
    are confined to one small and focused code base, so there''s a limit to how much
    damage they can do. Furthermore, if that base is small, focused, and well-defined,
    it''s more replaceable if need be. You''re not letting rogue developers loose
    in a 500K line monolithic application to cause havoc on a wider scale.


    # Microservices provide better availability and resiliency (if implemented well)


    Microservice dependencies force developers to build in fault tolerance and make
    failure a first class citizen in design and development. Faults and outages are,
    by definition, localized to identifiable components. We''re going to learn that
    the ability to horizontally scale individual services allows you to decrease outage
    time.


    # The Disadvantages of Using Microservices Architecture


    Microservices can be harder to manage if not designed well. We''re going to see
    enterprise architecture and contract management is critical. Without that, the
    benefits of adopting microservices will be eroded significantly. We''re going
    to see that adopting a DevOps culture is a prerequisite for implementing microservices
    on a large scale. Often, organizations that also adopted continuous delivery.
    Bottom line: implementing microservices is a paradigm shift for management as
    well as developers and architects.


    Microservice implementations are more complex. Yes, each individual microservice
    is easier for developers to work with as it is small and focused. However, in
    a microservices world, there are many more moving parts. This makes delivering
    business functionality, which may involve multiple microservices, much more difficult
    to design and manage. Moreover, that complexity makes defects more difficult to
    diagnose and performance problems more difficult to investigate.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'Microservice implementations will cause complete chaos if contracts aren''t
    designed well. I''ll present some advice on designing microservice contracts later
    in the book. With badly designed contracts, developers spend much more time consuming
    services and with support activities. This time erodes your development velocity
    and negatively impacts the benefits of adopting microservices to begin with. From
    a management perspective, consider contract management specialized labor. Some
    architects are better at it than others.


    It''s worth noting that moving to a microservice architecture requires your organization
    have DevOps capabilities among other things. I provide an overview of these prerequisites
    in Chapter Five in the section entitled "Prerequisites for Microservice Architecture
    Adoption."


    # Microservices Architecture Compared to SOA


    Many ask: "Isn''t microservices architecture simply a re-branded SOA?" The answer
    is "yes" for the most part. Keep in mind that SOA suffers from the same definitional
    malady that microservices do, in SOA doesn''t have a concrete definition. SOA
    means different things to different people.


    They are similar in many ways except the complexity of queues/pipes. SOA often
    has very complicated plumbing for moving data around in queues. Often Mule or
    Camel flows used to transform, copy, or re-order data in transit and to accommodate
    for any formatting differences as that data is moved from service to service.


    In a microservices world, process services (which we''ll learn are complex services
    that rely on other services to function) effectively coordinate delivering complex
    business functionality. The role of orchestration is delegated to process services
    and not Mule or Camel flows.


    Microservices architecture uses dumb pipes and smart endpoints. Microservices
    uses queues, but without any transformations you might find in a Service Oriented
    Architecture (SOA) world. Generally, there are no complex flows (e.g. Mule or
    Camel) with formatting, filtering, or sequencing changes to message data being
    transmitted from service to service. Think of the electrical supply of your stereo
    system as an example of such a pipe. Electricity is either on or off, with nothing
    in between. A ‘pipe’ doesn''t get much simpler than that, with absolutely no intelligence
    in the pipe itself.'
