    performance metrics, as performance for each page in the application, for traditional
    web applications as well. In receiving vague reports of slow performance, it''s
    useful to know exactly where performance currently is when compared to performance
    history, if you have it. More importantly, it also speeds up performance investigations.


    With microservices architecture, user actions can involve multiple services. Localizing
    a performance problem (i.e., determining which service(s) are contributing to
    that performance problem) becomes a time-consuming issue. Having that performance
    data for all services in hand greatly supports the developer''s time.


