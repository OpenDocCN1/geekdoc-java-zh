  md: '# Chapter 1: Microservices Defined


    The microservices architecture doesn''t have a concrete definition. Microservices
    architecture organizes applications as a suite of discrete, independent services.
    Usually, these web services adopt a RESTful style. Any coupling between services
    is restricted to the service layer, with no coupling at a code or database level.
    The approach does some similarities to the Service Oriented Architecture SOA approach,
    which will be discussed later. We define it as a series of common traits that
    ''microservices'' have.


    **Microservices have a single functional purpose.** That is, they have a single
    business purpose. They do only one thing and to well. To level set, the term ''functional''
    is borrowed from the term ''functional requirement.'' **Functional requirements
    are typically business requirements;** support doing business directly in some
    way. In essence, the term ''functional'' and ''business'' can be used interchangeably.


    As a byproduct of having a single functional purpose, most business changes affect
    a small number of services (preferably only one service). In fact, we''re going
    to see that it''s a warning sign that your microservices are not well defined
    if single feature change requires a large number of service deployments.


    As a byproduct of microservices having a single functional purpose, microservices
    tend to be smaller and more focused. This is a byproduct of microservices architecture
    as the code base is typically much smaller than with web applications. We''re
    going to discover that a smaller code base isn''t a goal of microservices architecture
    directly, but rather it is a byproduct of having such a targeted business focus.


    Furthermore, the single functional purpose of a microservice should be self-contained
    and autonomous. It represents a complete unit of work that can be executed in
    any context as its inputs are correct and its resources available. My use of the
    phrase ''unit of work'' should not be taken to imply a single database transaction.
    We will learn that a functional unit of work in fact consist of several service
    calls, each of which has separate database transactions. Said another way, it
    doesn''t make any assumptions about what services have been called before it and
    what''s to be called after it.


    All microservices have non-functional cross-cutting concerns, such as providing'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'health checks, exception handling/logging, and performance metrics. These concerns
    are separate from the functional purpose of the service. Also, these items should
    be provided by the application architecture and re-used from service to service
    organization wide. I will show you how services are written using Java.


    # Microservices have a standard technology-agnostic interface. Most use RESTful
    web services, but other standard interfaces work as long as they are technology
    agnostic (i.e., it doesn''t matter if the service was written in Java, .Net, or
    anything else). SOAP services are technology-agnostic and fit this requirement.


    Technology agnostic interfaces are needed to preserve the tech stack independence
    benefit for microservices. It should not matter if a particular microservice is
    written in Java, .Net, Go, Php, Python, or anything else. We''re going to learn
    that technology agnostism makes it easier to migrate to newer technologies or
    versions of existing technologies, and that it means much less lock-in for your
    technical stack.


    The implications are that Java EJB or RMI services don''t qualify as a microservice
    interface as they are Java-specific. Remember that one of the objectives of microservices
    architecture is freedom to switch technical stacks. Yes, that means potentially
    writing microservices with development platforms other than Java.


    Microservices run in an independent process. In a Java world, that means they
    run as an independent JVM. With traditional applications, it''s not uncommon to
    deploy several web applications into the same container; but that doesn''t happen
    for microservices. They need to be independent so they can scale to their individual
    needs. For example, one service might only need a three-node cluster to satisfy
    consumer demand while another service might need more nodes in the cluster and
    need to be hosted differently than other services.


    Microservices also run in an independent process so they can be independently
    deployed or replaced without affecting other services. Your stereo system is a
    good analogy, even though it''s more hardware than software. When I replaced my
    speakers, none of the other components (e.g., receiver, monitor, Blu-ray player,
    etc.) were affected in any way. As long as their inputs and resources were'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'correct, they did their job. The same was true when I replaced my receiver.
    Microservices should have the same level of independence and self-sufficiency.


    Another analogy that people use to describe microservices is the Linux operating
    system and its extremely componentized utilities. Yes, Linux uses standard input/output
    instead of web services, but it''s still a standardized interface. A good example
    is the ls utility. It lists directory entries. Yes, it has many options, such
    as filtering or the format of its output, but it has one and only one job.


    **Microservices are often combined to provide full functionality needed by applications.**
    As microservices have such a narrow focus, no single microservice can provide
    all the functionality needed for most applications. In fact, we''re going to see
    that it''s common for microservices to rely on other microservices to fulfill
    their service contract. Figure 1.1 graphically describes how microservices are
    leveraged to provide full application functionality. The arrows in the diagram
    represent call usage patterns.


    Figure 1.1: Microservice Architecture'
  merge: -1
