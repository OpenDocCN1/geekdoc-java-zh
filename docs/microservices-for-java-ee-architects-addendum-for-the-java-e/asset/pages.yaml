    consumer of a service.


    # Breaking vs. non-breaking changes


    **A breaking change is one that causes existing service calls to error out.**
    Breaking changes forces consumers to change code to avoid errors. Yes, you can
    mitigate the effect of this by adopting a deprecation strategy (which I will discuss
    later), but still, you force change. By definition, forced change is going to
    get prioritized above most other tasks for the consuming application team and
    will likely usurp other feature enhancements that are supported on work. From
    the consuming team''s perspective, that change comes out of the blue and isn''t
    as easily manageable as scheduling feature enhancements.


    Not all changes are breaking changes. If a service call requesting information
    about a topic suddenly returns a few additional items of information, this should
    be a non-breaking change. It''s non-breaking because consumers shouldn''t pay
    any attention to the additional information provided since they don''t have the
    logic to process it. Should they make a decision to process those additional information
    items, they can enhance their service on their own schedule. In fact, they might
    not need the additional items of information to enhance their service at all.


    **As a service publisher, your civic duty is to introduce a breaking change only
    as a last resort.** Only introduce breaking changes if absolutely nothing else
    is possible. This can happen despite despite the best of intentions. It could
    be that a dependent service introduced a breaking change, thus forcing a reaction.
