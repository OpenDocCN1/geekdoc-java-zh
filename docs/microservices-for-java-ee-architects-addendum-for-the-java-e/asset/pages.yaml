  md: '# Chapter 3: Cross-cutting Concerns for Microservices


    This chapter deals with numerous cross-cutting non-functional concerns that all
    microservices must address, regardless of which technical stack they employ. These
    cross-cutting concerns include being able to effectively monitor services, detect
    failure, and diagnose and fix reported defects. Satisfying non-functional requirements
    make it possible for operations staff to support microservices architecture once
    it is deployed to production. Some of these requirements exist for traditional
    web applications, but become more imperative with microservices as the number
    of deployments increases exponentially.


    There are non-functional requirements that all microservices should meet, regardless
    of which technical platform or language they employ. Typically, these non-functional
    requirements are also cross-cutting concerns. That is, they are not specific to
    the business functionality they provide; they exist to make deployed services
    more supportable. As architects, we should establish reusable and easily implementable
    ways of satisfying non-functional requirements. This chapter will detail what
    those requirements are and provide options for easily satisfying them. Microservices
    should have the following to make them easier to support:


    +   - health checks (typically by URL)

    - performance metrics and alerts

    - resource consumption alerts

    - logging and error handling

    - deployment formats (e.g., Docker image).


    All of these non-functional requirements should be a part of the application architecture.
    Individual service teams should not have to ''develop'' tooling to satisfy any
    of these requirements. Install and configure, yes. Develop, no.


    One of the advantages of writing microservices using Java, or at least one of
    the interpreted languages running on the Java Virtual Machine, is the ease with
    which functionality to address non-functional requirements needed by all microservices
    can be written and merely consumed by those services. This architecture is all
    allowing developers to concentrate on the functionality they are providing instead
    of getting bogged down by technology and infrastructure support concerns.'
