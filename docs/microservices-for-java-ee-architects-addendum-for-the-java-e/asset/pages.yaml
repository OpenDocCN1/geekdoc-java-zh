    # ## Posting Change Events


    Given that each microservice has its own database, there are two options for accommodating
    common business data that is needed by several services. (I highlighted this issue
    earlier.) The first option, which I prefer, is not to duplicate common data but
    rather to call the service responsible for maintaining that data when it''s needed.
    The second option is to ''copy'' common business data to all services instead
    of nesting service calls, copies are generally accomplished using publishing/subscribe
    messaging.


    The microservice responsible for maintaining common business data would publish
    any change (e.g., add, change, or delete) under an established topic in a consistent
    format. For example, a service responsible for maintaining campus information
    (e.g., a Campus microservice) at a university might publish the addition of a
    new campus or a change in status for an existing campus under the topic CampusEvent.


    Any interested services would listen on that topic and process any published changes.
    Typically, services listening for those changes would need to publish a listener
    to monitor that topic. For example, a Course microservice might listen to the
    CampusEvent topic and process any changes received. The Course microservice would
    record any changes received in its own database.


    Develop a way to refresh copied data from its source. Copy processes can have
    defects too. When that happens, a ''copy'' of data will become out of sync. In
    our example, the Course service copy of campus information won''t match what the
    Campus service has if an event is somehow missed or the recording of a change
    errors out in the Course service. As all code has defects, this issue will happen
    if you copy data between services. For that reason, support developers need a
    way to refresh a data copy if it gets corrupted.


