    # Common Enterprise Code for Microservices


    A question I''m frequently asked is if there can be common code between services.
    The answer is a qualified ‘yes.’ The bottom line is that you version common code
    and treat it the same as you treat third-party products like Hibernate or Apache
    Commons Lang. Individual services decide when/if to upgrade.


