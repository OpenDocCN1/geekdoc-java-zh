    service that ''owns'' the business data publishes the fact that a piece of information
    changes on a persistent queue. Any service interested in those changes subscribes
    to that queue and records the necessary events in its own database.


    In corporate America, we''ve really been into recording a fact once and only once.
    Consequently, it''s not uncommon to find sites that have multiple applications,
