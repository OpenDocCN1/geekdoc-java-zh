    +   - Apache HttpClient (https://hc.apache.org/)

    - Apache CXF (https://cxf.apache.org/)

    - Docker (https://www.docker.com/)

    - Spring Boot (https://projects.spring.io/spring-boot/)

    - Dropwizard (http://www.dropwizard.io/)

    - Hystrix (https://github.com/Netflix/Hystrix)

    - SoapUI (http://www.soapui.org/)

    - Google Guava Core Libraries (https://code.google.com/p/guava-libraries/)

    - Apache Commons Lang (http://commons.apache.org/lang/)

    - My GitHub (https://github.com/Derek-Ashmore)


    Another open-source project on which this book relies is Moneta, which is an open-source
    example of a microservice written in Java. Moneta illustrates several of the concepts
    discussed in the book.


    # Feedback


    I''m always interested in reading comments and suggestions that will improve future
    editions of this book. Please send feedback directly to me at derek.ashmore@dvtconsulting.com.
    If your comment or suggestion is the first of its kind and is used in the next
    edition, I will gladly send you a copy of my next book. Additionally, reader questions
    are sometimes selected and answered in entries in my blog http://www.derekashmore.com/'
