  md: '# Traditional Layered Application Architecture

    (a.k.a. Monolith)


    | Presentation Layer – User Interface |

    | Servlets, Controllers, Managed Beans | HTML, JSPs, Template Markup |

    | Business Logic Layer |

    | Data Access Object (DAO) Layer |

    | | Application Database(s) |


    These layers are meant to be deployed and tested as a cohesive unit (typically
    as war or ear file). While it may be possible to use portions of the code base
    outside of the application, that''s more the exception than the rule.


    The application scales as a unit. It''s not unusual for applications to have features
    with different audiences. For example, it''s not uncommon to have administrative
    features that only a few people use vs. more mainstream features that may be used
    by hundreds or thousands of users. Traditional architectures must scale the administrative
    function along with other popular features as they are in the same deployable.
    For those not familiar with the term, a deployable is a runnable version of an
    application (e.g., a war or ear file).


    As a corollary to this idea, defects tend to spill over into unrelated features.
    For example, if one feature has a defect that monopolizes your database connection
    pool and makes the container inoperative, all other unrelated features in that
    application are also inoperative, even though they are unrelated from a business'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'point of view.


    Typically, the entire codebase shares database resources. This means that changes
    to that database potentially impact the entire application code base. Yes, we
    try to insulate the application from these changes by separating out data access
    layer, as discussed in the Java EE Architect''s Handbook, but that tactic isn''t
    always 100% effective. It''s not uncommon for database changes to require Entity
    class changes that potentially have effects on other layers.


    # What is a Monolith?


    Typically, there are limits to how large and complex a code base can be before
    it starts to become unmaintainable. Applications that approach that point are
    called monoliths.


    Monoliths typically have long quality assurance / testing cycles for deployment.
    With monoliths, the feature set is so large that executing a full regression test
    users a large amount of time. Yes, automated testing sequences shorten the process
    for development staff, but user QA testing often has a large manual component.


    With every change, monoliths often experience issues with unintended consequences.
    That is, you fix one issue and accidentally create new bugs as a result of that
    change. In this sense, fixing bugs in a monolith is like playing ‘whack-a-mole.
    ’ Yes, your automated unit tests and integration tests help to mitigate this,
    but that test harness is not 100% effective.


    Monoliths are typically married to their technical stack. That is, it''s much
    more difficult to upgrade or swap out a dependency in a monolith. For example,
    if the monolith uses the Hibernate ORM product for data access, it would be difficult
    to swap in a replacement ORM product (such as iBatis). Not only would use of MyBatis
    make code for the application internally inconsistent; the testing effort would
    be fairly large for something that really doesn''t directly add business value.


    Burn-in time for new developers is much longer on monoliths as there is so much
    to learn. The code base is usually very large and interconnected. The sheer size
    of it introduces a learning curve for new developers, regardless of the technical
    libraries and frameworks involved.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'As a corollary to this point, developers cannot be transferred easily from
    one application to another. That learning curve is specific to each monolith.
    This facet of monoliths creates management constraints to allocating resources
    and shifting priorities to meet any changes in business priorities.


    **Diagnosing memory and performance issues is often more difficult** on monoliths
    as the haystack (size of the code base) is typically much larger. Finding memory
    leaks can be one of the most frustrating and time-consuming activities developers
    go through. Furthermore, the tooling often doesn''t directly reveal the cause
    the leak, so manual analysis is involved. With microservices architecture, at
    least the size of the code base that could be the culprit is much less, leading
    to quicker diagnosis for memory leaks and a quicker resolution.


    **QA test cycles for microservices, because they have a single functional purpose,
    are much shorter and more manageable.** Microservices are typically focused enough
    that components of their technical stack can easily be upgraded or swapped out
    without affecting consumers of the service. As the code base is typically much
    smaller, it is often easier to diagnose memory issues and performance issues localized
    to one service.


    # Microservice Library Organization


    Microservice libraries are typically organized by business competency. That is,
    they organize by topics important to the business. Domain Driven Design (DDD)
    calls these topics **domains**. Domains are an analytical construct that essentially
    represents an independent model. DDD further breaks down domains into **sub-domains**,
    if needed, and by **bounded contexts**. Sub-domains are just a more detailed and
    specific domain. Bounded contexts represent physical constructs that make up a
    domain or sub-domain. You can think of a microservice as an example of a bounded
    context. For example, a domain breakdown for a college or university might look
    like Figure 1.3.


    Figure 1.3: Domain Example'
  merge: -1
