  md: 'Those with the good fortune to live in pluralistic Western-style democracies,
    rooted in classical culture, should recognize how rare such open societies have
    been through history, and how much the vitality of these societies is threatened
    today. Historically, democracy has been like a flame that shines bright for a
    while—as in Greece and Rome—and then succumbs to autocracy or ossifies into hierarchy.24


    # # The Values Proposition


    “Civilizations are fragile, impermanent things,” wrote the historian Joseph Tainter.25
    Amidst our civilization’s long period of success and stability, we may not recognize
    that things are shifting dangerously until it’s too late.26 We are no more prepared
    for a regression to a less enlightened, less mobile society than the citizens
    of ancient Rome were prepared for the collapse of their empire.


    A civilization can survive only if its members, especially those with the greatest
    influence, believe in its basic values. Today our key institutions—the academy,
    the media, the corporate hierarchy, and even some churches—reject many of the
    fundamental ideals that have long defined Western culture.27 Activists on both
    left and right, instead of emphasizing what binds a democratic society together,
    have focused on narrow identity politics that cannot sustain a pluralistic democracy.28


    A loss of faith in the basic values of our society is particularly marked among
    the young; nearly 40 percent of young Americans think the country lacks “history
    to be proved of.” Far fewer place a great emphasis on family, religion, or patriotism
    in previous generations. Europe is, if anything, moving faster toward cultural
    deconstruction by anathematizing its own heritage.29 The “Paris Statement” put
    forward in 2017 by a group of scholars from several European countries, titled
    “A Europe We Can Believe In,” says that the EU bureaucracy is invested in an “ersatz
    religious enterprise” based on postmodernism and the rejection of a distinct,
    historical culture in favor of multiculturalism.30


    Given the high-level commitment to cultural deconstruction in Western societies,
    it isn’t surprising that we are seeing decreasing cultural literacy and a greatly
    reduced interest in history among the young.31 Maybe we'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'won’t quite serve a reprise of the early Middle Ages, when “the very mind of
