    The concentration of wealth is also clear in property ownership. In the United
    States, the proportion of land owned by the one hundred largest landowners grew
    by nearly 50 percent between 2007 and 2017, according to the *Land Report*. In
    2007, this group owned a total of 27 million acres of land, equivalent to the
    area of Maine and New Hampshire combined; a decade later, the one hundred largest
    landowners held 40.2 million acres, more than the entire area of New England.¹⁵
    In of the American West, billionaires have created vast estates that many will
    make the rest of the local population land-poor.¹⁶


    Landownership in Europe too is becoming more concentrated in fewer hands. In Great
    Britain, land prices rise dramatically over the past decade, less than 1 percent
    of the population owns half of all the land. On the continent, farmland is being
    consolidated into larger holdings, while urban real estate has been falling into
    the hands of a small number of corporate owners and the mega-wealthy.¹⁷


    In the United States, long seen as the great land of opportunity, the chance of
    middle-class earners moving up to the top ranks of the earnings ladder has dropped
    by approximately 20 percent since the early 1980s.¹⁸ Across the thirty-six wealthiest
    countries of the Organization for Economic Cooperation and Development, the richest
    citizens have taken an ever greater share of national GDP, and the middle class
