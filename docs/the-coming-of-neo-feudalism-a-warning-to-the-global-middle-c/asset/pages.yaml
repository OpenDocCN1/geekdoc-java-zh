  md: '# Peasant Rebellions


    The feudal order did not go unchallenged in the Middle Ages: periodically there
    were peasant uprisings, sometimes led by religious dissidents. Could we see a
    kind of uprising from within the Third Estate today? The modern yeomanry can still
    mount a resistance, but the expanding “serf” class, without property or a stake
    in the system, might prove far dangerous to the dominant orders.


    Like the revolutionaries of 1789, many in today''s Third Estate are disgusted
    by the hauteur and hypocrisy of the upper classes. In prerevolutionary times,
    French aristocrats and top clergy preached Christian charity while indulging in
    gluttony, sexual adventurism and lavish spending. Today, many in the struggling
    middle and working classes see the well-to-do displaying their environmental piety
    by paying “green” indulgence through carbon credits and other virtue-signaling
    devices, while these “enlightened” policies impose extraordinarily high energy
    and housing costs on the less off.^34 Alienated elements of the middle and working
    classes are responding with what might be likened to a modern peasants’ rebellion.
    It can be seen in a series of angry votes and protests against the policies championed
    by the clergy and oligarchy—on climate change, global trade, and migration. This
    anger was expressed in the election of President Trump, in the support for Brexit,
    and in the rise of populist parties across Europe.35


    Perhaps nowhere the rebellion is more evident than in France: a clear majority
    of French people regard globalization as a threat, while most executives, many
    trained at elite schools, see it as an “opportunity.”36 In an echo of 1789, the
    so-called gilets jaunes (yellow vests) demonstrated against higher gas taxes in
    the winter of 2018–19. The protests began in small towns, but then moved into
    the Parisian suburbs.^37


    In the United States, restlessness among the Third Estate has prompted discussion
    among the oligarchs and the clergy about expanding the scope of the welfare state,
    with subsidies and direct cash payments for the masses, in the hope of staying
    off rebellion by those who no longer see a possibility of improving their own
    lot. But what will be enough?38'
