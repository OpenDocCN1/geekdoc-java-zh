    lifting small property owners as the English yeomanry. Commercial growth empowered
    the innovative, aggressive, risk-taking entrepreneurs. New technology, expanding
    trade, new ideas, and developing institutions transformed feudal society beyond
    recognition. Where class privilege remained in place particularly in France, the
    Third Estate rose up in a violent assault on the last vestiges of feudalism.


