  md: '# CHAPTER 2

    nThe Enduring Allure of Feudalism


    Modern thinking tends to cast the Middle Ages as a benighted and backward time,
    although some historians regard that common perception as exaggerated and unfair.
    By the same token, feudalism is widely seen as a retrograde form of social and
    political organization, but it developed for a reason, to fill pressing needs
    of the time. As Roman governance dissolved, it left a power vacuum. Slowly, a
    new elite grew, and a new system of power relations would last in some form for
    a millennium or more in some places.¹ Its persistence suggests that some version
    of feudalism could still have an appeal in modern times.


    Feudalism in the Middle Ages varied from one place to another, but everywhere
    it centered on a distinct social hierarchy, the submission of inferiors to superiors,
    and restricted mobility for the lower classes—the vast majority of the population.
    Property was mostly consolidated into large manors. The urban middle classes dwindled
