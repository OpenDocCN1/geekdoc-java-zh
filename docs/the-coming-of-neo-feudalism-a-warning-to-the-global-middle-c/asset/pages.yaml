  md: '# CHAPTER 21

    Can We Challenge Neo-feudalism?


    The hope that we see a global convergence toward democracy, was once predicted
    by Francis Fukuyama and Thomas Friedman among others, seems increasingly remote.
    As China has grown both richer and more powerful, it has not become more like
    us, but instead has developed an authoritarian form of state capitalism.¹ Globally,
    democratic governance appears to have peaked in 2006, and many countries—including
    Turkey, Russia, and China—have become far more authoritarian. Even democratic
    India and many European countries have seen their own constitutional order frayed
    by internal dissension and racial and religious divisions.


    China’s “civilization state,” deeply rooted in thousands of years of history,
    represents the most profound philosophical challenge to liberal values since the
    era of the Cold War.³ Jorgen Randers, a professor emeritus of climate strategy
    at the BI Norwegian Business School, predicts a Chinese-dominated global future,
    despite the country’s many environmental and other challenges. “Western nations
    are not going to collapse, but the smooth operation and friendly nature of Western
    society will disappear, because inequity is going to explode,”² Randers argues.
    “Democratic, liberal society will fail, with stronger governments like China will
    be the winners.”⁴


    Even without the Chinese challenge, Western countries are already seeing more
    economic centralization, albeit in private hands. Over the past'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'few decades, a small group of oligarchs, like Warren Buffett, have made vast
    fortunes by buying businesses with little competition as a way to ensure monopoly
    profits.5 More important still, the technological elite, highly adept at manipulating
    the tax code for their own benefit, continue to consolidate power in critical
    market sectors, making themselves into overlords more influential and powerful
    than most governments.5


    # The Importance of the Third Estate


    How can those who believe in liberal democracy respond to the challenge of a rising
    oligarchy and clergy? The nascent “peasant rebellions” in North America and Europe
    generally lack a coherent program to challenge the power of the dominant elites.
    All too often, they resort to a primitive nativism and cultural nostalgia that
    have little place in a twenty-firstcentury democracy.7


    The key to resisting neo-feudalism today lies in the kind of people who brought
    the first version to an end: the leftist sociologist Barrington Moore described
    as “a numerous and politically vigorous class of town dwellers..8 In other words,
    people who tend to own some property, and often their own business, and who build
    communities around the needs of their families. In the late eighteenth century,
    such people joined with independent peasants to challenge the hereditary aristocracy
    and the ecclesiastical hierarchy. Later on, the working classes successfully restrained
    the predatory power and disproportionate wealth accumulation of monopoly capitalists
    in the Gilded Age.


    What is needed today is a new kind of politics that focuses primarily on fulfilling
    the aspirations of the Third Estate—on expanding opportunities for the middle
    and working classes. The current emphasis on social justice through redistribution
    and subsidies does not increase opportunities for upward mobility, but instead
    fosters dependency while consolidating power in a few hands.9


    # Off with Their Heads?'
