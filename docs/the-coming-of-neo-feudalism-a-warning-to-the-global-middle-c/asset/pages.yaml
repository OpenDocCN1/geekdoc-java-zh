  md: '# Is a Feudal Future Inevitable?


    The return to feudalism is not necessarily inexorable. To change the course we
    are on, we first need to understand and acknowledge what is happening. We possess
    the advantages brought by centuries of liberal capitalism and free intellectual
    inquiry; we have knowledge of the past feudal era, and of what democratic capitalism
    achieved. We do not have to be like the proverbial frog slowly boiling, unaware
    of its fate.


    Reversing the slide into a neo-feudal order will require the development of a
    new political paradigm. The current “progressive” approach to “social justice,”
    with its attachment to a powerful central government, will only strengthen the
    clerisy by vesting more authority in the “expert” class. On the other hand, the
    devotees of market fundamentalism, refusing to acknowledge the dangers of oligarchic
    power and the harm done to the middle and working classes, might further a political
    trajectory that threatens the viability of capitalism itself. Some prominent business
    executives now recognize the problem and seek ways to remedy it, but there is
    much less awareness or concern among market ideologues on the right.


    A new perspective is needed, but it can emerge only when the reality of an emergent
    neo-feudalism is widely acknowledged and its dangers understood. There is still
    time to challenge this threat to liberal values. “A man may be led by fate,” wrote
    the great Soviet novelist Vasily Grossman, “but he can refuse to follow.”⁴⁰ The
    future course of history is never inevitable if we retain the will to shape it.'
