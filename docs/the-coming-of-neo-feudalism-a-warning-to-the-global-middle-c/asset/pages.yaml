  md: '# PREFACE


    This is a book neither of the right nor of the left. It is an attempt to diagnose
    trends that are leading to a more hierarchical and more stagnant society. It also
    stands as a warning to the global middle class. Although this die may be cast,
    I hope the book will stir discussion and spark action to halt the current trajectory
    toward neo-feudalism across much of the world.


    As a lifetime Democrat, now Independent, I do not see this as an ideological or
    partisan issue. I believe that the vast majority of people, conservative as well
    as progressive, do not look forward to a future defined by class immobility and
    immense concentrations of both wealth and power. This is a global phenomenon that
    includes not just the United States but also the United Kingdom, Australia, Canada,
    most of continental Europe, and the rapidly advancing countries of East Asia.


    Reporting from the ground—particularly in the United States, Australia, the UK,
    Singapore, India, and China—have done much to shape this book. But I have taken
    inspiration also from thinking about what the great analysts of the past—Alexis
    de Tocqueville, Karl Marx, Max Weber, Daniel Bell, Taichi Sakaiya, Alvin Toffler—would
    have made of the current situation.


    The future that appears on the horizon is not one that I desire for any country,
    or for my own children. This book is meant to rally those who cherish the independence,
    freedom, and possibilities for upward mobility that have been the hallmarks of
    liberal democracy over the past few centuries.'
