    creating what Roderick Seidenberg called “post-historic man,” cut off from the
    traditions and values of our civilational past.³² If one doesn’t know the foundational
    principles of our democracy, including individual freedom and open discussion,
    is not likely to recognize when they are lost. Regaining a sense of pride in Western
    culture and its achievements—while remaining open to newcomers and influences
    from elsewhere—is essential to recover the ambition and self-confidence that drove
    the West’s ascent, from the Age of Exploration to the Space Age.³³³


    Some scholars believe that Japan now provides a model for high-income countries
    that can dispense with growth and instead focus on spiritual or quality-of-life
    issues. Japan will not conquer the world, one observer suggests, but it could
    settle into something like an Asian Switzerland with a rapidly aging population.³⁴


    Similarly, the neo-feudal order would replace a place on upward mobility and family
    with a desire for a comfortable, subsidized life, indulging in the digital mind-sinks
    that keeps the masses in their metaphorical basements.³⁵ Already, roughly half
    of all Americans support the idea of a guaranteed basic income of about $2,000
    a month if robots put them out of work.³⁶ universal basic income enjoys even stronger
    support in most European countries, particularly among young people.³⁷


    To slow or reverse neo-feudalism, with its constraints on upward mobility and
    creation of more dependency, requires awakening the political will of the Third
    Estate to resist it. “The happy nation whose people have not forgotten how to
    rebel,” wrote the British historian R. H. Tawney.³³⁸ Whether we can muster the
    resolve to assert our place as engaged citizens will determine the kind of world
    our children inherit.'
