    # The Rebellion We Need


    To date, opposition to the neo-feudal order has all too often morphed into hatred
    of minorities, such as immigrants, Jews, and Muslims, and belief that the society
    is threatened by migrants from different cultures.20 Given the demographic trends
    not only in Europe but also in North America and Oceania, a xenophobic agenda
    is likely to be counterproductive, and is incompatible with a liberal society
    that can successfully integrate newcomers into the national culture.


    Great societies are by nature expansive


    Just as diverse peoples found much to emulate Roman civilization, the liberal
    institutions that developed in the West appeal to people from radically different
    backgrounds. These institutions and their underpinning ideals are not tied to
    any set of racial characteristics. Chinese, Muslims, and Latin immigrants migrate
    mostly to countries that have embraced the values of citizenship, tolerance, and
    the rule of law.22 China under the autocratic Xi Jinping may “the Chinese dream,”
    but the number of immigrants from China living in the United States has doubled
    between 2000 and 2018, reaching nearly 2.5 million. Similar patterns have been
    seen in both Canada and Australia. There is little such movement to China or most
    other Asian countries.23'
