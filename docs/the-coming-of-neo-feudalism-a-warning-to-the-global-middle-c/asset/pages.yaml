    because of high housing costs, and “looks increasingly like a boat in rocky waters'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'the OECD.19 Rates of homeownership are stagnant or plummeting in the high-income
    world, including the United States, Canada, and Australia.20


    Globalization of the economy has served the interests of the upper classes but
    not the rest. For example, the shift of production to China alone has cost well
    over a half million manufacturing jobs from Great Britain, once an industrial
    powerhouse, and an estimated 3.4 million jobs from the United States.21 Economists
    may point to better aggregate growth and lower prices for consumers, but most
    people do not live in the “aggregate.” They live in their individual reality,
    which in many cases have gotten better than the economy has improved.


    In a world growing more bifurcated, elite communities are surrounded by urban
    poor and by small towns that are fading and becoming destitute. Globalization
    “has revived the citadels of medieval France,” writes Christophe Guillaud, a leftist
    geographer.22 Like the castle towns of Japan or the walled cities of medieval
    Italy, a few locales are enclaves of privilege, while the less appealing places
    are inhabited by the newly servile classes.23


    # The New Power Nexus


    Just as the clerical elite power with the nobility in the feudal era, a nexus
    between the clergy and the oligarchy lies at the core of neo-feudalism. These
    classes often attend the same schools and live in similar neighborhoods such as
    New York, San Francisco, or London. On the whole, they share a common worldview
    and are allies on most issues, though there were occasional conflicts, as were
    between the medieval nobility and clergy. Certainly, they hold similar views on
    globalism, cosmopolitism, the value of credentials, and the authority of experts.


    This power is enabled by technologies that once were widely seen as holding great
    promise for grassroots democracy and decision making, but have become tools for
    surveillance and a consolidation of power. Even as blogs proliferate, giving the
    appearance of information democracy, a small group of companies—mostly based on
    the West Coast of the United States—exercise tightening control over the flow
    of information and the shape of'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'the culture. Our new overlords do not wear chain mail or top hats, but instead
    direct our future in jeans and hoodies.24 These technocratic elites are the twenty-first-century
    realization of what Daniel Bell prophetically labeled “a new priesthood of power”25
    based on scientific expertise.


    The future of politics, in the high-income countries at least, will revolve around
    the ability of the dominating to secure the submission of the Third Estate. In
    the Middle Ages, this requires imposing an orthodoxy that can normalize and justify
    a rigid class structure. The power of the nobility in the feudal order was justified
    through the agencies of religion and custom, blessed by the church. The modern
    clergy often claim science as the basis of their doctrines and tout academic credentials
    as the key to status and authority. They seek to replace the bourgeois values
    of self-determination, family, community, and nation with “progressive” ideas
    about globalism, environmental sustainability, defined gender roles, and the authority
    of experts. These values are inculcated through the clerisy’s dominance over the
    institutions of higher learning and media, aided by the oligarchy’s control of
    information technology and the channels of culture.


    # Losing Faith in Liberal Democracy


    One consequence of the current trends is growing pessimism throughout the high-income
    world. Half of all Europeans believe that future generations will suffer worse
    economic conditions than they did, according to the Pew Research Center. In France,
    the pessimistic view preominates by seven to one. A pessimistic trend is also
    marked in the usually more upbeat societies of Australia (64 percent), Canada
    (67 percent), and the United States (57 percent). Overall, Pew found that 56 percent
    of residents in advanced economies believe their children will do worse than they
    did.26


    Pessimism is also growing in East Asia, which has the economic dynamo of the current
    era. In Japan, a full three-quarters of those polled expect things to be worse
    for the next generation, and that expectation also preominates in such successful
    countries as Taiwan, Singapore, and South Korea.27 Many people in China have reason
    for pessimism: in 2017, eight million college graduates entered the job market
    to find they could'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'only earn salaries that they might have gotten by going to work in a factory
    straight out of high school.28


    Another sign of pessimism is declining birth rates, particularly in the high-income
    countries. In Europe as well as Japan, and even in the once relatively fecund
    United States, fertility rates are nearing historic lows, even though women state
    a wish to have more children.29 This demographic stagnation, another throwback
    to the Middle Ages, has various explanations, including women''s high levels of
    participation in the workforce and a desire for more leisure time. Other reasons
    are economic, including a shortage of affordable housing. Liberal capitalism in
    the heyday built large stretches of affordable housing for the upward mobile middle
    and working classes, but the new feudalism is creating a world where fewer and
    fewer people can afford to own homes.30 A trend of diminishing expectations has
    weakened support for liberal capitalism even in solidly democratic countries,
    particularly among younger people.31 Far more than older generations, they are
    losing faith in democracy, not in the United States but in Sweden, Australia,
    Great Britain, the Netherlands, and New Zealand. People born in the 1970s and
    1980s are less opposed to suchdemocratic assertions of power as a military coup
    than those are born in the 1930s, 1940s, and 1950s.32


    Today there is a turning away from democratic liberalism around the world. Authoritarian
    leaders are consolidating power in countries that previously appeared to be on
    a liberalizing path—Xi Jinping in China, Vladimir Putin in Russia, Recep Tayyip
    Erdoğan in Turkey. In democratic countries, we can see a new longing for a strongman—such
    as the bombastic and crude Donald Trump, as well as equivalents in Europe, some
    of them more functionally authoritarian. Many people who are losing faith in the
    prospects of liberty look for a paternalistic protector instead. Authoritarian
    leaders often rise by evoking the imagined glories of the past and stoking resentsments
    both old and new. At the end of the Cold War, the world seemed to be traveling
    on a natural “arc” to a more democratic future, but today’s new world order has
    instead become a promising springtime for dictators.33'
