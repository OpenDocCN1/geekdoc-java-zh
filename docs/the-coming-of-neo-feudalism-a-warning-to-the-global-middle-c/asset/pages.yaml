  md: 'Today''s oligarchs are the people who have benefited most from free markets,
    protection of property rights, and the meritocratic ideal. But their arrogance
    and greed could provoke a backlash against their privilege. Consider the public
    outrage over the recent college admissions scandal in the United States, with
    Hollywood and business elites cheating, bribing officials, and falsifying records
    to get their unqualified children into top colleges.¹10


    Yet the oligarchy could be undermining the basis of their own good fortune. Much
    of the oligarchic class is allied with militant progressives whose basic agenda
    is hostile to classical liberalism and capitalist enterprise.¹1 This is similar
    to what happened in the run-up to the French Revolution, when many French aristocrats
    not only lived dissolute lives but supported writers polemics ended up threatening
    "their rights and even their existence," as Tocqueville noted.¹12


    Up to now, policies advocated by the progressive left have come mostly at the
    expense of the lower and middle classes.¹13 But the new breed of progressives
    are growing bolder and coming to resemble the Jacobins of the French Revolution,
    or the Red Guards unleashed during the Cultural Revolution in China in the late
    1960s.¹14 In the future, young activists may not tolerate the oligarchy''s excesses
    as did earlier generations of environmental campaigners. After all, if the world
    is on the verge of a global apocalypse, and also suffering levels of inequality,
    how can the luxurious lifestyles of many of the world''s most green advocates—from
    Prince Charles and Richard Branson to DiCaprio and Al Gore—be acceptable? The
    environmental left may well turn against billionaires who lament climate change
    but fly their private jets to discuss the "crisis" in places like Davos.¹15


    The activists who are melding environmentalist green with socialist red do not
    distinguish between good billionaires and bad ones. Some, like Bernie Sanders,
    believe that billionaires should not exist at all. The red-green contingent generally
    agrees with the view of Barry Commoner, a founding father of environmentalism,
    "Capitalism is the earth''s number one every time."¹16


    Over time, fashionably left-leaning oligarchs may discover that their apparent
    political allies and even their employees are rebelling against them. While oligarchs
    give heavy financial backing to Democrats, some'
