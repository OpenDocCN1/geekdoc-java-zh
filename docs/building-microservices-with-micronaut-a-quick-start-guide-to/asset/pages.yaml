- img_proc: true
  md: '7. LaunchRequestHandler. LaunchRequestHandler is the first intent code that
    is triggered whenever a skill is launched.


    We discussed this in the Your HelloWorld Alexa skill section.


    8. @Singleton annotation. To change any Alexa Java handler to work with Micronaut,
    all we need to do is to add the @Singleton annotation, which is java.inject.Singleton
    annotation.


    9. We discussed this in the Integrating Micronaut with Alexa section.


    # Chapter 11


    +   1. The following are a few factors to consider when architecting microservices
    the following:


    +   * Does your team know about microservices?

    * Is your business mature enough to adopt microservices?

    * Do you have an Agile DevOps practice and infrastructure?

    * Do you have a scalable on-premise or cloud infrastructure?

    * Do you have support to use modern tools and technology?

    * Is your database ready to be decentralized?

    * Do you have support from all the stakeholders?


    We discussed this in the Architecting enterprise microservices section.


    +   2. These are some design patterns:

    * Decomposition by business capability

    * Decomposition by domain/sub-domains

    * The API Gateway pattern

    * The chained microservices pattern

    * Database per service

    * The command query responsibility segregation pattern

    * The service discovery pattern

    * The circuit breaker pattern

    * The log aggregation pattern'
  merge: -1
  pgno: 343
- img_proc: true
  md: 'We discussed this in the *Design* section.


    +   3. The following are a few factors to consider during the design phase of
    microservices:


    +   - Design patterns

    - Security

    - Authentication strategy

    - Security rules

    - Privilege-based access

    - OAuth and SSL

    - Privacy-specific standards such as HIPPA, GDPR, and PIPEDA

    - Encryption at rest and in transit

    - A data retention strategy and log archival strategy

    - Local country regulations

    - Technology currency/versions


    We discussed this in the *Design* section.


    +   4. The following are a few factors should you consider during the development
    phase of microservices:


    +   - Always use the latest stable and supported version for development

    - Leverage automation testing

    - Test at various levels such as unit testing, service testing, and integration
    testing

    - Use mocking and spying concepts during testing

    - Emulate a real-world environment using containers or cloud infrastructure

    - Synchronize development, QA, UAT, and PROD environments

    - During development, think about backward compatibility for the microservice

    - Have a separate database for each microservice to achieve the fullest potential


    We discussed this in the *Develop* section.


    +   5. The following are a few tools that are used in the deployment phase:


    +   - Containers

    - Virtual machines'
  merge: -1
