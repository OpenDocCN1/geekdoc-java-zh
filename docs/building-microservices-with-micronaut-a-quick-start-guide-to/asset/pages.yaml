  md: '# Event streaming with the Apache Kafka ecosystem


    Apache Kafka is an industry-leading event streaming system. In the Apache Kafka
    ecosystem, the following are some of the key components:


    +   - Event topic: An event topic consists of a stream of immutable, ordered messages
    belonging to a particular category. Each event topic may have one or more partitions.
    A partition is indexed storage that supports multi-concurrency in Apache. Apache
    Kafka keeps at least one partition per topic and may add more partitions (at the
    time of topic creation) or required. When a new message is published to the topic,
    Apache Kafka decides which topic will be used to append the message. Each topic
    append matches the most recent message at the end. This is shown in the following
    diagram:


    ![](img/768b67b9430f02ca52f7bb252e4a68e4_169_0.png)


    Figure 5.3 – Apache Kafka anatomy


    As shown in the preceding diagram, when a new message is published to the steam,
    it is appended at the end. Event consumers can freely choose which offset to read.
    While **Consumer 1** reads at the first offset, **Consumer 2** reads from the
    sixth offset.


    +   - Event broker: An event broker is a façade that provides an interface to
    write or read from topic(s). Apache Kafka usually has the leader and follower
    brokers. The leader broker (for a topic) will serve all the requests. If a leader
    broker fails, then the follower broker chimes in as leader.


    +   - Kafka cluster: If Apache Kafka has a quorum consisting of more than one
    event broker, then it''s called a cluster. In a cluster, each broker will usually
    lead a distinct topic and may substitute as a follower for other topics.


    +   - Event producer: Producers publish an event message to the topic stream.
    A producer interacts with the Apache Kafka ecosystem to know which broker should
    be used for writing an event message to a topic stream. If a broker fails or a
    new broker is added, Apache Kafka notifies the required producers of this.'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# Event streaming with the Apache Kafka ecosystem


    +   - **Event consumer:** A consumer reads the event messages from the topic stream.
    An event consumer will interact with the Apache Kafka ecosystem to know which
    broker should be used to read from a topic stream. Furthermore, Apache Kafka keeps
    track of the topic offset for each event consumer to resume event consumption.


    +   - **Zookeeper:** Zookeeper maintains the metadata quorum for the Apache Kafka
    ecosystem. It essentially maintains information about all brokers for event producers
    and consumers. It also keeps track of the topic offset for each event consumer.


    The preceding diagram, we can see the various components in the Apache Kafka ecosystem
    and how they interact with each other in event streaming:


    ![](img/768b67b9430f02ca52f7bb252e4a68e4_170_0.png)


    Figure 5.4 - Apache Kafka ecosystem


    In the preceding diagram, the Apache Kafka ecosystem is shown at a glance. For
    each event topic, there will be at least one event broker and one or more follower
    event brokers. Information about leaders and followers is maintained in Zookeeper.
    When an event producer pushes a message, a broker will write the message to the
    required topic stream. Similarly, when an event consumer pulls a message, an event
    broker will fetch the message from the required topic stream. Zookeeper maintains
    the offset information for each topic for all the event consumers.


    In the next section, we will dive into how to use the Apache Kafka ecosystem for
    event streaming in the pet clinic application.'
