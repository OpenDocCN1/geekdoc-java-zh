    # Technical requirements


    All the commands and technical instructions in this chapter can be run on Windows
    10 and Mac OS X. The code examples in this chapter are available in this book''s
    GitHub repository at https://github.com/PacktPublishing/Building-Microservices-with-Micronaut/tree/master/Chapter11/micronaut-petclinic.


    The following tools need to be installed and set up in your development environment:


    +   - Java SDK: Version 8 or older (we used Java 13).

    - Maven: This is optional and only required if you would like to use Maven as
    your build system. However, we recommend having Maven set up on any development
    machine. The instructions for downloading and installing Maven can be found at
    https://maven.apache.org/download.cgi.

    - Development IDE: Based on your preference, any Java-based IDE can be used, but
    in this chapter, IntelliJ is used.

    - Git: The instructions for downloading and installing Git can be found at https://git-scm.com/downloads.

    - PostgreSQL: The instructions for downloading and installing PostgreSQL can be
    found at https://www.postgresql.org/download/.

    - MongoDB: MongoDB Atlas provides a free online Database-as-a-Service and up to
    512 MB of storage. However, if you would prefer to use a local database, the instructions
    for downloading and installing MongoDB can be found at https://docs.mongodb.com/manual/administration/install-community/.
    We used a local installation while writing this chapter.'
