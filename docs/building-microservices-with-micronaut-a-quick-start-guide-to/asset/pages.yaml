  md: '# # Externalizing the application configuration


    Irrespective of the size and complexities of a microservice application, the task
    of maintaining the configuration settings for each service seems one of the most
    crucial aspects of working with microservices. Decoupling the service configurations
    goes back to our earlier discussion on separating the concerns. In the earlier
    chapters, we have seen how we can handle service configurations using the application.properties
    files. Though this is a step up from not hard-coding these configurations in production
    code, it''s not enough.


    One of the requirements for any microservice is agility. An ideal microservice
    should be flexible and rapid in addressing any change in the user''s requirements,
    as well as handling code defects or network issues. Having said that, each enterprise
    application needs to meet the specific demands of compliance and auditing, which
    implies that a developer often can''t just deploy code artifact from their workspace
    directly to a production environment. If the configurations are decoupled from
    code logic then we can easily build the artifact (without configurations) and
    deploy it to many environments (where each environment can bootstrap its own configurations).


    In the next section, we will dive into how we can manage distributed service configurations
    in the Micronaut framework.


    # ## Using distributed configuration management to externalize the configuration


    Micronaut has out-of-the-box features for distributed configuration management.
    It has built-in support and integration with HashiCorp''s Consul. Though Consul
    is a service delivery tool, it also has the capability to store application properties.
    In the following section, we will use Consul key-value store for managing configurations
    for the pet-owner microservice.


    # ## Implementing a configuration store in Consul


    We will use a Dockerized instance. Work through the following instructions for
    installing and running Consul in Docker:


    +   1. Make sure the Docker application is running in your workspace/environment.
    Then open a bash terminal (I used Git Bash) and run the following command:


    ```

    docker run -d --name consul -p 8500:8500 consul

    ```


    +   2. Wait for Docker to download and install Consul.'
  merge: -1
  pgno: 214
- img_proc: true
  md: 'The preceding command will kick-start a single-node Consul instance and expose
    it on port 8500. We can verify the installation by accessing the Consul web interface
    at http://localhost:8500.


    Now, to create a configuration store in Consul, follow these instructions:


    +   Open the Consul web interface at http://localhost:8500/ and select **Key/Value**
    from the top header.


    +   Click on the **Create** button.


    +   Type config/pet-owner/application.yml in the **Key** or **folder** input box.


