- img_proc: true
  md: '# # Distributed Logging, Tracing, and Monitoring


    A microservice application often runs multiple microservices on a varied range
    of multiple hosts. For upstream consumers, the API gateway provides a one-stop-shop
    interface to access to all the application endpoints. Any request to the API gateway
    is dispersed to one or more microservices. This distributed diffusion of request
    handling escalates challenges in maintaining microservices-based applications.
    If any anomaly or error occurs, it is hard to dig which microservice or distributed
    component is at fault. In addition, any effective microservices implementation
    must handle the maintenance challenges proactively.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '236 Distributed Logging, Tracing, and Monitoring


    In this chapter, we will explore the following topics:


    +   - **Distributed logging**: How can we implement the log aggregation for distributed
    microservices so that application logs can be accessed and indexed in one place?

    - **Distributed tracing**: How can we trace the execution of a user request that
    could be dispersed onto multiple microservices running on multiple environments?

    - **Distributed monitoring**: How can we continuously monitor the key performance
    indicators for all the service components to get a holistic picture of the system''s
    health?


    By collecting these three kinds of data – logging, tracing, and monitoring – we
    enhance our system observability. By accessing this telemetry data at any point
    in time, we intuitively and precisely get a complete context of what and how a
    request was executed in the system. To learn more about observability, we will
    explore the microservices patterns on distributed logging, tracing, and monitoring
    with the hands-on **pet-clinic application.


    By the end of this chapter, you will have good knowledge of implementing these
    observability patterns in the Micronaut framework.


    # Technical requirements


    All the commands and technical instructions in this chapter are run on Windows
    10 and macOS. Code examples covered in this chapter are available in the book’s
    GitHub repository at https://github.com/PacktPublishing/Building-Microservices-with-Micronaut/tree/master/Chapter09.


    The following tools need to be installed and set up in the development environment:


    +   - **Java SDK**: Version 13 or above (we use Java 14).

    - **Maven**: This is optional and only required if you would like to use Maven
    as the build system. However, we recommend having Maven set up on any development
    machine. Instructions to download and install Maven can be found at https://maven.apache.org/download.cgi.

    - **Development IDE**: Based on your preferences, any Java-based IDE can be used,
    for the purpose of writing this chapter, IntelliJ was.

    - **Git**: Instructions to download and install Git can be found at https://git-scm.com/downloads.'
