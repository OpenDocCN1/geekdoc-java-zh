  md: "# Configuring MongoDB in Micronaut\n\nIn the freshly pet-clinic-reviews project,\
    \ we would need to update the URI in application.yml to point to the correct instance\
    \ of MongoDB. Furthermore, we will define two new custom properties - databaseName\
    \ and collectionName:\n\n```\nmicronaut:\n  application:\n    name: Pet Clinic\
    \ Reviews\nmongodb:\n  uri: mongodb://mongodb:mongodb@@localhost:27017/pet-clinic-reviews\n\
    \  databaseName: pet-clinic-reviews\n  collectionName: vet-reviews\n```\n\nTo\
    \ use the aforementioned database and collection across the project, we can define\
    \ a configuration class in a new package - com.packpub.micronaut.config:\n\n```\n\
    public class MongoConfiguration {\n\n  @Value(\"${mongodb.databaseName}\")\n \
    \ private String databaseName;\n\n  @Value(\"${mongodb.collectionName}\")\n  private\
