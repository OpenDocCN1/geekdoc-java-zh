  md: "# 100 Working on RESTful Web Services\n\nWe can assume a hypothetical FooException\
    \ that can be raised by a microservice:\n\n```\npublic class FooException extends\
    \ RuntimeException {\n  ...\n}\n```\n\nFooException extends RuntimeException,\
    \ which makes it an unchecked exception, and we can create FooExceptionHandler\
    \ to handle this exception:\n\n```\n@Produces\n@Singleton\n@Requires(classes =\
    \ {FooException.class, ExceptionHandler.class})\npublic class FooExceptionHandler\
    \ implements ExceptionHandler<FooException, HttpResponse> {\n  @Override\n  public\
    \ HttpResponse handle(HttpRequest request, FooException exception) {\n    JsonError\
    \ error = new JsonError(exception.getMessage());\n    error.path('/' + exception.getArgument().getName());\\\
    n    error.link(Link.SELF, Link.of(request.getUri()));\nn    return HttpResponse.status(HttpStatus.INTERNAL_SERVER_ERROR).body(error);\n\
    \  }\n}\n```\n\nThe FooExceptionHandler bean injection mandates the required injection\
    \ of FooException and ExceptionHandler. At any place within the code base, if\
    \ FooException is raised, it will be caught by FooExceptionHandler and a HttpStatus.INTERNAL_SERVER_ERROR\
    \ response will be returned.\n\n# Versioning the APIs\n\nMicronaut supports API\
    \ versioning using the @Version annotation. This annotation can be used at the\
    \ controller or method level."
