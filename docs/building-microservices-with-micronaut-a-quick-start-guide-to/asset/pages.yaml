  md: '# Technical requirements


    All the commands and technical instructions in this chapter are run on Windows
    10 and macOS. Code examples covered in this chapter are available in the book''s
    GitHub repository at https://github.com/PacktPublishing/Building-Microservices-with-Micronaut/tree/Chapter02.


    The following tools need to be installed and set up in the development environment:


    +   * Java SDK: Version 13 or above (we used Java 14).

    * Maven: This is optional and only required if you would like to use Maven as
    the build system. However, we recommend Maven set up on any development machine.
    Instructions to download and install Maven can be found at https://maven.apache.org/download.cgi.

    * Development IDE: Based on your preferences, any Java-based-IDE can be used for
    the purpose of writing this chapter. IntelliJ was used.

    * Git: Instructions to download and install Git can be found at https://git-scm.com/downloads.

    * PostgreSQL: Instructions to download and install PostgreSQL can be found at
    https://www.postgresql.org/download/.

    * MongoDB: MongoDB Atlas provides a free online database-as-a-service with up
