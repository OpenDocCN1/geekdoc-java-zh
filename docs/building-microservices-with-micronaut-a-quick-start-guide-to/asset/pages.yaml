    # Working on RESTful microservices in the Micronaut framework


    In order to dive into the security aspects of the Micronaut framework, we will
    continue working on the pet-clinic application. The following table summarizes
    the changes we will be making to secure each of the microservices in the application:


    | Microservice name | Authentication strategy | Identity provider |

    | --- | --- | --- |

    | pet-owner | Session | Local |

    | pet-clinic | JWT | Keycloak |

    | pet-clinic-reviews | OAuth | Cloud SaaS identity provider (Okta) |


    Table 4.1 - Securing the microservices in the pet-clinic application


    To secure the desired endpoints in the microservices, we will focus on the following
    two key aspects:


    +   * **Identity provider**: Essentially, an identity provider owns the concerns
    regarding storing and maintaining digital identities. Furthermore, it resolves
    any security claim by authenticating the submitted digital identity with its quorum
    of stored identities.


    +   * **Authentication strategy**: The authentication strategy will dictate how
    a microservice will communicate with the identity provider to authenticate and
    authorize the user requests.'
