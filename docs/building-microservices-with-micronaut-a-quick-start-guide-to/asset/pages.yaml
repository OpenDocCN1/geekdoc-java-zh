  md: '# 2 Working on Data Access


    Any microservice adoption is incomplete without integrating with persistence or
    data storage. In this chapter, we will explore various aspects of persistence
    and data access in the Micronaut framework. We will begin by using an **object-relational
    mapping (ORM)** framework to integrate with a relational database. Then, we will
    dive into integrating a database using a persistence framework. Furthermore, in
    the end, we will see an example of integrating a NoSQL database. To cover these
    topics, we will work on a pet clinic application. This application will be composed
    of the following microservices:


    +   - pet-owner: A microservice to integrate with a relational database using
    an ORM framework in Micronaut

    - pet-clinic: A microservice to integrate with a relational database using a persistence
    framework in Micronaut

    - pet-clinic-review: A microservice to integrate with a NoSQL database in Micronaut


    By the end of this chapter, you will have good and hands-on knowledge of working
    with various kinds of persistence frameworks and how to integrate persistence
    frameworks with different kinds of databases (relational as well as NoSQL) in
    the Micronaut framework.'
