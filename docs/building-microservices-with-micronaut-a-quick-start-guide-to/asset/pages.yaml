  md: '# Distributed monitoring in Micronaut microservices


    Monitoring is simply recording the key performance metrics to enhance visibility
    into the application state. By recording and surfacing the system performance
    metrics such as CPU usage, thread pools, memory usage, and database connections
    for all the distributed components, it can provide a holistic picture of how a
    microservice system is performing at a given point in time. The nature of microservices
    requires a shift in how the system is monitored. Instead of relying on the host
    environment tools, we need a unified monitoring solution that can combine performance
    metrics from various services and present a one-stop interface. In this section,
    we will explore how to implement a distributed monitoring solution for the pet-clinic
    application.


    To implement distributed monitoring, we will use a very popular stack of Prometheus
    and Grafana. Let''s look at our system components for distributed monitoring:


    ![](img/768b67b9430f02ca52f7bb252e4a68e4_273_0.png)


    Figure 9.7 – Distributed monitoring using Prometheus and Grafana'
  merge: -1
  pgno: 273
- img_proc: true
  md: "As shown in the preceding diagram, the pet-clinic microservice will be communicating\
    \ the metrics to the Prometheus server and Grafana will present the user interface.\
    \ Prometheus configurations will be stored in a YAML file.\n\nIn the next section,\
    \ we will begin with setting up Prometheus and Grafana in Docker.\n\n# Setting\
    \ up Prometheus and Grafana in Docker\n\nBefore we instantiate Prometheus and\
    \ Grafana in Docker, we need to define configurations for Prometheus so that it\
    \ can pull metrics from the pet-clinic microservice. You can check out docker-docker-compose\
    \ and prometheus.yml from https://github.com/PackPublishing/Building-Microservices-with-Micronaut/tree/master/Chapter09/micronaut-pet-clinic/docker-prometheus.\n\
    \nOnce checked out locally, you can review the prometheus.yml file to be as follows:\n\
    \n```\nglobal:\n  scrape_interval: 15s\n  evaluation_interval: 15s\n  external_labels:\n\
    \    monitor: 'pet-clinic-monitor'\nscrape_configs:\n  - job_name: 'prometheus'\n\
    \    scrape_interval: 10s\n    static_configs:\n      - targets: ['host.docker.internal:9090','node-exporter:91100']\n\
    \  - job_name: 'micronaut'\n    metrics_path: '/metrics'\n    scrape_interval:\
    \ 10s\n    static_configs:\n      - targets: ['host.docker.internal:32581', 'host.docker.internal:32582',\
    \ 'host.docker.internal:32583', 'host.docker.internal:32584']\n```"
  merge: -1
  pgno: 274
- img_proc: true
  md: "# 254 Distributed Logging, Tracing, and Monitoring\n\nIn prometheus.yml, we\
    \ mainly need to configure scrape_configs. This will be responsible for invoking\
    \ the microservice endpoints to get the metrics. We can specify the pet-clinic\
    \ microservice in the targets. In addition, you can note that the scrape interval\
    \ is 10 seconds. This will configure Prometheus to fetch metrics every 10 seconds.\n\
    \nNext, set up Prometheus and Grafana in Docker, follow these instructions:\n\n\
    +   1. Check out docker-prometheus from https://github.com/PacktPublishing/Building-Microservices-with-Micronaut/tree/master/Chapter09/micronaut-petclinic/docker-prometheus.\n\
    2. Open any Bash terminal (we used Git Bash).\n3. Change directory to where you\
    \ have checked docker-prometheus.\n4. Run docker compose -d.\n5. Wait for Docker\
    \ to download the images and instantiate the Prometheus container.\n\nThese instructions\
    \ will boot up the monitoring app in Docker. You can verify the installation by\
    \ going to the Docker Dashboard and Containers / Apps.\n\nIn the next section,\
    \ we will explore how we can integrate the pet-clinic microservice into Prometheus.\n\
    \n# Configuring microservices for distributed monitoring\n\nTo configure the pet-clinic\
    \ microservice for distributed monitoring, we need to update the project POM with\
    \ Micrometer dependencies.\n\nAdd the following dependencies to the pet-owner\
    \ project POM:\n\n```\n<!-- Micrometer -->\n<dependency>\n  <groupId>io.micrometer</groupId>\n\
    \  <artifactId>micronaut-micrometer-core</artifactId>\n</dependency>\n<dependency>\n\
    ```"
  merge: -1
  pgno: 275
- img_proc: true
  md: "# Distributed monitoring in Micronaut microservices 255\n\n```\n<dependency>\n\
    \  <groupId>io.micronaut.micrometer</groupId>\n  <artifactId>micronaut-micrometer-registry-prometheus</artifactId>\n\
    </dependency>\n<dependency>\n  <groupId>io.micronaut</groupId>\n  <artifactId>micronaut-management</artifactId>\n\
    </dependency>\n```\n\nBy importing the micronaut-micrometer dependencies, we can\
    \ leverage a distributed monitoring toolkit in the pet-owner microservice.\n\n\
    To expose service metrics for Prometheus, we need to expose the metrics endpoint\
    \ in all the pet-clinic microservices. We will add a new controller called PrometheusController\
    \ to the com.packpub.micronaut.web.rest commons package as follows:\n\n```\n@RequiresMetrics\n\
    @Controller(\"/metrics\")\npublic class PrometheusController {\n    private final\
    \ PrometheusMeterRegistry;\n    @Inject\n    public PrometheusController(PrometheusMeterRegistry\
    \ prometheusMeterRegistry) {\n        this.prometheusMeterRegistry = prometheusMeterRegistry;\n\
    \    }\n\n    @Get\n    @Produces(\"text/plain\")\n    public String metrics()\
    \ {\n        return prometheusMeterRegistry.scrape();\n    }\n}\n```"
  merge: -1
  pgno: 276
- img_proc: true
  md: "PrometheusController will expose prometheusMeterRegistry.scrape() on the /metrics\
    \ endpoint.\n\nprometheusMeterRegistry.scrape() will provide service performance\
    \ metrics as configured in the application.properties file.\n\nWe need to configure\
    \ the application.properties file as follows:\n\n```\nmicronaut:\n...\nmetrics:\n\
    \  enabled: true\nexport:\n  prometheus:\n    enabled: true\n    step: PT1M\n\
    \    descriptions: true\n```\n\n```\nendpoints:\n  metrics:\n    enabled: false\n\
    \  prometheus:\n    enabled: false\n```\n\nIn application.properties, we are enabling\
    \ the metrics and exporting the metrics in Prometheus format. Furthermore, since\
    \ we are providing our custom /metrics endpoint, we are disabling the metrics\
    \ and prometheus endpoints in the application properties."
