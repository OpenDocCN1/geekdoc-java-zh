  md: "80 Working on RESTful Web Services\n\nIn the next section, we will work on\
    \ mapping these DTOs to database entities.\n\n# Using MapStruct to define mappers\n\
    \n**MapStruct** is a code generator that uses annotation processing to implement\
    \ mappings between source and target Java classes. The implemented MapStruct code\
    \ consists of plain method calls, therefore it's type-safe and easy to read code.\
    \ Since we don't need to write code for these mappings, MapStruct is very effective\
    \ in reducing the source code footprint.\n\nTo map DTOs to entities and vice versa,\
    \ we will use MapStruct in our pet-owner microservice. Since we are using Maven,\
    \ we will have to add the following to the pom.xml project:\n\n```\n...\n<properties>\n\
    \  <org.mapstruct.version>1.3.1</org.mapstruct.version>\n</properties>\n<dependencies>\n\
    \  <dependency>\n    <groupId>org.mapstruct</groupId>\n    <artifactId>mapstruct</artifactId>\n\
    \    <version>${org.mapstruct.version}</version>\n  </dependency>\n</dependencies>\n\
    ```\n\nBy importing MapStruct into the project, POM will will allow us to leverage\
    \ the MapStruct toolkit. Furthermore, the Maven compiler, we will need to add\
    \ MapStruct to annotationProcessorPaths:\n\n```\n...\n<build>\n  <plugins>\n \
    \   <plugin>\n      <groupId>org.apache.maven.plugins</groupId>\n      <artifactId>maven-compiler-plugin</artifactId>\n\
    \      <configuration>\n        ...\n      </configuration>\n```"
  merge: -1
