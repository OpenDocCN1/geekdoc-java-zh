  md: '# # Integrating Microservices Using Event-Driven Architecture


    The essence of microservice architecture is breaking a monolith down into decoupled
    or loosely coupled microservices. As a result of such a decomposition into microservices,
    we separate the user and/or business concerns owned by each microservice. However,
    for an application as a whole, all the microservices need to work together by
    interacting with each other in executing and serving the requests. Event-driven
    architecture has gained popularity in addressing these inter-microservices interactions.


    In this chapter, we will explore how we can implement an event-driven architecture
    in the Micronaut framework. We will dive into the following topics:


    +   - Understanding event-driven architecture

    - Event streaming with the Apache Kafka ecosystem

    - Integrating microservices using event streaming'
