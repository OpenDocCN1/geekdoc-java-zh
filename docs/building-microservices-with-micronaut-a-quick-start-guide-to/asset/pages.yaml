    # Integrating with a relational database using an ORM (Hibernate) framework


    An ORM framework enables you to store, query, or manipulate data using the object-oriented
    paradigm. It provides an object-oriented approach to access the data from the
    database or, in other words, instead of using SQL, you can use Java objects to
    interact with the database.'
