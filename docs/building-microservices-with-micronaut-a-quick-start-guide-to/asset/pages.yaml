    # Implementing the fault tolerance mechanisms


    Faults and failures are inevitable in a microservice environment. As the numbers
    of

    dributed components increase, the number of faults both within each component\and
    those originating from their interactions increase as well. Any microservices

    application must have built-resilience for these unfortunate scenarios. In this
    section,

    we will explore and implement different ways to handle faults and failures in
    the

    Micronaut framework.


    # Leveraging built-in mechanisms


    Micronaut is a cloud-native framework and has built-in capabilities to handle
    faults

    and failures. Essentially, its fault tolerance is driven by retry advice. Retry
    advice offers

    the @Retryable and @CircuitBreaker annotations that can be used in any

    HTTP client.


    # Using @Retryable in an HTTP client


    @Retryable is an effortless but effective fault tolerance mechanism – to put it
    simply,

    it''s used to try again in case of a failure. These attempts can be made again
    after a fixed

    delay and can continue until the service responds or no more attempts are left.


    With @Retryable we can annotate the client declaration. We can use

    @Retryable on OwnerResource as follows:


    ```

    @Retryable(attempts = "5", delay = "2s", multiplier = "1.5",

    maxDelay = "20s")

    Client(id = "pet-owner")

    public interface OwnerResourceClient {


    }

    ```'
  merge: -1
  pgno: 231
- img_proc: true
  md: "# Implementing the fault tolerance mechanisms 211\n\nBy using @Retryable on\
    \ OwnerResourceClient you enable fault-tolerance on all its methods. If the pet-owner\
    \ microservice is down then OwnerResourceClient will retry attempting to establish\
    \ the communication for a maximum of five attempts. We can configure @Retryable\
    \ with the following settings:\n\n+   * **attempts**: This denotes the maximum\
    \ number of retries the client can make. By default, this is 3 attempts.\n* **delay**:\
    \ This marks the delay between the retries and is 1 second by default.\n* **multiplier**:\
    \ This specifies the multiplier used to calculate the delay and is by default.\n\
    * **maxDelay**: This specifies the maximum overall delay and is by default. If\
    \ specified, any retry attempts will be halted if retries reach the maximum delay\
    \ limit.\n\n@Retryable is well suited for temporary/momentary faults for long-lasting\
    \ faults, we would need to use the circuit breaker pattern. In the next section,\
    \ we will see how we can use the circuit breaker in the Micronaut framework.\n\
    \n# Using @CircuitBreaker in an HTTP client\n\nAs discussed, failure in a highly\
    \ distributed system as microservices is inevitable. In a microservice architecture,\
    \ if a service goes down there is another defensive mechanism to help avoid congesting\
    \ the service traffic with requests until the service is healthy again. This mechanism\
    \ is called the circuit breaker. In normal circumstances, the circuit is open\
    \ and accepting requests. On a failure, a counter is increased until it reaches\
    \ a specified threshold. After reaching the threshold, the circuit is put into\
    \ a closed state and the service will respond immediately with avoiding any timeouts.\
    \ The circuit breaker has an internal polling mechanism to determine the health\
    \ of the service and if the service is healthy then the circuit is put back to\
    \ an open state.\n\nWe can simply use Micronaut's built-annotation to specify\
    \ a circuit breaker on an HTTP client. Let's implement a circuit breaker in PetResourceClient:\n\
    \n```\n@Client(id = \"pet-owner\")\n@CircuitBreaker(delay = \"5s\", attempts =\
    \ \"3\", multiplier = \"2\", reset = \"300s\")\npublic interface PetResourceClient\
    \ {\n    @Post(\"/api/pets\")\n    HttpResponse<PetDTO> createPet(@Body PetDTO\
    \ petDTO);\n```"
  merge: -1
  pgno: 232
- img_proc: true
  md: "# 212 Handling Microservice Concerns\n\n```\n@Put(\"/api/pets\")\nHttpResponse<PetDTO>\
    \ updatePet(@Body PetDTO petDTO);\n...\n}\n\n```\n\nIn the preceding circuit breaker\
    \ implementation, if the PetResource endpoints fail then PetResourceClient will\
    \ try five attempts, waiting for 3 seconds for the first attempt and a multiplier\
    \ of 2 for future attempts. After five attempts, if the service is not responding,\
    \ the client will be put into a closed state. It will try to access it again after\
    \ a reset interval of 5 minutes to check if the service is healthy.\n\n# Using\
    \ @Fallback for an HTTP client\n\nIn a circuit breaker implementation, are feign\
    \ clients or fallbacks. Instead of raising a server error when the circuit is\
    \ closed, a fallback implementation can handle the request and respond normally.\
    \ This is especially effective when the actual service call might be returning\
    \ that a fallback can also return.\n\nIn the following example of the circuit\
    \ breaker in PetResourceClient, we can create a simple fallback that will handle\
    \ the incoming requests when the circuit is closed:\n\n```\n@Fallback\npublic\
    \ class PetResourceFallback implements PetResourceClient {\n    @Override\n  \
    \  public HttpResponse<PetDTO> createPet(PetDTO petDTO) {\n        return HttpResponse.ok();\n\
    \    }\n    @Override\n    public HttpResponse<PetDTO> updatePet(PetDTO petDTO)\
    \ {\n        return HttpResponse.ok();\n    }\n    @Override\n    public HttpResponse<List<PetDTO>>\n\
    \    getAllPets(HttpRequest request, Pageable pageable) {\n        return HttpResponse.ok();\n\
    \    }\n    @Override\n    public Optional<PetDTO> getPet(Long id) {\n       \
    \ return Optional.empty();\n    }\n}\n```"
