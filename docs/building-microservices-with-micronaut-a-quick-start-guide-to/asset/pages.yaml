    \ with a NoSQL database (MongoDB)\n\nMongoDB is a document-based database and\
    \ it stores the data in JSON or BSON format. Data is stored in key-value pairs,\
    \ similar to a JSON object. MongoDB is engineered in a scale-out fashion and it\
    \ is recommended to use it when the volume and structure of data are agile and\
    \ growing rapidly. There are a few key terms in contrast to a relational database:\n\
    \n+   * **Database:** A database in MongoDB is much similar to a database in a\
    \ relational database.\n* **Table:** A collection of (of) documents is much similar\
    \ to a table in a relational database.\n* **Row:** A BSON or JSON document will\
    \ be a close analogy to a row in a relational database."
