  md: '![](img/768b67b9430f02ca52f7bb252e4a68e4_188_0.png)


    Figure 6.1 – Test pyramid


    As depicted in the preceding diagram, unit testing is fast, robust, and inexpensive
    whereas we go towards the top of the pyramid, testing becomes sluggish, brittle,
    and expensive. Though all kinds of testing are required to fully verify whether
    the application is working as expected, a fine balance is critical to cut expenses
    and increase robustness and speed. Put simply, have a lot of unit tests, a number
    of service tests, and very few end-to-end tests. This will ensure quality at a
    greater speed and with less cost.


    In the next section, we will begin the automated testing journey with unit testing.


    # # Unit testing in the Micronaut framework


    In the object-oriented paradigm, an object can assume multiple behaviors. These
    behaviors are defined by their methods. Effective testing probes a single behavior
    of an object at a time. This doesn''t translate to testing a method as a method
    can change its behavior by taking different execution paths (if the method has
    forked control flow). Therefore, essentially, a unit test will probe one execution
    path of a method at a time. Iteratively, we can add more unit tests to probe other
    execution paths in the same or other methods. This bottom-up approach relies on
    verifying behaviors at smaller, isolated levels so the application as a whole
    will work as expected.'
