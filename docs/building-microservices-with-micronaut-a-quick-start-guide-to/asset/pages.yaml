  md: 'An utterance is a word users say to Alexa to convey what they want to do such
    as Turn on the lights, What is the current temperature?, and so on. Users can
    say the same thing in different ways, such as find the temperature, current temperature,
    outside temperature, the temperature in [location], and Alexa will provide pre-built
    utterances and associated requests as part of the custom voice interaction model.
    This list of utterances can be mapped to a request or intent.


    The following diagram illustrates the custom voice interaction model with a wake
    word, launch, invocation name, utterance, and intent:


    # Opening a Skill


    | Alexa, | ask | space facts | for a fact |

    | --- | --- | --- | --- |

    | Wake word | launch | Invocation name | utterance |

    | Alexa | Open | Pet Clinic | Do something |


    GetFactByPetClinicIntent

    Intent


    Figure 10.5 – Opening a skill – Pet Clinic


    For our code example, we will use the sequences Alexa, Open Pet Clinic, and Alexa,
    find nearby Pet Clinics. Here, the wake-up word is Alexa, the launch word is Open,
    and the invocation name is Pet Clinic. The utterance can be find the nearest pet
    clinic. We also have other variations of utterances, such as find pet clinic.
    All these utterances can be mapped to GetFactByPetClinicIntent. We will learn
    about intents in the next section of this chapter.


    # Basics of intents


    One of the fundamental designs for voice in Alexa is intents. Intents capture
    events the end user wants to do with. Intents represent an action that is triggered
    by the user''s spoken request. Intents in Alexa are specified in a JSON structure
    called an intent schema. The built-in intents include Cancel, Help, Stop, Navigate
    Home, and Fallback. Some intents are basic, such as help, and the skills should
    have a Help Intent.'
  merge: -1
  pgno: 292
- img_proc: true
  md: 'The following diagram illustrates the built-in intents in the Alexa developer
    console:


    ![](img/768b67b9430f02ca52f7bb252e4a68e4_293_0.png)


    Figure 10.6 – Built-in intents


    If we have a website for logging in that username and password fields and submit
    a button, there will be a submit intent in the Alexa skill world. However, one
    big difference is that users can say the submit in different ways; for example,
    *Submit, submit it, confirm, get, continue,* and so on. These different ways of
    saying the same thing are called *utterances*. Each intent should include a list
    of utterances; that is, all the users might say to invoke these intents. Intents
    can have arguments called *slots*, which will not be discussed in this chapter.


    Now that we have learned about the basics of Alexa skills by covering utterances,
    intents, and built-in intents, let''s create our first functional skill.


