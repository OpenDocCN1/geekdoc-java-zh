  md: '# Deploying Microservices


    By the end of this chapter, you will be well versed in these aspects of microservices
    deployment.


    # ## Technical requirements


    All the commands and technical instructions in this chapter run on Windows 10
    and macOS. The code examples covered in this chapter are available in the book''s
    GitHub repo:


    ```

    https://github.com/PacktPublishing/Building-Microservices-with-Micronaut/tree/master/Chapter08

    ```


    The following tools need to be installed and set up in the development environment:


    +   - Java SDK: Version 13 or above (we used Java 14).

    - Maven: Based on your preference and only required if you would like to use Maven
    as the build system. However, we recommend having Maven set up on any development
    machine. Instructions to download and install Maven can be found at https://maven.apache.org/download.cgi.

    - A development IDE: Based on your preference, any Java-based IDE can be used,
    but for the purpose of writing this chapter, IntelliJ.

    - Git: Instructions to download and install this can be found at https://git-scm.com/downloads.

    - PostgreSQL: Instructions to download and install this can be found at https://www.postgresql.org/download/.

    - MongoDB: MongoDB Atlas provides a free online database-as-a-service up to 512
    MB storage. However, if a local database is preferred instructions to download
    and install it can be found at https://docs.mongodb.com/manual/administration/install-community/.
    We used a local installation for writing this chapter.

    - A REST client: Any HTTP REST client can be used. We used the Advanced REST Client
    plugin.

    - Docker: Instructions to download and install Docker can be found at https://docs.docker.com/get-docker/.'
