  md: '# Working on a hello world project in the Micronaut framework


    To understand the practical aspects of using the Micronaut framework for developing
    a microservice, we will work with a hello world project. This will help you quickly
    get started with the Micronaut framework and also give you first-hand experience
    of how easy it is to do microservices development.


    Micronaut works seamlessly with the Maven and Gradle packaging managers. We will
    cover one example for each using the Micronaut CLI as well as Micronaut Launch
    (web interface) for generating barebones projects.


    # Creating a hello world project using the Micronaut CLI


    Please take the following steps to create a hello world application using the
    Micronaut CLI:


    +   1. Open the terminal (or Command Prompt).

    2. Change the directory to your desired directory where you want to create the
    hello world project.

    3. Type the following command:


    ```

    mn create-app hello-world-maven --build-maven

    ```


    +   4. Wait for the Micronaut CLI to finish and it will create a hello-world-maven
    project. The create-app command will create a boilerplate project for you with
    a Maven build and your system-installed Java version. It will create Application.java
    as well as a sample test class ApplicationTest.java.

    5. Explore your freshly created hello-world-maven project, open this project in
    your preferred IDE.

    6. To run your project, run the following command in a Bash terminal:


    ```

    ./mvnw compile exec:exec

    ```


    Please note that if you are copying the project from somewhere else, it''s required
    to reconfigure mvnw by typing the following command:


    ```

    mvn -N io.takari:maven:wrapper

    ```


    +   7. The Maven wrapper will build and run your project on http://localhost:8080
    by default.'
