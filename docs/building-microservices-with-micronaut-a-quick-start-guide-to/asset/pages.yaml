- img_proc: true
  md: '# 8 Started With Microservices Using the Micronaut Framework


    In the previous diagram, we can see a fully realized microservices application
    where each microservice interacts with its database. The user interacts with a
    single-page application through a modern browser. Any incoming requests from the
    web server are routed to the respective microservice. The full realization of
    microservices architecture is to address key factors of scalability, fault tolerance,
    high availability, and flexibility.


    To put it simply, microservices or microservices architecture componentize an
    application into a collection of interacting services. Each service can be developed,
    tested, deployed, and maintained independently. Thus, each smaller (micro) service
    has its own life cycle. Furthermore, since each service is loosely coupled (interacting
    with other services using HTTP/HTTPS), we can do the following:


    +   - Scale up or down (based on the service traffic).

    - Address any runtime faults (boot up the service backup).

    - Make new changes (change impact is limited to the service).


    Therefore, the complete realization of decoupled architecture in the microservices,
    we address key issues of scalability, fault tolerance, high availability, and
    flexibility.


    So far, we have learned about microservices and their evolution and how they have
    been transformational in addressing the unique, rapid, and agile needs of today''s
    world. This understanding is a good preface to realizing the potential of microservices.
    In the next section, we will dive into the microservices design patterns.


    # Understanding microservices design patterns


    To fully realize the benefits of any architecture (including the microservices
    architecture), an architectural approach is often backed with design patterns.
    Understanding these design patterns is crucial for an ideal adoption of the architecture.
    In the following sections, we will cover some practical and commonly used design
    patterns in microservices. Each pattern addresses a different aspect of the application
    life cycle and our focus will be to see these design patterns from a practical
    usage standpoint. We will begin with decomposition design patterns.


    # Decomposition design patterns


    Decomposition design patterns dictate how we can componentize or decompose a big/monolithic
    application into smaller (micro) services. These patterns come in handy in designing
    a transformational architecture for any legacy monolithic application. The following
    are the most commonly used design patterns in decompositions.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Decomposing by business capability


    Any business capability is an instrument to make a profit. If we can enlist and
    categorize an application into a set of business capabilities such as inventory
    management, customer orders, or operations, then the application can be decomposed
    into microservices that are based on these business capabilities. This process
    to decompose is effective and recommended for small- to medium-sized applications.


    # Decomposing by domains/sub-domains


    If the application is an enterprise-grade and heavy application, then the previous
    approach may end up decomposing the application into smaller monoliths. These
    monoliths are smaller but monolithless. In some cases, business modeling can help
    to categorize and map application functionalities into domains and sub-domains.
    Functionalities inside a domain/sub-domain are similar but very different from
    the functionalities of other domains/sub-domains. Microservices then be designed
    and built around domains or sub-domains (if there are many functionalities mapped
    to a domain).


    # Integration design patterns


    Once the application is broken down into smaller (micro) services, we will need
    to establish cohesion among these services. Integration design patterns address
    such collaboration requirements. The following are the most commonly used design
    patterns in integrations.


    # The API gateway pattern


    Often upstream frontend need to access microservices through a façade. This façade
    is called an API gateway. The API gateway design pattern serves an important purpose
    to keep things simple for frontend clients:


    +   * The frontend client is not sending too many requests to microservices.

    * The frontend client is not processing/aggregating too many responses (from microservices).

    * At the server end, the gateway routes a request to multiple microservices, and
    these microservices can run in parallel.

    * Before sending the final response, we can aggregate individual responses from
    different microservices.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# The aggregator pattern


    This pattern is similar to the aforementioned API gateway pattern. However, composite
    microservice is the key differential. The mandate of a composite microservice
    is to offload an incoming request to multiple microservices and then collaborate
    to create a unified response. This pattern is used when a user request is atomic
    from business logic standpoints, but it is processed by multiple microservices.


    # The chained microservices pattern


    In some scenarios, an incoming request is executed in a series of steps wherein
    each step could be spinning off a call to a microservice. For example, ordering
    an item in an online marketplace would require the following:


    +   1. Searching for an item (inventory management service)

    2. Adding an item to the cart (cart service)

    3. Checking the added item (payment service, mail service, inventory management
    service)


    All these service calls would be synchronous. Fulfilling a user request would
    be an amalgamation of all these chained microservice calls.


    # Data management patterns


    Integrating with the persistence layer is an important aspect of any microservice-based
    application. Greenfield (net new) and brownfield (legacy transformation) applications
    may dictate their requirements in how to choose a data management pattern. The
    following are the most often used design patterns in data management in microservices.


    # Database per service


    In greenfield (net new) applications, it is ideal to have a database per service.
    Each service is the owner of an isolated database (relational or non-relational)
    and any data operation must be executed through the microservice only. Furthermore,
    if any other microservice needs to perform a database operation, then it should
    be routed through the owner microservice.


    # Shared database


    In brownfield (transformational) applications, it may not be practical to decompose
    the database into one database per service. In such scenarios, the microservices
    architecture realization can be kickstarted with services sharing a common monolith
    database.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Command query responsibility segregation (CQRS)


    In greenfield or fully transformed applications where each microservice is an
    independent database owner, there might be a requirement to query data from multiple
    databases. The CQRS pattern stipulates to decompose an application into a command
    and query to:


    +   **Command:** This part will manage any create, update, and delete requests.

    * **Query:** This part will manage query requests using database views where database
    views can unify data from multiple schemas or data sources.


    # Cross-cutting patterns


    Some concerns cut across all the different aspects/layers of microservices. In
    the following sub-sections, we will discuss some of these concerns and patterns.


    # The service discovery pattern


    In a microservices-based application, each microservice may have more than one
    instance at runtime. Furthermore, these service instances can be added or removed
    at runtime based on traffic. This runtime agility can be an issue for upstream
    consumers or how they connect with services.


    The service discovery pattern addresses this by implementing a service registry
    database. The service registry is a metadata store containing information such
    as the service name, where the service is running, and the current status of the
    service. Any runtime information will be updated in the service registry, for
    example, when a service adds a new instance or a service is down. This eases the
    pain for upstream consumers to connect with different microservices in the application.


    # The circuit breaker pattern


    In a microservices-based application, often services interact with each other
    by invoking endpoints. There could be a scenario where a service is calling a
    downstream service but the downstream service is down. Without a circuit breaker,
    the upstream service will keep calling the downstream service while it''s down
    and this will keep impacting the user interaction with the application.


    In the circuit breaker pattern, a downstream service call will be routed through
    a proxy. This proxy will timeout for a fixed interval if the downstream service
    is down. After the timeout expiry, the proxy will try to connect again. If successful,
    it will connect with the downstream service; otherwise, it will renew the timeout
    period. Therefore, the circuit breaker will not bombard the downstream service
    with unnecessary calls and it will not impact user interaction with the application.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# The log aggregation pattern


    In the microservices landscape, often an incoming request will be processed by
    multiple services. Each service may create and log its entries. To trace any issues,
    it will be counter-intuitive to access sporadic logs. Implementing a log aggregation
    pattern, logs could be indexed in a central place, enabling easy access to all
    application logs. Elasticsearch, Logstash, Kibana (ELK) can be used to implement
    log aggregation.


    In this section, we have covered some often-used design patterns in different
    stages of the application life cycle. Understanding these design patterns is required
    to fully reap the benefits of microservices architecture. In the next section,
    we will dive into the Micronaut framework for developing microservices.


    # Why Micronaut is the best choice for developing microservices


    In the previous sections, we learned about the maturity on the architectural side
    of microservices. Unfortunately, on the implementation side, an overhaul shift
    to build/develop microservices is not mature as microservices architecture. To
    address some of these implementation challenges, many traditional Java frameworks
    have added small, iterative changes, but much-sought disruptive and overhauled
    changes are missing. At the core, these traditional Java frameworks have stayed
    almost the same since the time of monolithic services. Reflections, runtime proxies,
    and bulky configuration management have plagued all traditional frameworks with
    slower boot time and bigger memory footprints, making them unsuitable for microservices
    development.


    Micronaut is developed from the bottom up, considering these important challenges,
    to organically support microservices development:


    +   **Dependency injection:** Micronaut uses JSR-330 @Inject for dependency injection.
    It adds the Java inject module to the compiler and all the annotations are processed
    at compile time. The compiler generates the byte code for all the classes based
    on the annotations that are used in their source code. This is all done at compile
    time. At runtime, Micronaut can instantiate the beans and read their metadata
    from the generated byte code and does not need to use the slow reflection API.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Why Micronaut is the best choice for developing microservices


    +   - Ahead-of-time compilation: As discussed before, one of the key contrasts
    is that Micronaut performs dependency injection, configuration management, and
    aspect-oriented programming proxying at compile time. Micronaut relies on one
    or more annotation processors to process the metadata into ASM-generated (assembly)
    byte code. Furthermore, this ahead-of-time-generated code is further optimized
    by Java''s just-in-time (JIT) compiler. Other frameworks use reflection and produce
    the annotation metadata at application boot-up. This metadata is loaded to runtime
    memory, increasing the memory footprint. Instead of the Java Reflection API, Micronaut
    uses the Java annotation processor API, the Kotlin compiler plugin for annotation
    processors, and Groovy AST transformations for metaprogramming.

    - Faster boot-up time and lower memory consumption: Other frameworks use Java
    reflections and at boot-up, all classes are scanned to generate reflection metadata
    for each field, method, and constructor. This metadata is used to determine and
    inject the required object into the application runtime. This adds significantly
    to boot-up time as well as runtime memory. As discussed previously, Micronaut
    uses ahead-of-time compilation and the Java annotation processor to offload such
    work from the runtime and reduce memory requirements by not pushing unnecessary
    reflection metadata onto

    - Serverless applications: One of the key issues in serverless applications is
    boot-up time, traditional frameworks are not a prudent choice to develop serverless
    applications. Micronaut organically supports serverless application development
    by keeping the minimal runtime footprint and sub-second boot-up time. Micronaut
    natively supports commonly used cloud platforms for serverless function.

    - Language-agnostic framework: The Micronaut framework supports the Java, Kotlin,
    and Groovy programming languages. With varied support for major programming languages,
    developers can choose their preferred language when considering cloud requirements.
    For example, for IoT requirements, Groovy could be a good option. This language-agnostic
    enablement makes it flexible and apt for varied requirements of mobile/web/cloud
    solutions.

    - Support GraalVM: Since Micronaut doesn''t use reflections, any Micronaut-based
    application can be ahead-of-time compiled into a GraalVM native image. GraalVM
    is a virtual machine now offered by Oracle that can run a Java application down
    to machine code. This increases application performance significantly. Any Micronaut
    application compiled to a GraalVM native image can boot up in milliseconds.'
