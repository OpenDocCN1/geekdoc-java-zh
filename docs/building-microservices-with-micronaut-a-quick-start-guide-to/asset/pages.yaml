  md: '# # 4 Securing the Microservices


    Protecting microservices’ interfaces as well as the world encompassed by them
    is a crucial facet for any application development. Various topologies, tools,
    and frameworks have arisen in recent times to address the security aspects of
    web services/microservices. In the course of this chapter, we will dive into some
    core and often-used security paradigms in microservices. For hands-on work, we
    will work toward securing microservices while covering the following authentication
    strategies in the Micronaut framework:


    +   - pet-owner: Working hands-on to secure pet-owner microservice endpoints using
    session authentication

    - pet-clinic: Working hands-on to secure pet-clinic microservice endpoints using
    JWT authentication

    - pet-clinic-review: Working hands-on to secure pet-clinic-review microservice
    endpoints using OAuth authentication'
  merge: -1
