  md: "# 240 Distributed Logging, Tracing, and Monitoring\n\nIn the locally checked\
    \ out docker-elk directory, you can verify that Logstash is configured with the\
    \ following settings:\n\n```\ninput {\n  tcp {\n    port => 5000\n    type =>\
    \ syslog\n    codec => json_lines\n  }\n}\nfilter {\n  grok {\n    match => [\
    \ \"message\", \"%{GREEDYDATA}\"] \n  }\n  mutate {\n    add_field => { \"instance_name\"\
