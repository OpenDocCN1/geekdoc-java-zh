    annotation overrides the application configuration. And in our case, we are disabling
    the security.

    - @TestInstance(TestInstance.Lifecycle.PER_CLASS): TestInstance.Lifecycle.PER_CLASS
    boots up the application context and keeps the context for the whole suite. You
    can instantiate a test object and application context at the test method using
    @TestInstance(TestInstance.Lifecycle.PER_METHOD).

    - @TestMethodOrder(MethodOrder.Annotation.class): @TestMethodOrder annotation
    in JUnit is used to define the execution order of each test in the test suite.

    - @Inject @Client: This annotation injects a reactive HTTP client (built in Micronaut)
