    # # The basics of Micronaut security


    For handling any security aspects, the Micronaut framework has a built-in SecurityFilter
    object. The SecurityFilter object intercepts any incoming HTTP requests and kickstarts
    the authentication/authorization process as configured in the application. In
    the following diagram, you can see the workflow within the SecurityFilter object
    for authorizing a user request:'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# The basics of Micronaut security 111


    ![](img/768b67b9430f02ca52f7bb252e4a68e4_132_0.png)


    Figure 4.2 – Micronaut security filter


    Micronaut''s SecurityFilter has three essential parts:


    +   - **AuthenticationFetcher**: AuthenticationFetcher will fetch the required
    downstream authenticator for authenticating the user request.

    - **Authenticator**: Authenticator injects the configured authentication provider(s)
    and security configurations for authenticating the user request. An AuthenticationResponse
    object is created based on the success or failure of the auth operation.

    - **SecurityRule**: If auth is successful, then the security filter will further
    invoke security rules. An application can configure one or more security rules
    either using out-of-the-box security rules as SecuredAnnotationRule or IpPatternsRule
    or by creating its own security rules by extending AbstractSecurityRule. If the
    request satisfies all the security rules, then a successful AuthenticationResponse
    is returned by the security filter; otherwise, it will return a failed AuthenticationResponse.


    By leveraging SecurityFilter, in the next section, we will focus on how to secure
    a microservice using session authentication in the Micronaut framework.'
