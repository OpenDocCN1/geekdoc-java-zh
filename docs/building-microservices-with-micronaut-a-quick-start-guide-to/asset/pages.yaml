  md: "# Integrating Micronaut with Alexa\n\nAs we discussed in the preceding section,\
    \ in this section, we will start to understand how to integrate Micronaut with\
    \ Alexa. Micronaut provides various extensions to support Amazon Web Services\
    \ (AWS). The primary focus here will be on AWS Lambda. The micronaut-function-aws-alex\
    \ module includes support for building Alexa skills with Micronaut. Micronaut\
    \ Alexa support can wire up your Alexa application with AlexaFunction and supports\
    \ dependency injection for the following types:\n\n+   - com.amazon.ask.dispatcher.handler.RequestHandler\n\
    - com.amazon.ask.dispatcher.request.interceptor\n- com.amazon.ask.dispatcher.exception.ExceptionHandler\n\
    - com.amazon.ask.builder.SkillBuilder\n\nMicronaut's aws-alexa module simplifies\
    \ how we can develop Alexa skills with Java, Kotlin, or Groovy. The following\
    \ code is the Maven dependency for the aws-alexa module:\n\n```\n<dependency>\n\
    \    <groupId>io.micronaut</groupId>\n    <artifactId>micronaut-aws-alexa</artifactId>\n\
    </dependency>\n```\n\nAs we learned in the previous chapters, Micronaut uses Java\
    \ annotations. To change any Alexa Java handler so that it can work with Micronaut,\
    \ all we need to add the necessary @Singleton annotation; that is, java. inject.\
    \ Singleton. A sample LaunchRequestHandler with the Singleton annotation is as\
    \ follows:\n\n```\n@Singleton\npublic class LaunchRequestHandler implements RequestHandler\
    \ {\n    @Override\n    public boolean canHandle(HandlerInput handlerInput) {\n\
    \        return handlerInput.matches(\n            (requestType (LaunchRequest.class));\n\
    \    }\n}\n    @Override\n    public Optional<Response> handle (HandlerInput handlerInput)\
    \ {\n```"
