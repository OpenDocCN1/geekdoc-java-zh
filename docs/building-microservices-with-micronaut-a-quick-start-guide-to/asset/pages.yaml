    - Jib

    - DevOps Strategy and infrastructure to support Continuous Integration and Continuous
    Delivery


    We discussed this in the *Deploy* section.


    +   6. The following are a few tools that are used in the manage and maintain
    phase:


    +   - Elasticsearch

    - Logstash

    - Kibana

    - Prometheus

    - Grafana

    - Sonar


    We discussed this in the *Manage and maintain* section.


    +   7. The following are types of scaling:


    +   - Vertical

    - Horizontal

    - Microservices horizontal


    We discussed this in the *Scaling Micronaut* section.


    +   8. The tool used is *Microservices Horizontal* (container/services-based scaling).


    We discussed this in the *Scaling Micronaut* section.'
