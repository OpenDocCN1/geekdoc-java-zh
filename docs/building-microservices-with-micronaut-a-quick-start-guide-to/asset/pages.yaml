    | Search | Search Across | Health Status | Service Type |

    |---|---|---|--|

    | consul 1 Instance | | | |

    | pet-clinic 1 Instance | | | |

    | pet-clinic-reviews 1 Instance | | | |

    | pet-owner 1 Instance | | | |


    Figure 7.5 – Pet-clinic application service discovery


    After successful startups, the microservices will register their instances with
    the Consul service discovery. We can view the running services by going to the
    Services screen on Consul.


    Though service discovery brings all the services under one umbrella by centralizing
    the runtime metadata (mainly the network locations), it still leaves a gap for
    upstream consumers as we don''t have a unified interface yet. In the next section,
    we will implement an API gateway for the pet-clinic application, which will provide
    a unified interface for all the clients.'
