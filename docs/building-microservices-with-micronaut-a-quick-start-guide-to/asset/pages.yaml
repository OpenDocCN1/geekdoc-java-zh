- img_proc: true
  md: '# Design


    During the design phase, you can use design patterns, as we learned in Chapter
    1, Getting Started with Microservices Using Micronaut Framework. Design patterns
    are reusable proven solutions for recurring business or technology problems. The
    following are the design patterns that we have explored so far in this book:


    +   - Decomposition by business capability

    - Decomposing by domains/subdomains

    - API gateway pattern

    - Chained microservices pattern

    - Database per service

    - Command query responsibility segregation

    - Service discovery pattern

    - Circuit breaker pattern

    - Log aggregation pattern


    Design patterns are continuously evolving. Always check for new patterns in the
    industry and evaluate whether they are a good fit for your solution. The next
    important area to consider when designing a microservice is security. We learned
    about securing microservices in Chapter 4, Securing Microservices. Here, we learned
    about evaluating authentication strategies, security rules, privilege-based access,
    OAuth, and SSL.


    Other factors when designing are to check for privacy-specific standards in the
    application such as HIPAA (short for Health Insurance Portability and Accountability
    Act), General Data Protection Regulation (GDPR), Personal Information Protection
    and Electronic Documents Act (PIPEDA), Bank Act, and so. Check for encryption
    standards such as encryption at rest and encryption in transit, whether your data
    is encrypted before transmission, or whether your data has been stored and encrypted.
    Check for the security protocol version currently being used and apply the latest
    stable, supported version patches. The data retention strategy is another area
    to think about designing a microservice. How long do you need to store the data
    for, and what is the archival strategy for data and log files? Also, some countries
    have regulations where you can store the data, check the requirements, and consider
    them while designing.'
  merge: -1
