  md: '# Assessment


    The answers for chapters 1 to 9 are mostly theoretical or practical. So it is
    enough to have read through them to answer the questions in those chapters.


    # Chapter 10


    +   1. Internet of Things (IoT) is a network of devices or things. These things
    could be anything from a human wearing a health monitor, a pet wearing a geolocation
    sensor, a car with a tire pressure sensor, a television with voice/visual capabilities,
    or a smart speaker.

    We discussed this in the *Basics of IoT* section.

    2. Doorbells, locks, lightbulbs, speakers, televisions, healthcare systems, Google
    Home, Amazon Alexa, Apple Siri, Microsoft Cortana, and Samsung Bixby.

    We discussed this in the *Basics of IoT* section.

    3. Alexa skills are like apps, and you can enable or disable skills using the
    Alexa for a specific device. Skills are voice-based Alexa capabilities.

    We discussed this in the *Basics of IoT* section.

    4. Intents capture the end user want to implement with their voice. An intent
    represents an action that is triggered by the user''s spoken request. Intents
    in Alexa are specified in a JSON structure schema. Built-in intents are *Cancel*,
    *Stop*, *Navigate Home*, and *Fallback*. Some intents are basic, such as *Help*,
    and the skills should have a *Help* intent.

    We discussed this in the *Basics of intents* section.

    5. Java, Node.js, C#, or Go.

    6. We discussed this in the *First Hello World* Alexa skill section.'
  merge: -1
