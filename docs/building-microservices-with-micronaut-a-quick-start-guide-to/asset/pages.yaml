  md: '2020, we launched Micronaut Foundation, a not-for-profit company that oversees
    the software''s roadmap and development, best practices and processes, repository
    control, documentation and support, and fundraising. Our goals? To ensure technical
    innovation and advancement of the Framework, and promote the Framework as a leading
    technology in the JVM space, and to build and support an ecosystem of complementary
    documentation, functionality, and services.


    The Foundation is led by a Technology Advisory Board made up of thought leaders
    and representatives from different sectors of the technology industry. Bringing
    together a group of folks with diverse experiences, priorities, and areas of expertise
    is a huge win for the technology and the community.


    Object Computing and the Micronaut Foundation highly value the equal opportunity
    represented by open-source technologies; working together with members of the
    Micronaut community to share information, knowledge, and expertise can only further
    promote success for everyone. Thus, when Dacwood and Nirmal Singh approached us
    and told us they were writing a book about the Framework, we were delighted and
    happy to help in any way. *Building Microservices with Micronaut is a great example
    of community members channeling their enthusiasm for the Micronaut framework into
    a resource that we know will lead to innovative and exciting solutions with the
    power to change the world.


    Whether you''ve been a fan of the Micronaut framework since its inception or you''re
    just getting started by picking up this book, you''re part of a community full
    of people and organizations that are passionate about creating the very best technical
    solutions possible – developers and tech enthusiasts who embrace the idea that
    all of us is better than any one of us.


    We are certain that you will find the Micronaut framework to be a game-changer,
    and with Zack and Nirmal''s guidance, you will soon find yourself enjoying all
    the benefits of the Framework offers. And where your journey takes you from there?
    Well, whatever you do, you can take pride in the fact that you''re a pioneer in
    a future that runs on intelligent compilers, lightning-fast runtimes, and technical
    solutions limited only by your imagination.


    Foreword by The Micronaut Foundation'
