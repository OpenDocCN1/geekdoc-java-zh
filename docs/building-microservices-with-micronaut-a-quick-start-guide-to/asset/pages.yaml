  md: '# Working on Data Access


    MyBatis is commonly used in migration or transformational projects where a legacy
    database(s) already exists. Since a lot of tables, views, and other data objects
    are already defined in the database, it may not be an ideal scenario to refactor
    and normalize these table/view definitions to map them directly to Java objects
    (using an ORM framework). MyBatis offers an ideal way of mapping Java methods
    to SQL statements. These SQL statements, which handle any CRUD access thereof,
    are defined in an XML mapper or POJO mapper using MyBatis annotations.


    Furthermore, as an ORM framework (such as Hibernate) manages child entities on
    its own and hides the SQL part completely, some developers prefer to have control
    of interacting with SQL. Therefore, MyBatis can chime in a preferred persistence
    framework.


    Micronaut supports integration with relational databases through MyBatis. In order
    to exhibit this integration, we will work on another microservice that will manage
    the veterinary area of the pet clinic application. This microservice will integrate
    with the following schema:


    | specialties | | vets |

    | --- | --- | --- | --- |

    | Id | || FK specialty_id | PK id |

    | name | FK vet_id | | first_name |

    | | | | last_name =


    > Figure 2.8 - Pet clinic schema


    Essentially, one vet can have many specialties and one specialty can belong to
    multiple vets. In the next section, we will get started setting up the pet-clinic
    schema.


    # Generating the pet-clinic schema in PostgreSQL


    To generate the pet-clinic schema, follow these instructions:


    +   1. Download DB-SQL from https://github.com/PacktPublishing/Building-Microservices-with-Micronaut/blob/master/Chapter02/micronaut/pet-clinic/src/main/resources/db-sql.txt.

    2. Open PostgreSQL''s PgAdmin and open the query tool.

    3. Run the preceding SQL section by section. It will create a pet-owner user,
    schema, and tables.

    4. Lastly, run the data SQL to ingest some dummy data into these tables.'
