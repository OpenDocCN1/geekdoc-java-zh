  md: '# Building the container artifacts


    To deploy an application, the first step is to build all the required artifacts.
    And building an artifact typically involves checking out the source code and compiling
    and creating a deployable artifact. In regard to microservices, often, this deployable
    form is a Docker image. Docker images have elegantly decoupled the runtime requirements.
    A Docker image is platform agnostic and can be deployed to any host machine that
    runs Docker. In the next section, we will dive into how to build Docker images
    for the microservices in our pet-clinic application.


    # Containerizing the Micronaut microservices using Jib


    Jib is a containerizing framework from Google that can seamlessly tie with Java
    build frameworks as Maven or Gradle to build container images. Jib has hugely
    simplified the process to create container (Docker) images. Let''s quickly see
    the workflow to create a Docker image:


    ![](img/768b67b9430f02ca52f7bb252e4a68e4_238_0.png)


    As you can see in the preceding diagram, to build a Docker image without Jib we
    need to build the **Source code** and create a **Docker file**. The **Docker daemon**
    then uses the build context to create a **Container image** and push it to the
    repository/registry.'
  merge: -1
  pgno: 238
