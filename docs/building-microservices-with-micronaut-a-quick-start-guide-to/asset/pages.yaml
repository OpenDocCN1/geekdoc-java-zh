  md: "# Using DTOs for the endpoint payloads\n\nThe DTO pattern originates from the\
    \ enterprise application architecture and fundamentally, data objects aggregate\
    \ and encapsulate the data to transfer. Since in the microservices architecture\
    \ an end client may need data from different persistence resources (such as invoice\
    \ data along with user data), the DTO pattern is very effective in limiting calls\
    \ to microservices for getting the desired projection of data. DTOs are also known\
    \ as assembler objects since they assemble data from multiple entity classes.\n\
    \nIn this section, we will explore how to implement and map (to an entity) DTOs.\
    \ In the later sections, we will further dive into using DTOs as an effective\
    \ mechanism to transfer data from and into a microservice. We will also look at\
    \ how DTOs can help reduce the number of calls to microservices by assembling\
    \ data.\n\n# Implementing DTOs\n\nTo implement a DTO, we will begin defining a\
    \ DTO class for the pet owner.\n\nOpen the pet-owner microservice project (created\
    \ in Chapter 2, Working on the Data Access) in your preferred IDE. Add the com.packpub.micronaut.service.dto\
    \ package to contain all DTOs. We define OwnerDTO as follows:\n\n```\n@Introspect\n\
    public class OwnerDTO implements Serializable {\n    private Long id;\n    private\
    \ String firstName;\n    private String lastName;\n    private String address;\n\
    \    private String city;\n    private String telephone;\n    private Set<PetDTO>\
    \ pets = new HashSet<>();\n    ... getters and setters\n}\n```\n\nOwnerDTO is\
    \ implementing the Serializable marker interface to mark that the DTO is serializable.\
    \ Furthermore, in continuation of our earlier discussion on the assembler pattern,\
    \ OwnerDTO will also contain a set of PetDTO instances.\n\nFollowing the similar\
    \ POJO model, we can define DTOs for other entities in the pet-owner microservice,\
    \ such as PetDTO, VisitDTO, and PetTypeDTO in the com.packpub.micronaut.service.dto\
    \ package."
