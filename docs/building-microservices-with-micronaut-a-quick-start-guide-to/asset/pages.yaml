  md: '# Integrating with a relational database using an ORM (Hibernate) framework
    31


    In Java, as a standard specification, the Java Persistence API (JPA) specifies
    the following:


    +   - Which Java objects ought to be persisted

    - How these objects should be persisted


    JPA is not a framework or tool but it dictates the standard protocol and covers
    the core concepts of what to elicit and how to persist. Various implementing frameworks
    such as Hibernate and Eclipse have adopted these JPA standards. We will be using
    Hibernate as our ORM framework.


    To get hands-on with Hibernate in the Micronaut framework, we will work on the
    small pet-clinic application and, specifically for Hibernate, we will focus on
    the pet-owner microservice. The following diagram capture the schema design for
