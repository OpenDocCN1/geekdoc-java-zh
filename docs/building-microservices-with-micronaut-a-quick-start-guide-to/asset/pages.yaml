  md: '# Basics of IoT


    IoT is a network of devices or things. These things can be anything – it can be
    a human wearing a health monitor, a pet wearing a geolocation sensor, a car with
    a tire pressure sensor, a television with voice/visual capability, or a smart
    speaker. IoT can also use advanced machine learning (ML) and artificial intelligence
    (AI) capabilities in the cloud to provide next-level services. IoT can make things
    smart with data collection and automation. The following diagram illustrates IoT:


    ![](img/768b67b9430f02ca52f7bb252e4a68e4_288_0.png)


    Figure 10.1 – Internet of Things (IoT)


    These devices or things have internet capabilities and are interconnected, so
    they act as an ecosystem. This ecosystem can connect, send, and act on data it
    acquires from other things. For example, you can turn on the lights at your home
    when you arrive.


    IoT provides significant benefits to individuals, businesses, and organizations.
    IoT can reduce manual work and intervention with seamless data transfer every
    day between two systems or devices. IoT devices become more significant every
    day in the consumer market, as it bears locks, doorbells, light bulbs, speakers,
    televisions, healthcare products, or fitness systems. IoT is mainly accessed in
    voice enabled ecosystems such as Google Home, Apple Siri, Amazon Alexa, Microsoft
    Cortana, Samsung Bixby, and more. There are numerous positive aspects of IoT;
    however, there are a few cons regarding security and privacy issues.'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'Now we have learned about the basics of IoT and its applications, let''s understand
    the basics of Alexa skills.


    # Working on the basics of Alexa skills


    Alexa is a cloud-based voice recognition service available on millions of devices
    from Amazon and third-party device manufacturers, such as televisions, Bluetooth
    speakers, headphones, automobiles, and so on. You can build interactive voice-based
    request-response applications using Alexa.


    Alexa can be integrated into various applications. Alexa also has screen capabilities
    for displaying responses visually, and Echo Show is an Alexa speaker with a display
    screen. The following diagram illustrates the Alexa architecture:


    ![](img/768b67b9430f02ca52f7bb252e4a68e4_289_0.png)


    # Amazon Alexa


    Figure 10.2 – Amazon Alexa architecture


    Users can say the wake-up word for the device, which is Alexa, and perform an
    operation. For example, to find the weather in your current location, you can
    say Alexa, what is the current weather? and you will receive a response, such
    as The current weather in your location is 28 degrees. Alexa skills are like apps,
    and you can enable or disable skills using the Alexa app for a specific device.
    Skills are voice-based Alexa capabilities.'
  merge: -1
  pgno: 289
- img_proc: true
  md: 'Working on the basics of Alexa skills 269


    Alexa can do the following:


    +   - Set an alarm.

    - Play music from Spotify, Apple Music, or Google Music.

    - Create a to-do list and add items to your shopping list.

    - Check the weather.

    - Check your calendar.

    - Read news briefings.

    - Check bank accounts.

    - Order in a restaurant.

    - Check facts on the internet.


    These are a few of the many things that Alexa can perform. Now, let''s move on
    and understand more Alexa.


    # Basics of Alexa skills


    Users with any voice-based assistants or tools can use the wake-up word to open
    the skill or application. For example, with Google Home, we use Google or OK Google,
    for Apple Siri, we use Hey Siri or Siri, and for Amazon Alexa, we use Alexa. This
    wake-up word can be replaced with Amazon, Echo, or computer. All Alexa skills
    have been designed based on the voice interaction model; that is, phrases you
    can say to the skill to do what you want, as Alexa, turn on the lights or Alexa,
    what is the current temperature?


    Alexa supports the following two types of voice interaction models:


    +   - Pre-built voice interaction model: Alexa defines the phrases for each skill
    for you.

    - Custom voice interaction model: You define the phrases that the user can say
    to interact with your skills.'
