    We will learn about architecting enterprise microservices in the next section.


    # Architecting enterprise microservices


    Implementing enterprise microservices requires understanding and motivation from
    multiple stakeholders in the organization. You need to plan and analyze whether
    a microservice is the right fit for the problem at hand. If it is a fit, then
    you design, develop, deploy, and maintain the service.


    Before you using microservices, let''s understand when not to use them. Ask yourself
    the following questions:


    +   * Does your team know about microservices?

    * Is your business mature enough to adopt microservices?

    * Do you have an Agile DevOps practice and infrastructure?

    * Do you have a scalable on-premises or cloud infrastructure?'
  merge: -1
  pgno: 316
- img_proc: true
  md: '296 Building Enterprise-Grade Microservices


    +   - Do you have support to use modern tools and technology?

    - Is your database ready to be decentralized?

    - Do you have support from all the stakeholders?


    If your answer is yes to each of these questions, you can adapt and roll out microservices.
    The hardest part of rolling out microservices is your data and infrastructure.
    Traditionally, applications are designed to be big monolithic apps compared to
    decentralized, loosely coupled microservices. When you architect a microservice,
    you need to apply multiple techniques during the various phases. The following
    diagram illustrates the stages of rolling out microservices.


    ![](img/768b67b9430f02ca52f7bb252e4a68e4_317_0.png)


    Figure 11.2 – Phases of architecting and rolling out enterprise microservices


    We’ll look at each of these stages in the following sections.


    # Planning and analysis


    Before you create an architecture for an enterprise microservice, you need to
    analyze whether it is a good fit based on your requirements. You can also implement
    microservices for just a part of the application.


    Transitioning from a traditional monolithic architecture to microservices can
    be a time-consuming and complex process. However, if it is planned well, it can
    be rolled out seamlessly. Getting all stakeholders to support this is crucial,
    and this can be accomplished in the planning and analysis phase. Team members
    having knowledge of microservices is also vital and a critical success factor.'
