  md: '# Implementing the API gateway


    To the earlier discussion on dynamic network locations in the microservices architecture,
    we will focus on the API gateway now. The API gateway is an orchestrator service
    meant to provide unified, ubiquitous access to all the services. Though we have
    multiple microservices running in the backend, an API gateway can provide a unified
    interface for the upstream consumers to access them. For the upstream consumers,
    the API gateway appears to be the only service running in the backend. On receiving
    a client request, the API gateway determines which instance to call using service
    discovery.


    In order to learn how to implement the API gateway, we will add an API gateway
    service to the pet-clinic application. Since this microservice is an orchestrator
    service, we can call it pet-clinic-concierge. The system components after the
    gateway service would be as seen in Figure 7.6:


    ![](img/768b67b9430f02ca52f7bb252e4a68e4_225_0.png)


    Figure 7.6 – Pet Clinic Application with service discovery and an API gateway


    In the preceding diagram, we can see the API Gateway and Service Discovery orchestration
    in the pet-clinic application. The pet-clinic-concierge service will implement
    the API gateway, and any service consumer will invoke the gateway (not the service
    or service discovery), which will determine the service instance by synchronizing
    up with service discovery. The double-line connectors in the diagram show how
    an actual service request will be executed inside the pet-clinic application.'
