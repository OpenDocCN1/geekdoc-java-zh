- img_proc: true
  md: "# Using DTOs for the endpoint payloads 81\n\n```\n<annotationProcessorPaths>\n\
    \  <path>\n    <groupId>org.mapstruct</groupId>\n    <artifactId>mapstruct-processor</artifactId>\n\
    \    <version>${org.mapstruct.version}</version>\n  </path>\n  <!-- other annotation\
    \ processors -->\n</annotationProcessorPaths>\n<compilerArgs>\n  <arg>-DmapStruct.defaultComponentModel=jsr330</arg>\n\
    </compilerArgs>\n</configuration>\n</plugins>\n</build>\n```\n\nThe annotation\
    \ processing settings in POM will direct the Java annotation processor to generate\
    \ source code for mappings that are marked using MapStruct annotations. In addition,\
    \ jsr330 is specified as a default component model in the context of the Micronaut\
    \ framework (in Spring, a Spring model is often used).\n\nWe will create a new\
    \ package named com.packpub.micronaut.service.mapper to contain all the mapper\
    \ interfaces. Abstract out a generic mapper, we can declare the following interface:\n\
    \n```\npublic interface EntityMapper<D, E> {\n  E toEntity(D dto);\n  D toDto(E\
    \ entity);\n  List<E> toEntity(List<D> dtoList);\n  List<D> toDto(List<E> entityList);\n\
    }\n```"
