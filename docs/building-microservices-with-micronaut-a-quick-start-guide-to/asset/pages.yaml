  md: '# Understanding event-driven architecture


    Event-driven architecture is pivotal in connecting microservices. Before we dive
    into how to implement an event-driven interaction system, let''s understand its
    fundamentals.


    The following are the key components at the core of any event-driven architecture
    implementation:


    +   - Event: An event is simply a change in the state of the system that needs
    to be traced. In a microservice architecture, a microservice may detect or detect
    a change in the data''s state that might be worth noting by other services. This
    state change is communicated as an event.

    - Event producer: An event producer is any microservice or component that is making
    or detecting a state change and generating an event for other components/services
    in the system.

    - Event consumer: An event consumer is any microservice or component that is consuming
    an event. Interestingly, this event consumption might trigger this component to
    produce another event.

    - Event broker: The event broker acts as a go-between between all the producer
    and consumer parties. It maintains a metadata quorum to keep track of events.


    These key come together to realize an event-driven architecture. Broadly speaking,
    there are two implementation strategies – pub/sub (also called event messaging)
    and event streaming. To learn more about these strategies, let''s dive into the
    following sections.


    # Event messaging or a pub/sub model in an event-driven architecture


    A pub/sub model is a push-based model. In a push-based model, event publishing
    is owned by the event producer, and events are pushed from the producer and sent
    to consumers. The following are the key components in a pub/sub implementation:


    +   - Event producer: Any component that is making or detecting a state change
    will generate an event and publish it to the event broker.

    - Event broker: The event broker will receive the generated event and push the
    event to all the required event queues. These event queues are subscribed to event
    consumers. Therefore, events are pushed down to the event consumers by the broker.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# Integrating Microservices Using Event-Driven Architecture


    +   - Event consumer: The event consumer will receive the event and do what is
    required. It may also generate a new event(s).


    This is depicted in the following diagram:


    ![](img/768b67b9430f02ca52f7bb252e4a68e4_167_0.png)


    Figure 5.1 – Pub/sub model


    As shown in the preceding diagram, when Event Producer 1 generates the Event Foo,
    it is pushed to the Event Broker. The Event Broker further pushes this event to
    Event Consumer 1 and Event Consumer 2.


    So, overall, for Event Bar (which is generated by Event Producer n), Event Broker
    pushes it to Event Consumer k.


    In a pub/sub model, once the event is produced and communicated to the consumer
    via the event broker, the event consumer must do the necessary immediately, as
    once an event is consumed, it perishes. The event consumer can never go back to
    historic events. This model is sometimes referred to as the event messaging model.


    # Event streaming in event-driven architecture


    An event streaming model is a pull-based model. In a pull-based model, the onus
    is on the event consumer to fetch the event. In an event streaming implementation,
    the key components will act as follows:


    +   - Event producer: Any component that is making or detecting a state change
    will generate the event and send it to the event broker.


    +   - Event broker: The event broker will receive the generated event and broadcast
    the event by putting the event in an event stream.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# Understanding event-driven architecture


    **Event consumer**: The event consumer continuously monitors one or more event
    streams on the event broker. When a new event is pushed to the event stream, the
    event consumer fetches the event and does what is required.


    Refer to the following diagram:


    ![](img/768b67b9430f02ca52f7bb252e4a68e4_168_0.png)


    Figure 5.2 – Event streaming model


    As shown in the preceding diagram, when **Event Producer 1** generates the **Event
    Foo**, it pushes the event to **Event Broker** and **Event Broker** puts it in
    the **Foo Stream**. **Event Consumer 1** and **Event Consumer 2** fetch the event
    from the **Foo Stream**. **Event Bar** is fetched from **Bar Stream** by **Event
    Consumer k.**


    In an event-streaming model, as event consumers fetch the data from an event stream,
    they can fetch any offset of the event stream. This enables event consumers to
    access historic events. It especially comes handy if you have a new consumer added
    to the system that might not be in touch with the recent state of the system and
    may start processing historic events first. For these reasons, event streaming
    is usually preferred over event messaging.


    In the next section, we will get started with hands-on event streaming using a
    popular event-streaming stack.'
  merge: -1
