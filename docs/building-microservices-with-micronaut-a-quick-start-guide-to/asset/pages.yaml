  md: '# 7 Handling Microservice Concerns


    Any microservice architecture implementation is incomplete without handling some
    fundamental microservice concerns such as configuration management, API documentation,
    service discovery, API gateways, and fault tolerance. Hitherto we were focused
    on the disintegration journey of the microservices, such as how to separate the
    concerns in modular microservices. For seamless and unified application access,
    we need the microservices to integrate and expose a coalesced interface. A coalesced
    interface enables the upstream consumers to interact back with backend microservices
    as though they were one.


    A key benefit of implementing microservices is fault tolerance. Fault tolerance
    mechanisms such as on-demand scaling, fallbacks, and circuit breakers make microservices
    ubiquitous and robust.


    In this chapter, we will explore ways to handle and implement the following microservice
    concerns:


    +   - Externalizing the application configuration

    - Documenting the service APIs'
  merge: -1
