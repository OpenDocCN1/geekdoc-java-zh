  md: '# 4 Getting Started with Microservices Using the Micronaut Framework


    In this chapter, we will focus on these topics in particular:


    +   - Introducing microservices and their evolution

    - Understanding microservices design patterns

    - Why Micronaut is the best choice for developing microservices

    - Getting started with the Micronaut framework

    - Working on the hello world project in the Micronaut framework


    By the end of this chapter, you will have an understanding of how web services
    evolved in microservices and how traditional Java frameworks are ineffective for
    developing microservices compared to the Micronaut framework. Furthermore, you
    will also gain the practical knowledge to start using the Micronaut framework
    by working on a small project in the Micronaut framework.


    # Technical requirements


    All the commands and technical instructions in this chapter are run on Windows
    10 and mac OS X. Code examples covered in this chapter are available in the book''s
    GitHub repository at https://github.com/PacktPublishing/Building-Microservices-with-Micronaut/tree/master/Chapter01.


    The following tools need to be installed and set up in the development environment:


    +   - Java SDK: Version 13 or above (we used Java 14).

    - Maven: This is optional and required if you would like to use Maven as the build
    system. However, we recommend having Maven set up on any development machine.
    Instructions to download and install Maven can be found at https://maven.apache.org/download.cgi.

    - Development IDE: Based on your preferences, any Java-based IDE can be used,
    for the purpose of writing this chapter, IntelliJ.

    - Git: Instructions to download and install Git can be found at https://git-scm.com/downloads.'
  merge: -1
