  md: "# Testing Microservices\n\nTo perform a unit test, isolation is required. Essentially,\
    \ we need to isolate the object's behavior (that we want to test) while ignoring\
    \ the object's interaction with other objects/components within the system. To\
    \ achieve this isolation, we have various mechanisms in unit testing:\n\n+   -\
    \ **Mocking.** Mocking is an operation to create a test double in which a testing\
    \ framework will create a mock/dummy object based on the class definition of the\
    \ object (compile time). To isolate the object's interaction with other interacting\
    \ objects, we can simply mock the interacting objects. When a unit test is executed\
    \ for the subject object, it will skip interactions with other objects.\n- **Spying.**\
    \ Spying when we create a test double by probing the actual instance of the object\
    \ (runtime). A spy object will just be the same as the real object barring any\
    \ stubs. Stubs are used to define a dummy invocation so that the spy object will\
    \ execute normally but an invocation matches a stub definition, then it will execute\
    \ the dummy behavior defined by the stub.\n\nThough mocking and spying can help\
    \ to isolate the behavior, sometimes the subject object may not be interacting\
    \ with other so no test doubles are required. In the next section, we will begin\
    \ with how to implement unit tests in the Micronaut framework using JUnit 5.\n\
    \n# Unit testing using JUnit 5\n\nIn order to learn how to implement unit tests\
    \ in the Micronaut framework, we will resume the code base from Chapter 5, Integrating\
    \ Microservices Using the Event-Driven Architecture. We will continue with the\
    \ pet-owner microservice and make sure you have the following dependencies added\
    \ to the project pom.:\n\n```\n<dependency>\n  <groupId>org.junit.jupiter</groupId>\n\
    \  <artifactId>junit-jupiter-api</artifactId>\n  <scope>test</scope>\n</dependency>\n\
    <dependency>\n  <groupId>org.junit.jupiter</groupId>\n  <artifactId>junit-jupiter-engine</artifactId>\n\
    \  <scope>test</scope>\n</dependency>\n<dependency>\n  <groupId>io.micronaut.test</groupId>\n\
    ```"
