  md: '# # 6

    Testing Microservices


    In a rather simple definition, **software testing** is verifying that a produced
    software application is functioning as expected. Since the early days of programming
    languages and software development, good precedents have been set to ensure they
    are **functioning as expected**. Almost programming languages (barring some scripting
    languages) have robust compilers to check anomalies at compile time. Though compile-time
    checks are good to start with, they can''t verify whether a software application
    will run just as expected at runtime. For peace of mind, software development
    teams perform various kinds of testing to verify that a software application will
    function as expected. And any testing exercise will increase manifold with an
    increase in the number of distributed components or, put simply, it''s rather
    more easy to test a monolithic application than a distributed one. To save time
    and decrease the turnaround time to deliver a feature, it''s efficient to automate
    testing at various levels.


    In this chapter, we will explore how we can automate testing at various levels
    of microservices. We will dive into the following topics:


    +   - Understanding the testing pyramid

    - Unit testing in the Micronaut framework

