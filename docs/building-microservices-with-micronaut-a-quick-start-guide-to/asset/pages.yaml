    # Using JWT authentication to secure the service endpoints


    In token-based authentication, the user state is stored at the client side. When
    a client logs in to the server, the server encrypts the user data into a token
    with a secret and sends it back to the client. Any subsequent requests must have
    this token in the request header. The server retrieves the token, validates the
    authenticity, and resumes the user session:


    ![](img/768b67b9430f02ca52f7bb252e4a68e4_144_0.png)


    Figure 4.9 – Token-based authentication


    As shown in the preceding diagram, in a token-based authentication strategy, the
    client does the heavy lifting of keeping track of the session in the JSON web
    token. A client must provide a valid token to resume the session.'
