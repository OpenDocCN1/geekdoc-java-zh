  md: "# Implementing service discovery\n\nIn the monolithic architecture, if an application\
    \ has multiple services often these services are running on fixed and well-known\
    \ locations (such as a URL or ports). This understanding of \"well-known\" is\
    \ coupled to the code logic to make inter-service calls. A consumer service will\
    \ call another service either at the code level or via hardcoded remote calls\
    \ over the network.\n\nBy contrast, often microservices are running in virtualized\
    \ or containerized environments and IP ports are assigned dynamically. To facilitate\
    \ inter-service calls, we implement service discovery. In the service discovery\
    \ pattern, all the microservices will register their running instances with service\
    \ discovery, and clients (that is, upstream clients or another service) will then\
    \ sync with service discovery to get the network location of the required service.\
    \ Furthermore, service discovery will maintain a continuous health check on all\
    \ the registered services. In the following section, we will implement service\
    \ discovery using Consul in the Micronaut framework.\n\n# Implementing service\
    \ discovery using Consul\n\nTo enable service discovery, you need to import the\
    \ following dependency in the pom xml project file. We have already added this\
    \ to the pet-owner microservice; now add this to the pet-clinic and pet-clinic-reviews\
    \ microservices as well:\n\n```\n<<!-- Service discovery -->\n<dependency>\n \
    \ <groupId>io.micronaut</groupId>\n  <artifactId>micronaut-discovery-client</artifactId>\n\
    </dependency>\n```\n\nOnce micronaut-discovery-client is imported into the services,\
    \ we can leverage its service discovery capabilities.\n\nIn order to synchronize\
    \ the services with Consul, make the following changes in the pet-clinic and pet-clinic-reviews\
    \ microservices:\n\n```\nconsul:\nclient:\n  registration:\n    enabled: true\n\
    ```"
  merge: -1
  pgno: 223
- img_proc: true
  md: 'By making these changes, we enable the pet-clinic and pet-clinic-reviews microservices
    to register with Consul service discovery. Micronaut''s micronaut-discovery-client
    implementation already has the required tools so we don''t need to make any code
    changes. To verify that all the services are registered with Consul, just run
    the services and they will automatically register with their application name,
    as shown in the following screenshot:


    > Note

    If you are using Apache Kafka in the pet-clinic and pet-clinic-microservices,
    then start the Docker container for Apache Kafka before the services start up.


    ![](img/768b67b9430f02ca52f7bb252e4a68e4_224_0.png)


