- img_proc: true
  md: "# Distributed logging in Micronaut microservices 241\n\nIn logstash.config,\
    \ we have the following three sections:\n\n+   - input: Logstash has the power\
    \ to aggregate more than 50 different kinds of log sources. Input configs configure\
    \ Logstash for one or more input sources. In our configuration, we are enabling\
    \ tcp input on port 5000.\n- filter: Logstash's filter provides an easy way to\
    \ transform the incoming logs into filter-defined logs. These events are then\
    \ pushed to storage. In the preceding configuration, we are using a grok filter\
    \ along with mutate to add extra information (app_name and app_port) to the events.\n\
    - output: The output section configures the receiving sources so that Logstash\
    \ can push the logs to the configured output sources. In the preceding configuration,\
    \ we are configuring the standard output and Elasticsearch to receive the produced\
    \ logs.\n\nSo far, we have booted an ELK Docker instance with Logstash configured\
    \ to receive, transform, and send logs into Elasticsearch. Next, we will make\
    \ required amendments in the pet-clinic microservices so that logs can be shipped\
    \ to Logstash.\n\n# Configuring microservices for distributed logging\n\nIn order\
    \ to make the pet-clinic microservice aggregate and ship logs to Logstash, we\
    \ need to add the following logstash-logback-encoder dependency to all the microservice\
    \ pom.xml files:\n\n```\n<dependency>\n  <groupId>net.logstash.logback</groupId>\n\
    \  <artifactId>logstash-logback-encoder</artifactId>\n  <version>6.3</version>\n\
    </dependency>\n```\n\nBy importing logstash-logback-encoder, we can leverage the\
    \ net.logstash.logback.appender.LogstashTcpSocketAppender class in logback.xml.\
    \ This class provides the logstash appender, which can ship logs to the Logstash\
    \ server from the microservice."
  merge: -1
  pgno: 262
- img_proc: true
  md: "Modify logback.xml for all microservices by adding the Logstash appender as\
    \ follows:\n\n```\n<appender name=\"logstash\" class=\"net.logstash.logback.app.LogstashTcpSocketAppender\"\
    >\n  <param name=\"Encoding\" value=\"UTF-8\"/>\n  <remoteHost>host.docker.internal</remoteHost>\n\
    \  <port>5000</port>\n  <encoder class=\"net.logstash.logback.encoder.LogstashEncoder\"\
    />\n</appender>\n\n<root level=\"debug\">\n  <app-ref ref=\"logstash\"/>\n  <app-ref\
    \ ref=\"stdout\"/>\n</root>\n```\n\nThe Logstash appender will help in shipping\
    \ the logs to localhost:5000 as we are running Logstash in a Docker container,\
    \ we provide the address as host.docker.internal.\n\nAlso, we need to add the\
