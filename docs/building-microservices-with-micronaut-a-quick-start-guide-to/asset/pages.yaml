  md: '# Foreword


    In March of 2018, Micronaut* co-founder, Graeme Rocher, delivered a keynote address
    at Madrid''s Greach conference in which he introduced a brand-new, open-source,
    full-stack, JVM software development framework. Although Graeme and the rest of
    the core development team at the Framework''s home, Object Computing, knew they
    had built a groundbreaking toolset that was poised to revolutionize the way microservices
    and serverless applications performed, they could not have predicted the incredible
    amount of enthusiasm and support the Framework and the team would quickly receive
    following the product''s launch.


    By shifting framework infrastructure into a compiler feature, the Micronaut framework
    has significantly transformed the way developers view startup time and memory
    consumption when building microservices and serverless applications. It has upended
    the way developers approach framework design in server-side Java and rewritten
    the book on how frameworks should be built in the post-Java EE world.


    The Framework is being used at SmartThings, StainAI, Minecraft, and many other
    organizations around the globe. It has been featured at tech conferences around
    the world, reached a Trial status in the ''Languages and Frameworks'' section
    of ThoughtWorks'' Technology Radar, received its online hipster in Minecraft''s
    Micronaut Blueprint, and had more than 60,000 apps created on Micronaut Launch,
    an online tool for quickly and easily creating Micronaut applications.


    It is not at an exaggeration to say that the Micronaut framework is a hit!'
  merge: -1
