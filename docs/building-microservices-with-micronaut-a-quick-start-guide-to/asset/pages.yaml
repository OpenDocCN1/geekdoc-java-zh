  md: '# Summary


    In this chapter, we brought everything we''d learned about the previous chapters
    together. Then, we dived into architecting enterprise-grade microservices. We
    also learned about scaling microservices, the different types of scaling, and
    their advantages.


    This chapter enhanced your Micronaut microservices knowledge so that you can make
    production-ready applications. It has equipped you with all the necessary skills
    and expertise. We started the journey with the basics of microservices, and now
    we have the knowledge to create enterprise-grade microservices with Micronaut.
    We hope you enjoyed the journey of learning with us.


    # Questions


    +   1. Name a few factors you should consider when architecting microservices.

    2. Name a few design patterns.

    3. What factors should you consider during the design phase of microservices?

    4. What factors should you consider during the development phase of microservices?

    5. Name a few tools that are used in the deployment phase.

    6. Name a few tools that are used in the manage and maintain phase.

    7. What are the different types of scaling?

    8. What type of scaling is used in a microservices architecture.'
