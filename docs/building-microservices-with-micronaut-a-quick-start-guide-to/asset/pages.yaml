  md: '# 108 Securing the Microservices


    With the aforementioned hands-on exercises, we will be covering the following
    topics in this chapter:


    +   * Using session authentication to secure the service endpoints

    * Using JWT authentication to secure the service endpoints

    * Using OAuth to secure the service endpoints


    By the end of this chapter, you will have a nifty knowledge of working with various
    authentication strategies and local or cloud identity providers in the Micronaut
    framework.


    # Technical requirements


    All the commands and technical instructions in this chapter are run on Windows
    and Mac OS X. Code examples covered in this chapter are available in the book''s
    GitHub repository at https://github.com/PacktPublishing/Building-Microservices-with-Micronaut/tree/master/Chapter04.


    The following tools need to be installed and set up in the development environment:


    +   * Java SDK: Version 13 or above (we use Java 14).

    * Maven: This is optional and only required if you like to use Maven as the build
    system. However, we recommend having Maven up on any development machine. Instructions
    to download and install Maven can be found at https://maven.apache.org/download.cgi.

    * Development IDE: Based on your preference, any Java-based IDE can be used, for
    the purpose of writing this chapter, IntelliJ was used.

    * Git: Instructions to download and install Git can be found at https://git-scm.com/downloads.

    * PostgreSQL: Instructions to download and install PostgreSQL can be found at
    https://www.postgresql.org/download/.

    * MongoDB: MongoDB Atlas provides a free online database-as-a-service with up
    to 512 MB storage. However, if a local database is preferred, instructions to
    download and install can be found at https://docs.mongodb.com/manual/administration/install-community/.
    We used a local installation for this chapter.'
