    users. Once the users are created, we can proceed with the pet-clinic-reviews
    microservice changes.


    In the next section, we will dive into making pet-clinic-reviews secure but let''s
    first start with enabling SSL to make encrypted communication over HTTPS.


    # Enabling SSL in the Micronaut framework


    Any security safeguard is incomplete if a microservice is not exposed to HTTPS.
    In earlier sections, we purposely focused on authentication and authorization
    while skipping SSL. As we will be using a third-party identity provided over the
    cloud, it''s recommended and required to enable SSL in the pet-clinic-reviews
    microservice.


    To enable SSL, we will need an SSL certificate for localhost. We will be creating
    a self-signed certificate using OpenSSL. Follow these instructions for creating
    a self-signed certificate using OpenSSL:


    +   1. Open a Git terminal.


    +   2. Change directory to the root directory of the pet-clinic-reviews projects.


    +   3. Run winpty openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem
    -days 365 in Git Bash. Provide the correct information to create a self-signed
    certificate. This will create a key.pem file and cert.pem file in the opened directory.


    +   4. Combine the key and certificate files, run winpty openssl pkcs12 -in key.pem
    -in cert.pem -out cert.p12 in Git Bash.


    +   5. Verify that you created the P12 file, run winpty openssl pkcs12 -in cert.p12
    -noout -info in Git Bash. You must provide the password that was used to create
    the P12 file.


    Following the previous instructions, we can successfully create a platform-agnostic
    certificate. The P12 format has gained popularity as it can be used across platforms
    and operating systems. Next, we will add this certificate to the host operating
    system trust store so it can be trusted by all the running applications on the
    system. Follow the instructions mentioned next to add the certificate to the trust
    store:


    +   1. Determine $JAVA_HOME. It can be found in the system variables.


    +   2. Copy the just-created cert.pem file to $JAVA_HOME/jre/lib/security/cacerts.'
