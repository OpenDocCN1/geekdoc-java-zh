  md: '# Using Micronaut''s HTTP server APIs 97


    We requested to delete the owner that we inserted/updated in previous examples.
    As anticipated, the request was successful and an HTTP 204 response was returned.


    So far, we have explored how to create all different types of restful endpoints.
    This discussion paves our way into Micronaut''s HTTP server APIs. In the next
    section, we will cover some practical aspects of leveraging these server APIs.


    # Using Micronaut''s HTTP server APIs


    The Micronaut framework offers a non-blocking HTTP server based on Netty. These
    server APIs can be leveraged to address some useful microservice scenarios. To
    do any hands-on, we will continue with the pet-owner microservice.


    At the outset, we must have the following Maven dependency in the project POM:


    ```

    ...

    <dependency>

    <groupId>io.micronaut</groupId>

    <artifactId>micronaut-http-server-netty</artifactId>

    <scope>compile</scope>

    </dependency>

    ...

    ```


    This dependency should already be in the pet-owner project. In the next sections,
    we will explore some useful configurations in the HTTP server world.


    # Binding HTTP requests in the Micronaut framework


    There are several ways we can bind arguments to an HTTP request in the Micronaut
    framework:


    +   * @Body: As discussed before, @Body binds the argument from the body of the
    HTTP request.

    * @CookieValue: This binds an argument from the cookie value in the HTTP request.

    * @Header: This binds an argument from a header in the HTTP request.

    * @QueryValue: This binds an argument from a query parameter in the HTTP request.

    * @PathVariable: This binds an argument from the path in the HTTP request.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Working on RESTful Web Services


    +   - @Part: In a multi-part HTTP request, this binds the argument to a part.


    +   - @RequestBean: This binds any object (in the HTTP request) to a Java bean.


    Along with the preceding HTTP request bindings, a Micronaut framework supports
    multiple URI templates. These templates come in handy for creating various kinds
    of restful resources. Considering the owner resource, we can support the following
    URI template matching in Micronaut:


    | URI template | Description | Example |

    | --- | --- | --- |

    | /owners/(ID) | Fetch owner resource with a matching ID. | /owners/1 |

    | /owners/(ID:4) | Fetch owner resource with a maximum of four digits. where the
    ID can assume a value | /owners/321 |

    | /owners/(ID) | Fetch owners, if ID (optional) is provided then match an owner
    with the specified ID. | /owners or /owners/1 |

    | /owners/(?(pageNumber, pageSize) | Fetch owners, if optional query parameters
    are specified then filter and serve the request based on query parameters. | /?pageNumber=10,pageSize=10,locale=fr
    |

    | /owners/(ID:regex) | Fetch owner resource with a matching ID, where the ID can
    assume a value only according to the regex. | /owners/1 |

    | /owners/(ID:[0-9]+) | | |


    Table 3.2 – URI templates in the Micronaut framework


    In the preceding table, we can see various approaches in matching/restricting
    an incoming HTTP request and what each approach can achieve for a specific resource.
    In the next section, we will discuss how we validate the data in an HTTP request.


    # Validating data


    The Micronaut framework supports both JSR 380 validations as well as hibernate
    bean validations. By default, a Micronaut project usually contains a micronaut-validation
    dependency, which is implemented based on the JSR 380 standard.


    Using validation annotations as @NotNull and @NotEmpty, we can verify whether
    an argument/parameter is meeting all validation criteria or before processing
    a request. Some useful annotations are follows:


    +   - @NotNull: This asserts if the argument/parameter value is not null, for
    example, @NotNull @PathVariable String ownerId.


    +   - @NotEmpty: This asserts if the argument is not null and not empty. It can
    be applied to any argument of the String, Collection, or Map type, and so on,
    for example, @NotEmpty @PathVariable String ownerId.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '+   @Min: This validates the annotated property has a value greater than or
    equal to the value attribute, for example, @Min(value = 0) Integer offset.


    +   @Max: This validates that the annotated property has a value equal to or smaller
    than the value attribute, for example, @Max (value =100) Integer offset.


    +   @Valid: Valid validates all arguments/parameters within the object graph.
    It recursively scans all inner @Valid uses within the object graph and determines
    the final validation after checking everything.


    If any of these validations are not met, javax.validation.ConstraintViolationException
    is thrown.


    To handle constraint violation exceptions as well as other checked/unchecked exceptions,
    we will explore some options in the next section.


    # Handling errors


    The Micronaut framework provides good coverage on raising different kinds of exceptions
    throughout the life cycle of an HTTP request while handling these exceptions.
    The standard exception handlers can be found in the io.micronaut.server.exceptions
    package. By default, the following handlers are provided within this package:


    +   ContentLengthExceeded: This handles ContentLengthExceededException by returning
    an HttpStatus.REQUEST_ENTITY_TOO_LARGE response.


    +   ConversionErrorHandler: This handles ConversionErrorException by returning
    an HttpStatus.BAD_REQUEST response.


    +   HttpStatusHandler: This handles HttpStatusException by returning HttpStatus
    as specified in the HttpStatusException response.


    +   JsonExceptionHandler: This handles JsonProcessingException by returning an
    HttpStatus.BAD_REQUEST response.


    +   UnsatisfiedArgumentHandler: This handles UnsatisfiedArgumentException by returning
    an HttpStatus.BAD_REQUEST response.


    +   URISyntaxHandler: This handles URISyntaxException by returning an HttpStatus.BAD_REQUEST
    response.


    In addition to the preceding standard exceptions and exception handlers, we can
    create our custom exceptions and exception handlers.'
