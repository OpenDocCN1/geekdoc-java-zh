    \  codec => rubydebug\n  }\nelasticsearch {\n  hosts => [\n    \"${XPACK_MONITORING_ELASTICSEARCH_HOSTS}\"\
    \ \n  ]\n  user => \"${XPACK_MONITORING_ELASTICSEARCH_USERNAME}\n  password =>\
    \ \"${XPACK_MONITORING_ELASTICSEARCH_PASSWORD}\n  index => \"logstash-%{YYYY.MM.dd}\"\
