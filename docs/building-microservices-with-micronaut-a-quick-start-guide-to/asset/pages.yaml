    # Distributed tracing in Micronaut microservices


    Distributed tracing is the capability of the system to track and observe the execution
    flow of a request in distributed systems by collecting data as the request further
    from one service component to another. This trace compiles metrics such as the
    time taken at each service along with end-to-end execution flow. Time metrics
    can help to zero down performance issues as which service component is a bottleneck
    to the execution flow and why.


    A trace is a Gantt-like data structure that stores the trace information in spans.
    Each span will keep a trace for the execution flow in a particular service component.
    Furthermore, a span can have a reference to parent span and child spans. Refer
    to the following figure:


    ![](img/768b67b9430f02ca52f7bb252e4a68e4_267_0.png)


    Figure 9.5 – Distributed tracing'
  merge: -1
  pgno: 267
- img_proc: true
  md: "# Distributed tracing in Micronaut 247\n\nIn the preceding diagram, we can\
    \ see the traces/spans for loading the foo page on the user interface app. It\
    \ calls Service A to get the foo object, which in turns Service B and Service\
    \ C to get Bars and Bazs for foo, respectively. The time taken for the whole execution\
    \ will be the cumulative total of execution times at various service components.\n\
    \nIn the next section, we will implement a distributed tracing solution in the\
    \ pet-clinic application.\n\n# Implementing distributed tracing in Micronaut\n\
    \nIn order to get hands-on with distributed tracing in Micronaut, we will implement\
    \ Zipkin-based tracing in the pet-clinic application.\n\nWe will run a Zipkin\
    \ instance in Docker. To run Zipkin in Docker, perform the following steps:\n\n\
    +   1. Open Any Bash terminal.\n\n+   2. Run the docker run -d -p 9411:9411 openzipkin/zipkin\
    \ command.\nWait for Docker to download and instantiate Zipkin on port 9411. After\
    \ successful instantiation, you can verify Zipkin by accessing http://localhost:9411/zipkin.\n\
    \n+   3. Next, we will begin with the pet-clinic-concierge service, which is the\
    \ API gateway. Adding the following dependencies to the pet-clinic-concierge POM:\n\
    \n```\n<!-- Distributed tracing -->\n<dependency>\n  <groupId>io.micronaut</groupId>\n\
    \  <artifactId>micronaut-tracing</artifactId>\n  <version>${micronaut.version}</version>\n\
    \  <scope>compile</scope>\n</dependency>\n<dependency>\n  <groupId>io.zipkin.brave</groupId>\n\
    \  <artifactId>brave-instrumentation-http</artifactId>\n  <version>5.12.3</version>\n\
    \  <scope>runtime</scope>\n</dependency>\n<dependency>\n```"
  merge: -1
  pgno: 268
- img_proc: true
  md: "# Distributed Logging, Tracing, and Monitoring\n\n```\n<groupId>io.zipkin.reporter2</groupId>\n\
    <artifactId>zipkin-reporter</artifactId>\n<version>2.15.0</version>\n<scope>runtime</scope>\n\
    </dependency>\n<groupId>io.opentracing.brave</groupId>\n<artifactId>brave-opentracing</artifactId>\n\
    <version>0.37.2</version>\n<scope>compile</scope>\n</dependency>\n```\n\nBy importing\
    \ the preceding dependencies, we can leverage Micronaut as well as third-party\
    \ code artifacts for distributed tracing.\n\n+   4. To enable the distributed\
    \ tracing, we also need to amend application properties. Add the following properties\
    \ related to Zipkin:\n\n```\ntracing:\n  zipkin:\n    url: http://host.docker.internal:9411\n\
    \    enabled: true\n  sampler:\n    probability: 1\n```\n\nThe preceding application\
    \ properties for Zipkin are added at the root level. In url, we specified a Docker\
    \ instance of Zipkin running on localhost. Furthermore, we specify the sampler.probability\
    \ the value as 1 that will enable the tracing for all the user requests. This\
    \ probability can be reduced to any value between 0 and 1 where 0 means never\
    \ sample and 1 means sample every request.\n\n+   5. Next, we need to tag the\
    \ controller methods for spans. For managing the spans, we have the following\
    \ two tags in Micronaut:\n\n+   a. @NewSpan: This will create a new span beginning\
    \ from the method it’s tagged on.\n\n+   b. @ContinueSpan: This will continue\
    \ the previous span."
  merge: -1
  pgno: 269
- img_proc: true
  md: "# Distributed tracing Micronaut microservices 249\n\nSince all the client controllers\
    \ in pet-clinic-concierge are the interfacing points to all upstream consumers,\
    \ we use @NewSpan on these methods so that a new trace can begin. The following\
    \ are the span-related changes in OwnerResourceController:\n\n```\n@Controller(\"\
    /api\")\npublic class OwnerResourceController {\n    @Inject\n    OwnerResourceClient;\n\
    \    @NewSpan\n    @Post(\"/owners\")\n    public ResponseEntity<OwnerDTO>\n \
    \       createOwner(@SpanTag(\"owner.dto\") OwnerDTO ownerDTO) {\n           \
    \ return ownerResourceClient.createOwner(ownerDTO);\n        }\n    @NewSpan\n\
    \    @Put(\"/owners\")\n    public ResponseEntity<OwnerDTO> updateOwner(\n   \
    \     (@SpanTag(\"owner.dto\") @Body OwnerDTO ownerDTO) {\n            return\
    \ ownerResourceClient.updateOwner(ownerDTO);\n        }\n    ...\n}\n}\n```\n\n\
    Similar changes to annotate client controller methods should be made in all the\
    \ other clients for the pet-owner, pet-clinic, and pet-clinic-reviews microservices.\n\
    Next, we need to modify the pet-clinic microservice for distributed tracing.\n\
    \n# Modifying the pet-clinic microservice for distributed tracing\n\nContinuing\
    \ with distributed tracing changes, we need to make the required amends in the\
    \ pet-owner, pet-clinic, and pet-clinic-reviews microservices project POM and\
    \ application properties as explained in the previous section."
  merge: -1
