  md: '# # 3 Working on RESTful Web Services


    In any microservice development, one of the core aspects is how the microservice
    interfaces with the external world. RESTful or restful has emerged as the golden
    standard of building these service interfaces. RESTful treats all information
    exchange as a resource exchange among systems. A resource represents the state
    of the object at the time of the transfer, hence the term Representational State
    Transfer (REST). In this chapter, we will explore the key aspects of working on
    these restful interfaces in the Micronaut framework. We will continue with the
    controller-service-repository pattern and add restful endpoints to the microservice
    projects within the pet-clinic application. For outgoing and incoming payloads
    to these endpoints, we will use data transfer objects (DTOs) in tandem with MapStruct
    to map DTOs to/from entities. For hands-on work, we will work to add restful endpoints
    to the following microservices:


    +   - pet-owner: Working hands-on to add HTTP GET, POST, PUT, and DELETE endpoints
    for pet-owner schema objects

    - pet-clinic: Working hands-on to add HTTP GET, POST, PUT, and DELETE endpoints
    for pet-clinic schema objects

    - pet-clinic-review: Working hands-on to add HTTP GET, POST, PUT, and DELETE endpoints
    for the pet-clinic-reviews collection'
  merge: -1
  pgno: 96
