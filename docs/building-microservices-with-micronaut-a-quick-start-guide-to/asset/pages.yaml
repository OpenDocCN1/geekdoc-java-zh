    # Technical requirements


    All the commands and technical instructions in this chapter run on Windows 10
    and macOS. The code examples covered in this chapter are available on the book''s
    GitHub repo at https://github.com/PacktPublishing/Building-Microservices-with-Micronaut/tree/Chapter07.


    The following tools need to be installed and set up in the development environment:


    +   * Java SDK version 13 or older (we used Java 14).

    * Maven – This is optional and only required if you would like to use Maven as
    the build system. However, we recommend Maven set up on any development machine.
    Instructions to download and install Maven can be found at https://maven.apache.org/download.cgi.

    * A development IDE – Based on your preference, any Java-based-IDE can be used,
    but for purpose of writing this chapter, IntelliJ was used.

    * Git – Instructions to download and install this can be found at https://git-scm.com/downloads.

    * PostgreSQL – Instructions to download and install this can be found at https://www.postgresql.org/download/.

    * MongoDB – MongoDB Atlas provides a free online database-as-a-service with up
    to 52 MB storage. However, if a local database is preferred instructions to download
    and install this can be found at https://docs.mongodb.com/manual/administration/install-community/.
    We used a local installation for writing this chapter.

    * A REST client – Any HTTP REST client can be used. We used the Advanced REST
    Client Chrome plugin.

    * Docker – Instructions to download and install Docker can be found at https://docs.docker.com/get-docker/.'
