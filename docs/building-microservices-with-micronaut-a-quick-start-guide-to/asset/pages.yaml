    # Using spies in unit testing


    As discussed before, spying on a test framework will create a test double based
    on the actual runtime object of the class. While mocking creates a full double
    of the object, with spying we can control whether the test double is partial or
    full. In a spied object, we can stub method calls while keeping other method calls.
    In a scenario, the unit test will make dummy calls as well as real calls. Therefore,
    spying gives a bit more control over what we want to fake.'
