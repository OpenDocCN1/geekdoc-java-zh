  md: '# Preface


    Micronaut is a JVM-based framework for building lightweight, modular applications.
    It is a fast-growing framework designed to make creating microservices quick and
    easy. This book will help full stack/Java developers to build modular, high-performing,
    and reactive microservices-based applications using Micronaut.


    # Who this book is for


    This book is for developers who have been building microservices on traditional
    frameworks such as Spring Boot and are looking for a faster alternative. Intermediate
    knowledge of Java programming is required, along with a intermediate knowledge
    of implementing web services development in Java.


    # What this book covers


    Chapter 1, Getting Started with Microservices Using the Micronaut Framework, kicks
    off with some conceptual fundamentals on microservices and microservices design
    patterns. You are be introduced to the Micronaut framework and why this is the
    ideal framework for developing microservices. Later, you will get hands-on with
    the Micronaut framework by working on hello-world projects using Maven and Gradle.


    Chapter 2, Working on Data Access, covers aspects of working with various kinds
    of database and persistence frameworks. You will begin with an object-relational
    mapping framework while doing a hands-on Hibernate framework and then dive into
    using a persistence framework (MyBatis). Finally you will integrate with a non-relational
    database (MongoDB).


    Chapter 3, Working on RESTful Web Services, starts with a discussion on data transfer
    objects and mappers. You then dive into working with RESTful interfaces in the
    Micronaut framework. Later, you will learn about Micronaut''s HTTP server and
    client APIs.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# x Preface


    Chapter 4, Securing Web Services, covers various approaches to securing web endpoints
    in the Micronaut framework, such as session authentication, JWT, and OAuth.


    Chapter 5, Integrating Microservices Using Event-Driven Architecture, starts with
    event-driven architecture and two models for event publishing: a pull model and
    a push model. You then dive into event streaming and using Apache Kafka for integrating
    two microservices in the pet-clinic application (sample project).


    Chapter 6, Testing the Microservices, sheds light on various kinds of automated
    testing – unit testing, service testing, and integration testing, and how to employ
    these testing techniques in adopting a prudent automated policy to reduce cost
    and increase the robustness of microservices.


    Chapter 7, Handling the Microservices Concerns, covers some concerns while working
    on the microservices, as distributed configuration management, documenting service
    APIs, service discovery, and the API gateway. Later, you also explore the mechanisms
    for fault tolerance in the Micronaut framework.


    Chapter 8, Deploying the Microservices, covers the build and deployment aspects
    of microservices. You will kill things off by building the container artifacts
    using an automated tool and then leverage Docker Compose to deploy the microservices.


    Chapter 9, Distributed Logging, Tracing, and Monitoring, throws light on implementing
    the observability patterns in microservices with distributed logging, distributed
    tracing, and distributed monitoring.


    Chapter 10, IoT with Micronaut, jumpstarts with an introduction to IoT with Alexa,
    covering Alexa fundamentals and a hello-world example. Later, you will be able
    to integrate Micronaut with Alexa while working on the pet-clinic application.


    Chapter 11, Building Enterprise-Grade Microservices, covers the best practices
    for working on the microservices and how to build and scale enterprise-grade microservices.'
  merge: -1
