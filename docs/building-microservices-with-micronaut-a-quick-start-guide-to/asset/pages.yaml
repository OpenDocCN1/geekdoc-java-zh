  md: "The EntityMapper interface abstracts object-to-object and list-to-list conversion\
    \ methods. By extending this interface, we can easily define an interface to map\
    \ OwnerDTO to the Owner entity:\n\n```\n@Mapper(componentModel = \"jsr330\", uses\
    \ = {PetMapper.class})\npublic interface OwnerMapper extends EntityMapper<OwnerDTO,\
    \ Owner> {\n    default Owner fromId(Long id) {\n        if (id == null) {\n \
    \           return null;\n        }\n        Owner owner = new Owner();\n    \
    \    owner.setId(id);\n        return owner;\n    }\n}\n```\n\nThe OwnerMapper\
    \ interface extends EntityMapper and uses PetMapper. PetMapper is used to map\
    \ a set of PetDTO instances to Pet entities. PetMapper can be defined using the\
    \ very similar approach.\n\nAdhering to the same approach, we can then define\
    \ PetMapper, VisitMapper, and PetMapper for the Pet, Visit, and PetType entities,\
    \ respectively.\nSo, we have dived into DTOs and their mappings to corresponding\
    \ entity classes. In the next section, we will zero down on the service changes\
    \ concerning DTOs.\n\n# Modifying the services to use DTOs\n\nIn Chapter 2, Working\
    \ on the Data Access, to simplify the discussion, we defined service methods that\
    \ use entity classes directly. This approach is not recommended for a variety\
    \ of reasons, including the fact that we end up with coupling/coupling logic with\
    \ database entities or it can become hairy if a service needs to use multiple\
    \ entities. Put simply, we must separate the concerns by decoupling database entities\
    \ from business-required data objects.\n\nTo use DTOs in business services, we\
    \ will need to modify abstracting interfaces. The Owner interface can be modified\
    \ to use DTOs as follows:\n\n```\npublic interface OwnerService {\n    OwnerDTO\
    \ save(OwnerDTO ownerDTO);\n    Page<OwnerDTO> findAll(Pageable pageable);\n```"
