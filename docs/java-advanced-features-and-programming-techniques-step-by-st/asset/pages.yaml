  md: '# 13. Android and Java


    A great feature of Java is that it can be used to develop Android based applications.
    One reason why Java is favored as a programming language to develop Android apps,
    is because of its functionality as an object oriented programming language. To
    start developing Android based applications using Java, the first step is to download
    an IDE. Android Studio is a well renowned IDE for developing Android apps.


    Some of the features of Android Studio are:


    +   * Gradle-based build support.

    * Android-specific refactoring and quick fixes.

    * Lint tools to catch performance, usability, version compatibility and other
    problems.

    * ProGuard and app-signing capabilities.

    * Template-based wizards to create common Android designs and components.


    The Android Studio and SDK are available at the following link:

    https://developer.android.com/studio/index.html


    Once you download and install Android Studio, you go ahead and build a new project.
    Make sure to choose the basic template to begin with. The steps below show how
    to create a project in Android Studio.


    +   * First we start by giving our application a name.'
