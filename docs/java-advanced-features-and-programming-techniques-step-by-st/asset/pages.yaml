    as the name of the annotation, and define a member of the ‘String’ type with the
    ‘name’ value.


    # Step 2


    Append the ‘@Retention(RetentionPolicy.RUNTIME)’ statement to the annotation.
    This ensures that the annotation is available at runtime.


    # Step 3


    The next step is to access the annotation through reflection. Reflection is the
    process of gaining access to classes and methods at runtime. There is an entire
    chapter dedicated to reflection later in this book. But for now, it’s good to
    just know that the concept of getting the annotation values is called reflection.


    The best way to understand the entire process is with an example.


    # Example 35: The following program shows how to create an annotation.


    ```

    import java.lang.annotation.Annotation;

    import java.lang.annotation.Retention;

    import java.lang.annotation.RetentionPolicy;


    @Retention(RetentionPolicy.RUNTIME)

    @interface Author

    {

    String name();

    }

    @Author(name="John")

    ```'
