  md: '# 9. What is Java EE?


    So far we have looked at how to work with the standard Java programming language.
    Let''s quickly review what the Java world has available for developers and enterprises.
    There are currently four platforms available:


    +   - Java SE - This is the Standard Edition, which contains all the core Java
    libraries and the Java API. Here you also get access to the Java Virtual Machine
    which is used to run basic Java applications.


    +   - Java ME - This is the Micro Edition of Java. Here you get a subset of features
    of the main Java Standard Edition. This is good for developing applications on
    smaller devices such as mobile devices.


    +   - Java FX - This library is used for building rich internet based applications.
    Here you can design a modern look and feel application with a rich user interface.


    +   - Java EE - Finally you have the Enterprise Edition, which is used for developing
    enterprise based applications.


    Many organizations make use of the Java Enterprise Edition. This edition is based
    on a set of specifications. For example, the web specification is used for building
    web based applications. Let''s look at some of the components of the Java Enterprise
    Edition in more detail.


    # 9.1 Java Servlet


    Java Servlets are used to build dynamic webpages. The output normally generated
    by a servlet is HTML. The Java class, that needs to behave like a servlet, needs
    to conform to the specifications of the Java Servlet. The Java Servlet program
    is then hosted in a servlet container, which is used to run the servlet and provide
    the desired output. This is best understood through an example.'
  merge: -1
  pgno: 93
