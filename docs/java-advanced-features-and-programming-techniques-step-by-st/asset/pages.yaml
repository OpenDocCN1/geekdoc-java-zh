  md: "# 12. Java Database Connectivity (JDBC)\n\nThe Java Database Connectivity,\
    \ or JDBC, API is used to interact with databases. With JDBC we can make connections\
    \ to a database and work with the built-in SQL statements. First let's look at\
    \ the setup. In our example, we are going to work with a MySQL database as our\
    \ data source. The MySQL database setup can be downloaded from the link below:\n\
    \nhttps://dev.mysql.com/downloads/installer/\n\nOnce download and installed, let's\
    \ create the following:\n\n+   A database called ‘Person’\n\n+   A table ‘Per’\
    \ that has 2 columns. One column is titled ‘ID’ for the INT type, and the other\
    \ is titled ‘Name’ for the varchar type.\n\n+   Add one item to the table as ‘1\
    \ John’.\n\nNext we need to download the MySQL database connector for Java from\
    \ the following location:\n\nhttps://www.mysql.com/products/connector/\n\nOnce\
    \ done, we need to add the jar file as an external jar for our project. Now let's\
    \ add the following code to establish a connection to the database using JDBC\
    \ and read the contents of the table.\n\nExample 60: The following program shows\
    \ how to read data from a database table.\n\n```\nimport java.sql.*;\npublic class\
    \ Sample\n{\n    public static void main(String[] args) throws Exception\n   \
    \ {\n        Class.forName(\"com.mysql.jdbc.Driver\");\n        Connection con=DriverManager.getConnection(\n\
    \        \"jdbc:mysql://localhost:3306/Person\",\"admin\",\"password\");\n   \
    \     Statement stmt=con.createStatement();\n```"
