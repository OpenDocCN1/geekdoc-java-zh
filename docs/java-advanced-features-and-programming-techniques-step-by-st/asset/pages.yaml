  md: '# 1. Collections


    Collections are special classes in Java that makes working with special data classes
    much easier. For example, imagine we have a collection called the ArrayList collection,
    and we want to find out the size of the array. Instead of writing special code
    to find the size, we can use a built-in function of the collection called size()
    to get the size of the array.


    Some of the notable advantages of collections are:


    +   - It reduces the programming effort required by the developer, since these
    are built-in available data structures and algorithms that don''t have to written
    from scratch.

    - It increases performance by providing high-performance implementation of data
    structures and algorithms.

    - It provides interoperability between unrelated APIs, by establishing a common
    language in order to pass collections back and forth.

    - It also reduces the effort required to learn APIs, by lessening the need to
    learn multiple hoc APIs.


    The following collections are present in Java:


    +   - ArrayList - The array container is used to store a contiguous set of values
    of the same data type.

    - HashSet - This collection is used to store elements in such a way that there
    are no duplicate elements.

    - ArrayDeque - This collection is similar to a queue, but here we can add elements
    at both the beginning and end of the queue.

    - HashMap – This is a collection which is a set of key value pairs.


    Let''s look at each collection in more detail.


    # 1.1 ArrayList


    The ArrayList container is used to store a contiguous set of values of the same
    data type. Let''s look at the definition of an array container via a'
