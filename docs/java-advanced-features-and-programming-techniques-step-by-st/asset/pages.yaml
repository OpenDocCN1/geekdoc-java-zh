  md: "# 5. Java Annotations\n\nAnnotations are used to provide metadata or more information\
    \ about the program. As such, they don't have any direct effect on the program\
    \ code itself and are only used to describe the program.\n\nSome examples of how\
    \ annotations can be used are:\n\n+   - Information for the compiler — Annotations\
    \ can be used by the compiler to detect errors or suppress warnings.\n- Compile\
    \ time and deployment time processing — Software tools process annotation information\
    \ to generate code, XML files, and so forth.\n- Runtime processing — Some annotations\
    \ are available at runtime.\n\nThe simplest form of an annotation is as follows:\n\
    \n```\n@annotationname\n```\n\nIn the above code line, the ‘@’ symbol indicates\
    \ to the compiler that this is an annotation. One of the most common annotations\
    \ you would see is the ‘@Override’ annotation. This is used in the derived class\
    \ whenever the derived class method overrides the implementation in the base class.\n\
    \nLet’s look at an example of this annotation.\n\nExample 34: The following program\
    \ showcases a simple annotation.\n\n```\nclass Person\n{\n    void Display()\n\
    \    {\n        System.out.println(\"This is the Person class\");\n    }\n}\n\
    class Student extends Person\n```"
