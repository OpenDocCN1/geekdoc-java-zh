- md: "\n## 9. What is Java EE?\n\nSo far we have looked at how to work with the standard\
    \ Java programming language. Let's quickly review what the Java world has available\
    \ for developers and enterprises. There are currently four platforms available:\n\
    \n- Java SE - This is the Standard Edition, which contains all the core Java libraries\
    \ and the Java API. Here you also get access to the Java Virtual Machine which\
    \ is used to run basic Java applications.\n\n- Java ME - This is the Micro Edition\
    \ of Java. Here you get a subset of features of the main Java Standard Edition.\
    \ This is good for developing applications on smaller devices such as mobile devices.\n\
    \n- Java FX - This library is used for building rich internet based applications.\
    \ Here you can design a modern look and feel application with a rich user interface.\n\
    \n- Java EE - Finally you have the Enterprise Edition, which is used for developing\
    \ enterprise based applications.\n\nMany organizations make use of the Java Enterprise\
    \ Edition. This edition is based on a set of specifications. For example, the\
    \ web specification is used for building web based applications. Let's look at\
    \ some of the components of the Java Enterprise Edition in more detail.\n\n##\
    \ 9.1 Java Servlet\n\nJava Servlets are used to build dynamic webpages. The output\
    \ normally generated by a servlet is HTML. The Java class, that needs to behave\
    \ like a servlet, needs to conform to the specifications of the Java Servlet.\
    \ The Java Servlet program is then hosted in a servlet container, which is used\
    \ to run the servlet and provide the desired output. This is best understood through\
    \ an example.\n\n### Example 55: The following program shows an example of what\
    \ a servlet looks like.\n\n```java\nimport java.io.*;\nimport javax.servlet.*;\n\
    import javax.servlet.http.*;\n\npublic class DemoServlet extends HttpServlet\n\
    {\n    @Override\n    public void doGet(HttpServletRequest request, HttpServletResponse\
    \ response)\n        throws IOException, ServletException\n    {\n        response.setContentType(\"\
    text/html;charset=UTF-8\");\n        PrintWriter out = response.getWriter();\n\
    \n        try\n        {\n            out.println(\"<html><head>\");\n       \
    \     out.println(\"<title>Hello, World!</title></head>\");\n            out.println(\"\
    <body>\");\n            out.println(\"<h1>Hello, world!</h1>\"); // says Hello\n\
    \            out.println(\"</body>\");\n            out.println(\"</html>\");\n\
    \        }\n        finally\n        {\n            out.close();\n        }\n\
    \    }\n}\n```\n\nThe following things need to be noted about the above program:\n\
    \n- Firstly, the 'Java' class extends the 'HttpServlet' class. This is required\
    \ to ensure that the class behaves like a servlet.\n\n- Next, we override the\
    \ ‘doGet’ method that is used to send the response back to the client.\n\n- And\
    \ finally, we use the ‘response’ method to write the response back to the client.\n\
    \nThe servlet would then run inside a web container. The container would process\
    \ the servlet and then send the response back to the client. We will look at Java\
    \ Servlets in greater detail in the next chapter.\n\n## 9.2 Java Server Pages\n\
    \nJava Server Pages are also used to generate dynamic HTML pages. To deploy and\
    \ run Java Server Pages, a compatible web server with a servlet container, such\
    \ as Apache Tomcat or Jetty, is required. Let’s look at an example.\n\n### Example\
    \ 56: The following program shows an example of what a Java server page looks\
    \ like.\n\n```jsp\n<%@ page language=\"java\" contentType=\"text/html; charset=ISO-8859-1\"\
    \npageEncoding=\"ISO-8859-1\"%>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 4.01\
    \ Transitional//EN\"\n\"http://www.w3.org/TR/html4/loose.dtd\">\n<html>\n<head>\n\
    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=ISO-8859-1\">\n\
    <title>Hello World Java EE</title>\n</head>\n<body>\n<%System.out.println(\"Hello\
    \ World\");%>\n</body>\n</html>\n```\n\nThe following things need to be noted\
    \ about the above program:\n\n- The page language directive needs to be declared\
    \ on top of the program, to indicate that Java constructs can be used in the program.\n\
    \n- The major part of the page is a simple HTML page.\n- The ‘<% ... %>’ construct\
    \ is used to embed Java code.\n\n## 9.3 Java Server Faces (JSF)\n\nJava Server\
    \ Faces (JSF) is used for building component based user interfaces for web based\
    \ applications. This framework is based on the MVC or the Model/View/Controller\
    \ framework. Here the Model layer is used to represent the data layer, the View\
    \ layer is used to denote the presentation layer, and the Controller layer is\
    \ the business logic layer. Let's look at a small example.\n\n### Example 57:\
    \ The following program shows an example of what a basic JSF program looks like.\n\
    \nA basic Java Server Faces program will contain two parts. The first part is\
    \ the JSF component itself.\n\n```java\nimport java.io.Serializable;\nimport javax.faces.bean.ManagedBean;\n\
    import javax.faces.bean.SessionScoped;\n\n@ManagedBean(name=\"demo\")\n@SessionScoped\n\
    public class Demo implements Serializable {\n    private String str = \"Hello\
    \ World!!\";\n\n    public String getstr() {\n        System.out.println(str);\n\
    \        return str;\n    }\n\n    public void setstr(String pstr) {\n       \
    \ this.str = pstr;\n    }\n}\n```\n\nIn the above program:\n\n- The ‘@Managed’\
    \ annotation indicates the class ‘Demo’ is a managed bean.\n- The ‘@SessionScoped’\
    \ indicates that the bean is alive until the ‘HttpSession’ is valid.\n- Then a\
    \ string ‘str’ is declared and initialized with ‘Hello World’ and the getter and\
    \ setter methods are defined to retrieve the value of string ‘str’.\n\nThe second\
    \ part is the xhtml page that references the JSF object.\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE type html PUBLIC \"-//W3C//DTD XHTML 1.0\
    \ Transitional//EN\"\n\"http://www.w3.org/TR/xhtml/DTD/xhtml1-transitional.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\nxmlns:h=\"http://java.sun.com/jsf/html\"\
    >\n<head>\n<title>Example</title>\n</head>\n<body>\n<h:body value=\"#{demo.str}\"\
    >\n</h:body>\n</body>\n</html>\n```\n\nIn the above program, ‘#{demo.str}’ is\
    \ used to reference the ‘str’ property from the JSF object. We will look at Server\
    \ Faces in greater detail, later in this book.\n\n## 10. Servlets\n\nAs mentioned\
    \ in the previous chapter, Java Servlets are used to build dynamic based applications.\
    \ In order to create a servlet, our class needs to extend one of the servlet classes.\
    \ This can be either the ‘GenericServlet’ class or the ‘HttpServlet’ class. If\
    \ the program is going to utilize any protocol, we need to use GenericServlet\
    \ class, otherwise we use HttpServlet class.\n\nThe basic structure of classname\
    \ extends GenericServlet is shown below.\n\n```java\npublic class classname extends\
    \ GenericServlet\n{\n    public void service(ServletRequest request, ServletResponse\
    \ response)\n    throws ServletException, IOException\n    {\n}\n```\n\nThe following\
    \ things need to be noted about the above:\n\n- The class has to extend the ‘GenericServlet’\n\
    - Then we need to override the service method.\n- The service method gets passed\
    \ the request and the response object. If the user has sent some parameters with\
    \ the request, it would be available in the request object.\n\nAlternatively if\
    \ the class was going to work with the HttpServlet class, then the syntax would\
    \ be as follows:\n\n```java\npublic class Demo extends HttpServlet\n{\n    public\
    \ void doGet(HttpServletRequest request, HttpServletResponse response)\n    throws\
    \ IOException, ServletException\n    {\n}\n```\n\n## 10.1 How to Create a Simple\
    \ Servlet\n\nTo create a simple servlet in an IDE, such as Eclipse, we need to\
    \ create a dynamic web project. This dynamic web project will be configured with\
    \ a web server that will be used to run the servlet program. In Eclipse it is\
    \ important to ensure that the web tools are installed. The Eclipse web tools\
    \ can download from the link below:\n\nhttps://www.eclipse.org/webtools/\n\nWith\
    \ this installed, when we go to Eclipse and create an ‘Other’ type project, we\
    \ will be able to see the ‘Dynamic Web Project’ under the ‘Web’ section.\n\n![](img/164f77fcab6b95970f901980879f9631_100_0.png)\n\
    \nWe also need to ensure that a web server, such as Apache is downloaded. Apache\
    \ can be downloaded from the following link:\n\nhttps://httpd.apache.org/\n"
  mdcn: "\n\n## 9. 什么是 Java EE？\n\n到为止，我们已经学习了如何使用标准的 Java 语言。让我们快速回顾一下 Java 世界为开发者和企业提供的功能。目前有四个可用的平台：\n\
    \n- Java SE - 这是标准版（Standard Edition），包含了所有的核心 Java 库和 Java API。在这里，你还可以访问用于运行基础\
    \ Java 程序的 Java 虚拟机（JVM）。\n\n- Java ME - 这是 Java 的微型版（Micro Edition）。在这里你获得的是\
    \ Java 标准版功能的子集。这适用于在移动设备等较小设备上开发应用程序。\n\n- Java FX - 该库用于构建基于互联网的富交互应用程序。在这里，你可以设计具有丰富用户界面的现代外观的应用程序。\n\
    \n- Java EE - 最后，你还有企业版（Enterprise Edition），它用于开发企业级应用程序。\n\n许多组织都使用 Java 企业版。该版本基于一组规范。例如，Web\
    \ 规范用于构建基于 Web 的应用程序。让我们更详细地查看 Java 企业版的的一些组件。\n\n## 9.1 Java Servlet\n\nJava\
    \ Servlets 用于构建动态网页。Servlet 通常生成的输出是 HTML。需要像 Servlet 一样运行的 Java 类必须符合 Java Servlet\
    \ 的规范。然后，Java Servlet 程序托管在 Servlet 容器中，该容器用于运行 Servlet 并提供所需的输出。通过示例来理解这一点最好。\n\
    \n### 示例 55：以下程序展示了 Servlet 的示例。\n\n```java\nimport java.io.*;\nimport javax.servlet.*;\n\
    import javax.servlet.http.*;\n\npublic class DemoServlet extends HttpServlet\n\
    {\n    @Override\n    public void doGet(HttpServletRequest request, HttpServletResponse\
    \ response)\n        throws IOException, ServletException\n    {\n        response.setContentType(\"\
    text/html;charset=UTF-8\");\n        PrintWriter out = response.getWriter();\n\
    \n        try\n        {\n            out.println(\"<html><head>\");\n       \
    \     out.println(\"<title>Hello, World!</title></head>\");\n            out.println(\"\
    <body>\");\n            out.println(\"<h1>Hello, world!</h1>\"); // 显示 Hello\n\
    \            out.println(\"</body>\");\n            out.println(\"</html>\");\n\
    \        }\n        finally\n        {\n            out.close();\n        }\n\
    \    }\n}\n```\n\n关于上述程序，需要注意以下几点：\n\n- 首先，'DemoServlet' 类继承了 'HttpServlet' 类。这是为了确保该类的行为像一个\
    \ Servlet。\n\n- 其次，我们重写了 'doGet' 方法，该方法用于向客户端发送响应。\n\n- 最后，我们使用 'response' 方法将响应写回客户端。\n\
    \nServlet 然后将运行在 Web 容器内部。容器将处理 Servlet 然后将响应发回客户端。我们将在下一章更详细地介绍 Java Servlets。\n\
    \n## 9.2 Java Server Pages (JSP)\n\nJava Server Pages（JSP）也用于生成动态 HTML 页面。要部署和运行\
    \ Java Server Pages，需要一个带有 Servlet 容器的兼容 Web 服务器，例如 Apache Tomcat 或 Jetty。让我们来看一个例子。\n\
    \n### 示例 56：以下程序展示了一个 Java Server 的示例。\n\n```jsp\n<%@ page language=\"java\" contentType=\"\
    text/html; charset=ISO-8859-1\"\npageEncoding=\"ISO-8859-1\"%>\n<!DOCTYPE html\
    \ PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\n\"http://www.w3.org/TR/html4/loose.dtd\"\
    >\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=ISO-8859-1\"\
    >\n<title>Hello World Java EE</title>\n</head>\n<body>\n<%System.out.println(\"\
    Hello World\");%>\n</body>\n</html>\n```\n\n关于上述程序，需要注意以下几点：\n\n- 页面语言指令需要在程序顶部声明，以指示程序中使用可以使用\
    \ Java 构造结构。\n\n- 页面的主要部分是一个简单的 HTML 页面。\n- ‘<% ... %>’ 构造结构用于嵌入 Java 代码。\n\n\
    ## 9.3 Java Server Faces (JSF)\n\nJava Server Faces (JSF) 用于为基于 Web 的应用程序构建基于组件的用户界面。该框架基于\
    \ MVC 或模型/视图/控制器框架。在这里，模型（Model）层用于表示数据层，视图（View）层用于表示表现层，而控制器（Controller）层是业务逻辑层。来看一个小例子。\n\
    \n### 示例 57：以下程序展示了一个基础 JSF 程序的示例。\n\n一个基础 Java Server Faces 程序包含两个部分。第一部分是 JSF\
    \ 组件本身。\n\n```java\nimport java.io.Serializable;\nimport javax.faces.bean.ManagedBean;\n\
    import javax.faces.bean.SessionScoped;\n\n@ManagedBean(name=\"demo\")\n@SessionScoped\n\
    public class Demo implements Serializable {\n    private String str = \"Hello\
    \ World!!\";\n\n    public String getstr() {\n        System.out.println(str);\n\
    \        return str;\n    }\n\n    public void setstr(String pstr) {\n       \
    \ this.str = pstr;\n    }\n}\n```\n\n在上述程序中：\n\n- ‘@Managed’ 注解表示类 ‘Demo’ 是托管豆（managed\
    \ bean）。\n- ‘@SessionScoped’ 表示该 bean 的生命周期持续到会话结束。\n\n第二部分是对应的 JSF 页面。\n\n```xml\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
    \ HTML 4.01 Transitional//EN\"\n\"http://www.w3.org/TR/html4/loose.dtd\">\n<html\
    \ xmlns=\"http://www.w3.org/1999/xhtml\" xmlns:h=\"http://java.sun.com/jsf\">\n\
    <head>\n<title>Example</title>\n</head>\n<body>\n<h:body value=\"#{demo.str}\"\
    \ />\n</body>\n</html>\n```\n\n在上述程序中，#{demo.str} 用于引用 JSF 属性。\n\n"
