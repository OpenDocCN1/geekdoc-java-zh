    if (id == R.id.action_settings) {\n    return true;\n}\n\nreturn super.onOptionsItemSelected(item);\n\
    }\n```\n\n上述代码的一些关键方面如下：\n\n- 主类继承了‘AppCompatActivity’类，该类构成了移动应用程序活动栏的基础。\n-\
