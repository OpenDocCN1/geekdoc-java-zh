    An important aspect of this series, and your learning experience, is **learning
    by doing**. Practical examples are proven to be the best way to learn a programming
    language, which is why I have crammed as many examples into this guide as possible.
    I have tried to keep the core of the examples similar, so the only variable is
    the topic under discussion. This makes it easier to understand what we are implementing.
    As you progress through the chapters, remember to follow along with the examples
    and try them yourself.


    With each topic in this advanced level guide, we will look at a detailed description,
    proper syntax and numerous examples to make your learning experience as easy as
    possible. Java is a powerful and versatile programming language and I trust you
    will enjoy this book as much as I enjoyed writing it.


    So without further ado, let''s get started!


    # 1. Collections


    Collections are special classes in Java that makes working with special data classes
    much easier. For example, imagine we have a collection called the ArrayList collection,
    and we want to find out the size of the array. Instead of writing special code
    to find the size, we can use a built-in function of the collection called size()
    to get the size of the array.


    Some of the notable advantages of collections are:


    - It reduces the programming effort required by the developer, since these are
    built-in available data structures and algorithms that don''t have to written
    from scratch.

    - It increases performance by providing high-performance implementation of data
    structures and algorithms.

    - It provides interoperability between unrelated APIs, by establishing a common
    language in order to pass collections back and forth.

    - It also reduces the effort required to learn APIs, by lessening the need to
    learn multiple hoc APIs.


    The following collections are present in Java:


    - ArrayList

    - HashSet

    - ArrayDeque

    - HashMap


