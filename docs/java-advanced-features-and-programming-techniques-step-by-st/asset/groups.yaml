  - "[PAGE 99]\n\n# 10. Java Servlets\n\nAs mentioned in the previous chapter, Java\
    \ Servlets are used to build dynamic web based applications. In order to create\
    \ a servlet, our class needs to extend one of the main servlet classes. This can\
    \ be either the ‘GenericServlet’ class or the ‘HttpServlet’ class. If the program\
    \ is going to utilize any protocol, we need to use the Generic Servlet class,\
    \ otherwise we use the HttpServlet class.\n\nThe basic structure of classname\
    \ extends GenericServlet class is shown below.\n\n```\npublic class classname\
    \ extends GenericServlet\n{\n    public void service(ServletRequest request, ServletResponse\
    \ response)\n    throws ServletException, IOException\n    {\n    }\n}\n```\n\n\
    The following things need to be noted about the above structure:\n\n+   - The\
    \ class has to extend the ‘GenericServlet’ class\n- Then we need to override the\
    \ service method.\n- The service method gets passed the request and the response\
    \ object. If the user has sent some parameters with the request, it would be available\
    \ in the request object.\n\nAlternatively if the class was going to work with\
    \ the HttpServlet class, then the syntax would be as follows:\n\n```\npublic class\
    \ Demo extends HttpServlet\n{\n    public void doGet(HttpServletRequest request,\
    \ HttpServletResponse response)\n    throws IOException, ServletException\n  \
    \  {\n}\n```"
