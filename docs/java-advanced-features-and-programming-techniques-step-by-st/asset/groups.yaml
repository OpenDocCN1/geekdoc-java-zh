- md: "\n# Step 2\n\nNext we need to get the handle to the method by calling the `getDeclaredMethod`\
    \ reflective method.\n\n# Step 3\n\nThen we use the ‘Invoke’ function to invoke\
    \ the method.\n\n# Step 4\n\nWe also need to ensure that our main method makes\
    \ an explicit declaration to throw the possible exceptions below, when working\
    \ with methods and reflection.\n\n- NoSuchMethodException\n- InvocationTargetException\n\
    - IllegalAccessExceptionException\n- ClassNotFoundException\n- InstantiationException\n\
    \nNow let’s look at an example of how to invoke methods via reflection.\n\n# Example\
    \ 44: The following program shows how to invoke methods via reflection.\n\n```java\n\
    import java.lang.reflect.Constructor;\nimport java.lang.reflect.Field;\nimport\
    \ java.lang.reflect.InvocationTargetException;\nimport java.lang.reflect.Method;\n\
    \nclass Person\n{\n    int ID;\n    Person()\n    {\n    }\n    public void Display()\n\
    \    {\n        System.out.println(\"This is the Display method\");\n    }\n \
    \   public void Input(){\n    }\n}\npublic class Demo {\n    public static void\
    \ main(String[] args) throws NoSuchMethodException,\n    InvocationTargetException,\
    \ IllegalAccessException, ClassNotFoundException,\n    InstantiationException\n\
    \    {\n        Class<?> c = Class.forName(\"Person\");\n        Object t = c.newInstance();\n\
    \n        Method method = Person.class.getDeclaredMethod(\"Display\");\n     \
    \   method.invoke(t,null);\n    }\n}\n```\n\nThe following things need to be noted\
    \ about the above program:\n\n- We use the following statements to create a new\
    \ instance of the ‘Person’ class at runtime.\n\n| Class<?> c = Class.forName(\"\
    Person\") | |\n| Object t = c.newInstance(); | |\n\n- We then get a handle to\
    \ the ‘Display’ method.\n- We invoke the method using the newly created object.\n\
    - Since there are no parameters for our display method, we need to specify a value\
    \ of null when invoking the method.\n\nWith this program, the output is as follows:\n\
    \n# This is the Display method\n\nLet’s look at an example of how to invoke a\
    \ method with parameters.\n\n# Example 45: The next program shows how to invoke\
    \ methods with parameters.\n\n```java\nimport java.lang.reflect.Constructor;\n\
    import java.lang.reflect.Field;\nimport java.lang.reflect.InvocationTargetException;\n\
    import java.lang.reflect.Method;\n\nclass Person {\n    int ID;\n    public void\
