    \ Java 程序。它将在模拟器中运行。\n\n# 结\n\n遗憾的是，我们已经到达本指南的末尾。但正如我经常说过的，这并不意味着你的 Java 之之旅应该在此结束。请尽可能地练习。这本书的编写不仅是一份教学指南，还是一本参考手册。所以，请记住，当你穿梭于奇妙的编程世界时，始终将它带在身边。\n\
