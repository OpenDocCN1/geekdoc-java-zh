    response.getWriter().append(\"Hello World\");\n```\n\nWhen we run the program\
    \ in Eclipse, it will run in Apache in Eclipse and we will get the following output:\n\
    \n# Hello World\n\n## 10.2 Using Parameters\n\nWith dynamic web pages, it is possible\
    \ to send parameters via the Query String in the URL. We can then use the Java\
    \ servlet to process this parameter. Let’s see an example of how we can get this\
