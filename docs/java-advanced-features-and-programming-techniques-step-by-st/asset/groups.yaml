    \n- 首先，我们创建了一个名为 `Person` 的类，包含两个字段。\n- 该类实现了 `Serializable` 接口。\n- 接着，我们在主程序中创建了一个\
    \ `FileOutputStream` 对象，并确保该对象被写入名为 `Sample.txt` 的文件中。\n- 最后，我们使用 `ObjectOutputStream`\
    \ 类将对象写入文件。\n\n当程序执行时，对象将以二进制格式写入 `Sample.txt` 文件。我们也可以通过一个被称为“反序列化”的过程从文件中读取对象。让我们来看一个如何操作的示例。\n\
    \n## 示例 52：以下程序显示了如何使用反序列化。\n\n```java\nimport java.io.*;\n\nclass Person implements\
    \ Serializable\n{\n    public int ID;\n    public String name;\n}\n\npublic class\
