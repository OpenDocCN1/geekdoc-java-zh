    import java.lang.reflect.Method;\n\n@Retention(RetentionPolicy.RUNTIME)\n@interface\
    \ Author\n{\n    String name();\n}\nclass Person\n{\n    @Author(name=\"John\"\
    )\n    void Display()\n    {\n        System.out.println(\"This is the Person\
    \ class\");\n    }\n}\npublic class Demo\n{\n    public static void main(String[]\
    \ args)\n    {\n        Class<Person> aClass = Person.class;\n        Method[]\
    \ method = aClass.getDeclaredMethods();\n\n        Annotation[] annotations =\
    \ method[0].getDeclaredAnnotations();\n\n        for(Annotation annotation : annotations)\n\
    \        {\n            Author myAnnotation = (Author) annotation;\n         \
    \   System.out.println(\"name: \" + myAnnotation.name());\n        }\n    }\n\
    }\n```\n\nThe following things need to be noted about the above program:\n\n-\
    \ We are now applying the annotation for the method.\n- We then access the annotation\
    \ after getting a handler to the method.\n\nWith this program, the output is as\
    \ follows:\n\n**name: John**\n\n## 5.2 Predefined Annotation Types\n\nJava has\
    \ the following list of predefined annotation types:\n\n- @Deprecated - This indicates\
    \ that the marked element is deprecated and should no longer be used. The compiler\
    \ generates a warning whenever a program uses a method, class or field with the\
    \ @Deprecated annotation.\n- @Override - This informs the compiler that the element\
    \ is meant to override another element declared in the superclass.\n- @SuppressWarnings\
    \ - This tells the compiler to suppress specific warnings that it would otherwise\
    \ generate.\n- @SafeVarargs - When applied to a method or constructor, it asserts\
    \ that the code does not perform potentially unsafe operations on its varargs\
    \ parameter.\n- @FunctionalInterface - Introduced in Java SE 8, it indicates that\
    \ the type declaration is intended to be a functional interface, as defined by\
    \ the Java Language Specification.\n\nLet's look at an example using the built-in\
    \ annotations.\n\n## Example 37: This program is used to showcase the @Deprecated\
    \ annotation.\n\n```java\nclass Person\n{\n    @Deprecated\n    void Display()\n\
    \    {\n        System.out.println(\"This is the Person class\");\n    }\n}\n\
    public class Demo\n{\n    public static void main(String[] args[])\n    {\n  \
    \      Person per=new Person();\n        per.Display();\n    }\n}\n```\n\nNow\
    \ when we compile the above program, we will get the following compile time error\n\
    \n# Warning:(15, 12) java: Display() in Person has been deprecated\n\nWe can still\
    \ run the program, but we will get the warning every time. This means that the\
    \ method should be removed from the class in the future. On the other hand, we\
    \ can also suppress this warning by using the ‘@SuppressWarnings’ annotation.\
    \ Let’s look at an example of this.\n\n```java\nclass Person\n{\n    @Deprecated\n\
    \    void Display()\n    {\n        System.out.println(\"This is the Person class\"\
    );\n    }\n}\n\n@SuppressWarnings(value = \"deprecation\")\n\npublic class Demo\n\
    {\n    public static void main(String[] args)\n    {\n        Person per=new Person();\n\
    \        per.Display();\n    }\n}\n```\n\nNow when we compile the program we will\
    \ not get any warnings, because the '@SuppressWarnings' annotation has been applied\
    \ to the class that has our main program.\n\n## 6. Reflection\n\nReflection is\
    \ a concept that is present in most modern day programming languages. It allows\
    \ for the introspection of classes and methods at runtime. So as an example, let’s\
    \ say we don’t know what methods are present in a particular class. We can actually\
    \ inspect the class at runtime, and inspect the methods present in the class.\
    \ For this to happen we need to use the Reflection API that is present in Java.\n\
    \nLet’s look at our first example of how reflection can be used.\n\n## Example\
    \ 39: The following program is an example of reflection.\n\n```java\nimport java.lang.reflect.Method;\n\
    class Person\n{\n}\npublic class Demo\n{\n    public static void main(String[]\
    \ args)\n    {\n        Method[] methods = Person.class.getMethods();\n\n    \
    \    for(Method method : methods)\n        {\n            System.out.println(\"\
    method = \" + method.getName());\n        }\n    }\n}\n```\n\nThe following things\
    \ need to be noted about the above program:\n\n- We need to import the necessary\
    \ class from the `java.lang.reflect` namespace.\n- We are using the `.class` reflection\
    \ to get the list of methods in the class. This will retrieve all the pre-built\
    \ methods that come with the Java classes.\n- Then for each method, we are printing\
    \ the name of the methods.\n\nWith this program, the output is as follows:\n\n\
    ```\nmethod = wait\nmethod = wait\nmethod = wait\nmethod = equals\nmethod = toString\n\
    method = hashCode\nmethod = getClass\nmethod = notify\nmethod = notifyAll\n```\n\
    \nThe above implementation retrieves the built-in methods for the class. Let’s\
    \ look at an example of how we can get the declared methods for the class.\n\n\
    ## Example 40: The following program showcases an example of reflection.\n\n```java\n\
    import java.lang.reflect.Method;\nclass Person\n{\n    public void Display(){}\n\
    \    public void Input(){}\n}\npublic class Demo\n{\n    public static void main(String\
    \ args[])\n    {\n        Method[] methods = Person.class.getDeclaredMethods();\n\
    \        for(Method method : methods)\n        {\n            System.out.println(\"\
    method = \" + method.getName());\n        }\n    }\n}\n```\n\nThe following needs\
    \ to be noted about the above program:\n\n- We are using the reflective method\
    \ called ‘getDeclaredMethods’ to retrieve the declared methods of the class.\n\
    \nWith this program, the output is as follows:\n\nmethod = Display\nmethod = Input\n\
    \n## 6.1 Retrieving Information on Classes\n\nReflection can be used to get information\
    \ about classes. Let’s look at the different aspects of how we can get the information\
    \ through reflection.\n\n### 6.1.1 Getting the Class Name\n\nThe first aspect\
    \ is getting the name of the class. Let’s look at an example of this.\n\n## Example\
    \ 41: This program shows how to get the name of the class.\n\n```java\nimport\
    \ java.lang.reflect.Method;\nclass Person\n{\n    public void Display(){}\n  \
    \  public void Input(){}\n}\npublic class Demo\n{\n    public static void main(String[]\
    \ args)\n    {\n        Class cls = Person.class;\n        System.out.println(\"\
    The name is \"+cls.getName());\n    }\n}\n```\n\nThe following things need to\
    \ be noted about the class by using reflection:\n\n- First we are getting a handle\
    \ to the class by using reflection.\n- We then use the ‘getName’ reflective method\
    \ to get the name of the class.\n\nWith this program, the output is as follows:\n\
    \nThe name is Person\n\n### 6.1.2 Getting the Number of Constructors\n\nWe can\
    \ also get the number of constructors for a class. Let’s look at an example of\
    \ this.\n\n## Example 42: The next program shows how to get the constructors of\
    \ a class.\n\n```java\nimport java.lang.reflect.Constructor;\nimport java.lang.reflect.Method;\n\
    class Person\n{\n    Person()\n    {\n    }\n    public void Display(){}\n   \
    \ public void Input(){}\n}\npublic class Demo\n{\n    public static void main(String[]\
    \ args[])\n    {\n        Class cls = Person.class;\n        Constructor[] constructors\
    \ = cls.getDeclaredConstructors();\n        System.out.println(\"The number of\
    \ constructors are \" + constructors.length);\n    }\n}\n```\n\nWith this program,\
    \ the output is as follows:\n\nThe number of constructors are 1\n\n### 6.1.3 Getting\
    \ the Number of Fields\n\nWe can get the number of fields for a class. Let's look\
    \ at an example of this.\n\n## Example 43: The following program shows how to\
    \ get the fields of a class.\n\n```java\nimport java.lang.reflect.Constructor;\n\
    import java.lang.reflect.Field;\nimport java.lang.reflect.Method;\nclass Person\n\
    {\n    int ID;\n    Person()\n    {\n    }\n    public void Display(){}\n    public\
    \ void Input(){}\n}\npublic class Demo\n{\n    public static void main(String[]\
    \ args[])\n    {\n        Class cls = Person.class;\n        Field[] fld = cls.getDeclaredFields();\n\
    \        System.out.println(\"The number of fields are \" + fld.length);\n   \
    \     System.out.println(\"The fields are\");\n        for(Field fldname : fld)\
    \ {\n            System.out.println(fldname.getName());\n        }\n    }\n}\n\
    ```\n\nWith this program, the output is as follows:\n\nThe number of fields are\
    \ 1\nThe fields are\nID\n\n## 6.2 Invoking Methods\n\nWe can also invoke methods\
    \ by the name of the method, after we retrieve the name with reflection. The following\
    \ steps need to be carried out when working with retrieving method signatures\
    \ at run time:\n\n### Step 1\n\nFirst we need to create an object of the class\
    \ through reflection. This is done via the statements below. Here we need to mention\
    \ the name of the class.\n\n| Class<?> c = Class.forName(classname); |\n| Object\
    \ t = c.newInstance(); |\n"
