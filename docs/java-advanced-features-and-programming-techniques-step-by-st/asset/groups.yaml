    \nlocalhost:8080/Demo/\n\nHello World!\n\n# 12. Java Database Connectivity (JDBC)\n\
    \nThe Java Database Connectivity, or JDBC, API is used to interact with databases.\
    \ With JDBC we can make connections to a database and work with the built-in SQL\
    \ statements. First let's look at the setup. In our example, we are going to work\
    \ with a MySQL database as our data-source. The MySQL database setup can be downloaded\
    \ from the link below:\n\nhttps://dev.mysql.com/downloads/installer/\n\nOnce downloaded\
    \ and installed, let's create the following:\n\n- A database called ‘Person’\n\
    - A table ‘Per’ that has 2 columns. One column is titled ‘ID’ for the INT type,\
    \ and the other is titled ‘Name’ for the varchar type.\n- Add one item to the\
    \ table as ‘1 John’.\n\nNext we need to download the MySQL database connector\
    \ for Java from the following location:\n\nhttps://www.mysql.com/products/connector/\n\
    \nOnce done, we need to add the jar file as an external jar for our project. Now\
    \ let's add the following code to establish a connection to the database using\
    \ JDBC and read the contents of the table.\n\nExample 60: The following program\
    \ shows how to read data from a database table.\n\n```java\nimport java.sql.*;\n\
    public class Sample\n{\n    public static void main(String[] args) throws Exception\n\
    \    {\n        Class.forName(\"com.mysql.jdbc.Driver\");\n        Connection\
    \ con=DriverManager.getConnection(\n        \"jdbc:mysql://localhost:3306/Person\"\
    ,\"admin\",\"password\");\n        Statement stmt=con.createStatement();\n```\n\
    \n```java\nResultSet rs=stmt.executeQuery(\"select * from Per\");\n\nwhile(rs.next())\n\
    \    System.out.println(rs.getInt(1)+\" \"+rs.getString(2));\n\ncon.close();\n\
    }\n```\n\nThe following things need to be noted about the above program:\n\n-\
    \ First we import the necessary SQL libraries.\n- Then we use the ‘DriverManager’\
    \ class to get a connection to the database using the JDBC protocol. Here we mention\
    \ the server name, port number, username and password to connect.\n- Next we create\
    \ a result set by executing a select query.\n- Finally we use the ‘recordset’\
    \ to navigate through the records.\n\nOnce we run the program, we will get the\
    \ following output:\n\n# 1 John\n\nWe can also use JDBC to insert records into\
    \ the database. Let’s look at an example of this.\n\nExample 61: The following\
    \ program shows how to insert records into a table.\n\n```java\nimport java.sql.*;\n\
    public class Sample\n{\n    public static void main(String args[]) throws Exception\n\
    \    {\n        Class.forName(\"com.mysql.jdbc.Driver\");\n        Connection\
    \ con=DriverManager.getConnection(\n            \"jdbc:mysql://localhost:3306/Person\"\
    ,\"admin\",\"password\");\n    }\n}\n```\n\n```java\nPreparedStatement stmt=con.prepareStatement(\"\
    insert into values(?,?)\");\nstmt.setInt(1,2);\nstmt.setString(2,\"Mark\");\n\n\
    int i=stmt.executeUpdate();\nSystem.out.println(\" The number of records inserted\
    \ is \"+i);\n\ncon.close();\n```\n\nThe following things need to be noted about\
    \ the above program:\n\n- We are using the ‘PreparedStatement’ here so that we\
    \ can take dynamic values in our statement.\n- We then use the ‘set’ methods to\
    \ set the values of ‘ID’ and ‘Name’, which will be written to the database.\n\
    - Finally we execute the ‘Update’ statement to add the record to the database.\n\
    \nOnce we run the program, we will get the following output:\n\n# The number of\
    \ records inserted is 1\n\nWe can also get metadata about the table via JDBC.\
    \ Let’s look at an example of this.\n\n# Example 62: The following program shows\
    \ how to get the table metadata.\n\n```java\nimport java.sql.*;\npublic class\
    \ Sample\n{\n    public static void main(String[] args) throws Exception\n{\n\
    \    Class.forName(\"com.mysql.jdbc.Driver\");\n```\n\n```java\nConnection con=DriverManager.getConnection(\n\
    \"jdbc:mysql://localhost:3306/Person\",\"admin\",\"password\");\n\nPreparedStatement\
    \ ps=con.prepareStatement(\"select * from per\");\nResultSet rs=ps.executeQuery();\n\
    ResultSetMetaData rsmd=rs.getMetaData();\n\nSystem.out.println(\"Total columns:\
    \ \"+rsmd.getColumnCount());\nSystem.out.println(\"Column Name of 1st column:\
    \ \"+rsmd.getColumnName(1));\nSystem.out.println(\"Column Type Name of 1st column:\
