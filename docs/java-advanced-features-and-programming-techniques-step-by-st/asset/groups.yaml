    \n- 首先，类继承了 servlet 类。\n- 接着，它重写了模版代码中带有 `doGet` 和 `doPost` 方法。\n- 在 `doGet` 方法中，我们添加了以下行代码来将“Hello\
    \ World”作为响应写入。\n\n```java\nresponse.getWriter().append(\"Hello World\");\n```\n\
    \n当我们在 Eclipse 中运行该程序时，它将在 Eclipse 的 Apache 中运行，我们将得到如下输出：\n\n# Hello World\n\n\
    ## 10.2 使用参数\n\n在动态网页中，可以通过 URL 中的查询字符串（Query String）发送参数。我们可以使用 Java servlet\
    \ 来处理这些参数。让我们来看看如何实现这一点的。\n\n> 示例 59：以下程序展示了如何使用参数。\n\n```java\nimport java.io.IOException;\n\
    import java.io.PrintWriter;\n\nimport javax.servlet.ServletException;\nimport\
    \ javax.servlet.annotation.WebServlet;\nimport javax.servlet.http.HttpServlet;\n\
    import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
