    \nThe following needs to be noted about the above program:\n\n- First we create\
    \ a class called ‘MyThread’, which extends the ‘Thread’ class.\n- Because we extend\
    \ the ‘Thread’ class, we need to implement the ‘run’ method.\n- In the main program,\
    \ we create an object of the ‘Thread’ class and choose the ‘start’ method. This\
    \ will cause our Thread class to call the run method.\n\nWith this program, the\
    \ output is as follows:\n\n# Thread running\n\nWe can also add more code to the\
    \ run method, and we can create an array of threads. Let’s look at an example\
    \ of this.\n\nExample 31: The next program shows how to create an array of threads.\n\
    \n```java\nclass MyThread extends Thread\n{\n    public static int count=0;\n\
    \    public void run()\n    {\n        count++;\n        System.out.println(\"\
    Thread running\" + count);\n    }\n}\n```\n\n```java\npublic class Demo\n{\n \
    \   public static void main(String args[])\n    {\n        MyThread[] th=new MyThread[3];\n\
    \        for(int i=0;i<3;i++)\n        {\n            th[i]=new MyThread();\n\
    \            th[i].start();\n        }\n    }\n}\n```\n\nThe following needs to\
    \ be noted about the above program:\n\n- In our main thread class, we have a static\
    \ variable of 'count'.\n- We increment the value of count whenever a new thread\
    \ is created.\n- We create an array of threads in the main program.\n\nWith this\
    \ program, the output is as follows:\n\n# Thread running1\n# Thread running2\n\
    # Thread running3\n\nNow let's look at an example of how to work with threads\
    \ using the Runnable Interface.\n\n# Example 32: This program shows how to create\
    \ an array of threads.\n\n```java\nclass MyThread implements Runnable\n{\n   \
    \ private Thread t;\n    private String threadName;\n\n    MyThread(String name)\n\
    \    {\n        threadName = name;\n        System.out.println(\"Creating \" +\
    \ threadName);\n    }\n\n    public static int count = 0;\n    public void run()\n\
    \    {\n        count++;\n        System.out.println(\"Thread running \" + count);\n\
    \    }\n\n    public void start()\n    {\n        System.out.println(\"Starting\
    \ \" + threadName);\n        if (t == null)\n        {\n            t = new Thread(this,\
    \ threadName);\n            t.start();\n        }\n    }\n}\n\npublic class Demo\n\
    {\n    public static void main(String args[])\n    {\n        MyThread th = new\
    \ MyThread(\"Thread1\");\n        th.start();\n    }\n}\n```\n\nThe following\
    \ needs to be noted about the above program:\n\n- We are creating our ‘MyThread’\
    \ class to implement the Runnable Interface.\n- We create a constructor to take\
    \ a name for the thread and assign it to the ‘private’ variable.\n- We now include\
    \ ‘start’ method in which we create a new thread object.\n\nWith this program,\
    \ the output is as follows:\n\n# Creating Thread1\n# Starting Thread1\n# Thread\
    \ running1\n\nWe can also get the state of the thread at any point in time. This\
    \ can be done by using the ‘getState’ method on the thread. Let’s see an example\
    \ of how we can get the state of a thread.\n\nExample 33: The following program\
    \ is used to showcase how to get the state of a thread.\n\n```java\nclass MyThread\
    \ extends Thread\n{\n    public static int count=0;\n    public void run()\n \
    \   {\n        count++;\n        System.out.println(\"Thread running \" + count);\n\
    \    }\n}\npublic class Demo\n{\n    public static void main(String[] args)\n\
    \    {\n        MyThread[] th=new MyThread[3];\n        for(int i=0;i<3;i++)\n\
    \        {\n            th[i]=new MyThread();\n            th[i].start();\n  \
    \          System.out.println(th[i].getState());\n        }\n    }\n}\n```\n\n\
    With this program, the output is as follows:\n\nRUNNABLE\nRUNNABLE\nRUNNABLE\n\
    Thread running1\nThread running2\nThread running3\n\n# 5. Java Annotations\n\n\
    Annotations are used to provide metadata or more information about the program.\
    \ As such, they don't have any direct effect on the program code itself and are\
    \ only used to describe the program.\n\nSome examples of how annotations can be\
    \ used are:\n\n- Information for the compiler — Annotations can be used by the\
    \ compiler to detect errors or suppress warnings.\n- Compile time and deployment\
    \ time processing — Software tools process annotation information to generate\
    \ code, XML files, and so forth.\n- Runtime processing — Some annotations are\
    \ available at runtime.\n\nThe simplest form of an annotation is as follows:\n\
    \n```\n@annotationname\n```\n\nIn the above code line, the ‘@’ symbol indicates\
    \ to the compiler that this is an annotation. One of the most common annotations\
    \ you would see is the ‘@Override’ annotation. This is used in the derived class\
    \ whenever the derived class method overrides the implementation in the base class.\n\
    \nLet’s look at an example of this annotation.\n\nExample 34: The following program\
    \ showcases a simple annotation.\n\n```java\nclass Person\n{\n    void Display()\n\
    \    {\n        System.out.println(\"This is the Person class\");\n    }\n}\n\
    class Student extends Person\n{\n  @Override\n  void Display() {\n    System.out.println(\"\
    This is the Student class\");\n  }\n}\npublic class Demo {\n  public static void\
    \ main(String[]args) {\n    Person per=new Student();\n    per.Display();\n  }\n\
    }\n```\n\nThe following things need to be noted about the above program:\n\n-\
    \ We define 2 classes. One is the ‘Person’ base class and the other is the ‘Student’\
    \ derived class.\n- Next we define the ‘Display’ method in both classes.\n\nWith\
    \ this program, the output is as follows:\n\nThis is the Student class\n\n## 5.1\
    \ Creating Your Annotations\n\nWe can also create own annotations in Java. Let’s\
    \ look at the steps required to create annotations.\n\n# Step 1\n\nFirst create\
    \ the annotation as shown below:\n\n```java\n@interface annotationname\n{\n//Annotation\
    \ members\n}\n```\n\nHere ‘annotationname’ is the name of the annotation. And\
    \ then we can have members. For example, let’s say we want to create an annotation\
    \ called ‘Author’ and then have a name.\n\n# Step 2\n\nAppend the ‘@Retention(RetentionPolicy.RUNTIME)’\
    \ statement to the annotation. This ensures that the annotation is available at\
    \ runtime.\n\n# Step 3\n\nThe next step is to access the annotation through reflection.\
    \ Reflection is the process of gaining access to classes and methods at runtime.\
    \ There is an entire chapter dedicated to reflection later in this. But for now,\
    \ it’s good to just know that the concept of getting the values is reflection.\n\
    \nThe best way to understand the entire process is with an example.\n\nExample\
    \ 35: The following program shows how to create an annotation.\n\n```java\nimport\
    \ java.lang.annotation.Annotation;\nimport java.lang.annotation.Retention;\nimport\
    \ java.lang.annotation.RetentionPolicy;\n\n@Retention(RetentionPolicy.RUNTIME)\n\
    @interface Author\n{\nString name();\n}\n@Author(name=\"John\")\n```\n\n```java\n\
    class Person\n{\n    void Display()\n    {\n        System.out.println(\"This\
    \ is the Person class\");\n    }\n}\npublic class Demo\n{\n    public static void\
    \ main(String[] args)\n    {\n        Class<Person> aClass = Person.class;\n \
    \       Annotation annotation = aClass.getAnnotation(Author.class);\n\n      \
    \  Author myAnnotation = (Author) annotation;\n        System.out.println(\"name:\
    \ \" + myAnnotation.name());\n    }\n}\n```\n"
