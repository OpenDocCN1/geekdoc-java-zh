    ### 2.1 Security\n\nOne of the most important aspects when it comes to running\
    \ programs on workstations is the security that is assigned to the program. Since\
    \ there are a lot of potentials threats in the industry, it becomes important\
    \ to control the security aspects of the program. On the Windows platform we have\
    \ the Java Control Panel, which can be used to control the different aspects of\
    \ the program.\n\n![](img/164f77fcab6b95970f901980879f9631_39_0.png)\n\nLet’s\
    \ look at some of the important features of the Java Control Panel.\n\n#### 2.1.1\
    \ Temp Internet Files\n\nThis location is used to store jar files or cache files.\
    \ It is an important location and you should always ensure that there is sufficient\
    \ space present for these files.\n\n![](img/164f77fcab6b95970f901980879f9631_40_0.png)\n\
    \n#### 2.1.2 Java Versions\n\nIn the Java tab, we can see the various versions\
    \ of Java that are installed on the system.\n\n![](img/164f77fcab6b95970f901980879f9631_41_0.png)\n\
    \n#### 2.1.3 Security\n\nIn the security tab, we have the various ways in which\
    \ we can control the security of Java programs running on the system. Here we\
    \ can disable Java content running in the browser.\n\n![](img/164f77fcab6b95970f901980879f9631_42_0.png)\n\
    \n## 2.2 Passing Command Line Arguments\n\nWe can also pass command line arguments\
    \ to control the execution of Java programs. If we look at the main entry point\
    \ of our Java programs, which is the main method, we will see that we have the\
    \ String array being passed. Here we can actually pass arguments to the main method.\
    \ We can then access those values as we would for a normal array.\n\n```java\n\
    public static void main(String[] args)\n```\n\nLet's look at an example of how\
    \ we can process the arguments in the main method.\n\n## Example 27: The following\
    \ program shows how to work with arguments in the main method.\n\n```java\npublic\
    \ class Demo\n{\n    public static void main(String[] args)\n{\n        if(args.length<1)\n\
    \            System.out.println(\"No arguments\");\n        else\n        {\n\
    \            for(String str:args)\n                System.out.println(str);\n\
    \        }\n    }\n}\n```\n\nWith the above program:\n\n- We are using the Java\
    \ command line utility.\n- If we store the above program in a file called Demo.java,\
    \ and then pass the values of 1 and 2 to the program at runtime...\n\nThen we\
    \ will get the following output:\n\n1\n\n2\n\n## 3. Packages in Java\n\nMost of\
    \ the classes and interfaces in Java are organized in what is referred to as ‘Packages’.\
    \ When we worked with collections, we saw that we had to import the java.util\
    \ package. This is because the collection classes were located in this package.\n\
    \nJava also gives us the ability to create our own packages, organize the class\
    \ files in these packages, and then access those packages and classes. To ensure\
    \ that a class is part of a package, we need to define the package statement at\
    \ the beginning of the class as shown below.\n\n```java\npackage packename\n```\n\
    \nIn this code sample, ‘packagename’ is the name of the package. If we want the\
    \ class to be accessed outside of the package, then the class needs to be defined\
    \ as ‘public’.\n\nSo now let’s see how to use packages via an example.\n\n## Example\
    \ 28: The following program showcases the usage of packages in Java.\n\nFirst\
    \ we will define a class called Student as shown below:\n\n```java\npackage person;\n\
    \nclass Student\n{\n    public String Name;\n    public void Display()\n    {\n\
    \        System.out.println(this.Name);\n    }\n}\n```\n\nThe following things\
    \ need to be noted about the above program:\n\n- We are using the Java command\
