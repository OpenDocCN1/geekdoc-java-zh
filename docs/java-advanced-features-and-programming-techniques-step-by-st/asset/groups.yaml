    - 安装 JSFaces 后，再次返回 `Preferences` 并选择 `Server Environments`。创建一个本地服务器。\n\n![](img/164f77fcab6b95970f901980879f9631_110_0.png)\n\
    \n定义运行时环境\n\n选择 JSFaces\n\n我们需要指定 Java 运行时环境的路径。\n\n![](img/164f77fcab6b95970f901980879f9631_111_0.png)完成所有操作后，我们就可以开发我们的应用程序。\n\
