  - "[PAGE 50]\n\n# 4. Multithreading\n\nThreads are used for concurrent programming.\
    \ All systems are designed to run programs as threads, which can run concurrently.\
    \ As a result, programming languages also have the facility to support threaded\
    \ programming. By running threads, we can run multiple code side by side, giving\
    \ us more results in a shorter duration of time.\n\nIn Java, a thread can be in\
    \ any one of the following states:\n\n+   - New - The thread is in the new state\
    \ when we create an instance of the ‘Thread’ class, but before the invocation\
    \ of the ‘start()’ method.\n- Runnable - The thread is in the runnable state after\
    \ invocation of the ‘run()’ method.\n- Running - The thread is in the running\
    \ state if the thread scheduler has selected it.\n- Non-Runnable (Blocked) - The\
    \ thread is in this state when the thread is still alive, but is currently not\
    \ eligible to run.\n- Terminated - The thread is terminated or in the dead state\
    \ when its ‘run()’ method exits.\n\nAll threads are created with the help of either\
    \ extending the thread class, or the Runnable Interface. Let’s look at some examples\
    \ of threads.\n\nExample 30: The following program shows how to create threads\
    \ by extending the thread class.\n\n```\nclass MyThread extends Thread {\n   \
    \ public void run() {\n        System.out.println(\"Thread running\");\n    }\n\
    }\n\n```"
