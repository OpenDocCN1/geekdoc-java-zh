    import javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
    import javax.servlet.http.HttpServletResponse;\n\n/**\n * Servlet implementation\
    \ class Demo\n */\n@WebServlet(\"/Demo\")\npublic class Demo extends HttpServlet\n\
    {\n    private static final long serialVersionUID = 1L;\n\n    /**\n     * @see\
    \ HttpServlet#HttpServlet()\n     */\n    public Demo() {\n        super();\n\
    \        // TODO Auto-generated constructor stub\n    }\n\n    /**\n     * @see\
    \ HttpServlet#doGet(HttpServletRequest request, HttpServletResponse response)\n\
    \     */\n    protected void doGet(HttpServletRequest request, HttpServletResponse\
    \ response) throws ServletException, IOException {\n        // TODO Auto-generated\
    \ method stub\n        String id=request.getParameter(\"Id\");\n        String\
    \ name=request.getParameter(\"name\");\n        \n        PrintWriter out=response.getWriter();\n\
    \        out.println(\"<p> id is \"+id + \"</p>\");\n        out.println(\"<p>\
    \ Name is \"+name + \"</p>\");\n    }\n\n    /**\n     * @see HttpServlet#doPost(HttpServletRequest\
    \ request, HttpServletResponse response)\n     */\n    protected void doPost(HttpServletRequest\
    \ request, HttpServletResponse response) throws ServletException, IOException\
    \ {\n        // TODO Auto-generated method stub\n        doGet(request, response);\n\
    \    }\n}\n```\n\nThe following things need to be noted about the modified program:\n\
    \n- In the 'doGet' method, we now create a 'PrintWriter' object to write data\
    \ back as a response.\n- We then use the 'request.getParameter' object to get\
    \ the query string parameters. Here we are assuming that we are passing an 'ID'\
    \ and 'Name' as query string parameters. We are then writing these values back\
    \ in response.\n- Finally, we are embedding these values in html tags and then\
    \ writing the response back to the client.\n\nWhen we refresh the browser window\
    \ in Eclipse, we will get the following output:\n\n![](img/164f77fcab6b95970f901980879f9631_105_0.png)\n\
    \nId is null\nName is null\n\nThis is because we are not passing any Query String\
