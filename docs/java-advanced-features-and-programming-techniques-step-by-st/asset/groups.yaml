    # The ID of the person is 10\n# The name of the person is John\n\n# 7. Properties\n\
    \nJava properties are nothing more than key-value pairs. For each pair, the key\
    \ and value are both String. To manage properties, Java provides the following:\n\
    \n- Loading key-value pairs into a Properties object.\n- Retrieving values.\n\
    - Listing keys.\n- Enumerating over keys.\n\nWhen we look at some of properties,\
