    \nId is 1\nName is John\n\nSo from above output we can see that once we enter\
    \ Query String parameters, we get the desired output.\n\n## 11. Java Faces\n\n\
    Java Faces (JSF) is used to develop component based interfaces for web applications.\
    \ The Java Faces application runs on the server that processes the application.\
    \ The program itself can also contain JavaScript for client side interaction.\
    \ For the purpose of working with Java Faces, we need to use JSFaces tools. JSFaces\
    \ is a reference implementation of the Java Enterprise Edition and will help to\
    \ build Java Faces programs. If we are using an IDE as Eclipse, we need to add\
    \ JSFaces tools to it. This can be done through the following steps:\n\n- Go to\
    \ ‘Preferences’.\n- Choose ‘Server Runtime Environments’.\n- Choose to add a new\
    \ runtime environment. Here under Oracle, we can see JSFaces Tools.\n- Add, remove,\
    \ or edit server runtime environments.\n\nServer runtime environments:\n\n| Name\
    \ | Type |\n| --- | --- |\n| Apache Tomcat v8.5 | Apache Tomcat v8.5 |\n\nClick\
    \ Next to download and install the type of runtime environment:\n\n- Oracle\n\
    - JSFaces Tools\n- Oracle Cloud Tools\n- If you don't have JSFaces software, it\
    \ can be downloaded from the following link: https://javaee.github.io/glassfish/download\n\
    - Once JSFaces has been installed, again go back to Preferences and Server Runtime\
    \ Environment. Choose to add a runtime environment and ensure to ‘Create a new\
    \ local server’.\n\n![](img/164f77fcab6b95970f901980879f9631_110_0.png)\n\nDefine\
    \ a new server runtime environment\n\nSelect the type of runtime environment:\n\
    \n- Apache Tomcat v9.0\n- Basic\n- JSFaces\n\nSupports JSFaces 4 and 3.1\n\n-\
    \ Create a new local server\n- Next we need to specify the location of the Java\
    \ Runtime Environment and JSFaces folder.\n\n![](img/164f77fcab6b95970f901980879f9631_111_0.png)\n\
    \nOnce all this is done, we can start developing our first application.\n\n###\
    \ 11.1 Developing a Sample Application\n\nLet’s understand what goes into building\
    \ a sample application. The following steps need to be in place:\n\nStep 1\nCreate\
    \ a web project in the IDE.\n\nStep 2\nCreate a Java class file that will act\
    \ as a ‘ManagedBean’. An example is shown below.\n\n```java\nimport javax.faces.bean.ManagedBean;\n\
    \n@ManagedBean\npublic class hello\n{\n    final String world = \"Hello World\"\
    ;\n    public String getworld()\n    {\n        return world;\n    }\n}\n```\n\
    \nIn the above program, we need to add an annotation for the class to ensure it\
    \ is recognized as a ‘ManagedBean’. Then we define a property called ‘world’ and\
    \ put the value as ‘Hello World’.\n\nStep 3\nIn the ‘web.xml’ file, the following\
    \ code should be present to ensure that this becomes a Java Face application.\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<web-app version=\"3.1\"\
    \ xmlns=\"http://xmlns.jcp.org/ns/javaee\"\nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
