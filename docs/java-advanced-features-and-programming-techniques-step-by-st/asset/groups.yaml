    \ 注解已应用于包含我们主程序的类。\n\n## 6. 反射\n\n反射是大多数现代编程语言中存在的一个概念。它允许在运行时对类和方法进行内省。例如，假设我们不知道某个类中存在哪些方法。我们实际上可以在运行时检查该类。为了实现这一点，我们需要使用\
    \ Java 提供的反射 API。\n\n让我们来看反射使用的第一个示例。\n\n## 示例 39：以下程序是反射的一个示例。\n\n```java\nimport\
