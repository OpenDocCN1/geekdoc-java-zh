    # 7. Java Properties


    Java properties are configuration values that are nothing more than key value
    pairs. For each pair, the key and the value are both String values. To manage
    properties, Java provides the ‘java.util.Properties’ class. This class provides
    methods for the following:


    +   - Loading key/value pairs into a Properties object from a stream.

    - Retrieving a value from its key.

    - Listing the keys and their values.

    - Enumerating over the keys.

    - Saving the properties to a stream.


    When we look at some of the use cases for properties, one clear example is the
    storage of database properties in a file. For example, the properties file can
    be used to store database values which can then be read from the program.


    Let’s look at an example on this.


    **Example 47: The following program showcases how to work with the properties
    file.**


    First we create a file called ‘db.properties’ and we add the following key pairs
    to the file:


    ```

    user=system

    password=oracle

    ```


    Then we write the following program:


    ```

    import java.io.FileReader;

    import java.util.Properties;


    public class Demo

