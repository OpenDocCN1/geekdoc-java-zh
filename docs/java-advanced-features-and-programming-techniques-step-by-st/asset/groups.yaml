    # Introduction


    Welcome to the third installment of the Step-By-Step Java series, where I go even
    further into the workings of Java by looking at advanced features and techniques.
    If you haven''t read the first two books in the series, Our beginner guide covers
    the fundamentals of getting started with Java and takes you step by step through
    writing your very first program, while the second book in the series looks at
    slightly more complex topics while still being beginner friendly.


    ![](img/164f77fcab6b95970f901980879f9631_9_0.png)


    JAVA Programming Basics for Absolute Beginners


