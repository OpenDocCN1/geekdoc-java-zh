    \    public void Input(){\n    }\n}\n\npublic class Demo {\n    public static\
    \ void main(String[] args) throws NoSuchMethodException,\n    InvocationTargetException,\
    \ IllegalAccessException, ClassNotFoundException,\n    InstantiationException\
    \ {\n        Class<?> c = Class.forName(\"Person\");\n        Object t = c.newInstance();\n\
    \n        Class[] par1 = new Class[1];\n        par1[0] = Integer.TYPE;\n\n  \
    \      Object[] arglist = new Object[1];\n        arglist[0] = new Integer(10);\n\
    \n        Method meth = Person.class.getDeclaredMethod(\"Display\",par1);\n  \
    \      meth.invoke(t,arglist);\n    }\n}\n```\n\nThe following things need to\
    \ be noted about the above program:\n\n- We now have an ‘Integer’ parameter for\
    \ our ‘Display’ method.\n- We create a new parameter type of ‘Integer’ when we\
    \ call our ‘getDeclaredMethod’ method.\n- Then we create a new ‘Integer’ object\
    \ type and pass in the value of 10.\n- When we invoke the method, we pass this\
    \ value of 10 so that it can be passed over to the method.\n\nWith this program,\
    \ the output is as follows:\n\n# The id is 10\n\n# 6.3 Changing the Values of\
    \ Fields\n\nWe can also change the value of fields assigned to classes via reflection.\
    \ Let's look at an example of how we can achieve this.\n\nExample 46: This program\
    \ shows how to change the value of fields via reflection.\n\n```java\nimport java.lang.reflect.Constructor;\n\
    import java.lang.reflect.Field;\nimport java.lang.reflect.InvocationTargetException;\n\
    import java.lang.reflect.Method;\n\nclass Person\n{\n    public int ID;\n    public\
    \ String name;\n    public void Display()\n    {\n        System.out.println(\"\
    The ID of the person is \"+this.ID);\n        System.out.println(\"The name of\
