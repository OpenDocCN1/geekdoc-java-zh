    # 11. Java Server Faces


    Java Server Faces (JSF) is used to develop component based user interfaces for
    web based applications. The Java Server Faces application runs on the server that
    processes the Java Server based application. The program itself can also contain
    JavaScript for client side interaction.


    For the purpose of working with Java Server Faces, we need to use the GlassFish
    tools. GlassFish is a reference implementation of the Java Enterprise Edition
    and will help to build Java Server Faces programs. If we are using an IDE such
