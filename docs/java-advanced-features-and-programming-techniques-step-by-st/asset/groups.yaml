    \       super();\n        // TODO Auto-generated constructor stub\n    }\n\n \
    \   /**\n     * @see HttpServlet#doGet(HttpServletRequest request, HttpServletResponse\
    \ response)\n     */\n    protected void doGet(HttpServletRequest request, HttpServletResponse\
    \ response) throws ServletException, IOException {\n        // TODO Auto-generated\
    \ method stub\n        String id=request.getParameter(\"Id\");\n        String\
    \ name=request.getParameter(\"name\");\n        \n        PrintWriter out=response.getWriter();\n\
    \        out.println(\"<p> id is \"+id + \"</p>\");\n        out.println(\"<p>\
    \ Name is \"+name + \"</p>\");\n    }\n\n    /**\n     * @see HttpServlet#doPost(HttpServletRequest\
    \ request, HttpServletResponse response)\n     */\n    protected void doPost(HttpServletRequest\
    \ request, HttpServletResponse response) throws ServletException, IOException\
    \ {\n        // TODO Auto-generated method stub\n        doGet(request, response);\n\
    \    }\n}\n```\n\n关于修改后的程序需要注意以下几点：\n\n- 在 `doGet` 方法中，我们现在创建了一个 `PrintWriter`\
    \ 对象来将数据作为响应写回。\n- 随后我们使用 `request.getParameter` 对象来获取查询字符串参数。在这里假设我们正在传递 `ID`\
    \ 和 `Name` 作为查询字符串参数。然后我们将这些值写回响应中。\n- 最后，我们将这些值嵌入 HTML 标签中，然后将响应写回客户端。\n\n当我们刷新\
    \ Eclipse 中的浏览器窗口时，将得到如下输出：\n\n![](img/164f77fcab6b95970f901980879f9631_105_0.png)\n\
    \nId is null\nName is null\n\n这是因为我们没有传递任何查询字符串值，因此 ID 和 Name 的默认值是 null。如果我们附加查询字符串，将得到如下输出：\n\
    \n![](img/164f77fcab6b95970f901980879f9631_106_0.png)\n\nId is 1\nName is John\n\
    \n所以从上面的输出可以看出，一旦我们输入查询字符串参数，就能得到所需的输出。\n\n## 11. Java Faces\n\nJava Faces (JSF)\
