  trans: "\n\n如果可能，请避免在条件表达式中使用简单赋值。这是因为在检查 JavaScript 代码时，简单赋值经常会被与等性判断运算符混淆。例如，你绝不能将以下代码添加到你的陈述中：\n\
    \n```javascript\nif (a = b) {\n    /* sample_statement */\n}\n```\n\n如果你确实需要在条件表达式中使用简单赋值，请将其放在一对括号之间。这里有一个示例：\n\
    \n```javascript\nif ((x = y)) {\n    /* sample_statement */\n}\n```\n\n## 假值 (The\
    \ Falsy Values)\n\n“假值”（falsy value）是指评估结果为 `false` 的值。以下是你在使用 JavaScript 时会遇到的假值：\n\
    \n- `0`\n- `null`\n- `false`\n- `undefined`\n- `NaN`\n- `\"\"`（即空字符串）\n\n未列在上述列表中的值在条件语句中的求值结果均为\
    \ `true`。\n\n## “Switch”语句\n\n这种语句允许应用程序检查一个表达式并将其与预定义的一组情况（cases）进行比较。如果匹配成功，应用程序将运行指定的命令。以下是基础\
    \ `switch` 语句的语法：\n\n![](img/00018.jpeg)\n\n首先，应用程序将搜索标签与表达式值匹配的 `case`。然后，它会将控制流传递到该特定语句，执行指定的语句。如果没有找到匹配项，应用程序将检查\
    \ `default` 子句（可选）并将控制流传递到该子句，运行指定的语句。如果语句没有 `default` 子句，应用程序将直接运行 `switch` 语句之后的语句。通常，`switch`\
    \ 语句的最后一个子句作为 `default` 子句，但并不是强制性的。\n\n你还可以在 `switch` 中添加 `break` 语句。`break`\
    \ 语句可以确保一旦找到匹配项，应用程序就会退出 `switch` 语句。当应用程序退出 `switch` 时，系统将运行 `switch` 语句之后的语句。如果你的代码中没有\
    \ `break`，应用程序将直接运行你 `switch` 语句中的所有命令。\n\n## 如何处理异常\n\nJavaScript 允许你抛出并管理异常。要完成这些操作，你必须使用以下语句：\n\
    \n- `throw` 语句\n- `try…catch` 语句\n\n## 异常的类型类型\n\n在 JavaScript 中，你可以抛出任何类型的对象。然而，抛出的对象可能具有不同的特征。虽然通常抛出字符串和/或数字作为错误消息，但利用专为此目的设计的异常类型通常会更有利。以下是\
    \ JavaScript 中两种最受欢迎的异常：\n\n- `DOMError` – 这种异常表示一个命名的错误对象。\n- `DOMException`\
    \ - 这种异常表示在使用属性或方法时发生的异常情况。要使用此异常，你必须在代码中添加 `DOMError()`。\n\n## “throw”语句\n\n\
    显显然，该语句允许你抛出异常。在抛出异常时，你必须指定持有要抛出数据的表达式。以下是语法：\n\n![](img/00019.jpeg)\n\n上述语法可以抛出任何类型的表达式。以下列表显示了一些示例：\n\
    \n- `throw \"Error1\"; // 字符串类型异常`\n- `throw 1; // 数字类型异常`\n- `throw false; //\
    \ 布尔类型异常`\n\n重要提示：你可以在抛出异常时指定对象。然后，你可以在语句的 `catch` 部分指定该对象/对象的属性。\n\n## “try…\
    \ catch”语句\n\n该语句寻找你可以尝试的语句块。它还指定了在抛出异常时使用的响应。`try…catch` 语句捕获抛出的异常。\n\n`try…catch`\
    \ 语句有三个部分，分别是：\n\n1. **`try` 部分** – 它包含一个或多个 JavaScript 语句。这部分是强制性的。\n2. **`catch`\
    \ 部分** –这部分完全可选（见下文）。它包含了指示程序在抛出异常时必须执行的语句。这意味着如果 `try` 部分执行失败，程序控制将转到 `catch`\
    \ 部分。如果 `try` 部分内部的语句抛出异常，程序控制将立即转到 `catch` 部分。然而，如果没有发生异常，系统将跳过语句的 `catch` 部分。\n\
    \n在 JavaScript 中，你可以使用 `catch` 部分来管理 `try` 部分可能抛出的所有异常。以下是你应该使用的语法：\n\n![](img/00020.jpeg)\n\
    \n在上述语法中，`catchID` 代表包含你在 `throw` 语句中赋值的值的标识符。你可以使用此标识符来获取有关抛出的异常的数据。每当执行 `catch`\
    \ 部分时，JavaScript 都会生成此标识符。该标识符仅在 `catch` 部分活动期间有效。这意味着一旦 `catch` 部分执行完毕，该标识符将不再存在。\n\
    \n例如，下面的代码生成了一个异常。一旦抛出异常，程序控制将转到 `catch` 部分。\n\n![](img/00021.jpeg)\n\n3. **`finally`\
    \ 部分** – 它包含在执行完之前的部分后运行的语句。无论程序是否遇到异常，放置在 `finally` 部分的语句都会运行。此外，即使语句没有 `catch`\
    \ 部分，此部分内的语句仍然会运行。\n\n通常，程序员使用此部分在发生异常时为他们的项目设置优雅的退出。例如，他们可能需要释放受问题脚本影响的一些资源。下面的图片将帮助你理解该部分是如何工作的。\n\
    \n![](img/00022.jpeg)\n\n## 如何利用错误对象\n\n在某些情况下，你可以通过检查属性（即 `name` 和 `message`）来获取有关错误的更多信息。如果你的代码\
    \ catch 部分无法指示错误是由用户还是系统生成的，这种功能将非常有用。要利用错误对象，你必须使用名为 `Error Constructor` 的 JavaScript\
    \ 工具。这里有一个示例：\n\n![](img/0023.jpeg)\n\n## JavaScript Promise\n\nJavaScript 语言现在支持\
    \ `promises`（一种允许程序员管理延迟和异步过程的对象）。Promise 会经历以下状态：\n\n- `Pending` – 这是 promise\
    \ 的初始状态。在此状态下，promise 可能被拒绝或完成。\n- `Fulfilled` – 如果系统成功完成了所有分配的任务，promise 将变为“已完成”。\n\
    - `Settled` – 一个已定的 promise 可以被拒绝或完成。\n- `Rejected` – 在拒绝的 promise 中，系统未能完成分配的任务。\n\
    \n## 第四章：JavaScript 中不同类型的循环\n\n循环允许你快速方便地重复代码段。本章将关注 JavaScript 提供的不同循环。\n\n\
    ### 通用信息\n\n在编写自己的代码时，你会发现一些需要反复使用相同代码的情况。这种任务既无聊又耗时。然而，你不能跳过它，因为如果没有正确的代码，你的应用程序无法正常工作。\n\
    \n"
