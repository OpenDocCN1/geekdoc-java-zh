    be adjusted to improve their effectiveness in copying codes. Additionally, each
    loop type has distinct characteristics that make them extremely useful and convenient
    in certain situations. Here are the loop statements that you’ll find in JavaScript:


    *   “for”


    *   “while”


    *   “do… while”


    *   “label”


    *   “break”


    *   “for…  of”


    *   “for… in”


    *   “continue”


    The “for” Loop


    Basically, “for” loops repeat a statement until an assigned condition results
    to false. The syntax of JavaScript “for” loops is similar to that of C and Java.
    Here’s the syntax:


    ![](images/00024.jpeg)


    The following things happen whenever a “for” loop runs:


    1.  The loop’s initializing expression (represented by initialExpression in the
    syntax above) performs its function/s. Often, an initializing expression triggers
    multiple loop counters. That means the syntax given above accepts different levels
    of complexity. You may also use this expression to declare variables.


    Important Note: The initializing expression is optional; thus, you can create
    effective “for” loops without using any initializing expression.


    2.  The system evaluates the conditional expression. If the evaluation is true,
    the statements contained in the loop will run. However, if the evaluation is false,
    the entire loop will stop.


    Important Note: The conditional expression is optional. If you won’t add a conditional
    expression in your “for” loop, the system will assume that the evaluation is true.


    3.  The statement runs. If you want to run multiple statements, you must group
    them into a block (i.e. by enclosing them in curly braces).


    4.  The final expression (represented by incrementExpression in the syntax) updates
    the entire loop, then the control flow will go back to the second step (see above).


    The “while” Loop


    “While” loops execute their statement/s while the assigned condition results to
    “true.” Here is the syntax of a “while” loop:


    ![](images/00025.jpeg)


    Once the condition results to “false”, the loop will stop running the assignments
    assigned to it, then the control flow will go to the statement right after the
    “while” loop.


    The system evaluates the condition prior to running the loop itself. If the condition
    is true, the statement/s inside the loop will run and the system will check the
    condition again. If the condition is false, the loop will stop and the control
    flow will move on to the next statement.


    Important Note: Since the condition test happens first, a “while” loop may never
    run. That means you have to be extremely careful when creating “while” loops in
    your JavaScript programs.


    JavaScript allows you to enclose multiple statements using a pair of curly braces.
    Use this option if you want to include various statements in your “while” loops.


    The “do… while” Loop


    This kind of loop runs its statement/s until the assigned condition becomes false.
    When creating a “do… while” loop, you must use the following syntax:


    ![](images/00026.jpeg)


    Here, the system executes the statements once before checking the assigned condition.
    If the condition is true, the system will execute the statements again. This process
    will continue until the condition becomes false. Once the condition evaluates
    to false, the control flow will go to the statement right after the “do… while”
    loop.


    In this type of loop, the statements are guaranteed to run at least once even
    if the condition is false.


    The “label” Statement


    This kind of statement allows you to “label” (i.e. assign an identifier) your
    statements. By labeling your JavaScript statements, you can easily repeat them
    at any part of your application. For instance, you may label a certain loop, and
    utilize other statements to either continue or disrupt its execution.


    Here is the syntax of a “label” statement:


    ![](images/00027.jpeg)


    When creating a label, you may use any identifier that isn’t a JavaScript keyword.
    You may use the syntax given above for any statement.


    The “break” Statement


    Programmers use this statement to end loop or switch statements. When using a
    “break” statement, you must remember the following rules:


    *   If your break statement doesn’t have a label, it will terminate the innermost
    loop/switch and pass the control flow to the next statement.


    *   If your break statement has a label, it will terminate the labeled statement.


    The syntax of a break statement is:


    ![](images/00028.jpeg)


    Use the first variant of the syntax if you don’t need to specify a label. This
    will terminate the innermost loop/switch. Use the second variant if you want to
    terminate a certain loop/switch. Just enter the label of that particular loop
    or switch. When using the second variant, only the specified loop/switch will
    be terminated.


    The “for… of” Statement


    This statement is a recent addition to the JavaScript language. It creates a loop
    that can repeat “iterable objects” (e.g. maps, sets, arrays, arguments, etc.).
    It also invokes an iteration hook that will run for each distinct property of
    an object. JavaScript allows you to customize the iteration hook of any “for…
    of” statement. Here is the syntax that you must use:


    ![](images/00029.jpeg)


    The “for… in” Statement


    A “for… in” statement repeats the assigned statement/s over the properties of
    any object. JavaScript will execute the assigned statement/s for every property.
    The syntax of a “for… in” statement is:


    ![](images/00030.jpeg)


    The “continue” Statement


    You may use this statement to restart other statements (e.g. for, while, do… while,
    and label). Here are the two rules that you must remember when using a “continue”
    statement:


    *   If you won’t include a label in your continue statement, it will terminate
    the current process of the innermost loop and continue the next one. Unlike a
    break statement, a continue statement cannot terminate an entire loop. If used
    on “while” loops, the control flow will return to the assigned condition. If used
    on a “for” loop, on the other hand, the control flow will go back to the increment
    expression.


    *   If you’ll include a label in your continue statement, it will only affect
    the statement linked to that label.


    The syntax of a continue statement has two forms, which are:


