    Chapter 2: The Basic Elements of the JavaScript Language


    In this chapter, you’ll learn about JavaScript’s grammar, variables, data types,
    and constants/literals.


    General Information


    The syntax of this programming language is similar to that of Awk, Perl, Java,
    and Python. Additionally, it is case-sensitive and utilizes Unicode characters.


    When using JavaScript, programmers refer to computer instructions as “statements.”
    You should separate statements using a semicolon. JavaScript also supports whitespaces
    (e.g. tabs, spaces, and newline characters). This means that you may use these
    characters to improve the readability of your JavaScript statements.


    The JavaScript compiler scans source codes from left to right and converts them
    into groups of input objects (i.e. comments, whitespaces, tokens, line terminators,
    and control characters).


    Comments


    JavaScript’s syntax for writing comments is similar to that of most programming
    languages. You must use two slashes (i.e. //) to create a single-line comment.
    However, to create a comment that spans multiple lines, you must use /* and */
    at the start and end of the comment, respectively. The screenshot below will show
    you how to use these characters in writing your own codes:


    ![](images/00004.jpeg)


    Important Note: JavaScript doesn’t support nested comments (i.e. comments placed
    inside another comment).


    The Declarations in JavaScript


    The JavaScript programming language supports three types of declarations. These
    are:


    *   var – Use this declaration to create a new variable. During the declaration,
    you may assign a value to the variable.


    *   let – This declaration allows you to create a local variable. You may place
    a value on the variable during the declaration phase.


    *   const – Use this declaration to create a constant. Constants are read-only:
    you can’t change their value after the declaration.


    Let’s discuss these declarations in detail:


    The “var” Declaration


    The syntax of this declaration is:


    ![](images/00005.jpeg)


    You can replace “varname1” with any valid identifier. JavaScript has reserved
    keywords – words that cannot be used in naming variables, constants, objects,
    etc. You’ll learn about these keywords later.


    In this syntax, “value1” represents the value of the variable. You may replace
    it with any valid JavaScript expression.


    How Does It Work?


    The JavaScript interpreter prioritizes variable declarations over any type of
    code. The variable’s scope declared through “var” serves as its active execution
    context (i.e. either local or global).


    If you’ll assign a value to a variable that you haven’t declared yet, you’ll get
    a global variable (i.e. a variable that can be accessed at any part of your program).
    Here are the major differences between a declared variable and an undeclared variable:


    *   A declared variable is limited to the function through which it was declared.
    That means a function cannot access the declared variables created inside other
    functions. Undeclared variables, on the other hand, are global 100% of the time.


    *   JavaScript’s interpreter will create declared variables before running any
    code. Undeclared variables, however, can only exist once the interpreter has run
    the necessary codes.


    *   A declared variable is a non-changeable attribute of its respective function.
    Thus, a function cannot edit or delete the declared variables it contains. Undeclared
    variables, on the other hand, allow modifications. That means you can edit or
    delete them, depending on your needs.


    Because of the differences outlined above, you’ll probably get unexpected or undesirable
    results from your program if you’ll fail to declare variables properly. Thus,
    it’s a good programming behavior to declare variables, regardless of their scope.


    The “let” Declaration


    Here is the syntax of this declaration:


    ![](images/00006.jpeg)


    You may replace “var1” with the name you’d like to use for your variable.


    If you want to assign a value to the new variable, just replace “value1” with
    the appropriate data.


    How Does it Work?


    This declaration allows you to create variables that are restricted in scope to
    the expression, block or statement where you used them.


    If you’ll use “let,” the variables that you’ll get will consider their container
    as their scope. In this aspect, “let” is similar to “var.” The major difference
    is that a “var” variable’s scope is the whole function that encloses it.


    The “const” Declaration


    With this declaration, you can create a read-only reference to any value. Basically,
    you can still edit these references whenever you need to. It’s just that you won’t
    be able to transfer or reassign them after the declaration phase. The syntax of
    this declaration is:


    ![](images/00007.jpeg)


    How Does It Work?


    With this declaration, you can generate a constant (also known as “literal”) that
    can be either local or global. The syntax given above requires an initializer.
    That means you have to specify the variable’s value at the time of declaration.


    A constant is block-scoped. In this aspect, constants are similar to variables
    declared through “let.”


    Important Note: You cannot change a constant’s value through reassignment or “re-declaration.”


    JavaScript Variables


    Variables serve as symbolic identifiers for the values needed by your programs.
    When naming your variables, you have to remember these rules:


    *   Start the variable’s name using a letter, a dollar sign (i.e. $), or an underscore
    (i.e. “_”). You may include numbers in the name of your variable. However, you
    can’t start the name using a number. For example: “javascript1” is valid but “1javascript”
    isn’t.


    *   The JavaScript language is case-sensitive. That means you have to be consistent
    with letter capitalization when naming variables. For example, JavaScript treats
    “LETTER,” “Letter,” “letter” as three different variables.


    How to Declare a Variable


    In JavaScript, you can declare variables in three different ways:


    *   Using the “var” keyword - For instance, var z = 99. You can use that syntax
    to create a local or global variable.


    *   By assigning a value to a non-existing variable - For instance, z = 99. This
    method is much simpler than the previous one. However, you should only use this
    to create global variables.


    *   Using the “let” keyword - For instance, let a = 20. You can use this syntax
    to declare block scope variables.


    How to Evaluate a Variable


    If you’ll declare a variable using “let” or “var” without assigning a value, that
    variable will get “undefined” as its initial value.


    Important Note: Accessing undeclared variables will give you an error message.


    You may use undefined to check whether a variable holds a value. The image below
