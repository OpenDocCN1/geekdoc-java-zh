    # Cookie 是如何工作的？


    Web 服务器将信息以 Cookie 的形式发送给用户的浏览器。如果浏览器接受了该 Cookie，该信息将在用户的硬盘中被转换为明文。一旦用户再次访问了你网站上的另一个网页，他的浏览器将向
    Web 服务器发送相同的 Cookie 以进行数据检索。一旦检索到数据，你的 Web 服务器就会知道之前发生了什么。


    基本上，Cookie 是一个包含 5 个字段（长度可变）的明文数据记录。这些字段是：


    - `Domain`: 这是你网站的域名。

    - `Secure`: 如果此字段被标记为“secure”，则只有安全的 Web 服务器可以检索 Cookie。但是，如果它是空的，任何 Web 服务器都可以访问该
    Cookie。

    - `Expires`: 此字段指定了 Cookie 过期的日期。如果此字段为空，Cookie 将在用户关闭网络浏览器时过期。

    - `Path`: 这是创建 Cookie 的网页或目录的路径。如果你想从任何页面或目录检索 Cookie，可以留此字段为空。

    - `Name=Value`: 每个 Cookie 都是以键值对的形式进行设置和检索的。


    Cookie 的创建是为了 CGI（即通用网关接口）编程。存储在 Cookie 中的信息会在 Web 服务器和用户的浏览器之间自动传输。这意味着编写在 Web
    服务器上的 CGI 脚本可以读取和编辑存储在用户硬盘上的 Cookie 信息。


    JavaScript 允许你使用 `Document` 对象的 `cookie` 属性管理 Cookie。JavaScript 语言可以创建、读取、修改和删除应用于活动网页的
    Cookie。


    ## 如何创建 Cookie？


    生成 Cookie 最简单的方法是向名为 `document.cookie` 的对象放置一个字符串值。你应该使用的语法是：


    ```

    ![](img/00039.jpeg)

    ```


    在此语法中，`expires` 是完全可选的。如果你在该字段中输入有效的时间或日期，Cookie 将在该特定时间或日期过期。你将无法访问过期 Cookie
    中存储的值。


    **重要说明**：你不能在 Cookie 中保存空格、逗号或分号。因此，在将它们保存到 Cookie 之前，你必须使用 `escape()` 函数对这些字符进行编码。如果你用这样编码了字符，还应该使用
    `unescape()` 让系统读取你存储的值。


    ## 如何读取 Cookie


    你可以轻松地读取 Cookie。这是因为 Cookie 是存储在名为 `document.cookie` 的对象上的值。这意味着你可以随时使用该字符串来访问
    Cookie。基本上，`document.cookie` 包含一组由分号分隔的 `name=value` 节点。这里，`name` 是 Cookie 的名称，`value`
    是 Cookie 的字符串值。


    ## 如何设置 Cookie 的过期日期


    在某些情况下，你必须将 Cookie 的寿命延长到当前浏览会话之外。这样做，你可以完成长时间的过程而无需重新输入任何信息。JavaScript 允许你设置偏好的过期日期并将该信息保存在
    Cookie 自身内部。你可以通过自定义 Cookie 的“expires”属性来实现这一点。


    下面的图片显示了如何设置 Cookie 的过期日期。它将当前的过期日期延长了一个月。


    ```

    ![](img/00040.jpeg)

    ```


    ## 如何删除 Cookie


    在大多数情况下，在使用 Cookie 后必须删除它们。这确保了 Web 服务器不会从必要的 Cookie 中获取任何信息。删除 Cookie 非常简单直接。你只需要将过期日期设置为过去的时间。


    # 第 8 章：页面重定向


    ## 页面重定向 – 基础


    你可能尝试过访问某个网页，但被重定向到了另一个。该事件的发生是因为页面重定向。不要将其与页面刷新（将在下文中讨论）混淆。


    有很多理由需要你从某个页面重定向用户。以下是最常见的原因：


    - 你正在将你的网站迁移到新域名。在这种情况下，你需要将所有的网站流量重定向到新域名。你不需要删除旧网站。你可以保留它并使用页面重定向来获取所有网络流量。这种方法可以帮助你留住之前的客户，他们可能并不知道你的新网站。

    - 你根据某些标准（例如浏览器类型、客户名称、客户所在的国家等）创建了网页。与其通过服务器端机制重定向访问者，你可能采用客户端重定向将访问者引导到正确的网页。

    - 即使你已经切换到新网站，你仍想保留来自旧 SEO 活动的流量。如果你使用页面重定向来获取非法网络流量，搜索引擎可能会从搜索结果页面中封禁你的网站。


    ## 页面刷新


    在 JavaScript 中，你可以使用 `location.reload` 方法刷新网页。你可以自动调用此方法，也可以在用户点击某个链接时调用它。如果你喜欢根据鼠标点击刷新网页，应该使用下面的代码：


    ```

    ![](img/00041.jpeg)

    ```


    ### 自动刷新


    JavaScript 允许你在一段时间后刷新网页。你只需要使用 `setTimeout()`（即一个预装的 JavaScript 函数）在预定的时间间隔后运行另一个函数。


    ## 页面重定向是如何运作的？


    程序员以不同的方式实现页面重定向。以下是一些示例：


    1. 你可能使用 JavaScript 实现客户端页面重定向。为了将你的网站访问者引导到新网页，你只需要在 HTML 文档中添加一行。例如：


    ```

    ![](img/0042.jpeg)

    ```


    2. 你可以在引导访问者之前显示消息。这种方法涉及延迟：网页需要加载你想显示的消息。下面的代码将显示如何使用它：


    ```

    ![](img/00043.jpeg)

    ```


    3. 你可以根据用户使用的浏览器重定向用户。以下示例将显示如何实现：


    ```

    ![](img/0044.jpeg)

    ```


    # 第 9 章：对话框


    JavaScript 语言支持三种对话框。你可以使用这些对话框来发出警告、确认输入或要求用户输入某些信息。本章将详细讨论每种对话框。


    ## 警告框 (Alert Box)


    使用此框为你的网站访问者显示警告消息。例如，如果用户在必填字段没有输入任何内容，你可以使用警告对话框来提醒该用户。程序员认为这种对话框是用户验证的重要部分。


    **重要说明**：你也可以使用警告框显示友好的消息。此外，警告框只有一个按钮（即“确定”按钮）。用户需要点击该按钮后才能继续。


    ## 确认框 (Confirmation Box)


    通常，你会使用此对话框来请求用户的同意。此对话框有两个按钮：确定和退出（或取消）。网站开发者使用此对话框来确认访问者继续操作的意图。


    ## 提示框 (Prompt Box)


    如果你需要显示一个可以接受用户输入的文本框，这个对话框非常有用。这意味着你可以使用提示框与你的网站访问者进行交互。你的访问者必须输入所需的信息并点击确定按钮。


    要在网页上显示提示对话框，你必须使用 `prompt()` 方法。该方法接受两个参数：(1) 你想在对话框中显示的标签，(2) 你想在对话框中显示的文本字符串。


