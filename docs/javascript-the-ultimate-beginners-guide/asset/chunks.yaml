    此工具是一个独立的 Firefox 窗口，作用类似于文本编辑器。你可以用它在浏览器中编写和运行 JavaScript 代码。此外，你还可以使用 Scratchpad
    保存新代码或加载现有的代码。


    下方的截图显示了 Scratchpad 工具界面：


    ![](img/00002.jpeg)


    # 你的第一个 JavaScript 应用程序


    在本节中，你将使用 JavaScript 编写你的第一个应用程序。这个简单的活动将让你体验 JavaScript 的特性和编程环境。


    启动 Scratchpad 并输入以下代码：


    ![](img/00003.jpeg)


    高亮 JavaScript 代码并按 `Ctrl+R` 以在屏幕上查看结果。


    下一章将讨论 JavaScript 的语法和特性；因此，你将能够创建比上面示例更复杂的应用程序。


    # 第 2 章：JavaScript 语言的基础元素


    在本章中，你将学习 JavaScript 的语法、变量、数据类型以及常量/字面量。


    ## 通用信息


    该编程语言的语法与 Awk、Perl、Java 和 Python 相似。此外，它是区分大小写的，并使用了 Unicode 字符。


    在使用 JavaScript 时，程序员将计算机指令称为“语句”。你应该使用分号来分隔语句。JavaScript 还支持空白字符（例如制表符、空格和换行符）。这意味着你可以使用这些字符来提高
    JavaScript 语句的可读性。


    JavaScript 编译器会从左到右扫描源代码，并将其转换为一组输入对象（即：注释、空白字符、标记、行终止符和控制字符）。


    ## 注释


    JavaScript 编写注释的语法与大多数编程语言相似。你必须使用两个斜杠（即 `//`）来创建单行注释。然而，要创建一个跨越多行的注释，你必须在注释的开头和结尾分别使用
    `/*` 和 `*/`。下方的截图将向你展示如何在编写代码时使用这些字符：


    ![](img/00004.jpeg)


    **注意：** JavaScript 不支持嵌套注释（即放置在另一个内部内部注释）。


    ## JavaScript 中的声明


    JavaScript 编程语言支持三种类型的声明。这些是：


    - `var` – 使用此声明创建一个新变量。在声明期间，你可以给变量赋值。

    - `let` – 这种声明允许你创建一个局部变量。你可能在声明阶段给变量赋值。

    - `const` – 使用此声明创建一个常量。常量是只读的：在声明后你无法更改它的值。


    让我们详细讨论这些声明：


    ### “var”声明


    该声明的语法为：


    ![](img/00005.jpeg)


    你可以将 `varname1` 替换为任何有效的标识符。JavaScript 有保留关键字——即不能用于命名变量、常量、对象等的词汇。你将在稍后学习这些关键字。


    在此语法中，`value1` 代表变量的值。你可以将其替换为任何有效的 JavaScript 表达式。


    #### 它是如何工作的？


    JavaScript 解释器对变量声明的优先级高于任何类型的代码。通过 `var` 声明的变量作用域是其活跃的执行上下文（即局部或全局）。


    如果你给一个尚未声明的变量赋值，你将得到一个全局变量（即可以在程序的任何部分访问的变量）。以下是声明变量和未声明变量之间的主要区别：


    - 声明的变量限于声明它的函数。这意味着函数无法访问在其他函数内部创建的声明变量。相反，未声明的变量 100% 的情况下都是全局的。

    - JavaScript 解释器会在运行任何代码之前创建声明变量。然而，未声明的变量只有在解释器运行了必要的代码后才能存在。

    - 声明的变量是其相应函数的不可更改的属性。因此，函数不能编辑或删除它包含的声明变量。相反，未声明的变量允许修改。这意味着你可以根据需要编辑或删除它们。


    由于上述差异，如果你未能正确声明变量，你的程序可能会产生意料之外或不符合预期的结果。因此，无论作用域如何，声明变量都是一种良好的编程习惯。


    ### “let”声明


    这是该声明的语法：


    ![](img/00006.jpeg)


    你可以将 `var1` 替换为你想要用于变量的名称。


    如果你想给这个新变量赋值，只需将 `value1` 替换为相应的数据即可。


    #### 它是如何工作的？


    这种声明允许你创建变量，其作用域被限制在使用它的表达式、块或语句中。


    如果你使用 `let`，你得到的变量将考虑其容器视为其作用域。在这方面，`let` 与 `var` 相似。主要的区别是 `var` 变量的作用域是包含它的整个函数。


    ### “const”声明


    通过此声明，你可以为任何值创建一个只读引用。基本上，你仍然可以在需要时编辑这些引用。只是在声明阶段后你无法对其进行转移或重新赋值。该声明的语法为：


    ![](img/00007.jpeg)


    #### 它是如何工作的？


    通过此声明，你可以生成一个常量（也称为“字面量”），它可以是局部的也可以是全局的。这种声明需要一个初始化。常量是块作用域的。在这方面，它与 `let` 声明的变量相似。


    **注意：** 你不能通过重新赋值来更改常量的值。


    ## JavaScript 变量


    变量是程序所需的符号标识符。在命名变量时，你必须记住这些规则：


    - 使用字母、美元符号（即 `$`）或下划线（即 `_`）开头命名。你可以在名称中包含数字。但是，你不能用数字开头。例如 `javascript1` 是有效的，但
    `1javascript` 不是。

    - JavaScript 语言是区分大小写的。这意味着在命名变量时必须保持大小写一致。例如，JavaScript 将 `LETTER`、`Letter` 和
    `letter` 视为三个不同的变量。

