    \ will discuss the syntax and features of JavaScript; thus, you will be able to\
    \ create applications that are more complex than the one given above.\n\n# Chapter\
    \ 2: The Basic Elements of the JavaScript Language\n\nIn this chapter, you’ll\
    \ learn about JavaScript’s grammar, variables, data types, and constants/literals.\n\
    \n## General Information\n\nThe syntax of this programming language is similar\
    \ to that of Awk, Perl, Java, and Python. Additionally, it is case-sensitive and\
    \ utilizes Unicode characters.\n\nWhen using JavaScript, programmers refer to\
    \ computer instructions as “statements.” You should separate statements using\
    \ a semicolon. JavaScript also supports whitespaces (e.g. tabs, spaces, and newline\
    \ characters). This means that you may use these characters to improve the readability\
    \ of your JavaScript statements.\n\nThe JavaScript compiler scans source codes\
    \ from left to right and converts them into groups of input objects (i.e. comments,\
    \ whitespaces, tokens, line terminators, and control characters).\n\n## Comments\n\
    \nJavaScript’s syntax for writing comments is similar to that of most programming\
    \ languages. You must use two slashes (i.e. `//`) to create a single-line comment.\
    \ However, to create a comment that spans multiple lines, you must use `/*` and\
    \ `*/` at the start and end of the comment, respectively. The screenshot below\
    \ will show you how to use these characters in writing your own codes:\n\n![](images/00004.jpeg)\n\
    \n**Important Note:** JavaScript doesn’t support nested comments (i.e. comments\
    \ placed inside another comment).\n\n## The Declarations in JavaScript\n\nThe\
    \ JavaScript programming language supports three types of declarations. These\
    \ are:\n\n- `var` – Use this declaration to create a new variable. During the\
    \ declaration, you may assign a value to the variable.\n- `let` – This declaration\
    \ allows you to create a local variable. You may place a value on the variable\
    \ during the declaration phase.\n- `const` – Use this declaration to create a\
    \ constant. Constants are read-only: you can’t change their value after the declaration.\n\
    \nLet’s discuss these declarations in detail:\n\n### The “var” Declaration\n\n\
    The syntax of this declaration is:\n\n![](images/00005.jpeg)\n\nYou can replace\
    \ `varname1` with any valid identifier. JavaScript has reserved keywords – words\
    \ that cannot be used in naming variables, constants, objects, etc. You’ll learn\
    \ about these keywords later.\n\nIn this syntax, `value1` represents the value\
    \ of the variable. You may replace it with any valid JavaScript expression.\n\n\
    #### How Does It Work?\n\nThe JavaScript interpreter prioritizes variable declarations\
    \ over any type of code. The variable’s scope declared through `var` serves as\
    \ its active execution context (i.e. either local or global).\n\nIf you’ll assign\
    \ a value to a variable that you haven’t declared yet, you’ll get a global variable\
    \ (i.e. a variable that can be accessed at any part of your program). Here are\
    \ the major differences between a declared variable and an undeclared variable:\n\
    \n- A declared variable is limited to the function through which it was declared.\
    \ That means a function cannot access the declared variables created inside other\
    \ functions. Undeclared variables, on the other hand, are global 100% of the time.\n\
    - JavaScript’s interpreter will create declared variables before running any code.\
