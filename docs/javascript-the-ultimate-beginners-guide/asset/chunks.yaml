    # 引言


    我想感谢你的购买，并祝贺你获得了我的书书……


    《JavaScript：终极学者指南！”


    这本书将帮助你成为一名高效的 JavaScript 用户。如果你想快速、轻松地学习 JavaScript 语言的基础知识，那么你现在必须拥有这本书。


    这本书将解释有关 JavaScript 语言的重要事实。它不包含任何无关信息。每一页都包含了宝贵的课程、指令和示例。在读完这本书后，你将熟悉对象、函数、变量、语句和其他
    JavaScript 元素。


    再次感谢购买本书，希望你喜欢它！


    # 第一章：通用信息


    `JavaScript` 是一种面向对象的脚本语言，你可以在不同的平台上使用它。在主机环境（例如网络浏览器）中，你可以使用 `JavaScript` 来对对象的程序化控制。


    这种脚本语言带有一个丰富的标准库。该库包含了对象（例如 `Math`、`Date`、`Array` 等）和核心语言元素（例如语句、运算符、控制结构等）。截至目前，程序员们通过添加额外的对象来扩展
    `JavaScript` 的基本功能。他们这样做是为了提高该语言在完成某些任务时的效率。


    以下是 `JavaScript` 最流行的两种变体：


    -   **服务端 JavaScript** – 这种变体旨在帮助程序员在网络服务器上运行 `JavaScript`。例如，服务端扩展可以帮助应用程序与数据库交互、进行文件更改并提供连续的信息流。

    -   **客户端 JavaScript** – 这种形式的 `JavaScript` 是为浏览器及其相应的 `DOM`（即文档对象模型）创建的。例如，客户端
    `JavaScript` 帮助应用程序将元素保存到 `HTML` 文档中并响应用户操作（例如表单输入、鼠标点击、页面导航等）。


    ## JavaScript 与 Java 语言


    `Java` 和 `JavaScript` 是两种不同的编程语言。`JavaScript` 与 `Java` 有一些相似之处（例如命名规范、表达式语法、控制流结构等）。但不具备
    Java 的两个显著特征：强大的类型检查和静态类型。


    根据许多人的说法，这些语言完全没有关系。Netscape（开发 `JavaScript` 的公司）将语言名称从 `LiveScript` 改为 `JavaScript`
    以利用 `Java` 的流行；因此，这些语言名称之间的相似性是因为营销考虑而产生的。


    现在，让我们讨论这些编程语言之间的主要区别。这些信息将帮助你提高对 `JavaScript` 和通用编程的了解。


    -   **JavaScript**: 这是一种灵活的计算机语言。在使用 `JavaScript` 时，你不需要声明所有的方法、类和变量。你不需要担心你将使用的方法类型（即它们是私有的、公有的还是受保护的）。此外，你不需要为
    `JavaScript` 实现任何接口。

    -   **Java**: 这种基于类的计算机语言是为了类型安全和快速实现而创建的。这意味着必须使用类及其相应的方法来创建你的程序。`Java` 的数据类型和类继承需要严格的对象层次结构。简单来说，`Java`
    语言比 `JavaScript` 更复杂。


    ## 如何开始？


    为了使用 `JavaScript`，你不需要下载文件或向你的计算机安装程序。你只需要访问你喜欢的网络浏览器来创建你自己的 `JavaScript` 。如今，`Firefox`
    是 JavaScript 编程最好的网络浏览器之一。因此，如果你的电脑没有 `Firefox`，建议你访问此网站：`https://www.mozilla.org`。这个浏览器免费且易用；因此，你可以轻松掌握
    `JavaScript` 的基础而无需花费任何钱。


    一旦你下载了 `Firefox`，就会看到两个专门为 JavaScript 编程创建的工具。这些工具是：


    ### 1. Web 控制台


    该工具显示有关已加载的网页的信息。它还有一个命令行功能，你可以用它在加载的页面上运行 `JavaScript` 语句。


    要访问 `Web Console`，你只需启动 `Firefox`，点击 `Tools`（工具），并在 `Developer`（开发者）菜单中选择 `Web
    Console`。激活 `Web Console` 后，你会在屏幕底部看到命令行。你可以向该命令行输入 `JavaScript` 表达式，然后屏幕中间的面板将向你显示输入表达式的结果。


    此功能会立即显示结果——你会很快知道自己是否输入了错误代码。


    这是 Web Console 工具的截图：


    ![](img/00001.jpeg)


    ### 2. Scratchpad


    `Firefox` 的 `Web Console` 非常适合运行单个 `JavaScript` 表达式。虽然你可以用它运行多行，但你会发现这样做非常不方便。此外，你无法使用该工具保存你的代码片段。幸运的是，`Firefox`
    还有另一个工具解决了上述问题。这个工具被称为 `Scratchpad`。


    要访问此工具，你需要执行：


    1.  启动 `Firefox`。

    2.  点击 `Tools`。

    3.  找到 `Developer` 部分并选择 `Scratchpad`。


