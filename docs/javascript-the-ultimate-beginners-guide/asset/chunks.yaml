    \ – 这一部分包含函数的语句（即函数体）。\n* 通过函数表达式 – 这种方法与之前的方法相似。事实上，它使用了以下语法（见下文）：\n\n![](img/00033.jpeg)\n\
    \n* 使用 JavaScript 的“函数构造函数” – JavaScript 允许你使用 `new`（即一个 JavaScript 运算符）来生成函数。以下是你必须使用的语法：\n\
    \n![](img/00034.jpeg)\n\n上述给出的语法包含以下部分：\n\n* `arg1, arg2, … argN` – 这一部分包含你想要作为形式参数的名称。\n\
    \    * `functionBody` – 这是一个包含 JavaScript 语句的字符串（即函数体）。\n\n## 如何调用函数\n\n在定义函数时，你只是在为该函数命名，并指定当函数被触发/调用时要执行的操作。如果你想让它执行分配的操作，请调用该函数。例如，如果你定义了“square”（平方）函数，你可以使用以下代码调用它：\n\
    \n```\nsquare(2);\n```\n\n上述代码调用了 `square` 函数并将 2 指定为参数。该函数运行其语句并返回 4 作为结果值。\n\
    \n当你调用函数时，函数必须在适当的作用域内。不过，你可以对函数声明进行**变量提升**（即将其提升到顶部）。这里有一个例子：\n\n![](img/00035.jpeg)\n\
    \n函数的参数可以包含不同的编程元素（即不仅仅是数字和字符串）。JavaScript 允许你将整个对象赋值给你的函数。例如，`show_props()`（即一个内置函数）接受对象作为参数。\n\
    \n### 函数的作用域\n\n如果你在函数内部定义了一个变量，你将无法从外部访问该变量。这是因为你是在函数的作用域内定义它的。简单来说，全局函数可以访问全局变量。嵌套函数（即放在另一个函数内部的函数）可以访问母函数内部创建的变量。\n\
    \n### 函数参数\n\nJavaScript 将参数视为数组对象。在函数内部，你可以使用以下语法访问它们：\n\n```\narguments[n]\n\
    ```\n\n在此语法中，`n` 代表参数的序数，从零开始。这意味着函数的初始参数是 `arguments[0]`。如果你使用 `arguments` 对象，你可以调用持有比代码中声明的更多参数的函数。要确定函数内部对象的数量，你可以使用\
    \ `arguments.length`。然后，你可以使用 `arguments` 对象来访问参数。\n\n#### 函数参数（Parameters）\n\n\
    目前，JavaScript 支持两种类型的参数：默认参数和剩余参数（rest）。\n\n#### 默认参数\n\n在 JavaScript 语言中，任何函数的默认参数都是\
    \ `undefined`。然而，在大多数情况下，更改此值是有益的。以前，设置默认值的常用方法是在函数体内部检查参数值，如果系统显示为 `undefined`\
    \ 则分配一个新值。使用默认参数，你可以直接将数字或字符串作为函数的默认值。\n\n#### 剩余参数\n\n这种参数允许你将任意数量的参数表示为一个数组。在下面的代码中，你将使用剩余参数来获取第二、第三和第四参数。然后你可以使用第一个参数将它们相乘。\n\
    \n![](img/00036.jpeg)\n\n## 第 6 章：事件\n\n### 事件 – 基础\n\n每当用户或浏览器控制时，就会发生事件。JavaScript\
    \ 允许你对这些事件做出响应。例如，当用户点击按钮、移动鼠标或按下键盘时，JavaScript 可以执行相应的操作。这些操作被称为事件处理器（event handlers）。\n\
    \n每当用户或浏览器控制时，就会发生事件。JavaScript 允许你对这些事件做出响应。例如，当用户点击按钮、移动鼠标或按下键盘时，JavaScript\
    \ 可以执行相应的操作。这些操作被称为事件处理器（event handlers）。\n\n每当用户或浏览器控制时，就会发生事件。JavaScript 允许你对这些事件做出响应。例如，`onclick`\
    \ 是最触发的事件。\n\n### 点击事件\n\n当用户点击鼠标左键时，会触发此事件。这里有一个例子：\n\n![](img/00037.jpeg)\n\n\
    如果你运行该代码，你将看到以下输出：\n\n![](img/00038.jpeg)\n\n### 提交事件\n\n当用户提交表单时，会触发此事件。通常，程序员会将表单链接到事件。\n\
    \n### 鼠标移出和鼠标移入事件\n\n这两类事件可以帮助你添加酷炫的效果（如文本、图像）到 HTML 中。基本上，`onmouseout` 在鼠标离开元素时运行。另一方面，`onmouseover`\
    \ 在鼠标悬停在元素上时运行。\n\n### HTML 标准事件\n\n下表显示了标准事件。\n\n| 属性 | 解释 |\n| :--- | :--- |\n\
    | `onblur` | 当窗口失去焦点时发生。 |\n| `offline` | 当文件离线时发生。 |\n| `oncanplay` | 当媒体可以播放时发生。媒体可能因为缓冲而停止。\
    \ |\n| `onabort` | 在中止期间发生。 |\n| `onbeforeprint` | 在系统打印 HTML 文档之前。 |\n| `onafterprint`\
    \ | 系统打印 HTML 文档后发生。 |\n| `onclick` | 用户点击鼠标左键时发生。 |\n| `ondblclick` | 当用户双击鼠标左键时发生。\
    \ |\n| `ondrag` | 当用户拖拽 HTML 元素时发生。 |\n| `onchange` | 当 HTML 元素发生变化时发生。 |\n| `ondragend`\
    \ | 当用户停止拖拽 HTML 元素时发生。 |\n| `onmouseup` | 当用户释放鼠标按钮时发生。 |\n| `onmousewheel` |\
    \ 当用户滚动鼠标轮时发生。 |\n| `onpagehide` | 当用户隐藏页面时发生。 |\n| `onredo` | 当用户对 HTML 文档执行重做时发生。\
    \ |\n| `onstorage` | 每当 HTML 文件加载时发生。 |\n| `onmessage` | 当用户触发分配的消息时发生。 |\n| `onmousedown`\
    \ | 当用户按下鼠标按钮时发生。 |\n| `ononline` | 当文件变为在线时发生。 |\n\n## 第 7 章：JavaScript 与 Cookie\n\
    \n### 什么是 Cookie？\n\nWeb 服务器和浏览器利用 HTTP 进行通信。然而，HTTP 协议是无状态的（即它将请求视为独立的事务）。这意味着系统不会记住之前的任何事务。这对于商业网站来说是一个巨大的问题，因为它们需要在不同的网页之间共享用户信息。\n\
    \n在大多数情况下，Cookie 帮助网站跟踪和记住事务；因此，Cookie 可以帮助你提高网站的用户友好性和整体流量。\n\n"
