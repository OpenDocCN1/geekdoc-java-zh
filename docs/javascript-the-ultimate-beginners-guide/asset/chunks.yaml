    Chapter 5: JavaScript Functions


    In general, functions serve as “subprograms” that you can invoke using internal/external
    codes. Similar to a complete program, a function has a group of statements known
    as its “body.” JavaScript allows you to pass values to a function. Additionally,
    a function can return a value.


    JavaScript considers functions as first-class objects, since they possess methods
    and properties found in other programming objects. The main difference between
    functions and other JavaScript objects is that you can invoke a function whenever
    you need to.


    What is a Function?


    In JavaScript, each function is treated as a unique object. Also, functions are
    different from procedures. Functions return a value 100% of the time, while some
    procedures don’t.


    You must add a “return” statement in your functions if you want them to return
    a value. The “return” statement specifies the value/s that must be returned. Functions
    that don’t have a return statement give a default value. In most cases, the default
    value of a function is “undefined.”


    The arguments of a function are the parameters used in calling it. JavaScript
    uses values to pass arguments to a function. If a function modifies an argument’s
    value, the modification won’t appear globally or inside the function itself. However,
    an object reference is a value too (and a special one at that) – if a function
    alters the properties of a referred object, the alteration/s will appear globally.


