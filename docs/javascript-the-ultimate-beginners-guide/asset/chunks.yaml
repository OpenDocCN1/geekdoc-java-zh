    data regarding the thrown exception/s. JavaScript generates this identifier whenever
    the catch section executes. The identifier lasts only while the catch section
    is active. That means the identifier will cease to exist once the catch section
    has finished its execution.


    For instance, the code below generates an exception. Once the exception is thrown,
    program control will go to the catch section.


    ![](images/00021.jpeg)


    Important Note: This section is completely optional.


    3.  The “finally” section – It holds statements that will run after executing
    the previous sections. The statements placed inside the “finally” section will
    run whether or not the program encountered an exception. Additionally, statements
    within this section will still run even if the statement has no “catch” section.


    In general, programmers use this section to set graceful exits for their projects
    whenever an exception happens. For instance, they may need to liberate some resources
    that are affected by the problematic script. The image below will help you understand
    how this section works.


    ![](images/00022.jpeg)


    With the code given above, JavaScript opens a file and runs statements that utilize
    the file. If JavaScript encounters an error, the “finally” section will close
    the file before the whole code terminates.


    How to Utilize an Error Object


    In some cases, you may get more information about an error by checking its properties
    (i.e. its ‘name’ and ‘message’). This functionality is extremely useful if your
    code’s catch section doesn’t indicate whether errors are generated by the user
    or the system itself. To utilize error objects, you have to use a JavaScript tool
    called “Error Constructor.” Here’s an example:


    ![](images/00023.jpeg)


    JavaScript Promises


    The JavaScript language now supports “promises” (i.e. an object that allows programmers
    to manage the flow of delayed and asynchronous processes).


    Promises undergo the following states:


    *   Pending – This is the initial status of a promise. In this state, a promise
    may get rejected or fulfilled.


    *   Fulfilled – A promise becomes “fulfilled” if the system successfully completes
    all of the assigned processes.


    *   Settled – A settled promise can be either rejected or fulfilled.


    *   Rejected – In a rejected promise, the system failed to complete the assigned
    processes.


    Chapter 4: The Different Types of Loops in JavaScript


    A loop allows you to repeat code snippets quickly and easily. This chapter will
    concentrate on the different kinds of loops offered by JavaScript.


    General Information


    While writing your own codes, you’ll find situations where you have to use the
    same codes over and over again. This kind of task is boring and time-consuming.
    However, you can’t skip it since your application won’t work properly without
    the proper codes.


    Fortunately, JavaScript supports loop statements. A loop statement allows you
    to repeat code blocks automatically. That means you won’t have to spend much time
    and effort in completing your JavaScript codes.'
