    If you’ll evaluate variable that holds “null,” you’ll get “0” when used in the
    Numeric context and “false” when used in the Boolean context. Check the following
    example:


    ![](images/00011.jpeg)


    # The Scope of a Variable


    If you’ll declare variables outside of a function, you’ll get global variables.
    That means you can utilize such variables at any part of your JavaScript program.
    If in case you will declare variables inside a function, you’ll get local variables.
    You can only use these variables through the function that holds them.


    ## Hoisting


    JavaScript allows programmers to refer to variables that haven’t been declared.
    This technique is called variable hoisting: the system hoists (i.e. lifts to the
    top) variables to the top section of the statement or function. However, hoisted
    variables give “undefined” as their value. That means you’ll still get “undefined”
    from a hoisted variable even after declaring and initializing it. Check the code
    below:


    ![](images/00012.jpeg)


    Variable hoisting can turn your code into a confusing mess. To improve the readability
    and functionality of your codes, you must place your `var` statements at the top
    of your functions.


    ## Global Variables


    Actually, a global variable is a property of the programming environment’s global
    object. In webpages, “window” serves as the global object. That means you may
    create and access a global variable through this syntax: `window.variable`.


    JavaScript allows you to access variables declared within one window even if you
    are in a different window. You just have to specify the name of the window that
    holds the variables you like to access.


    ## JavaScript Constants


    As discussed above, you may use `const` to generate a read-only constant in your
    JavaScript programs. The rules involved in naming variables also apply to constants.
    You may use letters, numbers, underscores and dollar signs. However, you cannot
    use a number as the first character of the constant’s name.


    Here’s an example:


    ```

    const example = “69”;

    ```


    You cannot reassign or re-declare a constant to change its value. That means you
    have to be 100% sure of the data that you will assign on a constant at the time
    of declaration.


    Additionally, you cannot create a constant with the same identifier as a variable
    or function within the same scope.


    # Data Types and Structures


    In this section of the book, you’ll learn about the different data types and data
    structures supported by JavaScript. Study this material carefully since it will
    provide you with important information regarding this programming language.


    ## The Different Data Types in JavaScript


    Currently, JavaScript supports seven types of data. These are:


    *   `null` – This is a keyword that denotes a null value. Since this computer
    language is case-sensitive, `null` is different from `NULL`, `Null`, and other
    versions of the word.

    *   `Number` – 69 or 999.99.

    *   `Boolean` – This data type has two possible values: true and false.

    *   `String` – This type of data involves letters. For example: Hello.

    *   `undefined` – This data type is considered as a top-level attribute of any
    program.

    *   `Symbol` – This type involves distinct and unchangeable instances.

    *   `Object` – Programmers use this data type to hold information and instructions
    related to the handling and usage of data.


    Although small in number, these data types allow you to run cool and useful functions
    in your JavaScript programs. Functions and objects are two of the most basic elements
    of this language. You may consider objects as containers that can store information
    and functions as processes that your program can execute.


    ## Converting One Data Type to Another


    The JavaScript language is dynamically-typed; thus, you may declare variables
    without specifying the data type that they can hold. Additionally, JavaScript
    converts data types automatically as required during code execution. That means
    you can declare a variable this way:


    ```

    var apple = 5;

    ```


    Later, you may go back to the same variable and give it a new value. For instance:


    ```

    apple = “This is delicious.”;

    ```


    With the codes given above, you created a variable named `apple` and gave it “5”
    (i.e. a number data type) as the initial value, then you replaced the number with
    a string (i.e. “This is delicious.”). Since JavaScript is dynamically-typed, the
    reassignment of values won’t give you an error message.


    For expressions that involve string and numeric values with `+` (i.e. one of the
    JavaScript operators), the language converts numbers to strings. The code below
    will help you understand this concept:


    ```

    A = “My age is ” + 18 // “My age is 18”

    B = 18 + “ is my age” // “18 is my age”

    ```


    JavaScript won’t convert numbers to strings in expressions that involve other
    operators (e.g. -, `*`, /, etc.). For instance:


    ```

    “69” – 9 // 60

    “69” + 9 // “699”

    ```


    ### The String-to-Number Conversion


    If you used a string value to represent a number, you may convert the data type
    using the following functions:


    *   `parseFloat()`

    *   `parseInt()`


    The `parseInt()` function returns whole numbers. That means you can use it to
    simplify decimal numbers. Also, it is a good programming practice to include “radix”
    (i.e. a parameter of the `parseInt()` function) whenever you use `parseInt()`.
    Basically, radix allows you to specify the numerical system that you must use.


    ## The Literals in JavaScript


    In the JavaScript language, you use a literal to represent a value. The value
    that we’re talking about here is fixed. Aside from variables, you can also add
    fixed values in your JavaScript codes. In this section, you’ll learn about the
    following kinds of literals:


    *   Integers

    *   Array Literals

    *   Object Literals

    *   Boolean Literals

    *   String Literals

    *   Floating-Point Literals


    ### Integers


    In JavaScript, you can express integers as binary, decimal, octal or hexadecimal.


    *   Integer literals in decimal form involve a sequence of numbers that don’t
    accept zero as the first character.

    *   Octal integers use zero as their first character. As a rule, this type of
    integer literal can only use the following digits: 0-7.

    *   Hexadecimal integers begin with `0X` or `0x`. They can have numbers (i.e.
    from 0 to 9) and letters (i.e a-f).

    *   Binary integers always start with `0b` or `0B`. They can only use two digits:
    1 and 0.


    Here are some examples of integer literals:


    *   Decimal – 1, 223 and -360

    *   Octal – 022, 004 and -045

    *   Hexadecimal – 0x2231, 0x99111 and -0xF24

    *   Binary – 0b23, 0b1100 and -0b10


    ### Array Literal


    Basically, this type of literal is composed of 0 or more expressions. Each of
    these expressions represents an array object, placed inside a pair of square brackets
    (i.e. [ ]). If you’ll generate an array through an array literal, the system will
    initialize it with your specified values as the objects. The length of the array
    is equal to the quantity of arguments you specified.


    The code below creates an array called `Countries` with four elements and a length
    of four:


    ```

    var Countries = [Bulgaria”, “Colombia”, “Philippines”, “United States of America”];

    ```


    If you’ll create an array through literal inside a top-level statement, JavaScript
    will interpret the array every time it checks the expression that holds the array
    literal. Additionally, if you will use a literal for a function, the system will
    create that literal whenever you invoke that function.


    ### Extra Commas inside Arrays


    In JavaScript, you don’t have to indicate all of the elements in an array. If
    you’ll place two commas consecutively, the system will create the array and assign
    “undefined” for the objects you didn’t specify. The code below creates an array
    called `Cars:`


    ```

    var Cars = [“BMW” , , “Toyota”];

    ```


    “Cars” has three elements: BMW, undefined, and Toyota.


    JavaScript ignores commas that are placed at the end of the array. That means
    you cannot add an undefined object at the last section of your arrays.

