    # Introduction


    I want to thank you and congratulate you for getting my book…


    “JavaScript: The Ultimate Beginner’s Guide!”


    This book will help you become an effective JavaScript user. If you want to learn
    the basics of the JavaScript language quickly and easily, then you must get this
    book now.


    This book will explain important facts regarding the JavaScript language. It doesn’t
    contain any irrelevant information. Each page holds valuable lessons, instructions
    and examples. After reading this book, you’ll be familiar with objects, functions,
    variables, statements and other JavaScript elements.


    Thanks again for purchasing this book, I hope you enjoy it!


    # Chapter 1: General Information


    `JavaScript` is an object-oriented scripting language that you can use in different
    platforms. Within host environments (e.g. web browsers), you may use `JavaScript`
    to gain programmatic control over an object.


    This scripting language comes with a rich standard library. This library holds
    objects (e.g. `Math`, `Date`, `Array`, etc.) and core language elements (e.g.
    statements, operators, control structures, etc.). As of now, programmers extend
    `JavaScript`’s basic features by adding extra objects. They do this to improve
    the language’s effectiveness in completing certain tasks.


    Here are two of the most popular variants of `JavaScript`:


    - **Server-side JavaScript** – This variant is designed to help programmers run
    `JavaScript` on a web server. For instance, server-side extensions help applications
    to interact with databases, conduct file changes and provide a continuous flow
    of information.

    - **Client-side JavaScript** – This form of `JavaScript` is created for browsers
    and their respective `DOM` (i.e. Document Object Model). For instance, client-side
    `JavaScript` helps applications to save elements into an `HTML` document and react
    to user actions (e.g. form input, mouse clicks, page navigation, etc.).


    ## JavaScript and the Java Language


    `Java` and `JavaScript` are two different programming languages. `JavaScript`
    has some similarities with `Java` (e.g. naming conventions, expression syntax,
    control-flow constructs, etc.). However, it doesn’t have two of `Java`’s distinctive
    characteristics: powerful type checking and static typing.


    According to many people, these languages are completely unrelated. Netscape (the
    company who developed `JavaScript`) changed the name of the language from `LiveScript`
    to `JavaScript` to exploit the popularity enjoyed by `Java`; thus, the similarity
    between the names of these languages emerged because of marketing considerations.


    At this point, let’s discuss the main differences between these programming languages.
    This piece of information will help you in improving your knowledge about `JavaScript`
    and general programming.


    - **JavaScript**: This is a free-form computer language. When using `JavaScript`,
    you don’t have to declare all of the methods, classes and variables. You don’t
    have to worry about the types of methods that you’ll use (i.e. whether they are
    private, public or protected). Additionally, you won’t have to implement any interface
    for `JavaScript`.

    - **Java**: This class-based computer language is created for type safety and
    quick implementation. This means that you have to use classes and their respective
    methods to create your programs. `Java`’s data typing and class inheritance require
    strict object hierarchies. Simply put, the `Java` language is more complicated
    than `JavaScript`.


    ## How to Get Started?


    You don’t have to download files or install programs into your computer just to
    use `JavaScript`. You can simply access your favorite web browser to create your
    own `JavaScript` applications. These days, `Firefox` is one of the best web browsers
    when it comes to `JavaScript` programming. Because of that, this book will focus
    on the tools available in `Firefox` browsers. If your computer doesn’t have `Firefox`,
    you are advised to visit this site: `https://www.mozilla.org`.This browser is
    free and easy to use; thus, you can easily master the basics of `JavaScript` without
    spending any money.


    Once you have downloaded `Firefox`, you’ll see two tools created specifically
    for JavaScript programming. These tools are:


    ### 1. Web Console


    This tool displays information about the webpage loaded. It also has a command
    line feature that you may use to run `JavaScript` statements on the loaded page.


    To access `Web Console`, you just have to launch `Firefox`, click on `Tools`,
    and choose `Web Console` from the menu titled `Developer`. After activating `Web
    Console`, you’ll see a command line at the bottom of your screen. You may enter
    `JavaScript` expressions into that command line, then the pane at the middle of
    the screen will show you the results of the expressions you entered.


    This feature shows results immediately – you’ll quickly know if you have entered
    codes incorrectly.


    Here’s a screenshot of the Web Console tool:


    ![](images/00001.jpeg)


    ### 2. Scratchpad


    `Firefox`’s `Web Console` is excellent for running single `JavaScript` expressions.
    Although you can use it to run multiple lines, you’ll find this task extremely
    inconvenient. Additionally, you can’t use that tool to save your code snippets.
    Fortunately, `Firefox` has another tool that solves the problems discussed above.
    This tool is called `Scratchpad`.


    To access this tool, you have to do:


    1.  Launch `Firefox`.

    2.  Click on `Tools`.

    3.  Look for the `Developer` section and choose `Scratchpad`.

