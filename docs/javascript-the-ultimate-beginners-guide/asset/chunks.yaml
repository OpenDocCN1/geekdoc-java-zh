    与确认框类似，提示框包含一个 OK 按钮和一个退出/取消按钮。如果网站访问者点击 OK，`prompt()` 方法将提交在文本框中输入的数据。另一方面，如果访问者点击退出/取消，`prompt()`
    方法将向 Web 服务器提交 `null`。


    # 第 10 章：如何使用 void 关键字


    `void` 关键字在 JavaScript 语言中起着重要作用。你可以将 `void` 作为一元运算符（即作用于单个操作数的运算符）用于任何类型的操作数。基本上，`void`
    的作用是识别要检查的表达式，但不返回任何值。


    ## 语法


    该关键字的语法有两种形式：


    1. ![](img/00045.jpeg)

    2. ![](img/00046.jpeg)


    为了帮助你理解这个关键字，让我们来分析两个实际示例：


    * 程序员经常在 JavaScript 的客户端表单中使用此关键字。例如，他们可以在 URL 上使用 `void` 来获取表达式的副作用，而不会在网页浏览器中显示结果。

    * 分析下面的代码。它包含的链接不会产生任何作用，因为表达式“0”在 JavaScript 语言中是没有意义的。JavaScript 会评估“0”，但不会将表达式加载到
    HTML 文档中。


    ![](img/00047.jpeg)


    # 第 11 章：调试


    程序员也是人——他们偶尔会犯错。脚本或程序中的错误被称为“bug”（故障）。


    查找并解决错误的行为被称为“调试”（debugging）。程序员认为调试是开发过程中的一个重要环节。本章将讨论你可以执行调试任务的工具和方法。


    ## Internet Explorer 中的错误信息


    查找错误的简单方法是激活 Web 浏览器的“错误信息”选项。例如，当网页发生错误时，Internet Explorer 都会在其状态栏中显示一个图标。这是一个截图：


    ![](img/00048.jpeg)


    如果你双击该图标，Internet Explorer 将显示一个包含其所遇错误详细信息的对话框。


    由于你可能会忽略此图标，Internet Explorer 允许你设置系统，以便每次发生错误时都显示错误对话框。要开启该选项，只需点击“工具”并点击“Internet
    选项”。点击名为“高级”的选项卡，勾选“显示有关每个脚本错误的通知”框框。


    这是一个截图：


    ![](img/00049.jpeg)


    ## Netscape 和 Firefox 中的错误信息


    Netscape 和 Firefox 将错误详细发送到名为“错误控制台”或“JavaScript 控制台”的窗口。你可以通过点击“工具”并选择“错误控制台”查看此窗口。


    然而，由于这两个浏览器没有错误图标，你在执行 JavaScript 代码时必须保持错误控制台打开。


    ## 错误通知


    你在浏览器（如 Internet Explorer、Netscape、Firefox 等）上看到的错误通知是由运行时语法错误引起的。这些通知包含了有关错误的详细信息（例如行号）。这意味着你可以利用这些错误通知快速找到并解决错误。


    如果你正在使用 Mozilla Firefox，可以点击控制台中列出的错误来检查导致问题的确切行。


    ## 调试你的脚本


    JavaScript 为调试脚本提供了一种强大的方法：


    * 使用验证器——在 JavaScript 中，你可以使用验证器来确保你的代码符合该语言的语法规则。验证器（也称为通过检查器）通常随高级 JavaScript
    和 HTML 编辑器一起。

    * 由 Douglas Crockford 开发的 JavaScript Lint 是目前领先的验证器之一。你可以在这里免费使用：[`www.jslint.com/`](http://www.jslint.com/)


    只需访问该网页，将 JavaScript 代码粘贴到编辑区域，然后点击“JSLint” 按钮。此计算机程序将分析你的代码，确保其每个部分都符合正确的语法。


    # 结


    感谢阅读本书！


    希望这本书能够教会你 JavaScript 的基础知识。


    下一步是使用 JavaScript 编程语言编写你自己的网页和应用程序。


    能帮我个忙吗？


    最后，如果你喜欢这本书，请花时间分享你的想法并在 Amazon 上发表好评。我将不胜感激！


    感谢，并祝你好运！


