    # How Does a Cookie Work?


    The web server sends information to the user’s internet browser as a cookie. If
    the browser accepts the cookie, the information will be converted to plaintext
    inside the user’s hard drive. Once the user visits another webpage on your site,
    his browser will send the same cookie to the web server for data retrieval. Once
    data has been retrieved, your web server will know what has occurred before.


    Basically, a cookie is a plaintext data record that has 5 fields (which are variable-length).
    These fields are:


    - `Domain`: This is your website’s domain name.

    - `Secure`: If this field is tagged as “secure,” only a secure webserver can retrieve
    the cookie. If it is blank, however, any webserver can access the cookie.

    - `Expires`: This field specifies the date at which the cookie will expire. If
    this field is blank, the cookie will expire as the the user closes the web browser.

    - `Path`: This is the path to the webpage or directory that created the cookie.
    If you want to retrieve cookies from any page or directory, you may leave this
    field empty.

    - `Name=Value`: Each cookie is set and retrieved as key-value pairs.


    Cookies were created for CGI (i.e. Common Gateway Interface) programming. The
    information stored in a cookie is transmitted automatically between the webserver
    and the user’s web browser. That means CGI scripts written on the webserver can
    read and edit cookie information stored on the user’s hard drive.


    JavaScript allows you to manage cookies using the `Document` object’s `cookie`
    property. The JavaScript language can create, read, alter, and delete cookies
    that are applied on the active webpage.


    ## How to Create a Cookie?


    The easiest way to generate a cookie is to place a string value to the object
    named `document.cookie`. The syntax that you should use is:


    ```

    ![](images/00039.jpeg)

    ```


    In this syntax, `expires` is completely optional. If you’ll enter a valid time
    or date on this field, the cookie will expire on that particular time or date.
    You won’t be able to access the values stored in an expired cookie.


    **Important Note**: You can’t save whitespaces, commas, or semicolons into a cookie.
    Thus, you have to encode those characters using the `escape()` function before
    saving them onto a cookie. If you’ll encode characters this way, you should also
    use `unescape()` to allow the system to read the value you stored.


    ## How to Read a Cookie


    You can read cookies easily. This is because the cookie is the value stored on
    the object named `document.cookie`. That means you can use that string to access
    the cookie whenever you want. Basically, `document.cookie` contains a set of `name=value`
    pairs that are separated by semicolons. Here, `name` is the cookie’s name and
    `value` is the cookie’s string value.


    ## How to Set a Cookie’s Expiry Date


    In some cases, you have to extend the cookie’s life beyond the current browsing
    session. By doing so, you can complete long processes without having to reenter
    any piece of information. JavaScript allows you to set your preferred expiration
    date and save that information inside the cookie itself. You can accomplish this
    by customizing the cookie’s “expires” attribute.


    The image below shows you how to set a cookie’s expiration date. It extends the
    current expiry date by one month.


    ```

    ![](images/00040.jpeg)

    ```


    ## How to Delete a Cookie


    In most cases, you must delete cookies after using them. This ensures that the
    webserver won’t get any information from the unnecessary cookie. Deleting a cookie
    is easy and simple. You just have to set the expiration date to a time in the
    past.


    # Chapter 8: Page Redirection


    ## Page Redirection – The Basics


    You have probably tried to access a certain webpage but you were redirected to
    a different one. That event occurs because of page redirection. Don’t confuse
    this with Page Refresh (which will be discussed below).


    There are lots of reasons why you’d need to redirect users from a certain page.
    Here are the most common reasons:


    - You are transferring your website to a new domain name. In this case, you need
    to forward all of your website traffic to the new domain. You don’t have to delete
    the old website. You can keep it and use page redirection to get all the web traffic.
    This approach can help you keep your previous customers who may not be aware of
    your new site.

    - You created webpages based on certain criteria (e.g. browser types, the customers’
    name, the country where the customer resides, etc.). Rather than redirecting visitors
    through server-side mechanisms, you may employ client-side redirection to forward
    your visitors to the correct webpage.

    - You want to retain the traffic from your old SEO campaign even though you have
    switched to a new website. Search engines may ban your website from their search
    results pages if you’ll use page redirection to get illegal web traffic.


    ## Page Refresh


    In JavaScript, you may refresh webpages using the `location.reload` method. You
    can call this method automatically or when a user clicks on a certain link. If
    you like to refresh a webpage based on mouse clicks, you should use the code below:


    ```

    ![](images/00041.jpeg)

    ```


    ### Automatic Refresh


    JavaScript allows you to refresh a webpage after a certain amount of time. You
    just have to use `setTimeout()` (i.e. a pre-installed JavaScript function) to
    run a different function after a predetermined time interval.


    ## How Does Page Redirection Work?


    Programmers implement page redirection in different ways. Here are some examples:


    1. You may use JavaScript to implement a client-side page redirection. To forward
    your website visitors to the new webpage, you just have to add a line in your
    HTML document’s head section. Here’s an example:


    ```

    ![](images/00042.jpeg)

    ```


    2. You may display a message to your visitors visitors before them them to the
    webpage. This approach involves a delay: the old webpage has to load the message
    you want to show. The code below will show you how to use this using the JavaScript
    language.


    ```

    ![](images/00043.jpeg)

    ```


    3. You may redirect users based on the browser that they are using. The following
    example will show you how it’s done:


    ```

    ![](images/00044.jpeg)

    ```


    # Chapter 9: Dialog Boxes


    The JavaScript language supports three kinds of dialog boxes. You may use these
    dialog boxes to raise an alert, confirm any input, or ask users to enter certain
    pieces of information. This chapter will discuss each type of dialog box in detail.


    ## The Alert Box


    Use this box to display a warning message for your website visitors. For instance,
    if the user doesn’t enter any input in a mandatory field, you may use an alert
    dialog box to warn that user. Programmers consider this kind of dialog box as
    an important part of user validation.


    **Important Note**: You may also use an alert box to display friendly messages.
    Also, an alert box has a single button (i.e. the “OK” button). The user needs
    to click on the button before he/she can proceed.


    ## The Confirmation Box


    In general, you’ll use this dialog box to ask for the user’s consent. This dialog
    box has two buttons: OK and Quit (or Cancel). Website developers use this dialog
    box to confirm the visitor’s intention to proceed with an action.


    ## The Prompt Box


    This dialog box is extremely useful if you need to display a text box that can
    accept user input. That means you can use a prompt box to interact with your website
    visitors. Your visitors have to enter the required information and hit the OK
    button.


    To display a prompt dialog box on a webpage, you must use the `prompt()` method.
    This method accepts two parameters: (1) the label that you want to show in the
    dialog box and (2) the text string that you want to show in the dialog box.

