    | \t | This special character adds a tab character (i.e. the character you’ll
    get after pressing the Tab key on your keyboard) into your codes. |


    | \v | With this character, you can quickly add a vertical tab into your statements.
    |


    | \’ | Use this character to add an apostrophe or single quotation mark into your
    statements. |


    | \” | Use this character if you want to add a double quote into your code. |


    | \\ | This character allows you to include a backslash character into your JavaScript
    statement. |


    | \xxx | You can use this character to add a Latin-1 symbol to your codes. This
    special character requires octal digits within this range: 0- 377\. For instance,
    \251 will add “©” (i.e. the copyright symbol) into your statement. |


    | \xXX | This is similar to the previous one. You can use this character to add
    Latin-1 symbols into your codes. The only difference is that this particular character
    requires two hexadecimal values within this range 00-FF. For instance, \xA9 adds
    © into your JavaScript code. |


    | \uXXXX | This character adds Unicode symbols to your codes. It requires four
    hexadecimal values. For instance, \u00A9 adds © into your code. |


    How to Escape a Character


    In JavaScript, quotation marks are used to start and terminate strings. However,
    in some situations, you have to include a quotation mark into your codes - that
    is, you want an ordinary quotation mark (not the JavaScript symbol). In this case,
    you must introduce the quotation mark using a backslash (i.e. \). This technique
    is called “escaping the character.” Typing a backslash before a special symbol
    turns that symbol into an ordinary one.


    Important Note: Sometimes, you have to add an ordinary backslash into your statements.
    Well, you can do that quickly and easily. You just have to type two backslashes
    (i.e. \\). This action “escapes” the backslash character itself.


    Floating-Point Literals


    Floating-point literals have the following parts:


    *   A decimal integer


    *   An exponent


    *   A fraction


    *   A decimal point


    You must use “E” or “e” to represent the exponent section of your floating-point
    literals. After indicating the exponent, you should place the integer (which can
    be preceded by “-” or “+”). In general, floating-point literals should have at
    least one number and either an exponent or decimal point.


    Here is the syntax of a floating-point literal:


    ![](images/00013.jpeg)


    Here are some examples of floating-point literals:


    *   .2e-34


    *   3.15


    *   -.145


    *   -4.6E+69


    JavaScript Keywords


    This section of the book will show you all of the keywords in JavaScript. All
    of these words serve a special purpose in the JavaScript programming language;
    thus, you can’t use any of them in naming your variables, functions, objects,
    etc.


    | switch | abstract | Instanceof | else |


    | int | enum | synchronized | boolean |


    | this | break | interface | export |


    | long | byte | throw | extends |


    | throws | case | native | false |


    | new | transient | final | catch |


    | true | class | package | char |


    | final | null | finally | try |


    | private | const | typeof | for |


    | function | continue | var | protected |


    | void | debugger | public | goto |


    | return | default | volatile | if |


    | implements | while | delete | short |


    | do | with | static | import |


    | super | double | in |  |


    Chapter 3: JavaScript’s Control Flow Statements


    This language offers a compact group of control flow statements that you can add
    to your codes. In general, a control flow statement boosts the functionality and
    interactivity of a JavaScript program. This section of the book focuses on control
    flow statements.


    The Block Statement


    Programmers consider this as the most basic statement in JavaScript. Use this
    to group your JavaScript statements. When writing your programs, enclose the block
    statement using a pair of brackets.


    The image below shows the syntax of a block statement:


    ![](images/00014.jpeg)


    In general, programmers use block statements for control flow statements (i.e.
    for, if, while, etc.). Here’s an example:


    while (y > 69) {


                  123;


    }


    In the code snippet given above, “123;” serves as the block statement.


    The Conditional Statements


    Conditional statements are sets of commands that run if the assigned condition
    is true. The JavaScript language offers two kinds of conditional statements: (1)
    if… else and (2) switch.


    Let’s discuss these conditional statements in detail:


    The “if… else” Statement


    With this statement, you can run a command as long as the assigned condition is
    true. It involves an “else” clause (which is optional). The “else” clause holds
    a statement that will run if the assigned condition is false. The syntax of a
    basic “if… else” statement is:


    ![](images/00015.jpeg)


    Since your condition must get either “true” or “false,” you must use Boolean expressions
    when writing a conditional statement. If the condition is true, the first statement
    will run; otherwise, the second one will run.


    JavaScript allows you to set multiple conditions in your conditional statements.
    You just have to combine several “if” and “else” clauses in a conditional statement.
    Here’s the syntax that you must use:


    ![](images/00016.jpeg)


    To run multiple statements, you must place them inside a block statement (i.e.
    { … }). Programming experts claim that it’s best to utilize block statements,
    particularly when combining if statements. Check the following example:


    ![](images/00017.jpeg)'
