  trans: "\n\n循环的设计用于重复代码。它们具有不同的机制，可以通过调整这些机制来提高复制代码的效率。此外，每种循环类型都有独特的特性，这使得它们在某些情况下非常有用且方便。以下是你在\
    \ JavaScript 中可以找到循环语句：\n\n* `for`\n* `while`\n* `do… while`\n* `label`\n* `break`\n\
    * `for… of`\n* `for… in`\n* `continue`\n\n## `for` 循环\n\n基本上，`for` 循环会重复执行语句，直到指定的条件变为假。JavaScript\
    \ `for` 循环的语法与 C 和 Java 相似。以下是语法：\n\n![](img/00024.jpeg)\n\n当 `for` 循环运行时，都会发生以下情况：\n\
    \n1. 循环的初始化表达式（在上述语法中用 `initialExpression` 表示）执行其功能。通常情况下，初始化表达式会触发多个循环计数器。这意味着上述语法接受不同复杂程度的内容。你也可以使用此表达式来声明变量。\n\
    \   **注意**：初始化表达式是可选的；因此，你可以在不使用任何初始化表达式的情况下创建 `for` 循环。\n\n2. 系统评估条件表达式。如果评估结果为真，则运行循环包含的语句。然而，如果评估结果为假，整个循环将停止。\n\
    \   **注意**：条件表达式是可选的。如果你不在 `for` 循环中添加条件表达式，系统将假设评估结果为真。\n\n3. 执行语句。如果你想运行多条语句，必须将它们分组成一个块（即通过用大括号将它们括起来）。\n\
    \n4. 最终表达式（在语法中用 `incrementExpression` 表示）更新整个循环，然后控制流将回到第二个步骤（见上文）。\n\n## `while`\
    \ 循环\n\n`while` 循环在指定的条件为“真”时执行其语句。以下是 `while` 循环的语法：\n\n![](img/00025.jpeg)\n\
    \n一旦条件结果为“假”，循环将停止执行分配给它的赋值，然后控制流将跳转到 `while` 循环之后的语句。\n\n系统在运行循环本身之前会先评估条件。如果条件为真，循环内部的语句将执行，系统将再次检查条件。如果条件为假，循环将停止，控制流将移动到下一条语句。\n\
    \n**注意**：由于条件测试首先发生，`while` 循环可能永远不会运行。这意味着在 JavaScript 程序中创建 `while` 循环时必须格外小心。\n\
    \nJavaScript 允许你使用一对大括号封装多个语句。如果你想在 `while` 循环中包含各种语句，请使用此选项。\n\n## `do… while`\
    \ 循环\n\n这种循环执行其语句，直到指定的条件变为假。创建 `do… while` 循环时，你必须使用以下语法：\n\n![](img/00026.jpeg)\n\
    \n在这里，系统在检查指定条件之前执行一次语句。如果条件为真，系统将再次执行这些语句。这个过程将持续到条件变为假。一旦条件评估为假，控制流将跳转到 `do…\
    \ while` 循环之后的语句。\n\n在这种类型的循环中，即使条件为假，语句也能保证至少运行一次。\n\n## `label` 语句\n\n这种语句允许你对语句进行“标记”（即分配一个标识符）。通过标记你的\
    \ JavaScript 语句，你可以轻松地在应用程序的任何部分重复它们。例如，你可以标记某个循环，并利用其他语句来继续或中断它的执行。\n\n以下是 `label`\
    \ 语句的语法：\n\n![](img/00027.jpeg)\n\n创建标记时，你可以使用任何不是 JavaScript 关键字的标识符。你可以对任何语句使用上述语法。\n\
    \n## `break` 语句\n\n程序员使用此语句来结束循环或 switch 语句。在使用 `break` 语句时，必须记住以下规则：\n\n* 如果你的\
    \ `break` 语句没有标记，它将终止最内层的循环/switch 并将控制流传递到下一个语句。\n* 如果你的 `break` 语句有标记，它将终止被标记的语句。\n\
    \n`break` 语句的语法为：\n\n![](img/00028.jpeg)\n\n如果你不需要指定标记，请使用语法的第一个变体。这将终止内部循环/switch。如果你想终止特定的循环/switch，请使用第二变体。只需输入该特定循环或\
    \ switch 的标记即可。使用第二变体时，只有指定的循环/switch 将终止。\n\n## `for… of` 语句\n\n该语句是 JavaScript\
    \ 语言最近添加的内容。它创建了一个可以重复“可迭代对象”（例如 maps、sets、arrays、arguments 等）的循环。它还调用了一个迭代钩子，该钩会在对象的每个不同属性上运行。JavaScript\
    \ 允许你自定义任何 `for… of` 语句的迭代钩子。你必须使用的语法如下：\n\n![](img/00029.jpeg)\n\n## `for… in`\
    \ 语句\n\n`for… in` 语句在对象的任何属性上重复指定的语句。JavaScript 将为每个属性执行指定的语句。`for… in` 语句的语法为：\n\
    \n![](img/00030.jpeg)\n\n## `continue` 语句\n\n你可以使用此语句重启其他语句（例如 for、while、do while\
    \ 和 label）。在使用 continue 语句时需要记住以下规则：\n\n* 如果你的 `continue` 语句没有标记，它将终止当前的循环并继续下一个。与\
    \ break 语句不同，continue 语句不会终止整个循环。如果用于 `while` 循环，控制流将返回条件。另一方面，如果用于 `for` 循环，控制流将回到递增表达式。\n\
    * 如果你在 `continue` 语句中包含标记，它将仅影响被标记的语句。\n\n# 第 5 章：JavaScript 函数\n\n通常情况下，函数是用于调用的“子程序”。每种函数类似于完整的程序，函数有一组被称为“函数体”的语句。JavaScript\
    \ 允许你向函数传递值。此外，函数还可以返回值。\n\n## 什么是函数\n\n在 JavaScript 中，每个函数都被视为一个唯一的对象。此外，函数与过程不同。函数在\
    \ 100% 的情况下都会返回值，而某些过程不会。\n\n如果你想让函数返回结果，必须在函数中添加 `return` 语句。`return` 语句指定了返回的值。没有返回语句的函数会给出默认值。大多数情况下，函数的默认值为“undefined”。\n\
    \n函数的参数是在调用时使用的参数。JavaScript 使用值传递参数。如果函数修改了参数的值，该修改不会在全局范围内生效。然而，对象引用也是值（而且是特殊的值）——如果函数更改了所引用对象的属性，更改将会生效。\n\
    \n## 如何定义函数\n\n在 JavaScript 中，你可以通过多种方式定义函数。让我们详细讨论每种方法：\n\n* 使用函数语句 —— JavaScript\
    \ 提供了一种特殊的语法，你可以用它声明函数。语法如下：\n\n"
- fmt: "\n![](images/00032.jpeg)\n\nThat syntax has three different parts, which are:\n\
    \n* `name` – This is the name of the function. You may replace this with any valid\
    \ identifier.\n    * `param` – This is the argument/parameter that you want to\
    \ pass to the function. JavaScript allows you to include up to 255 parameters\
    \ in each function.\n    * `statements` – This section holds the statements (i.e.\
    \ the body) of a function.\n* Through the function expression – This approach\
    \ is similar to the previous one. In fact, it uses the syntax (see below):\n\n\
    ![](images/00033.jpeg)\n\n* Using JavaScript’s “Function Constructor” – JavaScript\
    \ allows you to generate functions using `new` (i.e. a JavaScript operator). Here\
    \ is the syntax that you must use:\n\n![](images/00034.jpeg)\n\nThe syntax given\
    \ above has the following parts:\n\n* `arg1, arg2, … argN` – This part holds the\
    \ name/s you want to use as the formal parameter/s.\n    * `functionBody` – This\
    \ is a string that holds JavaScript statements (i.e. the body of the function).\n\
    \n## How to Call a Function\n\nWhen defining a function, you are just naming that\
    \ function and assigning what to be done once the function is invoked/called.\
    \ Call a function if you want it to perform the assigned actions. For instance,\
    \ if you have defined the “square” function, you may call it using the following\
    \ code:\n\n```\nsquare(2);\n```\n\nThe code given above calls the `square` function\
    \ and assigns 2 as the argument. The function runs its statements and gives 4\
    \ as the resulting value.\n\nYour functions must be within the proper scope when\
    \ you call them. However, you can hoist (i.e. lift to the top) your function declarations.\
    \ Here’s an example:\n\n![](images/00035.jpeg)\n\nA function’s arguments may hold\
    \ different programming elements (i.e. not just numbers and strings). JavaScript\
    \ allows you to assign entire objects to your functions. For example, `show_props()`\
    \ (i.e. a built-in function) accepts objects as arguments.\n\n### The Scope of\
    \ a Function\n\nIf you defined a variable within a function, you won’t be able\
    \ to access that variable from outside. That’s because you defined it within the\
    \ function’s scope. Simply, global functions can access global variables. A nested\
    \ function (i.e. a function placed inside another) can access variables created\
    \ inside its mother function.\n\n### Arguments of a Function\n\nJavaScript treats\
    \ arguments as array objects. Inside a function, you may access them using the\
    \ following syntax:\n\n```\narguments[n]\n```\n\nIn this syntax, `n` represents\
    \ the argument’s ordinal number, beginning at zero. That means the initial argument\
    \ of a function is `arguments[0]`. If you use the `arguments` object, you may\
    \ invoke functions that hold more arguments than was declared in the code. To\
    \ determine the quantity of objects inside a function, you may use `arguments.length`.\
    \ Then, you may use the `arguments` object to access the arguments.\n\n### Parameters\
    \ of a Function\n\nCurrently, JavaScript supports two types of parameters: default\
    \ and rest.\n\n#### Default Parameters\n\nIn the JavaScript language, the default\
    \ parameter of any function is `undefined`. In most situations, however, it is\
    \ beneficial to change this value. Before, the usual approach for setting a default\
    \ value was to check parameter values inside the function’s body and assign a\
    \ new value if the system shows `undefined`. With default parameters, you may\
    \ just assign numbers or strings as the default value of your functions.\n\n####\
    \ Rest Parameters\n\nThis kind of parameter allows you to represent any number\
    \ of arguments as a simple array. In the code below, you’ll use rest parameters\
    \ to get the second, third and fourth arguments. You can then multiply them using\
    \ the first.\n\n![](images/00036.jpeg)\n\n## Chapter 6: Events\n\n### Events –\
    \ The Basics\n\nWhenever the user or the browser controls a webpage, JavaScript\
    \ interacts with HTML content. The system handles these interactions as events.\
    \ Basically, the term `event` refers to any manipulation done on a webpage (e.g.\
    \ clicking on a button, pressing a key, closing a pop-up window, etc.). As a JavaScript\
    \ programmer, you may use events to run responses (e.g. displaying a message,\
    \ validating records, etc.). Events belong to DOM (Document Object Model) Level\
    \ 3. Additionally, each HTML element holds a collection of events that can initiate\
    \ JavaScript. This chapter will discuss some of the most popular webpage events.\
    \ This material will help you understand the relationship between events and the\
    \ JavaScript language.\n\n### The “onclick” Event\n\nJavaScript users encounter\
    \ this kind of event frequently. Basically, an `onclick` event happens whenever\
    \ a user clicks the left-side button of his mouse. You may link warnings and other\
    \ content to this event. Here’s an example:\n\n![](images/00037.jpeg)\n\nIf you\
    \ run that code, you will get the following output:\n\n![](images/00038.jpeg)\n\
    \n### The “onsubmit” Event\n\nThis event happens whenever a user submits a form.\
    \ Typically, programmers link their form validations to this kind of event.\n\n\
    ### The “onmouseout” and “onmouseover” Events\n\nThese two kinds of events can\
    \ help you add cool effects (e.g. text, images, etc.) into your HTML documents.\
    \ Basically, `onmouseout` runs once the user moves the mouse out of an element.\
    \ On the other hand, `onmouseover` runs once the user brings the mouse over an\
    \ element.\n\n### The Standard Events in HTML5\n\nThe following table shows the\
    \ standard events supported by HTML 5.\n\n| Attribute | Explanation |\n| :---\
    \ | :--- |\n| `onblur` | This event happens whenever a window loses focus. |\n\
    | `offline` | This event occurs when the HTML file becomes offline. |\n| `oncanplay`\
    \ | It happens when a playable media is present. The playable media might need\
    \ to stop because of buffering. |\n| `onabort` | It occurs during an abort situation.\
    \ |\n| `onbeforeprint` | This event occurs before the system prints the HTML document.\
    \ |\n| `onafterprint` | This event happens once system has printed the HTML document.\
    \ |\n| `onclick` | It happens once the user clicks the left-side button of his\
    \ mouse. |\n| `ondblclick` | This event occurs when the user double-clicks the\
    \ left-side button of his mouse. |\n| `ondrag` | It happens when the user drags\
    \ an HTML element. |\n| `onchange` | It occurs when an HTML element changes. |\n\
    | `ondragend` | It happens once the user stops dragging an HTML element. |\n|\
    \ `onmouseup` | This event occurs whenever the user releases a mouse button. |\n\
    | `onmousewheel` | It happens when the user rotates the wheel of his mouse. |\n\
    | `onpagehide` | This event happens when the user hides. |\n| `onredo` | This\
    \ occurs when the user conducts a redo on the HTML document. |\n| `onstorage`\
    \ | This event occurs whenever an HTML file loads. |\n| `onmessage` | It occurs\
    \ whenever the user triggers the assigned message. |\n| `onmousedown` | This event\
    \ happens whenever the user presses a mouse button. |\n| `ononline` | This event\
    \ occurs when the HTML file becomes online. |\n\n## Chapter 7: JavaScript and\
    \ Cookies\n\n### What is a Cookie?\n\nWeb servers and browsers utilize HTTP to\
    \ communicate. However, the HTTP protocol is stateless (i.e. it treats requests\
    \ as independent transactions). That means that the system won’t remember any\
    \ of the previous transactions. This can be a huge problem for commercial sites,\
    \ since they need to share the user’s information across various webpages.\n\n\
    In most cases, cookies help websites in tracking and remembering transactions;\
    \ thus, cookies can help you improve the user-friendliness and overall traffic\
    \ of your website.\n"
