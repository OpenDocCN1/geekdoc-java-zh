    \n# 对象字面量 (Object Literals)\n\n对象字面量是对象属性名及其赋值值的列表。一对大括号（即 `{}`）包围了这些元素。在 JavaScript\
    \ 中，你不能在代码的开头放置对象字面量。这种操作可能会导致错误和/或对你的 JavaScript 程序产生不利的影响。\n\n对象的属性名可以是任何字符串（即使是空字符串）。如果你使用无效的数字或标识符，必须用引号将其括起来。要访问涉及无效标识符的属性名，请使用方括号（即\
    \ `[ ]`）。 \n\n# 布尔字面量 (Boolean Literals)\n\n这种类型涉及两个值：(1) `true` 和 (2) `false`。\n\
    \n请记住，布尔字面量与布尔数据类型（上文讨论过）不同。通常，布尔对象作为布尔数据类型的包装器。\n\n# 字符串字面量 (String Literals)\n\
    \n字符串字面量由置于一对引号（即单引号或双引号）内部的零或多个字符组成。以下是一些示例：\n\n*   “water”\n*   ‘car’\n*   “3.14”\n\
    *   “我想使用 `\\t` 来添加一个制表符”\n*   “Peter Pan”\n\n你可以对字符串字面量调用字符串对象的任何方法——JavaScript\
    \ 会自动将字符串字面量转换为字符串对象，调用你所需的方法，并丢弃创建的字符串对象。\n\n**重要备注：** 除非你的代码需要字符串对象，否则编写 JavaScript\
    \ 语句时必须使用字符串字面量。\n\n## 如何在字符串中使用特殊字符\n\nJavaScript 允许你在字符串中包含特殊字符。这里是一个例子：\n\n\
    “第一行 \\n 第二行”\n\n下表了 JavaScript 支持的特殊字符：\n\n| 特殊字符 | 用途 |\n| :--- | :--- |\n|\
    \ `\\0` | 该字符向你的代码中添加一个空字节。 |\n| `\\b` | 使用此特殊字符就像按下键盘上的退格键一样。 |\n| `\\f` | 使用此字符，你可以在\
    \ JavaScript 语句中添加一个分页符。 |\n| `\\n` | 如果你想在代码中添加换行符，请使用此字符。输入此特殊字符就像按下键盘上的回车键。\
    \ |\n| `\\r` | 该字符允许你在代码中应用回车。 |\n| `\\t` | 此特殊字符向代码中添加一个制表符（即按下键盘上的 Tab 键后获得的字符）。\
    \ |\n| `\\v` | 使用此字符，你可以快速地在语句中添加一个垂直制表符。 |\n| `\\\\'` | 使用此字符在语句中添加一个单写号或单引号。\
    \ |\n| `\\\\\"` | 如果你想在代码中添加一个双引号，请使用此字符。 |\n| `\\\\` | 该字符允许你在 JavaScript 语句中包含一个反斜杠字符。\
    \ |\n| `\\xxx` | 你可以使用此字符向代码中添加一个 Latin-1 符号。此特殊字符需要该范围内的八进制数字：`0- 377\\.`。例如，`\\\
    251` 将向你的语句中添加“©”（即版权符号）。 |\n| `\\xXX` | 这与上一个类似。你可以使用此字符向代码中添加 Latin-1 符号。唯一的区别是此特定字符需要范围\
    \ `00-FF` 内的两个十六进制值。例如，`\\xA9` 会向你的 JavaScript 代码中添加 ©。 |\n| `\\uXXXX` | 该字符向代码中添加\
    \ Unicode 符号。它需要四个十六进制值。例如，`\\u00A9` 向你的代码中添加 ©。 |\n\n## 如何转义字符\n\n在 JavaScript\
    \ 中，引号用于开始和结束字符串。然而，在某些情况下，你必须在代码中包含引号——也就是说，你想要一个普通的引号（而不是 JavaScript 符号）。在这种情况下，你必须使用反斜杠（即\
    \ `\\`）引入引号。这种技术被称为“字符转义”。在特殊符号之前输入反斜杠会将该符号转变为普通的符号。\n\n**重要备注：** 有时，你必须在语句中添加一个普通的反斜杠。嗯，你可以快速轻松地做到这一点。你只需要输入两个反斜杠（即\
    \ `\\\\`）。此操作会“转义”反斜杠字符本身。\n\n# 浮点字面量 (Floating-Point Literals)\n\n浮点字面量具有以下部分：\n\
    \n*   一个小数整数\n*   一个指数\n*   一个分数\n*   一个小数点\n\n你必须使用 “E” 或 “e” 来表示浮点字面量的指数部分。在标明指数后，你应该放置整数（其前面可以有\
    \ \"-\" 或 “+”）。通常，浮点字面量应该至少有一个数字，并且要么有一个指数要么有一个小数点。\n\n以下是浮点字面量的语法：\n\n![](img/00013.jpeg)\n\
    \n以下是一些浮点字面量的示例：\n\n*   .2e-34\n*   3.15\n*   -.145\n*   -4.6E+69\n\n# JavaScript\
    \ 关键字\n\n本书的这一部分将向你展示 JavaScript 中所有的关键字。这些词在 JavaScript 编程语言中都有特殊用途；因此，你不能在命名变量、函数、对象时使用其中任何一个。\n\
    \n| switch | abstract | Instanceof | else |\n| int | enum | synchronized | boolean\
    \ |\n| this | break | interface | export |\n| long | byte | throw | extends |\n\
    | throws | class | native | catch |\n| true | transient | package | char |\n|\
    \ function | const | typeof | for |\n| private | var | protected | void |\n| return\
    \ | default | volatile | if |\n| implements | while | delete | short |\n| do |\
    \ with | static | import |\n\n第 3 章：JavaScript 控制语句\n\n# 第 3 章：JavaScript 的控制语句\n\
    \n该语言提供了一组你可以添加的紧凑控制语句。通常，控制语句增强了程序的功能和交互性。本书重点关注控制语句。\n\n## 块语句 (Block Statement)\n\
    \n程序员认为这是 JavaScript 中最基本的语句。使用它来分组你的语句。在编写程序时，使用一对大括号包围块语句。\n\n下图显示了块语句的语法：\n\
    \n![](img/00014.jpeg)\n\n通常，程序员将块语句用于控制语句（例如 for、if 等）。这里有一个示例：\n\n```javascript\n\
    while (y > 69) {\n    123;\n}\n```\n\n在上面的代码段中，`123;` 就是块语句。\n\n## 条件语句 (Conditional\
    \ Statements)\n\n条件语句是在赋值条件为真时执行的命令集。JavaScript 语言提供了两种条件语句：(1) `if... else` 和\
    \ (2) `switch`。\n\n让我们详细讨论这些条件语句：\n\n### “if... else”语句\n\n通过此语句，只要赋值条件为真，就可以运行命令。它包含一个\
    \ `else` 子句（可选）。`else` 子句包含在赋值条件为假时运行的语句。`if... else` 语句的语法如下：\n\n![](img/00015.jpeg)\n\
    \n由于你的条件必须得到“true”或“false”，因此编写条件语句时必须使用布尔表达式。如果条件为真，执行第一个语句；否则，执行第二个。\n\nJavaScript\
    \ 允许你在条件语句中设置多个条件。你只需要在条件语句中组合多个 `if` 和 `else` 子句即可。这是你必须使用的语法：\n\n![](img/00016.jpeg)\n\
    \n"
- fmt: "\nIf possible, avoid using simple assignments in your conditional expressions.\
    \ This is because simple assignments are often confused with equality when checking\
    \ JavaScript codes. For instance, you must not add the following code into your\
    \ statements:\n\n```javascript\nif (a = b) {\n    /* sample_statement */\n}\n\
    ```\n\nIf you really need to use a simple assignment in your conditional expressions,\
    \ place it between a pair of parentheses. Here’s an example:\n\n```javascript\n\
    if ((x = y)) {\n    /* sample_statement */\n}\n```\n\n## The Falsy Values\n\n\
    A “falsy value” is a value that evaluates to false. Here are the falsy values\
    \ that you will encounter while using JavaScript:\n\n- `0`\n- `null`\n- `false`\n\
    - `undefined`\n- `NaN`\n- `\"\"` (i.e. an empty string)\n\nAny value not listed\
    \ above evaluates to true when used in conditional statements.\n\n## The “Switch”\
    \ Statement\n\nThis kind of statement allows an application to check an expression\
    \ and compare it with a predetermined set of cases. If there’s a match, the application\
    \ runs the assigned command. Here is the syntax of a basic switch statement:\n\
    \n![](images/00018.jpeg)\n\nFirst, the application will search for a case with\
    \ a label that matches the expression’s value. Then, it will pass the control\
    \ flow to that particular clause, performing the assigned statement/s. If no match\
    \ is found, the application will check the `default` clause (which is optional)\
    \ and pass the control flow to that clause, running the assigned statement/s.\
    \ If the statement has no `default` clause, the application will simply run the\
    \ statement after the switch. Typically, the final clause of a switch statement\
    \ serves as the default clause, but it isn’t mandatory.\n\nYou may also add a\
    \ `break` statement in your switches. A `break` statement makes sure that the\
    \ application will get out of the switch statement once a match is found. When\
    \ the application gets out of the switch, the system will run the statement right\
    \ after the switch statement. If your code doesn’t have a `break`, the application\
    \ will simply run all of the commands within your switch statement.\n\n## How\
    \ to Handle Exceptions\n\nJavaScript allows you to throw and manage exceptions.\
    \ To do these things, you must use the following statements:\n\n- the `throw`\
    \ statement\n- the `try…catch` statement\n\n## The Different Types of Exceptions\n\
    \nIn JavaScript, you can throw any type of object. However, thrown objects may\
    \ possess different characteristics. Although it is usual to throw strings and/or\
    \ numbers as error messages, it is usually more beneficial to utilize the exception\
    \ types designed for this purpose. Here are two of the most popular exceptions\
    \ in JavaScript:\n\n- `DOMError` – This exception represents a named error object.\n\
    - `DOMException` - This exception indicates an abnormal situation that happens\
    \ while a property or method is being used. To use this exception, you must add\
    \ `DOMError()` into your code.\n\n## The “throw” Statement\n\nObviously, this\
    \ statement allows you to throw exceptions. While throwing an exception, you must\
    \ indicate the expression holding the data to be thrown. Here’s the syntax:\n\n\
    ![](images/00019.jpeg)\n\nThe syntax given above can throw any type of expression.\
    \ The following list shows some examples:\n\n- `throw \"Error1\"; // A String\
    \ type exception`\n- `throw 1; // A Number type exception`\n- `throw false; //\
    \ A Boolean type exception`\n\nImportant Note: You may specify objects while throwing\
    \ an exception. Then, you may specify the properties of the object/s inside the\
    \ `catch` section of your statement.\n\n## The “try… catch” Statement\n\nThis\
    \ statement looks for statement blocks that you can try. It also specifies a response\
    \ that will be used in case an exception is thrown. The `try…catch` statement\
    \ catches thrown exceptions.\n\n`try…catch` statements have three parts, which\
    \ are:\n\n1. **The `try` section** – It holds one or more JavaScript statements.\
    \ This part is mandatory.\n2. **The `catch` section** – This part is completely\
    \ optional (see below). It holds statements that indicate what the program must\
    \ do in case an exception gets thrown. That means if the `try` section doesn’t\
    \ succeed, the program control will go to the `catch` section. If a statement\
    \ inside the `try` section throws an exception, the program control will immediately\
    \ go to the `catch` section. If no exceptions arise, however, the system will\
    \ skip the statement’s `catch` section.\n\nIn JavaScript, you may use the `catch`\
    \ section to manage all exceptions that may be thrown in the `try` section. Here’s\
    \ the syntax that you should use:\n\n![](images/00020.jpeg)\n\nIn the syntax given\
    \ above, `catchID` represents the identifier that contains the value assigned\
    \ in your `throw` statement. You may employ this identifier to acquire data regarding\
    \ the thrown exception/s. JavaScript generates this identifier whenever the `catch`\
    \ section executes. The identifier lasts only while the `catch` section is active.\
    \ That means the identifier will cease to exist once the `catch` section has finished\
    \ its execution.\n\nFor instance, the code below generates an exception. Once\
    \ the exception is thrown, program control will go to the `catch` section.\n\n\
    ![](images/00021.jpeg)\n\n3. **The `finally` section** – It holds statements that\
    \ will run after executing the previous sections. The statements placed inside\
    \ the `finally` section will run whether or not the program encountered an exception.\
    \ Additionally, statements within this section will still run even if the statement\
    \ has no `catch` section.\n\nIn general, programmers use this section to set graceful\
    \ exits for their projects whenever an exception happens. For instance, they may\
    \ need to liberate some resources that are affected by the problematic script.\
    \ The image below will help you understand how this section works.\n\n![](images/00022.jpeg)\n\
    \nWith the code given above, JavaScript opens a file and runs statements that\
    \ utilize the file. If JavaScript encounters an error, the `finally` section will\
    \ close the file before the whole code terminates.\n\n## How to Utilize an Error\
    \ Object\n\nIn some cases, you may get more information about an error by checking\
    \ its properties (i.e. its `name` and `message`). This functionality is extremely\
    \ useful if your code’s catch section doesn’t indicate whether errors are generated\
    \ by the user or the system itself. To utilize error objects, you have to use\
    \ a JavaScript tool called `Error Constructor`. Here’s an example:\n\n![](images/0023.jpeg)\n\
    \n## JavaScript Promises\n\nThe JavaScript language now supports `promises` (i.e.\
    \ an object that allows programmers to manage the flow of delayed and asynchronous\
    \ processes). Promises undergo the following states:\n\n- `Pending` – This is\
    \ the initial status of a promise. In this state, a promise may get rejected or\
    \ fulfilled.\n- `Fulfilled` – A promise becomes “fulfilled” if the system successfully\
    \ completes all of the assigned processes.\n- `Settled` – A settled promise can\
    \ be either rejected or fulfilled.\n- `Rejected` – In a rejected promise, the\
    \ system failed to complete the assigned processes.\n\n## Chapter 4: The Different\
    \ Types of Loops in JavaScript\n\nA loop allows you to repeat code snippets quickly\
    \ and easily. This chapter will concentrate on the different kinds of loops offered\
    \ by JavaScript.\n\n### General Information\n\nWhile writing your own codes, you’ll\
    \ find situations where you have to use the same codes over and over again. This\
    \ kind of task is boring and time-consuming. However, you can’t skip it since\
    \ your application won’t work properly without the proper codes. Fortunately,\
    \ JavaScript supports loop statements. A loop statement allows you to repeat code\
    \ blocks automatically.\n"
