    within the political realm, the Marxist structuralist theory he ascribed tended
    to underestimate. With his hegemony, Gramsci carved out a space in evolutionary
    Marxism for unexpected results, such as the lack of communist revolution in the
    West, West-bound revolutions were not confronted with antagonism from the state
    apparatus, but also from their surrounding civil society, which was far stronger
    in the East. Civil society, or the spaces of social and political life outside
    of the state, are organized.⁵ Hegemony can


