  md: '# COMPLICITIES, SOLIDARITIES AND EVERYTHING IN BETWEEN


    # Art and Political Engagement in the Housing Movement in Bucharest and Cluj


    IOANA FLOREA & VEDA POPOVIC


    The street is the art of small things. The microhistory of the street. The street
    is art. [...] Criticize all authority! Be realistic! Demand the impossible!


    What make art projects become complic systems of power and what makes it possible
    for them to empower housing struggles, broadening their tactics, vision, and positionality?
    As active members in the Common Front for Housing Rights (FCHILD) in Bucharest,
    we ask this question from engaged and participatory positions, exploring a variety
    of intersections, with an analytical emphasis on the nature of ambience.


    Art projects always walk the thin line between real solidarity on one side, and
    complicity, appropriation, museification/culturalization, facilitating gentrification
    and poverty on the other side. In this, there is a permanent negotiation, a tension
    between contradictions and reality. The causes of this ambience also be traced
    back to a variety of factors: independent artists'' precariousity and their need
    for alliances; the use of (tactical) artistic tools by persons affected by housing
    injustice; possibility and need of funding/visibility for social causes (otherwise
    unfunded) through art projects. The causes of this ambience also found in the
    structural factors that affect housing conditions in Romania, art and artists''
    conditions, as well as possibilities and limits for housing struggles. All the
    actors involved, all their interactions ranging from solidarity building to conflict,
    and the results of these interactions, are framed within these structural factors.


    What characterizes these structural factors is a condition of semi-peripherity
    for global capital: the territories occupied by today’s Romania were quite poor,
    predominantly rural, and penetrated by mechanisms exploiting labor and raw materials.
    Before WWII, many households could be found in conditions of severe housing deprivation.
    Against this backdrop, the post-war regimes engaged in massive efforts to solve
    the housing crisis and, at the same time, to break the hegemony of the private
    property paradigm. These social as well ideological issues were tackled with several
    policies in the late 1940s: nationalization of pre-1945 private properties belonging
    to owners with several properties; massive programs for building public blocks-of-flats;
    and the systematization and industrialization of rural areas.


