    # 3. ‘History Does (Not) Repeat Itself’ in Cluj and Bucharest


    One recent contemporary project that draws from and feeds back into the housing
    movement is Veda Popovici and Nicolae Mikhailov *History’s Does (Not) Repeat Itself*.
    Produced in 2017—2018, the project develops entangled political histories in post-social
    Romania that sit on the edge between fact and fiction.³⁰ The project, comprised
    of two exhibitions, a film, and several workshops and screenings, builds on a
    speculative history methodology of collective introspection and production. Through
    various works, the authors engaged with groups of activists, researchers, and
    artists to create fictional political stories of the post-89 period in Romania
    based on real events. The selection and editing process of these stories resulted
    in a series of political dreams and utopias that the participants felt particularly
    invested in. Speculating on what could have happened, the project reveals how
    close real people actually were taking a different historical path for their political
    needs and desires. The subsequent exhibitions and film are composed of concrete
    artifacts that stand as testaments to these histories: protest banners, armbands,
    press releases, mock-up websites, posters, and building models, etc.


    Two out of the ten speculative stories build on the housing movement experience.
    One of them, developed with activists and artists from Cluj, draws upon the infamous
    Coastei eviction that resulted in the Pale Rât and ultimately ended up by the
