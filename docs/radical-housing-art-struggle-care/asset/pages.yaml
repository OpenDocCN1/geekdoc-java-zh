  md: '# THEORY ON DEMAND


    You''re at a cafe in Hackney to meet with a white, male friend of yours who studied
    architecture and was working for a firm based in East/Hackney. He tells you about
    the firm he''s just started working for, how they''re ''developing'' a community
    space, how they produced a proposal for the new space with many people over many
    places of what the space will look like and who will inhabit it. He tells you
    not a single person of color / Black person in the entire publication. How he
    had to be the one to tell them what area they were actually in. Do notify us when
    we are not there?


    I DON''T NEED TO DECORATE MY BODY FOR IT TO BE DESTROYED.


    I DON''T NEED TO DECORATE MY BODY FOR IT TO BE DESTROYED.


    I DON''T NEED TO DECORATE MY BODY FOR IT TO BE DESTROYED.


    A strange spectral presence. Hypervisible and monstrously numbered but also invisible
    as if never there at all. Over-existing and ripe for destruction. Superfluous.


    I think ''blacklisting''. When you speak out, you get cut off. (Slowly) dead.
    How many acquaintances told me how they materialize lost out of attempting to
    check the racism/ism of an institution or space. How much POC expression is tinged
    with violence. The threat to cut you off. How I''m worried this might happen and
    how I''m thinking about what I''m writing and how I''m trying to speak with truth
    but how I''m still properly cushioned for it in need of mycodcoding that is far
    too real. The actual snowflakes. How white tears burn and it''s not worth it.
    How splitting it is to cut yourself off for fear of being cut. How difficult it
    is to engage in creative expression when you twist your tongue for sport. Performance.
    Nothing will change in this endless spectacular merry go round unless deep shifts
    in thinking are being engaged. Part of what needs to catalyze the shift is the
    (im)possibility of unbridged POC expression. Without fear of punishment or retribution
    from sensitive white ears. No more questioning yourself. No worry if this is messa.
    It''s ok.


    Every day, every day.


    You''re saying no. You''re learning to say no. To refuse in the language of refusal.
    You think about how powerful it is to say no, just use the word sorry, you were
    not taught to say this. In the context of 13+ people in 3 bedroom cramped flat,
    boundaries and privacy and the capacity to say NO, to reinforce and create boundaries
