    publicly describe the tactics of communities as ''terrorist'' or ''extreme'',
    then on whose behalf are we working? Such questions gain urgency since 2013 when
    the Department of Homeland Security issued a threat alert labeling anti-gentrification
    activists as ''anarchist extremists'' posing a threat to local and federal law
    enforcement.32


    # Fighting to Take Over


    The complexity of the state within gentrification violence demands that we build
    an effective outside strategy. Such a strategy advances nonoperation, direct action,
    and autonomous organizing. For decades in Los Angeles, nonprofit corporations
    and liberal groups have pursued an inside strategy of negotiating with housing
    officials and policy makers behind closed doors. Community benefit agreements
    are negotiated in private between the executive directors of the community-based
    organization and developers. In order to ensure the goodwill or sympathies of
    public officials and developers, in order to safeguard private meetings and sanctioned
    participation processes, established non-governmental organizations have refrained
    from conflict and shielded officials and real estate interests from the grass
    of roots. As the years passed, this compact between official community representatives,
    public officials, and capital has facilitated the continual negotiation of defeat.
    Nonprofits organizations capture the fear and anger of working-class and poor
    communities and direct that for the passage of community benefit agreements, dense
    housing, and affordable housing. These policies either directly contribute to
    or provide an alibi for the social cleansing of whole communities.


