  md: '# AGAINST DISAPPEARANCE: VILA AUTÓDROMO''S RESISTANCE AGAINST EVICTION IN BRAZIL


    CRISTINA T. RIBAS & LUCAS S. ICÓ


    Since 2009, Rio de Janeiro has been in the spotlight as the next city to be exploited
    by mega corporations that capitalize by spreading their extractive practices across
    the globe. Hosting mega events such as the World Cup and the Olympics brought
    the contamination of autocolonization and foreign capital to the city.¹ In the
    world-famous landscape of Rio de Janeiro became the site of exploitation and corruption.³
    Drive to regenerate and redesign has affected vulnerable communities and districts,
    such as favelas (slums) and self-build settlements. In this process, Vila Autódromo
    became the world-famous site of struggle to stay put.


    Vila’s struggle against disappearance was simultaneous with the fast regeneration
    of the docks area, where the appearance of new buildings and developments became
    the inaugural site of publicity of the Olympics. From the beginning, art and cultural
    production played an important role in the resistance, and it was also set to
    design profit via new developments and regeneration projects. In the dockland
    area in Rio, regeneration projects included: a new museum, a science museum, historical
    buildings converted to studios and offices for architects and designers and more.³
    The partnership between the mayor of Rio de Janeiro (Eduardo Paes, from the center-right
    party), the state of Rio de Janeiro and the president Dilma Rousse with large
    construction projects, launching the private-public partnership (PPP). The entry
    of a new speculative (and corrupted) economy has always depended on the capacity
    of the locals to adapt to a new fake aesthetics: the aesthetics of regeneration.
    Nevertheless, many


