    end up erasing what these projects have achieved. The community members of PRH
    and the Dorchester Projects are fortunate to be, for the moment, within these
    spaces. Yet these communities’ general disenchantisement and lack of guarantees
    – the reasons, why these artworks seem so necessary – remain unquestioned by the
    art, which begins to seem like superficial, symptomatic care.


    Following Mouffe, PRH’s approach must be understood as a political third way,
    referring to centrist political parties that avoid veering either to the left
    or right. These parties, according to Mouffe, are politically unfeasible, for
    they produce a facade of consensus which ignores the hegemony of nature and society
    denies the necessary agonistic and active choice between alternatives⁴PRH may
    similarly be seen as attempting to appease all sides, producing counter-hegemonic
    symbols whilst receiving hegemonic stamps of approval. This strategy cannot counteract
    the current hegemony because it is supporting its existence. Moreover, it creates
    the impression of a cohesive project (and reality), which in actuality is disarticated
    by antagonism. The needs of PRH’s public (or participants), for example versus
    the actions of its corporate sponsors. This antagonism is never publicly acknowledged.


    As Mouffe claims, no art project seeking to counter-hegemonic can afford to in
    isolation, for ‘it would be a serious mistake to believe activism occurs, on its
    own, being about the end of neoliberal hegemony⁵That end depends on the recognition
    that there are multiple nodes of resistance in civil society and that must grow
    conscious of each other, creating a maze of trenches, or ‘chains of equivalence’,
    that only offer a convincing and powerful new counter-hegemonic articulation.
    Yet PRH does not engage with activist groups or counter-hegemonic artists; it
    does not attempt to participate in any such chain.


    It is important now to return to the source of my discussion around cultural hegemony:
    Gramsci. In his writing, hegemony is an explicitly political phenomenon, product
    of a Marxist line of thought: explanatory tool for modern capitalist and democratic
    societies’ complexities and resistance to revolution. Gramsci, however, never
    denied society’s economic base structure. As a Marxist, he believed the power
    of the superstructure – ideology and hegemony – limiting his argument to defending
    an analysis of the former also on its terms⁶Artworks like PRH are distant from
    this political landscape, interacting little, if all, with the underlying economy
