    # The role of women and care networks


    Mariza do Amor Divino told us in the conversations: ''fear is the weapon of the
    weak. My grandmother always told me.'',27


    One of the most important aspects of Vila''s residents'' struggle, has been the
    distinguished role of women in the organization of the resistance movement. Many
    households were managed solely by women. One of our aims has been to highlight
    their role in the context of ethics of care, which in Vila relates to the production
    of a close relationship to the environment and maintenance of community life itself.
    The difficulty here is how not to reproduce a naturalized relationship between
    gender and care while talking about women''s role in defending their communities,
    despite preization of their lives.28


