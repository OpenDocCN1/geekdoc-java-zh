    Artists’ needs for material resources – equipment, books, money, physical time
    and strength, spaces for work, for learning, for interaction, and for visibility
    – combined with the drive to tackle urban issues, have also produced difficult
    interactions between art scenes and social justice struggles. Embedded in the
    post-1990 hegemonic (economic, social, discursive) frames of communism, aspiration
    towards the West/self-colonization by the corrupt East, capitalism and the unregulated
    market, many art projects and initiatives – such as the ones we discuss here –
    walk the thin line between cooperation and opposition. They pave the way for gentrification
    to help or resist it, they make social justice struggles visible or ignore them,
    they utilize social struggles or up-scale/re-tool them.


    # 1. The Generosity Offensive: Artists Being or Starting Gentrification


    In 2001, the property restitution law (the infamous Law 10/2001) was passed. The
    rising communist discourse of the restitution led a turn towards property regimes
    similar to the pre-1945 one, dominated by large private properties and the unregulated
    land/real estate market. A new class of restitution landlords, partially overlapping
    the pre-war landlord class, was on the rise, while tenants living for decades
    in nationalized and restituted buildings were affected by evictions, with no proper
    relocation, followed by the gentrification and re-development of entire neighborhoods.


    In the early 2000s, the impact of the restitution became visible in Bucharest:
    entire areas in the pre-war central quarters were affected by evictions, thousands
    of people lost their homes, new developments and high-rises the unfolding of gentrification
    processes. Rahova-Uranus was a rising ethnically-middle class neighborhood with
    Roma families, not far from the city center, with a tissue of pre-individual houses,
    targeted by restitutions, gentrifiers, and developers especially during the pre-2008
    boom. A few companies, with cultural labels such as the International Center of
    Contemporary Art (ICAC), DC Communication, Headverting, The Ark cultural center,
    acquired buildings in the area and launched calls for community projects to be
    coordinated by teams of artists, in an attempt to push up and counteract the gentrification
    process. In 2006, Ofensiva Generozității [The Generosity Offensive, OG] project
    won such a call to implement artistic and educational activities with locals –
    pacifying them through evictions and their turning into resistence.


    But the locals had thick networks among each other and a disco – LaBomba – where
    they would get nothing on the weekends, but for spending time together among mothers,


