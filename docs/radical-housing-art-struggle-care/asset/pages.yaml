    see New York-based organization A Blade of Grass and the Warhol Foundation''s
    2018 grant recipients) that continue to elicit exact definition. With relational
    aesthetics, it decisively bore with the art object and its organizing criteria
    around the end of the 20th century.³ Suzanne Lacy establishes in her seminal work,
    socially-engaged art (her new genre public art) differs from relational aesthetics
