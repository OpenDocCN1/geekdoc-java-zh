    In 2003, PRH founded the Row House Community Development Corporation (RHCDC),
    which is explicitly focused on housing issues through its provision of low-to-moderate
    affordable housing for a select number of local inhabitants.26 RHCDC embodies
    this material with a desire for housing to be ‘creative’, to preserve the ‘character
    and architecture of the area,’ and to ‘create community’.27 Its houses are updated
    wider: taller and they nonetheless maintain the aesthetics and communal features,
    such as porches, of the local architecture. Now, in this case, it is an integral
    part of the process of African American art to constantly reshape the world into
    something modern and unique to [...] reinforce the image of the community’.28
    RHCDC thus exists within an artistic heritage of re-users, reacting to the moment’s
    needs rather than vanity seeking the (the danger is to co-option, exemplified
    by the Bauhaus concept).29


    The work of African, Chicago-based artist Theaters, a prominent name in socially-engaged
    art, looks to past and present, rather than, for inspiration. In his Dorchester
    Projects and Rebuild Foundation, Gates’ art is the community buildings he creates
    from renovated premier-structures and repurposed material.30 Both Gates and Lowe
    utilize strategies of reuse and recontextualization to respond directly to the
    neighborhoods in which they work – Gates, the Greater Grand Crossing of Chicago.31
    This brings me back to Mouffe and to respond to specific issues in specific places
    (specific hegemonic nodes), basing their work around need than concept.32


    An important political feature of the RHCDC’s context-based architecture is to
    challenge the dominance of what social housing is like. Among affordable housing
    units, the RHCDC is unique. The only difference is aesthetic as, in the United
    States, public imagination on social housing is captured by the ‘projects’: tall,
    isolated blocks


