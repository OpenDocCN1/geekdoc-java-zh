    THEORY ON DEMAND


    The importance of interactions in a social sculpture lies in the moment they are
    carried out, during which individuals come to see themselves as creative and malleable,
    and thereby become more receptive to change. Embodied alternatives to our expectations
    experiences help suggest that what appear as inevitable patterns are actually
    products of certain dominant ideologies, and alternatives to our reality can exist.


    # ...Without the Political Foundations


    Despite all these convincing elements, I ultimately do not consider PRH, in its
    totality, a true or effective counter-hegemonic art. And I doubt PRH itself, including
    Lowe, would either. Its goals do not appear explicitly or implicitly counter-hegemonic.
    This does not diminish the importance of my analysis, which does not seek to reflect
    PRH''s interests or goals, but rather to provide a tool through which to gauge
    the political within. Though PRH''s work may embody and/or represent positive
    potential, moments of exception and reality, community pride and beauty, none
    of these elements seem intent on drawing deliberate conventions with a wider,
    and determining, hegemonic system. I do not mean to suggest that all art must
    be critical, or that PRH''s output is such a task, but rather to illuminate PRH''s
    role within a sanctioned and controversial artistic discourse, which one prefers
    to create a creative and ethical spin on reality than to consider its critical
    foundations.


    PRH ultimately satisfies the status quo, and therefore we may want to ask ourselves
    whether the features explored above might, instead presenting counter-hegemonic
    potential, be rather artwashing mechanisms for the current hegemony. Artwashing
    is the practice of using the arts or creative activities to give a positive or
    ethical guise to the activities of neoliberalism (or other practices). Neoliberal
    actors have helped the arts in many instances, artwashing implying that any resulting
    production becomes co-opted into the larger machine that keeps neoliberal alive
    and unquestioned. As Ben Davis claims, the ‘rubber barons’ of capitalism excuse
    themselves from their actions through their cultural sponsorship⁴⁶ Mouffe draws
    attention to late capitalism''s reliance on the creative industries for valorization⁴⁷
    through the appropriation of symbols and narratives that industries produce.


    Perhaps the simplest place from which to state PRH''s rather unsavory sponsors,
    including Chevron (a sponsor since PRH''s inception) and, until recently, Bank
    of America.⁴⁶ In a neoliberal context where capital and meaning are inherently
    entangled, sponsorship is no neutral act. The code and visibility of sponsors
    on the projects they fund function as sort of symbolic appropriation of content
    and its own symbolism. Chevron, for example, is one of the world''s largest energy
    companies, especially for petroleum – its role in environmental destruction and
    the propagation of neoliberal hegemony is self-evident. PRH itself has


