  md: '# THEORY ON DEMAND


    Cristena went to Vila Autódromo for the first time in 2009 with other participants
    of the Universidade Nômade network, prosecutors and activists who worked in different
    districts to map evictions. After the invitation to make the glossary in 2017,
    we (Cristina and Lucas) have developed other collaborations and artworks about
    the history of Vila.$^{18}$ In this essay, we would like to share our relationship
    to the history of the Vila Autódromo struggle from three perspectives. The first
    is our experience with creating the glossary Vocabulários em movimento Λ vidas
    em resistência(Vocabularies in movement)$19}$ together with nine residents of
    Vila and the project creators. The second perspective wants to shed light on the
    role of women and the role of care in the struggle. In the final part, we will
    reflect on the role of cultural production and theatre practice in housing struggles
    by reflecting on our own experience.


    ![](img/bdf737ad32ad9ac370607ecf0b726fa8_69_0.png)


    Fig. 4 and 5: Posters (2019) developed with photos from the Images de Memória
