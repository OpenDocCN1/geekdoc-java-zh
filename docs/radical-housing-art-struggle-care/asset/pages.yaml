  md: '# LAND OF THE THREE TOWERS


    # YOU SHOULD SEE THE OTHER GUY


    This play tells the story of the Focus E15 Occupation of four empty homes on Carpenters
    Estate, Stratford, in 2014. Every word in in this script, including the songs,
    is direct verbatim spoken or written by Carpenters Estate residents and housing
    campaigners. The words are taken from documentary footage by Fran Robertson, interviews
    by Emma Morris and media news stories from the time, as well as letters and diary
    entries. We have stayed true to the value in which the words were said and have
    kept in grammatical errors and accents. CJ''s verbatim was recorded later, during
    the devising process. Any company wanting to show this may choose to replace CJ''s
    scenes with any contemporary example of housing injustice. If you do put on this
    play, please remember the intention is to celebrate these words, through song
    and collective playfulness, staying true to them. Land of the Three Towers is
    a truly collaborative effort and wouldn''t be possible without the tireless work
    of campaigners, friends, supporters who fiercely believe in the potency of telling
    these stories. This play is dedicated to all the fighters for Carpenters Estate,
    Stratford. Specifically to Focus E15 Campaign and the residents we''ve lost: Mary
    Finch and Eddie Benn.


    The fight for the Land of the Three Towers continues.


    # KEY CHARACTERS:


    JASMIN STONE: A core organiser from Focus E15 Campaign, one of the 29 mothers
    who received an eviction notice to leave the Focus E15 Hostel when Newham Council
    pulled the funding for their emergency accomodation & baby unit in 2013. Jasmin
    has a 3 year old daughter, Saffia, who was present throughout the occupation.


    SAM MIDDLETON: A core organiser from Focus E15, one of the 29 mothers from the
    Focus E15 Hostel.


    MUTLEY: A long term resident of Carpenters Estate, he lived on the 17th floor
    of Dennision Point for many years and was evicted shortly before the occupation.


    MARY FINCH: A Carpenters resident for over 40 years and a key fighter to save
    the estate. She was a core member of Carpenters Against Regeneration Plans (CARP)
    and can be seen speaking about the regeneration on YouTube.


    FRAN ROBINSON: A film-maker who documented the footage from the occupation. He
    then donated the footage to Focus E15 Campaign and it was used to make this play.


    ENTHUSIASTIC REPORTER: An online reporter (our very own ensemble member, Sapphire
    Mcintosh) who visited the occupation.'
