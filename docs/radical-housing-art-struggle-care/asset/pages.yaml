  md: '# Open or Community Studio (1966-Now)


    Open or community studios held where the concentration of marginalized (classed
    and) people met with conditions of economic decline and urban dilapidation. A
    phenomenon known as spatial concentration crisis point was reached in the 1950s
    in western cities and would quickly quickly reverse into spatial deconcentration;³⁶
    a term which we use to describe complex migratory processes such as white middle
    class suburbanization in the US, and in the UK, the planned class displacement
    from major cities to new towns.³⁷ The open studio registers and proceeds to the
    assault on and abandonment of urban communities left in the wake of these processes.
    In the US Black Arts Movement built on the radical political premise that ''the
    ghetto itself is the gallery''³⁹ by establishing theatres, concert halls, rehearsal
    spaces, exhibition spaces, art and music studios in large and poor areas of the
    inner city.³⁰ The venues generated served as the platform for a rapidly ethos
    of community arts, characterized by the attempt to deflect specialists in favour
    of direct and immediate community provision. In the UK such cases and the community
    arts they supported ''dated back to the 1960s and were associated with attracting
    bookstores, theatre groups and the so-called Artists Laboratories that succeeded
    in attracting new, younger audiences;⁴⁰ But after an Arts Council report (1974)
    the logic of community arts was formalised and increasingly attracted fine artists
    and professional protagonists with an expanding list of media artists.⁴¹ These
    arts''³² ''spaces'' drew upon infrastructures and funding streams which were the
    legacy of the post-World War II defeat (e.g. public health and community education),
    which were open air, flexible, temporary or mobile, and more formal than the traditional
    studio or gallery.


    Most community arts had a base or ''resource centre'' for their operations (sometimes
    a mobile one) and employed a variety of facilities, media and techniques – dance,
    drama and writing classes, festivals, inflatables, murals, performance, photography,
    printing presses, play structures, video – which they used to foster public participation
    and to teach skills⁴²


