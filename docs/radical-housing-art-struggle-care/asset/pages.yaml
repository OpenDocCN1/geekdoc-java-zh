  md: '# RADICAL HOUSING: ART, STRUGGLE, CARE


    The Spieludenplatz in front of the construction fence at the Reeperbahn, which
    was privatized several years ago, became a public venue for the two days of Megaphone
    Choir performances Esso Hauser Echo. According to the former residents of the
    houses, the performances on 24 and 25 of May 2014 fulfilled a concrete function
    of a funeral for the buildings: a memorial service on the spot.


    Before and after the performances, onlookers, passers-by, editors, DJs, Irene
    Bulde, Olaf Sobczak, and Steffen Jörg, the filmmakers behind Buy Buy St. Paul’f
    (a documentary on the Esso Houses) debuted excerpts from their work in progress.
    Neighbours created an exhibition featuring images of the former apartments and
    their tenants on the construction fence. For the first time, the PlanBude presented
    their concept in front of the fence.


    PlanBude has been collecting ideas, wishes, sketches, fantasies, forecasts, models,
    and opinions for a new building complex in the Esso-Houses-Area at Spieludenplatz
    since October 2014. One of St. Pauli''s independent community meetings sparked
    the idea of a planning process from the bottom up: open brief, everyone to participate,
    and before the owner or governmental authorities made any decisions. PlanBude
    provided a wide range of planning tools in two containers near the construction
    site, and in a D-I-Y planning process. To track the St. Pauli Code, artists, community
    workers, cultural and social scientists devised, doorstep interviews, questionnaires
    for all residents in the neighborhood, and PlanBude''s work was made possible
    by protests on the streets. Negotiations with the district mayor, the building
    department, and the owners worked well. PlanBude is now a much-discussed democratic
    planning model. Its research served as the basis for the architectural competition
    for the building developments. The Winner NL-Architects (Amsterdam) and Bel-Architects
    (Cologne) translated the PlanBude results. They designed public roofs, a public
    balcony and no shopping centres, the return of the music club legend Molot; space
    for a Fablab, a community canteen and more. The complex of buildings will make
    40% social housing, 20% community housing and 40% rental flats. That mean 0% condos
    (no privately owned apartments).


    In respect, the political protest does not seem to have a complete failure. The
    Esso Houses Echo performances were crucial in the buildings and ensuring that
    the public debate about the area would not cease with their demolition. The performance
    referred to a proxy speech format that is dedicated to the mission, as an obituary.
    Issues that to be discussed from the perspective of former occupants and neighbors
    are brought to light in a sort of ghost speech at the site of the actual demolition
    (missing speakers) were speaking over the megaphone choir as a PA system at all
    times during the performance. It amplified those statements repeated live.'
