    them as a tool in struggle. Some instances of this art practice are consciously
    undertaken as art; other practitioners reject the world altogether, while others
    again develop non-professional art practices.


    An aesthetic of struggle characteristic of these practices might best be defined
    in terms of gestures that suggest allyship or complicity²¹ (i.e., the condition
    shared by accomplices) with the communities in struggle, whether or not the ''privilege
    to co-opt social justice ideologies''²² is acknowledged. In another sense, the
    aesthetic of struggle uses an intracommural lens to express the community''s agency
    systemic inequality, creating experience that is not exhausted in oppositionality,
    knowledge and desire, but instead decides and generates connections and tensions
    between the collective and singular, the special and the mundane, by Felix Stalker
    and Cornelia Sollfrank in the introduction to their jointly edited volume Aesthetic
    of the Commons. This art lives from a permanent process of experimentation. It
    envisions and responds to the contemporary moment not only as resistance “but
    also as “Beautiful” – understanding beauty as that cannot be fully grasped conceptually
    nor simply consumed.²³


    One example of such an art practice is the Kamend project by cultural workers
    Nebojša Milić and Tadej Kupe of the Rex Center in Belgrade. It began with a series
    of conversations with tenants of Kamenin social housing project, located in Zemun
    in Belgrade. The neighborhood attracted public attention after racist protests
    from neighboring blocks in response to an outbreak of scabs at a local primary
    school. The protestors accused Roma tenants in Kamenin of spreading the disease
    and the city office to stop renting flats in the area to the Roma. Conversations
    with tenants soon revealed that the real problem in the neighborhood was debt
    crises.


    State officials used the unrest to speed up the eviction of inflated rent bills
    imposed by the authorities themselves. Answering one question, Kamenin Zlatija
    Kosti declared herself a culprit for her own and her family''s predicament, saying
    she would use herself. Together with Nebojša Milić and Tadej Kupe and few other
    Kamenin tenants facing eviction, Zlatiska Kosti wrote a play in the form of court
    records from Zlatijas litigation against her. Zlatija the elder is suing Zlatija
    the younger over the difficult living conditions and faults that brought her to
    the council flat despite having worked all her life and under Yugoslav law having
    the right to home. The play ends up in a kind of forum theatre situation, where
    the audience plays the jury. This creates an awkward feeling of being a spectator
    as well as an accomplice in the situation. Unfortunately, the play has only been
    performed once in Serbia, but the project itself obtained significant publicity,
    helping the tenants to build their case against the municipality. The struggle
    of the Kamenin tenants continues.


