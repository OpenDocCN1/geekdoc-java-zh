    # The Megaphone Choir as an Amplifier²


    Megaphones have a pistol grip. The speaker uses it to target people and spaces,
    to address the speech in aligned acoustics. You need to pull a trigger while you
    are talking in order to shoot an emotion. The megaphone as an object might emblematic
    of political resistance, protest and civil rights movements but at the same time
    it is an apparatus of command and instruction, instrument or gadget to give orders
    and to fill the air with sounds of warnings and directives. It is used by the
    military, the police, safeguarding services, departments, commanders, commanders,
    instruct to instruct, and (cheer)-leaders. It''s meant for crowd management, emergency
    management, used to teach or to win a crowd. In all these areas of reference,
    the applications and functions of the megaphone oscillate in sound as in the image
    of the megaphone when it amplifies political messages — for example, in the street
    during a political demonstration. Against this background, it may not be obvious
    that the Megaphone Choir arose from the question: What could a political speech
    like if it were emerging from the political process, instead of initiating it,
    directing or controlling it? How might a political speech, rather than planning,
    specifying, or commanding activist action, effectively reflect and amplify a collective
    of activist action?


    At its core, the Megaphone Choir is about transporting the statements from one
    place/moment/connect to another. Everything we speak, call, whisper and sign is
    the verbatim reproduction of interview answers. A choral repetition of the statements,
    based on the audio interviews, is designed and rehearsed. Like every speech, this
    calls for an intensification of the musical qualities of justice. The individual
    speech melodies and speech rhythms of the interviews form the basis for the composition.
    An assemblage of megaphones, voices and the bodies of twelve performers swarm
    and condense again, effectively creating a mobile speaker system. The Megaphone
    Choir is Esso-Initiative.³ Founded 2011, the initiative has been working to provide
    affordable residential and commercial space in St. Paul. For years, tenants fought
    and nail to maintain their apartments, shops, and nightclubs. They were backed
    by the Right to the City (Recht auf Stadt) network in Hamburg,*


    +   2 Amplification: multiplication, potentiation, reinforcement, recruitment,
