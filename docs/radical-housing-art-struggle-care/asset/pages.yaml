    be truly critical of its effects. In a sense, the YMRP’s alternative success stories
    support the myths of the prevailing system, as they imply that its effects are
    surmountable through self-application and creativity.


    # A Case for Critical Art


    So, what is the political art? In our neoliberal society, I believe art gains
    its political dimension when it addresses our prevailing hegemony and aspires
    to be critical, following Mouffe, by challenging the status quo. PRH, one of the
    most celebrated and long-lasting works of socially-engaged art, is a suitable
    starting point for this analysis in part because of its pre-eminence and in part
    of the difficulty in assessing it over purely aesthetic grounds as a socially-engaged
    piece.


    The basis of my analysis is Gramsci’s theory on cultural hegemony, which posits
    that the dominant obstacle to Marxist evolution in today''s democratic societies
    exists within their superstructure: specifically, their hegemony, or reigning
    ideology that is produced and reproduced not only at the state level, but also
    at the level of civil, or private, society, and that serves as continuous justification
    for the conditions of the underlying economy.


    PRH, despite its accomplishments within the artworld and the Third Ward, does
    not ultimately, present a critical artwork geared at providing counter-hegemonic
    alternatives. Its potentially counter-hegemonic production provides an example
    of how socially-engaged works may be approaching the challenge of affronting neoliberalism.
    Through its staging of emancipatory experiments by the YMRP, and its powerful
    and alternative use of architecture, PRH offers a potential dissent. However,
    its critique is never fully articulated: it is tied in with other works or hegemony’s
    political and economic logic. It avoids addressing the origins of some of its
    concerns, like gentrification and the economic marginalization of certain demographics.
    Playing with the reversal of end effects, PRH may ultimately be furthering neoliberalism
    with cultural cushioning and anchoring – thus avoiding such fate, PRH would have
    to be more critical of its relationship with capital and elite such as Chevron;
    provoke dissent and creative production related to the more foundational conditions
    of society; actively link up with radical projects and groups working in similar
    areas; and continue offering spaces for the creation of new subjetivities, such
    as the YMRP.


    I not intend to discard PRH and its work, to label it a failure, or ignore the
    beneficial effects it has on many of its participants. Instead, I seek to light
    the political question of hegemony and how artworks, in an era of increasing encroachment
    of capital into the culture, may understand themselves in relation to it. Or do
    I view neoliberalism as a monolithic, inflexible entity. It is precisely neoliberalism’s
    flexibility and localized forms⁵⁷ – which nonetheless prioritize the expansion
    of capital over'
