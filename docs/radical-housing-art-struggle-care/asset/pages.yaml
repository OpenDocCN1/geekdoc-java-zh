  md: '# RADICAL HOUSING: ART, STRUGGLE, CARE


    It used to be that anyone who wanted to collaborate and support the squat go and
    do their work there. Now, because they are more and more aware of their self-importance
    as a museum,, the artists who already have a name are given more space, and their
    work is placed in more visible places, and the artists who nobody knows are relegated
    to some corner. The place is increasingly receiving a bourgeois audience who visits
    on Saturdays, take a walk, have some exotic food, and take a picture of a Roma
    they would do with a monkey at the zoo, and then they can go home feeling good
    about having taken a tour to the city''s periphery experience marginalized life
    for a few hours.


    This interlocutor was referring to the urban middle class, who increasingly composes
    the audience that visits the MAAM on Saturdays to enjoy the radical aesthetics
    of anarchy and revolution. During my visits to the museum''s open Saturdays, I
    saw the visitors seemed to be a mix of university students, art practitioners,
    hipsters, middle-age social democrats, and middle-class families who consume contemporary
    art for leisure. And I never saw anyone taking a picture of a Roma child, did
    I see a number of art—one could say, following my interlocutor, bourgeois—spectators
    from more affluent parts of Rome behaving exactly like they would do at a conventional
    museum or art gallery space. Some of the pieces we walked around, took pictures,
    and stopped in front if the quality of the work could be divorced from the material
    conditions in which it was produced. During these Saturdays, the interactions
    between the squatters and the visitors were limited. The people at Metropol provided
    the services, such as cleaning the space, welcoming visitors by the door, or preparing
    the food, much like working-class people of color would do in a different, more
    conventional cultural institution.


    For others inside the squat, opening the space to center middle-class audiences
    was desirable. Arguably, these audiences marked Metropol as a space that was different
    from other social squats in Rome, perceived to be much unruly and marginal. This
    was Mustafa''s position, as he explained:


    We don''t want to be like social centers that organize concerts and parties and
    make a lot of money out of it. We don''t do it for the money. If we did, we could
    get a lot more, but in places there''s loud music, and people get drunk and on
    drugs, and that''s not the image we want to have in the neighborhood. We have
    an art space, so people can come here with theirs. We get a lot of families that
    come to visit.


    Mustafa stands by the entry gate on Saturdays. He is in his visits and comes from
    a rural area in the North of Morocco, although he has spent a few years in Casablanca
    coming to Italy. He is in charge of informing visitors about the donation policy.
    Although it is not required to pay in order to visit the MAAM, he advises people
    to donate a minimum of five euros. He has a recurrent joke that I have seen him
    perform many times. It is usually some variation of ''If you want to leave a hundred,
    or a thousand euros, it''s up to you. I''m not gonna say no!'' Visitors laugh
    and leave some coins, or five, ten, and in very rare'
