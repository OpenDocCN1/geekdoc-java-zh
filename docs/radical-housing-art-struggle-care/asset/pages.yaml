    brought over with slavery. Shotguns exist in repetitive rows with front porches
    and a common backyard space, encouraging social interaction among inhabitants.
    They have always been associated with African Americans, but after desregation,
    as more affluent individuals moved away from their historic neighborhoods, they
    became linked with impoverished African Americans specifically.⁰ Across their
    social lives, these houses have to represent a specific


