    # Holding the Line: Three Stories About Art as Political Tool Within the Housing
    Movement


    # 1. Cluj: Integrating Tactics within Activist Strategy


    Cluj-Napoca, one of the largest Romanian cities and the first in terms of housing
    costs (rents and sales), has emerged as Silicon Valley of Europe with its boom
    of the IT industry. Welcomed by both the local and central government, this economic
    shift has rapidly transformed the city into the main candidate to be a European
    city: gentrified, with a growing population of tenants, and highly appealing to
    unicorns such as Uber or Airbnb. Quickly augmenting housing prices, hurried evictions,
    and the targeting of Roma residents have marked the city for more than a decade.


    In parallel a radical political scene is emerging, organizing structures and fighting
    critical analysis against these processes. One of the most important events to
    mark the development of the activist scene was the eviction of 300 people from
    Coastei street on the early morning of 17 December 2010. Forced by a high number
    of police officers pressing for the eviction, the community was displaced to the
    city’s landfill and chemical waste dump, which they soon found to be substandard
    housing close to as Pata Răt. The eviction displaced the entire community, including
    many families of Roma ethnicity, to an area cut off from transport, health services,
    and access to schools.


    Organizing this struggle began immediately after the eviction. The community found
    support in locals, activists, and academics in NGOs supporting Roma rights. Soon,
    the alliance made the struggle consider visible and marked the beginning of the
    movement in Cluj. The community around Pata Răt developed tactics suitable for
    safeguarding the attention of the dynamic, aspirational city of Cluj. They chose
    a variety of activist means to draw attention to the Pata Răt injustice and gain
    more supporters.


    According Enkök Vince, one of the struggle’s main organizers and activist researchers,
    the alliance created with the local critical art proved to be effective, innovative
    and empowering, establishing an original type of artistic activism.²⁵ One of the
    most visible artistic interventions were the project organized by Scoala Populară
    de Art Contemporă [Popular School of Contemporary Art – SPACC] in 2011: an educational
    and activist endeavor, Ești în Pata Răt [You are in Pata Răt] produced several
    art interventions made by students with evicted. Exhibited as art showed and used
    as props for welcoming officials in protest actions, they used the method, ironic,
    and intellectual style of contemporary art to raise awareness towards


