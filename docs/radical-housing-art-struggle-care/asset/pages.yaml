  md: '# THIS BUILDING TALKS TRULY


    FILIP JOANOVSKI, IVANA VASEVA & KRISTINA LELOVAC


    ![](img/bdf737ad32ad9ac370607ecf0b726fa8_209_0.png)


    Fig. 1: Railway Residential Building. Photo by Zoran Shekerov


    Our contribution in this book is the script for the performance that was presented
    for the first time at the Prague Quadrennial of Performance Design and Space 2019
    in Prague, as a part of the installation This Building Talks Truly. The main scene
    of the performative installation is the Railway Residential Building in Skopje.
    The building is an active participant together with the actress Kristina Lelovac
    and the audience that are summoned to become potential tenants or members of the
    household count. The scene is built from a mobile stage elements and attached
    video projections, sound speakers and written text boards. The performance narrative
    speaks about the problems that the residents of this building have been facing.
    The stories have collected during the research phase that has included the survey
    and an attempt to test the possibilities for the common resolution of existing
    issues with the help of the forum theatre technique.


    The Railway Residential Building in Skopje raises important questions about privatization
    and commodification of commons in Yugoslavos, anti-Yugoslav and post-Yugoslav
    times. Although these once-apartments have been already privatized, in the comprehensive,
    yet silent privatization processes within the frame of the post-social transition
    that has meant the restoration of capitalism, Yugoslav architectural concept for
    collective housing that this building embodies provides a space and an opportunity
    for reasoning about different models for collective living and collective management
    of common spaces.'
