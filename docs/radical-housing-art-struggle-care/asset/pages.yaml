  md: '# Where do we stand?


    Imbications between aesthetics and politics in the context of mega-events reinforce
    and generate various forms of exclusion in the city Rio de Janeiro, as well as
    in Brazil. Art needs to criticize this subsumption, since it is made an instrument
    of regeneration and gentrification, diminishing and erasing class and territorial
    struggles. At the end of the Céu Aberto event, there was the possibility to organize
    a public event in the MAR museum, in the docks area. There was a common understanding
    among people in the Céu Aberto, that the regeneration project that built MAR Museum
    was the plan than than evict Vila. Therefore, it didn''t make sense to organize
    the event in the Museum. Calling the artistic community to Vila for the final
    event, was an attempt to break the privilege of certain areas by gaining community
    cultural production and bringing the cultural class closer to struggles. Our role
    as critical artists is to prevent the institutions and art markets from profiting
    from this material without any gain for the community. In solidarity with the
    struggle, also in conflict with the project of commodification of the city and
    its forms of life. This also means producing other forms of discursive positioning
    in the artistic context. This is a principle for us. We are dedicated to the struggle,
    not just by engaging with the memory of Vila Autôromo against its disappearance,
    but also by continuing struggle against the commodification of cities and lives
    in other that we do.


    To stay within the movement, the videos and the artworks, as well as the produced
    knowledge, must stay connected to the struggle. Everything that has been produced
    about the struggle has been shared with tenants of Vila including the income that
    has been made. From intensive listening, we have learned how to compose with/from
    the local conditions, deserves and material needs. These works we have developed,
    inevitably situateate ourselves in relation to our own communities (this means
    those effects that should also be taken or assumed by the militant researcher,
    the effects of the research in the researcher itself). The struggle against the
    disappearance of Vila should be then not just the right to remain physically in
    the territory and the right to keep your home, but also the right to sustain the
    relationships and the values that structure that of living—culture itself.


    As Marcela Munch, a local researcher said to us: "the struggle expresses a force
    of resistance to the modes of commodification in contemporary cities, and it has
    an unusual persistence in the fabrication of the city." °40 This struggle is not
    only about staying put but about new forms of collectivity emerging under constant
    privatization, alienation, suffering and indebtedness, hence, the right to preserve
    the bonds that are constantly erased by capital.'
