  md: '# Vocabularies in movement


    The eviction of the Vila intensified around 2013 and coincided with the Revolutionary
    Spring that came after the cycle of urban struggles in 2011. The 2013 June uprisings
    was a peak of the resistance against the continuing precarization of life during
    the developerist governance of Dilma.² In 2017 when we arrived in Vila, there
    was an overwhelming sense of suffering and feelings of loss. Nevertheless, the
    narratives of the people who remained in Vila have the ones of strength, determination
    and astonishment at their own victories. The Macena family (Maria da Pena Macena,
    Luiz Claudio Chalard and their daughter Natalia), as well as Sandra Maria de Souza,
    Sandra Regina, Jose de Souza Teixeira, Denise dos Santos, Dalva Crispino de Oliveira),
    participated in the making of the glossary.


    Getting in touch with these narratives through the project and producing the vocabulary
    could be a delicate operation. First, we had to come to the understanding of what
    forms of art could be used in a context that was already using to seal big contracts
    and hide oppression.¹¹ Working like artists, from other practices such as ethnography,
    cartography, the social clinic, and from our other experiences, we wanted to understand,
    above all, how we could be useful to the people of Vila; we could add to the material
    and affective needs of the people in struggle.²²


    The history of Vila Autódromo''s resistance has been going on for more than five
    decades. Our cartography revealed multiple points of view and revealed the connection
    between resisting and reproducing Vila''s community. This is how Nathalia and
    Sandra residents of Vila and participants in the project, described their experience:


    > After the meeting of the Residents'' Association we walk through the streets
    of Vila. Their task was to collect signatures for the petition against the eviction
    from residents. Door knocking and walks in the neighborhood, allowed them to get
    to know residents faces, their lives, and routines better. Some of them have already
    known. Some of them more, others less.³


    We started with cartography as a form of research, a type of cartography always
    partial, never total.¹⁴ It is a non-representational device, a way of getting
    to know, and a way of producing art. It helped us designing a temporal approach,
    the singular encounters to perform listening as a device to get to know and engage.
    Cartography as a research (anti)method has


