    2017, the Museum of Evictions donated rubble to the National Historical Museum.
    As Sandra Maria de Souza writes in the glossary:


    > The rubble is certainly the main exhibit in our collection. Debris has been
    incorporated into the collection of the National Historical Museum, now on display
    in the permanent exhibition about contemporary history. For us, this is undoubtedly
    a great achievement. While fighting for the right to stay put, we ended up conquering
    spaces that we never imagined before.¹⁶


    During this process, working with the history of the struggles in Vila, we have
    learned that the persistence of this struggle has goes beyond the struggle for
    housing and the reconstruction of Vila Autódromo. Vila Autódromo''s resistance
    teaches residents of Rio de Janeiro, not just those of occupied territories and
    favelas, but also of collectivity and neoliberal oppression. Vila conflicts modes
    of life and social reproduction more associated with constant privatization and
    alienation brought about by the alignment between market and state. This is made
    explicit in the landscape itself and in the name of the condominiums (tower blocks):
    right beside Vila gigantic tower blocks reproduce an ostentative bourgeoisie known
    forms of alienated life. Developments signed by Carvalho Hosken company reinforce
    with names Pure Island.


    ¹⁶ Cristina Ribeiro and Lucas Sargentelli (eds), Vocabulários em movimento, Rio
    de Janeiro, 2017, pp. 22'
