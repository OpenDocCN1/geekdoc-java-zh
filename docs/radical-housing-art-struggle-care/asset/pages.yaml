  md: 'The decades-long re-signification of gentrification has attempted to recalibrate
    social cleansing in the public imaginary as a social good. These efforts include
    gentrification''s imbrication with transit-oriented development, tourism development,
    the development of public parks affordable housing development, sports-oriented
    development, and what we will call artsoriented development, or artwashing. In
    each instance, community groups that oppose speculative real estate and its gentrification
    face accusations that they oppose neighborhood change. Communities that resist
    the construction of a bio-tech corridor are accused of opposing hospitals. Communities
    that oppose large-scale housing and retail in a former working-class neighborhood
    are accused of opposing small business owners. In the context of art and culture,
    communities that oppose the designation of an arts as a prelude to luxury development
    are accused of hating art and artists.


    Since the 1997 debut of the Guggenheim Museum in Bilbao, Spain, urban planners
    have prioritized the use of arts and art institutions in the economic redevelopment
    of cities and neighborhoods deindustrialization. Here, art, and art institutions
    are used both materially and ideologically to foster and protect gentrification.


    Celebrating the so-called Bilbao effect, urban planners use the resources of private
    capital in concert with government incentives to instrumentalize contemporary
    art in focusing investment capital and flipping neighborhood demographics. Their
    range from capital-intensive arts institutions, elaborate multi-site biens and
    arts festivals, and the city planning designation of districts to most efforts
    like public arts commissions and walks. Similarly, development boasts Following
    Florida have centered the creative class as the protagonist for neighborhood transformation
    on the expense of poor and working people. The presence of artists and creative
    professionals is seen as effective in shifting the image and material reality
    of a neighborhood—from one marked by purposeful divestment, into one that has
    been up-cycled or cleaned up, and made attractive to middle class renters and
    buyers.


    As creative discourses and initiatives have aged with time, their impacts have
    come into sharper relief. Rather than discovery, we see erasure. Rather than revitalization,
    we see the death of community. Rather than creating supportive spaces for artists,
    we see luxury consumerism. Around the world we have learned that arts-driven revitalization
    depends on the displacement of long-term residents and the homogenizing of local
    culture for a culture of capital. Meanwhile, the brand of a creative class continues
    to sell graders of speculation long after the artists, designers, and other professionals
    have themselves been displaced and replaced.


    The process of arts-oriented gentrification follows familiar stages that planners
    and developers now view it as a formula to be replicated. Some argue it is a natural
    or inevitable process, or the result of individual consumer choices, which is,
    by now, highly centralized, controlled and scripted. Landlords, developers, private
    businesses, and city planners present oriented gentrification as a win-win for
    the city and for business ignoring the loss of home, employment, and way of life
    for poor and working class members of the community. In this article, we critically
    focus on the structural role of the arts as leverage within the processes of gentrification
    and explore how to build resistance against gentrification scripts.'
