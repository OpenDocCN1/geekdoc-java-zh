  md: '# RADICAL HOUSING: ART, STRUGGLE, CARE


    149


    While building on real events and effects, they also reveal the distance between
    utopia and blur the lines between past and future. Bridging the gap between what
    has been done and what could be done, the whole project becomes a tool for dreaming
    a radical future and making possible plans of action.


    # Reading between the Lines


    Writing from the perspective of participants and producers involved in the housing
    movement and art scenes, we sought to map some important events, projects and
    developments in Bucharest and Cluj that marked the features of the post-social
    critical/engaged art scenes, the complexity and strength of the local housing
    movement, and the tensions in these fields that separate solidarity practices
    from capital-centric ones. With a keen eye on the relations of power they express,
    we propose a critique of the complicities with hegemonic discourses and policies,
    while also tracing the intricate motivations of some of the actors involved. Trying
    to avoid relativizing, we explore the ambivalences that art projects may—the line
    between enabling and resisting gentrification, between disengaging with evictions
    and making them visible, between complicit with power or real estate interests
    and resisting the subaltern role of the artist in a (semi)peripher context. We
    consider them as episodes in a broader history of art versus power.


    Building upon our positive experiences and the inspiring work of our comrades—integrating
    tactics within strategies, using theater and performance as political tools, celebrating
    past paths and political dreams—we propose the housing movement’s intersection
    with art as somewhat of a story of fulfilled solidarity possibilities: they reinforce
    each other in radical and empowering ways. We have seen it happen. Although we
    do not think there is any strict recipe for how to do and empower social movements,
    or how to do political work and mold the imagination and affects of comrades and
    peers, we consider the stories told here to be valuable insights, and to some,
    lessons for our radical futures.


