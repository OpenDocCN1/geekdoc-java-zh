  md: '# RADICAL HOUSING: ART, STRUGGLE, CARE


    An association originating in the earlier project initially sought to provide
    1% of the culture produced by Belgrade Waterfront under the terms of the public-private
    partnership with the Eagles Hills company of the United Arab Emirates. This soon
    proved impossible. Critical voices among the artists were silenced in favor of
    a culture led by developers and the state, whose outstanding products are a 24-meter
    national(stistic) monument to Stefan Manjani (father of the Serbian nation), the
    work of an artist from Russia.


    In (semi)periperical regions, the practice of regeneration had in hand attempts
    with modernization on Western models, including drastic overhaul of existing socialist
    and social structures and the introduction of new capitalist economic forms into
    urban space, housing, and art world.¹16 Cultural processes that foster the subordination
    of the periphery to the capitalist world-system overlap with a particular developmental
    ideology characterized by a presumption of the inevitability of historical change
    and by political and economic intervention by the Western core. This ideology
    became normative within capitalism in the 2000s as a response to the crisis of
    Post-Keynesian Economy.


    The term ''developmentism'' as used stands both for the ideology of urban growth
    and progress with no social consciousness, and for that of developmentism as neo-colonial
    doctrine pledged to Eurocentric free-market urban development, including the introduction
    of new financialized and culturalized forms of housing capital in the Global South
    and the Global East. However, developmentism is not unique to the Global East
    and the Global South: it also operates within the internal peripheries of the
    Global North, where the same logic was used to dismantle the social condensers,¹⁷
    built under the pressure of the well-organized post-WWII working class. Within
    this process, artists and art take the role of development agents, called to perform
    a particular function which often involves tasks assigned in places wholly unknown
    to those accepting them.


    The artists are called with names like regeneration projects, transitional landscapes.
    Often these are the sites where gentrification is played out, with the urban poor,
    the working class and brown communities displaced to make room for the relatively
    affluent. ''Development-led art'' is a new term. I want to propose it because
    it connects culture-led regeneration and developer-led art aspirations, and reconnects
    universal capital built these concepts into the ongoing social reality. The term
    refers to an art practice integrated into neo-colonial real-estate development
    as a business process encompassing a range of activities such as the refurbishment
    of existing buildings and neighborhoods, renovation, new building, land transactions
    and homeless management.


    Development-led art is the art of housing struggle with a function of a tool in
    different


