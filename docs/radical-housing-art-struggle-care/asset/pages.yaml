  md: '# RADICAL HOUSING: ART, STRUGGLE, CARE


    In addition to its architectural offerings, I believe PRH has another counter-hegemonic
    feature: its Young Mothers Residential Program (YMRP). This program provides subsidized
    housing, counselling, mentorship, afterschool to help a group of young, low-income
    mothers in the neighborhood for one to two years.^39 The demographic of the overwhelmingly
    African American YMRP40 is one of the disenfranchised in the United States and
    country. One in three single-mother families are African American; among women,
    African Americans have the highest percentage in poverty.^41 These statistics
    come as no surprise to a country history the implications of its slave-owning
    past, with a dominant social and economic class consisting predominantly of white,
    Christian (overwhelmingly not single-parent), affluent men. PRH''s chosen demographic
    is an inversion of the heroic elite.


    The power of the YMRP is its enactment of alternative success stories, of a temporary
    space where its female members, receive little attention from society at large,
    are respected and in control. Guillermo Gómez-Pez of radical performance art troupe
    La Pocha claims, while art projects can create ‘an imaginative space, we know
    that it actually exists, even if for the duration of a project.^42 Heries the
    power of emancipatory practices like the YMRP– their emancipation and enactment
    of alternatives are, even if short-lived.^43 and pertains to create new subjects:
    cracks in the smooth facade of hegemony. Hegemony''s survival depends on its posing
    as invincible, as pre-dating the very terrain of resistance, and thus every transitories
    like the YMRP may prove effective in implementing hegemony''s fragility in the
    minds of those who are crucial to maintaining it: members of society.


    Another frame which to understand what the YMRP is Joseph Beys'' concept of social
    sculpture, an inspiration for Lowe. Beys claims that everyone is an artist and
    that simple social interactions constitute art if appropriately created.^44 The
    YMRP aims to provide such a platform for creative and amelior practices, prioritizing
    interaction and experimental/activities for participants to identify with and
    activate their ''creative selves.^45


