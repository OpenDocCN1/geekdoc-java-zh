  md: '# RADICAL HOUSING: ART, STRUGGLE, CARE


    # BIOGRAPHIES


    AHAAHHA is a writer from E1, London. AHAAHHA does youth and care work, on the
    “frontlines,” in the shadows. AHAAHHA assumes apocalypses. AHAAHHA trusts in youth,
    wants to create and destroy worlds with youth (the future). AHAAHHA is interested
    in strategies for appearance and disappearance of hurt bodies. AHAAHHA is interested
    in tongues untied, in human and non-human becoming.


    Josephine Berry is Research Tutor in the School of Arts and Humanities at the
    Royal College of Arts and Research Lecturer for the MA Cultural Industry at Goldsmiths
    University in London, focusing on experimental methods of research and a spatial
    approach to culture. She has worked as editor for the cultural politics magazine
    Mute since 1995. Her monograph Art and Bare Life: A Biopolitical Inquiry (2019)
    brings the biopolitical theory to bear on aesthetic theories of autonomous art.
    She is currently working on a book that explores the elusive substive of Planetary
    Realism.


    Alyssa Erspamer lives in Rome where she works as a junior facilitator for the
    Matter Group. She completed her postgraduate degree at the University of Manchester
    in Visual Anthropology and her undergraduate degree at University College London
    in European Social and Political Studies, with a dissertation in Art History.
    She grew up in Boston, Massachusetts, to Italian parents. Her research is interested
    in leftist theory/movements, bureaucratic and humanitarianinstitutions/organizations,
    Italian traditions, contemporary art/esthetics, and applied continental philosophy.
    At the time of writing, she is working on a film for Poets in Azione’s series,
    Città a parole.


