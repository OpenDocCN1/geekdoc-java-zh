  md: '# 66


    # THEORY ON DEMAND


    ![](img/bdf737ad32ad9ac370607ecf0b726fa8_65_0.png)


    Fig. 1: View from Vila Autóromo to the Jacareaguá Lake. The beautiful landscape
    is one of the main reasons for the interest of real estate speculation in the
    territory. Photo: Cristina Ribas.


    When we speak about Vila Autóromo''s struggle today, we are referring to a group
    of no more than 15 families that remained in the area, where around 2000 people
    used to live. Many leaders from the residents'' associations were on the front
    line of this organized struggle (such as Inalva Mendes Brito, Altair Antunes Guimarães,
    and others). Most of the people living in the area gave them up out of exhaustion
    in the harsh months of the eviction. There is no precise census of the people
    living in the area. Nevertheless, we know that there were around 650 families
    organizing against eviction. They used to live in 650 houses — in very different
    conditions, from barracos (improvised, poor and precarious homes) to three stories
    houses with a garage. The dismantling of the Vila has been initiated simultaneously
    with the eviction of favelas. The mayor of Rio de Janeiro in 2009 classified favelas
    as ‘risk areas’ due to the landslide after excessive rain. This has coincided
    with Rio becoming a site of the Olympics. The back and forth of negotiation between
    the housing department and the inhabitants of several communities be evicted for
    lasts. Communities wanted to negotiate in a group, trying to preserve the bond
    between the families and the relation to the territory, not to succumb to individual
    agreements as forced by the city. After being completely mobilized, the political
    energy never left Vila Autóromo. Vila was to remain. A re-urbanization plan was
    approved in agreement with the mayor of Rio de Janeiro, and it included building
    20 new homes for the remaining residents of Vila.'
