  md: 'Guy seeks to understand the impact of restitution on the art scene and ways
    in which art has been utilized both in the real-estate industry and as a tool
    for the city of Berlin to reimagine itself.


    The section Narrowing the Space and Mourning the Losses starts with a contribution
    by Josephine Berry and Anthony Ives: ''The Exploitation of Isolation: Urban Development
    and the Artist’s Studio.'' They examine the five stages of the artistic studio''s
    genealogy: from the isolated studio, the factory studio, open or community studio
    and the networked studio, to the pop-up studio. They show how the forms have developed
    both in relation and at a distance from the housing market and real-estate industry.
    With this contribution, the authors show how housing and studios have been merging
    into live-work arrangements, making and remaining artists as potentially rebellious
    (and revolutionary) students that have tried to negotiate, make compromises, and
    eventually become the off-unwilling accomplices of social cleaning. The section
    ends with a contribution by Sylvi Kretschutz exploring the potentials for art
    in dealing with housing struggles. Kretschutz reflects on the radical differences,
    which features two women with megaphones amplifying a set of interview-statements
    of former residents at the demolished Esso houses estate in Hamburg. Kretschutz
    writes about the necessity of amplifying grief in dealing with the failures of
    the struggle as a means of empowering people in the movement.


    The book ends with a section on Patterns of Commoning and Working with Dirt. Here,
    Andrea S. Micu reflects on the role of art in Metropol, a squat of Rome for over
    three hundred people, mostly immigrants from Morocco, Tunisia, Eritrea, Sudan,
    Poland, the Democratic Republic, Ukraine, Romania, and for working-class people
    from Italy. She reflects the role of art in the commodification of urban commons
    by looking at the MAAM (Museum of the Art and the Elsewhere), which defines commons
    as radical differences and irreducible plurality. This is followed by the text
    written by Filip Jovanovski, Ivana Vase, and Kristina Lelovac, elaborating on
    the histories of struggle over the site of the Railway Residential Building, a
    socialist housing estate in Skop. In this chapter, the authors explore the problems
    of dwelling together and managing common spaces during the Yugoslav era, anti-Yugoslav,
    and post-Yugoslav period. The book ends with a provocation by AHHAAHHA that raises
    essential issues about knowledge production in academia tackling housing violence.
    This contribution raises a point about the need to find ways to produce knowledge
    that will allow for the messiness of our lives to speak up and make new institutional
    arrangements against the class, race, and gender divide.


    In this publication theorists, activists, organizers, and artists engage with
    struggles and art practices to provide building blocks for understanding radical
    housing. In their writings, they respond to the imperative of how we do housing
    and how to practice art in difficult situations when life is at stake, including
    one’s own. This kind of messy art practice demands messy theory and a messy process
    of thought.³38 But beyond advocating messy knowledge production against formalized
    ways of thinking, a few also argue for creating the conditions for producing knowledge
    from struggle and dirt. From development-led art'
