    # Restitution in Contested Times


    When the Wall fell, the former east of Berlin was in a state of despair, with
    World War bomb damage visible across the city and few renovations having been
    carried out on the older and predominantly residential buildings, of which were
    many in the new century. In the further east of the city, Karl Marx Allee, for
    example, new housing blocks, Plattenbau, had been built that illustrated the landscape.
    However, in Prenzlberg Berg had been little updates to the residential buildings
    during the GDR, the majority of which were Altbauen, meaning despite its dilapidation,
    it was continuous with the western sides of the city. In addition to this, it
    is estimated in Prenzlberg Berg 10-20% of residential buildings were empty.⁸ culmination
    of these conditions and its central location meant that it quickly populated.
    It became one of the first subjects of a major redevelopment⁹ and by 1993 being
    designated a Sanierungsgebiet(urban renewal area).¹⁰ Additionally, restitution
    was addressed in Prenzlberg Berg there were few claims made to the buildings,
    only 35,000 claims being made on residential buildings, of which 10% were successful.¹¹¹
    The result of this was that the properties could be bought, thus allowing the
    developers who had been keenly watching the progress to step in and make purchases
    and beginning the process of privatization.


    Many Berlin inhabitants became cynical of the *Wende* as it unfolded into westernization
    than a true reunification, which led to increased activism and protest across
    the city and for a Third Way being made by a disenfranchised public. This dissatisfaction
    with the *Wende* was one of the contributing factors that led to a resurgence
