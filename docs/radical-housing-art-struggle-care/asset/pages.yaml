    ![](img/bdf737ad32ad9ac370607ecf0b726fa8_147_0.png)


    The other story is based on the existing residential complex Rose Garden in Bucharest,
    a massive housing project numbering about 900 apartments. It is built on the land
    of a farmer (privatized and dismantled) socialist factory, by the real-estate
    broker and developer Coldwell Banker — a giant of the real-estate sector originating
    from San Francisco. During a workshop organized in Bucharest, this capitalist
    story of privatization, gentrification, and extraction was turned into a story
    of workers'' empowerment: the former factory, processing basic fabrics, is privatized
    in the late 1990s not to some foreign capitalist venture, but to its own workers
    becoming a collectively owned company. Then, it was the workers who decided to
    move the factory to smaller grounds, demolish the old factory and build a vast
    housing complex for themselves on this land. This way, the factory was saved from
    bankruptcy and extended in a vast community-owned structure including land, processing
    facilities, and housing units. The housing complex ended up being named White
    Flower, celebrating the cotton plant, the main fabric processed in the factory.


    These speculative histories paint two sides of the same story of the privatization
    of housing and the historical delegitimization, dislocation, and dispossession
    of workers in post-89 Romania.'
