    # Conclusions


    If, throughout modernity, succeeding generations of artists dreamed of accelerating
    both thought and creation to the tempo of technological production they could
    not fail. The paintbrush''s pursuit of fugitivity moved at a slower pace than
    the steam while, the Futurists'' ecstatic white-heat left the terrestrial assembly
    line in the dust. Temporal coincidence with prosaic production has been inherent
    to art, whether intentionally or not, for centuries. The artist''s requirement
    to pop-up, fill-in, engage and performatively by there, evidences an inescapable
    synchrony with the accelerated and aimless cycles of creation and destruction,
    bubble and burst, of financialization.


    Major Sadiq Khan''s recent London Plan calls for the provision of permanent spaces
    for artists is an indication of the problem than its sign of density.⁷ The peculiar
    provision of such spaces echoes the exceptionality that art still monopolizes
    in practice poisoning it at the roots, since it entails the creation of special
    protections for existing studio spaces and thereby imposes requirements on art
    to do something in return for its permission to exist. The studio as the space
    of a practice distanced from the rest of life seems to be facing extinction either
    because it''s unsustainable, it now lies too far from home, its occasional possibility
    of fulfilling the terms of its conditions overwhelms practice altogether. But
    if the gulf between ecstatic wombi-like isolation and today''s developer-fantasised
    spectacular performances seems too great to return art to their common denominator
    or outcome, it is inevitably a secession from these models that is wherever actually
    feel art is taking place. This truth is as enlist the short-lived nature of autonomous
    art to relocate it safely away. Capitalism''s unending production and destruction
    of space has made the physical auspices of art''s production, and those spatial
    evolutions likewise driven a transformation of artistic practices and vice versa.
    The habitation of available spaces or conduits of production can be said to condition
    the dialectic of art''s relationship to the social world as we artists'' opportunistic
    festation of niches of survival. That process has been converted into the paradigm
    and lubricant of spatial prospecting finally mean that, as with the burning of
    the earth''s carbon resources, like life now is ever more unsustainable. Yet as
    we are starting to see, the cannibalization of art by capitalism encounters with
    vagrant aesthetics and planetary dispossession that cannot unite against the very
    forces that condemn them to a plading nomadism or pony servitude.


