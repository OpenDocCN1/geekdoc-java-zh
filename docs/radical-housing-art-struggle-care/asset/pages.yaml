    about almost everything involving current international Italian politics.


    For Mustafa, attracting middle-class families to visit the MAAM is actually a
    strategy to consolidate Metropol''s permanence in the neighborhood. Others in
    the squat his view, aware of the need to be perceived as a respectable social
    and cultural struggle, and not just squatting illegally. Taking into account that
    Metropol hosts a high number of Roma people, always affected by stereotypes of
    incivility, dirtiness, and unruly behavior, this desire is understandable. Not
    everyone has the privilege of refusing respectability as a bourgeois value while
    they are constantly subjected to marginalizing stereotypes and depicted as savage.
    From this position, the art inside the squat is a legitimizing instrument for
    their housing struggle.


    If Salini are to comply with De Finis''s proposal of giving Metropol to the squats
    would certainly solve their immediate need to have a house. Would it represent
    a sustainable model for affordable housing in Rome? Would it stop any of the macroeconomic
    urban development processes due to which people did not have a house in the first
    place? Would it contest the involvement and responsibility of companies like Salini
    Impregilo and their speculative practices in the existing housing problems of
    the city? Moreover, finally having a house with all legal protections does protect
    some of these squatters struggling alongside the broader housing social movements
    in Rome? This last question is an essential part of the paradox of housing within
    an existing legal system that privileges the status of private over communal property.
    In this context, fighting for the legal status of squats is both necessary in
    the short term as a solution to their housing problem, and in the long term, a
    limit to their movement of production of the commons. Arguably, achieving legal
    recognition for squatted properties cannot stop the macroeconomic processes of
    capitalist development. And while many squatters be aware of this, they are also
    on the predicament of securing a living space; a need that cannot be endlessly
    postponed if when there is a chance of achieving some form of legal recognition.


    Chatting with the squatters, and people involved in BPM and the broader housing
    struggles of the city, one is left with the impression that there are almost as
    many versions about Metropol/MAAM what is supposed to do as a political, artistic,
    and social space as there are people involved in it. But is this variety of opinions
    an obstacle for the project of constructing the commons that the squats are involved
    in? Or rather, how are we to understand the commons in order to make place for
    plurality? The final section of this essay proposes that the performative nature
    of building the commons happens precisely in the dialogue space of irreducible
    differences of those coming together.'
