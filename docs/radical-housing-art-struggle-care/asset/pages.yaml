    The pop-up studio is therefore: ''a very vexing thing of metaphorical subtlety
    and theological perseverance.''62 Behind a smokescreen of community it puts a
    young, precarious, flexible demographic to work as quiling managers, ''trusted
    middle persons'',61 Their agency from the point of view of local government is
    that they stage which the public government is usually bound to provide services
    to. This trusted middle meets interests which are closer to those of developers
    and international investors than those of artists or the community whose name
    the spaces created.62 The pop-up people are the front of house and community liaison
    for a back room that is selling off the entire house.


    Now that pop-up retail is norm, it is easy to forget the form''s origins as a
    local authority strategy of allocating properties by managing them to temporary
    housing or community. Throughout the 1970s short life has been both means of alleviating
    housing need, and meeting demands for space a wide range of emergent community
    needs in the face of local authorities ''squandering of empty and decaying public.''63
    The pop up represents some sort survival of the studio situation for artists and
    also the short-life strategy (for those who end up refusing the instrumental orders
    imposed upon them).64 Through the intensification of property guardianship schemes
    after the 2008 property market crash many artists operated live/work studios in
    former local authority housing. It is in such a situation that photographer, Rab
    Harling, turned eyes on the artist and his activist proclivities towards the peculiar
    public-private arrangements which had led to the eviction of both tenants and
    landlords previously living on the estate. At the Balfri Tower, artists and residents
    worked to expose and block two particularly public art works synonymous with the
    excesses of public art in regeneration.65 Public art commissioning agency, Artangel,
    and since new major


    offers a depiction of the personal and professional characteristics required to
    become a pop-up shop practitioner, and begins the line "Pop Up People: are entrepreneurial,
    even if their project is more than community she concerns."66 Thompson, quoted
