    Just like art, thought itself lays bare geography. The art of housing struggle
    has historically been theorized most often from the perspective of the Global
    North. Knowledge production determines the vocabulary and grammar of the art of
    housing struggle, which until now has reflected the established Global North/South
    division.6 That''s why it is important to approach knowledge production from another
    geographical point of view: from peripheral geographies. How to think the art
    of housing struggle from perspectives that were never allowed into so-called universalism?
    My answer to this question would be to adopt a Global East perspective.7 Since
    we have always been marginal to debates but influential when it comes to art,
    I make a case in housing struggle for the vantage point of this peripheral geography8


    # Development-led Art


    +   * I participate


    +   * You participate


    +   * He/She participate


    +   * We participate


    +   * You participate


