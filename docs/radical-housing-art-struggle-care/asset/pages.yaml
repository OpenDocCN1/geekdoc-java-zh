    When becoming artists in collaboration with Vila Autódom in 2017, we have experienced
    a complex situation in which we could perform a series of questionnaires, facing
    contradictions of working in art and regeneration, cultural practice and resistance
    against neoliberal destruction of communities and modes of living. As said in
    literature we follow, "complexity forces us to push the limits of our usual methodological
    procedures,"6 and yes, here we have found conditions that forced us to push and
    enter, in which it was inevitable to work artistically without the same time engaging
    in alliances, values and images of the site and the people we invited to collaborate.
    As we develop further, the invitation was to help replicate the memory of the
    struggle, in creating a tool that could spread out the narratives and the value
    of for, that seems since we seek, as artists, to nurture political intimacy with
    the militant investigation.7 Vila Autódromo community, stressing out the idea
    that only a bourgeois produce art or meant produced by the market, created complexes
    for cultural production and resistance in a situation of complete abandonment
    by the state. Around the lake of Jacareapagua, Vila was occupied in the 40s by
    families of fishermen and a very fisherman who constructed the Autódromo (racetrack)
    site, which gave that name to the community. During the 1960s, no housing for
    middle and up class was built in the area of Barra de Tijuca, but no housing for
    the workers has ever been build.8 Vila''s occupation became the home site of many
    of these workers, and in the 1990s, it was made legal with a concession of ownership
    of the land given by the governor of the state of Rio. In recent years, in the
    context of the mega events, that concession was renewed to an agreement made by
    the state and the mayor of Rio, easing the negotiation with building companies
    who wanted to profit the mega event. Vila is the closest neighborhood to the Olympic
    site, situated in an area of growing land grabbing and speculation. Because of
    that, between 2012 and 2015, due to the proximity to the Olympic site, Vila Autódromo
    almost entirely evicted.


