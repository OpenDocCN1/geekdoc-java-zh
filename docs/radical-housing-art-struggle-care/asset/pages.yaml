    # Radical Housing Art


    The practice of treating housing struggles as a gateway, and the epistemology
    of dwelling difference allows us to access the multiple possible forms that radical
    housing politics can take, for the many, in everyday life.


    > Michele Lancione


    The art of housing struggle also happens in the (semi)autonomous combative corners,
    cracks, and grey zones of housescapes. Since the global housing crisis of 2007–8
    and its geographically uneven forms, the art of housing struggle has continued
    to engage with radical forms of knowledge production and interventionism around
    housing struggles and organizing with initiatives and housing movements. This
    can mean taking action against eviction, rent-based violence, etc.; the violence
    of housing commodification in all its intersection, class-belligerent, racialized,
    and gendered dimensions. It implies an art in one-to-one correspondence with the
    world, ''seeking to execute performative and ontological capture as art altogether''
