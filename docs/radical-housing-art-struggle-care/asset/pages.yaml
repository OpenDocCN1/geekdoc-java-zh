  md: 'Southwark Notes are a small network of researchers and writers who have been
    active in the North Southwark area of South London since 2010, exposing and actively
    protesting the social cleansing of the area. They post research on their popular
    blog southwarkknots.word-press.com which also functions as a repository of archival
    material of local urban struggles as well as a detailed look at the complicit
    role of art in the service of regeneration and displacement.


    You Should See the Other Guy are all womxn, queer led theatre collective led by
    Nina Scott and Emer Morris: multidisciplinary artists and housing campaigners
    working with London communities affected by displacement, gentrification, and
    social cleansing. Since 2015, they have been delivering embedded community theatre
    projects which work on the ground and on the stage to tackle housing injustice.
    They are community organizers as well as writers, directors, Theatre of the Oppressed
    practitioners, song makers, poets, set designers, and human rights practitioners.
