    # A Theoretical Approach to the Commons


    The commons is a performative practice of production of material, tangible conditions
    sustaining the life of the human body that in turn enable the production of an
    anti-capitalist subjectivity. Three interrelated dimensions characterize the production
    of the commons: materiality, subjectivity, and practice.


    As material production, the commons are concerned with human needs that depend
    on infrastructure and resource distribution, such as food, water, shelter, healthcare,
    education, labor, etc. In our historical present, there is no production of the
    commons that is not, at the same time, a struggle to protect or recover the material
    dimensions of life from the processes of neoliberal capitalism. It is to this
    material dimension of human life that Jean-Luc Nancy refers when asserting “the
    truth of the commons is property”¹¹². And it is with this material dimension of
    human life that Metropoliz’s squatters concern themselves. Shelter, or the right
    to proper housing conditions is their fundamental demand. But housing is never
    isolated from other material conditions that either hinder or facilitate one’s
    access to housing, such as labor. And labor, in turn, is inseparable from the
    conditions in which the labeling body operates and that determine its ability
    to perform such labor, such as housing, healthcare, education, etc. The multiple
    material needs that sustain the human body are inextricably linked, and therefore,
    there is a certain totalizing—'
