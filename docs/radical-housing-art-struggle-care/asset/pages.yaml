  md: 'Finis''s initial intention to convince Pietro Salini to donate the space to
    the squatters as a gesture of corporate charity is a strategy of survival. It
    is also evidence that his investment in the space is directly related to the existence
    of the art space. Regardless of whether De Finis is aware of the irony of his
    reference to the Venice Biennale and the increasing criticism that the art biennale
    model has received in the last few years as examples of art spaces that are co-opted
    by capital and funded by corporations¹, seems clear that thinking of the MAAM
    as such term implies that he is fully aware that the MAAM is a space with broad
    appeal in the art. As part of this appeal, political activism and squatting are
    selling points in the process, constituting experiences that certain audiences
    are eager to consume.


    For De Finis, taking towards the institutionalization of the art space is a positive
    and desirable strategy because it attracts public support for the MAAM and, indirectly,
    for the squatters. He proudly to me about national and local political figures
    and art celebrities that have visited the MAAM and been impressed by it, even
    “a former Minister of Culture”. Indeed, it seems that the story of a squatted
    factory full of artworks is appealing, as in time of my last visit to the site
    in January 2016, De Finis has secured a collaboration between the MAAM and the
    Rivoli Museum in Torino, one of the most important contemporary institutions in
    Italy. In 2018, De Finis was made director of the contemporary art Macro by the
    Roman administration of arts and culture, a position that he combined with the
    squat at MAAM. De Finis is not naive about the power that Salini holds over the
    squat and the art project, but the more consolidated and institutionally recognized
    the art project becomes, the easier it will be for the squat to survive. To his
