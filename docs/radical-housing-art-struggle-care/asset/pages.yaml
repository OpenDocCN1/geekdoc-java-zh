    More, placing Robinson as the protagonist of the neighborhood''s resurgence continues
    to erase the work (and artwork) of long-term residents.


    Frogtown''s gentrification was not simply a spontaneous process inaugurated by
    one artist but planned and produced. Soon after the opening of Nomad Art Compound,
    the city rezoned much of the area, borrowing from the ''creative class'' planning
    playbook. By reclassifying the neighborhood from manufacturing to commercial manufacturing,
    the city made mixed-use and retail development possible. At the same time, the
    city passed ordinances over the area to give police power to perform random searches,
    more discretion to judge activity suspicious, and a swift path to dissent and
    arrest neighborhood youth.


    The story of Frogtown''s gentrification is often told from the perspective of
    the pioneering artist. The pioneering artist serves to naturalize as blank the
    policies of dispossession, displacement, and neglect that have disadvantaged neighborhoods.
    Featured as the protagonist of the neighborhood, the artist''s perspective takes
    shape as the dominant perspective about the neighborhood: its history is erased
    and replaced with a fantasy of discovery. Finally, the artist serves to naturalize
    the material transitions of the neighborhood, hiding the politics beneath the
    shifts.


    # The Script of Revitalization


    Development catalyzes economic vitality and revitalization.


    The script of revitalization represents gentrification as beneficial to historically
    underserved communities. In the field of art, representations of revitalization
    constructs art as an import brought into historically disadvantaged communities—mostly,
    poor and working-class communities of color. This construction of art ignores
    and de-legitimizes homegrown artistic production. Embedded cultural producers,
    including community artists, street artists, conceptual artists, crafts people,
    sign painters, musicians, and are rendered invisible. Instead, art as arriving
    into a derived community in the form of white cube spaces and contemporary art
    spectacles authored by professionals.


    The script of revitalization relies on the perceived generous benefits of art.
    If art is an inherent social god, the arrival of artists and the services that
    artists demand are accepted as harmless and non-controversial. Thus, the discourse
    around revitalization effects the everyday needs of working-class neighborhoods,
    conceals the material impacts of gentrification, and discourages dissent. When
