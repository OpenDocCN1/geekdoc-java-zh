  md: '# ART IN THE INTERIM: HOW THE ISSUE OF THE RESTITUTION OF HOUSING IN REUNIFIED
    BERLIN LED TO AN ARTISTIC REIMAGINING OF THE CITY


    NICOLA GUY


    ...the Germans once again need a bit of glitter in their hovels.¹


    – Franz Hessel


    Berlin''s relationship to art and creativity is long-standing, with its position
    as a cultural city arguably secured in the Weimar period when it became a space
    of experimentation through the arts. Throughout history, the perception of Berlin
    as an artistic city has been pushed and used as both a disruptor and an agent
    of conformity, that it is only since reunification that Berlin has become one
    of the main centers of the western art world, over 400 galleries, the Berlin Biennale,
    Gallery Weekend and myriad other events and occasions that promote the contemporary
    market.² Conversations surrounding art’s complicity with the gentrification of
    Berlin are unavoidable, with good reason, as we see rents rise and more more people
    being displaced from their homes.


    Thinking back from the current perception of the city to look at the immediate
    period after the reunification of Berlin, we can look how the relationship between
    art and urban space was used as a strategy by which the city reimagine itself.
    This moment was marked by both uncertainty and as different individuals and groups
    attempted to make claims on the city, with the dilapidated housing stock of the
    center neighborhoods being particularly contested through the controversial process
    of restitution. Looking at examples of autonomous and institutionally organized
    exhibitions, the contribution to the changing face of Berlin will be examined,
    we can seek to understand how these use the period of restitution as a means for
    their intentions and the consequences of these efforts.


    The dissolution of the German Democratic Republic (GDR) happened quicker and more
    peacefully than had anticipated with the fall of the Berlin Wall in November 1989
    and the official reunification of the two Germany’s eleven months later in October
    1990. The period that followed was chaotic, uncertain and full of a unique kind
    of energy and excitement that was associated with the rebuilding of the country,
    with Berlin once again at its center. For some, this excitement was the myriad
    speculative possibilities for redevelopment, regeneration and the opportunity
