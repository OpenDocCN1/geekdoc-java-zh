    studies perspective that understands the construction of the commons as a performative
    practice has been missing from these accounts. To understand the production of
    the commons as a performative practice, we have to turn to a contemporary Marxist
    aesthetic approach through the work of Jean-Luc Nancy* and José Esteban Muñoz*,
    as well as Judith Butler’s theorization of ‘plural performativity’ that puts live
    at the forefront of politics’ within contemporary assemblage movements against
    neoliberalism. From such a perspective, it becomes clear that instances of building
    the commons cannot manifest as self-contained units, precisely because their nature
    is to hold a place for difference, staggering the persistent and inevitable nature
    of dependency in common.


    The construction of the commons is a performative insofar as it is realized/through
    the embodied behavior of those who come seeing collective groups of a good life.
    This performative practice is inherently plural and open-ended, but it is also
    embodied in specific actions and gestures that one can learn, teach, repeat, and
    pass on. It is a practice of the possible, which happens in gestures as some everyday
    sustained through a period of time. This practice shows a disposition to make
    common forms of life not only for collective survival but also thrive amidst the
    economic collapse*. The project of understanding the construction of the commons
    as a performative practice joins works in performance studies that look at the
    role of performance and cultural production in anti-capitalist struggles*. More
    broadly, understanding the construction of the commons as a performative practice
    speaks to the interdisciplinary scholarship that examines forms of resistance
    to neoliberal urban development and contemporary housing from various fields such
    as urban studies and social movements.


