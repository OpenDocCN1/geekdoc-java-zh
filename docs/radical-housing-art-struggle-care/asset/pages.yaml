  md: '# RADICAL HOUSING: ART, STRUGGLE, CARE


    Following Nancy, and Muñoz, we might ask: if capitalism enables the illusion of
    self-contained subjectivities, what kind of forms of the self arise from communal
    forms of property? Who is the proper of the commons? For Muñoz, this mode of being
    is available to us as sense, always necessarily entangled with the senses of plural
    singularities. The singular that Muñoz talks about is bound to sense its multiplicity,
    relational existence as simultaneously one and many. This is a singular self who
    knows of its unbreakable interdependence with others. This is the proper of the
    commons.


    It is in the essential link between the commons as material property, practice,
    and the formation of subjectivity where the radical potential of squatting lies,
    in general, and where the radical potential of Metropol/MAAM lies as a political
    project, specifically. Beyond the physical immedia of occupying space and claiming
    it for purposes other than capital accumulation, beyond the urgency of providing
    homes for the homeless, squatting is a performative practice of the commons, one
    that enables forms of solidarity guided by an egalitarian ethics. In these performative
    practices, material conditions and subjectivities constitute each other in ways
    not easily subsumed by the dictates of the capitalist (neo) colonial ordering
    of the world. The commons are a performative practice because they are an instance
    of world-making, or tangible towards living conditions perceived to be more than
    just the existing ones.


    The production of the commons in the sense that Nancy and Muñoz posit has account
    for incommensurability difference that neither subsum us nor it ultimate evidence
    of why different singularities cannot coalesce in common projects. This would
    be a construction of the commons that foregrounds the relational, makes place
    for that which we cannot do so. And with way in order to step into a neutral public
    space, open to the multie-ple differences of bodies that need different things
    in order to carry a livable life. But it so happens that one does not get to choose
    whom to construct the commons, one ultimately cannot do so. And yet the question
    remains of how to still nurture forms of communing which we enter from radically
    different perspectives and personal experiences, that Judith Butler posits as:


    The people you find in the street or the street in prison or on the periphery,
    on the path that still is no, or in whatever basement that the coalition is possible
    at the moment are not precisely the ones you choose. I mean, for the most part,
    when we arrive, we do not know who is arising, which means we accept a kind of
    unspoken decision to our solidarity with others. Perhaps we could say that the
    body is always exposed to people and impressions it does not have a say about,
    does not get to predict or fully control, and that those conditions of social
    embodiment are we have not fully brokered. I want to suggest that solidarity emerges
    from this rather than from deliberate agreements we enter knowingly. For Butler,
    what Muñoz defines as incommensurable is precisely the terrain of solidarity.


    When people come together in a project like Metropol/MAAM they do not simply get
    to start from zero, if their bodies and identities were not already constituted
    by power and'
