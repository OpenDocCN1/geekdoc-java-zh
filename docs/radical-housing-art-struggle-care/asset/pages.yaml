  md: '# Theory on Demand #42

    Radical Housing: Art, Struggle, Care

    edited by Ana Vilenika


    Housing space is a crucial locus of social reproduction, as it is a place where
    countless acts of care that sustain our lives take place. Yet, capital has forced
    its way into our homes, making them a battlefield. Art is embedded and intermeshed
    in housing struggles in multiple ways. The essays and stage scripts in this collection
    engage with difficult questions around battles for home, the role of the arts
    and the aesthetics of struggle. What connects the contributions is that radical
    housing is traced from both the internal and the external margins and from global
    and local peripheries. It is in this sights of resistance against housing precarity
    that radical housing is traced as it emerges, declines, and re-emerges on the
    way to our common future.


    Divided into five sections, this anthology discusses subjects like insurgent histories
    and radical care in art, hands-on strategies for action, fighting art-washing
    with tenants'' power, politics of the past and the future in the art of the housing
    struggle, effects of financialization on artistic live-work conditions, the necessity
    of morning losses, as well as the irreducible plurality of housing commons, holding
    one another accountable, and working with dirt. Launching a proposition on radical
    housing art, the book deals with common challenges and failures of practicing
    radical housing, expressing the beauty of art from the tragic to the joyful.


    Contributors: AHAAHHA, Josephine Berry, Alyssa Erspamer, Ioana Florea, Nicola

    Anthony Ives, Filip Jovanovski, Sylvi Kretzmars, Kristina Lelovac, Andrea S.

    Micu, Veda Popovici, Cristina T. Ribas, Lucas S. Icó, School of Echoes LA, Southwark

    Notes, Ivana Vaseva and You Should See the Other Guy.


    Printed on demand

    ISBN: 978-04-92302-78-6


