  md: 'In the case of Boyle Heights, selecting the galleries as the initial targets
    of an anti-displacement fight proved to be strategic. We can synthesize much of
    what we learned in the context of this struggle into four central lessons. First,
    expose the cracks in criticality. There exists within contemporary a longstanding
    interest in various forms of anti-capitalist and identitarian politics. These
    critical predications can be used for political leverage. That is, if an art institution
    builds its brand on notions of criticality, radicality, queerness, intersectionality
    or even levels of diversity, inclusion, or communityเยี่ยม, movements can more
    easily lose their legitimacy in question when their positions contradict the consequences
    of their actions. When the community pull back the veil on the critical aspirations
    of an artwashing project, they undermine the cultural and social basis upon which
    such an institution depends. How long can a cultural institution claims to be
    inclusive of community interests, or claims to advance radical or critical ideas,
    and so on, when its neighbors challenge that institution or perceive its own terms?


    Second, speak through the media. The proximity of contemporary art galleries to
    cities provide ample opportunities for press coverage. Proximity to media allows
    a fledgling anti-gentrification movement to create a powerful media narrative
    with a capacity to change prevailing political commons. The presence of freelance
    producers, curators, writers, and photographers within the artwork means that
    when there is direct action as a picket-line or a blockade, artists guarantee
    press coverage. That coverage can appear in trade publications like Hyperaller
    and Artforum as in general outlets such as the LA Times, NPR, Newsweek, or the
    Guardian. While widespread press coverage does not guarantee a movement''s victory,
    it accelerates its conditions for success. Media attention addresses the moral
    crisis of social cleaning, transforming a local struggle into a national issue.
    It opens the possibility of crafting a new consensus understanding of the issue,
    thereby creating the political conditions for victories or major concessions.
    Solidarity gives people with little opportunity to distribute their analysis as
    a means of speaking through the media to a larger audience.


    Third, boycott forces artists to take a position. Galleries would not continue
    to exist without the ongoing consent of artists who show their work in them. Neither
    would galleries survive without the artists and preparators who provide material
    for exhibitions, the artists who generate press, the teams of staff who keep institutions
    running. When an anti-gentrification movement persuades artists, in particular,
    to boycott galleries and pull their artwork from those galleries, the demands
