    movements, the protagonism of resistance must always be the subject position of
    the poor who stand to lose everything due social cleansing, whether gentrification
    benefits interests or the landlords or entrepreneurs within the community itself.


    Our analysis of gentrification must never lose sight of its effects: displacement
    and replacement of the poor for profit. The central impact of arts-oriented development
    is displacement. A neighborhood that becomes a destination for one population
    becomes a site of dislocation for the poor. In the absence of local protections
    that prioritize stable communities over the ability of landlords to turn a profit,
    tenants are displaced through increases, eviction loopholes, harassment, renovictions,
    Mickey Mouse pairs, or cashforc schemes. Unhoused tenants in alleys, parking lots,
