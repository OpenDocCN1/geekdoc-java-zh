  md: '# RADICAL HOUSING: ART, STRUGGLE, CARE


    Certainly, the existence of the art space has been taken into consideration by
    the construction business. Pietro Salini, the business mogul and CEO of Salini
    Impregilo, has summoned Giorgio De Finis to his luxurious office located in the
    city center next to the Fontana di Trevi. De Finis recalls the details of that
    meeting:


    “What we are going to do with Metropol?” he asked. And I looked back at him and
    I said: “What we are going to do with it?” And then he asked me whether I would
    accept keeping the museum intact and all the art in it and my place as a curator,
    but just evict the people whole. And I said, without the people, the museum means
    nothing. Precisely what makes it different that it is a museum, and a homefor
    who doesn’t have a home. And it’s both things. That’s what I told him. Because,
    you know, these artworks have emerged as a response to the situation of the squatters’
    inhabitants, and they don’t make sense out of this context. And I said, “you know,
    the sad thing is that you if you evict three hundred people, nobody cares, but
    if you destroy an art space, then everyone cares because you look like an animal
    that doesn’t appreciate culture. I mean it is, but it is also our biggest advantage.
    In the end, we didn’t reach any agreement, and we upheld in polite terms.


    In opposition to Salini’s idea to evict the squatters and keep the MAAM, De Finis
    proposed an alternative: the Salini group would want some money into the spaces
    and donate to their inhabitants as a sort of altruistic project for the city.
    According to De Finis, this would incidentally be a great benefit for the Salini
    Impregilo image. He tells me that he assured Salini that they could do something
    better than the Venice Biennale’. Of course, he admits that letting the squatters
    stay be a delicate matter, because it would create a precedent in a city like
    Rome with many occupations and squats, strengthening the modelled and artistic
    value is more likely to avoid eviction.


    Salini’s plans for the old factory have never aligned with Giorgio’s proposal,
    but in the last few years he has perhaps become more aware of how the art inside
    MAAM might boost the value of his real estate. Upon filing a lawsuit against the
    squatters and going to trial in 2016, Salini’s attorney stated that they intended
    to keep the art after the eviction of the squatters. And yet, much to Salini’s
    chagrin, and due to the indecision of the Italian state to enforce the eviction
    and deal with the unpleasant consequences that might come from it, the museum
    has far succeeded in protecting the squat. Eventually, Salini also used the Italian
    Ministry of Interior for failing to enforce the eviction and allegedly damaging
    his property rights. In July 2018, a Roman civil court decreed that the him are
    yet to be paid at the time of this writing.


    Court decisions aside, Giorgio’s needs to at least sit and talk with a conglomerate
    like Salini Impregilo points to one of the limits of the squat as a radical practice
    of sovereignty. This limit is marked by the constraints imposed by existing land
    property laws in Rome and the power and political influence of Salini Impregilo.
