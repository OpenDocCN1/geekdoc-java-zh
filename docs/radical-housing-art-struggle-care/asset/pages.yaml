    # Three Scripts of Gentrification


    Since 2012, School of Echoes Los Angeles has conducted militant field research
    on the agents of gentrification and forms of resistance to it. Contrary to purely
    academic approaches to the problem of gentrification, the collective has consistently
    tested its analysis in political action. Those actions with tenants rights workshops
    in the Echo Park neighborhood. The scale of the intervention shifted dramatically
    in the Summer of 2015 with the founding of the L.A. Tenants Union, an autonomous
    tenants movement for resisting social cleansing and building tenant power.⁴


    Over the last five years, the L.A. Tenants Union has taken on dozens of battles.
    The union has organized building-based tenants associations and neighborhood tenant
    union chapters, or locals. One of the early struggles led by the Union de Vecinos
    Eastside Local of L.A. Tenants Union was a fight to stop the encroachment of gentrifying
    businesses in the Boyle Heights neighborhood surrounding the Pico public housing
    project. A primary target of that campaign was a growing arts district.


