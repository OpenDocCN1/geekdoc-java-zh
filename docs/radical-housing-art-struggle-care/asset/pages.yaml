    THEORY ON DEMAND


    the very forms of domination that they try to leave behind. The potentiality of
    the commons resides in the simultaneous coming together in essential difference
    that is marked by existing behaviors, practices, and discourses, but it also resides
    in coming together to undo neoliberal relationality and to make anew what is being
    together. The project of being in common is thus the open-ended process that starts
    from this paradox.


    The practice of common happening at Metropoliz/MAAM, the irreducible plurality
    of experiences, and the encounter of radical differences among the squatters is
    the very fabric from which the commons emerge. This approach to understanding
    the commons emphasizes process over results, suggesting that practices of common
    such as the one happening at Metropoliz/MAAM have value their immediate results.
    A practice is constituted by that we make and remake, and in turn makes us carried
    through a period of time, learned and taught to each other. They can also be transformed
    to adapt to different circumstances and needs. What practice is learned and remembered
    by the body, shaping who we are through the slow sedimentation of repetition.


    Practices of common are stored and remembered by bodies and can therefore travel
    beyond the immediate project of squatting a particular property. If even Metropoliz/MAAM
    is demolished and transformed into apartment buildings by Salini Impregilo and
    its dwellers evicted, the potential project of their the commons will not be unfinished.
    For Metropoliz/MAAM dwellers, the real project of building urban commons is not—or
    not only—the squatting of a former industry, the embodied learning process that
    they have experienced together. This is a practice that they could take somewhere
    else, other time. It is a practice that can live despite the eventual cranes and
    excavators that might transform their commune into apartment buildings for the
    sake of capital accumulation.


