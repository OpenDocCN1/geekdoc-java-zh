  md: '# RADICAL HOUSING: ART, STRUGGLE, CARE


    The first section, Insurgent History and Radical Care, starts with The Land of
    Three Towers, a theatre performance script by the London-based theatre group You
    Should See the Other Guy. Their script tells the story about the occupation of
    Carpenters Estate E15 Mains, a group of young mothers threatened with eviction,
    who ran the tower block as a social center for two weeks. This play is about preserving
    the history of this struggle and sharing experience with those in London that
    fight housing regeneration. The second essay, ''Against disappearance: A partial
    chronology of Vila Autóromo''s resistance against eviction'', seeks to underline
    care as a political practice in the art of housing struggle, by elaborating care
    and its capacity to displace power. Cristina Ribas and Lucas Ico''s project on
    Vocabulary in the Movement was built with the residents of Vila Autóromo, who
    have been resisting eviction in Rio for many years. Their writing of the insurgent
    history reveals care as the practice that gives tissue to collectives in the coherence
    of self-care, care for the family, care for the neighborhood, and for surroundings
    and nature.


    The first text in the second section, Fighting Artwashing and Building Tenant
    Power is by the Southwark group from south-east London, which has been organizing
    and writing against gentrification in their area for more than twenty years. In
    their essay, they give an insight into the struggles against social cleansing,
    including artwashing, from the messy perspective of the struggle itself. In their
    contribution, they ask difficult questions and look at the complicated decisions
    made across many local groups and campaigns in the fight against artwashing and
    for the right to a home. This is followed by a contribution from the Los Angeles
    School of Echoes, ''Flipping the script on artwashing: Gentrifying friction with
    tenants'' power, ''a multi-racial and cross-generational collection of local groups
    and organizers, teachers, and artists dedicated to tenants'' Hegemony in their
    hometown. They tease out three scripts used in art-oriented development and consideration
    to flip these scripts through tenant power, based on their own experience on the
    ground. This is followed with the text ''Hegemony and Social-Engaged Art: The
    case of project Row Houses, Houston, Texas, USA'' by Alyssa Esper, which starts
    from the marginal to modernity concept(s) of hegemony to discuss the Row Houses
    social art project created by US artist Rick Lowe. Espramer tackles hegemony mechanisms
    for the current hegemony and counter-hegemonic potential of art.


    The section Politics of the Past and of the Future continues with the article
    ''Complicities, solidarities and in between. Art and political engagement in the
    housing movement in Bucharest and Cluj.'' Ioana Florea and Vera Popovic write
    from the complicated position of activists, artists, and theorists alike walking
    the line of solidarity with the dispossessed in housing struggles, mostly Roma
    people, and their (un)wanted connection with the real-estate market. By focusing
    on the 1989-period and the emergence of a new class of restitution landlords,
    they reveal how art projects prepared grounds for an enduring housing movement
    still active today. ''Art in the Interim: How the restitution of housing in unified
    Berlin led to an artistic reimagination of the city'' develops an important insight
    into the phenomenon of interim housing during the periods of crisis and the so-called
    transition to post-socialism. In this focusing, Nicola Guy looks at vacant buildings
    under restitution used by the producers of autonomous and institutionalized art
    exhibitions, after the Berlin Wall fell in 1989.'
