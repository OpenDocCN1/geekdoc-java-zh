  md: '# RADICAL HOUSING: ART, STRUGGLE, CARE


    isolation,³34 as Marina Vismidt and Kerstin Stakemeier describe it, must be overcome
    if we are to understand its potentials and pitfalls. It emerges in a complex network
    of actors housing-related fields from art, the non-profit sector, the state, the
    private sector, and different social and housing movements. Relations between
    these various actors have significantly shaped and complicated the mapping, scope,
    and effects of the radical housing art practices. These art practices and their
    field are not static or fixed. They have their own dynamics, and it is therefore
    important to assess them in relation to social, political, economic, and cultural
    developments on any ongoing basis. They are dynamic and processual, and their
    constellations change over time and space. If an art practice functions as radical
    housing at one moment, this doesn''t mean the same will be true when the constellations
    have changed. That is why it is important to allow the process of communal becoming
    to teach us. Radical housing art has its common challenges and common failures,
    and the role of all of us who fight for homes is to hold another accountable,
    as well as remain aware of the beauty of art that moves from tragic to joyful.


    # Thinking Housing Collectively


    > At its core it is radical humility and making ourselves vulnerable to each other,
    listening in more ethical ways, overcoming our fear of asking questions, and being
    OK with not knowing the answers.³⁵


    — Patricia DeRocher


    Though I knew from some before it, many of the contributors to this book at the
    Art and Housing Struggles: Between Art and Political Organizing conference, which
    I co-organized with Elena Marcheva and Chris Jones at London South University
    in June 2018.³⁶ This conference had two main focuses: global and local. It set
    out to ask difficult questions about the place of art in the housingscape and
    its role in ongoing battles worldwide. With the session with papers, the conference
    included workshops by people whose work was formative to me. Nebojša Milkić and
    Zlatia Kosti organized a workshop where we all took part in collective reading
    of their piece, I Sued My Self. Dont Vinh, sound artist and popular educator,
    gave a workshop where we invited participants to reflect on their experiences
    with gentrification violence. This workshop introduced a framework for transforming
    experience into an investigation that takes action in the world, based on his
    work with the School of Echo Angeles forming the L. A. Tenants'' union.


    London South Bank University is in dangerous proximity to Elephant and Castle
