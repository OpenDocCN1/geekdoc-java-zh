  md: 'something opposed to the ideal of autonomous act cherished by the cultural
    elites of the time. Unburdened by aesthetic concerns, this art turned towards
    political intervention, towards participation in a ''spontaneous ideology of radical
    interventionism in cultural, social spheres of Yugoslavia society.''30 This artistic
    and political dissent allowed artists-amateurs to ask questions that are not usually
    asked. Such is the example of the short documentary film from 1971 entitled Black
    Film by Žimir Žlinnik. In the middle of the night, the camera follows Žlinnik
    in the town of Novi Sad where he encounters a group of homeless lumenproletariat.
    Contrary to the official narratives in Yugoslavia that claimed there is no homelessness,
    this film shifts light on this issue as Žlinnik offers these people to stay in
    the two-bedroom flat with his. With the disappearance of Yugoslav cultural infrastructure,
    radical amateurism became a rare phenomenon. Thus, today we can no longer speak
    of radical amateurism as an alternative culture, but we can speak of radical art
    as form of access, as day-to-day resistance from margins and an element of a movement
    culture (if such a thing does exist).


    Building on Michele Lancione''s invitation to expand the radical housing politics
    by including more activists and creating creative methodologies,31 I propose the
    radical housing for art made by tenants and communities and also for experimental
    practices that take part in producing radical housing politics against and the
    development(alist) matrix. Lancione advocates for radical housing ''as a gateway
    to challenge wider structures of violence, including patriarchy, racial, class
    exploitation, and, course, deprivation of shelter.''32 Radical politics is not
    an exclusive product of Westernized masculine movements with grand narratives,
    but acts of subversion at the level of everyday practices and generative power
    of radical movements that take desperation seriously; desperation as political
    in itself.33


    Struggle has been central to the politics of radical housing art, by means of
    histories which have been reclaimed from below and new infrastructures of culture
    have been built beyond the valorizing structures of art world, accompanied by
    awareness of multiple futures. On this journey, art is an important tool in thinking
    about new ways of living and relating to housing and mobilizing against housing
    displacement. Radical housing art practice also raises questions about whose art,
    and although it has been unable to change the globalized art world, it has managed
    to create temporary spaces where it is the people''s art counts.


    However, radical housing is not an isolated practice, and the method of categorical


