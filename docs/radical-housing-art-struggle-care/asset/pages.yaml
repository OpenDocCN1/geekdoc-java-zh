    # METROPOLIZ/MAAM: THE PRACTICE AND AESTHETICS OF THE URBAN COMMONS IN ROME, ITALY


    # ANDREEA S. MICU


    On 28 March 2009, an ethnically diverse group of people affiliated with BPN, or
    Blocchi Precari Metropolitani¹ a Roman housing activist group, forced the locks
    of industrial space via Via Prenestina 913, in the working class and immigrant
    area of Tor Sapienza. The group included Moroccans, Tunisians, Eritreans, Sudanese,
    Polish, Peruvians, Dominicans, Ukrainians, and Romanians, mostly unemployed or
    precariously employed first-generation immigrants who could not have access to
    rent or buy property in the post-2008 Roman real estate market. The squat was
    named Metropoliz. In the following decade, Metropoliz has become not only a home
    for over three hundred people or the first housing occupation in the city that
    brought together Roma people with other ethnic groups, but also a burgeoning art
    space known as MAAM (Museo dell''Altro e di Metropoliz, and the Museum of the
    Other and the Elsewhere).


