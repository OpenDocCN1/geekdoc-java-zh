  md: 'Since several School of Echoes members are members of the Union of Vecinos
    Eastside Local, our collective had an insider''s view of the Boyle Heights conflict.
    It has been written about that struggle. It continues to raise crucial questions,
    not the least of which for artists. For School of Echoes, the battle against gentifying
    businesses in Boyle Heights greatly advanced our understanding of how gentrification
    works and the ways that communities can defend themselves against it. The aim
    of analysis must be resist social cleansing and to defend the empowerment of poor
    and working-class communities in all their complexity, creativity, tradition,
    and agency.


    Fundamental to an analysis of gentrification is the contention, that a natural
    or inevitable process, gentrification is purposefully produced. Rather than a
    moral problem to be solved by changing individual behavior, gentrification is
    a political problem which must be resisted through collective action. Furthermore,
    resistance must respond to the needs of poor communities and never undermine their
    autonomy, that it must occur within and alongside the long-term processes of organizing.


    With the tenant movement as our classroom, we come to understand that real estate
    speculation depends upon what we call the three scripts of gentrification. These
    scripts function in a broad range of gentrification processes, whether the focus
    is on transit-oriented development, or development that instrumentalizes tourism,
    entertainment, new technological industries, historic preservation, etc. The scripts
    used by elite capital remain remarkably consistent. First, there is the image
    of the agent of gentrification as a pioneer or protagonist in the grand narrative
    of urban change. Second, gentrification depends upon representations of revitalization
    to counter or erase the consequences of social cleansing. And third, since it
    is presented as a public good, gentrification requires public investment in the
    form of planning support, tax incentives, zoning changes, and publicly-financed
    infrastructure.


    In blunt terms, the three scripts of gentrification entail a protagonist, propaganda,
    and public policy. Like a Gordian knot, all of these scripts require each other
    in order for real capital to reclaim neighborhoods and cleanse communities without
    sparking riots and mass disruption. There is no public policy without the image
    of the heroic entrepreneur and urban pioneer. Without the discourse of revitalization,
    the gentrifying protagonist is exposed as a selfish opportunist. In the following
    sections of this essay, we will review the three scripts in resisting arts oriented
    development, or to the more common expression, art-washing.


    # The Script of the Urban Pioneer


    When I came here, no one was here.


    The urban pioneer script presents gentrifying entrepreneurs as a spatial vanguard,
    leading the way from historic dis-investment to development. Importantly, it includes
    a subjective investment that speculators and entrepreneurs have in the effects
    of historic disinvestment. It''s the love of the empty warehouse as a blank slate.'
