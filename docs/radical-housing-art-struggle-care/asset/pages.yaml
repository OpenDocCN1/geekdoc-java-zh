    in the Rahova-Uranus neighborhood in Bucharest with the aim documenting experiences
    of evictions and gentrification. See more in the section ‘The Generosity Offensive:
    artists bringing or resisting gentrification’.

    2 Ioana Florea, Agnes Gagyi and Kerstin Jacobson, Contemporary Housing Struggles:
    A Structural Field of Contention Approach, Palgrave, forthcoming 2021.'
