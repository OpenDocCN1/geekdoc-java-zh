    # 2. Evicting the Ghost: Evictions Happening Here and Afar


    In 2010, just as the Rahova-Uranus community began to organize more and more strongly
    against evictions while experimenting with educational and artistic tactics, Bucharest’s
    contemporary art scene welcomed the launch of the book Evicting the Ghost. Architectures
    of Survival.¹³ Produced by a mixed team of artists, architects, and sociologists,
    the volume is an analysis of the shelters and shacks created by evictees after
    losing their homes to restitution.


    The years leading up to the launch were arguably the period when improved shelters
    of evictees had been the most visible in the city. Scattered generally around
    the city center and of temporary nature, these shelters and makeshift shacks have
    been used as both housing and means of protest by the evictes.


    The volume follows the processes of restitution and traces its historical context,
    including information on the legislative history and a series of case studies.
    Its starting point is an architect’s amazement in encountering a makeshift shack
    of an evicted family while randomly walking the streets. The book’s approach establishes
    a clear-cut distance between the architect/artist/researcher and the evictees.
    The editor puts: ‘a distance specific to scientific atlas’


    The makeshift shacks became the central motif of the volume comprising several
    researchers'' contributions and illustrations. The homes themselves were located
    with a romantic gaze, considered ghost-homes. Although including direct accounts
    of evictees, there was no analysis on the implications of gentrification, neo-liberal
    urban transformations, or the hegemony of property. There was not any recognition
    of the political character of the


