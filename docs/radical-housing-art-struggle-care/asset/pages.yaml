    and identity.³ Its similarities with institutional frameworks have led to its
    projects being an ''NGO-style.''⁴ Intersecting both politics and art, socially-engaged
    art is a fertile ground for hegem


    The concept of cultural hegemony from Marxist philosopher Antonio Gramsci. Gramsci''s
    reflections on the communist revolution in Russia is compared to its failures
