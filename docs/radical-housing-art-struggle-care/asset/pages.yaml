    appeared to be the end of a large and diverse protest campaign that brought the
    Esso Houses, gentrification processes in St. Pauli, and the resistance of local
    residents, artists, and activists to the attention of people all over Hamburg.
    What will be when the Esso Houses vanish? That afternoon’s interview responses
    are not aggressive, nor they provide in-depth analysis of the gentrification issue.
    They are repetitive, they speak to a heart, they are deeply sad, sometimes sentimental
    and whining; they have their justifications. Interviewees become irritated, they
    hit a nerve, they build their own poetry.


    What happens if we amplify the loss? What happens if amplify helplessness? If
    we DEMONSTRATE the failure, the futility, of a political protest? As a mourning
    machine, the Megaphone Choir tries to differentiate between grief and resignation
    in this situation. It is an attempt to deal with the failure of a political initiative
    collectively, instead of being separated and isolated by its failure.


