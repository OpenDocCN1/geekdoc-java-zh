    by the Apple Macintosh from 1984. Turing’s universal machine was to produce a
    new spatial topology in which art can pass as – be mistaken for generic labor
    within the cybernetic society. To the casual observer, computer use by artists
    is largely indistinguishable from that of a service worker, journalist, architect
    or engineer. The conceptual techniques of the 1960s were eventually reassembled
    in the 1990s network studio and the figure of the immaterial labor. The isolated
    studio does not necessarily move position but becomes increasingly networked by
    technologies, services, changing terms of building insurance, health & safety
    precautions, and the further development of financial claims which feed the growth
    of tertiary industries and bureaucracies. The artist in the network studio responds
    to the limits breached by their predecessors who collapsed the divisions active
    in wider society, and in the first wave, overlapped significantly with the DIY
    community spirit of the open studio. The network studio camouflages itself in
    a manner of guises be that the office, the artist’s loft, the hacklab, social
    center, cybercaf or simply the portable laptop. We can therefore position the
    network studio as an uncertain, deceptive and possibly anxious relation to build
    space. This can be connected to a double movement, identifiable in its brief history,
    of artists occupying spaces that advertise their infrastructures and dissolve
    them within the shell of the city.


    The networked studio in its most extreme form is the mobile phone that the infonaut
    carries with them their connection to the network. The early network artist affirmed
    spatial precarity as digital nomad like it was a blessing. This 1995 affirmation
    of the network as a replacement of fixed relations tended towards the production
    of singular, albeit hybrid spaces (e.g. London’s Backspace, Ljubljana’s Ljubmila,
    New York’s Rhizome, and Zagreb’s MaMa), in which artists built assemblages of
    hard- software and merge theawning universal space/time of the internet. The network
    studio provides a place to turn into and amplify an increasingly chaotic out.
    The most iconic example of this was perhaps the Makrolab (1994-2007), devised
    by the Slovenian artist Marko Pejan, who grew up in non-aligned Yugoslavia listening
    to CB radio and transposed the experience of remote and isolated listening to
    the noise of the information age. The Makrolab was a mobile communications hub
    that looked like a space-pod and moved between ever more isolated places gathering
    the public and monitoring the often secret or invisible telecommunications exchanges
    of incentient globalization.


