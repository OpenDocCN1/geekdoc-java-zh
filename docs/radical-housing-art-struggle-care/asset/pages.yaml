  md: '# RADICAL HOUSING: ART, STRUGGLE, CARE


    Art is embedded and intermeshed in housingsscapes in multiple ways. The mutation
    of art into life coincides historically with gradual assimilation of the home
    – previously experienced as a semi-private, semi-sovereign space for the reproduction
    of life – into capital and the extractive stage. Though art and the question of
    housing issues have always intersected, in contested spaces of the struggle to
    find an outlet for self-expression, create community spirit and express disagreement,
    solidarity and call to mobilization, a people''s art has depicted what communities
    struggle went through. Art makers, whose practices are long-term investment in
    sight of political and social struggle openly sighed against land and housing.


    Yet, a distinct art of housing struggle became in vacant spaces that appeared
    in the transition from a Fordist to a Post-Fordist model of housing and wider
    spatial production. Some artists moved into studios, homes and other spaces abandoned
    in the ruins of industrialization, while others turned back on crumbling urban
    environments and settled in rural communities. Artists eventually became significant
    spatial actors, recognized as not only within the art world but also in urbanism
    and real-estate development. This led to a long and complicated history of struggles
    for artistic and reproductive autonomy, struggles against dispossession and artistic
    or cultural appropriation by the state, elements of social elite or real estate
    developers.


    In recent years, interest has increased in the relationship between art and housing
    crises. Scholars, policy makers, artists, and activists have begun to address
    the question in new ways. Meanwhile, many thousands of messages have been exchanged
    on social media networks debating the issues and contradictions of art in housing
    struggles. These debates bear witness to the ever-greater difficulty of separating
    struggles for housing decent (where one''s or other people''s or on a wider collective
    level) from the question of art production in mutations between art institutions
    and real estate. The state of art in housing struggles is always someone''s home,
    always potentially one''s. This is precisely what makes it messy and so connected
    to life. This is why the art of housing struggle incessantly generates politics:
    one another, an endless series of passionate calls to choose a side.


    Shelter-in-place, self-isolation, stay-at-home and quarantine orders as default
    responses to the COVID-19 pandemic have only augmented the crisis by bringing
    housing and health care infrastructure in proximity. Multiple housing crises have
    affected both the production and reproduction of art producers. As working conditions
    have become increasingly precarious, access to housing, particularly in large
    cities, has also dwindled, with direct consequences for the artistic practice
    itself. Artists are expected to draw on their supposed cultural capital to solve
    the housing crisis, or live and work by collaborating with the leading (parasitic)
    agents of regeneration, tension, or colonial modernization. In parallel, artists
    have formed alliances with oppressed groups, acting as


