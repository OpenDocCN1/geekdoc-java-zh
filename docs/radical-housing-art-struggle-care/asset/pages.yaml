  md: '# RADICAL HOUSING: ART, STRUGGLE, CARE


    We amplify a form of speech that was intended neither for public announcement
    nor statement. Statements, thoughts, and fantasies of people who would never talk
    in front of a crowd were developed into dialogue, in the situation of an interview
    — face to face. Even though some of the interviewees were politically active in
    Hamburg’s Right to the City, or in the Esso Houses Initiative, they spoke for
    themselves in the interviews. Often, the speakers can be heard stumbling over
    their words. It makes a powerful and unusual form of political message by eliminating
    the eloquent, impassioned speech that we are accustomed to hearing during political
    agitation.


    Megaphones combine a microphone, amplifier and loudspeaker into a mobile and portable
    PA system. Megaphones’ sound has a very directional quality to it. Every movement
    alters the speech’s direction and tone. The transformation of megaphones into
