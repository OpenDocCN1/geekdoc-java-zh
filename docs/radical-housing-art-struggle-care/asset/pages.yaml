    # Fighting Against Displacement


    If the artist as urban pioneer rests centering on the experience of incoming artists
    and artists within within historically disadvantaged neighborhoods, then fighting
    back requires that we center the experiences of community members who long called
    that neighborhood home. Who is the protagonist of gentrification? Real developers,
    state officials including planners and representatives, the mainstream media,
    as well as artists themselves highlight the protagonism of incoming residents.
    Who is the protagonist of the resistance to gentrification? We assert that it
    is the most vulnerable to gentrification''s violence of displacement and harassment.
    namely, the poor, the homeless, predominantly marginalized people of color.


