  md: '# THEORY ON DEMAND


    enabled to know people and their stories, to talk about the struggle, to create
    modes of expression, and trace the inseparability of these acts from one another.²⁵


    Our initial proposal was simple. We proposed to have conversations with the residents,
    to get know them, and learn about their relationship to the struggle. We wanted
    to bring them to our encounters three strange worlds, an object and a story. We
    met in one of the new homes that was built in 2015/2016. Between its empty walls,
    we created a temporary reception for visitors of Vila. After mapping the conversations,
    we created a map of themes relying on conversations with nine residents and our
    own research about the struggle. We made notes, drew diagrams and discussed with
    residents. Curators of the project were also invited to contribute. The idea was
    for everyone to write from a personal perspective but connection to human rights
    and politics of memory.


    As a result, the 44 pages was printed in Risograph and distributed by the Goethe
    Institute of free. The texts in the publication are very different in nature.
    There is a text about the Museu das Remoções, public utility information, short
    entries about the context of the Olympics elections, evictions, conversations
    presented as wavy words (phrases in the shape of waves), prospective diagrams
    showing the structure, the history and the future of Vila.


    We can think about the glossary in light of Martha Rosler''s experience:


    > Consider the city once again. It is more than a set of relationships and a congestion
    of buildings; it is even more than a geopolitical locale – it is a set of unfolding
    historical processes. In short, a city embodies and enacts a history. In representing
    the city, in producing counterrepresentations, the specificity of a locale and
    its histories becomes critical. Documentary, rethought and redeployed, provides
    an essential tool, though certainly not the only one.


    The publication came out as a way to reproduce the history of resistance of Vila
    Autódromo, but it also means an explicit preoccupation in sharing the memory that
    we have created. As artists, we became good listeners and maybe translators (or
    transducers) of the embodied memory of the struggle. We asked ourselves: How we
    deal with this impunity that opened up between us? How does it produce expressive
    modes? How do memories and voices become content for the glossary? How does the
    glossary continue to mobilize residents through struggles?


    We decided to call the publication vocularies in movement, lives in resistance
