  md: '# (In)Definitions of Space


    Unlike most conventional galleries or museums, the inside of the MAAM is not a
    white neutral meant to direct the viewer''s focus to the individual art pieces.
    Different artistic works overlap on the walls with stains of smoke and humidity,
    chipped materials, and previous graffiti that had been made during the time between
    the closing of the meat factory and the arrival of the squatters. There is a casual
    aspect of messiness in the space, in the way the artworks stand on, competing
    for the viewer''s eye. And yet, it is this very messiness that constitutes the
    MAAM''s unique aesthetic appeal, as if the space were one single collective art
    piece, a huge mosaic made by individual artworks.


    This messiness of the space is replicated in the differences of opinions and disagreements
    about the role of the art space in the squat. For De Finis, the existence of the
    museum inside the squat fulfills a social function, guaranteeing the protection
    of the site against demolition. The land on which Metropol sits was purchased
    a few years ago by the Salini Imprego Group, one of the biggest construction companies
    in Italy. Like some other industrial spaces, this piece of land is appealing to
    real estate speculators. In Rome, industrial land is priced considerably lower
    than building land, and therefore, by buying an industrial property and getting
    public administrations to change its land suitable for building, real estate developers
    make a significant profit. The Salini Imprego Group intends to eventually demolish
    the factory and use the land to build apartment buildings, but the BPM occupation
    of the space trump the project. To some extent, the extensive network of BPM,
    which has several housing squats all over Rome, helps guaranteeing the permanence
    of Metropol. In the past, BPM has proved itself able to galvanize thousands of
    supporters to demonstrate against evictions or make camp in a given property to
    obstruct public access. But, according to De Finis, the consolidation of MAAM
    as a contemporary art space is at least as important in the permanence of the
    squat as the activists'' labor.


    ![](img/bdf737ad32ad9ac370607ecf0b726fa8_199_0.png)


    Fig. 3: Hall to the left of the main entry, MAAM. Photo by Andreea S. Mic.'
