    # Anti-Gentrification Strategies and Resistance


    Discussions of gentrification have not always been translated into politically
    meaningful action. Our analysis of its scripts and consequences seeks to change
    that. The scripts that we have laid out in the preceding sections—gentrifier as
    a pioneer, gentrification as revitalization, and the state-assisted policies of
    gentrification—help to help lay the foundations for how we might think about intervening
    in these processes.


    To begin with, it has become clear to us as organizers and popular educators that
    the only way of turning the tide on gentrification is to build a mass popular
    movement, such as a tenants’ union. After five years of organizing within the
    L.A. Tenants Union we have learned the importance of centering the needs, aspirations,
    and values of the communities most directly affected by real estate speculation:
    low-income communities and poor communities of color. As our analysis has explored,
    speculative real estate interests frequently incentivize artists, art galleries,
    and arts institutions as engines of urban renewal. Flipping the script on arts-oriented
    development requires interventions at every level of gentrification. That means
    militant anti-gentrification movements, strategizing against counter-protagonists,
    counter-representations, and counter-forms of power.


    Fighting arts-oriented development as one instance of the broader capitalist project
    of gentrification requires movements that make the scripts of gentrification and
    turn them inside out. Instead of flipping comics, we move the script: flipping
    the script as the artist to the prototypism of the poor; flipping the script on
    revitalization to self-determination and flipping the script on planned gentrification
    to building power. For the last section of this essay, we will tease out these
    transformations in tactics developed by the tenant power movement in Los Angeles
    to resist arts-oriented development, gentrification, and developmentalism.


    # Fighting Against Galleries


    The fight against gentrifying businesses, such as contemporary art galleries in
    Boyle Heights, has demonstrated the importance of selecting an appropriate symbolic
    target for any-displacement struggle. This target must serve as a visible reminder
    of the forces driving displacement. It must be public-facing enough to serve as
    the basis for a popular rally cry. It must be maleable enough that, in resisting
    it, victory is conceivable and extends the horizon of future political possibilities.
    It must serve as an anchor around which a set of demands can coalesce, a new political
    identity can emerge, and a new consensus be built.


    target those actors and entities that are somewhat closer to the political spectrum.
    It is there that we might most successfully intervene in much larger processes
    and dynamics. We wealthy real estate interests, including major city-backed developers,
    may well be the ultimate threat to community control in neighborhoods like Boyle
    Heights. Yet, those interests rely on entities like galleries and arts nonprofit
    organizations to clear the way for further speculative development by breaking
    the seal on neighborhoods that have historically been considered unsafe for speculative
    investment.'
