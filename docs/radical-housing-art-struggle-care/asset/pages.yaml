    By most accounts, the creation of what is today the MAAM, the Museum of the Other
    and the Elsewhere happened out of chance. In 2009, during the same period that
    BPM was squatting the former Forucci meat factory to found Metropoliz, in a different
    side of the city, a number of architects, artists, and activists tied to the Stalker
    collective were developing participatory tools and actions to create what they
    called ''collective imaginaries'' for places of the urban periphery. Anthropologist
    Giorgio de Finis and filmmaker Fabrizio Boni were two of the participants in the
    idea of creating a rocket ''to migrate to the moon'' and shoot a documentary of
    the process. In 2011, they were looking for a place in the city periphery that
    could host their idea of moon was the metaphor for a public space that belonged
    to all humankind and that De Finis and Boni arrived at Metropoliz with this proposition,
    and after gathering the interest of the squatters, they started shooting Space
    Metropoliz. During those months, a few visual artists intervened on the old factory
    walls making pieces that reflected on the human migration to the moon as a utopian
    egalitarian project. Those first pieces were the beginning of what would later
    become the MAAM. After shooting the documentary, Giorgio de Finis continued his
    engagement with Metropoliz, opening the space to the participation of local artists
    who donated their work in support of the squat and its housing rights struggle.
    In April of 2012, and from the donated pieces of dozens of artists, the MAAM was
    born as a ''political museum'', in De Finis''s words.


