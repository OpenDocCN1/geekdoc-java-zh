  md: '# THEORY ON DEMAND


    one might say holistic–disposition of the commons to address all of them, such
    that even when a common project focuses on a particular need, such as housing,
    the others are inherently present.


    Nancy''s definition of property exceeds the material, taking us into the second
    dimension of the commons stated above: subjectivity. Nancy asserts that:


    > Communism has more, and something other than, a political meaning. It says something
    about property. Property is not only the possession of goods. It is precisely
    beyond (and/or behind) anyuridical assumption of a possession. It makes what any
    kind of possession properly the possession of the subject, that is, properly its
    expression. Property is my possession; it is me. ¹³


    For Nancy, property and subjectivity are inseparable, such that the material conditions
    of life–what we have and how we have–determine the reality of who we are. In this,
    Nancy finds Marx''s axiom that mankind produces history, and in doing so, produces
    itself.


    Drawing on Nancy, performance studies scholar José Esteban Muñoz interrogates
    the commons from the perspective of minoritarian subjectivities. Both Nancy and
    Muñoz are concerned with thinking about the possibilities of togetherness while
    refusing an understanding of community as unity. Equality is not only ontologically
    possible but as an ideal is ideally mobilized across erasing difference. One of
    the essential for the commons, for Muñoz, is to think across radical differences
    in the multitude of singularities coming together a power structure. Muñoz contends
    that a queer of color subjectivity can offer a glimpse into ‘a commons of the
    incommensurate signals signals that goes beyond a politics of equality¹⁴ Goes
    on to argue that communism would be antithetical to colonialism, both structural
    and internalized


    Ideologies that enable empire are shaped up by a reification of the individual
    sovereign subject who can think of itself as differentiated from a larger sense
    of the commons. Thinking of the self as purely singular enables a mode of imagining
    the self as not imbricated in alterar circuit of belonging, what I call an actual
    sense of the world where we grasp the plurality of the senses, which is not one’s
    senses but instead the multiple senses of pluralities.¹⁵


    Muñoz’s choice of the words ‘imagining the self’ is particularly pertinent as
    it points to a construct in which the reality of existence is ignored in favor
    of a colonial imaginary according to individuals who are isolated and. And more
    importantly, ‘imagining the self’ implies a fundamental relationship between imagination
    and practice, between what one would like and what one does to make it actual.
    Following Muñoz, we see how the individual isolated from the common is a colonial
    project, and more importantly, being in common implies a togetherness of what
    is incommensurable singularities.


