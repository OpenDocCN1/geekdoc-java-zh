    contrast between them and RHCDC''s human-sized, social housing is immediate: the
    ''projects'' were often ideologically and erroneously vilified, they do not imply
    the same degree of site-specific and respectful care that the RHCDC do. Moreover,
    the latter has several features hard to find within traditional social housing.
    They are Energy Star and feature air conditioning and insulation.24 They are not
    cost-efficient35 — their value seems to lie in their symbolic stance, functioning
    counter to the hegemonic norm. Importantly, this stance is no divorced from or
    superior to their material reality: rather, their material reality as functioning,
    well-designed social housing is a dissenting act, opposing the dominant material
    reality among social housing elsewhere.


    Chilean Alejandro Aravena and his practice Elemental have also worked on reimagining
    social housing.36 When the government was unable to provide funds to build individual,
    fully functioning houses for squatters in Northern Chile, and the squatters threatened
    to go on hunger rather than live in the proposed housing blocks, Elemental suggested
    a solution: building halves of a fully functioning house each — complying with
    the minimum legal requirements and including all basic infrastructure — and letting
    them finish the rest themselves.37 Such a solution both protects the inhabitants
    and their political desires, also recognizes their unique personalities and creative
    potential.


    In both Elemental and the RHCDC''s cases, the artists and architects seem conscious
    of their inability to provide a community that wants (i. affordable housing for
    all); they instead concerned with building and living materials of what should
    be, what probably be done if the ruling system had different priorities and placed
    inhabitants''. Through their existence, the RHCDC reveal that they can exist —
    this might seem a tautology, but in a hegemonic context, reality and possibility
    merge: the dominant hegemonic articulation must eliminate any alternative, for
    it seeks to be source and arbiter of all possibilities. It is precisely here that
    PRH and art in general have the opportunity to be political and create counter-hegemonic
    alternatives, suggesting the defined nature of reality and creating in those who
    experience such alternatives ''the desire for change''.38 This desire awakens
    when there is space for its growth, and it is not with continuous rejection from
    the dominant system. Artists could task themselves with nurturing spaces and ideas
    that allow the desire for change to grow.


