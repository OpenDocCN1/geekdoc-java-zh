  md: '# Some notes...


    -The rest of the smaller characters are shared by the ENSEMBLE and can be moved
    around at the director''s discretion.


    -The play is very musical. Each character has their own theme song with a melody
    taken from the intonation and rhythm from the verbatim.


    /means the words overlap.


    -The ENSEMBLE are on stage the whole time. When they are not actively part of
    the scene they are playing music, making tea, cleaning, organising the occupation
    or watching the action.


    # ACT 1


    # SETTING:


    The Audience are warmly welcomed into a vibrant community centre in the middle
    of a London Housing Estate. SAPH, GRACE and RUBY greet them, taking them to their
    seats, showing them around and offering them tea and nibbles.


    SOPHIE and CJ, the NARRATORS, sing a melody of songs from the play with LOTTE
    harmonising and MARIA playing a selection of pots, pans and other household items
    as percussion.


    The walls are busy and colourful with multiple hand-made banners depicting slogans
    such as: ‘Social Housing, Not Social Cleansing’ and ‘Repopulate Carpenters’. Bunting,
    festoon lighting and three large architectural drawings of the towers of Carpenters
    Estate (Dennison Point, James Riley and Lund Point) hang from the ceiling.


    The playing space is in the centre of the room, with the audience on three sides.
