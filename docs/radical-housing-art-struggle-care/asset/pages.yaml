    How can we contextualize this specific practice within the art history of the
    Global East? What critical terms could we use to understand this specific practice?
    The notion radical help in conceptualizing this approach to art in any way? Radical
    art in the interpretation of art in Serbia has been for a long time privileged
    in avant-garde. In this approach, radical art is seen as multiplicity of cultural
    practices stretching from the historic avant-garde to various postmodern post-avant-gardes,
    characterized by artistic transgression, experiment and interdisciplinarity.²⁴
    the practices of the late 2⁰ century that constitute mainstream in today''s art
    world. Any attempt to reclaim the notion of radicality becomes even more difficult
    being in the political use of word in Serbia. After 1899, the term became synonymous
    with the extreme nationalism and futurism that now rules the country.²⁵ How can
    we reclaim the notion of the today? Is there a radical practice in Serbian or
    Yugoslav art history outside of these genealogies?


    Rasto Mochnik invokes the radical with reference to ‘the symbolic production that
    was born out of the struggle for life and perceived by its producers as a weapon
    in the fight for freedom and emancipation.²⁶ The culture constructed here as weapon
    is the Partisan culture and art that emerged in the Anti-Fascist People''s Struggle
    of Yugoslavia in WWII. Mochnik sees Partizan as an inextricable element of a wider
    project of political transformation, whereas argues that Partizan invented a new
    kind of bourgeois artistic autonomy. There is no consensus on the historical origins
    of this art (its respects, for example, to Socialist Realism and the avant-garde),
    but there is no doubt that as art of political experiment created a new sense
    of what is historically possible. It is precisely that makes that it essential
    for the contemporary Art of the Housing Struggle. “It is not about past at all,
    but rather about our own historical present and its radical openness to different
    futures.”²⁷

