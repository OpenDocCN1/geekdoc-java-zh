    Soros and his Open Society Institute.53 Thus, the networked utopia of the artist-infonant
    outweighed beautifully with the migratory practices that would be the prerequisite
    of globalization’s ‘race to the bottom’, and in this sense the mobile isolation
    of the studio can be seen as an analogue to the precarious and alienated status
    of the worker within the new world order, so-called digital nomad.52


    The appearance of the digital avant-garde coincides with the advent of the great
    real estate boom (in the UK and US), of which we are yet to see the end. In this
    momenti digital artisans were often occupied workspace in the inner city for a
    brief while. These digital artisans were often moonlighted as web designers and
    could be found producing artistic and commercial work on the same desk. To the
