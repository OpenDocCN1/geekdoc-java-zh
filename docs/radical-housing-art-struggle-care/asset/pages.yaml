    # 4. 53: Squatting Versus Anti-squatting


    Awashing of the violence in the city can take different forms: as art students
    nicely painting a fence that separates a neighbourhood with predominantly Roma
    in Baia Mare town, invited by the many who then try to classify the fence as an
    object with heritage value; or music and art festivals for the better-organized
    in poor areas, paving the way for gentrification and radical evictions (in Rahova,
    Ferentari, Mătăari neighborhoods, or in the train station in Bucharest). But artists
    can also take directly, as engaged actors in the processes of urban violence.
    That direct engagement can range from graffiti painters complaining about homeless
    persons seeking shelter in the same abandoned buildings targeted by graffickers,
    to take part in actual evictions — in the context of the harsh competition over
    space.


