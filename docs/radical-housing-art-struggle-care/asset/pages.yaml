    them, as Harvey claims, ‘image over substance’. Harvey argues an ‘achievement’
    of such architecture is the veiling of socio-economic issues through a kind of
    playful distraction not to undermine the ‘coherence’ of the ruling paradigm (i.e.
    hegemony).23 Shotguns are particularly noteworthy, in their aesthetic opposition
    to such architecture: their small stature, more traditional materials, and long
    history refuse assimilation into the postmodern narrative. Resisting, and aesthetic
    inverting, ongoing gentrification and its sole concern with investments is an
    example of a counter-hegemonic position in PRH.


    The preservation of the shotgun houses in PRH represents, moreover, an act of
    maintenance. In this broader opposes the neoliberal insistence on constant innovation
    and growth, where Houston, for example, is seen as part of the ‘expressway word’,
    in which the old is bulldozed to make for the new.24 In art, the concept of maintenance
    is rooted in Myrtle Ukeles 1969 defending the work of maintains (mothers, cleaners,
    etc.) in comparison to the more revered creative work of (often male) artists.
    Ukeles calls maintenance ‘the life instinct’ and the avant-garde ‘the death instinct’.25
    we can detect echoes of Mouffe here, in the rejection of avant-garde as a worthy
    ambition for art. Ukeles’ concept can be expanded to the maintenance of a community
    – its aesthetics – against development: the maintenance of the Third Ward and
    its architecture. In contrast to today’s starch-led vanity projects, seeking to
