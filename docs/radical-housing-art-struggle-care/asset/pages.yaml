    thus be understood as the dominant social, political, ideological, and economic
    system that both the state and its citizens (consciously and unconsciously) ascribe
    to reproduce. It is what, in any given time and place, we consider to be normal.
    Hegemonic beliefs also serve to justify the underlying structure of society. Their
    defeat is not as simple as an armed revolt against an authoritarian state, but
    rather requires Gramsci terms a position of warfare (from the trench warfare of
    World War I), taxing struggle that challenges hegemonic articulations at every
    societal node, both symbolically and materially, revealing the ideological and
    determined nature of our reality in order to unveil the existence of alternative
    ways of life⁶


    Hegemony is propagated by states as well as individuals: by their actions and
    unquestioned belief in its dominance. Gramsci was reacting to capitalism; since
    his time, capitalism has evolved and adapted to a world of globalized finance,
    weakened industry and union power, and widespread preach. Neoliberalism, as we
    call capitalist''s most recent mutation, has different, at times more pervasive,
    technologies of power and control, yet remains vulnerable to hegemonic articulations,
    as both Chantal Mouffe and Nancy Fraser have convincingly demonstrated⁷


    Political philosopher Chantal Mouffe has contributed greatly to bringing hegemony
    to the contemporary art discourse. She sees it as a battlefield of heemonic articulations
    vying for control – whenever one dominates, masquerades as the natural, rather
    than determined, state of affairs⁸ As Art, she writes, has the potential to ‘create
    cracks’ in the smooth facade of neoliberalism (our current hegemonic articulation)
    and shows how ‘things could have otherwise’⁹ even as hegemony appears to deny
    any choices outside itself. She terms that actually challenges the status quo
    ‘critical’¹⁰ and considers it a break from the traditional avant-garde that to
    be co-opted, in order to stay political, artists must be counter-hegemonic rather
    than innovative. They must help construct ‘new subjectivities’¹¹¹ as alternatives
    to the accepted understandings of our status quo.


