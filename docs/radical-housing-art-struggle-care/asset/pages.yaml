    With the regime change after 1989, in Romania, as in other ECE countries, housing
    reform

    followed three main paths: the rapid and continuous sale of state-owned stock;
    de-regulation

    unurban development, to the benefit of the private real-estate sector; and the
    re-privatization

    of the nationalized housing stock, through restitutions to pre-1950 owners, their
    heirs, or their

    legal-rights buyers. These policies were cemented by the influence of international
    financial

    institutions, such as the World Bank and IMF, overseeing the entire ‘transition’
    process.³


