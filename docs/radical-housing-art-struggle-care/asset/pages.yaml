  md: '# A Museum in the Periphery


    The part of the periphery where Metropolis is located looks very different from
    the monumental Rome that attracts millions of visitors every year. Instead of
    the usual hordes of tourists holding cameras and selfie sticks, or the young professionals
    going to their offices in the city center, when taking a bus or tram to Tor Sapienza
    finds an almost exclusively immigrant working-class population. Via Prenest runs
    for miles to the outskirts of the city, with poor and working-class neighborhoods,
    empty lots, and unsightly commercial areas with furniture stores, gas stations,
    supermarkets, and transportation and auto repair businesses.


    Tor Sapienza lived its golden years in the 1960s when the factories in the surrounding
    areas provided full employment for its entirely Italian working classes. Starting,
    with the oil crisis of the 1970s and into the 1980s, factories closed or moved
    to other locations. These shifts in production made some of the population move
    out of the neighborhood. Small family-owned businesses started to close, a trend
    that later continued with the arrival of migrant shoppers and shopping areas.
    While the degradation of the neighborhood was caused by deindustrialization and
    rising unemployment, many of its inhabitants blamed the successive migratory waves
    that were arriving in the 1990s. These waves gradually changed the demographic
    composition of attraction but also marked the difficulties of integration and
    cohesion that were being formed alongside race and ethnicity. No group encountered
    more than Roma from Eastern Europe, who first arrived as refugees in the former
    Yugoslavia. The city administration built a camp on Via Salvati to lodge them
    until permanent housing could be provided, but the camp which was temporary, has
    never been dismantled. In addition to the Roma camp on Via Salvati, Tor Sapienza
    has a center of acoglenza (asylum center) for immigrants on Via Morandi. Mostly
    occupied by both Northern and Sub-Saharan Africans—and most recently refugees
    from the wars in the Middle East—the asylum center is chronically overbooked and
    lacking in resources. Racism and xenophobia are pervasive in the area.


    Metropolis emerged in this geographical and social context. From the inside, the
    squat factory is as appealing as one would imagine. Beyond the entry gate, a yard
    opens to the right and an alley that goes straight to the end of the factory.
    Most living units are at that farthest from the street. These are small houses
    constructed in white and light blue, with some flowers on the windows and children
    toys dispersed the there. Scattered here and around the yard, one finds supermarket
    carts with discarded materials that some of the squats collect from the street.
    Reselling old appliances and electronic debris for the metals they contain is
    a common source of income for many unemployed Roma living in Italy. Across from
    the entry gate, a few steps and a ramp make the access to the main building of
    the former industrial complex, where the museum is now located. This large building
    is a labyrinth of thin and scant galleries around a roofless central space. This
    space now serves as a patio of sorts, letting the light come towards the surrounding
    areas. All the galleries around this one are made of'
