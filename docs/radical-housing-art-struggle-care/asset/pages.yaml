  md: '# THEORY ON DEMAND


    The protagonism of women residents is directly connected to the fostering of care
    networks and to the maintenance of infrastructure to guarantee the daily life
    of the community, previously through the eviction. "Struggle was guarantee made
    with many hands". This is how Maria da Penha describes life in resistance to eviction.
    During the eviction years, the community had to face violent pressures to move
    out, including water restrictions, police repression and psychological pressures.
    "Struggle was in collaboration."²⁹ One of the critical scenes of everyday life
    was the commercialization of food for Vila residents and for the demolition workers
    People had to face similar situations in their own districts.


    Invisible doubt characterizes women''s everyday life. The very production of the
    feminine gender is historically associated with her homes and to care work (either
    reproductive work, care of children, elders, or neighbors). In this process, we
    have learned that women in Vila persistently resisted the destruction of care
    infrastructure. This is why we have included entries such as ''Women''s role'',
    ''Women who peeps/Feminist economy'', and ''Support network'' in the publication.³⁰


    A number of researchers have focused on the role of women in anti-eviction struggles
    in Vila. In her book Human and the colonization of the urban space (Direitos Humanos
