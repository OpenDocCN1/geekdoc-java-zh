    THEORY ON DEMAND


    Centre and Aylesbury, both undergoing social cleansing at the time. That matter
    and our involvement with local initiatives against social cleansing in the area
    made us concentrate on local struggles in London and practices developed by collectives
    working and organizing with local communities. On the final day of our encounter,
    Emery May Morris and Nina Scott from The You See The Other Guy theatre talked
    about the practice they developed in housing struggle during the Focus E15 Millions
    group. Hannan Majid from the Rainbow Collective and Ledbury Action group talked
    about the work with children in South East London as part of the latter; a housing
    campaign created by an emergency response to unsafe and appalling housing conditions
    on their Council estate. AHAAHHA from Voices that Shake talked about their work
    with social injustice and connections of racial violence, body trauma, and art.
    Zebra Edwards introduced her artistic practice fusing music to create a soundtrack
    racial injustice in the city.


    Learning from this encounter, the book provides a comprehensive cartography of
    modes of thinking and acting around the art of housing struggle. It is a mosaic
    of interventions that emerge from contradictory traditions, and as it produces
    heterogeneous orientations. What connects these contributions is thinking from
    within or the periphery. These peripheries are not located only in the Global
    South³ and the Global East but also in the Global North''s internal matters. It
    is in these sights of resistance against housing that radical housing is traced
    as it emerges, declines, and re-emerges on the way to our common future. The book
    is divided into five sections. Each section contains essays with a particular
    focus. The pieces are thought-provoking commentaries on new and old modes of theorizing,
    thinking, and making art in the midst of housing struggles. Though the authors
    don''t engage directly with the notion of radical housing, this collection raises
    questions about how to produce knowledge and how to do art and about housing in
    a radical way.


    What is radical politics today, and how to foster radical politics at a time of
    unsettled relations between the accumulation of capital, new forms of social reproduction,
    new social and housing movements, and the need to rethink the past and envision
    alternatives? In what does radical care emerge as a driving force within radical
    housing movements and resistance at the margins? We theorize, criticize, and make
    art with what we can create critically? How to write our own histories historically,
    and how to keep these histories alive? By what and with what politics builds tenants''
    power and housing commons against social cleansing, oppressive forms of housing,
    urban real estate and artwashing? These are just some of the questions that arise
    from the essays, between lines and in footnotes, and in ongoing conversations
    happening as we speak, implicitly or explicitly. The book also raises the issue
    of knowledge production in Western institutions tackling housing violence and
    radical housing politics. The argument is made against what colonial institutions
    and the uncomfortable truth about how these institutions have always treated minoritized
    people.


    37 This book suffers from the serious lack of the Global South perspectives and
    every future attempt to engage with these issues should put an emphasis on this.
    This collection of essays is a product of the circumstances that have emerged
    during my time in London and set of decisions that I chose to de limited financial
    capacities of the project and my limited knowledge about other contexts. The research
    project that I have been working on from 2016 to 2018 had a focus on the UK and
    Serbia.'
