  md: '# The Factory Studio (1962-1989)


    Warhol’s Factory helped pioneer the appropriation of former industrial space by
    artists in Manhattan as the city stepped up its planned displacement of industry.²
    The studio as factory expresses a dual process of the western city’s deindustrialization
    and its experimental reimagination of itself as participating in general production:
    collective, industrial, site-sensitive, gendered, prototyped, libidinal, democratic
    and mediatized. The factory studio was a space for collapsing distinctions between
    art and production, art and life, art technological reproduction – a laboratory
    for the contestation of art distinction per the creation of large-scale, genre
    shifting, commerce courting, performative and interactive works. For the generation
    that followed the Abstract Expressionists, the factory studio became a space not
    only for the reinvention of art, but for the reinvention of the self, which in
    turn was framed as art and put on display: ‘In the mid to sixties, for example,
    the Conceptualists presented the process of making art as work of itself.’²⁹ In
    this phase, the neo-avant-garde renewed art by challenging its originality, individualism,
    sexism and class elitism. The factory was therefore a space of liberated production
    in which launch attacks on the lazy presumptions of an art system that had been
    embraced within the museum and bourgeois class interests. The bones of working-class
    production danced on, not in the sense that artists displaced industrial labor,
    but rather that their joyful occupation of these decommissioned spaces endured
    and many of the social divisions that industrial production presupposes.


    Artists also organized, ‘Art Workers’, on the model of industrial labor but not
    (primarily) ‘campaign against waves or working conditions,’³⁰ but to radically
    contest the disaster of bourgeois capitalism, racism, and technocracy.³¹ From
    Pop, to Performance and Land Art, artists were at pains to make explicit the relationships
    between art and commodity, art and the forces of production (industrial, administrative,
    cybernetic, heteropatriarchal). By a cup of soup, artworks could be generated
    by the dozen, sold by the yard, and everyone could be a celebrity for 15 minutes.
    The productive power of the factory could be desulated, its efforts and intense
    energies hijacked to produce new experimental thoughts of sex, art and performance.
    Expansion of largely unarticulated space provided an (almost) blank sheet for
    rearranging the contents of living, working and creating (live/work).


    > Of this was not the first foray into the factory, in the 1920s Russian constructivists
    developed a laboratory productivism in the studio before launching into practical
    work in production. However, as Mary Gough and others’ key studies indicate, the
    artist primarily entered the factory either as editor, designer of products or
    re-trained engineer. See, Mary Gough, Artist as Producer Russian Constructivism
    in Revolution, Berkeley, Calif.: Univ. of California Press, 2007, pp. 100–119.


