  md: '# INTRODUCTION: THE ART OF HOUSING STRUGGLE


    ANA VILENICA


    > > Like this girl''s poetry in her step, her lungs


    > > A fair currency, fat with poisonous air.¹


    - Zeena Edwards


    It is not enough to acknowledge complicity as an artist or even as a renter. Substantive
    changes requires organizing a movement.²


    - L.A. Tenants Union


    Housing space is a crucial locus of social reproduction, a place where countless
    acts of care sustain our lives. Yet capital has forced its way into our homes,
    and eviction, making them a playground. For decades now, housing struggles have
    centered on eviction and foreclosure, along with epidemic homelessness, the segregation
    of the urban poor, and generalized precarization resulting from worldwide privatization
    and financialization. These attacks on housing and homes have not gone unanswered.
    Among practices of resistance honed in the course of the struggle are anti-eviction
    work, rent strikes, and occupations, whether of land or housing. *Struggles* have
    also materialized in informal housing strategies, acts of housing disobedience
    and collective organizational forms, including tenants union, activist groups
    and neighborhood assemblies, drawing on a wide range of political traditions.


    It is important to state clearly that housing struggle is not confined within
    the walls of any particular home; it constitutes a *housingscape* whose distinct
    process and situational character extend its scope and stakes beyond residential
    accommodation as such.³ Housing is made, unmade, and remains in this locus of
    degree and de-regulation. Within it, housing itself is enacted in various ways
    by multiple actors contending for dominance and the right to a home. Housings
    are affirmed and contested, produced, and disrupted in discourses, practices and
    places, politics, policy and social strategy, art and culture. All these factors
    create the paradoxes, contradictions, and instabilities of housing as practiced
    and lived space.


