  md: '# RADICAL HOUSING: ART, STRUGGLE, CARE


    become a central focus of urban life worldwide, with culture promoted as a key
    of response to socio-economic decline. In this context, art is expected to produce
    cultural, social, and economic outcomes, to regenerate the hollowed-out economies
    of post-industrial cities, and to together populations fragmented by capital''s
    systemic reproduction of race, ethnic, religious, national, class, gender, ableist,
    geographical divisions – regardless of a total paucity of that the arts can perform
    any of these tasks. The role of art in housing and urban regeneration reveals
    its integral involvement in the same going capitalist mutations that reduce the
    arts to one more capital input.


    One significant development in recent critical discourse is a shift in attention
    from culture-led urban regeneration as to the introduction and criticism of developer-led
    art, in response to the ever-greater openness and apparent capability of the developers’
    undisputed profit motive. Contributors Josephine Berry and Anthony wrote: ‘as
    the developers’ new profit profile became acceptable and objective, positioning
    artists increasingly as collateral rather than agents of urban change, and art
    became a veneer veneer to The resulting art ressembles Gregory Sholette called
    bare art, or as Kim Barnett describes in the introduction to Shollette''s book
    Delirium and Resistance¹¹ new bald obviousness of art''s subservience to the interest
    of capital’. Artists are pushed into this new real estate market (or markets)
    by their precarious position of artists and the lack of both public and alternative
    sources of funding for art. At the same time, the lack of affordable housing in
    some parts of the world has made artists more likely to accept unethical sources
    of housing and studio space, such as property guardianship on estates undergoing
    decanting, i.e., the clearing-out of existing tenants to free up the space for
    higher income brackets.¹²


    Neither culture-led regeneration nor developer-led art is an entirely coherent
    concept. Both theirs, however, consider the visionary idea of culture and art
    as catalyst and engine of optimistic change. This vision is embedded in shifting
    policy agendas according to local context.¹² In many instances, markedly similar
    solutions have been applied to issues in the Global East and Global South. In
    many countries of the Global South and East, culture-led regeneration and developer-led
    art were introduced by distinctly colonial means. Worldwide, national public institutions
    in collaboration with private developers, supra-national institutions, and multilateral
    NGOs are keen to sponsor social engaged projects that promise to foster regenerative
    tasks.


    One example is the Urban Incubator project, launched by the Goethe-Institut in
    Belgrade, Serbia in 2013. The project was initially presented as an art-led participatory
    model of urban development, seeking to improve living conditions in the Samakala
    neighborhood while democratizing community decision-making processes. Samakala
    is a neighborhood with


