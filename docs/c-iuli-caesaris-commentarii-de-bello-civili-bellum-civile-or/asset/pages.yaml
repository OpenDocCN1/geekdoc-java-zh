  md: '# PREFACE


    THE history of text and editorial work on Caesar’s Bellum ciuiile is presented
    in outline here. For a fuller discussion the reader is referred to the first part
    of the companion volume, Studies on the text of Caesar’s Bellum ciuiile (henceforth
    ‘Studies’).


    # I. HISTORY OF THE TEXT


    When Caesar was assassinated in 44 BCE, the work we know as the Bellum ciuile
    was in an unfinished state.¹ In the conflict-filled months that followed the assassination
    of Caesar’s inner circle and officer corps, specifically Hirtius and Balbus but
    presumably others well, initiated the publication of narratives of Caesar’s campaigns
    as a corpus.² The ‘Letter to Balbus’ that introduces Book 8 of the Bellum Gallicum
    represents one phase of that plan: its author Hirtius reports that at Balbus’
    pressing request he has connected by a kind of metaphorical weaving (contextui)
    the two sets of commentarii written by


    > ¹ Or so may reasonably judge from intratextual evidence in the text that has
    come down to us, the defeat of C. Antonius (3.4.2, 3.10.5, 3.67.5), and from other
    ends such as unanchored cross-references (1.48.3, 3.88.3). For the fullest argument
    in favour of the publication that Caesar finished and the BC Barwick (1951, passim).
    See also Studies, Part 2.


    > ² The bibliography on the corpus Caesarianum is extensive, and has political,
    historical, and literary as well as textual aspects: see Clettu (2009) for a brief-overview
    and Gaertner-Hausburg (2013) for a comprehensive review of past work and some
    new ideas. On the physical history of the corpus and its textual implications
    see Peneux (2003).'
