  md: '# PREFACE


    # C. MARGINALIA


    Marginalia in M (and m and Vall.) are infrequent and have no significance for
    the constitution of the text except insofar as they provide paratextual evidence
    for the relationships among these three manuscripts.


    # D. CORRECTIONS


    Most of BC is preserved on the tenth-(or eleventh)-century pages of M: ff. 93–116
    and ff. 125–132, a total of sixty-four pages. Corrections were added to these
    pages in several phases; the total number of corrections is approximately seven
    hundred. (The following account is supported by further details in Studies.)


    The first phase of corrections seems to be the work of the original scribe (M).
    These corrections number roughly fifty and generally recapture the reading of
    M’s exemplar.


    The corrections by one or more later hands are much more numerous (Mmr). They
    are also more motivated. Some certainly or probably recover the reading of the
    exemplar. A great many may introduce innovations into the text. Some of these
    are successful repairs to problems in the archetype. But most merely address problems
    specific to M or μ (corruptions, faulty division, orthography) and contribute
    nothing to the constitution of the text.


    Corrections from both phases have been incorporated into the text of m and Vall.
    Some of the good readings unique to m and Vall. in BC 1.1–33 presumably originated
    as Mmr. In m and Vall. there are further corrections by a later hand (mmr, Vall^{mr}).


    For most of Book 3 of M is preserved on the twelfth-century pages: ff. 117–24
    and 133, a total of eighteen pages.


    Here too are at least two phases of correction, although the distinction between
    corrections by the scribe himself (M6)'
