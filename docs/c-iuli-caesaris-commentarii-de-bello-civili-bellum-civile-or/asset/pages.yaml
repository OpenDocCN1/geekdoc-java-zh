  md: '# III. THE WITNESSES


    minuscule) have already been mentioned. Other features relevant to the analysis
    of the transmission are as follows:²⁹


    +   1. Abbreviations


    It is clear that the archetype contained both abbreviations and errors arising
    from abbreviations. Those that we can detect are all rather simple ones, but they
    the residue of several stages of transmission. At each stage outmoded or ambiguous
    abbreviations were a source of error for scribes trained in different abbreviation
    conventions. Among the abbreviations most prolific of error in the text of the
    BC are numerals (cardinal and ordinal), praenomina, prepositions and prefixes,
    measurement units, and the terminology of ancient political and military life
    (e.g., populus Romanus, res publica, consul, tribunus, eques Romanus, prafectus
    equitum, legatus, legio, senatus consultum). Others include abbreviations for
    common words both inflected (e.g., esse, se, noster, omnis), as well as internal
    syllables (e.g., -par-, -ber-, -der-, -ter-) and various inflectional endings.
    The errors that arise from the archetype''s abbreviations are sometimes present
    in all of ω''s descendants, and sometimes in μ or v. But since the form in which
    abbreviations are transmitted is, like orthography, to some extent a matter of
    scribal choice, abbreviations, like the various forms of archetypal doublets,
    can obscure the lines of descent.


    +   2. Errors of word division


    In ω''s descendants there are a number of errors of word division. These may have
    arisen in the copying of ω''s scriptura continua (1972, 38), as Brown suggests,
    but they might may also be errors in ω that were the legacy of such script from
