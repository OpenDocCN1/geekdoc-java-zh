  md: "# PREFACE\n\nthe BC. In Studies, using evidence from all of the relevant Bella,\
    \ I offer a detailed argument for Hering's bipartite stem, together with a discussion\
    \ of the possibility of horizontal transmission between the $\\mu$ and $\nu$ branches\
    \ and a more precise statement about the place and contribution of V. Here I outline\
    \ the process and state the results.\n\nI began by reviewing the evidence for\
    \ $\beta$ and $\nu$ from the Bellum Hispaniense, the only work in our tradition\
    \ to have received a new edition since the publication of Hering (1963) and Brown\
    \ (1972). That is, for significant errors shared by the constituents of their\
    \ hypothetical hyperarchetypes ($\\mu$ and $\\pi$ for $\beta$, $S$ and $\\pi$\
    \ for $\nu$) where the other branch ($S$ or $\\mu$) preserves the reading of the\
    \ archetype.$^{21}$ Evidence for $\beta$ would support Holder's stella, evidence\
    \ for $\nu$ Hering's, and would both prove Brown's. This search proved inconclusive.\
    \ I then looked at the evidence for $\nu$ alluded but not discussed by Hering,\
    \ who considered a single passage device (BC 3.105.1 amium).$^{22}$ This allowed\
    \ me to add fourteen passages to the evidence of BC 3.105.1 for the existence\
    \ of $\nu$: two passages from BALex and twelve passages from BAfr with evidence,\
    \ variously weighty,\n\n$^{20}$ Diournin (1999).\n$^{21}$ For discussion of the\
    \ categories of 'significant error' and 'error' see *Studies*, p. 21. In brief,\
    \ an error that has not been written by Caesar, and a significant error is an\
    \ error that could not have been corrected by sceptical conjecture. Errors are\
    \ a subcategory of innovations, which are introduced into the text at some post-Caesar\
    \ point.\n$^{22}$ Hering departed on contradictory and inaccurate reports about\
    \ the reading of M at this. He presents the thus (1963, 76):3.105.1 amium $M'$\
    \ : appium $M'$ : appium $TV$ (Klotz; Faber says M amium). According to Brown's\
    \ collation and my own autography, however, there is no correction here in M,\
    \ which reads Appium, although it is true that the unevenly faded ink of this\
    \ part of the manuscript makes it more difficult to distinguish between original\
    \ text and correction here than it is elsewhere (cf. xxv below n. ap). The argument\
    \ for the agreement of S and an error here against an archetypal reading in $\\\
    mu$ is weaker if $M$ shares the error. For discussion see *Studies*, pp. 22–3."
