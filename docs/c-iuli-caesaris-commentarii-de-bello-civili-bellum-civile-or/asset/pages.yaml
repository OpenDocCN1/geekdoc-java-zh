  md: 'I have silently regularized the manuscripts’ inconsistent and discrepant representations
    of cardinal and ordinal numbers. For one, two, and three I use the inflected forms,
    and for most cardinal numbers higher than three I use Roman numerals, since the
    inflected forms of large numerical adjectives and adverbs are cumbersome in Latin
    and less perspicuous than their symbolic counterparts. However, I do spell out
    *mille* and the inflected forms of *milia*. Ordinal numbers are spelled out; this
    is particularly useful in connection with legions, where the difference between,
    say, ‘five legions’ and ‘the fifth legion’ is significant. Distributive numbers,
    which are infrequent in the text, are also spelled out.


    I used modern punctuation in the text since the punctuation in the manuscripts
    is neither consistent nor reliable. However, the paratactic style of much of this
    often makes it hard to determine whether to treat adjacent clauses as independent
    sentences or as parts of a compound sentence. On the whole I have preferred the
    former solution, even when the clauses are joined by conjunctions, particularly
    if a full stop increases the prominence of a significant action by making it conclude
    a sentence. Where a series of actions seems to gain from presentation as a series,
    on the other hand, I use commas instead of full stops. But in many instances there
    was rather little to tip the balance. In extended passages of indirect statement
    I use semicolons to indicate sentence breaks. Commas are used to articulate the
    text where clause structure and word order are not sufficient. But such is the
    clarity of Caesar’s prose that they are rarely needed. I occasionally use paired
    dashes to indicate a gap between the narrative and an embedded utterance such
    as an editorializing comment by the author, an afterthought, or a ‘snippet’ of
    indirect statement, where commas do not suffice. Where such utterances extend
    for a sentence or more full stops dont I use parentheses'
