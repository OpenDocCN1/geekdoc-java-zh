    it occurs)


    # C. HIS AND IIS


    Criteria for printing iis (and ii) or his (and hi) where the manuscripts have
    eis/his/iis/iis (and ei/hi/ii).


    +   1. his is used for general back references, particularly at sentence or clause
    opening, and in the qui... (i.e., where the relative clause precedes the antecedent)

    2. iis is used for back references to specific antecedents

    3. ii is used to set up relative clauses

