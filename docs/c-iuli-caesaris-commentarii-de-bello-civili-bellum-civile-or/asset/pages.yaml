    # C. Appendix critica


    In the Appendix critica I record the singular readings of the principal manuscripts
    in passages where the text is not in doubt. (Where a singular reading is useful
    for the constitution of the text it is recorded in the apparatus critic.) This
    collection of readings illustrates the character of the witnesses to the text,
    allowing the reader to see both the frequency and the types of errors in each
    error. Lemmata are provided to show the nature of the text. The spelling of the
    lemma is that of the printed text. Orthographical variants are not registered.
    An erroneous reading ascribed to Mᵉ (or Mᵐ) implies that Mᵉ (or Mᵐ) has the reading
    of the lemma. All singular omissions are listed. Omissions notable for length
    or content are also reported in the apparatus critic. An asterisk marks errors
    in M (or m) that prompted a correction—not necessarily a successful one—by Mᵐ
    (or mᵐ).


