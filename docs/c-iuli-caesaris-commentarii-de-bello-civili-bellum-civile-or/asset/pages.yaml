  md: '# PREFACE


    The Textual Transmission of Caesar''s Civil War, which is based on that collation,
    was not followed by the expected edition, but before her untimely death in 2009
    she very generously passed her collation on to me, a debt acknowledged but hardly
    repaid by the dedication to her memory of the edition it made possible. My own
    effort has been devoted primarily to the stemma, text, and critical apparatus.


    The identity of the principal manuscripts to be used in constituting the text
    of the Bellum ciurile and the non-Caesarian Bella has been reduced by now since
    Kübler''s 1894 edition of the BC, and the descent of four of them from now-lost
    manuscripts canonically called μ (the source of M and U) and π (the source of
    T and V) is relatively uncontroversial (but see further below).¹⁴ Over the course
    of the twentieth century the number of independent witnesses to the tradition
    was reduced by the elimination of derivative manuscripts, so that at present the
    text can be constituted from the four manuscripts mentioned (MUTV) plus a fifth,
    S, whose descent is hard to discern.¹⁵ The relationships among μ, π, and S have
    been defined variously.


    A bipartite stemma with a split between S and β (the source of μ and π¹⁶) was
    drawn by Holder in 1898 and adopted,


    > ¹⁴ For Brown''s elimination of 162 codices receptories, which was based on an
    arduous investigation rightfully called ''a notable advance'' (1983, 36), see
    chapter 4 of her 1972 book.\¹⁵ The fundamental studies are Bering (1963) and Brown
    (1972). These scholars propose constituting the text on the basis of either four
    (Hering) or five (Brown) manuscripts where Klot and others use as many. They differ
    over the constitution of V, on which see p. xxxiv.\¹⁶ An irritating confusion
    arises from the fact that Holder gave the name β to the common source of μ and
    π. This β is a descendant of the β of the BG tradition, which is roughly (very
    roughly) equivalent to the archetype of the BC tradition, henceforth will generally
    refer to Holder''s β, unless the other is specified.'
