    The attribution of BC 1 to ''Hircius Pansa'' is unique to U, although this gathered
    (a blend of parts of the names of the two consuls of 43 BC) also turns up in subscriptions
    to BG 8 in other manuscripts (see Hering 1987 for details). Likewise unique, but
    with partial parallels, is the expression LEGITANTVM in the scriptio to BG 8;
    other manuscripts have LEG. Both seem to be the culmination of a series of late-antique
    notes marking readily engagement with the text of the BG (see p. xiii above).
    These are otherwise found primarily in the α branch of the BG tradition, the presence
    of this formula in the BG’s β-family manuscript U is surprising and suggests inter-branch
    transmission.³ There is also a hint of this in connection with marginalia (see
