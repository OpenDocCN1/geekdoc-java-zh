  md: '# III. THE WITNESSES


    puzzling distribution of readings. The presence of variants shows a reader at
    on the text and makes it plausible that the archetype also contained corrections,
    although these are harder to spot in any one manuscript. Both types of archetypal
    doublet—variants and corrections—may give us a glimpse of a phase in the history
    of the text when copies other than the archetype were still in circulation; the
    other copies have no known descendants. Alternatively, these double readings may
    represent conjectures in the archetype.


    +   5. Glosses


    The text of the archetype incorporated expressions that were originally glosses;
    sometimes a gloss was adapted to fit the insertion context. These foreign bodies
    frequently gave rise to further innovations in the text of ω or its descendants.
    Most provide supplementary information, often from nearby in the text, but a few
    summarize the content. More glosses have been suspected than those I excise from
    the text. If excision of a gloss constitutes a viable alternative to the text
    I have printed, I mention it in the apparatus. Many many more can be found in
    Meusel''s *Tabula conjecturarum*; most are simply expressions that seem superfluous
    and are therefore felt to be alien to Caesar''s prose style.


    +   6. Book divisions


    In the archetype the beginnings and endings of the books of the Caesarian corpus
    were marked in some fashion. Precisely how the transition from one book to another
    was marked is not clear, however, since surviving manuscripts show different models,
    and sometimes more than one model in a single manuscript. At a minimum there is
    blank space between books, but there is very little consistency beyond that. In
    the paratextual material that sometimes fills the space between books we are'
