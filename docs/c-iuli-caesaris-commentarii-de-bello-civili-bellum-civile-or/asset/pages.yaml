    # IV. USING THIS EDITION


    Caesar''s *Bellum ciuele* has come down to us in a very imperfect state. The ongoing
    process of rendering readable and at least authentic has resulted in a text that
    differs in hundreds of spots from that transmitted by the manuscripts. The critical
    apparatus of this edition is designed to facilitate scrutiny of these textual
    repairs. I hope that readers will accept repairs not because they are persuasive,
    or better than others, better than nothing. Some of the damage incurred in the
    text''s transmission seems irreparable: where text has been lost, for example,
    or where rival repairs are equally (im)pl. These spots are marked with *** and
    † respectively. But the vast majority of the problem spots are amendable, and
    the apparatus presents the evidence and (in brief) the arguments for the repairs
    adopted or proposed.


    # A. Text


    In general terms the text of this edition aims to reproduce the text of the archetype
    of our tradition, as emended where it seems possible to restore a text closer
    to Caesar''s original. However, several expedients adopted to improve the legibility
    of the text constitute exceptions to this policy.'
