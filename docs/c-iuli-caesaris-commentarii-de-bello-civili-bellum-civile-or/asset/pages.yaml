  md: '# PREFACE


    Caesar, and completed (confeci) an unfinished commentary about Caesar''s military
    campaigns ‘to the end of his life’ (Hirtius. 8 pr. 2 usque ad exitum ... utiae
    Caesaris).³ It is unlikely, however, Hirtius actually completed more than a portion
    of this ambitious plan, for events so undertook the consul of 43, who died at
    Mutina in April of that year.


    Suetonius takes up the story with his report of a corpus of Caesarian texts that
    includes the Gallic War and the ‘Pompeian Civil War’ by Caesar himself, and Alexandrian,
    African, and Spanish Wars by other variously identified authors (Jul. 56.1).⁴
    This corpus bears only a general resemblance to the one Hirtius describes, which
    does not demarcate by military theatre the campaigns of 48–45 and which carries
    the story to the end of Caesar''s life. It matches the existing corpus Caesarianum
    in both its content and in the anonymity of the authors of BAlex, BAFr, and BHisp.
    Suetonius seems to have access to an exemplar of this corpus since he quotes several
    passages from it.


    When the corpus next comes into view, in Orosius’ fifth-century Historiae adversus
    paganos, the authorship issue has taken a new turn and Suetonius himself is deemed
    the author of the BG (6.7,2). Here again the presence of excerpts suggests that
    it was an exemplar of the work.


    > ³ The meaning of confeci is a disputed aspect of this precious document; see
    Canfora (1993, 45–6) and Gaertner-Hausburg (2013, 22–30) for discussion. The letter’s
    authenticity has been challenged: see Canfora (1993) and (2000) for the argument
    that it is a late-antique composition founded upon the extant corpus Caesarianum.
    Pecere by contrast views it as genuine ‘testimonianza pratenale’ del corpus Caesarianum’
    (2003, 1998). Gaertner-Hausburg conclude that its evidence is inconclusive on
    the subject of Hirtius’ contribution to the corpus (2013, exp. 30).


    > ⁴ Two earlier readers of the BC, Asinius Pollio and Lucan, are occasionally
    cited directly (Lucan) or indirectly (Pollio, via Plutarch and Appian) in the
    apparatus for evidence relevant to the constitution of the text, but nothing can
    be said about the form of the text they read.'
