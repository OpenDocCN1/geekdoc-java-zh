  md: '# I. HISTORY OF THE TEXT


    Suetonius and Orosius provide us with glimpses of readily engagement with the
    corpus Caesarianum, especially its first constituent, the BG, through late antiquity.
    This engagement comes most clearly into focus with the paratextual material in
    which named individuals declare themselves to have ''read'' each of the eight
    books of the BG.⁵ The basic formula for the subscriptions in BG 1-7 is LIVLIS
    CELVS CONSTANTVS V(IR) C(LARISSIMVS) LEGI.⁶ In the scriptio to BG 8 the addition
    of TANTVM the ''reading'' ceased at the end of the BG, but also that Constantinus
    was aware that there was more to the corpus.


    To trace the history of the text after the end of antiquity Hering and Brown use
    palaographic evidence. Hering dates the creation of the manuscript from which
    the two primary branches of the tradition were copied to the sixth century and
    the split itself into some time after the seventh century (1963, 95-6). That is,
    one copy survived from antiquity into the Middle Ages, and was copied at least
    twice some time early in the Carolingian period. One of those lost copies contained
    the Bellum ciuile and the non-Caesarian Bella, and survived long enough to become
    the source of the almost two hundred surviving manuscripts of these works (Brown
    1972, 42-65).


    That all the extant manuscripts are ultimately derived from a single archetype
    is shown by errors and trivial common to all them. These errors have accumulated
    as the text


    > ⁵ For the precise text of the BG subscriptions see Hering (1987, XVI-XVII).


    > ⁶ This formula is varied by a reference to an additional reader, Flavius Licerius
    Lupusinus, in BG 3, and by REREGI in a surprising β-family scriptio in U (see
    p. xiii). Lupuscin has been plausibly dated to the early sixth century but Constantinus
    is unknown; see Pecere (2003, 184-87).


    > ⁷ For the story of readily engagement with the text thenceforth for the section
    entitled ''Fortuna'' in Brown''s 1976 chapter on Caesar in volume 3 of the Catalog
    translationum et commentarium (88–97).'
