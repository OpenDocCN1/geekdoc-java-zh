  md: '# IV. USING THIS EDITION


    # D. Appendix orthographica


    That the manuscripts of our tradition are likely to preserve the spellings used
    by Caesar is suggested by the fact that although Gellius tells us that Caesar,
    *grauis auctor linguae Latinae* (4.16.8), the dative of fourth declension nouns
    without the (now standard) final -i and recommended the -u dative in de Analogia,
    our manuscripts very rarely have datives ending in -u, and commonly have the ''standard''
    forms.⁸⁸


    In the Appendix orthographica I list the regular categories of variation, such
    as the interchangeability of *aeaeoe*, or the use of assimilated and unassimilated
    prepositional prefixes. For names and other words of variable orthography I register
    the variants and indicate the form adopted for each. I also list the passages
    where I have deviated from the transmitted forms of demonstrative pronouns, for
    which the transmission is particularly unreliable. Finally, I list some common
    abbreviations and illustrate the corruptions to which they give.


