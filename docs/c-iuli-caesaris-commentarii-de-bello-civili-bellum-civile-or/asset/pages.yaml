  md: '# III. THE WITNESSES


    C. MARGINALIA

    In the pages devoted to the BC S’s marginalia are infrequent and mostly irrelevant
    to the constitution of the text; a few contemporary corrections are written in
    the margin. Another reader left traces of a desire to correct in the roughly fifty

    0‘quaere’ and three ‘deest’ symbols in S’s BC margins.


    D. CORRECTIONS

    S’s corrections generally recover the reading of its exemplar or alter a spelling.
    The corrector (S’) seems to have been the original scribe or a close contemporary.


    E. INNOVATIONS

    S, the earliest of our manuscripts, is also the most prolific in innovations.
    Its reading differs from the agreement of constituents of μ and π more than seven
    hundred times in the books of BC. The great majority of these innovations are
    typical errors, but in S the results are sometimes strikingly nonsensical, as
    can be seen in the Appendix critica. Some innovations that look like errors are
    probably better viewed as orthographical variants, since the orthography in S
    is erratic, particularly in the matter of single and double consonants. But many
    innovations aim to improve the text inherited from ν.(For details see Studies.)

    Some of S’s singular readings make it into the text in this edition, a number
    considerably smaller than that in previous editions, who believed S to have direct
    access to the archetype.⁶ But the philological acumen of the innovator whose legacy
    reaches us through S is all the more evident.


    > ⁶ By ‘direct’ I mean ‘unmediated by any reconstructible hyperarchetype’. The
    major transposition in S is hard to explain without positing an intermediary between
    S and ω. See e.g. Kübler (1894, IX-X) and Brown (1972, 23).'
