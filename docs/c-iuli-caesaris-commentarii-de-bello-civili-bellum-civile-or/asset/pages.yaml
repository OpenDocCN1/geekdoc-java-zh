    ω (one of the two branches of the BG tradition) was copied from a surviving ancient
    manuscript time after the seventh century c.e.

    ¹² See Hering (1963, v11) for a table listing the various siglia used for the
    principal manuscripts. Those that I use are the following M: Florence, Bibliotheca
