    the subscribiones of BC 3 and BAlex seems to belong in part to an earlier phase.


    The scribe who wrote ‘Incipit liber decemo de bello cilli’ on f. 95v at the beginning
    of BC 3 arrived at decimus adding one to the nomus he found at the beginning of
    BC 1 on f. 74r; he is not reproducing a transmitted text. There is no sign in
    the manuscript itself to alert him to the displacement of the actual end of the
    ‘ninth book’ (=BC 1), which is found on f. 105r. Furthermore, since the fact that
    a new book starts on f. 105r he believed that the next visible book division (f.
    121r) was that between the end of his ‘tenth book’ (BC 3) and the beginning of
    the Bellum Alexandrinum, which he arguably labeled liber undecimus.⁶⁴ The series
    continues with liber duodecimus at the beginning of the Bellum Africanum (f. 134r),
    whose author is Julius Caesar Constantinus, and tertius decimus at the beginning
    of the BHisp (f. 153r), he calls, uniquely, the Bellum Hispanicum (The script
    used for this series of notices is used only for these in S.) This seems to have
    compounded his innocent errors by erasing some text in the subscriptio written
    by the rubricator at the end of BC 3.³⁶⁵


    > ⁶⁴ Klot, followed by Fabre, gives a misleading report about the symbol but left
    it invisible; Holder transcribed but left it unexpanded. The subscriptio is written
    in two different styles. The majority of it is written by a hand that continues
    for twelve words into the text of BAlex 1.1 in a capital display script and red
    ink. Also written in red ink, but in the minuscule script by the scribe who supplied
    the references to liber nomus and liber decimus, is ‘liber xius(’. To differentiate
