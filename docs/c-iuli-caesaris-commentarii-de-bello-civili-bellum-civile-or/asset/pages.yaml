    # II. THE STEMMA


    The focus of modern editorial work on the *Bellum civile* has been on rationalizing
    the list of witnesses to be constituting the text.¹² The project of repairing
    the many problem spots of the tradition''s archetype is ongoing, while the problems
    that arose from the incomplete state in which Caesar left the work are probably
    beyond repair. Establishing a stem fundamentally different accounts of the transmission
    have been proposed in the past century or.


    The foundation of the present edition is a fresh collation of the principal manuscripts
    by Virginia Brown.¹¹³ Her 1972 book


