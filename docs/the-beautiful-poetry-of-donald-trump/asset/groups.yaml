    匹兹堡，不是巴黎\n我喜欢阅读\n- 失败的喜剧演员比尔·马赫：俳句\n我有最好的措辞\n一个梦想\n看看我最近被对待的方式。\n我最喜欢的两个词\n发生什么了？发生什么了？\n\
    我不知道\n你必须无所不能\n\n# 致谢\n\n# 编辑者的话\n\n有一个鲜为人知的替代事实是，第45任总统唐纳德·J·特朗普长期以来一直是一位卓越的诗人。这本书旨在纠正文学界对这一疏忽，并以以前未见的形式展示他最精彩、最能揭示本质的话语。无论是论述政治、性别问题还是他自己的卓越，特朗普的诗绝非如此简单。事实上，它们棒极了。它们揭示了特朗普敏感和害羞的一面，这可能会引发对这个人的重新评估。虚假媒体对唐纳德·特朗普提出的指控之一是他的英语使用懒散且重复，也许表明是一个头脑且缺乏想象力的思考者。但考虑一下《我最喜欢的两个词》（第117页）；《每个人爱我》中出现了十二次“爱”（第45页）；《一个优美、简单的生活》中出现了十二次“优美”（第3页）。有人指控认为，特朗普漫漫的言语风格证明了大脑的混乱。“头发慢慢干透了”，“我的思想很开阔”，“准备好迎接兴奋吧”以及“虚假新闻，伙计们”（第53、55、95和61页）展示了现代芭蕉或莱林式的精准与简洁。此外还有俳句（“小马可”、“可怜的罗西”、“琳·泰德”、“疯狂的麦格珍·凯利”、“狡猾的希拉里”、“低能量的杰布”、“变态的维纳”、“傻瓜的糖”、“巴拉克·奥巴马（又名巴里·索特罗）”、“疯疯的格伦·贝克”、“普京总统”、“失败的喜剧演员比尔·马赫”、“愚蠢的伊丽莎白·沃伦”以及“口很脏的参议员约翰·麦恩”——第49、81、47、75、25、99、13、39、6、33、109和93页）。它们都是正式的5-7-5节拍——这是一位具有极高自律和力量的作家的见证。在对某些诗歌进行浅层阅读时，批评者可能只能听到他们所认为的那个特朗普的声音。“照片式记忆；我有最好的措辞；好基因；我真的很富有；坏汉子们”和“我是最华丽的抱怨者”（第87、111、91、5和31页）是令人振奋的自夸。另一些诗歌在愤怒上是元初的，仿佛他凌晨4点在白炽火的怒火中醒来，为了把他们挖进马尔阿拉拉戈庄园去担心他性殖器的大小。特朗普在诗歌中完全暴露了他的脆弱，如“我想变好；发生什么了？；以及带有讽刺的“我赢了！”（第101、119页等）。在这里，我们窥见了真正的悲剧——一个与生就必须面对对自身缺陷的意识的人——这很难不动容。然而，他从未屈服于自恋。“我所要求的只有公平；我的手是正常的手，看看我最近被对待的方式”以及“我是世界上最不种族歧视的人”（第35、57、103、115和11页），破碎系统的不公以及偏见新闻报道对国家的影响驱动着特朗普走向诗歌。>\
    \ 梦想“我喜欢阅读”和“我不知道”（第113、107和121页）探索了特朗普内心最深、最不为人知的部分。“我是那个无辜（纯洁）的！”（第97页）标志着对形而上诗学的探索；实际上，这是一封给整个宇宙的情书。尽管有趣的是，特朗普在任何诗歌中未被提及，但我们也可以看到特朗普更传统的浪漫形象显现出来，例如“高中里的火辣小女孩”（第67页）和“看看这个宝宝”（第51页），而另外两首诗歌幽默地评论了性别关系问题，特朗普可能比他表现出的更懂（“尊重女性，我爱女性，我珍惜女性”以及“女性拥有历史上最伟大的成就之一”——第41和79页）。\n\
    \n然而，这本书纠正的关于DJT最大的误解，可能是他认为金钱和权力是终极目的。事实上，正如威尔尔德·奥文将他的战争经历融入诗歌，西尔维亚·普拉斯拉斯在自己的抑郁中发现黑暗的美，特朗普能够将他作为赢者的独特经历转化为24K的诗篇。他并不是为了几十亿财富而建立巨大的房地产帝国；他这样做是为了写出如“给自己享受生活能提供的非常非常最好的生活”和“我们必须把他们除掉”（第71和27页）。他去华盛顿不是为了被恐惧；他这样做是为了将他的经历炼化为。\n\
    \n"
