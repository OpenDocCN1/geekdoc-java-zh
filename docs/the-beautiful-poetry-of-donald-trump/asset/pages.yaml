- pgno: 10
  md: '# Editor’s notes


    It is a little known alternative fact that the 45th President, Donald J. Trump,
    has long been a remarkable poet. This book aims to redress this oversight on the
    part of the literary world, and showcase his finest and most revealing words in
    a previously unseen form. Whether discoursing on politics, walls, gender issues
    or his own excellent genes, Trump’s poems are nothing if not beautiful. Terrific,
    in fact. Amazing. And they reveal a sensitive and shyly artistic side to Trump
    that may prompt a reappraisal of the man even his critics.


    One of the charges levelled at Donald Trump in the fake news media is that his
    use of English is lazily repetitive, perhaps indicating a dunderheaded and unimaginative
    thinker. But consider works like ‘My two favorite words’ (p. 117). Repetitious
    yes, but to deliberate, mesmerising effect. And look at the words that come back
    to: ‘love twelve times in ‘Everybody me’ (p. 45); ‘beautiful’ twelve times in
    ‘A beautiful, simple life’ (p. 3). This is not the work of a monotonous man, but
    an aesthete for love and beauty are wells of feeling to return and draw from.


    There is a بمعنى here to the charge that Trumps rambling public speaking style
    evidences a disordered brain. ‘Slowly the hair dries, ‘I am open-minded’, Get
    ready for some excitement’ and ‘Fake news, folks’ (pp. 53, 55, 95 and 61) display
    the precision and brevity of a modern-day Basho or Larkin. Then there are the
    Trump Haikus (‘Little Marco’, ‘Sad sack Rosie’, ‘Lyin Ted’, ‘Crazy Mezon Kelly’,
    ‘Crooked Hillary’, ‘Low energy jeb’, ‘Deviant Artistic Weiner’, ‘Dopey Loyal Sugar’,
    ‘Barack Obama (aka Barry Sootoro), ‘Wacky Glen Beck’, ‘President Putin, ‘Failing
    comedian Bill Maher, ‘Goofy Elizabeth Warren’ and ‘Very mouthed Sen John McCain’
    – pp. 49, 81, 47, 75, 25, 99, 13, 39, 6, 33, 109, and 93). Are all in formal 5-7-5
    meter. All hit their targets like laser-guided Paveway missiles – testimony to
    a writer of supreme discipline and power.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'On a superficial reading of some of the poems, critics may hear only the voice
    of the Trump they think they know. ''Photographic memory; I have the best words;
    ''Good genes; I''m really rich, ''Bad Hombers'' and ''I am the most fabulous whiner''
    (pp. 87, 111, 91, 5 and 31) are bracing braggadocious. Others are elemental in
    their anger, as though he woke at 4 a.m. in a white-hot rage to gouge them into
    Mar-a-Lago letterpaper (''These people are losers; ''This country is going to
    hell in a handbook; ''Pervert alert; ''Does torture work?; ''Get the oil, the
    oil, get the oil, ''No days off'' and ''’ve got to stop the stupid'' (pp. 37,
    7, 77, 59, 69, 83 and 65). But there is more than technique and combative spirit.
    If we allow ourselves to listen, we can also hear the counterpoint of a quieter,
    less self-assured Trump, as he breaks off if his list of boasts in ''I the best''
    (p. 23) to worry about the size of his appendages.


    Trump fully exposes his vulnerablebelly in the poems ''I want to be good; ''What’s
    going on?; and the ironic ''I won!'' (pp. 101, 119 and). Here we get a glimpse
    of real tragedy – a man born win coming to terms with his awareness of his own
    failings – and it is hard to come away moved. Yet he never succumbs to self-obsession.
    ''All I ask is fairness; My hands are normal hands, ''Look at the way I have been
    treated lately'' and ''I am the least racist person there is'' (pp. 35, 57, 103,
    115 and 11), it the injustice of a broken system and the effect of biased journalism
    on the country that drives Trump to verse.


    > dream ‘I love to read’ and ‘I don’t know’ (pp. 113, 107 and 121) explore the
    innermost and leasted parts of Trump’s psyche. I am the innocent (pure) one!''
    (p. 97) marks a foray into metaphysical poetry; in effect, it is a love letter
    to the entire universe. Although Trump is, interestingly, not mentioned in any
    of the poems, we can also see Trump more traditional romantic persona rising to
    the fore in poems such as ''Hot little girl in high school (p. 67) and ''Look
    at this baby'' (p. 51) while two further poems comment wryly on the issue of gender
    relations, Trump perhaps understands better than he lets on (''Respect women,
    I love women, I cherish women'' and ''Women have one of the greats of all time
    – pp. 41 and 79).


    The greatest misconception about DJT corrected by this volume, however, may be
    the idea that he sees money and power as ends in themselves. In fact, as Wilfred
    Owen wrote his wartime experience into poetry, and Sylvia Plath found the dark
    beauty in her own depression, Trump is able to transform his unique experiences
    of being a winner into 24-karat verse. He didn''t build a huge real-estate'
  merge: -1
  img_proc: true
- pgno: 12
  md: "empire for the billions; he did it so he could write poems like ‘Treat yourself\
    \ to the\nvery, very best life has to offer and ‘We are going to have to get rid\
    \ of them’ (pp. 71\n 27). He didn’t go to Washington to be feared; he did it so\
    \ he could alchemise\nhis experiences into the poems ‘MAGA,’ ‘There’s something\
    \ on that we don’t\nknow about, ‘I make this promise; You can do anything and\
    \ We have by far\nhighest IQ of any Cabinet ever assembled (pp. 15, 85, 21, 73\
    \ and 29). And for his\nverse, he is prepared to risk everything – quite literally,\
    \ the Earth (We’ll be fine\nwith the environment’ and ‘Pittsburgh, not Paris’\
    \ – pp. 89 and 105).\n\nFor readers who have trouble enjoying Trump’s poems because\
    \ of their pre-\nexisting views of his politics, one poem in particular, the Whitmanesque\
    \ You have\nto be everything (p. 123), is key. Here Trump advances a sophisticated\
    \ theory of\nidentity. He posits that we contain many overlapping selves, each\
    \ enacting\ndifferent, sometimes contradictory performative roles. This helps\
    \ us see how\nTrump the President can coexist with Trump the CEO, Trump the TV\
    \ Mogul,\nTrump the Family Man – and Trump the Poet. You do not have to accept\
    \ one to\nappreciate the other.\n\nN.B. To ensure the poems’ clarity of meaning,\
    \ the Editor has changed\nreferences to people’s words in all capitals to lower\
    \ case, and, where aesthetically\nppasion reduced words in all capitals to lower\
    \ case, and, where aesthetically\nappropriate, removed the occasional exclamation\
    \ point and changed ampersands\ntoand’.\n\nRob Sears, 2017"
