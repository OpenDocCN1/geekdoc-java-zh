  \ 的情况：\n\n```java\n@Service\npublic class UserService {\n    @Autowired\n    private\
  \ UserRepository userRepository;\n\n    public User createUser(String email, String\
  \ password) {\n        if (email == null || !email.contains(\"@\")) {\n        \
  \    throw new ValidationException(\"Invalid email\");\n        }\n\n        if\
  \ (userRepository.findByEmail(email).isPresent()) {\n            throw new EmailExistsException();\n\
  \        }\n\n        User user = new User();\n        user.setEmail(email);\n \
  \       user.setPassword(passwordEncoder.encode(password));\n        return userRepository.save(user);\n\
  \    }\n}\n```\n\n<details><summary>查看答案</summary>\n\n**发现的违规项：**\n\n1. **基本类型过度使用**\
  \ - 使用 `String` 处理邮箱和密码，而不是值对象\n2. **校验位置错误** - 在控制器或服务中进行校验，而不是值对象\n3. **使用异常处理业务错误**\
  \ - `EmailExistsException` 应该是一个 `Cause`\n4. **可变实体** - 使用 setter 而不是不可变记录 (record)\n\
  5. **字段注入** - 使用 `@Autowired` 而不是构造函数注入\n6. **缺少用例接口** - 业务逻辑直接写在服务类中\n\n**重构后：**\n\
  \n```java\npublic interface CreateUser {\n    Promise<UserId> execute(CreateUserRequest\
  \ request);\n\n    record CreateUserRequest(String email, String password) {}\n\
  \    record ValidRequest(Email email, Password password) {}\n\n    interface CheckEmailUnique\
  \ {\n        Promise<Email> apply(Email email);\n    }\n\n    interface SaveUser\
  \ {\n        Promise<UserId> apply(ValidRequest request);\n    }\n\n    static CreateUser\
  \ create(CheckEmailUnique checkEmail, SaveUser saveUser) {\n        return request\
  \ -> ValidRequest.validRequest(request)\n            .async()\n            .flatMap(valid\
  \ -> checkEmail.apply(valid.email())\n                .map(email -> valid))\n  \
  \          .flatMap(saveUser::apply);\n    }\n}\n```\n</details>\n\n* * *\n\n###\
