  \ Quantity\n\n```java\npackage com.example.shop.domain.shared;\n\nimport org.pragmatica.lang.Result;\n\
  import org.pragmatica.lang.Cause;\nimport org.pragmatica.utils.Causes;\nimport org.pragmatica.utils.Verify;\n\
  \npublic record Quantity(int value) {\n    private static final Cause NOT_POSITIVE\
  \ = Causes.cause(\"数量必须为正数\");\n    private static final Cause EXCEEDS_LIMIT = Causes.cause(\"\
  数量不能超过 100\");\n\n    public static Result<Quantity> quantity(int raw) {\n     \
  \   return Verify.ensure(raw, Verify.Is::positive)\n            .mapError(_ -> NOT_POSITIVE)\n\
  \            .filter(EXCEEDS_LIMIT, v -> Verify.Is.lessThanOrEqualTo(v, 100))\n\
  \            .map(Quantity::new);\n    }\n\n    public boolean isGreaterThan(Quantity\
  \ other) {\n        return this.value > other.value;\n    }\n}\n```\n\n\n\n\n\n\
  ```java\npackage com.example.shop.domain.shared;\n\nimport org.pragmatica.lang.Result;\n\
  import org.pragmatica.lang.Cause;\nimport org.pragmatica.lang.utils.Causes;\n\n\
  import java.math.BigDecimal;\nimport java.math.RoundingMode;\n\npublic record Money(BigDecimal\
  \ value) {\n    private static final Cause NEGATIVE = Causes.cause(\"Money cannot\
  \ be negative\");\n    private static final Cause TOO_MANY_DECIMALS = Causes.cause(\"\
  Money allows max 2 decimal places\");\n\n    public static Result<Money> money(BigDecimal\
  \ raw) {\n        if (raw.compareTo(BigDecimal.ZERO) < 0) {\n            return\
  \ NEGATIVE.result();\n        }\n        if (raw.scale() > 2) {\n            return\
  \ TOO_MANY_DECIMALS.result();\n        }\n        return Result.success(new Money(raw.setScale(2,\
  \ RoundingMode.HALF_UP)));\n    }\n\n    public static Result<Money> money(String\
  \ raw) {\n        return Result.lift(() -> new BigDecimal(raw))\n            .mapError(_\
  \ -> Causes.cause(\"Invalid money format\"))\n            .flatMap(Money::money);\n\
  \    }\n\n    public Money add(Money other) {\n        return new Money(this.value.add(other.value));\n\
  \    }\n\n    public Money multiply(int quantity) {\n        return new Money(this.value.multiply(BigDecimal.valueOf(quantity)));\n\
  \    }\n\n    public static final Money ZERO = new Money(BigDecimal.ZERO.setScale(2,\
  \ RoundingMode.HALF_UP));\n}\n```\n\n### 地址\n```java\npackage com.example.shop.domain.shared;\n\
  \nimport org.pragmatica.lang.Result;\nimport org.pragmatica.lang.Cause;\nimport\
  \ org.pragmatica.lang.utils.Causes;\nimport org.pragmatica.lang.utils.Verify;\n\n\
  public record Address(\n    String street,\n    String city,\n    String postalCode,\n\
  \    String country\n)) {\n    private static final Cause STREET_REQUIRED = Causes.cause(\"\
  Street is required\");\n    private static final Cause CITY_REQUIRED = Causes.cause(\"\
  City is required\");\n    private static final Cause POSTAL_CODE_REQUIRED = Causes.cause(\"\
  Postal code is required\");\n    private static final Cause COUNTRY_REQUIRED = Causes.cause(\"\
  Country is required\");\n\n    public static Result<Address> address(String street,\
  \ String city, String postalCode, String country) {\n        return Result.all(\n\
  \            validateField(street, STREET_REQUIRED),\n            validateField(city,\
  \ CITY_REQUIRED),\n            validateField(postalCode, POSTAL_CODE_REQUIRED),\n\
  \            validateField(country, COUNTRY_REQUIRED)\n        ).map(Address::new);\n\
  \    }\n\n    private static Result<String> validateField(String value, Cause error)\
  \ {\n        return Verify.ensure(value, Verify::notBlank)\n            .mapError(_\
  \ -> error)\n            .map(String::trim);\n    }\n}\n```\n\n###  2 ：错误类型\n```java\n\
  package com.example.shop.usecase.placeorder;\n\nimport org.pragmatica.lang.Cause;\n\
  import org.pragmatica.lang.utils.Causes;\nimport com.example.shop.domain.shared.ProductId;\n\
  import com.example.shop.domain.shared.Quantity;\nimport java.util.List;\n\npublic\
  \ sealed interface OrderError extends Cause {\n    // 在枚举中分组的固定消息错误\n    enum General\
  \ implements OrderError {\n        EMPTY_ORDER(\"Order must contain at least item\"\
  ),\n        PAYMENT_DECLINED(\"Payment was declined\"),\n        PAYMENT_TIMEOUT(\"\
  Payment service timed out\"),\n        DATABASE_ERROR(\"Failed to save order\");\n\
  \n        private final String message;\n\n        General(String message) {\n \
  \           this.message = message;\n        }\n\n        @Override\n        public\
  \ String message() {\n            return message;\n        }\n    }\n\n    // 带有数据的错误\n\
  \    record InsufficientInventory(List<ProductId> products) implements OrderError\
  \ {\n        @Override\n        public String message() {\n            return \"\
  Insufficient inventory for products: \" +\n                products.stream().map(ProductId::value).toList();\n\
  \        }\n    }\n\n    record InvalidQuantity(ProductId productId, Quantity requested,\
  \ Quantity available)\n        implements OrderError {\n        @Override\n    \
  \    public String message() {\n            return String.format(\"Product %s: requested\
  \ %d, available %d\",\n                productId.value(), requested.value(), available.value());\n\
  \        }\n    }\n\n    record PaymentFailed(Throwable cause) implements OrderError\
  \ {\n        @Override\n        public String message() {\n            return \"\
  Payment processing failed: \" + Causes.fromThrowable(cause);\n        }\n    }\n\
  }\n```\n\n### 步骤 3：校验后的请求\n\n#### 原始请求（来自 API）\n```java\npackage com.example.shop.usecase.placeorder;\n\
  \nimport java.util.List;\n\npublic record OrderRequest(\n    String customerId,\n\
  \    List<LineItemRequest> items,\n    AddressRequest shippingAddress\n) {\n   \
  \ public record LineItemRequest(String productId, int quantity) {}\n    public record\
