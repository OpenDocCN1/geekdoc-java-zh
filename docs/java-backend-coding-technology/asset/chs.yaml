- "# Java 后端编码技术\n\n\n\n![](img/file0.png)\n\n1. 标题页\n2. 封面\n\n# 第 1 章：引言 - 代码统一\n\
  \n**基于：** `JBCT` v2.1.0 | **Pragmatica Lite Core:** 0.9.9\n\n## 你将学习到\n\n* 为什么代码统一在\
  \ AI 时代至关重要\n* `JBCT` 解决了什么\n* 设计决策五个五个标准\n* 基础概念：副作用、组合、单子（monads）\n\n**前提条件：**\
  \ 熟悉 `Java 21+` 特性（记录、密封接口、模式匹配）、lambda 表达式、泛型和基础函数式模式的中级及高级 Java 开发者。\n\n* * *\n\
  \n## 新时代下的代码\n\n软件开发的演进速度比以往任何时候都快。AI 驱动的代码生成工具在短短几年内已从实验性的新奇变成了日常工作流的支柱。我们现在与智能助手共同编写代码——而且这些助手可以生成整个函数、重构模块并建议架构模式。这种转变带来了传统编码实践未曾设计的新挑战。\n\
  \n从历史上看，代码承载着沉重的个人风格负担。每位开发者对命名、结构、错误处理和抽象都有自己的偏好。团队在代码审查中花费无数小时对主观选择进行争论。风格指南有所帮助，但它们无法捕捉那些决定代码可读性或可维护性的深层结构决策。当\
  \ AI 生成代码时，它继承了这些不一致性——我们只是不知道它在传达谁的偏好，或者它为什么会做出特定的选择。\n\n这产生了一个语境问题。当你阅读 AI 生成的代码时，你是在反向工程一个在数百万具有冲突风格的示例上训练的模型所做的决策。当\
  \ AI 读取你的代码以建议更改时，它必须从可能无法清晰表达意图的结构中推断你的意。认知负担不断叠加：开发者需要花费精力在自己的心理模型、代码结构以及 AI “认为”代码的含义之间进行转换。\n\
  \n与此同时，技术债正在静无中积累。与良好结构的细微偏离——这里一个校验检查，那里一个异常，一点混合的抽象层次——孤立来看似乎是无害的。但它们会产生复合影响。重构变得危险。测试变得困难。代码库变成了一个特例的集合，而不是一个连贯的系统。\n\
  \n> 传统方法没有提供清晰的机械化规则来规定何时重构或如何构建新代码，因此这些决策仍然是主观且不一致的。\n\n* * *\n\n## JBCT 方法\n\n\
  **Java 后端编码技术 (JBCT)** 提出了一种不同的方法：**减少有效选择的空间，直到对于大多数事情本质上只有一种良好的方法**。这并不是通过僵化的框架或沉重的仪式，而是通过一组小的规则，使结构变得可预测，重构变得机械化，并使业务逻辑与技术关注点清晰分离。\n\
  \n收益是累积的：\n\n**统一的结构**意味着人类可以阅读 AI 生成的代码而无需猜测隐藏的假设，AI 可以阅读人类代码而无需从语境中推断结构。无论是你写的、你的同事写的，还是\
  \ AI 助手生成的，用例看起来都一样。结构承载了意图。\n\n**极少的技术债**自然产生，因为重构规则被构建在方法论中。当一个函数增长到一个清晰职责之外时，规则会准确地告诉你如何拆分它。当一个组件被重用时，有一个明显的地方可以移动它。债务不会积累，因为预防比清理更廉。。\n\
  \n**紧密的业务建模**发生在你不再与技术噪音作斗争时。值对象（Value objects）在构造时强制执行领域不变性。用例读起来像业务流程，因为每一步只做一件事。错误是领域概念，而不是堆栈跟踪。产品所有者可以阅读代码结构并识别出他们的需求。\n\
  \n**需求发现**变得系统化。当你将代码结构化为 `校验 → 步骤 → 组合` 时，缺漏就会变得显而易见。当你定义值对象时，缺失的校验规则就会出现。当你无法清晰地命名一个步骤时，不清晰的业务逻辑就会暴露。当你将错误建模为显式类型时，边缘情况就会显现。\n\
  \n**作为可读语言的业务逻辑**发生在模式成为词汇时。四种返回类型、`解析而非校验`（parse-don’t-validate）以及固定的模式目录形成了在代码中表达领域概念的一致方式。任何理解领域的人几乎可以瞬间上手新的代码库。\n\
  \n**确定性的代码生成**当从需求到代码的映射是机械的时变得变得可能。给定一个用例规范——输入、输出、校验规则、步骤——本质上只有一种正确的结构。不同的开发者（或\
  \ AI 助手）应该产生几乎相同的实现。\n\n> **一场更广泛的运动：** `JBCT` 在追求编译时保证和类型驱动设计方面并不孤单。类似的哲学出现在数据库设计（7NF\
  \ 类型优先方法）、分布式系统和函数式编程社区中。其共同线索是：将错误从运行时转移到编译时，使无效状态变得不可表示，并通过显式合约降低认知负载。\n\n* *\
  \ *\n\n## 五个评估标准\n\n在深入研究模式之前，先了解我们如何在 `JBCT` 中评估每一个决策。传统的“最佳实践”依赖于主观的“可读性”——但这意味着什么？`JBCT`\
  \ 使用了五个客观标准：\n\n1. **心理负担** - 你必须跟踪的“不要忘记……”和“记住……”项。越低越好。\n2. **业务/技术比例** - 领域概念与框架/基础设施噪音的比例。领域可见性越高越好。\n\
  3. **设计影响** - 这种方法是强制执行良好模式还是允许糟糕模式？是改进了一致性还是破坏了它？\n4. **可靠性** - 是编译器捕获错误，还是必须由你记住？类型安全消除了某类错误。\n\
  5. **复杂度** - 元素、连接和隐藏耦合的数量。活动部分越少越好。\n\n这些不是偏好——它们是可衡量的。当我们说“不要使用业务异常”时，我们证明了这一点：-\
  \ **心理负担**：检查异常污染签名；未检查异常是不可见的（Result +2）- **可靠性**：异常跳过了类型检查器；Result 使失败显式化（Result\
  \ +1）- **复杂度**：异常层次结构产生了耦合（Result +1）。\n\n### 示例：应用标准\n\n**问题：** 我们在用例中使用 `@Transactional`\
  \ 还是显式事务管理？\n\n**使用五个标准进行分析：**\n\n1. **心理负担：**\n   - `@Transactional`：行为——必须记住在事务中运行，需要理解代理机制。\n\
  \   - 显式：事务边界在代码中可见。\n   - **Result 胜出 +2**\n2. **业务/技术比例：**\n   - 两种方法都是技术基础设施。\n\
  \   - **平局（0）**\n3. **设计影响：**\n   - `@Transactional`：将业务逻辑与 Spring 框架耦合。\n   - 显式：业务逻辑保持框架无关。\n\
  \   - **Result 胜出 +2**\n4. **可靠性：**\n   - `@Transactional`：在某些情况下静默失败（私有方法、自调用）。\n\
  \   - 显式：如果忘记处理事务，编译器会报错。\n   - **Result 胜出 +1**\n5. **复杂度：**\n   - `@Transactional`：隐藏的控制流。\n\
  \   - 显式：控制流可见可见。\n   - **Result 胜出 +1**\n\n**结论：使用显式事务管理（切面模式）** - 总计 Result 胜出\
  \ +6 分。\n\n这就是 `JBCT` 中做出每一个决策的方式——不是基于意见，而是基于五个维度的可衡量影响。\n\n* * *\n\n## 基础概念\n\n\
  ### 什么是副作用？\n\n\n\n\n\n`side effect`（副作用）是指函数在计算和返回值之外执行的所有操作：\n\n*   写入数据库\n* \
  \  发起 HTTP 调用\n*   写入文件\n*   打印到控制台\n*   修改全局变量\n*   抛出异常\n\n`Pure function`（纯函数，无副作用）：\n\
  \n```java\npublic int add(int a, int b) {\n    return a + b;  // 只计算并返回\n}\n```\n\
  \n`Impure function`（不纯函数，有副作用）：\n\n```java\npublic void saveUser(User user) {\n\
  \    database.save(user);  // 副作用：修改外部状态\n    logger.info(\"User saved\");  // 副作用：写入日志\n\
  }\n```\n\n为什么要关注？`纯函数是预测的`：相同的输入总是产生相同的输出。它们易于测试（不需要 mock），并且在任何地方、任何时间运行都是安全的。\n\
  \n`不纯函数是必要的`——你的应用程序必须与世界交互——但它们是`不可预测的`：网络可能失败、磁盘可能满、数据库可能宕机。\n\nJBCT 的方法：`将副作用推向边缘`。保持业务逻辑的纯洁。将不纯的操作隔离在适配器叶节点中。这使得你的核心逻辑易于测试和推理。\n\
  \n### 什么是组合（Composition）？\n\n`组合`意味着通过组合简单的操作来构建复杂的操作。\n\n传统的命令式风格：\n\n```java\n\
  public String processUser(String email) {\n    String trimmed = email.trim();\n\
  \    String lowercase = trimmed.toLowerCase();\n    String validated = validate(lowercase);\n\
  \    String saved = save(validated);\n    return saved;\n}\n```\n\n函数式组合：\n\n```java\n\
  public Result<String> processUser(String email) {\n    return Result.success(email)\n\
  \                 .map(String::trim)\n                 .map(String::toLowerCase)\n\
  \                 .flatMap(this::validate)\n                 .flatMap(this::save);\n\
  }\n```\n\n第二个版本`链链`了操作。每一步都将上一步的输出作为输入。数据流过流水线。\n\n为什么这很重要：组合让你能够`从简单组件构建复杂逻辑`，而不需要中间变量或在每一步中进行显式的错误检查。结构本身处理了错误传递。\n\
  \n### 什么是 Monad（智能包装器）？\n\n在 JBCT 中，我们使用封装值并控制操作如何应用到值上的类型。\n\n> **注意：** 在函数式编程中，这些被称为\
  \ *monads*。本书同时使用这两个术语——为了直观使用“智能包装器”，为了精确使用“monad”。\n\n`一个 monad 控制你的操作在何时以及是否运行。`\n\
  \n#### 核心洞察：控制反转\n\n传统的代码：**你**决定什么时候做某事。Monad 代码：**monad** 决定什么时候做某事。\n\n思考：“执行此操作，`如果/当值可用时`。”\n\
  \n```java\n// 传统：由你检查，由你决定\nString result;\nif (email != null) {\n    String trimmed\
  \ = email.trim();\n    if (isValid(trimmed)) {\n        result = save(trimmed);\n\
  \        if (result == null) {\n            // 错误：保存失败\n        }\n    } else {\n\
  \        // 错误：无效\n    }\n} else {\n    // 错误：输入为空\n}\n\n// Monad：由包装器检查，由包装器决定\n\
  Result<String> result = Result.success(email)\n                              .map(String::trim)\n\
  \                              .flatMap(this::validate)\n                      \
  \        .flatMap(this::save);\n```\n\n你是在说：“这是对该值要执行的操作……**如果**你有它并且**当**你准备好时。”\n\
  \n*   `Option`：“**如果**值存在，我会应用你的操作”\n*   `Result`：“**如果**目前为止没有错误，我会应用你的操作”\n* \
  \  `Promise`：“**当**异步结果到达时，我会应用你的操作”\n\n每个 monad 都有：\n*   `map`：“如果/当值可用时，转换该值”\n\
  *   `flatMap`：“如果/当当前操作成功时，链式另一个操作”\n\n### 实用主义，而非纯粹\n\nJBCT 使用*实用主义的* monads。不要求遵守\
  \ Monad 法。纯洁性不是目标。`可预测性才是。`\n\n我们借用函数式模式是因为它们让代码更具预测性和可组合性，而不是因为我们在追求理论上的纯洁性。副作用会发生。I/O\
  \ 是必要的。目标是让副作用变得*显式*且*隔离*，而不是消除它们。\n\n如果你是从 Haskell 或 Scala 过来的，请调整你的预期：这是实用的 Java，而不是学术界的\
  \ FP。\n\n### 不变性（Immutability）\n\n传递给操作的所有输入数据必须被视为不可变且只读。这并不是为了教条式的函数纯洁性——而是为了维护使并发代码可预测的安全性保证。\n\
  \n**什么必须是不可变的：**\n*   在并行操作之间传递的数据（Fork-Join 模式）\n*   任何操作的输入参数\n*   从用例返回的响应类型\n\
  *   作为 map 键或集合中的值对象\n\n**什么可以是可变的（线程限制）：**\n*   单次操作内的局部状态（累加器、构建器）\n*   适配器边界内的工作对象\n\
  *   局限于顺序模式的状态\n\n**核心原则：** 当状态是**线程限制**（由单线程访问）时，可变性是安全的。并行模式需要不可变输入，因为不存在隔离。\n\
  \n* * *\n\n## 谁应该使用 JBCT？\n\n**如果你符合以下情况，你应该使用它：**\n*   你正在构建后端服务（REST API、微服务、批处理程序）\n\
  *   你希望代码易于新成员理解\n*   你正在与 AI 辅助编程工作，并希望生成的代码与你的结构一致\n*   你重视可测试性并希望尽量减少 mock\n\
  *   你厌倦了架构争论，想要机械化的规则\n\n**以下情况下可能不适用：**\n*   你正在构建 UI 应用（关注点和模式不同）\n*   你需要极端的性能优化（存在抽象开销）\n\
  *   你的团队深度投入了冲突的架构\n*   你更倾向于带有状态的面向对象的设计\n\n* * *\n\n## 核心要点\n\n1.  **JBCT 统一了代码**——让代码在团队和\
  \ AI 协作之间具有预测性\n2.  **五个标准**指导所有决策——心理开销、业务/技术比例、设计影响、可靠性、复杂度\n3.  **副作用位于边缘**——保持业务逻辑纯洁，在适配器中隔离\
  \ I/O\n4.  **组合优于命令式**——链式操作，让结构处理错误\n5.  **Monad 反转了控制**——你描述转换，monad 处理执行\n\n\
  * * *\n\n## 练习\n\n参见 附录 B 获取以下练习：\n*   练习 1.1：返回类型选择\n*   练习 1.2：Option vs Result\n\
  \n* * *\n\n## 下一步\n\n第 2 章 介绍了构成其他所有内容的四种返回类型：`T`、`Option<T>`、`Result<T>` 和 `Promise<T>`。你将学习何时使用每种类型、它们如何组合，以及为什么这四个类型就是你需要的全部。\n\
  \n\n\n\n\n## T - 同步，不会失败，始终存在\n\n当操作是纯计算，且没有失败或数据丢失的可能性时使用。例如数学计算、有效数据的转换、简单的 getter。如果你无法想象该函数可能失败或返回空值，则它返回\
  \ `T`。\n\n```\n[](#cb6-1)public record FullName(String value) {\n[](#cb6-2)    public\
  \ String initials() {  // 返回 String (T)\n[](#cb6-3)        return value.chars()\n\
  [](#cb6-4)                    .filter(Character::isUpperCase)\n[](#cb6-5)      \
  \              .collect(StringBuilder::new,\n[](#cb6-6)                        \
  \     StringBuilder::appendCodePoint,\n[](#cb6-7)                             StringBuilder::append)\n\
  [](#cb6-8)                    .toString();\n[](#cb6-9)    }\n[](#cb6-10)}\n```\n\
  \n签名 `String initials()` 告诉你：它总是成功，总是返回一个值，并立即完成。\n\n**返回 `T` 的场景：**\n- 纯计算（例如 `calculateTotal`、`formatCurrency`）\n\
  - 已经有效的数据转换（例如 `toUpperCase`、`extractId`）\n- 必需字段的 getter（例如 `user.email()`、`order.total()`）\n\
  \n* * *\n\n## Option<T> - 同步，不会失败，可能缺失\n\n当缺失是一个有效结果但不会失败时使用。例如可能找不到任何内容的查找、可选配置、或者当\
  \ null 在语义上具有意义的数据库列。关键在于：数据缺失是正常的业务行为，而不是错误。\n\n```\n[](#cb7-1)public interface\
  \ PreferenceRepository {\n[](#cb7-2)    Option<Theme> findThemePreference(UserId\
  \ id);  // 可能未设置\n[](#cb7-3)}\n```\n\n签名 `Option<Theme>` 告诉你：它总是成功，但值可能不存在。调用者必须处理两种情况。\n\
  \n**返回 `Option<T>` 的场景：**\n- 查找可能没有找到结果（例如 `findByUsername`）\n- 字段在领域中确实是可选的（例如\
  \ `user.middleName()`）\n- “未找到”是一个正常结果，而不是错误\n\n* * *\n\n## Result<T> - 同步，可能失败，业务/验证错误\n\
  \n当操作可能因为业务或验证原因而失败时使用。例如解析输入、强制不变不变、可能被违反的业务规则。失败用强类型的 `Cause` 对象表示，而不是异常。\n\n\
  > **注意：** `Cause` 代表领域失败或错误原因。将其视为“失败原因（FailureReason）”或“领域错误（DomainError）”——业务操作失败的强类型表示。\n\
  \n```\n[](#cb8-1)public record Email(String value) {\n[](#cb8-2)    private static\
  \ final Pattern EMAIL_PATTERN =\n[](#cb8-3)        Pattern.compile(\"^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+$\"\
  );\n[](#cb8-4)    private static final Fn1<Cause, String> INVALID_EMAIL =\n[](#cb8-5)\
  \        Causes.forOneValue(\"Invalid email format: %s\");\n[](#cb8-6)\n[](#cb8-7)\
  \    public static Result<Email> email(String raw) {\n[](#cb8-8)        return Verify.ensure(raw,\
  \ Verify::Is::notNull)\n[](#cb8-9)                     .map(String::trim)\n[](#cb8-10)\
  \                     .filter(INVALID_EMAIL, EMAIL_PATTERN.asMatchPredicate())\n\
  [](#cb8-11)                     .map(Email::new);\n[](#cb8-12)    }\n[](#cb8-13)}\n\
  ```\n\n签名 `Result<Email>` 告诉你：它可能失败（格式无效），立即完成，且失败是强类型的。\n\n**返回 `Result<T>` 的场景：**\n\
  - 验证输入（例如 `Email.email(raw)`）\n- 强制业务规则（例如 `checkInvariant`）\n- 解析或构建领域对象（例如 `OrderId.orderId(raw)`）\n\
  \n> **为什么使用 Result：错误处理哲学**\n\n> 错误处理逻辑应该位于存在业务上下文以做出决策的地方。有时，这接近于错误发生的地方；有时，错误会原封地传递，因为只有调用者拥有足够的上下文来做决定。\n\
  \n> 不同的机制有不同的权衡：\n\n> | 机制 | 透明度 | 易用性 | 可靠性 |\n> | --- | --- | --- | --- |\n> |\
  \ **检查异常 (Checked exceptions)** | ✅ 显式 | ❌ 冗长、耦合 | ✅ 编译器强制 |\n> | **非异常 (Unchecked\
  \ exceptions)** | ❌ 隐藏 | ⚠️ 心理负担 | ❌ 静默失败 |\n> | **错误作为值 (Go)** | ✅ 可见 | ❌ 手动传递\
  \ | ❌ 易被忽略 |\n> | **函数式 (Result)** | ✅ 类型内可见 | ✅ 单子组合 | ✅ 编译器强制 |\n\n> `Result<T>`\
  \ 结合了优点：签名显式、通过 `map`/`flatMap` 实现良好的易用性、经过编译器验证的处理。\n\n* * *\n\n## Promise<T> -\
  \ 异步，可能失败\n\n用于任何 I/O 操作、外部服务调用或可能阻塞的计算。`Promise<T>` 在语义上等于 `Result<T>`，但它是异步的——失败包含在\
  \ Promise 内部，而不是嵌套在内部。\n\n```\n[](#cb9-1)public interface AccountRepository {\n\
  [](#cb9-2)    Promise<Account> findById(AccountId id);\n[](#cb9-3)}\n```\n\n签名 `Promise<Account>`\
  \ 告诉你：它可能失败，异步完成。\n\n**返回 `Promise<T>` 的场景：**\n- 任何 I/O 操作（数据库、文件系统）\n- 外部服务调用\n\
  - 可能阻塞或耗时的操作\n\n```\n\n\n\n\n\n| `Promise<Option<Result<T>>>` | 三层嵌套 - 架构异味 |\n\n\
  **规则：** 每个单子领域的关注点（可选性、失败、异步）在返回类型中最多出现一次。\n\n## 为什么不使用 Java 内置类型？\n\n**“我不能直接用\
  \ `Optional`、`CompletableFuture` 和异常吗？”**\n\n你可以那么做，但你会遇到这些问题：\n\n| Java 方案 | 问题\
  \ | JBCT 解决方案 |\n| --- | --- | --- |\n| `return null` | 隐藏的可选性 → 运行时 NPE | `Option<T>`\
  \ 在类型中显式表示 |\n| `Optional<T> ` | 无法表示失败 | `Result<T>` 用于强类型错误 |\n| `try-catch` |\
  \ 不可见见的控制流 | `Result<T>` - 将错误视为值 |\n| `CompletableFuture<T>` | 复杂的错误处理 | `Promise<T>`\
  \ 一致的模式 |\n\n**核心差异：**\n- **类型显式化**：签名告知你失败模式，没有隐藏的异常\n- **一致的组合**：`map`/`flatMap`\
  \ 在所有类型上的行为相同\n- **无嵌套**：每个类型层级处理一个关注点\n- **更好的推断**：AI 仅通过类型即可生成正确的错误处理\n\n## 类型转换\n\
  \n### 提升 (Lifting)：在类型之间移动\n\n你可以将一个“低级”类型提升为“高级”类型：\n\n```\n// T → Option/Result/Promise\n\
  Option.option(value)\nResult.success(value)\nPromise.success(value)\n// Option →\
  \ Result/Promise\noption.toResult(cause)\noption.async(cause)\n// Result → Promise\n\
  result.async()\n```\n\n示例：\n\n```java\npublic Promise<Response> execute(Request\
  \ request) {\n    return ValidRequest.validRequest(request)\n                  \
  \     .async()  // Result → Promise\n                       .flatMap(step1::apply)\n\
  \                       .flatMap(step2::apply);\n}\n```\n\n### 禁止嵌套：`Promise<Result<T>>`\n\
  \n**禁止使用 `Promise<Result<T>>`。** `Promise<T>` 已经携带了失败信息 - 嵌套 `Result` 会创建两个错误通道。\n\
  \n**错误示例：**\n\n```java\nPromise<Result<User>> loadUser(UserId id) { /* ... */ }\n\
  \n// 调用者必须解包两次 - 荒谬的仪式感\nloadUser(id)\n    .flatMap(resultUser -> resultUser.fold(\n\
  \        Cause::promise,\n        user -> Promise.success(user)\n    ));\n```\n\n\
  **正确示例：**\n\n```java\nPromise<User> loadUser(UserId id) { /* ... */ }\n\n// 调用者只需链式调用\n\
  return loadUser(id).flatMap(nextStep);\n```\n\n### 允许嵌套：`Result<Option<T>>`\n\n\
  少数允许 `Result<Option<T>>` 用于“可能会通过失败的可选值”。\n\n```java\nResult<Option<ReferralCode>>\
  \ refCode = ReferralCode.referralCode(input);\n// Success(None) = 未提供，有效\n// Success(Some(code))\
  \ = 已提供且有效\n// Failure(cause) = 已提供但无效\n```\n\n使用 `Verify.ensureOption()` (Pragmatica\
  \ Lite 0.9.0+) 实现此模式：\n\n```java\npublic static Result<Option<ReferralCode>> referralCode(String\
  \ raw) {\n    return Verify.ensureOption(\n        Option.option(raw).map(String::trim).filter(s\
  \ -> !s.isEmpty()),\n        PATTERN.asMatchPredicate(),\n        INVALID_FORMAT\n\
  \    ).map(opt -> opt.map(ReferralCode::new));\n}\n```\n\n## API 快速参考\n\n## 类型转换\n\
  \n```\n// Option 转换\noption.toResult(cause)      // Option → Result\noption.async(cause)\
  \         // Option → Promise\noption.toOptional()         // Option → Java Optional\n\
  \n// Result 转换\nresult.async()              // Result → Promise\nresult.option()\
  \             // Result → Option (丢失错误)\n\n// Promise 转换\npromise.await()      \
  \       // Promise → Result (阻塞)\npromise.await(timeout)      // Promise → Result\
  \ (带超时)\n\n// Cause 转换（推荐）\ncause.result()              // Cause → Result\ncause.promise()\
  \             // Cause → Promise\n```\n\n### 创建实例\n\n```\n// Option\nOption.some(value)\n\
  Option.none()\nOption.option(nullable)     // null → none\n// Result\nResult.success(value)\n\
  cause.result()              // 推荐用于失败\n// Promise\nPromise.success(value)\ncause.promise()\
  \             // 推荐用于失败\nPromise.promise()           // 未解析\n```\n\n## 核心要点\n\n\
  1. **四种类型涵盖所有情况**：`Option`, `Result`, `Promise`\n2. **签名说明一切**：失败模式、可选性、同步性\n3.\
  \ **提升，永不嵌套**：转换为高级类型，永远不要使用 `Promise<Result<T>>`\n4. **一致的组合**：所有类型均使用相同的 `map`/`flatMap`\n\
  5. **使用 Cause 方法**：优先使用 `cause.result()` 而非 `Result.failure(cause)`\n\n## 练习\n\n\
  参见 `附录 B` 获取练习：\n- 练习 1.3：类型提升\n- 练习 1.4：Cause 的创建\n- 练习 1.5：Pragmatica 操作\n\n##\
  \ 接下来\n\n`第 3 章` 将介绍 Pragmatica Lite Core - 提供这些类型的库。你将深入学习 API 并查看常见模式。\n\n# 第\
  \ 3 章：Pragmatica 基础\n\n本章介绍 Pragmatica Lite Core —— 一个为 JBCT 提供基础类型的库。你将学习为什么存在这个库、它的设计哲学以及如何使用其核心功能。\n\
  \n## 为什么自定义库？\n\nJava 提供了 `Optional` 和 `CompletableFuture`。为什么不使用它们？\n\n### Java\
  \ 内置类型的问题\n\n| 类型 | 问题 |\n| --- | --- |\n| `Optional` | 没有错误通道 - 你知道某些东西丢失了但不知道为什么\
  \ |\n| `Optional` | 并非为验证设计 - `orElseThrow` 会丢失上下文 |\n| `CompletableFuture` | 使用异常作为控制流\
  \ - 检查异常无法组合 |\n| `CompletableFuture` | API 冗长 - `thenApply`, `thenCompose`, `exceptionally`\
  \ |\n| `null` | 十亿美元错误 - 没有类型安全，运行时会发生 NPE |\n\n### JBCT 需要什么\n\n1. **四种不同的返回类型**：每种类型都有清晰的语义\n\
  2. **可组合的错误处理**：将错误视为值，而非异常\n3. **一致的 API**：所有类型使用相同的方法名\n4. **类型安全的转换**：在类型之间提升而不丢失信息\n\
  \nPragmatica Lite Core 正好提供了这些功能。\n\n## 安装\n\n**Maven (推荐)：**\n\n```xml\n<dependency>\n\
  \    <groupId>org.pragmatica-lite</groupId>\n    <artifactId>core</artifactId>\n\
  \    <version>0.9.9</version>\n</dependency>\n```\n\n**Gradle:**\n\n```gradle\n\
  implementation 'org.pragmatica-lite:core:0.9.9'\n```\n\n## 四大核心类型\n\n### `Option<T>`\
  \ - 值可能缺失\n\n```java\nimport org.pragmatica.lang.Option;\n\nOption<User> user =\
  \ Option.some(new User(\"Alice\"));\nOption<User> nobody = Option.none();\nOption<User>\
  \ fromNullable = Option.option(possiblyNullValue);\n```\n\n**使用场景：**值可能不存在，但缺失并不算作错误。\n\
  \n**示例：** 缓存查询、可选配置、搜索结果。\n\n### `Result<T>` - 操作可能失败\n\n```java\nimport org.pragmatica.lang.Result;\n\
  import org.pragmatica.lang.Cause;\n\nResult<Email> valid = Result.success(new Email(\"\
  user@example.com\"));\nResult<Email> invalid = INVALID_EMAIL.result();  // 推荐：流式风格\n\
  \n// 也可以（但冗长）\nResult<Email> invalid2 = Causes.cause(\"Invalid format\").result();\n\
  ```\n\n**使用场景：**可能会带强类型错误失败的同步操作。\n\n**示例：** 验证、解析、业务规则检查。\n\n\n\n\n\n### `Promise<T>`\
  \ - 异步操作可能失败\n\n```java\nimport org.pragmatica.lang.Promise;\n\nPromise<User> fetching\
  \ = Promise.promise();  // 未解析\nPromise<User> ready = Promise.success(user);  //\
  \ 已解析\nPromise<User> failed = USER_NOT_FOUND.promise();  // 优选：链式风格\n```\n\n**使用场景：**\
  \ 异步操作（I/O、外部服务）。\n\n**示例：** 数据库查询、HTTP 调用、文件读取。\n\n### Cause - 类型化错误\n\n```java\n\
  import org.pragmatica.lang.Cause;\nimport org.pragmatica.lang.utils.Causes;\n\n\
  // 简单错误\nCause simple = Causes.cause(\"Something went wrong\");\n\n// 带有上下文的错误\n\
  Fn1<Cause, String> INVALID_EMAIL = Causes.forOneValue(\"Invalid email: %s\");\n\
  Cause withContext = INVALID_EMAIL.apply(\"not-an-email\");\n\n// 来自异常的错误\nCause\
  \ fromException = Causes.fromThrowable(exception);\n```\n\n**使用场景：** 在 `Result`\
  \ 或 `Promise` 中表示失败原因。\n\n***\n\n## 设计哲学\n\n### 一致的方法名\n\n所有类型在适用情况下共享相同的词汇表：\n\n\
  | 方法 | Option | Result | Promise |\n| --- | --- | --- | --- |\n| 转换值 | `map()` |\
  \ `map()` | `map()` |\n| 链式操作 | `flatMap()` | `flatMap()` | `flatMap()` |\n| 根据条件过滤\
  \ | - | `filter()` | `filter()` |\n| 提供备备方案 | `or()` | `or()` | `or()` |\n| 处理成功\
  \ | `onPresent()` | `onSuccess()` | `onSuccess()` |\n| 处理失败 | `onEmpty()` | `onFailure()`\
  \ | `onFailure()` |\n\n### 优先使用 Cause 方法而非工厂方法\n\n```java\n// 应当这样做：使用 Cause 方法\n\
  Cause error = VALIDATION_FAILED;\nreturn error.result();   // Result<T>\nreturn\
  \ error.promise();  // Promise<T>\n\n// 避免：使用带有 Cause 的工厂方法\nreturn Result.failure(error);\
  \   // 可用但冗长\nreturn Promise.failure(error);  // 可用但冗长\n```\n\n### 向高阶类型提升，而非低阶类型\n\
  \n```java\n// 向上提升是安全的\nOption<T> option = ...;\nResult<T> result = option.toResult(CAUSE_IF_EMPTY);\n\
  Promise<T> promise = result.async();\n\n// 向下转换会丢失信息\nResult<T> result = ...;\n\
  Option<T> option = result.option();  // 丢失错误信息！\n```\n\n***\n\n## 类型转换\n\n### Option\
  \ 转换\n\n```java\nOption<User> option = findUser(id);\n\n// Option -> Result（为空情况提供\
  \ cause）\nResult<User> result = option.toResult(USER_NOT_FOUND);\n\n// Option ->\
  \ Promise（为空情况提供 cause）\nPromise<User> promise = option.async(USER_NOT_FOUND);\n\
  \n// Option -> Java Optional（仅用于互操作性）\nOptional<User> javaOptional = option.toOptional();\n\
  ```\n\n### Result 转换\n\n```java\nResult<User> result = validateUser(input);\n\n\
  // Result -> Promise（提升到异步上下文）\nPromise<User> promise = result.async();\n\n// Result\
  \ -> Option（丢失错误 - 请谨慎使用）\nOption<User> option = result.option();\n```\n\n### Promise\
  \ 转换\n\n```java\nPromise<User> promise = fetchUser(id);\n\n// Promise -> Result（阻塞当前线程）\n\
  Result<User> result = promise.await();\n\n// Promise -> 带超时的 Result\nResult<User>\
  \ result = promise.await(TimeSpan.seconds(5));\n```\n\n***\n\n## 常用操作\n\n### map\
  \ - 转换成功结果\n\n```java\nResult<String> raw = Result.success(\"USER@COM\");\nResult<String>\
  \ normalized = raw\n    .map(String::trim)\n    .map(String::toLowerCase);\n```\n\
  \n### flatMap - 链式操作\n\n```java\nResult<Email> email = Email.email(raw);\nResult<Password>\
  \ password = Password.password(raw);\n// 错误：嵌套的 Result\nResult<Result<ValidRequest>>\
  \ nested = email.map(e ->\n    password.map(p -> new ValidRequest(e, p)));\n\n//\
  \ 正确：平坦链式\nResult<ValidRequest> flat = email.flatMap(e ->\n    password.map(p ->\
  \ new ValidRequest(e, p)));\n```\n\n### filter - 使用谓词校验\n\n```java\nResult<Integer>\
  \ age = Result.success(25);\nResult<Integer> adult = age.filter(\n    Causes.cause(\"\
  Must be 18 or older\"),\n    a -> a >= 18);\n```\n\n### recover - 处理特定失败\n\n```java\n\
  Promise<Config> config = loadFromDatabase()\n    .recover(cause -> switch (cause)\
  \ {\n        case DatabaseError -> loadFromFile();\n        case FileError -> Promise.success(Config.defaults());\n\
  \        default -> cause.promise();\n    });\n```\n\n### or / orElse - 提供备用方案\n\
  \n```java\n// or：备用值\nString name = option.or(\"Anonymous\");\n\n// orElse：包装后的备用方案\n\
  Option<User> user = cache.find(id).orElse(database.find(id));\n```\n\n***\n\n##\
  \ 聚合\n\n### Result.all - 校验多个字段\n\n```java\nResult<ValidRequest> request = Result.all(\n\
  \    Email.email(raw.email()),\n    Password.password(raw.password()),\n    Name.name(raw.name())\n\
  ).map(ValidRequest::new);\n```\n\n**行为：** 将**所有**失败累计到 `CompositeCause` 中。不短路。\n\
  \n### Promise.all - 并行执行\n\n```java\nPromise<Dashboard> dashboard = Promise.all(\n\
  \    fetchProfile(userId),\n    fetchOrders(userId),\n    fetchPreferences(userId)\n\
  ).map(Dashboard::new);\n```\n\n**行为：** 并行执行，遇到第一个失败时快速失败。\n\n### Result.allOf /\
  \ Promise.allOf - 集合聚合\n\n```java\n// 校验邮箱列表\nResult<List<Email>> emails = Result.allOf(\n\
  \    rawEmails.stream().map(Email::email).toList()\n);\n\n// 并行获取多个用户\nPromise<List<Result<User>>>\
  \ users = Promise.allOf(\n    userIds.stream().map(this::fetchUser).toList()\n);\n\
  ```\n\n### any - 第一个成功胜出\n\n```java\nPromise<Config> config = Promise.any(\n   \
  \ loadFromPrimarySource(),\n    loadFromSecondarySource(),\n    loadFromFallback()\n\
  );\n```\n\n***\n\n## 使用 lift 进行异常处理\n\n###  lift - 封装抛异常的代码\n\n```java\n// 封装可能抛异常的\
  \ supplier\nResult<Integer> parsed = Result.lift(() -> Integer.parseInt(raw));\n\
  \n// 自带自定义错误映射\nResult<Integer> parsed = Result.lift(\n    ParseError::new,\n  \
  \  () -> Integer.parseInt(raw)\n);\n```\n\n### 带参数的 lift\n\n```java\n// 单参数\nResult<Hash>\
  \ hashed = Result.lift1(\n    HashError::new,\n    encoder::encode,\n    password.value()\n\
  );\n\n// 双参数\nResult<Token> token = Result.lift2(\n    TokenError::new,\n    tokenService::generate,\n\
  \    userId,\n    expiry\n);\n```\n\n### Promise.lift - 异步异常封装\n\n```java\nPromise<User>\
  \ user = Promise.lift(\n    DatabaseError::new,\n    () -> jdbcTemplate.queryForObject(sql,\
  \ mapper, id)\n);\n```\n\n***\n\n## 校验工具\n\n### Verify.Is 谓词\n\n\n\n\n\n```java\n\
  import org.pragmatica.lang.utils.Verify;\n\n// 检查\nVerify.ensure(value, Verify.Is::notNull)\n\
  Verify.ensure(value, Verify.Is::notBlank)\nVerify.ensure(value, Verify.Is::notEmpty)\n\
  \n// 长度检查\nVerify.ensure(password, Verify.Is::lenBetween, 8, 128)\n\n// 模式匹配\nVerify.ensure(email,\
  \ Verify.Is::matches, EMAIL_PATTERN)\n\n// 数值检查\nVerify.ensure(age, Verify.Is::positive)\n\
  Verify.ensure(age, Verify.Is::between, 0, 150)\nVerify.ensure(quantity, Verify.Is::lessThanOrEqualTo,\
  \ 100)\n```\n\n### 组合校验\n\n```java\npublic static Result<Password> password(String\
  \ raw) {\n    return Verify.ensure(raw, Verify.Is::notNull)\n        .filter(TOO_SHORT,\
  \ s -> Verify.Is.lenBetween(s, 8, 128))\n        .filter(NO_DIGIT, DIGIT_PATTERN.asMatchPredicate())\n\
  \        .filter(NO_UPPER, UPPER_PATTERN.asMatchPredicate())\n        .map(Password::new);\n\
  }\n```\n\n### 解析工具类 - JDK 包装器\n\n```java\nimport org.pragmatica.lang.parse.*;\n\n\
  // 代替 Result.lift(() -> Integer.parseInt(raw))\nResult<Integer> number = Number.parseInt(raw);\n\
  Result<Long> bigNumber = Number.parseLong(raw);\nResult<BigDecimal> decimal = Number.parseBigDecimal(raw);\n\
  \n// 日期/时间解析\nResult<LocalDate> date = DateTime.parseLocalDate(raw);\nResult<Instant>\
  \ instant = DateTime.parseInstant(raw);\n\n// 网络类型\nResult<UUID> uuid = Network.parseUUID(raw);\n\
  Result<URI> uri = Network.parseURI(raw);\n```\n\n* * *\n\n## 回调方法\n\n### 成功/失败处理器\n\
  \n```java\nresult\n    .onSuccess(user -> log.info(\"Found user: {}\", user.id()))\n\
  \    .onFailure(cause -> log.warn(\"User not found: {}\", cause.message()));\n\n\
  promise\n    .onSuccess(data -> cache.put(key, data))\n    .onFailure(cause -> metrics.incrementFailure());\n\
  ```\n\n### 结果处理器（两种情况）\n\n```java\npromise.onResult(result -> {\n    if (result.isSuccess())\
  \ {\n        metrics.recordSuccess();\n    } else {\n        metrics.recordFailure();\n\
  \    }\n});\n```\n\n### fold - 转换两种情况\n\n```java\n// Result -> ResponseEntity\n\
  ResponseEntity<?> response = result.fold(\n    cause -> toErrorResponse(cause),\
  \    // 失败情况在前\n    data -> ResponseEntity.ok(data)     // 成功情况在后\n);\n```\n\n*\
  \ * *\n\n## Unit 类型\n\n对于执行成功但不产生任何值的操作：\n\n```java\n// 使用 Unit，而非 Void\nResult<Unit>\
  \ validated = checkBusinessRule(input);\nPromise<Unit> sent = sendNotification(user);\n\
  \n// 创建一个无值的成功结果\nResult<Unit> ok = Result.unitResult();\n\n// 将任何结果转换为 Unit\nPromise<Unit>\
  \ ignored = fetchData().mapToUnit();\n```\n\n* * *\n\n## 线程安全\n\n### Promise 解析\n\
  \nPromise 具有精确一次的解析语义：\n\n```java\nPromise<User> promise = Promise.promise();\n\n\
  // 只有第一次解析生效\npromise.succeed(user1);  // 解析该 promise\npromise.succeed(user2); \
  \ // 被忽略\npromise.fail(cause);     // 被忽略\n```\n\n### 转换线程安全\n\n转换操作是线程安全的，但遵循执行顺序：\n\
  \n```java\nPromise<User> promise = Promise.promise();\n// ... (逻辑继续)\n```\n\n\n\n\
  \n\n# 为什么基于这些标准：\n\n- **心理负担**：无需“记住要校验”——类型系统保证了有效性 (+2)\n- **可靠性**：编译器强制要求无法构造无效对象\
  \ (+3)\n- **对设计的影响**：业务不变性集中在工厂方法中，而不是散落在各处 (+2)\n- **复杂性**：每个类型只有一个单一校验点，消除了冗余检查\
  \ (+1)\n\n***\n\n## 传统的（错误）方法\n\n```java\n// 别这样做：校验与构造分离\npublic class Email {\n\
  \    private final String value;\n\n    public Email(String value) {\n        this.value\
  \ = value;  // 接受任何输入\n    }\n\n    public boolean isValid() {  // 调用者必须记住检查\n \
  \       return value != null && value.matches(\"^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+$\"\
  );\n    }\n}\n\n// 客户端代码必须手动校验：\nEmail email = new Email(input);\nif (!email.isValid())\
  \ {\n    throw new ValidationException(\"Invalid email\");\n}\n```\n\n**问题：**\n\
  - 你可以构造无效的 `Email` 对象\n- 校验是一个独立的步骤，调用者可能会忘记\n- `isValid()` 方法返回布尔值，丢弃了关于错误的详细信息\n\
  - 你无法区分“null”、“格式错误”或“长度过长”\n\n***\n\n## “解析而非校验” (Parse-Don’t-Validate) 方法\n\n\
  ```java\n// 这样做：校验即构造\npublic record Email(String value) {\n    private static final\
  \ Pattern EMAIL_PATTERN =\n        Pattern.compile(\"^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+$\"\
  );\n    private static final Fn1<Cause, String> INVALID_EMAIL =\n        Causes.forOneValue(\"\
  Invalid email format: %s\");\n\n    public static Result<Email> email(String raw)\
  \ {\n        return Verify.ensure(raw, Verify.Is::notNull)\n                   \
  \  .map(String::trim)\n                     .filter(INVALID_EMAIL, EMAIL_PATTERN.asMatchPredicate())\n\
  \                     .map(Email::new);\n    }\n}\n\n// 客户端代码获取 Result：\nResult<Email>\
  \ result = Email.email(input);\n// 如果是 Success，则 Email 是有效的。这是保证的。\n```\n\n构造函数是私有的（或包私有的）。获取\
  \ `Email` 的唯一方法是通过静态工厂方法 `email()`，它返回一个 `Result<Email>`。如果你有一个 `Email` 实例，它就是有效的——不需要单独检查。\n\
  \n> **注意：** 在当前的 Java 版本中，records 不支持将规范构造函数声明为私有。请依靠团队纪律和代码审查来确保值对象仅通过工厂方法构造。直接调用\
  \ `new Email(...)` 会非常显眼且易于被发现。\n\n***\n\n## 命名规范\n\n**工厂命名**：工厂始终以其类型命名，字母小写开头（驼峰法）：\n\
  \n```java\nEmail.email(raw)\nPassword.password(raw)\nAccountId.accountId(raw)\n\
  ```\n\n这创建了一个自然、可读的调用点，便于使用 grep 搜索，并允许静态导入。\n\n**校验后的输入命名**：为代表已校验输入的类型使用 `Valid`\
  \ 前缀：\n\n```java\n// 这样做：使用 Valid 前缀\nrecord ValidRequest(Email email, Password\
  \ password) { ... }\nrecord ValidUser(Email email, HashedPassword hashed) { ...\
  \ }\n\n// 别这样做：使用 Validated 前缀（太冗长）\nrecord ValidatedRequest(...)\n```\n\n***\n\n\
  ## 带有校验的可选字段\n\n如果一个字段是可选的，但在存在时必须有效？使用 `Result<Option<T>>` 配合 `Verify.ensureOption()`：\n\
  \n```java\npublic record ReferralCode(String value) {\n    private static final\
  \ Pattern PATTERN = Pattern.compile(\"^[A-Z0-9]{6}$\");\n    private static final\
  \ Cause INVALID_FORMAT = Causes.cause(\"Invalid referral code format\");\n\n   \
  \ public static Result<Option<ReferralCode>> referralCode(String raw) {\n      \
  \  return Verify.ensureOption(\n            Option.option(raw).map(String::trim).filter(s\
  \ -> !s.isEmpty()),\n            PATTERN.asMatchPredicate(),\n            INVALID_FORMAT\n\
  \        ).map(opt -> opt.map(ReferralCode::new));\n    }\n}\n```\n\n`Verify.ensureOption()`\
  \ 方法（Pragmatica Lite 0.9.0+）优雅地处理了这种模式：\n- 如果 `Option` 为空，则以 `Option.none()` 成功——无需校验\n\
  - 如果存在且有效，则以 `Option.some(value)` 成功\n- 如果存在且无效，则带上提供的原因失败\n\n**调用者语义：**\n- `Failure(cause)`：输入无效（已提供但非法）\n\
  - `Success(None)`：无值\n- `Success(Some(code))`：有效\n\n***\n\n## 工厂方法中的归一化\n\n工厂可以在解析过程中对输入进行归一化：\n\
  \n```java\npublic static Result<Email> email(String raw) {\n    return Verify.ensure(raw,\
  \ Verify.Is::notNull)\n                 .map(String::trim)           // 去除空格\n \
  \                .map(String::toLowerCase)    // 转小写以便比较\n                 .filter(INVALID_EMAIL,\
  \ EMAIL_PATTERN.asMatchPredicate())\n                 .map(Email::new);\n}\n```\n\
  \n现在所有的 `Email` 实例都经过了修剪和小写处理。领域逻辑永远不需要大小大小或空格。\n\n***\n\n## 校验应该的位置\n\n**关于校验位置的清晰规则：**\n\
  \n| 校验类型 | 位置 | 示例 |\n| :--- | :--- | :--- |\n| **单字段不变性** | 值对象工厂 | 邮箱格式、密码强度、ID\
  \ 格式 |\n| **跨字段不变性** | ValidRequest 工厂 | 密码不包含邮箱后缀、日期范围 |\n| **外部状态不变性** | 用例（Use\
  \ case）步骤 | 邮箱唯一性（数据库）、信用检查 |\n\n**理由：**\n- 值对象强制依赖于字段自身的值的不变性\n- `ValidRequest`\
  \ 执行需要多个字段但不需要外部状态的不变性\n- 用例处理需要查找（数据库、服务）的不变性\n\n```java\n// 值对象：单字段不变性\npublic\
  \ record Email(String value) {\n    public static Result<Email> email(String raw)\
  \ { /* 仅格式检查 */ }\n}\n\n// ValidRequest：跨字段不变性\nrecord ValidRegistration(Email email,\
  \ Password password) {\n    public static Result<ValidRegistration> validRegistration(Email\
  \ email, Password pwd) {\n        // 检查密码是否包含邮箱本地部分\n    }\n}\n\n// 用例步骤：外部状态不变性\n\
  interface CheckEmailUnique {\n    Promise<Email> apply(Email email);  // 数据库查询\n\
  }\n```\n\n***\n\n## 使用 Result.all() 进行跨字段校验\n\n使用 `Result.all()` 校验独立的字段，然后添加跨字段规则：\n\
  \n**示例：密码不能包含邮箱本地部分**\n\n\n\n\n\n```java\nrecord ValidRegistration(Email email,\
  \ Password password) {\n    private static final Cause PASSWORD_CONTAINS_EMAIL =\n\
  \        Causes.cause(\"Password cannot contain email local part\");\n\n    static\
  \ Result<ValidRegistration> validRegistration(String emailRaw,\n               \
  \                                        String passwordRaw) {\n        return Result.all(Email.email(emailRaw),\n\
  \                         Password.password(passwordRaw))\n                    \
  \ .flatMap(ValidRegistration::checkPasswordNotContainsEmail);\n    }\n\n    private\
  \ static Result<ValidRegistration> checkPasswordNotContainsEmail(\n            Email\
  \ email, Password pwd) {\n        String localPart = email.value().split(\"@\")[0];\n\
  \        return pwd.value().contains(localPart)\n            ? PASSWORD_CONTAINS_EMAIL.result()\n\
  \            : Result.success(new ValidRegistration(email, pwd));\n    }\n}\n```\n\
  \n**模式：**\n1. 使用 `Result.all()` 验证单个字段 → 累积每个字段错误\n2. 使用 `.flatMap()` 添加跨字段验证 →\
  \ 在跨字段规则上快速失败（fail-fast）\n3. 将跨字段逻辑提取到命名方法中\n4. 仅在所有验证通过时才构造对象\n\n***\n\n## 现实世界的验证场景\n\
  \n### 日期范围验证\n\n```java\nrecord DateRange(LocalDate start, LocalDate end) {\n  \
  \  private static final Fn1<Cause, LocalDate> END_BEFORE_START =\n        date ->\
  \ Causes.cause(\"End date must be after start date: \" + date);\n\n    public static\
  \ Result<DateRange> dateRange(LocalDate start, LocalDate end) {\n        return\
  \ Verify.ensure(start, Verify.Is::notNull)\n                     .flatMap(_ -> Verify.ensure(end,\
  \ Verify.Is::notNull))\n                     .flatMap(_ -> Verify.ensure(end, isAfter(start),\
  \ END_BEFORE_START))\n                     .map(_ -> new DateRange(start, end));\n\
  \    }\n\n    private static Predicate<LocalDate> isAfter(LocalDate start) {\n \
  \       return end -> end.isAfter(start);\n    }\n}\n```\n\n### 业务规则验证\n\n```java\n\
  record ValidOrder(OrderId id, Money total, List<LineItem> items) {\n    private\
  \ static final Fn1<Cause, Money> TOTAL_MISMATCH =\n        Causes.forOneValue(\"\
  Order total does not match line items. Expected: %s\");\n\n    public static Result<ValidOrder>\
  \ validOrder(OrderId id,\n                                                Money\
  \ total,\n                                                List<LineItem> items)\
  \ {\n        return total.equals(calculateTotal(items))\n            ? Result.success(new\
  \ ValidOrder(id, total, items))\n            : TOTAL_MISMATCH.apply(calculateTotal(items)).result();\n\
  \    }\n\n    private static Money calculateTotal(List<LineItem> items) {\n    \
  \    return items.stream()\n                    .map(LineItem::subtotal)\n     \
  \               .reduce(Money.ZERO, Money::add);\n    }\n}\n```\n\n### 累积多个错误\n\n\
  ```java\nrecord ValidRegistration(Email email, Password password, Age age) {\n \
  \   public static Result<ValidRegistration> validate(String emailRaw,\n        \
  \                                             String passwordRaw,\n            \
  \                                         String ageRaw) {\n        return Result.all(Email.email(emailRaw),\n\
  \                         Password.password(passwordRaw),\n                    \
  \     Age.age(ageRaw))\n                     .map(ValidRegistration::new);\n   \
  \ }\n}\n```\n\n## 增量采用\n\n**不要一次重构所有内容。** 采用增量方式。\n\n**1. 新功能优先** - 对所有新代码使用“解析而非验证”（parse-don’t-validate）\n\
  \n**2. 在边界处保留现有验证：**\n\n```java\n// 之前：带有 @Valid 的 Spring 控制器\n@PostMapping(\"/register\"\
  )\npublic ResponseEntity<?> register(@Valid RegistrationRequest dto) {\n    var\
  \ request = new ValidRegistration.Request(dto.email(), dto.password());\n    return\
  \ registerUser.execute(request)\n                       .fold(errorResponse, successResponse);\n\
  }\n\n// 之后：完全迁移\n@PostMapping(\"/register\")\npublic ResponseEntity<?> register(@RequestBody\
  \ RegistrationRequest raw) {\n    return registerUser.execute(raw)\n           \
  \            .fold(errorResponse, successResponse);\n}\n```\n\n**3. 逐渐将验证从服务移动到值对象：**\n\
  - 找到一个带有手动验证的服务方法\n- 将该验证提取到值对象中\n- 更新调用者使用该值对象\n- 重复此过程\n\n***\n\n## 核心要点\n\n1.\
  \ **验证即构造** - 如果实例存在，它就是有效的\n2. **工厂方法返回 `Result<T>`** - 成功意味着对象有效\n3. **`Result.all()`\
  \ 累积错误** - 一次显示所有问题\n4. **工厂方法中的归一化** - 修剪、小写化等操作执行一次\n5. **`Result<Option<T>>`**\
  \ - 用于在存在时必须验证的可空值\n6. **增量采用** - 从边界开始，向内部推进\n\n## 练习题\n\n参见 附录 B 关于以下内容的练习：\n\
  - 练习 2.1：PhoneNumber 值对象\n- 练习 2.2：DateRange 聚合验证\n- 练习 2.3：错误累积 vs 短路机制\n\n## 后续\n\
  \n第 5 章 涵盖了错误处理 - 如何定义类型错误、组合它们以及如何在不使用异常的情况下干净地处理失败。\n\n\n\n\n业务失败并非异常——它们是业务规则的预期结果。电子邮件无效不是异常；而是输入不良的正常情况。账户被锁定不是异常；它是一种业务状态。\n\
  \n**规则：** 业务逻辑绝不为业务失败抛出异常。所有失败都通过 `Result` 或 `Promise` 以类型化 `Cause` 对象的形式传递。\n\n\
  ***\n\n## 为什么选择 Result：错误处理哲学\n\n错误处理逻辑应该位于存在业务上下文以做出决策的地方。有时它接近错误发生的地方；有时，错误会原样传播，因为只有调用者拥有足够的上下文来做决定。这一基本真理并不取决于错误机制——它取决于知识存储在哪里。\n\
  \n不同的语言使用不同的错误传播机制，每种机制在`透明度`（失败是否可见）、`易用性`（使用是否愉快？）和`可靠性`（编译器是否提供了帮助？）方面都有不同的权衡：\n\
  \n| 机制 | 透明度 | 易用性 | 可靠性 |\n| --- | --- | --- | --- |\n| **检类型异常 (Checked exceptions)**\
  \ | ✅ 签名中显式 | ❌ 冗长、紧耦合 | ✅ 编译器强制 |\n| **非检类型异常 (Unchecked exceptions)** | ❌ 隐藏在实现中\
  \ | ⚠️ 可接受，但有心理开销 | ❌ 静默失败 |\n| **错误作为值** (Go) | ✅ 返回值可见 | ❌ 到处都是手动 `if err != nil`\
  \ | ❌ 易被忽略 |\n| **函数式 (Result/Either)** | ✅ 类型签名 | ✅ 单子组合 | ✅ 编译器强制 |\n\n`Checked\
  \ exceptions` 将调用者和被调用者紧耦合——底层方法的变化向上级联，迫强制整个调用栈更改签名。\n\n`Unchecked exceptions`\
  \ 消除了耦合但隐藏了失败模式。每次方法调用都需要读取实现以以发现可能抛出什么。心理开销是持续的；而 Bug 是间歇性的。\n\n`Errors as values`\
  \ (Go 风格) 让失败可见，但要求在每一步进行手动传播。具有多个错误源或交织资源管理的复杂场景会变成易出错的样板代码。\n\n`Functional style`\
  \ (`Result<T>`) 结合了上述优特性：失败在类型签名中是显式的（透明的），单子组合消除了手动传播（易用的），并且编译器确保每个失败要么被处理要么被传播（可靠的）。`map`/`flatMap`\
  \ 的“如果值可用则执行此操作”语义意味着错误处理代码只出现在做出决策的地方——而不是每一个中间步骤。\n\n对失败的可能性保持绝对清晰并不是死记硬背——它是可维护代码的基础。\n\
  \n***\n\n## 传统的（错误的）方法\n\n```java\n// 切勿：为业务逻辑使用异常\npublic User loginUser(String\
  \ email, String password) throws\n    InvalidEmailException,\n    InvalidPasswordException,\n\
  \    AccountLockedException,\n    CredentialMismatchException {\n\n    if (!isValidEmail(email))\
  \ {\n        throw new InvalidEmailException(email);\n    }\n    // ... 更多抛出异常的检查\n\
  }\n```\n\n**问题：**\n- 检类型异常污染了签名\n- 非检类型异常是不可见的\n- 异常层次结构创建了耦合\n- 对于业务失败来说，堆栈轨迹开销很大\n\
  - 测试需要捕获异常\n\n***\n\n## 基于 Result 的方法\n\n```java\n// 推荐：将失败视为类型化值\npublic Result<User>\
  \ loginUser(String emailRaw, String passwordRaw) {\n    return Result.all(Email.email(emailRaw),\n\
  \                     Password.password(passwordRaw))\n                 .flatMap(this::validateAndCheckStatus);\n\
  }\n\nprivate Result<User> validateAndCheckStatus(Email email, Password password)\
  \ {\n    return checkCredentials(email, password)\n            .flatMap(this::checkAccountStatus);\n\
  }\n\nprivate Result<User> checkAccountStatus(User user) {\n    return user.isLocked()\n\
  \            ? new LoginError.AccountLocked(user.id()).result()\n            : Result.success(user);\n\
  }\n```\n\n***\n\n## 定义类型化错误\n\n每个失败都是一个 `Cause`。使用密封接口（sealed interfaces）定义错误类型：\n\
  \n```java\npublic sealed interface LoginError extends Cause {\n    record AccountLocked(UserId\
  \ userId) implements LoginError {\n        @Override\n        public String message()\
  \ {\n            return \"Account is locked: \" + userId;\n        }\n    }\n\n\
  \    enum InvalidCredentials implements LoginError {\n        // ...\n    }\n}\n\
  ```\n（注：原文在代码块中有一些碎片化的行，我保留了密封接口定义的逻辑结构）。\n\n***\n\n## 使用 Result.all() 进行错误积累\n\n\
  `Result.all()` 将失败收集到 `CompositeCause` 中：\n\n```java\n// 如果两者都失败：\nResult.all(Email.email(\"\
  not-email\"),\n           Password.password(\"weak\"))\n      .flatMap(this::processLogin);\n\
  ```\n返回：`CompositeCause([\"Invalid email format: not-email\", \"Password must be\
  \ at least 8 characters\"])`。用户一次性看到所有错误，而不是反复修复重试。\n\n***\n\n## 编程错误 vs 业务错误\n\n\
  ### 业务错误 → 带有类型化 Cause 的 Result/Promise\n\n**业务错误**是业务规则的预期结果：\n\n| 错误类型 | 示例 |\
  \ 表示 |\n| --- | --- | --- |\n| 验证失败 | 电子邮件格式无效 | 带有 `ValidationError` 的 `Result<T>`\
  \ |\n| 违反业务规则 | 资金不足 | 带有 `InsufficientFunds` 的 `Result<T>` |\n| 未找到 | 用户不存在 | 带有\
  \ `NotFound` 或 `Option.none()` 的 `Result<T>` |\n| 外部服务失败 | 支付被拒绝 | 带有 `PaymentError`\
  \ 的 `Promise<T>` |\n\n**规则：** 如果用户操作可以触发它，它就是业务错误——用 `Result` 或 `Promise` 表示。\n\n\
  ### 编程错误 → 异常（快速失败）\n\n**编程错误**表示永远不应该到达生产环境的 Bug：\n\n| 错误类型 | 示例 | 处理 |\n| ---\
  \ | --- | --- |\n| 空值不变性违反 | 向非空参数传递 null | `IllegalArgumentException` |\n| 不可能的状态\
  \ | 永远不发生的 switch 分支 | `IllegalStateException` |\n| 配置错误 | 启动时缺少必要的配置 | 快速失败，不要启动\
  \ |\n\n**规则：** 仅在无法恢复且应用程序应该终止或重启时，为编程错误使用异常。\n\n### 适配器边界 → 映射到领域类型\n\n**适配器代码**捕获外部异常并转换为领域类型：\n\
  \n```java\n// 适配器：将 null 映射到 Option，将异常映射到 Cause\npublic Promise<Option<User>> findById(UserId\
  \ id) {\n    return Promise.lift(\n        RepositoryError.DatabaseFailure::new,\
  \  // 异常 → Cause\n        () -> Option.option(jdbcTemplate.queryForObject(...))\
  \  // null → Option\n    );\n}\n```\n\n**规则：** 没有任何外部异常或 null 跨越适配器边界——立即映射。\n\n\
  ***\n\n## 适配器异常：边界\n\n外部代码抛出异常。**适配器**捕获并转换它们：\n\n\n\n\n\n```java\nclass JpaUserRepository\
  \ implements UserRepository {\n    public Promise<Option<User>> findByEmail(Email\
  \ email) {\n        return Promise.lift(\n            RepositoryError.DatabaseFailure::new,\
  \  // 将异常转换为原因\n            () -> {\n                // 可能会抛出异常的 JDBC/JPA 代码\n \
  \               return Option.option(result);\n            });\n    }\n}\n```\n\n\
  业务逻辑看不到外部异常 - 只有领域错误。\n\n***\n\n## Monad 组合规则\n\n### map vs flatMap\n\n```java\n\
  // map: 转换成功值 (T → U)\nresult.map(String::toUpperCase)\n\n// flatMap: 链式操作 (T →\
  \ Result<U>)\nresult.flatMap(this::validate)\n```\n\n当转换本身可能失败时，使用 `flatMap`。\n\n\
  ### 类型间的提升 (Lifting)\n\n```java\n// Option → Result\noption.toResult(cause)\n\n\
  // Result → Promise\nresult.async()\n\n// 完整链式\nreturn ValidRequest.validRequest(request)\n\
  \           .async()              // Result → Promise\n           .flatMap(step1)\
  \       // Promise 链式\n           .flatMap(step2);\n```\n\n### 禁止：`Promise<Result<T>>`\n\
  \n`Promise<T>` 已经携带了失败信息。永远不要嵌套：\n\n```java\n// 错误\nPromise<Result<User>> loadUser(UserId\
  \ id)\n\n// 正确\nPromise<User> loadUser(UserId id)\n```\n\n### 允许：`Result<Option<T>>`\n\
  \n适用于存在时必须验证的可选值：\n\n```java\nResult<Option<ReferralCode>> refCode = ReferralCode.referralCode(input);\n\
  // Success(None) = 未提供\n// Success(Some(code)) = 有效代码\n// Failure(cause) = 无效代码\n\
  ```\n\n使用 `Verify.ensureOption()` (Pragmatica Lite 0.9.0+) 来实现此模式：\n\n```java\n\
  public static Result<Option<ReferralCode>> referralCode(String raw) {\n    return\
  \ Verify.ensureOption(\n        Option.option(raw).map(String::trim).filter(s ->\
  \ !s.isEmpty()),\n        PATTERN.asMatchPredicate(),\n        INVALID_FORMAT\n\
  \    ).map(opt -> opt.map(ReferralCode::new));\n}\n```\n\n***\n\n## 测试错误\n\n```java\n\
  // 测试失败\n@Test\nvoid email_rejectsInvalidFormat() {\n    Email.email(\"not-an-email\"\
  )\n         .onSuccess(Assertions::fail);  // 如果意外成功，则测试失败\n}\n\n// 测试成功\n@Test\n\
  void email_acceptsValidFormat() {\n    Email.email(\"user@example.com\")\n     \
  \   .onFailure(Assertions::fail)\n        .onSuccess(email -> assertEquals(\"user@example.com\"\
  , email.value()));\n}\n\n// 测试异步\n@Test\nvoid execute_succeeds() {\n    useCase.execute(request)\n\
  \           .await()\n           .onFailure(Assertions::fail)\n           .onSuccess(response\
  \ -> assertEquals(\"expected\", response.value()));\n}\n```\n\n***\n\n## 核心要点\n\n\
  1. **无业务异常** - 错误是值，而不是被抛出的异常\n2. **密封接口 (Sealed interfaces)** - 定义穷尽的错误类型\n3. **Result.all()**\
  \ - 累积所有失败，而不仅仅是第一个\n4. **适配器进行转换** - 在边界处将异常转换为原因 (Cause)\n5. **永远不要嵌套** - `Promise<Result<T>>`\n\
  6. **测试** - 使用函数式断言\n\n***\n\n## 练习\n\n参见**附录 B** 关于空值策略（null policy）的练习。\n\n##\
  \ 接下来\n\n# 第 6 章：空值策略\n\n你将学习：\n\n* 什么时候可以接受 null，以及什么时候不可以\n* 使用回退值进行错误恢复\n* 适配器边界处的错误处理\n\
  \n如果操作可能失败（数据库错误），请使用 `Result<Option<T>>`。\n\n\n\n\n\n```java\n// Adapter layer\
  \ - JOOQ insert with optional field\npublic Promise<Unit> saveUser(User user) {\n\
  \    return Promise.lift(\n            RepositoryError.DatabaseFailure::new,\n \
  \           () -> {\n                dsl.insertInto(USERS)\n                   .set(USERS.ID,\
  \ user.id().value())\n                   .set(USERS.EMAIL, user.email().value())\n\
  \                   .set(USERS.REFERRAL_CODE,\n                        user.refCode().map(ReferralCode::value).orElse(null))\
  \  // Option -> nullable column\n                   .execute();\n              \
  \  return Unit.unit();\n            });\n}\n```\n\n### JDBC PreparedStatement 示例：\n\
  \n```java\nPreparedStatement stmt = connection.prepareStatement(\n    \"INSERT INTO\
  \ users (id, email, referral_code) VALUES (?, ?, ?)\");\nstmt.setString(1, user.id().value());\n\
  stmt.setString(2, user.email().value());\nstmt.setString(3, user.refCode().map(ReferralCode::value).orElse(null));\
  \  // Option -> null\n```\n\n**模式**：仅在将 `Option<T>` 映射到数据库空列时使用 `.orElse(null)`。\n\
  \n### 3. 验证测试\n\n在测试输入中使用 `null` 来验证校验是否能正确拒绝 `null`：\n\n```java\n@Test\nvoid email_fails_forNull()\
  \ {\n    Email.email(null)  // 测试 null 输入\n         .onSuccess(Assertions::fail);\n\
  }\n\n@Test\nvoid validRequest_fails_whenFieldNull() {\n    var request = new Request(\"\
  valid@example.com\", null);  // 测试空密码\n    ValidRequest.validRequest(request)\n\
  \                .onSuccess(Assertions::fail);\n}\n```\n\n**模式**：在测试输入中使用 `null`\
  \ 来验证校验行为。\n\n***\n\n## 当不允许接受 Null 的情况\n\n### 永远不要在 JBCT 组件之间传递 Null\n\n业务逻辑组件使用领域类型进行通信，绝不使用\
  \ null：\n\n```java\n// 不要：在业务逻辑中进行防御性 null 检查\npublic Result<Order> processOrder(User\
  \ user, Cart cart) {\n    if (user == null || cart == null) {  // 不要这样做\n      \
  \  return OrderError.InvalidInput.INSTANCE.result();\n    }\n    // ...\n}\n\n//\
  \ 要：通过约定保证参数非空\npublic Result<Order> processOrder(User user, Cart cart) {\n    //\
  \ 如果 cart 可能不存在，参数类型应该是 Option<Cart>\n    // 如果 user 可能不存在，则不应调用该操作\n    // ...\n\
  }\n\n// 要：在需要时使用显式的可选性\npublic Result<Order> processOrder(User user, Option<Cart>\
  \ cart) {\n    return cart.toResult(OrderError.EmptyCart.INSTANCE)\n           \
  \    .flatMap(c -> validateAndProcess(user, c));\n}\n```\n\n**规则**：如果一个值可能不存在，请使用\
  \ `Option<T>` 参数，绝不要使用 null。\n\n### 永远不要用 Null 区分“未知”与“缺失”\n\nNull 混了了含义：“值未设置”和“值未知/错误”。使用类型来区分：\n\
  \n```java\n// 不要：Null 意味着“未知”\npublic String getUserTheme(UserId id) {\n    Theme\
  \ theme = findTheme(id);\n    return theme != null ? theme.name() : null;  // null\
  \ 意味着什么？\n}\n\n// 要：Option 区分“未设置”与“错误”\npublic Option<Theme> getUserTheme(UserId\
  \ id) {\n    return findTheme(id);  // none() = 未设置, some(theme) = 已设置\n}\n\n//\
  \ 要：Result 区分“未找到”与“错误”\npublic Result<Theme> getRequiredTheme(UserId id) {\n  \
  \  return findTheme(id)\n        .toResult(ThemeError.NotFound.INSTANCE);\n}\n```\n\
  \n### 永远不要从业务逻辑中返回 Null\n\n业务逻辑始终使用类型化的返回值：\n\n```java\n// 不要：从业务逻辑返回 null\npublic\
  \ User enrichUser(User user) {\n    Profile profile = loadProfile(user.id());\n\
  \    if (profile == null) {\n        return null;  // 不要返回 null\n    }\n}\n\n//\
  \ 要：使用 Option\npublic Option<User> enrichUser(User user) {\n    return loadProfile(user.id())\
  \  // 返回 Option\n        .map();\n}\n\n// 要：如果增强操作可能失败，使用 Result\npublic Result<User>\
  \ enrichUser(User user) {\n    return loadProfile(user.id())\n        .toResult(ProfileError.NotFound.INSTANCE);\n\
  }\n```\n\n| 上下文 | Null 使用 | 正确方法 |\n| --- | --- | --- |\n| JBCT 的返回值 | 绝不 | Null\
  \ 仅存在于边界处 |\n| JBCT 组件之间的参数 | 绝不 | 使用 `Option<T>` |\n| 写入空列 | 允许 | 在边界处 `.orElse(null)`\
  \ |\n| 测试输入 | 允许 | 测试 null |\n| “未知”或“缺失”语义 | 绝不 | 使用 `Option<T>` 或 `Result<T>`\
  \ |\n\n***\n\n## 错误恢复\n\n 模式\n\n到目前为止，我们关注的是错误的**处理**——即如何通过 `Result` 和 `Promise`\
  \ 表示并传播失败。但真实的系统需要**恢复**——即提供回备值、重试操作或在发生错误时优雅地降级。\n\n### 提供回备值\n\n当操作失败时，你可以使用\
  \ `.or()` 替换默认值：\n\n```java\n// 提供字面量回备值\npublic Theme getUserTheme(UserId userId)\
  \ {\n    return loadTheme(userId)  // 返回 Option<Theme>\n        .or(Theme.DEFAULT);\
  \   // 如果为空则使用 DEFAULT\n}\n\n// 使用 supplier 的懒求值\npublic Config getConfig(String\
  \ key) {\n    return loadFromCache(key)  // 返回 Option<Config>\n        .or(() ->\
  \ loadFromDefaults(key))  // 仅在缓存未命中时评估\n        .or(Config.EMPTY);  // 最后回备\n}\n\
  ```\n\n`.or()` 方法适用于 `Option`、`Result` 和 `Promise`：\n\n```java\n// Option<T> - 如果为空时提供值\n\
  option.or(defaultValue)\noption.or(() -> computeDefault())\n\n// Result<T> - 如果失败时提供值\n\
  result.or(defaultValue)\nresult.or(() -> computeDefault())\n\n// Promise<T> - 如果失败时提供值（异步）\n\
  promise.or(defaultValue)\npromise.or(() -> computeDefault())\n```\n\n### 回退到备用操作\n\
  \n当你想要尝试一个返回相同单子类型的备用操作时，使用 `.orElse()`：\n\n\n\n\n```java\n// 尝试缓存，然后是数据库，最后是内存\n\
  public Promise<User> findUser(UserId id) {\n    return cacheRepository.find(id)\
  \      // Promise<User>\n                          .orElse(databaseRepository.find(id))\
  \  //缓存失败则尝试数据库\n                          .orElse(Promise.success(User.GUEST));\
  \ // 最后兜底\n}\n\n// Result 版本\npublic Result<Config> loadConfig(String key) {\n \
  \   return loadFromFile(key)      // Result<Config>\n        .orElse(loadFromEnv(key))\
  \  // 如果文件失败则尝试环境变量\n        .orElse(Result.success(Config.DEFAULT));\n}\n```\n\n\
  **区别**：`.or(value)` - 替换普通值 - `.orElse(M<T>)` - 替换为另一个 `Result`/`Promise`/`Option`\n\
  \n### 从特定失败中恢复\n\n当你想根据错误将失败转换为成功时，使用 `.recover()`：\n\n```java\npublic Result<User>\
  \ findUserOrGuest(UserId id) {\n    return userRepository.find(id)\n        .recover(this::recoverUserErrors);\n\
  }\n\nprivate User recoverUserErrors(Cause cause) {\n    return switch (cause) {\n\
  \        case UserError.NotFound ignored -> User.GUEST;\n        case UserError.DatabaseError\
  \ ignored -> User.OFFLINE;\n        default -> throw new IllegalStateException(\"\
  Unexpected error: \" + cause);\n    };\n}\n```\n\n**带有异步恢复的 Promise 版本：**\n\n```java\n\
  public Promise<Order> processOrder(OrderRequest request) {\n    return paymentService.charge(request)\n\
  \        .recover(this::recoverPaymentErrors);\n}\n\nprivate Promise<Order> recoverPaymentErrors(Cause\
  \ cause) {\n    return switch (cause) {\n        case PaymentError.InsufficientFunds\
  \ ignored ->\n            splitPaymentService.process(request);  // 异步替代\n     \
  \   case PaymentError.TemporaryFailure ignored ->\n            Promise.success(request).flatMap(paymentService::charge);\
  \  // 重试一次\n        default -> cause.promise();  // 无法恢复\n    };\n}\n```\n\n***\n\
  \n## 优雅降级模式\n\n将恢复机制与功能检测结合：\n\n```java\npublic Promise<Dashboard> loadDashboard(UserId\
  \ userId) {\n    return Promise.all(loadUserProfile(userId),\n                 \
  \      loadRecentOrders(userId).or(List.of()),\n                       loadRecommendations(userId).or(List.of()))\n\
  \                  .map(Dashboard::new);\n}\n```\n\n在这里，用户信息是**必须的**（必须成功），但如果订单和推荐不可用，它们将优雅地降级为空列表。仪表板仍会以减少的功能加载。\n\
  \n### 真实示例：带有回退的配置\n\n```java\npublic interface LoadConfig {\n    record Config(String\
  \ apiUrl, int timeout, boolean retryEnabled) {}\n    Promise<Config> load();\n \
  \   static LoadConfig loadConfig(LoadFromFile loadFile,\n                      \
  \           LoadFromEnv loadEnv) {\n        return () -> loadFile.apply()\n    \
  \                         .orElse(loadEnv.apply())\n                           \
  \  .or(() -> new Config(\"https://api.default.com\", 30, true));\n    }\n}\n```\n\
  \n这会尝试文件配置，回退到环境变量，最后使用硬编码默认值。每一层都增加了弹性。\n\n***\n\n## 恢复模式总结\n\n| 模式 | 方法 | 使用场景\
  \ |\n| --- | --- | --- |\n| 默认值 | `.or(value)` | 有固定回退可用 |\n| 懒性默认 | `.or(() ->\
  \ compute())` | 回退创建开销较大 |\n| 备选操作 | `.or(() -> compute())` | 回退创建开销较大 |\n| `.orElse(M<T>)`\
  \ | 替换为另一个 `Result`/`Promise`/`Option` | 从特定失败中恢复 |\n\n\n\n\n### 调试不直观\n\n``````\n\
  [](#cb101-1)// 堆栈跟踪指向 generateReport() 第 45 行\n[](#cb101-2)// 但是哪一步失败了？验证？Fork-Join\
  \ fetch？计算？格式化？\n[](#cb101-3)// 如果不步入整个函数就无法得知\n```\n\n### 无法复用\n\n``````\n[](#cb102-1)//\
  \ 另一个用例需要相同的 Fork-Join fetch 逻辑\n[](#cb102-2)// 但它深埋在 generateReport() 内部\n[](#cb102-3)//\
  \ 无法复用 - 必须复制粘贴或重构\n```\n\n### 每个函数使用单一模式\n\n- 每个函数都是可独立测试的\n- 模式可以在不同用例间复用\n- 失败位置是局部的（堆栈跟踪显示“fetchReportData\
  \ 失败”）\n- 结构可预测且易于扫描\n\n### 违规示例\n\n```\n[](#cb103-1)// 不要：混合使用 Sequencer（顺序执行器）和\
  \ Fork-Join\n[](#cb103-2)public Result<Report> generateReport(ReportRequest request)\
  \ {\n[](#cb103-3)    return ValidRequest.validRequest(request)\n[](#cb103-4)   \
  \                    .flatMap(valid -> {\n[](#cb103-5)                         \
  \  // Sequencer 从这里开始\n[](#cb103-6)                           var userData = fetchUserData(valid.userId());\n\
  [](#cb103-7)                           var salesData = fetchSalesData(valid.dateRange());\n\
  [](#cb103-8)\n[](#cb103-9)                           // 等，我们现在在做 Fork-Join 了？\n\
  [](#cb103-10)                           return Result.all(userData, salesData)\n\
  [](#cb103-11)                                        .flatMap((user, sales) -> computeMetrics(user,\
  \ sales))\n[](#cb103-12)                                        .flatMap(this::formatReport);\
  \  // 回到 Sequencer\n[](#cb103-13)                       });\n[](#cb103-14)}\n```\n\
  \n该函数起初是一个 Sequencer（验证 -> 获取 -> 计算 -> 格式化），但 `fetchUserData` 和 `fetchSalesData`\
  \ 是独立的，因此我们突然在中间执行了 Fork-Join。抽象层级混合。难以测试。一眼无法看出该函数的作用。\n\n### 修正后\n\n``````\n[](#cb104-1)//\
  \ 应该：每个函数一种模式\n[](#cb104-2)public Result<Report> generateReport(ReportRequest request)\
  \ {\n[](#cb104-3)    return ValidRequest.validRequest(request)\n[](#cb104-4)   \
  \                    .flatMap(this::fetchReportData)\n[](#cb104-5)             \
  \          .flatMap(this::computeMetrics)\n[](#cb104-6)                       .flatMap(this::formatReport);\n\
  [](#cb104-7)}\n[](#cb104-8)\n[](#cb104-9)private Result<ReportData> fetchReportData(ValidRequest\
  \ request) {\n[](#cb104-10)    // 这个函数是一个 Fork-Join\n[](#cb104-11)    return Result.all(fetchUserData(request.userId()),\n\
  [](#cb104-12)                      fetchSalesData(request.dateRange()))\n[](#cb104-13)\
  \                 .map(ReportData::new);\n[](#cb104-14)}\n```\n\n现在 `generateReport`\
  \ 是一个纯的 Sequencer（验证 -> 获取 -> 计算 -> 格式化），而 `fetchReportData` 是纯的 Fork-Join。每个函数都有明确的任务。\n\
  \n### 机械化重构\n\n如果你在编写 Sequencer 时发现第 3 步内部需要执行 Fork-Join，请将第 3 步提取为实现 Fork-Join\
  \ 的独立函数。原始的 Sequencer 将保持整洁。\n\n**经验法则**：每个函数一种模式。如果你看到两种模式，请提取其中一个。\n\n* *\n\n\
  ## 单一抽象层级\n\n**规则**：Lambda 内部不要有复杂逻辑。传递给 `map`、`flatMap` 和类似组合器的 Lambda 可能仅包含：\n\
  - 方法引用（例如 `Email::new`、`this::processUser`）\n- 带有参数转发的单方法调用（例如 `param -> someMethod(outerParam,\
  \ param)`）\n\n**为什么？** Lambda 是组合点，而不是实现位置。当你将逻辑埋在 Lambda 内部时，隐藏了抽象层级，并使代码难以阅读、测试和复用。将复杂逻辑提取到命名函数中——名称记录了意图，函数可以孤立地测试，且组合链保持保持扁平且易读。\n\
  \n**基于标准的理由：**\n- **心理负担**：扁平的组合链是线性扫描的——无需进入嵌套逻辑 (+2) \n- **业务/技术比例**：命名函数记录了意图；匿名\
  \ Lambda 隐藏了意图 (+2) \n- **复杂度**：每个函数都可孤立测试；埋入的 Lambda 逻辑需要通过容器进行测试 (+2) \n\n###\
  \ 反模式\n\n``````\n[](#cb105-1)// 不要：Lambda 内部编写复杂逻辑\n[](#cb105-2)return fetchUser(userId)\n\
  [](#cb105-3)    .flatMap(user -> {\n[](#cb105-4)        if (user.isActive() && user.hasPermission(\"\
  admin\")) {\n[](#cb105-5)            return loadAdminDashboard(user)\n[](#cb105-6)\
  \                .map(dashboard -> {\n[](#cb105-7)                    var summary\
  \ = new Summary(\n[](#cb105-8)                        dashboard.metrics(),\n[](#cb105-9)\
  \                        dashboard.alerts().stream()\n[](#cb105-10)            \
  \                .filter(Alert::isUrgent)\n[](#cb105-11)                       \
  \     .toList()\n[](#cb105-12)                    );\n[](#cb105-13)            \
  \        return new Response(user, summary);\n[](#cb105-14)                });\n\
  [](#cb105-15)        } else {\n[](#cb105-16)            return AccessError.InsufficientPermissions.INSTANCE.promise();\n\
  [](#cb105-17)        }\n[](#cb105-18)    });\n```\n\n这个 Lambda 包含了：条件逻辑、嵌套 map、流处理、对象构造。抽象层级混合。难以测试。难以阅读。\n\
  \n### 正确方法\n\n``````\n[](#cb106-1)//// 应该：提取到命名函数\n[](#cb106-2)return fetchUser(userId)\n\
  [](#cb106-3)    .flatMap(this::checkAccess)\n[](#cb106-4)    .flatMap(this::loadDashboard)\n\
  [](#cb106-5)    .map(this::formatResponse);\n[](#cb106-6)\n[](#cb106-7)private Promise<User>\
  \ checkAccess(User user) {\n[](#cb106-8)    return user.isActive() && user.hasPermission(\"\
  admin\")\n[](#cb106-9)        ? Promise.just(user)\n[](#cb106-10)        : AccessError.InsufficientPermissions.INSTANCE.promise();\n\
  [](#cb106-11)}\n[](#cb106-12)private Promise<Dashboard> loadDashboard(User user)\
  \ {\n[](#cb106-13)    return loadAdminDashboard(user)\n[](#cb106-14)        .map(dashboard\
  \ -> {\n[](#cb106-15)                    var summary = new Summary(\n[](#cb106-16)\
  \                        dashboard.metrics(),\n[](#cb106-17)                   \
  \     dashboard.alerts().stream()\n[](#cb106-18)                            .filter(Alert::isUrgent)\n\
  [](#cb106-19)                            .toList()\n[](#cb106-20)              \
  \      );\n[](#cb106-21)                    return new Response(user, summary);\n\
  [](#cb106-22)                });\n```\n*(注：由于您提供的原文中 Correct Approach 部分存在重复和混乱，此处已根据逻辑推全了最完整的重构翻译。)*\n\
  \n\n\n\n\n# Zone 1 (用例级) - 高层业务目标：\n- `RegisterUser.execute()`, `ProcessOrder.execute()`,\
  \ `LoadDashboard.execute()`\n- 每个用例对应一个 Zone 1 函数 - 入口\n\n# Zone 2 (编排级) - 协调拆解目标的步骤：\n\
  - `Sequencer/Fork-Join` 模式中的步骤接口\n- 动词：`validate`, `process`, `handle`, `transform`,\
  \ `apply`, `check`, `load`, `save`, `manage`, `configure`, `initialize`\n- 示例：`ValidateInput.apply()`,\
  \ `ProcessPayment.apply()`, `HandleNotification.apply()`\n\n# Zone 3 (实现级) - 具体技术操作：\n\
  - 业务叶和适配器叶节点\n- 动词：`get`, `set`, `fetch`, `parse`, `calculate`, `convert`, `hash`,\
  \ `format`, `encode`, `decode`, `extract`, `split`, `join`, `log`, `send`, `receive`,\
  \ `read`, `write`, `add`, `remove`\n- 示例：`hashPassword()`, `parseJson()`, `fetchFromDatabase()`,\
  \ `calculateTax()`\n\n**核心洞察：** 每个区域的函数应只调用同一区域或下一层级的函数。Zone 2 函数调用其他 Zone 2 步骤或\
  \ Zone 3 叶节点。Zone 3 叶节点执行原子操作。这创建了自然的层次结构。\n\n## 示例 - 维护区域一致性：\n\n```\n[](#cb110-1)//\
  \ 好 - 所有步骤都位于 Zone 2（编排级）\n[](#cb110-2)public Promise<Response> execute(Request\
  \ request) {\n[](#cb110-3)    return ValidRequest.validRequest(request)        \
  \      // Zone 2: validate\n[](#cb110-4)                       .async()\n[](#cb110-5)\
  \                       .flatMap(this::processCredentials)  // Zone 2: process\n\
  [](#cb110-6)                       .flatMap(this::saveUser)            // Zone 2:\
  \ save\n[](#cb110-7)                       .flatMap(this::sendConfirmation);   //\
  \ Zone 2: send\n[](#cb110-8)}\n[](#cb110-9)\n[](#cb110-10)//  - 在同一链中混合了 Zone 2\
  \ 和 Zone 3\n[](#cb110-11)public Promise<Response> execute(Request request) {\n[](#cb110-12)\
  \    return ValidRequest.validRequest(request)              // Zone 2\n[](#cb110-13)\
  \                       .async()\n[](#cb110-14)                       .flatMap(this::hashPassword)\
  \        // Zone 3 - 太具体了！\n[](#cb110-15)                       .flatMap(this::saveUser)\
  \            // Zone 2\n[](#cb110-16)                       .flatMap(this::fetchConfirmToken);\
  \  // Zone 3 - 太具体了！\n[](#cb110-17)}\n```\n\n在坏示例中，`hashPassword` 和 `fetchConfirmToken`\
  \ 是 Zone 3 操作（具体的细节细节）。它们应该被封装在 Zone 2 步骤中，如 `processCredentials` 和 `sendConfirmation`。\n\
  \n### 阶梯规则测试 (The Stepdown Rule Test)\n\n验证抽象层级的一种简单方法：在每个函数前加上“为了”（to），大声读出你的代码。它听起来应该像一个自然的叙述：\n\
  \n```\n[](#cb111-1)// 大声读这个：\n[](#cb111-2)// \"为了执行，我们验证请求，\n[](#cb111-3)//  然后我们处理支付，\n\
  [](#cb111-4)//  然后我们发送确认。”\n[](#cb111-5)return ValidRequest.validRequest(request)\n\
  [](#cb111-6)                   .async()\n[](#cb111-7)                   .flatMap(this::processPayment)\n\
  [](#cb111-8)                   .flatMap(this::sendConfirmation);\n```\n\n如果加上“为了”让听起来很别扭或过于详细（“为了哈希密码，然后保存到数据库，然后从缓存获取”），说明你混合了抽象层级。\n\
  \n***\n\n## 模式：叶节点 (Leaf)\n\n**定义：** `Leaf`（没有子步骤的原子操作）是处理的最小单元 - 一个只做一件事且没有内部步骤的函数。它可能是业务叶节点（纯计算），可能是适配器叶节点（I/O\
  \ 或副作用）。\n\n**原理（基于标准）：**\n- **认知开销**：原子操作没有需要跟踪的内部步骤 - 立即理解 (+2)\n- **业务/技术比例**：业务叶节点是纯领域逻辑；适配器叶节点隔离了技术关注点\
  \ (+2)\n- **复杂度**：每个叶节点单一职责 - 没有隐藏的交互 (+2)\n- **可靠性**：纯业务叶节点是确定性的且易于测试 (+1)\n\n\
  ### 业务叶节点 (Business Leaves)\n\n业务叶节点是转换数据或强制业务规则的纯函数：\n\n```\n[](#cb112-1)//简单的计算叶节点\n\
  [](#cb112-2)public static Price calculateDiscount(Price original, Percentage rate)\
  \ {\n[](#cb112-3)    return original.multiply(rate);\n[](#cb112-4)}\n[](#cb112-5)\n\
  // 领域规则强制叶节点\n[](#cb112-6)public static Result<Unit> checkInventory(Product product,\
  \ Quantity requested) {\n[](#cb112-7)    return product.availableQuantity().isGreaterThanOrEqual(requested)\n\
  [](#cb112-8)        ? Result.unitResult()\n[](#cb112-9)        : InsufficientInventory.cause(product.id(),\
  \ requested);\n[](#cb112-10)}\n[](#cb112-11)\n// 数据转换叶节点\n[](#cb112-12)public static\
  \ OrderSummary toSummary(Order order) {\n[](#cb112-13)    return new OrderSummary(order.id(),\n\
  [](#cb112-14)                            order.totalAmount(),\n[](#cb112-15)   \
  \                         order.items().size());\n[](#cb112-16)}\n```\n\n如果没有 I/O\
  \ 也没有副作用，它就是业务叶节点。保持每个叶节点专注于一个转换或一个业务规则。\n\n### 适配器叶节点 (Adapter Leaves)\n\n适配器叶节点与外部系统集成：数据库、HTTP\
  \ 客户端、消息队列、文件系统。它们将外部错误映射到领域 `Causes`。\n\n```\n[](#cb113-1)public interface UserRepository\
  \ {\n[](#cb113-2)    Promise<Option<User>> findByEmail(Email email);\n[](#cb113-3)}\n\
  // 适配器叶节点\n[](#cb113-4)class PostgresUserRepository implements UserRepository {\n\
  [](#cb113-5)    private final DataSource dataSource;\n[](#cb113-6)    public Promise<Option<User>>\
  \ findByEmail(Email) {\n[](#cb113-7)        return Promise.lift(RepositoryError::new,\n\
  [](#cb113-8)                            () -> {\n[](#cb113-9)                  \
  \              try (var conn = dataSource.getConnection();\n[](#cb113-10)      \
  \                               var stmt = conn.prepareStatement(\n[](#cb113-11)\
  \                                         \"SELECT * FROM users WHERE email = ?\"\
  )) {\n[](#cb113-12)                                    stmt.setString(1, email.value());\n\
  [](#cb113-13)                                    var rs = stmt.executeQuery();\n\
  [](#cb113-14)                                    return rs.next() ? mapUser(rs)\
  \ : null;\n[](#cb113-15)                                 }\n[](#cb113-16)      \
  \                      }).map(Option::option);\n[](#cb113-17)    }\n[](#cb113-18)\
  \    private User mapUser(ResultSet rs) throws SQLException {\n[](#cb113-19)   \
  \     return new User(/* ... */);\n[](#cb113-20)    }\n}\n```\n\n适配器捕获 `SQLException`\
  \ 并将其封装在领域 `Cause` `RepositoryError.DatabaseFailure` 中。调用者永远看不到 `SQLException`。\n\
  \n## 线程安全\n\n叶操作通过限制安全的安全的每次调用都使用自己的本地状态独立操作。可变本地变量（累加器、构建器、工作对象）在叶内部是安全的，因为它们不会逃逸函数作用域。输入参数必须被视为只读。\n\
  \n### 放置规则\n\n**如果一个叶节点只被一个调用者使用**，将其保持在附近（同一个文件、同一个包）。\n\n**如果它被复用**，立即将其移动到最近的\
  \ `shared` 包。不要推迟——当共享代码留在错误的位置时，技术债就会累积。\n\n***\n\n## 模式：条件 (Condition)\n\n条件表示基于数据的分支逻辑。关键在于：将条件表示为值而不是而不是流副作用。保持分支处于相同的抽象层级。\n\
  \n### 简单条件\n\n\n\n\n```java\n// 执行：将条件作为返回 monad 的表达式\nResult<Discount> calculateDiscount(Order\
  \ order) {\n    return order.isPremiumUser()\n        ? premiumDiscount(order) \
  \     // 返回 Result<Discount>\n        : standardDiscount(order);    // 返回 Result<Discount>\n\
  }\n```\n\n两个分支都返回相同的类型（`Result<Discount>`），因此三元运算符只是在选择调用哪个函数。没有混合抽象的情况。\n\n###\
  \ 模式匹配\n\n使用 Java 的 switch 表达式：\n\n```java\nResult<ShippingCost> calculateShipping(Order\
  \ order, ShippingMethod method) {\n    return switch (method) {\n        case STANDARD\
  \ -> standardShipping(order);\n        case EXPRESS -> expressShipping(order);\n\
  \        case OVERNIGHT -> overnightShipping(order);\n    };\n}\n```\n\n每个 case\
  \ 都返回 `Result<ShippingCost>`。switch 表达式求值出一个单一结果。\n\n### 嵌套条件\n\n通过将子决策提取为具命名函数来避免深度嵌套：\n\
  \n```java\n// 避免：嵌套的三元运算符\nreturn user.isPremium()\n    ? (order.total().greaterThan(THRESHOLD)\n\
  \        ? largeOrderPremiumDiscount(order)\n        : smallOrderPremiumDiscount(order))\n\
  \    : (order.total().greaterThan(THRESHOLD)\n        ? largeOrderStandardDiscount(order)\n\
  \        : smallOrderStandardDiscount(order));\n```\n\n提取：\n\n```java\n// 执行：提取嵌套逻辑\n\
  Result<Discount> calculateDiscount(User user, Order order) {\n    return user.isPremium()\n\
  \        ? premiumDiscount(order)\n        : standardDiscount(order);\n}\n\nprivate\
  \ Result<Discount> premiumDiscount(Order order) {\n    return order.total().greaterThan(THRESHOLD)\n\
  \        ? largeOrderPremiumDiscount(order)\n        : smallOrderPremiumDiscount(order);\n\
  }\n\nprivate Result<Discount> standardDiscount(Order order) {\n    return order.total().greaterThan(THRESHOLD)\n\
  \        ? largeOrderStandardDiscount(order)\n        : smallOrderStandardDiscount(order);\n\
  }\n```\n\n现在每个函数都有一层分支。清晰得多。\n\n### 带有 Monad 的条件\n\n在适用时使用 `filter` 进行更整洁的组合：\n\n\
  ```java\n// 避免：lambda 中的三元运算符\nreturn fetchUser(userId)\n    .flatMap(user -> user.isActive()\n\
  \        ? processActiveUser(user)\n        : UserError.InactiveAccount.INSTANCE.result());\n\
  \n// 执行：使用 filter（优先）\nreturn fetchUser(userId)\n    .filter(User::isActive, UserError.InactiveAccount.INSTANCE)\n\
  \    .flatMap(this::processActiveUser);\n```\n\n***\n\n## 模式：迭代\n\n**定义：** 迭代处理集合、流或递归结构。优先使用函数式组合器而非显式循环。保持转换的纯净性。\n\
  \n**理由（基于标准）：**\n- **心理开销**：声明式组合器陈述了意图；命令式循环需要追踪 (+2)\n- **业务/技术比例**：map/filter\
  \ 表达业务逻辑；循环是迭代机制 (+2)\n- **复杂度**：函数式组合消除了索引管理和循环状态 (+2)\n- **可靠性**：纯净转换没有副作用 - 具有确定性且可测试性\
  \ (+2)\n\n### 映射集合\n\n```java\n// 将原始输入列表转换为领域对象\nResult<List<Email>> parseEmails(List<String>\
  \ rawEmails) {\n    return Result.allOf(rawEmails.stream()\n                   \
  \              .map(Email::email)\n                                 .toList());\n\
  }\n```\n\n`Result.allOf` 将 `List<Result<Email>>` 聚合为 `Result<List<Email>>`。如果任何邮件无效，你将得到一个包含所有失败信息的\
  \ `Composite`。\n\n### 过滤与转换\n\n```java\nList<ActiveUser> activeUsers(List<User>\
  \ users) {\n    return users.stream()\n                .filter(User::isActive)\n\
  \                .map(this::toActiveUser)\n                .toList();\n}\n\nprivate\
  \ ActiveUser toActiveUser(User user) {\n    return new ActiveUser(user.id(), user.email());\n\
  }\n```\n\n纯净转换，无副作用，返回 `List<ActiveUser>`（不是 `Result`，因为这可能会失败）。\n\n### 异步迭代\n\n\
  在带有异步操作的情况下处理集合时，在顺序和并行之间做出选择：\n\n**顺序：**\n\n```java\n// 逐个处理订单\nPromise<List<Receipt>>\
  \ processOrders(List<Order> orders) {\n    Promise<List<Receipt>> result = Promise.success(List.of());\n\
  \    for (Order order : orders) {\n        result = result.flatMap(this::appendReceipt,\
  \ order);\n    }\n    return result;\n}\n\nprivate Promise<List<Receipt>> appendReceipt(List<Receipt>\
  \ receipts, Order order) {\n    return processOrder(order)\n               .map(receipt\
  \ -> appendToList(receipts, receipt));\n}\n```\n\n**并行（当订单相互独立时）：**\n\n```java\n\
  // 并行处理订单\nPromise<List<Receipt>> processOrders(List<Order> orders) {\n    return\
  \ Promise.allOf(orders.stream()\n                               .map(this::processOrder)\n\
  \                               .toList());\n}\n```\n\n## 常见错误\n\n**不要在流操作中混合副作用：**\n\
  \n```java\n// 避免：map 中的副作用\nusers.stream()\n    .map(user -> {\n        logger.info(\"\
  Processing user: {}\", user.id());  // 副作用\n        return processUser(user);\n\
  \    })\n    .toList();\n```\n\n**当存在组合器时，不要使用命令式循环：**\n\n```java\n// 避免：命令式累积\n\
  List<Result<Email>> results = new ArrayList<>();\nfor (String raw : rawEmails) {\n\
  \    results.add(Email.email(raw));\n}\n\n// 执行：声明式集合\nResult<List<Email>> emails\
  \ = Result.allOf(\n    rawEmails.stream().map(Email::email).toList()\n);\n```\n\n\
  ***\n\n## 命名规范\n\n一致的命名可以减少认知负载并使代码自文档。\n\n### 工厂方法命名\n\n工厂方法始终与其类型命名，并小写开头（驼峰法）：\n\
  \n```java\nEmail.email(\"user@example.com\")\nPassword.password(\"Secret123\")\n\
  AccountId.accountId(\"ACC-001\")\n```\n\n这种模式对 grep 友好：搜索 `Email.email` 可以找到所有构造位置。\n\
  \n### 已验证输入命名\n\n使用 `Valid` 前缀（而非 `Validated`）来表示已验证输入的类型：\n\n```java\n// 执行：使用\
  \ Valid 前缀\nrecord ValidRequest(Email email, Password password) {\n    static Result<ValidRequest>\
  \ validRequest(Request raw) { ... }\n}\n\n// 避免：使用 Validated 前缀（过于冗长）\nrecord ValidatedRequest(...)\n\
  ```\n\n### 区域命名词汇\n\n**区域 2 动词（步骤接口 - 编排）：**\n\n| 动词 | 使用场景 | 示例 |\n| --- | ---\
  \ | --- |\n| `validate` | 检查规则/约束 | `ValidateInput` |\n| `process` | 转换或解释 | `ProcessPayment`\
  \ |\n| `handle` | 协调事件的响应 | `HandleRefund` |\n| `load` | 为使用检索数据 | `LoadUserProfile`\
  \ |\n| `save` | 持久化更改 | `SaveOrder` |\n\n\n\n\n\n| `check` | 验证条件 | `CheckInventory`\
  \ |\n\n## Zone 3 动词（叶子节点 - 实现）\n\n| 动词 | 典型用途 | 示例 |\n| --- | --- | --- |\n| `get`\
  \ | 获取值 | `getTimestamp()` |\n| `fetch` | 从外部源提取 | `fetchWeatherData()` |\n| `parse`\
  \ | 析结构化输入 | `parseJson()` |\n| `calculate` | 执行计算 | `calculateTax()` |\n| `hash`\
  \ | 密码学转换 | `hashPassword()` |\n| `format` | 构建结构化输出 | `formatDate()` |\n| `send`\
  \ | 通过网络传输 | `sendEmail()` |\n\n### 测试命名\n\n遵循模式：`methodName_outcome_condition`\n\
  \n```\n[](#cb127-1)void validRequest_succeeds_forValidInput()\n[](#cb127-2)void\
  \ validRequest_fails_forInvalidEmail()\n[](#cb127-3)void execute_succeeds_forValidInput()\n\
  [](#cb127-4)void execute_fails_whenEmailAlreadyExists()\n```\n\n## 核心要点\n\n1. **每个函数单一模式**\
  \ - 每个函数仅一种模式，如果看到两个，则进行提取\n2. **单一抽象层级** - Lambda 中不要有复杂的逻辑，仅使用方法引用或简单的转发\n3. **叶子节点\
  \ (Leaf)** - 原子单元：纯计算（业务逻辑）或 I/O（适配器）\n4. **条件 (Condition)** - 将分支视为值，且所有分支的返回类型一致\n\
  5. **迭代 (Iteration)** - 集合上的函数式组合器，纯转换\n6. **基于区域的命名** - 为每个抽象层使用合适的动词\n\n## 练习\n\
  \n请参 附录 B 关于以下练习：\n- 练习 3.1：模式识别\n- 练习 3.2：叶子节点提取\n- 练习 3.4：基于区域的命名\n\n## 下一步\n\n\
  第 8 章 涵盖了高级模式——序列器（Sequencer）、分叉合并（Fork-Join）和切面（Aspects），这些模式将这些基础模式组合成复杂的工作流。\n\
  \n# 第 8 章：高级模式\n\n## 你将学习\n\n* **序列器 (Sequencer)**：用于链式依赖步骤的核心模式\n* **分叉合并 (Fork-Join)**：用于独立操作的并行组合\n\
  * **切面 (Aspects)**：在不混合职责的情况下添加跨越关注点\n\n**前提条件：** 第 7 章：基础模式与结构\n\n## 模式：序列器 (Sequencer)\n\
  \n**定义：** `Sequencer` 使用 `map` 和 `flatMap` 线性地链接依赖步骤。每个步骤的输出作为下一个步骤的输入。这是实现用例逻辑的主要模式。\n\
  \n**原理（基于标准）：**\n- **心理开销**：线性流，2-5 个步骤符合短期记忆容量——结构可预测 (+3) \n- **业务/技术比例**：步骤反映了业务流程语言——读起来像需求描述\
  \ (+3)\n- **复杂度**：快速失败语义，每个步骤都是隔离且可测试的 (+2)\n- **设计影响**：强制进行合理的步骤拆分，防止单体函数 (+2)\n\
  \n### 2-5 原则\n\n一个 `Sequencer` 应该有 2 到 5 个步骤。少于 2 个可能仅仅是一个 `Leaf`（叶子节点）。超过 5 个则需要拆分——提取子序列器或对步骤分组。\n\
  \n> 该规则旨在限制局部复杂度。它源自短期记忆的平均大小——7 +/- 2 个元素。\n\n**领域需求优先：** 某些函数因为领域要求天然需要更多步骤。值对象工厂可能需要多个验证和归一化步骤以确保不变性。Fork-Join\
  \ 模式可能需要聚合 6 个以上的独立结果，因为那是领域的要求。不要人为地将领域逻辑塞入数字规则中。2-5 指南可以帮助你识别何时考虑考虑重构，但领域语义永远胜一筹。\n\
  \n### 同步示例\n\n```\n[](#cb128-1)public interface ProcessOrder {\n[](#cb128-2)   \
  \ record Request(String orderId, String paymentToken) {}\n[](#cb128-3)    record\
  \ Response(OrderConfirmation confirmation) {}\n[](#cb128-4)\n[](#cb128-5)    Result<Response>\
  \ execute(Request request);\n[](#cb128-6)\n[](#cb128-7)    interface ValidateInput\
  \ {\n[](#cb128-8)        Result<ValidRequest> apply(Request raw);\n[](#cb128-9)\
  \    }\n[](#cb128-10)    interface ReserveInventory {\n[](#cb128-11)        Result<Reservation>\
  \ apply(ValidRequest req);\n[](#cb128-12)    }\n[](#cb128-13)    interface ProcessPayment\
  \ {\n[](#cb128-14)        Result<Payment> apply(Reservation reservation);\n[](#cb128-15)\
  \    }\n[](#cb128-16)    interface ConfirmOrder {\n[](#cb128-17)        Result<Response>\
  \ apply(Payment payment);\n[](#cb128-18)    }\n[](#cb128-19)\n[](#cb128-20)    static\
  \ ProcessOrder processOrder(ValidateInput validate,\n[](#cb128-21)             \
  \                        ReserveInventory reserve,\n[](#cb128-22)              \
  \                       ProcessPayment processPayment) {\n[](#cb128-23)    return\
  \ request -> validate.apply(request)\n[](#cb128-24)                            \
  \         .flatMap(reserve::apply)\n[](#cb128-25)                              \
  \       .flatMap(processPayment::apply)\n[](#cb128-26)                         \
  \            .flatMap(confirm::apply);\n[](#cb128-27)    }\n}\n```\n\n### 异步示例\n\
  \n```\n[](#cb129-1)public Promise<Response> execute(Request request) {\n[](#cb129-2)\
  \    return validate.apply(request)\n[](#cb129-3)                              \
  \       .async()\n[](#cb129-4)                                     .flatMap(reserve::apply)\n\
  [](#cb129-5)                                     .flatMap(processPayment::apply)\n\
  [](#cb129-6)                                     .flatMap(confirm::apply);\n[](#cb129-7)}\n\
  ```\n\n### 何时提取子序列器\n\n如果一个步骤变得复杂，将其提取到自己的接口中。假设 `processPayment` 实际上需要：授权卡 -> 扣款\
  \ -> 记录交易。这是三个依赖步骤——一个序列器。提取如下：\n\n```\n[](#cb130-1)interface ProcessPayment {\n\
  [](#cb130-2)    Promise<Payment> apply(Reservation reservation);\n[](#cb130-3)}\n\
  \n[](#cb130-4)interface CreditCardPaymentProcessor extends ProcessPayment {\n[](#cb130-5)\
  \    interface AuthorizeCard {\n[](#cb130-6)        Promise<Reservation> apply(Reservation\
  \ reservation);\n[](#cb130-7)    }\n[](#cb130-8)    interface CaptureFunds {\n[](#cb130-9)\
  \        Promise<Reservation> apply(Reservation reservation);\n[](#cb130-10)   \
  \ }\n[](#cb130-11)    interface RecordTransaction {\n[](#cb130-12)        Promise<Payment>\
  \ apply(Reservation reservation);\n[](#cb130-13)    }\n[](#cb130-14)    static CreditCardPaymentProcessor\
  \ creditCardPaymentProcessor(\n[](#cb130-15)            AuthorizeCard authorizeCard,\n\
  [](#cb130-16)            CaptureFunds captureFunds,\n[](#cb130-17)            RecordTransaction\
  \ recordTransaction) {\n[](#cb130-18)        return (reservation) -> authorizeCard.apply(reservation)\n\
  [](#cb130-19)                                             .flatMap(captureFunds::apply)\n\
  [](#cb130-20)                                             .flatMap(recordTransaction::apply);\n\
  [](#cb130-21)    }\n}\n```\n\n现在 `CreditCardPaymentProcessor` 本身是一个包含三个步骤的序列器。顶层用例仍然保持着清晰的\
  \ 4 步骤链。\n\n## 线程安全\n\n\n\n\nSequencer 模式通过`顺序执行实现线程安全` - 步骤按顺序一个接一个执行，永远并行。每个步骤都是隔离且线程绑定的。单个步骤内部的可变本地状态是安全的，因为步骤不会重叠。在步骤之间传递的数据必须是不可变的。\n\
  \n## 常见错误\n\n**不要在 flatMap 中嵌套逻辑：**\n\n```java\n// DON'T: 业务逻辑埋没在 lambda 中\nreturn\
  \ validate.apply(request)\n    .flatMap(valid -> {\n        if (valid.isPremiumUser())\
  \ {\n            return applyDiscount(valid)\n                .flatMap(reserve::apply);\n\
  \        } else {\n            return reserve.apply(valid);\n        }\n    })\n\
  \    .flatMap(processPayment::apply);\n```\n\n提取为：\n\n```java\n// DO: 提取到命名函数\n\
  return validate.apply(request)\n               .flatMap(this::applyDiscountIfEligible)\n\
  \               .flatMap(reserve::apply)\n               .flatMap(processPayment::apply);\n\
  \nprivate Result<ValidRequest> applyDiscountIfEligible(ValidRequest request) {\n\
  \    return request.isPremiumUser()\n        ? applyDiscount(request)\n        :\
  \ Result.success(request);\n}\n```\n\n**不要在 Sequencer 中不经提取就混合 Fork-Join：**\n\n\
  ```java\n// DON'T: 在序列中间突然执行 Fork-Join\nreturn validate.apply(request)\n    .flatMap(valid\
  \ -> {\n        var userPromise = fetchUser(valid.userId());\n        var productPromise\
  \ = fetchProduct(valid.productId());\n        return Promise.all(userPromise, productPromise)\n\
  \            .flatMap((user, product) -> reserve.apply(user, product));\n    })\n\
  \    .flatMap(processPayment::apply);\n```\n\n提取为：\n\n```java\n// DO: 将 Fork-Join\
  \ 提取到它它步骤中\nreturn validate.apply(request)\n               .flatMap(this::fetchUserAndProduct)\
  \  // Fork-Join 在内部\n               .flatMap(reserve::apply)\n               .flatMap(processPayment::apply);\n\
  \nprivate Promise<ReservationInput> fetchUserAndProduct(ValidRequest request) {\n\
  \    return Promise.all(fetchUser(request.userId()),\n                       fetchProduct(request.productId()))\n\
  \                  .map(ReservationInput::new);\n}\n```\n\n***\n\n## 模式：Fork-Join\n\
  \n**定义：** Fork-Join（也称为扇出-扇入）并发执行独立操作并合并它们的结果。当你有多个分支之间没有依赖关系的并行工作时，请使用它。\n\n**设计原理（基于标准）：**\n\
  - **心理开销**：并行执行在结构中是显式化的 - 没有隐藏的并发 (+2)\n- **复杂度**：独立性约束充当设计验证器 - 强制进行合理的数据组织 (+3)\n\
  - **可靠性**：类型系统防止依赖操作被并行化 (+2)\n- **对设计的影响**：揭示耦合问题 - 依赖关系以编译错误的形式呈现 (+3)\n\n###\
  \ 两种主要形式\n\n**1. `Result.all(...)` - 同步聚合：**\n\n不是并发的，只是收集多个 Result：\n\n```java\n\
  // 验证多个独立字段\nResult<ValidRequest> validated = Result.all(Email.email(raw.email()),\n\
  \                                            Password.password(raw.password()),\n\
  \                                            AccountId.accountId(raw.accountId()))\n\
  \                                       .flatMap(ValidRequest::new);\n```\n\n如果全部成功，你将获得一个传递给组合器的值元组。如果任何一个失败，你将得到一个包含所有失败的\
  \ `CompositeCause`（而不是第一个）。\n\n**2. `Promise.all(...)` - 并行异步执行：**\n\n```java\n\
  // 并行运行独立的 I/O 操作\nPromise<Dashboard> buildDashboard(UserId userId) {\n    return\
  \ Promise.all(userService.fetchProfile(userId),\n                       orderService.fetchOrders(userId),\n\
  \                       notificationService.fetchUnread(userId))\n             \
  \ .map(this::createDashboard);\n}\n\nprivate Dashboard createDashboard(Profile profile,\
  \ List<Order> orders, List<Notification> notifications) {\n    return new Dashboard(profile,\
  \ orders, notifications);\n}\n```\n\n三个全部并发运行。\n\n### 特殊 Fork-Join 情况\n\n**1. `allOf(Collection<Promise<T>>)`\
  \ - 韧性集合：**\n\n```java\n// 从动态数量的源获取数据\nPromise<Report> generateSystemReport(List<ServiceId>\
  \ services) {\n    var healthChecks = services.stream()\n                      \
  \         .map(healthService::check)\n                               .toList();\n\
  \    return Promise.allOf(healthChecks)\n                  .map(this::createReport);\n\
  }\n\nprivate Report createReport(List<Result<HealthStatus>> results) {\n    var\
  \ successes = results.stream()\n                           .filter(Result::isSuccess)\n\
  \                           .map(Result::value)\n                           .toList();\n\
  \    var failures = results.stream()\n                            .filter(Result::isFailure)\n\
  \                            .map(Result::cause)\n                            .toList();\n\
  \    return new Report(successes, failures);\n}\n```\n\n返回 `Promise<List<Result<T>>>`\
  \ - 与快速失败的 `Promise.all()` 不同，`allOf()` 等待所有完成并收集成功和失败。\n\n**2. `Promise.any(Promise<T>...)`\
  \ - 第一个成功胜出：**\n\n```java\n// 多个数据源竞争\nPromise<ExchangeRate> fetchRate(Currency\
  \ from, Currency to) {\n    return Promise.any(primaryRateProvider.getRate(from,\
  \ to),\n                       secondaryRateProvider.getRate(from, to),\n      \
  \                 fallbackRateProvider.getRate(from, to));\n}\n```\n\n返回第一个成功完成的\
  \ Promise，取消其余操作。\n\n### 独立性与线程安全\n\nFork-Join 有一个关键约束：**所有分支必须具有不可变输入且是真正独立的**。\n\
  \n> **注意**：类型级别的独立性并不等同于基础设施级别的独立性。在代码层面看起来独立的的操作在基础设施层面可能会冲突： - **数据库锁**：两个查询可能会在共享行上发生死锁\
  \ - **速率限制**：并行 API 调用可能会耗尽配额 - **连接池**：并行操作可能会竞争连接 - **事务**：同一事务中的操作可能有顺序要求\n\n\
  > \n\n> 验证基础设施约束，而不仅仅是类型签名。\n\n**设计上的独立性** - 当你尝试编写 Fork-Join 并发现隐藏依赖关系时，它揭示了设计问题：\
  \ - 数据冗余：如果分支 A 需要分支 B 的数据，可能这些数据应该提前提供 - 错误的数据组织：依赖关系表明数据被分在不同的源中，而它们应该放在一起 - 缺失抽象：隐藏的依赖关系可能意味着缺少某个概念\n\
  \n\n\n\n\n## 线程安全\n\n并行执行需要不可变输入：\n- 所有输入数据必须是不可变的\n- 并行分支之间没有共享的可变状态\n- 局部可变状态是安全的\n\
  - 每个分支内的线程受限累加器、构建器是可以的\n- 结果必须是不可变的\n- 从分支返回的数据将会被合并\n\n## 示例设计问题：\n\n```java\n\
  // 不要：逻辑依赖\nPromise.all(fetchUserProfile(userId),      // 返回 User\n            fetchUserPreferences(userId))\
  \  // 需要 profile 中的 User.timezone！\n```\n\n## 线程安全违规示例：\n\n```java\n// 不要：共享可变状态\n\
  private final DiscountContext context = new DiscountContext();  // 可变的\n\nPromise<Result>\
  \ calculate() {\n    return Promise.all(applyBogo(cart, context),       // 数据竞态\n\
  \                       applyPercentOff(cart, context))  // 两者都会修改 context\n   \
  \               .map(this::merge);\n}\n\n// ：不可变输入\nPromise<Result> calculate(Cart\
  \ cart) {\n    return Promise.all(applyBogo(cart),        // 不可变的 cart\n       \
  \                applyPercentOff(cart))  // 不可变的 cart\n                  .map(this::mergeDiscounts);\n\
  }\n```\n\n## 常见错误\n\n**当存在隐藏依赖时，不要使用 Fork-Join：**\n\n```java\n// 不要：这些实际上并不是独立的\n\
  Promise.all(allocateInventory(orderId),   // 可能会锁定库存\n            chargePayment(paymentToken))\
  \  // 只有在库存成功时才应该收费\n```\n\n如果库存分配失败，我们已经收了客户的。使用 `Sequencer`。\n\n**不要忽略 Fork-Join\
  \ 分支中的错误：**\n\n```java\n// 不要：静默吞掉失败\nPromise.all(fetchPrimary(id).recover(err ->\
  \ Option.none()),  // 隐藏了失败\n            fetchSecondary(id).recover(err -> Option.none()))\n\
  ```\n\n使用适当的类型显式建模“尽力而为”的情况。\n\n***\n\n## 模式：切面（Aspects / 装饰器）\n\n**定义：** 切面是高阶函数，通过包装步骤或用例来添加跨越关注点——重试、超时、日志记录、指标——而不改变业务语义。\n\
  \n**合理性（基于标准）：**\n- **心智负担**：跨越关注点与业务逻辑分离——职责清晰 (+3)\n- **业务/技术比例**：业务逻辑保持纯洁；技术性关注点隔离在装饰器中\
  \ (+3)\n- **复杂性**：通过高阶函数实现可组合的切面——无需框架魔术 (+2)\n- **设计影响**：业务逻辑独立于重试/指标/日志记录——可单独测试\
  \ (+3)\n\n### 放置\n\n**局部关注点：** 当切面仅适用于该步骤时，包装单个步骤。例如：仅对外部 API 调用进行重试。\n\n**跨越关注点：**\
  \ 包装整个 `execute()` 方法。例如：整个用例的指标统计。\n\n### 示例：步骤上的重试切面\n\n```java\npublic interface\
  \ FetchUserProfile {\n    Promise<Profile> apply(UserId userId);\n}\n\n// 步骤实现\n\
  class UserServiceClient implements FetchUserProfile {\n    public Promise<Profile>\
  \ apply(UserId userId) {\n        return httpClient.get(\"/users/\" + userId.value())\n\
  \                         .map(this::parseProfile);\n    }\n}\n\n// 在构造时应用重试切面：\n\
  static ProcessUserData processUserData(..., UserServiceClient userServiceClient,\
  \ ...) {\n    var retryPolicy = RetryPolicy.builder()\n                        \
  \         .maxAttempts(3)\n                                 .backoff(exponential(100,\
  \ 2.0))\n                                 .build();\n\n    return new processUserData(validateInput,\n\
  \                               withRetry(retryPolicy, userServiceClient),  // 被装饰的\n\
  \                               processData);\n}\n```\n\n### 示例：用例上的指标切面\n\n```java\n\
  public interface LoginUser {\n    Promise<LoginResponse> execute(LoginRequest request);\n\
  \n    static LoginUser loginUser(...) {\n        var rawUseCase = new loginUser(...);\n\
  \        var metricsPolicy = MetricsPolicy.metricsPolicy(\"user_login\");\n    \
  \    return withMetrics(metricsPolicy, rawUseCase);\n    }\n}\n```\n\n### 组合多个切面\n\
  \n顺序很重要。典型的顺序（从外层到内层）：\n1. 指标/日志（最外层——观察所有情况）\n2. 超时（全局截止时间）\n3. 断路器器（系统降级时快速失败）\n\
  4. 重试（单次尝试）\n5. 频率限制（节流请求）\n6. 业务逻辑（最内层）\n\n```java\nvar decoratedStep = withMetrics(metricsPolicy,\n\
  \    withTimeout(timeoutPolicy,\n        withCircuitBreaker(breakerPolicy,\n   \
  \         withRetry(retryPolicy, step))));\n```\n\n### 组合语义\n\n| 顺序 | 含义 |\n| :---\
  \ | :--- |\n| Metrics → Timeout → Retry | 指标统计总量；超时适用于所有重试 |\n| Timeout → Metrics\
  \ → Retry | 每次尝试的超时；指标统计每次重试 |\n| Retry → Timeout → Operation | 每次尝试都有自己的超时 |\n\n\
  **超时行为：**\n- **逻辑上**：截止日期后后带有 `TimeoutError` 解析\n- **实际中**：底层操作可能会继续\n- **规则**：超时不保证清理\n\
  \n**重试语义：**\n- **幂等性**：被重试的操作必须是安全的重复\n- **状态变更**：非幂等操作（资金转账、订单创建）需要幂等性密钥\n- **退避**：指数级退避防止群群效应\n\
  \n### 测试切面\n\n使用合成步骤孤立测试切面。用例测试保持切面无关：\n\n```java\n// 切面测试（孤立）\n@Test\nvoid retryAspect_retriesOnFailure()\
  \ {\n    var failingStep = new FlakyStep(2);  // 失败次数\n    var retryPolicy = RetryPolicy.maxAttempts(3);\n\
  \    var decorated = withRetry(retryPolicy, failingStep);\n\n    var result = decorated.apply(input).await();\n\
  \n    assertTrue(result.isSuccess());\n    assertEquals(3, failingStep.invocationCount());\n\
  }\n\n// 用例测试（与切面无关）\n@Test\nvoid loginUser_success() {\n    var useCase = LoginUser.loginUser(mockValidate,\
  \ mockCheckCreds, mockGenerateToken);\n\n    var result = useCase.execute(validRequest).await();\n\
  \n    assertTrue(result.isSuccess());\n    // 关于重试、超时等的断言\n}\n```\n\n**不要将切面逻辑混合到业务逻辑中：**\n\
  \n\n\n\n\n```java\n[](#cb149-1)// 避免：不要在步骤内部编写重试逻辑\n[](#cb149-2)Promise<Profile>\
  \ fetchProfile(UserId id) {\n[](#cb149-3)    return retryWithBackoff(() -> httpClient.get(\"\
  /users/\" + id.value())\n[](#cb149-4)            .map(this::parseProfile);\n[](#cb149-5)}\n\
  ```\n\n提取到切面装饰器（aspect decorator）。\n\n**要保持切面的组合性和可用性：**\n\n```java\n[](#cb150-1)static\
  \ <I, O> Fn1<I, Promise<O>> withTimeout(TimeSpan timeout, Fn1<I, Promise<O>> step)\
  \ {\n[](#cb150-2)    return input -> step.apply(input).timeout(timeout);\n[](#cb150-3)}\n\
  [](#cb150-4)\nstatic <I, O> Fn1<I, Promise<O>> withRetry(RetryPolicy policy, Fn1<I,\
  \ Promise<O>> step) {\n[](#cb150-6)    return input -> retryLogic(policy, () ->\
  \ step.apply(input));\n[](#cb150-7)}\n```\n\n### 日志哲学\n\n**原则：** 日志只存在于**叶子节点（leaves）**和**外部边界（external\
  \ boundaries）**。组合代码没有任何日志。\n\n**理由：**\n- 叶子节点执行实际工作——它们是操作可能失败或产生可副作用的唯一地方\n- 边界是与外部系统交互的地方——不确定性的点\n\
  - 其他所有内容都是组合——值在系统中的确定性路由\n\n**实现：** 在构造时将叶子节点的实现封装在日志切面中：\n\n```java\n[](#cb151-1)public\
  \ interface UserRepository {\n[](#cb151-2)    Promise<User> findById(UserId id);\n\
  [](#cb151-4)\n    static UserRepository create(DataSource ds, Logger log) {\n[](#cb151-5)\
  \        var impl = new UserRepositoryImpl(ds);\n[](#cb151-6)        return withLogging(log,\
  \ \"UserRepository\", impl);\n[](#cb151-7)    }\n}\n[](#cb151-10)public static UserRepository\
  \ withLogging(Logger log, String name, UserRepository impl) {\n[](#cb151-11)   \
  \ return id -> {\n[](#cb151-12)        var correlationId = CorrelationContext.current();\n\
  [](#cb151-13)        log.debug(\"[{}] {}.findById input: {}\", correlationId, name,\
  \ id);\n[](#cb151-15)        return impl.findById(id)\n[](#cb151-16)           \
  \        .onSuccess(user -> log.debug(\"[{}] {}.findById success\", correlationId,\
  \ name))\n[](#cb151-17)                   .onFailure(cause -> log.warn(\"[{}] {}.findById\
  \ failure: {}\", correlationId, name, cause.message()));\n[](#cb151-19)    };\n\
  }\n```\n\n**记录记录的内容：**\n- 输入参数（已对敏感数据处理）\n- 结果（成功或失败原因）\n- 用于请求追踪的关联 ID（Correlation\
  \ ID）\n\n**反模式 - 在组合代码中散布日志：**\n\n```java\n[](#cb152-1)// 避免：不要在组合代码中写日志\n[](#cb152-2)return\
  \ validateInput(request)\n[](#cb152-3)    .onSuccess(v -> log.info(\"Validated\"\
  ))  // 噪声\n[](#cb152-4)    .flatMap(this::fetchUser)\n[](#cb152-5)    .onSuccess(u\
  \ -> log.info(\"Fetched user\"))  // 噪声\n[](#cb152-6)    .flatMap(this::processOrder);\n\
  [](#cb152-8)// 做到：在构造时封装叶子节点\n[](#cb152-9)static ProcessOrder processOrder(UserRepository\
  \ users, Logger log) {\n[](#cb152-10)    return new ProcessOrderImpl(withLogging(log,\
  \ \"users\", users));\n}\n```\n\n* * *\n\n## 核心要点\n\n1. **顺序器 (Sequencer)** - 链式依赖的步骤（2-5\
  \ 规则），快速失败语义\n2. **分叉-合并 (Fork-Join)** - 并行的独立操作，严格的不可变性要求\n3. **切面 (Aspects)**\
  \ - 作为装饰器的横切关注点，并进行单独测试\n4. **日志哲学** - 日志仅位于叶子节点和边界，组合过程是透明的\n5. **独立性验证** - 防止\
  \ Fork-Join 错误；如果不确定，请使用 Sequencer\n6. **模式组合** - 顺序器调用 Fork-Join，切面封装两者\n\n* *\
  \ *\n\n## 练习题\n\n参阅附录 B 关于以下主题的练习：\n- 练习 3.3：模式组合\n- 练习 3.5：切面实现\n\n* * *\n\n##\
  \ 下一步计划\n\n第 9 章 提供了一个全面的线程安全快速参考，整合了 JBCT 模式中所有的线程安全规则。\n\n# 第 9 章：线程安全\n\n## 你将学到\n\
  \n* JBCT 中的核心线程安全原则\n* JBCT 中的核心线程安全原则\n* JBCT 中的核心线程安全原则\n\n## 核心规则\n\n**确保线程安全：**\n\
  1. **不可变性**：线程间传递的数据必须是不可变的或经过复制的。\n2. **边界**：同步发生在边界处。\n\n* * *\n\n## 各模式的保证\n\n\
  ### 叶子节点（顺序执行）\n\n通过顺序执行实现线程安全：\n\n```java\nnew UserRepositoryImpl(ds); // 安全：局部状态\n\
  ```\n\n### 顺序器（顺序执行）\n\n线程安全的，顺序状态：\n\n```java\nvar total = 0;\nfor (Item item :\
  \ cart.items()) {\n    total += item.price(); // 可变局部变量\n}\nreturn Result.success(total);\n\
  ```\n\n### 分叉-合并（并行）\n\n要求严格的不可变性：\n\n```java\n// 不安全：共享的可变上下文\nDiscountContext\
  \ context = new DiscountContext(); // 可变的！\nPromise.all(applyBogo(cart, context),\
  \ // 同时访问上下文\n            applyPercentOff(cart, context)); // 竞态\n```\n\n### 条件（顺序执行）\n\
  \n线程安全的，无共享状态：\n\n```java\nreturn user.isPremium()\n    ? processPremium(user)\n\
  \    : processBasic(user);\n```\n\n### 迭代（顺序执行）\n\n通过顺序处理实现线程安全：\n\n```java\nvar\
  \ results = items.stream()\n                   .map(Item::validate) // 顺序执行\n  \
  \                 .toList();\n```\n\n### 切面（继承）\n\n安全性取决于被封装的操作：\n\n```java\n//\
  \ 安全：切面保留了底层的安全性\nvar retried = withRetry(retryPolicy, sequentialStep); // 仍然顺序执行\n\
  var retried = withRetry(retryPolicy, forkJoinStep);   // 仍然并行\n```\n\n## Promise\
  \ 解析的线程安全\n\nPromise 解析具有精确一次语义，并内置了同步机制。\n\n\n\n\n\n```\nPromise<User> promise\
  \ = Promise.promise();\n\n// Thread 1\npromise.resolve(Result.success(user));\n\n\
  // Thread 2\npromise.resolve(Result.success(anotherUser));  // 忽略 - 已解析\n```\n\n\
  *   第一个 `resolve()` 胜出，后续调用会被忽略\n*   `flatMap`/`map` 链式会在执行前等待解析完成\n*   解析（Resolution）作为顺序链的同步点\n\
  \n* * *\n\n## 常见错误\n\n### 错误 1：Fork-Join 中的共享可变状态\n\n```java\n// 错误：跨并行操作共享的可变列表\n\
  private final List<String> errors = new ArrayList<>();\n\nPromise.all(validateEmail(request).onFailure(e\
  \ -> errors.add(e.message())),     // 数据竞态\n            validatePassword(request).onFailure(e\
  \ -> errors.add(e.message())))  // 数据竞态\n       .map(this::process);\n```\n\n**修复：**\
  \ 使用不可变结果并在之后进行合并：\n\n```java\n// 正确：每个操作返回自己的结果\nPromise.all(validateEmail(request),\n\
  \            validatePassword(request))\n       .map((emailResult, passwordResult)\
  \ -> combineResults(emailResult, passwordResult));\n```\n\n### 错误 2：在 Promise.all\
  \ 中假设顺序执行\n\n```java\n// 错误：假设了顺序\nPromise.all(incrementCounter(), incrementCounter())\
  \  // 可能并发执行！\n```\n\n`Promise.all` 并行运行操作。如果顺序很重要，请使用 `Sequencer`。\n\n### 错误 3：修改输入参数\n\
  \n```java\n// 错误：修改共享输入\nprivate Promise<Discount> applyDiscount(Cart cart) {\n\
  \    cart.setSubtotal(cart.subtotal().subtract(discount));  // 数据竞态\n    return\
  \ Promise.success(new Discount(discount));\n}\n\n// 正确：创建新实例\nprivate Promise<Discount>\
  \ applyDiscount(Cart cart) {\n    var discountAmount = calculateDiscountFor(cart);\n\
  \    return Promise.success(new Discount(cart, discountAmount));  // 返回新数据\n}\n\
  ```\n\n* * *\n\n## 独立性验证清单\n\n使用此清单来验证并行操作是否真正独立：\n\n如果任何复复选框失败，请使用 `Sequencer`\
  \ 代替 `Fork-Join`。\n\n* * *\n\n## 何使用可变状态\n\n**允许：**\n*   顺序模式中的局部变量（`Leaf`、`Sequencer`、`Condition`、`Iteration`）\n\
  *   构建不可变对象的 Builder\n*   顺序循环中的累加器\n\n**禁止：**\n*   跨并行操作共享 (`Fork-Join`)\n*   在用例步骤之间传递\n\
  *   从函数返回（应返回不可变副本）\n\n* * *\n\n## 线程安全测试\n\n可变测试固件是可以接受的 - 因为测试是按顺序执行的：\n\n```java\n\
  // 安全：测试范围内的可变状态\n@Test\nvoid execute_succeeds_forValidInput() {\n    List<String>\
  \ callLog = new ArrayList<>();  // 可变，但仅限测试范围\n\n    CheckEmail checkEmail = req\
  \ -> {\n        callLog.add(\"email\");  // 顺序执行\n        return Promise.success(req);\n\
  \    };\n\n    useCase.execute(request)\n           .await()\n           .onSuccess(response\
  \ -> assertEquals(List.of(\"email\"), callLog));\n}\n```\n\n测试是顺序的，因此可变固件不会产生竞态。\n\
  \n* * *\n\n## 快速参考表\n\n| 模式 | 执行方式 | 局部可变状态 | 输入要求 |\n| --- | | | --- | --- |\n\
  | Leaf | 顺序 | 安全 | 只读 |\n| Sequencer | 顺序 | 安全 | 步骤间不可变 |\n| Fork-Join | 并行 | 安全\
  \ (局限) | 严格不可变 |\n| Condition | 顺序 | 安全 | 只读 |\n| Iteration | 顺序 | 安全 | 只读 |\n|\
  \ Aspects | 继承 | 继承 | 继承 |\n\n* * *\n\n## 核心要点\n\n1.  **边界处不可变** - 参数和返回值始终保持不可变\n\
  2.  **线程安全** - 局部限制是关键\n3.  **Fork-Join** - 共享可变状态是危险的\n4.  **解析 (Resolution)**\
  \ - 作为同步点作用\n5.  **独立性验证** - 在并行化之前检查\n6.  **Sequencer** - 当顺序重要时使用\n\n* * *\n\n\
  ## 练习\n\n参见 `附录 B` 获取：\n*   3.6：识别线程安全\n*   3.7：将不安全的模式转换为安全的模式\n\n* *\n\n# 接下来做什么\n\
  \n`第 10 章：测试哲学`\n\n## 你将学到\n\n*   为什么集成优先测试与组合是一致的\n*   演进过程：存根 -> 实现 -> 测试就绪\n\
  *   如何处理复杂性\n\n**要求：** `第 9 章：线程安全`\n\n## 传统测试的问题\n\n### 传统方法：关注组件\n\n```java\n\
  // 针对组件的单独测试\nclass ValidateInputTest {\n    @Test void emailValidation() { }\n\
  \    @Test void passwordValidation() { }\n} // 10 个测试\n```\n\n```java\n// 22 个测试\n\
  class CheckCredentialsTest {\n    @Test void validCredentials() { }\n    @Test void\
  \ invalidCredentials() { }\n} // 5 个测试\n```\n\n```java\n// 22 个测试\nclass CheckAccountStatusTest\
  \ {\n    @Test void activeAccount() { }\n    @Test void inactiveAccount() { }\n\
  } // 3 个测试\n```\n\n```java\n// 22 个测试\nclass GenerateTokenTest {\n    @Test void\
  \ tokenGeneration() { }\n} // 4 个测试\n```\n\n\n\n\n```java\nclass EmailTest {\n \
  \   @ParameterizedTest\n    @ValueSource(strings = {\"bad\", \"no@domain\", \"@missing\"\
  , \"CAPS@TEST.COM\"})\n    void email_rejectsInvalidFormat(String raw) {\n     \
  \   Email.email(raw).onSuccess(Assertions::fail);\n    }\n\n    @Test\n    void\
  \ email_normalizesToLowercase() {\n        Email.email(\"USER@EXAMPLE.COM\")\n \
  \            .onSuccess(email -> assertEquals(\"user@example.com\", email.value()));\n\
  \    }\n}\n```\n\n## 为什么在这里进行单元测试？\n\n值对象（Value objects）零依赖。它们是纯函数。单元测试是非常自然的。\n\
  \n## 2. 业务叶节点：复杂时使用单元测试\n\n简单的业务叶节点（单一计算、简单转换）不需要隔离测试 - 它们会被用例集成测试覆盖。\n\n复杂的业务叶节点（丰富的算法、许多分支）值得单元测试：\n\
  \n```java\nclass PricingEngineTest {\n    @Test void volumeDiscount_appliesAtThreshold()\
  \ { /* ... */ }\n    @Test void combinedDiscounts_stackCorrectly() { /* ... */ }\n\
  \    @Test void edgeCases_handleGracefully() { /* ... */ }\n}\n```\n\n**指南：** 如果一个叶节点有\
  \ 3 个以上的条件分支或复杂逻辑，请编写单元测试。\n\n## 3. 用例：集成测试（测试向量）\n\n测试的核心：测试所有步骤组装后的完整用例行为，仅对适配器进行存桩（stub）。\n\
  \n```java\nclass UserLoginTest {\n    CheckCredentials mockCredentials;\n    CheckAccountStatus\
  \ mockStatus;\n    GenerateToken mockToken;\n    UserLogin useCase;\n\n    @BeforeEach\n\
  \    void setup() {\n        mockCredentials = vr -> Result.success(new Credentials(\"\
  user-1\"));\n        mockStatus = c -> Result.success(new Account(c.userId(), true));\n\
  \        mockToken = acc -> Result.success(new Response(\"token-\" + acc.userId()));\n\
  \        useCase = UserLogin.userLogin(mockCredentials, mockStatus, mockToken);\n\
  \    }\n\n    @Test\n    void execute_succeeds_for_ValidInput() {\n        var request\
  \ = new Request(\"john@example.com\", \"Valid123\", null);\n\n        useCase.execute(request)\n\
  \               .onFailure(Assertions::fail)\n               .onSuccess(response\
  \ -> assertEquals(\"token-user-1\", response.token()));\n    }\n}\n```\n\n这测试了**真实行为**：验证\
  \ -> 凭据 -> 状态 -> 令牌，包含错误传播。\n\n* *\n\n## 演化测试流程\n\n### 概述\n\n不要在实现后编写测试，而是与实现**同步**演化测试：\n\
  \n```\n阶段 1: 全部存桩\n    |\n阶段 2: 实现并测试验证\n    |\n阶段 3-N: 增量实现步骤\n    |\n最终：生产就绪\n\
  ```\n\n在每个阶段，**所有测试保持绿色**。你不是在破坏并修复 - 你是在不断成长。\n\n### 阶段 1：全部存桩\n\n**目标：** 在实现任何内容之前建立测试结构。\n\
  \n**步骤 1：** 创建用例接口，并带有一个返回存桩实现的工厂：\n\n```java\npublic interface UserLogin {\n  \
  \  record Request(String email, String password, String referral) {}\n    record\
  \ Response(String token) {}\n\n    Result<Response> execute(Request request);\n\n\
  \    static UserLogin userLogin() {\n        return request -> Result.success(new\
  \ Response(\"stub-token\"));\n    }\n}\n```\n\n**步骤 2：** 编写初始测试：\n\n```java\nclass\
  \ UserLoginTest {\n    @Test\n    void execute_succeeds_forValidInput() {\n    \
  \    var useCase = UserLogin.userLogin();\n        var request = new Request(\"\
  john@example.com\", \"Valid123\", null);\n        useCase.execute(request)\n   \
  \            .onSuccess(response -> assertEquals(\"stub-token\", response.token()));\n\
  \    }\n}\n```\n\n### 阶段 2：实现验证\n\n**步骤 1：** 添加带有验证逻辑的被校验请求：\n\n```java\nrecord\
  \ ValidRequest(Email email, Password password, Option<ReferralCode> referral) {\n\
  \    static Result<ValidRequest> validRequest(Request raw) {\n        return Result.all(Email.email(raw.email()),\n\
  \                          Password.password(raw.password()),\n                \
  \          ReferralCode(raw.referral()))\n                     .map(ValidRequest::new);\n\
  \    }\n}\n```\n\n**步骤 2：** 更新工厂以验证：\n\n```java\nstatic UserLogin userLogin() {\n\
  \    return request -> ValidRequest.validRequest(request).map(_ -> new Response(\"\
  stub-token\"));\n}\n```\n\n**步骤 3：** 添加验证向量：\n\n```java\n@Test\nvoid execute_fails_forInvalidEmail()\
  \ {\n    var useCase = UserLogin.userLogin();\n    var request = new Request(\"\
  bad-email\", \"Valid123\", null);\n    useCase.execute(request)\n           .onSuccess(Assertions::fail);\n\
  }\n\n@Test\nvoid execute_aggregatesMultipleErrors() {\n    var useCase = UserLogin.userLogin();\n\
  \    var request = new Request(\"bad\", \"weak\", \"invalid\");\n    useCase.execute(request)\n\
  \           .onSuccess(Assertions::fail)\n           .onFailure(cause -> assertInstanceOf(CompositeCause.class,\
  \ cause));\n}\n```\n\n### 阶段 3-N：继续扩展\n\n对每个剩余的步骤重复上述操作：\n- 添加步骤接口\n- 更新工厂以接受依赖\n\
  - 更新现有的测试存桩\n- 添加步骤失败场景\n\n* *\n\n## 处理复杂的输入对象\n\n### 测试数据\n\n**用于构建测试数据的流式 API：**\n\
  \n```java\npublic class TestData {\n    public static RequestBuilder request() {\n\
  \        return new RequestBuilder();\n    }\n\n    public static class RequestBuilder\
  \ {\n        private String email = \"default@example.com\";\n        private String\
  \ password = \"DefaultValid123\";\n        private String referral = null;\n\n \
  \       public RequestBuilder withEmail(String email) {\n            this.email\
  \ = email;\n            return this;\n        }\n\n        public RequestBuilder\
  \ withPassword(String password) {\n            this.password = password;\n     \
  \       return this;\n        }\n\n        public Request build() {\n          \
  \  return new Request(email, password, referral);\n        }\n    }\n}\n```\n\n\
  **用法：**\n\n```java\nvar request = TestData.request().build();\nvar invalidEmail\
  \ = TestData.request().withEmail(\"bad\").build();\n```\n\n### 标准测试向量\n\n**预定义的测试数据常量：**\n\
  \n```java\npublic interface TestVectors {\n    Request VALID = new Request(\"user@example.com\"\
  , \"Valid123\", null);\n    Request INVALID_EMAIL = new Request(\"bad\", \"Valid123\"\
  , null);\n    Request WEAK_PASSWORD = new Request(\"user@example.com\", \"weak\"\
  , null);\n    Request MULTIPLE_ERRORS = new Request(\"bad\", \"weak\", \"invalid\"\
  );\n}\n```\n\n### 使用哪种方法？\n\n*   **标准向量：** 简单的用例、字段少、变化有限\n*   **工厂方法：** 中等复杂度、系统性的字段变体\n\
  *   **构建器：** 复杂对象、许多可选字段、多种组合\n\n\n\n\n\n## 核心要点\n\n1. **测试组合而非组件** - 用例才是关键\n2.\
  \ **仅对适配器进行 Stub 模拟** - 数据库、HTTP、外部服务\n3. **随实现演进测试** - 始终保持测试通过，绝不“弄坏再修复”\n4. **三层架构**\
  \ - 值对象（单元测试）、复杂的叶节点（单元测试）、用例（集成测试）\n5. **使用测试数据工具** - 构建器、向量、工厂可减少样板代码\n\n* * *\n\
  \n## 练习\n\n参见 附录 B 关于以下内容的练习：\n- 练习 4.1：构建测试数据构建器\n- 练习 4.2：演进测试流程演练\n\n* * *\n\n\
  ## 下一步\n\n第 11 章 涵盖了实践中的测试——组织大型测试套件、完整的 `RegisterUser` 示例，以及从传统单元测试的迁移。\n\n# 第\
  \ 11 章：实践中的测试\n\n## 你将学习\n\n* 如何组织大量的测试用例而不会陷入复杂性泥潭\n* 在什么位置测试什么（值对象、叶节点、用例、适配器）\n\
  * 完整的示例示例：从 Stub 到生产环境的 `RegisterUser`\n* 如何从传统单元测试迁移\n\n**前提条件：** 第 10 章：测试哲学\n\
  \n* * *\n\n## 管理大量的测试用例\n\n### “问题”\n\n全面的测试会产生大量的测试：\n\n```\nUserLoginTest: 35\
  \ 个测试\nRegisterUserTest: 42 个测试\nUpdateProfileTest: 28 个测试\n```\n\n**这不是问题——而是诚实的复杂性。**\
  \ 35 个测试 = 35 个真实场景。\n\n但为了保持理智，我们需要组织方法。\n\n### 策略 1：嵌套测试类\n\n**按场景类型分组测试：**\n\n\
  ```java\nclass UserLoginTest {\n    private UserLogin useCase;\n    private CheckCredentials\
  \ stubCreds;\n    private CheckAccountStatus stubStatus;\n    private GenerateToken\
  \ stubToken;\n\n    @BeforeEach\n    void setup() {\n        stubCreds = vr -> Result.success(new\
  \ Credentials(\"user-1\"));\n        stubStatus = c -> Result.success(new Account(c.userId(),\
  \ true));\n        stubToken = acc -> Result.success(new Response(\"token-\" + acc.userId()));\n\
  \        useCase = UserLogin.userLogin(stubCreds, stubStatus, stubToken);\n    }\n\
  \n    @Nested class HappyPath {\n        @Test void execute_succeeds_for_ValidInput()\
  \ { /* ... */ }\n        @Test void execute_succeeds_with_OptionalReferral() { /*\
  \ ... */ }\n    }\n\n    @Nested class ValidationFailures {\n        @Test void\
  \ execute_fails_for_InvalidEmail() { /* ... */ }\n        @Test void execute_fails_for_Password()\
  \ { /* ... */ }\n        @Test void execute_aggregatesErrors() { /* ... */ }\n \
  \   }\n\n    @Nested class StepFailures {\n        @Test void execute_fails_whenCredentialsInvalid()\
  \ { /* ... */ }\n        @Test void execute_fails_whenAccountInactive() { /* ...\
  \ */ }\n        @Test void execute_fails_whenTokenGenerationFails() { /* ... */\
  \ }\n    }\n\n    @Nested class EdgeCases {\n        @Test void execute_handles_NullReferral()\
  \ { /* ... */ }\n        @Test void execute_handles_EmptyStrings() { /* ... */ }\n\
  \    }\n}\n```\n\n**优势：**\n- IDE 可折叠嵌套类\n- 高层级扫描\n- 按场景类型查找测试\n- 每个类别共享一套初始化设置\n\
  - 测试报告具有意义\n\n### 策略 2：参数化测试\n\n**将相似的测试合并为数据驱动的变体：**\n\n```java\n@ParameterizedTest\n\
  @ValueSource(strings = {\"bad\", \"no@domain\", \"@user@\", \"CAPS@TEST.COM\"})\n\
  void execute_fails_forInvalidEmail(String invalidEmail) {\n    var request = TestData.request().withEmail(invalidEmail).build();\n\
  \    useCase.execute(request)\n          .onSuccess(Assertions::fail);\n}\n\n@ParameterizedTest\n\
  @CsvSource({\n    \"weak, TooShort\",\n    \"alllowercase, NoUppercase\",\n    \"\
  ALLUPPERCASE, NoLowercase\"\n})\nvoid execute_fails_forWeakPassword(String password,\
  \ String expectedReason) {\n    var request = TestData.request().withPassword(password).build();\n\
  \    useCase.execute(request)\n          .onSuccess(Assertions::fail)\n        \
  \  .onFailure(cause -> assertTrue(cause.message().contains(expectedReason)));\n\
  }\n```\n\n**减少：** 5 个单独的测试 -> 1 个带有 5 个值的参数化测试。\n\n### 策略 3：文件中的测试组织\n\n**大型用例 ->\
  \ 多个测试文件：**\n\n```\nusecase/\n|-- userlogin/\n    |-- UserLogin.java (实现)\n    |--\
  \ UserLoginValidationTest.java (验证场景)\n    |-- UserLoginFlowTest.java (快乐路径 + 步骤失败)\n\
  \    |-- UserLoginEdgeCasesTest.java (边缘情况)\n```\n\n**准则：** 将单个测试文件保持在 500 行以内。\n\
  \n* * *\n\n## 在哪里测试什么\n\n### 按组件类型的覆盖率标准\n\n**1. 值对象：100% 覆盖（单元测试）**\n\n```java\n\
  class EmailTest {\n    @Test void email_accepts_validFormat() { }\n    @Test void\
  \ email_rejects_missingAt() { }\n    @Test void email_rejects_missingDomain() {\
  \ }\n    @Test void email_normalizesToLowercase() { }\n    @Test void email_trimsWhitespace()\
  \ { }\n}\n```\n\n**为什么是 100%？** 值对象是纯的、隔离的、易于测试的。没有理由。\n\n**2. 业务叶节点：复杂的 100%，简单的跳过（单元测试）**\n\
  \n**复杂的叶节点（编写单元测试）：**\n\n```java\nclass PricingEngine {\n    // ...\n        //\
  \ 假设 50 行，8 个分支，复杂的折扣逻辑\n    }\n}\n```\n值得 `PricingEngineTest` 包含 20 个以上的测试\n\n\
  **简单的叶节点（通过集成测试覆盖）：**\n\n```java\nstatic Price applyTax(Price base) {\n    return\
  \ new Price(base.amount().multiply(TAX_RATE));\n}\n```\n不需要专门的测试 - 由用例覆盖\n\n**准则：**\
  \ 如果叶节点有 3 个以上分支或超过 20 行，请编写单元测试。\n\n**3. 用例：90%+ 覆盖（集成测试向量）**\n\n```java\nclass\
  \ RegisterUserTest {\n    // 快乐路径\n    @Test void execute_succeeds_forValidInput()\
  \ { }\n\n    // 验证失败\n    @Test void execute_fails_forInvalidEmail() { }\n    @Test\
  \ void execute_fails_forWeakPassword() { }\n\n    // 步骤失败\n    @Test void execute_fails_whenEmailAlreadyExists()\
  \ { }\n    @Test void execute_fails_whenPasswordHashingFails() { }\n\n    // 分支条件\n\
  \    @Test void execute_sendsWelcomeEmail_forNewUser() { }\n}\n```\n\n**为什么是 90%+？**\
  \ 用例代表行为。覆盖不完全意味着理解不完全。\n\n**4. 适配器：成功 + 错误模式（合约测试）**\n\n```java\nclass JooqUserRepositoryTest\
  \ {\n    @Test void findById_succeeds_whenUserExists() { }\n    @Test void findById_returnsEmpty_whenUserNotFound()\
  \ { }\n    @Test void findById_wrapsException_whenDatabaseFails() { }\n}\n```\n\n\
  **在用例测试中：** 对适配器进行 Stub。不要测试数据库交互 30 次。\n\n* * *\n\n## 测试金字塔\n\n\n\n\n\n```\n /\\\
  \n            /  \\\n           /____\\ E2E Tests (few)\n          /      \\ - Through\
  \ REST layer\n         /        \\ - Real database (Testcontainers)\n        /__________\\\
  \ Integration Tests (many)\n       /            \\ - Use case test vectors\n   \
  \   /              \\ - All business logic assembled\n     /                \\ -\
  \ Only adapters stubbed\n    /__________________\\ Unit Tests (some)\n   /     \
  \               \\ - Value objects (all)\n  /                      \\ - Complex\
  \ business leaves\n /                        \\ - Adapter contracts\n/--------------------------\\\
  \n```\n\n这与传统的金字塔模型相反——我们的集成测试比单元测试更多。\n\n**为什么？** 因为我们的业务逻辑是组合式的。测试碎片会遗漏重点。\n\n\
  ***\n\n## 完整示例：用户注册 RegisterUser\n\n### 阶段 1：填充所有内容（Stub Everything）\n\n```java\n\
  public interface RegisterUser {\n    record Request(String email, String password)\
  \ {}\n    record Response(String userId) {}\n\n    Promise<Response> execute(Request\
  \ request);\n\n    static RegisterUser registerUser() {\n        return request\
  \ -> Promise.success(new Response(\"stub-user-id\"));\n    }\n}\n```\n\n**测试：**\n\
  \n```java\n@Test\nvoid execute_succeeds_forValidInput() {\n    var useCase = RegisterUser.registerUser();\n\
  \    var request = new Request(\"john@example.com\", \"Valid123\");\n\n    useCase.execute(request)\n\
  \           .await()\n           .onFailure(Assertions::fail)\n           .onSuccess(response\
  \ -> assertEquals(\"stub-user-id\", response.userId()));\n}\n```\n\n### 阶段 2：添加验证\n\
  \n```java\nrecord ValidRequest(Email email, Password password) {\n    static Result<ValidRequest>\
  \ validRequest(Request raw) {\n        return Result.all(Email.email(raw.email()),\n\
  \                          Password.password(raw.password()))\n                \
  \     .map(ValidRequest::new);\n    }\n}\n\nstatic RegisterUser registerUser() {\n\
  \    return request -> ValidRequest.validRequest(request)\n                    \
  \              .async()\n                                  .map(_ -> new Response(\"\
  stub-user-id\"));\n}\n```\n\n**添加验证测试：**\n\n```java\n@Test\nvoid execute_fails_forInvalidEmail()\
  \ {\n    var request = new Request(\"bad\", \"Valid123\");\n    useCase.execute(request).await().onSuccess(Assertions::fail);\n\
  }\n```\n\n### 阶段 3-6：增量添加步骤\n\n在完全实现后：\n\n```java\nstatic RegisterUser registerUser(CheckEmailUniqueness\
  \ checkUniqueness,\n                                 HashPassword hashPassword,\n\
  \                                 SaveUser saveUser,\n                         \
  \        SendWelcomeEmail sendEmail) {\n    return request -> ValidRequest.validRequest(request)\n\
  \                                  .async()\n                                  .flatMap(checkUniqueness::apply)\n\
  \                                  .flatMap(hashPassword::apply)\n             \
  \                     .flatMap(saveUser::apply)\n                              \
  \    .flatMap(sendEmail::apply)\n                                  .map(user ->\
  \ new Response(user.id()));\n}\n```\n\n**最终测试套件：**\n\n```java\nclass RegisterUserTest\
  \ {\n    @BeforeEach\n    void setup() {\n        CheckEmailUniqueness stubUniqueness\
  \ = vr -> Promise.success(vr);\n        HashPassword stubHash = vr -> Promise.success(new\
  \ HashedPassword(\"hash\"));\n        SaveUser stubSave = hp -> Promise.success(new\
  \ User(\"user-1\"));\n        SendWelcomeEmail stubEmail = u -> Promise.success(u);\n\
  \        useCase = RegisterUser.registerUser(stubUniqueness, stubHash, stubSave,\
  \ stubEmail);\n    }\n    @Nested\n    class HappyPath {\n        @Test\n      \
  \  void execute_succeeds_for_ValidInput() { ... }\n    }\n    @Nested\n    class\
  \ ValidationFailures {\n        @Test\n        void execute_fails_for_InvalidEmail()\
  \ { ... }\n        @Test\n        void execute_fails_for_Password() { ... }\n  \
  \  }\n    @Nested\n    class StepFailures {\n        @Test\n        void execute_fails_whenEmailExists()\
  \ { ... }\n        @Test\n        void execute_fails_whenHashingFails() { ... }\n\
  \        @Test\n        void execute_fails_whenSaveFails() { ... }\n        @Test\n\
  \        void execute_fails_whenEmailFails() { ... }\n    }\n}\n```\n\n**总计：** 8\
  \ 个集成测试，完整的行为，仅进行了填充（stubbed）。\n\n***\n\n## 迁移指南：从传统到演进\n\n### 步骤 1 ：添加集成测试\n\n\
  从为关键场景添加集成测试开始：\n\n```java\n// 保留单元测试\nclass CheckCredentialsTest {\n    @Test\n\
  \    void validCredentials_succeeds() { ... }\n}\n\n// 添加集成测试\nclass UserLoginTest\
  \ {\n    @Test\n    void execute_succeeds_forValidInput() { ... }\n    @Test\n \
  \   void execute_fails_whenCredentialsInvalid() { ... }\n}\n```\n\n### 步骤 2 ：识别冗余\n\
  \n当你你添加集成测试时，注意哪些单元测试变得了冗余。\n\n**问题：** 单元测试是否提供了集成测试之外的价值？\n- 如果为**否** -> 删除单元测试\n\
  - 如果为**是**（复杂逻辑、多分支） -> 保留单元测试\n\n### 步骤 3 ：删除冗余的单元测试\n\n**保留：**\n- 复杂的业务叶节点测试\n\
  - 值对象测试（始终保留）\n- 集成测试未覆盖的边缘情况测试\n\n**删除：**\n- 简单的步骤测试（已被集成测试覆盖）\n- 重度依赖 Mock 的测试（测试框架多于逻辑本身）\n\
  - 在重构时会崩溃的测试\n\n### 步骤 4 ：最终状态\n\n```\n迁移前：\n|-- 60 个单元测试（关注组件）\n|-- 5 个集成测试\n|--\
  \ 存在大量 Mock，测试脆弱\n\n迁移后：\n|-- 30 个集成测试（关注行为）\n|-- 10 个值对象单元测试\n|-- 5 个复杂的叶节点单元测试\n\
  |-- 业务逻辑无 Mock\n```\n\n**结果：** 测试更少，覆盖率更高，更有信心，脆弱性更低。\n\n\n\n\n\n```java\n@Test\n\
  void async_completesWithinTimeout() {\n    useCase.execute(request)\n          \
  \ .await(TimeSpan.seconds(5))  // 如果超过 5 秒 则失败\n           .onFailure(cause -> {\n\
  \               if (cause instanceof CoreError.Timeout) {\n                   fail(\"\
  Operation timed out\");\n               }\n               fail(\"Unexpected error:\
  \ \" + cause.message());\n           })\n           .onSuccess(response -> assertNotNull(response));\n\
  }\n```\n\n**测试超时行为：**\n\n```java\n@Test\nvoid timeout_failsSlowOperation() {\n \
  \   // 模拟缓慢操作\n    var slowStep = input -> Promise.<Output>promise(promise -> {\n\
  \        // 永远不解析\n    });\n\n    var useCase = UseCase.create(slowStep);\n\n  \
  \  useCase.execute(request)\n           .timeout(TimeSpan.millis(100))\n       \
  \    .await()\n           .onSuccess(Assertions::fail)  // 不应该成功\n           .onFailure(cause\
  \ -> assertInstanceOf(CoreError.Timeout.class, cause));\n}\n```\n\n**测试并行操作 (Fork-Join)：**\n\
  \n```java\n@Test\nvoid forkJoin_completesAllBranches() {\n    var results = Promise.all(\n\
  \        Promise.success(\"a\"),\n        Promise.success(\"b\"),\n        Promise.success(\"\
  c\")\n    ).await();\n\n    results.onFailure(Assertions::fail)\n           .onSuccess((a,\
  \ b, c) -> {\n               assertEquals(\"a\", a);\n               assertEquals(\"\
  b\", b);\n               assertEquals(\"c\", c);\n           });\n}\n```\n\n***\n\
  \n## 核心收获\n\n1. **按场景组织** - 嵌套类、参数化测试\n2. **值对象：100%** - 始终进行单元测试\n3. **复杂叶子节点：100%**\
  \ - 如果有 3 个以上分支则进行单元测试\n4. **用例：90%+** - 使用存桩适配器（stubbed adapters）进行集成测试\n5. **适配器：合约测试**\
  \ - 仅成功和错误模式\n6. **增量迁移** - 先添加集成测试，然后移除冗余的单元测试\n\n***\n\n## 练习题\n\n参见 Appendix\
  \ B 获取以下内容的练习：\n- 练习 4.3：测试套的组织\n- 练习 4.4：从传统测试的迁移\n\n***\n\n## 接下来\n\n第 12 章 展示了完整的\
  \ RegisterUser 用例——从需求到生产代码，演示了所有模式如何协同工作。\n\n# 第 12 章：完整示例 - RegisterUser\n\n##\
  \ 你将学习\n\n* 从需求到实现的完整用例\n* 所有模式在实践中是如何协同运作的\n* 逐步演进的开发方法\n\n**前提条件：** 第 11 章：实践中的测试\n\
  \n***\n\n## 需求\n\n**用例：** 注册新用户账户。\n\n**输入（原始）：**\n- 邮箱（字符串）\n- 密码（字符串）\n- 推荐码（可选字符串）\n\
  \n**输出：**\n- 用户 ID\n- 确认令牌 (token)\n\n**验证规则：**\n- 邮箱：非空、格式有效、转换为小写归一化\n- 密码：非空、至少\
  \ 8 个字符、至少一个大写字母和一个数字\n- 推荐码：可选；如果存在，必须恰好为 6 个大写字母数字\n\n**跨字段规则：**\n- 邮箱尚未注册\n\n\
  **步骤：**\n1. 验证输入\n2. 检查邮箱唯一性（异步，数据库）\n3. 密码哈希（同步，计算密集型计算）\n4. 将用户保存到数据库（异步）\n5.\
  \ 生成确认令牌（异步，调用外部服务）\n\n***\n\n##  1：用例接口\n\n```java\npackage com.example.app.usecase.registeruser;\n\
  \nimport org.pragmatica.lang.*;\n\npublic interface RegisterUser {\n    record Request(String\
  \ email, String password, String referralCode) {}\n    record Response(UserId userId,\
  \ ConfirmationToken token) {}\n\n    Promise<Response> execute(Request request);\n\
  \n    interface CheckEmailUniqueness {\n        Promise<ValidRequest> apply(ValidRequest\
  \ valid);\n    }\n\n    interface CreateValidUser {\n        Promise<ValidUser>\
  \ apply(ValidRequest valid);\n    }\n\n    interface SaveUser {\n        Promise<User>\
  \ apply(ValidUser validUser);\n    }\n\n    interface GenerateToken {\n        Promise<Response>\
  \ apply(User user);\n    }\n\n    static RegisterUser registerUser(CheckEmailUniqueness\
  \ checkEmail,\n                                     CreateValidUser createValidUser,\n\
  \                                     SaveUser saveUser,\n                     \
  \                GenerateToken generateToken) {\n        return request -> ValidRequest.validRequest(request)\n\
  \                               .async()\n                               .flatMap(checkEmail::apply)\n\
  \                               .flatMap(createValidUser::apply)\n             \
  \                  .flatMap(saveUser::apply)\n                               .flatMap(generateToken::apply);\n\
  \    }\n}\n```\n\n这是一个 **Sequencer (排序器)** 模式：验证 -> 检查唯一性 -> 创建用户 -> 保存 -> 生成令牌。\n\
  \n***\n\n##  2：已验证的请求\n\n```java\nrecord ValidRequest(Email email, Password password,\
  \ Option<ReferralCode> referralCode) {\n    static Result<ValidRequest> validRequest(Request\
  \ raw) {\n        return Result.all(Email.email(raw.email()),\n                \
  \          Password.password(raw.password()),\n                          ReferralCode.referralCode(raw.referralCode()))\n\
  \                     .flatMap(ValidRequest::new);\n    }\n}\n```\n\n这是一个 **Fork-Join\
  \ (分治)** 模式：独立验证三个项，并收集结果。\n\n***\n\n##  3：值对象\n\n**Email：**\n\n```java\npackage\
  \ com.example.app.domain.shared;\n\npublic record Email(String value) {\n    private\
  \ static final Pattern EMAIL_PATTERN =\n        Pattern.compile(\"^[a-z0-9+_.-]+@[a-z0-9.-]+$\"\
  );\n    private static final Fn1<Cause, String> INVALID_EMAIL =\n        Causes.forOneValue(\"\
  无效邮箱格式: %s\");\n\n    public static Result<Email> email(String raw) {\n        return\
  \ Verify.ensure(raw, Verify.Is::notNull)\n                     .map(String::trim)\n\
  \                     .map(String::toLowerCase)\n                     .filter(INVALID_EMAIL,\
  \ EMAIL_PATTERN.asMatchPredicate())\n                     .map(Email::new);\n  \
  \  }\n}\n```\n\n**Password：**\n\n\n\n\n\n```java\npublic record Password(String\
  \ value) {\n    private static final Cause TOO_SHORT =\n        Causes.cause(\"\
  Password must be at least 8 characters\");\n    private static final Cause MISSING_UPPERCASE\
  \ =\n        Causes.cause(\"Password must contain uppercase letter\");\n    private\
  \ static final Cause MISSING_DIGIT =\n        Causes.cause(\"Password must contain\
  \ digit\");\n\n    public static Result<Password> password(String raw) {\n     \
  \   return Verify.ensure(raw, Verify.Is::notNull)\n                     .filter(TOO_SHORT,\
  \ s -> Verify.Is.lenBetween(s, 8, 128))\n                     .flatMap(Password::ensureUppercase)\n\
  \                     .flatMap(Password::ensureDigit)\n                     .map(Password::new);\n\
  \    }\n\n    private static Result<String> ensureUppercase(String raw) {\n    \
  \    return contains(raw, Character::isUpperCase)\n                ? Result.success(raw)\n\
  \                : MISSING_UPPERCASE.result();\n    }\n\n    private static Result<String>\
  \ ensureDigit(String raw) {\n        return contains(raw, Character::isDigit)\n\
  \                ? Result.success(raw)\n                : MISSING_DIGIT.result();\n\
  \    }\n\n    private static boolean contains(CharSequence sequence, IntPredicate\
  \ predicate) {\n        return sequence.chars().anyMatch(predicate);\n    }\n}\n\
  ```\n\n`ReferralCode`（可选，带验证）：\n\n```java\npublic record ReferralCode(String value)\
  \ {\n    private static final Pattern PATTERN = Pattern.compile(\"^[A-Z0-9]{6}$\"\
  );\n    private static final Cause INVALID_FORMAT = Causes.cause(\"Invalid referral\
  \ code format\");\n\n    public static Result<Option<ReferralCode>> referralCode(String\
  \ raw) {\n        return Verify.ensureOption(\n            Option.option(raw).map(String::trim).filter(s\
  \ -> !s.isEmpty()),\n            PATTERN.asMatchPredicate(),\n            INVALID_FORMAT\n\
  \        ).map(opt -> opt.map(ReferralCode::new));\n    }\n\n    public boolean\
  \ isPremium() {\n        return value.startsWith(\"VIP\");\n    }\n}\n```\n\n`Verify.ensureOption()`\
  \ 方法（Pragmatica Lite 0.9.0+）优雅地处理 `Result<Option<ReferralCode>>`：如果 `Option` 为空，则带有\
  \ `Option.none()` 成功；如果存在且有效，则带有 `Option.some(value)` 成功；如果存在但无效，则失败。\n\n* *\n\n\
  ## 第 4 ：步骤实现\n\n`CheckEmailUniqueness`（适配器叶子）：\n\n```java\ninterface CheckEmailUniqueness\
  \ {\n    Promise<ValidRequest> apply(ValidRequest request);\n\n    static CheckEmailUniqueness\
  \ checkEmailUniqueness(UserRepository repository) {\n        return request -> repository.findByEmail(request.email())\n\
  \                                    .flatMap(user -> checkPresence(user, request));\n\
  \    }\n\n    static Promise<ValidRequest> checkPresence(Option<User> user, ValidRequest\
  \ request) {\n        return user.isPresent()\n                ? RegistrationError.General.EMAIL_ALREADY_REGISTERED.promise()\n\
  \                : Promise.success(request);\n    }\n}\n```\n\n`HashPassword`（业务叶子）：\n\
  \n```java\ninterface HashPassword {\n    Result<HashedPassword> apply(Password password);\n\
  \n    static HashPassword hashPassword(BCryptPasswordEncoder encoder) {\n      \
  \  return password -> Result.lift1(RegistrationError.PasswordHashingFailed::new,\n\
  \                                        encoder::encode,\n                    \
  \                    password.value())\n                                 .map(HashedPassword::new);\n\
  \    }\n}\n```\n\n`SaveUser`（适配器叶子）：\n\n```java\nclass Jooq implements SaveUser\
  \ {\n    private final DSLContext dsl;\n\n    public Promise<User> apply(ValidRequest\
  \ user) {\n        return Promise.lift(RepositoryError::cause,\n               \
  \             () -> saveUser(user));\n    }\n\n    private User saveUser(ValidRequest\
  \ user) {\n        String id = dsl.insertInto(USERS)\n                       .set(USERS.EMAIL,\
  \ user.email().value())\n                       .set(USERS.PASSWORD_HASH, user.hashed().value())\n\
  \                       .set(USERS.REFERRAL_CODE, user.referralCode().value().orElse(null))\n\
  \                       .returning(USERS.ID)\n                       .fetchSingle()\n\
  \                       .value();\n        return new User(new UserId(id), user.email());\n\
  \    }\n}\n```\n\n`GenerateToken`（适配器叶子）：\n\n```java\nclass TokenServiceClient implements\
  \ GenerateToken {\n    private final HttpClient httpClient;\n\n    public Promise<Response>\
  \ apply(User user) {\n        return httpClient.post(\"/tokens/confirm\",\nMap.of(\"\
  userId\", user.id().value()))\n                         .map(resp -> buildResponse(user.id(),\
  \ resp))\n                         .recover(this::mapTokenError);\n    }\n\n   \
  \ private Response buildResponse(UserId userId, Map<String, String> resp) {\n  \
  \      return new Response(userId, new ConfirmationToken(resp.get(\"token\")));\n\
  \    }\n\n    private Promise<Response> mapTokenError(Cause) {\n        return RegistrationError.General.TOKEN_GENERATION_FAILED.promise();\n\
  \    }\n}\n```\n\n* *\n\n## 第 5：错误类型\n\n```java\npublic sealed interface RegistrationError\
  \ extends Cause {\n    enum General implements RegistrationError {\n        EMAIL_ALREADY_REGISTERED(\"\
  邮箱已注册\"),\n        WEAK_PASSWORD_FOR_PREMIUM(\"高级版代码需要 10 位以上的密码\"),\n        TOKEN_GENERATION_FAILED(\"\
  令牌生成失败\");\n\n        private final String message;\n\n        General(String message)\
  \ {\n            this.message = message;\n        }\n\n        @Override\n     \
  \   public String message() {\n            return message;\n        }\n    }\n\n\
  \    record PasswordHashingFailed(Throwable cause) implements RegistrationError\
  \ {\n        @Override\n        public String message() {\n            return \"\
  密码哈希失败: \" + Causes.fromThrowable(cause);\n        }\n    }\n}\n```\n\n\n\n\n\n\
  ```java\n@Test\nvoid validRequest_fails_forInvalidEmail() {\n    var request = new\
  \ Request(\"not-an-email\", \"Valid1234\", null);\n\n    ValidRequest.validRequest(request)\n\
  \                .onSuccess(Assertions::fail);\n}\n\n@Test\nvoid validRequest_succeeds_forValidInput()\
  \ {\n    var request = new Request(\"user@example.com\", \"Valid1234\", \"ABC123\"\
  );\n\n    ValidRequest.validRequest(request)\n                .onFailure(Assertions::fail)\n\
  \                .onSuccess(valid -> {\n                    assertEquals(\"user@example.com\"\
  , valid.email().value());\n                    assertTrue(valid.referralCode().isPresent());\n\
  \                });\n}\n```\n\n### Happy 用路径测试\n\n```java\n@Test\nvoid execute_succeeds_forValidInput()\
  \ {\n    CheckEmailUniqueness checkEmail = req -> Promise.success(req);\n    CreateValidUser\
  \ createUser = req -> Promise.success(\n        new ValidUser(req.email(), new HashedPassword(\"\
  hashed\"), req.referralCode()));\n    SaveUser saveUser = user -> Promise.success(new\
  \ User(new UserId(\"user-123\"), user.email()));\n    GenerateToken generateToken\
  \ = user -> Promise.success(\n        new Response(user.id(), new ConfirmationToken(\"\
  token-456\")));\n\n    var useCase = RegisterUser.registerUser(checkEmail, createUser,\
  \ saveUser, generateToken);\n    var request = new Request(\"user@example.com\"\
  , \"Valid1234\", null);\n\n    useCase.execute(request)\n          .await()\n  \
  \        .onFailure(Assertions::fail)\n          .onSuccess(response -> {\n    \
  \          assertEquals(\"user-123\", response.userId().value());\n            \
  \  assertEquals(\"token-456\", response.token().value());\n          });\n}\n```\n\
  \n### 失败场景\n\n```java\n@Test\nvoid execute_fails_whenEmailAlreadyExists() {\n  \
  \  CheckEmailUniqueness checkEmail = req ->\n        RegistrationError.General.EMAIL_ALREADY_REGISTERED.promise();\n\
  \    // ... other stubs\n\n    useCase.execute(request)\n          .await()\n  \
  \        .onSuccess(Assertions::fail);\n}\n```\n\n***\n\n## 模式总结\n\n| 组件 | 模式 |\
  \ 目的 |\n| --- | --- | --- |\n| `RegisterUser.execute` | 顺序执行器 (Sequencer) | 链式依赖步骤\
  \ |\n| `ValidRequest.validRequest` | 分叉-合并 (Fork-Join) | 验证独立字段 |\n| `Email.email`\
  \ | 叶子 (Leaf) | 原子化验证 |\n| `Password.password` | 叶子 (Leaf) | 内部包含顺序执行器的原子验证 |\n\
  | `CheckEmailUniqueness` | 叶子 + 条件 | 带有分支的数据库检查 |\n| `SaveUser` | 适配器叶子 (Adapter\
  \ Leaf) | 数据库写入 |\n| `RegistrationError` | 密封接口 (Sealed Interface) | 类型化错误层级 |\n\
  \n***\n\n## 核心要点\n\n1. **用例接口** - 包含工厂、步骤接口和类型\n2. **用于主流程的顺序执行器** - 使用 `flatMap`\
  \ 链链步骤\n3. **用于验证的分叉-合并** - 使用 `Result.all()` 累积错误\n4. **值对象作为叶子** - 解析而非验证（Parse-don’t-validate）\n\
  5. **适配器实现步骤接口** - JOOQ、HTTP 客户端\n6. **测试使用存根** - 仅对适配器进行存根\n\n***\n\n## 练习题\n\n\
  参阅 附录 B 获取以下练习：\n- 练习 5.1：扩展带有邮箱验证的 `RegisterUser`\n- 练习 5.3：添加高级推荐\n\n***\n\n##\
  \ 下一步\n\n第 13 章 介绍了另一个完整示例——`PlaceOrder`，展示了更复杂的模式，包括用于并行数据获取的分叉-合并模式。\n\n# 第 13\
  \ 章：完整示例 - PlaceOrder\n\n本章将详细介绍从需求到生产级代码构建一个完整的电子商务订单用例的过程。\n\n***\n\n## 需求\n\n\
  **业务目标：** 允许客户对其购物车进行下单。\n\n**流程：** 1. 验证订单请求\n2. 检查所有物品的库存（并行）\n3. 预留库存\n4. 处理支付\n\
  5. 创建订单记录\n6. 发送通知\n\n**业务规则：**\n- 所有物品必须有货\n- 支付必须在提交库存前成功\n- 如果支付失败，释放预留的库存\n\
  - 订单确认是尽力而为（如果通知失败，不要让订单失败）\n\n**错误场景：**\n- 无效请求（缺少字段、数量无效）\n- 一个或多个物品库存不足\n- 支付被拒绝\n\
  - 支付超时\n- 数据库失败\n\n***\n\n## 领域分析\n\n### 值对象\n\n| 类型 | 验证 | 注意 |\n| --- | --- |\
  \ --- |\n| `OrderId` | UUID 格式 | 生成的，而非输入 |\n| `CustomerId` | 非空，UUID 格式 | 来自会话/认证\
  \ |\n| `ProductId` | 非空，UUID 格式 | |\n| `Quantity` | 正整数，最大 100 | 每个物品限制 |\n| `Money`\
  \ | 非负，最多两位小数 | |\n| `Address` | 街道、邮政编码、国家 | 复合类型 |\n\n### 识别出的模式\n\n| 步骤 | 模式\
  \ | 理由 |\n| --- | --- | --- |\n| 验证请求 | 分叉-合并 | 多个独立验证 |\n| 检查库存 | 分叉-合并 | 并行检查所有物品\
  \ |\n| 预留 + 创建 | 顺序执行器 | 严格排序 |\n| 发送通知 | 带有切面的叶子 | 尽力而为，不导致订单失败 |\n\n***\n\n##\
  \ 包结构\n\n```\ncom.example.shop.usecase.placeorder/\n  PlaceOrder.java          \
  \ # 用例接口 + 工厂\n  OrderError.java           # 密封接口\n  ValidOrderRequest.java    #\
  \ 验证记录\n  OrderLine.java            # 验证过的物品\n  ReservedInventory.java    # 中间状态\n\
  com.example.shop.domain.shared/\n  CustomerId.java\n  ProductId.java\n  Quantity.java\n\
  \  Money.java\n  OrderId.java\n```\n\n***\n\n### 步骤 1：值对象\n\n### ProductId\n\n```java\n\
  package com.example.shop.domain.shared;\n\nimport org.pragmatica.lang.Result;\n\
  import org.pragmatica.lang.Cause;\nimport org.pragmatica.utils.Causes;\nimport org.pragmatica.lang.parse.Network;\n\
  \npublic record ProductId(String value) {\n    private static final Cause INVALID_PRODUCT_ID\
  \ = Causes.cause(\"无效的产品格式\");\n\n    public static Result<ProductId> productId(String\
  \ raw) {\n        return Network.parseUUID(raw)\n            .mapError(_ -> INVALID_PRODUCT_ID)\n\
