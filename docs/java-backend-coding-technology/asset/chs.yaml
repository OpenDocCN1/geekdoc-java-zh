  \nimport org.pragmatica.lang.Result;\nimport org.pragmatica.lang.Cause;\nimport\
  \ org.pragmatica.lang.utils.Causes;\nimport com.example.shop.domain.shared.CustomerId;\n\
  import com.example.shop.domain.shared.Address;\n\nimport java.util.List;\n\npublic\
  \ record ValidOrderRequest(\n    CustomerId customerId,\n    List<OrderLine> items,\n\
  \    Address shippingAddress\n) {\n    private static final Cause EMPTY_ORDER =\
  \ OrderError.General.EMPTY_ORDER;\n\n    public static Result<ValidOrderRequest>\
  \ validOrderRequest(OrderRequest raw) {\n        return Result.all(\n          \
  \  CustomerId.customerId(raw.customerId()),\n            validateItems(raw.items()),\n\
  \            Address.address(\n                raw.shippingAddress().street(),\n\
  \                raw.shippingAddress().city(),\n                raw.shippingAddress().postalCode(),\n\
  \                raw.shippingAddress().country()\n            )\n        ).map(ValidOrderRequest::new);\n\
  \    }\n\n    private static Result<List<OrderLine>> validateItems(List<OrderRequest.LineItemRequest>\
  \ items) {\n        if (items == null || items.isEmpty()) {\n            return\
  \ EMPTY_ORDER.result();\n        }\n\n        return Result.allOf(\n           \
  \ items.stream()\n                .map(OrderLine::orderLine)\n                .toList()\n\
  \        );\n    }\n}\n```\n\n***\n\n## 第 4 ：步骤接口\n\n```java\npackage com.example.shop.usecase.placeorder;\n\
  \nimport org.pragmatica.lang.Promise;\nimport org.pragmatica.lang.Result;\nimport\
  \ com.example.shop.domain.shared.OrderId;\nimport com.example.shop.domain.shared.Money;\n\
  \npublic interface PlaceOrder {\n\n    record Response(OrderId orderId, Money total)\
  \ {}\n\n    Promise<Response> execute(OrderRequest request);\n\n    // 步骤 1:检查所有商品的库存\
  \ (Fork-Join)\n    interface CheckInventory {\n        Promise<ValidOrderRequest>\
  \ apply(ValidOrderRequest request);\n    }\n\n    // 步骤 2: 预留库存\n    interface ReserveInventory\
  \ {\n        Promise<ReservedInventory> apply(ValidOrderRequest request);\n    }\n\
  \n    // 步骤 3: 处理支付\n    interface ProcessPayment {\n        Promise<PaymentConfirmation>\
  \ apply(ReservedInventory reservation, Money total);\n    }\n\n    // 步骤 4: 创建订单记录\n\
  \    interface CreateOrder {\n        Promise<OrderId> apply(ReservedInventory reservation,\
  \ PaymentConfirmation payment);\n    }\n\n    // 步骤 5: 发送确认 (尽力而为)\n    interface\
  \ SendConfirmation {\n        Promise<Void> apply(OrderId orderId, ValidOrderRequest\
  \ request);\n    }\n\n    // 步骤 6: 释放库存 (补偿机制)\n    interface ReleaseInventory {\n\
  \        Promise<Void> apply(ReservedInventory reservation);\n    }\n\n    // 工厂\n\
  \    static PlaceOrder placeOrder(\n        CheckInventory checkInventory,\n   \
  \     ReserveInventory reserveInventory,\n        ProcessPayment processPayment,\n\
  \        CreateOrder createOrder,\n        SendConfirmation sendConfirmation,\n\
  \        ReleaseInventory releaseInventory,\n        PriceCalculator priceCalculator\n\
  \    ) {\n        return request -> ValidOrderRequest.validOrderRequest(request)\n\
  \            .async()\n            .flatMap(checkInventory::apply)\n           \
  \ .flatMap(valid -> executeWithCompensation(\n                valid,\n         \
  \       reserveInventory,\n                processPayment,\n                createOrder,\n\
  \                releaseInventory,\n                priceCalculator\n          \
  \  ))\n            .onSuccess(response -> sendConfirmation.apply(response.orderId(),\
  \ null)\n                .onFailure(e -> { /* 记录但不处理 */ }));\n    }\n\n    private\
  \ static Promise<Response> executeWithCompensation(\n        ValidOrderRequest request,\n\
  \        ReserveInventory reserveInventory,\n        ProcessPayment processPayment,\n\
  \        CreateOrder createOrder,\n        ReleaseInventory releaseInventory,\n\
  \        PriceCalculator priceCalculator\n    ) {\n        var total = priceCalculator.calculate(request);\n\
  \n        return reserveInventory.apply(request)\n            .flatMap(reservation\
  \ -> processPayment.apply(reservation, total)\n                .flatMap(payment\
  \ -> createOrder.apply(reservation, payment))\n                .map(orderId -> new\
  \ Response(orderId, total))\n                .recover(cause -> compensateAndFail(reservation,\
  \ releaseInventory, cause));\n    }\n\n    private static Promise<Response> compensateAndFail(\n\
  \        ReservedInventory reservation,\n        ReleaseInventory releaseInventory,\n\
  \        Cause cause\n    ) {\n        return releaseInventory.apply(reservation)\n\
  \            .flatMap(_ -> cause.promise());\n    }\n}\n```\n\n***\n\n## 第 5：支持类型\n\
