  \n每个表达式的求值结果是什么？\n\n```java\n#### 已知：\nResult<Integer> success = Result.success(10);\n\
  Result<Integer> failure = Causes.cause(\"error\").result();\n\n// 1.\nsuccess.map(x\
  \ -> x * 2).or(0)\n\n// 2.\nfailure.map(x -> x * 2).or(0)\n\n// 3.\nsuccess.filter(Causes.cause(\"\
  not positive\"), x -> x > 0)\n\n// 4.\nsuccess.filter(Causes.cause(\"not negative\"\
  ), x -> x < 0)\n\n// 5.\nResult.all(success, failure).map((a, b) -> a + b)\n```\n\
  \n<details><summary>解答</summary>\n\n1. `20` - 将 10 映射为 20，`or()` 返回值\n2. `0` - failure\
  \ 跳过 map，`or()` 返回回备值\n3. `Result.success(10)` - 谓词判断通过\n4. `Result.failure(Cause(\"\
  not negative\"))` - 谓词失败\n5. `Result.failure(Cause(\"error\"))` - all() 累积了第二个的失败\n\
  </details>\n\n***\n\n## 第二部分：核心原则（第 4-6 章）\n\n### 练习 2.1 [初级] - 值对象创建\n\n创建一个 `PhoneNumber`\
  \ 值对象，其要求：\n- 接受格式为“+1-555-123-4567”或“5551234567”的字符串\n- 规范化为仅数字\n- 必须是 10-15 位数字\n\
  \n<details><summary>解答</summary>\n\n```java\nrecord PhoneNumber(String value) {\n\
  \    private static final Pattern DIGITS_ONLY = Pattern.compile(\"\\\\d+\");\n \
  \   private static final Cause FORMAT = Causes.cause(\"number must contain only\
  \ digits, optional +\");\n    private static final Cause LENGTH = Causes.cause(\"\
  number must be 10-15 digits\");\n\n    public static Result<PhoneNumber> phoneNumber(String\
  \ raw) {\n        return Verify.ensure(raw, Is::notBlank)\n            .map(PhoneNumber::normalize)\n\
  \            .filter(FORMAT, PhoneNumber::isValidFormat)\n            .filter(LENGTH,\
  \ s -> Is.lenBetween(s, 10, 15))\n            .map(PhoneNumber::new);\n    }\n\n\
  \    private static String normalize(String input) {\n        return input.replaceAll(\"\
  [⁰-9]\", \"\");\n    }\n\n    private static boolean isValidFormat(String normalized)\
  \ {\n        return DIGITS_ONLY.matcher(normalized).matches();\n    }\n}\n```\n\
  </details>\n\n***\n\n### 练习 2.2 [中级] - 聚合校验\n\n创建一个包含 `from` 和 `to` 字段的 `DateRange`\
  \ 值对象，其中：\n- 两个日期都是必须的\n- `from` 必须在 `to` 之前或等于它\n- 者都不能在过去\n\n<details><summary>解答</summary>\n\
  \n```java\nrecord DateRange(LocalDate from, LocalDate to) {\n    private static\
  \ final Cause FROM_AFTER_TO = Causes.cause(\"Start date must be before or equal\
  \ end date\");\n    private static final Cause FROM_IN_PAST = Causes.cause(\"Start\
  \ date cannot be in the past\");\n    private static final Cause TO_IN_PAST = Causes.cause(\"\
  End date cannot be in the past\");\n\n    public static Result<DateRange> dateRange(String\
  \ fromRaw, String toRaw) {\n        var today = LocalDate.now();\n        return\
  \ Result.all(parseAndValidate(fromRaw, today, FROM_IN_PAST),\n                 \
  \        parseAndValidate(toRaw, today, TO_IN_PAST))\n                     .flatMap(DateRange::validateOrder);\n\
  \    }\n\n    private static Result<LocalDate> parseAndValidate(String raw, LocalDate\
  \ today, Cause pastError) {\n        return DateTime.parseLocalDate(raw)\n     \
  \       .filter(pastError, date -> !date.isBefore(today));\n    }\n\n    private\
  \ static Result<DateRange> validateOrder(LocalDate from, LocalDate to) {\n     \
  \   if (from.isAfter(to)) {\n            return FROM_AFTER_TO.result();\n      \
  \  }\n        return Result.success(new DateRange(from, to));\n    }\n}\n```\n</details>\n\
  \n***\n\n### 练习 2.3 [中级] - 错误累积与 短路\n\n解释行为和输出的差异：\n\n\n\n\n\n```java\n// Version\
  \ A\nResult<ValidForm> validateA(Form form) {\n    return Email.email(form.email())\n\
  \        .flatMap(email -> Password.password(form.password())\n            .map(password\
  \ -> new ValidForm(email, password)));\n}\n\n// Version B\nResult<ValidForm> validateB(Form\
  \ form) {\n    return Result.all(Email.email(form.email()),\n                  \
  \   Password.password(form.password()))\n                 .map(ValidForm::new);\n\
  }\n```\n\n如果输入同时包含无效的邮箱和无效的密码，每个版本会返回什么？\n\n<details>\n<summary>解决方案</summary>\n\
  \n**版本 A (短路)：** 返回一个仅包含邮箱错误的失败。`flatMap` 会在第一个失败处停止。\n\n**版本 B (累积)：** 返回一个包含两个错误的\
  \ `CompositeCause` 失败。`Result.all()` 会收集所有失败项。\n\n**何时使用每个版本：**\n- 当错误之间存在依赖关系时（后续验证需要之前步骤的值），使用\
  \ `flatMap` 链。\n- 当验证是相互独立的，且你想向用户显示所有错误时，使用 `Result.all()`。\n</details>\n\n***\n\
