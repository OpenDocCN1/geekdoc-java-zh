  \n这些练习涵盖了完整的 JBCT 学习路径：\n\n| 部分 | 重点 | 关键技能 |\n| --- | --- | --- |\n| I | 基础 | 类型选择、原因创建、基本操作\
  \ |\n| II | 原则 | 值对象、错误累积、空处理 |\n| III | 模式 | 模式识别、实现、线程安全 |\n| IV | 测试 | 测试结构 |\n\
  | V | 生产 | 用例设计 |\n| VI | 采用 | 代码审查、调试 |\n\n## 附录：术语表\n\n### A\n**适配器 (Adapter)**：一种桥接外部系统的组件。实现步骤接口。\n\
  \n**聚合 (Aggregation)**：将多个 `Result` 或 `Promise` 值合并为一个。`Result.all()` 会累积失败信息。\n\
  \n**切面模式 (Aspects Pattern)**：一种用于跨交叉关注点（如重试、超时、审计）的结构化模式。封装在函数周围。\n\n### B\n**分叉\
  \ (Bifurcation)**：同时处理成功和失败情况。`fold()` 和 `apply()` 方法接受两个处理器 - 分别对应每种结果。\n\n###\
  \ C\n**原因 (Cause)**：Pragmatica Lite 中的类型化错误值。代表操作失败的原因。定义为密封接口。\n\n**链 (Chain)**：通过\
  \ `flatMap()` 连接的单子操作序列。每一步都接收上一步的成功值。\n\n**清洁架构 (Clean Architecture)**：Uncle Bob\
  \ 提出的具有同心层和依赖关系的架构风格。\n\n**复合原因 (CompositeCause)**：包含多个子原因的原因。当多个验证失败时，由 `Result.all()`\
  \ 创建。\n\n**条件模式 (Condition Pattern)**：一种根据区分符值进行路由的结构化模式。使用 switch 表达式实现。\n\n###\
  \ D\n**依赖倒置 (Dependency Inversion)**：依赖关系指向抽象而非实现。在 JBCT 中，用例依赖于步骤接口，适配器实现接口。\n\n\
  **领域区域 (Domain Zone)**：包含纯业务逻辑的架构层。包含用例、值对象和步骤接口。不包含框架依赖。\n\n### E\n**错误累积 (Error\
  \ Accumulation)**：收集所有错误而不是在第一个错误处停止。`Result.all()` 会累积失败。\n\n**异常包装 (Exception\
  \ Wrapping)**：在适配器边界将异常转换为 Cause 值。通过 `Promise.lift()` 或 `Result.lift()` 完成。\n\n\
  **外部区域 (External Zone)**：应用程序之外的一切：数据库、外部 API、消息队列、文件系统。\n\n### F\n**工厂方法 (Factory\
  \ Method)**：创建值对象或用例实例的静态方法。值对象工厂返回 `Result<T>` 以强制执行校验。\n\n**快速失败 (Fail-Fast)**：在第一个失败处停止。`flatMap()`\
  \ 链和 `Promise.all()` 都是快速失败。\n\n**flatMap**：单子绑定操作。连接依赖操作。如果输入是失败，则跳过该操作。防止嵌套单子（`Result<Result<T>>`）。\n\
  \n**Fn1, Fn2, Fn3**：Pragmatica Lite 中用于 1、2 或 3 个参数的函数式接口。类似于 Java 的 `Function`\
  \ 但具有更好的组合性。\n\n**分叉-合并模式 (Fork-Join Pattern)**：用于并行独立操作的结构化模式。使用 `Promise.all()`\
  \ 并行运行操作并合并结果。\n\n***\n\n\n\n\n\n# 六边形架构\n端口与适配器（Ports and Adapters）架构。领域位于中心，适配器位于边缘。JBCT\
  \ 的步骤接口（step interfaces）类似于端口。\n\n## I\n**不变性（Immutability）** 创建后无法修改的对象。Java `records`\
  \ 默认是不可变的。对于 JBCT 的线程安全至关重要。\n\n**迭代模式（Iteration Pattern）** 一种处理集合的结构模式。使用 `Promise.allOf()`\
  \ 进行并行处理或使用流操作进行顺序处理。\n\n## J\n**JBCT** Java 后端编码技术。一种使用函数式组合和显式错误处理编写可维护的后端 Java\
  \ 代码的方法。\n\n## L\n**叶子模式（Leaf Pattern）** 一种用于无依赖原子操作的结构模式。通常由适配器通过 `Promise.lift()`\
  \ 封装外部 I/O。\n\n**提升（Lift）** 将值或操作转换为单态上下文。`Result.lift()` 将抛出异常的代码封装在 `Result` 中。`result.async()`\
  \ 将 `Result` 提升为 `Promise`。\n\n## M\n**map** 在保留容器的同时转换成功值。它不会展平嵌套容器——当映射器返回单态类型时，使用\
  \ `flatMap()`。\n\n**单态（Monad）** 一种用于链接可能有副作用的操作的设计模式。`Option`、`Result` 和 `Promise`\
  \ 都是单态。关键操作是 `flatMap()`。\n\n## O\n**Option** 一种表示可能缺失值的类型。当缺失是正常现象而非错误时使用它。当缺失应视为错误时将其转换为\
  \ `Result`。\n\n## P\n**解析而非验证（Parse, Don’t Validate）** 一种原则：与其验证数据并继续使用原始类型，不如将数据解析为经过验证的类型，使无效状态变得不可表示。\n\
  \n**端口（Port）** 在六边形架构中，定义领域如何与外部世界交互的接口。类似于 JBCT 的步骤接口。\n\n**Pragmatica Lite** 一个轻量级\
  \ Java 库，提供了 `Option`、`Result`、`Promise` 和 `Cause` 类型。JBCT 模式的字体。\n\n**Promise**\
  \ 用于表示可能失败的异步操作的类型。将异步执行与显式错误处理相结合。\n\n**纯函数（Pure Function）** 一种没有副作用且对相同输入始终返回相同输出的函数。值对象工厂应该是纯的。\n\
  \n## R\n**面向铁路的编程（ROP）** 一种使用“双轨道”类型的错误处理方法。分为成功轨道和失败轨道。JBCT 通过 `Result` 和 `Promise`\
  \ 使用此模型。\n\n**Record** Java 的不可变数据类（自 Java 14 起）。在 JBCT 中用于值对象、请求、响应和错误类型。\n\n**recover（恢复）**\
  \ 处理失败并可能将其转换为成功。接受一个函数 `Cause -> M<T>`，该函数可以提供回退值或重新抛出异常。\n\n**Result** 用于表示可能失败的同步操作的类型。包含一个成功值或一个\
  \ `Cause`。\n\n**Result.all** 组合多个 `Results`，将所有失败累积到 `CompositeCause` 中。用于独立验证。\n\
  \n## S\n**密封接口（Sealed Interface）** Java 的受限继承（自 Java 17 起）。所有实现类必须在编译时已知。用于 `Cause`\
  \ 类型和详尽的 switch 表达式。\n\n**顺序器模式（Sequencer Pattern）** 一种用于依赖操作线性链的结构模式。每个步骤依赖于上一步的输出。使用\
  \ `flatMap()` 链。\n\n**短路（Short-Circuit）** 在首次发生失败时停止执行。`flatMap()` 链支持短路。`Result.all()`\
  \ 不支持短路。\n\n**步骤接口（Step Interface）** 定义用例中单个操作的函数接口。由适配器实现。\n\n**存根（Stub）** 一个返回预定义值的测试双胞。声明在用例内部。\n\
  \n## T\n**三个区域（Three Zones）** JBCT 的架构模型：外部（外部系统）、适配器（边界翻译）、领域（纯业务逻辑）。\n\n**TimeSpan**\
  \ Pragmatica Lite 的持续时间类型。通过流式 API 创建：`TimeSpan(5).seconds()`。\n\n**类型提升（Type Lifting）**\
  \ 从低级类型转换为高级类型：`T` → `Option` → `Result` → `Promise`。一种会增加信息的安全的方向。\n\n## U\n**Unit**\
  \ 一种表示“无结果”的单一值类型。用于替代 `Void` 表示执行成功但不返回内容的操作。\n\n**用例（Use Case）** 作为函数接口暴露的单个业务操作。包含\
  \ `Request`/`ValidRequest`/`Response` 记录和步骤接口。\n\n## V\n**验证（Validation）** 检查数据是否符合要求。在\
  \ JBCT 中，验证发生在值对象工厂中，返回 `Result<T>`。\n\n**值对象（Value Object）** 表示领域概念的不可变对象。通过强制验证的工厂方法创建。例如：`Email`、`Money`、`UserId`。\n\
  \n**Verify** Pragmatica Lite 中用于验证谓词的工具类。`Verify.ensure()` 从谓词创建 `Result`。`Verify.Is`\
  \ 提供了常用的谓词。\n\n## W\n**包装器（Wrapper）** 一个在另一个函数周围添加行为的函数。用于切面模式中的横切关注点。\n\n## 快速参考\n\
  \n| 术语 | 一行定义 |\n| --- | --- |\n| Adapter (适配器) | Bridge 接外部系统与领域 |\n| Cause (原因)\
  \ | 类型化的错误值 |\n| flatMap | 链接依赖操作 |\n| Fork-Join (分叉-合并) | 并行独立操作 |\n| Leaf (叶子)\
  \ | 原子适配器操作 |\n| map | 转换成功值 |\n| Option | 可能缺失的值 |\n| Parse, Don’t Validate (解析而非验证)\
  \ | 创建验证的类型，而非检查原始数据 |\n| Promise | 可能失败的异步操作 |\n| Result | 可能失败的同步操作 |\n| Sequencer\
  \ (顺序器) | 依赖步骤的线性链 |\n| Step Interface (步骤接口) | 用例中的单个操作 |\n| Unit (单元) | “无结果”的类型\
  \ |\n| Use Case (用例) | 单个业务操作 |\n| Value Object (值对象) | 不可变的经过验证的领域概念 |\n\n"
