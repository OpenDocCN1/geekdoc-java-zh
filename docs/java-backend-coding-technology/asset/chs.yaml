  \ |\n| --- | --- | --- |\n| 分叉合并 (Fork-Join) | `ValidOrderRequest`, `CheckInventory`\
  \ | 并行字段验证，并行库存检查 |\n| 顺序器 (Sequencer) | 主流程 | 预留 -> 支付 -> 创建订单 |\n| 叶子节点 (Leaf)\
  \ | `ProcessPayment`, `CreateOrder` | 单次 I/O 操作 |\n| 条件 (Condition) | `ProcessPayment`\
  \ 中的错误映射 | 路由到特定的错误类型 |\n| 切面 (Aspects) | `SendConfirmation` | 尽力而为容错的处理 |\n\n##\
  \ 补偿模式\n\n此示例演示了在预留库存后支付失败时的补偿机制（回滚）：\n\n\n\n\n\n```\nreserve() -> pay() -> create()\n\
  \              |\n              v (failure)\n         release() -> propagate error\n\
  ```\n\n`recover()` 方法允许在无需 try-catch 的情况下实现整洁的补偿逻辑。\n\n* * *\n\n## 练习\n\n1. **添加折扣支持：**\
  \ 修改 `PriceCalculator` 以接受折扣码，并将其验证为值对象（value object）。\n2. **添加幂等性：** 确保相同的订单请求不会创建重复订单。你会创建一个什么样的值对象？\n\
  3. **添加重试切面：** 用重试切面包装 `ProcessPayment`，该切面在超时时重试，但在被拒绝时不重试。\n4. **测试补偿逻辑：** 编写一个测试，验证当\
  \ `CreateOrder` 失败时库存会被释放（而不仅仅是 `ProcessPayment`）。\n\n* * *\n\n## 总结\n\nPlaceOrder\
  \ 展示了：\n\n* **用于验证的 Fork-Join** - 并行验证所有字段，并累积错误\n* **用于 I/O 的 Fork-Join** - 并行检查所有物品的库存\n\
  * **带有补偿机制的顺序执行器（Sequencer）** - Reserve -> Pay -> Create，失败时回滚\n* **错误类型层级结构** -\
  \ 用于固定消息的枚举，用于携带数据的错误的记录（records）\n* **尽力而为的操作** - 通知失败不会导致订单失败\n* **适配器隔离** - 所有外部调用都封装在\
  \ `Promise.lift` 中\n\n尽管业务需求复杂，模式的组合仍然保持简单。每一步都是可独立测试的，而且补偿逻辑是显式的，而不是隐藏在 catch 块中。\n\
  \n# 第 14a 章：重点示例 - 发布文章\n\n此重点示例演示了用于内容管理领域中路由逻辑的“条件模式（Condition pattern）”。\n\n\
  * * *\n\n## \n\n**业务目标：** 允许作者通过审批工作流提交文章发布。\n\n**流程：** 1. 验证文章提交 2. 根据作者级别进行路由：\n\
  - **高级作者：** 自动通过，立即发布\n- **标准作者：** 排队等待编辑审核\n- **新作者：** 排队等待高级审核 + 抄袭检测检查\n\n**业务规则：**\n\
  - 高级作者跳过审核（自动发布）\n- 标准作者需要一次编辑审批\n- 新作者需要高级审批且必须通过抄袭检测\n- 所有文章都必须通过内容验证（长度、格式）\n\
  \n* * *\n\n## 领域模型\n\n```\npublic enum AuthorTier { PREMIUM, STANDARD, NEW }\n\n\
  public record ArticleId(String value) { /* 为了简洁省略了工厂方法 */ }\n\npublic record AuthorId(String\
  \ value) { /* 为了简洁省略了工厂方法 */ }\n\npublic record Article(\n    ArticleId id,\n  \
  \  AuthorId authorId,\n    String title,\n    String content,\n    AuthorTier authorTier\n\
  ) {}\n\npublic enum PublishStatus {\n    PUBLISHED,\n    PENDING_EDITORIAL_REVIEW,\n\
  \    PENDING_SENIOR_REVIEW\n}\n\npublic record PublishResult(ArticleId articleId,\
  \ PublishStatus status) {}\n```\n\n* * *\n\n## 错误类型\n\n```\npublic sealed interface\
  \ PublishError extends Cause {\n\n    enum General implements PublishError {\n \
  \       TITLE_TOO_SHORT(\"标题至少需要 10 个字符\"),\n        CONTENT_TOO_SHORT(\"内容至少需要\
  \ 500 个字符\"),\n        PLAGIARISM_DETECTED(\"内容未通过抄袭检测\"),\n        SAVE_FAILED(\"\
  保存文章失败\");\n\n        private final String message;\n\n        General(String message)\
  \ {\n            this.message = message;\n        }\n\n        @Override\n     \
  \   public String message() {\n            return message;\n        }\n    }\n}\n\
  ```\n\n* * *\n\n## 验证过的请求\n\n```\npublic record ValidArticle(\n    AuthorId authorId,\n\
  \    String title,\n    String content,\n    AuthorTier authorTier\n) {\n    private\
  \ static final int MIN_TITLE_LENGTH = 10;\n    private static final int MIN_CONTENT_LENGTH\
  \ = 500;\n\n    public static Result<ValidArticle> validArticle(\n        String\
  \ authorId,\n        String title,\n        String content,\n        AuthorTier\
  \ tier\n    ) {\n        return Result.all(\n            AuthorId.authorId(authorId),\n\
  \            validateTitle(title),\n            validateContent(content),\n    \
  \        Result.success(tier)\n        ).map(ValidArticle::new);\n    }\n\n    private\
  \ static Result<String> validateTitle(String title) {\n        return Verify.ensure(title,\
  \ Verify.Is::notBlank)\n            .flatMap(t -> t.trim().length() >= MIN_TITLE_LENGTH\n\
  \                ? Result.success(t.trim())\n                : PublishError.General.TITLE_TOO_SHORT.result());\n\
  \    }\n\n    private static Result<String> validateContent(String content) {\n\
  \        return Verify.ensure(content, Verify.Is::notBlank)\n            .flatMap(c\
  \ -> c.trim().length() >= MIN_CONTENT_LENGTH\n                ? Result.success(c.trim())\n\
  \                : PublishError.General.CONTENT_TOO_SHORT.result());\n    }\n}\n\
  ```\n\n* * *\n\n## 使用条件模式的用例\n\n\n\n\n\n```java\npublic interface PublishArticle\
  \ {\n\n    Promise<PublishResult> execute(ArticleRequest request);\n\n    // 步骤接口\n\
  \    interface SaveArticle {\n        Promise<ArticleId> apply(ValidArticle article);\n\
  \    }\n\n    interface CheckPlagiarism {\n        Promise<ValidArticle> apply(ValidArticle\
  \ article);\n    }\n\n    interface QueueForReview {\n        Promise<PublishResult>\
  \ apply(ArticleId id, PublishStatus status);\n    }\n\n    // 演示条件模式的工厂方法\n    static\
  \ PublishArticle publishArticle(\n        SaveArticle saveArticle,\n        CheckPlagiarism\
  \ checkPlagiarism,\n        QueueForReview queueForReview\n    ) {\n        return\
  \ request -> ValidArticle.validArticle(\n                request.authorId(),\n \
  \               request.title(),\n                request.content(),\n         \
  \       request.authorTier()\n            )\n            .async()\n            .flatMap(article\
  \ -> routeByAuthorTier(\n                article, saveArticle, checkPlagiarism,\
  \ queueForReview\n            ));\n    }\n\n    // 条件模式：仅进行路由，不进行数据转换\n    private\
  \ static Promise<PublishResult> routeByAuthorTier(\n        ValidArticle article,\n\
  \        SaveArticle saveArticle,\n        CheckPlagiarism checkPlagiarism,\n  \
  \      QueueForReview queueForReview\n    ) {\n        return switch (article.authorTier())\
  \ {\n            case PREMIUM -> publishImmediately(article, saveArticle);\n   \
  \         case STANDARD -> queueForEditorialReview(article, saveArticle, queueForReview);\n\
  \            case NEW -> queueWithPlagiarismCheck(article, saveArticle, checkPlagiarism,\
  \ queueForReview);\n        };\n    }\n\n    // 路径 1：优质 - 自动发布\n    private static\
  \ Promise<PublishResult> publishImmediately(\n        ValidArticle article,\n  \
  \      SaveArticle saveArticle\n    ) {\n        return saveArticle.apply(article)\n\
  \            .map(id -> new PublishResult(id, PublishStatus.PUBLISHED));\n    }\n\
  \n    // 路径 2：标准 - 待审核\n    private static Promise<PublishResult> queueForEditorialReview(\n\
  \        ValidArticle article,\n        SaveArticle saveArticle,\n        QueueForReview\
  \ queueForReview\n    ) {\n        return saveArticle.apply(article)\n         \
  \   .flatMap(id -> queueForReview.apply(id, PublishStatus.PENDING_EDITORIAL_REVIEW));\n\
  \    }\n\n    // 路径 3：新用户 - 查重检查 + 高级审核\n    private static Promise<PublishResult>\
  \ queueWithPlagiarismCheck(\n        ValidArticle article,\n        SaveArticle\
  \ saveArticle,\n        CheckPlagiarism checkPlagiarism,\n        QueueForReview\
  \ queueForReview\n    ) {\n        return checkPlagiarism.apply(article)\n     \
  \       .flatMap(saveArticle::apply)\n            .flatMap(id -> queueForReview.apply(id,\
  \ PublishStatus.PENDING_SENIOR_REVIEW));\n    }\n}\n```\n\n* * *\n\n## 关键点：条件模式\
  \ (Condition Pattern)\n\n### 条件的作用\n\n条件模式**仅执行路由** - 它根据输入数据选择遵循哪种执行路径。switch 表达式从每个分支返回\
  \ `Promise<PublishResult>`。\n\n```java\nreturn switch (article.authorTier()) {\n\
  \    case PREMIUM -> publishImmediately(...);      // 路由到路径 A\n    case STANDARD\
  \ -> queueForEditorialReview(...); // 路由到路径 B\n    case NEW -> queueWithPlagiarismCheck(...);\
  \    // 路由到路径 C\n};\n```\n\n### 条件不做什么\n\n条件模式不在内联中进行数据转换。每个路由都委托给一个独立的方法：\n\n```java\n\
  // 错误：在条件中进行转换\nreturn switch (article.authorTier()) {\n    case PREMIUM -> saveArticle.apply(article)\n\
  \        .map(id -> new PublishResult(id, PublishStatus.PUBLISHED));  // 这里内容太多了\n\
  \    ...\n};\n\n// 正确：路由到处理该路径的方法\nreturn switch (article.authorTier()) {\n    case\
  \ PREMIUM -> publishImmediately(article, saveArticle);  // 委托\n    ...\n};\n```\n\
  \n### 优势\n\n1. **逻辑清晰的路由逻辑** - 在一处展示了所有可能的路径\n2. **可测试的分支** - 每个路由方法都可以独立进行测试\n\
  3. **可扩展性** - 添加新的作者等级仅需添加一个 case\n4. **类型安全** - 如果 switch 不完整，编译器会发出警告\n\n* * *\n\
  \n## 测试\n\n\n\n\n```java\nclass PublishArticleTest {\n\n    @Nested\n    class Routing\
  \ {\n        @Test\n        void execute_publishesImmediately_forPremiumAuthor()\
  \ {\n            var saved = new AtomicReference<ValidArticle>();\n\n          \
  \  PublishArticle.SaveArticle saveArticle = article -> {\n                saved.set(article);\n\
  \                return Promise.success(new ArticleId(\"art-123\"));\n         \
  \   };\n\n            var useCase = PublishArticle.publishArticle(\n           \
  \     saveArticle,\n                article -> Promise.success(article),\n     \
  \           (id, status) -> Promise.success(new PublishResult(id, status))\n   \
  \         );\n\n            useCase.execute(requestWithTier(AuthorTier.PREMIUM))\n\
  \                .await()\n                .onFailure(Assertions::fail)\n      \
  \          .onSuccess(result -> {\n                    assertEquals(PublishStatus.PUBLISHED,\
  \ result.status());\n                    assertNotNull(saved.get());\n         \
  \       });\n        }\n\n        @Test\n        void execute_queuesForEditorialReview_forStandardAuthor()\
  \ {\n            var useCase = PublishArticle.publishArticle(\n                article\
  \ -> Promise.success(new ArticleId(\"art-123\")),\n                article -> Promise.success(article),\n\
  \                (id, status) -> Promise.success(new PublishResult(id, status))\n\
  \            );\n\n            useCase.execute(requestWithTier(AuthorTier.STANDARD))\n\
  \                .await()\n                .onFailure(Assertions::fail)\n      \
  \          .onSuccess(result ->\n                    assertEquals(PublishStatus.PENDING_EDITORIAL_REVIEW,\
  \ result.status())\n                );\n        }\n\n        @Test\n        void\
  \ execute_checksPlagiarism_forNewAuthor() {\n            var plagiarismChecked =\
  \ new AtomicBoolean(false);\n\n            PublishArticle.CheckPlagiarism checkPlagiarism\
  \ = article -> {\n                plagiarismChecked.set(true);\n               \
  \ return Promise.success(article);\n            };\n            var useCase = PublishArticle.publishArticle(\n\
  \                article -> Promise.success(new ArticleId(\"art-123\")),\n     \
  \           checkPlagiarism,\n                (id, status) -> Promise.success(new\
  \ PublishResult(id, status))\n            );\n\n            useCase.execute(requestWithTier(AuthorTier.NEW))\n\
  \                .await()\n                .onFailure(Assertions::fail)\n      \
  \          .onSuccess(result -> {\n                    assertTrue(plagiarismChecked.get());\n\
  \                    assertEquals(PublishStatus.PENDING_SENIOR_REVIEW, result.status());\n\
  \                });\n        }\n\n        @Test\n        void execute_fails_whenPlagiarismDetected()\
  \ {\n            PublishArticle.CheckPlagiarism failingCheck = article ->\n    \
  \            PublishError.General.PLAGIISM_DETECTED.promise();\n            var\
  \ useCase = PublishArticle.publishArticle(\n                article -> Promise.success(new\
  \ ArticleId(\"art-123\")),\n                failingCheck,\n                (id,\
  \ status) -> Promise.success(new PublishResult(id, status))\n            );\n\n\
  \            useCase.execute(requestWithTier(AuthorTier.NEW))\n                .await()\n\
  \                .onSuccess(Assertions::fail);\n        }\n    }\n\n    private\
  \ ArticleRequest requestWithTier(AuthorTier tier) {\n        return new ArticleRequest(\n\
  \            \"author-123\",\n            \"This is a valid title for testing\"\
  ,\n            \"x\".repeat(600), // Valid content\n            tier\n        );\n\
  \    }\n}\n```\n\n## 练习\n\n1. **添加等级升级**：如果一个 `NEW` 作者拥有 10 篇以上已发布的文章，将其路由为 `STANDARD`。此逻辑应该属于哪里？\n\
  2. **添加定时发布**：`PREMIUM` 作者可以指定发布日期。修改 `Condition` 以以不同的方式路由定时文章。\n3. **提取到过滤器**：使用\
  \ `.filter()` 代替单独步骤接口来重写抄袭检查。\n\n## 总结\n\n`PublishArticle` 展示了：\n\n- **用于路由的条件模式**：使用切换表达式选择执行路径\n\
  - **条件中不进行转换**：每个分支都委托给一个方法\n- **带枚举的模式匹配**：类型安全的穷尽式的路由\n- **可测试的分支**：每个路由都经过独立测试\n\
  - **与其他模式组合**：路由包含 `Sequencer` 链\n\n# 第 14b 节：重点示例 - 资金转账\n\n此重点示例演示了在具有审计要求的金融领域中用于跨切关注点的\
  \ `Aspects`。\n\n## 需求\n\n**业务目标：** 在账户之间转账资金并保留完整的审计追踪。\n\n**流程：** 1. 验证转账请求 2.\
  \ 验证源账户有足够的余额 3. 执行转账（扣除源账户，增加目的地）4. 记录审计日志\n\n**合规性：**\n- 每项操作必须记录时间戳、执行者和结果\n\
  - 失败的操作也必须记录（而不只是成功的操作）\n- 审计日志不能影响转账执行（尽力而为）\n- 所有超过阈值的转账都需要额外的授权\n\n**技术需求：**\n\
  - **幂等性**：相同的 `request ID` 不得执行两次\n- **超时**：外部调用必须在 5 秒后超时\n- **重试**：瞬态故障应重试最多 3\
  \ 次\n\n## 领域模型\n\n```java\npublic record AccountId(String value) { /* 工方法省略 */ }\n\
  \npublic record TransferId(String value) { /* 工方法省略 */ }\n\npublic record Money(BigDecimal\
  \ value) {\n    public boolean isGreaterThan(Money other) {\n        return this.value.compareTo(other.value)\
  \ > 0;\n    }\n\n    public Money subtract(Money other) {\n        return new Money(this.value.subtract(other.value));\n\
  \    }\n\n    public Money add(Money other) {\n        return new Money(this.value.add(other.value));\n\
  \    }\n}\n\npublic record TransferRequest(\n    String requestId,\n    String sourceAccountId,\n\
  \    String destinationAccountId,\n    String amount,\n    String initiatedBy\n\
  ) {}\n\npublic record TransferResult(\n    TransferId transferId,\n    Money amount,\n\
  \    Instant completedAt\n) {}\n```\n\n\n\n```java\npublic sealed interface TransferError\
  \ extends Cause {\n    enum General implements TransferError {\n        INSUFFICIENT_FUNDS(\"\
  源账户余额不足\"),\n        SAME_ACCOUNT(\"不能转账至同一账户\"),\n        DUPLICATE_REQUEST(\"\
  转账请求已处理\"),\n        ACCOUNT_NOT_FOUND(\"未找到账户\"),\n        TRANSFER_FAILED(\"转账执行失败\"\
  );\n\n        private final String message;\n\n        General(String message) {\n\
  \            this.message = message;\n        }\n\n        @Override\n        public\
  \ String message() {\n            return message;\n        }\n    }\n\n    record\
  \ AuthorizationRequired(Money amount, Money threshold) implements TransferError\
  \ {\n        @Override\n        public String message() {\n            return String.format(\"\
  转账金额 %s 需要授权 (阈值: %s)\",\n                    amount.value(), threshold.value());\n\
  \        }\n    }\n}\n```\n\n## 校验后的请求\n\n```java\npublic record ValidTransfer(\n\
  \    String requestId,\n    AccountId sourceAccount,\n    AccountId destinationAccount,\n\
  \    Money amount,\n    String initiatedBy\n) {\n    public static Result<ValidTransfer>\
  \ validTransfer(TransferRequest raw) {\n        return Result.all(\n           \
  \ validateRequestId(raw.requestId()),\n            AccountId.accountId(raw.sourceAccountId()),\n\
  \            AccountId.accountId(raw.destinationAccountId()),\n            Money.money(raw.amount()),\n\
  \            validateInitiator(raw.initiatedBy())\n        ).flatMap(ValidTransfer::validateNotSameAccount);\n\
  \    }\n\n    private static Result<ValidTransfer> validateNotSameAccount(\n   \
  \     String requestId,\n        AccountId source,\n        AccountId destination,\n\
  \        Money amount,\n        String initiatedBy\n    ) {\n        if (source.value().equals(destination.value()))\
  \ {\n            return TransferError.General.SAME_ACCOUNT.result();\n        }\n\
  \        return Result.success(new ValidTransfer(requestId, source, destination,\
  \ amount, initiatedBy));\n    }\n\n    private static Result<String> validateRequestId(String\
  \ requestId) {\n        return Verify.ensure(requestId, Verify.Is::notBlank)\n \
  \           .mapError(_ -> Causes.cause(\"需要请求 ID\"));\n    }\n\n    private static\
  \ Result<String> validateInitiator(String initiatedBy) {\n        return Verify.ensure(initiatedBy,\
  \ Verify.Is::notBlank)\n            .mapError(_ -> Causes.cause(\"需要发起者信息\"));\n\
  \    }\n}\n```\n\n## 带有切面的用例\n\n\n\n\n```java\npublic interface TransferFunds {\n\
  \n    Promise<TransferResult> execute(TransferRequest request);\n\n    // 步骤接口\n\
  \    interface CheckIdempotency {\n        Promise<ValidTransfer> apply(ValidTransfer\
  \ transfer);\n    }\n\n    interface CheckBalance {\n        Promise<ValidTransfer>\
  \ apply(ValidTransfer transfer);\n    }\n\n    interface ExecuteTransfer {\n   \
  \     Promise<TransferResult> apply(ValidTransfer transfer);\n    }\n\n    interface\
  \ AuditLog {\n        Promise<Unit> apply(AuditEntry entry);\n    }\n\n    // 使用面向组合的工厂\n\
  \    static TransferFunds transferFunds(\n        CheckIdempotency checkIdempotency,\n\
  \        CheckBalance checkBalance,\n        ExecuteTransfer executeTransfer,\n\
  \        AuditLog auditLog,\n        TimeSpan timeout,\n        RetryPolicy retryPolicy\n\
  \    ) {\n        // 使用切面装饰 executeTransfer\n        var decoratedExecute = withRetry(retryPolicy,\n\
  \            withTimeout(timeout,\n                withAudit(auditLog, executeTransfer)\n\
  \            )\n        );\n\n        return request -> ValidTransfer.validTransfer(request)\n\
  \            .async()\n            .flatMap(checkIdempotency::apply)\n         \
  \   .flatMap(checkBalance::apply)\n            .flatMap(decoratedExecute);\n   \
  \ }\n\n    // 切面：超时\n    private static Fn1<ValidTransfer, Promise<TransferResult>>\
  \ withTimeout(\n        TimeSpan timeout,\n        Fn1<ValidTransfer, Promise<TransferResult>>\
  \ step\n    ) {\n        return transfer -> step.apply(transfer).timeout(timeout);\n\
  \    }\n\n    // 切面：重试\n    private static Fn1<ValidTransfer, Promise<TransferResult>>\
  \ withRetry(\n        RetryPolicy policy,\n        Fn1<ValidTransfer, Promise<TransferResult>>\
  \ step\n    ) {\n        return transfer -> retryWithPolicy(policy, () -> step.apply(transfer));\n\
  \    }\n\n    private static Promise<TransferResult> retryWithPolicy(\n        RetryPolicy\
  \ policy,\n        Supplier<Promise<TransferResult>> operation\n    ) {\n      \
  \  return operation.get()\n            .recover(cause -> {\n                if (policy.shouldRetry(cause)\
  \ && policy.attemptsRemaining() > 0) {\n                    return retryWithPolicy(policy.decrementAttempts(),\
  \ operation);\n                }\n                return cause.promise();\n    \
  \        });\n    }\n\n    // 切面：审计（通过执行前后日志包装执行过程）\n    private static Fn1<ValidTransfer,\
  \ Promise<TransferResult>> withAudit(\n        AuditLog auditLog,\n        Fn1<ValidTransfer,\
  \ Promise<TransferResult>> step\n    ) {\n        return transfer -> {\n       \
  \     var startTime = Instant.now();\n\n            return step.apply(transfer)\n\
  \                .onResult(result -> logAuditEntry(auditLog, transfer, result, startTime));\n\
  \        };\n    }\n\n    private static void logAuditEntry(\n        AuditLog auditLog,\n\
  \        ValidTransfer transfer,\n        Result<TransferResult> result,\n     \
  \   Instant startTime\n    ) {\n        var entry = new AuditEntry(\n          \
  \  transfer.requestId(),\n            \"TRANSFER\",\n            transfer.initiatedBy(),\n\
  \            startTime,\n            Instant.now(),\n            result.isSuccess()\
  \ ? \"SUCCESS\" : \"FAILURE\",\n            result.fold(Cause::message, r -> \"\
  Transfer completed: \" + r.transferId().value())\n        );\n        // 尽力而为：记录日志，如果审计失败则不处理\n\
  \        auditLog.apply(entry)\n            .onFailure(e -> { /* fallback */ });\n\
  \    }\n}\n\n// 支持类型\nrecord AuditEntry(\n    String requestId,\n    String operation,\n\
  \    String initiatedBy,\n    Instant startedAt,\n    Instant completedAt,\n   \
  \ String outcome,\n    String details\n) {}\n\nrecord RetryPolicy(\n    int maxAttempts,\n\
  \    int attemptsRemaining,\n    Set<Class extends Cause> retryableErrors\n) {\n\
  \    public static RetryPolicy retry(int maxAttempts, Set<Class extends Cause> retryableErrors)\
  \ {\n        return new RetryPolicy(maxAttempts, maxAttempts, retryableErrors);\n\
  \    }\n\n    public boolean shouldRetry(Cause cause) {\n        return retryableErrors.stream()\n\
  \            .anyMatch(error -> error.isInstance(cause));\n    }\n\n    public RetryPolicy\
  \ decrementAttempts() {\n        return new RetryPolicy(maxAttempts, attemptsRemaining\
  \ - 1, retryableErrors);\n    }\n}\n\n// 步骤实现\nclass IdempotencyChecker implements\
  \ TransferFunds.CheckIdempotency {\n    private final IdempotencyStore store;\n\n\
  \    public IdempotencyChecker(IdempotencyStore store) {\n        this.store = store;\n\
  \    }\n\n    @Override\n    public Promise<ValidTransfer> apply(ValidTransfer transfer)\
  \ {\n        return Promise.lift(\n            _ -> TransferError.General.TRANSFER_FAILED,\n\
  \            () -> store.exists(transfer.requestId())\n        ).flatMap(exists\
  \ -> exists\n            ? TransferError.General.DUPLICATE_REQUEST.promise()\n \
  \           : Promise.success(transfer));\n    }\n}\n\nclass BalanceChecker implements\
  \ TransferFunds.CheckBalance {\n    private final AccountRepository accounts;\n\n\
  \    public BalanceChecker(AccountRepository accounts) {\n        this.accounts\
  \ = accounts;\n    }\n\n    @Override\n    public Promise<ValidTransfer> apply(ValidTransfer\
  \ transfer) {\n        return accounts.getBalance(transfer.sourceAccount())\n  \
  \          .flatMap(balance -> balance.isGreaterThan(transfer.amount())\n      \
  \          ? Promise.success(transfer)\n                : TransferError.General.INSUFFICIENT_FUNDS.promise());\n\
  \    }\n}\n```\n\n\n\n\n```java\npublic class TransferExecutor implements TransferFunds.ExecuteTransfer\
  \ {\n    private final AccountRepository accounts;\n    private final IdempotencyStore\
  \ idempotencyStore;\n\n    @Override\n    public Promise<TransferResult> apply(ValidTransfer\
  \ transfer) {\n        return Promise.lift(\n            _ -> TransferError.General.TRANSFER_FAILED,\n\
  \            () -> executeInTransaction(transfer)\n        );\n    }\n\n    private\
  \ TransferResult executeInTransaction(ValidTransfer transfer) {\n        // Transaction\n\
  \        accounts.debit(transfer.sourceAccount(), transfer.amount());\n        accounts.credit(transfer.destinationAccount(),\
  \ transfer.amount());\n        idempotencyStore.record(transfer.requestId());\n\
  \        return new TransferResult(\n            UUID.randomUUID().toString(),\n\
  \            transfer.amount(),\n            Instant.now()\n        );\n    }\n\
  }\n```\n\n* * *\n\n## 关键点：切面模式 (Aspect Pattern)\n\n### 什么是切面\n\n切面（Aspects）是高阶函数，用于跨跨关注点封装步骤执行。它们形成了一个组合链：\n\
  \n```\nRequest -> [Retry -> [Timeout -> [Audit -> Execute]]]\n```\n\n### 切面的组合顺序\n\
  \n顺序至关重要。切面是从外向内应用的：\n\n```\nvar decorated = withRetry(policy,      // 1. 外层：重试封装所有内容\n\
  \    withTimeout(timeout,                // 2. 中层：每次尝试的超时\n        withAudit(auditLog,\
  \ execute)    // 3. 内层：对每次尝试进行审计\n    )\n);\n```\n\n这意味着：`Retry` 包裹了 `timeout`（每次重试尝试都有自己的超时），`timeout`\
  \ 包裹了 `audit`（审计在超时范围内发生），`audit` 包裹了 `execute`（执行过程被审计）。\n\n### 标准组合顺序\n\n对于大多数用例：\n\
  \n1. `Metrics/Logging`（最外层） - 观察一切\n2. `Timeout` - 限制总时间\n3. `Circuit Breaker` -\
  \ 如果服务不健康则快速失败\n4. `Retry` - 瞬态故障进行重试\n5. `Rate Limit` - 控制请求速率\n6. `Business Logic`（最内层）\
  \ - 实际操作\n\n### 切面的独立性\n\n每个切面都是独立且可测试的：\n\n```java\n@Test\nvoid withTimeout_fails_whenTimeoutExceeds()\
  \ {\n    var slowStep = transfer -> Promise.<TransferResult>promise()\n        .timeout(TimeSpan.timeSpan(100).millis());\
  \ // 永远不会解析\n\n    var decorated = withTimeout(TimeSpan.timeSpan(50).millis(), slowStep);\n\
  \n    decorated.apply(validTransfer())\n        .await()\n        .onSuccess(Assertions::fail);\
  \ // 应该超时\n}\n```\n\n\n\n\n```java\nclass TransferFundsTest {\n\n    @Nested\n \
  \   class Aspects {\n\n        @Test\n        void execute_retriesOnTransientFailure()\
  \ {\n            var attempts = new AtomicInteger(0);\n\n            TransferFunds.ExecuteTransfer\
  \ failingThenSucceeding = transfer -> {\n                if (attempts.incrementAndGet()\
  \ < 3) {\n                    return new TransientError().promise();\n         \
  \       }\n                return Promise.success(new TransferResult(\n        \
  \            new TransferId(\"tx-123\"),\n                    transfer.amount(),\n\
  \                    Instant.now()\n                ));\n            };\n\n    \
  \        var policy = RetryPolicy.retryPolicy(3, Set.of(TransientError.class));\n\
  \n            var useCase = TransferFunds.transferFunds(\n                t -> Promise.success(t),\n\
  \                t -> Promise.success(t),\n                failingThenSucceeding,\n\
  \                e -> Promise.success(Unit.INSTANCE),\n                TimeSpan.timeSpan(5).seconds(),\n\
  \                policy\n            );\n\n            useCase.execute(validRequest())\n\
  \                .await()\n                .onFailure(Assertions::fail)\n      \
  \          .onSuccess(result -> assertEquals(3, attempts.get()));\n        }\n\n\
  \        @Test\n        void execute_auditsSuccessfulTransfer() {\n            var\
  \ auditedEntries = new ArrayList<AuditEntry>();\n\n            TransferFunds.AuditLog\
  \ auditLog = entry -> {\n                auditedEntries.add(entry);\n          \
  \      return Promise.success(Unit.INSTANCE);\n            };\n\n            var\
  \ useCase = TransferFunds.transferFunds(\n                t -> Promise.success(t),\n\
  \                t -> Promise.success(t),\n                t -> Promise.success(new\
  \ TransferResult(new TransferId(\"tx-123\"), t.amount(), Instant.now())),\n    \
  \            auditLog,\n                TimeSpan.timeSpan(5).seconds(),\n      \
  \          RetryPolicy.retryPolicy(0, Set.of())\n            );\n\n            useCase.execute(validRequest())\n\
  \                .await()\n                .onFailure(Assertions::fail);\n\n   \
  \         assertEquals(1, auditedEntries.size());\n            assertEquals(\"SUCCESS\"\
  , auditedEntries.get(0).outcome());\n        }\n\n        @Test\n        void execute_auditsFailedTransfer()\
  \ {\n            var auditedEntries = new ArrayList<AuditEntry>();\n\n         \
  \   TransferFunds.AuditLog auditLog = entry -> {\n                auditedEntries.add(entry);\n\
  \                return Promise.success(Unit.INSTANCE);\n            };\n\n    \
  \        var useCase = TransferFunds.transferFunds(\n                t -> Promise.success(t),\n\
  \                TransferError.General.INSUFFICIENT_FUNDS.promise(),\n         \
  \       t -> Promise.success(new TransferResult(new TransferId(\"tx-123\"), t.amount(),\
  \ Instant.now())),\n                auditLog,\n                TimeSpan.timeSpan(5).seconds(),\n\
  \                RetryPolicy.retryPolicy(0, Set.of())\n            );\n\n      \
  \      useCase.execute(validRequest())\n                .await()\n             \
  \   .onSuccess(Assertions::fail);\n\n            // 即使失败了也会记录审计\n            assertEquals(1,\
  \ auditedEntries.size());\n            assertEquals(\"FAILURE\", auditedEntries.get(0).outcome());\n\
  \        }\n\n        @Test\n        void execute_succeedsIfAuditFails() {\n   \
  \         TransferFunds.AuditLog failingAudit = entry ->\n                Cause(\"\
  Audit unavailable\").promise();\n            var useCase = TransferFunds.transferFunds(\n\
  \                t -> Promise.success(t),\n                t -> Promise.success(t),\n\
  \                t -> Promise.success(new TransferResult(new TransferId(\"tx-123\"\
  ), t.amount(), Instant.now())),\n                failingAudit,\n               \
  \ TimeSpan.timeSpan(5).seconds(),\n                RetryPolicy.retryPolicy(0, Set.of())\n\
  \            );\n\n            // 如果审计失败，转账仍应该成功\n            useCase.execute(validRequest())\n\
  \                .await()\n                .onFailure(Assertions::fail);\n     \
  \   }\n    }\n\n    private TransferRequest validRequest() {\n        return new\
  \ TransferRequest(\n            \"req-123\",\n            \"acc-source\",\n    \
  \        \"acc-dest\",\n            100.00,\n            \"user@example.com\"\n\
  \        );\n    }\n\n    static class TransientError implements Cause {\n     \
  \   @Override\n        public String message() {\n            return \"Transient\
  \ error\";\n        }\n    }\n}\n```\n\n\n\n\n\n## 为什么按标准进行垂直切片（vertical slicing）\n\
  \n- **复杂度**：最小化不相关功能之间的耦合 (+3)\n- **业务/技术比例**：包名反映领域用例，而非技术分层 (+2)\n- **心理开销**：所有相关代码都在同一处\
  \ - 减少了导航跳转次数 (+2)\n- **设计影响**：强制执行合理的边界 - 业务逻辑不会在用例之间泄露 (+2)\n\n## 包结构\n\n```\n\
  com.example.app/\n|-- usecase/\n|   |-- registeruser/              # 用例 1 (垂直切片)\n\
  |   ||-- RegisterUser.java      # 用例接口 + 工厂方法\n|   ||-- RegistrationError.java #\
  \ 密封错误接口\n|   ||-- [internal types]       # 有效请求，中间记录\n|   |\n|   |-- getuserprofile/\
  \            # 用例 2 (垂直切片)\n|       |-- GetUserProfile.java\n|       |-- ProfileError.java\n\
  |       |-- [internal types]\n|\n|-- domain/\n|   |-- shared/                  \
  \  # 仅包含可复值对象\n|       |-- Email.java\n|       |-- Password.java\n|       |-- UserId.java\n\
  |\n|-- adapter/\n|   |-- rest/                      # 入站适配器 (HTTP)\n|   ||-- UserController.java\n\
  |   |\n|   |-- persistence/               # 出站适配器 (DB)\n|       |-- JooqUserRepository.java\n\
  |\n|-- config/                        # 框架配置\n    |-- UseCaseConfig.java\n```\n\n\
  ### 包放置规则\n\n### 用例包\n\n`com.example.app.usecase.<usecasename>`:\n- 用例接口和工厂方法\n\
  - 特定于此用例的错误类型（密封接口）\n- 步骤接口（嵌套在用例接口中）\n- 内部校验类型（`ValidRequest`，中间记录）\n\n**规则**：如果一个类型仅被此用例使用，则保留在此处。\n\
  \n### 领域共享\n\n`com.example.app.domain.shared`:\n- 跨多个用例复用的值对象\n\n**规则**：当第二个用例需要相同的值对象时，立即移动到此处。\n\
  \n**反模式**：不要预先创建此类结构——让复用驱动移动。\n\n### 适配器包\n\n`com.example.app.adapter.*`:\n- `adapter.rest`\
  \ - HTTP 控制器，请求/响应 DTOs\n- `adapter.persistence` - 数据库存储库，ORM 实体\n- `adapter.messaging`\
  \ - 消息队列消费者/生产者\n- `adapter.external` - 外部服务的 HTTP 客户端\n\n**规则**：适配器实现来自用例的步骤接口。\n\
  \n### 配置包\n\n`com.example.app.config`:\n- Spring/框架配置\n- Bean 绑定，依赖注入设置\n\n**规则**：不包含业务逻辑，仅包含基础设施配置。\n\
  \n## 模块组织（可选）\n\n对于较大的系统，将其分为 Gradle/Maven 模块：\n\n```\n:domain          # 纯 Java\
  \ - 值对象\n:application     # 用例和步骤接口\n:adapters        # 适配器实现\n:bootstrap      \
  \ # 主类，配置\n```\n\n### 何时使用模块\n\n- 团队人数 > 5 名开发人员\n- 同一代码库的多个部署单元\n- 强制执行编译时依赖边界\n\
  - 独立库发布\n\n### 何时单模块足够\n\n- 小中型团队（< 5 名开发人员）\n- 单体式部署\n- 包约定提供了足够的结构\n\n### 模块依赖\n\
  \n```\ndomain         -> (无依赖)\n  |\napplication    -> domain\n  |\nadapters   \
  \    -> application, domain\n  |\nbootstrap      -> adapters, application, domain\n\
  ```\n\n## 文件结构指南\n\n除了包组织外，JBCT 标准化了源文件的内部结构。这确保了一致性并能够实现自动化代码检查（linting）。\n\n**范围**：用例接口、步骤实现、值对象、错误接口和工具接口。适配器被排除在外——它们过于依赖特定框架。\n\
  \n### 导入顺序\n\n```\n1. java.*\n2. javax.*\n3. org.pragmatica.*\n4. 第三方 (org.*, com.*\
  \ - 按字母顺序排序)\n5. 项目导入\n6. (空行)\n7. 静态导入（与分组顺序一致）\n```\n\n### 按文件类型排序排序\n\n**用例接口**：1.\
  \ 公共 API（Request, Response records） 2. `execute` 方法 3. 内部类型（`ValidRequest` + 校验辅助方法）4.\
  \ 步骤接口 5. 领域片段（仅由此用例使用的 records）6. 工厂方法\n\n**值对象**：1. 静态常量（模式，原因工厂）2. 工厂方法 3. 辅助方法\n\
  \n**错误接口**：1. 枚举变体（固定消息错误，分组）2. 记录变体（携带数据的错误）\n\n**步骤实现**：1. 依赖项（final 字段）2. 构造函数\
  \ 3. 接口方法 4. 私有辅助方法\n\n**工具接口**：1. 常量 2. 静态方法 3. `unused` 记录（始终在最后——防止实现）\n\n###\
  \ 工具接口模式\n\n工具接口取代了工具类。使用 `sealed` 修符配合 `unused` 记录可以防止实现：\n\n```java\npublic sealed\
  \ interface ValidationUtils {\n\n    static Pattern PHONE_PATTERN = Pattern.compile(\"\
  ^\\\\+?[0-9]{10,14}$\");\n\n    static Result<String> normalizePhone(String raw)\
  \ {\n        return Verify.ensure(raw, Verify.Is::notNull)\n                   \
  \  .map(s -> s.replaceAll(\"\\\\s-\", \"\"))\n                     .filter(PHONE_PATTERN.asPredicate());\n\
  \    }\n\n    record unused() implements ValidationUtils {}\n}\n```\n\n**关键点**：\n\
  - `sealed` 防止外部实现\n- `unused` 记录满足需求\n- 不需要可见性修饰符（隐式 `public`）\n\n### Section\n\n\
  使用空行分隔逻辑部分。注释是可选的——仅在增加清晰度时使用。\n\n## 框架集成\n\n### 完整示例：Spring REST -> 用例 -> JOQ\n\
  \n### 1. 用例（功能性核心）\n\n```java\npublic interface GetUserProfile {\n    record Request(String\
  \ userId) {}\n    record Response(String userId, String email, String displayName)\
  \ {\n        static Response fromUser(User user) {\n            return new Response(user.id().value(),\n\
  \                                user.email().value(),\n                       \
  \         user.displayName());\n        }\n    }\n\n    Promise<Response> execute(Request\
  \ request);\n\n    interface FetchUser {\n        Promise<User> apply(UserId userId);\n\
  \    }\n\n    static GetUserProfile getUserProfile(FetchUser fetchUser) {\n    \
  \    return request -> UserId.userId(request.userId())\n                       \
  \         .async()\n                                .flatMap(fetchUser::apply)\n\
  \                                .map(Response::fromUser);\n    }\n}\n```\n\n纯业务逻辑。无框架依赖。\n\
  \n### 2. REST 控制器（入站适配器）\n\n\n\n\n```java\n@RestController\n@RequestMapping(\"/api/users\"\
  )\npublic class UserController {\n    private final GetUserProfile getUserProfile;\n\
  \n    public UserController(GetUserProfile getUserProfile) {\n        this.getUserProfile\
  \ = getUserProfile;\n    }\n\n    @GetMapping(\"/{userId}\")\n    public ResponseEntity<?>\
  \ getProfile(@PathVariable String userId) {\n        var request = new GetUserProfile.Request(userId);\n\
  \n        return getUserProfile.execute(request)\n            .await()\n       \
  \     .fold(this::toErrorResponse,\n                  response -> ResponseEntity.ok(response));\n\
  \    }\n\n    private ResponseEntity<?> toErrorResponse(Cause cause) {\n       \
  \ return switch (cause) {\n            case ProfileError.UserNotFound _ ->\n   \
  \             ResponseEntity.status(HttpStatus.NOT_FOUND)\n                    \
  \          .body(Map.of(\"error\", cause.message()))\n\n            case ProfileError.InvalidUserId\
  \ _ ->\n                ResponseEntity.status(HttpStatus.BAD_REQUEST)\n        \
  \                      .body(Map.of(\"error\", cause.message()));\n\n          \
  \  default ->\n                ResponseEntity.status(HttpStatus.INTERNAL_SERVER_ERROR)\n\
  \                              .body(Map.of(\"error\", \"Internal server error\"\
  ));\n        };\n    }\n}\n```\n\n薄适配器：HTTP -> 请求 -> 用例 -> 响应原因 -> HTTP。\n\n###\
  \ 3. JOOQ 仓库（适配器输出）\n\n```java\n@Repository\npublic class JooqUserRepository implements\
  \ GetUserProfile.FetchUser {\n    private final DSLContext dsl;\n\n    public JooqUserRepository(DSLContext\
  \ dsl) {\n        this.dsl = dsl;\n    }\n\n    public Promise<User> apply(UserId\
  \ userId) {\n        return Promise.lift(ProfileError.DatabaseFailure::cause,\n\
  \            () -> dsl.selectFrom(USERS)\n                     .where(USERS.ID.eq(userId.value()))\n\
  \                     .fetchOptional()\n                     .map(this::toDomain)\n\
  \                     .orElseThrow(() -> new NotFoundException()));\n    }\n\n \
  \   private User toDomain(Record record) {\n        return new User(\n         \
  \   new UserId(record.get(USERS.ID)),\n            new Email(record.get(USERS.EMAIL)),\n\
  \            record.get(USERS.DISPLAY_NAME)\n        );\n    }\n}\n```\n\n将 JOOQ\
  \ 异常封装在领域“原因”（Causes）中。\n\n### 4. 组装（Spring 配置）\n\n```java\n@Configuration\npublic\
  \ class UseCaseConfig {\n\n    @Bean\n    public GetUserProfile getUserProfile(JooqUserRepository\
  \ repository) {\n        return GetUserProfile.getUserProfile(repository);\n   \
  \ }\n}\n```\n\n***\n\n## 核心原则\n\n### 1. 垂直切片 (Vertical Slicing)\n每个用例包都是一个垂直切片，包含了该功能所需的所有内容。\n\
  \n### 2. 最小共享 (Minimal Sharing)\n仅在真正可复用时才共享对象。过早共享会导致耦合。\n\n### 3. 框架位于边缘 (Framework\
  \ at Edges)\n业务逻辑（`use cases`、`domain`）零框架依赖。适配器处理框架集成。\n\n### 4. 清晰的依赖关系\n- `Use\
  \ cases` 依赖于 `domain`\n- `Adapters` 依赖 `use cases`（实现接口）\n- `Config` 依赖 `use cases`\
  \ + `adapters`（将它们连接在一起）\n- **绝不要**：`use case` 依赖 `adapter`\n\n### 5. 适配器隔离 (Adapter\
  \ Isolation)\n所有的 I/O 操作都存在 `adapters` 中。框架切换（`Spring` -> `Micronaut`）仅影响 `adapters`。\n\
  \n## 事项存放处\n\n| 类型 | 位置 | 理由 |\n| --- | --- | --- |\n| 用例接口 | `usecase.<name>` |\
  \ 功能的入口 |\n| 步骤接口 | `use case` | 用例合约的一部分 |\n| 错误 (密封类) | `usecase.<name>` | 特性特定的错误\
  \ |\n| 有效性 (Valid) | `usecase.<name>` | 校验 |\n| 共享对象 | `domain.shared` | 跨功能复用 |\n\
  | 控制器 | `adapter.rest` | HTTP 处理 |\n| 仓库 | `adapter.persistence` | 数据库访问 |\n| 配置\
  \ | `config` | Bean 组装 |\n\n## 核心收获\n1. **垂直切片**：每个用例都是自包含的\n2. **移动到共享层**：不要过早这么做\n\
  3. **框架位于边缘**：用例中是纯业务业务逻辑\n4. **适配器实现接口**：清晰的合约\n5. **需要时模块化**：不要过早模块化\n\n## 练习题\n\
  参考 `附录 B` 的练习：\n- 练习 5.4：包组织\n- 练习 6.2：模块设置\n\n## 接下来\n`第 16 章：系统化应用` 将涵盖系统化应用——编写和审查\
  \ JBCT 代码的清单。\n\n# 第 16 章：系统化应用\n\n## 你将学到\n- 用于保持一致的 JBCT 应用的 8 个检查点\n- 供立即查询的快速表格\n\
  - 常见错误的违反违规模式\n- 新代码的应用顺序\n\n**前提条件**：`第 15 章：项目结构`\n\n## 检查点方法 (The Checkpoint\
  \ Approach)\nJBCT 应用通过**检查点**工作：即在编码过程中停顿并验证的特定时刻。每个检查点包含：\n- **触发器**：何时应用\n- **规则**：检查什么\n\
  - **修复**：如何纠正违规\n\n目标是通过系统化验证实现 100% 的合规，而不是英雄式的努力。\n\n## 检查点 1：编写 Lambda 之前\n**触发器**：正准备写\
  \ `->`\n\n### 待检查规则\n| 规则 | 检查 | 修复 |\n| --- | --- | --- |\n| L1 | 是否可以使用方法引用？ |\
  \ 使用 `Type::method` |\n| L2 | Lambda 是否有 `{}`？ | 提取到命名方法 |\n| L3 | 内部是否有嵌套的单子操作？\
  \ | 提取内部操作 |\n| L4 | 控制流 (`if`/`switch`/`try`)？ | 提取到命名方法 |\n| L5 | 多个语句？ | 提取到命名方法\
  \ |\n\n### 允许的 Lambda 形式（详尽列表）\n```java\n// 方法引用（始终优先）\n.map(Email::new)\n.flatMap(this::validate)\n\
  \n// 单值表达式（无大括号）\n.map(value -> expression)\n.filter(s -> !s.isBlank())\n\n// 多值表达式（无大括号）\n\
  .map((a, b) -> new Pair(a, b))\n```\n\n### 提取模式\n```java\n// 之前（违规）\n.map(data ->\
  \ {\n    cache.put(key, data);\n    log.info(\"Cached: {}\", data);\n    return\
  \ data.size();\n})\n\n// 之后（合规）\n.map(this::cacheAndCount)\n\nprivate int cacheAndCount(Data\
  \ data) {\n    cache.put(key, data);\n    log.info(\"Cached: {}\", data);\n    return\
  \ data.size();\n}\n```\n\n***\n\n## 检查点 2：选择返回类型\n**触发器**：编写方法签名\n\n### 决策树\n```\n\
  此操作会失败吗？\n|-- NO：值可能缺失吗？\n|   |-- NO -> 返回 T\n|   |-- YES -> 返回 Option<T>\n|-- YES：是异步/IO\
  \ 吗？\n    |-- NO -> 返回 Result<T>\n    |-- YES -> 返回 Promise<T>\n```\n\n### 待检查规则\n\
  | 规则 | 检查 | 修复 |\n| --- | --- | --- |\n| R1 | Result 是否总是成功？ | 更改为 T |\n| R2 | Option\
  \ 是否总是存在？ | 更改为 T |\n| R3 | 使用了 `Promise<Result<T>>`？ | 仅使用 `Promise<T>` |\n| R4\
  \ | 返回 Void？ | 使用 Unit |\n| R5 | 返回 null？ | 使用 `Option<T>` |\n\n\n\n\n## 检查点 3：编写工厂方法\n\
  \n**触发条件**: 为类型创建构造逻辑\n\n### 检查规则\n\n| 规则 | 检查 | 修复 |\n\n| --- | --- | --- |\n\n\
  | F1 | 名称是否符合 `TypeName.typeName()`？ | 重命名 |\n| F2 | 验证是否在构造时发生？ | 移动到工厂方法 |\n|\
  \ F3 | 返回类型是否匹配验证需求？ | 应用检查点 2 |\n| F4 | 构造函数是否公开？ | 使工厂方法成为唯一入口 |\n\n### 模式\n\n\
  ```\n[](#cb266-1)public record Email(String value) {\n[](#cb266-2)    // 带有验证的工厂\
  \ -> Result<T>\n[](#cb266-3)    public static Result<Email> email(String raw) {\n\
  [](#cb266-4)        return Verify.ensure(raw, Verify.Is::notNull)\n[](#cb266-5)\
  \            .map(String::trim)\n[](#cb266-6)            .filter(INVALID_EMAIL,\
  \ s -> PATTERN.matcher(s).matches())\n[](#cb266-7)            .map(Email::new);\n\
  [](#cb266-8)    }\n[](#cb266-9)}\n[](#cb266-11)public record Config(DbUrl url, DbPassword\
  \ pass) {\n[](#cb266-12)    // 不带验证的工厂 -> T\n[](#cb266-13)    public static Config\
  \ config(DbUrl url, DbPassword pass) {\n[](#cb266-14)        return new Config(url,\
  \ pass);\n[](#cb266-15)    }\n[](#cb266-16)}\n```\n\n* * *\n\n## 检查点 4：设计类/接口\n\n\
  **触发条件**: 创建新类型\n\n### 检查规则\n\n| 规则 | 检查 | 修复 |\n\n| --- | --- | --- |\n\n| D1 |\
  \ 它属于哪个区域？ | 放在正确的包中 |\n| D2 | 是否将 I/O 与领域逻辑混在一起？ | 拆分为独立的类型 |\n| D3 | 是否使用原始类型表示领域概念？\
  \ | 提取值对象 |\n| D4 | 命名是否与区域匹配？ | 调整命名风格 |\n\n### 区域划分\n\n```\nZone A (入口层): Controllers,\
  \ handlers, main\n  -> 业务动作动词: handleRegistration(), processOrder()\n\nZone B (领域层):\
  \ 用例、值对象、领域服务\n  -> 领域词汇: Email.email(), ValidRequest.validRequest()\n\nZone C (基础设施层):\
  \ DB、外部 API、配置加载\n  -> 技术性名称: loadAllGenerations(), saveUser(), readFile()\n```\n\
  \n* * *\n\n## 检查点 5：编写单单链\n\n**触发条件**: 链式调用 `.map()/.flatMap()/.filter()` 等\n\n\
  ### 检查规则\n\n| 规则 | 检查 | 修复 |\n\n| --- | --- | --- |\n\n| M1 | 每个方法是否只有单一模式？ | 提取混合模式\
  \ |\n| M2 | 链长度是否 <= `5` 步？ | 拆分为组合方法 |\n| M3 | 副作用是否仅在终端操作中？ | 移动到 `.onSuccess()/.onFailure()`\
  \ |\n| M4 | 日志是否与逻辑混合？ | 将日志移动到适当的层 |\n\n### 模式分离\n\n```\n[](#cb268-1)// 违反：混合了顺序器(Sequencer)\
  \ + 并行(Fork-Join)\n[](#cb268-2)return validate(request)\n[](#cb268-3)    .flatMap(req\
  \ -> Result.all(\n[](#cb268-4)        checkInventory(req),\n[](#cb268-5)       \
  \ validatePayment(req)\n[](#cb268-6)    ).map((inv, pay) -> proceed(req)));\n[](#cb268-7)\n\
  [](#cb268-8)// 修复：提取并行合并\n[](#cb268-9)return validate(request)\n[](#cb268-10)  \
  \  .flatMap(this::validateOrder)\n[](#cb268-11)    .flatMap(this::processOrder);\n\
  [](#cb268-12)\n[](#cb268-13)private Result<ValidRequest> validateOrder(ValidRequest\
  \ req) {\n[](#cb268-14)    return Result.all(checkInventory(req), validatePayment(req))\n\
  [](#cb268-15)    .map((inv, pay) -> req);\n[](#cb268-16)}\n```\n\n* * *\n\n## 检查点\
  \ 6：添加日志\n\n**触发条件**: 添加日志语句\n\n### 检查规则\n\n| 规则 | 检查 | 修复 |\n\n| --- | --- | ---\
  \ |\n\n| G1 | 日志是否依赖数据？ | 移除条件 |\n| G2 | Logger 是否作为参数传递？ | 将日志移动到所有者处 |\n| G3 |\
  \ 是否在纯转换中记录日志？ | 移动到终端操作 |\n| G4 | 层层之间是否存在重复日志？ | 单层记录日志 |\n\n### 所有权模式\n\n```\n\
  [](#cb269-1)// 违反：调用者替被调用者记录\n[](#cb269-2)cache.refresh()\n[](#cb269-3)    .onSuccess(count\
  \ -> log.debug(\"Refreshed {}\", count));\n[](#cb269-4)\n[](#cb269-5)// 修复：缓存自身拥有自己的日志\n\
  [](#cb269-6)// 在 GenerationCache 中:\n[](#cb269-7)public Result<Integer> refresh()\
  \ {\n[](#cb269-8)    return doRefresh()\n[](#cb269-9)        .onSuccess(count ->\
  \ log.debug(\"Refreshed {}\", count));\n[](#cb269-10)}\n```\n\n* * *\n\n## 检查点 7：检查完整性\n\
  \n**触发条件**: 在提交代码进行评审前\n\n### 验证清单\n\n* * *\n\n## 检查点 8：实现模式\n\n**触发条件**: 选择实现风格\n\
  \n### 嵌套记录 vs Lambda 模式\n\n```\n实现是否需要参数之外的状态？\n|-- 是 -> 使用嵌套记录(nested record)模式\n\
  |-- 否: 是否是函数式接口？\n    |-- 是 -> 使用 lambda 模式\n    |-- 否 -> 使用嵌套记录模式\n```\n\n**嵌套记录模式**（需要状态时）：\n\
  \n```\n[](#cb271-1)static GenerationCache generationCache(WorkConfig config) {\n\
  [](#cb271-2)    record generationCache(\n[](#cb271-3)        AtomicReference<Instant>\
  \ lastRefreshTime,\n[](#cb271-4)        ConcurrentMap<String, Generation> cache\n\
  \    ) {}\n[](#cb271-5)    return new generationCache(\n        new AtomicReference<>(Instant.now()),\n\
  \        new ConcurrentHashMap<>()\n    );\n}\n```\n\n\n\n\n\n| 测试覆盖率 | 已存在某些测试\
  \ | 在重构前添加测试 |\n| :--- | :--- | :--- |\n| 团队规模 | 任意 | 较大的团队需要更多协作 |\n| 发布周期 | 定期发布\
  \ | 在重大变更前建立 |\n\n## 代码异味指标 (Code Smell Indicators)\n\n这些模式表明高价值迁移目标：\n\n```java\n\
  // 1. 验证逻辑散落在各层\n@PostMapping(\"/users\")\npublic ResponseEntity<?> createUser(@RequestBody\
  \ UserDto dto) {\n    if (dto.getEmail() == null || dto.getEmail().isEmpty()) {\n\
  \        return ResponseEntity.badRequest().body(\"Email required\");\n    }\n \
  \   if (!dto.getEmail().contains(\"@\")) {\n        return ResponseEntity.badRequest().body(\"\
  Invalid email\");\n    }\n    // ... 更多校验\n    userService.create(dto);  // Service\
  \ 层也在校验！\n}\n\n// 2. 处处是空检查\npublic Order processOrder(Order order) {\n    if (order\
  \ == null) return null;\n    if (order.getCustomer() == null) return null;\n   \
  \ if (order.getCustomer().getAddress() == null) {\n        throw new ValidationException(\"\
  Address required\");\n    }\n    // ... 实际逻辑被埋在空检查之下\n}\n\n// 3. 基于异常的控制流\npublic\
  \ User findUser(Long id) {\n    try {\n        return repository.findById(id)\n\
  \            .orElseThrow(() -> new UserNotFoundException(id));\n    } catch (DataAccessException\
  \ e) {\n        throw new ServiceException(\"Database error\", e);\n    }\n}\n\n\
  // 4. Service 中关注点混合\n@Service\npublic class UserService {\n    public User register(UserDto\
  \ dto) {\n        // 校验\n        validateEmail(dto.getEmail());\n        validatePassword(dto.getPassword());\n\
  \n        // 业务逻辑\n        if (userRepository.existsByEmail(dto.getEmail())) {\n\
  \            throw new EmailExistsException();\n        }\n\n        // 基础设施\n \
  \       String hashedPassword = passwordEncoder.encode(dto.getPassword());\n   \
  \     User user = new User(dto.getEmail(), hashedPassword);\n        return userRepository.save(user);\n\
  \    }\n}\n```\n\n## 迁移阶段 (Migration Phases)\n\n### 第一阶段：仅值对象（第 1-2 周）\n\n**目标：**\
  \ 在不改变现有代码结构的情况下，引入“解析而非校验”（parse-don’t-validate）。\n\n**做法：** 1. 添加 Pragmatica Lite\
  \ 依赖 2. 为经常校验的字段创建值对象 3. 在新代码中使用值对象 4. 逐渐替换现有代码中的基本类型\n\n**从这些值对象开始：**\n- Email\n\
  - Password\n- UserId / CustomerId / OrderId\n- Money / Currency\n- 手机号 \n\n**示例：添加\
  \ Email 值对象**\n\n```java\n// 新增：值对象\npublic record Email(String value) {\n    private\
  \ static final Pattern PATTERN = Pattern.compile(\"^[a-z0-9+_.-]+@[a-z0-9.-]+$\"\
  );\n    private static final Cause INVALID = Causes.cause(\"Invalid email format\"\
  );\n\n    public static Result<Email> email(String raw) {\n        return Verify.ensure(raw,\
  \ Verify.Is::notBlank)\n            .map(String::trim)\n            .map(String::toLowerCase)\n\
  \            .filter(INVALID, PATTERN.asMatch())\n            .map(Email::new);\n\
  \    }\n}\n\n// 现有：Service 方法（未更改）\n@Service\npublic class UserService {\n    public\
  \ User register(String email, String password) {\n        // 现有的校验\n        if (email\
  \ == null || !email.contains(\"@\")) {\n            throw new ValidationException(\"\
  Invalid email\");\n        }\n        // ... 其他部分\n    }\n}\n\n// 新增：使用值对象的并行方法\n\
  public Result<User> registerValidated(Email email, Password password) {\n    //\
  \ 不需要校验 - email 和 password 已经是有效的\n    return checkEmail(email)\n        .flatMap(e\
  \ -> hashPassword(password))\n        .map(hashed -> createUser(email, hashed));\n\
  }\n```\n\n**迁移模式：** 1. 创建值对象 2. 添加接收值对象的并行方法 3. 逐个更新调用者 4. 删除旧方法\n\n### 第二阶段：在新代码中使用\
  \ Result（第 3-4 周）\n\n**目标：** 停止添加基于异常的代码。\n\n**团队共识：**\n- 所有可能失败的操作的新方法返回 `Result<T>`\
  \ 或 `Promise<T>`\n- 新校验使用值对象\n- 异常仅存在于适配器边界（封装外部库）\n\n**示例：带有 Result 的新功能**\n\n\
  ```java\n// 新功能：应用优惠码\npublic interface ApplyDiscount {\n    Result<DiscountedPrice>\
  \ apply(OrderId orderId, DiscountCode code);\n}\n\n// 实现\npublic class ApplyDiscount\
  \ implements ApplyDiscount {\n    @Override\n    public Result<DiscountedPrice>\
  \ apply(OrderId orderId, DiscountCode code) {\n        return findOrder(orderId)\n\
  \            .flatMap(order -> validateCode(code, order))\n            .map(discount\
  \ -> calculateDiscountedPrice(order, discount));\n    }\n\n    private Result<Order>\
  \ findOrder(OrderId id) {\n        return Option.option(orderRepository.findById(id.value()))\n\
  \            .toResult(OrderError.NOT_FOUND);\n    }\n\n    private Result<Discount>\
  \ validateCode(DiscountCode code, Order order) {\n        return discountRepository.findByCode(code.value())\n\
  \            .toResult(DiscountError.INVALID_CODE)\n            .filter(DiscountError.EXPIRED,\
  \ d -> !d.isExpired())\n            .filter(DiscountError.MIN_ORDER, d -> order.total().isGreaterThan(d.minOrder()));\n\
  \    }\n}\n```\n\n**衔接旧新代码：**\n\n```java\n// Controller 桥接异常世界与 Result 世界\n@PostMapping(\"\
  /orders/{orderId}/discount\")\npublic ResponseEntity<?> applyDiscount(\n    @PathVariable\
  \ String orderId,\n    @RequestBody DiscountRequest request\n) {\n    return Result.all(\n\
  \        OrderId.orderId(orderId),\n        DiscountCode.discountCode(request.code())\n\
  \    )\n    .flatMap((oid, code) -> applyDiscount.apply(oid, code))\n    .fold(\n\
  \        cause -> toErrorResponse(cause),\n        price -> ResponseEntity.ok(price)\n\
  \    );\n}\n```\n\n### 第三阶段：提取用例（Use Cases）（第 5-8 周）\n\n**目标：** 将业务逻辑与框架代码分离。\n\n\
  **流程：** 1. 识别具有清晰业务逻辑的 Service 方法 2. 提取到用例接口 3. 将实现移动到用例工厂 4. 将 Service 转换为轻量适配器\n\
  \n**在此之前：胖 Service (Fat service)**\n\n\n\n\n\n```java\n@Service\npublic class OrderService\
  \ {\n    @Autowired private OrderRepository orderRepository;\n    @Autowired private\
  \ PaymentGateway paymentGateway;\n    @Autowired private NotificationService notificationService;\n\
  \n    @Transactional\n    public Order placeOrder(OrderDto dto) {\n        // 校验\n\
  \        if (dto.getItems().isEmpty()) {\n            throw new ValidationException(\"\
  Order must have items\");\n        }\n\n        // 检查库存\n        for (ItemDto item\
  \ : dto.getItems()) {\n            if (!inventoryService.hasStock(item.getProductId(),\
  \ item.getQuantity())) {\n                throw new InsufficientStockException(item.getProductId());\n\
  \            }\n        }\n\n        // 处理支付\n        PaymentResult payment;\n \
  \       try {\n            payment = paymentGateway.charge(dto.getPaymentMethod(),\
  \ calculateTotal(dto));\n        } catch (PaymentException e) {\n            throw\
  \ new OrderException(\"Payment failed\", e);\n        }\n\n        // 创建订单\n   \
  \     Order order = new Order(dto.getCustomerId(), dto.getItems(), payment.getTransactionId());\n\
  \        orderRepository.save(order);\n\n        // 发送通知 (尽力而为)\n        try {\n\
  \            notificationService.sendOrderConfirmation(order);\n        } catch\
  \ (Exception e) {\n            log.warn(\"Failed to send notification\", e);\n \
  \       }\n\n        return order;\n    }\n}\n```\n\n## 后：用例 + 瘦层服务\n\n```java\n\
  // 用例接口\npublic interface PlaceOrder {\n    Promise<OrderConfirmation> execute(OrderRequest\
  \ request);\n\n    interface CheckInventory {\n        Promise<ValidOrder> apply(ValidOrder\
  \ order);\n    }\n\n    interface ProcessPayment {\n        Promise<PaymentConfirmation>\
  \ apply(ValidOrder order);\n    }\n\n    interface SaveOrder {\n        Promise<OrderId>\
  \ apply(ValidOrder order, PaymentConfirmation payment);\n    }\n\n    interface\
  \ SendNotification {\n        Promise<Unit> apply(OrderId orderId);\n    }\n\n \
  \   static PlaceOrder placeOrder(\n        CheckInventory checkInventory,\n    \
  \    ProcessPayment processPayment,\n        SaveOrder saveOrder,\n        SendNotification\
  \ sendNotification\n    ) {\n        return request -> ValidOrder.validOrder(request)\n\
  \            .async()\n            .flatMap(checkInventory::apply)\n           \
  \ .flatMap(order -> processPayment.apply(order)\n                .map(payment ->\
  \ Pair.of(order, payment)))\n            .flatMap(pair -> saveOrder.apply(pair.first(),\
  \ pair.second()))\n            .onSuccess(orderId -> sendNotification.apply(orderId)\n\
  \                .onFailure(e -> { /* 记录但不 */ }))\n            .map(OrderConfirmation::new);\n\
  \    }\n}\n\n// 瘦层服务 (适配器)\n@Service\npublic class OrderService {\n    private final\
  \ PlaceOrder placeOrder;\n\n    public OrderService(\n        InventoryChecker inventoryChecker,\n\
  \        PaymentProcessor paymentProcessor,\n        JooqRepository orderRepository,\n\
  \        EmailNotification notificationSender\n    ) {\n        this.placeOrder\
  \ = PlaceOrder.placeOrder(\n            inventoryChecker,\n            paymentProcessor,\n\
  \            orderRepository,\n            notificationSender\n        );\n    }\n\
  \n    public Order placeOrder(OrderDto dto) {\n        return placeOrder.execute(toRequest(dto))\n\
  \            .await()\n            .fold(\n                cause -> { throw toException(cause);\
  \ },\n                confirmation -> toOrder(confirmation)\n            );\n  \
  \  }\n}\n```\n\n### 第 4 ：适配器隔离（第 9-12 周）\n\n**目标：** 将所有的 I/O 都通过 `Promise.lift`\
  \ 封装在适配器中。\n\n**识别适配器：**\n- 数据库存储库\n- HTTP 客户端\n- 消息队列生产者/消费者\n- 文件系统访问\n- 缓存客户端\n\
  \n**示例：存储库适配器**\n\n```java\n// 步骤接口\npublic interface SaveUser {\n    Promise<UserId>\
  \ apply(ValidUser user);\n}\n\n// 适配器实现\n@Repository\npublic class JooqUserRepository\
  \ implements SaveUser {\n    private final DSLContext dsl;\n\n    @Override\n  \
  \  public Promise<UserId> apply(ValidUser user) {\n        return Promise.lift(\n\
  \            RepositoryError::DatabaseFailure::new,\n            () -> {\n     \
  \           String id = dsl.insertInto(USERS)\n                    .set(USERS.EMAIL,\
  \ user.email().value())\n                    .set(USERS.PASSWORD_HASH, user.passwordHash().value())\n\
  \                    .returningResult(USERS.ID)\n                    .fetchSingle()\n\
  \                    .value1();\n                return new UserId(id);\n      \
  \      }\n        );\n    }\n}\n```\n\n***\n\n## 与 Java 标准库的互操作性\n\n### `Optional<T>`\
  \ → `Option<T>`\n\n```java\n// 直接转换\nOptional<User> javaOptional = repository.findById(id);\n\
  Option<User> option = Option.from(javaOptional);\n\n// 在适配器方法中\npublic Option<User>\
  \ findById(UserId id) {\n    return Option.from(jpaRepository.findById(id.value()));\n\
  }\n\n// 回到 Optional（为了框架集成）\nOptional<User> back = option.toOptional();\n```\n\n\
  ### `CompletableFuture<T>` → `Promise<T>`\n\n```java\n// 在适配器中封装 CompletableFuture\n\
  public Promise<User> fetchUser(UserId id) {\n    var promise = Promise.<User>promise();\n\
  \    CompletableFuture<User> cf = httpClient.getUser(id.value());\n    cf.whenComplete((result,\
  \ error) -> {\n        if (error != null) {\n            promise.fail(Causes.fromThrowable(error));\n\
  \        } else {\n            promise.succeed(result);\n        }\n    });\n  \
  \  return promise;\n}\n\n// 常见模式的辅助方法\npublic static <T> Promise<T> fromCompletableFuture(\n\
  \    CompletableFuture<T> cf,\n    Fn1<Cause, Throwable> errorMapper) {\n    var\
  \ promise = Promise.<T>promise();\n    cf.whenComplete((result, error) -> {\n  \
  \      if (error != null) {\n            promise.fail(errorMapper.apply(error));\n\
  \        } else {\n            promise.succeed(result);\n        }\n    });\n  \
  \  return promise;\n}\n```\n\n\n\n\n\n## 在适配器中 - 使用 `Promise.lift`：\n\n```java\n\
  public Promise<User> findUser(UserId id) {\n    return Promise.lift(\n        DatabaseError::new,\
  \  // 异常 → 原因\n        () -> jdbcTemplate.queryForObject(SQL, mapper, id.value())\n\
  \    );\n}\n```\n\n### 自定义异常映射：\n\n```java\npublic Promise<Payment> processPayment(PaymentRequest\
  \ request) {\n    return Promise.lift(\n        this::mapPaymentException,  // 自定义映射器\n\
  \        () -> paymentGateway.charge(request)\n    );\n}\n\nprivate Cause mapPaymentException(Throwable\
  \ t) {\n    return switch (t) {\n        case InsufficientFundsException e -> new\
  \ PaymentError.InsufficientFunds(e.getMessage());\n        case CardDeclinedException\
  \ e -> new PaymentError.CardDeclined(e.getMessage());\n        case NetworkException\
  \ e -> new PaymentError.ServiceUnavailable(e.getMessage());\n        default ->\
  \ Causes.fromThrowable(t);\n    };\n}\n```\n\n### 过渡适配器层\n\n在迁移期间，创建桥接旧新代码的适配器方法：\n\
  \n```java\n// Legacy 留服务（抛出异常）\npublic class LegacyUserService {\n    public User\
  \ findUser(String id) throws UserNotFoundException {\n        // ... 留实现\n    }\n\
  }\n\n// 封装旧服务的 JBCT 适配器\npublic class UserServiceAdapter implements FindUser {\n\
  \    private final LegacyUserService legacy;\n\n    @Override\n    public Promise<User>\
  \ apply(UserId id) {\n        return Promise.lift(\n            this::mapLegacyError,\n\
  \            () -> legacy.findUser(id.value())\n        );\n    }\n\n    private\
  \ Cause mapLegacyError(Throwable t) {\n        return switch (t) {\n           \
  \ case UserNotFoundException e -> UserError.NotFound.INSTANCE;\n            default\
  \ -> Causes.fromThrowable(t);\n        };\n    }\n}\n```\n\n**渐进式替换：**\n1. 创建封装遗留服务的适配器\n\
  2. 在新的 JBCT 代码中使用该适配器\n3. 最终用 JBCT 实现替换遗留服务\n4. 迁移完成后移除适配器\n\n* * *\n\n## 团队采用策略\n\
  \n### 策略 1：领头者引导\n\n由一名开发者成为 JBCT 专家，编写初始示例并审查他人的代码。\n\n**优点：** 启动快，模式一致。**缺点：**\
  \ 产生瓶颈，单点风险（Bus factor）。\n\n### 策略 2：新功能优先\n\n所有新功能都使用 JBCT。仅在触动现有代码时才迁移。\n\n**优点：**\
  \ 无需大规模重重构，自然引入。**缺点：** 代码库混合时间较长，存在上下文切换。\n\n### 策略 3：垂直切片\n\n选择一个用例，从控制器到数据库进行完全迁移。\n\
  \n**优点：** 提供完整的示例供学习，端到端证明价值。**缺点：** 初期投入大，可能后期才发现集成问题。\n\n### 建议\n\n结合使用策略：\n1.\
  \ 领头者编写第一个垂直切片（策略 3）\n2. 团队评审并从示例学习\n3. 所有新功能使用 JBCT（策略 2）\n4. 在触动现有代码时进行渐进式迁移\n\
  \n* * *\n\n## 常见阻力与应对\n\n### “这与我们熟悉的太不同了”\n\n**应对：** 这些模式比异常处理更简单。对比：\n\n```java\n\
  // 基于异常的（隐藏的控制流）\ntry {\n    User user = findUser(id);\n    if (user == null) throw\
  \ new UserNotFoundException(id);\n    Order order = createOrder(user, items);\n\
  \    if (!paymentService.charge(order)) {\n        throw new PaymentException(\"\
  Failed\");\n    }\n} catch (UserNotFoundException e) {\n    return handleNotFound(e);\n\
  } catch (PaymentException e) {\n    return handleFailed(e);\n} catch (Exception\
  \ e) {\n    return handleUnknown(e);\n}\n```\n\n\n\n```\n@RestController\npublic\
  \ class UserController {\n    @Autowired private UserService userService;\n\n  \
  \  @PostMapping(\"/users\")\n    public ResponseEntity<UserDto> createUser(@Valid\
  \ @RequestBody CreateUserDto dto) {\n        User user = userService.createUser(dto);\n\
  \        return ResponseEntity.ok(toDto(user));\n    }\n}\n\n@Service\npublic class\
  \ UserService {\n    @Autowired private UserRepository userRepository;\n    @Autowired\
  \ private PasswordEncoder passwordEncoder;\n\n    @Transactional\n    public User\
  \ createUser(CreateUserDto dto) {\n        if (userRepository.existsByEmail(dto.getEmail()))\
  \ {\n            throw new EmailExistsException();\n        }\n        User user\
  \ = new User();\n        user.setEmail(dto.getEmail());\n        user.setPassword(passwordEncoder.encode(dto.getPassword()));\n\
  \        return userRepository.save(user);\n    }\n}\n\n@Repository\npublic interface\
  \ UserRepository extends JpaRepository<User, Long> {\n    boolean existsByEmail(String\
  \ email);\n}\n```\n\n### JBCT 的变化\n\n| 维度 | 分层架构 (Layered) | JBCT |\n| --- | ---\
  \ | --- |\n| 错误处理 | 异常 (Exceptions) | 带原因的结果/Promise (Result/Promise) |\n| 校验 |\
  \ @Valid +手动检查 | 解析而非校验 (Parse-don’t-validate) |\n| 业务逻辑位置 | Service 层 | 用例接口 (Use\
  \ case interface) |\n| 数据流 | 可变实体 | 不可值对象 |\n| 依赖关系 | 字段注入 | 通过工厂进行构造函数注入 |\n\n\
  ### JBCT 保留的内容\n\n- 关注点分离（每层承担不同的职责）\n- 位于边界的 Controller\n- 用于数据访问的 Repository 模式\n\
  \n### 结论\n\nJBCT 是在完善分层架构，而非替代它。分层依然存在，但具有显式的错误处理和不可变的数据流。\n\n* *\n\n## 六角形架构（端口与适配器）\n\
  \n由 Alistair Cockburn 推广。核心思想：业务逻辑位于中心，适配器位于边缘。\n\n### 结构\n\n```\n ┌─────────────────────┐\n\
  \   HTTP 适配器 ───→│                     │←─── 数据库适配器\n                    │   领域\
  \ / 核心     │\n  队列适配器 ───→│   (业务逻辑)      │←─── 外部 API 适配器\n                   \
  \ │                     │\n                    └─────────────────────┘\n       \
  \                    ↑   ↑\n                        端口 (接口)\n```\n\n### 示例\n\n```java\n\
  // 端口（由领域接口）\npublic interface UserRepository {\n    Optional<User> findByEmail(Email\
  \ email);\n    void save(User user);\n}\n\n// 领域服务（纯业务逻辑）\npublic class UserRegistrationService\
  \ {\n    private final UserRepository userRepository;\n    private final PasswordHasher\
  \ passwordHasher;\n\n    public User register(Email email, Password password) {\n\
  \        if (userRepository.findByEmail(email).isPresent()) {\n            throw\
  \ new EmailAlreadyExistsException(email);\n        }\n        HashedPassword hashed\
  \ = passwordHasher.hash(password);\n        User user = new User(email, hashed);\n\
  \        userRepository.save(user);\n        return user;\n    }\n}\n\n// 适配器（实现端口）\n\
  public class JpaUserRepository implements UserRepository {\n    private final JpaUserEntityRepository\
  \ jpaRepo;\n}\n```\n（注：原文中关于 JpaUserRepository 的原始代码不完整或格式错误，我已根据上下文清理了结构。）\n\n\n\
  \nScott Wlaschin 在 F# 中采用的方法，使用“双轨道”类型来处理错误。\n\n## 概念\n\n```\nSuccess Track:  ───●───────●───────●───────●───\
  \ → Success\n                   │       │       │       │\n                   ↓\
  \       ↓       ↓       ↓\nFailure Track:  ───────────────────────────────→ Failure\n\
  ```\n\n每个函数要么留在成功轨道，要么切换到失败轨道。\n\n## 示例（Java 中的 F# 风格）\n\n```java\npublic Result<User>\
  \ registerUser(String email, String password) {\n    return validateEmail(email)\
  \           // 成功或失败\n        .flatMap(this::validatePassword)  // 继续或保持失败\n   \
  \     .flatMap(this::checkUniqueness)   // 继续或保持失败\n        .flatMap(this::createUser);\
  \       // 继续或保持失败\n}\n```\n\n## JBCT 借用了什么\n\n- **双轨道模型** → `Result<T>` 正是如此\n\
  - **用于组合的 flatMap** → 相同的链式调用风格\n- **错误即值** → 使用 `Cause` 替异常\n\n## JBCT 增加了什么\n\n\
  - **四轨道而非两轨道** - 用于不同语义的 `T`, `Option`, `Result`, `Promise`\n- **结构化模式** - 超链式调用的命名模式（`Sequencer`,\
  \ `Fork-Join`）\n- **聚合** - 用于并行验证的 `Result.all()`\n- **异步集成** - `Promise` 将模型扩展到异步操作\n\
  \n## 核心区别\n\nROP 是一种处理错误的技术。JBCT 是一套完整的方法论，包含了项目结构、测试和团队实践。\n\n## 结论\n\nJBCT 将 ROP\
  \ 作为其错误处理模型，并在此基础上构建了一套完整的方法论。\n\n***\n\n## vavr（曾名为 Javaslang）\n\n适用于 Java 的函数式编程库。\n\
  \n## vavr 提供了什么\n\n```java\nimport io.vavr.control.Try;\nimport io.vavr.control.Either;\n\
  import io.vavr.control.Option;\n\n// Try - 捕获异常\nTry<Integer> result = Try.of(()\
  \ -> Integer.parseInt(input));\n\n// Either - 带有类型错误的成功或失败\nEither<Error, User>\
  \ user = findUser(id);\n\n// Option - 存在或不存在\nOption<User> maybeUser = Option.of(nullableUser);\n\
  \n// 模式匹配\nString message = Match(result).of(\n    Case($Success($()), \"Parsed\"\
  ),\n    Case($Failure($()), \"Failed\")\n);\n```\n\n## 比较\n\n| 特性 | vavr | Pragmatica\
  \ Lite |\n| --- | --- | --- |\n| Option 类型 | `Option<T>` | `Option<T>` |\n| 错误类型\
  \ | `Either<L, R>` 或 `Try<T>` | 带有 `Cause` 的 `Result<T>` |\n| 异步类型 | 无（使用 `CompletableFuture`）\
  \ | `Promise<T>` |\n| 集合 | 不变集合 | 使用 Java 集合 |\n| 模式匹配 | 内置 DSL | 标准 switch 表达式\
  \ |\n| 元组 | `Tuple1-8` | 使用 records |\n\n## 核心区别\n\n1. **vavr 是库，JBCT 是方法论** - vavr\
  \ 提供类型，JBCT 提供模式、结构和实践。\n2. **错误类型化** - vavr 的 `Either` 具有泛型左侧类型。Pragmatica Lite\
  \ 的 `Result` 始终使用 `Cause`，提供了一致的错误处理。\n3. **异步故事** - vavr 不提供异步原语。JBCT 的 `Promise`\
  \ 将错误处理与异步操作集成。\n4. **简单性** - vavr 包含许多 FP 特性（持久化集合、模式匹配 DSL、流）。Pragmatica Lite\
  \ 专注于 JBCT 所需的最小功能。\n\n## 何时使用 vavr\n\n- 你需要不可变集合\n- 你正在构建带有 FP 模式的库\n- 你需要持久化数据结构\n\
  - 你想要模式匹配 DSL\n\n## 何时使用 Pragmatica Lite\n\n- 你正在构建后端服务\n- 你想要一套完整的方法论（而不仅仅是类型）\n\
  - 你需要集成的异步支持\n- 你更倾向于简单而非功能\n\n## 结论\n\nvavr 是一个更全面的 FP 库。Pragmatica Lite 是为 JBCT\
  \ 量身定制的。你可以使用 vavr 实现 JBCT 模式，但你需要添加自己的 `Promise` 类型并建立自己的自己的结构化模式。\n\n***\n\n##\
  \ Arrow-kt (Kotlin)\n\n适用于 Kotlin 的函数式编程库。\n\n## Arrow 提供了什么\n\n```kotlin\n// Either\
  \ 用于错误\nfun divide(a: Int, b: Int): Either<DivisionError, Int> =\n    if (b == 0)\
  \ DivisionError.DivideByZero.left()\n    else (a / b).right()\n``````kotlin\n//\
  \ Validated 用于累积错误\nfun validateUser(name: String, age: Int): ValidatedNel<ValidationError,\
  \ User> =\n    ValidatedNel.applicative<ValidationError>().mapN(\n        validateName(name),\n\
  \        validateAge(age)\n    ) { (n, a) -> User(n, a) }\n```\n\n```kotlin\n//\
  \ Effect 用于异步\nsuspend fun fetchUser(id: UserId): Either<Error, User> =\n    either\
  \ { userRepository.findById(id).bind() }\n```\n\n## 为什么要提到它？\n\nArrow-kt 证明了这些模式在\
  \ Kotlin 中运行良好。\n\n- **Either** = 类似于 `Promise<T>`\n- **Validated** = 类似于 `Result.all()`\n\
  - **类型化错误** = 等于 `Cause`\n\n结论\n\n如果你使用 Kotlin，Arrow-kt 提供了类似的能力。由于语言特性（协程、密封类），语法上有所不同。\n\
  \n***\n\n## 总结：JBCT 的位置\n\n```\n 架构风格\n                           │\n        ┌──────────────────┼──────────────────\n\
  \        │                  │                  │\n    Layered           Hexagonal\
  \           Clean\n        │                  │                  │\n        └──────────────────┼──────────────────\n\
  \                           │\n                    实现风格\n                      \
  \     │\n        ┌──────────────────┼──────────────────\n        │             \
  \     │                  │\n    Imperative        Railway (ROP)         FP Library\n\
  \   (exceptions)      (Result types)        (vavr, Arrow)\n        │           \
  \       │                  │\n        └──────────────────┼──────────────────\n \
  \                          │\n                         JBCT\n                  \
  \         │\n                    ┌──────┴------\n                    │         \
  \    │\n              Pragmatica     Structural\n              Lite      Patterns\n\
  ```\n\nJBCT: - 适用于任何架构风格（分层、六边形、清洁） - 使用轨道式错误处理 - 比 FP 库简单 - 提供其他方法缺乏的结构化模式\n\n\
  ## 练习\n\n1. **映射你的架构**：你当前项目使用了什么架构？使用 ROP 风格和 `Result` 重构它。哪些错误是隐式的？\n2. **比较错误处理**：从代码库中取一个基于异常的方法。使用\
  \ JBCT 类型重写它。\n3. **跨语言模式**：如果你有 Kotlin 服务，比较 Arrow-kt 的 `Either` 与 JBCT 的 `Result`。模式相似吗？\n\
  \n## 总结\n\nJBCT 并不是革新性的——它整合了经过验证的想法：\n\n| 想法 | 来源 |\n| --- | --- |\n| 端口与适配器 |\
  \ 六边形架构 |\n| 用例作为一等公民 | 清洁架构 |\n| 错误即值 | 轨道式错误编程 |\n| 函数式类型 | vavr, Arrow-kt, Haskell\
  \ |\n| 解析而非验证 | 类型驱动设计 |\n\nJBCT 增加了：- **统一的方法论** - 架构 + 实现 + 测试 - **结构化模式** - 命名的、组合的模式\
  \ - **团队实践** - 迁移路径、代码审查指南 - **AI 优化** - 用于 AI 协作的可预测代码\n\n目标不是原创性——而是统一性。\n\n#\
  \ 第 19 章：故障排除与常见问题\n\n本章连接了常见问题、调试技术以及关于 JBCT 的常见问题。\n\n\n\n\n## 调试单子链 (Monadic\
  \ Chains)\n\n### 问题：“我看不见 flatMap 内部发生了什么”\n\n**症状：** 你有像这样的链式调用，但不知道哪里失败了：\n\n\
  ```\nreturn validateRequest(request)\n    .flatMap(this::checkPermissions)\n   \
  \ .flatMap(this::processData)\n    .flatMap(this::saveResult);\n```\n\n**解决方案 1：添加中间日志**\n\
  \n```\nreturn validateRequest(request)\n    .onSuccess(r -> log.debug(\"Validated:\
  \ {}\", r))\n    .onFailure(c -> log.debug(\"Validation failed: {}\", c.message()))\n\
  \    .flatMap(this::checkPermissions)\n    .onSuccess(r -> log.debug(\"Permissions\
  \ OK: {}\", r))\n    .onFailure(c -> log.debug(\"Permission denied: {}\", c.message()))\n\
  \    .flatMap(this::processData)\n    // ...\n```\n\n**解决方案 2：使用 IDE 断断点**\n\n在\
  \ lambda 表达式内部设置断点：\n\n```\n.flatMap(data -> {\n    return processData(data);  //\
  \ 在此行设置断点\n})\n```\n\n**解决方案 3：提取到具名方法**\n\n```\nreturn validateRequest(request)\n\
  \    .flatMap(this::checkPermissionsStep)  // 在方法中设置断点\n    .flatMap(this::processDataStep)\n\
  \    .flatMap(this::saveResultStep);\n\nprivate Result<Permissions> checkPermissionsStep(ValidRequest\
  \ request) {\n    // 在此处设置断点，完全可见\n    return checkPermissions(request);\n}\n```\n\
  \n### 问题：“我的 Promise 永远不 resolve”\n\n**症状：** 测试卡在 `.await()` 处，或者生产代码超时。\n\n**检查清单：**\n\
  \n1.  **Promise 是否创建了但从未 resolve？**\n\n```\nPromise<User> promise = Promise.promise();\
  \  // 未解析！\n// 缺少：promise.succeed(user) 或 promise.fail(cause)\n```\n\n2.  **异步代码中是否存在死锁？**\n\
  \n```\n// 错误：在异步链中进行阻塞\n.flatMap(data -> {\n    return otherPromise.await().async();\
  \  // 阻塞了线程！\n})\n\n// 正确：不阻塞的链式调用\n.flatMap(data -> otherPromise)\n```\n\n3.  **Promise.lift\
  \ 是否包装了阻塞代码？**\n\n```\n// 这会异步运行 - 确保线程池没有被耗尽\nPromise.lift(() -> {\n    Thread.sleep(10000);\
  \  // 阻塞了线程\n    return result;\n});\n```\n\n**调试技巧：** 添加超时以隔离问题：\n\n```\npromise\n\
  \    .timeout(TimeSpan.timeSpan(5).seconds())\n    .await()\n    .onFailure(cause\
  \ -> log.error(\"Timed out or failed: {}\", cause));\n```\n\n### 问题：“得到了 CompositeCause\
  \ 但不知道哪些校验失败了”\n\n**症状：** `Result.all()` 失败了，但你只看到“Multiple failures”（多次失败）。\n\n\
  **解决方案：** 检查 `CompositeCause`：\n\n```\nresult.onFailure(cause -> {\n    if (cause\
  \ instanceof CompositeCause composite) {\n        composite.causes().forEach(c ->\n\
  \            log.error(\"Validation failure: {}\", c.message())\n        );\n  \
  \  } else {\n        log.error(\"Single failure: {}\", cause.message());\n    }\n\
  });\n```\n\n**更好的解决方案：** 在值对象中创建特定的错误消息：\n\n```java\npublic record Email(String\
  \ value) {\n    private static final Fn1<Cause, String> INVALID =\n        Causes.forOneValue(\"\
  Invalid email format: %s\");\n\n    public static Result<Email> email(String raw)\
  \ {\n        return Verify.ensure(raw, Verify.Is::notBlank)\n            .filter(INVALID,\
  \ PATTERN.asMatchPredicate())\n            .map(Email::new);\n    }\n}\n```\n\n\
  现在 `CompositeCause` 包含“Invalid email format: xyz”而不是通用的消息。\n\n* * *\n\n## 常见错误与修复\n\
  \n### 错误：嵌套的 Result/Promise\n\n```java\n// 错误：返回 Result<Result<User>>\npublic Result<Result<User>>\
  \ findUser(String id) {\n    return UserId.userId(id)\n        .map(this::lookupUser);\
  \  // lookupUser 返回 Result<User>\n}\n```\n\n**修复：** 使用 `flatMap` 代替 `map`：\n\n```java\n\
  // 正确：返回 Result<User>\npublic Result<User> findUser(String id) {\n    return UserId.userId(id)\n\
  \        .flatMap(this::lookupUser);\n}\n```\n\n### 错误：忽略 Result\n\n```java\n//\
  \ 错误：创建了 Result 但从未被使用\npublic void processOrder(Order order) {\n    validateOrder(order);\
  \  // 返回 Result<ValidOrder> 但被忽略了！\n    saveOrder(order);\n}\n```\n\n**修复：** 始终处理\
  \ `Result`：\n\n```java\n// 正确：Result 流转\npublic Result<OrderId> processOrder(Order\
  \ order) {\n    return validateOrder(order)\n        .flatMap(this::saveOrder);\n\
  }\n```\n\n### 错误：在单子链中抛出异常\n\n```java\n// 错误：异常破坏了链式\n.flatMap(data -> {\n    if\
  \ (data.isEmpty()) {\n        throw new IllegalStateException(\"Empty data\"); \
  \ // 逃逸了！\n    }\n    return process(data);\n})\n```\n\n**修复：** 改为返回失败：\n\n```java\n\
  // 正确：错误保持在链中\n.flatMap(data -> {\n    if (data.isEmpty()) {\n        // 在此处返回失败的逻辑\n\
  \    }\n    return process(data);\n})\n```\n*(注：原文中提供的修复文本不完整，我保留了其逻辑结构)*。\n\n###\
  \ 错误：多语句 lambda\n\n```java\n// 错误：违反了单层级原则\n.flatMap(user -> {\n    log.info(\"\
  Processing user: {}\", user.id());\n    String normalized = user.email().toLowerCase();\n\
  \    cache.put(user.id(), normalized);\n    return new ProcessedUser(user.id(),\
  \ normalized);\n})\n```\n\n**修复：** 提取到具名方法：\n\n```java\n// 正确：方法中的简单 lambda\n.flatMap(this::processUser)\n\
  \nprivate ProcessedUser processUser(User user) {\n    log.info(\"Processing user:\
  \ {}\", user.id());\n    String normalized = user.email().toLowerCase();\n    cache.put(user.id(),\
  \ normalized);\n    return new ProcessedUser(user.id(), normalized);\n}\n```\n\n\
  ### 错误：使用 Optional 代替 Option\n\n```java\n// 错误：将 Java Optional 与 Result 类型混合\npublic\
  \ Result<User> findUser(String id) {\n    Optional<User> optional = repository.findById(id);\n\
  \    if (optional.isPresent()) {\n        return Result.success(optional.get());\n\
  \    }\n    return USER_NOT_FOUND.result();\n}\n```\n\n**修复：** 在边界处转换：\n\n```java\n\
  // 正确：立即包装\npublic Result<User> findUser(String id) {\n    return Option.option(repository.findById(id).orElse(null))\n\
  \        .toResult(USER_NOT_FOUND);\n}\n\n// 或者：使用 Option.from()\npublic Result<User>\
  \ findUser(String id) {\n    return Option.from(repository.findById(id))\n     \
  \   .toResult(USER_NOT_FOUND);\n}\n```\n\n### 错误：绕过工厂方法\n\n```java\n// 错误：直接调用构造函数\n\
  Email email = new Email(\"user@example.com\");  // 跳过了校验！\n\n// 正确：使用工厂方法\nResult<Email>\
  \ email = Email.email(\"user@example.com\");\n```\n\n\n\n\n\n- `Settings` → `Editor`\
  \ → `Inlay Hints` → `Java` → `Parameter hints`\n- Enable `Show hints for lambdas`\n\
  \n2. **折叠匿名类：**\n- `Settings` → `Editor` → `General` → `Code Folding`\n- Enable\
  \ `Lambda expressions`\n\n3. **针对 JBCT 模式的 Live templates：**\n\n```\n// Template:\
  \ jbctvo (Value Object)\npublic record $NAME$($TYPE$ value) {\n    private static\
  \ final Cause INVALID = Causes.cause(\"Invalid $NAME$\");\n\n    public static Result<$NAME$>\
  \ $FACTORY$(String raw) {\n        return Verify.ensure(raw, Verify.Is::notBlank)\n\
  \            .map($NAME$::new);\n    }\n}\n\n// Template: jbctuc (Use Case)\npublic\
  \ interface $NAME$ {\n    Promise<Response> execute(Request request);\n\n    record\
  \ Request($PARAMS$) {}\n    record Response($RESULT$) {}\n\n    static $NAME$ $FACTORY$($DEPS$)\
  \ {\n        return request -> ValidRequest.validRequest(request)\n            .async()\n\
  \            .flatMap($STEPS$);\n    }\n}\n```\n\n### VS Code\n\n**推荐扩展：** `Extension\
  \ Pack for Java`, `Java Test Runner`\n\n**settings.json:**\n\n```json\n{\n    \"\
  java.completion.chain.enabled\": true,\n    \"java.completion.filteredTypes\": [\n\
  \        \"java.util.Optional\"  // Suggest Option instead\n    ]\n}\n```\n\n***\n\
  \n## 测试故障排除\n\n### 问题：“测试通过了，但本该失败”\n\n**症状：** 你预期会失败，但测试静默通过了。\n\n```java\n@Test\n\
  void shouldFail() {\n    Email.email(\"invalid\");  // 返回 Result，但测试没有检查它！\n}\n\
  ```\n\n**修复：** 始终进行断言（assert）：\n\n```java\n@Test\nvoid email_fails_for_InvalidInput()\
  \ {\n    Email.email(\"invalid\")\n        .onSuccess(Assertions::fail);  // 如果意外成功则失败\n\
  }\n```\n\n### 问题：“异步测试是不稳定的（flaky）” \n\n**症状：** 测试有时通过，有时失败。\n\n**检查清单：**\n\n1.\
  \ **你正在等待 Promise 吗？**\n\n```java\n// 错误：测试在 Promise 解析完成之前就结束了\n@Test\nvoid asyncTest()\
  \ {\n    useCase.execute(request);  // 返回 Promise，但未等待！\n}\n\n// 正确：在断言之前等待\n@Test\n\
  void asyncTest() {\n    useCase.execute(request)\n        .await()\n        .onFailure(Assertions::fail);\n\
  }\n```\n\n2. **测试之间是否存在共享的可变状态？**\n\n```java\n// 错误：共享状态\nprivate static List<String>\
  \ logs = new ArrayList<>();\n\n// 正确：每个测试独立的状态\nprivate List<String> logs;\n\n@BeforeEach\n\
  void setup() {\n    logs = new ArrayList<>();\n}\n```\n\n3. **Promise 超时设置是否太短？**\n\
  \n```java\n// 为 CI 环境增加超时时间\n.await(TimeSpan.timeSpan(30).seconds())\n```\n\n###\
  \ 问题：“无法为步骤接口创建存根（stub）”\n\n**症状：** 创建 lambda 存根时编译错误。\n\n```java\n// 错误：目标类型必须是函数接口\n\
  var stub = req -> Promise.success(req);  // 这是什么类型？\n```\n\n**修复：** 显式声明类型：\n\n\
  ```java\n// 正确：类型声明\nCheckEmail checkEmail = req -> Promise.success(req);\n```\n\
  \n***\n\n## 常见问题 (FAQ)\n\n### 一般\n\n**Q：JBCT 仅用于微服务吗？**\n\nA：不是。`JBCT` 适用于任何后端 Java\
  \ 应用——单体、微服务、无服务器函数。这些模式关注的是代码组织，而不是部署拓扑。\n\n**Q：JBCT 需要 Spring Boot 吗？**\n\nA：不需要。`JBCT`\
  \ 与框架无关。示例使用 Spring Boot 是因为它很常见，但这些模式适用于 `Micronaut`、`Quarkus`、原生 Java 或任何其他框架。\n\
  \n**Q：我可以在 Kotlin 中使用 JBCT 吗？**\n\nA：可以，但考虑使用 `Arrow-kt`。Kotlin 的协程和扩展函数提供了更地道的替代方案。这些概念可以直接迁移。\n\
  \n**Q：响应式流（Project Reactor, RxJava）如何处理？**\n\nA：`JBCT` 的 `Promise` 比响应式流更简单。当你需要背压（backpressure）或复杂的流操作时使用响应式流。对于简单的异步请求/响应模式，使用\
  \ `Promise`。\n\n### 错误处理\n\n**Q：什么时候该用异常代替 Result？**\n\nA：在以下情况使用异常：\n- 编程错误（`IllegalArgumentException`,\
  \ `NullPointerException`）\n- 不可恢复的系统故障\n- 框架要求（Spring 的 `@Transactional` 回滚）\n\n\
  在以下情况使用 `Result`：\n- 业务失败（验证、未找到、冲突）\n- 预期的错误状况\n- 调用用者可能想要处理任何情况\n\n**Q：我如何处理来自第三方库抛出的错误？**\n\
  \n在适配器边界进行封装：\n\n```java\npublic Promise<User> findUser(UserId id) {\n    return\
  \ Promise.lift(\n        DatabaseError::new,\n        () -> jdbcTemplate.queryForObject(sql,\
  \ mapper, id.value())\n    );\n}\n```\n\n**Q：是否每个方法都应该返回 Result 吗？**\n\nA：不是。不会失败的纯函数应该直接返回\
  \ `T`：\n\n```java\n// 返回 T - 纯计算，不会失败\npublic Money calculateTotal(List<LineItem>\
  \ items) {\n    return items.stream()\n        .map(LineItem::subtotal)\n      \
  \  .reduce(Money.ZERO, Money::add);\n}\n\n// 返回 Result<T> - 验证可能会失败\npublic Result<Money>\
  \ parseAmount(String raw) {\n    return Money.money(raw);\n}\n```\n\n### 性能\n\n\
  **Q：将一切封装在 Result/Promise 中会有开销吗？**\n\nA：微乎其微。这些类型是轻量封装。开销与 `Optional` 相当。对于典型的\
  \ Web 应用，与 I/O 延迟相比，这可以忽略不计。\n\n**Q：Lambda 比方法慢吗？**\n\nA：不会。`JVM` 会内联简单的 lambda。对于典型用例，性能没有显著差异。\n\
  \n**Q：创建许多小对象（值对象）会影响 GC 吗？**\n\nA：现代 JVM 高效处理短命对象。值对象通常很小且寿命短。如果性能分析显示 GC 压力，问题通常在其他地方。\n\
  \n## 测试\n\n**Q：我应该分开测试值对象的验证和用例吗？**\n\nA：是的。值对象为每个验证规则编写单元测试。用例则通过带有存根的步骤进行集成测试。\n\
  \n**Q：一个用例应该有多少个测试？**\n\n至少：\n- 1 个用例的顺畅路径（happy path）测试\n- 每个步骤失败一个测试\n- `ValidRequest`\
  \ 中的每条验证规则一个测试\n\n**Q：我应该使用 Mocks 还是 Stubs？**\n\nA：优先使用 Stubs（简单的 lambda 实现）。Mocks\
  \ 会增加复杂度。`JBCT` 的函数式风格使存根化变得简单。\n\n### 架构\n\n**Q：DTO 放在哪里？**\n\nA：在适配器边界：\n- 控制器中的\
  \ Request DTO（立即转换为领域类型）\n- 来自用例 `Response` 记录的 Response DTO\n- 领域层没有 DTO\n\n**Q：用例可以调用其他用例吗？**\n\
  \nA：通常不能。如果用例 A 需要用例 B 的功能，请将该功能提取到共享的步骤接口中。\n\n**Q：我如何处理事务？**\n\nA：在适配器层：\n\n```java\n\
  @Repository\npublic class JooqOrderRepository implements SaveOrder {\n    @Transactional\n\
  \    @Override\n    public Promise<OrderId> apply(ValidOrder order) {\n        return\
  \ Promise.lift(\n            DatabaseError::new,\n            () -> saveInTransaction(order)\n\
  \        );\n    }\n}\n```\n\n***\n\n## 错误信息参考\n\n### “无法推断函数接口类型”\n\n**原因：** Lambda\
  \ 目标类型存在义。\n\n**修复：** 添加显式类型声明：\n\n```java\nCheckEmail checkEmail = req -> Promise.success(req);\n\
  ```\n\n### “类型不兼容：Result<X> 无法转换为 Result<Y>”\n\n**原因：** 在需要 `flatMap` 的地方使用了 `map`。\n\
  \n\n\n\n## **修复：** 检查映射函数是否返回 `Result`。如果是，请使用 `flatMap`：\n\n```\n[](#cb331-1)//\
  \ 错误：validate 返回 Result<ValidEmail>\n[](#cb331-2).map(this::validate)  // 导致 Result<Result<ValidEmail>>\n\
  [](#cb331-3)\n[](#cb331-4)// 正确\n[](#cb331-5).flatMap(this::validate)  // 导致 Result<ValidEmail>\n\
  ```\n\n### “不存在类型变量(s) T”\n\n**原因：** 类型推断失败，通常发生于 `Cause.result()` 或 `Cause.promise()`\
  \ 中。\n\n**修复：** 添加类型见证（type witness）或赋值给带类型的变量：\n\n```\n[](#cb332-1)// 选项 1：类型见证\n\
  [](#cb332-2)return ERROR.<User>result();\n[](#cb332-3)\n[](#cb332-4)// 选项 2：赋值给变量\n\
  [](#cb332-5)Result<User> failure = ERROR.result();\n[](#cb332-6)return failure;\n\
  ```\n\n### “Promise.await() 永久阻塞”\n\n**原因：** `Promise` 永远没有解析。\n\n**修复：** 确保所有代码路径都解析了\
  \ `Promise`：\n\n```\n[](#cb333-1)Promise<User> promise = Promise.promise();\n[](#cb333-2)\n\
  [](#cb333-3)// 确保成功和失败路径都解析\n[](#cb333-4)if (condition) {\n[](#cb333-5)    promise.succeed(user);\n\
  [](#cb333-6)} else {\n[](#cb333-7)    promise.fail(cause);  // 别忘记这个！\n[](#cb333-8)}\n\
  ```\n\n***\n\n## 总结\n\n在调试 JBCT 代码时：\n\n1. **在链节点处添加日志** - 使用 `onSuccess`/`onFailure`\
  \ 提高可见性\n2. **提取到命名方法** - 更易于设置断点和查看堆栈跟踪\n3. **检查常见错误** - 嵌套的结果、被忽略的返回值、抛出的异常\n\
  4. **使用显式类型** - 帮助 IDE 和编译器捕获错误\n5. **测试成功和失败情况** - 始终对 `Result`/`Promise` 进行断言\n\
  \n函数式风格最初可能感到陌生，但一旦内化这些模式，调试就会变得更容易。显式的错误处理意味着运行时惊喜更少。\n\n# 附录 A：Pragmatica Lite\
  \ Core API 参考\n\n## 库信息\n\n**Maven:**\n\n```\n[](#cb334-1)<dependency>\n[](#cb334-2)\
  \   <groupId>org.pragmatica-lite</groupId>\n[](#cb334-3)   <artifactId>core</artifactId>\n\
  [](#cb334-4)   <version>0.9.9</version>\n[](#cb334-5)</dependency>\n```\n\n**Gradle:**\n\
  \n```\n[](#cb335-1)implementation 'org.pragmatica-lite:core:0.9.9'\n```\n\n**文档：**\
  \ https://central.sonatype.com/artifact/org.pragmatica-lite/core\n\n***\n\n## 类型转换\n\
  \n### Option 转换\n\n| 从 | 到 | 方法 |\n| --- | --- | --- |\n| `Option<T>` | `Result<T>`\
  \ | `.toResult(Cause cause)` 或 `.await(Cause cause)` |\n| `Option<T>` | `Result<T>`\
  \ | `.toResult()` (使用 `CoreError.emptyOption`) |\n| `Option<T>` | `Promise<T>` |\
  \ `.async(Cause cause)` |\n| `Option<T>` | `Promise<T>` | `.async()` (使用 `CoreError.emptyOption`)\
  \ |\n| `Option<T>` | `Optional<T>` | `.toOptional()` |\n\n### Result 转换\n\n| 从 |\
  \ 到 | 方法 |\n| --- | --- | --- |\n| `Result<T>` | `Option<T>` | `.option()` (丢失错误)\
  \ |\n| `Result<T>` | `Promise<T>` | `.async()` |\n\n### Promise 转换\n\n| 从 | 到 |\
  \ 方法 |\n| --- | --- | --- |\n| `Promise<T>` | `Promise<T>` | `.async()` (恒等) |\n\
  | `Promise<T>` | `Result<T>` | `.await()` (阻塞) |\n| `Promise<T>` | `Result<T>` |\
  \ `.await(TimeSpan timeout)` |\n\n### Cause 转换\n\n| 从 | 到 | 方法 |\n| --- | --- |\
  \ --- |\n| `Cause` | `Result<T>` | `.result()` |\n| `Cause` | `Promise<T>` | `.promise()`\
  \ |\n\n***\n\n### 创建实例\n\n### Option\n\n```\n[](#cb336-1)Option.some(value)    \
  \       // 创建有值的 option\n[](#cb336-2)Option.present(value)        // some() 的别名\n\
  [](#cb336-3)Option.none()                // 创建空的 option\n[](#cb336-4)Option.empty()\
  \               // none() 的别名\n[](#cb336-5)Option.option(nullable)      // null\
  \ -> none, value -> some\n[](#cb336-6)Option.from(Optional<T>)     // 转换 Java Optional\n\
  ```\n\n### Result\n\n```\n[](#cb337-1)Result.success(value)        // 创建成功\n[](#cb337-2)Result.ok(value)\
  \             // success() 的别名\n[](#cb337-3)Result.unitResult()          // 带有 Unit\
  \ 值的成功\n[](#cb337-4)Result.failure(cause)        // 创建失败 (优先使用 cause.result())\n\
  [](#cb337-5)Result.err(cause)            // failure() 的别名\n```\n\n### Promise\n\n\
  ```\n[](#cb338-1)Promise.success(value)                   // 解析的成功\n[](#cb338-2)Promise.ok(value)\
  \                        // success() 的别名\n[](#cb338-3)Promise.unitPromise()   \
  \                 // 使用 Unit 解析\n[](#cb338-4)Promise.failure(cause)            \
  \       // 解析失败 (优先使用 cause.promise())\n[](#cb338-5)Promise.resolved(Result<T> result)\
  \       // 从 result 解析\n[](#cb338-6)Promise.promise()                        //\
  \ 未解析的 promise\n[](#cb338-7)Promise.promise(Consumer<Promise<T>>)    // 未解析，异步运行\
  \ consumer\n[](#cb338-8)Promise.promise(Supplier<Result<T>>)     // 异步执行 supplier\n\
  ```\n\n***\n\n## 异常处理 (lift 方法)\n\n### Result.lift\n\n```\n[](#cb339-1)// 基础 lift\n\
  [](#cb339-2)Result.lift(ThrowingFn<U> supplier)\n[](#cb339-3)Result.lift(ThrowingFn<Cause,\
  \ Throwable> mapper, supplier)\n[](#cb339-4)Result.lift(ThrowingRunnable runnable)\
  \  // 返回 Result<Unit>\n[](#cb339-5)Result.lift(Cause, ThrowingFn<U> supplier)  //\
