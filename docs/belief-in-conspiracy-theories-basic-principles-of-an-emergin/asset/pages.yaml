  md: 'narcissism coupled with low-esteem, powerlessness, low political knowledge,
    interpersonal and political distrust, disagreeableness, paranoid cognitions and
    sinister attributions, and superstitious ideation—particularly when adopting perspectives
    satisfies important psychological and ideological needs for order, certainty,
    and control (Berinsky, 2012; Cichocka, Marchlewska, & Golec de Zavala, 2015; Imhoff
    & Laattery, 2017; Jost, Federico, & Napier, 2009; Miller, Saunders, & Farhart,
    2016; Lantian, Muller, & Douglas, 2017; Sunstein 2014; Swami & Coles 2010; van
    Proijen, Krouwel, & Pollet, 2015; for a review, see Douglas, Sutton, & Cichocka,
    2017).


    Thus, conspiracious ideation can provide an intuitively plausible, internally
    consistent, and personally meaningful explanation for the causes of complex, consequential
    phenomena that reduce subjective uncertainty, threat, and ambiguity about the
    world (e.g., Kruglanski & Webster, 1996; Miller, Saunders, & Farhart, 2016; Sunstein
    2014).


    In this paper, we extend these perspectives by examining the hypothesis that unjustified
    and inflated confidence in one''s understanding of the underlying causal relationships
    among political phenomena (i.e., actors, institutions, processes, events, and
    outcomes) increases conspiracy beliefs. A substantial body of work indicates that
    people generally overestimate the quality of their own judgments and the depth
    of their explanatory knowledge, especially in content areas involving complex
    causal relations (see Rosenblit & Keil, 2002). A classic way that people''s overestimation
    of their knowledge has been tested through the illusion of explanatory depth (IOED)
    paradigm. In the IOED paradigm, participants initially rate their confidence in
    their understanding of how an object or phenomenon works (e.g., how a faucet works;
    what we will refer as the pre-explanation confidence judgment). Participants then
    provide a detailed explanation as they can for how the object or phenomenon actually
    works including the causal links between steps of that process.


    Then, participants reiterate their explanatory understanding of the object or
    phenomenon (post-explanation confidence judgment). This act of trying to explain
    a phenomenon reveals to participants how little they actually understand about
    the workings of that phenomenon, resulting in a pre-post-explanation reduction
    in self-belief confidence (Fisher & Keil, 2014; Kominsky & Keil, 2014; Rosenblit
    & Keil, 2002).


