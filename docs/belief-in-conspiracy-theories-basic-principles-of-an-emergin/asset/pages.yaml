    # Results


    # Preliminary Analyses


    As the correlations between key variables in Table 1 indicate, respondents showed
    more conspiracy thinking in July tended to show more in November as well. Higher
    levels of American identification, trust, and political knowledge were associated
    with reduced conspiracy thinking in both July and November, whereas higher levels
    of authoritarianism and need for closure were associated with greater conspiracy
    thinking at both time points. Conservatism was associated with greater conspiracy
    thinking in November but not July, and ideological extremism was associated with
    reduced conspiracy thinking in July but not November. Finally, as expected, collective
    narcissism was associated with greater conspiracy thinking in both July and November.


    This correlation was stronger in November than in July ($r=0.24$ versus $r=0.09$;
    Steiger''s $Z=6.381, p<0.001$), suggesting that the campaign may have strengthened
    the tendency for those high in collective narcissism to adopt conspiracy thinking.


