  md: '# Principle 3: Conspiracy Beliefs are Emotional


    The third is partly grounded in a paradox: Conspiracy theories—even blatantly
    irrational ones—are often supported by a range of elaborate arguments, suggesting
    that belief in conspiracy theories is based on analytic and deliberative (i.e.,
    System 2) thinking processes. For instance, Moon landing conspiracy theories (assuming
    that the Moon landings were filmed in a TV studio) often are justified through
    an extensive analysis of the lack of wind on the moon in conjunction with the
    apparent movement of the US flag on video records. Likewise, 9/11 conspiracy theories
    (proposing that these terrorist attacks were an inside job committed by the US
    government) are based on a range of scientific arguments pertaining to the steel
    constructions of the former Twin Towers, the maximum temperatures of burning kerosene,
    and the temperatures which steel melts. It would therefore be tempting to believe
    that conspiracy theories is closely associated with an inquisitive mindset that
    does not take for granted the official readings of impactful events, and critically
    analyses evidence in favor of, or against, a conspiracy theory.


    Empirical evidence, however, suggests the opposite. For example, belief in conspiracy
    is positively associated with intuitive rather than analytic thinking (Swami,
    Voracek, Stieger, Tran, & Furnham, 2014). Consistently, higher education predicts
    lower conspiracy beliefs, a finding that is mediated by a tendency among the less
    educated to attribute agency and intentionality where it does not exist (Douglas
    et al., 2016), and stronger analytic thinking skills among the higher educated
    (Van Prooijen, 2017). Furthermore, the combination of analytic thinking and the
    motivation to be rational predicts skepticism of conspiracy theories (Stahl &
    Van Prooijen, 2018). It has also been noted that the confirmation bias is central
    to conspiracy theorizing (Brotherton, 2015), and that conspiracy beliefs are related
    to the illusion of explanatory depth (Vitriol & Marsh, this Volume).


