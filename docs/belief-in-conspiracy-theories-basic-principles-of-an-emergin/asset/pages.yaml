  md: 'conspiracy thinking is related to faulty causal perceptions even in situations
    where events are not truly random. These studies were grounded in the theory that
    conspiracy belief is a form of pattern perception in which causal understandings
    are imposed on essentially random or at least-determined events to make them seem
    more ordered. Put differently, causal inferences are a way of imposing an arbitrary
    but psychologically meaningful order on randomness. In these studies, participants
    have for the most part, presented with random event sequences. In such situations,
    perceiving patterns is only possible when observers are willing to draw implausible
    and unwarranted causal connections between events, by definition, are unconnected.


    This unanswered question is important, because typically, the events at issue
    in conspiracy theories are not random. For example, the deaths of John F. Kennedy,
    Princess Diana and Osama Bin Laden were not random occurrences. Each death can
    be seen as the outcome of a multitude of personal, social, and political causes
    (e.g., in the case of Princess Diana, including a celebrity culture that fueled
    the reckless actions of paparazzi, the fact that the driver had drinking, and
    the lack of guard rails on the concrete columns in the tunnel where the fatal
    crash occurred). Each death, indeed, has an official causal explanation that is
    challenged by conspiracy theories. More generally, events in human life are typically
    somewhat structured and are over- rather than under-determined – that is, each
    event has multiple causes (Mill, 1843/1973). This is why the explanatory dilemma
    typically posed by socially significant events is not whether something caused
    them, but what caused them (Kelley, 1967). To paraphrase the apt metaphor for
    causal inference – “connecting the dots”— put forward by Rooijen et al. (2018),
    the when events are non-random may be whether observers connect the wrong dots,
    rather than any whatsoever.


    To be sure, conspiracy thinking appears to thrive under conditions of incomplete,
    second hand, conflicting, or ambiguous causal information (Douglas & Sutton, 2011;
    Kovic & Fuchlin, in press; Newheiser, Farias, and Tausch, 2011). The true (ontological)
    rather than merely apparent (epistemic) random stimuli of existing studies (Dieguez
    et


