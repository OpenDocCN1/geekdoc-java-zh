  md: '# Study 1


    One of the most familiar catch cries for students in psychology and other empirical
    disciplines is that correlation does not entail causation. Getting students to
    understand and apply the principle is a crucial aim in their training in critical
    thinking (Halpern, 1998; Wilson, Aronson, & Carlsmith, 2010). As we have seen,
    meeting this aim confronts an obstacle in human judgments of causation are heavily
    influenced by perceptions of correlation (Cheng, 1997; Heider, 1958; Kelley, 1967).
    However, to our knowledge is little or no research examining people''s (in)ability
    to judge that verbally described correlations between two variables may not signify
    a causal relationship (but for relevant research on contingency learning over
    multiple trials, see Fiedler, Walther, Freytag, & Nickel, 2003). Neither has any
    research examined the correlates of (in)ability.


    In this study, we aimed to investigate whether causal interpretations of correlations
    are associated with conspiracy beliefs, in accordance with our proposal conspiracy
    thinking is fostered by readiness to impose causal interpretations on events in
    the environment. In particular, we examined the relationship between conspiracy
    beliefs and causal interpretation of spurious correlations — those that are produced
    by the operation of third causes. For stimuli, we exploited Vigen''s (2015) compilation
    of real-life but spurious and indeed often entertaining absurd correlations, mined
    from publicly available datasets. These include relations between capita chocolate
    consumption and Nobel Prizes, and between drownings in American swimming pools
    and power generated by US nuclear power. We presented six correlations to participants
    and asked if they could be explained in terms of a causal relationship between
    the two variables, versus chance alone, or the operation of a third cause. We
    also measured the extent to which participants endorsed conspiracy theories about
    a separate set of well-known events such as the NASA moon landings and the deaths
    of Princess Diana and John F. Kennedy.


