  md: '# The Role of System Threat in Conspiracy Theory Endorsement


    Although popular media may characterize conspiracy theorists as a handful of tattered
    individuals obsessed with alien-landing cover-ups, belief in conspiracy theories
    is relatively common (e.g., Oliver & Wood, 2014; Swami et al., 2011). Moreover,
    conspiracy theories are endorsed by the highest levels of political power (Barkun,
    2017), shared by those on both the political left and right (Goertzel, 1994; Hofstadter,
    1965; Olmsted, 2009), and consequential for government policy (Uscinski & Parent,
    2014). Much research has examined correlates of conspiracy endorsement, suggesting
    that conspiracy beliefs satisfies psychological needs that arise in response to
    threat (Douglas, Sutton, Cichocka, 2017). In the present study, we propose that
    system identity threat, or the sense that society’s fundamental, defining values
    are under siege due to social change, may strengthen conspiracy thinking and conspiracy-theory
    endorsement. We detail our theoretical rationale below.


    # Individual-difference correlates of conspiracy thinking and conspiracy endorsement


    Prior research has characterized conspiracy theories (CTs) as being focused on
    the idea that “an invisible, insidious, uncanny force [is] plotting various kinds
    of evil” (Zonis & Joseph, 1994, p. 443). Moreover, Sunstein and Vermeune (2009,
    p. 205), characterize CTs as the result of the perception that certain outcomes
    are caused by “the machinations of powerful people, who attempt to conceal their
    role.” In current study, we consider two manifestations of conspirism (Uscinski,
    Klofstad, & Atkinson, 2016; Uscinski & Parent, 2014). The first is general conspiracy
    thinking, which reflects a broad explanatory style for social and political events
    implying that powerful people and institutions conspire behind the public’s back,
    that the truth of how the powerful operate is hidden and that key events are controlled
    and orchestrated by powerful, shadowy forces (apart from endorsement of specific
    CTs). The second'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'is concrete conspiracy-theory endorsement, which refers to acceptance of specific
    conspiracy theories present in a particular social or political context.


    Research examining CTs has increased dramatically in recent years, with much of
    it focusing on individual differences that predict increased endorsement of conspiracy
    theories or the circumstances under which conspiracy thinking is likely to emerge.
    For example, individuals who believe in CTs tend to have higher levels of paranormal
    beliefs (Swami et al., 2011), anxiety (Grzesziak-Feldman, 2013), paranoid ideation
    (Darwin, Neave, & Holmes, 2011), openness to new experiences (Swami, Chamorro-Premuzi,
    & Furnham, 2010), need for (Imhof & Lamberty, 2017; Lantian, Muller, Nurra, &
    Douglas, 2017), and narcissism (Cichocka, Marchlewska, & Gelec de Zavala, 2016),
    and are lower in self-esteem (Cichocka, et al., 2016; Swami et al., 2011) and
    agreeability (Swami et al., 2010), and are more likely to believe in other CTs
    (Goertzel, 1994; Imhof & Lamberty, 2017; Swami et al., 2010; Swami et al., 2011),
    even when these beliefs are contradictory (Wood, Douglas & Sutton, 2012). With
    respect to political antecedents, research indicates that CT endorsement is higher
    among those who are more politically extreme (van Proooijen, Krouwel, & Pollet,
    2015) and politically cynical and distrusting of government (Swami et al., 2010).


    # Conspiracy thinking and conspiracy endorsement as compensatory reactions to
    threat


    Conspiracy thinking and CT endorsement are higher among individuals for whom threats
    loom large. For example, individuals who are sensitive to order and structure
    (Abalakina-Paap, Stephan, Craig, & Gregory, 1999; Swami, 2012) or to uncertainty
    (van Proooijen & Jostmann, 2013) are more prone to conspiracy thinking. As such,
    scholars have suggested that CT endorsement may fulfill psychological needs for
    certainty and security (e.g., Douglas, Sutton, & Cichocka, 2017). Consistent with
    this, Marchlewska, Cichocka, and


    This article is protected by copyright. All rights reserved.'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'Kossowska (in press) found that individuals high in the need for cognitive
    closure were more likely to endorse conspiracy-oriented reasons for events (e.g.,
    a plane crash); but see Leman & Cinnirella, 2013. Similarly, individuals who believe
    they are faced by a threatening loss of control tend to engage in more conspiracy
    thinking and endorse CTs more strongly (Kay, Gaucher, Napier, Callan, & Laurin,
    2008; Kramer, 1994; Sullivan, Landau, & Rothschild, 2010; van Proijen & Acker,
    2015; Whitson & Galinsky, 2008).


    Results as these broadly support conspiracy thinking and CT endorsement are the
    province of those who feel that they are faced with the threat of loss, whether
    it be of certainty, security, or control. Consistent with this perspective, several
    lines of research indicate that losses in the political realm encourage conspiracy
    thinking. For example, studies suggest that political disenfranchisement (Crocker,
    Luhtanen, Broadnax, & Blaine, 1999) and having one’s political party lose power
    (Edelson, Alduncin, Kreswon, Sieja, & Uscinski, 2017; Uscinski & Parent, 2014)
    are both associated with increased conspiracy thinking and belief. In turn, this
    has led some commentators to argue that “conspiracy theories are for losers” in
    the context of politics (Uscinski & Parent, 2014).


    # Societal change as a type of threat


    Belief in conspiracy theories can provide intuitively plausible, internally consistent,
    and personally meaningful explanations for the causes of complex, threatening
    events and changes in the world (e.g., Kruglanski & Webster, 1996; Miller, Saunders,
    & Farhart, 2016; Sunstein, 2014). Accordingly, conspiracy beliefs often function
    to justify existing social systems and arrangements. As Jolley, Douglas, & Sutton
    (2017) explain, by impugug the motivations and actions of a select few who are
    perceived to be solely responsible for precipitating events that


    This article is protected by copyright. All rights reserved.'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'threaten the legitimacy of existing systems, conspiracy beliefs provide a justification
    for the status quo.


    However, prior work has not examined the consequences of the perceived threat
    of social change—a unique kind of threat that may not only threaten one''s perceptions
    of the legitimacy of relevant social systems, but may also fundamentally challenge
    (1) one''s conception of society and what it means to be a member of that society
    and (2) the personal meaning and esteem one ascribes to and derives from these
    values and identities. We refer to these perceptions as system identity to distinguish
    between threats to the legitimacy of the social systems and threats to the received
    values and identities associated with that system. Jolley et al. (2017) find that
    situationally-induced threats to the status quo can promote conspiracy thinking,
    but this work did not address the role of perceived threats associated with changes
    that appear to alter society''s identity and defining values. Further, perceived
    threats to the legitimacy of the system—such as a sense that it is corrupt—do
    not necessarily involve perceptions of threatening social change in which challenge
    one''s identity or values associated with that system. In this paper, therefore,
    we attempted to move beyond the consequences of threats to the perceived legitimacy
    of existing social systems, to focus specifically on the consequences of threats
    to the perceived identity of the system, which is precipitated by perceptions
    of undesirable social change, not threats to the legitimacy of social systems.


    We also distinguish system identity from the construct of collective narcissism,
    an exaggerated belief in in-group greatness that depends on external validation
    (Golec de Zavala, Cichocka, Eidelson, and Jayawickreme, 2009). Collective narcissism
    shares common ground with our conceptualization of system identity threat in that
