  md: 'or identity. As we note below, these were especially evident during the 2016
    American presidential election, making the latter an excellent context for study.


    # The Present Study


    In the present study, we test our hypotheses examining whether American CN predicted
    an increase in general conspiracy thinking over the course of the 2016 United
    States election. This context provides an ideal setting for such an investigation,
    given that conspiracy endorsement during political campaigns (Kofta & Sedek, 2005).
    In addition, the 2016 election was specifically awash in conspiracy allegations
    about bias and electoral interference involving domestic and foreign actors on
    various sides (e.g., Samuelsohn, 2016) and rhetoric implying that victory by one’s
    opponents posed a fundamental threat to all that was good about the nation (Reicher
    & Haslam, 2017). Given that these threats impact national identity and institutions
    linked to it (e.g., elections), those high in CN should become increasingly involved
    in conspiracy thinking over the campaign.


    Our study also adds to current knowledge by (1) using a longitudinal design to
    examine not only cross-section relationship but change in conspiracy thinking
    during the campaign and (2) using a larger, more representative sample of participants
    than previous studies of CN and conspiracy theories. To isolate the role of CN
    as a predictor of changes in conspiracy thinking, we controlled for numerous covariates.
    Besides demographics (age, income, gender, race), these included variables overlap
    with collective narcissism and a tendency to view the world in conspiracy terms.


    Because positive in-group identification correlates with CN but also has opposite
    effects on conspiracy endorsement (Cichocka et al., 2016), we controlled for national
    in-group identification. We also controlled for education and political knowledge,
    since CN (Golec de Zavala, et al., 2009) and conspiracy endorsement (Berinsky,
    2012; Goertzel, 1994) are higher among those low in education and political sophistication.


