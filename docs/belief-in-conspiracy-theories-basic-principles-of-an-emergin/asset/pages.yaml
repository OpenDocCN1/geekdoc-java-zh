  md: 'Consequently, in addition to collective action and other forms of explicit
    corrections of injustices in the system (e.g., van Zomeren, Postmes, & Spears,
    2008), stigma compensation theory suggests that members of stigmatized groups
    develop self-regulatory strategies to compensate for a diminished sense of social
    value that is inherent in their social context (Henry, 2009, 2011a). These strategies
    help bolster or protect their existing sense of social worth but do not necessarily
    have to address the source of deuation directly.


    According to stigma compensation theory, those strategies include any attitude
    or behavior that serves a psychologically self-defensive or reassuring function
    (Henry, 2009, 2011a). Such attitudes or behaviors should therefore be found in
    greater frequency and intensity among members of devalued groups in society compared
    to their more socially valued counterparts. For ample evidence supporting this
    prediction. For example stigmatized groups show more aggression in response to
    insults (Henry, 2009), greater hostility reactivity (Davis & Reyna, 2015), authoritarianism
    (Brand & Henry, 2012a); Brandt, Henry, & Wetherell, 2015; Henry, 2011b), distrust
    (Brand, Wetherell, & Henry, 2015), religiosity (Brand & Henry, 2012b), and more
    concern for respect in the workplace (Henry, 2011a) when compared to non-stigmatized
    groups. Importantly, the theory argues that these compensatory strategies do not
    result from individual deficits that may accompany stigma (cf., lack of ofition,
    Lipset, 1959; lack of impulse control, Mac Donald, 2014) but instead as a function
    of, and a reaction to, broader patterns of prejudice, discrimination, and stigmatization.


