  md: '# Abstract


    The average person possesses superficial understanding of complex causal relations
    and, consequently, tends to overestimate the quality and depth of their explanatory
    knowledge. In this study, we examined the role of this illusion of explanatory
    depth (IOED) in politics-- inflated confidence in one''s causal understanding
    of political phenomena-- for endorsement of conspiracy beliefs. Utilizing a pre-/post-election
    panel design and a large sample of U.S. Citizens (N=394) recruited in the context
    of the 2016 Presidential Election, we provide evidence that political IOED, but
    not a non-political IOED, was associated with increased support for general and
    election-specific conspiracy beliefs, particularly among novices and supporters
    of the losing candidate. We find that pattern of results results not the influence
    of a broad range of variables known to covary with conspiracy beliefs. Implications
    for theory and the need for future research are discussed.


    # The Illusion of Explanatory Depth and Endorsement of Conspiracy Beliefs


    Conspiracy theories about government actors and institutions are widespread and
    diverse, and are commonplace among individuals across the political ideological
    spectrum (Goertzel, 1994; Hofstadter, 1965; Olmsted, 2009). As many scholars and
    commentators have noted, conspirac ideation be understood as the tendency attributed
    out influence to hidden actors or clandestine groups, often powerful and nefarious,
    who are perceived as colluding in wide-ranging activities to manipulate or shape
    important world actions, events, and outcomes. Because many of these beliefs are
    overly simplistic but non-falsifiable explanations of complex, ambiguous, and
    often randomly occurring phenomena, conspiracy beliefs function to imbue meaning
    to otherwise chaotic, yet threatening phenomena (Graepner & Coman, 2006; 2016;
    Miller, Saunders, & Farhart, 2016; Sunstein, 2014; Sunstein & Verme, 2009; Swami
    & Coles 2010; Uskinski & Parent, 2014).


    Prior research investigating the psychology of conspiracy beliefs has examined
    the role of personality characteristics or other individual differences (e.g.,
    Abakalina-Paap et al., 1999; Swami et al., 2011), political or social disenchantment
    (e.g., Graepner & Coman, 2016; Uskinski & Parent, 2014; Federico, Williams, &
    Vitriol, 2017), conspiratorial mindsets (Imhof & Bruder, 2014), and identity-based
    motivated-reasoning processes (e.g., Carey, Nyhan, Valentino, & Liu, 2016). These
    findings point to many disitional and situational factors that increase endorsement
    of conspiracy beliefs--including perceived lack of control, heightened need for
    uniqueness, high individual


