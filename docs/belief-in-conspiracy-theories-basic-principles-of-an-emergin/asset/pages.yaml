  md: 'al., 2015; by Prooijen et al., 2018) can be viewed as a simulation of these
    conditions of causal uncertainty. Crucially, it appears reasonable to infer that
    faulty perceptions that events are causally connected should be important to conspiracy
    theories even when there is some objective structure to events. However, non-random
    situations are different, in that perceptible patterns in events may exist independently
    of any causal influence by the observer. Further, these patterns, notably co-occurrences,
    may affect causal reasoning processes and disrupt their relation to conspiracy
    thinking. The external validity of research on conspiracy thinking will benefit
    from developing and testing the hypothesis that it depends on the faulty perception
    of causal connections between events, whether those events are random or non-random.


    # Lessons from the literature on co-occurrence and causal inference


    Previous research has shown that causal inference and the perception of co-occurrence
    in events are strongly related. Causal inference can affect the perceptual organization
    of events: since Heider (1958), psychologists have seen causal inference as means
    of imposing order on the environment, and organising multiple stimuli into coherent
    units or Gestals (Read, Vanman, & Miller, 1997; Xu, Tang, Zhou, Shen, & Gao, 2017).
    Conversely, causal inference is strongly influenced by the perception of at least
    two kinds of regularity. First, for one event to be seen as the cause of another,
    the two events should normally be correlated. That is, if one tends to be present,
    the other is present, and if it tends to be absent the other is absent: this is
    the covariation principle (e.g., Kelley, 1967; Sutton & McClure, 2001). Second,
    in addition to correlation, temporal contiguity is important: people are more
    likely to perceive events as causally connected if they occur together in time
    (Alloy & Abraham, 1979; Boehhner, 2005).


    Nonetheless, the perception and causal interpretation of co-occurrences are conceptually
    and empirically separate. Whether people infer causality from a correlation depends
    on whether they harbour a tacit theory that the putative case has the power to
    affect the putative outcome (Cheng, 1997; Cheng & Lu, 2017). Thus, people prefer
    to explain large outcomes in terms of large


