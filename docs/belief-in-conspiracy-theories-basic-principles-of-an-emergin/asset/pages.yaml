    # Study 2


    In Study 2, we aimed to replicate and extend the findings of Study 1 in two distinct
    ways. First, we included Whiton and Galinsky''s (2008) measure of visual pattern
    perception to examine whether it is related to conspiracy thinking, and once it
    is adjusted for, whether causal interpretation of spurious correlations remains
    a significant predictor of conspiracy thinking. The perception of patterns in
    visual stimuli is thought to be another manifestation of the motivated perception
    of meaning and order in the environment, so we wanted to ensure our predicted
    effect was related to but also functioned independently of this mechanism. Second,
    we included a scale of magical ideation (Eckblad and Chapman, 1983) in the present
    study. Since this scale addresses the tendency for permissive and unconventional
    causal thinking, we expected that it should be related to the causal interpretation
    of spurious correlations, as well as conspiracy belief. Further, we included other
    theoretically relevant control factors that have also been shown to be associated
    with conspiracy thinking, including rationalistic mind-set (Swami, Voracek, Steieger,
    Tran, & Furnham, 2014), political orientation (by Prooijen, Krouwel, & Polet,
    2015), religiosity (Beller, 2017; Newheiser et al., 2011), and education (Douglas
    et al., 2016; by Prooijen, 2017). As Study 1, we predicted that causal interpretations
