    Others, in contrast, exhibit a remarkable trust that such secret plots either
    do not happen or do not harm to anyone. It is our view that this underlying set
    of assumptions about how the world operates people more or less prone to accept
    and endorse specific, even novel or entirely fictitious (Imhoff & Lambert, 2017)
    conspiracy theories. Understanding these relations more closely is an important
    issue for future research that may also elucidate whether conspiracy beliefs are
    more rational than others (and vice versa for non-conspiracy beliefs).


    Independent of their respective veracity, conspiracy beliefs typically exhibit
    a clear rejection of official accounts distributed by social institutions like
    mainstream media or politicians. This (lack) of trust in social institutions has
    potentially far-reaching implication for the societal transmission of “knowledge”
    and epistemic trust in authorities. As recent research (Imhoff, Lambert, Klein,
    in press) suggested, people who reject conspiracy allegations as the source of
    an identical position as more credible when it was ended with a position of expertise
    and power. In contrast, conspiracy believers did not exhibit the opposite (i.e.,
    more trust in the underdog), but showed no source-based bias whatsoever. On the
    one hand, this is an indication of, not more, bias on the side of conspiracy believers.
    On the other hand, a highly complex society with a fine-grained division of labor
    requires a basis of societal trust: Trust that scientists provide unbiased evidence
    in the absence of conflicts of interest, trust the newspapers report events as
    they happened without suppressing certain information, trust that if one voted
    for a political party, this party will keep its electoral promises once elected.
    Conspiracy believers have cancelled this social contract of trust. This does not
    necessarily mean that they are crazy, paranoid or cognitively challenged, but
    merely more disillusioned, more suspicious, and potentially less naive above society.
    In addition to these arguably healthy forms of skepticism, they are also more
    likely to endorse prejudices against groups they perceive as powerful (Imhoff
    & Bruder, 2014), less likely to stop global warming (Douglas & Sutton),


