  md: 'evidence supports our claim that political illusions of explanatory depth,
    independent of but with a host of other individual difference variables, are associated
    with belief in conspiracy theories.


    In addition to extending the IOED paradigm to political domains in novel ways,
    our findings also enrich perspectives investigating the psychology of conspiratorial
    beliefs. In particular, prior work suggests that endorsement of conspiracy theories
    is particularly common among political novices and individuals who are political
    disenfranchised or powerless (Berinsky, 2012; Miller, Saunders, & Farhart, 2016;
    Uskinski & Parent, 2014). For these reasons, we tested the moderating role of
    individual differences in political knowledge and having voted for the losing
    candidate for the effects of post-explanation political belief confidence on endorsement
    of conspiracy theories. Our findings support prior research by showing, that political
    novices and supporters of the losing candidate, post-explanation political belief
    confidence predicted pre- to post-election *change* in both general conspiratorial
    beliefs and specific conspiratorial beliefs that provide a causal explanation
    for the outcome of the election; net controls, higher post-explanation political
    belief confidence was associated with an increase in general and election-specific
    conspiratorial beliefs among voting citizens with lower levels of actual political
    knowledge and for whom the electoral outcome was inconsistent with candidate preferences.
    The political IOED was associated with change, pre/post-election, in conspiratorial
    beliefs as a function of both theoretically relevant dispositional and situational
    moderators provide stronger evidence for the important role of inflated confidence
    in one’s causal understanding of politics for conspiratorial beliefs (e.g., Finkel,
    1995).


    Our findings additionally expand our knowledge of how the IOED influences people’s
    reasoning and decision making in several ways. First, our adding to the growing
    observations of the IOED in phenomena beside everydays (Alter et al., 2010; Fernbach
    et al., 2013; Fisher & Keil, 2014; Sloman & Rabb, 2016; Zeveney & Marsh, 2016),
    further demonstrating the robustness of people’s overconfidence in their perceived
    causal understanding of the world. Second, our results provide one of the few
    first demonstrations of how the IOED can affect other kinds of beliefs (Fernbach
    et al., 2013), enriching our understanding of the consequences explanation can
    have in other areas of


