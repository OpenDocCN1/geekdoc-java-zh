  md: '# Discussion


    Building on existing perspectives characterizing conspiracy belief as a motivated
    response to perceived threat (e.g., Jolley et al., 2017), the current study explored
    the role of a thus-far unexamined psychological variable: system identity threat,
    or the sense that society’s fundamental, defining values are under siege due to
    social change. Prior research indicates that perceptions of threat—whether to
    one’s sense of control, certainty, or security—can increase conspiracy thinking
    (e.g., Crocker et al., 1999; Kay et al., 2008; Kramer, 1994; Sullivan et al.,
    2010; Whitson & Galinsky, 2008), sees conspiracy thinking and conspiracy endorsement
    can imbue meaning to complex, threatening phenomena (Douglas et al., 2017; Graeuppner
    & Coman, 2017; Miller et al., 2016; Sunstein & Vermeule, 2009; Uscinski & Parent,
    2014).


    Consistent with this, we found that perceived threat to conception of society
    and what it means to be a member of society would be associated with conspiracy
    thinking style, which would, in turn, bolster endorsement of both ideological
    and non-ideological CTs.


    Across two large samples, we found strong support for these hypotheses. Controlling
    a broad range of factors (including indicators of general system-justification
    motives, like authoritarianism and ideology), system identity threat emerged as
    a strong predictor of general conspiracy thinking and CT endorsement. Moreover,
    mediation analyses indicated that system identity threat was indirectly related
    to CT endorsement via its association with conspiracy thinking in general. This
    pattern of results adds to a body of work suggesting that perceptions of threat
    are associated with conspiracy thinking, and extends extant perspectives (e.g.,
    Jolley et al., 2017) by focusing on a novel form of threat. While existing work
    suggests that threats to the legitimacy of the system can increase conspiracy
    beliefs, we demonstrate that perceptions of threatening social change are also
    an important individual difference antecedent


