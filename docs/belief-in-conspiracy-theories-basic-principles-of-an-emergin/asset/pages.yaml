- img_proc: true
  md: 'conspiracy thinking over the course of the 2016 U.S. presidential campaign,
    which exposed the public to many instances of conspiracist ideation implicating
    national integrity (Reicher & Haslam, 2017; Samuelsson, 2016). We posit that the
    antagonism between ''us'' and ''them'' conspiracy theories (from Prooojen & Lange,
    2014) appeals to collective narcissists because it fits their intergroup hostility
    (Golec de Zavala, Cichocka, Eidelelson, and Jayawickreme, 2009; Golec de Zavala,
    in press).


    # Collective narcissism and Confederacies


    Collective narcissism (CN) is an exaggerated belief in the in-group''s greatness
    that depends on external validation from others. Individuals in CN constantly
    seek such validation and react aggressively to threats to the in-group image.
    Accordingly, those in CN react with intergroup aggression when the in-group is
    criticized or insufficiently recognized (Golec de Zavala et al., 2009; Golec de
    Zavala, Cichocka and Iskra-Golec, 2013; Golec de Zavala, Pekker, Guerra, and Baran,
    2016).


    Though correlated with other variables related to national identification (such
    as blood patriotism) and nationalism; Kosterman & Feshbach, 1989; Schatz, Staub,
    and Lavine 1999; patriotism or in-group satisfaction, Leach, et al., 2008), national
    CN predicts intergroup hostility even after these other variables are controlled
    for. Indeed, other measures of national identification often cease to explain
    hostile retaliation to in-group criticism once CN is accounted for (Golec de Zavala
    et al. 2013, 2016).


    CN predicts a tendency to believe conspiracy theories about malevolent actions
    of specific out-groups against the in-group. For example, Polish collective narcissism
    predicts a belief that Western countries opposed to undermine the significance
    of Polish (in comparison to German) contribution to the collapse of Eastern European
    communist regimes. American narcissists believe that foreign governments engage
    in conspiracies (Cichocka, Marchlewska, Golec de Zavala & Olechowski, 2016). However,
    recent studies suggest that collective narcissism may be


