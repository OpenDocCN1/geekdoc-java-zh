  md: '# Abstract


    Previous research indicates that conspiracy thinking is informed by the psychological
    imposition of order and meaning on the environment, including the perception of
    causal relations between random events. Four studies indicate that conspiracy
    belief is driven by readiness to draw implausible causal connections even when
    events are not random, but instead conform to an objective pattern. Study 1 (N
    = 195) showed that conspiracy belief was related to the causal interpretation
    of real-life, spurious correlations (e.g., between chocolate consumption and Nobel
    prizes). Study 2 (N = 216), this effect held adjusting for correlates including
    magical and nonanalytical thinking. Study 3 (N = 214) showed that preference for
    conspiracy explanations was associated with a focal event (e.g., the death of
    a journalist) was causally connected to similar, recent events. Study 4 (N = 211)
    showed that conspiracy explanations for human tragedies were favoured when they
    comprised part of a cluster of similar events (vs. occurring in isolation); crucially,
    they were independently increased by a manipulation of causal perception. We discuss
    the implications of these findings for previous, mixed findings in the literature
    and for the relation between conspiracy thinking and other cognitive processes.


    **Keywords:** conspiracy belief; spurious correlation; pattern perception; causality


    In January 2012, the Argentinian President Christina Fernandez Kirchner was diagnosed
    with cancer. Speaking the day after her diagnosis, Hugo Chavez, then President
    of Venezuela, noted that several leftist Latin American leaders had also recently
    been afflicted by cancer, including the President of Paraguay (Fernando Lugo),
    the President (Dilma Rousseff) and former President (Lula de


    This article is protected by copyright. All rights reserved.'
