    # The current studies


    Studies were conducted with French speakers so the materials were in French. For

    readability, we provided example of the materials in English. Study 1 and Study
    2 were

    conducted and pre-registered in parallel. Studies were conducted online and participants

    were randomly assigned either to Study 1 or Study 2. For both, we pre-registered
    the

    hypotheses, the intended statistical treatments, the planned sample size, and
    the a priori

    exclusion criteria, on the AsPredicted website (https://aspredicted.org/tx9st.pdf
    for Study 1,

    https://aspredicted.org/yp45w.pdf for Study 2). We planned to run a mediation
    analysis.

    Then, to determine the sample size (total N = 150 for each study), we based our
    power

    analysis calculation (with α = .05 and a statistical power of 80%) on the test
    of the indirect

    effect (calculated thanks to the joint significance test, Judd, Yzerbyt, & Müller,
    2014). It was

    based on a hypothetical simple mediation model, with an expected effect size of
    0.39

    (conventionally considered as a medium effect size) for the IV to mediator path
    and an

    expected effect size of 0.26 (conventionally considered as a small-to-medium effect
    size) for

    the mediator to DV path (see Fritz & MacKinnon, 2007). These two effect sizes
    could not be

    determined on the basis of प्रयोग literature because of an absence of similar
    reported

    effect, but were based on our own sense of smallest effect interest (Funder et
