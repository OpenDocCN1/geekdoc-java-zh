    # Practical Implications


    An important task of psychology as a scientific discipline is to inform policy-makers
    how to responsibly influence the behavior of citizens based on empirical findings
    and theoretical insights. That conspiracy theories are consequential and universal
    underscores a need for interventions: If most of the consequences of conspiracy
    theories in modern societies are harmful, and if conspiracy theories are widespread
    in the population, policy-makers have good reason to take this phenomenon seriously.
    This does not imply, of course, that our society should abandon efforts to combat
    actual corruption, or that citizens should uncritical accept any policy proposal
    of power


