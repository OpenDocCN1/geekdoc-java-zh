    # Abstract


    The research investigates conditions under which beliefs in conspiracy theories
    predict the desire to justify ingroup behaviour in the context of intergroup conflict.
    We propose that within the context of Ukraine’s conflict over the annexation of
    Crimea, supporters (but not opponents) of the ‘Euromaididan’ social movement are
    likely to validate protesters’ collective actions as just to the extent that they
    believe that the authorities are engaged in annexation-related conspiracies. We
    also examine the moderating role of perceived political corruption in these processes.
    Using a public opinion survey of 315 Ukrainians, we found support for our hypothesized
    moderated mediation model—identification with ‘Euromadan’ increased beliefs in
    the annexation-related conspiracy theories, which with turn, increased justification
    of protesters’ actions in the setting of intergroup conflict. However, this mediation
