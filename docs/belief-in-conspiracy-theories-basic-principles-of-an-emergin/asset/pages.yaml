  md: 'intentionally spreads drugs in inner city communities (Crocker, Luhtanen, Broadnad,
    Blaine, 1999; Goertzel, 1994).


    Theant literature explains African Americans conspiracy theory endorsement primarily
    in terms of realistic appraisals of social practices and policies (e.g., Bird
    & Bogard, 2005; Nelson, Adams, Branscombe & Schmitt, 2010) but does not make a
    distinction between race-relevant e.g. AIDS was created to harm the African American
    community) vs. race-neutral conspiracy theories (the moon landing was a hoax).
    Race-neutral conspiracy theories are typically counter-narratives to mainstream
    beliefs, but race-relevant conspiracy theories involve specific malevolent intentions
    toward particular ethnic groups or their leaders. Although there is substantial
    evidence that ethnicity-based differences in conspiracy theory endorsement exist,
    relatively few mechanisms for these effects have been tested, especially with
    respect to the racial content of the theory. We examine the proposition that African
    American endorsement of race-related conspiracy theories in particular may stem
    in part from a social motivation to manage chronic societal devaluation (e.g.,
    Henry, 2009, 2011a).


    # Rational Motives for Conspiracy beliefs


    A recent review proposes three categories of motivations underlying belief in
    conspiracy theories, of which include (a) the motivation people to seek causal
    explanations to reduce uncertainty (epistemic), and (b) to feel in control and
    safety in their lives (existential; Douglas, Sutton, & Cockha, 2017). These motivations
    suggest that belief in conspiracy theories can help people manage realistic threats.


    These rational motives may be true for members of ethnic minority groups insofar
    as race-relevant conspiracy theories often contain a kernel of truth. There are
    innumerable historical examples of majority groups conspiring to do harm to minorities.
    The eugenics movement in the early 20th century encouraged the use of birth control
    among poor and ethnic populations to curb


