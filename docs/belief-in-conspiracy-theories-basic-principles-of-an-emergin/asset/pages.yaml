  md: '# Materials and Procedure


    In the present study, we told participants that we were studying imagination and
    perspective taking. Participants were told that the program is going to randomly
    select a topic for an imaginary task, in which they would have to imagine what
    they could feel, their attitudes, beliefs, and behaviors, trying to do their best
    to forget their own convictions, who they are, and how they would normally react,
    etc. (small portions of the instructions borrowed from Rusbult, 1980).


    Then, participants were randomly allocated to one of the two experimental conditions.
    In the two conditions, they should imagine that they were in front of an audience
    of 300 people attending a public debate. Importantly, we specified that they would
    know absolutely no one in this audience. The topic of the debate was the Charlie
    Hebdo shooting. We informed participants that some people called into question
    the official story about the group accused to be at the origin of the event, claiming
    that it was, in reality, planned in secret by French or foreign secret services
    or secret societies. In the pro-conspiracy condition, participants were told that
    they strongly argued in favor of these alternative theories (explicitly called
    “conspiracy theories” in the text), because they were convinced of veracity. In
    the anti-conspiracy condition, participants were told that they strongly argued
    against these alternative theories, because they were strongly convinced that
    they were false. Then, all the participants were invited to take one to imagine
    this situation and what they would feel and think immediately after their speaking
    slot. They could not continue long as the minute had not fully elapsed. To increase
    the efficacy of the procedure, immediately after this minute, we instructed them
    to write with a maximum of details how they have lived this situation, including
    their emotions, and Hewstones, etc. (this general procedure was borrowed from
    Brambilla, Ravenna, & Hewstone, 2012). We assessed the quality of the mental imagery
    (Libby, 2003) by evaluating how participants estimate the difficulty of the


