  pgno: 207
- img_proc: true
  md: 'Silva) of Brazil, not to mention Chavez himself (who was later to die of the
    disease, de Kirchner turned out to be misdiagnosed). He then suggested that this
    co-occurrence was “difficult to explain using the laws of probabilities.” In place
    of these laws, he implicated the United States. “Would it be strange”, Chavez
    asked in a televised speech, “if they had developed the technology to induce cancer
    and nobody knew about it?” (Alexander, 2012).


    This anecdote illustrates several important features of conspiracy theorizing,
    which may be defined as the attribution of events to the secret actions of powerful
    and malevolent groups (Douglas, Sutton, Cichocka, 2017). For example, conspiracy
    theorizing may take the form of suspicion and oblique questioning rather than
    direct accusation (Wood, 2017). Also, conspiracy theorizing serves political purposes,
    casting rival nations, factions, and social outgroups as malign and in-group members
    as their victims (Cichocka, Marchlewska, Golec de Zavala, & Olechowska, 2016;
    Imhoff & Bruder, 2014; Uscinski & Parent, 2014).


    Of most interest the present article, Chavez''s conspiratorial musings appealed
    explicitly to an apparent pattern in events. In doing so, they conform to the
    theory that conspiracy thinking is linked to the motivated perception of order
    and meaning in the environment (Jolley, Douglas & Sutton, in press; Marchlewska,
    Cichocka, & Kossowska, in press; Quinby, 1999; Van Proijen & Jostmann, 2013; van
    Prooijen, Douglas, & de Inocencio, 2018; Whiston, Galinsky & Kay, 2015; Whitson
    & Galinsky, 2008). Crucially, Chavez did not stop at observing the pattern; he
    explicitly rejected the idea that it could be explained as a coincidence and implied
    that the events were causally connected – despite the causal being vague and implausible.
    Building on recent research, we propose that this tendency to draw implausible
    causal connections between events is a crucial driver of conspiracy thinking.
    Further, we propose that this tendency is not only when events are random, but
    also when they co-occur systematically or conform to some objective pattern. We
    report four studies to test this hypothesis and discuss its implications for theories
    of conspiracy thinking.


