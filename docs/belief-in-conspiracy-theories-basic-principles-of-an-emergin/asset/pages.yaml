    # Same same but different? Towards a conceptual distinction of paranoia and conspiracy
    beliefs


    Already at the surface level, there seems to be a striking overlap between these
    conspirist and paranoid forms of perceiving and interpreting the world. In fact
    the term “paranoid” has become an adjective borrowed from clinical literature
    to describe precisely such a “sense of heated exaggeration, suspiciousness, and
    conspirational fantasy” (Hofstadter, 1964; p. 77) that some scholars identify
    in the ‘paranoid style’ of conspiracy beliefs. Likewise, sociological cite widespread
    agreements with support for the notion that paranoia is no longer simply diagnostic
    label applied by psychologists and psychiatrists but has become a veritable phenomenon
    (Knight, 2000; p. 27). The association of belief in conspiracy theories with a
    form of “political paranoia” (Swami & Furnham, 2014) is also exemplified in correlations
    between measures of subclinical paranoia and belief in conspiracy theories as
    r = .62 (Grzesiak-Feldman & Ejsmont, 2008).


    What is more, paranoia and beliefs in conspiracy theories seem to inhabit similar
    loci in a nomological network – sharing (presumed) antecedents and consequences.
    For instance, several models in psychology assert that people experience only
    little control over their environment compensate for this by gaining an illusion
    of control through detecting pattern and agency where there is – in reality –
    none (e.g., Heine, Proulx, & Vohs, 2006; Whitsky & Galinsky, 2008). Accordingly,
    paranoid thought (“detecting” ubiquitous hostility) is tied to follow from feelings
    of helplessness and lack of control (Freeman et al., 2005), and more generally
    an external locus of control (Feigstein, 1997);


    Feigstein & Vanable, 1992; Frenkel, Kugelmann, Nathan, & Ingham, 1995). Similar
    antecedents have been proposed – and empirically established – for belief in conspiracy
    theories (“detecting”) secret


