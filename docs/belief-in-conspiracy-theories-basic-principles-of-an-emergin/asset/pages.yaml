    recruited by identifiers to defensively construct or restore a positive image
    of their subjective valued group. Given the correlational evidence Cichocka et
    al. (2016) have provided it appears reasonable to expect that identifiers with
    an ideologically charged opinion group will be predisposed to believe in specific
    conspiracy theories to the extent that the latter allows them to justify the ingroup''s
    collective behaviour in the context of intergroup conflict.


