    perceived causal

    connections within the same domain. Its findings also build on Study 2 by indicating
    that the

    tendency to draw causal connections in the human realm is reflected more generally
    by the tendency

    to draw connections between events in the natural world. One feature of the present
    results is that

    perceptions that events comprised a pattern and causal perception of the patterns
    were separable

    in a confirmatory factor analysis, but were highly correlated. This finding lends
    weight to the

    suggestion that pattern perception in event sequences depends on the causal interpretation
    of

    those sequences (van Prooijen et al., 2018). It also suggests the need for further
    research to more

    effectively apart the co-occurrence of events and the extent to which they are
    perceived as

    causally connected. Thus, whereas Study 3 always presents event clusters, in our
    next and final study

    we turn to an experimental design in which causal interpretation and the co-occurrence
    of events

    are orthogonalized.


