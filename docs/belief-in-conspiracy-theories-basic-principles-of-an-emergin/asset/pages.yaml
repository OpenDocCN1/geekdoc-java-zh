  md: 'controls for demographic variables, education and knowledge, positive identification
    with the American in-group, social trust, ideology and ideological extremity,
    authoritarianism, and need for closure. Indeed, the predictive power of CN exceeded
    that of all these covariates. Thus, our results suggest that CN in the American
    context had a unique and dynamic influence on growth in


    Conspiracy thinking during the 2016 election campaign.


    Interestingly, the panel structure of our data allowed for stronger inferences
    about change than previous studies of the relationship between CN and conspiracy
    theories. Another strength of our analysis is that it relies on a larger, more
    representative sample than previous research on CN and conspiracy-related variables.
    Our study focuses on a sizable sample of adult respondents, surveyed amidst a
    real-world political campaign, providing advantages over the student and Mechanical
    samples used in previous research. Most importantly, while previous studies showed
    that CN was related to endorsement of specific conspiracy theories explaining
    particular hardships experienced by the in-group (Cichocka et al., 2016; Golan
    de Zavala & Cichocka, 2012), the present study showed that CN predicts changes
    in the generic predisposition to think in conspiracy terms. Thus, while previous
    studies showed that CN predicts beliefs that specific groups in secretive, malevolent
    actions (Cichocka, et al., 2015), our findings indicate that CN predicts a more
    general predilection towards conspiracy thinking—that is, an essentially content-freedom
    to believe that malevolent, secretive ''them'' conspire against ''us'' to cause
    harm (Uscinski et al., 2016). Such results suggest collective narcissism with
    reference to any in-group should be related to general conspiracy thinking and
    in-groups and out-groups featured in-be redefined depending on current intergroup
    context.


    There are several reasons why CN may predict general conspiracy thinking. Such
    thinking in its essence always assumes intergroup antagonism of the sort that
    individuals high in CN are prone to (van Prooijen & van Lange, 2014). A convergent
    body of findings indicate that CN predicts


    This article is protected by copyright. All rights reserved.'
