  md: 'Typical responses in the affirmation condition involved participants being
    recognized by peers or other valued social groups for academic, career, or athletic
    performance, or being appreciated for some act of prosocial behavior. This task
    was designed to reinforce participants’ existing sense of social value and connection.


    It should be noted that the affirmation condition draws upon an individual-level
    affirmation of social worth, and does not necessarily serve as an affirmation
    of the value of one’s group. This choice is deliberate. While a group-level affirmation
    could trickle down and bolster an individual’s sense of social worth, affirmation
    at the individual level helps ensure that the social motive we are manipulating
    is not about directly protecting or enhancing the self per se but rather the self
    in connection to the group. This process may operate separately from any motives
    to enhance the group (e.g., through collective action). Stigma compensation theory
    (Henry, 2009) predicts that one’s sense of social worth may be impacted by the
    value of the groups with which they associate, but that who are stigmatized engage
    in regulatory behavior at the individual level to manage group-based social devaluation
    as well. Hence, we chose to keep the affirmation at the individual level to increase
    the chances that it directly impacted participants’ sense of social worth.


    items used to measure participants’ perception of their groups’ social devaluation
    (Davis & Reyna, 2015). The instructions indicated that “we are interested in how
    you see yourself in relation to the world around you,” and participants responded
    to the eight statements (e.g., “Society people like me than others” and “I believe
    that others in society feel that I am a worthy human being”) using a seven point
    scale with 1 = strongly disagree and 7 = strongly agree. The eight items formed
    a reliable scale (Cronbach’s α = .83) and were averaged to create a composite
    of social devaluation, with higher numbers indicating a greater sense of social
    devaluation (i.e., threatened social work).


