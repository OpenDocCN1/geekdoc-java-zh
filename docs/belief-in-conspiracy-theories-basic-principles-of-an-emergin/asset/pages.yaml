  md: '# The Moderating Role of the Perceived Political Corruption


    The key caveat that the present study acknowledges is that the perceived corruption
    of the political system is likely to be both psychologically consequential of
    the salient group membership and robustly predictive of beliefs in conspiracy
    theories. Some authors (e.g., Della Porta & Vannucci, 1997; Miller, et al., 2016)
    have suggested that people who perceive political corruption to be an embedded
    feature of states’ political institutions will be more prone to see politicians
    as those who tend to side-step or even tailor specific arrangements to fit their
    personal rather than the country’s best interests. For instance, Miller et al.
    (2016) have shown how people who were both highly knowledgeable about politics
    and distrustful of the authorities were generally predisposed to endorse ideologically
    motivated conspiracy theories. Lending credence to this speculation, other scholars
    have demonstrated that conspiracy beliefs are a b-product of a cluster of personality-related
    traits revolving around distrust (e.g., Abalakana-Paap, Stephan, Craig, & Gregory,
    1999; Darwin, et al., 2011), delusional thinking (e.g., Swami, et al., 2011),
    and alienation (e.g., Brotherton, French, & Pickering, 2013). Consistent with
    these studies, believing in conspiracy theories allow people who are high in these
    traits to reject any official explanation offered by the “establishment” as being
    false. We examine whether and how perceived political corruption may moderate
    the effect of social identification with an opinion-based group and conspiracy
    beliefs on ingroup justification tendencies.


    An opportunity to test these ideas presented itself in the context of the social-political
    conflict in Ukraine, three years after the annexation of Crimea by the Russian
    Federation.'
