  md: 'conspires to hide the evidence for such a relationship. This motivates these
    citizens to deny themselves and their children important vaccines. Empirical research
    underscores such detrimental health consequences of conspiracy theories for believers:
    Exposing research participants to antigvaccine conspiracy theories lowers their
    intentions to have a child vaccinated (Joley & Douglas, 2014b). Moreover, the
    findings are not specific for health-related conspiracy theories: More general
    conspiracy beliefs predict a preference for alternative over regular, evidence-based
    medical approaches (Lambert & Imhoff, in press).


    Furthermore, a surprisingly common conspiracy theory among the African American
    population that contraceptives are a form of genocide. Belief in this conspiracy
    theory shapes negative attitudes towards contraceptives and predicts decreased
    use of contraceptives particularly among men (Thorburn & Bogart, 2005). Relatedly,
    in South Africa AIDS conspiracy theories are common—stimulating for instance that
    HIV was deliberately created by humans in the laboratory, and that the pharmaceutical
    industry promotes the “HIV hypothesis” to sell expensive harmful antireviral drugs.
    These conspiracy beliefs are really associated with unscientific and dangerous
    beliefs such as HIV is harmful, or that use causes HIV infections. A study conducted
    in Cape Town reveals that belief in AIDS conspiracy theories strongly predicts
    reduced condom use among both men and women (Grebe & Nattress, 2012). In fact,
    one believer of AIDS conspiracy theories was Thabo Mbeki, President of South Africa
    from 1999 to 2008. Statistical model estimates indicate that in the period between
    2000 and 2005, approximately 330,000 South African people died due to governmental
    decisions not to implement antireviral treatment programs (Chigwere, Seage, Gruskin,
    Lee, & Essex, 2008).


    Belief in conspiracy theories also has implications for people''s interpersonal
    relationships. It has been noted that people who believe conspiracy theories can
    be subject to stigmatization (Harambam & Aupers, 2015). Consistently, expressing
    conspiracy theories increases expectations of negative evaluations, and fear of
    being socially excluded (Lantian, Muller, Nurra, Klein, Berjot, &


    This article is protected by copyright. All rights reserved.'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'Pantazi, this Volume). Furthermore, evidence suggests that belief in conspiracy
    theories is associated with problematic interpersonal relationships. Specifically,
    belief in conspiracy theories is correlated with a range of individual difference
    variables that reflect impoverished interpersonal functioning, such as interpersonal
    paranoia (Darwin, Neave, & Holmes, 2011), narcissism (Cichocka, Marcheleska, &
    Golec de Zavala, 2016), disagreeableness (Swami et al., 2011), insecure attachment
    (Green & Douglas, 2018) and Machiavellianism (Douglas & Sutton, 2011). While future
    research would need to examine the effects of conspiracy beliefs on the quality
    of interpersonal relationships more directly, the findings observed far are consistent
    with the idea that endorsing conspiracy theories is associated with poorer interpersonal
    functioning.


    Conspiracy beliefs also have implications for a range of societal developments.
    For instance, conspiracy beliefs predict feelings of alienation from politics
    (Goertzel, 1994), and correspondingly, a manipulation of conspiracy theories decreased
    participants’ willingness to vote in elections (Jolly & Douglas, 2014a; Study
    1). Relatively, exposure to conspiracy theories decreases public support for important
    policies. Climate change conspiracy—which typically assume that the problem of
    global warming is a hoax—decrease citizens’ willingness to reduce their carbon
    footprints (Jolly & Douglas, 2014a; Study 2; see also Douglas & Sutton, 2015),
    as well as their prosocial behavior generally (Van der Linden, 2015). Furthermore,
    conspiracy beliefs are empirically associated with populism (Silva, Vegetti, &
    Littvay, 2017) and political extremism'' movements (e.g., groups of Neo-Nazi,
    violent anti-globalists, religious fundamentalists, and the like) are characterized
    by excessive conspiracy beliefs. Bartlett and Miller (2010) argued that conspiracy
    theories causally contribute to the process of radicalization, and the violent
    tendencies, of such extremist fringe groups.


    The above arguments paint a bleak picture of the consequences of conspiracy theories
    and conspiracy beliefs, and indeed, the current state of affairs in this research
    domain suggests that the majority of consequences are negative. It should be noted,
    however, that not all


    This article is protected by copyright. All rights reserved.'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'consequences are necessarily negative. For instance, conspiracy theories can
    inspire and justify protest movements (Imhoff & Bruder, 2014; see also Chayinska,
    Minescu, & Colucci, this Volume), and whether that is positive or negative depends
    on the type of social change that these movements pursue. Furthermore, conspiracy
    theories can increase governmental transparency (Clarke, 2002), and belief in
    conspiracy theories is associated with increased support for democratic principles
    (Swami et al., 2011). Indeed, a fruitful avenue for further research would be
    to study under what circumstances conspiracy theories are harmful, harmless, or
    even beneficial. Whether one wishes to focus on the upside or downside of conspiracy
    theories, one conclusion remains: Conspiracy theories influence citizens, and
    the society they live in, in significant ways.


    # Principle 2: Conspiracy Beliefs are Universal


    Conspiracy theories are not restricted to specific times or cultures: Citizens
    around the world are susceptible to them, from modern to traditional societies
    (West & Sanders, 2003). Indeed, the tendency to be suspicious of the possibility
    that others are forming conspiracies against one and one''s group may part of
    human nature. The Adaptive Conspiracy Hypothesis proposes that while conspiracy
    theories are not necessarily adaptive in modern environments, they have been adaptive
    among ancient hunter-gatherers who faced the problem of frequent intergroup conflict
    and substantial reproductive loss through colloquial aggression (Van Rooijen &
