  md: '# Results


    Descriptive statistics and correlations are reported in Table 1. Of primary interest
    to the present study, these shows that participants were more likely to agree
    with conspiracy theories if they also tended to infer direct causal relations
    from spurious correlations, r(195) = .39, p < .001.

    In addition, conspiracy belief correlated positively with third cause perceptions,
    r(195) = .16, p = .027, and negatively, but only marginally, with random coincidence
    perceptions, r(195) = -.14, p = .059.


    Most importantly, a linear regression analysis of causal relation, random coincidence
    perceptions, ease, level of education, age and gender in the same model on conspiracy
    belief revealed that the perception of a direct causal relation predicted conspiracy
    belief significantly, B = .29, SE = .06, CI95%[0.17; 0.41], p < .001 (Table 2).


    # Discussion


    In the present study, perceptions of direct causal relationships between spur
    correlated variables were associated with conspiracy thinking. Previous research
    shows that conspiracy thinking is associated with the perception of causal connections
    between random events, between which, by definition, no causal relationships exist
    (van Rooijen et al., 2018). The present results confirm that perception of implausible
    causal relationships between events may underpin conspiracy thinking, and extend
    this to cases in which events are not random, but conform to an objective pattern.
    Importantly, perceptions that the spurious correlation explained either by coincidence
    or the operations of a third cause were not uniquely associated with conspiracy
    thinking. Thus, the critical predictor of conspiracy thinking was not the inference
    of causality (vs. randomness) per se, but the specific, implausible inference
    that a direct causal connection linked the two focal events. In the next study,
    we sought to extend these findings further by including


