  md: '# General Discussion


    Previous research and theory has suggested that conspiracy thinking is determined
    by the desire to impose meaning and order on the world, and should so be related
    to the perception of patterns in the environment (Newheiser et al., 2010; Whitson
    & Galinsky, 2008). Most recently, researchers have investigated the more specific
    relation between conspiracy thinking and perceptions of causal connections between
    events (Diegues et al., 2015; van Rooijen et al., 2018). The primary focus of
    this theory and research has on illusory pattern perception in the case of random
    event sequences in which no objective pattern is present. By definition, no causal
    connections exist between random events, meaning that perceptions of pattern in
    such events depend on implausible causal inferences – an erroneous process of
    “connecting the dots” (van Prooijen et al., 2018) among dots that are necessarily
    unconnected. However, conspiracy theories generally do not attempt to explain
    genuinely random events. Rather, they explain events for which there is a multitude
    of causes, but where observers rely on second-hand, ambiguous, or contested causal
    information (Douglas & Sutton, 2011).


    We therefore to build on previous research by examining whether conspiracy thinking
    is informed by implausible causal inferences when events have some objective structure.
    In Studies 1 and 2, this structure took the form of a spurious correlation between
    events, for which some causal inferences are warranted, but not the specific,
    critical inference that a direct causal connection exists between the two focal
    events. Confirming predictions, conspiracy thinking was related to this specific
    causal inference, and not to the perception that the correlation was a coincidence
    or attributable to a third cause. In Studies 3 and 4, it took the form of temporal
    contiguity, such that the target event occurred as part of a streak of similar
    events (vs in isolation). Confirming predictions, whether measured (Study 3) or
    manipulated (Study 4), the inference that these events were causally connected
    was shown to inform conspiracy explanations for the most recent event in the sequence.


    This article is protected by copyright. All rights reserved.'
