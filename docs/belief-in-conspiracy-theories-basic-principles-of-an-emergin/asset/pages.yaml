  md: 'post-explanation political understanding and actual political knowledge to
    lead to increased change in conspiracy beliefs pre-/post-election among participants
    who voted for the losing candidate (i.e., Clinton supporters). We test these hypotheses
    on endorsement of a general set of political conspiracy theories (Hypothesis 4)
    as well as conspiratorial explanations for the outcome of the election (i.e.,
    perceived electoral illegitimacy; Hypothesis 5).


    More generally, Hypothesis 3, 4 and 5 may appear counter-intuitive, given existing
    evidence suggesting that individuals with high (vs. low) levels of political knowledge
    are more likely to engage in motivated reasoning to explain undesirable or attitudinally-inconsistent
    information (e.g., Taber & Lodge, 2006), which has been found to increase conspiracy
