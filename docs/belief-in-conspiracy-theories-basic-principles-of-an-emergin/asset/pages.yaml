  md: '# Study 1


    In this study, the main goal was to test whether getting people to defend (vs.
    criticize) conspiracy theories by writing a short essay, would lead them to fear
    social exclusion. This effect is expected to be mediated by an anticipated negative
    evaluation resulting from the defense of conspiracy theories. A secondary goal
    was to test whether people think that those who believe in conspiracy theories
    are negatively judged (assessed with a specific item detailed below). Finally,
    a baseline measure of conspiracy beliefs allowed us 1) to run additional exploratory
    analyses on the potential moderating effect of conspiracy on our variables, and
    2) to study the relation between conspiracy beliefs and people’s perceptions (in
    general and members of their social circle) of believers in conspiracy theories.


    # Method


    Materials and procedure. The study was conducted online. In the present study,
    we made participants believe that we were studying the ability to argue, more
    precisely, the ability to convince others during a debate. Participants were told
    that the computer program controlling the experiment would randomly select a topic,
    and that they would defend a specific and imposed viewpoint on this topic. We
    stipulated that regardless of their real opinion on this issue, their task consisted
    in defending this imposed viewpoint as convincingly as possible. We added that
    their arguments would be compared with the arguments of another internet user
    having been instructed to defend the opposite viewpoint, as in a television debate.
    We specified that to identify who argued best, judges would evaluate and tell
    by whom they were the most convinced.


