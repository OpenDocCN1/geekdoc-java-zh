  md: 'Our next exploratory investigation involved testing if people''s baseline measure
    of belief in conspiracy theories was related to their guessing about how French
    people perceive people who believe in conspiracy theories regarding the Charlie
    Hebdo attacks ($M = 2.59, SD = 1.16$), as well as how people from their own social
    circle (i.e., their acquaintances) perceived people who believe in such theories
    ($M = 2.73, SD = 1.41$). We observed that participants'' baseline measure of belief
    in conspiracy theories was not significantly related to how they think the French
    people perceive those who believe in conspiracy theories about Charlie Hebdo events,
    $r(140) = .03$, 95% CI [-.14, .19], $p = .76$. However, the more participants
    believe in general conspiracy theories, the more they think that people from their
    own social circle positively evaluate who believe in conspiracy theories about
    Charlie Hebdo events, $r(140) = .36$, 95% CI [.21, .50], $p < .001$.


    In sum, the results of Study 1 allow us to confirm our main prediction that people
    who defend conspiracy theories expect to be negatively judged, which, in turn,
    leads them to fear social exclusion. General baseline susceptibility to conspiracy
    theories seems to play a role in this stigmatizing mechanism, but to some extent:
    The more people are susceptible to believe in conspiracy theories, the less being
    able to defend conspiracy theories (rather than criticize) them anticipate negative
    evaluation of the self. When defending conspiracy theories, people who do not
    believe in conspiracy theories felt negatively evaluated and reported fear of
    social exclusion, but it is also the case, albeit to a lesser extent, for people
    who moderately and strongly believe in conspiracy theories. Nevertheless, that
    these exploratory results should be treated with caution given that our sample
    size planning was based on the test corresponding to our main hypothesis, and
    not this exploratory analysis. Study 2 tested the replicability of our main findings.'
