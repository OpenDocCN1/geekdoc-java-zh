  md: '# General Discussion


    In this study, we examined the role of inflated confidence in one’s causal understanding
    of political phenomena for endorsement of conspiratorial beliefs. The average
    person possesses superficial understanding of causal relations and, consequently,
    tends to overestimate the quality and depth of their explanatory knowledge (e.g.,
    Kruger & Dunning, 1999; Wilson & Keil, 1998). This illusion of explanatory depth
    has been recognized in a broad range of areas (e.g., Rosenblatt & Keil, 2002),
    a paucity of research investigated these processes in political domains (both
    as Fernbach et al., 2013) — an inherently abrust yet contextual context (e.g.,
    Conover & Feldman, 1989; Delli Carpini & Keeter, 1996; Vitriol, Reif Tager, &
    Federico, 2017; Wilson & Keil, 1998). Conspiratorial beliefs serve as explanations
    for complex, ambiguous, and threatening political phenomena (e.g., Graupner &
    Coman, 2016; Miller, Saunders, & Farhart, 2015; Sunstone & Vermeule, 2009; Swami
    & Coles 2010; Uscinski & Parent, 2014; Federico, Williams, & Vitriol, 2017). Accordingly,
    we reasoned that illusions of explanatory depth for political phenomena would
    be uniquely related to endorsement of conspiratorial beliefs. Yet, to the extent
    which illusions of causality and explanatory understanding underpin conspiratorial
    thinking, as has been observed for belief in pseudoscience and superstition (e.g.,
    Matute, Yarritu, & Vadillo, 2011), has been empirically and theoretically neglected.


    We addressed this gap in research in the psychology of conspiratorial beliefs
    in the context of the 2016 U.S. Presidential Election. We found that requiring
    participants to explain political and non-political phenomena decreased self-reported
    belief confidence, consistent with other research on the IOED (e.g., Fernbach
    et al., 2013; Fisher & Keil, 2014; Kominsky & Keil, 2014; Zeveney & Marsh, 2016).
    More importantly, we found that variability in post-explanation confidence in
    one’s understanding of political (but not non-political phenomena) predicted general
    conspiratorial beliefs, the net effects of a broad range of variables known to
    associate with conspiratorial ideation. In other words, people who still held
    high confidence in their political understanding despite the sobering effects
    of explanation were more likely to conspiratorial beliefs. Together, this pattern
    of


