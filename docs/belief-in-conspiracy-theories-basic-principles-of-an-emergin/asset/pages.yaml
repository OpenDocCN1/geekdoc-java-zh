  md: '# Study 1: Meta-analytic Review of the Link between Belief in Conspiracy Theories
    and Paranoia


    As a starting point, we reviewed the available literature on the existing connection
    between endorsement of conspiracy theories and paranoid thinking and synthesized
    a meta-analytic estimate of its strength.


    # Method


    Data collection, inclusion criteria and coding. We conducted a systematic literature
    search on the Web of Science (January 14, 2018) with the two keywords "conspiracy"
    and "paranoia". Searching through the 51 results, we identified four articles
    that reported at least one study with a quantitative measure of the correlation
    between conspiracy beliefs and paranoia. We added another four articles that we
    knew of but were missing from this results list. These eight articles yielded
    eleven independent studies reporting a correlation of the two construct of interest
    (see Table 1; for more detail on excluded articles and studies see OSF).


    Effect Size Measure. We included studies which reported correlational data and
    used the correlation coefficient r transformed into Fisher’s z (Fisher, 1915;
    for discussion Fisher’s z as effect size for meta-analyses we Hafdahl & Williams,
    2009). All of the studies showed scales where higher values indicated a higher
    agreement, that positive correlations indicated that higher levels of paranoia
    come along with a higher level of conspiracy thinking and vice versa.


    # Results


    We included k = 11 studies in the meta-analysis on paranoia. The sample sizes
    ranged from 50 to 269 participants ($M_{Sample}$ = 182.36, $SD_{Sample}$ = 117.21).
    In total, $N = 2006$ participants were included in the analysis. As there was
    considerable heterogeneity, $Q(10) = 29.28, p = .0011$, we used – based on recent
    recommendations (Viechtbauer, 2005) – a random-effects model with restricted maximum
