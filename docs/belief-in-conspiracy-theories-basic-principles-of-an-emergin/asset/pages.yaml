    # How paranoid are conspiracy believers? Towards a more fine-grained understanding
    of the connect and disconnect between paranoia and belief in conspiracy theories


    Abstract

    Public discourse and scholarly literature often make a strong connection between
    paranoid thought and belief in conspiracy theories. We report one meta-analysis
    and two correlational studies across two distinct cultural contexts (total N =
    578) to provide an estimate for this association but also its distinctiveness
    via a multi-trait-method approach. Whereas the meta-analysis (k = 11 studies)
    provided support for a reliable association between paranoia and conspiracy beliefs,
    two additional studies provide direct evidence for their distinctiveness and divergent
    associations with other constructs. Although both sincere intentions of others,
