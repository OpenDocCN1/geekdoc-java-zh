    # Principle 4: Conspiracy Beliefs are Social


    Conspiracy theories are a social phenomenon in that they reflect the basic structure
    of intergroup conflict. Conceptually, beliefs qualify as conspiracy theories only
    when they involve assumptions of hostility and threatening outgroup or coalition
    (Van Rooijen & Van Vug, in press). Moreover, these conspiracies typically plan
    to harm or deceive not just one individual but a wider collective, as is the case
    with conspiracy theories implying political organizations, branches of industry,
    minority groups, managers, and so on. Accordingly, conspiracy beliefs flourish
    among members of groups who are involved in mutual conflict (Pipes, 1997). Consistently,
    while belief in


