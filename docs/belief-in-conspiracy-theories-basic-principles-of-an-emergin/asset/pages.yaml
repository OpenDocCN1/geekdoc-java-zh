  md: 'provided two key insights that laid the foundations for current research conspiracy
    theories. The first key insight is that although conspiracy theories differ widely
    in content, subjective beliefs in them are rooted in the same underlying psychology.
    This insight is suggested by findings that the single best predictor of belief
    in one conspiracy theory is belief in a different conspiracy theory (Goertzel,
    1994; see also Lewandowski, Oberauer, & Gagnac, 2013; Swami et al., 2011; Sutton
    & Douglas, 2014). Even beliefs in mutually incompatible conspiracy theories are
    positively correlated (e.g., Princess Diana was murdered; Princess Diana staged
    her own death; Wood, Douglas, & Sutton, 2012). While many distinct conspiracy
    theories exist, the tendency to believe in them appears to be underpinned by broader
    beliefs that support conspiracy theories in general (e.g., beliefs in cover ups;
    Wood et al., 2012). Some scholars argue for *conspiracy mindset* as a relatively
    stable predisposition to believe in conspiracy theories that vary between persons
    (Imhoff & Bruder, 2014). Despite the high variability in conspiracy theories—involving
    topics that range from climate change to chronic illnesses to terrorist attacks—research
    demonstrates that largely similar and predictable psychological processes drive
    people’s belief in.


    The second insight is that besides individual differences, belief in conspiracy
    theories is highly sensitive to social context. For instance, ideological motivations
    influence political conspiracy beliefs depending on election results (e.g., Democrats
    believe governmental conspiracy theories particularly if there is a Republican
    in the White House, and vice versa; Wright & Arbutnot, 1974; see also Gole de
    Zavala & Federico, *this Volume*; Uscinski & Perez, 2014; Van Bavel & Pavei, 2018).
    Moreover, throughout history people have believed conspiracy theories particularly
    in impactful societal crisis situations, such as during fires, floods, earthquakes,
    rapid societal change, violence, and wars (McCauley & Jacques, 1979; see also
    Van Proijen & Douglas, 2017). Finally, social structures that shape citizens’
    feelings of vulnerability increase belief in conspiracy theories, as reflected
    in findings that feelings of powerlessness predict conspiracy beliefs (Abalakana-Paap
    et al.,


