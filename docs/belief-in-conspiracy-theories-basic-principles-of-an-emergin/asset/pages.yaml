    # Discussion


    The present study produced three novel and important effects. First, participants
    favoured

    conspiracy explanations when they were told that events were causally connected
    (vs. causally

    unconnected). This provides experimental evidence that conspiracy thinking is
    promoted by the

    perception that events are causally connected. Second, participants favoured conspiracy

    explanations for events that were preceded (vs. not preceded) by similar events
    in the recent past.

    This finding addresses a largely neglected question – namely what types of events
    are most likely to

    attract conspiracy thinking (but we see Leman & Cinnirilla, 2007, for evidence
    that conspiracy

    explanations are more likely for events that are especially socially significant).
    Kovic and Fuchslin (in

    press) found conspiracy thinking is elicited by highly improbable events. The
    present findings

    are broadly consistent with that result insofar as the focal event may be seen
    as less probable in the

    context of a rash of similar events. Third, and most important to our central
    argument, the first two

    effects were independent of each other: seeing events as causally connected increased
    conspiracy

    theory irrespective of whether events co-occurred or were relatively isolated.
    This suggests that

    conspiracy theories are a manifestation of a desire to impose a causal interpretation
    on events,

    whether or not those events comprise an objective co-occurrence.'
