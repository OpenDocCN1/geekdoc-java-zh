  md: 'in terms of strength of stigma. Indeed, beyond the suspicion of mental health
    disorders for people defending conspiracy theories as well as their harmful effects
    pointed by academic circles, the journalists and the civil society as a whole
    seem worried by the dangerousness of conspiracy theories. This is evidenced by
    governmental initiatives to counter conspiracy theories in school (Bronner et
    al., 2016). In this sense, through their suspected link with extremism and violent
    action (Bartlett & Miller, 2010), the challenge they pose to political legitimacy
    and the status quo (Imhof & Brunker, 2014; Sapountzis & Condor, 2013), for instance
    by accusing the elites (qualified as ‘evil’), Campion-Vincent, 2005), conspiracy
    theories are viewed as posing a potential threat in terms of social order and
    peace. In short, this form of belief is particularly loaded in terms of potential
    threat, which makes it more susceptible to stigmatized.


    A less central result found in our two studies is that high believers in conspiracies
    think that people from their own social circle judge those who believe in conspiracies
    less negatively. This judgment reflects an inference based of people’ daily interaction,
    this observation could indicate that the social network of conspiracy believers
    is probably made of more people sharing their views. This is in line with a recent
    finding suggesting an important sense of community among conspiracy believers,
    as a thematic dimension forming conspiracy viewpoints (Franks, Bangerter, Bauer,
    Hall, & Noord, 2017). This possibility could question the potential efficiency
    and relevance of attempts to change people’s belief at an individual level, without
    taking into account the beliefs shared at the group level, that is, the foundation
    of their social identities. We should consider this last point because people
    seek belief consonance to fit into their social group and protect the core values
    and beliefs about self (Golman, Loewenstein, Moore, & Zee, 2016). It is important
    to consider the question of social identity by integrating it to the specific
    context involved in our two studies. Indeed, in these studies, we insisted on
    the fact that people who will read participants’


