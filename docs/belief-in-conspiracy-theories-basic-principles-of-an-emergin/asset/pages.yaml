    # General Discussion


    These data provide evidence for the hypothesis that chronic social devaluation,
    at least in part, drives African Americans to endorse race-related conspiracy
    theories. Evidence from a representative US sample showed that African Americans
    endorse race-relevant conspiracy theories in a pattern consistent with the social
    devaluation hypothesis. Additionally, the magnitude of the correlations between
    belief in race-relevant conspiracy theories and ethnicity were larger than that
    of general conspiracy theories suggesting that the racial component of a conspiracy
    its self-relevance to an ethnic minority beyond general conspiracy theories. Study
    2 provides experimental evidence that social devaluation causes African American
    endorsement of race-relevant, but not race-neutral conspiracy theories. Study
    2 also indicates that social devaluation may not cause African Americans to blame
    the social system for their disadvantaged status. Endorsement of race-relevant
    conspiracy theories in particular seems to be one way for African Americans to
    manage chronic social devaluation (evidenced by the interaction patterns above).
    Additionally, this pattern persists in a model that includes a test of the system
    hypothesis, supporting the notion that race-relevant conspiracy theories can address
    a social motivation for African Americans that is distinct from blaming the social
    system.


    These findings suggest that African Americans may be more likely to endorse the
    government deliberately flooded the poor areas of New Orleans for example, not
    only because of real experiences of discrimination, but also because such a belief
    satisfies the kind of meaning search that is likely triggered by chronic social
    devaluation (cf. Davis & Reyna, 2015; Grauehner & Coman, 2017). In contrast, the
    birther conspiracy can be construed as further evidence of the


