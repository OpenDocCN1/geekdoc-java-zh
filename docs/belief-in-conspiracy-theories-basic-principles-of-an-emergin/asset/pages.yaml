  pgno: 330
- img_proc: true
  md: 'hostile intergroup attitudes and behaviors, especially in retaliation to offences
    to the in-group, both past and present and actual and imagined (Cichocka, 2016;
    Golec de Zavala, in press). hypersensitivity of CN to in-group threat may fuel
    a general tendency to engage in conspiracy explanations of what collective narcissists
    believe—that their in-group is constantly threatened and under attack. Thus, conspiracy
    thinking may have a ''elective affinity'' (Jost, Federico, & Napier, 2009) with
    the motivations of those high in CN. It provides safe, externalizing explanations
    for in-group''s lack of sufficient recognition and provides a sense that the in-group
    is significant and unique by virtue being a target of secretive plots and attacks.


    Interestingly, our results imply that the conspiracy thinking associated with
    collective narcissism may evolve and become more extreme in response to increased
    silence of information that seemingly confirms collective narcissists'' vision
    of intergroup relations. A similar dynamic is suggested by recent work on the
    relationship between CN and political extremism. Collective narcissists exposed
    to contexts that ideologically normalize radicalism are more likely to show extreme
    intergroup hostility (Jasko, Weber, & Kruglanski, 2017). This suggests that certain
    environments may enable collective narcissists to openly express their intergroup
    hostility. In a similar fashion, the results of the present study show that some
    political campaigns by frequent conspiracy rhetoric may legitimize the Conspiracy
    thinking collective narcissists appear to be prone to.


    Despite the aforementioned strengths, our study is not without limitations. First,
    although we controlled for a number of relevant variables, we were unable to include
    a measure of individual narcissism due to survey-length considerations. Previous
    studies suggest that individual narcissism is related to general conspiracy thinking,
    while CN predicts the belief in conspiracies involving out-groups and intergroup
    antagonism (Cichocka, et al. 2015; Golec de Zavala, in press). Thus, some portion
    of the variation in conspiracy thinking that we observe may actually be accounted
    for by


    This article is protected by copyright. All rights reserved.'
  merge: -1
  pgno: 331
- img_proc: true
  md: 'individual narcissism. However, given that our conspiracy thinking index specifically
    implicates intergroup antagonism, we are confident that we would observe a net
    relationship between CN and the former even given inclusion of individual narcissism
    as a control.


    Second, inferences about the directionality of the effects in our study must be
    made with caution. Although our longitudinal design and use of a conditional-change
    model helps out the possibility of feedback effects, one concern is that CN was
    measured in the first wave of the survey rather than the first. Unfortunately,
    logistical constraints made it impossible to include CN in an earlier wave. Though
    our specification can be used in longitudinal modeling, estimates may be biased
    if CN changes over time (Finkel, 1995, p. 13). However, previous work suggests
    that CN is relatively stable over time (Federico & Golec & de Zavala, 2018; details
    in the online appendix), ameliorating this concern. Nevertheless, replications
    using a more-optimal design are advised. Future studies will do well deal with
    this and the other concerns we outline above.


