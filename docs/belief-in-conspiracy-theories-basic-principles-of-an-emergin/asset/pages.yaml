  md: '# Conspiracy thinking and perceiving pattern and causality in random events


    Scholars have argued that conspiracy beliefs are motivated by the desire to explain
    and find and meaning in events that might otherwise seem random, unpredictable,
    or outside of one''s control (Goertzel, 1994). Although early research did not
    test this directly, several findings provided indirect support for it. For example,
    conspiracy beliefs were found to be more prevalent among disadvantaged groups,
    who presumably have a need to explain events beyond their control (e.g., Crocker,
    Luhtanen, Broadmax, & Blaine, 1999; Goertzel, 1994; Thorburn & Bogart, 2005).
    Other findings indicate that individuals are more likely to endorse conspiracy
    beliefs if they are dispositionally high in need of compensatory control, including
    alienated and powerless individuals (e.g., Abalakina-Paap, Stephan, Craig, & Gregory,
    1999). In a direct test of this idea, Whiton and Galinsky (2008) found that participants
    who were experimentally made to feel powerless were more inclined to perceive
    patterns (identifiable shapes such as animals and buildings) in visual stimuli
    and were also more inclined to endorse conspiracy theories.


    Whiton and Galinsky''s (2008) results suggest that there is a relationship between
    conspiracy belief and the perception of patterns. Both are the products of an
    underlying motivation to restore control by imposing meaning on the environment.
    As Whiton and Galinsky put it (see Diegues, Wagner-Egger, & Gavrit, 2015), conspiracy
    theories can be seen as the “identification of a coherent and meaningful relationship
    among a set of random or unrelated stimuli” (p. 115). However, Whiton and Galinsky
    (2008) examined the correlation between the perception of visual patterns and
    conspiracy belief indirectly, by showing that they were both increased by a lack
    of control.


    Visual pattern perception is one means of imposing order on random stimuli. A
    related mechanism involving perceiving patterns in event sequences. People tend
    to be surprised by how random processes throw up results that look ordered, for
    example long streaks of heads or tails in coin tosses. In principle, people may
    notice these co-occurrences without assuming that the


