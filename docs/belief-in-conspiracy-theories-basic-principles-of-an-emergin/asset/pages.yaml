  md: '# H2: An Illusion of Political Understanding Will Increase Endorsement of Conspiracy
    Theories


    Here, we investigate the predictive utility and incremental effect of political
    vs. non-political IOED on pre-election conspiracy beliefs, above and beyond the
    effects of known correlates of endorsement of conspiracy theories³, including
    demographics, partisan and ideological self-placement, political and interpersonal
    trust, political cynicism and efficacy, and political knowledge. Because participants’
    confidence in their self-reported understanding of political or non-political
    phenomena decreased post-explanation in the IOED paradigm, post-explanation self-reported
    understanding serves as an indicator of the extent to which participants have
    confidence in their causal causal understanding, despite the act of explanation
    providing reasons to doubt the quality of their own judgment (e.g., Rozenblit
    & Keil, 2002). We expect variability in post-explanation belief confidence in
    the political (but not the non-political) domain to be associated with conspiracy
    beliefs (H2).


    For these analyses, ordinary least squares regression was used to regress T1 conspiratorial
    beliefs on post-explanation self-reported understanding of politics or devices,
    separately, along with the aforementioned covariates. Robust standard errors were
    used in all tests on coefficients in this section to protect against heteroskedasticity
    (Long & Erwin, 2000). Results suggest that self-reported understanding of politics
    post-explanation was associated with increased T1 endorsement of conspiracy ($b25,
    95% CI(.06, .44), $p=.01$). In contrast, post-explanation understanding of devices
    was unrelated to T1 conspiracy beliefs ($b=.14, 95% CI(.03, .31), $p=.13$). These
    findings provide support for our hypothesis that ratings of political understanding
    post-explanation are a robust predictor of conspiracy beliefs (H2). Furthermore,
    these results show that it is not just any type of high confidence that


