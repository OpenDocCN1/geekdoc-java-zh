  md: 'interpretation of conspiracy beliefs, the way that lay people perceived the
    role of responsibility and controllability in the origins of beliefs (and by extension
    conspiracy beliefs) remains unknown (see Engel, 2002, for a philosophical discussion;
    see also Pachankis et al., 2018, for deriving preliminary thoughts about this
    topic by looking at the relatively high score of perceived controllability of
    the stigmatized statuses of atheist).


    More generally, it is important to put the the question of social perception of
    conspiracy theories in a broader context. In this Information Age marked by the
    spread of the Internet, this new medium of communication has led to important
    changes in our lives: not only the format of dissemination and reception of information,
    but that its nature itself (Bonner, 2015). Historically, conspiracy theories were
    considered as "fringe ideas", but according to Barkun (2016), the development
    of the Internet, in combination with the elimination of gatekeepers, the general
    trust for authority, and the spread of conspiracy narratives in the popular culture,
    erodes the boundary between the fringe and the mainstream. This is what Barkun
    calls "mainstreaming the fringe" (Barkun, 2016, p. 4). This transition could weigh
    against the development of the stigmatized status associated with conspiracy theories.


    Nevertheless, even if the context changed and even if conspiracy theories have
    become more mainstream, peoples'' representations do not necessarily change quickly.
    It turns out that conspiracy theories are not just narratives like any others.
    Our contribution shows that people consider conspiracy theories as a social cost.
    It turns out that ridiculing arguments of those who believe in conspiracy theories
    is effective to reduce belief in conspiracy theories (Oros et al., 2016), the
    challenge is to ensure, at the same time, that we avoid contributing to this stigma.
    Hence, interventions aimed at addressing this important societal phenomenon should
    take into account this aspect.


    To conclude, it is highly likely that during your next professional dinner, you
    will naturally choose to avoid certain topics or holding certain positions. Our
    studies place


