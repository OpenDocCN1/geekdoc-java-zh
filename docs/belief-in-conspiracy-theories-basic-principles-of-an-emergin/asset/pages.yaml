    The patterns presented in this paper show support for the social devaluation hypothesis
    should be viewed as just a beginning. Race-related conspiracy theories seem to
    provide an avenue for African Americans compensate for the social devaluation
    they experience but we recognize the need to clarify the precise mechanisms. For
    example, our theoretical analysis involves speculation (albeit based on the existing
    literature) that social devaluation from stigma leads to a socially motivated
    meaning that is satisfied by belief in race-relevant conspiracy theories, but
    we did not directly measure meaning search. More work is needed to understand
    whether African Americans'' endorsement of race-relevant conspiracy theories follows
    the precise causal links that we propose. Nevertheless, our research points to
    the importance of recognizing that conspiracy theory endorsement is a function
    of multiple mechanisms that likely operate in tandem to fulfill different motivations
    for individuals in a society.


