- img_proc: true
  md: 'The present research therefore indicates that conspiracy thinking is driven
    by a general permissiveness in causal inference – specifically, the willingness
    to perceive causal connections where none are likely. This tendency is well-established
    in research on causal inference, where it has been dubbed


    “the illusion of causality” (Blanco & Matute, 2018, p. 45), and contributes to
    pseudososcientific beliefs (Blanco & Matute, 2018), the rejection of science (Rutgens,
    Heine, Sutton, and van Harreveld, 2018), and belief that misfortunes are cosmic
    punishments for objectively unrelated wrongdoings (Callan et al., 2014). It is
    responsible for the perception of pattern in random event sequences (van Prooijen
    et al., 2018), and as the present studies indicate, for causal inferences linking
    events that comprise part of some objective pattern but are not causally related
    to each other.


    Permissive and unconventional causal thinking is captured by the individual difference
    magical ideal (Eckblad & Chapman, 1983), which has been shown to be related to
    conspiracy thinking (Darwin et al., 2011; Douglas et al., 2016; Lobato et al.,
    2014). In Study 2, we found this variable to be related not only to conspiracy
    thinking but to the perception of direct causal relations between spurious correlations.
    Our findings suggest that magical and conspiracy beliefs are linked not only because
    each is (in general) “epistemically unwarranted” (Lobato et al., 2014, p. 617),
    but because each reflects a common psychological process, namely the imposition
    of physically impossible causal interpretations over co-occurrences.


