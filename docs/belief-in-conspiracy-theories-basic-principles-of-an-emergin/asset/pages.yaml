    # Aims and Scope


    Sponsored by the European Association of Social Psychology, the European Journal
    of Social Psychology is a timely international journal that provides a forum for
    high-quality, peer-reviewed research on all the various aspects of social psychology.
    Our open-access journal encourages submissions that provide a significant contribution
    to the understanding of social psychology. We welcome papers that are based on
    empirical, meta-analytical or theoretical research. Methodological contributions
    to social psychology are also welcome.


    The journal aims to publish research that focuses on various aspects of social
    psychology and contributes to the field. The topics covered include, among others,
    intergroup relations, group processes, social cognition, attitudes, social influence
    and persuasion, social change, emotion, embodied and situated cognition, culture
    and cross-cultural phenomena, social psychology and individual differences of
    social psychology.'
