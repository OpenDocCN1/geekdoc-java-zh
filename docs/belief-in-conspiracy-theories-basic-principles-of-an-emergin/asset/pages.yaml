    Nevertheless, it does not appear that the descriptively different effect sizes
    between the main mediation model in Studies 1 and 2 are due to the differences
    in the quality of the imaginary product between the two experimental conditions
    (see Supporting Information S2 for the details).


    # General Discussion


    Overall, the current findings support the idea that conspiracy theories could
    be considered as a social stigma. In Study 1, asking people to produce supporting
    conspiracy theories about the Charlie Hebo shooting led them to expect strangers
    reading their words would evaluate them negatively, which in turn, led them to
    expect that those same people would socially exclude them. In Study 2, asking
    people to imagine defending conspiracy theories about Charlie Hebo shooting produced
    the same effects. Thus, a consistent finding emerges from these results: In people’s
    minds, publicly espousing conspiratorial claims renders them the object of negative
    evaluations and behaviors from others (i.e., by being socially excluded).


    These results allow us to go further the conclusions drawn by a relatively more
    indirect investigation of the hypothesis of conspiracy theories as a social stigma
    (see Wood, 2016). Wood (2016) tested whether the mere use of the label “conspiracy
    theory” produces a negative effect on the credibility of an idea, which could
    be taken as provide evidence for thecrediting power behind the label “conspiracy
    theory” (Hurst & Orr, 2007), and by extension, for the stigma attached to conspiracy
    theories. In his experiments labeling written contents (i.e., conspiracy claims
    as “conspiracy theories” versus “ideas”, did not have an effect on their perceived
    veracity. Setting aside usual methodological and statistical limitations associated
    with the acceptance of the null hypothesis (Harcum, 1990), these inconclusive


    This article is protected by copyright. All rights reserved.'
