  md: 'Whether or not the endorsement of conspiracy theories *actually* fulfill this
    motivational functions is a separate yet particularly interesting question. Conspiracy
    theories can have tangible detrimental effects on both individuals and groups
    (see: Douglas, Sutton, Jolley & Wood, 2015), and can often exacerbate the very
    motives that are purportedly being addressed (e.g., they are sought after mistrusting
    people but actually make people even more mistrustful; Douglas, Sutton, & Cichocka,
    2017). This seeming paradox is true for many compensation strategies that have
    been examined under the rubric of stigma compensation theory. For example, low-income
    individuals often more aggressively reactive in the face of insults, and this
    function to protect a self that is otherwise chronically devalued (Henry, 2009);
    however, aggression as a strategy is not especially socially adaptive. In case
    of conspiracy theory endorsement, while those who are stigmatized and otherwise
    ostracized seek them out for the particular meaning they confer, may not actually
    manage the very motivational issues they are sought to address.


    These data highlight the need for more research into the functions of conspiracy
    theories, especially for stigmatized groups. Very little research has examined
    race-based conspiracy theories. Theories specifically. The system blame hypothesis
    (Crocker et al., 1999) is thus far the only explanation for why minorities might
    be drawn to race-based conspiracy theories. African Americans are subject to greater
    rates of prejudice and discrimination and it makes sense that conspiracy theories
    against them are more plausible; however, when subject to closer scrutiny it seems
    that system blame exists on the same continuum as conspiracy theories and is a
    less extreme form of the same psychological construct. The conceptual distinction
    between system blame and conspiracy theory is the standard of evidence. Beliefs
    in conspiracy theories must prevail in the face of considerable evidence that
    prejudice and discrimination are demonstrably true (and doubt a frequent experience
    for most African Americans). Despite this somewhat tautological reasoning and
    the correlational nature of these data, this hypothesis remains the most salient
    explanation for ethnic minority endorsement of race-relevant conspiracy theories.
    Future research should address this issue by demonstrating support for the system
