  md: 'Given that the average person possesses only a superficial grasp of many phenomena
    in daily they regularly interact with such as zippers or watches (Wilson & Keil,
    1998), it is no surprise that the complexity of political events, actors, and
    policies may likewise not be well understood (e.g., Conover & Feldman, 1989; Deli
    Carpini & Keeter, 1996). Perhaps in part people tend to believe they are more
    objective and biased than others (e.g., Pronin, 2007), many express excessive
    confidence in the superiority of their political beliefs (Raimi & Leary, 2014),
    despite lacking the ability to properly ascertain their own competence in most
    domains (Dunning, Johnson, Ehrlinger, & Kruger, 2003). Importantly, the act of
    explaining a political policy has been shown to be able to expose how little people
    actually understand these political phenomena and result in a reduction of self-reported
    understanding of such policies (Alter, Oppenheimer, & Zemla, 2010; Fernbach et
    al., 2013).


    Previous work has suggested, people generally overestimate their knowledge and
    understanding of complex phenomena. In this paper, we explore whether the tendencies
    towards inflated confidence in one’s causal understanding of political phenomena,
    and a resistance to changing this confidence, are particularly pronounced among
    those who endorse conspiracy beliefs. Previous work has a basis for this possibility.
    Individuals with (vs. less) accurate knowledge of politics are indeed less likely
    to endorse conspiracy beliefs (Berinsky, 2012).


    Furthermore, some work indicates that belief superiority and overconfidence can
    lead to political extremism (Fernbach et al., 2013; Raimi & Leary, 2014), and
    that political extremism covaries with increased endorsement of conspiracy theories
    (van Proooijen, Krouwel, & Pollet, 2015). These previous studies suggest that
    a well-calibrated understanding of one’s own knowledge in the political domain
    might buffer against acceptance of conspiratorial explanations. In this paper,
    we conduct a novel investigation of whether people who overestimate or maintain
    confidence in their understanding of the causal relations among political phenomena
    are particularly likely to perceive conspiratorial influences behind political
    phenomena. Building on existing cognitive perspectives that focus on the role
    of paranoid cognitions and illusory pattern perceptions


