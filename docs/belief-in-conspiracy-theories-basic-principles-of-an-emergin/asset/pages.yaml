  md: 'Study 1 has some important limitations. Without a specific measure or experimental
    manipulation, these data do not directly test the social devaluation hypothesis.
    Rather, Study 1 demonstrates that African Americans are sensitive to the racial
    content of conspiracy theories in a pattern that is consistent with predictions
    of stigma compensation theory. Second, the measure that was used to capture system
    blame only addressed the perceived discrimination of the construct and does not
    provide a robust test of this motivation to endorse conspiracy theories.


    Study 2 further expands on the patterns presented in Study 1 by testing the social
    devaluation hypothesis directly using an experimental design and a more complete
    measure of system blame.


    # Study 2


    Study 2 examined the social devaluation hypothesis directly using a social worth
    affirmation manipulation. If social stigma triggers a search for meaning in a
    manner consistent with prior research on social exclusion (Grauper & Coman, 2017;
    Stillman et al., 2009) and this drives a social motivation to endorse race-relevant
    conspiracy theories in particular, a social worth affirmation should function
    to decrease the endorsement of race-relevant conspiracy theories for African Americans.
    Affirming one''s social value should disrupt any search for meaning that the socially
    excluded might otherwise take (Graupe & Coman, 2017; Stillman et al., 2009). We
    do not expect the social worth affirmation to affect race-neutral conspiracy theories
    because these conspiracy theories may be triggered by more rational, epistemic,
    and/or existential motivations that are less connected to the social motivation
    to mitigate the effects of chronic devaluation.


