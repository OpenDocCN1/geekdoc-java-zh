  md: '1999; Imhoff & Bruder, 2014), and that conspiracy beliefs are high particularly
    among members of stigmatized minority groups (Crocker et al., 2019; Davis, Wetherell,
    & Henry, this Volume); Van Prooijen, Staman, & Krouwel, in press).


    Recent research has drawn heavily on these two insights, by extensively testing
    how stable individual differences predict a tendency to believe conspiracy theories
    (Darwin, Neave, & Holmes, 2011; Imhoff & Bruder, 2014; Van Prooijen, 2017), what
    causes factors increase belief in conspiracy theories (e.g., Douglas & Sutton,
    2011; Van Prooijen & Van Dijk, 2016; Whitson & Galinsky, 2008), what basic cognitive
    processes are involved when people perceive conspiracies (Douglas et al., 2016;
    Van Prooijen, Douglas & Inocencio, 2018), and what the consequences are of believing
    conspiracy theories (Bartlett & Miller, 2010; Jolley & Douglas, 2014a, 2014b;
    Douglas & Leite, 2017). It is safe to say that the scientific study of conspiracy
    theories has been emerging over the past decade: Both the body of knowledge on
    this phenomenon, as well as the number of researchers actively working on it,
    has expanded rapidly.


    One limitation of the current state of affairs in the scientific research domain
    of conspiracy theories, however, is that the field is laying a solid theoretical
    framework that contextualizes previous findings, that enables novel predictions,
    and that suggests interventions to reduce the prevalence of conspiracy theories
    in society. Recent review articles have sought to address this by providing a
    framework that illuminates the motivational basis of conspiracy theories—specifically
    that conspiracy theories appear to people for epistemic, existential and social
    motivational reasons (Douglas et al., 2017), and by developing an evolutionary
    model—the Adaptive Conspiracy Hypothesis—that specifies how the human tendency
    to believe conspiracy theories evolved through natural selection (Van Prooijen
    & Van Vugt, in press). These initiatives notwithstanding, at present the field
    of conspiracy theories is still in its infancy in terms of development. To stimulate
    further theorizing, we propose four basic principles of belief in conspiracy theories
    that we distilled from research conducted so far. These four basic principles
    are


