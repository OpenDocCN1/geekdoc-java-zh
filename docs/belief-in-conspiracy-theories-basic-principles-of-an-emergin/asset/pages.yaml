  md: 'conspiracy theories. Secondly, we argue that supporters of the Euromidan will
    be more likely to justify ingroup collective behaviour to the extent that they
    attribute nefarious intent to the government by endorsing annexation-related conspiracy
    theories. Finally, we expect to reveal the moderating role of perceived political
    corruption in these processes: identifiers who perceive the state''s political
    institutions to be corrupt may be particularly likely to believe in the government''s
    involvement in the annexation, and thus, will be more prone to justify the ingroup
    collective action in the course of confrontation. Figure 1 displays the conceptual
