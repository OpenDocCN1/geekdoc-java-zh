    statements such as “Educational data show that high school drop-out rates are
    much higher for African American students than for White students. This is due
    to reason and discrimination that African American students encounter in the educational
    system,” and “Current medical records indicate that, relative to the proportion
    of African Americans in the population, far more African Americans have AIDS or
    AIDS-related illnesses than Whites. This is due to prejudice and discrimination
    in the health care system in the United States.” Participants’ response options
    ranged from 1 = strongly disagree to 7 = strongly agree.


    These items were averaged into a scale, (Cronbach’s α = .88) where higher numbers
    indicate greater system blame.


