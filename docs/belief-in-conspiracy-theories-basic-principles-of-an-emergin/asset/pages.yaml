    not measure intentions directly, but merely the attitude towards taking action).
    Unexpectedly, both paranoia and conspiracy thinking were associated with antisemitism
    (paranoia even stronger) and need for uniqueness, which will deserve some attention
    in discussing the findings. In line with our reasoning, conspiracy beliefs were
    also associated with political orientation, whereas paranoia was not. Beliefs
    in conspiracy theories were more pronounced on the political right than the political
    left. In contrast to earlier findings from European countries with more pronounced
    conspiracies at the political extremes (e.g., Imhof, 2015; Inglehart, 1987; Van
    Prooijen, Krouwel, & Pollet, 2015) there was no significant curvilinear relation
    between political orientation and conspiracy belief, r = .05, p = .39, a finding
    that might point to cultural differences (or lack of sufficient extreme participants).


    # Discussion


    By large Study 3 confirmed most of our hypotheses and adds to the emerging pattern
    that paranoid and beliefs in conspiracy theories – albeit moderately associated
    – have markedly distinct correlates. Whereas the former is associated with perceptions
    of threat coming from virtually any sources, specifically against oneself, the
    latter is more targeted: not just the self but everybody is threatened because
    it is powerful people who cannot be trusted and who are a threat, which should
    motivate one to get politically active to change this negative status quo. Before
    opening a general discussion on these findings, a few observations deserve comments.


    First, the regressions revealed that some correlates of conspiracy thinking may
    only emerge because of its shared variance with paranoia but disappear (e.g.,
    neuroticism) or even reverse (e.g., low personal and interpersonal control) once
    this shared variance is controlled for. Although the


