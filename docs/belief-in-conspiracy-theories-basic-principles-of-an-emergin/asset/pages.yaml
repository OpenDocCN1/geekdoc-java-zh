  md: 'reasoning. Finally, we contribute to a growing body of work that has explored
    individual differences within an IOED paradigm. Previous work has shown that people
    with more formal education show less of an illusion for familiar everyday phenomena
    than people with less formal education (Fisher & Keil, 2016). Such work has focused
    on how certain people are better calibrated about their prior knowledge and therefore
    show a smaller pre- and post-explanation of lower explanation ratings. To our
    knowledge, we are the first to explore how levels of confidence after are associated
    with other beliefs like conspiratorial beliefs.


    It is important to note that, while we have confidence in our overall pattern
    of findings and believe this characterizes some of the psychological processes
    underpinning conspiratorial belief, we have only tested these hypotheses in a
    single U.S. electoral context and using MTTurk sample. The 2016 U.S. election,
    in particular, was a closely contested, confrontational, and polarizing campaign
    that featured anti-establishment and even conspiratorial rhetoric (e.g., Horton,
    2016), widely deemed false information (e.g., Swire, Berinsky, Lewandowski, &
    Ecker, 2017), and ongoing questions about the legitimacy of the electoral outcome
    (Kiley, 2017). Perhaps the 2016 U.S. presidential election was ripe for conspiratorial
    beliefs in ways that made particularly relevant the impact of inflated understanding
    of political phenomena on political choice and beliefs, including conspiratorial
    ideation. Furthermore, the evidence in support of Hypothesis 4—that the political
    IOED would lead to endorsement of conspiracy theories among individuals with low
    (vs. high) levels of political knowledge and who supported the losing candidate—was
    supported with marginally significant findings. Thus, future research should seek
    to extend and replicate these findings in additional political contexts, including
    outside the U.S., involving a different set of candidates and using alternative
    convenience sampling techniques or more nationally representative samples.


    Several additional questions also await future research. For example, what individual
    difference variables covary with inflated political belief? We included controls
    in our analyses variables known to associate with conspiratorial belief, but an
    additional line of inquiry could focus on factors associated with overconfidence
    (e.g., Fisher & Keil, 2015), such as inaccurate


