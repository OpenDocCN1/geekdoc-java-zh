  md: 'While scholars have discussed the view that endorsing conspiracy theories are
    a source of stigma, empirical evidence supporting it is scarce. Besides the above-cited
    work by Wood and Douglas (2013); Klein, Van der Linden, Pantazai, and Kissine
    (2015) have shown that MTurkers consider that a certain number of negative traits,
    such as ‘gullible’, ‘crazy’, ‘stupid’, etc. applies more to people who believe
    in conspiracy theories than people who do not believe in conspiracy theories.
    Moreover, conspiracy believers are more likely to be members of socially disadvantaged
    minority groups (Crocker, Luhtanen, Broadroix, & Blaine, 1999; Freeman and Bentell,
    2017; Parsons, Simmons, Shinhoster, & Kilburn, 1999; Stempel, Hargrove, & Stempel,
    Uscinski and Parent, 2014), and are more likely to report a feeling of powerlessness
    and anomie (Abalakina-Paap, Stephan, Craig, & Gregory, 1999; Goertzel, 1994; Jolley
    & Douglas, 2014a). Given that “rejection is an indicator of stigma (Miller & Kaiser,
    2001, p. 190), this could be an indeed hint in favor of the stigmatized condition
    of conspiracy believers.


    Nevertheless, despite the fact that these works support the conspiracy-theories-stigma
    their correlational nature and the fact that they do not directly measure stigma
    do not allow to demonstrate a causal relation between endorsement of conspiracy
    theories and social stigma. More importantly, previous studies do not tackle the
    fact that stigma is inherently dependent on contextual factors, which is well
    articulated in the stigma literature. As Crocker, Major and Steele (1998) note:
    “stigization is (...) primarily a situational threat, the predicament of being
    in a situation where one’s stigma could influence how one is treated and judged”
    (p. 504).


