  md: '# The Hypothesis of Conspiracy Theories as a Social Stigma


    In line with the defense of the conspiracy-theories-as-a-social-stigma hypothesis,
    some scholars explicitly state that providing a conspiracy theory as an explanation
    is stigmatized in our society (Harambam & Aupers, 2015; Husting & Orr, 2007).
    More specifically, Husting and Orr (2007) claim that in the public sphere, the
    term “conspiracy theory” trivializes people''s explanations, regardless of the
    quality of these explanations. In this sense, conspiracy theories could be seen
    as a “sign of narrative disqualification” (Bratich, 2008, p. 4). For Barkun (2016),
    conspiracy theories are doubly stigmatized, because they are not only considered
    as invalid knowledge, but also as theories defended by people belonging to the
    social fringe. Thus, more than the discredit associated with conspiracy theories,
    the traits of people who endorse them may also be discredited. Some scholars suggest
    indeed that being called “conspiracy theorist” conveys a negative image (Harambam
    & Aupers, 2015; Husting & Orr, 2007).


    This image is even found in the academic literature. Indeed, believing in conspiracy
    seems to be a sign of “intellectual character vices”, such as gullibility and
    lack of discernment, giving too much credibility to questionable sources of information
    and lack of credibility to legitimate sources of information (Cassam, 2016). In
    addition to being qualified as possessing such flaws, conspiracy believers are
    often considered in the collective imagination as suffering from mental health
    disorders, such as paranoia (Bratich, 2008; Harambam & Aupers, 2015; Harambam
    & Aupers, 2017; Husting & Orr, 2007; Sparkman, 2012). Moreover, ridiculing arguments
    of those who believe in conspiracy theories are found to be an effective lever
    to reduce belief in conspiracy theories (Orosz et al., 2016). In sum, social views
    of conspiracy (e.g., theories, beliefs, etc.) seem to be general considered derogatory
    in Western cultures (where most of the scholarship on this topic originates).


