    # Overview and hypotheses


    The aim of the current research was to examine the relationship between system
    identity threat and both conspiracy thinking and CT endorsement. We tested several
    hypotheses. First, net of relevant controls (such as demographics, political information,
    authoritarianism, and ideology), system-identity threat should predict general
    conspiracy thinking (H1a) and endorsement of general, non-ideological CTs (H1b).
    Second, given many CTs have a distinctly ideological flavor (Miller et al., 2016),
    we looked at whether the predictive power of system identity threat extended to
    CTs that appeal to those on the left or on the right. In particular, all conspiracy
    theories imply the outsized influence of hidden actors perceived to be colluding
    in wide-ranging activities to influence political events, some appeal more to
    those with a specific political allegiance by, for example, impugning the motives
    of one''s political or ideological opponents. That is, CTs vary in the extent
    to which endorsement is motivated by a specific ideological affinity. Since both
    the left and right are likely to endorse when they believe favorable conditions
    are slipping away (Uskinski & Parent, 2014; see also Richey, 2017; Uskinski et
    al., 2016), we expected that system-identity threat would predict endorsement
