    # How paranoid are conspiracy believers? Towards a more fine-grained understanding
    of the connect and disconnect between paranoia and belief in conspiracy theories


    > “Just because you''re paranoid doesn''t mean they aren''t after you.”

    — Joseph Heller, Catch-22


    The past few years have seen an upsurge in psychological research on conspiracy
    theories that are based on the common assumption that a few powerful conspired
    to influence the turn of events without any awareness about this by the general
    public. While there are prominent examples of factually proven secret operations
    hidden from public (e.g., the widespread wiretapping practice of the NSA), other
    such theories are less widely accepted (e.g., the notion that most of the world
    leaders are shape-shifting reptilian aliens). In particular, conspiracy allegations
    like the latter are often the target of ridicule and derogatory insinuations that
    such theories may follow from delusional paranoia. Whereas


