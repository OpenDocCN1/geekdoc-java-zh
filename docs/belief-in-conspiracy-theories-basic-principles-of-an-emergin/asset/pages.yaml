    # The present research


    In the following we will present three studies to elucidate the relation between
    paranoia and

    biefs in conspiracy theories, their similarities and differences. Study 1 is a
    meta-analysis of previously

    public correlations between paranoia and conspiracy thinking and suggests that
    there is a

    substantial correlation between the two. Study 2 and Study 3 utilize a multi-trait-multi-method

    approach to test whether they are nevertheless distinguishable, and – arguably
    more important –

