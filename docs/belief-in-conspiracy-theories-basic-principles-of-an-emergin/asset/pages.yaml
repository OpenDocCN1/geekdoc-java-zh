  pgno: 237
- img_proc: true
  md: 'final study, that events are more likely to be explained as conspiracies if
    they are part of a series of similar events, rather than one-offs. Crucially,
    Chavez''s conspiracy thinking was also fuelled by his view that this co-occurrence
    in events reflected a causal connection between them.


    The philosopher Mackie (1980) termed causality the "cement of the universe." By
    this, Mackie meant that causality is a force, real or imagined, that links events
    together in people''s minds, and enables people to understand and respond to relations
    between events. The rash of cancer diagnoses affecting several Latin American
    leaders in the early years of this decade is most plausibly seen as a tragic coincidence,
    cementing them together as Chavez did appeared to be illegitimate. Nonetheless,
    each diagnosis should not necessarily be seen as an entirely random event: it
    could also be seen as the product of a confluence of genetic, environmental and
    lifestyle factors. More generally, the events that conspiracy theories typically
    seek to explain are not entirely random or unrelated to other events. Natural
    disasters, diseases, personal deaths and tragedies, election results, and socio-political
    circumstances do not occur in a causal vacuum but are enmeshed in a complicated
    matrix of causes. Nonetheless, even though thinking takes place in contexts where
    events are seldom entirely random, it appears to be characterized by a willingness
    to draw imaginary causal connections between events.


