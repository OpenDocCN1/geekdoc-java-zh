    # Hypothesis 1: Explanation Will Reduce an Illusion of Political Understanding


    To begin, we examine the IOED for both the political and non-political domain.
    We do so, a repeated-measures ANOVA was used to compare differences in self-reported
    understanding of political issues or devices, separately, before and after the
    illusion. No covariates were included in this model. Analyses showed a significant
    effect of time for both political (F(1, 174)=77.45, p <001; Pre-explanation M=.44,
    SD=.26; Post-explanation M=.33, SD=.26) and non-political items (F(1, 230)=105.31,
    p <001; Pre- explanation M=.52, SD=.23; Post- M=.23). Thus, we observe a significant
