  md: '# Study 2


    In this study, our aim was to demonstrate that inducing people to imagine defending
    conspiracy theories in public, in front of an audience, leads to an anticipated
    fear of social exclusion. Again, we expected this effect to be mediated by the
    knowledge that defending conspiracy theories is negatively viewed by people in
    general.^8$ The secondary and exploratory hypotheses were the same as in Study
    1.


    # Method


    **Participants.** We recruited the complete data of 150 French participants ($M_{age}
    = 27.01, SD_{age} = 9.97$, 117 females). As in Study 1, student participants were
    in majority of our sample (58.7%), followed by “managers and higher intellectual
    professionals” (16.7%). In accordance with our pre-registered priori exclusion
    criteria, five participants were excluded from the final sample. Among them (including
    participants who satisfy diverse exclusion criteria), three were excluded because
    they failed the seriousness check (Aust et al., 2013), two because they failed
    the attention check, and for having reported being disturbed during the study.
    Our final sample is composed of 145 participants ($M_{age} = 26.68, SD_{age} =
    9.73, 112 females).


    > ^8$For reasons of consistency and fluency, although although in the pre-registration
    document we distinguish between confirmatory and exploratory analyses in both
    studies, we do not make this distinction in the following results of Study 2.
    The distinction was made in the preregistration document of both studies because
    they were run in parallel. However, as the studies are presented sequentially,
    we only made this distinction for Study1 which was presented first.


