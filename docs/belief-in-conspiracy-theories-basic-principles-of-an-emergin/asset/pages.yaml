  md: 'In contrast, Studies 1 and 2 showed that conspiracy beliefs about some events
    (e.g., the death of Princess Diana) were associated with implausible causal interpretations
    of other events (e.g., the occurrence of chocolate consumption and Nobel Prizes).


    In Study 3, we return the focus to cases like the one that concerned Chavez. We
    therefore measured co-occurrence perception, causal interpretation, and conspiracy
    belief within a single context. Each participant was presented with one scenario
    describing a streak of human tragedies (either the deaths of three or four journalists,
    or the poisoning of three or four local politicians).


    Streaks in events, even when they occur by chance, often trigger implausible causal
    perceptions as gamblers'' belief in a "hot hand" (Braga et al., 2016; Caruso et
    al., 2014). Conspiracy explanations for the most recent of these tragedies were
    measured, and participants were also asked whether the events are causally connected.
    We predicted that perceiving the events as causally connected would be related
    to conspiracy explanations. We also measured the extent to which participants
    perceived the events to comprise a pattern-like co-occurrence, and to which they
    explicitly acknowledged a pattern-like sequence but denied that it reflected a
    causal connection.


    Prior to these scenarios, participants read two scenarios describing streaks of
    natural events, and were similarly asked to indicate whether these events comprised
    a co-occurrence and were causally connected. This served to conceal the main focus
    of the study, and also to test the hypothesis that perceiving causal connections
    between natural events would be related to perceiving causal connections between
    human tragedies, and in turn, a preference for conspiracy explanations. Thus,
    Studies 1 and 2 presented events that comprised a co-occurrence because they were
    correlated, whereas Study 3 presented events that comprised a co-occurrence insofar
    as they occurred as a temporally contiguous cluster (see Appendix).'
