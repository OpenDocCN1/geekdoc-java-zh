    # Discussion


    Study 2 confirmed the notion that conspiracy beliefs and paranoia were interrelated
    but distinct constructs predicting different types of psychological variables:
    conspiracy beliefs were especially linked to constructs that were more relevant
    for the societal/ political identity of a person: low sociopolitical control,
    and trust in the government. Paranoia, in contrast and as argued before, showed
    stronger association with self-relevant constructs like personality traits, interpersonal
    control, the tendency to feel particularly threatened by other people (although
    this specific finding is to some extent tautological) the tendency to react with
    avoidance to threat.


