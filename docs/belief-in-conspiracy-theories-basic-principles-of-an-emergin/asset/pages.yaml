  md: '# Materials and procedure.


    After giving informed consent, participants were instructed that they would receive
    several questionnaires tapping into people''s attitudes toward real life issues
    and their causal reasoning. Participants were allowed to quit the survey at any
    point and they could not change their responses.


    After completing the survey, participants were debriefed and thanked.


    # Belief in conspiracy theories.


    Belief in conspiracy theories was measured using a scale assessing belief in real-world
    conspiracy theories including eight items from Douglas and Sutton (2011) (e.g.,
    “The American landings were faked”; 1 = strongly disagree, 7 = strongly agree,
    α = .80).


    # Causal interpretation of spurious correlations.


    Causal interpretation of spurious correlations (CISC) was measured with a newly-developed
    scale (see Appendix). Participants were presented with six spurious correlations
    (e.g., “It has been shown that an increase in people''s income is associated with
    more visits to the hospital”; “Has been shown that an increase in the average
    global temperature is associated with an increase in the national science foundation
    budget”), and asked to rate how much they agree with the following explanations
    of the relation between the two events: a causal relation, random coincidence,
    or a third cause (1 = totally disagree, 9 = totally agree, α_cause = .67, α_random
    = .69, α_confound = .71).


    Additionally, participants were asked to indicate how hard it would be to think
    of a reason why the two events are causally connected (1 = extremely easy, 9 =
    extremely hard, α = .62).


    > We included some additional items (see Appendix for the complete scale). However,
    it is important to note that running the same analyses with all items revealed
    a similar pattern of results.'
