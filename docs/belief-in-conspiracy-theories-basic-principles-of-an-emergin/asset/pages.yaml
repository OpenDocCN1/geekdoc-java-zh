- img_proc: true
  md: 'environmental domains (Bogart & Bird, 2003; Jolley & Douglas, 2014a; Jolley
    & Douglas, 2014b; Jolley & Douglas, 2017; Lewandowski, Oberauer, & Gignac, 2013),
    and on pro-social behaviors (van der Linden, 2015).


    Despite all the knowledge gained about the psychological factors related to conspiracy
    beliefs, there is relatively little empirical work about the public perception
    of conspiracy theories in our society. It is anecdotaly believed that conspiracy
    theories have a negative connotation, and may be, a source of stigma for those
    who endorse them. Indirect support for this view is provided by Wood and Douglas
    (2013) who observed that people promoting alternative explanations for events
    via comments on news websites (referred to as “conspiracists” by the authors)
    were reluctant to label and let others label their beliefs as “conspiracy theories”.
    According to these authors, these observations support the recurrent hypothesis
    of “social stigma” (p. 1) and of “intellectual stigma” (p. 3) attached to conspiracy
    theories, which supposedly negatively affects the social perception of people
    who endorse such theories. The “stigma” hypothesis becomes increasingly popular
    (see also Harambam & Aupers, 2015; Wood, 2016; Wood & Douglas, 2015), to test
    it empirically, it is important to draw on theoretical considerations regarding
    the nature of stigma.


    # Social Stigma: Definition, Psychological Consequences, and Concealability


    Testing the hypothesis of conspiracy theories requires turning to the literature
    and the conceptualizations of the concept of “stigma”. Stigma was a term originally
    used by the ancient Greeks to designate a sign into the body (e.g., a cut, a burnt)
    that was made to signal to everyone the presumed questionable of its bearer (e.g.,
    a criminal, a slave, etc.; Goffman, 1963). According to Goffman (1963), stigma
    is an “attribute that extensively credentials an individual” (Goffman, 1963, p.
    3). These attributes, such as skin color (Pinel, Warner, & Chua, 2005), sexual
    orientation (Lewis, Derlega, Griffin, &


