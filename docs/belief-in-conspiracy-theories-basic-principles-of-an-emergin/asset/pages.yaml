    # Limitations and Future Directions


    The present research presented a novel, more differentiated outlook on similarities
    and differences between paranoid and beliefs in conspiracy theories. To do so,
    we relied on pre-existing individual differences and correlations between several
    measures. Such correlations remain of mute causal direction. Conceivably, a conspiracy
    mindset makes people feel that they have little sociopolitical control (as the
    world is governed by conspiracies). Equally plausible, however, the repeated experience
    to not have any in politics (because elections largely do not affect the political
    course of a country) leads to the conclusion that there must be hidden agenda
    behind the stubborn consistency of the political system. Likewise, feeling incapable
    to control one''s relationships with others might be explained by informing others
    as to harm the self. Alternatively, being of the conviction that others are to
    harm oneself, can lead to the realization that there is little one can do about
    one''s suboptimal interpersonal relations. On top of disambiguating such relations
    with experimental or longitudinal designs, future research might additionally
    benefit from controlling another sources of joint variance semantic overlap. To
    be reasonably sure that the observed correlations provide insights into the psychological
    level and not just overlap in semantic meaning, it would be desirable to have
    non-verbal, behavioral indicators of trust and control.


    # Conclusion


    Conspiracy beliefs and paranoia share antecedents, consequences and (empirically
    speaking) variance. A closer look, however, allows the identification of clearly
    distinct phenomena. Whereas the worldview of the paranoid everybody is after them,
    through the eyes of the conspiracist, a powerful people are after everybody.


