  md: 'event sequences from the perception of apparent patterns in those sequences.
    For reasons we have noted, including the covariation principle in causal reasoning,
    we can expect perceptions of co-occurrence and causal inferences to be related
    under normal circumstances. Future studies could go further in developing tasks
    that cleanly separate the two processes. For example, in pictorial stimuli, it
    could be useful to ask participants not whether they see a pattern (Vano Proijen
    et al., in press, Study 3) or an object (Whitson & Galinsky, 2008) in a visual
    array, but whether they think the pattern could have emerged or whether it must
    have been determined.


    Future research could also determine whether a tendency to interpret event sequences
    in causal terms mediates several of the effects in the conspiracy theory literature,
    and offers an organizing theoretical framework for them. For example, thwarting
    needs to belong (Graueper & Coman, 2017) and to activate cognitive choice (Marchlewska
    et al., in press), and activating powerless have been to increase conspiracy thinking.
    They are also likely to result in heightened readiness to draw causal connections
    between events in an effort to impose meaning on experience. The conjunction fallacy
    – the tendency to see explanations with two premises as more plausible than one
    – has also been linked to conspiracy theory (Botherton & French, 2008) and the
    perception of underlying causal mechanisms (Ahn & Bailenson, 1996).


    # Concluding remarks


    Since the earliest research on conspiracy theories, scholars have seen conspiracy
    belief as an attempt to find order in the environment. The present results are
    consistent with this perspective, but show that whether or not co-occurrences
    exist (and are perceived to exist), conspiracy thinking is fuelled by implausible
    causal interpretations of those events: the perception of direct causal connections
    between events are unlikely to be connected. Thus, Hugo Chavez’s conspiracy thinking
    was fuelled by the fact that not one, but several, Latin American leaders were
    stricken by cancer in the early years of this decade – consistent with the novel
    finding, in our


