  md: 'self-evaluations (Mabe & West, 1982; Pronin, 2007), self-perceived knowledge
    (Dunning, Johnson, Ehrlinger, & Kruger, 2003) and exposure to partisan and polarized,
    yet attitudinally-congruent, information sources (e.g., Prior, 2013). Additional
    research should also consider alternative downstream consequences beyond extreme
    attitude (Fernbach et al., 2013) and conspiratorial beliefs, including (e., its
    potential effect on information seeking (e.g., biased hypothesis testing; Devine,
    Hart, & Gekehr, 1990), ideological construct (e.g., Ansolabehere, Rodden, & Snyder,
    2008), social action and political participation (Federico, Fisher & Deaison,
    2017), pseudoscientific (e.g., Pennycook, Barr, Koehler, & Fugelsang, 2015) and
    superstitious beliefs (Matutte, Yarritu, & Vadillo, 2011), and illusory pattern
    recognition (e.g. Whitson & Galinsky, 2008), among others.


    Finally, to the extent that conspiratorial belief is undermined by illusions of
    explanatory understanding, the IOED paradigm might be a useful strategy for reducing
    conspiratorial ideation. Political misceptions are very difficult to correct (Lewandowski,
    Oberauer, & Gignac, 2013; Nyhan & Reifler, 2010), and efforts to do so often backfire
    (Flynn, Nyhan, & Reifler, 2017).


    However, one promising avenue to correcting political misceptions focuses on replacing
    inaccurate causal inferences with an alternative causal explanation (e.g., Nyhan
    & Reifler, 2015). Perhaps requiring participants to explain the underlying causal
    relation among factors to a particular conspiracy theory would reduce confidence
    in those beliefs and, over, attenuate conspiratorial thinking. Examination of
    potential antecedents and alternative downstream consequences of political IOED
    represents a fruitful way of extending our investigation to better understand
    the role of inflated confidence in one’s causal understanding of political phenomena
    for cognition and behavior, and may even point to strategies for attenuating endorsement
    and dissemination of conspiratorial beliefs.'
