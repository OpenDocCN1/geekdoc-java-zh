    # Going one step back: defining paranoia and conspiracy beliefs


    The term *paranoia* derives from the Greek word παράνοια for madness in general
    and is a

    symptom of a variety of clinical diagnoses according to clinical classification
    systems like the DSM (e.g.,

    paranoid schizophrenia or paranoid personality disorder. What is generally referred
    to in the diagnostic

    manuals is an attribution style characterized by suspiciousness, distrust and
    the presumption that

    others have negative intentions toward oneself. Such cognitions, however, are
    not an exclusive asset of

    clinical populations. In fact, “self-relevant suspicious and distrustful beliefs
    that one may have

    about the evil nature of other people’s intentions and behaviors” (Van Rooijen
    & van Lange, 2014; p.

    240) are highly prevalent in the general population (Freeman et al., 2005). For
    the remainder of the

    article, we will focus on variations in such sub-clinical forms of paranoia.


    Conspiracy theories in contrast are theories or conjectures that provide explanations
    for

    important events that involve secret plots by powerful and malevolent groups (Goertzel,
    1994), often

    insinuating a cover-up to hide the truth behind a (false) official version. Recent
    research has consistently

    supported the notion that belief in different conspiracy theories are typically
    highly correlated (e.g.,

    Bruder, Haffke, Neave, Nouripanan, and Imhoff, 2013; Wood, Douglas, and Sutton,
