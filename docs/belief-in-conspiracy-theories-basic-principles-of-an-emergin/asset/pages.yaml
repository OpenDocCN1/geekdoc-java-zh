  md: 'reproduction by the “unfit” (Bird & Bogart, 2005; Dugger, 1998; Roberts, 1998,
    2000). These policies fueled later rumors that birth control is a form of African
    American genocide, driving subsequent reductions in the use of birth control in
    African American communities (Bird & Bogart, 2005).

    Similarly, the Tusgee syphilis study, in which medical researchers withheld treatment
    for syphilis from African American participants, helped drive later suspicions
    among ethnic minorities that the AIDS was created by the government to wipe them
    out (Russ et al., 2011). Exposure to historical narratives of anti-African American
    conspiracy theories, such as the Tusgee syphilis experiments, predicts increased
    endorsement of novel anti-African American conspiracy theories (Nelson et al.,
    2010). These data show that endorsement of race-based conspiracy theories can
    flow from realistic approaches of historical discriminatory social practices and
    policies.


    # Social-Emotional Motives for Stigmatized Groups


    A third motivation for conspiracy theory endorsement is the desire for individuals
    to see themselves and their group in a more positive light (social motivation;
    Douglas, Sutton, and Cichocks, 2017). Our theoretical approach focuses on this
    social motivation as an important driver behind African Americans’ endorsement
    of race-relevant conspiracy theories.


    People have a fundamental need to belong (Baumeister & Leary, 1995; Smart Richman
    & Leary, 2009) and yet stigmatized groups, in this case African Americans, experience
    system prejudice and discrimination (e.g., Major, Linton, and McCoy, 2002; Sidanius
    & Pratto, 1999) that leads to a chronic sense of devaluation (for discussion,
    see Davis & Reyna, 2015). Social devaluation is conveyed to stigmatized groups
    in many ways, from negative portrayals of a group in the media to microinteractions
    in daily social interactions. People who belong to stigmatized groups believe
    that they are, or at least should be (of) of equal social value as others, yet
    their experience of social devaluation contradicts this expected relation to society.


