  md: '# Conclusions, Future Research, and Practical Implications


    In the present contribution, our aims were to review the literature of the emerging
    research domain of conspiracy theories, and to distill four basic principles that
    characterize belief in such theories. These four basic principles follow from
    a surge of empirical research on this phenomenon that has been conducted in the
    past decade, and are also reflected in the contributions to this Special Issue.
    At the same time, more theorizing and research is needed to further develop the
    psychology of conspiracy theories as a fully-fledged research field. In the following
    section, we propose some possibilities for future research based on these four
    organizing principles.


    # Future Research


    Focusing first on consequences, whilst it is clear that conspiracy beliefs can
    have major ramifications for perceivers and their social environment, theorizing
    on this phenomenon benefit from more carefully crafted experiments that manipulate
    conspiracy theories (cf. Jolley & Douglas, 2014a, 2014b; Douglas & Leite, 2017).
    This would enable researchers to establish the exact psychological processes through
    which conspiracy theories and belief in conspiracy theories are consequential.
    This is important, because only a fine-grained understanding of these possible
    consequences, as well as the conditions under which they are strong or weak, will
    enable practitioners to estimate the risks of particular conspiracy theories and
    the need to implement interventions. Furthermore, in experimental studies of conspiracy
    theories, behavioral measurements are also lacking (for an exception, see Van
    der Linden, 2015). For instance, exposure to conspiracy theories causally impact
    antisocial behaviors such as aggression and egoism, but also prosocial behaviors
    such as helping and altruism? Experimental studies on such questions will complement
    existing insights on the consequences of conspiracy theories in significant ways.


    This article is protected by copyright. All rights reserved..'
