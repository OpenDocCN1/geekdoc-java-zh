    Further, while the present results affirm others that have also found a relationship
    between conspiracy belief and perceptions of pattern and non-randomness (van Rooijen
    et al., 2018; Whitson & Galinsky, 2008), they are at odds with results reported
    by Dieguez et al. (2015), which found no such relationship. One potential explanation
    might appeal to the social and ecological meaningful of the stimuli. Pattern perception
    appears to be relevant to conspiracy thinking when the stimuli are (or could be)
    meaningful in everyday life, as is with the pictures that represent objects or
    convey ideas and emotions, and coin tosses, which are typically performed when
    something is at stake. In contrast, Dieguez et al. (2015) presented sequences
    of Xs and Os, and did not describe to participants what they represented, or what
    was at stake in these sequences. If stimuli do not have a clear apparent or potential
    social meaning, they may not activate the senses motivations that are thought
    to underpin conspiracy theories (Douglas et al., 2017). Another important feature
    of some of their conditions is that a potential cause for any order was introduced
    (i.e., a cheat who was influencing the outcome). This may have stripped the task
    of some of the critical causal ambiguity that seems to be needed for the thought
    processes that are characteristic of conspiracy thinking to be detectable. A final
    point is Dieguez et al.’s beliefs about randomness vs. determination was rigorous
    and sophisticated, but it is not known how it relates to the measures used in
    our studies, nor by Whitson and Galinsky (2008) and van Rooijen et al. (2018).


    # Limitations and future directions


    Our studies have some important limitations. They relied on online Mturk samples
    and did not incorporate actual events that may have happened in the (recent) past.
    Future research should examine a broader, more representative range of participants
    and stimulus events. Further, the present studies were not always successful in
    cleanly distinguishing the causal interpretation of


