    previously thought.


    # Future directions


    Beyond the novelty of these data, this paper contributes to the literature by
    providing a

    theoretically generative set of propositions. To the extent that other groups
    feel socially devalued,

    we would expect similar patterns of belief in conspiracy theories that target
    said groups. For

    example, groups with extreme political ideologies are more likely to endorse conspiracy
    theories

    (van Proijen & Krouwel, 2017), and it is quite likely that these groups perceive
    greater social

    devaluation because the broader electorate marginalizes their beliefs. Given the
    evidence that social

    devaluation leads to a social motivation to compensate for devaluation, addressing
    this motivation

    trough alternative mechanisms (e.g., affirming social value) may reduce belief
    in conspiracy theories for

    other groups. In other words, it is possible that if these groups received some
    form of social

    validation, they may feel less marginalized and this may decrease conspiracy theory
    endorsement, a

    proposition that has been suggested (though not tested) regarding the socially
    excluded more

    general (Graeuper & Coman, 2017).


