    controlled for respondents'' *levels of social trust*. Following recent work (e.g.,
    Miller et al., 2015), we also

    included controls for *political ideology* and *ideological extremity*. These
    controls account for findings


    suggesting that CN correlates with political conservatism (Golec de Zavala, et
    al., 2009) and that

    conspiracy endorsement correlates with individuals'' political attitudes (though
    the direction varies;

    Berinsky, 2015; Miller, et al., 2015). Previous research suggests individuals
    who are sensitive

    to existential and epistemic threats tend endorse conspiracy theories more strongly
    (Abalakina-Paap

    et al., 1999, Swami, 2012; Swami & Coles, 2010) and show higher levels of CN (Golec
    de Zavala

    et al., 2009). For sensitivity to such threats, we also included measures of *authoritarianism

    and the *need for cognitive closure*. Authoritarianism is a general preference
    for obedience and conformity

    (Altemeyer, 1998; Stner, 2005). It correlates reliably with both conspiracy thinking
    (Abalakina-

    Paap, et al., 1999) and CN (e.g., Golec de Zavala et al., 2009, 2016). The need
    for closure is a

    motivation to seize and freeze on any opinion rather than accepting uncertainty
    (Webster &

    Kruglanski, 1996). Like authoritarianism, it is related to both conspiracy thinking
    (Marchlewa,

    Cichocka & Kossowska, 2017) and CN (Golec de Zavala, et al., 2009).


