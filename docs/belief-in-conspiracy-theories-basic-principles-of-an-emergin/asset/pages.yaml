    # Belief in Conspiracy Theories: Four Basic Principles


    The four basic principles that we put forward here specify and expand the two
    key insights

    discussed earlier—that is, (a) belief in different conspiracy theories is driven
    by similar psychological

    processes, and (b) conspiracy beliefs are highly susceptible to social context.
    We specifically detail

    what particular antecedents and consequences are involved in the psychological
    processes

    underlying conspiracy theories, and how social contexts influence people''s susceptibility
    to

    conspiracy theories. Explicitly, we argue that beliefs in conspiracy theories
    are consequential,

    unversal, emotional, and social. In the following sections, we discuss each of
    these basic principles

    in turn.


    # Principle 1: Conspiracy Beliefs are Consequential


    When conspiracy theories are highly unlikely to be true, they have an impact on

    important life dimensions such as health, interpersonal relationships, and safety.
    This impact is

    rooted in the subjective reality of belief. What people believe drives their behavior;
    while beliefs

    sometimes may be flawed or even naive, they may produce behavior that has real
    consequences (cf.

    the Thomas Theorem; Thomas & Thomas, 1928). In one dimension in particular conspiracy

    theories are consequential—and usually detrimental—for perceivers is their health.
    To illustrate this,

    imagine for a moment that vaccines actually cause autism. Who get themselves and
    their

    children vaccinated under those circumstances? But while medical scientists agree
    that

    vaccines do not cause autism, many citizens firmly believe that the pharmaceutical
    industry


