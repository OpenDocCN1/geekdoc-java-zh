    Zhang, Li, & Fabrigar, 2010; see also van Proijen & Dijk, 2015). Indeed, people
    will override the

    covariation principle if they have specific information about causal mechanisms.
    For example, even if

    a driver had had no accidents before, observers tend to see her as the primary
    cause of an accident if

    they know she was short-sighted and not wearing corrective lenses (Ahn & Bailenson,
    1996).


    Likewise, if intentional actions (e.g., lighting a campfire) covary equally or
