    https://daververse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/HYURNH


    # Abstract


    Conspiracy theories about government officials and the institutions they represent
    widespread, and span the ideological spectrum. In this study, we test hypotheses
    suggesting that system identity threat, or a perception that society’s fundamental,
    defining values are under siege due to social change will predict conspiracy thinking.
    Across two samples (N=870, N=2,702), we found that system identity threat is a
    strong predictor of a general tendency toward conspiracy thinking and endorsement
    of both ideological and non-ideological conspiracy theories, even after accounting
    for numerous covariates. We also found that the relationship between system-identity
    threat and conspiracy-theory endorsement is mediated by conspiracy thinking. These
    results suggest that conspiracy-theory endorsement may be a compensatory reaction
    to perceptions that society’s essential character is changing.


    Keywords: conspiracy theories, system justification, system identity threat, motivated
    reasoning, political ideology


