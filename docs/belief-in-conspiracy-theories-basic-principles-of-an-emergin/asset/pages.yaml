  md: '# Abstract


    Using data from a longitudinal study of American adults collected between July
    and November 2016, we examine the hypothesis that American collective narcissism
    would uniquely predict increases in conspiracy thinking during the 2016 presidential
    campaign. Going beyond previous findings, our results indicate that collective
    narcissism (but not in-group identification) predicted growth in general conspiracy
    thinking—i.e., a tendency to view political events in group-based conspiracies—over
    the course of the 2016 U.S. presidential campaign. This relationship is found
    even after accounting for other predictors such as demographics, political knowledge,
    social trust, authoritarianism, and need for cognitive closure.


    Keywords: Collective narcissism, conspiracy thinking, presidential campaign


    Conspiracy theories are explanations for events that—typically without evidence—assume
    secretive, malevolent plots involving multiple actors: a mysterious ‘them’ who
    ‘run’ and work against ‘us’ (Abalakana-Paap, Stephan, Craig and Gregory, 1999:
    Goertzel, 1994). Believing in conspiracy theories satisfy psychological needs
    for certainty, security, and a positive self-image (Douglas, Sutton and Cichocka,
    2017). The tendency to endorse specific conspiracy theories about malevolent actions
    of out-groups has been linked to collective narcissism, an exaggerated contingent
    on external validation (Cichocka, Marchlewska & Golec de Zavala, 2015; Golec de
    Zavala & Cichocka, 2012). Going beyond such findings, the present study investigates
    whether collective narcissism predicts a general tendency towards conspiracy thinking—i.e.,
    a predisposition to believe that a small group of people uses secrets to usurp
    power and cause harm (Brotherton, French & Pickering, 2013; Imhof & Bruder, 2014;
    Uskinski, Klofstad & Atkinson, 2016). To this end, we examine whether collective
    narcissism predicts increases in general


    This article is protected by copyright. All rights reserved.'
