    # Limitations and Future Directions


    Although this research is promising, it presents some limitations. First, these
    data are cross-sectional and definitely need to be backed up by both longitudinal
    and experimental evidence. Secondly, in the present study we only zoomed in on
    conspiracy beliefs as an intergroup phenomenon pointing out the connection between
    ideologically charged social identities, a particular set of conspiracy beliefs,
    and group justification tendencies. The extant literature has suggested a plethora
