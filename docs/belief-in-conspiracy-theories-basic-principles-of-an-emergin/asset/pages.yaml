  md: 'this hypothesis in contexts involving physical social interactions, for instance,
    designing role-playing games or by setting up an audience in a laboratory experiment.
    Moreover, to generalize our findings, future studies need to rely on other conspiracy
    theories than those based on Charlie Hebdo events. Indeed, conspiracy theories
    about Charlie Hebdo events could be potentially more socially stigmatized than
    other conspiracy theories relatively more distant in time and location.


    In the future, we can also generate more sophisticated hypothesis by fitting conspiracy
    theories into known dimensions of stigma (Pachankis et al., 2018). A first relevant
    dimension of stigma is its concealability. Research suggests that living with
    a concealable stigma does not necessarily make life easier than living with a
    nonconcealable stigma (for an extensive review, see Pachankis, 2007). For example,
    people with concealable stigmas (e.g., a minority sexual orientation, people with
    bulimia, etc.) are more vulnerable (e.g., characterized by lower self-esteem,
    more negative affect, etc.) than people with non-concealable stigma (Frable, Platt
    & Hoey, 1998), which could reflect their difficulty to find similar others to
    provide a precious social support (Gaines, 2001). In addition to these affective
    implications, having a stigma can have cognitive consequences (e.g., obsessive
    and intrusive thoughts, etc.; Smart & Wegner, 1999, 2000). Consequently, these
    psychological considerations could be relevant as beliefs, are concealable by
    definition (as illustrated by the low score of visibility of the stigmatized statuses
    “atheist” in Pachankis et al., 2018).


    A second relevant dimension of stigma is controllability (Kurzban & Leary, 2001).
    The fact that the controllability dimension is applicable on stigma based on various
    illnesses (Crandall & Moriarty, 1995; Pachankis et al., 2018; but see Kurzban
    & Leary, 2001, for a more nuanced perspective), lead to predict that give similar
    results: For instance, little pity and more anger toward people holding a stigma
    (Weiner, Perry, & Magnusson, 1988). Even outside a clinical


