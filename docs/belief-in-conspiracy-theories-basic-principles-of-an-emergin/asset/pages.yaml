  md: '# # Abstract


    African Americans in the United States endorse conspiracy theories at greater
    rates than Whites. The extant literature explains this pattern in terms of a rational
    motivation to blame the social system for prejudice and discrimination. However,
    little research distinguishes between race-relevant conspiracy theories against
    African Americans and general conspiracy theories. We propose that African Americans
    may seek out race-relevant conspiracy theories in particular because they satisfy
    a search for meaning that is brought about by chronic social devaluation. We present
    two studies that examine this social devaluation hypothesis. In Study 1 African
    Americans endorsed race-relevant conspiracy theories, even when controlling for
    aspect of system. Study 2 employed an experimental affirmation of social value
    that significantly reduced African Americans'' endorsement of race-relevant conspiracy
    theories consistent with the social devaluation hypothesis. These data indicate
    there may be psychologically adaptive features of race-relevant conspiracy theory
    endorsement.


    # # Social Devaluation of Ethnic Minorities and Race-Related Conspiracy Theories


    Conspiracy theories, defined as beliefs in secret plots by powerful people or
    groups to accomplish harmful or sinister goals (Goertzel, 1994; Wood, Douglas
    & Sutton, 2012), are generally endorsed by members of ethnic minority groups in
    the United States more frequently than Whites.¹ Members of marginalized ethnic
    minority groups are more likely than Whites to believe that the United States
    government was behind the September 11th attacks (Turkel, 2010), that the air
    force is hiding flying saucers (Newman & Baumeister, 1996), that the government
    deliberately AIDS in African American communities (Bogart & Thorburn, 2005; Ross,
    Essien, & Torres, 2006) and


    > ¹In this paper we use the term marginalized ethnic minorities to refer specifically
    to African Americans in the United States. However we expect the patterns would
    apply to other minority groups to the extent that they experience similar social
    devaluation.


