  md: 'arguments (Study 1) or participants’ public talk (Study 2) are random people.
    This is crucial because conspiracy theories are generally counter-normative beliefs
    supported by quite a minority of people, people would normally deduce that the
    audience would be on average against conspiracy theories. Given this specific
    social context in which social identity be salient, in conjunction with an audience
    psychologically present and a clear visibility to the audience, the question of
    identification is decisive to predict if people will express or not their social
    identity (Klein, Spears, & Reicher, 2007). Future work could examine this pivotal
    role of identification, as well as the effect of the nature of audience, with
    respect to the effect of conspiracy theories defense against anticipated fear
    of social exclusion.


    Our work opens the door to new questions. We have shown that people who defend
    conspiracy theories expect to be socially excluded, but defending conspiracy theories
    really lead to social exclusion? In fact, social exclusion and conspiracy beliefs
    have already been connected, but only in one causal direction. At this stage,
    we know that social exclusion leads to more conspiracy thinking (Graeuupner &
    Coman, 2017). If the reverse is also true, that is, if conspiracy thinking leads
    to social exclusion, this could be an interesting vicious cycle whereby people
    progress gradually in conspiracy thinking as they become socially isolated, which
    in turn, increases their belief in conspiracy theories, etc. Longitudinal research
    designs could help model these potential reciprocal effects.


    Relying on participants recruited on the Internet could be seen as a limitation
    given our willingness to take into account the social dimension of conspiracy
    theories. Indeed, in these studies, participants were not involved in genuine
    social interactions, but, rather, in anticipated or imagined social interactions.
    Nevertheless, we were not in a purely artificial setting given that social interactions
    on internet are common, and even, through “fake news”, the basis of spread of
    various conspiracy theories (Del Vicario et al., 2016; Douglas, Ang, & Deravi,
    2017). Of course, we do not deny that there is still a certain interest to test


