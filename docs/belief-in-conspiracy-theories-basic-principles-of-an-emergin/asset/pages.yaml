  md: '# African Americans and Race-related v. Race Neutral Conspiracy Theories


    theories are often external attributions that blame systematic prejudice and discrimination
    for problems within the African American community, and system blame is correlated
    with endorsement of race-related conspiracy theories (Crocker et al., 1999). On
    the other hand, conspiracy theories can also, in-and-of-themselves, provide a
    sense of meaning that can compensate for social devaluation. When people feel
    socially excluded they are more motivated to search for meaning (Stillman et al.,
    2006), and those who have been excluded may draw on the provided by conspiracy
    theories (Graener & Com, 2017). Given that those who are stigmatized face a kind
    of chronic social exclusion (cf. Davis & Reyna, 2015; Smart Richman & Leary, 2009),
    we predict that those who are stigmatized will be particularly attracted conspiracy
    theories, in particular those theories that concern plots their group specifically.


    African Americans consistently endorse general conspiracy theories at greater
    rates than majority groups (Goertz, 1994). This pattern is robust and can be explained
    in terms of the rational, epistemic and existential motivations described above
    (e.g. Bird & Bogart, 2005; Douglas et al., 2017; Nelson et al., 2010). General
    conspiracy theories are not tied to an ethnic identity, and may not satisfy the
    social motivation of ethnic minorities who face chronic devaluation. On the other
    hand, endorsing race-related conspiracy theories may address a specific social
    motivation to repair their sense of threatened social value (Henry 2009, 2011a).


    Crocker and colleagues (1999) describe a predominantly rational, social motivation
    for belief in conspiracy theories where experiences of prejudice and discrimination
    make race-relevant conspiracy theories seem like plausible explanations for African
    Americans'' disadvantage.


