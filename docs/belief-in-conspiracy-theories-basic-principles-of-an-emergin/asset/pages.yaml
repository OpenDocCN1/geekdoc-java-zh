    Finally, prominent perspectives on the psychology of conspiracy beliefs suggest
    that endorsement of conspiracy beliefs are motivated by psychological needs for
    order, structure, and certainty (e.g., Miller, Saunders, & Farhart, 2016) and
    thereby provide an internally consistent and personally meaningful explanation
    for threatening social and political events and change (e.g., Federico, Williams,
    & Vitriol, 2017), including undesirable electoral outcomes (Edelson et al., 2017).
    The threat associated with supporting a losing candidate can promote conspiracic
    ideation and lead to increased endorsement of political conspiracies among all
    supporters of that candidate (e.g., Edelson et al., 2017; Uscinski & Parent, 2014).
    Conspiratorial explanations of undesirable electoral outcomes provide a means
    by which voters can cope with having a losing candidate without having to revise
    their preference for that candidate or their expectation that such a candidate
    should have, in fact, when the election (i.e., partisan-based reasoning; e.g.,
    Miller, Saunders, & Farhart, 2016). However, we expect political conspiracies
    to be particularly attractive to overconfident individuals who lack objective
    knowledge about politics, in part, because individuals with high (vs. low) levels
    of political knowledge should be better able to generate non-conspiratorial explanations
    for political outcomes that threaten preexisting expectations and preferences.
    Individuals who have unjust confidence in their understanding of politics yet
    lack the requisite knowledge to account for undesirable electoral outcomes are
    both motivated to explain the outcome but also be less able (or willing) to differentiate
    between credible and conspiratorial accounts. For these reasons, we expect divergence
    between self-perceived and actual political knowledge to increase support for
    conspiracy beliefs in general, but especially under conditions of threat that
    increase the motivation or need for causal explanation. As such, we expect the
    2-way interaction between


