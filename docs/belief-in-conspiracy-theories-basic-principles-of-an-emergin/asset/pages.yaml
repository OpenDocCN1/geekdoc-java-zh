  md: '# Study Background: The Conspiracy Theories on Crimea''s Annexation


    The annexation of Ukraine''s Crimea has been regarded as the ‘fastest effective
    secession in modern history’ (Christakis, 2015, p. 77). In the span of three weeks,
    Russian Special Forces invaded the peninsula, the regional pro-Moscow authorities
    called for a referendum on the status of Crimea, in which a sizeable majority
    of the population voted to join Russia. This allowed the Russian parliament to
    formalize Crimea''s unilateral secession from Ukraine two days after the official
    results of the referendum were revealed (e.g., Myers, 2014). Although Ukraine''s
    top officials denounced Russia''s military takeover of Crimea aligning their condemnations
    with the anti-Russian protests in Kyiv, some commentators raised doubts as to
    whether or not the state''s government were bribed to let Crimea go (e.g., Weigel,
    2014). In, three years after these events (and at the time of this study), the
    Ukrainian state authorities have not yet presented a coherent strategy to de-occupy
    the peninsula in spite of the seemingly global condemnation of Russia''s invasion
    and the domestic (latent) resistance movement (e.g., Makarenko, 2017).

    A combination of the government''s political inaction and rampant state-sanctioned
    corruption in Ukraine have generated a climate of public discontent and frustration
    (Holcomb, Conlon, & Hrykowski, 2016; Khylko & Tytarchuk, 2017).


    # Study Aims


    The present research designed to make three novel contributions to the literature.
    First, based on social identity theory we argue that people’s tendency to believe
    in a particular set of conspiracy theories should be predicted by their social
    identification with specific opinion-based groups. Within the context of Ukraine’s
    intergroup conflict over the annexation of Crimea, we argue that supporters (but
    not opponents) of the “Euromaidan” social movement of resistance to Russia will
    be likely to believe in the n


