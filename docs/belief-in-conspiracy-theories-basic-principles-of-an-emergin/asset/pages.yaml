    # Method


    # Participants and Procedure


    Participants were recruited using snowball convenience sampling. The data were
    collected between March 30 and April 21, 2017, three years after Ukraine’s peninsula
    of Crimea was annexed by the Russian Federation. After consenting to participate,
    participants completed socio-demographic measures and then were asked to complete
    the survey¹. The items were available in Ukrainian. In order to guarantee coherence
    and validity of the questions, all items were translated from English to Ukrainian
    and back using a standard translation-back-translation procedure (Brislin, 1970).
    Participants were required to be of the Ukrainian nationality and aged over 18.


    Four hundred and seven volunteers entered the survey. Three hundred and fifteen
    participants (77.40 %) completed all survey items and were included in the final
    sample.


    > ¹ The survey also included the measures of self-blame, group-based emotion in
    relation to Crimea’s annexation, perceived efficacy of collective action. However,
    these measures were not relevant to this research.


