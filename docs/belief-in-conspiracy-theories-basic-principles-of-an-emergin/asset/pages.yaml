    Recent insights gained from the literature suggest that people with extreme political
    leanings are more prone to endorse dissent conspiracy theories (e.g., Edelson
    et al., 2017; van Rooijen, et al., 2015). For instance, Edelson et al. (2017)
    have shown that people were more likely to believe in electoral fraud depending
    on whether the party identified themselves with the elections or not. In a similar
    vein, Uscinski and Parent (2014) have shown how one''s partisan identity (i.e.,
    Republican and Democrat) interacted with a sense of relative group deprivation
    and inferior group status to protect beliefs in election fraud: individuals on
    the losing (vs. winning) side of political processes were more likely to believe
    in election-related conspiracy theories. Van Rooijen et al. (2015) found that
    conspiracy beliefs were associated with extremist political beliefs at either
    side of the political spectrum (i.e., “left” and “right”): political extremes
    were more likely to believe in conspiracy theories than political moderates because
    of their highly structured thinking style in which complex social events and groups
    tend to be categorized in terms of binary opposition. Thus, a necessary step in
    explaining why individuals believe in specific conspiracy worldviews (i.e., one’s
    silent opinion-based group membership) may play a causal role in the outcome.


