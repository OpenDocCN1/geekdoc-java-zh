  md: '# Visual pattern perception.


    A modified version of Whitson and Galinsky''s measure of pattern perception was
    used.


    Participants received 12 snowy pictures in random order of which 2 contained a
    grainy embedded image that was difficult but possible to perceive. The other 10
    pictures were manipulated using software to eliminate any traces of the embedded
    image (Whitson & Galinsky, 2008). Participants were asked to identify as quickly
    and accurately as they can whether there was an image or not.

    Since of 10 pictures were random static, in which no image exists, any identification
    from a participant that they see an image in the picture is evidence of illusory
    pattern perception. For our analyses, we used the number of times participants
    perceived an image in the pictures that lacked an image (see Whitson & Galinsky,
    2008).


    # Magical ideation.


    To measure magical ideation, we administered the 10-item magical ideation scale
    (Eckblad, 1983). This measure assesses endorsement of causal mechanisms that are
    invalid or metaphysical (e.g., “I have wondered whether the spirits of the dead
    can influence the living”, 1 = strongly disagree, 5 = strongly agree, α = .85).


    # Rationalistic vs. intuitive mind-set.


    Participants completed the Rational-Experiential Inventory, which is a questionnaire
    assessing individual differences in rational and experiential thinking styles
    (REI); Pacini & Epstein, 1999; e.g., rationalistic mind-set; “I prefer complex
    to simple problems”, 1 = definitely false, 5 = definitely true, a = .89; and intuitive
    mind-set; “I trust my feelings about people”, 1 = definitely false, 5 = definitely
    true, α = .94). For our analyses, we used separate scores for rational and experiential
    thinking styles (with higher scores indicating higher rational and higher experiential
    thinking).


