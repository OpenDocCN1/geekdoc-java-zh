    # Discussion


    To sum up, in Study 2, we replicated the finding that people who defend conspiracy
    theories anticipated negative evaluation from others, which, in turns, leads them
    to fear social exclusion. Thus, this effect holds in contexts where people imagine
    their subsequent social reputation, suggesting the high level of intensity of
    this social stigma. We also observed that the more people believe in conspiracy
    theories, the more they consider that their peers, but also French people in general,
    view conspiracy theories positively.


    The moderated mediation analysis did not return the same pattern as in Study 1.
    We did not find that baseline belief in conspiracy theories moderated the negative
    effect of conspiracy theories defence on the evaluation of the self and the anticipated
    fear of social exclusion. Besides, the conclusions that resulted from the moderated
    mediation analysis of Study 2 are not clear and easy to interpret at this stage.
    It seems that, in general, the protocol used in Study 2 yields less clear results
    on the exploratory analyses, the protocol used in Study 1 (i.e., unreliable measures,
    effects descriptively lower in size). These differences could be due to many sources,
