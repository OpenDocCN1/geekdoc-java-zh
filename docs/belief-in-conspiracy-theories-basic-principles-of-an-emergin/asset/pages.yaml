    # Discussion


    The present findings replicate and extend the results of Study 1. First, they
    show that as, causal interpretations of spurious correlations were related to
    conspiracy belief. Second, they indicate that this factor is related to magical
    ideation, which is an of permissive and unconventional causal thinking (Eckblad
    & Chapman, 1983), as well as visual pattern perception, which is an of the motivated
    perception of order and meaning in the environment (Whitson & Galinsky, 2008).
    Third, they indicate that the perception of direct causal relations between spurious
    correlates, nonetheless, predicts conspiracy thinking over and above these other
    variables, as well as other factors previously shown to be relevant to conspiracy
    thinking, rationalistic or experiential thinking, political orientation, religiosity,
    and education. These findings, together, provide further evidence that implausible
    causal interpretations even of non-random events are uniquely related to conspiracy
    thinking.


    # Study 3


    We began this article with a real-life example of conspiracy thinking in which
    a streak of cancer diagnoses among leftist Latin American leaders triggered one
    of them, Hugo Chavez, to if the US government may have conspired against them.
    In this case, the implausible perception of causal connections between events
    led to conspiracy thinking about the same events. This article is protected by
