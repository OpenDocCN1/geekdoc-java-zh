    # Key Dependent and Independent Variables


    Conspiracy thinking was measured by four items developed by Ucininski, Klofstad,
    and Atkinson (2016) referring to the belief in secret, influential political actions
    by unspecified groups: “Much of our lives are being controlled by plots hatched
    in secret places,” “Even though we live in a democracy, a few people will run
    things anyway,” “The people who ‘run’ the country are not known to the voters,”
    and “Big events like wars, economic recessions, and the outcomes of elections
    are controlled by small groups of people who are working in secret against the
    rest of us.


    All items used a five-point scale ranging from strongly disagree (1) to strongly
    agree (5). The measures were administered in Waves 1 and 4. Responses were recoded
    to run from 0 to 1 and averaged to form scales; higher scores indicate greater
    Conspiracy thinking (α=0.82, M=0.56, SD=0.23, Wave 1; α=0.83, M=0.57, SD=0.23,
    in Wave 4).


    Collective narcissism was measured in Wave 4 using five items: “If the United
    States had a major say in the world, the world would be a much better place,”
    “The United States deserves special treatment,” “It makes me angry when others
    criticize the United States,” “Not many people seem to fully understand the importance
    of the United States,” and “I will not be satisfied until the United States gets
    the recognition it deserves” (Golec de Zavala, Cichocka, and Bilewicz 2013). All
    items used a seven-point scale ranging from strongly disagree (1) to strongly
    agree (7).


    Responses were recorded to run from 0 to 1 and averaged; higher scores indicate
    greater CN (α=0.83, M=0.56, SD=0.20).


