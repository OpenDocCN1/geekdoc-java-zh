    # The present research


    In the present studies, we examined whether conspiracy beliefs are related to
    perceptions of causal connection between events – whether or not events co-occur.
    The key strategy of studies is to present participants with sequences of events
    that have some objective structure, where the causal mechanisms for that structure
    are unspecified. Studies 1 and 2 tested the relationship between conspiracy belief
    and causal interpretation of one previously untested type of co-occurrence: spurious
    correlations. Participants read about documented (real-life) spurious correlations
    (e.g., between chocolate consumption and Nobel Prizes) and indicated whether these
    correlations reflect a direct causal connection between the spurious correlates.
    Studies 3 and 4 tested the relationship between conspiracy belief and causal interpretation
    of another type of occurrence: streaks or coincidences in a rash of similar events
    occur closely together in time. Study 3 investigated whether people prefer conspiracy
    explanations for a recent human human tragedy (e.g., the death of a journalist),
    if they see it as not only forming a co-occurrence with similar recent tragedies,
    but causally connected to them. In an experimental design, Study 4 presented human
    tragedies as isolated or part of a streak of three or four similar cases, and
    independently as causally connected (vs. unconnected). It therefore examined perceiving
    events as causally connected affects conspiracy thinking independently of the
    presence of an objective co-occurrence in those events. All materials and data
    can be viewed at:


    https://osf.io/m2g4x.'
