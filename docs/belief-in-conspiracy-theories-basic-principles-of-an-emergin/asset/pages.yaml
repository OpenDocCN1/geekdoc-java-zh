- img_proc: true
  md: 'results could be explained by compartmentalized and abstract approach that
    does not consider the effect of the stigma in a meaningful social context. Another
    important element in Wood’s study, is that it focused on the label effect, while
    granting a prominent place to the content. To the contrary, in our materials,
    we used both the label “conspiracy theories” but also made sure that the conspiratorial
    content was developed. This likely made the conspiratorial identity of our material
    more salient, which might have enhanced its impact on our participants’ perceptions.
    A comparative view of our results and those of Wood (2016), thus, raise the interesting
    question about the respective weight that the label vs. the content of conspiracy
    theories may have on people’s perceptions. Subsequent studies could test these
    effects orthogonally, if technically possible.


    While our paper contributes to the understanding of the public perception of conspiracy
    theories, it does not give a definitive answer to the question of how people firmly
    believe in conspiracy theories in their daily lives perceive themselves and evaluate
    conspiracy theories. With respect to this latter point, if conspiracy theories
    can be a stigma, they can also be rewarding, depending on contextual and personal
    factors. For example, a romantic and socially valued picture of the conspiracy
    theorist fighting injustice sometimes lumps their sinister counterpart. Researchers
    have already mentioned this ambivalent (Uscinski & Parent, 2014; Wood, 2016).
    In this regard, research focusing on the role of motivational grounds of conspiracy
    beliefs shows that conspiracy believers satisfy their need for uniqueness through
    their belief in conspiracy theories (Imhoff & Lambert, 2017; Lantian et al., 2017).
    Uniqueness, could be an important junction point between conspiracy theories and
    stigma. (Snyder & Fromkin, 1980). In sociology, it has been noted that people’s
    counter-normative behaviors (the “outsiders” who break the norms) could lead to
    stigmatization (Becker, 1963). In fact, an attribute is not deviant in itself
    but it all depends


