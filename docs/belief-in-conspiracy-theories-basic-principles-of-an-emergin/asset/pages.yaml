  md: 'During a professional dinner where you barely know anyone, the conversation
    is turning to the last terrorist attacks in your country. You are convinced that,
    contrary to what the official reports claim, these terrorist attacks have been
    secretly planned by your own government. Yet, would you be motivated to defend
    publicly your position, or would you avoid giving your opinion for fear of being
    socially excluded? The second option would surely reflect the existence of a social
    stigma attached to conspiracy theories. The current work sought to test whether
    theories carry a social stigma, by getting people to defend conspiracy theories.
    If, after defending conspiracy theories, people anticipate fear of social exclusion
    as a result of negative evaluation of the self, then conspiracy theories might
    carry a social stigma.


    In recent years, the number of empirical and theoretical works about belief in
    conspiracy theories has exponentially increased, teaching us about the structure,
    correlates, and consequences of conspiracy beliefs. For example, lack of control
    (Whitton & Galinsky, 2008), uncertainty (Whitton, Galinsky, & Kay, 2015), ambivalence
    (Van Harveland, Rutzens, Schneider, Nohlen, & Keskins, 2014), and perspective-taking
    of a group that is concerned with a threatening event (van Proijen & van Dijk,
    2014) are all factors that increase endorsement of conspiracy beliefs. On average
    and without being exhaustive, people who believe in conspiracy theories lack trust
    in others (Wagner-Egger & Bangerter, 2007), are more likely to see nonhuman agents
    as possessing human characteristics (Brotherton & French, 2015; Douglass, Sutton,
    Callraw, Harvey, 2016; Imhoff & Bruder, 2014), have more need for uniqueness (Imhoff
    & Lamberty, 2017; Lantian, Muller, Nurra, & Douglass, 2017), believe more in paranormal
    (Brotherton, French, & Pickering, 2013; Darwin, Neave, & Holmes, 2011; Lantian,
    Muller, Nurra, & Douglass, 2016; Latino, Mendoza, Sims, & Chin, 2014), and have
    lower education (Douglas et al., 2016; Van Rooijen, 2017). Finally, conspiracy
    beliefs have negative consequences on health and


    This article is protected by copyright. All rights reserved.'
