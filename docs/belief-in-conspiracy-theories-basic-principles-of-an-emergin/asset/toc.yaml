  - 阴谋思维。在两个样本中，均使用一个包含17项的量表评估了对社会事件从阴谋角度进行思考的普遍倾向。量表项目包括：(1) “那些有权的人会利用阴暗手段来获取利益或优势，而不是失去它，”(2)
    “我很少好奇有权者对他们的行为有何隐藏的理由”(R)，(3) “总有权势集团在策划操纵选举结果，”(4) “媒体是那些有权者的傀儡，”(5) “政治或世界事务中没有一件事是偶然或意外发生的，”(6)
    “权力者的行为通常就是他们所看到的现象，”(7) “许多重大事件发生在一个少数有影响力的人物的行动背后，”(8) “无论人们如何想，这个国家的大部分权力集中在少数幕后操作的精选个人手中，”(9)
    “有权的人会不择一切手段隐瞒真相，免受公众审查，”(10) “媒体通常报道权力中心内部‘幕后’发生的事情”(R)，(11) “公众通常不知道这个国家最有影响力的人的身份和行为，”(12)
    “有时政治和政府看起来如此可疑，以至于人们无法真正理解正在发生的真相，”(13) “媒体隐瞒真相以保护有权者的利益，”(14) “有权的人很少向公众撒谎，让他们不知道真实发生的情况”(R)，(15)
    “影响我们的决策是由一小群人做出的，”(16) “我们的生活不受权势者秘密行动的控制”(R)以及(17) “不存在一个操纵世界绳索的权势者‘秘密结社’”(R)。这些项目采用七点计分量表，分值从1（非常同意）到7（非常不同意）。对项目取平均值形成一个量表；得分越高表示阴谋思维越强（样本1：α=0.91,
    M=0.64, SD=0.18；样本2：α=0.90, M=0.66, SD=0.17）。
- - '##'
  - 通用阴谋理论认同。样本1中，使用Swami等人（2010）开发的15项量表评估了通用、非意识形态阴谋理论（CT）的认同（α=0.92, M=0.38, SD=）。样本2源于一项更大的调查，使用了Miller等人（2016）开发的较短的三项量表，以限制调查并减少参与者的疲劳感（α=0.61,
    M=0.43, SD=）。项目包括：(1) “有些人认为美国政府掩盖了1947年新墨西哥州的一起UFO坠毁事件。另一些人不相信。”(2) “有些人认为奥斯瓦德杀害肯尼迪总统是阴谋的一部分，其中另一些人认为奥斯瓦德是独行其事。”(3)
    “有些人认为，国家交通委员会的调查显示，1996年7月纽约坠毁并非设备故障，而是由外力造成的。”所有项目均编码，得分越高对阴谋理论认同越高，取平均值。
- - '##'
  - 意识形态阴谋认同。对于保守派或自由派分别具有意识形态阴谋理论（CT）认同，使用了Miller等人（2016）开发的量表。共有四个保守派项目（a=0.62,
    M=0.28, SD=）：(1) “有些人认为奥巴马出生，可能出生另一个国家，还是出生另一个国家？”(2) “2010年的医疗法授权政府小组对医疗保险做出决策，可能授权政府小组对医疗保险做出决策，可能授权政府小组对医疗保险做出决策，可能授权政府小组对医疗保险做出决策。”(3)
    “有些人认为全球变暖是一个骗局。另一些人不相信。”(4) “有些人认为萨达姆参与了针对9/11的袭击。另一些人不相信。”共有三个自由派项目（α=0.63,
    M=0.38, SD=）：(1) “高级官员在2001年9月袭击发生前完全知道，可能在2001年9月袭击发生前知道，可能在2001年9月袭击发生前完全不知道。”(2)
    “有些人认为2005年夏天卡特娜飓风袭击墨西哥湾时，联邦政府破坏了奥尔良的堤坝，以便贫民社区被淹没。”(3) “有些人认为共和党欺诈了2004年的选举。另一些人不相信。”
