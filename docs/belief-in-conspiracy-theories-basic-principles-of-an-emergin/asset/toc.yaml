- - '##'
  - 自我中心威胁偏向（Egocentric Threat Bias）。为了衡量参与者与他人相比感到自己特别容易受到威胁的程度，我们开发了三个项的李克特量表（likert-scale）题目（例如，“我和我的同类人类暴露在威胁中的程度是相似的”，为反向编码）。答案采用从“完全不”到“非常多”的四点李克特量表。尽管这些题目可能与通常认为的偏执症（即认为自己被负面对待）有很大重叠，但我们加入此量表是为了探索对阴谋论是否也如此。
- - '##'
  - 社会群体的感知善意（Perceived Benevolence of Social Groups）。为了测试阴谋论信念是否与普遍的低信任无关，而是专门对权力群体的低信任，我们要求对不同群体的善意作为核心组成部分（改编自
    Ellett, Allen-Crooks, Stevens, Wildsch, & Chadwick, 2013）。参与者在七点李克特量表上四个社会群体的善意进行判断，每个群体包含四个题目（例如：敌对与友好；想伤害我
    vs. 想帮助我）。这些社会群体代表了权力（经理、政治家）或无权力（学生、老年人）群体（Imhoff and Brader, 2014）。
- - '##'
  - 大五人格调查（Big Five Inventory）。人格的五个维度通过短版大五人格调查表（BFI-K, Rammstedt & John, 2005）测量，共包含21个题目。每个维度由四个题目测量*，其中对新体验的开放性由五个题目测量*。答案在从“不同意”到“同意”的五点李克特量表上给出。
- - '##'
  - 控制领域（Spheres of Control）。控制领域通过三个子分量的九个题目进行评估，其中有三个题目（Paulhus, 1983）分别衡量个人的（例如，“当我得到我想要的东西，通常是因为我付出了努力。”）、人际的（例如，“我在结交和维持朋友方面没有困难。”）以及社会文化的（例如，“只要足够努力，我们可以消除腐败。”）。答案在从“不同意”到“同意”的七点李克特量表上给出。
- - '##'
  - 控制感（Feelings of Control）。为了评估参与者的总体控制感，他们在一个连续滑动量表上从0%（完全不）到100%（绝对）指示了他们在多大程度上可以控制对其生活的负面影响。
- - '##'
  - 政府信任（Trust in Government）。对政府的信任通过四个题目测量（Davis & Smith, 1996；例如，“治理国家的人并不真正关心你过得如何。”），范围从完全不同意（1）到非常同意（5）*。
- - '##'
  - 威权主义（Authoritarianism）。威权主义通过四个题目测量（例如，“我们应该感谢那些告诉我们该做什么以及如何做的领军人物。”；Schmidt,
    Stephan & Herrmann 1995）*，在从“不同意”到“同意”的七点李克特量表上进行。
