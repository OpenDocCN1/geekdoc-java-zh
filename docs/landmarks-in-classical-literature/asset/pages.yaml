  img_proc: true
- pgno: 13
  md: '# 2 Landmarks in classical literature


    development of our own cultural history; and to present against a background of
    the history – political, social, and cultural – of the ancient world.


    A novel or a poem or a play, while it is being experienced, is an event in time
    like a piece of music, not a thing. (Of course the text of a work of literature
    can be written down, as can a musical score, and it may appear to be a thing in
    that state; but it remains an event only long as it is unread or unheard, when
    it becomes an event once more.) Now these events will have certain effects, depending
    on the skill and understanding of the readers or listeners, who will experience
    intellectual, imaginative, emotional, and even physical responses to them. It
    is obviously important that readers and listeners should hold themselves up to
    these responses during such events, and should welcome the interest, wonder, pleasure,
    amusement, anger, or whatever may result from reading or hearing works of art.
    This is what I hope readers of this book will do when I suggest that a work is
    good, and worth their attention.


    What cannot be explained is why a particular work of art is beautiful. Beautiful
    works can induce a transcendental state of happiness in experienced and receptive
    listeners or readers that goes beyond the describable pleasures of the intellect,
    imagination, and emotion. There are no words that can usefully say why Bach’s
    B-minor Mass is beautiful though there are plenty that can say why it is interesting
    or satisfying or well made or well performed – and the problem of explaining the
    beauty of works of literature is essentially the same.


    # The classical canon


    The acknowledgement of the most important writers of any period – of canonical
    writers, as they are called – both forms and safeguards its cultural tradition.
    Some of the canonical authors of the ancient world were identified as being canonical
    in their own time, a position which writers and critics of later periods have
    confirmed by acknowledging them to be their greatest and most influential predecessors.
    The epic Homer and Virgil are the most classical – in that their works have always
    been considered valuable and exemplary as well as traditional of the primary writers
    discussed here, but the others follow closely behind them: the lyric poets Pindar
    and Horace, Ovid the poet of love and myth, the dramatist Sophocles, the philosophers
    Plato and Cicero, and the'
  merge: -1
