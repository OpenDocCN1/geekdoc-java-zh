  md: '# 12 Maintaining the state


    # Economics and technology


    The expanding Roman Empire had three main economic interests: these were the needs
    to ensure an adequate supply of food and other goods for Rome itself; to enable
    the free flow of trade throughout the Empire; and to provide logistical support
    for its military forces in the form of reinforcements, pay, and services. All
    three were met to a large extent by the process of expansion by conquest. North
    Africa and parts of Spain became Rome’s granary; Italian olive oil, wine, and
    pottery were traded for foreign goods ––– minerals and luxuries – everywhere from
    Britain to Mesopotamia; and the Roman armies’ conquests proved them with more
    soldiers, treasure, and supplies.


    All this indicates the importance of good communications. Mediterranean trade
    goods had been carried by sea archaic times, and remained of prime importance,
    especially for carrying heavy commodities and moving troops. But Rome began to
    build fine all-weather roads in Italy from the time of the early Republic – chiefly
    for military purposes – and this magnificent road system, eventually stretched
    the Empire, was used not only by marching troops, but also by transport for carrying
    lightweight trade goods. It was also essential for the official postal service
    of couriers who normally averaged distances of 80km a day (or up to 200km a day
    in emergencies), using horses and wheeled vehicles. However, there was no postal
    service available to the public, and private letters were normally carried between
    correspondents by their servants.


    Great technical skill was also shown in Roman buildings other than roads, as is
    still to be seen in great public works such as the extraordinary aqueduct bridge
    of the Pont du Gard in Provence (20–16 BC), and the Pantheon in Rome (117–38 AD)
    with its vast dome of'
