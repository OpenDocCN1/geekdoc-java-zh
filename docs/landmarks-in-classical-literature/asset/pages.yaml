  md: '# 6 Lyric poetry: Pindar and his predecessors


    # The lyric


    There is evidence that Greek lyric poetry – ‘lyric’ meaning sung to the accompaniment
    of a lyre – flourishing in the seventh and sixth centuries BC; the form was already
    well developed technically, and had probably been in use for some time. The surviving
    verse of the four most notable early lyricists – Almanac, Sappho, Alcaeus, and
    Anacreon – is so scanty, consisting of a small handful of short poems, collections
    of odd lines quoted by the literary critics of later centuries, and other short
    passages found on scraps of papyrus, that it is hard to get a clear view of it.
    It is as if the early work of Wordsworth, Coleridge, Keats, and Shelley were represented
    for us only by one or two short poems each, a few hundred odd lines quoted in
    textbooks, and a few other incomplete passages on bits of torn-up paper recovered
    from waste baskets. It is not until we get to Pindar, writing in the fifth century
    BC, that we have a substantial portion of the work of a major lyric poet.


    There was a special dialect of Greek used for lyric poetry, as was for epic poetry,
    that was not in ordinary spoken use, and individual lyric poets combined with
    their own regional dialects of the language (Aeolian, Ionian, Dorian, and so on).
    There were two main branches of lyric poetry, choral and monadic. Choral poetry,
    at least partly sung by a choir and accompanied by instrumental music and dancing,
    was written for public functions such as religious ceremonies, games, processions,
    and weddings. An early choral poet was Alcman, a Spartan who was writing in the
    Dorian dialect around 625 BC; of his poetry about 100 lines plus fragments survive
    out of six books (papyrus rolls). The greatest exponent of the choral lyric was
    Pindar, whom we shall be discussing in the second part of this chapter.'
