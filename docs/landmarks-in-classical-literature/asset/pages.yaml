  md: '58 Landmarks in classical literature


    # Sappho and Anacreon


    The other branch, monodic or solo lyric, was performed without a choir; although
    it tended to be more personal in its approach than choral lyric, there was still
    a greater tendency to generalise is found in, say the poetry of later times. Sappho,
    a contemporary of Alcman from the large island of Lesbos on the Aegean coast is
    the only major woman writer of the ancient world that we know of, and we know
    little enough of her. It is the sad fact that Sappho''s surviving work from the
    late seventh century BC is represented by two short poems (one complete of 28
    lines, one quite complete of 17 lines), and about 200 fragments, some of extracts
    from 15–20 lines from longer poems but mostly disconnected single lines or parts
    of lines, from nine books of lyrics which probably ran originally to at least
    7,000 lines.


    This is piety, because the surviving poems in the Aeolian dialect are extraordinarily
    powerful love lyrics. Here is the second of them, an unsurpassed carass of the
    physical effects of falling in love, in a literal prose translation:


    > He seems fortunate as the gods to me, the man who sits opposite you and listens
    to your sweet voice and lovely laughter. Truly that sets my heart trembling in
    me for. When I look at you for a moment, it is no longer possible for me to speak;
    my tongue is pasted, at once a subtle fire has stolen my flesh, I see nothing
    with my eyes, my ears hum, sweat pours from me, a trembling seizes me all, I am
    greener than grass, and it seems to I am little short of dying. But all can be
    endured, since even a poor man...


    Sappho, who had a homosexual disposition though she is also said to have been
    married with a young daughter, appears to have been a leader and perhaps a teacher
    in a circle of intelligent, like-minded women and girls at a time when social
    custom on Lesbos allowed greater freedom of activity and association than was
    normal in ancient Greece. Nothing is known about her later life.


    Sappho''s contemporary Alcaeus, who also came from Lesbos spent much of his life
    in exile, was another solo lyricist writing in the Aeolian dialect who was much
