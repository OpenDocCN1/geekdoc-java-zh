  md: '# Landmarks in classical literature


    The monarchy was finally overthrown in 510 BC and succeeded by a form of oligarchic
    republic, dominated by pairs of magistrates (consuls) were annually elected; other
    elected officials were soon added, and the powerful senate made up of patricians
    and former officials. The Republic, later modified as the mass of Roman citizens
    (the plebeians) got an increasing say in politics, proved to be an efficient form
    of government for an expansionist city-state, and a solid basis for its military
    organisation.


    In two hundred and fifty years of almost non-stop warfare, the late sixth to the
    early third century BC, Rome took control of most Italy south of the Po valley.
    Rome itself was set back – by Celts (or Gauls) from the north in 390 BC – but
    in the long run no tribe or state could stand up to the Roman army (pp. 135–7
    below). With most of Italy in its power, Rome absorbed the remaining Greek colonies
    in the south (280–275 BC); fought three hard but eventually successful wars against
    the Carthaginians² and suppressed the Celtic tribes in northern Italy (202–190
    BC), which became a Roman province.³ Masters of all Italy, the Romans were now
    unstoppable and, as we shall see in the next chapter, they used their great military
    and economic strength to build an empire hitherto unparalleled in the west. One
    of its central and most cohesive institutions was the Latin language.


    # The Latin language


    Latin is an Indo-European language related only distantly to Greek, but sharing
    with Greek the characteristic of being a heavily inflected tongue, in which variable
    suffixes of nouns, adjectives, and verbs could override word-order in determining
    the meaning of a sentence (see pp. 20–1 above). It developed into what we call
    Classical Latin, which was an artificial language of literature and rhetoric,


