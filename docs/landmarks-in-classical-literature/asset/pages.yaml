  md: '# The spread of civilisation


    # The past in the present


    Today buses carry the tourists up to the ancient site of Delphi, a few miles north
    of the Gulf of Corinth. There they are shown the ruins of the sanctuaries of Apollo
    and Athena, and the usual scattering of foundations and drums of stone columns,
    much like other sites they have been seen to elsewhere in Greece. Suffering a
    little from the heat, they admire the spectacular setting – a great natural amphitheatre
    beneath the 2,460-m summit of Mount Parnassus – listen to the winged echoes of
    Athena, the archaeological museum, and are returned, tired but culturally enriched,
    to their air-conditioned ship or hotel.


    Their predecessors in ancient times were the pilgrims and suppliers who climbed
    the Sacred Way on foot to worship at Delphi, the mid-point of the classical world,
    and to consult the miraculous oracle of Apollo. For more than eleven hundred years,
    from some time in the eighth century BC the site was closed by the Christian Emperor
    Theodosius at the end of the fourth century AD, Delphi was revered as a religious
    center of supreme authority and importance, supporting the worship of the Olympian
    gods, especially the cults of Apollo and Dionysus, and giving advice and encouragement
    to those who asked for it. In its great days there were sanctuaries, temples,
    treasures for the worshippers'' offerings, free-standing columns and statues,
    and a stream from the Castalian Spring for purification; all attended by the priests
    of Apollo, and the Pythia, the priestess who revealed the sometimes ambiguous
    prophecies imparted to her by the god.


    If we now look back nineteen hundred years, to about 100 AD, we discover that
    one of the priests of Delphi was a middle-aged philosopher and historian called
    Plutarch, a Greek who was proud to have the status of a Roman citizen. Coming
    from a distinguished'
