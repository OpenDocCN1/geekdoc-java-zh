    (Eclogue 1.1–5)


    The excellences of Virgil''s Latin, alas, be reproduced in translation. Fortunately
    the available English translations include some very good ones, which retain some
    echo of Virgil''s poetry, and which give us his words as faithfully as can be
    done in another time and place. (See the section on Translations below.)


    # The Georgics


    Two-and-a-half times as long as the Eclogues – 2188 lines to 829 – the four books
    of the Georgics are ostensibly a didactic account of various aspects of Roman
    farming practise *Georgica* comes from a Greek word meaning ''husbandry''. Book
    1 deals with field crops; Book 2 with trees and vines; Book 3 with domestic animals;
    Book 4 with bees. The work does in fact contain useful teaching on these subjects
    – though much is omitted – but it is not only, or even primarily, a farmer''s
    handbook. Virgil''s intention, rather, was to show how the greatness of Italy
    was based on a rural life of hard work undertaken in harmony with nature, a life
    without difficulties but which one would deserve the rewards of divine providence.
    In this poem – dedicated to his patron Maecenas, but with an eye on Octavian –
    Virgil''s country life is adapted, not from the idealized pastoral of Theocritus,
    but from the more down-to-earth *Works and Days* of Hesiod with its moral-didactic
    insistence on the importance and value of work, and its acceptance of divine rule
    (see pp. 41–22).


    The farmer can never relax his efforts:


    for everything by nature''s law

    Tends to the worse, slips ever backward, backward.⁸

    As with a man who scarce propels his boat

    Against the stream: if once his arms relax,

    The current sweeps it headlong along the rapids.


    The farmer''s labour is a treadmill:

    All round the year he treads in his own tracks.


    > ⁸ Naturam expelles furca, tamen us recurret (''You drive Nature out with a fork,
    but she always comes back'', Horace, Epistles I. 10. 24).'
