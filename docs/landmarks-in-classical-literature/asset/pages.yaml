    But history, as we now understand it, is more than the record of outstanding exploits
    and great battles. The biography of famous men and women is certainly a form of
    history; and Plutarch chose to write his history in this way because it was particularly
    apart for serving the underlying purpose (common to most ancient historians) of
    conveying moral instruction about how men should think and behave. (It was indeed
    this purpose, at its plainest in Plutarch, that was partly responsible for the
    ancient historians'' relative lack of interest in accuracy and original research,
    their preference for what should have been said and done over what probably.)
    Plutarch''s biographies are instructive in this way, but they are also elegantly
    written and thoroughly readable. They are, in many cases the only accounts that
    have survived the people and events that they portray; and, where it is possible
    to check them against parallel accounts, where they are found to be sufficiently
    accurate by the standards of ancient history.


    Although the current paperback translations present Plutarch''s Greek and Roman
    subjects in separate volumes, he undoubtedly intended that each Greek and Roman
    pair should be read together and considered in relation to each other, writing
    a ''comparison'' to the conclusion to many of the pairs of Lives. There are obvious
    pairs, such as the orators Demosthenes and Cicero, and less obvious ones such
    as the Athenian statesman and thinker Solon and the man of actionius Valerius
    Publicola (or Poplicola), reportedly Consul in 509 BC, who may have helped his
    colleague Junius Brutus to expel the Tarquins and to establish the Republic).
    But, whether the subjects were famous or not, the fact remains that the stories
    of each pair were supposed to be mutually enlightening, and it is unfortunate
    that they are separated in the Penguin Classics and Oxford World''s Classics volumes.


