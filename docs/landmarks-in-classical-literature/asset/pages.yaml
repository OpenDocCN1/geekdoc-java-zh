    # Apuleius


    Coming to The Golden Ass, after smiling at what is now innocent simplicity of
    Daphne and Chloe and scenting the corruption of the Satyricon, is to discover
    a lively and entertaining novel that belongs to a more familiar tradition of fiction;
    and indeed The Golden Ass has had a greater influence on the development of the
    western novel than any other work of classical literature. It is a fantasy incorporating
    fable and folk tale, and it is considerably more outspoken about sex and bodily
    functions than was commonly acceptable in Europe in the period after the Renaissance
    and before the twentieth century. Nevertheless its approach to structure, characterisation,
    and narration foreshadowed the kind of fiction that had come to be the dominant
    form of literature over the past three centuries.


    Apuleius was born in the mid-120s AD in what is now Algeria, the son of one of
    the chief magistrates of the Roman colony of Madadaurus. He was a polymath, with
    interests encompassing philosophy, the law, agriculture, medicine, astronomy,
    music, arithmetic, and magic as well as literature, and he wrote and lectured
    about them with charm and vitality. Having married a rich widow in his early thirties,
    he was accused by his disappointed relatives of having bewitched her, but in the
    subsequent trial he was acquitted. He seems to have spent the rest of his life
    in Carthage, writing and teaching; to have written The Golden Ass in the 160s;
    and to have died not before c.170.


    Apuleius took the basic plot of The Golden Ass, in which a first-person narrator
    Lucius is transformed into an ass, from an early Greek novel of which anridged
    survives, and expanded it with new material, probably doubling its length but
    retaining its original Greek setting. We meet the hero Lucius on a journey to
    Thessaly, where his adventures begin and he shows an unhealthy interest in the
    practice of magic. Before long he pursues a slave girl, with whom he is having
    an affair, to steal a magic ointment from his mistress, who is a witch; but, instead
    of turning him temporarily into an ass as he had hoped, the ointment turns him
    into an ass, and for most the rest of the tale Lucius relates his largely disagreeable
    experiences as a beast of burden before he finally returns to human form. As an
    ass, he tells us, he is


