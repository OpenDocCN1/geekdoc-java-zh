  md: '# Appendix – Classical studies


    # The survival of ancient texts


    The survival of ancient texts has been, for the most part, a chancy business.
    The texts of the small number of authors who were regarded as canonical in ancient
    times have survived virtually complete, and in reasonably good order. But for
    the rest time has winnowed out much – in some cases or nearly all – of what they
    wrote. The texts of the works that did survive were marred by inaccuracies and
    gaps as a result of the many times they were copied and recopied.


    There were various reasons for the disappearance of so many texts. In the first
    place, papyrus rolls were fragile and wore out, when they might or not be recopied,
    perhaps as codices. And eventually codices wore out too, or were reused as palimpsests.¹
    and again there was a chance that the early texts might not be recopied. Texts
    dropped out of the school curriculum (or were never in it), authors went out of
    fashion, or were considered religious or obscene. Dramatic texts, even of the
    greatest playwrights, were originally intended for performance rather than for
    reading, disappeared in huge numbers.


    The result of all this was that a very large number of classical texts, even if
    they survived into late antiquity (say until the sixth to the eighth century AD),
    were lost by the time of interest in the classics during the early Italian Renaissance
    of the thirteenth and fourteenth centuries; and we constantly come across references
    in works that do survive to other works do not, even those of major writers. The
    ten primary authors treated in this book, we appear to have made of Homer, Herodotus,
    Virgil, Horace, and


    > ¹ A palimpsest is a document of parchment or vellum from which the original
    writing has been erased by washing and scraping so that it could be written on
    again. Sometimes, but not always, the original writing can be read by multi-spectral
    imaging.'
