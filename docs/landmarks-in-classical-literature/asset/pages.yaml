  md: '# Virgil: from pastoral to epic 161


    his direct descendant, as were the early kings of Rome; and thus formed the link
    that the Romans sought between themselves and the Greek world of the heroic age.
    Since the Julian gens, to which Julius Caesar and Octavian belonged, claimed descent
    from Aeneas¹¹ (and therefore from Aphrodite/Venus as well), this myth was the
    perfect vehicle for Virgil''s greatest work, celebrating the greatness of Rome
    in general and of Octavian in particular.


    The Aeneid is in twelve books of hexameters totalling 9,896 lines (compared with
    the 15,000 of the Iliad and the 12,000 lines of the Odyssey so that it is over
    one-third of the length of both the Homeric epics put together. The overall plan
    of Virgil''s epic was plainly Homeric, with its main elements reversed: now the
    odyssey of the man comes first and the armed fighting follows it; the Homeric
    parallels are many and obvious.


    In Book 1 Aeneas and his comrades have just sailed from Sicily for Italy, but
    their ships are wrecked in a storm stirred up by Juno, the enemy of Troy. Neptune
    sees them safe ashore on the north African coast, where they are welcomed in Carthage
    by the Phoenician queen Dido; and Venus arranges for Dido to fall in love with
    Aeneas.


    In Book 2 Aeneas relates the story – told briefly by Homer – of the final fall
    of Troy to the deceitful Greeks with their wooden horse, the last-ditch stand
    of the Trojan heroes, and of Aeneas''s escape with his father Anchises and his
    son Iulus, but without his wife Creusa, who died in the melee and whose ghost
    tells him of his destiny.


    Book 3 continues the tale of Aeneas'' adventures, which are strongly reminiscent
    of those of Odysseus. The Trojans are told by oracles to find the land of their
    fathers. At first they believe this to be Crete, but then learn that it is Italy,
    and further trouble them on the way: they are attacked by the foul Harpies, they
    have an unexpected meeting in Illlyria with Priam''s son Helenus and Andromache
    who rescue a member of Odysseus''s crew who had been accidentally marooned with
    the Cyclopes, and old Anchises dies. In the end they reach Libya and the unfortunate
    Dido.


