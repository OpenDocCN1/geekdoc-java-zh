  md: '# The Iliad


    A word, first, about the treatment of the more than 900 proper

    names that are included in the Iliad. English translations of Homer

    have generally followed one of three main courses for expressing

    Homeric names. (1) The Greek names are Latinised throughout,

    with English versions of the Latinisations where they exist and are

    familiar: Pope not only writes Achilles and Hector, but he also

    gives us the Roman names of the Greek gods and heroes: Aajax (Latin

    Aiax) for Greek Aias, Jupiter (or Juve, Latin Iuppter) for Greek

    Minerva for Athena, Pollux for Polydeuces (or Polydeuces),

    Ulysses (Latin Urixes) for Greek Odysseus, and so on. (2) The Greek

    names are transliterated faithfully as possible. This produces

    Achaoi for Echaens, Aineas, Mykenai for Mycenae,

    and Patroklos for Patrocrus. (3) A compromise is sought, avoiding

    both extreme Latinisation and pedantic transliteration. This course,

    which is followed here, is unashamedly inconsistent. Greek forms

    are generally preferred to Roman, but (a) the Latin termination -us

    used in preference to the Greek -os; (b) ks are replaced by cs; and (c) someised
    and anglicised forms are used when they are

    appropriate. The outcome is that the first of the following

    pairs of names is preferred to the second: Achilles/Akhilleus, Ajax/

    Apollo/Apollo or Phoebus, Artemis/Dania, Athena/Athens or

    Minerva, Castor/Kektor, Hephaestus/Hephaistos or

    Vulcan, Heracles/Heracles or Hercules, Polydeuces/Polydeuces or

    Pollux, Priam/Priamos, Thebes/Thebai, and Troy/Troia.\ ''In the end'',

    nas Martin Hammond says in his translation of the Iliad, ''the question

    is an aesthetic tone, depending on the balance struck between the

    proper desire to assist the Greetness of the Greek characters, and

    proper respect for the long tradition of Greek literature and literary

    reference.''¹It is my intention to strike such a balance in the

    of Greek and Roman names throughout this book.


    Returning, then, to Homer''s poem: the Iliad is the first work

    of western literature that is known to use: a huge narrative in verse

    with a compelling structure, well-developed characters, and a com-\anding poetic
    style. It is the story of a few crucial days'' fighting in

    the Trojan War. Nine years before the Iliad begins, Helen, the wife of

    King Menelaus of Sparta, was abducted by Paris, one of the sons

    of King Priam of Troy; and Menelaus, together with his elder


    > ¹ Homer, The Iliad, trs. by Martin Hammond (1987), Penguin Classics p. li; see
    also

    pp. 5–7 above.'
