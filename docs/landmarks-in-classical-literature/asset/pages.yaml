- pgno: 12
  md: '# Introduction


    # Reading the classics today


    The civilisation and literature of ancient Greece and Rome, along with the Judaeo-Christian
    religion, have been the bedrock of the thought and culture of the western world
    since the high Middle Ages, and they tend also to underlie the way Europeans and
    Americans think and write. Until quite recently the classics have also underpinned
    western education, first-hand experience of at least a few Roman authors in the
    original Latin being the basic requirement of anything more advanced than elementary
    schooling.


    But, although western culture is based on the classics, not many schoolchildren
    now learn Latin, and very few indeed learn Greek; while the ancient languages
    are long gone for university entrance. And because the Greek and Latin languages
    are taught to so few pupils at school, the history and culture of the ancient
    civilizations tend to be disregarded, both in school and afterwards. It is true
    that the classics are still taught on a small scale in British secondary schools¹,
    and that there are some twenty-five university departments of classics in Britain
    (few of them large on the scale of the major humanities and science departments);
    but it is also true that the classics are no longer taught to anything like the
    extent they once were. An important part of our heritage – the basis of our thought
    and art – is in danger of being forgotten.


    The purpose of this book is to make available the work of some the most important
    Greek and Roman writers, chosen both for their intrinsic quality and for the influence
    they have had on


    ¹ In 1998 there were 10,945 UK candidates for GCSE Latin, 3,529 for Classical
    Civilisation, and 980 for Greek; compared with (the nearest thousand) 1,006,000
    for Combined Science, 638,000 for English, 491,000 for English Literature, 385,000
    for Design and Technology, 336,000 for French, and 134,000 for German (The Times,
    27 August 1998).'
