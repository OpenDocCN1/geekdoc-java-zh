    Tales from Ovid, 1997, Faber p. 3)


    It turns out that metamorphosis, miraculous change of form, is a less important
    feature of the book than the entertainment provided by the wonderful tales the
    poet tells – a great chronological sequence from the creation down to his own
    times – and the skill and care with which the poem is composed. Metamorphoses
    is an unprecedented collection of traditional stories told with a charm and brilliance
    that has affected writing ever. This is where Shakespeare got several of his notions,
    including the story of Pyramus and Thebis which he caricatured in A Midsummer
    Night’s Dream (c.1594–). Here is the passage which relates to a lioness blooded
    Thebis’s shawl, given in Ovid’s economical Latin ( 56 words), and in translations
    in prose (97 words) and verse (73 words):²


    uenit ecce recenti

    caede laena bona spoumantis oblitus ictus

    depositura sit uicini sunt in funda;

