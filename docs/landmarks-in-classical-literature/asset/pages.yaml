    # Hesiod


    The other poet of Homer''s whose verse has come down to us is his near-contemporary
    Hesiod, who also used the epic dialect for his two surviving poems, the Theogony
    and Works and Days. But, despite the epic dialect and the technical similarity
    between the verse of the two poets, neither of Hesiod''s two poems is an epic,
    the first being largely a genealogical account of the gods, and the second a collection
    of conservative countryman''s everyday wisdom. They are quirky and agreeable works,
    rich in information about the culture of the Homeric period; and they can also
    serve the modern reader as extended footnotes to the Iliad and the Odyssey.


    Hesiod''s father came from the important Aeolian Cymne on the coast of Asia Minor
    but, unable to make ends meet there, he moved to the poor farming village of Ascra
    in Boeotia where Hesiod and his brother Perses were brought up. Hesiod claims
    at the beginning of the Theogony that his vocation as a poet was revealed to him
    by the Muses while he was tending his father''s flocks on the slopes of Mount
    Helicon, and that they instructed him to begin by celebrating the family of the
    immortal gods. This was to do in passages of great beauty, as the hymns to the
    Muses and Hecate, and in the idiosyncrasies of his didactic poems. Nothing else
    is known about him but the few personal details he includes in the two poems,
    not the approximate dates of his birth and death.


    The Theogony continues with an exposition of the Greek creation story, the myth
    – probably of eastern origin – of what happened before the assumption of power
