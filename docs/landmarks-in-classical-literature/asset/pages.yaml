  md: '# 84 Landmarks in classical literature


    For instance, one of the favourite ways in which all three of them explained complex
    political and military situations was by presenting-’speeches\'', sometimes of
    considerable length, supposedly delivered at the time to various assemblies by
    particular politicians, ambassadors, and soldiers. Rhetoric of this sort was indeed
    a means, much used in antiquity, of informing and persuading friends and foes,
    and no doubt speeches were made by many of the people and on many of the occasions
    quoted by the historians. But the historians themselves were rarely present when
    the speeches – delivered without scripts and without the presence of shorthand
    reporters – were made, so that they cannot be giving us exact accounts of the
    actual words spoken, even if they supply the gist of the arguments used at the
    time. Thucydides – of our historians – the one most obsessed with accuracy – realises
    that such ‘speeches’ cannot be accurate; but then compounds the problem by saying,
    that neither he nor his informants could remember the exact words of what he reports,
    ‘my method has been, while keeping as close as possible to the general sense of
    the words used, to make the speakers say what, in my opinion, was called for by
    each situation’ (History I.22).


    Certainly all three historians wanted to be – and to be accurate in what they
    wrote. Herodotus was always careful to say that he had been told such and such
    thing by this person or that, and equally willing to admit that he did not necessarily
    believe it to be true. Thucydides made a point of not trusting second-hand tales
    and claimed to have checked other sources as far as he could; Xenophon had been
    personally involved in all the events he described. There is no reason to doubt
    that they did their best; but their books, written in the absence of documents
    and in the light of their own attitudes and prejudices, inevitably contained inaccuracies
    and special pleading.


