    but subservient non-citizens called ‘perioikoi’ (neighbors) handled business,
    crafts, and trade, the Spartan citizens were able to devote virtually all their
    time to military training and warfare. The training began at the age of seven,
    when every young citizen to be taken away from home and trained with a group of
    other boys in military discipline and endurance. From twenty-one to thirty he
    lived as a soldier in barracks, or joined the secret police whose job was to keep
    down the potentially mutinous helots who were a source of constant anxiety to
    the Spartans. At thirty he joined an adult military ‘mess’ and stayed there until
    he was sixty, but was free during this period to marry and be children. Not surprisingly
    the result was the finest land army in Greece, expansionist aspirations conflicted
    with those of Athens, a declining population, and a withering of the liberal arts.


    # The Persian Wars, 490–79 BC


    Before the Athenians and the Spartans could fight for supremacy in Greece in the
    Peloponnesian Wars will be described in Chapter 8 below, they had the Persians
    to deal with. By the early century BC the Persian Empire encircled the eastern
    Mediterranean, and the Greek cities on the coast of Asia Minor assisted by Athens,
    and Thrace in northern Greece, continued to give the Persians trouble. The Persian
    King Darius therefore mounted a major invasion of Greece across the Hellespont
    in 490 BC. In a series of famous campaigns and encounters, the Athenian, Spartan,
    and allied armies and navies fought far larger and more powerful Persian forces,
    giving ground when they had to, evacuate Athens, winning the land battle of Marathon
    (490), the naval battle of Salamis (480), and crucially – the land battle of Plataea
    (479). After Plataea the Persians had had enough, and King Xerxes (who had succeeded
    his father Darius in 486) finally withdrew his bat-tered forces from Greece, leaving
    the triumphant and self-confident Greeks to fight each other.'
