- pgno: 8
  md: '# Preface


    Landmarks in Classical Literature is the last in a set of three books about the
    major authors of European literature and their works, from ancient times until
    the early twentieth century. Despite their similarities, each of these three main
    volumes of ‘landmarks’ approaches its subjects in a slightly different way.


    Landmarks in English Literature (1998) is a survey of the major British and Irish
    authors from Chaucer to the 1920s, together with explanations of how the three
    main genres of literature – fiction, poetry, drama – actually works. Then Landmarks
    in European Literature (1999) discusses thirty-two key works of European literature
    from Dante to Brecht, translated from six languages other than English, Now Landmarks
    in Classical Literature surveys the most influential authors of ancient Greece
    and Rome, and says something about their environment, and about translations of
    their work.


    All three books are aimed at ‘general readers’ and students of all ages, people
    who want to discover the delights offered by literature, old as as new. All three
    base their discussions on the texts of English literature, and of foreign and
    ancient literature in translation, that are available nowadays in well-edited
    paperback editions. And the prime purpose of all three is, not to be a substitute
    for reading these wonderful books, but to help and encourage readers to explore
    and enjoy the great literary heritage of the west for themselves.'
