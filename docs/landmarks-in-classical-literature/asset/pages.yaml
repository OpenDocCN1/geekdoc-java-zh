    In the earliest days Athens was ruled by kings, but at some time in the Dark Age,
    perhaps in the eleventh century BC, the monarchy was replaced by three (later
    nine) ‘archons’ or rulers elected for fixed terms and by the members of the aristocracy.
    By the beginning of the sixth century BC the increasing wealth of the rich and
    the desperate poverty and indebtedness of the poor brought the state close to
    collapse. The most severe abuse was that a debtor’s person was taken as the security
    for his debt if his possessions did not cover it whereupon he could be called
    a slave at home or abroad. The danger was averted by the reforms introduced by
    Solon, archon for 594–3, which cancelled all debts for the debtor’s land and his
    person the security, and prohibited all future borrowing secured on the person
    of the borrower. Major constitutional reform introduced by the poet-politician
    Solon was to divide Athenian citizens into four classes in descending order of
    wealth: large landowners, men who kept horses, men who kept teams of oxen, and
    landless men; to open eligibility for election to the legislature to the two upper
    classes; and to re-establish a ruling council of ex-archons (the ‘Areopagus’).
    This brought the rule of the hereditary aristocracy to an end, although there
    was still some way to go on the road to democratic rule; and the struggle for
    power following Solon’s reforms led to the tyranny of the Peisistratos family
    and their aristocratic supporters in the mid-sixth century BC.


