  md: 'The Greek model of concentration on literary subjects and rhetoric was followed,
    with the Greek language and Greek literature being studied as well as the Latin
    language, and Latin literature being added in the first century BC. Except for
    potential soldiers, there was less emphasis on physical training; and the education
    of girls was taken more seriously. Further education might be pursued abroad,
    especially in Athens or Rhodes. By late Republican times Romans could read Greek
    fluently; they were very well read in literature, history, and philosophy in both
    Greek and Latin, and they could apply their knowledge of the two languages to
    rhetorical purposes. As literacy outside the cultured class, what has been said
    about in Greece (pp. 55–6 above) is generally applicable to the situation in late-Republican
    and early-Empire Rome: we have no statistics and can only guess at levels of functional
    literacy in the lower classes; but again it seems unlikely that functional literacy
    was ever achieved by more than 20–30 per cent of the population.


    The papyrus rolled into the chief form of the book in late-Republican and early-Imperial
    Rome, copied, collected, and stored in public and private libraries; and by the
    first century BC the ‘publication’ of books was taking place, by means of the
    multiple copying of texts. We have already seen that deposit libraries, such as
    that of Alexandria, were also copying centres for other libraries and collectors.
    Now an individual, such as Cicero’s friend Atticus, might act as a ‘publisher’,
    employing copies to produce new books for sale before they could be pirated.


    At the same time, in the first century AD, the greatest of all revolutions in
    book production was quite taking place: this was the invention and introduction
    of the codex. A book in the form of a papyrus roll is like a film (or an audio
    tape or a video tape): to find your place in it you have to scroll backwards or
    forwards through the roll, which is inconvenient and time-consuming. A codex,
    on which sheets of parchment or paper are folded into pages attached to each other
    at the spine, is like a gramophone record or a CD or a computer disk: you can
    flip the pages (or move the needle or the reading head) rapidly back and forth
    to find your place easily and quickly; and with a codex you can even access with
    your fingers to several places at once. Codices, moreover, are less bulky and
    more robust than rolls, and parchment is a


