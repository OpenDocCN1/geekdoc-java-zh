  md: '# 30 Landmarks in classical literature


    Hector''s body. Achilles''s anger is finally spent, and he feels a common humanity
    with Priam. Hector''s body is taken back to Troy, the Iliad ends with his funeral.


    Such, in bare outline, is the tragic story of Homer''s first epic; and it is told
    with narrative drive, carefully structured elements, realistic development of
    the main characters, gripping scenes of argument and battle, and brilliant language,
    rich in simile. the structure of the Iliad is built on contrasts between opposites:
    first, general oppositions such as war and peace, Greeks and Trojans, gods and
    human beings, realistic depiction and myth; and secondly the personal positions
    of Achilles/Agamemnon, Achilles/Hector, Athena/Apollo, Menelaus/Odysseus, Hector/Paris,
    Andromache/Helen, Agamemnon/Priam – the list could go on. These contrasts deepen
    and enrich the simple chronological narrative.


    As character, not only do the passions of Achilles and Agamemnon draw us into
    the depths of their quarrel but a large cost of other characters is brought to
    vivid life: among the Greeks Menela, not always brave as he would like to be,
    and the persuasive Odysseus who fights despite his tactical prudence, Ajax and
    Diomedes are stand-up fighters second only to Achilles and Hector, and Thetis
    the innocent ordinary soldier. The Trojans, less-handed than the Greeks, include
    the truly noble Hector and his wife Andromache who must leave for honour''s sake,
    Paris who deserts honour for the sake of a Helen dominated by Aphrodite, and the
    elderly Priam and Hecuba, the sad monarchs whose sons are sacrificed to a war
    they had not sought.


    And there are the gods, some of meddling and quarrel-to the point of frivolity,
    their careless immunity contrasted with the pitiful fragility of the human condition:
    stern Zeus, Apollo and Athena are seriously determined to help the Trojan and
    the Greek causes respectively, and Achilles''s mother Thetis who feels a mother''s
    despair at knowing of the death that is decreed for her.


    The rhetoric of the arguments and discussions between the actors in the drama
    is ornately magnificent, and even carried into battle, where the major combatants
    commonly address each other at length before they set with their spears and swords.
    The battle scenes are likewise grimy realistic, all sweat and cries of pain, giving
    gory anatomical details of exactly what happens when a warrior''s spear-thrust
    or sword-chop connects with a particular part of his opponent''s body. (An example
    is given in the section on translations, pp. 32–4 below.) But even the goriest
    battle scenes are'
