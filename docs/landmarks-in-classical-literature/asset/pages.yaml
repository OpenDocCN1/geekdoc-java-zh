    of the Delphic Oracle) on major trade routes.


    Early colonists set out from Euboea and Dorian Corinth to southern Italy and Sicily,
    founding amongst others the cities of Cumae (near Naples), soon after 750 BC)
    and Syracuse in Sicily (733 BC), while later ones from Ionian Asia Minor founded
    Massilia (Marseilles, 600 BC) and opened the eastern coast of Spain (previously
    dominated by the Phoenicians) to trade with Greece. Some colonies then established
    daughter-colonies of their own: Syracuse founded Marina and Gela founded Agracas
    (modern Agrigento, 580 BC), all in southern Sicily. Colonies to the north-east
    of Greece included numerous eighth- and seventh-century Euboean and Dorian foundations
    in Chalcidice (the three-armed peninsula south of Megara, c.660 BC); Thessaloniki,
    so called after the Euboean city of Chalcis); Byzantium (modern Istanbul), and
    a dozen more colonies, mostly founded from Asia Minor, round the shores of the
    Black Sea in the seventh and sixth centuries BC; and the Athenian colony of Amphipolis,
    a city of great strategic and economic importance in Thrace (437 BC).


    The colonists’ reasons for going were various, but some certainly went in response
    to population increases and food shortages in Greece, as well as simply in order
    to seek a better or more exciting life, often with the firm encouragement of their
    home governments abroad. The colonies universally revered and co-operated with
    their founding cities, but most of them were soon fully independent states, Syracuse,
    for instance, becoming the richest and most powerful city in the western Mediterranean.
    Their importance to the transmission and diffusion of Greek culture throughout
    the ancient world was immense. In particular, the Greeks of southern Italy and
    Sicily (Magna Graecia, Great Greece, as it came to be called) were crucial to
    the cultural development of the Roman civilisation that was to absorb them.'
