    sacrifices, of individual major deities (Jupiter, Mars, Quirinus, and others);
    propition of the guardian spirits (lares) of hearth and countryside; and the practice
    of divination to learn the will of the gods. The archaic deities of Rome, some
    of them of Etruscan origin, were later identified with the anthropomorphic Olympian
    gods that came to Italy with Greek colonists: Jupiter being identified with Zeus,
    Juno with Hera, Diana with Minerva, Mars with Ares, Vulcan with Hephaestus, and
    so on. Great stress was laid on the punctious performance of ritual in religious
    ceremonies. Guardian spirits were particular attention in individual households,
    often respectfully with the ghosts of dead ancestors, and accorded shrines and
    small images both in and out of doors. The chief forms of divination, also Etruscan
    in origin, involved interpretation of the behaviour of birds (‘augury’); of the
    state of the entrails of sacrificial animals; and of omens such as monstrous beasts
    and lightning. The results of divination were treated very seriously, and even
    the most powerful and pragmatic rulers, such as the Emperor Augustus, held good
    and bad omens in superstitious awe.


    Various eastern cults were imported in late-Republican times, such as the mystery
    religion of Indo-Iranian Mithras, late first century BC. A major change that came
    in with the end of the Republic was the cult, then the deification, of individual
    emperors. Julius Caesar was deified (that is, worshipped as a god) after his death
    in 42 BC, and Augustus encouraged his own cult, though again he was not deified
    until after his death.'
