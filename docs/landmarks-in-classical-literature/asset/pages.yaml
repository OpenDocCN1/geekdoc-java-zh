- pgno: 17
  md: '# 6 Landmarks in classical literature


    the other hand the names of some ancient places to be distinguished from those
    of their modern successors, so that we say Ithaca rather than Itháki; Massalia
    (or Massilia) rather than Marseille; Eburacum rather than York; and so on (though
    we have anglicised Gallia (as Gaul).


    The pronunciation of Latin by English speakers has undergone changes that have
    left their mark on the way we pronounce Latin words and phrases – especially legal
    and medical terms – and the Greek and Latin names discussed in the last paragraph.
    Until the late nineteenth century Latin was pronounced in Britain with English
    vowel sounds: ‘PAytra’ for pater, ‘reJEYEna’ for regina, ‘BOHnæ’ for bona, ‘veydiLIEYset’
    for videlcet, and so on. Then a ‘reformed’ Latin pronunciation was introduced
    in schools with Continental vowel sounds, ‘c’ and ‘g’, and ‘w’ for ‘v’; which
    gave ‘PAHTa’, ‘reGEEnEa’ (hard ‘g’), ‘BONa’, ‘weeLEEKeet’, and so on.


    Used strictly, the reformed Latin pronunciation (which was an attempt to reconstruct
    the pronunciation of Romans) does not use the neutral vowel ‘ɵ’ to the extent
    that I have done, but suggests ‘PAHTair’ rather than ‘PAHTa’ for pater, and ‘reGEenah’
    rather than ‘reGEena’ for regina, and so on. This can sound pedantic, and I have
    opted for a more relaxed form of the pronunciation in this book, with a liberal
    use of the neutral vowel, because this is what most people actually say.


    The introduction of the reformed pronunciation has resulted in many inconsistencies
    in the way we pronounce Latin words and phrases today. For instance, prima facie
    retains its old pronunciation PREYEmo FAYsi, not the reformed PREE FAKEEay; and
    for faces we say ‘FEesec’, not ‘FEEYKAY’. On the other hand for fecit (as part
    of the signature on an engraving) we are more likely to say ‘FAYkit’ than ‘FEEsit’.
    In both cases pronunciations are current: nissi is pronounced ‘NEYEseye’ and ‘NEEsee’;
    opus is ‘OHpæs’ and ‘Opoos’; and Newton’s book is sometimes the ‘prinSIP-a’, sometimes
    the ‘prinKIP-ah’. And, as a further complication, is Church Latin, which uses
    Continental vowels (with a few alterations), and ‘tsh’ for ‘c’: thus for pace
    we have ‘PAYsi’ (‘English’), ‘PAHkay’ (reformed), and ‘PAHTshay’ (Church).


    +   7 Another odd is the common pronunciation ‘rashonHL’ for the Latin word rationale,
    presumably in the belief that it comes from French; the English pronunciation
    was ‘rashonAYli’, the reformed would be ‘ratioNAHL’.'
