  md: '# Landmarks in classical literature


    kingdoms. Substantial provinces changed hands in the endemic warfare of the third
    century BC, but at the beginning of the second century the kingdoms that remained
    under predominantly Greek rule were those of Macedonia the confederations of the
    city-states of the Greek mainland; Pergamum in western Asia Minor; Egypt, including
    Palestine and Syria; and the Seleucid kingdom in modern Iraq and western Iran.


    # Language and society


    The most striking feature of this enlarged Greek world was its homogeneity. The
    native populations differed from each other, of course, but the ruling Greeks
    spoke and wrote a common language – the koiné, a derivative of Attic – in place
    of the old dialects; and everyone the Greeks had to be bilingual if they wanted
    to get on the world. The ruling classes shared a culture that characterised not
    only the lavish royal courts and the administration, but also social life, the
    arts and sciences and scholarship. The rich became richer, fewer in number, and
    more given to display; and the position of women improved somewhat (in some cities
    they could own property and divorce husbands who behaved more than ordinarily
    badly, though society was still dominated by men, and for the most part women
    were still excluded and despised). Great public buildings, including theatres
    and libraries, were erected in the cities; and more Games were held all over the
    Greek world, for which men prepared in gymnasia, were exclusive social clubs as
    well as places for exercise. Slavery continued as one of the bases of the economy
    and there was a flourishing slave trade, with as many as 10,000 slaves a day being
    bought and sold in the central slave market of Delos.


    # The visual arts


    There were considerable advances in town planning, but types of architecture,
    such as temples, did not change much from those of the Classical period; one minor
    innovation was the increasing use of the Corinthian column with its extravagant
    capital of acanthus leaves. The wealthy patrons of the Hellenistic world, however,
    subsidised a rich proliferation of art, most notably in the third century BC.
    Sumptuous jewellery was crafted in precious stones and gold; and large numbers
    of beautiful and realistic bronze statues of'
