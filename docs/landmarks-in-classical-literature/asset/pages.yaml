  md: '# 17 Ovid: love poetry and the novel


    # Ovid


    Publius Ovidius Naso (43 BC to 17 AD) was born at Sulmo in the hill-country of
    the Abruzzi, 120km east of Rome, the second son of a prosperous knight. We know
    – or think we know – a lot about his life, chiefly because an autobiographical
    poem that he wrote late in his life;¹ but, with Horace, we should be beware of
    putting too much faith in the historical accuracy of autobiographical poetry.
    As Ovid himself said on another occasion:


    > The poet''s fruitful freedom knows bounds, and takes no oath to tell it as it
    happened.

    (Amores III.12.41–2, trs. by E.J. Kenney, in Ovid, Metamorphoses, trs. by A.D.
    Melville, 1986, Oxford World''s Classics p. xix)


    The story is that Ovid and his brother were destined by their father for a senatorial
    car, which was frustrated in both cases, by the death of their father and by Ovid''s
    preference for poetry. Ovid was married off about sixteen to an even younger wife
    who was probably unfaithful to him; they were divorced after two years, and then
    his brother died. He went abroad on a tour of Greece, the eastern provinces, and
    Sicily when he was about twenty, and embarked unenthusiastically on the training
    and minor government jobs that were the necessary preliminary to a career in public
    life. During this period he wrote his first group of poems, the Amores or ‘Lives’,
    inspired by ‘Corinna’, a married mistress. Ovid remarried, happily this time but
    again briefly; his second wife died soon after the birth of a daughter, perhaps
    in about 14 BC, when he was twenty-nine or thirty.


    ¹Tristia IV. 10.


    178'
