    results for the city. His best-known speeches, which had a strong influence on
    the technique of his successors, especially Cicero, were the Philippics 1–4 (351–341
    BC) against the incursions of Philip of Macedon; the Olynthiacs 1–3 (349 BC),
    urging for the city of Olynthus against Philip; and On the Crown (330 BC), in
    which Demosthenes defended his own record in the public affairs of Athens.


    # The legacy of Greece: (2) philosophy


    Epicureanism and Stoicism have already been mentioned (p. 119 above), but something
    more must be said about them here because of their influence on Roman thinking.
    The Romans saw the Epicurans largely in terms of their supposed belief in pleasure
    as the aim in life, without taking into account the self-denying conduct of Epicurus
    and his followers in the fourth and third centuries BC, who had believed that
    pleasure lies as much in limiting desire as in satisfying it; so Romans tended
    to agree with the Stoics in despising Epicureanism. Stoicism, with its aim of
    living in willing acquiescence with whatever fate provided, was in case more in
    tune with the qualities admired by sober Romans of *pietas* (dutiful respect for
    gods, fatherland, and family) and *gravitas* (dignity and moderation).


    The Stoics of the second and first centuries BC who had most influence on Roman
    thought were the Greek philosophers Panetius and Posidonius, both of them based
    in Rhodes. Palaetius (c.185–109 BC) was especially influential in emphasising
    the positive virtue of doing what is right rather than the negative of doing what
    is wrong, the importance of having high moral standards in private as in public.
    He wrote a tract *On Duty* (now lost), on which Cicero was to base the first two
    books of his *De Officiis* (p. 149 below). ... a philosophical pupil of Panetius
    but better remembered as a scientist and historian (though his works, too, are
    lost), carried on Panetius’s teaching, and believed the all-embracing, all-accepting
    dominion of Rome to be the ultimate embodiment of Stoicism. But their enthusiasm
    for Stoicism did not prevent educated Romans of the second century BC and later
    from being familiar with the earlier classics of Greek philosophy, especially
    the works of Plato and Aristotle, which were widely read.'
