- pgno: 109
  md: '# 102 Landmarks in classical literature


    and a transcendental biologist who hinted at theories of evolution and the survival
    of the fittest. Anaxagoras (c.500–c.428 BC), the first philosopher to live in
    Athens, was chiefly interested in cosmology and physics, but the remains of his
    work are fragmentary. Democritus (460–c.357 BC), actually younger than Socrates,
    whose work survives only in fragmentary quotations, was the founder of Greek atomic
    theory besides writing on a wide range of other subjects, and was frequently referred
    to by Aristotle.


    What chiefly matters about the pre-Socratic philosophers is not so much the answers
    they proposed to their questions about the nature and permanence of reality, the
    soul, of substance, of the good life, and so on, as the fact that they asked these
    questions; that they attempted to answer them rationally; and that their questions
    turned out to be the basic problems of philosophy which were to concern Socrates,
    Plato, Aristotle, and all their successors.


    # Socrates


    Who was Socrates? In one respect we know a great deal about this most extraordinary
    and charismatic of philosophers, but in another we find that we can be certain
    rather little. It appears that he was born near Athens in 469 BC; that he served
    as a hoplite in the Peloponnesian War, which means that his family was reasonably
    well off; that he was attracted by young men, though he had a wife and children
    with him; that he charged no fees as a teacher and cared little for his personal
    comfort or appearance; that he had a number of devoted followers; by the end of
    the fifth century his views and personality had become politically and socially
    unacceptable to many of his fellow-citizens; and that he was tried, condemned,
    and executed for blasphemy and corrupting the young in 399 BC.


    But Socrates wrote nothing himself, so that what we know about his ideas and teaching
    comes to us through the writings of others, and is to a greater or lesser extent
    affected by their ideas and attitudes. We have the surviving accounts of three
    de jo major authors who knew him well: Aristophanes, Plato, and Xenophon; and
    Aristotle is another source of information, though he did not know Socrates personally.
    There are a few other early writings about Socrates; they are slight and fragmentary,
    but they do not importantly contradict the writings of Plato and Xenophon.'
