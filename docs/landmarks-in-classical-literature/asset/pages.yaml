  md: '# Landmarks in classical literature


    preceded by a long tradition of oral poetry, which probably went right back to
    Mycenaean times.


    Mycenaean civilisation came to a fairly abrupt end in the twelfth century BC,
    perhaps at the hands of a further wave invading Greeks from the north, the Dorians,
    the final destruction of Mycenae and Tiryns taking place in the late twelfth century.


    # Dark-Age Greece


    The invaders of the twelfth century BC were illiterate and lacking written records.
    It began with the fall of Mycenae c.1125 BC, and may be said to have lasted for
    about 250 years, until the emergence of Athens as a major cultural c.875 BC; for,
    although Greek history and literature were not written down until the middle of
    the eighth century or even later, the history of Athens in the ninth century was
    still sufficiently well remembered when written records began.


    # The Greek language


    We said that Greek is an Indo-European language, and that it represents one of
    the major Indo-European language groups. This means that it is not closely related
    by descent to any of the other major Indo-European language groups. However, Greek
    is similar in type to, for instance, Latin (which comes from the Italian group
    of languages), in both Greek and Latin are ‘inflecting’ languages, in which grammatical
    relationships are expressed by changing the structure of the words, for instance
    changing their endings.


    To examples from Classical Latin – which, perhaps, easier to follow than Greek
    ones would be – the verb form amo ‘I love’, amas ‘singular] love’, amat, ‘he [or
    she] loves’; the noun homo means ‘man’ in the subject case, hominem ‘man’ in the
    object case; and femina, feminam mean ‘woman’ in the subject and object cases
    respectively. Putting these Latin words together in a sentence, homo amat feminam
    means ‘the man loves the woman’ (Latin does not have a word for the ‘the’); and,
    because the nouns are inflected for case the verb is inflected only for person
    and not, for gender, the meaning remains the same whatever order the three words
    are put in: homo feminam amat (the usual word-order in Latin), feminam homo, feminam
    homo amat, amat homo feminam, and amat feminam homo all mean ‘the man'
