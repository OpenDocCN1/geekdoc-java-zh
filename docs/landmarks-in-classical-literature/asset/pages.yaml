- pgno: 215
  md: '# Reference bibliography


    This bibliography does not have an author section, for three reasons.

    First, the best books about particular classical authors are aimed at students
    specialising in classical studies, and commonly expect the reader to have some
    basic knowledge of Latin, and often of Greek as well. Secondly, the well-edited
    paperback texts mentioned above in the notes on translations of each author –
    especially the Penguin Classics and Oxford World''s Classics translated (or at
    least introduced and annotated) in the late 1980s and the late 1990s – will be
    found to serve general readers, as well as students studying the classics, very
    well; and they are equipped with good reading lists. And third, there are a number
    of excellent general reference books and introductions to particular aspects of
    classical studies, as follows.


    # General reference


    The most comprehensive and up-to-date encyclopedia of classical studies is the
    third edition of The Oxford Classical Dictionary, ed. by Simon Hornblower and
    Antony Spaworth, Oxford University Press 1996, which is arranged alphabetically.
    It is addressed to classical specialists, though anyone can make good use of it;
    but it is very expensive (£70 at the time of writing), so that most people will
    have to consult it in a library.


    More accessible (in every sense) is the second edition of The Oxford Companion
    to Classical Literature, and issued as a revised paperback by Oxford University
    Press in 1997. General readers will find that this well-organised alphabetical
    reference book is easy to use and that it will answer nearly all their questions.


    For a general introduction to the history and culture (including the literature)
    of the ancient world, Charles Freeman''s Egypt,


    210'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Reference bibliography 211


    Greece, and Rome: Civilisations of the Ancient Mediterranean, Oxford University
    Press 1996, is outstanding: a thorough, agreeable historical narrative, with good
    illustrations, maps, and chronology.


    Routledge publishes two well-indexed paperback atlases of the ancient world: Michael
    Grant''s The Atlas of Classical History, fifth edition 1994, with 92 pages of
    simplified maps that are very easy to read, with limited explanatory matter; and
    Atlas of Classical History, ed. by Richard J.A. Talbert, 1985, with 177 pages
    of more detailed maps and extensive explanatory text. Each of these inexpensive
    black-and-white atlases has its virtues, and there is much to be said for using
    both.


    # Subject guides


    Greece


    The following three books, all available in paperback, are collections of articles
    by different hands: The Oxford History of Greece and the Hellenistic World, ed.
    by John Boardman, Jasper Griffin, and Oswyn Murray, Oxford University Press 1986;
    Ancient Greek Literature, ed. by Kenneth Dover, second edition, Oxford University
    Press 1997 (half the articles being by the editor); and the more specialised The
    Cambridge Companion to Greek Tragedy, ed. by P.E. Easterling, Cambridge University
    Press 1997.


    # Rome


    The Roman World, ed. by John Boardman, Jasper Griffin, and Oswyn Murray, Oxford
    University Press 1986–8, is a collection of articles by different hands; as is
    the more specialised The Cambridge Companion to Virgil, ed. by Charles Martindale,
    Cambridge University Press 1997. Adrian Keith Goldsworth’s The Roman Army at War
    100 BC–20, Oxford University Press 1998, is also a specialist monograph, but will
    appeal to anyone interested in military history. These three books are all available
    in paperback.


    Peter Salway''s The Illustrated History of Roman Britain, Oxford University Press
    1993, is superb, a scholarly work that is a pleasure to read and is copiously
    illustrated. It may be used in conjunction with the Ordnance Survey''s historical
    map and guide, Roman Britain, fourth edition, 1991.'
