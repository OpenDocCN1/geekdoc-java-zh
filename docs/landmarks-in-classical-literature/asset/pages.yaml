  md: '# Index and guide to pronunciation


    Simplified phonetic spellings are given in parentheses after the Greek and Latin
    names and other words in the Index, the suggested pronunciations being those generally
    used today by English readers of Classical literature. There are many inconsistencies
    caused by – amongst things – mixtures of old and new pronunciation of Latin (see
    pp. 5–7 above). The phonetic equivalents of these spellings in the Received Pronunciation
    of British English are:


    +   * a as in cat

    ah as in bath

    ai as in air

    aw as in raw

    ay as in may

    e as in bet

    eea as in beer

    ee as in meet

    ew as in hew

    g as in get

    i as in hit

    eye as in kite

    o as in got

    * oh as in slow

    oi as in coin

    oo as in boot

    oor as in moor

    ow as in cow

    u as in bus

    ur as in curse

    ch as in loch

    s as in kiss

    sh as in sheep

    th as in thick

    yaw as in your


    The neutral vowel, or schwa, is represented by the symbol ‘ə’, as in the English
    words sofa, ‘SOHf’, about, ‘əBOW’, and passion, ‘PASHən’.


