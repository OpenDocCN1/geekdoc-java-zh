    infantry respectively) and march it from Sardis in western Asia Minor to Mesopotamia,
    where Cyrus proposed to kill his elder brother Artaxxes and become the ''great
    king'' in his place. Greek hopites, supported by lightly armed peltasts, were
    the most formidable troops available, especially if they were led by Spartan officers,
    and mercenary units recruited in Greece had been employed in Persia more than
    once during the fifth century BC. For them soldiers was a job; they were not concerned
    with the politics of their employers providing that they were paid; and it offered
    an attractive way of life, with plenty of adventure and loot, for young men with
    military training who chose or were obliged to leave home.


    For his expedition Cyrus employed an army of 10,000 Greek mercenaries, initially
    with a Spartan officer in overall command; but it was an army without a fixed
    military hierarchy. These Greek soldiers organised themselves like a small-state
    on the move. The hopites and peltasts, two middle classes of ''citizens'', elected
    their own upper-class officers and expected to be consulted on matters of policy
    that affected them; while there was also a train of ''non-citizens'', suppliers,
    cooks, drivers, and camp-followers of all sorts, who had to be accommodated and
    protected on the march. The baggage train carried equipment and plunder, but the
    army lived on the land, taking food and drink from the locals – with or without
    payment, according to circumstances – wherever they pitched camp. The Spartan
    commander-in-chief was Clearchus; Xenophon, then aged about twenty-seven, was
    one of his senior officers.


    The army set off from Sardis in the early summer of 401 BC, and by early stages
    to Cunaxa, a town on the Euphrates about 50km north of Babylon, which they reached
    in September. Here they were met by the army of Artaxxes and, in an otherwise
    inconclusive battle, Cyrus was killed. With his head cut off, the expedition no
    longer any purpose or will, and the Greek continent was faced with the problem
    of capturing and enslavement by Artaxxes and getting back safely to Asia Minor
    or Greece itself. The story of how this was achieved is the main subject of Xenophon''s
    exciting Anabasis (the word means like ''journey up country''), a memoir he wrote
    in c.370 BC, mere thirty years after the event.


