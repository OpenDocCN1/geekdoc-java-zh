    nouns, but retains several tense suffixes for verbs; while English has dropped
    all but one of the case suffixes, and most of the suffixes for regular verbs.


    As the power of Rome spread across the ancient world, so did Latin, coming to
    be spoken as a first language throughout Italy (various dialects), and then spreading
    into the conquered provinces with the Roman armies (which used Latin as a common
    language whatever the ethnic origin of their troops). As the Roman Empire became
    a world empire, so Latin became a world language, uniquely so in the west, and
    alongside the koiné in the Greek-speaking east. Later on Latin continued to be
    widely used, as the liturgical language of the western Christian Church until
    the mid-twentieth century, and as the language of European learning and international
    scholarship until the seventeenth century (and occasionally later). Latin continued
    to occupy the centre of European secondary education well into the twentieth century.


    # Roman names


    Greeks of the Classical period had only one name, distinguished if necessary by
    mentioning the father''s name as well: thus the grandson of Sophocles the playwright,
    who was also called Sophocles, was known as Sophocles of Ariston. The names of
    Roman men in the late Republic, however, were more complicated, being in three
    parts – praomen (forename) + nomen (name) + cognomen (additional name) – and an
    individual could (and still can) be referred to either by his name or by his cognomen
    or by both (or, when related individuals with the same nomen are referred to,
    by praeno and cognomen); examples will be given in a moment. Roman women, who
    did not change their names when they were married, were known by the feminine
    form of their father''s name.


    The praomen was a personal name, like John or William; and in late-Republican
    and Early-Empire times there were only sixteen of them in general use, the most
    common Gaius (abbreviated in writing as ‘C.''), Lucius (‘L.’), Marcus (‘M.''),
    Publius (‘P.’), and Quintus (‘Q.).


    The nomen was the name of the gens, the clan (or group of families of common descent)
    to which a person belonged, and was inherited from the father: names such as Julius
    (feminine form Julia) for members of the Julian gens Claudius/Claudia for the
    Claudian gens, and so on.'
