    Seneca


    We have already met Seneca the Younger (Lucius Annaeus Seneca, c.4 to 65 AD) as
    the author of rhetorical closet tragedies (pp. 140–1 above), but he was even better
    known in antiquity and early modern times for his philosophical writings. Yet
    Seneca was no more a professional – or an original – philosopher than Cicero had
    been. Born in Spain to a wealthy family of Italian descent, he was brought to
    Rome as a child and educated there, then entered the public service as Quaestor
    and Senator. He was banished in 41 AD for alleged adultery with Julia Livilla
    (a member of the imperial family), but Julia’s sister Agrippina recalled years
    later that he could become tutor to her twelve-year-old son, the future Emperor
    Nero. Seneca stayed on as political advisor to Nero following his accession in
    54, at first with considerable political and material success, but Nero’s extravagant
    and unstable behaviour made Seneca’s position increasingly difficult; and he was
    eventually forced to commit suicide in 65 because of his supposed involvement
    in a revolutionary plot.


