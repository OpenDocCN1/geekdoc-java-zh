  md: '# Horace: epigram, lyric, and satire 175


    Night holds Hippolytus the pure of stain,

    Diana steeds him nothing, she must stay;

    And Theseus leaves Pirithous in the chain

    The love of comrades cannot take away.

    *(Odes IV,7, tr. by A.E. Housman, Poems, Clarendon Press 1997, pp. 118–189)*


    Reading these poems, what are we to make to Horace? For one

    thing, they are works of art, not fragments of autobiography. Of

    course Horace, like all artists, parts of himself into his work,

    but with him especially it is unwise to take the glimpses he gives as

    fair picture of the poet. Certainly there was a fat little called

    Horace who charmed his friends and enjoyed the good things of life

    — Maecenas said so, and so did Augustus – but in there was

    another Horace: clever, wry, amusing, but also subversive, melan-

    oly and too clear-sighted for his own comfort. Like Shakespeare,

    of whose personality we know so little, he has something for every-

    one, and he is the best of company.


    # Juvenal


    Virtually nothing is known from Decimus Junius Juvenalis and his

    life but that he came from Aquinin, 105km south-east of

    Rome; that he lived and worked in Rome early in the second century

    AD; that he wrote sixteen Satires in Latin heximeters, probably

    published in five separate ‘books’.


    Juvenal claimed Lucius (a satirist of the second century BC), whose

    work is almost entirely lost) and Horace as his guides, but he does

    ot follow the wry autobiographical bent of Horace''s Satires, and

    his bitter invective has little in common with Horace''s mellow

    humour. Juvenal writes biting, rhetorical satire as we now under-\stand the term,
    with him aiming to expose the vices and the everyday

