  md: '# Tacitus and Roman history 193


    Astoningly, Caesar successfully performed this enormous task with only three (five
    or six) Roman legions of heavy infantry, plus their auxiliary cavalry and light
    infantry (see pp. 135–6 above). There is no doubt that he was a general of genius
    – fast-thinking, resilient, innovative – not only in his battle tactics, but perhaps
    more importantly as a leader of men who could get the best out of his small, well-trained
    army. In addition to this he was a writer of great accomplishment, who compiled
    an annual Commentary (notes, or memoirs, written in the third person) recording
    the season''s campaign in simple, lucid Latin, probably for dispatch to Rome.
    He wrote seven Commentaries on the Gallic War (58–52 BC), to which an additional
    Commentary was added by Aulus Hirtius for his first Gallic campaign of 51 BC;
    and he wrote a further, uncompleted set of Commentaries on his conduct of the
    Civil War against Pompey in 49–48 BC.


    It is a pity that generations of beginners have been put off Caesar''s Gallic
    War by being made to use as an elementary Latin text, for it is an unparalleled
    – indeed unparalleled of military history. Despite Caesar''s understandable tendency
    to play up many successes and play down his failures, and to distance himself
    from massacres carried out by his troops who may condoned at the time, there is
    no better (better-written) account of any war and his individual engagements written
    by the commander-in-chief himself.


    Of course neither Caesar nor the Roman army was infallible: not all the unit commanders
    were as good as they should have been, and discipline occasionally broke down.
    It also appears that the two expeditions to Britain in 55 and 54 BC, in which
    the event served no purpose beyond adding Caesar''s prestige at home, were excessively
    risky: he did not realise that combined operations in the stormy Channel were
    more hazardous than in the Mediterranean, and the landings nearly ended in disaster.
    The Gallic War does illustrate Caesar''s superb governorship on land: his flexible
    tactics, his methods of command and presentation of himself as commander, and
    his application of the latest Roman technology in bridging and other engineering
    works. And the book brings us nearer understanding Caesar''s unique qualities:
    the clarity of his mind, the daring and ruthlessness in pursuit of success tempered
    by leniency and forgiveness when it was achieved, and his unrivalled political
    skills at the service of a relentless ambition to reach the top.'
