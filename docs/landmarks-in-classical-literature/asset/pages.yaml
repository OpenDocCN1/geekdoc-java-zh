  md: '# The spread of civilisation 15


    and prosperous family settled in the small city of Chaeronea, 30km east of Delphi.
    Plutarch was well known and well travelled in the Roman Empire, which was now
    at the height of its greatness. He admired the power of Rome and its complement,
    the culture of Greece; and he wrote both of them with elegance and charm. His
    writings were so much appreciated, in antiquity and afterwards, a considerable
    number of them have survived, including a series of Parallel Lives, biographical
    sketches of Greek and Roman worthies whose careers, he felt light on each other
    and would provide moral lessons for the educated Romans of his day. The first
    two biographies in his chronological sequence were those Theseus, the mythical
    hero who made Athens great, and Romulus, the supposed founder of Rome.


    Teseus, as Plutarch scarcely needed to remind his readers, was the Athenian prince,
    heir to King Aegeus, who volunteered to join the seven youths and seven maidens
    who were from Athens every nine years as tribute to King Minos of Cnossus in Crete.
    According to the old story – though Plutarch, who was something of a revisionist,
    gave little credit to it – these people were loosed to the Minotaur, a bull-man
    monster who usually killed them in its labyrinth; but courageous Teseus killed
    from the labyrinth with the help of Ariadne’s thread, and free Athens from its
    subservience to the Minoans.


    This takes us back another stage, to the Cretan civilisation which, from about
    2000 BC, was centred on a number of ‘palace’ complexes as Cnossus – our tourists
    may have been too – and had access from its central position in the Mediterranean
    both to the barbarian north and west, and to the already ancient civilisations
    to the south and east. These Minoans, who spoke and wrote an unknown language,
    were in contact with the Egyptian empire, which in turn had relations with the
    literate civilisations of the Ancient Near East: the Sumerians, and the Hittites
    and the Assyrians, with their traditions of literature, mathematics, and medicine.
    Now we are taken back, not nineteen hundred years to Plutarch and Imperial Rome,
    or two-and-a-half years to Classical Greece, but more than six thousand years
    to the very beginnings of what eventually became our own civilisation, when the
    irrigation of the deserts of southern Iraq provided a surplus of food sufficient
    to support the earliest Sumerian cities, and their palaces, temples, crafts, and
    trades.'
