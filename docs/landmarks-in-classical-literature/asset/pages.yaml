    (2) The form and pronunciation of Greek and Latin names appearing here are generally
    familiar in anglicised spellings and pronunciations which have little to do with
    their original forms. Our ten main writers, for instance are commonly known as
    Homer (HOHMAs), Pindar (PINdah), Sophocles (SOFaklee), Herodotus (heROdotas),
    Plato (PLAYtoh), Cero (Cisroh), Virgil (VURgil), Horace (HORis), Ovid (OVid),
    and Tacitus (Tasitus).


    There are two reasons for the confused state in which Greek and Latin names have
    reached us: alterations made the forms of the names, and changes of pronunciation.
    With regard to form, some Greek names have been Latinised, the -os termination
    for instance being changed to -us (Kronos, Cronus), or in a more extreme case
    Polydeukes becoming Pollux. When the name has not been anglicised, the Latin form
    is sometimes (Hercules rather than Herakes or Heracles). But some of the most
    familiar Greek names have been anglicised - Homer (Homeros in Greek), Pindar (Pindaros),
    and Plato (Platon) in the list given above - then it is the anglicised forms that
    are usually preferred. Similarly, many of the most familiar names of Roman writers
    are normally used in their original Latin forms, including Virgil (Virlius), Horace
    (Horatius), and Ovid (Ovidius) in our


