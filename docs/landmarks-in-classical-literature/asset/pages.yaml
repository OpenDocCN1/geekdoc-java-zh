  md: '# 3 Homer and epic poetry


    # The background


    Homer’s two great poems incorporate both history and myth. They tell the story
    of certain episodes during and after an aggressive war undertaken by mainland
    Greeks against the city of Troy in northwest Asia Minor; and they tell it as if
    it is historical fact concerning the fairly recent past. They also set the story
    in a framework of divine activity, in which the Olympian gods play an active part
    in shaping these episodes.

    To take the history first, the ten-year Trojan War was believed in classical times
    to have taken place early in the eleventh century BC. That was about the time
    of the collapse of the Mycenaean civilisation, and of the beginning of the Dark
    Age. Archaeologists at the probable site of Troy found a level of the city that
    was violently destroyed by 1250 BC, not long before the traditional date. There
    is no evidence, however, that Troy was destroyed by Greeks; it fell at a time
    of turmoil in other cities in the area, and just as well been attacked from the
    east. Furthermore, although Homer gives his Troy mainly Greek characteristics,
    it also has some eastern ones (King Priam’s fifty children, for instance); and
    it may be that the story was influenced by a tradition of early conflict between
    Greeks and some eastern power at the junction of their territories in the area
    of the Hellespont, the long strait (later called the Dardanelles) that separates
    Europe from Asia. There are also historical anachronisms in the stories resulting
    from the inclusion of eighth-century practices in eleventh-century settings; dead
    heroes being cremated, for instance, as was normal in the eighth century, not
    buried as they actually had been in the eleventh. In short, although there may
    be some historical truth in Homer’s tale of the Trojan War, we do not know how
    much.


