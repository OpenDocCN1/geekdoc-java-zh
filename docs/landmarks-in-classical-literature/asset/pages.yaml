  md: '# Interchapter: The Hellenistic age


    Greek culture did not come to an end when the extraordinary fifth- and fourth-century
    BC city-states were superseded by large Greek kingdoms as the predominant political
    form following the reign of Alexander the Great (336–323 BC). Indeed, it continued
    to flourish and to have an even wider influence on the civilised world until the
    power of Rome began to spread into what we now call the Hellenistic world in the
    mid-second century BC nearly two hundred years after Alexander. Even after that,
    Greek influence, linguistic and cultural, remained a powerful force in the expanding
    territories of the eastern parts of the Roman Empire; and continued to affect
    educated Romans everywhere.


    # Alexander’s empire and its successors


    Alexander of Macedon who was only thirty-two when he died, was the most successful
    military conqueror who has ever lived. His father, Philip II of Macedon had already
    taken control of the Athenian outposts in the north-west Aegean. Alexander subdued
    the rest of mainland Greece, and then, with an army of 40,000–50,000 troops (including
    a high proportion of mercenaries), he set off to conquer east. In a mere seven
    years’ campaign he extended his empire to include the areas now known as Asia
    Minor, Syria, Palestine, Egypt, Iraq, Iran, Pakistan, Afghanistan, Tajikistan,
    Uzbekistan, and Turkmenistan, founding cities (many of which were called Alexandria)
    as he went. On the way home he fell ill and died,¹ and the new empire broke up
    into a number of large and fairly stable kingdoms; many of the old city-states
    – including those in mainland Greece – were allowed some degree of self-government
    within these


    > ¹ Some of his contemporaries ascribed his illness to poison.


    115'
