  md: '# The Hellenistic age 119


    # Philosophy and science


    The philosophical schools of Plato and Aristotle were carried on by their followers
    into the later fourth and third centuries BC, but there were changes: Plato''s
    teaching was gradually transmuted into Skepticism, which held knowledge of the
    true nature of things was unattainable; while the teaching of Aristotle, which
    continued for a while under Theophrastus and Strato, came to an end of its development
    by the mid-third century BC. Two schools now became prominent: the Epicureans
    and the Stoics. Epicurus of Samos (341–270 BC) founded a community in Athens at
    c.307 which included women and slaves, and lived austerly in spite of the hedonistic
    beliefs of them members. Epicurus was an ''atomist'' who taught that human beings
    were chance assemblages of elementary particles dispersed again at death; and
    that their aim should be seek the good (which he identified as pleasure) through
    a proper understanding of nature in order to live in happy tranquility, withdrawn
    from the distractions of society. By contrast Stoicism, founded at Athens by Zeno
    of Cyprus (335–263 BC), held that the universe was controlled by the logos (divine
    reason, identified with fate or providence); so that the Stoic aimed to live in
    harmony with this ruling principle and to accept whatever happens in the world
    with willing acquiescence, knowing that the logos, not pleasure, was the ultimate
    goal.


    The Hellenistic period was also a golden age of scientific achievement, which
    included the discoveries of three outstanding mathematicians – Euclid, Archimedes,
    and Apollonius of Perge – and the medical tradition of Hippocrates. Euclid (c.325–250
    BC) may have produced his textbook, the Elements, in Alexandria. It included a
    rigorous exposition of geometry by a series of proposals and their logical development;
    astonishingly, it continued to be used as a fundamental teaching aid until the
    end of the nineteenth century. Archimedes of Syracuse (c.287–212 BC), who studied
    at Alexandria, was one of the greatest mathematicians of all time; amongst other
    things he worked out the value of pi and the area of a parabola, and invented
    a system for expressing very large numbers. Archimedes was also an outstanding
    astronomer, and a theoretical and applied physicist, solving problems of specific
    gravity and inventing a screw for raising water. Much of the work of Apollonius
    of Perge in Asia Minor (fl. c.225 BC) is lost, but as a mathematician he was second
    only to Archimedes; he established the'
