    # ## The Aeneid


    The first words of Virgil''s Roman epic both define the noble subject of the poem
    and make respectful reference to its predecessors:


    > Arma virumque canto, Troiae primus ab or Italiam fato profugus Laviniaque venit
    litora.


    Arms I and the man who from the coasts of Troy, exiled by fate, came to Italy
    and Latinian shores.

    (Aeneid 1.1–3, trs. by H. Rushton Fairclough, 1916, Loeb p. 241)


    The man, of course, is Aeneas, the Trojan hero who was ''arms'' and ''the man''
    bring to mind the two Homeric epics to which Virgil is indebted for his form and
    inspiration, the Iliad with its armed warfare, and the Odyssey with its ''allround
    man''.


    The myth of Aeneas had settled into the form which Virgil knew by the third century
    BC. The story, which he used as the framework of his epic, was Aeneas, the son
    of Anchises (a prince of the junior branch of the Trojan royal house) and the
    goddess Aphrodite, made an adventurous voyage to the west after the fall of Troy.
    Finally reaching Italy, he founded Lavinia, a settlement on the coast 25k south
    of Rome.¹⁰ Romulus, the founder of Rome, was


    ⁹ Naples.

    ⁰ Archaeological evidence shows that Lavinia (now Pratica di Mare) was an early
    Latin settlement with direct links with the Greek world.'
