    on the south-western coast of Asia Minor. He may have been born c.570 BC, and
    died aged 80+ in about 490–485 BC in Athens, where he spent the later part of
    his life; he is said to have admired the early plays of Aeschylus, which were
    staged in 499–496 BC. His poems, in five books, were chiefly concerned with love
    and wine, but again only fragments survive. Here are prose translations of them:


    Come, boy, bring me a bowl, so that I may drink without stopping for breath; in
    ten ladies of water and five of wine, that I may once again play the Bacchant
    with decorum.


    Once again golden-haired Love strikes me with her purple bald summons me to play
    with the girl in the fancy sandals; but she – comes from Lesbos with its fine
    cities – faults with my hair it is white, and gaps after another – girl²


    The Greeks normally drank their wine watered, in the proportion 3:1 or 4:1, not
    Anacreon’s 2:1 – which would be ‘decorous’ only for a Bacchant (a male version
    of the ‘Bacchantes’, women inspired to ecstasy by the wine-god Dionysus). In the
    second fragment Anacreon is making fun both of his own white hair – inappropriate
    on the head of a lover young girl – and of the supposed sexual preferences of
