    # Xenophon and the Persian Expedition


    In c.428 BC, Xenophon was an Athenian aristocrat who became a disciple of Socrates
    and an enemy of democracy. Finding the political atmosphere of Athens in the aftermath
    of the Peloponnesian War uncongenial – he was known to be a supporter of the oligarchy
    and an admirer of Sparta, as well as an associate of Socrates, at a time when
    these tendencies were unsafe – he left the city in 401 BC to enroll as a mercenary
    officer in a military expedition mounted by Cyrus the Younger of Persia. Later
    in his life – he died in his seventies, c.354 BC – Xenophon wrote a number of
    books, including memoirs and dialogues of Socrates (see pp. 102–3), a general
    history of Greece, and other didactic works. His writings were unassuming and
    pleasing in their tone; he remained throughout his life an unquestioning believer
    in the power of the gods and the efficacy of sacrifice and divination. But he
    did not really understand Plato’s Socrates; his Hellenica – an attempt to complete
    and continue the History of Thucydides – is a disorganised though useful source
    of miscellaneous information. As a soldier, however, and as a writer of engaging
    military reminiscence – he who narrated in the third person from ‘Xenophon’s’
    point of view – he was outstanding.


    Cyrus was the younger brother of King Artaxerxes of Persia, and a man, according
    to Xenophon, of great talent and charm. The purpose of his expedition, however,
    was hardly a creditable one: it was to assemble an army of Persian troops with
    a core Greek mercenaries (including both hoplites, heavy and light'
