  md: 'to scratch the letters of one’s name, through the functional ability to read
    simple documents, the full literacy needed for reading and writing complex documents
    and literary texts. At a guess, perhaps 20–30 cent of Athenian citizens were functionally
    literate in the mid-fifth century BC, but a smaller proportion of women and resident
    foreigners, and slaves only the handful of state-owned clerks who worked in the
    law courts and government offices. It was not of course necessary to appreciate
    the epic, lyric, dramatic poetry that was sung or declared aloud. For those who
    could read them, books were available, but not yet in large quantities; small
    numbers of copies were made, and were subject to the inevitable errors that are
    accumulated by repeated transcription. These books were written in columns of
    sheets of papyrus, a paper-like material prepared from the pithy stem of an Egyptian
    water reed and imported from Egypt. A number of written sheets were glued to end,
    and the beginning and end of the resulting book were attached to thin rolling
    pins, so that it could be rolled off one pin, read, and rolled onto the other.
    These fragile rolls were inconvenient compared to the robust codex on paper that
    we are used to: the reader cannot move quickly from place to place in the text
    of a roll as can be done by flipping forwards and backwards through the pages
    of a codex. A papyrus roll would contain from c.750 to 1,500 lines of poetry (two
    or three books of Homer), or an equivalent block of prose (one book of Thucydides).
    It is rolls of this length that were referred to when so many ‘books’ of a poet’s
    work were mentioned by ancient editors and librarians; but there were scarcely
    any libraries to speak of in the fifth century BC. The first recorded private
    collection of learned books belonged to Aristotle in the early fourth century
    BC; and most Greek public libraries were founded in the Hellenistic period.'
