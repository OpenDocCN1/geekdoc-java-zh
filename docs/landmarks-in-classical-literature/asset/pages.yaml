  md: '# 32 Landmarks in classical literature


    in translation tends to be an imprecise term – and all have adequate introductions
    and indexes; but it is worth looking at each one of them for the way it presents
    the Iliad, and as a background to the whole question of considering translations
    of classical literature. Taking them in chronological order, the first of them
    is the classic translation into ‘heroic couplets’ by Alexander Pope (1715–20,
    Penguin Classics), which is thought by many still to be the best. It is close
    to Homer in being in a highly disciplined form of verse, and it suggests Homer''s
    vigour and panache; but its five-stress couplets sound very different from Homer’s
    unrymed hexameters and their relentless rhythmic repetition can have a slightly
    soporific effect. Pope also translates all the Greek names into their Latin forms
    (see p. 28). Next comes a version in regular five-stress blank-verse lines by
    an American, Robert Fitzgerald (1974, World’s Classics). This translation is smooth
    and attractive, and it again its regularity is something of a disadvantage, and
    it reads perhaps too comfortably. Then there is a fine prose version by Martin
    Hammond (1987, Penguin Classics). Unhindered by the requirements of verse, he
    has the freedom to follow Homer’s words very closely, and it is hard to see how
    the Iliad could be more faithfully in prose (though the transliteration of the
    Greek names is perhaps over-scrupulous); but the truth is, I think, that verse
    is essential to the poem: the Iliad simply does not work so well in prose. This
    brings us finally to Robert Fagles'' American translation into four- and three-
    (and occasionally four-)stress blank-verse lines (1990, Penguin Classics). This
    irregular verse is a long way from Homer’s disciplined hexameters to which it
    lacks perhaps because of Fagles'' clear understanding and close sympathy with
    what Homer was doing; it also has a valuable long introduction by Bernard Knox.
    At all events it is the translation I prefer; but of the choice is a matter of
