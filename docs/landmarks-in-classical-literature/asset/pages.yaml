  md: '# 16 Horace: epigram, lyric, and satire


    # Catullus


    Before we get to Horace, the main subject of this chapter, we should look at the
    work of Gaius Valerius Catullus (c.84–54 BC), a predecessor who developed a new
    form of Latin lyric poetry based on Hellenistic Greek models. The 116 (or 117)
    poems of Catullus are known to us by the mere chance of a single manuscript of
    them having survived into the fourteenth century, when two further copies were
    made of it. All three of these manuscripts have disappeared, but we have copies
    that were made of the two fourteenth-century copies. Not surprisingly the text
    was by this this stage marred by perhaps a thousand copying errors, accumulated
    over many centuries, but textual scholars have largely repaired them and we appear
    to have the collection in more or less the form and order in which Catullus left
    it.


    Of Catullus himself we know little but what he tells us in the poems. Like Virgil,
    who came from Cisalpine Gaul, the son of a wealthy magistrate, and spent most
    of his life in Rome as a manaboutown. He claimed in his verse to have a passionate
    affair with a woman who is addressed as ‘Lesbia’ in twenty-five of the poems;
    he lost a brother to whom he was devoted; had several close friends; he was acquainted
    with Julius Caesar; and spent a year on the staff of the governor of Bithynia
    in Asia Minor. He was probably only about thirty when he died.


    The poems are arranged with some deliberation in three major groups. Poems 1–60
    are fairly short, some of pithy and enigmatic, many of them in the ‘elegiac’ metre
    that was used for – amongst others – love lyrics; then four long poems, 61–4,
    which include a ‘mini-epic’ (poem 64); and then another large group of mostly
    short poems, 65–116 (65–8 being longer than the rest), many of them cast in the
    form of epigrams. Poem 51 to Lesbia'
