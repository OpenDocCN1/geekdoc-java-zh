  img_proc: true
- pgno: 212
  md: 'Ovid; but substantial portions of Pindar, Sophocles, Plato, Cicero, and Tacitus
    are lost. Of the rest, much of the work of Sappho, and Anacreon, Aeschylus, Euripides,
    Aristophanes, the pre-Socratics, Xenophon, Aristotle, Plautus, Seneca, Petronius,
    Apuleius, Livy, Plutarch, and Suetonius had also disappeared by the early medieval
    period. Even where a work has survived, it has sometimes been by the mere cease.
    In the early Middle Ages many works which we value, but which were largely neglected,
    appear to have been represented by a single manuscript: Cicero''s Letters, Apuleius''s
    Golden Ass, the whole of Catullus, and the surviving fragments of Livy, Tacitus,
    and many others. Any of these single manuscripts might easily have been irrevocably
    lost before they were copied.


    The transmission of texts

    The accurate transmission of classical texts was hindered to the end of the manuscript
    period in the later fifteenth century in three main ways. First, there was the
    difficulty of interpreting manuscripts of earlier periods because they might be
    written in scripts that were unfamiliar to later copyists; a particular problem
    was that in Classical times Greek and Latin texts were written continuously without
    word divisions, and without line divisions in poetry, which led to misunderstandings.
    Secondly, the process of transcribing any text inevitably introduces errors: words
    misread, words wrongly spelled, words added, words missed out; sometimes a whole
    section or page might be omitted by accident; and such copying accumulated each
    time a text was copied. Thirdly, when the manuscript of a text was wearing out,
    or was judged to be in an unacceptably old-fashioned form, it might not be thought
    worth while making another copy of the whole of it. Scholars, librarians, and
    directors of scriptoria did their best from Hellenistic times onwards to avoid
    or overcome these problems, but they could not always succeed.


    Textual scholarship

    It was recognised by the sixteenth century that early manuscripts were more likely
    to represent the original text than later copies, and a system was evolved for
    constructing a ‘family tree’ of manuscripts that would trace the descent of a
    text, hypothesising where necessary ‘ancestor’ texts that no longer existed. This
    system, refined in later centuries, has proved very successful in identifying
    the best texts, or'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'parts of texts, for editors to work on – even the best texts still have errors
    that require emendation. The result of the devoted and often inspired work of
    textual scholars since the late Middle Ages is the great corpus of classical texts
    that is available to us today; texts which are about as good as human ingenuity
    can make them, and of which the chief remaining imperfections are the losses or
    hopeless corruptions sustained early in the chain of transmission.2


    # History and archaeology


    Classical history has continued to be studied and written in medieval and modern
    times, picking up where the ancient historians left off, and necessarily being
    based to a large extent on their work. The improvements in historical method made
    by these later historians have chiefly been in their critical reassessment of
    the reliability of the ancient sources, and in their insistence on getting the
    facts right as far as they can. Of course modern historians reinterpret the early
    evidence in the light of their own thinking.


    Not many hitherto written documents of the ancient world are likely to turn up
    now; but new physical evidence of the past is being discovered all the time by
    archaeologists, and is adding in important ways to our understanding of ancient
    cultures and events. Archaeological research, if we include in it the collection
    of ancient sculptures and ceramics, and the study of inscriptions (epigraphy)
    and old coins (numismatics), has been going on since the Renaissance; ancient
    sites have been excavated since the eighth century. The early excavations of Pompeii
    for instance, began as treasure hunts, but digs have become increasingly professional,
    and late-twentieth-century archaeology makes use of carbon-dating, pollen-analysis,
    and DNA testing as well as the traditional methods of laboriously uncovering and
    recording, layer by layer, the physical evidences of the past. This period has
    also seen the development of underwater archaeology, primarily the investigation
    of wrecks in the Mediterranean by divers using breathing apparatus, which has
    revealed time complete time-capsules surviving from the ancient world, to be surveyed
    in situ before the evidence is disturbed.


    As a result of modern historical research, as well as of changing social attitudes,
    we are now inclined to see the ancient world with


    2 For the classics in schools and universities, see the Afterword on p. 205.'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'less uncritical admiration than was common before the twentieth century. For
    rich and privileged men in ancient Greece and Rome there were indeed many material,
    spiritual, artistic benefits to be enjoyed in beautiful surroundings. However,
    it is clearer now that these advantages were accompanied by political insecurity,
    by a culture of deliberate cruelty, and by the constant wars that impinged on
    the lives of people of all classes. For everyone else it was by no means a golden
    age: the freedom of women was limited; the lower classes were kept down; ordinary
    town-dwellers lived in squalor; slaves were abused; and the masses of the rural
    poor were trapped in their poverty and suffered recurrent famine.'
  merge: -1
