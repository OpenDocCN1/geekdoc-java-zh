  md: 'Herodotus and Greek history 93


    His chief technical shortcoming was his failure to identify his sources – apart
    from his own experiences in the war – by naming his informants, for instance,
    or by referring to such documents as existed. We cannot reasonably blame Thucydides
    for not working like a modern historian, but the omission is a serious one, because
    there is no other history of the period with which his work may be compared, and
    which might contain alternative judgements, material which we mistakenly discarded
    on grounds of irrelevance, and so Nearly everything that we know about the Peloponnesian
    War comes from Thucydides, and we have to take him on trust.


    Besiding striving for accuracy and focus in writing his history, Thucydides allowed
    himself set-piece speeches and descriptions that save the work from becoming too
    dry and unemotional. Two of them, which complement each other at the beginning
    of the history proper, are especially notable: the oration of Pericles at the
    public funeral of the Athenians who had died in the first year of the war, 431–430
    BC, and the account of the plague that devastated Athens shortly afterwards.


    The aristocratic Pericles was an elected general – and the unofficial ruler –
    Athens in the mid-fifth century BC: the leading politician, law-maker, empire-builder,
    military commander, and art-patron of what is often called ‘Periclean Athens’.
    A man of great prosperity as well as ability, it was natural that he should give
    the public funeral oration, and natural too that he should choose to speak on
    this occasion, at the start of a war, of the peculiar greatness of Athens. Here
    are two extracts from the lengthy speech that Thucydides put into his mouth:


    Let me say that our system of government does not copy the institutions of our
    neighbours. It is more a case of being a model to others, than of imitating anyone
    else. Our constitution is a democracy because power is in the hands of a minority
    but of the whole people. When it is a question of settling private disputes, everyone
    is equal before the law; when it is a question of putting one person before another
    in positions of public responsibility, what counts is not membership of a particular
    class, but the actual ability which man possesses. No, so long as he has in it
    to be of service the state, he is kept in obscurity of poverty. And, as our political
    life is free and open, so our day-to-day life in relations with each other. We
    do not get into a state with our next-neighbour if he enjoys himself in his own
    way, nor do we give him the kind of black looks which, though they do no real
    harm, still do hurt people'' feelings. We are free and tolerant in our private
    lives; but in public affairs we keep to the law. This is because it commands our
    deep respect. [...]'
