    The helots who formed the discontented slaves of Sparta have already been mentioned.
    Slavery in ancient Athens was organised more efficiently. There were several categories
    of slaves, from the few who were publicly owned and served in the state bureaucracy,
    through skilled craft workers, military and naval personnel, household slaves,
    and field-workers, down to the wretched slaves, captured in war or supplied by
    slave-traders, slaves who were hired out by contractors to be worked to death
    in the mines. Captured slaves had no rights and were open to any sort of abuse.
    In Greece, moreover, which was acutely conscious of the social hierarchy, there
    were few opportunities for a slave to gain his or her freedom; yet there were
    few occasions on which Athenian rebelsled against their lord. Slavery in Bronze-Age
    Greece, it was taken for granted by Homer, and hard as it is for us to understand
