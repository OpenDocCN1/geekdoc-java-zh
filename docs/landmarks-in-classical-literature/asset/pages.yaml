- pgno: 18
  md: '# Introduction 7


    The outcome is that the pre-form pronunciation of Latin names, and of the Latin
    forms of Greek names, also survives in the common forms of many Greek and Roman
    names today; which is the reason why the names listed at this section are pronounced
    as they are, and why we say ''meeseEneEe'' not ''miKEEneye'', and ''SEEza'' for
    Mycaena and Caesar; and so on.


    A point finally, about the the spelling of names in this book: there is a convention
    that sees the possessive case of Greek and Latin names ending in -s as -s''; but
    it, it seems to be, a bad and outdated convention. We do not say Sophocles'' plays
    or Athens'' temples any more than we say Polonius'' speech or John Jones'' house.
    We say Sophocles'' plays, Athens'' speech, Polonius'' speech, John Jones'' house,
    and so on, as we do for the possessive case of almost all proper names and other
    nouns ending in -s. For this reason I have spelled the possessive case of Greek
    and Latin names ending in -s as -s.


    # (3) metre in classical verse


    The metre of Greek and Latin verse is based on patterns of ''long'' and ''short''
    syllables in a line, not (as in English verse) on patterns of stressed and unstressed
    syllables, or (as in French verse) on the number of syllables in a line. This
    arrangement was appropriate for ancient Greek, which was not a stressed language;
    but it was adopted for classical verse, in imitation of the Greek model, even
    though classical Latin was normally spoken with stress. A resulting complication
    is that ''there are good reasons for believing the Romans read [Latin] poetry
    with the stress accent of their normal speech, the quantitative metre (originally
    Greek) being heard as a counterpoint or undercurrent.'' However that may be, what
    follows here is a much simplified account of the basics of classical quantitative
    metre, which applies to both Greek and Latin verse, and explains the origin of
    certain features of the Homeric verse that we will be considering in Chapter 3.


    In classical ''quantitative'' verse (as it is called), patterns of syllables containing
    long and short vowels were arranged in groups


    > 8 For the application of these principles to the 900 names in Homer''s Iliad,
    see p. 28. For an explanation of the forms of Roman names, see pp. 127–8.

    9 For an explanation of how the metre of English verse works, see my Landmarks
    in English Literature, Edinburgh University Press 1998, pp. 70–5; and for French
    verse, see Landmarks in European Literature, Edinburgh University Press 1999,
    pp. 20–1.

    10 L.P. Wilkinson in his edition of Virgil''s Georgica (1982), Penguin Classics
    p. 35.'
