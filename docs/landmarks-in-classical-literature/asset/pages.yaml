  md: '# Ovid: love poetry and the novel 179


    From this time onwards, Ovid gave up any intention of pursuing a public career,
    and settled down to writing poetry, presumably supported by an allowance from
    his father and with the patronage of Messala Corvinus, a supple and powerful lawyer-politician.
    Ovid was a member of a group of brilliant young writers, intellectuals, and socialites,
    who included the notable elegiac poet Propertius, a few years older than Ovid.
    He married for a third time, perhaps around 5 BC, again successfully; and his
    father died, aged ninety, around the turn of the century. This period saw the
    production of his Heroides, verse letters of legendary heroines; the second group
    of amatory poems, Amors amia, the explicit ‘Art of Love’; Metamorphoses, a 12,000-line
    collection in epic style of stories from myth and legend; Fasti, a poetical calendar
    of the Roman year.


    Then disaster struck. In 8 AD, when he was fifty-one, Ovid was exiled to the distant
    and unattractive settlement of Tomis (now Constan, with the Danube delta on the
    west coast of the Black Sea), the equivalent for him of the far end of Siberia.
    Because of this banishment, Ovid said, was a poem and a mistake. The poem was
    the Ars amoria, which had been published about eight years earlier and had conflicted
    with Augustus''s campaign for moral reform and his stern disapproval of adultery.
    We do not know what the mistake was; the most likely possibility is that Ovid
    was implicated, perhaps as an unwilling witness, in some scandal or blot involving
    members of Augustus''s family – something that he should have reported but kept
    to himself.


    And there, in Tomis, Ovid stayed for the rest of his life, his loyal wife marrying
    in Rome to work for his pardon. He went on writing elegant sad – the elegiac Tristia
    (‘Sorrows’), and Epistulae ex Ponto (‘Letters from the Black Sea’) – and he went
    on hoping that they would call him to be remembered and forgiven and allowed to
    return home; but they never did. He died in exile in 17 AD, when he was sixty.


    The Amores, which was originally in five books but was later pruned down to three,
    is written in Ovid''s favourite elegiac metre, couplets of alternating six- and
    five-foot lines. It begins:


    > I''d meant in solemn metre to rehearse

    A tale of arms and war and violence,

    Matching the weighty matter with my verse,

    All alike in length, no difference;

    But Cupid laughed (they say)

    And filched one foot away. [...]'
