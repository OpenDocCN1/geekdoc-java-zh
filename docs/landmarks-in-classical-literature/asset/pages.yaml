    plays of Plautus, including the original Greek titles. Terence also had done more
    seriously and naturallyistically than his predecessor he had avoided anachronistic
    Roman introductions into the Greek plots, and concentrated on character rather
    than caricature. Again there was no chorus, but probably no music either; and
    again he wrote plays that still work well on the stage.¹


    Terence''s Phormio (161 BC) was based on a lost play, The Claimant, by Apollodorus
    of Carystus. Phormio himself, the character who dominates the play that bears
    his name, is the most formidable creation in surviving Roman comedy: a rascaller
    who lives by his wits, and is the prototypical adventurer just Plautus''s Euclo
    is the prototypical comic. The main characters, too, in this elegant comedy of
    intrigue are well developed as human beings; and although Terence farcical humour
    does not follow Plautus in his grosser clowning. Again, Molière knew a good comedy
    when he saw one, and he followed Phormio very closely; sometimes line for line
    — in highlights Les Furies of Scapin (''That Stound Scapin'', 1671).


    The best-known Roman tragedian was Seneca the Younger (Lucius Annaeus Seneca,
