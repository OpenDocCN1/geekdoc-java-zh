    The story now becomes more straightforward. Horace''s poetry brought him into
    contact with Virgil, in 38 BC introduced him to his patron Maecenas. Horace''s
    first book of Satires was published in 35 BC, and soon after Maecenas bought him
    a modest estate in the Sabine hills near Tivoli, 25km east of Rome. Here Horace
    – a short and chubby man – lived very happily for the rest of his life: nurturing
    his friendships, tending his estate, writing superlative poetry, enjoying food
    and drink and girls, and staying out of politics. Augustus took to him, and saw
    him as a sort of poet laureate; he even offered him a job as a private secretary,
    but Horace politely turned it. The Epodes and Satires II came out in 30 BC, Odes
    I-III in 23, Epistles I in 19, Carmen Saeculare in 17, and finally Odes IV and
    Epistles II in 14–13. He died in 8 BC at the age of fifty-seven, a few months
    after Maecenas, and were buried in ancient graves in Maecenas''s estate in Rome.


    Horace''s poetry was various in its metrics and allusive that it is more than
    usually difficult to communicate in English. Technically (like most of the Roman
    poets from Catullus) he adopted Greek metres in Latin verse: hexamers for the
    Satires and Epistles, and a variety of elegiac and lyric metres from Sappho, Anacreon,
    Alcaeus, and Pindar for the Epodes and Epistles. Here is an ‘autobiographical’
    passage from the first book of Satires:


