  md: '# Religion, the arts, education, and books


    # Religious beliefs and practices


    Homer Hesiod may not have been the first to give the Greek gods their names and
    qualities


    Besides the Olympians, the Greek supernatural world included nature spirits (nymphs)
    and ghosts; and it was considered wise as pious to propitiate them when the occasion
    arose. There were also the cults of particular gods, heroes, and ancestors, celebrated
    in temples and sanctuaries, at wayside shrines and in the home. The chief method
    of propitiation was sacrifice, either bloodless (fruit or corn offered at a shrine,
    for instance) or blood sacrifice, accompanied by appropriate prayers. At a blood
    sacrifice, following the purification from pollution of the celebrants, a live
    domestic animal was slaughtered in such a way that its blood fell on the appropriate
    altar. It was then skinned and butchered. The bones, with some fat and flesh,
    were burned on the altar (which was consequently located outside the sanctuary
    or temple building, not inside); and finally the greater part of the flesh and
    some of the entrails were eaten by the participants. Apart from formal sacrifice'
