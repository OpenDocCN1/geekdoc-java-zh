    And thus Pindar, Damophilus''s host at Thebes, brings his great Ode

    to a graceful conclusion in which he foresees his immortality. (But

    if Damophilus allowed home by Arkesilas, he may not have

    found much comfort there, for two years later there was a revolution

    in Arkesilas was overthrown and a republic was established).

    Although the celebratory material of the Odes necessarily

    some repetition, this is not obvious to the reader because of

    t variety of the details and the interest of the mythological parallels.

    They are moreover written from an essentially religious point of

    views – sometimes obviously than so in Pythian 4 – from which

    the gods are sending their divinity to human beings, especially at

    the special moments of victory in which a transcendental state may

    reached. Here, perhaps, Pindar comes as close as any ancient

    writer to evoking the transcendental experience in which colours are

    brighter, forms are greater and more vibrant with meaning, than

    they ever are in the ordinary world.


