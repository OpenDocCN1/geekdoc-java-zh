    never reach the size of dogs'' (3.101–2). In the ancient world he was sometimes
    called ''the father of lies'' as ''the father of history'', but we are better
    placed to interpret and value his folk tales and fantastic wonders than were his
    immediate successors. Certainly we need no longer be put off by them; and the
    real world is how much he got right.


    Herodotus, as the first major western historian, established the full scope of
    history, including in his only ''history'' in its more restricted sense, but also
    what later came to be geography, anthropology, ethnography, and archaeology. He
    bounded curiosity – the first requirement of any historian with a serious attempt
    to evaluate his sources of information; he wrote clearly and effectively; and
    he gave his narrative a formal structure based on cause and effect. In these essentials
    Herodotus set the course of western historical writing that it follows still.


    # Thucydides and the Peloponnesian War


    In the middle years of the fifth century BC – the great age of Attic culture –
    the Athenians quickly recovered their pre-eminence in mainland Greece north of
    Corinth following the ravages of the Persian Wars; and they strengthened their
    hold on a tributary empire (politely called the Delian League) that encompassed
    most of the islands and periphery of the Aegean Sea. They had a fine navy – probably
    the best in the world at the time – but they were challenged on land by the militarily
    formidable Spartans, who controlled most of the Peloponnese (Peloponnesian League).
    There was intermittent but inconclusive fighting between these two major powers
    in 460–446 BC (the first Peloponnesian War); but by 431 Sparta was sufficiently
    alarmed by Athenian expansion to take a second and more vigorous war against Athens,
    in which the Spartans were finally victorious – to a considerable extent as the'
