    A few of Plato''s philosophical ideas came from the pre-Socratics, but he was
    the first to combine them, together with the teaching of Socrates and his original
    thinking, into a coherent system. He believed in the immortality of the soul;
    and he believed that all objects of knowledge are eternal and timeless (the theory
    of Ideas), but that there is nothing real or permanent in the sensory world. He
    believed, therefore, that knowledge (and wisdom gained through knowledge) could
    be approached only through the intellect, not through the senses; that pursuit
    of ''the good'' through knowledge was the proper object of the philosopher; and
    that the legislators of mankind should be philosophers—certainly not poets (as
    Johnson and Shelley were to propose), for whom he had little respect. He continued
    to develop these ideas during his lifetime, and explained them as he went along
    in his major works.


    The form Plato chose for most of his writings the ''dialogue'', in which, typically,
