  md: '# 10 The expansion of Rome


    From city-state to superstate¹


    Occupation of the site of Rome in Latium – by a group of hill-top villages on
    the left bank of the Tiber, about 22km from the sea – may have begun as early
    as the middle of the second millennium BC, but it was not until the mid-eighth
    century that the villages appear to coalesce into a single, larger trading centre;
    that is to say, at about the time when the Homeric poems were reaching their final
    form, and when the Greeks were beginning to colonize Sicily. The date of the foundation
    of Rome by the legendary Romulus and Remus, supposedly the descendants of Trojan
    Aeneas, was believed in later tradition to have been 753 BC, which agrees more
    or less with the archaeological evidence for its growth.


    At the time Latium was inhabited by several groups of Italic-speaking people,
    their dialect was the ancestor of what was to become Latin. There were other Italic-speaking
    tribes in central Italy, but beyond them north and south were foreigners: to the
    north the Etruscans, a numerous and culturally advanced people who spoke a non-Indo-European
    language; further still were Celtic tribes which were later to invade and control
    the Po valley (and to give their name Cisalpine Gaul, ‘Gaul this side of the Alps’).
    To the south was an increasing number of Greek colonies in the foot of Italy and
    eastern Sicily; and beyond them again the powerful Phoenician colony of Carthage
    (near Tunis in North Africa), founded in the ninth century BC, which held the
    western half of Sicily.


    In its earliest years, from the oath to the end of the seventh century BC, Rome
    was a monarchy, in constant conflict with its neighbours, gradually extending
    its influence over the other tribes of Latium.


    > ¹ See the chronological chart on pp. 191–2.


