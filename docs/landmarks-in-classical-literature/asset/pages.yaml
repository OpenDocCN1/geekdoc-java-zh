    The Apology is in three parts. The first and longest of them contains Socrates’s
    speech for the defence, in which he explains the reasons for his unpopularity
    as he sees them, and describes his actual practice as a teacher of young men;
    undertakes a hostile crossexamination of Meletus, the main accuser; and self-confidently
    justifies his activities. As the jury finds him guilty, though not by a large
    margin. Now Socrates is invited to propose his own penalty; and in the second
    part of his speech, having remarked that the city ought to reward him, not penalise
    him, he rejects prison or exile and proposes a fine. This is too much for the
    jurors, who sentence him to death by a larger margin than before. In the third


