  md: '# 4 From Archaic to early-Classical Greece


    The Archaic Period is generally taken to have lasted from the end of the Dark
    Age sometime in the eighth century BC to the final defeat of the Persian invasion
    at Plataea in 479 BC. At some time before the beginning of the eighth century
    the ''polis'' begun to evolve following the disintegration of Mycenaean civilisation,
    and to become the focal point for the development of Greek institutions and culture.
    Whatever its form of government – initially monarchies and autocracies which could
    themselves evolve into oligarchies and democracies – the ''polis'' was in (George
    Forrest''s lucid definition) ''a community of citizens (adult males), citizens
    without political rights (women and children), and non-citizens (foreigners and
    slaves), a defined body, occupying a defined area, living under a defined or defined
    constitution, independent of outside authority to an extent that allowed enough
    of its members to feel that they were independent.¹ There were two essentials:
    the first was a sense of community, the second was a city, usually fortified,
    at the hub of the surrounding farm-land, which was the seat of government, the
    meeting place, and the market centre.


    The two foremost Greek city-states of the Archaic and early Classical periods,
    Athens and Sparta, developed in very different directions, as a brief account
    of their history and constitutional development will show.


    # Athens


    Athens may have been the only major Mycenaean citadel that was not destroyed and
    depopulated during the Dorian invasions, its


