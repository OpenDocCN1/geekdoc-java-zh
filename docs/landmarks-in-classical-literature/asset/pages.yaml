  md: '# 54 Landmarks in classical literature


    western city, and even in such things as the window-surrounds

    porches of small private houses.


    Other Greek public buildings included the ''stoa'', a long colon-

    naded porch, and the circular ''tholos'' for meetings; buildings which

    had later architectural and functional parallels in the cloisters and

    chapter-houses of Christian monasteries and cathedrals.


    # Painting


    There was once a great deal of early Greek painting on walls and on

    wooden panels, but nearly all of it is lost, or is known only

    a a few Roman copies. From the fragments that survive we

    can tell that it progressed from the flat, outlined images (similar to

    Egyptian painting) of the Archaic period to attempts at giving depth

    to figures by means of shading; but there was not yet much under-\standing of
    perspective.


    Where Greek painting does survive in quantity is on pottery,

    notably on the beautiful vases that were produced from

    Minoan times onwards, especially in Corinth and Athens. Again the

    drawing – mostly of mythological subjects – was flat, but in their

    progress from the outline drawing to ''black-figure'' painting (in

    white lines were scratched on black) during the Archaic

    period, and then to ''red-figure'' painting (black lines drawn on

    red) at its end, the vases produced a vivid body of work,

    for the most part mythological subjects.


    # Sculpture


    Small statues for votive or other religious purposes had

    been carved from very early times in bone, wood, and stone, but

    life-size sculptures of human figures in stone (deriving from Egypt-

    tian models) began to be made in Greece in the mid-seventh century

    BC. Initially these were rather stiff statues of young men and women

    (known as ''kouros'' and ''koré'' respectively), but anatomical accu-

    racy of the modelling gradually increased, and by the end of the

    sixth century the ''new sculpture'' was producing works of great

    beauty. It was mostly intended for use in and about religious centres

    as and funerary monuments, but portrait statues and busts (usually\idealised)
    also became quite common; and, surprisingly to us

    are used to seeing white originals and plaster casts, stone statues

    were (like temples) painted in bright colours. Besides sculpture in'
