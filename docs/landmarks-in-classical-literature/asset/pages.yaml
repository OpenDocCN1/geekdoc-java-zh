    > Talia saecla suis dixerunt ‘currite’ fusis concordis stabil fatorum numine Parcae


    > Talia saecla suis dixerunt fusis

    Such ages to their run on spindles

    concordes stabil fatorum numine Parcae

    harmony stabile of destiny with the Parcae


    > Run on, us ages’, said the Parcae to their spindles

    in harmony with the fixed will of destiny⁴


    The vocabulary of Latin has a familiar sound to us because a good deal of the
    word stock derives from Latin forebears (having come to us through Norman French
    as well as directly); but the grammar is anything but. In Classical nouns were
    assigned to five groups declensions (stems ending in -a, -us [or -um], ...), in
    which there were up to eight cases (nominative, accusative, genitive ...). In
    Greek, there were three genders (masculine, feminine, and neuter), and two numbers,
    singular and plural. The verbs, in five groups conjugations, were similar to Greek
    verbs having special suffixes to indicate action, time, mood, voice, and person
    (see p. 21 above). Again, Latin is not an easy language for us to learn but, expertly
    used, it has both beauty and precision. Anyone with the most basic knowledge of
    how it works, a summary of its grammar, and an adequate Latin–English dictionary
    can make good use of parallel-text translations of the major Latin authors.


