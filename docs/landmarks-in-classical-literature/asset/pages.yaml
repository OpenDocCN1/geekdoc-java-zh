  md: 'Republic and Empire


    # Politics and society


    Or society and politics: the two were more than usually bound by each other in
    ancient Rome. The class system was even more important politically in Rome than
    it had been in the Greek city-states, but it proved to be less rigid and immutable.
    Throughout the history of the Republic a limited and declining number of aristocratic
    families – the patricians – formed a privileged class, arranged in clans or groups
    of related families. In its early years only male patricians could be elected
    to the governing and religious offices and to the senate; but between the fifth
    and fourth centuries BC ‘plebeians’ – the rest of the male citizens also became
    eligible. There was a wealthy class of ‘equestrians’ defined in the second century
    BC by a property qualification, the members of which, though called ‘knights’,
    were predominantly rich businessmen who were often more concerned with making
    money in the law, banking, trade, and so on with warfare or politics. Patrician
    influence on government remained disproportionately strong into imperial times,
    there was some social mobility between the classes; and many of the most powerful
    politicians of the late Republic were from plebeian families who had joined the
    senatorial class.


    The Roman Republic, though nominally a democracy, was in fact a largely aristocratic
    oligarchy. Consuls, and later other officials, elected annually, and exercised
    considerable power during their terms of office; but they were ultimately responsible
    for the senate, by which ex-consuls and other officers were appointed for life;
    in practice most of its members were from patrician backgrounds, and were inclined
    to support measures which benefited their own class. The emperors continued to
    claim democratic legitimacy and to make a show of respect for the state, Julius
    Caesar, and later Augustus and his successors, were dictators: absolute monarchs
    ruling was supposed to be a commonwealth.


    The status of Roman citizen, which carried legal privileges such as military service,
    was originally limited to the inhabitants of Rome, but was gradually extended
    to territories incorporated into the Roman state, either directly or as provinces.
    All the Italian allies were franchised following the Social War of 90–88 BC. Under
    the empire, when most voting was replaced by direct rule and military service
    was performed by professional soldiers, citizenship still accorded some'
