  md: '# Plato and philosophy 101


    Pythagoras, a native of the island of Samos who lived and worked in southern Italy
    in the later sixth century BC, was a philosopher of a strongly mystical tendency,
    who founded a contemplative religious order. He may – the evidence is uncertain
    – have combined mysticism and a belief in the transmigration of souls with developing
    the most abstract of the sciences, mathematics, concentrating in particular geometry.
    ''All things'', he may have said, ''are numbers''; and for him numbers existed
    outside the world of sense, where they connected to the eternal. Parmenides, early-fifth-century
    BC philosopher from Elea in southern Italy, went further and proposed that everything
    apprehended through the senses was an illusion (an idea that was developed by
    Plato) but that the essential matter of the universe was single, indivisible,
    and unchanging.


    Heraclitus of Ephesus (c.500 BC) was another mystic, who believed that fire was
    the fundamental substance and that unity in the world was achieved by the combination
    of opposites, so that change in one leads to change in another. He is chiefly
    remembered for his conclusion that everything in the world was in a state of endless
    combination and recombination, that ''all is flux'', and for saying that it is
    not possible to step twice into the same river.


    Xenophanes, a near-contemporary of Heraclitus was another Ionian who lived most
    of his life in southern Italy. He was a rationalist and empiricist who thought
    that all things were made of earth and water. He was especially notorious for
    his attacks on the Olympian pantheon (if animals could draw, he said, they would
    draw the gods in their own images), and for his belief in a single God who controlled
    the strength of his mind.


    Three other philosophers are usually grouped with the Pre-Socratic, though Empedocles
    (c.495–435 BC) was a Sicilian aristocrat and statesman only about twenty-five
    years older than Socrates, a Pythagoras who followed Parmenides in believing that
    matter is eternal. Having decided that air is a separate substance, he proposed
    that all matter consisted of different (and differing) mixtures of four elements:
    earth, air, fire, and water, a belief that persisted until medieval times. Empedocles
    appears to be a polymath: a philosopher who believed in cycles of history, a mystic
    who was also a rationalist, a physician, a cosmologist who believed (following
    Heraclitus) that the earth was a sphere, an experimental physicist,'
