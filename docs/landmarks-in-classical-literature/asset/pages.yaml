    From this time until the end of the Republic in 30 BC, Roman politics was in constant
    turmoil, generalised by struggles for power between leading politicians and –
    most destructively – generals. Ruthless individuals allowed their ambitions to
    overcome any thought for the good of the Republic; in the end they brought it
    down. This was possible because the soldiers in the Roman army recognised their
    rewards in pay and booty upon the success of their commanders in war; and they
    were prepared to follow a successful commander wherever he led them, if necessary
    against Rome itself. In effect the leading generals had private armies; and they
    were prepared to use them for their own advancement.


    The leading generals after Sulla’s retirement were Pompey, Crassus, and Caesar;
    and, after appearing in the 70s and 60s, they agreed in 60 BC to rule the Republic
    between them, as what is now known as the ‘First Triumvirate’. Caesar felt sufficiently
    confident of his position to go and conquering the rest of Gaul; but when Crassus
    was killed following a defeat by the Parthians in 53 BC, rivalry between Caesar
    and Pompey increased and brought their compact to an end. Caesar led his army
    across the Rubicon from the north province of Cisaline Gaul into Rome’s territory,
    and defeated Pompey. Caesar became dictator and instituted a programme of reforms,
    but his rule ended with his assassination by republicans in 44 BC.


    The murder of Caesar did not result, as the conspirators had hoped, in the restoration
    of the Republic, but in another round of civil war, in which the republicans were
    defeated. Caesar’s former colleague Antony inevitably joined the senate Lepidus
    and young Octavian, Caesar’s ambitious adopted son, in a second Triumvirate, and
    inevitably rivalry flared up between them. Lepidus was forced out of power in
    36 BC and Antony, having been defeated by Octavian’s forces at the naval battle
    of Actium in 31 BC, committed suicide in Alexandria in 30.


    So Octavian came out on top. The Republic finally collapsed, and Octavian was
    the new Caesar, being Augustus by the senate in 27. Thus he became the first and
    perhaps the greatest of the Roman emperors, ambitious to recover Rome’s traditional
    virtues and to rebuild its moral fabric under a paternalistic autocracy.'
