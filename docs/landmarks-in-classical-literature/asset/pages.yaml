  md: '# 9 Plato and philosophy


    # The Pre-Socratics


    Philosophy – literally ''the love of wisdom'' or ''knowledge'' – has always involved
    the search for what is the real nature of things and what is not; for what is
    permanent rather than transitory; for what is good and what is bad. Several early
    philosophers working in the century and a half before Socrates became active,
    that is from about 600 to about 450 BC, began to ask questions about these things
    in terms that we can recognise, even if we have to reject many of their answers.
    Some of them were inclined to what we would call a ''mystical'' approach, being
    to a more concerned with the nature of divinity and of the soul; some more ''scientific''
    one, involving cosmology and speculation about the nature and stability of matter;
    though neither group was exclusively mystical or scientific. Our knowledge of
    them is patchy at best. A few fragments of their teachings survive in quotations
    by later authors, and there are biographical details (some of questionable authenticity)
    in such works as the Lives and Opinions of Eminent Philosophers of Diogenes Laertius
    (third century AD), which was itself compiled from earlier collections.


    Thales, who was working at the beginning of the sixth century BC, and Anaximander
    and Anaximenes who followed him later in the sixth century BC, were ''scientific''
    philosophers from the city of Miletus in south-west Asia Minor. Thales, whom Aristotle
    considered to be the first ''natural philosopher'', had some skill in geometry
    and astronomy, and proposed the scientific hypothesis that everything in the world
    was made of matter. Anaximander held that everything came from a single, primal
    substance, not water but something other than any of the substances we know; while
    Anaximenes thought that the fundamental substance of matter was air.


    100'
