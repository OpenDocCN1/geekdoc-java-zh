    parallel.


    Penguin Classics offers three translations of the Aeneid. There is, first, the
    magnificent, freely translated version in heroic couplets by John Dryden (1697),
    which is itself a major work of art; and it is, perhaps, a more successful approach
    to a great classical poem than Pope''s version of the Iliad, that the Neoclassicism
    of the seventeenth and eighteenth centuries looked back to Archaic Greece; of
    August Rome, it is well edited by Frederick M. Keener. There are then two translations,
