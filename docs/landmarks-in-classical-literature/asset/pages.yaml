  md: '# Religion, the arts, education, and books 53


    of this sort, small portions of food at a meal might be set aside for a god, or
    a few drops of wine poured out as a libation before drinking. Oracles, such as
    those of Zeus at Dodona in Epirus and of Apollo at Delphi, were consulted for
    guidance in both public and private affairs. The enquiries might concern religious
    practice; whether to declare war, when and whether a group of colonists would
    sail; personal matters such as to get married, how to choose a career, and problems
    concerning health. At Dodona, answers were given in the form of interpretations
    of the rustling of the leaves of a sacred oak tree; at Delphi the priestess of
    Apollo went into an oracular trance, and gave verbal pronouncements which might
    need interpretation. Simple, personal questions might be answered ‘yes’ or ‘no’;
    but the answers to questions of public importance were frequently ambiguous. Oracles
    were important in the ancient world because their pronouncements were believed
    and acted upon.


    # Architecture


    The temple architecture of the Archaic and Classical periods is the most visible
    artistic legacy of the Greeks, had – indeed still having – a marked influence
    on the architecture of the modern world, either directly or through the mediation
    of Roman imitations of Greek buildings. Being built as houses for the gods, not
    for religious services, temples could have an extraordinary sublimity; and Parthenon,
    seen on the Acropolis in the early-morning light from the hill where the Athenian
    assembly used to meet, can still be a deeply moving sight.


    By the sixth century BC, Greek temple architecture in stone had reached an extraordinarily
    high standard. Temples of the Classical period, which could be very large (the
    fourth-century Artemision at Ephesus was 15m longer than the Parthenon), were
    rectangular in plan, with a pedimented roof running the length of the building,
    supported by a colonnade running right the outside; there was then an inner colonnade
    surrounding the room which housed the image of the god. There were conventional
    designs, or ‘orders’, for the fluted columns, known to us as ‘Doric’ (with plain
    tops) and ‘Ionic’ (with volutes at the top); and temples might be adorned with
    sculpted friezes in bas relief, and painted in bright colours. Architectural features
    deriving ultimately from this temple style can be seen in the public buildings
    of nearly major'
