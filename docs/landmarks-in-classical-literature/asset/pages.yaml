  md: '# Landmarks in classical literature


    # The novel


    Any reasonably broad definition of the novel – such as ''nearly always an extended
    fictional prose narrative, although some novels [...] have been written in verse⁴
    – can be stretched to include a good deal of classical literature, starting, for
    instance, with the Odyssey. Long fictional narratives were written in prose in
    classical times – mostly in Hellenistic Greek – but only a few examples have come
    down to us in more than fragmentary form. Of these, we shall look at one of the
    five surviving Greek novels, and at both the two Latin novels that have survived.


    # Longus


    The early Greek novel appears to have been developed in the Hellenistic age, but
    the novels that we know about mostly belong to the late second and third century
    AD. Characterisation was primitive, they had strong, plots on the lines of: boy
    they meets girl /they overcome various difficulties, including separation / they
    are reunited there is a happy ending. The best of the surviving examples is Daphne
    and Chloe, but nothing is known about its author except that he was called Longus,
    a Roman name that may mean that he was a Greek living in Italy.


    Daphnis and Chloe, we learn, were separately exposed by their parents in early
    infancy in the country near Mytilene in Lesbos, protected by Pan and the Nymphs,
    they were suckled by a nanny-goat and e respectively. The babies were discovered
    by neighbouring families of agricultural slaves and brought up as their children.
    Daphnis, now a goat-herd aged fifteen, and Chloe, a shepherdess of thirteen, are
    constant companions on the grasslands, and are beginning to fall in love with
    each other. Despite seeing the mating of their animals, they are sexually naive
    and can do no more than hug and kiss. Various adventures befall them: another
    young man wants to marry Chloe; they get into trouble with a party of visiting
    rowdies; their district is invaded by a fleet from another part of Lesbos which
    carries Chloe and her sheep (but Pan intervenes and she escapes); Daphnis learns
    all about sex from an old man’s wife who fancies him. Finally the owner of the
    estate – and of Daphnis and Chloe of


