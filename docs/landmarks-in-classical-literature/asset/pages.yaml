- pgno: 30
  md: '# The Greeks 21


    loves the woman''. To say ''the woman loves the man'', the cases of the nouns
    have to be changed round: feminina hominem amat (or the same three words in any
    other order). The fact that word-order is relatively unimportant in inflected
    languages means that their words can be easier to fit into the lyrical schemes
    of poetry than the words of uninflected languages such as English, where part
    of the meaning is carried by word-order.


    Going back to Classical Greek, nouns and adjectives had five main cases, and were
    arranged into classes (called declensions) according to the endings of the root
    words. There were three genders, masculine, feminine, and neuter (as are in modern
    German); and two numbers, singular and plural (and in early Greek a ''dual'' number
    as well). Verb formations were extremely complicated, indicating action (ongoing,
    finished, and others); time (past, present, and future); mood (indicative, subjunctive
    and others); voice (active, passive, and middle); and person (first, second, and
    third, in singular and plural). All this makes Greek quite a difficult language
    to learn, a precise and flexible one once it is understood.


    The different waves of Greek invaders brought in their dialects of the language
    with them – Aeolic, Ionic, Attic, Doric, and so on – the dialects were mutually
    comprehensible and shared much of the same word stock. Much of the literature
    that we shall be considered written in the Attic (Athenian) dialect, but we shall
    also come across major writers in, for instance, the Ionic dialect. Homeric Greek,
    the ‘epic dialect’, is a special case, which we shall look at in the next chapter.


    # The Greek alphabet


    The words of a language can be written in various ways. In logographic systems
    each word has a separate sign, of which several thousand are therefore required;
    basic Chinese can be written with 2,000 signs, but many more are needed for special
    subjects. Syllabic systems (like Linear A and B) have a different sign for each
    syllable, and require anything from fifty to several hundred signs; syllabic systems
    are simpler than logographic ones, but are still fairly clumsy. Alphabets are
    much more economical, having a sign for each consonant and vowel, and requiring
    a total of only twenty or thirty signs which can be variously combined to make
    the words of a language.'
