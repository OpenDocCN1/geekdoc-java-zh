    sophisticated, and an engrossing read: what we should call a novel in verse.


    # History


    A number of probably reliable and interesting historians were writing Greek in
    the Hellenistic period, such as Ephorus, Theopompus, and Hieronymus, but their
    texts are lost except for a few small fragments. We know about them chiefly their
    books were among the sources cited by later historians of Greece such as Diodorus
    Siculus (late first century BC). An exception is Polybius (second century BC),
    the Greek historian of the rise to power of Rome in the thirty-three years from
    220 to 168 BC, five of whose forty books survive.


