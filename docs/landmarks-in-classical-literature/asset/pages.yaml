    dishonest, trivial charlatan, whose only point of contact with the ascetic Socrates
    of Plato and Xenophon is his unkempt appearance. It seems that Aristophanes took
    Socrates as the visible example of a type of philosopher who could be ridiculed
    in Athenian comedy, deserved or not; and Plato suggests later on that Aristophanes
    and Socrates remained friends despite Clouds, though it probably damaged Socrates''
    reputation in Athens.


    The evidence for a very different Socrates by Plato, Xenophon, and the fragments
    are so overwhelming in its scope and detail that Aristophanes'' burlesque account
    has to be rejected. But this utterly different portrait, though it presents a
    consistent personality – a Socrates of outstanding charm, curiosity, honesty,
    and intelligence – is not entirely consistent philosophically.


    Plato appears to have started using the character of Socrates to record the work
    of his old teacher, a philosopher who asked how we should live and what was the
    nature of this or virtue, who claimed not to know or understand things in order
    to draw the answers from his interlocutors. But then Plato seems to have gone
    on expounding his later philosophical ideas using ‘Socrates’ as his mouthpiece,
    and the ‘Socrates’ of the later dialogues does not hold all the views he did in
    the early ones. Xenophon, more conventional and shallower Plato, gives us yet
    another ‘Socrates’, a portrait of the teacher he loved and learned from, who is
    not grossly dissimilar from the ‘Socrates’ of Plato, but who is also partly a
    reflection of himself, just as Plato’s changing Socrates was partly a reflection
    of Plato.


