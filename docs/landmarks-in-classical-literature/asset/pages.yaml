  md: '# Form Archaic to early-Classical Greece 49


    The most formidable fighting unit of the Greek armies at this time was the ''phalanx''
    or box of heavy infantry called ''hoplites''. The hoplites, in Athens were free
    citizens of the third class (who kept oxen), provided their own armour of helmets,
    breastplates, and shin-guards; in battle they stood shoulder to shoulder, their
    metal and leather shields overlapping, and their pikes sticking out below the
    shields. Such a phalanx, perhaps fifty men wide and deep at time, was almost unstoppable
    as it advanced at a steady pace on the enemy, and was vulnerable only to attack,
    for instance by cavalry, from the flank or rear. The well-trained Spartan hoplites,
    who were effectively professional soldiers, were the most formidable of all.


    But if the Spartans had the army, the Athenians undoubtedly had the best navy,
    from 200 to 300 operational triremes during the mid-fifth century BC. The trireme
    was a long, narrow fighting ship (27m × 5m) with three banks of oars, fast (9
    knots or more) and manoeuvrable, and with an armoured bow for ramming enemy ships.
    Its well-trained crew numbered about 100: seventy oarsmen, plus sailors, marines,
    and archers, recruited from the fourth class of free but landless citizens, supplemented
    as necessary by resident foreigners and slaves: so that in the fifth century the
    Athenian navy mustered the very large number of 20,000 to 30,000 men.


