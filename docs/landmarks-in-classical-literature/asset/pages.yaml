  md: '# Sallust


    The commander of one of Caesar''s legions in the Civil War in 49 BC was Gaius
    Sallustius Crispus (86–35 BC), a former tribune of the people who had been expelled
    from the Senate in 50, allegedly for immorality (though the power of his political
    enemies have had most to do with his expulsion). In 46, following an African campaign,
    he was appointed the first governor of Nubia, which he plundered; and he would
    have been convicted of malpractice but there for Caesar''s intervention on his
    behalf. He then retired from public life as a very rich man, and spent his last
    decade writing history at his luxurious houses in Rome and Tivoli.


    Sallust completed monographs on the Catiline ‘war’ – really a ‘putsch’ – of 63
    BC and the Jugurthe War of 107–104 BC, which have survived; and he began a general
    history of Rome since 78 BC which is nearly all lost. His monographs took the
    writing of Roman history stage beyond the somewhat mechanical annals that traditionally
    recorded the events of previous centuries. He had a clear view of the causes and
    motives involved in political events, the knack of sharply characterising the
    leading players, and an eye for the most interesting stories. On the other hand
    he does not seem to have consulted documentary sources, and he was often careless
    about the accuracy of what he wrote.


    Sallust''s story of the Catiline conspiracy (the Bellum Catilinae, c.42–41 BC)
    is freshly and interestingly told with the aim of showing up the degeneracy which
    Sallust believed was destroying the society and government of the Republic (while
    of course ignoring his own degeneracy); and it deals with extraordinary events
    that took place in Sallust''s lifetime, when he was in his early twenties. However,
    if it is compared with the speeches and letters that Cicero wrote about the conspiracy
    at the time, discrepancies of fact are discovered where Cicero''s contemporary
    evidence must be preferred to Sallust''s later history.¹ This combination of definite
    point of view, an ability to tell a good story well, and a lack of rigour in sifting
    the historical evidence continued to be characteristic of


    > ¹ Cicero''s part in defeating the Catiline conspiracy see pp. 147–8 above.'
