    3 follows the beginning of Idyll 4 very closely – Virgil’s pastoral world is not
    the same as the timeless country of Theocritus. We learn at the first Eclogue
    that the countryside is in turmoil, and that Meliboeus is a farmer who is evicted
    from his land, and that the herdsman Tityrus was once a slave who went to Rome
    and gained his freedom; Meliboeus enters Tityrus and deploys his loss. Meliboeus
    begins:


    +   Tityrus, lying back behind beech coffer,

    You mediate the woodland Muse on slender oat;

    We leave the boundaries and sweet ploughlands of home.

    We flee our homeland; you, Tityrus, cool in shade,

    Are teaching echoes to lovely Amaryllis.

    (trs. by Guy Lee, 1980, Penguin Classics p. 31)


    The poem hints at autobiography – Virgil like Meliboeus suffered from the land
    confiscations, and like Tityrus gained redness in Rome – but it is a lament for
    the sufferings endured by every country as a result of civil war. So too with
    the other poems in the cycle: the pastoral tone is stronger in some than in others,
    but all of them include some social or political argument.


    Virgil’s Latin in these marvelous poems (and in the Georgics and the Aeneid) –
    its rich vocabulary, its supple metre, its compelling syntax – is extraordinarily
    beautiful and effective. Here is the Latin of the five lines translated above:


    ```

    Tityre, tu patulae recubans sub tegmine fagi

    siluestrem tenui Musam meditaris auena;

    ```


    > 7 In the form of alternating speeches; the technical term is ‘amoebean’.'
