  md: 'Religion, the arts, education, and books 55


    stone, there was a flourishing tradition of sculpture in cast bronze, made from
    clay models, often ornamented with inlays of other metals. Few actual bronzes
    survive – they commonly melted down in later ages for the sake of their valuable
    metal – but many are known from Roman copies of them made in stone.


    # Music


    Music, often accompanied by dancing, was an essential part of many Greek activities,
    especially religious ceremonies, of social gatherings, and at public games where
    music competitions were held. Much poetry was designed to be sung to the accompaniment
    of the lyre – ‘lyric’ poetry – instrumental music was played on various sorts
    of lyre (stringed instruments that were plucked) and pipe (which were not flutes
    but reed instruments like the oboe). Ancient Greek was seldom written down, and
    hardly any written music has survived, so we know very little about what it sounded
    like, though we do know about ‘modes’ (or scales) that were used. Music was held
    to have an ethical and educational value, both Plato and Aristotle (following
    Pythagoras) believing that it could have a beneficial effect on a man’s soul.


    # Education, literacy, and books


    In fifth-century Athens education tended to be an informal, ad hoc affair, not
    at all like the intensive military training that was mandatory for Spartan boys
    from the age of seven. It was concerned as with gymnastics, with music and poetry,
    as was it with reading and writing and arithmetic; it was private and fee-paying;
    and it was wisely restricted to the sons of citizens and, in a few cases, of restricted
    foreigners. Homer figured largely in the literary part of the curriculum, pupils
    having to learn key passages of the Iliad by heart, together with lists of the
    words peculiar to the epic dialect. Citizens’ daughters might have a scaled-down
    version of the same schooling, but in different places.


    In the absence of statistics it is impossible to judge the effectiveness of Greek
    education in terms of literacy. We know that the Greek alphabet was invented in
    the late eighth century BC, and it was used thereafter by professional scribes
    and bureaucrats; but we do not know how far ordinary citizens could read and write.
    There are, besides, varying degrees of literacy, from the mere ability'
