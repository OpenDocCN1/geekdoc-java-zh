  md: '# The arts 141


    The Phaedra of Seneca (?c.50 AD) – more dramatic poem than a play – derives from
    the Hippolutus of Euripides (429 BC). The myth, retold by Euripides, is that Phaedra,
    the wife of Theseus, falls in love with her nephew Hippolutus, and approaches
    him through his servant; he scorns her approach; she hangs herself, and denounces
    Hippolutus to Theseus in a suicide note; her is revealed by Artemis to Theseus,
    exonerating Hippolutus. While Euripides is chiefly interested in the noble character
    of Hippolutus, Seneca alters the plot order to concentrate on Phaedra; she approaches
    Hippolutus in person, not through an intermediary, and she herself confines her
    guilt to Theseus before killing herself in front of Seneca. Seneca’s Phaedra is
    a more sympathetic character – paradoxically both shameless and more repentant
    than the Phaedra of Euripides, and his Hippolutus is more priggish. Seneca’s dramatic
    tone and technique, while he still uses a chorus, can seem eerily familiar to
    us because of the effect they were to have on English and French dramatic tragedies
    of the sixteenth and seventeenth centuries. Both Hippolutus and Phaedra were drawn
    on by Racine for his masterpiece Phêdre (1677), which he took care to make his
    heroine ‘rather less odious than she is in the classical tragedies.


