  md: '# Landmarks in classical literature


    with unchanged first digits, saying that the second century BC ran from 199 to
    100 BC (rather than 200 to 101) and the second century AD from 100 to 199 AD (rather
    than 101 to 200), and so on. Thus we say that the fifth century BC ran from 499
    to 400; that the third millennium AD will run from 2000 to 2999 AD; that the third
    millennium BC ran from 2999 to 2000 BC; and so on. Note that the Roman Emperor
    Tiberius, who was born on 16 November 42 BC and died on 16 March 37 AD, was aged
    42 + 36 = 78 at the time of his death (there being no year 0); that 1450 BC was
    in the middle of the fifteenth century BC, just as 1450 AD was in the middle of
    the fifteenth century AD; but that, while 410 AD was near the beginning of the
    fifth century AD, 410 BC was near the end of the fifth century BC.


    # (5) Romans numerals


    The Romans recorded numbers by using seven symbols (letters of the alphabet and
    other sigla). These came to be represented by:


    I = 1, V = 5, X = 10, L = 50, C = 100, D = 500, M = 1000


    There was no symbol for zero.


    In ancient times the method preferred for expressing other numbers in formal documents
    and inscriptions was by adding the symbols, to that the first ten digits were:


    +   I, II, III, IV, V, VI, VII, VIII, X


    with XXXVIII for 49, MCCCLXXXVIII for 1499, and so on.


    But alongside the additive method, a subtractive method was developed for less
    formal use. The convention was that, of two number symbols, the smaller was subtracted
    if it stood to the left of the larger one, but added if it stood to the right
    (IX = 9, XI = 11); and if a smaller number stood between two larger ones, it was
    subtracted from the one on its right (LIX = 59). This reduced the number of symbols
    required for some numbers, so that the first digits could be written:


    +   I, II, III, IV, V, VI, VII, VIII, IX


    with IL for 49, MCDCIX and so on. This combined system, using both addition and
    subtraction, eventually superseded the purely additive method, and has been in
    use from the Middle Ages to the present time.'
