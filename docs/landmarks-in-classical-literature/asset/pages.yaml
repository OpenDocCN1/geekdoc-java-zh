  md: 'Sophocles and Athenian drama 69


    are strongly religious in their approach, and they deal primarily with situations
    and events, ideas and beliefs, rather than with character.


    The Oresteia, the complete trilogy from fifth-century Athenian tragedy that we
    have (the satyr-play Proteus was originally attached to it is lost), consists
    of Agamemnon, Choephori (‘Women Bearing Drink-offerings’), or ‘The Libation Bearers’),
    and Eumenides (‘The Kindly Ones’, the Greeks’ euphemism for the Furies or spirits
    of punishment). Totalling 3,796 lines (very nearly the same length as Hamlet)
    the three plays develop a single plot, and can be read as a single-act play. The
    story, which was of course already well known to the Athenian audience, told of
    a series of atrocities committed in the house of Atreus, of their consequences,
    and their divine resolution. The first atrocity, which took place before the trilogy
    began, was the crime of Agamemnon’s father Atreus, who punished his brother Theestes
    for having seduced Atreus by feeding Theestes the flesh of his own child at a
    banquet. The second was the crime of Agamemnon who was required by Artemis to
    sacrifice his daughter Iphigenia in order to get a fair wind for the expedition
    to Troy. Now, in the first of the three plays, a third atrocity takes place: Agamemnon,
    returning home to Argos having led the Greeks in their successful war against
    Troy, is murdered by his wife Clytemnestra (mother of Iphigenia) and her lover
    Aegisthus (Agamemnon’s first cousin and the surviving son of the wronged Theestes).
    This murder of a husband is followed by a fourth atrocity in the second play:
    matricide, when Orestes and Electra, the surviving children of Agamemnon return
    to Argos at the instance of Apollo, and Orestes kills Clytemnestra and Aegisthus
    in revenge for the murder of their father. In the third play Orestes is purified
    of his blood-guilt by Apollo; despite this, he is threatened with pursuit to death
    by the implacable Furies, urged upon by Athena for help, and a trial takes place
    to decide whether or not he was justified under the circumstances in killing his
    mother. The Athenian judges are evenly split, half for, half against; but Athena
    declares that in all judgements the defendant shall be acquitted (or, in another
    interpretation of the passage, gives her the casting vote). The Goddess finally
    conciliates the Furies by promising them a permanent home in Athens, where they
    may become truth through the city’s ‘kindly ones’; and Eumenides ends with the
    women of Athens celebrating their city’s good fortune.'
