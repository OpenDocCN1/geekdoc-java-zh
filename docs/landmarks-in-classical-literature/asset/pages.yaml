    But this time Messalena’s wiles did not succeed in getting round Claudius, and
    she and Silius were both killed.


    Despite his shortcomings, Tacitus remains the best as well as the most readable
    of the Roman historians: the one who gives us the clearest idea of what his times
    felt to an intelligent, sardonic, melancholy member of the ruling class who experienced
    them.


    # Plutarch


    We met Plutarch (c.46 to 120 AD) – the Greek philosopher and historian – at the
    beginning of Chapter 1 (pp. 14–15 above); and, although he wrote in Greek, he
    is included here among the Roman historians because he was a Roman citizen who
    was writing as much, if not more, for the instruction of the educated Romans of
    the empire as for his fellow-Greeks. To recapitulate: he came from a distinguished
    and prosperous family settled in the small city of Chaeronea, 30km east of Delphi;
    he admired the power of Rome as much as its complement, the culture of Greece;
    and he wrote about both with elegance and charm. His writings were so much appreciated,
    both in antiquity and afterwards, a large number of them survived: some 78 miscellaneous
    works and 50 Lives⁷ of Greek and Roman worthies, out of an original total of at
    least 227 items. Most of the miscellaneous works concerned moral philosophy, rhetoric,
    and antiquarian matters; but perhaps his greatest achievement was as a historian
    with his Parallel Lives of Greek and Roman worthies, from the legendary founders
    of Athens and Rome, Theseus and Romulus, down to more recent heroes such as Alexander
    and Julius Caesar.


    Plutarch claims at the beginning of his Life of Alexander Great that he is not
    writing history all:


    I am not writing history but biography, and the most outstanding exploits do not
    always have the property of revealing the goodness or badness of the agent; often
    in fact, a casual action, the odd phrase, or a jest reveals character better than
    battles involving the loss of thousands upon thousands of lives, huge troop movements,
    and whole cities besieged. And so, just as a painter reproduces his subject’s
    likeness by concentrating on the face and the expression of the eyes, by means
    of which character is revealed, and pays any attention to the rest of the body,
    I must be allowed to devote more


    ⁷Twenty-three pairs of parallel lives, and four separate lives.'
