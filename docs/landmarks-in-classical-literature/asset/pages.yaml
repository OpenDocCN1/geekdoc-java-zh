    The most celebrated name in early Greek medicine was that of Hippocrates of Cos
    (fl. late fifth century BC), but nothing is known of his life and he may not have
    written anything by himself. The treatises attributed to him were probably written
    by other physicians in the fourth and third centuries BC, and are best known to
    us through the commentaries of, amongst others, Galen of Pergamon (late second
    century AD). However, his insistence on the effects of diseases with specific
    causes, and successful treatment begins with careful observation – beliefs which
    have remained at the heart of all subsequent medical teaching – may well have
    derived origin from Hippocrates himself.


    # Scholarship and libraries


    The disciplines of philology (the study of language) and bibliographical scholarship
    emerged in the fourth century BC, and were fostered by the establishment of public
    libraries in the major cities. These became large and wealthy institutions, eager
    to collect, collate, and annotate every work of Greek literature, history, philosophy,
    and science that they could hold of. The greatest library of them all, that of
    Egyptian Alexandria, was probably founded by Ptolemy I of Egypt (ruled 323–283
    BC). It was variously stated to have contained from 10,000 to 700,000 papyrus
    rolls; a likely figure is about half a million, equivalent to perhaps 100,000
    modern books, stored on shelves and in boxes and buckets. The Alexandrian Library,
    which also served as a copying centre for collectors and other libraries, amongst
