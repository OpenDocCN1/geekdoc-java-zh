    of the same name who are also possibilities, so that, even if there was a real
    Lesbian, we cannot be sure that it was she.


    # Horace


    Quintus Horatius Flaccus (65–58 BC), the second of the three giants of Augustan
    poetry, was five years younger than his friend Virgil, and he was also acquainted
    with Ovid, who was a generation younger than himself. It is not easy to make sense
    of what we are told, Horace himself in his verse and later in a brief Life by
    Suetonius, about his background and career. He was, it appears, the son of a freedman
    of Venusia in southern Italy – that is a man who had been freed from slavery during
    his lifetime – but a freedman who had become rich enough as an auctioneer’s master-to
    take his boy to be educated by the best teachers in Rome and then to send him
    to study philosophy in Athens. And there in Greece, despite his seemingly humble
    background and complete lack of military experience, the youth was appointed Marcus
    Brutus to a military tribune in his republican army, a rank second only to the
    commander of a Roman legion, commissioned officer who might have to take command
    in the absence of the legate. One suggestion is that Horace’s father had been
    a prominent man who was enslaved following the Social War in 90–88 BC, and when
    he was pardoned and freed he was still sufficiently well off and connected to
    give his son a log.


    Going back to Horace’s military appointment at the age of twenty-one, he served
    with Brutus and Cassius until they were defeated by Octavian and Antony at Philippi
    in 42 BC where, he says, away He returned to Italy, where his family’s property
    had been confiscated, obtained a pardon, and bought what with? – a ‘quaestorship’,
    a government post in the treasury. Now poor, he tells us, he to writing poetry
    to support himself.


    There is really something very odd about Horace’s account of how he got on in
    the face of what should have been insuperable difficulties. We should remember,
    however, first that autobiography – particularly autobiographical poetry – is
    an unreliable form of history; and secondly that Horace was an occasional parodist,'
