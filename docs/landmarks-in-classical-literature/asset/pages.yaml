  md: '# 8 Herodotus and Greek history


    # Greek historians


    Late sixth- and early fifth-century Greek prose histories, short and local rather
    than general in scope, survive in a few fragments, but it is not until we come
    to Herodotus (born c.490 BC) that history as we understand it begins. He is followed
    by a generation later by a second major historian, Thucydides (born c.460–55 BC);
    and we shall also be looking at an account of a particular military campaign in
    which the author had taken part, written by Xenophon, a historian born another
    generation on (c.428 BC) who was also a soldier and a disciple of Socrates.


    In fact the great histories of Herodotus and Thucydides, too, were chiefly concerned
    with warfare: Herodotus''s purpose, for all his digressions, essentially to tell
    the encouraging story of the invasions of Greece by the Persian kings Darius and
    Xerxes, and their ultimate defeat by the joint efforts of the Athenians and the
    Spartans; while Thucydides'' history is the story of the Peloponnesian War, the
    later conflict between the Athenians and the Spartans which ended with the victory
    of Sparta. The chronological table table lists the major events of the fifth century
    BC.


    The histories of Herodotus, Thucydides, and Xenophon were, like most ancient history,
    ''anecdotal'': not so much on account of their diverting tales (of which Herodotus
    was particularly fond), but because they were made up of mixtures of personal
    observation, the reminiscences of others, and oral tradition. They were not histories
    in the modern sense of the term, meaning accounts based primarily on documents
    or other hard (such as archaeological) evidence. This does not mean that their
    authors were not good and reliable historians – on the whole they were – but that
    their method of writing history differed from ours. (As we shall see, they also
    differed from each other in their approach to their work.)'
