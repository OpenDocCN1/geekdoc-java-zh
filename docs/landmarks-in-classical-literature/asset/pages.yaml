  md: '# 22 Landmarks in classical literature


    The earliest alphabets were developed from about 1700 BC for certain semitic languages,
    but they had signs only for the consonants, which limited their usefulness. When
    the Greeks adopted one of these celtic alphabets – the Phoenician one consisting
    of nineteen consonants – in the eighth century BC, they used as vowels some of
    the Phoenician consonants that they did not need, and at a stroke they created
    the first fully efficient alphabetical system for writing: the direct ancestor
    of the Roman capital alphabet, and of the lowercase alphabet in which you are
    reading these words.


    The standard Greek alphabet, which is still in use, is shown in the chart opposite.


    We can see that some of the characteristics of the original semitic alphabet have
    been carried right through our own time: the forms of the letters A, D, K, O,
    and T, for instance, and the order of the letters ABC ... (Aleph Beth Gimel ...
    in Hebrew, Alpha Beta Gamma ... in Greek). Without the Greek alphabet and its
    descendants, which made literature relatively easy, western literature would have
    taken a very different course.


