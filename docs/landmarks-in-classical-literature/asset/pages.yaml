  md: '# The arts 139


    Terence, who wrote comedies at the beginning of the second century BC. Their plays
    were derivative in the sense that both of them adapted Hellenistic Greek plays
    for the Roman stage, but their dramatic and verbal skills were such that their
    productions were much more than pale imitations of Greek originals. The younger
    Seneca, who wrote literary tragedies two hundred years later, took the Classical
    Greek tragedians as his model. All three of these playwrights had a special importance
    for the later development of european literature because it was the Latin dramatists,
    not the Greek ones, chiefly influenced and were in their turn imitated by the
    playwrights of the Renaissance and Neoclassical periods – notably by Shakespeare,
    Molière, and Racine.


    We have twenty of the 130 plays attributed to Titus Macius Plautus (c.250–184
    BC), all of them apparently adaptations of Greek comedies of the Hellenistic period,
    including works by Menander (see p. 117 above). Plautus wrote in spiritid, colloquial
    Latin and where comparisons can be made, it he altered and tightened the texts
    of his Greek originals to make them accessible to Roman audiences; and his plays
    have the additional importance of being almost the only evidence we have of the
    state of the Latin language at the beginning of the second century BC. There was
    no chorus, but the plays probably introduced songs and musical interludes, and
    they were produced with temporary scenery and seating rather than in permanent
    theatres. (The first stone theatre in Rome was not built until 55 BC.) These exuberant,
    near-farical comedies such as Amphitruo and Menaechmi (from which Shakespeare
    took the plot of The Comedy of Errors), and settings, are very funny in translation,
    and are still enactable on the stage.


    The source of Aularia (‘The Pot of Gold’), probably one of Plautus’s later plays,
    is unknown, but it must derive from one of the many hundreds of lost Hellenistic
    plays. Euclid, his central character, is a miser who is obsessed with keeping
    a safe of gold that he has inherited, and Plautus makes him so absurd in his passion
    to be almost tragic. The other characters are less developed, but the dialogue
    never loses pace, and is laced all through outrageous puns and raky jokes. Molière
    wrote Aularia as the basis for one of his comic masterpieces, L’Avare (‘The Miser’,
    1668), and developed Euclio into Harpagon, the miser who reaches even greater
    depths of near-trag misery as a result of his obsession.'
