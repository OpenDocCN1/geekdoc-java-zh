- pgno: 40
  md: '# Homer and epic poetry 31


    pervaded with sentiments of pathos, humanity, and compassion, universal and timeless
    in their application.


    And finally there is the language of the poem, simple but exuberant, adorned with
    moving similes. We have already mentioned the the repetitions of the epithets
    for the various characters, whereby in Book I Achilles is described (in Fagles''
    translation) ''Peleus'' son'', ''brilliant'', ''the swift runner'', ''the matchless
    runner'', ''the headstrong runner'', ''the proud runner'', ''godlike'', ''blazing'',
    the best of the Achaeans; while Agamemnon is called ''lord of men'', ''the fighting
    son of Atreus'', ''the great marshal'', ''King'', ''Atrides'', ''son of Atreus'',
    ''mighty Atrides''; and so on – epithets which both help the poet on his way and
    generate for the audience comfortable familiarity with the heroes. Similar phrases
    – such as the well-known ''rose-fingered dawn'' and ''wine-dark sea'' – longer
    repeated passages (the description of the treasure offered by Agamemnon to Achilles,
    for instance) help in the same ways. Homer''s descriptions also depend on metaphor
    and simile, some of their repetitions, but many unique to their occasions; and
    they are commonly of great power and beauty – again, a fine example is given in
    several versions of the translations, pp. 34–5.


    For all these reasons the Iliad manages to be an engrossing as well as stimulating
    poem, which can carry the modern reader back into the extravagant culture of the
    Bronze- and early-Iron Age Greeks – an astonishing feat considering its antiquity
    and its archaic form. Indeed it has been a success right from the start, a national
    epic treasured by the Greeks, a model admired and built by the Romans, a work
    that has been recognised for its seminal importance ever since.


