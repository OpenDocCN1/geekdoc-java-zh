- pgno: 14
  md: 'historians Herodotus and Tacitus. These ten are given the most space here,
    but a further twenty-five Greek and Latin writers are also discussed in connection
    with them: the didactic poet Hesiod; the Hellenistic poets Callimachus, Apollonius
    Rhodesius, and Theocritus; the lyricists Sappho, Anacreon, and Catullus, and the
    satirist Juvenal; the dramatists Aeschylus, Euripides, Aristophanes, Plutus, Terence,
    and Seneca (as playwright); the historians Thucydides, Xenophon, Caesar, Sallust,
    Livy, Plutarch, and Suetonius; the novelists Petronius, Apuleius, and Longus;
    and the philosophers Aristotle and and Seneca (as philosopher).


    # Technicalities


    The rest of this Introduction considers a number of technical matters. They are
    dealt with here rather than in appendices because they are the sort of things
    which can puzzle or put off the new readers of the classics, and which are best
    explained at for those who like to know more about them. These matters are: (1)
    reading classical authors in translation rather than in the original; (2) the
    form and pronunciation of Greek and Latin names; (3) metre in classical verse;
    (4) dates; (5) Roman numerals; and (6) maps.


    +   (1) The classics in translation


    Because few people can read Greek and Latin, our authors are necessarily approached
    through translation; and their distance from us means that their work has to be
    introduced by explanations that are longer than would be required for the discussion
    of more recent literatures.


    We have to accept that translation is an imperfect medium for the transmission
    of even the simplest literature written in prose, and that it is especially inadequate
    for expressing the poetry of one language in terms of another. Hardly any simple
    words for concrete things translate directly between languages without some distortion
    of meaning, and even simple words tend to have subsidiary senses that differ from
    language to language. Furthermore, as C.D.N. Costa remarked in connection with
    translating Seneca’s Latin prose:


    The most brilliant and distinctive an author the harder it is to translate him
    adequately, and Seneca is no exception. There is in any case the general problem
    of translating from an inflected to a virtually uninflected language. For example,
    inflection allows variations in word order for special effects of emphasis or
    surprise that are difficult to achieve in the far more'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Landmarks in classical literature


    fixed word order of a language like English.² When to this general difficulty
    are added Seneca''s numerous and highly sophisticated mannerisms – word play,
    pungent aphorism, elaborate sentence structure combined with elliptical phrasing
    – we are faced with sometimes daunting problems. (Seneca, Dialogues and Letters,
    ed. and trs. by C.D.N. Costa, 1997, Penguin Classics p. xxv)


    For poetry the situation is even worse: the rhythms, sounds, puns, nuances, and
    emotional charges of poetry simply cannot be translated from one language to another,
    and cannot be easily mimicked in the inevitably different modes of another language.³
    G.H. Lewes summed the problem up in connection with translating the poetry of
    Goethe:


    > A translation [of a poem] may be good as a translation, but it cannot be an
    adequate reproduction of the original. It may be a good poem; it may be a good
    imitation of another poem; it may be better than the original; it cannot be the
    same thing in another language, producing the same effect on the mind.⁴


    The difficulties and imperfections of literary translations are bad enough between
    modern languages, but between ancient and modern languages are compounded the
    cultural environments are further removed from each other by time as well as place.


    Translations are we have to deal with, however, and we are fortunate in having
    plenty of good ones easily available. There is also a real advantage in being
    able to approach the riches of classical literature through the medium of these
    translations. This is that everyone – including those who have taught Greek and
    Latin – can read so much of it, and read so much more easily, than they could
    if they had to pick their way through the varieties of the ancient languages in
    which the classics were written.


    Those with some knowledge of Greek and Latin may choose to use the admirable series
    of Loeb Classics (with the original texts on the left-hand pages and prose translations
    – in some rather dated – on the right, in dozens handy volumes, bound in green


    +   ² On inflections and word order, pp. 20–1, 124–6.


    +   ³ The practical difficulties of translating poetry from one language to another
    are discussed at greater length in my Landmarks in European Literature, Edinburgh
    University Press 1999, pp. 2–6.


    +   ⁴ G.H. Lewes, The Life and Works of Goethe, Everyman''s Library. 1908 and
    reprints, p. 483. The philosophy of translation is considered at length in George
    Steiner''s erudite Babel, re. ed., Oxford University Press 1991.'
