  md: '16


    # Landmarks in classical literature


    In these early times, a sparsely populated world of neolithic tribes, many of
    which spoke the Indo-European tongues that were to develop into the major Balto-Slavic,
    Celtic, Germanic, Greek, Indo-Iranian, and Italic groups of languages. These people,
    while they were capable of the organisation to build Stonehenge and Carnac, lived
    in relatively small settlements, herding animals and growing crops. They were
    illiterate, and their contact with the developing civilisations of the Near East
    was limited to more than the occasional passage of trade goods – stone, amber,
    metals, and manufactures such as ceramics, articles carved in wood and ivory,
    and jewellery. The parts of Europe that were the earliest to progress by this
    tribal culture were those nearest to the examples and technologies of Egypt and
    the Near East: the island of Crete, followed by mainland Greece. The first stage
    was the acquisition of metal technology (first copper, and then Bronze-Age techniques
    spreading northward from the fourth to the third millennium BC), which provided
    better tools and weapons. It was the application of this technology that appears
    to have provided the food supplies which could support classes of people who were
    not engaged in farming. The non-farmers – who came to include rulers, priests,
    craftsmen, traders, and soldiers – gathered round centres of power, which eventually
    became the city-states of Archaic and Classical Greece. The chronological chart
    opposite shows how these developments were related to each other in time.


