- pgno: 35
  md: '# 26 Landmarks in classical literature


    As to the poems'' overtly mythical elements, they present a fully developed pantheon
    of Olympians, only a few of whom were mentioned in the Mycenaean records. The
    gods in Homer are led by Zeus the Father, and they include the other Greek deities:
    Hera, Zeus''s wife, the sea-god Poseidon, Athena goddess of crafts and battle,
    Apollo the prophetic god of art and learning, his twin sister Artemis the huntress,
    Aphrodite the goddess of love, Hermes the herald of the gods, Demeter the corn-goddess,
    Hephaestus the crippled smith-god, and Ares the god of war. They are presented
    after the fashion of a human family, with all their faults and jealousies and
    quarrels; although, though the gods are immortal and are able to medble in human
    affairs, the human beings of the story still have some control over what happens
    to them, by influencing individual gods to act on their behalf by means of prayer
    and sacrifice, or by exercising what is allowed them of their own free will.


    The Olympians, together with nature spirits represented by the nymphs of trees,
    springs, rivers, lakes and mountains, formed the supernatural environment of the
    Homeric Greeks; were taken very seriously. They were worshipped and propitiated
    by the careful performance of ritual, prayer, and the sacrifice of animals; and
    indeed the practice of ritual may have taken the place of a deeper or more personal
    spirituality. One advantage of this clearly defined religion was that it connected
    in one great family all manner of Greek-speaking communities which might otherwise
    have been separated from each other.


    The early Greeks'' understanding of the afterlife was not encouraging. It was
    believed that, for most people, death would be, literally, the end. The more prominent
    souls, would find their way to the underworld, Hades, where they would lead a
    bleak and unsatisfying existence, the shade of Achilles saying in the Odyssey
    that he would rather be the humblest labour than a king in Hades (11,487–91).
    There is also mention in the Odyssey of Elysium, the Islands of the Blast, which
    was reserved for a few heroes who went instead of dying, and was perhaps a survival
    of Minoan beliefs. For most people, there was no prospect of heaven after death,
    no reward for good behaviour, nothing to hope for but relief from the pain of
    living. (The doctrine of reincarnation was not current in Homer''s time).


    There can be no doubt that the Homeric epics first came into existence as oral
    poetry. There was a strong tradition of bardic poets who sang their poetry and
    accompanied themselves on the'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Homer and epic poetry 27


    lyre, a kind of harp. They helped themselves to improvise their own versions of
    traditional tales by use of words, phrases, and longer passages which were repeated
    – sometimes with but significant differences – to bring the elements of the story
    together and fit them into the strict metre of the traditional epic form. Each
    character in the story, for instance, would have a set of descriptive epithets
    of various metric shapes which could be fitted into different parts of the line
    as they were needed; and the habitual use of his stock of epithets and phrases
    would give the poet time to remember or improvise what was to come next. Whole
    scenes and settings in the stories were also repeated, for several possible reasons:
    repetition to articulate the narrative and to please the audience by its familiarity;
    to make a point by subtly changing a verbatim repetition; and perhaps to give
    the poet space, like the chorus of a song, to proceed with his tale.


    But, although characteristics of oral poetry are plain to see in Homer, it is
    surprising to find oral poems of such great length – some 15,000 lines in case
    of the Iliad, and 12,000 in that of the Odyssey, poems that would take twenty
    or twenty-four hours to recite, over many days. A possibility is that the poet
    built up the poems in parts over a period of time, and that he was eventually
    able to put the parts together as complete epics when the invention of alphabetic
    writing (which occurred just the right time) enabled him to do so. In any event,
    the poems clearly existed in written form by the sixth century BC, and probably
    earlier.


    Who, then, was Homer? One poet or many? And when did he live and compose his poems?
    The idea of multiple authorship for the Homeric epics – or least for each of them
    – is now discredited (though each poem as has come down to the result of many
    tellings). The ‘epic dialect’ is peculiar – it uses a mixture of Greek dialects
    to construct a special language that was not in general spoken use – and would
    seem to be a single intelligence that shaped the Iliad, and the same (possibly
    another) single intelligence shaped the Odyssey. Various linguistic and other
    clues point to a time of composition in the late eighth century BC, the Odyssey
    being written a few years after the Iliad; and to a poet who came from the Ionian
    coast of Asia Minor (now part of Turkey). Although we know nothing else about
    him, the chances are good that there really was a poet whom we call Homer (as
    the Greeks of Classical period were quite sure that was), and that he was responsible
    for the Iliad, and probably for the Odyssey as well.'
