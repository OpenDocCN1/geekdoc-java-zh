  md: '# 13 The arts


    # Painting, sculpture, and architecture


    The strongest influences on the Roman visual arts were the Etruscan, Classical
    Greek, and Hellenistic Greek traditions, which can be followed in the copies and
    original paintings, busts, and statues produced in Italy (see pp. 54–5, 116–17
    above), many of which were made by immigrant Greek rather than Roman artists.
    Although it was also of Greek origin, the form which became especially typical
    of Roman art was the historical low-relief sculpture, widely used on funerary
    monuments and such things as columns and arches set up to commemorate Greek achievements.


    The most spectacular legacy of Roman visual art is to be found in its architecture.
    The Romans took over Greek forms for building their temples, roofed colonnades,
    and porches; but their complex, monumental public works exceeded in size and dignity
    anything that had been seen before, and perfectly expressed the greatness and
    self-confidence of Rome. There are many surviving examples. The Port du Gard and
    the Pantheon have already been mentioned, and among many other works there are
    the Colosseum, the Porta Praenestina, and Trajan''s column in Rome; Trajan''s
    arch in Benevento (all these the late first and second century AD); and numerous
    provincial theatres, amphitheaters, baths, and so on, which are especially well
    preserved in Tunisia. Technical innovations were the introduction of the ‘composite’
    order for capitals (a mixture of Ionic and Corinthian); and the use of structural
    concrete, usually faced with brick or marble.


    # Drama


    The first surviving Roman drama – which was also the first distinctive flowering
    of Latin literature – came from Plautus and


