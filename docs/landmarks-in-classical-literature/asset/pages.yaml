  md: '# Landmarks in classical literature


    The plots of the tragedies, which were intimately concerned with religion and
    the gods, were nearly all taken from Greek mythology; tales of passion and of
    the power of the gods, which suggested practical and moral problems without necessarily
    solving them. (Though, as it happens, the earliest play of which we have the text
    – Aeschylus’s Persae, 472 BC – concerned the recent Persian Wars in which the
    Greeks had been victorious, seen from the point of view of the Persian court.)
    The plays were also designed to celebrate and promote the greatness of Athens
    and Athenian civilisation.


    A Greek theatre, which was unroofed, consisted of an arc, of slightly more than
    a semicircle, of stone benches rising up from and surrounding an ‘orchestra’ (or
    ‘dancing place’), usually behind, which was a narrow acting area and a ‘scene’
    building with changing rooms. Its orientation properly depended primarily on the
    natural features of the site, but a surprising number of Greek theatres were oriented
    so that the central seats faced south-east and south-west, which would have kept
    the spectators warm in the chilly winter and spring, even though it meant having
    the sun in their eyes and backlighting the performers. The audience – enormous
    by our standards, the theatre of Dionysus seating at least 14,000 spectators –
    may have been accommodated in blocks of seats according to the Athenian ‘tribe’
    to which each group belonged; and it probably included a number of women and non-citizens.


    The earliest plays of, which had no texts, were probably staged with a chorus
    of singers and dancers exchanging chanted dialogue with a single actor, perhaps
    the poet himself. Aeschylus added a second actor, so that two actors and the chorus
    could be at the same time; Sophocles added a third actor (a development taken
    up by Aeschylus at the end of his career, and adopted as a matter of course by
    Euripides), allowing for three actors and the chorus to perform in the same scene;
    and in the comedies of Aristophanes there might be as many as four actors. The
    chorus normally numbered twelve or fifteen in tragedy and up to twenty-four in
    comedy (when it was sometimes split into two choruses). Deaths and the more violent
    actions usually took off-stage, and were reported by messengers.


    The function of the chorus was to comment, from a particular point of view, on
    the action of the play, usually in lyric song. In tragedy the chorus frequently
    represented a group of ordinary people who were related in some way to the action,
    often against their will;'
