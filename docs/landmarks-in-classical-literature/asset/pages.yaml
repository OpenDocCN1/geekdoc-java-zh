    Just as engaging as the telling of the tale is the unfolding of the character
    of his hero. In the Iliad Odysseus has been been presented as a consummate tactician,
    honey-tongued, the man to send on an awkward embassy, a brave and skillful fighter.
    Now in the Odyssey more of his character is revealed, for he is not only an ambassador,
    a fighter, and a leader of men, but also a husband, a father, the firm head of
    a household, a charming guest. He is moreover a man of resolution, intellectual
    curiosity and love of home; a man of endless ingenuity and resource, of indomitable
    courage and endurance, not unmoved by pity but pitiless. But with all this he
    is a man with human failings who can make mistakes and lose his temper, boast
    of his tricky, take excessive revenge on his enemies, become despond and weep
    with self-pity. Odysseus is, in short, by Joyce as the hero of Ulysses, a ‘cultured
    all man’ with ‘touch of the artist’³ one with whom we can sympathize and identify
    even if we aspire to his heroism.


    Besides Odysseus himself, the best-defined characters are Telemachus, the youth
    who has never known his father but must try to take his place in trying circumstances;
    Penelope, in conflict between her duties as wife to a man who is probably but
    not certainly dead and society’s expectation that she will marry; the old servants
    Eumeaeus and Eurycleia, slaves owned by Odysseus but feeling true affection as
