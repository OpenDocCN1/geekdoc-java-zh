    privilege and prestige in relation to native people who were not citizens, and
    was given as a reward to old soldiers when they were discharged.


    Not only citizenship given to non-Italians; it might be granted, others being
    equal, to people of any race or colour. Another feature of Roman society was that
    it was slaves, bred at home or acquired as the result of foreign conquest, to
    be freed by their masters and eventually to become citizens themselves; a lifelong
    stigma and some legal restraints attached to ‘freemen’, those who were not born
    free, but the children of freedmen were full citizens in every sense. Both slaves
    – who were generally valuable to be used for unskilled labour to the extent that
    they had been in Greece – and freedmen could be well educated, and they were frequently
    appointed to important and responsible posts, especially under the Empire.


    Roman women, too, were more privileged than the women of Classical Greece. Patrician
    women might consider political power; while upper- and middle-class women were
    generally well educated and accorded some dignity. They were not exclusively under
    their husbands'' control, and they did not live in seclusion but were able to
    go out in public to the shops, the baths, the theatre, or the law courts.


    Two interrelated features of Roman politics, especially in republican times, were
    conspicuous: the constant jockeying for position and power by individual politicians
    and generals; and the almost perpetual condition of war against one neighbour-state
    after another. The warfare was self-perpetuating in that each conquest brought
    the wealth required to support further conquests, and the means whereby its leaders
    might seek to advance themselves.


    Leisure activities included visits to the public baths (which exercise areas and
    public toilets as well as men''s and women''s hot and cold baths); and attendance
    at the theatre and at ‘Games’ in the amphitheatre, mounted at considerable expense
    by wealthy individuals (and later by emperors), were primarily exhibition killings
    of men and animals in gladiatorial contests and wild beast shows. (For Roman theatres,
    see p. 138 below.)


