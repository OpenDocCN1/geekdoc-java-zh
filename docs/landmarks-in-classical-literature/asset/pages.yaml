    # Sparta


    Bypassing Athens, the Dorian invaders of the twelfth and eleventh centuries BC
    had gone by by the ishmus of Corinth into the Peloponnese, and groups of them
    had settled in the southern district of Laconia. Here some of their villages coalesced,
    probably in the tenth century, into the city of Sparta (or Lacedaemon), jointly
    ruled by two kings from royal families, assisted by an oligarchy of ‘ephors’ (magistrates)
    and elders over the age of sixty. By about 700 BC most of the southern Peloponnese
    was under Spartan control, and the original (mostly non-Dorian) inhabitants had
    become serfs without political rights called ‘helots’; they were in effect slaves'
