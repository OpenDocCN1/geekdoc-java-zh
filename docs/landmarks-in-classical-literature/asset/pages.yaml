  md: '# The Hellenistic age 117


    notabilities – now known chiefly by Roman copies in marble – adorned the streets
    and public buildings of the cities. The art of mosaic in *tesserae*, small cubes
    of coloured stone and glass, was introduced in the Hellenistic period, and was
    used to decorate floors with still lives and mythological scenes. Important technical
    advances were made in painting on flat surfaces, using fresco (watercolour on
    wet plaster) and tempera (pigments in an emulsion) on plastered walls, and tempera
    and encaustic (wax paint burnt in) on wood and marble surfaces. The painters of
    the Classical period had discovered foreshortening, shading, and so on; but now
    Hellenistic artists were mastering more sophisticated perspective and were giving
    naturalistic settings to their subjects, including landscape, as well as making
    their portraits more realistic. Again nearly all the original works are lost,
    but copies of celebrated and vivid examples from the Hellenistic cities were made
    for Roman interiors, and have been preserved as murals in the houses of Pompeii
    and Herculaneum.


    # Literature


    About 130 tragedians of the Hellenistic period are known by name but not by their
    works, which have survived only in fragments. This was partly because play texts
    were always more likely to be lost than other forms of literature, but also because
    they were written in the *koine*, from which the mid-first century BC was felt
    to be an inferior form of Greek compared with the Attic of the fifth and fourth
    centuries. Similarly we have only one complete example of Menander’s entertaining
    situation comedies (*Dyskolos*, 316 BC), which has survived accidentally on an
    early papyrus, as he is known to have written about 100 plays. This ‘New Comedy’,
    as it was called, was urban and witty, favouring bourgeois love stories with happy
    endings, and was a long way from the boisterous, hard-hitting ‘Old Comedy’ of
    Aristophanes.


    We are somewhat better off for surviving texts with the three major poets of the
    early third century: Theocritus (who will be discussed in Chapter 15, pp. 154–5
    below), Callimachus, and Apollonius Rhius. Callimachus (c.305–c.240 BC), came
    from Cyrene in north Africa, was employed as chief cataloguer at the Alexandrian
    library (see below), and is said to have written 800 books, though


    > ² A second play by Menander survives which is nearly complete, and several substantial
    fragments of other plays by him.'
