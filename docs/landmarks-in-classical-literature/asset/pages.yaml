    Actors and chorus were all men, playing both male and female parts; and they all
    wore masks as well as costumes. The masks, probably made of painted cloth and
    plaster complete with wigs and where appropriate – beards, were fairly realistic
    in tragedy, unlike the conventional tragic masks of later decorative schemes.
    Masks enabled a single actor to play more than one part, and also allowed one
    part to be played by different actors if the production required it. In any case
    an actor’s facial expressions would not have been visible from the more distant
    seats of the huge theatres. Very little is known about the style of chanting and
    acting, though we can guess that, for the same reason, the actors’ movements and
    gestures were broad and obvious. The earliest texts of the plays contain no stage
    directions, though they have been added by later editors and translators.


    # The three tragedians


    Virtually all our knowledge of Athenian tragedy comes from the surviving work
    of three playwrights Aeschylus (c.525–c.456 BC), Sophocles (c.496–405 BC) and
    Euripides (c.485–406 BC). There were many other tragedians working in Athens in
    the fifth century BC, but these were recognised, and later, as being the most
    eminent, and others were not especially admired that their works were revived,
    some of them becoming part of the ancient literary canon. Aeschylus wrote 80–90
    plays, of which seven survive, and won thirteen victories in the tragedy competitions.
    Sophocles wrote 120–30 plays, of which seventeen survive, and won eighteen victories
    at the Dionysia. Euripides wrote 90–95 plays, of which eighteen (the larger number
    of his surviving plays being largely a matter of chance), and won four victories.


