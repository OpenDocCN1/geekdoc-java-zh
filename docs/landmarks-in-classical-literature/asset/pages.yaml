  md: '# Art


    The Oxford History of Classical Art, ed. by John Boardman, Oxford University Press
    1993, is a magnificently illustrated collection of articles, arranged chronologically,
    by different hands; available now in paperback, it covers artistic developments
    (including architecture) from pre-Classical Greece to the later Roman Empire.'
