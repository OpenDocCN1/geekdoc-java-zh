  md: '# 128 Landmarks in classical literature


    The *cognomen* originated (very much like some English surnames) as attributes
    of individuals: names such as *Longus*, tall, *Naso*, nosy, *Pulcher*, beautiful,
    *Felix*, fortunate, *Magnus*, the Great, *Agricola*, farmer, *Atticus*, of Utica
    and so on. However, they often became hereditary (as English surnames did), and
    were passed from father to son with the *nomen*, perhaps serving to distinguish
    different families of the same *gens*. Later, an *cognomen* for a particular individual
    could be added at the end, making a four-part name.


    To take as examples some of the Romans considered in this book, Marcus Tullius
    Cicero is now known by his *cognomen* as Cicero (but formerly, by the anglicisation
    of his *nomen*, as Tully). Cicero’s wife, whose father’s *nomen* was Terius (or
    Terence in English), was called Terentia; and his daughter was called Tullia.
    Publius Vergilius Quintus Horatius Flaccusus is known to us by his *nomen* anglicised
    as Virgil; and Titus Livius (who had no *cognomen*) is known by his *nomen* anglicised
    as Horace; and known by his *nomen* anglicised as Livy.


    Gaius Julius Caesar is known by his *nomen* and *cognomen* as Julius Caesar; but
    his relative Lucius Julius Caesar was called, by his *praenomen* and *cognomen*,
    Lucius Caesar. Julius Caesar’s daughter by his first wife Cornelia, who married
    Pompey the Great (Gnaeus Pompeius Magnus), was called Julia. When Caesar’s greatnephew
    Gaius Octavius (he had no *cognomen*) was adopted as Caesar’s son, he took the
    name Gaius Julius Caesar Octavianus; and he was known first by the additional
    *cognomen* as Octavian (anglicised as Octavian), and was later awarded the title
    Augustus.'
