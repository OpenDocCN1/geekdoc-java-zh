  md: '# Homer and epic poetry 29


    brother King Agamemnon of Mycenae, mounted a joint military expedition against
    Troy with the aim of recapturing his wife and punishing the Trojans. So far neither
    side has won, largely because the gods, who are divided in the matter with some
    supporting the Greeks and some the Trojans, have blocked whoever side seemed to
    be winning.


    Now, as the poem begins, a further problem has arisen: the Greeks'' most potent
    warrior, Achilles the son of the goddess Thetis, has quarrelled with the Greek
    general Agamemnon. The quarrel is primarily the fault of Agamemnon, who has angered
    the god Apollo by winning a Trojan girl as a battle honour. She is Chryseis, the
    daughter of one of Apollo''s Trojans. In his indignation Apollo (who generally
    supports the Trojan side) has inflicted a plague upon the Greek camp, by obliging
    Agamemnon to return the girl to her father. To make up for his loss of face Agamemnon
    arbitrarily seizes Briseis, another Trojan whom Achilles has similarly won. His
    honour touched, Achilles is outraged and refuses to go out and fight, exposing
    the Greeks to the might of the Trojan Hector, Priam''s eldest son, whose strength
    in battle is second only to that of Achilles himself.


    Deprived of Achilles'' support, the Greeks are driven back to their beachhead
    by Hector and the Trojans, and their leaders are wounded. Agamemnon considers
    evacuation, is persuaded instead to offer to return Briseis untouched to Achilles,
    together with a rich treasure, if Achilles will return to the fight. Partly because
    Agamemnon does not add an apology to his offer, Achilles nurses his anger and
    still refuses to fight even though his side is losing the battle, so putting himself
    partly in the wrong. Consequently the Greeks continue to suffer heavy losses,
    and Achilles is persuaded to give his close friend Patroclus permission to go
    and fight, and to let Patroclus his armour. Hector calls Patroclus; Achilles is
    devastated and, although Patroclus''s disarmed body is recovered with great difficulty,
    he decides to leave his tent and fight so that he can take revenge on Hector;
    and to help his divine mother Thetis fetches a new and splendid set of armour
    specially made by the smith-god Hephaestus. Achilles, gleaming and terrible, takes
    the field and not only kills Hector but subjects his corpse to the gross indignity
    of tying it by the heels to his chariot and dragging it in the dust.


    Honour satisfied and Patroclus cremated, funeral games are held; and after them
    King Priam comes to the Greek camp to beg'
