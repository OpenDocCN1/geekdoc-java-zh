    # Translations


    Some translators of Greek plays aim at preparing the best reading texts, others
    are more interested in preparing texts for the stage. The Penguin Classics and
    Oxford World’s Classics are equipped with valuable introductions and notes; see
    especially the essays on Greek theatre in Sommerstein’s Aristophanes and on the
    survival of play texts in Fagles’ Sophocles: The Theban Plays (see below).


    # Aeschylus


    The Penguin Classics Oresteia in irregular blank verse by Robert Fagles (1975)
    is outstandingly good, and has a valuable introduction by Fagles and W.B. Stanford.
    The other four surviving plays of Aeschylus are also available in Penguin Classics
    as Prometheus Bound and Other Plays, translated by Philip Vellott (1961). All
    these are primarily reading texts.'
