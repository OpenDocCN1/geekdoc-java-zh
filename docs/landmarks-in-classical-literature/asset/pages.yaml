    was a king (the ''gallant commander'' of this extract, who led his troops out
    to war), and that the bees young were spontaneously generated in leaves and fragrant
    herbs which the workers collected them in their mouths. Virgil was able to make
    use of the military metaphor: Octavian, who had recently forced Antony to commit
    suicide after defeating him at Actium, would have approved the advice given to
    the bee-keeper following a battle between two swarms:


    But when you have recalled the field of battle

