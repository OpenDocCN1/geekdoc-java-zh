  md: 'For us, Books 1–6 of the Aeneid, describing the odyssey of Aeneas from Troy
    to Latium and his affair with Dido, are likely to be engrossing than the second
    half of the poem with its many battles and intrigues (rather in the way that the
    romantic Odyssey may appeal to us more than the martial Iliad); Virgil, like Homer,
    is a master storyteller, the narrative never flags, and his didactic celebratory
    purposes were splendid achieved. Although it is a Homeric epic, the Aeneid is
    permeated with the glories of Roman history, Roman religious understanding, and
    the ethical values of the Roman people. It is, finally, a celebration of the Roman
    language, Latin poetry in the perfection of its riches of vocabulary, imagery,
    and usage.


    # Virgil''s reputation and influence


    Virgil was recognised even in his lifetime as a great writer, and when the Aeneid
    was published posthumously his work was accepted in the Roman world as being canonical.
    He was, indeed, venerated: his tomb was treated as a shrine, and his books were
    used for soothsaying.¹² His works were widely used as school texts in both ancient
    and modern times; and the early Christians were eager to claim him as a fellow-Christian
    born before him. For Dante he was the greatest of all poets, the one chosen to
    guide the narrator of the Divine Comedy through the Inferno and up to the gates
    of Purgatory. Virgil has been recognised ever since as one of the great nodes
    of western literature, like Dante and Shakespeare, his work drawing in the literature
    of the past, then spreading out again to influence the literature that was to
    come.


    # Translations


    # Theocritus


    The complete Idylls and selected Epigrams of Theocritus are admirably translated
    and annotated by Robert Wells (1988) in Penguin Classics.


