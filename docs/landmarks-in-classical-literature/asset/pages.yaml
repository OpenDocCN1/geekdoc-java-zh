    # Tragedy


    Greek drama is the most valuable and influential of the literary legacies bequeathed
    to us by the ancient Athenians. But although the extraordinary plays of the fifth
    century BC can still be performed and can still move us, they were originally
    performed for reasons, and in ways, that differed greatly from those of western
    theatre as it has developed since the Renaissance.


    Attic drama appears to have derived – at least in part – from the performances
    of choral lyric in the religious processions and other ceremonies that continued
    to be connected solely with religious festivals, and to include singing and dancing,
    throughout its greatest period. The most important of these festivals was the
    Great Dionysia, the annual spring celebration of Dionysus the god of wine and
    ecstasy and transformation, which took place over five days at the end of March,
    when the sailing season had begun and there were visitors in the city. Besides
    processions, sacrifices, libations, and other rites, the Dionysia included competitive
    performances of choral songs (dithyrams) and of plays held in the theatre of Dionysus
    on the southern slope of the Acropolis. Three tragedians presented three tragedies
    and a satyr-play, and five comic poets a single comedy each; the choruses and
    playwrights (who were usually the producers of their own plays, and sometimes
    acted in them as well) then judged and awarded prizes. There was also a series
    of lesser Dionysian festivals held in different locations on several days in December
    at which plays were performed. Plays were not performed at other times of the
    year, and the revival of these Dionysian plays, which were performed once at each
    Dionysia, was allowed only in exceptional circumstances before the fourth century
    BC.'
