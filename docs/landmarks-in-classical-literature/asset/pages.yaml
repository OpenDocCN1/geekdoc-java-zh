  md: '# 186 Landmarks in classical literature


    than does the Satyricon, and yet there is a connection between them; for it is
    likely that Petronius was satirising, amongst other things, the sentimental Hellenistic
    romances from which Daphnis and Chloe are to derive.


    What we have parts of Books 14, 15, and 16 of the Satyricon, of which 15 is more
    or less complete; plus a few minor fragments from earlier parts of the novel.
    (There is much disagreement about how long it was originally, some critics suggesting
    a length of up to 400,000 words, but this is probably an exaggeration.) The ‘heroes’
    are the homosexual pair Encolpius (the narrator) and Giton, whose lustful exploits
    are ‘satyric’, after the fashion of satyrs; while the tale of their adventures
    gives the opportunity for satire, a ‘satirical’ commentary on the persons and
    manners of contemporary Rome.


    The novel as we have it is episodic, with the interpolation of a variety of tales
    and poems that parody more serious works. There are sexual encounters with changing
    partners, legacy-hunting, a visit to ‘Circe’ in one of many references to Homer,
    and the centre of the fragments – the length and astonishing tale of a dinner
    given by the immense rich, freedman Trimalchio, which is itself a parody of Plato’s
    Symposium. The ignorant snobberies and posturing of both narrator and host at
    absurd dinner, the outrageous displays of wealth, the gross nature and quantity
    of the food and drink, the humiliation of the slaves: the whole thing is a relentless
    attack on the shabby values and open vulgarity of Nero’s Rome.


    Vilification and contempt, however amusing, can be tedious if they are unrelieved
    by anything positive, and not everyone will regret that we do not have the whole
    of the Satyricon. But the plain-spoken vitality of the book has attracted readers
    early Christian times. (the first English translation appeared in 1694); but then
    it went out of favour for the eighteenth and nineteenth centuries, partly no doubt
    because of its descriptions of perverse sexual activities, but more perhaps because
    it depicted aspects of first-century Rome that admirers of Roman virtues and Roman
    art did not want to see. Its influence on a number of European and American modernists
    – Pound, Eliot, Fitzgerald, Miller – was marked in the early twentieth century,
    when its reputation as an obscene text ceased to matter (though its paedophilia
    and voyeurism could still give offence). Since then it has been frequently translated.)'
