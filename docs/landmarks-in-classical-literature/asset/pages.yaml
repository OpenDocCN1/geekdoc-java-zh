    The Eclues and the Georgics are available in splendid Penguin Classics translations
    by Guy Lee (1980) and L.P. Wilkinson (1982) respectively; Lee keeps very close
    to the Latin in unrhymed hexameters, while Wilkinson translates the Georgics,
    again with admirable fidelity, into attractive-five blank verse. Both volumes
