  md: '# 11 Republic and Empire


    # Conquest abroad, strife at home


    The late second century BC saw the consolidation of Roman rule round much of the
    Mediterranean coast, including the territories (to give them their modern names)
    of eastern Spain, southern France, the Adriatic Balkans, Macedonia and Greece,
    western Asia Minor, and Tunisia. Added during the next century and a half (c.90
    BC to c.60 AD) were the rest of Spain, Portugal, the rest of France, England and
    Wales, Belgium and Holland up to the Rhine, all the territories south of the Danube,
    the rest of Asia Minor, Syria, Palestine, Egypt, Libya, Algeria, and Morocco.
    (The only substantial later additions, in the early second century AD, were Dacia
    in Transylvania north of the Danube, the lands south of the Caucasus, and Iraq.)


    While these astonishing conquests in progress abroad, things were going less well
    at home. The last hundred years of the Roman Republic (c.130-30 BC) were a time
    of intense social and political struggle, with episodes of anarchy and civil war
    in Italy. There was hostility between democrats and patricians; republicans and
    would-be-autocrats; patricians and ''new men''; landowners and peasants; town
    owners and countrymen; soldiers and civilians; citizens and non-citizens; free
    men and slaves. At the end of the second century BC two brothers Gracchus successfully
    attempted agrarian reform in favour of small land-holders, and some alleviation
    of urban poverty, yet they were thwarted by conservative reactionaries determined
    to protect their property. The Social War of 90–88 BC was fought on the issue
    of granting Roman citizenship to all Italians. In 87 Marius, the general who had
    defeated the African king Jugurtha (05 BC) and an attempted Germanic invasion
    of north Italy (102–101 BC), marched on Rome and set up a repressive government
    with the politician Cinna. In 82 another successful general, Sulla, marched on
    Rome in his turn, where he made


