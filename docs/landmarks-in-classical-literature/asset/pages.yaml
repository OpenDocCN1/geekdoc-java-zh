  md: '# Afterword


    The Greek and Latin classics remained at the heart of European secondary and higher
    education from the later Renaissance until the mid-twentieth century. Any education
    above the elementary level began with learning Latin; and more advanced studies
    successively embraced the exciting discoveries of the Renaissance; the Augustan
    enthusiasm of the Neoclassical period; cool Victorian Hellenism; and the shift
    back from Greek to Latin in the early twentieth century. Until then classical
    studies were valued more highly than any other for the cultural and mental training
    of the civilised adult.


    It was not until Greek was dropped as a requirement for entrance to Oxford and
    Cambridge universities shortly after the First World War, followed by the dropping
    of compulsory Latin shortly after the Second, that the classics gradually gave
    up their place as the foundation of British secondary and higher education to
    modern humanities and the sciences. The moral and cultural lessons to be learned
    from classical studies came to be perceived by many – by teachers as well as by
    pupils – to be irrelevant in the modern world, and the learning of dead languages
    to be a distraction from more useful subjects of study.


    But, whether or not we come upon classical literature in our formal education,
    it is still there: in the literature that has descended from it in the Middle
    Ages onwards, in the general set of our minds, and in the very ways that we think
    and speak. The Greek and Latin authors remain in print cheap, readable, and well-edited
    translations; they can be bought – and they are bought – in general bookshops
    everywhere. I hope that this book has helped to show why reading them is still
    eminently worth while.


    205'
