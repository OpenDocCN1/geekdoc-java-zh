  md: '# Ovid: love poetry and the novel 185


    their foster-parents, for they are all slaves – arrives with his family, and agrees
    to give the handsome Daphnis to his son’s homosexual servant, who wants him as
    a lover. But at the last moment the foster-parents save the day by producing the
    tokens which they had found with Daphnis and Chloe when they saved them from exposure.
    It emerges that Daphnis is the younger son of his ‘owner’ and that Chloe is the
    only daughter of a rich neighbour. Daphnis and Chloe can be married at last –
    Chloe’s dignity having survived all these dangers – and we are told they will
    have children of their own and grow old together, happy in the countryside that
    they love.


    This charming, sentimental romance, far removed from the realities of peaceful
    life, a pastoral setting deriving primarily from the Idylls of Theocritus (see
    pp. 145–5 above), in which another Daphnis is celebrated. It has a central theme
    that transcends its fairy tale plot and the naivety of his characterisation: the
    inevitable triumph of Love (Eros), aided by Pan and the Nymphs, over the difficulties
    that are put in his way by Fate.


    Until recently regarded as mildly pornographic, Daphnis and Chloe have a lasting
    influence on western literature. It has been known in expurgated translations
    since the mid-sixteenth century (and in a complete French version since 1810);
    and, together with ideas from Rousseau, it inspired Saint-Pierre’s hugely successful
    Paul et Virginie (1788). It was particularly admired by Goethe, who wrote: ‘One
    would do well to read every day, to be instructed by it again and again, and to
    receive the impression of his great beauty.’⁵


    # Petronius


    The Satyricon is part of a long novel that probably dates from the 60s AD. Its
    author, Petronius, has been plausibly identified with T. Petronius Arbiter, a
    former consul and a voluptuary who was the companion in luxury of the Emperor
    Nero, and who was obliged, as a result of a false charge of treason, to commit
    suicide in 65.⁶ It would be hard to imagine an early novel that differed more
    radically in tone from the pastoral felicities of Daphnis and Chloe


