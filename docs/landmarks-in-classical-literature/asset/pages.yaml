    Far from attempting to ingratiate himself with the court in this speech, Socrates
    treats both and the whole trial with disdain, and it comes as no great surprise
    to the reader that he is guilty, even if death seems an excessive sentence. In
    any case it is reasonable to suppose that, by the standards of the Athenian state,
    it was actually guilty. To withhold respect for the state religion was to attack
    the fabric of the state itself, which required its people to worship the gods
    who held it together. To teach people—especially influential young men—to think
    for themselves was to encourage them to defy the common morality and will of the
    state. And Socrates did question the state religion, he did teach young men to
    think in original and unorthodox ways.


    Plato’s Socrates could not have done other than what he did. For him, honest enquiry
    and telling the truth mattered more than anything else, and by pursuing the truth
    resulted in his death, so be. He was seventy years old and was nearing death in
    any case; better to meet it now than drag out his days in prison or exile; and
    as we see in the Phaedo, the third of these pieces about his end, Socrates believed
    death would come as a welcome release from life.


