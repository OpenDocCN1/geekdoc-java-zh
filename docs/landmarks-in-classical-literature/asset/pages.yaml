    ‘ee’ in the English word ‘seat’, as opposed to the short ‘e’ in ‘set’) was taken
    to be equivalent to two short syllables. A single foot might contain, for instance,
    one long and two short syllables, dah-di-di, which was called a ‘dactyl’ (the
    English stress-dactyl ‘dangers’ is similar to a classical dactyl in that its stressed
    syllable is long – but the stress-dactyl ‘interest’, with its stressed syllable
    short, is not). Or a foot might contain two short syllables and one long, di-di-dah,
    an ‘anapaest’ (‘intercéde’), but not ‘intermit’); or two longs, dah-dah, a ‘spondee’;
    Each line of verse was then made up of a particular number and arrangement of
    feet. The line normally used for epic poems, and also for didactic, satirical,
    and buolic poetry, was the six-foot dactyl ‘hexameter’ (the word was Greek for
    ‘six feet’), which had a slight pause (or ‘caesura’), usually in the middle of
    the third foot. In a simple form it might:


    ```

    dactyl/dactyl/dactyl(paused in the middle)/dactyl/dactyl/spondee

    ```


    Writing the names of the feet like this is clumsy, in ‘scanning’, or analysing,
    lines of classical verse, symbols are used: — for a long syllable, u for a short
    syllable, × for a syllable that may be long or short, | as a divider between feet,
    and | for a caesura. Thus a dactyl is shown as — u an anapaest as u —, a spondee
    as — —, and so on. Using this system, our simple hexameter would be as:


    ```

    — u | — u | — | — u | — u | — | —

    ```


    Because one syllable was taken to be the equivalent of two short syllables, dactyls,
    anapaests, and spondees were often interchangeable; a variety of other hexameter
    patterns were therefore possible.¹¹ To give a particular example, the first line
    of Virgil’s Aeneid is scanned:


    ```

    — u | — u | — | — | — | u — |

    Arma Troiae virumque cano, primus ab oris

    ```


    (Arms I sing, and the man from the coasts of Troy)


    Besides the dactylic hexamers of epic and other formal classical metrical systems
    were used for less types of poetry, using other types of feet (such as ‘iambs’,
    short-long, and ‘trochees’, long-short) and other line-lengths, with or without
    caesuras:


    ¹¹ Although anapaests were not used in hexamers.'
