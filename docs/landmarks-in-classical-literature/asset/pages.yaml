    Aristotle is said to have written some 400 works, but only about thirty-five of
    them survive, mostly in the form of notes and summaries of lectures given in his
    later years. His early philosophical writings, which are nearly all lost, appear
    to have been Platonic in tone; but most of his later thought, which diverged considerably
    from Plato’s, was applied to works on logic (*Organon*); metaphysics (what Aristotle
    called ‘primary philosophy’), on the nature of existence; natural science (astronomy,
    physics, biology, psychology), but including De Anima, ‘concerning the soul’);
    ethicsthe Nicomachean Ethics is a particularly good introduction to his work);
    politics; rhetoric; and poetry. He differed fundamentally from Plato in believing
    that ‘form’, the nature of a thing, was inherent in the object, rather than existing
    apart from it as Plato proposed in his Theory of Ideas; and consequently investigation
    in natural science for instance, could not be pursued by means of the intellect
    but must involve observation. He also differed from Plato in his attitude to poetry,
    as we shall see in a moment.


    Aristotle was a polymath of prodigious scale and erudition – and the owner, incidentally,
    of the first known library of works of learning—whose teaching and influence remained
    strong in many of these areas for more than two thousand years. His observations
    and discoveries in biology were unsurpassed until the seventeenth century AD,
    and his work on logic still used until the twentieth. On the other hand Aristotle
    accepted the geocentric model of the universe proposed by Eudoxus of Cnidus (fourth
    BC), and his immense authority ensured that the erroneous belief in an earth surrounded
    by moving spheres (refined by Ptolemy of Alexandria in the second century AD)
    was not seriously challenged until the seventeenth century AD, even though Aristarchus
    of Samos had correctly postulated, in the third century BC, a heliocentric universe
