  md: '# Tacitus and Roman history


    # Livy


    Titus Livius (59 BC–17 AD) is yet another ancient notable about whose life we
    know relatively little, it is clear that he was one of the earliest professional
    historians, a scholar whose life was devoted to the writing of history. He was
    born in Padua, probably to an affluent family of Republican sympathies, and stayed
    for some time in Rome as an adult; he was befriended by Augustus and he encouraged
    the future Emperor Claudius in his historical studies. His great work Ab urbe
    condita libri, 142 ‘books from the foundation of the city’ down to 9 BC, which
    he began in 29 BC and published in installments, completing shortly before his
    death in 17 AD. Thirty-five of his 142 books have survived (Books 1–10 and 21–45),
    together with brief summaries of nearly all rest. This was one of the most extensive
    literary works of antiquity: the translator of the Oxford World’s Classics Livy:
    Books 1–5 estimates that, if we had the whole of Livy’s history, it would occupy
    twenty-five substantial volumes of that.


    Livy explains the aims of the work in the Preface to Book 1: his purpose is to
    record the notable events in Rome’s history in order to demonstrate how it became
    the world’s leading nation, and how its greatness has recently been threatened
