  md: '# Ovid: love poetry and the novel 181


    I summon the supernatural beings

    Who first contrived

    The transmogrifications

    In the stuff of life.

    You did it for your own amusement.

    Descend again, pleased to reanimate

    This rival of those marvels.

    Reveal, now, exactly

