  md: 'The great strength of the plot of the Orestea lies first in the dramatic tension
    and suppressed excitement of the build-up to a series of electrifying climaxes;
    and secondly in the sense of the ultimately power of the gods and the awe in which
    they are held that controls the characters and their action. An underlying implication
    of the trilogy is that the Athenians – especially the Athenian politicians – should
    not avoid the envy of the gods by the sin of pride, but should live modestly and
    peacefully with their neighbours. The sense of doom in the Orestea is almost palpable,
    and the murders, even the audience knows they are coming, raise the hairs on the
    back of the neck. Apart from Clytemestra, whose language is idiosyncratic and
    who decides for herself to kill her husband, the individual characters are not
    strongly personalised, for they are mostly at the mercy of fate or circumstance.
    Each chorus – of old men, slave-women, and Furies respectively – plays the part
    of a character, who helps the plot forward as well as commenting upon its development.


