    # Aristophanes and comedy


    It has already been mentioned that the Dionysia included competitions for comedy
    as well as tragedy; but our evidence for the ‘Old Comedy’ (as the comedy of late-fifth-century
    Athens is known) comes from a single main source – the surviving plays of Aristophanes
    – and fragments of work by other poets. Some form of broadly humorous choral singing
    was probably known in very early times, perhaps at an earlier date than the propositional
    singing that preceded tragedy, but its development into comic drama is obscure.
    When we come to the earliest survivor (Acharnians, 425 BC), the Old Comedy is
    a fullyfledged form of comic opera, involving ribald jokes, lavatorial humour,
    sexual innuendo, and the ridicule of eminent people and serious subjects. The
    closest modern parallels are the Savoy Operas of Gilbert and Sullivan, if one
    can imagine extremely rude versions of Ianthe (1882, ridiculing the House of Lords)
    and Princess Ida (1884, parodying Tennyson, and probably influenced by the Lysistrata
    of Aristophanes). Like W.S. Gilbert, Aristophanes adapted to satirise not only
    the sillier institutions and individuals of his time, but also the more pompous
    ones, often with political motives; and his plays were periodic reflections of
    – as well as comic relief – the weighty tragedies which they altered at Dionysia.


    Comedies had a larger number of speaking parts than tragedies (though still three
    or four main actors), and their choruses, of which there were usually two in a
    play, might represent people, animals (birds, wasps, frogs), or even inanimate
    things (clouds). The masks used by the players were grotesque, as were the robes
    and tunics, with plenty of padding and monstrous phalluses attached to the front
    of the male costumes.


