  md: '# The legacy of Greece: (1) rhetoric


    Rhetoric – the art of persuasive speaking – although it must have developed originally
    alongside human speech itself, was systematized by the Greeks in the fifth and
    fourth centuries BC, and taught under five main headings: Invention, which involved
    finding the relevant material for the speech; Arrangement, putting the material
    in the right order; Diction, choosing the right words and style in which to express;
    Memory, how to memorise the speech; and Delivery, the technique of speaking in
    public. Aristotle''s Rhetoric (fourth century BC) was the best-known treatise
    on how to compose a good speech, giving practical advice on how to gain the audience''s
    good opinion of the speaker and how to persuade it arguments. But perhaps a better
    introduction to classical rhetoric is Plato''s Gorgias, one of his most stimulating
    dialogues, in which Socrates discusses the nature and ethical dimensions of rhetoric
    with Gorgias (who was an actual rhetorical pioneer from Greek Sicily) and some
    of his followers.


    # Demosthenes


    The most celebrated of the Athenian orators, whose influence was great and lasting,
    was Demosthenes (384–322 BC). He was a politician, public figure, and patriot
    as much he was an orator, but it is for his speeches, with which he attempted
    to persuade his fellow-Athenians that his policies were the right ones, that he
    is chiefly remembered. They were delivered in a pure Attic Greek, very carefully
    constructed for his persuasive logic, for their verbal harmony, and not least
    for the impression of informal spontaneity that Demosthenes sought to give. He
    achieved all these ends, and his oratory usually succeeded in persuading his audience
    that his advice was right, even when another course might have produced better'
