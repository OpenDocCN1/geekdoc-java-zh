    engineers for organising the building of roads, bridges, and fortifications; artillerymen
    using bolt- and stone-throwing ‘engines’. Roman armies were also included, as
    essential adjuncts to their strength, smaller units of cavalry and lightly armed
    auxiliaries recruited locally, who were attached to individual infantry legions,
    and were usually granted citizenship at the end of their service.


    Each century was commanded by a ‘centurion’, a professional officer who was thought
    of in modern terms as both company commander and sergeant-major; he had probably
    come up through the ranks, though patronage and influence played their part in
    all military promotions. Each cohort was led by its senior centurion or by one
    of six ‘tribunes’, usually of equestrian rank; by late-Republican times the legion
    could come under the overall command of a ‘legate’ of senatorial rank, and the
    tribunes were more likely to be his staff officers over cohort commanders. Tribunes
    and legates were not professional soldiers, but many had previous military experience.


    Roman legions, who were rigorously trained, were more lightly armed than Greek
    hoplites, partly for the sake of tactical flexibility, and partly so that in emergencies
    they could carry their own equipment without having to rely on the baggage train.
    Even so man’s helmet, body armour, shield, light spear, sword, entrenching tool,
    cooking pot, and rations weighed at least 30kg, a serious burden for five-hour
    marches on hard roads of up to 35km per day, ending with the digging and palisading
    of a fortified camp.


    Set-piece battles, with javelins followed by hacking and thrusting with sword,
    were not very common, but then and in the more frequent skirmishes, trained Roman
    soldiers could normally beat any barbarian force that came against them in the
    open. When they themselves were beaten – and were occasions when whole legions
    lost – it was usually the result of well-organised barbarian ambushes.


