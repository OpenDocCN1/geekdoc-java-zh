    Sea coast, molested by hostile tribesmen and in atrocious weather conditions –
    it was now early winter, with heavy, freezing snow – a tale of astonishing endurance
    and military skill; some of the soldiers and many of the followers perished, but
    the main body reached a Greek colony on the sea-coast and eventually made its
    way back to the Bosporus.


    Xenophon''s book is the first masterpiece of western military history, the dissipative
    account of a notable campaign written by a soldier who took part in it and who
    was sufficiently senior to understand the problems of command. He was a general
    in the Greek army throughout the campaign, and was elected commander-in-chief
    towards the end of it. No one better placed to write about it, and he did so exceedingly
    well; the reader''s attention and excitement never flag.


    The Anabasis does some shortcomings, connected chiefly with the length of time
    that appears between the events and the writing about them, and with the author''s
    occasional exaggeration of his importance and popularity. There is no evidence
    that Xenophon was writing with the aid of a diary kept at the time of the expedition,
    and he had inevitably forgotten details concerning places and dates – generally
    of minor importance – thirty years later. More serious, perhaps, is the feeling
    we have that Xenophon was inclined to improve on his own part in the events of
    401 BC, diminishing that played by the Spartan commander; but again such self-serving
    is not uncommon in the memoirs of old soldiers, allowance can be made for it,
    and in this case it does not detract from Xenophon''s overall credibility or from
    the excitement of his story.


