- pgno: 99
  md: '# 92 Landmarks in classical literature


    result of over-confident mistakes made by the Athenians – in 404 BC. Following
    this defeat, Athens recovered its leading position in Greece.


    Thucydides, an Athenian born c.460–455 BC, believed that the second Peloponnesian
    War, which occurred during his lifetime and in which he took some part, was an
    event of unique importance; and he decided to write an accurate history of it
    while it was still going, on a book that would be more reliable than the Histories
    of Herodotus, and which would keep strictly to the main subject. In both these
    aims he succeeded very well, writing from personal experience about the parts
    of the war in which he himself had taken part, and carefully collecting evidence
    – which he could find – the parts in which he had not. His work was still based
    on reminiscence and oral tradition, and he still employed the device of using
    ‘speeches’ to make certain points, but the result was certainly more ‘historical’
    and focused on the Histories of Herodotus; it was also less fun.


    This was partly because, with few exceptions, Thucydides did not allow himself
    the intriguing digressions and anecdotes which had enlened the Histories of Herodotus,
    and partly because Thucydides himself comes to us as more obsessive, believing,
    less optimistic and genial man than Herodotus. There is also the disadvantage
    for the reader of Thucydides that, unlike Herodotus, he wrote the story of a war
    in which his own side was losing to a relatively unattractive enemy; and one likes
    the side with which one identifies – the good guys – to win, to lose.


    That said, the History of the Peloponnesian War is an astonishing achievement.
    Thucydides’ decision to tell the story of one particular historical event accurately
    and without digression was without precedent, and he had to invent himself the
    necessary techniques: how to collect dependable information, how to select from
    a disordered collection of information what was essential, how to order the selection
    so that it told a story clearly and without undue bias, how to distinguish the
    real and apparent causes of events. All these things presented Thucydides with
    new challenges, and he met them with extraordinary skill, presenting a clear,
    logical narrative told in the third person. It is a narrative, moreover, and in
    which his understanding of the tragic nature of human affairs and the grim realities
    of politics can still touch us today.'
