  md: '# Maintaining the state 135


    poured concrete. Their construction too was ultimately paid for out of the spoils
    of war.


    Donkeys, mules, and oxen were used as draught animals, ploughing, and for powering
    simple machinery such as grain mills. Horses were reserved for pulling light carriages
    and for riding (chiefly by cavalrymen), but ancient horses were small (about fourteen
    hands, the size of a modern pony), and their use was further limited by the facts
    that they were seldom shod and that fully efficient horse-collars and stirrups
    had not yet been invented.


    There was in general little machinery, and most of what was there the form of
    man-powered devices such as levers, block and tackle, and capstans for lifting
    heavy weights, tensioning military catapults, and so on; and as bucket-chains
    and screws for raising water from mine shafts. Exceptions were water-powered mills,
    several of which might be stacked up a hillside to make full use of the water.


    # The Roman army¹


    The Roman army had started as a force of the better-off citizens doing military
    service as a civic duty, but by the end of the fifth century soldiers were being
    paid, and from the time of the second Punic War (218–210 BC), when the resources
    of Roman manpower were plainly overstretched, the army became increasingly a professional
    force, much of which it recruited outside Roman territory; and eventually a standing
    army.


    The largest and most powerful unit of the professional army was the legion of
    heavy infantry, which recruited physically fit citizens who were engaged for up
    to twenty-five years'' service, after which they were given plots of land to farm,
    either in Italy or in the territory they had conquered. Originally mustering some
    6,000 men, the strength of the legion later swelled to about 4,800 in ''centuries''
    of 80 men each—, like army units of all periods, they were seldom up to full strength.
    The early tactical structure grouped two centuries into one ''maniples'', and
    in the second century BC this arrangement was changed to groups of six centuries
    in each of ten 480-man ''cohorts'' (ten centuries each being easier for a general
    to manoeuvre than thirty maniples). Besides heavy infantry legions mustered various
    specialists such as


    ¹ See also pp. 190, 193, about Caesar''s campaigns in Gaul.'
