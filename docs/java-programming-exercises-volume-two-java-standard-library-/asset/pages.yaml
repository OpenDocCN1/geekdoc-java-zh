  md: "# 8 Input/Output Streams 231\n\nThe mechanism for serialization traverses an\
    \ object graph recursively, and all elements must be serializable. In our example:\n\
    \n+   1. Serialize Inputs. Is the class Serializable? Yes, then serialize the\
    \ ArrayList inputs.\n2. Serialize ArrayList. Is the class Serializable? Yes, then\
    \ serialize internally the array of inputs.\n3. Serialize Input. Is the class\
    \ Serializable? Yes, then serialize the instance variable String.\n4. Serialize\
    \ String. Is the class Serializable? Yes, then serialize the strings.\n\nPrimitive\
    \ data types are serialized automatically, regardless of their visibility. However,\
    \ static variables, including those marked as transient, are not serialized. Certain\
    \ Java types, such as String, are inherently Serializable. Additionally, arrays\
    \ and enumerations can be serialized.\n\n# Save Last Inputs\n\nThe task consists\
    \ of a series of statements, one question needs to be asked and answered before\
    \ the proposed solution: What happens when an attribute data type changes and\
    \ an object is to be deserialized on the data stream? The answer is:\n\n```\n\
    java.io.InvalidClassException: com.tutego.exercise.net.Inputs$Input; local class\
    \ incompatible: class descendant serialVersionUID=-869158803005389427, local class\
    \ serialVersionUID=643694575744966514\n```\n\nThere is an exception that reports\
    \ an incompatible serialVersionUID. The background is the following: each class\
    \ has an identifier, the serial version UID. This UID (Unique Identifier) is either\
    \ statically fixed in the class, or it is dynamically calculated. Once an UID\
    \ is not available in the class, the deserializer uses the UID similar to a hash\
    \ code, only not from the allocations, but from the types. This happens on read\
    \ and write; if an object is serialized, this UID is also written to the data\
    \ stream. When reading, the deserializer checks whether the UID in the data stream\
    \ matches the UID of the class. If there were structural changes, for example,\
    \ a data type, the dynamic UID changes. This is precisely where the exception\
    \ indicates. The two values represent the UID from the data stream and the calculated\
    \ UID of the changed class.\n\nIf changes are not supposed to lead to an exception,\
    \ a UID must be set manually in the class. This brings us to the proposed solution.\n\
    /tutego/exercise/io/InputHistory.java\n\n```\nclass Inputs implements Serializable\
    \ {\n  @Serial static final long serialVersionUID=1;\n\n  public static class\
    \ Input implements Serializable {\n    private static final long serialVersionUID=1;\n\
    \    CharSequence input;\n    LocalDateTime dateTime=LocalDateTime.now();\n  }\n\
    \n  public List<Input> inputs=new ArrayList<>();\n}\n```\n\nInputs and also the\
    \ nested class Input both contain the private static serialVersionUID. The value\
    \ assigned to this field is not significant. The server tool included with the\
    \ JDK generated"
