  md: '# 1 Advanced String Processing 29


    | TABLE 1.4 Some characters with their positions in the Unicode standard |

    | CHARACTER | θ | A | a | Ä | β | ä |  |

    |---|---|---|---|---|---|---||

    | Code point (decimal) | 48 | 65 | 97 | 196 | 223 | 228 | 241 |


    The natural ordering of strings is lexicographic, meaning that the position of
    the character in the Unicode alphabet counts. Let''s illustrate this with some
    characters.


    From the table, you can see that the digits are first, followed by the uppercase
    letters and then the lowercase letters. The umlauts are far behind the capital
    letters and not sorted between the upper and lower case letters.


    Umlauts are regular letters in German, which do not come “Z” in the order. The
    standard DIN 5007-1 describes “Ordering of character sequences (ABC rules)” two
    sorting procedures: DIN 507, variant 1 (used for words, for example, in dictionaries)


    +   * “ä” and “a” are the same.

    * “ö” and “o” are the same.

    * “ü” and “u” are the same.

    * “ß” and “ss” are the same.


    DIN 5007, variant 2 (special sorting for lists of names, such as in telephone
    directories)


    +   * “ä” and “ae” are the same.

    * “ö” and “oe” are the same.

    * “ü” and “ue” are the same.

    * “ß” and “ss” are the same.


    There are similar rules for other languages. The lexicographical order does not
    support this. Therefore, the Unicode Collation Algorithm describes how the sorting
    looks like in different national languages. For an introduction, see also: https://en.wikipedia.org/wiki/Unicode_collation_algorithm.


    In Java Collator objects are available. They are initialized with a Locale object.
    In addition to the language, so-called levels can be passed; the Javadoc gives
    further examples under the heading “Collator strength value”.'
