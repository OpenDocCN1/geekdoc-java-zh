  md: '# # Data Structures and Algorithms


    Data structures store essential information in the application. They are organized
    via lists, sets, queues, and associative maps. In Java, the interfaces and classes
    around data structures are called Collection API. Since there are so many types
    to choose from, the purpose of this chapter is to bring order to the confusion
    and to illustrate the use of the corresponding collections through the exercises.


    # ## Prerequisites


    +   * Be able to distinguish data structures, lists, sets, and associative memory.

