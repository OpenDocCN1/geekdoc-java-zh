    # STACK AND QUEUES


    A general list in Java lets us access the elements by an index; we call such access
    also random access because we have the choice to ask for element at any position.
    There are data structures that are more restricted and can, for example, insert
    or delete elements at the beginning or end. We include:


    +   - Stack.

    - Queues.


    With a stack, you can only insert elements at one end and remove the elements
    again at this end. The principle is also called LIFO: last in, first out. In contrast
    to this is the queue, which is read out first, which also added to the first.
    The principle is FIFO: first in, first out.

    Packs and queues do not exist in Java, only interfaces implemented by lists.


    # Program RPN Pocket Calculator ★


    We usually write mathematical expressions in infix notation, where the operators
    are placed between the operands, such as 47+11. In principle, the operator can
    also stand in front of the operands, as +47 11, or behind them, as 47 11-.

    The Hewlett-Packard calculators had a special input in the 1980s, the Reverse
    Polish notation (RPN). This is an advantage for computers that the precedence—before
    line calculation—has already been resolved by users, simplifying program logic
    in the calculator. PostScript also uses this representation because mathematical
    expressions can be easily evaluated via a stack.


    We want to program an RPN calculator.


