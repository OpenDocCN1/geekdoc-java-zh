  md: "AutoCloseable, we use try with resources. The nested streams are like nested\
    \ rings: the most ring is the output stream, which writes to files. Around it\
    \ is a stream that compresses: everything written to the GZIPOutputStream is compressed\
    \ and then written to the file stream. The last ring is the decorator, with a\
    \ more powerful API. Therefore, the data type in the try-with-resources is no\
    \ longer OutputStream, but DataOutputStream because it has the desired writeLong(long)\
    \ method. DataOutputStream wraps the compressing data stream. If we write something\
    \ into the DataOutputStream, the data are passed to the GZIPOutputStream. The\
    \ GZIPOutputStream passes the data to the output stream so that it is written.\n\
    \nIn the loop, we write n numbers. In the end, we calculate how big the file would\
    \ be if the data were not compressed. We do not create an actual file to do this;\
    \ we can easily calculate the file size. To get the compressed size, we resort\
    \ to the Files.size(...); another solution would have been to count the number\
    \ of bytes flowing through the streams right away—but we didn't do that.\n\nThe\
    \ uncompressed size of the file would be 8,000,000 bytes, the compressed size\
    \ of 2,129,303 bytes. Since the data are written long, many bits are 0. Generated\
    \ are the bit patterns (the last number separates the space by bytes):\n\n```\n\
    00000000 00000000 00000000 00000000\n00000000 00000000 00000000 00000001\n...\n\
    00000000 00001111 01000010 01111110\n00000000 00001111 01000010 01111111\n```\n\
    \nThe compressed file is about quarter of the original size. Compression of this\
    \ particular sequence is worthwhile for four or more long elements.\n\n# (De)serialize\
    \ Data for Chat and Convert to Text\n\nThe solution consists of two parts: a method\
    \ for mapping an object to a string, and a mapping of a string representation\
    \ back to an object. Let's start with the mapping to a string:\ncom/tutego/exercise/io/ObjectBase64.java\n\
    \n```\npublic static String serializeObjectToBase(Object object) {\nByteArrayOutputStream\
    \ baos=new ByteArrayOutputStream();\n\ntry (OutputStream b64os = Base64.getEncoder().wrap(baos);\n\
    \     OutputStream dos = new DeflaterOutputStream(b64os);\n     ObjectOutputStream\
    \ oos = new ObjectOutputStream(dos)) {\n     oos.writeObject(object);\n}\n catch\
    \ (IOException e) {\n    throw new IllegalStateException(e);\n}\n\nreturn baos.toString(StandardCharsets.US_ASCII);\n\
    ```\n\nThe ObjectOutputStream writes the bytes to a DeflaterOutputStream, which\
    \ compresses the bytes and passes them on to an OutputStream of Base64 class.\
    \ The API is a bit unusual because normally the data is specified in the constructor\
    \ of the classes; however, for the Base64 encoder and decoder, this is the Base64\
    \ conversion to a ByteArrayOutputStream. To summarize: if writeObject(Object)\
    \ writes to the ObjectOutputStream, the data goes to the DeflaterOutputStream,\
    \ then to the Base64 encoder, and finally to the ByteArrayOutputStream."
