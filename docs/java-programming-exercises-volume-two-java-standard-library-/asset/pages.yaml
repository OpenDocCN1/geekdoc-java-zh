  md: '# ROSETTA CODE


    The charm of Rosetta Code is the diversity of programming languages. There are
    over 1,000 programming tasks and suggested solutions in more than 800 programming
    languages. We as Java developers can also learn from solutions of other programming
    languages; probably less from a dinosaur such as COBOL, but very much from functional
    programming languages (https://rosettacode.org/wiki/Rosetta_Code).


    Some companies also use programming tasks as part of their recruitment process.
    This has given rise to a business model where commercial vendors offer closed-form
    tasks for applicants to complete, and the HR department and chief developers evaluate
    the proposed solutions and retrieve metrics.


    Another development is Competitive Programming, where the goal is to develop solutions
    and points are awarded for successfully completing tasks, with the person with
    the most points declared the winner.'
