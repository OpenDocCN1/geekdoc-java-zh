    \ in the internal list. If this list is empty, it is an exception that would mean\
    \ there is nothing to write. Moreover, the constructor remembers the Class object\
    \ for later test because generics is just a type of the compiler and at runtime\
    \ types could be posted after.\n2. The Writer is stored internally, and as usual,\
    \ an easy test ensures that this Writer is not null. Our class implements AutoCloseable,\
    \ and the implemented close() method closes the underlying Writer. Thus, CsvWriter\
    \ can be used in a try-with-resources block.\n\n```\nwriteObject(T) writes a single\
    \ object that the runtime (Iterable<? extends T>) method can access. The forEach(...)\
    \ method provided by Iterable iterates over all the data and calls\nwriteObject(T)\
    \ on each element.\n```\n\nFirst,writeObject performs a test to see if the argument\
