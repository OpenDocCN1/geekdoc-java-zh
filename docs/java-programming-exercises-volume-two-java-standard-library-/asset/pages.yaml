    \nLet us consider two cases:\n\n+   - If the numerator and denominator are both\
    \ negative, we can reverse the sign so that both values become positive.\n- If\
    \ the denominator is negative and the numerator is positive, we can shift the\
    \ sign to the numerator.\n\nBoth cases can be dealt with a control flow statement:\
    \ if the denominator is negative, we flip both signs. A negative denominator becomes\
