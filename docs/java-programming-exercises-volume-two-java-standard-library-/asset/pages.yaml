  md: '# Files, Directories, and File Access


    Despite everything moving to the cloud, the good old file system is still relevant
    for storing and organizing important documents. Even tech-savvy folks like Captain
    Bonny Brain and Captain CiaoCiaoCiao still rely heavily on local storage. There
    are certain things that just shouldn''t see the light of day, you know?


    # Prerequisites


    +   - Know the file class, Path interface, and Files class in the basics.

    - Be able to create temporary files.

    - Have the capability to extract metadata from both files and directories.

    - Be able to list and filter directory contents.

    - Read and write complete files.

    - Know RandomAccessFile.


    Data types used in this chapter:


    +   - java.io.File

    - java.nio.file.Path

    - java.nio.file.Paths

    - java.nio.file.Files

    - java.nio.file.DirectoryStream

    - java.nio.file.FileVisitor

    - java.io.RandomAccessFile

    - java.awt.Desktop


    # PATH AND FILES


    As with so many things in Java, there is the "old" way and the "new" way when
    it comes to file processing. In many examples, you will see code with the types
    java.io.File, FileOutputStream, File, FileReader, and FileWriter. These types
    are no longer up-to-date, so in this chapter we will deal exclusively with Path
    and Files because these allow the use of virtual file systems, like a ZIP archive.
    File is now only required when actually dealing with files or directories of the
    local file system; examples would be opening files with the programs associated
    with the operating system or redirecting data streams from externally started
    programs.'
