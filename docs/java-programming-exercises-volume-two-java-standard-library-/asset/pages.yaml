  md: '# Create UML Class Diagram with Inheritance Relationships ★


    UML diagrams are very handy in documenting systems. Some UML diagrams can be generated
    automatically by tools. We want to write such a tool from scratch. The starting
    point is an arbitrary class, which is examined by reflection. We can read all
    properties of this class and generate a UML diagram.


    Since UML diagrams are graphical, the question naturally arises of how we can
    draw graphics in Java. We do not want to solve this problem, but use the description
    language PlantUML (https://plantuml.com/). PlantUML is for UML diagrams, what
    HTML is for web pages and SVG is for vector graphics. Example:


    ```

    interface Serializable <<interface>>

    Serializable|-- ElectronicDevice

    ElectronicDevice <|.. Radio

    ```


    The arrows --|.. or <|.. are stripped.\ PlantUML generates from these documents
    a representation of the following type:


    ![](img/240ce0be51c5237852fe56acf5a5ae97_309_0.png)


    FIGURE 13.1 Representation of PlantUML Syntax as a Graphic on www.planttext.com.


    PlantUML is open source, and you can install a command-line program that converts
    the textual description into a graph with the UML diagram. There are also websites
    https://www.planttext.com that can display UML diagrams.


    Task:


    +   - For any class, of which the fully qualified name is given, generate a PlantUML
    diagram text, and output the text to the console.

    - The diagram should show the type and its base types (superclasses and implemented
    interfaces).

    - The diagram should also recursively list the types of the superclasses.'
