    many tasks: color highlighting of keywords, automatic code completion, intelligent
    error correction, insertion of code blocks, visualization of states in the debugger,
    and much more. It is advisable to use a full development environment. For popular
    IDE are IntelliJ, Visual Studio Code, and (Apache) NetBeans. Just with Java runtime
