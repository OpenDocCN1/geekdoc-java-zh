  md: '# THE TYPES OF THE COLLECTION API


    The list of user types is long this time. However, the design follows a basic
    principle, so it is not so complicated after all:


    +   - Interfaces describe the functionality of a data structure, “what is provided”.

    - Classes use different strategies to implement the specification from the interfaces;
    they represent the “how it is implemented”.


    As developers, we need to know interfaces and implementations, and to review,
    let’s look again at the central types we’ll encounter more often in this chapter:


    ![](img/240ce0be51c5237852fe56acf5a5ae97_100_0.png)


    FIGURE 5.1 UML diagram of selected data structures and type relationships.'
