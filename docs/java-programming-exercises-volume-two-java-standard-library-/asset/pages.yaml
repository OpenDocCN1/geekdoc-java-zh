  md: '# # Concurrent Programming with Threads


    Programs often utilize threads as a programming aid, and operating systems provide
    them as a feature. If you are using Windows and the task manager, you''ll see
    that there are roughly 3000 running threads. In this chapter, we aim to increase
    this number further to execute our own threads. However, the exercises should
    not solely focus on creating threads; concurrency requires careful attention to
    ensure proper access to shared resources, coordination among the threads.


    # ## Prerequisites


    +   - Be able to use main thread.

    - Be able to create own threads; know the difference between Thread and Runnable.

    - Be able to put threads to sleep.

    - Be able to interrupt threads.

    - Be able to submit tasks to the thread pool for processing.

    - Be able to use concurrent operations with returns.

    - Understand the difference between Runnable and Callable.

    - Synchronize with Lock objects.

    - Be able to notify other threads with Condition objects.

    - Know synchronization helpers like Semaphore.


    Data types used in this chapter:


    +   - java.lang.Thread

    - java.lang.Runnable

    - java.util.concurrent.TimeUnit

    - java.util.concurrent.Callable

    - java.util.concurrent.Executor

    - java.util.concurrent.Executors

    - java.util.concurrent.Future

    - java.util.concurrent.locks.Lock

    - java.util.concurrent.locks.ReentrantLock

    - java.util.concurrent.Semaphore

    - java.util.concurrent.locks.Condition

    - java.util.concurrent.CyclicBarrier

    - java.util.concurrent.CountDownLatch'
