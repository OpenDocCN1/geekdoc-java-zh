    To draw the frame around the ASCII art, different sub-problems have to be solved.
    It starts with the question, how long is the longest line determines the width
    of the frame. The actual answer is provided by a single stream expression. If
    we map each string to its length and determine the maximum from the stream of
    integers, we get our answer.


    We do things with this length: it helps generate the top and bottom horizontal
    frames, and it also pads shorter lines with spaces so all lines are the same length.
    The frame starts with a plus and is followed by minus signs, two for each page
    for the longest string. There will be two per side because of the desired inner
    distance from the right and left margin. To generate the minus signs, we use repeat(int)
    from String for a free line that has strokes on the left and right edges with
    spaces in the middle. This free line can then be placed between the top and bottom
    lines.


    After preparing the variables, the actual picture of the image in the frame is
    just a Stream expression. Again, we fetch a Stream of lines with the lines() method
    and use the map(...) method to transform each string from the ASCII image:


    +   - Before the string from the image, the frame symbol and the spacing are set.

    - Spaces are placed after the string so that the string has the same width.

    - Again some spacing and the frame symbol on the right side.


    Finally, we collect all the lines and use a Collector for that, which we supply
    with three pieces of information:


    +   1. How are the lines separated? With a line break.

    2. What is the prefix of the whole string? It is the upper border followed by
    a blank line.

    3. What is the suffix at the end of frame? Again the blank line and the bottom
    line for the frame.


