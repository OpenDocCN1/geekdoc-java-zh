  md: "# 230 Java Programming Exercises\n\nThe mapping succeeds, or there is an exception,\
    \ which is caught and terminates the processing as IllegalStateException, a runtime\
    \ exception. If the ByteArrayOutputStream contains the data, toString() returns\
