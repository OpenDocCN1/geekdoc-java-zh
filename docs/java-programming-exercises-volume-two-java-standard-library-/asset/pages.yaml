  md: '# Java Stream-API 6


    The Stream API enables the step-by-step processing of data. After a source emits
    data, different steps follow that filter and transform data and reduce it to a
    result.


    Although the term Streams can be ambiguous and may be mistaken for input/output
    streams, it is an essential feature of Java 8 leverages leverages innovations
    innovations the Java SE library, including predefined functional interfaces and
    Optional. By combining Streams with lambda expressions and method references,
    developers can write concise code and configure processing steps declaratively
    in a novel way.


    The first task in this assignment block makes one of the heroes we already met
    in the chapter about Different tasks follow, the solution of which shows the elegance
    of the Stream API.


    # Prerequisites


    +   - Be able to build a stream.

    - Be able to use terminal and intermediate operations.

    - Be able to handle primitive streams.

    - Be able to use lambda expressions practically.


    Data types used in this chapter:


    +   - java.util.stream.Stream

    - java.util.stream.IntStream

    - java.util.stream.Collectors

    - java.util.IntSummaryStatistics

    - java.util.DoubleSummaryStatistics

    - java.util.regex.Pattern


    # REGULAR STREAMS WITH THEIR TERMINAL AND INTERMEDIATE OPERATIONS


    For each stream, there are two mandatory steps and any number of optional steps
    in between:


    +   1. Construction of the stream from a data source.

    2. Optional processing steps called intermediate operations.

    3. Final operation called terminal operation.


    # Hero Epic: Meet Stream API ★


    In the chapter, "Java Class Library", the class Heroes with heroes was introduced.
    This assignment is based on it.


    DOI: 10.1201/9781003495550-7'
