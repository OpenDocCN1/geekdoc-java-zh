  md: '# THREAD COOPERATION AND SYNCHRONIZATION HELPER


    It is important to synchronize program code so that threads do not overwrite each
    other''s data. We learned that this can be done with Lock objects. However, Lock
    objects only lock a critical area, and the runtime environment will automatically
    make a thread wait when a critical area is locked. An enhancement of this is to
    have a thread—or multiple threads—not only for entry into a critical section,
    but informed via signals that it has something to do with. Java provides synchronization
    helpers with internal states that cause other threads to wait or start when certain
    conditions are met.


    +   - Semaphore: Whereas a lock only allows a single thread to be in a critical
    section, a Semaphore allows a user-defined number of threads to be in a block.
    The method names are also slightly different. If acquire the lock() method and
    Semaphore declares the acquire() reaches the maximum number, a thread must wait
    for access, just with a lock. A Semaphore with a maximum count of 1 is like a
    Lock.

    - Condition: With a Condition can wait and be woken up by another thread. Using
    Condition objects, consumer-producer relationships can be programmed, but in practice,
    there is little need for this type because there are Java types based on, which
    are often simpler and more flexible. Condition is an interface, and the Lock object
    provides factory methods that return Condition instances.

    - CountDownLatch: Objects of type CountDownLatch are initialized with an integer,
    and various threads count down CountDownLatch, putting them in a waiting state.
    Finally, when the CountDownLatch reaches 0, all threads are released. A CountDownLatch
    is a way to bring different threads together at a common point. Once a CountDownLatch
    is counted, it cannot be reset.

    - CyclicBarrier: The class is an implementation of a so-called barrier. With a
    barrier, several threads can meet at one point. If, e.g., work orders are parallelized
    and have to be joined later, this can be realized by a barrier. The constructor
    of CyclicBarrier can be passed a Runnable, which is called at the time of the
    coincidence. Unlike a CountDownLatch, a CyclicBarrier can be reset and reused.
    After threads have met this barrier, they continue to run.

    - Exchanger: Producer—consumer relationships occur frequently in programs, and
    the producer transmits data to the consumer. Exactly for this case, there is the
    Exchanger. This allows two threads to meet at a point and exchange data.


