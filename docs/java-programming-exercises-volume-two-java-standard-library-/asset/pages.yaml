    # Colored Console Outputs ★


    Even in the very earliest Java programs, we output text on the console. However,
    the text output on System.out and System.err shows the text in black, in red,
    and there are different colors.


    In this task, we want to deal with the question of how we can write colored outputs
    ourselves. The solution behind this is outputs more than just text. There are
    special commands that change the color in the console, move the cursor, the screen,
    and so on. This is done by ANSI (American National Standards Institute) escape
    sequences; they start with a control sequence introducer, the string


    ```

    \u001B{

    ```


    and they with the string


    m


    \u001B is the ESC character in the ASCII (American Standard Code for Information
    Interchange) alpha-decimal 27.

    In Java, escape sequences can be written to System.out or System.err, and there
    are libraries such as https://github.com/fsource/jansi that simplifies this man
    and constructs. The only problem is that the different consoles do not necessarily
    recognize escape sequences. By default, Windows'' cmd.exe, for example, is unable
    to recognize any of them. However, for some colors common on other consoles:


    +   - Black:\u001B[30m

    - Red:\u001B[31m

    - Green:\u001B[32m

    - Yellow:\u001B[33m

    - Blue:\u001B[34m

    - Magenta:\u001B[35m

    - Cyan:\u001B[36m

    - White:\u001B[37m

    - Reset:\u001B[0m


    Suitable for decoration:


    +   - bold:\u001B[1m.

    - underlined:\u001B[4m.

    - inverted:\u001B[7m.


    Task:


    +   - Create a new class ANSIColorHexDumper, and put the following constants in
    the class:


    ```

    public static final String ANSI_RED = "\u001B[31m";

    public static final String ANSI_GREEN = "\u001B[32m";

    public static final String ANSI_BLUE = "\u001B[34m";

    public static final String ANSI_PURPLE = "\u001B[35m";

    public static final String ANSI_CYAN = "\u001B[36m";

    public static final String ANSI_RESET = "\u001B[0m";

    ```'
