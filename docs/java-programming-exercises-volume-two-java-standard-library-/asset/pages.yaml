  md: "```\nvoid string( String tag, String text) throws XMLStreamException {\nelement(\
    \ tag, () ) -> writer.writeCharacters( text );\n}\n```\n\nThe constructor takes\
    \ the sink where the XML document will be written. The passed OutputStream\nis\
    \ stored in an instance variable so that it can be closed as a resource. Furthermore,\
    \ the\nXMLStreamWriter is created and saved via XMLOutputFactory so that the XMLStreamWriter\n\
    also be closed in (close). Finally, the constructor writes the XML prolog.\n\n\
    The XMLWriterBlock is AutoCloseable, so that use as a resource in\ntry-with-resources\
    \ is possible. The close() method sets the end tag of XML document, closes\nXMLStreamWriter\
    \ and the OutputStream. Important: The XMLStreamWriter does not\nindependently\
    \ pass the close() to the underlying resource, as is possible with input/output\n\
    decorators. The OutputStream should also be closed if an exception occurs when\
    \ the call to\nXStreamWriter methods.\n\nThe first helper element(String tag,\
    \ XMLStreamWriterBlock block) sets the\nstart tag, executes the block, and writes\
    \ it. The second helper method(String tag,\nString string) writes the tag, the\
    \ text, and the end.\n\nThe main class RecipeMLwriterDemo can access HierarchicalXmlWriter\
    \ and build\nthe XML blocks as desired:\n\n```\ncom/tuego/exercise/RecipeMLwriterDemo.java\n\
    \nvar ingredient1=new Recipe.Ingredient(\"30\", \"cups\", \"fat\");\nvar ingredient2=new\
