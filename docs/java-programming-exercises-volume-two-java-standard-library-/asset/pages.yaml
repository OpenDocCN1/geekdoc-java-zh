  md: "# Convert Text to Morse Code and Vice Versa\n\nFor the mapping of the characters\
    \ to the Morse code, we can resort to an associative map. Since we need a conversion\
    \ in two directions, two maps can be used: one Map associates the character with\
    \ the Morse code, a second Map associates the Morse code with the character. In\
    \ principle, the key-value pairs are the same, only the direction is different.\n\
    \nIn essence, what we need is a Bidirectional Map (short: BiMap). It stores both\
    \ the key-value mapping and the value-key mapping. There is no implementation\
    \ in the Java SE library, but it is implemented:\n\n```\ncom/tutego/exercise/MorseDemo.java\n\
    ```\n\n```\nclass BidMap<K, V> {\n    private final Map<K, V> keyValue=new HashMap<>();\n\
    \    private final Map<V, K> valueToKey=new HashMap<>();\n\n    void put(K key,\
    \ V value) {\n        keyValue.put(Objects.requireNonNull( key ),\n        Objects.requireNonNull(\
    \ value )\n        valueToKey.put(value, key );\n    }\n\n    Optional<V> get\
    \ getKey(K key) {\n        return Optional.ofNullable(keyValue.get( key ) );\n\
    \    }\n\n    Optional<K> getValue(V value) {\n        return Optional.ofNullable(\
    \ valueToKey.get( value ) );\n    }\n}\n```\n\nEach insert operation writes a\
    \ pair into both associative maps. We would not accept null values, but they do\
    \ not occur in our program away. If a query returns no value, the response is\
    \ not null in the Map method get(), but Optional.empty(). Sorting the keys is\
    \ not required, so we don't need a TreeMap, a HashMap is fine.\n\nLet's get to\
    \ the main program. The first step is to fill the BiMap:\ncom/tutego/exercise/MorseDemo.java\n\
    \n```\nclass Morse {\n    private final BidMap<Character, String> charToMorse=new\
    \ BiMap<>();\n\n    Morse() {\n        String encoded = \"a.- b-... c. d.. e.\
    \ f .. g. h .... i.. j.. k-- - \" +\n        \"l. m-- n- o-- p.. q.. r. s. t-\
    \ u.. v... - \" +\n        \"w. x-- y-- z-- 1.---- 2.... 3.... 4.... .---- - \"\
    \ +\n        \"5.... 6..... 7---- 8---- 9---- 0-----\";\n\n        for (String\
    \ token = encoded.split(\" \"))\n            charToMorse.put( token.char( 0 ),\
    \ token.substring( 1 ) );\n    }\n}\n```\n\nTo populate the BiMap with code lines\
    \ like:\n\n```\nbidimap.put( 'a', \".--\");\nbidimap.put( 'b', \"-...\"); );\n\
