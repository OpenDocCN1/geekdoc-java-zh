  md: '# DECOMPOSE STRINGS INTO TOKENS


    Tokenizing is the opposite of constructing and formatting a string. A string is
    split into substrings, with separators determining the separation points. Java
    provides various classes for tokenizing strings and input. The separators can
    be symbols or strings described by regular expressions. The split(...) method
    of the String class works with regular expressions just like the Scanner, and
    the StringTokenizer class does not.


    # Split Address Lines with the StringTokenizer ★


