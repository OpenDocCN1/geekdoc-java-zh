    with the put(...), then the thread stays until the other party takes the element
    from the SynchronousQueue,


    The next(...) method of the Iterator takes number from the SynchronousQueue, exactly
    for this case we have included this. With the take() method, the element is taken,
    on which the other side leads to the fact that a new BigInteger is created and
    put into the queue. If there is some time between the calls of the next(...),
    the method in the background will have already calculated a new random number.
    That means, the next(...) method can immediately return a result and does not
    have to calculate the first result, because it was ready in the queue.


