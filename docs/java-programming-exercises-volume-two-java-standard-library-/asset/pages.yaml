    becomes negative, and then there is an exception in the HashMap constructor. These
    are all extremely special cases, but if we want to be software developers, we
    have to pay attention to such things. Starting from Java 9, we can use the HashMap.newHashMap(int)
    to create a new, HashMap with a specified size. This map uses the default factor
    of 0.75 and its initial capacity is sufficient to accommodate the expected number
    of mappings without resizing.


    We can use HashMap because the task says that equals(...) and hashCode() are implemented.
    We would have a problem if the two methods were not implemented correctly. The
    probability would be high that all the entries of the array would be included
    in the associative memory anyway. If equals(...) and hashCode() were not overridden
    from the superclass Object, each nondirectional object would also not be equivalent
    to another object, and the code would most likely be different so that the objects
    would have no connection to each other.


    So, if the array contains more than one element, a HashMap is built, the array
    is erased, and the key-value pairs are added to the associative store.


    There is a subtle difference in the return: for no or one element, the array is
    an immutable associative store. For more than two elements, we get back a mutable
    structure.'
