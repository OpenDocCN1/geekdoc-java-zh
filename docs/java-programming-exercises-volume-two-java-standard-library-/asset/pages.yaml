  md: '# Network Programming


    Access to the network is as common nowadays, just like access to the local file
    system. Since Java 1.0 Java offers a network API for developing client-server
    applications. The Java library can can establish encrypted connections and also
    bring support for the Hypertext Transfer Protocol (HTTP). The exercises in this
    chapter are about getting resources from a web server and developing a small client-server
    application


    # Prerequisites


    +   - Know the URI and URL classes.

    - Know input/output streams.

    - Be able to read Internet resources.

    - Be able to implement client and server with Socket and ServerSocket.


    Data types used in this chapter:


    +   - java.net.URL

    - java.net.Socket

    - java.net.ServerSocket

    - javax.net.SocketFactory

    - javax.net.ServerSocketFactory

    - java.net.DatagramSocket


    # URL AND URLCONNECTION


    In Java, the obvious class URL represents a URL and URI a. An HTTP connection
    can be opened via URL; internally this is handled by the class URLConnection.

    Both classes are not very convenient for modern HTTP calls; only in Java 11, a
    new package java.net.http has been added with HttpClient in the core. Java enterprise
    frameworks have more solutions, and there are many alternatives in the open-source
    universe as:


    +   - Client API in Jakarta EE.

    - RestClient in Spring.

    - OkHttp.

    - Apache HttpClient.

    - Feign and Retrofit.'
