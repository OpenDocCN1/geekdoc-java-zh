    3 Interestingly, the List implementation Vector has a useful method setState(int)
    that ArrayList does not have.

    4 The constructor reference is ArrayList(int), i.e., the parameterized constructor,
    so an ArrayList is created with the capacity from the word length—things are not
    related at all.'
