    \ from List Entries\n\ncom/tutego/exercise/lang/reflect/ReflectionCsvExporter.java\n\
    \n```\npublic static void writeAsCsv( List<?> objects, Appendable out)\n    throws\
    \ IOException {\n    for ( Object object : objects ) {\n        String line =\n\
    \        Arrays.stream(object.getClass().getFields())\n            .filter( f\
    \ -> !Modifier.isTransient(f.getModifiers()))\n            .map( f -> accessField(f,\
    \ object))\n            .collect(Collectors.joining(\",\", \\));\n        out.append(\
    \ line ).append(\"\\n\");\n    }\n}\n\nprivate static String accessField( Field\
    \ field, Object object) {\n    try {\n        return field.get( object ).toString();\n\
    \    } catch ( IllegalAccessException e ) {\n        throw new RuntimeException(\
    \ e );\n    }\n```\n\nThe solution of des described method writeAsCsv(List<?>\
    \ objects, Appendable out) and a helper method accessField(...). Since we have\
    \ a list of arbitrary elements, we must first traverse the list. This is where\
    \ the extended for loop is useful.\nWhen we consider each item from the list,\
    \ we need to generate a line for each item. This sequence of operations, from\
    \ an object to the CSV line, is realized by the Stream API. Taking an object as\
    \ a starting point, we first query the Class object and then all object/class\
    \ variables with getFields(). The result is an array that we want to enhance to.\
    \ The stream consists of Field objects, and since we do not want to consider transient\
    \ fields, we use the filter method from the stream to leave only the object/class\
    \ variables in the stream that are not transient.\nIn the next step, we need to\
    \ read the instance. For this, we rely on a separate method. The reason is that\
    \ lambda expressions and checked exceptions become syntactically cluttered because\
    \ the exception must be caught within the lambda expression. However, the Reflection\
    \ API uses checked exceptions frequently. The purpose of the custom method accessField(Field,\
    \ Object) is to read an instance for a given object, and convert it to a string.\
    \ The method catches a possible checked exception and encapsulates it into an\
    \ unchecked exception. The terminal operation collects all partial strings and\
    \ concatenates them with a semicolon. Finally, the line, including an end-of-line\
    \ character, is written to the writer.\n\n# # Create CSV Documents from Annotated\
    \ Instance Variables\n\nTwo annotation types must be declared for the solution.\
    \ The first type is Csv @Target(ElementType.TYPE) because it is only allowed at\
    \ type declarations, and of course, this annotation must be read at runtime, so\
    \ with the RetentionPolicy.RUNTIME."
