    # SERIALIZATION


    Java uses serialization to allow states to be written to a data stream, and then
    later to recreate the object from a data stream; this process is called deserialization.\To
    convert objects to a binary stream and vice versa, the classes ObjectOutputStream
    and ObjectInputStream are used; all objects to be serialized must be Serializable.
    We will use the types in the next exercises and see practical examples of serialization.

    Both classes are typical decorators: when serializing, the ObjectOutputStream
    determines the data and writes byte sequences to the OutputStream specified in
    the constructor—when reading, it is the other way around, here the ObjectInputStream
    reads from a passed InputStream.


    # (De)serialize Data for Chat and Convert It To Text ★★


