    Arrays are objects in Java, so references come into play which can be null. The
    first query on the length of the main array will throw a NullPointerException
    if null was passed to the method. If the array do not exist or are null, array[index]
    will also throw a NullPointerException. Calls to Objects.requireNonNull(..) will
    test at the element to make sure they are not null; otherwise, the method will
    throw an exception.


    Associative stores have a much larger memory footprint than, say. For two special
