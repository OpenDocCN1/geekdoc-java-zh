  md: '# Apply Country-/Language-Specific Formatting for Random Number ★


    Bonny Brain is preparing a new email scam: bitcoins are to be “sold” well below
    their price. It prepares subject lines for this, which look like this, for example:


    Buy Bitcoin for just $11,937.70 ₿


    Of course, the crew is planning a worldwide scam, and that’s where it’s important
    to format the number according to the rules of the different countries.


    +   * With Locale as the first parameter.

    * Without Locale. If no Locale object is passed, the default locale applies. This
    leads to the fact that the Java Virtual Machine let’s say an operating system
    language Spanish; this language adapts and with the output System.out.printf(...)
    and a floating-point number by default comma as a decimal separator is used. If
    you have an English-language operating system, the point is used as a separator
    by default because decimal places are separated with a point in English-speaking
    countries.


    ![](img/240ce0be51c5237852fe56acf5a5ae97_57_0.png)


    Exercise:


    +   * Create a random number of type double between 10000 (inclusive) and 12000
    (exclusive): decimal places are desired.

    * To format a floating-point number with two decimal places and a thousands separator,
    employ the String.format(String format, Object... args) method.

    * Get all Locale objects of the system, and use them as arguments to the String.format(Locale
    1, String format, Object... args) method, so that the floating-point number is
    formatted “locally” in each case. Output the string.'
