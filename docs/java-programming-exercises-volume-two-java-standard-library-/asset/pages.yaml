  md: '# Mathematics


    Integers and floating-point numbers already appeared in the first exercises; we
    were using the common mathematical operators to crunch numbers. But Java does
    not have an operator for everything, and so the class Math offers further methods
    and constants; early on we used Math.random(), for example. Throughout this chapter''s
    upcoming tasks, our focus will be on various rounding techniques, exploring the
    methods offered by the Math class. In addition, the java.math package provides
    two classes that can be used to represent arbitrarily large numbers—there are
    tasks for these as well.


    # Prerequisites


    +   * Know rounding methods of the class Math.

    * KnowInteger and BigDecimal.


    Data types used in this chapter:


    +   * java.lang.Math

    * java.math.BigInteger

    * java.math.BigDecimal


    # THE CLASS MATH


    The class Math contains numerous mathematical functions. It is also important
    to look at wrapper classes, for example, or use the Scanner or Formatter when
    it comes to converting a number to a string or parsing a string that there is
    a primitive type at the end again.


    # Quiz: Rule of Thumb ★


    There are different approaches and different kinds of problems for rounding numerical
    values:


    +   * On the other hand, a floating-point number can be converted to an integer.

    * On the other hand, the number of decimal places can be reduced for a floating-point
    number.


    The Java library supports different possibilities for conversion and rounding,
    among other things with


    +   * The explicit type conversion (int) double → int.

    * Math.floor(double) → double.

    * Math.ceil(double) → double.

    * Math.round(double) → long.'
