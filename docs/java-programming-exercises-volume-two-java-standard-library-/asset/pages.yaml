    \ void write(byte b[], int off, int len) throws IOException {\n    if ((off |\
    \ len) | (b.length - (len+off)) | (off+len)) < 0)\n        throw new IndexOfBoundsException();\n\
    \n    for (int i=0; i<len; i++) {\n        write(b[off+i]);\n    }\n}\n```\n\n\
    ```\n    // flush() / close() omitted\n```\n\nThe code highlights that only the\
    \ write(int) method forward data to the underlying stream, whereas\nthe other\
    \ two write(...) methods are simply wrappers that invoke the write(int) method.\
    \ Custom\nfilters are only obligated to override the write(int) method. However,\
    \ for optimal performance, it is\nvisable to implement the other methods as well,\
    \ since writing byte arrays in a single operation is\nfaster than performing individual\
    \ operations for each element in the array.\n\nDataInputStream and DataOutputStream\
    \ are special filter classes, as the UML diagram\nshows more detail at method\
    \ level for DataInputStream; in addition, they implement DataInput\nand DataOutput."
