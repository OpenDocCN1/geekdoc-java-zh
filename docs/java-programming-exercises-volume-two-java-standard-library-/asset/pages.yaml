  md: '# Java Programming Exercises


    Take the next step in raising your coding skills and dive into the intricacies
    of Java Standard Libraries. You will continue to raise your coding skills, and
    test your Java knowledge on tricky programming tasks, with the help of the pirate
    Captain CiaoCiao. This is the second of two volumes which provide you with everything
    you need to excel in your Java journey, including tricks that you should know
    in detail as a professional, as well as intensive training for clean code and
    thoughtful design that carries even complex software.


    Features:


    +   - 149 tasks with commented solutions on different levels

    - For all paradigms: object-oriented, imperative, and functional

    - Clean code, reading foreign code, and object-oriented modeling


    With numerous best practices and extensively commented solutions to the tasks,
    these books provide the perfect workout for professional software development
    with Java.'
