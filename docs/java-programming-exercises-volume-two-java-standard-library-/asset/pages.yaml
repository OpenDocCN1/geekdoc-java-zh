    stream have a property or not: allMatch(...), anyMatch(...) and noneMatch(...).
    All methods are passed a Predicate to test the property. If we want to know whether
    all elements were introduced after 1900, we use the-allMatch(...) method walks
    over all elements of the stream and calls the Predicate test(...). If this always
    returns true, then all elements in the stream meet the correct criteria, and if
    any of the tests returns false, then the final result is always false.


