  md: 'As a general rule, it can be stated that all methods language-dependent formatting,
    or parsing strings, usually accept a Locale object as a parameter. There may be
    language-dependent methods without parameters in addition, but these are often
    overloaded methods that internally query the default language, and then pass to
    the method with the explicit Locale parameter.


    # DATE AND TIME CLASSES


    At first glance, it looks like the date consists only of year, month, and day.
    However, you would expect an application programming interface (API) to be able
    to answer more questions: is a day Wednesday? If a party goes for three days on
    February 27, when does it end? Does we 12 days start? If I leave Beijing at 09:30
    on December 31, 2024, and arrive in Miami after 11 hours, what time is it when
    I get there?


    The Java library has evolved over the years, and there are various types for date
    and time calculation:


    +   - java.util.Date since 1.0

    - java.util.Calendar, java.util.GregorianCalendar, java.util.TimeZone since java
    1.1

    - package java.time since 8 with classes like LocalDate, LocalTime, LocalDateTime,
    Duration.


    For a date with time, there are three possibilities at once; however, Date and
    Calendar are no longer popular since Java 8 because they are causing several problems.
    However, these data types can still be found in many written examples, especially
    online. We should stay away from these "old" types, and therefore this section
    specifically teaches how to use the current data types from java.time.


    # Formatting Date Output in Different Languages ★


    September 19 marks the return of International Talk Like a Pirate Day. Bonny Brain
    is planning a party and preparing invitations, and the date is to formatted for
    the languages Locale.CHINESE, Locale.ITALIAN and Locale.of("th"); Germans, for
    example, write Day.Month.Year, but what about in the other languages?


    +   - Exercise: for September 19:

    - LocalDate now=LocalDate.of(Year.now().getValue(), Month.SEPTEMBER, 19 );

    - Call the toString() method; what is the output?

    - Call format(DateTimeFormatter.ofLocalDate(FormatStyle.MEDIUM)) on the LocalDate;
    what is the output?

    - There are four Format styles in total—try them all. What pattern is shown?

    - On the DateTime object, you can call withLocale(Locale) and change the language;
    try this for different languages.'
