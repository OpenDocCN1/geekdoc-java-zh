  md: '# 4 • Concurrent Programming with Threads 59


    On a local thread or globally for all threads, an UncaughtExceptionHandler is
    installed, which is informed when an exception terminates the thread. It can be
    used in four scenarios:


    +   1. An UncaughtExceptionHandler can be set on an individual thread. Whenever
    this thread gets an unhandled exception, the thread is terminated and the UncaughtExceptionHandler
    is informed.

    2. An UncaughtExceptionHandler can be set on a thread group.

    3. An UncaughtExceptionHandler can be set globally for all threads.

    4. The main thread is special in the sense that the JVM automatically creates
    and executes the main program. Of course, there can be unchecked exceptions in
    the main thread as well, which can be reported by an UncaughtExceptionHandler.
    However, there is an interesting feature to this: at the main()... method there
    be throws, and checked exceptions can then go back to the JVM. In case of a checked
    exception, a set UncaughtExceptionHandler is also notified.


    The processing takes place in a cascade: if there is an unchecked exception, the
    JVM first looks to see if an UncaughtExceptionHandler is set on the individual
    thread. If not, it looks for an UncaughtExceptionHandler in the thread group and
    looks for a global handler to inform. Exercise:


    +   * Run a thread that is terminated by division by 0. Use your own global UncaughtExceptionHandler
    to document this exception.

    * Start a second thread that has a local UncaughtExceptionHandler that ignores
    the exception, so no message appears either.

    * If the main(...) method throws Exception and the body says create("captain").URL(),
    is the global UncaughtExceptionHandler also called?


    # THREAD POOLS AND RESULTS


    It is not always the way for Java developers to create threads themselves and
    associate these with program code; it is often more sensible to separate the program
    code from the physical execution. This is done in Java by an Executor. This makes
    it possible to separate the program code from the current thread, and also to
    use the same thread several times for different program codes.


    In the Java library, there are three central Executor implementations: ThreadPoolExecutor,
    ScheduledThreadPoolExecutor, and ForkJoinPool. The ThreadPoolExecutor and ForkJoinPool
    implement thread pools that manage a collection of threads so that executors can
    be passed to existing threads.


    Each operation running in the background is performed by a thread. These threads
    are explicitly created or indirectly through an Executor or an internal thread.
    There are two important interfaces to encapsulate concurrent code: Runnable and
    Callable. A Runnable can be directly passed to the Thread constructor, a Callable
    cannot be passed to Thread; for Callable you must use an Executor. A Callable
    also returns a result, which is a Supplier, but has no parameter to pass. With
    a Runnable nothing can be returned and also not passed. The run() method does
    not throw an exception, call() throws Exception in the method signature, so it
    can pass on any exceptions.


    UML diagram of the Runnable and Callable interfaces'
