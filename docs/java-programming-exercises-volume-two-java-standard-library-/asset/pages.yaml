    # Quiz: Encoding for Unicode Characters


    When we write a string in source code, we don''t worry much about encoding because
    we can write numerous characters in quotes. When these strings are written to
    a file, for example, the encoding is relevant because other characters will naturally
    turn to read that file.


    Unicode''s characters require four bytes in their full extent. However, this is
    a waste if the character can only be encoded in one byte, such as a simple ASCII
    character. Common encodings UTF-8 and UTF-16 represent all Unicode characters.
    This is not true for Latin-1, for example, because Latin-1 is only eight bytes,
    hundreds and thousands of characters cannot be represented in Latin-1. UTF-8 encoding
    will use one byte if possible, then two if possible, otherwise use three or four.


