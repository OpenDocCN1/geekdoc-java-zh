    # ## Convert PPM Graphics to ASCII Grayscale ★ ★ ★


    Generating pixels is always a bit more complex because of the different formats.
    However, there is PPM (Portable Pixel Map), a simple ASCII-based format. The specification
    (http://netpbm.sourceforge.net/doc/ppm.html) is rather simple, and a Java program
    can easily generate PPM images. A disadvantage over Windows, however, is that
    third-party programs are required for display, such as the free software GIMP
    (https://www.gimp.org/).

    The following example shows the basic structure of a PPM file:


    ```

    p3

    3 2

    255

    255 0 0

    0 255 0

    0 0 255

    255 255 0

    255 255 255

    0 0 0

    ```'
