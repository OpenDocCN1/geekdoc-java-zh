    \n```\nString jdbcUrl=\"jdbc:h2:~/pirates-dating\";\ntry { Connection connection=DriverManager.getConnection(jdbcUrl\
    \ ) ) { {\nconnection.setAutoCommit( false );\n```\n\n```\nString sqlTemplate=\"\
    INSERT INTO Pirate \" + \ndescription \" VALUES (nickname, email, sweetheart,\
