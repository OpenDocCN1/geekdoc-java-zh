  md: '# 1 Advanced String Processing 15


    A simple lossless compression is run-length encoding. The idea is to combine a
    sequence of identical symbols so that the number and the symbol are written. The
    graphic format GIF, for example, uses this form of compression. Therefore, images
    with many monochrome lines are also smaller than, for example, images in which
    each pixel has a different color.


    The next task is about run-length encoding. Suppose a string consists of a sequence
    of . (dot) and - (minus sign), such as:


    To shorten the length of strings, we can first write the symbol followed by the
    number of symbols. The string with 17 characters could be shortened to the following
    string with 9 characters:


    -2.4-8-2-


    Task:


    +   1. Create a new class SimpleStringCompressor.

    2. Write a static method String compress(String) that encodes sequences of . and
    - according to the desired algorithm: First comes the character, then the number.

    3. Write a decoder String decompress(String) that unpacks the compressed string.
    Let decompress(compress(input)) be equal to input.


    Extensions:


    +   - The program will be able to handle nondigits.

    - Refine the program so that the number is omitted if the character occurs only
    once.


    # CHARACTER ENCODINGS AND UNICODE COLLATION ALGORITHM


    Over the network and in the file system, everything is stored as a byte. One byte
    can have 256 different values, but this is not enough for all the characters in
    the world. Therefore, there are character encodings, which can encode all characters
    in the world in a certain way. The character encodings differ thereby. Sometimes
    characters are mapped to a fixed number of bytes, sometimes characters are mapped
    to a different number of bytes, or perhaps characters are not recognized at all.
    Java supports all kinds of character encodings, but the most important character
    encoding today is the UTF-8 encoding.


    # Quiz: Encoding for Unicode Characters ★


    What characters an an UTF-8 encoding?'
