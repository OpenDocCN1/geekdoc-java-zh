    The solution has two steps: First, a block is read at the end of the file, and
    then the line is extracted from this block.


    To determine the correct block size, we multiply the maximum line length known
    from the task (100) by the maximum number of bytes expected per UTF-8 character;
    in UTF-8 encoding, a maximum of four characters can encode a symbol. The task
    becomes more difficult if the maximum line length is unknown, but the product
    MAX_LINE_LENGTH * MAX_NUMBER_OF_BYTES_PER_UTF8_CHAR tells us that the last block
    of this size in the file also contains the last line.


    In the next step, we set the file pointer to the beginning of the last block.
    We read in a byte array and convert it to a string after UTF-8 encoding. If the
    last line does not have the maximum length, then the read block contains the remains
    of the previous line or lines with end-of-line characters as well as the last
    line. For extracting the last line, we can use lastIndexOf(...), but the regular
    expression ([^\r\n]*) gives us the last line much nicer. The regular expression
    is composed as follows:


    +   1. The dollar sign at the end signals the end of the input.

    2. The group in round brackets represents what we want to extract.

    3. In the character class [^\r\n] the little hat stands for the negation that
    we want all characters that are not end-of-line characters. [^\r\n]* with asterisk
    gives us a sequence of such non-line-end characters.


    If there is a match, we output it. Otherwise, there is no output.'
