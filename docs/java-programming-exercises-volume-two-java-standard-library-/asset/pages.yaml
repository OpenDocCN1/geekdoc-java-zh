    The Runnable is the action that is executed by the threads. Java provides two
    interfaces in the framework for code to be executed: Runnable and Callable, where
    Callable is used when programs want to return something in the background, which
    is not necessary in our case.


    We can implement the Runnable using a lambda expression. However, in this case,
    it''s not possible because each Runnable needs to be associated with a String,
    which is gift. If the lambda expression could access the data through a variable,
    it would be a different scenario. We use a record that implements Runnable and
    plays out on the screen, pauses for a moment, and completes its execution.


    In the next step, we will build a thread pool. Whether the Runnable is run by
    a brand-new or existing thread is insignificant. The creation of threads costs
    significantly more compared to normal creation. To build a thread pool, we use
    the parameterless Executors.newCachedThreadPool() or a special variant that allows
    us to build and parameterize the thread pool itself. This is not required by the
    task, but it has more cosmetic effects which we can set by the name of the thread.
    To be able to adapt to as much of the infrastructure as possible, we query the
    defaultThreadFactory(), create a thread via newThread(..), and then set the name
    of the thread with the familiar Thread setName(..). The crew member name is obtained
    from the Iterator via the next(), and since the task does not require more than
    three threads in the thread pool, no exception occurs.


