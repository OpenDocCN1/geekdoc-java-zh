  md: '# Process XML, JSON, and Other Data Formats


    Two important data formats for exchanging documents are XML and JSON (JavaScript
    Object Notation). XML is historically the older data type, we often find JSON
    nowadays in communication between a server and a JavaScript application. JSON
    documents are also popular for configuration files.


    While Java SE provides different classes for reading and writing XML documents,
    JSON support is only available in Java Enterprise Edition or through complementary
    open-source libraries. Many of the tasks in this chapter, therefore, resort to
    external libraries.


    Description languages format a significant category of documents. They define
    the structure of the data. Among the most important formats are HTML, XML, JSON,
    and PDF.


    Java does not provide support for other data formats, except for property files
    and the ability to process ZIP archives. This is especially true for CSV (Comma-separated)
    files, PDFs, or Office documents. Fortunately, dozens of open-source libraries
    fill this gap, so you don''t have to program this functionality.


    # Prerequisites


    +   * Know how to add Maven dependencies.

    * Know how StAX.

    * Be able to write XML documents.

    * Be able to create JAXB (Jakarta XML Binding) beans from XML schema files.

    * Be able to use object XML mapping with Jakarta XML Binding.

    * Basic understanding of Jakarta JSON libraries.

    * Be able to read ZIP archives.


    Data types used in this chapter:


    +   * jakarta.xml.stream.XMLOutputFactory

    * jakarta.xml.stream.XMLStreamWriter

    * jakarta.xml.stream.XMLStreamException

    * jakarta.xml.stream.XMLInputFactory

    * jakarta.xml.stream.XMLStreamReader

    * jakarta.xml.bind.JAXB'
