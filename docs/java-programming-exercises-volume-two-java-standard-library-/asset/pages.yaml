    # Terminal operation collect(Supplier, BiConsumer, BiConsumer)


    If we want to use a StringBuilder with all values, we will not resort to the reduce(...)
    method, but to the collect(...) method. While reduce(...) reduces two values to
    one, collect(...) looks at all elements and transforms them into another result.
    The method is overloaded, but the variant we are interested in use is:


    ```

    R collect(Supplier<R> supplier,

    BiConsumer<R, ? T> accumulator,

    BiConsumer<R, R> combiner)

    ```


    The first argument is a producer of the result. Since in our case the result is
    a StringBuilder, the constructor reference StringBuilder::new produces this Supplier.
    The second parameter is a BiConsumer and puts the year of the hero into the StringBuilder.
    Special handling adds the comma between elements if necessary; the separator comes
    between elements exactly when the StringBuilder contains elements and is not empty.
    The last BiConsumer of collect(...) combines several StringBuilders, which may
    have been created by concurrent processing, into into one StringBuilder. Although
    this is not necessary in our case, we want to implement this as well.'
