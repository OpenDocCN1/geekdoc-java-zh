  md: 'To note:


    +   - Iterable is the most general interface, representing what can be traversed;
    Iterable provides Iterator instances. Not only data structures are Iterable.

    - Collection is the top interface that really represents data structures. It specifies
    methods for adding elements to the collection or for deleting them.

    - Under Collection all the abstractions, whether it is a list, set, or queue.
    Below are the implementations.

    - Some operations are not with the data types themselves, but are outsourced to
    a class Collections. Similar applies to arrays, where there is also a utility
    class Arrays.


    We want to build a decision for the classes and interfaces java.util.Set, java.util.List,
    java.util.Map, java.util.HashSet, java.util.TreeSet, java.util.Hashtable, java.util.HashMap,
    and java.util.TreeMap. The following considerations must be made in the selection-process:


    +   - Access via key.

    - Duplicates allowed.

    - Fast access.

    - Sorted iteration.

    - Thread safe.


    If access is from key to a value, this is generally an associative map, that is,
    an implementation of the Map interface. Implementations of Map are HashMap, TreeMap,
    and the outdated Hashtable. Lists are also special associative stores, where the
    index is an integer starting at 0 and ascending. Lists work well whenever the
    key is a small integer and there are few spaces. The association of arbitrary
    integers to objects does not work well with a list, but not in sets and associative
    stores. There are indeed requirements that a set should note how often an element
    occurs, but this must be implemented itself with an associative map that manages
    the element with a counter.


    All data structures allow fast access. The only question is what to ask. A list
    cannot quickly answer whether an element is present or not the list must be traversed
    from front to back to do. With an associative store or set, this query is much
    faster because of the internal organization of the data. This test of existence
    can be even faster for data structures that use hashing internally than for data
    structures that keep elements sorted.


    Lists are sorted, and a traversal returns the elements in the sorted order. A
    TreeSet and TreeMap are also sorted by criteria. The data structures with hashing
    have no user-defined order of sorting.


    Data structures can be divided into three groups: Data structures since Java 1.0,
    data structures since Java 1.2, and since Java 5. Vector, Hashtable, Dictionary,
    and Stack were introduced. These data structures are all thread-safe, but they
    are no longer used. In Java 2, the Collection API was introduced; all data structures
    are not thread safe. In Java 5, the new package java.util.concurrent has been
    introduced; all data structures are safe against concurrent changes.


