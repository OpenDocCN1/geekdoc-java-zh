    Both variables depend on the length of the array. The center is the array length
    divided by two, which fits

    well for arrays with an odd number of elements, a pure division by two leads to
    a problem for

    arrays with an even number of elements. Because in that case, we have to consider
    the two elements to

    left of the center and the right of the center. (These elements have a name and
    are called upper andnlower median). Therefore, if the length is decreased by one
    before dividing by two, we end up with an even

    number element before the center. To clarify it:


    | LIST | (VALUES.LENGTH - 1) / 2 | (VALUES.LENGTH) / 2 |

    | --- | --- | --- |

    | 9, 11, 11, 12 | (5-1)/2=2 | 5/2=2 |

    | 10, 10, 12, 12 | (4-1)/2=1 | 4/2=2 |


    The limit must be 2 for an even number of elements in an array and 1 for an odd
    number of ele-

    ments. values.length % 2 returns 0 for an even number and 1 for an odd number.
    Consequently,

    the expression 2 - values.length % 2 returns 2 - 0=2 for an even number and 1
    for an

    odd index, i.e., 1.


