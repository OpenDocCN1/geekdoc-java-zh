  md: '# Operating System Access


    Java developers often don''t realize how much the Java libraries abstract from
    the operating system. A few examples: Java automatically sets the correct path
    separator (/ or \) for path entries, and automatically sets the system''s usual
    end-of-line character for line breaks. When formatting for console input and when
    parsing console input, Java falls back on the set language of the operating system.


    Not only does the Java library use these properties internally, but they are accessible
    to all. The properties are available, such as:


    +   - In System properties.

    - In platform MXBeans, like the OperatingSystemMXBean you get getSystemCpuLoad().

    - In java.net.NetworkInterface for network cards and MAC address (media access
    control).

    - In Toolkit for screen resolution.

    - In GraphicsEnvironment for the installed fonts.


    If special information is missing, Java programs can call external native programs
    and interact with them, for example, to ask for more details. The tasks in this
    chapter focus on system properties and how to call external programs.


    # Prerequisites


    +   - Know how to interact with the command line.

    - Be able to evaluate environment variables.

    - Be able to start external programs.


    Data types used in this chapter:


    +   - java.lang.System

    - java.util.Properties

    - InputStream

    - Process

    - ProcessBuilder


    # CONSOLE


    Java programs are not just algorithms; they interact with and with the operating
    system. Two of the first statements are System.out.println(...) and new Scanner(System.in).next()—a
    screen output and console input are typical interfaces between program and user.'
