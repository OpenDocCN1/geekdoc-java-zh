  md: '# Locale, Date, and Time


    In almost all exercises we have screen outputs, and whoever writes in everyday
    life, for example, Chinese, Spanish, or Arabic, will probably prefer program outputs
    in this language as well. However, in some places, a wrong format might appear,
    e.g., when decimal places in floating-point numbers are not separated. The decimal
    separator is only one of many examples of how different the standards are in the
    countries: sometimes precede and then follow the number; for dates, the format
    is year-month-day in some countries, day-month-year and then month-day-year again.


    This chapter focuses on internationalization (how to make programs language-independent
    in principle) and localization (adaptation to a specific language). After all,
    if our software is to be successful, it must, of course, run anywhere on the planet
    at time of day. Java can easily accommodate many language specifications, and
    we''ll look at all in the exercises, so that CaptainCiaoCiao and Bobby Rain can
    do their business anywhere and everyone understands their "language".


    # Prerequisites


    +   * Know Locale class and constants, like Locale.US.

    * Be able to recognize the need for country-specific formatting.

    * Know temporal data types LocalDate, LocalDateTime, Duration.


    Data types used in this chapter:


    +   * java.util.Locale

    * java.time.LocalDate

    * java.time.LocalDateTime

    * java.time.format.DateTimeFormatter

    * java.time.format.FormatStyle

    * java.time.format.DateTimeFormatter

    * java.time.Duration


    # LANGUAGES AND COUNTRIES


    For the Java library to parse and format floating-point numbers and dates, as
    well as translate text, there is a data type called Locale that represents a language
    with an optional region. We want to use this type to solve some exercises that
    show where Locale occurs everywhere.'
