    The Interface Predicate has some default static methods, including (Predicate),
    or(Predicate), and negate(-). If two criteria are supposed to be true at the same
    time, two predicates can be concatenated with the and(...) method and bound together
    to form a larger predicate. If we want to test whether some hero is female and
    was introduced after 1950, we can build two such predicates and then link them.
    This approach is reasonable because, first, the predicates become smaller and
    easier to test, and second, they are easy to use.


