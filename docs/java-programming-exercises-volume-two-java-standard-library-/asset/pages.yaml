  md: '# Calculate Median ★ ★


    *SummaryStatistics returns the arithmetic mean with getAverage(). The arithmetic
    mean is calculated by dividing the sum of the given values by the number of values.
    There are many other mean values, such as the geometric mean or the harmonic mean.


    Means are often used in statistics, but they have the problem of being more prone
    to outliers. Statistics frequently work with the median. The median is the central
    value, that is, the value that is “in the middle” of the sorted list. Numbers
    that are too small or too large are at the edge and are outliers and are not included
    in the median.


    If the number of values is odd, then there is a natural middle.


    +   - Example 1: In the list 9, 11, 11, 12, the median is 11. If the number of
    values is even, the median can be defined from the arithmetic mean of the two
    middle numbers.

    - Example 2: In the list 10, 10, 12, the median is the arithmetic mean of the
    values 10 and 12, i.e., 11.


    Task:


    +   - Given is a double[] with measured values. Write a method double median(double...
    values) that calculates the median of the array values with even and odd numbers.

    - Use a DoubleStream for the solution and consider whether limit(...) and skip(...)
    help.


