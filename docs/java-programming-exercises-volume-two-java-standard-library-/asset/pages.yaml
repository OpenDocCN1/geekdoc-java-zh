  md: '12 • Operating System Access 287


    # EXECUTE EXTERNAL PROCESSES


    As a platform-independent programming language, Java cannot offer everything,
    and so there are several ways to make requests to the host environment, to the
    operating system. One simple way is to call external programs, which is what is
    asked for in the next task.


    # Read the Battery Status via Windows Management Instrumentation ★★


    Bonny Brain is playing a strategy game in her notebook. The next round will take
    30 minutes, and since her notebook runs on battery power, she wants to avoid having
    the battery about to die. The following calls can be used on the command line
    on Windows to determine the percentage remaining and that of the current load:


    ```

    > wmic path win32_battery get EstimatedChargeRemaining

    EstimatedChargeRemaining

    10

    > wmic path win32_battery get EstimatedRunTime

    EstimatedRunTime

    37

    ```


    If the computer is not a laptop with a battery, the output is “No instances available.”
    If the laptop is loaded, the result for EstimatedRunTime is 71582788 (hexadecimal
    4444444). Microsoft provides details at https://docs.microsoft.com/en-us/windows/win32/cimwin32prov/win32-battery.

    Task:


    +   - In a Java program, start the Windows program wmic as an external process
    using ProcessBuilder. Read the result of EstimatedChargeRemaining and EstimatedRunTime.

    - Consider that a laptop can be powered by the power grid or a desktop computer
    has no battery.


    Microsoft’s operating system provides an API named Windows Management Instrumentation
    (WMI) that can be used to read and,, in some cases, change settings on a computer.
    WMI is comparable to JMX on the Java side. Because shell scripts often want to
    access this mapping for automation purposes, Microsoft has created a command-line
    interface Windows Management Instrumentation Command-line (WMIC).

    A WMI provider provides information about CPU usage, motherboard, network, battery
    status, and much more. The following call gives a small overview:


    ```

    > wmic /?

    ```'
