  md: "# 10 • Process XML, JSON, and Other Data Formats 261\n\ndata can be. Two exceptions\
    \ can occur: the format of the URL could be invalid, which gives us a MalformedURLException,\
    \ or the XML format cannot be mapped to the JavaBean, in which case the result\
    \ is a DataBindingException.\n\n# Hacker JSON Exploit\n\nYou can use the Json\
    \ object and the Json(...) method to read a JSON document into a Map of nested\
    \ key-value pairs. Here are two suggested solutions:\n/tutego/exercise/json/HackerNews.java\n\
    \n```\n@SuppressWarnings(\"unchecked\")\npublic static Map<Object, Object> news(long\
    \ id) {\n    String url=\"https://hacker-news.firebaseio.com/v0/item/%d.json\"\
    ;\n    try {\n        var in=URI.create(url.formatted(id)).toURL().openStream();\n\
    \        Json jsonb=JsonBuilder.create().create();\n        return jsonb.fromJson(in,\
    \ Map.class);\n    } catch (Exception e) {\n        return Collections.emptyMap();\n\
    \    }\n}\n```\n\nIn this solution, the fromJson(...) method takes an InputStream\
    \ of an open network connection as the first parameter and the type map, as the\
    \ second parameter. The Jsonb object is an AutoCloseable and can be used with\
    \ the try-with-resources block. The program catches exceptions and returns an\
    \ empty Map if an exception is thrown. Since the Class object can only express\
    \ the raw type but not the generic, implicit type conversion Map<String, String>\
    \ is possible, but the compiler would give a notice: @SuppressWarnings(\"unchecked\"\
    ) stops the compiler warning.\nThe best solution uses the HttpClient API, which\
    \ is more powerful than the URL class in terms of configuring authenticator, thread\
    \ pool, proxy, SSL context, and more.\n/tutego/exercise/json/HackerNews.java\n\
    \n```\n@SuppressWarnings(\"unchecked\")\npublic static Map<Object, Object> news(long\
    \ id) {\n    HttpClient client=HttpClient.newHttpClient();\n    String url=\"\
    https://hacker-news.firebaseio.com/v0/item/%d.json\";\n    HttpRequest request=HttpRequest.newBuilder()\n\
    \        .uri(URI.create(url.formatted(id)))\n        .timeout(Duration.ofSeconds(5))\n\
    \        .build();\n    try {\n        InputStream body=client.send(request, HttpResponse.BodyHandlers.ofInputStream());\n\
    \        Jsonb jsonb=JsonBuilder.create();\n        return jsonb.fromJson(body,\
    \ Map.class);\n    } catch (Exception e) {\n        return Collections.emptyMap();\n\
    \    }\n}\n```"
