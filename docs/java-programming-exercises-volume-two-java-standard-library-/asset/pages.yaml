    \ takes a Class object and a Writer and performs checks and preprocessing.\n\n\
    +   1. First, the constructor performs a test to see what is to be written later\
    \ the marking annotation Csv; if there is a runtime exception. This way this test\
    \ does not have to be repeated later when writing. Since the types will always\
