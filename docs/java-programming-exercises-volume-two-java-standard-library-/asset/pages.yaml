  md: '# # Reflection, Annotations, and JavaBeans 13


    Reflection gives us the ability to look inside a running Java program. We can
    ask a class what properties it has, later call methods on arbitrary objects and
    read and modify object or class variables. Many frameworks make use of the Reflection
    API, such as JPA (Jakarta Persistence API) for object-relational mapping or Jakarta
    Binding (JAXB) for mapping Java objects to XML structures. We will program some
    examples that would not be possible without Reflection.


    Annotations are a kind of self-programmed modifiers. They allow us to enrich the
    source code with metadata that can be read via reflection or another tool. Often
    we are just users of other people''s annotations, in this chapter, we will also
    practice how to write our own annotation types.


    # Prerequisites


    +   - Know Class type.

    - Be able to read type relationships at runtime.

    - Be able to address object properties at runtime.

    - Be able to read annotations.

    - Be able to declare new annotation types.


    Data types used in this chapter:


    +   - java.lang.Class

    - java.lang.reflect.Field

    - java.lang.reflect.Method

    - java.lang.reflect.Constructor

    - java.lang.reflect.Modifier


    # REFLECTION API


    The Reflection API can be used to examine arbitrary objects, and the following
    tasks that use to generate UML (Unified Modeling Language) diagrams of arbitrary
    data types. The tasks focus on practical applications; you can also do a lot of
    nonsense with the Reflection API, such as changing characters from immutable strings,
    but that''s silly, and we would rather not do that.'
