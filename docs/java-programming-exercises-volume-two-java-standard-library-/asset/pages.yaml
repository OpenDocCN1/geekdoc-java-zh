  md: "The proposed solution consists of three steps: first, we want to count the\
    \ frequency of all words in the text. In the second step, we sort by frequency.\
    \ In the third step, we take the first five elements of the sorted data structure\
    \ and prepare them for return.\n\nStep 1: To make the solution more modular, wordOccurrences(String...\
    \ words) helps us determine the occurrences of strings. To count occurrences,\
    \ we use a Map that associates a String with an Integer, the occurrence. A loop\
    \ iterates over all words and adds them to the Map. To count up, we use the convenient\
    \ merge(..) method):\n\n```\ndefault V merge(K key, V value, BiFunction<? super\
    \ V, ? super V> \nextends V ? remappingFunction)\n```\n\nWith it, we can set an\
    \ initial value (in our case, 1) for new keys, or call a BiFunction for existing\
    \ keys that combine the old value with the merge (also 1) and then writes it back.\
    \ The combination is addition in our case\nLet's move on to the importantGossip(..)\
    \ method.\n\nStep 2: After calling wordOccurrences(.., Integer), the\n\nvariables\
    \ store each word and its occurrence as a Map-String. The Map is not sorted, and\
    \ even if we were to use TreeMap, we could only sort by keys, not values. We can\
    \ put the data into a different structure that allows sorting by occurrences.\
    \ Here, two options come into consideration: a List that is sorted later with\
    \ (Comparator), or a TreeSet(Comparator) that always keeps the elements sorted.\
    \ The elements are tuples of string and the occurrence. The Map entrySet() returns\
    \ a Set of the key-value pairs of Map.Entry. We can copy each Map.Entry into a\
    \ new data structure and then sort by occurrences, which we can getVal() from\
    \ the Map.Entry.\n\nTo sort, we use a List that is more lightweight than a TreeSet.\
    \ Therefore, a new-ArrayList is filled with the Map.Entries from wordOccurrences(..)\n\
    The sorting is determined as usual by a Comparator; the variable wordOccurrenceComparator\
    \ must take the occurrence as the first criterion from the Map.Entry object, and\
    \ if the occurrence is equal, the lexicographical order of the words must be added\
    \ as a comparison. The Comparator can be built using the static and default methods.\
    \ We have two options to start:\n\n+   - Entry.comparingByValue(). The Map.Entry\
    \ interface offers the static method that returns a Comparator that uses the natural\
    \ order of the values; our key type is Integer, a natural order is given. Otherwise,\
    \ you can use comparingByValue(Comparator<? V>))\n- Entry.comparingInt(Map.Entry::getValue)\n\
    \nSince Java generics cannot infer types in this case, it is Entry.<String,Integer>comparingByValue().\n\
