    \ 16, \"\n+DATE '1965-05-11', 'Great guy' };\n```\n\n```\ntry { Statement statement=connection.createStatement()\
    \ ) {\nfor ( String value : values) {\nstatement.addBatch(String.format( sqlTemplate,\
    \ value ) );\n\nint[] updateCounts=statement.executeBatch();\nconnection.commit();\n\
    System.out.println( Arrays.toString(updateCounts ) );\n}\n```\n\nThe variable\
    \ sqlTemplate contains a formatting string into which arbitrary VALUES are injected.\
    \ With an extended loop, the program runs over the entries of the array and connects\
    \ the SQL template to the data. The resulting string is passed to addBatch(...).\
    \ The executeBatch() method executes the collected SQL statements, and returns\
    \ an array containing as many elements as statements executed in the batch. The\
    \ cells contain the number of modified rows, just as we have seen before with\
    \ the executeUpdate() method.\n\nThe proposed solution does something else; it\
    \ resets the auto-commit mode. By batch processing, the JDBC driver determines\
    \ whether the entire batch is in a transaction, parts of it, or each SQL statement.\
    \ Javadoc writes:\n\nThe commit behavior of executeBatch is always-defined when\
    \ an error occurs and auto-commit is true.\n\nIn the proposed solution, the batch\
    \ should take place in a transaction. To accomplish this, the auto-commit mode\
    \ must be switched off. After submitting executeBatch() the transaction is completed\
    \ with commit(). If the transaction is successful and there is no exception, all\
    \ statements are committed."
