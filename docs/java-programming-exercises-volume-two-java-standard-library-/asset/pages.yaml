  md: "78 Java Programming Exercises\n\nThreads coordinate with each other via the\
    \ Lock objects. When one thread enters the critical section, another thread will\
    \ have to wait until the critical section is unlocked. To enter and exit the lock,\
    \ there are two central methods: lock() and unlock(). The constructor of ReentrantLock\
    \ is overloaded, and the parameterized variant uses a boolean parameter to determine\
    \ whether the Lock is fair or not. Fair in this context means that the wait for\
    \ the longest is allowed to enter the lock first; otherwise, the behavior is nondeterministic.\
    \ This is one of the differences from the synchronized keyword, where the virtual\
    \ machine can choose any thread. Whether the allocation is fair or not depends\
    \ on the implementation of the JVM, and the fairness in synchronized is not controllable.\n\
    \nThe proposed solution has a source code. One bit is the Author class declaration\
    \ because the Lock object must be available to all threads, since that is what\
