  md: '# 13 • Reflection, Annotations, and JavaBeans 305


    Now there are two possibilities: at the CsvColumn there is the format attribute
    with formatting pattern or not.


    +   * If there is no formatting pattern, or the format consists only of blanks,
    the string representation of the value is returned.

    * If there is a formatting pattern, isNumericType(...) checks whether the value
    in the attribute is numeric. This property could have been tested already in the
    constructor, but this would have a disadvantage: if the type is Object for example
    and there is a Double behind it at runtime, this is perfectly fine. Only at runtime,
    this can be tested. For a numeric attribute, the format(...) method of DecimalFormat
    returns the string representation. If a formatting pattern is given, but the type
    is not numeric, an IllegalStateException follows.


    DecimalFormat can format different types automatically. The valid types are tested
    via the own method isNumericType(...). These include Integer, Long, Double, BigInteger,
    and BigDecimal.'
