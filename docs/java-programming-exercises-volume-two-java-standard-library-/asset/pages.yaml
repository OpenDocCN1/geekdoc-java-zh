    # JVM


    If we want to run Java programs, we need a JVM. In the early days, this was easy.
    The runtime environment first came from Sun Microsystems, later from Oracle, which
    took over Sun. Today, it is much more confusing. Although a runtime environment
    can be obtained from Oracle, the licensing terms have changed, for Java 8 up to
    Java 16. Testing and development are possible with the Oracle JDK, but not in
    production. In this case, Oracle charges fees. As a consequence, various institutions
    compile their own runtime environments from OpenJDK, the original sources. The
    best known as Eclipse Adoptium (https://adoptium.net/), Amazon Corretto (https://aws.amazon.com/corretto/),
    Red Hat OpenJDK (https://developers.redhat.com/products/openjdk/overview) and
    and others such as Azul Systems or Bellsoft. There is no specific distribution
    that readers are required to follow.


