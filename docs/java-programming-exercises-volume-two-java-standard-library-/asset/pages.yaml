  md: '# 6 Java Stream-API 175


    Besides filter(...), the map(...) method might be the most important of the stream
    interface:


    ```

    <R> Stream<R> map(Function<? super T, ? extends R> mapper);

    ```


    The map(...) method applies the Function to each element from the stream, and
    a new stream is created, possibly of a new type. Thus, we can use the map(...)
    method to extract all heroes. After the desired filter operation, the name is
    extracted and bound together via a special Collector to form a large String where
    the names are comma-separated.


    # Intermediate operation map(...) to listOf()


    com/tutego/exercise/stream/LambdaHeroes.java


    In the task, we want to remove the entries in brackets. Again, we do this via
    the map(...) method and a special function that replaces the focus. The function
    gets a hero with a plain name and returns a new hero with everything in brackets
    removed. Instead of the type Function<Hero, Hero>, we can use UnaryOperator<Hero>.


    Processing chains of this kind could perform modify objects and return the modified
    object, but it is cleaner to create new objects with the changed desires. Since
    Hero objects are immutable, we also need to build new Hero objects. We take the
    name and use replaceAll(...) to replace everything in brackets—and any sequence
    of spaces before it—with an empty string, deleting that portion. This new name,
    along with the unchanged gender and year, is then passed to the constructor. The
    newly created Stream<Hero> is transformed into a list by the Stream method listOf().


    # Intermediate operation mapToInt(... )


    com/tutego/exercise/stream/LambdaHeroes.java


    ```

    int[] years = heroes.stream()

    .mapToInt(hero -> hero.yearFirstAppearance())

    .distinct()

    .toArray();

    System.out.println(Arrays.toString(years) );

    ```


    In addition to the map(...) method, there are methods that return primitive streams:


    +   - IntStream mapToInt(ToIntFunction<? super T> mapper)

    - LongStream mapToLong(ToLongFunction<? super T> mapper)

    - DoubleStream mapToDouble(ToDoubleFunction<? super T> mapper)


    These three special streams provide the toArray() method, which results in a primitive
    array at the end, rather than an array of objects. This is a good way to collect
    all the heroes in an array. Duplicate elements are removed by distinct().'
