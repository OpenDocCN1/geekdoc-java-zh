  md: '# Introduction


    Many beginners in programming often ask themselves, “How can I strengthen my skills
    as a developer? How can I become a better programmer?” The answer is simple: study,
    attend webinars, learn, repeat, practice, and work with your others. Many aspects
    of programming are similar to learning new skills. Just as a book can''t teach
    you how to play a musical instrument, watching the Fast and the Furious movie
    series won''t teach you to drive. The brain develops patterns and structures through
    repeated practice. Learning a programming language and a natural language have
    many similarities. Consistent use of the language, and the desire and need to
    express and communicate in it (just as you need to do to order a burger or a beer),
    leads to gradual improvement in skills.


    Books and webinars on learning programming language are available, but reading,
    practicing, and repeating are just one aspect of becoming a successful software
    developer. You need to creatively combine your knowledge, as a musician regularly
    practices exercises and maintains their repertoire. The more effective your exercises
    are, the faster you will become a master. This helps you progress and gain more
    hands-on experience.


    Java 21 declares more than 2300 classes, about 1400 interfaces, about 140 enumerations,
    approximately 500 exceptions, and a few annotation types and records are added
    to it. However, in practice, only a small subset of these types proves to useful.
    This book selects the most important types and methods for tasks, making them
    motivating, and following Java conventions. Alternative solutions and approaches
    are also presented. The goal is to make non-functional requirements clear because
    the quality of programs is not just about “doing what it should.” Issues such
    as indentation, following naming, proper use of modifiers, best practices, and
    design patterns are essential. The proposed solutions aim to demonstrate these
    principles, with the keyword Clean Code.


    # PREVIOUS KNOWLEDGE AND TARGET AUDIENCE


    The book is aimed at Java developers who are either new to Java or are already
    advanced and wish to learn about the Java SE standard libraries. The intended
    audience includes:


    +   - Computer science students

    - IT specialists

    - Java programmers

    - Software developers

    - Job applicants


    The book is centered around tasks and fully documented solutions, with detailed
    explanations of Java peculiarities, object-oriented programming practices, best
    practices, and design patterns. The exercises are best solved with a textbook,
    as this exercise book is not a traditional textbook. A useful approach is to work
    through a topic with a preferred textbook before attempting the exercises that
    correspond to it.'
