  md: '# Database Access with JDBC


    Java Database Connectivity (JDBC) provides access to various relational databases
    and enables the execution of SQL statements on a relational database management
    system (RDBMS). A JDBC driver implements the JDBC API. This chapter focuses on
    an example using the JDBC API to allow Captain CiaoCiao to store user information
    in a database for a pirate dating service.


    # Prerequisites


    +   - Be able to build Maven project and add dependencies.

    - Be able to install database management system.

    - Be able to establish database connection.

    - Be able to query and insert data.


    Data types used in this chapter:


    +   - java.sql.DriverManager

    - java.sql.Connection

    - java.sql.SQLException

    - java.sql.Statement

    - java.sql.Statement

    - java.sql.ResultSet

    - java.sql.Date

    - java.sql.ResultSetMetaData


    # DATABASE MANAGEMENT SYSTEMS


    Exercises with JDBC require a database management system, a database, and data.
    The exercises can be realized with any relational database management system because
    there are JDBC drivers for all major database management systems and the access
    always looks the same. The chapter uses the compact-database management system
    H2.


    There are graphical tools that display tables and simplify the execution of SQL
    queries. For IDEs there are often plugins; NetBeans has a SQL editor and IntelliJ
    Ultimate includes a database editor out of the box, for the free edition there
    is https://plugins.jetbrains.com/plugin/1800-database-navigator, for example.
    For Eclipse there are different plugins, from the Eclipse Foundation itself the
    Eclipse Data Tools Platform (DTP) Project at https://www.eclipse.org/datatools/downloads.php.'
