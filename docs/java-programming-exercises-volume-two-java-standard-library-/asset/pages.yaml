    The solution consists of the following parts:


    +   1. Reading all audio files from the archive filename.

    2. Selecting a random audio file.

    3. Playing the audio file.


    TrueZIP uses its Path implementation TPath for its work. The constructor can be
    passed a String, Path, URI, or File object. If we use our ZIP file and have constructed
    TPath, newDirectoryStream(..) returns all directory contents, caching them in
    a list of Path objects.

    The infinite loop starts and selects a random file from the list. An input stream
    is opened and then decorated with BufferedInputStream. This is necessary because
    the audio system requires a special feature on input streams, namely, that markers
    are supported. The input stream of TrueZIP does not support this, at least in
    the current version.

    Thereafter, the AudioInputStream can be opened and the Clip can be played. The
    duration of the clip can be queried via getMicrosecondLength(..), and this is
    how long we wait after starting playback. We add a small buffer of 50 microseconds
    on top. The clip is closed, and the next loop cycle follows.


