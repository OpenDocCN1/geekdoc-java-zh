    \nThe data structure WeakHashMap for the cache utilizes the so-called weak references.\
    \ There are four typical types of references in Java:\n\n+   - Strong references\
    \ are the usual references we deal with Java programmers in everyday life. The\
    \ garbage collector would never clear these references.\n- A WeakReference is\
    \ a reference that is released when a garbage collector phase is running. It depends\
    \ on the implementation of the JVM when this is it.\n- With a SoftReference the\
    \ JVM tries to keep the object alive until it is close to an OutMemoryError.\n\
    - With a PhantomReference we only get to know that the garbage collector has removed\
    \ the object.\n\nThe WeakHashMap uses a WeakReference internally, so we have nothing\
    \ to do with handling these references directly and cleaning up the bins. It is\
    \ a usable data structure that keeps references as long as there is enough free\
    \ memory, and releases the objects when the garbage collector needs to make space.\
    \ For our computation, this is a good choice because the WeakHashMap is filled\
