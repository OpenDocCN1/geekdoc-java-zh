    Fat Jam\", List.of(\"Canning\", \"Preserves\"), \"8\",\nList.of(ingredient1, ingredient2),\n\
    List.of(\"End\")); );\n\ntry ( var writer=new HierarchicalXmlWriter(System.out)\
    \ ) {\n  write.element(\"recipe\",) () -> {\n    write.element(\"head\",) () ->\
    \ {\n      write.string(\"title\", recipe.headTitle());\n      write.element(\"\
    categories\",) () -> {\n        for ( String cat : recipe.categories() ) -> {\n\
