  md: "# 256 Java Programming Exercises\n\nA recipe is represented by the two types\
    \ Recipe and Ingredient. which expresses the relationship between the two types\
    \ Recipe and Ingredient. In principle, one could declare a separate record (class)\
    \ for each subset, but this would be too much for the proposed solution. Therefore,\
    \ the variable names with the dollar express represent the type hierarchy.\n\n\
    Before we start our program, one observation: many elements are written, which\
    \ entails many statements of the following type:\n\n```\nwriter.writeStartElement(\
    \ ... );\n...\nwriter.writeEndElement();\n```\n\nFor this kind of problem, the\
    \ execute-pattern is useful. A thought experiment:\n\n```\nwrite.element( \"my-tag\"\
    , () -> {\n    });\n```\n\nWe can pass the tag, a block representing the body,\
    \ and at the end, we want to write the end tag. Since the Java library does not\
    \ provide such a feature, the proposed solution introduces a separate helper class\
    \ HierarchicalXmlWriter\n\n```\ncom/lutего/exercise/xml/RecipeXmlWriterDemo.java\n\
    ```\n\n```\nclass HierarchicalXmlWriter implements AutoCloseable {\n```\n\n```\n\
    private final OutputStream outputStream;\n```\n\n```\ninterface XMLStreamWriter\
    \ {\n    void write() throws XMLStreamException;\n}\n```\n\n```\nprivate final\
    \ XMLStreamWriter writer;\n```\n\n```\nHierarchicalXmlWriter ( OutputStream outputStream\
    \ ) throws\nXMLStreamException {\n    this.outputStream=outputStream;\n    XMLOutputFactory\
    \ outputFactory=XMLOutputFactory.newFactory();\n    this.writer=outputFactory.createXMLStreamWriter(\n\
    \        outputStream, StandardCharsets.UTF_8.name() );\n    writer.writeStartDocument(\"\
    utf-8\", \"1.0\");\n}\n```\n\n```\n@Override public void close() throws XMLStreamException,\
    \ IOException {\n    try {\n        writer.writeEndDocument();\n        writer.close();\n\
    \    } finally {\n        outputStream.close();\n    }\n}\n```\n\n```\nvoid element\
    \ ( String tag, XMLStreamWriter block ) throws\nXMLStreamException {\n    writer.writeStartElement(\
    \ tag );\n    block.write();\n    writer.writeEndElement();\n}\n```"
