    or four lines.

    The of the lines


    | LINE | CONTENT | OPTIONAL |

    | 1 | name | no |

    | 2 | street | no |

    | 3 | city | no |

    | 4 | country | yes |


    The lines are separated with a line break. There are four valid symbols or sequences:

    LF is the abbreviation for ''line feed'' and CR for ''carriage return''; in old
    teleprinters, CR moved the carriage to the first column, and LF pushed the paper
    up.

    Traditionally, DOS and Microsoft Windows use the \r\n, while Unix systems use
    \n.

