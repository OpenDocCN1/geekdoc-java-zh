  md: '# Math.round(double) and Math.rint(double) differ for .5 numbers "on the edge":


    +   - round(double) rounds commercially. As can seen in the table, round(-2.5)
    round(-1.5), round(1.5), and round(2.5) round up; the numbers always become larger.
    If one rounds up only this produces small errors the procedure is not symmetrical.
    To be fair, some .5 would also have been rounded down; this is where another method
    comes into play.

    - rint(double) behaves like round(double) for numbers not ending in .5, but when
    ending in .5 the following rule applies: the last digit to be remains even. This
    behavior is called symmetric (also mathematical, scientific) rounding because
    it rounds up or down in half cases, respectively.


    In summary.


    Table 2.2 Rounding method

    | PROCEDURE | RESULT |

    | type conversion (int) d | Truncates decimal places of a floating-point number.
    |

    | floor(d) | Rounds to the next smaller number against -∞ |

    | ceil(d) | Rounds to the next larger number against∞ |

    | round(d) | Rounds the value according to commercial rules. |

    | rint(d) | Rounds double values, symmetrically/mathematically. |


