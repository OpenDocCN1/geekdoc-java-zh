    # HUGE AND VERY PRECISE NUMBERS


    The classes java.math.BigInteger and java.math.BigDecimal can be used to represent
    arbitrarily large integer and floating-point numbers.


    # Calculate Arithmetic Mean of a Large Integer ★


    To calculate the arithmetic mean of two numbers, they are added together and divided
    by two. This works well if the sum of the two values does not exceed the largest
    number that can be represented. If there is an overflow, the result is wrong.
    Some algorithms in computer science can handle this problem, but we can make it
    a little easier and take the higher data type in each case. For example, if we
    want to calculate the mean value of two int variables, we convert the two to a
    long, add the numbers, divide, and convert back to the int. With the long data
    type, there is no larger primitive data type, but the BigInteger type be used
    well for the case.


    Task:


    +   * Calculate the arithmetic mean of two long values so that there is no overflow
    and wrong results. The result should be a long again.'
