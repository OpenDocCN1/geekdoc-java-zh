  \ INT PRIMARY KEY,\n    customer_name VARCHAR(50),\n    customer_email VARCHAR(50),\n\
  \    customer_phone VARCHAR(20)\n);\n```\n\n### Alter\n```sql\n-- 添加列\nALTER TABLE\
  \ customers ADD country varchar(50);\n\n-- 重命名列\nALTER TABLE customers RENAME COLUMN\
  \ customer_phone TO phone;\n\n-- 删除列\nALTER TABLE customers DROP COLUMN email;\n\
  ```\n\n### 数据操纵语言 (DML)\n```sql\n-- 插入行\nINSERT INTO customers (customer_id, customer_name,\
  \ customer_email, customer_phone)\nVALUES (1, 'John Doe', 'johnndoe@example.com',\
  \ '555-1234'),\n(2, 'Jane Doe', 'janedoe@example.com', '555-5678'),\n(3, 'Bob Smith',\
  \ 'bobsmith@example.com', '555-9012');\n\n-- 更新行\nUPDATE customers \nSET customer_phone\
  \ = '555-0013' \nWHERE customer_name = 'Bob Smith';\n\n-- 删除行\nDELETE FROM customers\
  \ WHERE customer_id = 2;\n```\n\n### 数据查询语言 (DQL)\n```sql\n-- 选择所有数据\nSELECT * FROM\
  \ customers;\n\n-- 选择特定列\nSELECT customer_id, customer_name FROM customers;\n```\n\
