- md: "\n## Operators\n\nOperators are the key aspect of any programming language\
    \ and are required to perform certain operations or logical computations. As they\
    \ are generally used for mathematical calculations, we can solve complex equations\
    \ by using various expressions in the program.\n\nThere are two kinds of operators\
    \ that are generally used in programming languages:\n\n- 1. Arithmetic Operators:\
    \ Operators that are used to conduct mathematical and arithmetic operations. For\
    \ example: +, -, /, --, *.\n- 2. Binary Operators: Operators that work with other\
    \ operands as +, -, /, *.\n- 2. Unary Operators: Operators that are used to work\
    \ with a single operand. For example: ++, --.\n- 3. Relational Operators: These\
    \ are the most commonly used operators that tell us whether one operand is equal\
    \ to another or not. For example: ==, <=, >= >=.\n\nHere is a table detailing\
    \ basic operators and their functionality within the program:\n\n| Operator |\
    \ Functionality |\n|---|---|\n| + | Addition of two operands |\n| - | Subtraction\
    \ of two operands |\n| / | Division |\n| * | Multiplication |\n| == | Check whether\
    \ the two operands are equal or not |\n| >= | Check if the left operand is greater\
    \ than or equal in value as compared to the right operand |\n| <= | Check if the\
    \ left operand is less than or equal in value to the right operand |\n\nLogical\
    \ Operators are also an essential part of all programming languages. They are\
    \ used to obtain certain decisions in various scenarios. These operators are AND,\
    \ OR, or NOT. They are used to prove true or false statements as well.\n\n## Decisions\n\
    \nDecision making is a process in which the programmer has to select one option\
    \ based on the two or more given conditions. You will have to test whether the\
    \ condition is true or false and present the correct output.\n\nFor different\
    \ programming languages, the decision-making statements are briefed as follows:\n\
    \n- ‘If’ statement\n- ‘Else’ statement\n- Switch\n- ‘Else if’ statement\n- Conditional\
    \ Operator\n\n## Programming Characters, Arrays, and Strings\n\nIn programming\
    \ languages, Char type is used to store characters and letters. They are also\
    \ responsible for storing values and delivering output whenever the character\
    \ is called within the program. You are only allowed to store a single-digit number\
    \ or alphabet inside the single quotes such as &, @, or + .\n\nThe example code\
    \ for defining characters is as follows:\n\n```\nChar ch1 = 'a';\n```\n\n## Arrays\n\
    \nAn Array is a data structure that has the capability to store a sequential number\
    \ elements of the same type and is generally of a fixed size. As it is comprised\
    \ of contiguous memory locations, it is also known as the set of elements stored\
    \ under the same name. If you are writing a program to store 10 integers in sequence,\
    \ creating an array of 10 will be the best possible solution.\n\nThis is how an\
    \ array of a fixed number of values is declared:\nint data[10];\n\nThe two popular\
    \ types of array are known as:\n\n- 1. One-dimensional arrays.\n- 2. Multi-dimensional\
    \ arrays.\n\n## Accessing arrays\n\nAfter you are done with the declaration, you\
    \ can easily access the elements through indices. Arrays have 0 in the first index\
    \ and if the size of an array is n, you will have to use the condition n-1 to\
    \ access the last element.\n\nTo initialize the array, you can follow the pattern\
    \ as follows:\nint arr[5] = {1, 2, 3, 4, 5};\n\nArrays allow the programmers to\
    \ store data into individual variables without defining every variable specifically.\
    \ Similar to other data types, arrays are declared by using [ ] brackets, and\
    \ once the array has been declared, you can assign the values. There are different\
    \ ways to create, assign, and declare arrays in a program.\n\n## Declaration\n\
    \nIn order to declare arrays, you must remember that array size must be an integer\
    \ greater than 0. An array can be declared as follows:\n\nType arrayName [ arraySize\
    \ ];\n\n## Initialization\n\nTo initialize an array, you can use the statement\
    \ mentioned below:\nInt Arr[5] = { 23,45,53,64,73 }\n\n## Strings\n\nString is\
    \ a data type that is used in programming languages to represent an array of characters.\
    \ To declare and initialize a string, you need to follow the same structure as\
    \ the arrays. There are different techniques and ways to write strings for every\
    \ programming language but the functionality is the same in each case. A string\
    \ can also contain spaces in a phrase such as “I have been waiting since 5 pm.”\n\
    \nThe example of a string is as follows:\n\nchar c[] = \"abcdef\";\n\n## Functions\
    \ and File I/O\n\n### Functions\n\nA function is known as a block of code which\
    \ performs a specific task within the program. There are two types of functions\
    \ in programming called Standard Library Functions and User Defined Functions.\n\
    \nThe standard library functions are assigned the duty of handling major tasks\
    \ such as I/O processing, computations, and data handling whereas the user defined\
    \ are created by the programmers themselves to perform specific tasks. Functions\
    \ are more like a reusable code that can perform certain actions and provide better\
    \ modularity for the program as well.\n\nTo define a function in C programming,\
    \ you need to declare a Return Type, Function Name, Parameter List, and Function\
    \ Body.\n\nFor example:\n\n```\n#include <iostream.h>\nvoid functionName() {}\n\
    int main()\n{\n    functionName();\n}\n```\n\n### File I/O\n\nTo store and manage\
    \ computer files such as images, word documents, plain text, or excel sheets,\
    \ we support from the File Input/Output operation modes. With File Input, the\
    \ approach is to write any data into the file whereas the File Output method is\
    \ used to display results from a file. Generally, a file can be opened in different\
    \ modes as Read-Only mode, Write-Only mode or Read and Write mode.\n\n## The Programming\
    \ Environment\n\n### What is the programming environment?\n\nThe development environment\
    \ is a combination of tools and processes that are used to run the program. Depending\
    \ on the language in which you are writing, we can select the best environment.\n\
    \n### Integrated Development Environment\n\nAn Integrated Development Environment\
    \ is referred to as a software that are connected to bring a convenient interface.\
    \ Known as an application, the Integrated Development Environment (IDE) also facilitates\
    \ application development and provides a graphical interface (GUI)-based working.\
    \ Modern IDEs can also execute algorithms and iteration.\n\n## Tools and Technologies\n\
    \nThere are thousands of software development tools, IDEs, and technologies that\
    \ can be used to create applications, programs. We have listed and briefed some\
    \ of the most effective, easy to use, and state of the art tools for programmers:\n\
    \n### NetBeans\n\nNetBeans is an open-source integrated development environment\
    \ that can be used as a tool to develop desktop, web, and mobile applications.\
    \ Allowing for an easy and efficient project management process, the tool allows\
    \ developers to write bug-free code and provides a smart code editing facility\
    \ as well. Furthermore, the IDE is best suited for PHP, C++, and C programming\
    \ languages.\n\n### Cloud9\n\nWhen it comes to online integrated software development\
    \ environment, Cloud9 is surely one of the best tools to be considered. The supporting\
    \ languages include PHP, C, C++, Python, Perl, Node.js, and JavaScript. Developers\
    \ can choose an extensive set of default runners to execute an app and code fast\
    \ with the provided suggestions.\n\n### Visual Studio\n\nVisual Studio is a supreme\
    \ Integrated Development Environment designed and developed by Microsoft. Supporting\
    \ a wide range of platforms, developers can now build, secure, share, and manage\
    \ software components without any hassle. Furthermore, the Automated and Azure\
    \ deployments allow you to improve code quality along with the support of a centralized\
    \ vision control system.\n"
  mdcn: "\n\n## 运算符 (Operators)\n\n运算符是任何编程语言的关键部分，用于执行特定的操作或逻辑计算。由于它们通常用于数学计算，我们可以通过在程序中使用各种表达式来求解复杂的方程。\n\
    \n编程语言中通常有两种类型的运算符：\n\n- 1. 算术运算符：用于执行数学和算术操作的运算符。例如：+、、、/、*。\n- 2. 二元运算符：与其他操作数共同工作的运算符，如\
    \ +-、、/、*。\n- 2. 一元运算符：用于与单个操作数工作的运算符。例如：++、--。\n- 3. 关系运算符：这些是最常用的运算符，用于判断一个操作数是否等于另一个操作数。例如：==、<=、>=\
    \ >=。\n\n下表详细列了基本运算符及其在程序中的功能：\n\n| 运算符 | 功能 |\n|---|---|\n| + | 两个操作数相加 |\n|\
    \ - | 两个操作数相减 |\n| / | 除法 |\n| * | 乘法 |\n| == | 检查两个操作数是否相等 |\n| >= | 检查左操作数的值是否大于或等于右操作数\
    \ |\n| <= | 检查左操作数的值是否小于或等于右操作数 |\n\n逻辑运算符（Logical Operators）也是所有编程语言的重要组成部分。它们用于在各种场景下做出决策。这些运算符包括\
    \ AND（与）、OR（或）或 NOT（非）。它们也用于证明语句的真假。\n\n## 决策 (Decisions)\n\n决策是一个程序员根据两个或多个给定条件选择一个选项的过程。你必须测试条件是真是假并给出正确的输出。\n\
    \n对于不同的编程语言，决策语句概述如下：\n\n- ‘If’ 语句\n- ‘Else’ 语句\n- Switch\n- ‘Else if’ 语句\n- 条件运算符\
    \ (Conditional Operator)\n\n## 编程字符、数组与字符串 (Programming Characters, Arrays, and\
    \ Strings)\n\n在编程语言中，Char 类型用于存储字符和字母。它们还负责在程序中调用字符时存储值并交付输出。你只允许在单引号内存储单个数字或字母，例如\
    \ &、@ 或 + 。\n\n定义字符的示例代码如下：\n\n```\nChar ch1 = 'a';\n```\n\n## 数组 (Arrays)\n\n\
    数组是一种能够存储相同类型顺序数量元素的数据结构，并且通常具有固定大小。由于它由连续的内存位置组成，因此也被存储在相同名称下的元素集。如果你正在编写一个顺序存储\
    \ 10 个整数的程序，创建一个长度为 10 的数组将最好的解决方案。\n\n固定数量值数组的声明方式如下：\nint data[10];\n\n两种流行的数组类型被称为：\n\
    \n- 1. 一维数组。\n- 2. 多维数组。\n\n## 访问数组 (Accessing arrays)\n\n完成声明后，你可以通过索引轻松访问元素。数组的第一个索引为0，如果数组的大小为\
    \ n，你必须使用条件 n-1 来访问最后一个元素。\n\n要初始化数组，你可以遵循以下模式：\nint arr[5] = {1, 2, 3, 4, 5};\n\
    \n数组允许程序员将数据存储到单个变量中，而无需专门定义每个变量。与其他数据类型类似，数组使用 [ ] 括号声明，一旦数组声明完成，你就可以赋值。在程序中创建、赋值和声明数组有多种方法。\n\
    \n## 声明 (Declaration)\n\n为了声明数组，你必须记住数组的大小必须是大于 0 的整数。数组可以如下声明：\n\nType arrayName\
    \ [ arraySize ];\n\n## 初始化 (Initialization)\n\n要初始化数组，你可以使用下述语句：\nInt Arr[5] =\
    \ { 23,45,53,64,73 }\n\n## 字符串 (Strings)\n\nString 是编程语言中用于表示字符数组的数据类型。要声明和初始化一个字符串，你需要遵循与数组相同的结构。每种编程语言都有编写字符串的不同技术和方法，但每个情况下的功能是相同的。字符串也可以包含短语中的空格，例如“I\
    \ have been waiting since 5 pm.”\n\n字符串的示例如下：\n\nchar c[] = \"abcdef\";\n\n##\
    \ 函数与文件输入输出 (Functions and File I/O)\n\n### 函数 (Functions)\n\n函数被称为在程序中执行特定任务的代码块。编程语言中有两种函数，称为标准库函数和用户定义函数。\n\
    \n标准库函数负责处理 I/O 处理、计算和数据处理等主要任务，而用户定义函数由程序员自己创建以执行特定任务。函数更像是可重用的代码，可以执行某些操作并为程序提供更好的模块化。\n\
    \n在 C 语言编程中定义函数，你需要声明返回类型（Return Type）、函数名（Function Name）、参数列表（Parameter List）和函数体（Function\
    \ Body）。\n\n例如：\n\n```\n#include <iostream.h>\nvoid functionName() {}\nint main()\n\
    {\n    functionName();\n}\n```\n\n### 文件输入输出 (File I/O)\n\n为了存储和管理图像、Word 文档、纯文本或\
    \ Excel 表格等计算机文件，我们支持文件输入/输出（File Input/Output）操作模式。文件输入的方法是将任何数据写入文件，而文件输出方法用于显示来自文件的结果。通常，文件可以用不同的模式打开，如只读模式、只写模式或读写混合模式。\n\
    \n## 编程环境 (The Programming Environment)\n\n### 什么是编程环境？\n\n开发环境是用于运行程序的工具和过程的组合。根据你编写代码的语言，我们可以选择最好的环境。\n\
    \n### 集成开发环境 (Integrated Development Environment)\n\n集成开发环境是指连接在一起以提供方便界面的软件。作为一种应用程序，集成开发环境（IDE）还有助于应用程序开发，并提供基于图形用户界面（GUI）的工作。现代\
    \ IDE 还可以执行算法和迭代。\n\n## 工具与技术 (Tools and Technologies)\n\n有成千上万的软件开发工具、IDE 和技术可用于创建应用程序和程序。我们列出并简介绍了了一些程序员最有效、易用且先进的工具：\n\
    \n### NetBeans\n\nNetBeans 是一个开源的集成开发环境，可以作为开发桌面、Web 和移动应用程序的工具。该工具允许简单高效的项目管理过程，允许开发者编写无\
    \ bug 代码，并提供智能代码编辑功能。此外，该 IDE 最适合 PHP、C++ 和 C 编程语言。\n\n### Cloud9\n\n谈到在线集成软件开发环境时，Cloud9\
    \ 无疑是值得考虑的最佳工具之一。支持的语言包括 PHP、C、C++、Python、Perl、Node.js 和 JavaScript。开发者可以选择广泛的默认运行器来执行程序，并根据提供的建议快速编码。\n\
    \n### Visual Studio\n\nVisual Studio 是由微软设计和开发的顶级集成开发环境。支持广泛的平台，开发者现在可以无忧地构建、保护、共享和管理软件组件。此外，自动化和\
    \ Azure 部署允许你在集中化版本控制系统的支持下提高代码质量。\n\n"
