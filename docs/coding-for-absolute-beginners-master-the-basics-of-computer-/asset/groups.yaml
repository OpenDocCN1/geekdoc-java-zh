    # Database Syntax, Data Type and Operators


    Standard Query Language (SQL) is used for storing, manipulating, and retrieving
    data within a database. SQL allows database administrators to perform multiple
    operations that are required to manage a database. The language allows you to
    execute queries, retrieve data, insert records, update records, delete records,
    create new databases, create new tables, and set permissions in a database by
    writing simple queries.


    There are different versions of SQL and all of them support major functionalities
    such as SELECT, DELETE, INSERT, WHERE, and UPDATE.


    # Structured Query Language (SQL)


    SQL is the language that is used for relational database systems such as MySQL,
    Sybase, Oracle, and SQL Server. Being a standard database language, SQL allows
    users to describe the data, access data, and manipulate the relational database
    management systems. Furthermore, users can also create, view, and drop databases
    through the Structured Query Language. The different components that are included
    in this process are Optimization Engines, SQL Query Engine, Classic Query Engine,
    and Query Dispatcher. To perform specific operations in a relational database
    management system, we can use the commands mentioned below:


    | Command | Description |

    | - | - |

    | CREATE | User can create a new table or an object within the database. |

    | READ | User can read the data stored in the tables. |

    | UPDATE | Update the tables to modify records. |

    | DELETE | Delete any record from the table. |

    | INSERT | Insert a new record into the table |

    | SELECT | Select specific records from the tables within the'
- md: '

    | | database. |

    |--- | :--- |

    | ALTER | Bring changes within a database object. |

    | DROP | Delete the entire table from the database. |


    By using the above operations, we can perform different operations from the sample
    table named ‘Students’ given below:


    | Student ID | Student Name | City | Subject | Marks | Percentage |

    |---|---|---|---|---|---|

    | 1 | William | New York | Mathematics | 85 | 60% |

    | 2 | James | California | English | 79 | 58% |


    The SQL statement to fetch records from the above table will have the following
    syntax:

    SELECT * FROM Students;


    # 1. SQL Queries


    In order to perform specific operations with tables in a database, we are required
    to use different queries that are explained as follows:


    | Query | Syntax |

    |--- | :--- |

    | INSERT INTO | INSERT INTO table_name(column1, column2,...) VALUES (Value1, Value2,...)
    |

    | UPDATE | UPDATE table_name SET column1 = value1, column2 = value2.. WHERE condition
    |

    | DELETE | DELETE FROM table_name WHERE condition |

    | ORDER BY | SELECT column1, ..FROM table_name ORDER BY column1, ASC/DESC; |

    | MIN() | SELECT MIN(column_name) FROM table_name WHERE condition; |

    | MAX() | SELECT MAX(column_name) FROM table_name WHERE condition; |

    | WHERE | SELECT column1.. FROM table_name WHERE condition; |


    # SQL Joins


    Taking the example of relational database with table A and table B, the table
    can also be joined through the SQL JOIN query. The Venn diagram clearly shows
    how both of the tables are joined together to share data:

    We will implement various JOIN clause operations on the example tables ‘Patients’
    below:


    Table 1:


    | PatientID | CaseNO | Date |

    |---|---|---|

    | 43221 | 1 | 9-2-2011 |

    | 82357 | 3 | 8-12-2015 |


    Table 2:


    | CaseNo | PatientName | City |

    |---|---|---|

    | 1 | Andrew | Chicago |

    | 3 | John | LA |


    To join both tables, we can write the SQL JOIN statement as follows:


    ```

    SELECT Patient.PatientID, Case.CaseNo, Date.

    FROM Patients

    INNER JOIN Patients On Case.CaseNo = PatientName.PatientID;

    ```


    There are four different types of SQL JOIN queries known as:


    - INNER JOIN

    - LEFT OUTER JOIN

    - RIGHT OUTER JOIN

    - FULL OUTER JOIN


    # Inner join


    Inner join selects the entire record from Table A and Table B where the join condition
    is satisfied. The syntax for creating inner join in SQL is defined as follows:


    ```sql

    SELECT column

    FROM table1

    INNER JOIN table 2

    ON table1.column_name = table2.column_name;

    ```


    # Left Join


    The Left join selects the entire record from Table A combined with the records
    from Table B where the join condition is satisfied. Syntax for creating LEFT JOIN
    in SQL is defined as follows:


    ```sql

    SELECT column

    FROM table1

    LEFT JOIN table 2

    ON table1.column_name = table2.column_name;

    ```


    # Right Join


    The Right join select all records from Table B combined with the records from
    Table A where the join condition is satisfied. Syntax for creating RIGHT JOIN
    in SQL is defined as follows:


    ```sql

    SELECT column

    FROM table1

    RIGHT JOIN table 2

    ON table1.column_name = table2.column_name;

    ```


    # Full outer Join


    The Full outer join selects all records from Table A and Table B if the join condition
    is not met. Syntax for creating FULL JOIN in SQL is defined as follows:


    ```sql

    SELECT column

    FROM table1

    FULL OUTER JOIN table 2

    ON table1.column_name = table2.column_name

    WHERE condition;

    ```


    # Union Operator


    To combine the result of two or mode SELECT statements, the UNION operator is
    used for which each of the column must have similar data types. Moreover, the
    columns in the SELECT statement should be in the same order for both tables. The
    syntax for implementing UNION operator in SQL is defined as follows:


    ```sql

    SELECT column_name FROM table1

    UNION

    SELECT column name FROM table2;

    ```


    # GROUP BY


    The GROUP BY statement can be used to perform listing or numbering from the database
    table. Syntax for using GROUP BY statement in SQL is defined as follows:


    ```sql

    SELECT column_name

    FROM table_name

    WHERE condition

    GROUP BY column_name

    ORDER BY column_name;

    ```


    # ORDER BY


    The ORDER BY statement in SQL is used to sort data in ascending or descending
    order. Syntax for implementing ORDER BY clause is defined as follows:


    ```sql

    SELECT column_list

    FROM table_name

    WHERE condition

    [ORDER BY column1, column2,] [ASC | DESC];

    ```


    # Advanced SQL


    There are other vital operations and clauses that can be implemented to perform
    complex operations within the database. Here are some of the key features of advanced
    SQL explained in detail:


    # Indexes


    SQL Indexes are used by database search engines to optimize the process of data
    handling. As they are considered as special lookup tables, an index helps to speed
    up WHERE clauses and SELECT queries as well. To create an Index, we can use the
    CREATE INDEX statement along with the UNIQUE constraint to prevent duplicate entries.


    Syntax for using CREATE Index:


    ```sql

    CREATE INDEX index_name ON table_name;

    ```

    Syntax for using DROP Index:

    ```sql

    DROP INDEX index_name;

    ```


    # Truncate Table


    The TRUNCATE TABLE command is SQL to delete complete data from an existing table.
    Basic syntax:


    ```sql

    TRUNCATE TABLE table_name;

    ```


    # SQL Primary and Foreign Key


    # Primary Key


    The PRIMARY KEY constraint in SQL is implemented to uniquely identify each record
    in a table. Primary keys should always contain unique values and not have NULL
    values. Moreover, one table can have only one unique key. For example, to define
    PRIMARY KEY on the ID when “Students” table is created, we can use the following:


    ```sql

    CREATE TABLE Students (

    ID NOT NULL,

    FirstName varchar (255),

    LastName varchar (255),

    Marks int,

    PRIMARY KEY (ID)

    );

    ```


    # Foreign Key


    The FOREIGN KEY constraint in SQL is implemented to link two tables together for
    which FOREIGN KEY in one table refers to the PRIMARY KEY from the other table.
    Syntax for implementing FOREIGN KEY on “StudentID” to create “Student”:


    ```sql

    CREATE TABLE Student

    StudentID NOT NULL,

    StudentMarks int,

    ClassID int,

    PRIMARY KEY (StudentID),

    FOREIGN KEY (ClassID) REFERENCES Students(StudentID);

    ```


    # Constraints and Useful resources


    Constraints are the specific rules that are implemented on data columns of a table.
    Generally, constraints are implemented to limit the type of data that can be inserted
    into a table. Most commonly, this includes NOT NULL Constraint, DEFAULT Constraint,
    UNIQUE Constraint, PRIMARY Key Foreign Key, CHECK Constraint, and INDEX.


    Furthermore, Integrity constraints can also be used to avail better consistency
    and accuracy of data present in relational database. Usually, PRIMARY KEY, FOREIGN
    KEY, and UNIQUE Constraints are a part of Referential Integrity (RI).


    In order to improve the performance of SQL database, there are several important
    factors that can be implemented with ease. While writing a column name, it is
    advised that SELECT statement is used rather than the *. For example:

    SELECT * FROM Students


