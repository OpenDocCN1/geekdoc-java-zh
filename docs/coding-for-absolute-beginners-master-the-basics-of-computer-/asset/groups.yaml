    # 前言


    《零基础编程指南》为决心学习最佳编程方法、技术和方法论的的学生们提供了一份完整且真实的指南。随着软件行业每天都在更新最新的编码语言和工具，采用新技能和技术对于在竞争激烈的市场中生存是必不可少的。阅读对于学生和学习者来说一直是至关重要的资源，因为他们可以通过实施最新的技术和编程方法论来提高表现和输出。


    本书是一本成功的编程手册，涵盖了所有主要的编程语言、语法和最佳实践，适用于初学者和专业人士。在进入编程世界之前，需要考虑几个重要的因素，以培养敏锐的问题解决和分析能力。因此，本书为初级程序员身定制，并针对你可能对
    Java、SQL、C、C++、C#、Python、HTML 和 CSS 提出的每一个问题提供了解决方案和答案。


    我始终强调基础知识和技能的获取。本书不会在一小时或一夜之间让你成为程序员，但它将为你的编程职业奠定坚实的基础。读这本书后，你的编程基础知识将会增加，你对任何编程语言的熟练程度也会提高。


    许多人通过各种方式帮助我编写这本书，提供了重要的反馈和鼓励并纠正了各种错误。我对他们感激。。 Steve 先生，他当时是我哈佛大学的计算机科学论文导师。他在一年前就知道我正在写一本编程书了。在
    2020 年 12 月把书草稿发给他后，他的回复是：“我刚刚读完你的书。在过去的五六年里，我一直在想写这样这样的书——你做到了——我不需要再写了。谢谢。”


    在个人层面，我必须感谢我的妻子 Rachel 和儿子 Aaron 无尽的耐心和支持。


    我希望《零基础编程指南》能成为你编程之旅中最好的朋友，帮助你精通计算机编程。


    愿源码与你同在。


    # 第一章


    # 什么是编程？


    通常，编程是指计算机用于完成某些任务的一组指令。这也称为编码（coding）。在深入讨论之前，你必须充分了解编程是如何工作的，以及这组指令是如何被计算机处理的。当你能够遵循正确的方法编写计算机程序时，为任何语言实现函数、运算符和语法都会变得非常简单。此外，编程是与计算机通信的一种，程序员需要理解高级语言和低级语言。


    为了用计算机解决问题，用户需要通过一组指令提供解决方案。由于程序是解决问题所需的指令集合，因此必须添加适当的语句和功能以实现预期的结果。例如，如果你被赋予开发一个用于整数相加程序的任务，那么执行加法的指令集就称为该程序。相整数的算法将通过
    C++、C、C# 或 Java 等特定语言表示。如果程序无法正常执行，那么你的算法或语法可能存在问题，因为如果有任何类型的错误，编译器或编辑器将无法执行。


    通过实践和编写代码来学习编程比学习冗长的方法论或复杂的技术效果更好。尽管在开始时看起来可能是一项有趣的活动，但如果你不遵循正确的方法，可能会变得耗时且令人沮丧。此外，本书将让初学者更容易选择最合适的编程语言，并毫不费地进入计算机编程的世界。


    # 使用计算机编程解决问题


    本质上，计算机程序旨在按照一组指令来解决特定问题。人们可以通过多种技术和方法来编写程序。为了解决问题，你需要确定代码流并逐步满足要求以获得预期的输出。


    使用制制木桌的例子，你需要写下如下指令：


    - 获取制作桌子所需的合适的木材。

    - 获取过程中将使用的必备工具和设备。

    - 连接木块并制作你的桌子。

    - 抛光成品使其具有吸引力。


    在向计算机提供此类指令时，你需要更加具体和精确，因为计算机无法独立执行操作。由于它是为了遵循指令而创建的，你的计算机程序应该遵循增量方法以实现预期的结果。


    关于计算机自然语言的话，它们无法理解人类语言，因此我们需要通过另一种名为二进制代码的语言与系统通信。二进制代码由一系列 1 和 0 组成，是计算机的自然通信语言。为了帮助计算机理解人类语言，我们


