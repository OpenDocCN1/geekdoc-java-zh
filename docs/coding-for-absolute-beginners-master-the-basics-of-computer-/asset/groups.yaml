  mdcn: "\n\n要显示上标内容，可以使用 `<sup>...</sup>` 标签，而 `<sub>` 和 `</sub>` 标签用于添加下标。例如：\n\
    `<p><sup>此文本使用了 <sup>上标</sup></sup></p>`\n输出：以下单词使用了 <sup>上标</sup>\n\n## 下划线：\n\
    \n写在 `<u>` 和 `</u>` 标签之间的文本会有下划线\n`<p><u>示例文本</u></p>`\n输出：<u>示例文本</u>\n\n## 插入和删除标签\n\
    \n要插入内容，使用 `<ins>` 和 `</ins>` 标签；而要删除任何文本，可以使用 `<del>` 和 `</del>` 标签。\n\n## 链接\n\
    \n要在文中添加链接，可以使用以下标签：\n`<p><a href=\"document location\">链接</a></p>`\n\n## 跑马灯标签\
    \ (Marquee)\n\n`<marquee>` 标签可以使用不同的属性，包括 width, height, direction, behavior,\
    \ scrollamount, scrolelay, loop, bgcolor, hspace, vspace。\nmarquee 标签演示：\n\n```html\n\
    <html\n<head>\n  <title>HTML marquee 标签</title>\n</head>\n<body>\n  <marquee>示例文本</marquee>\n\
    </body>\n</html>\n```\n\n## 容器标签\n\n在 HTML 中，使用以下容器标签来格式化文本：\n\n| 起始标签 | 结束标签\
    \ | 功能 |\n|---|---|---|\n| `<p>` | `</p>` | 段落 |\n| `<span>` | `</span>` | 在段落内添加内联内容\
    \ |\n| `<em>` | `</em>` | 用于给文本加强调 |\n| `<ol>` | `</ol>` | 有序列表（数字） |\n| `<ul>`\
    \ | `</ul>` | 无序列表（项目符号） |\n| `<li>` | `</li>` | 列表项 |\n\n## 表格、图像和框架\n\n### 表格\n\
    \n表格是任何网站不可或缺的组成，因为它们帮助我们以适当的方式说明和阐述关键信息。在 HTML 中，可以使用预定义的标签来创建和设计表格。\n\n### 用于在\
    \ HTML 中创建表格的标签\n\n创建一个表格，可以使用以下标签：\n`<table>......</table>`\n\n表格行\n\n创建表格行的标签：\n\
    `<tr>...</tr>`\n\n表格高度\n\n`<th>...</th>`。用于创建显示数据表格的示例属性是 scope = \"row\" 和 \"\
    column\"，因为它们定义了给定的标签是行表头还是列表头。\n\n表格数据单元格\n`<td>...</td>`。表格数据单元格的属性是 colspan\
    \ = \"number\" 和 rowspan = \"number\"，我们需要将标签与 `<th>` 或 `<td>` 元素一起使用，以便跨多个行或列单元格。\n\
    \n## 图像\n\n图像是任何网站不可或缺的组成。由于它们可以帮助我们更好地展示概念、服务和服务信息，在 HTML 中插入和管理图像非常简单。\n\n插入图像的标签：\n\
    \n```html\n<img src = \"Image URL\" />\n<img src = \"desktop/images/image1.png\"\
    \ alt = \"示例图像\" />\n```\n\n要设置图像特定的高度和宽度，可以使用语法：\n\n```html\n<img src = \"desktop/images/image1.png\"\
    \ alt = \"示例图像\" width = \"100\" height = \"100\" />\n```\n\n视频\n\n要在 HTML 网页中添加视频，可以使用带有以下语法的\
    \ `<video>` 标签：\n\n```html\n<video><source src=\"Samplevideo.mp4\" type=\"video/mp4\"\
    ></video>\n```\n\n 对齐和边框\n\n在网页上对齐图像有三个位置，称为居中、右对和左。为此，我们可以使用 align 属性。例如：\n\n\
    ```html\n<img src = \"desktop/images/image1.png\" alt = \"示例图像\" align=\"center\"\
    />\n```\n\n要创建图像边框，属性是 border。例如：\n\n```html\n<img src = \"desktop/images/image1.png\"\
    \ alt = \"示例图像\" border=\"4\"/>\n```\n\n## 框架\n\n在超文本标记语言中，添加框架是为了在浏览器窗口中创建多个部分，以便每个部分都可以加载唯一的\
    \ HTML 文档。要在网页中使用框架，应该使用 `<frameset>` 标签代替 `<body>` 标签，然后可以使用特定的 rows 和 cols 属性对其进行定义。\n\
    \n创建框架的示例 HTML 标签：\n\n```html\n<head><title>HTML 框架</title></head>\n```\n\n```html\n\
    <frameset rows = \"10%,80%,10%\">\n  <frame name=\"top\" src=\"/html/top_frame.htm\"\
    \ />\n  <frame name=\"main\" src=\"/html/main_frame.htm\" />\n  <frame name=\"\
    bottom\" src=\"/html/bottom_frame.htm\" />\n  <noframes>\n    <body>您的浏览器不支持框架。</body>\n\
    \  </noframes>\n</frameset>\n</html>\n```\n\n## iFrame\n\n要创建一个嵌套的浏览上下文，可以使用 iFrame\
    \ 标签将新的 HTML 文档添加到现有的文档中。要创建一个 iFrame，可以连同 `<iframe>` 标签实现以下语法：`<iframe src=\"\
    https://www.samplewebsite.com\"></iframe>`\n\n基础 HTML 标签的完整表格：\n\n| `<a>` | `<abbr>`\
    \ | `<acronym>` | `<address>` | `<applet>` |\n|---|---|---|---|---|\n| `<area>`\
    \ | `<article>` | `<aside>` | `<audio>` | `<b>` |\n| `<base>` | `<basefont>` |\
    \ `<bdi>` | `<big>` | `<blockquote>` |\n| `<body>` | `<br>` | `<button>` | `<canvas>`\
    \ | `<caption>` |\n| `<center>` | `<cite>` | `<code>` | `<col>` | `<colgroup>`\
    \ |\n| `<data>` | `<datalist>` | `<dd>` | `<del>` | `<details>` |\n| `<dialog>`\
    \ | `<div>` | `<dl>` | `<dt>` | `<em>` |\n| `<embed>` | `<fieldset>` | `<figcaption>`\
    \ | `<figure>` | `<font>` |\n| `<footer>` | `<frame>` | `<frameset>` | `<h1>`\
    \ | `<head>` |\n| `<header>` | `<hr>` | `<html>` | `<iframe>` | `<img>` |\n| `<input>`\
    \ | `<ins>` | `<kbd>` | `<label>` | `<legend>` |\n| `<li>` | `<link>` | `<main>`\
    \ | `<map>` | `<mark>` |\n| `<meta>` | `<meter>` | `<nav>` | `<noframes>` | `<noscript>`\
    \ |\n| `<object>` | `<ol>` | `<optgroup>` | `<option>` | `<output>` |\n| `<p>`\
    \ | `<param>` | `<picture>` | `<progress>` | `<q>` |\n| `<rp>` | `<rt>` | `<ruby>`\
    \ | `<s>` | `<samp>` |\n| `<script>` | `<section>` | `<select>` | `<small>` |\
    \ `<source>` |\n| `<span>` | `<strong>` | `<style>` | `<summary>` | `<svg>` |\n\
    | `<table>` | `<td>` | `<template>` | `<textarea>` | `<tfoot>` |\n| `<th>` | `<time>`\
    \ | `<title>` | `<tr>` | `<track>` |\n| `<tt>` | `<u>` | `<ul>` | `<var>` | `<video>`\
    \ |\n| `<wbr>` | | | | |\n\n 表单\n\nHTML 表单是网站与用户之间交互的关键方面之一。表单使用文本字段、按钮、选择框、单选按钮、隐藏控件和可点击控件等组件创建。通过表单收集的数据发送到服务器，网页也可以拦截数据。\n\
