    }\n```\n\n## 字体与文本\n\n### 字体\n\nCSS 中的 font 属性用于指定其他字体属性并设置内容的字体。CSS 中不同的字体属性包括字体样式、字体族、字体粗细、字体变体、字体权重和字体大小。以下是每个字体属性的简单\
