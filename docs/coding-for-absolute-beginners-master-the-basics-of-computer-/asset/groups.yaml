    # Loops and Functions


    # Loops


    Loops are an essential part of every programming language and allow the developers
    to execute a specific statement multiple times. There are 4 different types of
    loops used in the C programming language that are briefed as follows:


    +   1. For Loop: Used to execute a statement a specific number of times and is
    also considered to abbreviate the code to handle loop variable.


    +   2. While Loop: Repeats the given statement and checks whether the given condition
    is true or false. Before executing the loop body, it checks all of the conditions.


    +   3. Do While Loop: Works as the While loop, however, the Do While loop, only
    checks the condition at the end.


    +   4. Nested Loops: A loop inside a loop is known as nested loop. It can be a
    While loop, Do While loop, or For loop.


    To change the execution of loops from the normal sequence, we can use the Loop
    Control statements as well. The Break Statement exits the loop and transfers execution
    to the next statement whereas the Continue statement causes the loop to skip the
    rest of its body and recheck the given condition. For transferring control to
    the labeled statement, we can use the Go to Statement as well.


