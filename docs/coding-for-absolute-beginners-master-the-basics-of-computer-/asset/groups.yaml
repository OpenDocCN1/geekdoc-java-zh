- md: "\nuse translators and editors for writing programs. Translators have the capability\
    \ to convert the source code into the machine’s language.\n\nThere are multiple\
    \ types of translators known as Interpreters, Compilers, and Assemblers. Interpreters\
    \ are generally used to interpret languages which are processed line by line to\
    \ run the final program. Moreover, any syntax errors or mistakes are also outlined\
    \ by the interpreter so the programmer can clear out the mistakes and execute\
    \ the program.\n\nWith the help of compilers, the source code is converted to\
    \ binary code through a compilation process and is then executed to deliver the\
    \ output. If there are no errors or mistakes in the source code, all of the lines\
    \ are translated and executed at once by the compiler. Moreover, computer programs\
    \ are also known as Apps (application or application software) and are tailored\
    \ to the environment or platform they are designed to run on. Apps are differentiated\
    \ in the categories of desktop applications and mobile applications as well.\n\
    \n## Basics of Programming\n\n## Introduction to Computer Programming\n\nEvery\
    \ computer program is a combination of procedures, processes, and algorithms that\
    \ complete the source code. As this process combination can also be considered\
    \ a representation of a software, the process is referred to as a series of actions\
    \ to achieve an output whereas the procedure can be considered as a series of\
    \ actions performed in a specific order. Algorithms are the main driving force\
    \ of any program, also known as an ordered set of steps to solve a certain program\
    \ or problem.\n\nThere are different high level and low-level languages that can\
    \ be used to write a computer program. Nowadays, programs and software are generally\
    \ made by using popular languages which include C, C++, Java, Python, HTML, PHP,\
    \ Ruby, and Perl. These languages are used to produce computer programs that are\
    \ currently used in various fields and industries including the medical, engineering,\
    \ communication, household, and entertainment industries. Furthermore, computer\
    \ programs are also being used to create graphics, web applications, and desktop\
    \ applications as well.\n\n## Elements and Basics of Computer Programming\n\n\
    Usually, computer languages are a combination of several elements that allow programmers\
    \ to achieve an expected output. These elements include the basic syntax, programming\
    \ environment, data types, keywords, variables, decision making, basic operators,\
    \ and functions. Moreover, in order to perform certain operations within a program,\
    \ you need to apply other operations and using elements loops, strings, characters,\
    \ File I/O, and arrays as well.\n\nThere are five different basic elements of\
    \ programming that are also considered as the building blocks of any program.\
    \ The elements are known as Input, Output, Arithmetic, Conditional, and Looping.\
    \ Starting with the first element, Input is the process of getting commands and\
    \ data into the computer, whereas the Output has the functionality to deliver\
    \ the results. If there are any sort of calculations or operations, the Arithmetic\
    \ element is used along with the Conditional statement to test whether the condition\
    \ is true or false.\n\n## Environment, Data Types, and Basic Syntax\n\n## Environment\n\
    \nIn order to run or execute a program, you must install or setup the required\
    \ tool and environment for the language you are using. Moreover, beginners can\
    \ also use a text editor to create computer programs if they find it difficult\
    \ to install and configure the programming environments on their own. To execute\
    \ the programs into binary format, it is mandatory that you use a compiler because\
    \ the computer cannot understand a program directly if given in the text format.\n\
    \nMoreover, the conversion of text into binary format is done by the Compiler\
    \ through which programmers can run and execute the program as well. Programming\
    \ languages including C, C++, C#, and Java need the compilation in binary format\
    \ whereas other languages such as PHP, Perl, and Python can be compiled directly\
    \ as well.\n\n## Basic Syntax\n\nTo make it easier for beginners, we will be starting\
    \ from the grassroots level and write a “Hello World” program in C++. This sample\
    \ program as written below will make it easier for you to understand and begin\
    \ writing your first program.\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n{\n    cout << \"Hello World!\";\n    return 0;\n}\n```\n\
    \nThe output for this respective Hello World program is as follows:\n\nHello World!\n\
    \nEach program that is being written in C++ starts with #include <iostream> and\
    \ main() which is also known as the main function. The program is then continued\
    \ with functions, characters, loops, strings, or arrays depending on the requirements.\
    \ In the program above, main() is used as a function whereas cout is the standard\
    \ output stream that is implemented to print “Hello World!”. At last, return 0;\
    \ is written as the exit status of the program which is also necessary for program\
    \ execution.\n\nIf you are unable to execute the program, there might be some\
    \ possible syntax errors or typing mistakes that are not being processed by the\
    \ compiler. As it stops the program from compiling, slight typing errors such\
    \ as the omission of a single comma, semi-colon, or dot are most likely to be\
    \ the cause. So, if you are not properly following the syntax as defined for the\
    \ programming language, your program might not compile or execute in this case.\n\
    \n## Data Types\n\nData types are an important part of various programming languages\
    \ and are used when creating computer applications. As it classifies every object\
    \ or variable that is being written in the program, data types tell the compiler\
    \ how to use the provided data in order to perform certain operations. Generally,\
    \ commonly used data types include integer, real, Boolean, alphanumeric strings,\
    \ characters, and floating-point numbers.\n\nBriefed details of data types are\
    \ given as follows:\n\n- Date: 01/04/2015\n- Integer: 1,52,13424\n- Boolean: True/False\n\
    - String: ab, aabb\n- Void: No data\n- Long: 5325433253\n- Floating point number:\
    \ 5.2341\n- Short: 0\n\n## Syntax\n\nAs stated previously, a program is defined\
    \ as a collection of elements and attributes that perform certain operations to\
    \ deliver a specific output. With the C++ programming language, there is a predefined\
    \ syntax that needs to be followed when writing programs. Let us briefly look\
    \ at an overview of how the basic syntax works.\n\n- 1. Class: Class is a defined\
    \ data type and has its own member functions and data members. For example: consider\
    \ the class of school, the data members will be teachers, students, admin staff,\
    \ etc.\n- 2. Object: An Object is an instance of a class that have their own behavior\
    \ and states. For example, a car has different colors, models, specifications,\
    \ etc.\n- 3. Methods: Method is referred to as the behavior and is responsible\
    \ for the execution and manipulation of different actions within the class.\n\n\
    ## Programming Variables, Keywords, Operators, and Decisions\n\nVariables are\
    \ an essential part of a computer program as they provide computer locations required\
    \ to store values and data in a computer program. In order to save a value, you\
    \ will have to create variables and assign them a proper name, store values into\
    \ the variables, and retrieve the given values back from the variables.\n\nTo\
    \ get started with declaring variables, we will have to write the program as follows:\n\
    \n```cpp\n#include <iostream.h>\nint main() {\n    int a;\n}\n```\n\nThe above\
    \ written program creates a variable named “a” and is specified by an int keyword.\
    \ This means the variable can only store an int type value and you are not allowed\
    \ to define “a” again to store another type of value in the variable.\n\nTo store\
    \ a value into the variable, just declare the number that you want to place in\
    \ “a” after the declaration of a variable in the program.\n\n## Keywords\n\nThere\
    \ are different keywords for every programming language that are used for various\
    \ purposes. Although each language provides a complete set of reserved keywords,\
    \ there is a common rule that needs to be followed while using the keywords. Same\
    \ as float, int, long, and string, other keywords that are most used in every\
    \ programming language are as follows:\n\n- Else\n- Switch\n- Goto\n- Static\n\
    - Case\n- Break\n- Enum\n- For\n- If\n- Union\n- Double\n- Private\n"
  mdcn: "\n\n使用翻译器和编辑器来编写程序。翻译器具有将源代码转换为机器语言的能力。\n\n翻译器有多种类型，被称为解释器、编译器和汇编器。解释器通常用于解释逐行处理的语言，以运行最终的程序。此外，解释器还会列出任何语法错误或问题，以便程序员可以清除这些错误并执行程序。\n\
    \n在编译器的帮助下，源代码通过编译过程转换为二进制代码，然后被执行以交付输出。如果源代码中没有错误或问题，编译器将一次性翻译并执行所有行。此外，计算机程序也被称为\
    \ Apps（应用程序或应用软件），并针对它们设计上运行的环境或平台进行定制。Apps 还被分为桌面应用程序和移动应用程序两类。\n\n## 编程基础\n\n\
    ## 计算机编程简介\n\n每个计算机程序都是过程（procedures）、流程（processes）和算法的组合，它们共同完成了源代码。由于这种过程的组合也可以被视为软件的表示，因此，流程被视为实现输出的一系列动作，而过程（procedure）可以被视为按特定顺序执行的一系列动作。算法是任何程序的驱动动力，也被称为解决特定程序或问题的有序步骤集。\n\
    \n有不同的高级语言和低级语言可用于编写计算机程序。如今，程序和软件通常使用流行的语言制作，包括 C、C++、Java、Python、HTML、PHP、Ruby\
    \ 和 Perl。这些语言用于产生目前用于各个领域和行业的计算机程序，包括医疗、工程、通信、家用和娱乐行业。此外，计算机程序还用于创建图形、Web 应用程序和桌面应用程序。\n\
    \n## 计算机编程的元素与基础\n\n通常，计算机语言是几个元素的组合，允许程序员实现预期输出。这些元素包括基本语法、编程环境、数据类型、关键字、变量、决策、基本运算符和函数。此外，为了在程序中执行某些操作，你还需要应用其他操作并使用循环、字符串、字符、文件\
    \ I/O 和数组等元素。\n\n编程有五个不同的基本元素，也被认为是任何程序的构建块。这些元素被称为输入、输出、算术、条件和循环。从第一个元素开始，输入（Input）是将命令和数据获取计算机的过程，而输出（Output）具有交付结果的功能。如果有任何形式的计算或操作，则使用算术（Arithmetic）元素结合条件（Conditional）语句来测试条件是真假。\n\
    \n## 环境、数据类型和基本语法\n\n## 环境\n\n为了运行或执行程序，你必须为你正在使用的语言安装或设置所需的工具和环境。此外，如果初学者发现自己安装和配置编程环境有困难，也可以使用文本编辑器来创建计算机程序。为了将程序执行为二进制格式，必须使用编译器，因为如果以文本格式提供程序，计算机无法直接理解。\n\
    \n此外，文本到二进制格式的转换由编译器完成，通过它，程序员也可以运行和执行程序。包括 C、C++、C# 和 Java 在内的编程语言需要二进制格式的编译，而\
    \ PHP、Perl 和 Python 等语言也可以直接编译。\n\n## 基本语法\n\n为了让初学者更容易上手，我们将从底层开始，用 C++ 编写一个“Hello\
    \ World”程序。如下所示的示例程序将让你更容易理解并开始编写你的第一个程序。\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint main() {\n{\n    cout << \"Hello World!\";\n    return 0;\n\
    }\n```\n\n相应的 Hello World 程序的输出如下：\n\nHello World!\n\n每个用 C++ 编写的程序都从 #include\
    \ <iostream> 和 main() 开始，main() 也被称为主函数。程序根据需要继续使用函数、字符、循环、字符串或数组。在上面的程序中，main()\
    \ 被用作函数，而 cout 是实现用于打印“Hello World!”的标准输出流。最后，return 0; 被写作程序的退出状态，这对于程序的执行也是必要的。\n\
    \n如果你无法执行程序，可能存在编译器未处理的某些语法错误或拼写错误。由于它会阻止程序编译，微小的拼写错误（如漏掉单个逗号、分号或点）最可能是原因。因此，如果你没有正确遵循为编程语言定义的语法，在这种情况下，你的程序可能无法编译或执行。\n\
    \n## 数据类型\n\n数据类型是各种编程语言的重要部分，在创建计算机应用程序时使用。由于它分类程序中编写的每个对象或变量，数据类型告诉编译器如何使用提供的数据来执行某些操作。通常，常用的数据类型包括整数、实数、布尔值、字母数字字符串、字符和浮点数。\n\
    \n数据类型的简要详情如下：\n\n- 日期 (Date): 01/04/2015\n- 整数 (Integer): 1,52,13424\n- 布尔值 (Boolean):\
    \ True/False\n- 字符串 (String): ab, aabb\n- 空值 (Void): 无数据\n- 长整数 (Long): 5325433253\n\
    - 浮点数 (Floating point number): 5.2341\n- 短整数 (Short): 0\n\n## 语法\n\n如前所述，程序定义为执行某些操作以交付特定输出的元素和属性的集合。使用\
    \ C++ 编程语言时，编写程序时需要遵循预定义的语法。让我们简要概述一下基本语法如何工作。\n\n- 1. 类 (Class)：类是一种定义的数据类型，拥有自己的成员函数和数据成员。例如：考虑学校类，数据成员将是老师、学生、行政人员等。\n\
    - 2. 对象 (Object)：对象是类的实例，拥有自己的行为和状态。例如，汽车有不同的颜色、型号、规格等。\n- 3. 方法 (Methods)：方法被视为行为，负责类内不同动作的执行和处理。\n\
    \n## 编程变量、关键字、运算符和决策\n\n变量是计算机程序的重要部分，因为它们提供了在程序中存储值和数据的计算机位置。为了保存值，你必须创建变量并为它们分配适当名称，将值存储到变量中并从变量中取回给值。\n\
    \n为了开始声明变量，我们需要编写如下程序：\n\n```cpp\n#include <iostream.h>\nint main() {\n    int\
    \ a;\n}\n```\n\n上面的程序创建了一个名为“a”的变量，并由 int 关键字指定。这意味着该变量只能存储 int 类型的值，你不允许再次定义“a”以便变量中存储另一种类型的值。\n\
    \n要在变量中存储值，只需在程序声明变量之后声明要放入“a”的数字。\n\n## 关键字\n\n不同的编程语言有不同用途的关键字。虽然每个语言提供完整的保留关键字，但在使用关键字时需要遵循一条通用规则。与\
    \ float、int、long 和 string 一样，编程语言中最常用的其他关键字如下：\n\n- Else\n- Switch\n- Goto\n-\
    \ Static\n- Case\n- Break\n- Enum\n- For\n- If\n- Union\n- Double\n- Private\n\
    \n"
