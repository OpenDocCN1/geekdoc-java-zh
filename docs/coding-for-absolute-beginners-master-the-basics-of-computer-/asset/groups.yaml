    \ your website as well.\n\n![](img/9d932bec53e523b8d8b7b8134cf77ca7_120_0.png)\n\
    \n# CHAPTER NINE\n\nCSS\n\n# What is CSS?\n\nCSS stands for “Cascading Style Sheet”\
