    }\n```\n\n## 访问修符\n\n在 C++ 中，访问修符用于确定类之外之外对类成员的可用性限制。私有（Private）、受保护（Protected）和公共（Public）是定义成员访问级别的主要访问修符。\n\
    在创建类时，使用私有访问修符时，基类的受保护和公共数据成员将成为派生类的私有成员，而基类的私有成员仍然保持为私有。在受保护访问修符中，基类的公共和受保护数据成员将成为派生类的受保护成员。基类的私有成员仍然无法访问。\n\
