    ## Forms\n\nHTML forms are one of the key aspects of interaction between a website\
    \ and a user. A form is created using widgets such as text fields, buttons, select\
    \ boxes, radio buttons, file select boxes, hidden controls, and clickable controls.\
    \ Data collected through forms is sent to the web server and the web page can\
    \ also intercept the data on its own. Most of the time, widgets are linked with\
    \ a label to describe their purpose.\n\nSyntax for creating a form in HTML:\n\n\
    ```html\n<form action = \"URL\" method=\"GET\">\nform elements like input, buttons\
    \ etc.\n</form>\n```\n\nInput form to take Name and Age from user:\n\n```html\n\
