    </body>\n</html>\n```\n\nOutput:\n\n![](img/9d932bec53e523b8d8b7b8134cf77ca7_115_0.png)\n\
    \n## Select Box\n\nThe Select Box element gives an option to list down multiple\
    \ options in HTML form. For example:\n\n```html\n<\n\n<head>\n  <title>Select\
    \ your course</title>\n</head>\n<body>\n  <form>\n    <select name=\"dropdown\"\
    >\n      <option value=\"Math\" selected>Math</option>\n      <option value=\"\
    Physics\">Physics</option>\n    </select>\n  </form>\n</body>\n</html>\n```\n\
    Output:\n\n## Form Element\n\nOnce the HTML form has been completed, the two attributes\
