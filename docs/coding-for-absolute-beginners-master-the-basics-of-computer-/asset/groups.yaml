    Images are an essential part of any website. As they help us to illustrate the
    concepts, services, and information in a better way, it is quite simple to insert
    and manage images in HTML.


    Tag for inserting image:


    ```

    <img src = "Image URL" />

    <img src = "desktop/images/image1.png" alt = "Sample Image" />

    ```


    To set a specific height and width of an image, the following syntax can be used:


    ```

    <img src = "desktop/images/image1.png" alt = "Sample Image" width = "100" height
    = "100" / >

    ```


    Videos


    To add videos in an HTML web page, <video> tag can be used with the following
    syntax:


    ```

    <video><source src="Samplevideo.mp4" type="video/mp4\></video>

    ```


    # Alignment and Border


    There are three positions to align an image on a webpage known as Center, Right,
    and Left. For this, we can use the align attribute. For example:


    ```

    <img src = "desktop/images/image1.png" alt = "Sample Image" align="center"/>

    ```


    For creating image border, the attribute is border. For example:


    ```

    <img src = "desktop/images/image1.png" alt = "Sample Image" border="4"/>

    ```


    # Frames


    In HyperText Markup Language, frames are added to create multiple sections in
    the browser window so that each section can be loaded with a unique HTML document.
    To use frames in a web page, <frames> tag should be used instead of <body> tag
    which can then be defined with specific rows and cols attributes.


    Sample HTML tags for creating frames:


    ```

    <head><title>HTML Frames</title></head>

    ```'
