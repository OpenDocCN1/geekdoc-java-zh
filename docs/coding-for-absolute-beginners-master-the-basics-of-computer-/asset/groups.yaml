    data. By using multiple variables, reference types can point to a memory location
    and in case the memory location is changed by one of the variables, the other
    variable will automatically change its value.


    #  3. Object type


    Object data type is considered as the base class for all data types that are used
    in C#. Moreover, object types can also be assigned values of other types, reference
    types, user defined types, and value types as well.


    #  4. Pointer data type


    Pointer data type contains memory address of the variable value and has the syntax
    as follows:

    Type* identifier;


