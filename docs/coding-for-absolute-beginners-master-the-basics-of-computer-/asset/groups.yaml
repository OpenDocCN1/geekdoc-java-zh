  mdcn: "\n\n# 变量与数据类型\n\n## 变量\n\nC++ 编程语言中存在不同类型的变量。由于它们是通过特定的关键字定义的，我们必须按照下面的语法创建变量、指定类型并赋值：\n\
    类型 变量名 = 值\n\n### 变量的类型\n\n- Int = 用于存储整数和全数。例如：1,45,6346。\n- Char = 用于存储单个字符。例如：'a'\
    \ 或 'Z'。\n- Double = 用于存储浮点数。例如：50.2,100.2342。\n- Bool = 用于存储具有两种状态的值：真（True）或假（False）。\n\
    - String = 用于存储文本。例如：\"C++ 编程语言\"。\n\n要声明变量并为其赋值，我们可以按照下面提到的语法操作：\nInt newNum;\n\
    newNum = 50;\ncout << newNum;\nC++ 中使用的每个变量都应该具有唯一的名称，这些名称被称为标识符（identifiers）。构造标识符时，名称必须包含字母、数字或下划线，并且区分大小写。\n\
    \n## 数据类型\n\nC++ 编程语言中的数据类型定义了可以存储在变量中的数据类型。通常，C++ 中的数据类型分为三类：内置的、派生的和用户定义的。用户定义数据类型包括结构（structures）、联合体（union）和枚举（enum），而派生数据类型是基于数组、函数和指针的。\n\
    \nC++ 的内置数据类型：\n\n- Int\n- Char\n- Float\n- Double\n- Bool\n\n用户定义数据类型：\n\n- Union（联合体）\n\
    - Enum（枚举）\n- Struct（结构）\n\n派生数据类型：\n\n- Function（函数）\n- Array（数组）\n- Pointer（指针）\n\
    \n## 修饰符类型与存储类\n\nC++ 编程语言中的修饰符用于 char、double 和 int 数据类型，以更改基本类型的含义以满足某些编程条件。这些修饰符包括符号（signed）、无符号（unsigned）、长（long）和短（short）。\n\
    \n为了定义 C++ 程序中变量和函数的作用域，可以使用存储类，如 auto、register、extern、mutable 和 static。auto 存储类是所有局部变量的默认类型，而\
    \ static 存储类允许编译器在程序生命周期内存储局部变量并在并在离开作用域时将其销毁。\n\n外部类（extern）提供了全局变量的引用，当有两个或多个文件使用相同的全局函数或变量时使用。对于\
    \ mutable 存储类，只考虑类对象，它们也可以被常量成员函数进行修改。\n\n## 控制流\n\n在 C++ 编程中，控制流指的是程序运行时指令、函数和语句被求值和执行的顺序。这些语句在代码内部从上到下顺序执行，以完全满足程序逻辑。程序并不依赖于线性语句序列，C++\
    \ 提供了特定的控制流语句。\n\nC++ 中的控制流语句：\n\n1. If else\n2. For while 循环\n3. Do while 循环\n\
    4. Break & Continue\n5. Switch 语句\n6. Goto 语句\n\n## If 语句\n\n在 C++ 编程中，当程序中有多个需要执行的语句或情况时，使用\
    \ if 语句。If 语句的语法显示，只有当给定语句为真时括号内容才会执行，否则假语句将被自动忽略。\n\n```cpp\nif(condition){\n\
    \  statement;\n}\n```\n\n### If 语句的流程图：\n\n演示 C++ 中 If 语句的示例程序：\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main(){\n  int marks=80;\n  if (marks\
