    of different tags that can be used to describe the structure of a web page and
    tell the browser to display the content over the internet.


    # # What are Tags?


    Tags give instructions to web browsers regarding the structure, display, and content
    of any web page. As they are defined through enclosed angle brackets: <>, tags
    are comprised of attributes and elements. An element is an object on a page whereas
    an attribute describes the quality or details of that element. Remember that tags
    are to be used in pairs and opening tag <tag> and closing tags are differentiated
    by </tag>.'
  - '[PAGE 105]


    Your first sample HTML web page be created by using the following tags:

    <html>

    <head>

    <body>

    <h1>My First Heading</h1>

    <p>My first paragraph</p>

    </body>

    </html>


    # Description of Tags


    In the above-written HTML document, the <html> tag encloses the complete HTML
    document and is comprised of other major tags including <head>, <body>, and <p>.
    The <head> tag represents the file''s head whereas the <title> tag is used to
    show the document''s header. <body> includes several tags that are to be used
    to create a web page as heading <h1> and paragraph <p>.


    HTML Tags are not case sensitive but they should be used in lower case. To define
    the version of HTML, we can use the following tag:

    <!DOCTYPE html>


    Beginners can run HTML pages by using Notepad PC and save the file in .html format.
    This will allow them to view the webpages in a browser.


    # Basic Tags and Attributes


    # Basic Tags


    Each HTML document is supposed to start with a title, heading, and paragraph.
    After the <body> tag, the next major tag to be used is <h1> or heading tag. depending
    on your content requirements, heading tags are defined with <h1> to <h6>. For
    example:

    Headings:


    ```

    <html>

    <body>

    <h1>First heading</h1>

    <h2>Second heading</h2>

    <h3>Third heading</h3>

    <h4>Fourth heading</h4>

    ```'
