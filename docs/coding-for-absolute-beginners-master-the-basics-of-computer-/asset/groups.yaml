    \  Statement1;\n  if (condition 2) {\n    Statement2;\n  }\n}\n```\n\n### If Else\
    \ 语句：\n\n```cpp\nif(condition_1) {\n  Statement;\n} else if (condition 2) {\n\
    \    Statement;\n  }\n}\n```\n\n## Switch Case\n\nC++ 编程中的 Switch Case 语句用于程序中给出了多个条件，并且我们需要根据提供的条件执行操作。Break\
