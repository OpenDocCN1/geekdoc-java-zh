    # 内连接 (Inner join)


    内连接从表 A 和表 B 中选择满足连接条件的完整记录。SQL 中创建内连接的语法定义如下：


    ```sql

    SELECT column

    FROM table1

    INNER JOIN table 2

    ON table1.column_name = table2.column_name;

    ```


    # 左连接 (Left Join)


    左连接从表 A 中选择所有记录，并结合满足连接条件的表 B 记录。SQL 中创建 LEFT JOIN 的语法定义如下：


    ```sql

    SELECT column

    FROM table1

    LEFT JOIN table 2

    ON table1.column_name = table2.column_name;

    ```


    # 右连接 (Right Join)


    右连接从表 B 中选择所有记录，并结合满足连接条件的表 A 记录。SQL 中创建 RIGHT JOIN 的语法定义如下：


    ```sql

    SELECT column

    FROM table1

    RIGHT JOIN table 2

    ON table1.column_name = table2.column_name;

    ```


    # 全连接 (Full outer Join)


    如果未满足连接条件，全外连接将从表 A 和表 B 中选择所有记录。SQL 中创建 FULL JOIN 的语法定义如下：


    ```sql

    SELECT column

    FROM table1

    FULL OUTER JOIN table 2

    ON table1.column_name = table2.column_name

    WHERE condition;

    ```


