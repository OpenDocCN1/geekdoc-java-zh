    \ <iostream>\nusing namespace std;\nint main(){\n  int num=10;\n  switch(num+5)\
    \ {\n    case 1:\n    cout<<\"Case1: Value is \"<<num<<endl;\n    case 2:\n  \
    \  cout<<\"Case2: Value is \"<<num<<endl;\n    case 3:\n    cout<<\"Case3: Value\
