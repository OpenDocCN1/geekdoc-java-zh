    # # Formatting Tags


    Texts within an html document can be formatted to different styles, fonts, and
    sizes. The tags to format text, headings, paragraphs, and tables are as follows:


    Bold


    Any text that is written between the <b> and </b> tags is displayed in bold style.
    For example:

    <p><b>Web development is interesting </b></p>

    Output: **Web development** is interesting


    Italic


    Any text that is written between <i> and </i> is displayed in italic style style.
    For example:

    <p><i>Web development is interesting </i></p>

    Output: *Web development* is interesting


