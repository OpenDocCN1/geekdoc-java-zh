  md: "# Types of CSS\n\nThe three main types of CSS are Inline CSS, Internal CSS,\
    \ and External CSS.\n\n# Inline CSS\n\nInline CSS has the CSS property implemented\
    \ in a specific section attached with the element in HTML document. For example:\n\
    \n```\n<html>\n<head>\n  <title>Inline CSS</title>\n</head>\n<body>\n  <p style=\"\
    color:Blue; font-size:50px; font-style:italic; text-align:center;\">\n    Cascading\
    \ Style sheets\n  </p>\n</body>\n</html>\n```\n\nOutput:\n\n![](img/9d932bec53e523b8d8b7b8134cf77ca7_121_0.png)\n\
    \n# Internal CSS\n\nInternal CSS is implemented over a single HTML document to\
    \ give it a unique style. Remember that the rule must be implemented within the\
    \ HTML file in head section.\n\nSyntax for implementing Internal CSS:\n\n```\n\
    <head>\n  <title>Internal css</title>\n  <style>\n    selector{\n      Property:value;\n\
    \    }\n  </style>\n</title>\n```"
  merge: -1
  pgno: 121
- img_proc: true
  md: "</head>\n\n# External CSS\n\nThe External CSS has a separate CSS file which\
    \ includes only one style property along with the tag attributes. External CSS\
    \ file needs to be linked with the HTML document by using the Link tag.\nExample\
    \ of External CSS:\n\n```\nbody {\n  background-color:Green;\n}\n.main {\n  text-align:center;\n\
    }\n.GFG {\n  color:#009900;\n  font-size:50px;\n  font-weight:bold;\n}\n```\n\n\
    # Basic Syntax and Inclusion in HTML\n\nCSS is made up of several style rules\
    \ which are interpreted by the browser and applied over the web page. Generally,\
    \ a style rule is made up of 3 key elements known as Selector, Property, and Value.\n\
    Selector is an HTML tag at which a CSS style can be applied as <h1> whereas Property\
    \ is an attribute of HTML tag such as color. Values are assigned to the properties.\
    \ The basic syntax for creating CSS style rule is defined as follows:\nSelector{property:\
    \ value}\nGenerally, inline and external CSS approaches are used to associate\
    \ styles with the HTML document for which the <style> element is placed inside\
    \ the <head> and </head> tags. The syntax for CSS inclusion in an HTML document\
    \ is defined as follows:\n\n```\n<html>\n<head>\n  <style type=\"text/css\" media=\"\
    all\">\n```"
