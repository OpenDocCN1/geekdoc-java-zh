    elaborate key information in a suitable manner. In HTML, there are predefined
    tags that can be used to create and design tables.


    # ### Tags for Creating Tables in HTML


    To create a table, we can use the following tag:

    <table>......</table>


    Table Rows


    Tag for creating table rows:

    <tr>.../</tr>


    Table Height


    <th>.../</th>. The sample attribute for creating a table to display data is scope
    = "row" and "column" as they define whether the given tag is for row header or
    column header.


    Table data cell

    <td>.../</td>. The attributes for table data cell are colspan = "number" and rowspan
    = "number" for which we need to use the tag along with <th> or <td> elements to
    span cells across multiple rows and columns.


