  md: '# Operators


    Operators are the key aspect of any programming language and are required to perform
    certain operations or logical computations. As they are generally used for mathematical
    calculations, we can solve complex equations by using various expressions in the
    program.


    There are two kinds of operators that are generally used in programming languages:


    +   1. Arithmetic Operators: Operators that are used to conduct mathematical and
    arithmetic operations. For example: +, -, /, --, *.


    +   - Binary Operators: Operators that work with other operands as +, -, /, *.


    +   - Unary Operators: Operators that are used to work with a single operand.
    For example: ++, --.


    +   2. Relational Operators: These are the most commonly used operators that tell
    us whether one operand is equal to another or not. For example: ==, <=, >= >=.


    Here is a table detailing basic operators and their functionality within the program:


    | Operator | Functionality |

    |---|---|n| + | Addition of two operands |

    | - | Subtraction of two operands |

    | / | Division |

    | * | Multiplication |

    | == | Check whether the two operands are equal or not |

    | >= | Check if the left operand is greater than or equal in value as compared
    to the right operand |

    | <= | Check if the left operand is less than or equal in value to the right operand
    |'
