    # Methodologies


    Programming Methodology is the process of analyzing complex problems and planning
    the software development process in order to achieve the best possible solutions.
    Also known as modular programming, the software development process is categorized
    as follows:


    +   1. Requirement gathering


    As is this the first stage in the Software Development Life Cycle process, it
    is performed by experts and professionals who can easily conduct a feasibility
    study for the project. The outcomes and technical approaches are discussed so
    that the project can be completed without any issues.


    +   2. Requirement Engineering


    The next step is to gather the relevant data and define requirements that are
    needed to get the project done. Usually, we have to create a Software Requirement
    Specification (SRS) document that is comprised of all of the essential design
    and development data. The system analyst has to be clear about client requirements
    and needs to give a detailed briefing to the developers so that they can write
    the code accordingly. Usually, the clients are not able to clearly define their
