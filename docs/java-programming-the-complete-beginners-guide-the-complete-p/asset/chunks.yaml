    \        try {\n            a.orElseThrow(NullPointerException::new);\n      \
    \  } catch (Exception e) {\n            lists = list4.stream()\n             \
    \   .flatMap(b -> b.stream())\n                .sorted(Comparator.reverseOrder())\n\
    \                .collect(Collectors.tolist());\n\n            System.out.print(predicate.test(list1.get(0))\n\
    \                && predicate.test(list5.get(list1.size() - 1)));\n        }\n\
    \    }\n}\n```\n\n(A) 输出 true\n(B) 输出 false\n(C) 编译错误\n(D) 运行时异常\n\n## 答案：(A)\
    \ 输出 true\n\n该程序的执行逻辑如下：\n\n1. 创建包含元素 `[1, 2, 3, 4, 5]` 的 `list1`\n2. 创建包含元素 `[1,\
    \ 2]` 的 `list2`\n3. 创建包含元素 `[3, 4, 5]` 的 `list3`\n4. 创建包含元素 `[list2, list3]` 的\
    \ `list4`\n5. 创建 `lists` 为 `null` 并使用方法 `ofNullable()` 将其封装\n6. 抛出 `NullPointerException`\n\
    7. 以反序顺序 `[5, 4, 3, 2, 1]` 将元素赋值给 `lists`\n8. 输出比较结果：`1` 是否等于 `list1` 的第一个元素且\
    \ `lists` 的最后一个元素\n\n––––––––\n\n![image](img/scene_break.png)\n\n## Note：\n\n\
    (1) 方法 `orElseThrow()`\n\n`Optional` 类中的此方法用于处理可空值。在第 12 行，此时 `lists` 为 `null`，因此第\
    \ 14 行抛出了 `NullPointerException`。\n\n如果对象 `a` 为 `null`，此方法会抛出 `NullPointerException`。\n\
    \n此外，你也可以像下面这样不使用方法引用重写第 14 行的代码：\n\n```java\na.orElseThrow(() -> new NullPointerException());\n\
    ```\n\n## (2) 方法 `flatMap()`\n\n此方法将多个集合转换为一个流。它使得合并列表变得简单。\n\n## (3) `Predicate`\n\
    \n第 3、21 和 22 行的代码逻辑非常简单。它比较了 `1` 与 `list1` 的第一个元素以及 `lists` 的最后一个元素。\n\n这是使用\
    \ `Predicate` 接口中 `isEqual()` 方法的方法。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 问题 49\n\n![image](img/chapter_title_below.png)\n\n选择描述该程序编译并运行结果的语句。\n\n```java\n\
    public class Question_49 {\n    private static final String str;\n    private\
    \ static final String[] array;\n\n    static {\n        str = \"a, b,c\";\n  \
    \      array = str.split(\",\");\n    }\n\n    public static void main(String\
    \ args[]) {\n        Arrays.stream(array).forEach(e -> {\n            switch (e)\
    \ {\n                case \"a\":\n                    System.out.print(1);\n \
    \               case \"b\":\n                    System.out.print(2);\n      \
    \          case \"c\":\n                    System.out.print(3);\n           \
    \     default:\n                    System.out.print(4);\n            }\n    \
    \    });\n    }\n}\n```\n\n(A) 输出 123\n(B) 输出 123423434\n(C) 输出 1234123\n(D) 编译错误\n\
    \n### 答案：(B) 输出 123423434\n\n该程序的执行逻辑如下：\n\n1. 初始化 `str` 字段\n2. 遍历数组并使用 `switch`\
    \ 语句\n\n––––––––\n\n![image](img/scene_break.png)\n\n### Note：\n\n(1) `switch`\
    \ 语句\n在第 13 到 22 行没有 `break` 语句。因此执行顺序如下。这就是为什么答案是 (B)。\n\n```java\nswitch (e)\
    \ {\n    case \"a\":\n        System.out.print(1);\n    case \"b\":\n        System.out.print(2);\n\
    \    case \"c\":\n        System.out.print(3);\n    default:\n        System.out.print(4);\n\
    }\n```\n\n如果 `e` 为 \"a\"，它会输出 1 并穿透执行到 2、3、 4。\n如果 `e` 为 \"b\"，它会输出 2 并穿透执行到 3、\
    \ 4。\n如果 `e` 为 \"c\"，它会输出 3 并穿透执行到 4。\n如果 `e` 为默认值，它会输出 4。\n\n# 问题 50\n\n![image](img/chapter_title_below.png)\n\
    \n选择描述该程序编译并运行结果的语句。\n\n```java\npublic class Question_50 {\n    private static\
    \ Predicate<Integer> a = new Predicate<Integer>() {\n        public boolean test(Integer\
    \ b) {\n            return b > 0;\n        }\n    };\n\n    public static void\
    \ main(String args[]) {\n        try {\n            String[] array = {\"12 3 \"\
    , \"123 \"};\n            for (String str : array) {\n                str = str.replace(\"\
    \ \", \"\");\n            }\n            System.out.print(a.test(Integer.parseInt(array[0])));\n\
    \        } catch (Exception e) {\n            System.exit(1);\n        } finally\
    \ {\n            System.out.print(\"done\");\n        }\n    }\n}\n```\n\n(A)\
    \ 输出为空\n(B) 输出 truedone\n(C) 输出 done\n(D) 编译错误或运行时异常\n\n### 答案：(A) 输出为空\n\n该程序的执行逻辑如下：\n\
    \n1. 创建包含元素 `[\"12 3 \", \"123 \"]` 的 `array`\n2. 遍历并将空格替换为空字符串\n3. 终止应用程序\n\n\
    ––––––––\n\n![image](img/scene_break.png)\n\n### Note：\n\n(1) 标准 for 循环、增强 for\
    \ 循环、Stream 的 `forEach`\n\n有三种遍历数组的方法，但只有一种会影响根数据：\n\n```java\nfor (String str\
    \ : array) {\n    str = str.replace(\" \", \"\");\n}\n```\n在增强 for 循环中，`str` 是局部变量，因此重新赋值不会改变数组中的元素。\n\
    \n(2) 停止应用程序的方法\n在第 19 行，使用 `System.exit()` 方法停止应用程序。在这种情况下，`finally` 块不会被执行。\n\
    \n如果你在第 19 行使用 `return;` 代替 `System.exit(1);`，答案是 (C)。\n\n"
