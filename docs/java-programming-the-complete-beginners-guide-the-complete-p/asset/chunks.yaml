  trans: "\n面向对象编程的继承特性在 `Java` 中通过从现有类派生出新类的概念来实现。这允许你重用现有代码。现有类被称为 `superclass`（父类），而派生的类被称为\
    \ `derived class`（派生类）。\n\n## 接口\n\n当两个对象需要相互通信时，则需要在这些对象之间建立一种通信协议。这种通信协议被称为\
    \ `interface`（接口）。这个概念通常用于继承概念的实现。`interface` 用于定义子类必须具备的方法。然而，这些方法是由子类来实现的。\n\
    \n![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# 第 3 章：数据类型\n\n![image](img/chapter_title_below.png)\n\
    \n当我们声明变量时，基本上是在内存中封锁一段空间并给它一个引用名称，以便我们以后访问它并操作其内容。为变量保留的内存数量取决于声明时给出的数据类型。因此，通过给变量赋予不同的数据类型，你可以在内存中为变量保留不同数量的内存。`Java`\
    \ 中有两种主要类型：基本数据类型和对象数据类型。\n\n## 基本数据类型\n\n`Java` 支持八种基本数据类型，每种数据类型都有一个对应的关键字，允许在该数据类型下声明变量。这些数据类型包括——\n\
    \n### byte\n- 最大值 = 127（包含)(2⁷ -1)\n![rsrc1ZJ.jpg](img/image040.jpg)\n- 最小值 =\
    \ -128 (-2⁷)\n![rsrc1ZJ.jpg](img/image040.jpg)\n- 8 位有符号二补码整数\n![rsrc1ZJ.jpg](img/image040.jpg)\n\
    - 默认值 = 0\n![rsrc1ZJ.jpg](img/image040.jpg)\n\n这种数据类型通常用于需要节省内存的情况。`byte` 数据类型用于在大数组中节省空间，主要代替整数，因为\
    \ `byte` 比整数小四倍。\n![rsrc1ZH.jpg](img/image043.jpg)\n\n### Short\n- 最大值 = 32,767（包含）\
    \ (2¹⁵ -1)\n![rsrc1ZH.jpg](img/image043.jpg)\n- 默认值 = 0.\n![rsrc1ZJ.jpg](img/image040.jpg)\n\
    - 最小值 = -32,768 (-2¹⁵)\n![rsrc1ZJ.jpg](img/image040.jpg)\n- 16 位有符号二补码整数\n![rsrc1ZJ.jpg](img/image040.jpg)\n\
    \n这是另一种在需要节省内存时使用的类型。\n![rsrc1ZH.jpg](img/image043.jpg)\n\n### Int\n- 默认值 = 0\n\
    ![rsrc1ZJ.jpg](img/image040.jpg)\n- 最大值 = 2,147,483,647（包含） (2³¹ -1)\n![rsrc1ZH.jpg](img/image043.jpg)\n\
    - 32 位有符号二补码整数。\n- 最小值 = - 2,147,483,648 (-2³¹)\n![rsrc1ZJ.jpg](img/image028.jpg)\
    \ \n\n这是用于所有整数值的默认数据类型。\n![rsrc1ZJ.jpg](img/image040.jpg)\n\n### Long\n- 默认值为\
    \ `0L`\n![rsrc1ZH.jpg](img/image043.jpg)\n- 最小值 = -9,223,372,036,854,775,808(-2⁶³)\n\
    ![rsrc1ZH.jpg](img/image043.jpg)\n- 64 位有符号二补码整数\n- 最大值 = 9,223,372,036,854,775,807（包含）（2⁶³\
    \ -1) 当期望变量持有大数字时使用此。\n![rsrc1ZH.jpg](img/image002.jpg)\n\n### Float\n- 默认值为 `0.0f`\n\
    ![rsrc1ZJ.jpg](img/image040.jpg)\n- 32 位 IEEE 754 浮点数，单精度\n![rsrc1ZH.jpg](img/image043.jpg)\n\
    \n这种数据类型用作存储小数的默认类型。必须避免对需要精度的值使用这种数据类型。\n![rsrc1ZJ.jpg](img/image040.jpg)\n\n\
    ### Double\n- 默认值为 `0.0d`\n![rsrc1ZJ.jpg](img/image040.jpg)\n- 64 位 IEEE 754 浮点数，双精度\n\
    ![rsrc1ZH.jpg](img/image043.jpg)\n\n这种数据类型用作存储小数的默认类型。对于需要精度的值，可以使用这种数据类型。\n![rsrc1J.jpg](img/image040.jpg)\n\
    \n### Boolean\n- 默认值为 `false`\n![rsrc1ZH.jpg](img/image043.jpg)\n- 1 位，可能的值：`true`\
    \ 和 `false`\n这种数据类型用于标记。\n![rsrc1J.jpg](img/image040.jpg)\n\n### Char\n- 最大值 =\
    \ '\\uffff'（或 65535）\n![rsrc1ZH.jpg](img/image043.jpg)\n- 最小值 = '\\u0000'（或 0）\n\
    ![rsrc1J.jpg](img/image040.jpg)\n- 16 位 Unicode 字符\n\n这种数据类型专门用于存储字符。\n![rsrc1ZH.jpg](img/image043.jpg)\n\
    \n### 引用类型\n正如名称所示，引用变量用于访问对象。它们通常通过构造函数创建，一旦定义不可更改。数组和对象都是引用变量。最后，这种情况下默认值为 `null`。\n\
    \n面量用于表示固定值。它们像变量一样声明并具有数据类型。字面量的示例：\n\n`Char x = 'X';`\n\n你可能会注意到不同进制的整数和浮点。根据规则，任何带有\
    \ `0` 前缀的字面值为八进制，而 `0x` 前缀表示十六进制。如果你处理字符串，字符串字面量总是用双引号定义的。另一组你会使用的字符是转义字符。转义字符列表如下：\n\
    \n- 回车 `\\r`\n- 换行 `\\n`\n- 退格 `\\b`\n- 分页 `\\f`\n- 制表符 `\\t`\n- 空格 `\\s`\n- 单引号\
    \ `\\'`\n- 双引号 `\\\"`\n- 十六进制字符 `\\uxxxx`\n- 八进制字符 `\\ddd`\n- 反斜杠 `\\\\`\n\n![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 第 4 章：变量\n\n![image](img/chapter_title_below.png)\n\n变量的最简单定义是给某些内存区域的名称。然而，`Java`\
    \ 支持多种类型的变量。根据变量的类型，决定了以下参数：\n\n- 为变量分配内存的大小。\n![rsrc1ZH.jpg](img/image043.jpg)\n\
    - 锁定内存的布局。\n![rsrc1ZH.jpg](img/image043.jpg)\n- 在变量上执行的操作。\n![rsrc1ZH.jpg](img/image043.jpg)\n\
    - 变量可以持有的值范围。\n![rsrc1ZH.jpg](img/image043.jpg)\n\n根据规则，每个变量在使用之前都需要声明。变量声明的标准语句是：\n\
    \n```\ndata_type variable_name;\n```\n"
- fmt: "\nHere, `data_type` is the data type of the variable while `variable_name`\
    \ is the identifier used for the variable. If you are using multiple variables\
    \ of the same type, you can club them in the same statement by specifying the\
    \ name of the variables in a comma-separated manner. As mentioned previously,\
    \ `java` supports three types of variables namely, class variable, instance variable\
    \ and local variables. This chapter explains these variable types in detail.\n\
    \n## Local Variables\n\nVariables that are declared inside a method or block of\
    \ code are local to the scope and are called local variables. The variable is\
    \ created and when it is declared and defined in the block. moreover, the variable\
    \ is destroyed once the scope of the block gets over. Variables of this type cannot\
    \ make use of access modifiers (described later in this chapter).\n\nSince this\
    \ type of variable is alive only within the scope of the method or block, it can\
    \ only be accessed within this block of code. Internally, local variables are\
    \ created at the stack-level. So, when they are created, they are pushed onto\
    \ stack and as soon as the block finishes execution, the stack is emptied. Lastly,\
    \ the default value for local variables is garbage. So, these variables have to\
    \ be initialized for use.\n\nSample code to illustrate the working of local variables\
    \ has been given below. It implements a local variable `agep` in the method of\
    \ the class, which is accessed from the `main` method.\n\n```java\npublic class\
    \ lvdemo {\n    public void puppyage() {\n        int agep = 0;\n        Agep\
    \ = agep + 10;\n        System.out.println(\"Age of the puppy is : \" + agep);\n\
    \    }\n\n    public static void main(String args[]) {\n        lvdemo testobj\
    \ = new lvdemo();\n        testoobj.puppyage();\n    }\n}\n```\n\nThe output of\
    \ this code has been illustrated in the image shown below.\n\n![rsrc1ZN.jpg](d2d_images/image053.jpg)\n\
    \n## Instance Variables\n\nVariables that are created as part of the class, but\
    \ do not lie within the scope of any method or constructor are referred to as\
    \ instance variable. The reason why these variables are called instance variables\
    \ is that they are created only once the object is created using that class. Therefore,\
    \ these variables are created for every object instantiated for this class using\
    \ the `new` keyword.\n\nMoreover, these variables are destroyed as soon as the\
    \ object is deleted or the program execution terminates. These variables can be\
    \ accessed from the method or constructors implemented for this class. It would\
    \ not wrong to state that instance variables are class-level variables that can\
    \ make use of access modifiers.\n\nThese variables have default values. For instance,\
    \ the default values for all numbers is 0 and that for boolean if false. The object\
    \ references created as reference variables are initialized as `null`. While declaration\
    \ of variables is a must, assignment can be done inside the methods or constructors.\
    \ If you are working inside the same class, you can directly access the variable\
    \ by its name. however, if you wish to access it from any static method, then\
    \ you will need to access it using the format – `Object_name.variable_name`\n\n\
    Sample code has been given below to help you understand this concept better. This\
    \ class implements a class for employees and initializes the variables of the\
    \ class using initialization methods.\n\n```java\nimport java.io.*;\n\npublic\
    \ class demoemployee {\n    public String nameemp;\n    private double salaryemp;\n\
    \n    public demoemployee(String nameemp) {\n        nameemp = nameemp;\n    }\n\
    \n    public void itsalary(double itsal) {\n        salaryemp = itsal;\n    }\n\
    \n    public void private() {\n        System.out.println(\"Employee name = \"\
    \ + nameemp);\n        System.out.println(\"Employee Salary = \" + salaryemp);\n\
    \    }\n\n    public static void main(String args[]) {\n        demoemployee empobj\
    \ = new demoemployee(\"aes\");\n        empobj.itsalary(5000);\n        empobj.private();\n\
    \    }\n}\n```\n\nThe output of this code has been illustrated in the image below.\n\
    \n![rsrc1ZP.jpg](d2d_images/image001.jpg)\n\n## Static Variables\n\nAny variable\
    \ that is declared with `static` is placed with the class, but outside the methods,\
    \ constructors or any other block inside the Class. Only one copy of this variable\
    \ is maintained for the whole class irrespective of objects created for this class.\
    \ Therefore, these variables are also referred to as class variable. As recommendation,\
    \ these variables must not used. however there are scenarios that require such\
    \ implementation. however, whenever such variables are used, you must use them\
    \ as constants, for which values cannot be changed. These variables are created\
    \ when the program starts. however, they are destroyed once the program’s execution\
    \ terminates.\n\nClass variables are visible for all elements of the class. Therefore,\
    \ their visibility is similar to that of instance variables. In fact, the default\
    \ values for class variables are also same as that of instance variables. The\
    \ access to these variables can be made using the following statement – `Class_name.variable_name`\n\
    \nSample code for implementation of static variables is given below.\n\n```java\n\
    import java.io.*;\n\npublic class svdemo {\n    private static double salaryemp;\n\
    \    public static final String department = \"dev \";\n\n    public static void\
    \ main(String args[]) {\n        salaryemp = 1000;\n        System.out.println(department\
    \ + \"Salary = \" + salaryemp);\n    }\n}\n```\n\nThe output of the code can see\
    \ in the image below.\n\n![rsrc1ZR.jpg](d2d_images/image050.jpg)\n\n## Modifier\
    \ Types\n\nThe behavior and access to the variables can be modified using modifiers.\
    \ There are two main types of modifier namely access modifiers and non-access\
    \ modifiers.\n\n### Access Control Modifiers\n\n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n\
    \nJava supports several access levels and each of this level has a corresponding\
    \ keyword for it. These include:\n\n- `public`: ![rsrc1ZH.jpg](d2d_images/image043.jpg)\
    \ Access to everyone\n- `private`: ![rsrc1ZS.jpg](d2d_images/image051.jpg) Access\
    \ to the class\n- `protected`: ![rsrc1ZJ.jpg](d2d_images/image040.jpg) Access\
    \ to the class and its subclasses\n- `default`: ![rsrc1ZK.jpg](d2d_images/image015.jpg)\
    \ If no keyword is mentioned, the variable is accessible to the package.\n\n###\
    \ Non-access Modifiers\n\n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n\nThere are\
    \ other modifiers, which are also available in Java. These include:\n\n- `static`:\
    \ ![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n- `final`: ![rsrc1ZH.jpg](d2d_images/image043.jpg)\n\
    - `abstract`: ![rsrc1ZH.jpg](d2d_images/image043.jpg)\n- `volatile` and `synchronized`:\
    \ ![rsrc1ZH.jpg](d2d_images/image043.jpg)\n"
