    # Introduction


    ![image](d2d_images/chapter_title_below.png)


    ––––––––


    ![image](d2d_images/scene_break.png)


    Hi there! Thank you for downloading this eBook. By doing so, you have made a big
    step in investing in your skills as a computer programmer! This eBook presents
    useful information on Java language suited for beginners. This eBook will then
    serve as an introduction to understanding the Java language and gear you towards
    your goal of becoming a professional computer programmer. I will be teaching you
    how to install the required Java tools and create simple programs in a step-by-step
    way.


    At first glance, Java may come across as a language that will be hard to comprehend.


    After we get started, you will begin to familiarize yourself with the Java environment
    and will quickly discover that it can be quite simple to learn after all! Regardless
    of your experience with programming languages, this guide will lead you in a way
    that is easy to follow. As you expand your knowledge, the more you will appreciate
    the perks of being a Java programmer.


    # Chapter One: History of Java


    ![image](d2d_images/chapter_title_below.png)


    ––––––––


    ![image](d2d_images/scene_break.png)


    This chapter will give you a brief history of how Java software came into life,
    starting from the existence of computers. It will also provide you a brief overview
    of the evolution of the various computer programming languages.


    ## The Birth of Computers'
