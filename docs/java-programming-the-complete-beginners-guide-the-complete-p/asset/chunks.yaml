  trans: "\n\n为了帮助你理解这个概念，让我们来看一个例子。假设我们创建了一个名为 `car` 的类。`Car` 是所有四轮小型车辆的通用术语。然而，每辆汽车都有一套不同的规格，如\
    \ `brand`、颜色、引擎、`transmission` 类型和功能。这些功能是可以被修改的。例如，你可能会更改颜色或增强某项功能。\n\n因此，`car`\
    \ 是一个模板（在我们的情况下是一个类），但具体的汽车是该类的对象或实例。规格集是变量，而我们对这些变量执行的任何初始化或操作都是通过方法完成的。\n\n\
    这个例子也可以很好地用于理解面向对象的两个原则：封装和抽象。类将变量和方法封装在它内部。因此，作为用户，你处理的仅有 `car` 类，而它的实现细节对你是隐藏的。这就是\
    \ `java` 实现抽象的方式。\n\n学习编程的最好方法是编写程序。因此，我们在下文中为你提供了一个示例程序供你尝试。我们还将使用这个程序来解释 `java`\
    \ 编程语言的基本语法。\n\n```java\npublic class sampleJava { // 这一程序将在屏幕上打印 hello World!\
    \ \n\n    public static void main(String []args) {\n\n        System.out.println(\"\
    hello World!\"); // 打印语句\n\n    }\n}\n```\n\n为了编写、编译和运行此程序，你需要按照下面的说明进行——\n\n\
    使用任何文本编辑器，创建一个文本文件并将代码复制到其中。将文件保存为 `sampleJava.java`。\n\n![rsrc1ZH.jpg](img/image002.jpg)![rsrc1ZJ.jpg](img/image028.jpg)\n\
    \n使用 IDE 编译并运行代码。对于手动执行，你需要输入以下命令：\n\n![rsrc1ZJ.jpg](img/image040.jpg)\n\n```bash\n\
    javac sampleJava.java\n```\n\n![rsrc1ZK.jpg](img/image015.jpg)\n\n```bash\njava\
    \ sampleJava\n```\n\n![rsrc1ZK.jpg](img/image015.jpg)\n\n第一个命令将从 java 文件创建一个类文件，而第二个命令将执行程序以产生所需的结果。代码的示例运行已在所示的图片中说明。\n\
    \n![rsrc1ZM.jpg](img/image056.jpg)\n\n如果你已经到了这里，说明你成功执行了你的第一个 java 程序。现在是时候检查程序了，看看我们是如何写它的以及为什么它会给出那个结果。\n\
    \n首先，在 java 中编写程序需要遵循一些约定。这些约定列如下——\n\n`java` 是一种区分大小写的语言。换句话说，`class` 和 `Class`\
    \ 在 `java` 中是两个不同的单词。在程序中使用关键字或任何其他元素时要务必小心。\n\n![rsrc1ZH.jpg](img/image043.jpg)\n\
    \n按照约定，类名中每个单词的首字母应该大写。例如，如果类名是 `car`，那么 `c` 应该是大写的。反之，如果类名是 `Sportscar`，那么 `S`\
    \ 和 `c` 必须大大写，因为它们都是组成类名称的两个单词的首字母。\n\n![rsrc1ZH.jpg](img/image043.jpg)\n\n方法名也遵循大小写约定，即方法名的首字母必须是小写。然而，如果名称是多个单词，除了第一个单词外，其他每个单词的首字母都必须大写。例如，如果方法名是\
    \ `add`，`a` 必须是小写的；但如果方法名是 `addOn`，则 `a` 是小写的而 `N` 是大写的。\n\n![rsrc1ZJ.jpg](img/image040.jpg)\n\
    \njava 文件名必须与类名相同，并以 `.java` 结尾。例如，如果你的类名是 `sampleApplication`，那么 java 文件名必须是\
    \ `sampleApplication.java`。还要记住字母的大小必须匹配。如果你不符合任何这些要求，你将无法编译程序。\n\n![rsrc1ZJ.jpg](img/image040.jpg)\n\
    \njava 程序的执行从 `main` 方法开始。因此，每个 java 程序都必须有一个 `main` 方法，而 java 编程中的 `main` 方法定义为：\n\
    \n![rsrc1ZJ.jpg](img/image040.jpg)\n\n```java\npublic static void main(String\
    \ args[])\n```\n\n但再次强调，如果你的程序没有 `main` 方法，程序将无法运行。\n\n## 标识符\n\n任何编程语言由英语单词组成。其中一些单词是编程语言语法的一部分，而另一些则是变量名、类和方法的自定义名称。属于语法部分的单词被称为关键字。另一方面，所有用户定义的名称都称为标识符。\n\
    \n关于 java 有一些需要知道并记住的重要事项。这些包括——赋予标识符的名字可以以字母（小写或大写）以及特殊字符开头——下划线 `_` 和货币符号 `$`。这意味着标识符名称不能以任何其他特殊字符开头。\n\
    \n![rsrc1ZJ.jpg](img/image040.jpg)\n\n不允许将定义的关键字作为标识符。\n\n![rsrc1ZJ.jpg](img/image040.jpg)\n\
    \n最后，始终记住 java 是区分大小写的，`count` 和 `Count` 是两个不同的标识符。\n\n## 修饰符\n\n类、方法和变量只能通过修饰符进行修改。修饰符有两种类型，如下：\n\
    \n访问修饰符：`static`、`abstract`、`final` \n访问修饰符：`public`、`default`、`private`、`protected`\n\
    \n![rsrc1ZH.jpg](img/image002.jpg)![rsrc1ZJ.jpg](img/image028.jpg)\n\n访问修饰符决定了类、方法或变量如何被访问，以及谁有权访问它们。其他类似的类似的被分类为非访问修饰符。\n\
    \n## 变量\n\nJava 支持三种变量：类变量、局部变量和实例变量。类变量也被静态变量，实例变量被称为非静态变量。\n\n## 数组\n\n相同类型元素的集合称为数组。Java\
    \ 支持不同类型的数组。\n\n## 枚举\n\n某些变量只能包含几个值。作为程序员，你可能希望限制变量获取其他值。其中一种变量是 `enum`，它是在 java\
    \ 5.0 中引入的。可以在类内部或外部定义枚举。此外，枚举可以拥有构造函数、变量和方法。\n\n## 关键字\n\njava 编程语言的一部分且不能作为标识符使用的单词被称为关键字。这些关键字是——\n\
    \n| assert | abstract | break | boolean |\n| :--- | :--- | :--- | :--- |\n| catch\
    \ | char | byte | case |\n| const | class | default | continue |\n| else | enum\
    \ | do | double |\n| final | extends | float | finally |\n| if | implements |\
    \ for | goto |\n| instanceof | import | interface | int |\n| new | package | long\
    \ | native |\n| protected | private | return | public |\n| strictfp | super |\
    \ short | static |\n| synchronized | switch | throw | this |\n| try | void | throws\
    \ | transient |\n| while | volatile | | |\n\n"
- fmt: "\nThe inheritance characteristic of object-oriented programming is implemented\
    \ in `Java` using the concept of deriving a new class from an existing class.\
    \ This allows you to reuse existing code. The existing class is called a `superclass`\
    \ while the derived class is referred to as a `derived class`.\n\n## Interfaces\n\
    \nIn case two objects need to communicate with each other, the protocol of communication\
    \ needs to be established between these objects. This protocol of communication\
    \ is called an `interface`. This concept is usually used in the implementation\
    \ of the inheritance concept. An `interface` is used to define the methods that\
    \ a subclass must have. however, it is the subclass that implements those methods.\n\
    \n![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Chapter 3: data types\n\
    \n![image](d2d_images/chapter_title_below.png)\n\nWhen we declare variables, we\
    \ basically block space in the memory and give it a reference name so that we\
    \ can access it later and manipulate its contents. The amount of memory reserved\
    \ for a variable depends on the data type given at the time of declaration. Therefore,\
    \ by giving different data types to variables, you can reserve different amounts\
    \ of memory for the variable in the memory. There are two main types in `Java`,\
    \ which are primitive datatypes and object datatypes.\n\n## Primitive data types\n\
    \n`Java` supports eight primitive data types and there is a keyword corresponding\
    \ to each of these data types to allow declaration of variables under this data\
    \ type. These data types include –\n\n### byte\n- maximum value = 127 (inclusive)(2^7\
    \ -1)\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n- minimum value = -128 (-2^7)\n\
    ![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n- 8-bit signed 2’s complement integer\n\
    ![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n- default value = 0\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n\
    \nThis data type is generally used in cases where memory is to be saved. `byte`\
    \ data type is used to save space in large arrays, mainly in place of integers,\
    \ since a `byte` is four times smaller than an integer.\n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n\
    \n### Short\n- maximum value = 32,767 (inclusive) (2^15 -1)\n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n\
    - default value = 0.\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n- minimum value\
    \ = -32,768 (-2^15)\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n- 16-bit signed\
    \ 2’s complement integer\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n\nIt is another\
    \ data type that is used when memory saving is desired.\n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n\
    \n### Int\n- default value = 0\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n- maximum\
    \ value = 2,147,483,647(inclusive) (2^31 -1)\n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n\
    - 32-bit signed 2’s complement integer. \n- minimum value = - 2,147,483,648 (-2^31)\n\
    ![rsrc1ZJ.jpg](d2d_images/image028.jpg) \n\nThis is the default data type used\
    \ for all integral values.\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n\n### Long\n\
    - default value is `0L`\n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n- minimum value\
    \ = -9,223,372,036,854,775,808(-2^63)\n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n\
    - 64-bit signed 2’s complement integer\n- maximum value = 9,223,372,036,854,775,807\
    \ (inclusive)(2^63 -1) this is used when the variable is expected to hold large\
    \ numbers.\n![rsrc1ZH.jpg](d2d_images/image002.jpg)\n\n### Float\n- default value\
    \ = `0.0f`\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n- 32-bit IEEE 754 floating\
    \ point, single precision\n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n\nThis data\
    \ type is used as the default data type for storing point numbers. The use of\
    \ this data type for values that require precision must be avoided.\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n\
    \n### Double\n- default value = `0.0d`\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n\
    - 64-bit IEEE 754 floating point, double precision\n\nThis data type is used for\
    \ variables that need to store decimal values. like float, the value of variables\
    \ using double vary. Thus, these data types are not used for critical calculations\
    \ like currency.\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n\n### Boolean\n- default\
    \ value = `false`\n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n- 1-bit, possible\
    \ values: `true` and `False`\nThis data type is used for flags.\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n\
    \n### Char\n- maximum value = `'\\uffff'` (or 65,535)\n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n\
    - minimum value = `'\\u0000'` (or 0)\n![rsrc1ZJ.jpg](d2d_images/image043.jpg)\n\
    - 16-bit Unicode character\n\nThis data type is specifically used for storing\
    \ characters.\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n\n### Reference data types\n\
    As the name suggests, reference variables are used for accessing an object. They\
    \ are usually created using constructors and their type, once defined, cannot\
    \ be changed. Array variables and objects are reference variables. Lastly, the\
    \ default value in this case is `null`.\n\n## Java Literals\n\nLiteral is used\
    \ to represent a fixed value. They are declared like variables and have a data\
    \ type. Sample declaration of a literal –\n\n`Char x = 'X';`\n\nYou may notice\
    \ integers and float with different bases. As a rule, any literal value that has\
    \ `0` prefix is octal numbers while if `0x` prefix indicates hexadecimal. If you\
    \ are working with strings, the string literals are always defined as sequence\
    \ of characters enclosed with double quotes. Another set of characters that you\
    \ will work with is escape characters. A list of escape characters has given below\
    \ –\n\n- Carriage Return `\\r`\n- Newline `\\n`\n- Backspace `\\b`\n- Formfeed\
    \ `\\f`\n- Tab `\\t`\n- Space `\\s`\n- Single quote `\\'`\n- Double quote `\\\"\
    `\n- Hexadecimal character `\\uxxxx`\n- Octal character `\\ddd`\n- Backslash `\\\
    \\`\n\n![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Chapter 4: Variables\n\
    \n![image](d2d_images/chapter_title_below.png)\n\nThe simplest definition of a\
    \ variable is that it is a name given to some memory area. however, there are\
    \ many types of variables, which `Java` supports. On the basis of the type of\
    \ variable, the following parameters are determined –\n\n- Size of memory blocked\
    \ for the variable.\n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n- Layout of the\
    \ blocked memory.\n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n- Operations that\
    \ can be performed on the variable.\n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n\
    - Range of values that the variable can hold.\n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n\
    \nAs a rule, every variable needs to be declared before use. The standard statement\
    \ for variable declaration is –\n\n```\ndata_type variable_name;\n```\n"
