    # 引言


    ![image](img/chapter_title_below.png)


    本书面向 Java 学习者，特别是初学者和中级学习者。本书涵盖了以下内容。Java 版本为 8。


    `String/Integer/Long/Exception/static initializer/ constructor/File/Files/Zip/Properties/StringBuilder/
    LocalDateTime//Random/Array/ArrayList/HashMap/LinkedHashMap/ Functional Interface/Lambda/Stream/Objects/Optional/etc...`


    ––––––––


    ![image](img/scene_break.png)


    学习了基本概念和语法后，下一步是阅读和理解代码。本书中的代码包含了上述类中各种方法。


    共有 50 个问题。开始时问题较简单，但到最后难度会逐渐增加。


    ––––––––


    ![image](img/scene_break.png)


    本书的主要目的是提高代码阅读的理解能力，而不是详细的语法理论之类的内容。


    请注意，为了教学目的，书中包含一些干扰性问题（在实际开发领域中不推荐）。


