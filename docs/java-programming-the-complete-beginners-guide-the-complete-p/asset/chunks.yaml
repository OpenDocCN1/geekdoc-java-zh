    \ return\n```\n\nThe source code can be saved in a file named `Company.java` and\
    \ the compiler probably puts the Java bytecode in another file named `Company.class`.\
    \ You even need a tool to display a text-like version of a Java bytecode file\
    \ (you can use Ando Saabas’s Java Bytecode Editor). If you try open the code of\
    \ the `Company.class` file using Notepad or even Microsoft Word, you will only\
    \ see gibberish characters like dots, squiggles and more.\n\n## Java Virtual Machine\
    \ (JVM)\n\nIf the compiler is responsible for writing the Java bytecode, then\
    \ the Java Virtual Machine is in-charge of deciphering it. In reality, each kind\
    \ of computer processor has its own set of executable instructions that are interpreted\
    \ by each operating system in a slightly different way. Let’s take a look at the\
    \ two programs below for two different processors but will display the same output\
    \ on the computer screen – “Hello world!”.\n\n### Simple Program- Pentium Processor\n\
    \n![image](d2d_images/scene_break.png)\n\n```assembly\n.data msg:\n.ascii “Hello,\
    \ world!\\n” len = . - msg\n.text\n.global _start\n_start:\nmovl $len,%edx movl\
    \ $msg,%ecx movl $1,%ebx movl $4,%eax int $0x80\nmovl $0,%ebx movl $1,%eax int\
    \ $0x80\n```\n\n### Simple Program- Powerpc Processor\n\n.data msg:\n\n![image](d2d_images/scene_break.png)\n\
    \n```assembly\n.text\n_start:\n.string “Hello, world!\\n” len = . - msg\n.global\
    \ _start\nli 0,4\nli 3,1\nlis 4,msg@ha addi 4,4,msg@l li 5,len\nsc\nli 0,1\nli\
    \ 3,1\nsc\n```\n\nThese two programs ought to display the same results but they\
    \ cannot be interchanged, for the instructions will mean nothing when they are\
    \ run by the wrong processor. You will either get notification or error messages\
    \ like “Not a valid Win32 application” or “Windows can’t open this file.” That\
    \ is why, with the help of Java Virtual Machine, these Java bytecodes create order\
    \ in this chaotic world of programming! JVM acts like an interpreter that translates\
    \ those bytecodes for any computer system to comprehend. Thus, you do not have\
    \ to worry because whether it is your computer or your friend’s one, both will\
    \ be able to run the bytecode. Thus, Java language has solved the issue of portability\
    \ and versatility through JVM.\n\n## Integrated Development Environment\n\nThe\
    \ early days of Java programming involved several windows – one for typing the\
    \ code, another for running, and maybe a third to keep track of all. With the\
    \ emergence of integrated development environment (IDE) all were seamlessly combined\
    \ into a single. Below are some of the most popular IDEs:\n\n1. **Eclipse** (eclipse.org)\n\
    \   ![image](d2d_images/scene_break.png)\n   Regarded as one of the most popular\
    \ because of its interactive features, Eclipse is open source.\n\n2. **NetBeans**\
    \ (netbeans.org)\n   Just like the previous, this open source is recommended and\
    \ supports all Java.\n\n3. **BlueJ** (bluej.org)\n   BlueJ has the simplest interface\
    \ and is specifically designed to help novice understand Java.\n\n4. **DrJava**\
    \ (drjava.org)\n   ![image](d2d_images/scene_break.png)\n   DrJava was also designed\
    \ for amateur programmers. Despite its simplicity, it is still powerful.\n\n5.\
    \ **Java Development Kit** (JDK)\n   The Java Development Kit is a tool that acts\
    \ as both a compiler and an interpreter. The latest version can be downloaded\
    \ from Oracle’s website. Ensure that you download the appropriate version for\
    \ your computer. If you are using a 32-bit operating system, then download the\
