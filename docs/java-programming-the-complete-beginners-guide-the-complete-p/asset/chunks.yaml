  trans: "\n\n此外，`Object` 类型封装了所有类型，因此可以设置 `1L` 和 `\"String\"`。\n\n### (2) Optional\n\
    \n`Optional` 类型用于可能为空的对象。它封装了该对象。\n\n### <method ofNullable()>\n\n`method1` 的参数可能为\
    \ null，因此使用了该方法。如果参数可能为 null，你可以使用 `of()` 代替。\n\n### <method orElse()>\n\n此方法用于处理可空的值。\n\
    \n如果你使用 `if` 语句，你必须编写如下所示的代码，而不是第 19 行的代码。\n\n```java\nif (object != null) {\n\
    \    System.out.println(object);\n} else {\n    System.out.println(\"output\"\
    );\n}\n```\n\n# Question 30\n\n选择一个描述编译并运行上述程序后结果的语句。\n\n```java\npublic class\
    \ Question_30_1 {\n  private Long a;\n  public Long getA() { return a; }\n  public\
    \ void setA(Long a) {this.a= a; }\n}\n\npublic class Question_30_2 {\n  public\
    \ static void main(String[] args) {\n    Question_30_1 a = new Question_30_1();\n\
    \    Question_30_1 b = new Question_30_1();\n\n    a.setA((long) 1); \n    b.setA(Long.valueOf(2));\n\
    \    List<Question_30_1> list= Arrays.asList(a, b); \n    method1(list);\n  }\n\
    \n  public static void method1(List<Question_30_1> list) {\n    list.forEach(new\
    \ Consumer<Question_30_1>() {\n      public void accept(Question_30_1 object)\
    \ {\n        System.out.print(object.getA());\n      }\n    });\n  }\n}\n```\n\
    \n(A) output 12\n(B) output 1212\n(C) 编译错误\n(D) 运行时异常\n\n**Answer : (A) output\
    \ 12**\n\n该程序的逻辑如下：\n1. 创建两个只有一个字段的 `Class` 实例\n2. 为它们的每个值赋值\n3. 创建一个包含这些实例的列表\n\
    4. 输出列表中每个元素的每个字段\n\n**Notes：**\n(1) 转换为 `Long`\n有三种将对象转换为 `long` 的简单方法：\n1. `(long)\
    \ object`\n2. `Long.valueOf(object)`\n3. `new Long(object)`\n方法 2 和 3 都是 `Long`，但方法\
    \ 1 是 `long`。Java 编译器会自动将其转换为 `Long`。\n\n(2) `Consumer`\n这是 Java 8 中的函数式接口之一。该方法没有返回值，类型为\
    \ `void`。\n在代码第 14 到 18 行中，它不是 lambda 表达式。\n你可以像下面用 lambda 表达式重写：\n```java\nlist.forEach(e\
    \ -> System.out.print(e.getA()));\n```\n或者：\n```java\nlist.forEach(e -> {\n  System.out.print(e.getA());\n\
    });\n```\n\n# Question 31\n\n选择一个描述编译并运行此程序后结果的语句。\n\n```java\npublic class Question_31\
    \ {\n  public static void main(String[] args) {\n    Long a= 100L;\n    Integer\
    \ b = 100;\n    if (Integer.compare(a.intValue(), b) == 0 && b instanceof Integer)\
    \ {\n      try {\n        String str = null; \n        Objects.requireNonNull(str,\
    \ \"ABC\");\n      } catch (NullPointerException e) {\n        System.out.println(e.getMessage());\n\
    \      }\n    }\n  }\n}\n```\n\n(A) 什么都不输出\n(B) 输出 ABC\n\n**Answer : (B) output\
    \ ABC**\n\n这段代码的重点在于：\n1. `Integer.compare` 的作用\n2. `Objects.requireNonNull` 的作用\n\
    \n**Notes：**\n(1) `Integer.compare()`\n该方法使用两个参数，并比较第一个参数是否等于、大于或小于第二个参数。它返回 `int`。返回值如下：\n\
    - 参数相等：0\n- 第一个大于第二个\n- 第一个小于第二个：-1\n所以，此代码在第 7 行的返回值为 `true`。\n\n(2) `Objects.requireNonNull()`\n\
    第 13 行的此方法使用了两个参数。它检查第一个参数是否为 null，如果是，则抛出 `NullPointerException`。第二个参数用于消息，因此这段代码输出了\
    \ `ABC`。\n然而，有一重要的一点：如果你将第 17 行的代码重写为 `System.out.println(\"Java\");`，则这段代码将输出\
    \ `\"Java\"`。第二个参数影响 `NullPointerException` 对象的消息字段，但上面的代码没有使用它。\n\n# Question\
    \ 32\n\n选择一个描述编译并运行此程序后结果的语句。\n\n```java\npublic class Question_32 {\n  public\
    \ static void main(String[] args) {\n    List<Integer> list1 = Arrays.asList(1,\
    \ 2, 3);\n    List<Integer> list2 = Arrays.asList(4, 5, 6);\n    List<List<Integer>>\
    \ list3 = Arrays.asList(list1, list2);\n    method1(list3).forEach(System.out::print);\n\
    \  }\n\n  private static List<Object> method1(List<List<Integer>> list) {\n  \
    \  return list.stream()\n      .flatMap(e -> e.stream())\n      .sorted(Comparator.reverseOrder())\n\
    \      .collect(Collectors.toList());\n  }\n}\n```\n\n(A) output 123456\n(B) output\
    \ 654321\n\n**Answer : (B) output 654321**\n\n该程序的功能：\n1. 创建存储 `Integer` 元素的列表\n\
    2. 创建包含这些元素的列表\n3. 将反序排序列表中的元素\n4. 输出它们\n\n**Notes：**\n(1) `flatMap()`\n此方法将多个集合转换为一个流。它可以方便合并列表，例如。在此代码中，第\
    \ 8 行有一个列表。\n在 `list3` 中：\n- `[1, 2, 3]`\n- `[4, 5, 6]`\n使用 `flatMap()` 和 `sorted()`\
    \ 之后：`(6, 5, 4, 3, 2, 1)`\n\n(2) 方法引用\n第 10 行的 `method1(list3).forEach(System.out::print);`\
    \ 使用了方法引用。你可以以此简化代码。\n如果你将其重写为 lambda，看起来像：\n```java\nmethod1(list3).forEach(e\
    \ -> System.out.print(e));\n```\n\n# Question 33\n\n选择一个描述编译并运行此程序后结果的语句。\n\n\
    ```java\npublic class Question_33 {\n  public static void main(String[] args)\
    \ {\n    String str = \"JAVA\";\n    try {\n      throw new NumberFormatException();\n\
    \    } catch (NullPointerException e) {\n      return;\n    } catch (Exception\
    \ e) {\n      Predicate<Long> a = Predicate.isEqual(2L);\n      if (a.test(10L))\
    \ {\n        str.replace(\"JAVA\", \"ABC\");\n      } else {\n        str.replace(\"\
    JAVA\", \"\");\n      }\n    }\n    System.out.println(str.length());\n  }\n}\n\
    ```\n\n(A) 输出 0\n(B) 输出 3\n(C) 输出 4\n(D) 编译错误或运行时异常\n\n**Answer : (C) output 4**\n\
    \n这段代码逻辑如下：\n1. 初始化 `str`\n2. 显式抛出 `NumberFormatException`\n3. 第二个 catch 块，替换\
    \ `str`\n4. 输出 `str` 的长度\n\n**Notes：**\n(1) 显式抛出异常\n显式抛出异常看起来有点奇怪，但不会导致任何错误。\n\
    第 8 行抛出的异常是 `NumberFormatException`，所以第一个 `catch` 块不会被执行。\n\n"
