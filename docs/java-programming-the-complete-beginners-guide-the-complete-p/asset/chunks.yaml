  trans: "\n\n所有的文件操作都由 `java.io` 包下的 Java 支持，这些函数的实现基于流（Streams）的概念。流简单来说就是数据的序列，它分为两种类型，即\
    \ `inputStream` 和 `outputStream`。前者用于读取数据，后者用于写入数据。\n\n## 字节流\n\nJava 支持的第一种流是字节流。限制在\
    \ 8 字节大小的 I/O 操作属于这一类。在开始编码之前，你需要意识到用于执行输入和输出的类分别是 `FileInputStream` 和 `FileOutputStream`。现在让我们来看将一个文件的内容复制到另一个文件的示例。\n\
    \n```java\nimport java.io.*;\n\npublic class copyfilebs {\n    public static void\
    \ main(String args[]) throws IOException {\n        FileInputStream inputfile\
    \ = null;\n        FileOutputStream outputfile = null;\n        try {\n      \
    \      inputfile = new FileInputStream(\"in.txt\");\n            outputfile =\
    \ new FileOutputStream(\"out.txt\");\n            int i;\n            while ((i\
    \ = inputfile.read()) != -1) {\n                outputfile.write(i);\n       \
    \     }\n        } finally {\n            if (inputfile != null) {\n         \
    \       inputfile.close();\n            }\n            if (outputfile != null)\
    \ {\n                outputfile.close();\n            }\n        }\n    }\n}\n\
    ```\n\n在类文件相同的文件夹中保留名为 `in.txt` 的输入文件，并执行代码查看其作用。\n\n## 字符流\n\n从 8 位数据操作转移到 16\
    \ 位 Unicode 数据操作，我们需要从二进制流切换到字符流。用于执行输入和输出的类分别是 `FileReader` 和 `FileWriter`。上面的代码可以修改如下以使用字符流。\n\
    \n```java\nimport java.io.*;\n\npublic class copyfilecs {\n    public static void\
    \ main(String args[]) throws IOException {\n        FileReader inputfile = null;\n\
    \        FileWriter outputfile = null;\n        try {\n            inputfile =\
    \ new FileReader(\"in.txt\");\n            outputfile = new FileWriter(\"out.txt\"\
    );\n            int i;\n            while ((i = inputfile.read()) != -1) {\n \
    \               outputfile.write(i);\n            }\n        } finally {\n   \
    \         if (inputfile != null) {\n                inputfile.close();\n     \
    \       }\n            if (outputfile != null) {\n                outputfile.close();\n\
    \            }\n        }\n    }\n}\n```\n\n在类文件相同的文件夹中保留名为 `in.txt` 的输入文件，并执行代码查看其作用。\n\
    \n## 标准流\n\n为了允许用户从键盘输入输入并在屏幕上打印输出，Java 支持标准流——\n\n- `System.in` 代表标准输入流，允许用户通过键盘提供输入。\n\
    ![rsrc1ZH.jpg](img/image043.jpg)\n- `System.out` 代表标准输出流，允许用户在屏幕上获取输出。\n![rsrc1ZH.jpg](img/image043.jpg)\n\
    - `System.err` 代表标准错误流，允许用户获取系统的错误消息。\n![rsrc1ZJ.jpg](img/image040.jpg)\n\n提供的示例程序允许系统从用户获取输入并将输入的内容打印到屏幕上，直到用户按下‘q’键后程序退出。\n\
    \n```java\nimport java.io.*;\n\npublic class ssddemo {\n    public static void\
    \ main(String args[]) throws IOException {\n        InputStreamReader inputc =\
    \ null;\n        try {\n            inputc = new InputStreamReader(System.in);\n\
    \            System.out.println(\"Enter characters, 'q' to quit.\");\n       \
    \     char char;\n            do {\n                char = (char) inputc.read();\n\
    \                System.out.print(char);\n            } while(char != 'q');\n\
    \        } finally {\n            if (inputc != null) {\n                inputc.close();\n\
    \            }\n        }\n    }\n}\n```\n\n可以执行此程序来查看输出是什么以及代码的工作原理。\n\n# 异常处理\n\
    \n异常是任何程序无法处理的意外事件。显然，在这种情况下，程序的正常执行流受到干扰，程序可能会因错误终止或表现异常。这就是为什么异常需要由程序处理的原因。\n\
    \n那么，为什么会发生异常？异常的发生可能是由于一系列原因。导致这种情况的一些场景包括：\n- 无效的数据输入 ![rsrc1ZH.jpg](img/image043.jpg)\n\
    - 程序正尝试打开指定位置不存在的文件 ![rsrc1Z.jpg](img/image040.jpg)\n- JVM 内存不足 ![rsrc1Z.jpg](img/image040.jpg)\n\
    - 正在进行通信且系统丢失连接 ![rsrc1ZJ.jpg](img/image040.jpg)\n\n显然，异常可能由于系统、用户产生的问题或程序层的问题引起。基于这一观察，创建了三类异常。这三类异常已在章节中讨论。\n\
    \n## 编译异常\n\n在编译时由编译器检查并报告的异常称为编译异常（Checked Exceptions）。这些异常是编译时异常，需要在编写代码时进行处理。\n\
    \n处理此类异常的示例如下面的代码所示：\n\n```java\nimport java.io.File;\nimport java.io.FileReader;\n\
    \npublic class demoh {\n    public static void main(String args[]) {\n       \
    \ File file = new File(\"E://samplefile.txt\");\n        FileReader infile = new\
    \ FileReader(file);\n    }\n}\n```\n\n如果在创建文件时指定的路径不存在，编译器将抛出 `FileNotFoundException`。\n\
    \n## 非编译异常\n\n某些异常是在运行时发生的。此类异常被称为非编译异常（Unchecked Exceptions）或运行时异常。逻辑错误、程序 Bug\
    \ 和不当使用都是此类错误的示例。此类错误的一个重要特征是它们在编译时不会被检测。\n\n为了帮助理解什么是运行时错误，让我们来看一个例子。假设你在程序中实现了一个包含\
    \ 5 个元素的数组。然而，代码访问了第 6 个元素。此错误将在运行时检测，系统将生成 `ArrayIndexOutOfBoundsException`。\n\
    \n## 错误\n\n某些异常是系统或程序员无法控制的。此类错误的一个常见例子是 `stackOverflowError`。对于这些错误你几乎无法做什么，因此最好忽略它们。当它们发生时，会中断程序的执行，但无能为力。\n\
    \n## 异常体系\n\nJava 有一个名为 `java.lang.Exception` 的内置类，所有异常都属于该类。所有异常类都是该类的子类。此外，`Throwable`\
    \ 是异常类的父类。`Throwable` 的另一个子类是 `Error` 类。上述所有栈溢出错误都属于这个 `Error` 类。\n\nException\
    \ 类有两个子类，分别为 `RuntimeException` 和 `IOException`。以下是 `Throwable` 类中提供的定义的方法列表：\n\
    \n- `String getMessage()`：调用时，该方法返回所遇到的异常的详细描述。\n- `Throwable getCause()`：该方法被调用时返回一个包含异常原因的消息。\n\
    - `String toString()`：该方法返回类名以及异常的详细描述。\n- `void printStackTrace()`：通过调用此方法可以将\
    \ `toString()` 的结果以及堆栈轨迹打印到标准错误流（`System.err`）。\n- `StackTraceElement[] getStackTrace()`：返回堆栈轨迹元素的数组。\n\
    \n"
- fmt: "\nThere may be some scenarios where you may need to access different elements\
    \ of the stack trace. This method returns an array, with each element of the stack\
    \ trace saved to different elements of the array. The first element of array contains\
    \ the top element of the stack trace while the bottom of the stack trace is saved\
    \ to the last element of the array.\n\n`public throwable fillstacktrace()`\n\n\
    Appends the previous information in the stack trace with the current contents\
    \ of the stack trace and returns the same as a array.\n\n## Catching Exceptions\n\
    \nThe standard method to catch an exception is using the `try` and `catch` keywords\
    \ along with their code implementations. This try and catch block needs to be\
    \ implemented in such a manner that it encloses the code that is expected to raise\
    \ an exception. It is also important to mention here that the\n\nCode that is\
    \ expected to raise an exception is termed as protected code. The syntax for try\
    \ and catch block implementation is as follows –\n\n```\nTry {\n    /*Protected\
    \ code*/\n}catch(Exception exc1) {\n    /*catch code*/\n}\n```\n\nThe code that\
    \ is expected to raise an exception is placed inside the try block. If the exception\
    \ is raised, then the corresponding action to be performed for exception handling\
    \ is implemented in the catch block. It is imperative for every try block to either\
    \ have a catch block or a finally block.\n\nAs part of the catch statement, the\
    \ exception, which is expected to be raised needs to be declared. In the event\
    \ that an exception occurs, the execution is transferred to the catch block. If\
    \ the raised exception matches the exception defined in the catch block, the catch\
    \ block is executed.\n\nA sample implementation of the try and catch block is\
    \ given below. The code implements an array with 2 elements. however, the code\
    \ tries to access the third element, which does not exist. As a result, an exception\
    \ is raised.\n\n```java\nimport java.io.*;\n\npublic class demoexception {\n \
    \   public static void main(String args[]) {\n        Try {\n            int arr[]\
    \ = new int[2];\n            System.out.println(\"Accessing the 3 (rd) element\
    \ of the array:\" + arr[3]);\n        }catch(ArrayIndexOutOfBoundsException exp)\
    \ {\n            System.out.println(\"catching Exception:\" + exp);\n        }\n\
    \        System.out.println(\"Reached outside catch block\");\n    }\n}\n```\n\
    \nThe output of this code is shown in the image below.\n\n![rsrc206.jpg](d2d_images/image018.jpg)\n\
    \n## Implementing multiple catch blocks\n\nA block of code may lead to multiple\
    \ exceptions. In order to cater for this requirement, implementation of multiple\
    \ catch blocks is also allowed. The syntax for such implementation is given below.\n\
    \n```java\nTry {\n    /*Protected code*/\n}catch(Exptype1 exp1) {\n    /*catch\
    \ block 1*/\n}catch(Exptype2 exp2) {\n    /*catch block 2*/\n}catch(Exptype3 exp3)\
    \ {\n    /*catch block 3*/\n}\n```\n\nThe syntax shown above has illustrated the\
    \ implementation of three catch blocks. however, you can implement as many catch\
    \ blocks as you want. When this code is executed, the protected is executed. If\
    \ an exception occurs, the type of exception is matched with the exception of\
    \ the first catch block. however, if the exception type does not match, the catch\
    \ block 1 is ignored and the exception type for the second catch block is tried\
    \ for matching. Whichever catch block has the same exception type as that of the\
    \ raised exception, the corresponding catch block is executed.\n\n## Keywords:\
    \ throw/throws\n\nThese two keywords are similar words that are used for entirely\
    \ different purposes. The `throws` keyword is used at the end of method to declare\
    \ that the code throws a exception but the method does not handle it. In other\
    \ words, `throw` keyword is used to literally throw a exception. This exception\
    \ may be a new one or a exception that has previously.\n\nSample code that illustrates\
    \ the use of throws and throw is given below. In the method declaration, it has\
    \ declared that method throws exception while the use of `throw` initiates the\
    \ throwing of this exception.\n\n```java\nimport java.io.*;\n\npublic class name\
    \ {\n    public void deposit(double amount) throws Exception {\n        /*implementation*/\n\
    \        throw new Exception();\n    }\n}\n```\n\nIt may throw more than one exception.\
    \ In order to declare these exceptions in the method declaration, you can provide\
    \ a comma-separated list of exceptions. A sample implementation of this concept\
    \ has given below.\n\n```java\nimport java.io.*;\n\npublic class name {\n    public\
    \ void withdraw(double amount) throws Exception, InsufficientException {\n   \
    \     /*implementation*/\n    }\n}\n```\n\n## Finally block\n\nNow that you are\
    \ thorough with the try and catch block, let us look at the third block used in\
    \ exception handling, `finally` block. This is the last block that appears after\
    \ the try and catch blocks. Moreover, the execution of the catch block may be\
    \ omitted if the exception is not found, but the finally block is always executed\
    \ irrespective of whether the exception occurs or not.\n\nThe objective of this\
    \ block is to perform any cleanup activities that may be deemed necessary by the\
    \ programmer. This is the code that you want to execute no matter happens to the\
    \ code enclosed in the try block. The syntax of this block and how it can be implemented\
    \ has been below.\n\n```java\nTry {\n    /*Protected code*/\n}catch(Exptype1 exp1)\
    \ {\n    /*catch block 1*/\n}catch(Exptype2 exp2) {\n    /*catch block 2*/\n}catch(Exptype3\
    \ exp3) {\n    /*catch block 3*/\n}finally {\n    /*Finally block implementation*/\n\
    }\n```\n\nSample code that implements this concept is given below to make the\
    \ concept clearer.\n\n```java\npublic class democep {\n    public static void\
    \ main(String args[]) {\n        int arr[] = new int[2];\n        Try {\n    \
    \        System.out.println(\"Accessing the 3 (rd) element:\" + arr[3]); \n  \
    \      }catch(ArrayIndexOutOfBoundsException exp) {\n            System.out.println(\"\
    catching exception:\" + exp);\n        }finally {\n            Arr[0] = 5;\n \
    \           System.out.println(\"the first element is: \" + arr[0]);\n       \
    \     System.out.println(\"Finally block executed\");\n        }\n    }\n}\n```\n\
    \nThe output of the code is shown in the image below.\n\n![rsrc207.jpg](d2d_images/image044.jpg)\n\
    \nWhile implementing the try/catch/finally blocks, always remember a few things.\
    \ Firstly, there cannot be a catch block unless you have implemented a try block.\
    \ Analogously, there cannot be a standalone try block without a catch or finally\
    \ block. besides this, finally block is an optional construct and your try/catch\
    \ will work just fine even if you don’t have a finally block in your code.\n\n\
    ## User-defined exceptions\n\nJava allows you to define your own exceptions. however,\
    \ before you can do that, there are a few things that you need to remember. Firstly,\
    \ any exception needs to be derived or be a child of `Throwable` class. In order\
    \ to implement a checked exception, you will have to extend the `Exception` class.\
    \ however, the implementation of runtime exception has to extend `RuntimeException`\
    \ class.\n\nThe standard method for defining an exception is – `class demoexception\
    \ extends Exception`\n\nThe following code illustrates the implementation and\
    \ use of user-defined exceptions.\n\n```java\nimport java.io.*;\n\npublic class\
    \ insufficientException extends Exception {\n    private double amount;\n\n  \
    \  public insufficientException(double amount) {\n        this.amount = amount;\n\
    \    }\n\n    public double getAmount() () {\n        return amount;\n    }\n\
    }\n```\n\n## Conclusion\n\nThis book gave you a beginner’s tutorial on Java fundamentals.\
    \ We have covered all the basic concepts of Java programming and everything you\
    \ need to get started with Java programming. now that you have had a run-through\
    \ of all the basic concepts of Java and assuming that you have tried all the codes\
    \ given in this book, you are all set to jump to advanced Java programming.\n"
