    \ +\" | \");\n9 \n} ) ;\n10\n11 }\n12\n13 }\n```\n\n(A) 输出 file1.txtfile2.txtfile3.txt\n\
    (B) 输出 null\n\n### 答案：(A) 输出 file1.txtfile2.txtfile3.txt\n\n该程序的功能如下：\n\n1. 获取目录\
    \ `(C:/Users/user/Desktop/)` 中的所有文件\n2. 输出所有文件的名称\n\n––––––––\n\n![image](img/scene_break.png)\n\
    \n### Notes：\n\n#### (1) File\n`<创建文件对象>`\n\n`File` 类是操作文件对象的良好选择。\n正如你在第 5 行看到的，如果你想通过向\
    \ `File` 构造函数传递文件路径来创建目录对象，也可以使用 `File` 类。\n\n##### <method listFiles()>\n这个方法非常常见。在第\
    \ 7 行，它将目录中的所有文件作为 `File` 类型数组返回。\n\n##### <method getName()>\n在第 8 行，你可以看到这个方法。它只返回文件名。如果你输出\
    \ \"file\" 而不是 `file.getName()`，它将输出带有完整路径。\n\n#### (2) Arrays\n在第 7 行，方法 `forEach()`\
    \ 与问题 4 中的相同。它属于 `StreamAPI`，但 `File` 类型的数组没有 `stream()` 方法，因此该程序第 7 行到第 9 行执行的操作如下：\n\
    \n1. 创建 `File` 类型数组的流\n2. 使用流的 `forEach()` 方法\n3. 输出每个元素\n\n箭头(`->`) 之前的参数 `file`\
    \ 是流中的单个元素。\n\n| ![image](img/chapter_title_corner_decoration_left.png) | | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# 问题 16\n\n![image](img/chapter_title_below.png)\n\
    \n选择一个描述该程序编译并运行结果的陈述。\n\n––––––––\n\n![image](img/scene_break.png)\n\n```java\n\
    1 public class Question_16 {\n2 public static void main(String[]) args) {\n3\n\
    4 String str1 = \"a\";\n5 String str2 = \"b\";\n6 String str3 = \"c\";\n7\n8 List<String>\
    \ list= Arrays.aslist(\"a\", \"b\", \"c\");\n9\n10 list.stream().forEach(e ->\
    \ {\n11 switch (e) {\n12 case str1:\n13 System.out.println(\"switch\");\n14 break;\n\
    15 case str2:\n16 break;\n17 case str3:\n18 break;\n19 }\n20 } ) ;\n21\n22 }\n\
    23 }\n```\n\n(A) 输出 switch\n(B) 输出无\n\n答案：{C) 编译错误\n\n在第 4 行到第 6 行，都是变量。\n然而，`switch`\
    \ 语句中的 `case` 子句需要 final 变量，因此在第 12、15、17 行处发生编译错误。\n\n––––––––\n\n![image](img/scene_break.png)\n\
    \n### Notes：\n\n#### (1) switch 语句\n与 `if` 语句相比，当有很多条件时，`switch` 语句是一个很好的选择。\n\
    \n##### <使用 if-else 语句处理三个条件>\n```java\n1 if (condition1) {\n2 return;\n3 } else\
    \ if (condition2) {\n4 return;\n5 } else {\n6 return;\n7 }\n```\n\n##### <使用 switch\
    \ 语句处理三个条件>\n```java\n1 switch (condition1) {\n2 case condition1: break;\n3 case\
    \ condition2: break;\n4 default: break;\n5 }\n```\n上述代码的第 4 行 `\"default\"` 等同于\
    \ `if` 语句的 `else`。\n使用 `if` 语句或 `switch` 语句的另一个点是条件是简单还是复杂。\n`Switch` 语句需要 final\
    \ 变量并且看起来简单，但 `if` 语句比 `switch` 语句更容易地评估复杂的条件。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ | | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 问题 17\n\n![image](img/chapter_title_below.png)\n\n以下是文件 `(C:/Users/user/Desktop/abc.properties)`\
    \ 的内容。\n\n––––––\n\n![image](img/scene_break.png)\n1 key=value\n\n选择一个描述该程序编译并运行结果的陈述。\n\
    \n––––––––\n\n![image](img/scene_break.png)\n```java\n1 public class Question_17\
    \ {\n2 public static void main(String[] args) throws Exception {\n3 Properties\
    \ property= new Properties();\n4 File file= new File(\"C:/Users/user/Desktop/abc.properties\"\
    );\n5 FileInputStream stream= new FileInputStream(file);\n6 String str = \"key\"\
    ;\n7\n8 property.load(stream);\n9 property.clear();\n10 property.setProperty(str,\
    \ \"java\");\n11\n12 System.out.println(property.getProperty(str));\n13 stream.close();\n\
    14 }\n15 }\n```\n\n(A) 输出 value\n(B) 输出 java\n(C) 输出 null\n(D) 编译错误\n\n答案：(B)\
    \ 输出 java\n\n该程序的功能如下\n1. 通过 `FileInputStream` 加载文件\n2. 清空 `property` 对象\n3. 设置键-值对\n\
    4. 从 `property` 对象中获取 `String` 值\n\n––––––––\n\n![image](img/scene_break.png)\n\
    \n### Notes：\n\n#### (1) properties\n`.properties` 结尾的文件\n`Properties` 类是存储配置的良好选择。\n\
