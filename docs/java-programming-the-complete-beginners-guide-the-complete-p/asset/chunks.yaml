    \ 元素的 `array`。\n2. 通过两种方式输出每个：更改大小写并去除首尾空格，以及原样输出。\n\n### 注意事项：\n(1) `toLowerCase()`\n\
    该方法仅将 `String` 中的大写字符转换为小写。\n(2) `trim()`\n该方法移除首尾空格，因此中间的空格保留。这就是为什么选项 (C) 和\
    \ (D) 是错误的。\n(3) 方法链\n在第 9 行，对 `str.toLowerCase()` 和 `trim()` 运行了多个方法。这被称为“方法链”。\n\
