    # 问题 2


    ![image](img/chapter_title_below.png)


    ––––––––


    ![image](img/scene_break.png)


    ```

    public class Question_2_ 1 {

    private String a= "str";

    private Long b = 1L;

    private int c = 0;

    }

    ```


    选择一个能描述上述程序编译并运行结果的语句。


    ––––––––


    ![image](img/scene_break.png)


    ```

    public class Question_2_2 extends Question_2_1 {

    public static void main(String[] args) {

    for (int i=0; i < 5; i++) {

    if (true) {

    System.out.println(a);

    }

    if (true) {

    System.out.println(b);

    }

    if (true) {

    System.out.println(c);

    }

    }

    }

    ```


    (A) 输出 str

    (B) 输出 0

    (C) 编译错误

    (D) 运行时异常


    ### 答案：(C) 编译错误


    `Question_2_1` 中的访问修饰符是 `private`。虽然 `Question_2_2` 继承了 `Question_2_1`，但它无法直接访问
    `a`、`b` 和 `c`。


    # 问题 3


    ![image](img/chapter_title_below.png)


    选择一个能描述该程序编译并运行结果的语句。


    ```

    public class Question_3 {

    public static void main(String[] args) {

    LocalDateTime ldt1 = LocalDateTime.now();

    LocalDateTime ldt2 = ldt1.plusDays(0);

    }

    }

    ```


    (A) 输出 ldt1 和 ld2 相同

    (B) 输出 ldt1 和 ld2 不相同

    (C) 什么都不输出

    (D) 编译错误或运行时异常


    ### 答案：(A) 输出 "ldt1 and ld2 are same"


    在该代码中，创建了两个 `LocalDateTime` 对象。第二个对象 `ldt2` 是通过 `ldt1` 调用 `plusDays()` 方法生成的。


    然而，由于参数是 "0"，它们作为 `LocalDateTime` 对象是相同的。


    由于上述原因，第 12 行的语句没有执行，程序输出 "ldt1 and ld2 are the same"。


    ––––––––


    ![image](img/scene_break.png)


