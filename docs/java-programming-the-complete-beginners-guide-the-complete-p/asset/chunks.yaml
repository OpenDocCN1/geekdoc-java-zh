  trans: "\n\n在某些场景下，你可能需要访问栈轨迹（stack trace）的不同元素。此方法返回一个数组，将栈轨迹的每个元素都保存到数组的不同元素中。数组的第一个元素包含栈轨迹的顶端元素，而栈轨迹的底部被保存在数组的最后一个元素。\n\
    \n`public throwable fillstacktrace()`\n\n将当前栈轨迹的内容附加到之前的栈轨迹信息之后，并以数组的形式返回。\n\n\
    ## 捕获异常\n\n捕获异常的标准方法是使用 `try` 和 `catch` 关键字以及它们的代码实现。这个 `try-catch` 块需要以这种方式实现：即包含可能会抛出异常的代码。在这里还需要提到，\n\
    \n预期抛出异常的代码被称为保护代码。`try` 和 `catch` 块实现的语法如下——\n\n```\nTry {\n    /*保护代码*/\n}catch(Exception\
    \ exc1) {\n    /*捕获代码*/\n}\n```\n\n预期抛出异常的代码被放在 `try` 块中。如果抛出了异常，则在 `catch` 块中实现对应的异常处理要执行的操作。每个\
    \ `try` 块必须有一个 `catch` 块或一个 `finally` 块。\n\n在 `catch` 语句中，需要声明预期抛出的异常。一旦发生异常，执行流将转移到\
    \ `catch` 块。如果抛出的异常与 `catch` 块中定义的异常匹配，则执行 `catch` 块。\n\n下面是 `try-catch` 块的示例实现。该代码实现了一个包含\
    \ 2 个元素的数组。然而，代码尝试访问并不存在的第 3 个元素。结果导致抛出了异常。\n\n```java\nimport java.io.*;\n\n\
    public class demoexception {\n    public static void main(String args[]) {\n \
    \       Try {\n            int arr[] = new int[2];\n            System.out.println(\"\
    访问数组的第 3 (rd) 元素:\" + arr[3]);\n        }catch(ArrayIndexOutOfBoundsException\
    \ exp) {\n            System.out.println(\"捕捉异常:\" + exp);\n        }\n      \
    \  System.out.println(\"到达 catch 块外部\");\n    }\n}\n```\n\n此代码的输出所示所示。\n\n![rsrc206.jpg](img/image018.jpg)\n\
    \n## 实现多个 catch 块\n\n一段代码块可能会导致多个异常。为了满足这一需求，允许实现多个 `catch` 块。此类实现的语法如下所示。\n\n\
    ```java\nTry {\n    /*保护代码*/\n}catch(Exptype1 exp1) {\n    /*捕获块 1*/\n}catch(Exptype2\
    \ exp2) {\n    /*捕获块 2*/\n}catch(Exptype3 exp3) {\n    /*捕获块 3*/\n}\n```\n\n上述语法演示了三个\
    \ `catch` 块的实现。然而，你可以根据需要实现任意数量的 `catch` 块。当执行此代码时，会先执行保护代码。如果发生异常，异常类型将与第一个 `catch`\
    \ 块的异常进行匹配。但如果异常类型不匹配，将忽略 `catch` block 1 并尝试匹配第二个 `catch` 块的异常类型。哪一个 `catch`\
    \ 块与抛出的异常类型相同，就会执行相应的 `catch` 块。\n\n## 关键字：throw/throws\n\n这两个关键字是相似的词，但用途完全不同。`throws`\
    \ 关键字用于方法的末尾，用于声明代码会抛出异常但方法不处理它。换句话说，`throw` 关键字用于字面上的抛出异常。此异常可以是新的，也可以是之前已经创建的异常。\n\
    \n下面是说明 `throws` 和 `throw` 用法的示例代码。在方法声明中，它声明了方法抛出异常，而 `throw` 的使用启动了该异常的抛出。\n\
    \n```java\nimport java.io.*;\n\npublic class name {\n    public void deposit(double\
    \ amount) throws Exception {\n        /*implementation*/\n        throw new Exception();\n\
    \    }\n}\n```\n\n可能会抛出多个异常。为了在方法声明中声明这些异常，你可以提供一个逗号分隔的异常列表。下面是该概念的示例实现。\n\n```java\n\
    import java.io.*;\n\npublic class name {\n    public void withdraw(double amount)\
    \ throws Exception, InsufficientException {\n        /*implementation*/\n    }\n\
    }\n```\n\n## finally 块\n\n现在你已经熟悉了 `try-catch` 块，让我们来看看异常处理中使用的第三个块：`finally`\
    \ 块。这是出现在 `try` 和 `catch` 块之后的最后一个块。此外，如果没有找到异常，则可能会省略 `catch` 块的执行，但无论是否发生异常，`finally`\
    \ 块始终会被执行。\n\n该块的目标是执行程序员可能认为必要的任何清理活动。无论 `try` 块中包含的代码发生了什么，你都执行这段代码。该块的语法及其实现方式如下。\n\
    \n```java\nTry {\n    /*保护代码*/\n}catch(Exptype1 exp1) {\n    /*捕获块 1*/\n}catch(Exptype2\
    \ exp2) {\n    /*捕获块 2*/\n}catch(Exptype3 exp3) {\n    /*捕获块 3*/\n}finally {\n\
    \    /*finally 块实现*/\n}\n```\n\n下面提供了实现此概念的示例代码，以使概念更清晰。\n\n```java\npublic class\
    \ democep {\n    public static void main(String args[]) {\n        int arr[] =\
    \ new int[2];\n        Try {\n            System.out.println(\"访问第 3 (rd) 元素:\"\
    \ + arr[3]); \n        }catch(ArrayIndexOutOfBoundsException exp) {\n        \
    \    System.out.println(\"捕捉异常:\" + exp);\n        }finally {\n            Arr[0]\
    \ = 5;\n            System.out.println(\"第一个元素是: \" + arr[0]);\n            System.out.println(\"\
    finally 块已执行\");\n        }\n    }\n}\n```\n\n代码的输出所示。\n\n![rsrc207.jpg](img/image04.jpg)\n\
    \n在实现 `try/catch/finally` 块时，始终记住以下几点。首先，没有 `try` 块，就不会有 `catch` 块。同样，没有 `catch`\
    \ 或 `finally` 块，就不会有独立的 `try` 块。此外，`finally` 块是一个可选的结构，即使你的代码中没有 `finally` 块，`try/catch`\
    \ 也能正常工作。\n\n##自定义异常\n\nJava 允许你定义自己的异常。然而，在此之前，你需要记住几点点。首先，任何异常都需要派生或作为 `Throwable`\
    \ 类的子类。为了实现受检异常，你必须扩展 `Exception` 类。然而，运行时异常的实现必须扩展 `RuntimeException` 类。\n\n\
    定义异常的标准方法是——`class demoexception extends Exception`\n\n以下代码说明了自定义异常的实现和用法。\n\n\
    ```java\nimport java.io.*;\n\npublic class insufficientException extends Exception\
    \ {\n    private double amount;\n\n    public insufficientException(double amount)\
    \ {\n        this.amount = amount;\n    }\n\n    public double getAmount() ()\
    \ {\n        return amount;\n    }\n}\n```\n\n## 总结\n\n本书为你提供了一个关于 Java 基础的入门教程。我们涵盖了\
    \ Java 编程的基本概念，以及开始 Java 编程所需的一切内容。现在你已经回顾了 Java 的基本概念，并且假设你尝试了书中给所有的代码，你已经准备好跳转到高级\
    \ Java 编程了。\n\n"
