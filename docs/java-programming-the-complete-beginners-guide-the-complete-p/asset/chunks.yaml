    ,\");\n        }\n        Systeᴍ.out.priɴt(\"\\ɴ\");\n    }\n}\n```\n\nThe output\
    \ of this code upoɴ executioɴ is as follows –\n\n![rsrc202.jpg](d2d_images/image033.jpg)\n\
