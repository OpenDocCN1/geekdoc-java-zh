    \        }\n        for (String str : array) {\n            method1(str);\n  \
    \      }\n    }\n    private static void method1(String value) {\n        System.out.print(value);\n\
    \    }\n}\n```\n\n(A) 输出 `abc ABC ABC`\n(B) 输出 `abca b`\n(C) 输出 `abcABC`\n(D)\
