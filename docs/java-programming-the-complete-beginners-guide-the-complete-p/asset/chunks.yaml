  trans: "\n在这里，`data_type` 是变量的数据类型，而 `variable_name` 是用于该变量的标识符。如果你正在使用相同类型的多个变量，可以通过逗号分隔的变量名称将它们组合在同一个语句中。如前所述，`java`\
    \ 支持三种类型的变量，即：类变量、实例变量和局部变量。本章将详细解释这些变量类型。\n\n## 局部变量\n\n在方法或代码块内部声明的变量对于该作用域是局部的，被称为局部变量。变量在块中声明和定义时被创建。此外，一旦块的作用域结束，变量就会被销毁。这种类型的变量无法使用访问修饰符（在本章稍后部分描述）。\n\
    \n由于这种变量仅在方法或块的作用域内有效，因此只能在此代码块内进行访问。在内部，局部变量是在栈级别创建的。因此，当它们被创建时，它们会被推入栈中，一旦代码块执行完毕，栈就会被清空。最后，局部变量的默认值是垃圾（garbage）。因此，这些变量在使用前必须初始化。\n\
    \n下面提供了说明局部变量工作原理的示例代码。它在类的方法中实现了一个局部变量 `agep`，该变量从 `main` 方法访问。\n\n```java\n\
    public class lvdemo {\n    public void puppyage() {\n        int agep = 0;\n \
    \       Agep = agep + 10;\n        System.out.println(\"Age of the puppy is :\
    \ \" + agep);\n    }\n\n    public static void main(String args[]) {\n       \
    \ lvdemo testobj = new lvdemo();\n        testoobj.puppyage();\n    }\n}\n```\n\
    \n此代码的输出已在下方图中所示。\n\n![rsrc1ZN.jpg](img/image053.jpg)\n\n## 实例变量\n\n作为类的一部分创建，但不在任何方法或构造函数作用域内的变量被称为实例变量。这些变量之所以被称为实例变量的原因是，它们只有在使用该类创建对象时才会创建一次。因此，对于使用该类使用\
    \ `new` 关键字所实例化的每个对象，都会创建这些变量。\n\n此外，这些变量在对象被删除或程序执行终止时就会被销毁。可以从该类实现的方法或构造函数访问这些变量。可以说实例变量是可以使用访问修饰符的类级变量。\n\
    \n这些变量具有默认值。例如，所有数字的默认值为 0，布尔型的默认值为 false。作为引用变量创建的对象引用被初始化为 `null`。虽然必须声明变量，但赋值可以在方法或构造函数中完成。如果你在同一个类内部工作，可以直接通过变量名称访问变量。然而，如果你想从任何静态方法访问它，则需要使用格式\
    \ – `Object_name.variable_name` 来访问。\n\n下面提供了示例代码帮助你更好地理解这一概念。该类实现了一个员工类，并使用初始化方法初始化了类的变量。\n\
    \n```java\nimport java.io.*;\n\npublic class demoemployee {\n    public String\
    \ nameemp;\n    private double salaryemp;\n\n    public demoemployee(String nameemp)\
    \ {\n        nameemp = nameemp;\n    }\n\n    public void itsalary(double itsal)\
    \ {\n        salaryemp = itsal;\n    }\n\n    public void private() {\n      \
    \  System.out.println(\"Employee name = \" + nameemp);\n        System.out.println(\"\
    Employee Salary = \" + salaryemp);\n    }\n\n    public static void main(String\
    \ args[]) {\n        demoemployee empobj = new demoemployee(\"aes\");\n      \
    \  empobj.itsalary(5000);\n        empobj.private();\n    }\n}\n```\n\n此代码的输出已在下方图中所示。\n\
    \n![rsrc1ZP.jpg](img/image001.jpg)\n\n## 静态变量\n\n任何用 `static` 声明的变量位于类中，但在方法、构造函数或类内部任何其他块之外。无论为该类创建了多少对象，整个类都只维护该变量的一个副本。因此，这些变量也被称为类变量。尽管建议不使用使用这些变量，但存在某些需要此类实现的场景。然而，每当使用此类变量时，你必须将其作为常量使用，其值不能更改。这些变量在程序启动时创建。然而，一旦程序执行终止，它们就会被销毁。\n\
    \n类变量对类的所有元素都是可见。因此，它们的可见性与实例变量相似。事实上，类变量的默认值与实例变量相同。可以使用以下语句访问这些变量 – `Class_name.variable_name`\n\
    \n下面提供了静态变量实现的示例代码。\n\n```java\nimport java.io.*;\n\npublic class svdemo {\n \
    \   private static double salaryemp;\n    public static final String department\
    \ = \"dev \";\n\n    public static void main(String args[]) {\n        salaryemp\
    \ = 1000;\n        System.out.println(department + \"Salary = \" + salaryemp);\n\
    \    }\n}\n```\n\n可以在下方图中看到代码输出。\n\n![rsrc1ZR.jpg](img/image050.jpg)\n\n## 修饰符类型\n\
    \n可以使用修饰符修改变量的行为和访问权限。修饰符有两种主要类型，即访问修饰符和非访问修饰符。\n\n### 访问修饰符\n\n![rsrc1ZH.jpg](img/image043.jpg)\n\
    \nJava 支持多个访问级别，每个级别都有对应的关键字。这些包括：\n\n- `public`: ![rsrc1ZH.jpg](img/image043.jpg)\
    \ 所有人可见\n- `private`: ![rsrc1ZS.jpg](img/image051.jpg) 类内部可见\n- `protected`: ![rsrc1ZJ.jpg](img/image040.jpg)\
    \ 类及其子类可见\n- `default`: ![rsrc1ZK.jpg](img/image015.jpg) 如果没有提到关键字，则对包内可见\n\n\
    ### 非访问修饰符\n\n![rsrc1ZH.jpg](img/image043.jpg)\n\nJava 中还有其他修饰符。这些包括：\n\n- `static`:\
    \ ![rsrc1ZJ.jpg](img/image040.jpg)\n- `final`: ![rsrc1ZH.jpg](img/image043.jpg)\n\
    - `abstract`: ![rsrc1ZH.jpg](img/image043.jpg)\n- `volatile` 和 `synchronized`:\
    \ ![rsrc1ZH.jpg](img/image043.jpg)\n"
- fmt: "\nThis operator returns the remainder left after dividing the two numbers.\
    \ If `a` and `b` are two variables holding 10 and 5 respectively. The, `c = a%b`,\
    \ will yield `c = 0`.\n\n### Increment (++)\nThis operator adds 1 to the value\
    \ of the variable. If `a` is a variable holding the value 1, the `a++` will yield\
    \ the value 2.\n\n### Decrement (—)\nThis operator reduces 1 from the value of\
    \ the variable. If `a` is a variable holding the value 1, the `a—` will yield\
    \ the value 0.\n\n## Relational operators\nAll operations involving comparison\
    \ are performed using relational operators. A list of the operators supported\
    \ by this programming language is given below –\n\n**not EQUAL to (!=)**\nThis\
    \ operator is applied on two operands. It checks equality between two operands.\
    \ If they are equal, it returns FALSE else it returns true.\n\n**EQUAL to (==)**\n\
    This operator is applied on two operands. It checks equality between two operands.\
    \ If they are equal, it returns true else it returns FALSE.\n\n**greater than\
    \ (>)**\nThis operator is applied on two operands. It checks equality between\
    \ two operands. If the first operand is greater than the second operand, it returns\
    \ true else it returns FALSE.\n\n**LESS than (<)**\nThis operator is applied on\
    \ two operands. It checks equality between two operands. If the first operand\
    \ is less than the second operand, it returns true else it returns FALSE.\n\n\
    **greater than or EQUAL to**\nThis operator is applied on two operands. It checks\
    \ equality between two operands. If the first operand is greater than or equal\
    \ to the second operand, it returns true else it returns FALSE.\n\n**LESS than\
    \ or EQUAL to**\nThis operator is applied on two operands. It checks equality\
    \ between two operands. If the first operand is less than or equal to the second\
    \ operand, it returns true else it returns FALSE.\n\n## bitwise operators\nThe\
    \ only difference between normal operators and bitwise operators is that these\
    \ operators perform operations bit-by-bit. Moreover, these operators can be applied\
    \ on `byte`, `int`, `short`, `long` and `char`. The list of bitwise operators\
    \ supported in java include –\n\n**bitwise And (&)**\nThis operator works on two\
    \ operands and the output for each set of input bits is 1 if both the inputs are\
    \ one else the output is zero.\n\n**bitwise or (|)**\nThis operator works on two\
    \ operands and the output for each set of input bits is 1 if one or both of the\
    \ inputs is one else the output is zero.\n\n**bitwise xor (^)**\nThis operator\
    \ works on two operands and the output for each set of input bits is 1 only if\
    \ one of the inputs is one else the output is zero.\n\n**bitwise complement (~)**\n\
    This operator works on a single operand and negates the values from 0 to 1 and\
    \ from 1 to 0.\n\n**Left shift (<<)**\nThis operator works on two operands. The\
    \ bits of the left operand are shifted left. The number of places is equal to\
    \ the number specified as value for the second operand.\n\n**Right shift (>>)**\n\
    This operator works on two operands. The bits of the left operand are shifted\
    \ right by the number specified as value for the second operand.\n\n**Zero FILL\
    \ right shift (>>>)**\nThis operator works on two operands. The bits of the left\
    \ operand are shifted right by the number specified as value for the second operand.\
    \ Moreover, 0 replaces the bits that are shifted.\n\nIn order to understand how\
    \ bitwise operations take place, let us take an example. Assume two variables,\
    \ `a` and `b`, having the values 60 and 13 respectively. The binary equivalent\
    \ of `a` and `b` are as follows –\n\n`A = 00111100`\n`b = 00001101`\n\nUsing the\
    \ And truth table according to which the output is 1 only if both inputs are 1.\
    \ Correspondingly, the output of `a&b = 00001100`. Similarly other bitwise operations\
    \ are also performed.\n\n## Logical operators\nAll the logical operations in java\
    \ are performed using logical operators. The list of operators supported by this\
    \ language is:\n\n**Logical And**\nThis operator works on two operands. If both\
    \ operands are non-zero, the expression returns true else it returns FALSE.\n\n\
    **Logical or**\nThis operator works on two operands. If both operands are non-zero,\
    \ the expression returns true else it returns FALSE.\n\n**Logical not**\nThis\
    \ operator works on one operand. If the operand is zero, this expression returns\
    \ true else it returns FALSE.\n\n## Assignment operators\nThe list of assignment\
    \ operators supported by java include –\n\n**Simple Assignment operator (=)**\n\
    This operator assigns the value computed by the right side to the left side. If\
    \ `a` and `b` are variables and the expression is `c = a+b`, the value of `a+b`\
    \ is assigned to `c`.\n\n**Add Assignment operator (+=)**\nThis operator assigns\
    \ the value computed by the addition of the right side and the left side. If `a`\
    \ and `c` are variables and the expression is `c += a`, the value of `a` and `c`\
    \ is assigned to `c`.\n\n**Subtract Assignment operator (-=)**\nThis operator\
    \ assigns the value computed by the subtraction of the right side from the left\
    \ side. If `a` and `c` are variables and the expression is `c -= a`, the value\
    \ of `c-a` is assigned to `c`.\n\n**Multiply Assignment operator (*=)**\nThis\
    \ operator assigns the value computed by the multiplication of the right side\
    \ and the left side. If `a` and `c` are variables and the expression is `c *=\
    \ a`, the value of `c*a` is assigned to `c`.\n\n**Divide Assignment operator (/=)**\n\
    This operator assigns the value computed by the division of the left side with\
    \ the right side. If `a` and `c` are variables and the expression is `c /= a`,\
    \ the value of `c/a` is assigned to `c`.\n\n**Modulus Assignment operator (%=)**\n\
    This operator assigns the value computed by the modulus of the left side with\
    \ the right side. If `a` and `c` are variables and the expression is `c %= a`,\
    \ the value of `c%a` is assigned to `c`.\n\n**Left Shift Assignment operator (<<=)**\n\
    If `a` and `c` are variables and the expression is `c <<= a`, the value of `c<<a`\
    \ is assigned to `c`.\n\n**Right Shift Assignment operator (>>=)**\nIf `a` and\
    \ `c` are variables and the expression is `c >>= a`, the value of `c>>a` is assigned\
    \ to `c`.\n\n**Bitwise And Assignment operator (&=)**\nIf `a` and `c` are variables\
    \ and the expression is `c &= a`, the value of `c&a` is assigned to `c`.\n\n**Bitwise\
    \ xor Assignment operator (^=)**\nIf `a` and `c` are variables and the expression\
    \ is `c ^= a`, the value of `c^a` is assigned to `c`.\n\n**Bitwise Inclusive or\
    \ Assignment operator (|=)**\nIf `a` and `c` are variables and the expression\
    \ is `c |= a`, the value of `c|a` is assigned to `c`.\n\n## Operator Precedence\n\
    If an expression uses multiple operators, the operator precedence rules are used\
    \ to determine the order of execution of operations. The precedence of operators\
    \ in terms of whether they will be evaluated from right to left or left to right\
    \ is defined for groups of operators in the following –\n\n1. Right to Left\n\
    \   - Unary\n   - Conditional\n   - Assignment\n2. Left to Right\n   - Postfix\n\
    \   - Multiplicative\n   - Additive\n   - Shift\n   - Relational\n   - Equality\n\
    \   - Bitwise And\n   - Bitwise xor\n   - Bitwise or\n   - Logical And\n   - Logical\
    \ or\n\nFor example, if we have to evaluate the expression `a = 3 + 5 * 5`, the\
    \ multiplication is performed before addition. Therefore, `a = 28` instead of\
    \ 40.\n"
