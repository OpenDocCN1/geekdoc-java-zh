  trans: "\n# 调用方法\n\n方法需要被调用或执行才能使用。正如上面提供的示例代码所示，该方法正在执行某些计算并返回计算结果。这种方法返回一个值，其返回类型在方法声明中已经指定。除此，存在另一种类型的方法。此类方法不返回任何内容，通常被称为无返回值的方法。\n\
    \n当程序调用方法时，控制权从程序移动到方法，方法开始执行。一旦遇到 `return` 语句，控制权就会传回调用它的程序。在没有 `return` 语句的情况下，一旦遇到方法的结束大括号，控制权会自动传回。这通常是无返回值方法的情况。\n\
    \n对于返回值的方法，返回类型在方法声明中会被提到。另一方面，对于不返回任何内容的方法，返回类型为 `void`。为了调用我们上面实现的方法，需要在调用它的程序的某处出现以下语句：\n\
    \n```\nint result;\nResult = minDemo(5, 6);\n```\n\n由于该方法返回一个 `int` 类型的值，该值需要被收集在一个\
    \ `int` 变量（`result`）中。方法调用提供了方法所需的两个参数值。这种类型的方法调用也称为参数方法调用或按值传参。\n\n你可能会遇到某些情况，即可能有不同类型的参数且数量很多。在这种情况下，请务必按照所需的顺序提供参数值，以避免任何意外的编译错误或运行时错误。\n\
    \n## 方法重载\n\n可以拥有名称相同但参数不同的方法。当方法被调用时，系统会检测与调用语句中给参数类型和数量匹配的方法，并将控制权转移到对应的方法。这种方法实现的形式被称为方法重载。不要将此概念与重写（overriding）混淆。在方法重写中，方法名、参数和参数数量也是相同的。\n\
    \n为了理解这个概念，让我们来看一个例子——\n\n```java\npublic class overloadingDemo {\n\n    public\
    \ static void main(String[] args) {\n        int x = 34;\n        int y = 56;\n\
    \        double z = 10.5;\n        double u = 7.8;\n        int resultxy = minDemo(x,\
    \ y);\n        double resultzu = minDemo(z, u);\n        System.out.println(\"\
    Min Value (Integers) = \" + resultxy);\n        System.out.println(\"Min Value\
    \ (double) = \" + resultzu);\n    }\n\n    public static int minDemo (int num1,\
    \ int num2) {\n        int minval;\n        if (num1 > num2)\n            minval\
    \ = num2;\n        else\n            minval = num1;\n        return minval;\n\
    \    }\n\n    public static double minDemo (double num1, double num2) {\n    \
    \    double minval;\n        if (num1 > num2)\n            minval = num2;\n  \
    \      else\n            minval = num1;\n        return minval;\n    }\n}\n```\n\
    \n该代码实现了两个名称同为 `minDemo` 但参数类型不同的方法。其中一个方法使用两个 `int` 类型的参数，返回类型为 `int`。另一方面，另一个方法使用\
    \ `double` 参数并返回 `double`。该代码的输出如图所示。\n\n## 使用命令行参数\n\n有些程序要求你在运行时执行程序时传递参数。这些参数以命令行参数（line\
    \ arguments）的形式传递给程序。这些参数在执行程序时连同程序名称一起提供给程序。\n\n在程序内部访问这些参数的方式在示例代码所示。\n\n```java\n\
    public class CommandLineDemo {\n    public static void main(String args[]) {\n\
    \        for(int x = 0; x<args.length; x++) {\n            System.out.println(\"\
    args[\" + x + \"]: \" + args[x]);\n        }\n    }\n}\n```\n\n输入以下命令行运行程序并查看你的结果：\n\
    `java CommandLineDemo 200 100 10 8 7`\n\n### Finalize (finalize)\n\n在 Java 编程中你处理大量的对象，所有这些对象都占用内存空间。如果你正在处理大规模代码，可能需要在终止程序之前清理这些对象占用的空间。为了方便此操作，Java\
    \ 提供了一个垃圾回收方法，称为 `finalize()` 方法。\n\n该方法用于实现你希望程序在终止之前执行的所有操作。其中一些操作包括关闭所有打开的文件、删除所有创建的对象以及释放程序元素占据的任何其他内存。该方法的实现方式如下——\n\
    \n```\nprotected void finalize() {\n    /*Implementation*/\n}\n```\n\n在 `finalize()`\
    \ 的声明中使用 `protected` 访问修饰符，以防止任何外部程序在代码执行之前破坏它。\n\n## 源文件声明规则\n\n在源文件中编写 `import`\
    \ 语句、类声明和包语句时，你需要遵循一些规则。这些规则如下：\n\n- 一个源文件不能有多个 `public` 类。\n- 一个源文件中可以有很多非公共类。\n\
    - 源文件的名称应与该文件中 `public` 类的名称相同。此外，文件的扩展名应该是 `.java`。\n- 如果你正在处理一个包且该类作为包的一部分被实现，那么源文件的第一个语句必须是包语句。\n\
    包语句必须是源文件的第一个语句。任何其他 `import` 语句必须跟在包语句之后。最后，必须存在声明。\n\n你需要理解包和 `import` 语句对于源文件中的所有类都是通用的。\n\
    \n在我们结束讨论之前，让我们对包给出一个结语。它只是接口和类的形式。\n\n# 第 7 章：决策选择\n\n决策结构用于以下情况：如果条件为真，则执行一组指令；当条件被判定为假时，执行另一组指令。Java\
    \ 中提供了几种结构用于此类场景编程。这些结构包括——\n\n### If 语句\n\n该语句用于需要测试条件的情况，如果发现条件为真，则需要执行该语句随后的代码块。该结构的语法如下：\n\
    \n```\nif(condition){\n    /*body*/\n}\n```\n\n该结构的示例实现如下：\n\n```java\npublic\
    \ class ifDemo {\n    public static void main(String[] args) {\n        int i\
    \ = 10;\n        int j = 1;\n        if(i>j){\n            System.out.print(i);\n\
    \        }\n    }\n}\n```\n"
