  trans: "\n\n![image](img/scene_break.png)\n\n可变列表意味着你在初始化后不能再添加元素。\n\n如果你使用 `Arrays.aslist()`\
    \ 创建列表，它是一个可变列表，因此你无法添加元素。\n\n––––––––\n\n![image](img/scene_break.png)\n\n相反，如果你用\
    \ `new ArrayList<>()` 初始化列表，它是一个可变列表。\n\n所以你可以无问题地添加元素。\n\n––––––––\n\n![image](img/scene_break.png)\n\
    \n顺便说一下，`final` 列表也是可变列表。在这种情况下，final 意味着你不能将另一个列表赋值给它。\n\n然而，添加元素是没有问题的。\n\n\
    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# 问题 41\n\n![image](img/chapter_title_below.png)\n\
    \n选择一个描述该程序在编译和运行时结果的语句。\n\n––––––––\n\n![image](img/scene_break.png)\n\n```java\n\
    1 public class Question_41 {\n2\n3  private static Function<StringBuilder, String>\
    \ function = new\n4 Function<StringBuilder, String>() {\n5  @Override\n6  public\
    \ String apply(StringBuilder sb) {\n7 return sb.delete(0, sb.length() - 1)\n8\
    \  .append(\"bc123\")\n9  .toString();\n10 }\n11 };\n12\n13  public static void\
    \ main(String[] args) {\n14 String str = function.apply(new StringBuilder(\"java\"\
    ));\n15\n16 List<String> list= new ArrayList<>();\n17 for (char e : str.toCharArray())\
    \ {\n18  if (Character.isletter(e)) {\n19  list.add(String.valueOf(e));\n20  }\n\
    21  }\n22\n23  list.forEach(System.out::print);\n24 }\n25 }\n```\n\n(A) 输出 abc\
    \ (B) 输出 be (C) 编译错误 (D) 运行时异常\n\n### 答案：(A) 输出 abc\n\n该程序的执行逻辑如下：\n\n1. 创建值为\
    \ abc123 的 String 对象\n2. 创建一个仅包含其中字母值的列表\n3. 输出每个元素\n\n––––––––\n\n![image](img/scene_break.png)\n\
    \n### 注释：\n\n#### (1) Function\n\n这是函数接口之一。\n\n这意味着该函数使用 `StringBuilder` 参数，并返回\
    \ `String` 值。因此，它的作用与下面的代码相同。\n\n```java\n1 private static String method1(StringBuilder\
    \ sb) {\n2 return sb.delete(0, sb.length() - 1)\n3  .append(\"bc123\")\n4 .toString();\n\
    5 }\n```\n\n该函数在第 14 行执行。\n\n––––––––\n\n![image](img/scene_break.png)\n\n####\
    \ (2) `StringBuilder` 中的 `delete()` 方法\n\n为了容易理解这个方法，记住 `String` 类中的 `substring()`\
    \ 方法是一个好方法。\n\n它像下面这样删除 `StringBuilder` 中指定范围的元素。\n\n```\nj a v a\nI I I I I\n\
    0 1 2 3 4\n```\n\n所以，该方法在第 7 行的返回值为 \"a\"，追加 \"bc123\" 并结果将其转换为 String。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 问题 42\n\n![image](img/chapter_title_below.png)\n\n选择一个描述该程序在编译和运行时结果的语句。\n\
    \n––––––––\n\n![image](img/scene_break.png)\n\n```java\n1 public class Question_42\
    \ {\n2 class ABC {\n3  private HashMap<Integer, String> map;\n4\n5  public ABC(int\
    \ a) {\n6  for (int i= 0; i < a; i++) {\n7\n8\n9 }\n10 }\n11\nmap.put(i, \"java\"\
    \ + (i + 1));\n11 } \n12 public static void main(String args[]) {\n13  Question_42\
    \ a= new Question_42();\n14 ABC b = a.new ABC(S);\n15\n16 List<Object> list= b.map.entrySet().stream()\n\
    17  .map(e -> e.getValue())\n18  .collect(Collectors.tolist());\n19\n20 list.forEach(new\
    \ Consumer<Object>() {\n21 public void accept(Object object) {\n22 System.out.print(object);\n\
    23 }\n24\n} ) ;\n25 }\n26 }\n```\n\n––––––––\n\n![image](img/scene_break.png)\n\
    \n(A) 输出 java0java1java2java3java4 (B) 输出 java1java2java3java4 (C) 编译错误 (D) 运行时异常\n\
    \n### 答案：(D) 运行时异常\n\n该程序的执行如下：\n\n1. 创建 Question_42 实例\n2. 创建 ABC 实例\n3. 抛出 NullPointerException\n\
    \n––––––––\n\n![image](img/scene_break.png)\n\n注释：\n\n#### (1) ABC 构造函数中的 NullPointerException\n\
    \n在构造函数中发生\n\n1. 使用 `int` 类型循环\n2. 尝试向 map 添加元素\n\n––––––––\n\n![image](img/scene_break.png)\n\
    \n在第 3 行初始化 map 它是 null。\n\n因此在第 11 行调用 `put` 时会抛出 NullPointerException。\n\n这是因为\
    \ map 没有被初始化，它在第 11 行执行。\n\n这就是为什么答案是 (D)。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 问题 43\n\n![image](img/chapter_title_below.png)\n\n选择一个描述该程序在编译和运行时结果的语句。\n\
    \n––––––––\n\n![image](img/scene_break.png)\n\n```java\n1 public class Question_43\
    \ {\n2\n3  public static void main(String args[]) {\n4\n5  Boolean flg = null;\n\
    6  Integer[] array= { 10, 20, 30 };\n7  int a=array[0], b=array[1];\n8\n9 flg=Integer.compare(a,\
    \ b) != 0 ? true : false;\n10\n11 Optional<Boolean> c = Optional.ofNullable(flg);\n\
    12\n13 c.ifPresent(x -> {\n14  for (Integer y : array) {\n15    y = 0;\n16  }\n\
    17 ) ;\n18\n19 Arrays.stream(array).forEach(System.out::print);\n20 }\n21 }\n\
    ```\n\n(A) 输出 10200 (B) 输出 00\n\n![image](img/image12.png)\n\n### 答案：(A) 输出 10200\n\
    \n该程序的执行逻辑如下：\n\n1. 创建包含 10, 20, 30 的 Integer 数组\n2. 检查其中的字母值（此处应为数组值）\n3. 输出每个元素\n\
    \n––––––––\n\n![image](img/scene_break.png)\n\n### 注释：\n\n#### (1) Integer.compare()\n\
    \n该方法使用两个参数并比较第一个参数是否等于、大于或小于第二个参数。它返回 `int` 值。返回值如下：\n\n在第 9 行\n\n1. The arguments\
    \ are equal : 0\n2. The first is greater than second : 1\n3. The first is less\
    \ than second : -1\n\n所以，第 9 行的结果为 true，flg 为 true。\n\n––––––––\n\n![image](img/scene_break.png)\n\
    \n#### (2) 标准 for 循环，增强 for 循环，forEach of Stream\n\n三种循环数组的方法，但只有一种方法会影响原始数组如下：\n\
    \n1. 标准 for 循环（影响原始数组）\n2. 增强 for 循环（不影响原始数组）\n3. forEach of StreamAPI（不影响原始数组）\n\
    \n这就是为什么在第 14 到 16 行使用 `forEach` 的 StreamAPI 时，答案也是 (A)。\n\n"
