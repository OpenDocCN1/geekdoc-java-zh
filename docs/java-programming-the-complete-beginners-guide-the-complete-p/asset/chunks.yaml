    These two programs ought to display the same results but they cannot be interchanged,
    for the instructions will mean nothing when they are run by the wrong processor.
    You will either get notification or error messages like “Not a valid Win32 application”
    or “Windows can’t open this file.” That is why, with the help of Java Virtual
    Machine, these Java bytecodes create order in this chaotic world of programming!
    JVM acts like an interpreter that translates those bytecodes for any computer
    system to comprehend. Thus, you do not have to worry because whether it is your
    computer or your friend’s one, both will be able to run the bytecode. Thus, Java
    language has solved the issue of portability and versatility through JVM.


    ## Integrated Development Environment


    The early days of Java programming involved opening several windows – one for
    typing the code, another for running the program, and maybe a third one to keep
    track of all the codes you have written. What a messy situation! With the emergence
    of the integrated development environment (IDE) all of the functionalities were
    seamlessly combined into a single well-organized application.


    Below are some of the most popular Java IDEs that can be downloaded online for
    free (their features may vary but still the language remains exactly the same):


    1.  Eclipse (www.eclipse.org)


    ––––––––


    ![image](d2d_images/scene_break.png)


    Regarded as one of the most popular and best-looking interfaces because of its
    interactive design and navigation features, Eclipse is characterized as a user-friendly
    and open source software.


    1.  NetBeans (https://netbeans.org)


    Just like the previous program, this open source IDE is one of the most recommended
    Java programming environments for beginners. It is also fast and powerful that
    can support all Java platforms from Standard Edition (SE) to FX.


    1.  BlueJ (http://bluej.org/)


    BlueJ is described to have the simplest IDE interface and specifically designed
    to help a novice user understand the fundamental concepts of Java programming.


    1.  DrJava (www.drjava.org)


    ––––––––


    ![image](d2d_images/scene_break.png)


    DrJava was also designed for amateur programmers who want a simple interface.


    Despite its simplicity, it is still powerful enough for proficient Java programmers.


    1.  Jave Development Kit (JDK)


    The Java Development Kit is a tool that acts as both a compiler and an interpreter.


    The latest JDK version can be downloaded from Oracle’s website - www.oracle.com/technetwork/java/javase/downloads/index.html.
    Ensure that you download the appropriate version for your computer. If you are
    using a 32-bit operating system, then download the matching file name affixed
    with x86. Otherwise, if it is a 64-bit operating system then download the one
    with x64.


    Now, we have learned that Java can be deployed in a multitude of ways. This chapter
    also gave you a clear set of instructions on how to install the software and all
    other required tools for the program to run properly. In the next chapter, you
    will experience how to start coding in a Java environment.


