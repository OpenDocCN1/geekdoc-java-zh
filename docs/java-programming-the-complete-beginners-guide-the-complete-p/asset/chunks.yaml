    # 问题 1


    ![image](img/chapter_title_below.png)


    选择一个能描述该程序编译并运行结果的语句。


    ```

    public class Question_ 1 {

    public static void main(String[] args) {

    int a = 1 ; int b = 2; int C = 3;

    if ( a + b == c) {

    System.out.println(method1()[0]);

    }

    private static String[] method1() {

    String[] array= new String[1];

    StringBuilder sb = new StringBuilder();

    sb.append("Be a");

    sb.append("Java ");

    sb.append("Programmer");

    array[0] = sb.toString();

    return array;

    }

    }

    ```


    (A) 输出 Be a Java Programmer

    (B) 什么都不输出

    (C) 编译错误

    (D) 运行时异常


    ### 答案：(A) 输出 "Be a Java Programmer"


    方法 `method1()` 返回 `String` 类型的 `array`，并将来自 `StringBuilder` 对象的 `String` 设置为 `array[0]`。


    因此，该程序输出 "Be a Java Programmer"且没有任何错误。


    ––––––––


    ![image](img/scene_break.png)


    ### Notes：


    (1) if 语句中的条件


    在学习过程中，你可能见过简单的条件，如 `"a== 1"`，你也可以在条件括号中进行计算，例如问题中第 7 行的 `"a+b==c"`。


    ––––––––


    ![image](img/scene_break.png)


    ### (2) StringBuilder


    `StringBuilder` 在 Java 编程中被频繁，因为它比仅使用 `String` 对象进行拼接要快。


    在之后的很多情况下，为了将 `StringBuilder` 对象转换为 `String` 对象，程序员会使用 `toString()` 方法。


    当你初始化 `StringBuilder` 时，可以通过两种方式：


    首先，初始化一个空的 `StringBuilder` 对象，如问题中第 15 行的 `StringBuilder sb = new StringBuilder();`。


    其次，你也可以使用一个 `String` 这样做 `StringBuilder sb = new StringBuilder("text");`。


    如果你决定先追加第一个字符串，可以使用这种方法来简化代码。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


