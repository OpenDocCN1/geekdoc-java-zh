  trans: "\n\n# 问题 26\n\n选择一个描述该程序编译并运行结果的陈述。\n\n```java\npublic class Question_26\
    \ {\n    public static void main(String[] args) {\n        int a = 1 ;\n     \
    \   int b = Arrays.asList(100, 200).size();\n        int c = new Long(3L).intValue();\n\
    \n        if (a+ b == c && (c - a)% 2 == 0) {\n            System.out.println(method1()[0]);\n\
    \        }\n    }\n\n    private static String[] method1() {\n        String[]\
    \ array= new String[1];\n        StringBuilder sb = new StringBuilder();\n\n \
    \       sb.append(\"1 \".trim());\n        sb.append(sb.toString().toUpperCase());\n\
    \        array[0] = sb.toString();\n\n        return array;\n    }\n}\n```\n\n\
    (A) 输出 1\n(B) 输出 11\n\n**答案：(B) 输出 11**\n\n有几点看起来有点复杂。让我们逐一来看。\n\n### 注意事项：\n\n\
    (1) 第 5 行\n`Arrays.asList(100, 200).size()` 表示包含两个元素 100 和 200 的 `ArrayList` 的大小，因此它返回\
    \ 2。\n\n(2) 第 6 行\n首先，通过 `new Long(3L)` 创建了 `Long` 类型。然而，如果将其赋值给变量 `c`会导致编译错误，因为它们的类型是不同的。\n\
    `intValue()` 方法有助于处理这种情况，它返回 `Long` 对象的 int 值。\n\n(3) 第 8 行\n表达式的第二部分 `((c - a)%\
    \ 2 == 0)` 看起来有点复杂。让我们把它分成两部分。在此代码中，变量 `c` 是 3，`a` 是 1，所以 `\"(c - a)\"` 是 2，是一个偶数，所以该条件返回\
    \ true。\n\n(4) 第 17 行\n`trim()` 方法在之前的题目中见过，但这种情况似乎是错误的。在代码中，它被用于双引号中的 `String`，而不是变量。不过没有问题，所以不会发生错误。\n\
    \n(5) 第 18 行\n当操作 `StringBuilder` 时，你可以像这一行一样使用对象本身。\n\n---\n\n# 问题 27\n\n选择一个描述上述程序在扩展后编译并运行后结果的陈述。\n\
    \n```java\npublic class Question_27_1 {\n    private static String str1 = \"A\"\
    ;\n\n    public static String concatStr(String str1, String str2) {\n        return\
    \ new StringBuilder()\n            .append(str1)\n            .append(str2)\n\
    \            .toString();\n    }\n\n    public static String getStr1() {\n   \
    \     return str1;\n    }\n}\n\npublic class Question_27_2 extends Question_27_1\
    \ {\n    public static void main(String[] args) {\n        getStr1().tolowerCase();\n\
    \        Question_27_2 instance= new Question_27_2();\n        instance.method1();\n\
    \    }\n\n    private void method1() {\n        System.out.println(concatStr(getStr1(),\
    \ getStr1()));\n    }\n}\n```\n\n(A) 输出 aa\n(B) 输出 AA\n\n**答案：(B) 输出 AA**\n\n\
    此代码的要点如下：\n1. 访问父类的字段和方法\n2. 返回语句的写法（在父类的第 4 行）\n\n### 注意事项：\n\n(1) 访问父类的字段和方法\n\
    父类字段 `str1` 的访问修饰符是 `private`。然而，这里有一个方法 `getStr1()`。该方法的访问修饰符是 `public`，所以如果你使用此方法来获取字段而不是直接访问，就不会发生任何错误。这种方法被称为“getter\
    \ 方法”或简单称为“getter”。相反，还有另一种类型的方法，被称为“setter 方法”。其访问修饰符通常像 getter 一样是 public，此方法用于为特定类的私有字段赋值。下面是它的样子（如果这是本题的代码）。\n\
    \n```java\npublic static void setStr(String str1) {\n    Question_27_1.str1 =\
    \ str1;\n}\n```\n\n(2) 返回语句的写法（在父类的第 4 行）\n在很多情况下，返回值在返回语句之前已经初始化了，这是一种常见的编码风格。然而，你不需要在返回语句之前创建值，你可以在返回语句中完成。只需像这段代码第\
    \ 4 行那样写在 \"return\" 之后。\n\n---\n\n# 问题 28\n\n选择一个描述该程序编译并运行结果的陈述。\n\n```java\n\
    public class Question_28 {\n    public static void main(String[] args) {\n   \
    \     LocalDateTime ldt1 = LocalDateTime.of(2020, 01, 01, 12, 34, 56);\n     \
    \   if (!isLocalDateTime(ldt1)) {\n            return;\n        }\n        if\
    \ (!isLocalDateTime(ldt1)) {\n            System.exit(1);\n        }\n       \
    \ System.out.println(ldt1.getYear());\n    }\n\n    public static boolean isLocalDateTime(LocalDateTime\
    \ ldt) {\n        Predicate<LocalDateTime> predicate = new Predicate<LocalDateTime>()\
    \ {\n            public boolean test(LocalDateTime e) {\n                return\
    \ e instanceof LocalDateTime;\n            }\n        };\n        return predicate.test(ldt);\n\
    \    }\n}\n```\n\n(A) 输出 2020\n(B) 无输出\n\n**答案：(A) 输出 2020**\n\n此程序的操作如下：\n1.\
    \ 创建 `LocalDateTime` 对象\n2. 检查是否为 `LocalDateTime` 类型\n3. 输出它的年份\n\n### 注意事项：\n\
    \n(1) `LocalDateTime.of()`\n创建 `LocalDateTime` 对象使用 `now()` 或 `of()`。`now()` 返回应用程序运行时的\
    \ `LocalDateTime` 对象。你可以使用 `of()` 指定时间戳。\n\n### `getYear()`\n此方法返回 `LocalDateTime`\
    \ 对象的年份。还有更多方法，如 `getMonth()`、`getHour()` 等。\n\n(2) `Predicate`\n这是 Java 8 中的函数式接口之一。用于返回布尔值。在代码\
    \ 16 行到 21 行，它不是 Lambda 表达式。你可以像下面一样重写它：\n\n```java\nPredicate<LocalDateTime>\
    \ predicate = e -> e instanceof LocalDateTime;\n```\n并使用上述代码，在第 22 行编写相同的代码。\n\
    \n---\n\n# 问题 29\n\n选择一个描述该程序编译并运行结果的陈述。\n\n```java\npublic class Question_29\
    \ {\n    public static void main(String[] args) {\n        HashMap<Object, String>\
    \ map = new HashMap<Object, String>();\n        map.put(1L, \"A\");\n        map.put(null,\
    \ \"B\");\n        map.put(\"String\", null);\n\n        Question_29 instance=\
    \ new Question_29();\n        instance.method1(map.get(\"String\"));\n    }\n\n\
    \    public void method1(Object object) {\n        Optional<Object> a = Optional.ofNullable(object);\n\
    \        System.out.println(a.orElse(\"output\"));\n    }\n}\n```\n\n(A) 输出 null\n\
    (B) 输出 output\n(C) 编译错误\n(D) 运行时异常\n\n**答案：(B) 输出 output**\n\n此程序的操作如下：\n1. 创建包含三个条目的\
    \ `HashMap`\n2. 如果键为 `\"String\"` 的值不为空，则输出它。\n3. 如果键为 `\"String\"` 的值为空，则输出 `\"\
    output\"`。\n\n### 注意事项：\n\n(1) 作为 map 键的 `Object` 类型\n`Object` 类型可空，所以如果你将其指定为\
    \ map 的键，可以对其设置为 `null`。\n\n"
- fmt: "\nAlso, `Object` type wraps all types, so `1L` and `\"String\"` can be set.\n\
    \n### (2) Optional\n\n`Optional` type is for objects that might be null. It wraps\
    \ the object.\n\n### <method ofNullable()>\n\nThe argument of `method1` might\
    \ be null, so the method is used. If the argument might not be null, you can use\
    \ `of()` instead.\n\n### <method orElse()>\n\nThis method is for nullable value.\n\
    \nIf you use `if` statement, you have to write code like below instead of code\
    \ at line 19.\n\n```java\nif (object != null) {\n    System.out.println(object);\n\
    } else {\n    System.out.println(\"output\");\n}\n```\n\n# Question 30\n\nSelect\
    \ the one statement that describes the result when the program that uses the program\
    \ above is compiled and run.\n\n```java\npublic class Question_30_1 {\n  private\
    \ Long a;\n  public Long getA() { return a; }\n  public void setA(Long a) {this.a=\
    \ a; }\n}\n\npublic class Question_30_2 {\n  public static void main(String[]\
    \ args) {\n    Question_30_1 a = new Question_30_1();\n    Question_30_1 b = new\
    \ Question_30_1();\n\n    a.setA((long) 1); \n    b.setA(Long.valueOf(2));\n \
    \   List<Question_30_1> list= Arrays.asList(a, b); \n    method1(list);\n  }\n\
    \n  public static void method1(List<Question_30_1> list) {\n    list.forEach(new\
    \ Consumer<Question_30_1>() {\n      public void accept(Question_30_1 object)\
    \ {\n        System.out.print(object.getA());\n      }\n    });\n  }\n}\n```\n\
    \n(A) output 12\n(B) output 1212\n(C) compile error\n(D) runtime exception\n\n\
    **Answer : (A) output 12**\n\nWhat this program does is below:\n1. create two\
    \ instances of `Class` with one field\n2. set value each value of them\n3. create\
    \ list with the instances\n4. output each field of element of the list\n\n**Notes:**\n\
    (1) convert to `Long`\nThere are three easy ways to convert object to `long`:\n\
    1. `(long) object`\n2. `Long.valueOf(object)`\n3. `new Long(object)`\nNo.2 and\
    \ 3 are `Long`, but 1 is `long`. It converts to `Long` automatically by Java compiler.\n\
    \n(2) `Consumer`\nThis is one of Functional Interfaces from Java 8. The method\
    \ of this doesn't return value, type is `void`.\nIn this code at line 14 to 18,\
    \ it isn't lambda expression.\nYou can rewrite it with lambda expression like\
    \ below:\n```java\nlist.forEach(e -> System.out.print(e.getA()));\n```\nor:\n\
    ```java\nlist.forEach(e -> {\n  System.out.print(e.getA());\n});\n```\n\n# Question\
    \ 31\n\nSelect the one statement that describes the result when this program is\
    \ compiled and run.\n\n```java\npublic class Question_31 {\n  public static void\
    \ main(String[] args) {\n    Long a= 100L;\n    Integer b = 100;\n    if (Integer.compare(a.intValue(),\
    \ b) == 0 && b instanceof Integer) {\n      try {\n        String str = null;\
    \ \n        Objects.requireNonNull(str, \"ABC\");\n      } catch (NullPointerException\
    \ e) {\n        System.out.println(e.getMessage());\n      }\n    }\n  }\n}\n\
    ```\n\n(A) output nothing\n(B) output ABC\n\n**Answer : (B) output ABC**\n\nThe\
    \ point of this code is below:\n1. what `Integer.compare` does\n2. what `Objects.requireNonNull`\
    \ does\n\n**Notes:**\n(1) `Integer.compare()`\nThis method uses two arguments\
    \ and compare whether the first argument is equal to, greater, or less than the\
    \ second argument. It returns `int`. Return values are below:\n- The arguments\
    \ are equal: 0\n- The first is greater than second\n- The first is less than second:\
    \ -1\nSo, return value of this code at line 7 is `true`.\n\n(2) `Objects.requireNonNull()`\n\
    This method at line 13 uses two arguments. It checks whether the first argument\
    \ is null or not, and if it is, throws `NullPointerException`. The second argument\
    \ is used for message, so this code outputs `ABC`.\nHowever, there is one important\
    \ point: if you rewrite code at line 17 to `System.out.println(\"Java\");`, this\
    \ code outputs `\"Java\"`. The second argument affects message field of `NullPointerException`\
    \ object, but above code doesn't use it.\n\n# Question 32\n\nSelect the one statement\
    \ that describes the result when this program is compiled and run.\n\n```java\n\
    public class Question_32 {\n  public static void main(String[] args) {\n    List<Integer>\
    \ list1 = Arrays.asList(1, 2, 3);\n    List<Integer> list2 = Arrays.asList(4,\
    \ 5, 6);\n    List<List<Integer>> list3 = Arrays.asList(list1, list2);\n    method1(list3).forEach(System.out::print);\n\
    \  }\n\n  private static List<Object> method1(List<List<Integer>> list) {\n  \
    \  return list.stream()\n      .flatMap(e -> e.stream())\n      .sorted(Comparator.reverseOrder())\n\
    \      .collect(Collectors.toList());\n  }\n}\n```\n\n(A) output 123456\n(B) output\
    \ 654321\n\n**Answer : (B) output 654321**\n\nWhat this program does is:\n1. create\
    \ two lists to store `Integer` elements\n2. create one list to store them\n3.\
    \ merge two list in the list to one list to store `Integer` with reverse order\n\
    4. output them all\n\n**Notes:**\n(1) `flatMap()`\nThis method changes multiple\
    \ collections into one stream. It makes it easy to concat list, for example. In\
    \ this code, there are two lists in one list at line 8.\nInside `list3`:\n- `[1,\
    \ 2, 3]`\n- `[4, 5, 6]`\nAfter using `flatMap()` and `sorted()`: `(6, 5, 4, 3,\
    \ 2, 1)`\n\n(2) method reference\nAt line 10 `method1(list3).forEach(System.out::print);`\
    \ is using method reference. You can shorten your code with this.\nIf you rewrite\
    \ it to lambda, it looks like:\n```java\nmethod1(list3).forEach(e -> System.out.print(e));\n\
    ```\n\n# Question 33\n\nSelect the one statement that describes the result when\
    \ this program is compiled and run.\n\n```java\npublic class Question_33 {\n \
    \ public static void main(String[] args) {\n    String str = \"JAVA\";\n    try\
    \ {\n      throw new NumberFormatException();\n    } catch (NullPointerException\
    \ e) {\n      return;\n    } catch (Exception e) {\n      Predicate<Long> a =\
    \ Predicate.isEqual(2L);\n      if (a.test(10L)) {\n        str.replace(\"JAVA\"\
    , \"ABC\");\n      } else {\n        str.replace(\"JAVA\", \"\");\n      }\n \
    \   }\n    System.out.println(str.length());\n  }\n}\n```\n\n(A) output 0\n(B)\
    \ output 3\n(C) output 4\n(D) compile error or runtime exception\n\n**Answer :\
    \ (C) output 4**\n\nWhat this code does below:\n1. initialize `str`\n2. throw\
    \ `NumberFormatException` explicitly\n3. second catch block, replacing `str`\n\
    4. output length of `str`\n\n**Notes:**\n(1) `throw exception explicitly`\nIt\
    \ seems a bit strange to throw exception explicitly, but it doesn't cause any\
    \ error.\nThe exception thrown at line 8 is `NumberFormatException`, so the first\
    \ `catch` block isn't executed.\n"
