    \ `Class` 的对象。在题目的第 21 行，它检查 \"ldt\" 是否是 `LocalDateTime` 类对象。\n\n在这种情况下，\"flg\"\
    \ 为 `true`；\n\n# Question 4\n\n选择一个语句作为下方代码中 `// some code` 的替换，以便该程序在编译运行后输出\
    \ \"JAVA\"。\n\n```java\npublic class Question_4 {\n  public static void main(String[]\
    \ args) {\n    LinkedHashMap<String, String> map=new LinkedHashMap<String, String>();\n\
    \    map.put( \"1 \", \"J\");\n    map.put(\"2\", \"A\");\n    map.put(\"3\",\
    \ \"V\");\n    map.put(\"4\", \"A\");\n\n    // some code\n    if (flg) {\n  \
    \    map.entrySet().stream().forEach(e -> {\n        System.out.print(e.getKey());\n\
    \      })\n    } else {\n      map.entrySet().stream().forEach(e -> {\n      \
    \  System.out.print(e.getValue());\n      })\n    }\n  }\n}\n```\n\n(A) `boolean\
    \ flg = true;`\n(B) `boolean flg = false;`\n(C) `Boolean flg = null;`\n(D) `Object\
    \ flg = null;`\n\n## Answer : (B) boolean flg = false;\n\n在此代码中，创建了 \"map\" 对象并放入了键值。目标是按照添加顺序输出\
    \ \"map\" 对象内部的值。\n\n在第 15 行的 `if` 语句条件下，如果 \"flg\" 为 `true`，程序将输出所有的键；如果为 `false`，则输出值。因此答案是\
    \ (B)。\n\n## Notes :\n\n(1) LinkedHashMap\n\n当你开始学习 Java 时，大多数情况下首先学习 `HashMap`。但在这种情况，你必须按照添加顺序输出所有值。\n\
    \n`Hashmap` 不保证顺序，这就是为什么这段代码使用 `LinkedHashMap` 代替它的。\n\n### (2) 选项 (C) 和 (D)\n\
    \n关于选项 (C)：如果你在代码中写 `Boolean flg = null;`，编译不会报错；但如果你在代码中写 `boolean flg = null;`，则会报错。\n\
    \n这就是基本类型和对象之间的区别。基本类型是值本身。而对象提供引用，`null` 意味着没有引用。因此，对象被称为“可空的 (nullable)”。\n\n\
    关于选项 (D)：`Object` 类封装了所有类，所以如果你在代码中写它，编译不会报错。\n\n### (3) forEach\n\n这是从 Java 8\
    \ 开始引入的 `StreamAPI` 中的一个方法。它对流内部的所有元素执行某些某种操作。\n\n对于初学者来说，将其考虑为编写集合 `for` 循环的替代方式会更好。严格来说，它们并不相同，但起初这样足够了。\n\
    \n# Question 5\n\n```java\npublic class Question_5_1 {\n  public Integer number;\n\
    \  public Integer getNumber() { return number; }\n  public void setNumber(Integer\
    \ number) {this.number= number; }\n}\n```\n\n选择一个语句，描述使用上述程序的程序在编译运行时的结果。\n\n\
    ```java\npublic class Question_5_2 {\n  public static void main(String[] args)\
    \ {\n    Question_5_1 instance1 = new Question_5_1();\n    Question_5_1 instance2\
    \ = new Question_5_1();\n    instance1.setNumber(0);\n    instance2.setNumber(0);\n\
    \n    if (instance1.getNumber() == instance2.getNumber()) {\n      System.out.print(\"\
    true\");\n    } if (instance1.equals(instance2)) {\n      System.out.print(\"\
    true\");\n    } else {\n      System.out.print(\"false\");\n    }\n  }\n}\n```\n\
    \n(A) 输出 true true\n(B) 输出 true false\n(C) 输出为空\n(D) 编译错误或运行时异常\n\n## Answer :\
    \ (B) 输出 true false\n\n在此代码的第 8 行，比较了 `Question_5_1` 实例的 `number` 字段。它返回 `true`，所以程序会输出内容，这就是为什么选项\
    \ (C) 是错误的。第 10 行的条件返回 `false`，所以选项 (B) 是正确的。\n\n## Notes :\n\n(1) 不在圆括号内部换行\n\
    \n在圆括号内部开启新行在 Java 中非常常见。当然，如果存在多个语句，这样做可以提高代码的可读性；但如果圆括号内只有一个语句，不新起行是良好的代码编写方式。\n\
    \n### 比较 :\n\n<不新起行>\n{ some code; }\n\n<新起行>\n{\nsome code;\n}\n\n### (2) Object\
    \ 类的 equals 方法\n\n在第 10 行，比较两个实例是否相同。如你在第 5 行和第 6 行所示，字段的值相同，但它们是不同的实例。这就是为什么条件返回\
    \ `false`；\n\n# Question 6\n\n选择一个语句，描述此程序在编译运行时的结果。\n\n```java\npublic class\
    \ Question_6 {\n  public static void main(String[] args) {\n    while (!false)\
    \ {\n      try {\n        System.out.print(\"A\");\n        Integer.parseInt(\"\
    Hello World\");\n      } catch (Exception e) {\n        System.out.print(\"B\"\
    );\n        break;\n      } finally {\n        System.out.print(\"C\");\n    \
    \  }\n    }\n    System.out.print(\"D\");\n  }\n}\n```\n\n(A) 输出 AD\n(B) 输出 ABO\n\
    (C) 输出 ABCD\n(D) 输出 ABDC\n\n## Answer : (C) 输出 ABCD\n\n在第 5 行，`!false` 等同于 `true`，所以循环开始。\n\
    \n由于参数不是数字，在第 8 行发生异常，因此 `catch` 和 `finally` 块中的语句都会执行。\n\n## Notes :\n\n(1) Integer.parseInt()\n\
    \n这是 `Integer` 类的一个静态方法。它将 `String` 参数转换为 `int` 值，在 Java 编程中非常常见。\n\n当参数不是数字（值而非类型时），会发生\
    \ `NumberFormatException`。这是与 `NullPointerException` 最著名的异常之一。\n\n(2) break 语句与\
    \ finally 块的处理顺序\n\n如你在第 11 行所示，程序将退出 `while` 循环。`finally` 块会优先执行，然后退出 `while`\
    \ 循环。\n\n(3) catch 块\n\n在此代码中，你只看到一个 `catch` 块，但你可以通过编写如下多个 `catch` 块来处理每种异常。如果你希望根据不同的异常产生不同的结果，应该这样写代码。\n\
    \n```java\ncatch (NullPointerException e) {\n  // some code;\n} catch (NumberFormatException\
    \ e) {\n  // some code;\n}\n```\n\n"
