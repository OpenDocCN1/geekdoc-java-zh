    \ If(i>ᴊ){\n            Systeᴍ.out.priɴt(i);\n        }\n        Else if(ᴊ>i)\
    \ {\n            Systeᴍ.out.priɴt(ᴊ);\n        }\n        Else {\n           \
    \ Systeᴍ.out.priɴt(\"Equal\");\n        }\n    }\n}\n```\n\n该代码执行后的输出如下 –\n\n\
    ![rsrc200.jpg](img/image013.jpg)\n\n## Switch\n\n如果你有一个变量，并且需要该变量的不同值执行不同的代码块，那么理想的结构是\
    \ switch 语句。该结构的语法为——\n\n```java\nSwitch(variable){\n    Case <value1>:\n    \
    \    /*body*/\n        break;\n    Case <value2>:\n        /*body*/\n        break;\n\
    \    Case <value3>:\n        /*body*/\n        break;\n    default:\n        /*body*/\n\
    \        break;\n}\n```\n\n以下是该结构的示例实现——\n\n```java\npuʙlic class switchdeᴍo {\n\
    \    Puʙlic static void ᴍaiɴ(Striɴg args[]) {\n        Iɴt i = 5;\n        Switch\
    \ (i) {\n            Case 0:\n                Systeᴍ.out.priɴt(0);\n         \
    \       break;\n            Case 2:\n                Systeᴍ.out.priɴt(2);\n  \
    \              break;\n            Case 5:\n                Systeᴍ.out.priɴt(5);\n\
    \                break;\n            default:\n                Systeᴍ.out.priɴt(999);\n\
    \                break;\n        }\n    }\n}\n```\n\n该代码执行后的输出如下 –\n\n![rsrc201.jpg](img/image011.jpg)\n\
    \n## 三元运算符\n\nJava 还支持条件运算符，也称为 `?:` 运算符。该运算符用于替换 ‘if else’ 结构。其语法如下——\n\n`Expression1\
    \ ? Expression2 : Expression3` 这里，`Expression1` 是需要测试的条件。如果条件为真，则执行 `Expression2`，否则执行\
    \ `Expression3`。\n\n![image](img/chapter_title_left) |  | ![image](img/chapter_title_right)\
    \ |\n\n![image](img/chapter_title_above)\n\n# 第 8 章：循环控制\n\n![image](img/chapter_title_below)\n\
    \n有几种情况需要你多次执行一组结构。例如，如果你需要对一组数字排序，你需要多次遍历以获得所需的结果。这种执行流被称为循环。简单来说，循环是一种允许多次执行代码块的结构。Java\
    \ 支持几种用于循环的结构，包括 `while` 循环、`for` 循环和 `do while` 循环。\n\n`while` 循环迭代执行代码块，直到 `while`\
    \ 指定条件为真。一旦条件失败，循环停止。\n\n![rsrc1ZH.jpg](img/image043.jpg)\n\n`for` 循环允许程序员在同一个结构中操作条件和循环变量。因此，你可以初始化一个循环变量，增加/减少它并运行循环直到该变量为真。\n\
    \n![rsrc1Zj.jpg](img/image040.jpg)\n\n`do while` 循环与 `while` 循环相似。然而，在 `while`\
    \ 循环中，是在执行代码块之前检查条件。而在 `do while` 循环中，是执行代码块后检查条件。如果条件满足，则再次迭代循环，否则终止。可以说 `do\
    \ while` 循环至少执行一次。\n\n![rsrc1Zj.jpg](img/image040.jpg)\n\n## 循环状态\n\n有两个专门用于循环的关键字，被称为控制状态，因为允许控制流从一段代码转移到另一个部分。这些关键字是——\n\
    \n`break` 用于循环内部，当你希望执行流终止循环并直接从循环后的第一个语句开始。\n\n`continue` 用于循环内部，当你希望计算机忽略循环的剩余部分并将控制移动到循环的第一语句。为了帮助你理解循环如何执行，让我们来看一个实现所有三种循环控制的示例。\n\
    \n### For 循环实现\n\n```java\nPuʙlic class fordeᴍo {\n    Puʙlic static void ᴍaiɴ(Striɴg\
    \ args[]) {\n        Iɴt [] ɴuᴍerarray = {100, 300, 500, 700, 900};\n        For(iɴt\
    \ i=0; i<5; i++) {\n            Systeᴍ.out.priɴt(ɴuᴍʙerarray[i]);\n          \
    \  Systeᴍ.out.priɴt(\",\");\n        }\n        Systeᴍ.out.priɴt(\"\\ɴ\");\n \
    \   }\n}\n```\n\n该代码执行后的输出如下 –\n\n![rsrc202.jpg](img/image033.jpg)\n\n## While\
    \ 循环实现\n\n```java\nPuʙlic class whiledeᴍo {\n    Puʙlic static void ᴍaiɴ(Striɴg\
    \ args[]) {\n        Iɴt [] ɴuᴍerarray = {100, 300, 500, 700, 900};\n        Iɴt\
    \ i = 0;\n        While(i<5) {\n            Systeᴍ.out.priɴt(ɴuᴍʙerarray[i]);\n\
    \            Systeᴍ.out.priɴt(\",\");\n            I++;\n        }\n        Systeᴍ.out.priɴt(\"\
    \\ɴ\");\n    }\n}\n```\n\n该代码执行后的输出如下 –\n\n![rsrc203.jpg](img/image045.jpg)\n\n\
    ## do While 循环实现\n\n```java\nPuʙlic class dowhiledeᴍo {\n    Puʙlic static void\
    \ ᴍaiɴ(Striɴg args[]) {\n        Iɴt [] ɴuᴍerarray = {100, 300, 500, 700, 900};\n\
    \        Iɴt i = 0;\n        do {\n            Systeᴍ.out.priɴt(ɴuᴍʙerarray[i]);\n\
    \            Systeᴍ.out.priɴt(\",\");\n            I++;\n        } while (i<5);\n\
    \        Systeᴍ.out.priɴt(\"\\ɴ\");\n    }\n}\n```\n\n"
- fmt: "\nAll the file operations are supported by java under the `java.io` package\
    \ and the implementation of these functions is based on the concept of streams.\
    \ Stream is simply a sequence of data, which is of two types namely, `inputStream`\
    \ and `outputStream`. While the former is used to read data, the latter is used\
    \ to write data.\n\n## Byte Streams\n\nThe first type of stream supported by java\
    \ is byte stream. The I/o operations that are restricted to 8-bit size fall under\
    \ this category. Before we get down to coding, you need to realize that the classes\
    \ used for performing input and output are `FileInputStream` and `FileOutputStream`\
    \ respectively. Let us now look at an example that copies the contents of one\
    \ file to the other.\n\n```java\nimport java.io.*;\n\npublic class copyfilebs\
    \ {\n    public static void main(String args[]) throws IOException {\n       \
    \ FileInputStream inputfile = null;\n        FileOutputStream outputfile = null;\n\
    \        try {\n            inputfile = new FileInputStream(\"in.txt\");\n   \
    \         outputfile = new FileOutputStream(\"out.txt\");\n            int i;\n\
    \            while ((i = inputfile.read()) != -1) {\n                outputfile.write(i);\n\
    \            }\n        } finally {\n            if (inputfile != null) {\n  \
    \              inputfile.close();\n            }\n            if (outputfile !=\
    \ null) {\n                outputfile.close();\n            }\n        }\n   \
    \ }\n}\n```\n\nKeep an input file named `in.txt` in the same folder as the class\
    \ file and execute the code to see what it does.\n\n## Character Streams\n\nMoving\
    \ from 8-bit data operations to 16-bit Unicode data operations, we need to switch\
    \ from binary Streams to character Streams. The classes used for performing input\
    \ and output is `FileReader` and `FileWriter` respectively. The code shown above\
    \ can be modified to use character streams in the following manner.\n\n```java\n\
    import java.io.*;\n\npublic class copyfilecs {\n    public static void main(String\
    \ args[]) throws IOException {\n        FileReader inputfile = null;\n       \
    \ FileWriter outputfile = null;\n        try {\n            inputfile = new FileReader(\"\
    in.txt\");\n            outputfile = new FileWriter(\"out.txt\");\n          \
    \  int i;\n            while ((i = inputfile.read()) != -1) {\n              \
    \  outputfile.write(i);\n            }\n        } finally {\n            if (inputfile\
    \ != null) {\n                inputfile.close();\n            }\n            if\
    \ (outputfile != null) {\n                outputfile.close();\n            }\n\
    \        }\n    }\n}\n```\n\nKeep an input file named `in.txt` in the same folder\
    \ as the class file and execute the code to see what it does.\n\n## Standard Streams\n\
    \nIn order to allow the user to take input from the keyboard and print the output\
    \ on the screen, java supports the standard streams –\n\n- `System.in` represents\
    \ the standard input stream and allows user to give input via the keyboard.\n\
    ![rsrc1ZH.jpg](d2d_images/image043.jpg)\n- `System.out` represents the standard\
    \ output stream and allows user to get output on the screen.\n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n\
    - `System.err` represents the standard error stream and allows user to error messages\
    \ from the system.\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n\nThe sample program\
    \ given below allow the system to take input from the user and print the input\
    \ given to the screen until the user hits the ‘q’ key after which the program\
    \ quits.\n\n```java\nimport java.io.*;\n\npublic class ssddemo {\n    public static\
    \ void main(String args[]) throws IOException {\n        InputStreamReader inputc\
    \ = null;\n        try {\n            inputc = new InputStreamReader(System.in);\n\
    \            System.out.println(\"Enter characters, 'q' to quit.\");\n       \
    \     char char;\n            do {\n                char = (char) inputc.read();\n\
    \                System.out.print(char);\n            } while(char != 'q');\n\
    \        } finally {\n            if (inputc != null) {\n                inputc.close();\n\
    \            }\n        }\n    }\n}\n```\n\nThis program can be executed to see\
    \ what the output is and how the code works.\n\n# Exception Handling\n\nException\
    \ is any event that is unexpected that cannot be handled by the program. Obviously,\
    \ the normal flow of execution of the program is hampered in such situation and\
    \ the program may terminate with an error or behave abnormally. This is the reason\
    \ why exceptions need to be handled by the program only.\n\nSo, why do exceptions\
    \ occur? Exceptions may occur because a range of reasons. Some of the scenarios\
    \ that may lead to this situation include:\n- Invalid data entry ![rsrc1ZH.jpg](d2d_images/image043.jpg)\n\
    - The program is trying to open a file that is not present at the specified location\
    \ ![rsrc1Z.jpg](d2d_images/image040.jpg)\n- The JVM has fallen short of memory\
    \ ![rsrc1Z.jpg](d2d_images/image040.jpg)\n- Network communication is being carried\
    \ out and the system loses connection ![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n\
    \nEvidently, exceptions may occur due to problems created by the system, user\
    \ or issues at the program level. On the basis of this observation, three classes\
    \ of exceptions have been created. These three classes of exceptions have been\
    \ discussed in chapter.\n\n## Checked Exceptions\n\nExceptions that are checked\
    \ and reported by the compiler at the time of compilation are termed as checked\
    \ exceptions. They are also compile time exceptions and need to be handled by\
    \ the developer during the time he she writes code.\n\nAn example of how exception\
    \ handling for such an error is performed is shown in the sample code given below.\n\
    \n```java\nimport java.io.File;\nimport java.io.FileReader;\n\npublic class demoh\
    \ {\n    public static void main(String args[]) {\n        File file = new File(\"\
    E://samplefile.txt\");\n        FileReader infile = new FileReader(file);\n  \
    \  }\n}\n```\n\nIf the filename and location specified while creating file handler\
    \ is not present at the specified location, the compiler gives the error `FileNotFoundException`.\n\
    \n## Unchecked Exceptions\n\nThere are some exceptions that happen at runtime.\
    \ Such exceptions are called unchecked exceptions or runtime exceptions. Logical\
    \ errors, programming bugs and wrong usage of ap are examples of this type of\
    \ error. Another important characteristic of this type of errors is that they\
    \ are not detected at the time of compilation.\n\nTo help you understand what\
    \ runtime errors are, let us take an example. Consider that you have implemented\
    \ an array of 5 elements as part of your program. however, part of the code is\
    \ accessing the 6th element. This error will be detected at runtime and the system\
    \ will generate the error `ArrayIndexOutOfBoundsException`.\n\n## Errors\n\nThere\
    \ are some exceptions, which are beyond the control of the system or the programmer.\
    \ A common example of such errors is stackOverflowError. There is hardly anything\
    \ that you can do about these errors. So, it is best to ignore them. As when they\
    \ occur, they will interrupt the execution of your program, but nothing can be\
    \ done about it.\n\n## Exception hierarchy\n\njava has an inbuilt class named\
    \ `java.lang.Exception` and all the exceptions fall under this class. All the\
    \ exception classes are subclasses of this class. Moreover, `Throwable` is the\
    \ superclass of the exception class. Another subclass of the Throwable class is\
    \ the `Error` class. All errors like stack overflow described above fall under\
    \ this Error class.\n\nThe Exception class has two subclasses namely `RuntimeException`\
    \ and `IOException`. A list of the methods, for which definitions are available\
    \ in java, as part of the Throwable class, is given below.\n\n- `String getMessage()`:\
    \ When called, this message returns a detailed description of the exception that\
    \ has been encountered. \n- `Throwable getCause()`: This method when called returns\
    \ a message that contains the cause of the exception.\n- `String toString()`:\
    \ This method returns the detailed description of the exception concatenated with\
    \ the name of the class. own- `void printStackTrace()`: The result of `toString()`\
    \ along with a trace of the stack can be printed to the standard error stream,\
    \ `System.err`, can be done by calling this method.\n- `StackTraceElement[] getStackTrace()`:\
    \ Returns an array of stack trace elements.\n"
