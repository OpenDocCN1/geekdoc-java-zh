  trans: "\n\n```java\npublic static void main(String[] args) {\n    String str1 =\
    \ \"Hello\";\n    String space=\" \";\n    Question_? question_?= new Question_?();\n\
    \n    question_7.method1(str1 + space);\n    System.out.println(str1);\n}\n\n\
    private void method1(String str1) {\n    String str2 = \"World\";\n    str1 +=\
    \ str2;\n}\n```\n\n(A) 输出 Hello\n(B) 输出 Hello World\n(C) 编译错误\n(D) 运行时异常\n\n**答案：(A)\
    \ 输出 Hello**\n\n第 9 行将参数 \"Hello\" 传递给 `method1`。\n\n在 `method1` 中，`str1` 从 `\"\
    Hello \"` 变为 `\"Hello World\"`，但这段代码输出 `\"Hello\"`。\n\n让我们从下面详细查看。\n\n![image](img/scene_break.png)\n\
    \n### Notes\n\n**(1) 值传递**\n\n第 9 行传递给 `method1` 的参数是值拷贝（value），因此 `main` 方法中的变量\
    \ `str1` 与 `method1` 方法中的 `str1` 是不同的。它只是一个拷贝。\n\n如第 17 行所示，`method1` 中的变量 `str1`\
    \ 发生了变化，但它不会影响 `main` 方法中的 `str1`。因此，该程序输出 `\"Hello\"`而不是 `\"Hello World\"`。\n\
    \n**(2) 静态与非静态方法**\n\n`main` 方法是 `static` 的，但 `method1` 不是。如果你重写第 9 行的代码为 `method1(str1\
    \ + space);`，就会发生编译错误。\n\n这被称为静态引用（static reference）。如果两个方法都是 `static`，则不会发生编译错误。\n\
    \n**(3) 运算符 \"+=\"**\n\n该运算符的作用等同于下方：\n\n| 1 | `String str1 =` | `\"ABC\";` |\n\
    | 2 | `String str2 =` | `\"DEF\";` |\n| 3 | | |\n| 4s 6 | `// samestr1 = str1\
    \ + str1 += str2;` | `str2;` |\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ | | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 问题 8\n\n![image](img/chapter_title_below.png)\n\n当此程序被编译时，会发生编译错误。选择一个描述错误发生所在行的语句。\n\
    \n![image](img/scene_break.png)\n\n```java\npublic class Question_8 {\n    public\
    \ static void main(String[] args) {\n        final List<String> list1 = new Arraylist<>();\n\
    \n        list1.add( \"This \");\n        list1.add(\"list \");\n        list1.add(\"\
    is \");\n        list1.add(\"final.\");\n\n        List<String> list2 = new Arraylist<>();\n\
    \n        System.out.println(list2.size());\n\n        list1 = list2;\n\n    \
    \    System.out.println(\" done.\");\n    }\n}\n```\n\n| (A) | 行 | 7 |\n| (B)\
    \ | 行 | 14 |\n| (C) | 行 | 16 |\n| (D) | 行 | 18 |\n\n**答案：(C) 行 16**\n\n第 5 行，`list1`\
    \ 被初始化为 `final Arraylist`。如果你给 `final Arraylist` 赋值另一个列表，就会发生编译错误。\n\n![image](img/scene_break.png)\n\
    \n### Notes\n\n**(1) ArrayList**\n\n`<final ArrayList>`\n\n如上所述，`final ArrayList`\
    \ 在初始化后不能被重新赋值。\n\n你可能会想为什么第 7 行没有发生编译错误。这是一个很好的视角。对于 `final Arraylist`，允许添加新元素，反之则不允许重新赋值。\n\
    \n**<method size()>**\n\n你可能也会想为什么第 14 行没有发生编译错误，这也是一个很好的视角。显然 `list2` 已经初始化了，到此为止。\n\
    \n之后没有添加任何元素，但使用方法 `size()` 没有问题。它只是简单的返回 0。\n\n**<初始化方法>**\n\n在代码中，通过第 5 行和第\
    \ 7 到第 10 行，使用了 5 行代码创建了一个包含四个元素的 `Arraylist`。\n\n它不会导致任何错误或运行时异常。\n\n然而，还有另一种初始化方法，不需要使用更少的行，所示，这样更好记忆。\n\
    \n```java\nfinal List<String> list1 = Arrays.aslist(\"This \", \"list \", \"final.\"\
    );\n```\n\n| ![image](img/chapter_title_corner_decoration_left.png) | | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# 问题 9\n\n![image](img/chapter_title_below.png)\n\
    \n选择一个描述此程序编译并运行结果的语句。\n\n![image](img/scene_break.png)\n\n```java\npublic class\
    \ Question_9 {\n    public static void main(String[] args) {\n        HashMap<Integer,\
    \ Integer> map = new HashMap<>();\n\n        map.put(1, 2);\n        map.put(3,\
    \ 4);\n        map.clear();\n\n        if (map.isEmpty()) {\n            map.put(1,\
    \ 2);\n        }\n        System.out.println(map.size());\n    }\n}\n```\n\n(A)\
    \ 输出 true\n(B) 输出 false\n(C) 编译错误\n(D) 运行时异常\n\n**答案：(A) 输出 true**\n\n第 17 行，`map.size()`\
    \ 返回 1，因为 `map.put(1, 2)` 被执行了。\n\n![image](img/scene_break.png)\n\n### Notes\n\
    \n**(1) clear()**\n\n此方法清空 map 中的所有元素。\n\n如上所述，`map.clear()` 会删除所有条目。\n\n在第 10\
    \ 行，`map.isEmpty()` 返回 true，因为 map 是空的。\n\n![image](img/scene_break.png)\n\n**(2)\
    \ isEmpty()**\n\n此方法检查 map 是否为空。\n\n在第 12 行，`map.isEmpty()` 返回 true。\n\n![image](img/scene_break.png)\n\
    \n**(3) duplicate key**\n\n在第 13 和 14 行，`map.put(1, 2)` 覆盖了之前的键。在第 17 行，`map.size()`\
    \ 返回 1。\n\n| ![image](img/chapter_title_corner_decoration_left.png) | | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n# 问题 10\n\n![image](img/chapter_title_below.png)\n\n选择一个描述此程序编译并运行结果的语句。\n\
    \n![image](img/scene_break.png)\n\n```java\npublic class Question_10 {\n    public\
    \ static void main(String[] args) {\n        Integer a = method1(\"1\");\n   \
    \     if (a == 0 && a != null) {\n            System.out.println(a);\n       \
    \ }\n    }\n\n    private static Integer method1(String str) {\n        if (Integer.parseInt(str)\
    \ > 0) {\n            return null;\n        } else {\n            return 100;\n\
    \        }\n    }\n}\n```\n\n(A) 输出 null\n(B) 输出 100\n(C) 编译错误\n(D) 运行时异常\n\n\
    **答案：(D) 运行时异常**\n\n在第 12 行，`method1` 返回 `null`，因为参数大于 0。在第 6 行，比较 `null` 和 0\
    \ 会导致运行时异常。\n\n### Notes\n\n**(1) NullPointerException**\n\n这是 Java 中最著名的异常之一。在大多数情况下，Java\
    \ 程序员至少会遇到一次。\n\n**<if condition>**\n\n在代码的第 6 行，使用 `==` 比较 `null` 和 0，这就是为什么会发生异常。反转它们的顺序，这样你可以先进行空检查，如果它为\
    \ null，则返回 false，不会发生运行时异常。\n\n**(2) method1**\n\n此方法在第 12 行返回 `null`，因为参数大于 0。\n\
    \n**(3) happens normally**\n\n这种异常在很多时候经常发生。例如，急于发布应用而没有进行空检查。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ | | ![image](img/chapter_title_corner_decoration_right.png) |\n\n"
