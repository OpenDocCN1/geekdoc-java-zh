    \ the next car by adding 1 to rental car number.\n5. If you get to the non-existent\
    \ rental car number 100, then report that all cars or vehicles were rented out.\n\
    \nAs for computers, they do not follow English-translated instructions to do a\
    \ specific task. Instead, they understand cryptic Java bytecode commands. This\
    \ is where the compiler comes in. After writing your Java source code, it is being\
    \ translated and written by the compiler into Java bytecodes that the computer\
