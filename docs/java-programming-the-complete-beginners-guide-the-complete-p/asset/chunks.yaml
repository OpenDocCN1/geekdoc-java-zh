  trans: "\n\n```java\nrentalcarNum ++;\n\n}\n\n}\n\nout.println(\"All cars or vehicles\
    \ are rented out\");\n```\n\n这段基础 Java 代码用于为特定客户搜索任何可用的租赁汽车或车辆，假设公司总共有 99 辆车。你不能直接通过这样输入来运行这段代码。然而，忽略那些奇怪的标点符号和输入格式，人类能够理解它想让计算机做什么：\n\
    \n1. 将租赁车辆编号设置为 1。\n2. 只要租赁车辆编号小于 100，就检查租赁车辆的客户人数。\n3. 如果租赁车辆的客户人数为 0，则报告车辆可用，并停止。\n\
    4. 否则，通过将租赁车辆编号加 1 来准备检查下一辆车。\n5. 如果你达到了不存在的租赁车辆编号 100，则报告所有汽车或车辆均已租出。\n\n对于计算机来说，它们并不遵循翻译成英文的指令来执行特定任务。相反，它们理解的是晦涩的\
    \ Java 字节码命令。这就是编译器派上用场的地方。在编写完 Java 源码后，编译器会将其翻译并编写成计算机可以执行的 Java 字节码。查看下述相同\
    \ Java 代码的字节码对应：\n\n```\naload_0 iconst_1\nputfield Company/rentalcarNum I goto\
    \ 32\naload_0\ngetfield Company/client I aload_0\ngetfield Company/rentalcarNum\
    \ I iaload\nifne 26\ngetstatic java/lang/System/out Ljava/io/PrintStream; new\
    \ java/lang/StringBuilder\ndup\nldc ” Car “\ninvokespecial java/lang/StringBuilder/<init>(Ljava/lang/String;)V\
    \ aload_0\ngetfield Company/rentalcarNum I\ninvokevirtual java/lang/StringBuilder/append(I)Ljava/lang/StringBuilder;\
    \ ldc ” is available.”\ninvokevirtual java/lang/StringBuilder/append(Ljava/lang/String;)Ljava/lang/StringB\
    \ invokevirtual java/lang/StringBuilder/toString()Ljava/lang/String; invokevirtual\
    \ java/io/PrintStream/println(Ljava/lang/String;)V\niconst_0\ninvokestatic java/lang/System/exit(I)V\
    \ goto 32\naload_0\ndup\ngetfield Company/rentalcarNum I iconst_1\niadd\nputfield\
    \ Company/rentalcarNum I aload_0\ngetfield Company/rentalcarNum I bipush 100\n\
    if_icmplt 5\ngetstatic java/lang/System/out Ljava/io/PrintStream; ldc ” All cars\
    \ or vehicles are rented out”\ninvokevirtual java/io/PrintStream/println(Ljava/lang/String;)V\
    \ return\n```\n\n源代码可以保存到名为 `Company.java` 的文件中，编译器可能会将 Java 字节码放在另一个名为 `Company.class`\
    \ 的文件中。你甚至需要一个工具来显示类文本的 Java 字节码文件（你可以使用 Ando Saabas 的 Java Bytecode Editor）。如果你尝试用记事本甚至\
    \ Microsoft Word 打开 `Company.class` 文件的代码，你只会看到像点、波浪线等乱码。\n\n## Java 虚拟机 (JVM)\n\
    \n如果说编译器负责编写 Java 字节码，那么 Java 虚拟机就负责解码它。实际上，每种计算机处理器都有其自己的可执行指令，这些指令由每个操作系统以略有不同的方式进行解释。让我们来看下面两个针对不同处理器的程序，它们在计算机屏幕上将显示相同的输出——“Hello\
    \ world！”\n\n### 简单程序- Pentium 处理器\n\n![image```assembly.data msg:.ascii “Hello,\
    \ world!\\n” len = . - msg.text.global _start_start:movl $len,%edx movl $msg,%ecx\
    \ movl $1,%ebx movl $4,%eax int $0x80movl $0,%ebx movl $1,%eax int $0x80```###\
    \ 简单程序- Powerpc 处理器.data msg:![image](img/scene_break.png)\n\n```assembly\n.text\n\
    _start:\n.string “Hello, world!\\n” len = . - msg\n.global _start\nli 0,4\nli\
    \ 3,1\nlis 4,msg@ha addi 4,4,msg@l li 5,len\nsc\nli 0,1\nli 3,1\nsc\n```\n\n这两个程序本应该显示相同的结果，但它们不能互换，因为当它们在错误的处理器上运行时，这些指令将毫无意义。你只会收到通知或错误信息，例如“不是有效的\
    \ Win32 ”或“Windows 打开此文件”。这就是为什么在 Java 虚拟机的帮助下，这些 Java 字节码在这个混乱的编程世界中建立了秩序！JVM\
    \ 像一个解释器，将这些字节码翻译给任何计算机系统理解。因此，你不需要担心，无论是你的电脑还是朋友的电脑，都能运行这些字节码。因此，Java 语言通过 JVM\
    \ 解决了移植性和通用性问题。\n\n## 集成开发环境\n\nJava 编程的早期涉及几个窗口——一个用于输入代码，另一个用于运行，也许第三个用于跟踪所有内容。随着集成开发环境\
    \ (IDE) 的出现，这一切被无缝地结合在了一个整体中。以下是一些流行的 IDE：\n\n1. **Eclipse** (eclipse.org)\n \
    \  ![image](img/scene_break.png)\n   因其交互功能被认为是最受欢迎的 IDE ，Eclipse 是开源的。\n\n2.\
    \ **NetBeans** (netbeans.org)\n   与上一个一样，这个开源软件受推荐并支持 Java。\n\n3. **BlueJ** (bluej.org)\n\
    \   BlueJ 拥有最简单的界面，专为帮助新手理解 Java 设计。\n\n4. **DrJava** (drjava.org)\n   ![image](img/scene_break.png)\n\
    \   DrJava 也是为业余程序员设计的。尽管简单，但它仍然强大。\n\n5. **Java Development Kit** (JDK)\n   Java\
    \ 开发工具箱既是编译器也是解释器的工具。最新版本可以从 Oracle 网站下载。确保你下载了适用于你电脑的版本。如果你使用的是 32 位操作系统，请下载\
    \ `x86` 版本。\n\n现在，我们已经了解到 Java 有多种部署方式。本章还为你提供了关于如何安装软件以及所有程序所需工具的清晰指令。在下一章中，你将体验如何在\
    \ Java 环境中开始编码。\n\n"
- fmt: "\nIn order to help you understand this concept, let us take an example. Suppose\
    \ we create a class called `car`. `Car` is a general term for all four-wheeled\
    \ small vehicles. however, every car has a different set of specifications like\
    \ `brand`, color, engine, `transmission` type and features. These features can\
    \ be modified. For example, you may get the color changed or a feature enhanced.\n\
    \nTherefore, `car` is a template (or in our case a class) but specific cars are\
    \ objects or instances of this class. The set of specifications are variables\
    \ and any initializations or manipulations that we perform on these variables\
    \ are done using methods.\n\nThis example can also be best used to understand\
    \ the object-oriented principles of encapsulation and abstraction. The class encapsulates\
    \ variables and methods into it. So, as the user, you are dealing with only the\
    \ class `car` and its implementation is hidden from you. This is how `java` implements\
    \ abstraction.\n\nThe best way to learn programming is by writing programs. So,\
    \ we have given you a sample program below for you to try. We will also use this\
    \ program to explain the basic syntax of `java` programming language.\n\n```java\n\
    public class sampleJava { // this program will print hello World! On the screen\n\
    \n    public static void main(String []args) {\n\n        System.out.println(\"\
    hello World!\"); // statement for print\n\n    }\n\n}\n```\n\nIn order to write,\
    \ compile and run this program, you need to follow the instructions given below\
    \ –\n\nUsing any text editor, create a text file and copy this code into the same.\
    \ Save the file as `sampleJava.java`.\n\n![rsrc1ZH.jpg](d2d_images/image002.jpg)![rsrc1ZJ.jpg](d2d_images/image028.jpg)\n\
    \nCompile and run the code using the ide. For manual execution, you need to type\
    \ the following commands:\n\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n\n```bash\n\
    javac sampleJava.java\n```\n\n![rsrc1ZK.jpg](d2d_images/image015.jpg)\n\n```bash\n\
    java sampleJava\n```\n\n![rsrc1ZK.jpg](d2d_images/image015.jpg)\n\nThe first command\
    \ will create a class file from the java file while the second command will execute\
    \ the program to give the desired result. A sample run of the code has been illustrated\
    \ in the image shown below.\n\n![rsrc1ZM.jpg](d2d_images/image056.jpg)\n\nIf you\
    \ have reached so far, you have successfully executed your first java program.\
    \ now it is time to inspect the program to see how we wrote it and why it gave\
    \ the result that it did.\n\nFirstly, writing a program in java requires you to\
    \ follow some conventions. These are listed below –\n\n`java` is a case-sensitive\
    \ language. In other words, `class` and `Class` are two different words for `java`.\
    \ be careful when you are using keywords or any other elements in the program.\n\
    \n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n\nAs a convention, the first letter\
    \ of every word of the class name is supposed to be capital. For example, if the\
    \ name of the class is `car`, the `c` is supposed to be capital. On the other\
    \ hand, if the name of the class is `Sportscar`, the `S` and `c` must be capital\
    \ as both of them are first letters of the two words that form the name of the\
    \ class.\n\n![rsrc1ZH.jpg](d2d_images/image043.jpg)\n\nMethod names also follow\
    \ a capitalization convention according to which the first letter of the method\
    \ name must be small in case. however, if the name if more than one word, except\
    \ for the first word, every other word’s first letter must be capital. For example,\
    \ if the method name is `add`, the `a` must be small, but if the method name is\
    \ `addOn`, the `a` will be small and `N` will be capital.\n\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n\
    \nThe name of the java file must be same as the name of the class, followed by\
    \ `.java`. For example, if the name of your class is `sampleApplication`, the\
    \ name of the java file must be `sampleApplication.java`. Also remember that the\
    \ case of the letter must match. If you do not fulfill any of these requirements\
    \ you will not be able to compile the program.\n\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n\
    \nThe execution of a java program begins with the `main` method. Therefore every\
    \ java program must have a `main` method and the `main` method in java programming\
    \ is defined as\n\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n\n```java\npublic\
    \ static void main(String args[])\n```\n\nBut again, if your program doesn’t have\
    \ a `main` method, the program will not run.\n\n## Identifiers\n\nAny programming\
    \ language is made up of English words. Some of these words are part of the syntax\
    \ of programming language while others like variable names and the user names\
    \ of classes and methods. Words that are part of the syntax are called keywords.\
    \ On the other hand, all user-defined names are called identifiers.\n\nThere are\
    \ some important things to know and remember about java. These include – names\
    \ given to identifiers can begin with alphabets (lower case or upper case) and\
    \ special characters – underscore `_` and currency `$`. This also means that an\
    \ identifier’s name cannot begin with any other special character.\n\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n\
    \nThe use of a defined keyword as a identifier is not allowed.\n\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n\
    \nLastly, always remember that java is case-sensitive and `count` and `Count`\
    \ are two different identifiers.\n\n![rsrc1ZJ.jpg](d2d_images/image040.jpg)\n\n\
    ## Modifiers\n\nClasses, methods and variables can be modified only using modifiers.\
    \ There are two types of modifiers, which are as follows –\n\nnon-access modifiers:\
    \ `static`, `abstract`, `final` \nAccess modifiers: `public`, `default`, `private`,\
    \ `protected`\n\n![rsrc1ZH.jpg](d2d_images/image002.jpg)![rsrc1ZJ.jpg](d2d_images/image028.jpg)\n\
    \nAccess modifiers determine how the class, method or variable can be accessed\
    \ and who all have the permission to access them. Other modifiers, which do not\
    \ work on similar lines are classified as non-access modifiers.\n\n## Variables\n\
    \nJava supports three types of variables namely class variable, local variables\
    \ and instance variables. Class variables are also called static variables while\
    \ instance variables have been termed as non-static variables.\n\n## Arrays\n\n\
    A collection of elements of the same type is called an array. Java supports array\
    \ objects of different types.\n\n## Enums\n\nThere are some variables that can\
    \ hold only a few values. As a programmer, you may wish to restrict such variables\
    \ taking any other value. One such variable is `enum`, which was introduced in\
    \ java 5.0. It is possible to define enums inside a class or outside it. Moreover,\
    \ enums can have constructors, variables and methods.\n\n## Keywords\n\nThe words\
    \ that are part of the java programming language and cannot be used as identifiers\
    \ are called keywords. These are –\n\n| assert | abstract | break | boolean |\n\
    | :--- | :--- | :--- | :--- |\n| catch | char | byte | case |\n| const | class\
    \ | default | continue |\n| else | enum | do | double |\n| final | extends | float\
    \ | finally |\n| if | implements | for | goto |\n| instanceof | import | interface\
    \ | int |\n| new | package | long | native |\n| protected | private | return |\
    \ public |\n| strictfp | super | short | static |\n| synchronized | switch | throw\
    \ | this |\n| try | void | throws | transient |\n| while | volatile | | |\n\n\
    ## Comments\n\nIn java, there is support for single-line and multi-line comments.\
    \ Single-line comments start with `//` while multi-line comments start with `/*`\
    \ and end with `*/`. You can look for these comments in the sample code given\
    \ above.\n\n## Blank Lines\n\nAny line that has a comment or no characters or\
    \ whitespace characters is not considered by java. It is simply ignored.\n"
