  trans: "\n\n# 第 6 章：对象与类\n\n首先，让我们理解类和对象的概念。类是一个模板，用于创建对象。对象是真实的实体，它们进行相互作用并构成了\
    \ Java 程序的的核心元素。类中可以存在三种类型的变量。首先，变量定义在类内部、方法外部。此类变量是为每个对象定义的，被称为实例变量。\n\n此外，变量也可以存在类的方法块内部。这些变量对于方法是私有的，被称为局部变量。任何在类内部、方法块外部使用\
    \ `static` 关键字声明的变量都称为类变量。\n\n## 创建对象\n\n显而易见，由于类是一个模板，你需要使用此模板来创建对象。为了创建对象，使用了关键字\
    \ `new`。对象的创建涉及三个步骤。第一步是为对象声明一个变量。第二步是使用 `new` 关键字创建一个对象。最后，需要使用类的构造函数对对象进行初始化。\n\
    \n如果省略了第三步，java 将使用默认构造方法进行对象初始化。这三个步骤可以被合并成一条语句来创建对象。例如，我们有一个类 `democ`，并想要创建一个对象\
    \ `o1`，可以使用以下语句完成：\n\n```java\ndemoc o1 = new democ\n```\n\n用于创建对象的类的变量和方法可以通过\
    \ `.` 运算符来访问。因此，如果我们有一个带有变量 `x` 的类 `democo` 并创建一个对象 `o1`，那么可以使用以下语句访问 `x`：`o1.x`。\n\
    \n## 构造函数\n\n当你开始创建类和对象时，你需要做的第一件事就是初始化对象。java 有专门用于初始化的方法实现，称为构造函数。这些元素的实现方式类似于方法，但它们具有与类相同的名称且没有返回类型。\n\
    \n那么，你可以在哪里使用构造函数？每当你创建一个类的对象并需要初始化某些参数或执行该类所有对象通用的某些功能时，就可以使用它。例如，如果你创建一个名为 `rectangle`\
    \ 的类。你可以创建一个构造函数来初始化矩形的长度和宽度。\n\n如果你不定义构造函数，java 将使用默认构造函数供程序使用。此构造函数会将类的所有参数值初始化为零。因此，如果你创建了一个类，无论你是否显式定义它，你的程序都将有一个激活的构造函数。\n\
    \n让我们创建一个带有显式构造函数的类，看看这个概念是如何工作的。\n\n```java\nClass Sampleclass1 {\n    int i;\n\
    \    Sampleclass1() {\n        I = 100;\n    }\n}\n\nPublic class demosasampleclass1\
    \ {\n    Public static void main(String args[]) {\n        Sampleclass1 c1 = new\
    \ Sampleclass1();\n        Sampleclass1 c2 = new Sampleclass1();\n        System.out.println(c1.i\
    \ + \"\\n\" + c2.i);\n    }\n}\n```\n\n下方的截图说明了代码以及执行后生成的输出。为了运行此代码，你需要创建两个文件，每个文件以其包含的类命名。\n\
    \n在上面的示例中，我们给了参数 `static`。然而，你的程序可能需要对参数进行动态初始化。为了这一点，你需要参数化构造函数。此类构造函数接受作为构造方法参数的值。下面给了示例实现。\n\
    \n```java\nClass Sampleclass2 {\n    int i;\n    Sampleclass2(int x) {\n     \
    \   I = x;\n    }\n}\n\nPublic class demosasample2 {\n    Public static void main(String\
    \ args[]) {\n        Sampleclass2 c1 = new Sampleclass2(100);\n        Sampleclass2\
    \ c2 = new Sampleclass2(200);\n        System.out.println(c1.i + \"\\n\" + c2.i);\n\
    \    }\n}\n```\n\n该代码的输出下文所示。\n\n在构造函数的实现方面，专门使用了一个关键字。该关键字是 `this` 关键字。它用于引用当前类的对象。通过\
    \ `this` 关键字的帮助，可以在构造函数或方法内部访问类的变量。\n\n```java\nClass Sampleclass3 {\n    int\
    \ i;\n    Sampleclass3(int i) {\n        this.i = i;\n    }\n}\n\nPublic class\
    \ demosasample2 {\n    Public static void main(String args[]) {\n        Sampleclass3\
    \ c1 = new Sampleclass3(200);\n        Sampleclass3 c2 = new Sampleclass3(200);\n\
    \        System.out.println(c1.i + \"\\n\" + c2.i);\n    }\n}\n```\n\n执行后，此代码给出了以下输出——\n\
    \n## 可变参数\n\n在某些程序中，可能存在一种需求，即你不知道 `main` 方法在执行期间会给出多少个参数。为了允许这种程度的动态性，使用了 var-args\
    \ 或可变参数。Var-args 在方法参数中使用以下语法声明：`<type>...<var_name>`\n\n在变量声明中给出的 `var_name`\
    \ 是一个数组，包含了 `main` 方法执行时发送的所有变量值。在实现此概念之前，你需要记住两点——\n\n- 每个方法只能实现一个 var-args。\n\
    \n- 如果方法有其他参数（普通性质），这些参数必须出现在 var-args 之前。换句话说，var-args 必须是方法的最后一个参数。\n\n此概念的示例实现如下。\n\
    \n```java\nPublic class demovarargs {\n    Public static void main(String args[])\
    \ {\n        printNum(56.5, 3, 34, 2, 3);\n        printNum(new double[]{2, 1,\
    \ 3});\n    }\n    Public static void printNum(double... number) {\n        if\
    \ (number.length == 0) {\n            System.out.println(\"no argument passed\"\
    );\n            return;\n        }\n        double resultNum = number[0];\n  \
    \      for (int x = 1; x < number.length; x++)\n            if (number[x] > resultNum)\n\
    \                resultNum = number[x];\n        System.out.println(\"the max\
    \ value in set is \" + resultNum);\n    }\n}\n```\n\n该代码的输出如下所示。\n\n## 方法实现\n\n\
    一组用于执行操作的指令被称为方法。你可以在大多数程序中看到打印语句调用 `System.out.println()`。此方法打印传递给它的字符串。\n\n\
    就像这种内置方法一样，开发者也可以创建特定于问题的方法。用户定义的方法可能有参数，也可能没有返回返回值。创建方法的标准是——\n\n```java\nPublic\
    \ static int methodDemo(int i, int j) {\n    /*body*/\n}\n```\n\n在这里，`methodDemo`\
    \ 是方法的名称，`i` 和 `j` 是该方法接受的参数。方法的实现逻辑位于大括号内部。此外，你还会注意到函数声明中写的三个单词——`public`、`static`\
    \ 和 `int`。这里 `int` 是方法的返回类型，而 `public static` 是修饰符。此示例方法可以被修改以适应开发者的需求。\n\n```java\n\
    Public static int minDemo(int num1, int num2) {\n    int minVal;\n    if (num1\
    \ > num2)\n        minVal = num2;\n    else\n        minVal = num1;\n    return\
    \ minVal;\n}\n```\n\n此方法确定传递给它的两个参数值中哪一个最小，并将此结果返回给调用方法。现在你对方法以及它们如何实现有了了解，是时候我们讨论这些方法在整体代码中是如何被使用了。\n\
    \n"
- fmt: " own# Calling a Method\n\nA method needs to be called or invoked for it to\
    \ be used. As you can see in the sample code given above, the method is performing\
    \ some computation and returning the result of the computation. Such a method\
    \ returns a value whose return type is already specified in the method declaration.\
    \ Apart from this, another type of method also exists. Such methods do not return\
    \ anything and are popularly referred to as methods with no return value.\n\n\
    When a program calls methods, the control moves from the program to the method\
    \ and the same starts executing. Once a return statement is encountered, the control\
    \ is transferred back to the calling program. In the absence of a return statement,\
    \ the control is automatically transferred back once a closing brace of the method\
    \ is encountered. This is usually the case for methods that have no return value.\n\
    \nFor methods that return a value, the return type is mentioned in the method\
    \ declaration. On the other hand, for methods that do not return nothing, the\
    \ return type is `void`. In order to call the method we implemented above, the\
    \ following statement needs to appear somewhere in the calling program.\n\n```\n\
    int result;\nResult = minDemo(5, 6);\n```\n\nSince the method returns an `int`\
    \ value, this value needs to be gathered in an `int` variable (`result`). The\
    \ call for the method gives the two parametric values desired by the method. This\
    \ type of method calling is also called parametric method calling or passing parameters\
    \ by value.\n\nYou may come across situations where you may have parameters of\
    \ different types and many parameters in number. In such cases, be sure to give\
    \ the parameter values in the desired order to avoid any unwanted compilation\
    \ or runtime errors.\n\n## Method Overloading\n\nIt is possible to have methods\
    \ with the same name, but different parameters. When a method is called, the system\
    \ detects the method with the parameter type and number given in the calling statement\
    \ and transfers control to the corresponding method. This form of method implementation\
    \ is called method overloading. Do not confuse this concept with overriding. In\
    \ method overriding, the method name, parameters and number of parameters are\
    \ also the same.\n\nIn order to understand this concept, let us take an example\
    \ –\n\n```java\npublic class overloadingDemo {\n\n    public static void main(String[]\
    \ args) {\n        int x = 34;\n        int y = 56;\n        double z = 10.5;\n\
    \        double u = 7.8;\n        int resultxy = minDemo(x, y);\n        double\
    \ resultzu = minDemo(z, u);\n        System.out.println(\"Min Value (Integers)\
    \ = \" + resultxy);\n        System.out.println(\"Min Value (double) = \" + resultzu);\n\
    \    }\n\n    public static int minDemo (int num1, int num2) {\n        int minval;\n\
    \        if (num1 > num2)\n            minval = num2;\n        else\n        \
    \    minval = num1;\n        return minval;\n    }\n\n    public static double\
    \ minDemo (double num1, double num2) {\n        double minval;\n        if (num1\
    \ > num2)\n            minval = num2;\n        else\n            minval = num1;\n\
    \        return minval;\n    }\n}\n```\n\nThe code implements two methods with\
    \ the same name `minDemo` with different parameter types. One of the methods uses\
    \ two parameters of `int` type and has return type `int`. On the other hand, the\
    \ other method uses `double` parameters and returns a `double`. The output for\
    \ this code is illustrated in the image.\n\n## Making Use of Line Arguments\n\n\
    There are some programs that require you to pass parameters while executing the\
    \ program at runtime. Such parameters are passed to the program in the form of\
    \ line arguments. These parameters are given to the program along with the name\
    \ of the program while giving execution.\n\nThe manner in which these parameters\
    \ can be accessed inside a program is shown in the sample code.\n\n```java\npublic\
    \ class CommandLineDemo {\n    public static void main(String args[]) {\n    \
    \    for(int x = 0; x<args.length; x++) {\n            System.out.println(\"args[\"\
    \ + x + \"]: \" + args[x]);\n        }\n    }\n}\n```\n\nGive the following line\
    \ to execute the program and see what you get:\n`java CommandLineDemo 200 100\
    \ 10 8 7`\n\n### Finalize\n\nYou are dealing with a lot of objects in Java programming\
    \ and all these objects take up space in the memory. If you are working on large\
    \ scale code, you may be required to clear up the space occupied by these objects\
    \ before terminating the program. To facilitate this operation, a garbage collector\
    \ method is available in Java, which is called `finalize()` method.\n\nThis method\
    \ is used to implement all the operations that you would like the program to do\
    \ before it terminates. Some of these operations include closing all the files\
    \ opened, deleting all the objects created and releasing any other memory occupied\
    \ by program elements. This method is implemented in the following manner –\n\n\
    ```\nprotected void finalize() {\n    /*Implementation*/\n}\n```\n\nThe access\
    \ modifier `protected` is used in the declaration of `finalize()` to prevent any\
    \ external program from destroying the code even before it executes.\n\n## Declaration\
    \ Rules for Source File\n\nThere are some rules that you need to follow while\
    \ writing import statement, class declarations and package statements in the source\
    \ file. These rules are as follows –\n\n- A source file cannot have more than\
    \ one `public` class.\n- There are many non-public classes in a source file.\n\
    - The name of the source file should be the same as the name of the `public` class\
    \ in that file. Moreover, the extension of the file should be `.java`.\n- If you\
    \ are working on a package and the class being implemented as part of the package,\
    \ then the first statement in the source file must be a package statement.\nThe\
    \ package statement must be the first statement in the source file. Any other\
    \ import statements must follow this package statement. Lastly, the declaration\
    \ must be present.\n\nIt is important for you to understand that package and import\
    \ statements are common to all classes in one source file.\n\nBefore we end this\
    \ discussion, let us give you a closing statement on packages. It is just a form\
    \ for interfaces and classes.\n\n# Chapter 7: Decision Making\n\nThe decision\
    \ making structures are used in situations where a set of instructions have to\
    \ be executed if the condition is true and another set of instructions have to\
    \ be executed when the condition is determined to be false. There are several\
    \ constructs available in Java for programming such scenarios. These structures\
    \ include –\n\n### If Statement\n\nThis statement is used in situations where\
    \ a condition needs to be tested and if the condition is found true, the block\
    \ of code that follows this statement needs to be executed. The syntax for this\
    \ construct is –\n\n```\nif(condition){\n    /*body*/\n}\n```\n\nSample implementation\
    \ for this construct is given below:\n\n```java\npublic class ifDemo {\n    public\
    \ static void main(String[] args) {\n        int i = 10;\n        int j = 1;\n\
    \        if(i>j){\n            System.out.print(i);\n        }\n    }\n}\n```"
