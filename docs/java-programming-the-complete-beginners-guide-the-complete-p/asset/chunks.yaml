  trans: "\n答案：(C) 输出 0\n\n这道题的在于 `finally` 块是否会被执行。\n\n––––––––\n\n![image](img/scene_break.png)\n\
    \n## Notes：\n\n(1) 停止应用的方法\n\n`<return>`\n\n如果代码中存在 `\"return\"` 语句，你可以停止该方法。然而，这意味着只是返回到调用者，所以应用程序会继续运行。\n\
    \n如果你将第 13 行的代码从 `System.exit(1)` 重写为 `return`，那么答案就是选项 (A)。\n\n### `<method System.exit()>`\n\
    \n相反，这个方法会直接停止应用程序。\n\n这就是为什么 `finally` 块中的语句没有被执行，所以答案是选项 (C)。\n\n此外，该方法的参数通常是\
    \ `0` 或 `1`，其中 `0` 表示程序无错误结束，`1` 表示程序带错误结束。\n\n––––––––\n\n![image](img/scene_break.png)\n\
    \n### (2) 三元运算符\n\n在第 6、12 和 16 行有三元运算符。以下是这段代码的逻辑思路：\n\n1.  问号之前是返回布尔值的条件。\n\
    2.  此之后，将返回 `\"0 : 1\"` 中的某一个值。\n3.  如果问号前的条件为真，则返回 `0`；如果问号前的条件为假，则返回 `1`。\n\n\
    这非常有用，因为你不需要编写空值检查代码等。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 第 23 \n\n![image](img/chapter_title_below.png)\n\n选择一个描述该程序编译并运行结果的语句。\n\n\
    ```java\n| 1 | public class Question_23 { |  |\n| 2 | public static void main(String)\
    \ args) { | |\n| 3 |  |\n| List<String> list1 = Arrays.aslist(\"a\", | \"b\");\
    \ |\n| 4 |  |\n| List<String> list2 = Arrays.aslist(\"c\", | \"d\"); |\n| 5 |\
    \  |\n| List<String> list3 = Arrays.aslist(\"e\", | \"f\"); |\n| 6 |  |  \n| List<List<String>>\
    \ lists= Arrays.aslist(list1, list2, list3); | |\n| 7 |  |  |\n| 8 |  | List<String>\
    \ concatenatedlist = concatlist(lists); |\n| 9 |  | concatenatedlist.forEach(e\
    \ -> System.out.print(e)); |\n| 10 |  | |\n| } | |\n| 11 |  |  |\n| 12 |  |\n\
    | public static List<String> concatlist(List<List<String>> lists) { |\n| 13 |\
    \  |\n| List<String> list new Arraylist<>(); |\n| 14 |  |  |\n| 15 | for (List<String>\
    \ e : lists) { |\n| 16 |  | for (String str : e) { |\n| 17 |  | list.add(str);\
    \ |\n| 18 |  | } |\n| 19 |  | } |\n| 20 |  |  |\n| 21 |  | return list; |\n| 22\
    \ |  | } |\n| 23 | } | |\n```\n\n(A) 输出 abcdef\n(B) 输出 fedcba\n(C) 输出为空\n(D) 编译错误或运行时异常\n\
    \n### 答案：(A) 输出 abcdef\n\n这段代码的点在于合并多个列表。\n\n与其他问题相比，你可能觉得这道题很难，所以让我们来看看这段代码是如何工作的。\n\
    \n––––––––\n\n![image## Notes：(1) 这段代码是如何工作的 1.  在第 6 行，创建一个存储列表的列表。如果你只见过像如 `\"\
    List<String>\"` 或 `\"List<Integer>\"` 这样的列表，这可能很难理解。2.  首先，在 `concatlist()` 方法中，创建一个将要返回的列表。其次，通过两个\
    \ `for` 循环，合并了所有的列表。让我们看看第 15 行的第一个循环。对象 `e` 是在第 6 行添加到 `lists` 中的每个列表，所以第二个 `for`\
    \ 循环需要添加它中的所有 `String` 元素。在第二个循环中，`str` 是第 3 到 5 行中每个列表的每个对象。它们是 `\"a\",\"b\"\
    ,\"c\",\"d\",\"e\",\"f\"`。通过将这些所有元素添加到第 13 行的列表中，合并就完成了。### (2) 使用 streamAPI 以下是写在第\
    \ 15 行到 19 行的替代代码。```java1 lists.forEach(x -> {2 x.forEach(y -> {3  list.add(y);4\
    \ });5 } ) ;```| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# 第 24 \n\n![image](img/chapter_title_below.png)\n\
    \n选择一个描述该程序编译并运行结果的语句。\n\n––––––––\n\n![image](img/scene_break.png)\n\n```java\n\
    1 public class Question_24 {\n2 public static void main(String[] args) {\n3 List<Integer>\
    \ list1 = Arrays.asList(1, 2, 3, 4, 5);\n4 List<Integer> list2 = list1.stream()\n\
    5 .filter(e -> e % 2 == 0)\n6 .collect(Collectors.tolist());\n7 System.out.println(add(list2));\n\
    8 }\n9 static int add(List<Integer> list) {\n10 int number = 0;\n11 for (int e\
    \ : list) {\n12 number += e;\n13 }\n14 return number;\n15 }\n```\n\n(A) 输出 10\n\
    (B) 输出 2\n(C) 输出 12\n(D) 输出 24\n\n### 答案：(C) 输出 12\n\n这段代码的作用是：\n\n1.  `list1`\
    \ 是包含 1, 2, 3, 4, 5 的列表。\n2.  `list2` 是对 `list1` 进行流处理，过滤出 `e % 2 == 0`（即偶数），然后收集成列表。所以\
    \ `list2` 包含 `[2, 4]`。\n3.  `add(list2)` 方法遍历 `list2` 中的元素并求和，即 $2 + 4 = 12$。\n\
    \nNotes：\n\n(1) streamAPI\n\n### `<filter()>`\n\n这个方法返回布尔值。你可以使用这个条件来过滤元素。\n\n\
    ### `<collect()>`\n\n这个方法通常用于流处理的结束，将结果转换为列表。`Collectors.tolist()` 将结果转换为列表。\n\
    \n"
- fmt: "\n# Question 26\n\nSelect the one statement that describes the result when\
    \ this program is compiled and run.\n\n```java\npublic class Question_26 {\n \
    \   public static void main(String[] args) {\n        int a = 1 ;\n        int\
    \ b = Arrays.asList(100, 200).size();\n        int c = new Long(3L).intValue();\n\
    \n        if (a+ b == c && (c - a)% 2 == 0) {\n            System.out.println(method1()[0]);\n\
    \        }\n    }\n\n    private static String[] method1() {\n        String[]\
    \ array= new String[1];\n        StringBuilder sb = new StringBuilder();\n\n \
    \       sb.append(\"1 \".trim());\n        sb.append(sb.toString().toUpperCase());\n\
    \        array[0] = sb.toString();\n\n        return array;\n    }\n}\n```\n\n\
    (A) output 1\n(B) output 11\n\n**Answer : (B) output 11**\n\nThere are a few points\
    \ that seems a bit complicated. Let's take a look at it one by one.\n\n### Notes\
    \ :\n\n(1) line 5\n`Arrays.asList(100, 200).size()` means the size of the `ArrayList`\
    \ that consists of two elements 100 and 200, so it returns 2.\n\n(2) line 6\n\
    Firstly, `Long` type is created by using `new Long(3L)`. However, if you assign\
    \ it to variable `c` causes compile error, because they are different type each\
    \ other.\nThe method `intValue()` helps situation like this, it returns int value\
    \ of te `Long` object.\n\n(3) line 8\nThe second part of the condition `((c -\
    \ a)% 2 == 0)` looks a bit complicated. Let's divide it into two. The variable\
    \ `c` is 3, and `a` is 1 in this code, so `\"(c - a)\"` is 2, and it's even number,\
    \ so this condition returns true.\n\n(4) line 17\nThe method `trim()` is seen\
    \ in former questions, but this case seems wrong. In this code, it is used on\
    \ double quoted `String`, not variable. However, it is no problem, so error doesn't\
    \ occur.\n\n(5) line 18\nWhen operating `StringBuilder`, you can use the object\
    \ itself like this line.\n\n---\n\n# Question 27\n\nSelect the one statement that\
    \ describes the result when the program extends the program above is compiled\
    \ and run.\n\n```java\npublic class Question_27_1 {\n    private static String\
    \ str1 = \"A\";\n\n    public static String concatStr(String str1, String str2)\
    \ {\n        return new StringBuilder()\n            .append(str1)\n         \
    \   .append(str2)\n            .toString();\n    }\n\n    public static String\
    \ getStr1() {\n        return str1;\n    }\n}\n\npublic class Question_27_2 extends\
    \ Question_27_1 {\n    public static void main(String[] args) {\n        getStr1().tolowerCase();\n\
    \        Question_27_2 instance= new Question_27_2();\n        instance.method1();\n\
    \    }\n\n    private void method1() {\n        System.out.println(concatStr(getStr1(),\
    \ getStr1()));\n    }\n}\n```\n\n(A) output aa\n(B) output AA\n\n**Answer : (B)\
    \ output AA**\n\nThe points of this code is below.\n1. accessing field and method\
    \ of super class\n2. way of writing return statement (at line 4 of super class)\n\
    \n### Notes :\n\n(1) accessing field and method of super class\nThe access modifier\
    \ of super class field `str1` is `private`. However, there is method `getStr1()`.\
    \ The access modifier of the method is `public`, so any error doesn't occur if\
    \ you use this method to get the field instead of accessing directly. This type\
    \ of method is called \"getter method\" or simply \"getter\". On contrary there\
    \ is another type of method, called \"setter method\". The access modifier is\
    \ usually public like getter, and this method is to set value to private field\
    \ of a certain class. Below is how it looks (if this question's code).\n\n```java\n\
    public static void setStr(String str1) {\n    Question_27_1.str1 = str1;\n}\n\
    ```\n\n(2) way of writing return statement (at line 4 of super class)\nThere are\
    \ many cases return value is already initialized before return statement, and\
    \ is frequently seen coding style. However, you don't have to create value before\
    \ return statement, you can do it with return statement. Just write it after \"\
    return\" like this code at line 4.\n\n---\n\n# Question 28\n\nSelect the one statement\
    \ that describes the result when this program compiled and run.\n\n```java\npublic\
    \ class Question_28 {\n    public static void main(String[] args) {\n        LocalDateTime\
    \ ldt1 = LocalDateTime.of(2020, 01, 01, 12, 34, 56);\n        if (!isLocalDateTime(ldt1))\
    \ {\n            return;\n        }\n        if (!isLocalDateTime(ldt1)) {\n \
    \           System.exit(1);\n        }\n        System.out.println(ldt1.getYear());\n\
    \    }\n\n    public static boolean isLocalDateTime(LocalDateTime ldt) {\n   \
    \     Predicate<LocalDateTime> predicate = new Predicate<LocalDateTime>() {\n\
    \            public boolean test(LocalDateTime e) {\n                return e\
    \ instanceof LocalDateTime;\n            }\n        };\n        return predicate.test(ldt);\n\
    \    }\n}\n```\n\n(A) output 2020\n(B) output nothing\n\n**Answer : (A) output\
    \ 2020**\n\nWhat this program does is below.\n1. create `LocalDateTime` object\n\
    2. check if it is `LocalDateTime` type\n3. output year of it\n\n### Notes :\n\n\
    (1) `LocalDateTime<of()`\nTo create `LocalDateTime` object, use `now()` or `of()`.\
    \ `now()` returns `LocalDateTime` object at the timestamp of when the application\
    \ is run. And, you can specify values of timestamp using `of()`.\n\n### `getYear()`\n\
    This method returns year of `LocalDateTime` object. There are more methods like\
    \ this, `getMonth()`, `getHour()` and so on.\n\n(2) `Predicate`\nThis is one of\
    \ Functional Interfaces from Java 8. This is to return boolean value. In this\
    \ code at line 16 to 21, it isn't lambda expression. You can rewrite it with lambda\
    \ expression like below.\n\n```java\nPredicate<LocalDateTime> predicate = e ->\
    \ e instanceof LocalDateTime;\n```\nAnd to use above code, write same code at\
    \ line 22.\n\n---\n\n# Question 29\n\nSelect the one statement that describes\
    \ the result when this program is compiled and run.\n\n```java\npublic class Question_29\
    \ {\n    public static void main(String[] args) {\n        HashMap<Object, String>\
    \ map = new HashMap<Object, String>();\n        map.put(1L, \"A\");\n        map.put(null,\
    \ \"B\");\n        map.put(\"String\", null);\n\n        Question_29 instance=\
    \ new Question_29();\n        instance.method1(map.get(\"String\"));\n    }\n\n\
    \    public void method1(Object object) {\n        Optional<Object> a = Optional.ofNullable(object);\n\
    \        System.out.println(a.orElse(\"output\"));\n    }\n}\n```\n\n(A) output\
    \ null\n(B) output output\n(C) compile error\n(D) runtime exception\n\n**Answer\
    \ : (B) output output**\n\nWhat this program does is below.\n1. create `HashMap`\
    \ with three entry sets\n2. if object of value from key `\"String\"` of the map\
    \ is not null, output it.\n3. if object of value from key `\"String\"` of the\
    \ map is null, output `\"output\"`.\n\n### Notes :\n\n(1) `Object` type as map\
    \ key\n`Object` type is nullable, so if you indicate it as key of map, you can\
    \ set `null` to it.\n"
