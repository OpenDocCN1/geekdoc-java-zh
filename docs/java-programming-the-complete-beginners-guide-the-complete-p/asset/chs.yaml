  \               System.out.print(4);\n            }\n        });\n    }\n}\n```\n\
  \n(A) 输出 123\n(B) 输出 123423434\n(C) 输出 1234123\n(D) 编译错误\n\n### 答案：(B) 输出 123423434\n\
  \n该程序的执行逻辑如下：\n\n1. 初始化 `str` 字段\n2. 遍历数组并使用 `switch` 语句\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n### Note：\n\n(1) `switch` 语句\n在第 13 到 22 行没有 `break` 语句。因此执行顺序如下。这就是为什么答案是 (B)。\n\
  \n```java\nswitch (e) {\n    case \"a\":\n        System.out.print(1);\n    case\
  \ \"b\":\n        System.out.print(2);\n    case \"c\":\n        System.out.print(3);\n\
  \    default:\n        System.out.print(4);\n}\n```\n\n如果 `e` 为 \"a\"，它会输出 1 并穿透执行到\
  \ 2、3、 4。\n如果 `e` 为 \"b\"，它会输出 2 并穿透执行到 3、 4。\n如果 `e` 为 \"c\"，它会输出 3 并穿透执行到 4。\n\
  如果 `e` 为默认值，它会输出 4。\n\n# 问题 50\n\n![image](img/chapter_title_below.png)\n\n选择描述该程序编译并运行结果的语句。\n\
  \n```java\npublic class Question_50 {\n    private static Predicate<Integer> a =\
  \ new Predicate<Integer>() {\n        public boolean test(Integer b) {\n       \
  \     return b > 0;\n        }\n    };\n\n    public static void main(String args[])\
  \ {\n        try {\n            String[] array = {\"12 3 \", \"123 \"};\n      \
  \      for (String str : array) {\n                str = str.replace(\" \", \"\"\
  );\n            }\n            System.out.print(a.test(Integer.parseInt(array[0])));\n\
  \        } catch (Exception e) {\n            System.exit(1);\n        } finally\
  \ {\n            System.out.print(\"done\");\n        }\n    }\n}\n```\n\n(A) 输出为空\n\
  (B) 输出 truedone\n(C) 输出 done\n(D) 编译错误或运行时异常\n\n### 答案：(A) 输出为空\n\n该程序的执行逻辑如下：\n\
  \n1. 创建包含元素 `[\"12 3 \", \"123 \"]` 的 `array`\n2. 遍历并将空格替换为空字符串\n3. 终止应用程序\n\n––––––––\n\
  \n![image](img/scene_break.png)\n\n### Note：\n\n(1) 标准 for 循环、增强 for 循环、Stream 的\
  \ `forEach`\n\n有三种遍历数组的方法，但只有一种会影响根数据：\n\n```java\nfor (String str : array) {\n\
  \    str = str.replace(\" \", \"\");\n}\n```\n在增强 for 循环中，`str` 是局部变量，因此重新赋值不会改变数组中的元素。\n\
  \n(2) 停止应用程序的方法\n在第 19 行，使用 `System.exit()` 方法停止应用程序。在这种情况下，`finally` 块不会被执行。\n\n\
  如果你在第 19 行使用 `return;` 代替 `System.exit(1);`，答案是 (C)。\n\n"
