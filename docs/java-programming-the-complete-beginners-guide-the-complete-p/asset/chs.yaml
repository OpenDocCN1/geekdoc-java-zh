  \ 类的一个静态方法。它将 `String` 参数转换为 `int` 值，在 Java 编程中非常常见。\n\n当参数不是数字（值而非类型时），会发生 `NumberFormatException`。这是与\
  \ `NullPointerException` 最著名的异常之一。\n\n(2) break 语句与 finally 块的处理顺序\n\n如你在第 11 行所示，程序将退出\
  \ `while` 循环。`finally` 块会优先执行，然后退出 `while` 循环。\n\n(3) catch 块\n\n在此代码中，你只看到一个 `catch`\
  \ 块，但你可以通过编写如下多个 `catch` 块来处理每种异常。如果你希望根据不同的异常产生不同的结果，应该这样写代码。\n\n```java\ncatch\
  \ (NullPointerException e) {\n  // some code;\n} catch (NumberFormatException e)\
