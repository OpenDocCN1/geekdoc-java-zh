  \n# 问题 16\n\n![image](img/chapter_title_below.png)\n\n选择一个描述该程序编译并运行结果的陈述。\n\n––––––––\n\
  \n![image](img/scene_break.png)\n\n```java\n1 public class Question_16 {\n2 public\
  \ static void main(String[]) args) {\n3\n4 String str1 = \"a\";\n5 String str2 =\
  \ \"b\";\n6 String str3 = \"c\";\n7\n8 List<String> list= Arrays.aslist(\"a\", \"\
  b\", \"c\");\n9\n10 list.stream().forEach(e -> {\n11 switch (e) {\n12 case str1:\n\
  13 System.out.println(\"switch\");\n14 break;\n15 case str2:\n16 break;\n17 case\
  \ str3:\n18 break;\n19 }\n20 } ) ;\n21\n22 }\n23 }\n```\n\n(A) 输出 switch\n(B) 输出无\n\
  \n答案：{C) 编译错误\n\n在第 4 行到第 6 行，都是变量。\n然而，`switch` 语句中的 `case` 子句需要 final 变量，因此在第\
  \ 12、15、17 行处发生编译错误。\n\n––––––––\n\n![image](img/scene_break.png)\n\n### Notes：\n\
  \n### (1) switch 语句\n与 `if` 语句相比，当有很多条件时，`switch` 语句是一个很好的选择。\n\n##### <使用 if-else\
  \ 语句处理三个条件>\n```java\n1 if (condition1) {\n2 return;\n3 } else if (condition2) {\n\
  4 return;\n5 } else {\n6 return;\n7 }\n```\n\n##### <使用 switch 语句处理三个条件>\n```java\n\
  1 switch (condition1) {\n2 case condition1: break;\n3 case condition2: break;\n\
  4 default: break;\n5 }\n```\n上述代码的第 4 行 `\"default\"` 等同于 `if` 语句的 `else`。\n使用 `if`\
  \ 语句或 `switch` 语句的另一个点是条件是简单还是复杂。\n`Switch` 语句需要 final 变量并且看起来简单，但 `if` 语句比 `switch`\
  \ 语句更容易地评估复杂的条件。\n\n| ![image](img/chapter_title_corner_decoration_left.png) | |\
  \ ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
