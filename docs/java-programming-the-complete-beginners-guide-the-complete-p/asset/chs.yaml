  \ 运行时异常**\n\n在第 12 行，`method1` 返回 `null`，因为参数大于 0。在第 6 行，比较 `null` 和 0 会导致运行时异常。\n\
  \n### Notes\n\n**(1) NullPointerException**\n\n这是 Java 中最著名的异常之一。在大多数情况下，Java 程序员至少会遇到一次。\n\
  \n**<if condition>**\n\n在代码的第 6 行，使用 `==` 比较 `null` 和 0，这就是为什么会发生异常。反转它们的顺序，这样你可以先进行空检查，如果它为\
  \ null，则返回 false，不会发生运行时异常。\n\n**(2) method1**\n\n此方法在第 12 行返回 `null`，因为参数大于 0。\n\
  \n**(3) happens normally**\n\n这种异常在很多时候经常发生。例如，急于发布应用而没有进行空检查。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ | | ![image](img/chapter_title_corner_decoration_right.png) |\n\n\n\n\n\n# 问题\
  \ 12\n\n选择描述该程序编译并运行结果的陈述。\n\n```java\npublic class Question_12 {\n    public static\
  \ void main(String[] args) {\n        String str = \"123\";\n        if (method1(str))\
  \ {\n            Object a= Integer.parseInt(str);\n            System.out.println((String)\
  \ a);\n        }\n    }\n\n    public static boolean method1(String value) {\n \
  \       try {\n            Integer.parseInt(value);\n            return true;\n\
  \        } catch (NumberFormatException e) {\n        }\n        return false;\n\
  \    }\n}\n```\n\n(A) 输出 123\n(B) 无输出\n(C) 编译错误\n(D) 运行时异常\n\n### 答案：(D) 运行时异常\n\
  \n第 7 行的 `if` 条件返回 true，因为 `str` 的 `value` 是数字。\n\n然而，在第 9 行发生了运行时异常，因为对象 `a` 是\
  \ `Integer` 类型。下面让我们详细查看。\n\n### 注释：\n\n### (1) ClassCastException\n当将对象强制转换为没有继承关系的类型时会发生此异常。第\
  \ 8 行和第 9 行的 `String` 和 `Integer` 就是一个很好的例子。\n\n#### <第 8 行>\n在第 8 行，初始化对象 `a` 时指定了\
  \ `Object` 类型，因此编译器在程序运行之前不知道赋值给 `value` 的类型。\n\n以下是此代码中第 8 行的两种写法：\n1. `Object\
  \ a= Integer.parseInt(str);`\n2. `Integer a= Integer.parseInt(str);`\n\n如果你用方式 2\
  \ 重写第 8 行的代码，第 9 行会导致编译错误，因为在初始化对象 `a` 时指定 `Integer` 类型会告诉编译器对象 `a` 的类型。\n\n###\
  \ (2) method1\n第 14 行中 `method1` 的名称是 `method1`。但在实际编码中，这类方法的名称通常以 \"is\" 开头。例如\
  \ \"isString\",\"isNumber\",\"isFile\",\"isDir(Dir 表示目录)\"。\n\n如果方法的作用是检查参数是否满足某种条件并返回布尔值，你应该像上面那样命名方法。\n\
  \n---\n\n# 问题 13\n\n选择描述该程序编译并运行结果的陈述。\n\n```java\npublic class Question_13 {\n\
  \    public static void main(String[] args) {\n        String[] array = { \"a\"\
  , \"b\", \"c\" };\n        for (int i = 0; i < array.length; i++) {\n          \
  \  if (isArrayEmpty(array)) {\n                return;\n            }\n        \
  \    array[i] = array[i].toUpperCase();\n        }\n        System.out.println(array[array.length]);\n\
  \    }\n\n    public static boolean isArrayEmpty(String[] array) {\n        return\
  \ array == null || array.length == 0;\n    }\n}\n```\n\n(A) 输出 C\n(B) 输出 null\n\
  (C) 编译错误\n(D) 运行时异常\n\n### 答案：(D) 运行时异常\n\n这段代码似乎输了转换为大写的 `array` 的最后一个元素。\n\n思考方式是正确的，但在输出数组最后一个元素时使用\
  \ `array.length` 的值是错误的。\n\n### 注释：\n\n### (1) toUpperCase()\n该方法位于第 10 行。它非常简单易于理解。它将小写转换为大写。\n\
  \n### (2) array\n在第 6 行到第 11 行，这个 `for` 循环经常操作数组中的所有元素，因此 `array` 的所有元素都变为大写。\n\n\
  之前：`{\"a\", \"b\", \"c\"}`\n之后：`{\"A\", \"B\", \"C\"}`\n\n#### <获取最后一个元素>\n在此代码中，`array\
  \ length` 返回 3，因为有三个元素。但是，要获取它的最后一个元素，需要编写 `array[2]`。在第 13 行，`array[array.length]`\
  \ 等于编写 `array[3]`，因此发生了运行时异常。\n\n### (3) ArrayOutOfBoundsException\n这是程序运行时发生的异常。最好记住这个异常，因为在实际编码中经常会看到。\n\
  \n---\n\n# 问题 14\n\n选择描述该程序编译并运行结果的陈述。\n\n```java\npublic class Question_14 {\n\
  \    public static void main(String[] args) {\n        Random random = new Random();\n\
  \        int a = 0;\n        for (int i = 0; i < 10000; i++) {\n            a =\
  \ random.nextInt(10);\n            if (a > 9) {\n                System.out.println(\"\
  abc\");\n                return;\n            }\n        }\n        System.out.println(\"\
  ABC\");\n    }\n}\n```\n\n(A) 输出 abc\n(B) 输出 ABC\n(C) 编译错误\n(D) 运行时异常\n\n### 答案：(B)\
  \ 输出 ABC\n\n在第 7 行到第 16 行，检查字段 `a` 是否大于 9 共 10000 次。\n\n然而，`a` 不可能大于 9，因为第 9 行的\
  \ `nextInt()` 方法返回 0 到 9 之间的随机数。结果是该程序输出 ABC。\n\n### 注释：\n\n### (1) Random\n####\
  \ <method nextInt()>\n如上所述，该方法返回 0 到参数之间的随机数。\n\n#### <石头剪刀游戏>\n下面是使用该方法的另一个示例，该程序是一个简单的石头剪刀游戏。\n\
  \n```java\npublic static void main(String[] args) {\n    String[] array= {\n   \
  \     \"Rock\",\n        \"Paper\",\n        \"Scissors\"\n    };\n    System.out.println(array[new\
  \ Random().nextInt(3)]);\n}\n```\n\n创建一个包含 Rock, Paper, Scissors 字符串的数组。在输出数组成员时，通过\
  \ `nextInt()` 方法为数组索引提供随机数。因此，该程序在编译和运行时将随机输出 Rock、Paper 或 Scissors。\n\n---\n\n\
