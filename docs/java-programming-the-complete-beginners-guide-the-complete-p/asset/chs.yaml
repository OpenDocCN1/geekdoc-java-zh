  \ 代替它的。\n\n### (2) 选项 (C) 和 (D)\n\n关于选项 (C)：如果你在代码中写 `Boolean flg = null;`，编译不会报错；但如果你在代码中写\
  \ `boolean flg = null;`，则会报错。\n\n这就是基本类型和对象之间的区别。基本类型是值本身。而对象提供引用，`null` 意味着没有引用。因此，对象被称为“可空的\
  \ (nullable)”。\n\n关于选项 (D)：`Object` 类封装了所有类，所以如果你在代码中写它，编译不会报错。\n\n### (3) forEach\n\
