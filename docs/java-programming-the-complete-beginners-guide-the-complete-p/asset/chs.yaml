  \n# 问题 18\n\n![image](img/chapter_title_below.png)\n\n选择一个描述此处代码中 `shuffleText()`\
  \ 方法永远不会返回与参数相同结果的陈述。\n\n––––––––\n\n![image](img/scene_break.png)\n\n```java\n\
  1 public class Question_18 {\n2 public static void main(String[] args) {\n3 System.out.println(shuffleText(\"\
  java\"));\n4 }\n5\n6 static String shuffleText(String text) {\n7 while (true) {\n\
  8 List<String> list= new ArrayList<>();\n9 StringBuilder sb = new StringBuilder();\n\
  10\n11 for (char character : text.toCharArray()) {\n12 list.add(String.valueOf(character));\n\
  13 }\n14 Collections.shuffle(list); \n15 list.forEach(e -> sb.append(e));\n16 if\
  \ (!sb.toString().equals(text)) { \n17 return sb.toString();\n18 }\n19 }\n20 }\n\
  ```\n\n––––––––\n\n![image](img/scene_break.png)\n\n(A) sb.toString().equals(text)\n\
  (B) !sb.toString().equals(text)\n(C) true\n(D) false\n\n答案：(B) !sb.toString().equals(text)\n\
  \n`shuffleText()` 方法的功能如下\n1. 循环直到返回与参数值不同的乱序文本\n2. 创建列表并添加参数的每个字符\n3. 乱序列表并添加到\
  \ `StringBuilder`\n4. 从 `StringBuilder` 对象返回 `String` 值\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n### Notes：\n\n### (1) toCharArray()\n该方法在处理 `String` 的每个字符时非常常见，如第 11 行到第 13 行。\n\
  \n### (2) Collections.shuffle()\n这个方法非常有用。如果你想打乱列表中的元素，只需编写此代码并传递列表作为参数即可。\n\n\n\
  \n\n\n## 3) 此问题的答案\n\n选项 (B) `!sb.toString().equals(text)` 检查洗牌后的字符串是否与参数不同。\n\n\
  如果是，则返回它。（因为这段代码本不应该返回与给定参数相同的值。）\n\n然而，如果第 18 行使用选项 (A) `sb.toString().equals(text)`，这段代码将只会返回与给定参数相同的值。\n\
  \n在这段代码中，它始终返回 \"java\"。\n\n# 问题 19\n\n方法 `Character.isletter()` 在参数为字母时返回 true。请选择一个能够描述\
  \ `// code here` 的语句，使得下面代码中的 `isAlphabet()` 方法在方法参数为字母时返回 true。\n\n```java\npublic\
  \ class Question_19 {\n    public static void main(String[] args) {\n        List<String>\
  \ list= Arrays.aslist(\"abc\", \"def\", \"123\");\n        for (String str : list)\
  \ {\n            if (!isAlphabet(str)) {\n                System.out.println(str);\n\
  \            }\n        }\n    }\n\n    public static boolean isAlphabet(String\
  \ text) {\n        int cnt = 0;\n        for (char character : text.toCharArray())\
