  \n相反，如果你用 `new ArrayList<>()` 初始化列表，它是一个可变列表。\n\n所以你可以无问题地添加元素。\n\n––––––––\n\n\
  ![image](img/scene_break.png)\n\n顺便说一下，`final` 列表也是可变列表。在这种情况下，final 意味着你不能将另一个列表赋值给它。\n\
  \n然而，添加元素是没有问题的。\n\n| ![image](img/chapter_title_corner_decoration_left.png) | \
