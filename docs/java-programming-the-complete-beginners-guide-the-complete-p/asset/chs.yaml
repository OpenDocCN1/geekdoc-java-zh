  \n\n\n\n\n就在不久前的过去，也许大约二十年前，我们仍然使用打字机来创建家里、学校或工作所需的文档。还记得你母亲在索引卡片上的食谱、你大学的论文、你申请工作的简历等等。随后，计算机系统的诞生了，它让一切都变得简单得多！当这些神奇机器问世时，这是一场彻底的革命。现在，只需点击一下鼠标或敲击键盘，你就能打印出照片装饰家里、观看高中舞会的\
  \ YouTube 视频，或者为工作准备视觉冲击力营销演示文稿。\n\n––––––––\n\n![image](img/scene_break.png)\n\n\
  计算机系统由计算机的所有基本组件以及这些组件如何集成在一起组成，使设备能够高效有效地运行。这些组件可以分类为硬件或软件。计算机硬件指的是物理部分，例如中央处理器（`CPU`）、鼠标、键盘和显示器等。另一方面，软件是指告诉计算机该做什么的各种程序。硬件和软件组件共同工作，以产生用户所需的结果。\n\
  \n由于本电子书的编写是为了提供 Java 编程的逐步级教程，因此我们将重点介绍计算机系统的软件方面。此外，万维网（或简单地称为互联网）的出现为计算机编程带来了更多创新。这条在线超级公路在信息共享和通信方面日益增长的需求，迫使程序员们探索\
  \ `JAVA` 编程语言的潜力。\n\n## 计算机编程语言的演变\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n![image](img/image055.png)1954-1957\n\nJohn Backus 与 IBM 团队开发了 `FORTRAN`（被认为第一种现代计算机编程语言，但绝对并不用户友好）。\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n![image](img/image055.png)1959\n\n\
  Grace Hopper 在 Remington Rand 公司开发了 `COBOL`（字母 B 代表业务，这是 `COBOL` 的主要特性，包括处理客户、员工等人的记录）。\n\
  \n![image](img/image048.png)1972\n\nDennis Ritchie 在 AT&T 贝尔实验室开发了 `C` 编程语言。\n\n\
  ––––––––\n\n![image](img/scene_break.png)\n\n![image](img/image023.png)1986\n\n\
  Bjarne Stroustrup 在 AT&T 贝尔实验室开发了 `C++`，它支持面向对象编程（`OOP`）。\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n![image](img/image023.png)1995\n\n正是在 5 月 23 日，Sun Microsystems 发布了 Java 编程语言的第一个正式版本，它被认为是对\
  \ `C++` 的改进。这种通用软件使你能够构建和探索数据库、编写窗口应用程序以及控制手持设备等。仅仅在五年后，`Java` 在全球就已经拥有了 250 万开发者。\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n![image](img/image048.png)2000\n\n\
  大学理事会（College Board）在 11 月宣布，到 2003 年，计算机科学高级课程考试将基于 `Java`。\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n![image](img/image023.png)2002\n\n微软引入了 `C#`，这是一种继承了 `Java` 大部分编程特性的新语言。Sys-Con\
  \ Media 在同年 6 月报告说，对 `Java` 程序员的需求日益增长（与对 `C++` 程序员的需求相比已超过了 50%）。\n\n––––––––\n\
  \n![image](img/scene_break.png)\n\n![image](img/image048.png)2007\n\n谷歌开始使用 `Java`\
  \ 语言在 Android 移动设备上开发应用。\n\n––––––––\n\n![image](img/scene_break.png)\n\n![image](img/image048.png)2010\n\
  \n甲骨文公司（Oracle Corporation）在 1 月通过收购 Sun Microsystems 将 `Java` 技术整合到了甲骨文家族中。\n\n\
  ––––––––\n\n![image](img/scene_break.png)\n\n![image](img/image023.png)2010\n\n\
  eWeek 在 6 月将 `Java` 评为“让你保持就业的 Top 10 编程语言”第一（www.eweek.com/c/a/Application-Development/Top-10-Programming-Languagesto-Keep-You-Employed-719257）。\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n![image](img/image035.png)2013\n\n\
  自 2013 年 8 月以来，超过 11 亿台台式电脑和 25 亿部手机一直在使用 `Java` 平台（www.mobiledevicemanager.com/mobile-devicestatistics/250-million-android-devices-in-use\
  \ 和 http://java.com/en/about）。此外，具有交互能力的蓝光设备也应运而生。\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n![image](img/image055.png)\n\nJava 技术的出现\n\n当 IT 专家在 90 年代初意识到需要通过引入智能技术让人们的日常生活变得简单时，Sun\
  \ Microsystems 合作开发了一种运行在嵌入式芯片上的便携软件。这种芯片正在变得越来越小、越来越便宜且越来越强大。团队最初计划使用 `C++`，但移植性问题阻碍了他们的成功之路。因此，他们决定开发一种全新的编程语言。\n\
  \n1991 年，Java 语言由 James Gosling、Chris Warth、Patrick Naughton、Mike Sheridan 和 Ed\
  \ Frank 构思。`Oak` 是该语言的最初名称，它是 James Gosling 窗外的树（团队的项目）。然而，`Oak` 已经被作为另一种编程语言的名字。因此在\
  \ 1995 年，它被正式命名为 `Java`，代表了程序员在休息时享受的咖啡。然而，当这类设备的需求并未达到 Sun Microsystems 的预期时，团队不得不找到另一个渠道来扩展\
  \ `Java`。最终，在 1995 年 5 月，`Java` 在 SunWorld 大会上首次发布，随后 Netscape（当时的全球第一浏览器）宣布他们将把这种编程语言整合到他们的开发中。通过嵌入\
  \ Java 的网页，网站从单调无味变成了交互式。Web 不仅向受众发送信息，还能接受用户输入。\n\n# 第二章：Java 环境\n\n––––––––\n\n\
  ![image](img/scene_break.png)\n\n深入探讨 Java 编程，本章将开始讨论如何在各种环境中使用和部署该软件。它还将提供逐步说明，介绍如何在你的计算机上正确安装\
  \ Java 程序本身以及其他所需的工具。\n\n随着万维网不可阻挡的增长，开发者们已经找到了在每个网页上整合 Java 程序的方法。以下是该软件语言在不同环境中使用的总结：\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n\n\n\n\n![image](img/image024.png)\
  \ **Applet（小程序）** - 一种嵌入 Web 网页的网络 Java 程序，当通过互联网传输时，由另一个兼容 Java 的浏览器自动执行。这通常是一个小型程序，可以显示来自服务器的数据、管理用户输入，甚至执行诸如计算器之类的简单功能。这些功能在客户端计算机上本地完成，而不是连接到服务器，这意味着当你点击\
  \ applet 链接时，它将自动下载并在浏览器中运行。\n\n––––––––\n\n![image](img/scene_break.png)\n\n![image](img/image010.png)\
  \ **Servlet** - 一种小型 Java 程序，它支持浏览器但运行在另一台计算机或 Web 服务器上以扩展其功能。Servlet 的引入升级了客户端/服务器的连接。\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n![image](img/image024.png) **JavaServer\
  \ Page (JSP，Java 服务页面）** - 一个由 Java 程序片段组成的 Web 页面（与完整程序的 applet 不同）。\n\n––––––––\n\
  \n![image](img/scene_break.png)\n\n![image](img/image010.png) **Micro Edition (ME)\
  \ 微型 Java 应用** - 运行在内存限制资源设备上的 Java 程序，例如手机或电视机顶盒。\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n![image](img/image010.png) **Standard Edition (SE) 标准版 Java 应用** - 运行在标准计算机（如台式机或笔记本电脑）上的\
  \ Java 程序。\n\n––––––––\n\n![image](img/scene_break.png)\n\n![image](img/image024.png)\
