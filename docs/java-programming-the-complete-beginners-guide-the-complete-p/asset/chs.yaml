  \n# 问题 48\n\n![image](img/chapter_title_below.png)\n\n选择描述该程序编译并运行结果的语句。\n\n––––––––\n\
  \n![image](img/scene_break.png)\n\n```java\npublic class Question_48 {\n    private\
  \ static Predicate<Integer> predicate = Predicate.isEqual(1);\n\n    public static\
  \ void main(String args[]) {\n        List<Integer> list1 = Arrays.aslist(1, 2,\
  \ 3, 4, 5);\n        List<Integer> list2 = Arrays.aslist(1, 2);\n        List<Integer>\
  \ list3 = Arrays.aslist(3, 4, 5);\n        List<List<Integer>> list4 = Arrays.aslist(list2,\
  \ list3);\n        List<Integer> lists = null;\n\n        Optional<List<Integer>>\
  \ a = Optional.ofNullable(list5);\n        try {\n            a.orElseThrow(NullPointerException::new);\n\
  \        } catch (Exception e) {\n            lists = list4.stream()\n         \
  \       .flatMap(b -> b.stream())\n                .sorted(Comparator.reverseOrder())\n\
  \                .collect(Collectors.tolist());\n\n            System.out.print(predicate.test(list1.get(0))\n\
  \                && predicate.test(list5.get(list1.size() - 1)));\n        }\n \
  \   }\n}\n```\n\n(A) 输出 true\n(B) 输出 false\n(C) 编译错误\n(D) 运行时异常\n\n## 答案：(A) 输出\
  \ true\n\n该程序的执行逻辑如下：\n\n1. 创建包含元素 `[1, 2, 3, 4, 5]` 的 `list1`\n2. 创建包含元素 `[1, 2]`\
  \ 的 `list2`\n3. 创建包含元素 `[3, 4, 5]` 的 `list3`\n4. 创建包含元素 `[list2, list3]` 的 `list4`\n\
  5. 创建 `lists` 为 `null` 并使用方法 `ofNullable()` 将其封装\n6. 抛出 `NullPointerException`\n\
  7. 以反序顺序 `[5, 4, 3, 2, 1]` 将元素赋值给 `lists`\n8. 输出比较结果：`1` 是否等于 `list1` 的第一个元素且 `lists`\
  \ 的最后一个元素\n\n––––––––\n\n![image](img/scene_break.png)\n\n### Note：\n\n(1) 方法 `orElseThrow()`\n\
  \n`Optional` 类中的此方法用于处理可空值。在第 12 行，此时 `lists` 为 `null`，因此第 14 行抛出了 `NullPointerException`。\n\
  \n如果对象 `a` 为 `null`，此方法会抛出 `NullPointerException`。\n\n此外，你也可以像下面这样不使用方法引用重写第 14\
  \ 行的代码：\n\n```java\na.orElseThrow(() -> new NullPointerException());\n```\n\n##\
  \ (2) 方法 `flatMap()`\n\n此方法将多个集合转换为一个流。它使得合并列表变得简单。\n\n## (3) `Predicate`\n\n第 3、21\
  \ 和 22 行的代码逻辑非常简单。它比较了 `1` 与 `list1` 的第一个元素以及 `lists` 的最后一个元素。\n\n这是使用 `Predicate`\
  \ 接口中 `isEqual()` 方法的方法。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
