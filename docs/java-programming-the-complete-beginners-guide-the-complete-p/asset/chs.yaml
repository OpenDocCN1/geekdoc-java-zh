  \ 编译器\n\n编译器将你编写的 Java 代码转换为计算机可以理解并运行的内容。计算机理解指令的方式与人类不同。例如，检查下面的程序代码：\n\n```java\n\
  // 寻找可租用的汽车\nrentalcarNum = 1;\nwhile (rentalcarNum < 100) {\n    if (client[rentalcarNum]\
  \ == 0) {\n        out.println(\"Car \" + rentalcarNum + \" is available.\");\n\
  \        exit(0);\n    } else {\n```\n\n\n\n\n\n```java\nrentalcarNum ++;\n\n}\n\
  \n}\n\nout.println(\"All cars or vehicles are rented out\");\n```\n\n这段基础 Java 代码用于为特定客户搜索任何可用的租赁汽车或车辆，假设公司总共有\
  \ 99 辆车。你不能直接通过这样输入来运行这段代码。然而，忽略那些奇怪的标点符号和输入格式，人类能够理解它想让计算机做什么：\n\n1. 将租赁车辆编号设置为\
  \ 1。\n2. 只要租赁车辆编号小于 100，就检查租赁车辆的客户人数。\n3. 如果租赁车辆的客户人数为 0，则报告车辆可用，并停止。\n4. 否则，通过将租赁车辆编号加\
  \ 1 来准备检查下一辆车。\n5. 如果你达到了不存在的租赁车辆编号 100，则报告所有汽车或车辆均已租出。\n\n对于计算机来说，它们并不遵循翻译成英文的指令来执行特定任务。相反，它们理解的是晦涩的\
  \ Java 字节码命令。这就是编译器派上用场的地方。在编写完 Java 源码后，编译器会将其翻译并编写成计算机可以执行的 Java 字节码。查看下述相同 Java\
  \ 代码的字节码对应：\n\n```\naload_0 iconst_1\nputfield Company/rentalcarNum I goto 32\n\
  aload_0\ngetfield Company/client I aload_0\ngetfield Company/rentalcarNum I iaload\n\
  ifne 26\ngetstatic java/lang/System/out Ljava/io/PrintStream; new java/lang/StringBuilder\n\
  dup\nldc ” Car “\ninvokespecial java/lang/StringBuilder/<init>(Ljava/lang/String;)V\
  \ aload_0\ngetfield Company/rentalcarNum I\ninvokevirtual java/lang/StringBuilder/append(I)Ljava/lang/StringBuilder;\
  \ ldc ” is available.”\ninvokevirtual java/lang/StringBuilder/append(Ljava/lang/String;)Ljava/lang/StringB\
  \ invokevirtual java/lang/StringBuilder/toString()Ljava/lang/String; invokevirtual\
  \ java/io/PrintStream/println(Ljava/lang/String;)V\niconst_0\ninvokestatic java/lang/System/exit(I)V\
  \ goto 32\naload_0\ndup\ngetfield Company/rentalcarNum I iconst_1\niadd\nputfield\
  \ Company/rentalcarNum I aload_0\ngetfield Company/rentalcarNum I bipush 100\nif_icmplt\
  \ 5\ngetstatic java/lang/System/out Ljava/io/PrintStream; ldc ” All cars or vehicles\
  \ are rented out”\ninvokevirtual java/io/PrintStream/println(Ljava/lang/String;)V\
  \ return\n```\n\n源代码可以保存到名为 `Company.java` 的文件中，编译器可能会将 Java 字节码放在另一个名为 `Company.class`\
  \ 的文件中。你甚至需要一个工具来显示类文本的 Java 字节码文件（你可以使用 Ando Saabas 的 Java Bytecode Editor）。如果你尝试用记事本甚至\
  \ Microsoft Word 打开 `Company.class` 文件的代码，你只会看到像点、波浪线等乱码。\n\n## Java 虚拟机 (JVM)\n\
  \n如果说编译器负责编写 Java 字节码，那么 Java 虚拟机就负责解码它。实际上，每种计算机处理器都有其自己的可执行指令，这些指令由每个操作系统以略有不同的方式进行解释。让我们来看下面两个针对不同处理器的程序，它们在计算机屏幕上将显示相同的输出——“Hello\
  \ world！”\n\n### 简单程序- Pentium 处理器\n\n![image```assembly.data msg:.ascii “Hello,\
  \ world!\\n” len = . - msg.text.global _start_start:movl $len,%edx movl $msg,%ecx\
  \ movl $1,%ebx movl $4,%eax int $0x80movl $0,%ebx movl $1,%eax int $0x80```### 简单程序-\
  \ Powerpc 处理器.data msg:![image](img/scene_break.png)\n\n```assembly\n.text\n_start:\n\
  .string “Hello, world!\\n” len = . - msg\n.global _start\nli 0,4\nli 3,1\nlis 4,msg@ha\
  \ addi 4,4,msg@l li 5,len\nsc\nli 0,1\nli 3,1\nsc\n```\n\n这两个程序本应该显示相同的结果，但它们不能互换，因为当它们在错误的处理器上运行时，这些指令将毫无意义。你只会收到通知或错误信息，例如“不是有效的\
  \ Win32 ”或“Windows 打开此文件”。这就是为什么在 Java 虚拟机的帮助下，这些 Java 字节码在这个混乱的编程世界中建立了秩序！JVM 像一个解释器，将这些字节码翻译给任何计算机系统理解。因此，你不需要担心，无论是你的电脑还是朋友的电脑，都能运行这些字节码。因此，Java\
  \ 语言通过 JVM 解决了移植性和通用性问题。\n\n## 集成开发环境\n\nJava 编程的早期涉及几个窗口——一个用于输入代码，另一个用于运行，也许第三个用于跟踪所有内容。随着集成开发环境\
  \ (IDE) 的出现，这一切被无缝地结合在了一个整体中。以下是一些流行的 IDE：\n\n1. **Eclipse** (eclipse.org)\n   ![image](img/scene_break.png)\n\
  \   因其交互功能被认为是最受欢迎的 IDE ，Eclipse 是开源的。\n\n2. **NetBeans** (netbeans.org)\n   与上一个一样，这个开源软件受推荐并支持\
  \ Java。\n\n3. **BlueJ** (bluej.org)\n   BlueJ 拥有最简单的界面，专为帮助新手理解 Java 设计。\n\n4. **DrJava**\
  \ (drjava.org)\n   ![image](img/scene_break.png)\n   DrJava 也是为业余程序员设计的。尽管简单，但它仍然强大。\n\
  \n5. **Java Development Kit** (JDK)\n   Java 开发工具箱既是编译器也是解释器的工具。最新版本可以从 Oracle 网站下载。确保你下载了适用于你电脑的版本。如果你使用的是\
  \ 32 位操作系统，请下载 `x86` 版本。\n\n现在，我们已经了解到 Java 有多种部署方式。本章还为你提供了关于如何安装软件以及所有程序所需工具的清晰指令。在下一章中，你将体验如何在\
  \ Java 环境中开始编码。\n\n\n\n\n\n为了帮助你理解这个概念，让我们来看一个例子。假设我们创建了一个名为 `car` 的类。`Car` 是所有四轮小型车辆的通用术语。然而，每辆汽车都有一套不同的规格，如\
  \ `brand`、颜色、引擎、`transmission` 类型和功能。这些功能是可以被修改的。例如，你可能会更改颜色或增强某项功能。\n\n因此，`car`\
  \ 是一个模板（在我们的情况下是一个类），但具体的汽车是该类的对象或实例。规格集是变量，而我们对这些变量执行的任何初始化或操作都是通过方法完成的。\n\n这个例子也可以很好地用于理解面向对象的两个原则：封装和抽象。类将变量和方法封装在它内部。因此，作为用户，你处理的仅有\
  \ `car` 类，而它的实现细节对你是隐藏的。这就是 `java` 实现抽象的方式。\n\n学习编程的最好方法是编写程序。因此，我们在下文中为你提供了一个示例程序供你尝试。我们还将使用这个程序来解释\
  \ `java` 编程语言的基本语法。\n\n```java\npublic class sampleJava { // 这一程序将在屏幕上打印 hello World!\
  \ \n\n    public static void main(String []args) {\n\n        System.out.println(\"\
  hello World!\"); // 打印语句\n\n    }\n}\n```\n\n为了编写、编译和运行此程序，你需要按照下面的说明进行——\n\n使用任何文本编辑器，创建一个文本文件并将代码复制到其中。将文件保存为\
  \ `sampleJava.java`。\n\n![rsrc1ZH.jpg](img/image002.jpg)![rsrc1ZJ.jpg](img/image028.jpg)\n\
  \n使用 IDE 编译并运行代码。对于手动执行，你需要输入以下命令：\n\n![rsrc1ZJ.jpg](img/image040.jpg)\n\n```bash\n\
  javac sampleJava.java\n```\n\n![rsrc1ZK.jpg](img/image015.jpg)\n\n```bash\njava\
  \ sampleJava\n```\n\n![rsrc1ZK.jpg](img/image015.jpg)\n\n第一个命令将从 java 文件创建一个类文件，而第二个命令将执行程序以产生所需的结果。代码的示例运行已在所示的图片中说明。\n\
  \n![rsrc1ZM.jpg](img/image056.jpg)\n\n如果你已经到了这里，说明你成功执行了你的第一个 java 程序。现在是时候检查程序了，看看我们是如何写它的以及为什么它会给出那个结果。\n\
  \n首先，在 java 中编写程序需要遵循一些约定。这些约定列如下——\n\n`java` 是一种区分大小写的语言。换句话说，`class` 和 `Class`\
  \ 在 `java` 中是两个不同的单词。在程序中使用关键字或任何其他元素时要务必小心。\n\n![rsrc1ZH.jpg](img/image043.jpg)\n\
  \n按照约定，类名中每个单词的首字母应该大写。例如，如果类名是 `car`，那么 `c` 应该是大写的。反之，如果类名是 `Sportscar`，那么 `S`\
  \ 和 `c` 必须大大写，因为它们都是组成类名称的两个单词的首字母。\n\n![rsrc1ZH.jpg](img/image043.jpg)\n\n方法名也遵循大小写约定，即方法名的首字母必须是小写。然而，如果名称是多个单词，除了第一个单词外，其他每个单词的首字母都必须大写。例如，如果方法名是\
  \ `add`，`a` 必须是小写的；但如果方法名是 `addOn`，则 `a` 是小写的而 `N` 是大写的。\n\n![rsrc1ZJ.jpg](img/image040.jpg)\n\
  \njava 文件名必须与类名相同，并以 `.java` 结尾。例如，如果你的类名是 `sampleApplication`，那么 java 文件名必须是 `sampleApplication.java`。还要记住字母的大小必须匹配。如果你不符合任何这些要求，你将无法编译程序。\n\
  \n![rsrc1ZJ.jpg](img/image040.jpg)\n\njava 程序的执行从 `main` 方法开始。因此，每个 java 程序都必须有一个\
  \ `main` 方法，而 java 编程中的 `main` 方法定义为：\n\n![rsrc1ZJ.jpg](img/image040.jpg)\n\n```java\n\
  public static void main(String args[])\n```\n\n但再次强调，如果你的程序没有 `main` 方法，程序将无法运行。\n\
  \n## 标识符\n\n任何编程语言由英语单词组成。其中一些单词是编程语言语法的一部分，而另一些则是变量名、类和方法的自定义名称。属于语法部分的单词被称为关键字。另一方面，所有用户定义的名称都称为标识符。\n\
  \n关于 java 有一些需要知道并记住的重要事项。这些包括——赋予标识符的名字可以以字母（小写或大写）以及特殊字符开头——下划线 `_` 和货币符号 `$`。这意味着标识符名称不能以任何其他特殊字符开头。\n\
  \n![rsrc1ZJ.jpg](img/image040.jpg)\n\n不允许将定义的关键字作为标识符。\n\n![rsrc1ZJ.jpg](img/image040.jpg)\n\
  \n最后，始终记住 java 是区分大小写的，`count` 和 `Count` 是两个不同的标识符。\n\n## 修饰符\n\n类、方法和变量只能通过修饰符进行修改。修饰符有两种类型，如下：\n\
  \n访问修饰符：`static`、`abstract`、`final` \n访问修饰符：`public`、`default`、`private`、`protected`\n\
  \n![rsrc1ZH.jpg](img/image002.jpg)![rsrc1ZJ.jpg](img/image028.jpg)\n\n访问修饰符决定了类、方法或变量如何被访问，以及谁有权访问它们。其他类似的类似的被分类为非访问修饰符。\n\
  \n## 变量\n\nJava 支持三种变量：类变量、局部变量和实例变量。类变量也被静态变量，实例变量被称为非静态变量。\n\n## 数组\n\n相同类型元素的集合称为数组。Java\
  \ 支持不同类型的数组。\n\n## 枚举\n\n某些变量只能包含几个值。作为程序员，你可能希望限制变量获取其他值。其中一种变量是 `enum`，它是在 java\
  \ 5.0 中引入的。可以在类内部或外部定义枚举。此外，枚举可以拥有构造函数、变量和方法。\n\n## 关键字\n\njava 编程语言的一部分且不能作为标识符使用的单词被称为关键字。这些关键字是——\n\
  \n| assert | abstract | break | boolean |\n| :--- | :--- | :--- | :--- |\n| catch\
  \ | char | byte | case |\n| const | class | default | continue |\n| else | enum\
  \ | do | double |\n| final | extends | float | finally |\n| if | implements | for\
  \ | goto |\n| instanceof | import | interface | int |\n| new | package | long |\
  \ native |\n| protected | private | return | public |\n| strictfp | super | short\
  \ | static |\n| synchronized | switch | throw | this |\n| try | void | throws |\
  \ transient |\n| while | volatile | | |\n\n\n\n\n面向对象编程的继承特性在 `Java` 中通过从现有类派生出新类的概念来实现。这允许你重用现有代码。现有类被称为\
  \ `superclass`（父类），而派生的类被称为 `derived class`（派生类）。\n\n## 接口\n\n当两个对象需要相互通信时，则需要在这些对象之间建立一种通信协议。这种通信协议被称为\
  \ `interface`（接口）。这个概念通常用于继承概念的实现。`interface` 用于定义子类必须具备的方法。然而，这些方法是由子类来实现的。\n\n\
  ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n![image](img/chapter_title_above.png)\n\n# 第 3 章：数据类型\n\n![image](img/chapter_title_below.png)\n\
  \n当我们声明变量时，基本上是在内存中封锁一段空间并给它一个引用名称，以便我们以后访问它并操作其内容。为变量保留的内存数量取决于声明时给出的数据类型。因此，通过给变量赋予不同的数据类型，你可以在内存中为变量保留不同数量的内存。`Java`\
  \ 中有两种主要类型：基本数据类型和对象数据类型。\n\n## 基本数据类型\n\n`Java` 支持八种基本数据类型，每种数据类型都有一个对应的关键字，允许在该数据类型下声明变量。这些数据类型包括——\n\
  \n## byte\n- 最大值 = 127（包含)(2⁷ -1)\n![rsrc1ZJ.jpg](img/image040.jpg)\n- 最小值 = -128\
  \ (-2⁷)\n![rsrc1ZJ.jpg](img/image040.jpg)\n- 8 位有符号二补码整数\n![rsrc1ZJ.jpg](img/image040.jpg)\n\
  - 默认值 = 0\n![rsrc1ZJ.jpg](img/image040.jpg)\n\n这种数据类型通常用于需要节省内存的情况。`byte` 数据类型用于在大数组中节省空间，主要代替整数，因为\
  \ `byte` 比整数小四倍。\n![rsrc1ZH.jpg](img/image043.jpg)\n\n## Short\n- 最大值 = 32,767（包含）\
  \ (2¹⁵ -1)\n![rsrc1ZH.jpg](img/image043.jpg)\n- 默认值 = 0.\n![rsrc1ZJ.jpg](img/image040.jpg)\n\
  - 最小值 = -32,768 (-2¹⁵)\n![rsrc1ZJ.jpg](img/image040.jpg)\n- 16 位有符号二补码整数\n![rsrc1ZJ.jpg](img/image040.jpg)\n\
  \n这是另一种在需要节省内存时使用的类型。\n![rsrc1ZH.jpg](img/image043.jpg)\n\n## Int\n- 默认值 = 0\n![rsrc1ZJ.jpg](img/image040.jpg)\n\
  - 最大值 = 2,147,483,647（包含） (2³¹ -1)\n![rsrc1ZH.jpg](img/image043.jpg)\n- 32 位有符号二补码整数。\n\
  - 最小值 = - 2,147,483,648 (-2³¹)\n![rsrc1ZJ.jpg](img/image028.jpg) \n\n这是用于所有整数值的默认数据类型。\n\
  ![rsrc1ZJ.jpg](img/image040.jpg)\n\n## Long\n- 默认值为 `0L`\n![rsrc1ZH.jpg](img/image043.jpg)\n\
  - 最小值 = -9,223,372,036,854,775,808(-2⁶³)\n![rsrc1ZH.jpg](img/image043.jpg)\n- 64\
  \ 位有符号二补码整数\n- 最大值 = 9,223,372,036,854,775,807（包含）（2⁶³ -1) 当期望变量持有大数字时使用此。\n![rsrc1ZH.jpg](img/image002.jpg)\n\
  \n## Float\n- 默认值为 `0.0f`\n![rsrc1ZJ.jpg](img/image040.jpg)\n- 32 位 IEEE 754 浮点数，单精度\n\
  ![rsrc1ZH.jpg](img/image043.jpg)\n\n这种数据类型用作存储小数的默认类型。必须避免对需要精度的值使用这种数据类型。\n![rsrc1ZJ.jpg](img/image040.jpg)\n\
  \n## Double\n- 默认值为 `0.0d`\n![rsrc1ZJ.jpg](img/image040.jpg)\n- 64 位 IEEE 754 浮点数，双精度\n\
  ![rsrc1ZH.jpg](img/image043.jpg)\n\n这种数据类型用作存储小数的默认类型。对于需要精度的值，可以使用这种数据类型。\n![rsrc1J.jpg](img/image040.jpg)\n\
  \n## Boolean\n- 默认值为 `false`\n![rsrc1ZH.jpg](img/image043.jpg)\n- 1 位，可能的值：`true`\
  \ 和 `false`\n这种数据类型用于标记。\n![rsrc1J.jpg](img/image040.jpg)\n\n## Char\n- 最大值 = '\\\
  uffff'（或 65535）\n![rsrc1ZH.jpg](img/image043.jpg)\n- 最小值 = '\\u0000'（或 0）\n![rsrc1J.jpg](img/image040.jpg)\n\
  - 16 位 Unicode 字符\n\n这种数据类型专门用于存储字符。\n![rsrc1ZH.jpg](img/image043.jpg)\n\n## 引用类型\n\
  正如名称所示，引用变量用于访问对象。它们通常通过构造函数创建，一旦定义不可更改。数组和对象都是引用变量。最后，这种情况下默认值为 `null`。\n\n面量用于表示固定值。它们像变量一样声明并具有数据类型。字面量的示例：\n\
  \n`Char x = 'X';`\n\n你可能会注意到不同进制的整数和浮点。根据规则，任何带有 `0` 前缀的字面值为八进制，而 `0x` 前缀表示十六进制。如果你处理字符串，字符串字面量总是用双引号定义的。另一组你会使用的字符是转义字符。转义字符列表如下：\n\
  \n- 回车 `\\r`\n- 换行 `\\n`\n- 退格 `\\b`\n- 分页 `\\f`\n- 制表符 `\\t`\n- 空格 `\\s`\n- 单引号\
  \ `\\'`\n- 双引号 `\\\"`\n- 十六进制字符 `\\uxxxx`\n- 八进制字符 `\\ddd`\n- 反斜杠 `\\\\`\n\n![image](img/chapter_title_corner_decoration_left.png)\
  \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
  \n# 第 4 章：变量\n\n![image](img/chapter_title_below.png)\n\n变量的最简单定义是给某些内存区域的名称。然而，`Java`\
  \ 支持多种类型的变量。根据变量的类型，决定了以下参数：\n\n- 为变量分配内存的大小。\n![rsrc1ZH.jpg](img/image043.jpg)\n\
  - 锁定内存的布局。\n![rsrc1ZH.jpg](img/image043.jpg)\n- 在变量上执行的操作。\n![rsrc1ZH.jpg](img/image043.jpg)\n\
  - 变量可以持有的值范围。\n![rsrc1ZH.jpg](img/image043.jpg)\n\n根据规则，每个变量在使用之前都需要声明。变量声明的标准语句是：\n\
  \n```\ndata_type variable_name;\n```\n\n\n\n在这里，`data_type` 是变量的数据类型，而 `variable_name`\
  \ 是用于该变量的标识符。如果你正在使用相同类型的多个变量，可以通过逗号分隔的变量名称将它们组合在同一个语句中。如前所述，`java` 支持三种类型的变量，即：类变量、实例变量和局部变量。本章将详细解释这些变量类型。\n\
  \n## 局部变量\n\n在方法或代码块内部声明的变量对于该作用域是局部的，被称为局部变量。变量在块中声明和定义时被创建。此外，一旦块的作用域结束，变量就会被销毁。这种类型的变量无法使用访问修饰符（在本章稍后部分描述）。\n\
  \n由于这种变量仅在方法或块的作用域内有效，因此只能在此代码块内进行访问。在内部，局部变量是在栈级别创建的。因此，当它们被创建时，它们会被推入栈中，一旦代码块执行完毕，栈就会被清空。最后，局部变量的默认值是垃圾（garbage）。因此，这些变量在使用前必须初始化。\n\
  \n下面提供了说明局部变量工作原理的示例代码。它在类的方法中实现了一个局部变量 `agep`，该变量从 `main` 方法访问。\n\n```java\npublic\
  \ class lvdemo {\n    public void puppyage() {\n        int agep = 0;\n        Agep\
  \ = agep + 10;\n        System.out.println(\"Age of the puppy is : \" + agep);\n\
  \    }\n\n    public static void main(String args[]) {\n        lvdemo testobj =\
  \ new lvdemo();\n        testoobj.puppyage();\n    }\n}\n```\n\n此代码的输出已在下方图中所示。\n\
  \n![rsrc1ZN.jpg](img/image053.jpg)\n\n## 实例变量\n\n作为类的一部分创建，但不在任何方法或构造函数作用域内的变量被称为实例变量。这些变量之所以被称为实例变量的原因是，它们只有在使用该类创建对象时才会创建一次。因此，对于使用该类使用\
  \ `new` 关键字所实例化的每个对象，都会创建这些变量。\n\n此外，这些变量在对象被删除或程序执行终止时就会被销毁。可以从该类实现的方法或构造函数访问这些变量。可以说实例变量是可以使用访问修饰符的类级变量。\n\
  \n这些变量具有默认值。例如，所有数字的默认值为 0，布尔型的默认值为 false。作为引用变量创建的对象引用被初始化为 `null`。虽然必须声明变量，但赋值可以在方法或构造函数中完成。如果你在同一个类内部工作，可以直接通过变量名称访问变量。然而，如果你想从任何静态方法访问它，则需要使用格式\
  \ – `Object_name.variable_name` 来访问。\n\n下面提供了示例代码帮助你更好地理解这一概念。该类实现了一个员工类，并使用初始化方法初始化了类的变量。\n\
  \n```java\nimport java.io.*;\n\npublic class demoemployee {\n    public String nameemp;\n\
  \    private double salaryemp;\n\n    public demoemployee(String nameemp) {\n  \
  \      nameemp = nameemp;\n    }\n\n    public void itsalary(double itsal) {\n \
  \       salaryemp = itsal;\n    }\n\n    public void private() {\n        System.out.println(\"\
  Employee name = \" + nameemp);\n        System.out.println(\"Employee Salary = \"\
  \ + salaryemp);\n    }\n\n    public static void main(String args[]) {\n       \
  \ demoemployee empobj = new demoemployee(\"aes\");\n        empobj.itsalary(5000);\n\
  \        empobj.private();\n    }\n}\n```\n\n此代码的输出已在下方图中所示。\n\n![rsrc1ZP.jpg](img/image001.jpg)\n\
  \n## 静态变量\n\n任何用 `static` 声明的变量位于类中，但在方法、构造函数或类内部任何其他块之外。无论为该类创建了多少对象，整个类都只维护该变量的一个副本。因此，这些变量也被称为类变量。尽管建议不使用使用这些变量，但存在某些需要此类实现的场景。然而，每当使用此类变量时，你必须将其作为常量使用，其值不能更改。这些变量在程序启动时创建。然而，一旦程序执行终止，它们就会被销毁。\n\
  \n类变量对类的所有元素都是可见。因此，它们的可见性与实例变量相似。事实上，类变量的默认值与实例变量相同。可以使用以下语句访问这些变量 – `Class_name.variable_name`\n\
  \n下面提供了静态变量实现的示例代码。\n\n```java\nimport java.io.*;\n\npublic class svdemo {\n   \
  \ private static double salaryemp;\n    public static final String department =\
  \ \"dev \";\n\n    public static void main(String args[]) {\n        salaryemp =\
  \ 1000;\n        System.out.println(department + \"Salary = \" + salaryemp);\n \
  \   }\n}\n```\n\n可以在下方图中看到代码输出。\n\n![rsrc1ZR.jpg](img/image050.jpg)\n\n## 修饰符类型\n\
  \n可以使用修饰符修改变量的行为和访问权限。修饰符有两种主要类型，即访问修饰符和非访问修饰符。\n\n### 访问修饰符\n\n![rsrc1ZH.jpg](img/image043.jpg)\n\
  \nJava 支持多个访问级别，每个级别都有对应的关键字。这些包括：\n\n- `public`: ![rsrc1ZH.jpg](img/image043.jpg)\
  \ 所有人可见\n- `private`: ![rsrc1ZS.jpg](img/image051.jpg) 类内部可见\n- `protected`: ![rsrc1ZJ.jpg](img/image040.jpg)\
  \ 类及其子类可见\n- `default`: ![rsrc1ZK.jpg](img/image015.jpg) 如果没有提到关键字，则对包内可见\n\n###\
  \ 非访问修饰符\n\n![rsrc1ZH.jpg](img/image043.jpg)\n\nJava 中还有其他修饰符。这些包括：\n\n- `static`:\
  \ ![rsrc1ZJ.jpg](img/image040.jpg)\n- `final`: ![rsrc1ZH.jpg](img/image043.jpg)\n\
  - `abstract`: ![rsrc1ZH.jpg](img/image043.jpg)\n- `volatile` 和 `synchronized`: ![rsrc1ZH.jpg](img/image043.jpg)\n\
  \n\n\n\n该运算符返回两个数字相除后的余数。如果 `a` 和 `b` 是别别持有 10 和 5 的变量，那么 `c = a%b` 将产生 `c = 0`。\n\
  \n### 递增 (++)\n该运算符将变量的值加 1。如果 `a` 是一个持有值 1 的变量，那么 `a++` 将产生值 2。\n\n### 递减 (—)\n\
  该运算符从变量的值中减去 1。如果 `a` 是一个持有值 1 的变量，那么 `a—` 将产生值 0。\n\n## 关系运算符\n所有涉及比较的操作都使用关系运算符执行。下面是该编程语言支持的运算符列表——\n\
  \n**不等于 (!=)**\n该运算符应用于两个操作数上。它检查两个操作数之间的相等性。如果它们相等，则返回 FALSE，否则返回 true。\n\n**等于\
  \ (==)**\n该运算符应用于两个操作数上。它检查两个操作数之间的相等性。如果它们相等，则返回 true，否则返回 FALSE。\n\n**大于 (>)**\n\
  该运算符应用于两个操作数上。它检查两个操作数之间的相等性。如果第一个操作数大于第二个操作数，则返回 true，否则返回 FALSE。\n\n**小于 (<)**\n\
  该运算符应用于两个操作数上。它检查两个操作数之间的相等性。如果第一个操作数小于第二个操作数，则返回 true，否则返回 FALSE。\n\n**大于或等于**\n\
  该运算符应用于两个操作数上。它检查两个操作数之间的相等性。如果第一个操作数大于或等于第二个操作数，则返回 true，否则返回 FALSE。\n\n**小于或等于**\n\
  该运算符应用于两个操作数上。它检查两个操作数之间的相等性。如果第一个操作数小于或等于第二个操作数，则返回 true，否则返回 FALSE。\n\n## 位运算符\n\
  普通运算符与位运算符之间的唯一区别是这些运算符按位执行操作。此外，这些运算符可以应用于 `byte`、`int`、`short`、`long` 和 `char`。Java\
  \ 中支持的位运算符包括——\n\n**位与 (&)**\n该运算符作用于两个操作数，如果两个输入位均为 1，则每组输入位位的输出为 1，否则输出为 0。\n\n\
  **位或 (|)**\n该运算符作用于两个操作数，如果其中一个或两个输入为 1，则每组输入位位的输出为 1，否则输出为 0。\n\n**位异异 (^)**\n\
  该运算符作用于两个操作数，只有当其中一个输入为 1 时，每组输入位位的输出才为 1，否则输出为 0。\n\n**位取反 (~)**\n该运算符作用于单个操作数，将值从\
  \ 0 反转为 1，从 1 反转为 0。\n\n**左移 (<<)**\n该运算符作用于两个操作数。左操作数的位向左移动。移动位数等于第二个操作数指定的值。\n\
  \n**右移 (>>)**\n该运算符作用于两个操作数。左操作数的位按第二个操作数指定的值向右移动。\n\n**零填充右移 (>>>)**\n该运算符作用于两个操作数。左操作数的位按第二个操作数指定的值向右移动。此外，0\
  \ 会替换被移出的位。\n\n为了理解位运算是如何发生的，让我们来看一个例子。假设有两个变量 `a` 和 `b` 分别持有值 60 和 13。`a` 和 `b`\
  \ 的二进制等价如下——\n\n`A = 00111100`\n`b = 00001101`\n\n使用位与真值表（只有当两个输入均为 1 时输出才为 1）。相应地，`a&b\
  \ = 00001100`。同理，其他位位运算也是这样执行的。\n\n## 逻辑运算符\nJava 中所有的逻辑操作都使用逻辑运算符执行。该语言支持的运算符列表为：\n\
  \n**逻辑与**\n该运算符作用于两个操作数。如果两个操作数都非零，则表达式返回 true，否则返回 FALSE。\n\n**逻辑或**\n该运算符作用于两个操作数。如果两个操作数都非零，则表达式返回\
  \ true，否则返回 FALSE。\n\n**逻辑非**\n该运算符作用于一个操作数。如果操作数为 0，则该表达式返回 true，否则返回 FALSE。\n\n\
  ## 赋值运算符\nJava 支持的赋值运算符列表包括——\n\n**简单赋值运算符 (=)**\n该运算符将右侧计算的值赋值给左侧。如果 `a` 和 `b`\
  \ 是变量且表达式为 `c = a+b`，则 `a+b` 的值赋值给 `c`。\n\n**加赋值运算符 (+=)**\n该运算符将右侧与左侧相加的值赋值给左侧。如果\
  \ `a` 和 `c` 是变量且表达式为 `c += a`，则 `a` 和 `c` 的值被赋值给 `c`。\n\n**减赋值运算符 (-=)**\n该运算符将左侧减去右侧的值赋值给左侧。如果\
  \ `a` 和 `c` 是变量且表达式为 `c -= a`，则 `c-a` 的值赋值给 `c`。\n\n**乘赋值运算符 (*=)**\n该运算符将右侧与左侧相乘的值赋值给左侧。如果\
  \ `a` 和 `c` 是变量且表达式为 `c *= a`，则 `c*a` 的值赋值给 `c`。\n\n**除赋值运算符 (/=)**\n该运算符将左侧除以右侧的值赋值给左侧。如果\
  \ `a` 和 `c` 是变量且表达式为 `c /= a`，则 `c/a` 的值赋值给 `c`。\n\n**取模赋值运算符 (%=)**\n该运算符将左侧对右侧取模的值赋值给左侧。如果\
  \ `a` 和 `c` 是变量且表达式为 `c %= a`，则 `c%a` 的值赋值给 `c`。\n\n**左移赋值运算符 (<<=)**\n如果 `a` 和\
  \ `c` 是变量且表达式为 `c <<= a`，则 `c<<a` 的值赋值给 `c`。\n\n**右移赋值运算符 (>>=)**\n如果 `a` 和 `c`\
  \ 是变量且表达式为 `c >>= a`，则 `c>>a` 的值赋值给 `c`。\n\n**位与赋值运算符 (&=)**\n如果 `a` 和 `c` 是变量且表达式为\
  \ `c &= a`，则 `c&a` 的值赋值给 `c`。\n\n**位异异赋值运算符 (^=)**\n如果 `a` 和 `c` 是变量且表达式为 `c ^=\
  \ a`，则 `c^a` 的值赋值给 `c`。\n\n**位或赋值运算符 (|=)**\n如果 `a` 和 `c` 是变量且表达式为 `c |= a`，则 `c|a`\
  \ 的值赋值给 `c`。\n\n## 运算符优先级\n如果表达式使用了多个运算符，则使用运算符优先级规则来确定操作的执行顺序。运算符从右到左或从左到右评估的优先级按如下运算符组定义：\n\
  \n1. 从右到左\n   - 一元运算符\n   - 条件运算符\n   - 赋值\n2. 从左到右\n   - 后置\n   - 乘法\n   - 加法\n\
  \   - 移位\n   - 关系\n   - 等于\n   - 位与\n   - 位异异\n   - 位或\n   - 逻辑与\n   - 逻辑或\n\n例如，如果我们评估表达式\
  \ `a = 3 + 5 * 5`，乘法先于加法执行。因此，`a = 28` 而不是 40。\n\n\n\n\n\n# 第 6 章：对象与类\n\n首先，让我们理解类和对象的概念。类是一个模板，用于创建对象。对象是真实的实体，它们进行相互作用并构成了\
  \ Java 程序的的核心元素。类中可以存在三种类型的变量。首先，变量定义在类内部、方法外部。此类变量是为每个对象定义的，被称为实例变量。\n\n此外，变量也可以存在类的方法块内部。这些变量对于方法是私有的，被称为局部变量。任何在类内部、方法块外部使用\
  \ `static` 关键字声明的变量都称为类变量。\n\n## 创建对象\n\n显而易见，由于类是一个模板，你需要使用此模板来创建对象。为了创建对象，使用了关键字\
  \ `new`。对象的创建涉及三个步骤。第一步是为对象声明一个变量。第二步是使用 `new` 关键字创建一个对象。最后，需要使用类的构造函数对对象进行初始化。\n\
  \n如果省略了第三步，java 将使用默认构造方法进行对象初始化。这三个步骤可以被合并成一条语句来创建对象。例如，我们有一个类 `democ`，并想要创建一个对象\
  \ `o1`，可以使用以下语句完成：\n\n```java\ndemoc o1 = new democ\n```\n\n用于创建对象的类的变量和方法可以通过 `.`\
  \ 运算符来访问。因此，如果我们有一个带有变量 `x` 的类 `democo` 并创建一个对象 `o1`，那么可以使用以下语句访问 `x`：`o1.x`。\n\n\
  ## 构造函数\n\n当你开始创建类和对象时，你需要做的第一件事就是初始化对象。java 有专门用于初始化的方法实现，称为构造函数。这些元素的实现方式类似于方法，但它们具有与类相同的名称且没有返回类型。\n\
  \n那么，你可以在哪里使用构造函数？每当你创建一个类的对象并需要初始化某些参数或执行该类所有对象通用的某些功能时，就可以使用它。例如，如果你创建一个名为 `rectangle`\
  \ 的类。你可以创建一个构造函数来初始化矩形的长度和宽度。\n\n如果你不定义构造函数，java 将使用默认构造函数供程序使用。此构造函数会将类的所有参数值初始化为零。因此，如果你创建了一个类，无论你是否显式定义它，你的程序都将有一个激活的构造函数。\n\
  \n让我们创建一个带有显式构造函数的类，看看这个概念是如何工作的。\n\n```java\nClass Sampleclass1 {\n    int i;\n\
  \    Sampleclass1() {\n        I = 100;\n    }\n}\n\nPublic class demosasampleclass1\
  \ {\n    Public static void main(String args[]) {\n        Sampleclass1 c1 = new\
  \ Sampleclass1();\n        Sampleclass1 c2 = new Sampleclass1();\n        System.out.println(c1.i\
  \ + \"\\n\" + c2.i);\n    }\n}\n```\n\n下方的截图说明了代码以及执行后生成的输出。为了运行此代码，你需要创建两个文件，每个文件以其包含的类命名。\n\
  \n在上面的示例中，我们给了参数 `static`。然而，你的程序可能需要对参数进行动态初始化。为了这一点，你需要参数化构造函数。此类构造函数接受作为构造方法参数的值。下面给了示例实现。\n\
  \n```java\nClass Sampleclass2 {\n    int i;\n    Sampleclass2(int x) {\n       \
  \ I = x;\n    }\n}\n\nPublic class demosasample2 {\n    Public static void main(String\
  \ args[]) {\n        Sampleclass2 c1 = new Sampleclass2(100);\n        Sampleclass2\
  \ c2 = new Sampleclass2(200);\n        System.out.println(c1.i + \"\\n\" + c2.i);\n\
  \    }\n}\n```\n\n该代码的输出下文所示。\n\n在构造函数的实现方面，专门使用了一个关键字。该关键字是 `this` 关键字。它用于引用当前类的对象。通过\
  \ `this` 关键字的帮助，可以在构造函数或方法内部访问类的变量。\n\n```java\nClass Sampleclass3 {\n    int i;\n\
  \    Sampleclass3(int i) {\n        this.i = i;\n    }\n}\n\nPublic class demosasample2\
  \ {\n    Public static void main(String args[]) {\n        Sampleclass3 c1 = new\
  \ Sampleclass3(200);\n        Sampleclass3 c2 = new Sampleclass3(200);\n       \
  \ System.out.println(c1.i + \"\\n\" + c2.i);\n    }\n}\n```\n\n执行后，此代码给出了以下输出——\n\
  \n## 可变参数\n\n在某些程序中，可能存在一种需求，即你不知道 `main` 方法在执行期间会给出多少个参数。为了允许这种程度的动态性，使用了 var-args\
  \ 或可变参数。Var-args 在方法参数中使用以下语法声明：`<type>...<var_name>`\n\n在变量声明中给出的 `var_name` 是一个数组，包含了\
  \ `main` 方法执行时发送的所有变量值。在实现此概念之前，你需要记住两点——\n\n- 每个方法只能实现一个 var-args。\n\n- 如果方法有其他参数（普通性质），这些参数必须出现在\
  \ var-args 之前。换句话说，var-args 必须是方法的最后一个参数。\n\n此概念的示例实现如下。\n\n```java\nPublic class\
  \ demovarargs {\n    Public static void main(String args[]) {\n        printNum(56.5,\
  \ 3, 34, 2, 3);\n        printNum(new double[]{2, 1, 3});\n    }\n    Public static\
  \ void printNum(double... number) {\n        if (number.length == 0) {\n       \
  \     System.out.println(\"no argument passed\");\n            return;\n       \
  \ }\n        double resultNum = number[0];\n        for (int x = 1; x < number.length;\
  \ x++)\n            if (number[x] > resultNum)\n                resultNum = number[x];\n\
  \        System.out.println(\"the max value in set is \" + resultNum);\n    }\n\
  }\n```\n\n该代码的输出如下所示。\n\n## 方法实现\n\n一组用于执行操作的指令被称为方法。你可以在大多数程序中看到打印语句调用 `System.out.println()`。此方法打印传递给它的字符串。\n\
  \n就像这种内置方法一样，开发者也可以创建特定于问题的方法。用户定义的方法可能有参数，也可能没有返回返回值。创建方法的标准是——\n\n```java\nPublic\
  \ static int methodDemo(int i, int j) {\n    /*body*/\n}\n```\n\n在这里，`methodDemo`\
  \ 是方法的名称，`i` 和 `j` 是该方法接受的参数。方法的实现逻辑位于大括号内部。此外，你还会注意到函数声明中写的三个单词——`public`、`static`\
  \ 和 `int`。这里 `int` 是方法的返回类型，而 `public static` 是修饰符。此示例方法可以被修改以适应开发者的需求。\n\n```java\n\
  Public static int minDemo(int num1, int num2) {\n    int minVal;\n    if (num1 >\
  \ num2)\n        minVal = num2;\n    else\n        minVal = num1;\n    return minVal;\n\
  }\n```\n\n此方法确定传递给它的两个参数值中哪一个最小，并将此结果返回给调用方法。现在你对方法以及它们如何实现有了了解，是时候我们讨论这些方法在整体代码中是如何被使用了。\n\
  \n\n\n\n## 调用方法\n\n方法需要被调用或执行才能使用。正如上面提供的示例代码所示，该方法正在执行某些计算并返回计算结果。这种方法返回一个值，其返回类型在方法声明中已经指定。除此，存在另一种类型的方法。此类方法不返回任何内容，通常被称为无返回值的方法。\n\
  \n当程序调用方法时，控制权从程序移动到方法，方法开始执行。一旦遇到 `return` 语句，控制权就会传回调用它的程序。在没有 `return` 语句的情况下，一旦遇到方法的结束大括号，控制权会自动传回。这通常是无返回值方法的情况。\n\
  \n对于返回值的方法，返回类型在方法声明中会被提到。另一方面，对于不返回任何内容的方法，返回类型为 `void`。为了调用我们上面实现的方法，需要在调用它的程序的某处出现以下语句：\n\
  \n```\nint result;\nResult = minDemo(5, 6);\n```\n\n由于该方法返回一个 `int` 类型的值，该值需要被收集在一个\
  \ `int` 变量（`result`）中。方法调用提供了方法所需的两个参数值。这种类型的方法调用也称为参数方法调用或按值传参。\n\n你可能会遇到某些情况，即可能有不同类型的参数且数量很多。在这种情况下，请务必按照所需的顺序提供参数值，以避免任何意外的编译错误或运行时错误。\n\
  \n## 方法重载\n\n可以拥有名称相同但参数不同的方法。当方法被调用时，系统会检测与调用语句中给参数类型和数量匹配的方法，并将控制权转移到对应的方法。这种方法实现的形式被称为方法重载。不要将此概念与重写（overriding）混淆。在方法重写中，方法名、参数和参数数量也是相同的。\n\
  \n为了理解这个概念，让我们来看一个例子——\n\n```java\npublic class overloadingDemo {\n\n    public\
  \ static void main(String[] args) {\n        int x = 34;\n        int y = 56;\n\
  \        double z = 10.5;\n        double u = 7.8;\n        int resultxy = minDemo(x,\
  \ y);\n        double resultzu = minDemo(z, u);\n        System.out.println(\"Min\
  \ Value (Integers) = \" + resultxy);\n        System.out.println(\"Min Value (double)\
  \ = \" + resultzu);\n    }\n\n    public static int minDemo (int num1, int num2)\
  \ {\n        int minval;\n        if (num1 > num2)\n            minval = num2;\n\
  \        else\n            minval = num1;\n        return minval;\n    }\n\n   \
  \ public static double minDemo (double num1, double num2) {\n        double minval;\n\
  \        if (num1 > num2)\n            minval = num2;\n        else\n          \
  \  minval = num1;\n        return minval;\n    }\n}\n```\n\n该代码实现了两个名称同为 `minDemo`\
  \ 但参数类型不同的方法。其中一个方法使用两个 `int` 类型的参数，返回类型为 `int`。另一方面，另一个方法使用 `double` 参数并返回 `double`。该代码的输出如图所示。\n\
  \n## 使用命令行参数\n\n有些程序要求你在运行时执行程序时传递参数。这些参数以命令行参数（line arguments）的形式传递给程序。这些参数在执行程序时连同程序名称一起提供给程序。\n\
  \n在程序内部访问这些参数的方式在示例代码所示。\n\n```java\npublic class CommandLineDemo {\n    public\
  \ static void main(String args[]) {\n        for(int x = 0; x<args.length; x++)\
  \ {\n            System.out.println(\"args[\" + x + \"]: \" + args[x]);\n      \
  \  }\n    }\n}\n```\n\n输入以下命令行运行程序并查看你的结果：\n`java CommandLineDemo 200 100 10 8 7`\n\
  \n### Finalize (finalize)\n\n在 Java 编程中你处理大量的对象，所有这些对象都占用内存空间。如果你正在处理大规模代码，可能需要在终止程序之前清理这些对象占用的空间。为了方便此操作，Java\
  \ 提供了一个垃圾回收方法，称为 `finalize()` 方法。\n\n该方法用于实现你希望程序在终止之前执行的所有操作。其中一些操作包括关闭所有打开的文件、删除所有创建的对象以及释放程序元素占据的任何其他内存。该方法的实现方式如下——\n\
  \n```\nprotected void finalize() {\n    /*Implementation*/\n}\n```\n\n在 `finalize()`\
  \ 的声明中使用 `protected` 访问修饰符，以防止任何外部程序在代码执行之前破坏它。\n\n## 源文件声明规则\n\n在源文件中编写 `import`\
  \ 语句、类声明和包语句时，你需要遵循一些规则。这些规则如下：\n\n- 一个源文件不能有多个 `public` 类。\n- 一个源文件中可以有很多非公共类。\n\
  - 源文件的名称应与该文件中 `public` 类的名称相同。此外，文件的扩展名应该是 `.java`。\n- 如果你正在处理一个包且该类作为包的一部分被实现，那么源文件的第一个语句必须是包语句。\n\
  包语句必须是源文件的第一个语句。任何其他 `import` 语句必须跟在包语句之后。最后，必须存在声明。\n\n你需要理解包和 `import` 语句对于源文件中的所有类都是通用的。\n\
  \n在我们结束讨论之前，让我们对包给出一个结语。它只是接口和类的形式。\n\n# 第 7 章：决策选择\n\n决策结构用于以下情况：如果条件为真，则执行一组指令；当条件被判定为假时，执行另一组指令。Java\
  \ 中提供了几种结构用于此类场景编程。这些结构包括——\n\n## If 语句\n\n该语句用于需要测试条件的情况，如果发现条件为真，则需要执行该语句随后的代码块。该结构的语法如下：\n\
  \n```\nif(condition){\n    /*body*/\n}\n```\n\n该结构的示例实现如下：\n\n```java\npublic class\
  \ ifDemo {\n    public static void main(String[] args) {\n        int i = 10;\n\
  \        int j = 1;\n        if(i>j){\n            System.out.print(i);\n      \
  \  }\n    }\n}\n```\n\n\n\n}\n\n该代码执行后的输出如下 –\n\n![rsrc1ZY.jpg](img/image034.jpg)\n\
  \n## if else 语句\n\n该语句用于需要测试条件的情况：如果条件为真，则执行该语句之后的代码块；否则执行 else 语句之后的代码块。该结构的语法为——\n\
  \n```java\nIf(condition){\n    /*body*/\n}\nElse(\n    /*body*/\n}\n```\n\n以下是该结构的示例实现——\n\
  \n```java\nPuʙlic class ifelsedeᴍo {\n    Puʙlic static void ᴍaiɴ(Striɴg args[])\
  \ {\n        Iɴt i = 1; Iɴt ᴊ = 0;\n        If(i>ᴊ){\n            Systeᴍ.out.priɴt(i);\n\
  \        }\n        Else{\n            Systeᴍ.out.priɴt(ᴊ);\n        }\n    }\n\
  }\n```\n\n该代码执行后的输出如下 –\n\n![rsrc1ZZ.jpg](img/image014.jpg)\n\n## 嵌套 if 语句\n\n该语句用于需要测试条件的情况：如果条件为真，则执行该语句之后的代码块；否则测试下一个条件。如果该条件为真，则执行与该条件对应的\
  \ if 语句代码块。如果没有任何条件为真，则执行 else 语句之后的代码块。可以使用嵌套的 if 语句测试多个条件。该结构的语法为——\n\n```java\n\
  If(condition1) {\n    /*body*/\n}\nElse if (condition2) (\n    /*body*/\n}\nElse\
  \ {\n    /*body*/\n}\n```\n\n以下是该结构的示例实现——\n\n```java\nPuʙlic class ɴestedifdeᴍo\
  \ {\n    Puʙlic static void ᴍaiɴ(Striɴg args[]) {\n        Iɴt i = 0;\n        Iɴt\
  \ ᴊ = 0;\n        If(i>ᴊ){\n            Systeᴍ.out.priɴt(i);\n        }\n      \
  \  Else if(ᴊ>i) {\n            Systeᴍ.out.priɴt(ᴊ);\n        }\n        Else {\n\
  \            Systeᴍ.out.priɴt(\"Equal\");\n        }\n    }\n}\n```\n\n该代码执行后的输出如下\
  \ –\n\n![rsrc200.jpg](img/image013.jpg)\n\n## Switch\n\n如果你有一个变量，并且需要该变量的不同值执行不同的代码块，那么理想的结构是\
  \ switch 语句。该结构的语法为——\n\n```java\nSwitch(variable){\n    Case <value1>:\n      \
  \  /*body*/\n        break;\n    Case <value2>:\n        /*body*/\n        break;\n\
  \    Case <value3>:\n        /*body*/\n        break;\n    default:\n        /*body*/\n\
  \        break;\n}\n```\n\n以下是该结构的示例实现——\n\n```java\npuʙlic class switchdeᴍo {\n\
  \    Puʙlic static void ᴍaiɴ(Striɴg args[]) {\n        Iɴt i = 5;\n        Switch\
  \ (i) {\n            Case 0:\n                Systeᴍ.out.priɴt(0);\n           \
  \     break;\n            Case 2:\n                Systeᴍ.out.priɴt(2);\n      \
  \          break;\n            Case 5:\n                Systeᴍ.out.priɴt(5);\n \
  \               break;\n            default:\n                Systeᴍ.out.priɴt(999);\n\
  \                break;\n        }\n    }\n}\n```\n\n该代码执行后的输出如下 –\n\n![rsrc201.jpg](img/image011.jpg)\n\
  \n## 三元运算符\n\nJava 还支持条件运算符，也称为 `?:` 运算符。该运算符用于替换 ‘if else’ 结构。其语法如下——\n\n`Expression1\
  \ ? Expression2 : Expression3` 这里，`Expression1` 是需要测试的条件。如果条件为真，则执行 `Expression2`，否则执行\
  \ `Expression3`。\n\n![image](img/chapter_title_left) |  | ![image](img/chapter_title_right)\
  \ |\n\n![image](img/chapter_title_above)\n\n# 第 8 章：循环控制\n\n![image](img/chapter_title_below)\n\
  \n有几种情况需要你多次执行一组结构。例如，如果你需要对一组数字排序，你需要多次遍历以获得所需的结果。这种执行流被称为循环。简单来说，循环是一种允许多次执行代码块的结构。Java\
  \ 支持几种用于循环的结构，包括 `while` 循环、`for` 循环和 `do while` 循环。\n\n`while` 循环迭代执行代码块，直到 `while`\
  \ 指定条件为真。一旦条件失败，循环停止。\n\n![rsrc1ZH.jpg](img/image043.jpg)\n\n`for` 循环允许程序员在同一个结构中操作条件和循环变量。因此，你可以初始化一个循环变量，增加/减少它并运行循环直到该变量为真。\n\
  \n![rsrc1Zj.jpg](img/image040.jpg)\n\n`do while` 循环与 `while` 循环相似。然而，在 `while` 循环中，是在执行代码块之前检查条件。而在\
  \ `do while` 循环中，是执行代码块后检查条件。如果条件满足，则再次迭代循环，否则终止。可以说 `do while` 循环至少执行一次。\n\n![rsrc1Zj.jpg](img/image040.jpg)\n\
  \n## 循环状态\n\n有两个专门用于循环的关键字，被称为控制状态，因为允许控制流从一段代码转移到另一个部分。这些关键字是——\n\n`break` 用于循环内部，当你希望执行流终止循环并直接从循环后的第一个语句开始。\n\
  \n`continue` 用于循环内部，当你希望计算机忽略循环的剩余部分并将控制移动到循环的第一语句。为了帮助你理解循环如何执行，让我们来看一个实现所有三种循环控制的示例。\n\
  \n### For 循环实现\n\n```java\nPuʙlic class fordeᴍo {\n    Puʙlic static void ᴍaiɴ(Striɴg\
  \ args[]) {\n        Iɴt [] ɴuᴍerarray = {100, 300, 500, 700, 900};\n        For(iɴt\
  \ i=0; i<5; i++) {\n            Systeᴍ.out.priɴt(ɴuᴍʙerarray[i]);\n            Systeᴍ.out.priɴt(\"\
  ,\");\n        }\n        Systeᴍ.out.priɴt(\"\\ɴ\");\n    }\n}\n```\n\n该代码执行后的输出如下\
  \ –\n\n![rsrc202.jpg](img/image033.jpg)\n\n## While 循环实现\n\n```java\nPuʙlic class\
  \ whiledeᴍo {\n    Puʙlic static void ᴍaiɴ(Striɴg args[]) {\n        Iɴt [] ɴuᴍerarray\
  \ = {100, 300, 500, 700, 900};\n        Iɴt i = 0;\n        While(i<5) {\n     \
  \       Systeᴍ.out.priɴt(ɴuᴍʙerarray[i]);\n            Systeᴍ.out.priɴt(\",\");\n\
  \            I++;\n        }\n        Systeᴍ.out.priɴt(\"\\ɴ\");\n    }\n}\n```\n\
  \n该代码执行后的输出如下 –\n\n![rsrc203.jpg](img/image045.jpg)\n\n## do While 循环实现\n\n```java\n\
  Puʙlic class dowhiledeᴍo {\n    Puʙlic static void ᴍaiɴ(Striɴg args[]) {\n     \
  \   Iɴt [] ɴuᴍerarray = {100, 300, 500, 700, 900};\n        Iɴt i = 0;\n       \
  \ do {\n            Systeᴍ.out.priɴt(ɴuᴍʙerarray[i]);\n            Systeᴍ.out.priɴt(\"\
  ,\");\n            I++;\n        } while (i<5);\n        Systeᴍ.out.priɴt(\"\\ɴ\"\
  );\n    }\n}\n```\n\n\n\n\n\n所有的文件操作都由 `java.io` 包下的 Java 支持，这些函数的实现基于流（Streams）的概念。流简单来说就是数据的序列，它分为两种类型，即\
  \ `inputStream` 和 `outputStream`。前者用于读取数据，后者用于写入数据。\n\n## 字节流\n\nJava 支持的第一种流是字节流。限制在\
  \ 8 字节大小的 I/O 操作属于这一类。在开始编码之前，你需要意识到用于执行输入和输出的类分别是 `FileInputStream` 和 `FileOutputStream`。现在让我们来看将一个文件的内容复制到另一个文件的示例。\n\
  \n```java\nimport java.io.*;\n\npublic class copyfilebs {\n    public static void\
  \ main(String args[]) throws IOException {\n        FileInputStream inputfile =\
  \ null;\n        FileOutputStream outputfile = null;\n        try {\n          \
  \  inputfile = new FileInputStream(\"in.txt\");\n            outputfile = new FileOutputStream(\"\
  out.txt\");\n            int i;\n            while ((i = inputfile.read()) != -1)\
  \ {\n                outputfile.write(i);\n            }\n        } finally {\n\
  \            if (inputfile != null) {\n                inputfile.close();\n    \
  \        }\n            if (outputfile != null) {\n                outputfile.close();\n\
  \            }\n        }\n    }\n}\n```\n\n在类文件相同的文件夹中保留名为 `in.txt` 的输入文件，并执行代码查看其作用。\n\
  \n## 字符流\n\n从 8 位数据操作转移到 16 位 Unicode 数据操作，我们需要从二进制流切换到字符流。用于执行输入和输出的类分别是 `FileReader`\
  \ 和 `FileWriter`。上面的代码可以修改如下以使用字符流。\n\n```java\nimport java.io.*;\n\npublic class\
  \ copyfilecs {\n    public static void main(String args[]) throws IOException {\n\
  \        FileReader inputfile = null;\n        FileWriter outputfile = null;\n \
  \       try {\n            inputfile = new FileReader(\"in.txt\");\n           \
  \ outputfile = new FileWriter(\"out.txt\");\n            int i;\n            while\
  \ ((i = inputfile.read()) != -1) {\n                outputfile.write(i);\n     \
  \       }\n        } finally {\n            if (inputfile != null) {\n         \
  \       inputfile.close();\n            }\n            if (outputfile != null) {\n\
  \                outputfile.close();\n            }\n        }\n    }\n}\n```\n\n\
  在类文件相同的文件夹中保留名为 `in.txt` 的输入文件，并执行代码查看其作用。\n\n## 标准流\n\n为了允许用户从键盘输入输入并在屏幕上打印输出，Java\
  \ 支持标准流——\n\n- `System.in` 代表标准输入流，允许用户通过键盘提供输入。\n![rsrc1ZH.jpg](img/image043.jpg)\n\
  - `System.out` 代表标准输出流，允许用户在屏幕上获取输出。\n![rsrc1ZH.jpg](img/image043.jpg)\n- `System.err`\
  \ 代表标准错误流，允许用户获取系统的错误消息。\n![rsrc1ZJ.jpg](img/image040.jpg)\n\n提供的示例程序允许系统从用户获取输入并将输入的内容打印到屏幕上，直到用户按下‘q’键后程序退出。\n\
  \n```java\nimport java.io.*;\n\npublic class ssddemo {\n    public static void main(String\
  \ args[]) throws IOException {\n        InputStreamReader inputc = null;\n     \
  \   try {\n            inputc = new InputStreamReader(System.in);\n            System.out.println(\"\
  Enter characters, 'q' to quit.\");\n            char char;\n            do {\n \
  \               char = (char) inputc.read();\n                System.out.print(char);\n\
  \            } while(char != 'q');\n        } finally {\n            if (inputc\
  \ != null) {\n                inputc.close();\n            }\n        }\n    }\n\
  }\n```\n\n可以执行此程序来查看输出是什么以及代码的工作原理。\n\n# 异常处理\n\n异常是任何程序无法处理的意外事件。显然，在这种情况下，程序的正常执行流受到干扰，程序可能会因错误终止或表现异常。这就是为什么异常需要由程序处理的原因。\n\
  \n那么，为什么会发生异常？异常的发生可能是由于一系列原因。导致这种情况的一些场景包括：\n- 无效的数据输入 ![rsrc1ZH.jpg](img/image043.jpg)\n\
  - 程序正尝试打开指定位置不存在的文件 ![rsrc1Z.jpg](img/image040.jpg)\n- JVM 内存不足 ![rsrc1Z.jpg](img/image040.jpg)\n\
  - 正在进行通信且系统丢失连接 ![rsrc1ZJ.jpg](img/image040.jpg)\n\n显然，异常可能由于系统、用户产生的问题或程序层的问题引起。基于这一观察，创建了三类异常。这三类异常已在章节中讨论。\n\
  \n## 编译异常\n\n在编译时由编译器检查并报告的异常称为编译异常（Checked Exceptions）。这些异常是编译时异常，需要在编写代码时进行处理。\n\
  \n处理此类异常的示例如下面的代码所示：\n\n```java\nimport java.io.File;\nimport java.io.FileReader;\n\
  \npublic class demoh {\n    public static void main(String args[]) {\n        File\
  \ file = new File(\"E://samplefile.txt\");\n        FileReader infile = new FileReader(file);\n\
  \    }\n}\n```\n\n如果在创建文件时指定的路径不存在，编译器将抛出 `FileNotFoundException`。\n\n## 非编译异常\n\
  \n某些异常是在运行时发生的。此类异常被称为非编译异常（Unchecked Exceptions）或运行时异常。逻辑错误、程序 Bug 和不当使用都是此类错误的示例。此类错误的一个重要特征是它们在编译时不会被检测。\n\
  \n为了帮助理解什么是运行时错误，让我们来看一个例子。假设你在程序中实现了一个包含 5 个元素的数组。然而，代码访问了第 6 个元素。此错误将在运行时检测，系统将生成\
  \ `ArrayIndexOutOfBoundsException`。\n\n## 错误\n\n某些异常是系统或程序员无法控制的。此类错误的一个常见例子是 `stackOverflowError`。对于这些错误你几乎无法做什么，因此最好忽略它们。当它们发生时，会中断程序的执行，但无能为力。\n\
  \n## 异常体系\n\nJava 有一个名为 `java.lang.Exception` 的内置类，所有异常都属于该类。所有异常类都是该类的子类。此外，`Throwable`\
  \ 是异常类的父类。`Throwable` 的另一个子类是 `Error` 类。上述所有栈溢出错误都属于这个 `Error` 类。\n\nException 类有两个子类，分别为\
  \ `RuntimeException` 和 `IOException`。以下是 `Throwable` 类中提供的定义的方法列表：\n\n- `String\
  \ getMessage()`：调用时，该方法返回所遇到的异常的详细描述。\n- `Throwable getCause()`：该方法被调用时返回一个包含异常原因的消息。\n\
  - `String toString()`：该方法返回类名以及异常的详细描述。\n- `void printStackTrace()`：通过调用此方法可以将 `toString()`\
  \ 的结果以及堆栈轨迹打印到标准错误流（`System.err`）。\n- `StackTraceElement[] getStackTrace()`：返回堆栈轨迹元素的数组。\n\
  \n\n\n\n\n在某些场景下，你可能需要访问栈轨迹（stack trace）的不同元素。此方法返回一个数组，将栈轨迹的每个元素都保存到数组的不同元素中。数组的第一个元素包含栈轨迹的顶端元素，而栈轨迹的底部被保存在数组的最后一个元素。\n\
  \n`public throwable fillstacktrace()`\n\n将当前栈轨迹的内容附加到之前的栈轨迹信息之后，并以数组的形式返回。\n\n##\
  \ 捕获异常\n\n捕获异常的标准方法是使用 `try` 和 `catch` 关键字以及它们的代码实现。这个 `try-catch` 块需要以这种方式实现：即包含可能会抛出异常的代码。在这里还需要提到，\n\
  \n预期抛出异常的代码被称为保护代码。`try` 和 `catch` 块实现的语法如下——\n\n```\nTry {\n    /*保护代码*/\n}catch(Exception\
  \ exc1) {\n    /*捕获代码*/\n}\n```\n\n预期抛出异常的代码被放在 `try` 块中。如果抛出了异常，则在 `catch` 块中实现对应的异常处理要执行的操作。每个\
  \ `try` 块必须有一个 `catch` 块或一个 `finally` 块。\n\n在 `catch` 语句中，需要声明预期抛出的异常。一旦发生异常，执行流将转移到\
  \ `catch` 块。如果抛出的异常与 `catch` 块中定义的异常匹配，则执行 `catch` 块。\n\n下面是 `try-catch` 块的示例实现。该代码实现了一个包含\
  \ 2 个元素的数组。然而，代码尝试访问并不存在的第 3 个元素。结果导致抛出了异常。\n\n```java\nimport java.io.*;\n\npublic\
  \ class demoexception {\n    public static void main(String args[]) {\n        Try\
  \ {\n            int arr[] = new int[2];\n            System.out.println(\"访问数组的第\
  \ 3 (rd) 元素:\" + arr[3]);\n        }catch(ArrayIndexOutOfBoundsException exp) {\n\
  \            System.out.println(\"捕捉异常:\" + exp);\n        }\n        System.out.println(\"\
  到达 catch 块外部\");\n    }\n}\n```\n\n此代码的输出所示所示。\n\n![rsrc206.jpg](img/image018.jpg)\n\
  \n## 实现多个 catch 块\n\n一段代码块可能会导致多个异常。为了满足这一需求，允许实现多个 `catch` 块。此类实现的语法如下所示。\n\n```java\n\
  Try {\n    /*保护代码*/\n}catch(Exptype1 exp1) {\n    /*捕获块 1*/\n}catch(Exptype2 exp2)\
  \ {\n    /*捕获块 2*/\n}catch(Exptype3 exp3) {\n    /*捕获块 3*/\n}\n```\n\n上述语法演示了三个\
  \ `catch` 块的实现。然而，你可以根据需要实现任意数量的 `catch` 块。当执行此代码时，会先执行保护代码。如果发生异常，异常类型将与第一个 `catch`\
  \ 块的异常进行匹配。但如果异常类型不匹配，将忽略 `catch` block 1 并尝试匹配第二个 `catch` 块的异常类型。哪一个 `catch` 块与抛出的异常类型相同，就会执行相应的\
  \ `catch` 块。\n\n## 关键字：throw/throws\n\n这两个关键字是相似的词，但用途完全不同。`throws` 关键字用于方法的末尾，用于声明代码会抛出异常但方法不处理它。换句话说，`throw`\
  \ 关键字用于字面上的抛出异常。此异常可以是新的，也可以是之前已经创建的异常。\n\n下面是说明 `throws` 和 `throw` 用法的示例代码。在方法声明中，它声明了方法抛出异常，而\
  \ `throw` 的使用启动了该异常的抛出。\n\n```java\nimport java.io.*;\n\npublic class name {\n \
  \   public void deposit(double amount) throws Exception {\n        /*implementation*/\n\
  \        throw new Exception();\n    }\n}\n```\n\n可能会抛出多个异常。为了在方法声明中声明这些异常，你可以提供一个逗号分隔的异常列表。下面是该概念的示例实现。\n\
  \n```java\nimport java.io.*;\n\npublic class name {\n    public void withdraw(double\
  \ amount) throws Exception, InsufficientException {\n        /*implementation*/\n\
  \    }\n}\n```\n\n## finally 块\n\n现在你已经熟悉了 `try-catch` 块，让我们来看看异常处理中使用的第三个块：`finally`\
  \ 块。这是出现在 `try` 和 `catch` 块之后的最后一个块。此外，如果没有找到异常，则可能会省略 `catch` 块的执行，但无论是否发生异常，`finally`\
  \ 块始终会被执行。\n\n该块的目标是执行程序员可能认为必要的任何清理活动。无论 `try` 块中包含的代码发生了什么，你都执行这段代码。该块的语法及其实现方式如下。\n\
  \n```java\nTry {\n    /*保护代码*/\n}catch(Exptype1 exp1) {\n    /*捕获块 1*/\n}catch(Exptype2\
  \ exp2) {\n    /*捕获块 2*/\n}catch(Exptype3 exp3) {\n    /*捕获块 3*/\n}finally {\n \
  \   /*finally 块实现*/\n}\n```\n\n下面提供了实现此概念的示例代码，以使概念更清晰。\n\n```java\npublic class\
  \ democep {\n    public static void main(String args[]) {\n        int arr[] = new\
  \ int[2];\n        Try {\n            System.out.println(\"访问第 3 (rd) 元素:\" + arr[3]);\
  \ \n        }catch(ArrayIndexOutOfBoundsException exp) {\n            System.out.println(\"\
  捕捉异常:\" + exp);\n        }finally {\n            Arr[0] = 5;\n            System.out.println(\"\
  第一个元素是: \" + arr[0]);\n            System.out.println(\"finally 块已执行\");\n     \
  \   }\n    }\n}\n```\n\n代码的输出所示。\n\n![rsrc207.jpg](img/image04.jpg)\n\n在实现 `try/catch/finally`\
  \ 块时，始终记住以下几点。首先，没有 `try` 块，就不会有 `catch` 块。同样，没有 `catch` 或 `finally` 块，就不会有独立的 `try`\
  \ 块。此外，`finally` 块是一个可选的结构，即使你的代码中没有 `finally` 块，`try/catch` 也能正常工作。\n\n##自定义异常\n\
  \nJava 允许你定义自己的异常。然而，在此之前，你需要记住几点点。首先，任何异常都需要派生或作为 `Throwable` 类的子类。为了实现受检异常，你必须扩展\
  \ `Exception` 类。然而，运行时异常的实现必须扩展 `RuntimeException` 类。\n\n定义异常的标准方法是——`class demoexception\
  \ extends Exception`\n\n以下代码说明了自定义异常的实现和用法。\n\n```java\nimport java.io.*;\n\npublic\
  \ class insufficientException extends Exception {\n    private double amount;\n\n\
  \    public insufficientException(double amount) {\n        this.amount = amount;\n\
  \    }\n\n    public double getAmount() () {\n        return amount;\n    }\n}\n\
  ```\n\n## 总结\n\n本书为你提供了一个关于 Java 基础的入门教程。我们涵盖了 Java 编程的基本概念，以及开始 Java 编程所需的一切内容。现在你已经回顾了\
  \ Java 的基本概念，并且假设你尝试了书中给所有的代码，你已经准备好跳转到高级 Java 编程了。\n\n\n\n\n成为编程专家的关键（无论是任何种编程语言）在于实践。你练习得越多，你的编程技能就会越强大！我们希望你喜欢这本书，并希望它帮助你获得\
  \ Java 的基础级知识。我们希望已经为你打下了良好的基础，让你能够磨练技能并成为一名专家 Java 程序员。\n\n# 第 2 册 - Java 问题与解答\n\
