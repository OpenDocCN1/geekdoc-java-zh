    The seventies tested this fragile social convention. To measure stress, economist
    Arthur Okun identified the misery index: a simple addition of the percentage rate
    of inflation with the percentage rate of unemployment. “What better gauge of our
    economic misery,” asked the popular syndicated columnist Sylvia Porter, “than
    the murderous squeeze on us resulting from a simultaneous rise in joblessness
    and soaring living costs?”^5


    If inflation is 2 percent and unemployment is 4 percent, the misery index equals
