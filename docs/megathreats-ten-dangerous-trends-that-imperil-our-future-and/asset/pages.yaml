  md: '# Chapter 2


    # Private and Public Failures


    Happy borrowers are all alike, the author of Anna Karenina, Leo Tolstoy, might
    have said, each unhappy borrower is unhappy in their own way. Borrowers who repay
    debts move forward. Unhappy borrowers, by contrast, fail to meet obligations for
    reasons as varied as the ill-fated projects that grind to a halt still owing money.


    It is true for individuals and also for governments. When national governments
    wobble on the verge of default, they need a hand to steady themselves and regain
    their footing. That assistance requires public institutions—such as the IMF and
    the World Bank—sympathetic enough and sturdy to absorb the costly consequences
    of errors, policy mistakes, misjudgments, and bad luck. Despite the fact that
    the total wealth in the world today is vastly greater than at any time in the
    past, robust help is getting harder to find. The deepest sources of capital—the
    governments of major powers—are themselves burdened with debt.


    Curing debt crises is possible but most solutions require strong medicine and
    excruciating rehab. Bailouts inject vital cash in exchange for crippling concessions.
    Restructurings displace workers and pum investors and still may not work. Inflation
    shrinks the real debt over time but savings erode and costs soar. Capital taxation
    squeezes owners of real and financial assets. Financial repression hands the tab
    to a proligate financial sector adept at shifting the burden to everybody else.
    Austerity shows prudent until it triggers a severe recession. Economic growth
    furnishes the only welcome solution, but its prospects are dimmest when debt smothers
    initiative. In this chapter, we will consider seven strategies and why many end
    up making problems worse instead of better.'
