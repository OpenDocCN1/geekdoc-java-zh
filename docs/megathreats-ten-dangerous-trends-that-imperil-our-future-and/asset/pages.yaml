    health, and environmental megathreats hurling toward us. Sound policies might
    partially or fully avert one or more of them, but collectively, calamity seems
    near certain. The most plausible solutions are complex, costly, and fraught with
    political and geopolitical friction. We probably won''t achieve them.


    The March 2021 report “Global Trends 2040: A More Contested World” by the US National
    Intelligence Council describes five scenarios on how the world will evolve over
    the next two decades.¹ Most of the five scenarios are quite disturbing, with such
    names as “Tragedy and Mobilization,” “A World Adrift,” and “Separate Silos.” Only
    one, “Renaissance of Democracies,” sounds optimistic.


    Strip away the nuances and two scenarios highlight the outcomes that matter most.
    In one scenario, one or several megathreats materialize, and civilization backslides
    toward severe instability and chaos. That dystopia. In the other, good judgment
    and sound policies across the board manage to partly deflect the effect of the
    megathreats. We stumble, but we don''t collapse. We call this a “utopian” version
    even if it is far from ideal.


