    watch has changed. In 2021, former lawyers Christine Lagarde and Jay Powell ran
    the European Central Bank and the Federal Reserve. Martin Bailey at the Bank of
    England came from banking operations, not a background seeped in monetary policy.


    So what have central banks become when the fig leaf of their independence has
    been ripped off as debts mount? Have they strayed from a rigorous focus on the
