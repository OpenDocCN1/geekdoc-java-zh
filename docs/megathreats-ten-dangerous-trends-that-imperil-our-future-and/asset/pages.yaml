    investors who cater to every wind of change. When short-term goals dictate policy,
    they lean heavily on easy money and credit because that is what voters want and
    leveraged markets need to avoid crashing.


    The macro economy is no game and experts should never look at it that way. But
    it''s also fair to say that a misdiagnosis can be harmful. We''ve wandered into
    uncharted territory following the rules in the wrong way. Easy money and credit
    and loose fiscal policies won''t save us from relentless boom-and-bust cycles.
    They will cast us into a debt cycle. We need to adjust the rules to stop this
    debt trap. If we don''t, nobody wins, and everyone will crash and lose during
