  md: 'Does the rise of a new power, threatening an established power, always lead
    to war? Harvard professor Graham Allison tested ancient thesis in his book, *Destined
    for War: Can America and China Escape Thucydides’s Trap?* He looked at sixteen
    confrontations between rising and dominant powers since the 1500s. In twelve of
    them, wars erupted. They engulfed Portugal and Spain, France and the Habsburg
    Empire, the Habsburg and the Ottoman Empires, France and England, among others—until
    two world wars and the prospects of nuclear annihilation sobered up. The Cold
    War is one of the four exceptional cases that ended peacefully, mostly because
    the rising Soviet Union became a declining power, eventually collapsing from within.


    Another exception is the British Empire. The United States eclipsed the United
    Kingdom without a fight, in part because changing control posed no threat to the
    English language or its political and economic regime; and the United Kingdom
    needed the US support in both world wars. Those two exceptions do not provide
    much encouragement for the United States and China.


    On balance, Thucydides got it right. When rising and existing powers chafe, wars
    usually invariably and eventually occur. Professor Allison dubbed this predicament
    the Thucydides Trap for good reason.


    Xi Jinping, whose daughter attended Harvard, referred repeatedly to the Thucydides
    Trap in his remarks. China and the United States can both flourish, he reassured
