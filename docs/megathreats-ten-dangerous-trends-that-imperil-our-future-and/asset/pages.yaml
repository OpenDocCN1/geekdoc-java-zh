  md: '# # Chapter 1


    # # The Mother of All Debt Crises


    I have lived through, studied, and tried to solve debt crises over four decades,
    both as an academic and at pivotal times as a policy maker in the US government.
    Some crises were confined to a single region. Others swept the globe. Some left
    few traces. Others devastated entire economic sectors and upended millions of
    lives. No one should pretend to have all the answers to such a complex problem
    as managing economic policy, but I''ve learned this much: experience is a poor
    teacher. We keep making the same stubborn mistakes. Time and again, enthusiasm
    and easy money policies inflate bubbles; time and again, they burst. The Looney
    Tunes Runner could sniff out dynamite in gift wrapping. Why can''t we? Whether
    packaging or human nature is to blame, the worst debt crisis of my lifetime lies
    right ahead of us, as if we have forgotten every single one of its predecessors.


    One country that should reckon with the lessons of the past is Argentina. In 2020,
    the Argentine government defaulted on its debt for the fourth time since 1980
    and the ninth time in its history. In August 2020 the country''s finance ministry
    announced an agreement with weary creditors. They extended maturities on the debt
    and slashed interest payments with hours to go before South America''s third-largest
    economy prepared to terminate negotiations.


    Hope springs eternal in countries that try to avert financial catastrophe. “May
    we never again enter this labyrinth [of indebtedness], please,” Argentine president
    Alberto Fernandez declared at the time. Promising that Argentine debt will shrink
    by half over the next decade, the president signaled that the government would
    do what it takes to keep a beleaguered economy viable. He thanked regional governors
    and members of congress'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'who were at his side; he thanked Pope Francis and the leaders of Mexico, Germany,
    France, Spain, and Italy. As the Financial Times reported, he stated, “None of
    this was easy, but if there’s something Argentines know how to do, it is to pick
    ourselves up when we fall.¹¹


    It was the kind of true-grit statement that political leaders love to make in
    the face of adversity. But Argentina—and the world—is far from passing the current
    crisis. The country continues to labor under about $300 billion in public debt,
    nearly equal to its entire economic output in 2020. And inflation is ravaging
    the country during and after the COVID-19 crisis with the inflation rate for 2022
    expected to be over 50 percent.


    Increasingly, the entire world resembles Argentina. Public debt owed by governments,
    on top of private debt owed by corporations, financial institutions, and households,
    was soaring out of control before the gigantic tab for the COVID-19 pandemic response
    came due. In the United States, the $1.9 trillion COVID-19 relief package passed
    in 2021, by two huge stimulus measures passed during the Trump presidency, added
    $4.5 trillion to its public debt since 2019. “would represent the boldest act
    of macroeconomic stabilization policy in US history,” former treasury secretary
    Lawrence Summers warned in early 2021 in a Washington Post op-ed, where he correctly
    expressed concerns that such a large, excessive stimulus would overheat the economy
    and cause inflation². And the Biden administration promptly planned another $3
    to $4 trillion of infrastructure and social spending that would be only financed
    by higher taxes. Luckily only a portion of such large-scale additional spending
    was passed.


    Responses to COVID-19 wrenched loose any semblance of restraint, regardless of
    which party or coalition was in. Europe is barely coping. “Those [European] debts
    are surging to levels not seen since World War II,” the New York Times reported
    in February 2021.³ In many European countries, debt is growing so fast that it
    is outpacing the size of national economies.


    Based on data from the Institute of International Finance, global debt—private
    and public—by the end of 2021 was well over 350 percent of global GDP, and it
    is climbing fast for decades (from 220 percent of GDP in 1999) and spiking after
    the COVID-19 crisis.⁴ The ratio has never before come close to this level in advanced
    economies or emerging markets. US'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'debt is right on pace with the global average. Current US private and public
    debt-to-GDP ratio is much higher than the peak debt during the Great Depression,
    and more than twice the level when the United States emerged from World War II
    and entered a period of robust growth.


    This steep prompted a blunt warning by the Institute of International Finance,
    which tracks global debt. “If the global debt pile continues to grow at the average
    pace of the last 15 years, our back-of-the-envelope estimates suggest that global
    debt could exceed $360 trillion by 2030—over $85 trillion higher than current
    levels.” That would bound the global debt ratio to more than four times global
    output, a level that would smother economic growth under the massive costs of
    debt service.


    "The pace of debt accumulation has been unprecedented since 2016,” the Institute
    of International Finance warned in a November 2020 Weekly Insight report titled
    “More Debt, More Trouble.” In other words, this crisis was already coming. The
    pandemic only accelerated it.


    Although debt ratios are higher in advanced economies, emerging markets get into
    trouble much faster. Argentina is not even a highly indebted country overall,
    by emerging market standards. Its private debt is only about one-third of GDP,
    which is comparatively healthy. But as the record shows, debt denominated in foreign
    currency crippled its ability to service and repay international loans. Argentina
    had pegged its peso to the US dollar, and when its economy went south in 2001
    while the US economy remained strong, its currency crashed. That put pressure
    on its ability to repay its loans in foreign currency. And a new debt'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'crisis is now looming. In advanced economies, meanwhile, the levels of debt
    are extraordinary, already at 420 percent of GDP and rising. The coming tsunami
    will not spare China, where credit-fueled economic growth has built a Himalayan
    mountain of debt, about 330 percent of GDP.


    True, we have survived financial bubbles and economic dislocations of decades
    and centuries. As I stated, I have witnessed multiple debt crises over the past
    forty years, and in each case the country or region has eventually recovered.
    But readers who suppose that crises come and go—with scarring at worst—are mistaken
    this time. We have crossed into new territory. With global income growth flagging,
    countries, corporations, banks, and households owe more than they can repay in
    most foreseeable scenarios. Debt that was manageable when interest rates were
    zero or negative will become unsustainable as central banks now have to sharply
    raise their policy rates to fight inflation. This time, we are racing toward an
    inflection point that will alter life for lenders and borrowers whether private,
    prudent or profligate. The Mother of All Debt Crises may take sometime during
    the current or next decade.


    The current dilemma evokes déjà vu. Back in the spring of 2006, the US real estate
    sector went on a binge. Homes were selling like hotcakes to any borrower whose
    breath could fog a mirror. Never mind if their assets or incomes made them unqualified
    to pay the mortgage. Houses found buyers on the expectation that rising prices
    would bail out borrowers who spent more than they could afford. It looked like
    a bubble to me, and I said so.


    In Las Vegas that year I attended a conference on mortgage securitization. The
    toxic and reckless subprime mortgages were plain to see. My own research showed
    that cheap debt and credit requirements were fueling money into a real estate
    bubble. Afterward I rented a car and set out to visit Death Valley, a below-sea-level
    lunar-like landscape where miners used to dig by the scorching summer heat while
    digging for the shiny precious metal. On the way I discovered a man-made death
    valley that sharpened my concerns about debt.


    The road out of Las Vegas cut smack through a brand-new community. House after
    brand-new house sat empty in vast lots. Not a soul lived in them. No lights were
    to be seen. No cars. No families. The “community”'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'was a graveyard instead of the town developers must have imagined. Reckless
    greed had produced that housing bubble: the same motive in Von Stroheim’s classic
    film Greed leads two protagonists to beat each other to death in the Death Valley
    desert.


    Despite clear evidence of a real estate bubble putting borrowers and lenders at
    risk, so-called experts dismissed fears. I pounded the same a few months later
    in a keynote address to economists at an event hosted by the International Monetary
    Fund (IMF).


    Upticks in the cost of oil and some softening in home prices were visible but
    not yet dramatic. I warned nevertheless that a huge crisis lurked on the other
    side of a real estate bubble. It would end in home mortgage defaults wiping out
    lenders and investors who had flocked to securities that bundled risky mortgages.
    While most experts relied on top-notch bond ratings from rating agencies in conflicts
    of interest, I predicted losses in the hundreds of billions of dollars for hedge
    funds, investment banks, commercial banks, vital financial institutions, and gogobacked
    homeowners.


    I stepped off the stage to tepid applause. The panel’s moderator said aloud, “I
    think we need a stiff drink.” That drew a laugh from a skeptical audience. The
    speaker after me noted that my predictions did not use mathematical models. He
    rejected my analysis as mere hunches of a perennial pessimist.


    In February 2007 I stressed my concern again, on a panel on the global outlook
    at the annual World Economic Forum in Davos, Switzerland. Denial was still powerful.
    US Federal Reserve chairman Ben Bernanke declared that a housing correction was
    due, but he ruled out any dire spillover effects. He foresaw no financial crisis,
    much less a systemic threat to the banking system. I respectfully disagreed, wanting
    that we brace brace a bumpy road and a global—not just US—financial crisis. Changed
    few minds so far as I could tell. Instead, I gave ammunition to call me Dr. Doom,
    a moniker that ignores outspoken faith in progressive and inclusive capitalism
    when sound judgment, good policies, and moral principles prevail.


    My reception affirmed even that the prominent experts at Davos may not see trouble
    before it’s too late. It’s a classic bias in human thinking: most of us never
    want to imagine the worst. We are optimists by nature. Personally,'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'I find the zeitgeist of Davos every year to be a contrarian indicator of the
    future. If everyone in the Davos believes something will happen—good or bad, as
    it may be—they are highly likely to be wrong.


    Consensus groupthink often rules the world’s elites. The same event gave me another
    chance to voice my contrarian perspective. My second Davos presentation probed
    the future of the European monetary union with an eye to the risks ahead. My fellow
    panelists Jean Claude Trichet, who headed the European Central Bank at the time,
    and the Italian finance minister, Giulio Tremont, expressed confidence in a sound
    and sustainable monetary union. My assessment was far less sanguine; underscored
    the extreme danger of excessive debt and loss of competitiveness of some members
    of the union that could splinter the eurozone.


    If growth with large trade and fiscal deficits continued, I warned, Italy, Greece,
    Spain, and Portugal would face a crippling debt crisis by the end of the decade.
    My remarks visibly agitated the Italian finance minister. Introduced as someone
    who would share the American perspective, reminded the audience that I was born
    in Turkey and grew up in Milan, Italy. So there I telling Italy’s finance minister
    that my adopted country would, over time, be in grave danger of financial collapse.
    Before I finished he could stand it no longer. “Roubini,” he shouted, “go back
    to Turkey!” News reports the outburst “Tremonti’s Temper Tantrum.”


    Three years later, Greece was bankrupt and the other PIIGS (Portugal, Italy, Ireland,
    Greece, Spain) were in a severe financial crisis. And it took two more years before
    Greece embraced tough fiscal restrictions. At that point, Greece restructured
    and reduced its public debt while also receiving a 200-billion-euro bailout package
    from the European Commission, the European Central Bank (ECB), and the IMF, dubbed
    the Troika.


    Greece barely survived that crisis—but it was no prelude. Italy owed ten times
    more public debt, making it too big to fail and too big to rescue. The eurozone
    might be able to survive without Greece. But losing Italy, Europe’s third largest
    economy, would put an end to the dreams of eurozone planners.


    Earlier in 2007–8, the Great Financial Crisis had erupted in the United States,
    this time driven by profligate consumer debt. Homeowners'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'defaulted, banks shuddered and failed, stock markets collapsed, assets vanished,
    lenders balked, companies closed, and jobs vanished. Central bankers huddled with
    treasury officials and bank industry executives to stop the bloodshed.


    No one enjoys seeing vast dislocation and the pain it causes. I did not welcome
    the vindication of my doom saying. The economist who invited me to speak to the
    IMF said that in 2006 I sounded like a madman. When I returned to speak again
    two years later, with housing prices in free fall across the United States and
    mortgage providers in reil, he said I was greeted as a prophet.


    After so much upheaval and prodigious finger waging you''d think we''ve mended
    our loose ways. But debt is too seductive.


    Countries, corporations, and households all borrow, either to invest or consume.
    Investment into new public or private capital pays for things that last long into
    the future. Using public debt, countries invest in ports, roads, bridges, and
    other infrastructure. In the private sector, corporations invest in the machinery,
    software, and computers to produce more goods and services. Households borrow
    to invest in homes or in education. Borrowing to invest can make good sense as
    long as the return on the investment is higher than the cost of financing it.
    Borrowing to consume, on the other hand, uses debt to plug recurring bills or
    deficits that operating income should cover.


    Experience teaches prudent public and private borrowers a golden rule: borrow
    to invest, not to consume. In principle, borrowing to consume is riskier than
    borrowing to invest. When loans persistently cover stagnant salaries, budget deficits,
    discretionary items, or vacation expenses, borrowers are starting down a rough
    and slippery road that may lead to bankruptcy.


    But overborrowing to pay for overpriced assets also imposes hefty risk. Nothing
    produces frothy asset bubbles faster than cheap debt pouring into the marketplace.
    If, for, a hasty borrower spends billions on a fiber-optic network when prices
    are spiking, officials might convince themselves that they are investing in the
    future. Unless unforeasible revenue can service the debt, however, those investments
    may hurt companies or'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'even put out of business. As many learned after fiber-optics first appeared,
    investing in bloated assets with excessive leverage and cheap money leads to asset
    booms and bubbles, with busts and crashes close behind.


    A boom-and-bust pattern has been well chronicled since the publication of Extraordinary
    Popular Delusions and the Madness of Crowds in 1841. In it, Scottish author Charles
    Mackay Mackay probed the human tendency to run amok in pursuit of quick profits,
    dating back to a mania for tulip bulbs as expensive as houses in seventeenth-century
    Holland.


    Debt and financial crises erupt not only in emerging economies that are fragile.
    The financial history of recent decades is littered with economic and financial
    crises in advanced economies, too. When poor judgment sweeps investors, debt acts
    like a steroid.


    We always embark with noble intentions. When the Nixon administration severed
    the US dollar from the price of gold in 1971, allowing the dollar to float as
    a currency based on market demand, it eased the financing of larger fiscal and
    trade deficits faced by the Vietnam War. The gold-exchange standard been designed
    after World War II to safeguard global monetary stability. Nixon''s decision had
    short-term benefits, but longer-term risks. The five decades since have seen paralyzing
    vicissitudes in advanced economies (let alone emerging markets): stagflation in
    the seventies; a US real estate bust leading to savings and loan banking crisis
    in the eighties; a Scandinavian banking crisis in the early nineties; a European
    Exchange-Rate Mechanism currency crisis in 1992; the Japanese great stagnation
    and deflation since the nineties after the collapse of its real estate bubble;
