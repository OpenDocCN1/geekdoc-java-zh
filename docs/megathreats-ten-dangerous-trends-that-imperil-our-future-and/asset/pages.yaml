  md: '# # Chapter 5


    # # The Coming Great Stagflation


    Fears of economic misery conjure the Great Depression for most people.


    We teeter now on a different precipice: not depression, but stagflation. Recall
    the 1970s, a decade that featured bubbles, busts, an end to the global gold exchange
    standard, devaluation of the dollar, mounting debt, risky financial innovation,
    monetary and fiscal experimentation, and oil supply shocks driven by geopolitical
    shocks. It all culminated in double-digit inflation, stubborn unemployment and
    persistent recession. That is the corrosive condition known as stagflation, or
    stagnation with inflation.


    As economic headaches go, the seventies checked nearly every box. But who remembers
    all upheaval? The world since the seventies has looked very different, at least
    prior to the Great Recession of 2008. For thirty years, we faced brief and mild
    recessions and relatively quick rebounds. Even taking the Great Recession into
    account, we have enjoyed decades of robust employment and mostly positive growth,
    accompanied by low inflation. stream of innovations, globalization, immigration,
    weak labor and unions, and billions of workers from China, India, and other emerging
    markets helped improve productivity and kept a lid on prices.


    This congenial climate earned a label: the Great Moderation.


    After wrestling stagflation under control in the early 1980s, most experts expected
    the Great Moderation to last. The Federal Reserve could always turn the money
    supply spigot on or off to achieve desired results. Lower interest rates and looser
    credit could spur growth and avoid deflation. Higher interest rates and tighter
    credit could cool overheating, excessive growth, and rising inflation.


    “One of the most striking features of the economic landscape over the past twenty
    years or so has been a substantial decline in macroeconomic'
