    There are two types of macro-prudential intervention that the Fed thinks about.
    One is permanent. It says to build up walls of capital so that if the bubble bursts,
    banks will survive. It''s a way to brace for trouble. This is a structural approach
    to macro-prudential policy.


    The other approach is cyclical. It says that as the buildup and frothiness of
    private sector debt rises, we can curtail dangerous credit cycles by imposing
    greater restrictions on borrowing. The cyclical approach tries to decompress bubbles
    before they become volatile. It relies on precise timing—and always spurs a lively
    debate. Who can say if the peak is a week away, a month, or a year away? This
    makes regulators reluctant to intervene, not even the Federal Reserve, whose job
    has traditionally been to do just before the party gets too heated. Where booms
    and busts are concerned, structural solutions prevail.


    You might say that macro-prudential regulation favors drainage systems over floodgates.
    This is shortsighted and not sustainable.


