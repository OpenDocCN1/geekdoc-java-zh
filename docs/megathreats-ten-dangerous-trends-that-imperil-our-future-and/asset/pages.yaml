  md: '# Prologue


    Every day we face all kinds of risk. Some risks are relatively minor. We can err
    and still go on as before. If I invest $100 in a common stock, I can afford to
    lose some or all of that money. But if risks can cause serious and lasting harm,
    we call them threats. Buying a beach house on the edge of a cliff overlooking
    the ocean raises the stakes to threat level. Climate change, storms, and erosion
    at the base of the cliff a much larger investment—and possibly my life, if I am
    so foolish as to watch the cliff erode right up to my foundation.


    Individual decisions at least give us a say in our own fate. Choices get more
    complicated when they involve collective or societal risks, the domain of policy
    makers. Should a country go to war? Should a government bail out an industry?
    Should policy makers impose a high carbon tax to slow global climate change? For
    decisions like these, individual citizens have very limited input, but huge consequences
    can befall and all of us. Look no further than the 2008 Global Financial Crisis
    or a rambling pandemic response—as in COVID-19—to see how flawed policies drain
    bank accounts and impair the livelihoods and lives of millions. Collective responses
    are much harder than individual ones. It can be hard to even get a decision when
    policy makers disagree and squabble with one another, nationally or at the international
    level.


    As an economist, I observe risk and its consequences. In 2006 I saw stratospheric
    prices for houses, dangerous levels of mortgage debt, and overbuilding. New houses
    went begging for buyers. I warned that a historic bubble would soon burst and
    precipitate a global recession and financial crisis. Saying so in public venues
    me no friends. Mocking critics called me Dr. Doom. They dismissed my urgent calls
    for caution. When events unraveled as I foresaw, culminating in the Global Financial
    Crisis, housing prices crashed across the United States (and other countries with
    housing bubbles), with worldwide reverberations for financial institutions and'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'economies.


    Risks and threats lurk everywhere. But some are slow moving, and some are far
    more dangerous than others. Some of the most dangerous are also the slowest moving,
    which makes it especially hard to generate a collective response. In this book,
    I want to draw attention to the biggest threats face on our planet, whether they
    are moving or not, whether they will hit us very soon or a bit later. I call them
    “megathreats,” which I define as severe problems that could cause damage and misery
    and cannot be solved quickly or easily.


    I do not use megathreat to refer specifically to warfare, though wars do cause
    immense misery, as the recent and brutal Russian invasion of Ukraine has shown.
    Wars have happened for as long as history has been written, if not longer; some
    are local, some are global; some happen quickly; some drag for many years. But
    warfare is not a new challenge, and evading war is not my expertise, even if I
    will consider the geopolitical megathreats that could lead to war among great
    powers and cause severe human, economic, and financial impact. Instead, the megathreats
    that concern me are more economic, financial, political, geopolitical, trade,
    technological, health, and climate-based challenges. Some like the geopolitical
    ones, can lead to cold and eventually destructive wars. I wrote this book because
    I believe we are facing ten of them, of such immense scale and urgency that we
    need to look ahead with clear vision and do what we can to prevent them from destroying
    us.


    Memories fade, especially where economic discomfort is concerned. Apart from a
    handful of interruptions since World War II, the world has seen a long stretch
    of rising wealth, prosperity, peace, and productivity. For the past seventy-five
    years, we have enjoyed relative stability. Recessions have been, with a few exceptions,
    brief. Innovations have improved our quality of life. We have not experienced
    outright war among great powers. Each generation, in most nations, has been able
    to improve standards of living compared to their parents and grandparents’ generations.


    Unfortunately, this long stretch of relative prosperity is not likely to continue
    much longer. We are facing a regime change from a period of relative stability
    to an era of severe instability, conflict, and chaos. We are facing megathreats
    unlike anything we have faced before—and they are interconnected..'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'We totter now on a precipice, the ground shaking beneath us. Yet most of us
    still imagine that the future will resemble the past. That’s a whopping mistake.
    New warning signs look clear and compelling. Economic, financial, technological,
    trade, political, geopolitical, health, and environmental risks have morphed into
    something much bigger. Welcome to the era of megathats; they will alter the world
    we thought knew.


    We must learn to live on high alert. Economic and geopolitical certainties we
    once took for granted—from job security, to a sustainable and healthy planet,
    where most infectious diseases were conquered, and to peace among rival powers—are
    disappearing. The postwar decades of economic growth and rising prosperity, interrupted
    only briefly by stagflation and short-lived recessions, are at serious risk of
    giving way to economic and financial crises unlike anything we’ve seen since the
    Great Depression. Those crises will be made worse by climate change, demographic
    collapse, nationalist policies that curtail trade and migration, global competition
    between China (and its revisionist allies such as Russia, Iran, and North Korea)
    and the United States and its allies, and a technological revolution that will
    displace more jobs in less time than that has before.


    This book explores the ten key megathats bearing down us. Assembling them in one
    place reveals how they overlap and reinforce one another. There are links between
    debt accumulation and debt traps, easy money and financial crises, artificial
    intelligence (AI) and workplace automation, globalization, clashes among great
    powers, inflation and stagflation, currency meltdowns, income inequality and populism,
    global pandemics and climate change. Each hampers our ability to address the others.
    A single threat stresses distressing. Ten megathats happening at once is far,
    far worse.


    After examining each threat in its own chapter, I will consider our collective
    prospects for surviving them. Spoiler: without amazing luck, almost unprecedented
    economic growth, and unlikely global cooperation, this won’t end well. We are
    in way too deep.


    We are the authors of our own fate. Many of the megathats in this book arose from
    actions that looked at one time like solutions to particular problems: misguided
    financial deregulation and unconventional macroeconomic policies, carbon-emitting
    industrialization, the offshoring'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'of manufacturing jobs, the development of artificial intelligence, and empowering
    China to compete globally, among others.


    To combat the megathreats discussed in these pages, we must discard cherished
    assumptions that automating certain jobs will lead to new and better jobs elsewhere,
    as it often has in the past. We cannot assume that lowering tax rates, liberalizing
    trade, and reducing regulations will unleash economic energy that will benefit
    everyone. Every survival may hinge on subordinating individual freedoms to the
    common good, national and global. Failure to restore sustainable and inclusive
    growth could plunge us back into the tribal dark ages, when competing interests
    spurred endless national and global conflicts, to no one’s benefit.


    While this book takes a medium-term view of the megathreats that imper our future
    over the next two decades, these threats were clearly starting to manifest themselves
    already in 2022: the return of stagflation risks in advanced economies as inflation
    was rising sharply and the risk of recession increasing. The financial fragility
    and the risk of default of many highly indebted sovereigns and private sector
    actors as central banks were increasing interest rates to fight inflation. The
    bear market in global markets and the crash of numerous asset bubbles including
    the crypto ones, now that the era of cheap money was starting to reverse. The
    persistent tail and practice of deglobalization and fragmentation of the global
    economy; the Russian invasion of Ukraine and the risk that this conflict could
    expand geographically and in unconventional ways; the drumbeats of a new Cold
    War between the US (and its allies) and China (and the rising tensions between
    the US and China on Taiwan; the massive droughts and heat waves from India and
    Pakistan to Sub-Saharan Africa and to the West of the United States, as global
    climate change is becoming more severe; the Chinese growth slowdown and the risk
    of a hard landing given its misguided Zero Covid tolerance policy; a global pandemic
    that was not yet controlled in many poorer nations and likely to mutate in new
    variants; the risk of energy insecurity, of hunger, and even famines given the
    spike in food, energy, and other commodity prices. These were all ominous signs
    of a much worse and dangerous future and megathreats in the decade ahead. Indeed,
    by the spring of 2022, Kristalina Georgieva—the head of the ever-watchful International
    Monetary Fund—and two of her'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'colleagues stated with alarm that the world economy is on the verge of “perhaps
    its biggest test since the Second World War” and that “we face a potential confluence
    of calamities.”¹


    I would rather sound bullish on our future prospects, reporting that stocks will
    rise, earnings will grow, incomes and jobs will increase, nations will flourish
    as peace and democracy expand globally, that sustainable and inclusive growth
    will emerge, and global agreements will set rules that are fair for and accepted
    by everyone. I wish I could predict that. But I cannot. Change is coming, like
    it or not. The megathreats we face will reshape our world. If you want to survive,
    do not be taken by surprise.'
