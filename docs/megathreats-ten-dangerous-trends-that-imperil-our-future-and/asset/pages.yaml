  md: '# Chapter 8


    # The AI Threat


    I have argued that technological progress does not, in the aggregate, destroy
    jobs. But what happens when technology is actually intelligent? As science fiction
    and reality merge in the realm of artificial intelligence, machine learning, robotics,
    and automation, for a cruel twist on the hopes and dreams of inventors ever since
    the first “mechanical assistants.” No matter what work you do, artificial intelligence
    might eventually do it better. Will modern Luddites, for the first time since
    the original Luddites, finally be correct? The possibility is very real that a
    tiny echelon win while everybody loses their jobs, their incomes, and their dignity.
    Mary Shelley’s Frankenstein palest next to this turning megathreat.


    Until very recently the burden of proof stymied believers in the transformative
    power of artificial intelligence, or AI. A so-called AI winter prevailed during
    the 1980s and 1990s, as progress was painfully slow and seemed to support skeptics
    who maintained that computers could never match, much less exceed, je ne sais
    quoi of human intellectual prowess. Machines improved doing repetitive things,
    deep thinking appearing to remain an exclusively human dimension.


    Debate still persists, but the gap between organic and artificial intelligence
    has decisively narrowed. Algorithms often ask humans if we are robots before granting
    access to sensitive websites. By some accounts the gap will soon vanish. More
    pressure these days compels skeptics to name tasks that computers can never do—from
    bricklaying to neurosurgery. But even with bricklaying, why couldn’t a robot handle
    it, as there are already AI and 3D technologies printing prefab homes that can
    build walls faster than any bricklayer?


    Every boost in computing speed and capacity shortens the list.'
