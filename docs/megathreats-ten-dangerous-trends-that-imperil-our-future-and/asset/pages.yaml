    The period of relative prosperity that we have enjoyed ever since World War II
    is well well described by the history of my own family, representative of many
    others around the world. In search of opportunity, my family migrated in the 1950s
    from Turkey to Iran, and then to Israel, before settling in Milan, Italy, in 1962.
    We arrived as an Italian “Economic Miracle” was in full swing, enabling a new
    middle class to flourish. My father built an import-export business. To be sure,
    there was turmoil amidst the Class conflict and episodes of domestic terrorism
    garnered frequent headlines. About a third of Italian voters embraced a Communist
    Party.


    As a teenager, I was drawn to works by left-leaning intellectuals. Karl Marx steered
    me toward the field of economics before I learned about John Maynard Keynes. The
    philosopher Herbert Marcus, who fought Germany when the Nazis gained control and
    later became a hero to the new left, introduced me to the tumultuous intersection
    of economics, political theory, and the theory of socioeconomic alienation. Yet
    overall, it was a time of rising prosperity in Italy and throughout the West.


    The 1970s challenged my assumptions about stability and risk. Italy’s economic
    engine stalled. Governments came and went amid recession, inflation, and stagflation.
    The 1973 Yom Kippur War and the 1979 Islamic Revolution in Iran raised anxieties
