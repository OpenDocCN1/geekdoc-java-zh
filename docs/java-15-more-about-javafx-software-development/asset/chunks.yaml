    ## 2.3 Binding observable collections


    There is a class `ListProperty` that represents a property for an `ObservableList`,
    and you can think of the class as a wrapper for `ObservableList`. It is a property
    type similar to other properties presented in this chapter. You can associate
    three kinds of listeners with `ListProperty`:


    * `InvalidationListener`

    * `ChangeListener`

    * `ListChangeListener`


    and these listeners will receive notifications when the `ObservableList` is changed.
    Consider the following method:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_36.jpg)


    The method creates a `ListProperty` named `property` as a `SimpleListProperty`,
    which wrapper an `ObservableList`. In addition, an `integerProperty` is defined
    with name `count`, and it is bounded to the list’s size. Here, you should note
    that `ListProperty` implements the `ObservableList` interface and therefore has
    the same properties as `ObservableList`. `property` therefore has a `sizeProperty`
    which is an `IntegerProperty` and can therefore be bounded to `count`. The next
    print statement will therefore print 0 on the screen as the list is currently
    empty. As the next step, the listener methods are defined for the three events.
    The first one is trivial and does nothing but prints a text:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_37.jpg)


    You must note the parameter and that it is an `Observable`. The next listener
    method is also trivial and it prints the contents of the list before and after
    it has been changed:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_371.jpg)


    You should primarily note the parameters that are a reference to the list (the
    object that caused the event in question) and the list’s value before the change
    and its value after the change. The last event handler does nothing but prints
    a text (possibly more), but distinguishes the reason for the event:


