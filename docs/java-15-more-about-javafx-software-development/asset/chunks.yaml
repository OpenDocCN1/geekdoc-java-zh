    is that 4 event handlers are assigned to each control, since both controls can
    be both source and target gesture nodes.


    The methods (there are 4) that the event handlers call has a parameter that tells
    what it is for a *ListView* that the event concerns. *dragDetected()* initiates
    a drag operation, and you must note that its mode is *COPY_OR_MOVE* so that it
    can be used in either case. You start a *COPY* operation by pressing the mouse
    button, if you also holding down the *SHIFT* key, it is a MOVE operation. *dragDetected()*
    uses the method *getSelectedItems()* to return the *Person* objects that are selected,
    and it is this list of objects that is placed on the clipboard. *dragOver()* and
    *dragDropped()* appear as shown in the two previous examples but note how *dragDropped()*
    using the *PERSON_LIST* object tests whether it is data of the correct kind that
    ara located on the clipboard before the list is copied to the target *ListView*
    component. Finally, there is the method *dragDone()* that tests whether it is
    a *MOVE* operation, and if necessary, the objects that are moved will be deleted
    from the source node.


    # 5 MVC


    I have treated the *Module-View-Controller* pattern earlier, which is the design
    pattern of a GUI program, and in this context, I also mentioned that there are
    several versions of the pattern, partly because of the development tools used,
    but also on due to the API used. Should you use JavaFX fully, you should use the
    *Module-View-Presenter* pattern, which you sometimes see shortened as *MVP*. The
    pattern can be sketched as follows:


    ![](image/Image2043.jpg)


    The principle is that the program’s view takes care of everything regarding the
    visual, but can turn to the model to get the data to be displayed. The user interaction
    takes place in the view layer, but when there is a user interaction, it is sent
    to the presenter module, which takes care of it. That is, a window’s event handlers
    are placed a presenter class that as a result can update the view component and
    execute commands on the model. When the model is updated as a result of commands
    from the present, it can send notifications, which the view component can listen
    to and possibly read the model to ensure the synchronization between model and
    view.


    It’s the principle, and in fact, is not very different than I’ve previously mentioned
    about MVC, just the pattern is drawn in a way that directly supports JavaFX. Another
    thing, however, is what it means in the code, and especially who is responsible
    for creating the individual objects, and it is best illustrated with an example.


    Looking at the previous examples in this book, they basically had a 2 layer architecture
    consisting of a view layer and a model layer. The most important thing in the
    above pattern is actually a more accurate breakdown of the view layer in a view
    component and a presenter component. The goal of all is to make the code as simple
    and manageable as possible, and even as the most important thing to ensure that
    GUI programs are written in a standardized manner, and one of the patterns that
    JavaFX recommends is a systematic use of data binding. In previous books, I have
    used a database *addresses* that only have a single table:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_135.jpg)'
