    ## 2.2 可观察集合


    JavaFX 定义了多种集合，它们是经典集合类的扩展。定义了三个接口：


    * `ObservableList<T>`

    * `ObservableSet<T>`

    * `ObservableMap<K,V>`


    它们分别继承了 `List<T>`、`Set<T>` 和 `Map<K, V>`，同时也继承了 `Observable` 接口。JavaFX 并没有直接提供实现这些接口的类，而是通过
    `FXCollections` 类提供的静态方法来获取，这些方法返回实现了这些接口的对象。从程序员的角度来看，可观察集合是一个列表、集合或映射，可以对其内容的失效和变化进行观察。


