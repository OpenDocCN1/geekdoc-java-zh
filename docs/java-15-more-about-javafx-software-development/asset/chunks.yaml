    As another example, the `test07()` opens the following window:


    ![](image/Image1782.jpg)


    which includes a `Slider`, a `Label` and three `Button` controls. Here, the `Slider`
    component is bound to the property `step` in the `Counter` with a bidirectional
    binding while the `Label` component is bound to the property `value` in the `Counter`
    with a unidirectional binding:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_25.jpg)


    A `Label` control has a `StringProperty` property `textProperty`, and a `Counter`
    has a `valueProperty` of the type `ReadOnlyIntegerWrapper`. Since the latter is
    read-only, you can not of course create a bidirectional binding, but `ReadOnlyIntegerWrapper`
    has an `asString()` method, which returns a `StringBinding` object, and allows
    it to create a unidirectional binding. The result is that if the property `value`
    in the `Counter` object changes (clicking the `Down` and `Up` buttons), then the
    `Label` object will automatically be updated. A `Slider` control has a `valueProperty`
    of the type `IntegerProperty`, and the same applies to the class `Counter`, which
    has a `stepProperty` of the same type. You can therefore create a bidirectional
    binding between these two properties. The result is that if you change the slider,
    the `Counter` object’s step property is updated. If you click the `Reset` button,
    it sets the value of `step` to 1, and since the slider binding is bidirectional,
    the slider component is automatically updated.


