    # 7 JavaFX 与并发


    Java GUI 应用程序通常是多线程的，类似于 Swing，JavaFX 使用一个特殊的线程来更新用户界面。这个线程被称为 `JavaFX Application
    Thread`。由于场景图中的所有节点都不是安全的（出于性能考虑），你面临着在 Swing 中熟悉的同样的挑战：你不能从另一个线程更新它们，而应该通过在 `JavaFX
    Application Thread` 中调用方法来实现。在本章中，我想展示 JavaFX 提供了哪些功能来简化操作。程序 `UpdateGUI` 打开了以下窗口：


    ![](img/Image2095.jpg)


    如果你点击 `Start` 按钮，程序将启动一个耗时很长的方法，在方法完成后，顶部的标签将会更新。点击 `Clear` 按钮会删除顶部标签的内容。如果你在顶部单选按钮被按下状态下尝试程序，你会发现点击
    `Clear` 按钮时什么都没有发生——至少在 `Start` 按钮启动的方法完成之前是这样。用户体验到程序“卡死”了。解决方案当然是在自己的线程中执行那个耗时的方法。按下中间单选按钮并再次点击
    *Start* 会在后台线程执行该方法，但现在你得到了异常。原因是后台线程尝试更新 `JavaFX Application Thread`，这引发了异常。另一方面，按下底部单选按钮并再次点击
    *Start*，它将按预期方式运行，顶部标签会定期更新，并且你可以随时点击 `Clear` 按钮删除该标签。


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_153.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_154.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_155.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_156.jpg)


    要执行的方法在 `work1()` 和 `work2()` 中执行，它们都分别执行 `calculate()` 方法 10 次。在每次执行方法之前，程序的标签都会更新。`calculate()`
    没有执行任何有趣的内容，但它执行了大量耗时的计算，目标是让它成为持续使用机器处理器的方法。

