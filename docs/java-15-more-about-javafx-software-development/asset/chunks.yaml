    There is not much to note, but you must note the last statement, which is a comment,
    and the statement can not actually be translated, since `valueProperty()` returns
    a read-only property and therefore does not have a `set()` method.


    ### Property Class


    A property class encapsulates three values:


    1. a reference to the bean, that the property belongs to

    2. a name, that is only a `String`

    3. a value


    and the class has constructors, so you can initialize these values as desired.
    For example, for the class `SimpleIntegerProperty`:


    * `SimpleIntegerProperty()`

    * `SimpleIntegerProperty(int value)`

    * `SimpleIntegerProperty(Object bean, String name)`

    * `SimpleIntegerProperty(Object bean, String name, int value)`


    and a property has a `getBean()` and a `getName()` method. To show another example
    of the pattern that JavaFX uses regarding properties, below is shown a class,
    which is a normal bean:


    ```

    ![](image/Java_15_–_More_about_JavaFX_5-4-18_14.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_15.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_16.jpg

    ```


    The class has three properties, the first being a read-only property, while the
    others are read/write properties. You should note that in JavaFX, properties are
    not created as primitive types, but as `Property` objects. You define `get` and
    `set` methods in the usual way and with the same names convention for what is
    standard for Java beans. You should note how these methods refer to the individual
    properties, and that they are defined final. It is part of the pattern that JavaFX
    uses. For each property, a method is also defined that returns the actual property
    object, such as `fromProperty()`. It is also a part of the pattern. Finally, you
    should note that `name` is a read-only property and therefore has no set method.
    Also note that the method `nameProperty()` returns a `ReadOnlyStringWrapper` and
    not a `StringProperty`.


    That properties as illustrated above are class types means that many objects must
    be instantiated. The reason that a property is defined as an object type is a
    number of advanced features that are associated with a property (as fire events
    and binding), but often they are not used, and therefore JavaFX uses largely *lazy
    updating*, where an object is first instantiated when needed. The principle can
    be illustrated with the class `King` as follows:


    ```

    ![](image/Java_15_–_More_about_JavaFX_5-4-18_161.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_17.jpg

    ```


    where the class now has an additional property, representing the name of the country
    from where the king is from. If the vast majority of kings come from Denmark,
    and when you only need to read this value, it is not appropriate (for the sake
    of performance) to instantiate a `Property` object for each `King` object. Therefore,
    the variable `country` from the start is `null` and an object is first instantiated
