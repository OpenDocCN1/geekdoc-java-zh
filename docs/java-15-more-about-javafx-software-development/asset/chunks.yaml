    The above code can be difficult to understand, but if you think on, that a `TreeTableView`,
    like a `TableView` and an `TreeView`, is based on a data model and where the model
    (for a `TreeTableView`) should organize data in a hierarchy and define the individual
    columns then it’s not that bad again and happily happening the same way every
    time. Have you first written the model, then the rest goes by itself, and for
    this example is the code of the method `start()`:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_109.jpg)


    ## 3.7 A TreeTableView, an extended example


    ![](image/Image1995.jpg)


    To conclude this chapter, I will show an example similar to the above, but showing
    countries created in the database `padata`, where you can also edit the countries,
    create new and delete a country, but such that a country is edited inline, as
    shown for a `TableView` in the example `EditPersonProgram`. The current example
    is called `UpdateCountriesProgram` and opens the above window, where the row with
    the name `Other countries` contains the countries from the database that are not
    located under a continent and where the column `Code` displays the country code
    with three characters. In fact, the model actually has two more columns, showing
    the country code as two characters, and partly showing the currency code. In order
    to simplify the program a bit, I have not loaded the table of currencies from
    the database and the program therefore does not validate the codes that are entered.
    If you enter a none existing currency code, that country can not be updated due
    to the foreign key in the database. Therefore, the column is hidden by default.


    In fact, it’s not easy to edit the content of the individual cells in a `TreeTableView`,
    and the result easily leads to many lines of code, as is the case in the current
    example – and it does not even work anywhere. I do not want to show the code here,
    but just highlight the key things that you should be aware of when studying the
    code.


    The class `World` is unchanged compared to the previous examples. The class `Country`,
    on the other hand, has changed a bit, consisting of adding a property `code3`
    to the country code of three characters, and then the type for the two properties
    `area` and `inhabitants` are changed to `Long`. The reason is that the world’s
    population is so large that it can not be represented by an `int`.


    The class `Model` is similar to the corresponding class in the program `UpdateWorldProgram`,
    but with the difference that, as mentioned, that this time it did not include
    the database table `currency`. The class has as previously a method `load()`,
    which loads the two tables `world` and `country` and creates two `ObservableList`
    objects for these data. This time, a `ListChangeListener` has been added to the
    list of countries that observe events regarding changes to list contents:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_1111.jpg)


    This event handler is used to update the database, and thus, as in the program
    `UpdateWorldProgram`, a batch update is not used, which uncritically writes all
    countries back to the database. In the current application, physical data is written
    to the database each time a new country is added, each time a country is deleted
    and each time a cell is changed. If there are many changes, it is not necessarily
    a good solution as it can lead to many write-ups to the database.


    Then there is the class `CountriesModel`, which is the most complex and then also
    the largest of the program’s classes. Basically, the class looks like the corresponding
    class in `ShowCountriesProgram` and creates the data model for the `TreeTableView`
    component and hence methods that creates the individual columns. The first two
    do not add anything new, but the method `getNameCol()` has this time a `CellFactory`,
    as you can edit the contents of a cell. It is basically a `TextFieldTreeTableCell`,
    and the effect is to open a `TextField` when you double-click the cell. In this
    case, however, there is an additional challenge as not all names are editable
    and therefore I have defined my own `CellFactory`:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_1121.jpg)


    The syntax does not look nice, but here you have to remember that a `CellFactory`
    is just a class that implements a `Callback` interface and hence the method `call()`.
    The class creates a `TextFieldTreeTableCell` used to edit the content. The method
    `call()` is performed every time a cell becomes visual and it has a handler that
    primarily checks whether the cell represents an object for a country and not a
    continent and sets the cell’s editable property accordingly.


    The next method `getAreaCol()` works almost the same as `getNameCol()`, but another
    `TextFieldTreeTableCell` is used, as this time you have to edit a `Long`. The
    type is `LongFactory` and is in principle identical to `StringFactory`. Finally,
    the method also uses a `CellValueFactory` (because of the sum of all child nodes
    areas), but it is the same class as in the previous program. The `getInhabitantsCol()`
    method is in principle identical.


    The method `getCurrencyCol()` works in the same way as `getNameCol()`, but the
    method `getWorldCol()` is a bit different. When you click on a cell, you must
    have a combobox so you can choose a continent. It has the type `ComboBoxTreeTableCell`
    and must as parameter have the items to display. The object `CellFactory` now
    has the type `WorldFactory`, and except that `ComboBoxTreeTableCell` is used instead
    of `TextFieldTreeTableCell`, the class is basically identical to the other two
    `CellFactory` classes. However, the `getWorldCol()` method requires extra action,
    as a change in a country means that the corresponding node must be moved in the
    tree (see, if applicable, `UpdateWorldProgram`). This is solved by associating
    an event handler for `editSubmit`, which takes care of what is needed. Back there
    are two classes, though both are simple and at least do not add anything new.
    The class `CountryDialog` is a dialog box and is used when creating a new country.
    The reason is that a country with a name and legal country codes must be created.
    Back is the main program, which does not contain anything new, but you should
    note that in order to create a country (and thus click on the `Add` button), the
    continent for which the country is to be created must be selected. Similarly,
    to delete a country you must select the country you want to delete.


    # 4. Drag and drop


    JavaFX supports direct drag and drop, such the functionality is built into both
    a `Scene` and a `Node` object. You are talking about the operation as a `press-drag-release
    gesture`, which means that the user holds one of the mouse’s buttons down, drags
    the mouse and releases the mouse again to complete the operation. A gesture can
    be started of the `Scene` object or on any `Node` object, called the source object,
    and a gesture can include several objects (`Nodes`). During the operation, several
    events are firing and the use of these events depends on the purpose of the current
    gesture, which may be:


    1. That you want to change a node’s shape by dragging its perimeter or by dragging
    it to another location. In this gesture, only the node that initiates the operation
    is involved.

    2. That you want to draw a source and drop it to another node (target) and in
