    # Java 15: 深入 JavaFX


    ### Poul Klausen

    软件开发

    Java 15: 深入 JavaFX：软件开发

    第 1 版

    © 2018 Poul Klausen & [bookboon.com](http://bookboon.com)

    ISBN 978-87-403-2200-2

    由 Ove Thomsen, EA Dania 进行同行评审


    ## 前言


    本书是软件开发系列书籍中的第十五本，它是之前关于使用 `JavaFX` 编写 GUI 应用程序书籍的自然延续。本书主要关注 `JavaFX` 属性和数据绑定，同时也将
    `JavaFX` 应用的基本架构视为模型-视图-演示器（Model-View-Presenter）。其他重要主题包括 `TableView` 和 `TreeView`
    等高级控件，还提到了图表和 3D 图形。本书要求具备与 `Java 14` 书中内容对应的 `JavaFX` 知识。在阅读本书并完成相应的练习和任务后，你应该能够使用
    `JavaFX` 编写完整的 GUI 应用程序，并将 `JavaFX` 作为 `Swing` 的替代方案。


    正如标题所示，这一系列书籍涉及软件开发，目标是教读者如何用 `Java` 开发应用程序。这可以通过阅读相关主题和学习完整的示例程序来掌握，但最重要的是亲自动实践并从零开始编写自己的程序。因此，书中一个重要部分是练习和问题，读者必须编写与书中处理的内容相对应的程序。该系列的所有书籍都围绕同一个骨架构建，由文本、示例、练习和问题组成，这些内容被自然地放置在文中。练习与问题的区别在于，练习很大程度上是对文中介绍内容的重复，并且对做什么描述得相对准确。而问题的描述则较为松散，通常规模更大，且很少有明确的最佳解决方案。这些书是要从头到尾阅读的，但大量的代码示例（包括练习和问题）起着核心作用，让读者详细地研究许多示例的代码，并解决练习和问题，或者只是研究推荐的解决方案，这是非常重要的。


    所有书籍都以一两个较大的示例程序结束，重点主要在于过程以及对程序如何编写的解释。另一方面，代码仅在有限范围内出现——如果有的话——读者应该可能在测试程序时来学习完成的程序代码。除了所展示的比示例更大的程序开发外，结束示例的目的还在展示来自不同应用领域的程序示例。


    大多数书籍还以附录结束，处理书中未涉及的主题。这可能是关于软件安装的问题或其他计算机技术的主题，这些主题不属于软件开发，但有必要具备基础知识。如果读者已经熟悉该主题，可以跳过当前附录。


    编程语言如前所述为 `Java`，此外书中还使用了以下产品：


    1. `NetBeans` 作为应用程序开发的 IDE

    2. `MySQL` 在需要数据库服务器时视情况使用（从 `Java 6` 书籍开始）

    3. `GlassFish` 作为 Web 服务器和应用服务器（从 `Java 11` 书籍开始）


    这些产品都是免费且免费安装的，甚至提到了某些产品的安装可以自动完成，不需要费大的努力和挑战。此外，网上有所有这三个产品的详细安装说明。这些产品适用于 Windows
    和 Linux，因此无论你使用 Linux 还是 Windows，并不会产生特殊影响。


    所有示例程序都是在运行 Linux 的机器上开发和测试的。事实上，这并没有什么主要影响，因为无论平台是哪一个，`Java` 和其他产品的工作方式完全相同。书中某些地方可能会显示平台是
    Linux，这主要适用于涉及文件系统的命令。对于读者来说，程序在 Linux 机器上开发并没有特殊意义，它们也可以立即在 Windows 下运行，除非程序引用了文件系统，此时可能需要更改文件名。


    最后，简单介绍一下这些书不是什么。它们不是 `Java` 的“如何编写”指南，或者说不是参考手册，而是正如标题所示，是关于软件开发的书籍。我希望读者在阅读书籍并通过大量示例时，能够找到编写良好程序的灵感，也可以将其作为解决方案的集合，针对你作为软件开发者经常面对的具体日常编程问题提供许多示例。


    ## 1 引言


    本书是之前关于 `JavaFX` 书籍的直接延续，由于页数限制或主题更具技术性，以下内容未包含在：


    *   属性和数据绑定

    *   高级控件

    *   拖放操作

    *   架构和 MVC

    *   用户自定义控件

    *   JavaFX 与并发

    *   3D 形状

    *   图表

    *   最后的示例


    你也可以说，本书完善了编写图形用户界面的 Java 桌面应用程序所需的内容。


    如上述列表所示，本书包含了许多主题，但除了第一个关于属性和绑定的主题外，各个主题之间互不影响，你可以根据当前需求阅读这些主题。因此，本书应该通过示例展示如何解决具体问题，与之前的书籍相比，练习只有少数几个。


    ## 2 JavaFX 属性


    在之前的书籍中已多次提到属性（Properties）和 Bean，`JavaFX` 中的所有类都定义了程序员可以读取或修改的属性。在典型的 Bean 中，属性无非是
    `get` 方法和可能的 `set` 方法，表示当前类的属性，并通常对应于一个关联有 `get` 和 `set` 方法的变量。此外，Java Bean 使用特定的命名规范。然而，在
    JavaFX 中，属性要多出一些，这在某些时候是必要的。JavaFX 中的所有属性都是可观察的，观察者可以接收有关失效（invalidation）和更改的通知。读写属性和只读属性之间有严格的区别。属性的值可以是单个值，也可以是一个集合。


    另一个重要区别是属性始终是一个对象，其类属于特定的属性类层次。示例可以提到 `IntegerProperty`、`DoubleProperty`（其他简单数据类型也有相应的类）。这些类实际上是抽象类，对于每个类都有两个具体的类，对于
    `IntegerProperty` 来说是 `SimpleIntegerProperty` 和 `ReadOnlyIntegerWrapper`，前者表示读写属性，后者表示只读属性。属性类像通常一样定义
    `get` 和 `set` 方法，但该类还定义了两个名为 `getValue()` 和 `setValue()` 方法。对于基本类型，`get` 和 `set`
    方法作用于基本类型（*int*、*double* 等），而另外两个作用于对象（如 *Integer*、*Double* 等）。对于 `StringProperty`、`ObjectProperty<T>`
    等引用类型，所有四个方法都作用于对象，由于自动装箱，在实际操作中没有区别，例如 `get` 和 `getValue()`。作为示例，下面显示了一个创建读写
    `IntegerProperty` 的方法。


    '
