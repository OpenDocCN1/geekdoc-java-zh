- fmt: '

    In principle, it is quite simple to implement these functions and requires only
    simple changes in the two classes `AxisModel` and `AxesModel` and, of course,
    changes in the class `MainPresenter`, so that event handlers are associated.


    However, there is a single challenge to be solved. Until this place it is assumed
    that the two axes intersect at the center of the window. It does not work if it’s
    possible to zoom, and more generally if you change the smallest and greatest values
    of the axes. It is necessary to change both in the `Axes` class and the class
    `Plot`, so they take into account that the coordinate system’s origin is not necessarily
    centered in the window.


    ## 10.11 Implementing the Edit menu


    This menu must have 4 menu items:


    * `Undo`

    * `Redo`

    * `Screen clip`

    * `Axes`


    Here is the last the function for maintaining the coordinate system’s axes and
    thus the same function implemented on one of the toolbar buttons. The `Screen
    clip` feature is one of the program’s most important functions and is one of the
    goals of the entire application. The function, on the other hand, is simple to
    implement, as JavaFX offers it all:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_214.jpg)


    A `Node` – and here it is a `StackPane` – has a method `snapshot()` which simply
    takes a picture of the component. In fact, it is a PNG image and the image can
    be placed immediately on the clipboard.


    Then there are the other two features, and on the other hand, it is not simple.
    For some reasons, JavaFX does not support Undo/Redo, but it must be assumed that
    it will be included in later versions of the API. One can find more open source
    APIs for Undo/Redo online, and it may be a good task to replace the following
    with one of these APIs. On the other hand, it is not entirely easy, partly because
    the APIs in question may not be comprehensive enough, and partly because they
    can be so general that it is in itself a piece of work to learn how they are used.
    In this case, I have solved the problem by programming the necessary from scratch.
    In fact, it is not particularly difficult, but the problem is of course that it
    is not modifiable and can not immediately be used in other programs.


    In principle, Undo/Redo is about when you perform an operation in the program,
    it is simultaneously stored on a stack, and if you executes an Undo (keys `Ctrl
    + Z`), the operation must be rolled back and then placed on the redo stack. Redo
    (when keying `Ctrl + Y`) basically happens in the same way, just do not undo the
    operation but instead restore it and move it over to the undo stack. For so long
    it’s all simple, but there are two outstanding problems:


    1. What is an operation – what is it you should be able to undo and redo?

    2. What should be pushed on the stack?


    In this case, it has been decided that the operations to be rolled back are:


    * Change the coordinate system’s settings – an `AxesModel` object

    * Add a new function – an `ExpressionModel` object

    * Change a function – an `ExpressionModel` object

    * Delete a function – an `ExpressionModel` object

    * Add a new plot to the graph – an object of the type `PlotModel`

    * Changing a plot – an object of the type `PlotModel`

    * Delete a plot – an object of the type `PlotModel`

    * Change a function’s tangent – an `OberservableList object<LineModel>` object

    * Changing the vertical lines of the graph – an `OberservableList object<LineModel>`
    object

    * Add a hatching to a function – an object of the type `HatchModel`

    * Change a function’s hatching – an object of the type `HatchModel`

    * Delete a function’s hatching – an object of the type `HatchModel`


    These possible operations (the operations to be saved for undo) are defined using
    the following enumeration:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_215.jpg)


    An Undo / Redo operation is then defined as follows:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_2151.jpg)


    and you can thus save any object, but with an indication of which operation the
    object is about. Back is the `UndoManager` class as the class that saves the operations
    and performs an `undo()` or a `redo()`:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_216.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_217.jpg)


    The class is written as a singleton, and the entire work is in the private method
    `doOperation()`, where there is a `case` entry for every possible operation.


    Each time the program performs an operation, it must be saved and thus the method
    `add()` above must be performed. It happens in the presenter classes of the individual
    dialog boxes, where copies of the individual operations are wrapped in `GraphOperation`
    objects that are then pushed on the undo stack. When you want to perform an undo
    or redo either by clicking the menu or by pressing `Ctrl+Z` or `Ctrl+Y`, the corresponding
    method is executed in the class `UndoManager`.


    ## 10.12 Implementing the Calculations menu


    It’s a very simple iteration as this menu only should have a single function:


    * `Function table`


    The idea is that the menu will later be expanded with other functions. The current
    function opens a window for a particular function, within an interval:


    ![](image/4457.jpg)


    Implementation of the above dialog box: `TableView` and `FuncPresenter`, as well
    as other functions.


    ## 10.13 Implementing the File menu


    This iteration includes the last menu that must have 5 functions:


    * `New`

    * `Open`

    * `Save`

    * `Save as`

    * `Exit`


    Here is the last trivial, while the top three are also assigned to buttons in
    the toolbar. The goal is that it should be possible to save a drawing and later
    re-load the drawing. Since the program is a tool that should be easy to install,
    drawings must not be saved in a database, but in ordinary files. Here are four
    options:


    1. to save drawings as JSON documents

    2. to save drawings as XML documents

    3. to save the drawings by conventional object serialization

    4. to save drawings in a custom format


    Here is the first the most obvious, as JSON does not fill up much, is a standard
    and is text and can be read by everyone and thus other programs. It requires that
    a `Model` object can be converted to JSON, and that the JSON text again can create
    a Java object. There are open source APIs that can do that and examples are `GSON`
    and `Jackson`, which are both excellent products. Unfortunately, they do not work
    in the current case, and the reason is that it is a deep and complex object structure,
    but primarily that JavaFX is causing problems. Both products outline solutions
    that more or less solve the problems. It is apparently not quite simple, but one
    expects that future versions can be used directly. Because of that, I have abandoned
    using JSON.


    As for XML, it’s a bit the same, and the benefits are the same except that XML
    fills a lot. Also here are finished products that can be used, and `JAXB` is even
    an integral part of Java. If you often need to work with XML documents, it may
    be worth learning JAXB, and it would be a good job to replace the following with
    XML.


    Storing drawings using object serialization is not appropriate in this case. Among
    other things, at the start of the project, I mentioned that it was not desirable,
    but in fact it also gives a problem to JavaFX, as properties and other JavaFX
    types are not serializable. At least, serialization of objects would require some
    extra work.

