    Read-only properties are actually a bit more complex as they are a wrapper about
    two properties that the system ensures is synchronized. Here, the one is a read-only
    property, while the other is a read/write. The idea is that from the outside it
    is a read-only property, but it can be changed internally from the class in which
    it is defined, and the application is typical as a private instance variable.


    As an example, below is shown a class with two JavaFX properties:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_112.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_12.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_13.jpg)


    This is an example of a JavaFX bean. The two properties are called `step` and
    `value` and are a read/write property and a read-only property. For both properties
    is defined a method that returns the value, for example:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_131.jpg)


    Here you should note the name conventions, which is the name followed by the word
    property, and furthermore that it is defined final. Finally, there are defined
    common `get` and `set` methods (which are also defined final). In principle, they
    are not necessary, but it is also part of the convention, to be in accordance
    with the usual Java beans convention. You should note that the methods `increase()`
    and `decrease()` perform a set method on the property `value` – even if it is
    readonly. That’s okay, because it takes place internally in the class `Counter`.
    Below is a method that uses the class:


    ```

    ![](image/Java_15_–_More_about_JavaFX_5-4-18_132.jpg

