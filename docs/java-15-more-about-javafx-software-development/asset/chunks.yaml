    `dragDone()` 方法并非总是必要的，但在这种情况下，它会测试是否为一次 `Move`（移动）操作，如果是，则该方法负责删除 `Label` 组件（即源节点）中的文本。当用户将鼠标悬过目标节点时，会执行
    `dragOver()` 方法。该方法会测试剪贴板上是否有内容，如果是，则执行 `acceptTransferModes()`，这意味着光标会发生，这样你就可以直观地看到自己正悬浮在一个可以放置物品的节点上。


    最后，是 `dragDropped()` 方法。在这种情况下，它会开始测试剪贴板上是否有字符串，如果是，则获取文本并更新标签组件的文本。然后执行 `dropCompleted()`
    方法，向源节点发送通知，表示操作已完成。在离开程序之前，你还应该注意 `reset()` 方法，它被用作按钮的事件处理器，并用于切换模式等操作，因此下一次拖放操作可能是一个
    `Move` 手势。


    在接下来的示例中，我将向你展示如何将图像拖入应用程序，该图像既可以是图片，也可以是包含图像的文件。也就是说，你可以从另一个程序（例如 `Files` 程序）将一个代表图像的数据元素拖到当前应用程序中。该示例名为
    `ImageDnD`，它会打开以下窗口，该窗口包含一个按钮和一个 `ImageView` ：


    ![](img/Image2019.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_125.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_126.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_127.jpg)


    创建程序视图的 `createRoot()` 方法没有包含任何新内容，任务是初始化 `ImageView` 控制器。但注意，按钮被分配了一个事件处理器，它会删除
    `ImageView` 组件的内容。`start()` 方法为 `Scene` 对象分配了两个事件处理器，这意味着你可以在应用程序窗口中放置对象。这里只有两个处理器，因为这次程序没有源手势节点——拖放操作是在另一个应用程序中发起的。`dragOver()`
    的功能与上一个示例相同，你应该注意如何测试剪贴板是否包含程序可以接受的数据元素。这在 `dragDropped()` 方法中同样会被测试，并根据数据项的类型（图像或文件），调用执行数据传输的方法。在这里，你应该特别注意
    `transferImageFile()` 方法及其使用的语法。这意味着必须使用文件名从文件中加载该图像。


    作为拖放的最后一个示例，我将展示一个你可以在其中拖动自定义类型对象的程序。该示例名为 `PersonDnD`，并打开以下窗口：


    ![](img/Image2030.jpg)


    窗口包含两个 `ListView` 控制器。左侧 `ListView` 中的每一行代表一个 `Person` 对象，这些对象可以通过拖放手势拖到右侧。同样，你也可以将右侧的对象拖到左侧。`Person`
    对象是一个非常常见的模型类，代表一个具有两个特征的人：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_128.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_129.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_130.jpg)


    只有一个需要观察的地方，即该类是可序列化的（serializable）。这是对象用于拖放手势中的前提条件。同样注意，这意味着类的实例变量类型必须是可序列化的。`PersonDnD`
    类如下：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_1301.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_1311.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_1321.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_133.jpg)


    自定义类型无法直接通过剪贴板传输，因为它们没有已知的 MIME 类型。这意味着目标节点无法测试剪贴板上的内容。因此，程序开始时创建一个类型为 `DataFormat`
    名为 `PERSON_LIST` 的静态对象。该值并不重要，它只需要是一个对于程序而言唯一的名称。`getRoot()` 方法填充一部分内容，并且必须初始化左侧的
    `ListView` 以 6 个 `Person` 对象。这些对象是在 `getPersons()` 方法中创建的，但我没有显示代码。注意，对于两个 `ListView`
    控制器，都选择了 `MULTIPLE`，这样用户可以选择多个 `Person` 对象。然而，最重要的是每个控制器都分配了 4 个事件处理器，因为这两个控制器都可以作为源手和和目标目标手节点。


    事件处理器调用的方法（共 4 个）是 `dragDetected()`、`dragOver()`、`dragDropped()` 和 `dropCompleted()`。`dragDetected()`
    方法用于启动切换操作，而 `dragOver()` 用于检查目标是否可以接受数据。`dragDropped()` 方法处理实际的数据传输，`dropCompleted()`
    通知源节点操作已完成。`dragDone()` 方法用于清理资源。


    # 5 MVC


    我之前介绍过 `Module-View-Controller` 模式，这是一种 GUI 程序的设计模式，在这种语境下，我也提到过模式有多个版本，部分是由于所使用的开发工具，部分由于所使用的
    API。如果你完全使用 JavaFX，你应该使用 `Module-View-Presenter` 模式，有时简写为 `MVP`。该模式可以如框所示：


    ![](img/Image2043.jpg)


    其原理是程序的视图负责所有视觉内容，但可以转向模型获取要显示的数据。用户交互在视图层发生，但当发生用户交互时，会被发送给演示器模块，由它来处理。也就是说，窗口的事件处理器被放在演示器类中，结果它可以更新视图并执行模型命令。当模型由于演示器的命令被更新时，它可以发送通知，视图组件可以监听通知并可能读取模型以确保模型与视图之间的同步。


    这是原理，实际上与我之前提到的 MVC 并不相似，只是模式的绘制方式直接支持了 JavaFX。然而，另一点是代码中意味着什么，特别是谁负责创建各个对象，这通过示例说明最好。


    在本书之前的示例中，它们基本上是由于视图层和模型层组成的二层架构。上述模式中最重要的点实际上是对视图层进行了更准确的拆分，分为视图组件和演示器组件。在之前的书中，我使用的数据库
    `addresses` 只有一个表：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_135.jpg)


