    ## 10.8 Refactoring the expression dialog


    The program has a few missings in drawing graphs, as the class `Plot` does not
    take into account the domain for a function. This may cause incorrect graphs or
    graphs that appear incorrect. I have therefore introduced an iteration solely
    for the purpose of solving this problem. Basically, it is important to specify
    a function’s domain, and the dialog `ExpressionView` is therefore expanded to:


    ![](image/Image4419.jpg)


    It is now possible to add a number of intervals where the union of these intervals
    is the domain. If you do not enter any intervals, the `domain` is perceived as
    the real axis. For each interval you can enter 4 values:


    1. `A` is the left end point. If the value is blank, the left end point is minus
    infinity.

    2. `Start` indicating a mark for the starting point. If blank, no mark is displayed,
    but otherwise it may be `Close`, which means a filled circle or `Open`, which
    means an open circle.

    3. `B` is the right end point. If the value is blank, the right end point is infinite.

    4. `End` that indicates a mark for the end point. If blank, no mark is displayed,
    but otherwise it may be `Close`, which means a filled circle or `Open`, which
    means an open circle.


    The extension means some changes to the model where there is a model class for
    an interval:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_206.jpg)


    and the class `ExpressionModel` is also changed


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_207.jpg)


    The most comprehensive changes in this iteration, however, are the class `Plot`,
    since it must take into account that a function can now have a domain, and eventually
    endpoints may be drawn. Finally, the class should behave nicely if you draw a
    graph that is not defined on the entire real axis, but fails to specify a domain.
    As a result, the class has gradually become relatively complex, and the class
    may eventually be included in a refactoring.


