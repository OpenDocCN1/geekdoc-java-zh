    I will therefore choose the last of the above options and save drawings as text
    files, but in a custom format. In practice, it may sometimes be of interest, and
    it is also not very difficult, but in turn, there are a few significant disadvantages.
    Since it is a custom and non-transparent format, it is difficult to apply the
    files in other contexts than in the current application. The contents of the files
    do not follow any standard. That in itself will often mean that a method like
    the following is rejected. Secondly, a custom format like the following is not
    easy to maintain, and if the model is changed, the code to save drawings and read
    them again must be changed accordingly, which means it is very expensive to change
    the model. The question is then whether there are any benefits and that’s hardly,
    but should I imply two, it should be that the format is very compact and saved
    drawings do not fill up much, which may be important if drawings should send over
    a network, and second as an example of what it takes to build an object hierarchy
    from a text (it is by default what parsing either JSON or XML does).


    So to the specific solution. There are generally two things to do:


    1. a `Model` object must be converted into a text which can be saved in a file

    2. the content of a file (a saved drawing) must be split into values to be used
    to construct a `Model` object identical to the object that has been saved.


    To solve these problems, it is necessary to use some separators that can be used
    to separate values, and the only requirement is that it should be characters that
    can not occur in the individual data elements. In this case, I need three, and
    I want to apply line breaks, carrige return and tabs, and thus `\n`, `\r` and
    `\t`. As the next step, each model class, whose objects are to be saved as part
    of the drawing, are expanded with a method `asText()`, which returns the object’s
    data elements separated with the separators. As an example, the class `AxisModel`
    is expanded with the following method:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_221.jpg)


    That is, the method returns all settings for a number axis as a string where the
    individual values are separated by the tab character. Similarly, the class `AxesModel`
    is expanded using the following method:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_2211.jpg)


    which returns data for the x-axis and y-axis, respectively, separated by a carrige
    return. The same applies to the other model classes:


    * `ColorWrapper`

    * `PlotPoint`

    * `PlotModel`

    * `LineModel`

    * `Interval`

    * `HatchModel`

    * `ExpressionModel`

    * `Model`


    where some of course are more complex than the above. As an example, below is
    shown `asText()` from the class `Model`, which returns the text to be saved:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_222.jpg)


    where the result technically is a text divided into lines. Then an event handler
    in `MainPresenter` can write the text of a file:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_223.jpg)


    It is then easy to read the content of the file again:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_2231.jpg)


    where a string with the file’s content is built, which is parsed by a method `parse()`
    in the class `Model`. It is this method that is responsible for splitting the
    content of the file into values and using these to initialize the `Model` object.
    The code of the method `parse()` is as follows:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_2232.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_224.jpg)


    but it uses several auxiliary methods. Overiew of how the method works:


    1. the string that is read in the file is split into lines (the separator character
    `\n`)

    2. the first line is parsed to an `AxesModel` object

    3. then iterates over the remaining lines (in principle, there only have to be
    the one for axes) and each element is parsed as either an `ExpressionModel`, a
    `PlotModel` or a `LineModel` object


    If an exception occurs during the process, the parsing is interrupted and the
    method returns false, but if all goes well, the current `Model` object is initialized
    with the values parsed and the method returns true.


    The Iteration includes a little more than what is shown above, but it is nothing
    but what is shown in other programs. You have to keep track of when a drawing
    has been changed, and before it should be deleted you should get a warning. It
    is a task left for the class `UndoHandler`, although the task because of cohesion
    probably not should be located there.


    ## 10.14 A final iteration


    According to the plan, there should now be two iterations left, but it has been
    merged into one. The program is in principle complete and can be used for what
    was the purpose. In the following, I will review the program’s classes to remove
    inconvenience and adjust the user interface in some places. Below I have briefly
    mentioned the most important adjustments.


    * A style sheet has been added to the application that primarily contains empty
    classes that are used in dialogs for later styling of the program.


    * `MainView` has changed slightly where some icons have been replaced and the
    background color has been changed using a style. An icon has been added to the
    toolbar to copy a drawing to the clipboard, and tooltips have been added to all
    toolbar icons.


    * `MainPresenter` has been updated in several areas. There are removed two event
    handlers `axes()` and `func()`, which have been replaced by a call to the method
    `openDialog()`. This method was previously found as a static method in the class
    `ViewTools` and as a private method in `MainPresenter`. Here is the last removed,
    so the class `MainPresenter` now also uses the static in `ViewTools`. Finally,
    all calls to `Alert` are replaced by static methods in the class `MessageDialogs`.
    The result is that unnecessary code has been removed.


    * `AxesView` has two fields (`number of decimals` and `auto tickmarks`) on both
    axes that are not used. These four fields have been removed. Fields for entering
    numbers use a converter `ValueConverter`. It’s an inner class, but it is moved
    to a class with the package visibility in a file `Converters.java`. More dialogs
    uses converters, and the goal is to gather these converters somewhere.


    * Three of the functions in the *Functions* menu and the function in *Calculations*
    menu opens a simple dialog box for selecting a function. The respective views
    are `FuncSelectView`, `FuncTableSelectView`, `HatchSelectView` and `TangentSelectView`.
    These four classes are actually the same and are replaced by a single view `SelectView`.
    The corresponding presenter classes are also almost the same, but not entirely,
    and instead of replacing them with a new one, I have kept the old ones as they
    are, since they are small and quite simple.


    * In general, I have been through all dialogs and assigned styles to all controls.


    * The model classes are generally unchanged, but two of the classes use converters,
    and they are as in the same way as in the view layer moved into their own file
    `Converters.java`. However, the classes `Model` and `UndoManager` are modified
    as follows.


    * The class `UndoManager` actually encapsulates two concepts, namely undo/redo,
    and to keep track of whether the model has been changed. In principle, it is unfortunate,
    and the last functionality regarding the state of the model has therefore been
    moved to its own class called `ChangedManager`. The class is written as a singleton
    and is very simple.

