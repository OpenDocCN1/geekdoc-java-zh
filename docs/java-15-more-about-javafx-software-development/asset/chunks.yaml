- fmt: '

    JavaFX also has an `TreeView` control, which corresponds to a `JTree` from Swing
    and is a control that visualizes hierarchical data. Basically, there are two classes
    `TreeItem` and `TreeView`, the first representing an element in the tree, while
    the latter is the actual component. A `TreeItem` is either a composite or a leaf
    and it is determined by whether it has child elements.


    ### ShowWorldProgram


    The program `ShowWorldProgram` shows some of the world’s countries organized in
    a hierarchy:


    ![](image/Image1915.jpg)


    Above, all continents in these world, which all of the Antarctica are composite
    nodes, as are shown with the arrow, showing that it is a node with child nodes
    and that it can be expanded by clicking the arrow with the mouse. Below is the
    same window where Asia and North America are expanded (you should note that the
    component automatically displays a scrollbar when necessary):


    ![](image/Image1924.jpg)


    A `TreeView` shows data defined in a model, which is a hierarchy of `TreeItem`
    elements, and in this case, the model is defined in the method `build()`:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_89.jpg)


    The code for the program is quite simple:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_90.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_91.jpg)


    and there is nothing to explain. However, you must note that with `setShowRoot()`
    I defined that the root of the tree should not be displayed. You can try to set
    a comment in front of the line and see what happens.


    ### MaintainWorldProgram


    The next example is called `MaintainWorldProgram` and is a variation of the above
    program and opens the following window:


    ![](image/Image1935.jpg)


    As shown by the buttons, one of the differences is that you should also be able
    to edit the content of the tree:


    1. Clicking the `Add` button adds a node to the item that has been selected –
    if it is not a leaf node

    2. Clicking on the `Delete` button deletes the node that is selected, but only
    if it is a leaf node

    3. Double-clicking a leaf node will allow you to change the name


    Finally, there is a button `Test` that only makes it possible to print the number
    of leaf nodes in the tree, and you should note that it is number of leaf nodes
    in the `TreeView` component’s model, and the button is used to test that the above
    operations not only update the `TreeView` controller but also the model.


    The program should also show something about what events occurs when you use a
    `TreeView`.


    The model for the `TreeView` component is the same as in the previous example
    and is not shown here. The class `MaintainWorldProgram`, on the other hand, fills
    a part, so I will just show the code for the most important methods.


    The method `start()` is essentially unchanged, but there are now instance variables
    for both the `TreeView` control and the model:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_92.jpg)


    Otherwise, most important in the method `start()` are that it calls a method `addHandlers()`,
    which adds event handlers to the `TreeView` component:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_921.jpg)


    There are a total of 5 event handlers. The names tell you when the event handlers
    are performed. The first three (where only the code for first is shown) does nothing
    but print a text on the console. The fourth uses a method `printModel()` that
    prints the contents of a subtree on the console and actually prints the entire
    tree. Its purpose is to show that the model is updated and you are encouraged
    to examine the code. The last event handler concerns the mouse and tests for double
    click with the mouse. If so, is executed the method `modify()`:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_93.jpg)


    In the case of a leaf node, a simple `TextInputDialog` opens where you can change
    the value. Doing so, updates the current `TreeItem`, and you should note that
    it also updates the user interface.


    The event handler for the `Add` button is in principle identical, while the event
    handler for the `Remove` button is:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_94.jpg)


    Here you should note how to refer to the item that is selected and again that
    the user interface is automatically updated. The last event handler is about the
    `Test` button counting the number of leaf nodes and then opening an `Alert` with
    the result.


    ### EditWorldProgram


    In the above example, the content of a `TreeItem` are edited by opening a simple
    `TextInputDialog`, but you can also edit the content inline like a `TableView`.
    It is used in the example `EditWorldProgram`. The user interface is the same as
    above, but there is a minor change to the model:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_941.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_95.jpg)


    The method `start()` is:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_951.jpg)


    Here you should note that the `TreeView` component must be editable, and in addition,
    a `CellFactory` must be attached. Just as you’ve seen for a `TableView`, there
    are other `CellFactory` types. The two comboboxes contains all continents and
    all currencies, respectively, and are used to change a country’s currency or continent.
    Note that the above window with the `TreeView` component does not show all the
    world’s countries as only the countries in the database where a foreign key to
    the table *world* is included. The method `createCommands()` creates a `Pane`
    with the three buttons, and the associated event handlers are all simple and you.


    ### Exercise 5


    The database `padata` has four tables that contain information about Danish regions,
    Danish municipalities and zip codes, while the fourth table represents a many-many
    relationship between `municipality` and `zipcode`. The four tables were created
    with the following script:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_96.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_97.jpg)


    You must write a program that you can call `Denmark`, which displays this data
    in a `TreeView`. Note that the program only should display names, but you should
    not be able to edit the content. When the program starts, you should see the following
    window:


    ![](image/Image1950.jpg)


    and below the same window after the root, `Region Midtjylland` and the municipality
    `Holstebro` are expanded:


    ![](image/Image1957.jpg)


    ### UpdateWorldProgram


    As a final example of using a `TreeView`, I will show a program called `UpdateWorldProgram`.
    The program is similar to the previous one, but partly the individual objects
    are of a custom type and not just strings, and partly there are more data. The
    database `padata` (see, if applicable, the book Java 6) contains three tables
    that contain data about currencies, continents and countries:


    ![](image/Image1965.jpg)


    where the last two columns in the country table are foreign keys. The program
    will show an overview of all countries, but organized in a `TreeView`, and where
    it should be possible to edit the information about a country. If you open the
    program, you get the following window where North America is expanded:


    ![](image/Image1972.jpg)


    For example, if you double-click on the United States, you will see the following
    window where you can edit data about the United States:


    ![](image/Image1980.jpg)


    The two comboboxes contains all continents and all currencies, respectively, and
    are used to change a country’s currency or continent. Note that the program does
    not provide opportunities to create new countries or delete existing countries,
    but of course it would be easy to expand the program with these features.

