  trans: '

    因此，我将选择上述选项中的最后一个，并将绘图保存为文本文件，但采用自定义格式。在实践中，这有时会有意义，而且并不困难，但反过来，也有一些明显的缺点。由于它是自定义且不透明的格式，很难在当前应用程序之外的其他场景中应用这些文件。文件内容不遵循任何标准，这本身通常意味着像下面的方法会被拒绝。其次，像下面这样的自定义格式易于维护，如果模型发生了变化，必须相应地更改保存绘图和重新读取绘图的代码，这意味着更改模型的成本非常高。问题在于这是否有任何好处，几乎没有，但如果非要说两个优点的话，应该是格式非常紧凑，且保存的绘图不会占用过多空间，这在绘图需要通过网络发送时可能很重要；其次，它可以作为从文本构建对象层次结构的一个示例（这本质上就是解析
    JSON 或 XML 所做的事情）。


    回到具体的解决方案。通常需要完成两件事：


    1. 必须将 `Model` 对象转换为可以保存到文件中的文本。

    2. 文件内容（已保存的绘图）必须被拆分为多个值，用于构建一个与保存的对象完全相同的 `Model` 对象。


    为了解决这些问题，必须使用一些可以分隔值的分隔符，唯一的要求是它们应该是不能出现在单个数据元素中的字符。在这种情况下，我需要三个分隔符，我想应用换行符、回车符和制表符，即
    `\n`、`\r` 和 `\t`。作为下一步，每个要作为绘图部分保存的对象的模型类都扩展了一个方法 `asText()`，该方法返回用分隔符隔开的对象数据元素。例如，`AxisModel`
    类扩展了以下方法：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_221.jpg)


    也就是说，该方法返回一个包含数字轴所有设置的字符串，其中各个值由制表符（tab）分隔。同样，`AxesModel` 类也使用以下方法进行了扩展：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_2211.jpg)


    该方法分别返回 x 轴和 y 轴的数据，并用回车分隔。同样的情况适用于其他模型类：


    * `ColorWrapper`

    * `PlotPoint`

    * `PlotModel`

    * `LineModel`

    * `Interval`

    * `HatchModel`

    * `ExpressionModel`

    * `Model`


    其中某些类当然比上面的更复杂。例如，下面显示了 `Model` 类的 `asText()`，它返回要保存的文本：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_222.jpg)


    其结果在技术上是一个被分成行的文本。然后，`MainPresenter` 中的一个事件处理器可以写入文件的文本：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_223.jpg)


    此时再次读取文件内容就简单了：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_2231.jpg)


    构建一个包含文件内容的字符串，该字符串由 `Model` 类中的 `parse()` 方法进行解析。该方法负责将文件内容拆分为多个值，并使用这些值来初始化
    `Model` 对象。`parse()` 方法的代码如下：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_2232.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_224.jpg)


    但它使用了几个辅助方法。该方法的工作原理概述如下：


    1. 将文件中读取的字符串拆分为行（分隔符字符 `\n`）。

    2. 将第一行解析为 `AxesModel` 对象。

    3. 然后遍历剩余的行（原则上，只需要处理轴的那几行），并将每个元素解析为 `ExpressionModel`、`PlotModel` 或 `LineModel`
    对象。


    如果在此过程中发生异常，解析将中断且方法返回 `false`；但如果一切顺利，则会用解析出的值初始化当前的 `Model` 对象，方法返回 `true`。


    迭代过程包含比上面显示的内容稍多一点，但与其它程序中显示的内容无二致。你需要跟踪绘图何时发生了更改，并且在删除它之前应该获得警告。这是一个留给 `UndoHandler`
    类处理的任务，尽管由于内聚性的考虑，该任务可能不应该位于那里。


    ## 10.14 最后的迭代


    根据计划，现在应该还有两个迭代，但它们已经合并为了一个。程序在原则上已经完成，可以用于其目的。在下文中，我将回顾程序的类以消除不便，并在某些地方调整用户界面。下面我简要提到了最重要的调整。


    * 为应用程序添加了一个样式表，其中主要包含用于对话框的空类，以便后续对程序进行样式设置。


    * `MainView` 发生了些变化，替换了一些图标并使用样式更改了背景颜色。工具栏上添加了一个图标用于复制绘图到剪贴板，并为所有工具栏图标添加了提示。


    * `MainPresenter` 在几处进行了更新。删除了两个事件处理器 `axes()` 和 `func()`，它们被调用 `openDialog()`
    方法取代。该方法之前作为 `ViewTools` 类中的静态方法以及 `MainPresenter` 中的私有方法存在。后者已被删除，因此 `MainPresenter`
    现在使用 `ViewTools` 中的静态方法。最后，所有对 `Alert` 的调用都被替换为 `MessageDialogs` 类中的静态方法。结果是删除了多余的代码。


    * `AxesView` 在两个轴上都有未使用的字段（`小数位数` 和 `自动刻度`）。这四个字段已被删除。输入数字的字段使用了转换器 `ValueConverter`。它是一个内部类，但被移动到了包可见的类中，位于
    `Converters.java` 文件。更多的对话框使用了转换器，目标是将这些转换器收集在一起。


    * *Functions* 菜单中的三个函数以及 *Calculations* 菜单中的函数会打开一个简单的对话框来选择函数。相应的视图为 `FuncSelectView`、`FuncTableSelectView`、`HatchSelectView`
    和 `TangentSelectView`。这四个类实际上是相同的，被一个 `SelectView` 取代。对应的处理器类也几乎相同，但并非完全相同，我没有替换它们，而是保留了旧的，因为它们很小且简单。


    * 总的来说，我遍历所有的对话框并为所有控件分配了样式。


    * 模型类通常没有变化，但其中两个类使用了转换器，它们像视图层一样，被移动到了独立的文件 `Converters.java` 中。然而，`Model` 和
    `UndoManager` 类被修改如下。


