    ## 2.2 Observable collections


    JavaFX defines multiple collections, which are extensions of the classic collection
    classes. There are three interfaces defined:


    * `ObservableList<T>`

    * `ObservableSet<T>`

    * `ObservableMap<K,V>`


    which inherits `List<T>`, `Set<T>` and `Map<K, V>` respectively, but also inherits
    the interface `Observable`. JavaFX does not immediately have classes that implements
    those interfaces, but instead, there is a class of `FXCollections` that has static
    methods that return objects that implement these interfaces. Viewed from the programmer,
    an observable collection is a list, a set or a map that can be observed for invalidation
    and changes of the content.


    Consider the following example:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_281.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_29.jpg)


    If the method is performed the result is:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_291.jpg)


    The list is created with two elements, and then a `ChangeListener` is associated
    that do nothing but prints a message on the console. The first event occurs after
    additional two items have been added and the next after another element is added.
    Finally, the third occurs after an item has been deleted. The method `show()`
    shows the content of the list on the console and then reads the list. Note that
    the parameter is a `List<String>` which is ok, since an `ObservableList<String>`
    is specially a `List<String>`. After the list is printed, it is sorted, and as
    it means that the order of the list’s elements changes, another `ChangeEvent`
    occurs.


    The class `ListChangeListener.Change` has a variety of different methods that
    tells you about the reason for the event and you are encouraged to investigate
    which ones. The following example should show a little bit about how these methods
    can be used. First, I’ve added a simple model class with two properties that adhere
    to the JavaFX beans pattern:


