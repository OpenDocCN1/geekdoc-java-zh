    ## 3.3 过滤器


    `TableView` 的重要功能之一是使用过滤器，使用 `TableView` 这一切变得简单许多。`TableView` 显示 `ObservableList`
    的内容，你可以通过过滤器设置过滤器。为了结束对 `TableView` 组件的审查，我将展示一个设置过滤器的示例。


    该示例名为 `FilterKings`，我想重用 `King` 类型的对象，`TableView` 的数据模型与之前基本没有变化，在此不再显示。


    代码如下：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_85.jpg)!(image/Java_15_–_More_about_JavaFX_5-4-18_86.jpg)


    `start()` 方法中没有新内容，新操作在 `initialize()` 方法中完成，该方法初始化表格控件。首先为要在表中显示的数据创建一个过滤器，过滤器的类型为
    `FilteredList`。接下来，必须与输入字段关联一个监听器，它被定义为过滤器的谓词，在本例中，如果 `King` 对象的名称属性包含输入字段的值，则返回真
    —— 不区分大小写。最后，将过滤器作为 `SortedList` 插入包装器中，它拥有一个绑定到表格比较器的比较器。最后，使用 `sorter` 对象作为表格的数据模型。


    运行程序，你会得到下面的窗口，底部有一个输入字段，用于输入 `Name` 列的过滤器：


    ![](img/Image1900.jpg)


