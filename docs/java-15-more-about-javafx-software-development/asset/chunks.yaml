    at the end of the file). There is generally an override of `forTableColumn()`,
    where you can specify a converter as parameter, and in this case it is only to
    ensure that a missing year is not displayed as 0.


    Then there is the method `getSalaryCol()`, which returns a `TableColumn` for a
    `Double`, and where it should be possible to edit a `Double`. Here are several
    things to notice. First, as `CellFactory`, a `TextFieldTableCell` is used to enter
    a random decimal number. In order for the result to look nice, a converter of
    the type `SalaryConveter`, which shows a `Double` with two decimal, is attached
    – but only if the number is not 0. If that happens, the result will appear as
    blank. When the user enters a number, they can of course enter something illegal,
    and if that is the case (the entered can not be converted to a number), an exception
    appears with the result that the value is set to 0. However, the problem is that
    the model is then updated with the value 0, which is not really the thought, but
    the model should retains the old value. The problem is solved by adding an event
    handler that is executed when the entry is completed (and the `TextField` component
    closes). If the value is 0, the old value is set, and otherwise the new value.
    Reintroducing the old value looks a bit weird and in fact the model still has
    the old value, but the user interface is not updated. The problem is solved by
    assigning the `Person` object to itself, which means that the model fires an event
    that updates the user interface. As the last, the column content is right aligned,
