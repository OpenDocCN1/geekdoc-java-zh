    在之前的迭代中，`Model` 类扩展了 `parse()` 方法，用于解析解析从文件中读取的文本。其缺点是 `Model` 类现在变得非常臃肿，因此我将
    `parse()` 方法移动到了一个名为 `Parser` 的独立类中。该类没有其他方法，唯一的优点是模型类变得更加简单且易于管理，同时它可能更容易将绘图的保存方式替换为其他方式。


