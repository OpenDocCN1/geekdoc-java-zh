  trans: '

    最初，创建了 4 个 `Spinner` 控制，目标是展示如何创建一个 `Spinner`（可以通过构造函数指定参数）以及此后可以设置哪些属性。在这里，你应该特别注意如何关联事件处理器。这些操作都非常简单，目标是（通过控制台上的文本）观察相关事件何时发生。这
    4 个 `Spinner` 控制被放置在一个 `HBox` 中，该 HBox 可以添加到窗口的根节点。当 `root` 创建（作为一个 `VBox`）时，首先添加了
    3 个 `LabelField` 控制，其中你将主要观察到构造函数的参数。第一个控件关联了一个事件处理器——这很简单易懂，其目标是展示你可以为输入字段关联事件处理器。


    这两个用户控件都非常简单，几乎没有太大的实际意义，但它们展示了如何创建用户控件。在本章的剩余部分中，我将描述这两个控件是如何编写的。


    ## 6.1 A LabelField


    在编写自定义控件时，两个主要的决策是应该包含哪些属性，以及该控件将触发哪些事件。事实上，实际的控件并不比一个包含 `Label` 和 `TextField`
    的 `HBox`，除了 `HBox` 的属性外，你应该能够分别设置 `Label` 和 `TextField` 的宽度，并为这两个组件设置文本。最后，必须有一个字体属性，它应该同时应用于
    `Label` 和 `TextField`，以便两个组件始终使用相同的字体。当你输入文本或其他通过方式更改 `TextField` 组件的文本时，它应该发送
    `ChangeEvents`，为了让应用程序捕获到这些事件，组件返回了 `TextField` 组件的 `textProperty`。该组件可以这样编写，我在其中只包含了
    5 个构造函数中的一个以及两个属性：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_146.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_147.jpg)


    事实上，没什么需要注意的，最重要的代码位于构造函数中，其中两个组件应该被“漂亮地”放置在容器中。注意，该类继承了 `HBox`，因此它和其他所有控件一样，是一个可以插入场景图的组件。


    ## 6.2 A Canvas


    在看最后一个控件之前，我将提到 `Canvas`，这是一个我之前没有提到的控件。`Canvas` 是一个由绘图表面组成的控件，你可以在其中使用绘图功能绘制几何图形、文本并插入图像。你还可以使用
    `PixelWriter` 操控单个像素。


    `Canvas` 关联了一个 `GraphicsContext` 类，该类代表图形内容并提供了可用的绘图函数。鼓励你研究 `GraphicsContext`
    提供了哪些方法。


    例如，程序 `CanvasProgram` 打开了以下窗口：


    ![](img/Image2088.jpg)


    其中绘制了一个正方形、一个圆、一段文本和一条曲线（比喻），并添加了一张图片。新之处在于这些是使用 `Canvas` 完成的：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_148.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_149.jpg)


    代码非常容易理解。在 `start()` 方法中，创建了一个特定大小的 `Canvas` 对象，并创建了该 `Canvas` 对象的 `GraphicsContext`
    的引用。对于这个对象，定义了绘图用笔的宽度，然后使用绘图工具绘制了一个矩形。由于没有提到颜色，它是用黑色笔绘制的。接下来，添加了红色的填充颜色并绘制了一个实心圆。特别注意绘图函数是如何调用的。下一步定义了一个字体并绘制了文本。最后插入了一张图像，最后调用了
