    ## 10.6 The program architecture


    The result of the foregoing is that a very large part of the program code is located
    in the class `FDrawer`, and the subsequent development will, with unchanged architecture,
    mean that the class becomes even bigger and probably even much larger. This means
    that the class becomes irreversible, and partly because the program does not follow
    the MVP pattern, and both can make it more difficult to maintain the program in
    the future. That’s why I’ve put in an extra iteration with the purpose of breaking
    down the class `FDrawer` into smaller classes and thus ensuring a better program
    architecture. It is therefore an iteration that does not directly generate momentum
    in the project.


    It would of course be better to have made these considerations earlier in the
    project and from the outset have planned a better architecture. However, it is
    not that easy, and especially if you work on a program where the goal is not completely
    clear and where the requirements are ongoing. This may mean that you initially
    focus on getting something on the screen, and you should then stop and perform
    a refactoring.


    In this case, the following classes have been added to `fdrawer.views`:


    *   `Axes`, like the corresponding inner class in `FDrawer`, has been moved to
    its own view class

    *   `Plot`, like the corresponding inner class in `FDrawer`, has been moved to
    its own view class

    *   `MainMenu`, which is the code of the menu that has been moved to its own class

    *   `MainView`, which is the main window itself

    *   `MainPresenter`, that is presenter for the main window


    The class `FDrawer` has been changed accordingly and is then a class that does
    nothing but instantiate a `Model` and a `MainPresenter`.


    Finally, to `fdrawer.views` is added a class `ViewTools` that contains only static
    methods.


