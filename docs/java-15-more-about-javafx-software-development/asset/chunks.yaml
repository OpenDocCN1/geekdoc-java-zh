    ## 2.4 Binding persons


    As a final example of properties, the application *PersonProgram* opens the following
    window:


    ![](image/Image1799.jpg)


    where you in the two top entry fields, can enter the name and job title of a person.
    If you click *OK*, a person will be added to a *ListView*. In the window above
    6 persons have been created / entered. If you double-click on a person in the
    *ListView* control, the person’s data is inserted into the input fields, and they
    can then be edited. If you double click on a person, this can be deleted by clicking
    the *Remove* button. Finally, the *Clear* button is used to delete the entry fields
    and remove a selction in the *ListView* control. The bottom button is used to
    delete the content of the list.


    The program uses the class *Person* from the project *FXProperties* – expanded
    by two trivial methods. The code for the *PersonProgram’s* window is as follows:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_43.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_44.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_45.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_46.jpg)


    The class has 6 instance variables, where the first three are for controls. The
    next has the type *Person* and represents the object on which you work, and thus
    the object whose properties appear in the two entry fields. The next again is
    an *ObservableList* and represents the content of the *ListView* control. Finally,
    the last one is a property that must represent the index of the *Person* object
    in the list that is selected.


    Examining the method *start()* is the first thing that happens that the *lstView*
    object is created with *persons* as a parameter for the constructor. This means
    that a bidirectional binding is created between the *ListView* component and the
    list *persons*. An event handler is also associated with the *ListView* component
    for mouse events. Finally, the property *selected* is bound to the selected index
    in the *ListView* component. The rest of the method *start()* does not contain
    anything new and is only intended to create the window’s scene graph. However,
    you must note the method *createTop()* that creates a *GridPane* for entering
    a person. Here you should especially note how the two *TextField* controls bind
    to properties of the *Person* object.


    Then there are the event handlers where there are 5, but they are generally simple.
    The first concerns the *OK* button and starts by testing whether something has
    been entered for both name and job title. If this is the case, the *property*
    selected is used to determine whether to add a new object or whether an existing
    object is to be modified. You should note that in either case, a new *Person*
    object is instantiated. It is necessary because the variable *person* can not
    be set to refer to another object as it is bound to the input fields. Whether
    you add an object or modify an object, the event handler for the *Clear* button
    is called that clears the fields in the *person* object and removes any selection
    in the *ListView* component. The event handlers for the *Remove* and *Delete*
    buttons are both trivial and the event handler for clicks with the mouse in the
    *ListView* component is also simple, and you should especially note how to test
    for double-click.


    When you test the program, note how the user interface is automatically updated
    for reasons of the bindings.


