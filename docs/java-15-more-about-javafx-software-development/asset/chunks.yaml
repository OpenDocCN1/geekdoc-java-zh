  trans: '

    原则上，实现这些功能非常简单，只需要对 `AxisModel` 和 `AxesModel` 两个类进行简单的修改，当然还需要对 `MainPresenter`
    类进行修改，以便将事件处理器关联起来。


    然而，有一个待解决的挑战。在此之前，假设两个轴交于窗口的中心。如果可以进行缩放，更通地说，如果改变了轴的最小值和最大值，这种方法就失效了。因此在 `Axes`
    类和 `Plot` 类中都需要进行修改，以考虑到坐标系的原点并不一定位于窗口中心。


    ## 10.11 实现“编辑”菜单


    此菜单必须包含 4 个菜单项：


    * `Undo`（撤销）

    * `Redo`（重做）

    * `Screen clip`（截图）

    * `Axes`（轴）


    这里是维护坐标系轴的最后一个函数，它也实现在工具栏的一个按钮上。`Screen clip` 功能是程序最重要的功能之一，也是整个应用程序的目标之一。另一方面，该函数的实现非常简单，因为
    JavaFX 提供了所有相关支持：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_214.jpg)


    `Node` ——在这里是 `StackPane` —— 有一个 `snapshot()` 方法，可以简单地获取组件快照。事实上，它是一个 PNG 图像，可以立即放入剪贴板。


    另外还有两个功能，另一方面它们并不简单。由于某些原因，JavaFX 不支持 Undo/Redo，但必须假设它们会被包含在后续版本的 API 中。你可以在网上找到更多
    Undo/Redo 的开源 API，将以下内容替换为其中一个 API 可能会是一个很好的任务。另一方面，这也不完全容易，部分是因为涉及的 API 可能不够全面，部分是因为它们可能过于通用，以至于学习如何使用它们本身就是一项工作。在这种情况下，我通过从头编写必要的代码解决了解决问题。事实上，这并不困难，但问题在于它是不可修改的，且无法立即用于其他程序。


    原则上讲，Undo/Redo 的原理是：当你在程序中执行某项操作时，它会被同时存储在栈中；如果你执行撤销（按键 `Ctrl + Z`），该操作必须被回滚然后放入重做栈中。重做（按键
    `Ctrl + Y`）基本上以相同的方式发生，只需不撤销操作而是恢复它并将其移动到撤销栈。到目前为止这一切都是简单的，但有两个突出的问题：


    1. 什么是“操作”——什么是你应该能够撤销和重做的？

    2. 什么应该被推入栈中？


    在这种情况下，决定要回滚的操作有：


    * 修改坐标系设置 —— 一个 `AxesModel` 对象

    * 添加新函数 —— 一个 `ExpressionModel` 对象

    * 修改函数 —— 一个 `ExpressionModel` 对象

    * 删除函数 —— 一个 `ExpressionModel` 对象

    * 在图表中添加一个新图表 —— 一个 `PlotModel` 类型的对象

    * 修改图表 —— 一个 `PlotModel` 类型的对象

    * 删除图表 —— 一个 `PlotModel` 类型的对象

    * 修改函数的切线 —— 一个 `OberservableList object<LineModel>` 对象

    * 修改图表的垂直线 —— 一个 `OberservableList object<LineModel>` 对象

    * 给函数添加阴影线线 —— 一个 `HatchModel` 类型的对象

    * 修改函数的阴影 —— 一个 `HatchModel` 类型的对象

    * 删除函数的阴影 —— 一个 `HatchModel` 类型的对象


    这些可能的操作（用于撤销的保存操作）使用以下枚举定义：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_215.jpg)


    Undo / Redo 操作定义如下：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_2151.jpg)


    因此你可以保存任何对象，但要注明该对象对应哪种操作。接下来是 `UndoManager` 类，它是保存操作并执行 `undo()` 或 `redo()` 的类：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_216.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_217.jpg)


    该类被写成单例，所有的工作都在私有方法 `doOperation()` 中完成，其中对应每个可能的操作都有一个 `case` 分。


    每当程序执行一次操作时，必须将其保存，因此必须执行上述的 `add()` 方法。这发生在各个对话框的演示器类中，各个操作的副本被封装在 `GraphOperation`
    对象中，然后推入撤销栈。当你通过点击菜单或按下 `Ctrl+Z` 或 `Ctrl+Y` 执行撤销或重做时，会在 `UndoManager` 类中执行对应的方法。


    ## 10.12 实现“计算”菜单


    这是一个非常简单的迭代，因为此菜单应该包含一个功能：


    * `Function table`（函数表格）


    设计思路是该菜单以后会扩展其他功能。当前功能为特定函数打开一个窗口：


    ![](img/4457.jpg)


    上述对话框的实现：`TableView` 和 `FuncPresenter` 以及其他功能。


    ## 10.13 实现“文件”菜单


    这次迭代包含了最后的菜单，它必须有 5 个功能：


    * `New`（新建）

    * `Open`（打开）

    * `Save`（保存）

    * `Save as`（另存为）

    * `Exit`（退出）


    前三个是显而易见的，同时也分配到了工具栏按钮。目标是能够保存图表并在以后加载。由于程序是一个易于安装的工具，图表不得保存在数据库中，而是保存在普通文件中。这里有四种方案：


    1. 以 JSON 文档保存绘制

    2. 以 XML 文档保存绘制

    3. 使用传统的对象序列化保存绘制

    4. 使用自定义格式保存绘制


    第一种是最直观的，因为 JSON 不占空间，是标准且是文本，所有人都可以读取。它要求 `Model` 对象可以转换为 JSON，并且 JSON 文本再次创建
    Java 对象。有很多开源 API 可以做到这一点，例如 `GSON` 和 `Jackson`，它们都是优秀的产品。遗憾的是，它们在当前情况下不起作用，原因是对象结构深层且复杂，但主要是
    JavaFX 导致了问题。这两个产品都给出了某种程度上解决了问题的方案。这显然并不简单，但预计未来的版本可以直接使用。因此，我放弃了使用 JSON。


    对于 XML，情况类似，除了 XML 占用空间大外优点相同。这里也有现成的产品可以使用，`JAXB` 甚至是 Java 的集成组成部分。如果你经常需要处理
    XML 文档，可能值得学习 JAXB，将以下内容替换为 XML 可能会是一个很好的工作。


    在这种情况下，使用对象序列化存储图表是不恰当的。除了其他原因外，在项目开始时我就提到过这不是理想的，但事实上这也给 JavaFX 带来了问题，因为属性和其他
    JavaFX 类型不是可序列化的。至少，对象的序列化将需要一些额外工作。

