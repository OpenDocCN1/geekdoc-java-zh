    It is rarely necessary to write your own controls, but the possibility exists,
    and it could even be the task to developing your own user defined controls. A
    control must be derived directly or indirectly from the class `Node` so that it
    can be part of a scene graph in the same way as all other controls, but in most
    cases, one will write a user defined control as a class inheriting an existing
