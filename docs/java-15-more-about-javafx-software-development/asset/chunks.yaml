    # 3 Advanced controls


    In this chapter I will illustrate the use of three controls that did not fit in
    the previous book:


    1.  `TableView`

    2.  `TreeView`

    3.  `TreeTableView`


    where the first corresponds to the component `JTable`, the second to the component
    `JTree`, while the latter is best characterized as a combination. When the three
    components were not included in the previous book, it is partly because they are
    complex with many possibilities, and partly that their way of working can best
    be described after the mentions in the previous chapter of properties and binding.


    ## 3.1 TableView


    I want to start with the `TableView` component, that like `JTable`, is an extremely
    complex control that arranges data in rows and columns, and it is also the most
    useful of the three controls. The component’s class is called `TableView`, but
    together with the component are several helper classes:


    *   `TableColumn`

    *   `TableRow`

    *   `TableCell`

    *   `TablePosition`

    *   `TableView.TableViewFocusModel`

    *   `TableView.TableViewSelectionModel`


    and the names should tell a little about the purpose of the individual classes.
    The class `TableView` is used a bit like a `JTable`, where you must define a data
    model, which is the data that the component should display, and which columns
    there should be. I will start with an example, which I have called `ShowKingsProgram`,
    which shows an overview of Danish kings represented as objects of the type `King`
    (the class from the previous chapter):


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_59.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_60.jpg)


    If you run the program, it opens the window below which shows a table with 5 columns
    and thus one column more than the type of `King` has properties for:


    ![](image/Image1853.jpg)


    If you study the program code (the main program) it is:


    ```

    ![](image/Java_15_–_More_about_JavaFX_5-4-18_61.jpg)

    ```


    which is very simple. Initially, a model is defined (explained below). Otherwise,
    nothing happens except the method `start()`, where a `TableView` is created for
    `King` objects and initialized with the data model, and finally, four columns
    are added using methods in the data model. The respective `TableView` is inserted
    into the program’s scene graph encapsulated in a `BorderPane`. It is the model
    class `KingTableModel` that contains the most:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_611.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_62.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_63.jpg)


    The class starts by creating an `ObservableList` for `King` objects, and the list
    is initialized in the constructor using data defined in an array at the end of
    the class. Note that the list as an alternative could be initialized by reading
    a database table. The class has a method that can return the list, which was used
    in the method `start()` in the constructor for the `TableView` component. The
    rest of the class consists of methods that creates the individual columns. The
    first is for the `name` property, and the type of a column is `TableColumn`, with
    parameters indicating which the objects are (here `King`) and the type of the
    property in question (here `String`). The parameter of the constructor in `TableColumn`
    is the text shown in the header of the columns. Next, you must specify which values
    each cell should contain, and it happens with a `PropertyValueFactory`, where
    the parameter of the constructor is the name of the property in the class `King`
    that the cell must contain, and here it is `name`.


    The two next columns are basically defined in the same way, just the type is this
    time `Integer`. However, these columns are not inserted directly in the table,
    but via another column created by the method `getPeriodCol()`. Columns can be
    nested and the column created by `getPeriodCol()` is a column consisting of two
    other columns. At the user interface, it corresponds to that the column with the
    header `Period` having two subcolumns, respectively `from year` and `to year`.
    In this case, there is no particular reason for it in addition to showing that
    it is possible and what the syntax is.


    The class also creates a column for the property `country`, and here is nothing
    new, and actually the method `getCountryCol()` is not used. The goal is to show
    that you do not have to display all columns in the user interface.


    Finally, there is the method `getYearCol()`, which shows how many years that king
    has ruled, or the text `Unknown` if you do not know the government period. This
    column is different, as there is no corresponding property in the `King` class,
    and the values to be displayed in the cells must therefore be calculated. This
    happens again using the method `setCellValueFactory()`. It has the following prototype:


    ```

    ![](image/Java_15_–_More_about_JavaFX_5-4-18_64.jpg)

    ```


    `Callback<P, R>` is an interface parameterized with two types, and the interface
    defines a single method


    ```

    ![](image/Java_15_–_More_about_JavaFX_5-4-18_641.jpg)

    ```


    In this case for the column `Year`, it means that the cells of the column are
    initialized by a method of the form


    ```

    ![](image/Java_15_–_More_about_JavaFX_5-4-18_642.jpg)

    ```


    which is used to calculate the years in which the king has ruled. You can thus
    add your own custom-defined columns. You should note that the value is returned
    as a read-only property, as you can not edit such a value in the user interface.


    If you run the program, note that by default you can change the columns width
    using the mouse, change the order of columns, and sort them by clicking the header.


    The next example is called `MapKingProgram` and is essentially the same program
    and opens the following window:


    ![](image/Image1863.jpg)


    and that is, the program shows a `TableView` with 3 columns corresponding to three
    properties in the class `King`. However, the difference is that the objects (rows)
    that the component shows are not `King` objects, but instead, `Map<String, Object>`
    objects. There is no particular reason for that in this example besides showing
    the syntax, but in situations where the rows in the table do not match a domain
    object, the option can be used.


    The class `King` is the same as in the previous example, but the class `KingTableModel`
