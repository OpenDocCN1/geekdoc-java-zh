    2. Open existing drawing

    3. Save drawing

    4. Settings for coordinate system

    5. Insert new function in the drawing

    6. Zoom out

    7. Zoom in

    8. Same division om both axes


    The toolbar also contains an expression, and the idea is that the drawn functions
    should be displayed as a link, so you can change the function’s data by clicking
    the link.


    The cross with the frame around should illustrate a drawing by a method `showImage()`,
    and the figure consists of three `Shape` objects attached to a `Group` object.
    It is a preliminary solution that may be changed. The figure is preliminary hard-coded,
    but follows the window size when it changes. There is a small problem with displaying
    the window in full screen if you double-click the titlebar. Here’s a problem getting
    the window drawn correctly. It is apparently a JavaFX issue (under Linux) and
    is fixed with a timer that updates the window after.


    ## 10.3 Drawing the axes


    This iteration involves drawing both axes of the coordinate system and thus the
    two next iterations are combined into a single iteration. Generally, there are
    many challenges in drawing the axes of the coordinate system, among other things
    because they have to behave nicely when the size of the window changes, but JavaFX
    has in the `Chart API` classes representing axes to a coordinate system, and especially
    the class `NumberAxis`. Since this class is actually general (has enough settings),
    it has been decided to use it instead of to write a custom component. Therefore,
    the two iterations to the coordinate system’s axes are combined into a single
    iteration.


    A single model class has been added that represents an axis:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_194.jpg)


    where the meaning is as follows:


    * the lowest value on the axis

    * the greatest value on the axis

    * number of decimals to be used to display the axis numerical values

    * the interval length between the points of the axis

    * label (name) to the axis

    * where the axis should cross the second axis

    * if the axis automatically determines the division from the smallest and greatest
    value

    * if the axis divisions are to be displayed

