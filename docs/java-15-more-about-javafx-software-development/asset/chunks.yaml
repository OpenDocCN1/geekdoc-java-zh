    ## 4.1 简单的“按下-拖动-释放”手势


    顾如名，它是拖放最简单的形式，用于操作仅涉及单个节点的情况，该节点即启动手势的节点。在操作期间，会触发所有的 `MouseDragEvent` 类型事件：


    * `MouseDragEntered`

    * `MouseDragOver`

    * `MouseDragExited`

    * `MouseDragReleased`


    但它们仅被发送到源节点。例如，下方显示了一个包含两个 `Label` 控件的窗口应用程序。通过指向顶部并按住鼠标，窗口背景会变为浅绿色；移动鼠标时，文本颜色变为黄色，背景变为浅蓝色。如果你在窗口内到处移动鼠标，什么都不会发生——即使你将鼠标拖到底部的
    `Label` 上也是如此。然而，当你松开鼠标时，顶部 `Label` 的背景颜色和文本颜色将分别恢复白色和黑色。该示例展示了如果为 `Label`（以及任何其他节点）启动拖动手势并在窗口内移动鼠标，会发生什么。


    ![](img/Image2002.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_116.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_117.jpg)


    该程序定义了两个 `Label` 控件作为实例变量，并分别有两个 `Color` 和 `Background` 属性。这里你应该特别注意，静态方法 `background()`
    为特定颜色创建了一个 `Background` 对象。`getRoot()` 方法初始化组件并创建程序的视图。这里你应该注意 root 是一个 `VBox`，并且该方法将其背景绑定到属性
    `bg`，类似地，顶部 `Label` 的文本颜色绑定到属性 `fg`。最后是 `start()` 方法，而这里最重要的一点是，每个 `Label` 控件都关联了
    4 个事件处理器。顶部分配了两个拖动事件处理器，而底部则分配了全部 4 个拖动事件处理器。这意味着你必须观察到这些事件处理器永远不会被执行。简单的“按下-拖动-释放”手势仅与节点相关——并且仅向该节点发送有关拖动的通知——即操作启动的节点（按下按钮时鼠标指向的节点）。操作在松开鼠标时结束，无论此时鼠标指向何处处。


    ## 4.2 完整的“按下-拖动-释放”手势


    当源节点接收到 `MouseDragDetected` 事件的通知时，可以通过调用 `startFullDrag()` 方法启动一个完整的“按下-拖动-释放”手势。此外，源节点的
    `mouseTransparent` 属性必须设置为 `false`，这样该节点就不会接收所有的拖动通知。`FullpressDnD` 示例与上面的程序几乎相同，并打开相同的窗口。点击顶部
    `Label` 会启动拖动操作，结果立即产生与上述相同的结果，但当鼠标拖到底部 `Label` 上时，窗口背景变为深蓝色，而底部 `Label` 中的文本变为白色。如果鼠标再次从底部
    `Label` 拖出，顶部 `Label` 的文本颜色将变为紫色。当松开鼠标时，它会恢复默认值。这次的代码如下：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_118.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_119.jpg)


    这次定义了两个 `Color` 对象的属性，以便两个 `Label` 控件的文本颜色都绑定到一个属性（通过 `getRoot()` 方法）。否则，你应该先注意哪些事件处理器关联了两个
    label。当鼠标指向顶部 label 并按下鼠标时，`mouseTransparent` 被设置为 `true`（`startDrag()` 方法），并在松开鼠标时被置回
    `false`（`endDrag()` 方法）。最后，注意 `lbl1` 在 `dragDetected` 处执行了 `startFullDrag()`，结果是这次组件
    `lbl2` 接收了拖动通知。鼓励你实验该程序并观察每个事件发生的时机。这里你应该特别注意底部 label 的 `dragReleased`，它会改变顶部
    label 中的文本。如果你在鼠标指向底部 label 时释放鼠标，它就会执行。


    ## 4.3 拖放手势


    拖放手势的最后形式通常是通用的，也可能也是最常用的，用于从源节点提取数据并将其放置在目标节点上。该手势可能涉及同一个应用程序内的节点，也可能涉及两个不同 Java
    应用程序中的节点。事实上，两个应用程序并不一定都是 Java 应用程序。


    通常情况下，一个拖放操作包含以下动作：


    * 指向节点并按住鼠标的一个按键

    * 在按住按钮的同时移动鼠标，节点获取 `DragDetected` 事件并必须执行 `startDragAndDrop()`，之后该节点成为手势源节点，且当前数据被放置在剪贴板上

    * 启动拖放手势后，系统不再发送 `MouseEvents`，而是发送 `DragEvents`

    * 如果手势源被拖动到手势目标上方，它将检查是否接受

    * 如果用户在指向手势目标时释放鼠标，它将应用数据并发送 `DragDropped`

    * 当手势源接收到 `DragDone` 事件时，表示操作已完成（注：此处原文漏掉了动词，已意译补全）


    在本节中，我将通过三个示例来演示拖放，第一个示例是 `TextDnd` 并打开如下：


    ![](img/Image2010.jpg)


    与之前的示例窗口基本相同，除了在 Label 控件之外增加了一个框架，并添加了一个按钮。在这个示例中，拖放手势从顶部 label 拖动文本并将其到底部 label。拖放手势可以通过两种方式执行（实际上
    Java 10 书中提到三种），其中一种是复制数据（此处顶部 label 中的文本），另一种是移动它。这里的按钮文本 `Copy` 意味着执行复制手势。点击按钮会更改文本，这是一个移动手势，同时重置窗口。代码如下：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_122.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_123.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_124.jpg)


    关于实例变量，它们是不言自明的，但请注意用于指示手势应该是复制还是移动的最后一个。其类型是一个枚举。创建程序视图的 `getRoot()` 方法没有包含新内容，但在
    `start()` 方法中你应该注意关联了哪些事件处理器。通常，源节点必须关联两个事件处理器：`DragDetected` 和 `DragDone`。目标节点相应地必须关联两个事件处理器：`DragOver`
    和 `DragDropped`。与之对应的是示例中最重要的这 4 个事件处理器。


    `dragDetected()` 方法首先测试是否存在实际的数据元素，在这里如果顶部 label 显示了文本。如果是，则在源节点上执行 `startDragAndDrop()`，参数是要执行的操作。该方法返回一个
    `DragBoard` 对象，它是代表剪贴板的对象。事实上，`DragBoard` 是 `Clipboard` 类的子类。`dragDetected()`
    方法还引用了剪贴板，它将文本保存到剪贴板上并最终用剪贴板上的当前内容更新 `DragBoard` 对象。

