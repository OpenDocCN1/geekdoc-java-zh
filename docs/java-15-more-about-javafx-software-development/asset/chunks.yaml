    标题栏和边框被称为窗口的装饰（decorations）或样式（styles），这里实际上更多选项，它们被定义为 `Stage` 对象的属性。我想提到三个：


    1. `StageStyle.DECORATED`：默认值，窗口具有标题栏和边框。

