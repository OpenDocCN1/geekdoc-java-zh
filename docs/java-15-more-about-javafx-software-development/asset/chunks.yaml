    ![](image/Image2080.jpg)


    which contains 7 custom controls. The top three have the type `LabelField`, consisting
    of a `Label` and a `TextField`, while the 4 lower ones have the type `Spinner`.
    It’s a kind of button and clicking on the circle it will rotate the line (default
    2 seconds), after which the component will trigger an `ActionEvent`. The program’s
    `start()` method is as follows:


