    to the column and to its header, where the last is defined in a style sheet. The
    method `getToCol()` is written in the same way and does not appear here.


    Then there is method `getCountryCol()`, which creates a `TableColumn` for `Boolean`
    objects. A `CellValueFactory` is assigned to specify which value a `King` object
    should result in, depending on the value of the `country` property. Is it `DK`,
    the value must be `true` and otherwise `false`. You should note that the value
    wrappers in a read-only property, and the reason is that the `TableView` component
    should be able to bind to the value. Finally, a `CellFactory` is associated with
    the column telling how the value should be displayed and that it should be like
