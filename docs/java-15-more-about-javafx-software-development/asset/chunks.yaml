    As example, I will look at a program that can maintain this database, and when
    the program starts, it must open the following window:


    ![](image/Image2050.jpg)


    as in a `TableView` shows an overview of the database’s addresses. If you click
    on the button, you will see the window below where you can create a new address
    and you get the same window (but initialized with data) if you double-click on
    an address in the table:


    ![](image/Image2058.jpg)


    The program consists of 9 classes:


    ![](image/Image2065.jpg)


    and in the following I will mention the most important of these classes and the
    choices made. If you start with the model layer, it has two classes, and one of
    the purposes is that the model via data binding should send notifications to the
    user interface, but also the view component classes should automatically update
    the model. For example, the class `Address` must have JavaFX properties corresponding
    to all columns in the database table, and since the classs `Addresses` should
    represent the table in the above window, it must have an `ObservableList<Address>`
    and have methods that can return the columns to the `TableView` component. The
    model classes `Address` and `Addresses` must thus be written according to a precise
    pattern that supports JavaFX. In one way or another, it does not fit with that
    you want to separate the model and its classes from the rest of the code so that
    they can be written independently of how the model has to be used. Therefore,
    a DAL layer is defined under the model layer, which consists of two classes `Person`
    and `Persons`, the first being a usual model class, representing an entity in
    the database, and containing no other than instance variables using conventional
    `get` and `set` methods. The class `Persons` consists primarily of 4 methods,
    one of which returns a `List<Person>` with the content of the database, where
    the other three are for SQL INSERT, UPDATE and DELETE operations. With this DAL
    layer available, the class `Address` is no more than a thin wrapper of the class
    `Person`, where each property is encapsulated in a JavaFX property. However, the
    class has a method `invalidate()`, as in relation to the current task, can validate
    if an `Address` object is legal.


    The class `Addresses` has an instance of the class `Persons`, starting with reading
    data in the database, to create an `ObservableList<Address>`. In the same way
    as shown in the examples, the class defines methods for individual columns so
    that they can bind to the `TableView`. In addition to this, the class has methods
    `save()` and `remove()` used to save and delete data. In principle, these methods
    are trivial and do not so much other than calling the corresponding methods in
    the class `Persons`, but at the same time they must ensure the class’s `ObservableList`
    is synchronized with the database.


    Back there are the presentations and view components. The class `AddressesView`
    must define the main window:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_138.jpg)


    and in addition to the above, there is only `createForm()`, which initializes
    a `BorderPane` with a `TableView` and a `Button`. There is therefore no logic
    including event handlers in this class. You should note that the class inherits
    `BorderPane`. Also note the parameter of the constructor, which is the model and
    thus an object of the type `Addresses`. Finally, note the two instance variables,
    which are references to the window’s controls. These variables have no visibility,
    and thus they have the package visibility so that they can be used from the presenter
    class, which has the task of creating the event handlers. It is therefore necessary
    that the view and presenter are in the same package. The presenter class is as
    follows:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_139.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_140.jpg)


    It is thus the presenter class that creates the view class. It is not actually
    completely consistent with the pattern as most people choose to create view objects
    outside the class and then transfer it as a parameter to the constructor. Since
    I have not done it, it is necessary to add a method `getView()` such that you
    can refer to the view object in the main class. The class’s constructor has as
    parameters the model and a reference to the primary `Stage` object. It is used
    as the owner of the dialog window to edit an address. You should note the method
    `addHandlers()` as the method that associates event handlers to nodes defined
    in the view component. In this case, an event handler must be attached to double-click
    a row in the `TableView` component as well as an event handler for the button.
    In either case, the method `add()`, which opens the dialog to either create a
    new address (where the current parameter is a new `Address` object) or to edit
    an existing address (where the address is the object of the line that is double-clicked).


    The dialog box is defined as the following class, which is a `GridPane`:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_1401.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_141.jpg)


    Here you should note that all nodes that can be referred by the event handlers
    are defined with package visibility so that they can be referenced in the presenter
    class. In some way, it violates object-oriented principles where variables must
    be private, but if one wishes to comply with these principles, it is necessary
    to write get methods for all instance variables. Therefore, you typically implement
    the MVP pattern as above and require that the view and presenter are in the same
    package. You should note the method `bindFields()` that creates bidirectional
    bindings for all fields, and it is here that it is necessary that the model class
    `Address` has JavaFX properties that you can bind to. This means that the values
    entered automatically update the model class, and vice versa that modifications
    of the model automatically update the user interface.


    The corresponding presenter class is basically simple and resembles the previous
    presenter class, and among other things it is this class that creates the view
    component. However, there is a problem to be solved. If you edit an address, the
    model is automatically updated because of the bindings, which is incorrect if
    you close the dialog with cancel. In this case, the entries that have been made
    must be canceled. Therefore, the dialog must work on a copy, so only in case of
    clicking `OK`, updates the original `Address` object.


    Then there is finally the main program, which starts it all:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_142.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_143.jpg)


    There is not much to explain, but you should note how the method `start()` creates
    a presenter and a model that is sent as a parameter for the presenter class’s
    constructor. The architecture of the completed program can be illustrated as follows:


    ![](image/Image2073.jpg)


