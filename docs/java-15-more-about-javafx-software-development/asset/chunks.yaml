    of these properties before they are bound. Next, *x* is bound to *y* and the next
    *println()* statement shows that *x* now has the same value as *y*. Then *x* is
    bound to *z*, which means that *x* has the same value as *z*, and since *x* is
    bound to *y* and since the binding is bidirectional, the value of *y* also becomes
    the value of *x*. The next *println()* statement shows that the three properties
    now all have the same value. Now, the value of *z* changes to 11, and when the
    three properties are printed again, they all have the value 11\. Then the bindings
    are removed and the three properties are printed again, and you can see that they
    still have the value 11\. Finally, the values of the three properties are changed,
    after which they are printed and the new values are shown:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_23.jpg)


    In JavaFX, all read/write properties support bidirectional binding, and as an
    example of how it can be used, consider the following class:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_231.jpg)


    Note that it is a JavaFX window (inherits the class *Application*) and there is
    only a *start()* method. Here a red circle is inserted as a node in a scene graph.
    Next, three properties are bound, that are the circle’s center and radius, to
    the width and height of the scene object so that the circle’s center becomes the
    center of the window while the radius becomes the largest possible so that the
    entire circle is displayed. The window will thus show a circle:


    ![](image/Image1775.jpg)


    and change the size of the window, you will see that the circle follows the window
    as it always sits in the middle of the window, and the radius changes depending
    on the window size.


    You should also note how to open the window from the main program:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_24.jpg)


    As another example, the method *test07()* opens the following window:


    ![](image/Image1782.jpg)


    which includes a *Slider*, a *Label* and three *Button* controls. Here, the *Slider*
    component is bound to the property *step* in the class *Counter* with a bidirectional
    binding while the *Label* component is bound to the property *value* in the class
    *Counter* with a unidirectional binding:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_25.jpg)


    A *Label* control has a *StringProperty* property *textProperty*, and a *Counter*
    has a property *valueProperty* of the type *ReadOnlyIntegerWrapper*. Since the
    latter is read-only, you can not of course create a bidirectional binding, but
    a *ReadOnlyIntegerWrapper* has an *asString()* method, which returns a *StringBinding*
    object, and allows it to create a unidirectional binding. The result is that if
    the property *value* in the *Counter* object changes (clicking the *Down* and
    *Up* buttons), then the *Label* object will automatically be updated. A *Slider*
    control has a *valueProperty* of the type *IntegerProperty*, and the same applies
    to the class *Counter*, which has a *stepProperty* of the same type. You can therefore
    create a bidirectional binding between these two properties. The result is that
    if you change the slider, the *Counter* object’s step property is updated. If
    you click the *Reset* button, it sets the value of *step* to 1, and since the
    slider binding is bidirectional, the slider component is automatically updated.


