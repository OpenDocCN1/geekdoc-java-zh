    must be deleted. All cells must be editable and for the `Name`, `Title`, `Birth`,
    and `Death` columns, a `TextFieldTableCell` should be used, while for the `Country`
    column a `ComboBoxTableCell` should be used. The database has a `Country` column,
    and the `ComboBox` must be initialized with the country codes. A `TextField` is
    used to filter the list, and the `TableView` is wrapped in a `FilteredList` and
    `SortedList`.


    ## 3.3 Filters


    One of the important features of a `TableView` is the use of filters, and with
    a `TableView`, it’s all a bit easier. A `TableView` shows the content of an `ObersList`
    and you can set a filter with a filter wrapper. To conclude this review of the
    `TableView` component, I will show an example that sets a filter.


    The example is called `FilterKings` and I want to reuse objects of the type `King`,
    and the data model for the `TableView` component is essentially unchanged from
    previously and will not be shown here.


    The window’s code is:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_85.jpg)!(image/Java_15_–_More_about_JavaFX_5-4-18_86.jpg)


    There is nothing new in the `start()` method, and the new is done in the method
    `initialize()`, which initializes the table control. Note first that a filter
    is created for the data to be shown in the table, and the type for a filter is
    `FilteredList`. Next, a listener must be associated with the input field, which
    is defined as a predicat for the filter, and as in this case returns true if a
    `King` object’s name property contains the value of the input field – without
    distinguishing between upper and lowercase letters. Finally the filter is inserted
    in a wrapper as a `SortedList`, which has a comparator that binds to the table’s
    comparator. Finally a `sorter` object is used as the data model for the table.


    If you run the program, you get the following window, where at the bottom there
    is a entry field used to enter a filter for the `Name` column:


    ![](image/Image1900.jpg)


