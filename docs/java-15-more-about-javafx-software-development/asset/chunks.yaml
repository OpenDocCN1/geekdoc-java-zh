    The method `dragDone()` is not always necessary, but in this case it tests whether
    it is a `Move` operation, and if so, the method is responsible for deleting the
    text in the `Label` component – that is, in source node. The method `dragOver()`
    is performed when the user passes the mouse over a target node. The method tests
    whether something is on the clipboard, and if that is the case, `acceptTransferModes()`
    is performed, which means that the cursor changes, so you can visually see that
    you are over a node where you can drop.


    Finally, there is the method `dragDropped()`. In this case, it starts testing
    whether there is a string on the clipboard, and if so, the text is retrieved and
    the label component’s text is updated. Then the method `dropCompleted()` is performed,
    which sends a notification to the source node that the operation has been completed.
    Before leaving the program, you should also note the method `reset()` used as
    event handler for the button and among other switches mode, so the next drag-and-drop
    operation may be a `Move` gesture.


    As the next example, I’ll show you how to drag an image into an application where
    it can be either an image or a file that contains an image. That is, you can drag
    a data element that represents an image from another program (such as the `Files`
    program) to the current application. The example is called `ImageDnD` and opens
    the following window, which contains a button and an `ImageView` control:


    ![](image/Image2019.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_125.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_126.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_127.jpg)


    The method `createRoot()` that creates the program’s view does not contain anything
    new, and the task is to initialize the `ImageView` controller. Note, however,
    that the button is assigned an event handler which deletes the content of the
    `ImageView` component. The method `start()` assigns two event handlers to the
    `Scene` object, which means that you can drop an object in the application’s window.
    There are only two handlers since the program this time does not have a source
    gesture node – a drag-and-drop operation is initiated in another application.
    `dragOver()` has the same function as in the previous example, and you should
    note how to test if the clipboard has a data element that the program can accept.
    It is likewise tested in the `dragDropped()` method and depending on what data
    item is (an image or a file), a method is called that performs the data transfer.
    Here you should especially note the method `transferImageFile()` and the syntax
    used. This means that the file name must be used to load that image from a file.


    As the last example of drag-and-drop, I will show a program where you can drag
    an object of a custom type. The example is called `PersonDnD` and opens the following
    window:


    ![](image/Image2030.jpg)


    The window contains two `ListView` controls. Each line in the left `ListView`
    represents a `Person` object, and these objects can be draged to the right by
    a drag-and-drop gesture. Similarly, you can drag objects from right to left. A
    `Person` object is a very common model class that represents a person with two
    characteristics:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_128.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_129.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_130.jpg)


    There is only one thing to observe, namely that the class is serializable. It
    is a prerequisite for objects to be used in a drag-and-drop gesture. Also note
    that this means that the types of the class’s instance variables must be serializable.
    The class `PersonDnD` is:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_1301.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_1311.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_1321.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_133.jpg)


    Custom types can not be immediately transferred via the clipboard as they do not
    have a known mime type. This means that a target node can not test what is on
    the clipboard. Therefore, the program starts by creating a static object of the
    type `DataFormat` named `PERSON_LIST`. The value is not important. It just has
    to be a name that is unique (for the program). The method `getRoot()` fills a
    part, and it must, among other things, initialize the left `ListView` with 6 Person
    objects. These objects are created in the method `getPersons()`, but I have not
    shown the code. Note that for both `ListView` controls, are select `MULTIPLE`,
    so the user can select more `Person` objects. However, the most important thing
    is that 4 event handlers are assigned to each control, since both controls can
    be both source and target gesture nodes.


    The methods (there are 4) that the event handlers call are `dragDetected()`, `dragOver()`,
    `dragDropped()`, and `dropCompleted()`. The `dragDetected()` method is used to
    initiate the drag operation, while `dragOver()` is used to check if the target
    can accept the data. The `dragDropped()` method handles the actual data transfer,
    and `dropCompleted()` notifies the source node that the operation is finished.
    The `dragDone()` method is used to clean up resources.


    # 5 MVC


    I have treated the `Module-View-Controller` pattern earlier, which is the design
    pattern of a GUI program, and in this context, I also mentioned that there are
    several versions of the pattern, partly because of the development tools used,
    but also due to the API used. Should you use JavaFX fully, you should use `Module-View-Presenter`
    pattern, which you sometimes see shortened as `MVP`. The pattern can be sketched
    as follows:


    ![](image/Image2043.jpg)


    The principle is that the program’s view takes care of everything regarding the
    visual, but can turn to the model to get the data to be displayed. user interaction
    takes place in the view layer, but when there is a user interaction, it is sent
    to the presenter module, which takes care of it. That is, a window’s event handlers
    are placed a presenter class that as a result can update the view and execute
    commands on the model. When the model is updated as a result of commands from
    the present, it can send notifications, which the view component can listen to
    and possibly read the model to ensure the synchronization between model and view.


    It’s the principle, and in fact, is not very different than I’ve previously mentioned
    about MVC, just the pattern is drawn in a way that directly supports JavaFX. Another
    thing, however, is what it means in the code, and especially who is responsible
    for creating the individual objects, and it is best illustrated with an example.


    Looking at the previous examples in this book, they basically had a 2 layer architecture
    consisting of a view layer and a model layer. The most important thing in the
    above pattern is actually a more accurate breakdown of the view layer in a view
    component and a presenter component. In previous books, I have used a database
    `addresses` that only have a single table:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_135.jpg)

