    ## 2.7 Modality


    As you know it from Swing, a dialog box can be modeless or modal, and of course
    it also applies in JavaFX, where it is a property of the *Stage* object. There
    are three options:


    1.  *Modality.NONE*, where the result is a modeless window, which is the default
    for a *Stage*


    2.  *Modality.WINDOW_MODAL*, which is modal and blocks all windows that directly
    or indirectly own this window


    3.  *Modality.APPLICATION_MODEL*, which is modal and blocks all of the application’s
    other windows


    The following example shows the syntax, but also shows that an application may
    well have multiple *Stage* objects and thus windows (or dialogs) that explicitly
    create a *Stage* object. The *StageView* class opens the following window:


    ![](image/Image1830.jpg)


    where each of the four top buttons opens a dialog box by instantiating a new *Stage*
    object, and the difference is partly modality and partly if the dialog has an
    owner. For example, the first is modeless and without an owner. This means clicking
    on the top button, the program will open a dialog box and then click at the cross
    in the main window’s title bar (and you can because the dialog is modeless) closes
    the main window but not the dialog and the program does not terminate, before
    closing the other window.


    The last button is included to show that a *Stage* object also has a method, so
    you can say that the window should be displayed full screen. Note that displaying
    a full screen window you returns to normal viewing by pressing ESC – or clicking
