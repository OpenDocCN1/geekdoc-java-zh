    The starting point for 3D graphics is a 3D coordinate system with the origin in
    the upper left corner of the screen and a z axis that points into the screen while
    the x-axis and the y-axis are oriented in the same way as in 2D graphics. If in
    2D you add two shapes to the scene graph that overlap, it is the figure added
    last that overlaps the first, but this is not necessarily in 3D, as the depth
    also plays a role. It can be illustrated with the program `Rectangles3D` that
    opens the following window:


    ![](image/Image2124.jpg)


    where you should note that the green rectangle is drawn in front of the red. The
    program’s code is:


    ```

    ![](image/Java_15_–_More_about_JavaFX_5-4-18_164.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_165.jpg)

    ```


    In the method `start()`, two rectangles, a red and a green are defined, and the
    new is that this time, there is also defined a value for the z axis, that respectively
    is 400 and 300. That is, the red rectangle lies farther away than the green one.
    The two rectangles are added to a `Group` node, but so that the red is added last,
    and it should therefore overlap the green, but that is the opposite that happens
    as the red is farther away. To make it happen, two more things have to be done.
    When you create the `Scene` object, you must specify another parameter that tells
    to use 3D graphics, and you should also attach a camera to the scene graph.


    The window also has a checkbox and the meaning is that you can turn the 3D effect
    on or off and unchecking the box displays the graphics as the usual 2D graphics,
    where the red rectangle will overlap the green.


    ## 8.1 Box, Sphere and Cylinder


    As mentioned, JavaFX is born with three shape classes, representing respectively
    a box, a sphere and a cylinder. All classes inherit from `Shape3D` and inherit
    here three crucial properties:


    1. material

    2. drawing mode

    3. cull face


    as all are explained later, but the first is used in the following example, and
    as the name says, it tells how the surface should be drawn. When you create a
    `Shape3D`, it has its center in the starting point of the coordinate system, but
    as it is a node, it can be moved using a transformation. Finally, its position
    and size are determined by the camera used to display the figure, and where the
    camera is located in the coordinate system. The current location of the camera
    can make it difficult to predict the actual location of a figure. The application
    `ShapesProgram` opens the following window and shows examples of the three shapes:


    ![](image/Image2137.jpg)


    The box object has been moved with a translation but is also rotated. The others
    are moved with a translation, but when the cylinder is slightly deformed, it is
    because the camera is located at the left. You should also note that the color
    is determined by the location of the light. The code is as follows:


    ```

    ![](image/Java_15_–_More_about_JavaFX_5-4-18_166.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_167.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_168.jpg)

    ```


    The code is actually quite simple and easy enough to figure out, but on the other
    hand, the effect is more difficult to figure out. All of this happens in the last
    5 methods that create a `Box` object, a `Sphere` object, a `Cylinder` object,
    a `PointLight` object and a `PerspectiveCamera` object, respectively. With respect
    to the `Box` object, it is a box of 100 × 150 × 300 which is displaced at the
    point (150, 200, 200) and thus at a point that is 200 behind the screen. Afterwards
