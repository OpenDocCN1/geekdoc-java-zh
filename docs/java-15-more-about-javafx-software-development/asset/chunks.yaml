    # 9 Charts


    In the final example of the book Java 10, I looked at a library that has classes
    for representation of graphs. As mentioned, there are many such libraries, and
    there are actually many examples of tasks where there is a desire for a graphical
    presentation of data, but in JavaFX it is easy as there is an API directly for
    that purpose, which has the most common graphs. The following is an introduction
    to this API, which basically include the following classes:


    ![](image/Image2238.jpg)


    In addition, there are other auxiliary classes, including classes that represents
    the data that the individual graphs should illustrate, and there are classes to
    the axes of the coordinate system. The API can thus show 8 different graphs divided
    into two categories consisting of a *PieChart* and then the others. A graph is
    a graphical illustration of a number sequence, and a *PieChart* can show a single
    number sequence, while the others can display more called series in a xy-coordinate
    system. In the following example I would like to illustrate the following graphs:


    *   PieChart


    *   BarChart (two versions)


    *   StackedBarChart


