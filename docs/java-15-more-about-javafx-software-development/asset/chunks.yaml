    ## 3.2 Edit cells in a TableView


    I will now show an example that, in principle, looks like the above examples,
    but where you can edit the content of the individual cells. Although it may not
    be surprisingly new, it is still relatively simple. In general, it works that
    way that you double-click on the cell you want to edit, after which the cell opens
    with the option of changing the value. When the cell is opened, it happens by
    the cell shows another control that basically can be


    1. `CheckBoxTableCell` (see the previous example)

    2. `ChoiceBoxTableCell`

    3. `ComboBoxTableCell`

    4. `TextFieldTableCell`


    and you can also define your own controls. To show how it works, I will use another
    object type this time, which is a class that represents a Person:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_72.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_73.jpg)


    It’s a standard JavaFX model class, so I do not show the details here. The class
    is an extension of the class `Person` that I have used in the previous chapter,
    but this time, objects are assigned a current ID represented as a readonly property.
    In fact, the interpretation of the last four properties, it is not important,
    but it could be birth year (for `year`), salary (for `salary`) and whether the
    salary is weekly or monthly (for `weekly`). Finally, the last property could be
    interpreted as the date of employment. The important is not the interpretation,
    but the parameters have different types. If you run the program, the result could
    be as shown below, where all values except the `Id` column can be edited. The
    `Add` button is used to add a new row to the table, thus creating a `Person`,
    while the `Remove` button is used to delete the row that is selected.


    ![](image/Image1885.jpg)


    In addition to the class `Person`, the project has a class called `PersonModel`:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_731.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_74.jpg)


    which represents the persons on whom the program is working. The method `initialize()`
    creates 6 persons, so the table is not empty when the program starts. Note that
    the objects are stored in an `ObservableList` to `Person` objects and note how
    the methods `add()` and `remove()` maintains this list.


    Otherwise I want to start with the class `EditPersonsProgram`:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_74.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_75.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_76.jpg)


    The class starts by defining a model object – not for the `TableView` component,
    but for the data that the program needs to maintain. In addition, a `TableView`
    for `Person` objects are defined. In the method `start()` where the table is created,
    there is not much new to explain, but you should note that the table columns are
    created by methods in a class `PersonTableModel` this time. Finally, note that
    the table is defined as `editable`:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_761.jpg)


    and that’s all you need to edit the cells if a column relates to read/write property
    and if the column has a `CellFactory` that is a `TableCell` control. You should
    also note the event handlers where the `Add` button handler is trivial, while
    the handler for the `Remove` button requires you to determine the index for the
    row that is selected. Finally, there is the handler for the `Test` button, which
    on the console prints the objects in the list. The goal of this handler is to
    test whether there is consistency with what the `TableView` control shows and
    what the model contains. It is to show that changes in the `TableView` control
    automatically updates the model.


    Then there is the class `PersonTableModel` that has methods that create the table
    columns. On the other hand, it is also the most complex of the program’s classes.

