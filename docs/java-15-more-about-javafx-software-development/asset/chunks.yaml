    作为示例，我将查看一个可以维护此数据库的程序，当程序启动时，必须打开以下窗口：


    ![](img/Image2050.jpg)


    其中一个 `TableView` 显示了数据库地址的概述。如果你点击按钮，将看到下面的窗口，你可以在那里创建一个新地址；如果你双击表格中的某个地址，你将得到相同的窗口（但已初始化数据）：


    ![](img/Image2058.jpg)


    该程序由 9 个类组成：


    ![](img/Image2065.jpg)


    在下文中，我将提到这些类中最重要的以及所做的选择。如果你从模型层开始，它有两个类，其中一个目的是让模型通过数据绑定向用户界面发送通知，但同时视图组件类也应该自动更新模型。例如，`Address`
    类必须具有与数据库表所有列相对应的 JavaFX 属性，由于 `Addresses` 类应该代表上述窗口中的表格，它必须拥有一个 `ObservableList<Address>`，并拥有可以将列返回给
    `TableView` 组件的方法。因此，模型类 `Address` 和 `Addresses` 必须按照支持 JavaFX 的精确模式编写。以某种方式，这与你想要将模型及其类与其他代码分离，以便它们能够独立于模型的使用方式进行编写的想法是不符的。因此，在模型层下面定义了一个
    DAL 层，它由两个类 `Person` 和 `Persons` 组成，第一个是普通的模型类，代表数据库中的实体，仅包含使用常规 `get` 和 `set`
    方法的实例变量。`Persons` 类主要由 4 个方法组成，其中一个方法返回包含数据库内容的 `List<Person>`，另外三个用于 SQL INSERT、UPDATE
    和 DELETE 操作。有了这个 DAL 层后，`Address` 类仅仅是 `Person` 类的一个薄封装，每个属性都封装在 JavaFX 属性中。然而，该类有一个方法
    `invalidate()`，与当前任务有关，它可以验证一个 `Address` 对象是否合法。


    `Addresses` 类拥有 `Persons` 类的实例，从读取数据库中的数据开始，创建一个 `ObservableList<Address>`。与示例所示，该类为各个列定义了方法，以便它们可以绑定到
    `TableView`。此外，该类还有 `save()` 和 `remove()` 方法，用于保存和删除数据。原则上，这些方法是简易的，除了调用 `Persons`
    类中的相应方法外没有做其他事情，但它们同时必须确保类的 `ObservableList` 与数据库同步。


    后面是演示和视图组件。`AddressesView` 类必须定义主窗口：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_138.jpg)


    除了上述内容，只有 `createForm()`，它初始化了一个带有 `TableView` 和 `Button` 的 `BorderPane`。因此，该类中不包含包括事件处理程序在逻辑。你应该注意该类继承了
    `BorderPane`。还要注意构造函数的参数，它是模型，即类型为 `Addresses` 的对象。最后，注意两个实例变量，它们是对窗口控件的引用。这些变量没有可见性，因此它们具有包级可见性，以便可以在演示者（presenter）类中使用，该类的任务是创建事件处理程序。因此，视图和演示者必须在同一个包中。演示者类如下：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_139.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_140.jpg)


    因此是演示者类创建了视图类。这实际上与模式并不完全一致，因为大多数人选择在类外部创建视图对象，然后将其作为参数传递给构造函数。由于我没有这样做，有必要添加一个
    `getView()` 方法，以便在主类中引用该视图对象。类的构造函数的参数是模型和对主 `Stage` 对象的引用。它被用作编辑地址的对话框所有。你应该注意
    `addHandlers()` 方法，它是将事件处理程序关联到视图组件中定义的节点的方法。在这种情况下，必须为 `TableView` 组件中的行双击附加一个事件处理程序，以及为按钮附加一个事件处理程序。无论哪种情况，`add()`
    方法都会打开对话框来创建新地址（此时当前参数是一个新的 `Address` 对象）或编辑现有地址（该地址是双击行对应的对象）。


    对话框定义为以下类，它是一个 `GridPane`：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_1401.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_141.jpg)


    在这里你应该注意，所有可以被事件处理程序引用的节点都是用包级可见性定义的，以便可以在演示者类中引用。这在某种程度上违反了面向对象的原则（即变量必须是私有的），但如果希望遵守这些原则，就有必要为所有实例变量编写
    get 方法。因此，通常实现 MVP 模式，并要求视图和演示者在同一个包中。你应该注意 `bindFields()` 方法，它为所有字段创建双向绑定，在这里有必要
    `Address` 类具有可以绑定的 JavaFX 属性。这意味着输入的值会自动更新模型，反之，对模型的修改会自动更新用户界面。


    相应的演示者类非常简单，类似于之前的演示者类，此外是该类创建了视图组件。然而，有一个问题需要解决。如果你编辑地址，由于绑定的存在，模型会自动更新，如果你取消关闭对话框则是错误的。在这种情况下，所做的输入必须被取消。因此，对话框必须在副本上操作，只有在点击
    `OK` 时才会更新原始的 `Address` 对象。


    最后是主程序，它启动了一这一切：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_142.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_143.jpg)


    没什么好解释的，但你应该注意 `start()` 方法如何创建演示者和模型，并将其作为参数传递给演示者类的构造函数。完成程序的架构所示：


    ![](img/Image2073.jpg)


    # 自定义控件


    很少需要编写自己的控件，但这种可能性是，并且这可能是开发自己的自定义控件的任务。控件必须直接或间接继承自 `Node` 类，以便它可以像所有其他控件一样成为场景图的一部分，但在大多数情况下，人们会通过继承现有控件的类来编写自定义控件，因为它是为了最重要的功能设计的。如果你打开
    `UserControlProgram` 程序，将得到下面的窗口：


    ![](img/Image2080.jpg)


    其中包含 7 个自定义控件。上面的三个是 `LabelField` 类型，由 `Label` 和 `TextField` 组成，而下面的四个是 `Spinner`
    类型。它是一种按钮，点击圆形时它会旋转（默认 2 秒），之后组件将触发一个 `ActionEvent`。程序的 `start()` 方法如下：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_145.jpg)

