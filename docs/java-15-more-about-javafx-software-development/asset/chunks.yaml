    其中 `idCol` 是带有 `id` 行（因此是键）的第一列的名称。第一条语句表示应该能够隐藏列，而第二条语句表示 `idCol` 在启动时应该被隐藏。如果你运行该程序，你会注意到滚动条上方的标题行中有一个小的加号。点击它，会弹出一个小窗口，你可以在其中点击以决定是否隐藏或显示各个列。


    ![](img/Image1870.jpg)


    下一个示例名为 `RenderKingsProgram`，它会打开以下窗口：


    ![](img/Image1877.jpg)


    并将向你展示如何定义各个单元格内容的显示方式。在这种情况下，如果 `From` 列的值为 0，则内容将显示为空，这意味着你不知道国王统治期的开始时间。如果
    `To` 列的值为 9999，情况也是如此。此外，由于列列都是右对齐的。最后，最后一列将 `country` 属性的值显示为一个复选框，如果值为 DK，则复选框被选中。


    再次显示的对象类型为 `King`，而最重要的变化仍然在 `KingTableModel` 类中：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_68.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_69.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_70.jpg)


    该类的起始部分与第一个示例基本相同。也就是说，构造函数、`getKing()` 方法和 `getNamCol()` 方法没有更改，因此此处未显示它们。然而，`getFromCol()`
    方法有所不同。它仍然需要为属性 `from` 返回一个 `TableColumn`，该列对象像以前一样创建，但随后使用 `setCellFactory()`
    方法来告诉如何显示该值。这是通过一个 `TableCell` 对象实现的，该对象是一个定义了 `update()` 方法的接口。该方法的参数是待渲染的对象，以及一个告知单元格是否为空的
    `boolean` 值。如果有非零内容，则使用它来更新单元格。在与 `TableCell` 关联后，该列被分配了一个首选宽度，并且一个样式附加到列及其表头，其中表头定义在样式表中。`getToCol()`
    方法以相同的方式编写，此处未在此出现。


    然后是 `getCountryCol()` 方法，它创建了一个用于 `Boolean` 对象的 `TableColumn`。分配了一个 `CellValueFactory`
    来指定根据 `country` 属性的值，`King` 对象应该产生什么值。如果是 `DK`，则值必须为 `true`，否则为 `false`。你应该注意，值包装器在只读属性中，原因是
    `TableView` 组件应该能够绑定到该值。最后，与该列关联了一个 `CellFactory`，告诉如何显示该值，以及它应该像一个 `CheckBoxTableCell`（它是复选框的包装器）。注意，你还指明了复选框必须用当前列的值进行初始化。


    然后是带有 `start()` 方法的主程序：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_701.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_71.jpg)


    它看起来与上面的示例相似，但应该简单介绍如何选择行。首先，你应该能够选择 `MULTIPLE`，并且不应该选择单个单元格。接下来，是一个每当你更改选择时都会触发的事件处理器。该处理器非常简单，所做的只是在控制台上写一段文本，该段文本显示了所选行的索引。


    ## 练习 3


    数据库 `padata` 包含一个带有丹麦邮政编码的 `zipcode` 表。你必须编写一个可以调用为 `PostProgram` 的程序。该程序应该只在
    `TableView` 中显示数据库表的内容，你不应该对各个列的格式进行任何特殊处理（只有两列）。


    ## 3.2 在 TableView 中编辑单元格


    现在我将展示一个示例，它在原理上与上面的示例相似，但你可以编辑各个单元格的内容。虽然这可能并不新奇，但它仍然相对简单。通常情况下，它的原理是：双击你想编辑的单元格，之后单元格将打开并提供更改值的选项。当单元格打开时，是通过单元格显示另一个控件实现的，该控件基本上可以是：


    1. `CheckBoxTableCell`（参见上一个示例）

    2. `ChoiceBoxTableCell`

    3. `ComboBoxTableCell`

    4. `TextFieldTableCell`


    并且你也可以定义自己的控件。为了展示它是如何工作的，我这次将使用另一种对象类型，即一个代表人的类：


    ![](img/Java_15_–_More_about_JavaFX_5-4_18_72.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_73.jpg)


    这是一个标准的 JavaFX 模型类，因此我在这里不显示细节。该类是我在上一章中使用过的 `Person` 类的扩展。该类的起始部分与之前的示例基本相同，但这次要注意的是，除了
    `Id` 类的类对象被分配了一个只读属性。事实上，重要的不是解释，但它可以是出生年份（对于 `year`）、工资（对于 `salary`）以及是周薪（对于
    `weekly`）还是每月（对于 `monthly`）。最后，最后一个属性可以解释为入职日期。当你运行程序时，结果所示，除了 `Id` 列之外的所有列都是可编辑。`Add`
    按钮用于向表格添加新行。


    ![](img/Image1885.jpg)


    除了 `Person` 类，项目还有一个名为 `PersonModel` 的类：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_73.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_74.jpg)


    它代表了程序处理的人。`initialize()` 方法创建了 6 个人，因此程序启动时表格不是空的。注意 `Person` 对象被存储在 `ObservableList`
    中，并注意 `add()` 和 `remove()` 方法是如何维护该列表的。


    否则，我想从 `EditPersonsProgram` 类开始：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_74.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_75.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_76.jpg)


    该类首先定义了一个模型对象——不是为了 `TableView` 组件，而是为了程序需要的数据。此外，定义了用于 `Person` 对象的 `TableView`。在创建表格的
    `start()` 方法中，没有太多新内容需要解释，但你应该注意表格列是通过 `PersonTableModel` 类的方法创建的。最后，注意表格被定义为
    `editable`：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_761.jpg)


    如果某个列对应读写属性且该列具有作为 `TableCell` 控件的 `CellFactory`，那么你就可以编辑单元格。你还应该注意事件处理器，`Add`
    按钮处理器非常简单，而 `Remove` 按钮的处理器需要你确定所选行的索引。最后，是 `Test` 按钮的处理器，它在控制台上打印列表中的对象。该处理器的目标是测试
    `TableView` 控件显示与模型包含的内容是否保持一致。这是为了展示 `TableView` 控件的变化会自动更新模型。


    然后是 `PersonTableModel` 类，它拥有创建表格列的方法。另一方面，它也是程序类中最复杂的类。

