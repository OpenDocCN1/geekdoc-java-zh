    ## 2.6 Decorations


    A typical window looks something like the following:


    ![](image/Image1806.jpg)


    where there is a title bar and a border so you can change the window size. In
    addition, there is the window content, like here a scene graph with a label and
    a button. How the title bar and border are displayed depends on the current platform,
    and for the title bar, the platform determines which buttons are available. The
    window’s title bar is also used to move the window on the screen by dragging it
    with the mouse and for example maximizing it by double-clicking the title bar.


    Title bar and border are referred to as the window’s decorations or styles, and
    here are actually more options, which are defined as properties of the `Stage`
    object. I want to mention three:


    1. `StageStyle.DECORATED`, which is the default where the window has a title bar
    and a border

    2. `StageStyle.UNDECORATED`, where the window is not decorated and therefore does
    not have a title bar or border

    3. `StageStyle.TRANSPARENT`, where the window is not decorated and also has a
    transparent background


    For example, if you defines the above window as `UNDECORATED`, the result is:


    ![](image/Image1814.jpg)


    and if you defines the window as `TRANSPARENT` is the result:


    ![](image/Image1823.jpg)


    The above can be illustrated by the following class:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_51.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_52.jpg)


    where the comments in the method `start()` indicate how the window should be decorated.
    There is not much going on in the `start()` method in addition to creating the
    scene graph and initializing the `Stage` object. Note that the class this time
    has an instance variable that refers to the `Stage` object so that it can be referenced
    from other class methods. Also note the event handler to the `Close` button, which
    closes the window, thus terminating the program. It works in this case, but not
    necessarily in other programs. If you perform a `close()` on a `Stage` object,
    it will hide the window (perform the `hide()` method in the base class to `Stage`
    that is named `Window`) and are there no other windows, the program will terminate.
    If you want to terminate the program as soon as a button is clicked, you should
    instead execute `Platform.exit()`.


    The window opens in the method `show()`, which has three parameters, which are
    the scene graph, its `Label` control and the style of the window and hence how
    it should be decorated. The method starts by setting the text for the window’s
    `Label` control and then how the `Stage` object has to be decorated. Here you
    must note the syntax and that it must be done before the `Stage` object appears
    on the screen. If the style is `TRANSPARENT`, it indicates that there is no background.
    If the window is `UNDECORATED`, there is a problem, as you can not move it with
    the mouse. If you wish, you can, as shown above, associate an event handler to
    the `Scene` object.


    ## 2.7 Modality


    As you know it from Swing, a dialog box can be modeless or modal, and of course
    it also applies in JavaFX, where it is a property of the `Stage` object. There
    are three options:


    1. `Modality.NONE`, where the result is a modeless window, which is the default
    for `Stage`

    2. `Modality.WINDOW_MODAL`, which is modal and blocks all windows that directly
    own this

    3. `Modality.APPLICATION_MODAL`, which is modal and blocks all of the application


    The following example shows the syntax, but also shows that an application may
    well have multiple `Stage` objects and thus windows (dialogs). The `StageView`
    class opens the following window:


    ![](image/Image1830.jpg)


    where each of the top buttons opens a dialog by instantiating a new `Stage` object,
    and the difference is partly modality and partly if the dialog has an owner. For
    example, the first is modeless and without an owner. This means clicking on the
    top button, the program will open a dialog and then clicking at the cross in the
    main window’s title bar (and you can because the dialog is modeless) closes the
    main window but not the dialog and the program does not terminate, before closing
    the other window.


    The last button is included to show that a `Stage` object also has a method, so
    you can say that the window should be displayed full screen. Note that displaying
    a full screen you returns to normal by pressing ESC – or clicking the *Full screen*
    button again.


    The code is as follows:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_55.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_56.jpg)


    There is not much to explain, but you should note the method `showDialog()`, which
    creates a dialog box by instantiating a new `Stage` object.


