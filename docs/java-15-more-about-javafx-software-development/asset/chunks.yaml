    As a first step, model classes must be written to the three database tables. For
    `currency`, it is the following class:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_100.jpg)


    where I have not included the column for exchange rates. Since the information
    can not be changed, both properties are defined readonly. The table `world` uses
    the following model class:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_1001.jpg)


    In the program, it should not be possible to change the name of a continent, but
    when the property `name` is defined read/write, it is because the class `Country`
    is defined as a derivative class:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_1002.jpg)


    The reason is primarily that a `TreeView` basically contains elements of the same
    type, as in this case is `World`, and the tree can therefore also immediately
    contain `Country` objects.


    With these model classes in place, I have the following data model:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_1003.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_101.jpg)


    The constructor calls the method `load()`, which initializes the three lists by
    reading the content of the database. I have not displayed the code for `load()`,
    but it only contains simple database operations. It should also be possible to
    write the changes that the program returns to the database, and therefore the
    method `save()`. When examining the code, note that it writes all countries back
    with a batch update. It might be a little exaggerated, and it could easily be
    solved by expanding the class `Country` with an additional `Boolean` property
    that could be set to true when a value was changed. For the class `Model`, you
    should also note the methods `getWorld()` and `getCurrency()` that from the continent’s
    code and the currency code, respectively, returns the corresponding object. It
    is used when editing data for a country.


    The class `TreeModel` is data model for the `TreeView` component and is not much
    more than a thin layer between the `Model` class and the user interface, but its
    task is to arrange the data from the model layer in a hierarchy of `TreeItem`
    objects:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_102.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_103.jpg)


    With these 5 classes in place, the program’s classes can be written for the main
    window and the dialog box. Since none of these classes in principle contains something
    new, I do not want to show the code here, but you are encouraged to study the
    code, and the dialog is not quite simple and, among other, it complicates the
    task changing the continent for a country, as it means that the country has to
    be moved in the tree. To resolve this, delete the old node and create a new one
    somewhere else, and note that the visual representation of the tree is automatically
    updated.


    ## 3.6 A TreeTableView


    JavaFX also has a `TreeTableView` control, which can be characterized as a combination
    of a `TableView` and a `TreeView`. This corresponds to that the component as a
    `TreeView` shows a hierarchy of objects, but where each object appears as a row
    of multiple values and thus more columns. It sounds complicated and is it, too,
    but the component works in principle like the previous ones, though there are
    more sophistry for the programming. I will start with a simple example that will
    show the basic syntax and I will again use data about countries organized in a
    hierarchy where a country’s parent is the continent to which the country belongs
    (and it is assumed – not entirely correct – that countries belong to one particular
    continent). If you run the program, you will see the window below, where `This
    World` and `Asia` are expanded.


    ![](image/Image1987.jpg)


    That is, for each country, name, area and number of inhabitants are displayed.
    Here you should note that a number for area and inhabitants is shown, if the row
    is a continent, which is the sum of the corresponding numbers for child nodes.


    The program is called `ShowCountriesProgram` and uses two model classes called
    `World` and `Country`. These classes are identical to the corresponding classes
    in the program `UpdateWorldProgram` and should not be mentioned further. The class
    `CountriesModel` defines a model for the `TreeTableView` component:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_104.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_105.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_106.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_107.jpg)


    The class immediately looks like model classes for the other components (`TableView`
    and `TreeView`) and consists primarily of methods that return column objects.
    The constructor calls a method `load()`, where I have only shown few statements,
    but the method organizes data for 20 countries in a hierarchy under continents.
    Aside from the fact that the code fills a part, there is nothing mysterious in
    the code. You should note that a country consists of more data than the program
    shows, and the class `CountryModel` actually has a method for each column. Above,
    I have only included the methods for the three columns. Similar to the columns
    for the previous controls, a `CellValueFactory` object is associated with which
    a parameter specifies where to retrieve the values. For the `name` column, a `TreeItemPropertyValueFactory`
    uses the content of the individual cells as a `Label` containing the value. The
    type `TreeItemPropertyValueFactory` implements a `Callback` interface, and you
    can therefore type your own `CellValueFactory` as a class if you want to determine
    the value of the columns. I have done that for the next two columns in the form
    of the class `SumValueFactory`. The class has a parameter `field`, which is the
    name of the property in the class `Country` to which the column relates. The goal
    is that the same class should apply for both columns `Area` and `Inhabitants`.
    Otherwise, the class consists primarily of overriding the method `call()`, which
    is defined by the interface `Callback`. The method has parameters that represent
    the current cell, and tests whether the cell contains a `Country` that does not
    have a reference to a continent. If that is the case, the object itself represents
    a continent and the method calls the method `calculate()` which determines the
    sum of all child object values for the current property. You should note that
    the method `calculate()` is recursive, and that is why the root of the tree shows
    the sum of all the world’s countries. If the current cell is not for a continent,
    the value is determined by a default `TreeItemPropertyValueFactory`.


    A column may also be associated with a `CellFactory`, and while a `CellValueFactory`
    determines the value, a `CellFactory` determines which object will display the
    value. The meaning of a `CellFactory` is to associate an object that is used to
    edit the content of the cell (something to be treated in the next example), but
    in this case, a `CellFactory` is used simply to display 0 values as blank (what
    could also be achieved with a converter). The content of a cell is a `TreeTableCell`
    object, and the class `LongFactory` is a `CellFactory` (implementing a `Callback`
    interface) that implements the method `call()`, so it returns a `TreeTableCell`
    where the method `updateItem()` is overridden.

