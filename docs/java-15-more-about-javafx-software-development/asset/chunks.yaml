    ![](img/Java_15_–_More_about_JavaFX_5-4-18_231.jpg)


    在 JavaFX 中，所有读/写属性都支持双向绑定，作为其使用的示例，考虑以下类：


    另一个例子是`test07()` 打开了如下窗口：


    ![](img/Image1782.jpg)


    包含一个 `Slider`、一个 `Label` 和三个 `Button` 控件。这里，`Slider` 组件通过双向绑定到 `Counter` 中的属性
    `step`，而 `Label` 组件通过单向绑定绑定到 `Counter` 中的属性 `value`：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_25.jpg)


    `Label` 控件有一个 `StringProperty` 属性 `textProperty`，而 `Counter` 有一个 `ReadOnlyIntegerWrapper`  `valueProperty`。由于后者是只读的，你无法创建双向绑定，但
    `ReadOnlyIntegerWrapper` 有一个 `asString()` 方法，返回一个 `StringBinding` 对象，允许创建单向绑定。结果是，如果
    `Counter` 对象中的属性 `value` 发生（点击 `Down` 和 `Up` 按钮），`Label` 对象将自动更新。`Slider` 控件有一个
    `IntegerProperty` 类型的 `valueProperty`，`Counter` 类也是如此，它具有相同类型的 `stepProperty`。因此，你可以在这两个属性之间创建双向绑定。结果是，如果你改变滑块，`Counter`
    对象的步属性就会更新。如果你点击 `Reset` 按钮，它会将 `step` 的值设置为 1，由于滑块绑定是双向的，滑块组件会自动更新。


