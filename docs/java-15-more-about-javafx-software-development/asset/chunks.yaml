- fmt: '

    Initially, 4 `Spinner` controls are created, and the goal is to show how to create
    a `Spinner` (which parameters can be specified by the constructor) and which properties
    can be subsequently set. Here you should especially note how to associate an event
    handler. They are all trivial and the goal is to see (with a text on the console)
    when the events in question occurs. The 4 `Spinner` controls are placed in a `HBox`
    that can be added to the root of the window. When `root` is created (as a `VBox`),
    first 3 `LabelField` controls are added, where you will primarily observe the
    parameters of the constructor. For the first control is associated with an event
    handler – which is trivial and where the goal is to show that you can associate
    an event handlers to the entry field.


    Both user controls are simple and hardly have not the great pratical interest,
    but they show something about how to create a user control. In the rest of this
    chapter I will describe how the two controls are written.


    ## 6.1 A LabelField


    When writing a custom control, the two main decisions are what properties should
    be and what events the control is going to fire. The actual control is, in fact,
    not much more than a `HBox` with a `Label` and a `TextField`, and in addition
    to the properties of a `HBox`, you should be able to set the width of the `Label`
    and the `TextField`, respectively, and set the text for both components. Finally,
    there must be a property for the font that should apply to both the `Label` and
    the `TextField`, so that both components always uses the same font. When you enter
    text or otherwise change the text for the `TextField` component, it should send
    `ChangeEvents`, and in order for these events to be captured from an application,
    the component returns the `TextField` component’s `textProperty`. The component
    can then be written where I have only included one of 5 constructors and two properties:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_146.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_147.jpg)


    In fact, there is not much to notice, and the most important code is found in
    the constructor, where the two components should be placed “nicely” in the container.
    Note that the class inherits `HBox` and therefore is a component that can be inserted
    into a scene graph like all other controls.


    ## 6.2 A Canvas


    Before I look at the last control, I will mention a `Canvas`, which is a control
    I have not previously mentioned. A `Canvas` is a control consisting of a drawing
    surface where you can draw geometric figures and text and insert images using
    drawing features. You can also manipulate the individual pixels using a `PixelWriter`.


    A `Canvas` has attached a `GraphicsContext` class that represents the graphic
    content and provides drawing functions available. You are encouraged to investigate
    which methods `GraphicsContext` makes available.


    For example, the program `CanvasProgram` opens the following window:


    ![](image/Image2088.jpg)


    where a square, a circle, a text and a curve (a parable) are drawn and a picture
    is added. The new is that it has been done using a `Canvas`:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_148.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_149.jpg)


    The code is easy enough to figure out. In the method `start()`, a `Canvas` object
    is created of a certain size, and a reference is created to the `Canvas` object’s
    `GraphicsContext`. For this object, the width of the pen to be drawn with is defined,
    then a drawing tool is used to draw a rectangle. Since nothing is said about the
    color, it is drawn with a black pen. Next, a red fill color is added and a filled
    circle is drawn. Note specially what the drawing function is called. As a next
    step, a font is defined and a text is drawn. Finally, an image is inserted and
    finally the method `writeGraph()` is called, which draws the curve. The curve
    is not too “nice” – is some pixelated – and there are other and better ways to
    draw such a graph, but the example should show how to manipulate the individual
    pixels in a `Canvas`. Finally, note that a `Canvas` is a node, and therefore can
    be added to a scene graph.


    ## 6.3 A Spinner


    The custom control can be written as follows, where I have not shown the code
    for the three properties for setting the rotation speed and color and only one
    constructor:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_150.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_151.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_152.jpg)


    Mostly happens in the constructor that initially initiates properties and creates
    a `Transition` for a rotation. You should note that an event handler is associated
    with an event that occurs when the rotation ends and that it fires an `ActionEvent`
    if there is a listener. The constructor also calls the method `draw()`, which
    draws the component on a `Canvas`. Note that there is no particular reason for
    using a `Canvas` (in addition to showing how), as you could achieve the same with
    existing `Node` classes. The class also has a `Circle` object that is used to
    make it easy to test in the mouse.


    # 7 JavaFX and concurrency


    Java GUI applications are generally multi-threaded, and similar to Swing JavaFX
    uses a special thread to update the user interface. This thread is called `JavaFX
    Application Thread`. Since all nodes in the scene graph are not thread-safe (for
    the reasons of performence), there are the same challenges you know from Swing
    that you can not update them from another thread, but it should be done by calling
    a method in the `JavaFX Application Thread`. In this chapter I want to show what
    JavaFX makes available to make it simple. The program `UpdateGUI` opens the following
    window:


    ![](image/Image2095.jpg)


    If you click the `Start` button, the program starts a method that takes a long
    time and after the method is completed, the top label is updated. Clicking the
    `Clear` button deletes the content of the top label. If you try the program while
    the top radio button is pressed, you will find that nothing happens when you click
    the `Clear` button – at least not before the method started of the `Start` button
    is completed. The user experiences that the program “hangs”. Solutions are, of
    course, to execute the method that takes time, in its own thread. Pressing the
    middle radio button and clicking *Start* again executes the method in a background
    thread, but now you get an exception. The reason is that the background thread
    tries to update the `JavaFX Application Thread`, which raises an exception. On
    the other hand, press the bottom radio button and click *Start* again, so it runs
    as it should, where the top label is updated on a regular basis, and you can delete
    that label at any time by clicking the `Clear` button.


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_153.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_154.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_155.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_156.jpg)


    The method to be performed is performed in `work1()` and `work2()`, which both
    performs the method `calculate()` 10 times, respectively. Before each execution
    of the method, the program’s label is updated. `calculate()` performs nothing
    interesting, but it does many calculations that take a long time and the goal
    is that it is a method that constantly uses the machine’s processor.

