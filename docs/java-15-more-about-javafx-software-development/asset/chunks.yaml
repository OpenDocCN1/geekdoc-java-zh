    2.  `TreeView`

    3.  `TreeTableView`


    其中第一个对应于组件 `JTable`，第二个对应组件 `JTree`，而后者最好被描述为两者的结合。之前的书中没有包含这三个组件，部分是因为它们非常复杂且有许多可能性，部分是因为它们的工作方式在提到上一章的属性和绑定之后最能得到很好的描述。


    ## 3.1 TableView


    我想从 `TableView` 组件开始，它像 `JTable` 一样，是一个极其复杂的控件，以行和列排列数据，而且它是这三个控件中最用的。该组件的类名为
    `TableView`，但与组件一起还有几个辅助类：


    *   `TableColumn`

    *   `TableRow`

    *   `TableCell`

    *   `TablePosition`

    *   `TableView.TableViewFocusModel`

    *   `TableView.TableViewSelectionModel`


    这些名称应该告诉我们每个单独类的用途。`TableView` 类的使用方式有点像 `JTable`，你必须定义一个数据模型，即组件应该显示的数据，以及应该包含哪些列。我将从一个示例开始，将其命名为
    `ShowKingsProgram`，它展示了作为 `King` 类型对象（上一章中的类）表示的丹麦国王的概览：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_59.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_60.jpg)


    如果你运行该程序，它会打开下面的窗口，显示一个有 5 列的表格，这比 `King` 类型拥有的属性列多了一列：


    ![](img/Image1853.jpg)


    如果你研究程序代码（主程序），它是：


    ```

    ![](img/Java_15_–_More_about_JavaFX_5-4_18_61.jpg)

    ```


    非常简单。起初，定义了一个模型（下文解释）。否则，除了 `start()` 方法外什么都没有发生，在该方法中为 `King` 对象创建了一个 `TableView`
    并用数据模型进行初始化，最后使用数据模型中的方法了四列。相应的 `TableView` 被封装在 `BorderPane` 中并插入到程序的场景图中。包含最多的是模型类
    `KingTableModel`：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_611.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_62.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_63.jpg)


    该类开始于为 `King` 对象创建一个 `ObservableList`，该列表在构造函数中使用类末尾数组中定义的数据进行初始化。注意，作为替代方案，列表也可以通过读取数据库表来初始化。该类有一个可以返回列表的方法，该方法在构造函数中用于
    `TableView` 组件的 `start()` 方法。类的其余部分由创建各个列的方法组成。第一个用于 `name` 属性，列的类型是 `TableColumn`，参数指示对象是什么类型（这里是
    `King`）以及相关属性的类型（这里是 `String`）。`TableColumn` 构造函数的参数是列头中显示的文本。接下来，你必须指定每个单元格包含哪些值，这是通过
    `PropertyValueFactory` 实现的，其构造函数的参数是 `King` 类中单元格必须包含的属性名称，这里是 `name`。


    接两列基本上以相同的方式定义，只是这次类型是 `Integer`。然而，这些列没有直接插入表格，而是通过 `getPeriodCol()` 方法创建的另一个列插入的。列是可以嵌套的，`getPeriodCol()`
    创建的列是一个由另外两个列组成的列。在用户界面上，这对应于表头为 `Period` 的列有两个子列，分别为 `from year` 和 `to year`。在这种情况下，除了展示这是可行的以及语法是什么外，没有特别的理由。


    该类还为 `country` 属性创建了一列，这里没什么新意，实际上 `getCountryCol()` 方法并没有被使用。目标是说明你不需要在用户界面上显示所有列。


