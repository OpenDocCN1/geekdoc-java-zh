    ## 4.1 Simple press-drag-release gesture


    As the name says, it is the simplest form for drag-and-drop and is used where
    the operation relates only to a single node and which is the node that starts
    the gesture. During the operation, all `MouseDragEvent` types are fired:


    * `MouseDragEntered`

    * `MouseDragOver`

    * `MouseDragExited`

    * `MouseDragReleased`


    but they are only sent to the source node. As an example, below is shown an application
    that opens a window with two `Label` controls. By pointing at the top and holding
    down the mouse, the background of the window changes to light green, and moves
    the mouse, the text changes the color to yellow and the background turns light
    blue. If you pull the mouse around in the window, nothing happens – even if you
    drag the mouse over the bottom `Label`. However, if you release the mouse, the
    background color and the text color of the top `Label` are returned to white and
    black respectively. The example should show what happens if you start a drag gesture
    for a `Label` (and thus any other node) and drag the mouse around in the window.


    ![](image/Image2002.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_116.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_117.jpg)


    The program has two `Label` controls defined as instance variables, as well as
    two properties for a `Color` and a `Background` respectively. Here you should
    especially note that a `Background` object is created for a specific color of
    the static method `background()`. The method `getRoot()` initializes the components
    and creates the program’s view. Here you should note that root is a `VBox`, and
    that the method binds its background to the property `bg`, and similarly, the
    text color of the top `Label` binds to the property `fg`. Finally, the method
    `start()`, and here is the most important thing that 4 event handlers are associated
    with each of the `Label` controls. To the top, two drag event handlers are assigned,
    while all 4 drag event handlers are assigned to the bottom. The meaning is that
    you must observe that these event handlers are never performed. A simple press-drag-release
    gesture relates only to the node – and sends only notifications regarding drag
    to that Node – that initiates the operation, which is the Node the mouse points
    when the button is pressed. The operation ends when the mouse is released and
    wherever where the mouse points.


    ## 4.2 Full press-drag-release gesture


    When the source node receives a notification for a `MouseDragDetected` event,
    it can launch a full press-drag-release gesture by calling the method `startFullDrag()`.
    In addition, the property `mouseTransparent` must be set to `false` for the source
    node so this node does not receive all drag notifications. The example `FullpressDnD`
    is almost identical to the above program and opens the same window. Clicking on
    the top `Label` starts a drag operation, which immediately results in the same
    as above, but when the mouse is draged over the bottom `Label`, the background
    of the window changes to dark blue while the text in the bottom label becomes
    white. If the mouse again is draged out from the bottom label, the text color
    in the top label changes to violet. When the mouse is released, it returns to
    default. The code is this time the following:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_118.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_119.jpg)


    This time, two properties for `Color` objects are defined so that the text color
    for both `Label` controls is bound to a property (the method `getRoot()`). Otherwise,
    you should first notice which events handlers are associated with the two labels.
    When the mouse points to the top label and the mouse is pressed, `mouseTransparent`
    is set to `true` (the method `startDrag()`) and it is put back to `false` when
    the mouse is released (the method `endDrag()`). Finally, note that `lbl1` at `dragDetected`
    executes `startFullDrag()`, and the result is that the component `lbl2` this time
    receives drag notifications. You are encouraged to experiment with the program
    and observe when each event occurs. Here you should especially note `dragReleased`
    for the lower label, which changes the text in the top label. It is executed if
    you release the mouse while it points to the bottom label.


    ## 4.3 Drag-and-drop gesture


    The last form of drag and drop gesture is mostly the general and probably also
    the most used and used to extract data from the source node and drop them on a
    target node. The gesture in question may concern nodes within the same application,
    but it may also concern nodes in two different Java applications. In fact, both
    applications does not necessarily have to be a Java application.


    In general, a drag-and-drop operation includes the following actions:


    * Point to a node and hold down one of the mouse’s buttons

    * Drag the mouse while the button is held down and the node gets a `DragDetected`
    event and must perform a `startDragAndDrop()`, after which the node is a gesture
    source node and the current data is placed on the clipboard

    * After starting a drag-and-drop gesture, the system no longer sends `MouseEvents`,
    but instead `DragEvents`

    * If a gesture source is dragged over a gesture target, it will check if it will
    accept

    * If the user drops the mouse while pointing to a gesture target, it will apply
    the current data and send a `DragDropped`

    * When the source gesture receives a `DragDone` event, it tells that the operation
    has been completed


    In this section I will illustrate drag-and-drop with three examples, and the first
    one is called `TextDnd` and opens the following:


    ![](image/Image2010.jpg)


    It is basically the same window as the two previous examples, except that there
    is a frame outside of the Label controls, and a button has been added. In this
    example, drag and drop gestures drag the text from the top label and drop it on
    the bottom label. A drag-and-drop gesture can be performed in two ways (actually
    three and you can read drag-and-drop in the book Java 10), where one drops a copy
    of the data (here the text in the top label) while another one moves it. Here
    the text `Copy` in the button means that it is a copy gesture that is executed.
    Clicking the button changes the text and it is a move gesture, while resetting
    the window. The code is as follows:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_122.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_123.jpg)![](image/Java_15_–_More_about_JavaFX_5-4-18_124.jpg)


    With regard to instance variables, they are self explanatory, but note the last
    one used to indicate whether a gesture should be `Copy` or `Move`. The type is
    an enumeration. The method `getRoot()` that creates the program’s view does not
    contain anything new, but in the method `start()` you should note which events
    handlers are being associated. Generally, a source node must have associated two
    event handlers: `DragDetected` and `DragDone`. A target node must correspondingly
    have associated two event handlers: `DragOver` and `DragDropped`. Corresponding
    to this is the most important in the example these 4 event traders.


    The method `dragDetected()` starts by testing whether there is actually a data
    element and here if the top label shows a text. If so, `startDragAndDrop()` is
    performed on the source node, and the parameter is which operation to be performed.
    The method returns a `DragBoard` object, and is an object that represents the
    clipboard. In fact, `DragBoard` is a subclass of the class `Clipboard`. The method
    `dragDetected()` also has a reference to the clipboard and it saves the text on
    the clipboard and finally updates the `DragBoard` object with the current content
    on the clipboard.

