    第一步，必须为三张数据库表编写模型类。对于 `currency`，对应的类如下所示：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_100.jpg)


    在这里我没有包含汇率列。由于这些信息无法更改，因此两个属性都被定义为只读（readonly）。`world` 表使用以下模型类：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_1001.jpg)


    在程序中，不应该是允许更改洲名称的，但当属性 `name` 被定义为读/写时，是因为 `Country` 类被定义为一个派生类：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_1002.jpg)


    原因主要是因为 `TreeView` 基本上包含相同类型的元素，在本例中是 `World`，因此树也可以直接包含 `Country` 对象。


    有了这些模型类，我拥有了如下的数据模型：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_1003.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_101.jpg)


    构造函数调用了 `load()` 方法，该方法通过读取数据库内容来初始化三个列表。我没有显示 `load()` 的代码，它只包含简单的数据库操作。同样，应该能够将程序返回的更改写入数据库，因此有了
    `save()` 方法。在检查代码时，注意它通过批量更新（batch update）写回所有国家。这可能有点夸张，完全可以通过扩展 `Country` 类并添加一个额外的
    `Boolean` 属性来轻松解决，当值发生变化时将其设置为 `true`。对于 `Model` 类，你还应该注意 `getWorld()` 和 `getCurrency()`
    方法，它们分别根据大洲代码和货币代码返回相应的对象。这些方法在编辑国家数据时被使用。


    `TreeModel` 类是 `TreeView` 组件的数据模型，它仅仅仅仅是 `Model` 类与用户界面之间的一个薄层，但它的任务是将模型层的数据排列成
    `TreeItem` 对象的层级结构：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_102.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_103.jpg)


    有了这 5 个类，就可以为主窗口和对话框编写程序类了。由于原则上这些类中没有都不包含新内容，我不想在这里显示代码，但鼓励你学习一下代码，这个对话框并不简单，其中它还复杂了更改国家所属大洲的任务，因为这意味着国家必须在树中进行移动。要解决这个问题，请删除旧节点并在其他地方创建一个新节点，并注意树的视觉表示会自动更新。


    ## 3.6 一个 TreeTableView


    JavaFX 还有一个 `TreeTableView` 控件，它可以被表征为 `TableView` 和 `TreeView` 的结合。这意味着该组件像 `TreeView`
    一样显示对象的层级结构，但其中每个对象都作为包含多个值的行出现，因此有更多列。这听起来很复杂，事实也如此，但该组件在原理上与之前的组件一样，只是编程时有更多的技巧。我将从一个简单的示例开始，它将展示基本语法，我将再次使用按层级组织的国家数据，其中国家的父级是该国家所属的大洲（假设——并不完全正确——国家属于一个特定的大洲）。如果你运行程序，你将看到下面的窗口，其中
    `This World` 和 `Asia` 被展开了。


    ![](img/Image1987.jpg)


    也就是说，对于每个国家，都显示了名称、面积和人口。在这里你应该注意，如果某行是大洲，则显示的面积和人口数字是其子节点对应数字的和。


    该程序名为 `ShowCountriesProgram`，使用了两个名为 `World` 和 `Country` 的模型类。这些类与 `UpdateWorldProgram`
    程序中的对应类相同，此处不再赘述。`CountriesModel` 类为 `TreeTableView` 组件定义了一个模型：


    ![](img/Java_15_–_More_about_JavaFX_5-4-18_104.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_105.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_106.jpg)![](img/Java_15_–_More_about_JavaFX_5-4-18_107.jpg)


    该类看起来非常像其他组件（`TableView` 和 `TreeView`）的模型类，主要由返回列对象的方法组成。构造函数调用了 `load()` 方法，我在其中只显示了少数语句，但该方法将
    20 个国家的数据组织在大洲之下的层级结构中。除了代码填充了部分内容外，代码中并没有神秘之处。你应该注意，国家包含的数据比程序显示的要多，且 `CountryModel`
    类实际上为每一列都有一个方法。在上面我只包含了这三列的方法。与之前控件的列类似，它关联了一个 `CellValueFactory` 对象，其一个参数指定了从何处检索值。对于
    `name` 列，TreeItemPropertyValueFactory` 使用单个单元格的内容作为包含该值的 `Label`。`TreeItemPropertyValueFactory`
    类型实现了 `Callback` 接口，因此如果你想确定列的值，可以以类的形式编写你自己的 `CellValueFactory`。我已经在接下来的两列中这样做了，形式为
    `SumValueFactory` 类。该类有一个参数 `field`，它是 `Country` 类中与列相关的属性名。目标是让同一个类同时适用于 `Area`
    和 `Inhabitants` 两列。否则，该类主要由重写由 `Callback` 接口定义的 `call()` 方法组成。该方法拥有代表当前单元格的参数，并测试单元格是否包含一个没有大洲引用的
    `Country`。如果是那样，对象本身代表一个大洲，该方法调用 `calculate()` 方法，计算当前属性的所有子对象值的和。你应该注意 `calculate()`
    方法是递归的，这就是为什么树的根显示了所有国家的总和。如果当前单元格不是大洲，则值由默认的 `TreeItemPropertyValueFactory` 决定。


    列也可以关联一个 `CellFactory`，虽然 `CellValueFactory` 决定值，但 `CellFactory` 决定由哪个对象显示值。`CellFactory`
    的含义是关联一个用于编辑单元格内容的对象（将在下一个示例中处理），但在这种情况下，`CellFactory` 仅用于将 0 值显示为空白（这也可以转换器实现）。单元格的内容是一个
    `TreeTableCell` 对象，而 `LongFactory` 类是一个 `CellFactory`（实现 `Callback` 接口），它实现了 `call()`
    方法，因此它返回一个重写了 `updateItem()` 方法的 `TreeTableCell`。


