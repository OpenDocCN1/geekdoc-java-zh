    ## 10.15 A last remark


    As mentioned in the introduction to this chapter, the `FDrawer` program is developed
    by a form of prototyping. The term prototyping is sometimes used for a development
    as above, although the word is not correctly used. By the term prototyping one
    understands the development of a program, which is intended to illustrate the
    ideas of an application, and after the prototype has been developed and presented,
    the actual system development begins from the beginning, but not as a further
    development of the prototype. The prototype is itself a model that is not used
    as part of the final system development. It is therefore more correct to say that
    the program `FDrawer` is developed by a form of iterative system development through
    very small iterations, sometimes referred to as `sprints`.


    Today, all just a bit bigger programs are developed through a number of iterations,
    and the difference is primarily how large these iterations are. In the present
    case they have been very small and it has its pros and cons. The advantage is
    that you often observe progress in the work and that the future users through
    presentations seeing frequently experience and something is happening and thus
    maintain the interest for the program. It also supports the fact that the requirements
    are determined continuously throughout the development period, and thus the situation
    that, from the start, it is not entirely clear where it all will end. It is also
    an advantage that you can quickly detect malicious decisions and unfortunate solutions
    and thus quickly correct before you reach too far in the development of a particular
    feature. A system development with many and very small iterations opens up a very
    close course with the upcoming users and helps to end with a solution that meets
    the users’ requirements for the completed program. However, there are also disadvantages,
    and in particular there is a risk that you will always have to change the code
    that has been made. When you build on iteration on iteration, there is a great
    chance that you have to go back and change something that has been programmed
    in previous iterations, among other things because there are always new demands
    and wishes. That is precisely why traditional system development speaks of analysis
    and design, which defines the requirements for the finished program through the
    analysis, and under the design, it will be decided how to write the program before
    doing the programming itself.


    Now, it’s not a either or and you can perfectly combine iterative system development
    with more traditional system development and will even always do. Today, it has
    been acknowledged that by simply a slightly larger program it is impossible to
    carry out an analysis where all requirements are identified and determined. All
    experience shows that if you do it, it still does not meets the requirements.
    It’s simply impossible to think about it all and there will certainly be new demands
    of requirements over the development period, and if there is no user interaction
    at the development, one can almost be sure that the end of a program has so many
    shortcomings and inconveniences that the user does not bother using it. Therefore,
    in iterative system development, an iteration is a system development in its own,
    but not necessarily as small iterations as the current example suggests. An iteration
    will generally have a limited amount in time, and must lead the program from one
    stable state to another. The result of an iteration is a milestone in system development,
    where the state of the program can be presented and assessed by the upcoming users
    or the customer and possibly lead to something being corrected and new requirements
    to be set. Typically, an iteration will be a system development process in itself,
    including analysis, design, programming and testing, but so that the weight changes
    over time, with the emphasis on analysis and design in the first iterations, but
    in later iterations the analysis and design fill less as the requirements are
    now established and the most important decisions regarding the design of the program
    are also in place.

