    an *ObservableList<Person>* with the above *Callback* object as parameter. Next,
    the list is printed on the screen, which is the first line in the result, and
    it is just an empty list. The next statement adds *p1* to the list, after which
    the list is printed again. The result shows that the event handler has performed
    the method *added()* and added an object list, and the list then contains one
    object. As the next operation, *p2* and *p3* are added to the list and it is printed
    again. The result shows that the event handler has performed the method *added()*
    again and added two objects, and the list now contains 3 objects. Next, the list
    is sorted and it is printed again. As shown by the result, the event handler has
    performed the method *permuted()* corresponding to two or more of the list’s objects
    have been replaced. Next, the value of a property for *p1* and *p2*, respectively,
    is changed and here you should note that the event handler performs the method
    *updated()* and note that it is not the list’s content that has been changed but
    the objects that the list contains. The next statement again changes the actual
    contents of the list:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_35.jpg)


    and you can see from the result that the event handler has performed the method
    *replaced()*. After the list is printed again, the method will performe the statement


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_351.jpg)


    which means that the list content are replaced with three new objects. From the
    result, you can see that both the method *removed()* and *added()* are performed.
    Finally, two objects are deleted, and then one is left.


    Looking at the above example, which should illustrate how an *ObservableList*
    works, you could write similar programs that can illustrate how an *ObservableSet*
    and an *ObservableMap* works. I do not want to show examples here as there are
    no big differences compared to the above example.


    ## 2.3 Binding observable collections


    There is a class *ListProperty* that represents a property for an *ObservableList*,
    and you can think of the class as a wrapper for an *ObervableList*. It is a property
    type similar to other properties presented in this chapter. You can associate
    three kinds of listeners with a *ListProperty*:


    *   *InvallidationListener*


    *   *ChangeListener*


    *   *ListChangeListener*


    and these listeners will receive notifications when the *OberservableList* is
    changed as the *ListProperty* object in question wrapper. Consider the following
    method:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_36.jpg)


    The method creates a *ListProperty* named *property* as a *SimpleListProperty*,
    which wrapper an *ObservableList*. In addition, an *integerProperty* is defined
    with the name count, and it is bounded to the list’s size. Here, you should note
    that a *ListProperty* implements the *ObservableList* interface and therefore
    has the same properties as an *ObservableList*. *property* therefore has a *sizeProperty*
    which is an *IntegerProperty* and can therefore be bounded to *count*. The next
    print statement will therefore print 0 on the screen as the list is currently
    empty. As the next step, the listener methods are defined for the three events.
    The first one is trivial and does nothing but prints a text:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_37.jpg)


    You must note the parameter and that it is an *Observable*. The next listener
    method is also trivial and it prints the contents of the list before and after
    it has been changed:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_371.jpg)


    You should primarily note the parameters that are a reference to the list (the
    object that caused the event in question) and the list’s value before the change
    and its value after the change. The last event handler does nothing but prints
    a text (possibly more), but distinguishes the reason for the event:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_372.jpg)


