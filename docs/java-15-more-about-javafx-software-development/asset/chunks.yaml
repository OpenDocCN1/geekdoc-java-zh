    # 10 Final Example


    The final example of this book is a program where the user can enter an expression
    for a mathematical function in one real variable, for example


    ![](image/img_1.jpg)


    and the program must then be able to draw the function’s graph. The requirements
    are formulated continuously as the program is to be developed through a form of
    protyping, but the main purpose of the program is that when you have drawn the
    graph for one or more functions in a coordinate system, you must be able to copy
    the graph to the clipboard and paste it into a word processor, for example. You
    can thus think of the program as a tool that can be used by a writer of mathematical
    notes or books, but perhaps even by students in daily mathematics education.


    Regarding the other features of the program, there are primarily requirements
    for flexibility and ease of use, as well as the types of graphs that the program
    can draw. Some of the program’s features will relate to settings, including, for
    example, color and line thickness settings, as well as settings for the coordinate
    system will be important.


    More challenges are expected regarding the development, and the biggest challenge
    is assumed to relate to performance, as it may take time to draw a complete graph.
    In particular, expectations can be expected to change the size of the window,
    as it means both adjustments of (redrawing) the graph itself, but also the coordinate
    system.


    Another challenge is how to save the graph to a file where the graphs are not
    saved by simple object serialization as it is sensitive to new versions of the
    program.


    Regarding what a function must be (legal expressions), it is a problem that I
    have previously solved, so for parsing and evaluating an expression, more or less
    direct code can be used, which has previously been developed and tested.


    The program is considered as a first version, and you must expect frequent changes/extensions
    of the program for a period of time.


    ## 10.1 Development


    As mentioned above, the program is to be developed through a form of proptotype
    where the following iterations are planned:


    1.  A simple prototype


    2.  Drawing the x-axis


    3.  Drawing the y-axis


    4.  Drawing the coordinat system


    5.  Drawing a function from a formal


    6.  Drawing a plot


    7.  Implementing other features


    8.  Implementing options


    9.  Styling the program


    10.  Refactoring


    but there may occur several and other iterations. The result of every iteration
    is a complete program that can be used with the features that are implemenrated
    and each iteration is an extension of the previous iteration.


