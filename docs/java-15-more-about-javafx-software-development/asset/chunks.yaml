    ## 2.1 Binding properties


    JavaFX supports binding of properties where a property of a component or node
    can bind to a property on another object. In general, it is relatively simple
    to use, but in fact, many details are assigned to the concept, however, the classes
    in JavaFX are hidden the most. In the following, I will illustrate with some simple
    examples what binding is about. Consider the following method:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_201.jpg)


    The method defines three properties of the type `IntegerProperty` initialized
    with values 3, 5 and 7. An `IntegerProperty` has an `add()` method that performs
    an addition of values of two properties and returns a binding of the sum of the
    two properties which is an expression of the type `NumberBinding`, representing
    the sum of the values of the two properties. This binding is then linked to the
    property `z`. The next statement will print


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_202.jpg)


    which states that the variable `z` is bound, and that its value is 8 and hence
    the sum of `x` and `y`. That is, the value of `z` has been changed. Next, the
    two properties `x` and `y` are changed, and the next statement prints


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_21.jpg)


    That is, changes of the two properties `x` and `y` automatically update `z`, which
    exactly is what binding is about. The next statement again removes the binding
    of `z`, after which `x` and `y` are changed again. The last statement will then
    print


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_211.jpg)


    which partly shows that `z` is no longer bound and its value has not changed since
    it is no longer linked to the two properties `x` and `y`.


    A binding is thus an expression that is evaluated to a value. The expression consists
    of one or more observable values, known as dependencies. The binding observes
    changes of its dependencies and its value is automatically updated when its dependencies
    change values. All property classes in JavaFX have built-in support for binding.
    There are two forms of binding: *Unidirectional binding* and *bidirectional binding*.
    The above is an example of unidirectional binding, which is defined by the method
    `bind()`. There are several limitations to unidirectional bindings, and you can
    not, for example, directly change the value of the property that is bound. You
    can not directly change the value of `z` above. In addition, a property can only
    be bound to one expression with unidirectional bindings, and trying to bind it
    again, overrides the first binding.


    A binding can also be bidirectional, which means that you can also change the
    value of the property that is bound. Obviously, a binding like the above can not
    be bidirectional, for changing `z`, there is no way to automatically update the
    values of `x` and `y`. For a binding to be bidirectional, it must be between properties
    of the same type, but in return, a property may be bound to several other properties.
    The following method shows the principles of bidirectional binding:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_22.jpg)


    Three properties are created again, and the first `println()` displays the values
    of these properties before they are bound. Next, `x` is bound to `y` and the next
    `println()` statement shows that `x` now has the same value as `y`. Then `x` is
    bound to `z`, which means `x` has the same value as `z`, and since `x` is bound
    to `y` and since the binding is bidirectional, the value of `y` also becomes the
    value of `x`. The next `println()` statement shows that the three properties now
    all have the same value. Now, the value of `z` changes to 11, and when the three
    properties are printed again, they all have the value 11. Then the bindings are
    removed and the three properties are printed again, and you can see that they
    still have the value 11. Finally, the values of the three properties are changed,
    after which they are printed and the new values are shown:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_23.jpg)


    In JavaFX, all read/write properties support bidirectional binding, and as an
    example of how it can be used, consider the following class:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_231.jpg)


    Note that it is JavaFX (`Application`) and there is only a `start()` method. In
    JavaFX, all read/write properties support bidirectional binding, and as an example
    of how it can be used, consider the following class:


    ![](image/Java_15_–_More_about_JavaFX_5-4-18_231.jpg)


    In JavaFX, all read/write properties support bidirectional binding, and as an
