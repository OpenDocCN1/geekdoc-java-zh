    not show all settings, and the goal is to search the documentation yourself and
    experiment with the different settings, including expanding the program with new
    graphs using other types than the three mentioned above. It should be mentioned
    immediately that it is quite easy to work with the API and that it is similarly
    independent of the graph type.


