  \    }\n27    }\n```\n\n如果 `doEmployeeStuff()` 方法接收第 7 行的 `Employee` 对象，输出将是：\n\
  `Work work...`\n\n如果使用第 8 行的 `doEmployeeStuff(m)` 更改为 `Manager` 对象，输出将是：\n`Work\
  \ work...`\n`Call Department Meeting..`\n\n如果使用第 9 行的 `doEmployeeStuff(d)` 更改为 `Director`\
  \ 对象，输出将是：\n`Work work...`\n`Call Department Meeting..`\n`Play Golf..`\n\n## 4.3\
  \ 异构数组\n\n在大多数编程语言中，数组本质上通常是同质的。同质数组始终具有相同类型的元素值。考虑这个代表我们喜喜咖啡的 `String` 对象数组。这是一个同质数组的示例。\n\
  `String coffee[] = {\"Espresso\", \"Java\", \"Mochachino\"};`\n\n通过多态性，异构数组也是可能的。考虑之前图\
  \ 4.1 中的层次结构。假设你有一个名为 `staff[]` 的 `Employee` 对象数组，你的老板希望你显示所有员工对象的详细信息，这些不同的员工对象，如\
  \ `Director`、`Manager`、`Employee` 和 `Engineer` 对象。\n\n考虑此代码段：\n```java\n// 声明一个名为\
  \ staff 的 Employees 数组\n// 演示异构数组\nEmployee staff[] = new Employee[5];\n//  staff[]\
  \ 的每个元素都可以被\n// 分配不同类型的 Employee 对象。\n// 通过多态，只要对象类型\n// 是 Employee 类的子类，这就是可能的\n\
  staff[0] = new Manager();\nstaff[1] = new Director ();\nstaff[2] = new Employee();\n\
  staff[3] = new Secretary();\nstaff[4] = new Engineer();\nfor (int i = 0; i < staff.length;\
  \ i++)\n{\n    System.out.println(staff[i].getDetails());\n}\n```\n\n这段示例代码通过调用每个对象的\
  \ `getDetails()` 方法来显示所有员工的详细信息。每当循环迭代，变量 `i` 从 0 开始增加，语句 `staff[i].getDetails()`\
  \ 返回的值取决于 `staff[i]` 指向的对象。\n\n如果 `i = 0`，`staff[0]` 指向 `Manager` 对象，它将返回 `Manager`\
  \ 对象的名称、工资和部门信息。\n\n如果 `i = 1`，`staff[1]` 指向 `Director` 对象，并返回名称、工资、部门以及 `carAllowance`\
  \ 信息。\n\n如果 `i = 2`，`staff[2]` 指向 `Employee` 对象；因此返回名称和工资。\n\n这是 Java 中虚方法调用的区域。\n\
  \n## 4.4 多态参数方法\n\n在 Java 中演示多态性的另一种方法是声明带有多态参数的方法。此功能允许你创建一个可以接受参数数据类型子类中任何类型的方法。\n\
  \n考虑图 4.2 中的 UML 图，它显示了 `Animal` 类的层次结构。\n\n图 4.2 Animal 类类的单继承示例\n\n![image](img/fig4-2.jpg)\n\
  \n`Animal` 类有两个子类：`Mammal` 和 `Bird`。每个子类都有独特的方法。对于 `Mammal` 类，它有 `feedYoung()`，而\
  \ `Bird` 类有一组方法 `layEggs()` 和 `buildNests()`。这里是 `Animal`、`Mammal` 和 `Bird` 的示例代码：\n\
  \n```java\nclass Animal {\n    void eat() {\n        System.out.println(\"Eat\"\
  );\n    }\n    void breathe() {\n        System.out.println(\"Breathe\");\n    }\n\
  \    void sleep() {\n        System.out.println(\"Sleep\");\n    }\n    void play()\
  \ {\n        System.out.println(\"Have fun.\");\n    }\n}\n\nclass Mammal extends\
  \ Animal {\n    @Override\n    void eat() {\n        System.out.println(\"Mammal\
  \ Eats\");\n    }\n    @Override\n    void breathe() {\n        System.out.println(\"\
  Mammal Breathe\");\n    }\n    @Override\n    void sleep() {\n        System.out.println(\"\
  Mammal Sleeps\");\n    }\n    // 自己的哺乳动物方法\n    void feedYoung() {\n        System.out.println(\"\
  Feed Young\");\n    }\n}\n\nclass Bird extends Animal {\n    @Override\n    void\
  \ eat() {\n        System.out.println(\"Bird Eats\");\n    }\n    @Override\n  \
  \  void breathe() {\n        System.out.println(\"Bird Breathe\");\n    }\n    @Override\n\
  \    void sleep() {\n        System.out.println(\"Bird Sleeps\");\n    }\n}\n```\n\
  \n\n\n\n```java\n// my birdly methods\npublic void layEggs() {\n    System.out.println(\"\
  Lay Eggs\");\n}\n\npublic void buildNest() {\n    System.out.println(\"Build Nests\"\
  );\n}\n```\n\n这里是一个演示如何在方法中使用多态参数的示例代码：\n\n```java\n// TestAnimal.java\npublic class\
  \ TestAnimal\n\n    public static void main(String[] args) {\n        Mammal dog\
  \ = new Mammal();\n        Bird eagle = new Bird();\n\n        doAnimalStuff(dog);\n\
  \        doAnimalStuff(eagle);\n    }\n\n    public static void doAnimalStuff(Animal\
  \ a) {\n        a.eat();\n        a.breathe();\n        a.sleep();\n        a.play();\n\
  \n        if (a instanceof Mammal) {\n            Mammal m = (Mammal)a;\n      \
  \      m.feedYoung();\n        } else if (a instanceof Bird) {\n            Bird\
  \ b = (Bird) a;\n            b.layEggs();\n            b.buildNest();\n        }\n\
  \    }\n}\n```\n\n在第 9 行和第 10 行中，`doAnimalStuff()` 方法传递了一个狗对象和一个老鹰对象。\n\n9 `doAnimalStuff(dog);`\n\
  10 `doAnimalStuff(eagle);`\n\n代码 `TestAnimal.java` 的第 12 行，方法 `doAnimalStuff(Animal\
  \ a)` 接受任何类型的 `Animal` 对象作为其参数。你可以在该方法中传递一个 `Mammal` 对象或 `Bird` 对象。只要你传递的对象是 `Animal`\
  \ 类的子类，这都是可能的。在这种情况下，`Mammal` 和 `Bird` 类都是 `Animal` 类的子类。这是一个如何使用多态参数的示例。\n\n##\
  \ 4.5 instanceof 运算符\n\n`instanceof` 运算符可以测试赋值给引用变量的是什么类型的对象。\n\n根据第 19 行和第 24 行，`instanceof`\
  \ 运算符被用于 `if-else` 或 `if-else-if` 链中，以测试变量 `a` 是否被赋值为特定数据类型的对象。\n\n在这种情况下，第 19 行正在测试赋值给变量\
  \ `a` 的对象是否是 `Mammal` 类的实例。而在第 24 行，变量 `a` 正在被测试检查它是否被赋值为从 `Bird` 类实例化的对象。\n\n使用\
  \ `instanceof` 运算符，如果传递的参数是所测试某个类的“实例”，它将返回 `true` 或 `false`。\n\n```java\nif (a\
  \ instanceof Mammal) {\n    // ...\n} else if (a instanceof Bird) {\n    // ...\n\
  }\n```\n\n`instanceof` 运算符是一种关系运算符，产生一个布尔值。\n\n### 4.5.1 使用 instanceof 进行模式匹配 (JDK\
  \ 14 及更高版本)\n\nJava 中的 `instanceof` 运算符用于检查对象是否属于特定类型。在 JDK 14 之前，每当使用 `instanceof`\
  \ 时，通常需要紧跟一个显式的强制转换。这使得代码变得更长且更难以阅读。\n\n旧方法（Java 14 之前）：\n```java\nif (obj instanceof\
  \ String) {\n    String text = (String) obj; // 手动转换\n    System.out.println(text.toLowerCase());\n\
  }\n```\n\n从 JDK 14 开始（并在 JDK 16 中最终确定），Java 引入了对 `instanceof` 的模式匹配。此功能允许你在一步操作中检查类型并将结果赋值给变量。该变量会自动进行强制转换，你可以直接使用它。\n\
  \n新方法（JDK 14+）：\n```java\nif (obj instanceof String text) {\n    System.out.println(text.toLowerCase());\n\
  }\n```\n在这里，`text` 被称为模式变量。如果条件为真，Java 在 `if` 块内部将其处理为正确的类型。\n\n为什么这样更好？\n- 代码更少：不需要单独的强制转换。\n\
  - 意图更清晰：类型检查和变量创建在同一个地方完成完成。\n- 错误更少：减少了运行时发生强制转换错误的概率。\n\n这是一个匹配 `String` 的示例：\n\
  ```java\nObject data = \"Pattern Matching in Java\";\nif (data instanceof String\
  \ str) {\n    System.out.println(\"Length: \" + str.length());\n}\n```\n如果 `data`\
  \ 是一个 `String`，`str` 将被创建并可以直接使用，无需任何强制转换。\n\n这是另一个一个匹配自定义类的示例：\n```java\nif (shape\
  \ instanceof Circle c) {\n    System.out.println(\"Radius: \" + c.getRadius());\n\
  }\n```\n如果 `shape` 是一个 `Circle`，`c` 可以直接访问它的方法和字段。`instanceof` 的模式匹配使得 Java 中的类型检查变得更加简洁、可读且安全，特别是在处理复杂的对象层次结构时。\n\
  \n我们还可以将模式匹配和逻辑运算符结合在一起使用：\n```java\nObject obj = \"Hello Java\";\nif (obj instanceof\
  \ String s && s.length() > 5) {\n    System.out.println(\"String 's' is longer than\"\
  \ + \"5 characters: \" + s);\n}\n```\n在这种情况下，类型模式为 `obj instanceof String s`。在确定\
  \ `obj` 是否为 `String` 实例之后，它将 `obj` 绑定到类型为 `String` 的新变量 `s`。然后，该类型检查使用 `&&`（短路与）运算符与新绑定的变量\
  \ `s` 的条件（`s.length() > 5`）相结合。这使得以更简洁的方式对对象执行类型检查和其他操作成为可能。\n\n## 4.6 对象的强制转换\n\
  \n第 14 行到第 17 行使用了虚方法调用，因为这些方法的实现取决于引用变量 `a` 当前拥有的对象类型。\n\n由于使用 `Animal` 引用类型，无法访问\
  \ `Mammal` 和 `Bird` 类独有的方法。为了访问 `Mammal` 类的 `feedYoung()` 方法以及 `Bird` 类的 `buildNest()`\
  \ 和 `layEggs()` 方法，我们需要执行式对象强制转换。\n\n`Animal a` 引用变量可以强制转换为 `Mammal` 或 `Bird` 对象，或者\
  \ `Animal` 的任何子类。但为了良好的编程习惯，在强制转换之前，最好先使用 `instanceof` 运算符测试引用数据类型，以避免在运行时出现 `ClassCastException`。对象强制转换参见第\
  \ 21 行和第 26 行。\n\n```java\na.eat();\na.breathe();\na.sleep();\na.play();\n\nif (a\
  \ instanceof Mammal m) {\n    m.feedYoung();\n} else if (a instanceof Bird) {\n\
  \    // ...\n    b.layEggs();\n    b.buildNest();\n}\n```\n\n在对对象应用类型转换之前，应该先对引用变量进行测试，以防止运行时问题。这就是为什么使用\
  \ `if-else` 语句和 `instanceof` 运算符检查对象类型被认为是一种良好的代码习惯。\n\n\n\n\nJava 中的 `instanceof`\
  \ 运算符用于检查一个对象是否是特定类的实例，或者是否实现了某个接口。它允许在执行特定于类型的操作之前，通过验证对象的类型来确保安全的类型转换。\n\nJava\
  \ 中的对象转换（Casting）允许你将父类类型的对象引用转换为子类类型，从而访问子类特有的方法和字段。这种类型转换需要显式语法，并且必须使用 `instanceof`\
  \ 运算符进行验证，以确保对象确实是目标子类的实例，从而避免遇到 `ClassCastException`。\n\n![](img/Quiz_Icon.jpg)\
  \ 多选题\n\n1. **给定类声明：**\n\n```java\nclass Person {\n    String name;\n}\n\nclass\
  \ Employee extends Person {\n    double salary;\n}\n```\n\n下列哪条语句（独立调用时）会导致编译错误？\n\
  \na. `Person p = new Employee();`\nb. `Employee e = new Person();`\nc. `Employee\
  \ e = new Employee();`\nd. `Person p = new Person();`\n\n2. **为了判断是否可以将对象传递给方法的参数，我们应该寻找哪种类关系？**\n\
  \na. 'just-a'\nb. 'is-a'\nc. 'has-a'\nd. 'but-a'\n\n3. **考虑以下类声明：**\n\n```java\n\
  class Person {}\nclass Employee extends Person {}\nclass Manager extends Employee\
  \ {}\nclass Director extends Manager {}\n```\n\n下列哪个声明是无效的？\n\na. `Employee d =\
  \ new Director();`\nb. `Manager m = new Person();`\nc. `Person p = new Manager();`\n\
  d. `Manager md = new Director();`\n\n4. **下列哪条语句代表了从子类构造函数调用父类构造函数的有效格式？**\n\na.\
