  \ 1 行的 `java.awt`。\n\n在示例代码中，声明了一个 `Frame` 对象，并在第 9 行到第 12 行定义了构造函数和方法。这种方法是构建 GUI\
  \ 应用的最佳实践。首先，你声明所有的组件和容器。然后，在构造函数中初始化它们，就像提供的代码中一样。最后，你定义方法来管理这些组件的行为。\n\n在 `startApp()`\
  \ 方法中（这是一个用户自定义方法），我们设置了帧的属性。例如，我们将背景颜色设置为黄色，并设置帧的大小为 200 像素宽和 200 像素高。\n\n\n\n\n\
  ```java\n26 }\n27 } // end of code\n```\n\n这里是 `SampleFrame.java` 的运行时输出：\n\n图 9.2\
  \ `SampleFrame.java` 的运行时输出\n\n![image](img/fig9-2.jpg)\n\nJava 中的 Frame（帧）是容器，但其他其他容器，例如\
  \ Panel（面板）。Panel 提供了一个可以让你在其放置其他组件的空间，但与 Frame 不同，它们不能独立启动。Panel 必须添加到另一个容器（如 frame）中。\n\
  \n在下一个示例中，我们将同时创建一个 frame 和 panel。我们将 frame 的大小设置为 400x200 像素，并将其背景颜色设置为黄色。我们还创建了一个大小为\
  \ 100x100 像素且背景为紫色的 panel。使用 `add()` 方法将 panel 放在 frame 中。\n\n`setBackground()`\
  \ 方法用于更改容器的背景颜色，可以使用定义的颜色（如 `Color.YELLOW`）或通过指定 RGB 值使用自定义颜色。对于红、绿、蓝每个分量，RGB 值的范围都是\
  \ 0 到 255。\n\n如果你想禁用默认布局管理器（对于 frame 来说是 `BorderLayout`），可以调用 `setLayout(null)`\
  \ 来禁用布局管理器。然后，你可以手动在 frame 内部定位组件。\n\n这里有一个创建一个基础 frame 和 panel 的简单示例代码。下面的源代码保存为\
  \ `PanelInsideAFrame.java`。\n\n```java\nimport java.awt.*;\n\npublic class PanelInsideAFrame\
  \ {\n    private Frame f;\n    private Panel p;\n\n    public PanelInsideAFrame()\
