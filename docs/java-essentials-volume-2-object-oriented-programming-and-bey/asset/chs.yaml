  ## 2 面向对象概念简介\n### 2.1 对象 vs 类\n## 2.2 对象实例化\n\n\n局限性与不良实践：\n- 当影响可读性时不要使用：`var\
  \ x = someMethod();` // x 存储了什么？`String userName = someMethod();` //清晰且显式\n- 不能在未初始化的情况下\
  \ var：`var total;` // 错误：无法推断类型；`var total = 0;` // OK\n- 它不能用于方法参数或返回类型：`public\
  \ void print(var name) {}` // 不允许；`public var getName() { return \"Alice\"; }` //\
  \ 不允许\n\n使用 var 的用处\n- 减少代码冗余性\n- 在某些情况下提高可读性\n\n在 Java 10 中，引入了 `var` 关键字，通过允许编译器从赋值右侧的值推断变量类型，从而简化局部变量的声明。这一特性并没有让\
  \ Java 变成动态类型语言；类型仍然在编译时确定。使用 `var` 时，最好在能够提高代码清晰度的地方使用，而不是仅仅让代码变短。此外，用 `var` 声明的变量必须在声明时初始化。\n\
  \n下面是一个完整的 Java 程序中使用 `var` 关键字的示例：\n\n```java\npublic class VarExample {\n    public\
  \ static void main(String[] args) {\n        // 使用 var 声明局部变量\n        // 推断为 String\n\
  \        var message = \"Hello, Java 10 and beyond!\";\n\n        // 推断为 int\n \
  \       var number = 42;\n\n        // 推断为 double\n        var pi = 3.14159;\n\n\
  \        // 推断为 boolean\n        var isJavaFun = true;\n\n        // 打印变量\n    \
  \    System.out.println(message);\n        System.out.println(\"Number: \" + number);\n\
  \        System.out.println(\"Pi: \" + pi);\n        System.out.println(\"Is Java\
  \ fun? \" + isJavaFun);\n\n        // 在循环中使用 var\n        var fruits = new String[]\
  \ { \"Apple\", \"Banana\", \"Cherry\" };\n        for (var fruit : fruits) {\n \
  \           System.out.println(\"Fruit: \" + fruit);\n        }\n\n        // var\
  \ 推断对象\n        var person = new Person(\"Lawrence\", 25);\n        person.introduce();\n\
  \    }\n}\n\n// 一个简单的类\nclass Person {\n    private String name;\n    private int\
  \ age;\n\n    Person(String name, int age) {\n        this.name = name;\n      \
  \  this.age = age;\n    }\n\n    void introduce() {\n        System.out.println(\"\
  Hi, I’m \" + name + \" and I’m \" + age + \" years old.\");\n    }\n}\n```\n\n\n\
