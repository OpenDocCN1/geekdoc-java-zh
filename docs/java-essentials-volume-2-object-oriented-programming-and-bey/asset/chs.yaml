  ```\nName: Buddy, Age: 3\nWoof! Woof!\nFetching the ball!\nName: Whiskers, Age:\
  \ 2\nMeow! Meow! Meow!\nPurring softly!\n```\n\n根据带有属性列表和构造函数的 UML 图，编写该 UML 图的类版本并将其保存为\
  \ `Student.java`。除了 `Student.java` 之外，你还需要创建一个名为 `TestStudent.java` 的对应测试类，其中包含\
  \ `main` 方法。\n\n**Student**\n- `- name: String`\n- `- studentId: int`\n- `- course:\
  \ String`\n- `+ Student(String name, int studentId, String course)`\n- `+ getters()`\n\
  - `+ toString()`\n- `+ equals()`\n- `+ hashCode()`\n\n在 `main` 方法中，你需要创建两个名为 `s1`\
