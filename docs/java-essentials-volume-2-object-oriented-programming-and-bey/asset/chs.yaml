  ![](img/code.jpg)\n\n## 编码任务\n\n### 编码任务 1：用户名与密码\n\n创建一个 Java 程序，读取名为 `userList.txt`\
  \ 的文本文件。该文件名应通过命令行传递。该文件包含一个用户名和密码的列表。奇数行包含用户名，偶数行包含前行用户名对应的密码。以下是 `userList.txt`\
  \ 中 `String` 列表的示例内容：\n\n| 1 | user1 |\n| 2 | password1 |\n| 3 | user2 |\n| 4 |\
  \ password2 |\n| 5 | user3 |\n| 6 | password3 |\n\n一旦在文件 `userList.txt` 中读取了 `String`\
  \ 值，你将创建名为 `usernames.txt` 和 `password.txt` 的两个文本文件。`usernames.txt` 文件包含所有位于奇数行的用户名，而密码将写入\
  \ `password.txt` 文件中。不需要输出消息，但如果能提供代码已成功运行的确认会更好。你判断代码是否运行的唯一方法是当 `usernames.txt`\
  \ 和 `password.txt` 都包含了正确的 `String` 值。\n\n`usernames.txt` 应包含以下内容：\n```\nuser1\n\
  user2\nuser3\n```\n\n`password.txt` 应包含以下内容：\n```\npassword1\npassword2\npassword3\n\
  ```\n\n### 编码任务 2：Java 文件 IO\n\n#### 目标：\n编写一个 Java 程序，从一个文本文件读取数据，处理数据，并将处理后的数据写入另一个文本文件。\n\
  \n#### 练习详情：\n\n**输入文件：**\n你将获得一个名为 `input.txt` 的文本文件，其中包含多行数据。假设该文件格式如下，每行代表一个记录（包含姓名、年龄和城市）：\n\
  ```\nAlice,30,New York\nBob,25,Los Angeles\nCharlie,35,Chicago\n```\n你需要读取这些数据，筛选年龄大于\
  \ 28 岁的记录，并将这些姓名和城市写入名为 `output.txt` 的文件中。\n\n**任务 1：读取文件**\n使用 `BufferedReader`\
  \ 读取 `input.txt` 的内容。\n\n**任务 2：处理数据**\n处理读取到的数据，筛选年龄大于 28 岁的记录。\n\n**任务 3：写入新文件**\n\
  使用 `BufferedWriter` 或 `FileWriter` 将处理结果写入 `output.txt`。\n\n**任务 4：处理异常**\n使用 `try-catch`\
  \ 块处理可能出现的 `IOException` 异常。\n\n**任务 5：关闭资源**\n在操作完成后，确保通过 `close()` 方法关闭流。\n\n\
  **任务 6：显示结果**\n在控制台输出处理后的数据以进行验证。\n\n# 第 8 章：Java 集合与泛型简介\n\n![](img/collection.jpg)\n\
  \n## 本章学习目标\n- 理解 `Collection` 接口在 Java 中的作用\n- 区分 `Set`、`List` 和 `Map` 之间的区别\n\
  - 学习如何使用 `Iterator` 迭代器遍历元素\n- 熟悉泛型 `Generics` 以及类型安全的集合\n- 利用菱操作符 `<>` 简化实例化\n\
  - 开发根据问题选择合适集合的技能\n\n本章将介绍 Java 集合框架（Collections Framework），这是一组用于高效存储、检索和操作对象对象的类和接口。在这里你将学习主要的集合类型——`Set`、`List`\
  \ 和 `Map`——以及它们如何解决不同的问题。\n\n## 8.1 Collection 接口\n\n`Collection` 接口是层次结构中的根接口。它代表一组被称为元素的对象。\n\
  \n有些集合允许重复元素，而有些不允许。有些是有序的，有些则不是。Java 工具包没有提供任何直接实现。它只提供了更具体的子接口，如 `set` 和 `list`。该接口通常用于传递和操作集合，当需要通用性时。\n\
  \n\n\n\n在考虑这些接口的实现类时，`Set` 有如 `HashSet` 和 `TreeSet` 等显著的实现。对于 `List`，常见的实现包括 `Vector`、`ArrayList`\
  \ 和 `LinkedList`。\n\n回到 `Collection` 的基本概念，它代表一组被称为“元素”的对象。这个概念与数组有些相似，数组也是表示一组元素的对象。然而，区别在于它们所能包含的元素的灵活性和类型。`Collection`\
  \ 只能持有对象，而数组既可以包含一组对象，也可以包含一组原始类型值。例如，你可以拥有一个对象数组（如 `String` 或 `Student` 对象的数组），也可以拥有一个原始类型数组（如\
  \ `int` 或 `boolean` 数组）。要将原始类型数组转换为对象集合，就需要用到包装类。\n\n另一个关键区别在于它们的内存管理和线程安全性。现代集合不是自动线程安全的，尽管某些集合（如同步列表，synchronized\
  \ lists）提供了线程安全性。与数组相比，线程安全的集合在内存使用上往往更重，而数组不是线程安全的，因此更轻量。这种线程安全性允许集合被多个并发用户共享，而数组通常用于单用户场景。\n\
  \n考虑像 Facebook 这样的社交媒体平台例子：你会把朋友称为一个集合，而不是一个朋友的数组。将朋友视为集合而不是数组更为合适，因为集合（如 Java 中的\
  \ `List` 或 `Set`）提供了灵活且动态的存储，允许轻松地添加或删除朋友，而没有预定义大小的限制。与数组不同，集合更适合处理现实世界中的数据，在这些数据中，元素的数量可能会变化，并且通常需要搜索或排序等操作。\n\
  \n每当你通过好友请求时，你就将他们添加到你的朋友集合中。你朋友集合的大小会动态增加。同样，当你从集合中删除某个好友时，你就将他们从集合中移除，每删除一个好友，你的朋友数量就会动态减少。相反，数组的大小在创建时就是固定的；其大小不能动态变化。\n\
  \n此外，集合是可变的；它们随着你添加更多元素而增大，随着移除元素而缩小。相比之下，数组的长度是固定的——一旦数组被创建，其大小在整个生命周期内都保持不变。\n\
  \n表 8.1 列出了集合与数组之间的主要区别。\n\n表 8.1 集合对比数组\n\n| 集合 | 数组 |\n| --- | --- |\n| 表示一组对象的单一对象，称为其元素。\
  \ | 表示一组对象或原始值的单一对象。 |\n| 部分集合是线程安全的，如果是同步的则很重。 | 不是线程安全的，轻量级。 |\n| 可变，`Collection`\
  \ 对象可以根据你向集合内部添加或删除对象而变大或变小。 | 长度在创建数组对象时已固定。 |\n| 使用 `.size()` 方法检查 `Collection`\
  \ 内部元素的数量。 | 使用属性 `.length` 检查数组的大小。 |\n\n## 8.2 Set 接口](#08_Contents.xhtml_ch8-2)\n\
  \n让我们深入研究 `Collection` 接口的一个子接口，即 `Set` 接口。`Set` 接口设计用于存储一组无序的元素，这意味着元素的顺序是不保证的。\n\
  \n`Set` 的基本特征之一是禁止重复元素。这意味着 `Set` 中的每个元素都是唯一的。如果你尝试添加重复元素，只有第一个实例会被保留，而随后的重复元素将被忽略。\n\
  \n此外，`Set` 最多允许一个 `null` 元素。为了说明这一点，考虑下方的示例代码。在这里，我们声明了一个 `Set` 对象，并用 `HashSet`\
  \ 实例化，它是 `Set` 接口最常用的实现之一。从第 6 行到第 12 行，各种对象被添加到 `Set` 中，包括一些重复。这些重复对象不会触发任何运行时错误。相反，每个对象的第一次出现会被存储在\
  \ `Set` 中。当打印 `Set` 时，只会显示唯一的元素，因为重复元素会被自动排除。\n\n这是一个保存为 `SetExample.java` 的示例文件。\n\
  \n```java\nimport java.util.*;\n\npublic class SetExample {\n    public static void\
  \ main(String[] args) {\n        Set set = new HashSet();\n\n        set.add(\"\
  Lawrence\");\n        set.add(100);\n        set.add(false);\n        set.add(\"\
  java\");\n        set.add(\"java\");\n        set.add(\"Lawrence\");\n        set.add(3.0);\n\
  \n        System.out.println(set);\n    }\n}\n```\n\n如果你直接使用 `javac` 命令编译给定代码，你将收到一个通知：\n\
  \n```\njavac SetExample.java <ENTER>\n```\n\n注意：`SetExample.java` 使用了未检查或不安全的的操作。\n\
  \n注意：使用 `-Xlint:unchecked` 重新编译查看详情。\n\n要使用选项显示编译警告，我们使用此命令：\n\n```bash\njavac -Xlint:unchecked\
  \ SetExample.java <ENTER>\n```\n\n使用 `-Xlint:unchecked` 编译选项将显示以下内容：\n\n```\nSetExample.java:6:\
  \ warning: [unchecked] unchecked call\nto add(E) as a member of the raw type\n \
  \   set.add(\"Lawrence\");\n    ^\n  where E is a type-variable:\n    E extends\
  \ Object in interface Set\nSetExample.java:7: warning: [unchecked] unchecked call\n\
  to add(E) as a member of the raw type\n    set.add(100);\n    ^\n  where E is a\
  \ type-variable:\n    E extends Object in interface Set\nSetExample.java:8: warning:\
  \ [unchecked] unchecked call\nto add(E) as a member of the raw type\n    set.add(false);\n\
  \    ^\n  where E is a type-variable:\n    E extends Object in interface Set\nSetExample.java:9:\
  \ warning: [unchecked] unchecked call\nto add(E) as a member of the raw type\n \
  \   set.add(\"java\");\n    ^\n  where E is a type-variable:\n    E extends Object\
  \ in interface Set\nSetExample.java:10: warning: [unchecked] unchecked call\nto\
  \ add(E) as a member of the raw type\n    set.add(\"java\");\n    ^\n  where E is\
  \ a type-variable:\n    E extends Object in interface Set\nSetExample.java:11: warning:\
  \ [unchecked] unchecked call\nto add(E) as a member of the raw type\n    set.add(\"\
  Lawrence\");\n    ^\n  where E is a type-variable:\n    E extends Object in interface\
  \ Set\nSetExample.java:12: warning: [unchecked] unchecked call\nto add(E) as a member\
  \ of the raw type\n    set.add(3.0);\n    ^\n  where E is a type-variable:\n   \
  \ E extends Object in interface Set\n7 warnings\n```\n\n警告只是警告，它们不是错误。因此，我们仍然可以使用以下命令运行它们：\n\
  \n```bash\njava SetExample <ENTER>\n```\n\n运行时输出：\n\n```\n[java, 100, false, Lawrence,\
  \ 3.0]\n```\n\n在编译和运行 `SetExample.java` 后，我们注意到一个编译警告，这在初始示例中很常见，因为还没有使用 Java 泛型（Generics）。虽然这些警告不是错误，但通常的做法是认真对待它们。\n\
  \n\n\n\n在这个示例中，尽管向 `Set` 添加了七个对象，但打印 `Set` 时只有五个唯一元素。请注意，“java\" 和 \"Lawrence\"\
  \ 字符串只出现了一次，尽管在第 9 行和第 10 行添加了 \"java\"，第 6 行和第 11 行添加了字符串 \"Lawrence\"。Java 中的\
  \ `HashSet` 是一种存储唯一元素的集合，并提供了使用哈希表进行添加、删除和搜索项目的高效操作。它不维护元素的特定顺序，并会自动消除重复。这种行为源于继承自\
  \ `Collection` 接口的 `add()` 方法，该方法返回一个布尔值。如果尝试添加重复元素，该方法简单地返回 `false`，表示元素未被添加。\n\
  \n## 8.3 List 接口\n\n现在让我们来检查 `List` 接口，并理解它与 `Set` 接口的区别。与 `Set` 不同，`List` 表示一个有序集合，这意味着元素添加的顺序会被保留。`List`\
  \ 接口允许用户对每个元素的插入位置进行精确控制。你可以通过索引位置访问元素，甚至在列表中搜索特定的元素。此外，`List` 接口允许重复元素，使得存在重复项成为可能。这里有一个保存为\
  \ `ListExample.java` 的示例代码。\n\n```java\nimport java.util.*;\n\npublic class ListExample\
  \ {\n    public static void main(String[] args) {\n        List list = new ArrayList();\n\
  \n        list.add(\"Lawrence\");\n        list.add(100);\n        list.add(false);\n\
  \        list.add(\"java\");\n        list.add(\"java\");\n        list.add(\"Lawrence\"\
  );\n        list.add(3.0);\n\n        System.out.println(list);\n    }\n}\n```\n\
  \n运行时输出：\n`[Lawrence, 100, false, java, java, Lawrence, 3.0]`\n\n与上一个示例中的代码一样，你会遇到类似的编译警告。我们将在本章节后面讨论\
  \ Java 泛型（Generics）概念时消除该警告。\n\n考虑第 4 行的代码段，我们在那里使用 `ArrayList` 实现声明了一个 `List` 对象。有多种\
  \ `List` 实现可用，包括 `ArrayList`、`Vector` 和 `LinkedList`。`ArrayList` 类似于数组。在第 6 行到第\
  \ 12 行，我们向列表添加了多个对象——总共七个，包括一些重复。\n\n这些重复项无问题地被添加到列表中，当我们在第 14 行打印列表时，输出显示了元素添加的顺序被保留了。第一个添加的对象是字符串\
  \ \"Lawrence\"，最后一个是双精度值 3.0，这在输出中得到了反映。\n\n为了更好地理解 `Set` 和 `List` 之间的区别，让我们来看一个涉及\
  \ `Set` 的代码示例，特别是 `HashSet`，它是 `Set` 的类实现之一。我们向集合中添加了几个对象并打印结果。\n\n当执行 `SetExample`\
  \ 代码时，只打印了五个对象，尽管添加了七个。这是因为如之前讨论过的，`Set` 接口不允许重复。当检测到重复项时，`add()` 方法返回 `false`，因此，这些元素不会被再次添加。此外，`Set`\
  \ 中的元素顺序不会被保留，正如 \"Lawrence\" 是先添加的，但先检索到 \"java\" 所证明的那样。\n\n相比之下，当我们对相同的对象使用 `List`（特别是\
  \ `ArrayList`）时，输出反映了所有七个元素按它们添加的顺序。在编译并运行 `ListExample.java` 后，我们观察到列表如预期地维护了元素的顺序。\n\
  \n那么，你什么时候应该使用 `Set`，什么时候应该使用 `List` 呢？\n\n如果元素的排列不重要，并且你想确保所有元素都是唯一的，那么 `Set` 是合适的。例如，如果你在跟踪一组同学，而他们进入房间的顺序不需要保留，那么\
  \ `Set` 就会很合适。\n\n另一方面，如果元素的顺序很重要，`List` 是更好的选择。例如，在制作购物清单时，物品的顺序可能反映优先级（例如在购买洗衣用品之前购买食品），此时\
  \ `List` 是理想的，并且允许重复项。\n\n要总结 `Set` 和 `List` 的区别，你可以查阅表 8.2。\n\n表 8.2 Set 和 List\
  \ 接口的比较。\n\n| 特性 | Set | List |\n| --- | --- | --- |\n| 顺序 | 无序元素 | 有序元素 |\n| 重复项\
  \ | 不允许（每个元素必须是唯一的） | 允许（你可以拥有同一元素的多个副本） |\n| 索引访问 | 不支持（无法通过索引检索） | 支持（可以通过索引检索、插入或删除）\
  \ |\n| 实现示例 | HashSet, TreeSet | ArrayList, LinkedList, Vector |\n| 主要用途 | 留唯一元素\
  \ | 保留顺序或允许重复 |\n| 性能 | 搜索速度快 | |\n\n## 8.4 Map 接口\n\n`Map` 是一种用于存储键值对的数据结构，通过称为“键”（key）的唯一标识符进行访问。在\
  \ `java.util` 包中，你会找到 `Set` 和 `List` 接口，`Map` 并不是其中之一。`Map` 由对 K 和 V 组成。在创建 `Map`\
  \ 时，你需要使用菱操作符 `<>` 指定类型。相比之下，对于 `Map`，`HashMap` 是实现之一。`HashMap` 不保证条目的顺序，但它非常快。在下面的代码中，我们将演示\
  \ `Map` 的用法。给定文件保存为：`MapExample.java`。\n\n```java\nimport java.util.*;\n\npublic\
  \ class MapExample {\n    public static void main(String[] args) {\n        Map\
  \ map = new HashMap<>();\n\n        map.put(\"one\", \"uno\");\n        map.put(\"\
  two\", \"dos\");\n        map.put(\"three\", \"tres\");\n\n        System.out.println(\"\
  Original Map Values: \");\n        System.out.println(map);\n\n        // 覆盖之前的赋值\n\
  \        map.put(\"three\", \"trois\");\n\n        System.out.println(\"Updated\
  \ Map Values: \");\n        System.out.println(map);\n\n        // 返回键的集合\n    \
  \    Set set1 = map.keySet();\n        System.out.println(set1);\n\n        // 返回值的集合\n\
  \        Collection collection = map.values();\n        System.out.println(collection);\n\
  \n        // 返回键值对映射的集合\n        Set set2 = map.entrySet();\n        System.out.println(set2);\n\
  \n        System.out.println(set1 + \"\\n\" + collection + \"\\n\" + set2);\n  \
  \  }\n}\n```\n\n运行时输出：\nOriginal Map Values:\n{one=uno, two=dos, three=tres}\nUpdated\
  \ Map Values:\n{one=uno, two=dos, three=trois}\n[one, two, three]\n[uno, dos, tres]\n\
  [one=uno, two=dos, three=trois]\n\n\n\n\n\n与 `Set` 或 `List` 不同（在其中你会使用 `add()` 方法插入元素），在\
  \ `Map` 中，你使用 `put()` 方法。该方法插入一对对象——其中一个作为键（key），另一个作为值（value）。在这个示例中，键和值都是字符串。\n\
  \n例如，键 `\"one\"` 关联值 `\"uno\"`，`\"two\"` 关联 `\"dos\"`，`\"three\"` 关联 `\"tres\"`。使用\
  \ `System.out.println(map);` 打印原始的 `Map` 值时，你将会在运行时输出中看到键值对。\n\n然而，如果你使用已有的键插入另一个键值对，例如用新值\
  \ `\"teen\"` 关联 `\"three\"`，它将覆盖与该键关联的旧值。这意味着键值对 `\"three\", \"teen\"` 将替换 map 中的键值对\
  \ `\"three\", \"tres\"`。\n\n编译并运行 `MapExample.java` 后，尽管有关于未使用菱形操作符或泛型的警告，原始 map\
  \ 将显示 `{one=uno, two=dos, three=tres}`，更新后的 map 将显示 `{one=uno, two=dos, three=teen}`。\n\
  \n需要注意的是，`Map` 中的键对象必须是唯一的。要检索键，可以使用 `keySet()` 方法，它返回 map 中所有键的集合。由于 `Map` 中的键和值都是对象，因此无法直接添加原始类型。但是，从\
  \ Java 5 开始，自动装箱（autoboxing）允许将原始值自动转换为对应的包装类等。\n\n在操作 `Map` 时，每个条目（键值对）被视为一个条目集（entry\
  \ set）进行，可以使用 `entrySet()` 方法检索。打印如 `Map`、`Set` 或 `List` 等对象通常会用方括号（`[]`）显示元素。\n\
  \n如果你想自定义打印这些元素的方式——例如，以特定格式仅打印键——你可以对集合进行迭代。迭代可以通过两种方式进行：正向或反向，取决于所需的结果。为了实现这一点，我们必须讨论\
  \ `Iterator` 接口的概念。\n\n## 8.5 Iterator 迭代器接口\n\n我们已经讨论了 `Set`、`List` 和 `Map` 接口，以及如何使用\
  \ `System.out.println()` 等方法从这些集合中添加和打印对象。在打印这些对象时，它们通常显示在方括号（`[]`）内。\n\n然而，如果你想以不同的格式输出，或者如果你需要在遍历集合时执行计算并将值存储在其他处，可以使用\
  \ `Iterator` 或 `ListIterator` 接口。\n\n图 8.2 Iterator 和 ListIterator 接口\n\n![image](img/fig8-2.jpg)\n\
  \n`Iterator` 是用于循环遍历集合（如 `ArrayList` 或 `HashSet`）的对象。“迭代”（iterating）一词指的是循环，迭代器仅支持正向迭代。这使得\
  \ `Iterator` 接口非常适用于不维护特定顺序的 `Set` 集合。\n\n对于 `List` 集合，可以使用 `ListIterator` 接口。列表维护了元素的顺序，因此\
  \ `ListIterator` 允许你正向和反向遍历列表。\n\n让我们考虑一个例子。在我们的代码中，有一个在之前的示例中使用过的 `Person` 类。该类有两个属性：`name`\
  \ 和 `age`。它还包含一个构造函数、getter 方法（`getName()` 和 `getAge()`）、一个 `toString()` 方法、一个 `equals()`\
  \ 方法和一个 `hashCode()` 方法。\n\n```java\npublic class Person {\n    private String name;\n\
  \    private int age;\n\n    public Person(String name, int age) {\n        this.name\
  \ = name;\n        this.age = age;\n    }\n\n    // getters\n    public String getName()\
  \ {\n        return name;\n    }\n    public int getAge() {\n        return age;\n\
  \    }\n\n    // toString method\n    public String toString() {\n        return\
  \ getName() + \", at age \" + getAge();\n    }\n\n    // equals and hashCode method\n\
  \    public boolean equals(Object obj) {\n        boolean result = false;\n\n  \
  \      if (obj != null && obj instanceof Person ) {\n            Person p = (Person)\
  \ obj;\n            if (this.getName().equals(p.getName())\n             && this.getAge()\
  \ == p.getAge()) {\n                result = true;\n            }\n        }\n \
  \       return result;\n    }\n\n    public int hashCode() {\n        return getName().hashCode()\
  \ ^ getAge();\n    }\n}\n```\n\n在我们的测试类中，我们实例化五个 `Person` 对象。我们将创建一个实现为 `HashSet`\
  \ 的集合 `myFriends`，并添加这些 `Person` 对象。由于 `HashSet` 不保证顺序，当我们使用 `System.out.println(myFriends);`\
  \ 打印集合时，元素的顺序可能与添加它们的顺序不同。此外，输出将被封装在方括号中。这里是我们的测试类 TestPerson.java 的代码。\n\n```java\n\
  import java.util.*;\n\npublic class TestPerson {\n    public static void main(String[]\
  \ args) {\n        int sum = 0;\n\n        Person p1 = new Person(\"Edwin\", 20);\n\
  \        Person p2 = new Person(\"Percy\", 30);\n        Person p3 = new Person(\"\
  Ericson\", 24);\n        Person p4 = new Person(\"Jerry\", 18);\n        Person\
  \ p5 = new Person(\"Lesley\", 27);\n\n        Set myFriends = new HashSet();\n\n\
  \        myFriends.add(p1);\n        myFriends.add(p2);\n        myFriends.add(p3);\n\
  \        myFriends.add(p4);\n        myFriends.add(p5);\n\n        System.out.println(myFriends);\n\
  \    }\n}\n```\n\n运行时输出：\n`[Edwin, at age 20, Lesley, at age 27, Percy, at age 30,\
  \ Jerry, at age 18, Ericson, at age 24]`\n\n如果我们想单独打印每个朋友的信息，并计算该组的平均年龄，可以使用 `Iterator`\
  \ 接口。由于我们正在处理 `Set`，因此可以使用迭代器。\n\n它的工作原理如下：\n- 我们使用 `myFriends.iterator()` 创建一个迭代器。`iterator()`\
  \ 方法定义在 `Set` 接口中并返回一个迭代器对象。\n- 迭代器提供三个主要方法：`hasNext()`、`next()` 和 `remove()`。这些方法帮助我们循环遍历集合。\n\
  - 我们使用 `while` 循环来遍历集合。条件 `it.hasNext()` 检查是否有更多元素待处理。如果为真，我们通过 `it.next()` 获取下一个元素。\n\
  - 如果需要，我们可以通过适当的类型转换将检索到的元素存储在变量中（例如 `Person` 对象）。\n- 为了计算平均年龄，我们使用 `p.getAge()`\
  \ 计算所有 `Person` 对象的年龄总和，然后除以通过 `myFriends.size()` 获取的元素总数。下面是我们的测试类 TestPerson.java\
  \ 的更新版本，这次使用了 `Iterator` 对象。\n\n```java\nimport java.util.*;\n\npublic class TestPerson\
  \ {\n    public static void main(String[] args) {\n        int sum = 0;\n\n    \
  \    Person p1 = new Person(\"Edwin\", 20);\n        Person p2 = new Person(\"Percy\"\
  , 30);\n        Person p3 = new Person(\"Ericson\", 24);\n        Person p4 = new\
  \ Person(\"Jerry\", 18);\n        Person p5 = new Person(\"Lesley\", 27);\n\n  \
  \      Set myFriends = new HashSet();\n\n        myFriends.add(p1);\n        myFriends.add(p2);\n\
  \        myFriends.add(p3);\n        myFriends.add(p4);\n        myFriends.add(p5);\n\
  \n        Iterator it = myFriends.iterator();\n        while (it.hasNext()) {\n\
  \            Person p = (Person) it.next();\n            System.out.println(p);\n\
  \            sum += p.getAge();\n        }\n\n        System.out.println(\"Sum:\
  \ \" + sum);\n        double averageAge = (double)sum/myFriends.size();\n      \
  \  System.out.println(\"Average age of my Friends: \" + averageAge);\n    }\n}\n\
  ```\n\n最后，我们编译并运行修改后的 TestPerson.java。输出将显示每个朋友的细节，并显示平均年龄。\n\n运行时输出：\nEdwin, at\
  \ age 20\nLesley, at age 27\nPercy, at age 30\nJerry, at age 18\nEricson, at age\
  \ 24\nSum: 119\nAverage age of my Friends: 23.8\n\n这种方法允许我们遍历集合中的每个元素，执行平均值等计算，并以自定义格式显示结果。\n\
  \n\n\n\n\n## 8.6 泛型框架简介\n\n当我们编译 Java 源代码时，在编译 `MapExample.java` 文件时经常会看到类似下面的编译警告：\n\
  \n注意：`MapExample.java` 使用了未检查或不安全的操作。\n\n注意：使用 `-Xlint:unchecked` 重新编译查看详情。\n\n\
  这些警告出现是因为我们可能在没有泛型的情况下使用了集合框架。那么，泛型框架究竟是什么？我们如何使用它来消除这些警告呢？\n\n泛型框架是在 Java 5 中引入的，它提供了一种参数类型的方法，这种类型被称为元素（elements）。如果你查看任何集合接口或类的\
  \ Java API 文档，你会注意到一个带有类型参数的菱形运算符（`<>`），例如 `E`（代表元素）。集合的子接口也是如此。对于 `Map`，我们不使用 `E`，而是使用\
  \ `K` 和 `V` 来表示键值对。\n\n泛型减少了在集合中添加或检索对象时所需的代码量。例如，在之前的示例中，当我们使用 `iterator` 从集合中检索对象时，我们必须对返回的对象进行强制类型转换，因为\
  \ `next()` 方法返回的是通用 `Object` 类型。\n\n通过使用泛型，我们引入了编译时类型安全，允许编译器在编译期间捕获无效类型。这同时也消除了显式类型转换的需要。让我们看看使用泛型的新版本循环是如何工作的。请参考下面的代码第\
  \ 26 到 31 行。\n\n你可以在集合声明中声明泛型。例如，在 `Set` 声明中，你可以使用菱形运算符（`<>`）指定它只接受 `Person` 对象。声明的左侧和右侧都应该指定\
  \ `Person` 类型。这确保了只有 `Person` 对象可以添加到 `Set` 中。如果你尝试添加非 `Person` 对象（例如 `String`），将导致编译错误。此错误有助于确保只有正确的类型被添加到集合中，而且它在编译期间出现，使其更容易调试。查看下方代码中注释的第\
  \ 20 行；使用该行会导致错误。\n\n让我们重新回到测试类 `TestPerson.java`，但这次它使用了菱形运算符（`<>`）。\n\n```java\n\
  1  import java.util.*;\n2\n3  public class TestPerson {\n4  public static void main(String[]\
  \ args) {\n5      int sum = 0;\n6\n7      Person p1 = new Person(\"Edwin\", 20);\n\
  8      Person p2 = new Person(\"Percy\", 30);\n9      Person p3 = new Person(\"\
  Ericson\", 24);\n10     Person p4 = new Person(\"Jerry\", 18);\n11     Person p5\
  \ = new Person(\"Lesley\", 27);\n12\n13     Set<Person> myFriends = new HashSet<Person>();\n\
  14\n15     myFriends.add(p1);\n16     myFriends.add(p2);\n17     myFriends.add(p3);\n\
  18     myFriends.add(p4);\n19     myFriends.add(p5);\n20     // myFriends.add(\"\
  My other friend..\"); //! error\n21\n22     // System.out.println(myFriends);\n\
  23\n24     Iterator<Person> it = myFriends.iterator();\n25\n26     while(it.hasNext())\
  \ {\n28             Person p = it.next();\n29             System.out.println(p);\n\
  30             sum += p.getAge();\n31     }\n32\n33     System.out.println(\"Sum:\
  \ \" + sum);\n34     double averageAge =\n35                 (double) sum / myFriends.size();\n\
  36     System.out.println(\"Average age of my Friends: \"\n37                 +\
  \ averageAge);\n38 }\n39 }\n```\n\n此外，你可以使用增强 for 循环（也称为 \"for-each\" 循环）来遍历集合。增强\
  \ for 循环专门设计用于集合和数组使用。它由两部分组成：第一部分是一个临时对象（例如 `Person p`），第二部分是集合（`myFriends`）。该循环会自动从集合中检索每个\
  \ `Person` 对象，使代码更加简洁。\n\n尝试通过更改测试类 `TestPerson.java` 的第 21 到 31 行，使用下面的代码片段来增强\
  \ for 循环。它应该仍然可以工作，并且会给你相同的输出。\n\n```java\nfor (Person p : myFriends) {\n    System.out.println(p);\n\
  \    sum += p.getAge();\n}\n```\n\n## 8.7 菱形运算符 (<>)\n\n在 Java 7 中，引入了一种名为菱形运算符（`<>`）的新特性以减少冗余。在此之前，你通常需要在左侧和右侧指定类型。例如，在声明\
  \ `Set` 或 `List` 时，你需要指定类型：\n\n```java\nSet<Person> myFriends = new HashSet<Person>();\n\
  ```\n\n然而，使用菱形运算符，编译器会从左侧推断类型。这也适用于 `Map` 对象：\n\n```java\nMap<String, Integer> myMap\
  \ = new HashMap<String, Integer>();\n```\n\n这种方法允许编译器从左侧推断类型。让我们来看一个例子：\n\n```java\n\
  Set<Person> myFriends = new HashSet<>();\n```\n\n在这里，我们声明了 `Set` 将包含 `Person` 对象，但由于菱形运算符，我们不再需要在右侧重复\
  \ `Person` 类型。如果我们保存、编译并运行代码，将获得之前相同的输出，但语法更简洁。\n\n## 8.8 不变集合的工厂方法 (JDK 9)\n\n\
  在 JDK 9 中，`List`、`Set` 和 `Map` 接口引入了新的工厂方法 `of()` 和 `copyOf()` 来创建不变集合。这些方法使得创建固定集合变得简单和简洁。例如：\n\
  \n```java\nList<String> names = List.of(\"Alice\", \"Bob\", \"Charlie\");\nSet<Integer>\
  \ numbers = Set.of(1, 2, 3);\nMap<Integer, String> idToName = Map.of(1, \"Apple\"\
  , 2, \"Banana\");\n```\n\n这种方式创建的集合是不变的，如果你尝试修改它们，将抛出 `UnsupportedOperationException`。这对于创建常量或传递不更改的数据特别有用。\n\
  \n## 8.9 使用 var 回顾局部变量类型推断 (JDK 10)\n\n让我们重新回顾第一章讨论过的 JDK 10 `var` 关键字。`var` 关键字允许编译器推断变量类型，在使用泛型集合时可以提高代码的可读性。当类型从右侧显而易见时，这种方法特别有用：\n\
  \n```java\nvar names = List.of(\"Jane\", \"John\", \"Doe\");\nvar idMap = new HashMap<Integer,\
  \ String>();\n```\n\n然而，开发者应该谨慎使用 `var` 以保持可读性，特别是在复杂的声明中。\n\n## 8.10 Collectors.toUnmodifiableList/Set/Map\
  \ (JDK 10)\n\n在 JDK 10 中，Java 引入了新的收集器方法，可以直接从流（streams）中创建只读集合。这些是 `Collectors.toUnmodifiableList()`、`Collectors.toUnmodifiableSet()`\
  \ 和 `Collectors.toUnmodifiableMap()` 方法。\n\n\n\n\n在此之前，你通常会将元素收集到一个普通集合中，然后使用 `Collections.unmodifiableList()`\
  \ 或类似方法对其进行封装。现在，你只需一步即可生成不可修改的集合，使代码更加简洁且更不容易出错。不可修改的集合在创建后无法被更改，任何添加、删除或更新元素的尝试都会导致\
  \ `UnsupportedOperationException`。当你希望确保 `stream` 操作的结果保持一致，并且不会在程序的其他地方被无意中修改时，这种方法非常有用。\n\
  \n以下是演示这些新方法的的示例代码：\n\n```java\nimport java.util.List;\nimport java.util.Set;\n\
  import java.util.Map;\nimport java.util.stream.Collectors;\nimport java.util.stream.Stream;\n\
  \npublic class UnmodifiableCollectorsExample {\n    public static void main(String[]\
  \ args) {\n        // 不可修改列表\n        List<String> names =\n            Stream.of(\"\
  Alice\", \"Bob\", \"Charlie\")\n                .collect(Collectors.toUnmodifiableList());\n\
  \        System.out.println(\"List: \" + names);\n\n        // 不可修改集合\n        //\
  \ 重复元素移除\n        Set<Integer> numbers = Stream.of(1, 2, 3, 3)\n            .collect(Collectors.toUnmodifiableSet());\n\
  \        System.out.println(\"Set: \" + numbers);\n\n        // 不可修改映射\n       \
  \ Map<Integer, String> idNameMap =\n            Stream.of(\"A\", \"B\", \"C\")\n\
  \                .collect(Collectors.toUnmodifiableMap(\n                    String::length,\
  \ // key：字符串长度\n                    value -> value // value：字符串本身\n            \
  \    ));\n        System.out.println(\"Map: \" + idNameMap);\n\n        // 尝试修改将抛出异常\n\
  \        // 取消注释以查看 UnsupportedOperationException\n        // names.add(\"David\"\
  );\n    }\n}\n```\n\n在此示例中，`stream` 元素直接收集到不可修改的集合中，无需额外的封装步骤。这不仅减少了样板代码，而且在收集点处强制执行了不可变性，使你的数据免受无意修改的影响。\n\
  \n## 8.11 有序集合 (JDK 21)\n\n在 JDK 21 中，Java 引入了 `SequencedCollection` 接口，它为处理具有定义遍历顺序的集合提供了一种一致的方法——这意味着元素存储在特定的序列中。这些新接口包括\
  \ `SequencedCollection`、`SequencedSet` 和 `SequencedMap`。它们扩展了现有的集合类型，并添加了方法，以便于访问第一个和最后一个元素，并能反序遍历集合。在此功能出现之前，你必须依赖不同的特定集合方法或手动迭代来完成这些任务，而这些任务在不同类型之间可能有所不同。通过有序集合，你可以编写出对于列表、集合或保持顺序的映射工作方式相同的代码，提高了可读性和一致性。\n\
  \n```java\nimport java.util.SequencedCollection;\nimport java.util.ArrayList;\n\n\
  public class SequencedCollectionExample {\n    public static void main(String[]\
  \ args) {\n        // 创建一个有序集合\n        // (ArrayList 实现了 SequencedCollection)\n\
  \        SequencedCollection<String> fruits = new ArrayList<>();\n        fruits.add(\"\
  Apple\");\n        fruits.add(\"Banana\");\n        fruits.add(\"Cherry\");\n\n\
  \        // 访问第一个和最后一个元素\n        System.out.println(\"First fruit: \" + fruits.getFirst());\n\
  \        System.out.println(\"Last fruit: \" + fruits.getLast());\n\n        //\
  \ 反序迭代\n        System.out.println(\"Fruits in reverse:\");\n        for (String\
  \ fruit : fruits.reversed()) {\n            System.out.println(fruit);\n       \
  \ }\n    }\n}\n```\n\n执行后的输出如下：\nFirst fruit: Apple\nLast fruit: Cherry\nFruits\
  \ in reverse:\nCherry\nBanana\nApple\n\n在此示例中，我们使用 `getFirst()` 和 `getLast()` 来快速检索第一个和最后一个元素，并使用\
  \ `reversed()` 从末尾到开始循环列表——这一切无需编写额外的逻辑。此功能使得处理不同集合类型的有序集合更加简单且一致。这些在较新 JDK 版本中引入的增强功能构建在集合框架（Collections\
  \ Framework）和泛型（Generics）的坚实基础之上。它们促进了不可变性、简洁性和更安全的类型处理，允许开发者编写更具表现力且易于维护的代码。\n\n\
  ## 章节总结\n\n- `Collection` 接口是 Java 集合层次结构的根，代表一组被称为元素的对象的组，并作为 `Set` 和 `List` 等更具体的子接口的基础。虽然\
  \ Java 开发工具包（JDK）没有提供此接口的直接实现，但它被广泛用于以最大的通用性传递和操作集合。\n- Java 中的 `Collection` 对象是集合框架（Collections\
  \ Framework）的一部分，提供了列表、集合和队列等动态数据结构，这些结构的大小可以增大或缩小，并提供了各种操作元素的方法。相比之下，`Arrays` 是固定大小的并存储特定类型的元素，与集合相比提供的内置方法较少。\n\
  - Java 中的 `Set` 接口设计用于存储一组无序的、唯一的元素，禁止重复且最多允许一个 `null` 元素。当向 `Set` 添加重复元素时，只保留第一次出现的内容，后续的重复元素会被忽略。\n\
  - `List` 接口表示一种有序集合，元素的序列被予以维护，允许重复并能够通过索引访问，这与存储无序、唯一元素且不允许重复的 `Set` 接口不同。在比较使用\
  \ `List` 和 `Set` 的示例时，`List`（例如 `ArrayList`）保留插入顺序并包含所有元素，而 `Set`（例如 `HashSet`）则排除重复且不保证顺序。\n\
  - `Map` 是另一种数据结构，它以键值对的形式存储元素，每个键（K）都关联一个对应的值（V），允许根据键进行高效检索。与 `Set` 和 `List` 接口使用单个类型参数（E）表示元素不同，`Map`\
  \ 接口使用两个类型参数（K 和 `V`）来定义它所持有的键和值的类型。\n- `Set`、`List` 和 `Map` 接口允许添加和打印集合的对象，通常显示在方括号（[]）中。为了在遍历集合时格式化输出或进行计算，可以使用\
  \ `Iterator` 接口进行正向迭代（特别是对于无序的 `Set`），或使用 `ListIterator` 接口对 `List` 进行双向迭代。\n- 泛型（Generics）框架极大提高了\
  \ Java 集合框架的实用性和安全性。它消除了获取对象时的强制转换，确保了编译时的类型安全，并允许代码更加简洁易读。通过在集合中声明特定类型，可以创建同质集合并避免与类型匹配相关的运行时错误。\n\
  - Java SE7 引入的钻石操作符 `<>` 简化了泛型框架的使用，允许编译器从声明中推断集合的类型，消除了在赋值语句两侧重复类型的类型。这一功能减少了冗余并增强了代码的可读性，例如\
  \ `Set<Person> mySet = new HashSet<>();`，这种情况下不再需要两次指定 `Person` 类型。\n\n### 多选题\n\
