  \n        p.setSize(100, 100);\n        p.setBackground(new Color(255, 0, 255));\n\
  \n        // frame won't be using any layout managers -> null\n        f.setLayout(null);\n\
  \        f.add(p);\n        f.setVisible(true);\n    }\n\n    public static void\
