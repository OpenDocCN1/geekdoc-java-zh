  \n在 Java 编程世界，理解面向对象的原则对于编写健壮、可重用且易维护的代码至关重要。本章通过引入定义 Java 应用设计和结构的核心概念，为面向对象编程（OOP）奠定了基础。你将学习类和对象之间的区别、如何创建和使用它们，以及封装如何帮助保护内部数据。本章还涵盖了构造函数——包括默认构造函数的规则——以及实例方法和静态方法之间的区别。最后，我们将探索\
  \ Java 源文件的组织方式、包（packages）和导入（imports）的工作原理，以及如何使用 JAR 文件、清单文件（manifest files）和\
  \ Java API 文档打包并记录你的应用程序。\n\n## 2.1 对象与类\n\n### 2.1.1 什么是对象？\n\n对象是任何真实存在。它们可以是概念性的或物理的。你周围现在的任何东西都是对象：椅子、桌子、书籍，甚至是你的纸张。但对象不仅限于我们周围的实体。当你使用桌面应用程序或你喜喜欢的文字处理器时，你也能看到其中的对象。按钮、工具栏，甚至是工作区域或对话框都是对象。物理对象可以是实体的或无形的，可见的，如\
  \ `Button` 和 `String`，以及不可见的，如数据库连接和网络连接。\n\n对象也可以是概念性的。概念对象是那些不可见但以意义方式存在的对象。这类对象也很有用，它们也代表了一组数据。概念对象的示例包括错误（errors）、异常（exceptions）、数据库连接、网络连接、触发事件等。我们将在单独的章节讨论错误、异常和事件。现在，理解这些都是概念对象的示例就很重要的。\n\
  \n### 2.1.2 什么是类？\n\n类是对象的蓝图。它是数据属性和方法（也称为行为）的声明，每个对象在每次被实例化时都会拥有这些。“实例化”（instantiate）一词与“创建”（to\
  \ create）是同义词。因此，每当你实例化一个对象时，你实际上是从一个类创建了一个对象，该对象将存储在堆内存中（Java 在运行时动态地存储对象和实例变量，允许在程序执行期间灵活地管理内存）。你几乎可以从一个类中创建无限数量的对象。每个对象都有自己的标识。这意味着，无论一个对象中发生什么变化，其他对象都不会受到影响。\n\
  \n在旧版本的 Java（Java 7 及更早版本）中，对象始终存储在堆中，而类元数据（关于类、方法等的信息）保留在堆的一个特殊部分，称为 PermGen（永久代）。\n\
  \n从 Java 8 开始，删除了 PermGen 区域。对象仍然存储在堆中，但类元数据现在存储在 Metaspace（元空间）中，它位于原生内存（堆之外）。这一变化有助于避免以前发生在\
  \ PermGen 中的内存问题。\n\n在较新的 JVM 中，编译器还可以优化非常短命的对象，使它们不会总是进入堆——有时它们可能被变量替换或临时存储在栈上。但从程序员的角度来看，你可以认为对象始终存活在堆中。\n\
  \n这里有一个清晰的对比表格来总结 Java 内存结构：Java 7 对比 Java 8+。\n\n表 2.1 Java 内存结构对比\n\n| 内存区域 |\
  \ Java 7 及更早版本 | Java 8 及以后 |\n| :--- | :--- | :--- |\n| 堆 (Heap) | 存储所有对象 | 存储所有对象（无变化）\
  \ |\n| 栈 (Stack) | 存储方法调用、局部变量和引用。 | 与 Java 7 相同（无变化） |\n| 永久代 (PermGen) | 存储类元数据（类定义、方法、静态变量等）\
  \ | 在 Java 8 中删除 |\n| 元空间 (Metaspace) | 不可用 | 取代 PermGen；在原生内存中存储类元数据 |\n| 垃圾回收器\
  \ (GC) | 清理堆和 PermGen | 清理堆和元空间（如果需要） |\n\n图 2.1 显示类与对象之间关系的图表\n\n![image](img/fig2-1.jpg)\n\
  \n在本书中，我们将使用几种类型的 UML（统一建模语言）图来图形化地表示若干构图。在图 2.2 的示例中，我们使用了一个 UML 类图，它将描述类的结构。其他类型的\
  \ UML 图包括 UML 包图、UML 状态图等。\n\n考虑图 2.2 中的示例。\n\n图 2.2 Person 类的 UML 图\n\n![image](img/fig2-2.jpg)\n\
  \n此 UML 将具有以下对应的 Java 类等效代码：\n\n```java\npublic class Person\n{\n    public String\
  \ name;\n    public int age;\n    public void showDetails() {...}\n}\n```\n\n在给定的\
  \ UML 图中，顶部部分（灰色）包含类名，第二部分（白色）包含类中的属性或变量，第三部分（黑色）包含类中的方法。至于它们的访问权限，加号 (+) 表示公有（public），而在本章的后半部分，你还会看到减号\
  \ (-) 符号，它用于声明某些内容为私有（private）。公有和私有访问修符将在稍后进行更详细的讨论。\n\n## 2.2 对象实例化\n\nJava 中的对象实例化是从类创建对象的过程。你使用\
  \ `new` 关键字连同类名和括号来调用它的构造函数，从而初始化对象。这创建了一个新的实例，你可以使用它来访问类的方法和属性。\n\n让我们创建两个对象。\n\
  \n```java\nPerson p1 = new Person();\nPerson p2 = new Person();\n```\n\n这意味着 `p1`\
  \ 和 `p2` 是处理两个不同对象的引用变量。由于你现在有两个对象（`p1` 和 `p2`），每个对象都拥有自己的 `name` 和 `age` 属性，以及\
  \ `showDetails()` 方法。如果你想访问成员（member 是属性和方法的另一个术语），可以使用点 (`.`) 符号。\n\n例如，你想分别为 `p1`\
  \ 和 `p2` 对象分配名称：\n\n```java\np1.name = \"Lawrence\";\np2.name = \"Walter\";\n```\n\
  \n现在，让我们为它们分配年龄：\n\n```java\np1.age = 20;\np2.age = 5;\n```\n\n我们到为止所做的是为 `p1` 和\
  \ `p2` 的属性赋值。现在让我们打印它们的值：\n\n```java\nSystem.out.println(p1.name + \" at age \"\
  \ + p1.age);\nSystem.out.println(p2.name + \" at age \" + p2.age);\n```\n\n这将给我们输出：\n\
  \nLawrence at age 20\nWalter at age 5\n\n## 2.3 封装 - 即数据隐藏与实现\n\n封装通过保持数据私有并仅允许直接访问来保护数据。在\
  \ Java 中，你可以使用 `private` 关键字限制对变量的直接访问，因此无法从类外部对其进行更改。为了允许安全的访问或更改，你使用公共方法（如 getter\
  \ 和 setter），它们可以在更新私有变量之前检查或验证值。这确保了你的数据有效且安全。\n\n这个类声明有什么问题？\n\n图 2.3 带有公共变量的 Person\
  \ 类的 UML 图\n\n![image](img/fig2-3.jpg)\n\n如果我们这样做呢？\n\n```java\nPerson p1 = new\
  \ Person();\nPerson p2 = new Person();\n\np1.name = \"Lawrence\";\np2.name = \"\
  Walter\";\n\np1.age = 20;\np2.age = -5;\n```\n\n会有程序问题吗？编译器会在第 14 行有问题吗？不会。这段代码可以编译并运行。编译器在第\
  \ 14 行不会有任何问题，因为赋值给 `p2.age` 的值 -5 是一个有效的整数值。这段代码唯一的问题是它代表了一个不现实的对象。\n\n\n\n\nJava\
  \ 被认为是一种面向对象的编程语言，这意味着它具有模拟现实世界对象行为的能力。在这种情况下，一个人的年龄不能为负值。在我们的现实世界中，一个人的年龄必须大于等于零。\n\
  \n那么，我们该如何解决这个问题呢？这就是封装发挥用场的地方。封装是一种面向对象的特性，它可以隐藏或保护数据免受直接访问。因此，我们不再将所有属性声明为 `public`，而是可以将它们声明为\
  \ `private`，以禁用其他类对属性的直接访问。封装通过限制其可访问性来保护你的数据。\n\n图 2.4 带有私有变量的 `Person` 类 UML 图\n\
  \n![image](img/fig2-4.jpg)\n\n现在，`name` 和 `age` 属性被声明为 `private`，这意味着这些属性只能在 `Person`\
  \ 类内部访问，而不能在该类外部访问（包括 `TestPerson` 类）。\n\n如果尝试再次为 `name` 和 `age` 赋值会怎样？我们现在会遇到编译错误，因为\
  \ `name` 和 `age` 属性被声明为 `private`，这意味着不允许从类外部直接访问它们。\n\n```\n10 p1.name = \"Lawrence\"\
  ;//编译错误\n11 p2.name = \"Walter\";//编译错误\n13 p1.age = 20;//编译错误\n14 p2.age = -5;//编译错误\n\
  ```\n\n`private` 变量的可访问性仅限于声明该变量的同一个类。因此，如果我们将 `name` 和 `age` 属性声明为 `private`，我们应该如何为它们赋值并从它们获取值呢？\n\
  \n解决方案是提供一个公开可访问并允许访问私有数据的方法；这就是一对“setters”（设置）和“getters”（获取）上场的地方。\n\nSetters 和\
  \ getters 是用于创建 `JavaBeans` 的约定。它们也被用于为 `name` 和 `age` 属性赋值，并可以提供验证检查。\n\n`Java\
  \ Bean` 只是一个 `POJO`——普通 Java 对象（Plain Old Java Object），这是一个封装良好的类的约定术语。`JavaBeans`\
  \ 等同于企业 Java Beans (`EJB`)。`EJBs` 是 Java EE 程序的业务组件，超出了我们的讨论范围。\n\n`JavaBeans` 是\
  \ Java 中可重用的软件组件，遵循某些规则，使得它们在不同的程序中易使用。一个关键规则是 `Java Bean` 必须具有 `private` 变量（字段），并提供\
  \ `public` 方法来访问或修改这些变量，这些被称为“getters”和“setters”。getters 允许你读取变量的值，而 setters 允许你更改它。这种结构确保了\
  \ bean 内部的数据可以在应用程序的不同部分得到安全且一致 get 管理。\n\n这是一个 `Java Bean` 的示例。\n\n图 2.5 Java Bean\
  \ 类 `Person` 的 UML 图\n\n![image](img/fig2-5.jpg)\n\n翻译成 Java 代码，它看起来像这样：\n\n```java\n\
  // Person.java\npublic class Person {\n    private String name;\n    private int\
  \ age;\n\n    // setters\n    public void setName(String n) {\n        name = n;\n\
  \    }\n    public void setAge(int a) {\n        if (a >= 0)\n            age =\
  \ a;\n        else\n            age = 0;\n    }\n\n    // getters\n    public String\
  \ getName() {\n        return name;\n    }\n    public int getAge() {\n        return\
  \ age;\n    }\n}\n```\n\n在修改后的 `Person` 类中，你会注意到，即使你尝试使用 `p2.age = -5` 直接为人的年龄赋值负值，这也是不可能的；将会发生编译错误。从不同类直接传递到\
  \ `private` 变量的所有值都是不被允许的。通过提供 `public` setters，现在传递给 `private` 变量的所有值都将被强制通过 `public`\
  \ setters 传递。这样，你现在可以在 `public` setters 内部进行验证检查。所有传递的值都可以被直接检查或赋值。\n\n让我们看看修改后的\
  \ `TestPerson` 类。\n\n```java\n// TestPerson.java\npublic class TestPerson {\n  \
  \  public static void main(String[] args) {\n        Person p1 = new Person();\n\
  \        Person p2 = new Person();\n\n        // 赋值名称\n        p1.setName(\"Lawrence\"\
  );\n        p2.setName(\"Walter\");\n\n        // 赋值年龄\n        p1.setAge(30);\n\
  \        p2.setAge(-5);\n\n        System.out.println(p1.getName() + \" is \" +\
  \ p1.getAge() + \" years old.\");\n        System.out.println(p2.getName() + \"\
  \ is \" + p2.getAge() + \" years old.\");\n    }\n}\n```\n\n在第 10 行和第 11 行，以及第 14\
  \ 行和第 15 行，用于 `name` 和 `age` 的值现在被强制通过 `public` setters。因此，`Person` 类可以对这些值执行验证检查。\n\
  \n在获取 `name` 和 `age` 的值时，我们现在被迫调用 `public` getters。\n\n```java\nSystem.out.println(p1.getName()\
  \ + \" is \" + p1.getAge() + \" years old.\");\nSystem.out.println(p2.getName()\
  \ + \" is \" + p2.getAge() + \" years old.\");\n```\n\n`public` getters 是旨在返回值的方法。在第\
  \ 17 行和第 18 行调用时，分别返回一个 `String` 值和一个 `integer` 值。`p1.getName()` 返回一个 `String` 值，而\
  \ `p1.getAge()` 返回一个 `integer` 值，该值将通过 `System.out.println()` 方法打印。getters 的返回值可以打印到屏幕上，也可以存储在变量中。一旦编译并执行，它将输出：\n\
  \nLawrence at age 30\nWalter at age 0\n\n## 2.4 构造函数\n\n构造函数是一种与类名相同的构造结构。构造函数没有任何类型，甚至没有\
  \ `void`。\n\n这是一个示例：\n\n```java\npublic class Person {\n    public Person (String\
  \ n, int a) {\n        name = n;\n        age = a;\n    }\n}\n```\n\n创建 `Person`\
  \ 对象时，你这样调用构造函数：\n\n```java\nPerson p1 = new Person(\"Lawrence\", 20);\nPerson p2\
  \ = new Person(\"Walter\", 18);\nPerson p3 = new Person();//编译错误\n```\n\n### 默认构造函数规则\n\
  \n“每个类至少有一个构造函数；如果编写者没有构造函数，Java 将提供默认的无参数空体构造函数。”例如：\n\n```java\npublic class MyClass\
  \ {\n}\n```\n\n这个类包含构造函数吗？答案是肯定的。这是因为默认构造函数。这就是为什么我们可以从这个类实例化对象的原因。给定的类在编译后实际上看起来像这样：\n\
  \n```java\npublic class MyClass {\n    // 这是默认构造函数\n    public MyClass() {\n   \
  \     // 此处无内容\n    }\n}\n```\n\n从这个类创建一个对象：\n\n```java\nMyClass mc = new MyClass();\n\
  ```\n\n\n\n方法用于创建一个子程序，该子程序可以从主方法或另一个方法中调用任意次数。方法可以在传递值或不传递值的情况下执行；这些值被称为参数，有时也称为参数列表。\n\
  \n以下是在 Java 中声明方法的语法：\n\n```\n<modifiers> <return_type> methodName(<parameter_list>)\n\
  \n{\n    // method body\n}\n```\n\n常用的修饰符可以是以下任意一个：\n\n- `public` / `private` /\
  \ `protected`\n- `static` / `abstract` / `final`\n\n`return_type` 可以是任何数据类型，甚至是\
  \ `void`。\n\n`methodName` 可以是任何有效的标识符。\n\n`parameter_list` 可以是任何变量和值对。在调用实例方法时，必须先创建一个对象。实例方法通过创建的对象进行调用。给定的实例方法调用示例：\n\
  \n```\np1.setName(\"Lawrence\");\nSystem.out.println(p1.getName());\nint nameLength\
  \ = p1.getName().length();\n```\n\n实例变量和方法属于一个对象，并通过该对象进行使用。要访问它们，你首先需要使用 `new`\
  \ 关键字创建该类的对象。然后，你可以使用对象的名称后接点（'.'）来调用其方法或访问其变量。\n\n而静态方法通过类名进行调用。\n\n```java\nString\
  \ strNum = \"100\";\nint num = Integer.parseInt(strNum);\n```\n\n`Integer` 类位于 `java.lang`\
  \ 包下，并有一个静态方法 `parseInt()`，它可以接受一个 `String` 格式的整数并返回一个 `int` 值。由于 `parseInt()` 方法是静态的，我们通过类名调用该方法：`Integer.parseInt(strNum)`。\n\
  \n## 2.6 Java 源文件布局\n\n只需记住 P-I-C 即可，它代表 Package（包）—Import（导入）—Classes（类）。Java 源文件的这些部分都是可选的。每个部分可以包含以下数量的语句：\n\
  \n- `package` -> 0 或 1 句语句\n- `import` -> 0 到多个\n- `classes` -> 0 到多个\n\n一个 Java\
  \ 源代码可以有多个类，但只允许有一个公共类（public class）。一旦声明了公共类，你的 Java 源代码文件名必须与该公共类匹配。\n\n### 2.6.1\
  \ Java package 语句\n\nJava 中的包指的是子目录。一个包可以包含类或子包。以[图 2.6]中的图为例。\n\n图 2.6 包包图\n\n\
  ![image](img/fig2-6.jpg)\n\n我们将 `MyProj` 作为一个包，在 `MyProj` 内部我们有三个子包，即：`subA`、`subB`\
  \ 和 `test`。在 `subA` 内部，我们有一个子包 `subAA`。\n\n包内部也可以包含类。包 `subA` 包含 `A.class`，`subAA`\
  \ 包含 `AA.class`，包 `subB` 包含 `B.class`，包 `test` 包含 `TestMe.class`，作为我们的测试类。\n\n在使用包时，我们还需要注意以下规则：\n\
  \n1. 包的基本语法如下：\n   `package <top_level_pkg_name>[.<sub_pkg_name>]*;`\n   示例：\n \
  \  `package subA.subAA;`\n2. 包的声明只能放在 Java 源文件的开头。\n3. 每个源文件只允许一个 (1) 包声明。\n4. 在没有包语句的情况下，生成的类文件将放在默认包中（当前工作目录）。\n\
  5. 包语句之间必须用点 (.) 分隔，以确保子目录的表示平台无关。\n\n### 2.6.2 import 语句\n\nImport 语句用于告诉编译器哪里找到应用程序将使用的需要的类。有两个包不需要任何\
  \ import 语句：\n\n1. 当前工作目录以及；\n2. `java.lang.*` 包。\n\n上述包中的类不需要任何 import 语句声明。然而，位于其他包中的类必须使用\
  \ import 语句进行声明。这是一个示例：\n\n```\n1 import java.util.ArrayList;\n2 import java.io.*;\n\
  3 import subA.subAA.AA;\n```\n\n第 1 行表示可以在 `java.util` 包内访问 `ArrayList` 类，而第 2 行表示\
  \ `java.io` 包下的所有类都可以使用。星号 (`*`) 表示所有类，而第 3 行表示此应用程序正在使用类 `AA`，它位于 `subA.subAA`\
  \ 包下。\n\n综上所述，这是一个示例。这是 `TestMe.java` 源文件：\n\n```\n1 package test;\n2\n3 import\
  \ subA.*;\n4 import subA.subAA.AA;\n5 //import subB.B;\n6\n7 public class TestMe\
  \ {\n8\n9 public static void main(String[] args) {\n10\n11 A obj = new A();\n12\n\
  13 }\n```\n\n\n\n\n| 特性 | 包 (Packages)：按功能组织类（例如 `test`, `utils`）。 | 模块 (Modules)：保持整个包结构并定义清晰的边界。\
  \ |\n| :--- | :--- | :--- |\n| 可可见性 | 包中的类可以被任何其他代码导入。 | 模块可以只导出想要共享的包并隐藏其他包。 |\n\
  | 依赖关系 | 没有直接的方法说明需要哪些包。 | `module-info.java` 可以声明需要哪些其他模块。 |\n| 引入版本 | 自 Java 早期起可用。\
  \ | 在 Java 9 中作为 Project Jigsaw 的一部分引入。 |\n| 示例 | `package test;` → 将 test 内部的类分组。\
  \ | `module myapp { exports test; }` → 定义一个名为 `myapp` 的模块并导出 `test` 包。 |\n\n包用于将类组织到文件夹中，以便将相关的代码以整洁且结构化的方式组合在一起。从\
  \ Java 9 开始，模块作为一种更大的构建块被引入——它们允许你将多个包组合为一个单元，并控制你的代码中哪些部分可以被其他模块访问。简而言之，包有助于组织类，而模块有助于组织包。\n\
  \n## 2.8 JAR (Java Archive) 文件\n\n一个复杂的应用程序通常由一组类文件组成，而不仅仅是一个类文件。当这些类文件需要交付给客户时，我们需要将它们放入一个名为\
  \ JAR 文件或 Java 归档文件（Java Archive File）的文件。这个 JAR 文件代表了一组共同工作的类。\n\n考虑之前提供的目录结构。成功编译后，生成的类文件被放在\
  \ `classes` 文件夹下。\n\n图 2.8 项目部分目录结构，classes 文件夹\n\n![image](img/fig2-8.jpg)\n\n\
  这些位于 `classes` 文件夹下的类文件现在可以归档了。类类的归档可以使用 JDK 安装带的 `jar` 工具完成。\n\n创建 Jar 文件有两种方法。\n\
  \n### 1. 不使用清单文件 (manifest file)\n\n创建：\n```bash\njar cvf <JarFile.jar> <Files>\n\
  ```\n即\n```bash\njar cvf MyJar1.jar *\n```\n运行：\n```bash\njava -cp <JarFile.jar>\
  \ <fullyQualifiedName>\n```\n即\n```bash\njava -cp MyJar1.jar test.TestMe\n```\n\n\
  ### 2. 使用清单文件，也称为可执行 Jar 文件。\n\n创建：\n```bash\njar cvfm <JarFile.jar> <manifestFile>\
  \ <Files>\n```\n即\n```bash\njar cvfm MyJar2.jar manif.txt *\n```\n运行：\n```bash\n\
  java -jar <JarFile.jar>\n```\n即\n```bash\njava -jar MyJar2.jar\n```\n\n## 2.9 清单文件\
  \ (Manifest File)\n\n清单文件是归档文件使用的一种配置文件。所有的 JAR 文件都包含一个清单文件。如果 JAR 文件的创建者没有包含自己的清单文件，则始终存在一个默认的\
  \ `MANIFEST.MF` 文件，其中包含默认配置。通过放入自己版本的清单文件，你可以自定义它的行为并覆盖 JAR 文件内部的默认清单文件。\n\n清单文件有四个部分。\n\
  \n`<Main-Class tag/s><separator><value><ENTERKEY>`\n\n清单文件看起来如下：\n```\nManifest-Version:\
  \ 1.0\nMain-Class: test.TestMe\n```\n务必在最后一行之后添加一个换行符，以便在运行时，Java 虚拟机可以读取该行输入。如果你的清单文件中缺少\
  \ `ENTER KEY` 字符，`JVM` 将其视为无效的清单文件，因为它无法读取其内容。\n\n对于大多数 IDE，清单文件也是自动创建的。你只需要编辑它并在\
  \ `Main-Class` 标签中包含测试类的全限定名。如果你想让 JAR 文件成为可执行（可运行）的 JAR 文件，这是必须的。\n\n## 2.10 Java\
  \ API 文档\n\n正如《Java 核心技术 卷》中所述，Java 运行环境 (JRE) 由两个主要部分组成：\n\n1. Java 虚拟机 (JVM) 和\n\
  2. 应用程序接口 (API)\n\n要了解你 API 内部的类，可以在 Oracle® 网站下载 API 文档。\n\n你也可以通过 URL 在线访问 API\
  \ 文档：\n`http://docs.oracle.com/javase/<javaSEversion>/docs/api/index.html`\n\n示例：\n\
  `https://docs.oracle.com/javase/23/docs/api/index.html`\n\n注意：书中附带的在线资源也提供了链接。\n\
  \n图 2.9 Java 23 API 文档页面\n\n![image](img/fig2-9.jpg)\n\n源：`https://docs.oracle.com/en/java/javase/23/docs/api/index.html`\n\
  \n尝试使用屏幕右上角的搜索栏并输入类名，例如 `String`。你应该能看到关于该类的说明、构造函数以及该类的方法。\n\n![image](img/note.jpg)\n\
  \n## 总结\n\n在本章中，我们讨论了以下内容：\n\n- 对象可以是物理或概念实体，代表现实世界中的物品。模块包括类和包。UML 图（如类图和状态图）用于视觉化地表示这些结构。\n\
  - 构造方法是一种特殊方法，其名称与类名相同且没有返回类型。每个类至少有一个；如果程序员没有定义，Java 会提供一个默认的无参构造方法。\n- Java 方法是重用的代码块，可以在\
  \ `main` 方法或其他方法中调用，可以传递或不传递值（参数）。方法可以有各种访问修饰符，并可以是实例方法（需要对象）或静态方法（直接通过类名调用）。\n\
  - Java 源代码布局可以有一个包声明，也可以没有。对于导入语句，可以有多个也可以没有。对于类，可以有多个非公共类或一个包含多个非公共类的类。包、导入语句和类声明都是可选的。如果存在，它们的顺序必须从包开始，然后是导入语句，最后是类列表。\n\
  - 一个复杂的应用程序通常由一组类文件组成，而不仅仅是一个类文件。当这些类文件需要交付给客户时，我们需要将它们放入一个名为 JAR 文件或 Java 归档文件的文件。这个\
  \ JAR 文件代表了一组共同工作的类。\n\n![image](img/Quiz_Icon.jpg)\n\n## 选择题\n\n1. 哪个术语指的是与类名相同并用于实例化（创建）对象的特殊构造？\n\
