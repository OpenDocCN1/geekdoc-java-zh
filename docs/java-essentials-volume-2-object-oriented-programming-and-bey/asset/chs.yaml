  \ content: Java Basics\n```\n\n# 第 6 章：异常与断言\n\n![](img/klo.jpg)\n\n## 核心学习目标\n\n\
  - 区分 Java 中的异常（exceptions）和错误（errors）。\n- 使用 `try-catch` 和 `finally` 块优雅地处理异常。\n\
  - 利用多个 `catch` 块和参数化 `try` 来处理不同的异常类型。\n- 应用“处理或声明”（handle-or-declare）规则并在遵守异常条件的同时重写方法。\n\
  - 为特定的应用程序场景创建自定义 `Exception` 子类。\n- 在开发过程中通过断言检查（assertion checks）验证假设和不变性。\n\n\
  在 Java 编程中，构建健壮可靠的应用程序对于提供流畅无中断的用户体验至关重要。为了实现这一点，Java 提供了强大的机制——异常和断言——帮助你优雅地处理意外情况并验证代码的假设。异常处理允许你响应问题（如无效输入或资源不可用），而不会导致应用程序崩溃，从而使你的代码更具韧性，并且更容易调试和维护。另一方面，断言在开发期间提供了额外的安全保障，允许你检查条件和不变性，以帮助及早发现\
  \ Bug 并避免未来的问题。在本章中，我们将探索 Java 中的 `Exception` 和 `Error` 层次结构、`try-catch` 块、`finally`\
  \ 和 `throw` 的工作原理、何时以及如何创建自定义异常，以及如何有效使用断言来产生更可靠、健壮的代码。\n\n## 6.1 异常类与错误类\n\n`Exception`\
  \ 是代码序列在编译时或运行时出现的异常状态的对象的化表示。`Exception` 对象处理意外情况，如网络失败、文件名拼写错误或缺失、打印机突然离线等。`Exception`\
  \ 类是 `Throwable` 类的子类，表示可以被捕获和处理的错误。\n\n`Error` 类是 `Throwable` 类的子类，代表 Java 运行时环境中的严重问题，应用程序通常不进行处理。\n\
  \n异常可以分为两类：编译时可能遇到的检查异常（checked exception）和运行时可能遇到的非检查异常（unchecked exception）。非检查异常通常被称为\
  \ `RuntimeException`。\n\n### 6.1.1 为什么我们需要异常处理？\n\n以下是需要异常处理的原因：\n\n1. 告知用户（用通俗的话说）程序崩溃期间发生了什么。\n\
  2. 允许用户在程序崩溃期间保存所有（如果不是大部分）未保存的数据。\n3. 允许用户优雅地退出程序。\n\n让我们看看如果抛出异常且未处理，程序崩溃会什么样。这里有一个名为\
  \ `AddArgs1.java` 的示例代码，它通过命令行接收整数值，将其相加并显示和。\n\n```java\n// AddArgs1.java\n1 public\
  \ class AddArgs1 {\n2\n3     public static void main(String[] args) {\n4\n5    \
  \         int sum = 0;\n6             for (String arg : args) {\n7\n8          \
  \           sum += Integer.parseInt(arg);\n9             }\n10            System.out.println(\"\
  Sum: \" + sum);\n11    }\n12 }\n```\n\n通过命令行的运行时执行：\n```bash\njava AddArgs1 10 20\
  \ 30 40\nSum: 100\n```\n\n输出看起来良好，因为通过命令行传递的值都是整数。现在让我们尝试另一次运行时。这次，我们在命令行中包含非整数值。\n\
  \n```bash\njava AddArgs1 10 2.2 thirty 40\nException in thread \"main\" java.lang.NumberFormatException:\
  \ For input string: \"2.2\" at java.lang.NumberFormatException.forInputString(Unknown\
  \ Source)\n    at java.lang.Integer.parseInt(Unknown Source)\n    at java.lang.Integer.parseInt(Unknown\
  \ Source)\n    at AddArgs1.main(AddArgs1.java:8)\n```\n\n当抛出异常且未处理时，会出现一个堆栈跟踪（stack\
  \ trace）。堆栈跟踪告诉用户有关抛出异常的信息。堆栈跟踪的最后一行是：\n`at AddArgs1.main(AddArgs1.java:8)`\n\n\
  这意味着异常源于源代码 `AddArgs1.java` 的第 8 行，位于 `main` 方法中。\n\n## 6.2 Java 的方法：调用栈机制\n\n如果一个方法无法以通常的方式完成任务，Java\
  \ 允许它有一个替代的退出路径。它并不试图从发生异常对象的方法返回值，而是“抛出”一个封装了错误信息的对象。然后 Java 开始寻找可以处理该错误的处理程序。\n\
  \n下面的代码片段展示了调用栈机制的过程：\n\n```java\n// SomeClass.java\n1 public class SomeClass {\n\
  2\n4     public static void main(String[] args) {\n5\n6             // 将抛出未处理的异常\n\
  7\n8             // 从 15 行开始，这将导致\n9             // 程序的异常终止\n10            method1();\n\
  11    }\n12    public static void method1() {\n13\n14            // 这将抛出\n15   \
  \         method2();\n16    }\n17    public static void method2() throws Exception\
  \ {\n18\n19            // 这一行 21 将抛出\n20            // Exception 对象到第 15 行\n21 \
  \           throw new Exception();\n22    }\nWait,, the the numbers:\n23 }\n```\n\
  \n可能的输出是：\n```\nException in thread \"main\" java.lang.Exception\nat SomeClass.method2(SomeClass.java:21)\n\
  at SomeClass.method1(SomeClass.java:15)\nat SomeClass.main(SomeClass.java:9)\n```\n\
  \n所有 Java 应用程序总是从 `main` 方法开始。在 `main` 方法内部，第 9 行，`method1()` 被调用；而在 `method1()`\
  \ 中第 15 行，`method2()` 被调用。然而，在 `method2()` 的第 21 行，抛出了未处理的异常。`method2()` 内部抛出的未处理异常对象将抛回给调用它的方法\
  \ `method1()`。由于 `method1()` 中没有 `try-catch` 块来处理它，它将退出并从栈中移除。由于 `method1()` 内部抛出的异常对象仍未处理，它将被抛回到第\
  \ 9 行的 `main` 方法。最后，在 `main` 方法中，一旦异常对象仍未处理，就会发生异常终止，打印出堆栈跟踪。\n\n图 6.1 显示调用栈机制流程的图像\n\
  \n![](img/fig6-1.jpg)\n\n这里是 Java 调用栈机制的清晰解释，结合了图 6.1 和示例代码 SomeClass.java。\n\n\
  图像中的数字与方法调用和异常传播流程直接对应：\n\n步骤 1 — 首先调用 `main()`\nJava 虚拟机从 `main()` 开始执行。\n\n步骤\
  \ 2 — `main()` 调用 `method1()`\n栈增加一个 `method1()` 的新栈帧。\n\n步骤 3 — `method1()` 然后调用\
  \ `method2()`\n栈再次增加另一个 `method2()` 的栈帧。\n\n步骤 4 — 在 `method2()` 内部抛出异常\n`throw\
  \ new Exception()`\n\n步骤 5 — 异常返回到 `method1()`\n`method1()` 没有 `try-catch` 块来处理它；因此，它退出并从栈中移除。\n\
  \n\n\n\n\n```\n// 此处未捕获异常\n```\n\n## 步骤 6 — 异常到达 main()\n\n* `Exception` 在 `main()`\
  \ 中也没有被处理。\n* 因此，`main` 栈帧退出，程序异常终止。\n\n```\n// 此处同样未捕获异常\n```\n\n图 6.1 展示了这一流程——从\
  \ `main()` (1) 开始，然后是 `method1()` (2)，然后是 `method2()` (3)，接着抛出一个 `Exception` (4)，堆栈开始向上回溯\
  \ (5 和 6)。\n\n这是另一个视觉化流程。\n\n![image](img/pg266.jpg)\n\n用于异常处理或异常声明的五个关键字是：\n\n\
  * `try`\n* `catch`\n* `finally`\n* `throw`\n* `throws`\n\n## 6.3 异常处理块的通用语法\n\n\
  下面的语法演示了在 Java 中使用 `try-catch-finally` 块处理异常的结构化方法。`try` 块包含可能抛出异常的代码，允许你在程序执行期间监控并捕获潜在错误。每个\
  \ `catch` 块设计用于处理特定类型的异常（`ExceptionType1`、`ExceptionType2` 等），使程序在发生异常时能够恢复或提供有意义的错误信息。每个\
  \ `catch` 块中的 `exOb`（异常对象）参数代表异常对象，提供了访问错误的方法和详细信息。`finally` 块包含无论是否抛出或处理异常都会执行的代码，确保清理操作（如关闭资源）始终发生。这种结构在维护应用程序稳定性的同时确保了健壮的错误管理。\n\
  \n```java\ntry {\n    // 用于监控错误的代码块或\n    // 可能导致异常的语句\n}\ncatch(ExceptionType1\
  \ exOb) {\n    // 针对 ExceptionType1 的异常处理程序和/或\n    // 处理异常对象的语句\n}\ncatch(ExceptionType2\
  \ exOb) {\n    // 针对 ExceptionType2 的异常处理程序和/或\n    // 处理异常对象的语句\n}\nfinally {\n\
  \    // 即使没有发生异常也会执行的代码块\n}\n```\n\n### 6.3.1 try–catch 块\n\n`try-catch` 块是 Java\
  \ 处理 `Exception` 对象的方式。这里是添加命令行参数的修订代码：\n\n```java\n// AddArgs2.java\npublic class\
  \ AddArgs2 {\n    public static void main(String[] args) {\n        try {\n    \
  \        int sum = 0;\n            for (String arg : args) {\n                sum\
  \ += Integer.parseInt(arg);\n            }\n            System.out.println(\"Sum:\
  \ \" + sum);\n        }\n        catch(NumberFormatException nfe) {\n          \
  \  System.err.println(\"其中一个值\" + \" 不是整数。\");\n        }\n    }\n}\n```\n\n在第 5\
  \ 到第 13 行，你有一个 `try` 块，它作为一个测试区域。每行代码都会执行，如果发生异常，我们将移动到 `catch` 块。如果发生 `Exception`，第\
  \ 14 到 18 行的 `catch` 块将运行。但如果 `try` 块中的代码运行顺畅，则 `catch` 块不会执行。\n\n```bash\njava\
  \ AddArgs2 10 2.2 thirty 40\n```\n\n```\n其中一个值不是整数。\n```\n\n这段代码 (`AddArgs2.java`)\
  \ 是上一个版本 (`AddArgs1.java`) 的改进版本。但这种场景的问题在于 `try` 块。整个 `main` 方法的体部都被放置在 `try` 块中。不建议将数千行代码和方法调用放在单个\
  \ `try` 块中。这与其说是为了运行时，不如说是为了编写整洁、聚焦的代码，以便更容易识别异常可能发生的地方。虽然仅仅使用 `try` 块的开销极小，但如果实际上抛出了异常，性能影响将变得明显。更好的方法是将有问题的行或几行代码放入\
  \ `try` 块中，而不是包含 `main` 方法的整个体。以下是一个改进版本：\n\n```java\n// AddArgs3.java\npublic class\
  \ AddArgs3 {\n    public static void main(String[] args) {\n        int sum = 0;\n\
  \        for (String arg : args) {\n            try {\n                sum += Integer.parseInt(arg);\n\
  \            }\n            catch(NumberFormatException nfe) {\n               \
  \ System.err.println(arg + \" 不是整数，将不会\" + \" 包含在总和中 \");\n            }\n     \
  \   }\n        System.out.println(\"Sum: \" + sum);\n    }\n}\n```\n\n```bash\n\
  java AddArgs3 10 2.2 thirty 40\n```\n\n```\n2.2 不是整数，将不会包含在总和中\nthirty 不是整数，将不会包含在总和中\n\
  Sum: 50\n```\n\n### 6.3.2 finally 块\n\n`finally` 块是一个可选的代码块，通常放置最后一个 `catch` 块之后。`finally`\
  \ 块包含无论是否存在异常对象都会执行的代码，例如关闭文件或网络连接等资源。它确保始终执行重要的清理操作，从而维护资源完整性并防止潜在的资源泄漏。这里有一个演示使用\
  \ `finally` 块的示例代码。\n\n```java\ntry {\n    startFaucet();\n    waterLawn();\n}\n\
  catch (PipeException bpe) {\n    logProblem(bpe);\n}\nfinally {\n    stopFaucet();\n\
  }\n```\n\n我们有一个 `try` 块、一个 `catch` 块和一个 `finally` 块。现在，`finally` 块的放置通常位于最后一个 `catch`\
  \ 块之后。当代码片段执行时，你首先进入 `try` 块并调用 `startFaucet()` 和 `waterLawn()`。\n\n假设 `startFaucet()`\
  \ 和 `waterLawn()` 之间没有发生异常，`catch` 块将不会运行。接下来，它将执行 `finally` 块。在另一种情况下，这次在 `startFaucet()`\
  \ 和 `waterLawn()` 之间抛出了异常，假设管道损坏（由 `PipeException` 表示），`catch` 块将使用 `bpe` 捕获该异常，并调用\
  \ `logProblem()`。\n\n如果在 `catch` 块中放置 `return`，代码流会发生什么？它还会调用 `finally` 块吗？\n\n\
  ```java\npublic class TestFinally1 {\n    public static void main(String[] args)\
  \ {\n        System.out.println(\"Inside main method..\");\n        doStuff();\n\
  \        System.out.println(\"After doStuff()...\");\n    }\n\n    public static\
  \ void doStuff() {\n        try {\n            System.out.println(\"Inside try block..\"\
  );\n            throw new Exception();\n        }\n        catch(Exception e) {\n\
  \            System.out.println(\"Exception caught..\");\n            return;\n\
  \        }\n        finally {\n            System.out.println(\"Inside finally block..\"\
  );\n        }\n    }\n}\n```\n\n如果你编译并运行上述代码，它将给你输出：\n\n```\nInside main method..\n\
  Inside try block..\nException caught..\nInside finally block..\nAfter doStuff()...\n\
  ```\n\n在示例代码中，花一点时间分析为什么得到这个输出。记住，如果存在 `finally` 块，它无论如何都会运行。在这种情况下，在第 21 行的 `return`\
  \ 语句之前，`finally` 块得以运行。这里是另一个例子：\n\n```java\npublic class TestFinally2 {\n    public\
  \ static void main(String[] args) {\n        System.out.println(\"Enter the for\
  \ loop..\");\n        for (int i = 1; i <= 5; i++) {\n            try {\n      \
  \          if (i == 2) {\n                    break;\n                }\n      \
  \          System.out.println(\"i = \" + i);\n            }\n            catch(Exception\
  \ e) {\n                System.out.println(\"inside catch block..\");\n        \
  \    }\n            finally {\n                System.out.println(\"inside the finally\
  \ block..\");\n            }\n        }\n    }\n}\n```\n\n\n\n\n```java\n23    System.out.println(\"\
  after the loop..\");\n24 }\n25 }\n```\n\n如果你编译并运行此代码，将得到以下输出：\n\n```\nEnter the\
  \ loop..\ni = 1\ninside the finally block..\ninside the finally block..\nafter the\
  \ loop..\n```\n\n在第 10 行，你在 `for` 循环中调用了 `break` 语句。我们知道一旦在循环中遇到 `break` 语句，就会结束循环。事实确实如此，但正如你所看到的，有一个\
  \ `finally` 块。无论什么，我们必须执行 `finally` 块。因此，在我们退出 `for` 循环之前，必须先运行 `finally` 块。\n\n\
  Java 中的 `finally` 块通常无论 `try` 或 `catch` 块中发生了什么都会执行。然而，在某些情况下它可能不会运行。一种常见的情况是在 `try`\
  \ 或 `catch` 块中调用了 `System.exit(0);` 方法，导致 `JVM` 立即终止。另一种情况是程序由于致命错误（例如内存不足或遇到严重的系统级故障）而崩溃，这阻止了\
  \ `finally` 块的执行。\n\n当调用 `System.exit()` 时，`finally` 可能不执行的特定场景：\n\n```java\ntry\
  \ {\n    System.exit(0);\n} catch (Exception e) {\n    // ...\n} finally {\n   \
  \ // 这不会执行\n}\n```\n\n`JVM` 立即退出，`finally` 没有机会执行。\n\n## 6.4 Java 中的异常层次\n\n在 Java\
  \ 中，异常是派自 `Throwable` 类的实例。\n\n图 6.2 Java 异常层次\n\n![image](img/fig6-2.jpg)\n\n[表\
  \ 6.1] 提供了最常用异常列表及其描述。\n\n### 表 6.1 常用异常及其描述\n\n| 异常名称 | 描述 |\n| --- | --- |\n|\
  \ NullPointerException | 当应用程序尝试访问空对象的方法或字段时抛出。 |\n| ArrayIndexOutOfBoundsException\
  \ | 使用非法索引访问数组时抛出。 |\n| ArithmeticException |发生非法算术运算（如除以零）时抛出。 |\n| ClassCastException\
  \ | 当对象转换为其不是实例的子类时抛出。 |\n| IOException | 当 I/O 操作失败或中断（如文件读写错误）时抛出。 |\n| FileNotFoundException\
  \ | 当尝试打开不存在的文件时抛出的 `IOException` 的子类。 |\n| NumberFormatException | 当将字符串转换为数字类型时格式无效时抛出。\
  \ |\n| IllegalArgumentException | 方法接收无效参数时抛出。 |\n| InterruptedException | 当线程在睡眠、等待或暂停时被中断时抛出。\
  \ |\n| SQLException | 表示与数据库访问或其他 SQL 相关的问题。 |\n\n## 6.5 catch 块中的多个异常\n\n在 Java\
  \ 7 之前，如果你需要捕获不同类型的 `Exception` 对象并进行相同的错误管理，你会这样做：\n\n```java\ntry {\n    // 抛出异常对象的代码\n\
  }\ncatch(IOException ex) {\n    logProblem(ex);\n}\ncatch(SQLException ex) {\n \
  \   logProblem(ex);\n}\n```\n\n在 Java 7 中，可以在单个 `catch` 块中捕获多个 `Exception` 对象：\n\
  \n```java\ntry {\n    // 抛出异常对象的代码\n}\ncatch(IOException | SQLException ex) {\n\
  \    logProblem(ex);\n}\n```\n\n在示例代码中，如果 `try` 块抛出 `IOException` 或 `SQLException`\
  \ 对象，任何一个都由同一个 `catch` 块捕获。与第一个相比，这段代码更短、更简洁。\n\n## 6.6 参数化 try 块（资源管理器）\n\n从 Java\
  \ SE7 开始，`try` 块现在可以拥有资源。这些资源是在执行后需要关闭的对象。任何实现 `java.lang.AutoCloseable` 接口的对象（包括所有实现\
  \ `java.io.Closeable` 接口的对象类型）都可以作为参数传递给 `try` 块。\n\n这是 Java SE7 之前未实现参数化 `try`\
  \ 块的代码：\n\n```java\n1 import java.io.*;\n2 public class SampleIO {\n3\n4     public\
  \ static void main(String[] args) {\n5     \n6         try {\n7         \n8    \
  \             BufferedReader in =\n9                             new BufferedReader(new\n\
  10                                     InputStreamReader(System.in));\n11      \
  \                         System.out.println(\"What is your name?\");\n12      \
  \                         String name = in.readLine();\n13                     \
  \          System.out.println(\"How old are you?\");\n14                       \
  \        int age = Integer.parseInt(in.readLine());\n15                        \
  \       System.out.println(\"Hello \" + name +\n16                             \
  \        \", next you will be \" + (age + 1)\n17                               \
  \      + \" years old.\");\n18                               in.close();\n19   \
  \  }\n20         catch(IOException ioe) {\n21\n22             System.err.println(\"\
  An exception occurred.\");\n23     }\n24 }\n25 }\n```\n\n在第 8 行，我们看到 `BufferedReader`\
  \ 对象在代码的其他部分被创建并使用，但在第 18 行 `try` 块结束时，`in` 对象被关闭了。\n\n以下是包含 Java SE 7 try-with-resources\
  \ 代码：\n\n```java\n1 import java.io.*;\n2 public class SampleIO2 {\n3\n4     public\
  \ static void main(String[] args)\n5         throws IOException {\n6     \n7   \
  \      try(BufferedReader in = new BufferedReader(new\n8                       \
  \      InputStreamReader(System.in))) {\n9             \n10                    \
  \           System.out.println(\"What is your name?\");\n11                    \
  \           String name = in.readLine();\n12                               System.out.println(\"\
  How old are you?\");\n13                               int age = Integer.parseInt(in.readLine());\n\
  14                               System.out.println(\"Hello \" + name +\n15    \
  \                                 \", next you will be \" + (age + 1)\n16      \
  \                               + \" years old.\");\n17     }\n18 }\n19 }\n```\n\
  \n注意在第 7 和第 8 行，你有一个带有参数的 `try` 块。在 `try` 块参数中声明的 `BufferedReader` 对象被视为资源，并在第 17\
  \ 行 `try` 块结束后会自动关闭。不需要调用 `in.close()` 方法，因为在参数化 `try` 块中声明的所有资源只要是 `AutoCloseable`\
  \ 对象，都会被关闭。这减少了发生内存泄漏的风险。\n\n## 6.7 处理或声明规则\n\n处理 `Exception` 对象有两种方法：你既可以处理它，也可以声明它。处理\
  \ `Exception` 对象意味着你可以像我们一直以来的那样使用 `try-catch-finally` 块。\n\n另一方面，声明 `Exception`\
  \ 对象通过使用 `throws` 关键字提供了一种全新的新方法。声明 `Exception` 对象的示例方法：\n\n```java\nvoid doStuff()\
  \ throws IOException {}\nvoid someMethod() throws SQLException, IOException {}\n\
  ```\n\n这是一个声明 `Exception` 对象的示例代码。\n\n\n\n声明 `Exception` 仅用于检查异常（checked exceptions），并且在方法签名后使用\
  \ `throws` 关键字，就像第 6 行一样。这相当于签一份豁免书，允许检查异常通过编译过程。另一方面，`RuntimeException` 对象或未检查异常（unchecked\
  \ exceptions）不应该声明；而是根据需要处理 `RuntimeException` 对象。如果声明了异常并在运行时发生，仍然会发生异常终止。在大多数情况下，`Exception`\
  \ 的声明只在软件开发阶段进行，并在软件质量保证测试期间逐渐转换为已处理的异常。\n\n## 6.8 改进的 final 或有效 final 变量重新抛出 (JDK\
  \ 11+)\n\n从 JDK 11 开始，编译器在捕获的异常为有效 final（effectively final）时，允许更灵活地重新抛出异常。这允许在不需要显式类型转换的情况下重新抛出异常，提高了可读性。例如：\n\
  \n```java\ntry {\n    // risky operation\n} catch (IOException | SQLException e)\
  \ {\n    throw e; // 不需要显式转换\n}\n```\n\n在之前的版本中，开发者需要将 `e` 转换为通用的父类，这使得代码变得混乱并引入了不必要的冗余。\n\
  \n以下是 final 变量重新抛出功能改进前后的示例。\n\n### JDK 11 之前：\n\n```java\npublic class BeforeJDK11\
  \ {\n    public static void main(String[] args)\n               throws Exception\
  \ {\n        try {\n            processData(null);\n        } catch (Exception e)\
  \ {\n            // 需要一个新变量来重新抛出\n            Exception ex = new Exception(\"Updated\"\
  \ +\n                                \" message: \" + e.getMessage());\n       \
  \     throw ex;\n        }\n    }\n\n    static void processData(String input) throws\
  \ Exception {\n        if (input == null) {\n            throw new Exception(\"\
  Input cannot be null!\");\n        }\n    }\n}\n```\n\n### JDK 11 之后：\n\n```java\n\
  public class AfterJDK11 {\n    public static void main(String[] args) throws Exception\
  \ {\n        try {\n            processData(null);\n        } catch (Exception e)\
  \ {\n            // 赋值并重新抛出同一个变量\n            e = new Exception(\"Updated message:\
  \ \" +\n            e.getMessage());\n            throw e; // JDK 11+ 允许\n     \
  \   }\n    }\n\n    static void processData(String input)\n                    \
  \       throws Exception {\n        if (input == null) {\n            throw new\
  \ Exception(\"Input cannot be null!\");\n        }\n    }\n}\n```\n\n在 JDK 11 之前，你无法在不单独变量或将其标记为\
  \ final 的情况下重新赋值并抛出同一个变量。这种改进使得异常处理更加灵活，代码更易维护。\n\n在 JDK 11+ 中，你不再需要为了重新抛出更新后的异常而创建第二个变量。这使得你的代码更短、更容易读。\n\
  \n## 6.9 方法重写与异常的规则\n\n考虑 [图 6.3]。\n\n图 6.3 带有异常的方法重写\n\n![image](img/fig6-3.jpg)\n\
  \n让我们分为三种情况：\n\n- 情况 1：`TestSuper` 和 `TestSub1` 的关系：在这一继承关系中，一切正常。它将编译并运行，因为父类 `TestSuper`\
  \ 声明了 `IOException`，而子类 `TestSub1` 没有声明异常。这是可以接受的。\n- 情况 2：`TestSuper` 和 `TestSub2`\
  \ 的关系：这也是可以接受的。在父类 `TestSuper` 中有 `IOException`，而子类 `TestSub2` 声明了两个异常：`FileNotFoundException`\
  \ 和 `EOFException`。这是可以接受的，因为 `FileNotFoundException` 和 `EOFException` 都是 `IOException`\
  \ 的子类。\n- 情况 3：`TestSuper` 和 `TestSub3` 的关系：这种关系会导致错误。在父类 `TestSuper` 中声明了 `IOException`，而子类\
  \ `TestSub3` 声明了两个异常：`IOException` 和 `SQLException`。`IOException` 是允许的，因为它已经在父类中声明过了。然而，`SQLException`\
  \ 是导致错误的原因，因为它不是 `IOException` 的子类。\n\n## 6.10 创建你的异常\n\n创建你自己的对象只需创建一个扩展 `Exception`\
  \ 的类。由于我们既有检查异常也有未检查异常（RuntimeExceptionRuntimeException），让我们看看如何创建检查异常和未检查异常。\n\n\
  创建自己的检查异常：通过这个示例，你刚刚创建了一个名为 `BadTastingFoodException` 的新类。现在，让我们使用它。\n\n```java\n\
  class BadTastingFoodException extends Exception {\n    // 你可以留空这部分，或者调用 Exception\
  \ 类\n    // 的构造函数来传递 String 消息\n}\n\nclass MyException {\n    static boolean candy\
  \ = false;\n    static boolean sourBall = true;\n\n    public static void main(String[]\
  \ args) {\n        try {\n            System.out.println(\"Inside try block of \"\
  \ + \" candy.\");\n            isSour(candy);\n        } catch (BadTastingFoodException\
  \ btfe) {\n            System.out.println(\"Inside catch block \" + \"of candy.\"\
  );\n        }\n        try {\n            System.out.println(\"Inside try block\
  \ \" + \" of sourBall.\");\n            isSour(sourBall);\n        } catch (BadTastingFoodException\
  \ btfe) {\n            System.out.println(\"Inside catch block \" + \" of sourBall.\"\
  );\n        }\n    }\n\n    private static void isSour(boolean taste)\n        \
  \                   throws BadTastingFoodException {\n        if (taste)\n     \
  \       throw new BadTastingFoodException();\n    }\n}\n```\n\n示例输出：\n```\nInside\
  \ try block of  candy.\nInside catch block  of candy.\nInside try block  of sourBall.\n\
  Inside catch block  of sourBall.\n```\n\n## 6.11 创建你的未检查 RuntimeException\n\n至于创建自己的未检查异常，你必须扩展\
  \ `RuntimeException` 类。这是一个示例：\n\n```java\nimport java.util.Scanner;\n\nclass LoginException\
  \ extends RuntimeException {\n    // 未检查异常\n}\n\npublic class MyOtherException {\n\
  \    static String username = \"admin\";\n    static String password = \"password\"\
  ;\n\n    public static void main(String[] args) {\n        // try-with-resources\
  \ 确保 Scanner\n        // 自动关闭\n        try (Scanner s = new Scanner(System.in))\
  \ {\n            System.out.println(\"Enter your username: \");\n            String\
  \ uname = s.nextLine();\n            System.out.println(\"Enter your password: \"\
  );\n            String pword = s.nextLine();\n\n            if (uname.equals(username)\
  \ && pword.equals(password)){\n                System.out.println(\"Access Granted\"\
  );\n            } else {\n                throw new LoginException();\n        \
  \    }\n        } catch (LoginException ae) {\n            System.err.println(\"\
  Incorrect username / password\");\n        }\n    }\n}\n```\n\n正如你所看到的，`LoginException`\
  \ 类被视为未检查异常因为它扩展了 `RuntimeException` 类。这意味着编译器在编译期间看不到这种类型的异常。这也意味着处理此类异常类的最佳方法是使用\
  \ `try-catch-block`，而不仅仅是使用 `throws` 关键字。\n\n\n\n\n\n断言（Assertions）用于检查程序员的假设。Java\
  \ 中的断言是验证程序员对代码在执行过程中特定点行为的假设的关键工具。通过直接在代码中嵌入断言检查，开发者可以在开发过程的早期主动识别并解决错误，确保程序逻辑符合预期条件。断言检查可以通过编程方式放置在代码中，但其是否执行取决于运行时的配置。断言可以在两种模式下运行：启用或禁用。当启用时（使用\
  \ `-ea` 或 `-enableassertions` 标志），将会评估断言条件，如果评估失败，则会抛出 `AssertionError`。当禁用时（默认情况），JVM\
  \ 将忽略断言且不产生影响。这种灵活性使得断言可以在开发期间用于调试，而不影响生产环境的性能，成为构建更可靠、无错误代码的强大方法。\n\n## 6.12.1\
  \ assert 关键字的语法\n\n`assert <boolean_expression> ;`\n\n`assert <boolean_expression>\
  \ : <detail_expression> ;`\n\n如果你想自定义显示的消息，可以自定义 `<detail_expression>` 部分。如果 `<boolean_expression>`\
  \ 返回 `false` 值，它将抛出 `AssertionError`。\n\n这里有一个示例代码：\n\n```java\n1 // TestAssert.java\n\
  public class TestAssert {\n    public static void main(String[] args) {\n      \
  \  int hour = Integer.parseInt(args[0]);\n        int mins = Integer.parseInt(args[1]);\n\
  \n        assert hour > 0 && hour < 24 :\n                \"Invalid hour value\"\
  ;\n        assert mins > 0 && mins < 60 :\n                \"Invalid mins value\"\
  ;\n\n        System.out.println(hour + \":\" + mins);\n    }\n}\n```\n\n示例输出：\n\
  ```\njava TestAssert 15 30\n15:30\n```\n\n这里是另一个：\n```\njava TestAssert 15 300\n\
  15:300\n```\n\n注意这种不一致性了吗？第二个参数（`300`）应该导致一个错误。为什么运行时没有错误呢？\n\nJava 1.4 的行为与 Java\
  \ 1.5 及更高版本不同，如表 6.2 所示。\n\n表 6.2 Java 1.4 和 Java 1.5 中的默认断言设置\n\n| | 编译时 | 运行时\
  \ |\n| :--- | :--- | :--- |\n| java 1.4 | `javac -source 1.4 Filename.java` | 默认行为：启用；禁用：`java\
  \ -da Filename` |\n| java 1.5 and 1.6 | `java Filename.java` | 默认行为：禁用；启用：`java\
  \ -ea Filename` |\n\n在最后一个运行时示例中，没有出现错误是因为使用的运行时环境是 Java 1.5 或以上版本。这意味着在程序执行或运行时，代码中的断言检查被禁用了，从而忽略了断言检查。如果你想启用断言检查，你可能需要这样重新运行你的应用程序：\n\
  \n```bash\njava -ea TestAssert 15 300\n```\n\n```\nException in thread \"main\"\
  \ java.lang.AssertionError: Invalid mins value\nat TestAssert.main(TestAssert.java:9)\n\
  ```\n\n通过将 `-ea` 或 `-enableassertions` 作为虚拟机（VM）选项，你实际上是在运行时启用了应用程序的断言检查。\n\n此外，你需要注意错误消息显示的是这是一个\
  \ `AssertionError` 而不是 `Exception`，因此，你需要重新检查或重新验证你的条件、假设或输入值。\n\n## 6.12.2 断言支持和\
  \ Unicode 输出（JDK 13+）\n\n从 JDK 13 开始，断言还可以在错误消息中正确显示 Unicode 字符，这意味着你其中包含符号、表情符号或其他语言的文本。尽管\
  \ `assert` 关键字保持不变，但由于控制台输出中更好的 Unicode 处理以及跨 IDE 的工具支持，使用断言的整体体验得到了改进。这使得在开发期间调试非英语或富符号的消息更加可靠。\n\
  \n```java\n1 public class UnicodeAssertionExample {\n    public static void main(String[]\
  \ args) {\n        int score = 45;\n\n        // 此断言使用了 Unicode 符号\n        assert\
  \ score >= 50 :\n            \"![image](img/wrong1.jpg) Score too low! 최소 점수는 50\
  \ 입니다.\";\n        // (\"최소 점수는 50입니다\"\n        // 在韩语中意为“最低分为 50 分”)\n\n     \
  \   System.out.println(score);\n    }\n}\n```\n\n以下是你应该这样运行它的：\n\n```bash\njava\
  \ -ea UnicodeAssertionExample\n```\n\n\n\n\n\n* 在 Java 中创建你自己的异常，你需要编写一个继承自 `Exception`\
  \ 类（用于受检异常）或 `RuntimeException` 类（用于非检查异常）的新类。这个自定义的异常类可以包含额外的构造函数和方法，以提供针对你应用程序需求的特定错误细节或行为，也可以仅仅是一个空类。\n\
  * 在重写方法时，重写方法不能声明抛出比被重写方法更多或更广泛的检查异常。然而，它可以声明更少或更窄的检查异常，或任意数量的非检查异常，以确保子类与父类的异常处理预期保持一致。\n\
  * Java 中的 `assert` 关键字用于创建断言，断言是一种测试代码中假设的语句，通常用于调试。如果断言为假，则会抛出 `AssertionError`，允许开发者在开发期间检测并纠正逻辑错误。\n\
