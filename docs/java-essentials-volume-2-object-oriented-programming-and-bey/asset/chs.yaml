  \    }\n\n    // 事件处理器\n    public void actionPerformed(ActionEvent e)\n    {\n\
  \        Object source = e.getSource();\n        double num1 = 0.0, num2 = 0.0,\
  \ num3 = 0.0;\n\n        if (tf1.getText() != null && tf2.getText() != null) {\n\
  \            num1 = Double.parseDouble(tf1.getText());\n            num2 = Double.parseDouble(tf2.getText());\n\
  \n            if (source == bAdd)\n            {\n                num3 = num1 +\
  \ num2;\n            } else if (source == bSub)\n            {\n               \
  \ num3 = num1 - num2;\n            } else if (source == bMul)\n            {\n \
  \               num3 = num1 * num2;\n            } else if (source == bDiv)\n  \
  \          {\n                num3 = num1 / num2;\n            } else if (source\
  \ == bClear)\n            {\n                tf1.setText(\"0.0\");\n           \
  \     tf2.setText(\"0.0\");\n                tf3.setText(\"0.0\");\n           \
  \ }\n        } else {} // 什么都不做\n\n        tf3.setText(\"\" + num3);\n    }\n}\n\
  \nprivate class MyCloseHandler extends WindowAdapter {\n}\n```\n\n\n\n\n\n```java\n\
  \    public void windowClosing(WindowEvent we)\n    {\n        System.exit(0);\n\
  \    }\n}\n\n    public static void main(String args[])\n    {\n        SimpleCalculator\
  \ sc = new SimpleCalculator();\n        sc.startApp();\n    }\n}\n```\n\n要将应用程序转换为\
  \ Swing，我们首先将为应用程序声明一个包（package）。尽管在准备创建 JAR 文件时包含包声明是建议的，但如果并不立即需要 JAR 文件，那么在这一阶段并不是严格必要的。\n\
  \n接下来，我们将通过为每个 AWT 组件和容器添加 \"J\" 前缀，将它们转换为对应的 Swing 组件。例如，我们将使用 `JFrame`、`JPanel`、`JLabel`、`JTextField`\
  \ 和 `JButton` 来代替它们对应的 AWT 变体。然而，布局管理器（layout managers）将保持不变。例如，`GridLayout` 不应该带有\
  \ \"J\" 前缀，因为没有专门的 Swing 特有布局管理器。\n\n为了更好地说明 AWT 和 Swing 之间的区别，可以对同一代码的两个版本进行比较。在\
  \ Windows 机器上运行 AWT 版本时，按钮和其他 UI 元素的视觉效果与其对应的 Swing 版本相比较差。Swing 提供了更精细的外观，并具有可自定义的功能（如背景颜色），提供了更现代的视觉和感受。虽然在\
  \ macOS 上的外观差异是细微的，但在 Windows 上这种区别更为明显。\n\n图 11.3 AWT 版本与 Swing 版本的运行时对比\n\n![image](img/fig11-3.jpg)\n\
  \n为了启动我们计算器应用程序的转换，我们从修改组件和容器的声明开始，在声明中以及构造函数（即实例化组件和容器的地方）中在适当的位置添加 \"J\" 前缀。这把它们转换为基于\
  \ Swing 的组件。重要的是，不应对布局管理器进行任何更改，因为 Swing 并没有提供自己的版本。\n\n关于关闭按钮处理器，有一个保留现有功能的选项，也可以将其修改为使用\
  \ Swing 的框架方法（frame method）来关闭。一旦保存更改，我们可以编译代码（使用 `javac SimpleCalculator.java`），应用程序现在将作为一个基于\
  \ Swing 的组件运行。\n\n虽然整体外观与 AWT 版本相似，但使用 Swing 提供了增强的功能，且 UI 元素（如按钮）现在应该按预期工作，包括“清空”和“关闭”按钮。\n\
  \n这里是 SimpleCalculator App 更新后的 Swing 版本：\n\n```java\n// SimpleCalculator.java -\
  \ 更新后的 Swing 版本\nimport java.awt.*;\nimport java.awt.event.*;\nimport javax.swing.*;\n\
  \npublic class SimpleCalculator implements ActionListener\n{\n    // 容器\n    private\
  \ JFrame f;\n    private JPanel p1, p2, p3, p4;\n\n    // 组件\n    private JLabel\
  \ l1, l2, l3;\n    private JTextField tf1, tf2, tf3;\n    private JButton bAdd,\
  \ bSub, bMul, bDiv, bClear;\n\n    public SimpleCalculator()\n    {\n        //\
  \ 容器\n        f = new JFrame(\"My First GUI App\");\n\n        p1 = new JPanel();\n\
  \        p2 = new JPanel();\n        p3 = new JPanel();\n        p4 = new JPanel();\n\
  \n        // 组件\n        l1 = new JLabel(\"First: \");\n        l2 = new JLabel(\"\
  Second: \");\n        l3 = new JLabel(\"Result: \");\n        tf1 = new JTextField(10);\n\
  \        tf2 = new JTextField(10);\n        tf3 = new JTextField(10);\n        bAdd\
  \ = new JButton(\"+\");\n        bSub = new JButton(\"-\");\n        bMul = new\
  \ JButton(\"*\");\n        bDiv = new JButton(\"/\");\n        bClear = new JButton(\"\
  Clear\");\n\n        p1.add(l1);\n        p1.add(tf1);\n        p2.add(l2);\n  \
  \      p2.add(tf2);\n        p3.add(l3);\n        p3.add(tf3);\n        p4.add(bAdd);\n\
  \        p4.add(bSub);\n        p4.add(bMul);\n        p4.add(bDiv);\n        p4.add(bClear);\n\
  \n        f.setLayout(new GridLayout(4, 1));\n        f.add(p1);\n        f.add(p2);\n\
  \        f.add(p3);\n        f.add(p4);\n\n        bAdd.addActionListener(this);\n\
  \        bSub.addActionListener(this);\n        bMul.addActionListener(this);\n\
  \        bDiv.addActionListener(this);\n        bClear.addActionListener(this);\n\
  \n        f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n        f.pack();\n\
  \        f.setVisible(true);\n    }\n\n    public void actionPerformed(ActionEvent\
  \ e)\n    {\n        // 逻辑实现略\n    }\n}\n```\n\n## 11.3 Swing Swing 组件\n\n### 11.3.1\
  \ JCheckBox：RGBCheckBox.java\n\nJava 中的 `JCheckBox` 类是 `Swing` 包的一部分，提供了在图形用户界面中创建复选框的方法。用户可以选择或取消选择。与单选按钮不同，多个复选框可以同时选中。\n\
  \n在下面的 `RGBCheckBox.java` 示例中，我们将使用 Swing 组件创建一个包含红、绿、蓝三个复选框的简单图形界面。我们还会添加了一个“点击这里”的按钮。\n\
  \n#### 代码解析\n\n1. 导入：程序开始导入 `java.awt.*` 和 `javax.swing.*`，它们提供了创建 GUI 组件和处理布局所需的类，`java.awt`\
  \ 包对于布局管理器是必要的。\n\n```java\nimport java.awt.*;\nimport javax.swing.*;\n```\n\n2.\
  \ 类声明：`RGBCheckBox` 类被声明为一个公共类。在这个类内部，我们定义了构成 UI 的 `JFrame`、`JButton` 和 `JCheckBox`\
  \ 组件的私有字段。\n\n```java\npublic class RGBCheckBox {\n    private JFrame f;\n    private\
  \ JButton b;\n    private JCheckBox red, green, blue;\n```\n\n3. 构造函数：构造函数 `RGBCheckBox()`\
  \ 初始化了 `JFrame` 和 `JButton` 对象，并创建了三个复选框：红、绿、蓝。这些组件将是用户界面的一部分。\n\n```java\npublic\
  \ RGBCheckBox() {\n    f = new JFrame(\"JCheckBox Example\");\n    b = new JButton(\"\
  Click Me!\");\n    red = new JCheckBox(\" Red \");\n    green = new JCheckBox(\"\
  \ Green \");\n}\n```\n\n\n\n\n\n```java\nblue = new JCheckBox(\" Blue \");\n\n}\n\
  ```\n\n### 4. StartApp 方法\n`startApp()` 方法配置了框架的布局，它使用具有 4 行 1 列的 `GridLayout` 来垂直显示复选框和按钮。使用\
  \ `setSelected(true)` 方法用于预选红色和蓝色的复选框。\n\n`setLayout(new GridLayout(4, 1))` 确保组件被排列在四行中。\n\
  \n`f.add()` 方法按照所需的顺序将组件添加到框架中。\n\n`f.setBounds(100, 100, 300, 200)` 明了窗口左上角的位置\
  \ `(100,100)` 及其尺寸 `(300x200)`。\n\n`f.setVisible(true)` 让窗口对用户可见。\n\n```java\npublic\
  \ void startApp() {\n    f.setLayout(new GridLayout(4, 1));\n    red.setSelected(true);\n\
  \    blue.setSelected(true);\n    f.add(red);\n    f.add(green);\n    f.add(blue);\n\
  \    f.add(b);\n    f.setBounds(100, 100, 300, 200);\n    f.setVisible(true);\n\
  }\n```\n\n### 5. Main 方法\n`main` 方法作为程序的入口点。它创建了 `RGBCheckBox` 类的一个实例并调用 `startApp()`\
  \ 方法来显示 UI。\n\n```java\npublic static void main(String args[]) {\n    RGBCheckBox\
  \ rgb = new RGBCheckBox();\n    rgb.startApp();\n}\n```\n\n# 代码工作原理\n当程序运行时，会出现一个带有三个复选框的窗口：红色、绿色和蓝色。红色和蓝色复选框被预选中。用户可以勾选或取消这些框的任何组合。\n\
  \n还会显示一个标记为“Click Me!”的按钮，尽管它目前没有实现功能。未来的扩展可能包括为按钮和复选框添加事件监听器，以便在点击时执行操作。\n\n##\
  \ 图 11.4 RGBCheckBox 运行时\n![image](img/fig11-4.jpg)\n\n## 关键点\n- `JCheckBox` 是 Swing\
  \ 框架的一部分，它继承了父类的许多方法，允许进行广泛的定制。\n- `setBounds()` 方法用于对窗口进行定位和调整大小，对其布局提供了更多控制。\n\
  \n这个简单的示例演示了如何使用 Java 中的 Swing 组件创建一个带有多个复选框的基础 GUI。你可以通过添加事件处理来进一步扩展，使 UI 具有交互性。\n\
  \n## 这里是完整的源代码：\n### RGBCheckBox.java\n```java\nimport java.awt.*;\nimport javax.swing.*;\n\
  \npublic class RGBCheckBox {\n    private JFrame f;\n    private JButton b;\n  \
  \  private JCheckBox red, green, blue;\n\n    public RGBCheckBox() {\n        f\
  \ = new JFrame(\"JCheckBox Example\");\n        b = new JButton(\"Click Me!\");\n\
  \        red = new JCheckBox(\" Red \");\n        green = new JCheckBox(\" Green\
  \ \");\n        blue = new JCheckBox(\" Blue \");\n    }\n\n    public void startApp()\
  \ {\n        f.setLayout(new GridLayout(4, 1));\n        red.setSelected(true);\n\
  \        blue.setSelected(true);\n        f.add(red);\n        f.add(green);\n \
  \       f.add(blue);\n        f.add(b);\n        f.setBounds(100, 100, 300, 200);\n\
  \        f.setVisible(true);\n    }\n\n    public static void main(String args[])\
  \ {\n        RGBCheckBox rgb = new RGBCheckBox();\n        rgb.startApp();\n   \
  \ }\n}\n```\n\n# 运行说明\n1. 将此代码保存为名为 `RGBCheckBox.java` 的文件。\n2. 使用 `javac RGBCheckBox.java`\
  \ 编译代码。\n3. 使用 `java RGBCheckBox` 运行程序。\n当你运行时，将出现一个带有三个复选框（红色、绿色和蓝色）的窗口，红色和蓝色被预选，并还有一个“Click\
  \ Me!”按钮。\n\n### RGBRadioButton.java\n在解释中，我们将分解如何使用 `JRadioButton` 组件创建一个基础 Swing\
  \ 应用程序，展示单选按钮和复选框之间的区别。\n\n## 单选按钮与复选框的关键区别\n- **单选按钮 (Radio buttons)**：允许用户一次只选择一个选项。当你选择一个单选按钮时，同一组中之前选中的任何按钮都会取消选择。\n\
  - **复选框 (JCheckBox)**：允许用户选择多个选项。你可以独立地选择或取消选择多个选项。\n\n## 代码分解\n### 1. 类和导入语句\n\
  我们首先导入必要的包：\n```java\nimport java.awt.*; // 用于 GridLayout 和其他布局管理器\nimport javax.swing.*;\
  \ // 用于 JFrame, JButton\n```\n\n### 2. 创建主类\n在这种情况下，类名为 `RGBRadioButton`：\n```java\n\
  public class RGBRadioButton {\n    // 声明组件：JFrame, JButton 和 JRadioButton\n    private\
  \ JFrame f;\n    private JButton b;\n    private JRadioButton red, green, blue;\n\
  \n    // 初始化组件的构造函数\n    public RGBRadioButton() {\n        f = new JFrame(\"RGBRadioButton\
  \ Example\");\n        red = new JRadioButton(\" Red \"); // 红色\n        green =\
  \ new JRadioButton(\" Green \");// 绿色\n        blue = new JRadioButton(\" Blue \"\
  ); // 蓝色\n        b = new JButton(\"Click Me!\"); // 按钮\n    }\n}\n```\n\n### 3.\
  \ startApp 方法\n该方法设置布局并将组件（单选按钮、按钮等）添加到框架中：\n```java\npublic void startApp() {\n\
  \    // 设置 4 行 1 列的 GridLayout 以垂直排列组件\n    f.setLayout(new GridLayout(4, 1));\n\
  \    // 默认情况下，红色单选按钮会被选中\n    red.setSelected(true);\n    // 将单选按钮添加到框架以便在 UI 中显示\n\
  \    f.add(red);\n    f.add(green);\n    f.add(blue);\n    // 将单选按钮分组以确保一次只能选择一个\n\
  \    ButtonGroup colorGroup = new ButtonGroup();\n    // 将红色、绿色和蓝色按钮添加到组中\n    colorGroup.add(red);\n\
  \    colorGroup.add(green);\n    colorGroup.add(blue);\n    // 将 \"Click Me!\" 按钮添加到框架\n\
  \    f.add(b);\n    // 设置框架的大小和位置\n    f.setBounds(200, 200, 300, 200);\n    //\
  \ 使框架可见\n    f.setVisible(true);\n}\n```\n\n\n\n\n\n在 Swing 中，即使点击了窗口上的关闭按钮，应用程序可能也不会完全终止，除非添加特定的代码来处理窗口关闭。默认行为是，除非另有指定，否则窗口只会隐藏而退出。\n\
  \n以下是完整的 Java 源代码，文件名：`RGBRadioButton.java`\n\n```java\nimport java.awt.*;\nimport\
  \ javax.swing.*;\n\npublic class RGBRadioButton {\n    private JFrame f;\n    private\
  \ JButton b;\n    private JRadioButton red, green, blue;\n\n    public RGBRadioButton()\
  \ {\n        f = new JFrame(\"RGBJRadioButton Example\");\n        red = new JRadioButton(\"\
  \ Red \");\n        green = new JRadioButton(\" Green \");\n        blue = new JRadioButton(\"\
  \ Blue \");\n        b = new JButton(\"Click Me!\");\n    }\n\n    public void startApp()\
  \ {\n        f.setLayout(new GridLayout(4, 1));\n        red.setSelected(true);\n\
  \        f.add(red);\n        f.add(green);\n        f.add(blue);\n\n        ButtonGroup\
  \ colorGroup = new ButtonGroup();\n        colorGroup.add(red);\n        colorGroup.add(green);\n\
  \        colorGroup.add(blue);\n        f.add(b);\n        f.setBounds(200, 200,\
  \ 300, 200);\n        f.setVisible(true);\n    }\n\n    public static void main(String\
  \ args[]) {\n        RGBRadioButton rgb = new RGBRadioButton();\n        rgb.startApp();\n\
  \    }\n}\n```\n\n### 11.3.3 JComboBox: JComboBoxExample.java\n\nJava 中的 `JComboBox`\
  \ 是一种 Swing 组件，允许用户从下拉列表中选择项目。它既可以是一个不可编辑的列表（用户从预定义值中选择），也可以是一个可编辑的列表（用户也可以输入自己的内容）。该组件结合了按钮和文本字段的功能，为用户提供了一种灵活的输入方式。\n\
  \n在这个示例中，我们将介绍如何创建一个基础的 `JComboBox`，向其填充值，并实现事件处理，以便当用户选择选项时，能够更新标签以反映所选的值。\n\n\
  #### 代码中使用的组件\n\n* `JFrame`：承载应用程序所有组件的窗口或容器。\n* `JButton`：一个可以触发事件的可点击按钮。\n* `JComboBox`：包含供用户选择的选项的下拉列表。\n\
  * `JLabel`：根据用户操作显示消息的标签。\n* `String Array`：包含颜色列表的数组，这些颜色将显示在 `JComboBox` 中。\n\n\
  #### 代码解析\n\n**1. 类的声明**\n`JComboBoxExample` 类开始声明用于表示 `JFrame`、`JButton`、`JComboBox`\
  \ 和 `JLabel` 的私有变量，这些变量将用于整个应用程序。\n```java\nprivate JFrame f;\nprivate JButton b;\n\
  private JComboBox<String> cb;\nprivate JLabel label;\nprivate String colorList[];\n\
  ```\n* `f` 代表帧窗口。\n* `b` 是标记为 \"Show\" 的按钮。\n* `cb` 是包含选项的 `JComboBox`。\n* `label`\
  \ 将显示所选的颜色。\n* `colorList` 保存预定义的值。\n\n**2. 构造函数**\n构造函数初始化 GUI（图形用户界面）的所有组件。它创建了帧、按钮和标签，同时使用\
  \ `setBounds()` 方法分配位置，该方法定义了它们的位置和大小。\n```java\npublic JComboBoxExample() {\n \
  \   f = new JFrame(\"JComboBox List\");\n    label = new JLabel();\n    colorList\
  \ = new String[] {\"Red\", \"Green\", \"Blue\", \"Yellow\", \"Purple\"};\n    cb\
  \ = new JComboBox<>(colorList);\n    cb.setBounds(50, 100, 90, 20);\n    label.setHorizontalAlignment(JLabel.CENTER);\n\
  \    label.setSize(400, 100);\n    b = new JButton(\"Show\");\n    b.setBounds(200,\
  \ 100, 75, 20);\n}\n```\n* 创建了一个标题为 \"JComboBox List\" 的新 `JFrame`。\n* `JLabel`\
  \ 居中对齐并设置了其大小。\n* `JComboBox` 使用 `colorList` 数组填充。\n* 创建了标记为 \"Show\" 的 `JButton`。\n\
  \n**3. 启动应用程序**\n`startApp()` 方法负责将组件添加到帧中并使帧可见。\n```java\npublic void startApp()\
  \ {\n    f.setLayout(null); // 不使用布局管理器，因此使用 setBounds 手动设置位置。\n    f.add(cb); //\
  \ 将 JComboBox 添加到帧中。\n    f.add(label); // 将标签添加到帧中。\n    f.add(b); // 将按钮添加到帧中。\n\
  \    f.setSize(350, 350); // 设置帧的大小。\n    f.setVisible(true); // 使帧可见。\n}\n```\n\
  该方法通过调用 `f.setLayout(null)` 禁用了默认布局管理器，允许对组件进行手动定位。\n\n**4. 按钮的事件处理**\n为了使按钮具有功能，添加了一个\
  \ `ActionListener`。当按钮被点击时，从 `JComboBox` 中获取被选项目并显示在 `JLabel` 中。\n```java\nb.addActionListener(new\
  \ ActionListener() {\n    public void actionPerformed(ActionEvent ae) {\n      \
  \  String str = \"My Color List: \" + cb.getItemAt(cb.getSelectedIndex());\n   \
  \     label.setText(str); // 使用选择的颜色更新标签。\n    }\n});\n```\n* `ActionListener` 监听按钮点击。\n\
  * 当按钮被点击时，使用 `cb.getSelectedIndex()` 获取 `JComboBox` 中的选值并将其设置在标签中。\n* 标签文本更新为所选的颜色名称。\n\
  \n**5. Main 方法**\n`main` 方法创建 `JComboBoxExample` 类的实例并通过调用 `startApp()` 启动应用程序。\n\
  ```java\npublic static void main(String args[]) {\n    JComboBoxExample jcbe = new\
  \ JComboBoxExample();\n    jcbe.startApp();\n}\n```\n\n#### 行为\n当应用程序运行时：\n* 出现一个带有\
  \ `JComboBox` 的窗口。用户可以从下拉列表中进行选择。\n* 点击 \"Show\" 按钮后，选中的颜色将显示在标签上。\n\n为了方便，这里是完整的代码：`JComboBoxExample.java`。\n\
  \n### 11.3.4 JList: RGBJList.java\n\n`JList` 用于显示项目列表，用户从中选择一个或多个元素。通过 `JList`，你可以灵活地启用单选或多选，允许用户一次选择多个项目。\n\
  \n\n\n\n要创建一个 `JList`，必须有一个“列表模型（list model）”，它作为你想在 `JList` 中显示的元素的容器。你可以将列表模型想象成数据持有者，而\
  \ `JList` 则作为显示这些项目的视觉界面。\n\n在提供的示例代码中，创建了一个名为 `RGBJList` 的类。该类声明了一个框架（`JFrame`）和一个标签（`JLabel`），用于显示颜色选项列表。首先实例化框架并设置为使用\
  \ `FlowLayout`，这有助于将组件从左到右排列，类似于段落中的文本。\n\n在 `startApp()` 方法中，创建了一个 `DefaultListModel`\
  \ 来存储列表数据。该模型的类型为 `String`，意味着它将存储一组表示颜色名称的字符串值。使用 `addElement()` 方法将诸如“Red（红色）”、“Green（绿色）”和“Blue（蓝色）”等项添加到模型中。\n\
  \n一旦在列表模型中填充了这些颜色，就会创建一个新的 `JList` 并将其与模型关联。这种连接确保了 `JList`（代码中的 `colorList`）将显示来自列表模型的各个项。默认情况下，使用\
  \ `setSelectedIndex(0)` 方法预选了列表中的第一项（索引 0，“Red”）。\n\n接下来，使用 `JLabel` 来显示一些文本（“Colors:”）。标签和\
  \ `JList` 都被添加到框架中，并使用 `setBounds(200, 200, 300, 200)` 设置框架的大小和位置，该方法指定了框架在像素中的位置和大小。\n\
  \n最后，通过 `setVisible(true)` 方法使框架可见，允许应用程序窗口显示给用户。\n\n当你运行代码时，你将看到一个颜色选项列表（“Red”、“Green”和“Blue”）。由于调用了\
  \ `setSelectedIndex(0)`，初始状态下“Red”是被中的。用户可以点击任何颜色进行选择。他们还可以通过按住 `Shift` 或 `Command`\
  \ (Mac) / `Control` (Windows) 键并点击额外的颜色来完成多项选择。\n\n以下是保存为 `RGBJList.java` 的示例代码：\n\
  \n```java\n// RGBJList.java\n\nimport java.awt.*;\nimport javax.swing.*;\n\npublic\
  \ class RGBJList {\n    private JFrame f;\n    private JLabel label;\n\n    public\
  \ RGBJList() {\n        f = new JFrame(\"JList Color Example\");\n    }\n\n    public\
  \ void startApp() {\n        f.setLayout(new FlowLayout());\n        DefaultListModel<String>\
  \ listModel =\n            new DefaultListModel<>();\n        listModel.addElement(\"\
  Red\");\n        listModel.addElement(\"Green\");\n        listModel.addElement(\"\
  Blue\");\n\n        JList<String> colorList = new JList<>();\n        colorList.setModel(listModel);\n\
  \        colorList.setSelectedIndex(0);\n        label = new JLabel();\n       \
  \ label.setText(\"Colors: \");\n        f.add(label);\n        f.add(colorList);\n\
  \        f.setBounds(200, 200, 300, 200);\n        f.setVisible(true);\n    }\n\n\
  \    public static void main(String args[]) {\n        RGBJList rgb = new RGBJList();\n\
  \        rgb.startApp();\n    }\n}\n```\n\n\n\n这里是完整的代码：`CounterApp.java`\n\n```java\n\
