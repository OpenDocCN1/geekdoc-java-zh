  \      // 使用默认管理器用于\n        // 所有面板，使用 FlowLayout。\n        p1.add(l1);\n     \
  \   p1.add(tf1);\n\n        p2.add(l2);\n        p2.add(tf2);\n\n        p3.add(l3);\n\
  \        p3.add(tf3);\n\n        p4.add(bAdd);\n        p4.add(bSub);\n        p4.add(bMul);\n\
