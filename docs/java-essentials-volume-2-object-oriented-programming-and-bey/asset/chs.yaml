  \n## 将你的应用程序打包为 Java 存档 (JAR) 文件\n\n### JAR 文件概述\nJAR 代表 Java Archive（Java 存档），是一种用于在单个文件中分发应用程序或库的文件格式。与\
  \ ZIP 文件类似，JAR 文件将多个文件打包在一起，但它是专门为 Java 相关文件（如 `.class` 文件、资源和元数据）设计的。JAR 文件使得跨平台分发\
  \ Java 程序及其相关文件变得简单。JAR 文件有两种常见类型：\n\n- 普通 JAR 文件：打包了 Java 类和资源，但没有指定主类。\n- 可执行的\
  \ JAR 文件：包含一个 `MANIFEST.MF` 文件，其中声明了主类，使得 JAR 文件可以直接执行。\n\n### 创建 JAR 文件的分步指南\n\n\
  #### 设置基础项目\n在创建 JAR 文件之前，你需要组织你的项目文件。假设你正在使用以下目录结构：\n\n- `src/`：包含你的源代码（`.java`\
  \ 文件）。\n- `classes/`：这是存储编译后的 `.class` 文件的地方。\n- `dist/`：这是打包后存储 JAR 文件的地方。\n\n\
  #### 在你的 Java 文件中添加包声明\n在将你的应用程序转换为 JAR 文件时，至关重要的是确保 Java 类是包的一部分。例如，如果你的 `SimpleCalculator.java`\
  \ 文件位于 `src/demo/` 文件夹中，你的源代码应该在文件文件开头包含以下包声明：\n\n```java\npackage demo;\n```\n\
  包声明应该反映你的项目文件夹结构。包含你的 `.java` 文件的文件夹（在本例中为 `demo/`）应该是包名。\n\n#### 编译 Java 源代码（命令行）\n\
  要编译源代码，请打开终端并导航到项目的 `src/` 目录。以下命令将编译 `SimpleCalculator.java` 文件：\n\n```bash\njavac\
  \ -d ../classes demo/SimpleCalculator.java\n```\n解释：\n- `javac`：Java 编译器命令。\n- `-d\
  \ ../classes`：指定编译后的 `.class` 文件的输出目录（在本例中为 `classes/` 文件夹）。\n- `demo/SimpleCalculator.java`：要编译的源文件路径。\n\
  \n编译完成后，`classes/` 文件夹将如下所示。\n\n#### 创建普通 JAR 文件（命令行）\n现在你已经有了编译后的 `.class` 文件，可以创建一个普通\
  \ JAR 文件（不带清单文件）。从 `classes/` 目录运行以下命令：\n\n```bash\njar cvf MyApp.jar demo/\n```\n\
  解释：\n- `jar`：用于创建或管理 JAR 文件的命令。\n- `cvf`：用于创建 JAR 文件的选项：\n    - `c`：创建新 JAR\n  \
  \  - `v`：详细输出（可选，用于在创建期间显示详情）\n    - `f`：指定 JAR 文件的文件名\n- `MyApp.jar`：生成的 JAR 文件名\n\
  - `demo/`：包含要加入 JAR 的 `.class` 文件的文件夹。\n\n此命令将在 `classes/` 目录下创建一个名为 `MyApp.jar`\
  \ 的文件，其中包含 `demo/` 文件夹的内容。\n\n#### 运行普通 JAR 文件（命令行）\n由于你现在已经有了编译后的 `.class` 文件，要运行它，你需要指定路径和全限定类名：\n\
  \n```bash\njava -cp MyApp.jar demo.SimpleCalculator\n```\n解释：\n- `java`：Java 运行命令。\n\
  - `cp MyApp.jar`：指定 JAR 文件作为类路径。\n- `demo.SimpleCalculator`：类的全限定类名。\n\n#### 创建可执行的\
  \ JAR 文件\n可执行的 JAR 文件包含一个 `MANIFEST.MF` 文件，指定了运行 JAR 时执行的主类。以下是创建方法：\n\n**第一步：创建清单文件**\n\
  在 `classes/` 目录下创建一个名为 `manifest.txt` 的文件，内容如下：\n\n```\nMain-Class: demo.SimpleCalculator\n\
  ```\n**注意**：确保文件末尾有一个空行。这是清单格式的要求。\n\n**第二步：创建可执行 JAR**\n使用以下命令带清单创建 JAR 文件：\n\n\
  ```bash\njar cvfm MyAppExecutable.jar manifest.txt demo/\n```\n解释：\n- `cvfm`：`m`\
  \ 用于指定清单文件。\n- `MyAppExecutable.jar`：生成的可执行 JAR 文件。\n- `manifest.txt`：清单文件的路径。\n\
  - `demo/`：包含编译后的 `.class` 文件的文件夹。\n\n**第三步：运行可执行 JAR 文件**\n创建可执行 JAR 后，你可以简单地通过使用\
  \ `java -jar` 命令来运行：\n\n```bash\njava -jar MyAppExecutable.jar\n```\n由于 `MANIFEST.MF`\
  \ 文件包含了 `Main-Class` 条目；你不需要指定类名或类路径。\n\n### 使用 NetBeans IDE 创建 JAR 文件\n如果你使用 NetBeans\
  \ 等 IDE，创建 JAR 文件的过程会更加简单。\n\n**第一步：在 NetBeans 中创建 Java 项目**\n1. 打开 NetBeans 并新建项目（File\
  \ > New Project）。\n2. 选择 `Java with Ant` 作为项目类型，并为项目命名为 `SwingDesktopAppProject`。\n\
  3. 在项目设置期间确保取消勾选“Create Main Class”，因为你稍后会手动添加类。\n\n**第二步：添加源代码和包**\n1. 在项目窗口中，右键点击\
  \ `Source Packages` 并选择 `New > Java Class`。\n2. 创建一个名为 `demo` 的包以及名为 `SimpleCalculator`\
  \ 的类（与之前相同）。\n3. 将计算器的 Java 代码添加到 `SimpleCalculator.java` 文件中，包括包声明。\n\n**第三步：运行并测试你的应用程序**\n\
  1. 在项目选项卡中，右键点击 `SimpleCalculator.java` 并选择 `Run File`。\n2. NetBeans 将编译并运行你的应用程序。你应该能看到计算器在运行。\n\
  \n**第四步：在 NetBeans 中创建可执行 JAR**\n\n\n\n\n\n1. 添加 `Main-Class` 声明：进入 `NetBeans` 中的\
  \ `Files` 标签页。打开项目文件夹下的 `manifest.mf` 文件。\n\n2. 在 `manifest.mf` 文件中添加以下条目：\n\n```\n\
  Main-Class: demo.SimpleCalculator\n```\n确保该条目之后有一个空行。\n\n3. 构建项目：在 `Projects` 标签页中右键点击你的项目，并选择\
  \ `Clean and Build`。这将编译你的项目并将其打包成 `JAR` 文件。\n\n4. 找到 JAR 文件：可执行的 `JAR` 文件将位于项目目录的\
  \ `dist/` 文件夹中。\n\n### 步骤 5：运行可执行的 JAR\n\n你可以通过在终端中进入 `dist/` 文件夹并使用以下命令运行 `JAR`\
  \ 文件：\n\n```\njava -jar SwingDesktopAppProject.jar\n```\n\n通过上述步骤，你可以使用命令行或像 `NetBeans`\
  \ 这样的 IDE 创建普通 JAR 和可执行 JAR 文件。这两种 JAR 文件之间的关键区别在于是否存在包含有 `Main-Class` 声明的 `MANIFEST.MF`\
  \ 文件，这允许你无需显式指定类路径或主类即可运行 JAR 文件。\n\n![](img/note.jpg) 章节总结\n\n- `Java AWT` 和 `Swing`\
  \ 都用于构建 GUI，但 `AWT` 依赖于原生操作系统组件，使其具有平台依赖性；而 `Swing` 提供了轻量级、平台无关组件，在不同平台上看起来保持一致。`Swing`\
  \ 还提供了更多功能，例如额外的组件以及对可定制外观和感觉的支持，并且遵循 MVC 设计模式，与 `AWT` 不同。\n\n- 本课重点在于通过导入 `javax.swing`\
  \ 包将基于 `AWT` 的计算器应用程序转换为基于 `Swing` 的应用程序。这种转换涉及将 `AWT` 组件（如 `Frame` 和 `Button`）替换为相应的\
  \ `Swing` 组件（如 `JFrame` 和 `JButton`），同时保留相同的布局管理器和事件处理。尽管两个版本的功能相似，但 `Swing` 提供了增强的视觉吸引力和平台独立的\
  \ UI 特性，这在 Windows 系统上尤为明显。\n\n- `JAR`（Java 存档）文件用于将 Java 应用程序或库打包到单个文件中，以便分发。主要有两种类型：普通\
  \ JAR（打包了类文件但未指定主类）和可执行 JAR（包含一个有 `Main-Class` 声明的清单文件，以便直接执行）。你可以通过编译 Java 代码、将其组织到目录并使用\
  \ `jar` 命令来创建 JAR 文件。或者，像 `NetBeans` 这样的 IDE 可以简化这一过程，自动打包你的项目并为可执行 JAR 创建必要的清单文件。\n\
  \n![](img/Quiz_Icon.jpg) 单选题\n\n1. 如果你想使用 `Swing` 框架，应该导入哪个包？\na. `javax.swing`\
