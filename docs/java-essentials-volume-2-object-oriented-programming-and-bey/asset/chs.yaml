  \ 类的构造函数，可以在那里传递四个整数值来实例化颜色。\n\n以下是示例输出：\n\n![image](img/pg442.jpg)\n\n# 第 11 章：构建\
  \ Swing 桌面应用程序\n\n![](img/klo.jpg)\n\n## 核心学习目标\n\n- 理解 Java GUI 开发中 `AWT` 和 `Swing`\
  \ 之间的主要区别\n- 学习如何将 `AWT` 转换为基于 Swing 的应用程序\n- 探索常用的 Swing 组件，例如 `JCheckBox`、`JRadioButton`、`JComboBox`、`JList`\
  \ 和 `JLabel`\n- 获得使用 Swing 设计图形用户界面的实践经验\n- 学习如何将你的 Swing 应用程序打包并发布为 Java Archive\
  \ (JAR) 文件\n\n在最后一章中，我们将探讨 `AWT` 和 `Swing` 之间的关键区别，重点关注 Swing 如何为构建 Java 图形界面提供更灵活、现代的方法。虽然\
  \ `AWT` 为 GUI 开发奠定了基础，但 `Swing` 通过更丰富的组件集和对外观（look and feel）更好的控制对其进行了增强。你将学习如何将现有的基于\
  \ `AWT` 的应用程序转换为基于 Swing 的应用程序，解锁更高级的功能并改进视觉设计。我们还将仔细查看几个常用的 Swing 组件——例如 `JCheckBox`、`JRadioButton`、`JComboBox`、`JList`\
  \ 和 `JLabel`——并查看它们如何增强用户交互。最后，本章将引导你将 Swing 应用程序打包成 Java Archive (JAR) 文件，使其易跨平台共享、运行或部署。完成本章后，你将准备好使用\
  \ Swing 设计、构建和发布全功能的 Java 桌面应用程序。\n\n## 11.1 AWT vs. Swing\n\nJava `AWT`（抽象窗口工具包）和\
  \ `Swing` 都用于构建 Java 图形用户界面 (GUI)，但它们之间存在关键区别。\n\n`Swing` 是 Java 基金类 (JFC) 的一部分，并构建在\
  \ `AWT` 之上。虽然 `AWT` 依赖于原生操作系统组件，但 `Swing` 提供了轻量级、跨平台的组件，它们在所有操作系统上的外观都是相同的。\n\n\
  在 `AWT` 中，像 `Frame` 和 `Button` 这样的组件与平台绑定，这意味着它们的显示取决于你使用的是 Windows、macOS 还是 Linux。相反，`Swing`\
  \ 组件如 `JFrame` 和 `JButton` 在不同平台上看起来一致，因为它们不依赖于原生操作系统。\n\n图 11.1 适用于 Solaris 和 Windows\
  \ 系统的 AWT 示例帧\n\n![image](img/fig11-1.jpg)\n\n图 11.2 Swing 示例帧\n\n![image](img/fig11-2.jpg)\n\
  \n`Swing` 增加了更多功能和灵活性。它提供了额外的组件，如 `JRadioButton`、`JComboBox`、`JCheckBox` 和 `JLabel`，这些在\
  \ `AWT` 中是不用的。`Swing` 还支持可插件外观（pluggable look-and-feel），这意味着你可以自定义组件的外观，这是 `AWT`\
  \ 不支持的。\n\n另一个关键区别是，`AWT` 组件通常占用内存较大且运行速度较慢，而 `Swing` 组件是轻量级的，性能更好。`Swing` 还遵循 MVC（模型-视图-控制器）设计模式，而\
  \ `AWT` 不支持。\n\n总结来说，`AWT` 提供基本的、依赖平台的组件，而 `Swing` 提供了一组更丰富、更灵活且跨平台的组件。`Swing` 也在\
  \ Java 1.2 中被引入以取代 `AWT` 包。\n\n## 11.2 将你的 AWT 应用转换为基于 Swing 的应用\n\n在本节中，我们将重点关注将\
  \ `AWT`（抽象窗口工具包）应用程序转换为基于 Swing 的基础应用程序。为了实现这一点，在我们的简单计算器应用程序中导入 `javax.swing` 包是关重要的。\n\
  \n简单回顾一下，原始计算器应用程序使用了各种 `AWT` 组件，包括面板、帧、标签、文本字段和按钮。它还包含了 `AWT` 事件包来管理事件处理，例如使用 `ActionListener`\
  \ 响应按钮点击，或实现关闭按钮处理程序，使用户按下 Command+Q（macOS）或 Alt+F4（Windows）时允许应用程序关闭。这构成了一个功能完整的\
  \ `AWT` 应用程序。\n\n这是原始的 `SimpleCalculator.java` 源代码：\n\n```java\n// SimpleCalculator.java\n\
  import java.awt.*;\nimport java.awt.event.*;\n\npublic class SimpleCalculator implements\
  \ ActionListener\n{\n    // 容器\n    private Frame f;\n    private Panel p1, p2,\
  \ p3, p4;\n\n    // 组件\n    private Label l1, l2, l3;\n    private TextField tf1,\
  \ tf2, tf3;\n    private Button bAdd, bSub, bDiv, bClear;\n\n    public SimpleCalculator()\n\
