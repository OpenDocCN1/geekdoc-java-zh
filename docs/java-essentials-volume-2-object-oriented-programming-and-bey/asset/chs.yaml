  \n![](img/code.jpg) 编程任务\n\n编程任务 1:\n\n\n\n\n\n# 第 4 章：多态\n\n## 核心学习目标\n- 学习多态概念\n\
  - 虚方法调用\n- 异构数组\n- 带有多态参数的方法\n- `instanceof` 运算符\n- 对象类型转换\n\n本章将介绍多态概念，这是面向对象编程（OOP）的核心特性之一，它允许将不同类的对象视为同一个公共父类的实例。我们将探索虚方法调用如何在运行时实现动态方法解析，从而增强代码的灵活性。你将学习如何处理异构数组以及使用接受多态参数的方法，扩展函数能够处理的范围。此外，我们还将介绍用于类型检查的\
  \ `instanceof` 运算符，以及如何在继承体系中使用对象类型转换在不同类型之间进行转换。\n\n## 4.1 多态概念简介\n\n多态源于两个希腊语单词：“poly”意为“多”，“morph”意为“形式”。因此，多态从字面上的意思就是“具有多种形式”。在\
  \ Java 中，对象本身是非多态的，持有该对象的引用变量才是多态的。这意味着在 Java 中，对象只是从类中创建的特定实体，就像根据蓝图制造的汽车一样。该对象本身是不灵活的——它就是那个样子。\n\
  \n然而，引用变量（指向对象的变量）是可以灵活的。如果引用变量是父类类型，它可以指向属于该家族的不同类型的对象（例如，一个 `Vehicle` 变量指向 `Car`\
  \ 或 `Bike`）。这被称为多态——即一种引用类型表示不同对象类型的能力。把它想象成一个可以控制不同设备的通用遥控器。遥控器就像引用变量，而设备（电视、空调、DVD\
  \ 播放器）就像对象。\n\n在本章的示例中，我将使用 `Employee` 类，引用不同类型的“员工”，如经理、总监、工程师和秘书。让我们考虑图 4.1 所示层次结构。\n\
  \n### 图 4.1 单继承示例\n![Images/klo.jpg](img/klo.jpg)\n\n以下是多态用法的一个示例：\n\n```java\n\
  Employee e = new Manager(); // 允许\ne.department = \"Sales\"; // 非法\ne.getDetails();\
  \ // \n```\n\n将 `Manager` 实例存储为 `Employee` 类型利用了多态性，允许无论角色如何都统一处理员工。由于 `Manager`\
  \ 是 `Employee` 的子类，它继承了基本特征。这在需要统一管理员工类型的场景中特别有用，例如在工资系统中。\n\n## 编码任务 2：实现简单继承\n\
  \n**目标：** 通过创建具有共同行为和特定行为的类基础层次结构，理解并应用继承。\n\n**指令：**\n\n### A. 创建基类 Animal\n- **字段：**\n\
