  \ 方法。\n- 练习的这部分已经为你提供。\n\n代码结构：\n\n```java\n// A. 创建基类 Animal:\n// 基类\nclass Animal\
  \ {\n    // 在此处编写代码\n}\n\n// B. 创建子类 Dog, Cat 和 Bird:\n// 子类 Dog\nclass Dog extends\
