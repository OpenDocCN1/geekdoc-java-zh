  \ 的运行时输出。\n\n图 9.3 `PanelInsideAFrame.java` 的运行时输出\n\n## 9.3 Java 布局管理器\n\n![image](img/fig9-3.jpg)\n\
  \n让我们讨论一下布局管理器，它们是 Java 中用于在容器内排列和定位组件的工具。这些管理器帮助控制组件在屏幕上的显示方式。\n\n对于更复杂的布局，你可以嵌套容器，这意味着将一个容器放在另一个容器内部，从而让你创建自定义的布局。在\
  \ `java.awt` 包中，有五种主要的布局管理器：`FlowLayout`、`BorderLayout`、`GridLayout`、`CardLayout`\
  \ 和 `GridBagLayout`。此外，`Swing` 包提供了两个布局管理器：`BoxLayout` 和 `SpringLayout`。\n\n###\
  \ 9.3.1 FlowLayout 管理器\n\n让我们从理解 `FlowLayout` 布局管理器的工作原理开始。`FlowLayout` 将组件按行排列，就像文本行中的单词一样。默认情况下，它将按钮或类似的组件在水平方向上排列，直到空间耗尽，此时它会移动到下一行。这些行的对齐方式可以使用\
  \ `LEFT`、`RIGHT`、`LEADING` 和 `TRAILING` 等属性进行调整。\n\n这里有一个示例来说明这一点。假设你有四个按钮。使用 `FlowLayout`，如果两个按钮可以放入第一行，那么第三个按钮将移动到下一行，依此类推。如果你调整窗口（容器）的大小，按钮将自动调整自己以适应新大小。\n\
  \n下面是一个演示使用 `FlowLayout` 的示例代码：文件名为 `FlowLayoutExample.java`。\n\n```java\nimport\
  \ java.awt.*;\n\npublic class FlowLayoutExample {\n    // 属性\n    private Frame\
  \ f;\n    private Button addBtn, subBtn, mulBtn, divBtn;\n\n    // 构造函数\n    public\
  \ FlowLayoutExample() {\n        f = new Frame(\"Flow Layout\");\n        addBtn\
  \ = new Button(\"+\");\n        subBtn = new Button(\"-\");\n        mulBtn = new\
  \ Button(\"*\");\n        divBtn = new Button(\"/\");\n    }\n\n    // 方法\n    public\
  \ void startApp() {\n        // 设置 FlowLayout 为布局管理器\n        f.setLayout(new FlowLayout());\n\
  \        f.add(addBtn);\n        f.add(subBtn);\n        f.add(mulBtn);\n      \
  \  f.add(divBtn);\n        f.setSize(200, 200);\n        f.setVisible(true);\n \
  \   }\n\n    public static void main(String[] args) {\n        FlowLayoutExample\
  \ example = new FlowLayoutExample();\n        example.startApp();\n    }\n}\n```\n\
  \n当我们尝试编译并运行这段代码时，将得到下面的输出。尝试水平和垂直调整 frame 的大小，观察按钮如何在 frame 内重新对齐。下面的图片显示了 `Frame`\
  \ 在调整大小后的不同版本。\n\n图 9.4 FlowLayout 示例输出 1\n![image](img/fig9-4.jpg)\n\n图 9.5 FlowLayout\
  \ 示例输出 2\n![image](img/fig9-5.jpg)\n\n图 9.6 FlowLayout 示例输出 3\n![image](img/fig9-6.jpg)\n\
  \n在这段代码中，我们创建了一个 frame 和四个按钮。每个按钮都标有数学运算符：加、减、乘、除。在声明并初始化 frame 和按钮后，我们将 frame 的布局设置为\
  \ `FlowLayout`，使用 `f.setLayout(new FlowLayout())`。如果你调整窗口，你会注意到按钮会自动重新定位。FlowLayout\
  \ 还允许你指定布局内组件的对齐方式。默认情况下是对中对齐，但你可以在设置布局时传递不同的对齐方式，例如 `FlowLayout.LEFT` 或 `FlowLayout.RIGHT`。这是\
  \ `java.awt` 包提供的布局管理器的一个例子，它让你预览布局管理器在组织 GUI 组件时有多强大和灵活。\n\n### 9.3.2 BorderLayout\
  \ 管理器\n\n我们将探讨的下一个 Java frame 使用的默认布局管理器是 `BorderLayout`。该布局管理器将容器分为五个区域：`NORTH`、`SOUTH`、`EAST`、`WEST`\
  \ 和 `CENTER`。在 `BorderLayout` 中排列组件时，每个区域只能包含一个组件，并且每个区域都通过其相应的常量指定（例如 `BorderLayout.NORTH`、`BorderLayout.SOUTH`\
  \ 等）。\n\n如果你在添加组件时没有指定区域，它将被放置在 `CENTER` 区域。该区域是默认区域，也是唯一可以同时水平和垂直扩展的区域。`NORTH`\
  \ 和 `SOUTH` 区域的组件只在水平方向调整，而 `EAST` 和 `WEST` 区域只在垂直方向调整。\n\n图 9.7 BorderLayout \n\
  ![image](img/fig9-7.jpg)\n\n让我们来看一个例子。假设我们有一个五个按钮的 frame：北部按钮 (`bNorth`)、南部按钮 (`bSouth`)、中心按钮\
  \ (`bCenter`)、西部按钮 (`bWest`) 和东部按钮 (`bEast`)。在我们的类构造函数中，我们将首先创建 frame 和按钮。\n\n这里有一个带有文件名的示例代码：`BorderLayoutExample.java`。\n\
  \n```java\nimport java.awt.*;\n\npublic class BorderLayoutExample\n{\n    private\
  \ Frame f;\n    private Button bNorth, bSouth, bCenter, bWest, bEast;\n\n    public\
  \ BorderLayoutExample() {\n```\n\n\n\n\n\n```java\n{\n    f = new Frame(\"BorderLayout\
  \ Example\");\n\n    bNorth = new Button(\"North\");\n    bSouth = new Button(\"\
  South\");\n    bCenter = new Button(\"Center\");\n    bWest = new Button(\"West\"\
  );\n    bEast = new Button(\"East\");\n}\n\npublic void startApp()\n{\n    // frames\
  \ 默认使用 BorderLayout 布局，\n    // 不需要更改 Frame f 的 \n    // 布局管理器；\n\n    f.add(bNorth,\
  \ BorderLayout.NORTH);\n    f.add(bSouth, BorderLayout.SOUTH);\n    f.add(bCenter,\
  \ BorderLayout.CENTER);\n    f.add(bWest, BorderLayout.WEST);\n    f.add(bEast,\
  \ BorderLayout.EAST);\n\n    f.setSize(400, 200);\n    f.setVisible(true);\n}\n\n\
  public static void main(String args[])\n{\n    BorderLayoutExample be = new BorderLayoutExample();\n\
  \    be.startApp();\n}\n```\n\n接下来，我们使用一个方法（暂称为 `startApp()`）来设置我们的窗口。由于 `BorderLayout`\
  \ 是窗口默认的布局管理器，因此我们不需要像上一个示例那样调用 `setLayout()` 方法。相反，我们可以直接将按钮添加到窗口中，并确保指定它们的位置。\n\
  \n如果你在添加按钮时忘记指定区域，所有按钮将堆叠在 `CENTER` 区域中，且只有最后一个添加的按钮是可见的。为了避免这种情况，请务必为每个按钮指定正确的区域。\n\
  \n运行此代码时，你将看到一个包含五个按钮的窗口，每个按钮位于五个区域之一。如果你在水平方向调整窗口，只有 `NORTH`、`CENTER` 和 `SOUTH`\
  \ 区域的按钮会调整大小。如果你在垂直方向调整窗口，只有 `WEST`、`CENTER` 和 `EAST` 区域的按钮会调整大小。`NORTH` 和 `SOUTH`\
  \ 区域的按钮在垂直调整窗口大不会改变大小。\n\n图 9.8 `BorderLayoutExample.java` 运行输出\n\n![image](img/fig9-8.jpg)\n\
  \n### 9.3.3 GridLayout 布局管理器\n\n`GridLayout` 布局管理器以矩形网格的形式排列容器内的组件。容器被分为等大小的单元格，每个单元格放置一个组件。当容器调整大小时，其内部的所有组件都保持等大，并调整以适应新尺寸。\n\
  \n例如，假设你有六个按钮，并将它们放置在一个使用 `GridLayout` 的窗口中。无论你如何调整窗口，所有六个按钮都会等比例大小以适应窗口。这使得 `GridLayout`\
  \ 成为构建扫雷游戏或计算器等应用程序的理想选择，因为这些程序需要一致的按钮网格。\n\n现在，让我们保存为 `GridLayoutExample.java`\
  \ 的示例代码。在这个示例中，我们有一个窗口和六个按钮。在构造函数内部，我们创建了窗口和这六个按钮。\n\n```java\nimport java.awt.*;\n\
  \npublic class GridLayoutExample\n{\n    private Frame f;\n    private Button b1,\
  \ b2, b3, b4, b5, b6;\n\n    public GridLayoutExample()\n    {\n        f = new\
  \ Frame(\"GridLayout\");\n        b1 = new Button(\"B1\");\n        b2 = new Button(\"\
  B2\");\n        b3 = new Button(\"B3\");\n        b4 = new Button(\"B4\");\n   \
  \     b5 = new Button(\"B5\");\n        b6 = new Button(\"B6\");\n    }\n\n    public\
  \ void startApp()\n    {\n        // 设置我们 Frame f 的布局管理器；\n        f.setLayout(new\
  \ GridLayout(3, 2));\n\n        // 将所有按钮放入窗口中，\n        // 从左到右\n        // 从上到下\n\
  \        f.add(b1);\n        f.add(b2);\n        f.add(b3);\n        f.add(b4);\n\
  \        f.add(b5);\n        f.add(b6);\n\n        f.pack();\n        f.setVisible(true);\n\
  \    }\n\n    public static void main(String args[])\n    {\n        GridLayoutExample\
  \ ge = new GridLayoutExample();\n        ge.startApp();\n    }\n}\n```\n\n默认情况下，窗口使用\
  \ `BorderLayout`，因此我们需要通过调用窗口的 `setLayout()` 方法将其设置为 `new GridLayout()`。在创建 `GridLayout`\
  \ 时，可以向其构造函数传递两个或四个整数值。在代码的第 23 行，`f.setLayout(new GridLayout(3, 2))` 创建了一个具有 3\
  \ 行 2 列的网格。\n\n\n\n\n\n## 2. 定义类和变量\n接下来，创建一个名为 `SimpleCalculator` 的类，并为框架、标签、文本框和按钮定义必要的变量。\n\
