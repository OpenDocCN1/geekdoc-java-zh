  \n7. **关于多态（Polymorphism），以下哪项描述是正确的？**\n\na. 多态是指通过声明私有访问权限的变量并创建公共方法来设置和获取私有变量的值，从而从用户处隐藏实现细节的过程。\n\
  b. 多态是将数据（变量）和作用于数据的代码（方法）封装成一个单一单元的机制。\nc. 多态允许我们复用父类的属性和方法。\nd. 多态使用来自父类或当前类中的方法来执行不同的任务。这允许我们以不同的方式执行单一操作。\n\
