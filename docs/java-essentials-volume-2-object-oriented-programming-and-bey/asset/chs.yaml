  \ 方法的实现将来自实例化的对象，在例中，它来自 `Manager` 类。\n\n这里是一个包含额外方法的可用代码，可以更好地演示多态性。源代码 `Employee.java`\
  \ 包含了所有三个类：`Employee` 类、`Manager` 类和 `Director` 类。\n\n```java\n1 class Employee\
  \ {\n2     String name;\n3     double salary;\n4     public String getDetails()\
