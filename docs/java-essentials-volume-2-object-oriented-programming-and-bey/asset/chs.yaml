  \ `close()`\nd. `stop()`\n\n### 10. `java.io` 包下哪个类被用于获取文本文件的读取权限？\n\na. `FileInputStream`\n\
  b. `File`\nc. `FileReader`\nd. `FileInputStreamReader`\n\n## 多选题答案页\n\n| 1 – d |\
