  \ `NumberFormatException`。\n* 确保这些异常被捕获，并向用户显示清晰且信息量丰富的消息。\n\n此外，在每行代码后添加注释，以描述其目的和功能。\n\
  \n\n\n\n流（Stream）被定义为从源到目的地或汇点的数据流。源（`source`）流启动数据流，而目的地（`destination`，即 `sink`）则终止数据流。源也称为输入流，汇点也称为输出流。源和汇点都是节点流（node\
  \ streams），也称为端点。这些流可以在数据输入输出之前之前之后进行打开和关闭。\n\n有不同类型的节点，例如文件节点、内存节点、管道或线程间（`pipe`）节点。\n\
  \n## 7.2 基础流类\n\nJava 维护了两组流：字节流和字符流，它们都有各自的输入和输出流类。\n\n表 7.1 基础流类 - 字节流与字符流\n\n\
  | 流 | 字节流 | 字符流 |\n| :--- | :--- | :--- |\n| 源流 | `InputStream` | `Reader` |\n|\
  \ 汇点流 | `OutputStream` | `Writer` |\n\n## 7.3 流中的数据\n\n`java.io` 包下有一些类允许将字节流转换为\
  \ Unicode 文本或字符流，反之亦然。`Reader` 和 `Writer` 类处理 Unicode 文本，而字节流处理原始字节数据。\n\n对于每种节点，无论是文件、内存数组还是网络连接，都有特定的\
  \ Java 类设计用于处理其输入和输出流。\n\n这意味着，当你想要从特定的数据源（如计算机硬盘硬盘上的文件或某块内存）读取或向其写入数据时，Java 提供了一个专门的类来实现这一操作。\n\
  \n某些类直接与字节流工作（处理原始二进制数据），而另一些类则与字符流工作（处理 Unicode 文本）。\n\n例如，`FileInputStream` 和\
  \ `FileOutputStream` 用于从文件中读取和写入字节，而 `FileReader` 和 `FileWriter` 则专为读取和写入字符数据而设计。\n\
  \n这让你能够根据特定需求选择最合适的工具，并更容易以高效、方便且可靠的方式执行 I/O 操作。表 7.2 列出了常见的节点流类。\n\n表 7.2 显示了示例节点流及其对应的类。\n\
  \n表 7.2 示例节点流 - 字节流与字符流\n\n| 类型 | 字节流 | 字符流 |\n| :--- | :--- | :--- |\n| 文件 | `FileInputStream`\
  \ `FileOutputStream` | `FileReader` `FileWriter` |\n| 内存数组 | `ByteArrayInputStream`\
  \ `ByteArrayOutputStream` | `CharArrayReader` `CharArrayWriter` |\n| 内存字符串 | N/A\
  \ | `StringReader` `StringWriter` |\n| 管道 | `PipedInputStream` `PipedOutputStream`\
  \ | `PipedReader` `PipedWriter` |\n\n此表提供了一些 Java 节点流，用于输入和输出操作。节点流直接从各种数据源读取或写入数据，如文件、内存数组（指在程序运行时临时存储数据的内存块）或管道（这是\
  \ Java 程序两个部分之间直接通信的方式——它像一根管子，允许数据从一侧（输出）流向另一侧（输入））。\n\n字节流类中的大多数方法也存在于字符流类中。这就是为什么在大多数情况下，字节流可以完成的任何功能字符流也可以完成。这两种流之间的唯一区别在于它们处理的字符类型。字节流可以处理非文本文本或压缩的数据，而字符流可以处理基于文本的或未压缩的数据。字节流可以处理的示例文件类型包括\
  \ JPG、PDF、MP3、AVI 等。对于字符流，我们有 txt、html、css、xml、js、csv 以及其他未编译的源码，如 py、cpp 和 java\
  \ 文件。\n\n## 7.4 I/O 流链\n\n图 7.1 显示，可以将数据从字节流转换并传递到字符流，反之亦然，以便 JVM 以 Unicode 格式处理上述数据，然后它可以返回变为非\
  \ Unicode 数据，用于存储、显示、流传输或进一步处理。\n\n图 7.1 I/O 流链\n\n```\n![image](img/fig7-1.jpg)\n\
  ```\n\n这种场景的一个示例是从键盘接受键值。Java 1.0 使用的字符编码是 ASCII（美国信息交换标准代码）。它使用 7 位编码 128 个字符，包括英文字母、数字和一些控制字符。通常，这些字符都出现在标准键盘上。1997\
  \ 年 Java 1.1 发布时，主要变化之一是字符编码。它从 ASCII 更改为 Unicode 以满足国际化支持的需求，允许包含英语字母以外的其他字符。Unicode\
  \ 是一个全面的标准，可以使用不同的编码形式（UTF-8、UTF-16、UTF-32）编码超过 110 万个字符。它涵盖了各种语言、符号和表情符号，与 ASCII\
  \ 相比提供了更广泛的全球支持。因此，当我们从 ASCII 格式的键盘输入时，它将通过管道或转换为 Unicode，以便 JVM 可以进行处理。\n\n## 7.5\
  \ Java I/O\n\nJava I/O（输入和输出）提供了一组类和方法，用于从各种数据源（如文件、内存和网络连接）读取数据以及写入数据。它同时支持用于处理二进制数据的字节流和用于管理文本数据的字符流，使其对于不同类型的输入输出具有通用性。\n\
  \n## 7.6 通过键盘读取\n\n从标准输入读取使用一个名为 `System.in` 的预定义对象。`System.in` 是一个默认打开并准备好提供数据的输入流。通常，我们使用此代码段设置输入：`BufferedReader(new\
  \ InputStreamReader(System.in))`。\n\n然后，你可以使用 `BufferedReader` 下的 `readLine()` 方法从标准设备读取行输入。\n\
  \n示例程序：\n\n```java\nimport java.io.*;\npublic class KeyboardInput {\n    public\
  \ static void main(String[] args) throws IOException {\n        BufferedReader br\
  \ = new BufferedReader(new InputStreamReader(System.in));\n        System.out.println(\"\
  输入文本并按 Ctrl + D 或 Ctrl + Z 结束.\");\n        String str = br.readLine();\n      \
  \  while(str != null) {\n            System.out.println(\"Read: \" + str);\n   \
  \         str = br.readLine();\n        }\n        br.close();\n    }\n}\n```\n\n\
  在 Windows 命令行提示符中，Ctrl + Z 等于空字符，而在 Unix / Linux / Mac OS 终端窗口中，那等于 Ctrl + D。在给定的代码中，需要空字符来终止循环。\n\
  \n### 7.6.1 String 到原始数据类型的转换\n\n\n\n\n\n在开发过程中，我们经常会遇到需要将存储为字符串的值转换为原始数据类型以便进行计算或逻辑处理的情况。在\
  \ Java 中处理数据时，将字符串转换为数值和布尔类型是至关重要的。以下是将 `String` 值转换为不同数值和布尔类型的几种方法。\n\n## 1. String\
  \ 到整数类型的转换\n\n要将表示整数的 `String` 转换为 `byte`、`short`、`int` 或 `long` 等整数数据类型，可以使用包装类相应的解析（parse）方法。请参考以下代码：\n\
  \n```java\nString strNum = \"100\";\n\nbyte b = Byte.parseByte(strNum); // 转换为 byte\n\
  short s = Short.parseShort(strNum); // 转换为 short\nint i = Integer.parseInt(strNum);\
  \ // 转换为 int\nlong lNum = Long.parseLong(strNum); // 转换为 long\n```\n\n当处理字符串形式的输入（例如用户输入或文件数据）并需进行数值处理时，这些方法特别有用。\n\
  \n## 2. String 到浮点类型的转换\n\n表示小数的字符串可以使用对应的方法转换为 `float` 或 `double`。请查看下面的代码段：\n\n\
  ```java\nString sNum = \"1.1\";\n\nfloat f = Float.parseFloat(sNum); // 转换为 float\n\
  double d = Double.parseDouble(sNum); // 转换为 double\n```\n\n这些转换允许对带有小数部分的数字进行精确处理，例如在科学或金融应用中进行计算。\n\
  \n## 3. String 到布尔类型的转换\n\n处理存储为字符串的逻辑数据时，`Boolean.parseBoolean()` 方法可以将字符串转换为布尔值。如果字符串等于\
  \ `\"true\"`（不区分大小写），该方法返回 `true`；对于任何其他值返回 `false`：\n\n```java\nString str = \"\
  true\";\nboolean b = Boolean.parseBoolean(str); // 转换为 boolean\n```\n\n这对于处理表示为字符串的标记或开关非常有用，例如配置设置或用户偏好。\n\
  \n通过理解这些转换，开发者可以无缝地将字符串输入转换为适当的数据类型，实现准确高效的计算。\n\n## 7.6.2 使用 java.util.Scanner\
  \ 类接受格式化输入 – 重温 Scanner 类\n\n从 Java 5.0 版本开始，现在可以使用 `java.util` 包下的 `Scanner` 类来接受格式化输入。可以使用你的\
  \ `Scanner` 对象从任何数据源接受格式化输入。\n\n下面是一个使用 `Scanner` 类接受输入的示例代码。文件名为 `ScannerExample.java`。\n\
  \n```java\nimport java.util.Scanner;\n\npublic class ScannerExample {\n    public\
  \ static void main(String[] args) {\n        Scanner s = new Scanner(System.in);\n\
  \        System.out.println(\"What is your name?\");\n        String name = s.nextLine();\n\
  \n        System.out.println(\"How old are you?\");\n        int age = s.nextInt();\n\
  \n        System.out.println(\"Enter your GPA: \");\n        double gpa = s.nextDouble();\n\
  \n        System.out.println(\"Hello \" + name\n        + \", next year you'll be\
  \ \"\n        + (age + 1) + \" years old.\" + \"\\nGPA is: \" + gpa);\n        s.close();\n\
  \    }\n}\n```\n\n运行时输出将：\n\n```\nWhat is your name?\nLawrence\nHow old are you?\n\
  21\nEnter your GPA:\n1.75\nHello Lawrence, next year you'll be 22 years old.\nGPA\
  \ is: 1.75\n```\n\n`Scanner` 类拥有允许格式化输入的方法，如图 7.2 所示。\n\n图 7.2 Scanner 方法\n\n![image](img/fig7-2.jpg)\n\
  \n## 7.6.3 使用 String.format() 方法显示格式化输出\n\n在 Java 1.4 的时代，需要几行代码才能按照你想要格式化输出。然而，自\
  \ Java 5.0 出生以来，格式化输出从未如此简单。通过使用 `String.format()` 或 `System.out.printf()` 方法，你可以使用这些方法来格式化输出。\n\
  \n常见的格式化代码列在表 7.3 中。\n\n表 7.3 String 格式说明\n\n| 代码 | 说明 |\n| --- | --- |\n| %s |\
  \ 将参数格式化为 `String`，通常通过调用对象的 `toString()` 方法。 |\n| %d %o %x | 将整数格式化为十进制、八进制或十六进制值\
  \ |\n| %f %g | 格式化浮点值，`%g` 使用科学计数法 |\n| %n | 在字符串或流中插入换行符。 |\n| %% | 在字符串或流中插入 `%`\
  \ 字符。 |\n\n这是一个示例：\n\n```java\nimport java.io.*;\nimport java.util.Scanner;\n\n\
  public class DisplayAverage {\n    public static void main(String[] args) throws\
  \ IOException {\n        Scanner s = new Scanner(System.in);\n        System.out.println(\"\
  Enter first number: \");\n        int first = s.nextInt();\n        System.out.println(\"\
  Enter second number: \");\n        int second = s.nextInt();\n\n        double quotient\
  \ = (double)first / second;\n        System.out.printf(\"The average is %.2f\\n\"\
  , quotient);\n        s.close();\n    }\n}\n```\n\n\n\n\n| | 方法 | 描述 |\n| :--- |\
  \ :--- | :--- |\n| | `String getParent()` | 返回文件或目录的父目录。 |\n| | `long lastModified()`\
  \ | 显示文件的最后修改时间戳。 |\n| | `long length()` | 显示以字节为单位的文件 own。 |\n| 文件修改 | `boolean\
  \ renameTo(File newName)` | 将文件重命名为指定的新名称。 |\n| | `boolean delete()` | 删除文件或目录。\
  \ |\n| 目录工具 | `boolean mkdir()` | 创建新目录。 |\n| | `String[] list()` | 列出目录内文件和目录的名称。\
  \ |\n| 文件测试 | `boolean exists()` | 检查文件或目录是否存在。 |\n| | `boolean canWrite()` | 验证文件是否可写。\
  \ |\n| | `boolean canRead()` | 验证文件是否可读。 |\n| | `boolean isFile()` | 测试所指的文件是否为普通文件。\
  \ |\n| | `boolean isDirectory()` | 检查路径是否为目录。 |\n| | `boolean isAbsolute()` | 确认路径是否为绝对路径。\
  \ |\n| | `boolean isHidden()` | 检查文件或目录是否隐藏。 |\n\n## 7.8 从文件中读取输入\n\n到目前为止，所有的输入都是通过键盘完成的，键盘恰是标准输入设备。这允许程序直接从用户处读取数据。然而，在某些情况下，程序需要从文件接收输入。应用程序可以对文件进行读取和写入。\n\
  \n负责从文件中读取数据的类是 `FileReader` 类：\n\n```java\nBufferedReader br = new BufferedReader(new\
  \ FileReader(myFile));\n```\n\n`br` 是一个引用变量名，而 `myFile` 是将读取数据的文件。\n\nJava 文件输入程序：\n\
  \n```java\n// ReadFile.java\nimport java.io.*;\npublic class ReadFile {\n    public\
  \ static void main(String[] args) {\n        File myFile = new File(args[0]);\n\
  \        try {\n            BufferedReader br = new BufferedReader(new FileReader(myFile));\n\
  \            String str;\n            while ((str = br.readLine()) != null) {\n\
  \                System.out.println(\"Read: \" + str);\n            }\n        \
  \    br.close();\n        } catch (FileNotFoundException fnfe) {\n            System.out.println(\"\
  File Not Found \" + myFile);\n        } catch (IOException ioe) {\n            System.out.println(\"\
  IOException\");\n        }\n    }\n}\n```\n\n该程序将要求用户在命令行输入文件名（`args[0]`），然后程序将打开该文件。如果文件存在，它将读取每一行文本并在屏幕上显示文件的所有内容。如果文件不存在，将抛出\
  \ `FileNotFoundException`。\n\n## 7.9 向文件中写入输入\n\n为了实现文件的写入能力，我们使用 `FileWriter` 类和\
  \ `PrintWriter` 类。\n\n```java\nPrintWriter out = new PrintWriter(new FileWriter(myFile));\n\
  ```\n\n* `out` 是一个引用变量，将流输出到指定的文件。\n* `myFile` 是存储输入 `String` 的文件名。\n\nJava 文件输出程序：\n\
  \n```java\n// WriteFile.java\nimport java.io.*;\npublic class WriteFile {\n    public\
  \ static void main(String[] args) {\n        File myFile = new File(args[0]);\n\
  \        try {\n            BufferedReader bf = new BufferedReader(new InputStreamReader(System.in));\n\
  \            // 这允许实际向文件写入。\n            PrintWriter out = new PrintWriter(new FileWriter(myFile));\n\
  \n            String s;\n            while ((s = bf.readLine()) != null) {\n   \
  \             out.println(s);\n            }\n            out.close();\n       \
  \     bf.close();\n        } catch (FileNotFoundException fnfe) {\n            System.out.println(\"\
  File Not Found \" + myFile);\n        } catch (IOException ioe) {\n            System.out.println(\"\
  IOException\");\n        }\n    }\n}\n```\n\n\n\n\n\n## 测验题\n\n### 6. 如果你要在代码中使用\
