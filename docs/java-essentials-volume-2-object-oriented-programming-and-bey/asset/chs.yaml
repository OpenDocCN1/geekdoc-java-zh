  \n        // 组件\n        l1 = new Label(\"First: \");\n        l2 = new Label(\"\
  Second: \");\n        l3 = new Label(\"Result: \");\n        tf1 = new TextField(\"\
  0\");\n        tf2 = new TextField(\"0\");\n        tf3 = new TextField(\"0\");\n\
  \        bAdd = new Button(\"+\");\n        bSub = new Button(\"-\");\n        bDiv\
  \ = new Button(\"*\");\n        bClear = new Button(\"C\");\n    }\n\n    public\
