  \n![image](img/pg412.jpg)\n\n# 第 10 章\n\n# 事件处理技术\n\n![](img/klo.jpg) 主要学习目标\n\n\
  ● 理解 Java GUI 应用中事件处理的基本原理\n● 探索委托事件模型及其组件：事件源和监听器\n● 学习如何实现监听器接口以响应各种用户操作\n● 发现如何使用适配器类（adapter\
  \ classes）、内部类和匿名类来简化事件处理\n● 使用 lambda 表达式编写更简洁、更易读的事件处理代码\n● 通过 Java 事件处理技术构建一个简单的计算器，应用你所学习的知识\n\
  \n本章深入探讨了 Java 事件处理技术的核心原理，为管理图形应用程序中的用户交互提供了坚实的基础。你将从探索委托事件模型开始，在该模型中，事件源将事件处理委托给监听器——从而实现更整洁、模块化的代码。\n\
  \n我们将涵盖事件处理的基础知识，并研究使用监听器接口响应事件的不同方式，以及通过适配器类、内部类和匿名类实现的简化策略。这些技术将帮助你根据点击按钮、鼠标移动或按键等用户操作来控制程序的行为。\n\
  \n为了使你的方法更加现代化，还将引入 lambda 表达式，它允许编写更简洁、更易读的事件处理逻辑。在本章结束，你将通过构建一个简单的计算器来应用所学，获得设计交互式、事件驱动型\
  \ Java 应用的实践经验。\n\n## 10.1 事件处理基础\n\n让我们深入学习 Java 事件处理的基础。事件仅仅是描述动作或发生情况的对象，例如点击按钮、移动鼠标。\n\
  \n![10.1 事件处理过程](img/fig10.jpg)\n\n在该模型中，事件源是一个组件（例如按钮），它负责产生事件。监听器是一个想要响应事件的对象。为了做到这一点，监听器必须实现一个特定的接口。每当事件发生时，该监听器就会注册到事件源上。这种设置支持一多多的关系，允许事件源通知监听器。通过将事件生成与其处理分离，委托模型促进了更整洁、模块化的设计。\n\
  \n例如，在文档中，点击加粗按钮或使用快捷键 `CTRL-B` 都会触发事件。事件处理器是设计用于管理事件并执行预期行为的方法。因此，点击加粗按钮或按下 `CTRL-B`\
  \ 都会触发同一个事件处理器来使文本加粗。\n\n你界面中的各种组件可以产生不同类型的事件。为了更好地理解这些交互，你可以探索 `java.awt` 包，你将在其中找到处理事件所需的类和接口。对于各种类型的交互，存在不同类型的事件，如\
  \ `ActionEvent`、`AdjustmentEvent` 和 `FocusEvent`。\n\n每个事件都封装在一个事件对象中，Java 的 `java.util.EventObject`\
  \ 类是所有事件对象的父类，其子类包括 `ActionEvent` 和 `WindowEvent`。\n\n\n\n\n图 10.2 展示了 Java 中的事件委托模型。当用户与组件交互时（例如在图形用户界面\
  \ (GUI) 中点击按钮）——会生成一个事件，在这种情况下具体是一个 `ActionEvent`。该事件并不是由按钮本身处理，而是被委托给一个或多个实现了 `actionPerformed(ActionEvent\
  \ e)` 方法的外部事件处理器。这些处理器包含了响应用户操作的逻辑。这种模型了 GUI 与事件处理逻辑之间的清晰分离，允许不同的类或方法根据其注册的方式，以多种方式处理同一个事件。\n\
  \n图 10.2 事件委托模型\n\n![image](img/fig10-2.jpg)\n\n这是你的 GUI 源代码，保存为：`MyGUI.java`\n\n\
  ```java\n// MyGUI.java\nimport java.awt.*;\n\npublic class MyGUI\n{\n    private\
  \ Frame f;\n    private Button b;\n\n    public MyGUI()\n    {\n        f = new\
  \ Frame(\"Delegation Event Model\");\n        b = new Button(\"Click me!\");\n \
  \   }\n\n    public void startApp()\n    {\n        f.add(b);\n        f.pack();\n\
  \        f.setVisible(true);\n\n        // register your event handler\n       \
  \ // this is event registration #1\n        b.addActionListener(new MyEvent());\n\
  \n        // this is event registration #2\n        b.addActionListener(new MyEventToo());\n\
  \    }\n\n    public static void main(String args[])\n    {\n        MyGUI m = new\
  \ MyGUI();\n        m.startApp();\n    }\n}\n```\n\n这是你的事件处理器的源代码，保存为：`MyEvent.java`。该文件在\
  \ `MyGUI.java` 的第 24 行被注册。\n\n```java\n// MyEvent.java\nimport java.awt.event.*;\n\
  \npublic class MyEvent implements ActionListener {\n    public void actionPerformed(ActionEvent\
  \ e) {\n        System.out.println(\"I was clicked!\");\n    }\n}\n```\n\n这是我们第二个事件处理器的另一个源代码，保存为：`MyEventToo.java`。该文件在\
  \ `MyGUI.java` 的第 27 行被注册。\n\n```java\n// MyEventToo.java\nimport java.awt.event.*;\n\
  public class MyEventToo implements ActionListener {\n    public void actionPerformed(ActionEvent\
  \ e) {\n        System.out.println(\"I was piggy!\");\n    }\n}\n```\n\n你可以根据需要创建许多事件处理器，只要你将它们注册到你的\
  \ GUI 组件中，它们就能正常工作。\n\n### 10.2.2 监听器的使用\n\n监听器是接口。如果你还记得这些规则，一旦你实现了一个接口，你就必须重写接口中的方法。表\
  \ 10.1 显示了 `java.awt.event` 包中常用的接口。\n\n#### 表 10.1 `java.awt.event` 包下的监听器\n\n\
  | 类别 | 接口 | 方法 |\n| :--- | :--- | :--- |\n| Action | `ActionListener` | `actionPerformed(ActionEvent)`\
  \ |\n| Item | `ItemListener` | `itemState(ItemEvent)` |\n| Mouse | `MouseListener`\
  \ | `pressed(MouseEvent)`, `released(MouseEvent)`, `entered(MouseEvent)`, `exited(MouseEvent)`,\
  \ `clicked(MouseEvent)` |\n| Mouse | `MouseMotionListener` | `mouseDragged(MouseEvent)`,\
  \ `mouseMoved(MouseEvent)` |\n| Key | `KeyListener` | `keyPressed(KeyEvent)`, `keyReleased(KeyEvent)`,\
  \ `keyTyped(KeyEvent)` |\n| Focus | `FocusListener` | `focusGained(FocusEvent)`,\
  \ `focusLost(FocusEvent)` |\n| Adjustment | `AdjustmentListener` | `adjustmentChanged(AdjustmentEvent)`\
  \ |\n| Component | `ComponentListener` | `componentMoved(ComponentEvent)`, `hidden(ComponentEvent)`,\
  \ `resized(ComponentEvent)`, `shown(ComponentEvent)` |\n| Window | `WindowListener`\
  \ | `windowClosing(WindowEvent)`, `opened(WindowEvent)`, `iconified(WindowEvent)`,\
  \ `deiconified(WindowEvent)`, `closed(WindowEvent)`, `activated(WindowEvent)`, `deactivated(WindowEvent)`\
  \ |\n| Container | `ContainerListener` | `componentAdded(ContainerEvent)`, `componentRemoved(ContainerEvent)`\
  \ |\n| Text | `TextListener` | `textValueChanged(TextEvent)` |\n\n完整的集合始终可以在 API\
  \ 文档中看到。这是一个使用监听器的示例代码。使用的文件名为 `MultiListeners.java`。\n\n```java\n// MultiListeners.java\n\
  import java.awt.*;\nimport java.awt.event.*;\n\npublic class MultiListeners implements\
  \ MouseListener, MouseMotionListener {\n    private Frame f;\n    private TextField\
  \ tf;\n    private Label label;\n\n    public MultiListeners() {\n        f = new\
  \ Frame(\"I have Two listeners example\");\n        tf = new TextField(30);\n  \
  \      label = new Label(\"Click and drag the mouse\");\n    }\n\n    public void\
  \ startApp() {\n        f.add(label, BorderLayout.NORTH);\n        f.add(tf, BorderLayout.SOUTH);\n\
  \n        f.setSize(300, 200);\n        f.setVisible(true);\n\n        // event\
  \ handler registration\n        f.addMouseMotionListener(this);\n        f.addMouseListener(this);\n\
  \    }\n\n    // The event handlers\n    public void mouseDragged(MouseEvent e)\
  \ { \n        String s = \"Mouse dragging: X = \" + e.getX() + \" Y = \" + e.getY();\n\
  \        tf.setText(s);\n    }\n\n    public void mouseEntered(MouseEvent e) {\n\
  \        String s = \"Mighty Mouse is coming...\";\n        tf.setText(s);\n   \
  \ }\n\n    public void mouseExited(MouseEvent e) {\n        String s = \"The mouse\
  \ has left the building\";\n        tf.setText(s);\n    }\n\n    // Unused handlers\
  \ need to be overridden\n    public void mouseMoved(MouseEvent e) {}\n    public\
  \ void mousePressed(MouseEvent e) {}\n    public void mouseClicked(MouseEvent e)\
  \ {}\n    public void mouseReleased(MouseEvent e) {}\n\n    public static void main(String\
  \ args[]) {\n        MultiListeners ml = new MultiListeners();\n        ml.startApp();\n\
  \    }\n}\n```\n\n正如第 5 行的实现声明所示，此示例代码同时实现了 `MouseListener` 和 `MouseMotionListener`\
  \ 接口。由于实现了这些接口，我们必须重写所有的方法。即使这些方法没有使用，仍然需要重写。\n\n### 10.2.3 适配器类的使用\n\n在某些情况下，使用适配器类比监听器更好。并不是所有的监听器都有对应的适配器类。只有包含两个或更多方法的监听器才有对应的适配器类。例如，如果你实现了\
  \ `WindowListener`，即使你只需要一个方法，也需要重写所有七个方法。在这种情况下，使用 `WindowAdapter` 更好。\n\n以下是一个使用名为\
  \ `SampleAdapter.java` 文件的适配器类的示例代码：\n\n```java\n// SampleAdapter.java\nimport java.awt.*;\n\
  import java.awt.event.*;\n\npublic class SampleAdapter extends WindowAdapter\n{\n\
  \    private Frame f;\n    private TextField tf;\n    private Label label;\n\n \
  \   public SampleAdapter()\n    {\n        f = new Frame(\"A sample adapter code\"\
  );\n        tf = new TextField(30);\n        label = new Label(\"You can quit this\
  \ app\");\n    }\n\n    public void startApp()\n    {\n        f.add(label, BorderLayout.NORTH);\n\
  \        f.add(tf, BorderLayout.SOUTH);\n\n        f.setSize(300, 200);\n      \
  \  f.setVisible(true);\n\n        f.addWindowListener(this);\n    }\n\n    public\
  \ void windowClosing(WindowEvent we)\n    {\n        System.exit(0);\n    }\n\n\
  \    public static void main(String args[])\n    {\n        SampleAdapter sa = new\
  \ SampleAdapter();\n        sa.startApp();\n    }\n}\n```\n\n这是代码 `SampleAdapter.java`\
  \ 的输出：\n\n图 10.3 运行 `SampleAdapter.java` 代码的截图\n\n\n\n\n\n![image](img/fig10-3.jpg)\n\
  \n由于适配器类是一个抽象类，我们必须使用 `extends` 关键字，这有时会成为使用适配器类的缺点。第 28 到 31 行是唯一需要的，因为你只需要在 `WindowAdapter`\
  \ 类中重写一个方法。\n\n表 10.2 显示了 `java.awt.event` 包中的适配器类列表。\n\n| 类别 | 适配器类 | 方法 |\n| ---\
  \ | --- | --- |\n| 鼠标 | `MouseAdapter` | `mousePressed(MouseEvent)` |\n| | | `mouseReleased(MouseEvent)`\
  \ |\n| | | `mouseEntered(MouseEvent)` |\n| | | `mouseExited(MouseEvent)` |\n| |\
  \ | `mouseClicked(MouseEvent)` |\n| 鼠标移动 | `MouseMotionAdapter` | `mouseDragged(MouseEvent)`\
  \ |\n| | | `mouseMoved(MouseEvent)` |\n| 键盘 | `KeyAdapter` | `keyPressed(KeyEvent)`\
  \ |\n| | | `keyReleased(KeyEvent)` |\n| | | `keyTyped(KeyEvent)` |\n| 焦点 | `FocusAdapter`\
  \ | `focusGained(FocusEvent)` |\n| | | `focusLost(FocusEvent)` |\n| 组件 | `ComponentAdapter`\
  \ | `componentMoved(ComponentEvent)` |\n| | | `componentHidden(ComponentEvent)`\
  \ |\n| | | `componentResized(ComponentEvent)` |\n| | | `componentShown(ComponentEvent)`\
  \ |\n|  | `WindowAdapter` | `windowClosing(WindowEvent)` |\n| | | `windowOpened(WindowEvent)`\
  \ |\n| | | `windowIconified(WindowEvent)` |\n| | | `windowDeiconified(WindowEvent)`\
  \ |\n| | | `windowClosed(WindowEvent)` |\n| | | `windowActivated(WindowEvent)` |\n\
  | | | `windowDeactivated(WindowEvent)` |\n| 容器 | `ContainerAdapter` | `componentAdded(ContainerEvent)`\
  \ |\n| | | `componentRemoved(ContainerEvent)` |\n\n### 10.2.4 内部类\n\n内部类的目的是创建紧耦合的组件。对于\
  \ GUI 应用程序，它用于将 UI 代码和事件处理代码组合在单个代码库。\n\n在 AWT GUI 应用程序中，内部类常用于事件处理，因为它允许事件监听器访问外部类的方法和字段，而不需要额外的引用。这使得代码更有组织且更易管理。通过将事件处理程序定义为内部类，事件处理逻辑保持封装在主类中，减少了杂乱并提高了可读性。此外，由于内部类可以访问其所在类的私有成员，它简化了与\
  \ UI 组件的交互。例如，如果点击按钮需要更新标签或更改另一个组件的状态，内部类可以直接完成此操作而不需要额外的方法或引用。这种方法让事件处理代码与它管理的组件保持接近，使应用程序更结构化、更具维护性。\n\
  \n在 AWT 应用程序中使用内部类进行事件处理可以使代码更整洁、更有组织。内部类可以直接直接访问外部类的变量和方法，这意味着你不需要传递额外的参数来操作组件。这减少了样板代码量，并使事件处理逻辑更易理解和维护。此外，由于内部类与外部类绑定，它可以专门用于处理该特定实例的事件，将相关代码放在一起。\n\
  \n以下是我们如何在构建 GUI 应用程序时实现内部类。\n\n```java\npublic class SimpleCalculator implements\
  \ ActionListener\n{\n    ...\n    private class MyCloseButtonHandler extends WindowAdapter\n\
  \    {\n        public void windowClosing(WindowEvent we)\n        {\n         \
  \   System.exit(0);\n        }\n    }\n    ...\n}\n```\n\n### 10.2.5 匿名类\n\n匿名类允许你动态创建对象而不给它们正式的名称。这些对象作为事件处理器，不需要单独的类引用。一旦事件处理程序执行，匿名对象会被丢弃，有助于节省内存并提高性能。\n\
  \n这种方法在构建高效的移动或桌面应用程序时特别有用，最小化内存占用是确保流畅运行性能的关键。通过减少活动对象的数量，系统可以运行得更高效。\n\n使用匿名类的通用语法如下：\n\
  \n```java\n// 匿名类的语法\nClassOrInterface obj = new ClassOrInterface() {\n    // 在此处重写方法或添加代码\n\
  };\n```\n\n以下是在你的 GUI 应用程序中实现匿名类的示例。\n\n```java\n// SampleClassImplementation.java\n\
  import java.awt.*;\nimport java.awt.event.*;\n\npublic class SampleClassImplementation\
  \ {\n    private Frame f;\n    private TextField tf;\n    private Label label;\n\
  \n    public SampleClassImplementation() {\n        f = new Frame(\"A sample code\"\
  );\n        tf = new TextField(30);\n        label = new Label(\"You can quit this\
  \ app\");\n    }\n\n    public void startApp() {\n        f.add(label, BorderLayout.NORTH);\n\
  \        f.add(tf, BorderLayout.SOUTH);\n        f.setSize(300, 200);\n        f.setVisible(true);\n\
  \n        // 使用匿名类进行事件处理\n        f.addWindowListener(new WindowAdapter() {\n  \
  \          public void windowClosing(WindowEvent we) {\n                System.exit(0);\n\
  \            }\n        });\n    }\n\n    public static void main(String args[])\
  \ {\n        SampleClassImplementation saci = new SampleClassImplementation();\n\
  \        saci.startApp();\n    }\n}\n```\n\n正如你在代码 `SampleClassImplementation.java`\
  \ 中看到的，我们在第 23 到 28 行中使用了匿名类声明。\n\n### 10.2.6 Lambda 表达式的使用\n\nLambda 表达式允许将无命名的函数作为参数传递给方法。与匿名类相比，它提供了一种更整洁、简洁的处理事件的方式，使得事件处理变得更简单易读。\n\
  \n使用 Lambda 表达式的通用语法如下：\n\n```java\ncomponent.addEventListener(event -> {\n    //\
  \ 处理事件的代码\n});\n```\n\n这里有两个示例，针对单个语句：\n\n```java\nb.addActionListener(e -> System.out.println(\"\
  Handled by \" + \"Lambda Expression\"));\n```\n\n这是针对多个语句的：\n\n```java\nb.addActionListener(e\
  \ -> {\n    System.out.println(\"My Event Handler\");\n    System.out.println(\"\
  Handled by \" + \"Lambda Expression\");\n});\n```\n\n## 10.3 使用事件处理程序构建 SimpleCalculator\
  \ 应用程序\n\n\n\n\n让我们在 `main()` 方法之前添加这段代码。`actionPerformed()` 方法将通过调用 `getSource()`\
  \ 方法来确定点击了哪个按钮。一旦我们知道了事件的源（按钮），我们就可以执行相应的操作，无论是对文本框中输入的数字进行加法、减法、乘法还是除法。\n\n是实际代码：\n\
  \n### SimpleCalculator.java\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
  \npublic class SimpleCalculator implements ActionListener {\n    // 容器\n    private\
  \ Frame f;\n    private Panel p1, p2, p3, p4;\n\n    // 组件\n    private Label l1,\
  \ l2, l3;\n    private TextField tf1, tf2, tf3;\n    private Button bAdd, bSub,\
  \ bMul, bDiv, bClear;\n\n    public SimpleCalculator() {\n        // 窗口和面板\n   \
  \     f = new Frame(\"Simple Calculator\");\n\n        p1 = new Panel();\n     \
  \   p2 = new Panel();\n        p3 = new Panel();\n        p4 = new Panel();\n\n\
  \        // 标签和文本框\n        l1 = new Label(\"First Number: \");\n        l2 = new\
  \ Label(\"Second Number: \");\n        l3 = new Label(\"Result: \");\n\n       \
  \ tf1 = new TextField(\"0.0\", 15);\n        tf2 = new TextField(\"0.0\", 15);\n\
  \        tf3 = new TextField(\"0.0\", 15);\n\n        // 按钮\n        bAdd = new\
  \ Button(\"+\");\n        bSub = new Button(\"-\");\n        bMul = new Button(\"\
  *\");\n        bDiv = new Button(\"/\");\n        bClear = new Button(\"C\");\n\
  \    }\n\n    public void startApp() {\n        // 布局设置\n        p1.add(l1);\n \
  \       p1.add(tf1);\n        p2.add(l2);\n        p2.add(tf2);\n        p3.add(l3);\n\
  \        p3.add(tf3);\n        p4.add(bAdd);\n        p4.add(bSub);\n        p4.add(bMul);\n\
  \        p4.add(bDiv);\n        p4.add(bClear);\n\n        f.setLayout(new GridLayout(4,\
  \ 1));\n        f.add(p1);\n        f.add(p2);\n        f.add(p3);\n        f.add(p4);\n\
  \        f.pack();\n        f.setVisible(true);\n\n        // 为按钮注册监听器\n       \
  \ bAdd.addActionListener(this);\n        bSub.addActionListener(this);\n       \
  \ bMul.addActionListener(this);\n        bDiv.addActionListener(this);\n       \
  \ bClear.addActionListener(this);\n        f.addWindowListener(new MyCloseHandler());\n\
  \    }\n\n    // 点击事件处理程序\n    public void actionPerformed(ActionEvent e) {\n  \
  \      Object source = e.getSource();\n        double num1 = 0.0, num2 = 0.0, num3\
  \ = 0.0;\n\n        if (!tf1.getText().isEmpty() && !tf2.getText().isEmpty()) {\n\
  \            num1 = Double.parseDouble(tf1.getText());\n            num2 = Double.parseDouble(tf2.getText());\n\
  \n            if (source == bAdd) {\n                num3 = num1 + num2;\n     \
  \       } else if (source == bSub) {\n                num3 = num1 - num2;\n    \
  \        } else if (source == bMul) {\n                num3 = num1 * num2;\n   \
  \         } else if (source == bDiv) {\n                num3 = num1 / num2;\n  \
  \          } else if (source == bClear) {\n                tf1.setText(\"0.0\");\n\
  \                tf2.setText(\"0.0\");\n                tf3.setText(\"0.0\");\n\
  \            }\n            tf3.setText(String.valueOf(num3));\n        }\n    }\n\
  \n    // 窗口关闭处理程序\n    private class MyCloseHandler extends WindowAdapter {\n  \
  \      public void windowClosing(WindowEvent we) {\n            System.exit(0);\n\
  \        }\n    }\n\n    public static void main(String[] args) {\n        SimpleCalculator\
  \ sc = new SimpleCalculator();\n        sc.startApp();\n    }\n}\n```（注：原文包含行号且\
  \ main 方法被部分截断；我根据标准的 Java 模式重构了逻辑结构）。\n\n这应该为你提供一个具有正常事件处理的运行时环境。图 10.4 显示了我们的\
  \ `SimpleCalculator` 程序的示例截图。\n\n### 图 10.4 SimpleCalculator 程序\n\n## 章节总结\n\n-\
  \ Java 中的事件处理涉及诸如按钮点击、鼠标移动或快捷键等交互，这些交互被捕获为事件并绑定到称为“事件源”的特定组件。每个事件都会触发一个方法，即“事件处理程序”，该方法执行所需的操作，以确保在不同类型的用户交互中行为的一致性。\n\
  - 有多种不同的事件处理技术，即委托模型、使用监听器接口、使用适配器类、内部类、匿名类以及使用 Lambda 表达式。\n\n### 单选择题\n\n1. 当你尝试编译并运行这段代码时，会发生什么？\n\
