  \ = new Panel();`\n`Panel p3 = new Panel();`\n`Panel p4 = new Panel();`\n\n图 9.14\
  \ 将所有组件组合在一起。\n\n![image](img/fig9-14.jpg)\n\n向每个面板添加组件。\n\n`p1.add(l1);`\n`p1.add(tf1);`\n\
  `p2.add(l2);`\n`p2.add(tf2);`\n`p3.add(l3);`\n`p3.add(tf3);`\n`p4.add(bAdd);`\n\
  `p4.add(bSub);`\n`p4.add(bMul);`\n`p4.add(bDiv);`\n`p4.add(bClear);`\n\n## 5. 设置布局并将面板添加到框架\n\
  为框架设置布局并添加面板。\n\n`f.setLayout(new GridLayout(4, 1));`\n`f.add(p1);`\n`f.add(p2);`\n\
  `f.add(p3);`\n`f.add(p4);`\n\n## 6. 显示框架\n最后，打包框架并使其可见。\n\n当 m 编译并运行这段代码时，你将看到一个带有标签、文本框和整齐排列按钮的简单用户界面。框架会自动调整大小以适应组件。然而，请注意，此计算器目前只显示\
  \ UI；它还没有执行任何计算或对按钮点击做出响应。在下一章中，我们将讨论事件处理技术，这将使我们能够响应按钮点击以执行计算。\n\n这里是最终组合后的代码：\n\
  \n```java\nimport java.awt.*;\npublic class SimpleCalculator\n{\n    // 容器\n   \
  \ private Frame f;\n    private Panel p1, p2, p3, p4;\n\n    // 组件\n    private\
  \ Label l1, l2, l3;\n    private TextField tf1, tf2, tf3;\n    private Button bAdd,\
  \ bSub, bMul, bDiv, bClear;\n\n    public SimpleCalculator()\n    {\n        //\
  \ 容器\n        f = new Frame(\"My First GUI App\");\n\n        p1 = new Panel();\n\
  \        p2 = new Panel();\n        p3 = new Panel();\n        p4 = new Panel();\n\
  \n        // 组件\n        l1 = new Label(\"First:\");\n        l2 = new Label(\"\
  Second:\");\n        l3 = new Label(\"Result:\");\n\n        tf1 = new TextField(\"\
  0.0\", 15);\n        tf2 = new TextField(\"0.0\", 15);\n        tf3 = new TextField(\"\
  0.0\", 15);\n\n        bAdd = new Button(\"+\");\n        bSub = new Button(\"-\"\
  );\n        bMul = new Button(\"*\");\n        bDiv = new Button(\"/\");\n     \
