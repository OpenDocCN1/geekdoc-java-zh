  \ 和 `Bird` 的实例填充。\n- 遍历数组，对每种动物调用 `printAnimalSound` 方法和 `move` 方法，以演示多态和方法重写。\n\
  \n预期输出：\n```\nBark\nDog is running\nMeow\nCat is pouncing\nChirp\nBird is flying\n\
  ```\n\n# 第 5 章\n# 其他类特性\n\n![](img/klo.jpg)\n\n## 核心学习目标\n- 理解并使用静态成员、包装类和静态导入。\n\
  - 将 `final` 关键字应用于变量、方法和类。\n- 定义并使用枚举（enums）来表示一组预定义的常量。\n- 声明并实现抽象类和抽象方法。\n- 利用接口，包括静态方法和默认方法。\n\
  - 实现函数接口并使用 lambda 表达式来简化代码。\n\n本章探索了重要且特殊的 Java 关键字和概念，这些概念增强了代码的结构、功能和灵活性。我们将重温\
  \ `static` 关键字——理解静态变量和方法如何在类级别运行——并查看它们在 `Math` 和 `System` 等类中的作用。我们还将涵盖包装类和静态导入，并深入探讨\
  \ `final`、`abstract`、`enum` 和 `record` 等关键的面向对象结构。此外，你将学习 Java 8 如何为接口引入强大的功能——包括静态方法、默认方法和函数接口——这允许你简化代码并以更灵活、可重用的方式实现行为。本章最后探讨了\
  \ lambda 表达式如何实现更简洁的函数式编程风格，使你的 Java 代码更自适应且优雅。\n\n## 5.1 重温 static 关键字\n\n`static`\
  \ 关键字在 Java 编程语言中用于允许你声明一个结构（变量或方法）的单一副本，并让该副本由类拥有，而不是由每个实例对象拥有多个副本。\n\n图 5.1 显示类与对象之间关系的图\n\
  \n![image](img/fig5-1.jpg)\n\n在这个类比中，你可以看到类由蓝图表示，而房子代表该类的每个对象的实例。绿色的草坪可以被解释为所有对象实例共享的静态变量。\n\
  \n`static` 关键字只能用于属性、方法和内部类。顶层类不能被声明为静态。\n\n一旦属性、方法或内部类被声明为 `static`，意味着该结构的所有权将归类所有，而不是任何任何对象的实例。即使你创建了该类的多个实例，静态变量仍然只有一个副本。\n\
  \n考虑以下示例：\n\n```java\n// StaticExample1.java\npublic class StaticExample1 {\n  \
  \  public static int counter = 0;\n    private int serialNumber;\n\n    public StaticExample1()\
  \ {\n        counter++;\n        serialNumber = counter;\n    }\n\n    public static\
  \ void main(String[] args) {\n        System.out.println(\"Creating the first object:\
  \ \");\n        StaticExample1 se1 = new StaticExample1();\n        System.out.println(\"\
  Creating the second object: \");\n        StaticExample1 se2 = new StaticExample1();\n\
  \n        System.out.println(\"A total of \" + counter + \" objects were created.\"\
  );\n    }\n}\n```\n\n在第 2 行，我们将变量 `counter` 声明为 `static`，而在第 3 行，`serialNumber`\
  \ 是非静态的。（注：原文说 `serialNumber` 在第 3 行，但代码显示第 3 行是 `serialNumber`，第 2 行是 `counter`）。\n\
  \n## 5.2 如何访问静态变量或静态方法？\n\n`static` 关键字在 Java 编程语言中允许你声明一个结构（变量或方法）的单一副本，并让该副本由类拥有，而不是由每个实例对象拥有多个副本。\n\
  \n## 5.3 Math 类和 System 类\n\n`Math` 和 `System` 类是使用 `static` 的示例。\n\n\n\n\n```java\n\
  import static <pkg_list>.<class_name>.<member_name>;\n```\n\n或者\n\n```java\nimport\
  \ static <pkg_list>.<class_name>.*;\n```\n\n例如，我们可以这样重写上一个例子。\n\n```java\n1 import\
  \ static java.lang.Math.*;\n2 import static java.lang.System.out;\n3 . . .\n7 out.println(PI);\n\
  8 out.println(max(20,30));\n```\n\n在第 1 行中，你导入了 `Math` 类的所有静态成员，因此每次调用 `Math` 类内部的静态成员时，只需要直接调用变量或方法，而无需类名，就像第\
  \ 7 行和第 8 行一样。\n\n在第 2 行中，你只导入了 `System` 类中的一个静态成员，即静态成员 `out`。这意味着静态成员 `out` 可以在不需要\
  \ `System` 类名的情况下访问。因此，如果你想访问 `System` 类中的其他静态成员（如 `System.gc()` 或 `System.exit()`），仍然需要使用类名来访问它们。\n\
  \n```java\n2 import static java.lang.System.out;\n3 . . .\n8 out.println(\"This\
  \ is how you print a message..\");\n9 System.err.println(\"This is an error message..\"\
  );\n10 . . .\n18 System.arraycopy(src, 0, dest, 0, src.length);\n19 . . .\n28 System.exit(0);\n\
  ```\n\n## 5.5 包装类 (Wrapper Classes)\n\n包装类是所有 Java 原始数据类型的等价类。它们位于 `java.lang` 包中，用于创建原始值的对象表示。包装类很容易记忆：它们全都是完整拼写出来的单词，且首字母大大写。\n\
  \n表 5.1 包装类与原始数据类型\n\n| 包装类 | 原始数据类型 |\n| --- | --- |\n| Boolean | boolean |\n|\
  \ Byte | byte |\n| Character | char |\n| Double | double |\n| Float | float |\n\
  | Integer | int |\n| Long | long |\n| Short | short |\n\n### 5.5.1 我们如何使用包装类？\n\n\
  ```java\n7 int num = 100;\n8 Integer i = new Integer(num);// box-in\n9 Integer j\
  \ = new Integer(200);// box-in\n10 int num2 = j.intValue();// box-out\n```\n\n装箱（Box-in）和拆箱（box-out）指的是原始数据类型与其对应的包装类对象之间的自动转换。当像\
  \ `int`、`double` 或 `char` 的原始类型转换为匹配的包装类（如 `Integer`、`Double` 或 `Character`）时，发生装箱。相反，拆箱是将包装类对象转换回其原始类型。例如，将\
  \ `int` 值赋给 `Integer` 对象是装箱操作，而从 `Integer` 对象获取原始 `int` 是拆箱操作。从 Java 1.5 开始，引入了自动装箱（autoboxing）和自动拆箱（unboxing）来自动处理这些转换，使得代码更易读、易写。\n\
  \n在这个示例中，我们声明了一个值为 100 的 `int` 原始数据类型，在第 8 行中，我们创建了一个对象值为 100 的 `Integer` 引用变量 `i`。在第\
  \ 9 行中，我们还声明了一个值为 200 的 `Integer` 对象 `j`。\n\n这个语句是合法的吗？\n\n```java\n11 int sum =\
  \ i + j;// 这在 Java 1.4 中是非法的\n// 以及更早的版本\n```\n\n在 Java 1.4 及更早版本中，第 11 行是不允许的。因为\
  \ `i` 和 `j` 是引用变量，它们包含了所代表的 `Integer` 对象的引用值（或地址）。它们不包含原始原始值，而是包含 `Integer` 对象的内存地址。\n\
  \n但从 Java SE 5 到当前版本，引入了名为自动装箱（AutoBox-In）和自动拆箱（AutoBox-Out）的功能，允许我们将原始值赋给包装类引用变量。\n\
  \n通过应用自动装箱和拆箱功能，给定的代码可以这样重写：\n\n```java\n7 int num = 100;\n8 Integer i = num;//\
  \ 自动装箱\n9 Integer j = 200;// 自动装箱\n10 int num2 = j;// 自动拆箱\n11 int sum = i + j;//\
  \ 自动拆箱\n```\n\n然而，从 Java 9 开始，这些构造函数被废弃，并最终被强烈建议不要使用。原因是：构造函数总是会创建一个新对象，即使已经存在具有相同值的对象。这会浪费内存并影响性能。\n\
  \n相反，开发者被鼓励使用 `valueOf()` 等工厂方法或依赖自动装箱。这两种方法都能尽可能重用现有的缓存对象。\n\n## 5.6 final 关键字\n\
  \n`final` 关键字可以用于属性、方法和类。\n\n声明为 `final` 的类不能被子类。这意味着继承 `final` 类将导致编译错误。\n\n```java\n\
  public class MyString extends String {\n}\n```\n\n对于属性，一旦声明为 `final`，就不能更改它们。它们被视为常量。第一种是初始化常量。例如：\n\
  \n```java\npublic static final double SALES_VAT = 12;\n```\n\n`SALES_VAT` 不再是一个变量；它现在是一个常量。声明为\
  \ `final` 的方法不能被重写。\n\n第二种常量是空白 final 变量（blank final variables）。空白 final 变量是没有分配任何初始值的常量声明。使用空白\
  \ final 变量的规则非常简单：\n\n1. 空白 final 变量的值只能赋值一次。一旦赋值，你就不能更改它的值。\n2. 必须在构造函数的体内为空白 final\
  \ 变量赋值。否则，如果你没有为空白 final 变量赋值，将无法创建对象。\n\n考虑这段示例代码。\n\n```java\n// Student.java\n\
  public class Student {\n    private final int studentNumber;\n\n    public Student()\
  \ {\n        studentNumber = generateStudentNumber();\n    }\n\n    private int\
  \ generateStudentNumber () {\n        // 用于生成\n        // 每个创建的学生学号的代码\n    }\n\
  }\n```\n\n\n\n\n\n`record` 关键字在 Java 14 中作为“预览性特性”引入，并在 Java 16 中作为固定特性包含。`record`\
  \ 关键字用于一个意图仅拥有在构造函数设置的 final 变量的类。\n\n在 Java 14 之前，我们可以使用以下代码：\n\n```java\n// TestPoint.java\n\
  final class Point {\n    public final int x;\n    public final int y;\n\n    public\
  \ Point(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n\n   \
  \ public boolean equals(Object obj) {\n        boolean result = false;\n       \
  \ if (obj != null && obj instanceof Point) {\n            Point p = (Point)obj;\n\
  \            if (this.x == p.x && this.y == p.y) {\n                result = true;\n\
  \            }\n        }\n        return result;\n    }\n\n    public int hashCode()\
  \ {\n        return x ^ y;\n    }\n\n    public String toString() {\n        return\
  \ this.getClass().getName() +\n            \"[x=\" + this.x + \", y=\" + this.y\
  \ + \"]\";\n    }\n}\n\npublic class TestPoint {\n    public static void main(String[]\
  \ args) {\n        Point p1 = new Point(0, 0);\n        Point p2 = new Point(10,\
  \ 20);\n        Point p3 = new Point(10, 20);\n\n        System.out.println(\"Point\
  \ 1 is at: \" + p1.x + \" and \" + p1.y);\n        System.out.println(\"Point 2\
  \ is at: \" + p2.x + \" and \" + p2.y);\n        System.out.println(\"Point 3 is\
  \ at: \" + p3.x + \" and \" + p3.y);\n\n        System.out.println(p1);\n      \
  \  System.out.println(p2.toString());\n        System.out.println(p3);\n\n     \
  \   System.out.println(\"Comparing p1 and p2: \" + p1.equals(p2));\n        System.out.println(\"\
  Comparing p2 and p3: \" + p2.equals(p3));\n    }\n}\n```\n这段 Java 14 之前的代码可以编译并运行，输出如下：\n\
  ```\nPoint 1 is at: 0 and 0\nPoint 2 is at: 10 and 20\nPoint 3 is at: 10 and 20\n\
  [x=0, y=0]\n[x=10, y=20]\n[x=10, y=20]\nComparing p1 and p2: false\nComparing p2\
  \ and p3: true\n```\n由于 `Point` 是一个用户定义的类，因此需要从 `Object` 类重写 `equals()` 和 `toString()`\
  \ 方法。从 Java 14 开始，我们可以使用 `record` 特性编写相同的代码，它会隐式地重写来自 `Object` 类的 `equals()` 和 `toString()`\
  \ 方法实现。这个版本更短且更容易编写。\n\n```java\n// TestPoint.java\nrecord Point(int x, int y) {\
  \ }\n\nclass TestPoint {\n    public static void main(String[] args) {\n       \
  \ Point p1 = new Point(0, 0);\n        Point p2 = new Point(10, 20);\n        Point\
  \ p3 = new Point(10, 20);\n\n        System.out.println(\"Point 1 is at: \" + p1.x()\
  \ + \" and \" + p1.y());\n        System.out.println(\"Point 2 is at: \" + p2.x()\
  \ + \" and \" + p2.y());\n        System.out.println(\"Point 3 is at: \" + p3.x()\
  \ + \" and \" + p3.y());\n\n        System.out.println(p1);\n        System.out.println(p2.toString());\n\
  \        System.out.println(p3);\n\n        System.out.println(\"Comparing p1 and\
  \ p2: \" + p1.equals(p2));\n        System.out.println(\"Comparing p2 and p3: \"\
  \ + p2.equals(p3));\n    }\n}\n```\n此版本可以使用 `--enable-preview` 和 `-source` 选项进行编译。使用\
  \ Java 14 编译：\n```bash\njavac --enable-preview -source 14 TestPoint.java\n```\n\
  成功编译后，我们通过 Java 14 执行程序，并在执行期间使用虚拟机选项 `--enable-preview`：\n```bash\njava --enable-preview\
  \ TestPoint\n```\n执行时，这是预期的输出：\n```\nPoint 1 is at: 0 and 0\nPoint 2 is at: 10 and\
  \ 20\nPoint 3 is at: 10 and 20\n[x=0, y=0]\n[x=10, y=20]\n[x=10, y=20]\nComparing\
  \ p1 and p2: false\nComparing p2 and p3: true\n```\n请注意，Java 14 的代码比 Java 14 之前的代码要短得多。然而，输出是相同的。使用\
  \ Java 16 及更高版本进行编译，可以直接编译：\n```bash\njavac TestPoint.java\n```\n\n## 5.8 的 enum\
  \ 关键字\n\n在 Java 1.5 发布之前，枚举（enumeration）的概念已经存在，但 Java 有的是另一种处理方式。`enum` 关键字用于定义一种称为枚举的特殊数据类型，它表示一组固定的常量，例如星期几或方向。\n\
  \n```java\nclass InnerPlanets {\n    public static final int MERCURY = 0;\n    public\
  \ static final int VENUS = 1;\n    public static final int EARTH = 2;\n    public\
  \ static final int MARS = 3;\n\n    public static void main(String[] args) {\n \
  \       for (int i = 0; i < 4; i++) {\n            switch (i) {\n              \
  \  case MERCURY: System.out.println(\"Mercury\"); break;\n                case VENUS:\
  \ System.out.println(\"Venus\"); break;\n                case EARTH: System.out.println(\"\
  Earth\"); break;\n                case MARS: System.out.println(\"Mars\"); break;\n\
  \                default: System.out.println(\"Other planets\");\n            }\n\
  \        }\n    }\n}\n```\n`enum` 开始作为一种新语言特性引入，允许声明一组常量值。可以使用 `enums` 的示例包括：星期、每天的小时、月份，甚至是扑克牌的花色和点。这些示例总有一组固定的值。`enum`\
  \ 内部声明的所有值都是常量，因此通常全大写写。它允许以描述性的方式声明一组值。这里是使用 `enum` 的示例代码：\n\n```java\n// InnerPlanets.java\n\
  enum InnerPlanets {\n    MERCURY, VENUS, EARTH, MARS;\n}\n\n// TestInnerPlanets.java\n\
  class TestInnerPlanets {\n    public static void main(String[] args) {\n       \
  \ for (InnerPlanets planets : InnerPlanets.values()) {\n            switch (planets)\
  \ {\n                case MERCURY: System.out.println(\"Mercury\"); break;\n   \
  \             case VENUS: System.out.println(\"Venus\"); break;\n              \
  \  case EARTH: System.out.println(\"Earth\"); break;\n                case MARS:\
  \ System.out.println(\"Mars\"); break;\n            }\n        }\n    }\n}\n```\n\
  在旧的枚举中，编译时没有进行类型安全检查。通过这个 Java 5 特性，它限制了编译时检查的值范围，从而消除了 `switch` 中 `default` 语句的需求。枚举类型也可以在类内部声明，例如所示：\n\
  \n```java\n// TestInnerPlanets.java\nclass TestInnerPlanets {\n    enum InnerPlanets\
  \ {\n        MERCURY, VENUS, EARTH, MARS;\n    }\n\n    public static void main(String[]\
  \ args) {\n        System.out.println(\"Our home planet: \" + InnerPlanets.EARTH);\n\
  \    }\n}\n```\n\n\n\n\n`abstract` 关键字只能用于类和方法。`abstract` 关键字意味着“没有具体的实现”；因此，抽象方法在其方法体中没有任何实现，只有方法签名。按照规则，如果一个类包含抽象方法，则该类本身也必须声明为抽象类。\n\
  \n如果一个类被声明为 `abstract`，则你无法从抽象类实例化对象。抽象类充当模板，强制其子类重写那些在所有动物子类中都应该存在的方法。在我们的示例中，抽象类\
  \ `Animal` 包含了既抽象方法和非抽象方法，这些方法必须在所有类型的动物对象中存在。所有动物都会进食、呼吸和睡眠，但这些方法的实现方式不同于每种类型的动物。因此，我们将\
  \ `eat`、`breathe` 和 `sleep` 方法声明为抽象方法，强制 `Animal` 类的所有子类都拥有这些方法的具体实现。另一方面，`play`\
  \ 方法是非抽象方法，并且具有具体的实现（也称为方法体）。重写 `play` 方法是可选的，并不是强制要求的，因为它是一个非抽象方法。\n\n### 图 5.2\
  \ 抽象类 Animal 类图\n\n![image](img/fig5-2.jpg)\n\n考虑给定的 UML。`Animal` 类具有抽象方法。因此，`Animal`\
  \ 类的所有子类必须重写父类 `Animal` 的所有抽象方法。\n\n以下是上述 UML 的等效 Java 代码。\n\n```java\n// Animal.java\n\
  public abstract class Animal {\n    // 抽象方法\n    public abstract void eat();\n \
  \   public abstract void breathe();\n    public abstract void sleep();\n\n    //\
  \ 非抽象方法\n    public void play() {\n        System.out.println(\"Have fun.\");\n\
  \    }\n}\n```\n\n第 4、5 和 6 行是抽象方法的声明。它们内部没有任何方法体，并以分号（`;`）结束。\n\n抽象类 `Animal` 了所有类型动物对象的模板。如果你声明了一个类型为\
  \ `Animal` 的类（`Animal` 类的子类），该类必须重写 `Animal` 类的所有抽象方法，否则该类最终也将变成一个抽象类，因为它继承了所有的抽象方法。\n\
  \n这里是 `Mammal` 类和 `Bird` 类。\n\n```java\n// Mammal.java\npublic class Mammal extends\
  \ Animal {\n    // 重写所有抽象方法\n    public void eat() {\n        System.out.println(\"\
  Mammal Eats\");\n    }\n    public void breathe() {\n        System.out.println(\"\
  Mammal Breathe\");\n    }\n    public void sleep() {\n        System.out.println(\"\
  Mammal Sleeps\");\n    }\n\n    // Mammal 特有的方法\n    public void feedYoung() {\n\
  \        System.out.println(\"Feed Young\");\n    }\n}\n```\n\n```java\n// Bird.java\n\
  public class Bird extends Animal {\n    // 重写所有抽象方法\n    public void eat() {\n \
  \       System.out.println(\"Bird Eats\");\n    }\n    public void breathe() {\n\
  \        System.out.println(\"Bird Breathe\");\n    }\n    public void sleep() {\n\
  \        System.out.println(\"Bird Sleeps\");\n    }\n\n    // 我自己的鸟类方法\n    public\
  \ void layEggs() {\n        System.out.println(\"Lay Eggs\");\n    }\n    public\
  \ void buildNest() {\n        System.out.println(\"Build Nests\");\n    }\n}\n```\n\
  \n这是我们的测试类。\n\n```java\n// TestAnimal.java\npublic class TestAnimal {\n    public\
  \ static void main(String[] args) {\n        // 无法从抽象类\n        // 实例化对象\n     \
  \   // Animal a = new Animal();\n        Mammal dog = new Mammal();\n        Bird\
  \ eagle = new Bird();\n        doAnimal(dog);\n        doAnimal(eagle);\n    }\n\
  \    public static void doAnimal(Animal a) {\n        if (a instanceof Mammal m)\
  \ {\n            m.eat();\n            m.breathe();\n            m.sleep();\n  \
  \          m.play();\n            m.feedYoung();\n        } else if (a instanceof\
  \ Bird b) {\n            b.eat();\n            b.breathe();\n            b.sleep();\n\
  \            b.play();\n            b.layEggs();\n            b.buildNest();\n \
  \       }\n    }\n}\n```\n\n但这个测试类写得并不好；有很多冗余。第 17 到 20 行和第 25 到 28 行是冗余的。为了消除代码中的冗余，让我们通过将重复的方法调用移动到父类来重构代码。例如，由于\
  \ `Mammal` 和 `Bird` 都扩展了 `Animal` 类，并且 `Animal` 拥有 `eat()`、`breathe()` 和 `play()`\
  \ 等方法，你可以直接在 `Animal` 引用上调用这些方法，而无需进行特定类型的转换。\n\n考虑修改后的测试类：\n\n```java\n// TestAnimal2.java\n\
  public class TestAnimal2 {\n    public static void main(String[] args) {\n     \
  \   Mammal dog = new Mammal();\n        Bird eagle = new Bird();\n        doAnimal(dog);\n\
  \        doAnimal(eagle);\n    }\n    public static void doAnimal(Animal a) {\n\
  \        a.eat();\n        a.breathe();\n        a.sleep();\n        a.play();\n\
  \        if (a instanceof Mammal m) {\n            m.feedYoung();\n        } else\
  \ if (a instanceof Bird b) {\n            b.layEggs();\n            b.buildNest();\n\
  \        }\n    }\n}\n```\n\n现在没有冗余了，代码更加整洁。第 11 到 14 行调用 `Bird` 和 `Mammal` 的方法现在通过\
  \ `Animal` 引用调用了一次。\n\n## 5.10 接口\n\n在 Java 中，接口用于定义一个约定或一组类必须实现的方法。它们允许你指定不同类共享的行为，即使这些类没有共同父类。这使得无关类能够提供一致的功能，确保了代码的活性。通过使用接口，开发者可以编写更具重用性和可维护的代码，因为它将“做什么”与“如何做”分开，专注于定义操作而不规定具体的实现细节。接口允许你指定类必须实现的方法，而不规定这些方法的执行方式，使不同的类提供自己的特定实现。接口中的所有方法都是抽象的，应该由实现类重写，和抽象类一样，我们不能使用\
  \ `new` 关键字实例化接口，因为接口不是“具体类”。这对于设计松耦合和模块化的系统特别有用，因为接口定义了类可以做什么，而不是如何做。\n\n### 图\
  \ 5.3 Java 接口图\n\n![image](img/fig5-3.jpg)\n\n接口也可以包含变量，但一旦声明变量，它会自动转换为 `public\
  \ static final` 变量。这些变量现在被视为常量，这意味着我们不能更改接口中变量的值。实现该接口的所有类都将继承这些常量。考虑以下接口集合：\n\n\
  ```java\ninterface I1 { double pi = 3.14; }\ninterface I2 { public double pi = 3.14;\
  \ }\ninterface I3 { static double pi = 3.14; }\ninterface I4 { final double pi =\
  \ 3.14; }\ninterface I5 { public static double pi = 3.14; }\ninterface I6 { static\
  \ final double pi = 3.14; }\ninterface I7 { public final double pi = 3.14; }\n```\n\
  \n所有的接口都声明了变量 `pi`，其结果为：\n\n`public static final double pi = 3.14;`\n\n任何继承 `pi`\
  \ 的类都无法更改其值，因为它本质上是一个常量。\n\n要声明接口，我们使用以下语法：\n\n```java\n<modifier> interface <name>\
  \ [extends <superInterface>*]\n{\n```\n\n\n\n\n\n```java\n<member_variables>*\n\
  <member_methods>*\n}\n```\n\n请注意，接口不能拥有构造函数。拥有构造函数是没有意义的，因为我们无法从接口创建对象。接口还可以扩展其他接口。在需要扩展多个接口的情况下，需要用逗号分隔被继承的接口。\n\
  \n```java\ninterface I1 { public void doStuff(); }\n\ninterface I2 { public void\
  \ doSomething(); }\n\ninterface I3 extends I1, I2 {\n    public void doSomethingElse();\n\
  }\n```\n\n图 5.4 FlyingObject 接口\n\n![image](img/fig5-4.jpg)\n\n`FlyingObject` 接口由\
  \ `Airplane` 类实现，该类重写了接口中的 `takeOff()`、`land()` 和 `fly()` 方法。\n\n使用接口的语法如下：\n\n\
  ```java\n<modifier> class <name> [extends <superclass>]\n           [implements\
  \ <interface>\n           [,<interface>]*]\n{\n    <member_declaration>*\n}\n```\n\
  \n```java\n// FlyingObject 接口: FlyingObject.java\npublic interface FlyingObject\
  \ {\n    public void takeOff();\n    public void land();\n    public void fly();\n\
  }\n```\n\n```java\n// 实现 FlyingObject 的 Airplane 类: Airplane.java\npublic class\
  \ Airplane implements FlyingObject {\n    public void takeOff() {\n        // 增加速度\n\
  \        // 起起起落架\n    }\n    public void fly() {\n        // 保持这些引擎运行\n    }\n\
  \    public void land() {\n        // 降低襟翼\n        // 减速\n    }\n}\n```\n\n接口还可以用于模拟多继承，允许类实现多个接口，或者在扩展类的同时实现接口。\n\
  \n考虑下方的图，`Bird` 类扩展了 `Animal` 类同时实现了 `FlyingObject` 接口。由于 `FlyingObject` 接口中的所有方法都是抽象方法，`Bird`\
  \ 类需要重写 `takeOff()`、`land()` 和 `fly()` 方法。抽象类 `Animal` 也是如此，`Bird` 类也应该重写抽象方法 `eat()`、`breathe()`\
  \ 和 `sleep()`。对于 `play()` 方法，重写它是可选的，因为它是一个具体方法而不是抽象方法。此外，`Bird` 类还可以声明自己特有的方法，这些方法仅在\
  \ `Bird` 对象中存在，如 `feedYoung()` 和 `buildNest()`。\n\n图 5.5 在 Java 中用于多继承的 FlyingObject\
  \ 接口\n\n![image](img/fig5-5.jpg)\n\n`Bird` 类现在将拥有代码：\n\n```java\n// Bird.java\n\
  public class Bird extends Animal implements FlyingObject {\n    // 重写所有抽象方法\n  \
  \  public void eat() {\n        System.out.println(\"Eats\");\n    }\n    public\
  \ void breathe() {\n        System.out.println(\"Breathes\");\n    }\n    public\
  \ void sleep() {\n        System.out.println(\"Sleeps\");\n    }\n    // 我自己的方法\n\
  \    public void layEggs() {\n        System.out.println(\"Lay Eggs\");\n    }\n\
  \    public void buildNest() {\n        System.out.println(\"Nests\");\n    }\n\
  \    // 重写 FlyingObject 接口中的所有方法\n    public void takeOff() {\n        // 扇动翅膀\n\
  \    }\n    public void fly() {\n        // 扇动...翱翔\n    }\n    public void land()\
  \ {\n        // 准备降落\n    }\n}\n```\n\n在 Java 8 中，引入了一组新的语言特性。Java 8 中的接口现在可以拥有\
  \ `default` 方法和 `static` 方法。此外，还引入了函数式接口（`FunctionalInterfaces`）的概念以及 lambda 运算符\
  \ `->`。\n\n## 5.11 接口默认方法\n\n在 Java 8 之前，接口中的所有方法都是抽象方法。这意味着一旦类实现了一个接口，该接口的所有方法都应该由实现类进行重写。从\
  \ Java 8 开始，接口中现在可以包含 `default` 方法。这一功能允许开发者创建一个可扩展的接口，即一个在更新时不会导致实现类出现出现错误的接口。\n\
  \n考虑以下 Java 8 之前的代码：\n\n```java\n// Animal.java\npublic interface Animal {\n   \
  \ public void eat();\n    public void sleep();\n    public void breathe();\n}\n\n\
  // Mammal.java\npublic class Mammal implements Animal {\n    @Override\n    public\
  \ void eat() {\n        // 此处有一些代码\n    }\n    @Override\n    public void sleep()\
  \ {\n        // 此处有一些代码\n    }\n    @Override\n    public void breathe() {\n   \
  \     // 此处有一些代码\n    }\n}\n```\n\n这段代码可以编译，目前看起来也良好，但如果我们通过添加另一个方法来更新 `Animal`\
  \ 接口会怎样？那么 `Mammal` 类将产生编译错误，抱怨 `Animal` 接口中新添加的方法未被重写。\n\n为了解决扩展性问题，可以在 `Animal`\
  \ 接口中添加一个 `default` 方法，这样在更新 `Animal` 接口后，实现类的 `Mammal` 类就不会有任何编译错误。\n\n```java\n\
  // Animal.java\npublic interface Animal {\n    public void eat();\n    public void\
  \ sleep();\n    public void breathe();\n    default void play() {\n        System.out.println(\"\
  Animal is fun.\");\n    }\n}\n\n// Mammal.java\npublic class Mammal implements Animal\
  \ {\n    @Override\n    public void eat() {\n        // 此处有一些代码\n    }\n    @Override\n\
  \    public void sleep() {\n        // 此处有一些代码\n    }\n    @Override\n    public\
  \ void breathe() {\n        // 此处有一些代码\n    }\n}\n```\n\n接口中的默认方法隐式为 `public` 或默认。不允许使用\
  \ `protected` 访问修饰符。如果在实现类中重写了默认方法，它仍然可以使用 `InterfaceName.super.defaultMethod()`\
  \ 语法调用父接口中的默认方法。\n\n考虑示例：\n\n```java\n// DefaultInterface.java\ninterface MyInterface\
  \ {\n    public void sayHi();\n    default void myGreeting() {\n        System.out.println(\"\
  Hello world.\");\n    }\n}\n\npublic class DefaultInterface implements MyInterface\
  \ {\n    @Override\n    public void sayHi(){\n        System.out.println(\"Hi\"\
  );\n    }\n\n    @Override\n    public void myGreeting() {\n        MyInterface.super.myGreeting();\n\
  \        System.out.println(\"Overriding default method.\");\n    }\n\n    public\
  \ static void main(String args[]) {\n        DefaultInterface di = new DefaultInterface();\n\
  \        di.sayHi();\n        di.myGreeting();\n    }\n}\n```\n\n\n\n\n\n`Java`\
  \ 接口的优势之一是能够模拟多重继承，而不会出现实现父类中同时存在的方法时带来的缺陷。\n\n如果同一个类实现的两个接口中存在两个相同的默认方法，在这种情况下，可以使用\
  \ `InterfaceName.super.defaultMethod()` 语法。\n\n```java\ninterface MyInterface1 {\n\
  \    public default void myDefaultGreeting() {\n        System.out.println(\"Inside\
  \ MyInterface 1\");\n    }\n}\n\ninterface MyInterface2 {\n    public default void\
  \ myDefaultGreeting() {\n        System.out.println(\"Inside MyInterface 2\");\n\
  \    }\n}\n\npublic class DefaultInterfaceMultipleInheritance implements MyInterface1,\
  \ MyInterface2 {\n    // overriding default method myDefaultGreeting()\n    @Override\n\
  \    public void myDefaultGreeting() {\n        // calling the method in MyInterface1\n\
  \        MyInterface1.super.myDefaultGreeting();\n\n        // calling the method\
  \ in MyInterface2\n        MyInterface2.super.myDefaultGreeting();\n\n        System.out.println(\"\
  Overriding the \" + \"default method.\");\n    }\n\n    public static void main(String\
  \ args[]) {\n        DefaultInterfaceMultipleInheritance di = new DefaultInterfaceMultipleInheritance();\n\
  \        di.myDefaultGreeting();\n    }\n}\n```\n\n执行时，我们将得到以下输出：\n```\nInside MyInterface\
  \ 1\nInside MyInterface 2\nOverriding the default method.\n```\n\n## 5.13 接口静态方法\n\
  \n自 `Java 8` 起，接口除了声明公共和抽象方法外，还可以声明静态方法。这些是在接口内部声明的具有实际方法体并声明为静态的方法。由于这些是静态方法，它们可以通过接口的名称进行调用。以下是一个接口静态方法的示例：\n\
  \n```java\n// MyInterface.java\npublic interface MyInterface {\n    // a public\
  \ abstract method\n    public void doStuff();\n\n    // a static method\n    public\
  \ static void doSomething() {\n        System.out.println(\"Inside doSomething..\"\
  );\n    }\n}\n```\n\n为了测试给定的静态方法，这里有一个测试类的示例：\n\n```java\npublic class StaticInterface\
  \ implements MyInterface {\n    @Override\n    public void doStuff() {\n       \
  \ System.out.println(\"Inside doStuff..\");\n    }\n\n    public static void main(String[]\
  \ args) {\n        StaticInterface si = new StaticInterface();\n        si.doStuff();\n\
  \        MyInterface.doSomething();\n    }\n}\n```\n\n输出将是：\n```\nInside doStuff..\n\
  Inside doSomething..\n```\n\n静态方法用于在接口内部声明工具方法或辅助方法。它们是声明处接口的一部分，只能通过接口名称调用方法（例如\
  \ `MyInterface.doSomething()`）使用。\n\n## 5.14 接口中的私有方法 (JDK 9)\n\n接口中的私有方法允许你在同一个接口的默认方法和静态方法之间共享代码，而无需将这些辅助方法暴露给实现类。\n\
  \n这是一个示例：\n\n```java\n// MyInterface.java\npublic interface MyInterface {\n    //\
  \ A public abstract method\n    void doStuff();\n\n    // A static method\n    static\
  \ void doSomething() {\n        System.out.println(\"Inside doSomething..\");\n\
  \        logCommon();\n    }\n\n    // A default method\n    default void doMore()\
  \ {\n        System.out.println(\"Inside doMore..\");\n        logCommon();\n  \
  \  }\n\n    // A private helper method (JDK 9+)\n    private static void logCommon()\
  \ {\n        System.out.println(\"[LOG] This is a private \" + \"helper inside the\
  \ interface.\");\n    }\n}\n\n// StaticInterface.java\npublic class StaticInterface\
  \ implements MyInterface {\n    @Override\n    public void doStuff() {\n       \
  \ System.out.println(\"Inside doStuff..\");\n    }\n\n    public static void main(String[]\
  \ args) {\n        StaticInterface si = new StaticInterface();\n        si.doStuff();\n\
  \        si.doMore();\n        MyInterface.doSomething();\n    }\n}\n```\n\n在此代码中，接口\
  \ `MyInterface` 展示了如何使用私有方法支持接口内部的代码复用（这是 `JDK 9` 中添加的功能）。接口定义了三种方法：抽象方法 (`doStuff()`)、静态方法\
  \ (`doSomething()`) 和默认方法 (`doMore()`）。静态方法和默认方法都调用了私有辅助方法 `logCommon()`，该方法会打印日志消息。这个私有方法对实现类\
  \ (`StaticInterface`）不可见，但它允许在 `doSomething()` 和 `doMore()` 之间共享公共逻辑，而无需重复代码。在 `main`\
  \ 方法中，创建了一个 `StaticInterface` 的对象。调用 `si.doStuff()` 运行类自身的实现，而 `si.doMore()` 执行接口中定义的默认方法。同时，`MyInterface.doSomething()`\
  \ 运行接口的静态方法。默认方法和静态方法都成功复用了来自私有方法的隐藏代码，展示了接口中的私有方法如何改进代码组织和可维护性。\n\n## 5.15 密封类\
  \ (JDK 17+)\n\n从 `JDK 17` 开始，`Java` 将密封类（和接口）以及 `instanceof` 模式匹配作为标准功能支持。当这两个特性结合使用时，你的代码将变得：\n\
  \n- 更具可读性\n- 更安全（得益于详尽的类型检查）\n- 更整洁，通常消除了对 `final` 子句的需求\n\n这种组合改进了我们对受限层次结构建模，特别是在特定领域的设计（如形状、操作或事件）。\n\
  \n### 什么是密封类？\n\n密封类或接口允许你严格定义哪些类可以扩展或实现它。\n\n`sealed interface Shape permits Circle,\
  \ Rectangle {}`\n\n这告诉编译器只有 `Circle` 和 `Rectangle` 被允许实现 `Shape` 接口。没有其他类可以实现 `Shape`，这有助于编译器更好地对程序进行推理。\n\
  \n这里是完整的代码：\n\n```java\n// Main.java\nsealed interface Shapes permits Circle, Rectangle\
  \ {}\n\nfinal class Circle implements Shapes {\n    int radius = 3;\n}\n\nfinal\
  \ class Rectangle implements Shapes {\n    int width = 4, height = 6;\n}\n\npublic\
  \ class Main {\n    public static void describeShape(Shapes shape) {\n        if\
  \ (shape instanceof Circle c) {\n            System.out.println(\"Circle with radius\
  \ \" + c.radius);\n        } else if (shape instanceof Rectangle r) {\n        \
  \    System.out.println(\"Rectangle of \" + r.width + \" x \" + r.height);\n   \
  \     }\n    }\n\n    public static void main(String[] args) {\n        describeShape(new\
  \ Circle());\n        describeShape(new Rectangle());\n    }\n}\n```\n\n\n\n\n因为编译器知道\
  \ `Shape` 的所有可能的子类型，它可以验证完备性。这意味着如果逻辑中缺失了任何子类型，编译器都可以向你发出——就像对枚举（enums）使用 `switch`\
  \ 语句的工作一样。\n\n### 为什么这很有用？\n\n● 编译时安全：编译器知道所有允许的子类型，因此它可以捕获缺失的情况。\n● 更好的可读性：更少的类型转换和更清晰的控制流。\n\
  ● 提高可维护性：添加新的允许子类将导致模式匹配中出现编译错误，直到对其进行处理为止。\n\n所有允许的子类必须是 `final` 或 `sealed`。\n\n\
  ## 5.16 函数式接口与 Lambda (->) 运算符\n\n函数式接口本质上是一个只声明了一个抽象方法的接口。在接口声明之之上，放置了 `@FunctionalInterface`\
  \ 注解，用来指示该接口旨在作为函数式接口。\n\n注解是元数据的形式，可以提供有关代码的额外信息，而不影响其行为。注解可以用于向编译器提供指令、定义配置，或在运行时处理期间提供帮助。在这个示例中，`@FunctionalInterface`\
  \ 注解告诉编译器该接口仅包含一个方法，使其成为一个 `FunctionalInterface`。\n\n```java\n@FunctionalInterface\n\
  interface Greeter {\n    public void sayHello(String name);\n}\n```\n\n重要的是，函数式接口应该只有一个抽象方法，它也可以具有任意数量的默认方法（default\
  \ methods）。标准 API 中也可以找到函数式接口，例如 `Runnable`、`Comparable` 和 `ItemListener` 接口。这些接口只有一个抽象方法，因此被认为是函数式接口。\n\
  \n使用 lambda `(->)` 运算符，我们可以轻松地提供方法的实现，而无需创建任何额外的类。考虑此示例：\n\n```java\n// LambdaExample.java\n\
  @FunctionalInterface\ninterface Greeter {\n    public void sayHello(String name);\n\
  }\n\npublic class LambdaExample {\n    public static void main(String args[]) {\n\
  \        Greeter g = (name) ->\n            System.out.println(\"Hello \" + name\
  \ + \"!\");\n        g.sayHello(\"Lawrence\");\n    }\n}\n```\n\n这个示例将值 \"Lawrence\"\
  \ 传递给方法 `sayHello` 并将其显示。\n\n我们还可以使用 lambda `(->)` 运算符指向整个代码块。如果有两个或多个语句需要执行，则需要一对闭合的大括号\
  \ `{ }`。\n\n```java\nGreeter g = (name) -> {\n    System.out.print(\"Hello \");\n\
  \    System.out.println(name);\n};\ng.sayHello(\"Lawrence\");\n```\n\n具有多个参数和返回类型的方法可以通过\
  \ lambda `(->)` 运算符调用。\n\n```java\n// LambdaAnotherExample.java\n@FunctionalInterface\n\
  interface Greeter {\n    public String afterBirthday(String name, int age);\n}\n\
  \npublic class LambdaAnotherExample {\n    public static void main(String args[])\
  \ {\n        Greeter g = (name, age) -> {\n            return name + \", next year\
  \ you will be \" + (age + 1) + \" years old.\";\n        };\n        System.out.println(g.afterBirthday(\"\
  Joe\", 30));\n    }\n}\n```\n\n这将带我们得到输出：\n`Joe, next year you will be 31 years\
  \ old.`\n\n![](img/note.jpg) 章节总结`、`hashCode()` 和 `toString()`。\n● Java 中的 `enum`\
  \ 关键字用于定义一组命名常量，代表固定值的集合。\n● Java 中的 `abstract` 关键字用于定义无法实例化或直接实现的类和方法。\n● 在 Java\
  \ 中，`interface` 关键字用于声明一个约定，允许类实现某些方法而不指定它们应该如何实现。接口允许多重继承的概念。\n● 在 Java 8 中，接口中引入\
  \ `default` 方法允许在接口内部包含方法实现，提供了一种在破坏现有实现的情况下添加新功能的方法。\n● Java 8 的另一个语言特性更新是接口现在可以包含\
  \ `static` 方法，这些是属于接口本身而非任何实现类的工具方法。\n● 函数式接口（Functional Interface）是一个包含恰好一个抽象方法的接口。它们用于将函数表示为对象。Java\
  \ 中的 lambda `(->)` 运算符用于快速、简洁地定义匿名函数，使得在不需要冗长的匿名内部类的情况下更容易实现 `Functional Interfaces`。这种组合使得\
  \ Java 能够更具表达力的函数式风格编程。\n\n![](img/Quiz_Icon.jpg) 多选题\n\n1. 给定以下代码段：\n\n```java\n\
