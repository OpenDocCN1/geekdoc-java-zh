  \ 3：使用静态方法探索结构\n目标：练习静态方法、包语句和结构。\n\n指令：\n1. 创建一个名为 `utilities` 的包。\n2. 在 `utilities`\
  \ 包内部定义一个 `MathHelper` 类，包含：\n   - 一个静态方法 `square(int number)` 返回数字的平方。\n   - 一个静态方法\
  \ `isEven(int number)` 如果数字为偶数则返回 true，否则返回 false。\n3. 创建另一个名为 `mainapp` 的包。\n4.\
  \ 在 `mainapp` 中创建一个 `MainProgram` 类，其包含一个 `main` 方法：\n   - 导入并使用 `MathHelper` 类。\n\
  \   - 调用 `MathHelper` 的两个方法。\n   - 打印结果。\n\n\n\n\n\n假设你目前是一个 `Employee` 对象。作为一名\
  \ `Employee`，你拥有以下属性：`name`、`salary`、`birthDate` 以及一个可以显示你所有信息的方法，我们称其为 `getDetails()`。\n\
  \n```java\npublic class Employee {\n    public String name = \"\";\n    public double\
  \ salary;\n    public Date birthDate;\n    public String getDetails() {...}\n}\n\
  ```\n\n在大多数情况下，`Managers` 也是 `Employees`。`Employees` 和 `Managers` 都有各自的名字、工资和出生日期。在这些属性之上，`Managers`\
  \ 还有他们负责管理和运行的部门。\n\n图 3.2 Manager 类\n![image](img/fig3-2.jpg)\n\n```java\npublic\
  \ class Manager {\n    public String name = \"\";\n    public double salary;\n \
  \   public Date birthDate;\n    public String department;\n    public String getDetails()\
  \ {...}\n}\n```\n\n这种情况非常需要继承。继承是一种通过扩展现有的类来成为其超类（又称父类）来重用类的方法。在我们的示例中，`Manager`\
  \ 类继承了 `Employee` 类，这意味着 `Employee` 类拥有的任何东西，`Manager` 类也拥有。\n\n图 3.3 Employee 和\
  \ Manager 类\n![image](img/fig3-3.jpg)\n\n## 3.3 “是（is-a）”关系\n\n在所有的继承案例中，父类和子类之间都存在明显的“是（is-a）”关系。在\
  \ Java 中，“is-a”关系意味着子类是其超类的特定类型。它暗示了一个层级连接，子类从超类继承特征和行为。\n\n对于 Java 技术，我们将使用 `superclass`（超类）和\
  \ `subclass`（子类）这两个术语。`Manager` 和 `Employee` 类就是“is-a”关系的例子。每个经理都是员工。这种“is-a”关系是展示继承的一种方式。\n\
  \n以下是如何定义继承自 `Employee` 类的 `Manager` 类。你使用 Java 关键字 `extends` 来表示继承。\n\n以下是应用继承的语法：\n\
  \n```java\nclass <SubClass> extends <SuperClass> {\n    // 添加的字段、构造函数和方法\n}\n```\n\
  \n要在 `Employee` 和 `Manager` 类中应用给定语法，我们可以这样写继承关系：\n\n```java\nclass Manager extends\
  \ Employee {\n    // 添加的字段、构造函数和方法\n}\n```\n\n这显示 `Manager` 类是子类，而 `Employee` 类是超类，如果我们对这两个类都应用“is-a”关系，我们可以说一个\
  \ `Manager` “是一个” `Employee`。\n\n图 3.4 继承 Employee 类的 Manager 类\n![image](img/fig3-4.jpg)\n\
  \n```java\n// Employee.java\npublic class Employee {\n    public String name = \"\
  \";\n    public double salary;\n    public Date birthDate;\n    public String getDetails()\
  \ {...}\n}\n\n// Manager.java\npublic class Manager extends Employee {\n    public\
  \ String department;\n}\n```\n\n“is-a”关系不仅限于直接子类；它可以向层级结构的更深处延伸。\n\n## 3.4 单继承\n\
  \n在 Java 编程语言中，我们只能实现单继承，这意味着你只能继承自一个超类（父类）。虽然这没有限制超类只能有一个子类，但它可以拥有多个子类。\n\n请注意[图\
  \ 3.5]中的类 UML 图。每个类都只有一个超类。在这个 UML 中，你还会注意到一个超类有多个子类，例如 `Employee` 类有几个直接子类，如 `Manager`、`Engineer`\
  \ 和 `Secretary`，而 `Director` 类是 `Manager` 类的子类，`Manager` 类又是 `Employee` 类的子类。因此，应用“is-a”关系，我们可以说\
  \ `Director` “是一个” `Manager`。说 `Director` “是一个” `Employee` 也是正确的`Director` 可能不是\
  \ `Employee` 类的直接子类，但它仍然属于同一个层级，所以 `Director` 也是一个 `Employee`。\n\n图 3.5 单继承层级示例\n\
  ![image](img/fig3-5.jpg)\n\n在 C++ 和其他面向对象的编程语言中，允许多继承，但 Java 不允许。这引出了问题：Java 是否劣于\
  \ C++？答案是“否定的”。多继承有几个缺点。以[图 3.6] 为例。\n\n图 3.6 多继承概念\n![image](img/fig3-6.jpg)\n\n\
  假设类 `A` 和类 `B` 都是父类，并且都有一个名为 `doStuff()` 的公共方法，该方法包含两个不同的方法实现。另一个名为类 `C` 的类是类 `A`\
  \ 和类 `B` 的子类。\n\n类 `C` 将继承哪个 `doStuff()` 方法？`doStuff()` 方法在两个父类都存在。这导致了类 `C` 应该继承哪个\
  \ `doStuff()` 方法的问题，它应该继承来自类 `A` 的 `doStuff()` 还是类 `B` 的？这是多继承中可能发生的一个问题。在 Java\
  \ 中，我们可以通过使用接口来模拟多继承。\n\n## 3.5 访问修饰符\n\n访问修饰符用于类、方法和字段。它告诉编译器权限范围。Java 中有四种访问修饰符。表\
  \ 3.1 给出了这些修饰符的摘要。\n\n表 3.1 访问修饰符\n\n| 访问修饰符 | 同一类 | 同一包 | 任何地方 |\n| :--- | :---\
  \ | :--- | :--- |\n| `private` | 是 | 否 | 否 |\n| `default` | 是 | 是 | 否 |\n| `protected`\
  \ | 是 | 是 | 是 |\n| `public` | 是 | 是 | 是 |\n\n一旦内部类、方法或变量被声明为 `private`，其访问范围将仅限制在声明它的类内部。顶层类不允许为\
  \ `private`。如果没有使用任何访问修饰符，则意味着你正在使用 `default` 访问修饰符，它将访问范围限制在声明它的类内部以及同一包内。\n\n\
  相反，`protected` 访问修饰符允许访问范围限制在同一类、同一包内或子类中（即使它们在不同的包中）。使用 `protected` 修饰符的结构无法在同一包之外或非子类中访问。\n\
  \n最后，`public` 访问修饰符可以在任何地方访问。它具有通用访问权限。顶层类只能具有 `default` 或 `public` 访问权限。内部类、变量和方法可以使用上述任何访问修饰符。\n\
  \n## 3.6 方法重写\n\n在某些情况下，当你从超类继承了一个方法，但你发现继承的方法并不足以完成子类所需的职责。为了解决这个困境，你可以重写你继承的方法。\n\
  \n\n\n\n\n```java\npublic String department;\n\n@Override\npublic String getDetails()\
  \ {\n    return \"Name: \" + name +\n           \"\\nSalary: \" + salary +\n   \
  \        \"\\nDepartment: \" + department;\n}\n}\n```\n\n在这个示例中，`Manager` 类的 `getDetails()`\
  \ 方法重写了 `Employee` 类的 `getDetails()` 方法。这是因为 `Manager` 的 `getDetails()` 方法应该提供比继承自父\
  \ 类的 `getDetails()` 方法更多的信息。\n\n## 3.7 方法重写的规则\n\n在提供的源代码中，我们可以说 `Manager` 类的 `getDetails()`\
  \ 方法是重写方法。在重写方法时，需要遵守一些规则。\n\n1. 重写方法必须具有相同的名称。\n   - 例如，在给出的示例中，`Employee` 类和 `Manager`\
  \ 类都有 `getDetails()` 方法。\n\n2. 重写方法必须具有相同的参数列表。\n   - 在此示例中，`Employee` 和 `Manager`\
  \ 类的 `getDetails()` 方法都有空参数列表。\n\n3. 重写方法的返回类型可以是相同的。\n   - 在此示例中，`Employee` 和 `Manager`\
  \ 类的 `getDetails()` 方法的返回类型都是 `String` 对象。\n\n4. 重写方法的访问权限不能降低。\n   - 在 `Employee`\
  \ 类中，`getDetails()` 方法被声明为 `public`；这意味着子类的 `getDetails()` 方法也必须声明为 `public`。\n\n\
  5. 重写方法的返回类型可以是父类方法返回类型的子类。\n   - 在此示例中，`getDetails()` 方法的返回类型为 `String` 类型，且 `String`\
  \ 类没有子类。\n\n假设 `getDetails()` 方法返回一个非 final 对象（例如，一个非 String 对象），那么重写的 `getDetails()`\
  \ 方法可以有不同的返回类型。这里是方法重写的另一种替代方案，以强调规则 #5：\n\n```java\n// Employee.java\npublic class\
  \ Employee {\n    // . . .\n    public Employee getDetails() {\n        // returns\
  \ Employee object...\n    }\n}\n\n// Manager.java\npublic class Manager extends\
  \ Employee {\n    // . . .\n    @Override\n    public Manager getDetails() {\n \
  \       // returns a Manager object\n    }\n}\n```\n\n子类可以使用与父类方法不同的方法实现来修改继承方法的实现，但它必须具有相同的名称、相同的参数列表和返回类型。但对于\
  \ Java 5.0 及更高版本，重写方法的返回类型可以是父类方法返回类型的子类。此外，重写方法的访问修饰符不能降低。\n\n## 3.8 super 关键字\n\
  \n在大多数情况下，重写方法会产生冗余，这是一种糟糕的编程实践。代码中的冗余会在重命名或重构代码时增加代码问题，从而减慢开发和调试时间，还会降低运行速度。\n\n\
  为了最大限度地减少冗余问题，我们可以使用 `super` 关键字。`super` 关键字在类中用于引用其父类的成员数据——包括属性和方法。该行为不必在直接父类中；它可以在层次结构中更高的地方。\n\
  \n以下是 `Employee` 和 `Manager` 类的示例代码，它们的 `getDetails()` 方法中存在冗余。\n\n```java\n// Employee.java\n\
  public class Employee {\n    public String name = \"\";\n    public double salary;\n\
  \    public Date birthDate;\n    public String getDetails() {\n        return \"\
  Name: \" + name +\n               \"\\nSalary: \" + salary;\n    }\n}\n\n// Manager.java\n\
  public class Manager extends Employee {\n    public String department;\n    @Override\n\
  \    public String getDetails() {\n        return \"Name: \" + name + // redundant!\
  \ Bad.\n               \"\\nSalary: \" + salary + // redundant! Bad.\n         \
  \      \"\\nDepartment: \" + department;\n    }\n}\n```\n\n这里是 `Employee` 和 `Manager`\
  \ 代码的修订版本：\n\n```java\n// Employee.java\npublic class Employee {\n    public String\
  \ name = \"\";\n    public double salary;\n    public Date birthDate;\n    public\
  \ String getDetails() {\n        return \"Name: \" + name +\n               \"\\\
  nSalary: \" + salary;\n    }\n}\n\n// Manager.java\npublic class Manager extends\
  \ Employee {\n    public String department;\n    @Override\n    public String getDetails()\
  \ {\n        return super.getDetails() + // this is better.\n               \"\\\
  nDepartment: \" + department;\n    }\n}\n```\n\n在 `Manager` 类的第 5 行，我们使用 `super.getDetails()`\
  \ 来调用 `Employee` 类的 `getDetails()` 方法，而不是复制第 6 行和第 7 行，这允许我们消除代码冗余。\n\n## 3.9 方法重载\n\
  \n在大多数面向对象的编程语言中，我们可以声明具有相同名称、不同参数列表和不同方法实现的方法。这种语言特性被称为方法重载。\n\n图 3.7 Java API\
  \ 文档截图 - `PrintStream` 类方法摘要\n\n![image](img/fig3-7.jpg)\n\n来源：[`docs.oracle.com/en/java/javase/23/docs/api/java.base/java/io/PrintStream.html`](https://docs.oracle.com/en/java/javase/23/docs/api/java.base/java/io/PrintStream.html)\n\
  \n在 Java API 文档中，大多数类都有许多重载方法。例如，在图 3.7 中，如果你查看 `java.io` 包下的 `PrintStream` 类，你会注意到\
  \ `print()` 和 `println()` 方法有多个声明，它们具有不同的参数值。因为这些 `print()` 和 `println()` 方法是重载方法，可以适应任何需要打印的数据。\n\
  \n重载方法可以在同一个类中或同一个类层次中声明。这种特性使我们能够方便地编写和调用具有不同参数的方法。\n\n## 3.10 方法重载的规则\n\n如果你想编写自己的重载方法，可能需要考虑以下规则：\n\
  \n1. 所有重载方法必须具有相同的名称。\n2. 所有重载方法必须具有不同的参数列表。\n3. 对于返回类型，所有重载方法可以相同，也可以不相同。\n\n在下面的示例代码中，我们创建了\
  \ `sum()` 方法的多个版本，用于计算作为参数的所有整数的和。这里有一个显示方法重载的示例代码：\n\n```java\npublic class Overloading1\
  \ {\n    public static void main(String[] args){\n        System.out.println(sum(10,\
  \ 20));\n        System.out.println(sum(10, 20, 30));\n        System.out.println(sum(10,\
  \ 20, 30, 40));\n    }\n\n    public static int sum(int num1, int num2) {\n    \
  \    return num1 + num2;\n    }\n\n    public static int sum(int num1, int num2,\
  \ int num3) {\n        return num1 + num2 + num3;\n    }\n\n    public static int\
  \ sum(int num1, int num2, int num3, int num4) {\n        return num1 + num2 + num3\
  \ + num4;\n    }\n}\n```\n\n在这个示例中，我们看到 `sum` 方法有多个声明，它们都可以在第 9 行、13 行和第 17 行看到。\n\
  \n\n\n\n\n如果用户随后需要累加 2、3 或 4 个整数值，我们只需要调用 `sum()` 方法并将整数值作为参数传递进去即可。所有声明的 `sum()`\
  \ 方法都会接受传递给它的 `int` 值，并计算总和，然后返回所有传递参数的整数和。唯一的局限性是，给定代码中的 `sum()` 方法只能接受 2、3 或 4\
  \ 个 `int` 值。为每种数量的 `int` 值编写一个方法是不切实际的。\n\n为了克服这种局限性，Java SE 5.0 引入了一个新的语言特性，它被称为\
  \ var-args（可变长度参数）。这意味着现在可以向 var-args 方法传递任意数量的参数。\n\n每一种新的的语言特性都伴随着一些规则。以下是声明 var-args\
  \ 方法的规则：\n\n### 1. 每个方法只能有一个 var-args。\n\n正确示例：\n```java\nprotected void doStuff(double…\
  \ args){}\npublic static void main(String… args){}\npublic void doSomething(int…\
  \ args){}\n```\n\n错误示例：\n```java\nprotected void doStuff(double… arg1, int… args2){}\n\
  // Java 不允许在单个方法中使用多个可变长度参数。\n// 只允许一个可变长度参数，且该参数必须是最后一个参数。\n\npublic static void\
  \ main(String… args[]){}\n// 语法错误地结合了可变长度 (...)\n// 和数组符号 ([])。\n\npublic void doSomething(int[]\
  \ args…){}\n// 将可变长度 (...) 放在数组\n// 之后是错误的。正确的方法是 int... args。\n```\n\n### 2. 如果有多个参数，var-arg\
  \ 参数必须是参数列表中的最后一个参数。\n\n正确示例：\n```java\nprotected void doStuff(String str, Object…\
  \ args){}\npublic void doSomething(char ch, int… args){}\n```\n\n错误示例：\n```java\n\
  protected void doSomething (double… arg1, int args2){}\n// 可变长度 (...) 必须是方法签名中的\n\
  // 最后一个参数。在这里，double... arg1\n// 被错误地放置在 int args2 之前。\n\npublic void doStuff(String\
  \ param1, char… param2, int param3){}\n// 类似的问题，char... param2 应该是\n// 最终参数，但后面有一个\
  \ int 参数。\n// 可变长度参数只能出现在末尾。\n```\n\n这是一个使用 var-args 的示例代码：\n\n```java\npublic class\
  \ Overloading2 {\n    public static void main(String[] args) {\n        System.out.println(sum(10,\
  \ 20));\n        System.out.println(sum(10, 20, 30));\n        System.out.println(sum(10,\
  \ 20, 30, 40));\n        System.out.println(sum(1.0, 2.0, 3.0, 4.0));\n    }\n \
  \   public static int sum(int... num) {\n        int total = 0;\n        for (int\
  \ n : num) {\n            total += n;\n        }\n        return total;\n    }\n\
  \    public static int sum(double... num) {\n        double total = 0;\n       \
  \ for (double n : num)\n        {\n            total += n;\n        }\n        return\
  \ total;\n    }\n}\n```\n\n在第 10 行中，参数列表现在使用了 var-args 符号。`sum()` 方法现在可以在 `sum()`\
  \ 方法中接受任意数量的 `int` 值。它现在可以接受 2 个、3 个、4 个、10 个数字甚至一百个数字。在 `sum()` 方法接收到所有 `int` 值后，这些值在\
  \ `sum()` 方法内部将被处理为一个 `int` 数组。还有第 20 行，我们可以在 `sum()` 方法中接受任意数量的 `double` 值。\n\n\
  调用 var-args 方法的一个常见错误是传递了数组值。通常，它们接受原始数据类型，并在 var-args 方法内部读取值时隐式地将其转换为数组，正如第 12\
  \ 行所示，那里使用了增强 for 循环来遍历这些值。\n\n### 3. 继承与构造函数\n\n我们提到过继承是一种允许你将方法和变量传递给子类的特性。对于方法和变量确实如此，但对于构造函数则不然。在\
  \ Java 中，构造函数是不被继承的。考虑以下：\n\n```java\nclass A {\n    A() {\n        System.out.println(\"\
  A\");\n    }\n}\nclass B extends A {\n    B() {\n        System.out.println(\"B\"\
  );\n    }\n}\nclass C extends B {\n    C() {\n        System.out.println(\"C\");\n\
  \    }\n}\npublic class ConstructorChaining {\n    public static void main(String[]\
  \ args) {\n        C c = new C();\n    }\n}\n```\n\n在实例化类 `C` 的对象后，你会发现输出是：\nA\n\
  B\nC\n\n输出给人一种父类构造函数被继承的印象；然而，事实并非如此。关于继承和构造函数有一条规则：构造函数不被继承，但它们是链式的。我们称之为“构造函数链”（constructor-chain）。\n\
  \n上面的示例在编译后后通过在每个构造函数的第一行插入 `super()` 关键字进行了转换。以下是给定代码的更新版本。在这个版本中，Java 已经做了一些更改：\n\
  \n```java\nclass A extends Object {\n    A() {\n        super();\n        System.out.println(\"\
  A\");\n    }\n}\nclass B extends A {\n    B() {\n        super();\n        System.out.println(\"\
  B\");\n    }\n}\nclass C extends B {\n    C() {\n        super();\n        System.out.println(\"\
  C\");\n    }\n}\npublic class ConstructorChaining {\n    public static void main(String[]\
  \ args) {\n        C c = new C();\n    }\n}\n```\n\n一旦编译并运行，它的输出将是：\nA\nB\nC\n\n\
  这段代码的输出与之前相同。注意第 5、13 和 21 行。`super()` 关键字被插入到了每个构造函数的第一行。根据规则，如果构造函数没有调用 `this()`\
  \ 或 `super()`，Java 会在构造函数的第一行添加一个默认的 `super()` 调用，正如你在第 5、13 和 21 行所示。`super()`\
  \ 的调用允许当前构造函数调用父类的构造函数。这就是“构造函数链”术语的由来。至于之前的更改呢？如果一个类没有继承任何父类，它会自动继承 `Object` 类，它是所有类类的根。\n\
  \n### 4. 构造函数重载\n\n在第 2 章中，我们讨论了构造函数。我们说构造函数是类似于方法的结构，并且像方法一样，构造函数也可以被重载。这里有一个演示构造函数重载的示例代码：\n\
  \n```java\npublic class Employee {\n    private String name;\n    private MyDate\
  \ birthDate;\n    private double salary;\n    private static final double BASE_SALARY\
  \ = 15000.00;\n\n    // 构造函数\n    Employee(String name, double salary, MyDate DoB)\
  \ {\n        this.name = name;\n        this.salary = salary;\n        this.birthDate\
  \ = DoB;\n    }\n\n    public Employee(String name, double salary) {\n        this(name,\
  \ salary, null);\n    }\n\n    public Employee(String name, MyDate DoB) {\n    \
  \    this(name, BASE_SALARY, DoB);\n    }\n\n    public String getDetails() {\n\
  \        return \"Name: \" + name + \"\\nSalary: \" + salary + \"\\nBirth Date:\
  \ \" + birthDate;\n    }\n}\n```\n\n对于所有构造函数，使用 `this()` 或 `super()` 是可选的。`this()`\
  \ 调用实际上是对同类构造函数或同一类内构造函数的调用，而 `super()` 调用则是对父类构造函数的调用。\n\n\n\n\n对于所有构造函数，使用 `this()`\
  \ 或 `super()` 是可选的。`this()` 的调用实际上是对同类中另一个构造函数或同类构造函数的调用，而 `super()` 的调用是对父类构造函数的调用。\n\
  \n如果使用了 `this()` 调用或 `super()` 调用，它们必须被放置在构造函数的第一行。将它们放在其他地方会导致编译错误。但如果这两者都没有使用，则会在构造函数的第一行放置一个默认的\
  \ `super()` 调用。\n\n这里是 `Manager` 类，它演示了对 `super()` 的调用。\n\n```java\n// Manager.java\n\
  public class Manager extends Employee {\n    private String dept;\n\n    public\
  \ Manager(String name, double salary, String dept) {\n        super(name, salary);\n\
  \        this.dept = dept;\n    }\n    /* 此代码将失败。\n       将有一个默认的 super() 调用 */\n\
  \    public Manager(String dept) {\n        this.dept = dept;\n    } \n    // 额外的\
  \ Manager 代码...\n}\n```\n\n在 `Manager` 类的第 7 行，对 `super()` 的调用将 `name` 和 `salary`\
  \ 值传递给 `Employee` 类中的构造函数。这将允许你复用 `Employee` 类中的一个构造函数，从而消除了代码中出现冗的可能性。\n\n至于 `Manager`\
  \ 类的第 12 行，它会导致一个错误，因为构造函数的第一行没有对 `this()` 或 `super()` 的调用，因此 Java 会在构造函数的第一行放置一个\
  \ `super()` 调用，告诉它在其父类（在本例中为 `Employee` 类）中寻找一个没有任何参数的构造函数来运行。\n\n## 3.13 Object\
  \ 类\n\n`Object` 类所有类的根。无论它是 API 中预写的类还是用户定义的类，所有的类都是 `Object` 类的子类。\n\n正因为这些特性，`Object`\
  \ 类中的所有方法都由所有类隐式继承，因此没有需要使用 \"extends Object\"。方法如 `equals()`、`hashCode()` 和 `toString()`\
  \ 方法。\n\n考虑 `Person` 类。\n\n```java\n// Person.java\npublic class Person extends\
  \ Object {\n    private String name;\n    private int age;\n\n    public Person(String\
  \ name, int age) {\n        this.name = name;\n        this.age = age;\n    }\n\
  \    // getters\n    public String getName() {\n        return name;\n    }\n  \
  \  public int getAge() {\n        return age;\n    }\n}\n```\n\n由于 `Person` 类是一个用户定义的类，因此仍然没有\
  \ `equals()`、`hashCode()` 和 `toString()` 方法的用户定义实现。这些方法的当前实现是继承自 `Object` 类的。\n\n\
  在 Java 中，使用 `==` 运算符和 `.equals()` 方法比较对象可能会产生不同的结果。默认情况下，它们的行为是相同的。`equals()` 方法继承自\
  \ `Object` 类，并根据 `==` 操作进行比较。`==` 运算符检查两个对象引用是否指向同一个内存位置，而 `.equals()` 方法通常用于比较对象的内容或逻辑上的相等性。在创建用户定义的类时，通常通常会重写\
  \ `equals()` 方法。\n\n在 Java 中，使用 `==` 运算符和 `.equals()` 方法比较对象可能会产生不同的结果。`==` 运算符检查两个对象引用是否指向同一个内存位置，而\
  \ `.equals()` 方法通常用于比较对象的内容或逻辑上的相等性。以下代码通过创建两个具有相同属性的 `Person` 对象并使用两种方法比较它们来演示这一概念。\n\
  \n考虑下面给定的代码，它创建了两个 `Person` 对象 `p1` 和 `p2`，并使用两种方法对它们进行比较。\n\n```java\nPerson p1\
  \ = new Person(\"Lawrence\", 30);\nPerson p2 = new Person(\"Lawrence\", 30);\nSystem.out.println(p1\
  \ == p2);\nSystem.out.println(p1.equals(p2));\n```\n\n\n\n\n```java\n13    System.out.println(p2.hashCode());\n\
  15    System.out.println(p1);\n16    System.out.println(p2.toString());\n```\n\n\
  如果我们编译并运行这段代码，我们将会得到以下输出：\n```\nfalse\ntrue\n2314851\n2314851\nLawrence, at age\
  \ 30\nLawrence, at age 30\n```\n\n输出的前两行：\n```\nfalse\ntrue\n```\n\n根据 `Person.java`\
  \ 中 `equals()` 方法的实现，这些是 `TestPerson.java` 代码第 9 行和第 10 行的输出。\n\n```java\n9    \
  \ System.out.println(p1 == p2);\n10    System.out.println(p1.equals(p2));\n```\n\
  \n由于 `Person` 类中 `hashCode()` 的实现，`p1` 和 `p2` 的 `hashCode()` 值现在是相同的。\n\n至于 `toString()`\
  \ 方法，如果你希望你的对象使用你偏好的格式打印，可以重写 `Object` 类的 `toString()` 方法。\n\n![](img/note.jpg)\
  \ 章节总结\n\n## 章节总结\n\n- 讨论了`继承`，它是面向对象编程（OOP）的基支柱之一。这促进了代码的重用。\n- `Classes`、`superclasses`\
  \ 和 `subclasses` 是在讨论继承概念时应该了解的重要概念。在其他 OOP 中，可以使用某些术语来代替，例如父类和子类。但在 Java 中，我们使用\
  \ `superclass` 和 `subclass` 术语。\n- “is-a”关系是软件工程中使用的另一个术语。在某些情况下，我们使用“...的子类”或“派生自”术语。\n\
  - `Java` 在其他面向对象编程语言中是独特的，因为它使用了单继承的概念。然而，我们将在第 5 章“其他类特性”中讨论如何在 Java 中使用多重继承的想法。\n\
  - 在第二章中，我们引入了 `public` 和 `private` 访问修饰符来解释封装的概念，在本章中，我们讨论了所有的四个访问修饰符。\n- Java 中的方法重写发生在子类提供其父类中已定义的方法的特定实现时。这允许子类在保持相同方法签名的同时，自定义或完全替换该方法的行为。本章讨论了五条方法重写规则。\n\
  - `super` 关键字用于子类内部，以引用其直接父类。它可以被用于调用父类的构造函数、访问父类方法或访问父类字段，从而允许子类继承并利用其父类的功能。\n\
  - 方法重载（在其他资源中有时称为方法重载）允许一个类拥有多个同名但参数不同的方法。通过允许根据传递的参数的数量或类型以不同的方式调用方法，提供了灵活性，提高了了同一类内代码的可读性和可重用性。我们在本章中还讨论了方法重载的规则。\n\
  - 在 Java 中，继承和构造函数之间密切相关，但有不同的角色。当子类被实例化时，它的构造函数会隐式或显式地调用其父类的构造函数，以确保被继承字段的正确初始化。这通常使用\
  \ `super` 关键字完成，如果用于调用父类构造函数，则它必须是子类构造函数的第一条语句。我们在本章中还查看了 `super()` 的用法和 `this()`\
  \ 的用法。\n- Java 中的构造函数重载允许类拥有多个具有不同参数列表的构造函数。这为创建具有各种初始状态的对象提供了灵活性，因为每个构造函数都可以根据对象创建期间传递的参数执行不同的初始化任务。\n\
  - 还讨论了作为所有类根的 `Object` 类。还建议在你创建自己的类时，最好在你自己的用户定义类中重写 `toString()`、`equals()` 和\
  \ `hashCode()` 方法。\n\n![](img/Quiz_Icon.jpg) 多选题\n\n### 多选题\n\n1. 关于构造函数，以下哪项是**不正确**的？\n\
