  \ `ISBN`。\n\n## 任务 2：简单登录应用\n\n#### 任务概述：\n创建一个 Java 程序，从名为 `userList.txt` 的文件读取用户凭据。文件名应通过命令行传递。文件包含用户名和密码。奇数行是用户名，偶数行是密码。使用\
  \ `HashMap` 访问用户名和密码。\n\n#### `userList.txt` 示例：\n| 1 | user1 |\n| 2 | password1\
  \ |\n| 3 | user2 |\n| 4 | password2 |\n| 5 | user3 |\n| 6 | password3 |\n\n####\
  \ 要求：\n- 从 `userList.txt` 读取条目。\n- 将它们存储在 `HashMap` 中。\n- 提示用户输入用户名和密码。\n\n####\
  \ 示例运行 1：\n```\njava Login userList.txt\nEnter username: user1\nEnter password:\
  \ password1\nAccess Granted\n```\n\n#### 示例运行 2：\n```\njava Login userList.txt\n\
  Enter username: someValue\nEnter password: somePassword\nAccess Denied\n```\n\n\n\
  \n随着 Java 的演进，引入了被称为 `Swing` 的第二代用户界面工具包，提供了更高级的功能和灵活性。除了 `AWT` 和 `Swing`，Java 现在还提供了\
  \ `JavaFX`，这是另一个用于创建丰富用户界强大工具包。然而，对于本文讨论，我们将关注 `AWT`。\n\n首先，让我们回顾一个基本概念：在 Java 中，`Object`\
  \ 类是所有类层次结构的根。`Object` 的子类之一是 `Component` 类，它代表用户界面中可以交互的任何视觉元素。组件的示例包括按钮、标签、复选框、选择框、列表框甚至容器。\n\
  \n## 图 9.1 AWT 类层次结构\n\n![image](img/fig9-1.jpg)\n\n`图 9.1` 展示了 Java 抽象窗口工具包 (`AWT`)\
  \ 的类层次结构。层次结构的顶端是 `Object` 类，所有的 `AWT` 组件都继承自它。`Component` 类作为所有图形 UI 元素的根，例如 `Button`、`Label`、`Checkbox`、`Choice`\
  \ 和 `List`。这些都是单独的用户界面组件。\n\n`Container` 类也继承自 `Component`，它可以包含其他组件和容器，这对于创建复杂的\
  \ UI 布局至关重要。`Container` 分为两种主要类型：\n\n*   基于窗口的容器，例如 `Frame` 和 `Dialog`，它们是独立的容器，不需要嵌入到另一个\
  \ UI 组件中。\n*   基于面板的容器，例如 `Panel` 和 `Applet`，它们是依赖容器，必须添加到窗口或另一个容器中才能显示。\n\n该层次结构展示了\
  \ `AWT` 如何组织可重用和可扩展的 UI 组件，用于在 Java 中构建图形用户界面。\n\n在其中，`Container` 类格为重要，因为它允许你在内部持有并组织其他组件。例如，你可以将一个按钮放在容器内部。`Container`\
  \ 类的两个常用子类是 `Window` 和 `Panel`。\n\n`Window` 是一种可以独立存在的容器类型。一旦创建了窗口，它就可以独立运行，不需要任何其他容器。相反，`Panel`\
  \ 也是一种容器，但不能独立存在。它必须放置在另一个容器（如窗口或 applet）内部才能正常工作。\n\n例如，你可以创建一个 `Frame`（窗口的一种类型）并单独启动它。然而，如果你创建一个\
  \ `Panel`，它将不会独立运行。相反，它需要被添加到帧或另一个容器中。\n\n`AWT` 中的每个容器都带有一个默认布局管理器，用于控制其内部组件的排列方式。\n\
  \n同样值得注意的是，在 Java 1.1 中引入的 `Applet` 类仅支持到 Java 8。从 Java 9 开始，`Applet` 类被弃用，并且到 Java\
  \ 17，它们已被完全移除。\n\n现在，让我们仔细观察一下 `AWT` 包。它包含了许多你在构建 GUI 时经常会用到的接口和类。例如，`Button` 类允许你创建可点击的按钮，而\
  \ `Checkbox` 类允许你创建可选择的复选框。如前所述，`Frame` 类用于创建可以独立的窗口组件。通过有效理解和利用这些组件及容器，你将能够在 Java\
  \ 中创建功能齐全且用户友好的图形界面。\n\n## 9.2 构建 GUI 应用时需要考虑的事项\n\n在探索了 `java.awt` 包后（该包包含了构建 Java\
  \ 图形用户界面 (GUI) 应用的关键类），让我们来探索这三个大类：组件、容器和布局管理器。\n\n1. **组件 (Components)** 是你应用程序的视觉元素，如按钮、帧、对话框、文本区域和文本字段。这些是用户直接交互的应用程序部分。\n\
  2. **容器 (Containers)** 是一种特殊的组件。与其他组件一样，它们是视觉元素，但它们的主要目的是在内部持有并组织其他组件。容器的示例包括帧和面板。\n\
  3. **布局管理器 (Layout managers)** 决定了组件在容器内的排列方式。它们控制容器内部组件的位置和大小，确保你的应用程序界面组织良好且易于使用。\n\
  \n### 9.2.1 Frame 类\n\n让我们深入研究 `Frame` 类，它是 Java 中创建图形用户界面 (GUI) 的基础部分。帧（Frame）是一个顶级窗口，包含边框和标题栏，使其成为可以包含其他\
  \ GUI 组件的容器。\n\n默认情况下，帧使用名为 `BorderLayout` 的布局管理器。但是，你可以轻松地更改此布局管理器以满足你的需求，稍后我们将探索如何这样做。帧是可以调整大小的，这意味着你可以通过窗口的角来调整其尺寸。\n\
