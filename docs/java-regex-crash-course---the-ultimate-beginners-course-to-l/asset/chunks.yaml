    \nStart index-->0End index-->1\n\nStart index-->2End index-->3\n\nStart index-->3End\
    \ index-->4\n\n-----------------------------------------------\n\n## Special Constructs\n\
    \n| Constructs | Explanation |\n\n| (?<name>X) | X, as a named-capturing group\
    \ |\n\n| (?:X) | X, as a non-capturing group |\n\n| (?idmsuxU-idmsuxU) | Nothing,\
    \ but turns match flags i d m s u x U on – off |\n\n| (?idmsux-idmsux:X) | X,\
    \ as a non-capturing group with the given flags i d m s u x on – off |\n\n| (?=X)\
    \ | X, via zero-width positive lookahead |\n\n| (?!X) | X, via zero-width negative\
    \ lookahead |\n\n| (?<=X>) | X, via zero-width positive lookbehind |\n\n| (?<!X)\
    \ | X, via zero-width negative lookbehind |\n\n| (?>X) | X, as an independent,\
    \ non-capturing group |\n\n## Regex Samples\n\n### Basic Expressions\n\nIn java\
    \ every string is a regular expression. Let us consider for example, the string,\
    \ “I have a car”, is a regex that will match the text, “I have a car”, and will\
    \ not listen to everything else.\n\nWhat if we want to be able to let others know\
    \ more things we have? We can change the word car with a character class expression\
    \ that will match any character.\n\n\"I have a \\\\w+\"\n\nYou can notice; in\
    \ this pattern both a character class and a quantifier are used. “\\w” says match\
    \ a word character, and “+” says match one or more. So when linked, the pattern\
    \ says “match one or more word characters.” Now the pattern will equate any word\
    \ in place of car\" E.g. “I have a book” or “I have a dress”.\n\nBut if we need\
    \ to verify “I have a: boat”,it will not match because of the \":\" symbol, which\
    \ is not a word character. If we want the expression to be able to handle this\
    \ situation, then we need to make a small change.\n\n\"I have a:? \\\\w+\"\n\n\
    Now the expression will let an optional \":\" directly then the word ‘a’.\n\n\
    ### Grouping\n\nGrouping is an important matter of regex. It is the aptitude to\
    \ assembly sections of a pattern, and provide different matches.\n\nThe following\
    \ metacharacters are important parts of regex.\n\n|                 Alternation\
    \ (‘or’ statement)\n\n()                Grouping\n\nFor instance, in the first\
    \ example we had a car. What if we know the list of objects we require to inform\
    \ the world and nothing else? Let´s use a group (), with an ‘or’ meta-character\
    \ in order to set a list of expressions to permit in our match.\n\n\"I have a:?\
    \ (car|book|dress|pen)\"\n\nThe new expression will now equal the starting point\
    \ of the string “I have a”, an optional \":\", and then any one of the expressions\
    \ in the group, separated by alternators, \"|\"; any one of the following: ‘car,\
    \ ‘book’, ‘dress’, or ‘pen’ would be a match.\n\n\"I have a car\"             \
    \               matches\n\n\"I have a books\"              matches the ‘s’ is\
    \ not needed, is ignored\n\n\"I have a: car\"                            matches\n\
    \n\"I have a- car\"                            doesn’t match              ‘-‘\
    \ is not allowed in our pattern\n\n\"I have a: bo\"                           \
    \ doesn’t match              all of ‘book’ is needed\n\nExample\n\npackage com.sample.regexsample;\n\
    \nimport java.util.regex.Pattern;\n\nimport java.util.regex.Matcher;\n\npublic\
    \  class DemoForGrouping {\n\n public  static  void main(String[] args) {\n\n\
    String text    =\n\n \"John writes about this, and John writes about that,\" +\n\
    \n \" and John writes about everything. \"\n\n                              ;\n\
    \n String patternString1 = \"(John)\"; Find the group John\n\nPattern pattern\
    \ = Pattern.compile(patternString1);\n\nMatcher matcher = pattern.matcher(text);\n\
    \n while(matcher.find()) {\n\n                          System.out.println(\"\
    found: \" + matcher.group(1));\n\n                      }\n\n                 \
    \ }\n\n}\n\nOutput\n\nfound: John\n\nfound: John\n\nfound: John\n\n### Matching/Validating\n\
    \nUsing Regex it is possible to find all instances of text that match a certain\
    \ pattern, and return a Boolean value if the pattern is found/not found.\n\nExample:\n\
    \npackage com.sample.regexsample;\n\nimport java.util.ArrayList;\n\nimport java.util.List;\n\
    \nimport java.util.regex.Matcher;\n\nimport java.util.regex.Pattern;\n\npublic\
    \  class ValidateSSN {\n\n public  static  void main(String[] args) {\n\nList<String>\
    \ input = new ArrayList<String>();\n\n input.add(\"123-45-6789\");\n\n input.add(\"\
    9876-5-4321\");\n\n input.add(\"987-65-4321 (attack)\");\n\n input.add(\"987-65-4321\
    \ \");\n\n input.add(\"192-83-7465\");\n\nString patternString= \"^(\\\\d{3}-?\\\
    \\d{2}-?\\\\d{4})$\";\n\n for (String ssn : input) {\n\n if (ssn.matches(\"^(\\\
    \\d{3}-?\\\\d{2}-?\\\\d{4})$\")) {\n\n                                         \
    \                             System.out.println(\"Found good SSN: \" + ssn);\n\
    \n                                                        }\n\n } This is the\
    \ match’s method of the string class. It can be used for simple validations\n\n\
    \ Pattern pattern = Pattern.compile(patternString);\n\n for (String ssn : input)\
    \ {\n\nMatcher m = pattern.matcher(ssn);\n\n if (m.matches()) {\n\n             \
    \                                                         System.out.println(\"\
    Found good SSN: \" + ssn);\n\n                                                       \
    \ }\n\n } This is the code using the Pattern and Matcher methods of the regex\
    \ class .\n\n                            }\n\n}\n\nOutput:\n\nFound good SSN:\
    \ 123-45-6789\n\nFound good SSN: 192-83-7465\n\nExplanation of the pattern used\
    \ in the sample:\n\n\"^(\\\\d{3}-?\\\\d{2}-?\\\\d{4})$\"\n\n^                           \
    \ equal the beginning of the line\n\n()                             group everything\
    \ within the parenthesis as group 1"
