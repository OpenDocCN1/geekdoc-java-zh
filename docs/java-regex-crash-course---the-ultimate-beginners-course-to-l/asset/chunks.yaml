  trans: "\nPython 的伟大之处在于它拥有庞大的网络爬虫库，并因其网页抓取能力而被广泛使用。网络爬虫简单来说就是一个根据其设定的参数在网络上进行导航，并抓取你希望它抓取内容的程序。\n\
    \n而言之，无论你是编程初学者还是其他语言的资深人士，Python 都非常上手。它是一门快速、友好且易于学习的语言，但不要因此误以为它不那么强大。\n\n\
    # 第 2 章\n\n## Python 的安装\n\n为了在机器上安装 Python，你必须下载以下内容：\n\n1. Python 解释器\n2. Python\
