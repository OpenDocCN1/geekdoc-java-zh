    \nMatcher m7 = p7.matcher(text6);\n\nMatcher m8 = p8.matcher(text7);\n\n while(m1.find())\n\
    \n                            {\n\n                                          System.out.println(\"\
    Start index-->\"+m1.start()+\"End index-->\"+m1.end());\n\n                           \
