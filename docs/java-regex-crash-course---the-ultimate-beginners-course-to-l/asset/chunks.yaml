    \ 团队\n\n# 第 1 章：我们的 Java 正则表达式第一步\n\n## 什么是正则表达式？\n\n在当今世界，几乎所有的应用程序都需要处理文本用于搜索和验证。这个过程通常涉及复杂的逻辑，并可能导致许多复杂且混乱的代码，非常难以理解。\n\
    \n正则表达式或 `REGEX` 被解释为特定的文本模式，可以用于许多高级应用程序，并适用于任何编程语言。它们被用于搜索、编辑和处理数据。\n\n例如，使用正则表达式我们可以验证特定的输入字符串是否匹配给定的文本模式，或者从大量字符中找到一组字符。它们还用于替换和重排文本块，或将大块数据分成较小的子集。正则表达式通常不是特定语言的，在大多数编程语言中遵循类似的模式，但会有细微差异。\n\
    \n正则表达式是强大的工具，可以减少处理时间。通过熟练地使用它们，我们可以完成原本无法实现的任务。\n\n示例：\n假设我们需要验证以下电子邮件。\n\n\
    ```java\nemailid = \"xyz@abc.com\"\n```\n\n验证所需的步骤：\n1. 必须有一个 `@` 符号。\n2. `@`\
    \ 之前的文本必须只包含字符、数字、下划线和连字符。\n3. 电子邮件中不有两个 `@` 符号。\n4. 在 `@` 符号之后的域名中应该有一个 `.`。\n\
    5. 它应该以 2 或 3 个字符结束。\n\n如果你需要在不使用正则表达式的情况下验证上面的电子邮件，程序将需要数百行代码。\n\n```java\npackage\
    \ com.sample.regexsample;\n\npublic class Validte {\n    public static void main(String[]\
    \ args) {\n        String str1 = \"myname@abc.com\";\n        int x = str1.indexOf(\"\
    @\"); // 返回子字符串第一个字符的索引\n        System.out.println(\"index = \" + x);\n    }\n\
    }\n```\n\n输出：\n`Index = 6.`\n\n一旦获取索引，还需要进一步的计算来确定域名中是否有一个或多个字符，后面跟着 `.` 符号。这就是正则表达式发挥重要作用的地方。我们可以使用正则表达式模式仅一行代码即可完成它。\n\
    \n```java\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\
    import java.util.regex.Pattern;\n\npublic class EmailValidator {\n    public static\
    \ void main(String[] args) {\n        String input = \"^[_A-Za-z0-9\\\\+]+([\\\
    \\.[A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\\\\.[A-Za-z0-9]+)*(\\\\.[A-Za-z]{2})$\";\n \
    \       String emailAddress =\"xyz@abc.com\";\n        Pattern p = Pattern.compile(input);\n\
    \        Matcher m = p.matcher(emailAddress);\n        System.out.println (\"\
    The email 1 matches:\" + m.matches());\n    }\n}\n```\n\n## 常见用途\n\n正则表达式广泛用于各种文本处理任务，更广泛用于字符串处理，其中数据不需要是文本。常见的应用包括数据验证、数据爬取、数据清洗、简单解析、语法高亮系统的生成以及许多其他任务。\n\
    \n"
- fmt: '

    While regular expressions would be useful on Internet search engines, processing
    them across the entire database could consume excessive computer resources depending
    on the complexity and design of the `regex`.


    Some important uses of regular expressions are:


    1. URL validation

    2. Email Validation

    3. Validation of numbers, characters and special characters

    4. Internet address

    5. Extracting information from text such as code, log files, spreadsheets, or
    documents.

    6. Search and replace Strings


    **Note:**


    - Keep in mind, when using regular expression everything is essentially a character,
    and we are writing patterns to match a specific sequence of characters (also known
    as a string).

    - Generally patterns are provided in ASCII, which includes letters, digits, punctuation
    and other symbols on your keyboard like `%#$@!`.

    - Unicode characters are used to match any type of international text


    ## Understanding the Regex Engine


    One of the most important things to do is to take a look at How a Regex Engine
    Works Internally because knowing how the regex engine works will help us to craft
    better `regexes` more easily. It will also help in understanding quickly why a
    particular `regex` does work in the way it was initially expected to do so. This
    will also save lots of guesswork and head scratching when we need to write more
    complex `regexes`.


    There are two kinds of regular expression engines:


    1. text-directed engines

    2. Regex-directed engines.


    Mostly all the `regex` flavors available are based on regex-directed engines.
    This is because certain very useful features, such as lazy quantifiers and back
    references, can only be implemented in regex-directed engines.


    You can easily find out whether the `regex` flavor you intend to use has a text-directed
    or regex-directed engine. If back references and/or lazy quantifiers are available,
    you can be certain the engine is regex-directed.


    You can do the test by applying the `regex` `text|text not` to the string `text
    not`. If the resulting match is only `text`, the engine is regex-directed. If
    the result is `text not`, then it is text-directed. The reason behind this is
    that the regex-directed engine is an early starter.


    Before looking into the examples provided, understanding how the regex engine
    works will enable you to use its full power and help you avoid common mistakes.


    ### The Regex-Directed Engine Always Returns the Leftmost Match


    There are some important points to be noted when working with engines:


    - A regex-directed engine will always return the leftmost match, even if a more
    suitable match could be found later.

    - When applying a `regex` to a string, the engine will start at the first character
    of the string. It will try all possible variations of the regular expression at
    the first character. Only if all possibilities have been tried and found to fail,
    will the engine continue with the second character in the text. Otherwise it will
    stop there.

    - Again, it will try all possible variations of the `regex`, in exactly the same
    order till it finds a match.

    - The result is that the regex-directed engine will return the leftmost match.

    - Let us consider the example, searching `book` to `He bought a bookshelf for
    his book.` The engine will try to match the first token in the `regex` `b` to
    the first character in the match `H`. This fails. There are no other possible
    permutations of this `regex`, because it merely consists of a sequence of literal
    characters. So the regex engine tries to match the `b` with the `e`. This fails
    too, as does matching the `b` with the space. Arriving at the 4th character in
    the match, `b` matches `b`. The engine will then try to match the second token
    `o` to the 5th character, `o`. This succeeds too. But then, `o` fails to match
    `u`. At that point, the engine knows the regex cannot be matched starting at the
    4th character in the match. So it will continue with the 5th: `a`. Again, `b`
    fails to match here and the engine carries on. At the 30th character in the match,
    `b` again matches `b`.

    - The engine then proceeds to attempt to match the remainder of the `regex` at
    character 30th and finds that `o` matches `o`, again `o` matches `o` and `k` matches
    `k`. The complete `regex` could be matched starting at character 30. The engine
    is an early starter to report a match. It will therefore report the first three
    letters of catfish as a valid match. The engine never proceeds beyond this point
    to see if there are any “better” matches. In this first example of the engine’s
    internals, our regex engine simply appears to work like a regular text search
    routine.


    A text-directed engine would have returned the same result too. However, it is
    important that you can follow the steps the engine takes in your mind. In following
    examples, the way the engine works will have a profound impact on the matches
    it will find. Some of the results may be surprising. But they are always logical
    and predetermined, once you know how the engine works.


    ## Algorithms Used in Regex


    When using `regex`, there are at least three different algorithms that decide
    whether and how a given regular expression matches a string.


    ### Converting NFA to DFA


    This is the first and quickest method. It is based on a result in formal language
    theory that permits every nondeterministic finite automaton (NFA) to become into
    a deterministic finite automaton (DFA). The `DFA` can be explicitly constructed
    then run on the resulting input string one by one symbol at a time.


    ### Simulating NFA Directly (DFA/NFA Algorithm)


    The next method is to simulate the `NFA` directly, constructing each `DFA` state
    on demand and then discarding it at the next execution step. This method keeps
    the `DFA` implicit and avoids increase of the construction cost exponentially,
    but has overhead of rising the running cost to `O(m n)`. The explicit an implicit
    approaches are called the `DFA` algorithm and the `NFA` algorithm respectively.


    ### Backtracking


    The third and final algorithm is to match the pattern against the input string
    by backtracking. This algorithm is usually called as `NFA`, but this terminology
    can be confusing a times. This is used simple implementations which exhibit when
    matching against expressions `(a|aa)*b` that contain both alternation and unbounded
    quantification. This kind of processing can force the algorithm to consider an
    exponentially increasing number of sub-cases. This might also lead to security
    problems called Regular expression Denial of Service.


    # Chapter 2 Basic Characters Used in Regex


    ## Common Regex Syntaxes


    A regular expression is in the bottom a string patterns that represents text.
    These descriptions can be applied in several ways. The basic language constructs
    embrace character classes, quantifiers, and meta-characters. The below section
    explains the various options we can use to define regular expression.


    ### 1.1 String Literals


    String literals are used to search a particular match in the text. For example,
    if we are going to search for a text `test` then we can simply write the code
    like this: Here text and regex both are same.


    ```

    Pattern.matches("test", "test")

    ```


    ### 1.2 Character Classes


    A character class is used to match a single character in the input text against
    multiple allowed characters in the character class. a character class has no relation
    with a class construct or class files in Java.


    Examples:


    1. `[Tt]est` would match all the occurrences of String `test` with either lower
    case or upper case `T`.

    2. `"WEB@JDOJO.COM"` matches the pattern `[ABC]@`, because `@` is preceded by
    `B`.

    3. The string `"A@BAND@YEA@U"` matches the pattern `[ABC]@.` twice even though
    the string contains three `@` signs.

    4. The second `@` is not a part of any match, because it is preceded by `D` and
    not `A, B, or C`.


