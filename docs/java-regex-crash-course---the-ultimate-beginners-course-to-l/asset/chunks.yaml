    \ Python 的目录。\n\n一旦完成 PyCharm 和 Python 3.4 `IDLE` 的安装，进入 `File`（文件）`New Project`（新建项目）。你将看到此屏幕：\n\
    \n![`puu.sh/hTwox/5ba1669ce6.png`](img/00010.jpeg)\n\n你可以将 `Location`字段中的“untitled”部分重命名为特定的项目名称。然后点击“Create”（创建）按钮，你将进入一个空项目。我们必须做的下一件事是创建一个新的\
    \ Python 文件，你可以通过以下路径实现：\n\n`File`（文件）`New`（新建）`Python File`（Python 文件）\n\n\
    相应设置你的 Python 文件名，它将显示在项目资源管理器（Project Explorer）中的项目名称下。现在双击文件，你将进入一个可以开始编写 Python\
    \ 代码的页面。\n\n它看起来应该是这样的：\n\n![`puu.sh/hTwx1/74b6154739.png`](img/00011.jpeg)\n\n\
    你已成功安装了 Python！\n\n# 第 3 章\n\n## Python 语言结构\n\n我们将通过以下示例代码作为示例，学习 Python 作为一种编程语言的结构：\n\
    \n```python\nimport math\n\nclass Program:\n    def Execute(self):\n        x\
    \ = math.sqrt(25)\n        print(x)\n\nrun = Program()\nrun.Execute()\n```\n\n\
    输出：\n\n![`puu.sh/hTy3s/931081aeed.png`](img/00012.jpeg)\n\n为了实际执行代码，你必须使用快捷键 `alt\
    \ + shift + f10`，或者使用 `PyCharm` 主导航栏中的 `Run`（运行）菜单项执行。\n\n第一行 `import math` 使用了一个特殊的关键字\
    \ `import`，它允许程序员从 Python 库中导入在编码时默认不包含的工具。在关键字 `import` 之后——程序员指定了 Python 库中的某个特定目录。在本例中，我们指定了\
    \ `math` 目录；如果我们想专门指定 `System` 目录中的内容，我们将添加一个点分隔符（period），然后添加子目录名称。如果库的文件夹更加复杂，你必须使用如下符号：\n\
