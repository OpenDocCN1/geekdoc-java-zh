    bad SSN: 987-65-4321 \nFound good SSN: 192-83-7465\nbad SSN: 666-83-7465\nbad\
    \ SSN: 999-83-7465\nbad SSN: 000-83-7465\n\n## Validating Range\n\n### Pattern\n\
    `^(\\d?[1-9]|[1-9]0)$`\n\n### Explanation\n- `^` : Start of the String\n- `(\\\
    d?[1-9]|[1-9]0)` : Should contain a digit that contain 1 to 9, 01 to 09, 11 to\
    \ 19, 21 to 29, ..., 91 to 99 or 10, 20, ..., 90\n- `$` : End of String\n\n###\
    \ Sample Code:\n```java\npackage com.sample.regexsample;\nimport java.util.ArrayList;\n\
    import java.util.List;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
