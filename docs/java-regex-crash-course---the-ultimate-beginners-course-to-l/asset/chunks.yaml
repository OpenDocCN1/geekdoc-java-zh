    `(` 组 #2 开始\n`0?[1-9]` # 01-09 或 1-9\n`|` # 或\n`1[012]` # 10, 11, 12\n`)` 组 #2\
    \ 结束\n`/` # 跟着一个 \"/\"\n`(` 组 #3 开始\n`(19|20)\\\\d\\\\d` # 19[0-9] 或 20[0-9]\n\
    `)` 组 #3 结束\n\n上面的正则用于验证日期格式“dd/mm/yyyy”，通常你可以根据需要对此正则表达式进行调整。无论如何，验证闰年、某月份有 30\
    \ 天还是 31 天会有点复杂，让我们看看如何做到。\n\n### 示例代码：\n\n```java\npackage com.sample.regexsample;\n\
