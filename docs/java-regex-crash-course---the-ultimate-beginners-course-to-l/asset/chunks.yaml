    \ guilty character.\n\n# Chapter 4\n\n# Regex for Username\n\nThis syntax explains\
    \ how regular expression can be used for validating a user name. This is the common\
    \ pattern used across various websites and applications.\n\n### Syntax\n```\n\
    ^[a-z0-9_-]{3,15}$\n```\n\n### Explanation:\n- `^`: Start of the line\n- `[a-z0-9_-]`:\
    \ characters in the list, `a-z`, `0-9`, underscore, hyphen\n- `{3,15}`: Length\
    \ at least 3 characters and maximum length of 15\n- `$`: End of the line\n\nThe\
    \ whole combination means 3 to 15 characters with any lower case, digit or special\
    \ symbol `_-` only. In case we need to add upper case `A-Z`. Also if we need to\
    \ increase max character, change 15 to the value.\n\n### Sample Code for Name:\n\
    ```java\npackage com.sample.regex;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
    public class UserNameValidator {\n    static void main(String[] args) {\n    \
    \    String input = \"^a-z0-9_-]{3,15}$\";\n        String userName =\"Karen_3\"\
    ;\n        String userName1=\"MyName\";\n        Pattern p = Pattern.compile(input);\n\
    \        Matcher m = p.matcher(userName);\n        Matcher m2 = p.matcher(userName1);\n\
    \        System.out.println (\"The user name 1:\"+ m.matches());\n        System.out.println\
    \ (\"The user name 2:\"+ m2.matches());\n    }\n}\n```\nOutput:\nThe user name\
    \ 1 matches:true\nThe user name 2 matches:false\n\n## Quiz\nWrite class and test\
    \ case for validating the following user names. Use a string array or ArrayList\
    \ to pass the entire set of values:\n1. `myname34`\n2. `myname_2015`\n3. `myname-2015`\n\
