    );\n```\n\n## 特殊构造\n\n| 构造 | 解释 |\n| :--- | :--- |\n| `(?<name>X)` | `X`，作为命名捕获组\
    \ |\n| `(?:X)` | `X`，作为非捕获组 |\n| `(?flags)` | 无，但用于开启或关闭标记 |\n| `(?flags:X)` |\
    \ `X`，作为带有给定标记的非捕获组 |\n| `(?=X)` | `X`，通过零宽正向断言 |\n| `(?!X)` | `X`，通过零宽负向断言 |\n\
    | `(?<=X)` | `X`，通过零宽正向后逆推 |\n| `(?<!X)` | `X`，通过零宽负向后逆推 |\n| `(?>X)` | `X`，作为独立的非捕获组\
    \ |\n\n## 正则示例\n\n### 表达式\n\n在 Java 中，每个字符串都是正则表达式。例如，字符串 \"I have a car\" 是一个正则，它会匹配文本\
    \ \"I have a car\"，而忽略其他所有内容。\n\n如果我们想让别人知道更多我们拥有的东西怎么办？我们可以将单词 `car` 替换为字符类表达式，它可以匹配任何字符：`I\
    \ have a \\w+`。\n\n你会注意到，在这个模式中同时使用了字符类和量量符。`\\w` 表示匹配一个单词字符，而 `+` 表示匹配一个或多个。结合在一起时，该模式的意思是“匹配一个或多个单词字符”。现在，该模式将匹配替代\
    \ `car` 的任何单词，例如 \"I have a book\" 或 \"I have a dress\"。\n\n但如果我们需要验证 \"I have\
    \ a: boat\"，它将无法匹配，因为存在 `:` 符号，而它不是一个单词字符。如果我们想让表达式能够处理这种情况，那么我们需要做一个微小的更改：`I\
    \ have a:?\\w+`。\n\n现在，该表达式将允许一个可选的 `:`，紧接着是单词 'a'。\n\n### 分组\n\n分组是正则表达式中的一个重要事项。它是将模式的部分组合起来并提供不同匹配的能力。以下元字符是正则表达式的重要部分：\n\
    \n| 分选择 (`or` 语句) | 分组 |\n| :--- | :--- |\n| `\\|` | `()` |\n\n例如，在第一个例子中，我们有一辆车。如果我们知道需要告诉世界的对象列表且外无其他内容呢？让我们使用分组\
    \ `()` 配合 `|` 元字符来设置一个允许的表达式列表：`I have a:?(car\\|dress\\|pen)`。\n\n现在新表达式等于起点\
    \ \"I have a\"，一个可选的 \":\"，然后是由 `|` 分隔的表达式之一；`car`、`dress` 或 `pen` 中的任何一个都将匹配。\n\
    \n- `I have a car` 匹配\n- `I have books` 匹配（不需要 `s`，被忽略了）\n- `I have: car` 匹配\n\
    - `I have- car` 不匹配（模式中不允许出现 `-`）\n- `I have: bo` 不匹配（需要完整的 `book`）\n\n#### 示例\n\
    \n```java\npackage com.sample.regexsample;\nimport java.util.regex.Pattern;\n\
    import java.util.regex.Matcher;\n\npublic class DemoGrouping {\n    public static\
    \ void main(String[] args) {\n        String text = \"John writes about this,\
    \ and John writes about that, and John writes about everything.\";\n        String\
    \ patternString1 = \"(John)\";\n        Pattern pattern = Pattern.compile(patternString1);\n\
    \        Matcher matcher = pattern.matcher(text);\n        while(matcher.find())\
    \ {\n            System.out.println(\"found: \" + matcher.group(1));\n       \
    \ }\n    }\n}\n```\n**输出：**\nfound: John\nfound: John\nfound: John\n\n### 匹配/验证\n\
    \n使用正则表达式，可以找到匹配特定模式的文本实例，并在找到/未找到模式时返回一个布尔值。\n\n#### 示例：\n\n```java\npackage\
    \ com.sample.regexsample;\nimport java.util.ArrayList;\nimport java.util.List;\n\
    import java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class\
    \ ValidateSSN {\n    public static void main(String[] args) {\n        List<String>\
    \ input = new ArrayList<String>();\n        input.add(\"123-45-6789\");\n    \
    \    input.add(\"9876-5-4321\");\n        input.add(\"987-65-4321 (attack)\");\n\
    \        input.add(\"987-65-4321 \");\n        input.add(\"192-83-7465\");\n \
    \       String patternString = \"^(\\\\d{3}-?\\\\d{2}-?\\\\d{4})$\";\n       \
    \ Pattern pattern = Pattern.compile(patternString);\n        for (String ssn :\
    \ input) {\n            if (ssn.matches(\"^(\\\\d{3}-?\\\\d{2}-?\\\\d{4})$\"))\
    \ {\n                Matcher m = pattern.matcher(ssn);\n                if (m.find())\
    \ {\n                    System.out.println(\"Found good SSN: \" + ssn);\n   \
    \             }\n            }\n        }\n    }\n}\n```\n这是使用了正则类的 `Pattern`\
    \ 和 `Matcher` 方法的代码。\n\n**输出：**\nFound good SSN: 123-45-6789\nFound good SSN:\
    \ 192-83-7465\n\n示例中所使用的模式解释：\n`^(\\\\d{3}-?\\\\d{2}-?\\\\d{4})$`\n\n- `^` 等于行的开头\n\
    - `()` 将括号内的所有内容作为第 1 组\n- `$` 等于行的结尾\n\n"
