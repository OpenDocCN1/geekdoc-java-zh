    \ download the Python Interpreter, please use the following link:\n\n[https://www.python.org/downloads/](https://www.python.org/downloads/)\n\
    \nOnce you have reached this link, you will have to find this:\n\n![http://puu.sh/hTvWC/e539a9177f.png](images/00008.jpeg)\n\
    \nThen, click download and a file will be downloaded accordingly. Once you have\
    \ this file, execute it and follow the instructions on the wizard to install the\
    \ Python Interpreter.\n\nOnce the Python Interpreter has been installed, we can\
    \ move on to downloading `PyCharm`. In order to install `PyCharm`, please visit\
    \ the following link:\n\n[https://www.jetbrains.com/pycharm/download/](https://www.jetbrains.com/pycharm/download/)\n\
    \n![http://puu.sh/hTw3f/dd49e7ad1c.png](images/00009.jpeg)\n\nYou should now be\
    \ on this screen (or something similar) – click the “Download Community” button\
    \ and continue to download `PyCharm`. During this process, it will automatically\
    \ detect the Python 3.4 `IDLE` but in rare cases you might need to specify the\
    \ directory that you installed Python in.\n\nOnce you have completed the installation\
    \ of PyCharmand the Python 3.4 `IDLE`, go to `File` New Project`. You will reach\
    \ this screen:\n\n![http://puu.sh/hTwox/5ba1669ce6.png](images/00010.jpeg)\n\n\
    You can rename the “untitled” portion of the `Location` field to a specific project\
    \ name. Then click the “Create” button and you will end up being in an empty project.\
    \ The next thing we must do is create a new Python file which you can do by going\
    \ to:\n\n`File`New`Python File`\n\nSet the name of your python file accordingly\
    \ and it will show under your project name in the Project Explorer. Now double\
    \ click on the file and you will be met with a page where you can start coding\
    \ Python.\n\nThis is how it should look like:\n\n![http://puu.sh/hTwx1/74b6154739.png](images/00011.jpeg)\n\
    \nYou have successfully completed the installation of Python!\n\n# Chapter 3\n\
    \n## Python Language Structure\n\nUsing the sample code as an example, we will\
    \ learn how Python as a programming language is structured through the following\
    \ sample code:\n\n```python\nimport math\n\nclass Program:\n    def Execute(self):\n\
    \        x = math.sqrt(25)\n        print(x)\n\nrun = Program()\nrun.Execute()\n\
    ```\n\nOutput:\n\n![http://puu.sh/hTy3s/931081aeed.png](images/00012.jpeg)\n\n\
    In order to actually execute the code, you must use the shortcut `alt + shift\
    \ + f10` or execute it using the `Run` menu item in the main navigation bar in\
    \ `PyCharm`.\n\nThe first line `import math` is using a special keyword `import`\
    \ which allows the programmer to import tools from the Python library which aren’t\
    \ included by default when coding. After the keyword `import` - the programmer\
    \ specifies a specific directory that is within the Python library. In this case,\
    \ we specified the `math` directory, if we wanted to specifically specify something\
    \ within the `System` directory, we would add a dot separator (period) and then\
    \ added a sub directory name. If the library’s folders are more intricate, you\
    \ must use notation like the following:\n\n```python\nimport bs4 from BeautifulSoup\n\
    ```\n\nThe `BeautifulSoup` library is an example of this where we want to import\
    \ the `bs4` directory from the `BeautifulSoup` library of directories, which is\
    \ why the `from` keyword is used in the beginning of the program.\n\nIn our case,\
    \ we imported the `math` module because it contains functions (you will learn\
    \ more about what these are later on in the guide – they can be defined as functions\
    \ or methods). For the sake of a brief explanation, a function is simply a block\
    \ of code that has a series of steps to complete a certain function and can be\
    \ called to compute numbers for us. Many libraries contain functions that are\
    \ able to be called so we don’t have to code our functions from scratch. In this\
    \ case, we used the square root function from the `math` module. In this case,\
    \ we used `math.sqrt()` and then printed out the value it returned relative to\
    \ the input. While the `sqrt` function takes in a value in parenthesis, this value\
    \ is stored in the `x` variable which is why it has an equal sign to show that\
    \ it is equal to the value computed from the `sqrt` function. Again, this might\
    \ not make a lot of sense to you but will be covered in depth later on.\n\nNow\
    \ as we run through each statement, one thing to note is that in order to run\
    \ the next line, we must have a separate line for each statement. The compiler\
    \ (process to convert code in to readable code that the computer can understand;\
    \ binary) will then know when statements end and when they start through the use\
    \ of line breaks.\n\nNow let’s back up and talk about the `class Program:` line.\n\
    \n`class` - A class can be thought of as a “section” of code. For example:\n\n\
    Section: Everything in here is the contents of the section. Again, you will gain\
    \ a better understanding how classes are useful in Inheritance and Polymorphism.\n\
    \n`Program` - This second element of this important line is `Program` which simply\
    \ is a custom name that the user can redefine. You can call this anything, as\
    \ all it is doing is giving the “Section” or “Class” a name. You can think of\
    \ it this way:\n\nSection Name: Essay/Contents\n\nIn code, it would be presented:\n\
    \n```python\nclass Program:\n    Code\n```\n\nAnother thing you must be scratching\
    \ your head looking at is the colon: `:` - all that the colon does is simply tells\
    \ the compiler when a specific section starts. This could be thought of as when\
    \ someone is writing an essay and they have to start their sentences with the\
    \ appropriate words or indent their paragraphs.\n"
  raw: 'The great thing about Python is that it has a giant library for web crawling
    and is used a lot for its capability in scraping the web. A web crawler is simply
    a program that can navigate the web depending on the parameters set out for it
    and scrapes content that you would like for it to scrape.


    All in all, Python can be easy to pick up whether you’re a beginner in programming
    or an experienced one for other languages. It’s a fast, friendly and easy to learn
    language but don’t mistake that for its powerful nature.


    # Chapter 2


    # Installation of Python


    In order to install Python on to a machine, you must download the following:


    1.  Python Interpreter


    2.  Python IDE


    The download of these two tools will put you on your way to becoming a Python
    programmer. An IDE (integrated development environment) is a packaged application
    program used by programmers because it contains necessary tools in order to process
    and execute code. An IDE contains a code editor, a compiler, a debugger, and a
    graphical user interface (GUI). There are many different type of IDE’s but the
    most commonly used one is PyCharm for Python. Before attaining the PyCharm IDE
    from JetBrains, you must first install the Python Interpreter (IDLE version 3.4)
    on to your system so PyCharm is able to detect Python on the computer.


    In this guide, it would be recommended to use PyCharm because it will be used
    by this guide. If you use the same IDE, you can follow me easier. In order to
    download the Python Interpreter, please use the following link:


    [https://www.python.org/downloads/](https://www.python.org/downloads/)


    Once you have reached this link, you will have to find this:


    ![http://puu.sh/hTvWC/e539a9177f.png](images/00008.jpeg)


    Then, click download and a file will be downloaded accordingly. Once you have
    this file, execute it and follow the instructions on the wizard to install the
    Python Interpreter.


    Once the Python Interpreter has been installed, we can move on to downloading
    PyCharm. In order to install PyCharm, please visit the following link:


    [https://www.jetbrains.com/pycharm/download/](https://www.jetbrains.com/pycharm/download/)


    ![http://puu.sh/hTw3f/dd49e7ad1c.png](images/00009.jpeg)


    You should now be on this screen (or something similar) – click the “Download
    Community” button and continue to download PyCharm. During this process, it will
    automatically detect the Python 3.4 IDLE but in rare cases you might need to specify
    the directory that you installed Python in.


    Once you have completed the installation of PyCharmand the Python 3.4 IDLE, go
    to File New Project. You will reach this screen:


    ![http://puu.sh/hTwox/5ba1669ce6.png](images/00010.jpeg)


    You can rename the “untitled” portion of the Location field to a specific project
    name. Then click the “Create” button and you will end up being in an empty project.
    The next thing we must do is create a new Python file which you can do by going
    to:


    FileNew Python File


    Set the name of your python file accordingly and it will show under your project
    name in the Project Explorer. Now double click on the file and you will be met
    with a page where you can start coding Python.


    This is how it should look like:


    ![http://puu.sh/hTwx1/74b6154739.png](images/00011.jpeg)


    You have successfully completed the installation of Python!


    # Chapter 3


    # Python Language Structure


    Using the sample code as an example, we will learn how Python as a programming
    language is structured through the following sample code:


    import math


    class Program:


        def Execute(self):


            x = math.sqrt(25)


            print(x)


    run = Program()


    run.Execute()


    Output:


    ![http://puu.sh/hTy3s/931081aeed.png](images/00012.jpeg)


    In order to actually execute the code, you must use the shortcut alt + shift +
    f10 or execute it using the Run menu item in the main navigation bar in PyCharm.


    The first line import math is using a special keyword import which allows the
    programmer to import tools from the Python library which aren’t included by default
    when coding. After the keyword import - the programmer specifies a specific directory
    that is within the Python library. In this case, we specified the math directory,
    if we wanted to specifically specify something within the System directory, we
    would add a dot separator (period) and then added a sub directory name. If the
    library’s folders are more intricate, you must use notation like the following:


    import bs4 from BeautifulSoup


    The BeautifulSoup library is an example of this where we want to import the bs4
    directory from the BeautifulSoup library of directories, which is why the “from”
    keyword is used in the beginning of the program.


    In our case, we imported the math module because it contains functions (you will
    learn more about what these are later on in the guide – they can be defined as
    functions or methods). For the sake of a brief explanation, a function is simply
    a block of code that has a series of steps to complete a certain function and
    can be called to compute numbers for us. Many libraries contain functions that
    are able to be called so we don’t have to code our own functions from scratch.
    In this case, we used the square root function from the math module. In this case,
    we used math.sqrt() and then printed out the value it returned relative to the
    input it received.


    We first typed in math to indicate the module we are used and then a dot separator
    to reference the function within the module which is the sqrt function. The sqrt
    function takes in a value in its parameter or parenthesis. While the sqrt function
    computes the number 25 and returns the value of 5, this value is stored in the
    x variable which is why it has an equal sign to show that it is equal to the value
    that is computed from the sqrt function. Again, this might not make a lot of sense
    to you but will be covered in depth later on in this guide.


    Now as we run through each statement, one thing to note is that in order to run
    the next line, we must have a separate line for each statement. The compiler (process
    to convert code in to readable code that the computer can understand; binary)
    will then know when statements end and when they start through the use of line
    breaks.


    Now let’s back up and talk about the class Program: line.


    class - A class can be thought of as a “section” of code. For example:


    Section: Everything in here is the contents of the section. Again, you will gain
    a better understanding how classes are useful in Inheritance and Polymorphism.


    Program - This second element of this important line is “Program” which simply
    is a custom name that the user can redefine. You can call this anything, as all
    it is doing is giving the “Section” or “Class” a name. You can think of it this
    way:


    Section Name:   Essay/Contents


    In code, it would be presented:


    class Program:   Code


    Another thing you must be scratching your head looking at is the colon: “:” and
    “}” - all that the colon does is simply tells the compiler when a specific section
    starts. This could be thought of as when someone is writing an essay and they
    have to start their sentences with the appropriate words or indent their paragraphs.'
