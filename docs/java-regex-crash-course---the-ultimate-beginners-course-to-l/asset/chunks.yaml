  trans: "\n\n上面的截图演示了如何搜索带有前导空白的 `</ulink>` XML 标签以及如何移除这些空白。\n\n# 第 20 章：结语\n\n\
    简而言之，正则表达式提供了一个极其灵活且强大的文本处理系统。我们将正则表达式描述为用于在文本中搜索的文本模式。我们通过将正则表达式与文本进行“匹配”来实现这一点。将正则表达式与文本进行匹配的结果是一个\
    \ `true` / `false` 值（用于指定正则表达式是否匹配了文本），或者一组匹配项——文本中发现的每一个正则表达式出现都对应一个匹配项。\n\n\
    例如，我们可以使用正则表达式在 HTML 页面中搜索电子邮件地址、URL、电话号码等。这是通过将不同的正则表达式与 HTML 页面进行匹配来实现的。每个正则表达式与\
    \ HTML 页面匹配的结果将是一组匹配项——每个正则表达式对应一组匹配项（每个正则表达式可能会匹配多次）。\n\n但我们需要理解：\n\n1. 正则表达式起初并不容易使用\n\
    \   - 每一个组成部分并不难，但需要大量的练习（甚至会流泪，为什么不呢？）才能学会正确地将它们组合在一起\n2. 正则表达式构成了一种微型编程语言\n\
    \   - 它与 `Java` 是不同类型的编程语言，需要你学习新的思维模式\n   - 在 `Java` 中你不能直接使用正则表达式；你必须先创建 `Patterns`\
    \ 和 `Matchers`\n   - `Java` 的 `String` 常量语法也没有什么帮助\n   - 尽管如此，正则表达式为 `String`\
    \ 操作带来了如此强大的功能和便利，因此它们非常值得投入精力学习。\n\n总结一下，想象一下如果所有的计算机问题或项目都是这样：你遇到的每一个问题，无论简单还是复杂，都只用英文写，因为没有人能看懂那些符号。这会让我们疯掉，即使你完全不知道编程的基础知识。\n\
    \n幸运的是，人类发明了符号来简洁地描述那些符号最擅长描述的事物，并将人类语言留来描述其他事物。符号语言充当构建块，在短的空间内构建复杂的结构，而这些结构用一整本书的英文才能描述。\n\
    \nEprogramy\n\n附：还有一件事。在 Eprogramy，我们想送你一份礼物。如果你像我们一样喜欢 `Java Regex`，那么你可能也会喜欢\
    \ Python。因此，在接下来的章节中，你将看到我们的预告——《PYTHON CRASH COURSE - The Ultimate Beginner’s\
    \ Course to Learning Python Programming in Under 12 Hours》。\n\n我知道你会喜欢它的！\n\n\
    你可以在亚马逊上找到它，搜索我们的名字 Eprogramy，或者点击此链接：\n\n![](http://www.amazon.com/Python-Ultimate-Beginners-Learning-Programming-ebook/dp/B00ZCRSCFG/)\n\
    \n# [`http://www.amazon.com/Python-Ultimate-Beginners-Learning-Programming-ebook/dp/B00ZCRSCFG/`]\n\
    \n# 《Python 速成班 - 在 12 小时内学习 Python 编程的终极初学者课程》预告\n\n# 引言：欢迎来到你的新编程语言\n\n所以，你决定学习\
    \ Python 编程了？很好，祝喜并欢迎来到你的新编程语言！你会喜欢它的！\n\n在 Eprogramy，我们相信，良好教育的基础是提供能够开启未来之门的工具。不可否认的是，世界已经进入了一个我们一切都触手可及的时代。社会需求发生了变化。因此，今天的通信也发生了变化。沟通开启了大门，所以学习如何沟通是我们的挑战。在\
    \ Eprogramy，我们希望你学习如何用一种新语言交流：编程语言。这种语言允许我们使用电脑或笔记本电脑进行创作。\n\n也许道路是艰难且艰辛的，但我们将为读者提供工具让学习变得有趣且富有成效。我们将展示学习如何编程所需的所有方面。从基础字母到解决最常见的编程问题，以及更多、更多内容。始终会有大量示例的帮助，这将有助于更好地理解。\n\
    \n我们知道自己在做什么，并相信你完全有能力吸收我们的教学。\n\n未来的门已经开启。让我们一起一步步前进吧。\n\n让我们开始吧！\n\nEprogramy\
    \ 团队\n\n# 第 1 章：Python 编程语言\n\n## Python 的历史\n\nPython 被称为初学者的首选语言，因为它被全球计算机程序员推荐为适合初学者学习的好门语言。这不应被误认为是基于它的强大。\n\
    \nPython 语言由 Guido Von Rossum 于 1990 年在荷兰的数学中心（Stichting Mathematisch Centrium）创建。该语言实际上是由一个大型志愿者团队开发的，并开放修改。在它所处的开发阶段，它已经包含了具有继承关系的类、异常处理、函数以及\
    \ `list`、`dict`、`str` 等核心数据类型。\n\n2000 年 5 月，Guido 和 Python 开发团队移动到 BeOpen.com\
    \ 组成 BeOpen PythonLabs 团队。同年，PythonLabs 团队移动到 Digital Creations，现在被称为 Zope Corporation。\n\
    \nPython `2.0` 于 2000 年 10 月 16 日发布，其特性包括垃圾回收器，这有助于维护编程中的内存处理相关问题。Python 的伟大之处在于它有社区的支持，并且在利用\
    \ Python 的用户背后有一套透明的机制。\n\n之后，Python `3.0` 作为一个重大的不后兼容版本在经过长时间测试后，于 2008 年 12\
    \ 月 3 日发布。`3.0` 的主要特性也回移植到了 Python `2.6` 和 `2.7`。\n\nPython 版本发布日期：\n\n- Python\
    \ `1.0` - 1994 年\n- Python `1.5` - 1997 年 12 月 31 日\n- Python `1.6` - 2000 年 9\
    \ 月 5 日\n- Python `2.0` - 2000 年 10 月 16 日\n- Python `2.1` - 2001 年 4 月 17 日\n\
    - Python `2.2` - 2001 年 12 月 21 日\n- Python `2.3` - 2003 年 7 月 29 日\n- Python\
    \ `2.4` - 2004 年 11 月 30 日\n- Python `2.5` - 2006 年 9 月 19 日\n- Python `2.6` -\
    \ 2008 年 10 月 1 日\n- Python `2.7` - 2010 年 7 月 3 日\n- Python `3.0` - 2008 年 12\
    \ 月 3 日\n- Python `3.1` - 2009 年 6 月 27 日\n- Python `3.2` - 2011 年 2 月 20 日\n\
    - Python `3.3` - 2012 年 9 月 29 日\n- Python `3.4` - 2014 年 3 月 16 日\n\n## 什么是 Python？\n\
    \nPython 是一种免费提供的面向对象、高级且具有动态语义的编程语言。许多程序员对 Python 赞誉有加，因为它提供了更高的生产力，因为编辑-测试-调试循环非常快。\n\
    \nPython 语言具有简单、易于学习的语法，通过大量的英语单词提高了可读性和效率。在 Python 中编写代码，感觉更像是在用自己的想法写出解决方案，而不是在引用语言为了实现某些功能时所需的模糊符号。\n\
    \nPython 可用于自动化测量和交互式处理数据。与其他许多编程语言相比，Python 能够轻松处理大型数据库并计算大量数字。它可以作为内部脚本语言，供其他程序执行特定功能。通过学习\
    \ Python，你将能够编写复杂的软件，如复杂的网络爬虫。\n\n"
- fmt: "\nThe great thing about Python is that it has a giant library for web crawling\
