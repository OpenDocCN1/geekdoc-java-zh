    \n在 Java 中使用正则表达式时的第一个重要规则是：搜索从左到右运行，如果一个字符已经在搜索中使用过，它将不会被重复使用。所以，当我们看到“dfdfd”时，我们使用了前三个字母进行匹配，只剩下“fd”，这是无法匹配的。因此，在编写需要评估的表达式时，我们需要小心。\n\
    \n## 对 `\\` 字符的谨慎使用\n\n让我们考虑我们的应用程序想要从服务接收到的长文本中读取 IP 地址。首先要考虑的点是 IP 地址格式的定义。我们有\
    \ 4 组由点分隔的数字，范围从 0 到 255。让我们将其写成正则表达式。如果你有更好或更优雅的解决方案，欢迎随时评论。\n\nPattern: `\\\
