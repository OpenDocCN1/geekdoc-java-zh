    \ zero\n- `-?`: optionally match a dash\n- `$`: equal the end of the line\n\n\
    ### Extracting/Capturing\n\nRegular expression can be used for selecting specific\
    \ values out of a large complex body of text.\n\nSample:\n\n```java\npackage com.sample.regexsample;\n\
    \nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.regex.Matcher;\n\
    import java.util.regex.Pattern;\n\npublic class SampleGrouping {\n    public static\
    \ void main(String[] args) {\n        String input = \"I have a kindle, but I\
    \ like to read book better.\";\n        Pattern p = Pattern.compile(\"(kindle|read|book|wolf|bear|human)\"\
    );\n        Matcher m = p.matcher(input);\n        List<String> animals = new\
    \ ArrayList<String>();\n        while (m.find()) {\n            System.out.println(\"\
    Found a \" + m.group() + \".\");\n            animals.add(m.group());\n      \
    \  }\n    }\n}\n```\n\nOutput\nFound a kindle.\nFound a read.\nFound a book.\n\
    \nExplanation of the pattern used:\n`\"(kindle|read|book|wolf|bear|human)\"`\n\
    - `()` group everything within the parenthesis as group 1\n- `kindle`: match the\
    \ text ‘kindle’\n- `|`: alternation: match any one of the sections of this group\n\
    - `read`: match the text ‘read’\n… and so on\n\n### Modifying/Substitution\n\n\
    Using Regular Expression, values in text can be substitute with new values. Let´s\
    \ see, you could change all instances of the word `userId=`, followed by a number,\
    \ with a “screen” to hide the original text.\n\nSample:\n\n```java\npackage com.sample.regexsample;\n\
    \nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class\
    \ MaskingDemo {\n    public static void main(String[] args) {\n        String\
    \ input = \"User userId=23421\\. Some more userId=33432\\. This is userNum=100\"\
    ;\n        Pattern p = Pattern.compile(\"(userId=)(\\\\d+)\");\n        Matcher\
    \ m = p.matcher(input);\n        StringBuffer result = new StringBuffer();\n \
    \       while (m.find()) {\n            System.out.println(\"Masking: \" + m.group(2));\n\
    \            m.appendReplacement(result, m.group(1) + \"***masked***\");\n   \
    \     }\n        m.appendTail(result);\n        System.out.println(result);\n\
    \    }\n}\n```\n\nOutput\nMasking: 23421\nMasking: 33432\nUser userId=***masked***.\
    \ Some more userId=***masked***. This is userNum=100\n\nExplanation of the pattern\n\
    `(userId=)(\\\\d+)`\n- `(userId=)` group everything within the parenthesis as\
    \ group 1\n- `userId=` equal the text `userId=`\n- `(\\\\d+)` group everything\
    \ within the parenthesis as group 2\n- `\\d+` equal one or more digits\n\n###\
    \ Match One of Many\n\nUsing `[]` meta characters and different combinations of\
    \ characters, we can match one of the characters present. For example, lets create\
    \ a regular expression to match all spellings like cat, bat, rat.\n\nExample:\
    \ `(b|m|r)[a][ts]`\n\nSample Code:\n\n```java\npackage com.sample.regexsample;\n\
    import java.util.ArrayList;\nimport java.util.List;\nimport java.util.regex.Matcher;\n\
    import java.util.regex.Pattern;\n\npublic class SampleGrouping {\n    public static\
    \ void main(String[] args) {\n        String input = \"I have a cat, dog, mat\
    \ and rat.\";\n        Pattern p = Pattern.compile(\"(c|d|r)[a][ts]\");\n    \
    \    Matcher m = p.matcher(input);\n        List<String> animals = new ArrayList<String>();\n\
    \        while (m.find()) {\n            System.out.println(\"Found a \" + m.group()\
    \ + \".\");\n            animals.add(m.group());\n        }\n    }\n}\n```\n\n\
    Output:\nFound a cat.\nFound a mat.\nFound a rat.\n\n### Using Special Constructs\n\
    \nSpecial constructs are used when we want to find a piece of text when it came\
    \ before another pattern in that string? Or to find a piece of text that was not\
    \ followed by another piece of text? Normally, with standard string searching,\
    \ we require to write a somewhat complex function to perform the exact operation\
    \ you wanted. This can, however, all be done on one line using regular expressions.\n\
    \n### Look Ahead & Look Behind\n\nLook-ahead and look-behind operations are similar\
    \ to grouping but these patterns do not capture values. Therefore, using these\
    \ constructs, no values will be stored for later, and they do not affect group\
    \ numbering. Look-ahead operations look forward, starting from their location\
    \ in the pattern, continuing to the end of the input. Look-behind expressions\
    \ do not search backwards, but instead start at the beginning of the pattern and\
    \ continue up/until the look-behind expression.\n\nE.g.:\nWe need to ensure in\
    \ our input string the word `incident` must be present but that the word `theft`\
    \ should not be found anywhere. We can use a negative look-ahead to ensure that\
    \ there are no occurrences.\n`(?!.*theft).*incident.*`\n\nThis expression exhibits\
    \ the following behavior:\n- `\"There was a crime incident\"` matches\n- `\"The\
    \ incident involved a theft\"` does not match\n- `\"The theft was a serious incident\"\
    ` does not match\n\nLook ahead are of 2 types. Positive look ahead and negative\
    \ look ahead\n\n### Positive Look Ahead\n\nPositive lookahead is used if you want\
    \ to match something that should be followed by some pattern or string.\n\nSample\
    \ for positive look ahead\n```java\npackage com.sample.regexsample;\nimport java.util.regex.Matcher;\n\
    import java.util.regex.Pattern;\n\npublic class DemoPositiveLookAhead {\n    public\
    \ static void main(String[] args) {\n        String regex = \"(?=^255).*\";\n\
    \        Pattern p = Pattern.compile(regex);\n        String candidate = \"255.0.1\"\
    ;\n        Matcher m = p.matcher(candidate);\n        String ip = \"not found\"\
    ;\n        if (m.find()) {\n            ip = m.group();\n            String msg\
    \ = \"ip: \" + ip;\n            System.out.println(msg);\n        }\n    }\n}\n\
    ```\n\nOutput:\nip: 255.0.1\n\nExplanation the pattern used:\n`(?=^255).*`\n-\
    \ `(?=^255)` denotes a positive look ahead and should start with 255\n- `.*` could\
    \ be followed by anything\n\n### Negative Look Ahead\n\nNegative lookahead is\
    \ used if you want to match something not followed by something.\n\nSample Code\
    \ for Negative Look ahead\n```java\npackage com.sample.regexsample;\nimport java.util.regex.Matcher;\n\
    import java.util.regex.Pattern;\n\npublic class DemoForNegativeAhead {\n    public\
    \ static void main(String[] args) throws Exception {\n        String regex = \"\
    John (?!Heins)[A-Z]\\\\w+\";\n        Pattern p = Pattern.compile(regex);\n  \
    \      String candidate = \"I think that John Heins is a fictional character.\
    \ His real name might be John Jackson, John Westling, or John Holmes for all we\
    \ know.\";\n        Matcher m = p.matcher(candidate);\n        String tmp = null;\n\
    \        while (m.find()) {\n            tmp = m.group();\n            System.out.println(\"\
    MATCH:\" + tmp);\n        }\n    }\n}\n```\n\nOutput\nMATCH:John Jackson\nMATCH:John\
    \ Holmes\n\nExplaining the pattern:\n`\"John (?!Heins)[A-Z]\\\\w+\"`\n- `John`:\
    \ the pattern should start with John\n- `(?!Heins)`: It should not contain the\
    \ word Heins\n- `(A-Z)[\\\\w]+`: John Should be followed by a word that begins\
    \ with capital letter followed by any word.\n\n### Positive Look Behind\n\nPositive\
    \ lookbehind is used if you want to match something that should be preceded by\
    \ some pattern or string\n\nSample for positive look-behind\n```java\npackage\
    \ com.sample.regexsample;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
    \npublic class DemooforPositiveLookBehind {\n    public static void main(String[]\
    \ args) {\n        String reg = \"(?<=http://)\\\\S+\";\n    }\n}\n```\n"
