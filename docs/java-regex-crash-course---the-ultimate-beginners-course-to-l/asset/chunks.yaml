    - `png` : includes characters \"png\"\n- `|` : ..or\n- `gif` : includes characters\
    \ \"gif\"\n- `|` : ..or\n- `bmp` : includes characters \"bmp\"\n- `)` : end of\
    \ the group #3\n- `)` : end of the group #2\n- `$` : end of the string\n\nThe\
