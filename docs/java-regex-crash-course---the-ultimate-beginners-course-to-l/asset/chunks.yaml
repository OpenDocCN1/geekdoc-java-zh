    End index-->\"+m8.end());\n}\nSystem.out.println(\"-----------------------------------------------\"\
    );\n```\n\n## Special Constructs\n\n| Constructs | Explanation |\n| :--- | :---\
    \ |\n| `(?<name>X)` | `X`, as a named-capturing group |\n| `(?:X)` | `X`, as a\
    \ non-capturing group |\n| `(?flags)` | Nothing, but turns flags on-off |\n| `(?flags:X)`\
    \ | `X`, as a non-capturing group with given flags |\n| `(?=X)` | `X`, via zero-width\
    \ positive lookahead |\n| `(?!X)` | `X`, via zero-width negative lookahead |\n\
    | `(?<=X)` | `X`, via zero-width positive lookbehind |\n| `(?<!X)` | `X`, via\
    \ zero-width negative lookbehind |\n| `(?>X)` | `X`, as an independent non-capturing\
    \ group |\n\n## Regex Samples\n\n### Basic Expressions\n\nIn Java every string\
    \ is a regular expression. For example, the string \"I have a car\" is a regex\
    \ that will match the text \"I have a car\" and will not listen to everything\
    \ else.\n\nWhat if we want to be able to let others know more things we have?\
    \ We can change the word `car` with a character class expression that will match\
    \ any character: `I have a \\w+`.\n\nYou notice in this pattern both a character\
    \ class and a quantifier are used. `\\w` says match a word character, and `+`\
    \ says match one or more. When linked, the pattern says \"match one or more word\
    \ characters.\" Now the pattern will equate any word in place of car, e.g., \"\
    I have a book\" or \"I have a dress\".\n\nBut if we need to verify \"I have a:\
    \ boat\", it will not match because of the `:` symbol, which is not a word character.\
    \ If we want the expression to be able to handle this situation, then we need\
    \ to make a small change: `I have a:?\\w+`.\n\nNow the expression will let an\
    \ optional `:` directly then the word 'a'.\n\n### Grouping\n\nGrouping is an important\
    \ matter of regex. It is the aptitude to assemble sections of a pattern and provide\
    \ different matches. The following metacharacters are important parts of regex:\n\
    \n| Alternation (`or` statement) | Grouping |\n| :--- | :--- |\n| `\\|` | `()`\
    \ |\n\nFor instance, in the first example we had a car. What if we know the list\
    \ of objects we require to inform the world and nothing else? Let's use a group\
    \ `()` with `|` meta-character to set a list of expressions to permit: `I have\
    \ a:?(car\\|dress\\|pen)`.\n\nThe new expression now equals the starting point\
    \ \"I have a\", an optional \":\", then one of the expressions separated by `|`;\
    \ any of `car`, `dress`, or `pen` would be a match.\n\n- `I have a car` matches\n\
    - `I have books` matches (`s` is not needed, ignored)\n- `I have: car` matches\n\
    - `I have- car` doesn't match (`-` is not allowed in pattern)\n- `I have: bo`\
    \ doesn't match (all of `book` is needed)\n\n#### Example\n\n```java\npackage\
    \ com.sample.regexsample;\nimport java.util.regex.Pattern;\nimport java.util.regex.Matcher;\n\
    \npublic class DemoGrouping {\n    public static void main(String[] args) {\n\
    \        String text = \"John writes about this, and John writes about that, and\
    \ John writes about everything.\";\n        String patternString1 = \"(John)\"\
    ;\n        Pattern pattern = Pattern.compile(patternString1);\n        Matcher\
    \ matcher = pattern.matcher(text);\n        while(matcher.find()) {\n        \
    \    System.out.println(\"found: \" + matcher.group(1));\n        }\n    }\n}\n\
    ```\n**Output:**\nfound: John\nfound: John\nfound: John\n\n### Matching/Validating\n\
    \nUsing Regex, it is possible to find all instances of text that match a certain\
    \ pattern and return a Boolean value if the pattern is found/not found.\n\n####\
    \ Example:\n\n```java\npackage com.sample.regexsample;\nimport java.util.ArrayList;\n\
    import java.util.List;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
    \npublic class ValidateSSN {\n    public static void main(String[] args) {\n \
    \       List<String> input = new ArrayList<String>();\n        input.add(\"123-45-6789\"\
    );\n        input.add(\"9876-5-4321\");\n        input.add(\"987-65-4321 (attack)\"\
    );\n        input.add(\"987-65-4321 \");\n        input.add(\"192-83-7465\");\n\
    \        String patternString = \"^(\\\\d{3}-?\\\\d{2}-?\\\\d{4})$\";\n      \
    \  Pattern pattern = Pattern.compile(patternString);\n        for (String ssn\
    \ : input) {\n            if (ssn.matches(\"^(\\\\d{3}-?\\\\d{2}-?\\\\d{4})$\"\
    )) {\n                Matcher m = pattern.matcher(ssn);\n                if (m.find())\
    \ {\n                    System.out.println(\"Found good SSN: \" + ssn);\n   \
    \             }\n            }\n        }\n    }\n}\n```\nThis is the code using\
    \ the `Pattern` and `Matcher` methods of the regex class.\n\n**Output:**\nFound\
    \ good SSN: 123-45-6789\nFound good SSN: 192-83-7465\n\nExplanation of the pattern\
    \ used in the sample:\n`^(\\\\d{3}-?\\\\d{2}-?\\\\d{4})$`\n\n- `^` equals the\
    \ beginning of the line\n- `()` group everything within the parenthesis as group\
    \ 1\n- `$` equals the end of the line\n"
