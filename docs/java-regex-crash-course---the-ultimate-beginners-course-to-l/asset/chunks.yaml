    \ matches characters a through l and q through z.\n\n              The following\
    \ command line offers a second example:\n\n              [a-f&&[^a-c]&&[^e]] abcdefg\
    \ matches d and f with their counterparts in abcdefg.\n\n## Predefined Character\
    \ Classes\n\n| Character | Explanation |\n\n| . | Equate a Dot, any character\
    \ (may or may not match line terminators) |\n\n| \\d | Equate a digit: [0-9] |\n\
    \n| \\D | Equate a non-digit: [^0-9] |\n\n| \\s | Equate a whitespace character:\
    \ [ \\t\\n\\x0B\\f\\r] |\n\n| \\S | Equate a non-whitespace character: [^\\s]\
    \ |\n\n| \\w | Equate a word characters |\n\n| \\W | Equate a non-word characters\
    \ |\n\n| \\A | Equate beginning of string. |\n\n| \\Z | Equate end of string.\
    \ |\n\nHowever; in Java, you will need to “double escape” these backslashes.\n\
    \nString pattern = \"\\\\d \\\\D \\\\W \\\\w \\\\S \\\\s\";\n\nFor e.g.\n\nPattern.matches(\"\
    \\\\d\", \"1\"); would return true\n\nPattern.matches(\"\\\\D\", \"z\"); return\
    \ true\n\nPattern.matches(\".p\", \"qp\"); return true, dot(.) represent any character\n\
    \n## Boundary Matchers\n\n| Expression | Explanation |\n\n| ^ | Equate the beginning\
    \ of a line. |\n\n| $ | Equate then end of a line. |\n\n| \\b | Equate a word\
    \ boundary. |\n\n| \\B | Equate a non-word boundary. |\n\n| \\A | Equate the beginning\
    \ of the input text. |\n\n| \\G | Equate the end of the previous match |\n\n|\
    \ \\Z | Equate the end of the input text except the final terminator if any |\n\
    \n| \\z | Equate the end of the input text |\n\nFor e.g.\n\nPattern.matches(\"\
    ^Hello$\", \"Hello\"): return true, Begins and ends with Hello\n\nPattern.matches(\"\
    ^Hello$\", \"Namaste! Hello\"): return false, does not begin with Hello\n\nPattern.matches(\"\
    ^Hello$\", \"Hello Namaste!\"): return false, Does not end with Hello\n\n## Quantifiers\n\
    \nA quantifier is a regular expression construction that ties a numeric value\
    \ to a pattern. A quantifier will loop to the expression group to its immediate\
    \ left. That numeric value establish how many times to match a pattern.\n\nWe\
    \ have six main quantifier categories which can be replicate in each of three\
    \ major categories: greedy, reluctant, and possessive.\n\n### Greedy Quantifiers\n\
    \nThe greedy quantifier will match the longest string with the pattern.\n\n| Greedy\
    \ Quantifier | Explanation |\n\n| X? | Equate once or not at all |\n\n| X* | Equate\
    \ zero or more times |\n\n| X+ | Equate one or more times |\n\n| X{n} | Equate\
    \ exactly n times |\n\n| X{n,} | Equate at least n times |\n\n| X{n,m} | Equate\
    \ at least n but not more than m times |\n\n### Reluctant Quantifier\n\nThe reluctant\
    \ quantifier is used to match with the shortest possible string that matches the\
    \ pattern\n\n| Reluctant Quantifier | Explanation |\n\n| X?? | Equate once or\
    \ not at all |\n\n| X*? | Equate zero or more times |\n\n| X+? | Equate one or\
    \ more times |\n\n| X{n}? | Equate exactly n times |\n\n| X{n,}? | Equate at least\
    \ n times |\n\n| X{n,m}? | Equate at least n but not more than m times |\n\n###\
    \ Possessive Quantifier\n\nThe possessive quantifier will match the regex with\
    \ the entire string. It will only match once the string accomplish preset the\
    \ criteria\n\n| Possessive Quantifier | Explanation |\n\n| X?+ | Equate once or\
    \ not at all |\n\n| X*+ | Equate zero or more times |\n\n| X++ | Equate one or\
    \ more times |\n\n| X{n}+ | Equate exactly n times |\n\n| X{n,}+ | Equate at least\
    \ n times |\n\n| X{n,m}+ | Equate at least n but not more than m times |\n\nSample\
    \ Code for Quantifiers:\n\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\
    \nimport java.util.regex.Pattern;\n\npublic  class DemoForQuantifiers {\n\npublic\
    \  static  void main(String[] args) {\n\nString regex = \"a?\"; --> to matcha in abaa once\
    \ or not at all\n\nString regex1 = \"a*\"; to match  a in abaa zero or more times\n\
    \nString regex2 = \"a+\";  greedy quantifier to match a in abaa one or more times\n\
    \nString regex3 = \"a{2}\"; greedy quantifier to match every aa sequence in aababbaaaab\n\
    \nString regex4 = \"a{2,}\";greedy quantifier to match two or more consecutive\
    \ as in         \n\n                          aababbaaaab\n\nString regex5 = \"\
    a{1,3}\"; greedy quantifier to match every a, aa, or aaa in\n\n                            \
    \ aababbaaaab\n\nString regex6 = \"a+?\"; reluctant quantifier to match a in\
    \ abaa one or more times\n\nString regex7 = \".*+end\"; uses a possessive quantifier\
    \ to match all characters\n\n                             followed by end in This\
    \ is the end zero or more times\n\nString text = \"abaa\";\n\nString text1 = \"\
    abaa\";\n\nString text2 = \"abaa\";\n\nString text3 = \"aababbaaaab\";\n\nString\
    \ text4 = \"aababbaaaab\";\n\nString text5 = \"aababbaaaab\";\n\nString text6\
    \ = \"abaa\";\n\nString text7 = \"This is the end\";\n\nPattern p1 = Pattern.compile(regex);\n\
    \nPattern p2 = Pattern.compile(regex1);\n\nPattern p3 = Pattern.compile(regex2);\n\
    \nPattern p4 = Pattern.compile(regex3);\n\nPattern p5 = Pattern.compile(regex4);\n\
    \nPattern p6 = Pattern.compile(regex5);\n\nPattern p7 = Pattern.compile(regex6);\n\
    \nPattern p8 = Pattern.compile(regex7);\n\nMatcher m1 = p1.matcher(text);\n\n\
    Matcher m2 = p2.matcher(text1);\n\nMatcher m3 = p3.matcher(text2);\n\nMatcher\
