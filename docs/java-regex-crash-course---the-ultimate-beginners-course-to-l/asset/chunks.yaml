    # Chapter 1: Python Programming Language\n\n## History of Python\n\nPython is\
    \ known as the go-to language for beginners as it is recommended by computer programmers\
    \ around the globe as a good language for beginners to learn. This should not\
    \ be misinterpreted for its powerful nature.\n\nThe Python language was created\
    \ in 1990 by Guido Von Rossum at Stichting Mathematisch Centrium in the Netherlands.\
    \ The language itself has been actually developed by a large team of volunteers\
    \ and is available to modify. In the development stage that it was in, it had\
    \ classes with inheritance, exception handling, functions, and the core datatypes\
    \ of `list`, `dict`, `str` and more.\n\nIn May 2000, Guido and the Python development\
    \ team moved to BeOpen.com to form the BeOpen PythonLabs team. In the same year,\
    \ the PythonLabs team moved to Digital Creations which is now known as Zope Corporation.\n\
    \nPython `2.0` was released on the 16th of October in the year 2000 with features\
    \ including a garbage collector which helps maintain memory handling related issues\
    \ in programming. The great thing about Python was that it is backed by a community\
    \ and it has a transparency behind the users that utilize the Python.\n\nSoon\
    \ after, Python `3.0` which was a major backwards-incompatible release was released\
    \ on December 3rd 2008 after a long period of testing. The major features of `3.0`\
    \ have also been backported to Python `2.6` and `2.7`.\n\nPython Version Release\
    \ Dates:\n\n- Python `1.0` - January 1994\n- Python `1.5` - December 31, 1997\n\
    - Python `1.6` - September 5, 2000\n- Python `2.0` - October 16, 2000\n- Python\
    \ `2.1` - April 17, 2001\n- Python `2.2` - December 21, 2001\n- Python `2.3` -\
    \ July 29, 2003\n- Python `2.4` - November 30, 2004\n- Python `2.5` - September\
    \ 19, 2006\n- Python `2.6` - October 1, 2008\n- Python `2.7` - July 3, 2010\n\
    - Python `3.0` - December 3, 2008\n- Python `3.1` - June 27, 2009\n- Python `3.2`\
    \ - February 20, 2011\n- Python `3.3` - September 29, 2012\n- Python `3.4` - March\
    \ 16, 2014\n\n## What is Python?\n\nPython is a freely available object-oriented,\
    \ high-level programming language with dynamic semantics. Many programmers say\
    \ great things about Python because of the increased productivity that it provides\
    \ since the edit-test-debug cycle is incredibly fast.\n\nThe Python language has\
    \ a simple, easy to learn syntax which is empowered with many English words for\
    \ easier readability and efficiency. When coding in Python, it feels more like\
    \ you are writing out the solution to a problem in your own thoughts rather than\
    \ trying to refer to ambiguous symbols that are required in the language to commit\
    \ to certain functionalities.\n\nPython could be used to automate measurements\
    \ and process data interactively. The language is able to handle large databases\
    \ and compute large numbers strain-free compared to many other programming languages.\
    \ It can be used as an internal scripting language so that it is executed for\
    \ certain functions by other programs. By learning Python, you will be able to\
    \ write complex software like intricate web crawlers.\n"
