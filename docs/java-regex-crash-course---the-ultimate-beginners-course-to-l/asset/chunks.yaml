    One thing to note is that the spacing in code does matter. If you are creating
    a class, the content of that class will be indented once using the tab key in
    order for it to interpret that the code that the class has authority over is the
    tabbed code underneath it. Any code that is not tabbed underneath class is not
    part of that class. This goes the same for any function you create as well. As
    shown in the above example, a function is defined with a colon and tabbed content
    underneath it to indicate that it is part of that function.


    The way Python works is that it has classes, which are sections and functions
    which are subsections of the class. These classes can be declared as they are
    declared in the main program after the class is declared and then called with
    the functions that they carry within them. In this case, it is `Execute`. Again,
    this might not make sense right now but it will later on in the guide.


