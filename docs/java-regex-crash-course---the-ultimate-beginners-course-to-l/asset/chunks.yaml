  trans: "\n\n`Pattern.matches(\"[pqr]\", \"abcd\");` 将返回 false，因为文本中没有 p、q 或 r。\n\
    \n`Pattern.matches(\"[pqr]\", \"r\");` 返回 true，因为找到了 r。\n\n`Pattern.matches(\"\
    [pqr]\", \"pq\");` 返回 false，因为文本中可以包含其中一个，但不能两个都包含。\n\n元字符 `[` 和 `]`（左括号和右括号）用于在正则表达式中指定字符类。有时，我们将产生匹配的字符限制在一个特殊的字符集内。以下是各种字符类构造的示例列表：\n\
    \n1. **简单（Simple）**：由一组并排设置的字符组成，仅匹配这些字符。例如：`[abc]` 匹配字符 a、b 和 c。\n   让我们来看下面的例子：\n\
    \   `[csw]` cave 匹配 `[csw]` 中的 `c`，对应 `cave` 中的 `c`。\n\n2. **否定（Negation）**：以元字符\
    \ `^` 开头，仅匹配不在该类中的字符。\n   例如：`[^abc]` 匹配除 a、b 和 c 以外的所有字符字符。\n   我们来看第二个例子：\n\
    \   `[^csw]` cave 匹配 `a`、`v` 和 `e`，对应 `cave` 中的对应字符。\n\n3. **范围（Range）**：涉及从连字符元字符（`-`）左侧字符到连字符元字符右侧字符的所有字符，仅匹配该范围内的字符。\n\
    \   例如：`[a-z]` 匹配所有小写字母。\n   我们来看另一个例子：\n   `[a-c]` clown 匹配 `[a-c]` 中的 `c`，对应\
    \ `clown` 中的 `c`。\n\n4. **并集（Union）**：涉及多个嵌套的字符类，并匹配所有符合结果并集的字符。\n   例如：`[a-d[m-p]]`\
    \ 匹配从 `a` 到 `d` 以及 `m` 到 `p` 的字符。\n   我们来看第二个例子：\n   `[ab[c-e]]` abcdef 匹配 `a`、`b`、`c`、`d`\
    \ 和 `e`，对应 `abcdef` 中的对应字符。\n\n5. **交集（Intersection）**：涉及所有嵌套类中常见的字符，并仅匹配共同字符。\n\
    \   例如：`[a-z&&[d-f]]` 匹配字符 `d`、`e` 和 `f`。\n   其他例子：\n   `[aeiouy&&[y]]` party\
    \ 匹配 `[aeiou&&[y]]` 中的 `y`，对应 `party` 中的 `y`。\n\n6. **减法（Subtraction）**：涉及所有字符减去嵌套否定字符类中指定的字符，并匹配剩余字符。\n\
    \   例如：`[a-z&&[^m-p]]` 匹配从 `a` 到 `l` 以及 `q` 到 `z` 的字符。\n   以下命令行提供了第二个例子：\n  \
    \ `[a-f&&[^a-c]&&[^e]]` abcdefg 匹配 `d` 和 `f`，对应 `abcdefg` 中的对应字符。\n\n## 预字符类\n\
    \n| 字符 | 解释 |\n| :--- | :--- |\n| `.` | 等于点，任意字符（可能匹配也可能不匹配终止符） |\n| `\\d` | 等于数字：`[0-9]`\
    \ |\n| `\\D` | 等于非数字：`[⁰-9]` |\n| `\\s` | 等于空白字符：`[ \\t\\n\\x0B\\f\\r]` |\n| `\\\
    S` | 等于非空白字符：`[^\\s]` |\n| `\\w` | 等于单词字符 |\n| `\\W` | 等于非单词字符 |\n| `\\A` | 等于字符串开头。\
    \ |\n| `\\Z` | 等于字符串结尾。 |\n\n然而；在 Java 中，你需要对这些反斜杠进行“双重转义”。\n\n`String pattern\
    \ = \"\\\\d \\\\D \\\\W \\\\w \\\\S \\\\s\";`\n\n例如：\n`Pattern.matches(\"\\\\\
    d\", \"1\");` 将返回 true。\n`Pattern.matches(\"\\\\D\", \"z\");` 返回 true。\n`Pattern.matches(\"\
    .p\", \"qp\");` 返回 true，点(`.`) 代表任意字符。\n\n## 边界匹配器\n\n| 表达式 | 解释 |\n| :--- | :---\
    \ |\n| `^` | 等于行开头。 |\n| `$` | 等于行结尾。 |\n| `\\b` | 等于单词边界。 |\n| `\\B` | 等于非单词边界。\
    \ |\n| `\\A` | 等于输入文本的开头。 |\n| `\\G` | 等于上一次匹配的结尾 |\n| `\\Z` | 等于输入文本的结尾除去最后的终止符\
    \ |\n| `\\z` | 等于输入文本的结尾 |\n\n例如：\n`Pattern.matches(\"^Hello$\", \"Hello\")`:\
    \ 返回 true，以 Hello 开头并结尾\n`Pattern.matches(\"^Hello$\", \"Namaste!\")`: 返回 false，不以\
    \ Hello 开头\n`Pattern.matches(\"^Hello$\", \"Hello Namaste!\")`: 返回 false，不以 Hello\
    \ 结尾\n\n## 量词\n\n量词是一种将数值值与模式绑定的正则表达式构造。量词会对其左侧的表达式进行循环。该数值值确定了匹配模式的次数。我们有六种主要的量词，可以在三个类别中重复出现：贪婪、懒惰和占有。\n\
    \n### 贪婪量词（Greedy Quantifiers）\n贪婪量词将匹配与模式最长的字符串。\n\n| 量词 | 解释 |\n| :--- | :---\
    \ |\n| `?` | 次或无 |\n| `*` | 零或多次 |\n| `+` | 一次或多次 |\n| `{n}` | 精确 n 次 |\n| `{n,}`\
    \ | 至少 n 次 |\n| `{n,m}` | n 次到 m 次 |\n\n### 懒惰量词（Reluctant Quantifiers）\n懒惰量词用于匹配最短的字符串。\n\
    \n| 量词 | 解释 |\n| :--- | :--- |\n| `??` | 次或无 |\n| `*?` | 零或多次 |\n| `+?` | 一次或多次\
    \ |\n| `{n}?` | 精确 n 次 |\n| `{n,?}` | 至少 n 次 |\n| `{n,m}?` | n 次到 m 次 |\n\n###\
    \ 占有量词（Possessive Quantifiers）\n占有量词将匹配整个字符串。\n\n| 量词 | 解释 |\n| :--- | :--- |\n\
    | `?+` | 次或无 |\n| `*+` | 零或多次 |\n| `++` | 一次或多次 |\n| `{n}+` | 精确 n 次 |\n| `{n,}+`\
    \ | 至少 n 次 |\n| `{n,m}+` | n 次到 m 次 |\n\n### 量词示例代码\n\n```java\npackage sample.regex;\n\
    import java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class\
    \ DemoForQuantifiers {\n    static void main(String[] args) {\n        String\
    \ regex = \"a?\"; // 次或无\n        String regex1 = \"a*\"; // 零或多次\n        String\
    \ regex2 = \"a+\"; // 一次或多次\n        String regex3 = \"a{2}\"; // 精确 n 次\n   \
    \     String regex4 = \"a{2,}\"; // 至少 n 次\n        String regex5 = \"a{2,4}\"\
    ; // n 次到 m 次\n        String regex6 = \"a+\"; // \n\n        System.out.println(Pattern.matches(regex,\
    \ \"ab\")); // 返回 true，匹配一个 a \n        System.out.println(Pattern.matches(regex1,\
    \ \"aaaa\")); // 返回 true，匹配多个 a\n        System.out.println(Pattern.matches(regex2,\
    \ \"b\")); // 返回 false，没有 a\n\n        // 贪婪与懒惰的对比\n        String text = \"aaaaa\"\
    ;\n        Matcher m1 = Pattern.compile(\"a*\").matcher(text);\n        while\
    \ (m1.find()) {\n            System.out.println(m1.group()); // 贪婪会匹配尽可能多的\n \
    \       }\n\n        Matcher m2 = Pattern.compile(\"a*?\").matcher(text);\n  \
    \      while (m2.find()) {\n            System.out.println(m2.group()); // 懒惰会匹配最少的\n\
    \        }\n    }\n}\n```\n\n"
