    Password is valid : lastName2$ , true\n\n## 第 6 章\n\n### 邮箱正则表达式\n#### 正则表达式\n\
    `^[_A-Za-z0-9\\-+]+(\\.[A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\\.[A-Za-z0-9]+)*(\\.[A-Za-z]{2,})$`\n\
    \n#### 解释\n- `^`: 行的开头\n- `[_A-Za-z0-9\\-+]+`: 必须以 `[_A-Za-z0-9\\-+]` 开头，包含一个或多个（`+`）\n\
    - `(\\.[A-Za-z0-9-]+)*`: 后跟一个 `.` 和字符串 `[A-Za-z0-9-]`，包含一个或多个（`+`），组 #1 是可选的（`*`）\n\
    - `@`: 必须包含一个 `@` 符号\n- `[A-Za-z0-9-]+`: 后跟 `[A-Za-z0-9-]` 中的字符串，包含一个或多个（`+`）\n\
    - `(\\.[A-Za-z0-9]+)*`: 组 #2 - 第一级 TLD 检查（如 `.com`, `.net`），后跟一个 `.` 和字符串 `[A-Za-z0-9]`，包含一个或多个（`+`），组\
    \ #2 是可选的（`*`）\n- `(\\.[A-Za-z]{2,})`: 组 #3 - 第二级 TLD 检查（如 `.com.au`, `.com.my`），后跟一个\
    \ `.` 和 `[A-Za-z]` 中的字符串，最小长度为 2（`{2}`）\n- `$`: 行的结尾\n\n该正则表达式组合意味着，邮箱地址必须以 `[_A-Za-z0-9\\\
    -+]` 开头，可选后跟 `.[A-Za-z0-9-]`，并以 `@` 符号结尾。邮箱的域名必须以 `A-Za-z0-9-` 开头，后跟第一级 TLD（`.[A-Za-z0-9]`）以及可选后跟第二级\
    \ TLD（`.[A-Za-z]{2,}`），其中第二级 TLD 必须以点 `.` 开头且长度大于等于 2 个字符。\n\n### 示例\n```java\n\
