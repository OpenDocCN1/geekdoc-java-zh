    以下是我们使用 `REGEX` 时常见的错误：\n\n## 使用简单字符串匹配时的错误\n\n例如，让我们考虑想要在字符串：“asdfdfdasdfdfdf”中搜索“dfd”的出现次数。如果我们查看该字符串，它显示我们可以在\
