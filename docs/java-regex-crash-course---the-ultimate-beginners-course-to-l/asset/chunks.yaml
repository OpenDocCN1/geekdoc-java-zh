    \n`Pattern.matches(\"[pqr]\", \"pq\");` Return false as any one of them can be\
    \ in text not both.\n\nThe meta characters `[` and `]` (left and right brackets)\
    \ are used to specify a character class inside a regular expression. Sometimes\
    \ we limit the characters that produce matches to a special set of characters.\
    \ Here is the sample list of various character classes constructs:\n\n1. **Simple**:\
    \ consists in a group of characters set up side by side and matches only those\
    \ characters. Example: `[abc]` matches characters a, b, and c.\n   Let's take\
    \ a look at the following example:\n   `[csw]` cave matches `c` in `[csw]` with\
    \ `c` in `cave`.\n\n2. **Negation**: starts with the `^` meta-character and matches\
    \ only those characters not in that class.\n   Example: `[^abc]` matches all characters\
    \ except a, b, and c.\n   Let's see a second example:\n   `[^csw]` cave matches\
    \ `a`, `v`, and `e` with their counterparts in `cave`.\n\n3. **Range**: involves\
    \ all characters starting with the character on the left of a hyphen meta character\
    \ (`-`) and finishing with the character on the right of the hyphen meta character,\
    \ matching only those characters in that range.\n   Example: `[a-z]` matches all\
    \ lowercase alphabetic characters.\n   Let's see another example:\n   `[a-c]`\
    \ clown matches `c` in `[a-c]` with `c` in `clown`.\n\n4. **Union**: involves\
    \ multiple nested character classes and matches all characters that fit to the\
    \ resulting union.\n   Example: `[a-d[m-p]]` matches characters `a` through `d`\
    \ and `m` through `p`.\n   Let's see a second example:\n   `[ab[c-e]]` abcdef\
    \ matches `a`, `b`, `c`, `d`, and `e` with their counterparts in `abcdef`.\n\n\
    5. **Intersection**: involves characters usual to all nested classes and matches\
    \ only common characters.\n   Example: `[a-z&&[d-f]]` matches characters `d`,\
    \ `e`, and `f`.\n   Other example:\n   `[aeiouy&&[y]]` party matches `y` in `[aeiou&&[y]]`\
    \ with `y` in `party`.\n\n6. **Subtraction**: involve all characters less those\
    \ indicated in nested negation character classes and matches the remaining characters.\n\
    \   Example: `[a-z&&[^m-p]]` matches characters `a` through `l` and `q` through\
    \ `z`.\n   The following command line offers a second example:\n   `[a-f&&[^a-c]&&[^e]]`\
    \ abcdefg matches `d` and `f` with their counterparts in `abcdefg`.\n\n## Predefined\
    \ Character Classes\n\n| Character | Explanation |\n| :--- | :--- |\n| `.` | Equate\
    \ a Dot, any character (may or may not match line terminators) |\n| `\\d` | Equate\
