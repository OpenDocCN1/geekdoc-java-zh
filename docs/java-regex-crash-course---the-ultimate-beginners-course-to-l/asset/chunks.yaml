    # Chapter 1\n\n# Our First Steps in Java Regular Expressions\n\n## What Is Regex?\n\
    \nIn today world, almost all applications are required to process text for search\
    \ and validation. This process mostly involves complex logic and may result to\
    \ many complex and hectic codes which is very hard to understand.\n\nA regular\
    \ expression or REGEX is explained as a specific kind of text pattern that can\
    \ be used in many advanced applications and with any programming language. They\
    \ are used for searching, editing and manipulating data.\n\nFor example, using\
    \ regular expressions we can verify if a particular input string matches a given\
    \ text pattern or to find out a set of characters from a large batch of characters.\
    \ They are also used in replacing and re-arranging a block of text or splitting\
    \ a big chunk of data into smaller subsets. Regular expressions are generally\
    \ not language specific and follow a similar pattern in most of the programming\
    \ languages, but with slight variation.\n\nRegular expressions are powerful tools\
    \ and would reduce the time taken for processing a job, when your program needs\
    \ to manipulate or extract text on computer. By using them skillfully, regular\
    \ expressions help us to perform many tasks that wouldn’t be feasible at all.\n\
    \nRegular expressions are so useful in real life computing that, the various systems\
    \ and languages have evolved to provide both a fundamental and protracted standard\
    \ for the grammar and syntax for usage of modern regular expressions. Also Regular\
    \ expression processors are found in major of the search engines, search and replace\
    \ place-holders of various word processors and text editors, and in the command\
    \ lines of utilities that re used in processing text inputs.\n\nExample:\n\nLet’s\
    \ assume we need to validate the following email.\n\nString emailid = “ [xyz@abc.com](mailto:xyz@abc.com)”.\n\
    \nSteps required to validate: (For now are not interested in a valid email address\
    \ but just the format)\n\nJust validate the format with “@” symbol.\n\nThere must\
    \ be a character preceding and succeeding the “@” symbol without space.\n\nThe\
    \ text/ string preceding @ symbol must contain only characters, digit, underscores\
    \ and hyphen.\n\nThere should not be two @ symbols in the email address\n\nThere\
    \ should be a . in the domain name succeeding the @ symbol\n\nIf you need to verify\
    \ the above email id, without regular expressions, a program would need hundreds\
    \ of lines of code for implementation. We can use the emailid.indexOf (“@”) from\
    \ the String class for the first step of validation and then on keep adding lines\
    \ of code for the rest of the steps resulting in a tedious job of coding as well\
    \ as maintenance would be a nightmare after that.\n\npackage com.sample.regexsample;\n\
    \npublic  class ValidteEmail {\n\n public  static  void main(String[] args) {\n\
    \nString str1 = \"myname@abc.com\";\n\n int  x = str1.indexOf(\"@\");\n\n // returns\
    \ index of first character of the substring \"tutorials\"\n\n                           \
    \    System.out.println(\"index =  \" + x);\n\n              }\n\n}\n\nOutput:\n\
    \nIndex = 6.\n\nOnce after obtaining the index, further calculations are required\
    \ to find out if it is there are one to many characters in the domain name, followed\
    \ by a “.” Symbol and it end with 2 or 3 characters.\n\nThis is where regular\
    \ expression plays an important role .We can accomplish it in just one line of\
    \ code using the regex patterns. ( We’ll see the example codes in the coming chapters)\n\
    \npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\nimport\
    \ java.util.regex.Pattern;\n\npublic  class EmailValidator {\n\n public  static\
    \  void main(String[] args) {\n\nString input =\n\n \"^[_A-Za-z0-9-\\\\+]+([\\\
    \\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\\\\.[A-Za-z0-9]+)*(\\\\.[A-Za-z]{2,})$](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\"\
    ;  Regex For email … let’s discuss more on this in further chapters… Now we need\
    \ to understand Regex simplifies the process.\n\nString emailAddress =\"xyz@abc.com\"\
    ;\n\nPattern p = Pattern.compile(input);\n\nMatcher m = p.matcher(emailAddress);\n\
    \n                            System.out.println (\"The email 1 matches:\"+ m.matches());\n\
    \n              }\n\n}\n\n## Common Uses\n\nRegular expressions are majorly used\
    \ in a wide variety of text processing tasks, and more generally string processing,\
    \ where the data need not be textual. Common applications include data validation,\
    \ data scraping, data wrangling, simple parsing, the production of syntax highlighting\
    \ systems, and many other tasks."
