    \ index: 49 End index: 50  : €\nStart index: 57 End index: 58  : ¥\n\n# Chapter\
    \ 18\n\n# Common Mistakes While Using Regex\n\nThe following are the usual mistakes\
    \ when we use `REGEX`:\n\n## Mistake When Using a Simple String Matching\n\nFor\
    \ example, let us consider we want to search the string: “asdfdfdasdfdfdf” for\
    \ occurrences of “dfd”. If we look at the string, it says we can find it four\
    \ times in the `String`.\n\nLet’s use a regular expression to evaluate and find\
    \ out what our little Java program says.\n\n### Sample Code:\n```java\npackage\
    \ com.sample.regexsample;\n\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
