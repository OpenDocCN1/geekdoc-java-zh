- fmt: "\n```java\nSystem.out.println(\"The input \"+ input+ \" matches \"+matcher.matches());\n\
    }\n}\n```\n\nOutput:\nThe input KAREN matches false\nThe input JAVA CRAZY matches\
    \ true\nThe input KAREN NEX FROM ITALY matches true\nThe input test whether number\
    \ of words in input text is between some minimum and maximum limit matches false\n\
    \n## Limit the Number of Lines in Text\n\n### Pattern\n```regex\n^(?>[^\\r\\n]*(?>\\\
    r\\n?|\\n)){0,3}[^\\r\\n]*$\n```\n\n### Explanation\n- `^` : Assert position at\
    \ the beginning of the string. \n- `(?>` : Group but don't capture or keep backtracking\
    \ positions:\n    - `[^\\r\\n]*` : Match zero or more characters except CR and\
    \ LF.\n    - `(?>` : Group but don't capture or keep backtracking positions:\n\
    \        - `\\r\\n?` : Match a CR, with an optional following LF (CRLF).\n   \
    \     - `|` : Or:\n        - `\\n` : Match a standalone LF character.\n    - `)`\
    \ : End the noncapturing, atomic group.\n- `){0,4}` : End group; repeat between\
    \ zero and four times.\n- `[^\\r\\n]*` : Match zero or more characters except\
    \ CR and LF.\n- `$` : Assert position at the end of the string.\n\n### Sample\
    \ Code:\nVerification for zero to three input line\n```java\npackage com.sample.regexsample;\n\
    \nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class\
    \ DemoForInputLines {\n    public static void main(String[] args) {\n        StringBuilder\
    \ builder = new StringBuilder();\n        StringBuilder builder1 = new StringBuilder();\n\
    \        builder1.append(\"Test Line 1\");\n        builder1.append(\"\\n\");\n\
    \        builder1.append(\"Test Line 2\");\n        builder1.append(\"\\n\");\n\
    \        StringBuilder builder2 = new StringBuilder();\n        builder2.append(\"\
    Test Line 1\");\n        builder2.append(\"\\n\");\n        builder2.append(\"\
    Test Line 2\");\n        builder2.append(\"\\n\");\n        builder2.append(\"\
    Test Line 3\");\n        builder2.append(\"\\n\");\n        builder2.append(\"\
    Test Line 4\");\n        builder2.append(\"\\n\");\n        String regex = \"\\\
    \\A(?>[^\\r\\n]*(?>\\r\\n?|\\n)){0,3}[^\\r\\n]*\\\\z\";\n        Pattern pattern\
    \ = Pattern.compile(regex);\n        Matcher matcher = pattern.matcher(builder.toString());\n\
    \        System.out.println(\"Input 1 Zero lines  \"+matcher.matches());\n   \
    \     Matcher matcher1 = pattern.matcher(builder1.toString());\n        System.out.println(\"\
    Input 2 Zero lines   \"+matcher1.matches());\n        Matcher matcher2 = pattern.matcher(builder2.toString());\n\
    \        System.out.println(\"Input 3 Four lines   \"+matcher2.matches());\n \
    \   }\n}\n```\n\nOutput:\nInput 1 Zero lines true\nInput 2 Zero lines true\nInput\
