    \ a whitespace character: `[ \\t\\n\\x0B\\f\\r]` |\n| `\\S` | Equate a non-whitespace\
    \ character: `[^\\s]` |\n| `\\w` | Equate a word characters |\n| `\\W` | Equate\
    \ a non-word characters |\n| `\\A` | Equate beginning of string. |\n| `\\Z` |\
    \ Equate end of string. |\n\nHowever; in Java, you will need to “double escape”\
    \ these backslashes.\n\n`String pattern = \"\\\\d \\\\D \\\\W \\\\w \\\\S \\\\\
    s\";`\n\nFor e.g.\n`Pattern.matches(\"\\\\d\", \"1\");` would return true.\n`Pattern.matches(\"\
    \\\\D\", \"z\");` return true.\n`Pattern.matches(\".p\", \"qp\");` return true,\
    \ dot(`.`) represent any character.\n\n## Boundary Matchers\n\n| Expression |\
