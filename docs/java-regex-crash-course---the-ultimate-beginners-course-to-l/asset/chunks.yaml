    \ `-` : followed by a hypen\n- `d{2}` : Followed by a 2 digit number\n- `-` :\
    \ followed by a hypen\n- `d{4}` : Followed by a 4 digit Number\n- `$` : End of\
    \ the String\n\n### Sample Code:\n```java\npackage com.sample.regexsample;\n\n\
    import java.util.ArrayList;\nimport java.util.List;\nimport java.util.regex.Matcher;\n\
