    `\"(?<!Y.{0,40})X\"`\n\n# Find a pattern X if a Y doesn't exist between 0 to N\
    \ characters before the X.\n\n# Chapter 3: Java Regex Classes\n\nIn Java when\
    \ we work on complex projects, we encounter many inputs that commonly requires\
    \ code to equal text against patterns. It is this capability that is frequently\
    \ used in email header validation, text searches, and custom text creation from\
    \ generic text and so on.\n\n## Java String Methods\n\nBefore moving in to the\
    \ `java.util.regex` package, let us look at few of the methods provided by the\
    \ `java String` class for using regular Expressions. These methods can be used\
    \ for fewer simple validations. But if we are going to use regular expression\
    \ very often, these methods would be a performance overhead.\n\n### matches()\
    \ method\n\n`sampleString.matches (\"regex\")` returns true or false depending\
    \ whether the string can be matched entirely by the regular expression. An important\
    \ point to be remembered is that `String.matches()` only returns true if the entire\
    \ string can be matched.\n\nExample:\n```java\npackage com.sample.regexsample;\n\
    \npublic class DemoForStringMatches {\n    public static void main(String[] args)\
    \ {\n        // Prepare a regular expression to represent a pattern\n        String\
    \ regex = \".@.\";\n        // Try matching many strings against the regular expression\n\
    \        DemoForStringMatches.matchIt(\"a@k\", regex);\n        DemoForStringMatches.matchIt(\"\
    webmaster@jdojo.com\", regex);\n        DemoForStringMatches.matchIt(\"r@j\",\
    \ regex);\n        DemoForStringMatches.matchIt(\"a%N\", regex);\n        DemoForStringMatches.matchIt(\"\
    .@.\", regex);\n    }\n    public static void matchIt(String str, String regex)\
    \ {\n        // Test for pattern match\n        if (str.matches(regex)) {\n  \
    \          // Uses the match’s method of String\n            System.out.println(str\
    \ + \" matches the regex \" + regex);\n        } else {\n            System.out.println(str\
    \ + \" does not match the regex \" + regex);\n        }\n    }\n}\n```\nOutput:\n\
    ```\na@k matches the regex .@.\nwebmaster@jdojo.com does not match the regex .@.\n\
    r@j matches the regex .@.\na%N does not match the regex .@.\n.@ matches the regex\
    \ .@.\n```\n\n### replaceAll()\n\n`sampleString.replaceAll(\"regex\", \"replacement\"\
    )` replaces all regex matches inside the string with the replacement string. All\
    \ parts of the string that match the `regex` are replaced.\n\nExample:\n```java\n\
    package com.sample.regexsample;\n\npublic class DemoForAll {\n    public static\
    \ void main(String[] args) {\n        // Prepare a regular expression to represent\
    \ a pattern\n        String regex = \".@.\";\n        String replacementString\
    \ = \"***\";\n        // Try matching many strings against the regular expression\n\
    \        DemoForAll.replaceMatch(\"webd@koj\", regex, replacementString);\n  \
    \  }\n    public static void replaceMatch(String str, String regex, String replacementString)\
    \ {\n        // Test for pattern match\n        String newStr = str.replaceAll(regex,\
    \ replacementString);\n        System.out.println(regex + \" replaced \" + newStr);\n\
    \    }\n}\n```\nOutput:\n```\n.@ replaced ***oj\n```\n\n### replaceFirst()\n\n\
    The `replaceFirst()` method replaces the first occurrence of the match with the\
    \ `replacementString`. It returns the new string after replacement.\n\nSample:\n\
    ```java\npackage com.sample.regexsample;\n\npublic class DemoForReplaceFirst {\n\
    \    public static void main(String[] args) {\n        // Prepare a regular expression\
    \ to represent a pattern\n        String regex = \".@.\";\n        String replacementString\
    \ = \"***\";\n        // Try matching many strings against the regular expression\n\
    \        DemoForReplaceFirst.replaceMatch(\"A@BandH@G\", regex, replacementString);\n\
    \    }\n    public static void replaceMatch(String str, String regex, String replacementString)\
    \ {\n        // Test for pattern match\n        String newStr = str.replaceFirst(regex,\
    \ replacementString);\n        System.out.println(regex + \" replaced \" + newStr);\n\
    \    }\n}\n```\nOutput:\n```\n.@ replaced ***andH@G\n```\n\n### split()\n\n`sampleString.split(\"\
    regex\")` splits the string at each regex match. The return of this method will\
    \ be an array of strings, in which the elements are the original string between\
    \ two regex matches.\n\nExample:\n```java\npackage com.sample.regexsample;\n\n\
    public class DemoForSplit {\n    public static void main(String[] args) {\n  \
    \      String str = \"one-two-three\";\n        String[] temp; /* delimiter */\n\
    \        String delimiter = \"-\"; /* string will be split by the argument provided.\
    \ */\n        temp = str.split(delimiter); /* print substrings */\n        for\
    \ (int i =0; i < temp.length; i++) {\n            System.out.println(temp[i]);\n\
    \        }\n    }\n}\n```\nOutput:\n```\none\ntwo\nthree\n```\n\n## Java Util\n\
    \nThe `java.util.regex` package primarily consists of the following three classes:\
    \ (Source: Oracle Java documentation, www.docs.com)\n\n*   `Pattern` Class: A\
    \ compiled representation of a regular expression. The `Pattern` class provides\
    \ no public constructors. To create a pattern, you must first invoke one of its\
    \ public static `compile` methods, which will then return a `Pattern` object.\
    \ These methods accept a regular expression as the argument.\n*   `Matcher` Class:\
    \ A `Matcher` object is the engine that interprets the pattern and performs match\
    \ operations against an input string. Like the `Pattern` class, `Matcher` defines\
    \ no public constructors. You obtain a `Matcher` object by invoking the `matcher`\
    \ method on a `Pattern` object.\n*   `PatternSyntaxException`: A `PatternSyntaxException`\
    \ object is an unchecked exception that indicates a syntax error in a regular\
    \ expression.\n\nSample:\n```java\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\
    import java.util.regex.Pattern;\n\npublic class PatternSample {\n    public static\
    \ void main(String[] args) {\n        Pattern pattern = Pattern.compile(\".ab.\"\
    );\n        Matcher matcher = pattern.matcher(\"WabY\");\n        Matcher m1 =\
    \ pattern.matcher(\"WxxY\");\n        System.out.println(\"Input String matches\
    \ regex - +matcher.matches());\n        System.out.println(\"Input String matches\
    \ regex - +m1.matches());\n    }\n}\n```\nOutput of the above code is as follows:\n\
    ```\nInput String matches regex - true\nInput String matches regex - false\n```\n\
