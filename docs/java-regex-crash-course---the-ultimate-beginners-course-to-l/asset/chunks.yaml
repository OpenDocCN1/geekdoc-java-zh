  trans: "\n\n```java\nPattern p = Pattern.compile(reg);\nString str = \"http://www.a.com.\
    \ My name\";\nMatcher m = p.matcher(str);\nwhile (m.find()) {\n    String msg\
    \ = \":\" + m.group() + \":\";\n    System.out.println(msg);\n}\n```\nOutput:\n\
    ```\n:www.a.com.:\n```\n\n### 解释模式\n\n`(?<+http)\\\\S+`\n\n# 后行查找——从 http:// 开始直到遇到空白字符。即要检查的字符串前面应该是\
    \ http://\n\n### 否定向后零视 (Negative Look Behind)\n\n当你想要匹配前面不是某某些内容的内容时，就会使用否定向后零视。\n\
    \n#### 否定向后零视示例\n\n```java\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\
    import java.util.regex.Pattern;\n\npublic class DemoForNegativelookBehind {\n\
    \    public static void main(String[] args) {\n        Pattern p = Pattern.compile(\"\
    (?<!Y.{0,40})X\");\n        String txt = \"Y less than 40 before X\"; // 因为你想要'不'，所以这应该匹配失败。\n\
    \        Matcher m = p.matcher(txt);\n        System.out.println(m.find());\n\
    \        txt = \"Y less ddddddddddddddddddddddddd than 40 before X\"; // 因为你想要“不”，所以这应该匹配\n\
    \        m.reset(txt);\n        System.out.println(m.find());\n    }\n}\n```\n\
    Output:\n```\nfalse\ntrue\n```\n\n### 解释模式：\n`\"(?<!Y.{0,40})X\"`\n\n# 如果在 X 之前的\
    \ 0 到 N 个字符之间不存在 Y，则找到模式 X。\n\n# 第 3 章：Java 正则表达式类\n\n在 Java 中，当我们处理复杂项目时，会遇到许多输入，这些通常需要代码将文本与模式进行匹配。这种能力经常被用于邮件标头验证、文本搜索以及从通用文本创建自定义文本等。\n\
    \n## Java 字符串方法\n\n在进入 `java.util.regex` 包之前，让我们先看看 `java String` 类提供的几个用于使用正则表达式的方法。这些方法可以用于一些简单的验证。但如果我们打算频繁使用正则表达式，这些方法将会产生性能开销。\n\
    \n### matches() 方法\n\n`sampleString.matches (\"regex\")` 返回 true 或 false，取决于该字符串是否可以被正则表达式完全匹配。需要记住的一个重要点是，`String.matches()`\
    \ 只有在整个字符串都能被匹配时才返回 true。\n\n示例：\n```java\npackage com.sample.regexsample;\n\n\
    public class DemoForStringMatches {\n    public static void main(String[] args)\
    \ {\n        // 准备一个正则表达式来表示模式\n        String regex = \".@.\";\n        // 尝试用正则表达式匹配许多字符串\n\
    \        DemoForStringMatches.matchIt(\"a@k\", regex);\n        DemoForStringMatches.matchIt(\"\
    webmaster@jdojo.com\", regex);\n        DemoForStringMatches.matchIt(\"r@j\",\
    \ regex);\n        DemoForStringMatches.matchIt(\"a%N\", regex);\n        DemoForStringMatches.matchIt(\"\
    .@.\", regex);\n    }\n    public static void matchIt(String str, String regex)\
    \ {\n        // 测试模式匹配\n        if (str.matches(regex)) {\n            // 使用 String\
    \ 的 match 方法\n            System.out.println(str + \" matches the regex \" + regex);\n\
    \        } else {\n            System.out.println(str + \" does not match the\
    \ regex \" + regex);\n        }\n    }\n}\n```\nOutput:\n```\na@k matches the\
    \ regex .@.\nwebmaster@jdojo.com does not match the regex .@.\nr@j matches the\
    \ regex .@.\na%N does not match the regex .@.\n.@ matches the regex .@.\n```\n\
    \n### replaceAll()\n\n`sampleString.replaceAll(\"regex\", \"replacement\")` 将字符串内部所有的正则表达式匹配项替换为替换字符串。字符串中所有匹配\
    \ `regex` 的部分都会替换。\n\n示例：\n```java\npackage com.sample.regexsample;\n\npublic\
    \ class DemoForAll {\n    public static void main(String[] args) {\n        //\
    \ 准备一个正则表达式来表示模式\n        String regex = \".@.\";\n        String replacementString\
    \ = \"***\";\n        // 尝试用正则表达式匹配许多字符串\n        DemoForAll.replaceMatch(\"webd@koj\"\
    , regex, replacementString);\n    }\n    public static void replaceMatch(String\
    \ str, String regex, String replacementString) {\n        // 测试模式匹配\n        String\
    \ newStr = str.replaceAll(regex, replacementString);\n        System.out.println(regex\
    \ + \" replaced \" + newStr);\n    }\n}\n```\nOutput:\n```\n.@ replaced ***oj\n\
    ```\n\n### replaceFirst()\n\n`replaceFirst()` 方法将第一个出现的匹配项替换为 `replacementString`。它返回替换后的新字符串。\n\
    \n示例：\n```java\npackage com.sample.regexsample;\n\npublic class DemoForReplaceFirst\
    \ {\n    public static void main(String[] args) {\n        // 准备一个正则表达式来表示模式\n\
    \        String regex = \".@.\";\n        String replacementString = \"***\";\n\
    \        // 尝试用正则表达式匹配许多字符串\n        DemoForReplaceFirst.replaceMatch(\"A@BandH@G\"\
    , regex, replacementString);\n    }\n    public static void replaceMatch(String\
    \ str, String regex, String replacementString) {\n        // 测试模式匹配\n        String\
    \ newStr = str.replaceFirst(regex, replacementString);\n        System.out.println(regex\
    \ + \" replaced \" + newStr);\n    }\n}\n```\nOutput:\n```\n.@ replaced ***BandH@G\n\
    ```\n\n### split()\n\n`sampleString.split(\"regex\")` 根据正则表达式匹配分割字符串。该方法的返回值是一个字符串数组，其中的元素是两个匹配项之间的原始字符串。\n\
    \n示例：\n```java\npackage com.sample.regexsample;\n\npublic class DemoForSplit {\n\
    \    public static void main(String[] args) {\n        String str = \"one-two-three\"\
    ;\n        String[] temp; // 分隔符\n        String delimiter = \"-\"; // 字符串按提供的参数进行分割\n\
    \        temp = str.split(delimiter); // 打印子字符串\n        for (int i =0; i < temp.length;\
    \ i++) {\n            System.out.println(temp[i]);\n        }\n    }\n}\n```\n\
    Output:\n```\none\ntwo\nthree\n```\n\n## Java Util\n\n`java.util.regex` 主要由以下三个类组成：（来源：Oracle\
    \ Java 文，www.docs.com）\n\n*   `Pattern` 类：正则表达式的编译表示。`Pattern` 类没有公共构造函数。要创建模式，必须首先调用它的公共静态\
    \ `compile` 方法，然后将返回一个 `Pattern` 对象。这些方法接受正则表达式作为参数。\n*   `Matcher` 类：`Matcher`\
    \ 对象是解释模式并对输入字符串执行匹配操作的引擎。与 `Pattern` 类一样，`Matcher 没有定义公共构造函数。你通过在 `Pattern` 对象上调用\
    \ `matcher` 方法来获取 `Matcher` 对象。\n*   `PatternSyntaxException`：`PatternSyntaxException`\
    \ 对象是一个异常异常，指示正则表达式中的语法错误。\n\n示例：\n```java\npackage com.sample.regexsample;\n\n\
    import java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class\
    \ PatternSample {\n    public static void main(String[] args) {\n        Pattern\
    \ pattern = Pattern.compile(\".ab.\");\n        Matcher matcher = pattern.matcher(\"\
    WabY\");\n        Matcher m1 = pattern.matcher(\"WxxY\");\n        System.out.println(\"\
    Input String matches regex - \" + matcher.matches());\n        System.out.println(\"\
    Input String matches regex - \" + m1.matches());\n    }\n}\n```\n上述代码的输出如下：\n\
    ```\nInput String matches regex - true\nInput String matches regex - false\n```\n\
    示例代码解释：\n\n"
- fmt: "\nIn the above example, the `compile()` method of the `Pattern` class is used\
    \ to compile a regular expression that needs to be verified. Then the string to\
    \ be validated is passed using the `pattern.matcher()` method for verification\
    \ against the compiled regex.\n\nThe regex pattern used in the above example is\
    \ `.ab.` which says there should be one character before `ab` and one after it\
    \ and `ab` should be present in between them. Any string that follows this specific\
    \ pattern will return `true` for matching. Hence in the above example, the first\
    \ pattern `WabY` matches and returns `true` whereas `WxxY` does not match and\
    \ returns `false`.\n\n## Pattern Class Methods\n\n### Pattern.compile()\n\n`Pattern.compile()`\
    \ method is used for compiling a regular expression if we require to perform frequent\
    \ search occurrences of an expression or if we need to add any extra parameters\
    \ while performing a search (e.g. Like case insensitive search).\n\nThis is how\
    \ this method can be used for this case:\n\n```java\nString content = \"This is\
    \ a my regex\";\nString patternString = \".*reGeX\";\nPattern pattern = Pattern.compile(patternString,\
    \ Pattern.CASE_INSENSITIVE);\n```\n\nIn this code sample we have used a flag `Pattern.CASE_INSENSITIVE`\
    \ for case insensitive search, there are several other flags that can be used\
    \ for different purposes. The table below gives the list of flags that can be\
    \ used along with their embedded characters.\n\n| FLAGS | EXPLANATION |\n| :---\
    \ | :--- |\n| `Pattern.CANON_EQ` | Used for enabling canonical equivalence. This\
    \ flag is used when we need to match two expression only if there canonical decomposition\
    \ matches. |\n| `Pattern.CASE_INSENSITIVE` | Used when performing searches or\
    \ matching without considering the case of the expression |\n| `Pattern.COMMENTS`\
    \ | Allows whitespace and comments in the pattern. By using this flag, white spaces\
    \ and comment starting with `#` can be ignored in the expression. |\n| `Pattern.DOTALL`\
    \ | Used for enabling dotall mode. In this mode a `.` represents any character\
    \ including a line terminator. |\n| `Pattern.LITERAL` | Used of enabling the literal\
    \ parsing of the given expression. When this flag is used, the entire expression\
    \ given for validation is treated as literal characters and not as a whole string\
    \ |\n| `Pattern.MULTILINE` | Used for enabling multi line mode. By default the\
    \ meta characters `^` and `$` matches the beginning and ending of an expression.\
    \ But when this flag is used, these characters match before and after the line\
    \ terminator ie. `.` Symbol . |\n| `Pattern.UNICODE_CASE` | This flag is used\
    \ in combination with `CASE_INSENSITIVE` flag when we want to compare Unicode\
    \ cases ( Normally only ASCII characters are compared) |\n| `Pattern.UNIX_LINES`\
    \ | This flag enables the Unix lines mode. In this `\\n` is considered as line\
    \ terminator and not the `.` Character. |\n\nThese flags cane be embedded along\
    \ with the regular expression as a character itself. The following table gives\
    \ the embedded character equivalent of the flags.\n\n| FLAGS | EMBEDDED EQUIVALENT\
    \ |\n| :--- | :--- |\n| `Pattern.CANON_EQ` | None |\n| `Pattern.CASE_INSENSITIVE`\
    \ | `(?i)` |\n| `Pattern.COMMENTS` | `(?x)` |\n| `Pattern.MULTILINE` | `(?m)`\
    \ |\n| `Pattern.DOTALL` | `(?s)` |\n| `Pattern.LITERAL` | None |\n| `Pattern.UNICODE_CASE`\
    \ | `(?u)` |\n| `Pattern.UNIX_LINES` | `(?d)` |\n\n### Pattern.matches()\n\nThis\
    \ method is the simplest and easiest way available to search a `String` in a Text\
    \ using regex. For example, consider the code snippet given below:\n\n```java\n\
    package com.sample.regexsample;\n\nimport java.util.regex.Pattern;\n\npublic class\
    \ PatternSample {\n    public static void main(String[] args) {\n        String\
    \ content = \"This is my regex sample\";\n        String patternString = \".*regex.*\"\
    ;\n        boolean isMatch = Pattern.matches(patternString, content);\n      \
    \  System.out.println(\"The text contains 'tutorial'? \" + isMatch);\n    }\n\
    }\n```\n\nOutput:  \n`The text contains 'regex': true`\n\nAs given in the example,\
    \ we have used `matches()` method of `Pattern` class to search the pattern in\
    \ the given text. The pattern `.*regex.*` allows zero or more characters at the\
    \ beginning and end of the String `regex`.\n\n**Drawbacks:** Using this method\
    \ we can search a single occurrence of a pattern in a text. But if we need to\
    \ check for matching of multiple occurrences we should use the `Pattern.compile()`\
    \ method (discussed in the previous section) in conjunction with the `Pattern.matcher()`\
    \ method.\n\n### Pattern.matcher() method\n\nThis method is used to return the\
    \ instance of the `Matcher` class and is used to perform validations multiple\
    \ times or when grouping is used.\n\nConsider the example given below:\n\n```java\n\
    package com.sample.regexsample;\n\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
    \npublic class PatternSample {\n    public static void main(String[] args) {\n\
    \        String content = \"This is my regex sample\";\n        String patternString\
    \ = \".*rEgeX.*\";\n        Pattern pattern = Pattern.compile(patternString, Pattern.CASE_INSENSITIVE);\n\
    \        Matcher matcher = pattern.matcher(content);\n        boolean isMatched\
    \ = matcher.matches();\n        System.out.println(\"Is it a? \" + isMatched);\n\
    \    }\n}\n```\n\nOutput:  \n`Is it a? true`\n\n#### Multiple grouping\n\nIn the\
    \ code below, the `compile` and `matcher` methods are used to find string from\
    \ grouped.\n\n```java\npackage com.sample.regexsample;\n\nimport java.util.ArrayList;\n\
    import java.util.List;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
    \npublic class PatternSample {\n    public static void main(String[] args) {\n\
    \        String input = \"I have a cat, but I like dog.\";\n        String patternString\
    \ = \"(mouse|dog|bear|human)\";\n        Pattern p = Pattern.compile(patternString);\n\
    \        Matcher m = p.matcher(input);\n        List<String> animals = new ArrayList<>();\n\
    \        while (m.find()) {\n            System.out.println(\"Found a \" + m.group());\n\
    \            animals.add(m.group());\n        }\n    }\n}\n```\n\nOutput:  \n\
    `Found a cat`  \n`Found a dog`\n\n#### Pattern.split()\n\nThis method is used\
    \ to split a given text into multiple string based on a delimiter ( specified\
    \ using regex). Sample code shows how this method works.\n\n```java\npackage com.sample.regexsample;\n\
    \nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.regex.Matcher;\n\
    import java.util.regex.Pattern;\n\npublic class PatternSample {\n    public static\
    \ void main(String[] args) {\n        String text = \"ItIsRegexSample.ItProvidedByMe\"\
    ;\n        String patternString = \"is\";\n        Pattern pattern = Pattern.compile(patternString,\
    \ Pattern.CASE_INSENSITIVE);\n        String[] myStrings = pattern.split(text);\n\
