    \ args[]) throws Exception {\n\nString regex = \"John (?!Heins)[A-Z]\\\\w+\";\n\
    \nPattern pattern = Pattern.compile(regex);\n\nString candidate = \"I think that\
    \ John Heins \";\n\n candidate += \"is a fictional character. His real name \"\
    ;\n\n candidate += \"might be John Jackson, John Westling, \";\n\n candidate +=\
    \ \"or John Holmes for all we know.\";\n\nMatcher matcher = pattern.matcher(candidate);\n\
    \nString tmp = null;\n\n while (matcher.find()) {\n\n tmp = matcher.group();\n\
    \n                    System.out.println(\"MATCH:\" + tmp);\n\n                 \
    \ }\n\n                }\n\n}\n\nOutput\n\nMATCH:John Jackson\n\nMATCH:John Holmes\n\
    \nExplaining the pattern:\n\n\"John (?!Heins)[A-Z][\\\\w](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)+\"\
    ;\n\nJohn  # the pattern should start with John\n\n(?!Heins) # It should not contain\
    \ the word Heins\n\n(A-Z)[\\\\w](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)+ # John Should\
    \ be followed by a word that begins with capital letter followed by any word.\n\
    \nIn the above example though we have John Westling, it doesn’t match because\
    \ it does not begin with a capital letter\n\n### Positive Look Behind\n\nPositive\
    \ lookbehind is used if you want to match something that should be preceded by\
    \ some pattern or string\n\nSample for positive look-behind\n\npackage com.sample.regexsample;\n\
    \nimport java.util.regex.Matcher;\n\nimport java.util.regex.Pattern;\n\npublic\
    \  class DemoforPositiveLookBehind {\n\n public  static  void main(String[] args)\
