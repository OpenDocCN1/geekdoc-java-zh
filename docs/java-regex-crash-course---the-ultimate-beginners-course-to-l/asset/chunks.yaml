  raw: "In the above example, the compile() method of the Pattern class is used to\
    \ compile a regular expression that needs to be verified. Then the string to be\
    \ validated is passed using the pattern.matcher() method for verification against\
    \ the compiled regex.\n\nThe regex pattern used in the above example is “.ab.”\
    \ which says there should be one character before ab and one after it and “ab”\
    \ should be present in between them. Any string that follows this specific pattern\
    \ will return true for matching. Hence in the above example, the first patter\
    \ “WabY” matches and returns true where as “WxxY” does not match and returns false.\n\
    \n### Pattern Class Methods\n\n#### Pattern.compile()\n\nPattern.compile() method\
    \ is used for compiling a regular expression if we require to perform frequent\
    \ search occurrences of an expression or if we need to add any extra parameters\
    \ while performing a search (e.g. Like case insensitive search).\n\nThis is how\
    \ this method can be used for this case.\n\nString content = \"This is a my regex\"\
    ;\n\nString patternString = \".*reGeX\";\n\nPattern pattern = Pattern.compile(patternString,\
    \ Pattern.CASE_INSENSITIVE);\n\nIn this code sample we have used a flag Pattern.CASE_INSENSITIVE\
    \ for case insensitive search, there are several other flags that can be used\
    \ for different purposes. The table below gives the list of flags that can be\
    \ used along with their embedded characters.\n\n| FLAGS |                            \
    \ EXPLANATION |\n\n| Pattern.CANON_EQ | Used for enabling canonical equivalence.\
    \ This flag is used when we need to match two expression only if there canonical\
    \ decomposition matches. |\n\n| Pattern.CASE_INSENSITIVE | Used when performing\
    \ searches or matching without considering the case of the expression |\n\n| Pattern.COMMENTS\
    \ | Allows whitespace and comments in the pattern.  By using this flag, white\
    \ spaces and comment starting with # can be ignored in the expression. |\n\n|\
    \ Pattern.DOTALL | Used for enabling dotall mode. In this mode a “.” represents\
    \ any character including a line terminator. |\n\n| Pattern.LITERAL | Used of\
    \ enabling the literal parsing of the he given expression. When this flag is used,\
    \ the entire expression given for validation is treated as literal characters\
    \ and not as a whole string |\n\n| Pattern.MULTILINE | Used for enabling multi\
    \ line mode. By default the meta characters ^ and $ matches the beginning and\
    \ ending of an expression. But when this flag is used, these characters match\
    \ before and after the line terminator ie. “.” Symbol . |\n\n| Pattern.UNICODE_CASE\
    \ | This flag is used in combination with CASE_INSENSITIVE flag when we want to\
    \ compare Unicode cases ( Normally only ASCII characters are compared) |\n\n|\
    \ Pattern.UNIX_LINES | This flag enables the Unix lines mode. In this “/n” is\
    \ considered as line terminator and not the “.” Character. |\n\nThese flags cane\
    \ be embedded along with the regular expression as a character itself. The following\
    \ table gives the embedded character equivalent of the flags.\n\n|                       \
    \ FLAGS |                 EMBEDDED EQUIVALENT |\n\n| Pattern.CANON_EQ | None |\n\
    \n| Pattern.CASE_INSENSITIVE | (?i) |\n\n| Pattern.COMMENTS | (?x) |\n\n| Pattern.MULTILINE\
    \ | (?m) |\n\n| Pattern.DOTALL | (?s) |\n\n| Pattern.LITERAL | None |\n\n| Pattern.UNICODE_CASE\
    \ | (?u) |\n\n| Pattern.UNIX_LINES | (?d) |\n\n#### Pattern.matches()\n\nThis\
    \ method is the simplest and easiest way available to search a String in a Text\
    \ using regex. For example, consider the code snippet given below:\n\npackage\
    \ com.sample.regexsample;\n\nimport java.util.regex.Pattern;\n\npublic  class\
    \ PatternSample {\n\n public  static  void main(String[] args) {\n\nString content\
    \ = \"This is my regex sample\";\n\nString patternString = \".*regex.*\";\n\n\
    \ boolean  isMatch = Pattern.matches(patternString, content);\n\n        System.out.println(\"\
    The text contains 'tutorial'? \" + isMatch);\n\n    }\n\n}\n\nOutput:\n\nThe text\
    \ contains 'regex': true\n\nAs given in the example, we have used matches() method\
    \ of Pattern class to search the pattern in the given text. The pattern .*regex.*\
    \ allows zero or more characters at the beginning and end of the String “regex”.\n\
    \nDrawbacks: Using this method we can search a single occurrence of a pattern\
    \ in a text. But if we need to check for matching of multiple occurrences we should\
    \ use the Pattern.compile() method (discussed in the previous section) in conjunction\
    \ with the Pattern.matcher() method .\n\n#### Pattern.matcher() method\n\nThis\
    \ method is used to return the instance of the Matcher class and is used to perform\
    \ validations multiple times or when grouping is used.\n\nConsider the example\
    \ given below:\n\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\
    \nimport java.util.regex.Pattern;\n\npublic  class PatternSample {\n\n public\
    \  static  void main(String[] args) {\n\nString content = \"This is my regex sample\"\
    ;\n\nString patternString = \".*rEgeX.*\";\n\nPattern pattern = Pattern.compile(patternString,\
    \ Pattern.CASE_INSENSITIVE);\n\nMatcher matcher = pattern.matcher(content);\n\n\
    \ boolean  isMatched = matcher.matches();\n\n        System.out.println(\"Is it\
    \ a Match?\" + isMatched);\n\n    }\n\n}\n\nOutput:\n\nIs it a Match?true\n\n\
    #### Multiple grouping sample\n\nIn the below code provided, the compile and matcher\
    \ methods are used to find string from a grouped expression.\n\npackage com.sample.regexsample;\n\
    \nimport java.util.ArrayList;\n\nimport java.util.List;\n\nimport java.util.regex.Matcher;\n\
    \nimport java.util.regex.Pattern;\n\npublic  class PatternSample {\n\n public\
    \  static  void main(String[] args) {\n\nString input = \"I have a cat, but I\
    \ like my dog better.\";\n\nString patternString = \"(mouse|cat|dog|wolf|bear|human)\"\
    ;\n\nPattern p = Pattern.compile(patternString);\n\nMatcher m = p.matcher(input);\n\
    \nList<String> animals = new ArrayList<String>();\n\n while (m.find()) {\n\n             \
    \                             System.out.println(\"Found a \" + m.group() + \"\
    .\");\n\n animals.add(m.group());\n\n    }\n\n}\n\n}\n\nOutput:\n\nFound a cat.\n\
    \nFound a dog.\n\nNote : m.find()- What is this? Well we would discuss that in\
    \ the next part when we discuss the Matcher class.\n\n#### Pattern.split()\n\n\
    This method is used to split a given text into multiple string based on a delimiter\
    \ ( specified using regex). Sample code below shows how this method works.\n\n\
    package com.sample.regexsample;\n\nimport  java.util.ArrayList;\n\nimport  java.util.List;\n\
    \nimport  java.util.regex.Matcher;\n\nimport java.util.regex.Pattern;\n\npublic\
    \  class PatternSample {\n\n public  static  void main(String[] args) {\n\nString\
    \ text = \"ItIsRegexSample.ItISProvidedByMe\";\n\n // Pattern for delimiter\n\n\
    String patternString = \"is\";\n\nPattern pattern = Pattern.compile(patternString,\
    \ Pattern.CASE_INSENSITIVE);\n\nString[] myStrings = pattern.split(text);\n\n\
    \ for(String temp: myStrings){\n\n                                System.out.println(temp);\n\
    \n                            }\n\n                            System.out.println(\"\
    Number of split strings: \"+myStrings.length);\n\n    }\n\n}\n\nIn the above code\
    \ snippet , “is” is used as a delimiter to split the text “ItIsRegexSample.ItISProvidedByMe”.\
    \ The output of the above sample is given below.\n\nOutput\n\nIt\n\nRegexSample.It\n\
    \nProvidedByMe\n\nNumber of split strings: 3\n\n### The Matcher Class Methods\n\
    \nIn the previous section when discussing the matcher() method of the Pattern\
    \ class, we created an instance of the Matcher class. It is  used for multiple\
    \ searches and grouped searches. Code sample is given below for reference\n\n\
    #### Creating a Matcher instance\n\nString content = \"Some text\";\n\nString\
    \ patternString = \".*somestring.*\";\n\nPattern pattern = Pattern.compile(patternString);\n\
    \nMatcher matcher = pattern.matcher(content);\n\nThe pattern.matcher() method\
    \ returns an instance of the Matcher class. Using this instance we can access\
    \ the other methods of the Matcher class.\n\n#### Matches() method\n\nThis method\
    \ is used to match the regular expression against the whole string provided  to\
    \ the Pattern.matcher() method while creating Matcher instance.\n\nCode Snippet:\n\
    \nPattern pattern = Pattern.compile(patternString, Pattern.CASE_INSENSITIVE);"
