    ```\n\n## Match Something at the Start and/or the End of Line\n\n### Pattern\n\
    `^wordToSearch`\n\n### Explanation:\n- `^`: State the position at the beginning\
    \ of the String\n- `wordToSearch`: The word to be searched\n\n### Pattern:\n`wordToSearch$`\n\
    \n### Explanation:\n- `wordToSearch`: The word to be searched\n- `$`: State the\
    \ position at the end of the string.\n\n### MultiLine Search Pattern\n`(?m)^wordToSearch`\n\
    \n### Explanation:\n- `(?m)`: Enable multiline mode\n- `^`: State the position\
    \ at the beginning of the String\n- `wordToSearch`: The word to be searched\n\n\
    ### Pattern\n`(?m)wordToSearch$`\n\n### Explanation:\n- `(?m)`: Enable multiline\
    \ mode\n- `wordToSearch`: The word to be searched\n- `$`: State the position at\
    \ the end of the string.\n\n### Sample Code for single line mode:\n```java\npackage\
