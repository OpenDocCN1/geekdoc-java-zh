  trans: "\n\n在上面的示例中，`Pattern` 类的 `compile()` 方法被用于编译需要验证的正则表达式。然后，使用 `pattern.matcher()`\
    \ 方法传递要验证的字符串，以便对已编译的正则进行比对。\n\n上述示例中使用的正则模式为 `.ab.`，它表示 `ab` 之前有一个字符，之后有一个字符，并且\
    \ `ab` 在它们之间存在。任何遵循此特定模式的字符串在匹配时将返回 `true`。因此，在上面的示例中，第一个模式 `WabY` 匹配并返回 `true`，而\
    \ `WxxY` 则不匹配并返回 `false`。\n\n## Pattern 类方法\n\n### Pattern.compile()\n\n`Pattern.compile()`\
    \ 方法用于编译正则表达式，如果我们我们需要频繁搜索某个表达式的出现，或者在执行搜索时需要添加任何额外参数（例如不忽略大小写的搜索）。\n\n该方法在该场景下的用法：\n\
    \n```java\nString content = \"This is a my regex\";\nString patternString = \"\
    .*reGeX\";\nPattern pattern = Pattern.compile(patternString, Pattern.CASE_INSENSITIVE);\n\
    ```\n\n在这个代码示例中，我们使用了标志 `Pattern.CASE_INSENSITIVE` 进行不忽略大小写的搜索，还有其他几个标志可以用于不同的目的。下表给出了这些标志列表及其嵌入字符。\n\
    \n| 标志 | 解释 |\n| :--- | :--- |\n| `Pattern.CANON_EQ` | 用于启用规范化等效性。当我们需要仅在两个表达式的规范化分解匹配时才匹配它们，使用此标志。\
    \ |\n| `Pattern.CASE_INSENSITIVE` | 用于在执行搜索或匹配时不考虑表达式的大小。 |\n| `Pattern.COMMENTS`\
    \ | 允许在模式中使用空白和注释。通过使用此标志，可以忽略表达式中的空格和以 `#` 开头的注释。 |\n| `Pattern.DOTALL` | 用于启用点模式（dotall\
    \ mode）。在此模式下，`..` 代表任何字符，包括换行符。 |\n| `Pattern.LITERAL` | 用于启用给定表达式的字面解析。使用此标志时，用于验证的整个表达式被视为字面字符，而不是整个字符串。\
    \ |\n| `Pattern.MULTILINE` | 用于启用多行模式。默认情况下，元字符 `^` 和 `$` 匹配表达式的开头和结尾。但使用此标志时，这些字符匹配换行符之前和之后，即\
    \ `.` 符号。 |\n| `Pattern.UNICODE_CASE` | 此标志与 `CASE_INSENSITIVE` 标志结合使用，当我们想要比较\
    \ Unicode 大写时（通常只比较 ASCII 字符）。 |\n| `Pattern.UNIX_LINES` | 此标志启用 Unix 行模式。在此模式下，`\\\
    n` 被视为换行符而不是 `.` 字符。 |\n\n这些标志可以作为字符本身嵌入正则表达式中。下表给出了这些标志的嵌入等效值。\n\n| 标志 | 嵌入等效值\
    \ |\n| :--- | :--- |\n| `Pattern.CANON_EQ` | 无 |\n| `Pattern.CASE_INSENSITIVE`\
    \ | `(?i)` |\n| `Pattern.COMMENTS` | `(?x)` |\n| `Pattern.MULTILINE` | `(?m)`\
    \ |\n| `Pattern.DOTALL` | `(?s)` |\n| `Pattern.LITERAL` | 无 |\n| `Pattern.UNICODE_CASE`\
    \ | `(?u)` |\n| `Pattern.UNIX_LINES` | `(?d)` |\n\n### Pattern.matches()\n\n该方法是使用正则表达式在文本中搜索\
    \ `String` 最简单、方便的方法。例如，考虑下面的代码片段：\n\n```java\npackage com.sample.regexsample;\n\
    \nimport java.util.regex.Pattern;\n\npublic class PatternSample {\n    public\
    \ static void main(String[] args) {\n        String content = \"This is my regex\
    \ sample\";\n        String patternString = \".*regex.*\";\n        boolean isMatch\
    \ = Pattern.matches(patternString, content);\n        System.out.println(\"The\
    \ text contains 'tutorial'? \" + isMatch);\n    }\n}\n```\n\n输出：  \n`The text\
    \ contains 'regex': true`\n\n如示例所示，我们使用了 `Pattern` 类的 `matches()` 方法在给定文本中搜索模式。模式\
    \ `.*regex.*` 允许在字符串 `regex` 的开头和结尾有零或多个字符。\n\n**缺点：** 使用此方法我们可以在文本中搜索模式的单次出现。但如果我们我们需要检查多次出现的匹配，应该结合\
    \ `Pattern.compile()` 方法（在上一节讨论过）和 `Pattern.matcher()` 方法使用。\n\n### Pattern.matcher()\
    \ 方法\n\n此方法用于返回 `Matcher` 类的实例，用于执行多次验证或在使用分组时。\n\n考虑下面的示例：\n\n```java\npackage\
    \ com.sample.regexsample;\n\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
    \npublic class PatternSample {\n    public static void main(String[] args) {\n\
    \        String content = \"This is my regex sample\";\n        String patternString\
    \ = \".*rEgeX.*\";\n        Pattern pattern = Pattern.compile(patternString, Pattern.CASE_INSENSITIVE);\n\
    \        Matcher matcher = pattern.matcher(content);\n        boolean isMatched\
    \ = matcher.matches();\n        System.out.println(\"Is it a? \" + isMatched);\n\
    \    }\n}\n```\n\n输出：  \n`Is it a? true`\n\n#### 多分组\n\n在下面的代码中，`compile` 和 `matcher`\
    \ 方法用于从分组中查找字符串。\n\n```java\npackage com.sample.regexsample;\n\nimport java.util.ArrayList;\n\
    import java.util.List;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
    \npublic class PatternSample {\n    public static void main(String[] args) {\n\
    \        String input = \"I have a cat, but I like dog.\";\n        String patternString\
    \ = \"(mouse|dog)|bear|human\";\n        Pattern p = Pattern.compile(patternString);\n\
    \        Matcher m = p.matcher(input);\n        List<String> animals = new ArrayList<>();\n\
    \        while (m.find()) {\n            System.out.println(\"Found a \" + m.group());\n\
    \            animals.add(m.group());\n        }\n    }\n}\n```\n\n输出：  \n`Found\
    \ a cat`  \n`Found a dog`\n\n#### split\n\n此方法根据分隔符（使用正则表达式指定）将给定文本分割为多个字符串。示例显示了该方法如何工作。\n\
    \n```java\npackage com.sample.regexsample;\n\nimport java.util.ArrayList;\nimport\
    \ java.util.List;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
    \npublic class PatternSample {\n    public static void main(String[] args) {\n\
    \        String text = \"ItIsRegexSample.ItProvidedByMe\";\n        String patternString\
    \ = \"is\";\n        Pattern pattern = Pattern.compile(patternString, Pattern.CASE_INSENSITIVE);\n\
    \        String[] myStrings = pattern.split(text);\n        for (String temp :\
    \ myStrings) {\n            System.out.println(temp);\n        }\n        System.out.println(\"\
    Number of split strings: \"+myStrings.length);\n    }\n}\n```\n\n输出：  \n`It` \
    \ \n`RegexSample.It`  \n`ProvidedByMe`  \n`Number of split strings: 3`\n\n## Matcher\
    \ 类方法\n\n在上一节讨论 `Pattern` 类的 `matcher()` 方法时，我们创建了 `Matcher` 类的实例。它用于多次搜索和分组搜索。下面提供了代码示例供参考。\n\
    \n### 创建 Matcher 实例\n\n```java\nString content = \"Some text\";\nString patternString\
    \ = \".*somestring.*\";\nPattern pattern = Pattern.compile(patternString);\nMatcher\
    \ matcher = pattern.matcher(content);\n```\n\n### Matches() 方法\n\n此方法用于在创建 Matcher\
    \ 实例时，对传递给 `Pattern.matcher()` 方法的整个字符串进行正则表达式匹配。\n\n```java\nPattern pattern\
    \ = Pattern.compile(patternString, Pattern.CASE_INSENSITIVE);\n```\n\n"
- fmt: "\n`Matcher matcher = pattern.matcher(content);`\n\n`boolean isMatched = matcher.matches();`\n\
    \n### lookingAt()\n\nThis method is similar to `matches()` method ,except that\
    \ it matches the regular expression only against the starting of the text, while\
    \ `matches()` search in the whole text.\n\nCode snippet:\n\n```java\npackage com.sample.regexsample;\n\
    \nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class\
    \ PatternSample {\n    public static void main(String[] args) {\n        String\
    \ REGEX = \"Saa\";\n        String INPUT = \"SaaaaaaaS\";\n        Pattern pattern\
    \ = Pattern.compile(REGEX);\n        Matcher matcher = pattern.matcher(INPUT);\n\
    \        System.out.println(\"Current REGEX is: \"+REGEX);\n        System.out.println(\"\
    Current INPUT is: \"+INPUT);\n        System.out.println(\"lookingAt(): \"+matcher.lookingAt());\n\
    \        System.out.println(\"matches(): \"+matcher.matches());\n    }\n}\n```\n\
    \nOutput:\n```\nCurrent REGEX is: Saa\nCurrent INPUT is: SaaaaaaaS\nlookingAt():\
    \ true\nmatches(): false\n```\n\nIn the above example, the `lookingAt()` method\
    \ returns `true` whereas the `matches()` method returns `false` because, it matches\
    \ the whole string, whereas the other method just compares the beginning.\n\n\
    ### find()\n\nThis method is used for searching the occurrences of the regular\
    \ expressions in the text. It is frequently used when we are searching for multiple\
    \ occurrences of a string within a huge chunk of data.\n\nCode snippet:\n\n```java\n\
    package com.sample.regexsample;\n\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
    \npublic class PatternSample {\n    public static void main(String[] args) {\n\
    \        String REGEX = \"too\";\n        String INPUT = \"too\";\n        Pattern\
    \ p = Pattern.compile(REGEX);\n        Matcher m = p.matcher(INPUT); // get a\
    \ matcher object\n        while(m.find()) {\n            System.out.println(\"\
    start(): \"+m.start());\n            System.out.println(\"end(): \"+m.end());\n\
    \        }\n    }\n}\n```\n\nOutput:\n```\nstart(): 0\nend(): 3\n```\n\n### find(int\
    \ start)\n\nThis method attempts to find the subsequence of the input sequence\
    \ that equals the pattern, starting at the specified index.\n\n#### 1) start()\
    \ and end()\n\nBoth these methods are generally used in combination with the `find()`\
    \ method. The `start` method is used for getting the start index and the `end`\
    \ method for getting the end index of a string or match that is being searched\
    \ using the `find()` method. This method returns `int` value.\n\nCode snippet:\n\
    \n```java\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\
    import java.util.regex.Pattern;\n\npublic class PatternSample {\n    public static\
    \ void main(String[] args) {\n        String content = \"I have a big and beautiful\
    \ house and a good car\";\n        String string = \"and\";\n        Pattern pattern\
    \ = Pattern.compile(string);\n        Matcher matcher = pattern.matcher(content);\n\
    \        while(matcher.find()) {\n            System.out.println(\"Found at: \"\
    + matcher.start() + \" - \" + matcher.end());\n        }\n    }\n}\n```\n\nOutput:\n\
    ```\nFound at: 13 - 16\nFound at: 33 - 36\n```\n\n#### 2) start(int group) and\
    \ end(int group)\n\nThese are overloaded methods of `start` and `end`. These methods\
    \ are used when grouping is used to find a start or end index of an expression\
    \ from a particular group.\n\nCode snippet:\n\n```java\npackage com.sample.regexsample;\n\
    \nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class\
    \ PatternSample {\n    public static void main(String[] args) {\n        String\
    \ REGEX = \"(cat)(s)\";\n        String INPUT = \"cat cat cat\";\n        Pattern\
    \ p = Pattern.compile(REGEX);\n        Matcher m = p.matcher(INPUT); // get a\
    \ matcher object\n        int count = 0;\n        while(m.find()) {\n        \
    \    count++;\n            System.out.println(\"start(1): \"+m.start(1));\n  \
    \          System.out.println(\"end(1): \"+m.end(1));\n            System.out.println(\"\
    start(2): \"+m.start(2));\n            System.out.println(\"end(2): \"+m.end(2));\n\
    \        }\n    }\n}\n```\n\nOutput:\n```\nstart(1): 8\nend(1): 11\nstart(2):\
    \ 11\nend(2): 19\n```\n\n### appendReplacement(StringBuffer sb, String replacement)\n\
    \nIt reads characters from the input sequence, starting at the append position,\
    \ and appends them to the given buffer. After this it appends the given string\
    \ to the string buffer to create a new text.\n\nCode Snippet:\n\n```java\npackage\
    \ com.sample.regexsample;\n\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
    \npublic class PatternSample {\n    public static void main(String[] args) {\n\
    \        Pattern p = Pattern.compile(\"dog\");\n        Matcher m = p.matcher(\"\
    one dog dogs in the house\");\n        StringBuffer sb = new StringBuffer();\n\
    \        while (m.find()) {\n            m.appendReplacement(sb, \"rabbit\");\n\
    \        }\n        m.appendTail(sb);\n        System.out.println(sb.toString());\n\
    \    }\n}\n```\n\nOutput:\n```\none rabbit rabbits in the house\n```\n\n### appendTail(StringBuffer\
    \ sb)\n\nThis method is used in conjunction with the `appendReplacement()` method\
    \ to form the new string after replacement.\n\n### replaceAll(String replacement)\n\
    \nThis method substitute every subset of the input string that matches the given\
    \ pattern with the replacement string provided.\n\n```java\npackage com.sample.regexsample;\n\
    \nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class\
    \ PatternSample {\n    public static void main(String[] args) {\n        String\
    \ input = \"aaahorsebbbccchorse\";\n        String patternString = \"horse\";\n\
