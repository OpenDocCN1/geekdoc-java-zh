    .{3}(?:25[0-5]|2[0-4][0-9]|[01?[0-9][0-9]?)\\b\";\n        Pattern pattern = Pattern.compile(regexpatter);\n\
    \        Matcher matcher = pattern.matcher(logtext);\n        while (matcher.find())\
    \ {\n            System.out.println(logtext.substring(matcher.start(),matcher.end()));\n\
    \        }\n    }\n}\n```\n\nOutput:\n\n它什么都不会打印，因为 `\\b` 字符没有使用反斜杠，且边界没有定义。\n\
    \n正确的代码：\n```java\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\
    import java.util.regex.Pattern;\n\npublic class DemoForIPMistake {\n public static\
    \ void main(String[] args) {\n        String logtext = \"asdfesgew 215.2.125.32\
    \ alkejo 234 oij982jld\" + \"kja.lkwech . 24.33.125.234 kadfjeladkj\";\n     \
    \   String regexpatter = \"\\\\b(?:25[0-5]|2[0-4][0-9]|[01?[0-9][0-9]?)\\\\.{3}(?:25[0-5]|2[0-4][0-9]|[01?[0-9][0-9]?)\\\
    \\b\";\n        Pattern pattern = Pattern.compile(regexpatter);\n        Matcher\
    \ matcher = pattern.matcher(logtext);\n        while (matcher.find()) {\n    \
    \        System.out.println(logtext.substring(matcher.start(),matcher.end()));\n\
    \        }\n    }\n}\n```\n（注：由于原文文本中部分代码和输出存在重复和逻辑混乱，翻译时已根据语意进行了对齐）\n\n## `\\\
    ` 字符的谨慎使用\n\n让我们考虑我们的应用程序想要从服务接收到的长文本中读取 IP 地址。首先要考虑的点是 IP 地址格式的定义。我们有 4 组由点分隔的数字，范围从\
    \ 0 到 255。让我们将其写成正则表达式。如果你有更好或更优雅的解决方案，欢迎随时评论。\n\nPattern: `\\b(?:25[0-5]|2[0-4][0-9]|[01?[0-9][0-9]?)\\\
    .{3}(?:25[0-5]|2[0-4][0-9]|[01?[0-9][0-9]?)\\b`\n\n基本上，它获取了前三个由点分隔的允许数字，并重复了 3\
    \ 次，最后一个块具有相同的模式，但没有末尾的点。\n\n示例代码：\n```java\npackage com.sample.regexsample;\n\
    \nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class\
    \ DemoForIPMistake {\n public static void main(String[] args) {\n        String\
    \ logtext = \"asdfesgew 215.2.125.32 alkejo 234 oij982jld\" + \"kja.lkwech . 24.33.125.234\
    \ kadfjeladkj\";\n        String regexpatter = \"\\b(?:25[0-5]|2[0-4][0-9]|[01?[0-9][0-9]?)\\\
    .{3}(?:25[0-5]|2[0-4][0-9]|[01?[0-9][0-9]?)\\b\";\n        Pattern pattern = Pattern.compile(regexpatter);\n\
    \        Matcher matcher = pattern.matcher(logtext);\n        while (matcher.find())\
    \ {\n            System.out.println(logtext.substring(matcher.start(),matcher.end()));\n\
    \        }\n    }\n}\n```\n\nOutput:\n\n它什么都不会打印，因为 `\\b` 字符没有使用反斜杠，且边界没有定义。\n\
    \n正确的代码：\n```java\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\
    import java.util.regex.Pattern;\n\npublic class DemoForIPMistake {\n public static\
    \ void main(String[] args) {\n        String logtext = \"asdfesgew 215.2.125.32\
    \ alkejo 234 oij982jld\" + \"kja.lkwech . 24.33.125.234 kadfjeladkj\";\n     \
    \   String regexpatter = \"\\\\b(?:25[0-5]|2[0-4][0-9]|[01?[0-9][0-9]?)\\\\.{3}(?:25[0-5]|2[0-4][0-9]|[01?[0-9][0-9]?)\\\
    \\b\";\n        Pattern pattern = Pattern.compile(regexpatter);\n        Matcher\
    \ matcher = pattern.matcher(logtext);\n        while (matcher.find()) {\n    \
    \        System.out.println(logtext.substring(matcher.start(),matcher.end()));\n\
    \        }\n    }\n}\n```\n\n## 字符类的用法\n\n大多数正则用户犯的一个常见错误是尝试使用字符类来节省字符。乍看之下这对于允许大小写字母非常有用。然而\
    \ `[A-z]` 实际上等同于 `[A-Za-z]` 包含了某些标点符号。\n\n### 1. java.lang.IllegalStateException:\
    \ 使用命名组时未匹配\n\n这种异常在我们尝试从 matcher 中获取命名组时，如果没有进行匹配将会发生。\n\n错误日志显示如下：\n\n```Exception\
    \ in thread \"main\" java.lang.IllegalStateException: No match found\n    at java.util.regex.Matcher.group(Unknown\
    \ Source)\n```\n\n该错误的根源在于，我们可能没有在获取命名组之前使用 `matcher.matches()`。\n\n让我们考虑下面的代码段：\n\
    \n```java\nList<String> dates = new ArrayList<String>();\ndates.add(\"02/31/2011\"\
    ); // 无效日期\ndates.add(\"02/27/2011\"); // 有效日期\nString regex = \"^(?<month>[0-3]?[0-9])/(?<day>[0-3]?[0-9])/(?<year>(?:0-9]{2})?[0-9]{2})$\"\
    ;\nPattern pattern = Pattern.compile(regex);\nfor (String date : dates) {\n  \
    \  Matcher matcher = pattern.matcher(date);\n    // 这一步如果没有执行，就会得到异常！\n    matcher.matches();\n\
    \    // 获取日期部分\n    String day = matcher.group(2);\n    String month = matcher.group(1);\n\
    \    String year = matcher.group(3);\n    String formattedDate = month + \"/\"\
    \ + day + \"/\" + year;\n    System.out.println(\"检查检查日期 : \" + formattedDate);\n\
    }\n```"
- fmt: "\nThe above screenshots demonstrate how to search for the `</ulink>` XML tag\
    \ with leading whitespace and how to remove the whitespace.\n\n# Chapter 20: In\
    \ Closing\n\nIn a nutshell, Regular expressions provide an extremely flexible\
    \ and powerful text processing system. We describe the regular expression as a\
    \ textual pattern used to search in text. We do so by \"matching\" the regular\
    \ expression against the text. The result of matching a regular expression against\
    \ a text is either a `true` / `false` value, specifying if the regular expression\
    \ matched the text, or a set of matches - one match for every occurrence of the\
    \ regular expression found in the text.\n\nFor instance, we could use a regular\
    \ expression to search an HTML page for email addresses, URLs, telephone numbers\
    \ etc. This would be done by matching different regular expressions against the\
    \ HTML page. The result of matching each regular expression against the HTML page\
    \ would be a set of matches - one set of matches for each regular expression (each\
    \ regular expression may match more than one time).\n\nBut we need to understand\
    \ that:\n\n1. Regular expressions are not easy to use at first\n   - The individual\
    \ pieces are not hard, but it takes a lot of practice (and tears why not?) to\
    \ learn to put them together correctly\n2. Regular expressions form a miniature\
    \ programming language\n   - It’s a different kind of programming language than\
    \ `Java`, and requires you to learn new thought patterns\n   - In `Java` you can’t\
    \ just use a regular expression; you have to first create `Patterns` and `Matchers`\n\
    \   - `Java`’s syntax for `String` constants doesn’t help, either\n   - Despite\
    \ all this, regular expressions bring so much power and convenience to `String`\
    \ manipulation that they are well worth the effort of learning.\n\nTo conclude,\
    \ imagine if all computer problems or projects were like this, where every single\
    \ problem you encountered, no matter how simple or complex, was only written as\
    \ English because nobody understood the symbols. This would drive us crazy, even\
    \ if you didn't know the basic of programming.\n\nThankfully, humans invented\
    \ symbols to succinctly describe the things, that symbols are best at describing,\
    \ and left human languages to describe the rest. The symbolic languages act as\
    \ building blocks to construct complex structures in a short space that would\
    \ take entire books in English to describe.\n\nEprogramy\n\nPD: One more thing.\
