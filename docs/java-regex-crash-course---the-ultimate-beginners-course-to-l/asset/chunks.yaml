    \               alternation: match any one of the sections of this group\n\nread             \
    \               match the text ‘read\n\n… and so on\n\n### Modifying/Substitution\n\
    \nUsing Regular Expression, values in text can be substitute with new values.\
    \ Let´s see, you could change all instances of the word ‘userId=’, followed by\
    \ a number, with a “screen” to hide the original text.\n\nSample:\n\npackage com.sample.regexsample;\n\
    \nimport java.util.regex.Matcher;\n\nimport java.util.regex.Pattern;\n\npublic\
    \  class MaskingDemo {\n\n public  static  void main(String[] args) {\n\nString\
    \ input =\n\n \"User userId=23421\\. Some more userId=33432\\. This is userNum=100\"\
    ;\n\nPattern p = Pattern.compile(\"(userId=)(\\\\d+)\");\n\nMatcher m = p.matcher(input);\n\
    \nStringBuffer result = new StringBuffer();\n\n while (m.find()) {\n\n             \
    \                             System.out.println(\"Masking: \" + m.group(2));\n\
    \n m.appendReplacement(result, m.group(1) + \"***masked***\");\n\n             \
    \               }\n\n m.appendTail(result);\n\n                            System.out.println(result);\n\
    \n              }\n\n}\n\nOutput\n\nMasking: 23421\n\nMasking: 33432\n\nUser userId=***masked***.\
    \ Some more userId=***masked***. This is userNum=100\n\nExplanation of the pattern\n\
    \n\"(userId=)(\\\\d+)\"\n\n(userId=)               group everything within the\
    \ parenthesis as group 1\n\nuserId=              equal the text ‘userId=’\n\n\
    (\\\\d+)                            group everything within the parenthesis as\
    \ group 2\n\n\\\\d+                            equal one or more digits\n\n###\
    \ Match One of Many Characters\n\nUsing [] meta characters and different combinations\
    \ of characters , we can match one of the many characters present . For example,\
    \ lets create a regular expression to match all common spellings like cat, bat,\
    \ rat or mat, so you can find this word in a document.\n\nExample:\n\nb|m|r|c[a][ts]\n\
    \nSample Code:\n\npackage com.sample.regexsample;\n\nimport java.util.ArrayList;\n\
    \nimport java.util.List;\n\nimport java.util.regex.Matcher;\n\nimport java.util.regex.Pattern;\n\
    \npublic  class SampleGrouping {\n\n public  static  void main(String[] args)\
    \ {\n\nString input = \"I have a cat, dog, mat,cas and rat.\";\n\nPattern p =\
    \ Pattern.compile(\"(c|d|r|m)[a][ts]\");\n\nMatcher m = p.matcher(input);\n\n\
    List<String> animals = new ArrayList<String>();\n\n while (m.find()) {\n\n             \
    \                             System.out.println(\"Found a \" + m.group() + \"\
    .\");\n\n animals.add(m.group());\n\n                            }\n\n             \
    \ }\n\n}\n\nOutput:\n\nFound a cat.\n\nFound a mat.\n\nFound a cas.\n\nFound a\
    \ rat.\n\n### Using Special Constructs\n\nSpecial constructs are used when we\
    \ want to find a piece of text when it came before another pattern in that string?\
    \ Or to find a piece of text that was not followed by another piece of text? Normally,\
    \ with standard string searching, we require to write a somewhat complex function\
    \ to perform the exact operation you wanted. This can, however, all be done on\
    \ one line using regular expressions.\n\n### Look Ahead & Look Behind\n\nLook-ahead\
    \ and look-behind operations are similar to grouping but  these patterns do not\
    \ capture values. Therefore, using these constructs, no values will be stored\
    \ for later retrieval, and they do not affect group numbering. Look-ahead operations\
    \ look forward, starting from their location in the pattern, continuing to the\
    \ end of the input. Look-behind expressions do not search backwards, but instead\
    \ start at the beginning of the pattern and continue up to/until the look-behind\
    \ expression.\n\nE.g.:\n\nWe need to ensure in our input string the word “incident”\
    \ must be present but that the word “theft” should not be found anywhere. We can\
    \ use a negative look-ahead to ensure that there are no occurrences.\n\n“(?!.*theft).*incident.*”\n\
    \nThis expression exhibits the following behavior:\n\n\"There was a crime incident\"\
                                              matches\n\n\"The incident involved a\
    \ theft\"                                          does not match\n\n\"The theft\
    \ was a serious incident\"                            does not match\n\nLook ahead\
    \ are of 2 types. Positive look ahead and negative look ahead\n\n### Positive\
    \ Look Ahead\n\nPositive lookahead is used if you want to match something that\
    \ should be followed by some pattern or string.\n\nSample Code for positive look\
    \ ahead\n\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\
    \nimport java.util.regex.Pattern;\n\npublic  class DemoForPositiveLookAhead {\n\
    \n public  static  void main(String args[]) {\n\nString regex = \"(?=^255).*\"\
    ;\n\nPattern pattern = Pattern.compile(regex);\n\nString candidate = \"255.0.0.1\"\
    ;\n\nMatcher matcher = pattern.matcher(candidate);\n\nString ip = \"not found\"\
    ;\n\n if (matcher.find())\n\n ip = matcher.group();\n\nString msg = \"ip: \" +\
    \ ip;\n\n                                  System.out.println(msg);\n\n             \
    \                 }\n\n}\n\nOutput:\n\nip: 255.0.0.1\n\nExplaining the pattern\
    \ used:\n\n\"(?=^255).*\";\n\n(?=^255)    # This denotes a positive look ahead\
    \ and should start with 255\n\n.*          # Could be followed by anything\n\n\
    ### Negative Look Ahead\n\nNegative lookahead is used if you want to match something\
    \ not followed by something else.\n\nSample Code for Negative Look – ahead\n\n\
    package com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\nimport java.util.regex.Pattern;\n\
