    - `)` : 组 #2 结束\n- `$` : 字符串结束\n\n该正则表达式意味着：必须有 1 个或多个字符串（非空格），后面跟着一个点并以 `jpg`\
    \ 或 `png` 或 `bmp` 结尾，且文件扩展名忽略大小写。这个正则表达式非常适用于许多扩展名检查示例，你可以修改最后的组合 `(jpg, png,\
