    \ Let's go step by step together.\n\nLet´s get started!\n\nEprogramy Team\n\n\
    # Chapter 1: Our First Steps in Java Regular Expressions\n\n## What Is Regex?\n\
    \nIn today world, almost all applications are required to process text for search\
    \ and validation. This process mostly involves complex logic and may result to\
    \ many complex and hectic codes which is very hard to understand.\n\nA regular\
    \ expression or `REGEX` is explained as a specific kind of text pattern that can\
    \ be used in many advanced applications and with any programming language. They\
    \ are used for searching, editing and manipulating data.\n\nFor example, using\
    \ regular expressions we can verify if a particular input string matches a given\
    \ text pattern or to find out a set of characters from a large batch of characters.\
    \ They are also used in replacing and re-arranging a block of text or splitting\
    \ a big chunk of data into smaller subsets. Regular expressions are generally\
    \ not language specific and follow a similar pattern in most of the programming\
    \ languages, but with slight variation.\n\nRegular expressions are powerful tools\
    \ and would reduce the time taken for processing. By using them skillfully, we\
    \ can perform tasks that wouldn’t be feasible.\n\nExample:\nLet’s assume we need\
    \ to validate the following email.\n\n```java\nemailid = \"xyz@abc.com\"\n```\n\
    \nSteps required to validate:\n1. There must be an `@` symbol.\n2. The text preceding\
    \ the `@` must contain only characters, digits, underscores and hyphens.\n3. There\
    \ should not be two `@` symbols in the email.\n4. There should be a `.` in the\
    \ domain name succeeding the `@` symbol.\n5. It should end with 2 or 3 characters.\n\
    \nIf you need to verify the above email without regular expressions, a program\
    \ would need hundreds of lines of code.\n\n```java\npackage com.sample.regexsample;\n\
    \npublic class Validte {\n    public static void main(String[] args) {\n     \
    \   String str1 = \"myname@abc.com\";\n        int x = str1.indexOf(\"@\"); //\
    \ returns index of first character of the substring\n        System.out.println(\"\
    index = \" + x);\n    }\n}\n```\n\nOutput:\n`Index = 6.`\n\nOnce after obtaining\
    \ the index, further calculations are required to find out if there are one to\
    \ many characters in the domain name, followed by a `.` symbol. This is where\
    \ regular expression plays an important role. We can accomplish it in just one\
    \ line of code using the regex patterns.\n\n```java\npackage com.sample.regexsample;\n\
    \nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class\
    \ EmailValidator {\n    public static void main(String[] args) {\n        String\
