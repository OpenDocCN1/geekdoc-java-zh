  raw: "Pattern p = Pattern.compile(reg);\n\nString str = \"http://www.a.com. My name\"\
    ;\n\nMatcher m = p.matcher(str);\n\n while (m.find()) {\n\nString msg = \":\"\
    \ + m.group() + \":\";\n\n                                  System.out.println(msg);\n\
    \n                                }\n\n}\n\n}\n\nOutput\n\n:www.a.com.:\n\nExplaining\
    \ the pattern\n\n(?<+http://)[\\\\S](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)+\n\n\
    # look – behind starting with http:// until a white space is encountered. i.e.\
    \ the string to be checked should be preceded by http://\n\n### Negative Look\
    \ Behind\n\nNegative lookbehind is used if you want to match something not preceded\
    \ by something else.\n\nSample for negative look-behind\n\npackage com.sample.regexsample;\n\
    \nimport java.util.regex.Matcher;\n\nimport java.util.regex.Pattern;\n\npublic\
    \  class DemoForNegativelookBehind {\n\n public  static  void main(String[] args)\
    \ {\n\nPattern p = Pattern.compile(\"(?<!Y.{0,40})X\");\n\nString txt = \"Y less\
    \ than 40 before X\"; // Since you want 'not' then this should fail to match.\n\
    \nMatcher m = p.matcher(txt);\n\n        System.out.println(m.find());\n\n txt\
    \ = \"Y less ddddddddddddddddddddddddd than 40 before X\"; // Since you want 'not'\
    \ this should match\n\n m.reset(txt);\n\n        System.out.println(m.find());\n\
    \n              }\n\n}\n\nOutput:\n\nfalse\n\ntrue\n\nExplaining the pattern:\n\
    \n\"(?<!Y.{0,40})X\"\n\n# Find a pattern X if a Y doesn't exist between 0 to N\
    \ characters before the X.\n\n# Chapter 3\n\n# Java Regex Classes\n\nIn Java when\
    \ we work on complex projects, we encounter many inputs that commonly requires\
    \ code to equal text against patterns. It is this capability that is frequently\
    \ used in email header validation, text searches, and custom text creation from\
    \ generic text and so on.\n\n## Java String Methods\n\nBefore moving in to the\
    \ java.util.regex package, let us look at few of the methods provided by the java\
    \ String class for using regular Expressions. These methods can be used for fewer\
    \ simple validations. But if we are going to use regular expression very often,\
    \ these methods would be a performance overhead\n\n.\n\n### matches() method\n\
    \nsampleString.matches (\"regex\") returns true or false depending whether the\
    \ string can be matched entirely by the regular expression. An important point\
    \ to be remembered is that String.matches() only returns true if the entire string\
    \ can be matched.\n\nExample:\n\npackage com.sample.regexsample;\n\npublic  class\
    \ DemoForStringMatches {\n\n public  static  void main(String[] args) {\n\n //\
    \ Prepare a regular expression to represent a pattern\n\nString regex = \".@.\"\
    ;\n\n // Try matching many strings against the regular expression\n\n             \
    \               DemoForStringMatches.matchIt(\"a@k\", regex);\n\n             \
    \               DemoForStringMatches.matchIt(\"webmaster@jdojo.com\", regex);\n\
    \n                            DemoForStringMatches.matchIt(\"r@j\", regex);\n\n\
                                DemoForStringMatches.matchIt(\"a%N\", regex);\n\n\
                                DemoForStringMatches.matchIt(\".@.\", regex);\n\n\
                                }\n\n public  static  void matchIt(String str, String\
    \ regex) {\n\n // Test for pattern match\n\n if (str.matches(regex)) { Uses the\
    \ match’s method of String class\n\n                            System.out.println(str\
    \ + \" matches the regex \" + regex);\n\n                            }\n\n else\
    \ {\n\n                            System.out.println(str + \" does not match\
    \ the regex \" + regex);\n\n                            }\n\n                           \
    \ }\n\n}\n\nOutput:\n\na@k matches the regex .@.\n\nwebmaster@jdojo.com does not\
    \ match the regex .@.\n\nr@j matches the regex .@.\n\na%N does not match the regex\
    \ .@.\n\n.@. matches the regex .@.\n\n### replaceAll()\n\nsampleString.replaceAll(\"\
    regex\", \"replacement\") replaces all regex matches inside the string with the\
    \ replacement string you specified.  All parts of the string that match the regex\
    \ are replaced.\n\nExample:\n\npackage com.sample.regexsample;\n\npublic  class\
    \ DemoForReplaceAll {\n\n public  static  void main(String[] args) {\n\n // Prepare\
    \ a regular expression to represent a pattern\n\nString regex = \".@.\";\n\nString\
    \ replacementString =\"***\";\n\n // Try matching many strings against the regular\
    \ expression\n\n                            DemoForReplaceAll.replaceMatch(\"\
    webd@koj\", regex, replacementString);\n\n                            }\n\n public\
    \  static  void replaceMatch(String str, String regex, String replacementString\
    \ ) {\n\n // Test for pattern match\n\nString newStr = str.replaceAll(regex, replacementString);\n\
    \n                            System.out.println(regex + \" replaced \" + newStr);\n\
    \n                            }\n\n}\n\nOutput:\n\n.@. replaced web***oj\n\n###\
    \ replaceFirst()\n\nThe replaceFirst() method replaces the first occurrence of\
    \ the match with the replacementString. It returns the new string after replacement.\n\
    \nSample:\n\npackage com.sample.regexsample;\n\npublic  class DemoForReplaceFirst\
    \ {\n\n public  static  void main(String[] args) {\n\n // Prepare a regular expression\
    \ to represent a pattern\n\nString regex = \".@.\";\n\nString replacementString\
    \ =\"***\";\n\n // Try matching many strings against the regular expression\n\n\
                                DemoForReplaceFirst.replaceMatch(\"A@BandH@G\", regex,\
    \ replacementString);\n\n                            }\n\n public  static  void\
    \ replaceMatch(String str, String regex, String replacementString ) {\n\n // Test\
    \ for pattern match\n\nString newStr = str.replaceFirst(regex, replacementString);\n\
    \n                            System.out.println(regex + \" replaced \" + newStr);\n\
    \n                            }\n\n}\n\nOutput\n\n.@. replaced ***andH@G\n\n###\
    \ split()\n\nsampleString.split(\"regex\") splits the string at each regex match.\
    \ The return of this method will be an array of strings, in which the elements\
    \ are the original string between two regex matches.\n\nExample:\n\npackage com.sample.regexsample;\n\
    \npublic  class DemoForSplit {\n\n public  static  void main(String[] args) {\n\
    \nString str = \"one-two-three\";\n\nString[] temp;\n\n /* delimiter */\n\nString\
    \ delimiter = \"-\";\n\n /* given string will be split by the argument delimiter\
    \ provided. */\n\n temp = str.split(delimiter);\n\n /* print substrings */\n\n\
    \ for(int  i =0; i < temp.length ; i++)\n\n                                System.out.println(temp[i]);\n\
    \n              }\n\n}\n\nOutput:\n\none\n\ntwo\n\nthree\n\n## Java Util Regex\n\
    \nThe java.util.regex package primarily consists of the following three classes:\
    \ (Source: Oracle Java documentation, www.docs.oracle.com)\n\n*   Pattern Class: A\
    \ Pattern object is a compiled representation of a regular expression. The Pattern\
    \ class provides no public constructors. To create a pattern, you must first invoke\
    \ one of its public static compile methods, which will then return a Pattern object.\
    \ These methods accept a regular expression as the first argument. \n\n*   Matcher\
    \ Class: A Matcher object is the engine that interprets the pattern and performs\
    \ match operations against an input string. Like the Pattern class, Matcher defines\
    \ no public constructors. You obtain a Matcher object by invoking the matcher\
    \ method on a Pattern object.\n\n*   PatternSyntaxException: A PatternSyntaxException\
    \ object is an unchecked exception that indicates a syntax error in a regular\
    \ expression pattern.\n\nSample:\n\npackage com.sample.regexsample;\n\nimport\
    \ java.util.regex.Matcher;\n\nimport java.util.regex.Pattern;\n\npublic  class\
    \ PatternSample {\n\n public  static  void main(String[] args) {\n\nPattern pattern\
    \ = Pattern.compile(\".ab.\");\n\nMatcher matcher = pattern.matcher(\"WabY\");\n\
    \nMatcher m1 = pattern.matcher(\"WxxY\");\n\n        System.out.println(\"Input\
    \ String matches regex - \"+matcher.matches());\n\nSystem.out.println(\"Input\
    \ String matches regex - \"+m1.matches());\n\n                                            \
    \                             }\n\n}        \n\nOutput of the above code is as\
    \ follows:\n\n              Input String matches regex - true\n\nInput String\
    \ matches regex - false\n\nSample Code Explanation:"
