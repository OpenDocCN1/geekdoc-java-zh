  \ 章\n\n# 用于国际号码的正则表达式\n\n## 正则表达式\n`^\\+(?:[0-9]\\s*?){6,14}[0-9]$`\n\n### 解释\n\
  ```\n^                               # 断言位于字符串开头。\n\\+                         \
