  .{3}(?:25[0-5]|2[0-4][0-9]|[01?[0-9][0-9]?)\\b\";\n        Pattern pattern = Pattern.compile(regexpatter);\n\
  \        Matcher matcher = pattern.matcher(logtext);\n        while (matcher.find())\
