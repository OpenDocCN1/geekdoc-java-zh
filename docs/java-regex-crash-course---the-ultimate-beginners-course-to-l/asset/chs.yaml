  )                               # 非捕获分组结束。\n{6,14}                          # 重复分组\
  \ 6 到 14 次。\n[0-9]                           # 匹配一个数字\n$                       \
  \        # 断言位于字符串结尾。\n```\n\n### 示例：\n```java\npackage com.sample.regexsample;\n\
