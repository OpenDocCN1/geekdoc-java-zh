  s*=\\s*(\\\"([^\"]*\\\")|'[^']*'|([^'\">\\s]+));`\n\n### 描述\n```\n(            \
  \                    # 第 1 组开始\n?i                              # 所有检查不区分大小写\n)\
  \                                # 第 1 组结束\n<a                              # 以\
  \ \"<a\" 开头\n(                                # 第 2 组开始\n[^>]+                 \
  \          # 匹配除(\">\")以外的任意字符，至少一个\n)                                # 第 2 组结束\n\
  >                               # 紧跟 \">\"\n(.+?)                           # 匹配任意内容\n\
  </a>                            # 以 \"</a>\" 结尾\n\\s*                          \
  \   # 可以以空格开头\n(?i)                            # 所有检查不区分大小写\nhref              \
  \              # 后跟 \"href\" 单词\n\\s*=\\s*                         # 允许等号两边有空格\n\
  (                                # 第 1 组开始\n\"([^\"]*\")                       #\
  \ 允许带双引号的字符串 - \"string\"\n|\n'[^']*'                         # ..或者带单引号的字符串 - 'string'\n\
  |\n([^'\">\\s]+)                     # ..或者不包含单引号、双引号、\">\n)                   \
  \             # 第 1 组结束\n```\n\n### 代码：\n```java\npackage com.sample.regexsample;\n\
  import java.util.Vector;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
  \npublic class DemoForLink {\n    String HTML_A_TAG_PATTERN = \"(?i)<a([^>]+)>(.+?)</a>\"\
