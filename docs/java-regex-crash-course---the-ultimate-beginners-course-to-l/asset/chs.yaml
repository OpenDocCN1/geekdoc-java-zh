  \ Eprogramy，我们希望你学习如何用一种新语言交流：编程语言。这种语言允许我们使用电脑或笔记本电脑进行创作。\n\n也许道路是艰难且艰辛的，但我们将为读者提供工具让学习变得有趣且富有成效。我们将展示学习如何编程所需的所有方面。从基础字母到解决最常见的编程问题，以及更多、更多内容。始终会有大量示例的帮助，这将有助于更好地理解。\n\
  \n我们知道自己在做什么，并相信你完全有能力吸收我们的教学。\n\n未来的门已经开启。让我们一起一步步前进吧。\n\n让我们开始吧！\n\nEprogramy\
  \ 团队\n\n# 第 1 章：Python 编程语言\n\n## Python 的历史\n\nPython 被称为初学者的首选语言，因为它被全球计算机程序员推荐为适合初学者学习的好门语言。这不应被误认为是基于它的强大。\n\
  \nPython 语言由 Guido Von Rossum 于 1990 年在荷兰的数学中心（Stichting Mathematisch Centrium）创建。该语言实际上是由一个大型志愿者团队开发的，并开放修改。在它所处的开发阶段，它已经包含了具有继承关系的类、异常处理、函数以及\
  \ `list`、`dict`、`str` 等核心数据类型。\n\n2000 年 5 月，Guido 和 Python 开发团队移动到 BeOpen.com 组成\
  \ BeOpen PythonLabs 团队。同年，PythonLabs 团队移动到 Digital Creations，现在被称为 Zope Corporation。\n\
  \nPython `2.0` 于 2000 年 10 月 16 日发布，其特性包括垃圾回收器，这有助于维护编程中的内存处理相关问题。Python 的伟大之处在于它有社区的支持，并且在利用\
  \ Python 的用户背后有一套透明的机制。\n\n之后，Python `3.0` 作为一个重大的不后兼容版本在经过长时间测试后，于 2008 年 12 月\
  \ 3 日发布。`3.0` 的主要特性也回移植到了 Python `2.6` 和 `2.7`。\n\nPython 版本发布日期：\n\n- Python `1.0`\
  \ - 1994 年\n- Python `1.5` - 1997 年 12 月 31 日\n- Python `1.6` - 2000 年 9 月 5 日\n\
  - Python `2.0` - 2000 年 10 月 16 日\n- Python `2.1` - 2001 年 4 月 17 日\n- Python `2.2`\
  \ - 2001 年 12 月 21 日\n- Python `2.3` - 2003 年 7 月 29 日\n- Python `2.4` - 2004 年\
  \ 11 月 30 日\n- Python `2.5` - 2006 年 9 月 19 日\n- Python `2.6` - 2008 年 10 月 1 日\n\
  - Python `2.7` - 2010 年 7 月 3 日\n- Python `3.0` - 2008 年 12 月 3 日\n- Python `3.1`\
  \ - 2009 年 6 月 27 日\n- Python `3.2` - 2011 年 2 月 20 日\n- Python `3.3` - 2012 年 9\
  \ 月 29 日\n- Python `3.4` - 2014 年 3 月 16 日\n\n## 什么是 Python？\n\nPython 是一种免费提供的面向对象、高级且具有动态语义的编程语言。许多程序员对\
  \ Python 赞誉有加，因为它提供了更高的生产力，因为编辑-测试-调试循环非常快。\n\nPython 语言具有简单、易于学习的语法，通过大量的英语单词提高了可读性和效率。在\
  \ Python 中编写代码，感觉更像是在用自己的想法写出解决方案，而不是在引用语言为了实现某些功能时所需的模糊符号。\n\nPython 可用于自动化测量和交互式处理数据。与其他许多编程语言相比，Python\
  \ 能够轻松处理大型数据库并计算大量数字。它可以作为内部脚本语言，供其他程序执行特定功能。通过学习 Python，你将能够编写复杂的软件，如复杂的网络爬虫。\n\
  \n\n\n\nPython 的伟大之处在于它拥有庞大的网络爬虫库，并因其网页抓取能力而被广泛使用。网络爬虫简单来说就是一个根据其设定的参数在网络上进行导航，并抓取你希望它抓取内容的程序。\n\
  \n而言之，无论你是编程初学者还是其他语言的资深人士，Python 都非常上手。它是一门快速、友好且易于学习的语言，但不要因此误以为它不那么强大。\n\n# 第\
  \ 2 章\n\n## Python 的安装\n\n为了在机器上安装 Python，你必须下载以下内容：\n\n1. Python 解释器\n2. Python\
  \ IDE\n\n下载这两个工具将开启你通往 Python 程序员的道路。IDE（集成开发环境）是程序员使用的程序化应用程序，因为它包含了处理和执行代码所需的工具。一个\
  \ IDE 包含一个代码编辑器、一个编译器、一个调试器和一个图形用户界面（GUI）。IDE 有许多不同类型，但最常用的是 Python 的 `PyCharm`。在从\
  \ JetBrains 获取 `PyCharm` IDE 之前，你必须先在你的系统上安装好 `Python` 解释器（`IDLE` 版本 3.4），以便 `PyCharm`\
  \ 能够检测到计算机上的 Python。\n\n在本指南中，推荐使用 `PyCharm`，因为本文将使用它。如果你使用相同的 IDE，可以更容易跟上我的思路。下载\
  \ Python 解释器，请使用以下链接：\n\n[`www.python.org/downloads/`](https://www.python.org/downloads/)\n\
  \n进入此链接后，你需要找到这个：\n\n![`puu.sh/hTvWC/e539a9177f.png`](img/00008.jpeg)\n\n然后，点击 download，文件将相应下载。一旦拥有此文件，执行它并按照向导中的指令安装\
  \ Python 解释器。\n\n一旦安装了 Python 解释器，我们就可以开始下载 `PyCharm`。安装 `PyCharm`，请访问以下链接：\n\n\
  [`www.jetbrains.com/pycharm/download/`](https://www.jetbrains.com/pycharm/download/)\n\
  \n![`puu.sh/hTw3f/dd49e7ad1c.png`](img/00009.jpeg)\n\n你现在应该处于这个屏幕（或类似的界面）——点击“Download\
  \ Community”按钮并继续下载 `PyCharm`。在此过程中，它会自动检测 Python 3.4 `IDLE`，但在少数情况下，你可能需要指定你安装\
  \ Python 的目录。\n\n一旦完成 PyCharm 和 Python 3.4 `IDLE` 的安装，进入 `File`（文件）`New Project`（新建项目）。你将看到此屏幕：\n\
  \n![`puu.sh/hTwox/5ba1669ce6.png`](img/00010.jpeg)\n\n你可以将 `Location`字段中的“untitled”部分重命名为特定的项目名称。然后点击“Create”（创建）按钮，你将进入一个空项目。我们必须做的下一件事是创建一个新的\
  \ Python 文件，你可以通过以下路径实现：\n\n`File`（文件）`New`（新建）`Python File`（Python 文件）\n\n相应设置你的\
  \ Python 文件名，它将显示在项目资源管理器（Project Explorer）中的项目名称下。现在双击文件，你将进入一个可以开始编写 Python 代码的页面。\n\
  \n它看起来应该是这样的：\n\n![`puu.sh/hTwx1/74b6154739.png`](img/00011.jpeg)\n\n你已成功安装了 Python！\n\
  \n# 第 3 章\n\n## Python 语言结构\n\n我们将通过以下示例代码作为示例，学习 Python 作为一种编程语言的结构：\n\n```python\n\
  import math\n\nclass Program:\n    def Execute(self):\n        x = math.sqrt(25)\n\
  \        print(x)\n\nrun = Program()\nrun.Execute()\n```\n\n输出：\n\n![`puu.sh/hTy3s/931081aeed.png`](img/00012.jpeg)\n\
  \n为了实际执行代码，你必须使用快捷键 `alt + shift + f10`，或者使用 `PyCharm` 主导航栏中的 `Run`（运行）菜单项执行。\n\n\
  第一行 `import math` 使用了一个特殊的关键字 `import`，它允许程序员从 Python 库中导入在编码时默认不包含的工具。在关键字 `import`\
  \ 之后——程序员指定了 Python 库中的某个特定目录。在本例中，我们指定了 `math` 目录；如果我们想专门指定 `System` 目录中的内容，我们将添加一个点分隔符（period），然后添加子目录名称。如果库的文件夹更加复杂，你必须使用如下符号：\n\
  \n```python\nimport bs4 from BeautifulSoup\n```\n\n`BeautifulSoup` 库就是这样一个例子，我们希望从\
  \ `BeautifulSoup` 目录库中导入 `bs4` 目录，这就是为什么在程序开头使用了 `from` 关键字。\n\n在我们案例中，我们导入了 `math`\
  \ 模块，因为它包含了函数（你将在指南的后续部分学习更多关于它们的知识——它们可以定义为函数或方法）。为了简要说明，函数只是一个包含系列步骤以完成特定功能的代码块，可以被调用来为我们计算数字。\n\
  \n\n\n\n需要注意的是，代码中的空格至关重要。如果你正在创建一个类，该类的内容需要使用 Tab 键进行一次缩进，以便解释器理解该类所管辖的代码是其下方的缩进代码。任何没有在类下方缩进的代码都不属于该类的一部分。对于你创建的任何函数也是如此。如上例所示，函数通过冒号定义，并在下方紧跟缩进的内容，表示它是该函数的一部分。\n\
  \nPython 的工作机制是它拥有类，类是章节，而函数是类的子章节。这些类可以像主程序中声明的那样在类声明后进行声明，然后通过它们内部携带的函数进行调用。在这种情况下，它是\
  \ `Execute`。同样，这在现在可能听起来没意义，但在指南的后续章节将会变得清晰。\n\n# 关于作者\n\n![Dagny Taggart.jpg](img/00013.jpeg)\n\
