  # 引言：欢迎来到正则表达式终极速成课程\n\n所以，你决定学习 Java 正则表达式了吗？很好，恭喜你，欢迎来到你的速成语言课程！你会喜欢它的！\n\n在 Eprogramy，我们相信，良好教育的基础是提供能够开启未来之门的工具。不可否认，世界已经进入了一个我们一切触手可及的时代。社会需求发生了变化。因此，今天的通信也发生了变化。通信开启了大门，所以学习如何通信是我们的挑战。在\
  \ Eprogramy，我们希望你学会用一种新语言通信：编程语言。这种语言允许我们使用电脑或笔记本电脑进行创作。\n\n也许道路是艰难的，但我们将为读者提供工具，让学习变得愉快且富有成效。我们将展示学习编程的所有必要方面。从基础知识到解决最常见的编程问题以及更多更多。我们将辅以大量的示例，这将有助于更好地理解。\n\
  \n我们清楚自己在做什么，并相信你完全有能力吸收我们的教学。\n\n未来的大门已经开启。让我们一起一步来。\n\n让我们开始吧！\n\nEprogramy 团队\n\
  \n# 第 1 章：我们的 Java 正则表达式第一步\n\n## 什么是正则表达式？\n\n在当今世界，几乎所有的应用程序都需要处理文本用于搜索和验证。这个过程通常涉及复杂的逻辑，并可能导致许多复杂且混乱的代码，非常难以理解。\n\
  \n正则表达式或 `REGEX` 被解释为特定的文本模式，可以用于许多高级应用程序，并适用于任何编程语言。它们被用于搜索、编辑和处理数据。\n\n例如，使用正则表达式我们可以验证特定的输入字符串是否匹配给定的文本模式，或者从大量字符中找到一组字符。它们还用于替换和重排文本块，或将大块数据分成较小的子集。正则表达式通常不是特定语言的，在大多数编程语言中遵循类似的模式，但会有细微差异。\n\
  \n正则表达式是强大的工具，可以减少处理时间。通过熟练地使用它们，我们可以完成原本无法实现的任务。\n\n示例：\n假设我们需要验证以下电子邮件。\n\n```java\n\
  emailid = \"xyz@abc.com\"\n```\n\n验证所需的步骤：\n1. 必须有一个 `@` 符号。\n2. `@` 之前的文本必须只包含字符、数字、下划线和连字符。\n\
  3. 电子邮件中不有两个 `@` 符号。\n4. 在 `@` 符号之后的域名中应该有一个 `.`。\n5. 它应该以 2 或 3 个字符结束。\n\n如果你需要在不使用正则表达式的情况下验证上面的电子邮件，程序将需要数百行代码。\n\
  \n```java\npackage com.sample.regexsample;\n\npublic class Validte {\n    public\
  \ static void main(String[] args) {\n        String str1 = \"myname@abc.com\";\n\
  \        int x = str1.indexOf(\"@\"); // 返回子字符串第一个字符的索引\n        System.out.println(\"\
  index = \" + x);\n    }\n}\n```\n\n输出：\n`Index = 6.`\n\n一旦获取索引，还需要进一步的计算来确定域名中是否有一个或多个字符，后面跟着\
  \ `.` 符号。这就是正则表达式发挥重要作用的地方。我们可以使用正则表达式模式仅一行代码即可完成它。\n\n```java\npackage com.sample.regexsample;\n\
  \nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class\
  \ EmailValidator {\n    public static void main(String[] args) {\n        String\
  \ input = \"^[_A-Za-z0-9\\\\+]+([\\\\.[A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\\\\.[A-Za-z0-9]+)*(\\\
  \\.[A-Za-z]{2})$\";\n        String emailAddress =\"xyz@abc.com\";\n        Pattern\
  \ p = Pattern.compile(input);\n        Matcher m = p.matcher(emailAddress);\n  \
  \      System.out.println (\"The email 1 matches:\" + m.matches());\n    }\n}\n\
  ```\n\n## 常见用途\n\n正则表达式广泛用于各种文本处理任务，更广泛用于字符串处理，其中数据不需要是文本。常见的应用包括数据验证、数据爬取、数据清洗、简单解析、语法高亮系统的生成以及许多其他任务。\n\
  \n\n\n\n虽然正则表达式在网络搜索引擎中非常有用，但根据 `regex` 的复杂性和设计，在整个数据库中处理它们可能会消耗大量的计算机资源。\n\n正则表达式的一些重要用途包括：\n\
  \n1. URL 验证\n2. 邮箱验证\n3. 数字、字符和特殊字符的验证\n4. 互联网地址\n5. 从文本中提取信息，如代码、日志文件、电子表格或文档。\n\
  6. 字符串的搜索与替换\n\n**注意：**\n\n- 请记住，在使用正则表达式时，本质上一切都是字符，我们正在编写模式来匹配特定的字符序列（也称为字符串）。\n\
  - 通常提供的模式是 ASCII 字符，包括字母、数字、标点符号和其他键盘符号 `%#@`。\n- Unicode 字符用于匹配任何类型的文本。\n\n## 理解正则表达式引擎\n\
  \n最重要的事情之一是观察正则表达式的工作原理，因为了解引擎如何工作将帮助我们更容易编写更好的 `regexes`。这有助于理解特定的 `regex` 如何以预期的方式工作，从而节省大量的猜测。编写复杂的\
  \ `regexes`。\n\n正则表达式有两种：\n\n1. 文本驱动型引擎（text-directed engines）\n2. 正则驱动型引擎（regex-directed\
  \ engines）\n\n大多数 `regex` 变体都基于正则驱动型引擎。因为某些非常有用的功能，如懒惰量化（lazy quantifiers）和反引用（back\
  \ references），只能在正则驱动型引擎中实现。\n\n你可以轻松判断要使用的 `regex` 变体是文本驱动还是正则驱动的。如果可以使用反引用或懒惰量化，你可以确定引擎是正则驱动的。\n\
  \n你可以通过将 `regex` 应用于字符串 `text` 来进行测试，如果结果是 `text`，那么它是文本驱动的。如果结果是 `text`，那么它是正则驱动的。这背后的原因是正则驱动型引擎是一个起点。\n\
  \n在查看示例之前，理解正则表达式的工作原理将让你能够利用其全部功能并避免常见的错误。\n\n### 正则驱动型引擎始终返回最左匹配\n\n在处理引擎时，需要注意一些重要点：\n\
  \n- 正则驱动型引擎始终返回最左匹配，即使以后可以找到合适的匹配。\n- 当将 `regex` 应用于字符串时，引擎将从字符串的第一个字符开始。它将尝试正则表达式在第一个字符的所有变。只有当所有可能性都尝试过并失败后，引擎才会继续处理第二个字符。\n\
  - 再次，它将按照相同的顺序尝试 `regex` 的所有变，直到找到匹配。\n- 结果是正则驱动型引擎将返回最左匹配。\n- 让我们考虑这个例子，搜索 `book`\
  \ 到 `He bought a bookshelf for his.`。引擎将尝试在第一个字符匹配 `regex` `b`。这失败了。`regex` 没有其他可能的，因为它仅仅由字面字符序列组成。所以正则表达式引擎尝试用\
  \ `e` 匹配 `b`。这也失败了，正如用空格匹配 `b` 一样。到达匹配的第 4 个字符，`b` 匹配了 `b`。引擎将尝试匹配第二个 token `o`\
  \ 到第 5 个字符 `o`。这也成功了。但随后，`o` 无法匹配 `u`。在这一点，引擎知道无法从第 4 个字符开始匹配 `regex`。它将继续第 5 个：`a`。再次，`b`\
  \ 在此处无法匹配，引擎继续。在匹配的第 30 个字符处，`b` 再次匹配了 `b`。\n- 引擎接着尝试在第 30 个字符处匹配 `regex` 的剩余部分，发现\
  \ `o` 匹配 `o`，再次 `o` 匹配 `o` 且 `k` 匹配 `k`。完整的 `regex` 可以从第 30 个字符开始匹配。引擎是报告匹配的起点。因此它会将\
  \ `catfish` 的前三个字母作为有效匹配。引擎不会继续此后以查看是否有“更好”的匹配。在引擎内部的第一个示例中，我们的正则表达式引擎看起来运行就像一个普通的文本搜索程序。\n\
  \n文本驱动型引擎也会返回相同的结果。然而，重要的是你可以在脑海中遵循引擎采取的步骤。在接后的示例中，引擎的工作方式会对它找到的匹配产生深远影响。某些结果可能会令人惊讶。但一旦你知道引擎如何工作，它们总是符合逻辑且预先定的。\n\
  \n## 正则表达式使用的算法\n\n在使用 `regex` 时，至少有三种不同的算法来决定给定的正则表达式是否以及如何匹配字符串。\n\n将 NFA 转换为\
  \ DFA\n\n这是第一个且最快的方法。它基于形式语言理论中的结果，该结果允许每个非确定性有限自动机（NFA）变为确定性有限自动机（DFA）。可以显式构建 `DFA`，然后对生成的输入字符串逐一个符号地运行。\n\
  \n直接模拟 NFA（DFA/NFA 算法）\n\n一种方法是直接模拟 `NFA`，根据需要构建每个 `DFA` 状态，然后在下一个执行步骤将其丢弃。这种方法保持\
  \ `DFA` 隐式，避免了构建成本的指数级增长，但带来了运行成本增加到 `O(m n)` 的开销。显式和隐式方法分别称为 `DFA` 算法和 `NFA` 算法。\n\
  \n回溯\n\n第三种也是最后的算法是通过回溯与输入字符串匹配模式。这种算法通常被称为 `NFA`，但这个术语有时会引起混淆。这被用于简单的实现，体现在匹配如\
  \ `(a|aa)*b` 这种包含交替和无界量化的表达式时。这种处理可能会强制算法考虑数量指数级增长的子用例。这可能还会导致被称为“正则表达式拒绝服务”（ReDoS）的安全问题。\n\
  \n# 第 2 章 正则表达式使用的基本字符\n\n## 常见的正则表达式语法\n\n正则表达式是底部表示文本的字符串模式。这些描述可以用多种方式应用。基础语言结构包括字符类、量化符和元字符。下面的章节解释了定义正则表达式的各种选项。\n\
  \n### 1.1 字符串字面量\n\n字符串字面量用于在文本中搜索特定的匹配。例如，如果我们搜索文本 `test`，可以简单地写代码：这里文本和正则是相同的。\n\
  \n```\nPattern.matches(\"test\", \"test\")\n```\n\n### 1.2 字符类\n\n字符类用于将输入文本中的单个字符匹配字符类中的多个允许字符。字符类与\
  \ Java 中的类构造或类文件没有关系。\n\n示例：\n\n1. `[Tt]est` 将匹配字符串 `test` 的所有出现，无论是小写还是大写的 `T`。\n\
  2. `\"WEB@JDOJO.COM\"` 匹配模式 `[ABC]@`，因为 `@` 前面是 `B`。\n3. 字符串 `\"A@BAND@YEA@U\"`\
  \ 两次匹配模式 `[ABC]@.`，即使字符串包含三个 `@` 符号。\n4. 第二个 `@` 不是匹配的一部分，因为它前面是 `D` 而不是 `A, B,\
  \ 或 C`。\n\n更多示例：\n\n\n\n\n\n`Pattern.matches(\"[pqr]\", \"abcd\");` 将返回 false，因为文本中没有\
  \ p、q 或 r。\n\n`Pattern.matches(\"[pqr]\", \"r\");` 返回 true，因为找到了 r。\n\n`Pattern.matches(\"\
  [pqr]\", \"pq\");` 返回 false，因为文本中可以包含其中一个，但不能两个都包含。\n\n元字符 `[` 和 `]`（左括号和右括号）用于在正则表达式中指定字符类。有时，我们将产生匹配的字符限制在一个特殊的字符集内。以下是各种字符类构造的示例列表：\n\
  \n1. **简单（Simple）**：由一组并排设置的字符组成，仅匹配这些字符。例如：`[abc]` 匹配字符 a、b 和 c。\n   让我们来看下面的例子：\n\
  \   `[csw]` cave 匹配 `[csw]` 中的 `c`，对应 `cave` 中的 `c`。\n\n2. **否定（Negation）**：以元字符\
  \ `^` 开头，仅匹配不在该类中的字符。\n   例如：`[^abc]` 匹配除 a、b 和 c 以外的所有字符字符。\n   我们来看第二个例子：\n  \
  \ `[^csw]` cave 匹配 `a`、`v` 和 `e`，对应 `cave` 中的对应字符。\n\n3. **范围（Range）**：涉及从连字符元字符（`-`）左侧字符到连字符元字符右侧字符的所有字符，仅匹配该范围内的字符。\n\
  \   例如：`[a-z]` 匹配所有小写字母。\n   我们来看另一个例子：\n   `[a-c]` clown 匹配 `[a-c]` 中的 `c`，对应 `clown`\
  \ 中的 `c`。\n\n4. **并集（Union）**：涉及多个嵌套的字符类，并匹配所有符合结果并集的字符。\n   例如：`[a-d[m-p]]` 匹配从\
  \ `a` 到 `d` 以及 `m` 到 `p` 的字符。\n   我们来看第二个例子：\n   `[ab[c-e]]` abcdef 匹配 `a`、`b`、`c`、`d`\
  \ 和 `e`，对应 `abcdef` 中的对应字符。\n\n5. **交集（Intersection）**：涉及所有嵌套类中常见的字符，并仅匹配共同字符。\n\
  \   例如：`[a-z&&[d-f]]` 匹配字符 `d`、`e` 和 `f`。\n   其他例子：\n   `[aeiouy&&[y]]` party 匹配\
  \ `[aeiou&&[y]]` 中的 `y`，对应 `party` 中的 `y`。\n\n6. **减法（Subtraction）**：涉及所有字符减去嵌套否定字符类中指定的字符，并匹配剩余字符。\n\
  \   例如：`[a-z&&[^m-p]]` 匹配从 `a` 到 `l` 以及 `q` 到 `z` 的字符。\n   以下命令行提供了第二个例子：\n   `[a-f&&[^a-c]&&[^e]]`\
  \ abcdefg 匹配 `d` 和 `f`，对应 `abcdefg` 中的对应字符。\n\n## 预字符类\n\n| 字符 | 解释 |\n| :--- |\
  \ :--- |\n| `.` | 等于点，任意字符（可能匹配也可能不匹配终止符） |\n| `\\d` | 等于数字：`[0-9]` |\n| `\\D` |\
  \ 等于非数字：`[⁰-9]` |\n| `\\s` | 等于空白字符：`[ \\t\\n\\x0B\\f\\r]` |\n| `\\S` | 等于非空白字符：`[^\\\
  s]` |\n| `\\w` | 等于单词字符 |\n| `\\W` | 等于非单词字符 |\n| `\\A` | 等于字符串开头。 |\n| `\\Z` |\
  \ 等于字符串结尾。 |\n\n然而；在 Java 中，你需要对这些反斜杠进行“双重转义”。\n\n`String pattern = \"\\\\d \\\\\
  D \\\\W \\\\w \\\\S \\\\s\";`\n\n例如：\n`Pattern.matches(\"\\\\d\", \"1\");` 将返回 true。\n\
  `Pattern.matches(\"\\\\D\", \"z\");` 返回 true。\n`Pattern.matches(\".p\", \"qp\");`\
  \ 返回 true，点(`.`) 代表任意字符。\n\n## 边界匹配器\n\n| 表达式 | 解释 |\n| :--- | :--- |\n| `^` | 等于行开头。\
  \ |\n| `$` | 等于行结尾。 |\n| `\\b` | 等于单词边界。 |\n| `\\B` | 等于非单词边界。 |\n| `\\A` | 等于输入文本的开头。\
  \ |\n| `\\G` | 等于上一次匹配的结尾 |\n| `\\Z` | 等于输入文本的结尾除去最后的终止符 |\n| `\\z` | 等于输入文本的结尾\
  \ |\n\n例如：\n`Pattern.matches(\"^Hello$\", \"Hello\")`: 返回 true，以 Hello 开头并结尾\n`Pattern.matches(\"\
  ^Hello$\", \"Namaste!\")`: 返回 false，不以 Hello 开头\n`Pattern.matches(\"^Hello$\", \"\
  Hello Namaste!\")`: 返回 false，不以 Hello 结尾\n\n## 量词\n\n量词是一种将数值值与模式绑定的正则表达式构造。量词会对其左侧的表达式进行循环。该数值值确定了匹配模式的次数。我们有六种主要的量词，可以在三个类别中重复出现：贪婪、懒惰和占有。\n\
  \n### 贪婪量词（Greedy Quantifiers）\n贪婪量词将匹配与模式最长的字符串。\n\n| 量词 | 解释 |\n| :--- | :---\
  \ |\n| `?` | 次或无 |\n| `*` | 零或多次 |\n| `+` | 一次或多次 |\n| `{n}` | 精确 n 次 |\n| `{n,}`\
  \ | 至少 n 次 |\n| `{n,m}` | n 次到 m 次 |\n\n### 懒惰量词（Reluctant Quantifiers）\n懒惰量词用于匹配最短的字符串。\n\
  \n| 量词 | 解释 |\n| :--- | :--- |\n| `??` | 次或无 |\n| `*?` | 零或多次 |\n| `+?` | 一次或多次\
  \ |\n| `{n}?` | 精确 n 次 |\n| `{n,?}` | 至少 n 次 |\n| `{n,m}?` | n 次到 m 次 |\n\n### 占有量词（Possessive\
  \ Quantifiers）\n占有量词将匹配整个字符串。\n\n| 量词 | 解释 |\n| :--- | :--- |\n| `?+` | 次或无 |\n\
  | `*+` | 零或多次 |\n| `++` | 一次或多次 |\n| `{n}+` | 精确 n 次 |\n| `{n,}+` | 至少 n 次 |\n|\
  \ `{n,m}+` | n 次到 m 次 |\n\n### 量词示例代码\n\n```java\npackage sample.regex;\nimport\
  \ java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class DemoForQuantifiers\
  \ {\n    static void main(String[] args) {\n        String regex = \"a?\"; // 次或无\n\
  \        String regex1 = \"a*\"; // 零或多次\n        String regex2 = \"a+\"; // 一次或多次\n\
  \        String regex3 = \"a{2}\"; // 精确 n 次\n        String regex4 = \"a{2,}\"\
  ; // 至少 n 次\n        String regex5 = \"a{2,4}\"; // n 次到 m 次\n        String regex6\
  \ = \"a+\"; // \n\n        System.out.println(Pattern.matches(regex, \"ab\")); //\
  \ 返回 true，匹配一个 a \n        System.out.println(Pattern.matches(regex1, \"aaaa\"));\
  \ // 返回 true，匹配多个 a\n        System.out.println(Pattern.matches(regex2, \"b\"));\
  \ // 返回 false，没有 a\n\n        // 贪婪与懒惰的对比\n        String text = \"aaaaa\";\n  \
  \      Matcher m1 = Pattern.compile(\"a*\").matcher(text);\n        while (m1.find())\
  \ {\n            System.out.println(m1.group()); // 贪婪会匹配尽可能多的\n        }\n\n  \
  \      Matcher m2 = Pattern.compile(\"a*?\").matcher(text);\n        while (m2.find())\
  \ {\n            System.out.println(m2.group()); // 懒惰会匹配最少的\n        }\n    }\n\
  }\n```\n\n\n\n\n\n```java\nSystem.out.println(\"Start index-->\"+m3.start()+\"End\
  \ index-->\"+m3.end());\n}\nSystem.out.println(\"-----------------------------------------------\"\
  );\nwhile(m4.find()) {\n    System.out.println(\"Start index-->\"+m4.start()+\"\
  End index-->\"+m4.end());\n}\nSystem.out.println(\"-----------------------------------------------\"\
  );\nwhile(m5.find()) {\n    System.out.println(\"Start index-->\"+m5.start()+\"\
  End index-->\"+m5.end());\n}\nSystem.out.println(\"-----------------------------------------------\"\
  );\nwhile(m6.find()) {\n    System.out.println(\"Start index-->\"+m6.start()+\"\
  End index-->\"+m6.end());\n}\nSystem.out.println(\"-----------------------------------------------\"\
  );\nwhile(m7.find()) {\n    System.out.println(\"Start index-->\"+m7.start()+\"\
  End index-->\"+m7.end());\n}\nSystem.out.println(\"-----------------------------------------------\"\
  );\nwhile(m8.find()) {\n    System.out.println(\"Start index-->\"+m8.start()+\"\
  End index-->\"+m8.end());\n}\nSystem.out.println(\"-----------------------------------------------\"\
  );\n```\n\n## 特殊构造\n\n| 构造 | 解释 |\n| :--- | :--- |\n| `(?<name>X)` | `X`，作为命名捕获组\
  \ |\n| `(?:X)` | `X`，作为非捕获组 |\n| `(?flags)` | 无，但用于开启或关闭标记 |\n| `(?flags:X)` | `X`，作为带有给定标记的非捕获组\
  \ |\n| `(?=X)` | `X`，通过零宽正向断言 |\n| `(?!X)` | `X`，通过零宽负向断言 |\n| `(?<=X)` | `X`，通过零宽正向后逆推\
  \ |\n| `(?<!X)` | `X`，通过零宽负向后逆推 |\n| `(?>X)` | `X`，作为独立的非捕获组 |\n\n## 正则示例\n\n##\
  \ 表达式\n\n在 Java 中，每个字符串都是正则表达式。例如，字符串 \"I have a car\" 是一个正则，它会匹配文本 \"I have a car\"\
  ，而忽略其他所有内容。\n\n如果我们想让别人知道更多我们拥有的东西怎么办？我们可以将单词 `car` 替换为字符类表达式，它可以匹配任何字符：`I have\
  \ a \\w+`。\n\n你会注意到，在这个模式中同时使用了字符类和量量符。`\\w` 表示匹配一个单词字符，而 `+` 表示匹配一个或多个。结合在一起时，该模式的意思是“匹配一个或多个单词字符”。现在，该模式将匹配替代\
  \ `car` 的任何单词，例如 \"I have a book\" 或 \"I have a dress\"。\n\n但如果我们需要验证 \"I have a:\
  \ boat\"，它将无法匹配，因为存在 `:` 符号，而它不是一个单词字符。如果我们想让表达式能够处理这种情况，那么我们需要做一个微小的更改：`I have\
  \ a:?\\w+`。\n\n现在，该表达式将允许一个可选的 `:`，紧接着是单词 'a'。\n\n### 分组\n\n分组是正则表达式中的一个重要事项。它是将模式的部分组合起来并提供不同匹配的能力。以下元字符是正则表达式的重要部分：\n\
  \n| 分选择 (`or` 语句) | 分组 |\n| :--- | :--- |\n| `\\|` | `()` |\n\n例如，在第一个例子中，我们有一辆车。如果我们知道需要告诉世界的对象列表且外无其他内容呢？让我们使用分组\
  \ `()` 配合 `|` 元字符来设置一个允许的表达式列表：`I have a:?(car\\|dress\\|pen)`。\n\n现在新表达式等于起点 \"\
  I have a\"，一个可选的 \":\"，然后是由 `|` 分隔的表达式之一；`car`、`dress` 或 `pen` 中的任何一个都将匹配。\n\n-\
  \ `I have a car` 匹配\n- `I have books` 匹配（不需要 `s`，被忽略了）\n- `I have: car` 匹配\n- `I\
  \ have- car` 不匹配（模式中不允许出现 `-`）\n- `I have: bo` 不匹配（需要完整的 `book`）\n\n### 示例\n\n```java\n\
  package com.sample.regexsample;\nimport java.util.regex.Pattern;\nimport java.util.regex.Matcher;\n\
  \npublic class DemoGrouping {\n    public static void main(String[] args) {\n  \
  \      String text = \"John writes about this, and John writes about that, and John\
  \ writes about everything.\";\n        String patternString1 = \"(John)\";\n   \
  \     Pattern pattern = Pattern.compile(patternString1);\n        Matcher matcher\
  \ = pattern.matcher(text);\n        while(matcher.find()) {\n            System.out.println(\"\
  found: \" + matcher.group(1));\n        }\n    }\n}\n```\n**输出：**\nfound: John\n\
  found: John\nfound: John\n\n### 匹配/验证\n\n使用正则表达式，可以找到匹配特定模式的文本实例，并在找到/未找到模式时返回一个布尔值。\n\
  \n### 示例：\n\n```java\npackage com.sample.regexsample;\nimport java.util.ArrayList;\n\
  import java.util.List;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
  \npublic class ValidateSSN {\n    public static void main(String[] args) {\n   \
  \     List<String> input = new ArrayList<String>();\n        input.add(\"123-45-6789\"\
  );\n        input.add(\"9876-5-4321\");\n        input.add(\"987-65-4321 (attack)\"\
  );\n        input.add(\"987-65-4321 \");\n        input.add(\"192-83-7465\");\n\
  \        String patternString = \"^(\\\\d{3}-?\\\\d{2}-?\\\\d{4})$\";\n        Pattern\
  \ pattern = Pattern.compile(patternString);\n        for (String ssn : input) {\n\
  \            if (ssn.matches(\"^(\\\\d{3}-?\\\\d{2}-?\\\\d{4})$\")) {\n        \
  \        Matcher m = pattern.matcher(ssn);\n                if (m.find()) {\n  \
  \                  System.out.println(\"Found good SSN: \" + ssn);\n           \
  \     }\n            }\n        }\n    }\n}\n```\n这是使用了正则类的 `Pattern` 和 `Matcher`\
  \ 方法的代码。\n\n**输出：**\nFound good SSN: 123-45-6789\nFound good SSN: 192-83-7465\n\n\
  示例中所使用的模式解释：\n`^(\\\\d{3}-?\\\\d{2}-?\\\\d{4})$`\n\n- `^` 等于行的开头\n- `()` 将括号内的所有内容作为第\
  \ 1 组\n- `$` 等于行的结尾\n\n\n\n\n\n`\\d{n}`: 等于 `n` 个数字，其中 `n` 是大于或等于零的数字\n- `-?`: 可选匹配一个连字符\n\
  - `$`: 匹配行尾\n\n### 提取/捕获\n\n正则表达式可以用于从大型复杂的文本正文中选择特定的值。\n\n示例代码：\n\n```java\npackage\
  \ com.sample.regexsample;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\
  import java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class\
  \ SampleGrouping {\n    public static void main(String[] args) {\n        String\
  \ input = \"I have a kindle, but I like to read book better.\";\n        Pattern\
  \ p = Pattern.compile(\"(kindle|read|book|wolf|bear|human)\");\n        Matcher\
  \ m = p.matcher(input);\n        List<String> animals = new ArrayList<String>();\n\
  \        while (m.find()) {\n            System.out.println(\"Found a \" + m.group()\
  \ + \".\");\n            animals.add(m.group());\n        }\n    }\n}\n```\n\n输出\n\
  Found a kindle.\nFound a read.\nFound a book.\n\n所用模式的解释：\n`\"(kindle|read|book|wolf|bear|human)\"\
  `\n- `()` 将括号内的所有内容捕获为第 1 组\n- `kindle`: 匹配文本 ‘kindle’\n- `|`: 分选择：匹配此组中的任意一个部分\n\
  - `read`: 匹配文本 ‘read’\n…… 依此类推\n\n### 修改/替换\n\n使用正则表达式，可以将文本中的值替换为新值。让我们看看，你可以将所有\
  \ `userId=` 后面跟数字的实例替换为“***masked***”以隐藏原始文本。\n\n示例代码：\n\n```java\npackage com.sample.regexsample;\n\
  \nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class\
  \ MaskingDemo {\n    public static void main(String[] args) {\n        String input\
  \ = \"User userId=23421\\. Some more userId=33432\\. This is userNum=100\";\n  \
  \      Pattern p = Pattern.compile(\"(userId=)(\\\\d+)\");\n        Matcher m =\
  \ p.matcher(input);\n        StringBuffer result = new StringBuffer();\n       \
  \ while (m.find()) {\n            System.out.println(\"Masking: \" + m.group(2));\n\
  \            m.appendReplacement(result, m.group(1) + \"***masked***\");\n     \
  \   }\n        m.appendTail(result);\n        System.out.println(result);\n    }\n\
  }\n```\n\n输出\nMasking: 23421\nMasking: 33432\nUser userId=***masked***. Some more\
  \ userId=***masked***. This is userNum=100\n\n模式解释\n` (userId=)(\\\\d+)`\n- `(userId=)`\
  \ 将括号内的所有内容捕获为第 1 组\n- `userId=` 等于文本 `userId=`\n- `(\\\\d+)` 将括号内的所有内容捕获为第 2 组\n\
  - `\\d+` 等于一个或多个数字\n\n### 匹配多个中的其一\n\n使用 `[]` 元字符和不同的字符组合，我们可以匹配存在的字符中的一个。例如，让我们创建一个正则表达式来匹配像\
  \ cat、bat、rat 这样的拼写。\n\n示例： `(b|m|r)[a][ts]`\n\n示例代码：\n\n```java\npackage com.sample.regexsample;\n\
  import java.util.ArrayList;\nimport java.util.List;\nimport java.util.regex.Matcher;\n\
  import java.util.regex.Pattern;\n\npublic class SampleGrouping {\n    public static\
  \ void main(String[] args) {\n        String input = \"I have a cat, dog, mat and\
  \ rat.\";\n        Pattern p = Pattern.compile(\"(c|d|r)[a][ts]\");\n        Matcher\
  \ m = p.matcher(input);\n        List<String> animals = new ArrayList<String>();\n\
  \        while (m.find()) {\n            System.out.println(\"Found a \" + m.group()\
  \ + \".\");\n            animals.add(m.group());\n        }\n    }\n}\n```\n\n输出:\n\
  Found a cat.\nFound a mat.\nFound a rat.\n\n### 使用特殊构造\n\n当我们需要在字符串中查找某段文本出现在另一个模式之前的文本时，或者查找一段后面没有跟随另一个片段的文本时，就会使用特殊构造。通常，使用标准字符串搜索，我们需要编写相当复杂的函数来执行你想要精确的操作。然而，使用正则表达式可以在一行内完成所有这些操作。\n\
  \n### 前瞻与后溯\n\n向前瞻和向后后溯的操作与分组类似，但这些模式不会捕获值。因此，使用这些构造时，没有值会被存储供以后使用，而且它们不会影响分组编号。前瞻操作向前看，从它们在模式中的位置开始，一直到输入的结束。后溯表达式不向后搜索，而是从模式的开始继续向上/直到后溯表达式。\n\
  \n例如：\n我们需要确保输入字符串中必须存在 `incident` 单词，但在任何地方都不应该找到 `theft` 单词。我们可以使用否定前瞻来确保没有出现。\n\
  `(?!.*theft).*incident.*`\n\n此表达式表现出以下行为：\n- `\"There was a crime incident\"` 匹配\n\
  - `\"The incident involved a theft\"` 不匹配\n- `\"The theft was a serious incident\"\
  ` 不匹配\n\n前瞻和后溯的类型有。正向前瞻和否定前瞻\n\n### 正向前瞻\n\n当我们要查找某段文本出现在字符串中另一个模式之前的文本时，使用正向前瞻。\n\
  \n正向前瞻示例：\n\n```java\npackage com.sample.regexsample;\nimport java.util.regex.Matcher;\n\
  import java.util.regex.Pattern;\n\npublic class DemoPositiveAhead {\n    public\
  \ static void main(String[] args) {\n        String regex = \"(?=²⁵⁵).*\";\n   \
  \     Pattern p = Pattern.compile(regex);\n        String candidate = \"255.0.1\"\
  ;\n        Matcher m = p.matcher(candidate);\n        String ip = \"not found\"\
  ;\n        if (m.find()) {\n            ip = m.group();\n            String msg\
  \ = \"ip: \" + ip;\n            System.out.println(msg);\n        }\n    }\n}\n\
  ```\n\n输出：\nip: 255.0.1\n\n模式解释：\n`(?=²⁵⁵).*`\n- `(?=²⁵⁵)` 表示正向前且以 255 开始\n- `.*`\
  \ 可以跟随任何内容\n\n### 否定向前瞻\n\n当我们要匹配后面没有跟随某内容的文本时，使用否定向前瞻。\n\n否定向前瞻示例代码：\n\n```java\n\
  package com.sample.regexsample;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
  \npublic class DemoNegativeAhead {\n    public static void main(String[] args) throws\
  \ Exception {\n        String regex = \"John (?!Heins)[A-Z]\\\\w+\";\n        Pattern\
  \ p = Pattern.compile(regex);\n        String candidate = \"I think that John Heins\
  \ is a fictional character. His real name might be John Jackson, John Westling,\
  \ or John Holmes for all we know.\";\n        Matcher m = p.matcher(candidate);\n\
  \        String tmp = null;\n        while (m.find()) {\n            tmp = m.group();\n\
  \            System.out.println(\"MATCH:\" + tmp);\n        }\n    }\n}\n```\n\n\
  输出\nMATCH:John Jackson\nMATCH:John Holmes\n\n解释模式：\n`\"John (?!Heins)[A-Z]\\\\w+\"\
  `\n- `John`: 模式以 John 开始\n- `(?!Heins)`: 它不包含 Heins 单词\n- `(A-Z)[\\\\w]+`: John\
  \ 后面应该跟一个以大写字母开头的单词，随后是任意单词。\n\n### 正向后溯\n\n当我们要匹配一个前面应该是某些模式或字符串的文本时，使用正向后溯。\n\n\
  正向后溯示例：\n\n```java\npackage com.sample.regexsample;\nimport java.util.regex.Matcher;\n\
  import java.util.regex.Pattern;\n\npublic class DemooforPositiveLookBehind {\n \
  \   public static void main(String[] args) {\n        String reg = \"(?<=http://)\\\
  \\S+\";\n    }\n}\n```\n\n\n\n\n\n```java\nPattern p = Pattern.compile(reg);\nString\
  \ str = \"http://www.a.com. My name\";\nMatcher m = p.matcher(str);\nwhile (m.find())\
  \ {\n    String msg = \":\" + m.group() + \":\";\n    System.out.println(msg);\n\
  }\n```\nOutput:\n```\n:www.a.com.:\n```\n\n### 解释模式\n\n`(?<+http)\\\\S+`\n\n# 后行查找——从\
  \ http:// 开始直到遇到空白字符。即要检查的字符串前面应该是 http://\n\n### 否定向后零视 (Negative Look Behind)\n\
  \n当你想要匹配前面不是某某些内容的内容时，就会使用否定向后零视。\n\n#### 否定向后零视示例\n\n```java\npackage com.sample.regexsample;\n\
  \nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class\
  \ DemoForNegativelookBehind {\n    public static void main(String[] args) {\n  \
  \      Pattern p = Pattern.compile(\"(?<!Y.{0,40})X\");\n        String txt = \"\
  Y less than 40 before X\"; // 因为你想要'不'，所以这应该匹配失败。\n        Matcher m = p.matcher(txt);\n\
  \        System.out.println(m.find());\n        txt = \"Y less ddddddddddddddddddddddddd\
  \ than 40 before X\"; // 因为你想要“不”，所以这应该匹配\n        m.reset(txt);\n        System.out.println(m.find());\n\
  \    }\n}\n```\nOutput:\n```\nfalse\ntrue\n```\n\n### 解释模式：\n`\"(?<!Y.{0,40})X\"\
  `\n\n# 如果在 X 之前的 0 到 N 个字符之间不存在 Y，则找到模式 X。\n\n# 第 3 章：Java 正则表达式类\n\n在 Java 中，当我们处理复杂项目时，会遇到许多输入，这些通常需要代码将文本与模式进行匹配。这种能力经常被用于邮件标头验证、文本搜索以及从通用文本创建自定义文本等。\n\
  \n## Java 字符串方法\n\n在进入 `java.util.regex` 包之前，让我们先看看 `java String` 类提供的几个用于使用正则表达式的方法。这些方法可以用于一些简单的验证。但如果我们打算频繁使用正则表达式，这些方法将会产生性能开销。\n\
  \n### matches() 方法\n\n`sampleString.matches (\"regex\")` 返回 true 或 false，取决于该字符串是否可以被正则表达式完全匹配。需要记住的一个重要点是，`String.matches()`\
  \ 只有在整个字符串都能被匹配时才返回 true。\n\n示例：\n```java\npackage com.sample.regexsample;\n\npublic\
  \ class DemoForStringMatches {\n    public static void main(String[] args) {\n \
  \       // 准备一个正则表达式来表示模式\n        String regex = \".@.\";\n        // 尝试用正则表达式匹配许多字符串\n\
  \        DemoForStringMatches.matchIt(\"a@k\", regex);\n        DemoForStringMatches.matchIt(\"\
  webmaster@jdojo.com\", regex);\n        DemoForStringMatches.matchIt(\"r@j\", regex);\n\
  \        DemoForStringMatches.matchIt(\"a%N\", regex);\n        DemoForStringMatches.matchIt(\"\
  .@.\", regex);\n    }\n    public static void matchIt(String str, String regex)\
  \ {\n        // 测试模式匹配\n        if (str.matches(regex)) {\n            // 使用 String\
  \ 的 match 方法\n            System.out.println(str + \" matches the regex \" + regex);\n\
  \        } else {\n            System.out.println(str + \" does not match the regex\
  \ \" + regex);\n        }\n    }\n}\n```\nOutput:\n```\na@k matches the regex .@.\n\
  webmaster@jdojo.com does not match the regex .@.\nr@j matches the regex .@.\na%N\
  \ does not match the regex .@.\n.@ matches the regex .@.\n```\n\n### replaceAll()\n\
  \n`sampleString.replaceAll(\"regex\", \"replacement\")` 将字符串内部所有的正则表达式匹配项替换为替换字符串。字符串中所有匹配\
  \ `regex` 的部分都会替换。\n\n示例：\n```java\npackage com.sample.regexsample;\n\npublic class\
  \ DemoForAll {\n    public static void main(String[] args) {\n        // 准备一个正则表达式来表示模式\n\
  \        String regex = \".@.\";\n        String replacementString = \"***\";\n\
  \        // 尝试用正则表达式匹配许多字符串\n        DemoForAll.replaceMatch(\"webd@koj\", regex,\
  \ replacementString);\n    }\n    public static void replaceMatch(String str, String\
  \ regex, String replacementString) {\n        // 测试模式匹配\n        String newStr =\
  \ str.replaceAll(regex, replacementString);\n        System.out.println(regex +\
  \ \" replaced \" + newStr);\n    }\n}\n```\nOutput:\n```\n.@ replaced ***oj\n```\n\
  \n### replaceFirst()\n\n`replaceFirst()` 方法将第一个出现的匹配项替换为 `replacementString`。它返回替换后的新字符串。\n\
  \n示例：\n```java\npackage com.sample.regexsample;\n\npublic class DemoForReplaceFirst\
  \ {\n    public static void main(String[] args) {\n        // 准备一个正则表达式来表示模式\n \
  \       String regex = \".@.\";\n        String replacementString = \"***\";\n \
  \       // 尝试用正则表达式匹配许多字符串\n        DemoForReplaceFirst.replaceMatch(\"A@BandH@G\"\
  , regex, replacementString);\n    }\n    public static void replaceMatch(String\
  \ str, String regex, String replacementString) {\n        // 测试模式匹配\n        String\
  \ newStr = str.replaceFirst(regex, replacementString);\n        System.out.println(regex\
  \ + \" replaced \" + newStr);\n    }\n}\n```\nOutput:\n```\n.@ replaced ***BandH@G\n\
  ```\n\n### split()\n\n`sampleString.split(\"regex\")` 根据正则表达式匹配分割字符串。该方法的返回值是一个字符串数组，其中的元素是两个匹配项之间的原始字符串。\n\
  \n示例：\n```java\npackage com.sample.regexsample;\n\npublic class DemoForSplit {\n\
  \    public static void main(String[] args) {\n        String str = \"one-two-three\"\
  ;\n        String[] temp; // 分隔符\n        String delimiter = \"-\"; // 字符串按提供的参数进行分割\n\
  \        temp = str.split(delimiter); // 打印子字符串\n        for (int i =0; i < temp.length;\
  \ i++) {\n            System.out.println(temp[i]);\n        }\n    }\n}\n```\nOutput:\n\
  ```\none\ntwo\nthree\n```\n\n## Java Util\n\n`java.util.regex` 主要由以下三个类组成：（来源：Oracle\
  \ Java 文，www.docs.com）\n\n*   `Pattern` 类：正则表达式的编译表示。`Pattern` 类没有公共构造函数。要创建模式，必须首先调用它的公共静态\
  \ `compile` 方法，然后将返回一个 `Pattern` 对象。这些方法接受正则表达式作为参数。\n*   `Matcher` 类：`Matcher`\
  \ 对象是解释模式并对输入字符串执行匹配操作的引擎。与 `Pattern` 类一样，`Matcher 没有定义公共构造函数。你通过在 `Pattern` 对象上调用\
  \ `matcher` 方法来获取 `Matcher` 对象。\n*   `PatternSyntaxException`：`PatternSyntaxException`\
  \ 对象是一个异常异常，指示正则表达式中的语法错误。\n\n示例：\n```java\npackage com.sample.regexsample;\n\n\
  import java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class\
  \ PatternSample {\n    public static void main(String[] args) {\n        Pattern\
  \ pattern = Pattern.compile(\".ab.\");\n        Matcher matcher = pattern.matcher(\"\
  WabY\");\n        Matcher m1 = pattern.matcher(\"WxxY\");\n        System.out.println(\"\
  Input String matches regex - \" + matcher.matches());\n        System.out.println(\"\
  Input String matches regex - \" + m1.matches());\n    }\n}\n```\n上述代码的输出如下：\n```\n\
  Input String matches regex - true\nInput String matches regex - false\n```\n示例代码解释：\n\
  \n\n\n\n\n在上面的示例中，`Pattern` 类的 `compile()` 方法被用于编译需要验证的正则表达式。然后，使用 `pattern.matcher()`\
  \ 方法传递要验证的字符串，以便对已编译的正则进行比对。\n\n上述示例中使用的正则模式为 `.ab.`，它表示 `ab` 之前有一个字符，之后有一个字符，并且\
  \ `ab` 在它们之间存在。任何遵循此特定模式的字符串在匹配时将返回 `true`。因此，在上面的示例中，第一个模式 `WabY` 匹配并返回 `true`，而\
  \ `WxxY` 则不匹配并返回 `false`。\n\n## Pattern 类方法\n\n### Pattern.compile()\n\n`Pattern.compile()`\
  \ 方法用于编译正则表达式，如果我们我们需要频繁搜索某个表达式的出现，或者在执行搜索时需要添加任何额外参数（例如不忽略大小写的搜索）。\n\n该方法在该场景下的用法：\n\
  \n```java\nString content = \"This is a my regex\";\nString patternString = \".*reGeX\"\
  ;\nPattern pattern = Pattern.compile(patternString, Pattern.CASE_INSENSITIVE);\n\
  ```\n\n在这个代码示例中，我们使用了标志 `Pattern.CASE_INSENSITIVE` 进行不忽略大小写的搜索，还有其他几个标志可以用于不同的目的。下表给出了这些标志列表及其嵌入字符。\n\
  \n| 标志 | 解释 |\n| :--- | :--- |\n| `Pattern.CANON_EQ` | 用于启用规范化等效性。当我们需要仅在两个表达式的规范化分解匹配时才匹配它们，使用此标志。\
  \ |\n| `Pattern.CASE_INSENSITIVE` | 用于在执行搜索或匹配时不考虑表达式的大小。 |\n| `Pattern.COMMENTS`\
  \ | 允许在模式中使用空白和注释。通过使用此标志，可以忽略表达式中的空格和以 `#` 开头的注释。 |\n| `Pattern.DOTALL` | 用于启用点模式（dotall\
  \ mode）。在此模式下，`..` 代表任何字符，包括换行符。 |\n| `Pattern.LITERAL` | 用于启用给定表达式的字面解析。使用此标志时，用于验证的整个表达式被视为字面字符，而不是整个字符串。\
  \ |\n| `Pattern.MULTILINE` | 用于启用多行模式。默认情况下，元字符 `^` 和 `$` 匹配表达式的开头和结尾。但使用此标志时，这些字符匹配换行符之前和之后，即\
  \ `.` 符号。 |\n| `Pattern.UNICODE_CASE` | 此标志与 `CASE_INSENSITIVE` 标志结合使用，当我们想要比较 Unicode\
  \ 大写时（通常只比较 ASCII 字符）。 |\n| `Pattern.UNIX_LINES` | 此标志启用 Unix 行模式。在此模式下，`\\n` 被视为换行符而不是\
  \ `.` 字符。 |\n\n这些标志可以作为字符本身嵌入正则表达式中。下表给出了这些标志的嵌入等效值。\n\n| 标志 | 嵌入等效值 |\n| :--- |\
  \ :--- |\n| `Pattern.CANON_EQ` | 无 |\n| `Pattern.CASE_INSENSITIVE` | `(?i)` |\n\
  | `Pattern.COMMENTS` | `(?x)` |\n| `Pattern.MULTILINE` | `(?m)` |\n| `Pattern.DOTALL`\
  \ | `(?s)` |\n| `Pattern.LITERAL` | 无 |\n| `Pattern.UNICODE_CASE` | `(?u)` |\n|\
  \ `Pattern.UNIX_LINES` | `(?d)` |\n\n### Pattern.matches()\n\n该方法是使用正则表达式在文本中搜索\
  \ `String` 最简单、方便的方法。例如，考虑下面的代码片段：\n\n```java\npackage com.sample.regexsample;\n\
  \nimport java.util.regex.Pattern;\n\npublic class PatternSample {\n    public static\
  \ void main(String[] args) {\n        String content = \"This is my regex sample\"\
  ;\n        String patternString = \".*regex.*\";\n        boolean isMatch = Pattern.matches(patternString,\
  \ content);\n        System.out.println(\"The text contains 'tutorial'? \" + isMatch);\n\
  \    }\n}\n```\n\n输出：  \n`The text contains 'regex': true`\n\n如示例所示，我们使用了 `Pattern`\
  \ 类的 `matches()` 方法在给定文本中搜索模式。模式 `.*regex.*` 允许在字符串 `regex` 的开头和结尾有零或多个字符。\n\n**缺点：**\
  \ 使用此方法我们可以在文本中搜索模式的单次出现。但如果我们我们需要检查多次出现的匹配，应该结合 `Pattern.compile()` 方法（在上一节讨论过）和\
  \ `Pattern.matcher()` 方法使用。\n\n### Pattern.matcher() 方法\n\n此方法用于返回 `Matcher` 类的实例，用于执行多次验证或在使用分组时。\n\
  \n考虑下面的示例：\n\n```java\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\
  import java.util.regex.Pattern;\n\npublic class PatternSample {\n    public static\
  \ void main(String[] args) {\n        String content = \"This is my regex sample\"\
  ;\n        String patternString = \".*rEgeX.*\";\n        Pattern pattern = Pattern.compile(patternString,\
  \ Pattern.CASE_INSENSITIVE);\n        Matcher matcher = pattern.matcher(content);\n\
  \        boolean isMatched = matcher.matches();\n        System.out.println(\"Is\
  \ it a? \" + isMatched);\n    }\n}\n```\n\n输出：  \n`Is it a? true`\n\n#### 多分组\n\n\
  在下面的代码中，`compile` 和 `matcher` 方法用于从分组中查找字符串。\n\n```java\npackage com.sample.regexsample;\n\
  \nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.regex.Matcher;\n\
  import java.util.regex.Pattern;\n\npublic class PatternSample {\n    public static\
  \ void main(String[] args) {\n        String input = \"I have a cat, but I like\
  \ dog.\";\n        String patternString = \"(mouse|dog)|bear|human\";\n        Pattern\
  \ p = Pattern.compile(patternString);\n        Matcher m = p.matcher(input);\n \
  \       List<String> animals = new ArrayList<>();\n        while (m.find()) {\n\
  \            System.out.println(\"Found a \" + m.group());\n            animals.add(m.group());\n\
  \        }\n    }\n}\n```\n\n输出：  \n`Found a cat`  \n`Found a dog`\n\n#### split\n\
  \n此方法根据分隔符（使用正则表达式指定）将给定文本分割为多个字符串。示例显示了该方法如何工作。\n\n```java\npackage com.sample.regexsample;\n\
  \nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.regex.Matcher;\n\
  import java.util.regex.Pattern;\n\npublic class PatternSample {\n    public static\
  \ void main(String[] args) {\n        String text = \"ItIsRegexSample.ItProvidedByMe\"\
  ;\n        String patternString = \"is\";\n        Pattern pattern = Pattern.compile(patternString,\
  \ Pattern.CASE_INSENSITIVE);\n        String[] myStrings = pattern.split(text);\n\
  \        for (String temp : myStrings) {\n            System.out.println(temp);\n\
  \        }\n        System.out.println(\"Number of split strings: \"+myStrings.length);\n\
  \    }\n}\n```\n\n输出：  \n`It`  \n`RegexSample.It`  \n`ProvidedByMe`  \n`Number of\
  \ split strings: 3`\n\n## Matcher 类方法\n\n在上一节讨论 `Pattern` 类的 `matcher()` 方法时，我们创建了\
  \ `Matcher` 类的实例。它用于多次搜索和分组搜索。下面提供了代码示例供参考。\n\n### 创建 Matcher 实例\n\n```java\nString\
  \ content = \"Some text\";\nString patternString = \".*somestring.*\";\nPattern\
  \ pattern = Pattern.compile(patternString);\nMatcher matcher = pattern.matcher(content);\n\
  ```\n\n### Matches() 方法\n\n此方法用于在创建 Matcher 实例时，对传递给 `Pattern.matcher()` 方法的整个字符串进行正则表达式匹配。\n\
  \n```java\nPattern pattern = Pattern.compile(patternString, Pattern.CASE_INSENSITIVE);\n\
  ```\n\n\n\n\n\n`Matcher matcher = pattern.matcher(content);`\n\n`boolean isMatched\
  \ = matcher.matches();`\n\n### lookingAt()\n\n此方法与 `matches()` 方法类似，不同之处在于它只从文本的开头匹配正则表达式，而\
  \ `matches()` 则在整个文本中搜索。\n\n代码片段：\n\n```java\npackage com.sample.regexsample;\n\n\
  import java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class\
  \ PatternSample {\n    public static void main(String[] args) {\n        String\
  \ REGEX = \"Saa\";\n        String INPUT = \"SaaaaaaaS\";\n        Pattern pattern\
  \ = Pattern.compile(REGEX);\n        Matcher matcher = pattern.matcher(INPUT);\n\
  \        System.out.println(\"Current REGEX is: \"+REGEX);\n        System.out.println(\"\
  Current INPUT is: \"+INPUT);\n        System.out.println(\"lookingAt(): \"+matcher.lookingAt());\n\
  \        System.out.println(\"matches(): \"+matcher.matches());\n    }\n}\n```\n\
  \n输出：\n```\nCurrent REGEX is: Saa\nCurrent INPUT is: SaaaaaaaS\nlookingAt(): true\n\
  matches(): false\n```\n\n在上面的示例中，`lookingAt()` 方法返回 `true`，而 `matches()` 方法返回 `false`，因为后者匹配的是整个字符串，而另一个方法只比较开头。\n\
  \n### find()\n\n此方法用于在文本中搜索正则表达式的出现情况。当我们在海量数据中搜索字符串的多次出现时，经常使用此方法。\n\n代码片段：\n\n\
  ```java\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\nimport\
  \ java.util.regex.Pattern;\n\npublic class PatternSample {\n    public static void\
  \ main(String[] args) {\n        String REGEX = \"too\";\n        String INPUT =\
  \ \"too\";\n        Pattern p = Pattern.compile(REGEX);\n        Matcher m = p.matcher(INPUT);\
  \ // 获取一个匹配器对象\n        while(m.find()) {\n            System.out.println(\"start():\
  \ \"+m.start());\n            System.out.println(\"end(): \"+m.end());\n       \
  \ }\n    }\n}\n```\n\n输出：\n```\nstart(): 0\nend(): 3\n```\n\n### find(int start)\n\
  \n此方法尝试从指定的索引开始，在输入序列中找到与模式匹配的子序列。\n\n#### 1) start() 和 end()\n\n这两个方法通常与 `find()`\
  \ 方法结合使用。`start` 方法用于获取使用 `find()` 方法搜索的字符串或匹配项的起始索引，`end` 方法用于获取结束索引。此方法返回 `int`\
  \ 值。\n\n代码片段：\n\n```java\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\
  import java.util.regex.Pattern;\n\npublic class PatternSample {\n    public static\
  \ void main(String[] args) {\n        String content = \"I have a big and beautiful\
  \ house and a good car\";\n        String string = \"and\";\n        Pattern pattern\
  \ = Pattern.compile(string);\n        Matcher matcher = pattern.matcher(content);\n\
  \        while(matcher.find()) {\n            System.out.println(\"Found at: \"\
  + matcher.start() + \" - \" + matcher.end());\n        }\n    }\n}\n```\n\n输出：\n\
  ```\nFound at: 13 - 16\nFound at: 33 - 36\n```\n\n#### 2) start(int group) 和 end(int\
  \ group)\n\n这些是 `start` 和 `end` 的重载方法。当使用分组从特定组查找表达式的起始或结束索引时，可以使用这些方法。\n\n代码片段：\n\
  \n```java\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\
  import java.util.regex.Pattern;\n\npublic class PatternSample {\n    public static\
  \ void main(String[] args) {\n        String REGEX = \"(cat)(s)\";\n        String\
  \ INPUT = \"cat cat cat\";\n        Pattern p = Pattern.compile(REGEX);\n      \
  \  Matcher m = p.matcher(INPUT); // 获取一个匹配器对象\n        int count = 0;\n        while(m.find())\
  \ {\n            count++;\n            System.out.println(\"start(1): \"+m.start(1));\n\
  \            System.out.println(\"end(1): \"+m.end(1));\n            System.out.println(\"\
  start(2): \"+m.start(2));\n            System.out.println(\"end(2): \"+m.end(2));\n\
  \        }\n    }\n}\n```\n\n输出：\n```\nstart(1): 8\nend(1): 11\nstart(2): 11\nend(2):\
  \ 19\n```\n\n### appendReplacement(StringBuffer sb, String replacement)\n\n它从插入位置开始从输入序列中读取字符，并将其添加到指定的缓冲区。之后，它将指定的字符串添加到字符串缓冲区以创建一个新文本。\n\
  \n代码片段：\n\n```java\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\
  import java.util.regex.Pattern;\n\npublic class PatternSample {\n    public static\
  \ void main(String[] args) {\n        Pattern p = Pattern.compile(\"dog\");\n  \
  \      Matcher m = p.matcher(\"one dog dogs in the house\");\n        StringBuffer\
  \ sb = new StringBuffer();\n        while (m.find()) {\n            m.appendReplacement(sb,\
  \ \"rabbit\");\n        }\n        m.appendTail(sb);\n        System.out.println(sb.toString());\n\
  \    }\n}\n```\n\n输出：\n```\none rabbit rabbits in the house\n```\n\n### appendTail(StringBuffer)\n\
  \n此方法配合 `appendReplacement()` 方法使用，用于替换后形成新的字符串。\n\n### replaceAll(String replacement)\n\
  \n此方法用提供的替换字符串替换输入字符串中匹配模式的所有子集。\n\n```java\npackage com.sample.regexsample;\n\n\
  import java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class\
  \ PatternSample {\n    public static void main(String[] args) {\n        String\
  \ input = \"aaahorsebbccse\";\n        String patternString = \"horse\";\n     \
  \   String output=\"\";\n        Pattern p = Pattern.compile(patternString);\n \
  \       Matcher m = p.matcher(input);\n        output = m.replaceAll(\"dog\");\n\
  \        System.out.println(\"Input:\"+input);\n        System.out.println(\"Output:\"\
  +output);\n    }\n}\n```\n\n输出：\n```\nInput:aaahorsebbccse\nOutput:aaadogbbog\n\
  ```\n\n### replaceFirst(String replacement)\n\n此方法用替换字符串替换输入字符串中第一个匹配模式的子集。\n\n\
  ```java\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\nimport\
  \ java.util.regex.Pattern;\n\npublic class PatternSample {\n    public static void\
  \ main(String[] args) {\n        String input = \"aaahorsebbccse\";\n        String\
  \ patternString = \"horse\";\n        String output=\"\";\n        Pattern p = Pattern.compile(patternString);\n\
  \        Matcher m = p.matcher(input);\n        output = m.replaceFirst(\"dog\"\
  );\n        System.out.println(\"Input:\"+input);\n        System.out.println(\"\
  Output:\"+output);\n    }\n}\n```\n\n输出：\n```\nInput:aaahorsebbccse\nOutput:aaadogbbccse\n\
  ```\n\n### quoteReplacement(String s)\n\n此方法为指定的输入字符串返回字面替换字符串。该字面替换字符串可以作为字面替换用于\
  \ `Matcher` 类的 `appendReplacement` 方法。\n\n### PatternSyntaxException 类\n\n`PatternSyntaxException`\
  \ 是一种表示正则表达式语法错误的运行时异常。`PatternSyntaxException` 类提供了以下方法来解决不准确之处：\n\n1 `public String\
  \ getDescription()` 提供错误描述\n\n2 `public int getIndex()` 获取错误索引。\n\n3 `public String\
  \ getPattern()` 恢复错误的正则表达式模式。\n\n4 `public String getMessage()` 返回一个包含语法错误描述及其索引、错误的正则模式以及模式内错误索引的视觉指示的多行字符串。\n\
  \n示例代码：\n\n```java\npackage com.sample.regexsample;\n\nimport java.io.Console;\n\
  import java.util.regex.Matcher;\nimport java.util.regex.Pattern;\nimport java.util.regex.PatternSyntaxException;\n\
  \npublic class DemoForPatternSyntaxexception {\n    public static void main(String[]\
  \ args){\n        Pattern pattern = null;\n        Matcher matcher = null;\n   \
  \     String regex = \"?i)foo\";\n        while (true) {\n            try{\n   \
  \             pattern =\n```\n\n\n\n\n```java\nPattern.compile(regex);\n\nmatcher\
  \ = pattern.matcher(\"FOO\");\n\n} \ncatch(PatternSyntaxException pse){\n\n    System.out.println(\"\
  There is a problem\" +\n    \" with the regular expression!%n\");\n    System.out.println(\"\
  The pattern in question is: %s%n\"+pse.getPattern());\n    System.out.println(\"\
  The description is: %s%n\"+pse.getDescription());\n    System.out.println(\"The\
  \ message is: %s%n\"+pse.getMessage());\n    System.out.println(\"The index is:\
  \ %s%n\"+pse.getIndex());\n    System.exit(0);\n}\nboolean  found = false;\n\nwhile\
  \ (matcher.find()) {\n    System.out.println(\"I found the text\" +\n    \" \\\"\
  %s\\\" starting at \" +\n    \"index %d and ending at index %d.%n\"+\n    matcher.group()+\n\
  \    matcher.start()+\n    matcher.end());\n    found = true;\n}\nif(!found){\n\
  \    System.out.println(\"No match found.%n\");\n}\n}\n}\n}\n```\n\n输出:\nThere is\
  \ a problem with the regular expression!%n\nThe pattern in question is: %s%n?i)foo\n\
  The description is: %s%nDangling meta character '?'\nThe message is: %s%nDangling\
  \ meta character '?' near index 0\n?i)foo\n^\nThe index is: %s%n0\n\n从此输出中，我们可以发现语法错误是索引\
  \ 0 处有一个悬挂的元字符（问号）。缺失的左括号是罪魁祸首。\n\n# 第 4 章\n\n# 用户名正则表达式\n\n此语法解释了如何使用正则表达式来验证用户名。这是在各种网站和应用程序中常用的常用模式。\n\
  \n### 语法\n```\n^[a-z0-9_-]{3,15}$\n```\n\n### 解释：\n- `^`: 行首\n- `[a-z0-9_-]`: 列表中的字符，`a-z`、`0-9`、下划线、连字符\n\
  - `{3,15}`: 长度至少 3 个字符，最大长度为 15\n- `$`: 行尾\n\n整个组合意味着 3 到 15 个字符，仅包含任何小写字母、数字或特殊符号\
  \ `_-`。如果我们需要添加大写字母 `A-Z`。如果我们需要增加最大字符数，将 15 修改为相应值。\n\n### 名字示例代码：\n```java\npackage\
  \ com.sample.regex;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
  public class UserNameValidator {\n    static void main(String[] args) {\n      \
