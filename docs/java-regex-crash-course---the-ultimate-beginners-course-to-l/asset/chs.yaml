  \n# 第 15 章\n\n# 用于电话号码的正则表达式\n\n## 正则表达式\n`^\\(?([0-9]{3})\\)?[-.\\s*]?([0-9]{3})[-.\\\
  s*]?([0-9]{4})$`\n\n### 解释：\n```\n^                               # 断言位于字符串开头。\n\
  \\(                              # 匹配字面量 \"(\"\n?                              \
  \ # 零到一次。\n(                               # 捕获匹配的内容作为反向引用 1:\n[0-9]{3}        \
  \                # 匹配三个数字\n)                                # 捕获组结束\n\\)       \
  \                       # 匹配字面量 \")\"\n[-.\\s*]?                        # 匹配连字符、点、空格或星号（零次或一次）\n\
  ([0-9]{3})                      # 匹配三个数字\n[-.\\s*]?                        # 匹配连字符、点、空格或星号（零次或一次）\n\
  ([0-9]{4})                      # 匹配四个数字\n$                               # 断言位于字符串结尾。\n\
  ```\n\n### 示例：\n```java\npackage com.sample.regexsample;\nimport java.util.regex.Matcher;\n\
