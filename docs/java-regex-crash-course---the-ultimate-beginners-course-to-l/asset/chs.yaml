  \n# 第 5 章\n\n# 密码正则表达式\n\n### 语法\n```\n((?=.*\\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%]).{6,20})\n\
  ```\n\n### 解释：\n- `(`：开始\n- `(?=.*\\d)`：包含一个 0-9 数字\n- `(?=.*[a-z])`：包含一个小写字母\n\
  - `(?=.*[A-Z])`：包含一个大写字母\n- `(?=.*[@#$%])`：包含特殊符号 `@#$%`\n- `.`: 任意字符\n- `{6,20}`：长度至少\
  \ 6 个字符，最大 20 个\n- `)`：结束\n\n`?=` 表示应用断言条件，本身没有意义，总是与其他组合工作\n\n整个正则表达式组合意味着 6 到\
  \ 20 个字符的字符串，至少包含一个数字、一个大写字母、一个小写字母和一个特殊符号（`@#$%`）。\n\n### 示例代码：\n```java\npackage\
  \ com.sample.regexsample;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
  public class PasswordValidator {\n    static void main(String[] args) {\n      \
  \  String input = \"((?=.*\\\\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%]).{6,20})\";\n\
  \        String userName =\" myname1A@\";\n        String userName1=\"mY1A@\";\n\
  \        Pattern p = Pattern.compile(input);\n        Matcher m = p.matcher(userName);\n\
  \        Matcher m2 = p.matcher(userName1);\n        System.out.println(\"The password\
  \ 1 matches:\"+ m.matches());\n        System.out.println (\"The password 2 matches:\"\
  + m2.matches());\n    }\n}\n```\n\n\n\n\n```java\nprivate Matcher matcher;\n\nprivate\
  \ static final String PASSWORD_PATTERN = \"((?=.*\\\\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%]).{6,20})\"\
  ;\n\npublic PasswordValidator() {\n    pattern = Pattern.compile(PASSWORD_PATTERN);\n\
  }\n\n/**\n * 使用正则表达式验证密码\n * @param password 用于验证的密码\n * @return true 有效密码，false\
  \ 无效密码\n */\npublic boolean validate(final String password) {\n    matcher = pattern.matcher(password);\n\
  \    return matcher.matches();\n}\n```\n\n## 单元测试：\n\n```java\npackage com.sample.RegexTest;\n\
