  \nStart index: 39 End index: 40  : $\nStart index: 49 End index: 50  : €\nStart\
  \ index: 57 End index: 58  : ¥\n\n# 第 18 章\n\n# 使用正则表达式时的常见错误\n\n以下是我们使用 `REGEX`\
  \ 时常见的错误：\n\n## 使用简单字符串匹配时的错误\n\n例如，让我们考虑想要在字符串：“asdfdfdasdfdfdf”中搜索“dfd”的出现次数。如果我们查看该字符串，它显示我们可以在\
  \ `String` 中找到 4 次。\n\n让我们使用正则表达式来评估并找出我们的小型 Java 程序是如何输出的。\n\n### 示例代码：\n```java\n\
  package com.sample.regexsample;\n\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
  \npublic class DemoForMistakes {\n public static void main(String[] args) {\n  \
  \      String source = \"asdfdfdasdfdfdf\";\n        Pattern pattern = Pattern.compile(\"\
  dfd\");\n        Matcher matcher = pattern.matcher(source);\n        int hits =\
  \ 0;\n        while (matcher.find()) {\n            hits++;\n        }\n       \
  \ System.out.println(hits);\n    }\n}\n```\n\nOutput:\n\n2 而不是 4\n\n那么问题所在在哪里？要么我们的代码错了，要么逻辑运行方式与预期不同。事实上，情况确实如此。\n\
  \n在 Java 中使用正则表达式时的第一个重要规则是：搜索从左到右运行，如果一个字符已经在搜索中使用过，它将不会被重复使用。所以，当我们看到“dfdfd”时，我们使用了前三个字母进行匹配，只剩下“fd”，这是无法匹配的。因此，在编写需要评估的表达式时，我们需要小心。\n\
  \n## 对 `\\` 字符的谨慎使用\n\n让我们考虑我们的应用程序想要从服务接收到的长文本中读取 IP 地址。首先要考虑的点是 IP 地址格式的定义。我们有\
  \ 4 组由点分隔的数字，范围从 0 到 255。让我们将其写成正则表达式。如果你有更好或更优雅的解决方案，欢迎随时评论。\n\nPattern: `\\b(?:25[0-5]|2[0-4][0-9]|[01?[0-9][0-9]?)\\\
  .{3}(?:25[0-5]|2[0-4][0-9]|[01?[0-9][0-9]?)\\b`\n\n基本上，它获取了前三个由点分隔的允许数字，并重复了 3 次，最后一个块具有相同的模式，但没有末尾的点。\n\
  \n示例代码：\n```java\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\
  import java.util.regex.Pattern;\n\npublic class DemoForIPMistake {\n public static\
  \ void main(String[] args) {\n        String logtext = \"asdfesgew 215.2.125.32\
  \ alkejo 234 oij982jld\" + \"kja.lkwech . 24.33.125.234 kadfjeladkj\";\n       \
  \ String regexpatter = \"\\b(?:25[0-5]|2[0-4][0-9]|[01?[0-9][0-9]?)\\.{3}(?:25[0-5]|2[0-4][0-9]|[01?[0-9][0-9]?)\\\
  b\";\n        Pattern pattern = Pattern.compile(regexpatter);\n        Matcher matcher\
  \ = pattern.matcher(logtext);\n        while (matcher.find()) {\n            System.out.println(logtext.substring(matcher.start(),matcher.end()));\n\
  \        }\n    }\n}\n```\n\nOutput:\n\n它什么都不会打印，因为 `\\b` 字符没有使用反斜杠，且边界没有定义。\n\n\
  正确的代码：\n```java\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\
  import java.util.regex.Pattern;\n\npublic class DemoForIPMistake {\n public static\
  \ void main(String[] args) {\n        String logtext = \"asdfesgew 215.2.125.32\
  \ alkejo 234 oij982jld\" + \"kja.lkwech . 24.33.125.234 kadfjeladkj\";\n       \
  \ String regexpatter = \"\\\\b(?:25[0-5]|2[0-4][0-9]|[01?[0-9][0-9]?)\\\\.{3}(?:25[0-5]|2[0-4][0-9]|[01?[0-9][0-9]?)\\\
  \\b\";\n        Pattern pattern = Pattern.compile(regexpatter);\n        Matcher\
  \ matcher = pattern.matcher(logtext);\n        while (matcher.find()) {\n      \
  \      System.out.println(logtext.substring(matcher.start(),matcher.end()));\n \
  \       }\n    }\n}\n```\n\nOutput:\n\n215.2.125.32\n24.33.125.234\n\n（修正后的翻译逻辑）\n\
  \n让我们考虑我们的应用程序想要从服务接收到的长文本中读取 IP 地址。首先要考虑的点是 IP 地址格式的定义。我们有 4 组由点分隔的数字，范围从 0 到 255。让我们将其写成正则表达式。如果你有更好或更优雅的解决方案，欢迎随时评论。\n\
