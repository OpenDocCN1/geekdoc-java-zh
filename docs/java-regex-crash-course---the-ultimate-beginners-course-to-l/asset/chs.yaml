  \        Matcher m3 = p.matcher(emailAddress3);\n        System.out.println(\"Email\
  \ 1 matches:\"+ m.matches());\n        System.out.println(\"Email 2 matches:\"+\
  \ m2.matches());\n        System.out.println(\"Email 3 matches:\"+ m3.matches());\n\
  \    }\n}\n```\n输出：\nEmail 1 matches:true\nEmail 2 matches:false\nEmail 3 matches:true\n\
