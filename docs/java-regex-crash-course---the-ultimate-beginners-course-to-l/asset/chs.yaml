  \ , true\nEmail is 有效 : mkyong-100@yahoo-test.com , true\n\n# 第 7 章\n\n# 正则颜色编码\n\
  \n### 十进制颜色代码正则表达式模式\n\n`^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$`\n\n### 描述\n\n- `^`\
  \ : 行首\n- `#` : 必须包含 \"#\" 符号\n- `(` : 组 #1 开始\n- `[A-Fa-f0-9]{6}` : 列表中的任意字符串，长度为\
  \ 6\n- `|` : ..或\n- `[A-Fa-f0-9]{3}` : 列表中的任意字符串，长度为 3\n- `)` : 组 #1 \n- `$` : 行尾\n\
  \n颜色编码字符串意味着：以 `#` 符号开头，后面紧跟一个 `a` 到 `f`、`A` 到 `Z` 的字母或 `0` 到 `9` 的数字，长度恰好为 6 或\
  \ 3。\n\n### 示例代码：\n\n```java\npackage com.sample.regex;\nimport java.util.regex.Matcher;\n\
  import java.util.regex.Pattern;\npublic class HexCode {\n public staticvoid main(String[]\
  \ args) {\nString input =\"^([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$\";\nString hexCode1=\"\
  #1f1F\";\nString hexCode2=\"#2345\";\nPattern p = Pattern.compile(input);\nMatcher\
  \ m = p.matcher(hexCode1);\nMatcher m2 = p.matcher(hexCode2);\n System.out.println\
  \ (\"The hexCode 1 matches:\"+ m.matches());\n System.out.println (\"The hexCode\
  \ 2 matches:\"+ m2.matches());\n}\n```\n\n输出:\nhexCode 1 matches:true\nhexCode 2\
  \ matches:false\n\n# 第 8 章\n\n# 图片文件的正则表达式\n\n### 图片扩展名正则表达式模式\n\n`([^\\s]+\\.(?i)(jpg|png|bmp))`\n\
  \n#### 描述 \n\n- `(` : 组 #1 开始\n- `[^\\s]+` : 包含一个或多个任意字符（空格除外）\n- `(` : 组 #2 开始\n\
  - `\\.` : 后面跟着一个点 \".\"\n- `(?i)` : 忽略后续字符的大小写敏感\n- `(` : 组 #3 开始\n- `jpg` : 包含字符\
  \ \"jpg\"\n- `|` : ..或\n- `png` : 包含字符 \"png\"\n- `|` : ..或\n- `gif` : 包含字符 \"gif\"\
  \n- `|` : ..或\n- `bmp` : 包含字符 \"bmp\"\n- `)` : 组 #3 结束\n- `)` : 组 #2 结束\n- `$` :\
  \ 字符串结束\n\n该正则表达式意味着：必须有 1 个或多个字符串（非空格），后面跟着一个点并以 `jpg` 或 `png` 或 `bmp` 结尾，且文件扩展名忽略大小写。这个正则表达式非常适用于许多扩展名检查示例，你可以修改最后的组合\
  \ `(jpg, png, bmp)` 以满足你的需求。\n\n### 示例代码：\n\n```java\npackage com.sample.regexsample;\n\
  import java.util.regex.Matcher;\nimport java.util.regex.Pattern;\npublic class DemoForImageFile\
  \ {\n public staticvoid main(String[] args) {\nString input = \"([^\\\\s]+\\\\.(?i)(jpg|png|bmp))$\"\
  ;\nString file1 =\"Karen_3.gif\";\nString file2=\"My\";\nPattern p = Pattern.compile(input);\n\
  Matcher m = p.matcher(file1);\nMatcher m2 = p.matcher(file2);\n System.out.println\
  \ (\"The file 1 matches:\"+ m.matches());\n System.out.println (\"The file 2 matches:\"\
  + m2.matches());\n }\n}\n```\n\n输出:\nThe file 1 matches:true\nThe file 2 matches:false\n\
  \n# 第 9 章\n\n# IP 地址的正则表达式\n\n### IP 地址正则表达式模式\n\n`^([01]?\\d|2[0-4]\\d|255)(\\\
  .[01]?\\d|2[0-4]\\d|255)){3}$`\n\n### 描述\n\n该正则表达式匹配匹配 0 到 255 的格式。\n\n- `^` : 行首\n\
  - `(` : 组 #1 开始\n- `[01]?\\d|2[0-4]\\d|255` : 可以是一个或两个数字，如果是三位则必须是 0-249 或 255\n\
  - `\\.` : 后面跟着一个点\n- `(...){3}` : 重复 3 次\n- `$` : 行尾\n\n### 示例代码：\n\n```java\npackage\
  \ com.sample.regexsample;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
  public class DemoForIp {\n public staticvoid main(String[] args) {\nString IPADDRESS_PATTERN\
  \ = \"^([01]?\\d|2[0-4]\\d|255)(\\.[01]?\\d|2[0-4]\\d|255)){3}$\";\nString ipAddress1\
  \ =\"192.2.1\";\nString ipAddress2=\"100.23.255\";\nPattern p = Pattern.compile(IPADDRESS_PATTERN);\n\
  Matcher m = p.matcher(ipAddress1);\nMatcher m2 = p.matcher(ipAddress2);\n System.out.println\
  \ (\"The ip 1 matches:\"+ m.matches());\n System.out.println (\"The ip 2 matches:\"\
  + m2.matches());\n }\n}\n```\n\n输出:\nThe ip 1 matches:false\nThe ip 2 matches:true\n\
  \n# 第 10 章\n\n# 时间格式的正则表达式\n\n### 12 小时制时间正则表达式\n\n`(1[012]|[1-9]):[0-5]0-9?(?i)(am|pm)`\n\
  \n### 描述\n\n- `(` : 组 #1 开始\n- `1[012]` :  10, 11, 12\n- `|` : ..或\n- `[1-9]` :\
  \  1,2,...9\n- `)` : 组 #1 结束\n- `:` : 后面跟着一个冒号 (:)\n- `[0-5][0-9]` : 后面跟着 0..5 和\
  \ 0..9，意味着 00 到 59\n- `(\\s)?` : 可选空格\n- `(?i)` : 忽略大小写\n- `(am|pm)` : 包含 am 或 pm\n\
  \n\n\n\n\n`(\\s)?` # 后面跟着一个空格（可选）\n`(?i)` # 下一步检查不区分大小写\n`(am|pm)` # 后面跟着 am 或 pm\n\
  \n整个正则表达式的意思是：12 小时制格式从 0-12 开始，然后是一个冒号（`:`），紧接着是 00-59，并以 am 或 pm 结束。\n\n### 示例代码：\n\
  \n```java\npackage com.sample.regexsample;\n\nimport java.util.regex.Matcher;\n\
  import java.util.regex.Pattern;\n\npublic class DemoForTimeFormat {\n    public\
  \ static void main(String[] args) {\n        String input = \"(1[012]|[1-9]):[0-5]0-9?(?i)(am|pm)\"\
  ;\n        String time1=\"10:15 pm\";\n        String time2=\"12:45 a.m\";\n   \
  \     String time3=\"01:45 am\";\n        String time4=\"2:45 am\";\n        Pattern\
  \ p = Pattern.compile(input);\n        Matcher m = p.matcher(time1);\n        Matcher\
  \ m2 = p.matcher(time2);\n        Matcher m3 = p.matcher(time3);\n        Matcher\
  \ m4 = p.matcher(time4);\n\n        System.out.println (\"The time 1 matches:\"\
  + m.matches());\n        System.out.println (\"The time 2 matches:\"+ m2.matches());\n\
  \        System.out.println (\"The time 3 matches:\"+ m3.matches());\n        System.out.println\
  \ (\"The time 4 matches:\"+ m4.matches());\n    }\n}\n```\n\n**输出：**\n```\nThe time\
  \ 1 matches:true\nThe time 2 matches:false\nThe time 3 matches:false\nThe time 4\
  \ matches:true\n```\n\n## 24 小时制时间正则表达式\n\n`([01]?[0-9]|2[0-3]):[0-5][0-9]`\n\n\
  ### 描述\n\n`(` 组 #1 开始\n`[01]?[0-9]` # 以 0-9, 1-9, 00-09, 10-19 开始\n`|` # 或\n`2[0-3]`\
  \ # 以 20-23 开始\n`)` 组 #1 结束\n`:` # 跟着一个冒号（:）\n`[0-5][0-9]` # 跟着 0..5 和 0..9，意味着\
  \ 0 到 59\n24 小时制格式的正则表达式是从 0-23 或 0-23 开始，然后是一个冒号（:），后面跟着 0-5。\n\n### 示例代码：\n\n\
  ```java\npackage com.sample.regexsample;\nimport java.util.regex.Matcher;\nimport\
  \ java.util.regex.Pattern;\n\npublic class DemoforFormat2 {\n    static void main(String[]\
  \ args) {\n        String input = \"([01]?[0-9]|2[0-3]):[0-5][0-9]\";\n        String\
  \ time1=\"10:15\";\n        String time2=\"12:45\";\n        String time3=\"25:45\"\
  ;\n        String time4=\"23:45\";\n        Pattern p = Pattern.compile(input);\n\
  \        Matcher m = p.matcher(time1);\n        Matcher m2 = p.matcher(time2);\n\
  \        Matcher m3 = p.matcher(time3);\n        Matcher m4 = p.matcher(time4);\n\
  \n        System.out.println (\"The time 1 matches:\"+ m.matches());\n        System.out.println\
  \ (\"The time 2 matches:\"+ m2.matches());\n        System.out.println (\"The time\
  \ 3 matches:\"+ m3.matches());\n        System.out.println (\"The time 4 matches:\"\
  + m4.matches());\n    }\n}\n```\n\n**输出：**\n```\nThe time 1 matches:true\nThe time\
  \ 2 matches:true\nThe time 3 matches:false\nThe time 4 matches:true\n```\n\n# 第\
  \ 11 章：日期格式正则表达式\n\n日期格式 (dd/mm/yyyy) 正则表达式模式\n`(0?[1-9]|[12][0-9]|3[01])/(0?[1-9]|1[012])/((19|20)\\\
  \\d\\\\d)`\n\n### 描述\n\n`(` 组 #1 开始\n`0?[1-9]` # 01-09 或 1-9\n`|` # 或\n`[12][0-9]`\
  \ # 10-19 或 20-29\n`|` # 或\n`3[01]` # 30, 31\n`)` 组 #1 结束\n`/` # 跟着一个 \"/\"\n`(`\
  \ 组 #2 开始\n`0?[1-9]` # 01-09 或 1-9\n`|` # 或\n`1[012]` # 10, 11, 12\n`)` 组 #2 结束\n\
  `/` # 跟着一个 \"/\"\n`(` 组 #3 开始\n`(19|20)\\\\d\\\\d` # 19[0-9] 或 20[0-9]\n`)` 组 #3\
  \ 结束\n\n上面的正则用于验证日期格式“dd/mm/yyyy”，通常你可以根据需要对此正则表达式进行调整。无论如何，验证闰年、某月份有 30 天还是 31\
  \ 天会有点复杂，让我们看看如何做到。\n\n### 示例代码：\n\n```java\npackage com.sample.regexsample;\nimport\
  \ java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class HexCodeValidator\
  \ {\n    static void main(String[] args) {\n        String input = \"(0?[1-9]|[12][0-9]|3[01])/(0?[1-9]|1[012])/((19|20)\\\
  \\d\\\\d)\";\n        String date1 =\"31/08/2016\";\n        String date2=\"12345\"\
  ;\n        Pattern p = Pattern.compile(input);\n        Matcher m = p.matcher(date1);\n\
  \        Matcher m2 = p.matcher(date2);\n\n        System.out.println (\"The date\
  \ 1 matches:\"+ m.matches());\n        System.out.println (\"The date 2 matches:\"\
  + m2.matches());\n    }\n}\n```\n\n**输出：**\n```\nThe date 1 matches:true\nThe date\
  \ 2 matches:false\n```\n\n## 练习\n使用命名分组（special construct）验证闰年的日期格式。\n\n## 解决方案\n\
  \n### 代码示例\n\n```java\npackage com.sample.regexsample;\nimport java.text.DateFormat;\n\
  import java.text.ParseException;\nimport java.text.SimpleDateFormat;\nimport java.util.ArrayList;\n\
  import java.util.Date;\nimport java.util.List;\nimport java.util.regex.Matcher;\n\
  import java.util.regex.Pattern;\n\npublic class DemoForDateValidation {\n    public\
  \ static void main(String[] args) {\n        String input = \"^(?<month>[0-3]?[0-9])/(?<day>[0-3]?[0-9])/(?<year>(?:[0-9]{2})[0-9]{2})$\"\
  ;\n        List<String> dates = new ArrayList<String>();\n        dates.add(\"02/31/2011\"\
  );\n        dates.add(\"02/27/2011\");\n        Pattern p = Pattern.compile(input);\n\
  \        for (String date : dates) {\n            Matcher matcher = p.matcher(date);\n\
  \            if (matcher.matches()) {\n                String day = matcher.group(2);\n\
  \                String month = matcher.group(1);\n                String year =\
  \ matcher.group(3);\n                String formattedDate = month + \"/\" + day\
  \ + \"/\" + year;\n                System.out.println(\"Date to check: \" + formattedDate);\n\
  \                try {\n                    DateFormat df = new SimpleDateFormat(\"\
  MM/dd/yyyy\");\n                    df.setLenient(false);\n                    Date\
  \ d = df.parse(date);\n                    System.out.println(\"Parsed: \" + d);\n\
  \                } catch (ParseException e) {\n                    System.out.println(\"\
  Parsed: Invalid\");\n                }\n            }\n        }\n    }\n}\n```\n\
  **输出：**\n```\nDate to check: 02/31/2011\nParsed: Invalid\nDate to check: 02/27/2011\n\
  Parsed: Sun Feb 27 00:00:00 2011\n```\n\n\n\n\n\n整体上的正则表达式意思是：HTML 标签以起始标签“<”开头，后跟着双引号\
  \ \"string\" 或单引号 'string'，但不允许单个双引号 (\") \"string\"、单个单引号 (') 'string 或没有单双引号包裹的结束标签\
  \ >。最后，以结束标签“>”结尾。\n\n### 示例：\n\n```java\npackage com.sample.regexsample;\n\nimport\
  \ java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class DemoForHTMLTag\
  \ {\n    public static void main(String[] args) {\n        String HTML_PATTERN =\
  \ \"<(\\\"[^\\\"]*\\\"|'[^']*'|[^'\\\">])*>\";\n        String htmlTag = \"<br>\"\
  ;\n        Pattern p = Pattern.compile(HTML_PATTERN);\n        Matcher m = p.matcher(htmlTag);\n\
  \        System.out.println (\"The html tag matches:\"+ m.matches());\n    }\n}\n\
  ```\n\n输出\nThe html tag matches:true\n\n# 第 13 章\n\n# 用于查找 HTML 链接的正则表达式\n\n## 提取\
