  The html tag matches:true\nThe html tag matches:false\nThe html tag matches:true\n\
  ```\n\n# 第 17 章\n\n# 其他常用模式\n\n## 验证仅字母数字模式\n\n模式：\n`^[a-zA-Z0-9]*$`\n\n解释：\n`^[a-zA-Z0-9]*$`\n\
  - `^` # 模式开始\n- `[` # 字符串开始\n- `a-zA-Z0-9` # 单词包含 a 到 z 的字符（不区分大小写）以及从 0 到 9 的数字\n\
  - `]` # 字符串结束\n- `*` # 可选的字母或数字\n- `$` # 模式结束\n\n```java\npackage com.sample.regexsample;\n\
  \nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic  class\
