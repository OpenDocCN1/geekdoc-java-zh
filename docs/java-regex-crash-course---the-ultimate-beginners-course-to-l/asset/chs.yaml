  \ 125 \n```\n\n## 使用边界匹配完整单词\n这主要用于在日志文件等文本中搜索单词。\n\n### 模式\n`\\bword\\b`\n\n###\
  \ 解释\n`\\b` 表示要搜索的边界。关于 `\\b` 的工作原理，它通常匹配以下位置：\n1. 数据开头，如果第一个字符是单词字符。\n2. 数据末尾，如果最后一个字符是单词字符。\n\
  3. 数据中两个字符之间，且其中一个是单词字符而另一个不是。\n\n```java\npackage com.sample.regexsample;\nimport\
  \ java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class DemoForBoundary\
  \ {\n    static void main(String[] args) {\n        String data1 = \"Today, java\
  \ is oriented language\";\n        String regex = \"\\\\java\\\\b\";\n        Pattern\
  \ pattern = Pattern.compile(regex, Pattern.CASE_INSENSITIVE);\n        Matcher matcher\
  \ = pattern.matcher(data1);\n        while (matcher.find()) {\n            System.out.print(\"\
  Start index: \" + matcher.start());\n            System.out.print(\" End index:\
  \ \" + matcher.end() + \" \");\n            System.out.println(matcher.group());\n\
  \        }\n    }\n}\n```\n输出:\n```\nStart index: 7 End index: 11 java\n```\n\n\
  ## 验证商标 ™符号\n\n### 模式\n`\\u2122`\n\n### 解释:\n这是商标符号的 Unicode 字符。\n\n### 示例代码:\n\
