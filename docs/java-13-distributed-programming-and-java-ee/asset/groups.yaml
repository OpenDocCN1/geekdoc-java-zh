- md: "\nJAVA 13: DISTRIBUTED PROGRAMMING AND\nJAVA EE: SOFTWARE DEVELOPMENT\n\nENTERPRISE\
    \ JAVA BEANS\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_95_0.png)\n\n## 3.7 CRUD\
    \ WITH ONE TABLE\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_95_1.png)\n\nIn database\
    \ contexts, CRUD stands for *Create, Read, Update* and *Delete* operations, in\
    \ this section I will show you how to write a program that performs these operations\
    \ on a single database table using EJB. The application must use an EJB with a\
    \ remote interface. As an example, I will use the *zipcode* from the database\
    \ *padata*, and the application should open a window as shown above, where 78\
    \ entered for zip code has been searched. The meaning of the buttons should be\
    \ self explanatory and clicking on a link in the table will insert the zip code\
    \ into the top two fields which can be edited. In the following, I will explain\
    \ how the program is written and thus the process.\n\nJAVA 13: DISTRIBUTED PROGRAMMING\n\
    JAVA EE: SOFTWARE DEVELOPMENT\nENTERPRISE JAVA BEANS\n\nI have started creating\
    \ an EJB Module project, which I have called ZipcodesEJB. Then I have created\
    \ a usual Class Library project, which I have called ZipcodesRemote. For this\
    \ project, I have added a class ZipcodeRemote, which should represent the objects\
    \ to be transmitted between the web application and the session object (I have\
    \ not shown get and set methods):\n\n```java\npackage zipcodes.beans;\n\nimport\
    \ javax.ejb.Remote;\n\n@Remote\npublic class ZipcodeRemote implements java.io.Serializable\n\
    {\n    private String code;\n    private String city;\n\n    public ZipcodeRemote()\n\
    {\n}\n```\n\nThen I have to the project ZipcodesEJB added a remote stateless session\
    \ bean named ZipcodesSession, which adds a remote interface to the above class\
    \ library:\n\n```java\npackage zipcodes.beans;\n\nimport javax.ejb.Remote;\nimport\
    \ java.util.List;\n\n@Remote\npublic interface ZipcodesSessionRemote\n{\n    public\
    \ boolean create(ZipcodeRemote obj);\n    public boolean update(ZipcodeRemote\
    \ obj);\n    public boolean remove(String code);\n    public List<ZipcodeRemote>\
    \ search(String code, String City);\n}\n```\n\nThe biggest work is to implement\
    \ the ZipcodesSession. In the zipcodes.models package I have added an entity class\
    \ Zipcode for the database table. This class is unchanged from the code generated\
    \ by NetBeans. I would like to add a class for database operations, but a JPA\
    \ controller cannot be used directly from an EJB, so I added my own (which is\
    \ nothing but a modified and scaled-down version of the controller class created\
    \ by NetBeans — see also the next example), which I have called ZipcodeDAO.\n\n\
    JAVA 13: DISTRIBUTED PROGRAMMING\nJAVA EE: SOFTWARE DEVELOPMENT\nENTERPRISE BEANS\n\
    \n```java\npackage zipcodes.models;\n\nimport java.util.*;\nimport javax.persistence.*;\n\
    \npublic class ZipcodeDAO {\n    public EntityManager getEntityManager() {\n \
    \       return Persistence.createEntityManagerFactory(\"ZipcodesEJBPU\").createEntityManager();\n\
    \    }\n\n    public void create(Zipcode zipcode) throws Exception {\n       \
    \ EntityManager em = null;\n        try {\n            em = getEntityManager();\n\
    \            em.getTransaction().begin();\n            em.persist(zipcode);\n\
    \            em.getTransaction().commit();\n        } catch (Exception ex) {\n\
    \            if (em != null) em.getTransaction().rollback();\n            throw\
    \ ex;\n        } finally {\n            if (em != null) em.close();\n        }\n\
    \    }\n```\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_97_0.png)\n\n```java\n\
    public void edit(Zipcode zipcode) throws Exception\n{\n    EntityManager em =\
    \ null;\n    try {\n        em = getEntityManager();\n        em.getTransaction().begin(zipcode);\n\
    \        em.merge(zipcode);\n        em.getTransaction().commit();\n    } catch\
    \ (Exception ex)\n    {\n        if (em != null) em.getTransaction().rollback();\n\
    \        throw ex;\n    }\n    finally {\n        if (em != null) em.close();\n\
    \    }\n}\n\npublic void destroy(String code) throws Exception\n{\n    EntityManager\
    \ em = null;\n    try {\n        em = getEntityManager();\n        em.getTransaction().begin();\n\
    \        Zipcode zipcode;\n        try {\n            zipcode = em.getReference(Zipcode.class,\
    \ code);\n            zipcode.getCode();\n        } catch (Exception e) {\n  \
    \          throw new Exception(\"The zipcode with \" + code + \" no longer exists\"\
    );\n        }\n        em.remove(zipcode);\n        em.getTransaction().commit();\n\
    \    } catch (Exception ex) {\n        if (em != null) em.getTransaction().rollback();\n\
    \        throw ex;\n    } finally {\n        if (em != null) em.close();\n   \
    \ }\n}\n\npublic List<Zipcode> getZipcodes(String code, String city) {\n    if\
    \ (code == null) code = \"\";\n    if (city == null) city = \"\";\n    EntityManager\
    \ em = null;\n    try {\n        em = getEntityManager();\n        Query cq =\
    \ em.createQuery(\"SELECT z FROM Zipcode z WHERE z.code like :code AND z.city\
    \ like :city\");\n        cq.setParameter(\"code\", code + \"%\");\n        cq.setParameter(\"\
    city\", \"%\" + city + \"%\");\n        return cq.getResultList();\n    } catch\
    \ (Exception ex) {\n        throw ex;\n    } finally {\n        if (em != null)\
    \ em.close();\n    }\n}\n```\n\nThe class is very similar to the DAO (Data Access\
    \ Object) which creates, but you should note how to use the EntityManager to Create,\
    \ Read, Update, and Delete. Also note the search method, where JPQL is used instead\
    \ of the Criteria API.\n\nJAVA 13: DISTRIBUTED PROGRAMMING\nJAVA EE: SOFTWARE\
    \ DEVELOPMENT\nENTERPRISE BEANS\n\n```java\npackage zipcodes.beans;\n\nimport\
    \ java.util.*;\nimport javax.ejb.Stateless;\nimport zipcodes.models.*;\n\n@Stateless\n\
    public class ZipcodesSession implements ZipcodesSessionRemote\n{\n    @Override\n\
    \    public boolean create(ZipcodeRemote obj)\n    {\n        try {\n        \
    \    new ZipcodeDAO().create(new Zipcode(obj.getCode(), obj.getCity()));\n   \
    \         return true;\n        } catch (Exception ex) {\n            return false;\n\
    \        }\n    }\n\n    @Override\n    public boolean update(ZipcodeRemote obj)\n\
    \    {\n        try {\n            new ZipcodeDAO().edit(new Zipcode(obj.getCode(),\
    \ obj.getCity()));\n            return true;\n        } catch (Exception ex) {\n\
    \            return false;\n        }\n    }\n\n    @Override\n    public boolean\
    \ remove(String code)\n    {\n        try {\n            new ZipcodeDAO().destroy(code);\n\
    \            return true;\n        } catch (Exception ex) {\n            return\
    \ false;\n        }\n    }\n\n    @Override\n    public List<ZipcodeRemote> search(String\
    \ code, String city)\n    {\n        List<Zipcode> zipcodes = new ZipcodeDAO().getZipcodes(code,\
    \ city);\n        List<ZipcodeRemote> list = new ArrayList<>();\n        for (Zipcode\
    \ zipcode : zipcodes) {\n            list.add(new ZipcodeRemote(zipcode.getCode(),\
    \ zipcode.getCity()));\n        }\n        return list;\n    }\n}\n```\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_100_0.png)\n\
    \nNote that the methods contain conversions of objects of type ZipcodeRemote to\
    \ and from objects of the entity type Zipcode. It is hardly necessary and the\
    \ problem could be solved by defining the entity type in the class library (see\
    \ the next example).\n"
  mdcn: "\n\nJAVA 13: 分布式编程\nJAVA EE: 软件开发\n\n企业级 Java Beans (EJB)\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_95_0.png)\n\
    \n## 3.7 单表 CRUD\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_95_1.png)\n\n在数据库上下文中，CRUD\
    \ 代表*创建（Create）、读取（Read）、更新（Update）*和*删除（Delete）*操作。在本节中，我将展示如何使用 EJB 编写程序对单个数据库表执行这些操作。应用程序必须使用带有远程接口的\
    \ EJB。例如，我将使用数据库 *padata* 中的 *zipcode*，应用程序像上面所示打开一个窗口，其中搜索了邮政编码 78。按钮的含义应该是不言自明的，点击表格中的链接会将邮政编码插入到顶部可编辑的两个字段中。接下来，我将解释程序的编写方法以及实现过程。\n\
    \nJAVA 13: 分布式编程\nJAVA EE: 软件开发\n企业级 Java Beans (EJB)\n\n我已开始创建一个 EJB 模块项目，将其命名为\
    \ ZipcodesEJB。然后，我创建了一个普通的类库项目，命名为 ZipcodesRemote。对于此项目，我添加了 `ZipcodeRemote` 类，它代表在\
    \ Web 应用程序和会话对象之间传输的对象（我没有展示 get 和 set 方法）：\n\n```java\npackage zipcodes.beans;\n\
    \nimport javax.ejb.Remote;\n\n@Remote\npublic class ZipcodeRemote implements java.io.Serializable\n\
    {\n    private String code;\n    private String city;\n\n    public ZipcodeRemote()\n\
    {\n}\n```\n\n然后，我在 ZipcodesEJB 项目中添加了一个名为 ZipcodesSession 的远程无状态会话 bean（state\
    \ session bean），它为上述类库添加了远程接口：\n\n```java\npackage zipcodes.beans;\n\nimport javax.ejb.Remote;\n\
    import java.util.List;\n\n@Remote\npublic interface ZipcodesSessionRemote\n{\n\
    \    public boolean create(ZipcodeRemote obj);\n    public boolean update(ZipcodeRemote\
    \ obj);\n    public boolean remove(String code);\n    public List<ZipcodeRemote>\
    \ search(String code, String City);\n}\n```\n\n最大的工作是实现 `ZipcodesSession`。在 `zipcodes.models`\
    \ 包中，我添加了对应数据库表的实体类 `Zipcode`。该类与 NetBeans 生成的代码保持不变。我想添加一个用于数据库操作的类，但无法从 EJB\
    \ 中直接使用 JPA 控制器，因此我添加了自己的类（这只是由 NetBeans 创建的控制器类的修改和精简版本——参见下一个示例），我将其命名为 `ZipcodeDAO`。\n\
    \nJAVA 13: 分布式编程\nJAVA EE: 软件开发\n企业级 Beans\n\n```java\npackage zipcodes.models;\n\
    \nimport java.util.*;\nimport javax.persistence.*;\n\npublic class ZipcodeDAO\
    \ {\n    public EntityManager getEntityManager() {\n        return Persistence.createEntityManagerFactory(\"\
    ZipcodesEJBPU\").createEntityManager();\n    }\n\n    public void create(Zipcode\
    \ zipcode) throws Exception {\n        EntityManager em = null;\n        try {\n\
    \            em = getEntityManager();\n            em.getTransaction().begin();\n\
    \            em.persist(zipcode);\n            em.getTransaction().commit();\n\
    \        } catch (Exception ex) {\n            if (em != null) em.getTransaction().rollback();\n\
    \            throw ex;\n        } finally {\n            if (em != null) em.close();\n\
    \        }\n    }\n```\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_97_0.png)\n\
    \n```java\npublic void edit(Zipcode zipcode) throws Exception\n{\n    EntityManager\
    \ em = null;\n    try {\n        em = getEntityManager();\n        em.getTransaction().begin(zipcode);\n\
    \        em.merge(zipcode);\n        em.getTransaction().commit();\n    } catch\
    \ (Exception ex)\n    {\n        if (em != null) em.getTransaction().rollback();\n\
    \        throw ex;\n    }\n    finally {\n        if (em != null) em.close();\n\
    \    }\n}\n\npublic void destroy(String code) throws Exception\n{\n    EntityManager\
    \ em = null;\n    try {\n        em = getEntityManager();\n        em.getTransaction().begin();\n\
    \        Zipcode zipcode;\n        try {\n            zipcode = em.getReference(Zipcode.class,\
    \ code);\n            zipcode.getCode();\n        } catch (Exception e) {\n  \
    \          throw new Exception(\"邮政编码 \" + code + \" 不再存在\");\n        }\n   \
    \     em.remove(zipcode);\n        em.getTransaction().commit();\n    } catch\
    \ (Exception ex) {\n        if (em != null) em.getTransaction().rollback();\n\
    \        throw ex;\n    } finally {\n        if (em != null) em.close();\n   \
    \ }\n}\n\npublic List<Zipcode> getZipcodes(String code, String city) {\n    if\
    \ (code == null) code = \"\";\n    if (city == null) city = \"\";\n    EntityManager\
    \ em = null;\n    try {\n        em = getEntityManager();\n        Query cq =\
    \ em.createQuery(\"SELECT z FROM Zipcode z WHERE z.code like :code AND z.city\
    \ like :city\");\n        cq.setParameter(\"code\", code + \"%\");\n        cq.setParameter(\"\
    city\", \"%\" + city + \"%\");\n        return cq.getResultList();\n    } catch\
    \ (Exception ex) {\n        throw ex;\n    } finally {\n        if (em != null)\
    \ em.close();\n    }\n}\n```\n\n该类与创建的 DAO（数据访问对象）非常相似，但你应该注意如何使用 `EntityManager`\
    \ 来创建、读取、更新和删除。还要注意搜索方法，那里使用了 JPQL 而不是 Criteria API。\n\nJAVA 13: 分布式编程\nJAVA EE:\
    \ 软件开发\n企业级 Beans\n\n```java\npackage zipcodes.beans;\n\nimport java.util.*;\n\
    import javax.ejb.Stateless;\nimport zipcodes.models.*;\n\n@Stateless\npublic class\
    \ ZipcodesSession implements ZipcodesSessionRemote\n{\n    @Override\n    public\
    \ boolean create(ZipcodeRemote obj)\n    {\n        try {\n            new ZipcodeDAO().create(new\
    \ Zipcode(obj.getCode(), obj.getCity()));\n            return true;\n        }\
    \ catch (Exception ex) {\n            return false;\n        }\n    }\n\n    @Override\n\
    \    public boolean update(ZipcodeRemote obj)\n    {\n        try {\n        \
    \    new ZipcodeDAO().edit(new Zipcode(obj.getCode(), obj.getCity()));\n     \
    \       return true;\n        } catch (Exception ex) {\n            return false;\n\
    \        }\n    }\n\n    @Override\n    public boolean remove(String code)\n \
    \   {\n        try {\n            new ZipcodeDAO().destroy(code);\n          \
    \  return true;\n        } catch (Exception ex) {\n            return false;\n\
    \        }\n    }\n\n    @Override\n    public List<ZipcodeRemote> search(String\
    \ code, String city)\n    {\n        List<Zipcode> zipcodes = new ZipcodeDAO().getZipcodes(code,\
    \ city);\n        List<ZipcodeRemote> list = new ArrayList<>();\n        for (Zipcode\
    \ zipcode : zipcodes) {\n            list.add(new ZipcodeRemote(zipcode.getCode(),\
    \ zipcode.getCity()));\n        }\n        return list;\n    }\n}\n```\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_100_0.png)\n\
    \n注意这些方法包含了 `ZipcodeRemote` 类型对象与 `Zipcode` 实体类型对象之间的转换。这几乎没有必要，可以通过在类库中定义实体类型来解决该问题（参见下一个示例）。\n\
    \n"
