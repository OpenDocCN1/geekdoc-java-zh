    \n![](img/0a9d86aea6b178e4945a7a3e94449cb9_140_0.png)\n\n# EXERCISE 5\n\nIn this\
    \ exercise, you must write a web application where you can search for Danish kings:\n\
    \n![](img/0a9d86aea6b178e4945a7a3e94449cb9_140_1.png)\n\nDownload free eBooks\
    \ at bookboom.com\n\n# JAVA 13: DISTRIBUTED PROGRAMMING AND\nJAVA EE: SOFTWARE\
    \ DEVELOPMENT\n\nYou can call the project DanishKings, and the difference compared\
    \ to before should be that the search time should be done by a web service.\n\n\
    Start by creating a web application that you can call KingsServices and add a\
    \ web service called KingService. Add a simple model class\n\n```java\npackage\
    \ kings.services;\n\npublic class King\n{\n    private String name;\n    private\
    \ int from;\n    private int to;\n```\n\nThe web service in question must have\
    \ two services:\n\n```java\n@TestMethod(operationName = \"getKing\")\npublic List<King>\
    \ getKing(@PathParam(name = \"year\") int year)\n{\n\n@TestMethod(operationName\
    \ = \"getKings\")\npublic List<King> getKings(@PathParam(name = \"yearly\") int\
    \ yearly,\n    @PathParam(name = \"year2\") int year2)\n}\n```\n\nwhere the first\
    \ will return the kings who ruled a certain year, while the other will return\
    \ the kings whose reign overlaps a certain interval. Names of the Danish kings\
    \ and reigns can be stored as constants in the program in the same way as in previous\
    \ examples.\n\n# 5.1 AN EJB AS A WEB SERVICE\n\nAs shown, a web service is not\
    \ much more than a usual Java class decorated with a few annotations and it all\
    \ wrapped up in a web application. It is also possible to use a stateless session\
    \ as a bean either for using a stateless EJB from languages other than Java, as\
    \ well as using other properties of enterprise java beans such as transactions.\
    \ In fact, you can do it in two ways by either creating a web service in an EJB\
