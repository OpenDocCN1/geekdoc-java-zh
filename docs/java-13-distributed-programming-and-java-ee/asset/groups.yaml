    \ 13: DISTRIBUTED PROGRAMMING AND\nJAVA EE: SOFTWARE DEVELOPMENT\nSECURITY\n\n\
    ### SECURITY\n\nWhen developing applications that are used over a network (web\
    \ applications, enterprise applications, etc.), at the same time – very often\
    \ – there is a security issue that needs to be solved. It is a problem that I\
    \ have overlooked in this book and the two previous books. Basically it is about\n\
    \n- that only allowed users may use a program or parts of an application and that\
    \ all users should not have the same rights\n- that unauthorized users may not\
    \ access the data sent over a network between users and servers\n\nThe first issue\
    \ is solved by user identification and passwords, while the other issue is solved\
    \ by using encryption so nobody can read the data over the network. In principle,\
    \ it sounds simple, but there is no matter what the cyber attacks, as ones in\
    \ the press, also testifies. Perhaps it's actually impossible to completely secure\
    \ an enterprise application, but you can do a lot, and more often than it is not.\n\
    \n![img/0a9d86aea6b178e4945a7a3e9444cb9169.png]\n\nBy 2020, wind could provide\
    \ one tenth of our planet's electricity. Already today, SKF's know how is crucial\
