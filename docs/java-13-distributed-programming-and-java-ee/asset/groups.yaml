    List<Integer> pages = em.createQuery(cq).getResultList();

    ```


    To compare with SQL, you can say that with Root you specify the table to which
    you want to perform a SELECT, and in connection with JPA, it means an entity object.
    With the select(method), you specify the columns or properties that will be included
    in the result. Here it is only the property for page numbers, and Book..pages
    the property pages in an entity object Book. Finally, as mentioned above, you
    indicate which entity objects to be included, and here it is only those objects
    in which the property title contains the word Fedora. Note that the result is
    a list of Integer objects, and a CriteriaQuery for Integer objects has been created
    from the start.


    As a further example, a query is shown which determines the largest page number
    in the table book, where you should first notice that a criteria builder supports
    multiple functions (here the max function) and the result is determined by getSingleResult()
    instead of getResult();


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder();

    CriteriaQuery<Integer> cq = cq.createQuery(Integer.class);

    Root<Book> root = cq.from(Book.class);

    cq.select(cb.max(root.get(Book.pages)));

    Integer pages = em.createQuery(cq).getSingleResult();

    ```


    or shorter:


    ```

