    \n    @PUT\n    @Consumes(MediaType.APPLICATION_XML)\n    public void putXml(String\
    \ content) {\n    }\n}\n```\n\n你必须注意不同的注解。在这里，@Path 指定了当前服务（资源）被标识的名称。@GET 定义了当从浏览器发生\
    \ HTTP GET 时执行的方法，同样，@PUT 定义了用于 HTTP PUT 的方法：注意，第一个方法带有 @Produces 装饰，表示该方法返回 XML，而另一个方法带有\
    \ @Consumes 装饰，表示该方法将参数的内容解释为 XML。在这种情况下，最后一个方法是空的，而第一个方法返回了一些 XML。\n\n容器必须知道资源被称为什么，这就是第二个类的目的：\n\
    \n```java\npackage helloapp.services;\n\nimport java.util.Set;\nimport javax.ws.rs.core.Application;\n\
    \n@javax.ws.rs.Path(\"webresources\")\npublic class ApplicationConfig extends\
    \ Application {\n\n    @Override\n    public Set<Class<?>> getClasses() {\n  \
    \      Set<Class<?>> resources = new java.util.HashSet<>();\n        addResourceClasses(resources);\n\
    \        return resources;\n    }\n\n    private void addResourceClasses(Set<Class<?>>\
    \ resources) {\n        resources.add(helloapp.services.HelloResource.class);\n\
    \    }\n}\n```\n\n这是一个继承自 Application 的类，该类被 @Path 装饰，它指定了一个包含在资源 URI 中的名称（这里是\
