- md: "\n## WEB SERVICES\n\nA web service is a component that can be hosted on a web\
    \ server and provides services to clients, and web services can to some extent\
    \ be perceived as an alternative to enterprise java beans. Web services are characterized\
    \ by being easy to develop and platform independent. The latter means communication\
    \ between a web service and clients occurs as XML and after a protocol SOAP, and\
    \ thus exclusively as text. Therefore, the use of web services is perceived as\
    \ a secure technology, and the price is that encoding of messages as XML may cost\
    \ little on performance. A web service and its services must be defined to clients\
    \ with regard to parameters and return values, and it is done using an XML document\
    \ called a Web Service Definition Language (WSDL). The biggest challenge in writing\
    \ web services is to write this document, which is quite complex (difficult and\
    \ comprehensive syntax), and by NetBeans helps as it generates all, and you can\
    \ actually write web services without knowing anything about WSDL.\n\nI want to\
    \ start with a simple web service that has converts:\n\n- double celsiusToFahrenheit(double\
    \ value) which converts from fahrenheit to celsius\n- double fahrenheitToCelsius(double\
    \ value) which converts from celsius to fahrenheit\n\nI start with a web application,\
    \ which I have called ConversionService, and it just has to be an empty web application.\
    \ Then I add a Web Service\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_132_0.png)\n\
    \n## JAVA 13: DISTRIBUTED PROGRAMMING AND JAVA EE: SOFTWARE DEVELOPMENT WEB SERVICES\n\
    \nand in the following window I have to enter a name (here as ConversionService)\
    \ and choose a package:\n\n### New Web Service\n\n| Steps | Name and Location\
    \ |\n|---|---|\n| 1 Choose File Type | Web Service Name: ConversionService |\n\
    | 2 Name and Location | |\n| Project: ConversionService | |\n| Location: Source\
    \ Packages | |\n| Package: conversionservervices | |\n| Create Web Service from\
    \ Scratch | |\n| Create Web Service from Existing Bean | |\n| Enterprise Bean:\
    \ Browse | |\n| Implement Web Service as Stateless Bean | |\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_133_0.png)\n\
    \n## JAVA 13: DISTRIBUTED PROGRAMMING AND JAVA EE: SOFTWARE DEVELOPMENT\n\nWhen\
    \ I click Next, NetBeans creates the following class:\n\n```java\npackage conversionservice.services;\n\
    \nimport javax.jws.WebService;\nimport javax.jws.WebMethod;\nimport javax.jws.WebParam;\n\
    \n@WebService(serviceName = \"ConversionService\")\npublic class ConversionService\
    \ {\n    @WebMethod(operationName = \"hello\")\n    public String hello(@WebParam(name\
    \ = \"name\") String txt) {\n        return \"Hello \" + txt + \"!\";\n    }\n\
    }\n```\n\nNote which annotations are used, and NetBeans creates a single service\
