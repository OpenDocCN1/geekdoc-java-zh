- md: "\n# JAVA 13: DISTRIBUTED PROGRAMMING\nJAVA EE: SOFTWARE DEVELOPMENT\n\nMany\
    \ of the challenges associated with security are not so much because we do not\
    \ know how, but how they make everyday work difficult, and for that reason, many\
    \ may be tempted to relax security policies. Studies actually show that most security\
    \ issues are due to how the programs are used, not how the programs are made.\
    \ In this chapter I will give an introduction to what matters there as part of\
    \ the development work, and mention that it does not help much unless the IT solutions\
    \ also take the security issue seriously.\n\nIn turn, the challenges of encryption\
    \ are the easiest to solve, as it is primarily a question of using a secure transmission\
    \ line where data is sent encrypted, and the problem is solved by properly configuring\
    \ the program. However, the authentication and user authorization issues can be\
    \ solved by two sites, namely by the container (the application server), which\
    \ is a configuration task, and by the program itself, where it is the programmer\
    \ who will solve the task.\n\n## 7.1 THE DEMO APPLICATION\n\nI use a simple web\
    \ application called SecurityApp1. The application consists of only three simple\
    \ HTML pages, where the index.html is the start page and opens the following window:\n\
    \n![](img/0a9d86aea6b178e4945a7a3e94449cb9_170_0.png)\n\nIf you click on the top\
    \ link, you get a window for entering a name (which is not saved):\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_171_0.png)\n\
    \nIf you go back to the start page and click the Administration link, you will\
    \ get the following page where you can edit a time (which will not be saved):\n\
    \n![](img/0a9d86aea6b178e4945a7a3e94449cb9_171_1.png)\n\nThe code is trivial and\
    \ will not be shown here. Below are the project files, and here you should note\
    \ that the page start.html is located in a folder admin, and that in WEB-INF added\
    \ a configuration file glassfish-web.xml (a Glassfish Descriptor file):\n\n##\
    \ SECURITY\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_172_0.png)\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_172_1.png)\n\
    \n## 7.2 CONTAINER MANAGED AUTHENTICATION AND AUTHORIZATION\n\nI will start by\
    \ showing how let the container (the Glassfish server) control users’ access to\
    \ the individual pages. This is done solely by the configuration files, and without\
    \ changing the application’s code, as well as creating Glassfish users.\n\nGlassfish\
    \ manages user and user rights using so-called security realms, which basically\
    \ is a collection of users with associated security groups. Each of these groups\
    \ defines what the container will allow the user to perform. For example, an application\
    \ may have regular users who can only perform specific tasks and administrators\
    \ who can perform all tasks.\n\nGlassfish has three realms from the start, but\
    \ you can create your own. The three predefined realms are:\n\n- 1. **admin-realm**,\
    \ used solely for the maintenance of users for the Glassfish administration web\
    \ application and should not be used for users of other applications\n- 2. **certificate**,\
    \ used for client-side certificate for authentication of users\n- 3. **file**,\
    \ that stores general user information\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_173_0.png)\n\
    \nClicking on **file realm** you will get the properties of this realm and clicking\
    \ the **Manage Users** button will give you an overview of the users. I have created\
    \ three that I will apply in the following:\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_174_0.png)\n\
    \nI will now use these users for authentication of pages to the above application\
    \ when:\n\n- 1. users belonging to the student group alone must have access to\
    \ index.html\n- 2. users belonging to the group staff must have access to index.xhtml\
    \ and enter.html\n- 3. users belonging to the admin group must have access to\
    \ all three pages\n\nI have added the following web.xml:\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n\n<web-app xmlns=\"http://xmlns.jcp.org/xml/ns/javaee\"\
    \n  xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n  xsi:schemaLocation=\"\
    http://xmlns.jcp.org/xml/ns/javaee http://xmlns.jcp.org/xml/ns/javaee/web-app_3_1.xsd\"\
    \n  version=\"3.1\">\n\n  <session-config>\n    <session-timeout>30</session-timeout>\n\
    \  </session-config>\n\n  <security-constraint>\n    <web-resource-collection>\n\
    \      <web-resource-name>Admin Pages</web-resource-name>\n      <url-pattern>/*</url-pattern>\n\
    \    </web-resource-collection>\n    <auth-constraint>\n      <role-name>admin</role-name>\n\
    \    </auth-constraint>\n  </security-constraint>\n\n  <login-config>\n    <auth-method>BASIC</auth-method>\n\
    \    <realm-name>file</realm-name>\n  </login-config>\n\n</web-app>\n```\n"
  mdcn: "\n\n# JAVA 13: 分布式编程\nJAVA EE: 软件开发\n\n许多与安全相关的挑战，并不是因为我们不知道如何做，而是因为这些挑战让日常工作变得困难，正因如此，许多人可能会倾向于放松安全策略。研究实际上表明，大多数安全问题源于程序的使用方式，而不是程序的制作方式。在本章中，我将对开发工作中相关的重点内容进行介绍，并提指出，除非\
    \ IT 解决方案同样重视安全问题，否则这些工作将帮助不很大。\n\n反之，加密的挑战是最容易解决的，因为它主要是一个关于使用安全传输线路以加密形式发送数据的问题，该问题通过正确配置程序即可解决。然而，身份验证和用户授权问题可以通过两个方面来解决：一个是通过容器（应用程序服务器），这是一项配置任务；另一个是通过程序本身，由程序员来解决该任务。\n\
    \n## 7.1 示例应用程序\n\n我使用一个名为 SecurityApp1 的简单 Web应用程序。该应用程序仅三个简单的 HTML 页面组成，其中 `index.html`\
    \ 是首页，并打开以下窗口：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_170_0.png)\n\n如果你点击顶部链接，将得到一个输入名称的窗口（名称不会被保存）：\n\
    \n![](img/0a9d86aea6b178e4945a7a3e94449cb9_171_0.png)\n\n如果你返回首页并点击 Administration（管理）链接，将获得以下页面，你可以在其中编辑时间（时间不会被保存）：\n\
    \n![](img/0a9d86aea6b178e4945a7a3e94449cb9_171_1.png)\n\n代码非常简单，此处不再显示。以下是项目文件，在这里你应该注意页面\
    \ `start.html` 位于 `admin` 文件夹中，并且在 `WEB-INF` 中添加了一个配置文件 `glassfish-web.xml`（一个\
    \ Glassfish 描述符文件）：\n\n## 安全\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_172_0.png)\n\
    \n![](img/0a9d86aea6b178e4945a7a3e94449cb9_172_1.png)\n\n## 7.2 容器托管身份验证与授权\n\n\
    我将首先演示如何让容器（Glassfish 服务器）控制用户对各个页面的访问。这完全通过配置文件实现，无需更改应用程序代码，只需创建 Glassfish 用户即可。\n\
    \nGlassfish 使用所谓的“安全域”（security realms）来管理用户及其权限，这基本上是一组带有关联安全组的用户集合。每个组都定义了容器允许用户执行的操作。例如，一个应用程序可能有只能执行特定任务的普通用户，以及可以执行所有任务的管理员。\n\
    \nGlassfish 初始就有三个域，但你可以创建自己的。这三个预定义的域是：\n\n- 1. **admin-realm**，专门用于 Glassfish\
    \ 管理 Web 应用程序的用户维护，不应用于其他应用程序的用户。\n- 2. **certificate**，用于通过客户端证书用户身份验证。\n- 3.\
    \ **file**，存储普通用户信息。\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_173_0.png)\n\n\
    点击 **file realm** 将获得该域的属性，点击 **Manage Users**（管理用户）按钮将提供用户概览。我创建了三个用户，将在后续中使用：\n\
    \n![](img/0a9d86aea6b178e4945a7a3e94449cb9_174_0.png)\n\n现在我在使用这些用户对上述应用程序页面进行身份验证，如下：\n\
    \n- 1. 属于 student 组的用户只能访问 `index.html`。\n- 2. 属于 staff 组的用户访问 `index.xhtml` 和\
    \ `enter.html`。\n- 3. 属于 admin 组的用户访问所有三个页面。\n\n我添加了以下 `web.xml`：\n\n```xml\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\n<web-app xmlns=\"http://xmlns.jcp.org/xml/ns/javaee\"\
    \n  xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n  xsi:schemaLocation=\"\
    http://xmlns.jcp.org/xml/ns/javaee http://xmlns.jcp.org/xml/ns/javaee/web-app_3_1.xsd\"\
    \n  version=\"3.1\">\n\n  <session-config>\n    <session-timeout>30</session-timeout>\n\
    \  </session-config>\n\n  <security-constraint>\n    <web-resource-collection>\n\
    \      <web-resource-name>Admin Pages</web-resource-name>\n      <url-pattern>/*</url-pattern>\n\
    \    </web-resource-collection>\n    <auth-constraint>\n      <role-name>admin</role-name>\n\
    \    </auth-constraint>\n  </security-constraint>\n\n  <login-config>\n    <auth-method>BASIC</auth-method>\n\
    \    <realm-name>file</realm-name>\n  </login-config>\n\n</web-app>\n```\n\n"
