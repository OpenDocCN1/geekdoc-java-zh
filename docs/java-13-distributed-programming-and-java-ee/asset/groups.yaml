- md: "\n# JAVA 13: DISTRIBUTED PROGRAMMING AND JAVA EE: SOFTWARE DEVELOPMENT\n\n\
    Then you can use the object's methods. When the bean has to be removed, the container\
    \ will first perform a method decorated with @PreDestroy, after which it is the\
    \ container that removes the object. It can be illustrated by the following figure:\n\
    \n![](img/0a9d86aea6b178e4945a7a3e94449cb9_116_0.png)\n\nCDI objects have a scope\
    \ that is called context, and it can basically be:\n\n- request\n- session\n-\
    \ application\n- conversation\n\nAs an example, below is shown a simple managed\
    \ bean:\n\n```java\npackage cdiprogram.beans;\n\nimport javax.inject.Named;\n\
    import javax.enterprise.context.SessionScoped;\nimport java.io.Serializable;\n\
    @Named(value = \"person\")\n@SessionScoped\npublic class Person implements Serializable\n\
    {\n    private String firstName;\n    private String lastName;\n\n    public Person()\n\
    {\n}\n\n    public String getFirstName()\n{\n    return firstName;\n}\n\n    public\
    \ void setFirstName(String firstName)\n{\n  this.firstName = firstName;\n}\n\n\
    \    public String getLastName()\n{\n  return lastName;\n}\n\n    public void\
    \ setLastName(String lastName)\n{\n  this.lastName = lastName;\n}\n}\n```\n\n\
    That's a managed bean you can see from @Named, where you can see that NetBeans\
    \ has assigned the name for the class written with lower case. An annotation is\
    \ generally an interface, and in this case it is an interface with a single attribute\
    \ value (whose default value is blank, meaning that the container selects the\
    \ class name person). In addition, you can see that an object's context is session,\
    \ and SessionScoped is an interface. The two interfaces Named and SessionScoped\
    \ provide that information to the container, which tells how the container should\
    \ maintain objects of the class Person.\n\nWith the above bean version you will\
    \ be able to write the following JSF page:\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\" ?>\n<!DOCTYPE html PUBLIC \"//W3C//DTD HTML 1.0 Transitional//EN\" >\n\
    <html xmlns=\"http://www.w3.org/1999/xhtml\"\nxmlns:h=\"http://xmlns.jcp.org/jsf/html\"\
    >\n<head>\n<title>Facelet Title</title>\n</head>\n<body>\n<h:form>\n<h:panelGrid\
    \ columns=\"2\">\n<h:outputLabel for=\"firstName\" value=\"First Name\"/>\n<h:inputText\
    \ id=\"firstName\" value=\"#{person.firstName}\"/>\n<h:outputLabel for=\"lastName\"\
    \ value=\"Last Name\"/>\n<h:inputText id=\"lastName\" value=\"#{person.lastName}\"\
    />\n<h:commandButton value=\"OK\" />\n</h:panelGrid>\n</h:form>\n</body>\n</html>\n\
    ```\n\n# JAVA 13: DISTRIBUTED PROGRAMMING JAVA EE: SOFTWARE DEVELOPMENT\n\nThe\
    \ interesting thing is to open the page, the Glassfish server will inject a Person\
    \ object with context session, without the programmer being – or – doing something\
    \ to create the object.\n\nIn the previous examples I have opted to have a named\
    \ bean from another bean, which has been done by many statements of the form:\n\
    \n```java\nELContext elc = FacesContext.getCurrentInstance().getELContext();\n\
    SomeBean someBean = (SomeBean) FacesContext.\ngetCurrentInstance().getApplication().getELResolver().getValue(elc,\
    \ null, \"person\");\n```\n\nThere's nothing wrong with it, but it is hard to\
    \ write and impossible to remember. One can, however, facilitate the syntax by\
    \ the use of CDI. Consider the following named bean, which represents a student\
    \ with a name and a subject:\n\n```java\npackage cdiprogram.beans;\n\nimport javax.inject.Named;\n\
    import javax.inject.Inject;\nimport javax.enterprise.context.SessionScoped;\n\
    import java.io.Serializable;\n```\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_118_0.png)\n\
    \n```java\n@Named(value = \"student\")\n@SessionScoped\npublic class Student implements\
    \ Serializable {\n    @Inject\n    private Person person;\n    private String\
    \ subject;\n\n    public Student() {\n    }\n\n    public Person getPerson() {\n\
    \        return person;\n    }\n\n    public void setPerson(Person person) {\n\
    \        this.person = person;\n    }\n\n    public String getSubject() {\n  \
    \      return subject;\n    }\n\n    public void setSubject(String subject) {\n\
    \        this.subject = subject;\n    }\n}\n```\n\nThe name is represented by\
    \ a person variable of the type Person. However, you must note that there is nowhere\
    \ we created an object of the type Person (the property seems not to be initialized),\
    \ but instead, a person is decorated with @Inject. It stated that a Student, which\
    \ is a managed bean, is dependent on Person (another managed bean), and when the\
    \ container creates a Student object with the help of injection, it will also\
    \ look for whether a Person object has to be created and if so, do it. Below is\
    \ shown how to write a JSF page that has Student as a backing bean:\n\n```xml\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
    \ HTML 1.0 Transitional//EN\" >\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\n\
    xmlns:h=\"http://xmlns.jcp.org/jsf/html\">\n<head>\n```\n\n```xml\n<title>Facelet\
    \ Title</title>\n</head>\n<body>\n<h:form>\n<h:panelGrid columns=\"2\">\n<h:outputLabel\
    \ for=\"firstName\" value=\"First Name\"/>\n<h:inputText id=\"firstName\" value=\"\
    #{person.firstName}\"/>\n<h:outputLabel for=\"lastName\" value=\"Last Name\"/>\n\
    <h:inputText id=\"lastName\" value=\"#{person.lastName}\"/>\n<h:inputText id=\"\
    subject\" value=\"Subject\"/>\n<h:commandButton value=\"OK\" />\n</h:panelGrid>\n\
    </h:form>\n</body>\n</html>\n```\n\n# 4.1 QUALIFIERS\n\nIf you consider the bean\
    \ Student, it has a dependence on the bean Person. I will now define a derivative\
    \ class, which I called Man, but first I will make the class abstract and add\
    \ an abstract method that will return person's gender:\n\n```java\n@Named(value\
    \ = \"person\")\n@SessionScoped\npublic abstract class Person implements Serializable\n\
    {\n    public abstract String getGender();\n}\n```\n\nI can then write the following\
    \ bean:\n\n```java\npackage cdiprogram.beans;\n\nimport javax.inject.Named;\n\
    import javax.enterprise.context.SessionScoped;\nimport java.io.Serializable;\n\
    \n@Named(value = \"man\")\n@SessionScoped\npublic class Man extends Person implements\
    \ Serializable\n{\n    public Man() {\n    }\n\n    public String getGender()\
    \ {\n        return \"man\";\n    }\n}\n```\n\nIf you disregard the @Male annotation,\
    \ there is nothing new in this class. It’s a managed bean that inherits a managed\
    \ bean, and bean is just a class. If you see the Student class from the container,\
