- md: "\n# JAVA 13: DISTRIBUTED PROGRAMMING\nJAVA EE: SOFTWARE DEVELOPMENT\nJAVA PERSISTENCE\
    \ API\n\nThe other pages consist of a JSP page and a named bean. When studying\
    \ the code, special attention to how individual beans implement the action elements\
    \ for commands in the JSP pages and how these methods use the database controller\
    \ classes. Since the book and its bean are not quite simple because it must be\
    \ possible to maintain the many-to-many relationship between the book and the\
    \ author tables. In particular, you should be aware that the BookJpaController\
    \ class takes care of everything needed to update the database, maintaining the\
    \ relationships, both in connection with INSERT, UPDATE and DELETE. It is actually\
    \ here that you meet the very great benefits of JPA, as otherwise as it appears\
    \ from examples in previous books it is necessary to write a lot of code. In addition,\
    \ it should be added that the JPA is even extremely effective.\n\n# PROBLEM 1\n\
    \nThe database padata has three tables:\n\n- 1. world, which contains the names\
    \ of the continents of this world\n- 2. currency, which contains a currency table\n\
    - 3. country, which contains information about countries\n\n(see possible problem\
    \ 1 in the book Java 6). As documentation, the databases are created using the\
    \ following script:\n\n```sql\ncreate table currency\n{\n  code char(3) not null\
    \ primary key,\n  name varchar(30) not null,\n  rate decimal(10, 4)\n}\n```\n\n\
    ```sql\ncreate table world\n{\n  code char(2) not null primary key,\n  name varchar(15)\
    \ not null\n}\n```\n\n```sql\ncreate table country\n{\n  code2 char(2) not null\
    \ primary key, # country code on 2 characters\n  code3 varchar(3), # country code\
    \ on 3 characters\n  name varchar(50) not null, # country name\n  area int, #\
    \ country's area in square kilometer\n  number int, # country's number of inhabitant\n\
    \  continent char(2), # the continent this belongs\n  currency char(3), # currency\
    \ code\n  foreign key (continent) references world(code),\n  foreign key (currency)\
    \ references currency(code);\n}\n```\n\n```sql\ninsert into world values('AS',\
    \ 'Asia');\ninsert into world values('AF', 'Africa');\ninsert into world values('NA',\
    \ 'North America');\ninsert into world values('SA', 'South America');\ninsert\
    \ into world values('AN', 'Antarctica');\ninsert into world values('EU', 'Europe');\n\
    insert into world values('OC', 'Oceania');\n```\n\nThe task is to write a web\
    \ application that can maintain these tables when the database operations are\
    \ to be performed using JPA.\n\nThe application must have three pages. The start\
    \ page should be the following with only a few countries shown:\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_49_0.png)\n\
    \n![](img/0a9d86aea6b178e4945a7a3e94449cb9_50_0.png)\n\nIf there is a link to\
    \ a page that is used to create a country – the same page is used to edit information\
    \ about a country if you click on the country in the code in the link. The **Currency**\
    \ is used to maintain the currency table. Finally, there is a dropdown box where\
    \ you can select a continent, and then clicking on the **Update** link is updated\
    \ so that it only shows countries for the selected continent.\n\nThe page for\
    \ maintenance information about countries is the following where the code for\
    \ *Andora* is clicked:\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_50_1.png)\n\
    \nFinally, the page for the maintenance of the currency table is shown below (where\
    \ only a few currencies are shown):\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_51_0.png)\n\
    \nand the page should be self explanatory.\n\n## ENTERPRISE JAVA BEANS\n\nEnterprise\
    \ Java Beans or EJB's are components that live on a server and enclose business\
    \ logic, and here they can be used by other applications such as web applications\
    \ and standalone applications. You could think of an EJB as a component that is\
    \ developed, tested and hosted on an application server (such as Glassfish), and\
    \ as other applications may apply. It is not quite simple to develop EJB's and\
    \ get them hosted on an application server, and the architecture is also not easy\
    \ to review, but NetBeans helps as it has projects specifically aimed at developing\
    \ EJB's. In this chapter, I will partly demonstrate how to develop and use EJBs\
    \ using NetBeans and explain the most important concepts.\n\nThe advantage of\
    \ EJB's is, in addition to providing the same services to multiple applications,\
    \ the application server addresses a variety of conditions such as transactions\
    \ and security issues, and EJB's simplify development.\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_52_0.png)\n\
    \nEJB's play an important role in modern applications, as shown in the following.\
    \ (Wait, EJB's play an important role in modern applications).\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_53_0.png)\n\
    \nThere are three variants:\n\n- Stateless, where the state is not preserved between\
    \ calls.\n- Stateful, where the state is maintained throughout the life of the\
    \ component.\n- Singleton, which exists exactly one instance.\n\nEJB's simplify\
    \ development. In the following, I will start with a new project by selecting\
    \ Java EE and Enterprise Application:\n\nAfter clicking Next, I get the following\
    \ window, where I enter the project name (CalCEJB). After clicking Next, I get\
    \ the following window, which by default consists of an EJB module and a Web Application:\n\
    \n![](img/0a9d86aea6b178e4945a7a3e94449cb9_54_0.png)\n\nWhen you click Finish,\
    \ NetBeans creates an Enterprise Application, which has two projects: the first\
    \ one is an EJB Module named CalCEJB-ejb, while the other is a Web Application\
    \ called CalCEJB-war.\n\nNote that NetBeans has chosen the names and they can\
    \ be changed if desired. To do this, right-click on the project and select Enterprise\
    \ Beans and then Session Bean:\n\nWhen you click Next you get the following window,\
    \ where you must enter a name for your EJB (here CalcSession) and a name on a\
    \ package (here calcejb.ejjs):\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_55_0.png)\n\
    \n![](img/0a9d86aea6b178e4945a7a3e94449cb9_55_1.png)\n\nIn addition, choose a\
    \ Session Type where Stateless has been selected. Finally, Local has been ticked.\
    \ This means that an interface that defines the EJB is created. When here selected\
    \ Local, it means that it is an EJB that can be used by web applications hosted\
    \ on the same server (what will be the case in practice) and, precisely, it means\
    \ an application performed by the same JVM as the EJB module. After clicking Finish,\
    \ NetBeans creates a class and interface:\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_56_0.png)\n\
    \n![](img/0a9d86aea6b178e4945a7a3e94449cb9_56_1.png)\n"
  mdcn: "\n\n# JAVA 13：分布式编程\nJAVA EE：软件开发\nJAVA 持久化 API (JPA)\n\n其他页面包含一个 JSP 页面和一个命名\
    \ bean。在学习代码时，请特别注意各个 bean 如何实现 JSP 页面中命令的动作元素，以及这些方法如何使用数据库控制器类。由于这本书及其 bean\
    \ 并不简单，因为必须维护书籍（book）表与作者（author）表之间的多对多关系。特别，你应该意识到 `BookJpaController` 类处理了更新数据库所需的所有内容，包括涉及\
    \ `INSERT`、`UPDATE` 和 `DELETE` 的关系维护。实际上，正在这里你发现了 JPA 的巨大益处，否则如之前书籍中的示例所示，需要编写大量的代码。此外，应该补充的是，JPA\
    \ 甚至是极其高效的。\n\n# 问题 1\n\n数据库 `padata` 包含三个表：\n\n- 1. world，包含该世界各个洲的名称\n- 2. currency，包含一个货币表\n\
    - 3. country，包含有关国家的信息\n\n（参见《Java 6》书中的可能问题 1）。作为文档，数据库使用以下脚本创建：\n\n```sql\n\
    create table currency\n{\n  code char(3) not null primary key,\n  name varchar(30)\
    \ not null,\n  rate decimal(10, 4)\n}\n```\n\n```sql\ncreate table world\n{\n\
    \  code char(2) not null primary key,\n  name varchar(15) not null\n}\n```\n\n\
    ```sql\ncreate table country\n{\n  code2 char(2) not null primary key, # 2位国家代码\n\
    \  code3 varchar(3), # 3位国家代码\n  name varchar(50) not null, # 国家名称\n  area int,\
    \ # 国家的平方公里面积\n  number int, # 国家的人口\n  continent char(2), # 所属大洲\n  currency\
    \ char(3), # 货币代码\n  foreign key (continent) references world(code),\n  foreign\
    \ key (currency) references currency(code);\n}\n```\n\n```sql\ninsert into world\
    \ values('AS', 'Asia');\ninsert into world values('AF', 'Africa');\ninsert into\
    \ world values('NA', 'North America');\ninsert into world values('SA', 'South\
    \ America');\ninsert into world values('AN', 'Antarctica');\ninsert into world\
    \ values('EU', 'Europe');\ninsert into world values('OC', 'Oceania');\n```\n\n\
    任务是编写一个 Web 应用程序，在使用 JPA 执行数据库操作时能够维护这些表。\n\n应用程序必须有三个页面。起始页应如下所示，仅显示少数国家：\n\n\
    ![](img/0a9d86aea6b178e4945a7a3e94449cb9_49_0.png)\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_50_0.png)\n\
    \n如果有指向用于创建国家的页面链接——如果你点击链接中代码里的国家，则将使用同一个页面来编辑国家信息。**货币**（Currency）用于维护货币表。最后，有一个下拉框可以在其中选择一个大洲，然后点击**更新**（Update）链接，即可只显示所选大洲的国家。\n\
    \n维护国家信息的页面如下，其中点击了 *Andora* 的代码：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_50_1.png)\n\
    \n最后，下方显示了货币表的维护页面（仅显示了少数货币）：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_51_0.png)\n\
    \n并且该页面应该是自足其明的。\n\n## 企业级 JAVA BEANS\n\n企业级 Java Beans 或 EJB 是运行在服务器上并封装了业务逻辑的组件，在这里它们可以被\
    \ Web 应用程序和独立应用程序等应用使用。你可以将 EJB 视为一个在应用程序服务器（如 Glassfish）上开发、测试和托管的组件，正如其他应用程序可以调用它一样。开发\
    \ EJB 并将其托管在应用程序服务器上并不简单，其架构也不易于审查，但 NetBeans 提供了帮助，因为它有专门用于开发 EJB 的项目。在本章中，我将部分演示如何使用\
    \ NetBeans 开发和使用 EJB，并解释最重要的概念。\n\nEJB 的优势在于，除了为多个应用程序提供相同的服务外，应用程序服务器还处理诸如事务和安全问题等各种情况，而\
    \ EJB 简化了开发。\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_52_0.png)\n\n如下所示，EJB\
    \ 在现代应用中起着重要作用（等等，EJB 在现代应用中起着重要作用）。\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_53_0.png)\n\
    \n有三种变体：\n\n- 无状态（Stateless）：调用之间不保留状态。\n- 有状态（Stateful）：在组件的生命周期内维护状态。\n- 单例（Singleton）：仅存在实例。\n\
    \nEJB 简化了开发。在接下来，我将通过选择 Java EE 和 Enterprise Application 开始创建一个新项目：\n\n点击 Next\
    \ 后，出现以下窗口，输入项目名称（CalCEJB）。点击 Next 后，出现以下窗口，默认由一个 EJB 模块和一个 Web 应用程序组成：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_54_0.png)\n\
    \n点击 Finish 后，NetBeans 会创建一个企业应用程序，它包含两个项目：第一个名为 CalCEJB-ejb 的 EJB 模块，另一个名为 CalCEJB-war\
    \ 的 Web 。\n\n注意 NetBeans 选择了名称，根据需要可以修改。要这样做，右键点击项目并选择 Enterprise Beans 然后选择 Session\
    \ Bean：\n\n点击 Next 后出现以下窗口，你必须为你的 EJB 命名（此处为 CalcSession）并命名包（此处为 calcejb.ejjs）：\n\
    \n![](img/0a9d86aea6b178e4945a7a3e94449cb9_55_0.png)\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_55_1.png)\n\
    \n此外，选择 Session 类型，此处选择了 Stateless。最后，勾选了 Local。这意味着创建一个定义 EJB 的接口。当此处选择 Local\
    \ 时，意味着它是一个被托管在同一服务器上的 Web 应用程序（在实践中将是这样）使用的 EJB，准确地说，意味着由与 EJB 模块相同的同一个 JVM 执行的应用程序。点击\
    \ Finish 后，NetBeans 会创建一个类和一个接口：\n\n"
