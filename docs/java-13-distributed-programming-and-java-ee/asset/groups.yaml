    以及从数据库中提取行的列和条件。例如，我们可以通过形如下所示的语句从 `EntityManager` 获取 `CriteriaBuilder`：


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder();

    ```


    其中 em 是一个 `EntityManager`。构建器有三个返回准则查询的方法：


    - CriteriaQuery<T> createQuery(Class<T>)

    - CriteriaQuery<Tuple> createTupleQuery()

    - CriteriaQuery<Object> createQuery()


    它们的区别在于查询返回的对象类型。在获取查询后，任务是初始化此查询，而这正是 API 介入路径的地方。


    我想从上述方法中的第一个开始，该方法通过参数类型创建一个查询，该类型标识了查询结果预期的对象类型，原则上它可以是任何任意的对象类型。例如，下面是一个准则查询，用于确定图库中所有页码值为
    520 的书：


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder();

    CriteriaQuery<Book> cq = cb.createQuery(Book.class);

    Root<Book> root = cq.from(Book.class);

    cq.select(root);

    cq.where(cb.equal(root.get("Book_pages"), 520));

    return em.createQuery(cq).getResultList();

    ```


    注意如何创建 `CriteriaBuilder`（em 是一个 `EntityManager`）以及如何使用它为 `Book` 对象创建准则查询。对于每个部分，都为图对象创建一个根（root），并定义了查询必须从该根提取对象。root
    对应 SQL 语句中的 `FROM` 部分。接下来，由具有 `Book` 对象的根定义。`select(t)` 属性是结果的一部分，定义了要包含的列。最后，定义必须提取页数为
    520 的对象，这对应于 `WHERE` 部分。结果是这些对象的集合。你应该特别注意如何引用列 `pages`（`Book` 类中的属性 `pages`）。查询也可以写如下所示：


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder();

    CriteriaQuery<Book> cq = cb.createQuery(Book.class);

    Root<Book> root = cq.from(Book.class);

    return em.createQuery(cq);

    cq.select(root).where(cb.equal(root.get("pages"), 520))).getResultList();

    ```


    # JAVA 13：分布式编程与

    JAVA EE：软件开发


    除了稍微短一点外，没有特殊优势，因此它看起来更像一个 SQL SELECT 语句。然而，你必须注意我用另一种方式定义了列（pages），即作为一个字符串，这应该是
    `Book` 类中该属性的名称。


    如果你查看代码，可以发现准则查询对象具有以下方法：


    - from()

    - select()

    - where()


    其含义从 `SELECT` 语句中是已知的，如果你检查 `CriteriaQuery` 类型，你会发现还有用于 `SELECT` 其他部分的方法，如 `ORDER
    BY`、`GROUP BY` 等。最后，你可以注意到 `CriteriaBuilder` 类除了创建 `CriteriaQuery` 对象外，还有定义条件的方法——谓词（predicates）以及许多其他（在相同的
    `equals` 中），下面说明了其中几个。


    作为另一个示例，下面的查询确定了所有标题包含 "Fedora" 文本的书的页码：


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder();

    CriteriaQuery<Integer> cq = cq.createQuery(Integer.class);

    Root<Book> root = cq.from(Book.class);

    q.select(root.get(Book.pages));

    q.where(cb.like(root.get(Book.title), "%Fedora%%"));

    List<Integer> pages = em.createQuery(cq).getResultList();

    ```


    与 SQL 相比，你可以说通过 `Root` 指定了想要执行 `SELECT` 的表，在 JPA 连接中，这意味着一个实体对象。通过 `select(method)`，你指定了将包含在结果中的列或属性。这里只有页码的属性，`Book..pages`
    是实体对象 `Book` 中的属性 `pages`。最后，如上面所述，指定了要包含哪些实体对象，这里只有属性 `title` 包含单词 "Fedora"的对象。注意结果是
    `Integer` 对象的列表，从开始就创建了一个针对 `Integer` 对象的 `CriteriaQuery`。


    作为一个进一步的示例，显示了一个确定 `book` 表中最大页码的查询，你应该首先注意到准则构建器支持多个函数（这里是 `max` 函数），并且结果由 `getSingleResult()`
    而不是 `getResult()` 决定：


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder();

    CriteriaQuery<Integer> cq = cq.createQuery(Integer.class);

    Root<Book> root = cq.from(Book.class);

    cq.select(cb.max(root.get(Book.pages)));

    Integer pages = em.createQuery(cq).getSingleResult();

    ```


    或者更短的：


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder();

    CriteriaQuery<Integer> cq = cq.createQuery(Integer.class);

    Root<Book> root = cq.from(Book.class);

    Integer pages = em.createQuery(

    cq.select(cb.max(root.get(Book.pages))).from(Book.class);

    ```


    我将展示一些示例如何确定大于 500 的特定属性值：


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder();

    CriteriaQuery<Object> cq = cq.createQuery(Object.class);

    Root<Book> root = cq.from(Book.class);

    cq.select(cb.max(root.get(Book.pages))).from(Book.class)

    .where(cb.equal(root.get("pages"), 500));

    ```


