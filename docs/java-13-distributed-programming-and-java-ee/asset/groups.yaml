    columns, and conditions for which rows to extract from the database. For example,
    we can get a CriteriaBuilder from an EntityManager by a statement of the form:


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder();

    ```


    where em is an EntityManager. A builder has three methods that return a criteria
    query:


    - CriteriaQuery<T> createQuery(Class<T>)

    - CriteriaQuery<Tuple> createTupleQuery()

    - CriteriaQuery<Object> createQuery()


    and the difference is what kind of objects the query returns. After having a query,
    the task is to initialize this query, and this is where the API comes in on the
    path.


    I want to start with the first of the above methods that creates a query with
    the parameter type identifies the expected type of objects that are the result
    of the query, and in principle it can be any arbitrary object type. As an example,
    below is a criteria query that determines all books in the library, where pages
    have the value 520:


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder();

    CriteriaQuery<Book> cq = cb.createQuery(Book.class);

    Root<Book> root = cq.from(Book.class);

    cq.select(root);

    cq.where(cb.equal(root.get("Book_pages"), 520));

    return em.createQuery(cq).getResultList();

    ```


    Note how to create a CriteriaBuilder (em is an EntityManager) and how it is used
    to create a criteria query for Book objects. For each, a root is created for the
    graph object, and it defines that the query must extract objects from this root.
    root corresponds to the FROM section in a SQL statement. Next, it is defined by
    the root which has Book objects. The select(t) property is part of the result,
    and it defines columns to be included. Finally, it is defined that objects must
    be extracted where the page number is 520, and this corresponds to the WHERE section.
    The result is a collection of these objects. You should especially note how to
    refer to the column pages (the property pages in Book). The query can also be
    written as follows:


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder();

    CriteriaQuery<Book> cq = cb.createQuery(Book.class);

    Root<Book> root = cq.from(Book.class);

    return em.createQuery(cq);

    cq.select(root).where(cb.equal(root.get("pages"), 520))).getResultList();

    ```


    # JAVA 13: DISTRIBUTED PROGRAMMING AND

    JAVA EE: SOFTWARE DEVELOPMENT


    It has no special advantages besides a bit shorter, and so it may look more like
    a SQL SELECT statement. However, you must note that I have defined the column
    (pages) in another way, as a string, which should be the name of that property
    in the Book class.


    If you look at the code, you can notice that a criteria query object has the following
    methods:


    - from()

    - select()

    - where()


    where the meaning is known from a SELECT statement, and if you examine the type
    CriteriaQuery, you will see that there are methods for the other parts of a SELECT
    as ORDER BY, GROUP BY, and more. Finally, you can note that the CriteriaBuilder
    class, in addition to creating CriteriaQuery objects, methods that define conditions
    – predicates and many others (in the same equals), a few are illustrated below.


    As another example, the query below determines the page number of all books, where
    the title contains the text Fedora:


