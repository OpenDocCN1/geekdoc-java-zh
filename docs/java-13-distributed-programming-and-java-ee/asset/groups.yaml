    # 算法设计


    我想从用于实现数学函数的算法开始。其中许多是简单的，另一些是标准的，而对于其他一些，你可以在互联网上找到很好的解决方案。算术运算本身是使用 `java.math.BigDecimal`
    类实现的。找到分析中提到的函数的算法并不困难，但如果目标是产生有效的算法，由于许多后续公式在渐近线处会失效。因此，可能需要对渐近值实现特殊的解决方案。


    public BigDecimal sq(BigDecimal x)


    sq: $\mathbb{R} \to \mathbb{R}$


    该函数定义在整个实轴上，在非负半轴上是双射。该算法是显而易见的，因为它只是简单的乘法。


