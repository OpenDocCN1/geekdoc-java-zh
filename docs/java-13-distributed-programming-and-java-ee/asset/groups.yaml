    \n```xml\n<url-pattern>index.html</url-pattern>\n<web-resource-constraint>\n \
    \ <auth>\n    <role>student</role>\n  </auth>\n  <user-data-constraint>\n    <transport-guarantee>CONFIDENTIAL</transport-guarantee>\n\
    \  </user-data-constraint>\n</security-data-constraint>\n<login-config>\n  <auth-method>BASIC</auth-method>\n\
    \  <realm-name>file</realm-name>\n</login-config>\n</web-app>\n```\n\n通常情况下，安全的\
    \ Internet 连接需要一个从证书颁发机构（CA，如 Verisign 或 Thawte）购买的证书。这种证书需要花费费用（约 500 美元）并且每年需要更新。对于开发目的来说，这可能不太幸运，因此\
    \ Firefox 使用自签名证书并预配置为支持端口 8181 的 HTTPS。这种自签名证书任何人都可以创建，因此并不可靠。如果在修改 `web.xml`\
    \ 之后打开应用程序，你将看到以下窗口（Firefox）：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_179_0.png)\n\
    \n如果你点击“高级”，将看到以下选项（这是一个警告）：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_179_1.png)\n\
    \n如果你点击该按钮，将收到另一个警告：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_180_0.png)\n\n\
    点击最后一个按钮意味着你已经接受了该不安全的证书，随后会出现常规登录窗口。如果你关闭浏览器并重新打开程序，将不会再次收到上述警告，登录窗口将立即打开。\n\n\
    你应该注意的是，如果你通过输入地址常规方式打开程序：\n\n```\nhttp://localhost:8080/SecurityApp/\n```\n\n\
    它会显示如下所示的登录窗口。这意味着地址被自动重定向到了 HTTPS 协议和端口 8181：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_180_1.png)\n\
    \n## 7.3 表单认证\n\n在上面的示例中，是由浏览器显示了登录窗口，这在原则上是非常棒的，但你也可以编写自己的登录表单。这样做可能至少有两个原因，包括你可以决定表单的外观，但它还允许你实现注销功能。在接下来的示例中，我将展示如何实现，但首先我会修改程序本身。\n\
    \n在介绍示例中，项目包含三个 HTML 页面，但在实践中，它们通常是带有备份豆（backing beans）的 JSF 页面，这需要一些更改。与之前的项目相比，SecurityApp\
    \ 项目增加了两个新的 JSF 页面，此外原始的三个页面也被更改为 JSF 页面：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_181_0.png)\n\
    \n## 安全\n\n三个原始页面 index.xhtml、enter.xhtml 和 start.xhtml 一个备份豆。还添加了一个名为 LogoutBean\
    \ 的托管豆（managed bean）。前三个页面的设计发生了一些变化，但原则上其工作方式相同。error.xhtml 页面非常简单，由一些文本和一个指向\
    \ login.xhtml 的链接组成，当使用未找到的用户或输入了非法密码时会显示该页面。该示例中最重要的页面是 login.xhtml。\n\n```xml\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \ xmlns:h=\"http://xmlns.java.org/jsf/html\">\n<head>\n<title>登录</title>\n</head>\n\
    <body>\n<h2>登录</h2>\n<form method=\"POST\" action=\"security_check\">\n<table\
    \ cellpadding=\"0\" border=\"0\">\n<tr>\n<td>用户名：</td>\n<td><input type=\"text\"\
    \ name=\"username\"/></td>\n</tr>\n<tr>\n<td>密码：</td>\n<td><input type=\"password\"\
    \ name=\"password\"/></td>\n</tr>\n<tr>\n<td></td>\n<td><input type=\"submit\"\
    \ value=\"登录\"/></td>\n</tr>\n</table>\n</form>\n</body>\n</html>\n```\n\n"
