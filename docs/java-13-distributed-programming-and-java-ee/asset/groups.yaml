    \ fiboejb.ejbs;\n\nimport javax.ejb.Local;\n\n@Local\npublic interface FiboSessionLocal\n\
    {\n    int getIndex();\n    void setIndex(int index) throws Exception;\n    Object\
    \ getValue();\n    void next();\n    void prev() throws Exception;\n}\n```\n\n\
    The meaning of the individual methods should be explained in the explanation of\
    \ the above browser window, you should note that two of the methods can raise\
    \ an exception and the method getValue() returns an Object – the method returns\
    \ the fibonacci number.\n\nThe implementation is the following, where the code\
    \ is written manually:\n\n```java\npackage fiboejb.ejbs;\n\nimport javax.ejb.Stateful;\n\
    import java.math.BigInteger;\n\n@Stateful\npublic class FiboSession implements\
    \ FiboSessionLocal\n{\n    private int index = 0;\n    private BigInteger value1\
    \ = BigInteger.ZERO;\n    private BigInteger value2 = BigInteger.ZERO;\n\n   \
    \ @Override\n    public int getIndex()\n    {\n        return index;\n    }\n\n\
    \    @Override\n    public void setIndex(int index) throws Exception\n    {\n\
    \        if (index < 0) throw new Exception(\"Index must be none negative\");\n\
    \        while (this.index > index) prev();\n        while (this.index < index)\
    \ next();\n    }\n\n    @Override\n    public Object getValue()\n    {\n     \
    \ return value2;\n    }\n\n    @Override\n    public void next()\n    {\n    \
    \  if (index == 0) {\n        value1 = BigInteger.ZERO;\n        value2 = BigInteger.ONE;\n\
    \        index = 1;\n      } else {\n        BigInteger value3 = value1.add(value2);\n\
    \        value1 = value2;\n        value2 = value3;\n      }\n      ++index;\n\
    \    }\n\n    @Override\n    public void prev() throws Exception\n    {\n    \
