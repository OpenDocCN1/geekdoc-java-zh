    Entering: \" + interceptedObject.getClass().getName() + \" .\" + interceptedMethod.getName()\
    \ + \"()\");\n        Object obj = invocationContext.proceed();\n        System.out.println(\"\
    Leaving: \" + interceptedObject.getClass().getName() + \" .\" + interceptedMethod.getName()\
    \ + \"()\");\n        return obj;\n    }\n}\n```\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_88_0.png)\n\
    \n# JAVA 13: 分布式编程与 EE 企业级 Java Beans\n\n这是一个非常典型的 Java 类，包含一个简单的方法，首先注意到的是该方法被一个注解装饰了。该方法有一个\
    \ `InvocationTarget` 参数，提供了更多服务。`getType()` 方法返回执行方法的对象，而 `getMethod()` 返回一个代表被拦截的\
    \ `interceptedObject` 的对象。最后，`proceed()` 方法执行被拦截的 `interceptedMethod()`。在 `proceed()`\
    \ 调用的两边都会执行一个 `System.out.println`，如果方法执行了 `logMethodCall()`，Glassfish 服务器日志中就会写入一条记录，随后执行该方法并写入日志文件。\n\
    \n问题在于如何获取方法的执行并使其发生，而这（当然）是通过注解实现的：\n\n```java\n@Override\n@Interceptors((AddressInterceptor.class))\n\
    public void save(Address address) throws Exception {\n    EntityManager em = null;\n\
    \    try {\n        em = Persistence.createEntityManagerFactory(\"AddressEJB-ejbPU\"\
    );\n        createEntityManager();\n        em.getTransaction().begin();\n   \
    \     em.persist(address);\n        em.getTransaction().commit();\n    } catch\
    \ (Exception ex) {\n        throw new Exception();\n    } finally {\n        if\
    \ (em != null) em.close();\n    }\n}\n```\n\n因此，在创建地址之前和数据库更新之后，会在日志文件中写入记录。\n\
    \n## 3.6 定时服务 (TIMER SERVICE)\n\n有一种 session bean 的特殊变体实现了定时器。因此，你可以让实际 bean 在特定间隔内执行操作，例如写入日志文件。在这种情况下，我将编写一个\
    \ session bean，每半秒确定一次下一个素数。我从一个名为 `PrimesEJB` 的企业应用开始，包含一个 EJB 模块和一个 Web 应用。对于\
    \ EJB 模块，我添加了一个 EJB，但此时它是一个定时器 Session Bean：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_90_0.png)\n\
    \n随后你将看到下面的窗口，在其中你应该像照常一样输入名称（这里是 PrimesSession）和包名（primeejb.ejbs）。我选择选择了它必须是单例（Singleton），并且创建一个本地接口（Local\
    \ interface）：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_90_1.png)\n\n最后，我设置了定时器触发的间隔。在这种情况下，模式意味着定时器必须每半分钟触发一次。点击“完成”后，NetBeans\
    \ 会创建以下类：\n\n```java\npackage primesej.ejbs;\n\nimport javax.ejb.Schedule;\nimport\
    \ javax.ejb.Singleton;\n\n@Singleton\npublic class PrimesSession implements PrimesSessionLocal\n\
    {\n    @Schedule(hour = \"\", minute = \"\", second = \"*/30\")\n    public void\
    \ myTimer()\n    {\n    }\n}\n```\n\n以及一个定义的接口。如所示，它是一个普通的 session bean，唯一的区别是了一个定时器方法，并使用\
    \ `@Schedule` 注解定义它是一个定时函数以及触发的频率。完成后的接口是：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_91_0.png)\n\
    \n# 企业级 Java Beans (ENTERPRISE JAVA BEANS)\n\n```java\npackage primesejb.ejjs;\n\
    ```\n\n```java\nimport javax.ejb.Local;\nimport java.math.BigInteger;\n\n@Local\n\
    public interface PrimesSessionLocal\n{\n    public void myTimer();\n    public\
    \ void reset();\n    public BigInteger getPrime();\n    public int getIndex();\n\
    }\n```\n\n其中除了定时器外，还定义了三个方法。`PrimesSession` 类将该接口：\n\n```java\npackage primesejb.ejjs;\n\
    \nimport javax.ejb.Local;\nimport java.math.BigInteger;\nimport javax.ejb.Schedule;\n\
    import javax.ejb.Singleton;\n\n@Singleton\npublic class PrimesSession implements\
    \ PrimesSessionLocal\n{\n    private BigInteger two = new BigInteger(\"2\");\n\
    \    private BigInteger prime = new BigInteger(\"2\");\n    private int index\
    \ = 0;\n\n    @Schedule(hour = \"*\", minute = \"*\", second = \"*/30\")\n   \
    \ public void myTimer()\n    {\n        if (prime.isProbable(50)) {\n        \
    \    prime = prime.add(two);\n        } else {\n            prime = prime.add(two);\n\
    \        }\n        index++;\n    }\n\n    public void reset()\n    {\n      \
    \  prime = new BigInteger(\"2\");\n        index = 0;\n    }\n}\n```\n\n# JAVA\
    \ 13: 分布式编程与 EE：软件开发企业级 Java Beans\n\n```java\npackage primesjb.beans;\n\nimport\
    \ javax.inject.Named;\nimport javax.enterprise.context.RequestScoped;\nimport\
    \ java.math.BigInteger;\nimport javax.ejb.EJB;\nimport primesjb.ejb.PrimesSessionLocal;\n\
    \n@Named(value = \"primesBean\")\n@RequestScoped\npublic class PrimesBean {\n\
    \    @EJB\n    private PrimesSessionLocal primesSession;\n\n    public PrimesBean()\
    \ {\n}\n\n    public BigInteger getPrime() {\n        return primesSession.getPrime();\n\
    \    }\n}\n```\n\n# JAVA 13: 分布式编程与 EE：软件开发企业级 Java Beans\n\n```java\npublic int\
    \ getIndex() {\n  return primesSession.getIndex();\n}\n```\n\n```java\npublic\
    \ void reset() {\n  primesSession.reset();\n}\n```\n\n这是一个非常简单的 bean，没什么需要注意的，但你需要意识到它使用了我的\
    \ session bean。JSF 页面同样简单，并在浏览器中打开，结果如下，通过链接来更新用户界面：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_94_0.png)\n\
    \n关于 e-Learning for Kids：e-Learning for Kids 成立于2004年，是一个全球性的非营利基金会，致力于为5至12岁的儿童在互联网上提供有趣且免费的学习，课程涵盖数学、科学、语言艺术、计算机、健康和环境技能。自2005年以来，来自190多个国家的1500万名儿童受益于\
