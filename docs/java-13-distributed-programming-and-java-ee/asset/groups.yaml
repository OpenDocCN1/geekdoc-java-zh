    # 3.2 A REMOTE SINGLETON SESSION BEAN


    In the first two examples, the session bean and the client application have been
    part of the same enterprise application. In this section I will show an example
    of a session bean developed as single module and deployed independently to the
    server. Next, the example will include a common web application that is developed
    independently of the above bean, but uses the session bean. This means that the
    application and the bean could be hosted on each application server.


    The actual session bean should also be written as a singleton – primarily to show
    how. A singleton session bean is a session bean, where there is exactly one instance
    per server. A typical application is a bean that must initialize some data exactly
    once, which should otherwise be available throughout the entire life of the application.
    Often, the data in question is initialized from a database, and you want to decorate
    a method with @PostConstruct, where data can be initialized. It is not used in
    the present case as data is hard-coded to make the current bean simple.


    In the same way as in the previous examples I start of creating an Enterprise
    Application project named KingsEJB, and when I get to the Server and Settings
    window, I have cleared the Create Web Application Module:


