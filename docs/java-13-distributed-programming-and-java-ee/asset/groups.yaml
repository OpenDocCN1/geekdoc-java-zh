  - "[PAGE 176]\n\n```\n<login-config>\n  <auth-method>BASIC</auth-method>\n  <realm-name>file</realm-name>\n\
    </login-config>\n```\n\n```\n</web-app>\n```\n\nUser rights are defined as security-constraint\
    \ elements, and in this case there are three. A security-constraint element defines\
    \ which pages it concerns and what role the user should have. The first happens\
    \ with a url-pattern element, while the others have with a role-name element.\
    \ Looking at the security-constraint it applies to all pages where the name starts\
    \ with admin, and all pages in the admin folder. Only users whose role is admin\
    \ can access these pages. The next security-constraint element applies to all\
    \ pages, but here is a requirement that the user should have the role staff. Finally,\
    \ the last security-constraint that applies to a concrete page (start page) and\
    \ for users whose role is student.\n\nThe last element is called login-config\
    \ and is used to define how authentication should take place. There are basically\
    \ three options\n\n+   1. BASIC, where it is left for the browser to make authentication\n\
    2. FORM where it is left for the program to perform authentication\n3. CLIENT-CERT,\
    \ which requires a certificate\n\nLooking at the above roles, they refer only\
    \ to the current application, but not to the specific user groups. There must\
    \ be a mapping of these names, which takes place in glassfish web.xml:\n\n```\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\"\n<!DOCTYPE glassfish-web-app PUBLIC \"\
    \ \" \"\">\n<glassfish-web-app error-url=\"\">\n<security-role-mapping>\n  <role-name>admin</role-name>\n\
    \  <group-name>admin</group-name>\n</security-role-mapping>\n<security-role-mapping>\n\
    \  <role-name>staff</role-name>\n  <group-name>staff</group-name>\n</security-role-mapping>\n\
    <security-role-mapping>\n  <role-name>student</role-name>\n  <group-name>student</group-name>\n\
    </security-role-mapping>\n<class-loader delegate=\"true\"/>\n<jsp-config>\n```"
