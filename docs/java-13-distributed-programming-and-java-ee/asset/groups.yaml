- md: "\n# JAVA 13: DISTRIBUTED PROGRAMMING AND JAVA EE: SOFTWARE DEVELOPMENT SECURITY\n\
    \nThe method determines a reference to a current session and invalidates it (all\
    \ session objects are removed). Then the user is redirected to the login window.\n\
    \n## 7.4 CLIENT CERTIFICATE\n\nInstead of making authentication using a username\
    \ and password, you can use a certificate that you can purchase from a Certificate\
    \ Authority (Verisign or Thwaite) as mentioned above. This certificate must be\
    \ installed by both the fish and the browser. For testing and development purposes,\
    \ it is possible to create a self-signed certificate. This is done with a tool\
    \ called keytool, which comes with jdk. On my machine, the keytool is placed in:\n\
    \n```\n/usr/java/jdk1.8.0_131/bin\n```\n\nbut it depends, of course, on how Java\
    \ is installed and what version. First, I will create a keystore with a key pair,\
    \ which can be done with the following command, where the user through a simple\
    \ dialog must enter values that can identify the user and his company (the other,\
    \ things that you use a Certificate Authority verifies):\n\n```\n/keytool -genkey\
    \ -v -alias pake -keyalg RSA -storetype PKCS12 -keystore client_keystore.p12 -storepass\
    \ Volmer1234 -keypass Volmer1234\nWhat is your first and last name?\n[Unknown]:\
    \ Paul Klausen\nWhat is the name of your organizational unit?\n[Unknown]: Development\n\
    What is the name of your organization?\n[Unknown]: Tor\nWhat is the name of your\
    \ City or Locality?\n[Unknown]: Skive\nWhat is the name of your State or Province?\n\
    [Unknown]: Jylland\nWhat is the two-letter country code for this unit?\n[Unknown]:\
    \ dk\nIs CN=Paul Klausen, OU=Development, O=Torus Data, L=Skive, ST=Jylland, C=dk\
    \ correct?\n[no]: yes\nGenerating 2048 bit RSA key pair and self-signed certificate\
    \ (SHA256withRSA) with a validity of 90 days for: CN=Paul Klausen, OU=Development,\
    \ O=Torus Data, L=Skive, Jylland, C=dk\n[Storing client_keystore.p12]\n```\n\n\
    For more information, it is not important (for a self-signed certificate) what\
    \ you write, for the arguments of the command, the name of your keystore must\
    \ end with .p12 and the storepass and the keypass should be same. After the command\
    \ has been completed, a keystore named client_keystore.p12 has been created under\
    \ your current directory. Your keystore must be imported into the browser, what\
    \ do you do (Firefox), by choose Settings and Advanced, and here you must choose\
    \ Certificates and again Show Certificates:\n\n### Avanceret\n\n| Generelt | Datadeling\
    \ | Netværk | Opdateringer | Certifikater |\n| :--- | :--- | :--- | :--- | :---\
    \ |\n| Forespørgsler når en server anmoder med mit personlige certifikat: | -\
    \ Vælg et automatisk<br>- Spørg mig hver gang<br>- Send forespørgsel til QCSP\
    \ responder-server for at bekræfte certificaters aktuelle gyldighed | | | |\n\
    | Vis certificater | Sikkerhedsmoduler | | | |\n\nIn the following window you\
    \ will get a list of the certificates that are installed in your browser and clicking\
    \ on the Import button, you can browse to your keystore (the file client_keystore.p12)\
    \ and install it.\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_187_0.png)\n\nDo\
    \ you like cars? Would you like to be a part of a successful brand? We will appreciate\
    \ and reward both your enthusiasm and talent. Send us your CV. You will be surprised\
    \ where it can take you.\n\nSend us your CV on www.employerforlife.com\n\n# JAVA\
    \ 13: DISTRIBUTED PROGRAMMING JAVA EE: SOFTWARE DEVELOPMENT\n\nThe certificate\
    \ must be exported to Glassfish, and first it must be converted to a format that\
    \ Glassfish can use. This again can be done with keytool:\n\n```\n# keytool -export\
    \ -alias pake -keystore client_keystore.p12 -storetype PKCS12 -storepass Volmer1234\
    \ -rfc -file signed.cer\nCertificate stored in file <signed.cer>\n```\n\nThe result\
    \ is a file named signed.cer. The name is not important, but it is recommended\
    \ that the name end with .cer. Glassfish has a file with the names of the Certification\
    \ Authorities that it trusts (it includes Verisign and Thwaite, and these names\
    \ are found in the file glassfish/domains/domain1/config/certs\n\nIn Order for\
    \ Glassfish to use my self-signed certificate, it must know me – and believe me\
    \ as a Certificate Authority – and I can export the file signed.cer to Glassfish\
    \ with keytool:\n\n```\n# keytool -import file signed.cer -keystore /usr/local/glassfish-4.1.1/glassfish/domains/domain1/certs.jks\
    \ -keypass changet -storepass changet\nOwner: CN=Paul Klausen, OU=Development,\
    \ O=Torus Data, L=Skive, ST=Jylland, C=dk\nIssuer: CN=Paul Klausen, OU=Development,\
    \ O=Torus Data, L=Skive, ST=Jylland, C=dk\nSerial number: 17f52e72\nValid from:\
    \ Fri 03 14:32 CET 2017\nuntil: Thu 01 14:32 CET 2018\nCertificate fingerprints:\n\
    MD5:\nSHA1:\nSHA256: SHA256withRSA\nExtensions:\nCriticality=false\nSubjectIdentifier:\n\
    KeyIdentifier:\n```\n\nTrust this certificate? [no]: yes Certificate was added\
    \ to keystore\n\nThen I can use the certificate for authentication. The code would\
    \ use a copy of SecurityApp project. The code should not be changed, but the web.xml\
    \ configuration files. Below is web.xml shown:\n\n```xml\n<?xml version=\"1.0\"\
    \ encoding=\"UTF-8\"?>\n<web-app xmlns=\"http://xmlns.jcp.org/ns/javaee\" xmlns:xsi=\"\
    http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\" >\n\n<session-config>\n\
    \  <session-timeout>30</session-timeout>\n</session-config>\n\n<security-constraint>\n\
    \  <web-resource-collection>\n    <web-resource-name>AllPages</web-resource-name>\n\
    \    <url-pattern>/*</url-pattern>\n  </web-resource-collection>\n  <auth-constraint>\n\
    \    <role-name>student</role-name>\n  </auth-constraint>\n  <user-data-constraint>\n\
    \    <transport-guarantee>CONFIDENTIAL</transport-guarantee>\n  </user-data-constraint>\n\
    </security-constraint>\n\n<login-config>\n  <auth-method>CLIENT-CERT</auth-method>\n\
    \  <realm-name>certificate</realm-name>\n</login-config>\n```\n\nThis time, there\
    \ is only one security-constraint element, since all users with the role student\
    \ must have access to the entire application and also defines a secure Internet\
    \ connection should be used. Additionally, you can not authenticate with a certificate\
    \ without an SSL connection. Then there is the login-config element, which defines\
    \ the use of a certificate time. Which certificate to use is defined in web.xml:\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE web-app PUBLIC\
    \ \"//GlassFish.org/DTD GlassFish Application Server 3.1 Servlet 3.0//EN\" \"\
    http://glassfish.org/dtds/glassfish-web-app_3_0-1.dtd\">\n<glassfish-web-app error-url=\"\
    \">\n\n<context-root>certificaterealm</context-root>\n<security-role-mapping>\n\
    \  <role-name>student</role-name>\n  <principal-name>CN=Paul Klausen, OU=Development,\
    \ O=Torus Data, L=Skive, ST=Jylland, C=dk</principal-name>\n</security-role-mapping>\n\
    <class-loader delegate=\"true\"/>\n<jsp-config>\n  <property name=\"keepgenerated\"\
    \ value=\"true\">\n    <description>Keep a copy of the generated ...</description>\n\
    \  </property>\n</jsp-config>\n</glassfish-web-app>\n```\n\nHere the user role\
    \ student must be mapped to the certificate. Here it is important that the principal-name\
