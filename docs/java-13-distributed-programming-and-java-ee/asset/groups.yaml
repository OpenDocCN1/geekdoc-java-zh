    \n在这里我输入了资源包、路径和类名。你应该注意 MIME 类型是 XML。当我点击“完成”（Finish）时，NetBeans 会创建两个文件：\n\n\
    结果是执行了 getXml() 方法，该方法已对浏览器做出响应。下一步，我将编写一个使用该资源的客户端，它应该是一个简单的控制台应用程序。因此我创建了一个名为\
    \ HelloREST 的 Java Application 项目。对于这个项目，我添加了 Java 客户端：\n\n```java\npackage hellorest;\n\
    \nimport javax.ws.rs.client.Client;\nimport javax.ws.rs.client.WebTarget;\nimport\
