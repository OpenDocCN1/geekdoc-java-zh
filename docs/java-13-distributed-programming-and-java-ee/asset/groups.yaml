    # 序言


    本书是软件开发系列书籍中的第十三本。编程语言是 Java，该语言及其语法和语义显然涵盖了大量内容，但这些书籍很大程度上也关注流程以及如何开发良好且健壮的应用。本书是
    Java 11 主题的延续，但重点是企业级应用程序的。这些程序使用托管在不同计算机、位于不同位置的组件或服务来执行工作，并通过网络进行通信和协调工作。主要主题是
    Java EE 技术，如 JPA、EJB 和 Web 服务。本书要求具备 Web 应用程序的知识，这与 Java 11 和 Java 12 中处理的内容类似。


    正如标题所示，本系列书籍涉及软件开发，目标是教读者如何使用 Java 开发应用程序。读者可以通过阅读相关主题和学习示例程序来掌握，最重要的是通过亲手实践并从零开始编写自己的程序。因此，书中的重要部分是练习题和问题，读者必须编写与书中内容相对应的程序。该系列中的所有书籍都围绕骨架构建，由文本、示例和问题组成，这些内容被放在文中自然的位置。练习题和问题之间的区别在于，练习题很大程度上是对文中介绍内容的重复，并且准确地描述了要做什么。而问题的描述较为松散，规模稍大，且很少有明确的最佳解决方案。这些书籍应该从头读到尾，但大量的代码示例（包括练习题和问题）起着核心作用，读者详细研究这些示例代码并亲自解决练习题和问题（或只是研究推荐的解决方案）是非常重要的。


    所有书籍以一个或两个较大的示例程序作为结束，这些程序主要关注流程以及程序是如何编写的。相比之下，代码出现的程度有限——如果有的话——读者可能应该研究完成的程序代码，并对其进行测试。


    '
