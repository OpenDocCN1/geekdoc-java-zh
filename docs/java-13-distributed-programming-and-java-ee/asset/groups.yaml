    \ you'll get another warning:\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_180_0.png)\n\
    \nand clicking on the last button means that you have accepted the unsecured certificate\
    \ and the usual login window appears. If you close the browser and reopen the\
    \ program, you will not get the above warnings, and the login window will open\
    \ immediately.\n\nYou should note that if you open the program in the usual way\
    \ by entering the address\n\n```\nhttp://localhost:8080/SecurityApp/\n```\n\n\
    it is the login window as shown below. That is, the address is automatically redirected\
    \ to the HTTPS protocol and port 8181:\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_180_1.png)\n\
    \n## 7.3 FORM AUTHENTICATION\n\nIn the example above, it is the browser that has\
    \ shown the login window and it is, in principle, excellent, but you can also\
    \ write your own login form. There may be at least two reasons for it, including\
    \ that you decide how the form should look, but it also allows you to implement\
    \ a logout function. In the following example I will show how to do it, but first\
    \ I will change the program itself.\n\nIn the introductory example, the project\
    \ consists of three HTML pages, but in practice it will typically be JSF pages\
    \ with backing beans, which requires a few changes. The SecurityApp project is\
    \ expanded with two new JSF pages compared to the previous project, and in addition,\
    \ the three original pages have been changed to JSF pages:\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_181_0.png)\n\
    \n## SECURITY\n\nThe three original pages index.xhtml, enter.xhtml and start.xhtml\
    \ have a backing bean. A managed bean with the name LogoutBean has also been added.\
    \ The design of the first three pages has changed a bit, but in principle it works\
    \ the same way. The error.xhtml page is trivial and consists of some text and\
    \ a link to login.xhtml, and the page is if you use a user that is not found or\
    \ you entered an illegal password. The most important thing about the example\
    \ is the page login.xhtml\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    \ ?>\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xmlns:h=\"\
    http://xmlns.java.org/jsf/html\">\n<head>\n<title>Login</title>\n</head>\n<body>\n\
    <h2>Enter username and password</h2>\n<form method=\"POST\" action=\"security_check\"\
    >\n<table cellpadding=\"0\" border=\"0\">\n<tr>\n<td align=\"right\">Username:</td>\n\
    <td><input type=\"text\" name=\"username\"/></td>\n</tr>\n<tr>\n<td colspan=\"\
    2\" style=\"height:10px\"></td>\n</tr>\n<tr>\n<td align=\"right\">Password:</td>\n\
    <td><input type=\"password\" name=\"password\"/></td>\n</tr>\n<tr>\n<td colspan=\"\
    2\" style=\"height:20px\"></td>\n</tr>\n<tr>\n<td></td>\n<td><input type=\"submit\"\
    \ value=\"Login\"/></td>\n</tr>\n</table>\n</form>\n</body>\n</html>\n```\n\n\
    It is a JSF page, but no JSF elements are used, and in particular it is important\
    \ that the action attribute which refers to form element is not a href element.\
    \ You should note that security_check which the application server performs. For\
    \ the same reasons, the two input fields must be named username and password.\n\
    \nThe last thing that must happen to use form authentication is the change of\
    \ web.xml, where the login-config element is changed to the following:\n\n```xml\n\
    <login-config>\n  <auth-method>FORM</auth-method>\n  <realm-name>file</realm-name>\n\
    \  <login-config>\n    <login-page>faces/login.xhtml</login-page>\n    <error-page>faces/error.xhtml</error-page>\n\
    \  </login-config>\n</login-config>\n```\n\nWhen you operate the application,\
    \ you will see the window below, where you will enter the username and password.\
    \ In this case, it is a very simple form, but you can modify login.xhtml so you\
    \ get a nicer design that fits the current application. Note that the address\
    \ bar shows a secure connection is being used.\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_183_0.png)\n\
    \nAfter entering your username and password, you will get index.xhtml:\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_184_0.png)\n\
    \nThe window looks a bit different, but it is important that there is a link to\
    \ logout. As mentioned above, the page has a managed bean:\n\n```java\npackage\
    \ securityapp.beans;\n\nimport javax.inject.Named;\nimport javax.enterprise.context.SessionScoped;\n\
    import java.io.Serializable;\n```\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_184_1.png)\n\
    \n```java\n@Named(value = \"indexBean\")\n@SessionScoped\npublic class IndexBean\
    \ implements Serializable\n{\n    public String admin()\n    {\n        return\
    \ \"admin/start?faces-redirect=true\";\n    }\n\n    public String enter()\n \
    \   {\n        return \"enter?faces-redirect=true\";\n    }\n}\n```\n\nThe two\
    \ action methods should do nothing but redirect to the two pages start.xhtml and\
    \ enter.xhtml that happens when you click on one of the two buttons. A JSF page\
    \ performs an action, it hits with the POST method, and instead of performing\
    \ a redirection, a forward is performed. Furthermore, the user is not validated\
    \ (it only happens when you leave a page again). To solve the problem (the application\
    \ works like the previous application), as described above, you must force a redirection.\n\
    \nClicking on the Logout link, is a method logout() in a managed LogoutBean.java:\n\
    \n```java\npackage securityapp.beans;\n\nimport javax.inject.Named;\nimport javax.enterprise.context.RequestScoped;\n\
    import javax.faces.context.*;\nimport javax.servlet.http.*;\n\n@Named(value =\
    \ \"logoutBean\")\n@RequestScoped\npublic class LogoutBean\n{\n    public String\
    \ logout()\n    {\n    }\n\n    public String logout(ExternalContext externalContext)\n\
    \    {\n        ExternalContext = FacesContext.getCurrentInstance().getExternalContext();\n\
    \        HttpSession session = (HttpSession) externalContext.getSession(true);\n\
    \        session.invalidate();\n        return \"login?faces-redirect=true\";\n\
    \    }\n}\n```\n"
  mdcn: "\n\n# JAVA 13 分布式编程\nJAVA EE: 软件开发\n\n```xml\n<url-pattern>/admin/*</url-pattern>\n\
    <web-resource-collection>\n  <auth-constraint>\n    <role-name>admin</role-name>\n\
