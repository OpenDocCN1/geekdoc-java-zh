    \    private WebTarget webTarget;\n\n    public HelloClient() {\n        Client\
    \ client = Client.newClient();\n        webTarget = client.target(BASE_URI).path(\"\
    hello\");\n    }\n\n    public String getXml() {\n        return webTarget.request(MediaType.APPLICATION_XML).get(String.class);\n\
