    \n# 3.4 事务\n\n使用企业 Bean 的主要优势之一是它们使用事务，这通常意味着如果所有操作执行正确，更改将会生效；否则什么都不执行。在事务正在进行时调用方法，其工作方式并不明显。可以通过注解进行配置：\n\
    \n```java\n@Stateless\npublic class Helloworld\n{\n    @Override\n    @TransactionAttribute(TransactionAttributeType.REQUIRES_NEW)\n\
