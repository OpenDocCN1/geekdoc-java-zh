  - '[PAGE 115]


    JAVA 13: DISTRIBUTED PROGRAMMING

    JAVA EE: SOFTWARE DEVELOPMENT


    # 4 CDI


    CDI stands for Context and Dependency Injection and describes how the application
    server creates and removes objects, and especially what you can and write in the
    code. For example, if you consider a JSP file with a backing bean, which is just
    a common Java class, then you do not need to do anything to create an object of
    the class and how long the object lives is determined by its scope with an annotation.


    A JavaBean is just a class that is written from a specific and simple pattern,
    and the programmer creates an object (a bean) using the new operator. After that,
    the garbage collector is responsible for removing the object when there are no
    longer references to it. In contrast, a managed bean is a bean, where it is the
    container in the form of the application server, which is responsible for removing
    the object again when the program goes out of the object''s scope. Such a bean
    is also called a CDI object. You cannot create a managed bean with new. CDI objects
    are instead created using a technique called injection, which means that it is
    the container that takes care of it. When defining a bean with injection, the
    container will examine whether the bean is created and if not, it will instantiate
    a new object and perform injection on all beans to which the current bean depends
    and finally, a method decorated with @PostConstruct is performed.


    ![](img/0a9d86aea6b178e4945a7a3e94449cb9_115_0.png)


