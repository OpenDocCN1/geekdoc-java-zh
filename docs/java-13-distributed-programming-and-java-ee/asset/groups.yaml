    where the value with TransactionAttribute indicates how the transactions will
    work. There are the following options:


    +   1. TransactionAttributeType.MANDATORY: The method can only be performed as
    part of an existing transaction. If the method is called outside of a transaction,
    a TransactionRequiredException is raised.

    2. TransactionAttributeType.NEVER: If the method is called from a client, no transaction
    is created. If the method is called as part of a transaction, a RemoteException
    is raised.

    3. TransactionAttributeType.NOT_SUPPORTED: If the method is called as part of
    an existing transaction, it is suspended and the method is performed outside of
    the transaction. no transaction is created.

    4. TransactionAttributeType.REQUIRED: If the method is performed as part of an
    existing transaction, the method will be executed as part of this. If the method
    is called outside of an existing transaction, a new transaction will be created.

    5. TransactionAttributeType.REQUIRES_NEW: If the method is called as part of an
    existing transaction, a new transaction will be created. After the method is completed,
    the previous transaction will be resumed. If the method is called outside of an
    existing transaction, a new transaction is created.

    6. TransactionAttributeType.SUPPORTS: If the method is performed as part of an
    existing transaction, it is performed as part of this transaction. If the method
    is called outside of a transaction, no new transaction is initiated.


    Above is shown how to decorate method for transactions, but you can also decorate
    the class and the decoration will then relate to all class''s methods.


