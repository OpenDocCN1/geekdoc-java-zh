    # INTRODUCTION


    In the previous two books, I have been working on developing web applications,
    and this book is a natural continuation, focusing on the development of distributed
    programs. They are programs that perform their work using components or services
    hosted on different computers, which communicate and coordinate their work over
    a network. The whole idea is that components largely have their own lives and
    live independently of each other and generally without knowing the clients who
    use the services they provide. In fact, it is not easy to precisely define what
    we understand as a distributed program, but typically we will understand a program
    that is characterized by


    +   1. that there are several independent computing units (computers), each of
    which has their own local memory

    2. the computing units communicate by sending messages to each other over a network


    The goal of a distributed program (or system) may be to solve a particular task,
    and users will perceive the family of computing units as a single device (or system),
    but instead, they may be a service-oriented system that offers a range of services
    which users can use and perceive as shared resources. Distributed eBooks will
    also be characterized by parallelism, where multiple activities are performed
    simultaneously on multiple computers and locations.


    You can also sometimes describe distributed programming as a further development
    of object-oriented programming. An object-oriented program consists of objects
    with each of their internal data and logic hidden from the outside world and only
    known through the services that the object makes available in the form of public
    methods. These objects work together to solve the task to be solved. Similarly,
    you can see a distributed program as a program that solves the task by providing
    a number of services that live independently of each other on computers around
    the world where applications can use them if they otherwise will be allowed.'
- md: "\nIn addition to showing how to develop distributed programs in practice (or\
    \ perhaps more in relation to this), the goal is to describe more specific technologies\
    \ as in headings are:\n\n- Java Persistence API\n- Java Enterprise Beans\n- Contexts\
    \ and Dependency Injection\n- Java Web Services\n- RESTful web services\n- Java\
    \ EE security\n\nAs it appears, the book describes a number of Java APIs, and\
    \ much of the substance directly related to NetBeans and GlassFish.\n\n## JAVA\
    \ 13: DISTRIBUTED PROGRAMMING AND\nJAVA EE: SOFTWARE DEVELOPMENT\n\n## JAVA PERSISTENCE\
    \ API\n\n## JAVA PERSISTENCE API\n\nIn the previous books (from Java 6 onwards)\
    \ and including Java 11 on web applications, I have considered several examples\
    \ that uses databases. It has always been programming an object oriented encapsulation\
    \ of the database in the form of model classes for each of the database tables;\
    \ one or more classes that encapsulate the SQL statements will manipulate the\
    \ content of the relational database. This has meant that for each example, many\
    \ lines have been required to write the Java code, and although it may be affordable\
    \ (and better), as it is in principle the same thing that happens every time,\
    \ it can be easier as Java EE offers an API called Java Persistence API, which\
    \ has the exact task of offering an object-oriented interface to a relational\
    \ database. The aim of this chapter is to give an introduction to this API, and\
    \ the content largely characterizes “how to do”.\n\nI will start with a copy of\
    \ the project ChangeAddress3 from the book 11, where I have called the copy ChangeAddress1.\
    \ If you open the application in the browser, you get the following window, where\
    \ you can enter an address, and if you click on the bottom link, you get another\
    \ window that shows an overview of the addresses that were entered.\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_9_0.png)\n\
    \nWhen entering addresses, they are stored in a list of Person objects. However,\
    \ data is not stored persistently. As I have shown in previous examples, it is\
    \ relatively simple to create a database with a table, and then save data in this.\
    \ In this example, I will show you how to do it using JPA.\n\nIn this example,\
    \ I want to use JavaDB as database product. Primarily to show this database, it\
    \ is useful and easy to use in many contexts where you need a simple database.\
    \ It is a standard SQL database server, supported by the Glassfish server, which\
    \ does not require an special installation, and the product is also supported\
    \ by NetBeans.\n\nThe method is basically defining an entity class for each database,\
    \ and I would like to start by associating a class to the model package. It must\
    \ be an Entity Class:\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_10_0.png)\n\n\
    and it should be called Address:\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_11_0.png)\n\
    \nYou should note that the correct package name has been selected (can be entered\
    \ if it is not in the list) and that the Create Persistence Unit has been ticked.\
    \ A persistence unit is an XML configuration file called persistence.xml created\
    \ by NetBeans. When you click Next in the window, you get a window to initialize\
    \ this XML file. You can change the name if you wish, and that Use Java Transaction\
    \ APIs have been ticked. By default, Create has selected, which means the database\
    \ must be created if it is not.\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_11_1.png)\n\
    \nHowever, the most important is the Data Source field, which is a reference to\
    \ a current database. Here you can choose an existing data source, or you can\
    \ create a new one:\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_12_0.png)\n\n\
    If you click on New Data Source, you get a window to create a data source:\n\n\
    ![](img/0a9d86aea6b178e4945a7a3e94449cb9_12_1.png)\n\nwhere I have entered the\
    \ name addresses. A connection to the database must also be defined. Here you\
    \ can either choose an existing one or create a new one. In this case, you must\
    \ create a new one, and choose a driver I have selected Java DB (Network):\n\n\
    ![](img/0a9d86aea6b178e4945a7a3e94449cb9_12_2.png)\n\nWhen clicking Next, enter\
    \ each information about the database:\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_13_0.png)\n\
    \nThe database server – Glassfish server – runs on localhost and uses port number.\
    \ I have chosen that the database should be addresses.\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_13_1.png)\n\
    \nAPP, and I have entered a password. Then I click Next and finally Finish, NetBeans\
    \ has created:\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_14_0.png)\n\nWhen I\
    \ click OK, the Entity class is created:\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_14_1.png)\n\
    \n```java\npackage changeaddress.models;\n\nimport java.io.Serializable;\nimport\
    \ javax.persistence.*;\n\n@Entity\npublic class Address implements Serializable\
    \ {\n    private static final long serialVersionUID = 1L;\n\n    @Id\n    @GeneratedValue(strategy\
    \ = GenerationType.AUTO)\n    private Long id;\n\n    public Long getId() {\n\
    \        return id;\n    }\n\n    public void setId(Long id) {\n        this.id\
    \ = id;\n    }\n\n    @Override\n    public int hashCode() {\n      int hash =\
    \ 0;\n      hash += (id != null ? id.hashCode() : 0);\n      return hash;\n  \
    \  }\n\n    @Override\n    public boolean equals(Object object) {\n      if (!(object\
    \ instanceof Address)) return false;\n      return id.equals(((Address)object).id);\n\
    \    }\n\n    @Override\n    public String toString() {\n      return \"changeaddress.models.Address[id=\"\
    \ + id + \"]\";\n    }\n}\n```\n\nThe result is a class with a single property\
    \ ID of the type. You should note that this property is decorated with two annotations,\
    \ indicating that it is a primary key, while the other tells that the value should\
    \ be assigned by the database as an auto number. Finally, you should note that\
    \ the class is also decorated with an annotation that it is an entity. The class\
    \ must then be expanded with the following properties:\n\n```java\nprivate String\
    \ firstName;\nprivate String lastName;\nprivate String address;\nprivate String\
    \ code;\nprivate String city;\nprivate String email;\nprivate String date;\nprivate\
    \ String title;\n```\n\nwith associated get and set methods. Then I have deleted\
    \ the model class Person, and in IndexController, all references to Person must\
    \ be changed to Address, and the code in the add() method should be deleted. After\
    \ that, the program can be opened in the browser again.\n\nIn IndexController,\
    \ you must add some additional statements:\n\n```java\npackage changeaddress.beans;\n\
    \nimport java.util.*;\nimport javax.inject.Named;\nimport javax.enterprise.context.SessionScoped;\n\
    import java.io.Serializable;\nimport javax.persistence.*;\nimport javax.transaction.*;\n\
    import javax.annotation.*;\nimport javax.persistence.criteria.CriteriaQuery;\n\
    \nimport changeaddress.models.*;\n\n@Named(value = \"indexController\")\n@SessionScoped\n\
    public class IndexController implements Serializable {\n    @PersistenceUnit\n\
    \    EntityManagerFactory emf;\n    @PersistenceContext\n    EntityManager em;\n\
    }\n```\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_16_0.png)\n"
  mdcn: "\n\n除了展示如何在实践中开发分布式程序（或者可能更多与此相关），目标是描述如标题所示更具体的技术：\n\n- Java 持久化 API (Java\
    \ Persistence API)\n- Java 企业 Bean (Java Enterprise Beans)\n- 上下文与依赖注入 (Contexts\
    \ and Dependency Injection)\n- Java Web 服务\n- RESTful Web 服务\n- Java EE 安全性\n\n\
    如其表面所示，这本书描述了许多 Java API，其中大部分内容与 NetBeans 和 GlassFish 直接相关。\n\n## JAVA 13：分布式编程与\
    \ \nJAVA EE：软件开发\n\n## Java 持久化 API\n\n## Java 持久化 API\n\n在之前的书籍（从 Java 6 开始）以及包括关于\
    \ Web 应用的 Java 11 中，我考虑了几个使用数据库的示例。这一直是通过为每个数据库表创建模型类的形式，对数据库进行面向对象的封装编程；通过一个或多个封装了\
    \ SQL 语句的类来操作关系型数据库的内容。这意味着对于每个示例，都需要编写许多行 Java 代码，虽然这可能是可以接受的（而且更好），因为原则上每每次发生的情况都是相同的，但由于\
    \ Java EE 提供了一个名为 Java Persistence API 的 API，可能会变得更容易，该 API 的任务正是为关系型数据库提供一个面向对象的接口。本章的目的是介绍这个\
    \ API，内容很大程度上描述了“如何做”。\n\n我将从书籍 11 中项目 ChangeAddress3 的副本开始，我将该副本命名为 ChangeAddress1。如果你在浏览器中打开应用程序，将看到下面的窗口，你可以在其中输入地址，如果点击底部的链接，将得到另一个窗口，显示已输入地址的概览。\n\
    \n![](img/0a9d86aea6b178e4945a7a3e94449cb9_9_0.png)\n\n在输入地址时，它们被存储在 Person 对象的列表中。然而，数据并没有持久化地存储。正如我在之前的示例中所示，创建一个带有表的数据库并在其中保存数据是相对简单的。在这个示例中，我将向你展示如何使用\
    \ JPA 来实现。\n\n在这个示例中，我想使用 JavaDB 作为数据库产品。主要是为了展示这个数据库，它在许多需要简单数据库的语文中非常有用且易于使用。它是一个标准的\
    \ SQL 数据库服务器，受 Glassfish 服务器支持，不需要特殊安装，且该产品也受 NetBeans 支持。\n\n该方法基本上是为每个数据库定义一个实体类，我想从将类与\
    \ model 包关联开始。它必须是一个实体类（Entity Class）：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_10_0.png)\n\
    \n并且它应该命名为 Address：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_11_0.png)\n\n\
    你应该注意已经选择了正确的包名（如果不在列表中可以手动输入），并且勾选了“创建持久化单元”（Create Persistence Unit）。持久化单元是由\
    \ NetBeans 创建的名为 persistence.xml 的 XML 配置。当你点击窗口中的“下一步”时，将得到一个初始化此 XML 文件的窗口。你可以根据需要更改名称，并且勾选了“使用\
    \ Java 事务 API”。默认情况下选择了“创建”，这意味着如果数据库不存在则必须创建它。\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_11_1.png)\n\
    \n然而，最重要的是数据源（Data Source）字段，它是对当前数据库的引用。在这里你可以选择一个现有的数据源，也可以创建一个新的：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_12_0.png)\n\
    \n如果你点击“新建数据源”（New Data Source），将得到一个创建数据源的窗口：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_12_1.png)\n\
    \n其中我输入了名称 addresses。必须定义与数据库的连接。在这里你可以选择现有的，也可以创建一个新的。在这种情况下，你必须创建一个，并选择我选的驱动程序\
    \ Java DB (Network)：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_12_2.png)\n\n\
    点击“下一步”后，输入关于数据库的各项信息：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_13_0.png)\n\
    \n数据库服务器 – Glassfish 服务器 – 运行在 localhost 并使用端口号。我选择了数据库名为 addresses。\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_13_1.png)\n\
    \nAPP，我输入了密码。然后点击“下一步”最后点击“完成”，NetBeans 创建了：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_14_0.png)\n\
    \n当我点击“确定”时，实体类被创建了：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_14_1.png)\n\n\
    ```java\npackage changeaddress.models;\n\nimport java.io.Serializable;\nimport\
    \ javax.persistence.*;\n\n@Entity\npublic class Address implements Serializable\
    \ {\n    private static final long serialVersionUID = 1L;\n\n    @Id\n    @GeneratedValue(strategy\
    \ = GenerationType.AUTO)\n    private Long id;\n\n    public Long getId() {\n\
    \        return id;\n    }\n\n    public void setId(Long id) {\n        this.id\
    \ = id;\n    }\n\n    @Override\n    public int hashCode() {\n      int hash =\
    \ 0;\n      hash += (id != null ? id.hashCode() : 0);\n      return hash;\n  \
    \  }\n\n    @Override\n    public boolean equals(Object object) {\n      if (!(object\
    \ instanceof Address)) return false;\n      return id.equals(((Address)object).id);\n\
    \    }\n\n    @Override\n    public String toString() {\n      return \"changeaddress.models.Address[id=\"\
    \ + id + \"]\";\n    }\n}\n```\n\n结果是一个类型的类。你应该注意该属性被两个注解标记，指示它是主键，另一个告诉该值应该由数据库自动分配。最后，你应该注意该类也被标记为它是一个实体。该类随后必须扩展包含以下属性：\n\
    \n```java\nprivate String firstName;\nprivate String lastName;\nprivate String\
    \ address;\nprivate String code;\nprivate String city;\nprivate String email;\n\
    private String date;\nprivate String title;\n```\n\n以及相应的 get 和 set 方法。然后我删除了\
    \ Person 模型类，并在 IndexController 中将所有对 Person 的引用改为 Address，并删除了 add() 方法中的代码。之后，可以再次在浏览器中打开程序。\n\
    \n在 IndexController 中，你必须添加一些语句：\n\n```java\npackage changeaddress.beans;\n\n\
    import java.util.*;\nimport javax.inject.Named;\nimport javax.enterprise.context.SessionScoped;\n\
    import java.io.Serializable;\nimport javax.persistence.*;\nimport javax.transaction.*;\n\
    import javax.annotation.*;\nimport javax.persistence.criteria.CriteriaQuery;\n\
    \nimport changeaddress.models.*;\n\n@Named(value = \"indexController\")\n@SessionScoped\n\
    public class IndexController implements Serializable {\n    @PersistenceUnit\n\
    \    EntityManagerFactory emf;\n    @PersistenceContext\n    EntityManager em;\n\
    }\n```\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_16_0.png)\n\n"
