    server (deployed), the server will create a few instances of the session bean,
    which is commonly referred to as an EJB pool. When a client wants to create an
    instance of an EJB, the Glass server uses an instance from the pool and gives
    the client a reference. The goal of this process is course performance, as it
    takes a relatively long time to create an instance of an EJB. Is it a stateful
    session bean, the server maintains a conversation with the client, so it constantly
    uses the same instance. This is not the case with a stateless session bean, and
    for every call of a method there is no guarantee that it is the same instance
    that is used. Immediately, it would seem beneficial to use stateful session beans,
    but for the server there is an overhead to maintain the state, and therefore should
    stateful session beans be used if there is a need.


