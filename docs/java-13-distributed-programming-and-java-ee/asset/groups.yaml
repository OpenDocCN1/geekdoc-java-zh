    # SECURITY


    The method determines a reference to a current session and invalidates it (all
    session

    objects are removed). Then the user is redirected to the login window.


    # 7.4 CLIENT CERTIFICATE


    Instead of making authentication using a username and password, you can use a
    certificate

    that you can purchase from a Certificate Authority (Verisign or Thwaite) as mentioned

    above. This certificate must be installed by bothfish and the browser. For testing
    and

    development purposes, it is possible to create a self-signed certificate. This
    is done with a

    tool called keytool, which comes with jdk. On my machine, the keytool is placed
    in


    ```

    /usr/java/jdk1.8.0_131/bin

    ```


    but it depends, of course, on how Java is installed and what version. First, I
    will create a

