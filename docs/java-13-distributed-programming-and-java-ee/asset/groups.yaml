    REST WEB SERVICES


    # 6 REST WEB SERVICES


    REST stands for Representational State Transfer and is also called for a RESTful
    web services. Like other web services, they can be perceived as resources available
    and identified by an URI, and they are characterized by being easy to develop
    and are specifically intended as a frontend for a database table. RESTful web
    services are generally very flexible, and the communication between client and
    server can be done in several ways, but generally, data is sent either as XML
    or JSON. A web service must support at least one of four HTTP methods:


    +   1. GET, which is used to retrieve an existing resource

    2. POST, which is used to update an existing resource

    3. PUT, which is used to create a new resource

    4. DELETE, which is used to delete an existing resource


