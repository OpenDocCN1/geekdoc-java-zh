    \ 页面引用而需要一个托管 bean 时，CDI 会尝试在特定 bean 的作用域内寻找一个实例。如果成功，则将使用该对象；否则，将创建一个属于当前作用域的对象。通常情况下，一个对象（托管\
    \ bean）必须跨越多个页面“存在”，你可以使用 `RequestScoped`，因为它只与当前页面相关。该对象在每次发出请求时都会被创建。到目前为止（在本本书和之前的两本书中），我一直通过将\
    \ bean 定义为 `SessionScoped` 来解决问题。这种方法有效，而且也是最简单的解决方案，但 `SessionScoped` bean 也有缺点。首先，这些对象在整个会话期间以及会话结束后一段时间内一直存在。这意味着会话对象会不必要地填充机器内存。然而，更大的问题是，`SessionScoped`\
    \ bean（可以说，所有的会话对象）存活时间比它们需要的要长，存在它们不再存在的风险。后者实际上会让修复 Web 应用程序中的错误变得非常困难。\n\n\
    有一个名为“对话”（conversation）的上下文，bean 可以在几个页面上持续存在，但不会贯穿整个会话，这正是为了解决会话上下文带来的挑战。代价是必须由程序员来告诉容器对话何时开始以及何时结束。我想通过\
