  mdcn: "\n\n# JAVA 13: 分布式编程与 Java EE: 软件开发\n\n然后你可以使用该对象的方法。当 Bean 需要被移除时，容器会首先执行带有\
    \ `@PreDestroy` 装饰的方法，然后由容器移除该对象。可以通过下图进行说明：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_116_0.png)\n\
    \nCDI 对象有一个称为“上下文”（context）的作用范围，它基本上可以是：\n\n- 请求（request）\n- 会话（session）\n- 应用（application）\n\
    - 会话（conversation）\n\n例如，下面展示了一个托管 Bean（managed bean）：\n\n```java\npackage cdiprogram.beans;\n\
    \nimport javax.inject.Named;\nimport javax.enterprise.context.SessionScoped;\n\
    import java.io.Serializable;\n@Named(value = \"person\")\n@SessionScoped\npublic\
    \ class Person implements Serializable\n{\n    private String firstName;\n   \
    \ private String lastName;\n\n    public Person()\n{\n}\n\n    public String getFirstName()\n\
    {\n    return firstName;\n}\n\n    public void setFirstName(String firstName)\n\
    {\n  this.firstName = firstName;\n}\n\n    public String getLastName()\n{\n  return\
    \ lastName;\n}\n\n    public void setLastName(String lastName)\n{\n  this.lastName\
    \ = lastName;\n}\n}\n```\n\n这是一个你通过 `@Named` 看到的托管 Bean，其中你可以看到 NetBeans 为该类分配了小写的名称。注解（annotation）通常是一个接口，在这种情况下，它是一个带有单个属性值的接口（其默认值为空字符串，意味着容器选择了类名\
    \ `person`）。此外，你可以看到该对象的上下文是 `session`，且 `SessionScoped` 是一个接口。`Named` 和 `SessionScoped`\
    \ 这两个接口为容器提供了这些信息，告诉容器应该如何维护 `Person` 类的对象实例。\n\n使用上述 Bean 版本，你将能够编写以下 JSF 页面：\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE html PUBLIC \"\
    //W3C//DTD HTML 1.0 Transitional//EN\" >\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \nxmlns:h=\"http://xmlns.jcp.org/jsf/html\">\n<head>\n<title>Facelet Title</title>\n\
    </head>\n<body>\n<h:form>\n<h:panelGrid columns=\"2\">\n<h:outputLabel for=\"\
    firstName\" value=\"First Name\"/>\n<h:inputText id=\"firstName\" value=\"#{person.firstName}\"\
    />\n<h:outputLabel for=\"lastName\" value=\"Last Name\"/>\n<h:inputText id=\"\
    lastName\" value=\"#{person.lastName}\"/>\n<h:commandButton value=\"OK\" />\n\
    </h:panelGrid>\n</h:form>\n</body>\n</html>\n```\n\n# JAVA 13: 分布式编程 JAVA EE:\
    \ 软件开发\n\n有趣的地方在于打开页面时，Glassfish 服务器会在在 session 上下文中注入 `Person` 对象，而无需程序员手动创建该对象。\n\
    \n在之前的示例中，我选择通过以下语句的形式获取另一个命名的 Bean：\n\n```java\nELContext elc = FacesContext.getCurrentInstance().getELContext();\n\
    SomeBean someBean = (SomeBean) FacesContext.\ngetCurrentInstance().getApplication().getELResolver().getValue(elc,\
    \ null, \"person\");\n```\n\n这本身没有问题，但编写起来很困难且记忆。然而，可以使用 CDI 来简化语法。考虑以下这个命名的 Bean，它有一个名称\
    \ `student` 和一个属性 `subject`：\n\n```java\npackage cdiprogram.beans;\n\nimport javax.inject.Named;\n\
    import javax.inject.Inject;\nimport javax.enterprise.context.SessionScoped;\n\
    import java.io.Serializable;\n```\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_118_0.png)\n\
    \n```java\n@Named(value = \"student\")\n@SessionScoped\npublic class Student implements\
    \ Serializable {\n    @Inject\n    private Person person;\n    private String\
    \ subject;\n\n    public Student() {\n    }\n\n    public Person getPerson() {\n\
    \        return person;\n    }\n\n    public void setPerson(Person person) {\n\
    \        this.person = person;\n    }\n\n    public String getSubject() {\n  \
    \      return subject;\n    }\n\n    public void setSubject(String subject) {\n\
    \        this.subject = subject;\n    }\n}\n```\n\n名称由 `Person` 类型的变量表示。但你必须注意，我们没有在地方创建\
    \ `Person` 类型的对象（该属性似乎没有初始化），而是对 `person` 使用了 `@Inject` 装饰。这表明 `Student` 托管 Bean\
    \ 于 `Person`（另一个托管 Bean），当容器通过注入创建 `Student` 对象时，它会查找是否需要创建一个 `Person` 对象，如果是则创建。下面是编写一个以\
    \ `Student` 为后端 Bean 的 JSF 页面：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    \ ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 1.0 Transitional//EN\" >\n<html\
    \ xmlns=\"http://www.w3.org/1999/xhtml\"\nxmlns:h=\"http://xmlns.jcp.org/jsf/html\"\
    >\n<head>\n```\n\n```xml\n<title>Facelet Title</title>\n</head>\n<body>\n<h:form>\n\
    <h:panelGrid columns=\"2\">\n<h:outputLabel for=\"firstName\" value=\"First Name\"\
    />\n<h:inputText id=\"firstName\" value=\"#{person.firstName}\"/>\n<h:outputLabel\
    \ for=\"lastName\" value=\"Last Name\"/>\n<h:inputText id=\"lastName\" value=\"\
    #{person.lastName}\"/>\n<h:inputText id=\"subject\" value=\"Subject\"/>\n<h:commandButton\
    \ value=\"OK\" />\n</h:panelGrid>\n</h:form>\n</body>\n</html>\n```\n\n# 4.1 限定符\
    \ (QUALIFIERS)\n\n如果你考虑 `Student` Bean，它依赖于 `Person` Bean。我现在将定义一个派生类，将其命名为 `Man`，但首先将该类设为抽象类，并添加一个返回人员性别的抽象方法：\n\
    \n```java\n@Named(value = \"person\")\n@SessionScoped\npublic abstract class Person\
    \ implements Serializable\n{\n    public abstract String getGender();\n}\n```\n\
    \n然后我可以写下面的 Bean：\n\n```java\npackage cdiprogram.beans;\n\nimport javax.inject.Named;\n\
    import javax.enterprise.context.SessionScoped;\nimport java.io.Serializable;\n\
    \n@Named(value = \"man\")\n@SessionScoped\npublic class Man extends Person implements\
    \ Serializable\n{\n    public Man() {\n    }\n\n    public String getGender()\
    \ {\n        return \"man\";\n    }\n}\n```\n\n如果你忽略 `@Male` 注解，这个类中并没有新内容。它是一个继承自托管\
    \ Bean 的托管 Bean，而 Bean 只是一个类。如果你从容器的角度看到 `Student` 类，它定义了一个类型为 `Person` 的变量，那么容器必须随后创建一个实际的对象，例如\
    \ `Man` 对象。由于 `Person` 类可能有更多的派生类，人们应该能够告诉容器实例化对象时具体是指哪一个，这通过“限定符”（qualifier）来实现。`Male`\
    \ 是一个限定符，是一个如下所示定义的接口：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_121_0.png)\n\
    \n```java\npackage cdiprogram.beans;\n\nimport static java.lang.annotation.ElementType.TYPE;\n\
    import static java.lang.annotation.ElementType.FIELD;\nimport static java.lang.annotation.ElementType.PARAMETER;\n\
    import static java.lang.annotation.ElementType.METHOD;\nimport static java.lang.annotation.RetentionPolicy.RUNTIME;\n\
    import java.lang.annotation.Retention;\nimport java.lang.annotation.Target;\n\
    import javax.inject.Qualifier;\n\n@Qualifier\n@Retention(RUNTIME)\n@Target({METHOD,\
    \ FIELD, PARAMETER, TYPE})\npublic @interface Male {\n}\n```\n\n在 `Male` 类中，你通过\
    \ `@Male` 告诉该类被限定符标识。CDI 项目还定义了一个派生类，使用限定符 `Female`。在原则上，编写一个限定符很容易，但语法很难记忆，因此\
    \ NetBeans 为此提供了类型：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_122_0.png)\n\n\
    如果你想让 `Student` 类创建一个 *Woman* 对象，语法如下：\n\n```java\npublic class Student implements\
    \ Serializable {\n  @Inject\n  @Female\n  private Person person;\n}\n```\n\n"
