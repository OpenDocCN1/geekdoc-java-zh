  mdcn: "\n\n## WEB 服务 (WEB SERVICES)\n\nWeb 服务是一种可以托管在 Web 服务器上并为客户端提供服务的组件，在某种程度上，Web\
    \ 服务可以被视为企业 Java Bean（EJB）的替代方案。Web 特点是易于开发且平台无关。后者意味着 Web 服务与客户端之间的通信是以 XML 格式进行的，并遵循\
    \ SOAP 协议，因此完全以文本形式存在。因此，使用 Web 服务被认为是一种安全技术，但代价是由于消息编码为 XML 可能会在性能上有所消耗。必须根据参数和返回值向客户端定义\
    \ Web 服务及其服务，这是通过一个名为 Web 服务定义语言（WSDL）的 XML 文档完成的。编写 Web 服务最大的挑战是编写该文档，它非常复杂（语法困难且全面），而\
    \ NetBeans 可以提供帮助，因为它能生成所有内容，你实际上可以在不需要了解任何 WSDL 的情况下编写 Web 服务。\n\n我想从一个简单的 Web\
    \ 服务开始，它包含以下转换方法：\n\n- double celsiusToFahrenheit(double value) 将摄氏度转换为华度\n- double\
    \ fahrenheitToCelsius(double value) 将华度转换为摄氏度\n\n我从一个 Web 应用开始，我将其命名为 ConversionService，它只需要是一个空的\
    \ Web 应用。然后我添加一个 Web 服务\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_132_0.png)\n\
    \n## JAVA 13: 分布式编程与 JAVA EE：软件开发 Web 服务\n\n在下一个窗口中，我必须输入一个名称（此处为 ConversionService）并选择一个包：\n\
    \n### 新 Web 服务 (New Web Service)\n\n| 步骤 | 名称和位置 |\n|---|---|\n| 1 选择文件类型 | Web\
    \ 服务名称: ConversionService |\n| 2 命名和位置 | |\n| 项目: ConversionService | |\n| 位置:\
    \ 源包 (Source Packages) | |\n| 包: conversionservervices | |\n| 从头开始创建 Web 服务 |\
    \ |\n| 从现有 Bean 创建 Web 服务 | |\n| 企业 Bean: 浏览 | |\n| 作为无状态 Bean 实现 Web 服务 |\n\n\
    ![](img/0a9d86aea6b178e4945a7a3e94449cb9_133_0.png)\n\n## JAVA 13: 分布式编程与 JAVA\
    \ EE：软件开发\n\n当我点击“下一步”时，NetBeans 会创建以下类：\n\n```java\npackage conversionservice.services;\n\
    \nimport javax.jws.WebService;\nimport javax.jws.WebMethod;\nimport javax.jws.WebParam;\n\
    \n@WebService(serviceName = \"ConversionService\")\npublic class ConversionService\
    \ {\n    @WebMethod(operationName = \"hello\")\n    public String hello(@WebParam(name\
    \ = \"name\") String txt) {\n        return \"Hello \" + txt + \"!\";\n    }\n\
    }\n```\n\n注意使用了哪些注解，NetBeans 创建了一个单一服务——直接点击“设计 (Design)”按钮就可以完成，这将为你提供一个向导，可用于生成最终的代码：\n\
    \n```java\npackage conversionservice.services;\n\nimport javax.jws.WebService;\n\
    import javax.jws.WebMethod;\nimport javax.jws.WebParam;\n\n@WebService(serviceName\
    \ = \"ConversionService\")\npublic class ConversionService {\n    @WebMethod(operationName\
    \ = \"celsiusToFahrenheit\")\n    public double celsiusToFahrenheit(@WebParam(name\
    \ = \"value\") double value) {\n        return 1.8 * value + 32;\n    }\n    @WebMethod(operationName\
    \ = \"fahrenheitToCelsius\")\n    public double fahrenheitToCelsius(@WebParam(name\
    \ = \"value\") double value) {\n        return (value - 32) / 1.8;\n    }\n}\n\
    ```\n\n使用向导最大且唯一的优势是 NetBeans 插入了正确的注解。\n\n## JAVA 13: 分布式编程与 JAVA EE：软件开发\n\n\
    当你构建项目并部署后，在 NetBeans 中选择 Web 服务：\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_135_0.png)\n\
