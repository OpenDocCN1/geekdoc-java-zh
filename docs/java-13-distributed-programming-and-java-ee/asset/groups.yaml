    \ generating costs relate to maintenance. These can be reduced dramatically thanks\
    \ to our systems for on-line condition monitoring and automation. We help make\
    \ more economical to create cleaner energy out of them.\nBy sharing our experience,\
    \ expertise, and creativity, industries can perform beyond expectations. Therefore\
    \ without the best employees who can meet the challenge!\n"
  mdcn: "\n\n## JAVA 13: 分布式编程\nJAVA EE: 软件开发\n\n在这里，现在需要在“包含实体类”（Include Entity Classes）下方添加实体类。之后，我们应该部署项目。\n\
    \n接下来，必须编写一个客户端，我从项目 ChangeAddress1 的副本开始，将其命名为 ChangeAddress5。在这里，我开发了模型类 `Address`\
    \ 并添加了类库 `AddressesRemote` 的引用。下一步，我添加了一个名为 `AddressClient` 的 RESTful 。它与上一个示例中的相应类相似，但你应该注意，已经为\
    \ XML 和 JSON 创建了方法。下面我展示了该类的一部分，但只显示我的程序需要的方法：\n\n```java\npackage changeaddress.beans;\n\
    \nimport javax.ws.rs.ClientErrorException;\nimport javax.ws.rs.client.Client;\n\
    import javax.ws.rs.client.WebTarget;\n\npublic class AddressesClient\n{\n    private\
    \ WebTarget webTarget;\n    private Client client;\n    private static final String\
    \ BASE_URI = \n        \"http://localhost:8080/AddressesREST/webresources\";\n\
    \n    public AddressesClient()\n    {\n        client = javax.ws.rs.client.ClientBuilder.newClient();\n\
    \        webTarget = client.target(BASE_URI).path(\"addressesremote\");\n    }\n\
    \n    public void create_XML(Object requestEntity) throws ClientErrorException\n\
    \    {\n        webTarget.request(javax.ws.rs.core.MediaType.APPLICATION_XML)\n\
    \            post(javax.ws.rs.client.Entity.entity(requestEntity));\n    }\n\n\
    \    public void create_JSON(Object requestEntity) throws ClientErrorException\n\
    \    {\n        webTarget.request(javax.ws.rs.core.MediaType.APPLICATION_JSON)\n\
    \            post(javax.ws.rs.client.Entity.entity(requestEntity,\n          \
    \      javax.ws.rs.core.MediaType.APPLICATION_JSON));\n    }\n\n    public <T>\
    \ T findAllXML(Class<T> responseType) throws ClientErrorException\n    {\n```\n\
    \n## JAVA 13: 分布式编程与\nJAVA EE: 软件开发\nREST Web 服务\n\n```java\nWebTarget resource\
    \ = webTarget;\nreturn resource.request(javax.ws.rs.core.MediaType.APPLICATION_XML).\n\
    get(responseType);\n```\n\n```java\npublic <T> findAll_JSON(Class<T> responseType)\n\
    throws ClientErrorException\n{\n    WebTarget resource = webTarget;\n    return\
    \ resource.request(javax.ws.rs.core.MediaType.APPLICATION_JSON);\n    get(responseType);\n\
    }\n```\n\n```java\npublic void close() {\n    client.close();\n}\n```\n\n该类与上一个示例中的相应方法相似。构造函数创建了指向由\
    \ `WebTarget` 类型对象表示的目标引用。该对象可以使用四个 HTTP 方法之一对资源执行请求。在当前示例中，使用 GET 执行请求（返回所有地址），使用\
    \ POST 创建新地址。\n\n注意 `findAll_JSON()`，它是泛型的。在这里，你必须指定方法应该返回的对象类型，这里是 `List<Address>`。由于结果是\
    \ XML，它必须被解析为 `List<Address>` 对象，这如上一个示例所示会自动完成。然而，这导致了一个问题，因为 `List<Address>`\
    \ 类型没有被标记为：\n\n```java\n@RootElement\n```\n\n因此，有必要在包装类中嵌入 `List<Address>`：\n\n\
    ```java\npackage changeaddress.beans;\n\nimport java.util.List;\nimport javax.xml.bind.annotation.*;\n\
    import addressesremote.*;\n```\n\n```java\n@RootElement(name=\"addresses\")\n\
    @XmlAccessorType(XmlAccessType.FIELD)\npublic class Addresses {\n    @XmlElement(name\
    \ = \"address\")\n    private List<Address> addresses = null;\n```\n\n```java\n\
    public Addresses()\n{\n}\npublic List<Address> getAddresses()\n{\n    return addresses;\n\
    }\n\npublic void setAddresses(List<Address> addresses)\n{\n    this.addresses\
    \ = addresses;\n}\n```\n\n有了这个类，你就可以编写完成的命名 bean，它只是对现有类的简单更新（我没有显示 get 和 set\
    \ 方法）：\n\n```java\npackage changeaddress.beans;\n\nimport java.util.List;\nimport\
    \ javax.xml.bind.annotation.*;\nimport addressesremote.*;\n```\n\n## JAVA 13:\
    \ 分布式编程与\nJAVA EE: 软件开发\nREST Web 服务\n\n![img/0a9d86aea6b178e4945a7a3e9444cb9166.png]\n\
    \n## JAVA 13: 分布式编程与\nJAVA EE: 软件开发\nREST Web 服务\n\n```java\nimport javax.inject.Named;\n\
    import javax.enterprise.context.SessionScoped;\nimport java.io.Serializable;\n\
    \n@Named(value = \"index\")\n@SessionScoped\npublic class IndexController implements\
    \ Serializable {\n    private Address person = new Address();\n    private List<Address>\
    \ persons = new ArrayList<>();\n\npublic IndexController() {\n}\n\npublic List<Address>\
    \ getPersons() {\n    try {\n        AddressesClient client = new AddressesClient();\n\
    \        Addresses wrapper = client.findAllXML(Address.class);\n        persons\
    \ = wrapper.getAddresses();\n        client.close();\n    } catch (Exception ex)\
    \ {\n        persons = new ArrayList<>();\n    }\n    return persons;\n}\n\npublic\
    \ void add() {\n    try {\n        AddressesClient client = new AddressesClient();\n\
    \        client.create_XML(person);\n        client.close();\n    } catch (Exception\
    \ ex) {\n    }\n}\n```\n\n## JAVA 13: 分布式编程与\nJAVA EE: 软件开发\nREST Web 服务\n\n###\
    \ 练习 7\n\n你需要扩展上面的示例，以便能够更改和删除地址，使用与上一个示例相同的 Web 服务。从项目 Address5 的副本开始，将其称为 Address6。\n\
    \n- 创建一个新的页面 `edit.html`，它与 `index.html` 基本相同（见下文）。\n- 你必须修改 `list.html`，使名称成为新页面的链接。打开此页面时，必须填写表单数据。\n\
    - 你需要扩展控制器 `IndexController`，以便 list.html 中的链接以及新表单中的三个按钮。\n\n![img/0a9d86aea6b178e4945a7a3e9444cb9168.png]\n\
    \n## JAVA 13: 分布式编程与\nJAVA EE: 软件开发\n安全\n\n### 安全\n\n在开发网络使用的应用程序（Web 应用、企业应用等）时，经常需要解决一个安全问题。这是我在本书以及之前的两本书中忽略的问题。基本上它关于\n\
    \n- 只有允许的用户可以使用程序或应用程序的一部分，并且所有用户不应具有相同的权限\n- 未经授权的用户无法访问在用户和服务器之间通过网络传输的数据\n\n\
    第一个问题通过用户识别和密码解决，而另一个问题通过使用加密来解决，以便无人读取网络上的数据。从原则上讲，听起来很简单，但正如媒体报道的，无论网络攻击如何，完全保护企业应用程序是不可能的，但你可以做得很多，而且通常如此。\n\
    \n![img/0a9d86aea6b178e4945a7a3e9444cb9169.png]\n\n到2020年，风能可以提供地球十分之一的电力。现在，SKF的专业知识对于世界上大部分风力涡轮机的运行至关重要。发电成本中25%与维护有关。得益于我们的在线状态监测和自动化系统，这些成本可以大幅减少。我们帮助让清洁能源变得更具效益。\n\
    \n"
