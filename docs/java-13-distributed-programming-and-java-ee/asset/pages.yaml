  md: "# JAVA 13: DISTRIBUTED PROGRAMMING AND\nJAVA EE: SOFTWARE DEVELOPMENT\n\nproblem\
    \ by defining the beans as SessionScoped. It works, it is also the easy solution,\
    \ and there is also a disadvantage to SessionScoped beans. Firstly, these live\
    \ throughout the session and for a period after the session is completed. This\
    \ means that session objects fill unnecessarily in the machine's memory. An even\
    \ bigger problem, however, is that SessionScoped beans (and, for matter, all session\
    \ objects) live longer than is needed for them, there is a risk that they will\
    \ no longer exist. The latter is actually something that can make it very difficult\
    \ to correct errors in a web application.\n\nThere is a context called conversation,\
    \ and a bean can live over several pages, but not through an entire session, which\
    \ precisely aims to solve the challenges that the session context poses. The price\
    \ is that it is the programmer who has to tell the container when a conversation\
    \ starts and when it ends. I want to show how with the ChangeAddress example,\
    \ without any reason, in addition for entering the address is divided into three\
    \ pages — in addition to showing how ConversationScoped works. I start with a\
    \ project ChangeAddress4 which is a copy of ChangeAddress1. In addition to list.xhtml\
