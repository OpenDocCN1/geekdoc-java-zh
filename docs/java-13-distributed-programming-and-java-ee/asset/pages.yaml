    # # SECURITY


    When developing applications that are used over a network (web applications, enterprice
    applications, etc.), at the same time – or very often – there is a security issue
    that needs to be solved. It is a problem that I have overlooked in this book and
    the two previous books. Basically it is about


    +   1. that only allowed users may use a program or parts of an application and
    that all users should not have the same rights

    2. that unauthorized users may not necessarily access the data sent over a network
    between users and servers


    The first issue is solved by user identification and passwords, while the other
    issue is solved by using encryption so nobody can read the data over the network.
    In principle, it sounds simple, but there is no matter what the cyber attacks,
    as ones in the press, also testifies. Perhaps it''s actually impossible to completely
    secure an enterprise application, but you can do a lot, and more often than it
    is not.


