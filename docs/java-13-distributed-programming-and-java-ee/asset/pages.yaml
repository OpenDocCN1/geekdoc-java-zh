  md: '# Design of algorithms


    I want to start with the algorithms that can be used to implement the mathematical
    functions. Most are simple, others are standard, while for others you can find
    good solutions on the Internet. The arithmetic itself is implemented using the
    class java.math.BigDecimal. It is not difficult to find algorithms for the functions
    mentioned in the analysis, but if the problem is to produce effective algorithms,
    as many of the following formulas become ineffective along the asymptotes. It
    may therefore be necessary to implement special solutions for values that are
    asymptotic.


    public BigDecimal sq(BigDecimal x)


    sq: $\mathbb{R} \to \mathbb{R}$


    The function is defined on the entire real axis and is bijective on the non-negative
    half line. The algorithm is trivial, as it is simply a simple multiplication.


    public BigDecimal sqrt(BigDecimal x) throws BigException


    sqrt: $\mathbb{R} \to \mathbb{R}$


    The function is bijective, and the reverse is the restriction of $sq$. Often,
    the function is implemented using the so-called Babylonian method (but there are
    other options) based on the following sequence:


    ```

    $x_0 \approx \sqrt{(x)}

    nx_{n+1} = \frac{1}{2}(x_n + \frac{x}{x_n})

    \lim_{x\to\infty} x_n = \sqrt{(x)}$

    ```


    The algorithm is characterized by that it fast convergence, but it depends on
    how "lucky" one is with the first estimate ($x_0$), even if you choose $x_0 =
    x$ the method is nevertheless effective.


    The method raises an exception if the argument is negative.


    public BigDecimal pow(BigDecimal x, BigDecimal y) throws Exception


    pow: $\mathbb{R} \to \mathbb{R}$'
