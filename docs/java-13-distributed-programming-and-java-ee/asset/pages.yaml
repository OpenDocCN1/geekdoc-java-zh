  md: "# JAVA 13: DISTRIBUTED PROGRAMMING AND\nJAVA EE: SOFTWARE DEVELOPMENT\n\n```\n\
    @Named(value = \"indexBean\")\n@SessionScoped\npublic class IndexBean implements\
    \ Serializable\n{\n    public String admin()\n    {\n        return \"admin/start?faces-redirect=true\"\
    ;\n    }\n\n    public String enter()\n{\n        return \"enter?faces-redirect=true\"\
    ;\n    }\n}\n```\n\nThe two action methods should do nothing but redirect to the\
    \ two pages start.xhtml and enter.xhtml that happens when you click on one of\
    \ the two buttons. A JSF page performs an action, it hits with the POST method,\
    \ and instead of performing a redirection, a forward is performed. Furthermore,\
    \ the user is not validated (it only happens when you leave a page again). To\
    \ solve the problem (the application works like the previous application), as\
    \ described above, you must force a redirection.\n\nClicking on the Logout link,\
    \ is a method logout() in a manged LogoutBean.java:\n\n```\npackage securityapp.beans;\n\
    \nimport javax.inject.Named;\nimport javax.enterprise.context.RequestScoped;\n\
    import javax.faces.context.*;\nimport javax.servlet.http.*;\n\n@Named(value =\
    \ \"logoutBean\")\n@RequestScoped\npublic class LogoutBean\n{\n    public String\
    \ logout()\n    {\n    }\n\n    public String logout(ExternalContext externalContext)\n\
    \    {\n        ExternalContext = FacesContext.getCurrentInstance().getExternalContext();\n\
    \        HttpSession session = (HttpSession) externalContext.getSession(true);\n\
    \        session.invalidate();\n        return \"login?faces-redirect=true\";\n\
    \    }\n}\n```"
