    ENTERPRISE JAVA BEANS


    # # ENTERPRISE JAVA BEANS


    Enterprise Java Beans or EJB''s are components that live on a server and enclose
    business logic, and here they can be used by other applications such as web applications
    and standalone applications. You could think of an EJB as a component that is
    developed, tested and hosted on an application server (such as Glassfish), and
    as other applications may apply. It is not quite simple to develop EJB''s and
    get them hosted on an application server, and the architecture is also not easy
    to review, but NetBeans helps as it has projects specifically aimed at developing
    EJB''s. In this chapter, I will partly demonstrate how to develop and use EJBs
    using NetBeans and explain the most important concepts.


    The advantage of EJB''s is, in addition to providing the same services to multiple
    applications, the application server addresses a variety of conditions such as
    transactions and security issues, and EJB components can thus simplify the development
    of an enterprise application. EJB''s therefore play an important role in the development
    of modern applications, including distributed applications, but it should be mentioned
    immediately that they are no longer playing the role because of web services.


    ![](img/0a9d86aea6b178e4945a7a3e94449cb9_52_0.png)


