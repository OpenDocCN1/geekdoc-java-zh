  md: "# JAVA 13: DISTRIBUTED PROGRAMMING\nJAVA EE: SOFTWARE DEVELOPMENT\n\nNote that\
    \ Create Web Service from Scratch has been selected, and the bottom check box\
    \ has been ticked. After clicking Finish, a web service has been created, where\
    \ there is primarily one difference, namely, that it is a stateless bean. The\
    \ completed service is shown below:\n\n```\npackage ejb.services;\n\nimport javax.jws.WebService;\n\
    import javax.jws.WebMethod;\nimport javax.jws.WebParam;\nimport javax.ejb.Stateless;\n\
    \n@WebService(serviceName = \"Conversions\")\n@Stateless()\npublic class Conversions\
    \ {\n\n    @WebMethod(operationName = \"celsiusToFahrenheit\")\n    public double\
    \ celsiusToFahrenheit(@WebParam(name = \"value\") double value {\n        return\
    \ 1.8 * value + 32;\n    }\n\n    @WebMethod(operationName = \"fahrenheitToCelsius\"\
    )\n    public double fahrenheitToCelsius(@WebParam(name = \"value\") double value\
    \ {\n        return (value - 32) / 1.8;\n    }\n}\n```\n\nThen the project can\
    \ be built and deployed in the usual way. The ConversionProgram project is identical\
    \ to ConversionClient, only with the difference that another web service is used,\
    \ as above, which is a web service hosted as an enterprise bean.\n\nAs the last\
    \ example, I will write a web service that uses an existing EJB, and I will use\
    \ ZipcodesEJB, which performs CRUD operations on the table zipcode in the database\
    \ data. The EJB concerned offers 4 services, and the goal is to provide these\
    \ services with a web service.\n\nThe starting point is an empty application called\
    \ ZipcodesServices. As a first step, I put a reference to the jar file ZipcodesRemote,\
    \ which is the remote interface for ZipcodesEJB. Next, I have added a web service\
    \ called ZipcodesWS to the project:"
