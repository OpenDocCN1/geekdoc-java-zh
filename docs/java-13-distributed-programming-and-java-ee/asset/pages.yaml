    # 3.4 TRANSACTIONS


    One of the major advantages of using enterprise java beans is that an EJB uses
    transactions, which generally means that the changes of a method are performed,
    if all are executed correctly, otherwise nothing is done corresponding to a rollback.
    The latter is if there is an exception. Immediately, it is not obvious how it
    works if a method is called while a transaction is in progress. Should the method
    be part of the current transaction, must the exception be suspended while creating
    a new transaction for the method call? Due to such questions, it is possible to
    configure how transactions should work. This happens with an annotation @TransactionAttribute:


    ```

    @Stateless

    public class Helloworld

    {

    @Override

    @TransactionAttribute(TransactionAttributeType.REQUIRES_NEW)

    public String hello()

    {}

    ```'
