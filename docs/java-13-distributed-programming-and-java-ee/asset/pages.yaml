    There are three variants:


    +   - Stateless, which are components where the state is not preserved between
    several calls to the component''s methods.

    - Stateful, that are components where the state is maintained throughout the life
    of the component as compared to the current application.

    - Singleton, which is a component that exists in exactly one version relative
    to an application.


    Having said that it is not easy to write EJB modules, it is not so much to write
    the individual EJB classes, as are not different from writing other classes, but
    the problems arise in connection with deployment and the use of modules from client
    programs, and thus relates to Glassfish than writing the code. Therefore, I will
    start and create an Enterprise Application project, using a single EJB module,
    as well as a web application that uses this module. The EJB module should consist
    of a single stateless bean that provides five methods (services) available to
    clients that are the web application.


