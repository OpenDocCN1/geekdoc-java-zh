    @TestMethod(operationName = \"getKing\")\npublic List<King> getKing(@PathParam(name\
    \ = \"year\") int year)\n{\n\n@TestMethod(operationName = \"getKings\")\npublic\
    \ List<King> getKings(@PathParam(name = \"yearly\") int yearly,\n    @PathParam(name\
    \ = \"year2\") int year2)\n}\n```\n\nwhere the first will will return the kings\
