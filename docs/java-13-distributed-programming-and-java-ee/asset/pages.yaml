    # 7.2 CONTAINER MANAGED AUTHENTICATION

    AND AUTHORIZATION


    I will start by showing how let the container (the Glassfish server) control users’
    access to the individual pages. This is done solely by the configuration files,
    and without changing the application’s code, as well as creating Glassfish users.


    Glassfish manages user and user rights using so-called security realms, which
    basically is a collection of users with associated security groups. A group these
    groups defines what the container will allow the user to perform. For example,
    an application may have regular users who can only perform specific tasks and
    administrators who can perform all tasks.


    Glassfish has three realms from the start, but you can create your own. The three
    predefined realms are:


    +   1. **admin-realm**, used solely for the maintenance of users for the Glassfish
    administration web application and should not be used for users of other applications

    2. **certificate**, used for client-side certificate for authentication of users

    3. **file**, that stores general user information


    ![](img/0a9d86aea6b178e4945a7a3e94449cb9_173_0.png)


    Clicking on **file realm** you will get the properties of this realm and clicking
    the **Manage Users** button will give you an overview of the users. I have created
    three that I will apply in the following:


