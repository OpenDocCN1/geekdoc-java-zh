  md: '# 8 A FINAL EXAMPLE


    As a final example, I will write a program that is a typical calculator, and thus
    a program

    can simulate a mathematical calculator. Compared to previous examples (the book

    Java 3), there must be two important differences:


    +   1. The program must now be a web application.

    2. The machine (calculator) must now support calculations with a random number

    de decimal places.


    Apart from that, the program should basically have the same functions as a typical
    (and

    relatively simple) mathematical calculator, where it is important that the program
    should

    support very large numbers.


    The aim of the program is to use some of the topics that have been addressed in
    this book,

    and especially Enterprise Java Beans. In addition, it is an example where there
    is focus

    on algorithms.


    # 8.1 ANALYSIS


    Regarding the last of the two requirements, it means that the program must work
    on data

    of the type BigDecimal.


    The program must support the following mathematical functions:


    +   1. sqr(x) which calculates the square of x, it is $x^2$

    2. sqrt(x) which calculates the square root x, it is $\sqrt{x}$

    3. pow(x,y) which calculates $x^y$

    4. root(x,y) which calculates the $y^{th}$ root of x, it is $\sqrt[y]{x}$

    5. log10(x) which calculates the 10th logarithm of $x$

    6. antilog(x) which calculates the ant logarithm of $x$ and then $10^x$

    7. log(x) which calculates the natural logarithm to $x$

    8. exp(x) which is the exponential function and then calculates $e^x$

    9. sin(x) which calculates sinus to $x$

    10. asin(x) which is the reverse function for sinus

    11. cos(x) which calculates cosines for $cos$

    12. acos(x) which is the reverse function for cos

    13. tan(x) which calculates tanger to $x$'
