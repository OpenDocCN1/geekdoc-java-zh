  md: '# FOREWORD


    This book is the thirteenth in a series of books on software development. The
    programming language is Java, and the language and its syntax and semantics fills
    obviously much, but the books have also largely focus on the process and how to
    develop good and robust applications. This book is a continuation of the subjects
    in Java 11, but with focus on the development of enterprise applications. They
    are programs that perform their work using components or services hosted on different
    computers and located on different, which communicate and coordinate their work
    over a network. Primary topics are Java EE technologies as JPA, EJB and Web Services.
    The book requires knowledge of web applications similar to what has been dealt
    with in the Java 11 and Java 12.


    As the title says this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in Java. It can be learned
    by reading about the subject and by studying sample programs, most importantly
    by yourself to do it and write your own programs from scratch. Therefore, an important
    part of the books is exercises and problems, where the reader has to write programs
    that correspond to the substance being treated in the books. All books in the
    series are built around the skeleton and will consist of text and examples and
    problems that are placed in the text where they naturally belongs. The difference
    between exercises and problems is that the exercises largely deals with repetitions
    of the substance that is presented in the text, and furthermore it is accurately
    described what to do. Problems are in more loosely described, a little bigger
    and there is rarely any clear best solution. These books are to read from start
    to finish, but the many code examples, including exercises and problems plays
    a central role, and it is important that the reader predict in detail studying
    the code to the many examples and also solves the exercises and problems or possibly
    just studying the recommended solutions.


    All books ends with one or two larger sample programs, which focus primarily is
    process and an explanation of how the program is written. On the other hand appear
    the code to a limited extent — if at all — the reader should study the finished
    program code perhaps testing the program. In addition to show the development
    of programs that are larger than the examples, which otherwise is presented, the
    aim of the concluding examples is to show program examples from varying fields
    of application.


    Most books also ends with an appendix dealing with a subject that would not be
    treated in the books. It may be issues on the installation of software or other
    topics in computer technology, which are not about software development, but where
    it is necessary to have an introductory knowledge. If the reader already is familiar
    with the subject, the current appendix can be skipped.'
