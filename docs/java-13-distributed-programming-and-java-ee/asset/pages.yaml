  md: "# JAVA 13: DISTRIBUTED PROGRAMMING\nJAVA EE: SOFTWARE DEVELOPMENT\nREST WEB\
    \ SERVICES\n\nPUT: Note that the first method is decorated with @Produces, which\
    \ indicates that the method returns XML while the other is decorated with @Consumes,\
    \ which indicates that the method interprets the content of the parameter as XML.\
    \ In this case, the last method is empty, and the first returns some XML.\n\n\
    The container must know what the resource is called and that is the purpose of\
    \ the second class:\n\n```\npackage helloapp.services;\n\nimport java.util.Set;\n\
    import javax.ws.rs.core.Application;\n\n@javax.ws.rs.Path(\"webresources\")\n\
    public class ApplicationConfig extends Application {\n\n    @Override\n    public\
    \ Set<Class<?>> getClasses() {\n        Set<Class<?>> resources = new java.util.HashSet<>();\n\
    \        addResourceClasses(resources);\n        return resources;\n    }\n\n\
    \    private void addResourceClasses(Set<Class<?>> resources) {\n        resources.add(helloapp.services.HelloResource.class);\n\
    \    }\nn\n```\n\nIt is a class inheriting Application, and the class is decorated\
    \ with @Path, which specifies a name (here it is resources) that is included in\
    \ the resource's URI. The last method adds the actual resource to a collection\
    \ (here it is a HashSet). The result of all that is, the resource's URI is\n\n\
    ```\nhttp://localhost:8080/helloapp/webresources/hello\n```\n\nIf you translate\
    \ the project and perform a deploy, the resource is ready for use. A RESTful Web\
    \ item is created and if you click on HelloResource [hello]:\n\n![](img/0a9d86aea6b178e4945a7a3e94449cb9_150_0.png)"
