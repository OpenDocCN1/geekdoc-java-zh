    It is one of the complex methods that are not actually implemented optimally.
    The argument

    is a real number and the faculty of a real number is set to 1 if the argument
    x is less than

    or equal to 0. The argument positive the factorial is defined as


    ```

    x! = \Gamma(x + 1)

    ```


    where \Gamma is the gamma function. The problem is that it is difficult to implement
    the gamma

    function with satisfactory efficiency. Typically, one use


    ```

    \Gamma(x) = exp(log(\Gamma(x))))

    ```


    Because it is relatively simple to implement exp(x) effectively, the problem is
    reduced

    to implement log(\Gamma(x)). It is also not simple, but there are several formulas
    that are an

    approximation, and one of them is:


    ```

    log(\Gamma(x)) = \frac{1}{2}log(2\pi) + (x-\frac{1}{2})log(x) - \frac{x}{2}log(xsinh(\frac{1}{x})
    + \frac{1}{810x^6})

    ```


    See for example:


    ```

    https://math.stackoverflow.com/questions/19236/

    algorithm-to-compute-gamma-function

    ```


