    The certificate must be exported to Glassfish, and first it must be converted
    to a format that Glassfish can use. This again can be done with keytool:


    ```

    # keytool -export -alias pake -keystore client_keystore.p12

    -storetype PKCS12 -storepass Volmer1234 -rfc -file signed.cer

    Certificate stored in file <signed.cer>

    ```


    The result is a file named signed.cer. The name is not important, but it is recommended
    that the name end with .cer. Glassfish has a file with the names of the Certification
    Authorities that it trusts (it includes Verisign and Thaute, and these names are
    found in the file


    glassfish/domains/domain1/config/certs


    In Order for Glassfish to use my self-signed certificate, it must know me – and
    believe me as a Certificate Authority – and I can export the file signed.cer to
    Glassfish with keytool:


    ```

