    # # WHO SHOULD READ THIS BOOK?


    This is written for anyone who wants to learn the fundamentals of 2D game programming.
    While current graphics are evolving very fast, 3D graphics are only a piece of
    the puzzle. If a programmer does not understand the game loop, input handling,
    matrix intersection, testing, collision detection, image rendering, threads, sound,
    or deployment, 3D graphics are not going to make the game playable. Even though
    3D rendering is exciting, learning the fundamentals is important for having a
    solid foundation and the tools necessary to tackle any situation.


    Although this book assumes the reader understands core programming concepts, object
    oriented software, and the Java programming language, no assumptions are made
    about previous game programming knowledge.


    You should already be familiar with the Java language, as this is not covered
    in the text.


    # # SOFTWARE AND VERSIONS


    This code has been tested on Windows 7 with the latest Java SE 6.0 and Java SE
    7.0 versions available at the time of this writing. The Eclipse Helios IDE was
    used for compiling and execution of the code. The 1.8.2 ANT version was used for
    deployment.


    The source code examples, as well as sound, image, and resource files, are available
    from:


    http://www.indiegameprogramming.com


    You can also download them from the book''s website, where you can search for
    the book by title or ISBN:


    http://www.cengageptr.com/downloads


    # # CONVENTIONS USED IN THIS BOOK


    Monospace font is used for the following:


    +   - Java classes


    +   - Java methods


    +   - Variable names


    +   - Math variables and constants


    +   - Code examples


    +   - Code snippets


    +   - XML


    +   - Command-line output'
