  md: "# UNDERSTANDING INPUT/OUTPUT STREAMS\n\nIn the land of Java, the InputStream\
    \ is the interface used to deal with many sources of data. The InputStream can\
    \ be files, arrays, network sockets, and external devices. The following lists\
    \ the different input sources that can be used to create different resources.\n\
    \n+   - Properties: InputStream, Reader\n- Images: File, InputStream, ImageInputStream,\
    \ URL\n- Audio: InputStream\n- XML: InputStream, Reader, File, InputSource\n\n\
    Although there are different kinds of classes available for reading and writing\
    \ data, the InputStream is the only one available to everyone. Even using the\
    \ Class and ClassLoader to access classpath resources uses an InputStream.\n\n\
    With all these classes depending on InputStream, it should be easy to use. However,\
    \ because of the exception-handling patterns associated with many early Java APIs,\
    \ using InputStream can be tedious and error prone.\n\nBecause the stream should\
    \ always be closed after it is used, even if there is an error, the basic pattern\
    \ is as follows:\n\n```\nInputStream = null;\ntry {\n  in = [make new stream]\n\
    \  while ([has more data]) {\n    [process data]\n  }\n} catch (IOException ex)\
    \ {\n  [handle error or rethink]\n} finally {\n  try {\n    in.close();\n  } catch\
    \ (Exception ex) {}\n}\n```\n\nNot only does creating and reading an InputStream\
    \ have exceptions that must be caught, but also closing the stream.\n\nThe read()\
    \ method returns an integer, to remember to cast it to the correct data type.\
    \ When the read() method returns -1, there is no more data available. Reading\
    \ strings uses a Reader interface, which wraps an InputStream. The pattern is\
    \ the same, except instead of returning a single byte, each readLine() method\
    \ returns a single line of text."
