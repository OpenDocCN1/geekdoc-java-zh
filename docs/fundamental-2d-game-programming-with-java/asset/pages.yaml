  md: "# HANDLING KEYBOARD INPUT\n\nIn most applications, the software doesn't need\
    \ to handle the keyboard events. Any components, such as text fields, handle the\
    \ typing and notify the software when something changes. Most computer games use\
    \ the keyboard, not for typing, but for game input. Depending on the game, there\
    \ may be typing, the keyboard buttons may also be used as direction keys and triggers.\
    \ Many computer games have different input configurations and some even allow\
    \ users to map the keys they want. Regardless of how the game uses the keyboard\
    \ (and it could be an entirely new way), the usual method of listening to keyboard\
    \ events does not fit the game loop program design.\n\nSwing components allow\
    \ listeners to be added that implemented the KeyError interface:\n\n+   - void\
    \ keyTyped(KeyEvent e)—Key was pressed\n- void keyPressed(KeyEvent e)—Key was\
    \ pressed\n- void keyReleased(KeyEvent e)—Key was released\n\nWhen a key is pressed,\
    \ the keyPressed() method is called. As expected, the keyReleased() method is\
    \ called when the same key is released. The keyTyped() method is called only after\
    \ a key is pressed and released. The action keys and modifier keys, such as Shift\
    \ or the arrow keys, do not generate a keyTyped() event. This event will be explored\
    \ in Chapter 11, which covers text.\n\nThe problem is, the keyboard is a piece\
    \ of hardware maintained by the operating system. The operating system, and not\
    \ the software, generate and dispatch keyboard events to whatever applications\
    \ have focus. There is nothing stopping the user from switching from a game window\
    \ to a web browser and checking email. Because of this, all the keyboard events\
    \ arrive on a different thread and need to be made available to the game loop.\n\
    \nMost games follow some kind of structured loop:\n\n```\nwhile(true) {\n    processInput();\n\
    \    updateObjects();\n    // other stuff...\n    renderScene();\n}\n```\n\nIf\
    \ the input was outside of the game loop, the state could change at any time.\
    \ Also, multiple keys may be down simultaneously, so handling each event by itself\
    \ doesn't let the user combine keys. To simplify input processing, the keyboard\
    \ events are saved and made available to the game loop."
