  md: "# Chapter 2 Input\n\nWhen the mouse input is polled, this value is copied over\
    \ and made available to the game loop. The current mouse position is available\
    \ with the following method:\n\n```\npublic Point SimpleMouseInput.getPosition()\n\
    ```\n\nLastly, to monitor the input from the mouse scroll wheel, the input class\
    \ implements MouseWheelListener:\n\n```\nmouseWheelMoved(MouseEvent e)\n```\n\n\
    The following method returns the clicks of the mouse wheel. If the number is negative,\
