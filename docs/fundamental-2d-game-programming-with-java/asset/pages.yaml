    \ the path if the path is absolute.\n\n```\nClassLoader - \"path/to/file.txt\"\
    \nClass - \"/path/to/file.txt\"\n```\n\nIf the / left off the beginning path for\
    \ the Class, the resource will not be found because it will look relative to itself\
    \ instead of at the root directory. There is another problem when Class is used.\
    \ The normal way to get the class object is to use the getClass() method. This\
    \ can work just fine:\n\n```\ngetClass().getResourceAsStream(\"resource\");\n\
    ```\n\nHowever, the problem with the getClass() method is that it will always\
    \ return the deepest child, even in the parent class. If the subclass is created\
    \ in a different package, the resource loaded in the parent will no longer be\
    \ found. To prevent this from happening, the static class should be used when\
    \ relative resource loading is used. This will work no matter what subclasses\
    \ are created.\n\n```\nClassName.class.getResourceAsStream(\"resource\");\n```\n\
    \nThe ClasspathResources example, located in the javames.files package, demonstrates\
