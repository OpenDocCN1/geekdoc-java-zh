  md: '# 416 Chapter 13 Sound


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_432_0.png)


    Figure 13.6

    Sound Player Example.

    © 2014 Timothy Wright.


    These three events—one-shot, loop, and games—for both small and large data files,
    provide many sounds needed for computer games. The SoundPlayerExample code, seen
    in Figure13.6 and located in the javgames.sound package, demonstrates using the
    new classes to add sound to the game loop.


    The initialize() method loads two sounds: a weapon blast and a rain sound. The
    readBytes() method extracts the raw sound bytes from the file. The loadWaveFile()
    method creates all of the event objects. For short clips, the events use a BlockingClip.
    For large data, a BlockingClip can be used. This example uses a small sound with
    both types of sounds for testing. The shutdownClips() method stops each sound
    before returning.


    The processInput() method handles the keypresses as always. The F1 and F2 keys
    load the two different sounds. The number 1 starts the one-shot clip and the 2
    keys stops the one-shot clip. The 3 keys start the clip loop, and 4 stops it.
    The 5 keys restart the clip. The 6, 7, 8, 9, and 0 keys do the same thing with
    a data line stream. The render() method displays the usual instructions.


    And now...making a limited appearance, it''s the terminate() method (I was beginning
    to think this method would never be needed). This method shuts down all the event
    threads when the program is shut down.


    ```

    package javgames.sound;

    import java.awt.Graphics;

    ```'
