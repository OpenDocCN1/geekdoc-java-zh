  md: "# Creating a Polygon Wrapper Class\n\nThe initialize() method creates all the\
    \ objects and sets the mouse to relative movements the object can be wrapped around\
    \ the screen without the mouse leaving the screen. The processInput() method moves\
    \ the square by using the mouse position if absolute position is used and by adding\
    \ the relative movement to the current position if relative movement is being\
    \ used. This method also toggles relative movement with the spacer.\n\nThe transform()\
    \ method creates a copy of the object and transforms it by the given matrix. The\
    \ updateObjects() method clears the render list, wraps and transforms the square,\
    \ and then uses the PolygonWrapper to add any copies of the object to the render\
    \ list. The render() method draws all the objects in the render list to the screen.\n\
    \n```\npackage javames.prototype;\n\nimport java.awt.*;\nimport java.awt.event.KeyEvent;\n\
    import java.util.ArrayList;\nimport javgames.util.*;\n```\n\n```\npublic class\
