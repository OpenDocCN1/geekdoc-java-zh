  md: '# OPTIMIZING YOUR TESTS


    It is important to always look at the shapes and the tests to see if there are
    ways to simplify the math. For example, if AABB shapes are used, some information
    can be hard-coded into the tests. The normalized vectors for AABBs are always
    of length 1 and always on the x- and y-axis. See Figure 7.25.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_194_0.png)


    Figure 7.25

    Optimizations.

    © 2014 Timothy Wright.


    Any dot product using these normal vectors will be:


    ```

    $P * n_1 = P_x * (1) + P_y * (0) = P_x$

    $P * n_2 = P_x * (0) + P_y * (1) = P_y$

    ```


    In this case, the x and y values from the point P can be used without calculating
    the normal vectors. Optimizations like this can simplify the code, speed up calculations,
    and keep bugs from creeping in. Always be on the lookout for situations like this.


    If the separating axis test is used with AABB rectangles, then the perpendicular
    normals turn out to be the x-axis and y-axis. The dot product between these normals
    and the sides of the rectangles reduces to the minimum and maximum (x,y) coordinates.
    See Figure 7.26.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_194_1.png)


    Figure 7.26

    AABB Separating Axis.

    © 2014 Timothy Wright.'
