  md: '# Finding a Circle-Line Intersection


    $|O + td - C| = r$

    $\sqrt{(O + td - C)^2} = r$

    $(0 + td - C)^2 - r^2 = 0$

    $[td * (O - C)] * [td + (O - C)] - r^2 = 0$

    $t^2(d * d) + 2t[d * (O - C)] + (O - C) * (O - C) - r^2 = 0$


