  md: "```\ndefault:\n[echo] Hello World!\nBUILD SUCCESSFUL\nTotal time: 0 seconds\n\
    ```\n\n# LEARNING COMMON ANT TASKS\n\nANT has many built-in tags that you can\
    \ use to perform most of the tasks needed to build and package an application.\n\
    \nThe `<echo>` tag prints out information to the console.\n\n```\n<echo>This prints\
    \ out to the console</echo>\n```\n\nTo create directories, use the `<mkdir>` tag.\
    \ The `<delete>` tag will remove directories. Notice how `$(basedir)` syntax can\
    \ be used inside attribute values.\n\n```\n<delete dir=\"${basedir}/lib/\">\n\
    <mkdir dir=\"${basedir}/lib/\">\n<delete dir=\"${basedir}/bin/\">\n<mkdir dir=\"\
    ${basedir}/bin/\">\n```\n\nThe `<copy>` tag can be used to copy and rename files,\
    \ and copy entire directories. A single file copy and rename is as follows:\n\n\
    ```\n<copy file=\"../res/myfile.txt\" tofile=\"../lib/mycopy.txt\">\n```\n\nThe\
    \ following tag copies a file to a different directory:\n\n```\n<copy file=\"\
    ../res/myfile.txt\" todir=\"../lib/some/other/dir/\">\n```\n\nTo copy an entire\
    \ directory, use the following:\n\n```\n<copy dir=\"../lib/new/dir\">\n<fileset\
    \ dir=\"res\">\n  <exclude name=\"**/*.java />\n</fileset>\n```\n\nTo exclude\
    \ some files from the copy, use the following:\n\n```\n<copy dir=\"../lib/new/dir\"\
    >\n<fileset dir=\"res\">\n  <exclude name=\"**/*.java />\n</fileset>\n```\n\n\
    Notice the `**/*.java` syntax. The two stars ** tell ANT to search all directories\
    \ and sub-directories."
