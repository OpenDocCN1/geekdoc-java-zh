  md: '# Chapter 10 Images


    The next property that can affect the rendered image is the interpolation algorithm.
    These algorithms control how the image''s colors are interpolated when the image
    is rotated or scaled. There are three main interpolation methods used by Java:


    +   - Nearest neighbor—Finds the closest value and uses it, without considering
    any of the other surrounding values.


    +   - Bilinear—Similar to the interpolation in the color interpolation code example.


    +   - Bicubic—Similar to the bilinear example, but uses 16 neighbor values instead
    of the four used in the bicubic method.


    The nearest neighbor method is the fastest, while the bicubic produces the best
    quality.


    ```

    Key: RenderingHints.KEY_INTERPOLATION

    Nearest Neighbor: RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR

    Bilinear: RenderingHints.VALUE_INTERPOLATION_BILINEAR

    Bicubic: RenderingHints.VALUE_INTERPOLATION_BICUBIC

    ```


    These properties, combined with the different methods of rendering the image to
    the screen, produce results from really good to really bad, and really fast to
    slow.


    Three methods for rendering the image are examined: Affine Transform, Affine Transform
    Op, and Texture Paint. Regardless of the method used, all will use AffineTransform
    as a starting point.


    # Note


    > Remember that the AffineTransform is a column major matrix representation, so
    the matrix concatenation is from left to right. Review the section on row major
    versus column matrices in Chapter 3, "Transformations," a refresher.


    ```

    Final = 4I * 3K * 2L;

    ```


