  md: "# Chapter 4 Time and Space\n\n![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_108_0.png)\n\
    \n**Figure 4.1**\nTimed Movement.\n© 2014 Timothy Wright.\n\nIn order to tune\
    \ parameters and keep the game from being too easy or too difficult, objects need\
    \ to move at consistent speeds, regardless of the computer processor speed. At\
    \ some point, a computer will be too old and too slow, but for every other computer,\
    \ speeds will change. If enough other applications are running, a computer that\
    \ seems fast one day can be slow the next.\n\nThe solution is to calculate the\
    \ elapsed time between frames and use that value to scale the updates.\n\n```\n\
    last_ns = last tick count\\curr_ns = current tick count\nelapsed_time_ns = curr_ns\
    \ - last_ns\nelapsed_seconds = elapsed_time_ns / 1.0E9\n```\n\nNotice that 1 second\
    \ equals 1.0E9 nanoseconds. Dividing the elapsed time by the number of nanoseconds\
    \ per second produces the elapsed time per second. Originally, my code used milliseconds,\
    \ but my processor was so fast that there wasn't enough precision, and nothing\
    \ moved. Although it may work on a slower computer, stick with the nanoseconds.\n\
    \nThe run() method has been updated to calculate the elapsed time:\n\n```\npublic\
