  md: '# CHAPTER 18


    # CONCLUSION


    That was a lot of information to cover, and it doesn’t even scratch the surface
    of game programming today. This is one of the reasons why game programming appeals
    to so many people. Much like the Wild West, developers are on the outskirts, blazing
    trails, continuing to push the boundaries between movies, fiction, games, and
    interactive media. With all the different platforms available, indie game resources,
    websites, competitions, and communities, as well as the success of mobile development,
    crowd-source funding, self-publishing, and ability for a single person to make
    an impact, the industry has not been this exciting since the late 80s, when anything
    was possible.


    Many aspects of game programming were not covered in this text. From third-party
    tools, 3D graphics, mobile development, multiplayer network games, artificial
    intelligence, and game design—the topics of study for games continues to grow
    at an exciting rate.


    It is important to remember, while you develop your own games, the technology
    aspect (the coding) is only part of the puzzle. There is an art to making a game
    “fun.” Game programming is hard. Hopefully, the given amount of detail in this
    book, you have lost any assumptions that making games is easy. But all the coding
    and math in the world is not enough to make a game fun to play. Keep that in mind
    while you craft the next game. It takes a lot of work.


    All the code examples in the test serve as a method for exploring different situations
    that may come up during your travels. The utility library gives you the necessary
    tools to start making your own programs, proof-of-concept applications, and prototype
    games. Even if you plan on targeting some other platforms or languages, these
    tools allow for quick prototype experiments.'
