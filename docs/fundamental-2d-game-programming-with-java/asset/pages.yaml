    +   - SourceDataLine = OutputStream

    - TargetDataLine = InputStream


    The good news is that the SourceDataLine has only a write() method and the TargetDataLine
    has only a read() method, so it isn''t possible to use them incorrectly. Be just
    aware that the names don''t make sense. The Clip class also seems out of place.
    While both data lines stream to or from other lines, a Clip is really a wrapper
    around a SourceDataLine (output) for small sound files that fit completely into
    memory. So, a Clip object should wrap a SourceDataLine, not one, that is the API
    is organized.


