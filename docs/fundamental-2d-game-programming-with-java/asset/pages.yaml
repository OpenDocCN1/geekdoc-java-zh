  md: '![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_80_0.png)


    **Figure 3.4** Cartesian to Polar Conversion.

    © 2014 Timothy Wright.


    The distance, as seen in Figure 3.4, can be seen as the hypotenuse of the triangle,
    and can be found using the Pythagorean theorem:


    $$r^2 = a^2 + b^2$$

    $$r = \sqrt{a^2 + b^2}$$


    The angle can be found using the tangent function:


    $$\theta = \tan \frac{y}{x}$$


    Converting back from the polar coordinate to the (x,y) pair is also easy:


    $$$x = r \cos \theta$$

    $$y = r \sin \theta$$


    It is the previous definition that can be used to derive the rotation equation
    shown earlier. Rotating from the starting angle some number of radians is the
    same as adding the desired additional rotation angle to the starting angle. In
    other words, to rotate a point some number of radians, the equation can be expressed
    as follows:


    $$$x'' = r \cos (\theta + \varphi)$$

    $$y'' = r \sin (\theta + \varphi)$$'
