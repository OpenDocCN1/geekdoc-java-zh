- img_proc: true
  md: 'The previous methods construct a color with the given red, green, blue, and
    optional alpha value, if the alpha value is not supplied, it is set to 1.0f, which
    represents a completely opaque value (no transparency).


    There are also constructors using integer values from 0–255. The 0–255 values
    represent one of the four bytes available to represent the color. These methods
    construct a color the same as the floating-point versions.


    ```

    Color(int r, int g, int b)

    Color(int r, int g, int b, int a)

    ```


    Another constructor takes a single value. This single value contains the (r, g,
    b, a) components of each color component or-ed together into a single value.


    ```

    Color(int rgba)

    ```


    The alpha value is defaulted to 255 (0xFF in hexadecimal representation). The
    color is constructed by shifting each integer value to the correct position.


    ```

    int rgba = 0xFF << 24 | r << 16 | g << 8 | b;

    ```


    Another way to think of this is the following:


    ```

    0xAARRGGGB

    ```


    where each pair of letters represents that’s corresponding byte.


    ```

    Color(int rgba, boolean hasAlpha )

    ```


    This constructor allows a different alpha value to be used to produce transparency.


    # EXPLORING DIFFERENT IMAGE TYPES


    Understanding how Java represents color is only part of the puzzle. When a color
    is constructed, and is drawn onto an image with a Graphics object, it is the color
    format of the destination image that ultimately determines the color format written
    to the image.


    The BufferedImage class supports a wide variety of image types. The following
    list briefly the different image formats supported by the BufferedImage class.


    +   * TYPE_BYTE_BINARY—1-, 2-, or 4-bit image with an IndexColorModel used to
    select the appropriate color values.


    +   * TYPE_BYTE_GRAY—Each color is represented as a single byte from 0 (black)
    to 255 (white).'
