  md: '# USING THE ALPHA COMPOSITE RULES


    In the previous example, the transparent image was drawn on top and the background
    was visible underneath. But that is not the only option. When the pixels in the
    source image and destination image have some transparency, there are many ways
    to blend them. The AlphaComposite contains many rules.


    # TIP


    +   The Java Docs (see Class AlphaComposite, 2013 at http://docs.oracle.com/javase/7/docs/api/java/awt/AlphaComposite.html)
    do a great job of explaining the math involved.

    TheCompositing Digital Images" paper goes into even greater detail (see T. Porter
    and T. Duff, "Compositing Digital Images," SIGGRAPH, 1984, pp. 253–259; http://keith.com/-keithpor/porterduff
    /ip253-porter.pdf).


    The different blending operations are as follows:


    +   * SRC--Source is copied to the destination.

    * DEST--The destination is unchanged.

    * SRC_IN--Only the source inside the destination is copied.

    * DEST_IN--Only the destination inside the source is copied.

    * SRC_OUT--The destination is replaced only by the outside source.

    * DEST_OUT--Only the outside portion of the destination is copied.

    * SRC_OVER--The source is copied over the destination.

    * DEST_OVER--The destination is copied over the source.

    * SRC_ATOP--The source inside the destination is copied onto the destination.

    * DEST_ATOP--The destination inside the source is copied over the source.

    * XOR--The parts of the source and destination that are outside each other are
    copied.

    * CLEAR--The color and alpha of the destination are cleared.


    Not only does each source and destination image have an alpha value, Java adds
    an extra alpha composite that is applied to the source alpha.

    One of the tricky things is understanding that applying an AlphaComposite rule
    to a shape drawn with a graphics objects is not the same as drawing an entire
    image. When shapes are used, only the pixels inside the shape follow the composite
    rule, while images use the entire area.'
