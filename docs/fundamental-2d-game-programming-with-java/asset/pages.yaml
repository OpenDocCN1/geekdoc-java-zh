  md: '# Chapter 7 Intersection Testing


    To test if shapes overlap, do the following: for each line segment in both shapes,
    create a perpendicular normal vector, and project all the points onto the normal
    using the dot product. See Figure 7.17.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_184_0.png)


    Figure 7.17 Projection Lines.

    © 2014 Timothy Wright.


    Once the points are projected onto the perpendicular normal, if the projections
    overlap, then the polygons overlap. If none of the projections contains any overlapping
    areas, then there is no overlap. See Figure 7.18.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_184_1.png)


    Figure 7.18 Overlapping Projections.

    © 2014 Timothy Wright.


    Also, as shown in the following examples, if the object being projected is symmetrical,
    then the radius of each object can be compared to the distance between the two
    object centers. This test is just like testing for overlapping circles. This concept
    is shown in Figure 7.19.'
