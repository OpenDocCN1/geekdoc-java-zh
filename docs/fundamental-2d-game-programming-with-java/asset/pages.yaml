  md: '# CHAPTER 14


    # DEPLOYMENT WITH ANT


    Although the goal of this book is to provide the tools to make games from scratch
    without any third-party libraries, using the command line to build and deploy
    your game is just nuts. It would be nice to be able to do these things from scratch,
    but I''m not going to expect anyone to do that.


    ANT stands for *Another Neat Tool*, and is used to provide platform-independent
    build script processing. The build scripts are written in XML, while ANT is easily
    extendable, most of the tasks you''ll need are already provided.


    Using a build script is important, because it is very time consuming to package
    a game into an easy-to-run format. As a game increases in size, it becomes hard
    to remember all the steps necessary to package it. Build scripts not document
    all the steps necessary to package software, but they enable the game to build
    on any platform.


    # INSTALLING THE ANT SOFTWARE


    Regardless of the operating system, there are a few things to keep in mind when
    installing ANT. Downloading the required files from http://ant.apache.org/ is
    easy, and the downloaded files do not require any installation program to run.
    However, it is necessary to set the following environment variables:


    ```

    ANT_HOME=FOLDER_THAT_CONTAINS_BIN_AND_LIB

    JAVA_HOME=JDK_HOME_FOLDER

    Path=%Path%;%ANT_HOME\bin

    ```


    These variables are what I use on my Windows 7 machine. If you are running a flavor
    of Linux, it will depend on the flavor as to how these variables are set. Adding'
