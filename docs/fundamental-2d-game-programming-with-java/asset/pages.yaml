  md: 'There are also problems when using the more accurate method that updates the
    point position after a collision. If the reflection happens in a corner, the new
    position can jump over lines that should cause collisions. This is shown in Figure
    15.30.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_502_0.png)


    Figure 15.30

    Correct Corner Error.

    © 2014 Timothy Wright.


    Every time a collision is found, the new reflected vector must be checked for
    collision with the entire polygon. While most items are not moving fast enough
    for this to be a problem, it can cause a lot of checks around corners.


    The second issue with just leaving the point in its original position also can
    happen with corners, but involves multiple collisions.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_502_1.png)


    Figure 15.31

    Clockwise/Counterclockwise Testing.

    © 2014 Timothy Wright.


    As seen in Figure 15.31, there are two different collisions. If the polygon sides
    are checked clockwise or counterclockwise, the first collision point will change.
    Not only does each collision cause more collision checks, all collisions must
    check for multiple collisions, measure the distance to each collision, and only
    use the closest one.'
