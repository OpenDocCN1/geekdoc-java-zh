  md: "# WORKING WITH SOUND FILES\n\nThe sound API handles a few file formats: *.wav,\
    \ *.aiff, and *.au. Other popular formats are not supported without third-party\
    \ software.\n\nA sound file has a number of attributes that are important. Each\
    \ sample, frame, is the sound at that specific point in time. Sound files have\
    \ a frame rate, or sample rate, measured in hertz. For example, a sample rate\
    \ of 44,100Hz has 44,100 samples per second. Another important attribute is bits-per.sample.\
    \ An 8-bit sound file stores the frame as eight bits of data, or one byte, whereas\
    \ a 16-bit sound file stores the frame as two bytes. The number of channels is\
    \ also important. There is one sample of each channel in every frame. That means\
    \ that a 16-bit sound with two channels (stereo) has 16 bits + 16 bits, or 32\
    \ bits of data per frame.\n\n| bits per frame / number of channels |\n| frame\
    \ size in bytes = 8 |\n\nThe format of data and calculating the number of bytes\
    \ for each frame is important later, when buffer sizes for streaming data need\
    \ to be created. For now, just be aware that all these attributes will change\
    \ for every different type of sound file.\n\nTo play an audio file, you need an\
    \ AudioInputStream. The problem with these stream objects is, like InputStream\
    \ objects, they can be used only once. In order to use sounds over and for a game,\
    \ the raw sound bytes need to be extracted from the file. They can then be wrapped\
    \ in a ByteArrayInputStream and create an AudioInputStream without streaming the\
    \ data from an InputStream each time the sound is played.\n\n```\nsoundFile =\n\
