  md: '# CHAPTER 12


    # THREADS


    Threads can add complexity to software. They are very complicated and easy to
    get wrong. Bugs, deadlocks, and race conditions are difficult to find, and the
    simple act of logging or stepping through the code can change the timing enough
    so the bugs no longer happen. It has been said that threads can solve any problem
    except too many threads. Although I would prefer to never need them, because they
    are so complex, there are some situations where threads are the best solution.


    Tip


    > Deadlocks can occur when two parts of the program are waiting for the other
    to finish. For example, if thread A is waiting for thread B to finish a task,
    but thread B is waiting for A to finish a task, both threads will wait forever.


    > Race condition occurs when two threads are updating a resource at the same time.
    If that resource is not protected that only one thread can have access at a time,
    both threads will try to update the variable simultaneously. These two threads
    are racing to update the data, and depending on which one gets first, the result
    can produce bugs that are very hard to find.


    There is no way to teach everything you need to understand threads in a single
    chapter. Entire books exist on the subject and some of these don''t even cover
    everything. So, if you have never done any thread programming, check out the resources
    at the end of the chapter.


    Since the very first chapter, you have been using threads to create a custom game
    loop that runs apart from Swing''s event dispatch thread. However, there are many
    classes available in the language, which makes multithreaded programming easier.'
