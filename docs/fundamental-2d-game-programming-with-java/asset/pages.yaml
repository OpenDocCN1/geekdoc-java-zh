  md: 'Given any two points, such as Figure 10.4, any $x$ value on the line corresponds
    to a $y$ value, as shown in Figure 10.5.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_284_0.png)


    **Figure 10.5**nJust a Ratio.

    © 2014 Timothy Wright.


    Solving for $y$ using this ratio produces the following:


    ```

    $$\frac{y - y_0}{x - x_0} = \frac{y_1 - y_0}{x_1 - x_0}$

    $$y = y_0 + (x - x_0)\frac{y_1 - y_0}{x_1 - x_0}$$

    ```


    If you make $x_0 = 0$ and $x_1 = 1$:


    ```

    $$$y = y_0 + (x - 0)(y_1 - y_0/1 - 0)$$n$$y = y_0 + x(y_1 - y_0/1)$$n$$y = y_0
    + x(y_1 - y_0)$$

    ```


    This is also known as the *Parametric Line* equation:


    ```

    $$P = P_0 + t(P_1 - P_0)$$

    ```


    This makes sense, because this equation interpolates the point along a line from
    $P_0$ to $P_1$.


    It is more complicated to blend colors, however. Given a starting and ending color,
    along with the distance in pixels between the two points, the colors can be blended,
    but each color component must be blended separately and combined at each stage
    to create that specific color. For example, blending from red to green, each component
    must be interpolated.'
