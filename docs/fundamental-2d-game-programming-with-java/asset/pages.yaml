    \ tag runs after the common one.\n\n```\n<project name=\"custom\">\n  <import\
    \ file=\"common.xml\"/>\n  <target name=\"clean\" depends=\"common.clean\">\n\
    \    <echo>Runs after default</echo>\n  </target>\n</project>\n```\n\nThis example\
    \ overrides the clean tag, but since it depends on the common.clean target, the\
    \ common clean will run after the default target.\n\nThese three options make\
    \ it possible to extend a script any number of ways.\n\n+   - Replace a target—Create\
    \ a new target with the same name.\n- Custom after default—Use the depends=\"\
    projectname.target\" syntax.\n- Custom before default—Override the project-target\
    \ tag.\n\nOverriding properties is not possible with ANT, so a simple trick is\
