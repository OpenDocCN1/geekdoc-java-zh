  md: '# CHAPTER 10


    # IMAGES


    Java has a variety of methods for creating images. Some of the more common are
    ImageIcon, BufferedImage, and VolatileImage. There are other formats and other
    classes, but for the purposes of this book, BufferedImage and VolatileImage are
    all that are covered. Also, because the language has been around a long time and
    works on multiple operating systems, some of the image formats are only available
    for backward compatibility, and should not be used for new development. Even they
    are not all needed, so it is good to be familiar with all the different options.


    # LEARNING ABOUT COLORS IN JAVA


    Before understanding how Java represents colors. Colors in Java consist of red,
    green, and blue components, with an optional alpha component that is used for
    transparency. Colors can be created using floating-point values from 0.0 to 1.0f,
    where 0.0 is no color at all, Each color, regardless of the method used to create
    it, consists of a single value, with red, green, and blue values presented as
    a certain number of bits. Together, the bits of each color are combined to form
    a single value of 32 bits. But this value is only the representation of the color
    before it is drawn to an image. Ultimately, it is the format of the destination
    image that determines the color. These different formats are covered later in
    the chapter.


    ```

    Color(float r, float g, float b)

    Color(float r, float g, float b, float a)

    ```


