    \    public Sprite(BufferedImage image, Vector2f topLeft, Vector2f bottomRight)\
    \ {\n        this.image = image;\n        this.topLeft = topLeft;\n        this.bottomRight\
    \ = bottomRight;\n    }\n\n    public void render(Graphics2D g, Matrix3x3f view)\
