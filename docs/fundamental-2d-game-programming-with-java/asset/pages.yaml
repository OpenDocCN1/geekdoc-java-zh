    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_117_0.png)


    **Figure 4.6**

    Screen Mapping Algorithm.

    © 2014 Timothy Wright.


    The following code calculates the viewport matrix that''s used to transform the
    world coordinates to screen coordinates. Notice in this example that the scale
    and translate values are width / 2 and height / 2. This is only because the (-1,1)
    world coordinates have a width and height of two. If the world area was 5 × 5,
    for example, then the scale values would be divided by 5, but the translate values
    are always divided by 2 and the center of the world coordinates is located at
    (0,0).


    ```

