  md: '# Using the Line-Line Overlap Method


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_185_0.png)


    **Figure 7.19**

    Rectangle Overlap.


    © 2014 Timothy Wright.


    The distance (**d**) above and the sum of ($r_1$) and ($r_2$) are used to determine
    if the objects overlap. If any one of the tests fails, then the objects do not
    overlap. If no axis has a separation between objects, then they intersect, provided
    the objects do not curve about each other. One good thing about this method is
    that it works in more than two dimensions. In the previous illustration, the only
    axis that does not have an overlap is ($n_3$).


    # USING THE LINE-LINE OVERLAP METHOD


    The center of each line can be found using the midpoint formula:


    $midpt = \frac{P_0 - P_1}{2}$


    Using the center of each line, the distance to each endpoint is the radius of
    the line. That same radius, when normalized to a length of one, is the axis used
    for the projection. Because the radius of each line, when projected onto itself,
    is always zero, only the radius of the other line is compared to the projected
    center distance. See Figure 7.20.'
