  md: '# CHAPTER 7


    # INTERSECTION TESTING


    It won''t be much of a game if objects fly about the screen but never interact
    with each other. Regardless of the kind of game, even if it is just to check whether
    the mouse is hovering over something, at some point intersection testing and collision
    detection will be necessary. The problem is that these topics are complicated.
    Entire to of algorithms and math can be found on many shelves and people are still
    trying to find ways to improve on the algorithms. Most people assume that the
    huge 3D sandbox-box games are full of complicated ideas, but that simple (looking)
    2D games are easy. After this chapter, it should be obvious that looks can be
    deceiving.


    # POINT IN POLYGON TESTING


    In order to determine if the mouse pointer is inside an object, two operations
    are needed. First, it is necessary to convert the mouse position in screen coordinates
    into world coordinates. This code was covered in Chapter 5, "Simple Game Framework."
    Second, the objects need to be tested to see if the mouse position in world coordinates
    is inside the object. Testing if a point is inside a polygon is useful for a variety
    of situations in computer games.


    An algorithm for determining if a point is inside a polygon is easy to understand,
    but there are lots of concepts that are not obvious at first. The test itself
    is easy to explain, but hard to implement. You take the point to be tested and
    extend a ray along the x-axis. Count every time the ray crosses the polygon. If
    it crosses an even number of times, it is outside. If it crosses an odd number
    of times, it is inside. See Figure 7.1.'
