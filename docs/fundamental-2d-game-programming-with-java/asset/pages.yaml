    \nFigure 6.6\nLength of Vector.\n© 2014 Timothy Wright.\n\nSingle lines are used\
    \ for the absolute value |a|. Double lines are used for the length of a vector\
    \ ||a|.\n\nIf $x > y$ then $x^2 > y^2$\n\n```\npublic float lenSq() {\n    return\
    \ x*x+y*y;\n}\n```\n\nBecause the square root operation can take many computer\
    \ cycles, sometimes it is easier to just use the squared length value in comparisons.\n\
    \n# NORM()\n\n```\npublic Vector2f norm() {\n    return div(len());\n}\n```\n\n\
    The norm() method returns a normalized vector that has a length of one, as shown\
