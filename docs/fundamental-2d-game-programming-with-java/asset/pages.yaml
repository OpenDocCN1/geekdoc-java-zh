  md: '# USING THE RECTANGLE-RECTANGLE OVERLAP METHOD


    To test for overlapping rectangles, the same method is used. The center, width,
    height, and two axes need to be computed for each rectangle. See Figure 7.22.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_189_0.png)


    Figure 7.22 Rectangle Overlap Calculations.

    © 2014 Timothy Wright.


    To project the radius onto an axis, a single vector to the corner cannot be used,
    because the rotation can cause the projection to be incorrect. See Figure 7.23.
    You must always project the width and height separately in order to project the
    correct radius.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_189_1.png)


    Figure 7.23 Rectangle Radius Projection.

    © 2014 Timothy Wright.


    The Rect0Overlap, as shown in Figure 7.24 and located in the javagames.intersection
    package, holds the four points of a base rectangle that is copied for each of
    the two rectangles tested in the example. Each rectangle testing for overlap has
    an array of points, a position, and a rotation in radians. The intersection variable
    holds the state of separating axis test.'
