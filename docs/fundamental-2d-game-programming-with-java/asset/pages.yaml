  md: '# Using Polar Coordinates 65


    Trigonometry to the rescue:


    ```

    $$\sin(\theta + \varphi) = \sin \theta \cos \varphi + \cos \theta \sin \varphi$$

    $\cos(\theta + \varphi) = \cos \theta \cos \varphi - \sin \theta \sin \varphi$$

    ```


    Replacing the previous equation with this new representation gives:


    ```

    $x'' = r(\cos \theta \cos \varphi - \sin \theta \sin \varphi)$$n$$y'' = r(\sin
    \theta \cos \varphi + \cos \theta \sin \varphi)$$

    ```


    Distributing the $r$ values gives:


    ```

    $x'' = r \cos \theta \cos \varphi - r \sin \theta \sin \varphi$$

    $$y'' = r \sin \theta \cos \varphi + r \cos \theta \sin \varphi$$

    ```


    Remembering the following:


    ```

    $x = r \cos \theta$$

    $$y = r \sin \theta$$

    ```


    You can substitute the original $x$ and $y$ values, leaving the following:


    ```

    $x'' = x \cos \varphi - y \sin \varphi$$

    $$y'' = y \cos \varphi - x \sin \varphi$$

    ```


    This is the equation presented earlier for rotation of a $Vector2f$ class.


    The `PolarCoordinateExample`, located in the `javagames.transform` package and
    shown in Figure 3.5, converts from a Cartesian coordinate to a polar coordinate
    and back again. The `coord` variable holds the screen position where the mouse
    is located, offset by the center of the screen.'
