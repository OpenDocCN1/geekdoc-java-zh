  md: "# Understanding Java Fonts\n\nFontMetrics fm = g.getFontMetrics();\n\nBecause\
    \ some fonts have a different width for each letter, you need the string value\
    \ to determine the width.\n\n```\nint width = fm.stringWidth(str);\n```\n\nNow\
    \ that the width of the string is available, the next step is to draw the text\
    \ so that the upper-left corner is not placed at the baseline, but remains where\
    \ the upper-left corner. Because the starting point is drawn at the baseline,\
    \ adding the ascent, which is the text rises from the y coordinate, places the\
    \ text in the correct position.\n\n```\ng.drawString(str, x, y + fm.getAscent());\n\
    ```\n\nA line can be drawn using the upper-left position because the text is shifted\
    \ by the ascent value. All that is to calculate the height of the font.\n\n```\n\
    int height = fm.getDescent() + fm.getLeading();\n```\n\nWith the upper-left position,\
    \ the height, the width, and the text drawn in the correct spot, placing a box\
    \ around the text is easy. The BoxedTextSolution steps through the necessary method\
    \ calls to place a box around some. Correctly boxing text is essential to playing\
    \ game exactly where it is needed.\n\n```\npackage javagames.awt;\nimport java.awt.*;\n\
