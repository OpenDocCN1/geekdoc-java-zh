  md: "# Chapter 1 Hello World\n\nThe calculate() method should be called once for\
    \ every rendered frame. To calculate the frame rate, the current time is subtracted\
    \ from the last time and stored in the delta variable. The frame count is incremented\
    \ each frame, and when the delta time is over one second, the new FPS are generated.\
    \ Since the delta variable is rarely exactly one second, 1,000 milliseconds are\
    \ subtracted from the delta variable to save the extra milliseconds. Once the\
    \ new frame is saved, the frame count is reset and the process begins again.\n\
    \n```\npackage javagames.util;\npublic class frameRate {\n    private String frameRate;\n\
    \    private long lastTime;\n    private long delta;\n    private int frameCount;\n\
    \n    public void initialize() {\n        lastTime = System.currentTimeMillis();\n\
    \        frameRate = \"FPS 0\";\n    }\n\n    public void calculate() {\n    \
    \    long current = System.currentTimeMillis();\n        delta += current - lastTime;\n\
    \        lastTime = current;\n        frameCount++;\n        if(delta > 1000)\
    \ {\n            delta -= 1000;\n            frameRate = String.format(\"FPS %s\"\
    , frameCount);\n            frameCount = 0;\n        }\n    }\n\n    public String\
    \ getFrameRate() {\n        return frameRate;\n    }\\}\n```\n\n# CREATING THE\
    \ HELLO WORLD APPLICATION\n\nThe Hello World application seen in Figure 1.1 is\
    \ the first game example. The HelloWorldApp is located in the Javagames.render\
    \ package. Other than clearing and redrawing the background, nothing else is rendered.\
    \ The HelloWorldApp extends the JFrame class, which is a top level window component\
    \ from Java's Swing library. This application contains a frameRate object, which\
    \ is used to measure the frame rate of the application."
