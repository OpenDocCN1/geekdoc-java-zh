  md: '# Chapter 1 Hello World


    To handle the rendering, a BufferStrategy class can be used, but this requires
    some changes to the structure of the application. This will allow the application
    to put the rendering code in a separate thread and be in control of the entire
    process.


    There are three reasons to get the game code out of the paint() method. The first
    is that there should not be any long executing or blocking code in the paint()
    method because it will block the GUI from receiving paint events. The second is
    that the rendering code needs to be in a different thread for full-screen exclusive
    mode. And the third, most important reason, is that the rendering code is faster
    when the drawing is handled from scratch. In order to take advantage of active
    rendering, bothed and full-screen, a custom rendering thread is created.


    There is no practical way to put the drawing code in the paint method of a JPanel,
    as you saw in the first example, but call that from a custom rendering thread.
    In order to handle the painting in a custom loop, you can use a BufferStrategy
    class. This class is used to perform double-buffering and page-flipping.


    Double-buffering, illustrated in Figure 1.2, is used to keep the actual drawing
    of an image from being seen while the drawing is taking place. By drawing an image
    in memory and then copying the entire image at once, the process of drawing is
    not


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_24_0.png)


    **Figure 1.2**nDouble-Buffering.

    © 2014 Timothy Wright.


    Page-flipping, which can be used in full-screen exclusive mode, uses the same
    idea, but instead of copying an image, it maintains two off-screen images and
    simply swaps a video pointer from one buffer to the other. This way, however the
    drawing is not drawn to the screen can be cleared and redrawn. When the drawing
    is complete, the pointers are swapped again, drawing the new image to the screen.
    See Figure 1.3.'
