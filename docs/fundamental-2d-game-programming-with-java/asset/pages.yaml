  md: "# Chapter 11 Text\n\n![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_360_0.png)\n\n\
    Figure 11.8\nSafe Keyboard Input.\n© 2014 Timothy Wright.\n\nThe SafeKeyboardInputExample,\
    \ as shown in Figure 11.8 and located in the javames.text package, uses the new\
    \ input class to type text to the screen. To simplify testing, a new framework\
    \ class, SafeKeyboardFramework, has been added to the javames.util package using\
    \ the new KeyboardInput class. Because the new keyboard input processing is different,\
    \ simply replacing the input class in the other framework would require refactoring\
    \ all the previous examples.\n\nThe SafeKeyboardFramework framework is exactly\
