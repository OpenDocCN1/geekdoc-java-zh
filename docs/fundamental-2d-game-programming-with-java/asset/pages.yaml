    \ or almost touching the polygon from getting stuck, they have to be ignored.\
    \ But this causes another problem. If the new position is almost touching the\
    \ polygon, it will not intersect the polygon until the next frame, but at that\
    \ point, since it is close, it will be ignored, so it does not get stuck. This\
    \ causes the point, if it stops right before the polygon line, to pass right through\
