    SAMPLE_RATE\nVOLUME\n\nNot all lines support controls, so it is important to check\
    \ if the control is available before getting access. The following code checks\
    \ for a MASTER_GAIN control and acquires the control if it is available:\n\n```\n\
    if(line.isControlSupported(FloatControl.Type.MASTER_GAIN)) {\n    FloatControl\
    \ gainControl = (FloatControl)line.getControl(FloatControl.Type.MASTER_GAIN);\n\
    }\n```\n\nThe MASTER_GAIN control will adjust the sound volume and the PAN control\
    \ determine which speaker the sound is heard. If the sound is not a mono sound,\
    \ but a stereo sound, use the BALANCE control. The updated AudioStream code adds\
    \ support for GA and PAN controls.\n\n```\npackage javagames.sound;\n```\n\n```\n\
    import java.util.*;\nimport java.util.concurrent.locks.*;\nimport javax.sound.sampled.*;\n\
    import javax.sound.sampled.LineEvent.*;\n```\n\n```\npublic abstract class AudioStream\
    \ implements LineListener {\n    public static final int LOOP_CONTINUOUS = -1;\n\
    \    protected final Lock lock = new ReentrantLock();\n    protected final Condition\
    \ cond = lock.newCondition();\n    protected volatile boolean open = false;\n\
    \    protected volatile boolean started = false;\n\n    // UPDATES\n    protected\
    \ FloatControl gainControl;\n    protected FloatControl panControl;\n    // UPDATES\n\
    \n    protected byte[] soundData;\n```"
