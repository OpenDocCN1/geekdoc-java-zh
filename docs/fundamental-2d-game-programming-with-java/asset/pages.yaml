  md: "```\npublic static void main( String[] args ) (\n  launchApp(new UtilityDrawStringExample());\n\
    )\n\n```\n\n# # USING TEXT METRICS FOR LAYOUT\n\nThe FontMetrics class is not\
    \ the only way to get information about a font. Java has some other classes and\
    \ methods available to provide all the available information about a font.\n\n\
    The FontMetrics object provides a LineMetrics objects, which has additional information,\
    \ such as the center baseline of a font.\n\n```\nfloat dy = fm.getLineMetricsOffsets(str.graphics)[Font.CENTER_BASELINE];\n\
    ```\n\nEven more useful is the TextLayout object. This object can be constructed\
    \ using a Font, a FontRenderContext, and a String.\n\n```\nGraphics2D g2d;\nFont\
    \ font;\nString str;\nFontRenderContext frc = g2d.getRenderContext();\nTextLayout\
    \ t1 = new TextLayout(str, font, frc);\n```\n\nThe text layout object is useful\
    \ because it provides a lot of information as floating point values, not integers,\
    \ so more exact placement is possible. The following are available from the TextLayout\
    \ object:\n\n+   - Ascent\n- Descent\n- Leading\n- Baseline\n- Roman baseline\n\
    - Center baseline\n- Hanging baseline\n- Advance\n- Bounds\n- Visible bounds\n\
    \nThe TextMetricsExample, shown in Figure 11.5 and located in the javagames.text\
    \ package, demonstrates using all the different information available for fonts."
