    # SOUND


    The Java Sound API is a low-level library for playing and recording sound and
    MIDI files. Although there are many aspects of the sound library, this chapter
    focuses only on playing *.wav files. The portion of the library that you are going
    to use is organized as shown in Figure 13.1.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_401_0.png)


    Figure 13.1

    Sound API.

    © 2014 Timothy Wright.


    All classes inherit from the base class Line. This abstract class splits into
    three different subclasses. A Port object represents the physical sound inputs
    and output, such as speakers, headset jack, and microphones. Mixer objects have
    input and output lines and can mix input data and create new output data. This
    class is modeled after a sound mixer in a recording studio. Finally, there is
    the DataLine, which represents the bits of audio data passed around to the other
    classes.'
