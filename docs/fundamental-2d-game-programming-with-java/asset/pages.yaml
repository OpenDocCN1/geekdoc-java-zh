  md: '# # HANDLING MOUSE INPUT


    The SimpleMouseInput class, located in the javagames.util package, is very similar
    to the keyboard input class developed in the previous section. The mouse buttons
    are handled in the same way as the keyboard keys. The classes implement the MouseListener
    interface that contains the following methods:


    ```

    mouseClicked(MouseEvent e)

    mouseEntered(MouseEvent e)

    mouseExited(MouseEvent e)

    mousePressed(MouseEvent e)

    mouseReleased(MouseEvent e)

    ```


    Two of the methods in this interface, mouseEntered() and mouseExited(), deal with
    cursor movement. The other three are for the mouse buttons. Just like the keyboard
    listener, the pressed and released methods track the state of the mouse buttons,
    while the clicked method is ignored. To determine which button was pressed, the
    mouse event contains the following method:


    ```

    public int MouseEvent.get()

    ```


    The value returned from this method maps to the following constants:


    ```

    MouseEvent.NOBUTTON = 0

    MouseEvent.BUTTON1 = 1

    MouseEvent.BUTTON2 = 2

    MouseEvent.BUTTON3 = 3

    ```


    The button number starts at one instead of zero, which represents no button, and
    it is necessary to subtract one from the number to reference the mouse button
    array. Other then the mouse buttons are treated the same as the keyboard keys,
    including a buttonDown() and buttonDownOnce() method.


    There are other mouse states available to the program, such as the position of
    the mouse pointer. Along with the mouseEntered() and mouseExited() methods from
    the MouseListener interface, the mouse input class also implements the MouseListener
    interface.


    ```

    mouseDragged(MouseEvent e)

    mouseMoved(MouseEvent e)

    ```


    All four of these methods—entered, exited, dragged, and moved—capture the position
    of the mouse while informing the program if the mouse is entering or leaving the
    component listening for mouse events. The following method gets the current position
    of the mouse:


    ```

    public Point MouseEvent.get()

    ```'
