    \n```\npublic static void main(String[] args) {\n    launchApp(new BoxedTextSolution());\n\
    }\n```\n\n# # MAKING A DRAW STRING UTILITY\n\nNow that you can determine the placement\
    \ of text based on the font size, you can add some utility methods to the Utility\
    \ class, located in the Javames.util package. Given a starting position and an\
    \ array of strings, the utility methods draw the text to the screen with the correct\
    \ spacing, keeping the string position in the upper-left corner.\n\n```\npublic\
    \ class Utility {\n```\n\n```\n// previous code here\npublic static int drawString(Graphics\
    \ g, int x, int y, String str) {\n    return drawString(g, x, y, new String[]\
    \ {str});\n}\n```\n\n```\npublic static int drawString(int x, int y, List<String>\
    \ str) {\n    return drawString(g, x, y, str.toArray(new String[0]));\n}\n```\n\
    \n```\npublic static int drawString(int x, int y, String... str) {\n    FontMetrics\
    \ fm = g.getFontMetrics();\n    int height = fm.getAscent() + fm.getDescent()\
    \ + fm.getLeading();\n    for(String s : str) {\n        g.drawString(s, x, y\
    \ + fm.getAscent());\n        y += height;\n    }\n}\n```\n\nNotice that the new\
    \ methods return the y position once the text is drawn. This allows more text\
    \ to be appended to the previously drawn text. Using the new utility methods,\
    \ the following code can be added to the SimpleFramework, located in the javames.util\
    \ package."
