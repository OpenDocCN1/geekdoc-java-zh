  md: "# Using the Vector2f Class\n\nThere are keys mapped to the different transformation\
    \ operations. R for rotation, S for shearing, X for x-shearing, Y for y-shearing,\
    \ and the spacebar to reset the values back to their starting values.\n\nThe polygon\
    \ object is copied into the world list before being transformed. This way, the\
    \ operations are not cumulative, but happen every frame. Not only does this leave\
    \ the original model untouched, it allows multiple copies of the original to be\
    \ used.\n\nEach transformation operation is handled in the same way. First the\
    \ Boolean value mapped to the specific transformation is checked. If it is true,\
    \ then transformation is applied, the bounds are checked, and the step values\
    \ are adjusted accordingly. After the values are updated, the transformations\
    \ are applied. Notice that the order of the transformations is important. Changing\
    \ the order of the operations would change the results on the screen.\n\nInside\
    \ the render() method, all the values of the translation flags are displayed.\
    \ The transformed polygon is then drawn using the drawLine() method of the graphics\
    \ object. The last point and first point are connected, and then each point is\
    \ to draw a line from that point to the next point, producing a closed polygon.\n\
    \n```\npackage javgames.transform;\n\nimport java.awt.*;\nimport java.awt.event.*;\n\
    import java.awt.image.*;\nimport javgames.util.*;\nimport javax.swing.*;\n```\n\
