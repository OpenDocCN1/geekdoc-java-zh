    \ from inside itself, the method would never return (until the program throw a\
    \ stack overflow exception). The repaint() method issues a paint request that\
    \ will happen as soon as the current paint is finished. This way continuously\
    \ paints the window as fast as possible.\n\nThe createAndShowGUI() method is where\
