  md: '# 322 Chapter 11 Text


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_338_0.png)


    Figure 11.2

    Text Metrics.

    © 2014 Timothy Wight.


    The baseline runs across the bottom of the font. However, some letters will drop
    below the baseline. The ascent value rises from the baseline to the top of the
    font. The descent value is the distance letters drop below the baseline, and the
    leading value is the space between lines so that the letters do not touch. Together,
    these three values form the total height of the font. See Figure 11.2.


    Height = ascent + descent + leading


    As most problems in Java, there are multiple ways to solve this problem.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_338_1.png)


    Figure 11.3

    Boxed Text Solution.

    © 2014 Timothy Wight.


    The BoxedTextSolution code, as shown in Figure 11.3 and located in javagames.text
    package, demonstrates the necessary steps to place a border around some text without
    guessing at the values. The first step is to get the FontMetrics from the Graphics
    object.'
