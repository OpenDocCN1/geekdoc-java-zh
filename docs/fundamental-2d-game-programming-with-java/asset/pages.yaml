  md: '# Understanding the Simple Framework


    The run() method has two methods added to it to allow subclasses the ability to
    run code before and after the main game loop:


    +   - initialize() is called before the game loop starts.


    +   - terminate() is called after the application is closed.


    The initialize() method creates and initializes the frameRate object, the terminate()
    method is empty, and the game loop remains the same. There is nothing performed
    in the terminate() method, and the game loop remains the same. The three methods
    used to perform game actions have been protected so subclasses can override them.


    ```

    protected void processInput(float delta)

    protected void updateObjects(float delta)

    protected void render(Graphics g)

    ```


    The processInput() method calls the polls for the keyboard and mouse. The render()
    method draws the frame rate, and the updateObjects() method is empty for the time
    being. See Figure 5.3.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_143_0.png)


    **Figure 5.3**

    Game Loop.

    © 2014 Timothy Wright.


