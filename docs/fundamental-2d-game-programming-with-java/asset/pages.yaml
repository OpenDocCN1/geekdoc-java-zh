  md: 'The reflection vector is calculated as follows:


    ```

    $V_n = \hat{n}(V * \hat{n})$$\nV_p = V - V_n$\nV'' = V_p - V_n$$

    ```


    To reflect a direction off a line segment, the intersection point is used to create
    the original reflection vector, as well as the starting point for the reflection.
    See Figure 15.23.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_495_0.png)


    **Figure 15.23**

    Reflection Vector Components.

    © 2014 Timothy Wright.


    ```

    $S_V = S_I - S_o$\n$n = S_v\perp$\n$\hat{n} = \frac{n}{||n||}$$$

    ```


    I is the intersection of Q and P. Q = P1-I and Q is the reflection.'
