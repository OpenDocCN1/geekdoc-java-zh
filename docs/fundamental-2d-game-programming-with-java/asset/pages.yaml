  md: '# Chapter 6—“Vector2f Updates"


    +   - The Matrix3x3f class is introduced, along with the MatrixMultiplicationExample,
    which rotates planets around the sun.


    # CHAPTER 4—“TIME AND SPACE"


    +   - The TimeDeltaExample demonstrates adding the tick count to the game loop
    to perform animation not dependent on the frame rate.


    +   - The ScreenMappingExample class uses normalized device coordinates and maps
    these values to the screen with transformations.


    +   - The ViewportRatioExample class maintains the wo ratio and centers the viewport
    in the game window.


    +   - The CannonExample class uses the tick count and world coordinates to implement
    the physics and gravity to simulate a cannon and a cannonball.


    # CHAPTER 5—“SIMPLE GAME FRAMEWORK"


    +   - The Utility class is added to the javagames.util package. This class is
    updated throughout the rest of the book with helper methods.


    +   - The SimpleFramework class is introduced. The class wraps all the common
    code into a framework that can be used to simplify the rest of the examples in
    the book.


    +   - The SimpleFrameworkTemplate class is an example of using the framework as
    a starting point for future code examples.


    # CHAPTER 6—“VECTOR2F UPDATES"


    The following methods are added to the Vector2f class to aid with intersection
    testing.


    +   - inv()—Computes the inverse vector


    +   - add()—Adds two vectors


    +   - sub()—Substracts two vectors


    +   - mul()—Multiplies a vector with a scalar


    +   - div()—Divides a vector with a scalar


    +   - perp()—Computes a perpendicular vector


    +   - dot()—Calculates the dot product from two vectors


    +   - angle()—Returns the angle created by the vector'
