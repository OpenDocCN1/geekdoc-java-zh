    \ -D stuff here. It won't work.\"\n```\n\nThe properties can be easily retrieved\
    \ the System class is available from anywhere. There are two methods for retrieving\
    \ property values:\n\n```\nString prop = System.getProperty(\"name\");\nString\
    \ default = System.getProperty(\"name\", \"default\");\n```\n\nThe first method\
    \ passes in only a property name, and if the property is not available, null is\
    \ returned. The second method includes a default value if the property is not\
    \ found. There is a catch to using properties: once they are set, they can be\
    \ overwritten. You must be careful when loading multiple property files and system\
    \ properties, because the last property defined will erase previous property values."
