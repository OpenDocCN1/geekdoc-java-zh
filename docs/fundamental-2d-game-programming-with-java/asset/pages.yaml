  md: '# CHAPTER 9


    # FILES AND RESOURCES


    There are many advantages to using files, but the most important one are:


    +   - The ability to create, read, update, and delete data without recompiling
    the software.

    - The ability to save and restore information between software runs.


    Understanding how files are read and written to is essential for game programming
    because audio, images, dialogue, 3D models, level data, and anything else needed
    by your game is stored in files.


    This chapter explores reading and writing property files for simple tasks, and
    covers storing data with XML files. There is also a section on using resources
    (which is just a fancy way of saying "stuff in files") packaged inside a Java
    archive file (*.jar). Once you have audio and images files, it is important to
    understand where to put them, and how to access them from inside the game.


    # UNDERSTANDING HOW JAVA HANDLES FILES AND DIRECTORIES


    Before the software reads and writes files, it is important to understand what
    Java does with files and directories. Experienced Java developers can skip this
    section, and then simply take a look at the later information about files and
    resources. There are some interesting problems to consider.'
