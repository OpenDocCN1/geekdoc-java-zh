  md: '# Handling Mouse Input


    The first thing to notice is the method calls when the GUI is created. These calls
    add KeyboardInput and SimpleMouseInput as listeners to the components. Note that
    although the keyboard is added to both the JFrame and the Canvas, the mouse is
    only added to the Canvas. When the application starts up, it will not process
    events if they have not been added to the JFrame. Once the mouse object receives
    focus, it will receive keyboard input, but until it is selected the keyboard input
    is received only by the JFrame. In the game loop, the following method call has
    been added:


    ```

    public void processInput()

    ```


    Inside this method, both the keyboard and mouse are polled to make their data
    available. When the mouse button is first pressed, the drawing flag is set. For
    each frame the left mouse button is down, a new point is added to the line''s
    data structure. When the button is released, the flag is cleared, and a null object
    is added to the list, marking the end of the line. This way, the data structure
    can hold all the lines in the same time.


    When the C key is pressed, the lines are cleared from the data structure. This
    lets the users start over if they are lacking artistic skills (like me!). There
    is also new code added to the render method. Besides displaying the frame rate,
    as well as directions for using the application, the current mouse position is
    displayed as a string.


    The mouse scroll wheel is used to select a color index. The following code uses
    the modulus operator and the absolute value to keep the index a valid value no
    matter how large or small the index gets.


    ```

    // SimpleMouseExample.java

    colorIndex += mouse.getNotches();

    Color color = COLORS * Math.abs(colorIndex % COLORS.length);

    g.setColor(color);

    ```


    The % operator will keep the value between (−3, 3). Because the modulus operation
    of a negative value is either zero or a negative value, the absolute value is
    used to keep the array index between (0, -1).


    Finally, the lines are drawn. Because null values are inserted into the data structure,
    code is added to make sure lines are drawn only if neither point is null.


    ```

    package javagame.*;nimport java.awt.*;

    import java.awt.event.*;

    import java.awt.image.*;

    import java.util.*;

    ```'
