  md: '# Row-Major vs. Column-Major Matrices 73


    vector with three elements to a matrix that has $3 \times 3$ elements, it is important
    to understand matrix multiplication is not like multiplying two numbers.


    To multiply two matrices of different sizes, the inside sizes must match. The
    resulting matrix will have the dimensions of the outside values. In other words,
    $A \times B^* \times C = A \times C$. The B on the inside must match. The following
    are valid matrix sizes and their multiplication results:


    +   - $4 \times 2^* \times 2 \times 3 = 4 \times 3$\n- $3 \times 3^* \times 3
    \times 5 = 3 \times 5$\n- $1 \times 2^* \times 2 \times 7 = 1 \times 7$


    This is one of the reasons that the extra $w$ value is needed. $1 \times 2^* \times
    3 \times 3$ matrix operation is not valid. Also, the order of the vector and matrix
    need to be correct, or the matrix operation doesn''t work.


    +   - $3 \times 3^* \times 1 \times 3 = Error$, vector can''t be a $1 \times 3$\n-
    $3 \times 3^* \times 3 \times 1 = Good$


    Another point is that matrix multiplication is not commutative. In other words:


    ```

    M1 * M2 != M2 * M1

    ```


    Reversing the multiplication changes the result, which is not the same for other
    forms of multiplication. Translating and then rotating has a different result
    from rotating and translating. It is important to keep this in mind. Multiplying
    a matrix by another may not produce the result if the two matrices are switched,
    although the values could be chosen in such a way to force the results to be the
    same. Because of this, swapping the vector and the matrix to get the multiplication
    to work is not a good idea:


    ```

    1x3 vector * 3x3 matrix! = 3x3 matrix * 3x1 vector

    ```


    This brings up the next important consideration when working with a matrix: how
    to properly use row-major or column-major formats.


    # ROW-MAJOR VS. COLUMN-MAJOR MATRICES


    The following transformation matrix is a column-major matrix:


    ```

    [ 0 0 tx ]

    [ 0 1 ty ]

    [ 0 0 1 ]

    ```'
