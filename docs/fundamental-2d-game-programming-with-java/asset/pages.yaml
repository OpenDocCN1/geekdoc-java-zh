    \ package, represents a rock flying through space. Upon creation, a random velocity\
    \ and rotation are created. Java's random number generator returns only floating-point\
    \ numbers between zero and one, so to create random numbers that span an arbitrary\
    \ range, additional steps are required. For example, to return numbers from -3\
    \ to 7, follow these steps:\n\n+   * Calculate the distance between the number\
    \ range by subtracting the minimum value from the maximum value.\n* Generate a\
    \ random float from zero to one.\n* Multiply the random number by the distance.\n\
    * Shift the range by adding the minimum.\n\nThe steps make it sound a lot more\
    \ confusing than it actually is.\nprivate float getRandomFloat(float min, float\
    \ max) {\n  float rand = new Random().nextFloat();\n  return rand * (max - min)\
    \ + min;\n}\n\nThe same thing done to get a random integer. If the random generator\
    \ returns a number from zero to count minus one, the method is adjusted slightly.\n\
    \n```\nprivate float getRandomRadians(int minDegree, int maxDegree) {\n  int rand\
    \ = new Random().nextInt(maxDegree - minDegree + 1);\n  return (float)Math.toRadians(rand\
