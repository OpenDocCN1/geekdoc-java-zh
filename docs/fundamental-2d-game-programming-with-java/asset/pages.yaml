  md: '![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_500_0.png)


    Figure 15.26

    Correct Reflection.

    © 2014 Timothy Wright.


    Unfortunately, both methods have problems. The correct method must accurately
    adjust the point, and continue checking for collisions recursively until there
    are no more collisions or the bounce distance is too small. At that point, the
    correct method will suffer from some of the same problems as the simple method.
    To keep it as simple as possible, the simple method will be used.


    There are also many problems with the simple method. First, when the point’s position
    is only updated if there is a collision, if the point travels far enough each
    frame, it will always hit something and the point will never move. See Figure
    15.27.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_500_1.png)


    Figure 15.27

    Point Will Never Move.

    © 2014 Timothy Wright.


    The second issue with leaving the point in its original position happens when
    the point is very close to the line. If the point starts touching or almost touching
    a polygon line, then it will always register a collision, and will get stuck to
    the line. See Figure 15.28.'
