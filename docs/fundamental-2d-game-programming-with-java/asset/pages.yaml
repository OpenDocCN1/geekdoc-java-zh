  md: "# 390 Chapter 13 Sound\n\nof the methods in the sound library send notification\
    \ events in another thread but take some time to actually complete, so it is easy\
    \ to use the library incorrectly. Let's examine a simple loop, which starts and\
    \ stops a clip sound.\n\n```\nfor (int i = 0; i < 10; i++) {\n  clip.start();\n\
    \  while(clip.isActive()) {\n    Thread.sleep(100);\n  }\n  clip.stop();\n  clip.flush();\n\
    \  clip.setFramePosition(0);\n  clip.start();\n  clip.drain();\n}\n```\n\nThis\
    \ code starts the clip and then sleeps while waiting for the clip to become active.\
    \ At that point, the clip is restarted. First it is stopped, the remaining data\
    \ in the buffer is flhed out, the frame position is set back to the beginning,\
    \ and the clip is started. Finally, the clip is drained so the entire sound will\
    \ play before the next loop iteration.\n\nOn my computer, this loop locks after\
    \ a couple of iterations using the latest Java 6.0 SDK. It is not clear why it\
    \ locks up, but there is something to do with the drain() method blocking before\
    \ the clip is restarted. Regardless, there are no errors thrown, and no indication\
    \ that anything is wrong.\n\nAnother problem with the sound library is the difference\
    \ between Java 6.0 and 7.0. While the previous example locked up with 6.0, there\
    \ has been a replacement of the software mixer with 7.0 and the behavior has changed.\
    \ Pay attention to the differences between 6.0 and 7.0 when testing the examples.\n\
    \nExperimenting with the library revealed that the events sent to the LineListener\
    \ interface, such as START and STOP, must be received before any other actions\
    \ are taken with the library. Although many of the methods return immediately,\
    \ the software must block, or poll, waiting for the event before continuing. This\
    \ makes the library very easy to use in a multi-threaded Swing application, but\
    \ it makes it very difficult to use in a single-threaded game loop. The wait/notify\
    \ thread signals covered in the thread solve this problem by blocking the non-blocking\
    \ API so that the sound library doesn't lock up.\n\nThe PlayingClipsExample, located\
    \ in the javagames package, demonstrates playing sounds without waiting, locking\
    \ up the sound API, and playing sound while blocking for the response using the\
    \ wait/notify mechanism in Chapter 12,"
