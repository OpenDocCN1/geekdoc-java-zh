  md: "# CHAPTER 17\n\n# SPACE ROCKS\n\nNow, taking everything covered so far, this\
    \ chapter presents a complete game.\nThrough all my years reading forum posts\
    \ about game programming, I've come to realize that finishing a game is a huge\
    \ stumbling block for a lot of people. The reason\for this may have something\
    \ to do with the fact that to code a complete game, there is a ton of stuff to\
    \ learn, and most of the code is boring. As you examine the code for this complete\
    \ game, notice that the actual gameplay (the fun part) is a very small part of\
    \ the entire codebase. Most of the code is framework, input handling, or dealing\
    \ with sound and image resources. Very little of the code is what a beginner imagines\
    \ it to make a game.\n\nAlthough the game is “complete,” there is still a lot\
    \ of polish that could be added. I didn't want to just throw thousands of lines\
    \ of code, but I also didn't want to end the book without an idea of what it takes\
    \ to finish a game. The game that follows, called “Space Rocks,” contains all\
    \ the parts and pieces of a finished game. Granted, it is not very big, it's not\
    \ very fun, and isn't that difficult—but it is a game.\n\nThe game contains the\
    \ following:\n\n+   - Build script\n- Input handling\n- Collision detection\n\
    - Particle system\n- Physics (flying ship)\n- Sound"
