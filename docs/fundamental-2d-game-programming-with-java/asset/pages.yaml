  md: '# ABOUT THE AUTHOR


    Timothy Wright is a software engineer currently working on the next great indie
    game. He spent his early adult life as an Army piano player, where he discovered
    his love of programming. He has a bachelor''s degree in computer science and has
    worked for R&D companies, using optics and lasers, for the last decade. While
    not working on games or playing them, he enjoys playing poker, cooking good food,
    and brewing his own beer. With a wife, two daughters, three dogs, two cats, and
    a foreign exchange student, his weeks are full of drama. Timothy has lived all
    over the country and spent five years living in Italy, Germany, and traveling
    Europe. He has been a forum moderator at www.gamedev.net for years, and you can
    occasionally find him poking about under the name Glass_Knife.'
