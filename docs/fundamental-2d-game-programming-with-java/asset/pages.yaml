    \ = end;\n    }\n10:   return inside;\n)\n```\n\nThe steps for the pointInPolygon()\
    \ algorithm are as follows:\n\n+   1. Don't bother if there are not at least three\
    \ lines in the polygon.\n2. Start with the last and first points.\n3. Set startAbove\
    \ to true if the first polygon point is above the y value of the point to check.\n\
    4. Loop through all the points in the polygon.\n5. Since the code gets the last\
    \ point in the polygon, start with the first.\n6. Set endAbove to true if the\
    \ second polygon point is above the y value of the point to check.\n7. If both\
    \ startAbove and endAbove are equal, then they are either both above or below\
    \ the point and there cannot be an intersection.\n8. Save the startAbove state.\n\
    9. Make the end point the start point.\n10. Return the result.\n\nIn order to\
    \ determine whether the intersection is ahead or behind the ray, the point-slope\
    \ equation can be used to solve for the unknown x coordinate value.\n\n> $y -\
    \ y_1 = m(x - x_1)$\n$$x - x_1 = \\frac{y - y_1}{m}$$\n$$x = x_1 + \\frac{y -\
