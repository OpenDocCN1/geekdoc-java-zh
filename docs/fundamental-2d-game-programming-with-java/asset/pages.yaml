  md: "# Chapter 13 Sound\n\nIf the OneShotEvent is waiting, the fire event starts\
    \ playing the sound. The fire event does nothing while the sound is playing. The\
    \ DONE event will stop the sound, and the sound will stop when it is finished\
    \ playing. This state machine concept is explored in detail Chapter 12.\n\npackage\
    \ javagames.sound;\n\n```\npublic class OneShotEvent extends SoundEvent {\n  \
    \  public static final String STATE_WAITING = \"waiting\";\n    public static\
    \ final String STATE_RUNNING = \"running\";\n    public static final String EVENT_FIRE\
    \ = \"fire\";\n    public static final String EVENT_DONE = \"done\";\n    private\
    \ String currentState;\n    public OneShotEvent(AudioStream audio ) {\n      \
    \  super(audio);\n        currentState = STATE_WAITING;\n    }\n    public void\
    \ fire() {\n        put(EVENT_FIRE);\n    }\n    public void done() {\n      \
    \  put(EVENT_DONE);\n    }\n    protected void processEvent(String event ) throws\
