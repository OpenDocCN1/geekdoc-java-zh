  md: '# CHAPTER 16


    # TOOLS


    Before you get to the final game, it is necessary to create some tools, the first
    being a better GameFramework. Although the current framework is fine, the full-screen
    version doesn''t allow for aspect ratio, and it is difficult to add Swing components.
    After updating the framework, a new editor can be created adding more options
    with Swing components. Next, a sprite is created to allow images in pixel space
    to be used by objects in world space. Finally, a simple particle engine is created
    to allow for explosions and rocket blasts.


    Let''s get to it.


