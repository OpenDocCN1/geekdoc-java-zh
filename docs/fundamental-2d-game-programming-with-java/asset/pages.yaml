    // reset!!!

    g2d.setTransform(new AffineTransform());",

    ```


    Some methods are better than others, the AffineTransform and TexturePaint methods
    both have trouble rendering the edges of the image. The AffineTransform with a
    bilinear interpolation value renders the image correctly but fails to blend the
    edges. The TexturePaint method interpolates the edges by wrapping the texture,
    which can cause issues wrapping the image from one side around to the other.


    A solution to fix both the TexturePaint and AffineTransform is to leave a border
    of transparent pixels around the outside of the image. The AffineTransform blends
    the clear pixels, so no jagged edges are visible, and the TexturePaint wraps the
    invisible pixels, which does not cause visible problems.


    Using the example program, you can test all the different properties and rendering
    methods to determine which produce the best quality at the fastest speed. The
    two best methods on my test machine are:


    +   - Antialiasing on, Bicubic Interpolation, Texture Paint rendering with a transparent
    border.


    +   - Antialiasing on, Bilinear Interpolation, AffineTransform rendering with
    transparent border.'
