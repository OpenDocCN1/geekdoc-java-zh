    # UNDERSTANDING SIMPLE FRAMEWORK


    The first thing to notice about the SimpleFramework class, located in the javagames.util
    package, is all the properties. Although there could be methods to access each
    individual property, it is easier to just use the default values or change them
    in the constructor. Since all the properties start with app, using code completion
    in a code editor will bring up a list of available properties. See Figure 5.1.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_141_0.png)


    Figure 5.1

    Launch Application.

    © 2014 Timothy Wight.


    +   - appBackground—The background color of the main game area.

    - appBorder—The color of the border when the aspect ratio is maintained.

    - appFPSColor—The color to draw the frames-per-second display.

    - appFont—The font to use when displaying the frames-per-second.

    - appTitle—The title of the example.

    - appBorderScale—The ratio of the game area to border area when the aspect ratio
    is maintained.

    - appWidth—The startup width of the window.

    - appHeight—The startup height of the window.'
