  md: '# Chapter 16—“Tools” 615


    +   ■ SoundPlayerExample demonstrates using the sounds in a game loop.


    +   ■ SoundControlsExample uses updates to the sound library to add pan and volume
    controls to the classes and demonstrates their usage.


    # CHAPTER 14—“DEPLOYMENT WITH ANT”


    +   ■ The common.xml file is an example of an extendable build script that can
    be customized to compile, package, and deploy game code for a user.


    +   ■ The CustomBuild.xml file is an example of extending the common.xml file
    for a specific game.


    # CHAPTER 15—“COLLISION DETECTION”


    +   ■ BouncingBallsExample creates random balls that bounce around the screen.


    +   ■ LineRectIntersectionExample places a spinning rectangle in the middle of
    the screen and computes the intersection of a line with a rectangle.


    +   ■ CircleLineIntersectionExample shows how to compute the intersection of (guessed
    it) a circle and a line.


    +   ■ LineLineIntersectionExample computes the exact intersection point of two
    line segments.


    +   ■ ReflectionVectorExample calculates the reflection vector off a line segment.


    +   ■ BouncyPointExample demonstrates bounce points around a closed polygon.


    # CHAPTER 16—“TOOLS”


    +   ■ GameFramework, WindowFramework, FullScreenFramework, and SwingFramework
    demonstrate a more generic framework for the code.


    +   ■ The Utility class is updated with more String rendering, as well as the
    code to scale images.


    +   ■ PolygonEditor is used along with the ExampleFilter to create a better polygon
    editor that saves and loads files.


    +   ■ The Sprite class is added to the utility package to easily draw sprites
    in the game. The SpriteExample demonstrates the new class.


    +   ■ TestParticle and ParticleExample explore a simple particle engine.'
  merge: -1
