  md: '![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_480_0.png)


    The equation for the t value of the parametric line equation can be found in two
    steps. First, the parametric line equation can be substituted into the equation
    for a circle and simplified. The simplified equation can then be solved using
    the quadratic formula.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_480_1.png)


    The equation for a circle is easy to understand. Given any point on the circle,
    the distance from the point P to the center C, minus the radius r (which is the
    same distance), must equal zero.


    circle = ||P - C|| - r = 0


    Remembering that two lines ||x|| represent the length, the parametric line equation:


    P = O + td


    Can be substituted into the circle equation, and simplified, as follows:


    ||O + td - C|| - r = 0'
