    +   1. Loop through the rectangle and each pair of parallel sides.


    +   2. Compute the perpendicular normal to the two sides being tested.


    +   3. Normalize the vector, because this vector is used with the dot product

    (see Chapter 6 for more information).


    +   4. Compute the numerator for the intersection equation of the first side.


    +   5. Compute the numerator for the intersection equation of the second side.


    +   6. Compute the denominator for the intersection equation.


    +   7. Check if the denominator is zero, which means the ray is parallel to the
    sides.


    +   8. Test if the parallel line is between the two sides. If it isn''t, there
    can be no

    intersection.


    +   9. Since the parallel line is outside the rectangle, no intersection is possible.


    +   10. Return the intersection here, but that can''t happen yet.


    The test in line 8 can be confusing. The e0 and el values are the signed distances
    from

    t origin to the side. The only way for the parallel line to be between the sides
    is if one

    distance is negative and the other is positive. If they are both positive or both
    negative,

    then they cannot be between the sides. The product of two positive or two negative

    values is always positive, so only if the product is negative can they be between
