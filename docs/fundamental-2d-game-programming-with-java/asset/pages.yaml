    float worldHeight = 2.0f;

    float screenWidth = canvas.getWidth() - 1;

    float screenHeight = canvas.getHeight() - 1;

    float sx = screenWidth / worldWidth;

    float sy = screenHeight / worldHeight;

    float tx = screenWidth / 2.0f;

    ```'
