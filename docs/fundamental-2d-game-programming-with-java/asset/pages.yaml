  md: '# Using the Separating Axis Method 167


    There are many examples on the Internet if you are looking for a rigorous mathematical
    proof of the theorem. For the purposes here, Figure 7.14 shows adequate proof.
    Keep in mind that this only works for convex polygons. If there are any interior
    angles greater than 180 degrees, the polygon is concave and the separating axis
    test will not work. Figure 7.15 shows an example of a failing test due to a concave
    polygon.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_183_0.png)


    Figure 7.15 Concave Polygon Problems.

    © 2014 Timothy Wright.


    # Tip


    If you have a concave polygon, it can always be broken up into multiple convex
    polygons for testing. See Figure 7.16.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_183_1.png)


    Figure 7.16 Splitting Concave Polygons.

    © 2014 Timothy Wright.


    It is easy to see how to draw a line between two objects, but this test needs
    to be done in the code using math. Fortunately, not only is the general case easy,
    there are some optimizations that can also be applied to symmetrical shapes.'
