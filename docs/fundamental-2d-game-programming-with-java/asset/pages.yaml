  md: '# Understanding the Matrix3x3f Class


    Tip


    > Make sure to understand all the places the code is different if you choose to
    switch from the row-major matrix to a column-major matrix. It is easy to miss
    something. (Trust me!)


    The following transformations are multiplied out to show what happens. I have
    left out multiplication by the zero matrix, because it doesn''t matter what you
    multiply it with; the result is all zeros.


    The identity matrix, however, is a special matrix that doesn''t change the value
    of another matrix. It is the matrix equivalent of multiplication by one.


    ```

    [1, 0, 0] [x]

    Identity [0, 1, 0] * V[y]

    [0, 0, 1] [w]

    Vx = 1*x + 0*y + 0*w = x

    Vy = 0*x + 1*y + 0*w = y

    Ww = 0*x + 0*y + 1*w = w

    ```


    The scale matrix will work as expected:


    ```

    [sx, 0, 0] [x]

    Scale [0, sy, 0] * V[y]

    [0, 0, 1] [w]

    Vx = sx*x + 0*y + 0*w = sx*x

    Vy = 0*x + sy*y + 0*w = sy*y

    Ww = 0*x + 0*y + 1*w = w

    ```


    The translation matrix will work only if w = 1. If w = 0, the operation will not
    be applied:


    ```

    [1, 0, tx] [x]

    Translate [0, 1, ty] * V[y]

    [0, 0, 1] [w]

    Vx = 1*x + 0*y + tx*w = x + tx*w

    Vy = 0*x + 1*y + ty*w = y + ty*w

    Ww = 0*x + 0*y + 1*w = w

    ```


    As discussed previously, the w value is added to make the translation work. If
    there was no w value, then this transformation would not be possible. Also, notice
    that w = 0 would cause the translation value to become zero, which would be the
    correct result for translating a vector.'
