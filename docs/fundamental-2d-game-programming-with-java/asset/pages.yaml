  md: "# Handling Keyboard Input\n\nWhen storing the state of the keyboard, it is\
    \ important to understand how the state of the keyboard is shared with the program.\
    \ Because the keyboard is a very complicated piece of hardware, not only the string\
    \ characters available, but each key, even those that do not represent a character,\
    \ such as the Shift key, are made available through virtual keys. Every key on\
    \ the keyboard is mapped to a key code located in the KeyEvent class. Here are\
    \ some example values:\n\n+   - KeyEvent.VK_E—The E key\n- KeyEvent.VK_SPACE—The\
    \ spacebar\n- KeyEvent.VK_UP—The up arrow key\n\nEach of these constants maps\
    \ to a numerical value passed to the key listeners inside the KeyEvent object.\
    \ The KeyEvent.getKeyCode() method returns the virtual key for whatever keyboard\
    \ key generated the event.\n\nThe SimpleKeyboardInput class, located in the package,\
    \ does very little. This class implements thest interface so it can monitor keyboard\
    \ events. It keeps a Boolean array of 256, which are all the virtual key codes\
    \ that need to be sampled. It stores the state of the key—true if down, false\
    \ otherwise—in the key state array. Finally, after using the synchronized keyword\
    \ to protect the key state array when it is accessed from multiple threads, it\
    \ gives access to the current key state with the keyDown(int keyCode) method.\n\
    \npackage java.awt.util;\n\nimport java.awt.event.*;;\n\n```\npublic class SimpleKeyboardInput\
    \ implements KeyListener (\n    private boolean[] keys;\n\n    public SimpleKeyboardInput()\
    \ (\n        keys = new boolean[ 256 ];\n    )\n\n    public synchronized boolean\
    \ keyDown( int keyCode) (\n        return keys[keyCode];\n    )\n\n    public\
    \ synchronized void keyPressed(KeyEvent e ) (\n        int keyCode = e.getKeyCode();\n\
    \        if( keyCode >= 0 && keyCode < keys.length ) (\n            keys[keyCode]\
    \ = true;\n        )\n    })\n```"
