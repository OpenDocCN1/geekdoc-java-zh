    +   - The PrototypeAsteroid class represents the rocks flying about in the game.


    +   - The PrototypeEditor class is the first example of using Swing to create
    game tools.


    +   - The PrototypeAsteroidFactory class creates random rocks at runtime, and
    RandomAsteroidExample demonstrates the factory.


    +   - The PrototypeBullet, PrototypeShip, and FlyingShipExample classes test the
    ship around and shooting weapons.


    +   - The PrototypeGame extends SimpleFramework and uses everything so far to
    create a prototype game.


    # CHAPTER 9—“FILES AND RESOURCES"


    +   - The FilesAndDirectories example demonstrates traversing a file tree.


    +   - The ReadingDataFiles and WritingDataFiles classes demonstrate basic file
    I/O.


    +   - The ClasspathResources class shows different ways to load a resource at
    runtime.


    +   - The ResourceLoader and ResourceExample classes add the helper class to the
    utility package and show its usage.'
