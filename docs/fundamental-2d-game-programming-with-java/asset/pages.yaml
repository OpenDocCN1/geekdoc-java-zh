  md: '# Exploring Different Image Types 261


    +   - TYPE_BYTE_INDEXED—Each byte value is an index into a 256 value array of
    colors containing web-safe colors and gray values.


    +   - TYPE_CUSTOM—Unknown types use this value for the image type.


    +   - TYPE_3BYTE_BGR—Each three byte group represents a color, where index 0 is
    blue, index 1 is green, and index 2 is red.


    +   - TYPE_4BYTE_ABGR—Each four byte group represents a color, where index 0 is
    alpha, index 1 is blue, index 2 is green, and index 3 is red.


    +   - TYPE_4BYTE_ABGR_PRE—This is the same as the previous type, but all the colors
    have been pre-multiplied by the alpha value before stored.


    +   - TYPE_USHORT_555_RGB—Represents an image with five bits for each color, packed
    into a 16-bit value, with no alpha value. See Figure 10.1.


    +   - TYPE_USHORT_565_RGB—Five bits for each red and blue component, and 6 bits
    for green, with no alpha component. See Figure 10.2.


    +   - TYPE_USHORT_GRAY—Same as an 8-bit gray-scale image, with the upper eight
    bits unused.


    +   - TYPE_INT_BGR—Integer with the format 0x00BBGGRR with no alpha value.


    +   - TYPE_INT_RGB—Integer with the format 0x00RRGGGB with no alpha value.


    +   - TYPE_INT_ARGB—Integer with the format 0xAARRGGBB where the alpha value has
    been pre-multiplied with the RGB color values.


    +   - TYPE_INT_ARGB_PRE—Integer with the format 0xAARRGGBB where the alpha value
    has been pre-multiplied with the RGB color values.


