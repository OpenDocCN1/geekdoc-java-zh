    \ about the code to create a Clip just yet. That will be covered shortly.\nThe\
    \ following methods are used to play sounds:\n\n+   ■ open()—To open a line. Because\
    \ there is a maximum of 32 lines available, each line must be opened before it\
    \ can be used.\n\n+   ■ start()—Calling start on a line allows the data sent to\
    \ the line to be processed by the other end. For example, writing data to a line\
    \ will not play the data unless the line has been started.\n\n+   ■ stop()—Data\
    \ lines have two internal buffers: the data frames currently being played and\
    \ a buffer waiting to be played. When the line is stopped, the data currently\
    \ being played is finished, and no data is played. However, any data left in the\
    \ intermediate buffer is still there. Calling start again will continue playing\
    \ the data from where it was stopped.\n\n+   ■ drain()—This method blocks until\
    \ all the buffered data available to played has been played and there is no data\
    \ left. This method is used to play all the sound data before stopping the sound.\
    \ Calling the stop() method without using drain() first will cut the sound off\
    \ immediately and leave data in the buffer.\n\n+   ■ flush()—This method removes\
    \ any remaining data from the sound buffer. If the sound has been stopped but\
    \ data remains, the flush() method will clear the buffer. If this method isn't\
    \ used after stopping a sound with remaining data, the last bit of sound will\
    \ still play when the sound is restarted.\n\n+   ■ close()—This method releases\
    \ the line and makes it available to be reused."
