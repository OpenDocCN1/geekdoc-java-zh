    may find that you never actually need to add or subtract a matrix from another
    matrix.

    Multiplication is where things get weird. The top row of the first matrix is multiplied
    by all three columns of the second matrix. Then the middle row of the first is
    multiplied by all three columns of the second. Finally, the bottom row is multiplied
    by all three columns of the second. It is displayed below in two different ways
    to expose the patterns.


    +   * [a, b, c] [1, 2, 3]

    A [d, e, f] B [4, 5, 6]=C

    *[g, h, i] [7, 8, 9]


    ```

    a*1+b*4+c*7, a*2+b*5+c*8, a*3+b*6+c*9

    d*1+e*4+f*7, d*2+e*5+f*8, d*3+e*6+f*9

    g*1+h*4+i*7, g*2+h*5+i*8, g*3+h*6+i*9


    C[0,0]=a*1+b*4+c*7

    C[0,1]=a*2+b*5+c*8

    C[0,2]=a*3+b*6+c*9

    C[1,0]=d*1+e*4+f*7

    C[1,1]=d*2+e*5+f*8

    C[1,2]=d*3+e*6+f*9

    C[2,0]=g*1+h*4+i*7

    C[2,1]=g*2+h*5+i*8

    C[2,2]=g*3+h*6+i*9

    ```


    Multiplying a vector with three points, [x, y, w], is basically the same as a
    matrix, except of three rows, there is only one. Matrix and vector multiplication
    for a row-major, 1 x 3x3 matrix is as follows:


    ```

    [m00, m01, m02]

    * [m10, m11, m12]

    * [m20, m21, m22]


    Vx = m00 * x + m10 * y + m20 * w

    Vy = m01 * x + m11 * y + m21 * w

    Vw = m02 * x + m12 * y + m22 * w

    ```


    If column-major matrices were used, then the vector is a column, not a row. Matrix
    and vector multiplication for a 3x3 * 3x1 column-major vector is as follows:


    ```

    [m00, m01, m02] [x]

    [m10, m11, m12] [y]

    [m20, m21, m22] [w]


    Vx = m00 * x + m01 * y + m02 * w

    Vy = m10 * x + m11 * y + m12 * w

    Vw = m20 * x + m21 * y + m22 * w

    ```'
