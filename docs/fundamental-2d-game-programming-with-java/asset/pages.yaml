    \ CLASS\n\nThe QuickLooper class is an updated sound loop event that can be opened\
    \ and closed only once, instead of every time the sound is played. This reduces\
    \ the latency for the sound event. Also, there is an addition to the processEvent()\
    \ method that keeps taking events off the queue. This prevents loop events from\
    \ getting backed up when the sound is used for multiple start and stop events\
    \ from rapid keypresses. Because there is a 50ms buffer, there can be a delay\
    \ for starting and stopping the sound in quick succession.\n\n```\npackage javames.completegame.admin;\n\
    import javames.sound.AudioStream;\nimport javames.sound.SoundEvent;\n```\n\n```\n\
    public class QuickLooper extends SoundEvent {\n    public static final String\
    \ STATE_CLOSED = \"closed\";\n    public static final String STATE_WAITING = \"\
    waiting\";\n    public static final String STATE_RUNNING = \"running\";\n\n  \
    \  public static final String EVENT_FIRE = \"fire\";\n    public static final\
    \ String EVENT_DONE = \"done\";\n    public static final String EVENT_OPEN = \"\
    open\";\n    public static final String EVENT_CLOSE = \"close\";\n\n    private\
    \ String currentState;\n    public QuickLooper(AudioStream audio) {\n        super(audio);\n\
    \        currentState = STATE_CLOSED;\n    }\n\n    public void open() {\n   \
    \     put(EVENT_OPEN);\n    }\n\n    public void close() {\n        put(EVENT_CLOSE);\n\
    \    }\n}\n```"
