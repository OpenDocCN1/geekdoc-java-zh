    \ the point's x value, the intersection is behind the point, and no intersection\
    \ occurs.\n\n```\nif(startAbove !=end) {\n  float m = (end.y - start.y) / (end.x\
    \ - start.x);\n  float x = start.x + (point.y - start.y) / m;\n  if(x >point.x)\
    \ {\n    inside = !inside;\n  }\n}\n```\n\n# Point in Polygon Special Cases\n\n\
    This algorithm works well long as the lines of the polygon do not intersect. The\
    \ two following polygons have crossing lines, and both treat the dark shaded sections\
    \ that are inside the polygon as if they were outside. See Figure 7.3.\n\n![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_164_0.png)\n\
    \nFigure 7.3\nPoint in Polygon Special Cases.\n© 2014 Timothy Wright.\n\nTo correctly\
    \ identify these overlapped sections, the direction where the line crosses the\
    \ ray can be counted. For every crossing, from the top to the bottom, the count\
    \ is incremented and for every crossing, going from the bottom to the top, the\
    \ count is decremented. If the number of crossings has the same number of clockwise\
    \ and counterclockwise crossings (the count is zero), then the point is outside.\
