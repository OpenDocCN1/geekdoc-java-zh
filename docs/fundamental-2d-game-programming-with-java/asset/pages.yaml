  md: "# Creating a Polygon Wrapper Class\n\nat opposite corners wouldn't register\
    \ a collision, even when their drawn objects overlap. See Figure 8.3.\n\n![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_199_0.png)\n\
    \n**Figure 8.3**\nWrapped Copies.\n© 2014 Timothy Wright.\n\nCreating a render\
    \ list that contains copies of each object solves the problem. The objects can\
    \ be drawn and the entire list can be used to check for collisions.\n\nThe objects\
    \ that wrap never get stuck because once the middle of the object is outside the\
    \ bounds of the world, it is wrapped by adjusting the position by the width or\
    \ height of the world. By always placing the wrapped position inside the bounds,\
    \ the object can never get stuck. See Figure 8.4.\n\n![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_199_1.png)\n\
    \n**Figure 8.4**\nPolygon Shift.\n© 2014 Timothy Wright.\n\n```\nif( p < min )\n\
    \  p += w;\n\nif( p > max )\n  p -= w;\n```\n\nOnce the position of the object\
    \ is wrapped, the AABB for the object is computed by finding the minimum and maximum\
    \ (x,y) values, as seen in Figure 8.5."
