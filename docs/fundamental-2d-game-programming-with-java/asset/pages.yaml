  md: '# Chapter 12 Threads


    These methods allow the BlockingQueue to pass messages between threads. Items
    passed to the put() method are added to the queue, and as long as the queue size
    has not been reached, the method returns immediately. It does not wait for some
    other thread to take the value. The get() method will block until there is something
    available. It is easy to imagine how this code uses the wait/notify method to
    wait for something to be placed into the queue before the method returns.


    There is another interesting aspect to using the queue to pass messages. The BlockingQueue
    example uses the following messages:


    ```

    enum Message {

    MESSAGE_ONE,

    MESSAGE_TWO,

    MESSAGE_THREE,

    POISON_PILL; // Quit :

    }

    ```


    Because the get() method will block until there is a way to shut down the thread
    we pass a special POISON_PILL message that the consumer recognizes (the intended)
    to shut down the thread.


    The BlockingQueueExample creates a Producer and Consumer, which both implement
    a Callable interface. Notice that the Producer uses a Void object for the return
    type.


    ```

    class Producer implements Callable<Void> {

    public Void call() throws Exception {

    return null;

    }

    ```


    The Void type is used for callable objects that not return anything. This way,
    the Future.get() can still be called to wait for the callable to finish and throw
    an exception if there is a problem.


    The runTest() method creates both the Producer and Consumer tasks and submits
    them to the thread pool. The method then calls the get() method of the consumer,
    which doesn''t return until the Producer has finished, sends the POISON_PILL message,
    and shuts down the thread. It finally stops the thread and returns.


    The Producer is given a message count and a sleep time. It randomly generates
    messages (not including the POISON_PILL) and sends the messages until the given
    count has been reached, sleeping between each message. Once it is finished, it
    puts the POISON_PILL message into the queue and exits.'
