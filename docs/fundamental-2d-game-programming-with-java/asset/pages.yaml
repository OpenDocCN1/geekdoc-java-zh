    ```\n\n# # ENABLING THREAD-SAFE KEYBOARD INPUT\n\nAt this point, it would be nice\
    \ to type some text and have it available. However, there are two problems with\
    \ the KeyboardInput class that needs to be fixed. The first is that the KeyListener\
    \ interface does not do anything with typed events. That is an easy to solve.\
    \ What is not easy to solve is the polling method of entering input can miss some\
    \ keypresses if the frame is low enough.\n\nFor example, if the frame rate is\
    \ polling only once every five seconds, repeated keypress will be missed. You\
    \ may have noticed in the previous examples when the frame drops low enough some\
    \ keypresses are missed. This is not acceptable when typing text. Even if a single\
    \ key is missed, it will be obvious and frustrating to the user.\n\nThe solution\
    \ is to capture all the events and iterate over them in the game loop that no\
    \ events are missed, regardless of the frame rate. The SafeKeyboardInput class\
    \ contains an inner class Event and an EventType enum with the following types:\n\
    \n+   - EventType.PRESSED\n- EventType.RELEASED\n- EventType.TYPED\n\nThe Event\
    \ object is combined with the keyboard event object and saved into the Event class.\
    \ The two lists of events, gameThread and eventThread, are used to capture and\
    \ iterate over these keyboard events. Inside each of the key listener methods,\
    \ the events are added to the event thread list. This ensures that no events are\
    \ missed.\n\nThe poll() method is also simplified. The eventThread and gameThread\
    \ lists are swapped, passing any events to the game loop and continuing to process\
    \ events while the game loop handles the previous keyboard events. Because the\
    \ event thread is used in the event thread and the game loop, all methods that\
    \ access the eventThread collection are synchronized."
