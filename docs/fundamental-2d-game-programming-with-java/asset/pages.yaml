  md: '# CHAPTER 8


    # GAME PROTOTYPE


    This chapter takes everything you''ve learned in the previous chapters and shows
    how to create a prototype space game. Although there are still too many elements
    missing to call this a complete game, enough tools are available to creating a
    prototype.


    One problem I had when first learning how to program was that there were so many
    examples using the various programming concepts—such as loops, variables, inheritance—but
    there weren''t a lot of examples of doing something real. The examples were either
    really simple, useless code snippets or incredibly complicated, poorly written
    programs that crammed in all the computer science they could, instead of using
    only what was needed to get the job done. The prototype game in this chapter doesn''t
    try to cram in everything; it instead tries to balance good class design with
    easy-to-understand code.


    Just like any other game, the very first problem wasn''t covered in any of the
    previous chapters. What happens when the space ship flies off the screen?


    # CREATING A POLYGON WRAPPER CLASS


    When making a 2D space ship game, the first big problem to solve is what happens
    when the ship gets to the edge of the screen. One solution is to keep the ship
    in the middle of the screen, and move the world around it. Without any support
    for loading files, and no level editor, this seems a bit ambitious. The second
    option is to bounce the ship around the screen when it hits the edge. That seems
    weird. The third option is to wrap the ship from one side to the other. Let''s
    go with the third method.'
