  md: '# # CHAPTER 3


    # ## TRANSFORMATIONS


    There are four different operations that you can do to a shape in 2D graphics.
    They are shown in Figure 3.1.


    +   - Translation—Moving an object up, down, left, or right.

    - Rotation—Spinning an object around a point.

    - Scaling—Growing or shrinking an object.

    - Shearing—Shifting an object in one or two directions.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_69_0.png)


    **Figure 3.1** Translation, Rotation, Scaling, and Shearing.

    © 2014 Timothy Wright.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# Chapter 3 Transformations


    Each of these operations can be performed in different ways. They can be done
    by hand, each coordinate in an object, or they can be concatenated into a matrix
    and then applied all at once. Each method has advantages and disadvantages, for
    learning how these transformations are applied, calculating each coordinate by
    hand is best.


    # USING THE VECTOR2F CLASS


    The Vector2f class, located in the javame.util package, is used to represent a
    location in space, as well as a direction. Notice that the 2D coordinate class
    has three values: x, y, and w. In order to use the matrix transformations to perform
    translation, there needs to be an extra coordinate to get the matrix work. So
    pay no attention to the extra “w” coordinate behind the curtain, it will be explained
    later.


    # Note


    > Those of you familiar with vector algebra may look at the source code follows
    and scream, "Wait! Points and vectors are not the same. Points have a w = 1, but
    vectors cannot be translated, and should have a w = 0." I will cover that later
    too, so don''t worry. :)


    Translation is very simple. To move the coordinate up, down, left, or right, the
    distance is added to the coordinate:


    ```

    x = x + tx;

    y = y + ty;

    ```


    Scaling is also simple. The coordinate values are multiplied by the scale factor,
    growing or shrinking them.


    ```

    x = x * sx;

    y = y * sy;

    ```


    Shearing is only a little more complicated, shifting values relative to the other
    coordinate values. Notice the temporary value that''s used to keep the old value
    of x until it is used to shear the y value. Without the temporary value, the updated
    values would be used to shear the y value instead of the original values. To shear
    the values, add to the x value the scaled value, and to the y value the scaled
    x value:


    ```

    float tmp = x + sx * y;

    y = y + sy * x;

    x = tmp;

    ```'
