  md: '# ADJUSTING THE VIEWPORT RATIO


    In the last example, the triangle stretches to fill the window, no matter what
    the size. It is possible to resize the window to push the triangle far from its
    original size, which is probably not the behavior a windowed game should have.
    Although it is important to be able to map to different sized viewports, it is
    also important to keep the ratio the same, so no matter how large or small the
    window is, the proportions remain correct.


    When you add a `ComponentListener`, the window will notify the application whenever
    it is resized. Therefore, no matter what the size, the ratio can stay the same.
    The `ComponentListener` has a few interfaces, but only the `componentResized()`
    method is necessary for detecting events:


    ```

    componentHidden(Component e)

    componentMoved(Component e)

    componentResized(Component e)

    componentShown(Component e)

    ```


    Once the resize event is detected, the viewport needs to be adjusted to that the
    ratio remains the same. Depending on the size of the window and the size of the
    viewport, some interesting sizes can occur. See Figure 4.8.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_123_0.png)


    **Figure 4.8**nWidth and Height Ratio.

    © 2014 Timothy Wright.


    If the adjusted viewport is centered in the current window, then no matter what
    size the window is, the viewport will grow or shrink to the largest size possible
    that still maintains the correct aspect ratio.'
