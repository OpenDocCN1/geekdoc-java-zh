  md: "# Using the Wait/Notify Methods\n\nEvery object has a wait() method which,\
    \ as long as a synchronized lock is held on that object, will block until it is\
    \ notified to wake up.\n\n```\nsynchronized( object ) {\n    while(conditionNotTrue())\
    \ {\n        object.wait();\n    }\n}\n```\n\nThe wait() method will block until\
    \ another thread obtains the object lock and notifies all threads waiting on that\
    \ object. It is necessary to use a while loop to check the condition, because\
    \ the wait() method may, under certain circumstances, wake up from the wait()\
    \ method without any classes waking the waiting threads. Just because the wait()\
    \ method returned, that doesn't mean that the condition is guaranteed to be true.\
    \ To wake up waiting threads, the notifyAll() method is used:\n\n```\nsynchronized(object)\
    \ {\n    object.notifyAll();\n}\n```\n\nThis all works when the wait() method\
    \ is called, the lock is released, only allowing other classes to obtain the lock.\
