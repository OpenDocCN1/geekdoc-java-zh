    The GameFramework class, located in the javagames.util package, combines full-screen
    and window frameworks into a single framework with hooks to allow customization
    with subclasses. Most of these methods will be familiar, with a few abstract methods
    and tricks to allow subclasses to perform some low-level tasks. The first thing
    to notice is:


    ```

    protected abstract void createFramework()

    protected abstract void renderFrame(Graphics g)

    public abstract int getScreenWidth()

    public abstract int getScreenHeight()

    ```


