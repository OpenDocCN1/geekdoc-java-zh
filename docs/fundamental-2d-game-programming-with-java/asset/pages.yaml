  md: "To update the KeyboardInput class to keep track of initial keypresses as well\
    \ as the keyboard state, an array of integer values is added. These values will\
    \ keep track of how many frames the key has been pressed. The code implementing\
    \ the KeyListener interface doesn't change at all, but the keyDown() method no\
    \ longer pulls the value from the keys array.\n\nThe poll() method synchronized\
    \ to protect the keys array, transfers the keyboard state from the boolean array\
    \ to the integer array. If the key is down, the value is incremented, otherwise\
    \ it is set back to zero. The keyDown() method now checks if the value is not\
    \ zero and a new method, keyDownOnce(), returns true when the value is exactly\
    \ one.\n\n```\npackage java.util;\nimport java.awt.event.*;\npublic class KeyboardInput\
    \ implements KeyListener {\n    private boolean[] keys;\n    private int[] polled;\n\
    \n    public KeyboardInput() {\n        keys = new boolean[256];\n        polled\
    \ = new int[256];\n    }\n\n    public boolean keyDown(int keyCode) {\n      \
    \  return polled[keyCode] > 0;\n    }\n\n    public boolean keyDownOnce(int keyCode)\
    \ {\n        return polled[keyCode] == 1;\n    }\n\n    public synchronized void\
    \ poll() {\n        for (int i = 0; i < keys.length; ++i) {\n            if (keys[i])\
    \ {\n                polled[i]++\n            } else {\n                polled[i]\
    \ = 0;\n            }\n        }\n    }\n\n    public synchronized void keyPressed(KeyEvent\
    \ e) {\n        int keyCode = e.getKeyCode();\n        if (keyCode >= 0 && keyCode\
    \ < keys.length) {\n            keys[keyCode] = true;\n        }\n    }\n}\n```"
