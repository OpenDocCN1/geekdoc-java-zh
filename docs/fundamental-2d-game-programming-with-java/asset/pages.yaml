    \nFigure 8.5\nMin Max AABB.\n© 2014 Timothy Wright.\n\nThis bounding box determines\
    \ if the object is outside the bounds of the screen and needs to be wrapped to\
    \ the other side.\n\nThe PolygonWrapper class, located in the javagames.prototype\
    \ package, contains methods to wrap polygons and positions. The constructor takes\
    \ the width and height of the world and coordinates the minimum and maximum vector\
    \ values. The hasLeftWorld() method checks the given position against the minimum\
    \ and maximum world coordinates. The wrapPosition() method returns a wrapped position\
    \ if the given position has left the bounds of the world. The wrapped position\
    \ is adjusted by the width and height of the world so the new position is never\
    \ outside the bounds of the world. The bounds of the polygon are computed as follows:\n\
    \n```\n// PolygonWrapper.java\nprivate Vector2f getMin(Vector2f[] poly) {\n  \
    \  Vector2f min = new Vector2f(Float.MAX_VALUE, Float.MAX_VALUE);\n    for (Vector2f\
