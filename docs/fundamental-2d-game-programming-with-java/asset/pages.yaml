    \ args) {\n  launchApp(new PolygonEditor());\n}\n```\n\n# DRAWING A SPRITE\n\n\
    The Sprite class is added to the javames.util package to handle drawing images\
    \ in pixel space to rectangles in world space. Just like the drawSprite() method\
    \ in the PolygonEditor, the Sprite class has a top-left and bottom-right vector\
    \ defining the bounding rectangle in world space.\n\nThe sprite can be drawn with\
    \ an optional rotation. The method first finds the screen size of the rectangle\
    \ and then, if the scaled image isn't the correct size, the original image is\
    \ scaled. The AffineTransform with a bilinear interpolation from Chapter 10 is\
    \ used to render the image. Remember that the AffineTransform class is column\
    \ major, so the transformations are in reverse order. The image is translated\
    \ to the center, rotated by the negative of the rotation angle (to take into account\
    \ the flipped y-axis in screen space), and finally transformed to the screen position."
