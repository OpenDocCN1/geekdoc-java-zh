  md: '# CALCULATING A REFLECTION VECTOR


    Once an intersection point is found, a reflection vector can be calculated. This
    vector is the direction the object would bounce off the line segment. See Figure
    15.21.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_494_0.png)


    Figure 15.21

    Reflection Vector.

    © 2014 Timothy Wright.


    The intersection point can be found with a line intersection test. All that is
    needed to calculate the reflection vector is the original vector and a perpendicular
    vector to the reflection segment. The reflection vector is calculated as follows:


    As shown in Figure 15.22, the reflection V is the original direction vector. It
    is reflected off of the line segment AB. The normal is a normalized vector perpendicular
    to the AB line segment.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_494_1.png)


    Figure 15.22

    Reflection Vector Proof.

    © 2014 Timothy Wright.'
