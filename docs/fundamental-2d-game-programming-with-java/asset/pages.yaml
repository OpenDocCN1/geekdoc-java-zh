  md: "# Using Threads in the Game Loop\n\nconcurrency library. It is good to learn\
    \ about these classes, because they provide some functionality not available with\
    \ the wait/notify methods. Notice that the lock object provides the condition\
    \ object used for notification. The objects are created as follows:\n\n```\nLock\
    \ lock = new ReentrantLock();nCondition cond = lock.newCondition();\n```\n\nTo\
    \ wait for an object, you call the condition await() method. The Lock class has\
    \ both lock() and unlock() methods that are used to acquire and release the lock.\
    \ A try/finally block is used to ensure that the lock is always released.\n\n\
    ```\nlock.lock();ntry {\n while (conditionNotNotify()) {\n    cond.await();\n\
    }\n} finally {\n lock.unlock();\n}\n```\n\nTo notify waiting threads, use the\
    \ signalAll() method:\n\n```\nlock.lock();ntry {\n cond.signalAll();\n} finally\
    \ {\n lock.unlock();\n}\n```\n\nAt this point, you might be wondering why anyone\
    \ would use these classes instead of the simpler wait/notify methods available\
    \ to all objects. The reason is that Lock/Condition objects have many methods\
    \ that allow for greater flexibility. For example, the wait/notify pattern uses\
    \ a synchronized block.\n\n```\nsynchronized(object) {\n // do stuff here}\n```\n\
    \nThat code will block until the lock is acquired, even if it waits forever. The\
    \ Lock object has other methods that can be used to acquire a lock, as follows:\n\
    \n+   * tryLock()—This method will try to acquire the lock and return true if\
    \ it is acquired. It will not block; returning false if the lock was not acquired.\n\
    \n+   * tryLock(long, TimeUnit)—This method can take a timeout value, and gives\
    \ up trying to acquire the lock after a set amount of time."
