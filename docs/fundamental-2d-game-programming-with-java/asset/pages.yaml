  md: '# USING THE CALLABLE TASK WITH THREADS


    There exists an Executor interface that can process Callable tasks and return
    Future objects. Two really cool features that make Callable objects different
    from Runnable objects are that Callable objects can return a result, and can capture
    and rethrow exceptions inside other threads. This is possible by using a Future
    object.

    The Callable interface is as follows:


    ```

    public interface Callable<V> {

    V call() throws Exception;

    }

    ```


    The ExecutorService contains a submit method, which executes a Callable task and
    returns a Future object.

    public interface ExecutorService extends Executor {

    <T> submit(Callable<T> task);


    The Future object from the executor has a get() method that will block until the
    Callable task has finished. It will return the result that was returned from the
    Callable method. If the call() method threw an exception, that exception will
    be rethrown so the software can handle the error in the current thread.


    The CallableTaskExample, located in the Javames.threads package, is a simple program
    to demonstrate using the ExecutorService to execute Callable tasks. It also demonstrates
    using the Future objects to get the results and exceptions from the tasks. The
    CallableTaskExample implements the Callable<Boolean> interface. The call() method
    returns a Boolean result. The task sleeps for few milliseconds, returns true or
    false, and even throws an exception when the random time is zero. The main() method
    uses the Executors to create a new cached thread pool.


    ```

    ExecutorService exec = Executors.newCachedThreadPool();

    ```


    The cached pool creates a new thread for each task, but keeps threads around for
    a while before destroying them. If other tasks are submitted, the cached threads
    are reused. Notice how the get() method from the Future object will not return
    until the Callable task is finished; it rethrows any exceptions thrown by the
    Callable task.


    The thread pool is shut down with the shutdown() method. It uses the awaitTermination()
    method to block until all the threads in the thread pool have finished.'
