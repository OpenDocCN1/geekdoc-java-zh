  md: "# Chapter 11 ■ Text\n\nThe processInput() method is called until all the events\
    \ in the list have been processed and the method returns false. After each event\
    \ is processed, the state of the keys are examined for keypresses.\n\nThere is\
    \ one issue that arises using this method. If five keys are pressed polling, then\
    \ the next state is polled, for there be five events. If the first event is a\
    \ pressed spacebar, then that key will be set as down once. Since there are no\
    \ spacebar events, the spacebar state will stay the same for all five events,\
    \ appearing to have been down once five times. The keyDown and keyDownOnce methods\
    \ are updated to check the current event code so that extra events are not processed.\
    \ Finally, the getTyped() method is added to return typed keys that can be used\
    \ to display typed text on the screen.\n\n```\npackage javames.util;\n```\n\n\
    ```\nimport java.awt.event.KeyEvent;\nimport java.awt.event.KeyListener;\nimport\
    \ java.util.LinkedList;\n\n```\n\n```\npublic class KeyboardInput implements KeyListener\
    \ {\n\n```\n\n```\nenum Event {\n    PRESSED,\n    RELEASED,\n    TYPED;\n}\n\
    ```\n\n```\nclass Event {\n    KeyEvent event;\n    EventType type;\n    public\
    \ Event(KeyEvent event, EventType type ) {\n        this.event = event;\n    \
    \    this.type = type;\n    }\n}\n\n```\n\n```\nprivate LinkedList<Event> eventThread\
    \ = new LinkedList<Event>();\nprivate LinkedList<Event> gameThread = new LinkedList<Event>();\n\
    \n```\n\n```\nprivate Event event = null;\nprivate int[] polled;\n\n```\n\n```\n\
    public SafeKeyboardInput() {\n    polled = new int[256];\n}\n```"
