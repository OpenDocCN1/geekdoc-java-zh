    Notice in the previous example that 1 is subtracted from the screen width and
    height we are used. This is because the actual pixel values are mapped to the
    screen, and although the screen width may be 10, the pixels go from 0 – 9, just
    like an array. If the actual width were used, the world coordinates were converted
    to screen coordinates, the last row and column the window would be drawn off the
    screen, which is not the desired intent. Setting the screen width to width – 1
    and the screen height to height – 1 keeps this from happening.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_118_0.png)


