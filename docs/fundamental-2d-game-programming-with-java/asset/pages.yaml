    # CHAPTER 7—“INTERSECTION TESTING"


    +   - The PointInPolygonExample class demonstrates testing the point-in-poly algorithm
    and is the first example to use the SimpleFramework code.


    +   - The OverlapExample class demonstrates AABB and circle-intersection testing
    as well as testing to see if it is inside the shapes.


    +   - The LineOverlapExample class uses the separating axis test to detect when
    lines overlap.


    +   - The RectOverlapExample class uses the separating axis test to detect when
    rectangles overlap.


    # CHAPTER 8—“GAME PROTOTYPE"


    +   - The PolygonWrapper class wraps the polygons from one side of the game window
