  md: "# Prototype Ship Class\n\nPrototypeShip code, located in the javagames.prototype\
    \ package, is mostly self-explanatory. The constructor sets some constants for\
    \ moving the ship and hard-codes the model points. There are set() and get() methods\
    \ for damage state, angle, thrust-ing, as well as methods to rotate the ship left\
    \ or right.\n\nThe launchBullet() method returns a new Prototype object translated\
    \ to the nose of the ship.\n\n```\n// PrototypeShip.java\npublic PrototypeBullet\
    \ launchBullet() {\n    Vector2f bulletPos=position.add(Vector2f.polar(angle,\
    \ 0.0325f));\n    return new PrototypeBullet(bulletPos, angle);\n}\n```\n\nThe\
    \ isTouching() method checks for collisions with every ship in the render list\
    \ with the given asteroid object. The cool part is the updatePosition() method,\
    \ which flies the ship around. First, the velocity is updated:\n\n$V_1 = V_0 +\
    \ at$$\n\nThe acceleration is inside the setThrusting() method. If the ship is\
    \ not moving forward, then the acceleration is 0 and the velocity remains the\
    \ same. Notice that the new acceleration vector uses the current angle, which\
    \ slowly changes the direction the ship is traveling.\n\n```\nVector2f accel =\
    \ Vector2f.polar(angle, curAcc);\n```\n\nNext, the velocity is kept below the\
    \ maximum value. If this wasn't performed, the ship would continue to gain speed\
    \ and eventually be becoming faster than the bullet. Notice that the smallest\
    \ value is used, so when the maximum value is not smaller than the actual velocity,\
    \ the maximum speed is 1.0 and nothing changes. Only when the maximum velocity\
    \ is smaller than the actual velocity is the speed constrained.\n\n```\nfloat\
    \ maxSpeed = Math.min(maxVelocity / velocity.len(), 1.0f);\nvelocity = velocity.mul(maxSpeed);\n\
    ```\n\nNext, friction is applied. Even though there isn't friction in space, I\
    \ wanted to add it to the ship so it would slow down eventually. If the ship is\
    \ not stopping, the friction will keep slowing it down.\n\n```\nfloat slowDown\
    \ = 1.0f - friction * time;\nvelocity = velocity.mul(slowDown);\n```"
