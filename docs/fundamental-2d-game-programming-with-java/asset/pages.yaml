  md: '# Chapter 18 Conclusion


    The following sections list all the example code presented in each chapter. Use
    this list as a reference to find a specific example.


    # ## CHAPTER 1—“HELLO WORLD”


    +   - The FrameRate class has been used throughout the book to measure the application
    speed.

    - The HelloWorldApp is the first game window example, but uses passive rendering
    to update the totally.

    - The RenderThreadExample is a simple example of using threads to create a game
    loop.

    - The ActiveRenderingExample is the active rendering game window with a custom
    loop thread.

    - The DisplayModeExample allows the user to switch to full-screen display mode.
    This is also the first example using Swing Components.

    - The FullRenderingExample combines active rendering and changing the display
    mode to create a full-screen game window.


    # ## CHAPTER 2—“INPUT”


    +   - The SimpleKeyInput and SimpleKeyboardExample classes demonstrate polling
    the keyboard during the game loop.

    - The KeyboardInput improves upon the example by adding the keyDown() and keyDownOnce()
    methods.

    - The SimpleMouseInput and SimpleMouseExample classes are the initial examples
    of polling the mouse the same way the keyboard is polled.

    - The RelativeMouseInput and RelativeMouseExample classes add and demonstrate
    the ability to keep the mouse cursor from leaving the game window, adding relative
    mouse movement.


    # ## CHAPTER 3—“TRANSFORMATIONS”


    +   - The Vector2f class is introduced. Used in VectorGraphicsExample, simple
    translation, rotation, and shearing are explained.

    - The PolarCoordinateExample converts from Cartesian to polar coordinates and
    back.'
