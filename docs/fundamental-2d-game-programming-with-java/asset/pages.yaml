  md: '# Chapter 4 Time and Space


    The wider window will scale everything, keeping the ratios between objects the
    same, no matter what size the window occupies. To start, you must define a width
    and height that define the game world. Many graphic systems use a (−1,1) window.
    See Figure 4.5.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_116_0.png)


    Figure 4.5 Normalized Device Coordinates.

    © 2014 Timothy Wright.


    This defines an area of $2 \times 2$ units that will be mapped to the screen,
    with the units being anything you want. If the game needs meters, call it meters.
    If the game is a planet game, maybe it''s miles or light years. It doesn''t matter,
    but it can help define the size of the objects and allow for a sense of distance
    on the screen. For this example, assume the units are meters, and the usable area
    is $2 \times 2$ meters, or about $6.56 \times 6.56$ feet.


    To map the world area to the screen, you first scale the area to the screen width
    and height. Next, flip the y-axis. Finally, translate the area so when the values
    are drawn to the screen they are correct. See Figure 4.6.'
