    Figure 17.1

    Game Loading.

    © 2014 Timothy Wright.


    This state loads all the game resources using the thread pool method demonstrated
    in Chapter 12, “Threads.” The items loaded are:


    +   - Background image

    - High score file

    - Asteroid models and sprites

    - Ship model and sprites

    - Thruster, explosions, and missile sounds


    The updateObjects() method checks the progress of all the resource loading and
    updates the load percentage. The render() method draws the loading progress. When
    all the game resources are loaded, the state transitions to the PressSpaceToPlay
    state. Remember, for the ambient sound, there are differences depending on which
    version of Java you are using.'
