  md: "# USING AN AXIS ALIGNED BOUNDING BOX (AABB) FOR INTERSECTION TESTING\n\nAn\
    \ axis aligned bounding box (AABB) is a rectangle that has edges parallel to the\
    \ x-axis and y-axis. See Figure 7.6.\n\n![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_171_0.png)\n\
    \nBecause the rectangle is not rotated, it is an easy shape to use for intersection\
    \ testing. The shape can be represented with only a minimum and a maximum value,\
    \ as shown in Figure 7.7. Note that AABBs cannot be rotated.\n\n![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_171_1.png)\n\
    \nTransforming and drawing an AABB is straightforward.\n\n```\nprivate void drawAABB(Vector2f\
    \ min, Vector2f max ) {\n    Matrix3x3f view = getViewportTransform();\n\nVector2f\
    \ topLeft = new Vector2f(min.x, max.y);\n    topLeft = view.mul(topLeft);\n\n\
    Vector2f bottomRight = new Vector2f(max.x, min.y);\n    bottomRight = view.mul(bottomRight);\n\
    \nint rectX = (int)topLeft.x;\nint rectY = (int)topLeft.y;\n```"
