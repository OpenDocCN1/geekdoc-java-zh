  md: '+   - GameInformationState—Displays a “Thank You” message to friends and family


    +   - LevelStarting—Displays the current level and lets the player catch their
    breath


    +   - LevelPlaying—The meat of the game (this is the only part a beginner thinks
    is to make a game


    +   - GameOver—All good things come to an end


    +   - EnterHighScoreName—Lets the user enter his name for his score


    There is also a build.xml script for packaging the complete game.


    # Resources And Further Reading


    I also recommend the following books that have been referenced in various chapters
    throughout the book. They are full of bits of wisdom.


    Akenine-Moller, Tomas, Eric Haines, Real-Time Rendering, 2nd Edition, A K Peters,
    2002.


    Ericson, Ernest, Real-Time Collision Detection, Focal Press, 2004.


    Goetz, Brian, Java Concurrency in Practice, Addison-Wesley, Upper Saddle Wesley,
    2006.


    Oaks, Scott, Henry Wong, Java Threads, 3rd Edition, O’Reilly, Sebastopol, CA,
    2004.


    Adams, Ernest, Fundamentals of Game Design, (3rd Edition), New Riders, 2013.


    Rogers, Scott, Level Up! The Guide to Great Video Game Design, Wiley, 2010.


    Schell, Jesse, The Art of Game Design: A book of lenses, CRC Press, 2008.


    Salen Katie and Eric Zimmerman, Rules of Play: Game Design Fundamentals, the MIT
    Press, 2003.


    I am of the belief that a prototype game or core idea is not fun, no amount of
    polish will make it fun. The only way to find fun game is to experiment and find
    many times. This is the spirit of game development: the courage to try new things
    and strive not to repeat the same game, but to create something fresh and new.


    This is why I have no problem giving away instead of keeping it to myself. After
    all, if other people aren’t making great games, what am I going to play in my
    spare time? The wonderful thing about computer games is that there is always room
    for another great!


    Now that you have tools necessary to create a game, get busy...'
