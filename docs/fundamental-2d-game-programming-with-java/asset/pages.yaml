    \nCartesian coordinates are represented as a pair of (x,y) values. Polar coordinates\
    \ are represented as an angle and a distance. See Figure 3.3.\n\n![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_79_0.png)\n\
    \nFigure 3.3 Cartesian vs. Polar Coordinates.\n© 2014 Timothy Wright.\n\nInstead\
    \ of an (x,y) pair, polar coordinates are in the form (r,a), where r is a distance\
    \ (radius), and a is an angle. Because Java's trigonometric functions use radians,\
    \ all angles are assumed to be in radians. It is easy to convert between the two\
    \ representations, however:\n\n```\nMath.toRadians( double degrees )\nMath.toDegrees(\
    \ double radians )\n```\n\nTo convert from the Cartesian coordinates to the polar\
    \ coordinates, the point can be treated as a triangle, using trigonometry to solve\
    \ for the desired values."
