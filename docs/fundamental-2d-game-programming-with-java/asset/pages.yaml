  md: '# Chapter 6 Vector2f Updates


    The dot product proof, as illustrated in Figure 6.10, is as follows:


    ```

    $A * B = ||A|| ||B|| \cos(\theta A - \theta B)$

    $A * B = AB \cos(\theta A) \cos(\theta B) + \sin(\theta A) \sin(\theta B)$

    $A * B = A \cos(\theta A) B \cos(\theta B) + A \sin(\theta A) B \sin(\theta B)$

    ```


    Reviewing Cartesian polar conversions:


    ```

    $A_x = A \cos(\theta A)$

    $B_x = B \cos(\theta B)$

    $A_y = A \sin(\theta A)$

    $B_y = B \sin(\theta B)$

    $A * B = A_x B_x + A_y B_y$

    ```


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_156_0.png)


    **Figure 6.10**nDot Product Angle.

    © 2014 Timothy Wright.


    The dot product has the following mathematical properties:


    ```

    $A * B = B * A$

    $C * (A + B) = C * A + C * B$

    $C(A * B) = CA * B$

    $A * A^\perp = 0$

    ```


    The last property is important, and is used for the basis of many mathematical
    proofs. Because the angle between two perpendicular vectors is always zero, their
    dot product is always zero.


    ```

    $A * A^\perp = ||A|| ||A^\perp|| \cos(90^\circ)$

    $A * A^\perp = ||A|| ||A^\perp|| (0)$

    $A * A^\perp = 0$

    ```


    The final important point is that the dot product returns a scalar value, not
    as a vector, as shown in Figure 6.11. To project one vector onto another, the
