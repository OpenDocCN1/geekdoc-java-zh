    \ path of the build file.\n\n+   - ant.project.name—The name attribute of the\
    \ project tag.\n\nSee the documentation on the ANT website for more information\
    \ about the built-in properties.\n\nThe following is a simple ANT script with\
    \ a single target that prints Hello World! with the echo tag:\n\n```\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<project name=\"hello-world\" default=\"default\"\
    >\n  <description>\n    This is a simple Hello World script\n  </description>\n\
    \  <target name=\"default\" description=\"target description\">\n    <echo>Hello\
    \ World!</echo>\n  </target>\n</project>\n```\n\nTo run this script, you have\
    \ two options. If the script is saved with the name build.xml, then simply pointing\
    \ the command prompt to the same directory and typing ant will cause ANT to scan\
