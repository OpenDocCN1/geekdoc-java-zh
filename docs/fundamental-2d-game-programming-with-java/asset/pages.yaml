  md: '# CHAPTER 17—“SPACE ROCKS”


    The game objects consist of:


    +   * Bullet—Bullets fired from the ship

    * PolygonWrapper—Utility class to wrap objects

    * Particle—A single particle entity

    * Asteroid—A space rock

    * AsteroidFactory—Creates random space rocks

    * AsteroidExplosion—Uses the particles to create the explosion

    * Ship—Represents the flying ship object

    * ShipFactory—Creates new ship objects

    * ShipExplosion—Ship explosion when the ship is destroyed


    Administration classes are are as follows:


    +   * GameConstants—All game constants in one class

    * Acme—Helper methods without a home (cue sad movie)

    * QuickLooper—Only loads sound once

    * QuickRestart—Only loads sound once

    * HighScoreMgr—Deals with the high-score file


    Game state classes are are as follows:


    +   * GameState—Keeps track of the current level, score, and lives

    * Score—A Comparable<> object to sort the scores

    * State—Base class for the state management state

    * StateController—Key class for the entire game


    Complete game classes are are as follows:


    +   * CompleteGame—Game framework with the main()

    * GameLoading—Game state to load resources

    * AttractState—Base class for various attract screens

    * PressSpaceToPlay—Spacebar starts the game

    * HighScore—Displays the top ten scores'
  merge: -1
