  md: '# Chapter 4 Time and Space


    The new size is found using the ratio of the two windows:


    ```

    new width = viewport width

    new height = viewport height

    new width = new height * viewport width

    new height = new width * viewport height

    ```


    To calculate the new size of the viewport, either the width or screen height can
    be chosen to calculate the other value so that the ratio will remain correct.
    Although you can perform checks to determine which dimension to use, it is just
    as easy to pick one, if we see the new ratio will fit in the current window, and
    if it is too big, use the one.


