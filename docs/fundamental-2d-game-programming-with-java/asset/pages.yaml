  md: '# CHAPTER 15


    # COLLISION DETECTION


    Collision detection can be an important part of many games. Although the algorithms
    presented in Chapter 7, "Intersection Testing," are important, they all lack one
    very important thing. None of them actually returns the point of collision. For
    creating games where objects hit each other and react correctly (or at least correctly
    enough), it is necessary to not only determine the exact point of the collision,
    but handle the collision with a response, such as bouncing in another directions,
    or blowing up.


    The following sections discuss:


    +   - Simple collision response

    - Rectangle-line intersection

    - Circle-line intersection

    - Line segment intersection

    - Collision response


    Even though some of the math is more involved than in previous chapters, none
    of the algorithms covered is really hard, and effort has been made to explain
    them thoroughly.


    # BOUNCING BALLS WITH COLLISION DETECTION


    The simplest collision response is to bounce objects off vertical and horizontal
    lines. In order to simulate the collision response of an object against an x-
    or y-axis, each component of the velocity vector is checked independently. See
    Figure 15.1.'
  merge: -1
  pgno: 461
- img_proc: true
  md: '![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_462_0.png)


    **Figure 15.1** Bounce Vector.

    © 2014 Timothy Wright.


