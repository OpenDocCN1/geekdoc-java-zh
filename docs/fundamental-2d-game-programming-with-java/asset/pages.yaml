    the screen completely and then bring it back on the other side, as shown in Figure
    8.1.


    ![](img/4e28f740fc72bd0df3ccd1fd8b4d9920_198_0.png)


    **Figure 8.1**nWrap Polygon.

    © 2014 Timothy Wright.


    Trying this idea seemed simple enough; you use a bounding box around the ship
    to test when it leaves the screen and move it to the other side. This method has
    issues: one is that it is possible to fly the ship so only a very tiny piece is
    visible and very hard to hit, and the second is that the ship can get stuck off-screen.
    It doesn''t happen often, but it can be very hard to hit the objects when most
    of the polygon is off the screen. Because of these issues, wrapping the objects
    seems like a better choice than waiting until the entire object is off the screen.


    Wrapping the objects so that any part off one side of the screen wraps to the
    other side is also fraught with peril. It is possible, when you''re wrapping an
