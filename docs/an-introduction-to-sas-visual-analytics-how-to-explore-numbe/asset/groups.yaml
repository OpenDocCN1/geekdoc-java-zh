    \ Transactions by Week\n- Percent of Transactions by Continent filters Transactions\
    \ by Month\n- Percent of Transactions by Continent filters Transactions by Week\n\
    - Total Transactions by Month filters Transactions by Week\n\n## SAVING THE REPORT\n\
    \nNow that we are all done with the development of the report, we want to save\
    \ before anything else. Saving works like other applications, and you can just\
    \ select the File menu in the top toolbar and then click Save As. This brings\
    \ you to the Save window that gives you SAS locations to save.\n\nUnder SAS Folders,\
    \ you have a few options to choose from. My Folder is location specific to your\
    \ account. Anything you put in here cannot be seen by anyone else. All the other\
    \ folders are public, which means that other people on the system can access them.\
    \ Until your reports are finalized, you might want to keep them in My Folder so\
    \ that no one edits them by accident.\n\n## REVIEWING THE REPORT\n\nOur report\
    \ is complete! We have thought about what we wanted to learn from this report,\
    \ set up all the objects and data for it, and then customized it with connections\
    \ and filters so that we can get multiple views of our data. After all that developing,\
    \ now we can move into the data analysis part and see whether we can find anything\
    \ interesting in the data. Users can go about finding their analysis in any way\
    \ they want, but it is also important to go back to the questions we wanted to\
    \ answer before we started developing the report. We had an interest in learning\
    \ about customers buying behavior and where we were getting the most profit from\
    \ them. Here’s some intriguing findings that can be found in this report:\n\n\
    - Struggling Thrift Product Line\nThe Thrift product line only makes up 1.27%\
    \ of sales and that decreases to 0.40% over the last five years (2009-2013). Being\
    \ such a small part of the business, this product line needs more investigating\
    \ to find out if it is even profitable enough to be keeping up.\n\n- Customers\
    \ do not go for Plush on Fridays\nMost of the product lines either get a little\
    \ higher (Bead, Gift, Beach) or lower (Game, Figure, Promo) with sales on Fridays\
    \ compared to the rest of the week. This can be attributed to the purpose that\
    \ each line serves. For example, people tend to go to the beach more on the weekends.\
    \ So Friday would be a major shopping day for that line. However, the Plush product\
    \ line sees an 80-85% drop on Friday sales, which is an extreme difference compared\
    \ to all of the other lines. What could cause customers to only buy Plush toys\
    \ Monday through Thursday?\n\n- Beach items only sell in the summer\nOf course,\
    \ there would be some seasonality with the beach line, but it turns out to be\
    \ very dramatic. From October to March, there is little to no sales for beach\
    \ items; and in the Europe stores, they do not even attempt to sell anything in\
    \ those months. This requires some further inventory analysis to make sure that\
    \ we are selling all of our beach products off before those months come each season.\n\
    \nThese actionable insights are just a sample of what can be found in that single\
    \ data set. By setting up a report and using SAS Visual Analytics to dive into\
    \ the data, we can analyze data much quicker compared to querying a table.\n"
  mdcn: "\n\n## 第一部分\n\n## 入门\n\n本部分提供了 SAS Visual Analytics 的教程。你将学习如何通过 SAS Home\
    \ 访问内容。然后，你将构建一个简单的报告。在下一章节中，你将学习创建性能仪表板的基础知识。在完成这些章节后，你将学习如何使用 Data Builder 加载数据。\n\
    \n- 第 1 章 访问内容\n本章解释了如何使用 SAS Home 页面，该页面提供了应用程序功能和内容的网关。你将了解主页功能以及一些报告查看器（Report\
    \ Viewer）功能。\n\n- 第 2 章构建你的第一份报告\n本章是 Visual Designer（也称为 Report Builder）的教程。它将向你展示如何构建简单的报告，并提供基本产品功能的概述。主题包括界面概览、添加数据、创建简单报告以及如何控制报告的外观和感受。\n\
    \n- 第 3 章构建你的第一个仪表板\n本章是关于该工具高级功能的教程。你将看到如何创建一个性能仪表板，它解释了如何思考数据、确定最佳布局以及使用额外功能。\n\
    \n- 第 4 章使用 Data Builder\n本章将向你展示如何处理数据将其加载到 SAS LASR Analytic Server 中。\n\n##\
    \ 访问内容\n\nAWS Video Analytics 允许你同步或异步调用任何视频函数。当你调用一个函数时，它会返回一个反序列化对象，然后你可以使用它来访问视频内容。例如，当你调用视频函数时，你需要将内容传递给它并对其反序列化。\n\
    \n这从对内容进行解marshalling开始。你通过 SDK 的各种函数获取内容。\n\n## 访问内容的方法\n\n当你通过 AWS Video Analytics\
    \ 访问内容时，可以使用两种方法之一。根据你的用例，每方法都有其优势。\n\n### 通过缓冲区访问内容\n\n当你通过缓冲区访问内容时，AWS Video\
    \ Analytics 返回一个包含视频内容的缓冲区。当你想要使用其他库自己处理视频内容时，这种方法非常有用。\n\n### 通过对象访问内容\n\n当你通过对象访问内容时，AWS\
    \ Video Analytics 返回一个包含视频内容的对象。当你想要使用 AWS Video Analytics 提供的内置函数和服务时，这种方法非常有用。\n\
    \n当你想要直接使用 AWS Video Analytics 函数时，可以使用这种方法。当你不想自己处理视频内容时，这种方法也很有。\n\n### 通过媒体\
    \ URL 访问内容\n\n当你通过媒体 URL 访问内容时，AWS Video Analytics 返回视频内容的媒体 URL。当你想要使用其他播放器流传输视频内容时，这种方法非常有用。\n\
    \n当视频文件存储在 Amazon S3 时，还有其他访问内容的方法。情况下，你可以使用预签名 URL。\n\n## 理解角色\n\n要使用 AWS Video\
    \ Analytics，你需要创建一个 IAM 角色。该角色赋予 AWS Video Analytics 访问其所需的 AWS 资源的权限。\n\n当你创建一个\
    \ IAM 角色时，你需要定义信任策略。该策略定义了允许哪些实体假设该角色。\n\n## 创建集合\n\n你可以使用 AWS Video Analytics\
    \ 控制台创建集合。集合是一组相关的视频。\n\n1. 登录 AWS Video Analytics 控制台。\n2. 从左侧菜单选择集合（Collections）。\n\
    3. 点击创建集合（Create collection）按钮。\n4. 为你的集合命名并点击创建（Create）。\n\n集合创建后，你可以向其中添加视频。\n\
    \n查看结果\n\n推荐 / 播放列表 / 历史 / 主题 / 教程 / 设置 / 支持 / 获取应用 / 注销\n\n© 2018 Safari。服务条款\
    \ / 隐私政策\n\n## 第二章：构建你的第一份报告\n\nSAS Analytics Designer（简称 Designer）是允许你构建报告和仪表板的\
    \ SAS Visual Analytics 应用程序。可以通过 Web 应用程序访问 Designer。一旦在 Designer 中准备好内容，就可以在\
    \ SAS Analytics Viewer 或通过 SAS Mobile 应用程序进行查看。你还可以从 Designer 导入并访问数据。\n\nDesigner\
    \ 的优点之一是你在构建报告时不需要编写代码，这对于可能不精通代码的分析师来说非常有帮助。表格、图表和其他对象都通过拖放功能进行控制。所有对象属性都可以使用屏幕选项进行设置。甚至创建新的也涉及通过引导式界面！在本章中，我们将介绍如何访问和导航到\
    \ Designer。从那里，你将被引导创建一个初始报告，包括使用基本对象、创建新数据项以及设置对象之间的交互。\n\n### 访问 Designer\n\n\
    你可以通过直接链接或导航到 SAS Home 访问 Designer。底图显示了 Hub 上的哪些位置可以引导你进入 Designer。\n\n图 2.1\
    \ 如何从 Hub 进入 Designer\n\n你可以使用下拉列表链接到系统上的应用程序，包括 Designer。**创建内容（Create Content）**下的**创建报告（Create\
    \ Report）**瓷磁片也会链接到该位置。\n\n如果你知道服务器和端口号，也可以直接链接到 Designer。链接结构如下：\n\nhttp://<server:port>/SASVisualAnalyticsDesigner\n\
    \n### 介绍 Designer 布局\n\n当你导航到 Designer 时，你将进入主屏幕，该屏幕由三个用于开发的不同区域组成。\n\n图 2.2 Designer\
    \ 的区域\n\n左窗用于数据、对象和报告的清单。中间区域是设计和结构化报告的画布。右窗包含多个标签页，允许对对象进行控制。\n\n### 使用画布\n\n\
    画布是用户创建报告的工作空间。它被分为多个层级，包括提示（prompts）和部分（sections）。\n\n图 2.3 画布的层级\n\n字母 A、B、C\
    \ 和 D 代表画布的层级。随着你向上移动，每个层级都负责其下方的内容。设置如下：\n\n- 主体（Body）——这是可以放置对象并填充数据项的地方。\n\
    - 部分提示（Section Prompt）——该层级作为过滤器，控制主体中的对象。\n- 部分（Sections）——这里是报告各个部分的所在，每个部分都有自己的提示和主体。\n\
    - 报告提示（Report Prompt）——类似于部分提示，该提示控制跨整个报告的数据。\n\n### 使用左窗\n\nDesigner 的左窗是你访问数据、对象和报告清单的地方。当你正在工作时，这里可以开始构建报告。该区域设置了四个标签页，用于每个操作。通过点击面板右上角的下拉列表，你可以开启或关闭显示的内容。\n\
    \n图 2.4 Designer 的左窗\n\n- 对象（Objects）——这是你可以将各种对象拖到报告主体的地方。此标签页分为对象类别，包括表格、图表和其他容器。所有对象都可以进入主体（参见图\
    \ 2.3）。\n- 数据（Data）——这是你可以导入数据并查看每个源所有数据项的地方。通过点击选择数据源（Select data source）下拉菜单，你可以访问\
    \ LASR 中的任何数据集。一旦引入数据集，数据项就会填充部分。你可以通过更改这些值来操纵数据在画布上的显示方式。数据标签页的最后重要部分是顶部的箭头。\n\
    - 导入（Import）——可以用于在 SAS Visual Analytics 中创建其他报告。如果对于特定的对象、部分或整个报告，你可以找到该项并将其拖到报告。\n\
    - 共享规则（Shared Rules）——这是你可以为适用于多个部分的对象创建显示规则的地方。这在经常使用仪表板的情况下非常有帮助。显示规则和对象将在第\
    \ 3 章进一步介绍。\n\n### 使用右窗\n\n右窗是用户控制报告部分和对象属性的地方。属性包括标题、外观、过滤和其他自定义设置。每个标签页都可以用于对象，但只有某些可以用于整个部分或报告。\n\
    \n图 2.5 Designer 右窗的标签页\n\n- 属性（Properties）——这是唯一一个具有对象、部分或报告选项的标签。根据你选择了哪一个，标签内的选项也不同。在报告层级，你可以更改标题、为报告设置描述并控制部分和报告提示。从报告层级，可以通过选择任何部分来更改标签层级。\n\
    \ 布局（Layout）提供了平铺（tiled）或精确（precision）的选择。平铺式更符合用户习惯，因为当你添加每个对象时，画布只是不断对半。然后你可以调整拆分。精确式让你对画布上的每个对象具有完全控制权。你可以更改高度和宽度，就像在文档中那样拉伸和缩小。这让你对画布布局有更多的控制，但应在更熟悉应用程序后使用。\n\
    \n在对象级别，属性标签页可以根据所选对象而异。始终有名称、标题和描述的设置。标题是显示在画布上的内容，名称是跨报告引用对象的方式。其余选项可以包括从轴设置、确定图例的位置和位置或如何处理数据分组。\n\
    \n## 构建你的第一份报告\n\n准备工作可以节省你许多小时的工作，随着经验的增加，你会自然这样做。然而，当你刚开始此过程时，在开始开发之前有几件事需要考虑。\n\
    \n- 你想知道什么？\n将数据字段放入图表并查看计数可以让你对数据产生一些洞察，但这仅仅是应用程序功能的冰山一角。提前思考你真正感兴趣的数据字段是好的。如果你比较例如随时间变化的产品线销售额，是否会产生可操作的洞察？列出这些内容有助于你保持进度以获得你寻找的答案。\n\
    \n- 你有正确的数据吗？\n无论是从本地机器导入数据还是从数据库拉取，确保你需要的字段格式正确至关重要，这样你就可以开始考虑尝试回答的问题。有时在将数据添加到应用程序之前，源需要进行连接或转置，以确保所有内容以正确的方式供用户。此外，某些数据计算可能需要在应用程序中完成，以确保每个计算的所有元素都完整。例如，如果你想查看销售物品的利润，你需要源数据中它们的销售价格和制作成本。现在，这些操作在本章以及书的后续章节中介绍，有助于制作更好的报告。\n\
    \n### 添加数据\n\n创建额外对象的步骤如下：\n\n饼图（右上角）\n1. 名称和标题：按大洲划分的交易占比（加粗，16 磅字体）。\n2. 在数据标签页下，勾选数据标签（Data\
    \ Labels）。\n3. 取消其他切片。\n4. 取消勾选图例（Show Legend）。\n5. 数据皮肤：哑光。\n6. 角色：大洲，度量。\n\n\
    折线图（左下角）\n1. 名称和标题：按月份划分的总量（加粗，16 磅字体）。\n2. 数据皮肤：哑光。\n3. 角色：月份，度量。\n\n柱状图（右下角）\n\
    1. 名称和标题：按星期划分的交易总量（加粗，16 磅字体）。\n2. 数据皮肤：哑光。\n3. 角色：星期，度量。\n\n当你完成所有操作后，你的报告应该看起来像这样：\n\
    \n图 2.12 添加了所有对象的报告\n\n在图中，我们创建了一份显示客户整体购买分析的报告。我们可以看到客户在哪些方面花费最多、来自世界的哪个地区以及发生的月份和日期。然而，这只是数据的静态视图。在查看此报告后，你可能想了解特定产品线的地理分布或客户购买最多的月份。在下一部分，我们将开始连接这些对象，使此报告变得动态，你可以访问数据分析部分。\n\
    \n## 处理数据对象\n\n对于你正在进行分析的每个报告，你不仅希望屏幕上尽可能显示数据，还希望给用户提供数据的多种视图。通过特定条件过滤数据让用户能够从他们感兴趣的角度查看数据或产生想法。这可以是特定的日期范围、类别或他们认为合适的其他条件。以这种方式拆分数据让你看到更多关于数据的可视化内容，从而对你所研究的内容产生额外的洞察。\n\
    \n在 Designer 中，有多种过滤数据的方法：\n- 使用数据源过滤器（Data Source Filter）。\n- 在对象的过滤器标签页中添加过滤器。\n\
    - 导航提示。\n- 在交互（Interactions）标签页设置交互。\n\n数据源过滤器位于左窗的数据标签页。当你点击下拉菜单时，有一个创建新数据过滤器的选项。这是处理数据之前放置在整个数据集上的过滤器。一旦设置完成，所有数据项都会被过滤\n\
    \n### 使用过滤器标签页\n\n另一种方法是在处理对象时使用右窗的过滤器标签页。在这里，你可以选择特定的数据项并过滤掉某些值，以便显示某些行。当你进入标签页时，可以从下拉列表中选择任何项，也可以创建自己的。在我们的报告中，我们知道我们要关闭亚洲，因为那里变得不再盈利，尽管金额很小，但我们想要大洲的分布。我们报告的操作步骤如下：\n\
    \n1. 进入过滤器（Filters）标签页。\n2. 确保第一个下拉列表中选择了“按大洲划分的交易占比”。\n3. 点击第二个下拉列表并选择“大洲（Continents）”。\n\
    4. 点击添加过滤器（Add Filter）。\n5. 取消选择亚洲（Asia）和大洋（Oceania）。你应该能看到饼图更新。\n\n### 通过报告和部分提示过滤\n\
    \n如果我们想让用户控制过滤内容，有两种方法。一种方法是通过位于画布顶部的报告和部分提示。你可以在画布的这些区域放置控制对象，从而控制过滤到部分的数据。报告提示过滤所有部分，部分提示过滤所有对象。在提示中使用的控制对象列如下：\n\
    \n- 对象（Object）——描述：最适用于\n- 下拉列表（Drop down list）：列出下拉菜单中的所有可能值。\n- 多值类别（Categories\
    \ with many values）：以带状形式显示，列出特定类别的所有值。\n- 少数值类别（Categories with only a few values）：文本输入，类似于搜索字段，这是一个允许你输入文本的文本框。\n\
    - 描述性类别：你可能想要搜索关键词\n- 滑块（Slider）：当你根据根据时间范围过滤时最适用。与日期配合良好。\n- 日期（Dates）：下拉列表控制无法在部分提示中使用\n\
    \n### 添加滑块对象\n\n对于我们的报告，我们将在报告中添加一个滑块。这和其他对象一样可以通过拖放操作完成。我们报告的操作步骤如下：\n\n1. 在对象的（Objects）标签页下，将滑块拖到画布的提示部分。\n\
    2. 在角色（Roles）标签页中将“交易年份（Transaction Year）”作为度量/日期添加。\n3. 对象随后填充数据字段中的最小值和最大值，如下所示：\n\
    \n你可以修改滑块上的三角形以获取你想查看的范围。如果将三角形放在同一年，则数据将过滤为那一年。设置三角形后，你会看到对象内的数据更改为它们过滤报告的方式。记住，这过滤了部分的所有数据。\n\
    \n### 添加对象交互\n\n让用户在 SAS Visual Analytics 中进行过滤的另一种方法是构建对象之间的交互。在本章前面提到，交互（Interactions）标签页是用于连接对象和部分的方法。在本部分，我们只专注于连接对象。但你也可以将对象连接到其他部分、报告、信息窗口甚至外部链接。可以通过进入部分中对象的交互标签页并点击新建（New）下拉菜单来实现。在这里，你可以找到设置到部分之外区域的方法。\n\
    \n### 创建交互\n\n我们报告的操作步骤如下：\n\n1. 确保选择了“按产品线划分的利润占比（Percent of Profit by Product\
    \ Line）”柱图。交互标签页可以用于每个对象，正如我们想要的那样。\n2. 在交互标签页中选择新建交互（New）。\n3. 保持第一个选择但更改下拉列表，使其读取为“按产品线划分的销售占比（Percent\
    \ of Sales by Product）”。\n4. 点击确定（OK）。\n\n当你点击确定时，对象之间的连接就建立了。你会注意到如果你点击饼图中的任何产品线，饼图中的数据会变化。过滤工作就像任何其他方式。如果建立了对象之间的连接并选择了一个值，刷（Brushing）会高亮值而不是隐藏它们。由于我们正在处理聚合，刷选项不起，更适用于散点图等单个点。\n\
    \n### 使用交互视图\n\n一种交互很好用，但如果有多个对象，你可能希望设置交互以便观众可以深入研究数据。另一种更直观的交互方法是使用交互按钮。当你点击任何对象中的此按钮时，会调出部分的所有对象。我们为报告设置的某些交互如下：\n\
    \n- 按产品线划分的利润占比按月份过滤\n- 按产品线划分的利润占比按星期过滤\n- 按大洲划分的交易占比按月份过滤\n- 按大洲划分的交易占比按星期过滤\n\
    - 按月份划分的总量按星期过滤\n\n你的交互应该像这样：\n\n图 2.13 添加了参考线的柱状图\n\n## 保存报告\n\n现在我们已经完成了报告开发，在任何其他事情之前想要保存。保存与其他应用程序一样，你可以选择顶部工具栏上的文件（File）菜单，然后点击另存为（Save\
    \ As）。这将带你进入保存窗口，窗口提供了保存所需的 SAS 位置。\n\n在 SAS 文件夹下，你有几个选项可以选择。我的文件夹（My Folder）是针对你账户的。你放在这里的任何内容其他人都看不到。所有其他文件夹都是公共的，这意味着系统上的其他人可以访问它们。在报告定稿之前，你可能希望将它们留在“我的文件夹”中，以免意外编辑。\n\
    \n## 检查报告\n\n我们的报告完成了！我们思考了想从此报告中学习什么，设置了它所有的对象和数据，然后通过连接和过滤器进行自定义，以便我们获取数据的多种视图。在完成所有开发后，现在我们可以进入数据分析部分，看看是否能从数据中发现有趣的内容。用户可以用他们喜欢的任何方式寻找分析，但在开始开发报告之前回到我们想要回答的问题也是重要的。我们对了解客户购买行为以及我们从他们获得最大的利润感兴趣。以下是报告中可以发现的一些有趣发现：\n\
    \n- 挣扎的廉价产品线（Struggling Thrift Product Line）\n廉价产品线仅占销售额的 1.27%，在过去的五年中（2009-2013）下降到\
    \ 0.40%。作为业务中如此小的一部分，该产品线需要进一步调查，以确定它是否足够盈利。\n\n- 客户在周五不买廉价产品\n大多数产品线在周五的销售额要么略多（珠饰、礼物、海滩）要么略少（游戏、模型、促销），与周中其他时间相比。这可以归因于每个产品线所服务的目的。\n\
    \n"
