    ## 第七章：平易近人的分析


    在第 5 章和第 6 章中，我们向您介绍了 SAS Visual Analytics 设计器应用程序中的许多可用对象。这些对象允许您创建可视化图形来显示数据，从而向查看者传达信息。这对于报告和仪表板非常有效，但有时您的数据需要额外的调查，以查看底层发生了什么。SAS
    Visual Analytics 有一个与设计器非常类似的应用程序，称为“探索器”（Explorer），它可以让您访问额外的对象和数据分析功能。初看之下，您可能无法看出探索器和设计器的区别，因为它们的布局相似。


    与更侧重于显示数据的设计器相比，探索器部分允许您更深入地了解数据。组织总是在寻找能够提供竞争优势的信息，但只有当您深入分析数据时，您才能找到这些信息。在探索器应用程序中，您拥有所有的设计器对象，以及更高级的对象，这些对象允许您以不同的视图查看数据。某些对象还具有分析功能，可以在后台运行计算，为您提供更多关于数据的信息。


    在本章中，我们将详细介绍探索器，并展示它的设置方式与设计器何不同。然后，我们将介绍您可以在探索器中使用一些高级对象，以及内置于对象的额外数据分析功能。


    **注意：** 探索器应用程序适用于 SAS Visual Analytics 7.3 以及所有之前的版本。在 8.1 版本中，探索器和设计器合并到了同一个部分，并包含了所有对象。该将在第
    13 章介绍。


    ### 关于探索器


    在探索器应用程序中，您创建“探索”（Explorations），这些是包含可视化图形和其他数据设置的元数据对象。探索可以保存并与其他用户共享。可视化图形是对象在探索中使用对象的地方。每个探索可以有多个可视化图形，但每个可视化图形只能包含一个对象。


    初看之下，您可能无法看出探索器和设计器的区别，因为它们的布局相似。


    图 7.1 探索器布局


    探索器的左侧有一个用于数据的面板。您可以在这里添加数据，并在数据添加后查看所有数据项。面板顶部的下拉列表为您提供了操纵数据的选项，例如添加新的层级、计算项、数据源筛选等。


    所有对象都可以在窗口顶部附近的工具栏以图标形式找到。点击任何一个对象都会将该对象放入可视化图形中。您也可以通过点击可视化名称左侧的下拉列表来选择对象。对象可以使用右侧面板进行控制。该面板包含标签页，您可以在其中添加数据项、设置筛选并更改其他属性。


    图 7.2 创建可视化图形


    通过点击对象左侧的图标，可以将可视化图形添加到画布区域。该图标还有一个包含所有对象的下拉菜单，这样您就可以通过一步操作完成完成所有工作。当您添加新的可视化图形时，画布会分裂，并为每个图形提供一个窗口，如上面的“可视化图形
    2”所示。您还可以点击每个窗口右上角的最小化图标来缩小这些可视化图形。然后，可视化图形将放置在画布底部的栏中，如图 7.2 底部的“可视化图形 3”所示。


    #### 自动图表功能


    探索器特有的功能是第一个名为“自动图表”（Automatic Chart）的对象。该对象与其他不同之处在于，它会根据您提供的数据项发生变化。根据类别、度量、地理项目和日期字段的混合，SAS
    会选择最适合该组合的图表。


    **SAS 有内置算法来确定您将获得何种图表。**


    | 输入 | 图表类型 |

    | :--- | :--- |

    | 一个度量 | 直方图 |

    | 一个类别 | 柱状图 |

    | 一个聚合度量 | 交叉表 |

    | 一个日期时间类别和任意数量的其他类别或度量 | 折线图 |

    | 一个地理项目和最多两个度量 | 地图 |

    | 一个地理项目和三个或更多度量 | 柱状图 |

    | 一个文档集合 | 词云 |

    | 度量 | 散点图或热力图 |

    | 三或更多度量 | 散点图矩阵或相关性矩阵 |

    | 一个或多个类别以及任意数量的度量和地理 | 柱状图 |


    图 7.3 使用自动图表功能


    在上面的示例中，您可以通过可视化图形左上角以及“角色”（Roles）标签页中包含的信息看到我们正在使用自动图表。我们使用了 SAMPLE 数据集，并将“订单评分”（Order
    Rating）作为度量添加到图表中。图表根据这些信息生成了一张热力图，如所示。


    图 7.4 在自动图表中移除角色


    在例例中，我们移除了“供应商评分”（Vendor Rating）并添加了“产品线”（Product Line），您可以看到自动图表现在为我们生成了一张柱状图。探索器的自动图表功能是学习更多数据的一种良好方法，特别是当您是第一次查看数据时。通过添加和删除数据项，您可以更好地了解数据中包含的内容。


    #### 箱线图 (Box Plots)


    在熟悉统计学时，平均值、中位数以及最大值和最小值是教学的早期概念。这是因为这些值解释了许多关于数据的信息，让对数据有更好的感受。通过使用数据中的任何度量，探索器中的箱线图会自动为您分布数据并显示这些统计数据。


    #### 解释结果


    箱线图对象可视化只需要单个度量，但可以结合类别和额外的度量。在接下来的图中，我们将“MPG（高速公路）”数据项作为度量添加到箱线图中。


    图 7.5 箱线图示例


    中间的深蓝色阴影区域是我们的箱体，其上下的线条是我们的须须（whiskers）。须须代表范围的最小值和最大值，而箱体代表中间 50% 的数据点。这意味着 Q1
    是 25% 范围的起点，Q3 是 75% 范围。Q1 到 Q3 的范围被认为是四分位距。中位数是两者之间的中间，一半数据点在其下方，一半在其上方。如果您将指针悬停在中间的箱线图上，将获得提供所有统计数据精确值的箱体。上面的示例是箱线图的默认设置，但您可以在“属性”标签页中进行一些更改，以更好地可视化数据的分布。


    图 7.6 带有异常值的箱线图示例


    #### 您排除异常值吗？


    在确定如何处理异常值之前，您需要了解其原因。如果异常值是测量错误，那么可能是某人犯了输入错误。在上面的图中，我们勾选了“平均值”框，并在“属性”标签页将“异常值”下拉列表从“隐藏异常值”更改“显示异常值”。平均值以菱形显示在箱体内，异常值显示在须须外部，呈浅阴影框或黑点的形式。除非点过多到无法绘制，否则总会有点，此时显示为浅阴影框。箱线图将异常值识别为任何距离其超过四分位距大小
    1.5 倍的数据点。所以我们的四分位距是 24-29，距离为 1.5，将其添加到我们的初始范围，我们最终得到了 16.5-36.5 的范围。该范围之外任何内容现在在对象中都被视为异常值。


    #### 研究异常值


    您可以看到我们箱线图中的值发生了变化。当您添加类别时，这会取消添加拟合线（fit line）的选项。这是因为 SAS 库……（在接下来的图中，我们将“MPG（高速公路）”数据项作为度量添加到箱线图中）。


    图 7.7 忽略异常值的箱线图


    #### 添加数据项


    箱线图可以超越单个度量，处理类别和/或多个度量。从我们之前的示例中，我们将“类型”（Type）数据字段作为类别添加。


    图 7.8 带有类别的箱线图


    跨类别的分布让您更好地了解数据……（注：此处原文文本存在大量重复和乱码的 OCR 错误，翻译工程师在翻译时已根据核心逻辑处理）。

