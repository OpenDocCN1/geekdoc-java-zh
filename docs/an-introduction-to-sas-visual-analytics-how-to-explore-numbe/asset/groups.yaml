    **chapter three**


    building your first dashboard


    When asked to design a dashboard, you must spend some time with the users


    understanding their needs and goals. Many users ask for a dashboard and use


    the term in a generic way to mean a web-based report with charts and graphs


    that can link to other web pages. A dashboard is more than a report because it


    involves conclusions.


    In *Effective Dashboard Design*, La Grouw notes that you can differentiate a


    dashboard and a report by their core attributes. A report does not lead users
    to


    a conclusion; it simply presents facts that allow users to make their own


    judgments. Consider Figure 3.1. The chart on the left tells the viewer what


    sales were for each month. The viewer sees that sales improved by year end


    after taking a sharp decrease in the spring. This chart shows useful facts, but


    what we do not know is whether it is a good thing.


    Figure 3.1 Difference in reports and dashboards


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_30.png)


    A dashboard can provide context for facts, and thus provide the basis to form


    a conclusion. Effective dashboards can help a user quickly understand what is


    happening and what needs to happen next. In the preceding figure, consider


    the chart in the right pane. The viewer can draw a conclusion from the chart,


    which is that the team is not meeting their goal. Presenting the facts in this


    way provides an immediate understanding of what is happening, and


    indirectly suggests the follow-up action.


    Dashboards help users understand if a process or project is running smoothly.


    Typically, metrics are centered on some performance aspect, such as strategic


    objectives, time lines, or quality result. Keep in mind, the information does


    not present the next level of detail, which is what or why events are


    happening.


    **Is it a dashboard or a scorecard?**


    In the early 1990s, when the terms *performance dashboard* and *balanced*


    *scorecard* were introduced, there were fewer vendors able to support either


    method. Scorecards tend to be tabular in nature, whereas dashboards tend to


    contain graphical elements, such as gauges or line charts. Since their


    introduction, the terms have somewhat become synonymous. Both terms


    generically refer to presenting actionable data on a web page.


    In *Information Dashboard Design*, the author Stephen Few defines a


    dashboard as a “visual display of the most important information needed to


    achieve one or more objectives.” The word *objective* is a key in this


    definition because it implies a performance measurement. There are no set


    rules for what a performance dashboard must contain other than focusing on


    visualizing organizational objectives.


    A scorecard or balanced scorecard is a management system framework that


    was popularized in the book, *The Balanced Scorecard* by Doctors Robert


    Kaplan and David Norton. This methodology encourages organizations to


    monitor performance against financial and nonfinancial strategic goals. This


    method tends to focus on progress instead of performance.


    DASHBOARD BUILDING PROCESS


    The dashboard building process requires that you identify the organization


    objectives. Place the objectives in a pleasing layout with accurate data that


    viewers can easily understand. In this topic, you will learn a dashboard


    building process.


    Understanding your customer


    We are going to continue the work from the *Building Your First Report*


    chapter with the Toy Company. This is a large international company with


    multiple products and a large sales force that is spread across the world. The


    Sales vice president has requested a dashboard to track sales targets,


    profitability, and approval ratings. The main users of the dashboard are the


    three regional sales managers. The company has several issues that include


    decreasing profits and poor customer approval ratings. This dashboard should


    help the organization improve profitability, sales targets, and customer


    service.


    When designing the dashboard, keep your user’s skill level, use case, and


    purpose in mind. Let’s think about the audience for this dashboard. We know


    these users are not seeking detailed statistical analysis. Their goal is much


    simpler. They want to monitor their organization. Most of the time these


    particular users are traveling and plan to use their tablets to consume the


    information.


    The main goal is for the user to have a takeaway. We want the vice president


    to know whether the organization is on target; and, likewise, we want the


    regional managers to know what is going wrong so that they can address the


    issues. You can train users to understand a dashboard. So, do not shy away


    from a more complicated visualization if it will help the user understand or


    compare what is happening.


