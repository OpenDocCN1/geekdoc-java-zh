    ## 关于本书


    SAS Visual Analytics 是一种数据可视化和应用程序，能够让组织理解并分析它们最重要的资产：数据！support.com 上为用户提供了丰富的免费信息，从简单的博客文章到深度文档。所有这些内容可能让用户难以理解如何充分利用该程序，甚至无法。


    我们本书的目的是为新用户提供一份快速上手指南，通过应用程序教你基础知识，以便你能够通过一些中级和高级技术轻松扩展知识。我们希望确保用户理解如何为他们的组织充分发挥该程序的作用。


    ## 这本书适合你吗？


    新用户或对 SAS Visual Analytics 有一定了解的人会发现这本书很有用。它为新用户提供了教程。它还包含了对数据可视化以及如何有效使用这些内容的深度解释。


    如果你拥有部署、配置和维护 SAS Visual Analytics 环境的管理员权限，我们在这里也涵盖了相关内容。我们的目标是增强你对软件工作原理的理解，以便你随时实施经过验证的实践以高效运行。


    ## 先决条件


    使用本书不需要任何关于 Visual Analytics 工具或 SAS 的以往经验。如果你熟悉 SAS 编码技术和 SAS 数据处理，你可能会发现项目的某些领域更容易理解。


