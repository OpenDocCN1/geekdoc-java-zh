    \ SAS 程序。\n\nSAS-In CAS 分析仅在数据已加载到 CAS 时才会运行。这是因为 SAS-In CAS 服务需要访问已在 CAS 内存中的数据。\n\
    \n### ### 添加反序列化数据\n\nCAS-in 分析的主要目的是将数据从磁盘移动到内存。SAS-In 服务允许用户将数据加载到 CAS 并使用。\n\
    \n## ## SAS VIP 与 SAS TO\n\nSAS VIP 是一种提供并行处理优势的全内存计划。然而，SAS TO 在许多用例中仍然有用。SAS\
