    \ KISS 原则了！\n\n在下面的图中，只显示了 11 条线，但与图 5.1 相比，你会花费更多时间研究。一个结论是某些产品收到的投诉很少或没有。如果你的信息是“只有少数产品有问题”，请使用此图表来强调这一点。如果你的目标是显示主要区域的增长，请使用图\
    \ 5.1。\n\n图 5.3 保持类别简单\n\n这种情况的解决方法是添加一个过滤器，让观众控制一次显示的信息。观众可能只对某些产品感兴趣，或想比较某些产品。\n\
    \n### 饼图和圆环图：指南\n\n这里是关于使用饼图显示你的数据的指南：\n\n- 部分与整体等于 100% —— *始终*。如果你的饼图不等于 100%，在脚注中告诉读者。\n\
    - 限制为 4 或 5 个类别，但当一个类别具有显著意义时更好。\n- 饼图完成后，图例是多余的。\n\n### 移除图例\n\n如果你允许工具放置标签，就可以避免使用图例。从“属性”菜单，开启“显示类别标签”（Show\
    \ category labels）框。这会将类别标签放在饼图上，更易阅读。你可能希望标签在图表外面以保持一致。使用“数据标签位置”（Data label\
    \ location）控制标签的位置。你可能希望通过点击“显示数值占总数的百分比”（Show values as percentage of total）框显示百分比。然而，饼图在类别占据主导地位时效果最好。这使得数值是不必要的。\n\
    \n图 5.24 良好的饼图需要图例\n\n### 比较有效吗？\n\n在下面的图中，数据可视化按通道比较投诉。你有 5 秒钟告诉我最受欢迎的接收通道。这不是展示数据的好方法，但有效吗？在某些情况下，很难判断推荐（Referral）和网络（Web）是否产生了相同量。我们的眼睛不擅长阅读角度。使用\
    \ 0 作为 Y 轴值更容易理解。\n\n图 5.25 过多的比较\n\n### 饼图和圆环图：技巧和窍门\n\n这里有一些技巧和窍门可以帮助你处理饼图中的常见情况。\n\
    \n#### 技巧 1：救援你的长标签\n\n水平图表有助于比较，但如果标签很长，则很难阅读。注意标签是倾斜的，因为太长了。使用“排名”（Ranks） 限制来限制类别到前\
    \ 5 个或计数或百分比。如果项目持平，使用“平局”（Ties）框来显示两者。使用“其他”（All Other）框创建一个另一个项目，其中剩余项目合并在一起。\n\
    \n图 5.17 使用水平图\n\n#### 技巧 2：显示完整百分比\n\n在某些情况下，你可能希望将计数转换为百分比以显示整体比较。如果你有一个分组图，可以使用“属性”标签页快速转换。将分组比例归一化为\
    \ 100%。\n\n图 5.18 将分组比例归一化为 100%\n\n#### 技巧 3：使用蝴蝶图\n\n蝴蝶图与分组图类似，但允许用户关注两个指标。指标放在后面，以便它们像翅膀一样。下面的例子来自客户服务组织。团队\
    \ B 在通话中解决了更多问题并具有最高满意度。同样，第一次通话解决率的团队满意度较低。此数据对象要求两个指标是相同类型。在我们的例子中，两个都是百分比。\n\
    \n图 5.20 使用蝴蝶图\n\n 树状图（TREEMAPS）\n\n树状图允许观众看到大量类别的结果。树状图比柱状图更有效地利用空间。这些数据对象对于揭示数据整体模式的分级数据特别有效。\n\
    \n### 解释结果\n\n此对象显示了几家公司的投诉。框的大小表示2015 年的投诉数量。框越大，公司收到的投诉越多。正方形颜色表示投诉的百分比变化。如果颜色更深，公司2015\
    \ 年的投诉比2014 年多。你可以过滤结果。我们可能想移除一年投诉很少而第二年没有的公司。\n\n图 5.28 树状图示例\n\n从这种可视化中我们学到：\n\
    \n- 较大的金融机构收到的投诉更多。这并不意外，因为他们可能持有更多贷款。注意，很难判断投诉的确切数量。你只知道相似。\n- 你可能发现可以按大小分组分组，从而理解金融机构是相似的。在树状图的右下角，有第二组收到了相似数量的投诉。在右上，另一组数量相同。\n\
    - 我们可以看到许多绿色的公司减少了投诉，或者可能只是与去年相似。通过将指针悬停在美国银行上方，我们看到投诉减少了 21%。\n\n树状图在非常小的区域内一次提供许多类别的概述。通过使用颜色，你可以为分析增加额外维度。\n\
    \n### 树状图：指南\n\n使用树状图时，这里有一些指南。\n\n添加两个指标——一个用于大小，一个用于差异\n\n你可以为此图表使用两个或三个指标。第一个指标是和、计数或平均值。第二个指标可以是评分、百分比差异或另一个指示变化的数值。在图\
    \ 5.27 中，框的大小是和，颜色是同比百分比差异。\n\n### 饼图：作为仪表盘使用\n\n如果你在仪表盘上工作，有时你想显示单个值。这种方法保留了标题但隐藏了饼图本身。使用不可见的饼图是更聪明的方法。这里是创建唯一计的步骤：\n\
    \n1. 为了创建唯一计数，右键点击数据项。\n2. 创建一个名为“唯一客户”（Unique Customers）的指标。\n    a. 在“数据”下拉列表中选择“新计算项”（New\
    \ Calculated Item）。\n    b. 在“名称”字段输入占位符（Placeholder）。\n    c. 将结果类型改为字符。\n3.\
    \ 保存计算项。\n3. 在“属性”标签页，执行以下操作：\n    a. 取消勾选“显示标签”（Show label）。\n    b. 点击“显示实际值”（Show\
    \ actual values）。\n    c. 将“数据位置”改为内部（Inside）。\n5. 在“样式”标签页上，执行以下操作：\n    a. 在“数据样式”区域，将数据改为光（Gloss）。\n\
    \    b. 在“文本样式”区域，将值大小改为60。如果需要，调整字体。\n    c. 在“数据颜色”区域，将第一个填充改为白色。\n6. 保存你的报告并在应用程序中查看。有了下拉过滤器，你的新值将随着选择而改变。\n\
    \n结束\n\n## 瀑布图（WATERFALL CHARTS）\n\n瀑布图显示累计值的增加或减少。这些图表有许多名称，包括渐进柱状图、桥梁图和飞砖图。这种图是理解部分与整体的另一种例子。这些图表通常用于财务指标以显示损益表。这种可视化是很好的。\n\
    \n### 解释结果\n\n瀑布图帮助用户分析数值如何变化以及原因是什么。在下面的图中，你可以看到成本如何改变收入并产生利润。减少的值显示为红色，增加的值显示为绿色。最终金额“利润后”（Profit\
    \ After）显示为。\n\n图 5.32 瀑布图示例显示收入变化\n\n从这种可视化中我们学到：\n\n- 最大成本用于生产产品。减少成本可能有更大的影响。\n\
    - 与产品成本相比，其他成本微其微。\n\n### 瀑布图：使用指南\n\n瀑布图用于显示单个数值如何变化，例如收入。使用与饼图类似的指南保持这种可视化简单。\n\
    \n### 添加初始和结束值\n\n如果你的数据源只有按类别的值，你可能想添加起始和结束值。选择“设置初始值”（Set initial value）和“显示最终累计”（Show\
    \ Final (cumulative)）框将这些柱添加到图表中。你也可以更改标签。\n\n图 5.33 添加初始和结束值\n\n### 添加响应符号\n\n\
    你可以允许负值显示为红色，正值显示为绿色。在属性窗口中，勾选“按响应符号上色”（Color by response sign）。如果你的数据源没有负值，数据对象可能无法正常显示。\n\
    \n你可以使用计算项创建一个负值。在下面的图中，订单产品成本乘以 -1来创建一个负值。参考“创建你的仪表盘”章节有关创建计算项的更多细节。\n\n图 5.34\
    \ 创建计算项\n\n### 瀑布图：技巧和窍门\n\n以下技巧和窍门可以用于其他数据对象，但在处理这些对象时可能很有用。\n\n#### 技巧 1：考虑汇总源\n\
    \n如果你的数据是高宽的，则可能不适用于瀑布图。我们的示例数据 VA_SAMPLE_INSIGHTS 使用宽格式。这意味着数据项各占一列并作为单独的数据项列出。瀑布图显示每个值对2013年单一类别的贡献。这些值需要汇总并转置，如下所示：\n\
