    To limit memory usage, you can optimize your queries to use less memory or increase
    the amount of available memory.


    # ## Network Latency


    The network speed between the database server and the client also affects the
    performance of SQL Analysis Views. High latency can significantly increase the
    time it takes to retrieve results.


    To minimize the impact of network latency, you should use a high-speed connection
    between the server and the client.


    # ## Data Volume


    The amount of data returned by a query also affects its performance. Large result
    sets take more time to transfer over the network.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_17_1.png)


    *Figure 16: Impact of data volume on SQL Analysis Views query performance*


    # ## SQL Analysis Views performance limitations


    SQL Analysis Views are designed for data analysis, not for real-time transactional
    processing. They have several limitations that should be aware of.'
