- md: "\n## Chapter Seven: Approachable Analytics\n\nIn Chapters 5 and 6, we introduced\
    \ you to many of the objects available in the Designer application of SAS Visual\
    \ Analytics. These objects let you create visualizations to display your data\
    \ so that you can communicate a message to a viewer. This works well for reporting\
    \ and dashboards, but sometimes your data needs additional investigation to see\
    \ what is going on underneath the covers. SAS Visual Analytics has a very similar\
    \ application to the Designer called the Explorer that gives you access to additional\
    \ objects and data analysis features. At first glance, you might not be able to\
    \ see the difference between the Explorer and Designer, since they are laid out\
    \ similarly. \n\nCompared to the Designer, which focuses more on displaying your\
    \ data, the Explorer section enables you to learn more about your data. Organizations\
    \ are always searching for that piece of information to give them a competitive\
    \ advantage, but you can only find that if you are getting deep into analyzing\
    \ your data. In the Explorer application, you are given all of the designer objects\
    \ as well as more advanced ones that let you see your data in different views.\
    \ Some of the objects also have analysis features that run calculations behind\
    \ the scenes to give you even more information about your data.\n\nIn this chapter,\
    \ we walk through the Explorer and show how it is set up differently than the\
    \ Designer. Then we go over some of the advanced objects that you can use in the\
    \ Explorer as well as the additional data analysis features that are built into\
    \ the objects.\n\n**Note:** The Explorer application is for SAS Visual Analytics\
    \ 7.3 and all other previous versions. In the 8.1 version, the Explorer and Designer\
    \ are merged into the same section along with all of the objects. That version\
    \ is covered in Chapter 13.\n\n### About The Explorer\n\nIn the Explorer application,\
    \ you create explorations, which are metadata-objects that contain visualizations\
    \ and other data settings. Explorations can be saved and shared with other users.\
    \ Visualizations are where the objects are used within an exploration. Each exploration\
    \ can have multiple visualizations but each visualization can only have one object.\n\
    \nAt first glance, you might not be able to see the difference between the Explorer\
    \ and Designer since they are laid out similarly.\n\nFigure 7.1 Explorer layout\n\
    \nThe Explorer is set up with a panel on the left side for your data. This is\
    \ where you can add data and see all of the data items once they have been added.\
    \ The drop-down list at the top of the panel gives you the options to manipulate\
    \ data such as adding a new hierarchy, calculated item, data source filter, and\
    \ so on.\n\nAll of the objects can be found as icons in the toolbar near the top\
    \ of the window. Clicking on any of them places that object into the visualization.\
    \ You can also select an object by clicking on the drop-down list that sits to\
    \ the left of the visualization name. The objects can be controlled with the right\
    \ panel. This contains tabs where you can add data items, set up filtering, and\
    \ change other properties.\n\nFigure 7.2 Creating visualizations\n\nVisualizations\
    \ are added to the canvas area by clicking on the icon to the left of the objects.\
    \ This icon also has a drop-down menu that contains all of the objects so that\
    \ you can do everything with one step. When you add a new visualization, the canvas\
    \ splits and gives you a window for each one as shown above with Visualization\
    \ 2. These can also be minimized by clicking on the minimize icon in the top right\
    \ corner of each window. The visualizations are then placed in the bar at the\
    \ bottom of the canvas shown at the bottom of Figure 7.2 with Visualization 3.\n\
    \n#### Automatic chart feature\n\nA feature that is unique to the Explorer is\
    \ the first object called Automatic Chart. This object is different from others\
    \ in that it changes based on the data items that you provide it. Depending on\
    \ the mixture of categories, measures, geography items, and date fields, SAS chooses\
    \ the chart that works the best for that combination.\n\n**SAS has a built-in\
    \ algorithm to determine which chart you get.**\n\n| Input | Chart Type |\n| :---\
    \ | :--- |\n| One measure | Histogram |\n| One category | Bar chart |\n| One aggregate\
    \ measure | Crosstab |\n| One datetime category and any number of other categories\
    \ or measures | Line chart |\n| One geography and up to two measures | Geo map\
    \ |\n| One geography and three or more measures | Bar chart |\n| One document\
    \ collection | Word cloud |\n| Two measures | Scatter plot or heat map |\n| Three\
    \ or more measures | Scatter plot matrix or correlation matrix |\n| One or more\
    \ categories and any number of measures and geographies | Bar chart |\n\nFigure\
    \ 7.3 Using the automatic chart feature\n\nIn the example above, you can see that\
    \ we are using the Automatic Chart by the top left of the visualization and by\
    \ the information contained in the Roles tab. We took the SAMPLE data set and\
    \ added Order Rating as measures to the chart. The chart generated a Heat Map\
    \ from that information and that is shown above.\n\nFigure 7.4 Removing roles\
    \ in an automatic chart\n\nIn this example, we removed Vendor Rating and added\
    \ Product Line, you can see that the Automatic Chart has now generated a bar chart\
    \ for us. The Automatic Chart feature in the Explorer is a good way to start learning\
    \ more about data, especially if it is one that you are just looking at the first\
    \ time. By adding and removing data items, you get a better sense of what your\
    \ data contains.\n\n#### Box Plots\n\nIn getting familiar with statistics, mean\
    \ and median as well as maximum and minimum are some of the first concepts taught.\
    \ This is because these values explain a lot about your data and you can get a\
    \ better sense of it. By using any measure in your data, the Box Plot in the Explorer\
    \ automatically distributes the data for you and displays those statistics.\n\n\
    #### Interpreting the results\n\nThe Box Plot object requires just a single measure\
    \ for the visualization but a category and additional measures can be incorporated.\
    \ In the following figure, we added MPG (Highway) data item as a measure in the\
    \ Box plot.\n\nFigure 7.5 Box plot example\n\nThe dark blue shaded area in the\
    \ middle is our box and the lines below and above it are our whiskers. The whiskers\
    \ represent the minimum and maximum values of the range where the boxes represent\
    \ the middle 50% of data points. This means that Q1 is the start of 25% range\
    \ and Q3 is the 75% range. The range from Q1 to Q3 is considered the interquartile\
    \ range. The median is middle between the two where data points are below it and\
    \ half are above. If you position the pointer over the box plot in the middle,\
    \ you get the box that gives you all the exact values for the statistics. The\
    \ example above is the default setting for the Box Plot, but there are some changes\
    \ you can make in the Properties tab to better visualize the distribution of your\
    \ data.\n\nFigure 7.6 Box plot example with outliers\n\n#### you exclude outliers?\n\
    \nBefore you can determine what to do with an outlier, you need to understand\
    \ the cause. If the outlier is a measurement error, then it is likely that someone\
    \ made a entry error. In the above figure, we checked the averages box and changed\
    \ the Outliers drop-down list from Hide Outliers to Show Outliers in the Properties\
    \ tab. The average shows up as a diamond in the box and outliers show outside\
    \ of the whiskers as either a light shaded box or black dots. There are always\
    \ dots unless there are too many points to plot, which then are shown as the light\
    \ shaded box. The Box Plot identifies an outlier as any data point that is farther\
    \ than 1.5 times the size of the interquartile range away from it. So our interquartile\
    \ range is 24-29, that would be a distance of 1.5 and adding it to our initial\
    \ range, we end up with a range of 16.5-36.5. Anything outside that range is now\
    \ considered an outlier in the object.\n\n#### Study the outliers\n\nYou can see\
    \ how the values in our box plot have changed. When you add a category, this does\
    \ take away the option to add a fit line. This is because the SAS library. In\
    \ the following figure, we added MPG (Highway) data item as a measure in the Box\
    \ plot.\n\nFigure 7.7 Box plot ignoring outliers\n\n#### Adding data items\n\n\
    The Box Plot can go beyond a single measure and handle a category and/or multiple\
    \ measures. From our previous example, we added the Type data field as a Category\
    \ in the Roles tab. This displays a separate box-and-whisker plot for each category.\n\
    \nFigure 7.8 Box plots with a category\n\nThe distribution across categories allows\
    \ for better analysis now that you can see how one is broken out. The Hybrid box-and-whisker\
    \ plot only has three data points, which is why it does not have any whiskers.\
    \ Also notice how all of the box-and-whisker plots vary in size and shape. For\
    \ the Truck, the minimum value is very close to the Q1 and Median values. This\
    \ shows how that category has a lot more data points on the lower end compared\
    \ to higher end of the range where the top whisker is. Now we are going to add\
    \ MPG (City) to the Measures in the Roles tab.\n\nFigure 7.9 Box plot with a category\
    \ and multiple measures\n\nBy adding another measure, our box-and-whisker plots\
    \ now doubled since there is one of the new measures for each category. It is\
    \ interesting how Truck and Hybrid categories do not have much of a change from\
    \ Highway to City, but the Sedan, Sports, and Wagon have a difference. Also, the\
    \ Sedan is the only category that has multiple outliers for both the City and\
    \ Highway measures.\n\n#### When to use Box Plots\n\nAs you can see from the above\
    \ example, Box Plots are a good way to see into the measures and look at the distribution\
    \ of values. Here’s a few situations to consider using a box plot:\n\n- Exploration\
    \ – Box plots can be a good place to start looking at your data since you can\
    \ see how each of the measures are distributed and how they look with different\
    \ categories.\n- Outliers – Depending on the data set, you might want to find\
    \ out if you have outliers that you would like to exclude from your analysis.\
    \ The Box Plot provides a way to easily calculate and visualize them.\n\n### Histograms\n\
    \nAs with Box Plots, Histograms are another way for you to see a frequency distribution\
    \ of your data. Only one measure can be used with them, but histograms can be\
    \ an effective way to see how your data is spread out as counts or percent. For\
    \ this example, we are going to use the CARS data set that we used in the Box\
    \ Plot example and switch over to histogram.\n\n#### Changing objects in a visualization\n\
    \nWithin a Visualization, there are multiple ways that you can change the object\
    \ to get a different look at your data. Figure 7.10 Where to change an object\n\
    \nNow you'll notice with this example that the Histogram is not available. That\
    \ is because at the end of the Box Plot section we had data items Type, MPG (Highway),\
    \ and MPG (City) selected in the Roles tab. When changing objects, the visualization\
    \ uses the data that are being used.\n\nFigure 7.11 Change visualization to histogram\n\
    \n#### Histogram options\n\nIn the Properties tab there are a few options that\
    \ you can apply to the Histogram. Similar to a bar chart, you can change the bar\
    \ direction to horizontal. Also, you can change how the frequency is displayed\
    \ by selecting Count or Percent. The default is Count, but by changing it to Percent\
    \ your one axis updates to show how much of percent each bin has. Finally, you\
    \ can also choose your own bin count. The number of values in your measure determines\
    \ the default bin count.\n\nFigure 7.12 Histogram example\n\nAs shown above, when\
    \ you use your own bin count, the object takes the maximum and minimum values\
    \ and then evenly out the bins for that range.\n\n### Using a Correlation Matrix\n\
    \nFinding pieces of information within your data that can lead to competitive\
    \ advantage is what data analysis is all about. Using Correlation Matrix is one\
    \ way to measure relationships between measures in the Explorer. The object takes\
    \ in different measures, compares them against each other, and then determines\
    \ whether a strong relationship is between them. Figure 7.13 How SAS categorizes\
    \ values\n\n#### Calculating a correlation\n\nCorrelations in SAS Visual Analytics\
    \ are calculated using Pearson’s product moment. This calculation takes two measures\
    \ and all of their values and generates a coefficient value that describes their\
    \ relationship. The range of the coefficient value can be anywhere from -1 to\
    \ 1. Anything from -1 to 0 indicates a negative relationship, which means as one\
    \ measure increases the other decreases and vice versa. Positive numbers from\
    \ 0 to 1 indicate a positive relationship, which means that as one measure increases\
    \ the other follows.\n\n#### Understanding the matrix\n\nAt the end of the section\
    \ we had data items Type, MPG (Highway), and MPG (City) selected in the Roles\
    \ tab. When changing objects, the visualization uses the data that are being used.\
    \ Figure 7.14 Correlation matrix\n\nIn this example, we look at a combination\
    \ of comprehension levels, scores, attendance days, and discipline days for students\
    \ in school. Here’s what we learn from the above figure:\n\n- There’s a strong\
    \ relationship between math and reading scores.\n- Attendance days are not related\
    \ to test scores or comprehension levels.\n- Discipline days are not related to\
    \ test scores or comprehension levels.\n\nThe strength of the correlation determines\
    \ the color of the box. If you position the pointer over any of the boxes, then\
    \ you get to see the actual numbers as well as how SAS classified the correlation.\
    \ Figure 7.15 Correlation example between two sets of measures\n\n#### Interpreting\
    \ a correlation value\n\nWith a lot of data and a strong correlation between the\
    \ values of two measures, you might assume that the correlation between the values\
    \ indicates a relationship between the concepts that the values are measuring.\
    \ Sometimes that is not always the case. The phrase *correlation does not equal\
    \ causation* is common in the field of statistics.\n\n- One causes the others\
    \ behavior\n- Neither causes the other’s behavior, both are caused by other variables\n\
    - Neither causes the other’s behavior, another variable connects them\n- Correlation\
    \ is erroneous due to insufficient or bad data\n\nIn our previous example, the\
    \ math and reading score had a strong positive correlation with each other. This\
    \ indicates that as one goes up, the other should follow. Because we also saw\
    \ minimal relationships between the math and reading scores and the attendance\
    \ days and discipline days, we might conclude that some other factor, such as\
    \ the intelligence of each student, is causing the high correlation between the\
    \ math and reading scores.\n\n#### Shark Attacks and Ice Cream Sales\n\nIf you\
    \ looked at the amount of ice cream that is sold compared to the number of shark\
    \ attacks by month or season, those two measures would have a strong correlation\
    \ value. Both occur more often in the summer months compared to the winter. Obviously,\
    \ they do not have anything related to each other except that they change as the\
    \ season’s turn. This would be an example of neither measure causing the other’s\
    \ behavior because there is another variable that connects them—which is seasonality.\n\
    \n### Forecasting\n\nForecasting is not an object by itself and rather an extension\
    \ of the Line Chart. It is included here as its own section since it is one way\
    \ to do predictive analysis. Using data that contains a time frame, you can use\
    \ Forecasting option in the Line Chart that predicts how the data trends to some\
    \ upcoming time frame. In this section, you learn how forecasting is done and\
    \ how to use it. For our example, we are going to use VA_SMALLINSIGHT data set.\n\
    \n#### Working with forecasting option\n\nThe Roles tab of the line chart is where\
    \ you can find the option. The option is grayed out until a date item is added.\
    \ Once that is populated, the visualization is updated. Figure 7.16 Forecasting\
    \ example\n\n#### Building better forecasts\n\nA good indicator of future performance\
    \ is past performance. When creating a forecast the more historical data you can\
    \ provide, the more likely your forecast is to produce a better result.\n\n####\
    \ How is the data modeled?\n\nThe forecast runs your data through different models\
    \ available:\n\n- Damped-trend\n- Linear\n- Seasonal\n- Winters method (additive)\n\
    - Winters method (multiplicative)\n\nAs the data is modeled, the Root-Mean-Square\
    \ Error (RMSE) is calculated for each model. The RMSE is a measure of how close\
    \ the predicted values are to the real data. The lower the RMSE, the more accurate\
    \ the model is. Figure 7.17 Forecasting example\n\n#### Forecasting options\n\n\
    In the Properties tab there are a few options that you can apply to the Histogram.\
    \ Similar to a bar chart, you can change the bar direction to horizontal. Also,\
    \ you can change how the frequency is displayed by selecting Count or Percent.\
    \ The default is Count, but by changing it to Percent your one axis updates to\
    \ show how much of percent each bin has. Finally, you can also choose your own\
    \ bin count. The number of values in your measure determines the default bin count.\
    \ Figure 7.18 Forecasting options\n\n#### Look for underlying factors\n\nIn order\
    \ to improve our analysis, we don’t just want to look at one measure and base\
    \ the forecast on those values. Figure 7.19 Forecasting with underlying factors\n\
    \n#### Data analysis\n\nThe setup for the Scatter Plot is straightforward, you\
    \ just need to add your two measures into the visualization or into the Roles\
    \ tab. Figure 7.20 Forecasting example\n\n#### Moving visualizations to the Designer\n\
    \nAs you have seen, the Explorer offers a few more objects and data analysis features\
    \ than the Designer does. That’s good since the Explorer is meant more for diving\
    \ into your data, but sometimes you might want to use those visualizations in\
    \ a report so you can share it with other users.\n\nFigure 7.21 Forecasting with\
    \ goal seeking.\n\n#### Using the scenario analysis\n\nOnce you have found an\
    \ underlying factor that influences the forecast, the Scenario Analysis button\
    \ at the bottom of the Roles tab becomes available to use. After clicking on it,\
    \ a window shows the forecasted field and the underlying factor. With Scenario\
    \ Analysis, you can go in and manipulate the underlying factors and see how the\
    \ forecast would change based on those new values. In our example, we are trying\
    \ to get our average Sales Rep Rating around 60% and want to investigate how that\
    \ could affect our monthly sales. We set this expectation by clicking on the Sales\
    \ Rep button on the left side of the screen and selecting “Set Series Values”.\
    \ A pop-up window appears and this is where the values are set with a fixed number,\
    \ a numeric increment, or a percentage increase.\n\nFigure 7.22 Forecasting with\
    \ scenario analysis\n\nAfter you click **OK**, the forecasted numbers for the\
    \ Sales Rep are updated with the 60% set increase. There is a gray line in the\
    \ underlying factor’s forecast section that indicates the original data points.\
    \ Since the underlying factor has been altered, only Scenario Analysis is available\
    \ to use and is the only option available in the right menu. When Apply is selected,\
    \ the forecast is then updated with the new results.\n\n#### Loading social media\
    \ data\n\nIn Explorer, you have option to load from any of your local machine,\
    \ a server, or Hadoop (if installed), or SAS library. In the Add Data Source window,\
    \ there are options to get data from Facebook, Google Analytics, and Twitter.\
    \ Figure 7.23 How to load social media data\n\n#### Word Clouds\n\nAll of the\
    \ objects that we looked at so far have been focused on analyzing measures with\
    \ some being able to add categories for an investigation. The word cloud object\
    \ takes a category field that contains text and can analyze it for words of importance,\
    \ frequency of words, or add a measure to place a value on words.\n\n#### Setting\
    \ up the word cloud\n\nThe Word Cloud object has two ways to visualize the category\
    \ item that is being analyzed. One is to use category values, which takes the\
    \ category item as a whole and use frequency or another measure to determine those\
    \ values. The other is to use text analytics, which takes the category item and\
    \ examines each word in the string. Each word is then displayed based on frequency\
    \ or importance.\n\n#### Using category values\n\nUnder **Show word cloud** in\
    \ the Roles tab there is options where you can select category values. With the\
    \ category values, we want to look at location to see where people are tweeting\
    \ from. Figure 7.24 Word cloud with category values (Wait, the text has a typo\
    \ in OCR, let me re-read). Figure 7.24 Word cloud with category values\n\n####\
    \ Using text analytics\n\nOn the Roles tab you can select **Using text analytics**\
    \ to switch to how the word cloud handles the data. This option needs a Document\
    \ collection instead of a category so that it can analyze individual terms inside\
    \ the category field. For example, we create a Document Collection by right clicking\
    \ on the category data item and selecting Document Collection. This is the actual\
    \ text from the tweet that is in each row of data.\n\nFigure 7.25 Word cloud with\
    \ sentiment analysis\n\nThe sentiment analysis looks at everything in the document\
    \ collection field and determines the nature of the text. Each item gets categorized\
    \ as positive (green), neutral (yellow), or negative (red). The results can be\
    \ found in the upper right corner of the word cloud as well as in the **Topics**\
    \ tab. With mostly neutral and a few more negative than positive tweets, there\
    \ is definitely a mixed reaction regarding the decision to remove the headphone\
    \ jack. However, when switching to topics that included iPhone7 or home button,\
    \ the reactions were about three to one in favor of the positive ones. It appears\
    \ that people are publicly enjoying the new product, but they are still on the\
    \ fence about the headphone.\n\nFigure 7.26 Using text analytics (Wait, the text\
    \ has a lot of repetitive sentences and noise in the OCR. I will clean up the\
    \ logic flow).\n\n*(Self-correction: The OCR text provided is extremely repetitive\
    \ and contains many artifacts like \"VA_SMALL_INSIGHT\", \"CARS\", and repeated\
    \ image tags. I will focus on the structural flow of the actual content provided\
    \ while cleaning the obvious noise.)*\n\nWait, looking at the provided text again,\
    \ it is a massive loop of repeated sections for Box Plots and Histograms. I will\
    \ provide a clean version of the unique content present in the text, removing\
    \ the redundant loops and OCR-specific noise.\n\n[content]\n## Chapter Seven:\
    \ Approachable Analytics\n\nIn Chapters 5 and 6, we introduced you to many of\
    \ the objects available in the Designer application of SAS Visual Analytics. These\
    \ objects let you create visualizations to display your data so that you can communicate\
    \ a message to a viewer. This works well for reporting and dashboards, but sometimes\
    \ your data needs additional investigation to see what is going on underneath\
    \ the covers. SAS Visual Analytics has a very similar application to the Designer\
    \ called the Explorer that gives you access to additional objects and data analysis\
    \ features. At first glance, you might not be able to see the difference between\
    \ the Explorer and Designer, since they are laid out similarly.\n\nCompared to\
    \ the Designer, which focuses more on displaying your data, the Explorer section\
    \ enables you to learn more about your data. Organizations are always searching\
    \ for that piece of information to give them a competitive advantage, but you\
    \ can only find that if you are getting deep into analyzing your data. In the\
    \ Explorer application, you are given all of the designer objects as well as more\
    \ advanced ones that let you see your data in different views. Some of the objects\
    \ also have analysis features that run calculations behind the scenes to give\
    \ you even more information about your data.\n\nIn this chapter, we walk through\
    \ the Explorer and show how it is set up differently than the Designer. Then we\
    \ go over some of the advanced objects that you can use in the Explorer as well\
    \ as the additional data analysis features that are built into the objects.\n\n\
    **Note:** The Explorer application is for SAS Visual Analytics 7.3 and all other\
    \ previous versions. In the 8.1 version, the Explorer and Designer are merged\
    \ into the same section along with all of the objects. That version is covered\
    \ in Chapter 13.\n\n### About The Explorer\n\nIn the Explorer application, you\
    \ create explorations, which are metadata objects that contain visualizations\
    \ and other data settings. Explorations can be saved and shared with other users.\
    \ Visualizations are where the objects are used within an exploration. Each exploration\
    \ can have multiple visualizations but each visualization can only have one object.\n\
    \nAt first glance, you might not be able to see the difference between the Explorer\
    \ and Designer since they are laid out similarly.\n\nFigure 7.1 Explorer layout\n\
    \nThe Explorer is set up with a panel on the left side for your data. This is\
    \ where you can add data and see all of the data items once they have been added.\
    \ The drop-down list at the top of the panel gives you the options to manipulate\
    \ data such as adding a new hierarchy, calculated item, data source filter, and\
    \ so on.\n\nAll of the objects can be found as icons in the toolbar near the top\
    \ of the window. Clicking on any of them places that object into the visualization.\
    \ You can also select an object by clicking on the drop-down list that sits to\
    \ the left of the visualization name. The objects can be controlled with the right\
    \ panel. This contains tabs where you can add data items, set up filtering, and\
    \ change other properties.\n\nFigure 7.2 Creating visualizations\n\nVisualizations\
    \ are added to the canvas area by clicking on the icon to the left of the objects.\
    \ This icon also has a drop-down menu that contains all of the objects so that\
    \ you can do everything with one step. When you add a new visualization, the canvas\
    \ splits and gives you a window for each one as shown above with Visualization\
    \ 2. These can also be minimized by clicking on the minimize icon in the top right\
    \ corner of each window. The visualizations are then placed in the bar at the\
    \ bottom of the canvas shown at the bottom of Figure 7.2 with Visualization 3.\n\
    \n#### Automatic chart feature\n\nA feature that is unique to the Explorer is\
    \ the first object called Automatic Chart. This object is different from others\
    \ in that it changes based on the data items that you provide it. Depending on\
    \ the mixture of categories, measures, geography items, and date fields, SAS chooses\
    \ the chart that works the best for that combination.\n\n**SAS has a built-in\
    \ algorithm to determine which chart you get.**\n\n| Input | Chart Type |\n| :---\
    \ | :--- |\n| One measure | Histogram |\n| One category | Bar chart |\n| One aggregate\
    \ measure | Crosstab |\n| One datetime category and any number of other categories\
    \ or measures | Line chart |\n| One geography and up to two measures | Geo map\
    \ |\n| One geography and three or more measures | Bar chart |\n| One document\
    \ collection | Word cloud |\n| Two measures | Scatter plot or heat map |\n| Three\
    \ or more measures | Scatter plot matrix or correlation matrix |\n| One or more\
    \ categories and any number of measures and geographies | Bar chart |\n\nFigure\
    \ 7.3 Using the automatic chart feature\n\nIn the example above, you can see that\
    \ we are using the Automatic Chart by the top left of the visualization and by\
    \ the information contained in the Roles tab. We took the SAMPLE data set and\
    \ added Order Rating as measures to the chart. The chart generated a Heat Map\
    \ from that information and that is shown above.\n\nFigure 7.4 Removing roles\
    \ in an automatic chart\n\nIn this example, we removed Vendor Rating and added\
    \ Product Line, you can see that the Automatic Chart has now generated a bar chart\
    \ for us. The Automatic Chart feature in the Explorer is a good way to start learning\
    \ more about data, especially if it is one that you are just looking at the first\
    \ time. By adding and removing data items, you get a better sense of what your\
    \ data contains.\n\n#### Box Plots\n\nIn getting familiar with statistics, mean\
    \ and median as well as maximum and minimum are some of the first concepts taught.\
    \ This is because these values explain a lot about your data and you can get a\
    \ better sense of it. By using any measure in your data, the Box Plot in the Explorer\
    \ automatically distributes the data for you.\n\n#### Interpreting the results\n\
    \nThe dark blue shaded area in the middle is our box and the lines below and above\
    \ it are our whiskers. The whiskers represent the minimum and maximum values of\
    \ the range where the boxes represent the middle 50% of data points. This means\
    \ that Q1 is the start of 25% range and Q3 is the 75% range. The range from Q1\
    \ to Q3 is considered the interquartile range. The median is middle between the\
    \ two where data points are below it and half are above.\n\n#### Histograms\n\n\
    As with Box Plots, Histograms are another way for you to see a frequency distribution\
    \ of your data. Only one measure can be used with them, but histograms can be\
    \ an effective way to see how your data is spread out as counts or percent.\n\n\
    #### Using a Correlation Matrix\n\nFinding pieces of information within your data\
    \ that can lead to competitive advantage is what data analysis is all about. Using\
    \ Correlation Matrix is one way to measure relationships between measures in the\
    \ Explorer. The object takes in different measures, compares them against each\
    \ other, and then determines whether a strong relationship is between them.\n\n\
    #### Calculating a correlation\n\nCorrelations in SAS Visual Analytics are calculated\
    \ using Pearson’s product moment. This calculation takes two measures and all\
    \ of their values and generates a coefficient value that describes their relationship.\
    \ The range of the coefficient value can be anywhere from -1 to 1. Anything from\
    \ -1 to 0 indicates a negative relationship, which means as one measure increases\
    \ the other decreases and vice versa. Positive numbers from 0 to 1 indicate a\
    \ positive relationship, which means that as one measure increases the other follows.\n\
    \n#### Forecasting\n\nForecasting is not an object by itself and rather an extension\
    \ of the Line Chart. It is included here as its own section since it is one way\
    \ to do predictive analysis.\n"
