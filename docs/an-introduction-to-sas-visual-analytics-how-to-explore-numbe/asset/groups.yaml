- md: "\n## Part Two: Customizing Your Data Visualizations\n\nOnce you have completed\
    \ the basics of SAS Visual Analytics, it is time to dig into the advanced features.\
    \ In this part, you learn more about creating depth learning for the basic data\
    \ visualizations along with guidelines from industry experts. The last chapter\
    \ shows you some of the more advanced statistical objects and features available\
    \ in the application and how to apply them.\n\nOne of the best features of SAS\
    \ Visual Analytics is the ability to create advanced analytical objects. After\
    \ reading this chapter, you will be able to understand the concepts even with\
    \ only a limited understanding of the statistics.\n\n- **Chapter 5** Visualizing\
    \ Your Data\n\nThis chapter walks through the simple objects like line, bar, and\
    \ pie charts. It explains how to use each object and provides tricks for overcoming\
    \ the common issues that intermediate users face as they create reports.\n\n-\
    \ **Chapter 6** The Where of Data\n\nPrepping your data is important to get the\
    \ geography to work, so guidelines and tips will be provided for that. The chapter\
    \ discusses the map objects as well as how to use location analysis.\n\n- **Chapter\
    \ 7** Approachable Analytics\n\nBusiness users are often intimidated by statistical\
    \ objects. This chapter covers how to use them along with the analytical features\
    \ that are found in the Data Explorer. This chapter shows how easy it is to turn\
    \ data into insights!\n\n## Chapter 5: Visualizing Your Data\n\nNo matter which\
    \ data visualization object you are using, there are still a few rules that apply\
    \ to all of them. In *Looking Good in Print*, Roger Parker has many examples of\
    \ how newbies and professionals create ineffective ads, wedding invitations, and\
    \ newsletters because of a failure to understand how people consume visual information.\n\
    \nParker provides several makeovers to show what a difference a clean design,\
    \ a color change, or removing words can make. While he is often re-doing something\
    \ that was uninspired, he is also careful to note that design is not about a right\
    \ or wrong technique. It is about *effective* communication. A cardboard sign\
    \ that reads Yard Sale in a faint, small font is just not as effective as one\
    \ with large letters and an arrow pointing where to go. A careful person could\
    \ see the smaller sign and arrive at the sale, but the clearly written sign could\
    \ draw more attention to itself and capture more customers. Thus, the well-designed\
    \ sign is more effective.\n\nThis is good advice to keep in mind as you read this\
    \ chapter and select your own visualizations. Think about the most effective way\
    \ to communicate your message instead of the prettiest, coolest, or even easiest.\
    \ In this chapter, you learn about the basic data objects, review usage guidelines,\
    \ and some tips for overcoming common situations.\n\n### ELEMENTS OF AN EFFECTIVE\
    \ DATA VISUALIZATION\n\nWhen crafting a report or a data visualization, keep in\
    \ mind your message, your audience, and your technique.\n\n#### Your message:\
    \ know your point\n\nIt seems obvious to start with a statement like “Know your\
    \ point” or “Make sure you understand your message.” Why would someone assemble\
    \ a data visualization otherwise? The problem introduces itself when you mix a\
    \ fancy data visualization application with your everyday business analyst. The\
    \ result is a data visualization that says, “Hey, look what I can do!” It is easy\
    \ to find cool ways to display the data without considering if it leaves the audience\
    \ with an ineffective message.\n\nThis is where data storytelling enters the picture.\
    \ The data visualization must either answer a question, clarify a point, or reveal\
    \ relationships within the data. After seeing the data visualization, the reader\
    \ should have a takeaway. The takeaway can be as simple as an insight or as complex\
    \ as determining additional paths to explore.\n\nDefinitely, analysts should be\
    \ encouraged to find new ways to display data, but the method should enhance their\
    \ message and not focus on the software. Think of what your data visualization\
    \ is trying to communicate to your audience before you create it.\n\n**How do\
    \ I know my data visualization works?**\n\nWrite your question on the top of the\
    \ graph and then explain to yourself how the data visualization supports your\
    \ point. You might be surprised if the data visualization cannot answer the question\
    \ that you are posing.\n\n#### Your audience: know who is listening\n\nIf someone\
    \ is inexperienced with a bar chart, then data in a box plot will really take\
    \ some explaining. The audience might miss your point if they are confused about\
    \ the data visualization technique. However, if your audience is willing to learn,\
    \ it might be worth your time to educate them. In general, save your sophisticated\
    \ data visualization for an advanced crowd.\n\nYou also need to consider how well\
    \ the audience understands the underlying data. If you are showing contact center\
    \ data, those audience members who are more familiar with the department or topic\
    \ require less education than someone who walks in off the street. Audience members\
    \ “in the know” expect issues about inadequate staffing or increased call volumes.\
    \ Because they understand more about how the data is collected, they’re more likely\
    \ to understand advanced data visualization.\n\n#### Your technique: follow the\
    \ KISS principle\n\nProbably you have heard the Keep It Simple Stupid (KISS) principle\
    \ stated hundreds of times—probably because it is true. Keep your message and\
    \ chart simple. Audiences can be quickly overwhelmed when there is too much data,\
    \ visual clutter, or information in the data visualization. They can easily miss\
    \ your point, which is to direct their attention to what is important.\n\nKeep\
    \ your message simple and straightforward by removing any unnecessary visual clutter.\
    \ Your job is to direct the viewer’s attention to what is important about the\
    \ message. The following guidelines can be applied to the majority of your data\
    \ visualizations and will be discussed further in this chapter:\n\n- Set your\
    \ X-axis as 0.\n- Limit the number of categories shown at once.\n- Avoid over-labeling\
    \ elements—it creates chart junk.\n- If you use Other category, it should be a\
    \ small percentage of the data.\n\nData visualization experts, such as Few and\
    \ Tufte, remind us that users should not be distracted by the presentation. Instead,\
    \ users should be focused on the numbers and message. Your goal is to simplify\
    \ the data so that the users can see what see.\n\n**Keep it simple is not an insult**\n\
    \nIf you were an average mechanic working in combat conditions, you would value\
    \ an engine whose design followed the KISS principle. This principle is often\
    \ attributed to Kelly Johnson of Lockheed Works. “Stupid” does not refer to the\
    \ user, but to the design. It should be so obvious what was wrong with the engine\
    \ that even someone with average understanding could repair it.\n\n## LINE CHARTS\n\
    \nLine charts enable you to see trends over time. They have a much more direct\
    \ purpose than any other chart. Variations of line charts include area plots,\
    \ time series charts, and even Pareto charts. This topic uses the consumer complaint\
    \ database from Financial Protection Bureau (http://www.consumerfinance.gov).\
    \ This database tracks complaints that are received by financial institutions.\n\
    \n### Interpreting the results\n\nIn the following figure, you can see the rate\
    \ for consumer complaints. There is a line for each product. This data visualization\
    \ provides following takeaways:\n\n- During 2013, consumer complaints decreased\
    \ by half but started rising again in early 2014. Wonder what caused the decrease\
    \ and then increase?\n- At the start of 2014, complaints about credit doubled\
    \ and remained high. Is it possible that not all bureaus were reporting prior\
    \ to 2014?\n- Complaints about bank accounts remained consistent. Wonder if everyone\
    \ accurately reporting this data?\n\nThe line chart makes following trends easy.\
    \ For a two-year period, you could understand how complaints arrived and have\
    \ some ideas about to explore next.\n\nFigure 5.1 Line charts display trends\n\
    \n### Line charts: guidelines\n\nWhen producing these charts, keep the following\
    \ tips in mind:\n\n- X-axis is an ordered time series value, such as year, month,\
    \ or even minute. Y-axis is a measure such as count, average, or percentage.\n\
    - Use a line to connect each data point. It is easier to understand the trend\
    \ when the points are connected. The eye glides down the line to understand trend.\n\
    - Indicate missing values with a 0 or a note on the object. If you did not have\
    \ data for the summer of 2013, then you would want to ensure the viewer understood\
    \ the data was missing. Otherwise, your chart might take a huge leap forward and\
    \ the viewer would draw the wrong conclusion.\n\n### Use 0 as y-axis value\n\n\
    If you need to infuse your chart with some drama, then play with the y-axis value.\
    \ Consider the following graphs and how much more dramatic the trend seems when\
    \ we changed the y-axis value. The reported product issues are arriving at a dramatic\
    \ pace, indicating a product with many issues. When we place the y-axis back at\
    \ 0, it is easier to understand that there is flow to the arrival that might be\
    \ seasonal.\n\nFigure 5.2 Adding drama to a line chart\n\nTo control the axis\
    \ values:\n\n1. Select the data object and select the Properties pane.\n2. In\
    \ the Left Y Axis area, type 0 in the **Set fixed minimum** field.\n3. You can\
    \ change the maximum value for the axis by typing a new value in the **Set fixed\
    \ maximum** field.\n\n### Dealing with nonzero axis\n\nIn *Show Me the Numbers*,\
    \ Stephen Few suggests that a better way to handle this situation is to show the\
    \ overall chart and then a second chart with a more focused trend line. You can\
    \ imagine a case where a drop of 400 records might get people excited—especially\
    \ when those people are trying to staff a call center or plan production runs.\n\
    \n### Remember the KISS principle\n\nThe cognitive psychologist George Miller,\
    \ in “The Magical Number Seven Plus or Minus Two,” asserts that most people can\
    \ keep only about five to seven items in their working memory at once. When a\
    \ chart becomes too busy or has too many lines, it is more difficult for the viewer\
    \ to absorb the information. Time to apply the KISS principle!\n\nIn the following\
    \ chart, only 11 lines are showing, but you will spend a lot more time studying\
    \ it as compared to the chart in Figure 5.1. One takeaway is that some products\
    \ receive few or almost no complaints. If your message is “there’s only a few\
    \ products with issues,” then use this chart to emphasize that point. If your\
    \ point is to show the growth difference in the main areas, use the chart in Figure\
    \ 5.1.\n\nFigure 5.3 Keep your categories simple\n\nA remedy for this situation\
    \ is to add a filter that enables the viewer to control how much information is\
    \ displayed at once. Viewers might only be interested in certain products or want\
    \ to compare certain products.\n\n### Be careful with stacking area plots\n\n\
    SAS Visual Analytics provides three options for line chart appearance, shown on\
    \ **Properties** tab:\n\n- Overlay filled: Shows each line with the filled area\
    \ behind it.\n- Overlay unfilled: Shows a line. This is the default.\n- Overlay\
    \ stacked: Shows all groups and places one on top of the others. Thus, the data\
    \ is stacked.\n\n### Contributed over time\n\nIf your line chart contains a grouped\
    \ data item, you can use the overlay filled and overlay stacked choices.\n\nFigure\
    \ 5.4 Overlay stacked line chart\n\nWhen you are working with stacked area plots,\
    \ you can easily confuse users if they don’t understand your message. The problem\
    \ lies in how you want to emphasize the parts to the whole. In this example, the\
    \ data visualization shows area plot grouped by channel to help the viewer understand\
    \ which channels drove the overall trend. The question was “Which channel contributed\
    \ the most to arrival rate in 2014?” What if the title was a generic one—such\
    \ as “Arrival Rate by Channel?” causing the reader to focus on arrival rate fluctuations.\
    \ Although it appears that Phone had a lot of variation, it is not true. In the\
    \ following figure, the grouped data item was moved to Lattice role. When you\
    \ divide the channel into lattice chart, a different story emerges. In this story,\
    \ the web channels contribute the most to the year-end, as shown in the following\
    \ figure.\n\nFigure 5.5 Use the lattice feature to understand individual\n\n###\
    \ Line charts: tips and tricks\n\nHere’s some tips and tricks to help you work\
    \ with common situations in line charts.\n\n#### Tip 1: Dealing with a long timeline\n\
    \nWhen you have a long timeline that you want to show, your data visualization\
    \ might appear too crunched. You can add a sliding window under the object to\
    \ enable the user to expand and focus on periods of interest. From the **Properties**\
    \ pane, click the **Show overview axis** checkbox to add the feature.\n\nFigure\
    \ 5.6 Sliding window to see more data\n\nThe user can expand the window to see\
    \ all dates on the chart or focus the timeline on central period.\n\n#### Tip\
    \ 2: Avoiding chart junk\n\nIf you read any of data visualization pioneer Edward\
    \ Tufte’s books, you quickly learn he is a minimalist. He repeats often that “the\
    \ data should do the talking,” “show only the data,” and so on. He provides multiple\
    \ examples of what he calls chart junk. Tufte uses a data-to-ink ratio to draw\
    \ out his examples, but it’s much simpler to apply his technique than fancy formula.\
    \ Don’t add unneeded items, callouts, and decorations to your chart. When you\
    \ add the data labels to the lines, it quickly changes the flavor of the chart.\
    \ Notice how hard it is to see the trend when you are focused on reading the values.\
    \ You make the viewer think the value has more importance than it does.\n\nFigure\
    \ 5.7 Manage your data\n\nRemember that this is a trend chart. It’s not about\
    \ individual values; it’s about how the values changed over time. Use a bar chart\
    \ or a table if the individual number is important. You might notice that axis\
    \ labels were added—but they really assist the reader? It seems clear that the\
    \ x-axis is a month value item, and the y-axis is a count. The title explains\
    \ that the chart provides trending for arrival rate. You decide whether it adds\
    \ detail or ineffective clutter.\n\n#### Is it information or decoration?\n\n\
    While Tufte discusses minimalization, Alberto Cairo, author of *The Functional\
    \ Art*, reminds designers that the task is message clarity, not simplification.\
    \ Too often designers sacrifice content for style and lose their audience. Each\
    \ visualization is different and this is where your knowledge and discernment\
    \ enters the design process.\n\n#### Tip 3: Transparency can be your enemy\n\n\
    SAS Visual Analytics enables you to overlay the lines. So instead of showing the\
    \ parts to the whole (all complaints broken out by product), you can see how each\
    \ line contributed over time—as you see in the following figure. The Grouping\
    \ Style is Overlay Filled, which shows each item with a fill pattern beneath it.\
    \ You can change the Transparency to 50% to get a nicer look.\n\nFigure 5.8 Colors\
    \ do not match the Legend\n\nThe problem is that the Mortgage is covering the\
    \ other categories and making everything appear as brown and orange. One remedy\
    \ for this situation is to stack the numbers so that we can see how each contributed\
    \ to the total value over time. The grouping style was changed to Stack Filled.\n\
    \nFigure 5.9 Stack the grouped items to clarify your point\n\n#### Tip 4: Keeping\
    \ date intervals\n\nIt is more difficult for the user to understand a timeline\
    \ when there are missing dates. You might also want to extend the timeline to\
    \ show the future. You have a few options when you want to include intervals that\
    \ not exist in your data.\n\n#### Changing the data\n\nYou can change your data.\
    \ In the following figure, we want to extend the data to the end of year. Since\
    \ it is the beginning of the year, we don’t have data for other months.\n\nFigure\
    \ 5.10 Add dates without values\n\nTo correct the issue, we can update the date\
    \ values. In the following example, the data items were appended to main data\
    \ set. SAS Visual Analytics can use the new variable even if other variables are\
    \ empty.\n\nFigure 5.11 Modifying your data source\n\n#### Using a time series\n\
    \nThere is a time series object especially for dates and trend charts. The time\
    \ series object doesn’t mind if you only have data for two months. You can use\
    \ the **Properties** menu to change the fixed minimum and maximum. Of course,\
    \ any report using this method might have small inconvenience.\n\nFigure 5.12\
    \ Time series plot\n\n## BAR CHARTS\n\nBar charts provide more detailed information\
    \ than line charts. This chart type makes easier to compare exact categories.\
    \ There are two types of bar charts: vertical and horizontal. Vertical charts\
    \ compare categories while horizontal charts work especially for ranking.\n\n\
    ### Interpreting the results\n\nIn the following figure, you see the count of\
    \ all complaints received in 2013. The x-axis is categorical data, so no order\
    \ is necessary. The y-axis is the value that indicates the length of the bar.\
    \ Here’s what we learn:\n\n- Consumers had as concern about mortgages as all other\
    \ categories combined.\n- Money transfers and payday loans generated few complaints\
    \ compared to other categories.\n- Bank account, credit cards, credit reporting,\
    \ and debt collection had similar complaint counts.\n\nThe bar chart makes easy\
    \ to compare categories. In this case, you learn that mortgage complaints account\
    \ for most of work.\n\nFigure 5.13 Example bar chart\n\n### Bar charts: guidelines\n\
    \nWhen producing these charts, keep the following tips in mind:\n\n- Allow white\
    \ space between the bars and keep the bars at the same distance.\n- Keep bars\
    \ the same color when the data is a single category. Unless your whole package\
    \ is using theme for a particular category, multiple colors only distract the\
    \ viewer.\n- Avoid using patterns or anything unusual for the bars. It is distracting.\n\
    - Viewers might have a hard time understanding vertical charts when there more\
    \ than 10 categories. Add a filter to allow the viewer to determine what comfortable.\n\
    \n### Choosing a line chart or a bar chart\n\nWhen showing timeline data, you\
    \ can use a line chart or a bar chart. This is occasion where you have to determine\
    \ which is more effective in communicating your point. In the following figure,\
    \ the same data is plotted both ways. The line chart allows the eye to see the\
    \ trend while the bar chart highlights specific values better. As discussed at\
    \ the beginning of the chapter, you have to decide what your message is and what\
    \ you are trying to show.\n\nFigure 5.14 Bar chart versus a line chart\n\n###\
    \ Choosing a grouped chart or a stacked chart\n\nBar charts really shine when\
    \ comparing values across groups. There are two ways to compare values with a\
    \ bar chart: stacked and grouped (or clustered). Determine whether your message\
    \ is about the whole or the parts. Use a stacked chart to show the part-to-the-whole\
    \ and the grouped charts to show the contribution by category.\n\nA stacked chart\
    \ reveals the part-to-the-whole similar to a pie chart. Use this chart when you\
    \ want the viewer to consider each category as a whole more than the values within\
    \ the category. In the following figure, you get a sense of how more complaints\
    \ are about mortgages than about the other categories.\n\nFigure 5.15 Part to\
    \ the whole\n\nGrouped charts are easier to compare across categories. Notice\
    \ that the whitespace is between Product instead of Channel. Your eyes take visual\
    \ that that items are related within the grouping. This chart gives sense of overall\
    \ counts and does show the web as most popular. What you also see that almost\
    \ one uses postal mail to complain about her account, but it is popular method\
    \ for other categories. You most likely’t notice that, overall, Mortgage had highest\
    \ complaints.\n\nFigure 5.16 Contribution by category\n\n### Bar charts: tips\
    \ and tricks\n\nHere’s some tips and tricks to help you work with common situations\
    \ in bar charts.\n\n#### Tip 1: Rescue your long labels\n\nHorizontal charts assist\
    \ with making comparisons but are useful if your labels are long. Notice the difference\
    \ in the labels. The slanted labels are difficult to read because they are too\
    \ long.\n\n- Use the **Ranks** menu to limit the category to top 5 or 10 by count\
    \ or percentage. You can also show the bottom 5 or 10 if the item is tied, use\
    \ the **Ties** check box to display both.\n- Use the **All Other** box to create\
    \ another item where the remaining items are combined into one. In the following\
    \ figure, you can see that last bar is All Other. You want to ensure that item\
    \ is smaller amount than the other bars.\n\nFigure 5.17 Use a horizontal chart\n\
    \n#### Tip 2: Show the complete percentage\n\nIn some instances, you might want\
    \ to convert a count to percentage to show the comparison as whole. If you have\
    \ a grouped chart, you can convert it quickly using the **Properties** tab. Change\
    \ the grouping scale to **Normalize groups to 100%**. SAS Visual Analytics converts\
    \ the numbers to percentages and shows breakout.\n\nFigure 5.18 Change the grouping\
    \ scale to show 100%\n\n#### Tip 3: Using a butterfly chart\n\nButterfly charts\
    \ are similar to grouped charts but enable the user to focus on two measures.\
    \ The measures are placed back to back so they have wings like a butterfly. The\
    \ following example is from a customer service organization. The butterfly compares\
    \ tickets resolved on first contact to the satisfaction rating for the event.\
    \ Team B resolves more tickets on first contact and has highest satisfaction rating.\
    \ Likewise, the team with lower first contact resolution also has lower satisfaction.\
    \ This data object requires that both measures be same type. In our example, both\
    \ measures are percentages. If you want to compare measures of different types,\
    \ you can modify this data object using the Custom Builder feature. The Custom\
    \ Chart Builder enables you to combine multiple data objects. Refer to the user\
    \ documentation for more details about the Custom Builder feature.\n\nFigure 5.20\
    \ Using a butterfly chart\n\n PIE AND DONUT CHARTS\n\nPie and donut charts show\
    \ the parts-to-the-whole relationship of data. Many data visualization experts\
    \ do not advocate using pie charts because as Stephen Few says “they communicate\
    \ information poorly.” If you want to use one of these charts, make sure you understand\
    \ the guidelines for doing correctly. Generally, these charts offer visual relief\
    \ in a sea of text or boxes. In recent years, donut charts have become popular\
    \ in infographics. Starting in release 8.1, SAS Visual Analytics contains donut\
    \ charts as an option. Although donut charts are not shown in this topic, the\
    \ same visualization rules apply.\n\n### Interpreting the results\n\nA pie chart\
    \ shows how each slice contributes to the entire pie. Each slice is a category,\
    \ and a reader should quickly look at the chart and have an answer. Consider the\
    \ following pie charts from a user survey. These pie charts work because they\
    \ have few categories and you can quickly read the answers for results. A pie\
    \ chart is not about precision in value. Does it matter if someone likes pie 72%\
    \ or 75%? The takeaway remains people really like pie might not make them every\
    \ day.\n\nFigure 5.21 Easy-to-understand pie charts\n\nWhen the same information\
    \ is presented in a table, the information is more precise and takes up less space.\
    \ Truthfully, the pie charts revealed the Yes and No answers to the question quicker,\
    \ but they use a lot of space. You could argue that a bar chart is equally effective\
    \ and uses the same space.\n\nFigure 5.22 Table compared to a pie chart\n\nOften,\
    \ data visualization try to do too much with pie chart, and it goes wrong. They\
    \ do not understand how when to use pie chart. Consider the following example.\
    \ You spend more time correlating labels and comparing details that you get overwhelmed.\
    \ It is difficult to know author was communicating.\n\nFigure 5.23 Example why\
    \ pie charts are ineffective\n\n### Pie and donut charts: guidelines\n\nHere are\
    \ the guidelines for how to use pie chart to display your data:\n\n- Parts to\
    \ whole equal 100% – *always*. If your pie chart not equal 100%, tell the reader\
    \ in footnote.\n- Limit to 4 or 5 categories, but it’s better when one category\
    \ is significant-wise.\n- Legends are superfluous when pie chart is done.\n\n\
    ### Removing the legend\n\nYou can avoid using a legend if you allow the tool\
    \ to place labels. From the **Properties** menu, turn on **Show category labels**\
    \ box. This places the category labels on the pie chart, making easier to read.\
    \ You might want the labels on the outside of the chart to keep it consistent.\
    \ Use **Data label location** to control where the label is placed. You might\
    \ want to have the percentage show by clicking **Show values as percentage of\
    \ total** box. However, pie chart works best when one category is dominant. This\
    \ makes values unnecessary.\n\nFigure 5.24 Good pie charts need a legend\n\n###\
    \ Is the comparison effective?\n\nIn the following figure, the data visualization\
    \ compares complaint by channel. You have 5 seconds to tell me the most popular\
    \ channel to receive. This is not a bad way to display data, but is effective?\
    \ In some cases, it is difficult to tell if Referral and Web generated same amount.\
    \ Our eyes are not adept at reading angles and determining which is larger. It’s\
    \ much easier to understand the complaints by channel when we look at horizontal\
    \ chart. This is another example where bar chart makes easier to understand the\
    \ data. Using the bars, your eye has easier time determining the amounts.\n\n\
    Figure 5.25 Too many comparisons\n\n### Pie and donut charts: tips and tricks\n\
    \nHere’s some tricks to overcome common issues.\n\n#### Tip 1: Limit the categories\
    \ to focus the reader’s attention\n\nWhen you have too many categorical values\
    \ in pie chart, you make the reader’s job ten times more difficult. The reader\
    \ might ask themselves “Is this ranking?” or “Do these other categories really\
    \ matter? Why am I shown this?” Notice how going back and forth between the colors\
    \ and legend is frustrating. In the following figure, the same data shown as pie\
    \ chart and as a horizontal chart. Notice how much easier it is in the horizontal\
    \ chart to determine the products that receive most complaints.\n\nFigure 5.26\
    \ When a bar chart works better\n\n#### Tip 2: Keep categories a consistent color\n\
    \nIf you are presenting survey data, then you have multiple pie charts in a row.\
    \ In this case, you want the Yes/No category to have a consistent color. You can\
    \ use a display rule to map the values to set color. Click the data object and\
    \ select **Add Display Rule**. When prompted, select **Color-mapped values**.\
    \ Then, create a line for each category and assign the color to it. In the following\
    \ figure, you can see that Yes been changed to teal and No changed to orange.\
    \ You can set as many values you want.\n\nFigure 5.27 Setting color-mapped values\n\
    \n#### Tip 3: Pie chart as a dashboard gauge\n\nIf you are working on a dashboard,\
    \ sometimes you want to display a single value, similar to the way infographics\
    \ look. You could use a single cell in a list table, but here’s a more clever\
    \ method. Use an invisible pie chart.\n\nThis method retains the value and title\
    \ but hides the pie itself. Let’s build the last one called Unique Customers.\
    \ For this example, we need a distinct count of the companies that received complaints\
    \ for the time period and product. This value must be calculated on-the-fly. We\
    \ can use the Distinct Count feature to count the companies in the data set. When\
    \ the viewer selects a value from the drop-down, the value is immediately re-calculated.\
    \ Here are the steps for creating a distinct count measure and creating the infographic\
    \ look.\n\n1. To create the distinct count value, right-click the data item. This\
    \ data item is character that contains the name of each company. The new value\
    \ appears in Aggregated area called Company (Distinct Count).\n2. Create a new\
    \ calculated item that is character-based. pie chart requires the following: category\
    \ and measure.\n    a Select **New Calculated Item** from the **Data** drop-down\
    \ list.\n    b. Type Placeholder in the **Name** field.\n    c. Change **Result\
    \ type** to Character.\n    d. Type DUMMY in the field. This value never appears\
    \ anywhere.\n    e. Save the calculated item.\n3. Create a new pie chart data\
    \ item. On the **Roles** tab, add **Placeholder** and **Company (Distinct Count)**\
    \ items.\n4. On the **Properties** tab, do the following:\n    a. Uncheck the\
    \ **Show label**.\n    b. Click **Show actual values** box.\n    c. Change the\
    \ **Data location** to Inside.\n5. On the **Styles** tab, do the following:\n\
    \    a. In the Data Styling area, change the Data to Gloss.\n    b. In the Text\
    \ Styling area, change the Value size to 60. Adjust the font family if desired.\n\
    \    c. In the Data Colors area, change the first fill box to White.\n6. Save\
    \ your report and look it in Report application. With the drop-down filters in\
    \ place, your new value will change as the selections change.\n\nThis is the end.\n\
    \n## TREEMAPS\n\nTreemaps enable viewers to see the results from a large number\
    \ of categories. A treemap is a more efficient use of space than bar chart. These\
    \ data objects are especially good for hierarchical data to reveal overall patterns\
    \ in the data.\n\n### Interpreting the results\n\nThis object shows the complaints\
    \ for several companies. The box size indicates the number of complaints for 2015.\
    \ The larger the box, more complaints the company received. The color of the square\
    \ indicates the percentage change in complaints. If the color is darker, the company\
    \ received more complaints for 2015 than for 2014. You can filter the results.\
    \ We might want to remove companies that had few complaints in one year and then\
    \ no complaints the next year.\n\nFigure 5.28 Treemap example\n\nHere’s what we\
    \ learn from this visualization:\n\n- The larger financial institutions receive\
    \ more complaints. This is not surprising since they probably hold more mortgages.\
    \ Notice that it is difficult to judge the exact number of complaints. You just\
    \ know it is similar count.\n- You might find that you can group boxes by size\
    \ and thus understand how the financial institutions are similar. In the lower\
    \ right of the treemap, there is a second group of institutions that received\
    \ a similar number of complaints. In the top right, another group received a similar\
    \ amount.\n- We can see that many of the companies shown in teal decreased the\
    \ complaints or maybe just received a similar number as the year before. By positioning\
    \ your pointer over Bank of America, we see 21% decrease in complaints.\n\nThe\
    \ treemap provides an overview of many categories at once in a very small area.\
    \ By using color, you can add an extra dimension to the analysis.\n\n### Treemaps:\
    \ guidelines\n\nWhen using a treemap, here are some guidelines.\n\nAdd two measures\
    \ – one for size and one for difference\n\nYou can use two or three measures for\
    \ this chart. The first measure is a sum, count, or average value. The second\
    \ measure can be a rating, percentage difference, or another value that indicates\
    \ a change. In Figure 5.27, the size of the box is the sum of complaints, and\
    \ the color is the year-over-year percentage difference.\n\nYou can create the\
    \ second measure with an aggregated measure or with a derived measure. With a\
    \ derived measure, you can calculate time-based values to show a percentage change\
    \ or difference. See the “Tables and Crosabs” topic in this chapter for a detailed\
    \ discussion about derived measures.\n\nAdd the legend\n\nLike the bubble plot,\
    \ the legend enables the user to understand what the box size indicates and how\
    \ the color is judged. You can add the legend by clicking the **Legend** check\
    \ box on the **Properties** menu. Use the Style pane to control the appearance\
    \ of the legend, such as background color and font size.\n\n### Treemaps: tips\
    \ and tricks\n\nUse the following tips and tricks when creating treemaps.\n\n\
    #### Tip 1: Gradient values are easier to interpret\n\nIf you not supply a third\
    \ measure, all of the boxes are same color. When you add the third measure, SAS\
    \ Visual Analytics changes the range from red to green. You can change the color\
    \ by clicking on the boxes on the Style menu. If your data is not performance\
    \ related, you might make more sense to use yellow or gray.\n\nFigure 5.30 Gradients\
    \ are easier to understand\n\n#### Tip 2: Hierarchies make easier to navigate\n\
    \nUse a hierarchy to enable the user to drill-down through the boxes. For the\
    \ preceding treemap, was showing the company only. We can add a hierarchy that\
    \ goes from the product to the company at the top. The last level of the hierarchy\
    \ shows issues.\n\nTo build a hierarchy:\n\n1. Click the arrow icon and click\
    \ **New Hierarchy**.\n2. Drag the items that you want to the hierarchy. The order\
    \ in which they are placed is how hierarchy appears.\n3. In this example, the\
    \ data items are ordered by Product -> Sub-product -> Company.\n4. Provide a name\
    \ for the hierarchy. Click **OK**.\n\nThe hierarchy item is added to Hierarchy\
    \ area on the **Data** menu. It is then added to the treemap.\n\nFigure 5.31 Users\
    \ can drill-down with hierarchy\n\n## WATERFALL CHARTS\n\nWaterfall charts show\
    \ how a cumulative value increments or decrements. These charts have many names,\
    \ including *progressive bar chart*, *bridge chart*, and *flying bricks chart*.\
    \ This chart is another example of understanding the part-to-whole values discussed\
    \ in the “Using Categorical Charts” topic. These charts are commonly used in financial\
    \ metrics to show a profit-and-loss statement. This data visualization is considered\
    \ a good alternative to pie chart. It is easier for the user deconstruct what\
    \ happened to a value, such as revenue.\n\n### Interpreting the results\n\nWaterfall\
    \ charts help the user analyze how a value changed and what contributed to the\
    \ change. In the following figure, you can see the how costs change the revenue\
    \ and the resulting profits. The decreasing value is shown as red, and the increasing\
    \ value is shown as green. The decreasing values go down, and increasing values\
    \ rise up. The final amount called Profit After is shown as the blue bar.\n\n\
    Figure 5.32 Example waterfall chart shows revenue change\n\nWhat we learn from\
    \ this visualization:\n\n- The largest cost goes toward producing the products.\
    \ Reducing costs in area might have a larger overall impact.\n- The other costs\
    \ are minuscule compared to product cost.\n\n### Waterfall charts: guidelines\
    \ for use\n\nWaterfall charts are used to show how a single value changed, such\
    \ as Revenue. You want to keep this data visualization simple using the similar\
    \ guidelines used for pie chart. The exception is that you can have more than\
    \ five categories since the bars are used.\n\n### Add the initial and final values\n\
    \nIf your data source only has the values by category, you might want to add the\
    \ starting and ending value. Select the **Set initial value** and **Show Final\
    \ (cumulative)** check boxes to add these bars to the chart. You can also change\
    \ the labels.\n\nFigure 5.33 Adding the initial and final values\n\n### Adding\
    \ the response sign\n\nYou can allow negative values to show as red and positive\
    \ values to show as green. In the Properties window, select the **Color by response\
    \ sign** check box. If your data source not have negative values, then the data\
    \ object might not be displayed properly.\n\nYou can create a negative value using\
    \ a calculated item. In the following figure, Order Product Cost was multiplied\
    \ by -1 to create a negative value. Refer to the “*Creating Your First Dashboard*”\
    \ chapter for more details about creating a calculated item.\n\nFigure 5.34 Creating\
    \ a calculated item\n\n### Waterfall charts: tips and tricks\n\nThe following\
    \ tips and tricks can be used with other data objects, but might come in handy\
    \ when working with these objects.\n\n#### Tip 1: Consider a summary source\n\n\
    If your data is tall and wide, then might not work with the waterfall chart. Our\
    \ example data VA_SAMPLE_INSIGHTS uses wide format. This means that the data items\
    \ are each in own column and listed as separate data item. The waterfall chart\
    \ shows each value contributes to single category for 2013. The values need to\
    \ be summarized and transposed as shown in the following figure:\n\nFigure 5.35\
    \ Wide data\n\n#### Tip 2: Use a custom sort\n\nWith the waterfall chart, you\
    \ might want the categories to display in a specific order. You can use the custom\
    \ sort to change the order. For the object in Figure 37, the categories required\
    \ custom sort. To add a custom sort to a category, right-click the category name\
    \ and select **New Custom Sort**. Then drag the items from Category column to\
    \ Sorted Items column. The data object updates automatically.\n\nFigure 5.38 Use\
    \ a custom sort\n\n#### Tip 3: Use section filtering for different sources\n\n\
    Since the data source needs to work with the other section elements, those were\
    \ added to file. For example, this waterfall chart is in the same section as bar\
    \ chart. Both of the data elements are controlled by drop-down lists. You want\
    \ the control to work on all of the data objects.\n\nFigure 5.39 Section filtering\
    \ for different sources\n\n#### Mapping data sources\n\nIf the data sources have\
    \ the same values, you can map the data sources. The data items not need to have\
    \ the same name. After adding your data objects and control, right-click the control\
    \ and select **Edit Data Source Mapping**. In the **Source** field, select the\
    \ data items for the Source and the Target that should be mapped. You can have\
    \ multiple interactions.\n\nFigure 5.40 Mapping data sources to the controls\n\
    \n"
  mdcn: "\n\n## 第二部分：自定义您的数据可视化\n\n一旦你完成了 SAS Visual Analytics 的基础学习，就可以深入研究高级功能了。在这一部分，你将学习更多关于为基础数据可视化创建深度学习的内容，并学习行业专家的指南。最后一章将向你展示应用程序中的一些高级统计对象和功能，以及如何应用它们。\n\
    \nSAS Visual Analytics 的最佳功能之一是创建高级分析对象的能力。读完本章后，即使对统计学了解有限，你也能理解这些概念。\n\n- **第\
    \ 5 章** 可视化您的数据\n\n本章介绍了折线图、柱状图和饼图等简单对象。它解释了如何使用每个对象，并提供了克服中级用户在创建报告时面临常见问题的技巧。\n\
    \n- **第 6 章** 数据的方位位置\n\n准备数据对于让地理功能正常工作至关重要，因此将提供相关的指南和提示。本章讨论了地图对象以及如何使用位置分析。\n\
    \n- **第 7 章** 易于上手的分析\n\n业务用户通常会对统计对象感到畏惧。本章涵盖了如何使用这些对象以及 Data Explorer 中提供的分析功能。本章展示了如何轻松地将数据转化为洞察！\n\
    \n## 第 5 章：可视化您的数据\n\n无论你使用哪种数据可视化对象，都有一些适用于所有对象的规则。在《印刷中的美感》（*Looking Good in\
    \ Print*）书中，Roger Parker 提供了许多例子，说明新手和专业人士如何因为不理解人们消费视觉信息而创建出无效的广告、婚礼邀请函和通讯。\n\
    \nParker 提供了几种改进方案，以展示简洁的设计、色彩的变化或删除文字可以带来多大的差异。虽然他经常是在重做缺乏灵感的内容，但他仔细指出，设计并不是关乎技术的对错。它关乎*有效*的沟通。一个用淡、小字体写着“Yard\
    \ Sale（庭售）”的纸牌，效果不如一个带有大字母和指向方向箭头的牌子。细心的人可能会看到小牌子并到达现场，但字迹清晰牌子可以吸引更多注意力并捕捉更多客户。因此，设计良好的牌子更有效。\n\
    \n在阅读本章并选择自己的可视化方案时，请记住这些良好的建议。考虑传递信息最有效的方法，而不是最漂亮、最酷或甚至最简单的方法。在本章中，你将学习基础数据对象，回顾使用指南，以及克服常见情况的技巧。\n\
    \n### 有效数据可视化的要素\n\n在制作报告或数据可视化时，请记住你的信息、你的受众和你的技术。\n\n#### 你的信息：明确你的要点\n\n从“明确你的要点”或“确保你理解你的信息”这样的陈开始显而易见。否则，人们为什么要组合数据可视化呢？当你把花哨的数据可视化应用与你的日常业务分析工作相结合时，问题就出现了。结果是一个在说“嘿，看我能做什么！”的数据可视化。很容易找到酷炫来显示数据，而不考虑这是否会给受众留下无效的信息。\n\
    \n这就是数据故事进入登场的地方。数据可视化必须回答一个问题、澄清一个观点，或揭示数据内部的关系。在看到数据可视化后，读者应该有所收获。这种收获可以是一个简单的洞察，也可以是复杂的到确定额外的探索路径。\n\
    \n显然，应该鼓励分析师寻找展示数据的新方法，但方法应该增强他们的信息，而不是关注软件。在创建数据可视化之前，思考你的数据可视化试图向受众传达什么。\n\n\
    **我如何知道我的数据可视化是否有效？**\n\n在图表顶部写下你的问题，然后向自己解释数据可视化如何支持你的要点。如果数据可视化无法回答你提出的问题，你可能会感到惊讶。\n\
    \n#### 你的受众：知道谁在听\n\n如果有人对柱状图不熟悉，那么箱线图中的数据确实需要一些解释。如果受众对数据可视化技术感到困惑，他们可能会错过你的要点。然而，如果你的受众愿意学习，那么花时间教育他们可能是值得的。通常情况下，将你复杂的数据可视化留给高级受众。\n\
    \n你还需要考虑受众对底层数据的理解程度。如果你展示的是呼叫中心的数据，那些对该部门或主题更熟悉的受众成员比路人甲的人需要较少的教育。“知情”的受众预期会有人员配备不足或呼叫量增加的问题。因为他们更了解数据是如何收集的，所以他们更有可能理解高级的数据可视化。\n\
    \n#### 你的技术：遵循 KISS 原则\n\n你可能已经听过数百次“保持简单愚蠢”（Keep It Simple Stupid, KISS）原则——这可能是因为它是正确的。保持你的信息和图表简单。当数据可视化中包含太多数据、视觉杂乱或信息时，受众会很快被淹没。他们很容易错过你的要点，而你的要点是将他们的注意力引导到重要的事情。\n\
    \n通过移除任何不必要的视觉杂乱，保持你的信息简单直接。你的工作是引导观众的注意力关注信息中的重要部分。以下指南适用于你的大多数数据可视化，并在本章中进一步讨论：\n\
    \n- 将你的 X 轴设置为 0。\n- 限制一次显示的类别数量。\n- 避免对元素进行过度标记——这会产生图表垃圾。\n- 如果你使用“其他”（Other）类别，它应该是数据的一小小比例。\n\
    \n数据可视化专家（如 Few 和 Tufte）提醒我们，用户不应该被呈现方式分心。相反，用户应该专注于数字和信息。你的目标是简化数据，让用户能够看到他们该看到的。\n\
    \n**保持简单不是侮辱**\n\n如果你是一个在战斗条件下工作的普通技师，你会看重一个设计遵循 KISS 原则的引擎。这个原则通常归功于洛希德公司的 Kelly\
    \ Johnson。“愚蠢”不是指用户，而是指设计。引擎出的问题应该是显而易见的，至于即使是普通水平的人也能修理它。\n\n## 折线图\n\n折线图让你看到随时间变化的趋势。它们比任何其他图表都有更直接的目的。折线图的变体包括面积图、时间序列图，甚至是帕累托图。本主题使用了财务保护局（http://www.consumerfinance.gov）的消费者投诉数据库。该数据库跟踪金融机构收到的投诉。\n\
    \n### 解释结果\n\n在下面的图中，你可以看到投诉率。每个产品有一条线，这比任何其他图表都更直观。这种数据可视化提供了以下结论：\n\n- 2013\
    \ 年期间，投诉减少了一半，但在 2014 年初再次上升。导致了什么原因？\n- 2014 年初，投诉翻倍并保持在高位。是否所有机构都是这样？折线图更容易理解趋势。\n\
    \n### 折线图：指南\n\n在制作这些图表时，请记住以下建议：\n\n- X 轴是时间序列值，如年、月或分钟。\n- Y 轴是测量值，如计数、平均值或百分比。\n\
    - 使用线条连接每个数据点。当点连接起来时，更容易理解趋势。\n- 使用 0 来指示缺失值。如果你没有 2013 年夏季的数据，那么你希望确保观众理解数据是缺失。否则，你的图表可能会出现巨大的跳跃，观众得出错误的结论。\n\
    \n图 5.1 线图显示趋势\n\n### 使用 0 作为 Y 轴值\n\n如果你需要为图表增加一些戏剧性，请调整 Y 轴值。当我们把 Y 轴放回 0 时，趋势看起来更具戏剧性。\n\
    \n图 5.2 在折线图中增加戏剧性\n\n控制轴值：\n\n1. 选择数据对象并选择“属性”窗格。\n2. 在“左 Y 轴”区域输入 0。\n3. 在“固定最大值”（Set\
    \ fixed maximum）字段中输入新值来更改轴值。\n\n### 处理非零轴\n\n在《数字》（Show the Numbers）中，Stephen\
    \ Few 建议处理这种情况的方法是显示整体图表，然后显示一个更关注趋势的图表。你可以想象400 条记录的下降会让人们兴奋——特别是当他们试图分析呼叫中心或计划运行运行时。\n\
    \n### 记住 KISS 原则\n\n认知心理学家 George Miller 在《魔法数字加减二》中断言，大多数人一次只能在工作记忆中保留五到七个项目。当图表变得过于繁忙或线条过多时，观众就很难吸收信息。是时候应用\
    \ KISS 原则了！\n\n在下面的图中，只显示了 11 条线，但与图 5.1 相比，你会花费更多时间研究。一个结论是某些产品收到的投诉很少或没有。如果你的信息是“只有少数产品有问题”，请使用此图表来强调这一点。如果你的目标是显示主要区域的增长，请使用图\
    \ 5.1。\n\n图 5.3 保持类别简单\n\n这种情况的解决方法是添加一个过滤器，让观众控制一次显示的信息。观众可能只对某些产品感兴趣，或想比较某些产品。\n\
    \n### 注意面积图\n\nSAS Visual Analytics 为线图外观提供了三种选项，显示在“属性”标签页上：\n\n- 填充（Overlay\
    \ filled）：显示每条线及其后面的填充区域。\n- 空心填充（Overlay unfilled）：显示线条。这是默认设置。\n- 叠加填充（Overlay\
    \ stacked）：显示所有组，并将一个放在另一个上面。因此，数据是堆叠的。\n\n### 随时间贡献\n\n如果你的折线图包含分组数据项，你可以使用填充填充和叠加填充选项。\n\
    \n图 5.4 叠加填充线图\n\n当你处理堆叠面积图时，如果他们不理解你的信息，你很容易困扰用户。问题在于你如何强调部分与整体。在这个例子中，数据可视化显示按通道分组的面积图，帮助观众理解哪些渠道驱动了整体趋势。问题是“哪个渠道对\
    \ 2014 年的到达率贡献最大？”如果标题是通用的——例如“按渠道划分的到达率”，会导致读者关注到达率的波动。尽管看起来电话有很多波动，但事实并非如此。在下面的图中，分组数据项被移动到了网格（Lattice）角色。当你将通道分为网格图时，一个不同的故事就出现了。在这个故事中，网络渠道对年底的贡献最大，如下图所示。\n\
    \n图 5.5 使用网格功能理解个体\n\n### 折线图：技巧和窍门\n\n这里有一些技巧和窍门可以帮助你处理折线图中的常见情况。\n\n#### 技巧\
    \ 1：处理长时间轴\n\n当你有一个想要展示的长时间轴时，你的数据可视化可能看起来太拥挤。你可以在对象下方添加一个滑动窗口，使用户展开并关注感兴趣的时期。从“属性”窗格，勾选“显示概要轴”（Show\
    \ overview axis）来添加该功能。\n\n图 5.6 使用滑动窗口查看更多数据\n\n用户可以扩展窗口查看图表上的所有日期，或将时间轴专注于中心时期。\n\
    \n#### 技巧 2：避免图表垃圾\n\n如果你读过数据可视化先驱 Edward Tufte 的任何书，你会发现他是一个极简主义者。他经常反复说“让数据自己说话”、“只显示数据”等。Tufte\
    \ 提供了许多他称为“图表垃圾”的例子。他使用数据与墨水的比例来得出这些例子，但这比复杂的公式要简单得多。不要添加不需要的元素、标注和装饰到你的图表中。当你给折线添加数据标签时，图表的风格会迅速改变。注意，当你关注数值时，很难看到趋势。这是一个趋势图。这让观众认为数值比数据本身更重要。\n\
    \n图 5.7 管理你的数据\n\n#### 它是信息还是装饰？\n\nTufte 讨论了最小化，而《功能艺术》（The Functional Art）作者\
    \ Alberto Cairo 提醒我们，任务是清晰，而不是简化。设计师往往为了风格牺牲内容并失去观众。每个可视化都是不同的，这正是知识进入设计的地方。\n\
    \n#### 技巧 3：透明度可能是你的敌人\n\nSAS Visual Analytics 允许你叠加线条。为了不是显示部分与整体（按产品分组），你可以看到每个项目随时间的变化——如下图所示。分组样式被改为“填充”（Overlay\
    \ Filled）。你可以将透明度设为 50% 以获得更好的外观。\n\n图 5.8 颜色不匹配\n\n问题是抵押覆盖了其他类别，使一切看起来都是棕色和橙色。这种情况的解决方法是堆叠数字，我们可以看到每个项目对总值的贡献。分组样式改为“叠加填充”（Stack\
    \ Filled）。\n\n图 5.9 堆叠项目以明确你的要点\n\n#### 技巧 4：保留间隔\n\n当日期缺失时，理解时间轴是很的。你可能还想扩展时间轴来显示未来。当你包含包含数据中的时间间隔时，几个选项。\n\
    \n#### 修改数据\n\n你可以更改数据。在下面的图中，我们希望将数据扩展到年底。由于是年初，我们没有月份的数据。为了修正这个问题，我们可以更新日期值。在下面的例子中，数据项被附加到主数据集中。SAS\
    \ Visual Analytics 可以使用新变量，即使其他变量是空的。\n\n图 5.10 无值的日期\n\n#### 使用时间序列\n\n时间序列对象特别适用于日期和趋势图。如果你只有月份的数据，时间序列对象并不反对。你可以使用“属性”菜单更改固定最小值和最大值。当然，使用这种方法的任何报告可能会有不方便。\n\
    \n图 5.12 时间序列图\n\n## 柱状图\n\n柱状图比折线图提供更详细的信息。这种图类型更容易比较类别。柱状图有两种类型：垂直和水平。垂直图比较类别，而水平图特别适用于排名。\n\
    \n### 解释结果\n\n在下面的图中，你可以看到 2013 年收到的所有投诉。X 轴是类别数据，因此不需要排序。Y 轴是指示柱长度的值。以下是我们学到的：\n\
    \n- 消费者对抵押贷款的关注相当于所有类类别的和。\n- 与其他类别相比，资金转移产生的投诉较少。\n- 银行账户、信用卡、信用报告和债务催收的投诉数量相似。\n\
    \n柱状图很容易比较类别。在这种情况下，你了解到抵押贷款投诉占了大部分工作。\n\n图 5.13 柱状图示例\n\n### 柱状图：指南\n\n在制作这些图表时，请记住以下提示：\n\
    \n- 在柱之间留出空白，并保持柱之间的距离相等。\n- 数据是单个类别时，保持柱颜色相同。除非你的整个包为特定类别使用主题，否则多种颜色会分散观众注意力。\n\
    - 避免对柱使用图案或任何异常物。这会分散注意力。\n- 当类别超过 10 个时，观众可能很难理解垂直图。添加过滤器让观众决定什么是舒服的。\n\n###\
    \ 选择折线图或柱状图\n\n在显示时间数据时，你可以使用折线图或柱状图。这是你必须确定哪种方法传递你的要点更有效的情况。在下面的图中，相同的数据以这两种方式绘制。折线图让眼睛看到趋势，而柱状图更好地突出特定值。正如本章开头讨论的，你必须决定你的信息是什么以及你试图展示什么。\n\
    \n图 5.14 柱状图对比折线图\n\n### 选择分组图或堆叠图\n\n柱状图在比较组间的值时非常出色。用柱状图比较值有两种方法：堆叠和分组（或簇状）。确定你的信息是关于整体还是部分。使用堆叠图显示部分与整体，使用分组图显示按类别的贡献。\n\
    \n堆叠图揭示了部分与整体的关系，类似于饼图。当你希望观众将每个类别视为整体，而不是类别内部的值时，使用这种图表。在下面的图中，你可以感觉到投诉是如何增加的。\n\
    \n图 5.15 部分与整体\n\n分组图更容易比较类别。注意，类别之间的空白是。这种图表提供了整体总数的感，且网络是最受欢迎的。\n\n图 5.16 按类别的贡献\n\
