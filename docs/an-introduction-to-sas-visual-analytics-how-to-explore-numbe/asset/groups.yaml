    Creating new data items


    From the preceding table, you can see several new data items that need to be


    created. This topic explains how to create the data items.


    *Working with data items*


    It is easy to be confused when your data source contains more data items than


    you need. You can filter the list to keep it manageable and to reduce


    confusion. In the following figure, you can see the data items listed in the


    Data pane are the ones checked in the Show or Hide Data Items window.


    To show or hide data items:


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_32.png)


    Click the **Data** menu drop-down list.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_33.png)


    Click **Show or Hide Items**.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_34.png)


    In the **Show or Hide Items** window, check the data items that you want to


    appear.


    Figure 3.5 Showing and hiding data items


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_42.png)


    *Applying a format*


    The drop-down list on the Regional Manager section contains a drop-down


    filter that uses a date variable. It appears as the month and year value, but
    you


    only have the transaction date value that is based on a daily value. If you think


    that you need to add more data items to the source data—you don’t. You can


    change the format so that the data item appears as Month-Year.


    To create the new data item, duplicate the Transaction Date data item by


    right-clicking and selecting **Duplicate Data Item**. A new data item appears.


    Select the new data item so that it is active in the Property area. Its name is


    displayed in the **Name** field.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_32.png)


    Change the name to Transaction Month, Month Year, or a name that makes


    sense for your report.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_33.png)


    Change the Format to **MMYYYY**. Notice that the count changes from


    4,131 to 191\. This count indicates the format is applied.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_45.png)


    **Date formats**


    If you are not familiar with SAS programming methods, then you might not


    understand a format. Formats are handy! You can turn a date value such as


    01FEB2016 into several other values.


    • If you apply the Year format, the data item appears as 2016.


    • If you apply the Month format, the data item appears as Feb.


    • If you apply Quarter format, the data item appears as 1 Quarter, 2016.


    The underlying data does not change, but the appearance is changed. This


    enables you to build charts based on different groupings, such as year, month


    name, or quarter. Formats can also be used to change a value from dollars to


    other money formats, such as Euro or Yen.


    *Creating custom categories*


    The dashboard uses a button bar to filter the data. The button bar is based on


    the business regions called APAC, EMEA, and Americas. The business


    regions are based on the facility continents. However, these values do not


    exist in the data source. You can create this data item using a custom category.


    A custom category enables you to assign labels to groups of values in an


    existing category or measure.


    To create the new data item, do the following:


    1\. Select **Data**  ▶  **New Custom Category**.


    2\. Select the **Facility Continents**.


    3\. In the **Name** field, type Business Regions. You can use any name that is


    not already in use. The name that you choose is what appears in the data


    items list.


    4\. In the Label1 area, type **APAC**. From the values list, drag **AS** and **OC**.


    5\. Click **New label** and type **EMEA** in the Label2 area. From the values
    list,


    drag **AF** and **EU**.


    6\. The remaining continents belong to the Americas. Instead of creating


    another label, click the **Group remaining values as** button and replace Other


    with **Americas** in the field. This assigns any values left to that values.


    Your window should appear similar to the following figure when you are


    finished.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_46.png)


    **Dealing with remaining values**


    When creating custom categories, consider if the data values will change in


    the future before assigning the remaining values. In the preceding example,


    you created two custom categories and then assigned the remaining values as


    Americas. In this case, the region values are controlled by the organization.


    But consider other situations. For example, what if the North Pole or South


    Pole were added as a data value? Would it still make sense to default the


    remaining values to Americas?


    *Changing the aggregation method*


    The regional managers want to review the best, worst, and average approval


    rating for each sales rep. By changing the aggregation method, you can find


    this value quickly. The default aggregation is SUM for all data items, and the


    same is true for Sales Rep Rating. Using this data item, you can create your


    two new data items: one for minimum rating and one for maximum rating.


    These data items are aggregated based on the categories applied. In the


    following example, the Sales Rep Rating, Sales Rep Rating (Min), and Sales


    Rep Rating (Max) are shown. In the top table, the values are an aggregation


    across all business regions for all years. In the bottom table, the yearly


    aggregation was added and the data filtered for 2009\. Compare the two tables


    to see how the values changed based on the category applied.


    Figure 3.6 Measures


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_47.png)


    When used as the Overall Approval Ratings at the top, the values are similar


    across the regions. However, in the second table when adding the year, the


    individual values have more variation. The point is that the same measure


    was used, but it quickly changed value based on the category applied. The


    aggregation method prevents you from needing to create a separate data item


    for each level because the values update based on the category.


    To create the new data items:


    1\. Right-click the **Sales Rep Rating** and change the aggregation method to


    **Average**.


    1\. Right-click the **Sales Rep Rating** data item and select **Duplicate Data**


    **Item**.


    2\. Select the new data item. In the Properties area, change the name to Sales


    Rep Rating (Min) and the aggregation method to Minimum. This value


    represents the worse rating the sales rep received.


    3\. Right-click the **Sales Rep Rating** data item and select **Duplicate Data**


    **Item**.


    4\. Select the new data item. In the Properties area, change the name to Sales


    Rep Rating (Max) and the aggregation method to Maximum. This value


    represents the best rating the sales rep received. You should have two new


    data items in your list.


    Create calculated items


    You can add calculations based on your own formulas. Typically, a calculated


    data item is an expression, such as *cost * quantity*. For this dashboard, we


    need to measure gross profit. Gross profit is based on the Order Total minus


    the Product Cost. You can calculate items based on date or character values.


    You can also use IF/THEN logic to create new data items.


    **Creating your own measures**


    Calculated items and aggregated measures enable you to add new data items


    to your data source. SAS Visual Analytics calculates these data items in real


    time. Not only does this save data preparation time, it also helps the


    dashboard be more dynamic because the user is getting answers on demand.


    The Calculated Item window has three main areas: Data Items, Operators, and


    Work area. From the Data Items area, you can access data items in your data


    source or other calculated items that you have created. From the Operators


    area, you can make changes to your data item. For example, you can add,


    subtract, or compare data items. In the Work Area, you apply operators to your


    data item. For example, in the following figure, the EMEA Target value is


    created by testing if the business region equals EMEA. This calculated item


    can be used in a data object or as part of another calculation.


    Figure 3.7 Creating a calculated item


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_48.png)


    To create a new calculated items:


    1\. Click **Data**  ▶  **New Calculated Item**. The New Calculated Item window


    appears.


    2\. In the **Name** field, type Gross Margin. You can use any name not already


    in use. This name appears in your Data Item list.


    3\. In the **Operator** field, type the minus sign (-). Drag the x – y object
    to the


    work area.


    4\. In the **Data Items** area, select **Order Total** and drag it to the first
    empty


    box.


    5\. In the **Data Items** area, select **Order Product Cost** and drag it to the


    second empty box.


    Your window should look similar to the following figure. You can click


    **Preview** in the left corner to review your calculation.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_49.png)


    Creating aggregated measures


    Aggregated measures are difficult to understand when you first start. These


    data items are similar to the calculated items. You can create logic, do


    calculations, and return complex formulas. It is often not obvious how the two


    data items are different. There is an easy way to think of each one. Calculated


    items go across the rows while aggregated measures go down the columns. In


    the following figure, Gross Margin was created as a calculated item and as an


    aggregated measure. Notice that the aggregated measure contains the overall


    result of *Order Total - Order Product Cost* across all regions and years.


    Figure 3.8 Calculated item versus aggregated measure


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_50.png)


    Aggregated measures are calculated in two ways. You can create the data item


    so that it recognizes the category and uses a *BY group* calculation or uses an


    overall calculation. In the following figure, additional aggregated measures


    were added that use the BY group option. You can see that the Gross Margin


    (Aggregated Measure By Group) reacts to the Transaction Year and shows the


    individual values. In fact, it does not have a value different from the Gross


    Margin (Calculated Item). This is why new users are often confused by the


    two different methods.


    Figure 3.9 Aggregated measurement types


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_51.png)


    When showing overall values, it is smarter to use an aggregated measure.


    However, that doesn’t mean that it is always the best approach. You might


    need to experiment to get the result that you want.


    For the dashboard, you need an aggregated measure that has the Profitability


    Ratio. This aggregated data item is based on the Gross Margin data item. The


    formula is Total Sales divided by Gross Margin. Use the following


    instructions to create the aggregated measure.


    1\. Click **Data** ▶ **New Aggregated Measure**. The New Aggregated Measure


    window appears.


    2\. In the **Name** field, type Profitability Ratio.


    3\. In the **Operator** field, type the divide sign (/). Drag the x / y object
    to the


    work area.


    4\. In the Data Items area, select **Gross Margin** and drag it to the first empty


    box.


    5\. In the Data Items area, select **Order Total** and drag it to the second empty


    box.


    Your window should look similar to the following figure.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_52.png)


    6\. Click **OK** to create the aggregated measure.


    7\. In the Properties area, change the **Format** to **Percent**. Adjust the


    Decimals value to 0.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_53.png)


