    ## 第四章：使用数据生成器 (Data Builder)


    Data Builder 是 SAS Visual Analytics 应用程序，它允许您从各种源提取数据、准备数据并将数据集加载到 SAS LASR 分析服务器或其他位置。如果您还记得之前的章节，LASR
    分析服务器是您在报告构建部分使用数据之前放置数据的地方。通过使用 Data Builder，您在准备和将数据导入 LASR 分析服务器时将具有更强的灵活性。Data
    Builder 还可以用于创建临时表或将表加载到 Hadoop 分布式文件系统 (HDFS)。


    通过 Data Builder，您可以围绕数据构建查询，然后运行这些查询以处理并移动数据移动到输出位置。可以通过本地文件、数据库、SAS 数据集等访问数据。在构建查询时，您可以选择执行细微的数据处理，例如添加新数据项、汇总数据，甚至与其他表进行连接。Data
    Builder 通过用户界面实现这些操作，该界面会在后台构建 SQL 代码。


    当 SAS Visual Analytics 从版本 7.3 迁移到 8.1 时，Data Builder 在界面（切换到 HTML5）和功能方面进行了彻底改革。本章侧重于
    Data Builder 的主要方面和 7.3 版本的各个，第 13 章将带您了解 8.1 版本及其所有更新。


    ### 使用数据生成器


    那么，为什么要使用 Data Builder 而不是直接导入整个数据集呢？对此，您必须记住 LASR 分析服务器在临时内存上运行。因此，任何条件、简单计算、分组等都只是占位符。真实数据每次每次与数据集交互时都会进行计算。通过在
    Data Builder 中进行一些初始数据准备，您可以在数据集进入 LASR 分析服务器之前对其进行完善并使其准备就绪。


    当您尝试处理多个数据集或在 LASR 分析服务器中追加数据集时，也应该考虑 Data Builder。您可以访问 LASR 分析服务器中的表，还可以从本地文件、服务器、数据库和社交媒体导入数据。当表已存在于
    LASR 分析服务器中时，Data Builder 提供了一项功能，可以构建一个每次查询运行时都会追加到该表的查询。当您想要连接表时，查询可以引入多个表，以便您能够通过用户界面或
    SQL 代码按需要连接它们。如果需要，您甚至创建一个整个星型架构。


    ### 用于数据准备的额外 SAS 产品


    Data Builder 拥有许多功能，但重要的是记住此工具在处理简单数据准备时效果最好。如果您需要对数据进行转置、重建模或执行复杂的计算，那么您需要考虑
    SAS Enterprise Guide、SAS Studio 和 SAS Data Integration Studio。


    ### 创建数据查询


    数据查询是您从数据源创建新表并将其加载到源的手段。从根源上说，数据查询是一个 SAS 程序，它将您连接到源，以便您从那里提取数据。然后，查询会在后台执行所有必要的操作，以便您可以将其加载到
    LASR 分析服务器、将查询发送到 HDFS 或创建临时表。在 Data Builder 中，查询在使用之前也必须保存。一旦您保存了查询，就可以在另一个查询中使用它，或者通过执行它来加载数据。


    ### Data Builder 是如何工作的？


    上面，我们提到了数据查询类似于 SAS 程序。它们之所以能这样工作是因为它们是元数据对象。在查询中使用源表之前，首先需要在元数据中注册这些表。Data Builder
    使用 SAS Folders 作为导入表的源。这源于 SAS Management Console；只有当表在元数据中注册后，它们才能在 SAS Folders
    中可用。当表在元数据中注册后，查询程序就会知道每个表的确切位置、文件类型和名称。除了源表，查询还包含有关属性、聚合以及连接表的可能标准的信息。查询还拥有注册结果输出表的信息。


    在了解这些信息后，您就可以开始创建查询的过程。以下是创建查询的基本步骤：


    1. **选择源数据**：在此处查找并添加已在元数据中注册的数据源。

    2. **准备源数据**：在这一步中，对数据进行清洗和合并。如果您有多个表，则需要定义它们在哪里连接。对于单个表，可以通过不将其包含在输出中来删除行。

    3. **构建输出表**：在这里，您可以添加任何您喜欢的列。这些列可以包括您的数据中的聚合或其他计算。

    4. **确定输出位置**：您的表已经准备就绪，但现在您需要决定它的名称和去向。表可以保存到 LASR 分析服务器以及其他位置如 SAS 服务器或 HDFS。

    5. **预览并保存**：一旦准备好输出表，您就可以预览数据。预览提供了您的数据快照。如果您喜欢所看到的内容，就可以保存查询。在保存之前，您无法运行查询。查询也可以随时保存；不需要是完整的。

    6. **运行查询**：当您点击运行查询时，后台开发的代码将执行，您的输出表将被放置在其新位置。


    ### 在开始之前


    查询中使用的表可以来自任何地方。这些可以是本地文件、服务器数据、数据库表或社交媒体。然而，这些表需要在元数据中注册，以便您在 Data Builder 中访问这些数据。管理员可以使用
    SAS Visual Analytics 或 SAS Management Console 为您在元数据中注册表。您也可以访问 LASR 表。当表在元数据中注册后，查询就会知道每个表的确切位置、文件类型和名称。除了源表，查询还包含有关属性、聚合以及连接表的可能标准的信息。查询还拥有注册结果输出表的信息。


    在了解这些信息后，您就可以开始创建查询的过程。在元数据中注册后，您也可以访问 LASR 表。当表在元数据中注册后，查询就会知道每个表的确切位置、文件类型和名称。在元数据中注册后，如果表表
    表，，表可能会导致大，这会影响性能。


    ### 连接到数据库


    当您尝试从数据库导入数据时，您在 Data Builder 中需要提供凭据。


    ### 打开数据生成器


    您可以通过直接链接或从 SAS Home 导航访问 Data Builder。


    **图 4.1 进入数据生成器**


    在 SAS Home 中，您可以使用带有闪电符号的链接访问 Data Builder。此外，左上角的下拉列表中有数据准备的选项。如果您知道服务器和端口号，您也可以直接链接到
    Data Builder。链接结构如下：


    http://<server:port>/SASVisualAnalytics


    ### 理解数据生成器布局


    在导航到 Data Builder 后，您会看到包含三个不同区域的屏幕，帮助您完成查询构建。


    **图 4.2 数据生成器布局**


    在页面顶部有工具栏，用于导航到应用程序的其他部分。


    - **左侧区域**：这是导航面板；它显示 SAS Folders 树中的表和查询。这是在元数据中注册的地方。工具栏包含用于处理文件和创建新文件夹。

    - **中间区域**：这是允许您构建数据查询的工作区。顶部的工具栏用于处理查询。下方面板允许您管理查询的属性。上方面板是 **Design** 选项卡和 **Code**
    选项卡。当您预览或运行查询时，输出显示在 **Results** 选项卡中。

    - **右侧区域**：这允许您管理查询的输入数据和输出数据。这是您选择输出如何处理以及它去向的地方。


    ### 构建您的第一个查询


    对于我们的第一个查询，我们将使用 SAS Guide 中的 EMPINFO 和 SALARY 表。我们要查看此数据的几件事。首先，我们要确保我们的员工（在公司）得到了正确的补偿。EMPINFO
    表包含所有员工的信息，如地址、电话号码、部门、开始和结束日期等。


    ### 创建查询


    要创建一个新查询：


    1. **在左侧区域找到您的数据源**：选择数据源并将其拖入 **Design** 选项卡。一旦 EMPINFO 被选中，您可以在工作区域看到该数据源。

    2. **添加名为 SALARY 的第二个数据源**：Data Builder 通过在它们之间画线建议连接。您可以点击 **Joins** 选项卡修改连接。连接类型可以是内、外、左或右。在本例中，我们保持内连接。

    3. **在 design 选项卡中布局的表中，点击数据项以添加到列编辑器中**：对于我们的查询，我们将使用 Name、ADDR、IDNUM、SALARY
    和 BEDATE。列编辑器跟踪进入新表的数据项。您可以通过点击列并进行选择来更改数据项。默认情况下，在指定它们之前，输出中没有列。

    4. **对列编辑器中的数据项进行更改**：对于我们的查询，我们将标签更改为 Employee Name、Address、ID Number、Salary
    和 Begin Date。列更改输出集中每个项目的 SAS 数据类型。Format 更改显示方式。Label 更改列标题显示。如果标签字段为空，则列名成为默认值。

    5. **在 Outputs 选项卡中确定查询的输出名称和位置**：对于此，我们将表名更改为 Emp_Salary。Location 和 Library 指示您的输出数据将在元数据中注册。Location
    是存储表元定义的地方，Library 是输出表的 SAS 库（在此情况下为 LASR 分析服务器）。我们希望数据去往 LASR，Location 和 Library
    应该默认设置为 LASR 和 Visual Analytics。如果不是，您可以通过点击右侧的文件图标找到它们。Partition By 是在其中一列上放置索引以更有效地访问数据的方法。这应该只在创建查询后的性能调优时使用。

    6. **使用另存为保存查询并将其放在所选位置**：我们将此查询命名为 EmpInfo Join。在保存查询之前，无法运行查询。保存查询后，它将出现在您放置它的左侧文件夹结构中。当保存查询时，我们可以看到
    LASR 分析服务器中的元数据对象。可以通过点击左上角的首页菜单并选择 Administrator 来查看 LASR 分析服务器中的内容。Emp_Salary
    表的状态为红色正方形，因为还没有与它关联的数据，只有它的定义。

    7. **点击 Data Builder 菜单栏中的 ▶ 然后选择 Run**：图标打开一个下拉菜单，提供预览或运行查询的选项。**Preview** 选项运行查询并加载
    100 行到临时表，以便您可以查看输出。**Run** 选项加载完整数据集到输出位置。在 **Results** 选项卡中显示数据。您可以通过点击 **Headings**
    查看列标签。现在，如果您回到 Administrator，可以看到带有绿色圆圈状态加载的数据。


    ### 修改查询


    一旦您添加了源表中的所有列作为输出，您就可以根据需要创建新列。


    ### 添加数值计算


    我们想要查找的是至少工作 25 年的员工。我们有了 BEDATE，但仍然需要计算时间。使用函数来添加数值计算：


    1. **在列编辑器中，点击加号图标添加新行**：给数据项一个名称、类型和标签。

    2. **在表达式字段中，点击图标计算时间**：表达式窗口左侧有选项卡面板，右侧是 SQL 语句。您可以从 Fields 和 Functions 双击 SCAN
    函数。注意：SAS 日期函数如 TODAY() 处理它们将日期转换为整数。

    3. **点击 Apply 返回到详细**：在这里可以点击 Save 和 Save As 图标。verify 功能检查代码的任何语法错误。

    4. **点击 Preview 查看结果**：结果显示为天。

    5. **在表达式字段中编辑表达式**：在表达式字段中除以 365。然后将格式更改为 8。注意：格式为 8 显示数字字段且没有小数。在小数点后添加数字允许任何小数。

    6. **点击 Run 查看结果**。


    ### 添加字符数据项


    我们想要绘制员工的通用位置。我们的 ADDR 数据项包含城市、州和 ZIP 码，但我们只关心州。使用表达式窗口，我们也可以对字符数据创建新列。使用函数添加新字符列：


    1. **添加数据项并打开表达式窗口**。

    2. **在 Functions 选项卡上，转到 String Manipulation 并双击 SCAN 函数**。

    3. **在 Fields 选项卡上，选择 EMPINFO.ADDR。这是您的字符串**。注意：SCAN 函数根据特定字符分割字符串并提取您想要的部分。在
    SQL 表达式中，SCAN 函数显示为 SCAN(string, section to extract, ''delimiter'')。

    4. **由于我们的地址字段显示为“City, State, Zip”，我们将使用 SCAN 来提取两个字母的州**。

    5. **再次预览数据**。您可以看到现在有了 State 数据字段。


    这里是其他用于数据准备的有用 SAS 函数。对于所有可用 SAS 函数，请访问 support.sas.com。


    - **STRIP(var)**：删除前后的空格。

    - **TRANWRD(var, target, replacement)**：将特定文本 (target) 替换为您选择的文本 (replacement)。

    - **COMPRESS(var, text)**：从字符字符串中删除元素 (text)。

    - **SUBSTR(var, start position, length)**：从字符字符串中提取子字符串。您可以识别位置（start position）和要提取的字符数（length）。

    - **CAT(var1, var2, … varN)**：合并字符串。其他变体允许您识别分隔符或如何处理空格。CATS 修剪所有前后的空格。

    - **UPCASE(var)**：将字符串中的所有字符转换为大写。

    - **LOWCASE 和 PROPCASE** 也是可以更改的函数。

    - **PUT(var, format)**：将变量类型从数字转换为字符。

    - **INPUT(var, informat)**：将变量类型从字符转换为数字。


    ### 过滤数据


    在查询中过滤数据有两种方法。在后台，这是 SQL，因此使用 WHERE 和 HAVING 子句来过滤掉不需要的内容。WHERE 子句指定输入数据上的条件，以过滤掉任何经过处理或计算的内容。HAVING
    子句在处理后过滤值，允许它同时处理输入数据和任何聚合函数。


    ### 在处理之前限制数据


    最好使用 WHERE 子句处理所有输入数据，并将 HAVING 子句用于新字段，因为您正在进行计算。这可以提高性能，因为您提前减少了数据。


    ### 添加 WHERE 子句


    我们只需要带有结束日期的活跃员工。要添加 where 过滤器：


    1. **转到 Where 选项卡**。此选项卡允许您添加 WHERE 子句。

    2. 在 Fields 选项卡上，拖动 ENDDATE 字段到 WHERE 框。


    ### 添加 HAVING 子句


    我们需要过滤掉不需要的内容。HAVING 子句在处理后过滤值，允许它同时处理输入数据和任何聚合函数。


