- md: "\n## chapter nine\n## LASR administration\n\nThe LASR Analytic Server is critical\
    \ to the operation of SAS Visual Analytics. Therefore, it is important to become\
    \ familiar with the administration tasks that are necessary to care for the LASR\
    \ Analytic Server. This is because the LASR Analytic Server is incredibly powerful\
    \ and flexible, and there are many considerations for its administration.\n\n\
    In most circumstances, SAS Visual Analytics is only one part of a larger solution.\
    \ Other SAS offerings as well as third-party software can play an important role\
    \ in the daily operations of the environment. Each of these bring their own administration\
    \ tasks and utilities to the table.\n\nThis chapter will focus on many of the\
    \ administration tools and tasks for the LASR Analytic Server. There’s a lot to\
    \ cover–let’s get to it!\n\n## ADMINISTRATION OVERVIEW\n\nThe person responsible\
    \ for administration of SAS Visual Analytics has a lot of ground to cover. She\
    \ must manage users and resources; maintain security and system integrity; and\
    \ then monitor operations and audit activities.\n\nSpecific to the LASR Analytic\
    \ Server, the administrator will handle the following:\n\n- Starting and stopping\
    \ LASR Analytic Servers\n- Loading tables into and dropping tables from LASR Analytic\
    \ Servers\n- Defining data libraries and access controls\n- Monitoring resource\
    \ utilization\n\n## ADMINISTRATION TOOLS\n\nSAS provides several tools for administering\
    \ the SAS Visual Analytics environment. Depending on the task at hand, the administrator\
    \ of SAS Visual Analytics will need to access the correct tools and to complete\
    \ the full set of actions necessary to achieve her goals.\n\n### SAS Management\
    \ Console\n\nThe SAS Management Console is an application (based on Java) for\
    \ administration of critical SAS Enterprise Business Intelligence environment\
    \ components—including many items used by SAS Visual Analytics. The SAS Management\
    \ Console effectively acts as a point-and-click graphical interface to the SAS\
    \ Metadata Server. So wherever metadata describing the SAS Visual Analytics environment\
    \ comes into play, we will need to familiarize ourselves with using the SAS Management\
    \ Console to manage it.\n\nFigure 9.1 Logged on to SAS Management Console as the\
    \ Unrestricted User with full control over all items\n\nUse the SAS Management\
    \ Console to define and manage the existence of LASR Analytic Servers, LASR libraries,\
    \ and LASR tables in metadata. Security access controls to the data in LASR is\
    \ also maintained with the SAS Management Console.\n\n### SAS Visual Analytics\
    \ Administrator\n\nThe SAS Visual Analytics Administrator is a web application\
    \ that is accessed from your web browser. Log on using your credentials that have\
    \ been granted the Visual Analytics Administrator role privileges in the SAS Metadata\
    \ Server.\n\nFigure 9.2 Using VA Administrator to monitor system resource use\n\
    \nWith SAS Visual Analytics Administrator, the administrator can perform these\
    \ tasks specific to LASR:\n\n- Start and stop LASR Analytic Servers.\n- Load and\
    \ unload LASR tables.\n- Check on the status of LASR Analytic Servers (running\
    \ or not) and LASR tables (loaded or not).\n- Apply row-level security to tables\
    \ in LASR.\n- Monitor system resource utilization in real time (CPU, RAM, I/O).\n\
    \nSAS Visual Analytics Administrator provides “live” monitoring of the environment.\
    \ It does not have the ability to show any historical information–only what is\
    \ currently happening.\n\n### SAS Environment Manager\n\nSAS Environment Manager\
    \ was first introduced with SAS 9.4. It’s based on open-source technologies from\
    \ the VMware Hyperic to provide a modular, extensible administration and monitoring\
    \ framework. The SAS Environment Manager is built from several disparate components\
    \ that work together to provide a single service, including agents on each host\
    \ managed in the environment and a server that consolidates all of the agent data,\
    \ stores it, and provides a web-based interface. Log on to the SAS Environment\
    \ Manager using your credentials that have been granted the appropriate level\
    \ of administrative role privileges in metadata.\n\nFigure 9.3 A dashboard shown\
    \ in SAS Environment Manager for monitoring metrics captured for the environment\n\
    \nSAS Environment Manager can be used for “live” monitoring of the environment.\
    \ But more importantly, it constantly captures, tracks, and records system activity\
    \ so that you have access to historical information as well. Because SAS Environment\
    \ Manager is effectively watching the environment whether you are looking at it\
    \ or not, it can also provide alerts (over email, text, and so on) to notify you\
    \ if critical conditions are encountered.\n\nUse SAS Environment Manager to do\
    \ the following:\n\n- monitor all system services and resources (including items\
    \ related to LASR Analytic Server)\n- set alerts based on conditions that you\
    \ choose\n- view and report on current and historical performance\n- perform administrative\
    \ actions for most SAS applications\n\n### SAS Program Code\n\nWith programmatic\
    \ interfaces accessible from SAS, the administrator of SAS Visual Analytics can\
    \ create new interactive or batch programs that can ultimately be used to administer\
    \ almost any aspect of the data lifecycle in support of in-memory tables in LASR.\
    \ SAS programming experts can craft code that can start and stop LASR Analytic\
    \ Servers, load data from any source into LASR and beyond, even to programmatically\
    \ creating and modifying objects stored in the SAS Metadata Server.\n\nFigure\
    \ 9.4 Using SAS Studio to submit program code to work with LASR\n\nThe visual\
    \ administration tools are handy and powerful. Having a graphical interface helps\
    \ make the work of tasks appear more logical and intuitive. However, site operations\
    \ will require some level of scripting, programming, and scheduling to ensure\
    \ that table updates occur automatically. So creating and maintaining your own\
    \ program code will be a useful skill.\n\n### Other tools\n\nA SAS Visual solution\
    \ deployment relies on the tools shown here, but also on many others. While we’ve\
    \ been focused on SAS utilities for administering the environment, there are other\
    \ software products which might need to consider. Other tools that can be useful\
    \ for management of your SAS environment:\n\n- SAS High-Performance Computing\
    \ Management Console\n  - Can be used at sites that prefer it\n  - Not related\
    \ to SAS Management Console\n  - Primarily for maintaining large numbers of user\
    \ accounts\n- Operating system utilities\n  - Linux: netstat, top, ps, mpstat,\
    \ and many more\n  - Windows: Task Manager, Perfmon, the System Event Viewer,\
    \ and so on\n- Hadoop utilities\n  - Deployment management: Cloudera Manager,\
    \ Ambari\n  - Hadoop web applications: DFS Health, YARN Manager\n  - Hadoop Command-line:\
    \ Hadoop, hdfs\n\nWhile we won’t discuss details of those other utilities in this\
    \ book, they are still important contributors to your administration toolbox in\
    \ support of SAS Visual Analytics solution deployment.\n\n## INTERESTING LASR\
    \ ADMINISTRATION TASKS\n\nLASR Analytic Server administration, especially as it\
    \ ties into the greater SAS ecosystem, is a big topic. We want to get you started\
    \ by introducing you to some interesting tasks which you’re likely to encounter\
    \ when administering a SAS Visual Analytics solution at your site.\n\n### The\
    \ role of SAS metadata\n\nSAS Visual Analytics relies exclusively on LASR Analytic\
    \ Servers and LASR tables, which are defined in the Metadata Server. If you are\
    \ a SAS programmer, you can easily write your own code to start a new LASR Analytic\
    \ Server, load data into it, run actions, and get results back. However, unless\
    \ you take the additional step to register that new LASR Analytic Server instance\
    \ and any new tables in metadata then SAS Visual Analytics won’t see them and\
    \ cannot work with them.\n\nSAS metadata also defines access controls to manage\
    \ the content available for users to view, interact with, and possibly administer\
    \ as well.\n\nGenerally speaking, objects in metadata describe things that should\
    \ already (or will soon) exist. In some cases, the metadata is referenced by the\
    \ described item so that it knows about specific start-up or operational parameters.\
    \ The point here is that metadata is meant to describe something that exists independently\
    \ of the metadata itself. If you move or delete an item in the real world, the\
    \ metadata will not automatically reflect that change. SAS Enterprise Business\
    \ Intelligence software will coordinate its internal use of metadata with physical\
    \ items. However, if you manually (or programmatically) create your own metadata\
    \ objects, then you will be responsible for ongoing maintenance of those objects\
    \ to ensure that they reflect the correct state of the real-world items going\
    \ forward.\n\n### Defining new LASR Analytic Servers\n\nSAS Visual Analytics relies\
    \ exclusively on the LASR Analytic Server to provide data and analytics for reporting\
    \ and exploration. The LASR Analytic Server provides a secure, multi-user environment\
    \ for access to data that is stored in memory. The LASR Analytic Server was originally\
    \ built to handle the largest data volumes, but can also work with smaller tables\
    \ as well.\n\nSAS Visual Analytics needs at least one LASR Analytic Server with\
    \ data in memory in order to provide reports to users. But if circumstances warrant,\
    \ you can define multiple LASR Analytic Servers, which can co-exist on the same\
    \ machines or be deployed to their own set of hosts.\n\nBy default, two LASR Analytic\
    \ Servers are created during the deployment of SAS Visual Analytics software:\n\
    \n- LASR Analytic Server on port 10010\n- Public LASR Analytic Server on port\
    \ 10031\n\n### SAS Visual Analytics needs LASR\n\nSAS Visual Analytics relies\
    \ exclusively on the LASR Analytic Server to provide data and analytics for reporting\
    \ and exploration. Depending on the needs of your site, there are several reasons\
    \ that you might choose to create additional LASR Analytic Servers:\n\n- Resource\
    \ usage separation – direct users to different LASR Analytic Servers on separate\
    \ hosts which might be owned by different parties\n- Security – direct users to\
    \ different LASR Servers to protect access to data\n- Dev, Test, Prod – separate\
    \ environments to ensure smooth transition of updates\n- Resource availability\
    \ – if your original host machines are fully used, then deploy another LASR to\
    \ new hosts\n\nFirst of all, defining a new LASR Analytic Server in your environment\
    \ assumes the necessary software exists on all host machines. With that in place,\
    \ we can define a new LASR Analytic Server using the SAS Console:\n\nFigure 9.5\
    \ Using the SAS Management Console to create a new LASR Analytic Server\n\nIn\
    \ SAS Management Console, connect to the SAS Metadata Server with a user account\
    \ that has appropriate administrative privileges. Then right-click the Server\
    \ item and select **New Server**. The New Server Wizard will appear and provide\
    \ a list of server types. Select **SAS Servers** -> **LASR Analytic Server**.\
    \ Click **Next** and give your new LASR Server a name and optional description.\
    \ Then we get to the interesting part.\n\nFigure 9.6 The New Server Wizard for\
    \ creating a new LASR Server\n\nOn the third screen of New Server Wizard, you\
    \ can choose whether to define a “single machine server,” which refers to Non-Distributed\
    \ (SMP) LASR Server. By default, the answer is **No**, which will create a metadata\
    \ object that describes Distributed (MPP) LASR Server.\n\n### LASR runs on different\
    \ architectures\n\nThe Non-Distributed LASR Analytic Server is hosted on a single\
    \ machine. But the Distributed LASR Analytic Server runs on a minimum of four\
    \ machines – one for the LASR root node and at least three worker nodes.\n\nFor\
    \ an MPP LASR Server, you must also provide the answer to two more questions:\n\
    \n- High-Performance Analytics Environment location: The HPAE software is deployed\
    \ separately from the rest of VA. It provides the underlying software used to\
    \ launch MPP LASR Server on multiple host machines. The value of this prompt is\
    \ usually something like /opt/sas/TKGrid. But it might vary at your site. Keep\
    \ in mind that if you intend to use the SAS In-Database Process with a supported\
    \ remote data provider to perform parallel data loads to MPP LASR, then you must\
    \ provide the path to the associated TKGrid_REP directory instead.\n- Number of\
    \ machines to use: The HPAE is installed on at least four machines as the minimum\
    \ requirement for MPP LASR Server, and often many more. You can choose to run\
    \ LASR on ALL of them (the default) or some subset number. You cannot specify\
    \ which subset of machines to use in metadata. If less than ALL, then LASR is\
    \ started on the number of machines you specify in the order listed in the tkgrid.hosts\
    \ file in HPAE configuration on disk.\n\nOpen the Advanced Options in metadata\
    \ of the new LASR Analytic Server, and you can control key usage criteria.\n\n\
    Figure 9.7 Specifying memory limits of the LASR Analytic Server\n\nCareless use\
    \ of LASR can easily overrun the system resources in your environment. RAM is\
    \ a key resource that is critical not just to LASR but to the operating system\
    \ and any other software running on the same host machines. To help ensure that\
    \ LASR behaves well, we can specify values for the following options:\n\n- Data\
    \ loading (%) – default is 80% - If the LASR Analytic Server is currently holding\
    \ tables that consume 80% or more of RAM, then new tables cannot be loaded.\n\
    - External processes (%) – If specified, then processes external to LASR cannot\
    \ retrieve data from or run actions in LASR if this number is exceeded.\n\nNew\
    \ LASR Analytic Servers can also be defined for use by SAS Visual Analytics in\
    \ the SAS Environment Manager application. As with SAS Management Console, you’ll\
    \ need to sign on to SAS Environment Manager with a user account that has the\
    \ appropriate level of administrative privileges and navigate into the Administration\
    \ section (available from the sidebar menu in the upper-left corner of the web\
    \ page). Once there, you can bring up the New Server wizard and enter the information\
    \ needed for LASR:\n\nFigure 9.8 Creating a new LASR Analytic Server for SAS Visual\
    \ Analytics using the SAS Environment Manager administration tool\n\nAs an administrator,\
    \ your ability to proactively manage the LASR Server’s memory usage is helpful\
    \ in maintaining a smooth operating environment. Once your new LASR Server is\
    \ defined, chances are that SAS Visual Analytics can work with it. There are some\
    \ considerations to keep in mind, which are not addressed directly in metadata:\n\
    \n- SAS Visual Analytics users who wish to administer LASR services (starting,\
    \ stopping, and loading data) must have their own OS accounts (using token authentication)\
    \ to launch SAS Workspace Server.\n- For MPP LASR, the OS account that launches\
    \ the SAS Workspace Server must also exist on all hosts of the MPP cluster and\
    \ also have passwordless SSH configured for that account.\n- SAS Visual Analytics\
    \ users who only need read-access to the data which is already loaded into LASR,\
    \ then OS accounts are not necessary.\n\nSAS Visual Analytics, the LASR Analytic\
    \ Server, and other solutions must often interact with third-party software often\
    \ co-existing on the same hardware. For example, it’s a common practice to co-locate\
    \ Hadoop environment alongside LASR to enable the ability to work with HDFS tables.\
    \ If Hadoop services – especially memory intensive software like Spark and Impala\
    \ – are used, then there could be significant contention for the limited amount\
    \ of RAM which LASR relies on. So proper planning and execution of LASR ensures\
    \ that tool behaves well at your site.\n\n### Requirements to administer LASR\n\
    \nSAS Visual Analytics users who wish to load or unload data as well as stop LASR\
    \ Servers must have operating system accounts sufficient to launch SAS Workspace\
    \ Server and also passwordless SSH to each host.\n\n### Defining new LASR libraries\n\
    \nLASR Server isn’t good for much if it doesn’t have any data loaded in memory\
    \ to perform actions. For SAS Visual Analytics to work with data, we need a library\
    \ reference defined in metadata so that SAS Visual Analytics knows which LASR\
    \ Server to connect to. Furthermore, the SAS Metadata Server maintains access\
    \ controls on objects like LASR definitions, librefs, and tables to ensure that\
    \ users can only see the things in the environment.\n\nSAS library references\
    \ (librefs) are used to connect with a given source. The reasons for creating\
    \ new LASR libraries closely follow those for creating LASR Analytic Servers,\
    \ including:\n\n- Security – restricting access to in-memory data based on access\
    \ controls defined per libref\n- Data organization – data sourced from locations\
    \ will require their own libref\n\n### Managing LASR Analytic Servers with code\n\
    \nBesides using point-and-click interfaces like the SAS Visual Analytics Administrator\
    \ to manage LASR operations such as starting, stopping, loading data, and establishing\
    \ limits, you can also write SAS program code which is convenient for automated\
    \ scripting. For example, with a well-designed set of programs, you can start\
    \ up multiple LASR Analytic Servers and load them with data from disparate sources\
    \ at once. As always, SAS offers more than one programmatic technique by which\
    \ you can manage your LASR Servers and their associated data.\n\n### Distributed\
    \ Mode LASR\n\nFor LASR Servers operating in distributed mode (MPP), we can use\
    \ the LASR procedure. PROC LASR provides the following major functionality:\n\n\
    - Start and stop the specified LASR Analytic Server.\n- Load and unload tables\
    \ from LASR memory.\n- Save LASR’s in-memory tables to disk.\n\nFor example, the\
    \ following code can be used to start an MPP LASR Server:\n\n```sas\nproc lasr\
    \ create port=10011\npath=\"/opt/sas/config/Level1/Applications/SASVisualAnalytics/LASR/Signatures\"\
    \nsigner=\"webserver.site.com:7980/SASLASAuthorization\"\nperformance host=\"\
    lasrroot.site.com\"\ninstall=\"/opt/sas/TKGrid\"\nnodes=all;\nrun;\n\n\n**Notes**\n\
    \n- Line 3 is formatted to fit on this page in readable fashion – make sure that\
    \ your actual **path** does not have any spaces.\n- The **create** parameter will\
    \ direct SAS to start up a LASR Server with the specified attributes.\n- Ensure\
    \ that the **port** value that you specify – it doesn’t have to be 10011 – is\
    \ actually available. Otherwise, this LASR Server will not start if another service\
    \ (LASR or otherwise) is already listening at that port number.\n- The **signer**\
    \ functionality is accessed through an HTTP RESTful interface provided by the\
    \ SASLASAuthorization web application. This application is often, but not always,\
    \ a different host machine than the Distributed LASR Server’s Root Node host.\n\
    - The **install** parameter specifies the physical path to the SAS High-Performance\
    \ Analytics software (TKGrid). If you expect to perform parallel loading of data\
    \ from the SAS Embedded Process in a remote data provider, then this path should\
    \ point to the associated **TKGrid_REP** directory instead.\n\nStopping an MPP\
    \ LASR Server is even simpler:\n\n```sas\nproc lasr stop port=10011\nperformance\
    \ host=\"lasrroot.site.com\"\nrun;\n```\n\n**Notes**\n\n- The **port** attribute\
    \ in combination with the **host** provides the key criteria for stopping the\
    \ intended LASR Server.\n- The **stop** parameter directs the LASR Server to not\
    \ accept any new client connections, to not allow any current actions to finish\
    \ executions, and then to terminate the server processes.\n\nIf this LASR Server\
    \ is already defined in metadata (with matching attributes like port number, signer,\
    \ and installed location), then its status in SAS Visual Analytics or SAS Environment\
    \ Manager will change to reflect the results of your successful execution – and\
    \ you can further control the LASR Server there.\n\n### Non-Distributed Mode LASR\n\
    \nProgrammatically manage operations of Non-Distributed (SMP) LASR Servers with\
    \ two concepts: the SAS utilities for administering the environment, there are\
    \ other software products which might need to consider. Other tools that can be\
    \ useful for management of your solution:\n\n- SAS High-Performance Computing\
    \ Management Console\n  - Can be used at sites that prefer it\n  - Not related\
    \ to SAS Management Console\n  - Primarily for maintaining large numbers of user\
    \ accounts\n- Operating system utilities\n  - Linux: netstat, top, ps, mpstat,\
    \ and many more\n  - Windows: Task Manager, Perfmon, the System Event Viewer,\
    \ and so on\n- Hadoop utilities\n  - Deployment management: Cloudera Manager,\
    \ Ambari\n  - Hadoop web applications: DFS Health, YARN Manager\n  - Hadoop Command-line:\
    \ Hadoop, hdfs\n\nWhile we won’t discuss details of those other utilities in this\
    \ book, they are still important contributors to your administration toolbox in\
    \ support of SAS Visual Analytics solution deployment.\n\nFor SMP LASR, we can\
    \ use the SASNAME engine to do the following:\n\n- Start and stop the specified\
    \ LASR Analytic Server.\n- Load and unload tables from LASR memory.\n\nAnd use\
    \ PROC VASMP to do the following:\n\n- Stop (only!) the specified LASR Server.\n\
    - List the tables currently available in-memory for SMP LASR Server.\n- Provide\
    \ administrative information and control over the SMP LASR Server. only. It gives\
    \ us the speed of in-memory processing without the additional gains by breaking\
    \ the task into smaller chunks and distributing those to multiple workers for\
    \ parallel processing. The SAS Visual Analytics web application can provide useful\
    \ insights into what resources LASR is working with.\n\nFigure 9.10 Monitoring\
    \ the memory that is used in LASR Servers\n\nIn the screen capture above, SAS\
    \ Visual Analytics provides us with a quick glance at our environment with the\
    \ following:\n\n- defined LASR Servers\n- The host each is running on (either\
    \ SMP or LASR Root Node for MPP)\n- Their current execution state\n- RAM consumed\
    \ by each (only instances of MPP that are currently active)\n\n### LASR Server\
    \ status\n\nLet’s take a closer look at the server status:\n\nFigure 9.11 The\
    \ execution state of each LASR Server\n\nThere are three status modes that can\
    \ describe the current execution state of LASR Server:\n\n| Status | Icon | Description\
    \ |\n| :--- | :--- | :--- |\n| Green Circle | The LASR Server is running and online.\
    \ |\n| Red Square | The LASR Server is not running. |\n| Yellow Triangle | The\
    \ LASR Server is running and online, but the amount of data that it has in memory\
    \ exceeds the tables limit defined for it (default is 80%) |\n\nFirst, in order\
    \ for SAS Visual Analytics to show a LASR Server in the list, that LASR Server\
    \ must first be defined in metadata. So regardless of the status shown, the list\
    \ itself is an indicator that the LASR Servers have been defined in metadata such\
    \ that SAS Visual Analytics is aware of them. These status icons only show whether\
    \ the server is running. A green circle does not necessarily mean that any data\
    \ has been loaded into the LASR Server yet. You’ll need to check the **LASR Tables**\
    \ tab to get that information. The yellow triangle is a helpful indicator in reference\
    \ to the LASR limit value. When the data loaded into memory meets or exceeds that\
    \ value, the LASR Server will not allow more data to be loaded. You’re probably\
    \ wondering how that value could be exceeded. It’s because that value is ascertained\
    \ only *after* a table has been loaded into RAM. A good example is if the limit\
    \ is set at 80% of total system RAM and your tables in LASR currently consume\
    \ 79%, then the next table load – regardless of its size! – will be allowed to\
    \ proceed.\n\n### LASR memory usage\n\nThe LASR Servers tab of SAS Visual Analytics\
    \ Administrator shows the RAM consumed in support of hosting LASR tables in memory.\n\
    \nFigure 9.12 SAS Visual Analytics Administrator reports on LASR memory usage\n\
    \nSAS Visual Analytics Administrator reports on memory differently for LASR running\
    \ in distributed (MPP) mode than it does for non-distributed (SMP) LASR.\n\nThe\
    \ columns shown here display the following:\n\n- Virtual Memory – MPP LASR only\
    \ – a percentage of the amount of RAM consumed by the Distributed LASR processes\
    \ across the entire cluster.\n- Tables Memory (MB) - the amount of RAM consumed\
    \ by data in LASR tables which currently reside in memory\n- Tables Limit (MB)\
    \ – an optional, pre-defined limit on the amount of RAM beyond which no additional\
    \ tables can be loaded into that LASR Server\n\nThe green bar in the upper right\
    \ corner is a gauge of showing a percentage of the amount of total RAM utilization\
    \ of all LASR hosts in aggregation in a distributed (MPP) environment. It does\
    \ not appear for SMP-only deployments of LASR. If you position the mouse pointer\
    \ over that gauge, a tooltip will appear with more information.\n\nFigure 9.13\
    \ RAM utilization gauge for the LASR cluster with details in the tooltip.\n\n\
    Altogether, this item is explaining several things to us:\n\n- 13% of all RAM\
    \ is currently use in the cluster. This counts not just LASR usage, but also the\
    \ operating system and any other third-party RAM utilization as well.\n- The tooltip\
    \ shows 7.9GB of RAM currently used by the LASR Server(s) of a total 62.3GB available\
    \ across all hosts.\n\n### Resource Monitoring\n\nSAS Visual Analytics Administrator\
    \ also offers an interactive and dynamic client that shows activity updates known\
    \ as the Resource Monitor. The Resource Monitor provides graphical displays of\
    \ data to provide information about current utilization of system resources.\n\
    \nFigure 9.14 The Resource Monitor in SAS Visual Analytics tracking CPU, RAM,\
    \ and I/O across all nodes of the cluster\n\nFrom top to bottom, the Resource\
    \ Monitor shows:\n\n- Utilization History – color-coded lines in a histogram tracking\
    \ utilization of CPU, RAM, inbound network/O, and outbound network/O.\n- Real-Time\
    \ View – collection of three heat maps that display the current state of the following:\n\
    \  - Utilization of each core on all hosts – notice the green-shaded rectangles\
    \ above, representing 8 cores for our 4-machine LASR cluster\n  - Total RAM utilization\
    \ on each host – look for the light-blue shaded set of rectangles, each for the\
    \ 4 machines of our LASR cluster\n  - Network/O on each host – the red-shaded\
    \ set of rectangles where inbound traffic per host is shown on top and outbound\
    \ traffic is shown on the bottom.\n\nFor the Real-Time View, notice that the color-coding\
    \ of these heat maps is increasingly darker as the utilization increases. If the\
    \ value of a particular metric exceeds the expected norm, Resource Monitor will\
    \ choose a bright color to draw attention to it. For example, the outbound network/O\
    \ on the fourth host of our LASR cluster is shown as a purple rectangle and we\
    \ can see from the legend that it represents a value beyond the range at which\
    \ interfaces are operating on the other hosts. The data shown in Resource Monitor\
    \ is live or collected moments ago the Resource Monitor was online. These charts\
    \ are reinitialized with each invocation. So for historical views of past usage,\
    \ the SAS Environment Manager is a better tool to use.\n\n### Usage Reports\n\n\
    SAS Visual Analytics offers an automated collection of reports that can help with\
    \ the administration by reporting on the actual usage of reports, data sources,\
    \ and LASR.\n\nFigure 9.15 SAS Visual Analytics provides usage reports\n\nIn particular,\
    \ the Administrative Overview report is interesting. It generates a SAS Visual\
    \ Analytics report with multiple tabs that show usage statistics by report, by\
    \ user, by data source and much more.\n\nFigure 9.16 The LASR Server tab in the\
    \ Administrative Overview usage report\n\nUnderstanding how your SAS Visual Analytics\
    \ solution is being used is important to ensure that the correct resources are\
    \ available. And this understanding can provide justification to continue using\
    \ those resource as well as acquiring more if needed.\n\nTo make full use of all\
    \ of the SAS Visual Analytics Administrator Usage Reports, you will want to enable\
    \ the SAS Environment Extended Monitoring functionality – often referred to as\
    \ the EMI Framework. When activated the EMI Framework will create and maintain\
    \ a data mart of usage statistics gathered by the SAS Environment Manager. That\
    \ data mart then supports extensive reporting on how the solution deployment is\
    \ used. SAS provides much more information about deploying and using SAS Environment\
    \ Extended Monitoring and the EMI Framework in *SAS Environment Manager: User's\
    \ Guide* available on http://support.sas.com.\n\n## REFERENCES\n\nSo far we’ve\
    \ just given you a taste of the flexibility and power available when administering\
    \ the LASR Analytic Server in support of SAS Visual Analytics. You are likely\
    \ to be eager to learn more. SAS provides a lot of documentation to help you out.\
    \ So polish up your administration skills by referring to the following SAS documentation\
    \ online at support.sas.com:\n\n- SAS Institute Inc. 2016. *SAS Visual Analytics\
    \ 7.3: Administration Guide*. Cary, NC: SAS Institute Inc.\n- SAS Institute Inc.\
    \ 2016. *SAS LASR™ Analytic Server 2.7: Reference Guide*. Cary, NC: SAS Institute\
    \ Inc.\n- SAS Institute Inc. 2016. *SAS Environment Manager 2.5: User’s Guide,\
    \ 3rd edition*. Cary, NC: SAS Institute Inc.\n- SAS Institute Inc. 2016. *SAS\
    \ 9.4 Intelligence Platform: System Administration Guide, 4 edition*. Cary, NC:\
    \ SAS Institute Inc.\n- SAS Institute Inc. 2016. *SAS 9.4 Intelligence Platform:\
    \ Security Administration Guide, 3rd edition*. Cary, NC: SAS Institute Inc.\n"
  mdcn: "\n\n## 第九章\n## LASR 管理\n\nLASR 分析服务器（LASR Analytic Server）对于 SAS Visual Analytics\
    \ 的运行至关重要。因此，熟悉维护 LASR 分析服务器所需的管理任务非常重要。这是因为 LASR 分析服务器极其强大且灵活，在管理它时有许多考虑因素。\n\
    \n在大多数情况下，SAS Visual Analytics 只是一个大型解决方案的一部分。其他 SAS 产品以及第三方软件在环境的日常运行中也可能起着重要作用。这些每项工具都带来了它们各自的管理任务和实用程序。\n\
    \n本章将重点介绍 LASR 分析服务器的许多管理工具和任务。要涵盖的内容很多——让我们开始吧！\n\n## 管理概述\n\n负责 SAS Visual Analytics\
    \ 管理的人员需要涵盖大量工作。她必须管理用户和资源；维护安全和系统完整性；然后监控操作并审计活动。\n\n专门针对 LASR 分析服务器，管理员将处理以下内容：\n\
    \n- 启动和停止 LASR 分析服务器\n- 将表加载到 LASR 分析服务器并从 LASR 分析服务器中删除表\n- 定义数据库和访问控制\n- 监控资源利用率\n\
    \n## 管理工具\n\nSAS 提供了几种工具用于管理 SAS Visual Analytics 环境。根据当前处理的任务，SAS Visual Analytics\
    \ 管理员需要访问正确的工具，并完成实现目标所需的全部操作。\n\n### SAS 管理控制台\n\nSAS 管理控制台是一个基于 Java 的应用程序，用于管理关键的\
    \ SAS 企业级业务智能环境组件——包括 SAS Visual Analytics 使用的许多项目。SAS 管理控制台有效地充当了 SAS 元数据服务器的点击式图形用户界面。因此，每当描述\
    \ SAS Visual Analytics 环境的元数据出现时，我们需要熟悉如何使用 SAS 管理控制台进行管理。\n\n图 9.1 以无限制用户登录 SAS\
    \ 管理控制台，对所有项目具有完全控制权\n\n使用 SAS 管理控制台在元数据中定义并管理 LASR 分析服务器、LASR 和 LASR 表。LASR 中数据的安全访问控制也通过\
    \ SAS 管理控制台进行维护。\n\n### SAS Visual Analytics Administrator\n\nSAS Visual Analytics\
    \ Administrator 是一个通过 Web 浏览器访问的 Web 应用程序。使用已 SAS 元数据服务器授予 Visual Analytics 管理员角色权限的凭据登录。\n\
    \n图 9.2 使用 VA Administrator 监控系统资源使用\n\n通过 SAS Visual Analytics Administrator，管理员可以执行这些针对\
    \ LASR 的特定任务：\n\n- 启动和停止 LASR 分析服务器。\n- 加载和卸载 LASR 表。\n- 检查 LASR 分析服务器的状态（运行或否）和\
    \ LASR 表的状态（已加载或否）。\n- 对 LASR 中的表应用行级安全。\n- 实时监控系统资源利用率（CPU、RAM、I/O）。\n\nSAS Visual\
    \ Analytics Administrator 提供环境的“实时”监控。它没有显示任何历史信息的能力——只显示当前发生的情况。\n\n### SAS Environment\
    \ Manager\n\nSAS Environment Manager 最初在 SAS 9.4 中引入。它基于来自 VMware Hyperic 的开源技术，提供模块化、可扩展的管理和监控框架。SAS\
    \ Environment Manager 由多个离散的组件构建，共同提供单一服务，包括环境中管理的每个主机上的代理，以及一个汇总所有代理数据、存储数据并提供基于\
    \ Web 界面的服务器。使用在元数据中被授予适当级别管理角色权限的凭据登录 SAS Environment Manager。\n\n图 9.3 SAS Environment\
    \ Manager 中显示的仪表板，用于监控为环境采集的指标\n\nSAS Environment Manager 可用于对环境进行“实时”监控。更重要的是，它不断捕获、跟踪和记录系统活动，以便你也能访问历史信息。因为无论你是否在查看，SAS\
    \ Environment Manager 实际上都在监控环境，所以它也可以在遇到关键状况时通过电子邮件、短信等提供告警通知你。\n\n使用 SAS Environment\
    \ Manager 执行以下操作：\n\n- 监控所有系统服务和资源（包括与 LASR 分析服务器相关的项目）\n- 根据你选择的条件设置告警\n- 查看并报告当前和历史性能\n\
    - 为大多数 SAS 应用执行管理操作\n\n### SAS 程序代码\n\n通过从 SAS 访问的程序化接口，SAS Visual Analytics 管理员可以创建新的交互式或批处理程序，这些程序最终可用于管理数据生命周期中的任何方面，以支持\
    \ LASR 中的内存表。SAS 编程专家可以编写代码来启动和停止 LASR 分析服务器，从任何源加载数据到 LASR 及其他，甚至可以以编程方式创建和修改存储在\
    \ SAS 元数据服务器中的对象。\n\n图 9.4 使用 SAS Studio 提交程序代码与 LASR 工作\n\n可视化管理工具既方便又强大。拥有图形界面有助于任务工作看起来更加逻辑化和直观。然而，站点操作需要某种程度的脚本、编程和调度，以确保表更新自动发生。因此，创建和维护自己的程序代码将是一项实用的技能。\n\
    \n### 其他工具\n\nSAS Visual 解决方案的部署依赖此处所示工具，但也依赖许多其他工具。虽然我们一直关注管理环境的 SAS 实用程序，但还有可能需要考虑的其他软件产品。对管理\
    \ SAS 环境有用的其他工具：\n\n- SAS 高性能计算管理控制台\n  - 可用于偏好使用它的站点\n  - 与 SAS 管理控制台无关\n  -\
    \ 主要用于维护大量用户账户\n- 操作系统实用程序\n  - Linux: netstat, top, ps, mpstat 等更多\n  - Windows:\
    \ 任务管理器、Perfmon、系统事件查看器等\n- Hadoop 实用程序\n  - 部署管理：Cloudera Manager, Ambari\n \
    \ - Hadoop Web 应用：Health, Yarn Manager\n  - Hadoop 命令行：Hadoop, hdfs\n\n虽然我们不会讨论这些其他工具的细节，但它们仍然支持\
    \ SAS Visual 解决方案工具箱的一部分\n\n## 有趣的 LASR 管理任务\n\nLASR 服务器的管理是一个巨大的课题，特别是当它接入更大的\
    \ SAS 生态系统时。我们希望通过向你介绍一些在管理 SAS Visual 解决方案时可能会遇到的有趣任务来开始。\n\n### SAS 元数据的角色\n\
    \nSAS Visual Analytics 完全依赖元数据中定义的 LASR 服务器和 LASR 表。如果你是一个 SAS 程序员，可以轻松编写自己的代码来启动新的\
    \ LASR 服务器、向其加载数据、运行操作并获取结果。元数据还定义了访问控制，供用户查看、交互和可能的管理。通常情况下，元数据中的对象描述的是已经存在（或即将存在）的东西。如果你在真实世界中移动或删除一个项目，元数据不会自动反映该变化。SAS\
    \ 企业级智能软件将协调其对元数据的使用与物理项目的使用保持一致。但是，如果你手动（或通过编程方式）创建了自己的元数据对象，那么你将负责对这些对象进行持续维护，以确保它们反映真实世界项目的正确状态。\n\
    \n### 定义 LASR 服务器\n\nSAS Visual Analytics 完全依赖 LASR 服务器来提供报告和分析数据。LASR 服务器起初是为了处理最大的数据量而构建的，但也可以处理较小的表。SAS\
    \ Visual Analytics 至少需要一个内存数据的 LASR 服务器向用户提供报告。但如果情况允许，你可以定义多个 LASR 服务器，它们可以共存在相同的机器上，也可以部署到自己的主机组。\n\
    \n默认情况下，在部署 SAS Visual Analytics 软件期间会创建两个 LASR 服务器：\n\n- 端口 10010  LASR 服务器\n\
    - 端口 10031 公共 LASR 服务器\n\n### SAS Visual Analytics 需要 LASR\n\nSAS Visual Analytics\
    \ 完全依赖 LASR 服务器提供报告和分析数据。根据你站点的需求，可能创建额外 LASR 服务器的原因有：\n\n- 资源使用分离——将用户指向单独主机上的不同\
    \ LASR 服务器\n- 安全——将用户指向不同的 LASR 服务器以保护数据访问\n- 开发、测试、生产——独立的环境以确保更新平滑\n- 资源可用性——如果你的原始主机已完全使用，则在新主机上部署另一个\
    \ LASR\n\n首先，在你的环境中定义新的 LASR 服务器假设所有主机上都存在必要的软件。在这些基础上，我们可以使用 SAS 控制台定义新的 LASR\
    \ 服务器：\n\n图 9.5 使用 SAS 管理控制台创建新的 LASR 服务器\n\n在 SAS 管理控制台中，使用具有适当管理权限的用户账户连接到 SAS\
    \ 元数据服务器。然后右键点击服务器项目并选择“新建服务器”。新建服务器向导将出现并提供服务器类型列表。选择 **SAS 服务器** -> **LASR 分析服务器**。点击“下一步”，并为你的新\
    \ LASR 服务器提供名称和可选描述。然后我们到了有趣的部分。\n\n图 9.6 创建新的 LASR 服务器的新建服务器向导\n\n在新建服务器向导的第三屏幕上，你可以选择定义“单机服务器”，这指的是非分布式（SMP）LASR\
    \ 服务器。默认答案是**否**，这将创建一个描述分布式（MPP）LASR 服务器的元数据对象。\n\n### LASR 运行在不同的架构上\n\n非分布式\
    \ LASR 服务器托管在单机上。但分布式 LASR 服务器运行在至少四台机器上——一个用于 LASR 根节点，至少三个工作节点。\n\n对于 MPP LASR\
    \ 服务器，你还必须提供两个问题的答案：\n\n- 高性能分析环境位置：HPAE 软件与 VA 的其他部分分开部署。它提供了在多个主机上启动 MPP LASR\
    \ 服务器的底层软件。此提示的值通常如 /opt/sas/TKGrid。但它可能因站点而异。请记住，如果你打算使用支持的远程数据提供程序的数据库内进程向 MPP\
    \ LASR 执行并行数据加载，则必须提供关联 TKGrid_REP 目录的路径。\n- 使用的机器数量：HPAE 安装在至少四台机器上，作为 MPP LASR\
    \ 服务器的最低要求，通常更多。你可以选择在所有机器上运行 LASR（默认值）或某些子集。你无法在元数据中指定使用哪些机器子集。如果少于全部，则 LASR\
    \ 将按照磁盘上 HPAE 配置中 tkgrid.hosts 文件列出的顺序在指定的机器数量上启动。\n\n在新 LASR 分析服务器的元数据中打开高级选项，你可以控制关键使用标准。\n\
    \n图 9.7 指定 LASR 分析服务器的内存限制\n\n粗暴使用 LASR 很容易耗尽你环境中的系统资源。RAM 是不仅对于 LASR 而且对于在相同主机上运行的任何软件都的关键资源。为了确保\
    \ LASR 运行良好，我们可以为以下选项指定值：\n\n- 数据加载（%）——如果 LASR 服务器当前占用 RAM 的 80%，则新表无法加载。\n-\
    \ 外部进程（%）——如果超过此值，则位于 LASR 外部的进程无法检索数据或运行操作。\n\n新的 LASR 服务器也可以供 SAS Visual Analytics\
    \ 使用。与 SAS 管理控制台一样，你需要使用具有适当管理权限的用户帐户登录 Environment Manager，并在页面左上角的侧边栏中进入管理部分。进入后，你可以打开新建服务器向导并输入\
    \ LASR 所需的信息：\n\n图 9.8 使用 SAS Environment Manager 创建新的 LASR 服务器\n\n作为管理员，主动管理\
    \ LASR 服务器的内存使用有助于维护运行环境。一旦定义了新的 LASR 服务器，SAS Visual Analytics 可能会与之工作。有一些需要注意的事，元数据并未直接处理：\n\
    \n- 想要管理 LASR 服务（启动、停止和加载数据）的 SAS Visual Analytics 用户必须拥有操作系统账户（使用令牌验证）来启动 Workspace\
    \ Server。\n- 对于 MPP LASR，启动 Workspace Server 的操作系统账户也必须存在于所有主机上并配置无密码 SSH。\n-\
    \ 只需要访问已加载到 LASR 数据的 SAS Visual Analytics 用户不需要操作系统账户。\n\nSAS Visual Analytics、LASR\
    \ 服务器以及其他解决方案经常必须相同硬件上共存第三方软件。例如，将 Hadoop 环境与 LASR 并列以处理 HDFS 表是一种常见做法。如果使用了 Hadoop\
    \ 服务——特别是 Spark 和 Impala 等内存密集型软件——那么妥当规划和执行 LASR 将确保该工具运行良好。\n\n### 管理 LASR 的要求\n\
    \n希望加载或卸载数据的 SAS Visual Analytics 用户必须拥有足够的操作系统账户来启动 Workspace Server，并对每个主机配置无密码\
    \ SSH。\n\n### 定义新的 LASR 库\n\n如果 LASR 服务器内存中没有加载任何数据，它就没什么用。为了让 SAS Visual Analytics\
    \ 工作，我们需要在元数据中定义库引用，以便 SAS Visual Analytics 知道连接到哪个 LASR 服务器。此外，SAS 元数据维护 LASR\
    \ 定义、库引用和表的访问控制，以确保用户只能看到环境中的内容。SAS 库引用（librefs）用于连接给定源。创建新 LASR 库的原因与创建 LASR\
    \ 服务器非常相似：\n\n- 安全——根据每个库引用限制内存数据的访问\n- 数据组织——源自位置的数据需要自己的库引用\n\n### 使用代码管理 LASR\
    \ 服务器\n\n除了使用 SAS Visual Analytics Administrator 等点击式界面来管理 LASR 操作外，你还可以编写 SAS\
    \ 程序代码，这便于自动化脚本。例如，通过一组设计良好的程序，你可以同时启动多个 LASR 服务器并从不同的源加载数据。一如既往，SAS 提供了多种程序化技术来管理你的\
    \ LASR 服务器及其关联数据。\n\n### 分布式模式 LASR\n\n对于在分布式模式（MPP）下运行的 LASR 服务器，我们可以使用 LASR\
    \ 过程。PROC LASR 提供以下主要功能：\n\n- 启动并停止指定的 LASR 服务器。\n- 从 LASR 内存加载和卸载表。\n- 将 LASR\
    \ 的内存表保存到磁盘。\n\n例如，可以使用以下代码启动 MPP LASR 服务器：\n\n```sas\nproc lasr create port=10011\n\
    path=\"/opt/sas/config/Level1/Applications/SASVisualAnalytics/LASR/Signatures\"\
    \nsigner=\"webserver.site.com:7980/SASLASAuthorization\"\nperformance host=\"\
    lasrroot.site.com\"\ninstall=\"/opt/sas/TKGrid\"\nnodes=all;\nrun;\n```\n\n**注意**\n\
    \n- 第三行的格式是为了在本页上易于阅读——确保你的实际 **path** 没有空格。\n- **create** 参数将引导 SAS 启动具有指定属性的\
    \ LASR 服务器。\n- 确保你指定的 **port** 值（不必是 10011）是可用的。否则，如果另一个服务（LASR 或其他）在该端口监听，该 LASR\
    \ 服务器将无法启动。\n- **signer** 功能通过 SASLASAuthorization Web 应用程序提供的 HTTP RESTful 接口访问。该应用程序通常（但并非总是）与分布式\
    \ LASR 服务器根节点是不同的主机。\n- **install** 参数指定 SAS 高性能分析软件（TKGrid）的物理路径。如果你预计从远程数据提供程序的\
    \ SAS 嵌入进程执行并行数据加载，则此路径应指向关联的 **TKGrid_REP** 目录。停止 MPP LASR 服务器更为简单：\n\n```sas\n\
    proc lasr stop port=10011\nperformance host=\"lasrroot.site.com\"\nrun;\n```\n\
    \n**注意**\n\n- **port** 属性与 **host** 结合提供了停止预定 LASR 服务器的关键标准。\n- **stop** 参数引导\
    \ LASR 服务器不接受新客户端连接，允许当前操作完成，然后终止服务器进程。\n如果该 LASR 服务器已经在元数据中定义（具有端口号、signer 和安装位置等属性），那么在\
    \ SAS Visual Analytics 或 SAS Environment Manager 中的状态将反映成功执行的结果——你可以进一步控制 LASR\
    \ 服务器。\n\n### 非分布式模式 LASR\n\n通过程序化管理非分布式（SMP）LASR 服务器涉及两个概念：用于管理环境的 SAS 实用程序以及需要考虑的其他软件产品。\n\
    \n- SAS 高性能计算管理控制台\n  - 可用于偏好使用它的站点\n  - 与 SAS 管理控制台无关\n  - 主要用于维护大量用户账户\n- 操作系统实用程序\n\
    \  - Linux: netstat, top, ps, mpstat 等更多\n  - Windows: 任务管理器、Perfmon、系统事件查看器等\n\
    - Hadoop 实用程序\n  - 部署管理：Cloudera Manager, Ambari\n  - Hadoop Web 应用：Health, Yarn\
    \ Manager\n  - Hadoop 命令行：Hadoop, hdfs\n\n虽然我们不会讨论这些其他工具的细节，但它们仍然是支持 SAS Visual\
    \ 解决方案工具箱的一部分。对于 SMP LASR，我们可以使用 SASNAME 引擎执行以下操作：\n\n- 启动并停止指定的 LASR 服务器。\n-\
    \ 从 LASR 内存加载和卸载表。\n\n使用 PROC VASMP 执行以下操作：\n\n- 停止指定的 LASR 服务器。\n- 列出内存中当前可用表。\n\
    - 提供对 SMP LASR 服务器的管理信息和控制。它通过将任务分成更小的块并分配到多个工作节点来获得内存处理的速度。SAS Visual Analytics\
    \ Web 应用程序提供有关 LASR 正在使用的资源的有用见解。\n\n图 9.10 监控 LASR 服务器使用的内存\n\n在上面的屏幕截图中，SAS\
    \ Visual Analytics 为我们提供了环境的概览：\n\n- 定义的 LASR 服务器\n- 每个运行的主机（无论是 SMP 还是 MPP 根节点）\n\
    - 它们的当前执行状态\n- 每个（当前活跃 MPP 实例）消耗的 RAM\n\n### LASR 服务器状态\n\n让我们仔细查看服务器状态：\n\n图\
    \ 9.11 每个 LASR 服务器的执行状态\n\n有三种状态模式描述 LASR 服务器的执行状态：\n\n| 状态 | 图标 | 描述 |\n| :---\
    \ | :--- | :--- |\n| 绿色圆形 | LASR 服务器运行且在线。 |\n| 红色方形 | LASR 服务器未运行。 |\n| 黄色三角形\
    \ | LASR 服务器运行且在线，但内存中的数据量超过了为其定义的限制（默认为 80%）。 |\n\n首先，为了让 SAS Visual Analytics\
    \ 在列表中显示 LASR 服务器，该 LASR 服务器必须先在元数据中定义。因此，无论显示的状态如何，列表本身表明 LASR 服务器已经在元数据中定义，以便\
    \ SAS Visual Analytics 知晓它们。这些状态图标仅显示服务器是否正在运行。绿色圆形并不意味着已向 LASR 服务器加载了任何数据。你需要检查\
    \ **LASR 表** 标签来获取该信息。黄色三角形是参考 LASR 限制值的指示。当加载到内存的数据达到或超过该值时，LASR 服务器将不允许加载更多数据。你可能疑惑该值如何被超过。这是因为该值是在表加载到\
    \ RAM *之后* 才确定的。一个很好的例子是，如果限制设置为系统 RAM 的 80%，而你的 LASR 表当前占用了 79%，那么下一次表加载（无论大小！）将被允许进行。\n\
    \n### LASR 内存使用\n\nSAS Visual Analytics Administrator 中的 LASR 服务器标签显示了支持内存中托管\
    \ LASR 表所需的 RAM。\n\n图 9.12 SAS Visual Analytics 内存使用报告\n\nSAS Visual Analytics\
    \ Administrator 对分布式（MPP）模式运行的 LASR 的内存报告与非分布式（SMP）LASR 不同。\n\n此处显示的列显示以下内容：\n\
    \n- 虚拟内存 – 仅限 MPP LASR – 整个集群分布式 LASR 进程消耗的 RAM 百比。\n- 表内存 (MB) – 当前位于内存中的 LASR\
    \ 表数据消耗的 RAM。\n- 表限制 (MB) – 对该 LASR 服务器的可预定义 RAM 限制，超过此限制将无法向其加载额外的表。\n\n右上角的绿色条是显示分布式（MPP）环境中所有\
    \ LASR 主机总 RAM 利用率百分比的仪表。它不会出现在仅 SMP LASR 的部署中。如果你将鼠标指针悬停在该仪表上，会出现一个带有更多信息的提示框。\n\
    \n图 9.13 LASR 集群的 RAM 利用率仪表，提示框中有详细信息。\n\n总而言，此项向我们解释了以下几点：\n\n- 集群当前使用了 13% 的所有\
    \ RAM。这不仅计算 LASR 的使用，还包括操作系统和任何第三方 RAM 利用率。\n- 提示框告诉我们 SAS Visual Analytics 应用程序正在使用哪些资源。\n\
    \n### 报告\n\nSAS Environment Manager 是在 SAS 9.4 中引入的。它 提供了关于其运行状态的报告。\n\n### 使用报告\n\
    \nSAS Visual Analytics 提供了关于报告、数据源和 LASR 的自动收集。\n\n图 9.15 SAS Visual Analytics\
    \ 提供报告\n\n特别是，概览报告很有趣。它生成按报告、用户、数据源分类的 SAS 统计数据。\n\n图 9.16 概览报告中的 LASR 服务器\n\n\
    了解你的 SAS Visual 解决方案是如何被使用的，对于确保正确的资源是重要的。而且这种理解可以继续使用这些资源提供依据，并在需要时获取更多。为了充分利用所有的\
    \ SAS Visual Analytics 使用报告，你希望启用 SAS 环境扩展监控功能——通常被称为 EMI 框架。激活后，EMI 框架将创建并维护由\
    \ SAS Environment Manager 收集的统计数据库。该数据库随后支持对解决方案使用的的报告。有关部署和使用 SAS 环境扩展监控以及 EMI\
    \ 框架的更多信息，请参阅 *SAS Environment Manager: 用户指南*，http://support.sas.com。\n\n## 参考文献\n\
    \n"
