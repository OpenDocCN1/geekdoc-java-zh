    objects.


    Using gauges in a container


    There are five different gauges available in SAS Visual Analytics. Some of


    the gauges can be shown as horizontal or vertical, so it appears that there are


    more choices. A gauge requires a measurement and display rules. You can add


    a target if you want. Refer to the *Visualizing your data* chapter for more


    details about gauges and display rules.


    Display rules use color to show the user the ranges for each measurement. For


    these gauges, the display rules are set to indicate different values. All gauges


    use a traffic light (red/yellow/green) method to indicate good or bad. The


    lower measurements are red and the over goal measures are green. The


    following figure shows the same gauge in different traffic light values.


    Figure 3.13 Dashboard gauges


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_63.png)


    SAS Visual Analytics does not limit the scale or the colors on the display


    rules.


    To add the gauges, do the following:


    1\. Drag the Gauge data object to Container 1.


    a. On the **Properties** tab, change the Name to KPI 1 and the Title to KPI 1:


    Achieve Regional Sales Target of 40%.


    b. On the **Roles** tab, add the Sales Rep % of Target as the Category. Change


    the aggregation to Average or Maximum.


    c. On the **Properties** tab, set the Width to 33\. This indicates the percentage


    this data object is allowed to use.


    d. On the **Properties** tab, set the Gauge Type to Speedometer.


    e. On the **Style** tab, set the Data Skin style to Modern.


    f. On the **Display Rules** tab, set the following values. Enter the values for


    green first and then work your way up.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_64.png)


    2\. Right-click the first gauge and select Duplicate KPI 1.


    a. In the **Properties** tab, change the Name to KPI 2 and the Title to KPI 2:


    Achieve Regional Profit Ratio of 60%.


    b. In the **Roles** tab, add the Profitability Ratio as the Category.


    c. In the **Display Rules** tab, set the following values:


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_65.png)


    3\. Right-click the second gauge and select Duplicate KPI 2.


    a. On the **Properties** tab, change the Name to KPI 3 and the Title to KPI 3:


    Achieve regional approval rating of 60%. Set the aggregation to Average.


    b. On the **Roles** tab, add the Sales Rep Rating as the Category.


    c. On the **Display Rules** tab, set the values the same as ones for KPI 2.


    Using parameters for targets


    The Sales vice president wanted each business region to have an individual


    target for KPI 3\. The target is a stretch goal based on the previous year’s sales


    goal. Since we want each one to be different, we need to add a parameter so


    the gauge knows to read the value from a calculated item.


    Understanding parameters


    Parameters allow the data objects to change based on user selection. When


    the user selects the region, the tool uses the target value for the gauge updates


    based on that selection. In the following figure, the user selected APAC which


    sets the target on dashboard gauge to 59%. The target is represented by the


    dot. If the user selects EMEA, the target is changed and the gauge updated.


    Figure 3.14 Using parameters for targets


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_66.png)


    Parameters can be used with filters, calculated items, and aggregated


    measures. The parameter value is set globally for the section. This means that


    when the user makes the selection, the filter only contains that value until


    another selection is made.


    Creating a parameter


    You need three items to set a target:


    • Parameter data item to contain the value of the Business Region filter. This


    value is populated when the user clicks a button on the button bar.


    • Calculated data item that contains the target value for each business region.


    You present these values when you create the calculated data item.


    • Gauge with the target value set.


    To add the parameter to the gauge:


    1\. Create the parameter:


    a. Select **Data**  ▶  **New Parameter**.


    b. In the **Name** field, type RegionalSelection.


    c. In the **Type** field, select Character.


    Your window should look similar to the following figure:


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_67.png)


    d. Click **OK** to create the new parameter.


    e. Select the Button Bar and add the new parameter to the **Parameter** field.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_68.png)


    2\. Create the Calculated Item. There are multiple ways to create this


    formula.


    a. Select **Data**  ▶  **New Calculated Item**.


    b. In the **Name** field, type _RegionalRatingsTarget.


    c. On the **Visual** tab, drag the IF … ELSE operator to the Work area. Then


    drag a second IF … ELSE operator into the **Else** field.


    d. Drag the = operator to each condition box.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_69.png)


    e. Drag the RegionalSelection parameter into the first condition field. Then


    type EMEA in the second box.


    f. In the **Return** field, type .69.


    g. Drag the RegionalSelection parameter into the first condition field. Then


    type APAC in the second box.


    h. In the **Return** field, type .59.


    i. In the **Else** field, type .62\. There are only 3 regions, so this value is
    for the


    Americas.


    Your formula should look like the following:


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_70.png)


    Some users find it easier to type formula on the **Text** tab as shown in the


    following figure. It might be easier to cut and paste or work with complex


    formulas using this method.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_71.png)


    3\. Click **OK** to create the data item.


    4\. In the Format area, change the aggregation method to Mean. The default


    aggregation is Sum, which causes the value to display as the aggregation for


    all rows. If you select mean or max, then you get a single value for the row.


    5\. Select the KPI 3 gauge. On the **Roles** tab, add the _RegionalRatingsTarget


    as the Target.


    A dot appears on the gauge and moves each time a different region is selected.


    The parameter causes the value to change when the user makes a different


    selection.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_72.png)


    Adding data objects to a container


    The dashboard has two data objects in Container 3\. These data objects


    provide more details than the gauges and help the user understand more about


    the data.


    *Using a targeted bar chart*


    A targeted bar chart enables the user to see how close or far a category was


    from a goal. For this dashboard, we want to show each sales rep with her


    actual sales against the target. The target is represented by the gray bar above


    each bar. The closer the bar is to the box, the closer the sales rep was to


    meeting the target value.


    All sales reps are expected to achieve 80% of their target. This chart includes


    a display rule, so the bar turns green when the target was achieved. Otherwise


    the bar remains red.


    Figure 3.15 Targeted bar chart show individual performance


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_73.png)


    To add a targeted bar chart:


    1\. Drag the Targeted Bar Chart to the Container 3 object.


    2\. On the **Properties** tab, change the Title to Sales Reps Actual to Target
    (in


    Currency). Change the font to bold.


    3\. On the **Roles** tab, set the following:


    a. In the **Category** field, add Sales Rep.


    b. In the **Measure** field, add Sales Rep Actual.


    c. In the **Target** field, add Sales Rep % of Target.


    4\. On the **Display Rules** tab, select **New**. An Add Display Rule window


    appears.


    a. Select the **Expression Details** tab.


    b. In the Column field, select **Sales Rep % of Target**.


    c. Type .8 in the **Value** field.


    d. Change the Style color to green.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_74.png)


    5\. On the **Styles** tab, change the first data color from blue to red. This
    causes


    all bars to be red unless the Display Rule overrides the color and sets it to


    green.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_75.png)


    *Using a dual axis bar-line chart*


    A bar-line chart mixes a line and bar chart. The line chart uses the left and


    right axes for its values. For this dashboard, the bar represents each sales rep


    total sales. The line represents the profitability ratio. This is just additional


    information that shows high sales does not translate to a large profit.


    Managers might want to review the data to determine if heavy discounts have


    been given.


    Figure 3.16 Dual axis bar chart allows comparisons


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_76.png)


    To add a dual axis bar chart:


    1\. Drag the Dual Axis Bar-Line chart to the Container 3 object.


    2\. On the **Properties** tab, change the Title to Sales Reps Sales with


    Profitability Ratio. Change the font to bold.


    3\. On the **Roles** tab, set the following:


    a. In the **Category** field, add Sales Rep.


    b. In the **Measure** (bar) field, add Order Total.


    c. In the **Measure** (line) field, add Profitability Ratio.


    4\. On the **Styles** tab, change the color so it is easier to see the data:


    a. In the Fill area, change the first data color to light blue.


    b. In the Line/Marker area, change the second data color to black or dark


    blue. The line is on the second measure and uses the colors in the second box.


    Adding controls to a container


    The dashboard uses Controls to enable the Regional Managers to explore the


    data based on product line or sales rep. These controls are then made


    interactive with the data objects in container 3\. In the following figure, you


    can see the planned interactions for the controls and objects. The drop-down


    list and list controls interact with the Targeted Bar Chart. The Targeted Bar


    Chart passes the filtering to the Bar-Line chart. For more details about


    interactions, refer to the *Creating your first report* chapter.


    Figure 3.17 Establishing interactivity between objects


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_77.png)


    To add the controls and set up the interactions:


    1\. Add a Drop-Down List to Container 2.


    a. In the Roles tab, assign Product Line to Category. Remove the Frequency


    value.


    b. In the Properties tab, set Title to Product Line and the Height to 20.


    c. In the Interaction tab, set the control to filter the Targeted Bar Chart.


    2\. Add a List to Container 2 under the other control.


    a. In the Roles tab, assign Sales Rep to Category. Remove the Frequency


    value.


    b. In the Properties tab, set the Height to 75\. This allows some white space


    beneath the controls.


    c. In the Interaction tab, set the control to filter the Targeted Bar Chart.


    3\. Add an interaction to the Targeted Bar Chart.


    a. Select the Targeted Bar Chart.


    b. In the Interaction tab, set the Targeted Bar chart to filter the Bar-Line


    Chart.


    Adding a list table


    The Sales Rep Report uses a list table to contain some detailed approval


    ratings metrics. The table can be filtered by the Text Input control in the


    section filter area. A display rule is used to highlight the sales reps with low


    ratings. Refer to the *Visualizing your data* chapter for more details about


    working with list tables.


    Figure 3.18 Using display rules with a list table


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_78.png)


    To add a list table:


    1\. Drag the List table to the Work area.


    2\. On the **Properties** tab, change the Title to Sales Rep by Region and


    Month.


    3\. On the **Roles** tab, add the following data items to list table:


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_79.png)


    4\. On the **Style** tab, make the following changes to enhance readability:


    a. Click the **Wrap text** check box to allow the headings to go on 2 lines.


    b. Change the **Background color** on the Column headings to light blue.


    c. Change the **Font** to Bold.


    5\. Click the Sales Rep Rating column and select **Add Display Rules**. You


    want any average ratings below 40% to be highlighted with a different color


    background.


    a. Set the value to .4.


    b. Change the background color to red or orange. You can also change the


    text color or font.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_80.png)


    Linking to another section


    The Sales Rep Ratings section uses a table to contain some detailed approval


    ratings metrics. The managers can click the KPI 3 to get the regional details


    for each sales rep. This action is called linking. You can link to other sections


    or other reports. When a parent section links to a child section, the filtered


    values are passed to the data objects in that section. In this case, the list
    table


    is filtered based on the selections for Gauge 3.


    Figure 3.19 Linking objects to sections


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_81.png)


    Understanding section linking


    When an object is linked to another, a special symbol appears on the section.


    Click the icon to see which section has linked to the tab or click the Link icon


    to return to the section. In the following figure, notice that the list table
    is


    filtered for APAC. The link icon shows the list is filtered from the Regional


    Manager dashboard.


    Figure 3.20 Applying section filtering


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_82.png)


    You can investigate a single sales rep. In the following figure, you would type


    the sales rep user ID in the control field. This action filters the list table.
    To


    see more than a specific month, uncheck the Apply section link filters.


    Figure 3.21 Removing filtering


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_83.png)


    Applying section linking


    To set up the link from the dashboard gauge to list table:


    1\. Right-click Gauge 3 (KPI 3) and select **Add Link** ▶ **Section Link**.


    2\. In the Create Section Link window, select the section where you want to


    link.


    There may be multiple sections and you can link to more than one.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_84.png)


    OTHER DASHBOARD ENHANCEMENTS


    In this chapter, you created a pre-designed dashboard. This topic contains


    some additional ideas and methods for enhancing a dashboard.


    Adding text boxes


    In some cases, a dashboard might contain data or formulas that might confuse


    new users. You might want to provide commentary about the dashboard or a


    link to a helpful website. You can do this with a text object. The Sales Rep


    Report provides ratings, but it doesn’t explain how the data was collected or


    what the colors mean. Let’s add a text box that explains the ratings colors and


    provides a link to an example survey.


    Text boxes contain text or a link to an external location, an existing report
    or


    report section. You can control the appearance of each text item. You can also


    use the **Properties** tab to add a border or change the background color.


    To add a text object:


    1\. Drag a Text object to the work area.


    2\. In the text box, type your text. You can control the format of individual


    text items. In the example, the heading text is larger. The color names were


    highlighted in the figure below as an example of some changes you can make.


    3\. To add a hyperlink, highlight the text that you want to have the link, click


    the Link icon, and type your link in the box. In the example, a link was added


    to an example survey.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_85.png)


    Adding artwork


    You can add images to your dashboard, such as an icon or a logo. For this


    example, we are adding a link to the SAS training videos and using an image.


    Here’s an example of how the image would look after adding it to the Sales


    Rep Report.


    Figure 3.22 Using image and text objects in your report


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_86.png)


    There are three supported file types (JPG, PNG, and GIF). When you add the


    image, it is stored with your report. It can be re-used in other reports and


    dashboards.


    To add a new image:


    1\. Drag the Image object to the work area. An Image Selection window


    prompts you to use an existing image or load one from your local machine.


    2\. Click the **Load from local machine** option and click **Browse** to locate
    the


    image file.


    3\. Click the **Save image to the repository** to select where the image is


    stored.


    4\. Select the image scale if you need to control the final size. This setting
    is


    also available on the **Properties** menu.


    5\. Add any text in the Tooltip text. When the user hovers over the image,


    this text is displayed.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_87.png)


    6\. Click **OK** to return to the work area.


    7\. To add a link, right-click the image and select the **Add Link** choice. You


    can link to an external or internal location.


    Embedding a stored process


    From SAS Visual Analytics, you can embed a stored process in your report or


    link to a stored process from a data object. When embedding a stored process


    in your report, you can take advantage of existing stored processes or add


    other SAS-based reports.


    SAS Visual Analytics has a stored process object that enables you to place the


    stored process within the report. However, the stored process does not interact


    with the other elements of the report. For example, you cannot use the report


    or section filters on the stored process or use the prompt choices to interact


    with other objects.


    When embedding a stored process in SAS Visual Analytics, the data can be


    located on the SAS Visual Analytic server or from other locations. You can


    use the tables loaded in the SAS LASR Analytics Server, but it’s better that


    you avoid the practice. If you use data from the SAS LASR Analytic Server, it


    must be transferred from the in-memory location to a local SAS session. For


    smaller tables, the performance would hardly be noticed, but larger tables


    might take a long time to download and overwhelm the SAS session.


    SAS Visual Analytics ships with some sample stored processes. In this


    example, you will embed a sample stored process in the existing dashboard.


    1\. Create a new section in your report.


    2\. Drag the Stored Process object to the work area.


    3\. When prompted, navigate to the SAS Folders > Products > SAS


    Intelligence Platform > Sample folder and select the Sample: Multiple Output


    Formats stored process from its metadata location.


    The stored process runs and the results appear in the section.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_88.png)


    When the stored process has prompts, you can change the prompt values from


    the Properties pane. Click the **Edit prompts** button to select the different


    prompt values. The choices you select are saved with the stored process and


    become the default for all users. However, the user can change the values in


    the Report Viewer.


    **Extending stored processes**


    You can also link to a stored process from a data object. You can pass


    parameters to the stored process. This technique is often used when you want


    the user to download a larger data set for more analysis.


    SUMMARY


    This chapter was focused on helping you learn how to use the tool to create a


    dashboard for a fictional company. The design process presented was to


    demonstrate the overall process and how each step would work. Much of the


    process might have appeared as if the designer was working alone with some


    minimal management direction.


    If you build a dashboard and no one uses it, it can be frustrating or


    disappointing. The main reason this situation occurs is because the users do


    not find the dashboard useful. It might be because the dashboard contains


    measurements that no one uses. Or the data used within the dashboard is


    inaccurate. It’s also possible that the dashboard is too difficult to use. Many
    of


    these symptoms point to a designer who didn’t work with the end user.


    The only time you should build a dashboard alone is when you are prototyping


    an idea. Many managers do not realize the need for a dashboard until they can


    see a working model. You can then have a conversation with the managers


    about what is happening in their organizations that is creating so-called *pain*


    *points*. You want to know about the pain points because this is where the


    opportunity for change and process control presents itself.


    As you build the dashboard, you want to present layout ideas to the end users.


    This enables the team to become excited about what you are doing and guide


    you to help them get the best end result. Even after you finish the dashboard,


    it is a good idea to watch the users interact with it. You want to ensure that


    they are able to understand the information pathways and how to answer the


    questions they have.


    Keep in mind that creating a dashboard is a highly iterative process. While


    some dashboards may be needed for a short time period, most dashboards are


    used for several years within organizations. This doesn’t mean the content


    changes. Ensure that you have documented your process well enough for


    someone else to understand the design and intended use.


