    # # About this book


    SAS Visual Analytics is a data visualization and application that enables organizations
    to understand and analyze their most important asset: data! There is a wealth
    of information freely available to users on support.com, from simple blog posts
    to in-depth documentation. All of this can make it difficult for users to understand
    how to get the most from the application, or even


    Our purpose in this book is to provide a quick-start guide for new users who theyf
    through the applications to teach you the basics so that you can easily expand
    that knowledge with some intermediate and advanced techniques. We want to ensure
    users understand how to get the most from the application, for their organizations.


    # ## IS THIS BOOK FOR YOU?


    New users or those with some familiarity with SAS Visual Analytics will find this
    book useful. This provides a tutorial for new users. It also contains in-depth
    explanations of data visualizations and how to use them effectively.


    If you have the administrative privileges for deploying, configuring, and maintaining
    your SAS Visual Analytics environment, we''ve got you covered here as well. Our
    goal is to enhance your understanding of how the software works so that you can
    readily implement proven practices for efficient operation.


    # ## PREREQUISITES


    You do not need any previous experience with the Visual Analytics tools or SAS
    to use this book. If you are familiar with SAS coding techniques and SAS data
    handling, you might find some areas of the project easier to understand.


    # ## SCOPE OF THIS BOOK


    This book covers the following topics:


    +   - SAS Visual Analytics 7.3 (and later)

    - SAS Visual Analytics 8.1


    # ## ABOUT THE EXAMPLES


    # ### Software used to develop the book''s content


    Reports and explorations for this book were created using the following software:


    +   - SAS Visual Analytics 7.3 (and later)

    - SAS Visual Analytics 8.1

    - SAS Enterprise Guide 7.1 and SAS Studio were used for some data preparation
    in this book. Most of the data sets were taken from existing sample libraries
    and no preparation was required. These sources are identified at first.


    The primary references used to write this book were the sections of the online
    documentation for SAS Visual Analytics:


    +   - SAS Visual Analytics User Guide, 7.3

    - SAS Visual Analytics Administration Manual, 7.3


    # ### Example data and reports


    You can access an import package for the Building Your First Report and Building
    Your First Dashboard chapters in this book by linking to its author at http://support.sas.com/publishing/authors.
    Select the name of the author. Then, view the thumbnail of this book, and select
    Example Code and Data to display the SAS programs that are included in this book.

    sass@sas.com.


