    ## introduction


    At SAS Forum in 2012, SAS introduced an application that offered not only to quickly
    process data, but to make analytics accessible to business users. The revolution
    taking shape, and data becoming mainstream. From a small desk, the laptop was
    connected to servers in miles away. The graphical interface helped the application
    so easy to use that there was no need for anything. This was written during an
    interesting period for the evolution of SAS Analytics. By using our publishing
    contract, SAS Analytics would become part of the new normal. As users were creating
    content, sharing and adding some fine for the release.


    ## APPLICATION


    SAS Analytics provides a complete platform for analytics, enabling you to identify
    patterns and relationships in data that were initially visible. Every user of
    all skills can load data, search for patterns, and create robust reports effortlessly.
    This chapter provides an introduction and overview of the application.


    ## Understanding in-memory storage


    The key feature of SAS Analytics is the in-memory storage. In the in-memory application,
    the data loads from the file system in the server''s random memory (RAM). The
    data loaded queries, calculations, and analyses are also instant. The SAS Analytics
    Server represents how analytics are applied to large volumes of data. By using
    massively parallel processing architecture, the engine can distribute your data
    across multiple machines and process that at speed. This means that the SAS server
    delivers results at unattainable levels of performance.


    ## Understanding the application


    Many users are confused about how the application work together. The following
    figure shows each application and how data travels through each.


    Figure 1 Application 5643dc80f15942ecfff3ef8a56b5eb9_4_0.png


    Here''s a brief overview of each application and its purpose. Each of these applications
    is discussed in later chapters.


    - SAS Analytics Homepage (SAS Home/Hub)

    This is the entry point to today. You can access the content and other applications
    based on your assigned role.


    - Report Viewer/BI Viewer

    The application enables you to create content such as reports or stories. The
    BI Viewer views more stories to see the Report runs on your mobile device or tablet.


    - Data Builder

    This application enables you to load data from a source to the SAS Analytics Server
    or from social media. This application is used by data administrators and consumers.
    In the SAS Analytics 8.1 release, the Data Builder was focused on data warehousing.
    This changes non-technical users use a more intuitive way to load data and manage
    their data.


    - SAS Analytics Server

    The SAS Analytics Server provides the in-memory storage engine. The biggest change
    between the release of SAS Viya is the SAS Analytics Server to Cloud Analytics
    Server (CAS).


    - Visual Designer/Visual Explorer

    The Visual Designer enables you to create interactive dashboards and reports.
    The Data Builder enables you to explore data sets and create advanced analytics.
    The content can be shared with Visual Designer. Once saved, content is available
    to the Report Viewer. In the SAS Analytics 8.1 release, the Visual Designer and
    Visual Explorer were combined into one application. With the combined applications,
    users can create and share visualizations in the same application.


    - Administrator

    This application enables you to load and monitor the SAS Analytics Server. This
    application is used by administrators. In the SAS Analytics 8.1 release, the administrator
    was functionally merged with SAS Environment Manager. The Environment Manager
    was replaced with SAS 8.9. It allows you to master the SAS platforms. The SAS
    Analytics Administrator to SAS Environment Manager was built for longer-term plan
    to have a central location to administer the system.


    ## HOW TO USE THIS SAS


    This book is divided into four parts that focus on different areas of the application.


    - Part 1 Getting Started

    Learn the basics of SAS Analytics by creating a new report. You can learn how
    to quickly load data to create beautiful reports. Next, you can create a dashboard
    using any of the additional features.


    - Part 2 Customizing Your Data Analytics

    Once you understand the basics, you can learn more about the other data objects
    and working with advanced analytics.


    - Part 3 Administration and Data Loading

    The SAS Analytics Solution provides a remarkably powerful and diverse set of tools
    with you accomplishing feats of large-scale data analytics and integration. It''s
    important to understand how software tools function and integrate so that you
    can get the best and most efficient out of them.


    - Part 4 SAS Analytics Analytics 8.1

    This part of the book takes you to the new release of SAS Analytics, which is
    on SAS Viya. These chapters introduce you to the new environment and how to navigate
    and use the Visual Data Builder and SAS Analytics.

