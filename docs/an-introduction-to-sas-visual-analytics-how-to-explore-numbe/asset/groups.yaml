    \n### 饼图和圆环图\n\n饼图和圆环图显示部分与整体的关系。许多数据可视化专家不建议使用饼图，因为 Stephen Few 说“它们传递信息很糟糕”。如果你想使用这些图表，请确保理解如何正确操作。通常情况下，这些图表在文本或框中提供视觉缓解。从\
    \ 8.1 版本开始，SAS Visual Analytics 包含了圆环图。虽然本主题中没有显示圆环图，但相同的可视化规则适用。\n\n《数字》（Show\
