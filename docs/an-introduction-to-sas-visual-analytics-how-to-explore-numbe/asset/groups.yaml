    # performance considerations


    SQL Analysis Views are designed to speed up data analysis. However, as the dataset
    grows, the performance of these views can degrade. Working with large datasets
    in SQL Analysis Views requires care to maintain high performance.


    There are several factors that affect the performance of SQL Analysis Views. One
    of the most important is the number of rows in the underlying tables.


    If the underlying tables contain millions of rows, the SQL Analysis Views may
    become slow. In such cases, you should consider using other techniques to improve
    performance.


    ## ## Indexing


    Indexes on the underlying tables can significantly affect the performance of SQL
    Analysis Views. The more indexes there are, the faster the views can retrieve
    the required data.


    However, having too many indexes can slow down data modification operations, as
    each index must be updated whenever data is inserted or updated.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_17_0.png)


    *Figure 15: Impact of indexing on SQL Analysis Views query performance*


    ## ## Partitioning


    When working with very large tables, partitioning can significantly improve performance.
    Partitioning allows the database engine to scan only the relevant parts of the
    table for a given query.


    In SQL Analysis Views, partitioning can be used to divide large tables into smaller,
    more manageable chunks. This reduces the resources required to process a query.


    ## ## Memory Usage


    The amount of memory used by SQL Analysis Views can also affect their performance.
    If the query requires more memory than is available, it may swap to disk, which
    is much slower.


    To limit memory usage, you can optimize your queries to use less memory or increase
    the amount of available memory.


    ## ## Network Latency


    The network speed between the database server and the client also affects the
    performance of SQL Analysis Views. High latency can significantly increase the
    time it takes to retrieve results.


    To minimize the impact of network latency, you should use a high-speed connection
    between the server and the client.


    ## ## Data Volume


    The amount of data returned by a query also affects its performance. Large result
    sets take more time to transfer over the network.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_17_1.png)


    *Figure 16: Impact of data volume on SQL Analysis Views query performance*


    ## ## SQL Analysis Views performance limitations


    SQL Analysis Views are designed for data analysis, not for real-time transactional
    processing. They have several limitations that should be aware of.


    # part four


    # SAS Visual Analytics 8.1


    This part of the book takes you into the newest release of SAS Visual Analytics,
    which is on SAS Viya. These chapters introduce you to the new environment and
    show you how to navigate and use the Visual Data Builder and Visual Analytics
    applications.


    Find answers on the fly, or master something new. Subscribe today. See pricing
    options.


    - **Chapter 11** Introducing the SAS Viya Platform


    The chapter provides an overview of the SAS Viya environment and managing your
    environment with the SAS Environment Manager.


    - **Chapter 12** Wrangling Your Data


    This chapter takes you into an overview of the SAS Visual Data Builder that comes
    with SAS Visual Analytics on SAS Viya. You learn about the new interface, how
    to extract and load data into CAS, and how to use the new features to transform
    your data sets.


    - **Chapter 13** Visualizing and Exploring Your Data


    In this chapter, we take the dive into the reporting and analytics section of
    SAS Visual Analytics on SAS Viya. You learn how to import data into the tool along
    with how to build reports and get a deeper look into your data with the new interface.
    There are many new features that let you quickly get to actionable insight.


    # # SAS VIP Plan


    In 2016, the new SAS VIP Plan was introduced to provide a comprehensive approach
    to parallel SAS processing with the flexibility of infrastructure being realized,
    and now SAS VIP is designed to capitalize on the flexibility of elastic infrastructure.


    ## ## OVERVIEW OF THE SAS VIP PLAN


    The VIP Plan is made to handle various business needs, but it can be customized
    to fit:


    - **CAS-In Data Analytics**: The new VIP Plan allows users to move data from previous
    versions of SAS to the CAS layer using CAS-In Analytics. CAS is an in-memory architecture
    for high-speed data analytics.

    - **SAS-In CAS**: The VIP Plan allows users to run their SAS programs in CAS environment,
    which does not require them to rewrite their SAS programs. In many cases, there
    is no need to refactor, restructure or start up new workflows.

    - **Stable transition**: SAS offers many types of SAS services that provide a
    stable environment for users to run their code in the new CAS environment.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_19_0.png)


    *Figure 1.1 SAS VIP Plan*


    As is typical of SAS services offered, this is just one option of many that are
    available. However, there are many other services and features that can help users
    achieve their analytics goals.


    ## ## UNDERSTANDING THE CAS-IN ANALYTICS


    To fully understand how CAS-in service works, it''s important to understand how
    SAS moves data into the CAS environment.


    ### ### Introducing many parallel analytics


    The key idea of CAS-in analytics is to use MPP approach which moves data on-disk
    to in-memory for processing. This is used for the SAS High-Performance Analytics.
    The SAS-In CAS Plan allows users to run their SAS programs when they can perform
    large-scale analytics in parallel.


    SAS-In CAS Analytics only runs when data is already loaded in CAS. This is because
    the SAS-In CAS service needs access to data that is already in CAS memory.


    ### ### Adding de-serialized data


    The main purpose of SAS-in analytics is to move data from SAS-disk to CAS. The
    SAS-In service allows users to load data into CAS memory and then use it for analysis.


    ## ## SAS VIP AND SAS TO


    SAS VIP is an all-memory plan that provides the benefit of parallel processing.
    However, SAS TO is still useful for many use cases. In many cases, SAS TO is a
    better alternative to the memory-intensive SAS VIP Plan.


    ## ## MANAGING THE SAS ENVIRONMENT


    The SAS Environment Management allows users to manage SAS and CAS as together.
    Using the SAS Environment Management, users can manage the SAS environment and
    access the CAS environment simultaneously.


    ### ### Opening the application


    There are two ways to access the application, from SAS navigation page. SAS Environment
    Management allows users to access different features from the SAS menu (navigation)
    on the left page. When you open SAS Environment Management, you will see the interface
    as shown in the following figure.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_19_1.png)


    *Figure 1.2 SAS Environment Management*


    From the left pane as shown in the following figure, you can access the following
    applications:


    - **Users**: Allows to manage users and groups.

    - **Libraries**: Allows to manage CAS instances.

    - **Environment**: Allows to manage the environment settings.

    - **Resources**: Allows to manage system resources and configuration.

    - **Security**: Allows to manage security settings.


    ### ### Managing users and groups


    The Users page allows users to manage users and groups. A big improvement is that
    user and group settings are synchronized between the SAS and CAS environment.
    SAS Environment Management uses a configuration service using SAS Database to
    store these settings.


    You can create custom groups for the application. Custom groups that are not available
    in the SAS environment will be available in the CAS environment.


    ### ### Managing Libraries


    The Libraries page allows users to manage SAS libraries and CAS libraries. Each
    CAS can have multiple libraries in SAS. The following figure shows the libraries.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_19_2.png)


    Each of pages provides a different view of the libraries:


    | Libraries | The detailed view of the libraries loaded into the SAS system. |

    |---|---|

    | Libraries | SAS libraries and loaded data. |


    The Libraries page shows all the libraries loaded in SAS and CAS. Each library
    has a name, location, and the number of tables.


    ### ### Managing environment


    You can use the content tab to create directory structures for the directories.
    The SAS shows report and status tables in SAS Visual Details.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_19_3.png)


