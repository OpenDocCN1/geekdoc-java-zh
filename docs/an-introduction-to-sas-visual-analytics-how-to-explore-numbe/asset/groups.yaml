    ## 第六章：数据的去向


    传统的业务智能系统侧重于回答*谁*、*什么*和*何时*的问题，但组织通常也需要知道数据的*去向*。企业希望根据现有客户规划销售区域。学区希望了解学生的住地相对于学校的位置。公司想知道设备故障是否与特定位置有关。所有这些问题都与数据的*去向*有关。


    SAS Visual Analytics 使绘制地理空间数据变得简单，这可以为你的数据可视化和分析增加一个完全新的元素。在表格报告中，多个列可能代表客户、竞争对手和人口统计信息。表格报告可能无法显示任何有用的信息。但如果你能对数据进行地理编码并将其叠加在地图上，你就能很快看出优质客户在哪里，他们相对于竞争对手的位置，以及根据底层的人口统计提供最大市场潜力的区域。


    SAS Visual Analytics 的地理制图能力基于与两种地图技术的集成：OpenStreetMap 和 ESRI ArcGIS。除非另有说明，本章中的示例在
    SAS Visual Analytics 7.3 中使用 OpenStreetMap。在本中，你将学习如何创建地理数据项和地理空间对象。


    ### 有效使用地理空间数据


    SAS Visual Analytics 让绘制地理空间数据变得毫不费力。这令人兴奋！仅仅使用地理空间对象来处理一切是非常容易的。但在采取行动之前，请考虑你是否真的有一个基于位置的数据故事。你希望审慎地使用地理对象。在这个主题中，我们将讨论位置分析的一种无效用法和一种有效用法。


    #### 当位置不是数据故事的一部分时


    Dona Wong 在她的书《华街日报信息图形指南》（*The Wall Street Guide to Information Graphics*）中建议，有时地理并不是故事的一部分，因此强制将其成为一部分是没有意义的。在她的示例中，她展示了两个销售区域，其中一个的销售额更高。在下面的图中，使用澳大利亚州重新创建了示例。


    图 6.1 位置不是此数据故事的一部分


    由于各个区域的大小非常不比例，比较销售收入没有帮助。除了西澳产生的收入比维多利亚州多之外，它没有得出任何结论。你的观众没有获得任何有用的启示，因为这个结论是意料之中的。对于一个重点确实是销售额的数据故事来说，这似乎并不相关。


    只有两个值需要显示，列表表格甚至饼图会是更好的数据可视化选择吗？这个示例的重点在于，即使你可以展示一个酷炫的地理对象，也应该问问自己它对你的数据故事是否有意义。


    #### 当位置就是数据故事时


    欧洲是一个国际业务中心和领先的目的地。如果你想讲述一个关于某个位置有多受欢迎的数据故事，可以从探索机场流量开始。Anna Aero 网站（http://www.annaero）包含了详细列出全球大部分机场趋势的数据。你可以使用机场代码和乘客人数开始一个关于最受欢迎和最不受欢迎城市的数据故事。


    在下面的图中，显示了每个机场的位置以及乘客人数和与去年相比的差异。在这个示例中，位置增强了故事。不需要复杂的计算，观众只需要用眼睛寻找模式即可。


    图 6.2 位置在这个故事中很重要


    多项观察结果。你可能会注意到显示乘客人数增加的深色圆。也许你会注意到在很小的半径内机场，并好奇为什么其中一个的乘客人数更高。有效使用时，地理空间数据可以揭示此前未知的模式或协助证实怀疑。


    ### 为地理可视化准备数据


    在创建地理空间可视化之前，你必须有一个地理项。如果一个数据项包含位置（例如国家或州），那么它被认为是地理项。常见的位置示例是地址、商店位置或销售区域。你可以使用
    SAS 预定义的地理元素或创建自定义数据项。本主题描述了如何创建每种类型。


    #### 创建预定义的地理项


    为了方便，SAS Visual Analytics 具有预定义的地理元素，范围从国家名称等通用值到 ISO 代码等特定值不等。如果你的地理数据项包含国家名称，则它可以匹配到内部表，以便在地图上绘制出该位置。从
    SAS Visual Analytics 7.1 开始开始，地理项可以是国家名称、ISO 2 字母代码、ISO 数字代码或 SAS Map ID 值。你在创建地理数据项时要选择预定义的方法。这些地理数据元素代表区域的中心。如果你在显示法国，可以用国家轮廓显示，也可以在国家中心显示。下表包含了默认提供的可用预定义地理元素，以及输入数据项预期外观的示例。表格显示了三个国家的预期数据值。


    | 澳大利亚地理数据元素示例 | 荷兰的地理数据元素示例 | 美国的地理数据元素示例 |

    | :--- | :--- | :--- |

    | 国家或区域名称 | 国家或区域名称 | 国家或区域名称 |

    | ISO 2 字母代码 | ISO 2 字母代码 | ISO 2 字母代码 |

    | ISO 数字代码 | ISO 数字代码 | ISO 数字代码 |

    | SAS Map ID 值 | SAS Map ID 值 | SAS Map ID 值 |

    | 子区域（州、省份） | 子区域（州、省） | 子区域（州、省） |

    | | | |


    在 SAS 支持 网站上，有一个用于 SAS Visual Analytics 的地理查找值（位于 http://support.sas.com/rnd/datavisualization/vageo/71/VA71LookupValues.html）。此页面包含这些值的列表，帮助你理解特定的位置。该网站上的表格列出了国家和相关的
    ISO 数字代码。


    SAS Visual Analytics 使用随产品发布的 MAPSGK 库中的内部表。你可以查看此表以确保你的数据与预期名称匹配。为了创建地理数据的额外协助，可以使用
    SAS Studio 中的 GEOCODE 程序。什么是 ISO 代码？是由国际标准化组织发布的国际标准 ISO 3166。该标准适用于国家和地区，具有多种优势。如果使用非拉丁语言（如中文或希伯来语），代码使得查找变得容易。当形成新国家时，可以分配新数字以保持历史目的。


    #### 创建地理数据项


    将数据导入 SAS Visual Analytics 之后，在使用任何地理对象之前，你必须将数据项分配给地理角色。你可以从现有的字符或数字数据项创建地理数据项：


    1.  右键点击包含预定义角的数据项。

    2.  **注意：**某些用户倾向于在分配给此角色之前复制数据项。

    3.  选择“地理（Geography）▶ 国家或区域名称”。你的数据项将移动到地理部分。

    4.  选择地理角色。


    #### 处理位置准确性问题


    如果 SAS Visual Analytics 无法绘制你的数据项，你可能需要将国家的常用名称转换为官方名称。例如，俄罗斯、美国和英国可能在你的数据集中。当你在
    MAPSGK 数据集中搜索名称时，你会发现这些国家使用不同的 ID。使用 ISO 代码来转换值通常更容易。


    #### 创建地理空间数据项


    所有地理空间数据项代表地球上的一个位置。特定的点或地址有一组坐标，被称为纬度和经度。你可能记得地球被划分为从北到南（纬度）和从东到西（经度）的虚线。当你提供位置的纬度和经度时，你就在引用这些线。在下面的图中，机场在地图上被突出显示，左侧的表格显示了机场名称。注意纬度相似的，因为这些机场位于类似的欧洲位置。经度则有一些差异。比较查尔·高堡（巴黎）坐标和都柏林（爱尔兰）坐标以更好地理解值。


    图 6.4 带有纬度的机场


    #### 创建自定义地理项


    要创建一个自定义地理项，你必须在数据集中具有可用的纬度坐标。坐标可以基于地球坐标系 (WGS84)、Web Mercator 和英国国家网 (OSGB36)。默认是地球坐标系
    (WGS84)。


    什么是坐标系？对于自定义数据点有三种坐标系可用，现在常用：


    - WGS84 是美国军事开发的卫星定位系统。

    - Web Mercator 是一种网络标准，最初用于 Google Maps。

    - OSGB36 是英国开发的系统，广泛用于基于英国的地图。


    你应该选择最适合你的特定位置或地理数据的系统。在大多数情况下，WGS84 系统是有效的。让我们使用机场坐标作为新地理项的基础。我们使用机场名称创建此数据项，但其他数据项如机场代码也同样有效。


    创建一个自定义地理数据项：


    1.  复制机场数据项并将新项命名为机场名称。

    2.  右键点击新数据项，然后选择 **地理（Geography）▶ 自定义（Custom）**。出现地理窗口。

    3.  在相应字段中选择你的纬度和经度数据项。你的新数据项出现在地理区域。


    图 6.5 添加自定义数据点


    寻找地理坐标


    如果你的数据集没有可用的地理坐标，你可以通过几个来源获取它们：


    - SAS MAPSGK 库包含多个国家和区域。

    - 有可以通过网络搜索找到的开源数据库。

    - Google 有一个你可以通过代码查询的 API。免费服务有每日访问限制，但你可以订阅他们的服务或其他商业服务。


    ### 显示地理空间对象


    在 SAS Visual Analytics 中有显示地理数据的方法：


    - **坐标（Coordinate）**——使用自定义地理项在地图上确定一个精确位置。

    - **区域（Regional）**——勾勒区域区域轮廓。

    - **气泡（Bubble）**——结合气泡图显示位置处的值。


    这些对象允许你以不同的方式和为了不同的故事突出你的地理空间数据。让我们探索这些数据对象的使用的不同方式。


    在本章的剩余主题中，示例使用的是美国国家气候数据中心网站的风暴事件数据集。该数据库包含 1950 年以来美国的发生的风暴事件（如龙卷风和雷暴）。数据集包含其他事实，例如死亡或受伤人数以及估计的财产损失。龙卷风根据其在福利特尺度上的强度从
    F0 到 F5 分级。2007 年，引入了增强福利特尺度，龙卷风被分类为 EF0-EF5。


    也许你听过人们谈论龙卷风带（tornado alley）——它是美国中部的一个区域，那里经常发生龙卷风。地理地图非常擅长显示龙卷风发生的地点。在下面的图中，机场在地图上被突出显示。纬度数字相似，因为这些机场位于类似的欧洲位置。经度则有一些差异，因为龙卷风更靠南。230
    mph (370 kph) 的风发生在过去的 50 年内。


    图 6.6 F5/EF5 位置


    为了让这个地理对象更有趣，让我们在相同的时间段添加 EF4/F4 纬度点。通过对比青色标记，观众看到 EF5/F5 龙卷风并不常见。虽然数据点是混乱的，但通过设置过滤器来控制一次显示多少数据。


    #### 与区域比较区域


    当你需要介绍关于位置的主题时，使用区域数据对象帮助观众关注注意力。这些对象也被称为分级图地图（*choropleth* maps），适用于多个区域。当你开始考虑危险的风暴事件时，你可以想象这些事件造成了大量的财产损失。比较受龙卷风影响的州的损害成本将是有趣的。使用区域地图，你可以在整个区域上放置值，例如一个国家或州。颜色随后应用于区域上，以指示值的强度。


    图 6.10 理解区域事件


    在前面的图中，你可以看到跨区域龙卷风的相关财产损失。颜色越深，风暴损坏越严重。使用平均值或百分比使值具有可比性或标准化。通过探索可视化，你可以很容易看到损害最大的区域，但很难理解损害最少的地方。确保使用图例让用户理解颜色范围。当你将指针悬停在每个州上，会出现一个包含分配数据值的提示。由于俄亥俄州和堪萨斯州颜色相似，观众可能想了解更多。堪萨斯大部分是农田和农村地区，而俄亥俄州人口密集且工业化。处于龙卷风带的堪萨斯可能经历更多的龙卷风，从而产生更多的作物损失。由于人口更多，当发生极端风暴事件时，俄亥州的损失可能更大。


    提示 1：改进你的区域地图


    有几个设置可以让区域对象的体验更好：


    - 当用户悬停在内容上时添加数据提示以提供更多信息。你可以添加任意数量的，但要确保数据项是增强而不是混淆观众。在前面的示例中，我们将事件计数（Event Count）作为数据提示。

    - 调整叠加层的透明度，使用户可以看到底层值。如果底层值被遮盖，可能会引起困惑。对于这种可视化，透明度被调整为 25%。这足以保持颜色的同时让底层值显示出来。

    - 调整渐变颜色以确保足够的对比。海洋是浅蓝色，因此需要一个与景观不相似的对比色。在图 6.9 中，使用了单色渐变。当颜色强度随值增加时，解码值变得更容易。


    选择较浅的颜色


    Edward Tufte 在《信息可视化》（*Envisioning Information*）中对地图的颜色进行了有趣的讨论。他的建议是使用自然界存在的颜色。他鼓励使用较浅的色调，并提供了几个示例。


    提示 2：添加丰富的细节


    区域数据对象非常适合用户关注特定区域。它导致了更多关于风暴事件的问题，因此使用信息窗口（info window）提供细节可能是方便的。这个信息窗口显示了按持续划分的风暴。快速风暴造成的损害可能和长风一样大，尽管这取决于龙卷风落地的位置。


    图 6.11 使用弹出窗口提供更多细节


    #### 在你的地图上添加信息窗口


    信息窗口是可以链接到另一个页面的页面。使用以下步骤在你的地图上添加信息窗口：


    1. 创建标签页。在本示例中，创建了区域地图。

    2. 创建另一个带有你选择的数据对象的标签页。在本示例中，使用了条形线数据对象来显示事件持续时间和估计的财产损失。

    3. 选择标题旁边的箭头并选择 **显示为信息窗口（Display as Info Window）**。

    4. 返回到第 1 步创建的页面。右键点击地图，然后选择 **链接（Link）> 信息窗口（Info Window）**。在出现的窗口中，选择你想要的信息窗口。


    图 6.9 添加过滤器以保持数据可视化


    ### 显示地理空间对象


    在 SAS Visual Analytics 中有三种显示地理数据的方法：


    - **坐标（Coordinate）**——使用自定义地理项在地图上确定一个精确位置。

    - **区域（Regional）**——勾勒区域区域轮廓。

    - **气泡（Bubble）**——结合气泡图显示位置处的值。


    这些对象允许你以不同的方式和为了不同的故事突出你的地理空间数据。让我们探索这些数据对象的使用的不同方式。


    在本章的剩余主题中，示例使用的是美国国家气候数据中心网站的风暴事件数据集。该数据库包含 1950 年以来美国发生的风暴事件（如龙卷风和雷暴）。数据集包含其他事实，例如死亡或受伤人数以及估计的财产损失。龙卷风根据其在福利特尺度上的强度从
    F0 到 F5 分级。2007 年，引入了增强福利特尺度，龙卷风被分类为 EF0-EF5。


    也许你听过人们谈论龙卷风带（tornado alley）——它是美国中部的一个区域，那里经常发生龙卷风。地理地图非常擅长显示龙卷风发生的地点。在下面的图中，机场在地图上被突出显示。纬度数字相似，因为这些机场位于类似的欧洲位置。经度则有一些差异，因为龙卷风更靠南。230
    mph (370 kph) 的风发生在过去的 50 年内。


    图 6.6 F5/EF5 位置


    #### 创建自定义地理项


    要创建一个自定义地理项，你必须在数据集中具有可用的纬度坐标。坐标可以基于地球坐标系 (WGS84)、Web Mercator 和英国国家网 (OSGB36)。默认是地球坐标系
    (WGS84)。


    什么是坐标系？对于自定义数据点有三种坐标系可用，现在常用：


    - WGS84 是美国军事开发的卫星定位系统。

    - Web Mercator 是一种网络标准，最初用于 Google Maps。

    - OSGB36 是英国开发的系统，广泛用于基于英国的地图。


    你应该选择最适合你的特定位置或地理数据的系统。在大多数情况下，WGS84 系统是有效的。让我们使用机场坐标作为新地理项的基础。我们使用机场名称创建此数据项，但其他数据项如机场代码也同样有效。


    创建一个自定义地理数据项：


    1.  复制机场数据项并将新项命名为机场名称。

    2.  右键点击新数据项，然后选择 **地理（Geography）▶ 自定义（Custom）**。出现地理窗口。

    3.  在相应字段中选择你的纬度和经度数据项。你的新数据项出现在地理区域。


    图 6.5 添加自定义数据点


    寻找地理坐标


    如果你的数据集没有可用的地理坐标，你可以通过几个来源获取它们：


    - SAS MAPSGK 库包含多个国家和区域。

    - 有可以通过网络搜索找到的开源数据库。

    - Google 有一个你可以通过代码查询的 API。免费服务有每日访问限制，但你可以订阅他们的服务或其他商业服务。


