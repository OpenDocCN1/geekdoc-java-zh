    # introduction


    At SaaS Forum in 2012, SaaS CEO June introduced an application that offered not
    only to quickly process data, but to make analytics accessible to business users.
    There was an industry revolution taking shape, and data becoming a mainstream
    topic.


    From a small desk, Data Gould described the laptop was connected to servers in
    Cary, 600 miles away. The first seemed to concern him. He had placed the client
    connection to billions of rows. Neither seemed discovering the mysteries within
    the data. A graphical user interface helped him. The application was so easy to
    use that there was no need for anything. This application was called SaaS Analytics.


    This was being written during an interesting period for the evolution of SaaS
    Analytics. By using our publishing contract, SaaS Analytics as the application
    would become methodology. It would become part of the new normal, cloud-based
    SaaS Visa product and easier to use. As users were creating content, sharing and
    taking screenshots, SaaS RSD was completing product validation and adding some
    fine touches for the release.


    With the analytics, the changes were found in the industry organization and performance.
    The larger change was the move to in-memory storage, which enabled real-time data
    analysis. In the new release, the in-memory component is called the SAS Analytics
    Server. Both servers are in memory that they are called server random access memory
    (RAM). The differences in how they are accessed is how this changed.


    If you want to use our analytics, you can adopt the new release with minimal effort.
    This little is largely based on SaaS Analytics 7.3, but also includes guidance
    for the SAS Visa chapter. This chapter provides an introduction and overview of
    the application.


    # APPLICATION INTRODUCTION


    SaaS Analytics provides a complete platform for analytics, visualization, enabling
    you to identify patterns and relationships in data that were not initially visible.
    Every user of all skills can load data, search for patterns, and create robust
    reports and dazzling interactive analytics effortlessly.


    # Understanding in-memory data storage


    The key feature of SaaS Analytics is the in-memory storage. In the in-memory application,
    the data loads from the file system in the server''s random access memory (RAM).
    The data loaded in RAM, queries, calculations, and analyses are also instant.
    The SAS Analytics Server handles this functionality seamlessly.


    The SAS Analytics Server represents how it show how analytics are applied to large
    volumes of data. By using a massively parallel processing architecture, the engine
    can distribute your data in clusters across multiple machines and keep that data
    loaded to process your jobs at speed. This means that the SAS server delivers
    results at previously unattainable levels of performance


    # Understanding the application


    Many users are confused about how the application work together. The following
    figure shows each application and how data travels through each.


    Figure 1 Application


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_4_0.png)


    Here''s a brief overview of each application and its purpose. Each of these applications
    is discussed in later chapters.


    +   - SAS Analytics Homepage (SaaS Home/Hub)


    This is the entry point to today. You can access the content and other applications
    based on your assigned role.


    +   - Report Viewer/BI Viewer


    The application enables you to create content such as reports or stories. The
    BI Viewer views more stories to see the Report it runs on your mobile device or
    tablet.


    +   - Data Builder


    This application enables you to load data from a source to the SAS Analytics Server.
    Year data or from social media. This application is used by data administrators
    and consumers. In the SAS Analytics 8.1 release, the Data Builder was focused
    on data warehousing. This changes non-technical users use a more intuitive way
    to load data and manage their data.


    +   - SAS Analytics Server


    The SAS Analytics Server provides the in-memory storage engine. The biggest change
    between the release of SAS Viya is the SAS Analytics Server to SAS Cloud Analytics
    Server (CAS).


    +   - Visual Designer/Visual Explorer


    The Visual Designer enables you to create interactive dashboards and reports.
    The Data Builder enables you to explore new data sets and create advanced analytics.
    The content can be shared with Visual Designer. Once saved, content is available
    to the Report Viewer. In the SAS Analytics 8.1 release, the Visual Designer and
    Visual Explorer were combined into one application. With the combined applications,
    users can create and share visualizations in the same application.


    +   - Administrator


    This application enables you to load and monitor the SAS Analytics Server. This
    application is used by administrators. In the SAS Analytics 8.1 release, the administrator
    was functionally merged with SAS Environment Manager. The Environment Manager
    was replaced with SAS 8.9. It allows you to master the SaaS platforms. The SAS
    Analytics Administrator to SAS Environment Manager was built for longer-term plan
    to have a central location to administer the system.


    # HOW TO USE THIS SAS


    This book is divided into four parts that focus on different areas of the application.


    +   - Part 1 Getting Started


    Learn the basics of SAS Analytics by creating a new report. You can learn how
    to quickly load data to create beautiful reports. Next, you can create a dashboard
    using any of the additional features.


    +   - Part 2 Customizing Your Data Analytics


    Once you understand the basics, you can learn more about the other data objects
    and working with advanced analytics.


    +   - Part 3 Administration and Data Loading


    The SAS Analytics Solution provides a remarkably powerful and diverse set of tools
    with you accomplishing feats of large-scale data analytics and integration. It''s
    important to understand how software tools function and integrate so that you
    can get the best and most efficient out of them.


    +   - Part 4 SAS Analytics Analytics 8.1


    This part of the book takes you to the new release of SAS Analytics, which is
    on SAS Viya. These chapters introduce you to the new environment and how to navigate
    and use the Visual Data Builder and SAS Analytics.'
- md: "\n## Part One\n\n## Getting Started\n\nThis part provides a tutorial for SAS\
    \ Visual Analytics. You will learn how to access content through SAS Home. Then\
    \ you will build a simple report. In the next chapter, you will learn the basics\
    \ for creating a performance dashboard. After completing those chapters, you learn\
    \ how to load data with the Data Builder.\n\n- Chapter 1 Accessing Content\nThis\
    \ chapter explains how to use the SAS Home page, which provides a gateway to the\
    \ application features and content. You are guided through the home page features\
    \ and some of the Report Viewer features.\n\n- Chapter 2 Building Your First Report\n\
    The chapter is is a tutorial for Visual Designer (also known as Report Builder).\
    \ It shows you how to build a simple report and provides an overview of the basic\
    \ product features. Topics include interface overview, adding data, creating a\
    \ simple report, and how to control the report look and feel.\n\n- Chapter 3 Building\
    \ Your First Dashboard\nThis chapter is a tutorial for the advanced features in\
    \ the tool. You are shown how to create a performance dashboard that explains\
    \ how to think about the data, determine the best layout, and use extra features.\n\
    \n- Chapter 4 Using the Data Builder\nThis chapter shows you how to massage and\
    \ load your data into the SAS LASR Analytic Server.\n\n## Accessing content\n\n\
    AWS Video Analytics allows you to call any video function synchronously or asynchronously.\
    \ When you call a function, it returns a deserialized object that you can then\
    \ use to access the content of the video. For example, when you call a video function,\
    \ you need to pass the content to it and de-serialize it.\n\nThis starts with\
    \ unmarshalling the content and deserialize it. You get the content through the\
    \ various functions of the SDK.\n\n## METHODS OF ACCESSING CONTENT\n\nWhen you\
    \ access content through AWS Video Analytics, you can use one of two methods.\
    \ Each method has its advantages depending on your use case.\n\n### Accessing\
    \ content via a buffer\n\nWhen you access content via a buffer, AWS Video Analytics\
    \ returns a buffer containing the video content. This method is useful when you\
    \ want to process the video content yourself using other libraries.\n\n### Accessing\
    \ content through an object\n\nWhen you access content through an object, AWS\
    \ Video Analytics returns an object containing the video content. This method\
    \ is useful when you want to use the built-in functions and services provided\
    \ by AWS Video Analytics.\n\nYou can use this method when you want to use AWS\
    \ Video Analytics functions directly. This method is also useful when you don't\
    \ want to process the video content yourself.\n\n### Accessing content via the\
    \ media url\n\nWhen you access content via a media url, AWS Video Analytics returns\
    \ the media URL of the video content. This method is useful when you want to stream\
    \ the video content using other players.\n\nThere are also other methods to access\
    \ content when the video file is stored in Amazon S3. In this case, you can use\
    \ a pre-signed URL.\n\n## Understanding roles\n\nTo use AWS Video Analytics, you\
    \ need to create an IAM role. This role gives AWS Video Analytics permission to\
    \ access the AWS resources it needs.\n\nWhen you create an IAM role, you define\
    \ a trust policy. This policy defines which entities are allowed to assume the\
    \ role.\n\n## Creating a collection\n\nTo create a collection, you can use the\
    \ AWS Video Analytics console. A collection is a group of videos that are related\
    \ together.\n\n1. Log in to the AWS Video Analytics console.\n2. Select Collections\
    \ from the left menu.\n3. Click the Create collection button.\n4. Give your collection\
    \ a name and click Create.\n\nOnce the collection is created, you can add videos\
    \ to it.\n\n## Viewing the results\n\nRecommended / Playlists / History / Topics\
    \ / Tutorials / Settings / Support / Get the App / Sign Out\n\n© 2018 Safari.\
    \ Terms of Service / Privacy Policy\n\n## Chapter two: Building your first report\n\
    \nThe SAS Analytics Designer (the Designer) is the SAS Visual Analytics application\
    \ that enables you to build reports and dashboards. The Designer can be accessed\
    \ through the web application. Once the content is prepared in the Designer, it\
    \ can then be viewed on the SAS Analytics Viewer or through the SAS Mobile application.\
    \ You can also import and access data from the Designer.\n\nOne of the benefits\
    \ of the Designer is that you don’t have to create code when you build reports,\
    \ which can be a huge help to analysts who might not be fluent with code. Tables,\
    \ graphs, and other objects are all controlled through drag-and-drop functionality.\
    \ All object properties can be set using screen options. Even creating new involves\
    \ going through guided interface! In this chapter, we go through how to access\
    \ and navigate the Designer. From there, you are guided through creating an initial\
    \ report that includes using basic objects, creating new data items, and setting\
    \ up interactions between objects.\n\n### ACCESSING THE DESIGNER\n\nYou can access\
    \ the Designer through either a direct link or by navigating SAS Home. The following\
    \ figure shows you which spots on the Hub lead you to the Designer.\n\nFigure\
    \ 2.1 How to get to the Designer from the Hub\n\nYou can use the drop down list\
    \ to link to the applications on the system, including the Designer. The **Create\
    \ Report** tile under **Create Content** also links you to the location.\n\nYou\
    \ can also directly link to the Designer if you know your server and port number.\
    \ The link is structured as follows:\n\nhttp://<server:port>/SASVisualAnalyticsDesigner\n\
    \n### INTDUCING THE DESIGNER LAYOUT\n\nWhen you navigate to the Designer, you\
    \ are brought to the main screen, which consists of three distinct areas that\
    \ are used for development.\n\nFigure 2.2 Areas of the Designer\n\nThe left pane\
    \ is used as an inventory for data, objects, and reports. The middle area is the\
    \ canvas where reports are designed and structured. The right pane contains multiple\
    \ tabs, which enable control over the objects.\n\n### Using the canvas\n\nThe\
    \ canvas is the user’s workspace for creating reports. It is broken up into multiple\
    \ tiers that include prompts as well as sections.\n\nFigure 2.3 Tiers of the canvas\n\
    \nThe letters A, B, C, and D represent the tiers of the canvas. As you go up the\
    \ canvas, each tier has a responsibility to what is below it. Here is how they\
    \ are set up:\n\n- Body - This is where the report objects can be placed and then\
    \ get populated with data items.\n- Section Prompt – This tier acts as a filter\
    \ to the body. Control objects can be positioned here to regulate what data shows\
    \ up in the objects in the body.\n- Sections – Here is where the sections of the\
    \ report are displayed as tabs. Each section has its own independent section prompt\
    \ and body.\n- Report Prompt – Similar to the section prompt, this prompt controls\
    \ data across sections in the report. Any object placed here filters the entire\
    \ report.\n\n### Using the left pane\n\nThe left pane of the designer is where\
    \ you can access an inventory of objects, the data sets that you are working with,\
    \ and even other reports. This area is where you begin to build reports. The pane\
    \ is set up with four tabs for each action. You can turn on or off which ones\
    \ show up in the top bar by clicking the dropdown list in the top right corner\
    \ of the panel as shown below.\n\nFigure 2.4 Left pane of the Designer\n\nThe\
    \ **Objects** tab is where you can drag the various objects to the body of a report.\
    \ This tab is broken into categories of objects that include tables, graphs, containers,\
    \ and others. All of the objects can go into the body, but only control objects\
    \ can go into the prompt areas (See Figure 2.3).\n\nThe **Data** tab is where\
    \ you can import data and see all of data items for each source. By clicking the\
    \ **Select a data source** dropdown menu on the Data tab, you can access any of\
    \ data sets in the LASR library. Once a data set is brought in, the data fields\
    \ populate the section of the tab. When any of the data items are selected, their\
    \ properties populate at the bottom. You can manipulate how the data appears on\
    \ the canvas by changing these values.\n\nThe last important part of the **Data**\
    \ tab is the arrow at the top. This is where you can create new data items and\
    \ perform other manipulations to your data that help make better reports. These\
    \ options are covered later in this chapter as well as in later chapters of this\
    \ book.\n\nThe **Import** tab can be used to bring in other reports created in\
    \ SAS Visual Analytics. If there was a particular object, section, or whole report\
    \ that one wanted to add to their current report, they can find that item and\
    \ then drag it to their report.\n\nThe **Shared Rules** tab is where you can create\
    \ display rules for gauges that can apply to multiple gauges in a report. This\
    \ can be very helpful in dashboards where gauges are often used. A shared rule\
    \ makes it easy to apply a display rule across the ones you want. Display rules\
    \ and gauges are covered further in Chapter 3.\n\n### Using the right pane\n\n\
    The right pane is where a user can control the attributes of the report, sections,\
    \ and objects. Attributes include titles, look and feel, filtering, and other\
    \ customizations. Each one of the tabs can be used on an object, but only some\
    \ of them can be used on the whole section or report.\n\nFigure 2.5 Tabs on the\
    \ right pane of the Designer\n\nThe **Properties** tab is the only one that has\
    \ options for an object, section, or report. Depending on which one you have selected\
    \ the options within the tab are different. At the report tier, you can change\
    \ the title, set a description for the report, and control the section and report\
    \ prompts of the report. From the report tier, you can change to the section tier\
    \ of the tab by selecting any of the sections. The **Properties** tab on the section\
    \ tier consists of the title, the layout, and control of the section prompts.\n\
    \nThe layout gives you a choice of tiled or precision. Tiled is much more user-friendly\
    \ in that as you add each object, the canvas just continuously splits the rectangles\
    \ in half. Then you can adjust the split afterward. Precision gives you complete\
    \ control over each object on the canvas. You can change the height and width\
    \ as well as stretch and shrink as you can with a picture in a document. This\
    \ gives you a lot more control over the layout of the canvas but should only be\
    \ used after you are more familiar with the application.\n\nAt the object level,\
    \ the **Properties** tab can vary depending on the object selected. There are\
    \ always the settings of name, title, and description. Title is what shows up\
    \ on the canvas, and name is how the object is referenced across the report. The\
    \ rest of the options can include anything from selecting axis settings, determining\
    \ if and where to put legend, or how to handle grouping data.\n\n## BUILDING YOUR\
    \ FIRST REPORT\n\nThe preparation can save you many hours of work, and with experience\
    \ this is something you start naturally. However, when you are just starting with\
    \ this process, there are a couple of things to consider before you start developing.\n\
    \n- What do you want to know?\nPutting data fields into charts and looking at\
    \ counts can give you some insight into your data, but this is just scratching\
    \ the surface of what the application can do. It is good to think ahead of time\
    \ about what data fields you are really interested in. Could there be actionable\
    \ insight if you compared, say, sales by product lines over time? Making a list\
    \ of these is good to keep you on track to get the answers you are looking for.\n\
    \n- Do you have the right data?\nWhether you are importing data off your local\
    \ machine or pulling from a database, it is important to have the fields that\
    \ you want in the right format so that you can start to look at the questions\
    \ you are trying to answer. Sometimes sources need to be joined or transposed\
    \ before adding the data into the application so that everything is available\
    \ to the user in the correct way. Also, some data calculations might need to be\
    \ done in the application so all of the elements of each calculation have. For\
    \ example, if you wanted to look at profit by items sold, you would need both\
    \ their sale price and what it costs to make them in the source data. Now these\
    \ aren’t necessary steps, but they can save you a lot of time and possible rework\
    \ if thought about before diving in. For our first report, we are going to look\
    \ at a toy store company. We are exploring their customer behavior. Some of the\
    \ things to look for are how the purchases of customers change weekly, monthly,\
    \ and yearly. Not only that, but does this change according to product line or\
    \ geographic area? Also, in which areas of the company are customers providing\
    \ us with the most profit? This report is built using the VA_SAMPLE_SMALLIGHT\
    \ data set that is shipped with SAS Visual Analytics. So what we’re going to do\
    \ is set up four graphs and one control in a section to try to get answers to\
    \ the questions above. We are going to look at the breakdown of sales by product\
    \ line, where the transactions are coming from, and in what months or weekdays\
    \ they are occurring. We also are setting up filtering of objects through interactions\
    \ so that we can drill down into the data to get more insight. Here’s the report\
    \ that you build by the end of this chapter:\n\nFigure 2.7 Final result of our\
    \ first report\n\n### Adding a data source\n\nA data source can be anything that\
    \ contains information in a structured form. This can be spreadsheets, text files,\
    \ database tables, and so on, just long as there is a way for the application\
    \ to understand how the data is to be brought in. For example, if you wanted to\
    \ bring in a spreadsheet, there is the option for which worksheet, start row,\
    \ and columns to bring in. With a TXT file, there are similar options such as\
    \ choosing which delimiter is used to separate the data.\n\nThere are also multiple\
    \ areas to which you can bring in a data source to the application. There is an\
    \ option to bring in data locally, which is from your personal computer. You can\
    \ also pull in data from a server. This can be data sets on a SAS server or database\
    \ tables on a server that is not from SAS. To get data from a server that is not\
    \ from SAS, the administrator must grant access. There is also social media data\
    \ such as Twitter, Facebook, or Google Analytics where you can pull information\
    \ that is publicly available.\n\nTo add data source to the report:\n1. The left\
    \ pane is where you can add data sources to the report. When you click on the\
    \ square with + sign in the Data tab, the Add Source window appears. Everything\
    \ in the data sources table is what is currently on the SAS LASR Analytic Server\
    \ and available.\n2. Find the VA_SAMPLE_SMALLIGHT data set. If you do not see\
    \ it, then talk to your administrator about getting sample data loaded.\n3. Select\
    \ the VA_SAMPLE_SMALLIGHT data set and click Add. The data source appears in the\
    \ Data pane and is ready to use.\n\n### Working with data sources\n\nAfter you\
    \ click Add in the Source window, the data set populates into the Data tab. Each\
    \ of the data items has a number after it. The data items are divided into three\
    \ sections when brought in which are Category, Measure, and Aggregated.\n\n###\
    \ Improving the data object appearance\n\nNow that our first chart is made, we\
    \ can change the appearance of it by using the Properties and Styles tabs in the\
    \ right pane. The Properties tab is where we can change the context of what appears\
    \ on and around our bar chart. The reason to make changes to the appearance is\
    \ so that the end viewer can get more context around what they are looking at\
    \ and make it more appealing when viewers first glance at the report.\n\n### Limit\
    \ chart!\n\nThere are ways that can improve the appearance of objects and also\
    \ ways that actually make it harder to interpret. In Information Visualization,\
    \ Edward Tufte writes about how to avoid chart junk. He explains that chart junk\
    \ is any decoration of graphics that does not give the viewer any additional information.\
    \ This can be gridlines, tick marks, unnecessary labels, and so on. Using those\
    \ extra lines just makes it harder for the viewer to know what to look for.\n\n\
    ### Changing the properties\n\nHere are a few things that you can change to improve\
    \ the appearance:\n- Under General, change Name and Title to Percent of Sales\
    \ by Product.\n- Change to bold and change the Title to 16 pt font.\n- Under Bar,\
    \ select Horizontal for the Direction.\n- Under Reference Lines, click New reference\
    \ line. Use a value of 2% and click Add.\n- Under Grid Lines, uncheck the grid\
    \ box.\n\n### Changing the appearance\n\nThe Styles tab is where we can change\
    \ the look and feel of the chart. Here are some examples:\n- Under Styling, change\
    \ the Data skin to Matte.\n- Under Data Colors, change the first box under Fill\
    \ to your choice.\n\nMost of these changes were just for you to get used to using\
    \ the various options available. \n\n### Making your visualizations more appealing\n\
    \nIn Information Visualization, Colin Ware describes the perceptual process of\
    \ how our eyes interpret an image. Pattern perception is a key component for visualizations\
    \ since we want to find discrepancies and trends in the data. When we apply any\
    \ of data skins to an object, the display is given a certain texture and shading\
    \ that makes the data portion more appealing. This can speed up pattern recognition\
    \ because the viewers’ eyes will gravitate more to the data instead of other areas.\n\
    \n### Adding a reference line\n\nThe reference line is good to use to benchmark\
    \ the data against some number. Figure 2.11 Bar chart with reference line added.\
    \ So, for our example, corporate has come to us saying they want to see if all\
    \ of product lines are pulling their weight. We set the reference line as a benchmark\
    \ at 2% to see if product lines fall under that amount. Since we have added the\
    \ reference line, the grid lines can get a little confusing, which why we unselect\
    \ them.\n\n### Adding data to other objects\n\nNow that we have completed our\
    \ first object, it is time to fill in the rest of objects with data and get them\
    \ to look the way we want. Here are the steps to create the additional objects:\n\
    \nPie chart (top right corner)\n1. Name and Title: Percent of Transactions by\
    \ Continent (Bold and 16 pt font).\n2. Under Data Labels, check Show Category\
    \ Labels.\n3. Uncheck Other slice for minimal values.\n4. Uncheck Show Legend.\n\
    5. Data skin: Matte.\n6. Roles: Category: Continents, Measures: Frequency.\n\n\
    Line chart (lower left corner)\n1. Name and Title: Total Transactions by Month\
    \ (Bold and 16 pt font).\n2. Data skin: Matte.\n3. Roles: Category: Transaction\
    \ Month of Year, Measures: Frequency.\n\nBar chart (lower right corner)\n1. Name\
    \ and Title: Total Transactions by Weekday (Bold and 16 pt font).\n2. Data skin:\
    \ Matte.\n3. Roles: Category: Transaction Day of Week, Measures: Frequency.\n\n\
    When you are all finished, your report should look something like this:\n\nFigure\
    \ 2.12 Report with all chart objects and data items added\n\nWithin this graph,\
    \ we have created a report that displays an overall analysis of the purchases\
    \ from customers. We can see which products our customers are spending the most\
    \ on, where in the world those transactions are coming from, and a breakdown of\
    \ the months and days of when they occurred. This, however, is just a static view\
    \ of the data. After looking at this report, you might want to know the geographic\
    \ breakdown for just the product line or the months in which customers buy the\
    \ most games. In the next section, we start to connect the objects together so\
    \ that this report becomes dynamic and you can access the discovery part of their\
    \ data analysis.\n\n## Working with data objects\n\nFor every report where you\
    \ are doing analysis, you want not only pack the most data you can onto the screen\
    \ but also give the user multiple views of the data. Being able to filter data\
    \ by certain conditions gives the user the ability to see the data from a different\
    \ point that might interest them or bring about an idea. That could be within\
    \ a certain date range, by a category, or some other condition that they see fit.\
    \ Being able to break down the data in this way gives more power to you to see\
    \ more visualizations about their data, which could lead to additional insight\
    \ about what they are exploring.\n\nWithin the Designer there are multiple ways\
    \ to filter data:\n- Using Data Source Filter.\n- Adding a filter in the Filter\
    \ tab for an object.\n- Navigating the prompts.\n- Setting up interactions in\
    \ the Interactions tab.\n\nThe Data Source Filter is found on the left pane Data\
    \ tab. When you click on the dropdown menu there is an option to create a New\
    \ Data Source Filter. This is a filter that you can place on the whole data set\
    \ before working with it. Once set, all of the data items are filtered.\n\n###\
    \ Using the Filter tab\n\nAnother way is to use the Filter tab on the right pane\
    \ when working with an object. Here, you can select certain data items and filter\
    \ out values so that certain rows get displayed. When you get to the tab, you\
    \ have the option of selecting any item from the dropdown list or creating your\
    \ own. In our report, we know that we are going to close our Asia since they are\
    \ becoming unprofitable and even though it is a small amount, we want the continent\
    \ breakdown. Here’s what to do for our report:\n\n1. Go to the Filters tab.\n\
    2. Make sure that Percent of Transactions by Continent is selected in the first\
    \ dropdown list.\n3. Click the second dropdown list and select Continents.\n4.\
    \ Click Add Filter.\n5. Uncheck Asia and Oceania. You should be able to see the\
    \ pie chart update without those.\n\n### Filtering with report and section prompts\n\
    \nIf we want to give the viewer control over what is filtered, there are two ways\
    \ to do that. One way is through the report and section prompts that sit at the\
    \ top of the canvas. You can put control objects in these areas of the canvas,\
    \ which then control what data filters into the sections. The report prompt filters\
    \ for all of the sections. The section prompt filters for all of the objects.\
    \ Each of the control objects that can be used in prompt are listed below:\n\n\
    - Object\n- Description: Best used with\n- Drop down list: Lists all of the possible\
    \ values in a dropdown menu.\n- Categories with many values: Bar in a ribbon form,\
    \ lists all of the values of a particular category.\n- Categories with only a\
    \ few values: Text Input Similar to a search field, this is a text box that enables\
    \ you to enter text.\n- Descriptive categories where you might want to search\
    \ for a keyword\n- Slider: Best used when you want to filter based on a chronological\
    \ range. Works best with dates.\n- Dates: The dropdown list control cannot be\
    \ used in section prompts.\n\n### Adding a slider object\n\nFor our report, we\
    \ are going to add a slider to the report. This can be done through a drag-drop\
    \ operation like all the other objects. Here’s how you do it for our report:\n\
    1. Under Controls on the Objects tab, drag the Slider to the section prompt of\
    \ the canvas.\n2. Add Transaction Year as the Measure/Date in the Roles tab.\n\
    3. The object then populates with the minimum and maximum values from our data\
    \ field as shown below:\n\nYou can then modify the triangles on the slider to\
    \ get the range you want to see. If the triangles are put on the same year, then\
    \ the data is filtered for just that one year. After the triangles are set, you\
    \ see the data within objects change to how they have filtered the report. Remember\
    \ that this filters all of the data in a section.\n\n### Adding object interactions\n\
    \nThe other way to let the user do filtering in SAS Visual Analytics is to build\
    \ interactions between objects. Earlier in the chapter, the Interactions tab was\
    \ mentioned as a way to connect objects and sections together. For this section,\
    \ we are just going to focus on connecting objects together. But you can also\
    \ connect objects to other sections, reports, info windows, or even external links.\
    \ This can be done by going to the Interactions tab of an object in the section\
    \ and clicking the New dropdown menu. Here is where you can find the ways to set\
    \ up links to areas outside of the section.\n\n### Create an interaction\n\nHere’s\
    \ the steps to create an interaction in our report:\n1. Make sure that our initial\
    \ “Percent of Profit by Product Line” bar chart is selected. The Interactions\
    \ tab can be used for every object, so we want to make that we are setting the\
    \ one for the bar chart.\n2. On the Interactions tab, select New and then Interaction\
    \ in the dropdown list.\n3. Stick with the first selection but change the dropdown\
    \ list so that it reads Percent of Sales by Product Line filters Percent of Transactions\
    \ by Continent.\n4. Click OK.\n\nWhen you click OK, the connection is set up between\
    \ the two objects. You’ll notice the data change in the pie chart if you click\
    \ any of product lines in our first bar chart. The Filter works like any other\
    \ way of filtering. If the connection is established between objects and a value\
    \ is selected, then other values are filtered out. Brushing, on the other hand,\
    \ highlights values instead of hiding them. Since we are working with aggregations,\
    \ the brush option would not work and is better used with individual points such\
    \ as scatter plots.\n\n### Using the interactions view\n\nOne interaction is nice\
    \ to use, but with many objects you might want to have interactions set up so\
    \ that the viewer can really dig deeper into the data. Another, and more visual,\
    \ way to add interactions is to use the Interactions button. When you click this\
    \ button in any object, it brings up all the objects in the section. Here are\
    \ some interactions to set up for our report:\n- Percent of Profit by Product\
    \ Line filters Transactions by Month\n- Percent of Profit by Product Line filters\
    \ Transactions by Week\n- Percent of Transactions by Continent filters Transactions\
    \ by Month\n- Percent of Transactions by Continent filters Transactions by Week\n\
    - Total Transactions by Month filters Transactions by Week\n\nYour interactions\
    \ should look like this:\n\nFigure 2.13 Bar chart with reference line added. So,\
