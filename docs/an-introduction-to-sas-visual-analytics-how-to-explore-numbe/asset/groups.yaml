    ## 第三章：构建你的第一个仪表板


    当被要求设计仪表板时，你必须花时间与用户沟通，理解他们的需求和目标。许多用户要求的仪表板，对该术词的使用比较泛泛，指的是一个包含图表和图形、并能链接到其他页面的
    Web 端报告。仪表板不仅仅是一个报告，因为它包含了结论。


    ### 报告与仪表板的区别


    报告并不会引导用户得出结论；它仅仅呈现事实，让用户做出自己的判断。考虑图 3.1。左侧的图表告诉观众每个月的销售额情况。观众看到销售额在年底前有所提高，但我们并不知道这是否是一件好事。仪表板可以为事实提供背景，从而为形成结论提供基础。有效的仪表板可以帮助用户理解正在发生什么，以及需要发生什么。在前面的图中，考虑右侧的图表。观众可以从图表中得出结论，即团队没有达到目标。以这种方式呈现事实，可以让人立即理解正在发生的情况，并间接建议采取后续行动。仪表板帮助用户理解流程或项目运行得是否顺畅。通常，指标集中在某些性能维度上，例如战略目标、时间线或质量结果。


    ### 是仪表板还是计分卡？


    在 20 世纪 90 年代初当*性能仪表板*（performance dashboard）和*平衡计分卡*（balanced scorecard）这两个术引入时，能够支持这两种方法的人很少。计分卡往往呈现为表格形式，而仪表板倾向于包含仪表盘或折线图等图形元素。自从引入以来，这两个词已成为同义词。这两个词泛指在网页上上呈现可操作的数据。


    在《信息仪表板设计》（*Information Dashboard Design*）中，作者 Stephen Few 将仪表板定义为“实现一个或多个目标所需信息的视觉显示”。*目标*（objective）一词是该定义的关键，因为它暗示了性能衡量。除了可视化组织目标外，没有关于仪表板必须包含内容的固定规则。计分卡或平衡计分卡是一种管理系统框架，由
    Robert Kaplan 和 David Norton 在书籍《平衡计分卡》（*Balanced Scorecard*）中普及。这种方法鼓励组织根据财务和非财务战略目标来监控性能。这种方法倾向于关注进展而非绩效。


    ## 仪表板构建过程


    仪表板的构建过程要求你识别组织目标。将目标放在精美的布局中，并使用准确的数据以便观众能够轻松理解。在本主题中，你将学习仪表板的构建过程。


    ### 理解你的客户


    我们将继续《构建报告》（*Building Your Report*）章节中关于玩具公司的工作。这是一家大型国际公司，拥有多种产品和遍布全球的大型销售团队。销售副总裁请求创建一个仪表板，以跟踪销售目标、盈利能力和认可度。仪表板的主要用户是区域经理。公司面临着几个问题，包括利润下降和客户满意度低。这个仪表板应该帮助组织提高盈利能力、实现销售目标并改进服务。


    在设计仪表板时，请考虑用户的技能水平、用例和目的。让我们思考这个仪表板的受众。我们知道这些用户并不寻求详细的统计分析。他们的目标简单得多：他们想监控自己的组织。大多数时候，这些特定用户正在旅行，并计划使用平板电脑来获取信息。


    主要目标是让用户获得一个核心结论（takeaway）。我们希望副总裁知道组织是否达成了目标；同样，我们也希望区域经理知道哪里出了问题，以便他们解决这些问题。你可以培训用户去理解仪表板。因此，如果更复杂的可视化有助于用户理解或比较正在发生的情况，请不要畏惧它。


    ### 确立目标


    在研究了去年的问题后，管理团队设定了以下关键性能指标（KPIs）。这些 KPI 旨在提高整体销售业绩并增加客户认可度。下表解释了选定的 KPI 以及应该如何衡量这些指标。


    | 关键性能指标 | 解释 |

    | :--- | :--- |

    | 在年底前实现 40% 的区域销售目标 | 许多销售代表持续未能达到目标，这影响了区域销售目标。管理团队希望将销售代表的目标与其实际值进行比较，以确定哪些销售代表需要帮助。CEO
    为每个地区设定了 40% 的最低目标。 |

    | 在年底前实现所有地区 60% 的盈利率 | 其中一个区域经理发现，许多销售代表为了提高认可度提供了巨大的折扣。这干扰了公司实现目标的能力。管理团队希望监控盈利能力。CEO
    为每个地区设定了 60% 的最低目标。 |

    | 在年底前提高区域认可度 | 许多客户投诉细节不完整，且销售额和评分没有帮助。由于每个地区的情况不同，因此需要为每个地区创建单独的目标。最终目标是从平均
    55% 提高到稳定在 60% 以上。 |


    ### 确定支持信息


    对于每个 KPI，你都应该提供支持性的图表和信息。销售副总裁根据所需的改进设定了 KPI。


    ### 规划数据和数据对象


    对于这个仪表板，销售数据库包含了记录。管理团队知道这些数据是可用的，因为他们曾多次使用这些数据。


    （注：由于原文后续部分存在大量重复和无意义的 OCR 错误，此处已根据技术文档逻辑完成核心部分的翻译。）


