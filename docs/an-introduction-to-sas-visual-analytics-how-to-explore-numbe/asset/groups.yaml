    # 第三部分：管理与数据加载


    SAS Visual Analytics 解决方案提供了一系列强大且动态的软件工具，通过这些工具，你可以完成惊叹的大规模数字数据处理和分析。了解这些软件工具如何运行以及如何协作至关重要，这样你才能从中获得最佳且最高效的结果。


    在本部分中，你将学习加载数据的其他方法、如何管理 LASR Analytic Server，以及调优系统的技巧。


    - **第 8 章** 加载数据


    SAS LASR Analytic Server 支持广泛的数据源。本章将简要说明支持哪些类型的源，以及串行与并行加载的考虑因素。


    - **第 9 章** LASR 管理


    为了成功维护 SAS LASR Analytic Server，SAS 管理员应该熟悉 SAS 业务智能架构、Hadoop 架构，以及各自的软件服务如何相互协作。


    - **第 10 章** 性能考虑


    SAS 软件为企业提供了极其灵活的部署和运行架构。针对你的数据和用户优化软件以实现最佳利用是一个必要的步骤。本章将讨论关于可扩展性、可用性和效率的考虑因素。


    ## 第八章：加载数据


    SAS Visual Analytics 7.3 完全依赖 SAS LASR Analytic Server 作为数据存储和分析引擎。在本书的这一部分，我们认为数据如何进入
    LASR。事实证明，数据可以从多个源直接加载到 LASR Analytic Server。每个源都有不同的潜在选项、依赖关系和功能。


    在本章中，我们将完成以下工作：


    - 查看 SAS LASR Analytic Server 如何通过优化来处理海量数据

    - 探索 SASHDAT 文件格式，该格式专为处理高性能分布式数据而设计

    - 演示数据的其他并行加载技术

    - 调查数据向 LASR Analytic server 的自动加载，该功能适用于 SAS Visual Analytics


    ### 内存存储与众不同


    LASR Analytic Server 是使 SAS Visual Analytics 独出的关键组件。LASR Analytic Server 是一个内存数据存储区域，允许用户快速访问和组合数据。在没有
    LASR Analytic Server 之前，每次查询数据或执行计算时，计算机都必须从磁盘检索数据。对于海量数据，这会消耗大量时间，特别是当多个用户同时在服务器上时。通过
    LASR Analytic Server，所有表都预加载到 RAM 中，因此各种分析可以轻松地访问数据。如果你想增加数据量或提高性能，可以向系统添加额外的服务器，使
    LASR Analytic Server 将工作负载分布到更多机器上。


    ### 关键在于速度


    现在有两种将数据加载到 LASR Analytic Server 的方法：串行或并行。记住 LASR Analytic Server 是内存型的，因此当它宕机或重启时，服务器中的所有表都需要重新加载。在串行加载过程中，数据从源系统加载，通过单个
    I/O 连接，该连接可能成为瓶颈，导致数据无法以最快速度流入系统。通过使用并行加载过程，数据通过多个 I/O 通道同时从源传输到 LASR，这要高效得多。


    ### 理解非分布式部署


    当 SAS LASR Analytic Server 软件运行在单台主机机器上时，SAS Visual Analytics 以非分布式部署的方式运行。这意味着加载到
    LASR 内存中的所有数据都保留在单个物理机上——而不是分布在多个主机的内存中。SAS 系统的其他软件组件可以与 LASR 一起部署在同一个主机上，也可以根据你站点的许可自行分布在不同的主机上。


    图 8.1 SAS Visual Analytics 非分布式部署


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_15_0.png)


    在上面的插图中，用户通过 PC 上的网络浏览器或移动设备上的 SAS Mobile BI 应用程序访问 SAS Visual Analytics Web 应用。SAS
    Visual Analytics Web 应用与 SAS 元数据服务器协调用户访问和授权。针对报告内容和其他数据驱动显示的用户请求从 SAS Visual
    Analytics 发送到 LASR Analytic Server，由它对内存中的数据进行处理以执行必要的分析任务。LASR Analytic Server
    的管理——即加载和卸载表，以及停止和启动 LASR 服务——需要授权用户使用 SAS Workspace Server。来自 Base SAS 可访问的任何源（带有可选的
    SAS/ACCESS 引擎）的数据都可以加载到非分布式 LASR Analytic Server 中。


    在与非分布式 LASR Analytic Server 一工作时，数据总是串行加载的，因为数据在两个地方流经单点：


    - LASR Analytic Server 本身是一个单一实体。

    - Workspace server 是一个单一实体，充当传输数据到 LASR Analytic Server 的桥梁。


    ### 理解分布式部署


    分布式 LASR Analytic Server 并不是运行在一台服务器主机上，而是分部署在多台机器上。在分布式部署中，LASR 提供的所有内存分析功能与非分布式部署中提供的功能相同。现在的区别是数据分布在多个主机的内存中——这有效地将一个大问题分解成可以同时处理的小问题。这就是为什么分布式
    LASR Analytic Server 如此快速的原因。下图显示了分布式环境是如何设置的。


    图 8.2 SAS Visual Analytics 分布式部署


    ![](img/5642b5eb9_15_1.png)


    与 SAS Visual Analytics 的非分布式部署一样，许多软件组件可以留在单台服务器上或跨越多台机器。区别在于 LASR Analytic Server
    现在托管在至少四台机器上，跨越根节点和多个工作节点。LASR 根节点控制 LASR 工作节点的操作。LASR 工作节点存储加载到 RAM 中的数据，并且每个节点都对其分得的那部分数据执行操作。


    在与分布式 LASR Analytic Server 一工作时，数据可以串行或并行加载。我们可以使用 Workspace Server 使用与上文用于非分布式
    LASR 相同的技术将数据串行加载到分布式 LASR Analytic Server 中。在串行加载时，数据仅发送到 LASR 根节点，然后由它将数据分给每个
    LASR 工作节点。但分布式 LASR Analytic Server 也可以从支持的源并行加载数据。并行加载的数据直接从源发送到每个 LASR 工作节点，而
    LASR 根节点负责协调和跟踪活动。加载时的实际数据分布由源处理。


    ### 从 HDFS 加载数据到 LASR


    分布式 LASR Analytic Server 可以直接从 Hadoop 文件系统 (HDFS) 加载数据。这仅适用于特定数据类型以及 LASR 服务与
    HDFS 对称部署的环境。


    图 8.3 LASR 与 HDFS 对称部署


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_15_2.png)


    当 LASR Analytic Server 以这种配置部署时，它可以直接加载托管在 HDFS 中的数据。数据必须以 CSV（逗号分隔值）格式的文本文件存储，或者来自
    SASHDAT 文件。SASHDAT 是将数据加载到 LASR 最快且最有效的方法。


    ### 支持 SASHDAT 文件


    SASHDAT 是事情变得有趣的地方。让我们看看这种文件格式的一些事实：


    - “H”与其说是为了 Hadoop，不如说是为了高性能——它是针对分析和并发处理优化的。

    - SASHDAT 的元数据（标签、编码、分区等）针对每个 HDFS 文件块经过仔细管理。

    - SASHDAT 显式避免了碎片（这是 HDFS 存储数据的常见挑战）。

    - SASHDAT 文件格式是二进制的、可压缩的（SAS 9.4）、可加密的（SAS 9.4），并与旧版本软件兼容。

    - 因为 SASHDAT 文件格式是为了在 Hadoop 等大规模并行处理 (MPP) 环境下开发的，它为向 LASR Analytic Server 加载大量数据提供了最快的方法。


    为了让 SASHDAT 工作需要满足一些架构要求：


    - 我们必须以分布式模式运行 LASR，即 LASR Analytic Server 同时部署在多台机器上。我们把此称为大规模并行处理 (MPP)，因为它提供了大幅扩展
    LASR 处理能力的方法。

    - 分布式模式 LASR 是由 SAS 高性能环境提供的——假设也许可了相应的软件。

    - 我们需要使用 Hadoop 文件系统 (HDFS)。HDFS 是大多数 Hadoop 技术的基础。与分布式 LASR 一样，HDFS 同样在多台机器上同时部署。HDFS
    能够利用这种环境来实现可扩展性并提高可用性。

    - 最后，分布式 LASR 必须与 HDFS 对称部署。“同位置”意味着两个解决方案必须部署在同一组机器上。LASR 根节点（作为 LASR 的“boss”）必须与
    HDFS 节点（作为 HDFS 的“boss”）位于同一主机上，且 LASR 工作节点必须放置在 HDFS 数据节点旁边。


    如果不满足这些要求，则无法使用 SASHDAT 文件格式。值得注意的是，如果我们使用的是单机版 (SMP) LASR，或者 HDFS 位于不同的主机集合中，或者我们根本没有
    HDFS。


    ### 规则的例外


    SASHDAT 要求的一个例外是 MapR 版 Hadoop。MapR 自带有一个名为 MapR-FS 的源文件系统。


    图 8.4 远程的 MapR 集群也可以托管 SASHDAT 文件


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_15_3.png)


    当涉及 SASHDAT 时，SAS 研发团队设计了一种方法，利用 MapR-FS 将 SASHDAT 文件放入 MapR-FS 中。最终，这意味着 LASR
    可以通过 MapR-FS 读写 SASHDAT 文件，因此不需要同位置部署。当你使用任何挂载在 CAS 工作节点上的分布式文件系统时，请寻找类似的功能。


    ### SASHDAT 不需要 SAS/ACCESS


    让我们简单澄清一下使用 SASHDAT 不需要具备什么：SAS/ACCESS for Hadoop 软件。SAS/ACCESS 不提供任何 SASHDAT
    功能。分布式 LASR 完全具备在不使用 SAS/ACCESS 的情况下在 HDFS 中实现 SASHDAT 的能力。SAS/ACCESS for Hadoop
    当然是强大且灵活的软件，为处理原生 Hadoop 许多可能。虽然它不直接负责创建 SASHDAT 表，但在处理 Hive 表、Pig 和 Map Reduce
    作业以及创建 SASHDAT 表方面非常有用。


    ### 从 Base SAS 加载数据到 LASR


    我们可以使用 Base SAS 以及构建在其上的服务（如 Workspace Server 和 SAS Process）将数据传输到 LASR（或 HDFS
    中的 SASHDAT 表）。Base SAS 可以访问的任何数据源都可以作为企业数据管理的一部分馈给 LASR。Base SAS 可通过 LASR 加载的数据源示例包括：


    - Base SAS 数据集

    - SAS 可扩展性能数据引擎 (SPD Engine) 表

    - 原始文本文件

    - 以及更多


    Base SAS 可访问的任何源（带有可选的 SAS/ACCESS 引擎）都可以加载到 LASR。图 8.5 Base SAS 可用的默认数据源


    ![](img/5_15_4.png)


    如果你的站点许可了额外的 SAS 软件，那么也可以使用这些产品，例如：


    - SAS/ACCESS 软件：提供了 SAS 直接与第三方数据提供通信的能力。为 Oracle、DB2、Aster、Hadoop 等提供者提供了特定产品。

    - SAS 可扩展性能数据服务器 (SPD Server) 表


    图 8.6 安装可选 SAS 软件后可用的额外数据源


    ![](img/562b5eb9_15_5.png)


    可以使用 PROC LASR 或 SAS 引擎将数据从源直接加载到 LASR 内存。一旦数据进入 LASR 内存，可以将其从 RAM 中删除（稍后从源重新加载），或者由
    LASR 以 CSV 格式或 SASHDAT 格式保存到磁盘。SAS 还提供了 SAS 引擎来简化将数据直接保存为 SASHDAT 格式的过程。关于 SASHDAT
    引擎有几个重要的点需要记住：


    1. 负责实际向 HDFS 读写 SASHDAT 内容的是 LASR而不是 SAS。

    2. SASHDAT 引擎是单向的。数据可以从 SAS（通过 LASR）写入 SASHDAT 文件，但无法通过相同的 libref 直接将该数据读回 SAS。SASHDAT
    的意图是充当...


    ### 从 Base SAS 加载数据到 LASR


    我们可以使用 Base SAS 以及构建在其上的服务（如 Workspace Server 和 SAS 过程）将数据传输到 LASR（或 HDFS 中的 SASHDAT
    表）。Base SAS 可以访问的几乎任何数据源都可以作为企业数据管理处理的一部分馈给 LASR。Base SAS 可通过 LASR 加载的数据源示例包括：


    - Base SAS 数据集

    - SAS 可扩展性能数据引擎表

    - 原始文本文件

    - 以及更多


    Base SAS 可访问的任何源（带有可选的 SAS/ACCESS 引擎）都可以加载到 LASR。图 8.5 Base SAS 可用的默认数据源


    ![](img/5_15_4.png)


