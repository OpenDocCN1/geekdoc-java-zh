    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_0.png) ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_1.png)
    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_0.png) ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_3.png)
    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_0.png) ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_0.png)
    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_6.png) ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_0.png)
    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_8.png) ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_0.png)


    **chapter six**


    the where of data


    Traditional business intelligence systems have focused on answering the *who,*


    *what*, and *when* questions, but organizations often need to know the *where*
    of


    data as well. Businesses want to plan sales territories based on existing


    customers. School districts want to understand where students live in relation


    to the school. Companies want to know whether equipment failures are


    related to specific locations. All of these issues are related to the *where*
    of the


    data.


    SAS Visual Analytics makes it easy to plot geospatial data, which can add a


    completely new element to your data visualizations and analysis. In a tabular


    report, multiple columns might represent customers, competitors, and


    demographic information. The tabular report might not reveal anything useful.


    But if you can geocode the data and overlay it on a map, you quickly see


    where the better customers are, where they are in relation to competitors, and


    the regions that provide the most market potential based on underlying


    demographics.


    SAS Visual Analytics geo mapping capabilities are based on integration with


    two mapping technologies: OpenStreetMap and ESRI ArcGIS. The examples


    in this chapter use OpenStreetMap with SAS Visual Analytics 7.3 unless


    otherwise noted. In this chapter, you will learn how to create geographic data


    items and geospatial objects.


    USING GEOSPATIAL DATA EFFECTIVELY


    SAS Visual Analytics makes plotting geospatial data effortless. This is


    exciting! It is very easy to just use geospatial data objects for everything.


    Before traveling that path, though, consider if you really have a location-based


    data story. You want to use geospatial objects thoughtfully. In this topic, we


    will discuss an ineffective and an effective use of location analysis.


    When location is not part of the data story


    In her book, *The Wall Street Guide to Information Graphics*, Dona Wong


    suggests that there are times when geography is not part of the story, so it


    doesn’t make sense to force it to be. In her example, she shows two sales


    regions where sales were higher in one. In the following figure, the example


    was re-created using Australian states.


    Figure 6.1 Location is not part of this data story


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_10.png)


    Because the regions are so disproportionate in size, comparing the sales


    revenue is not helpful. It does not lead to any conclusion except that Western


    Australia generated more revenue than Victoria. Your viewer does not have


    any useful takeaway, because the conclusion might be expected. It doesn’t


    seem relevant to a data story in which the focus was really sales revenue.


    With only two values to display, would a list table or even a pie chart have


    been a better data visualization choice? The point of this example is to


    understand that even if you can show a cool geo object, you should ask


    yourself if it makes sense for your data story.


    When location is the data story


    Europe is an international business center and a leading tourist destination.
    If


    you want to tell a data story about how popular a location it is, you could start


    by exploring the airport traffic. The Anna Aero website


    (http://www.anna.aero) contains data that details trends from most of the


    world’s airports. You can use the airport codes and passenger counts to start
    a


    data story about the most and least popular cities.


    In the following figure, the location of each airport is shown along with the


    passenger count and the difference from the previous year. In this example,


    location enhances the story. Instead of fancy calculations, the viewer can


    simply use their eyes to search for patterns.


    Figure 6.2 Location matters in this story


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_11.png)


    There are multiple observations. You might notice the darker circles that show


    increased passenger counts. Perhaps you notice where there are multiple


    airports within a close radius, and you are curious why one has a higher


    passenger count. When used effectively, geospatial data can reveal previously


    unknown patterns or assist with confirming suspicions.


    PREPARING DATA FOR GEOSPATIAL


    VISUALIZATIONS


    Before creating a geospatial visualization, you must have a geographic data


    item. If a data item contains a location, such as a country or state, then it
    is


    considered a geographic data item. Common location examples are customer


    addresses, store locations, or sales regions. You can use the SAS predefined


    geographic data elements or create custom geographic data items. This topic


    describes how to create each type.


    Creating a predefined geographic data item


    To keep things easy, SAS Visual Analytics has predefined geographic data


    elements ranging from general values such as country names, to specific


    values such as ISO country codes. If your geographic data item contains a


    country name, then it can be matched to an internal table so that the location


    can be plotted on a map. Starting with SAS Visual Analytics 7.1, geographic


    data items can be country name, ISO 2-Letter codes, ISO Numeric Codes, or


    SAS Map ID values. You select the predefined method when you create the


    geographic data item.


    These geographic data elements represent the center of the area. If you are


    showing France, it can be shown with a country outline or at the center of the


    country. The following table contains the available predefined geographical


    data elements provided by default and examples of how the incoming data


    items are expected to appear. The table shows the data values expected from


    three countries.


    **Geographic**


    **data element**


    **Examples**


    **from**


    **Australia**


    **Examples**


    **from the**


    **Netherlands**


    **Examples from**


    **the United**


    **States**


    Country or Region


    Name


    Australia


    Netherlands


    United States


    Country or Region


    ISO 2-Letter


    Codes


    AU


    NL


    US


    Country or Region


    ISO Numeric


