    ## chapter six: the where of data


    Traditional business intelligence systems have focused on answering the *who,*
    *what*, and *when* questions, but organizations often need to know the *where*
    of data as well. Businesses want to plan sales territories based on existing customers.
    School districts want to understand where students live in relation to the school.
    Companies want to know whether equipment failures are related to specific locations.
    All of these issues are related to the *where* of the data.


    SAS Visual Analytics makes it easy to plot geospatial data, which can add a completely
    new element to your data visualizations and analysis. In a tabular report, multiple
    columns might represent customers, competitors, and demographic information. The
    tabular report might not reveal anything useful. But if you can geocode the data
    and overlay it on a map, you quickly see where the better customers are, where
    they are in relation to competitors, and the regions that provide the most market
    potential based on underlying demographics.


    SAS Visual Analytics geo mapping capabilities are based on integration with two
    mapping technologies: OpenStreetMap and ESRI ArcGIS. The examples in this chapter
    use OpenStreetMap with SAS Visual Analytics 7.3 unless otherwise noted. In this
    chapter, you will learn how to create geographic data items and geospatial objects.


    ### USING GEOSPATIAL DATA EFFECTIVELY


    SAS Visual Analytics makes plotting geospatial data effortless. This is exciting!
    It is very easy to just use geospatial data objects for everything. Before traveling
    that path, though, consider if you really have a location-based data story. You
    want to use geospatial objects thoughtfully. In this topic, we will discuss an
    ineffective and an effective use of location analysis.


    #### When location is not part of the data story


    In her book, *The Wall Street Guide to Information Graphics*, Dona Wong suggests
    that there are times when geography is not part of the story, so it doesn’t make
    sense to force it to be. In her example, she shows two sales regions where sales
    were higher in one. In the following figure, the example was re-created using
    Australian states.


    Figure 6.1 Location is not part of this data story


    Because the regions are so disproportionate in size, comparing the sales revenue
    is not helpful. It does not lead to any conclusion except that Western Australia
    generated more revenue than Victoria. Your viewer does not have any useful takeaway,
    because the conclusion might be expected. It doesn’t seem relevant to a data story
    in which the focus was really sales revenue.


    With only two values to display, would a list table or even a pie chart have been
    a better data visualization choice? The point of this example is to understand
    that even if you can show a cool geo object, you should ask yourself if it makes
    sense for your data story.


    #### When location is the data story


    Europe is an international business center and a leading destination. If you want
    to tell a data story about how popular a location is, you could start by exploring
    airport traffic. The Anna Aero website (http://www.annaero) contains data that
    details trends from most of the world’s airports. You can use the airport codes
    and passenger counts to start a data story about the most and least popular cities.


    In the following figure, the location of each airport is shown along with passenger
    count and the difference from the previous year. In this example, location enhances
    the story. Instead of fancy calculations, the viewer can simply use their eyes
    to search for patterns.


    Figure 6.2 Location matters in this story


    Multiple observations. You might notice the darker circles that show increased
    passenger counts. Perhaps you notice there are are airports within a close radius,
    and you are curious why one has a higher passenger count. When used effectively,
    geospatial data can reveal previously unknown patterns or assist with suspicions.


    ### PREPARING DATA FOR GEOSPATIAL VISUALIZATIONS


    Before creating a geospatial visualization, you must have a geographic item. If
    a data item contains a location, such as a country or state, then it is considered
    a geographic item. Common location examples are addresses, store locations, or
    sales regions. You can use SAS predefined geographic elements or create custom
    data items. This topic describes how to create each type.


    #### Creating a predefined geographic item


    To keep things easy, SAS Visual Analytics has predefined geographic elements ranging
    from general values such as country names to specific values such as ISO codes.
    If your geographic data item contains a country name, then it can be matched to
    an internal table so that the location can be plotted on a map. Starting with
    SAS Visual Analytics 7.1, geographic items can be country name, ISO 2-Letter codes,
    ISO Numeric Codes, or SAS Map ID values. You select the predefined method when
    you create geographic data item. These geographic data elements represent the
    center of the area. If you are showing France, it can be shown with a country
    outline or at the center of the country. The following table contains the available
    predefined geographical elements provided by default and examples of how the incoming
    data items are expected to appear. The table shows the data values expected from
    three countries.


    | Geographic data element examples from Australia | Geographic data element examples
    from the Netherlands | Geographic data element examples from the United States
    |

    | :--- | :--- | :--- |

    | Country or Region Name | Country or Region Name | Country or Region Name |

    | ISO 2-Letter Codes | ISO 2-Letter Codes | ISO 2-Letter Codes |

    | ISO Numeric Codes | ISO Numeric Codes | ISO Numeric Codes |

    | SAS Map ID Values | SAS Map ID Values | SAS Map ID Values |

    | Subdivision (State, Province Names) | Subdivision (State, Province) | Subdivision
    (State, Province) |

    | | |


    On the SAS Support site, there is a Geographic Lookup Values for SAS Visual Analytics
    (at http://support.sas.com/rnd/datavisualization/vageo/71/VA71LookupValues.html).
    This page contains a list of these values to help you understand your specific
    location. The tables at this site list the countries and the associated ISO numeric
    codes.


    SAS Visual Analytics uses internal tables in the MAPSGK library that is shipped
    with the product. You can review the tables in this library to ensure that your
    data matches the expected name by using an application such as SAS Studio. For
    additional assistance in creating geo data, you can use the GEOCODE procedure
    that is available with the SAS/GRAPH software.


    What is an ISO code? There is an international standard called ISO 3166 published
    by the International Organization for Standardization. This standard applies numeric
    values to countries and regions that everyone can use. There are several advantages
    to using numeric references, particularly in the data world. If a programmer is
    using a non-Latin based language, such as Chinese or Hebrew, the number makes
    it easy to look up values. Also, when new countries form, a new number can be
    assigned while maintaining the older number for historical purposes.


    #### Creating a geographic data item


    After importing data into SAS Visual Analytics, you must assign the data item
    to a Geography role before it can be used with any of the geo objects. You can
    create a geographic data item from an existing character or numeric data item.
    To create a geographic data item:


    1. Right-click the data item that contains the geographic element that matches
    the predefined role. In this example, the Country data item contains the country
    names, such as Australia or Brazil.

    2. **Note:** Some users prefer to duplicate the data item before assigning it
    to this role.

    3. Select Geography ▶ Country or Region Names. Your data item is moved under the
    Geography section. You can use it with geographic roles.

    4. Choose a geographic role.


    Dealing with location accuracy


    If SAS Visual Analytics cannot plot your data item, you might need to convert
    a country’s common name to its official name. For example, Russia, United States
    of America, and Great Britain could be in your data set, but SAS Visual Analytics
    cannot plot them. When you search the country names in the MAPSGK data set, you
    learn that these countries use different IDs. Often it is easier to convert the
    values to the ISO code than using names.


    #### Creating a geospatial data item


    All geospatial data items represent a location on the planet Earth. A specific
    point or address has a set of coordinates which are called latitude and longitude.
    You might recall from elementary school when the globe was divided by imaginary
    parallel lines from north to south (called latitude) and from east to west (called
    longitude). When you provide a location’s latitude and longitude, you are referencing
    these lines. If you think about the world’s airports, it’s possible to describe
    the geospatial location with just latitude and longitude. In the following figure,
    the airports are highlighted on the map, and the table on left shows the airport
    name with its coordinates. Notice that the latitude numbers are similar because
    these airports are in a similar European location. There is some variation in
    the longitude as the airport is further south. Compare the Charles De Gaulle (Paris,
    France) coordinates to the Dublin (Ireland) coordinates to better understand the
    values.


    Figure 6.4 Airports with latitude and longitude


    Creating a custom geographic data item


    To create a custom geographic item, you must have the latitude and longitude coordinates
    available in the data set. The coordinates can be based on World Geodetic System
    (WGS84), Web Mercator, and the British National Grid (OSGB36). The default is
    World Geodetic System (WGS84).


    What is a coordinate system? There are three coordinate systems available for
    custom data points. These standards were developed for diverse purposes but are
    now commonly used:


    - WGS84 was developed by the United States military for satellite positioning
    systems.

    - Web Mercator is a web standard. It was first used with Google Maps.

    - OSGB36 is a British-developed system that is heavily used in British-based maps.


    You should choose the system that works best for your specific location or geo
    data. In most cases the WGS84 system works. Let’s use the airport coordinates
    as the basis for the new geographic item. We use the airport name to create this
    data item, but other data items such as Airport Code would also work.


    To create a custom geography data item:


    1. Duplicate the Airport data item and name the new item Airport Name.

    2. Right-click the new data item, and then select **Geography ▶ Custom**. A Geography
    window appears.

    3. Select your data items for latitude and longitude in the appropriate fields.
    Your new data item appears in the Geography area.


    Figure 6.5 Adding a custom data point


    Finding geo coordinates


    If your data set does not have the geo coordinates available, you can get them
    through several sources:


    - The SAS MAPSGK library contains multiple countries and regions.

    - There are open-source databases available that you can find with a web search.

    - Google has an API that you can query through code. The free service has a daily
    access limit, but you can subscribe to their service or other commercial services.


    ### DISPLAYING GEOSPATIAL OBJECTS


    There are three ways to display geo data in SAS Visual Analytics:


    - **Coordinate** – Pinpoints an exact location on the map using a custom geographical
    item.

    - **Regional** – Outlines a regional area.

    - **Bubble** – Combines a bubble plot to show a value at the location


    These objects enable you to highlight your geospatial data in different ways and
    for different stories. Let’s explore the different ways that these data objects
    are used.


    For the remaining topics in this chapter, the examples are created using the storm
    events data set from the United States National Climatic Data Center website.
    This database contains US storm events (such as tornadoes and thunderstorms) since
    1950. The data set contains other facts such as the number of deaths or injuries
    and the estimated property damage. The tornadoes are rated by their intensity
    on the Fujita scale from F0 to F5. In 2007, Enhanced Fujita scale was introduced
    and tornadoes were categorized as EF0-EF5.


    Perhaps you’ve heard people talk about tornado alley—it’s an area down the middle
    of the United States where tornadoes occur frequently. Tornadoes are powerful
    storms that produce wind speeds capable of sending wood through a board. Geo maps
    are excellent at showing exactly where an event occurred. In the following figure,
    the teal markers indicate where tornadoes with EF5/F5 strength of 230 mph (370
    kph) winds arose in the past 50 years.


    Figure 6.6 F5/EF5 locations


    To make this geo object a little more interesting, let’s add EF4/F4 tornado points
    for the same time period. By contrasting the teal and gold markers, the viewer
    sees that EF5/F5 tornado is less common. While the data points are chaotic, it’s
    clear where severe tornadoes occurred. This data would not have the same impression
    if we had plotted it as line chart or even a pie chart. The touchdown points help
    you realize those particular states have a higher disaster budget.


    Tip 1: Dealing with odd locations


    This data object uses a custom geography item that is based on latitude and longitude
    values. If the coordinates are incorrect, then the map might show your data in
    the middle of the ocean. In our sample data, some of the coordinates were entered
    incorrectly. This resulted in tornadoes appearing in the Atlantic Ocean. To correct
    this situation, the latitude and longitude values in the data set would have to
    be edited or filtered.


    Figure 6.7 Tornadoes in the ocean


    Tip 2: Controlling the data


    When you have too much data to display, SAS Visual Analytics issues a yellow icon
    and warns you to add some filters to your data. With custom geographic items,
    it is more likely to happen. The solution is to control how much data appears
    at once by setting filters.


    Figure 6.8 There is too much data at one time! Here are a few suggested filters:


    - Add a date range slider to compare events along a time scale. Adding Year to
    the slider enables the user to compare which years might have had more storm seasons.

    - Split the data item categories. Use the display rules to assign the tornado
    scale to a different color so that each level is clearer. Then add a List filter
    and assign the Tornado F/EF Scale to the list. Users can select which tornado
    scale they want to compare.Figure 6.9 Add filters to keep data visualization manageable


    Compare area with geo regional data objects


    Use the geo regional data object when you need to introduce a subject about location.
    This geospatial object helps a viewer understand where to focus their attention
    or understand how much variation occurs for a value. These objects are also called
    *choropleth* maps, which is Greek for multitude of areas.


    When you start thinking about dangerous storm events, you can imagine that these
    events cause considerable property damage. States more prone to severe tornadoes
    will plan larger recovery budgets. It would be interesting to compare the damage
    costs by state. Using a geo regional map, you can place a value over an entire
    region, such as a country or a state. Color is then applied over the regions to
    indicate the intensity of the value.


    Figure 6.10 Understanding regional events


    In the preceding figure, you can see the associated property damage cost for the
    tornadoes across the areas. The darker the color, the costlier the storm damage.
    Use an average or percentage to make the values comparable or normalized. By exploring
    the visualization, you can easily see the areas of most damage, but it’s harder
    to understand where there is the least damage. Be sure to use a legend so that
    the user understands the color range. When you position your pointer over each
    state, a data tip appears that contains the assigned data items values. Since
    Ohio and Kansas are similar in color, viewers might be interested to learn more.
    Most of Kansas is farmland and rural areas, while Ohio is more densely populated
    and industrial. Being in tornado alley, Kansas probably experiences more tornadoes
    and thus more crop damage. With the larger population, it might be costlier for
    Ohio when there is an extreme storm event.


    Tip 1: Improving your geo regional map


    There are a few settings that can make a geo regional object a nicer experience:


    - Add data tips to provide more information when the user positions over content.
    You can add as many as you like, but make sure that the data items enhance instead
    of confuse the viewer. For the preceding example, we added Event Count as a data
    tip.

    - Adjust the transparency for the overlay so that the user can see underlying
    values. If the underlying values are masked, it might cause confusion. For this
    visualization, the transparency was adjusted to 25%. It was just enough to maintain
    the color while allowing the underlying value to peek through.

    - Adjust the gradient color to ensure enough contrast. The ocean is a light blue,
    so a contrasting color that does not appear similar to the landscape is required.
    In Figure 6.9, a single color for the gradient is used. It is easier to decode
    a value when the color intensity increases as the value.


    Choose lighter colors


    In *Envisioning Information*, Edward Tufte has a fascinating discussion of color
    with maps. His suggestion is to use colors that are found in nature. He encourages
    using a color palette on the lighter side and provides several examples.


    Tip 2: Adding rich details


    The geo region data object is excellent for getting the user to focus on specific
    areas. It leads to more questions about the storm events, so it might be convenient
    to use an info window to provide details. This info window shows the storms by
    duration with estimated damage. A quick storm can result as much damage as a longer
    one, although this depends on where the tornado touches down.Figure 6.11 Use a
    pop-up window to provide more details Adding an info window to your map


    Info windows are pages that you can link to another page. Use the following steps
    to add an information window to your map:


    1. Create a tab. In this example, the geo regional map was created.

    2. Create another tab with the data objects of your choice. For this example,
    a bar-line data object was used to show the event duration and estimated property
    damage.

    3. Select the down arrow next to the title and select **Display as Info Window**.

    4. Return to the page that you created in step 1. Right-click on the map, and
    then select Link > Info Window. In the window that appears, select which info
    window you want.


    Once you turn the tab into an info window, it does not appear to the viewer. You
    can use an info window in other situations to provide information about the tab.


    Show overall trends with bubble plots data objects


    Bubble plots receive a lot criticism for being difficult to understand. These
    charts can pack a lot of data into a few variables. A layperson might spend more
    time trying to understand a bubble plot, but this doesn’t seem true for the geo
    bubble maps. Possibly its because the user sees the map and understands that it
    is related to location.


    In the previous topic, we created a geo regional map to show the average damage
    cost from F5 tornadoes for each state. One issue with the method was that users
    had to position the pointer over each state to see how many storm events were
    associated with each event. If a user wants details, it is a little awkward. A
    geo bubble map resolves this issue.


    A geo bubble plot places a bubble on the geographic location and enables you to
    control two aspects of the bubble: its size and color. In the following example,
    the bubble size is the event count (the number of tornadoes) while the color shows
    the estimated property damages (shown with the scale). Now it is more apparent
    that Kansas endured a similar number of events as Mississippi, but the price tag
    was a little larger. However, it also shows that Ohio had a similar cost but fewer
    events than Kansas.


    Tip 1: Ensure that the legend is visible


    When you use bubbles to encode data, you are asking the user to compare the bubble
    size and the bubble color. The legend ensures that the user has some visual cues
    to assist with understanding. You can place the legend anywhere around the object.
    In the preceding example, the legend is placed on the right.


    Tip 2: Watch the default colors


    By default, the geo bubble object uses a gradient scale of red to blue. This scale
    is acceptable when working with performance data and is commonly referred to as
    trafficlighting. The color mimics the traffic signals where red means stop and
    green means go. However, we have a logic problem in instance. The red indicates
    the least amount of damage and blue indicates the most. Technically, any property
    damage is bad (After all, we are not measuring how well the tornado was damaging!).
    The gradient scale was changed to teal in our chart. The bubbles are not as close
    to the ocean and provide enough contrast. However, notice the bubble over is barely
    visible. The bubbles were set to 30% transparency to make the state names visible.


    EXPANDING LOCATION INTELLIGENCE Starting with SAS Visual Analytics 8.1, users
    have unlimited access to base maps within SAS Visual Analytics. This provides
    search functionality and ad hoc selection of data points on a map. Here is an
    example where the user was looking for close Los Angeles, CA customers to the
    retail chain. For users who want additional functionality, they can subscribe
    to the ESRI premium features. The premium service offers time analysis and the
    ability to create custom shapes.


    UNDERSTANDING DETAILS ABOUT MAPPING TECHNOLOGIES SAS Visual Analytics geo mapping
    capabilities are based on integration with two mapping technologies: OpenStreetMap
    and ESRI ArcGIS. Analytics enables its users to view their data mapped across
    various locations. OpenStreetMap: This is an open-source project where a worldwide
    community maintains data about roads, boundaries, and more.


    ESRI Maps: This advanced mapping platform uses highly interactive and informative
    maps. The maps are maintained by ESRI, a SAS partner. The SAS Visual Analytics
    environment must be configured to point to one of these mapping technologies.
    An OpenStreetMap server is hosted by SAS and is available as part of the default
    configuration. Organizations might want to host and maintain their own OpenStreetMap
    server. Organizations can also use the ESRI server (ArcGIS for Server, version
    10.1 or higher) for access maps. Refer to the *SAS Visual Analytics: Administration
    Guide* for your release for more details.


    REFERENCES Aanderud, Tricia. 2016. "Where in the World is SAS Visual Analytics?"
    Available at https://www.zencos.com/blog/geoplot-in-sas-analytics/. Massengill,
    Darrell. 2016. "The GEOCODE Procedure and SAS Visual Analytics." *Proceedings
    of the SAS Global Forum 2016*. Paper SAS3480-2016. Cary, NC: SAS Institute Inc.
    Available at http://support.sas.com/resources/papers/proceedings16/SAS3480-2016.pdf.
    Nori, Murali, and Himesh Patel. 2016. "Location, Location, Location—Analytics
    with SAS Visual Analytics and ESRI." *Proceedings of the SAS Global Forum 2016*.
    Paper SAS4060-2016. Cary, NC: SAS Institute Inc. Available at http://support.sas.com/resources/papers/proceedings16/SAS4060-2016.pdf.
    Schulz, Falko, and Anand Chitale. 2014. "More Than a Map: Location Intelligence
    with SAS Visual Analytics." *Proceedings of the SAS Global Forum 2014*. Paper
    SAS021-2014. Cary, NC: SAS Institute Inc. Available at http://support.sas.com/resources/papers/proceedings14/SAS021-2014.pdf.
    Tufte, Edward R. 1990. *Envisioning Information*. Cheshire, CT: Graphics Press.
    US NOAA Data. Storm Events Database. Accessed 2016. See https://www.ncdc.noaa.gov/stormevents/.
    Wong, Dona M. 2013. *The Wall Street Journal Guide to Information Graphics: the
    Dos and Don’ts of Presenting Data, Facts, and Figures*. New York, NY: W. W. Norton
    & Company, Inc.


