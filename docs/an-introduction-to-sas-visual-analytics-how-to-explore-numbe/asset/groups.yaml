    # accessing content


    AWS Video Analytics allows you to call any video function synchronously or asynchronously.
    When you call a function, it returns a de-serialized object that you can then
    use to access the content of the video. For example, when you call a video function,
    you need to pass the content to it and de-serialize it.


    This starts with unmarshalling the content and deserialize it. You get the content
    through the various functions of the SDK.


    # METHODS OF ACCESSING CONTENT


    When you access content through AWS Video Analytics, you can use one of two methods.
    Each method has its advantages depending on your use case.


    # Accessing content via a buffer


    When you access content via a buffer, AWS Video Analytics returns a buffer containing
    the video content. This method is useful when you want to process the video content
    yourself using other libraries.


    # Accessing content through an object


    When you access content through an object, AWS Video Analytics returns an object
    containing the video content. This method is useful when you want to use the built-in
    functions and services provided by AWS Video Analytics.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_6_0.png)


    You can use this method when you want to use AWS Video Analytics functions directly.
    This method is also useful when you don''t want to process the video content yourself.


    # Accessing content via the media url


    When you access content via a media url, AWS Video Analytics returns the media
    URL of the video content. This method is useful when you want to stream the video
    content using other players.


    There are also other methods to access content when the video file is stored in
    Amazon S3. In this case, you can use a pre-signed URL.


    # Understanding roles


    To use AWS Video Analytics, you need to create an IAM role. This role gives AWS
    Video Analytics permission to access the AWS resources it needs.


    # UNDERSTANDING ROLES


    To use AWS Video Analytics, you need to create an IAM role. This role gives AWS
    Video Analytics permission to access the AWS resources it needs.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_6_1.png)


    When you create an IAM role, you define a trust policy. This policy defines which
    entities are allowed to assume the role.


    # Creating a collection


    To create a collection, you can use the AWS Video Analytics console. A collection
    is a group of videos that are related together.


    +   1. Log in to the AWS Video Analytics console.

    2. Select Collections from the left menu.

    3. Click the Create collection button.

    4. Give your collection a name and click Create.


    Once the collection is created, you can add videos to it.


    # Viewing the results'
