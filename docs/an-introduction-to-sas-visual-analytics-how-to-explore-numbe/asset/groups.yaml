    \n### ### 管理用户和组\n\n用户 页面允许管理用户和组。一大改进是用户和组设置在 SAS 和 CAS 环境之间同步。SAS Environment\
    \ Management 使用 SAS 数据库服务存储这些设置。\n\n您可以为应用程序创建自定义组。SAS 环境中不存在的自定义将在 CAS 环境中可用。\n\
    \n### ### 管理库\n\nLibraries 页面允许管理 SAS 库和 CAS 库。每个 CAS 在 SAS 中可以有多个库。下图显示了库。\n\n\
    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_19_2.png)\n\n每个页面都提供了库的不同视图：\n\n| Libraries\
    \ | 加载到 SAS 系统的库的详细视图。 |\n|---|---|\n| Libraries | SAS 库和加载的数据。 |\n\nLibraries\
    \ 页面显示了加载到 SAS 和 CAS 中的所有库。每个库都有名称、位置和表数量。\n\n### ### 管理环境\n\n您可以使用内容选项卡为目录创建目录结构。SAS\
    \ 在 SAS Visual Details 中显示报告和状态表。\n\n"
