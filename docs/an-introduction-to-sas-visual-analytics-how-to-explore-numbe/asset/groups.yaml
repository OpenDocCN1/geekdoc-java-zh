    ## chapter twelve

    ## wrangling your data


    SAS has always been known for its ease of data preparation. Starting with the
    DATA step, gathering and altering your data has been a simple process. With the
    SAS Visual Data Builder 8.1, SAS has taken those principles and given them a fresh
    interface with some updated techniques.


    In SAS Visual Data Builder 7.3, the interface and query building were focused
    around how the programming language, SQL, works. That made it easy for anyone
    with an SQL background to understand. But the whole SAS Visual Analytics application
    is also meant for non-technical users. So with the new development, SAS switched
    gears and focused on ease of use as priority number one.


    In this section of the chapter, we are going to explore SAS Visual Data Builder
    8.1 and the differences from SAS Visual Data Builder 7.3 that you need to know.
    We lead you through the new, modern user interface. There are now more options
    for joining tables and transforming columns. Also, working with the new platform
    has changed how you develop and execute changes on the new data sets.


    ### Introducing a modern user interface


    With the updated look, the process of loading data has changed as well. One of
    the first things that you’ll notice when heading to the data builder is that you
    are greeted with a welcome window. This window lets you decide between opening
    up a data source, creating a new plan, or opening an existing plan. Plans are
    similar to queries and will be covered later in this chapter.


    Figure 12.1 SAS Visual Data Builder Welcome Mat


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_0.png)


    #### Importing data


    When you select the Data option in the welcome mat window, it brings you to the
    Open Data Source window. This window is very similar to the loading data feature
    in the Report Designer that was available in SAS Visual Analytics 7.3. In Chapter
    2, we reviewed the Report Designer. When you add data, you had the ability to
    import directly from local files, servers, and social media. In Report Designer
    8.1, that option is now available in the Data Builder as well. In the previous
    Data Builder, you could only access tables and libraries that were registered
    into metadata. Updated functionality also enables you to drag files from your
    desktop or folders right to the window.


    Figure 12.2 Open Data Source Window


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_1.png)


    The **All** tab shows you which data sets are available to you in the CAS server.
    The **Recent** tab lets you see any data sets that you have worked on recently,
    and the **Import** tab is where you can access data in other areas. The LASR option
    under Server lets you pull data from previously used versions of SAS Visual Analytics.


    #### Viewing the data


    Once you have selected your data source, you are brought to the application where
    your data appears on the screen. This is one of the more noticeable differences
    for users between versions. Instead of working with columns names and then previewing
    the data, you are now looking right at the data and can visualize the changes
    to the data as transformations are made.


    Figure 12.3 Open Data Source Window


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_2.png)


    In this view it is easy to structure how you want the output data set to look.
    You can remove and rename current columns by right-clicking on them.


    #### Profiling your data set


    Not only has the new Data Builder increased your data preparation ability, but
    it also gives you a new look regarding the details about your data. While looking
    at your data table, there has been a down-arrow in the top left corner that we
    haven’t explored yet. When you click that icon, you get metadata information as
    you can see in Figure 12.4.


    Figure 12.4 Table Profile


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_3.png)


    There is a **Table Profile** tab and **Column Profile** tab to choose from. On
    the **Table Profile** tab, you are given a small dashboard that tells you when
    the table was created and last saved as well as the number of columns and rows
    in your data set. This can be useful when validating when the data set was last
    changed or when checking how large a table might be. Click the **Column Profile**
    tab to go to another level of statistics about your data items.


    Figure 12.5 Column Profile


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_4.png)


    In order for the details to show up, there must be a column selected from your
    table at the bottom. For character data items, Frequency Distribution shows the
    number of times each unique value is in a row. Standard Metrics shows you the
    total number of Unique values. The Column Metrics and Advanced metric are used
    for numeric data items only and show various statistics about the data item such
    as what the maximum, minimum, and mean values are for the whole data item.


    In the top bar below the **Column Profile** tab, you can see that this is also
    the location where you can rename the data item (same process as if you right
    clicked the column name), change the data type, and change the format. It’s good
    practice to make sure that all of your data types and formats are set here that
    you don’t have to do any more data work in the report designer.


    #### Creating a new data item


    If you want to add a column, there is a calculator icon in the top toolbar on
    the right.


    Figure 12.6 Add Calculated Column


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_5.png)


    This window gives you all the tools to do calculations for new data items. The
    two tabs on the left let you access all of your current data items and operators
    that help you manipulate numeric, character, and date items. There’s also options
    in the top right where you can select what type and format the resulting data
    item is supposed to be. Once you are done, you can even use the **Preview** button
    at the bottom to make sure the column you just created is what you want. Clicking
    Accept button at the bottom adds the column to the dataset.


    #### Using in-memory joins


    This version of the data builder has made joining tables as simple as possible
    by making the join visual. Even if you do not completely understand the difference
    between inner, outer, left and right joins being able to see the columns and data
    gives you the understanding of what goes into the resulting table. To access Join
    window, click the icon in the top right that is grouped with Calculated Column
    icon.


    Figure 12.7 Join Tables


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_6.png)


    In Figure 12.7, we have brought in two tables. The columns from the first table
    are shown in the tabular view below. When you first open the join window, you
    will have your first table on the left and then **Select Table** button on the
    right. The Select Table option brings you to the open data window that you saw
    at the beginning of this chapter. In this window you can find other data sources.
    Notice how the tables are color-coded at the top. The data items we want to join
    are listed below the tables. When we click **Preview**, the color scheme from
    the tables is used to label each item to show you what your new table looks like
    and which table those data items are coming from.


    Figure 12.8 Preview a Join


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_7.png)


    The colors that outline the column names represent which data items come from
    each table. For the data items both tables have in common, the colors are split.
    This makes it very easy for a user to visualize how their data is coming together.
    There is also a button icon between the two tables that lets you select which
    type of join you want to use to combine the tables.


    #### Plans and tables


    Another aspect of the Data Builder that differs from that in SAS Visual Analytics
    7.3 is the concept of plans. In the earlier version, you created queries that
    brought in tables, joined and manipulated data items into a final data set and
    then sent that data set to a location. In the new version, plans are similar to
    queries except they are shown as a set of instructions.


    Figure 12.9 View Plan instructions


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_8.png)


    In Figure 12.9, you can see an example of a Plan. It contains instructions on
    joining tables that was done in the previous section as well as renaming a column.


    Figure 12.10 Saving a plan


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_9.png)


    At the top right corner of Figure 12.10, we have selected the icon that gives
    us our options to save. The difference between the plans and queries is that there
    is no running of the plan in order to get your data where it needs to be. Instead,
    you have the option to save a plan or save the table. Saving a plan is like saving
    a query; you are storing the steps needed to create your data set. This does not
    execute anything and you can easily pick up where you left off by just saving
    the plan. Saving the table is like running the query. All of your steps have already
    been accepted and executed on the table. Now, you are just moving the new table
    to a specific location.


    #### New features


    To go along with a brand new interface and process in constructing your datasets,
    SAS has also introduced some new features that give you more ways to prepare your
    data. These features include the following:


    - Transformations – Includes ways to manipulate data items using built-in SAS
    functions

    - Transposing tables – A way to reorganize tables based on certain data items

    - Filtering – Limits rows in the table by choosing values of data items to exclude


    #### Transformations


    A part of the new functionality is the ability to transform your data on the spot
    with all of your favorite SAS functions. By right-clicking any of the columns,
    you are given a drop-down list that enables you to perform different data manipulation
    functions on the spot.


    Figure 12.11 Data Manipulation Functions


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_10.png)


    On the drop-down list, you find the options to do a variety of things with the
    column. Along with the column properties that we covered in the last section,
    you can also rename the column. You can drop columns by clicking the **Remove**
    option. There is also an option to filter out values; this option takes you to
    a window with all the column values. Two of the more useful options are **Quick
    Split** and **Split**. When you click **Quick Split**, you get a result like you
    see in the figure below.


    Figure 12.12 Quick Split


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_11.png)


    The Quick Split option was used on the column. This gives us two new columns,
    LEFT_Split and RIGHT_Split, which have split the column after a space in the first
    value and a forward slash in the second value. The Quick Split option looks through
    your data for the first possible delimiter and splits your column from there.
    This however is not our desired result. We wanted the column split at only the
    forward slash, so now we can go into Split option instead.


    Figure 12.13 Split Column


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_12.png)


    Instead of the automatic split, now a window appears where we have multiple options
    to parse our character data. The options in the drop-down list are shown below:


    - On a delimiter

    - On fixed length

    - Before a delimiter

    - After a delimiter

    - On multiple delimiters


    These options give you a lot to work with when you need to get a certain character
    string of data item.


    #### Transposing tables


    The Transpose option on a column comes from PROC Transpose that can be used with
    the SAS programming language but is completely new to SAS Visual Analytics and
    the Data Builder. With this feature, you can easily change the structure of a
    data set from a wide spreadsheet format to more relational data table. An example
    of how the restructuring is shown in Figure 12.14.


    Figure 12.14 Transpose Diagram


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_13.png)


    With transposing in the Data Builder, we classify our data items into three categories:


    - Group By (Grp)

    - ID Columns (ID)

    - Transpose (TPS)


    In Figure 12.14, the value from ID now becomes a variable with the values from
    the TPS variables. Each value from the TPS data items has its own row. Transpose
    data items are the data items that you would like to now have their individual
    row. For our example in the Data Builder, we are going to transpose a dataset
    about countries’ yearly GDP.


    Figure 12.15 Transpose example


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_14.png)


    Each of the years has its own column, but we want each year to have its own row
    instead. The year columns are our Transpose data items.


    Figure 12.16 Transpose data items


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_15.png)


    The Group By data items are your keys for the table. Each set of these variables
    combined with the Transpose columns are on their own row. For this example, that
    would be Country Name.


    Figure 12.17 Transpose Table Window


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_16.png)


    The ID Columns are the data items onto which you are transposing. The values in
    this data item now become a data item with the value from the transpose data items.
    In this example, the ID column is Indicator Name.


    Figure 12.18 Transpose Table Window


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_17.png)


    After clicking preview, we now get our transposed data set. The value GDP from
    the GDPVAR table is now a new column with all of the values from the transpose
    data items. The names of the transposed data items are now in a new column _NAME_.
    This is a new column that was created in the process and can be renamed once you
    accept the new data set.


    Figure 12.19 Final transposed data set


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_18.png)


    #### Filtering data


    Sometimes you don’t want to bring in all of the data from a table. There might
    be some rows that contain a certain value, category, or date range that you have
    no need for in your analysis. You can remove that data in the Data Builder by
    using Filtering option. This option, similar to the transpose and split options,
    is available when you right-click the column head of a data item. When you click
    the filter option, the filter panel on the right side will open.


    Figure 12.20 Filter Example


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_19.png)


    The panel will update with a selection of values from the data items that were
    selected. If the data item was a category, then a list box will be shown with
    all of the distinct values available. If the data item was a measure, then you
    will be given a range control bar where you can select which range of numeric
    values you would like to keep. When doing multiple filters on a data set, the
    filter panel will show all of them at once so that you are aware of what data
    items are filtered.


