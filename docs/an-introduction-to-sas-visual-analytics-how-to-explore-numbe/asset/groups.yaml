- md: "\n## chapter thirteen\n## visualizing and exploring your data\n\nIn the previous\
    \ chapter, we walked you through the modern interface of the SAS Visual Data Builder.\
    \ That same look has also been applied to the SAS Visual Analytics section for\
    \ the version on SAS Viya. This new appearance gives you more space to work with\
    \ and easier navigation of features, resulting in more control over your reporting\
    \ and data analysis capabilities.\n\nThe architecture of the application has also\
    \ been updated. Some parts that were previously split between sections are now\
    \ combined into a unified application. Since this is an update, there are added\
    \ features to the application as well. In this chapter, we explore this new version\
    \ of SAS Visual Analytics and explain what has been added.\n\n### Introducing\
    \ the new layout\n\nThe new layout of SAS Visual Analytics has a structure similar\
    \ to the one from previous versions, but a new look and feel to it. Two of the\
    \ major changes are the panels and top toolbar.\n\nIn Figure 13.1, a blank report\
    \ is shown in SAS Visual Analytics 8.1.\n\nFigure 13.1 SAS Visual Analytics layout\n\
    \n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_0.png)\n\nIn the top left corner\
    \ of the report, you can see that we have Page 1. This shows the tabs of the report,\
    \ which are called pages. You can click the plus sign to create multiple pages\
    \ for a report if you would like. If you have used any of the previous versions\
    \ of SAS Visual Analytics, you should be able to recognize the panels that we\
    \ have here as well as some added icons.\n\nYou can access your data and objects\
    \ from the left panel. If you click the **Data** tab, it opens a panel with your\
    \ data set and all of its data items. The **Objects** tab shows you all of the\
    \ objects within the application that you can use for reporting. Within both of\
    \ these tabs, the drag-and-drop functionality lets you easily drag data or objects\
    \ to the canvas. The **Outline** tab outlines the structure of your report so\
    \ that you can see the pages that you have created and the objects in each one\
    \ of them.\n\nThe right panel lets you control your objects. The **Options** button\
    \ gives you the choices to customize the object, changing titles, backgrounds,\
    \ layout, and other data options. The **Roles** tab is where you can see and add\
    \ data items to your object. With the **Actions** button, you can set up interactions\
    \ between objects or links to other pages. The **Filters**, **Rules**, and **Ranks**\
    \ tabs let you customize your object to your requirements.\n\nAn important aspect\
    \ of this new layout is how the panels are minimized. If you click one of the\
    \ tabs, it opens, and you can use it as needed. But once you are done, you can\
    \ close the tabs and have an open white space to work in while you are building\
    \ a report.\n\n### Top toolbar\n\nThe toolbar at the top that sits across from\
    \ the pages of the report contains some new features that make reporting even\
    \ more convenient. The first icon that looks similar to the filter in the right\
    \ panel controls the display for the report and page prompts. When this icon is\
    \ clicked, two bars appear at the top of your page, as shown in the following\
    \ figure.\n\nFigure 13.2 Report and page prompts\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_1.png)\n\
    \nYou can drag data items or control objects into these sections, which filter\
    \ out data according to which one they are in. The **Report** prompt section filters\
    \ data for all pages, and the **Page** prompt filters data for all objects on\
    \ that page.\n\nThe next icon is the auto update. This is turned on by default\
    \ so that when you make changes to the data within objects, the objects update\
    \ automatically with the new results. If you’re working with large data sets that\
    \ can take a few moments to process, you can turn this feature off to build reports\
    \ quicker.\n\nYou should recognize the next two icons on the toolbar: **Undo**\
    \ and **Redo**. You might find this new part of the interface to be the most convenient\
    \ of them all. Not only does the **Undo** button keep track of your last action,\
    \ but it also keeps a history of them, as shown in Figure 13.3 below. Left-click\
    \ **Undo** to revert your last action; right-click to see the history of your\
    \ actions. Now mistakes can more easily be corrected compared to previous versions.\n\
    \nFigure 13.3 Undo button\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_2.png)\n\
    \n### Starting a new report\n\nWhen you click SAS Visual Analytics from SAS Home,\
    \ you are immediately brought to a window with options to go to your data sources,\
    \ create a new report, or open a saved report. This is the welcome mat of the\
    \ application and lets you choose where you want to start in the application.\n\
    \nFigure 13.4 SAS Visual Analytics welcome mat\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_3.png)\n\
    \nThere is a check box at the bottom where you can default to a certain selection\
    \ so that you do not get this welcome screen each time you log in. The options\
    \ to open a report, create a new one, or load data are all available in the application.\n\
    \n### Importing data\n\nIf you selected data from the welcome screen, you are\
    \ brought to the Open Source window. You can also reach this window by selecting\
    \ **Add** and then **Add data source** on the **Data** tab.\n\nFigure 13.5 Open\
    \ Data Source window\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_4.png)\n\n\
    In this window, under the **All** tab is where you can find all of your tables\
    \ loaded into the CAS Server. The **Recent** tab shows all the data sources you\
    \ might frequently use, and the **Import** tab is where you can pull data from\
    \ other servers or your local machine. Under **Import**, there is an option **From\
    \ Clipboard** lets you paste data from places such as a web page.\n\n### Exploring\
    \ data\n\nFrom Figure 13.5, we are going to select the Olympic Athletes dataset\
    \ and open in the application. After you click **OK**, the report appears with\
    \ the **Data** tab open.\n\nFigure 13.6 Data panel\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_5.png)\n\
    \nThis panel is very similar to the one from previous versions. You can find your\
    \ data source in the top drop-down bar. If you have imported multiple datasets,\
    \ this drop-down bar is where you can switch between them. Down in the panel is\
    \ where you can find your Category (character and datetime), Measure (numeric),\
    \ and Aggregate Measure items. Right below the table is the **Add** button. This\
    \ is where you can access the options for creating hierarchies, new calculated\
    \ items, custom categories, and parameters. The icons across from the **Add**\
    \ button let you filter the data source, get measure details (covered later in\
    \ this chapter), and refresh the data.\n\n### Adding objects\n\nUnder the **Data**\
    \ tab is the **Objects** tab, which opens to a panel with an inventory of all\
    \ the available objects.\n\nFigure 13.7 Objects panel\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_6.png)\n\
    \nIf you are familiar with previous versions, you notice that this is similar\
    \ to the older objects tab with a few additions. As the instructions on the canvas\
    \ mention, you can simply drag content to the canvas. For this example, we are\
    \ just going to start with a list.\n\nFigure 13.8 Adding an object\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_7.png)\n\
    \nThe canvas is updated with the list table, but we still do not have any data\
    \ added. So a message sits in the middle of the object letting us know that data\
    \ has not yet been assigned to the required roles. In order to add those roles\
    \ to your object, you can drag data items from the data panel to the object or\
    \ go to the **Roles** tab like we have in the figure above. When you click the\
    \ **Add** button, a window appears like the one in the figure below.\n\nFigure\
    \ 13.9 Adding roles to an object\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_8.png)\n\
    \nIf the specific role that you are populating can take multiple data items, then\
    \ a check box list appears. If the role only takes one type of measure or category,\
    \ then you are given a choice of the ones that fit that role. For the ones with\
    \ possible multiple selections, you can select the first one and hold down the\
    \ Shift key to select all or as many as you like. With our Olympic Athletes dataset,\
    \ we want to pull everything over first so that we can look at all the data we\
    \ have available. Here’s what the page looks like after we click **OK**.\n\nFigure\
    \ 13.10 List table with data\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_9.png)\n\
    \nThe Roles panel shows us that all of the columns have been added to the list\
    \ table and are in order according to how they appear in the table. All of the\
    \ data items cannot fit on the screen. But there is an invisible scroll bar at\
    \ the bottom that you can use to see the rest of the items. It appears as your\
    \ pointer moves to the bottom of the table.\n\nIf you want to add another object,\
    \ you can go back to the objects panel and drag another object to the canvas.\
    \ While you’re still dragging, there are blue highlights on each side of the canvas\
    \ indicating where the object is going to appear when you have finally dropped\
    \ it. When you do drop, the canvas divides the space between your old object and\
    \ the new one that was added. In Figure 13.11, we dragged a bar chart and added\
    \ Country as our category and Total Medals as our Measure.\n\nFigure 13.11 Adding\
    \ multiple objects to the canvas\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_10.png)\n\
    \n### All-in-one application\n\nIn Chapter 2, we walked you through the designer\
    \ part of SAS Visual Analytics and how to start building out reports. Then in\
    \ Chapter 7, we showed you how to create visualizations in the explorer section\
    \ of the application. The explorer section had quite a few features that you could\
    \ not use in the designer. In this section we are going to show you where you\
    \ can find them in SAS Visual Analytics 8.1.\n\n### Auto chart and changing objects\n\
    \nOne of the big differences between the report and explorer in previous versions\
    \ was that in the explorer you could drag data items to visualization area and\
    \ then the application would automatically determine chart to use. From there\
    \ you could change that chart through a drop-down menu. This feature has been\
    \ merged into SAS Visual Analytics 8.1.\n\nFigure 13.12 Dragging data items to\
    \ blank canvas\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_11.png)\n\nYou can\
    \ see in Figure 13.12 that we have selected Age and Gold Medals as measures from\
    \ Data panel. We can then drag those two items to the canvas to the right. By\
    \ just dragging any data item to the canvas, your data is automatically charted\
    \ into a graph depending on what type data it is.\n\nFigure 13.13 Using the auto\
    \ chart\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_12.png)\n\nAfter dragging\
    \ those fields over, a scatter plot appears with our data. Automatic chart feature\
    \ determined that this was the best visual to display the fields we gave it. With\
    \ the scatter plot, we get a visual that plots the two measures against each other.\
    \ We seem to have an outlier at the top gold medals. If you would like to add\
    \ more fields, you can go back to Data panel and continue to drag more into the\
    \ object. Since we are still in the auto-chart feature, your object might change\
    \ depending on the data item you add. You can also select an option at the top\
    \ of the report that shows which other types of charts are available for the data\
    \ items that are in the report.\n\nFigure 13.14 Changing the auto chart\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_13.png)\n\
    \n### Getting more measure details\n\nWhen trying to learn more about a data item,\
    \ you might put it into a table or bar chart so that you can better understand\
    \ the values it contains. In SAS Visual Analytics 8.1, the Measure Details feature\
    \ from the Explorer in SAS Visual Analytics 7.3 has been brought in to give you\
    \ all the information you need to know about each of your measures. At the top\
    \ of the **Data** tab, where the name of your data set is, click the Table icon\
    \ to open a window that contains information about each measure in your data set.\n\
    \nFigure 13.15 Measure details for a table\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_14.png)\n\
    \nThe top table shows your minimum, maximum, average, and sum for each measure.\
    \ In Figure 13.15, we have Age selected for the More information section at the\
    \ bottom. But you can select any of the measures from the top table and the bottom\
    \ then updates. The bottom statistics show many advanced metrics for an individual\
    \ measure ranging from distinct counts all the way to a value for skewness. The\
    \ advanced metrics update by clicking on any of the measures in the table at the\
    \ top.\n\n### Objects and Data Analysis Features\n\nIn previous versions, since\
    \ the Explorer section was meant for more data analysis, it was packed with a\
    \ few additional objects and features that you could not get in the designer.\
    \ Now that there is only one application, all of those have moved over. You can\
    \ find heat maps, correlation matrices, word clouds, and many more objects in\
    \ the objects panel in SAS Visual Analytics 8.1. Also, the data analysis features\
    \ have migrated. Forecasting is available in the Time Series Plot, and fit lines\
    \ are available in the Heat Map and Scatter Plot.\n\n Rearranged features in SAS\
    \ Visual Analytics 8.1\n\nYou might notice some other changes to the objects when\
    \ comparing SAS Visual Analytics 7.3 and 8.1. For example, the Scenario Analysis\
    \ in forecasting is now called What-If Analysis. Also, text analytics is now its\
    \ own object (called Text Topics) instead of being a mode of the Word Cloud.\n\
    \nFigure 13.16 Forecasting feature in a line chart\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_15.png)\n\
    \n### Launch into analytics with visual statistics objects\n\nWhile you’re analyzing\
    \ a set of measures, you might want to look deeper into your data. Getting into\
    \ the more advanced objects can be done through the launch option, which is similar\
    \ to how you change the chart type. You can find the explore option in the small\
    \ launch option. This is a cool feature that lets you change objects when you\
    \ know you have the right set of data items to analyze. So with the data items\
    \ that we currently have in the Scatter Plot, the Auto Chart icon at the top lets\
    \ us also look at it in a Bar Chart, Correlation Matrix, Crosstab, Histogram,\
    \ List Table, and Word Cloud. Switching among all of these quickly gives you many\
    \ different views of your data. Doing this might uncover a better object to visualize\
    \ your data than you initially conceived.\n"
  mdcn: "\n\n## 第十三章\n## 视视化与探索您的数据\n\n在上一章中，我们带您您熟悉了 SAS Visual Data Builder 的现代界面。这种视觉风格也同样适用于\
    \ SAS Viya 版本的 SAS Visual Analytics 部分。这种新外观为您提供了更大的工作空间，并让功能导航变得更加容易，从而让您对报告和数据分析能力有更多的控制力。\n\
    \n应用程序的架构也进行了更新。以前分散在不同部分的内容现在已合并到一个统一的应用程序中。由于是更新，应用程序还增加了一些功能。在本章中，我们将探索这个新版本的\
    \ SAS Visual Analytics，并解释新增了的内容。\n\n### 介绍新布局\n\nSAS Visual Analytics 的新布局结构与之前的版本相似，但具有全新的视觉效果和感受。两个主要的变化是面板和顶部工具栏。\n\
    \n在图 13.1 中，显示了在 SAS Visual Analytics 8.1 中的一个空白报告。\n\n图 13.1 SAS Visual Analytics\
    \ 布局\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_0.png)\n\n在报告的左上角，您可以看到我们有“第\
    \ 1 页”。这显示了报告的页签，它们被称为“页面”。如果您需要，可以点击加号为报告创建多个页面。如果您用过 SAS Visual Analytics 的任何以前版本，您应该能够识别出我们这里的面板以及新增的一些图标。\n\
    \n您可以从左侧面板访问数据和对象。如果您点击**Data（数据）**标签页，它会打开一个包含您的数据集及其所有数据项的面板。**Objects（对象）**标签页显示了应用程序中所有您可用于报告的对象。在这两个标签页中，拖放功能均让您能够轻松地将数据或对象拖到画布上。**Outline（大纲）**标签页概述了您的报告的结构，让您可以看到已创建的页面以及每个页面中的对象。\n\
    \n右侧面板允许您控制您的对象。**Options（选项）**按钮提供了自定义对象的选择，可以更改标题、背景、布局和其他数据选项。**Roles（角色）**标签页是您可以在其中查看并向对象中添加数据项的地方。通过**Actions（操作）**按钮，您可以设置对象之间的交互或与其他页面的链接。**Filters（筛选）**、**Rules（规则）**和**Ranks（排名）**标签页允许您根据需求自定义你的对象。\n\
    \n这种新布局的一个重要方面是面板是如何最小化的。如果您点击其中一个标签页，它就会打开，您可以根据需要使用它。但一旦完成，您就可以关闭标签页，在构建报告时留出一个开放的空白区域进行工作。\n\
    \n### 顶部工具栏\n\n位于报告页面顶部的工具栏包含了一些新功能，让报告变得更加方便。第一个类似于右侧面板中筛选器的图标控制报告和页面提示的显示。当点击此图标时，页面顶部会出现两条条，如下所示所示。\n\
    \n图 13.2 报告和页面提示\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_1.png)\n\n您可以将数据项或控制对象拖入这些区域中，它们将根据其所在的位置来过滤数据。**Report（报告）**提示部分筛选所有页的数据，而**Page（页面）**提示部分筛选该页面上所有对象的数据。\n\
    \n下一个图标是自动更新。它是默认开启的，这样当您更改对象内的数据时，对象将随新结果自动更新。如果您正在处理可能需要几分钟处理的大数据集，可以关闭此功能以便更快构建报告。\n\
    \n您应该能识别工具栏上的后两个图标：**Undo（撤销）**和**Redo（重做）**。您可能会发现这个界面的新部分是最方便 true一个。**Undo**按钮不仅可以跟踪您的最后一次操作，还会保留操作历史，如下图\
    \ 13.3 所示。左键点击 **Undo** 撤销上一次操作；右键查看操作历史。与以前版本相比，现在可以更容易地纠正错误。\n\n图 13.3 Undo\
    \ 按钮\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_2.png)\n\n### 启动新报告\n\n当您从\
    \ SAS Home 点击 SAS Visual Analytics 时，您会立即进入一个窗口，其中有进入数据源、创建新报告或打开保存报告的选项。这是应用程序的欢迎页，让您选择从应用程序的何处开始。\n\
    \n图 13.4 SAS Visual Analytics 欢迎页\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_3.png)\n\
    \n底部有一个复选框，您可以默认选择某个选项，这样您每次登录时都不会显示此欢迎屏幕。打开报告、创建新报告或加载数据的选项在应用程序中均可用。\n\n###\
    \ 导入数据\n\n如果您从欢迎界面选择了数据，您将进入 Open Source（打开源）窗口。您也可以通过在**Data**标签页上选择**Add（添加）**然后选择**Add\
    \ data source（添加数据源）**进入此窗口。\n\n图 13.5 打开数据源窗口\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_4.png)\n\
    \n在此窗口中，**All（全部）**标签页下可以找到所有加载到 CAS Server 的表。**Recent（最近）**标签页显示您可能经常使用的数据源，**Import（导入）**标签页是您可以从其他服务器或本地机器提取数据。在\
    \ **Import** 下，**From Clipboard（从剪贴板）**选项允许您从网页等地方粘贴数据。\n\n### 探索数据\n\n从图 13.5\
    \ 开始，我们将选择 Olympic Athletes（运动员）数据集并在应用程序中打开。点击 **OK** 后，报告出现并打开了 **Data**标签页。\n\
    \n图 13.6 数据面板\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21.png)\n\n此面板与以前的版本非常相似。您可以在顶部下拉栏找到数据源。如果您导入了多个数据集，此下拉栏允许您在它们之间切换。面板下方是您可以找到\
    \ Category（类别）、datetime（日期时间）和 Measure（度量）的地方。**Add**按钮下方是创建层级、新计算项、自定义类别和参数的选项。**Add**按钮旁边的图标允许您筛选数据源、获取测量详情以及刷新数据。\n\
    \n### 添加对象\n\n在**Data**标签页下方是**Objects（对象）**标签页，它打开一个带有可用对象清单的面板。\n\n图 13.7 对象面板\n\
    \n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_6.png)\n\n如果您熟悉以前的版本，会注意到这与旧的对象标签页相似之处。正如画布上的说明所示，您可以只需将内容拖到画布上。在这个示例中，我们将从一个列表开始。\n\
    \n图 13.8 添加对象\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_7.png)\n\n画布已更新列表更新，但我们尚未添加任何数据。因此对象中间显示了一条消息，告知尚未分配所需的角色。为了向您的对象添加这些角色，可以从数据面板将数据项拖到对象中，或者像上面所示进入**Roles**标签页。当您点击**Add**按钮时，会出现一个如下所示的窗口。\n\
    \n图 13.9 向对象添加角色\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_8.png)\n\n如果您正在填充的特定角色可以接受多个数据项，则会出现复选框列表。如果角色只接受一种类型的度量或类别，则会提供符合该角色的选项。对于可能有多个选择的项目，您可以选择第一个并按住\
    \ Shift 键选择所有或任意数量。使用我们的 Olympic Athletes 数据集，我们先将所有内容拉过来以便查看所有可用数据。这是我们点击 **OK**\
    \ 后的页面。\n\n图 13.10 带有数据的列表表\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_9.png)\n\
    \nRoles 面板显示所有列已添加到列表表中，并按照它们在表中的顺序排列。所有数据项无法显示在屏幕上。但底部有一个不可见的滚动条，可以使用它查看其余项目。它在您的光标移动到表格底部时出现。\n\
    \n如果您想添加另一个对象，可以返回对象面板并将另一个对象拖到画布上。在您仍在拖拽时，画布两侧都有蓝色高亮，指示对象最后释放时将出现。当您释放时，画布会在旧对象和新添加的对象之间划分空间。在图\
    \ 13.11 中，我们拖入了一个柱状图并将 Country（国家）作为我们的类别，将 Total Medals（奖牌总数）作为我们的 Measure。\n\
    \n图 13.11 向画布添加多个对象\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_10.png)\n\n\
    ### 一化应用程序\n\n在第 2 章中，我们带您熟悉了 SAS Visual Analytics 的设计部分以及如何开始构建报告。接着在第 7 章中，我们向您展示了如何在应用程序的探索部分创建可视化图形。探索部分包含许多您在设计中无法使用的功能。在本节中，我们将告诉您在\
    \ SAS Visual Analytics 8.1 中哪里可以找到它们。\n\n### 自动图表和更改对象\n\n以前版本中报告和探索之间的主要区别之一是，在探索中您可以将数据项拖到可视化区域，然后应用程序将自动确定要使用的图表。从那里，您可以通过下拉菜单更改图表。此功能已合并到\
    \ SAS Visual Analytics 8.1 中。\n\n图 13.12 将数据项拖到空白画布\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_11.png)\n\
    \n您可以像图 13.12 所示，通过下拉菜单更改图表。由于我们选择了 Age（年龄）和 Medals（奖牌），将这些数据拖到画布上产生自动图表，正如图 13.13\
    \ 所示。\n\n图 13.13 使用自动图表\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21.png)\n\n\
    如果您填充的特定角色可以接受多个数据项，则会出现复选框列表。如果角色只接受一种度量或类别，则会提供符合该角色的选项。对于可能有多个选择的项目，您可以选择第一个并按住\
    \ Shift 键选择所有或任意数量。使用我们的 Olympic Athletes 数据集，我们想先将所有内容拉过来以便查看我们拥有的所有数据。这是我们点击\
    \ **OK** 后的页面。\n\n图 13.14 带有数据的自动图表\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_12.png)\n\
    \nRoles 面板显示所有列已添加到列表表中，并按照它们在表中的顺序排列。所有数据项都无法显示在屏幕上。但底部有一个不可见的滚动条，可以使用它查看其余项目。它在您的光标移动到表格底部时出现。\n\
    \n如果您想添加另一个对象，可以返回对象面板并将另一个对象拖到画布上。在您仍在拖拽时，画布两侧都有蓝色高亮，指示对象最后释放时将出现。当您释放时，画布会在旧对象和新添加的对象之间划分空间。\n\
    \n### 获取更多详细信息\n\n在尝试获取数据项的更多详细信息时，我们可以通过折线图来深入了解数据。在 SAS Visual Analytics 8.1\
    \ 中，您可以点击 Table 图标，如图 13.14 所示。\n\n图 13.15 测量详细信息\n\n![](img/5643dc80f15942ecfff3ef8a562b5eb9_21_13.png)\n\
    \n底部统计显示最小值、最大值、平均值和和。在图 13.15 中，我们选择了 Age（年龄）和 Medals（奖牌），\n\n部的显示显示度度度度。\n\n\
