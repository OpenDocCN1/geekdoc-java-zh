    ## 第十二章

    ## 数据清洗清洗（Wrangling）


    SAS 一直以易于数据准备而闻名。从 DATA步开始，收集和更改数据一直是一个简单的过程。通过 SAS Visual Data Builder 8.1，SAS
    取了这些原则，并结合一些更新的技术赋予了它们全新的界面。


    在 SAS Visual Data Builder 7.3 中，界面和查询构建是围绕编程语言 SQL 的工作原理展开的。这使得任何具有 SQL 背景的人都能轻松理解。但整个
    SAS Visual Analytics 应用也旨在为非技术用户设计。因此，随着新的开发，SAS 切换了重心，将易用性置于首要任务。


    在本章的这一部分，我们将探索 SAS Visual Data Builder 8.1 以及你需要了解的与 SAS Visual Data Builder 7.3
    之间的差异。我们将引导你熟悉全新的现代用户界面。现在，连接表格和转换列提供了更多选项。此外，使用新平台也改变了你在新数据集上进行开发和执行更改的方式。


    ### 引入现代用户界面


    随着外观的更新，加载数据的过程也发生了变化。进入数据生成器时，你注意到的第一件事之一就是看到一个欢迎窗口。此窗口让你决定是打开数据源、创建新计划还是打开现有计划。计划（Plans）类似于查询，将在本章稍后部分进行介绍。


    图 12.1 SAS Visual Data Builder 欢迎界面


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_0.png)


    #### 导入数据


    当你在欢迎窗口中选择“数据”选项时，将带你进入“打开数据源”窗口。此窗口与 SAS Visual Analytics 7.3 中报告设计器的加载数据功能非常相似。在第
    2 章中，我们回顾了报告设计器。当你添加数据时，你有能力直接从本地文件、服务器和社交媒体导入数据。在报告设计器 8.1 中，该选项现在也适用于数据生成器。在之前的数据生成器中，你只能访问注册到元数据的表和库。更新后的功能还允许你直接将文件从桌面或文件夹拖入窗口。


    图 12.2 打开数据源窗口


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_1.png)


    **所有**（All）标签页显示 CAS 服务器中可用的数据集。**最近**（Recent）标签页让你看到最近处理过的任何数据集，而**导入**（Import）标签页是你访问其他区域数据的地方。服务器下的
    LASR 选项允许从以前使用的版本的 SAS Visual Analytics 中提取数据。


    #### 查看数据


    一旦你选择了数据源，你将进入应用程序，数据将显示在屏幕上。这是不同版本之间用户感知区别之一。你不再是处理列名然后预览数据，而是直接查看数据，并可以在进行转换时直视化地看到数据的更改。


    图 12.3 打开数据源窗口


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_2.png)


    在此视图中，可以很容易构建你想要的输出数据集结构。你可以通过右键点击当前列来删除和重命名列。


    #### 数据集概况分析


    新的数据生成器不仅增强了你的数据准备能力，还让你对数据细节有了新的认识。在查看数据表时，左上角有一个我们尚未探索的向下箭头。当你点击该图标时，即可获得如图
    12.4 所示的元数据信息。


    图 12.4 表概况


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_3.png)


    有**表概况**（Table Profile）标签页和**列概况**（Column Profile）标签页供选择。在**表概况**标签页上，你会看到一个小仪表板，告诉你表格创建和最后保存的时间，以及数据中的列行数。这在验证数据集最后更改时间或检查表格可能有多大时有用。点击**列概况**标签页进入数据项统计的另一个层级。


    图 12.5 列概况


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_4.png)


    为了显示详细信息，必须从底部的表中选择一列。对于字符数据项，频率分布（Frequency Distribution）显示每个唯一值在行中出现的次数。标准指标（Standard
    Metrics）显示你唯一值的总数。列指标（Column Metrics）和高级指标（Advanced metric）仅用于数值数据项，并显示有关数据项的各种统计数据，例如整个数据项的最大值、最小值和平均值。


    在**列概况**标签页下方的顶栏中，你可以看到这也是重命名数据项（与右键点击列名相同）、更改数据类型和更改格式的位置。在这里设置好所有数据类型和格式是良好做法，这样你就不需要在报告设计器中进行更多数据工作了。


    #### 创建新数据项


    如果你想添加列，右侧工具栏上有一个计算器图标。


    图 12.6 添加计算列


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_5.png)


    此窗口提供了对新数据项进行计算的所有工具。左侧的两个标签页让你访问所有数据项以及处理数值、字符和日期项的操作符。右上侧也有选项让你选择结果数据的类型和格式。完成后，你甚至可以使用底部的**预览**（Preview）按钮来确保你创建的列是你所想要的。点击接受（Accept）按钮将列添加到数据集。


    #### 使用内存连接


    此版本的数据生成器通过视觉化连接使连接变得尽可能简单。即使你不完全理解内连接、外连接和右连接的区别，查看列和数据也能让你理解。要访问连接窗口，请点击右上角与计算列图标分组的图标。


    图 12.7 连接表格


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_6.png)


    在图 12.7 中，我们引入了两个表。第一个表的列显示在下方。当你打开连接窗口时，左侧会有你的第一个表，右侧是**选择表**（Select Table）按钮。选择表选项带你进入章节开头看到的打开数据窗口。在此窗口中你可以找到其他数据源。注意表格是如何颜色编码的。我们要连接的数据项列在下方。当我们点击**预览**（Preview）时，表格的颜色方案将标记每个项目，显示出新表的样子。


    图 12.8 预览连接


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_7.png)


    颜色概述数据项来自哪个表。对于两个表共有的数据项，颜色是分开的。这使用户可以非常容易地可视化数据是如何合并的。两个表之间还有一个按钮，让你选择要使用的连接类型。


    #### 计划与表格


    数据生成器的另一个与 SAS Visual Analytics 7.3 不同方面是计划的概念。在早期版本中，你创建查询来引入表、连接并处理数据项形成最终数据集，然后将其发送到位置。在新版本中，计划类似于查询，但它们显示为一组指令。


    图 12.9 查看计划指令


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_8.png)


    在图 12.9 中，你可以看到计划的示例。它包含了上一节完成的连接表格指令，以及重命名列的指令。


    图 12.10 保存计划


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_9.png)


    在图 12.10 的右上角，我们选择了提供保存选项的图标。计划和查询之间的区别在于，不需要运行计划即可让数据到达所在位置。相反，你有保存计划或保存表格的选项。保存计划就像保存查询；你存储创建数据集所需的步骤。这不会执行任何操作，你只需保存计划即可轻松继续。保存表格就像运行查询。你所有的步骤已经在表中接受并执行。现在你只需将新表移动到特定位置。


    #### 新功能


    为了配合构建数据集的全新界面和流程，SAS 还引入了一些新功能，提供更多准备数据的方法。这些功能包括：


    - 转换（Transformations）——使用内置 SAS 函数处理数据项的方法。

    - 转置表格（Transposing tables）——根据某些数据项重新组织表格的方法。

    - 过滤（Filtering）——通过选择排除的数据项值来限制表中的行。


    #### 转换


    新功能的一部分是能够使用所有喜爱的 SAS 函数即时转换数据。通过右键点击任何列，你将获得一个下拉列表，允许你即时执行不同的数据处理函数。


    图 12.11 数据处理函数


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_10.png)


    在下拉列表中，你找到对列进行各种操作的选项。除了我们在上一节中涵盖的列属性外，你还可以重命名列。你可以点击**删除**（Remove）选项来丢弃列。还有一个过滤值的选项；此选项将你带到包含所有列值的窗口。两个更有实用的选项是**快速拆分**（Quick
    Split）和**拆分**（Split）。当你点击**快速拆分**时，你将得到如如下所示的结果。


    图 12.12 快速拆分


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_11.png)


    快速拆分选项用于该列。这带给了我们两个新列：LEFT_Split 和 RIGHT_Split，它们在第一个值后的空格处和第二个值之前的斜杠处进行了拆分。快速拆分选项查看你的数据中的第一个可能的分隔符。但这并不是我们想要的结果。我们想要在斜杠处拆分，所以现在进入**拆分**（Split）选项。


    图 12.13 拆分列


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_12.png)


    而不是自动拆分，现在出现了一个窗口，我们有多个选项来解析字符数据。下拉列表中的选项所示：


    - 分隔符（On delimiter）

    - 固定长度（On fixed length）

    - 分隔符前（Before a delimiter）

    - 分隔符后（After a delimiter）

    - 多个分隔符（On multiple delimiters）


    这些选项在你需要获取特定字符串数据项时提供了很多帮助。


    #### 转置表格


    列上的转置选项源于 PROC Transpose，它可以用于 SAS 编程语言，但对于 SAS Visual Analytics 和数据生成器来说是全新的。通过此功能，你可以轻松地将数据集从宽表格式更改关系型表。重构的示例如图
    12.14 所示。


    图 12.14 转置图


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_13.png)


    在数据生成器中通过转置将数据项分类为三类：


    - 分组（Group By - Grp）

    - 列（ID Columns - ID）

    - 转置（Transpose - TPS）


    在图 12.14 中，ID 的值现在变成了带有 TPS 值的变量。TPS 数据项中的每个值都有了自己的行。转置数据项是你希望现在具有独立行的数据项。对于我们的示例，我们将转置一个关于国家年度
    GDP 的数据集。


    图 12.15 转置示例


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_14.png)


    每个年份都有自己的列，但我们希望每个年份都有自己的行。年份列是我们的转置数据项。


    图 12.16 转置数据项


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_15.png)


    分组数据项是表格的键。这些变量与转置列结合在自己的行上。对于这个示例，那就是国名（Country Name）。


    图 12.17 转置窗口


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_16.png)


    ID 列是你正在转置的数据项。该数据项中的值现在变成了来自转置数据项的变量。在这个示例中，ID 列是指标名称（Indicator Name）。


    图 12.18 转置窗口


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_17.png)


    点击预览后，我们得到了转置后的数据集。GDP 表中的 GDP 值现在是一个包含所有转置数据项值的新列。转置数据项的名称位于新列 _NAME_ 中。这是在此过程中创建的新列，一旦接受新数据集即可进行重命名。


    图 12.19 最终转置后的数据集


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_18.png)


    #### 过滤数据


    有时你不想从表中引入所有数据。某些行可能包含你分析中不再需要的特定值、类别或日期范围。你可以使用数据生成器中的过滤（Filtering）选项移除这些数据。此选项与转置和拆分选项类似，在右键点击数据项的列头时可用。当你点击过滤选项时，右侧的过滤面板将打开。


    图 12.20 过滤示例


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_20_19.png)


    面板将根据所选数据项的值进行更新。如果数据项是类别，将显示一个包含所有可用值的列表框。如果数据项是度量，你将获得一个范围控制条，可以在其中选择你想保留的数值范围。在数据集上执行多次过滤时，过滤面板将同时显示所有过滤器，以便你知道哪些数据项被过滤了。


    REFERENCES


    SAS Institute Inc. 2017\. *SAS Visual Analytics 8.1: User’s Guide*. Cary, NC:
    SAS Institute Inc.


    SAS Viya Communities. https://communities.sas.com/t5/SAS-Viya/ct-p/sas-viya


    SAS Visual Analytics. https://communities.sas.com/t5/SAS-Visual-Analytics/bd-p/sas_va


