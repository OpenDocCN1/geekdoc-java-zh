    Creating a workable layout


    After playing with the data objects, you are able to determine which objects


    belong together. Instead of creating multiple dashboards, this dashboard has a


    single layout to support the vice president and regional managers. The


    management team can check the KPIs for the entire organization. Then, using


    the filters, they can compare each region and multiple dates if desired.


    In the bottom area, the regional managers can use the filters to compare


    product lines and individual sales reps. A second page called Sales Rep


    Ratings enables the regional manager to drill down to more detail about the


    ratings. Color is added to help the eye quickly spot differences.


    Figure 3.3 Determining interactivity


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_8_37.png)


    Tips for more useable dashboards


    The most successful dashboards use a clean, minimal look. As Edward Tufte


    would direct us, “*Let the data talk*.*”* Avoid using logos or other decorative


    elements on your page. You must be careful that your design choices do not


    distract your user from understanding the main messages. The design should


    instead be the *sex appeal* that attracts the user’s eye!


    Here are some additional tips to make your dashboard easier to use:


    • If your dashboard is internal to the organization, there is little reason to


    have the logo on it. If it’s required to be there, keep it small and near the
    right


    top or bottom. This keeps the logo from appearing to be the central focus.


    • Add a first page or section to your dashboard that contains any supporting


    information that the users might need. This information might link to related


    websites, explain how to access the dashboard, or provide housekeeping


    information. The content might contain topics such as when the data is


    updated or the counting rules.


    • Ensure that your dashboard is fast. This might require pre-summarizing


    data, rethinking calculations, or using different visualizations. Users do not


    like extensive wait times. This process might take some experimentation to


    determine the optimal load and display time.


    • Minimize the navigation and click paths that a user needs to get


    information. If the users have to navigate multiple screens for an answer, they


    might look for other organizational sources.


    One final note: In these past few pages, you might have the impression that


    the dashboard design process is a few simple steps. In reality, it took several


    weeks of planning. There were multiple layout iterations considered before


    this one was selected. SAS Visual Analytics makes the process easier, but you


    still must know what you want to achieve and ensure that your data supports


    the desired outcome. After the dashboard is complete, it most likely will


    continue to change as the organization grows and improves.


