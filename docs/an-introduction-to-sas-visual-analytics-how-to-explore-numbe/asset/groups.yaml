    036


    528


    840


    Country or Region


    SAS Map ID


    Values


    AU


    NL


    US


    Subdivision


    (State, Province


    Names)


    Queensland


    Noord-Nederland


    North Carolina


    Subdivision


    (State, Province)


    SAS Map ID


    Values


    AU-3


    NL-01


    US-37


    US State Names


    —


    —


    North Carolina


    US State


    Abbreviations


    —


    —


    NC


    US ZIP Codes


    —


    —


    27513


    On the SAS Support site, there is a Geographic Lookup Values for SAS Visual


    Analytics (at


    http://support.sas.com/rnd/datavisualization/vageo/71/VA71LookupValues.html).


    This page contains a list of these values to help you understand your specific


    location. The tables at this site list the countries and the associated ISO


    numeric codes.


    SAS Visual Analytics uses internal tables in the MAPSGFK library that is


    shipped with the product. You can review the tables in this library to ensure


    that your data matches the expected name by using an application such as


    SAS Studio. For additional assistance in creating geo data, you can use the


    GEOCODE procedure that is available with the SAS/GRAPH software.


    **What is an ISO code?**


    There is an international standard called ISO 3166 published by the


    International Organization for Standardization. This standard applies numeric


    values to countries and regions that everyone can use. There are several


    advantages to using numeric references, particularly in the data world.


    If a programmer is using a non-Latin based language, such as Chinese or


    Hebrew, the number makes it easy to look up values. Also, when new


    countries form, a new number can be assigned while maintaining the older


    number for historical purposes.


    Creating a predefined geographic data item


    After importing data into SAS Visual Analytics, you must assign the data item


    to a Geography role before it can be used with any of the geo objects. You can


    create a geographic data item from an existing character or numeric data item.


    To create a geographic data item:


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_12.png)


    Right-click the data item that contains the geographic element that matches


    the predefined role. In this example, the Country data item contains the


    country names, such as Australia or Brazil.


    **Note:** Some users prefer to duplicate the data item before assigning it to
    this


    role.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_13.png)


    Select Geography ▶ Country or Region Names. Your data item is moved


    under the Geography section. You can use it with geographic roles.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_14.png)


    Choose a geographic role.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_15.png)


    Dealing with location accuracy


    If SAS Visual Analytics cannot plot your country data item, you might need to


    convert a country’s common name to its official name. For example, Russia,


    United States of America, and Great Britain could be in your data set, but


    SAS Visual Analytics cannot plot them. When you search the country names


    in the MAPSGFK.WORLD data set, you learn that these countries use a


    different IDNAME. Often it is easier to convert the values to the ISO numeric


    code rather than using names.


    Figure 6.3 MAPSGFK world data set values


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_16.png)


    Creating a custom geospatial data item


    All geospatial data items represent a location on the planet Earth. A specific


    point or address has a set of coordinates, which are called latitude and


    longitude. You might recall from elementary school when you studied the


    globe and learned how it was divided by imaginary parallel lines that circle


    the globe from north to south (called latitude) and from east to west (called


    longitude).


    When you provide a location’s latitude and longitude, you are referencing


    these lines. If you think about the world’s airports, it’s possible to describe
    the


    geospatial location with just latitude and longitude coordinates. In the


    following figure, the airports are highlighted on the map, and the table on the


    left shows the airport name with its coordinates. Notice that the latitude


    numbers are similar because these airports are in a similar eastern European


    location. There is some variation in the longitude numbers as the airport is


    further south. Compare the Charles De Gaulle (Paris, France) coordinates to


    the Dublin (Dublin, Ireland) coordinates to better understand the values.


    Figure 6.4 Airports with latitude and longitude


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_17.png)


    Creating a custom geographic data item


    To create a custom geographic item, you must have the latitude and longitude


    coordinates available in the data set. The coordinates can be based on the


    World Geodetic System (WGS84), Web Mercator, and the British National


    Grid (OSGB36). The default is the World Geodetic System (WGS84).


    **What is a coordinate system?**


    There are three coordinate systems available for custom data points. These


    standards were developed for diverse purposes but are now commonly used.


    • WGS84 was developed by the United States military for satellite-


    positioning systems.


    • Web Mercator is a web standard. It was first used with Google Maps.


    • OSGB36 is a British-developed system that is heavily used in British-


    based maps.


    You should choose the system that works best for your specific location or


    geo data. In most cases the WGS84 system works.


    Let’s use the airport coordinates as the basis for the new geographic item. We


    use the airport name to create this data item, but other data items such as


    Airport Code would also work.


    To create a custom geography data item:


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_12.png)


    Duplicate the Airport data item and name the new item Airport Name.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_13.png)


    Right-click the new data item, and then select **Geography**  ▶  **Custom**. A


    Geography window appears.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_14.png)


    Select your data items for latitude and longitude in the appropriate fields.


    Your new data item appears in the Geography area.


    Figure 6.5 Adding a custom data point


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_21.png)


    **Finding geo coordinates**


    If your data set does not have the geo coordinates available, you can get them


    through several sources.


    • The SAS MAPSGFK library contains multiple countries and regions.


    • There are open-source databases available that you can find with a web


    search.


    • Google has an API that you can query through code. The free service has a


    daily access limit, but you can subscribe to their service or other commercial


    services.


    DISPLAYING GEOSPATIAL OBJECTS


    There are three ways to display geo data in SAS Visual Analytics:


    • **Coordinate** – Pinpoints an exact location on the map using a custom


    geographical item


    • **Regional** – Outlines a regional area


    • **Bubble** – Combines a bubble plot to show a value at the location


    These objects enable you to highlight your geospatial data in different ways


    and for different stories. Let’s explore the different ways that these data


    objects are used.


    For the remaining topics in this chapter, the examples are created using the


    storm events data set from the United States National Climatic Data Center


    website. This database contains US storm events (such as tornadoes and


    thunderstorms) since 1950\. The data set contains other facts such as the


    number of deaths or injuries and the estimated property damage. The


    tornadoes are rated by their intensity on the Fujita scale from F0 to F5 with


    F5 being the most destructive. In 2007, the Enhanced Fujita scale was


    introduced and tornadoes were categorized as EF0-EF5.


    Get to the point with geo coordinate data objects


    Perhaps you’ve heard people talk about tornado alley—it’s an area down the


    middle of the United States where tornadoes occur more frequently. Tornadoes


    are powerful and scary storms that produce wind speeds capable of sending a


    wood board through a metal car door. These storm events are responsible for


    massive property damage and loss of lives. Geo coordinate maps are excellent


    at showing exactly where an event occurred. In the following figure, the teal


    markers indicate where tornadoes with EF5/F5 strength of 230 mph+ (370


    kph) winds arose in the past 50 years.


    Figure 6.6 F5/EF5 tornado locations


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_22.png)


    To make this geo coordinate object a little more interesting, let’s add the


    EF4/F4 tornado touchdown points for the same time period. By contrasting


    the teal and gold markers, the viewer sees that an EF5/F5 tornado is less


    common.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_23.png)


    While the data points are chaotic, it’s clear where severe tornadoes occurred.


    This data would not have had the same impression if we had plotted it as a


    line chart or even a pie chart. The touchdown points help you realize why


    those particular states have a higher disaster recovery budget.


    Tip 1: Dealing with odd locations


    This data object uses a custom geography data item that is based on supplied


    latitude and longitude values. If the coordinates are incorrect, then the map


    might show your data in the middle of the ocean. In our sample data, some of


    the coordinates were entered incorrectly. This resulted in tornadoes appearing


    in the Atlantic Ocean. To correct this situation, the latitude and longitude


    values in the data set would have to be edited or filtered.


    Figure 6.7 Tornadoes in the ocean


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_24.png)


    Tip 2: Controlling the data


    When you have too much data to display, SAS Visual Analytics issues a


    yellow icon and warns you to add some filters to your data. With custom


    geographic data items, it is more likely to happen. The solution is to control


    how much data appears at once by setting filters.


    Figure 6.8 There is too much data at one time!


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_25.png)


    Here are a few suggested filters:


    • Add a date range slider to compare events along a time scale. Adding Event


    Year to the slider enables the user to compare which years might have had


    more active storm seasons.


    • Split the data item categories. Use the display rules to assign the tornado


    scale to a different color so that each level is clearer. Then add a List filter


    and assign the Tornado F/EF Scale to the list. Users can select which tornado


    scale they want to compare.


    Figure 6.9 Add filters to keep data visualization manageable


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_26.png)


    Compare area with geo regional data objects


    Use the geo regional data object when you need to introduce a subject about


    location. This geospatial object helps a viewer understand where to focus


    their attention or understand how much variation occurs for a value. These


    objects are also called *choropleth* maps, which is Greek for multitude of


    areas.


    When you start thinking about dangerous storm events, you can imagine that


    these events cause considerable property damage. States more prone to severe


    tornadoes will plan larger disaster recovery budgets. It would be interesting
    to


    compare the damage costs by state. Using a geo regional map, you can place a


    value over an entire region, such as a country or a state. Color is then applied


    over the regions to indicate the intensity of the value.


    Figure 6.10 Understanding regional events


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_27.png)


    In the preceding figure, you can see the associated property damage cost for


    the tornadoes across the areas. The darker the color, the costlier the storm


    damage. Use an average or percentage to make the values comparable or


    normalized. By exploring the visualization, you can easily see the areas of


    most damage, but it’s harder to understand where there is the least damage.


    Be sure to use a legend so that the user understands the color range.


    When you position your pointer over each state, a data tip appears that


    contains the assigned data items values. Since Ohio and Kansas are similar in


    color, viewers might be interested to learn more. Most of Kansas is farm land


    and rural areas, while Ohio is more densely populated and industrial. Being in


    tornado alley, Kansas probably experiences more tornadoes and thus more


    crop damage. With the larger population, it might be costlier for Ohio when


    there is an extreme storm event.


    Tip 1: Improving your geo regional map


    There are a few settings that can make a geo regional data object a nicer user


    experience.


    • Add data tips to provide more information when the user positions the


    pointer over content.


    You can add as many as you like, but make sure that the data items enhance


    instead of confuse the viewer. For the preceding example, we added the Storm


    Event Count as a data tip.


    • Adjust the color transparency for the overlay so that the user can see the


    underlying values.


    If the underlying values are masked, it might cause confusion. For this


    visualization, the transparency was adjusted to 25%. It was just enough to


    maintain the color while still allowing the underlying value to peek though.


    • Adjust the gradient color to ensure enough contrast.


    The ocean is a light blue, so a contrasting color that does not appear too


    similar to the landscape features is required. In Figure 6.9, a single color for


    the Gradient value is used. It is easier to decode a value when the color


    intensity increases as the value increases.


    **Choose lighter colors**


    In *Envisioning Information*, Edward Tufte has a fascinating discussion of


    color with maps. His suggestion is to use colors that are found in nature. He


    encourages using a color palette on the lighter side and provides several


    examples used across several centuries.


    Tip 2: Adding rich details for exploration


    The geo region data object is excellent for getting the user to focus on specific


    areas. It leads to more questions about the storm events, so it might be


    convenient to use an info window to provide more details. This info window


    shows the storms by duration with estimated damage. A quick storm can


    result in as much damage as a longer one, although this probably depends on


    where the tornado touches down.


    Figure 6.11 Use a pop-up window to provide more details


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_28.png)


    When the user clicks on the state, the info window appears with additional


    information. This example uses a bar-line chart, but it can be anything you


    can create in a section. This map is a good way to start a story. It provides
    an


    overview and helps the viewer understand where to focus their attention. In


    this case, it was Kansas and Ohio.


    The only pitfall to an info window is that the viewer might not recall the


    values from the previous pop-up. Use this technique for data discovery or as a


    way to entice someone into your story. This data story is completely about the


    location and comparing how the events affected the states.


    Adding an info window to your map


    Info windows are pages that you can link to from another page. Use the


    following steps to add an information window to your map.


    1\. Create a tab. In this example, the geo regional map was created.


    2\. Create another tab with the data objects of your choice. For this example,


    a bar-line data object was used to show the event duration and estimated


    property damage.


    3\. Select the down arrow next to the title and select **Display as Info**


    **Window**.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_29.png)


    4\. Return to the page that you created in step 1\. Right-click on the map, and


    then select Add Link > Info Window Link. In the window that appears, select


    which info window you want.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_30.png)


    Once you turn the tab into an info window, it does not appear to the viewer.


    You can use an info window in other situations to provide information about


    the tab.


    Show overall trends with bubble plots data objects


    Bubble plots receive a lot criticism for being difficult to understand. These


    charts can pack a lot of data into a few variables. A layperson might spend


    more time trying to understand a bubble plot, but this doesn’t seem true for


    the geo bubble maps. Possibly it’s because the user sees the map and


    understands that it is related to location.


    In the previous topic, we created a geo regional map to show the average


    damage cost from F5 tornadoes for each state. One issue with the method was


    that users had to position the pointer over each state to see how many storm


    events were associated with each event. If a user wants details, it is a little


    awkward. A geo bubble map resolves this issue..


    A geo bubble plot places a bubble on the geographic location and enables you


    to control two aspects of the bubble: its size and color. In the following


    example, the bubble size is the event count (the number of tornadoes) while


    the color shows the estimated property damages (shown with the scale). Now


    it is more apparent that Kansas endured a similar number of events as


    Mississippi, but the price tag was a little larger. However, it also shows that


    Ohio had a similar cost but fewer events than Kansas.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_31.png)


    Tip 1: Ensure that the legend is visible


    When you use bubbles to encode data, you are asking the user to compare the


    bubble size and the bubble color. The legend ensures that the user has some


    visual cues to assist with understanding. You can place the legend anywhere


    around the object. In the preceding example, the legend is placed on the right.


    Tip 2: Watch the default colors


    By default, the geo bubble object uses a gradient scale of red to blue. This


    scale is acceptable when working with performance data and is commonly


    referred to as trafficlighting. The color mimics the traffic signals where red


    means stop and green means go. However, we have a logic problem in this


    instance. The red indicates the least amount of damage and the blue indicates


    the most. Technically, any property damage is bad. (After all, we are not


    measuring how well the tornado was at damaging property!)


    The gradient scale was changed to teal in our chart. The bubbles are not as


    close to the ocean and provide enough contrast with the circle. However,


    notice that the bubble over Tennessee is barely visible. The bubbles were set


    to 30% transparency to make the state names visible. Perhaps another color


    would be more suitable? You can experiment with your data object and


    decide.


    EXPANDING LOCATION INTELLIGENCE


    Starting with SAS Visual Analytics 8.1, users have unlimited access to the


    ESRI base maps from within SAS Visual Analytics. This provides geo search


    functionality and ad hoc selection of data points on a map. Here’s an example


    of a geo search where the user was looking for how close Los Angeles, CA


    customers were to the retail chain Sports Authority.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_32.png)


    For users who want additional functionality, they can subscribe to the ESRI


    premium features. The premium service offers drive-time analysis, drive-by-


    distance analysis, and the ability to create custom shapes. In this example, the


    user was looking for customers within a 5- to 10-minute driving distance of


    the store location. The darker inner area is the 5-minute drive, while the


    lighter inner band in the 10-minute drive.


    ![](img/5643dc80f15942ecfff3ef8a562b5eb9_12_33.png)


    UNDERSTANDING DETAILS ABOUT MAPPING


    TECHNOLOGIES


    SAS Visual Analytics geo mapping capabilities are based on integration with


    two mapping technologies: OpenStreetMap and ESRI ArcGIS. SAS Visual


    Analytics enables its users to view their enterprise data mapped across the


    various locations on the map.


    **OpenStreetMap** This is an open-source project, where a worldwide user


    community maintains the data about roads, boundaries, trails, and much more.


    **ESRI ArcGIS Maps** This advanced mapping platform uses highly interactive


    and informative geographical maps. The maps are maintained by ESRI, a SAS


    partner.


    The SAS Visual Analytics environment must be configured to point to one of


    these mapping technologies. An OpenStreetMap server is hosted by SAS and


    is available as part of the default configuration. Organizations might want to


    host and maintain their own OpenStreetMap server. Organizations can also


    use the ESRI server (ArcGIS for Server, version 10.1 or higher) for access to


    maps. Refer to the *SAS Visual Analytics: Administration Guide* for your


    release for more configuration details.


    Many SAS Visual Analytics users are concerned about what information from


    their data must be shared in order to retrieve map tiles from OpenStreetMap


    or ESRI ArcGIS Maps. After all, if the data is confidential to their enterprise,


    it needs to be kept secure. Fortunately, none of your actual data is leaked


    outside of the environment. SAS Visual Analytics simply requests the specific


    map tiles necessary to render the selected geographic area. The highlighted


    regions, bubble plots, and all are created within the SAS Visual Analytics


    application.


    REFERENCES


    Aanderud, Tricia. 2016\. “Where in the World is SAS Visual Analytics?”


    Available at https://www.zencos.com/blog/review-geoplot-in-sas-visual-


    analytics/.


    Massengill, Darrell. 2016\. “The GEOCODE Procedure and SAS Visual


    Analytics.” *Proceedings of the SAS Global Forum 2016 Conference*. Paper


    SAS3480-2016\. Cary, NC: SAS Institute Inc. Available at


    http://support.sas.com/resources/papers/proceedings16/SAS3480-2016.pdf.


    Nori, Murali, and Himesh Patel. 2016\. “Location, Location, Location—


    Analytics with SAS Visual Analytics and ESRI.” *Proceedings of the SAS*


    *Global Forum 2016 Conference*. Paper SAS4060-2016\. Cary, NC: SAS


    Institute Inc. Available at


    http://support.sas.com/resources/papers/proceedings16/SAS4060-2016.pdf.


    Schulz, Falko, and Anand Chitale. 2014\. “More Than a Map: Location


    Intelligence with SAS Visual Analytics.” *Proceedings of the SAS Global*


    *Forum 2014 Conference*. Paper SAS021-2014\. Cary, NC: SAS Institute Inc.


    Available at http://support.sas.com/resources/papers/proceedings14/SAS021-


    2014.pdf.


    Tufte, Edward R. 1990\. *Envisioning Information*. Cheshire, CT: Graphics


    Press.


    US NOAA Data. Storm Events Database. Accessed 2016\. See


    https://www.ncdc.noaa.gov/stormevents/.


    Wong, Dona M. 2013\. *The Wall Street Journal Guide to Information*


    *Graphics: the Dos and Don’ts of Presenting Data, Facts, and Figures*. New


    York, NY: W. W. Norton & Company, Inc.


