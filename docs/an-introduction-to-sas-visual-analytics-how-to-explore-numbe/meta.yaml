    With the advantages, the changes are found in the industry organization and performance.
    The larger change was to the in-memory storage engine. The in-memory component
    is called the SAS Analytics Server. In the new release, it is renamed to the SAS
    Cloud Analytics Server (CAS). Both servers are similar in that they serve fast
