  md: '# # accessing content


    AWS Virtualsoft allows you to call any public phone number worldwide. You can
    use the AWS Console, CLI, or other tools to make and receive calls.


    This starts with making a call to any number you want. You can make calls through
    the AWS Console, CLI, or other tools using the AWS Virtualsoft API. To receive
    a call, you will need to register your application to accept the call.


    # METHODS OF ACCESSING CONTENT


    # ### Accessing content with the API


    Using AWS Virtualsoft through the API, you can call any public phone number worldwide.
    You can make and receive calls using the API. You can access all features and
    functions provided by the AWS Virtualsoft service.


    # ### Accessing content through the portal


    Using the portal, you will be able to call any public phone number. You can access
    all the features and functions provided by the AWS Virtualsoft service. You can
    also make and receive calls through the portal interface.


    # ### Accessing content with the mobile app


    Using the app, you can call any phone number from your mobile device. The mobile
    app is available for Android and iOS. You can make and receive calls using the
    app just like with the portal or API.


    ![](bbox=[0.215, 0.495, 0.784, 0.565])


    *Figure 1: Accessing content with the API*


    # ### UNDERSTANDING THE ROLES


    There are several roles to understand when you are working with AWS Virtualsoft.
    These roles are:


    +   - Administrator: This role has the power to manage the AWS Virtualsoft account.

    - User: This role has the power to make and receive calls.

    - Auditor: This role has the power to view reports and statistics.


    # ### Transferring the ownership


    The owner of the account can transfer the ownership to another person. This is
    done through the AWS Console.


    # ### Creating a report


    To create a report, you should select the date range and the type of report. You
    can then download the report as PDF.


    ![](bbox=[0.215, 0.875, 0.784, 0.945])


    *Figure 2: Transferring the ownership*


    # ### USING THE REPORT'
