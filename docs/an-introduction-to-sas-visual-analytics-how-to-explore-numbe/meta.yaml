  md: '# # performance considerations


    SQL Server Analysis can help you identify performance bottlenecks. However, as
    your data grows, you may run into performance issues when you try to query large
    amounts of historical data.


    When working with large datasets, it is important to consider the following factors
    to ensure that your queries run quickly and efficiently:


    +   - Data locality

    - Data distribution

    - Resource contention


    # ## Data locality


    Data locality is the ability to process data on the same node where it is stored.
    This minimizes the amount of data that must be moved over the network, which is
    often the biggest bottleneck in distributed systems.


    ![](bbox=[0.135, 0.255, 0.865, 0.38])


    # ## Data distribution


    Data distribution refers to how data is spread across the nodes in a cluster.
    If data is distributed unevenly, some nodes may become overloaded while others
    remain idle, leading to poor query performance.


    SQL Server uses a hash-based distribution mechanism to spread data across the
    cluster nodes. This ensures that the work is balanced evenly across all nodes.


    # ## Resource contention


    Resource contention occurs when multiple processes compete for the same system
    resources, such as CPU, memory, or I/O. In a distributed environment, this can
    be particularly problematic if several nodes are overloaded.


    # ## Scalability limitations


    SQL Server Analysis Services is designed to scale horizontally, which means you
    can add more nodes to a cluster to increase its capacity. However, there are limits
    to how much it can scale.


    One of the main limitations is the number of nodes that can be in a cluster. As
    the number of nodes increases, the overhead of managing the cluster also increases,
    which can impact performance.


    # ## Memory-bound


    SQL Server Analysis Services relies heavily on in-memory processing for performance.
    If the dataset is larger than the available memory, the system must spill data
    to disk, which can significantly slow down queries.


    # ## CPU-bound


    Some queries are CPU-intensive, meaning they require a lot of processing power.
    In these cases, adding more nodes with faster CPUs can help to improve query performance.'
