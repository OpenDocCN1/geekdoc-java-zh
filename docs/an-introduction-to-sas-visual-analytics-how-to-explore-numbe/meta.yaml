  md: '# about this book


    SAS Visual Analytics is a data visualization and application that enables organizations
    to understand and analyze their most important asset: data. There is a wealth
    of information free to users on support.com, from simple blog tips to in-depth
    documentation. All this information can make it much difficult for users to get
    the most from the application, or even


    Our purpose in this book is to provide a quick-start guide for new users who shy
    through the applications; we want to teach you the basics so that you can then
    expand your knowledge with some intermediate and advanced techniques. We want
    to ensure users understand how to get the most from the application for their
    organizations.


    # IS THIS BOOK FOR YOU?


    New users or those with some familiarity with SAS Analytics will find this book
    useful. This book provides a tutorial for new users. It also contains in-depth
    explanations of data visualizations and how to use them effectively.


    If you have the administrative privileges for deploying, configuring, and maintaining
    your SAS Visual Analytics environment, we''ve got covered here as well. Our goal
    is to enhance your understanding of how the software works works so that you can
    readily implement proven practices for efficient operation.


    # PREREQUISITES


    You do not need any previous experience with the Visual Analytics tooltip or SAS
    to use this book. If you are familiar with SAS coding techniques and SAS data
    handling, you might find some areas of the project easier to understand.


    # SCOPE OF THIS BOOK


    This book covers the following topics:


    +   - SAS Visual Analytics 7.3 (and later)

    - SAS Visual Analytics 8.1


    # ABOUT THE EXAMPLES


    # Software used to develop the book''s content


    Reports and explorations for this book were created using the following software:


    +   - SAS Visual Analytics 7.3 (and later)

    - SAS Visual Analytics 8.1

    - SAS Enterprise Guide 7.1 and SAS Studio were used for some preparation in this
    book.


    Most of the data sets were taken from existing sample libraries and no preparation
    was required. These sources are identified at first.


    # Example data and references


    You can access an import package for the Building Your First Report and Your First
    Dashboard chapters by linking to this book to its author page at http://support.sas.com/publishing/authors.
    Select the name of the author. Then click the thumbnail of this book, and select
    Example Code and Data to display the SAS programs that are included in this book.


    The primary references used to write this book were the sections of the online
    documentation for SAS Visual Analytics:'
