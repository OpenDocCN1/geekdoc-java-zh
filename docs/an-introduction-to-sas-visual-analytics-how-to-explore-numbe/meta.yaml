  md: '# element viewer


    # # introducing SAS Viya


    In 2019, its new SAS Viya platform is built to leverage cloud-native integrated
    parallel approach to power SAS analytics that


    is needed today, and SAS Viya is designed to capitalize on the flexibility of
    elastic infrastructure.


    # ## OVERVIEW OF THE SAS VIYA PLATFORM


    The Viya platform is made of many different features, but as can be seen in


    +   - **CAS In-Memory Data Store**: The CAS allows users to load data from previous
    versions into memory for analysis at high speed.

    - **SAS Engine**: The SAS engine is used to create a clear for the CAS to manage
    data sets.


    It is important to note that SAS Viya does not require the SAS Foundation to be
    installed. In many cases it has been possible to run SAS Viya without the SAS
    Foundation.


    ![](bbox=[0.285, 0.275, 0.715, 0.365])


    At this stage of features of SAS Viya, this is just one option of many that are
    available. However, we feel that the statistics and services will continue to
    grow and evolve.


    # ## UNDERSTANDING THE CAS IN-MEMORY ANALYTICS


    To fully realize the capabilities of the CAS service, it''s important to understand
    how it works and how it has evolved analytically over the last several years.


    # ### Introducing parallel architecture


    The first iteration of CAS was based on MPP approach which was introduced in SAS
    9.4. In SAS 9.4, the High-Performance Analytics Server was introduced. SAS Viya
    has introduced improved analytics that can be performed on large datasets.


    The CAS architecture is based on distributed memory architecture, which allows
    data to be loaded into memory where it is distributed across multiple nodes.


    # ### Adding persistence


    The second iteration of CAS was based on the SAS High-Performance Analytics Server.
    In this version, the CAS service was able to persist data to disk and read it
    back when necessary. This is important for performance when not datasets are small
    enough to fit in memory.


    The latest iteration of CAS allows users to scale the environment horizontally
    and manage the environment dynamically. This is possible because CAS is a cloud-native
    service.


    ![](bbox=[0.285, 0.765, 0.715, 0.855])


    # ## MANAGING THE SAS VIYA ENVIRONMENT


    The SAS Environment Manager handles the management of SAS Viya as much as SAS
    9 did. Using the SAS Environment Manager, users can manage the resources and control
    the environment.


    # ### Opening the application'
