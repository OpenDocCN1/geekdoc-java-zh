  md: '# part one getting started


    This part provides a tutorial for SAS Visual Analytics. You will learn how to
    access content through SAS Home. Then you will build a simple report. In the next
    chapter, you will learn the basics for creating a performance dashboard. After
    completing those chapters, you will learn how to load data with the Data Builder.


    +   **Chapter 1 Accessing Content**

    This chapter explains how to use the SAS Home page, which provides a gateway to
    the application features and content. You are guided through the home page features
    and some of the Report Viewer features.


    **Chapter 2 Building Your First Report**

    The chapter is a tutorial for Visual Designer (also known as Report Builder).
    It shows you how to build a simple report and provides an overview of the basic
    product features. Topics include interface overview, adding data, creating a simple
    report, and how to control the report look and feel.


    **Chapter 3 Building Your First Dashboard**

    This chapter is a tutorial for the advanced features in the tool. You are shown
    how to create a performance dashboard that explains how to think about the data,
    determine the best layout, and use extra features.


    **Chapter 4 Using the Data Builder**

    This chapter shows you how to massage and load your data into the SAS LASR Analytic
    Server.'
