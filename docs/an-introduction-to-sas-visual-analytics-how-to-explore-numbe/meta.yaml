    of the applications. The part of this chapter


    # APPLICATION INTRODUCTION


    SAS Analytics provides a complete platform for various analytics, enabling you
    to identify patterns and relationships in data that were not initially obvious.
    All users of skill level can load data, search for analytics patterns, and create
    robust reports and easily visualize data interactively.


    The speed of the features is based on the in-memory performance, high-performance
    analytics engine. Large data tables are loaded into the SAS RAM, which enables
    nearly instant calculations and data analytics. The application supports out-the-web
    server, where users can easily share analytics and reports through a browser or
    mobile device.


    # Understanding in-memory data storage


    A key feature of SAS Analytics is the in-memory storage engine. In in-memory data,
    the application loads the data from the file in the system''s random access memory
    (RAM). The data loaded in RAM, queries, calculations, and analyses are instant.
    The SAS Analytics Server handles this functionality.


    # Understanding the application


    Many new users are confused how the applications work together. The following
    figure shows each application and data travels through each application.


    ![](bbox=[0.095, 0.755, 0.904, 0.83])


    Here''s a brief overview of each application and its purpose. Each of these applications
    is discussed in full chapters.


    +   - SAS Analytics Homepage (SAS Home/Hub)


    This is the entry point to the tool. You can access the content and other applications
    based on your assigned role.


    +   - Report Viewer/BI Visual


    The application enables you to create content such as reports or processes. The
    BI Visual looks similar to the Report Viewer but runs on your mobile device or
    tablet.


    +   - Data Builder'
