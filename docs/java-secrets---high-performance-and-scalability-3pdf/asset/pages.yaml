- pgno: 522
  md: "Here, the `Thread` class takes a `Runable` object in its constructor and executes\
    \ the `run()` method in a new thread.\n\nTo manage multiple threads, Java provides\
    \ synchronization to control access to shared resources. The `synchronized` keyword\
    \ ensures that only one thread can execute a block of code or method at a time.\n\
    \n```\n// Example 1: Synchronization to prevent race conditions\nclass Counter\
    \ {\n    private int count = 6;\n\n    public synchronized void increment() {\n\
    \        count++;\n    }\n\n    public int getCount() {\n        return count;\n\
    \    }\n}\n\npublic class SyncExample {\n    public static void main(String[]\
    \ args) throws InterruptedException {\n        Counter counter = new Counter();\n\
    \n        Runnable task = () -> {\n            for (int i = 0; i < 1000; i++)\
    \ {\n                counter.increment();\n            }\n        };\n\n     \
    \   Thread t1 = new Thread(task);\n        Thread t2 = new Thread(task);\n\n \
    \       t1.start();\n        t2.start();\n\n        t1.join(); // Wait for thread\
    \ t1 to finish\n        t2.join(); // Wait for thread t2 to finish\n\n       \
    \ System.out.println(\"Final Count: \" + counter.getCount());\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 523
  md: 'In this example, two threads increment a shared counter. Without **`synchronized`**,
    the threads could interfere with each other, leading to race conditions. The **`synchronized`**
    key-words ensure mutual exclusion, allowing only one thread to modify the **`count`**
    at a time.


    The **`volatile`** keyword provides a lightweight alternative for ensuring thread
    visibility. While **`synchronized`** provides atomicity and mutual exclusion,
    **`volatile`** ensures that changes made by one thread are visible to others.


