  md: "In this example:\n\n+   1. `HashMap` allows multiple threads to write and read\
    \ concurrently without explicit synchronization.\n\n+   2. The reader thread safely\
    \ iterates through the map even as other threads update it.\n\n**Use proper synchronization\
    \ mechanisms** to protect shared resources. Explicit locks, such as `ReentrantLock`,\
    \ can be used when fine-grained control over locking is needed.\n\nHere is an\
    \ example using `ReentrantLock` to protect a shared counter:\n\n```\nimport java.util.concurrent.locks.ReentrantLock;\n\
    \nclass Counter {\n    private final ReentrantLock lock = new ReentrantLock();\n\
    \    private int count = 0;\n\n    public void increment() {\n        lock.lock();\n\
    \        try {\n            count++;\n        } finally {\n            lock.unlock();\n\
    \        }\n    }\n\n    public int getCount() {\n        lock.lock();\n     \
    \   try {\n            return count;\n        } finally {\n            lock.unlock();\n\
    \        }\n    }\n}\n\npublic class ReentrantLockExample {\n    public static\
    \ void main(String[] args) throws InterruptedException {\n        Counter counter\
    \ = new Counter();\n        for (int i = 0; i < 1000; i++) {\n            new\
    \ Thread(() -> {\n                try {\n                    counter.increment();\n\
    \                } catch (InterruptedException e) {\n                    e.printStackTrace();\n\
    \                }\n            }).start();\n        }\n        Thread.sleep(1000);\n\
    \        System.out.println(\"Final count: \" + counter.getCount());\n    }\n\
    }\n```"
