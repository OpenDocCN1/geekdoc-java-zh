- pgno: 521
  md: "**`start()`** method initiates a new thread and calls the **`run()`** method.\
    \ Avoid calling **`run()`** directly, as it will not create a new thread but execute\
    \ in the main thread.\n\nA better way to define threads is through the **`Runnable`**\
    \ interface, which decouples the thread's behavior from its execution.\n\n```\n\
    1 // Example 2: Creating a thread using Runnable interface\n2 class MyRunnable\
    \ implements Runnable {\n3     public void run() {\n4       System.out.println(\"\
    Runnable is running: \" + \n          Thread.currentThread().getName());\n5  \
    \ }\n6 }\n7 \n8 public class RunnableExample {\n9     public static void main(String[]\
    \ args) {\n10      Thread t1 = new Thread(new MyRunnable());\n11      t1.start();\n\
    12  }\n13 }\n```"
