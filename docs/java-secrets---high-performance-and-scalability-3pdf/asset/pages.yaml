    \ of thread creation and destruction.\n\n+   3. `shutdown()` ensures that the\
    \ executor stops accepting new tasks.\n\n**Avoid blocking operations where possible**.\
    \ Blocking operations like I/O or waiting for locks can degrade performance. Instead,\
    \ use non-blocking constructs like ``tryLock` with timeouts or concurrent queues.\n\
    \nHere is an example using `tryLock` with a timeout to avoid indefinite blocking:\n\
    \n```\nimport java.util.concurrent.*;\nimport java.util.concurrent.locks.*;\n\n\
    class TryLockExample {\n    private final ReentrantLock lock = new ReentrantLock();\n\
    \n    public void doSomething() {\n        try {\n            if (lock.tryLock(5,\
    \ TimeUnit.SECONDS)) {\n                try {\n                    System.out.println(Thread.currentThread().getName()\
    \ + \" is doing work\");\n                    Thread.sleep(5000);\n          \
    \      } finally {\n                    lock.unlock();\n                }\n  \
    \          } else {\n                System.out.println(Thread.currentThread().getName()\
    \ + \" did not acquire the lock\");\n            }\n        } catch (InterruptedException\
    \ e) {\n            Thread.currentThread().interrupt();\n        }\n    }\n}\n\
    \nclass NonBlockingExample {\n    public static void main(String[] args) {\n \
    \       Thread thread1 = new Thread(() -> {\n            System.out.println(\"\
    Thread-1 started\");\n            Thread.sleep(2000);\n        }, \"Thread-1\"\
    );\n        Thread thread2 = new Thread(() -> {\n            System.out.println(\"\
    Thread-2 started\");\n            Thread.sleep(2000);\n        }, \"Thread-2\"\
    );\n        thread1.start();\n        thread2.start();\n    }\n}\n```"
