    # 3.5.1 - wait(), notify(), and notifyAll()


    The `wait()`, `notify()`, and `notifyAll()` methods are core components of inter-thread
    communication in Java. These methods belong to the `Object` class and are used
    to synchronize threads and enable coordination between a producer and a consumer,
    or between threads that share a common resource. They are particularly useful
    in preventing race conditions and achieving orderly execution of threads. These
    methods must always be used inside a `synchronized` block or method, as they rely
    on the intrinsic lock of the object.'
