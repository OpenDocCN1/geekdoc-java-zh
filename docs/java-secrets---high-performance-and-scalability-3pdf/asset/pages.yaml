    # ### Generational Memory Allocation


    The heap in Java is divided into **Young Generation**, **Old Generation**, and
    **Metaspace**. Generational allocation is designed to optimize garbage collection
    by focusing on short-lived objects.


    +   1. **Young Generation**: Newly created objects are allocated in the **Eden
    Space**. Surviving objects are moved to **Survivor Spaces (S0 and S1)**.**'
