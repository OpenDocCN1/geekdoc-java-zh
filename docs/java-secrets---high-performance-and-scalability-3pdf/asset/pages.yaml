    +   1. `-Xms512m` sets the initial heap size to 512 MB.

    2. `-Xmx512m` sets the maximum heap size to 512 MB.

    3. `-XX:+PrintGCDetails` enables detailed GC logs.

    4. `-XX:+PrintGCTimestamps` prints timestamps for each GC event.


    The logs provide information about **Minor GC**,, **Major GC**,, and **pause times**,
