  md: 'Memory pools are a powerful strategy to optimize memory usage by reusing pre-allocated
    objects instead of frequently creating and destroying them. In Java, creating
    objects dynamically with `new` incurs allocation overhead, and garbage collection
    introduces performance costs when reclaiming memory. Memory pools minimize these
    issues by reusing objects, reducing garbage collection pressure and improving
    application performance.


    The fundamental idea behind a memory pool is to maintain a **pool of reusable
    objects**. When an object is needed, the program retrieves it from the pool rather
    than allocating a new one. Once the object is no longer in use, it is returned
    to the pool for reuse instead of being destroyed. This approach is particularly
    effective for objects that are expensive to create or frequently used.


