    # 3.2.1 - Thread Class and Runnable Interface


    Threads in Java can be implemented using either the **`Thread`** class or the
    **`Runnable`** interface. Both approaches provide flexibility to execute tasks
    concurrently, allowing programs to perform multiple operations simultaneously.
    The **`Thread`** class represents an independent thread of execution, while the
    **`Runnable`** interface decouples task logic from thread creation, making it
    a more versatile choice.


    To create a thread using the **`Thread`** class, you need to extend the class
    and override its **`run()`** method. The **`run()`** method contains the code
    that will execute in the new thread.'
