- pgno: 525
  md: "In this example, a fixed thread pool of size 3 executes three tasks concurrently.\
    \ **ExecutorService** ** manages the lifecycle of threads, including their creation,\
    \ reuse, and shutdown.\n\nThread pools are critical for performance when dealing\
    \ with a large number of tasks. Creating new threads repeatedly is costly, and\
    \ thread pools help by reusing existing threads.\n\nConcurrency control is also\
    \ achieved using classes like `ReentrantLock` **, which provide more flexible\
    \ locking mechanisms than ** `synchronized` **.\n\n```\n```java\n// Example 8:\
    \ ReentrantLock\nimport java.util.concurrent.locks.*;\nimport java.util.concurrent.locks.ReentrantLock;\n\
    \nclass Sample {\n    private int count = 0;\n    private final ReentrantLock\
