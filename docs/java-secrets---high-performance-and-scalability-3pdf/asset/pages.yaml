    # 3.7.2 - Livelocks and Starvation


    Livelocks and thread starvation are concurrency issues that can degrade application
    performance and responsiveness. A **livelock** occurs when two or more threads
    keep responding to each other’s state but make no progress. In contrast, **thread
    starvation** happens when a lower-priority thread is unable to gain access to
    resources because higher-priority threads monopolize. Both issues can cause significant
    delays and inefficiencies in multi-threaded programs. Understanding how to identify
    and prevent these issues is critical for building scalable and reliable systems.


    Here is an example of a livelock where two threads repeatedly give up execution
    to allow the other thread to proceed, but neither makes progress:'
