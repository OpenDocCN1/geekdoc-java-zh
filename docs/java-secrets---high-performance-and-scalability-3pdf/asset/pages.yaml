- pgno: 520
  md: 'Java''s threading model and concurrency control provide the building blocks
    for achieving parallelism in modern applications. At the heart of Java''s threading
    system is the ** `Thread` ** class, which allows the execution of tasks concurrently.
    However, as programs become more complex, ensuring proper coordination between
    threads becomes challenging. This chapter dives into the Java threading model,
    explains core concurrency concepts, and explores best practices through practical
    examples.


    Java threads can be created in two ways: by extending the ** `Thread` ** class
    or by implementing the ** `Runnable` ** interface. In general, using the `Runnable`
    interface is preferred as Java does not allow multiple inheritance.


    ```

    1 // Example 1: Creating a thread by extending Thread class

    2 class MyThread extends Thread {

    3     public void run() {

    4         System.out.println("Thread is running: " + +

    Thread.currentThread().getName());

    5     }

    6 }

    7

    8 public class ThreadExample {

    9     public static void main(String[] args) {

    10        MyThread t1 = new MyThread();

    11        t1.start(); // Start the thread

    12    }

    13 }

    ```'
