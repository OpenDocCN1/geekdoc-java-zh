- pgno: 26
  md: 'In this output, you can see the JVM instructions such as `aload_0`, `invokespecial`,
    and `getstatic`. Each of these instructions is part of the JVM bytecode and is
    executed by the JVM at runtime. The JVM bytecode is a low-level set of instructions
    that are specific to the Java platform but independent of the hardware.


    The JVM executes bytecode using one of two approaches: interpretation or Just-In-Time
    (JIT) compilation. When the program runs for the first time, the JVM interprets
    the bytecode line by line, which can be slower. To improve performance, the JVM
    uses the JIT compiler to translate frequently executed bytecode into native machine
    code. This allows the program to run much faster.


    You can observe the effect of JIT compilation by running a simple program that
    repeatedly executes the same method:'
