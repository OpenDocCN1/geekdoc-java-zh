    \ value\n    FruitEnum fruit = Fruit.ORANGES; //the enum choice is assigned as\
    \ a value\n    void enumChooser(FruitEnum fruit) {\n        //this method takes\
    \ an enum choice as a parameter\n    }\n    FruitEnum fruitGetter() {\n      \
    \  return FruitEnum.BANANAS;\n    }\n    //The return value for this method is\
    \ an enum\n}\n```\n\nEnumerators appear either inside of classes or as their own\
