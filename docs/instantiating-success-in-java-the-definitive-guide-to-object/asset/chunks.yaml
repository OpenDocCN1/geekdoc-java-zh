    The concepts in this book appear will appear throughout the major frameworks and
    libraries that you encounter. You will eventually be able to understand these
    programming concepts by their syntax alone, as well as implement them in your
    own code, and it is encouraged that you do so.


    When it comes to practice, the old adage, the more the merrier is certainly true.
    There really is no better way to gain familiarity with an idea than to put it
    into practice as often as possible. When it comes to production or project code,
    however, you must also gain the skill to determine when such features add anything
    other than clutter. Of course, this is a topic for another time.


