    System.out.println(coordinate2.getGlobalY());\n\n//现在它们都是十了\n\n}\n```\n\n无论我们使用哪一个引用变量，它们都指向同一对类成员。\n\
    \n## 3.4 静态内存与实例内存\n\n我们编写的代码预测了两种不同的运行时场景。在一种情况下，我们的类被加载并初始化到 `JVM` 中，其静态方法和变量已经是可以访问的。\n\
    \n在第二种场景下，类以对象的的形式存在。在类的实例外部，我们使用引用变量来引用内存对象。在实例化的类内部，未标记为 `static` 的成员只有在实例化时才会存在并运行。\n\
    \n下方的示例类展示了同一个类的实例成员和类成员的行为并不相同。\n\n```java\npublic class MemberExample {\n  \
    \  static int staticVar;\n    int instanceVar;\n\n    public static void staticMethod()\
    \ {\n        staticVar +=1;        // 可以工作\n        instanceVar +=1;     // 无法工作\n\
    \        instanceMethod();     // 无法工作\n    }\n\n    public void instanceMethod()\
    \ {\n        staticVar += 1;           // 可以工作\n        this.instanceVar += 1;\
    \   // 可以工作\n        staticMethod();  // 可以工作\n    }\n}\n```\n\n`MemberExample`\
    \ 类不包含任何引用变量，但你仍然可以看到哪些被标记为 `static`，哪些不是。这两个静态成员可以立即访问，尽管在没有实例变量的情况下，它们无法与实例成员进行交互。实例变量可以保证当我们调用静态方法时，它作用于一个内存中已经存在的实例成员。\n\
    \n不过，实例成员非常不同，当我们编写它们时，我们隐含地表示我们在某个时刻一定会有该类的实例，以便它可以执行我们指定的动作。这就是为什么它要灵活得多。\n\n\
    ## 3.5 “this” 关键字\n\n你可以使用 `this` 关键字来区分实例变量和同名的参数。书中的示例经常使用该关键字，但你可以选择不使用，并保持实例变量和方法参数的名称不同。\n\
    \n```java\npublic class Example {\n    public int value;\n\n    static void valueSetter(int\
    \ value) {\n        this.value = value;\n        // 无法工作！\n    }\n\n    void numberSet(int\
    \ value) {\n        this.value = value;\n        // 这可以工作\n    }\n}\n```\n\n你甚至可以使用\
    \ `this` 关键字引用当前类的实例变量。这看起来是一件奇怪的事情，但有时你会遇到构造函数不可用的类实例。\n\n```java\npublic class\
    \ Example {\n    public Example instanceGetter() {\n        return this;\n   \
    \ }\n}\n```\n\n类没有地址，但实例有地址，因此 `this` 唯一可以引用的就是实例本身。这就是为什么返回类型与类相同。调用该方法将返回一个引用。\n\
    \n***\n\n关于类和对象我们有很多需要学习的。了解类成员和实例成员的区别是有好处，但如果你从这一章中只记住一件事，那应该是类是由用户定义的。\n\n\
    * 类定义了类型。\n* 类以文件的形式存在。\n* 对象以实例的形式存在于内存中。\n* 类内部的所有内容都不会变成对象。\n* 静态方法在没有实例变量的情况下无法访问实例成员。\n\
    * 实例方法可以自由访问类成员和实例成员。\n* 访问修饰符等内容适用于实例成员和类成员。\n\n在下一章中，我们将运用所学知识并开始使用实例变量。\n\n\
    # 第 4 章：对象引用\n\n我们在 Java 中编写的几乎所有代码都会以某种方式访问、创建或存储引用变量。当我们通过字段或方法接收一个引用变量时，我们允许一个类的实例与另一个实例交互。正是通过这个过程，聚合或组合等编程技术才成为可能。在本章中，我们将通过存储实例引用将简单对象组合更大的对象。我们还将学习空引用如何引起问题，以及我们检查它们的一种方法。\n\
    \n## 4.1 按值传递还是引用传递\n\n在继续之前，值得解决一个感知内存的程序员在创建对象并将引用变量从一个位置移动到另一个位置时所关注的的问题。\n\
    \nJava 是一种按值传递的语言，我们用于发送、存储和接收的值仅仅是内存位置的地址。这就像将地址保存到文本文件中。它有一定的大小，但与页面上所有的图像相比是微不足道的。请放心，在\
    \ Java 中传递对象是廉价的，这是一件好事，因为随着我们的成长，我们会经常这样做。\n\n"
- fmt: "\nOur final method, `echoLine` calls the `pointString` method once for each\
    \ point reference variable and constructs a string, then prints them both. That\
    \ is the entirety of our `LineUtils` class. Note how some of the methods are private.\
    \ This is because we do not want to call them in the wrong order and try to print\
    \ the values before we have them.\n\n```java\npublic class Main {\n    public\
    \ static void main(String[]args) {\n        Line2D line = LineUtils.lineInit(2,8,10,5);\n\
    \        LineUtils.echoLine(line);\n    }\n}\n```\n\nThis is all it takes to interact\
    \ with the `Point2D` and `Line2D` classes. We do not even directly call their\
    \ constructors to make the objects and send them where they need to go. It is\
    \ worth noting that keeping the instantiation details separate does not always\
    \ make sense and we could put the static methods inside of the line and point\
    \ classes themselves, but you will see a better way to instance classes in the\
    \ next chapter.\n\n## 4.4 Null References\n\nInstancing the `Line2D` class and\
    \ then printing it requires three object references. If we were to write the `lineInit`\
    \ method and forget to instance one or both of the `Point2D` objects, then the\
    \ program would not compile and we would likely see an error in our IDE regarding\
    \ null references.\n\nThe `null` keyword in Java allows us to do a few different\
    \ things with object reference variables. First, let us use `null` to simulate\
    \ a missing object reference.\n\n```java\npublic class Main {\n    public static\
    \ void main(String[]args) {\n        Line2D line = LineUtils.lineInit(2,8,10,5);\n\
    \        line.point1 = null;\n        LineUtils.echoLine(line);\n        //this\
    \ code will fail\n    }\n}\n```\n\nWe used the `null` keyword to set one of the\
    \ line object’s points to `null`. The code will now fail to compile because an\
    \ essential component is missing. We may now use the same keyword as a test condition\
    \ to safeguard against such scenarios as shown in the code below.\n\n```java\n\
    public class LineUtils {  //...\n    public static void echoLine(Line2D line)\
    \ {\n        if(line.point1 == null || line.point2 == null) {\n            System.out.println(\"\
    the line is null!\");\n        } else {\n            String p1 = pointString(line.point1);\n\
    \            String p2 = pointString(line.point2);\n            System.out.println(p1+\"\
    \\n\"p2);\n        }\n    }\n}\n```\n\nNow when we call the method with a `null`\
    \ object reference the program will still compile. We could even set the conditional\
    \ statement to call constructors for us and fill any empty reference variables.\n\
    \nAs we start creating and instancing classes, we must manage their memory objects\
    \ through reference variables. We will do this all the time in Java and the practice\
    \ allows for some very intricate programs so long as we remember to fill our reference\
    \ variables as needed.\n\n* Object references are cheap to send, receive and store.\n\
    * Both methods and constructors may return object references.\n* One object reference\
    \ may rely on others in order to function correctly.\n* Empty reference variables\
    \ are `null` and introduce a set of problems we must be wary of.\n\nWith this\
    \ chapter finished, we will move on to constructors and how we can leverage them\
    \ to automate more instantiation and prevent null references.\n\n## CHAPTER 5:\
    \ CONSTRUCTORS\n\nWhen you write a new class you are also writing a new default\
    \ constructor. You may instance your class with the provided default constructor,\
    \ or you may write your own in order to customize instantiation itself.\n\nIn\
    \ this chapter you will see a few different ways to write default constructors\
    \ and how they help to automate, limit, and even prohibit class instantiation.\n\
    \n## 5.1 Default Initializer\n\nDefault initializers run when we instantiate classes.\
    \ This variation of the default constructor is the simplest, as it is a simple\
    \ expansion of the constructor with some added code between a pair of curly braces.\
    \ Note how it begins to look similar to a method.\n\nHere is our old `Line2D`\
    \ class from the previous chapter:\n\n```java\npublic class Line2D {\n    Point2D\
    \ point1;\n    Point2D point2;\n}\n```\n\nNow the class again but with a simple\
    \ default initializer.\n\n```java\npublic class Line2D {\n    Point2D point1;\n\
    \    Point2D point2;\n    public Line2D() {\n        point1 = new Point2D;\n \
    \       point2 = new Point2D;\n    }\n}\n```\n\nThis code is far more concise\
    \ and convenient than the clunky set of static methods we used in the old `LineUtils`\
    \ class. We will always have this pair of blank `Point2D` objects in all instances\
    \ of `Line2D`, so there is now no more risk of null references in this class.\n\
    \nWe know that we may run enough code from the constructor to instance other classes.\
    \ How about running our own methods? Surprisingly, it is possible to run instance\
    \ methods from the constructor itself as you will see this next example.\n\n```java\n\
    public class Line2D {\n    Point2D point1;\n    Point2D point2;\n    public Line2D()\
    \ {\n        point1 = new Point2D;\n        point2 = new Point2D;\n        echoInstantiation();\n\
    \    }\n    public void echoInstantiation() {\n        System.out.println(\"Line2D\"\
    );\n    }\n}\n```\n\nWe have already saved a lot of work by using constructors.\
    \ Let us customize our further to see what they do.\n\n## 5.2 Parameterized Constructors\n\
    \nYou may parameterize a constructor like a method. The arguments you supply may\
    \ be used just like a setter method, to fill fields during creation. We will add\
    \ a constructor to the `Point2D` class.\n\n```java\npublic class Point2D {\n \
    \   float x;\n    float y;\n    public Point2D(float x, float y) {\n        x\
