  trans: "\n该工具类现在将接收兼容的对象引用并打印结果。它还将通过 `moveShape` 方法修改你类的坐标。\n\n你可能决定继续此示例，并添加更多用于比较和修改三维对象的方法。也可以编写额外的对象以增加多样性。就示例而言，我们已经完成了形状类的部分，但泛型部分还没有结束。\n\
    \n# 第 11 章：泛型类型 II - 泛型接口\n\n在最后一个章节中，我们将继续学习泛型，并用另一个示例作为结束。在这里，我们将泛型、接口和抽象方法结合起来。通过使用这三者，我们将看到\
    \ Java 抽象的完整威力。\n\n让我们开始。\n\n## 11.1 泛型接口\n\n泛型类和接口之间存在一些关键区别。首先，我们已经知道对于接口的每种实现，其行为可能会不同。泛型接口更进一步，允许我们在类中每次实现它们时都指定一个类型参数。\n\
    \n首先，我们将编写一个名为 `ItemBox` 的类，它包含一个必须扩展或实现 `Item` 的类型变量。\n\n```java\npublic class\
    \ Item{}\n```\n\n在这些示例中，我们不需要填充类的细节。\n\n```java\npublic interface ItemBox<T extends\
    \ Item> {  ///  }\n```\n\n当我们编写 `ItemStorage` 类时，我们使用 `Interface` 作为 `T` 的类型绑定。\n\
    \n```java\npublic class ItemStorage implements ItemBox<Item> { }\n```\n\n我们在这里实现接口并填充类型参数，而不是在实例化时。如果你将所有的接口要求都视为实现类的责任，那么这个规则将很容易记住。\n\
    \n```java\npublic class Main {\n    public static void main(String[]args) {\n\
    \        ItemStorage storage = new ItemStorage();\n    }\n}\n```\n\n当一个类在拥有自己的类型变量的同时实现一个泛型类型变量时，看起来可能有些复杂，但一旦我们处理了接口的类型参数，就可以像往一样实例化泛型类了。\n\
    \n```java\npublic class ItemUtils {}\n\npublic class ItemStorage<T extends ItemUtils>\
    \ implements ItemBox<Item> {\n    T utils;\n}\n```\n\n在这里，我们在实例化时必须先填充接口的类型参数，然后是类的类型参数。\n\
    \n```java\npublic class Main {\n    public static void main(String[]args) {\n\
    \        ItemStorage<ItemUtils> storage = new ItemStorage<>();\n    }\n}\n```\n\
    \n泛型接口允许我们为它们出现的每个类设置不同的类型参数。这使得我们的接口比以前更具可用性。\n\n在下一节，我们将为 `ItemBox` 添加一些泛型抽象方法。\n\
    \n## 11.2 泛型抽象方法\n\n泛型抽象方法与普通泛型方法没有太大区别。参数化类型要么通过接口的类型参数解析类型数据，要么使用与非抽象方法相同的类型推断过程来自己处理。\n\
    \n这里是一个示例，同一个类型变量出现在接口和方法的参数中。方法的类型变量从接口获取其绑定。\n\n```java\npublic interface ItemBox<T\
    \ extends Item> {\n    void setItem(T item);\n    T getItem();\n}\n```\n\n这两个简单的泛型方法将使用类型变量\
    \ `T` 来确定它们将接受和返回什么对象引用。在这里它们在 `ItemStorage` 类中实现。\n\n```java\npublic class ItemStorage\
    \ implements ItemBox<Item> {\n    Item item;\n    @Override\n    void setItem(Item\
    \ item) {\n        this.item = item;\n    }\n    @Override\n    Item getItem()\
    \ {\n        return this.item;\n    }\n}\n```\n\n方法从其接口的实现获取 `Item` 参数。如果我们移除接口的类型变量，我们就必须像下面的示例一样指定两个泛型类型边界。\n\
    \n```java\npublic interface ItemBox {\n    <T extends Item> void setItem(T item);\n\
    \    Item getItem();\n}\n```\n\n我使用了 `Item` 作为 `getItem` 类的返回类型。我们可以做的另一件事是将接口的参数加回接口，或者将\
    \ `getItem` 方法移动到另一个接口，其中类型参数属于接口且返回类型将不会产生义。\n\n```java\npublic interface ItemBox\
    \ {\n    <T extends Item> void setItem(T item);\n}\npublic interface ItemCollector<I>\
    \ {\n    I getItem();\n}\n```\n\n要使用这两个方法，我们只需要在 `ItemStorage` 类中实现这两个接口即可。\n\n\
    ```java\npublic class ItemStorage implements ItemBox, ItemCollector<Item> {\n\
    \    Item item;\n    @Override\n    Item getItem() {\n        return this.item;\n\
    \    }\n    @Override\n    void setItem(Box<Item> m) {\n        this.item = m;\n\
    \    }\n}\n```\n\n## 11.3 最终示例\n\n使用接口有无数种方法，也有许多细节需要涵盖。我们在这一节中将做的是展示如何以不同的方式实例化泛型。\n\
    \n首先，我们将创建一个 `enum` 来标记可保存和可打印的。\n\n```java\nenum MessageTypes {\n    SAVE, PRINT;\n\
    }\n```\n\n现在我们将创建一个 `TextItem` 类，它持有两种状态之一。\n\n```java\npublic class TextItem\
    \ {\n    String text;\n    MessageTypes type;\n    public TextItem(String msg,\
    \ MessageTypes type) {\n        this.text = msg;\n        this.type = type;\n\
    \    }\n}\n```\n\n我们需要一种方法用不同的类型调用相同的方法。\n\n```java\npublic interface TextConsumer<T\
    \ extends TextItem> {\n    void processText(T text);\n}\n```\n\n我们第一个实现 `TextConsumer`\
    \ 的类将很简单。它所做的就是接收文本将其打印到我们的终端。\n\n```java\npublic class MessageReader implements\
    \ TextConsumer<TextItem> {\n    @Override\n    public void processText(TextItem\
    \ item) {\n        System.out.println(item.text);\n    }\n}\n```\n\n这并没有证明使用抽象方法的合理，所以让我们添加另一个类，用于处理设置为\
    \ SAVE 的消息。它会复杂一些，并且需要从 `JDK` 导入一些。\n\n```java\nimport java.io.IOException;\n\
    import java.io.FileWriter;\n\npublic class MessageWriter implements TextConsumer<TextItem>\
    \ {\n    String path;\n    String text;\n    FileWriter write;\n    public MessageWriter(String\
    \ path) {\n        this.path = path;\n    }\n    @Override\n    public void processText(TextItem\
    \ item) {\n        try {\n            write = new FileWriter(this.path, true);\n\
    \            // 'true' 意味着它将追加文本\n            write.write(item.text);\n      \
    \      write.close();\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n"
