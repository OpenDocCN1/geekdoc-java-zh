  trans: "\n\n```java\npublic class Main {\n    public static void main(String[]args)\
    \ {\n        ShapeManager3D shape3d = new ShapeManager3D(5);\n        shape3d.shapes[0]\
    \ = new Cube(5);\n        shape3d.shapes[1] = new Sphere(10);\n        shape3d.shapes[2]\
    \ = new Cylinder(5);\n        shape3d.shapes[3] = new Cube(7);\n        shape3d.shapes[4]\
    \ = new Sphere(3);\n        shape3d.reportAll();\n    }\n}\n```\n\n我们的三个新形状都共享一个通用的\
    \ `Calculate3D` 接口，因此这是我们用于数组的类型。\n\n我们可能会添加更多的三维形状，并让它们实现 `Calculate3D` 接口。这样我们就可以在不类继承的情况下，通过许多不同的对象引用调用\
    \ `calculateVolume` 和 `calculateArea` 方法。\n\n我们的示例程序只展示了接口带给我们的部分功能。我们可以创建几个抽象类，让它们实现全部、部分或不实现接口的抽象方法。我们甚至可以创建抽象类的子类，使得每个子类实现的比上一个类更多的抽象方法。\n\
    \n总结一下：\n\n*   实现和继承是分开的，但它们仍然允许我们共享通用类型。\n*   抽象类实现接口中的抽象方法是可选的。\n*   一个类可以实现多个接口。\n\
    *   接口可以通过多重继承相互扩展。\n\n完成本章后，我们将继续学习接口，并将其与泛型结合。\n\n# 第 9 章：泛型 I\n\n当你用一个类扩展另一个类时，该子类就获得了其父类的类型。如果子类、父类或两者都实现了一个或多个接口，那么子类也将获得该类型数据。以\
    \ `Sphere` 类为例。它是一个实现了多个接口（通过接口扩展）的父类的子类。\n\n就类型而言，我们知道 `Sphere` 类具有以下类型：\n\n\
    *   `Sphere`\n*   `Rounded3D`\n*   `CalculateVolume`\n*   `CalcluateArea`\n\n\
    我们有四种不同的类型可以设置为方法参数或变量类型。\n\n随着程序中添加越来越多的类和接口，在何处方法参数和实例变量声明引用类型时，我们预期的类型就变得模糊了。我们想要\
    \ `Sphere` 是因为它是圆的吗？也许我们只是想要一个具有周长或体积的对象。\n\n我们受益于一种语法，它可以帮助我们说明：接受一个扩展此类并实现这些接口的引用类型。幸运的是，Java\
    \ 的泛型为我们提供了一种高效且类型安全的方法来实现这一点。\n\n整章都是关于泛型的以及它们如何帮助我们处理多个引用类型的。当你读完这个相当长的章节后，我们将回到\
    \ 3D 形状来应用所学知识。\n\n## 9.1 泛型增长的需求\n\n假设我们正在添加两个新的 3D 形状类。每个类都实现一个名为 `HasCoordinates`\
    \ 的新接口。现在我们既有旧的 3D 形状也有这些新的移动形状，我们希望规划未来，以便添加更多形状以及可能用于颜色或图像数据的其他接口。\n\n我们将拥有某个类、某个字段或它们任意组合引用类型的字段和方法。我们可以通过更多的接口和继承将类分组，但向程序中添加更多类型只会让事情变得混乱。我们要做的的是使用泛型来明确什么放在什么位置。\n\
    \n## 9.2 边界泛型类型\n\n泛型允许我们在尖括号对中指定特定的类型数据。你可能以前见过这种语法，其中某些大写字母表示未知的元素或值。这些字母仅仅是一种命名规范，我们通常使用\
    \ `T` 表示类型，`E` 表示元素，`K`、`V` 表示键值对等等。\n\n这些单字母类型变量仅仅是变量。它们只是实际类或接口名称的占位符。当我们作为引用变量引用该类时（例如在实例化期间），泛型变量会被替换为真实的类型参数。\n\
    \n```java\npublic class ShapeUtils <T> {\n    T shape3D;\n}\n```\n\n这个泛型类有一个名为\
    \ `T` 的类型参数。当我们实例化该类时，必须提供一个实际的类型参数来填充泛型类的类型参数。\n\n```java\npublic class Main\
    \ {\n    public static void main(String[]args) {\n        ShapeUtils<MovingSphere>\
    \ mSphereUtils = new ShapeUtils<>();\n    }\n}\n```\n\n编写和使用泛型类型类只需要这些，尽管这个泛型类并不完全是我们想要的。\n\
    \n当我们将泛型变量设置为如 `T` 这样的单个字母时，我们可以提供任何类型作为参数。有时我们想要这样，但这种无边界类型缺乏特定性。为了限制我们可以作为泛型参数提供的内容，我们可以指定一个边界。\n\
    \n```java\npublic class ShapeUtils <T extends Calculate3D> {\n    T shape3D;\n\
    }\n```\n\n现在我们添加了一个泛型 `T`，我们作为此类参数提供的任何内容必须扩展或实现 `Calculate3D`。下面是 `ShapeUtils`\
    \ 使用两个不同参数的示例。\n\n```java\npublic class Main {\n    public static void main(String[]args)\
    \ {\n        MovingCube mCube = new MovingCube();\n        MovingSphere mSphere\
    \ = new MovingSphere();\n        ShapeUtils<MovingCube> mSphereUtils = new ShapeUtils<>();\n\
    \        mSphereUtils.shape3D = mSphere; // 这将不起作用\n\n        ShapeUtils<MovingSphere>\
    \ mSphereUtils = new ShapeUtils<>();\n        mSphereUtils.shape3D = mCube; //\
    \ 这两个都不行\n    }\n}\n```\n\n上面的示例表明，尽管 `MovingCube` 和 `MovingSphere` 类型参数对 `T`\
    \ 来说是有效的，但在提供了类型参数后，它们之间不能相互互换。原因是 Java 采用了一种类型擦除，删除了我们指定为类型参数之外的所有类型数据。\n\n类型擦除是一个相当技术的过程，超出了本书的范范围。我们在这里只需要知道它是既类型安全又高效的，因为它消除了\
    \ Java 编译器的猜测。\n\n## 9.3 边界泛型类型\n\n我们已经写了一个带有单个类型边界的泛型类型参数。现在我们将通过添加另一个边界来进一步限制\
    \ `T` 的类型参数。为了展示多个类型边界如何帮助我们，我们再次回到 `ShapeUtils` 类并修改泛型类型变量，使其绑定多个类型。我们在类型变量的每个额外边界之间使用和符号\
    \ `&` 运算符。\n\n```java\npublic class ShapeUtils<T extends RoundedShape & HasCoordinates>\
    \ {\n    T shape;\n    public ShapeUtils(T shape) {\n        this.shape = shape;\n\
    \    }\n}\n```\n\n在指定多个类型边界时，我们必须注意几条规则。如果边界中的任何一个是类名，那么该名称必须排在第一。类名之后的所有内容必须是接口，因为我们不能命名一个扩展两个类的类型。\n\
    \n"
- fmt: "\nAny type that we substitute for `T` must implement or inherit everything\
    \ in the type parameter list. Generics demand that type arguments satisfy all\
    \ bounds, not just some, and this is good because we want specificity.\n\n```java\n\
    public class Main {\n    public static void main(String[]args) {\n        MovingCube\
    \ mCube = new MovingCube();\n        Cube normalCube = new Cube();\n        MovingSphere\
    \ mSphere = new MovingSphere();\n        ShapeUtils<MovingCube> mCubeUtils = new\
    \ ShapeUtils<>(mCube)\n        //this is exactly what we want\n        ShapeUtils<MovingSphere>\
    \ mSphereUtils = new ShapeUtils<>(mSphere)\n        //this will work with the\
    \ movable sphere too\n        ShapeUtils<Cube> mCubeUtils = new ShapeUtils<>(normalCube)\n\
    \        //this does not satisfy generic type requirements\n        ShapeUtils<MovingCube>\
    \ mCubeUtils = new ShapeUtils<>(normalCube)\n        //the type parameter is right,\
    \ but a normal cube will not work!\n    }\n}\n```\n\nWe have effectively filtered\
    \ out non-moving 3D shapes by specifying that they must also implement the `HasCoordinates`\
    \ interface.\n\n## 9.4 Type Bound Generic Methods\n\nMethods may also have type\
    \ parameters and there are two ways to specify them. One way is to share a generic\
    \ class `variable` with our methods. The other way is to have our methods declare\
    \ the type variables and bounds for themselves. In either scenario, we do not\
    \ supply type arguments to methods when we call them.\n\n```java\npublic class\
    \ ShapeUtils<T extends Calculate3D & HasCoordinates> {\n    T currentShape;\n\
    \    void setShape(T shape3D) {\n        this.currentShape = shape3D;\n    }\n\
    \    T getShape() {\n        return this.currentShape;\n    }\n}\n```\n\nNote\
    \ how the method type variables are bare and not trapped between angled braces\
    \ because they are defined elsewhere.\n\nWe would instance the class the same\
    \ as in previous examples. Sending object references to either generic methods\
    \ requires no extra steps, though we are still limited to the sending references\
    \ specified by the class’ type argument.\n\n```java\npublic class Main {\n   \
    \ public static void main(String[]args) {\n        MovingCube mCube = new MovingCube();\n\
    \        ShapeUtils<MovingCube> mCubeUtils = new ShapeUtils<>()\n        mCubeUtils.setShape(mCube);\n\
    \        MovingCube duplicateRef = getShape();\n    }\n}\n```\n\nOnce the `ShapeUtils`\
    \ class knows the exact type, so do our methods. This is pretty simple. Now let\
    \ us try removing the class’ type variable and bounds so that the methods specify\
    \ their own generic type variables.\n\n```java\npublic class ShapeUtils {\n  \
    \  <T1 extends HasCoordinates & CalculateArea> void echoCoordinates(T1 shape)\
    \ {\n        //...\n    }\n    <T2 extends CalculateVolume> void echoVolume(T2\
    \ shape) {\n        //....\n    }\n}\n```\n\nNote that now we need the angled\
    \ brackets for the method type variables because the methods themselves are generic.\
    \ We may use the same ampersand operator to add additional types.\n\n```java\n\
    public class Main {\n    public static void main(String[]args) {\n        ShapeUtils\
    \ sUtils = new ShapeUtils();\n        MovingCube mCube = new MovingCube();\n \
    \       sUtils.echoCoordinates(mCube);\n        sUtils.echoVolume(mCube);\n  \
    \  }\n}\n```\n\nGeneric methods behave very much like normal methods because type\
    \ requirements are resolved during the method’s call using Java’s built-in type\
    \ deduction process.\n\nWhy are there no generic return values? Our first example\
    \ used the class’ type variable to determine a desired type. The instance methods\
    \ use that type so it is clear what they must return. In the case of methods with\
    \ their own type variables, things are more difficult. The methods need some hint\
    \ as to what they will return, otherwise we would have to use reflection or typecasting\
    \ to make this work. We must also ask if this is what we want. If a method returns\
    \ a type and we are to store it, then it will be easier to do if we know what\
    \ type to anticipate.\n\n## 9.5 Generic Reference Variables as Method Parameters\
    \ and Return Types\n\nWhen we write methods that accept reference variables from\
    \ generic classes, we must provide type arguments in the method’s parameter. The\
    \ same can be said for any return types we specify in the method’s header. They\
    \ too must provide a type argument for the reference they will return.\n\nLet\
    \ us assume we have a generic class that accepts one of our shapes. To accept\
    \ or return instances of this class, we must write methods that account for the\
    \ class’ generic type.\n\n```java\npublic class CubeHolder<T extends Cube> {\n\
    \    T cube;\n}\n```\n\nThe `CubeHolder` class requires a parameter on instantiation.\
    \ The way that we would write a simple setter or getter method for this class\
    \ is as follows:\n\n```java\npublic class ShapeUtils {\n    CubeHolder<Cube> myCube;\n\
    \    public void cubeSetter(CubeHolder<Cube> myCube) {\n        myCube = myCube;\n\
    \    }\n    public CubeHolder<Cube> cubeGetter() {\n        return CubeHolder<>();\n\
    \    }\n}\n```\n\nWhat is important to recognize that this version of the `ShapeUtils`\
    \ class is not generic, though it sends, receives and holds object references\
    \ of a generic class. Remember that once we supply a type argument to a generic\
    \ class, it is no longer subject to change. This is why `cubeGetter` return type\
    \ does not require any casting. It is set to return a very specific instance of\
    \ the `CubeHolder` class.\n\n## 9.6 Multiple Type Variables\n\nOnce you are comfortable\
    \ with single generic variables, it is easy to add more. All we must do is add\
    \ another generic variable name and separate it with a comma. We may observe multiple\
    \ generic variables in the JDK’s `HashMap` for example.\n\n```java\npublic class\
    \ ShapeUtils<T1 extends HasCoordinates, T2 extends CalculateVolume> {\n    //...\n\
    }\n```\n\nNote that it is the comma that separates different type variables. We\
    \ may wish to add more types to the variable’s bound, so we must simply add them\
    \ with the ampersand operator.\n\n```java\npublic class ShapeUtils<T1 extends\
    \ HasCoordinates & Rounded3D, T2 extends CalculateVolume & CalculateArea> {\n\
    \    //...\n}\n```\n\nTo instance either of these examples, we must provide a\
    \ pair of type arguments separated by commas and in the order that we declared\
    \ them in the class itself.\n\n```java\npublic class Main {\n    public static\
    \ void main(String[]args) {\n        ShapeUtils<MovingCylinder, Cube> shapeUtils\
    \ = new ShapeUtils<>();\n    }\n}\n```\n\nWe may add many type variables in a\
    \ single class or method, though for practicality’s sake we will stick to only\
    \ two for now.\n\n### 9.6.1 Multiple Method Type Parameters\n\nMethods with multiple\
    \ type parameter variables work much like their single variable counterparts.\
    \ Keep in mind that without an access specifier such as `public` or `protected`,\
    \ methods may look a little odd because they will start with the type syntax.\
    \ Rest assured, they function quite normally.\n\n```java\npublic class ShapeUtils\
    \ {\n    <T1 extends HasCoordinates, T2 extends CalculateArea> void echoCoordsAndVolume(T1\
    \ shapeLocation, T2 shapeArea) {\n        //...\n    }\n}\n```\n\nThis method\
    \ handles two different typed variables. Just like a single method, we do not\
    \ need to provide any type arguments when we call a generic method in a class\
    \ such as this.\n\n```java\npublic class Main {\n    public static void main(String[]args)\
    \ {\n        MovingCube cube = new MovingCube();\n        MovingSphere sphere\
    \ = new MovingSphere();\n        ShapeUtils utils = new ShapeUtils();\n      \
    \  utils.echoCoordsvolume(cube, sphere);\n    }\n}\n```\n\n## 9.7 Erasing too\
    \ Much With Raw Types\n\nWe must remember that generics erase type data. If we\
    \ were to instance a generic class without providing a type argument, then we\
    \ would effectively tell the Java compiler to erase all type data until we are\
    \ left with the base `Object` type.\n\nThis costs us type safety and clarity.\
    \ Below is an example of what we must avoid.\n\n```java\npublic class ShapeUtils<T\
    \ extends Cube> {\n    T rawType;\n    //...\n}\n```\n\nNow we forget to add a\
    \ type argument for the generic class…\n\n```java\npublic class Main {\n    public\
    \ static void main(String[]args) {\n        ShapeUtils shapeUtils = new ShapeUtils();\n\
    \    }\n}\n```\n"
