    \npublic interface ItemBox<T extends Item>  {  ///...  }\n\nWhen we write our\
    \ ItemStorage class, we use the Interface as a type bind for T.\n\npublic class\
    \ ItemStorage implements ItemBox<Item> {  }\n\nWe implement the interface and\
    \ fill the type argument here instead of during instantiation. This will be easy\
    \ to remember as a rule if you think of all interface requirements as the implementing\
    \ class’ responsibility.\n\n  public class Main {      public static main(String[]args)\
    \ {                    ItemStorage storage = new ItemStorage();      }  }\n\n\
    When a class implements a generic type variable while having its own, things may\
    \ look a little complicated, but once we have handled the interface’s type argument,\
    \ we may then instance the generic class like we normally would.\n\npublic class\
    \ ItemUtils {}\n\npublic class ItemStorage<T extends ItemUtils> implements ItemBox<Item>\
    \ {\n\n    T utils;\n\n}\n\nHere we must fill the interface’s type argument first,\
    \ then the class’ type argument when instancing it.\n\npublic class Main {      public\
    \ static main(String[]args) {                    ItemStorage<ItemUtils> storage\
    \ = new ItemStorage<>();      }  }\n\nWhat generic interfaces allow us to do is\
    \ set their type arguments differently for each class they appear in. This makes\
    \ our interfaces even more reusable than before.\n\nFor our next section, we will\
    \ add some generic abstract methods to our ItemBox.\n\n## 11.2 Generic Abstract\
    \ Methods\n\nGeneric abstract methods are not so different from normal generic\
    \ methods. Parameterized types either resolve type data by their interface’s type\
    \ parameter, or they will do it themselves with the same type deduction process\
    \ that non-abstract methods use.\n\nHere is an example where the same type variable\
    \ appears in the interface and method’s parameters. The method’s type variable\
    \ takes its bind(s) from the interface.\n\npublic interface ItemBox<T extends\
    \ Item>  {            void setItem(T item);      T getItem();  }\n\nThese two\
    \ simple generic methods will use the type variable T to determine what object\
    \ references they will accept and return. Here they are implemented in the ItemStorage\
    \ class.\n\npublic class ItemStorage implements ItemBox<Item> {      Item item;\
    \      @Override      void setItem(Item item) {          this.item = item;      }\
    \      @Override      Item getItem() {          return this.item;      }  }\n\n\
    The methods take the Item parameter from their interface’s implementation. If\
    \ we remove the interface’s type variable, we would have to specify both of the\
    \ generic typebounds as in the example below.\n\npublic interface ItemBox  {\n\
    \n    <T extends Item> void setItem(T item);\n\n    Item getItem();\n\n}\n\nI\
    \ have used Item as a return type for the getItem class. Another thing we could\
    \ do is either add the interface’s parameter back into the interface, or move\
    \ the getItem method into another interface where the type parameter belongs to\
    \ the interface and the return type will not be ambiguous.\n\n  public interface\
    \ ItemBox {      <T extends Item> void setItem(T item);  }  public interface ItemCollector<I>\
    \ {      I getItem();  }\n\nTo use both methods we would simply implement both\
    \ interfaces in our ItemStorage class.\n\npublic class ItemStorage implements\
    \ ItemBox, ItemCollector<Item> {\n\n    Item item;\n\n    @Override\n\n    public\
    \ Item getItem() {\n\n        return this.item;\n\n    }\n\n    @Override\n\n\
        public void itemBoxSetter(ItemBox<Item> itm) {\n\n        this.item = itm;\n\
    \n    }\n\n}\n\nNow that the ItemCollector interface and its abstract method are\
    \ separate, we may set the collected type to what ever we want and use the abstract\
    \ method in many different places.\n\n## 11.3 Final Generic Example\n\nThere are\
    \ countless ways that we could use interfaces and there are still rules and nuances\
    \ that are too numerous to cover in this book. What we will do in this section\
    \ is show how a single generic abstract method may be instanced in three different\
    \ ways to either save or write simple text messages.\n\nFirst, we will make an\
    \ enumerator that can tell the difference between savable and printable text.\n\
    \n  public enum MessageTypes {            SAVE, PRINT;  }\n\nNow we will make\
    \ the TextItem class that holds either of these two states.\n\n public class TextItem\
    \ {\n\n    String text;\n\n    MessageTypes type;\n\n    public TextItem(String\
    \ msg, MessageTypes type) {\n\n        this.text = msg;\n\n        this.type =\
    \ type;\n\n    }\n\n}\n\nWe will need an way to call the same methods with a different\
    \ body. A generic abstract method will allow us to swap out the TextItem for another\
    \ compatible type later if we choose to extend the class or make another.\n\n\
    \  public interface TextConsumer<T extends TextItem> {      void processText(T\
    \ text);  }\n\nOur first class to implement the TextConsumer interface will be\
    \ simple. All it must do is take the text and print it to our terminal.\n\npublic\
    \ class MessageReader implements TextConsumer<TextItem> {      @Override      public\
    \ processText(TextItem item) {          System.out.println(item.text);       \
    \     }  }\n\nThis does not justify using an abstract method, so let us add another\
    \ class that is made to handle messages set to SAVE. It will be somewhat more\
    \ complex and will require a few imports from the JDK.\n\n  import java.io.IOException;\
    \  import java.io.FileWriter;  public class MessageWriter implements TextConsumer<TextItem>\
    \ {            String path;      String text;            FileWriter write;      \
    \      public MessageWriter(String path) {          this.path = path;      } \
    \     @Override      public void processText(TextItem item) {          try{              write\
    \ = new FileWriter(this.path, true);              //'true' means that it will\
    \ append the text              write.write(item.text);              write.close();\
    \          } catch (IOException e) {              e.printStackTrace();          }\
    \      }  }\n\nThis may look a little complex, but it is quite simple. The path\
    \ string holds the name and destination of a file. Without a full path, the file\
    \ writer should use the filename you supply as an argument and save the file to\
    \ your project’s working directory. Optionally, you may specify a different path\
    \ to somewhere else in your filesystem.\n\nFinally we must make a class that differentiates\
    \ between savable and printable message items. It too may implement the same TextConsumer\
    \ interface."
