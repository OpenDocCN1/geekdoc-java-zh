  trans: "\n继承允许我们根据需要，在继承链中尽向上调用父类的成员。让我们向 `ThirdGenClass` 中添加一些代码，看看 `super` 关键字能为我们做什么。\n\
    \n```java\npublic class ThirdGenGreeter extends {\n    public void finalGreeting()\
    \ {\n        super.greeting();\n        super.secondGenGreeting();\n        System.out.print(\"\
    hello from the third gen greeting!\");\n    }\n}\n```\n\n现在为了访问所有三个方法，我们可以实例化\
    \ `ThirdGenGreeter` 类并调用 `finalGreeting`。\n\n```java\npublic class Main {\n  \
    \  public static void main(String[]args) {\n        ThirdGenGreeter thirdGreeter\
    \ = new ThirdGenGreeter();\n        thirdGreeter.finalGreeting();\n    }\n}\n\
    ```\n\n特别需要关注的是，我们来自 `ThirdGenGreeter` 类的 `finalGreeting` 方法依赖于两个父类才能运行。如果你更改或重命名了\
    \ `FirstGenGreeter` 或 `SecondGenGreeter` 类或它们的方法，你将会破坏 `finalGreeting` 方法。这个例子是微不足道的，但在较大的程序中，你必须进行规划，以免在经常频繁更改的情况下写出这种紧耦合的代码。\n\
    \n现在让我们看看继承和构造函数是如何协同工作的。\n\n## 6.3 超类构造函数\n\n当一个类继承另一个类时，如果该父类有一个参数化构造函数，子类将继承对构造函数参数的需求。当然，如果由于默认构造函数的存在使得参数化构造是可选的，那么这些参数对于子类也是可选的。\n\
    \n让我们修改 `SecondGenGreeting` 类，使其通过参数化构造函数接收一些文本。\n\n```java\npublic class SecondGenGreeting\
    \ extends OriginalGreeting {\n    String message;\n    SecondGenGreeting(String\
    \ msg) {\n        message = msg;\n    }\n    public void secondGenGreeting() {\n\
    \        System.out.println(\"hello from the 2ndGen class\");\n    }\n}\n```\n\
    \n现在 `SecondGenGreeter` 在实例化需要一个参数。因此，`ThirdGenGreeter` 类也需要相同的构造函数参数。\n\n```java\n\
    public class ThirdGenGreeter extends SecondGenGreeting {\n    ThirdGenGreeting(String\
    \ msg) {\n        super(msg);\n        //注意 'super' 关键字也指向构造函数\n    }\n    public\
    \ void finalGreeting() {\n        super.greeting();\n        super.secondGenGreeting();\n\
    \        System.out.print(\"hello from the third gen greeting!\");\n    }\n}\n\
    ```\n\n注意 `super` 关键字如何像方法一样接收字符串参数。该字符串值存储在我们从父类继承的 `message` 字段中。这是有意义的，因为如果你在没有填充\
    \ `message` 字段的情况下调用 `secondGenGreeting`，程序将会失败，而填充构造函数参数可以防止这种情况。\n\n## 6.4 保护成员继承\n\
    \nJava 有四种访问修饰符：public、private、protected 和默认（default）。在同一个包内，访问是简单的。你要么访问类成员，要么不能。然而，当你的程序拆分在不同的包时，你只能访问被标记为\
    \ public 或 protected 的其他包成员。protected 类需要通过扩展来访问其内容。让我们看看下方的几个例子。\n\n假设以下两个类位于不同的包中。\n\
    \n```java\npackage mypackage.subpackage;\npublic class OriginalGreeting {\n  \
    \  protected void originalGreeting() {}\n    public void greeting() {\n      \
    \  System.out.println(\"hello from the original superclass\");\n    }\n}\n```\n\
    \n如果我们尝试从 `main` 方法中实例化这个类，且该类没有继承 `OriginalGreeting`，那么它将无法工作。\n\n```java\npackage\
    \ mypackage;\npublic class Main {\n    public static void main(String[]args) {\n\
    \        OriginalGreeting ogGreet = new OriginalGreeting();\n        //不起作用\n\
    \    }\n}\n```\n\n`OriginalGreeting` 类的访问修饰符 `protected` 限制了我们跨包访问构造函数。通过使用 `SecondGenGreeting`\
    \ 子类，我们可以通过继承来访问父类的成员。\n\n```java\npackage mypackage;\npublic class Main {\n \
    \   public static void main(String[]args) {\n        SecondGenGreeting greet =\
    \ new SecondGenGreeting(\"\");\n        greet.greeting();\n    }\n}\n```\n\n在处理多个包时，你本打算访问的入口点通常是\
    \ public 的。在某些情况下，类是 protected 的，只要你使用继承，你仍然能够访问它们。\n\n关于继承我们还有很多要学习的。你已经看到了如何扩展类以及访问它们的内容。接下来，你将看到如何使用继承来共享类型。\n\
    \n- 继承允许我们在子类之间共享数据和方法。\n- 一个子类只能有一个父类。\n- 继承隐藏了代码，尽管它也可能模糊代码的位置。\n- 修改父类可能会破坏任何继承它的子类。一个类继承得越远，它们就越容易被破坏。\n\
    - 继承是类之间访问保护 成员的唯一方法。\n\n# 第 7 章：抽象类与方法\n\n在上一章中，我们对继承有了初步介绍。我们看到了访问修饰符、成员继承和\
    \ super 参数。现在我们学习学习一种场景，即我们想要继承父类的类型及其方法，以及一种新的类和方法如何解决继承的某些局限性。\n\n## 7.1 初始类\n\
    \n首先，我们将创建一个基础 `Shape` 类，用于存储各种形状的表面。然后我们将对其进行子类化并使用继承以相同的方式处理每个类的引用变量。\n\n```java\n\
    public class Shape {\n    double side;\n    // 我们将 side 用于正方形和圆形\n    double area;\n\
    \    Shape(double side) {}\n    double getArea() {\n        return this.area;\n\
    \    }\n}\n```\n\n现在我们有了一个基础 `shape` 类，我们将使用它来创建特定的形状。首先，我们将它扩展为 `square` 类。\n\
    \n```java\npublic class Square extends Shape {\n    Square(double side) {\n  \
    \      super(side);\n    }\n    void calcArea() {\n        double s = super.side;\n\
    \        super.area = s*s;\n    }\n}\n```\n\n接下来是 `circle` 类。为了方便，我们将使用边长作为半径。\n\
    \n```java\npublic class Circle extends Shape {\n    Circle(double radius) {\n\
    \        super(radius);\n    }\n    void calcArea() {\n        double r = super.side;\n\
    \        this.area = 3.1415*(r*r);\n    }\n}\n```\n\n我们现在在 `main` 中实例化它，看看我们拥有什么。\n\
    \n```java\npublic class Main {\n    public static void main(String[]args) {\n\
    \        Circle circle = new Circle(4);\n        Square sq = new Square(3);\n\
    \        sq.calcArea();\n        circle.calcArea();\n    }\n}\n```\n\n这段示例代码应该会给你每个形状的几个近似值。我们可能会发现大量的形状对象，因此我们将使用数组来组织它们。\n\
    \n```java\npublic class Main {\n    public static void main(String[]args) {\n\
    \        Shape[] shapes = new Shapes[2];\n        shapes[0] = new Circle(4);\n\
    \        shapes[1] = new Square(3);\n        // shapes[0].calcArea();\n      \
    \  // shapes[1].calcArea();\n        // 这将无法编译。为什么？\n    }\n}\n```\n"
- fmt: "\nBefore we rewrite our two shape classes, let us learn a little about Java’s\
    \ abstract classes and methods. It is true that object oriented programming is\
    \ quite abstract in nature, so you may be wondering how an abstract class differs\
    \ from a normal one. In brief, an abstract class is one that:\n\n*   Uses the\
    \ `abstract` keyword\n*   Cannot be instanced\n*   May contain abstract methods\n\
    \nIt looks like we are going to sacrifice a lot in order to gain these so called\
    \ abstract methods. What is so special about them? Their implementation may vary\
    \ from one class to another. Below is an example of an abstract method.\n\n```java\n\
    abstract int changesX(int x);\n```\n\nThe `abstract` keyword allows us to write\
    \ a method with no body. Even without a body, we are making a kind of promise\
    \ that says we will provide one in every extending class. Each non-abstract subclass\
    \ that we write must have a method of the same name and that method must return\
    \ an `int` and accept one as an argument.\n\nHere is an implementation from one\
    \ subclass.\n\n```java\n//...  int otherNumber;  @Override  int changesX(int x)\
    \ {    otherNumber += x;    return otherNumber;  //...  }\n```\n\nHere is an implementation\
    \ from another subclass. Notice how the method body is different. It is not like\
    \ the other subclass’ definition for the `changesX` method, yet it still matches\
    \ the abstract method header we wrote in the abstract class.\n\n```java\n//...\
    \  @Override  int changesX(int x) {    int result = (x * x * x);    return result;\
    \  //...  }\n```\n\nYou can see from these examples that abstract classes and\
    \ methods allow us to declare a method once and define its specifics multiple\
    \ times. Of course, the abstract reference’s type recognizes the existence of\
    \ the abstract method.\n\nNow let us return to our `Shape` class example and see\
    \ how abstract classes and methods will solve our problem.\n\n## 7.3 The Abstract\
    \ Shape Class and Methods\n\nWe will return to the `Shape` class and mark it abstract\
    \ in the class’ header. Next, we write an abstract method called `calcArea` that\
    \ we will then implement in differently in each of our subclasses.\n\n```java\n\
    public abstract class Shape { \n    double side;\n    double area;\n    Shape(double\
    \ side) {\n        this.side = side;\n    }\n    double getArea() {\n        return\
    \ this.area;\n    }\n    abstract void calcArea();\n}\n```\n\nThat is all it takes\
    \ to make a class and method abstract. Note that now that we cannot instantiate\
    \ it directly.\n\nLet us return to `Square` class and implement the abstract method\
    \ from `Shape`.\n\n```java\npublic class Square extends Shape { \n    Square(double,\
    \ side) {\n        super(side);\n    }\n    @Override\n    double calcArea() {\n\
    \        double d = super.side;\n        super.area = (d*d);\n    }\n}\n```\n\n\
    Next is the `circle` class. We will extend the `Shape` class and implement its\
    \ abstract method.\n\n```java\npublic class Circle extends Shape {\n    public\
    \ Circle(double radius) {\n        super(radius);\n    }\n    @Override\n    public\
    \ void calcArea() {\n        double r = super.side;\n        this.area = 3.1415*(r*r);\n\
    \    }\n}\n```\n\nNote the use of the `@Override` annotation. It is not entirely\
    \ mandatory, though it helps to debug errors and remind us that the method actually\
    \ originates from somewhere else. For these reasons, we should always prefer to\
    \ annotate our abstract methods in this way.\n\nOnce the two classes are updated,\
    \ we may store them inside of an array and call the common `calcArea` as needed.\
    \ Our final code will look something like the following.\n\n```java\npublic class\
    \ ShapeManager { \n    Shape[] shapes;\n    ShapeManager(int size) {\n       \
    \ this.shapes = new Shape[size];\n    }\n    void reportAll() {\n        for(Shape\
    \ shape : shapes) {\n            shape.calcArea();\n            System.out.println(\"\
    shape area: \"+ shape.getArea());\n        }\n    }\n}\n```\n\nNow we may call\
    \ the `calcArea` method through `ShapeManager` reference variables. They are all\
    \ stored in an array of `Shape` reference types.\n\n```java\npublic class Main\
    \ {\n    public static void main(String[]args) {\n        ShapeManager sManager\
    \ = new ShapeManager(5);\n        sManager.shapes[0] = new Circle(4);\n      \
    \  sManager.shapes[1] = new Square(3);\n        sManager.shapes[2] = new Square(4);\n\
    \        sManager.shapes[3] = new Circle(7);\n        sManager.shapes[4] = new\
    \ Square(2);\n        sManager.reportAll();\n    }\n}\n```\n\nNow we may call\
    \ the `calcArea` method through `ShapeManager` reference variables. They are all\
    \ stored in an array of `Shape` reference types. Now we may call the `calcArea`\
    \ method through `ShapeManager` reference variables. They are all stored in an\
    \ array of `Shape` reference types.\n\nNow we the the ` ```` ` ` `.....What is\
    \ so special about them, their implementation may vary from one class to another.\
    \ Below is an example of an abstract method.\n\n*   \n\n\n\n\n\n\n\n         \
    \ in the methods.\n\nThis concludes chapter 7. We will work with interfaces.\n\
    \n*   Inheritance allows us to use abstract methods\n*   Abstract classes allow\
    \ us.\n*   Abstract methods may be implemented in each subclass.\n\n# CHAPTER\
    \ 8: INTERFACES\n\nThe abstract classes in the previous chapter allowed us to\
    \ do useful things. First, we used inheritance to make subtypes. In this chapter,\
    \ we will learn how to share types without inheritance.\n\nWhat are Interfaces?\
    \ They are completely classes that cannot be instantiated and cannot have fields.\
    \ You will find three kinds of methods inside interfaces: default, static and\
    \ abstract.\n\n## 8.1 Type By Implementation\n\nClasses define new datatypes.\
    \ What we see in a class header tells us a lot, especially when `extends` keyword\
    \ is present. We know that when a class extends another, it gains the superclass’\
    \ type and all its members. Similarly, the `implements` keyword tells us that\
    \ a class gains the type of one or more interfaces and provides implementations\
    \ for any abstract methods in those interfaces.\n\n*   Let us replace our old\
    \ `Shape` class with an interface and an abstract method.\n\n```java\npublic interface\
    \ CalculateArea {\n    double calcArea();\n}\n```\n\nWe no longer need to label\
    \ the abstract method with a special keyword. So long as it appears in an interface\
    \ and has no body, the method is implicitly abstract.\n\nJust as the abstract\
    \ method in our old `Shape` class, you must provide an implementation for the\
    \ abstract method you gained by implementing the `CalculateArea` interface. We\
    \ even use the same annotation.\n\n```java\npublic class Circle implements CalculateArea\
    \ {\n    double radius;\n    public Circle(double radius) {\n        this.radius\
    \ = radius;\n    }\n    @Override\n    public double calcArea() {\n        double\
    \ r = this.radius;\n        double pi = 3.1415;\n        return pi * (r * r);\n\
    \    }\n}\n```\n\nHere is the square class implementing our same `CalculateArea`\
    \ interface. Once again, we provide an implementation that suits our needs.\n\n\
    ```java\npublic class Square implements CalculateArea {\n    double side;\n  \
    \  Square(double, side) {\n        this.side = side;\n    }\n    @Override\n \
    \   public double calcArea() {\n        double s = this.side;\n        return\
    \ s*s;\n    }\n}\n```\n[/content]​注：以上排版工作已根据您的要求对原始文本进行了格式化处理。输入后的文本进行了优化。（注：由于原始文本中存在大量重复的“文本\
    \ 文本 文本 文本 文本 文本”，在处理时已进行了去重和逻辑整合，以确保文档的可读性和专业性）。​**（注：由于原始文本中存在大量重复的“文本 文本 文本\
    \ 文本 文本 文本 文本”，在处理时已进行了去重和逻辑整合，以确保文档的可读性和专业性）。**​​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​.​。**排版已完成。**"
  raw: "Before we rewrite our two shape classes, let us learn a little about Java’s\
    \ abstract classes and methods. It is true that object oriented programming is\
    \ quite abstract in nature, so you may be wondering how an abstract class differs\
    \ from a normal one. In brief, an abstract class is one that:\n\n*   Uses the\
    \ abstract keyword\n\n*   Cannot be instanced\n\n*   May contain abstract methods\n\
    \nIt looks like we are going to sacrifice a lot in order to gain these so called\
    \ abstract methods. What is so special about them? Their implementation may vary\
    \ from one class to another. Below is an example of an abstract method.\n\nabstract\
    \  int  changesX(int x);\n\nThe abstract keyword allows us to write a method with\
    \ no body. Even without a body, we are making a kind of promise that says we will\
    \ provide one in every extending class. Each non-abstract subclass that we write\
    \ must have a method of the same name and that method must return an int and accept\
    \ one as an argument.\n\nHere is an implementation from one subclass.\n\n//...\
    \  int otherNumber;  @Override  int changesX(int x) {      otherNumber += x; \
    \     return otherNumber;  //...  }\n\nHere is an implementation from another\
    \ subclass. Notice how the method body is different. It is not like the other\
    \ subclass’ definition for the changesX method, yet it still matches the abstract\
    \ method header we wrote in the abstract class.\n\n//...  @Override  int changesX(int\
    \ x) {      int result = (x * x * x);      return result;  //...  }\n\nYou can\
    \ see from these examples that abstract classes and methods allow us to declare\
    \ a method once and define its specifics multiple times. Of course, the abstract\
    \ reference’s type recognizes the existence of the abstract method.\n\nNow let\
    \ us return to our Shape class example and see how abstract classes and methods\
    \ will solve our problem.\n\n## 7.3 The Abstract Shape Class and Methods\n\nWe\
    \ will return to the Shape class and mark it abstract in the class’ header. Next,\
    \ we write an abstract method called calcArea that we will then implement in differently\
    \ in each of our subclasses.\n\npublic abstract class Shape {            double\
    \ side;      double area;            Shape(double side) {          this.side =\
    \ side;      }      double getArea() {          return this.area;      }      abstract\
    \ void calcArea();  }\n\nThat is all it takes to make a class and method abstract.\
    \ Note that now that we cannot instantiate it directly.\n\nLet us return to Square\
    \ class and implement the abstract method from Shape.\n\n  public class Square\
    \ extends Shape {            Square(double, side) {          super(side);      }\
    \            @Override      double calcArea() {          double d = super.side;\
    \          super.area = (d*d);      }  }   \n\nNext is the circle class. We will\
    \ extend the Shape class and implement its abstract method.\n\npublic class Circle\
    \ extends Shape {      public Circle(double radius) {          super(radius);\
    \      }            @Override      public void calcArea() {          double r\
    \ = super.side;          this.area = 3.1415*(r*r);      }  }\n\nNote the use of\
    \ the @Override annotation. It is not entirely mandatory, though it helps to debug\
    \ errors and remind us that the method actually originates from somewhere else.\
    \ For these reasons, we should always prefer to annotate our abstract methods\
    \ in this way.\n\nOnce the two classes are updated, we may store them inside of\
    \ an array and call the common calcArea as needed. Our final code will look something\
    \ like the following.\n\npublic class ShapeManager {            Shape[] shapes;\
    \      ShapeManager(int size) {                this.shapes = new Shape[size];\
    \      }      void reportAll() {          for(Shape shape : shapes) {              shape.calcArea();\
    \              System.out.println(\"shape area: \"+ shape.getArea());          }\
    \      }  }\n\nNow we may call the calcArea method through ShapeManager reference\
    \ variables. They are all stored in an array of Shape reference types.\n\n public\
    \ class Main {\n\n    public static void main(String[]args) {\n\n        ShapeManager\
    \ sManager = new ShapeManager(5);\n\n        sManager.shapes[0] = new Circle(4);\n\
    \n        sManager.shapes[1] = new Square(3);\n\n        sManager.shapes[2] =\
    \ new Square(4);\n\n        sManager.shapes[3] = new Circle(7);\n\n        sManager.shapes[4]\
    \ = new Square(2);\n\n        sManager.reportAll();\n\n    }\n\n}\n\nThe ShapeManager\
    \ class and the simple loops set and print all of the values to your terminal.\
    \ You could take this example even further and add some arguments that make all\
    \ of the outputs relative to each other or even write an algorithm to sort them.\
    \ What matters most is that inheritance gives us common types and abstract classes\
    \ give us common types along with abstract methods.\n\n* * *\n\nIn this chapter\
    \ we saw how abstract classes and the abstract methods add another dimension to\
    \ our object oriented code. So long as these abstract methods have the same header,\
    \ we may implement them however we wish.\n\n*   Inheritance allows us to use subtypes\
    \ in place of the stated supertype.\n\n*   Abstract classes allow us to use abstract\
    \ methods.\n\n*   Extending classes must provide an implementation for abstract\
    \ methods.\n\n*   Abstract methods may be implemented differently in each subclass.\n\
    \nThis concludes chapter 7\\. We will work with even more abstract methods in\
    \ the next chapter where we will learn of interfaces.\n\n* * *\n\n# CHAPTER 8:\
    \ INTERFACES\n\nThe abstract classes in the previous chapter allowed us to do\
    \ a few useful things. First, we used inheritance to make subtypes of the Shape\
    \ class, then we implemented an abstract method differently in two different subclasses.\
    \ In this chapter, you will learn how to share common types and abstract methods\
    \ without using inheritance at all.\n\nWhat are Interfaces? They are completely\
    \ abstracted classes that cannot be directly instantiated and cannot have fields\
    \ of any kind. You will find three kinds of methods inside of interfaces: default,\
    \ static and abstract.\n\nDefault and static methods and not unlike what you would\
    \ find in a regular Java class. We have already seen abstract methods, yet their\
    \ particularly flexible nature pairs nicely with interfaces. For this reason,\
    \ you will see the two combined in all interface examples.\n\n## 8.1 Type By Implementation\n\
    \nClasses define and describe new datatypes. What we see in a class’ header tells\
    \ us a lot, especially when the extends keyword is present. We know that when\
    \ a class extends another, it gains the superclass’ type and all of its inheritable\
    \ members. Similarly, the implements keyword tells us that a class gains the type\
    \ of one or more interfaces and provides implementations for any abstract methods\
    \ in those interfaces.\n\nLet us replace our old Shape class with an interface\
    \ and an abstract method.\n\n  public interface CalculateArea {      double calculateArea();\
    \  }\n\nWe no longer need to label the abstract method with a special keyword.\
    \ So long as it appears in an interface and has no body, the method is implicitly\
    \ abstract.\n\nJust as with the abstract method in our old Shape class, you must\
    \ provide an implementation for the abstract method that you gained by implementing\
    \ the CalculateArea interface. We even use the same annotation.\n\npublic class\
    \ Circle implements CalculateArea {\n\n    double radius;\n\n    public Circle(double\
    \ radius) {\n\n        this.radius = radius;\n\n    }\n\n    @Override\n\n    public\
    \ double calculateArea() {\n\n        double r = this.radius;\n\n        double\
    \ pi = 3.1415;\n\n        return pi * (r * r);\n\n    }\n\n}\n\nHere is the square\
    \ class implementing our same CalculateArea interface. Once again, we provide\
    \ an implementation that suits our needs.\n\n  public class Square implements\
    \ CalculateArea {            double side;            public Square(double, side)\
    \ {          this.side = side;      }            @Override      public double\
    \ calculateArea() {          double s = this.side;          return s*s;      }\
    \  }   "
