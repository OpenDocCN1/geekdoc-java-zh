    \ are separate, but still allow us to share common types.\n\n*   It is optional\
    \ for abstract classes to implement abstract methods from interfaces.\n\n*   One\
    \ class may implement more than one interface.\n\n*   Interfaces may extend each\
    \ other with multiple inheritance.\n\nWith this chapter finished, we will continue\
    \ working with interfaces and combine them with generics.\n\n* * *\n\n# CHAPTER\
    \ 9: GENERICS I\n\nWhen you extend one class with another, that subclass gains\
    \ the type of its superclass. If either the subclass, superclass or both of them\
    \ implemented one or more interfaces, then the subclass would gain that type data\
    \ as well. Take the Sphere class as an example. It is a subclass of a superclass\
    \ that implements multiple interfaces (through interface extension).\n\nAs far\
    \ as types go, we know that the Sphere class has the following types:\n\n*   Sphere\n\
    \n*   Rounded3D\n\n*   CalculateVolume\n\n*   CalcluateArea\n\nWe have four different\
    \ types to set as method parameters or variable types.\n\nAs we add more classes\
    \ and interfaces to a program, it becomes unclear as to what we expect where we\
    \ declare reference types for method parameters and instance variables. Do we\
    \ want a Sphere because it is round? Perhaps we simply want an object with circumference\
    \ or volume.\n\nWe would benefit from a form of syntax that helps us state: accept\
    \ a reference type that extends this class and implements these interfaces. Thankfully\
    \ Java’s generics give us an efficient and type-safe way to do just that.\n\n\
    This entire chapter is about generics and how they will help us work with multiple\
    \ reference types. When you are done with this rather long chapter, we will return\
    \ to our 3D shapes to apply what we have learned.\n\n## 9.1 A Growing Need for\
    \ Generics\n\nLet us say that we are adding two new 3D shape classes. Each of\
    \ them implements a new interface called HasCoordinates. Now we have our old 3D\
    \ shapes as well as these new movable ones, and we want to plan for the future\
    \ so that we may add even more shapes and possibly other interfaces for things\
    \ such as color or image data.\n\nWe will have fields and methods that require\
    \ reference types of one class, or one field, or any combination of them. We could\
    \ group classes together with more interfaces and inheritance, but adding more\
    \ types to our program will only make things more confusing. What we will do instead,\
    \ is use generics to clarify what goes where.\n\n## 9.2 Bound Generic Types\n\n\
    Generic types allow us to specify specific type data within pairs of angled brackets.\
    \ You may have seen the syntax before, where some uppercase letter indicates an\
    \ unknown element or value. The letters are simply a naming convention where we\
    \ typically use T for type, E for element and K,V for key-value, etc.\n\nThese\
    \ single-letter type variables are just that, variables. They are only place holders\
    \ for the name of an actual class or interface. The generic variables are exchanged\
    \ for real type arguments when we refer to the class as a reference variable,\
    \ such as during instantiation.\n\npublic class ShapeUtils <T> {      T shape3D;\
    \  }\n\nThis generic class has a type parameter named T. When we instantiate the\
    \ class, we must provide an actual type argument to fill the generic class’ type\
    \ parameter.\n\n  public class Main {      public static void main(String[]args)\
    \ {                    ShapeUtils<MovingSphere> mSphereUtils = new ShapeUtils<>();\
    \      }  }\n\nThat is all it takes to write and use a generic typed class, though\
    \ this generic class is not exactly what we want.\n\nWhen we set the generic variable\
    \ as a single letter such as T, it is possible for us to supply any type as an\
    \ argument. Sometimes we want this, but such unbound types lack specificity. To\
    \ restrict what we may supply as an argument for the T variable, we may specify\
    \ a type requirement or bound.\n\npublic class ShapeUtils <T extends Calculate3D>\
    \ {      T shape3D;  }\n\nNow whatever we supply as an argument to this class’\
    \ type parameter must also extend or implement the Calculate3D interface. Below\
    \ is an example of the ShapeUtils class being instanced twice with two different\
    \ type arguments that satisfy the type’s bound.\n\n  public class Main {      public\
    \ static void main(String[]args) {          MovingCube mCube = new MovingCube();\
    \          MovingSphere mSphere = new MovingSphere();          ShapeUtils<MovingCube>\
    \ mCubeUtils = new ShapeUtils<>();          ShapeUtils<MovingSphere> mSphereUtils\
    \ = new ShapeUtils<>(          mCubeUtils.shape3D = mCube;          mSphereUtils.shape3D\
    \ = mSphere;      }  }\n\nNote that the keyword extends applies to interfaces\
    \ and classes in this context.\n\nAny class or subclass that implements Calculate3D\
    \ is a suitable type argument for the generic class’ type variable. This type’s\
    \ bound will include any shapes that calculate three dimensional measurements.\n\
    \nPrior being supplied with arguments, the class’ type parameter is quite flexible,\
    \ but as you will see below, our choices become far more strict once we supply\
    \ a type argument.\n\n  public class Main {      public static void main(String[]args)\
    \ {          MovingCube mCube = new MovingCube();          MovingSphere mSphere\
    \ = new MovingSphere();          ShapeUtils<MovingCube> mCubeUtils = new ShapeUtils<>();\
    \          ShapeUtils<MovingSphere> mSphereUtils = new ShapeUtils<>(          mCubeUtils.shape3D\
    \ = mSphere;             //this will not work          mSphereUtils.shape3D =\
    \ mCube;             //neither will this!      }  }\n\nThe above example shows\
    \ that even though the MovingCube and MovingSphere type arguments are viable for\
    \ T, they are not interchangeable with each other after we supply a type argument.\
    \ The reason for this is that Java employs a kind of type erasure that removes\
    \ all of the type data except for what we specify as a type argument. This will\
    \ exclude even similar types.\n\nType erasure is quite a technical process and\
    \ beyond the scope of this book. All we need to know here is that it is both type\
    \ safe and efficient because it eliminates guesswork for the Java compiler.\n\n\
    ## 9.3 Multiple Bound Generic Types\n\nWe have already written a generic type\
    \ parameter with a single type bound. Now we will further restrict type arguments\
    \ for T by adding another bound.\n\nTo show how multiple type binds will help\
    \ us, we return to the ShapeUtils class once more and modify the generic type\
    \ variable so that it is bound to multiple types. We use the ampersand (&) operator\
    \ between each additional bound for the type variable.\n\npublic class ShapeUtils<T\
    \ extends RoundedShape & HasCoordinates> {      T shape;            public ShapeUtils(T\
    \ shape) {          this.shape = shape;      }  }\n\nThere are a few rules that\
    \ we must be aware of when specifying multiple type bounds. If any of the bounds\
    \ are a class’ name, then that name must appear first. Everything that follows\
    \ the class’ name must be an interface, as we cannot name a type that extends\
    \ two classes."
