  trans: "\n我们的最后一种方法 `echoLine` 会为每个点引用变量调用一次 `pointString` 方法并构造一个字符串，然后将它们都打印出来。这就是\
    \ `LineUtils` 类的全部内容。注意，某些方法是私有的。这是因为我们不希望以错误的顺序调用它们，并在还没有获取值之前就尝试打印它们。\n\n```java\n\
    public class Main {\n    public static void main(String[]args) {\n        Line2D\
    \ line = LineUtils.lineInit(2,8,10,5);\n        LineUtils.echoLine(line);\n  \
    \  }\n}\n```\n\n与 `Point2D` 和 `Line2D` 类进行交互只需要这些操作。我们甚至没有直接调用它们的构造函数来创建对象，并将它们发送到它们需要的地方。值得注意的是，将实例化细节保持分离并不总是合理的，我们可以将静态方法放在线类和点类内部，但你将在下一章中看到一种更好的类实例化方法。\n\
    \n## 4.4 空引用 (Null References)\n\n实例化 `Line2D` 类并然后将其打印出来需要三个对象引用。如果我们编写 `lineInit`\
    \ 方法时忘记实例化一个或两个 `Point2D` 对象，那么程序将无法编译，我们可能会在 IDE 中看到关于空引用的错误。\n\nJava 中的 `null`\
    \ 关键字允许我们对对象引用变量进行几项不同的操作。首先，让我们使用 `null` 来模拟缺失的对象引用。\n\n```java\npublic class\
    \ Main {\n    public static void main(String[]args) {\n        Line2D line = LineUtils.lineInit(2,8,10,5);\n\
    \        line.point1 = null;\n        LineUtils.echoLine(line);\n        //此代码将失败\n\
    \    }\n}\n```\n\n我们使用 `null` 关键字将线对象的其中一个点设置为 `null`。现在代码将无法编译，因为缺少了一个关键组件。我们现在可以使用相同的关键字作为测试条件，以防止此类情况发生，如下代码所示。\n\
    \n```java\npublic class LineUtils {  //...\n    public static void echoLine(Line2D\
    \ line) {\n        if(line.point1 == null || line.point2 == null) {\n        \
    \    System.out.println(\"the line is null!\");\n        } else {\n          \
    \  String p1 = pointString(line.point1);\n            String p2 = pointString(line.point2);\n\
    \            System.out.println(p1+\"\\n\"p2);\n        }\n    }\n}\n```\n\n现在，当我们使用\
    \ `null` 对象引用调用方法时，程序仍然可以编译。我们甚至可以设置条件语句来为我们调用构造函数并填充任何空引用变量。\n\n当我们开始创建和实例化类时，我们必须通过引用变量来管理它们的内存对象。在\
    \ Java 中，我们将一直这样做，这种做法允许编写出非常复杂的程序，只要我们记得根据需要填充引用变量即可。\n\n*   对象引用的发送、接收和存储成本是很低廉的。\n\
    *   方法和构造函数都可能返回对象引用。\n*   一个对象引用可能依赖其他引用才能正常工作。\n*   空引用变量为 `null`，并且会引入一组我们必须警惕的问题。\n\
    \n完成本章后，我们将学习构造函数以及我们如何利用它们来自动更多的实例化并防止空引用。\n\n## 第 5 章：构造函数 (CONSTRUCTORS)\n\n\
    当你编写一个新类时，你实际上也在编写一个新的默认构造函数。你可以使用提供的默认构造函数来实例化你的类，也可以编写自己的构造函数来自定义实例化过程。\n\n\
    在本章中，你将看到编写默认构造函数的几种方法，以及它们如何帮助自动化、限制、甚至禁止类的实例化。\n\n## 5.1 默认初始化器 (Default Initializer)\n\
    \n默认初始化器在我们实例化类时运行。这种默认构造函数的变体是最简单的，因为它是对构造函数的简单扩展，在对大括号之间添加了一些代码。注意它开始看起来很像一个方法。\n\
    \n这是我们来自上一章的旧的 `Line2D` 类：\n\n```java\npublic class Line2D {\n    Point2D point1;\n\
    \    Point2D point2;\n}\n```\n\n现在再次是该类，但带有一个简单的默认初始化器。\n\n```java\npublic class\
    \ Line2D {\n    Point2D point1;\n    Point2D point2;\n    public Line2D() {\n\
    \        point1 = new Point2D;\n        point2 = new Point2D;\n    }\n}\n```\n\
    \n这段代码比我们在旧 `LineUtils` 类中使用的笨重静态方法集要简洁方便得多。在 `Line2D` 的所有实例中，我们都将拥有这对空白的 `Point2D`\
    \ 对象，因此该类现在不再有空引用的风险。\n\n我们知道构造函数可以运行足够的代码来实例化其他类。那么运行我们自己的方法呢？惊讶的是，从构造函数本身运行实例方法是可能的，正如你将在下一个示例所示。\n\
    \n```java\npublic class Line2D {\n    Point2D point1;\n    Point2D point2;\n \
    \   public Line2D() {\n        point1 = new Point2D;\n        point2 = new Point2D;\n\
    \        echoInstantiation();\n    }\n    public void echoInstantiation() {\n\
    \        System.out.println(\"Line2D\");\n    }\n}\n```\n\n通过使用构造函数已经节省了大量工作。让我们进一步自定义以看看它们的作用。\n\
    \n## 5.2 参数化构造函数 (Parameterized Constructors)\n\n你可以像对方法一样对构造函数进行参数化。你提供的参数可以像\
    \ setter 方法一样，在创建期间填充字段。我们将构造函数添加到 `Line2D` 类。\n\n```java\npublic class Point2D\
    \ {\n    float x;\n    float y;\n    public Point2D(float x, float y) {\n    \
    \    x = x;\n        y = y;\n    }\n}\n```\n\n当构造函数是参数化的时，强制要求提供参数。构造函数可以重载。只要每个构造函数都有参数，我们可以拥有任意数量的。\n\
    \n```java\npublic class Line2D {\n    Point2D p1;\n    Point2D p2;\n    Line2D(Point2D\
    \ p1, Point2D p2) {\n        p1 = p1;\n        p2 = p2;\n    }\n    Line2D(float\
    \ x2, float y2) {\n        p1 = new Point2D();\n        p2 = new Point2D(x2, y2);\n\
    \    }\n    Line2D(float x1, float y1, float x2, float y2) {\n        p1 = new\
    \ Point2D(x1, y1);\n        p2 = new Point2D(x2, y2);\n    }\n    void echoLine()\
    \ {\n        System.out.println(\"x1 value: \" + p1.x + \"\\n\" + \"y1 value:\
    \ \" + p1.y);\n        System.out.println(\"x2 value: \" + p2.x + \"\\n\" + \"\
    y2 value: \" + p2.y);\n    }\n}\n```\n\n通常我们不会在一个类中看到这么多构造函数，尽管每一个都展示了实例化 `Line2D`\
    \ 的不同方法。在我们开始 `Line2D` 之前，让我们先创建一个包含多条线的类。\n\n## 5.3 绘制三角形 (Plotting a Triangle)\n\
    \n直到现在，我们一直严格要求自己为所有构造函数提供参数。对于新的 `Triangle` 类，我们将采取不同的做法。\n\n首先我们添加 `Line2D`\
    \ 字段和参数化构造函数。\n\n```java\npublic class Triangle {\n    Line2D line1,line2,line3;\n\
    \    Triangle(Line2D l1, Line2D l2, Line2D l3) {\n        line1 = l1;\n      \
    \  line2 = l2;\n        line3 = l3;\n    }\n}\n```\n\n我们可能无法一次性准备好所有的线对象，因此我们将重新为\
    \ `Triangle` 类引入默认构造函数。这样做实际上非常简单。我们只需重述没有任何参数或初始化代码的默认类即可。\n\n```java\npublic\
    \ class Triangle {\n    Line2D line1,line2,line3;\n    Triangle() {}\n    Triangle(Line2D\
    \ l1, Line2D l2, Line2D l3) {\n        line1 = l1;\n        line2 = l2;\n    \
    \    line3 = l3;\n    }\n    echoTriangle() {\n}\n```\n"
- fmt: "\n```java\nline1.echoLine();\nline2.echoLine();\nline3.echoLine();\n}\n}\n\
    ```\n\nWe may turn the default constructor into a default initializer or leave\
    \ it as is, the choice is all ours. We are now ready to make an instance of the\
    \ `Triangle` class with all of custom constructors.\n\n## 5.4 Calling Parameterized\
    \ Constructors\n\nWe now have three different classes. One is a pair of coordinates\
    \ that make up a two dimensional point, the next is a line that is made of two\
    \ points and the third is a triangle composed of three lines. In an actual graphical\
    \ program these may look different and only rely on points to draw lines, but\
    \ here we are more concerned with classes and constructors.\n\nHere is an example\
    \ of the `Triangle` class being instanced. Note all the different ways that we\
    \ use the `Line2D`’s constructor.\n\n```java\n public class Main {\n    public\
    \ static void main(String[]args) {\n        Line2D line1 = new Line2D(0,0,10,0);\n\
    \        Line2D line2 = new Line2D(new Point2D(10,0),10,10);\n        Line2D line3\
    \ = new Line2D(new Point2D(0,0),new Point2D(10,10));\n        Triangle triangle\
    \ = new Triangle(line1,line2,line3);\n        triangle.echoTriangle();\n    }\n\
    }\n```\n\nNow that we have used our points and lines to make a triangle, we will\
    \ move on to private constructors.\n\n## 5.5 Private Constructors and Static Methods\n\
    \nSometimes constructors are made private so that they may not be accessed from\
    \ any outside classes. We have other ways to make instantiation impossible, but\
    \ sometimes we want to make the constructor private so that instantiation is limited\
    \ or strictly controlled. The singleton design pattern is one such case.\n\nThe\
    \ singleton design pattern is when we only want one instance of a class to exist.\
    \ The way to write this single-instance class is to make the constructor private\
    \ and use a static method from inside of the class to retrieve its address.\n\n\
    ```java\n public class SingleTriangle {\n    Line2D line1;\n    Line2D line2;\n\
    \    Line2D line3;\n    private static SingleTriangle SINGLETON_REFERENCE;\n \
    \   private SingleTriangle() {};\n    public static SingleTriangle singletonGetter()\
    \ {\n        if(SINGLETON_REFERENCE == null) {\n            SINGLETON_REFERENCE\
    \ = new SingleTriangle();\n        }\n    //Note that this is a good use case\
    \ for the 'null' keyword.\n        return SINGLETON_REFERENCE;\n    }\n}\n```\n\
    \nRemember in chapter three where we had private variables and public methods\
    \ to access them. This singleton is another example of a class that is not purely\
    \ a template and makes full use of in-member access privileges.\n\nWith additional\
    \ methods, we could make setters and getters for the `Line2D`. What matters most\
    \ is that our singleton class actually gives us addresses of the same object and\
    \ not duplicates of it. We can test this by assigning the reference to two variables\
    \ and checking to see if their hashcodes match.\n\n```java\n  public class Main\
    \ {\n    public static main(String[]args) {\n        SingleTriangle triangle1\
    \ = Triangle.singletonGetter();\n        SingleTriangle triangle2 = Triangle.singletonGetter();\n\
    \        System.out.println(triangle1.hashCode());\n        System.out.println(triangle2.hashCode());\n\
    \    }\n  }\n```\n\nThe above code should print the same hashcode for each of\
    \ the `triangle1` and `triangle2` variables. This shows that each variable holds\
    \ a reference to the same object.\n\n***\n\nWriting our own constructors means\
    \ we may decide how our classes are instanced. From running default code to demanding\
    \ constructor arguments, we have far more options when we start leveraging the\
    \ flexibility that custom constructors give us. They are so flexible that we may\
    \ choose to make them optional by reintroducing a default constructor back into\
    \ our classes.\n\n*   Default initializers allow us to automatically run code\
    \ when a class is instanced.\n*   Constructors can have parameters that must be\
    \ filled on instantiation\n*   We may have more than one constructor per class.\n\
    *   We may have both parameterized and default constructors in the same class.\n\
    *   Constructors can be made private in order to limit instantiation\n\nWith this\
