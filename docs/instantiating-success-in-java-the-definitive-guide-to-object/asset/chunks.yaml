    \ run our code properly. Once those classes are loaded into the JVM we can start\
    \ instancing them as objects. That is what we will learn about next.\n\nTo recap\
    \ this chapter:\n\n* Folders become packages.\n* Packages help form fully qualified\
    \ names.\n* Fully qualified names prevent name conflicts.\n* The JVM class loaders\
    \ use fully qualified names to find class files.\n* Even `.jar` files maintain\
    \ the same folder structure so as not to invalidate any fully qualified names.\n\
    \nNow that we have some idea of how classes, packages and class loaders work,\
    \ we will start writing and instancing our own class files.\n\n***\n\n# CHAPTER\
    \ 3: DATATYPES AND OBJECTS\n\nIn this chapter, we will finally work with classes\
    \ and their instances. You are probably somewhat familiar with these topics, but\
    \ it is easy to overlook the implications of what classes are, especially when\
    \ it comes to data and types.\n\nBefore going any further it is important to note\
    \ that when you see the term object and class instance the two are one and the\
    \ same. They both refer to the instantiation of a class into the Virtual Machine’s\
    \ heap memory area.\n\n## 3.1 How Classes Relate to Objects\n\nWe write classes\
    \ as code, compile the code and load it into the Java Virtual Machine so that\
    \ it will function as part of a program. Classes are commonly referred to as the\
    \ blueprints or templates of objects, but not all the code that you see in a class\
    \ will become an object. Furthermore, sometimes a class' object gains code from\
    \ outside the class we wrote.\n\nAnother way to think of classes is as units of\
    \ code that both define and describe user defined datatypes. A class file contains\
    \ code that tells us:\n\n* What classes it shares members and data with.\n* Which\
    \ parts of the class may only exist as objects.\n* How members of a class may\
    \ access each other.\n* How members of the class may be accessed from the outside.\n\
    * A new user defined datatype.\n\nWe must consider this last point if we are to\
    \ understand objects and reference variables.\n\n### User Defined Types\n\nJava\
    \ has two broad type categories. The primitive types are simple. Any `int`, `char`,\
    \ `short` or `long` is a type, and we give those types names and values when we\
    \ write them in our programs. The second type category is reference types, the\
    \ types that we define ourselves.\n\nEvery time you name a new class you are naming\
    \ a new reference type. It is up to you to provide a combination of methods and\
    \ variables that you want as a reference type, and how that new reference type\
    \ fits into a larger program or framework.\n\nBelow is an example of a simple\
    \ user defined type. It is a rather simple collection of methods and fields, yet\
    \ far more complex than a primitive type.\n\n```java\npublic class Coordinate\
    \ {\n    private int x;\n    private int y;\n    public int getX() {\n       \
    \ return x;\n    }\n    public int getY() {\n        return y;\n    }\n    public\
    \ void setBothCoords(int x, int y) {\n        this.x = x;\n        this.y = y;\n\
    \    }\n}\n```\n\nThis `Coordinate` class is a new type of data that can modify\
    \ its own values. The only way to access those values is through a pair of instance\
    \ methods, so we must instance this class to use it properly. Let us declare some\
    \ instance variables for our new `Coordinate` class.\n\n```java\npublic class\
    \ Main {\n    public static void main(String[]args) {\n        int a;\n      \
    \  int b;\n        int c;\n        Coordinate position1;\n        Coordinate position2;\n\
    \        Coordinate position3;\n    }\n}\n```\n\nFor comparison, we have three\
    \ integer values and three `Coordinate` reference variables. Just as we use names\
    \ like `a`, `b` and `c` to differentiate between the integer values they hold,\
    \ we also need reference variables like `position1`, `position2` and `position3`\
    \ in order to store and access different instances of the `Position` class that\
    \ will exist in the JVM’s memory.\n\n## 3.2 Class Instances\n\nYou will now see\
    \ how we instance classes. First, we use the class’ name to declare a type, then\
    \ add the name of a variable, and finally call the class’ constructor, also named\
    \ after the class.\n\n```java\n//Main.java\npublic class Main {\n    public static\
    \ void main(String[]args) {\n        Coordinate position1; //type ^\n        Coordinate\
    \ position2; //variable^\n        Coordinate position3 = new Coordinate(); //constructor\
    \ ^\n    }\n}\n```\n\nNow let us rewrite the above code so each instance variable\
    \ takes the address of a different class instance’s memory. We will call some\
    \ of the methods and print out the values.\n\n```java\n//Main.java\npublic class\
    \ Main {\n    public static void main(String[]args) {\n        Coordinate position1\
    \ = new Coordinate();\n        Coordinate position2 = new Coordinate();\n    \
    \    Coordinate position3 = new Coordinate();\n        position1.setBothCoords(3,3);\n\
    \        position2.setBothCoords(7,7);\n        position3.setBothCoords(9,9);\n\
    \        System.out.println(\"position1 \" + position1.getX());\n        System.out.println(\"\
    position2 \" + position2.getX());\n        System.out.println(\"position3 \" +\
    \ position3.getX());\n    }\n}\n```\n\nWe do not need to print the `Y` values\
    \ to see that each of these class instances are, in fact, separate from each other.\
    \ They are modifiable copies of the `Coordinate` class that exist in memory. Here,\
    \ our class acts quite a bit like a blueprint for something that will be constructed\
    \ and exist in memory. Let us move on to class members and see how changes.\n\n\
    ## 3.3 Static And Instance Members\n\nStatic members or class members are not\
