- fmt: "\nThe utility class will now take compatible object references and print the\
    \ results. It will also modify the coordinates of your classes with the `moveShape`\
    \ method.\n\nYou may decide to continue the example and add more methods that\
    \ compare and modify three dimensional objects. It is also possible to write additional\
    \ objects for variety. As far as examples are concerned, we are finished with\
    \ the shape classes, though are not finished with generics.\n\n# CHAPTER 11: GENERIC\
    \ TYPES II - GENERIC INTERFACES\n\nFor our final chapter we will continue with\
    \ generics and finish with another example. Here is where we combine generics,\
    \ interfaces and abstract methods. By using all three, we will see the full power\
    \ of Java’s abstraction. \n\nLet us begin.\n\n## 11.1 Generic Interfaces\n\nThere\
    \ are a few key differences between generic classes and interfaces. First, we\
    \ already know that for each implementation of an interface its behavior may vary.\
    \ Generic interfaces take this a step further by allowing us to specify a type\
    \ argument each time we implement them in a class.\n\nFirst, we will write a class\
    \ named `ItemBox` with a type variable that must extend or implement `Item`.\n\
    \n```java\npublic class Item{}\n```\n\nWe do not need to fill the class details\
    \ for these examples.\n\n```java\npublic interface ItemBox<T extends Item> { \
    \ ///  }\n```\n\nWhen we write our `ItemStorage` class, we use the `Interface`\
    \ as a type bind for `T`.\n\n```java\npublic class ItemStorage implements ItemBox<Item>\
    \ { }\n```\n\nWe implement the interface and fill the type argument here instead\
    \ of during instantiation. This will be easy to remember as a rule if you think\
    \ of all interface requirements as the implementing class's responsibility.\n\n\
    ```java\npublic class Main {\n    public static void main(String[]args) {\n  \
    \      ItemStorage storage = new ItemStorage();\n    }\n}\n```\n\nWhen a class\
    \ implements a generic type variable while having its own, things may look a little\
    \ complicated, but once we have handled the interface’s type argument, we may\
    \ then instance the generic class like we normally would.\n\n```java\npublic class\
    \ ItemUtils {}\n\npublic class ItemStorage<T extends ItemUtils> implements ItemBox<Item>\
    \ {\n    T utils;\n}\n```\n\nHere we must fill the interface’s type argument first,\
    \ then the class’ type argument when instancing it.\n\n```java\npublic class Main\
    \ {\n    public static void main(String[]args) {\n        ItemStorage<ItemUtils>\
    \ storage = new ItemStorage<>();\n    }\n}\n```\n\nWhat generic interfaces allow\
    \ us to do is set their type arguments differently for each class they appear\
    \ in. This makes our interfaces even more reusable than before.\n\nFor our next\
    \ section, we will add some generic abstract methods to our `ItemBox`.\n\n## 11.2\
    \ Generic Abstract Methods\n\nGeneric abstract methods are not so different from\
    \ normal generic methods. Parameterized types either resolve type data by their\
    \ interface’s type parameter, or they will do it themselves with the same type\
    \ deduction process that non-abstract methods use.\n\nHere is an example where\
    \ the same type variable appears in the interface and method’s parameters. The\
    \ method’s type variable takes its bind(s) from the interface.\n\n```java\npublic\
    \ interface ItemBox<T extends Item> {\n    void setItem(T item);\n    T getItem();\n\
    }\n```\n\nThese two simple generic methods will use the type variable `T` to determine\
    \ what object references they will accept and return. Here they are implemented\
    \ in the `ItemStorage` class.\n\n```java\npublic class ItemStorage implements\
    \ ItemBox<Item> {\n    Item item;\n    @Override\n    void setItem(Item item)\
    \ {\n        this.item = item;\n    }\n    @Override\n    Item getItem() {\n \
    \       return this.item;\n    }\n}\n```\n\nThe methods take the `Item` parameter\
    \ from their interface’s implementation. If we remove the interface’s type variable,\
    \ we would have to specify both of the generic typebounds as in the example below.\n\
    \n```java\npublic interface ItemBox {\n    <T extends Item> void setItem(T item);\n\
    \    Item getItem();\n}\n```\n\nI have used `Item` as a return type for the `getItem`\
    \ class. Another thing we could do is either add the interface’s parameter back\
    \ into the interface, or move the `getItem` method into another interface where\
    \ the type parameter belongs to the interface and the return type will not be\
    \ ambiguous.\n\n```java\npublic interface ItemBox {\n    <T extends Item> void\
    \ setItem(T item);\n}\npublic interface ItemCollector<I> {\n    I getItem();\n\
    }\n```\n\nTo use both methods we would simply implement both interfaces in our\
    \ `ItemStorage` class.\n\n```java\npublic class ItemStorage implements ItemBox,\
    \ ItemCollector<Item> {\n    Item item;\n    @Override\n    Item getItem() {\n\
    \        return this.item;\n    }\n    @Override\n    void setItem(Box<Item> m)\
    \ {\n        this.item = m;\n    }\n}\n```\n\n## 11.3 Final Example\n\nThere are\
    \ countless ways to use interfaces and there are nuances that are numerous to\
    \ cover. What we will do in this section is show how generic may be instanced\
    \ in different ways.\n\nFirst, we will make an `enum` that tell savable and printable.\n\
    \n```java\nenum MessageTypes {\n    SAVE, PRINT;\n}\n```\n\nNow we will make `TextItem`\
    \ class that holds either two states.\n\n```java\npublic class TextItem {\n  \
    \  String text;\n    MessageTypes type;\n    public TextItem(String msg, MessageTypes\
    \ type) {\n        this.text = msg;\n        this.type = type;\n    }\n}\n```\n\
    \nWe will need a way to call the same methods with a different type.\n\n```java\n\
    public interface TextConsumer<T extends TextItem> {\n    void processText(T text);\n\
    }\n```\n\nOur first class to implement `TextConsumer` will be simple. All it must\
    \ do is take the text and print it to our terminal.\n\n```java\npublic class MessageReader\
    \ implements TextConsumer<TextItem> {\n    @Override\n    public void processText(TextItem\
    \ item) {\n        System.out.println(item.text);\n    }\n}\n```\n\nThis does\
    \ not justify using an abstract method, so let us add another class that is made\
    \ to handle messages set to SAVE. It will be somewhat more complex and will require\
    \ a few imports from the `JDK`.\n\n```java\nimport java.io.IOException;\nimport\
    \ java.io.FileWriter;\n\npublic class MessageWriter implements TextConsumer<TextItem>\
    \ {\n    String path;\n    String text;\n    FileWriter write;\n    public MessageWriter(String\
    \ path) {\n        this.path = path;\n    }\n    @Override\n    public void processText(TextItem\
    \ item) {\n        try {\n            write = new FileWriter(this.path, true);\n\
    \            // 'true' means that it will append the text\n            write.write(item.text);\n\
    \            write.close();\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n"
