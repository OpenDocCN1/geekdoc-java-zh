  trans: "\n在我们重写这两个形状类之前，让我们简单学习一下 Java 的抽象类和抽象方法。诚然，面向对象编程在本质上是非常抽象的，因此你可能会好奇抽象类与普通类有什么区别。简而言之，抽象类具有以下特点：\n\
    \n*   使用 `abstract` 关键字\n*   不能实例化\n*   可能包含抽象方法\n\n看起来我们为了获得这些所谓的抽象方法，将牺牲很多。它们到底有什么特别之处呢？它们的实现可能在不同的类之间有所不同。下面是一个抽象方法的示例。\n\
    \n```java\nabstract int changesX(int x);\n```\n\n`abstract` 关键字允许我们编写一个没有方法体的方法。即使没有方法体，我们也是在做出一种承诺，表示我们在每个扩展类中都会提供一个实现。我们写的每个非抽象子类都必须有一个同名的方法，且该方法必须返回一个\
    \ `int` 并接受一个 `int` 作为参数。\n\n以下是其中一个子类的实现。\n\n```java\n//...  int otherNumber;\
    \  @Override  int changesX(int x) {    otherNumber += x;    return otherNumber;\
    \  //...  }\n```\n\n这是另一个子类的实现。注意方法体是如何不同的。它与另一个子类对 `changesX` 方法的定义不同，但它仍然符合我们在抽象类中编写的抽象方法头。\n\
    \n```java\n//...  @Override  int changesX(int x) {    int result = (x * x * x);\
    \    return result;  //...  }\n```\n\n从这些示例中可以看出，抽象类和抽象方法允许我们声明一次方法，并多次定义其具体实现。当然，抽象引用的类型能够识别抽象方法的存在。\n\
    \n现在让我们回到 `Shape` 类示例中，看看抽象类和方法将如何解决我们的问题。\n\n## 7.3 抽象形状类和方法\n\n我们将回到 `Shape`\
    \ 类，并在类头中将其标记为抽象。接下来，我们写一个名为 `calcArea` 的抽象方法，然后在每个子类中以不同的方式实现它。\n\n```java\n\
    public abstract class Shape { \n    double side;\n    double area;\n    Shape(double\
    \ side) {\n        this.side = side;\n    }\n    double getArea() {\n        return\
    \ this.area;\n    }\n    abstract void calcArea();\n}\n```\n\n这就是使类和方法抽象所需的全部内容。注意，现在我们无法直接实例化它。\n\
    \n让我们回到 `Square` 类并实现 `Shape` 的抽象方法。\n\n```java\npublic class Square extends Shape\
    \ { \n    Square(double, side) {\n        super(side);\n    }\n    @Override\n\
    \    double calcArea() {\n        double d = super.side;\n        super.area =\
    \ (d*d);\n    }\n}\n```\n\n接下来是 `circle` 类。我们将扩展 `Shape` 类并实现它的抽象方法。\n\n```java\n\
    public class Circle extends Shape {\n    public Circle(double radius) {\n    \
    \    super(radius);\n    }\n    @Override\n    public void calcArea() {\n    \
    \    double r = super.side;\n        this.area = 3.1415*(r*r);\n    }\n}\n```\n\
    \n注意 `@Override` 注解的使用。它并不是完全强制，尽管它有助于调试错误并提醒我们该方法实际上源自其他地方。出于这些原因，我们应该始终优先以此方式标注我们的抽象方法。\n\
    \n一旦更新了这两个类，我们就可以将它们存储在数组中，并根据需要调用公共 `calcArea`。我们的最终代码看起来如下。\n\n```java\npublic\
    \ class ShapeManager { \n    Shape[] shapes;\n    ShapeManager(int size) {\n \
    \       this.shapes = new Shape[size];\n    }\n    void reportAll() {\n      \
    \  for(Shape shape : shapes) {\n            shape.calcArea();\n            System.out.println(\"\
    shape area: \"+ shape.getArea());\n        }\n    }\n}\n```\n\n现在我们可以通过 `ShapeManager`\
    \ 引用变量调用 `calcArea` 方法。它们都存储在 `Shape` 引用类型的数组中。\n\n```java\npublic class Main\
    \ {\n    public static void main(String[]args) {\n        ShapeManager sManager\
    \ = new ShapeManager(5);\n        sManager.shapes[0] = new Circle(4);\n      \
    \  sManager.shapes[1] = new Square(3);\n        sManager.shapes[2] = new Square(4);\n\
    \        sManager.shapes[3] = new Circle(7);\n        sManager.shapes[4] = new\
    \ Square(2);\n        sManager.reportAll();\n    }\n}\n```\n\n现在我们可以通过 `ShapeManager`\
    \ 引用变量调用 `calcArea` 方法。它们都存储在 `Shape` 引用类型的数组中。它们到底有什么特别之处呢？它们的实现可能在不同的类之间有所不同。下面是一个抽象方法的示例。\n\
    \n第 7 章结束。我们将开始处理接口。\n\n*   继承允许我们使用抽象方法\n*   抽象类允许我们。\n*   抽象方法可以在每个子类中被实现。\n\
    \n# 第 8 章：接口\n\n上一章中的抽象类允许我们做一些有用事情。首先，我们使用继承来创建子类型。在本章中，我们将学习如何在没有继承的情况下共享类型。\n\
    \n什么是接口？它们是完全不能实例化且没有字段的类。你会在接口内部发现三种方法：默认、静态和抽象。\n\n## 8.1 按实现类型\n\n类定义了新的数据类型。我们在类头中看到的内容告诉我们很多信息，特别是当存在\
    \ `extends` 关键字时。我们知道，当一个类扩展另一个类时，它获得了父类的类型及其所有成员。同样，`implements` 关键字告诉我们类获得了一个或多个接口的类型，并提供了这些接口中任何方法的实现。\n\
    \n*   让我们用一个接口和一个抽象方法替换旧的 `Shape` 类。\n\n```java\npublic interface CalculateArea\
    \ {\n    double calcArea();\n}\n```\n\n我们不再需要用关键字来标记抽象方法。只要它出现在接口中且没有方法体，它就是隐式抽象的。\n\
    \n正如旧 `Shape` 类中的抽象方法一样，你必须为实现 `CalculateArea` 接口获得的抽象方法提供实现。我们甚至使用了相同的注解。\n\n\
    ```java\npublic class Circle implements CalculateArea {\n    double radius;\n\
    \    public Circle(double radius) {\n        this.radius = radius;\n    }\n  \
    \  @Override\n    public double calcArea() {\n        double r = this.radius;\n\
    \        double pi = 3.1415;\n        return pi * (r * r);\n    }\n}\n```\n\n\
    这是实现我们相同的 `CalculateArea` 接口的方形类。再次，我们提供了符合我们实现。\n\n```java\npublic class Square\
    \ implements CalculateArea {\n    double side;\n    Square(double, side) {\n \
    \       this.side = side;\n    }\n    @Override\n    public double calcArea()\
    \ {\n        double s = this.side;\n        return s*s;\n    }\n}\n```\n"
- fmt: "\nEvery class that implements the `CalculateArea` interface has two things\
    \ in common. First, it is bound to provide an implementation for all of the abstract\
    \ methods in `CalculateArea`. Secondly, the object references of these classes\
    \ may be referred to by the interface’s type.\n\nWe may store an array of object\
    \ references and set the type to `CalculateArea`. This will allow you to treat\
    \ `Circle` and `Square` class instances the same.\n\n```java\npublic class ShapeManager{\n\
    \    CalculateArea[] shapes;\n\n    public ShapeManager(int size) {\n        this.shapes\
    \ = new CalculateArea[size];\n    }\n\n    public void reportAll() {\n       \
    \ for(CalculateArea shapes : shapes) {\n            System.out.println(\"area:\
    \ \" + shapes.calculateArea());\n        }\n    }\n}\n```\n\nNow all we must do\
    \ is instance the `ShapeManager` class, add members to its array and watch how\
    \ it works.\n\n```java\npublic class Main {\n    public static void main(String[]args)\
    \ {\n        ShapeManager sManager = new ShapeManager(5);\n        sManager.shapes[0]\
    \ = new Circle(4);\n        sManager.shapes[1] = new Square(3);\n        sManager.shapes[2]\
    \ = new Square(4);\n        sManager.shapes[3] = new Circle(7);\n        sManager.shapes[4]\
    \ = new Square(2);\n        sManager.reportAll();\n    }\n}\n```\n\nBy telling\
    \ the `ShapeManager` class to expect objects from classes that implement the `CalculateShape`\
    \ interface, we have completely removed the need for our old `Shape` class.\n\n\
    ## 8.2 Multiple Implementations\n\nWhat if we were to make our two dimensional\
    \ object three dimensional? There are a number of ways to do this. Inheritance\
    \ is an option, but we will avoid it for now to show how flexible interfaces are.\n\
    \nLet us start with an interface that calculates volume.\n\n```java\npublic interface\
    \ CalculateVolume {\n    double calculateVol();\n}\n```\n\nNow we will make a\
    \ `cube` class and use both interfaces to calculate the dimensions and volume.\
    \ Note that we must use different math to get all six sides of our cube.\n\n```java\n\
    public class Cube implements CalculateArea, CalculateVolume {\n    double side;\n\
    \n    public Cube(double side) {\n        this.side = side;\n    }\n\n    @Override\n\
    \    double calculateArea() {\n        double s = this.side;\n        return 6\
    \ * (s*s);\n    }\n\n    @Override\n    double calculateVolume() {\n        double\
    \ s = this.side;\n        return (s*s*s);\n    }\n}\n```\n\nInheritance of state\
    \ is strictly prohibited in Java because conflicting values cause technical issues.\
    \ Both abstract and concrete classes may have member fields, so it makes sense\
    \ that we cannot extend more than one per class. Interfaces cannot have data fields\
    \ of any kind, so there is no reason to restrict them to this single inheritance\
    \ rule.\n\nOne class may inherit multiple interfaces and interfaces may extend\
    \ multiples of each other.\n\n```java\npublic interface Calculate3D extends CalculateArea,\
    \ CalculateVolume {  }\n```\n\nWe do not have any methods to put in this interface\
    \ yet, but it will work for our example.\n\nNow we may rewrite our `Cube` class\
    \ declaration as such:\n\n```java\npublic class Cube implements Calculate3D {\
    \ //...  }\n```\n\nThe same implementation rules apply here. Our new `Cube` class\
    \ must implement all of the methods from the `CalculateArea` and `CalculateVolume`\
    \ interfaces, as well as any abstract methods that we add to `Calculate3D`.\n\n\
    Before we create and calculate any instances of the `Cube` class, let us turn\
    \ our circle into a sphere. We will write this example a little differently to\
    \ show how interfaces and abstract classes work.\n\n## 8.3 Mixing Implementation\
    \ and Inheritance\n\nWe will combine inheritance and implementation for our `Sphere`\
    \ class. First, We will write an abstract `Rounded3D` class that implements the\
    \ `Calculate3D` interface. Take note of how it ignores `Calculate3D`’s abstract\
    \ methods.\n\n```java\npublic abstract class Rounded3D implements Calculate3D\
    \ {\n    double volume;\n    double totalArea;\n    double radius;\n    double\
    \ circleArea;\n\n    public Rounded3D(double radius) {\n        this.radius =\
    \ radius;\n    }\n\n    public void calculateCircle() {\n        double pi = 3.14;\n\
    \        double r = this.radius;\n        this.circleArea = pi * (r*r);\n    }\n\
    }\n```\n\nThe `Rounded3D` abstract class shows us a useful feature that helps\
    \ us write more code. Remember the benefit of abstract classes is that they may\
    \ have abstract methods and not implement them. Because of this, it is up to you\
    \ whether you wish to implement some, all or none of the abstract methods in `Calculate3D`\
    \ or the interfaces it extends.\n\nWhat about classes that extend `Rounded3D`?\
    \ If an extending class is not abstract, then it must implement any abstract methods\
    \ whether they originate from the superclass or interfaces the superclass implements.\n\
    \n```java\npublic class Sphere extends Rounded3D {\n    public Sphere(double radius)\
    \ {\n        super(radius);\n    }\n\n    @Override\n    public double calculateArea()\
    \ {\n        double circle = super.calculateCircle();\n        return circle *\
    \ 4;\n    }\n\n    @Override\n    public double calculateVolume() {\n        double\
    \ r = super.radius;\n        double rCubed = (r*r*r);\n        volume = (4*pi*rCubed)/3;\n\
    \        return volume;\n    }\n}\n```\n\nThe `Sphere` class will now take an\
    \ input and calculate the volume and area for us. The abstract `Rounded3D` class\
    \ provides a few helper methods, but leaves the important implementations up to\
    \ us. This makes the `Rounded3D` class useful for other shapes.\n\n### 8.3.1 An\
    \ Optional Cylinder\n\nThis section shows how we would go about adding another\
    \ rounded dimensional shape by extending the `Rounded3D` class. You may choose\
    \ to skip this section, as it is not as essential as the other two.\n\nOur new\
    \ `Cylinder` class extends `Rounded3D` and adds a new `height` dimension. We will\
    \ combine inherited members and custom implementations to calculate the surface\
    \ area and volume of this new shape.\n\n```java\npublic class Cylinder extends\
    \ Rounded3D {\n    double height;\n\n    public Rounded3D(double radius, double\
    \ height) {\n        super(radius);\n    }\n\n    @Override\n    public double\
    \ calculateArea() {\n        double rh;\n        double flatSide;\n        flatSide\
    \ = super.calculateCircle();\n        rh = this.radius * this.height;\n      \
    \  this.area = 2*pi*rh + 2*flatSide;\n        return area;\n    }\n\n    @Override\n\
    \    public double calculateVolume() {\n        double rSq,flatSide;\n       \
    \ flatSide = super.calculateCircle();\n        this.volume = flatSide * height;\n\
    \        return volume;\n    }\n}\n```\n\nNow we have used the `Rounded3D` class\
    \ for two different three-dimensional shapes and they both share a common supertype.\
    \ In addition, both of these classes share a common implementation with the `Cube`\
    \ class.\n\nAll we must do now is write our `ShapeManager` class so that it may\
    \ anticipate what kind of references we will send to it.\n\n## 8.4 Accepting Interface\
    \ References\n\nAssume that we want our `ShapeManager` class to store all of the\
