    \ mCubeUtils = new ShapeUtils<>(normalCube)\n        //这不符合泛型类型要求\n        ShapeUtils<MovingCube>\
    \ mCubeUtils = new ShapeUtils<>(normalCube)\n        // 类型参数是正确的，但普通的立方体是不不起的！\n\
    \    }\n}\n```\n\n通过指定它们还必须实现 `HasCoordinates` 接口，我们有效地过滤掉了非移动 3D 形状。\n\n## 9.4\
    \ 类型边界的泛型方法\n\n方法也可以拥有类型参数，有两种方法指定它们。一种方法是与方法共享一个泛型类 `variable`。另一种方法是让方法声明自己的类型变量和边界。在任何一种情况下，我们在调用方法时都不向方法提供类型参数。\n\
    \n```java\npublic class ShapeUtils<T extends Calculate3D & HasCoordinates> {\n\
    \    T currentShape;\n    void setShape(T shape3D) {\n        this.currentShape\
    \ = shape3D;\n    }\n    T getShape() {\n        return this.currentShape;\n \
    \   }\n}\n```\n\n注意方法类型变量是裸露的，没有被困在角括号之间，因为它们在其他地方定义。\n\n我们将像之前的示例一样实例化该类。向任何泛型方法发送对象引用不需要额外的步骤，尽管我们仍然受限于类类型参数所指定的发送引用。\n\
    \n```java\npublic class Main {\n    public static void main(String[]args) {\n\
    \        MovingCube mCube = new MovingCube();\n        ShapeUtils<MovingCube>\
    \ mCubeUtils = new ShapeUtils<>()\n        mCubeUtils.setShape(mCube);\n     \
    \   MovingCube duplicateRef = getShape();\n    }\n}\n```\n\n一旦 `ShapeUtils` 类知道了确切的类型，我们的方法也知道了。这非常简单。现在让我们尝试移除类的类型变量和边界，以便方法指定它们自己的泛型类型变量。\n\
    \n```java\npublic class ShapeUtils {\n    <T1 extends HasCoordinates & CalculateArea>\
    \ void echoCoordinates(T1 shape) {\n        //...\n    }\n    <T2 extends CalculateVolume>\
    \ void echoVolume(T2 shape) {\n        //....\n    }\n}\n```\n\n注意，现在我们为方法类型变量需要角括号，因为方法本身是泛型的。我们可以使用相同的\
    \ Amp` 运算符添加额外的类型。\n\n```java\npublic class Main {\n    public static void main(String[]args)\
    \ {\n        ShapeUtils sUtils = new ShapeUtils();\n        MovingCube mCube =\
    \ new MovingCube();\n        sUtils.echoCoordinates(mCube);\n        sUtils.echoVolume(mCube);\n\
    \    }\n}\n```\n\n泛型方法的行为非常像普通方法，因为类型要求在方法调用期间会使用 Java 内置的类型推断过程进行解析。\n\n为什么没有泛型返回值？我们的第一个示例使用了类的类型变量来确定所需的类型。实例方法使用该类型，因此很清楚它们必须返回什么。对于拥有自己的类型变量的方法，情况变得更复杂了。方法需要一些提示来指示它们将返回什么，否则我们必须使用反射或类型转换来使之工作。我们还必须问这是否是我们想要的。如果一个方法返回一个类型且我们需要存储它，那么如果我们知道要预期的类型，这样做将变得更容易。\n\
    \n## 9.5 作为方法参数和返回类型的泛型引用变量\n\n当我们编写接受来自泛型类的引用变量的方法时，我们必须在方法的参数中提供类型参数。对于在方法头中指定的任何返回类型也是如此。它们也必须为它们将返回的引用提供类型参数。\n\
    \n假设我们有一个接受我们的形状之一的泛型类。为了接受或返回该类的实例，我们必须编写考虑到该类泛型类型的方法。\n\n```java\npublic class\
    \ CubeHolder<T extends Cube> {\n    T cube;\n}\n```\n\n`CubeHolder` 类在实例化时需要一个参数。我们为该类编写简单的\
    \ setter 或 getter 方法的方法如下：\n\n```java\npublic class ShapeUtils {\n    CubeHolder<Cube>\
    \ myCube;\n    public void cubeSetter(CubeHolder<Cube> myCube) {\n        myCube\
    \ = myCube;\n    }\n    public CubeHolder<Cube> cubeGetter() {\n        return\
    \ CubeHolder<>();\n    }\n}\n```\n\n重要的是要意识到这个版本的 `ShapeUtils` 类不是泛型的，尽管它发送、接收和持有泛型类的对象引用。记住，一旦我们为泛型类提供了类型参数，它就不再发生变化。这就是为什么\
    \ `cubeGetter` 返回类型不需要任何转换。它被设置为返回 `CubeHolder` 类的一个非常具体的实例。\n\n## 9.6 多类型变量\n\
    \n一旦你熟悉了单个泛型变量，添加更多变量就很简单。我们必须做的只是添加另一个泛型变量并用逗号将其隔开。我们可以在 JDK 的 `HashMap` 中观察多个泛型变量。\n\
    \n```java\npublic class ShapeUtils<T1 extends HasCoordinates, T2 extends CalculateVolume>\
    \ {\n    //...\n}\n```\n\n逗号分隔了不同的类型变量。我们可能希望为变量边界添加更多类型，所以我们必须使用 `&` 运算符添加它们。\n\
    \n```java\npublic class ShapeUtils<T1 extends HasCoordinates & Rounded3D, T2 extends\
    \ CalculateVolume & CalculateArea> {\n    //...\n}\n```\n\n为了实例化这些示例中的任何一个，我们必须按照我们在类中声明顺序提供一对类型参数。\n\
    \n```java\npublic class Main {\n    public static void main(String[]args) {\n\
    \        ShapeUtils<MovingCylinder, Cube> shapeUtils = new ShapeUtils<>();\n \
    \   }\n}\n```\n\n我们可以在单个类或方法中添加许多类型变量，但出于考虑，我们现在只使用两个。\n\n### 9.6.1 多方法参数\n\n\
    具有多个类型变量的方法与其单个变量的方法相似。记住，如果没有访问修饰符（如 `public` 或 `protected`），方法看起来可能有点奇怪，因为它们将以类型开头。放心，它们运行得很正常。\n\
    \n```java\npublic class ShapeUtils {\n    <T1 extends HasCoordinates, T2 extends\
    \ CalculateArea> void echoCoordsAndVolume(T1 shapeLocation, T2 shapeArea) {\n\
    \        //...\n    }\n}\n```\n\n此方法处理两个不同的类型变量。就像单个方法一样，当我们调用此类类中的泛型方法时，不需要提供任何类型参数。\n\
    \n```java\npublic class Main {\n    public static void main(String[]args) {\n\
    \        MovingCube cube = new MovingCube();\n        MovingSphere sphere = new\
    \ MovingSphere();\n        ShapeUtils utils = new ShapeUtils();\n        utils.echoCoordsVolume(cube,\
    \ sphere);\n    }\n}\n```\n\n## 9.7 使用原始类型擦除过多\n\n我们必须记住泛型会擦除类型数据。如果在不提供类型参数的情况下实例化泛型类，那么我们实际上是在告诉\
    \ Java 编译器擦除所有类型数据，直到只剩下基础 `Object` 类型。\n\n这让我们付出了类型安全性和清晰度。下面是一个我们必须避免的示例。\n\n\
    ```java\npublic class ShapeUtils<T extends Cube> {\n    T rawType;\n    //...\n\
    }\n```\n\n现在我们忘记为泛型类添加类型参数……\n\n```java\npublic class Main {\n    public static\
    \ void main(String[]args) {\n        ShapeUtils shapeUtils = new ShapeUtils();\n\
    \    }\n}\n```\n"
- fmt: "\n```java\nShapeUtils cubeUtils = new ShapeUtils();\n\ncubeUtils.rawType =\
    \ new Cube();\n//this will compile, but it is not what we want.\n}\n\n/* This\
    \ code may or may not give you a warning depending\non your IDE and compiler settings.\
    \ */\n}\n```\n\nBecause we have erased all of the type data for the `ShapeUtils`\
    \ type parameter, we cannot call any of the `Cube` class’ object methods from\
    \ the `rawType` field. As far as types are concerned, the reference stored in\
    \ the `rawType` field is just the base `Object` type.\n\nEven if the generic variable\
    \ in the `ShapeUtils` class had no bounds, then we would still gain some type\
    \ safety and specificity by providing a type argument on instantiation.\n\nWhen\
    \ it comes to generic methods, they may declare parameterized types as raw types\
    \ and we do not want this either. This is especially troublesome because we do\
    \ not declare any type arguments with method calls.\n\n```java\npublic class ShapeUtils\
    \ {\n    CubeHolder myCube;\n    public void cubeSetter(CubeHolder myCube) {\n\
    \        myCube = cube;\n    }\n    public CubeHolder cubeGetter() {\n       \
    \ return new CubeHolder();\n    }\n}\n```\n\nAbove we have the old `CubeHolder`\
    \ example. The class is parameterized, but when we omit the type arguments in\
    \ our two methods, it becomes a raw type. That means we will know the object reference’s\
    \ type, but not the type that it holds. We must avoid doing this as well.\n\n\
    It is important to provide type arguments in both methods and classes so as not\
    \ to treat any parameterized types as raw, even in cases where the type parameter\
    \ is unbound. As to why raw types are even allowed in Java, this is a measure\
    \ to preserve legacy code bases that predate Java’s generic system, so it is rare\
    \ if ever that we will want to use raw types in our code.\n\n***\n\nThis chapter\
    \ introduced a lot of concepts regarding Java’s generic types. To summarize the\
    \ ideas more briefly: We assign a type variable and describe what types may replace\
    \ it. Then, when declaring that generic class, we provide one or more compatible\
    \ types for its parameter(s). Generic methods are the same, but the type arguments\
    \ are inferred from the object reference that the method receives.\n\nHere are\
    \ some key points from this section:\n\n- Type bound generic parameters are both\
    \ expressive and precise.\n- Type parameters appear in methods, classes, or both.\n\
    - We can use the ampersand operator to specify additional types that satisfy the\
    \ generic variable(s).\n- We fill generic parameters with class or interface names\
    \ on class instantiation.\n- Methods resolve type requirements when we call them\
    \ and send object references.\n\nNow that we have seen some of what generics have\
    \ to offer us, we will work through the complete example in the next chapter.\n\
    \n***\n\n# CHAPTER 10: FULL GENERIC EXAMPLES\n\nThe previous chapter introduced\
    \ a lot of new concepts to learn and use in our code. The examples in that chapter\
    \ were not fully written as to keep things somewhat brief. Now that we have some\
    \ idea of what generics look like and how they work, we will write the `MovingSphere`\
    \ and `MovingCube` classes so that they make full use of generics.\n\n## 10.1\
    \ The ‘HasCoordinates’ Interface & ‘ShapeCoordinates’ Class\n\nFirst, we want\
    \ a `MovingCube` and `MovingSphere`. These will both require a set of x and y\
    \ coordinates and a few methods to get/set the values. Instead of fully implementing\
    \ the `HasCoordinates` interface for each movable 3D object, we will use a clever\
    \ trick with interfaces from the decorator design pattern.\n\nFirst, we write\
    \ the `HasCoordinates` interface.\n\n```java\npublic interface HasCoordinates\
    \ {\n    void setCoordinates(int x, int y, int z);\n    int getCoordinateX();\n\
    \    int getCoordinateY();\n    int getCoordinateZ();\n}\n```\n\nNow that we have\
    \ an interface for position and movement, we will implement it in a `ShapeCoordinates`\
    \ class.\n\n```java\npublic class ShapeCoordinates implements HasCoordinates {\n\
    \    int coordinateX;\n    int coordinateY;\n    int coordinateZ;\n    public\
    \ ShapeCoordinates(int x, int y, int z) {\n        setCoordinates(x,y,z);\n  \
    \  }\n    @Override\n    public void setCoordinates(int x, int y, int z) {\n \
    \       this.coordinateX = x;\n        this.coordinateY = y;\n        this.coordinateY\
    \ = z;\n    }\n    @Override\n    public int getCoordinateX() {\n        return\
    \ this.coordinateX;\n    }\n    @Override\n    public int getCoordinateY() {\n\
    \        return this.coordinateY;\n    }\n    @Override\n    public int getCoordinateZ()\
    \ {\n        return this.coordinateZ;\n    }\n}\n```\n\nWe now have an implementation\
    \ for the `HasCoordinates` interface. We will move on to the `Movable` classes\
    \ and give each their instance of the `ShapeCoordinates` class.\n\n## 10.2 The\
    \ MovingCube and MovingSphere\n\nNow we will make two new classes, though we could\
    \ make as many new shapes as we want because how we have structured our code to\
    \ be reusable. First, the cube.\n\n```java\npublic class MovingSphere implements\
    \ HasCoordinates {\n    ShapeCoordinates coordinates;\n    MovingSphere(double\
    \ radius, int x, int y, int z) {\n        super(radius);\n        this.coordinates\
    \ = new ShapeCoordinates(x,y,z);\n    }\n    @Override\n    public void setCoordinates(int\
    \ x, int y, int z) {\n        coordinates.setCoordinates(x,y,z);\n    }\n    @Override\n\
    \    public int getCoordinateX() {\n        return coordinates.getCoordinateX();\n\
    \    }\n    @Override\n    public int getCoordinateY() {\n        return coordinates.getCoordinateY();\n\
    \    }\n    @Override\n    public int getCoordinateZ() {\n        return coordinates.getCoordinateZ();\n\
    \    }\n}\n```\n\nNote how when we implement the `HasCoordinates` interface, we\
    \ simply refer to the reference variable in the position field. This saves us\
    \ from rewriting the code. The above code is all that it takes to make a new class\
    \ that extends the functionality of the `Cube` and adds coordinate data. Let us\
    \ do the same for the sphere class. \n\n## 10.3 The ShapeUtils Class\n\nHere we\
    \ will write a simple shape utility class that is specifically tailored for three\
    \ dimensional objects. We will use some parameterized generics for the methods\
    \ that calculate and store strings for a full report.\n\n```java\npublic class\
    \ ShapeUtils {\n    private<T1 extends HasCoordinates> String coordsText(T1 shape)\
    \ {\n        String msg;\n        msg = \"x coordinate: \" + shape.getCoordinateX();\n\
    \        msg += \"\\n\" + \"y coordinate: \" + shape.getCoordinateY();\n     \
    \   msg += \"\\n\" + \"z coordinate: \" + shape.getCoordinateZ();\n        return\
    \ msg;\n    }\n    private<T2 extends CalculateVolume & CalculateArea> String\
    \ measurementText(T2 shape) {\n        String msg;\n        msg = \"surface: \"\
    \ + shape.calculateArea();\n        msg += \"\\n\" + \"volume: \" + shape.calculateVol()\
    \ + \"\\n\";\n        return msg;\n    }\n    public<T extends Calculate3D & HasCoordinates>\
    \ String fullReport(T shape, String shapeName) {\n        String report = shapeName\
    \ + \"\\n\";\n        report+= coordsText(shape);\n        report+= measurementText(shape);\n\
    \        return report;\n    }\n    public<M extends HasCoordinates> void moveShape(M\
    \ shape,int x, int y, int z) {\n        int updateX,updateY,updateZ;\n       \
    \ updateX = shape.getCoordinateX() + x;\n        updateY = shape.getCoordinateY()\
    \ + y;\n        updateZ = shape.getCoordinateZ() + z;\n        shape.setCoordinates(updateX,\
    \ updateY, updateZ);\n    }\n}\n```\n\nThis shape utility class is only the beginning\
    \ of what we can do with generic typed methods and classes. We will now run it\
    \ from our main method to see how it all works.\n\n```java\npublic class Main\
    \ {\n    public static void main(String[]args) {\n        MovingCube mCube = new\
    \ MovingCube(10, 10,30,43);\n        MovingSphere mSphere = new MovingSphere(7\
    \ ,50,10,65);\n        ShapeUtils utils = new ShapeUtils();\n        System.out.println(utils.fullReport(mCube,\"\
    cube\"));\n        System.out.println(utils.fullReport(mSphere,\"sphere\"));\n\
    \        utils.moveShape(mCube,-20,2,2);\n        System.out.println(utils.fullReport(mCube,\"\
    movedCube\"));\n    }\n}\n```\n"
