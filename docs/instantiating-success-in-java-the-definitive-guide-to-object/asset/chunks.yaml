- fmt: "\n![](image_rsrcZF.jpg)\n\n# Instantiating Success in Java: The Definitive\
    \ Guide to Object Oriented Power\n\nArthur White\n\n## INTRODUCTION\n\nThere are\
    \ a great many things that you will not find in this book and this is the author’s\
    \ deliberate choice. There are no lengthy descriptions of data structures, frameworks\
    \ or algorithms, only the language-level features that they all have in common.\n\
    \nAs a Java developer, you will find yourself interacting with many different\
    \ libraries, frameworks and applications. All of them are composed of `classes`,\
    \ `interfaces`, `constructors` and `methods`. Even if you count some of these\
    \ features as advanced, you cannot afford to put off learning them forever. To\
    \ do any serious programming in `Java` requires that you interact with these object\
    \ oriented concepts and understand them.\n\nIt would be foolhardy to dive into\
    \ complicated programs and frameworks expect to simply learn by osmosis. You may\
    \ have already found that object oriented programming has a tendency to obfuscate\
    \ where code comes from and what other code acts upon it. `Java`’s natural verbosity\
    \ adds to this challenge and gives us plenty of code to read and write that, often\
    \ times, makes little sense.\n\nWhen in search of answers, it is most likely you\
    \ will find one of two things: either a massive, sometimes expensive, encyclopedia\
    \ of every single feature in the `Java` language and standard library, or a hodgepodge\
    \ collection of online tutorials that, despite their brevity, show far more than\
    \ they tell and leave you guessing as to how it all works. This book is neither.\n\
    \nWhat you will find in the pages of this book is a focused subset of `Java`’s\
    \ features presented with plain examples and explanations. You will learn about\
    \ `constructors`, `interfaces`, `generics`, `abstract methods` and how to combine\
    \ them with each other so that you may understand and use them yourself.\n\nIf\
    \ you are still struggling with the how and why of features that so many aspiring\
    \ programmers struggle with, then this is the book for you. Wrench apart the irons\
    \ of confusion and throw off the chains of ambiguity. It is finally time that\
    \ you Instantiate Success in `Java`.\n\n## CHAPTER 1: GETTING STARTED\n\nBefore\
    \ you get started, it is important that you have a suitable development environment\
    \ to follow the examples throughout this book. If you already have an integrated\
    \ development environment (`IDE`) and a working copy of the `Java Development\
    \ Kit` (`JDK`), then you may skip to the last section in this chapter and read\
    \ through some of the naming conventions either as a refresher or primer for the\
    \ terms and syntax we will encounter ahead.\n\n### 1.1 Choosing an IDE\n\nYou\
    \ will likely find a purpose-build `Java IDE` comfortable and convenient to use.\
    \ The first three editors listed here are such pieces of software and each of\
    \ them is cross platform and free to use. Only one of them charges for premium\
    \ features, but you will not need those features in order to follow the upcoming\
    \ code examples.\n\n### IntelliJ\n\nThis `IDE` from `JetBrains` is one of the\
    \ most popular and comes with many convenient features for `Java` development.\
    \ The program does charge extra for certain premium plugins, but even without\
    \ them this editor is still powerful and easy to use.\n\n### Eclipse\n\nMuch like\
    \ `JetBrains`, the `Eclipse` foundation makes a series of specialized code editors.\
    \ The `Eclipse Java IDE` has plenty of options and plugins in addition to build\
    \ tool integration and project management features. You will find differences\
    \ between `Eclipse` and `Intelliij` come to personal taste more than quality.\
    \ Both are solid options.\n\n### Netbeans\n\n`Netbeans` is a part of `Java` history.\
    \ It has been around since 1996 and comes from the famed `Apache Software Foundation`\
    \ that brought us programs such as `Maven`, `Tomcat`, `Log4j` and many more. Do\
    \ not let this `IDE`’s age fool you, it is continually updated and stands as a\
    \ tried-and-true option for `Java` developers new and old.\n\n### Other Options\n\
    \nAside from the more popular choices, you will still have plenty to choose from.\
    \ One of the most popular `IDEs` of our time is currently `VSCode`. If you are\
    \ already familiar with this editor and would like to use it for `Java`, then\
    \ you will need to install a few plugins to integrate build tools such as `Maven`\
    \ or `Gradle`.\n\nThe last, and least recommended option for a `Java IDE` is choose\
    \ a text editor instead. Programs such as `Vim` and `Emacs` support plugins that\
    \ can make either of them work as a viable option to the other `IDs`, but it takes\
    \ enough time and effort to learn such software that you should consider it as\
    \ a separate endeavor entirely.\n\nIf the options are overwhelming, simply start\
    \ with `Intelliij` and see how it fits. It is popular for a reason and more than\
    \ capable for the upcoming examples.\n\n### 1.2 The Java Development Kit\n\nTo\
    \ program `Java` you will need a copy of the `JDK`. The features in this book\
    \ may work with versions as old as `8`, though they are written and tested in\
    \ `Java 17`, so it is advised that you stick to version `17` or later.\n\nThere\
    \ is more than one way to install your own copy of the `JDK`. Depending on the\
    \ `IDE` you choose, it may simply download one for you when you begin a new project.\
    \ If this is not the case, then another option is to use your operating system’s\
    \ package manager to search for the latest version of the `JDK` available.\n\n\
    Depending on how comfortable you are with a package manager, you may still choose\
    \ to simply download and install a `JDK` manually. This is as easy as navigating\
    \ to the `Oracle.com` website and choosing the right file for your operating system.\
    \ The site has both installation and troubleshooting information that you may\
    \ need.\n\n### 1.3 Naming Conventions\n\nFor the code you write to compile and\
    \ function properly, it must adhere to certain syntactic and logical rules. In\
    \ order for programmers to recognize each other’s code, we have an additional\
    \ set of rules and conventions to follow. These conventions work both ways. Once\
    \ you and know follow them, it is easier to recognize other people’s code and\
    \ it will be easier for other people to recognize yours should you choose to share\
    \ or contribute to other projects.\n\nAssuming that code follows common conventions,\
    \ you may discern a lot of information about it merely from its position in a\
    \ file and the letter case it is written in.\n\n#### Simple Variables\n\nPrimitive\
    \ variables are typically short and descriptive. When a variable’s name grows\
    \ to multiple words it takes a camel case as in the example.\n\n```java\nint tax;\n\
    int taxRate;\n```\n\nThere are several so called primitive types in `Java` such\
    \ as `int`, `char`, `byte` and others. They take all this naming convention for\
    \ variable names, though other non-primitive reference type variables also use\
    \ this naming convention.\n\n#### Methods\n\nMethods are named in camel case like\
    \ normal variables. In addition, they have a pair of parentheses to hold either\
    \ arguments or parameters. They are also named after what they do and what they\
    \ return such as `addReference()`, `getClass()`, or `setValue()`.\n\n```java\n\
    int numberGetter() {\n    return this.number;\n}\n```\nthis method definition\
    \ returns an integer.\n\nMethods may also resolve to a value, so in some cases\
    \ they will appear as an r-value that assigns to a field.\n\n```java\nint myInt;\n\
    myInt = numberGetter();\n```\nthe return value assigns to the variable\n\n####\
    \ Constant Values\n\nConstant values do not change and that means they must be\
    \ both `static` and `final`. The constant nomenclature comes from the `C` language,\
    \ which predates `Java`.\n\nThe convention is to name them in all-caps and with\
    \ underscores to separate words.\n\n```java\nstatic final float DIAMETER;\nstatic\
    \ final float CYLINDER_DIAMETER;\n```\n\n#### Enumerators\n\nEnums appear either\
    \ as their file or nested within another class. They serve as a group of constant\
    \ value choices, so each element is written in all-capital letters.\n\n```java\n\
    public Enum FruitEnum {\n    APPLES, BANANAS, ORANGES, GRAPEFRUITS\n}\n```\n\n\
    When we refer to an enumerated choice, the enumerator’s name and choice connect\
    \ to each other with a dot operator.\n"
