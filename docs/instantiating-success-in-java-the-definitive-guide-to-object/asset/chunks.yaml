    # CHAPTER 2: CLASSES AND PACKAGES


    Class files are no use to us until they are loaded into the Java Virtual Machine.
    The way you write your own code will reflect the need for Java’s class loader
    to locate and load class files. In this chapter, we will learn more about the
    class loading process, as well as packages and how they combine with classes to
    form fully qualified names.


    ## 2.1 What Exactly are Packages?


    As convenient as a fully featured IDE is, you will find that it sometimes obfuscates
    the messier, more technical aspects of Java programming. It is convenient when
    an IDE compresses long file paths and adds package statements for us, but it can
    mystify what is actually happening.


    Packages are no more than folders with Java class files in them, so long as those
    class files have package names and the package names match the names of those
    folders.


    Let us assume the following class is inside of your IDE’s source folder under
    the following file path com/domain/app/. If you are using Windows it will look
    like this: com\domain\app. If you write the following class file and omit a package
    statement, then your IDE will likely give you some warning or add the package
    statement for you.


    //this file has no package statement  public class MyClass {  //...  }


    In order to make this file part of a package, we must add a package statement.
    Each folder name is separated by a system agnostic dot operator instead of a forward
    or backward slash.


    package com.domain.app;  public class MyClass {  //...  }


    This is all it takes to make a class file package. Build tools and IDEs take raw
    code and compile it into a set of folders that mirror our source folders. The
    output is typically stored in a folder marked target.


    If our sourcecode is stored like this:


    src\main\java\com\domain\app\MyClass.java


    Then the output would look like this:


    target\com\domain\app\MyClass.class


    Your file, folder and package names are all preserved throughout the build and
    deployment process. Take any .jar file and open it with an archive manager such
    as Winrar or 7Zip to see folders and class files all arranged neatly as if they
    were still in a Target folder. The author of that .jar file had their packages
    and classes preserved so that they would function.


    The reason that class files and packages must be kept in proper order is so that
    the JVM’s class loader may find and load these files. Only then may the application
    run.


    ## 2.2 Fully Qualified Names


    The JVM uses a combination of three different class loaders in order to search
    directories and load class files. The first two are mainly out of our control
    and operate to load class files that are essential to the JVM itself. It is the
    Application class loader that you will write your class files for.


    The application class loader has an environment variable named CLASSPATH and it
    is always blank. This is so that it may default to the directory where you invoke
    the virtual machine. From there, it searches for a main method to start the program,
    then continues to load class files as needed. The way that the application class
    loader identifies class files is by using their fully qualified names.


    A class file’s fully qualified name is formed by a combination of the file’s name
    and the package that it resides in. The benefit to using fully qualified names
    instead of merely the class’ name, is that you may have two classes with the same
    name in two different packages. These names will not conflict with each other
    because their fully qualified names still differ.


    Here is an example of what would cause a naming conflict without fully qualified
    names.


    package com.domain.app;  public class MyClass {  //...  }


    The JVM is not looking for MyClass when it searches for classfiles. Instead, it
    searches for com.domain.app.MyClass. By using this specific name, the JVM knows
    exactly what to look for and that the class differs from this next one:


    package com.otherdomain.library;  public class MyClass {  //...  }


    We have made two class files with the same name. This is usually discouraged,
    but in projects with many files and dependencies it is inevitable. Thankfully,
    fully qualified names save us the trouble of same-named classes and views the
    two class files as such:


    com.domain.app.MyClass;  com.otherdomain.library.MyClass;


    Packages and their namespaces also help us with our import statements. We will
    look at them next.


    ## 2.3 Import Statements


    Import statements use package names to locate and import class files. Without
    them, we would have to refer to every class type and constructor with its fully
    qualified name. Here is an example of how messy your code would look without the
    help of import statements.


    package com.domain.app;  public class MyClass {      public static void main(String[]args)
    {          com.otherdomain.library.MyClass Obj = new              com.otherdomain.library.MyClass();          /*Note
    that we can split lines and they will compile, though we must          indent
    the continuation.*/      }  }


    Using fully qualified names like this would eventually make our code cluttered
    and unreadable. Thankfully import statements help keep things concise.


    package com.domainname.app;


    import com.otherdomain.library.MyClass;


    public class MyClass {


        public static void main(String[]args) {


            MyClass obj = new MyClass();


        }


    }


    It could be said that when you place a source file in a package, you have effectively
    renamed it. As far as our class loader and build tools are concerned, this is
    what we are specifying.


