    \ mCube = new MovingCube();\n\n        ShapeUtils<MovingCube> mCubeUtils = new\
    \ ShapeUtils<>()\n\n        mCubeUtils.setShape(mCube);\n\n        MovingCube\
    \ duplicateRef = getShape();\n\n    }\n\n}\n\nOnce the ShapeUtils class knows\
    \ the exact type, so do our methods. This is pretty simple. Now let us try removing\
    \ the class’ type variable and bounds so that the methods specify their own generic\
    \ type variables.\n\n  public class ShapeUtils {      <T1 extends HasCoordinates\
    \ & CalculateArea> void echoCoordinates(T1 shape) {          //...      }      <T2\
    \ extends CalculateVolume> void echoVolume(T2 shape) {          //....      }\
    \  }\n\nNote that now we need the angled brackets for the method type variables\
    \ because the methods themselves are generic. We may use the same ampersand operator\
    \ to add additional types.\n\n public class Main {\n\n    public static void main(String[]args)\
    \ {\n\n        ShapeUtils sUtils = new ShapeUtils();\n\n        MovingCube mCube\
    \ = new MovingCube();\n\n        sUtils.echoCoordinates(mCube);\n\n        sUtils.echoVolume(mCube);\n\
    \n    }\n\n}\n\nGeneric methods behave very much like normal methods because type\
    \ requirements are resolved during the method’s call using Java’s built-in type\
    \ deduction process.\n\nWhy are there no generic return values? Our first example\
    \ used the class’ type variable to determine a desired type. The instance methods\
    \ use that type, so it is clear what they must return. In the case of methods\
    \ with their own generic type variables, things are more difficult.\n\nThe methods\
    \ need some hint as to what they will return, otherwise we would have to use either\
    \ reflection or typecasting to make this work. We must also ask if this is what\
    \ we want. If a method returns a type and we are to store it, then it will be\
    \ much easier to do if we know what type of return value to anticipate.\n\n##\
    \ 9.5 Generic Reference Variables as Method Parameters and Return Types\n\nWhen\
    \ we write methods that accept reference variables from generic classes, we must\
    \ provide type arguments in the method’s parameter itself. The same can be said\
    \ for any return types we specify in the method’s header. They too must provide\
    \ a type argument for the reference variable they will return.\n\nLet us assume\
    \ we have a generic class that accepts one of our shapes. To accept or return\
    \ instances of this class, we must write methods that account for the class’ generic\
    \ type.\n\npublic class CubeHolder<T extends Cube> {      T cube;  }\n\nThe CubeHolder\
    \ class requires a parameter on instantiation. The way that we would write a simple\
    \ setter or getter method for this class is as follows:\n\npublic class ShapeUtils\
    \ {            CubeHolder<Cube> myCube;      public void cubeSetter(CubeHolder<Cube>\
    \ myCube) {          myCube = cube;      }      public CubeHolder<Cube> cubeGetter()\
    \ {          return new CubeHolder<Cube>();      }\n\nWhat is important to recognize\
    \ that this version of the ShapeUtils class is not generic, though it sends, receives\
    \ and holds object references of a generic class.\n\nRemember that once we supply\
    \ a type argument to a generic class, the type it is no longer subject to change.\
    \ This is why the cubeGetter return type does not require any type casting. It\
    \ is set to return a very specific instance of the CubeHolder class.\n\n## 9.6\
    \ Multiple Type Variables\n\nOnce you are comfortable with single generic type\
    \ variables, it is easy to add more. All we must do is add another generic variable\
    \ name and separate it with a comma. We may observe multiple generic variables\
    \ in the JDK’s Hashmap for example.\n\npublic class ShapeUtils<T1 extends HasCoordinates,\
    \ T2 extends CalculateVolume> {  //...  }\n\nNote that it is the comma that separates\
    \ different type variables. We may wish to add more types to the variable’s bound,\
    \ so we must simply add them with the ampersand operator.\n\npublic class ShapeUtils<T1\
    \ extends HasCoordinates & Rounded3D, T2 extends  CalculateVolume & CalculateArea>\
    \ {  //...  }\n\nTo instance either of these examples, we must provide a pair\
    \ of type arguments separated by commas and in the order that we declared them\
    \ in the class itself.\n\npublic class Main {\n\n    public static void main(String[]args)\
    \ {\n\n        ShapeUtils<MovingCylinder,Cube> shapeUtils = new ShapeUtils<>();\n\
    \n    }\n\n}\n\nWe may add many type variables in a single class or method, though\
    \ for practicality’s sake we will stick to only two for now.\n\n## 9.6.1 Multiple\
    \ Method Type Parameters\n\nMethods with multiple type parameter variables work\
    \ much like their single variable counterparts. Keep in mind that without an access\
    \ specifier such as public or protected methods may look a little odd because\
    \ they will start with the type syntax. Rest assured, they function quite normally.\n\
    \npublic class ShapeUtils {      <T1 extends HasCoordinates, T2 extends CalculateArea>\
    \ void      echoCoordsAndVolume(T1 shapeLocation, T2 shapeArea) {          //...\
    \      }  }\n\nThis method handles two different typed variables. Just like a\
    \ single method, we do not need to provide any type arguments when we call a generic\
    \ method in a class such as this.\n\n public class Main {\n\n    public static\
    \ void main(String[]args) {\n\n        MovingCube cube = new MovingCube();\n\n\
            MovingSphere sphere = new MovingSphere();\n\n        ShapeUtils utils\
    \ = new ShapeUtils();\n\n        utils.echoCoordsAndvolume(cube, sphere);\n\n\
        }\n\n}\n\n## 9.7 Erasing too Much With Raw Types\n\nWe must remember that\
    \ generics erase type data. If we were to instance a generic class without providing\
    \ a type argument, then we would effectively tell the Java compiler to erase all\
    \ type data until we are left with the base Object type.\n\nThis costs us type\
    \ safety and clarity. Below is an example of what we must avoid.\n\npublic class\
    \ ShapeUtils<T extends Cube> {            T rawType;      //...        }\n\nNow\
    \ we forget to add a type argument for the generic class…\n\npublic class Main\
    \ {\n\n    public static void main(String[]args) {"
