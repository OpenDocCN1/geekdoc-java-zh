    \ The type that best covers all the three dimensional shapes would be the `Calculate3D`\
    \ interface. It has all the methods that we need so it will be the array’s type.\n"
  raw: "Every class that implements the CalculateArea interface has two things in\
    \ common. First, it is bound to provide an implementation for all of the abstract\
    \ methods in CalculateArea. Secondly, the object references of these classes may\
    \ be referred to by the interface’s type.\n\nWe may store an array of object references\
    \ and set the type to CalculateArea. This will allow you to treat Circle and Square\
    \ class instances the same.\n\n public class ShapeManager{\n\n    CalculateArea[]\
    \ shapes;\n\n    public ShapeManager(int size) {\n\n        this.shapes = new\
    \ CalculateArea[size];\n\n    }\n\n    public void reportAll() {\n\n        for(CalculateArea\
    \ shapes : shapes) {\n\n            System.out.println(\"area: \" + shapes.calculateArea());\n\
    \n        }\n\n    }\n\n}\n\nNow all we must do is instance the ShapeManager class,\
    \ add members to its array and watch how it works.\n\n  public class Main {      public\
    \ static void main(String[]args) {                    ShapeManager sManager =\
    \ new ShapeManager(5);                    sManager.shapes[0] = new Circle(4);\
    \          sManager.shapes[1] = new Square(3);          sManager.shapes[2] = new\
    \ Square(4);          sManager.shapes[3] = new Circle(7);          sManager.shapes[4]\
    \ = new Square(2);          sManager.reportAll();          }      }\n\nBy telling\
    \ the ShapeManager class to expect objects from classes that implement the CalculateShape\
    \ interface, we have completely removed the need for our old Shape class.\n\n\
    ## 8.2 Multiple Implementations\n\nWhat if we were to make our two dimensional\
    \ object three dimensional? There are a number of ways to do this. Inheritance\
    \ is an option, but we will avoid it for now to show how flexible interfaces are.\n\
    \nLet us start with an interface that calculates volume.\n\npublic interface CalculateVolume\
    \ {      double calculateVol();  }\n\nNow we will make a cube class and use both\
    \ interfaces to calculate the dimensions and volume. Note that we must use different\
    \ math to get all six sides of our cube.\n\npublic class Cube implements CalculateArea,\
    \ CalculateVolume {\n\n    double side;\n\n    public Cube(double side) {\n\n\
            this.side = side;\n\n    }\n\n    @Override\n\n    double calculateArea()\
    \ {\n\n        double s = this.side;\n\n        return 6 * (s*s);\n\n    }\n\n\
        @Override\n\n    double calculateVolume() {\n\n        double s = this.side;\n\
    \n        return (s*s*s);\n\n    }\n\n}\n\nInheritance of state is strictly prohibited\
    \ in Java because conflicting values cause technical issues. Both abstract and\
    \ concrete classes may have member fields, so it makes sense that we cannot extend\
    \ more than one per class. Interfaces cannot have data fields of any kind, so\
    \ there is no reason to restrict them to this single inheritance rule.\n\nOne\
    \ class may inherit multiple interfaces and interfaces may extend multiples of\
    \ each other.\n\npublic interface Calculate3D extends CalculateArea, CalculateVolume\
    \ {  }\n\nWe do not have any methods to put in this interface yet, but it will\
    \ work for our example.\n\nNow we may rewrite our Cube class’ declaration as such:\n\
    \n  public class Cube implements Calculate3D {  //...  }\n\nThe same implementation\
    \ rules apply here. Our new Cube class must implement all of the methods from\
    \ the CalculateArea and CalculateVolume interfaces, as well as any abstract methods\
    \ that we add to Calculate3D.\n\nBefore we create and calculate any instances\
    \ of the Cube class, let us turn our circle into a sphere. We will write this\
    \ example a little differently to show how interfaces and abstract classes work.\n\
    \n## 8.3 Mixing Implementation and Inheritance\n\nWe will combine inheritance\
    \ and implementation for our Sphere class. First, We will write an abstract Rounded3D\
    \ class that implements the Calculate3D interface. Take note of how it ignores\
    \ Calculate3D’s abstract methods.\n\n  public abstract class Rounded3D implements\
    \ Calculate3D {      double volume;      double totalArea;      double radius;\
    \      double circleArea;      public Rouned3D(double radius) {          this.radius\
    \ = radius;      }      public void calculateCircle() {          double pi = 3.14;\
    \          double r = this.radius;          this.circleArea = pi * (r*r);      }\
    \  }\n\nThe Rounded3D abstract class shows us a useful feature that helps us write\
    \ more flexible code. Remember that the benefit of abstract classes is that they\
    \ may have abstract methods and not implement them. Because of this, it is up\
    \ to you whether you wish to implement some, all or none of the abstract methods\
    \ in Calculate3D or the interfaces it extends.\n\nWhat about classes that extend\
    \ Rounded3D? If an extending class is not abstract, then it must implement any\
    \ abstract methods whether they originate from the superclass or interfaces that\
    \ the superclass implements.\n\n  public class Sphere extends Rounded3D {      \
    \      public Sphere(double radius) {          super(radius);      }      @Override\
    \      public double calculateArea() {          double circle = super.calculateCircle();\
    \          return circle * 4;      }      @Override      public double calculateVolume()\
    \ {          double r = super.radius;          double rCubed = (r*r*r);          volume\
    \ = (4*pi*rCubed)/3;          return volume;      }  }\n\nThe Sphere class will\
    \ now take an input and calculate the volume and area for us. The abstract Rounded3D\
    \ class provides a few helper methods, but leaves the important implementations\
    \ up to us. This makes the Rounded3D class useful for other shapes too.\n\n##\
    \ 8.3.1 An Optional Cylinder\n\nThis section shows how we would go about adding\
    \ another rounded three dimensional shape by extending the Rounded3D class. You\
    \ may choose to skip this section, as it is not as essential as the other two\
    \ examples.\n\nOur new Cylinder class extends Rounded3D and adds a new height\
    \ dimension. We will combine inherited members and custom implementations to calculate\
    \ the surface area and volume of this new shape.\n\n public class Cylinder extends\
    \ Rounded3D {\n\n    double height;\n\n    public Rounded3D(double radius, double\
    \ height) {\n\n        super(radius);\n\n    }\n\n    @Override\n\n    public\
    \ double calculateArea() {\n\n        double rh;\n\n        double flatSide;\n\
    \n        flatSide = super.calculateCircle();\n\n        rh = this.radius * this.height;\n\
    \n        this.area = 2*pi*rh + 2*flatSide;\n\n        return area;\n\n    }\n\
    \n    @Override\n\n    public double calculateVolume() {\n\n        double rSq,flatSide;\n\
    \n        flatSide = super.calculateCircle();\n\n        this.volume = flatSide\
    \ * height;\n\n        return volume;\n\n    }\n\n}\n\nNow we have used the Rounded3D\
    \ class for two different three-dimensional shapes and they both share a common\
    \ supertype. In addition, both of these classes share a common implementation\
    \ with the Cube class.\n\nAll we must do now is write our ShapeManager class so\
    \ that it may anticipate what kind of references we will send to it.\n\n## 8.4\
    \ Accepting Interface References\n\nAssume that we want our ShapeManager class\
    \ to store all of the object references in one convenient array. We must set that\
    \ array’s type to hold all of the different classes that we wrote and potentially\
    \ some new ones. The type that best covers all of the three dimensional shapes\
    \ would be the Calculate3D interface. It has all the methods that we need so it\
    \ will be the array’s type.\n\n public class ShapeManager3D {\n\n    Calculate3D[]\
    \ shapes;\n\n    public ShapeManager(int size) {\n\n        this.shapes = new\
    \ ShapeManager[size];\n\n    }\n\n    public void reportAll() {\n\n        for(Calculate3D\
    \ shapes : shapes) {\n\n            System.out.println(\"shape area:  \" + shapes.calculateArea());\n\
    \n            System.out.println(\"shape volume:  \" + shapes.calculateVolume()+\"\
    \\n\");\n\n        }\n\n    }\n\n}\n\nOnce more, we will instance the classes\
