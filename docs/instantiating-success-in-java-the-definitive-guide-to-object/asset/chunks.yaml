  trans: "\n\n```java\nline1.echoLine();\nline2.echoLine();\nline3.echoLine();\n}\n\
    }\n```\n\n我们可以将默认构造函数转换为默认初始化器，或者保持原样，选择权完全在我们手中。现在我们准备好使用所有的自定义构造函数来实例化 `Triangle`\
    \ 类。\n\n## 5.4 调用带参数的构造函数\n\n我们现在有了三个不同的类。其中一个是一对构成二维点的坐标对，下一个是由两个点构成的线，第三个是由三条线组成的三角形。在实际的图形程序中，这些看起来可能有所不同，并且仅依赖点来绘制线条，但在这里我们更关注的是类和构造函数。\n\
    \n这里是 `Triangle` 类实例化的示例。注意我们使用 `Line2D` 构造函数的各种不同方式。\n\n```java\n public class\
    \ Main {\n    public static void main(String[]args) {\n        Line2D line1 =\
    \ new Line2D(0,0,10,0);\n        Line2D line2 = new Line2D(new Point2D(10,0),10,10);\n\
    \        Line2D line3 = new Line2D(new Point2D(0,0),new Point2D(10,10));\n   \
    \     Triangle triangle = new Triangle(line1,line2,line3);\n        triangle.echoTriangle();\n\
    \    }\n}\n```\n\n既然我们已经使用了点和线来创建一个三角形，我们将进入私有构造函数。\n\n## 5.5 私有构造函数和静态方法\n\n\
    有时构造函数被设置为私有，以便无法从任何外部类访问。我们有其他方法使实例化变得不可能，但有时我们希望将构造函数设为私有，以便限制或严格控制实例化。单例设计模式就是其中这种情况。\n\
    \n单例设计模式是指我们只想一个类的实例。编写这种单例类的方法是将构造函数设为私有，并使用类内部的静态方法来获取其地址。\n\n```java\n public\
    \ class SingleTriangle {\n    Line2D line1;\n    Line2D line2;\n    Line2D line3;\n\
    \    private static SingleTriangle SINGLETON_REFERENCE;\n    private SingleTriangle()\
    \ {};\n    public static SingleTriangle singletonGetter() {\n        if(SINGLETON_REFERENCE\
    \ == null) {\n            SINGLETON_REFERENCE = new SingleTriangle();\n      \
    \  }\n    // 注意，这是 'null' 关键字的良好用例。\n        return SINGLETON_REFERENCE;\n   \
    \ }\n}\n```\n\n记得在第三章中，我们有私有变量和访问它们的公共方法。这个单例是另一个并非纯模板的类示例，它充分利用了类成员访问权限。\n\n\
    通过额外的方法，我们可以为 `Line2D` 编写 setter 和 getter。最重要的是，我们的单例类实际上给了我们同一个对象的地址，而不是它的副本。我们可以通过将引用赋值给两个变量并检查它们的哈希值是否匹配来测试这一点。\n\
    \n```java\n  public class Main {\n    public static main(String[]args) {\n   \
    \     SingleTriangle triangle1 = Triangle.singletonGetter();\n        SingleTriangle\
    \ triangle2 = Triangle.singletonGetter();\n        System.out.println(triangle1.hashCode());\n\
    \        System.out.println(triangle2.hashCode());\n    }\n  }\n```\n\n上述代码应该为\
    \ `triangle1` 和 `triangle2` 变量打印出相同的哈希值。这表明每个变量都持有指向同一个对象的引用。\n\n***\n\n编写我们自己的构造函数意味着我们可能决定类是如何被实例化的。从运行默认代码到要求构造函数参数，当我们开始利用自定义构造函数带给灵活性时，我们有了更多的选择。它们是如此灵活，以至于我们可能通过向类中重新引入默认构造函数来让它们变为可选。\n\
    \n*   默认初始化器允许我们在类被实例化时自动运行代码。\n*   构造函数可以带有在实例化时必须填充的参数。\n*   每个类可以有多个构造函数。\n\
    *   在同一个类中可以同时拥有带参数的构造函数和默认构造函数。\n*   构造函数可以设为私有以限制实例化。\n\n本章结束后，现在我们将学习继承。\n\n\
    ***\n\n# 第 6 章：继承\n\nJava 中的继承既强大又充满危险。通过继承你可以做很多事情，但显然远比你应该做的要多。许多人对继承有自己的观点，有些人会说我们应该完全避免它。无论你计划是否使用继承，有一点是肯定的：你最终会发现自己在与之打交道，无论如何都应该理解它。\n\
    \n我们必须再次思考类文件的内容告诉了我们什么。它们定义了数据类型，以及该类和实例成员的访问和行为特性。类可能指示的另一件事是它扩展了另一个类。扩展意味着继承，继承在添加父类类型的基础上，将任何合格的实例成员添加到子类中。\n\
    \n由于子类也是子类型，它们与其父类共享共同的身份标识。在任何你通常使用父类类型的实例变量的地方，你也可以使用子类类型的实例变量。尽管子类型是兼容的，但你可能会发现你添加了一些并不完全契合的代码。在本章中，我们将首先学习成员，在在下一节中我们将探索类型。\n\
    \n## 6.1 子类规则\n\nJava 不允许单个子类扩展两个父类。我们可以一个接一个地扩展类，像首尾相接连接管道一样，许多类可以共享同一个父类。以下是我们必须遵循的规则的一些示例。\n\
    \n```java\nclass First{}\nclass Second extends First{}\nclass Third extends Second{}\n\
    class Fourth extends Third{}\n```\n\n```java\nclass First{}\nclass Second extends\
    \ First{}\nclass Third extends First{}\nclass Fifth extends First{}\n```\n\nJava\
    \ 不允许我们用一个子类扩展两个父类。\n\n```java\nclass First{}\nclass Second{}\nclass Third extends\
    \ First, Second{} // 这不可行！\n```\n\n使用 `extends` 关键字的规则非常简单。现在让我们看看子类如何继承父类。\n\n\
    ## 6.2 Super 关键字\n\n子类继承其父类的非私有非静态成员。继承的成员在扩展类内部是不可见的，但你可以通过子类的引用或在子类内部使用 `super`\
    \ 关键字来访问它们。\n\n保持继承代码隐藏的好处是，我们的子类不会有来自一个或多个父类的杂乱。缺点是你并不会总是看到自己在处理的内容，当你处理不是自己编写的代码时，这可能会特别令人困惑。在本节中，我们将扩展并访问我们自己的父类成员。\n\
    \n```java\npublic class OriginalGreeting {\n    public void greeting() {\n   \
    \     System.out.println(\"hello from the original superclass\");\n    }\n}\n\
    ```\n\n这个类有一个简单的问候，告诉我们它来自哪里。现在我们添加一个子类。\n\n```java\npublic class SecondGenGreeting\
    \ extends OriginalGreeting {\n    public void secondGenGreeting() {\n        System.out.println(\"\
    hello from the 2ndGen class\");\n    }\n}\n```\n\n这个最终的类我们先留空。\n\n```java\npublic\
    \ class ThirdGenGreeter {}\n```\n\n现在从 `main` 实例化 `ThirdGenGreeter` 类，看看它继承了什么。\n\
    \n```java\npublic class Main {\n    public static void Main(String[]args) {\n\
    \        ThirdGenGreeter greet = new ThirdGenGreeter();\n        greet.greeting();\n\
    \        greet.secondGenGreeting();\n    }\n}\n```\n\n"
- fmt: "\nInheritance allows us to call superclass members as far back up the inheritance\
    \ chain as we want. Let us add some more code to the `ThirdGenClass` to see what\
    \ the `super` keyword will do for us.\n\n```java\npublic class ThirdGenGreeter\
    \ extends {\n    public void finalGreeting() {\n        super.greeting();\n  \
    \      super.secondGenGreeting();\n        System.out.print(\"hello from the third\
    \ gen greeting!\");\n    }\n}\n```\n\nNow to access all three methods we may instance\
    \ and call the `finalGreeting` from the `ThirdGenGreeter` class.\n\n```java\n\
    public class Main {\n    public static void main(String[]args) {\n        ThirdGenGreeter\
    \ thirdGreeter = new ThirdGenGreeter();\n        thirdGreeter.finalGreeting();\n\
    \    }\n}\n```\n\nIt is of particular concern that our `finalGreeting` method\
    \ from the `ThirdGenGreeter` class depends on two superclasses in order to function.\
    \ If you were to change or rename the `FirstGenGreeter` or the `SecondGenGreeter`\
    \ classes, or their methods, then you would surely break the `finalGreeting` method.\
    \ This example is trivial, but in larger programs you must plan so that you do\
    \ not end up writing such tightly coupled code if it is subject to frequent changes.\n\
    \nNow let us see how inheritance and constructors work together.\n\n## 6.3 SuperConstructors\n\
    \nWhen one class extends another class, and that superclass has a parameterized\
    \ constructor, the subclass will inherit the need for constructor arguments. Of\
    \ course, if the parameterized constructor is optional due to the presence of\
    \ a default constructor, then those arguments are also optional for the subclass.\n\
    \nLet us modify the `SecondGenGreeting` class so that it takes some text through\
    \ a parameterized constructor.\n\n```java\npublic class SecondGenGreeting extends\
    \ OriginalGreeting {\n    String message;\n    SecondGenGreeting(String msg) {\n\
    \        message = msg;\n    }\n    public void secondGenGreeting() {\n      \
    \  System.out.println(\"hello from the 2ndGen class\");\n    }\n}\n```\n\nNow\
    \ the `SecondGenGreeter` requires an argument to be instanced. Consequently, The\
    \ `ThirdGenGreeter` class also requires the same constructor argument.\n\n```java\n\
    public class ThirdGenGreeter extends SecondGenGreeting {\n    ThirdGenGreeting(String\
    \ msg) {\n        super(msg);\n        //note how the 'super' keyword also refers\
    \ to constructors\n    }\n    public void finalGreeting() {\n        super.greeting();\n\
    \        super.secondGenGreeting();\n        System.out.print(\"hello from the\
    \ third gen greeting!\");\n    }\n}\n```\n\nNote how the `super` keyword takes\
    \ a string argument like a method. The string value is stored in the `message`\
    \ field that we inherit from the superclass. This makes sense, because if you\
    \ were to call the `secondGenGreeting` without filling the `message` field, the\
    \ program would fail and filling the constructor argument prevents that.\n\n##\
    \ 6.4 Protected Member Inheritance\n\nJava has four access specifiers: public,\
    \ private, protected and default. From within the same package, access is simple.\
    \ Either you may access a class member or not. When your program is split between\
    \ packages, however, you may only access other package members marked either public\
    \ or protected. Protected classes require extension in order to access their contents.\
    \ Let us see a few examples below.\n\nLet us assume the two following classes\
    \ are in different packages.\n\n```java\npackage mypackage.subpackage;\npublic\
    \ class OriginalGreeting {\n    protected void originalGreeting() {}\n    public\
    \ void greeting() {\n        System.out.println(\"hello from the original superclass\"\
    );\n    }\n}\n```\n\nIf we try to instance this class from our `main` method and\
    \ that class does not extend `OriginalGreeting`, then it will not work.\n\n```java\n\
    package mypackage;\npublic class Main {\n    public static void main(String[]args)\
    \ {\n        OriginalGreeting ogGreet = new OriginalGreeting();\n        //this\
    \ will not work\n    }\n}\n```\n\nThe `OriginalGreeting` class’ access specifier\
    \ `protected` limits our cross-package access to the constructor. By using the\
    \ `SecondGenGreeting` subclass, we may access the superclass’ members by inheritance.\n\
    \n```java\npackage mypackage;\npublic class Main {\n    public static void main(String[]args)\
    \ {\n        SecondGenGreeting greet = new SecondGenGreeting(\"\");\n        greet.greeting();\n\
    \    }\n}\n```\n\nWhen working with multiple packages, the entry points you are\
    \ meant to access are typically public. There may be some cases where classes\
    \ are protected, and you will still be able to access them so long as you use\
    \ inheritance.\n\nWe still have a lot to learn about inheritance. You have seen\
    \ how to extend classes and access their contents. Next, you will see how to use\
    \ inheritance to share types.\n\n- Inheritance allows us to share data and methods\
    \ between subclasses.\n- One subclass may only have one superclass.\n- Inheritance\
    \ hides code, though it may also obfuscate where code is.\n- Modifying a superclass\
    \ may break any subclasses that extend it. The further a class extends, the more\
    \ breakable they become.\n- Inheritance is the only way to access protected members\
    \ between classes.\n\n# CHAPTER 7: ABSTRACT CLASSES & METHODS\n\nIn the last chapter\
    \ we had an introduction to inheritance. We saw access specifiers, member inheritance\
    \ and super parameters. We will now learn of a scenario where we want to inherit\
    \ a superclass’ type with its methods, and how a new kind of class and method\
    \ solves some limitations of inheritance.\n\n## 7.1 Initial Classes\n\nFirst,\
    \ we are going to make a base `Shape` class that holds surface of various shapes.\
    \ We will then subclass it and use inheritance to treat reference variables from\
    \ each class the same.\n\n```java\npublic class Shape {\n    double side;\n  \
    \  // we will use side for both square and circle\n    double area;\n    Shape(double\
    \ side) {}\n    double getArea() {\n        return this.area;\n    }\n}\n```\n\
    \nNow that we have a basic `shape` class, we will use it to create specific shapes.\
    \ First, we will extend it with a `square` class.\n\n```java\npublic class Square\
    \ extends Shape {\n    Square(double side) {\n        super(side);\n    }\n  \
    \  void calcArea() {\n        double s = super.side;\n        super.area = s*s;\n\
    \    }\n}\n```\n\nNext is the `circle` class. We will use the side length as the\
    \ radius for convenience.\n\n```java\npublic class Circle extends Shape {\n  \
    \  Circle(double radius) {\n        super(radius);\n    }\n    void calcArea()\
    \ {\n        double r = super.side;\n        this.area = 3.1415*(r*r);\n    }\n\
    }\n```\n\nWe will now instance it in `main` to see what we have far.\n\n```java\n\
    public class Main {\n    public static void main(String[]args) {\n        Circle\
    \ circle = new Circle(4);\n        Square sq = new Square(3);\n        sq.calcArea();\n\
    \        circle.calcArea();\n    }\n}\n```\n\nThis example code should give you\
    \ a few approximate values for each shape’s value. We may find ourselves with\
    \ a large number of shape objects, so we will use an array to keep them organized.\n\
    \n```java\npublic class Main {\n    public static void main(String[]args) {\n\
    \        Shape[] shapes = new Shapes[2];\n        shapes[0] = new Circle(4);\n\
    \        shapes[1] = new Square(3);\n        // shapes[0].calcArea();\n      \
    \  // shapes[1].calcArea();\n        // this will not compile. Why?\n    }\n}\n\
    ```\n"
  raw: "Inheritance allows us to call superclass members as far back up the inheritance\
    \ chain as we want. Let us add some more code to the ThirdGenClass to see what\
    \ the super keyword will do for us.\n\npublic class ThirdGenGreeter extends {\n\
    \n    public void finalGreeting() {\n\n        super.greeting();\n\n        super.secondGenGreeting();\n\
    \n        System.out.print(\"hello from the third gen greeting!\");\n\n    }\n\
    \n}\n\nNow to access all three methods we may instance and call the finalGreeting\
    \ from the ThirdGenGreeter class.\n\npublic class Main {      public static void\
    \ main(String[]args) {          ThirdGenGreeter thirdGreeter = new ThirdGenGreeter();\
    \          thirdGreeter.finalGreeting();      }  }\n\nIt is of particular concern\
    \ that our finalGreeting method from the ThirdGenGreeter class depends on two\
    \ superclasses in order to function. If you were to change or rename the FirstGenGreeter\
    \ or the SecondGenGreeter classes, or their methods, then you would surely break\
    \ the finalGreeting method. This example is trivial, but in larger programs you\
    \ must plan so that you do not end up writing such tightly coupled code if it\
    \ is subject to frequent changes.\n\nNow let us see how inheritance and constructors\
    \ work together.\n\n## 6.3 SuperConstructors\n\nWhen one class extends another\
    \ class, and that superclass has a parameterized constructor, the subclass will\
    \ inherit the need for constructor arguments. Of course, if the parameterized\
    \ constructor is optional due to the presence of a default constructor, then those\
    \ arguments are also optional for the subclass.\n\nLet us modify the SecondGenGreeting\
    \ class so that it takes some text through a parameterized constructor.\n\npublic\
    \ class SecondGenGreeting extends OriginalGreeting {      String message;      SecondGenGreeting(String\
    \ msg) {          message = msg;      }            public void secondGenGreeting()\
    \ {          System.out.println(\"hello from the 2ndGen class\");      }  }\n\n\
    Now the SecondGenGreeter requires an argument to be instanced. Consequently, The\
    \ ThirdGenGreeter class also requires the same constructor argument.\n\npublic\
    \ class ThirdGenGreeter extends SecondGenGreeting {      ThirdGenGreeting(String\
    \ msg) {          super(msg);      //note how the 'super' keyword also refers\
    \ to constructors      }            public void finalGreeting() {          super.greeting();\
    \          super.secondGenGreeting();          System.out.print(\"hello from the\
    \ third gen greeting!\");      }  }\n\nNote how the super keyword takes a string\
    \ argument like a method. The string value is stored in the message field that\
    \ we inherit from the superclass. This makes sense, because if you were to call\
    \ the secondGenGreeting without filling the message field, the program would fail\
    \ and filling the constructor argument prevents that.\n\n## 6.4 Protected Member\
    \ Inheritance\n\nJava has four access specifiers: public, private, protected and\
    \ default. From within the same package, access is simple. Either you may access\
    \ a class member or not. When your program is split between packages, however,\
    \ you may only access other package members marked either public or protected.\
    \ Protected classes require extension in order to access their contents. Let us\
    \ see a few examples below.\n\nLet us assume the two following classes are in\
    \ different packages.\n\npackage mypackage.subpackage;  public class OriginalGreeting\
    \ {      protected void originalGreeting() {}       public void greeting() { \
    \         System.out.println(\"hello from the original superclass\");      } \
    \ }\n\nIf we try to instance this class from our main method and that class does\
    \ not extend OriginalGreeting, then it will not work.\n\npackage mypackage;  public\
    \ class Main {      public static void main(String[]args) {          OriginalGreeting\
    \ ogGreet = new OriginalGreeting();          //this will not work      }  }\n\n\
    The OriginalGreeting class’ access specifier protected limits our cross-package\
    \ access to the constructor. By using the SecondGenGreeting subclass, we may access\
    \ the superclass’ members by inheritance.\n\npackage mypackage;  public class\
    \ Main {      public static void main(String[]args) {          SecondGenGreeting\
    \ greet = new SecondGenGreeting(\"\");          greet.greeting();      }  }\n\n\
    When working with multiple packages, the entry points that you are meant to access\
    \ are typically marked public. There may be some cases where classes are protected,\
    \ and you will still be able to access them so long as you use a some inheritance.\n\
    \n* * *\n\nWe still have a lot to learn about inheritance. You have seen how to\
    \ extend classes and access their contents. Next, you will see how to use inheritance\
    \ to share and substitute types.\n\n*   Inheritance allows us to share types,\
    \ data and methods between subclasses.\n\n*   One subclass may only have one direct\
    \ superclass.\n\n*   Inheritance hides messy code, though it may also obfuscate\
    \ where that code actually is.\n\n*   Modifying a superclass may break any subclasses\
    \ that extend it. The further a class extends, the more breakable they become.\n\
    \n*   Inheritance is the only way to access protected members between classes.\n\
    \n* * *\n\n# CHAPTER 7: ABSTRACT CLASSES & METHODS\n\nIn the last chapter we had\
    \ an introduction to inheritance. We saw access specifiers, member inheritance\
    \ and super constructor parameters. We will now learn of a scenario where we want\
    \ to inherit a superclass’ type along with its methods, and how a new kind of\
    \ class and method solves some limitations of class inheritance.\n\n## 7.1 The\
    \ Initial Classes\n\nFirst, we are going to make a base Shape class that holds\
    \ the surface area of various shapes. We will then subclass it and use type inheritance\
    \ to treat reference variables from each class the same.\n\npublic class Shape\
    \ {\n\n    double side;\n\n    //we will use side for both the square side and\
    \ circle radius\n\n    double area;\n\n    Shape(double, side);\n\n    double\
    \ getArea() {\n\n        return this.area;\n\n    }\n\n}\n\nNow that we have a\
    \ basic shape class, we will use it to create specific shapes. First, we will\
    \ extend it with a square class.\n\n  public class Square extends Shape {      \
    \      Square(double side) {          super(side);      }      void calcArea()\
    \ {          double s = super.side;          super.area = s*s;      }  }   \n\n\
    Next is the circle class. We will use the side length as the radius for convenience.\n\
    \npublic class Circle extends Shape {      Circle(double radius) {          super(side);\
    \      }      void calcArea() {          double r = super.side;          this.area\
    \ = 3.1415*(r*r);      }  }\n\nWe will now instance it in main to see what we\
    \ have so far.\n\n public class Main {\n\n    public static void main(String[]args)\
    \ {\n\n        Circle circle = new Circle(4);\n\n        Square sq = new Square(3);\n\
    \n        sq.calcArea();\n\n        circle.calcArea();\n\n    }\n\n}\n\nThis example\
    \ code should give you a few approximate values for each shape’s value. We may\
    \ find ourselves with a large number of shape objects, so we will use an array\
    \ to keep them organized.\n\n  public class Main {      public static void main(String[]args)\
    \ {                    Shape[] shapes = new Shapes[2];          shapes[0] = new\
    \ Circle(4);          shapes[1] = new Square(3);          shapes[0].calcArea();\
    \          shapes[1].calcArea();          //this will not compile. Why?      }\
    \  }\n\nWe have an array that holds object references of the Shape class. The\
    \ Circle and Square classes became subtypes through inheritance, so you may store\
    \ their reference variables in the same array. For some reason, you are not allowed\
    \ to call the calcArea method from the array members, even though they certainly\
    \ have this method. Why is this?\n\nThe reason that our calcArea method will not\
    \ work, is due to the array’s Shape type lacking such a method of its own. We\
    \ may fix this with some typecasting or other workarounds, though a more elegant\
    \ solution would involve using Java’s abstract classes and methods. We will learn\
    \ about them in the next section.\n\n## 7.2 The Abstract Class and Abstract Methods"
