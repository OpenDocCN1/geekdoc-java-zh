  trans: "\nJVM 需要访问正确的类文件，以便它能够正确编译并运行我们的代码。一旦这些类被加载到 JVM 中，我们就可以开始将它们实例化对象。这就是我们接下来要学习的内容。\n\
    \n回顾本章：\n\n* 文件夹变为包（packages）。\n*   包有助于形成全限定名（fully qualified names）。\n*   全限定名可以防止命名冲突。\n\
    *   JVM 类加载器使用全限定名来查找类文件。\n*   即使是 `.jar` 文件也保持相同的文件夹结构，以防任何全限定名失效。\n\n现在我们已经对类、包和类加载器是如何工作的有了了初步了解，我们将开始编写并实例化我们自己的类文件。\n\
    \n***\n\n# 第 3 章：数据类型与对象\n\n在本章中，我们终于将处理类及其实例。你可能对这些话题已经有些熟悉，但很容易忽略类定义的深层含义，特别是当涉及到数据和类型时。\n\
    \n在继续之前，重要的是要注意：当你看到“对象（object）”和“类实例（class instance）”这两个词时，它们是同一个东西。它们指的都是将类实例化到虚拟机的堆内存区域。\n\
    \n## 3.1 类如何与对象相关\n\n我们将类写成代码，编译代码并将其加载到 Java 虚拟机中，使其作为程序的一部分运行。类通常被称为对象的蓝图或模板，但类中看到的所有代码并不都会变成对象。此外，有时类对象会获得来自我们编写的类之外的代码。\n\
    \n类的另一种思考方式是将类看作既定义又描述用户定义数据类型的代码单元。类文件包含了告诉我们以下信息的代码：\n\n* 它与哪些类共享成员和数据。\n* 类的哪些部分可能只以对象的形式存在。\n\
    * 类成员之间如何相互访问。\n* 如何从外部访问类的成员。\n* 一个新的用户定义数据类型。\n\n如果我们想要理解对象和引用变量，就必须考虑最后这一点。\n\
    \n### 用户定义类型\n\nJava 有两大类类型分类。原始类型（primitive types）是简单的。任何 `int`、`char`、`short`\
    \ 或 `long` 都是一种类型，我们在编写程序时为这些类型命名并赋值。第二类类类型是引用类型（reference types），即我们自己定义的类型。\n\
    \n每当你为一个新类命名时，你就在命名一个新的引用类型。取决于你提供什么样的方法和变量组合作为引用类型，以及该新引用类型如何融入到更大的程序或框架中。\n\n\
    下面是一个简单的用户定义类型示例。它是一个方法和字段的简单集合，但比原始类型要复杂得多。\n\n```java\npublic class Coordinate\
    \ {\n    private int x;\n    private int y;\n    public int getX() {\n       \
    \ return x;\n    }\n    public int getY() {\n        return y;\n    }\n    public\
    \ void setBothCoords(int x, int y) {\n        this.x = x;\n        this.y = y;\n\
    \    }\n}\n```\n\n这个 `Coordinate` 类是一种可以修改自身值的新数据类型。访问这些值的唯一方法是通过一对实例方法，因此我们必须实例化这个类才能正确使用它。让我们为新的新的\
    \ `Coordinate` 类声明一些实例变量。\n\n```java\npublic class Main {\n    public static void\
    \ main(String[]args) {\n        int a;\n        int b;\n        int c;\n     \
    \   Coordinate position1;\n        Coordinate position2;\n        Coordinate position3;\n\
    \    }\n}\n```\n\n作为对比，我们有三个整数值和三个 `Coordinate` 引用变量。正如我们使用 `a`、`b` 和 `c` 等名称来区分它们所持有的整数值一样，我们需要像\
    \ `position1`、`position2` 和 `position3` 这样的引用变量，以便存储和访问存在 JVM 内存中的 `Position`\
    \ 类的不同实例。\n\n## 3.2 类实例\n\n现在你将看到如何实例化类。首先，我们使用类名声明类型，然后添加变量名，最后调用类的构造函数（构造函数也与类命名）。\n\
    \n```java\n//Main.java\npublic class Main {\n    public static void main(String[]args)\
    \ {\n        Coordinate position1; //类型 ^\n        Coordinate position2; //变量^\n\
    \        Coordinate position3 = new Coordinate(); //构造函数 ^\n    }\n}\n```\n\n\
    现在让我们重写上面的代码，使每个实例变量都获取不同类实例的内存地址。我们将调用一些方法并打印出值。\n\n```java\n//Main.java\npublic\
    \ class Main {\n    public static void main(String[]args) {\n        Coordinate\
    \ position1 = new Coordinate();\n        Coordinate position2 = new Coordinate();\n\
    \        Coordinate position3 = new Coordinate();\n        position1.setBothCoords(3,3);\n\
    \        position2.setBothCoords(7,7);\n        position3.setBothCoords(9,9);\n\
    \        System.out.println(\"position1 \" + position1.getX());\n        System.out.println(\"\
    position2 \" + position2.getX());\n        System.out.println(\"position3 \" +\
    \ position3.getX());\n    }\n}\n```\n\n我们不需要打印 `Y` 值就可以看到这些类实例实际上是相互分离的。它们是内存中存在的\
    \ `Coordinate` 类的可修改副本。在这里，我们的类很大程度上像是一个要在内存中构建并存在的对象的蓝图。让我们继续学习类成员。\n\n## 3.3\
    \ 静态成员\n\n静态成员（static members）无论我们创建多少个类变量，都不会在内存中重复实例化。静态成员与实例成员的行为不同，但仍然共享某些属性。下面我重写了\
    \ `Coordinate` 类，使得变量现在是静态的。\n\n```java\npublic class Coordinate {\n    private\
    \ static int globalX = 100;\n    private static int globalY = 100;\n    public\
    \ int setXY(int x, int y) {\n        globalX = x;\n        globalY = y;\n    }\n\
    \    public int getGlobalX() {\n        return globalX;\n    }\n    public int\
    \ getGlobalY() {\n        return globalY;\n    }\n}\n```\n\n`private` 访问修饰符使得这些静态变量从外部变得不可访问。\n\
    \n```java\npublic class Main {\n    public static void main(String[]args) {\n\
    \        Coordinate.globalX = 10;\n        Coordinate.globalY = 10;\n        int\
    \ myInt = Coordinate.globalX;\n        myInt = Coordinate.globalY;\n        //\
    \ 这些都无法工作\n    }\n}\n```\n\n从 `Coordinate` 类外部，我们无法访问它的私有字段。setter 和 getter 方法是公开的，因此它们是在我们的\
    \ `main` 方法访问这两个静态变量的唯一方法。让我们实例化类来获取变量。\n\n```java\npublic class Main {\n    public\
    \ static void main(String[]args) {\n        Coordinate coordinate1 = new Coordinate();\n\
    \        coordinate1.setXY(10, 17);\n        myIntY = coordinate1.getGlobalY();\n\
    \        myIntX = coordinate1.getGlobalX();\n        System.out.println(\"global\
    \ x value: \" + myIntX);\n        System.out.println(\"global y value: \" + myIntY);\n\
    \    }\n}\n```\n\n这是行得通的，而且很有道理。访问 `Coordinate` 类中两个私有类成员的唯一方法是公开的实例方法。在这种情况下，该类完全不像蓝图，但仍然值得实例化到内存中以便我们访问私有变量。创建该类的额外实例将是意义的，因为变量在内存中并不作为副本存在。下一个示例展示了为什么只有一组\
    \ X 和 Y 值。\n\n```java\npublic class Main {\n    public static void main(String[]args)\
    \ {\n        Coordinate coordinate1 = new Coordinate();\n```\n"
- fmt: "\n```java\nCoordinate coordinate2 = new Coordinate();\n\ncoordinate1.setGlobalXY(5,5);\n\
    \nSystem.out.println(coordinate1.getGlobalX());\n\nSystem.out.println(coordinate1.getGlobalY());\n\
    System.out.println(coordinate2.getGlobalX());\nSystem.out.println(coordinate2.getGlobalY());\n\
    \n//this will print five in each instance\n\ncoordinate1.setGlobalXY(10,10);\n\
    \nSystem.out.println(coordinate1.getGlobalX());\nSystem.out.println(coordinate2.getGlobalY());\n\
    \n//now they are all ten\n\n}\n```\n\nRegardless of which reference variable we\
    \ use, they will point to the same pair of class members.\n\n## 3.4 Static VS\
    \ Instance Memory\n\nWe write code that predicts for two different runtime scenarios.\
    \ In one, our class is loaded and initialized into the `JVM`, its static methods\
    \ and variables are already accessible.\n\nIn the second scenario, the class exists\
    \ as an object. From outside of the class' instance, we use a reference variable\
    \ to refer to the memory object. From inside of the instanced class, the members\
    \ not marked `static` will exist and operate only when instanced.\n\nThe example\
    \ class below shows how instance and class members from the same class do not\
    \ behave alike.\n\n```java\npublic class MemberExample {\n    static int staticVar;\n\
    \    int instanceVar;\n\n    public static void staticMethod() {\n        staticVar\
    \ +=1;        // will work\n        instanceVar +=1;     // will not work\n  \
    \      instanceMethod();     // will not work\n    }\n\n    public void instanceMethod()\
    \ {\n        staticVar += 1;           // will work\n        this.instanceVar\
    \ += 1;   // will work\n        staticMethod();  // will work\n    }\n}\n```\n\
    \nThe `MemberExample` class does not contain any reference variables, but you\
    \ can still see what is marked `static` and what is not. The two static members\
    \ are accessible right away, though they cannot interact with instance members\
    \ without an instance variable. An instance variable would guarantee that when\
    \ we call the static method, it would act upon an instance member that already\
    \ exists in memory.\n\nThe instance members are quite different, though when we\
    \ write them, we are implicitly saying that we will definitely have an instance\
    \ of the class at some point so that it may perform the actions we specify. That\
    \ is why it is so much more flexible.\n\n## 3.5 “this” Keyword\n\nYou may use\
    \ the `this` keyword to differentiate between instance variables and parameters\
    \ of the same name. The examples in this book use the keyword a lot, but you may\
    \ choose not to and keep the names of your instance variables and method parameters\
    \ different.\n\n```java\npublic class Example {\n    public int value;\n\n   \
    \ static void valueSetter(int value) {\n        this.value = value;\n        //will\
    \ not work!\n    }\n\n    void numberSet(int value) {\n        this.value = value;\n\
    \        //this will work\n    }\n}\n```\n\nYou may even refer to the current\
    \ class’ instance variable using the `this` keyword. It seems like an odd thing\
    \ to do, but sometimes you will have class instances with an inaccessible constructor.\n\
    \n```java\npublic class Example {\n    public Example instanceGetter() {\n   \
    \     return this;\n    }\n}\n```\n\nClasses do not have addresses, but instances\
    \ do, so the only thing that `this` could refer to is the instance itself. That\
    \ is why the return type is the same as the class. Calling the method will return\
    \ a reference.\n\n***\n\nWe have much to learn about classes and objects. The\
    \ class and instance member differences are good to know, but if you only remember\
    \ one thing from this chapter, it should be that classes are user defined.\n\n\
    * Classes define types.\n* Classes exist as files.\n* Objects exist in memory\
    \ as instances.\n* Not everything inside a class will become an object.\n* Static\
    \ methods cannot access instance members without an instance variable.\n* Instance\
    \ methods can access both class and instance members freely.\n* Things such as\
    \ access specifiers apply to both instance and class members.\n\nIn the next chapter,\
    \ we will take what we have learned and start working with instance variables.\n\
    \n# CHAPTER 4: OBJECT REFERENCES\n\nAlmost all of the code we write in Java will\
    \ involve accessing, creating or storing reference variables in some way. When\
    \ we accept a reference variable in a field or method, we allow one instance of\
    \ a class to interact with another. It is through this process that programming\
    \ techniques such as aggregation or composition are possible. In this chapter,\
    \ we will compose simple objects into larger ones by storing instance references.\
    \ We will also learn how empty references cause problems and one way we may check\
    \ for them.\n\n## 4.1 Pass by Value or Reference\n\nBefore we continue, it is\
    \ worth addressing a particular concern that memory-aware programmers have when\
    \ creating objects and moving their reference variables from one location to another.\n\
    \nIt is true that Java is a pass-by-value language, the value we use to send,\
    \ store, and receive is merely address to a memory location. This is like saving\
    \ a address to a text file. It has some size, but it is trivial compared to all\
    \ the images on the page. Rest assured, passing objects in Java is cheap and this\
    \ is a good thing because we will do it a lot as our grow.\n\n## 4.2 Getting and\
    \ Setting References\n\nLet us try making some of our classes and combining them\
    \ to make a composite object. We will start with a class that holds two `x` and\
    \ `y` coordinates, then store a pair of them together to make a line.\n\n```java\n\
    class Point2D {\n    public float x;\n    public float y;\n}\n```\n\nThis `Point2D`\
    \ class holds a pair of values. We can use them to make a simple dimensional vector\
    \ or line that consists of two `x-y` points.\n\n```java\nclass Line2D {\n    Point2D\
    \ point1;\n    Point2D point2;\n}\n```\n\nNow we have a total of four values spread\
    \ across three class instances. One line holds two points and each point takes\
    \ its own pair of `x` and `y` values. Let us write a class with methods that will\
    \ automate all the instantiation and set our provided values to the two points.\n\
    \n## 4.3 The LineUtils Class\n\nWe have already seen that we may use `static`\
    \ methods with reference variables, so let us write a series of `static` methods\
    \ that create and modify instances of both the `Point2D` and `Line2D` classes\
    \ via reference.\n\n```java\nclass LineUtils {\n    private static Point2D pointInit(float\
    \ x, float y) {\n        Point2D point = new Point2D();\n        point.x = x;\n\
    \        point.y = y;\n        return point;\n    }\n\n    public static Line2D\
    \ lineInit(float x1, float y1, float x2, float y2) {\n        Point2D p1 = pointInit(x1,y1);\n\
    \        Point2D p2 = pointInit(x2,y2);\n        Line2D line = new Line2D();\n\
    \        line.point1 = p1;\n        line.point2 = p2;\n        return line;\n\
    \    }\n\n    private static String pointString(Point2D p) {\n        String result;\n\
    \        result = \"point x: \" + p.x + \"\\n\" + \"point y: \" + p.y;\n     \
    \   return result;\n    }\n\n    public static void echoLine(Line2D line) {\n\
    \        String p1 = pointString(line.point1);\n        String p2 = pointString(line.point2);\n\
    \        System.out.println(p1 + \"\\n\" + p2);\n    }\n}\n```\n"
