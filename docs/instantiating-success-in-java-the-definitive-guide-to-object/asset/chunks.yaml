    \ legacy code bases that predate Java’s generic system, so it is rare if ever\
    \ that we will want to use raw types in our code.\n\n* * *\n\nThis chapter introduced\
    \ a lot of concepts regarding Java’s generic types. To summarize the ideas more\
    \ briefly: We assign a type variable and describe what types may replace it. Then,\
    \ when declaring that generic class, we provide one or more compatible types for\
    \ its parameter(s). Generic methods are the same, but the type arguments are inferred\
    \ from the object reference that the method receives.\n\nHere are some key points\
    \ from this section:\n\n*   Type bound generic parameters are both expressive\
    \ and precise.\n\n*   Type parameters appear in methods, classes, or both.\n\n\
    *   We can use the ampersand operator to specify additional types that satisfy\
    \ the generic variable(s).\n\n*   We fill generic parameters with class or interface\
    \ names on class instantiation.\n\n*   Methods resolve type requirements when\
    \ we call them and send object references.\n\nNow that we have seen some of what\
    \ generics have to offer us, we will work through the complete example in the\
    \ next chapter.\n\n* * *\n\n# CHAPTER 10: FULL GENERIC EXAMPLES\n\nThe previous\
    \ chapter introduced a lot of new concepts to learn and use in our code. The examples\
    \ in that chapter were not fully written as to keep things somewhat brief. Now\
    \ that we have some idea of what generics look like and how they work, we will\
    \ write the MovingSphere and MovingCube classes so that they make full use of\
    \ generics.\n\n## 10.1 The ‘HasCoordinates’ Interface & ‘ShapeCoordinates’ Class\n\
    \nFirst, we want a MovingCube and MovingSphere. These will both require a set\
    \ of x and y coordinates and a few methods to get/set the values. Instead of fully\
    \ implementing the HasCoordinates interface for each movable 3D object, we will\
    \ use a clever trick with interfaces from the decorator design pattern.\n\nFirst,\
    \ we write the HasCoordinates interface.\n\n public interface HasCoordinates {\n\
    \n    void setCoordinates(int x, int y, int z);\n\n    int getCoordinateX();\n\
    \n    int getCoordinateY();\n\n    int getCoordinateZ();\n\n}\n\nNow that we have\
    \ an interface for position and movement, we will implement it in a ShapeCoordinates\
    \ class.\n\npublic class ShapeCoordinates implements HasCoordinates {\n\n    int\
    \ coordinateX;\n\n    int coordinateY;\n\n    int coordinateZ;\n\n    public ShapeCoordinates(int\
    \ x, int y, int z) {\n\n        setCoordinates(x,y,z);\n\n    }\n\n    @Override\n\
    \n    public void setCoordinates(int x, int y, int z) {\n\n        this.coordinateX\
    \ = x;\n\n        this.coordinateY = y;\n\n        this.coordinateY = z;\n\n    }\n\
    \n    @Override\n\n    public int getCoordinateX() {\n\n        return this.coordinateX;\n\
    \n    }\n\n    @Override\n\n    public int getCoordinateY() {\n\n        return\
    \ this.coordinateY();\n\n    @Override\n\n    public int getCoordinateZ() {\n\n\
            return this.coordinateZ();\n\n    }\n\n}\n\nWe now have an implementation\
    \ for the HasCoordinates interface. We will move on to the Movable classes and\
    \ give each their own instance of the ShapeCoordinates class.\n\n## 10.2 The MovingCube\
    \ and MovingSphere\n\nNow we will make two new classes, though we could make as\
    \ many new shapes as we want because of how we have structured our code to be\
    \ reusable. First, the new cube.\n\npublic class MovingSphere extends Sphere implements\
    \ HasCoordinates {\n\n HasCoordinates coordinates;\n\n  MovingSphere(double radius,\
    \ int x, int y, int z) {\n\n    super(radius);\n\n    this.coordinates = new ShapeCoordinates(x,y,z);\n\
    \n  }\n\n  @Override\n\n  public void setCoordinates(int x, int y, int z) {\n\n\
        coordinates.setCoordinates(x,y,z);\n\n  }\n\n  @Override\n\n  public int getCoordinateX()\
    \ {\n\n    return coordinates.getCoordinateX();\n\n  }\n\n  @Override\n\n  public\
    \ int getCoordinateY() {\n\n    return coordinates.getCoordinateY();\n\n  }\n\n\
      @Override\n\n  public int getCoordinateZ() {\n\n    return coordinates.getCoordinateZ();\n\
    \n  }\n\n}\n\nNote how when we implement the HasCoordinates interface, we simply\
    \ refer to the reference variable stored in the position field. This saves us\
    \ from rewriting the code.\n\nThe above code is all that it takes to make a new\
    \ class that extends the functionality of the Cube and adds coordinate data. Let\
    \ us do the same for the sphere class.\n\n## 10.3 The ShapeUtils Class\n\nHere\
    \ we will write a simple shape utility class that is specifically tailored for\
    \ three dimensional objects with coordinates. We will use some parameterized generics\
    \ for the methods that calculate and store strings for a full report.\n\n public\
    \ class ShapeUtils {\n\n    private<T1 extends HasCoordinates> String coordsText(T1\
    \ shape) {\n\n        String msg;\n\n        msg = \"x coordinate: \" + shape.getCoordinateX();\n\
    \n        msg += \"\\n\" + \"y coordinate: \" + shape.getCoordinateY();\n\n        msg\
    \ += \"\\n\" + \"z coordinate: \" + shape.getCoordinateZ();\n\n        return\
    \ msg;\n\n    }\n\n    private<T2 extends CalculateVolume & CalculateArea> String\
    \ measurementText(T2 shape) {\n\n        String msg;\n\n        msg = \"surface:\
    \ \" + shape.calculateArea();\n\n        msg += \"\\n\" + \"volume: \" + shape.calculateVol()\
    \ + \"\\n\";\n\n        return msg;\n\n    }\n\n    public<T extends Calculate3D\
    \ & HasCoordinates> String fullReport(T shape, String shapeName) {\n\n        String\
    \ report = shapeName + \"\\n\";\n\n        report+= coordsText(shape);\n\n        report+=\
    \ measurementText(shape);\n\n        return report;\n\n    }\n\n    public<M extends\
    \ HasCoordinates> void moveShape(M shape,int x, int y, int z) {\n\n        int\
    \ updateX,updateY,updateZ;\n\n        updateX = shape.getCoordinateX() + x;\n\n\
            updateY = shape.getCoordinateY() + y;\n\n        updateZ = shape.getCoordinateZ()\
    \ + z;\n\n        shape.setCoordinates(updateX, updateY, updateZ);\n\n    }\n\n\
    }\n\nThis shape utility class is only the beginning of what we can do with generic\
    \ typed methods and classes. We will now run it from our main method to see how\
    \ it all works.\n\npublic class Main {    public static void main(String[]args)\
    \ {      MovingCube mCube = new MovingCube(10, 10,30,43);      MovingSphere mSphere\
    \ = new MovingSphere(7 ,50,10,65);      ShapeUtils utils = new ShapeUtils(); \
    \     System.out.println(utils.fullReport(mCube,\"cube\"));      System.out.println(utils.fullReport(mSphere,\"\
    sphere\"));      utils.moveShape(mCube,-20,2,2);      System.out.println(utils.fullReport(mCube,\"\
    movedCube\"));    }  }"
