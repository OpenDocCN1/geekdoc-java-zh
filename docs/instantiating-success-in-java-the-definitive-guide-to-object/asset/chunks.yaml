  trans: "\n每个实现 `CalculateArea` 接口的类都有共同点。首先，它必须为 `CalculateArea` 中的所有的抽象方法提供实现。其次，这些类的对象引用可以通过接口的类型来引用。\n\
    \n我们可能会存储一个对象引用数组，并将类型设置为 `CalculateArea`。这将允许你以相同的方式处理 `Circle` 和 `Square` 类的实例。\n\
    \n```java\npublic class ShapeManager{\n    CalculateArea[] shapes;\n\n    public\
    \ ShapeManager(int size) {\n        this.shapes = new CalculateArea[size];\n \
    \   }\n\n    public void reportAll() {\n        for(CalculateArea shapes : shapes)\
    \ {\n            System.out.println(\"area: \" + shapes.calculateArea());\n  \
    \      }\n    }\n}\n```\n\n现在我们所做的就是实例化 `ShapeManager` 类，向它的数组中添加成员，并观察它的工作原理。\n\
    \n```java\npublic class Main {\n    public static void main(String[]args) {\n\
    \        ShapeManager sManager = new ShapeManager(5);\n        sManager.shapes[0]\
    \ = new Circle(4);\n        sManager.shapes[1] = new Square(3);\n        sManager.shapes[2]\
    \ = new Square(4);\n        sManager.shapes[3] = new Circle(7);\n        sManager.shapes[4]\
    \ = new Square(2);\n        sManager.reportAll();\n    }\n}\n```\n\n通过告诉 `ShapeManager`\
    \ 类期望来自实现 `CalculateShape` 接口的类的对象，我们完全消除了对旧 `Shape` 类的需求。\n\n## 8.2 多重实现\n\n\
    如果我们把二维对象变成三维的呢？有很多方法可以实现这一点。继承是一个选项，但我们目前会避免它，以展示接口的灵活性。\n\n让我们从一个计算体积的接口开始。\n\
    \n```java\npublic interface CalculateVolume {\n    double calculateVol();\n}\n\
    ```\n\n现在我们将创建一个 `cube` 类，并使用这两个接口来计算尺寸和体积。请注意，我们必须使用不同的数学方法来获取立方体的所有六面。\n\n```java\n\
    public class Cube implements CalculateArea, CalculateVolume {\n    double side;\n\
    \n    public Cube(double side) {\n        this.side = side;\n    }\n\n    @Override\n\
    \    double calculateArea() {\n        double s = this.side;\n        return 6\
    \ * (s*s);\n    }\n\n    @Override\n    double calculateVolume() {\n        double\
    \ s = this.side;\n        return (s*s*s);\n    }\n}\n```\n\nJava 中严格禁止状态的继承，因为冲突的值会导致技术问题。抽象类和具体类都可能有成员字段，因此每个类不能扩展超过一个父类是有意义的。接口不能拥有任何类型的数据字段，因此没有理由将它们限制在这一单继承规则上。\n\
    \n一个类可以继承多个接口，接口之间也可以相互扩展多个。\n\n```java\npublic interface Calculate3D extends\
    \ CalculateArea, CalculateVolume {  }\n```\n\n我们还没有任何方法要放入这个接口中，但它对我们的示例是有效的。\n\
    \n现在我们可以如下重写我们的 `Cube` 类的声明：\n\n```java\npublic class Cube implements Calculate3D\
    \ { //...  }\n```\n\n相同的实现规则也适用于这里。我们新的 `Cube` 类必须实现来自 `CalculateArea` 和 `CalculateVolume`\
    \ 接口的所有方法，以及我们在 `Calculate3D` 中添加的任何抽象方法。\n\n在我们创建和计算 `Cube` 类的任何实例之前，让我们把圆变成球。我们将以不同的方式编写这个示例，以展示接口和抽象类是如何工作的。\n\
    \n## 8.3 混合实现与继承\n\n我们将为我们的 `Sphere` 类结合继承和实现。首先，我们将编写一个实现 `Calculate3D` 接口的抽象类\
    \ `Rounded3D`。请注意它是如何忽略 `Calculate3D` 的抽象方法的。\n\n```java\npublic abstract class\
    \ Rounded3D implements Calculate3D {\n    double volume;\n    double totalArea;\n\
    \    double radius;\n    double circleArea;\n\n    public Rounded3D(double radius)\
    \ {\n        this.radius = radius;\n    }\n\n    public void calculateCircle()\
    \ {\n        double pi = 3.14;\n        double r = this.radius;\n        this.circleArea\
    \ = pi * (r*r);\n    }\n}\n```\n\n`Rounded3D` 抽象类向我们展示了一个有助于我们编写更多代码的有用特性。记住抽象类的优势是它们可以拥有抽象方法而不实现它们。正因为如此，是否实现\
    \ `Calculate3D` 或其扩展的接口中的某些、全部或没有抽象方法，取决于你。\n\n扩展 `Rounded3D` 的类呢？如果一个扩展类不是抽象的，那么它必须实现任何抽象方法，无论这些方法源自父类还是父类实现的接口。\n\
    \n```java\npublic class Sphere extends Rounded3D {\n    public Sphere(double radius)\
    \ {\n        super(radius);\n    }\n\n    @Override\n    public double calculateArea()\
    \ {\n        double circle = super.calculateCircle();\n        return circle *\
    \ 4;\n    }\n\n    @Override\n    public double calculateVolume() {\n        double\
    \ r = super.radius;\n        double rCubed = (r*r*r);\n        volume = (4*pi*rCubed)/3;\n\
    \        return volume;\n    }\n}\n```\n\n`Sphere` 类现在将接收输入并我们计算体积和面积。抽象 `Rounded3D`\
    \ 类提供了辅助方法，但将重要的实现留给我们。这使得 `Rounded3D` 类对其他形状有用。\n\n### 8.3.1 可选的圆柱\n\n此部分展示了我们如何通过扩展\
    \ `Rounded3D` 类来添加另一个圆形形状。你可以选择跳过此部分，因为它不像其他两个那样重要。\n\n我们新的 `Cylinder` 类扩展了 `Rounded3D`\
    \ 并增加了一个新的 `height` 维度。我们将继承的成员和自定义实现来计算这个新形状的表面积和体积。\n\n```java\npublic class\
    \ Cylinder extends Rounded3D {\n    double height;\n\n    public Rounded3D(double\
    \ radius, double height) {\n        super(radius);\n    }\n\n    @Override\n \
    \   public double calculateArea() {\n        double rh;\n        double flatSide;\n\
    \        flatSide = super.calculateCircle();\n        rh = this.radius * this.height;\n\
    \        this.area = 2*pi*rh + 2*flatSide;\n        return area;\n    }\n\n  \
    \  @Override\n    public double calculateVolume() {\n        double rSq,flatSide;\n\
    \        flatSide = super.calculateCircle();\n        this.volume = flatSide *\
    \ height;\n        return volume;\n    }\n}\n```\n\n现在我们使用 `Rounded3D` 类处理两个不同的三维形状，它们共享一个共同父类型。此外，这两个类与\
    \ `Cube` 类共享相同的实现。\n\n现在我们所做的就是编写我们的 `ShapeManager` 类，以便它可以预测我们将发送给它的什么类型的引用。\n\
    \n## 8.4 接收接口引用\n\n假设我们希望 `ShapeManager` 类将所有的引用存储在一个方便的数组中。我们必须设置该数组的类型以持有我们编写的所有不同类以及可能的一些新类。最好覆盖所有三维形状的类型是\
    \ `Calculate3D` 接口。它拥有我们需要的所有方法，因此它将是数组的类型。\n"
- fmt: "\n```java\npublic class Main {\n    public static void main(String[]args)\
    \ {\n        ShapeManager3D shape3d = new ShapeManager3D(5);\n        shape3d.shapes[0]\
    \ = new Cube(5);\n        shape3d.shapes[1] = new Sphere(10);\n        shape3d.shapes[2]\
    \ = new Cylinder(5);\n        shape3d.shapes[3] = new Cube(7);\n        shape3d.shapes[4]\
    \ = new Sphere(3);\n        shape3d.reportAll();\n    }\n}\n```\n\nAll three of\
    \ our new shapes share a common `Calculate3D` interface, so this is the type that\
    \ we use for our array.\n\nWe may add even more three dimensional shapes and have\
    \ them implement the `Calculate3D` interface. This is how we may call the `calculateVolume`\
    \ and `calculateArea` methods from many different object references without class\
    \ inheritance.\n\nOur example program exposes only some of the power that interfaces\
    \ give us. We could make several abstract classes that implement all, some or\
    \ none of the interface’s abstract methods. We could even subclass abstract classes\
    \ so that each of them implement more abstract methods than the last.\n\nTo summarize:\n\
    \n* Implementation and inheritance are separate, but still allow us to share common\
    \ types.\n* It is optional for abstract classes to implement abstract methods\
    \ from interfaces.\n* One class may implement more than one interface.\n* Interfaces\
    \ may extend each other with multiple inheritance.\n\nWith this chapter finished,\
    \ we will continue working with interfaces and combine them with generics.\n\n\
    # CHAPTER 9: GENERICS I\n\nWhen you extend one class with another, that subclass\
    \ gains the type of its superclass. If either the subclass, superclass or both\
    \ of them implemented one or more interfaces, then the subclass would gain that\
    \ type data as well. Take the `Sphere` class as an example. It is a subclass of\
    \ a superclass that implements multiple interfaces (through interface extension).\n\
    \nAs far as types go, we know that the `Sphere` class has the following types:\n\
    \n* `Sphere`\n* `Rounded3D`\n* `CalculateVolume`\n* `CalcluateArea`\n\nWe have\
    \ four different types to set as method parameters or variable types.\n\nAs we\
    \ add more classes and interfaces to a program, it becomes unclear as to what\
    \ we expect where we declare reference types for method parameters and instance\
    \ variables. Do we want a `Sphere` because it is round? Perhaps we simply want\
    \ an object with circumference or volume.\n\nWe would benefit from a form of syntax\
    \ that helps us state: accept a reference type that extends this class and implements\
    \ these interfaces. Thankfully Java’s generics give us an efficient and type-safe\
    \ way to do just that.\n\nThis entire chapter is about generics and how they will\
    \ help us work with multiple reference types. When you are done with this rather\
    \ long chapter, we will return to our 3D shapes to apply what we have learned.\n\
    \n## 9.1 A Growing Need for Generics\n\nLet us say that we are adding two new\
    \ 3D shape classes. Each of them implements a new interface called `HasCoordinates`.\
    \ Now we have our old 3D shapes as well as these new movable ones, and we want\
    \ to plan for the future so that we may add even more shapes and possibly other\
    \ interfaces for things such as color or image data.\n\nWe will have fields and\
    \ methods that require reference types of one class, or one field, or any combination\
    \ of them. We could group classes together with more interfaces and inheritance,\
    \ but adding more types to our program will only make things more confusing. What\
    \ we will do instead, is use generics to clarify what goes where.\n\n## 9.2 Bound\
    \ Generic Types\n\nGeneric types allow us to specify specific type data within\
    \ pairs of angled brackets. You may have seen the syntax before, where some uppercase\
    \ letter indicates an unknown element or value. The letters are simply a naming\
    \ convention where we typically use `T` for type, `E` for element and `K`,`V`\
    \ for key-value, etc.\n\nThese single-letter type variables are just that, variables.\
    \ They are only placeholders for the name of an actual class or interface. The\
    \ generic variables are exchanged for real type arguments when we refer to the\
    \ class as a reference variable, such as during instantiation.\n\n```java\npublic\
    \ class ShapeUtils <T> {\n    T shape3D;\n}\n```\n\nThis generic class has a type\
    \ parameter named `T`. When we instantiate the class, we must provide an actual\
    \ type argument to fill the generic class' type parameter.\n\n```java\npublic\
    \ class Main {\n    public static void main(String[]args) {\n        ShapeUtils<MovingSphere>\
    \ mSphereUtils = new ShapeUtils<>();\n    }\n}\n```\n\nThat is all it takes to\
    \ write and use a generic typed class, though this generic class is not exactly\
    \ what we want.\n\nWhen we set the generic variable as a single letter such as\
    \ `T`, it is possible for us to supply any type as an argument. Sometimes we want\
    \ this, but such unbound types lack specificity. To restrict what we may supply\
    \ as an argument for the generic, we may specify a bound.\n\n```java\npublic class\
    \ ShapeUtils <T extends Calculate3D> {\n    T shape3D;\n}\n```\n\nNow we add a\
    \ generic `T, whatever we supply as an argument to this class must extend or implement\
    \ `Calculate3D`. Below is an example of `ShapeUtils` with two different arguments.\n\
    \n```java\npublic class Main {\n    public static void main(String[]args) {\n\
    \        MovingCube mCube = new MovingCube();\n        MovingSphere mSphere =\
    \ new MovingSphere();\n        ShapeUtils<MovingCube> mSphereUtils = new ShapeUtils<>();\n\
    \        mSphereUtils.shape3D = mSphere; // this will not work\n\n        ShapeUtils<MovingSphere>\
    \ mSphereUtils = new ShapeUtils<>();\n        mSphereUtils.shape3D = mCube; //\
    \ neither will this\n    }\n}\n```\n\nThe above example shows that even though\
    \ `MovingCube` and `MovingSphere` type arguments are viable for `T`, they are\
    \ not interchangeable with each other after we supply a type argument. The reason\
    \ for this is that Java employs a kind of type erasure that removes all of the\
    \ type data except for what we specify as a type argument. This will exclude even\
    \ similar types.\n\nType erasure is quite a technical process and beyond the scope\
    \ of this book. All we need to know here is that it is both type safe and efficient\
    \ because it eliminates guesswork for the Java compiler.\n\n## 9.3 Bound Generic\
    \ Types\n\nWe have already written a generic type parameter with a single type\
    \ bound. Now we will further restrict type arguments for `T` by adding another\
    \ bound. To show how multiple type binds will help us, we return to the `ShapeUtils`\
    \ class once more and modify the generic type variable so that it is bound to\
    \ multiple types. We use the ampersand (`&`) operator between each additional\
    \ bound for the type variable.\n\n```java\npublic class ShapeUtils<T extends RoundedShape\
    \ & HasCoordinates> {\n    T shape;\n    public ShapeUtils(T shape) {\n      \
    \  this.shape = shape;\n    }\n}\n```\n\nThere are a few rules that we must be\
    \ aware of when specifying multiple type bounds. If any of the bounds are a class’\
    \ name, then that name must appear first. Everything that follows the class’ name\
    \ must be an interface, as we cannot name a type that extends two classes.\n"
