    statements that include the variable membersCard would not have to be re-written.


    A similar use of interfaces as types arises when a number of similar classes implement
    the same interface. For example let us assume that there are a number of data
    structures that can be used to store a specific primitive data type or object
    type, all of which implement the same interface.


    Instantiating one of these data structures is generalised as follows:


    ```

    // SomeDataStructure implements AnInterface;

    AnInterface dataStructure = new SomeDataStructure();

    ```


    followed by code includes the variable dataStructure.


    If we wish to change the data structure, in the light of testing the application,
    we need to re-write only one line of code, i.e. the call to the constructor of
    the new data structure, as follows:


    ```

    // SomeOtherDataStructure implements AnInterface;

    AnInterface dataStructure = new SomeOtherDataStructure();

    ```


