  md: "Java: Classes in Java Applications\n\nErrors in Java Programmes\n\n# 4.4 try\
    \ ... catch — finally Blocks\n\nThe code and output associated with the examples\
    \ discussed in the previous section provide practical evidences that we use to\
    \ bring together a number of points concerning handling exceptions.\n\n+   - Developer-written\
    \ code that might throw an exception is enclosed in a try block.\n- Similarly,\
    \ method invocations are defined to throw exceptions as indicated by the API for\
    \ a method should be enclosed in a try block.\n- A try is followed by one or more\
    \ catch blocks.\n- Each catch block specifies the type of exception it catches\
    \ (i.e. handler) and contains a handler for that exception type.\n- After the\
    \ last catch block, an optional finally block contains code that always executes.\n\
    - When an exception occurs, catch blocks are searched in their order for the appropriate\
    \ handler.\n- It is useful to sequence catch blocks from the specific to the general,\
    \ objects of the Exception class are caught in the last catch block which serves\
    \ as a catch-all if any specific exceptions have not been caught.\n- If an exception\
    \ is not caught in a try...catch block, it is thrown to the next method in the\
    \ call stack.\n- If the exception is passed to the main method and is not handled,\
    \ the program terminates abnormally.\n\nWhen non-memory resources such as files\
    \ and I/O Streams — see Chapter One in Introduction to Java Programming 3: Graphical\
    \ User Interfaces — are used in a programme, they must eventually be released\
    \ independently of Garbage Collection (memory) resources such as identifiers and\
    \ object references. The use of the finally block that follows a try ... catch\
    \ block is a good opportunity to release such resources. The general syntax of\
    \ a try ... catch — finally\n\n```\ntry {\n  // statements that invoke methods\
    \ that throw Exceptions\n  // statements that acquire resources\n  catch(AKindOfException\
    \ ex1) {\n    // exception handling statements for ex1\n  }\n  catch(AnotherKindOfException\
    \ ex2) {\n    // exception handling statements for ex2\n  }\n```\n\nDownload free\
    \ books at BookBooN.com\n\n82"
