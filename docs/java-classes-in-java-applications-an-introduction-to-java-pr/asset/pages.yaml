    # 3.5 What Does Type Compatibility Mean?


    Now that we have explored some of the essential concepts associated with inheritance,
    we can address the deferred discussion about conversion of type variables from
    Chapter Three (An Introduction to Java Programming 3: The Fundamentals of Objects
    and Classes).


    > Java is a strongly-typed language. This means that the compiler checks for type
    compatibility at compile time, preventing incompatible assignments.


    Checking for type compatibility is carried out when an expression is assigned
    to a type variable as:


    ```

    SomeClass sc = < expression that returns an object reference >;

    ```


    The compiler will regard the types as compatible when one of three conditions
    apply to the expression:


    +   1. the expression returns an object reference of the SomeClass type;

    2. the expression returns an object reference to a subclass of SomeClass;

    3. the expression returns an object reference to an object that implements the
    SomeClass interface. (Java interfaces explored in Chapter Five.)


    We can use the class hierarchy shown in Figure 3.3 to illustrate the first two
    conditions.


    Consider the following statement:


    ```

    Student s1 = new Student(111, "Java");

    ```


    This statement compiles because it complies with the first condition.


    Consider the next statement:


    ```

    Student s2 = new PartTimeStudent(222, "Java");

    ```


    This statement compiles because it complies with the second condition.


    It is worthwhile dwelling on the general nature of the second condition:


    ```

    SuperClass sc = new SubClass();

    ```


