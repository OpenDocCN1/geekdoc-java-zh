  md: '# Java: Classes in Java Applications


    # Extending Classes by Means of Inheritance


    +   - Inheritance is the ability to create new classes from existing ones;

    - Java exhibits single inheritance; i.e. a subclass can have only one superclass;

    - fields and methods are inherited in a subclass; new ones can be introduced;

    - constructors are not inherited;

    - a class Object is at the top of the Java inheritance tree, as shown by the Java
    API;

    - all Java classes implicitly inherit methods from its parent class; this is known
    as overriding; thus, an instance method with the same signature and return type
    as a method in the superclass is said to override it;

    - the keyword super is used to refer to the members of a superclass, variables
    methods and constructors; thus, an overriding method can invoke the overridden
    method using the keyword super;

    - a method invocation does not have to be on a method in the superclass; it can
    be to a method further up the class hierarchy.


