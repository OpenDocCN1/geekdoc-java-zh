    The examples in this section show how the compatibility rules for using interfaces
    as types can be exploited to minimise re-writing code and gives rise to significant
    re-usability of code.


    # 5.5 Summary of Java Interfaces


    The principal concepts associated with Java interfaces are summarised next.


    +   - Java allows a class to inherit from only one superclass but allows the class
    to implement one or more interfaces.

    - Interfaces are not part of the class hierarchy; unrelated classes can implement
    the same interface.

    - Interfaces can be declared as class types at compile time.


    The ways in which Java interfaces can be used is summarised as follows.


    +   - Declaring methods that one or more classes can implement.

    - Determining an object''s programming interface without the need to reveal the
    body of the methods implemented in the class.

    - Exposing similarities amongst unrelated classes without forcing a "is a" class
    relationship.

    - Simulating multiple inheritance by declaring that a class implements more than
    one interface.


