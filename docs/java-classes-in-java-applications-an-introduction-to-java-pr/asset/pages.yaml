    # 2.4.2 The if ... else construct


    The if ... else construct (sometimes known as the if ... then ... else construct)
    provides an alternative path of execution if the if condition evaluates to false.
    Figure 2.1 illustrates, diagrammatically, the logic of the if ... else construct.


    ![](img/8e21bca3c5638080efd3c1b81bc23762_21_0.png)


    Figure 2.1 The logic of the if ... else construct


    Flow of control enters the if clause and the if condition is tested. The result
    of evaluating the if condition returns either true or false and one or other of
    the paths of execution are followed depending on this value. The else block is
    executed if the condition is false.


    The next code snippet illustrates a simple use of the if ... else construct by
    modifying the first code snippet in Section 2.4.1.


