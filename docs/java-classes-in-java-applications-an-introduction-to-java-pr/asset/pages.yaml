  md: "# 3. Extending Classes by Means of Inheritance\n\nChapter Three explores one\
    \ of the corners of OOP, namely that of inheritance. Java classes can be easily\
    \ modified and extended for the purpose of re-use by means of inheritance rather\
    \ than re-writing the source code of the class to be modified.\n\n# 3.1 What Does\
    \ Inheritance Mean?\n\nIn order to explain what inheritance means in the Java\
    \ language, let us consider a very simple example. Suppose that we have a class\
    \ called MyClass, with the following trivial class definition that declares a\
    \ single member:\n\n```\npublic class MyClass {\n\n    private int someValue;\n\
    \n}\n```\n\nand suppose that we wish to re-use this class and, in doing so, we\
    \ wish to give the replica a different name. To do this, we would write the following\
    \ class definition:\n\n```\npublic class MyOtherClass {\n\n    private int someValue;\n\
    \n}\n```\n\nIn other words, we have re-written the body of MyClass in the class\
    \ definition of MyOtherClass. In our trivial example, the effort of re-writing\
    \ the body of MyClass is minimal in that there only one member to declare. In\
    \ the general case, on the other hand, the effort of re-writing a large class\
    \ definition ought to be avoidable.\n\nThe concept of inheritance is to OOP languages\
    \ and avoids re-writing code from one class to another. In the example, the replica\
    \ class definition is written as follows, to take advantage of the concept of\
    \ inheritance as it applies in Java.\n\n```\npublic class MyOtherClass extends\
    \ MyClass {\n    // the variable someValue is inherited and does not have to be\
    \ declared again\n}\n```\n\nThe keyword extends indicates that the class MyOtherClass\
    \ inherits the single member of the class MyClass so that it becomes a members\
    \ of MyOtherClass."
