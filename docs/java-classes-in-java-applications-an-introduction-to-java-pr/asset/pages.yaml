  md: "# Java: Classes in Java Applications Extending Classes by Means of Inheritance\n\
    \nThe use of the keyword extends in the simple example raises a question: what\
    \ is the purpose of replicating MyClass in the guise of MyOtherClass when we simply\
    \ use it as many times as we wish? The answer to this question lies in the fact\
    \ that inherited members can either be modified or left unchanged. This important\
    \ concept means that we can modify an inherited method if we wish and are free\
    \ to leave it (or other) inherited methods unchanged. We can also provide additional\
    \ methods in an extended class.\n\nThe next example enhances the one above to\
    \ illustrate the true value of extending a class.\n\n```\npublic class MyClass\
    \ {\n\n    private int someValue;\n\n    public void someMethod(String string\
    \ ) {\n        System.out.println(\"This is the parent class.\");\n    }\n\n}\n\
    ```\n\n```\npublic class MyOtherClass extends MyClass{\n\n    // MyOtherClass\
    \ inherits both members of MyClass.\n\n}\n```\n\nGiven that MyOtherClass inherits\
    \ both members of MyClass, consider the test class next.\n\n```\npublic class\
    \ TestClass {\n    public static void main(String[] args ) {\n        MyOtherClass\
    \ moc = new MyOtherClass();\n        System.out.println(\"The value of someValue\
    \ is: \" + moc.someValue);\n    }\n}\n```\n\nWhen an attempt is made to compile\
    \ the test class, the compiler outputs the following message:\n\n```\nsomeValue\
    \ has private access in MyClass\n```\n\nThe purpose of this simple example is\
    \ to show that although the private variable someValue is inherited by MyOtherClass,\
    \ it is a private variable and, as such, is not directly accessible by selecting\
    \ the member via a reference to the object MyOtherClass. The compiler highlights\
    \ the statement\n\n```\nSystem.out.println(\"The value of someValue is: \" + moc.someValue);\n\
    ```\n\nDownload free books at BookBoon.com\n\n46"
