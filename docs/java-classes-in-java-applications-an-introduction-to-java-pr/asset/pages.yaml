    # 6.3 Naming Convention


    Figures 12.1 and 12.2 show that the author (of this guide) has named the packages
    of the themed application with a single word that starts with a lower case letter.
    This simple convention works well unless independent developers use the same package
    and class names for applications that are in the public domain or are accessible
    by members of the Java development community.


    To overcome the potential problem of more than one application containing a class
    named mediaStore.Member – to take, as an example, one of the classes of the themed
    application – there is a convention in the Java developers'' community where organisation
    uses its Internet domain name in reverse to start package names. For example,
    the package named mediaStore shown in figures 12.1 and 12.2 should be named along
    the following lines:


    ```

    uk.ac.bc.tic.etheridge.mediaStoreMember

    ```


    so that the class Member is given the fully-qualified name of


    ```

    uk.ac.bc.tic.etheridge.mediaStoreStore.Member

    ```


    Up to this point in the chapter, we have largely considered packages provided
    by the developer of an application. The Java language itself is partitioned into
    a number of packages as suggested by the statements at the head of the class definition
    for the MediaStore class of the mediaStore package of as follows:


    ```

    package mediaStore;

    import java.io.*;

    ```


    The first statement denotes that the MediaStore class is a member of the mediaStore
    package. The second statement implies that the class requires access to all of
    the classes of the java.io package.


    The next section looks briefly at the use of package in the Java language.


    # 6.4 Packages in the Java Language


    The mane of the majority of the packages in the Java language begins with java
