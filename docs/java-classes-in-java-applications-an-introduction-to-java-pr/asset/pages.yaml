  md: "Java: Classes in Java Applications\n\nFlow Control\n\n# #2. Flow Control\n\n\
    # ##2.1 Introduction to Flow Control\n\nThe Java language provides a number of\
    \ constructs that enable the developer to control the sequence of execution of\
    \ Java statements. Chapter Two provides examples of how these constructs are used\
    \ to control the flow of execution through a block of code that is typically contained\
    \ in the body of a method.\n\n# ##2.2 Sequential Flow\n\nSequential flow of execution\
    \ of statements is the execution of Java source code in a statement-by-statement\
    \ sequence in the order in which they are written, with no conditions. Some of\
    \ the examples of methods that are discussed in previous chapters exhibit sequential\
    \ flow. In general terms, such a method is written as follows:\n\n```\n```\npublic\
    \ void someMethod() { \n    // first statement to execute\n    // second statement\
    \ to execute\n    // third statement to execute\n    // and so on, to the final\
    \ statement\n    // final statement to execute\n} // end of method definition\n\
    ```\n```\n\nA number of the main methods, presented in previous chapters, are\
    \ structured in this way in order to satisfy straightforward testing criteria.\n\
    \n# ##2.3 Conditional Flow\n\nWhile sequential flow is useful, it is likely to\
    \ be highly restrictive in terms of its logic. Executing statements conditionally\
    \ gives the developer a mechanism to control the flow of execution in order to\
    \ repeat the execution of one or more statements or change the normal, sequential\
    \ flow of control. Constructs for conditional flow control in Java are very similar\
    \ to those provided by other programming languages. Table 2.1 on the next page\
    \ identifies the flow control constructs provided by the Java language.\n\nDownload\
    \ free books at BookBoon.com\n\n19"
