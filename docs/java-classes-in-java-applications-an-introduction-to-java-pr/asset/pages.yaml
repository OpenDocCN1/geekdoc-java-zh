    The package named mediaStore contains eight classes, each of which begins with
    the package statement


    package mediaStore;


    The eight classes are bundled together in their own package because they represent
    the business logic of the application. None of these classes has any role in the
    display of the GUI; therefore there is no requirement to import the contents of
    the gui package into the package named mediaStore.


    While the two classes could have been placed in their own package, this version
    of the themed application is used to illustrate the contents of the default package
    of the application. Both test classes require access to classes in both packages,
    which means that the following import statements appear at the beginning of each
    source code file:


    ```

    import gui.*;

    import mediaStore;

    ```


    There is no package statement at the head of the source code file of the two test
    classes; this means these two classes are automatically placed in the default
    package of the application.


    The version of the themed application discussed above illustrates the principal
    reasons why classes and interfaces are bundle in a package; i.e. the types in
