  md: "# Java: Classes in Java Applications Flow Control\n\nThe logic of the switch\
    \ ... case construct is such that the integer is tested against each case\nor\
    \ from left to right. When this logic is translated in Java source code, the generalised\
    \ syntax is\nas follows.\n\n```\nint someIntegerValue;\nswitch (someIntegerValue)\
    \ { // start of switch block\n    case 1: // do something else; break;\n    case\
    \ 2: // do something else; break;\n    case 3: // do something else; break;\n\
    \    case 5: // do something else; break;\n}\n// first statement after the switch\
    \ block\n```\n\nThe break statement after each case statement is necessary to\
    \ exit the enclosing switch block when the\ncondition has been satisfied. When\
    \ a break statement is executed, control passes out of the\nenclosing switch to\
    \ the first statement after the end of the switch block. On the face of it, it\
    \ would\nseem logical to omit the final break statement. However, it is advisable\
    \ to include it in case additional\ncase statements are added to an existing switch\
    \ block.\n\nIn the days before the ubiquitous use of icon-driven applications,\
    \ old-fashioned text-based interfaces\for green screen of applications were menu-driven.\
    \ Case statements were typically used to\nconstruct this kind of interface. While\
    \ it is generally true that menu-driven applications have largely\ndisappeared,\
    \ case statements are useful for testing the conditional flow through application\
    \ logic.\n\nThe following example illustrates a switch ... case construct with\
    \ a value entered via the\nkeyboard. (It isn't necessary to show the code used\
    \ to capture a number via the keyboard for the\npurposes of the example.)\n\n\
    ```\n// a number entered via the keyboard is stored in a variable with the identifier\
    \ month\nint days;\nswitch (month) {\n    case 9:\n    case 4:\n    case 6:\n\
    \    case 11: days = 30; break;\n    case 2: days = 28; break;\n    default: days\
    \ = 31; break;\n}\nSystem.out.println(\"The number of days is: \" + days);\n```\n\
    \nWhen this code is run in a main method, the output is as follows:\n\n+   Enter\
    \ the number of the month: 1\nThe number of days is: 31\n\nDownload free books\
    \ from BookBoon.com\n\n32"
