    # #1. Using the Java Application Programming Interface


    Chapter One takes examples from the Java Application Programming Interface (API)
    and the themed application in order to emphasise the critical importance of documentation.
    The examples are used to show how documentation is organised in the API and how
    it is inserted into developer''s code.


    # ##1.1 Documentation in Developer-Written Java Classes


    Previous chapters include a number of examples (or partial classes) from the themed
    application, the main purpose of which is to illustrate programming concepts.
    It should not have escaped the notice of the reader that these examples often
    include material other than Java statements, usually in a non-bold font. The inclusion
    of such material raises a question: *what is the purpose of documentation is a
    class definition?


    Perhaps one way to address this question is to consider figures 1.1 and 1.2 below.


    ![](img/8e21bca3c5638080efd3c1b81bc23762_6_0.png)


    Source: http://www.cvr-it.com/PM_Jokes.htm


