    code with additional statements such as; else constructs and other statements
    to test the value of fields in order to detect when an error might occur. The
    exceptions that a method might produce are explicitly included as part of the
    method''s declaration. This means that exceptions are as important as part of
    a method''s programming interface as its return type and parameters. The inclusion
    of exceptions in the declaration of a method means they are made known to the
    code that invokes the method, and as a result, the compiler knows about them.
    The type of exception that is checked by the compiler is known as a checked exception.


    When an error occurs when a method is invoked, the exception object is passed
    to the run-time system; this process is known as throwing an exception. The run-time
    system tries to find some code in the calling method that is designed to respond
    and handle the exception. If this handling code is not found in the calling method,
    the run-time system works its way through the set of methods that has been called
    to call the method that throws the exception until it finds some handler. This
    set of methods is known as the call stack. If handling code has not been provided
    by the developer, the run-time system eventually arrives at the end of the method
    invocation stack to the thread that runs the application''s main method. If main
    does not handle the exception, main''s thread of execution will terminate abnormally.
    In other words, the application will crash when main terminates in an abnormal
    way. We will examine these in Chapter Four in An Introduction to Java Programming
    3: Graphical User Interfaces.


    On the other hand, if handling code has been provided by the developer somewhere
    in the stack, the exception is said to be caught by the code that is the handler.


    It will be instructive, at this point in the discussion of exceptions, for the
    learner to study an example that illustrates how checked exceptions are thrown
    and caught.


    # 4.3.1 How is a Checked Exception Handled in a Java Programme?


    The example shows how an exception is thrown and caught in order to illustrate
    the key concepts associated with exception handling in a Java programme.


    The code for a simple exception class follows on the next page.'
