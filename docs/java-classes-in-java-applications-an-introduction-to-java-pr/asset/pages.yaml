    be either caught or declared to be thrown by methods in the call stack and that
    main is the final opportunity to catch them.


    > As a general rule, it is good practice to catch an exception when the method
    that throws it is called.


    The example code and output explained in this section shows that the run-time
    system searches the call stack in the reverse order in which methods are called
    until it finds a catch block that is designed to respond to the exception thrown
    by a method. When a catch block is found, the exception is handed to the run-time
    system. If the exception is caught before it reaches main or if main catches it,
    the programme will not terminate abnormally; if main does not handle it but declares
    that it is thrown, main will crash.


