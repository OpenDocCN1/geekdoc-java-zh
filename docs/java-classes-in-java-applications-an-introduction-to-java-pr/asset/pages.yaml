    # 3.8 Summary of Inheritance


    Although it is not made explicit at the beginning of this chapter, the examples
    used aim to illustrate two forms of inheritance. Rather than mentioning them both
    at the outset, it is to hope that both forms emerge from the explanations and
    code examples used in the chapter.


    The previous sections aim to show how a class can be extended or subclassed and
    how a subclass can be used in code designed to work with super. For example, FullTimeStudent
    objects used by code designed to work with Student objects. If a method expects
    a parameter of the type Student, you can pass it a FullTimeStudent object and
    it will work, although you likely have to find out the type argument by using
    the instanceof operator and restore the full functionality of the object by a
    suitable cast, as shown in Section 3.5. This feature of inheritance is known as
    polymorphism. An object that is declared to be of the Student type can have many
    forms in that it can be used as a Student object, a FullTimeStudent object, or
    a PartTimeStudent object.


    The behaviour of a Student object is inherited by a FullTimeStudent object; the
    latter is to extend the former. Extended behaviour can be entirely new — means
    of adding methods to the subclass — or it modify inherited behaviour by overriding
    a method with the same signature and return type as the overridden method. An
    extended class can override the behaviour of its super by providing new implementations
    of one or more of the inherited methods.


