  md: "# Java: Classes in Java Applications\n\n# 2.4.1 The if ... then Construct\n\
    \nThe if ... then construct is the most basic of the decision-making constructs\
    \ provided by the Java language. If a condition is true, the block of code is\
    \ executed; otherwise, control skips to the first statement after the if block.\
    \ The following code snippet illustrates a simple use of the if ... then construct.\n\
    \n```\n// assume that the value of age has been entered via the keyboard\nif (\
    \ age >= 18 ) // if the condition is placed between ( )\n{ // start of if block\n\
    \    System.out.println(\"You can drink legally.\"); // if the then clause\n}\
    \ // end of if block\n// execute the next statement\nSystem.out.println(\"The\
    \ rest of the programme is next.\");\n```\n\nWhen the code snippet run (in a main\
    \ method), the output when age = 20 is:\n\nYou can drink legally.\nThe rest of\
    \ the programme is next.\n\nand when age = 17, the output is:\n\nThe rest of the\
    \ programme is next.\n\nIn some programming languages, the word 'then' is included\
    \ in the then clause. As the code snippet shows above, this is not the case in\
    \ Java.\n\nAn example taken from the themed application if an ... then construct\
    \ in action in one of the methods of the Member class. The method adds a member\
    \ to an array of members only if there is room in the array of (arbitrary) size\
    \ 6.\n\n```\n/**\n * This method adds a member if there is room in the array of\
    \ members called members.\n * @param fName The member's first name.\n * @param\
