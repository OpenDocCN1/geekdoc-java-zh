    Overall, extending classes give rise to two forms of inheritance:


    +   1. inheritance of type, where the subclass acquires the type of the superclass
    so that it can be used polymorphically in code designed to work with the superclass
    type;

    2. inheritance of implementation, where the subclass acquires the implementation
    of the superclass in terms of its members.


    Inheritance is a fundamental concept in OOP languages; as a consequence, further
