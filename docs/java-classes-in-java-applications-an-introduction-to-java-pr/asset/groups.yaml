    \ | Yes | Yes |\n\nThe first row confirms that the class itself has access to\
    \ private. The second row indicates that if no modifier is specified, classes\
    \ in the same package have access. The third column indicates that subclasses\
    \ have access to protected. The fourth row shows that all classes have access\
    \ to public members, regardless of what they are.\n\nWhilst on the face of it,\
    \ the access level as protected might be regarded as implying a high degree of\
    \ 'protection' from other classes, the table and example code shows that this\
    \ is not the case. The class MySubClass shows that all subclasses of MySuperClass\
    \ have access to protected members of MySuperClass. Thus we can see that the protected\
    \ access level is not as protected as private. Nevertheless, it may be the case\
    \ that the developer wishes to make a number of members of a superclass protected\
    \ in order to provide easy access to them from subclasses.\n\n## Example One\n\
