    \ 类型对象可以有许多形式，因为它可以被当作 `Student` 对象、`FullTimeStudent` 对象或 `PartTimeStudent` 对象使用。\n\
    \n`Student` 对象的行为被 `FullTimeStudent` 对象继承；后者扩展前者。扩展的行为可以是完全全新的——即为子类添加方法——也可以通过重写与被覆盖方法相同签名和返回类型的方法来修改继承的行为。扩展类可以通过对一个或多个继承的方法提供新的实现来重写其父类的行为。\n\
    \n![](img/8e21bca3c5638080efd3c1b81bc23762_67_0.png)\n\n请点击广告\n\n68\n\n在 BookBoon.com\
