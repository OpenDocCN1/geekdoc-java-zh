  mdcn: "\n\nJava：Java应用程序中的类\n\n流程控制\n\n## 2. 流程控制\n\n### 2.1 流程控制简介\n\nJava 语言提供了许多结构，允许开发者控制\
    \ Java 语句的执行顺序。第二章通过示例说明如何使用这些结构来控制代码块的执行流，这些代码块通常包含在方法体内。\n\n### 2.2 顺序流\n\n\
    语句执行的顺序流是指按照编写的顺序逐条执行 Java 源代码，且没有任何条件。在之前的章节中讨论的一些方法示例展示了顺序流。通俗来说，这种方法的写法如下：\n\
    \n```java\npublic void someMethod() { \n    // 第一个执行的语句\n    // 第二个执行的语句\n   \
    \ // 第三个执行的语句\n    // 以此类推，直到最后一条\n    // 最后一条执行的语句\n} // 方法定义结束\n```\n\n之前章节介绍的许多主要方法都采用这种结构，以满足简单的测试标准。\n\
    \n### 2.3 条件流\n\n虽然顺序流很有用，但在逻辑上可能会有很大的限制。根据条件执行语句，为开发者提供了一种控制执行流的机制，以便重复执行一个或多个语句，或者改变正常的顺序控制流。Java\
    \ 中的条件流程控制结构与其他编程语言提供的结构非常相似。下一页的表 2.1 列出了 Java 语言提供的流程控制结构。\n\n**表 2.1 流程控制结构**\n\
    \n| 语句类型 | 关键字 |\n| --- | --- |\n| 决策 | if ... then |\n| 决策 | if ... else |\n\
    | 决策 | switch ... case |\n| 循环 | for |\n| 循环 | while |\n| 循环 | do ... while |\n\
    | 分支 | break: 带标签和无标签的形式 |\n| 分支 | continue: 带标签和无标签的形式 |\n\n异常处理（见第四章）\n\n后续章节将通过示例说明如何使用这些结构。\n\
    \n## 2.4 决策\n\n使用决策结构允许开发者在条件为真时*仅（only）执行代码块。后续章节将阐明如何使用决策结构。\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_19_0.png)\n\
    \n敏锐的头脑 - 绝妙的创意！\n\nFOSS Analytical A/S 的员工是公司价值观——“优先”使用新发明为我们的客户提供专用解决方案的证明。凭借敏锐的头脑和跨职能合作，我们不断开发新的独特产品\
    \ - 您想加入我们吗？\n\nFOSS 的不同在于以创新和发展作为我们增长的基础。这体现在有 200 多名员工在斯堪的纳维亚和美国的 FOSS 从事研发工作。FOSS\
    \ 的工程师工作在生产、开发和营销领域，涵盖广泛领域，即电子、软件、光学、微生物学、化学。\n\n我们提供\n在一家领先的国际创新型公司提供一份具有挑战性的工作。您将有机会与高技能的同事一起使用最先进的技术。\n\
