    \ and innovative company that is leading in its field. You will get the opportunity\
    \ to work with the most advanced technology with highly skilled colleagues.\n\n\
    Read more about FOSS at www.foss.dk - or go directly to our student site www.foss.dk/sharpminds\
    \ where you can learn more about your possibilities of working with us on projects,\
    \ your thesis etc.\n\nThe family owned FOSS group is the world leader as supplier\
    \ of dedicated, high-tech analytical solutions and production of agricultural,\
    \ food-marketed and chemical products. We are based in Denmark, Sweden and USA\
    \ with headquarters in Hillerød and are marked globally by 23 sales - the converse\
    \ is to be the first; company to expand its market position.\n\n# Dedicated Analytical\
    \ Solutions\n\nFOSS\nSlangerupvej 69\n3400 Hillerød\nTel. +45 7013370\nwww.foss.dk\n\
    \n![](img/8e21bca3c5638080efd3c1b81bc23762_57_0.png)\n\nDownload free books from\
    \ BookBoon.com\n\n## Java: Classes in Java Applications\n### Extending Classes\
    \ by Means of Inheritance\n\nThe class definition of Tutor is next.\n\n```java\n\
    public class Tutor extends Employee {\n\n    // Declare instance variables.\n\
    \    private String tutorsName;\n    // An array to store references to students.\n\
    \    private Student [] studentsInJavaGroup;\n\n    /**\n     * Constructor for\
    \ objects of class Tutor.\n     * @param department The tutor's department.\n\
    \     */\n    public Tutor(String department) {\n        // Call the constructor\
    \ of the superclass.\n        super(department);\n    }\n\n    /**\n     * Abstract\
    \ method inherited from Employee; must be overridden.\n     */\n    public String\
    \ getDepartment() {\n        return department;\n    }\n} // End of class definition.\n\
    ```\n\nIt should be noted that an abstract class may declare abstract methods.\
    \ For example, the abstract class Employee declares an abstract method getDepartment\
    \ that must be overridden in subclasses of Employee.\n\nThe aim of the example\
    \ shown in Figure 3.3 is to illustrate some of the following rules concerning\
    \ abstract classes:\n\n| the compiler prevents an abstract class from being directly\
    \ instantiated, though it usually has constructors that are called from the constructor\
    \ of its subclasses; |\n| :--- |\n| an abstract class may have abstract methods:\
    \ |\n| such methods contain no implementation; |\n| non-abstract subclasses must\
    \ override these methods and implement them; |\n| if all methods are abstract,\
    \ the class should be an interface; (we will find out what a Java interface is\
    \ in Chapter Five); |\n| any class with one or more abstract methods is called\
    \ an abstract class; |\n| abstract classes can have data attributes, concrete\
    \ methods and constructors. |\n\nDownload free books at BookBoon.com\n\n## Java:\
    \ Classes in Java Applications\n### Extending Classes by Means of Inheritance\n\
    \nAt this point, it is useful to note that there is another category of class\
    \ known as a final class. A final class cannot be subclassed and a final method\
    \ cannot be overridden.\n\n## 3.5 What Does Type Compatibility Mean?\n\nNow that\
    \ we have explored some of the essential concepts associated with inheritance,\
    \ we can address the deferred discussion about conversion of type variables from\
    \ Chapter Three (An Introduction to Java Programming 3: The Fundamentals of Objects\
    \ and Classes).\n\n> Java is a strongly-typed language. This means that the compiler\
    \ checks for type compatibility at compile time, preventing incompatible assignments.\n\
    \nChecking for type compatibility is carried out when an expression is assigned\
    \ to a type variable as:\n\n```SomeClass sc = < expression that returns an object\
    \ reference >;\n```\n\nThe compiler will regard the types as compatible when one\
    \ of three conditions apply to the expression:\n\n- 1. the expression returns\
    \ an object reference of the SomeClass type;\n- 2. the expression returns an object\
    \ reference to a subclass of SomeClass;\n- 3. the expression returns an object\
    \ reference to an object that implements the SomeClass interface. (Java interfaces\
    \ explored in Chapter Five.)\n\nWe can use the class hierarchy shown in Figure\
    \ 3.3 to illustrate the first two conditions.\n\nConsider the following statement:\n\
    \n```java\nStudent s1 = new Student(111, \"Java\");\n```\n\nThis statement compiles\
    \ because it complies with the first condition.\n\nConsider the next statement:\n\
    \n```java\nStudent s2 = new PartTimeStudent(222, \"Java\");\n```\n\nThis statement\
    \ compiles because it complies with the second condition.\n\nIt is worthwhile\
    \ dwelling on the general nature of the second condition:\n\n```java\nSuperClass\
    \ sc = new SubClass();\n```\n\nDownload free books at BookBoon.com\n"
  mdcn: "\n\n## Java: Java 应用中的类\n### 通过继承扩展类\n\n与父类中的类方法（即静态方法）具有相同签名的类方法被称为“隐藏”了该方法。对于类方法，运行时系统调用调用该方法的引用的编译时类型中定义的方法；对于实例方法，则调用调用该方法的引用的运行时类型。通过在\
    \ `Student` 类定义中提供以下方法说明了这一点。\n\n```\npublic static String getDetails() {\n  \
    \  return \"I am a student\";\n}\n```\n\n当接下所示的 `main` 方法为：\n\n```java\npublic\
    \ class TestStudents {\n\n    public static void main(String[] args ) {\n    \
    \    // 创建一个 Student 对象。变量 s 是 Student 类型，但它指向\n        // 一个 FullTimeStudent\
    \ 对象（在运行时）。\n        Student s = new FullTimeStudent(1234, \"Java\");\n      \
    \  // 调用 Student 的静态方法。\n        System.out.println(s.getDetails());\n       \
    \ // 调用 FullTimeStudent 的实例方法。\n        System.out.println(s.getDegreeCourseCode());\n\
    \    }\n}\n```\n\n输出结果为：\n\nI am a student.\nFull-time student is enrolled on:\
    \ course code Java\n\n这说明了在编译时类型和运行时类型上调用方法之间的区别。在此处，关于类方法还有一条规则需要说明：实例方法不能重写静态方法，静态方法不能隐藏实例方法。\n\
    \n## 3.3 从子类构造函数调用父类构造函数\n\n在之前的几节中的许多示例展示了如何使用 `super` 关键字调用被重写的方法。`super` 关键字也用于从子类的构造函数调用父类构造函数。事实上，对\
    \ `super(< 参数列表>)` 的调用必须是子类构造函数的第一条语句，如上述 `PartTimeStudent` 和 `FullTimeStudent`\
    \ 构造函数所示。\n\n## Java: Java 应用中的类\n### 通过继承扩展类\n\n关于 `super( < 参数列表 >)` 的调用有若干规则：\n\
    \n- 必须初始化子类的所有字段；因此必须调用其构造函数；\n- 根据传递给 `super` 调参数来调用特定的构造函数；这通过 `FullTimeStudent`\
    \ 构造函数的第一条语句说明了这一点；\n- 如果子类构造函数中没有对 `super` 的调用，编译器会添加一个隐式的 `super()` 调用，以调用父类的无参数构造函数（可能是其默认构造函数）；\n\
    - 如果父类定义了构造函数但没有提供无参数构造函数，当从子类中调用 `super()` 时，编译器会发出错误信息。\n\n基于这些规则，在子类构造函数的第一条语句中调用正确的\
    \ `super` 构造函数时应小心。\n\n## 3.4 final 和 abstract（抽象）类\n\n图 3.3 图 3.2 所示的简单类层次结构的增强版本。\n\
    \n![](img/8e21bca3c5638080efd3c1b81bc23762_56_0.png)\n\n**图 3.3** 增强版本的简单类层次结构\n\
    \n## Java: Java 应用中的类\n### 通过继承扩展类\n\n`Employee` 类被（IDE）标记为 **abstract（抽象）**。为了这个简单示例的目的，`Employee`\
    \ 类被定义为 **abstract** 的，因为我们不想实例化 **Employee 类** 的对象。相反，我们希望实例化 *Tutor*（导师）类的对象，换句话说，我们希望为应用程序填充具体的员工，而不是使用抽象且通用的员工概念。**Employee**\
    \ 的类定义如下所示。\n\n```java\npublic abstract class Employee {\n\n    // 声明实例变量。\n \
    \   String department;\n\n    /**\n     * 此构造函数使用标识符 department 初始化变量。\n     *\
    \ @param department 员工的部门。\n     */\n    public Employee(String department) {\n\
    \        this.department = department;\n    }\n\n    // 所有继承自 Employee 的子类都必须实现此抽象方法。\n\
    \    // 注意它是如何声明的。\n    public abstract String getDepartment();\n}\n\n// 类定义结束。\n\
    ```\n\n# 敏锐头脑 - 绝妙创意！\n\nFOSS A/S 的员工是公司价值观的活证明——客户至上——使用新发明为我们的客户提供专门的解决方案。凭借敏锐的头脑和高效的团队合作，我们不断努力开发独特的产品——你想加入我们的团队吗？\n\
