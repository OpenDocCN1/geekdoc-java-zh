    Tel. +45 7013370\nwww.foss.dk\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_57_0.png)\n\
    \n从 BookBoon.com 免费下载书籍\n\n## Java: Java 应用中的类\n### 通过继承扩展类\n\n`Tutor` 的类定义如下。\n\
    \n```java\npublic class Tutor extends Employee {\n\n    // 声明实例变量。\n    private\
    \ String tutorsName;\n    // 用于存储学生引用的数组。\n    private Student [] studentsInJavaGroup;\n\
    \n    /**\n     * Tutor 类对象的构造函数。\n     * @param department 导师的部门。\n     */\n\
