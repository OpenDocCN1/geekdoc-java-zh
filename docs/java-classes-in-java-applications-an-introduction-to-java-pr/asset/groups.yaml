    \        }\n    } // end of for loop\n} // end of while loop\nbreak; // out of\
    \ the while loop\n// if there is no match, output a suitable message\nif (flag\
    \ == true) {\n    // output \"No such member; please again.\"\n}\n```\n\n## 2.6\
    \ Deciding Which Construct to Use\n\nDeciding which construct to use in any particular\
    \ situation is a matter of judgement that will become easier to make when the\
    \ learner gains practical experience. For example, the method implementation explained\
    \ at the end of the previous sub-section is a direct consequence of the logic\
    \ required to find a member in the array of members and break out of the loop\
    \ to avoid unnecessary iterations of the main loop. As seen from the code, the\
    \ full implementation of the method is a combination of nested, while and for\
    \ constructs.\n\nBefore completing our examination of the contents of Table 2.1,\
    \ it is worthwhile mentioning another ‘loop within a nested construct’.\n\n###\
    \ 2.6.1 Nested for loops\n\nOne of my university colleagues sets a fiendish exercise\
    \ to students enrolled on his Java course. The main task of the exercise is to\
    \ print a calendar. On the face of it this may seem a straightforward exercise,\
    \ it actually involves a loop within loops, generally referred to as nested for\
    \ loops. A highly generalised skeleton to this exercise might read follows\n\n\
    ```\nfor (int months = 1; months < 13; months++) { // the month loop\n    for\
    \ (int weeks = 1; weeks < 5; weeks++) { // the week loop\n        for (int days\
    \ = 1; days < 32; days++) {\n            // output the date and day in a calendar\
    \ format\n        }\n    }\n} // end of outer for loop\n```\n\nThe example above\
    \ suggests that nested for loops can be used to construct tables or dimensional\
    \ arrays of data. The inner loop is used to output each entry in a row and the\
    \ outer loop is used to move to the next column. The next snippet outputs the\
    \ value of each cell of a table or array.\n\n```\nfor (int i = 1; i < numberOfColumns;\
    \ i++) {\n    for (int j = 1; j <= cellValue; j++) {\n        // output the known\
    \ value of the cell at coordinates j, i, the jth row of\n        // ith column\n\
    \    }\n} // end of inner for loop\n} // end of outer for loop\n```\n\nThe next\
    \ section almost completes our examination of Table 2.1 by considering branching\
    \ statements.\n\n## 2.7 Branching Statements\n\nBranching statements are used\
    \ to terminate a loop or a decision construct or to skip an iteration of a loop.\n\
    \n### 2.7.1 The Unlabelled break Statement\n\nA number of the examples discussed\
    \ in this chapter include break statements to expedite the immediate exit from\
    \ a flow construct. The break statement is used to terminate switch, for and while\
    \ constructs. For example, when the following method is invoked\n\n```java\npublic\
    \ void someMethod() {\n    for (int i = 0; i < 11; i++) {\n        System.out.print(i\
    \ + \", \");\n        if (i == 5)\n            break; // out of the for loop using\
    \ unlabelled break\n        // statement\n        System.out.println(\"loop terminated.\"\
    );\n    }\n}\n```\n\n// End of someMethod.\n\nthe output is:\n\n0, 1, 2, 3, 4,\
    \ 5, loop terminated.\n\nThe output shows that the break statement causes the\
    \ enclosing for loop to terminate and pass control to the first statement after\
    \ the loop.\n\n### 2.7.2 The Unlabelled continue Statement\n\nWe have not encountered\
    \ the continue statement thus far in this guide. The continue statement is used\
