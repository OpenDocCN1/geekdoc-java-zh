    \ getDetails as follows student.getDetails(); invokes the getDetails method in\
    \ the Student class.\n\n## 3.7 Controlling Access to the Members of a Class\n\n\
    Access modifiers are used to determine whether classes have access to a member.\
    \ Up to this point in the guide, we have met the access modifiers public, private\
