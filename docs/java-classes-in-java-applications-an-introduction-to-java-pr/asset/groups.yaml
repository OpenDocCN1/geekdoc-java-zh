  mdcn: "\n\n## 6. 在 Java应用程序中将类分组\n\n第十二章解释了如何将类和接口分组，这使用了一个与通用命名空间（namespace）不同的概念。将许多相关的类收集在一个名为包（package）的单一结构中，可以使它们更容易管理，并避免潜在的命名冲突。\n\
    \n## 6.1 Java 包简介\n\n为了为了说明命名空间管理，假设一个银行应用程序有两个名为 `Account` 的类：其中一个类是活期账户类的定义，另一个是储蓄账户类的定义。只要这两个类被放在不同的包中，它们的类名就可以相同（都是\
    \ `Account`）。这是因为每个包都会创建一个新的命名空间，一个包中的类型不会另一个包中的类型产生冲突。\n\n一个简单的类比可能有助于读者理解管理类名及其命名空间的必要性。在\
    \ Java应用程序中使用包，就比像自由敦（Freetown）主街的商业地址与弗里斯赛尔（Freestyle）主街的类似地址之间显而易见的区别。\n\nTop\
    \ Ten Records, Main Street, Freetown 和 Top Ten Records, Main Street, Freestyle。\n\
    \n每个 Top Records 商店的地址对所有相关人员都有显而易见的益处。\n\n将名为 `Account` 的类放在不同的包中的结果是，它们唯一的完全限定名写法如下：\n\
    \n```java\n// 指向名为 currentAccount 的包中的 Account 类\n```\n\n以及\n\n```java\nsavingsAccount.Account\
    \ // 指向名为 savingsAccount 的包中的 Account 类\n```\n\n用于类的完全限定名的表示法意味着，它可以被无歧义地引用，并通过常用的\
    \ `.`（点）选择器进行访问。\n\n## 6.2 创建包\n\n下方图 6.1 所示的主题应用程序版本表明，应用程序的类根据它们在应用程序中的功能，被封装在两个包中的一个。\n\
    \n![](img/8e21bca3c5638080efd3c1b81bc23762_107_0.png)\n\n图 6.1 主题应用程序的包结构\n\n\
    两个名为 `TestGui` 和 `TestReferences` 的测试类（即包含 main 方法的类）不在命名包中，被认为在应用程序的默认包（default\
    \ package）中。\n\n名为 `gui` 的包包含一个类 `MediaStoreGui`。以下语句\n\n```java\npackage gui;\
    \               // MediaStoreGui 类在此包中\nimport MediaStore.*;    // 该类可以访问应用程序中另一个包包含的\n\
    \                             // 类\n```\n\n写在类声明之前，并声明名为 `MediaStoreGui` 的类在名为\
    \ `gui` 的包中，并且它需要访问 `MediaStore` 包中的所有类，这归功于 `import` 语句中 `.` 语句右侧编写的通配符 `***`。\n\
    \n这个版本的主题应用程序只有一个显示应用程序图形界面（GUI）的类。尽管如此，将此类放在它自己的包中仍然是有意义的：应用程序的其他版本可能包含与 GUI\
    \ 显示相关的额外类，这些类将被放在名为 `gui` 的包中。\n\n之所以需要 `import` 语句是因为 GUI 的组件需要访问 `MediaStore`\
    \ 包中的类，以调用它们的方法并运行应用程序。\n\n名为 `mediaStore` 的包包含八个类，每个类都以包语句开头\n\n```java\npackage\
    \ mediaStore;\n```\n\n这八个类被封装在自己的包中，是因为它们代表了应用程序的业务逻辑。这些类中没有一个类在 GUI 显示中起任何作用；因此，没有要求将\
    \ `gui` 包的内容导入到名为 `mediaStore` 的包中。\n\n虽然这两个类可以放在自己的包中，但这个版本的主题应用程序被用于说明应用程序默认包的内容。两个测试类都需要访问两个包中的类，这意味着每个源文件文件的开头都出现了以下\
    \ `import` 语句：\n\n```java\nimport gui.*;\nimport mediaStore.*;\n```\n\n这两个测试类的源文件头部没有\
    \ `package` 语句；这意味着这两个类被自动放置在应用程序的默认包中。\n\n上述讨论的主题应用程序版本说明了类和接口被封装在包中的主要原因：即在应用程序的上下文中，包中的类型在功能上是相关的。许多其他原因也源于此；它们被总结在下一页显示的框中。\n\
