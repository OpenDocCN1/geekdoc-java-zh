    # Java: Classes in Java Applications


    # Grouping Classes Together in a Java Application


    | Modifier | Same Class | Same Package | Subclass | Universe |

    | --- | --- | --- | --- | --- |

    | private | Yes | | | |

    | default: specifier | Yes | Yes | | |

    | protected | Yes | Yes | Yes | |

    | public | Yes | Yes | Yes | Yes |


    Table 6.1 Access levels to class members


    The first row of Table 6.1 reaffirms what we know about the access modifier ''private'':
    i.e. the class has access to its private members as we would expect.


    The second row can be regarded as a class''s package contract whereby if no modifier
    is specified in the same package have access to such members and one another to
    access each other''s members. A class''s package contract can be used to hide
    things as implementation details that are not required to be known to classes
    outside the package. This type of contract means that such details can be changed
    without changing a class''s public contract.


    A class public declares it that it is available to developers using its containing
    package. The fourth row shows that all classes have access to public members,
    regardless of their package and parenting. We will return to the third row in
    due course.


    As we work our way down the ''Modifier'' column from ''private'', ''default''
    (i.e. package level), ''protected'' and ''public'', each of the four access levels
    embraces a wider scope of kind that the class can access that member.


    Let us return to the third row of the table that was first displayed in Chapter
    Nine: the protected contract. The third row indicates level of access is provided
    when a class member is declared to be ''protected''. The first column indicates
    that other members of the class itself have access to the protected member of
    that class; the second column indicates that classes in the same package, regardless
    of their parenting, have access to the protected member; the third column indicates
    that subclasses of the class have access to the protected member, regardless of
    what package they are in. However, the subclass-protected entry requires further
    comment.


    The subclass-protected entry in the table can be stated more precisely: a protected
    member can be accessed from a class via object references that are of the same
    type as the class or one of its subtypes. Despite the apparent clarity of this
    statement, it gives rise to an interesting twist as the following example aims
    to illustrate.


