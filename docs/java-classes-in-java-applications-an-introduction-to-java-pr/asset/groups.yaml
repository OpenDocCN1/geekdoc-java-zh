- md: "\n# Java: Classes in Java Applications\n\nExceptions are reasonably recoverable\
    \ at run-time and that are not the result of logic errors are not unchecked exceptions;\
    \ this type of exception is incorporated into the implementation of methods that\
    \ give rise to them, and also in the next section.\n\n## 4.3 Checked Exceptions\n\
    \nExceptions provide a straightforward mechanism to check for errors without cluttering\
    \ code with additional statements such as else constructs and other statements\
    \ to test the value of fields in order to detect when an error might occur. The\
    \ exceptions that a method might produce are explicitly included as part of the\
    \ method's declaration. This means that exceptions are as important as part of\
    \ a method's programming interface as its return type and parameters. The inclusion\
    \ of exceptions in the declaration of a method means they are made known to the\
    \ code that invokes the method, and as a result, the compiler knows about them.\
    \ The type of exception that is checked by the compiler is known as a checked\
    \ exception.\n\nWhen an error occurs when a method is invoked, the exception object\
    \ is passed to the run-time system; this process is known as throwing an exception.\
    \ The run-time system tries to find some code in the calling method that is designed\
    \ to respond and handle the exception. If this handling code is not found in the\
    \ calling method, the run-time system works its way through the set of methods\
    \ that has been called to call the method that throws the exception until it finds\
    \ some handler. This set of methods is known as the call stack. If handling code\
    \ has not been provided by the developer, the run-time system eventually arrives\
    \ at the end of the method invocation stack to the thread that runs the application's\
    \ main method. If main does not handle the exception, main's thread of execution\
    \ will terminate abnormally. In other words, the application will crash when main\
    \ terminates in an abnormal way. We will examine these in Chapter Four in An Introduction\
    \ to Java Programming 3: Graphical User Interfaces.\n\nOn the other hand, if handling\
    \ code has been provided by the developer somewhere in the stack, the exception\
    \ is said to be caught by the code that is the handler.\n\nIt will be instructive,\
    \ at this point in the discussion of exceptions, for the learner to study an example\
    \ that illustrates how checked exceptions are thrown and caught.\n\n## 4.3.1 How\
    \ is a Checked Exception Handled in a Java Programme?\n\nThe example shows how\
    \ an exception is thrown and caught in order to illustrate the key concepts associated\
    \ with exception handling in a Java programme.\n\nThe code for a simple exception\
    \ class follows on the next page.\n\n# Java: Classes in Java Applications\n\n\
    ```\npublic class MyException extends Exception {\n    // constructor\n    public\
    \ MyException() {\n        super(\"You are attempting to divide by zero.\");\n\
    \n    } // end of class definition\n```\n\nThe constructor for MyException passes\
    \ a String to the superclass Exception; this String is used to construct an error\
    \ message.\n\nStrictly speaking, an attempt to divide a number by zero throws\
    \ an instance of ArithmeticException, which is of type RuntimeException: it is\
    \ an unchecked exception. However making MyException checked by inheriting directly\
    \ from Exception, means that the example can be used to illustrate how a checked\
    \ exception is thrown and caught.\n\nThe class MyObject includes a method that\
    \ declares it throws MyException objects: note the use of the keyword 'throws'\
    \ in the declaration of quotient. The class definition is next.\n\n```java\npublic\
    \ class MyObject {\n    public double quotient(int num, int den) throws MyException\
    \ {\n        if(den == 0) {\n            System.out.println(\"quotient has exited\
    \ and thrown an \" + \"instance of MyException.\");\n            throw new MyException();\n\
    \        } else {\n            System.out.println(\"quotient has completed.\"\
    );\n            return ( double ) num / den;\n        }\n    } // end of quotient\n\
    \n    public void myWeb(int num, int den) {\n        try {\n            double\
    \ answer = quotient(num, den);\n            System.out.println(\"The value of\
    \ num / den = \" + answer);\n        } catch (MyException me) {\n            me.printTrace();\n\
    \        }\n        System.out.println(\"myMethod has completed.\");\n    } //\
    \ end of method\n} // end of class definition\n```\n\nThe method quotient includes\
    \ an if .. else construct that determines the condition when an instance of MyException\
    \ is thrown. If the denominator (den) is not zero, the method returns the double\
    \ value of the numerator (num) divided by the denominator (den).\n\nThe method\
    \ myMethod invokes the method quotient and checks for the exception using what\
    \ is known as a try ... catch construct. The try block includes the call to quotient.\
    \ If den is not equal to zero, the statements of the try block execute and the\
    \ catch block is skipped and the message \"myMethod has completed.\" is output.\n\
    \nIf den is equal to zero when quotient is called by myMethod, the method quotient\
    \ will start its execution and the remaining statements in the try block are skipped\
    \ and the catch block is executed. The statement in the catch block calls an inherited\
    \ method of MyException in order to output useful information about the error\
    \ condition. In short, the exception is caught in myMethod when it is thrown by\
    \ the call to quotient. The print statements in both methods in MyObject serve\
    \ to show where processing has reached when an exception is thrown.\n\nIn order\
    \ to illustrate what happens when myMethod is called, a test class is required.\
    \ The code for the test class follows on the next page.\n\n# Java: Classes in\
    \ Java Applications\n\n# Errors in Java Programmes\n\n```java\npublic class TestClassOne\
    \ {\n    public static void main ( String[ ] args ) {\n        // use EasyInput\
    \ to input two int values; -99 escapes the loop\n        int den = 0;\n      \
    \  EasyInput keyboard = new EasyInput();\n        while (den != -99) {\n     \
    \       System.out.print(\"Enter first number: \");\n            int num = keyboard.nextInt();\n\
    \            System.out.print(\"Enter second number: \");\n            den = keyboard.nextInt();\n\
    \            if (den == -99) {\n                break;\n            }\n      \
    \      MyObject mo = new MyObject();\n            mo.myMethod(num, den);\n   \
    \         System.out.println(\"main is still running.\");\n        }\n       \
    \ System.out.println(\"main has terminated.\");\n    }\n}\n```\n"
  mdcn: "\n\n# Java：Java应用程序中的类\n\n异常在运行时是可以相当恢复的，而那些由逻辑错误导致的异常不是未检查异常；这种类型的异常包含在产生它们的方法的实现中，在下一节中也是如此。\n\
    \n## 4.3 检查异常\n\n异常提供了一种简单直接的机制来检查错误，而不会用额外的语句（如 `else` 结构和其他用于测试字段值的语句）来杂乱代码，以便检测何时可能发生错误。一个方法可能产生的异常被显式地包含在方法的声明中。这意味着异常与方法的返回类型和参数一样，是方法编程接口（API）的重要组成部分。在方法声明中包含异常意味着调用该方法的代码会感知这些异常，因此编译器也知道它们的存在。由编译器检查的异常类型被称为检查异常（checked\
    \ exception）。\n\n当在调用方法时发生错误，异常对象会被传递给运行时系统；这个过程被称为抛出异常（throwing an exception）。运行时系统尝试在调用方法中寻找某些用于响应和处理异常的代码。如果在调用方法中没有找到该处理代码，运行时系统将沿着已调用的方法集回溯，一直调用抛出异常的方法，直到找到某个处理器。这组方法被称为调用栈（call\
    \ stack）。如果开发者没有提供处理代码，运行时系统最终到达方法调用栈的末端，即运行应用程序 `main` 方法的线程。如果 `main` 没有处理该异常，`main`\
    \ 的执行线程将异常终止。换句话说，当 `main` 异常终止时，应用程序将会崩溃。我们将在《Java 编程入门 3：图形用户界面》的第四章中检查这些内容。\n\
    \n另一方面，如果开发者在栈的某处提供了处理代码，则认为该异常被作为处理器的代码捕获了（caught）。\n\n在讨论异常的这里，让学习者研究一个说明如何抛出和捕获检查异常的示例将很有启发性。\n\
    \n## 4.3.1 Java 程序中如何处理检查异常？\n\n该示例展示了异常如何被抛出和捕获，以说明与 Java 程序异常处理相关的关键概念。\n\n\
    简单异常类的代码见下一页。\n\n# Java：Java应用程序中的类\n\n```\npublic class MyException extends Exception\
    \ {\n    // 构造函数\n    public MyException() {\n        super(\"You are attempting\
    \ to divide by zero.\");\n\n    } // 类定义结束\n```\n\n`MyException` 的构造函数向父类 `Exception`\
    \ 传递了一个字符串；该字符串被用于构建错误信息。\n\n严格来说，尝试除以零会抛出一个 `ArithmeticException` 实例，它的类型是 `RuntimeException`：它是一个未检查异常。然而，通过直接继承\
    \ `Exception` 使 `MyException` 成为检查异常，意味着该示例可以用于说明如何抛出和捕获检查异常。\n\n`MyObject` 类包含一个方法，声明它会抛出\
    \ `MyException` 对象：注意在 `quotient` 的声明中使用使用了 `throws` 关键字。接下来是类定义。\n\n```java\n\
    public class MyObject {\n    public double quotient(int num, int den) throws MyException\
    \ {\n        if(den == 0) {\n            System.out.println(\"quotient has exited\
    \ and thrown an \" + \"instance of MyException.\");\n            throw new MyException();\n\
    \        } else {\n            System.out.println(\"quotient has completed.\"\
    );\n            return ( double ) num / den;\n        }\n    } // quotient 结束\n\
    \n    public void myWeb(int num, int den) {\n        try {\n            double\
    \ answer = quotient(num, den);\n            System.out.println(\"The value of\
    \ num / den = \" + answer);\n        } catch (MyException me) {\n            me.printTrace();\n\
    \        }\n        System.out.println(\"myMethod has completed.\");\n    } //\
    \ method 结束\n} // 类结束\n```\n\n`quotient` 方法包含一个 `if .. else` 结构，用于确定抛出 `MyException`\
    \ 实例的情况。如果分母 `den` 不为零，该方法返回分子 `num` 除以分母 `den` 的双精度值。\n\n`myMethod` 方法调用 `quotient`\
    \ 并使用 `try ... catch` 结构检查异常。`try` 块包含了对 `quotient` 的调用。如果 `den` 不等于零，执行 `try`\
    \ 块的语句，跳过 `catch` 块并输出 \"myMethod has completed.\"。\n\n如果在调用 `myMethod` 时 `den`\
    \ 等于零，则 `quotient` 方法将开始执行，`try` 块中的剩余语句被跳过，并执行 `catch` 块。`catch` 块中的语句调用了 `MyException`\
    \ 的继承方法，以便输出有关错误条件的有用信息。简而言之，异常在调用 `quotient` 抛出时在 `myMethod` 中被捕获。`MyObject`\
    \ 中两个方法中的打印语句用于显示在抛出异常时处理到了哪里。\n\n为了说明调用 `myMethod` 时发生的情况，需要一个测试类。测试类的代码见下一页。\n\
    \n# Java：Java应用程序中的类\n\n# Java 程序中的错误\n\n```java\npublic class TestClassOne {\n\
