    # Java: Classes in Java Applications


    # Errors in Java Programmes


    should have been fixed by the developer at compile time; they cannot be recovered
    from run-time. Given that they were not anticipated by the developer, they are
    easily eliminated by working through and correcting the logic of the code that
    produced the error messages. Working with the logic of source code is debugging.
    Integrated Development Environments (IDEs) usually provide a debugging tool that
    can be used to step through code statement by statement.


    There, on the other hand, a number of run-time errors can occur when a programme
    executes that are outside the control of the programme''s logic. These include,
    for example, error conditions that are reasonably likely to occur in that they
    have the potential to impair access to data and access to other local and networked
    resources. The kind of error is reasonably likely to occur at run-time should
    be recoverable so that the programme does not terminate.


    Anticipating such errors has the potential to occur expected conditions such as,
    for example, detecting the end of a file that is being read by a method. In this
    case, the method that reads the file should include code that detects the end
    of the file so that an ‘end of file’ error does not occur at run-time.


    The inevitable existence of run-time errors raises an important question: how
    does the developer anticipate run-time error conditions? If the developer takes
    an exhaustive position and anticipates all error conditions have the potential
    to occur with all methods, the resulting code is highly likely to be cumbersome
    and almost unusable. On the other hand, if the developer takes an optimistic position
    and does not anticipate many error conditions, the resulting code may not be robust
    enough when the application is released to its users. The answer to the question
    (posed at the beginning of this paragraph) is not a straightforward one in that
    it is easy to decide which errors to anticipate and not to anticipate. In practice,
    the answer lies arriving at a reasonable practical compromise between the two
    positions.


    # 4.2 What are Unexpected Error Conditions?


    The two error messages listed in Section 4.1 reveal a clue to how unexpected error
    conditions are dealt with in Java programme. A cursory examination of the messages


    ```

    ArrayIndexOutOfBoundsException

    ```


    and


    ```

    ClassCastException

    ```


    reveals that the two compound words have something in common: the word ‘Exception’.
    It is to be hoped that the reader immediately recognises that an Exception is
    a Java class. Therefore an ArrayIndexOutOfBoundsException is a type of Exception
    class. This is indeed the case for the following from the API confirms.'
