    programmes were executed. In fact, both of these error messages imply that the
    developer has made a logic error. Logic errors that occur at run-time are usually
    reflected in the output from the application. Logic errors are eliminated by further
    testing and debugging of the programme at compile time.


    At compile time, in the first case, the compiler could not be expected to anticipate
    that an out of bounds array index is being processed at runtime. The occurrence
    of an ArrayIndexOutOfBoundsException should be sufficient information for the
    developer to check the logic of the code that produces such an error.


    At compile time, in the second case, the developer has not obeyed the rules for
    casting object references. Although the code has compiled because the compile-time
    rules have been obeyed, the run-time rules have been broken; again, the nature
    of the error message should be sufficient information for the developer to check
    that the statements that include a cast obey both the compile-time and runtime
    rules of object reference casting as explained in the previous chapter.


    In short, the two errors are indicated by the messages


    +   - ArrayIndexOutOfBoundsException


    +   - ClassCastException'
