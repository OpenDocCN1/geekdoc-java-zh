    # Java: Classes in Java Applications Grouping Classes Together in a Java Application


    Reasons why packages are employed in a Java application:


    +   - developers can easily determine from the structure of an application how
    application logic is partitioned amongst its packages;


    +   - developers can easily find related classes in an application;


    +   - packages in the Java API imply that their contents are a collection of related
    classes (see later in this chapter);


    +   - the names of types in one package won''t conflict with the same names in
    another package;


    +   - types in a package can have unrestricted access to one but restricted access
    to types outside the package (see later in this chapter);


