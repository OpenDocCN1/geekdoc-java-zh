    # Java：Java 应用中的类


    ## 在 Java 应用中将类分组


    此时，值得提到的是 Java 运行时系统会自动导入 `java.lang` 包的类。该包包含大约 40 个类，许多广泛使用的类，如包装类 - `Boolean`、`Character`、`Double`、`Integer`
    等（它们是原始数据类型的对象表示），以及 `System`、`String` 和 `Thread` 等类。这种自动包含的理由是，常用的类应该是随时可用的，而无需为它们编写
    `import` 语句。


    ## 6.5 使用和访问包成员


    我们已经看到 `import` 语句在类定义中提供了对命名包的一个或多个成员的访问。为了从包外部使用公共成员，必须满足以下条件：


    - 1. 成员必须通过其完全限定名引用。

    - 2. 成员必须被导入。

    - 3. 成员的整个包必须被导入。


    在 Java 语句中使用引用时，每次都需要通过其完全限定名引用成员，因此，当引用次数较少时，这是一种可行的方法。对于频繁的引用，一旦通过 `import`
    语句导入，就可以在代码中使用其类名而不是其完全限定名来引用它。


    然而，在导入包成员时需要小心，例如当包中存在同类时。例如，考虑以下代码段：


    ```

    package mynewpackage;

    import currentAccount.Account;

    import savingsAccount.Account;

    ```


    在紧随包语句和 `import` 语句的类定义中对类型 `Account` 的引用将导致编译错误，因为编译器不知道引用的是两个 `Account` 类中的哪一个。在这种情况下，即使已经专门导入了
    `Account` 类，当在代码中使用其完全限定名时，编译器将区分这两个 `Account` 类型。


    当导入成员的整个包时，在后续代码中可以使用其类名引用该包的任何成员。


    ### 6.5.1 控制对包成员的访问


    让我们回想表 3.1 中列出的访问修饰符的访问级别；该表在下一页的表 6.1 中重复出现


    | 修饰符 | 同一类 | 同一包 | 子类 | 全局 |

    | --- | --- | --- | --- | --- |

    | private | 是 | | | |

    | default: specifier | 是 | 是 | | |

    | protected | 是 | 是 | 是 | |

    | public | 是 | 是 | 是 | 是 |


    表 6.1 类成员的访问级别


    表 6.1 的第一行确认了关于 `private` 修饰符的认知：类本身可以访问它。


    第二行可以被视为 `default`（即包级别）：同包内的类可以访问它。第四行显示了当类成员声明为 `public` 时，所有开发者都可以访问。


    当我们沿着 `Modifier` 列向下移动 `private`、`default`（即包级别）、`protected` 和 `public` 时，我们将适时返回第三行。


