    String searchText = username + password;\n// Search the array of members for the\
    \ combined user name and password. First, find the array\n// of members.\nMember[\
    \ ] existingMembers = mediaStore.getMembers();\n// Scan the array of existing\
    \ members and compare the search string with each member's\nboolean flag = true;\n\
    while (flag == true) {\n    for (int i = 0; i < mediaStore.getNoOfMembers(); i++)\
    \ {\n        Member existingMember = existingMembers[i];\n        String existingUserName\
