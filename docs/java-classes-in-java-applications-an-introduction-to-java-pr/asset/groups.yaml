    # Java: Classes in Java Applications Extending Classes by Means of Inheritance


    The same test class produces the following output; note the value is 43, 42:


    The value of someValue is: 43


    The statement


    ```

    value = super.someValue();

    ```


    includes a call to someValue ''on'' an object with the reference ''super''. The
    use of the keyword super in this context refers to an object of the class MyClass
    from which MyObjectClass inherits its members and shows that we can invoke methods
    of an extended class in the extending class by referring to the former via the
    object reference super.


    The relationship between MyObjectClass and MyClass is such that the latter is
    said to be the superclass of the former or, looking at the relationship the other
    way round, the former is a subclass of the latter. The IDE used to compile these
    three classes referred to in this section displays this relationship in the screen
    shot shown next figure.


    ![](img/8e21bca3c5638080efd3c1b81bc23762_48_0.png)


    The solid line with the closed arrow indicates that MyObjectClass is a subclass
    of its superclass MyClass; in other words, MyObjectClass has an ''is a'' relationship
    with its superclass. The dotted line with an arrow shows that TestClass has a
    ''has a'' relationship with MyObjectClass because TestClass declares a local variable
    of the MyObjectClass type in its main method. (The dotted line between MyObjectClass
    and TestClass should be a straight line according to the conventions of UML diagrams.
    It is a quirk of the IDE that it does not draw straight lines for ''has a'' relationships.)


