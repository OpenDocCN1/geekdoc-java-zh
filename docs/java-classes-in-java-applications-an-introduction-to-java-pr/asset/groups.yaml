    # 3.7 Controlling Access to the Members of a Class


    Access modifiers are used to determine whether other classes have access to a
    member of a class. Up to this point in the guide, we have met the access modifiers
    public and private as they are applied to modify declarations of fields and methods
    of a class. The access modifier public means that all other classes have access
    to such members of a class and the access modifier private means that other members
    of a class have access to private members of that class.


