    \ 的工程师在生产、开发和营销领域工作，涉及广泛领域，即化学、电子、软件、光学、光电、化学计量。\n\n我们在一一家领先且创新的国际公司中提供具有挑战性的工作。你将有机会与高高技能的同事一起使用最先进的技术。\n\
