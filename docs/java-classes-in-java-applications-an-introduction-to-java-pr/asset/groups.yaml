    at TestClassOne.main(TestClassOne.java:27)\n\n(There are other methods in the\
    \ call stack that call main that are specific to the IDE [BlueJ] that was used\
    \ to run the example. However, these are omitted for the sake of clarity.)\n\n\
    The output is what is expected: quotient throws an exception and exits; the exception\
    \ is caught by the catch block of myMethod and outputs the stack trace. However,\
    \ main is still running and shows that the exception has been recovered at run-time.\n\
    \nNext, let us find out what happens when myMethod doesn't catch MyException objects\
    \ but declares that it throws them.\n\nThe code for MyObject is now as follows.\n\
    \n```\npublic class MyObject {\n\n    public double quotient(int num, int den)\
    \ throws MyException {\n\n        if (den == 0) {\n            System.out.println(\"\
    quotient has exited and thrown an \" + \n                \"instance of MyException.\"\
    \ \");\n            throw new MyException();\n        } else {\n            System.out.println(\"\
    quotient has completed.\" \");\n            return ( double ) num / den;\n   \
    \     }\n    }\n}\n```\n\n## Java: Classes in Java Applications\n\n## Errors in\
    \ Java Programmes\n\n```\npublic void methodName(int num, int den) throws MyException\
    \ {\n double answer = quotient(num, den);\n System.out.println(\"The value of\
    \ num / den = \" + answer);\n System.out.println(\"myMethod has completed.\");\n\
    } // end of class definition\n```\n\nIt is now the responsibility of main, as\
    \ shown by the call stack, to catch MyException objects. The relevant section\
    \ of the amended test class follows on the next page.\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_78_0.png)\n\
    \nMAERSK INTERNATIONAL TECHNOLOGY & SCIENCE PROGRAMME\nAre you about to graduate\
    \ as an engineer or geoscientist? Or have you already graduated? If so, there\
    \ may be an exciting future for you with A.P.Moller - Maersk.\n\nwww.maersk.com/mitas\n\
    \nDownload free books at BookBoon.com\n\n## Java: Classes in Java Applications\n\
    \n## Errors in Java Programmes\n\n```\n// test the value of den\nif (den == -99\
    \ )\n{\n    break;\n} else // carry on\n{\n    // instantiate a MyObject object\n\
    \    MyObject mo = new MyObject(\n    try {\n        mo.myMethod(num, den);\n\
    \        System.out.println(\"main is still running.\");\n    } catch (MyException\
    \ me) {\n        me.printStackTrace();\n        System.out.println(\"main is still\
    \ running.\");\n    }\n}\n```\n\nThe output is as follows.\n\nEntering -99 for\
    \ the second number will terminate main.\nEnter the first number: 12\nEnter the\
    \ second number: 0\nquotient has exited and thrown an instance of MyException.\n\
    main is still running.\nEntering -99 for the second number will terminate main.\n\
    Enter the first number:\n\nMyException: You are attempting to divide by zero.\n\
    at MyObject.quotient(MyObject.java:9)\nat MyObject.myMethod(MyObject.java:21)\n\
    at TestClassOne.main(TestClassName.java:29)\n\nAgain, the output is expected.\n\
    \nFinally, in this section, let us see what happens main does not catch MyException\
    \ objects but declares it throws them. The amended declaration for main is as\
    \ follows:\n\n```\npublic static void main ( String[] args ) throws MyException\n\
    ```\n\nThe body of main does not attempt to catch MyException objects.\n\n## Java:\
    \ Classes in Java Applications Errors in Java Programmes\n\nThe output is as follows:\n\
    \nEntering. -99 for the second number will terminate.\nEnter the first number:\
    \ 9\nter the second number: 0\nquotient has exited and thrown an instance of MyException.\n\
    \n```\nMyException: You are attempting to divide by zero.\nat MyObject.quotient(MyObject.java:9)\n\
    at MyObject.myMethod(MyObject.java:21)\nat TestClassOne.main(TestClassOne.java:27)\n\
    ```\n\nThe IDE used to run the application indicates that main has terminated\
    \ abnormally – in other words the programme has crashed – because main has not\
    \ caught the exception and has merely declared that it is thrown. This illustrates\
    \ that exceptions must be either caught or declared to be thrown by methods in\
    \ the call stack and that main is the final opportunity to catch them.\n\n> As\
    \ a general rule, it is good practice to catch an exception when the method that\
    \ throws it is called.\n\nThe example code and output explained in this section\
    \ shows that the run-time system searches the call stack in the reverse order\
    \ in which methods are called until it finds a catch block that is designed to\
    \ respond to the exception thrown by a method. When a catch block is found, the\
    \ exception is handed to the run-time system. If the exception is caught before\
    \ it reaches main or if main catches it, the programme will not terminate abnormally;\
    \ if main does not handle it but declares that it is thrown, main will crash.\n\
    \nNow that we have thoroughly explored an example and shown how a simple exception\
    \ is thrown and caught in different places in the call stack\n\nJava: Classes\
    \ in Java Applications\n\nErrors in Java Programmes\n\n## 4.4 try ... catch —\
    \ finally Blocks\n\nThe code and output associated with the examples discussed\
    \ in the previous section provide practical evidences that we use to bring together\
    \ a number of points concerning handling exceptions.\n\n- Developer-written code\
    \ that might throw an exception is enclosed in a try block.\n- Similarly, method\
    \ invocations are defined to throw exceptions as indicated by the API for a method\
    \ should be enclosed in a try block.\n- A try is followed by one or more catch\
    \ blocks.\n- Each catch block specifies the type of exception it catches (i.e.\
    \ handler) and contains a handler for that exception type.\n- After the last catch\
    \ block, an optional finally block contains code that always executes.\n- When\
    \ an exception occurs, catch blocks are searched in their order for the appropriate\
    \ handler.\n- It is useful to sequence catch blocks from the specific to the general,\
    \ objects of the Exception class are caught in the last catch block which serves\
    \ as a catch-all if any specific exceptions have not been caught.\n- If an exception\
    \ is not caught in a try...catch block, it is thrown to the next method in the\
    \ call stack.\n- If the exception is passed to the main method and is not handled,\
    \ the program terminates abnormally.\n\nJava: Classes in Java Applications\n\n\
    Errors in Java Programmes\n\n## 4.5 Throwing Exceptions\n\nThe example in Section\
    \ 4.3.1 shows that an exception is thrown by a method by using the following generalised\
    \ syntax:\n\n```\npublic void aMethod( ) throws AnException {\n\nif ( <condition>\
    \ )\n{\n\tthrow new AnException();\n}\nelse { }\n}\n // end of method implementation\n\
    ```\n\nand is caught by the calling method as shown on the next page.\n"
