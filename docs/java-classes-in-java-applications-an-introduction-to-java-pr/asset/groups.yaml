- md: "\n# Java: Classes in Java Applications Extending Classes By Means of Inheritance\n\
    \nThe simple example discussed in this section shows the superclass-to-subclass\
    \ relationship between classes. In fact, all classes written in Java inherit implicitly\
    \ from a class whose type is Object, and as a consequence, inherit the members\
    \ of the class Object. The following extract from the API shows some of the members\
    \ of the Object class.\n\n```java\njava.lang\nClass Object\n```\n\n```java\njava.lang.Object\n\
    public class Object\n```\n\nClass Object is the root of the class hierarchy. Every\
    \ class has Object as a superclass. All objects, including arrays, implement the\
    \ methods of this class.\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_49_0.png)\n\
    \nStudent and Graduate opportunities in IT, Internet & Engineering\nCheltenham\
    \ | competitive + benefits\n\nPart of the UK's intelligence services, our role\
