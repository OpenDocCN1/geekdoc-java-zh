    # Java: Classes in Java Applications


    # Using the Java Application Programming Interface


    # compareTo


    ```

    public int compareTo(String anotherString)

    ```


    Compares two strings lexicographically. The comparison is based on the Unicode
    value of each character in the strings. The character sequence represented by
    this String object is compared lexicographically to the character sequence represented
    by the argument string. The result is a negative integer if this String object
    lexicographically precedes the argument string. The result is a positive integer
    if this String object lexicographically follows the argument string. The result
    is zero if the strings are equal; compareTo returns 0 exactly when the equals(Object)
    method returns true.


    +   Specified by:

    compareTo in interface Comparable<String>

    Parameters:

    anString - the String to be compared.

    Returns:

    value 0 if the argument string is equal to this string; a value less than 0 if
    this string is lexicographically less than the string argument; and a value greater
    than 0 if this string is lexicographically greater than the string argument.


    The principal purpose of the illustrations in this section is to show that the
    documentation provided by the API is generated in an identical fashion to that
    produced by the javadoc for developer-written classes, as exemplified in Section
    1.1.1. This gives rise to consistently-structured documentation for the infinite
    of Java classes used and written by the worldwide Java development community.


    While the examples in Section 1.1.1 are relatively straightforward in terms of
    the logic of Java source code, they are included to illustrate the essential principles
    and purpose of providing single-line and block documentation as an integral part
    of writing class definitions.


    The next chapter returns to the Java language itself and explores how flow of
    control is managed in blocks of Java source code.'
- md: "\nJava: Classes in Java Applications\n\nFlow Control\n\n## 2. Flow Control\n\
    \n### 2.1 Introduction to Flow Control\n\nThe Java language provides a number\
    \ of constructs that enable the developer to control the sequence of execution\
    \ of Java statements. Chapter Two provides examples of how these constructs are\
    \ used to control the flow of execution through a block of code that is typically\
    \ contained in the body of a method.\n\n### 2.2 Sequential Flow\n\nSequential\
    \ flow of execution of statements is the execution of Java source code in a statement-by-statement\
    \ sequence in the order in which they are written, with no conditions. Some of\
    \ the examples of methods that are discussed in previous chapters exhibit sequential\
    \ flow. In general terms, such a method is written as follows:\n\n```java\npublic\
    \ void someMethod() { \n    // first statement to execute\n    // second statement\
    \ to execute\n    // third statement to execute\n    // and so on, to the final\
    \ statement\n    // final statement to execute\n} // end of method definition\n\
    ```\n\nA number of the main methods, presented in previous chapters, are structured\
    \ in this way in order to satisfy straightforward testing criteria.\n\n### 2.3\
    \ Conditional Flow\n\nWhile sequential flow is useful, it is likely to be highly\
    \ restrictive in terms of its logic. Executing statements conditionally gives\
    \ the developer a mechanism to control the flow of execution in order to repeat\
    \ the execution of one or more statements or change the normal, sequential flow\
    \ of control. Constructs for conditional flow control in Java are very similar\
    \ to those provided by other programming languages. Table 2.1 on the next page\
    \ identifies the flow control constructs provided by the Java language.\n\n**Table\
