    // Instantiate an object whose type is the implemented by GameMembershipCard.

    CardStatus membersCard = new GameMembershipCard( 10 );

    ```


    Let us assume that the code that follows this declaration is the same as the code
    that processes a member. (This assumption is based on the fact that the code that
