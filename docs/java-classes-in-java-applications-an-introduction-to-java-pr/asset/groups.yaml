    `Card` 类继承来的方法，还包含在 `CardStatus` 接口中声明的方法。（`Serializable` 接口是许多标记接口之一。标记接口不声明方法；它们被用于识别需要某些活动的运行时；在此情况下，所需的活动是将对象读取并写入输入/输出流，[我们将在《Java
    编程入门 3：图形用户界面》的第一章中遇到输入/输出流]。这种这种活动被称为对象序列化——简称序列化——在主题应用程序中，它用于将 `Member` 对象的数组存储到文件中。序列化通过声明一个类实现了
    `Serializable` 接口来实现。）


    上述两个版本的 `MembershipCard` 类声明都实现了 `CardStatus` 接口，并且实际上在继承的行为之外还向类引入了行为。由于 Java
    不允许多重继承，接口被用作替代方案为类添加方法。通过接口向类添加方法使它们在 Java 中起着非常重要的作用。


    Java 接口的作用出现是因为接口并不是通用类层次的一部分。下一页显示的 `java.io` 包中 `Serializable` 接口的 API 摘录说明了。


