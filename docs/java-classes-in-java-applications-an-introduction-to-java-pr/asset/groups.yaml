  mdcn: "\n\n# Java：Java 应用中的类\n\n// 下一个代码块中调用的一个或多个方法已知会产生错误，// 它们被称为“抛出”（throw）错误，必须在单独的代码块中被检测或“捕获”（caught）\n\
    \n```java\ntry {\n    // 编写会抛出错误的方法调用\ncatch ( Exception e ) {\n    // 对错误进行某些处理\n\
    }\n```\n\ntry ... catch 结构的含义意味着根据是否检测到错误来做出决定。如果 try 块中的某个方法调用抛出了错误，将跳过 try 块中剩余的语句并执行\
    \ catch 块中的语句。相反，如果 try 块中的方法调用没有抛出任何错误，则将跳过 catch 块的语句，并将控制权传递到 catch 块结束后的后的第一条语句。第四章将详细介绍如何使用\
    \ try ... catch 块来编写健壮的 Java 代码。\n\n在下一章中，我们将了解到如何通过名为“继承”的非常重要的概念来扩展类。\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_43_0.png)\n\
