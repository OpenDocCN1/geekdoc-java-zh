    # 4.7 Summary of Exceptions


    Objects of the Exception class are handled in a Java application when they are
    declared to be thrown by methods of classes documented in the Java API. These
    checked exceptions respond to error conditions outside the control of the developer.
    In the case of the themed application, IOException objects are caught by the method
    that transfers data out of the application to a file and the method that reads
    these data back in the application.


    Developer-defined exceptions respond to specific invalid conditions that are a
    function of business rules associated with an application. In the case of the
    themed application, a developer-defined exception occurs when a member of the
    Media Store attempts to use their card in a way that is not permitted by the business
    rules of the Media Store.


    The examples discussed in this chapter aim to show that there are advantages using
    Exception objects to represent error conditions compared to the traditional approach
    to error handling adopted in non-OOP languages.


    +   1. The use of objects to represent error conditions means that code to handle
    - i.e. catch - exceptions is separate from application logic.

    2. If there are circumstances where an exception does not need to be caught at
    the point it is thrown, it can be propagated up the stack to reach whichever calling
    method is chosen to handle it.

    3. Given that all exceptions are objects, the class hierarchy of Exception can
    be used to put similar exceptions into groups.


    The outcome of point 3 is that the class of an exception indicates the type of
    exception thrown by. Instances that represent the kinds of error associated with
    input/output (I/O) to/from a Java application. We will find out how to use the
    I/O classes in Chapter One in An Introduction to Java Programming 3: Graphical
    User Interfaces.


    The next chapter explores one of the most important concepts associated with Java,
    namely that of the interface.


