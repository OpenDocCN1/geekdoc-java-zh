    Java: Classes in Java Applications


    The definition of a Java interface can be summarized by the following general
    syntax:


    ```

    public interface < NameOfInterface extends SuperInterfaces >

    ```


    An interface, unlike a class, can extend any number of interfaces in a comma-separated
    list.


    # 5.3 The Role of Interfaces as a Means to Introduce Behaviour to a Class


    A similar version of the themed application modifies the class definition for
    MembershipCard as follows:


    ```

    public class MembershipCard extends Card implements Serializable, CardStatus {

    ```


    and shows that a class can extend from only one class – as we discovered in Chapter
    Three – but can implement more than one interface. This means that the MembershipCard
    class not contains only its methods and those it inherited from the Card class,
    it also contains methods declared in the interface CardStatus. (The interface
    Serializable is one of many of tagged interfaces. Tagged interfaces do not declare
    methods; they are used to identify the run-time that an activity is required;
    in this the activity required reading and writing objects to an input/output stream,
    [We will encounter input/output streams in Chapter One in An Introduction to Java
    Programming 3: Graphical User.] This activity is known as object serialization
    – serialization for short - and is used in the themed application to store an
    array of Member objects to a file. Serialization is achieved by declaring that
    a class implements a Serializable interface.)


    Both versions of the class declarations of MembershipCard referred above implement
    the CardStatus interface and, in effect, introduce behaviour to the class in addition
    to inherited behaviour. Given that Java does not permit multiple inheritance,
    interfaces are used as an alternative in order to add methods to a class. Adding
    methods to a class by means of interfaces gives them a very important role in
    Java.


    The role of Java interfaces arises due to the fact that interfaces are not part
    of the general class hierarchy. An extract from the API for the Serializable interface
    of the java.io package shown on the next page illustrates this.'
