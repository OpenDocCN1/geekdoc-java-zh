    # 6. Grouping Classes Together in a Java Application


    Chapter Twelve explains how classes and interfaces can be grouped together, using
    a concept unlike that of a generic namespace. Collecting a number of related classes
    in a single structure known as a package makes them easier to manage and avoid
    potential naming conflicts.


    # 6.1 An Introduction to Java Packages


    As an illustration of namespace management, assume that a banking application
    has two classes named Account: one of the classes is the definition of a class
    for current account and the other is for a savings account. The name of the two
    classes can be the same (Account) as long as they are placed in separate packages.
    This is because each package creates a new namespace that the types in one package
    do not conflict with the types in another package.


    A simple analogy might help the reader to appreciate the need to manage class
    names and their namespaces. The use of packages in a Java application is rather
    like the obvious distinction between a business address in Main Street in Freetown
    and a similar address in Main Street in Freestyle


    Top Ten Records, Main Street, Freetown and Top Ten Records, Main Street, Freestyle


    The notation for the address of each Top Records store is for the obvious benefit
    to everyone concerned.


    The outcome of placing the classes named Account in separate packages means that
    their unique, fully-qualified names are written as follows:


    ```

    // refers to the Account class in the package named

    currentAccount

    ```


    and


    ```

    savingsAccount . Account // refers to the Account class in the package named

    ```


    The notation used for the fully-qualified name of a class means that it can be
    referred to unambiguously and accessed by means of the usual . (dot) selector.


    # 6.2 Creating Packages


    A version of the themed application shown in Figure 6.1 below indicates that classes
    of the application are bundled together in one of two packages depending upon
