- md: "\n# Java: Classes in Java Applications\n\n# Errors in Java Programmes\n\n```\n\
    catch (IOException e) { // Start of catch block.\nSystem.out.println(\"Error:\
    \ \" + e.getMessage());\n} // End of catch block.\n```\n\n// End of writeMembers.\n\
    \nThe code from the themed application in this section illustrates the flexibility\
    \ of the Exception class that objects of this class are used to catch developer-defined\
    \ exceptions and those declared in the Java API.\n\n# 4.7 Summary of Exceptions\n\
    \nObjects of the Exception class are handled in a Java application when they are\
    \ declared to be thrown by methods of classes documented in the Java API. These\
    \ checked exceptions respond to error conditions outside the control of the developer.\
    \ In the case of the themed application, IOException objects are caught by the\
    \ method that transfers data out of the application to a file and the method that\
    \ reads these data back in the application.\n\nDeveloper-defined exceptions respond\
    \ to specific invalid conditions that are a function of business rules associated\
    \ with an application. In the case of the themed application, a developer-defined\
    \ exception occurs when a member of the Media Store attempts to use their card\
    \ in a way that is not permitted by the business rules of the Media Store.\n\n\
    The examples discussed in this chapter aim to show that there are advantages using\
    \ Exception objects to represent error conditions compared to the traditional\
    \ approach to error handling adopted in non-OOP languages.\n\n- 1. The use of\
    \ objects to represent error conditions means that code to handle - i.e. catch\
    \ - exceptions is separate from application logic.\n- 2. If there are circumstances\
    \ where an exception does not need to be caught at the point it is thrown, it\
    \ can be propagated up the stack to reach whichever calling method is chosen to\
    \ handle it.\n- 3. Given that all exceptions are objects, the class hierarchy\
    \ of Exception can be used to put similar exceptions into groups.\n\nThe outcome\
    \ of point 3 is that the class of an exception indicates the type of exception\
    \ thrown by. Instances that represent the kinds of error associated with input/output\
    \ (I/O) to/from a Java application. We will find out how to use the I/O classes\
    \ in Chapter One in An Introduction to Java Programming 3: Graphical User Interfaces.\n\
    \nThe next chapter explores one of the most important concepts associated with\
    \ Java, namely that of the interface.\n\nDownload free books at BookBoon.com\n\
    \n# 5. Java Interfaces\n\nUp to this point in the guide, the reader will not have\
    \ encountered examples of a Java interface. This chapter explains how members,\
    \ in addition to those accessible to a class by means of inheritance, can be introduced\
    \ into Java classes by means of a special class known as a Java interface.\n\n\
    # 5.1 What is a Java Interface?\n\nExamples discussed in previous chapters readily\
    \ show that method implementations embody the application logic of a Java application\
    \ and method invocations run the application. It almost goes without saying, therefore,\
    \ that the methods implemented in the classes defined in a Java application are\
    \ fundamental to its operation.\n\nIn the light of the content of previous chapters,\
    \ what do we know about a method written by a developer or one that is specified\
    \ by the Java API? To answer this question, let us revisit two of the methods\
    \ in the themed application.\n\nFirstly, the documentation and declaration of\
    \ the takeItemLoan method of the DvdMembershipCard class is as follows.\n\n```java\n\
    /**\n* This method takes a specific DVD on loan. It overrides the method in the\
    \ parent class.\n* @param catNo The catalogue number of the DVD to take on loan.\n\
    \ */\npublic void takeItemOnLoan(String catNo) throws ItemLimitException { }\n\
    ```\n\nSecondly, let us recall from Chapter Four that the readMembers method of\
    \ the MediaStore class calls the readObject method of the I/O classes in a try\
    \ block. Part of the documentation of the readObject method, taken from the Java\
    \ API, includes the following information:\n\n```java\npublic final Object readObject()\n\
    throws IOException\n```\n\nThe documentation of both methods includes a number\
    \ of elements that are known to the user of the method. The known elements of\
    \ the two methods are listed in the box on the next page.\n\n# Java: Classes in\
    \ Java Applications\n\n# Java Interfaces\n\n| the method's identifier; |\n| the\
