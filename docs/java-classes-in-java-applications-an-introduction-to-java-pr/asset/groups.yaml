    Enter second number: \");\n            den = keyboard.nextInt();\n           \
    \ if (den == -99) {\n                break;\n            }\n            MyObject\
    \ mo = new MyObject();\n            mo.myMethod(num, den);\n            System.out.println(\"\
    main is still running.\");\n        }\n        System.out.println(\"main has terminated.\"\
    );\n    }\n}\n```\n\n"
