    \ If a method expects a parameter of the type Student, you can pass it a FullTimeStudent\
    \ object and it will work, although you likely have to find out the type argument\
    \ by using the instanceof operator and restore the full functionality of the object\
    \ by a suitable cast, as shown in Section 3.5. This feature of inheritance is\
    \ known as polymorphism. An object that is declared to be of the Student type\
    \ can have many forms in that it can be used as a Student object, a FullTimeStudent\
    \ object, or a PartTimeStudent object.\n\nThe behaviour of a Student object is\
