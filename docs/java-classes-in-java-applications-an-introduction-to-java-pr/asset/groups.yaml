    \nFOSS 拥有集团是专用高科技解决方案的全球领先供应商，用于测量和控制农业、食品、制药和化学产品的生产和分配。我们的基地位于丹麦、瑞典和美国，总部位于\
    \ Hellerborg。我们的产品通过全球 23 家公司和全球广泛的分销网络进行营销。为了实现“优先”的核心目标，公司扩大扩大市场地位。\n\n专用分析解决方案\n\
    \nFOSS\nSlangerupvej 69\n3400 Hellerup\n电话. +45 70103370\n\nwww.foss.dk\n\n###\
    \ 2.4.1 if ... then 结构\n\nif ... then 结构是 Java 语言提供的决策结构中最基本的。如果条件为真，则执行代码块；否则，控制将跳到\
    \ if 块后的第一条语句。下面的代码片段说明了 if ... then 结构的简单用法。\n\n```java\n// 假设 age 的值已通过键盘输入\n\
    if ( age >= 18 ) // 如果条件放在 ( ) 之间\n{ // if 块开始\n    System.out.println(\"You can\
    \ drink legally.\"); // 如果 then 子句\n} // if 块结束\n// 执行下一条语句\nSystem.out.println(\"\
    The rest of the programme is next.\");\n```\n\n当运行代码片段（在 main 方法中）时，当 age = 20，输出为：\n\
    \nYou can drink legally.\nThe rest of the programme is next.\n\n而当 age = 17，输出为：\n\
    \nThe rest of the programme is next.\n\n在某些编程语言中，“then”一词包含在 then 子句中。如上面的代码片段所示，Java\
    \ 并非如此。\n\n来自主题应用程序的一个示例，展示了 Member 类中一个方法对 if ... then 结构的操作。该方法向成员数组添加一个成员。\n\
    \n```java\n/**\n * 如果有空间，此方法将成员添加到成员数组中。\n * @param fName 成员的姓。\n * @param lName\
    \ 成员的姓。\n * @param uName 成员的用户名。\n * @param pWord 成员的密码。\n */\npublic void addMember(String\
    \ fName, String lName, String uName, String pWord ) {\n    if (noOfMembers < 6\
    \ ) {\n        members[noOfMembers] = new Member(fName, lName, uName, pWord);\n\
    \        noOfMembers++;\n        System.out.println(\"The member has been added.\"\
    );\n    } else {\n        System.out.println(\"No room for member.\");\n    }\n\
    }\n```\n\n### 2.4.2 if ... else 结构\n\nif ... else 结构（有时称为 if ... else 结构）在条件为假时提供另一种执行路径。图\
    \ 2.1 以图的形式说明了 if 结构的逻辑。\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_21_0.png)\n\
    \n后续章节将通过示例说明如何使用这些结构。\n\n```java\nif ( age >= 18 ) // 如果条件放在 ( ) 之间\n{ // if\
    \ 块开始\n    System.out.println(\"You can drink legally.\"); // 如果 then 子句\n} //\
    \ if 块结束\nelse\n{ // else 块开始\n    System.out.println(\"You are too young to alcohol!\"\
    );\n} // else 块结束\n// 执行下一条语句\nSystem.out.println(\"The rest of the programme\
    \ is next.\");\n```\n\n当运行代码片段（在 main 方法中）时，当 age = 20，输出为：\n\nYou can drink legally.\n\
    The rest of the programme is next.\n\n而当 age = 17，输出为：\n\nYou are too young to\
    \ alcohol!\nThe rest of the programme is next.\n\n另一个来自主题应用程序的示例展示了 Member 类中另一个方法的\
    \ if ... else 结构。setCard 方法被用于将媒体商店的成员与虚拟会员卡关联。每个成员最多可以两张卡，因此该方法检查是否可以为成员分配另一张卡。\n\
    \n```java\n/**\n * 此方法通过将卡添加到成员的（两个）卡数组中来赋予卡。\n * 数组具有标识的卡。\n * @return 一个布尔值，表示是否可以添加卡。\n\
    \ * @param card MembershipCard 类型的参数。\n */\npublic boolean setCard(MembershipCard\
    \ card ) {\n\n    // 声明一个局部变量\n    boolean result = true;\n    // noOfMembers\
    \ 是分配给成员的卡数\n    if ( noOfMembers < cards.length ) {\n        cards[noOfMembers]\
    \ = card;\n        noOfMembers++;\n    }\n    else {\n        System.out.println(\"\
    No more cards allowed for this member.\");\n        result = false;\n    }\n \
    \   return result;\n}\n```\n\n"
