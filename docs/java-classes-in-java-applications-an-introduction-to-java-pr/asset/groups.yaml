    \ ternary operator.\n\n```\nint age = 21;\nSystem.out.println(age >= 18 ? \"Old\
    \ enough to drink\" : \"Too young to drink\\nSystem.out.println(\"The rest of\
    \ the programme is next.\");\n```\n\nand produces the following output when run:\n\
    \nOld enough to drink\nThe rest of the programme is next.\n\nThe next and final\
    \ sub-section in the category of decision-making constructs describes thenswitch\
    \ ... case construct.\n\n# 2.4.6 The switch ... case Construct\n\nThe switch ...\
    \ case construct is an alternative to compound if statements if the condition\
    \ is an evaluation of an integer expression. As such, it is often easier to code\
    \ compound if statements in that it is less prone to errors such as the omission\
    \ of brackets. the switch ... case construct is illustrated diagrammatically in\
    \ Figure 2.3 on the next page."
- md: "\n## Java: Classes in Java Applications\n## Flow Control\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_30_0.png)\n\
    \nFigure 2.3 The logic of the switch ... case construct\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_30_1.png)\n\
    \nThe logic of the switch ... case construct is such that the integer is tested\
    \ against each case or from left to right. When this logic is translated in Java\
    \ source code, the generalised syntax is as follows.\n\n```\nint someIntegerValue;\n\
    switch (someIntegerValue) { // start of switch block\n    case 1: // do something\
    \ else; break;\n    case 2: // do something else; break;\n    case 3: // do something\
    \ else; break;\n    case 5: // do something else; break;\n}\n// first statement\
    \ after the switch block\n```\n\nThe break statement after each case statement\
    \ is necessary to exit the enclosing switch block when the condition has been\
    \ satisfied. When a break statement is executed, control passes out of the enclosing\
    \ switch to the first statement after the end of the switch block. On the face\
    \ of it, it would seem logical to omit the final break statement. However, it\
    \ is advisable to include it in case additional case statements are added to an\
    \ existing switch block.\n\nIn the days before the ubiquitous use of icon-driven\
    \ applications, old-fashioned text-based interfaces or green screen of applications\
    \ were menu-driven. Case statements were typically used to construct this kind\
    \ of interface. While it is generally true that menu-driven applications have\
    \ largely disappeared, case statements are useful for testing the conditional\
    \ flow through application logic.\n\nThe following example illustrates a switch\
    \ ... case construct with a value entered via the keyboard. (It isn't necessary\
    \ to show the code used to capture a number via the keyboard for the purposes\
    \ of the example.)\n\n```\n// a number entered via the keyboard is stored in a\
    \ variable with the identifier month\nint days;\nswitch (month) {\n    case 9:\n\
    \    case 4:\n    case 6:\n    case 11: days = 30; break;\n    case 2: days =\
    \ 28; break;\n    default: days = 31; break;\n}\nSystem.out.println(\"The number\
    \ of days is: \" + days);\n```\n\nWhen this code is run in a main method, the\
    \ output is as follows:\n\n- Enter the number of the month: 1\nThe number of days\
    \ is: 31\n\n- Enter the number of the month: 2\nThe number of days is: 28\n\n\
    - Enter the number of the month: 3\nThe number of days is: 31\n\n- Enter the number\
    \ of the month: 4\nThe number of days is: 30\n\n- Enter the number of the month:\
    \ 5\nThe number of days is: 31\n\n- Enter the number of the month: 6\nThe number\
    \ of days is: 30\n\n- Enter the number of the month: 7\nThe number of days is:\
    \ 31\n\n- Enter the number of the month: 8\nThe number of days is: 31\n\n- Enter\
    \ the number of the month: 9\nThe number of days is: 30\n\n- Enter the number\
    \ of the month: 10\nThe number of days is: 31\n\n- Enter the number of the month:\
    \ 11\nThe number of days is: 30\n\n- Enter the number of the month: 12\nThe number\
    \ of days is: 31\n\nThe output shows that the default statement is used to detect\
    \ all values that aren't detected by any of the case statements. The output also\
    \ shows that when the value of month is 9, 4 or 6, the first three case statements\
    \ are said to 'fall through' so that the value of days is 30 when the value of\
    \ month is 9, 4, 6 or 11.\n\n## 2.5 Controlling the Repetition of Blocks of Code\n\
    \nControlling the repetition of a block of code can be achieved in one of ways:\
    \ by using a counter to repeat a block of a known number of times; by using the\
    \ evaluation of a boolean expression to decide when to stop repeating the block.\
    \ The general requirement to repeat a block of code is illustrated in Figure 2.4\
    \ on the next page.\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_33_0.png)\n\n\
    Figure 2.4 The requirement to repeat a block of code\n\n### 2.5.1 Counter-Controlled\
    \ Repetition\n\nThe logic of counter-controlled repetition is visualised in Figure\
    \ 2.5.\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_33_1.png)\n\nFigure 2.5 Counter-controlled\
    \ repetition of a block of code\n\nWorking with the counter is implemented by\
    \ what is known as a for loop. The general syntax of a for loop is as follows:\n\
    \n- for ( declare and initialise the counter;\n- final value condition of the\
    \ counter;\n- update counter )\n\n```\n{\n  // block to repeat\n}\n```\n\nThe\
    \ general syntax implies the value of the final condition of the counter is a\
    \ known value. For example, consider the following code snippet:\n\n```\nfor (int\
    \ i = 0; i <= someMaxValue; i++) {\n    // code block to repeat\n}\n```\n\nIf\
    \ the value of someMaxValue is 10, the code block will execute 11 times. If the\
    \ code snippet is modified to read follows with the same value of someMaxValue\n\
    \n```\nfor (int i = 0; i < someMaxValue; i++) {\n    // code block to repeat\n\
    }\n```\n\nthe code block will execute 10 times. The purpose of including the two\
    \ code snippets above is to show that care must be taken when initialising and\
    \ setting the final value of the counter's condition when controlling the number\
    \ of times that a for loop is executed.\n\nThe example, shown on the next page,\
    \ shows a for loop action.\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_34_0.png)\n\
    \nThe purpose of the for loop is to scan the array of cards in order to output\
    \ some information stored on each card. In the example, the number of cards held\
    \ by a member is known: therefore, a for loop is the clear choice of construct\
    \ to use to repeat the required block of code.\n\n## 2.5.2 Boolean-Controlled\
    \ Repetition\n\nJava provides two boolean-controlled constructs to control the\
    \ repetition of a block of code: the while loop and the do ... while loop.\n\n\
    ### The while loop\n\nThe logic of the while loop is visualised in Figure 2.6.\n\
    \n![](img/8e21bca3c5638080efd3c1b81bc23762_36_0.png)\n\nFigure 2.6 The logic of\
    \ a while loop\n\nFigure 2.6 implies that if the boolean condition returns an\
    \ initial value of 'false', the loop will not execute at all. If, on the other\
    \ hand, the boolean condition returns an initial value of 'true', the loop will\
    \ repeat its execution until such time as the condition eventually returns 'false'.\
    \ The general syntax of a while loop is as follows.\n\n```\n// initialize the\
    \ variable used in the boolean condition\nwhile( condition is true )\n{\n    //\
    \ statements to repeat\n    // update the condition: finally, exit the loop\n\
    }\n```\n\nThe first example from Section 2.5.1 can be modified to use a while\
    \ loop as shown on the next page.\n"
  mdcn: "\n\n## Java: Java 应用中的类\n## 流程控制\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_30_0.png)\n\
    \n图 2.3 switch ... case 构造的逻辑\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_30_1.png)\n\
    \nswitch ... case 构造的逻辑是：从左到右对整数与每个 case 进行。当此逻辑转换为 Java 源代码时，其通用语法如下。\n\n```\n\
    int someIntegerValue;\nswitch (someIntegerValue) { // switch 块开始\n    case 1:\
    \ // 执行其他操作; break;\n    case 2: // 执行其他操作; break;\n    case 3: // 执行其他操作; break;\n\
    \    case 5: // 执行其他操作; break;\n}\n// switch 块后的第一条语句\n```\n\n每个 case 语句后的 `break`\
    \ 语句是必要的，以便在条件满足时退出封装的 switch 块。当执行 `break` 语句时，控制将离开封装的 switch，到达 switch 块结束后的第一条语句。从上看，省略最后的\
    \ `break` 语句似乎是合理的。然而，建议包含它，以防向现有 switch 块中添加额外的 case 语句。\n\n在图标驱动的应用普及之前，旧式的基于文本界面或绿屏应用程序是菜单驱动的。case\
    \ 语句通常用于构建此类接口。虽然菜单驱动的应用在很大程度上已经消失了，但 case 语句对于测试应用程序逻辑中的条件流仍然有用。\n\n接下来的示例说明了通过键盘输入数值的\
    \ switch ... case 构造。（为了示例目的，没有必要显示通过键盘获取数字的代码。）\n\n```\n// 通过键盘输入的数字被存储在标识符为\
    \ month 的变量中\nint days;\nswitch (month) {\n    case 9:\n    case 4:\n    case\
    \ 6:\n    case 11: days = 30; break;\n    case 2: days = 28; break;\n    default:\
    \ days = 31; break;\n}\nSystem.out.println(\"The number of days is: \" + days);\n\
    ```\n\n当此代码在 main 方法中运行时，输出结果如下：\n\n- 输入月份数字：1\n天数: 31\n\n- 输入月份数字：2\n天数: 28\n\
    \n- 输入月份数字：3\n天数: 31\n\n- 输入月份数字：4\n天数: 30\n\n- 输入月份数字：5\n天数: 31\n\n- 输入月份数字：6\n\
    天数: 30\n\n- 输入月份数字：7\n天数: 31\n\n- 输入月份数字：8\n天数: 31\n\n- 输入月份数字：9\n天数: 30\n\n-\
    \ 输入月份数字：10\n天数: 31\n\n- 输入月份数字：11\n天数: 30\n\n- 输入月份数字：12\n天数: 31\n\n输出显示 `default`\
    \ 语句被用于检测所有未被任何 case 语句检测到的值。输出还显示，当 `month` 的值为 9、4 或 6 时，前三个 case 语句被**“穿透（fall\
    \ through）”，因此当 `month` 的值为 9、4、6 或 11 时，`days` 的值为 30。\n\n## 2.5 控制代码块的重复\n\n\
    控制代码块的重复可以通过以下方式之一实现：使用计数器重复已知次数的代码块；或者通过评估布尔表达式来决定何时停止重复该代码块。重复代码块的通用要求如下一页的图\
    \ 2.4 所示。\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_33_0.png)\n\n图 2.4 重复代码块的要求\n\
    \n### 2.5.1 计数器控制重复\n\n计数器控制重复的逻辑如图 2.5 所示。\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_33_1.png)\n\
    \n图 2.5 代码块的计数器控制重复\n\n使用计数器是通过 `for` 循环实现的。`for` 循环的通用语法如下：\n\n- for ( 定义并初始化计数器；\n\
    - 计数器的最终值条件；\n- 更新计数器 )\n\n```\n{\n  // 要重复的代码块\n}\n```\n\n通用语法意味着计数器的最终条件值是一个已知值。例如，考虑以下代码段：\n\
    \n```\nfor (int i = 0; i <= someMaxValue; i++) {\n    // 要重复的代码块\n}\n```\n\n如果\
    \ `someMaxValue` 的值为 10，则代码块将执行 11 次。如果代码段修改如下，具有相同的 `someMaxValue`：\n\n```\n\
    for (int i = 0; i < someMaxValue; i++) {\n    // 要重复的代码块\n}\n```\n\n代码块将执行 10\
    \ 次。上述两个代码段的目的是为了说明在控制 `for` 循环执行次数时，初始化和设置计数器的最终值必须小心。\n\n下一页的示例展示了一个 `for` 循环的操作。\n\
    \n![](img/8e21bca3c5638080efd3c1b81bc23762_34_0.png)\n\n`for` 循环的目的是扫描卡片数组以输出存储在每个卡片上的信息。在示例中，持拥卡片数量是已知的：因此，`for`\
    \ 循环是重复所需代码块的明显构造选择。\n\n## 2.5.2 布尔控制重复\n\nJava 两种布尔控制构造用于控制代码块的重复：`while` 循环和\
    \ `do ... while` 循环。\n\n### while 循环\n\n`while` 循环的逻辑如图 2.6 所示。\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_36_0.png)\n\
    \n图 2.6 while 循环的逻辑\n\n图 2.6 意味着如果布尔条件的初始返回值为 `false`，则循环将不执行。相反，如果布尔条件的初始返回值为\
    \ `true`，则循环将重复执行，直到条件最终返回 `false`。`while` 循环的通用语法如下。\n\n```\n// 初始化布尔条件中使用的变量\n\
    while( 条件为真 )\n{\n    // 要重复的语句\n    // 更新条件：最终退出循环\n}\n```\n\n 2.5.1 节的第一个示例可以修改为使用\
    \ `while` 循环，如下一页所示。\n\n"
