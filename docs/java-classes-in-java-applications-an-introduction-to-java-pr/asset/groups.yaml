    # Java: Classes in Java Applications


    # Grouping Classes Together in a Java Application


    At this point, it is worth mentioning that the Java run-time system automatically
    imports the (classes of) the java.lang package contains about 40 classes, widely-used
    ones such as the wrapper classes - Boolean, Character, Double, Integer and so
    on - that are object representations of the primitive data types, as well as classes
    such as System, String and Thread. The rationale for this automatic inclusion
    is that commonly-used classes should be readily available without having to import
    statements for them.


    # 6.5 Using and Accessing Package Members


    We have seen that import statement provides access to one or more members of a
    named package in a class definition. In order to use a public member from outside
    its package, one of the must be:


    +   1. The member must be referred to by its fully-qualified name.

    2. The member must be imported.

    3. The member''s entire package must be imported.


    Referring to a member by its fully-qualified name is required each time the reference
    is used in Java statements, and therefore, it is a satisfactory approach when
    there are relatively few uses. For frequent references, has imported by an import
    statement, it can be referred to in the code by its class name rather than by
    its fully-qualified name.


    However, care be taken when importing members of packages when, for instance,
    there are identically-named classes in them. For example, consider the following
    code snippet:


    ```

    package mynewpackage;

    import currentAccount.Account;

    import savingsAccount.Account;

    ```


    A reference to the type Account in the class definition that follows the package
    statement and import statements would produce a compiler error because the compiler
    will not know which of the two Account classes is being referred to. In such a
    case, the compiler will be to distinguish between the two Account types when their
    fully-qualified name is used in the code even though Account classes have been
    specifically imported.


    When a member''s entire package is imported, any member of that package can be
    referred to by its class name in the subsequent code.


    # 6.5.1 Controlling Access to Package Members


    Let us recall the access levels for the access modifiers listed in Table 3.1;
    the table is reproduced in Table 6.1 on the next page'
