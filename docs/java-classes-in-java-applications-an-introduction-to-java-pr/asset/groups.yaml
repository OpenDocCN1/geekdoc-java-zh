    \ in Java programmes.\n\nDownload free books at BookBoon.com\n\n69\n\n## 4. Errors\
    \ in Java Programmes\n\nWith the best in the world, errors will occur when developing\
    \ applications irrespective of the target language: Java programmes are no exception.\
    \ However, object-oriented programming (OOP) languages such as Java offer a distinct\
    \ advantage over non-OOP languages in the former are able to respond to certain\
    \ errors by creating an object to represent the error. This approach leaves developer\
    \ with the responsibility of processing errors in order to respond to errors occurring\
    \ when an application is running.\n\nThis chapter explains how errors are handled\
    \ in Java programmes; it does not include syntax errors. Syntax errors are caused\
    \ by incorrect use of the Java language on the part of the developer; the compiler\
    \ checks for this category of error and notifies the developer accordingly.\n\n\
    ## 4.1 Categories of Error\n\nA search of the nine chapters reveals the following\
    \ error messages in the discussion of examples:\n\n- ArrayIndexOutOfBoundsException\n\
    - ClassCastException\n\nThese two messages imply that something happened at run-time\
    \ when the example programmes were executed. In fact, both of these error messages\
    \ imply that the developer has made a logic error. Logic errors that occur at\
    \ run-time are usually reflected in the output from the application. Logic errors\
    \ are eliminated by further testing and debugging of the programme at compile\
    \ time.\n\nAt compile time, in the first case, the compiler could not be expected\
    \ to anticipate that an out of bounds array index is being processed at runtime.\
    \ The occurrence of an ArrayIndexOutOfBoundsException should be sufficient information\
    \ for the developer to check the logic of the code that produces such an error.\n\
    \nAt compile time, in the second case, the developer has not obeyed the rules\
    \ for casting object references. Although the code has compiled because the compile-time\
    \ rules have been obeyed, the run-time rules have been broken; again, the nature\
    \ of the error message should be sufficient information for the developer to check\
    \ that the statements that include a cast obey both the compile-time and runtime\
    \ rules of object reference casting as explained in the previous chapter.\n\n\
    In short, the two errors are indicated by the messages\n\n- ArrayIndexOutOfBoundsException\n\
    - ClassCastException\n\nshould have been fixed by the developer at compile time;\
    \ they cannot be recovered from run-time. Given that they were not anticipated\
    \ by the developer, they are easily eliminated by working through and correcting\
    \ the logic of the code that produced the error messages. Working with the logic\
    \ of source code is debugging. Integrated Development Environments (IDEs) usually\
    \ provide a debugging tool that can be used to step through code statement by\
    \ statement.\n\nThere, on the other hand, a number of run-time errors can occur\
    \ when a programme executes that are outside the control of the programme's logic.\
    \ These include, for example, error conditions that are reasonably likely to occur\
    \ in that they have the potential to impair access to data and access to other\
    \ local and networked resources. The kind of error is reasonably likely to occur\
    \ at run-time should be recoverable so that the programme does not terminate.\n\
    \nAnticipating such errors has the potential to occur expected conditions such\
    \ as, for example, detecting the end of a file that is being read by a method.\
    \ In this case, the method that reads the file should include code that detects\
    \ the end of the file so that an ‘end of file’ error does not occur at run-time.\n\
    \nThe inevitable existence of run-time errors raises an important question: how\
    \ does the developer anticipate run-time error conditions? If the developer takes\
    \ an exhaustive position and anticipates all error conditions have the potential\
    \ to occur with all methods, the resulting code is highly likely to be cumbersome\
    \ and almost unusable. On the other hand, if the developer takes an optimistic\
    \ position and does not anticipate many error conditions, the resulting code may\
    \ not be robust enough when the application is released to its users. The answer\
    \ to the question (posed at the beginning of this paragraph) is not a straightforward\
    \ one in that it is easy to decide which errors to anticipate and not to anticipate.\
    \ In practice, the answer lies arriving at a reasonable practical compromise between\
    \ the two positions.\n\n## 4.2 What are Unexpected Error Conditions?\n\nThe two\
    \ error messages listed in Section 4.1 reveal a clue to how unexpected error conditions\
    \ are dealt with in Java programme. A cursory examination of the messages\n\n\
    ```\nArrayIndexOutOfBoundsException\n```\n\nand\n\n```\nClassCastException\n```\n\
    \nreveals that the two compound words have something in common: the word ‘Exception’.\
    \ It is to be hoped that the reader immediately recognises that an Exception is\
    \ a Java class. Therefore an ArrayIndexOutOfBoundsException is a type of Exception\
    \ class. This is indeed the case for the following from the API confirms.\n\n\
    java.lang.\nClass ArrayIndexOutOfBoundsException\n\n```\njava.lang.Object\n  java.lang.Throwable\n\
    \    java.lang.Exception\n      java.lang.RuntimeException\n        java.lang.ArrayIndexOutOfBoundsException\n\
    \          java.lang.ArrayIndexOutOfBoundsException\n```\n\nException objects\
    \ (usually thrown to exceptions) that are subclasses of the RuntimeException class,\
    \ in the case of an ArrayOutBoundException, usually arise as a result of logic\
    \ errors and are the responsibility of the developer to eliminate at compile time.\
    \ This kind of exception is known as an unchecked exception.\n\nThe discussion\
    \ of the two error messages\n\n# ArrayIndexOutOfBoundsException\n\nand\n\n# ClassCastException\n\
    \nimplies that they are both examples of unchecked exceptions.\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_71_0.png)\n\
    \nDownload free books at BookBooN.com.\n\n72\n[/content]\n"
