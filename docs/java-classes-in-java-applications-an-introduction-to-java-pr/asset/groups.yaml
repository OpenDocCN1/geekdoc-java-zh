    \ into a number of packages as suggested by the statements at the head of the\
    \ class definition for the MediaStore class of the mediaStore package as follows:\n\
    \n```java\npackage mediaStore;\nimport java.io.*;\n```\n\nThe first statement\
    \ denotes that the MediaStore class is a member of the mediaStore package. The\
    \ second statement implies that the class requires access to all of the classes\
    \ of the java.io package.\n\nThe next section looks briefly at the use of package\
