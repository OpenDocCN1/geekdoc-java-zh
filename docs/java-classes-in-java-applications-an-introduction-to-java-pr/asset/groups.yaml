    \nmain 的主体并没有尝试捕获 MyException 对象。\n\n## Java: Java应用程序中的类 Java 程序中的错误\n\n输出如下：\n\
    \n输入。第二个数字输入 -99 将终止。\n输入第一个数字：9\n输入第二个数字：0\nquotient 已退出并抛出了 MyException 实例。\n\
    \n```\nMyException: 你正尝试除以零。\nat MyObject.quotient(MyObject.java:9)\nat MyObject.myMethod(MyObject.java:21)\n\
    at TestClassOne.main(TestClassOne.java:27)\n```\n\n运行应用程序的 IDE 表明 main 已异常终止——换句话说，程序崩溃了——因为\
    \ main 没有捕获异常，而仅仅声明了它被抛出。这说明异常必须被调用堆栈中的方法捕获，或者被声明为抛出，而 main 是捕获它们的最后机会。\n\n> 作为一个一般规则，在抛出异常的方法被调用时捕获该异常是一个良好的做法。\n\
    \n本节解释的示例代码和输出表明，运行时系统按方法调用的反向搜索调用堆栈，直到找到设计用于响应抛出异常的 catch 块。当找到 catch 块时，异常会被处理。如果异常在到达\
    \ main 之前被捕获，或者由 main 捕获，程序将不会异常终止；如果 main 不处理它而是声明其抛出，main 将崩溃。\n\n现在我们已经彻底探讨了一个示例，并展示了如何在调用堆栈的不同位置抛出和捕获简单异常\n\
    \nJava: Java应用程序中的类\n\nJava 程序中的错误\n\n## 4.4 try ... catch — finally 块\n\n与上一节讨论的示例相关的代码和输出提供了处理异常的若干实践证据：\n\
    \n- 可能抛出异常的开发者代码包含在 try 块中。\n- 同样，定义为会抛出异常的方法调用应该包含在 try 块中。\n- try 后面跟着一个或多个\
    \ catch 块。\n- 每个 catch 块指定它所捕获的异常类型（即处理器），并包含一个该异常类型的处理器。\n- 在最后一个 catch 块之后，可选的\
    \ finally 块包含始终执行的代码。\n- 当发生异常时，按照 catch 块的顺序搜索相应的处理器。\n- 将 catch 块从特定到通用进行排序是有用的，Exception\
    \ 类对象会在最后一个 catch 块中被捕获，作为任何特定异常未被捕获时的兜底。\n- 如果异常在 try...catch 块中未被捕获，它将传递给堆栈中的下一个方法。\n\
    - 如果异常传递到 main 方法且未被处理，程序将异常终止。\n\nJava: Java应用程序中的类\n\nJava 程序中的错误\n\n## 4.5\
    \ 抛出异常\n\n第 4.3.1 节的示例展示了如何使用以下通用语法由方法抛出异常：\n\n```\npublic void aMethod( ) throws\
    \ AnException {\n\nif ( <condition> )\n{\n\tthrow new AnException();\n}\nelse\
    \ { }\n}\n 方法实现结束\n```\n\n并在下一页所示被调用方法捕获。\n\n"
