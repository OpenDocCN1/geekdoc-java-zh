    \n## 2.6 决定使用哪种结构\n\n在任何特定情况下决定使用哪种结构都是判断问题，当学习者获得实践经验时，这种判断将变得更容易。例如，上一个小节末尾解释的方法实现就是由于在成员数组中查找成员并跳出循环以避免主循环不必要的迭代所需的逻辑。从代码来看，该方法的完整实现是嵌套的\
    \ while 和 for 结构的组合。\n\n在完成对表 2.1 内容的检查之前，有必要提到另一种“嵌套结构中的循环”。\n\n### 2.6.1 嵌套的\
    \ for 循环\n\n我的一位大学同事为参加他 Java 课程的学生们布置了一道极其棘手的练习题。该练习的主要任务是打印日历。从表面上看这似乎是一个简单的练习，但它实际上涉及循环中的循环，通常被称为嵌套\
