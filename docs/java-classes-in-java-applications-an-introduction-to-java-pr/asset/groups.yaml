- md: "\n## 6. Grouping Classes Together in a Java Application\n\nChapter Twelve explains\
    \ how classes and interfaces can be grouped together, using a concept unlike that\
    \ of a generic namespace. Collecting a number of related classes in a single structure\
    \ known as a package makes them easier to manage and avoid potential naming conflicts.\n\
    \n## 6.1 An Introduction to Java Packages\n\nAs an illustration of namespace management,\
    \ assume that a banking application has two classes named Account: one of the\
    \ classes is the definition of a class for current account and the other is for\
    \ a savings account. The name of the two classes can be the same (Account) as\
    \ long as they are placed in separate packages. This is because each package creates\
    \ a new namespace that the types in one package do not conflict with the types\
    \ in another package.\n\nA simple analogy might help the reader to appreciate\
    \ the need to manage class names and their namespaces. The use of packages in\
    \ a Java application is rather like the obvious distinction between a business\
    \ address in Main Street in Freetown and a similar address in Main Street in Freestyle.\n\
    \nTop Ten Records, Main Street, Freetown and Top Ten Records, Main Street, Freestyle.\n\
    \nThe notation for the address of each Top Records store is for the obvious benefit\
    \ to everyone concerned.\n\nThe outcome of placing the classes named Account in\
    \ separate packages means that their unique, fully-qualified names are written\
    \ as follows:\n\n```java\n// refers to the Account class in the package named\n\
    currentAccount\n```\n\nand\n\n```java\nsavingsAccount.Account // refers to the\
    \ Account class in the package named\n```\n\nThe notation used for the fully-qualified\
    \ name of a class means that it can be referred to unambiguously and accessed\
    \ by means of the usual . (dot) selector.\n\n## 6.2 Creating Packages\n\nA version\
    \ of the themed application shown in Figure 6.1 below indicates that classes of\
    \ the application are bundled together in one of two packages depending upon their\
    \ function in the application.\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_107_0.png)\n\
    \nFigure 6.1 The package structure of the themed application\n\nThe two test classes\
    \ – i.e. the ones that include a main method – named TestGui and TestReferences\
    \ are not in a named package and are said to be in the default package of the\
    \ application.\n\nThe package named gui contains a single class MediaStoreGui.\
    \ The statements\n\n```java\npackage gui;               // the class MediaStoreGui\
    \ is in this package\nimport MediaStore.*;    // the class has access to the classes\
    \ contained in the other package of\n                             // the application\n\
    ```\n\nare written before the class declaration and state that the class named\
    \ MediaStoreGui is in the package named gui and that it requires access to all\
    \ of the classes in the package MediaStoreBy virtue of the wildcard ** written\
    \ to the right-hand side of the (dot) statement in the import statement.\n\nThis\
    \ version of the themed has only one class that displays the graphical interface\
    \ (GUI) for the application. Nevertheless, it makes sense to place this class\
    \ in its own package: other versions of the application might contain additional\
    \ classes that are concerned with the display of the GUI and that would be placed\
    \ in the package named gui.\n\nThe import statement is required because components\
    \ of the GUI require access to classes in the MediaStore package to invoke their\
    \ methods and run the application.\n\nThe package named mediaStore contains eight\
    \ classes, each of which begins with the package statement\n\n```java\npackage\
    \ mediaStore;\n```\n\nThe eight classes are bundled together in their own package\
    \ because they represent the business logic of the application. None of these\
    \ classes has any role in the display of the GUI; therefore there is no requirement\
    \ to import the contents of the gui package into the package named mediaStore.\n\
    \nWhile the two classes could have been placed in their own package, this version\
    \ of the themed application is used to illustrate the contents of the default\
    \ package of the application. Both test classes require access to classes in both\
    \ packages, which means that the following import statements appear at the beginning\
    \ of each source code file:\n\n```java\nimport gui.*;\nimport mediaStore.*;\n\
    ```\n\nThere is no package statement at the head of the source code file of the\
    \ two test classes; this means these two classes are automatically placed in the\
    \ default package of the application.\n\nThe version of the themed application\
    \ discussed above illustrates the principal reasons why classes and interfaces\
    \ are bundle in a package; i.e. the types in a package are functionally related\
    \ in the context of an application. A number of other reasons derive from this;\
    \ they are summarised in the box shown on the next page.\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_108_0.png)\n\
    \n| Diversity creating knowledge | PM | Academic Excellence | FOUR | MORITY |\n\
    | :--- | :--- | :--- | :--- | :--- |\n\nReasons why packages are employed in a\
    \ Java application:\n\n- developers can easily determine from the structure of\
    \ an application how application logic is partitioned amongst its packages;\n\
    - developers can easily find related classes in an application;\n- packages in\
    \ the Java API imply that their contents are a collection of related classes (see\
    \ later in this chapter);\n- the names of types in one package won't conflict\
    \ with the same names in another package;\n- types in a package can have unrestricted\
    \ access to one but restricted access to types outside the package (see later\
    \ in this chapter);\n\nThe structure of an application, in terms of its packages,\
