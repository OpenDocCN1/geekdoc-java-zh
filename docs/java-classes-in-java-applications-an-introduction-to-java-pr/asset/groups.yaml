    # Java: Classes in Java Applications


    ## Grouping Classes Together in a Java Application


    At this point, it is worth mentioning that the Java run-time system automatically
    imports the (classes of) the java.lang package which contains about 40 classes,
    widely-used ones such as the wrapper classes - Boolean, Character, Double, Integer
    and so on - that are object representations of the primitive data types, as well
    as classes such as System, String and Thread. The rationale for this automatic
    inclusion is that commonly-used classes should be readily available without having
    to import statements for them.


    ## 6.5 Using and Accessing Package Members


    We have seen that import statement provides access to one or more members of a
    named package in a class definition. In order to use a public member from outside
    its package, one of the must be:


    - 1. The member must be referred to by its fully-qualified name.

    - 2. The member must be imported.

    - 3. The member''s entire package must be imported.


    Referring to a member by its fully-qualified name is required each time the reference
    is used in Java statements, and therefore, it is a satisfactory approach when
    there are relatively few uses. For frequent references, once imported by an import
    statement, it can be referred to in the code by its class name rather than by
    its fully-qualified name.


    However, care be taken when importing members of packages when, for instance,
    there are identically-named classes in them. For example, consider the following
    code snippet:


    ```

    package mynewpackage;

    import currentAccount.Account;

    import savingsAccount.Account;

    ```


    A reference to the type Account in the class definition that follows the package
    statement and import statements would produce a compiler error because the compiler
    will not know which of the two Account classes is being referred to. In such a
    case, the compiler will be to distinguish between the two Account types when their
    fully-qualified name is used in the code even though Account classes have been
    specifically imported.


    When a member''s entire package is imported, any member of that package can be
    referred to by its class name in the subsequent code.


    ### 6.5.1 Controlling Access to Package Members


    Let us recall the access levels for the access modifiers listed in Table 3.1;
    the table is reproduced in Table 6.1 on the next page


    | Modifier | Same Class | Same Package | Subclass | Universe |

    | --- | --- | --- | --- | --- |

    | private | Yes | | | |

    | default: specifier | Yes | Yes | | |

    | protected | Yes | Yes | Yes | |

    | public | Yes | Yes | Yes | Yes |


    Table 6.1 Access levels to class members


    The first row of Table 6.1 reaffirms what we know about the access modifier ''private'':
    i.e. the class has access to its private members as we would expect.


    The second row can be regarded as a class''s package contract whereby if no modifier
    is specified in the same package have access to such members and one another to
    access each other''s members. A class''s package contract can be used to hide
    things as implementation details that are not required to be known to classes
    outside the package. This type of contract means that such details can be changed
    without changing a class''s public contract.


    A class public declares it that it is available to developers using its containing
    package. The fourth row shows that all classes have access to public members,
    regardless of their package and parenting. We will return to the third row in
    due course.


    As we work our way down the ''Modifier'' column from ''private'', ''default''
    (i.e. package level), ''protected'' and ''public'', each of the four access levels
    embraces a wider scope of kind that the class can access that member.


    Let us return to the third row of the table that was first displayed in Chapter
    Nine: the protected contract. The third row indicates level of access is provided
    when a class member is declared to be ''protected''. The first column indicates
    that other members of the class itself have access to the protected member of
    that class; the second column indicates that classes in the same package, regardless
    of their parenting, have access to the protected member; the third column indicates
    that subclasses of the class have access to the protected member, regardless of
    what package they are in. However, the subclass-protected entry requires further
    comment.


    The subclass-protected entry in the table can be stated more precisely: a protected
    member can be accessed from a class via object references that are of the same
    type as the class or one of its subtypes. Despite the apparent clarity of this
    statement, it gives rise to an interesting twist as the following example aims
    to illustrate.


