    \n```java\npublic class TestClass {\n    public static void main(String[] args\
    \ ) {\n        MyOtherClass moc = new MyOtherClass();\n        System.out.println(\"\
    someValue 的值为：\" + moc.someValue);\n    }\n}\n```\n\n执行 main 输出如下。\n\nsomeValue\
    \ 的值为：42\n\n并显示正确的访问方法被 My类继承。\n\n或者，我们可以在扩展类中修改继承的方法，以便对 someValue 执行一些简单的处理，如下所示。\n\
    \n```java\npublic class MyOtherClass extends MyClass {\n    public int getValue()\
    \ {\n        someValue++;\n        return someValue;\n    }\n}\n```\n\n修改后的方法无法编译，因为它尝试访问私有变量。然而，对方法的这种修改可以编译：\n\
    \n```java\npublic class MyOtherClass extends MyClass {\n    public int getValue()\
    \ {\n        int value = 0;\n        // 调用 MyClass 中的 getValue\n        value\
    \ = super.getValue();\n        value = value + 1;\n        return value;\n   \
    \ }\n}\n```\n\nMyObjectClass 和 MyClass 之间的关系是，后者被称为前者的父类，或者反过来看这种关系，前者是后者的子类。编译本节提到的这三个类的\
    \ IDE 在下图中截图中显示了这种关系。\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_48_0.png)\n\n\
    实线和闭合箭头表示 MyObjectClass 是其父类 MyClass 的子类；换句话说，MyObjectClass 与其父类有“是一个”的关系。带箭头的虚线显示\
    \ TestClass 与 MyObjectClass之间有“有一个”的关系，因为 TestClass 在其 main 方法中声明了一个 MyObjectClass\
    \ 类型的局部变量。（根据 UML 图的约定，MyObjectClass 和 TestClass 之间的虚线应该是实线。这是 IDE 不为“有一个”关系绘制直线的特性。）\n\
