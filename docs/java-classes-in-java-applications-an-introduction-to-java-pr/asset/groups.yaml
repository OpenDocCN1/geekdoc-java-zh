    Java Interfaces


    For the purposes of the present discussion, it is not important to know what each
    class in the application does, rather, the reader should note that the figure
    shows MembershipCard inherits from Card and has two subclasses which both implement
    the CardStatus interface.


    In the context of the application shown in Figure 5.1, the following statements
    compile:


    ```java

    // Note: the constructors for MembershipCard, DvdMembershipCard and

    // GameMembershipCard take an integer argument.

    // Instantiate an object whose type is the same as the run-time type.

    Card cardOne = new Card();

    Card cardTwo = new MembershipCard( 10 );

    // Instantiate an object whose type is the superclass of the run-time type.

    CardStatus three = new DvdMembershipCard( 10 );

    // Instantiate an object whose type is the interface implemented the other run-time
    type.

    CardStatus four = new GameMembershipCard( 10 );

    ```


    The third and fourth statements show that when a class variable is declared to
    be an interface type, the variable can be used as a reference to an object that
    implements interface. In other words, the instance can be accessed by a reference
    of the interface type.


    Now that it has been shown - example that interfaces can be declared as class
    types, this raises a question: how can we use an interface as a type?


    ### 5.4.1 The Use of Interfaces as Class Types


    Referring to the example in Section 5.4, let us assume that a substantial amount
