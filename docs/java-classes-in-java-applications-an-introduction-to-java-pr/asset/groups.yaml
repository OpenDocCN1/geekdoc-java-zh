    \n![](img/8e21bca3c5638080efd3c1b81bc23762_95_0.png)\n\nwww.job.oticon.dk\n\n\
    oticon PEOPLE FIRST\n\n# Java: Classes in Java Applications\n\nThe outcome of\
    \ decoupling implementation from method description has profound implications\
    \ for Java. Methods can be published, as in the Java API, so that developers can\
    \ programme to their description without regard to their implementation.\n\nPublishing\
    \ the descriptions of methods of Java classes implies that they can be standardised\
    \ as a client application – i.e. one that invokes methods – can be written in\
    \ the knowledge of the description provided by the server application – i.e. one\
    \ that implements the method.\n\n(There is a category of applications – that are\
    \ outside the scope of this guide – in which the client application calls methods\
    \ across the Internet. The server part of the application publishes to developers\
    \ – the description of methods by the server application so that the developer\
    \ can write Java clients independently of the implementation of the server. This\
    \ category of Internet-based application is a Web service. Web services rely on\
    \ published method descriptions known as interfaces. In the case of a Web service,\
    \ the client and server applications can be written in any language; in fact,\
    \ the client and server do not have to be written in the same language that the\
    \ client is programmed to the server application's interface.)\n\nThe outcome\
    \ of this section is to emphasize the fundamental importance of a method's description\
    \ and leads to the concept of a Java interface.\n\n| A Java interface is a category\
    \ of Java class that includes the description of one or more methods in a collective\
    \ contract that other classes can use. |\n\nClasses that use a Java interface\
    \ are said to implement that interface. Defining and implementing interfaces is\
    \ explained in the next section.\n\n## 5.2 Defining and Implementing a Java Interface\n\
    \nAn interface is similar to a class in it declares members. An interface can\
    \ declare constants and declares methods by their description; there are no method\
    \ bodies. Interfaces cannot be instantiated; they can only be implemented by classes\
    \ or extended by other interfaces.\n\nDefining an interface is similar to declaring\
    \ a class definition. For example, a version of the themed application includes\
    \ the interface shown below.\n\n```java\n/**\n * The Interface CardStatus introduces\
    \ new behaviour to its implementing classes.\n * @author David M. Etheridge.\n\
    \ * @version 1.0, dated 29 November 2008.\n */\npublic interface CardStatus {\n\
    \n    /**\n     * setStatus sets the status of the card to either \"Standard\"\
    \ or \"Premier\" when it is called.\n     * @param status A String to set the\
    \ variable status in the MembershipCard class.\n     */\n    void setStatus(String\
    \ status);\n\n    /**\n     * getStatus returns the value of the attribute status.\n\
    \     * @return The value of the variable status in the MembershipCard class.\n\
    \     */\n    String getStatus();\n\n    /**\n     * setDiscount sets the level\
    \ of discount of the card.\n     * @param discount An integer used to set the\
    \ discount for the card.\n     */\n    void setDiscount(int discount);\n\n   \
    \ /**\n     * getDiscount returns the value of the discount.\n     * @return The\
    \ value of the discount.\n     */\n    int getDiscount();\n\n} // End of interface\
    \ definition.\n```\n\nIt should be noted that method declarations in an interface\
    \ are terminated with a semi-colon and do not require the modifier public.\n\n\
    In this version of the themed application, the MembershipCard class implements\
    \ the CardStatus interface and provides a body for each method declared in the\
    \ interface. If the developer om any of these methods, the compiler issues a warning\
    \ to this effect. A simplified version of the MembershipCard class follows, the\
    \ purpose of which is to show the reader how the interface is implemented by the\
    \ class.\n\n```java\n/**\n * The MembershipCard class implements the methods required\
