- md: "\n## Java: Classes in Java Applications\n### Extending Classes By Means of\
    \ Inheritance\n\nA class method (i.e. a static method) with the same signature\
    \ as a class method in the superclass is said to \"hide\" it. For class methods,\
    \ the runtime system invokes the method defined in the compile-time type of the\
    \ reference on which the method is called; for instance methods, the run-time\
    \ type of the reference on which the method is called. This is illustrated by\
    \ providing the following method in the Student class definition.\n\n```\npublic\
    \ static String getDetails() {\n    return \"I am a student\";\n}\n```\n\nWhen\
    \ the main method shown next is\n\n```java\npublic class TestStudents {\n\n  \
    \  public static void main(String[] args ) {\n        // Create a Student object.\
    \ The variable s is of the Student type, but refers to\n        // a FullTimeStudent\
    \ object (at run-time).\n        Student s = new FullTimeStudent(1234, \"Java\"\
    );\n        // Call the static method of Student.\n        System.out.println(s.getDetails());\n\
    \        // Call an instance method of FullTimeStudent.\n        System.out.println(s.getDegreeCourseCode());\n\
    \    }\n}\n```\n\nThe output is:\n\nI am a student.\nFull-time student is enrolled\
    \ on: course code Java\n\nand illustrates the difference between a method invocation\
    \ on a compile-time type and a run-time type. There is one further rule to state\
    \ concerning class methods at this point: an instance method cannot override a\
    \ static method and a static method cannot hide an instance method.\n\n## 3.3\
    \ Invoking a Parent Class Constructor from a Subclass Constructor\n\nA number\
    \ of examples in previous sections show how the keyword super is used to invoke\
    \ an overridden method. The keyword super is also used to invoke a parent class\
    \ constructor from a constructor of a subclass. In fact, the call to super(< parameter\
    \ list>) must be the first statement of a subclass constructor, as illustrated\
    \ above in the constructor of PartTimeStudent and FullTimeStudent.\n\n## Java:\
    \ Classes in Java Applications\n### Extending Classes by Means of Inheritance\n\
    \nThere are a number of rules that pertain to the call to super( < parameter list\
    \ >):\n\n- it is necessary to initialize all fields of a subclass; therefore its\
    \ constructor must be called;\n- a specific constructor is called as determined\
    \ by the arguments that are passed to the call to super; this is illustrated by\
    \ the first statement in the constructor for FullTimeStudent;\n- if no call to\
    \ super is used in a subclass constructor, the compiler adds an implicit call\
    \ to super() that calls the parent, no argument constructor (which could be its\
    \ default constructor);\n- if the parent defines constructors but does not provide\
    \ a no argument constructor, an error message is issued by the compiler if a call\
    \ to super() is made from a subclass.\n\nGiven these rules, care should be taken\
    \ when calling the correct super constructor from the first statement of a subclass\
    \ constructor.\n\n## 3.4 final and abstract Classes\n\nFigure 3.3 An enhanced\
    \ version of the simple class hierarchy shown in Figure 3.2.\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_56_0.png)\n\
    \n**Figure 3.3** An enhanced version of the simple class hierarchy\n\n## Java:\
    \ Classes in Java Applications\n### Extending Classes By Means of Inheritance\n\
    \nThe Employee class is labelled (by the IDE) as **abstract**. For the purposes\
    \ of this simple example, the Employee class is defined to be **abstract** because\
    \ we do not want to instantiate objects of the **Employee class. Instead, we wish\
    \ to instantiate objects of the *Tutor* class, in other words we wish to populate\
    \ the application with concrete employees, rather than use the abstract and generalised\
    \ notion of an employee. The class definitions for **Employee** is shown next.\n\
    \n```java\npublic abstract class Employee {\n\n    // Declare instance variables.\n\
    \    String department;\n\n    /**\n     * This constructor initialises the variable\
    \ with the identifier department.\n     * @param department the employee's department.\n\
    \     */\n    public Employee(String department) {\n        this.department =\
    \ department;\n    }\n\n    // All subclasses of Employee must implement this\
    \ abstract method.\n    // Note how it is declared.\n    public abstract String\
    \ getDepartment();\n}\n\n// End of class definition.\n```\n\n# Sharp Minds - Bright\
    \ Ideas!\n\nEmployees at FOSS A/S are living proof of the company value - First\
    \ - using new inventions to make dedicated solutions for our customers. With sharp\
    \ minds and functional teamwork, we constantly strive to develop unique products\
    \ - Would you like to join our team?\n\nFOSS works differently than international.\
    \ Innovation and development are as basis for our growth. It is reflected in the\
