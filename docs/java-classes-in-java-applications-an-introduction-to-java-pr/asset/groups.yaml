    \ 否 |\n| protected | 是 | 是 | 是 | 否 |\n| public | 是 | 是 | 是 | 是 |\n\n第一行确认了类本身可以访问\
    \ `private`。第二行表示，如果没有指定修饰符，同一包的类可以访问。第三列表示子类可以访问 `protected`。第四行显示无论如何，所有类都可以访问\
    \ `public` 成员。\n\n虽然表面上看，`protected` 访问级别可能被认为对其他类具有高程度的“保护”，但表格和示例代码显示并非如此。`MySubClass`\
