    In order to explain what inheritance means in the Java language, let us consider\
    \ a very simple example. Suppose that we have a class called MyClass, with the\
    \ following trivial class definition that declares a single member:\n\n```java\n\
    public class MyClass {\n\n    private int someValue;\n}\n```\n\nand suppose that\
    \ we wish to re-use this class and, in doing so, we wish to give the replica a\
    \ different name. To do this, we would write the following class definition:\n\
    \n```java\npublic class MyOtherClass {\n\n    private int someValue;\n}\n```\n\
    \nIn other words, we have re-written the body of MyClass in the class definition\
    \ of MyOtherClass. In our trivial example, the effort of re-writing the body of\
    \ MyClass is minimal in that there only only one member to declare. In the general\
    \ case, on the other hand, the effort of re-writing a large class definition ought\
    \ to be avoidable.\n\nThe concept of inheritance is to OOP languages and avoids\
    \ re-writing code from one class to another. In the example, the replica class\
    \ definition is written as follows, to take advantage of the concept of inheritance\
    \ as it applies in Java.\n\n```java\npublic class MyOtherClass extends MyClass\
    \ {\n    // the variable someValue is inherited and does not have to be declared\
    \ again\n}\n```\n\nThe keyword extends indicates that the class MyOtherClass inherits\
    \ the single member of the class MyClass so that it becomes a members of MyOtherClass.\n\
    \n# Java: Classes in Java Applications Extending Classes by Means of Inheritance\n\
    \nThe use of the keyword extends in the simple example raises a question: what\
    \ is the purpose of replicating MyClass in the guise of MyOtherClass when we simply\
    \ use it as many times as we wish? The answer to this question lies in the fact\
    \ that inherited members can either be modified or left unchanged. This important\
    \ concept means that we can modify an inherited method if we wish and are free\
    \ to leave it (or other) inherited methods unchanged. We can also provide additional\
    \ methods in an extended class.\n\nThe next example enhances the one above to\
    \ illustrate the true value of extending a class.\n\n```java\npublic class MyClass\
