    \ Throw in continuous professional development, and you get truly interesting\
    \ work in a genuinely inspirational business.\n\nTo find out visit www.careersinbritishintelligence.co.uk\n\
    \nApplicants must be British citizens. GCHQ values diversity and welcomes applicants\
    \ from all sectors of the community. We want our workforce to reflect the diversity\
    \ of our work.\n\n## Method Summary\n\n| | | |\n| --- | --- | --- |\n| protected\
    \ Object | clone() <br> Creates and returns a copy of this object. |\n| boolean\
    \ | equals(Object obj) | <br> Indicates whether another object is \"equal\" to\
    \ this one. |\n| protected void | finalize() | <br> Called by the garbage collector\
    \ on an object when garbage collection there are no more references to object.\
    \ |\n| Class<?> | getClass() | <br> Returns the runtime class of this Object.\
    \ |\n| int | hashCode() | <br> Returns a hash code value for the object. |\n|\
    \ String | toString() | <br> Returns a string representation of the object. |\n\
    | void | wait() | <br> Causes the current thread to wait until another thread\
    \ invokes the notify() method or the notifyAll() method for this object. |\n|\
    \ | wait() | <br> is overloaded; not shown here. |\n\nThus, the class declaration\
    \ for MyClass\n\n```java\npublic class MyClass\n```\n\nactually implies\n\n```java\n\
    public class MyClass extends Object\n```\n\nThe extends clause is omitted because\
    \ every Java object inherits from the class Object.\n\nThe next extract from the\
    \ API shows that all classes provided by the Java development environment inherit\
    \ from the class Object.\n\n```\njava.lang.Class Short\njava.lang.Object\n  └java.lang.Number\n\
    \    └Short\n```\n\nThe extract indicates that the class Short is a subclass of\
    \ Number which, in turn, a subclass of Object. Before we move on to explore aspects\
    \ of inheritance in Java closely, let us summarise the principal concepts introduced\
    \ by the discussion in this section.\n\n## Extending Classes by Means of Inheritance\n\
    \n- Inheritance is the ability to create new classes from existing ones;\n- Java\
    \ exhibits single inheritance; i.e. a subclass can have only one superclass;\n\
    - fields and methods are inherited in a subclass;\n- constructors are not inherited;\n\
    - a class Object is at the top of the inheritance tree, as shown by the Java API;\n\
    - all Java classes implicitly inherit methods from its parent class; this is known\
    \ as overriding;\n- an instance method with the same signature and return type\
    \ as a method in the superclass is said to override it;\n- the keyword super is\
    \ used to refer to the members of a superclass, thus an overriding method can\
    \ invoke the overridden method using the keyword super;\n- a method invocation\
    \ does not have to be on a method further up the class hierarchy.\n\n## DIVERSE\
    \ - INNOVATIVE - INTERNATIONAL\n\nCopenhagen Business School is one of the largest\
    \ business schools in Northern Europe with more than 15,000 students from Europe,\
    \ North America and Asia. Are you curious to know how a modern European business\
    \ school competes with diverse, innovative and international study environment?\
    \ Please visit Copenhagen Business School cbs.dk\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_51_0.png)\n\
    ![](img/8e21bca3c5638080efd3c1b81bc23762_51_1.png)\n\n## 3.2 Overriding and Hiding\
    \ Methods in a Subclass\n\nSection 3.1 gives a simple example of overriding a\
    \ method in a subclass. In essence, method overriding is means by which inherited\
    \ behaviour can be modified to suit the specific logic of a subclass, where this\
    \ is derived from the general logic of its superclass. Thus, we can think of the\
    \ superclass comprising members that are inherited and may be modified in each\
    \ subclass as required. Consider the simple hierarchy shown in Figure 3.2 below.\n\
    \n![](img/8e21bca3c5638080efd3c1b81bc23762_52_0.png)\nFigure 3.2 A superclass\
    \ and its subclasses\n\nThe class definitions of the three classes follow on the\
    \ next pages: some of the documentation has been omitted for the sake of brevity.\n\
    \n```java\npublic class Student {\n    // Declare instance variables\n    private\
    \ int idNumber;\n    private String degreeCode;\n    private int yearOfEnrollment\
    \ = 0;\n\n    public Student(int idNumber, String degreeCode) {\n        // Initialise\
    \ the instance variables\n        this.idNumber = idNumber;\n        this.degreeCode\
    \ = degreeCode;\n    }\n\n    public int getIDNumber() {\n        return idNumber;\n\
    \    }\n\n    public String getDegreeCode() {\n        return \"course \" + degreeCode;\n\
    \    }\n\n    public int getYearOfEnrollment() {\n        return yearOfEnrollment;\n\
    \    }\n}\n```\n\n```java\npublic class FullTimeStudent extends Student {\n  \
    \  // Declare instance variables\n    private String fullName;\n\n    public FullTimeStudent(int\
    \ idNumber, String degreeCode) {\n        // Call the constructor for the superclass\n\
    \        super(idNumber, degreeCode);\n    }\n\n    // This method overrides the\
    \ getDegreeCode method in Student; it also calls\n    // the overridden method.\n\
    \    public String getDegreeCode() {\n        return \"This full-time student\
    \ is enrolled on: \" +\n            super.getDegreeCode();\n    }\n}\n```\n\n\
    ```java\npublic class PartTimeStudent extends Student {\n    // Declare instance\
    \ variables\n    private String fullName;\n\n    public PartTimeStudent(int idNumber,\
    \ String degreeCode) {\n        // Call the constructor for the superclass\n \
    \       super(idNumber, degreeCode);\n    }\n\n    // This method overrides the\
    \ getDegreeCode method in Student; it also calls\n    // the overridden method.\n\
    \    public String getDegreeCode() {\n        return \"This part-time student\
    \ is enrolled on: \" \\\n            + super.getDegreeCode();\n    }\n}\n```\n\
    \nAn examination of the source code illustrates how an instance method with the\
    \ same signature and return type in the superclass overrides it. Thus, the method\
    \ getDegreeCode in PartTimeStudent overrides getDegreeCode in Student. The example\
    \ also shows how the keyword super is used to invoke the overridden method in\
    \ the body of the overriding method.\n\n(One of the rules that govern method overriding\
    \ states that an overriding method cannot throw different types of Exception objects\
    \ than the overridden method. We find that such exceptions are handled in the\
    \ next chapter.)\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_54_0.png)\n\nwanted:\
    \ ambitious people\nAt NNE Pharmaplan we need ambitious people to help us achieve\
    \ the challenging goals which have been laid down for the company. Kim V is an\
    \ example of one of our many ambitious co-workers. Besides being a manager in\
    \ the Manufacturing IT department, Kim performs triathlon at a professional level.\n\
    \"NNE Pharmaplan offers me freedom with responsibility as well as the opportunity\
    \ to plan my own time. This enables me to perform triathlon at a competitive level,\
    \ something I would not have the possibility of doing otherwise.\"\n\"By balancing\
    \ my work and personal life, I obtain the energy to perform my best, both at work\
    \ and in triathlon.\"\n\nIf you are ambitious and want to join our world of opportunities,\
    \ go to nnepharmaplan.com\n\n| NNE Pharmaplan | nne pharmaplan |\n| --- | ---\
    \ |\n| NNE Pharmaplan is the world's leading engineering and consultancy company\
    \ focused exclusively on the pharma and biotech industries. | NNE Pharmaplan is\
    \ a company in the Novo Group. |\n"
  mdcn: "\n\n# Java：Java应用程序中的类——通过继承扩展类\n\n本节讨论的简单示例展示了类之间父类到子类的关系。事实上，所有在 Java 中编写的类都隐式地继承自类型为\
    \ `Object` 的类，因此也继承了 `Object` 类的成员。以下来自 API 的提取显示了 `Object` 类的一些成员。\n\n```java\n\
    java.lang\nClass Object\n```\n\n```java\njava.lang.Object\npublic class Object\n\
    ```\n\n`Object` 类是类层次结构的根。每个类都以 `Object` 为父类。所有对象（包括数组）都实现了该类的方法。\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_49_0.png)\n\
    \nIT、互联网与工程领域的学生机会\nCheltenham | 竞争性薪酬 + 福\n\n作为英国情报部门的一部分，我们的职责是应对威胁国家和全球安全的威胁。我们在最具多样性、创造力且技术挑战挑战性的\
    \ IT 文化之一中工作。加上持续的职业发展，你将在一个真正有趣且充满启发性的环境中从事真正精彩的工作。\n\n欲了解更多请访问 www.careersinbritishintelligence.co.uk\n\
    \n申请人必须是英国公民。GCHQ 重视多样性并欢迎来自社区所有领域的申请者。我们希望我们的员工能够反映我们工作的多样性。\n\n## 方法摘要\n\n|\
    \ | | |\n| --- | --- | --- |\n| protected Object | clone() <br> 创建并返回此对象的副本。 |\n\
    | boolean | equals(Object obj) | <br> 表明另一个对象与此对象是否“相等”。 |\n| protected void |\
    \ finalize() | <br> 当垃圾回收时没有指向该对象的引用时，垃圾回收器在对象上调用此方法。 |\n| Class<?> | getClass()\
    \ | <br> 返回此对象的运行时类。 |\n| int | hashCode() | <br> 返回对象的哈希值。 |\n| String | toString()\
    \ | <br> 返回对象的字符串表示。 |\n| void | wait() | <br> 使当前线程等待，直到另一个线程对此对象调用 `notify()`\
    \ 方法或 `notifyAll()` 方法。 |\n| | wait() | <br> 重载方法；此处未显示。 |\n\n因此，`MyClass` 的类声明\n\
    \n\n\n```java\npublic class MyClass\n```\n\n实际上意味着：\n\n```java\npublic class MyClass\
    \ extends Object\n```\n\n省略了 `extends` 子句是因为每个 Java 对象都继承自 `Object` 类。\n\n下一段\
    \ API 提取显示，Java 开发环境提供的所有类都继承自 `Object` 类。\n\n```\njava.lang.Class Short\njava.lang.Object\n\
    \  └java.lang.Number\n    └Short\n```\n\n该片段表明 `Short` 类是 `Number` 的子类，而 `Number`\
    \ 又是 `Object` 的子类。在我们深入探索 Java 继承的方面之前，让我们总结一下本节讨论引入的主要概念。\n\n## 通过继承扩展类\n\n-\
    \ 继承是根据现有类创建新类的能力；\n- Java 采用单继承；即子类只能有一个父类；\n- 字段和方法在子类中被继承；\n- 构造函数不被继承；\n-\
    \ `Object` 类位于继承树的顶端，如 Java API 所示；\n- 所有 Java 类都隐式地继承其父类的方法；这被称为重写（overriding）；\n\
    - 与父类方法具有相同签名和返回类型的实例方法被认为重写了该方法；\n- 关键字 `super` 用于引用父类的成员，因此重写方法可以使用 `super`\
    \ 关键字调用被重写的方法；\n- 方法调用不必在类层次结构中更靠上的方法上。\n\n## 多样化 - 创新 - 国际化\n\n哥本哈根商学院（Copenhagen\
    \ Business School）是欧洲最大的商学院之一，拥有超过 15,000 名来自欧洲、北美和亚洲的学生。你是否好奇一所现代欧洲商学院如何在多样化、创新和国际化的学习环境中竞争的？请访问哥本哈根商学院\
    \ cbs.dk\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_51_0.png)\n![](img/8e21bca3c5638080efd3c1b81bc23762_51_1.png)\n\
    \n## 3.2 子类中方法的重写与隐藏\n\n第 3.1 节给出了在子类中重写方法的简单示例。从本质上说，方法重写是修改继承行为以适应子类特定逻辑的方法，这种逻辑源于其父类的通用逻辑。因此，我们可以认为父类包含了被继承的成员，这些成员可以根据每个子类的需要而进行修改。考虑下方图\
    \ 3.2 所示的简单层次结构。\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_52_0.png)\n图 3.2\
    \ 父类及其子类\n\n这三个类的定义在接下来的页面中：为了简洁，省略了部分文档。\n\n```java\npublic class Student {\n\
    \    // 声明实例变量\n    private int idNumber;\n    private String degreeCode;\n  \
    \  private int yearOfEnrollment = 0;\n\n    public Student(int idNumber, String\
    \ degreeCode) {\n        // 初始化实例变量\n        this.idNumber = idNumber;\n     \
    \   this.degreeCode = degreeCode;\n    }\n\n    public int getIDNumber() {\n \
    \       return idNumber;\n    }\n\n    public String getDegreeCode() {\n     \
    \   return \"course \" + degreeCode;\n    }\n\n    public int getYearOfEnrollment()\
    \ {\n        return yearOfEnrollment;\n    }\n}\n```\n\n```java\npublic class\
    \ FullTimeStudent extends Student {\n    // 声明实例变量\n    private String fullName;\n\
    \n    public FullTimeStudent(int idNumber, String degreeCode) {\n        // 调用父类构造函数\n\
    \        super(idNumber, degreeCode);\n    }\n\n    @Override\n    public String\
    \ getDegreeCode() {\n        return \"This full-time student is enrolled on: \"\
    \ +\n            super.getDegreeCode();\n    }\n}\n```\n\n```java\npublic class\
    \ PartTimeStudent extends Student {\n    // 声明实例变量\n    private String fullName;\n\
    \n    public PartTimeStudent(int idNumber, String degreeCode) {\n        // 调用父类构造函数\n\
    \        super(idNumber, degreeCode);\n    }\n\n    @Override\n    public String\
    \ getDegreeCode() {\n        return \"This part-time student is enrolled on: \"\
    \n            + super.getDegreeCode();\n    }\n}\n```\n\n对源代码的检查说明了与父类方法具有相同签名和返回类型的实例方法重写了它。因此，`PartTimeStudent`\
    \ 中的 `getDegreeCode` 重写了 `Student` 中的 `getDegreeCode`。示例还展示了如何使用 `super` 关键字在重写方法体内调用被重写的方法。\n\
    \n（方法重写的规则之一规定重写方法不能抛出与被重写方法不同类型的异常对象。我们将在下一章处理此类异常。）\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_54_0.png)\n\
    \n寻找心勃的人\n在 NNE Pharmaplan，我们需要有心勃的人来帮助我们实现公司设定的挑战性目标。Kim V 是我们许多心勃同事之一。除了担任制造\
    \ IT 部的经理外，Kim 还以专业水平参加铁三。\n“NNE Pharmaplan 为我提供了自由与责任，以及规划自己时间的机会。这让我能够以竞技水平参加铁三，否则我无法做到这一点。”\n\
    “通过平衡工作和生活，我获得了在工作和铁三中表现最好的能量。”\n\n如果你有心勃并想加入我们的机会世界，请访问 nnepharmaplan.com\n\n\
    | NNE Pharmaplan | nne pharmaplan |\n| --- | --- |\n| NNE Pharmaplan 是专注于制药和生物技术行业的全球领先工程和咨询公司。\
    \ | NNE Pharmaplan 是诺和集团的一家公司。 |\n\n"
