    \nJava: Classes in Java Applications\n\nUsing the Java Application Programming\
    \ Interface\n\n## #1. Using the Java Application Programming Interface\n\nChapter\
    \ One takes examples from the Java Application Programming Interface (API) and\
    \ the themed application in order to emphasise the critical importance of documentation.\
    \ The examples are used to show how documentation is organised in the API and\
    \ how it is inserted into developer's code.\n\n## ##1.1 Documentation in Developer-Written\
    \ Java Classes\n\nPrevious chapters include a number of examples (or partial classes)\
    \ from the themed application, the main purpose of which is to illustrate programming\
    \ concepts. It should not have escaped the notice of the reader that these examples\
    \ often include material other than Java statements, usually in a non-bold font.\
    \ The inclusion of such material raises a question: *what is the purpose of documentation\
    \ is a class definition?*\n\nPerhaps one way to address this question is to consider\
    \ figures 1.1 and 1.2 below.\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_6_0.png)\n\
    \nSource: http://www.cvr-it.com/PM_Jokes.htm\n\n**Figure 1.1** A view of an application\
    \ as explained by the users\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_7_0.png)\n\
    \nSource: http://www.cvr-it.com/PM_Jokes.htm\n\n**Figure 1.2** How the programme\
    \ was documented\n\nWhile it is obvious that the images are meant to be amusing,\
    \ they make a serious point: *there is nothing worse than trying to maintain code\
    \ written by someone else if there is little or no documentation.*\n\nDocumentation\
    \ is an integral part of a Java class in that it is used, inter alia, to explain\
    \ the purpose of members of the class (to the development team) and show consistency\
    \ with the class diagram.\n\n### 1.1.1 Documentation in the Themed Application\n\
    \nThe class diagrams of two of the classes of the themed application are shown\
    \ in the figure on the next page.\n\nJava: Classes in Java Applications\n\nUsing\
    \ the Java Application Programming Interface\n\n| Member |\n| :--- |\n| -firstName:\
    \ string |\n| -lastName: string |\n| -username: string |\n| -password: string\
    \ |\n| -membershipNumber: integer |\n| -card: MembershipCard |\n| -noOfCards:\
    \ integer |\n| +Member(fName, iName, uName, pWord: string ) |\n| +FirstName():\
    \ string |\n| +LastName(): string |\n| +getUsername(): string |\n| +getPassword():\
    \ string |\n| +getMembershipNumber(): integer |\n| +setCard(card: MembershipCard\
    \ ) |\n| +getCard(): MembershipCard |\n| +getNoOfCards(): integer |\n\n| MembershipCard\
    \ |\n| :--- |\n| -noOnLoan: integer |\n| -maxOnMembershipCard(max: integer ) |\n\
    | +getMaxOnLoan(): integer |\n| +getNoOnLoan(): integer |\n\nFigure 1.3 The Member\
    \ and MembershipCard classes of the themed application\n\nThe classes are related\
    \ by a 'has a' relationship, as shown in the next figure.\n\n![](img/8e21bca3c5638080efd3c1b81bc23762_8_0.png)\n\
    \nFigure 1.4 Each Member 'has a' MembershipCard\n\nThe source code for Member\
    \ follows.\n\nDownload free books at BookBoon.com.\n\nJava: Classes in Java Applications\n\
    \nUsing the Java Application Programming Interface\n\n```java\n/**\n* The purpose\
    \ of the Member is\n* @author David Etheridge.\n* @version 1.0, dated 2008.\n\
    \ */\n```\n\n```java\npublic class Member {\n    private String firstName;\n \
    \   private String lastName;\n    private String username;\n    private String\
    \ password;\n    private int membershipNumber;\n    private String noOfCards;\n\
    \    private MembershipCard card;\n```\n\n```java\n/**\n* This constructor is\
    \ used to initialise the first four attributes.\n* @param fName The member's first\
    \ name.\n* @param iName The member's last name.\n* @param uName The member's user\
    \ name.\n* @param pWord The member's password.\n*/\n```\n\nWhere it's\n\nStudent\
    \ and Graduate opportunities in IT & Engineering\nCheltenham |Competitive benefits\n\
    \nPart of the UK's intelligence services, our role is to counter threats that\
    \ compromise national and global security. We work in one of the most diverse,\
    \ creative and technically challenging IT cultures. Throw in continuous professional\
    \ development, and you get truly interesting work, in a genuinely inspirational\
    \ business.\n\nTo find out www.careersinintelligence.co.uk\n\nApplicants must\
    \ be British citizens. GCHQ values diversity and welcomes applicants from all\
    \ of the community. We want our workforce to reflect the diversity of our work.\n\
    \n```java\npublic Member( String fName, String iName, String uName, String pWord\
    \ ) {\n    firstName = fName;\n    lastName = iName;\n    userName = uName;\n\
    \    password = pWord;\n}\n```\n\n```java\n/**\n* Accessor for the attribute firstName.\n\
    * @return firstName The value of the attribute firstName.\n */\npublic String\
    \ getFirstName() {\n    return firstName;\n} // End of definition of getFirstName.\n\
    ```\n\n```java\n/**\n* Accessor for the attribute lastName.\n* @return lastName\
    \ The value of the attribute lastName.\n */\npublic String getLastName() {\n \
    \   return lastName;\n} // End of definition of getLastName.\n```\n\n```java\n\
    /**\n* Accessor for the attribute userName.\n* @return userName The value of the\
    \ attribute userName.\n */\npublic String getUserName() {\n    return userName;\n\
    } // End of definition of getUserName.\n```\n\n```java\n/**\n* Accessor for the\
    \ attribute password.\n* @return password The value of the attribute password.\n\
    \ */\npublic String getPassword() {\n    return password;\n} // End of definition\
    \ of getPassword.\n```\n\n```java\n/**\n* Accessor for the attribute membershipNumber.\n\
    * @return membershipNumber The value of the attribute membershipNumber.\n */\n\
    ```\n"
