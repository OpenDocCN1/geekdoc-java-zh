    ```

    public interface < NameOfInterface extends SuperInterfaces >

    ```


    接口与类不同，它可以在逗号分隔的列表中扩展任意数量的接口。


    ## 5.3 接口作为向类引入行为的手段


    主题应用程序的类似版本对 `MembershipCard` 的类定义修改如下：


    ```

    public class MembershipCard extends Card implements Serializable, CardStatus {

    ```


