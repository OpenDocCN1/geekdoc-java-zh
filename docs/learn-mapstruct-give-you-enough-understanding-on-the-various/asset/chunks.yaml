    # 隐式类型转换


    MapStruct 在大多数情况下会自动处理类型转换。例如，`int` 到 `Long` 的转换。MapStruct 也会处理空值。以下是一些重要的自动转换情况：


    - 基本类型到包装类。

    - 基本类型到 `String`。

    - 枚举类型到 `String`。

    - `Integer` 到 `BigDecimal`。

    - `Calendar` 到 `XMLGregCalendar`。

    - `date` 到 `String`。


