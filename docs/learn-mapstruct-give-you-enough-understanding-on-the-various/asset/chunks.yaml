    # Using default Expression


    Using `Mapstruct` we can pass a computed value using `defaultExpression` in case
    source property is null using `defaultExpression` attribute of `@Mapping` annotation.


    ## Syntax


    ```java

    @Mapping(target = "target-property", source="source-property"

    defaultExpression = "default-value-method")

    ```


    Here


    * `default-value-method` − `target-property` will be set as result of `default-value-method`
    in case `source-property` is null.


    Following example demonstrates the same.


