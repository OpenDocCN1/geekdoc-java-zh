    return id ;

    }


    public void setId ( int id ) {

    this . id = id ;

    }


    public double getPrice () {

    return price ;

    }


    public void setPrice ( double price ) {

    this . price = price ;

    }


    public GregorianCalendar getManufacturingDate () {

