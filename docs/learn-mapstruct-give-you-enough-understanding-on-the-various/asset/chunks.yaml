  trans: "\n\n![](img/Image00001.jpg)\n\n版权所有 版权所有\n\n未经出版者书面许可，不得对本书的任何部分进行复制、存储在检索系统中，或以任何形式或通过任何手段（电子、机械、复印、录制或其他方式）进行传输。\n\
    \n我想将这本书献给将使用这本书的学生们。祝你们未来职业成功，并希望你们永不停学习。\n\n# 目录\n\n- 概述\n- 环境搭建\n- 基础映射\n-\
    \ 自定义映射\n- 映射多个对象\n- 映射嵌套 Bean\n- 映射直接字段\n- 使用生成器\n- 隐式类型转换\n- 使用数字格式化\n- 使用日期格式化\n\
    - 使用表达式\n- 使用常量\n- 使用默认值\n- 使用默认表达式\n- 映射列表\n- 映射 Map\n- 映射 Stream\n- 映射枚举\n-\
    \ 抛出异常\n- 使用自定义映射器\n\n# 概述\n\nMapStruct 是一个插件到 Java 编译器的注解处理器。一旦插件完成后，就可以被 `maven`、`gradle`\
    \ 等命令行工具来处理映射注解，从而在编译时创建映射器类。\n\n## 什么时候需要映射？\n\n在多层应用中，数据对象被用于从数据库获取数据，而 UI 与\
    \ Model 交互。现在，将获取到数据模型中的数据需要映射到 `Model` 或 `java beans` 以传递给 UI。考虑以下情况。\n\n与数据库连接的实体类。\n\
    \n`StudentEntity.java`\n\n```java\n@Entity\nclass StudentEntity {\n    String\
    \ id ;\n    String name ;\n}\n```\n\n与 UI 连接的模型类。\n\n`Student.java`\n\n```java\n\
    class Student {\n    String id ;\n    String name ;\n}\n```\n\n## MapStruct 如何工作？\n\
    \nMapStruct 通过注解自动化创建映射器的过程，用于将数据对象映射到模型对象。它在编译时创建一个映射器实现，这有助于开发者在开发过程中发现错误并使其易于理解。例如——\n\
    \n`StudentMapper.java`\n\n```java\n@Mapper\nclass StudentMapper {\n    StudentMapper\
    \ INSTANCE = Mappers . getMapper ( StudentMapper . class );\n    StudentEntity\
    \ modelToEntity ( Student student );\n}\n```\n\n现在可以使用 `StudentMapper.INSTANCE`\
    \ 轻松地获取映射后的对象。\n\n```java\nStudentEntity studentEntity = StudentMapper.INSTANCE.modelToEntity(student);\n\
    ```\n\n# 环境搭建\n\nMapStruct 是基于 Java 的库，因此第一个要求是在你的机器上安装 JDK。\n\n## 第 1 步 - 安装\
    \ Java 开发包 (JDK)\n\n你可以从 Oracle 的 Java 网站下载最新版本的 SDK —— **Java SE Downloads.**。你将在下载的文件找到安装\
    \ JDK 的说明，按照给定的说明进行安装和配置设置。最后设置 `PATH` 和 `JAVA_HOME` 环境变量指向包含 `java` 和 `javac`\
    \ 的目录，通常分别为 `java_install_dir/bin` 和 `java_install_dir`。\n\n如果你正在运行 Windows 并且\
    \ JDK 安装在 `C:\\jdk-9.0.1`，你将需要在你的 `C:\\autoexec.bat` 文件中放入以下行。\n\n```batch\nset\
    \ PATH=C:\\jdk-9.0.1\\bin;%PATH%\nset JAVA_HOME=C:\\jdk-9.0.1\n```\n\n或者，在 Windows\
    \ NT/2000/XP 上，你将需要右键点击“我的电脑”，选择属性 → 高级 → 环境变量。然后，你必须更新 `PATH` 值并点击确定按钮。\n\n在\
    \ Unix 上，如果你将 JDK 安装在 `/usr/local/jdk-9.0.1` 并且使用 c shell，你将需要在 `.cshrc` 中放入以下内容：\n\
    \n```bash\nsetenv PATH /usr/local/jdk-9.0.1/bin\nsetenv JAVA_HOME /usr/local/jdk-9.0.1\n\
    ```\n\n或者，如果你使用集成开发环境 (IDE) 如 Eclipse、IntelliJ IDEA 或 Sun Studio，你将编译并运行一个简单的程序。\n\
    \n## 第 2 步 - 安装 mapstruct 库\n\n从 Maven 仓库下载 mapstruct 依赖项，并将它们添加到你的类路径中。\n\n-\
    \ `mapstruct-1.3.Final`\n- `mapstruct-processor-1.3.Final`\n\n## 第 3 步 - 设置 IDE\n\
    \n要安装 Eclipse，从 `https://www.eclipse.org/downloads/` 下载最新的 Eclipse。下载后将二进制发行版解压到一个方便的位置。例如，在\
    \ Windows 上通过执行 `C:\\eclipse\\eclipse.exe` 启动。在 Unix (Solaris, Linux) 上，如果一切正常应该显示以下结果：\n\
    \n## 第 4 步 - 创建 Maven 项目\n\n运行以下命令来创建一个 Maven 项目。\n\n```bash\nmvn archetype:generate\
    \ -DgroupId=com.tutorialoint.mapping -DartifactId=mapping -DarchetypeId=maven-archetype-quickstart\
    \ -DinteractiveMode=false\n```\n\n这将创建一个 Maven 项目。现在更新 `pom.xml` 文件如下：\n\n```xml\n\
    <project xmlns=\"http://maven.apache.org/POM/4.0.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \n  xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/maven-v4_0.xsd\"\
    >\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>com.tutorialoint.mapping</groupId>\n\
    \  <artifactId>mapping</artifactId>\n  <packaging>jar</packaging>\n  <version>1.0-SNAPSHOT</version>\n\
    \  <name>mapping</name>\n  <url>http://maven.apache.org</url>\n  <dependencies>\n\
    \    <dependency>\n      <groupId>org.junit.jupiter</groupId>\n      <artifactId>junit-jupiter-engine</artifactId>\n\
    \      <version>5.0.0</version>\n      <scope>test</scope>\n    </dependency>\n\
    \    <dependency>\n      <groupId>org.mapstruct</groupId>\n      <artifactId>mapstruct</artifactId>\n\
    \      <version>1.3.1.Final</version>\n    </dependency>\n  </dependencies>\n\
    \  <build>\n    <plugins>\n      <plugin>\n        <groupId>org.apache.maven.plugins</groupId>\n\
    \        <artifactId>maven-compiler-plugin</artifactId>\n        <version>3.8.1</version>\n\
    \        <configuration>\n          <source>1.9</source>\n          <target>1.9</target>\n\
    \          <annotationProcessorPaths>\n            <path>\n              <groupId>org.mapstruct</groupId>\n\
    \              <artifactId>mapstruct-processor</artifactId>\n              <version>1.3.1.Final</version>\n\
    \            </path>\n          </annotationProcessorPaths>\n        </configuration>\n\
    \      </plugin>\n    </plugins>\n  </build>\n</project>\n```\n\n运行以下命令来更新 Maven\
    \ 依赖并构建项目。\n\n```bash\nmvn package\n```\n\n一旦命令成功。将基于 Maven 的项目导入到 Eclipse 作为\
    \ Maven 项目。其余部分由 Eclipse 处理。\n\n# 基础映射\n\n使用 MapStruct 非常简单。要创建映射器，在接口上使用 `org.mapstruct.Mapper`\
    \ 注解。\n\n```java\n@Mapper\npublic interface StudentMapper {...}\n```\n\n现在在接口中创建一个转换方法。\n\
    \n```java\n@Mapper\npublic interface StudentMapper {\n    Student getModelFromEntity\
    \ ( StudentEntity student );\n}\n```\n"
