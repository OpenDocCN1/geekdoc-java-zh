    # Mapping List


    Using Mapstruct we can map list in similar fashion as we map primitives. To get
    a list of objects, we should provide a mapper method which can map an object.


    ## Syntax


    @Mapper


    public interface CarMapper {


    List<String> getListOfStrings(List<Integer> listOfIntegers);


    List<Car> getCars(List<CarEntity> carEntities);


    Car getModelFromEntity(CarEntity carEntity);


    }


