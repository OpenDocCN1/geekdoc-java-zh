    # Using default Value


    Using Mapstruct we can pass the default value in case source property is null
    using `defaultValue` attribute of `@Mapping` annotation.


    ## Syntax


    `@Mapping(target = "target-property", source="source-property" defaultValue =
    "default-value")`


    Here


    * `default-value` − `target-property` will be set as `default-value` in case `source-property`
    is null.


    Following example demonstrates the same.


    ## Example


