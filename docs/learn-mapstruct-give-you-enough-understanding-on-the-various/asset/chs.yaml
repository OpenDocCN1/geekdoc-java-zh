- "# 学习 MapStruct：通过示例带你深入 MapStruct 的各种功能\n\n\n\n![](img/Image00001.jpg)\n\n\n我想将这本书献给将使用这本书的学生们。祝你们未来职业成功，并希望你们永不停学习。\n\
  \n\n# 概述\n\nMapStruct 是一个插件到 Java 编译器的注解处理器。一旦插件完成后，就可以被 `maven`、`gradle` 等命令行工具来处理映射注解，从而在编译时创建映射器类。\n\
  \n## 什么时候需要映射？\n\n在多层应用中，数据对象被用于从数据库获取数据，而 UI 与 Model 交互。现在，将获取到数据模型中的数据需要映射到 `Model`\
  \ 或 `java beans` 以传递给 UI。考虑以下情况。\n\n与数据库连接的实体类。\n\n`StudentEntity.java`\n\n```java\n\
  @Entity\nclass StudentEntity {\n    String id ;\n    String name ;\n}\n```\n\n与\
  \ UI 连接的模型类。\n\n`Student.java`\n\n```java\nclass Student {\n    String id ;\n  \
  \  String name ;\n}\n```\n\n## MapStruct 如何工作？\n\nMapStruct 通过注解自动化创建映射器的过程，用于将数据对象映射到模型对象。它在编译时创建一个映射器实现，这有助于开发者在开发过程中发现错误并使其易于理解。例如——\n\
  \n`StudentMapper.java`\n\n```java\n@Mapper\nclass StudentMapper {\n    StudentMapper\
  \ INSTANCE = Mappers . getMapper ( StudentMapper . class );\n    StudentEntity modelToEntity\
  \ ( Student student );\n}\n```\n\n现在可以使用 `StudentMapper.INSTANCE` 轻松地获取映射后的对象。\n\
  \n```java\nStudentEntity studentEntity = StudentMapper.INSTANCE.modelToEntity(student);\n\
  ```\n\n# 环境搭建\n\nMapStruct 是基于 Java 的库，因此第一个要求是在你的机器上安装 JDK。\n\n## 第 1 步 - 安装 Java\
  \ 开发包 (JDK)\n\n你可以从 Oracle 的 Java 网站下载最新版本的 SDK —— **Java SE Downloads.**。你将在下载的文件找到安装\
  \ JDK 的说明，按照给定的说明进行安装和配置设置。最后设置 `PATH` 和 `JAVA_HOME` 环境变量指向包含 `java` 和 `javac` 的目录，通常分别为\
  \ `java_install_dir/bin` 和 `java_install_dir`。\n\n如果你正在运行 Windows 并且 JDK 安装在 `C:\\\
  jdk-9.0.1`，你将需要在你的 `C:\\autoexec.bat` 文件中放入以下行。\n\n```batch\nset PATH=C:\\jdk-9.0.1\\\
  bin;%PATH%\nset JAVA_HOME=C:\\jdk-9.0.1\n```\n\n或者，在 Windows NT/2000/XP 上，你将需要右键点击“我的电脑”，选择属性\
  \ → 高级 → 环境变量。然后，你必须更新 `PATH` 值并点击确定按钮。\n\n在 Unix 上，如果你将 JDK 安装在 `/usr/local/jdk-9.0.1`\
  \ 并且使用 c shell，你将需要在 `.cshrc` 中放入以下内容：\n\n```bash\nsetenv PATH /usr/local/jdk-9.0.1/bin\n\
  setenv JAVA_HOME /usr/local/jdk-9.0.1\n```\n\n或者，如果你使用集成开发环境 (IDE) 如 Eclipse、IntelliJ\
  \ IDEA 或 Sun Studio，你将编译并运行一个简单的程序。\n\n## 第 2 步 - 安装 mapstruct 库\n\n从 Maven 仓库下载\
  \ mapstruct 依赖项，并将它们添加到你的类路径中。\n\n- `mapstruct-1.3.Final`\n- `mapstruct-processor-1.3.Final`\n\
  \n## 第 3 步 - 设置 IDE\n\n要安装 Eclipse，从 `https://www.eclipse.org/downloads/` 下载最新的\
  \ Eclipse。下载后将二进制发行版解压到一个方便的位置。例如，在 Windows 上通过执行 `C:\\eclipse\\eclipse.exe` 启动。在\
  \ Unix (Solaris, Linux) 上，如果一切正常应该显示以下结果：\n\n## 第 4 步 - 创建 Maven 项目\n\n运行以下命令来创建一个\
  \ Maven 项目。\n\n```bash\nmvn archetype:generate -DgroupId=com.tutorialoint.mapping\
  \ -DartifactId=mapping -DarchetypeId=maven-archetype-quickstart -DinteractiveMode=false\n\
  ```\n\n这将创建一个 Maven 项目。现在更新 `pom.xml` 文件如下：\n\n```xml\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\"\
  \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n  xsi:schemaLocation=\"\
  http://maven.apache.org/POM/4.0.0 http://maven.apache.org/maven-v4_0.xsd\">\n  <modelVersion>4.0.0</modelVersion>\n\
  \  <groupId>com.tutorialoint.mapping</groupId>\n  <artifactId>mapping</artifactId>\n\
  \  <packaging>jar</packaging>\n  <version>1.0-SNAPSHOT</version>\n  <name>mapping</name>\n\
  \  <url>http://maven.apache.org</url>\n  <dependencies>\n    <dependency>\n    \
  \  <groupId>org.junit.jupiter</groupId>\n      <artifactId>junit-jupiter-engine</artifactId>\n\
  \      <version>5.0.0</version>\n      <scope>test</scope>\n    </dependency>\n\
  \    <dependency>\n      <groupId>org.mapstruct</groupId>\n      <artifactId>mapstruct</artifactId>\n\
  \      <version>1.3.1.Final</version>\n    </dependency>\n  </dependencies>\n  <build>\n\
  \    <plugins>\n      <plugin>\n        <groupId>org.apache.maven.plugins</groupId>\n\
  \        <artifactId>maven-compiler-plugin</artifactId>\n        <version>3.8.1</version>\n\
  \        <configuration>\n          <source>1.9</source>\n          <target>1.9</target>\n\
  \          <annotationProcessorPaths>\n            <path>\n              <groupId>org.mapstruct</groupId>\n\
  \              <artifactId>mapstruct-processor</artifactId>\n              <version>1.3.1.Final</version>\n\
  \            </path>\n          </annotationProcessorPaths>\n        </configuration>\n\
  \      </plugin>\n    </plugins>\n  </build>\n</project>\n```\n\n运行以下命令来更新 Maven\
  \ 依赖并构建项目。\n\n```bash\nmvn package\n```\n\n一旦命令成功。将基于 Maven 的项目导入到 Eclipse 作为 Maven\
  \ 项目。其余部分由 Eclipse 处理。\n\n# 基础映射\n\n使用 MapStruct 非常简单。要创建映射器，在接口上使用 `org.mapstruct.Mapper`\
  \ 注解。\n\n```java\n@Mapper\npublic interface StudentMapper {...}\n```\n\n现在在接口中创建一个转换方法。\n\
  \n```java\n@Mapper\npublic interface StudentMapper {\n    Student getModelFromEntity\
  \ ( StudentEntity student );\n}\n```\n\n\n\n\n如果源对象和目标对象的属性具有相同的名称，这些属性将自动映射。如果属性名称不同，请使用如下\
  \ `@Mapping` 注解 −\n\n```java\n@Mapper\npublic interface StudentMapper {\n    @Mapping\
  \ ( target = \"className\" , source = \"classVal\" )\n    Student getModelFromEntity\
  \ ( StudentEntity student );\n}\n```\n\n在这里，`className` 是 `Student` 中的属性名（目标对象），而\
  \ `classVal` 是 `StudentEntity` 中的属性名（源对象）。\n\n## 示例\n\n在 Eclipse 中打开在 `Environment\
  \ Setup` 章节中创建的项目映射。\n\n使用以下代码创建 `Student.java` −\n\n```java\npackage com . tutorialspoint\
  \ . model ;\n\npublic class Student {\n    private int id ;\n    private String\
  \ name ;\n    private String className ;\n\n    public int getId () {\n        return\
  \ id ;\n    }\n\n    public void setId ( int id ) {\n        this . id = id ;\n\
  \    }\n\n    public String getName () {\n        return name ;\n    }\n\n    public\
  \ void setName ( String name ) {\n        this . name = name ;\n    }\n\n    public\
  \ String getClassName () {\n        return className ;\n    }\n\n    public void\
  \ setClassName ( String className ) {\n        this . className = className ;\n\
  \    }\n}\n```\n\n使用以下代码创建 `StudentEntity.java` −\n\n```java\npackage com . tutorialspoint\
  \ . entity ;\n\npublic class StudentEntity {\n    private int id ;\n    private\
  \ String name ;\n    private String classVal ;\n\n    public int getId () {\n  \
  \      return id ;\n    }\n\n    public void setId ( int id ) {\n        this .\
  \ id = id ;\n    }\n\n    public String getName () {\n        return name ;\n  \
  \  }\n\n    public void setName ( String name ) {\n        this . name = name ;\n\
  \    }\n\n    public String getClassVal () {\n        return classVal ;\n    }\n\
  \n    public void setClassVal ( String classVal ) {\n        this . classVal = classVal\
  \ ;\n    }\n}\n```\n\n使用以下代码创建 `StudentMapper.java` −\n\n```java\npackage com .\
  \ tutorialspoint . mapper ;\n\nimport org . mapstruct . Mapper ;\nimport org . mapstruct\
  \ . Mapping ;\nimport com . tutorialspoint . entity . StudentEntity ;\nimport com\
  \ . tutorialspoint . model . Student ;\n\n@Mapper\npublic interface StudentMapper\
  \ {\n    @Mapping ( target = \"className\" , source = \"classVal\" )\n    Student\
  \ getModelFromEntity ( StudentEntity student );\n\n    @Mapping ( target = \"classVal\"\
  \ , source = \"className\" )\n    StudentEntity getEntityFromModel ( Student student\
  \ );\n}\n```\n\n使用以下代码创建 `StudentMapperTest.java` −\n\n```java\npackage com . tutorialspoint\
  \ . mapping ;\n\nimport static org . junit . jupiter . api . Assertions . assertEquals\
  \ ;\nimport org . junit . jupiter . api . Test ;\nimport org . mapstruct . factory\
  \ . Mappers ;\nimport com . tutorialspoint . entity . StudentEntity ;\nimport com\
  \ . tutorialspoint . mapper . StudentMapper ;\nimport com . tutorialspoint . model\
  \ . Student ;\n\npublic class StudentMapperTest {\n    private StudentMapper studentMapper\
  \ = Mappers . getMapper ( StudentMapper . class );\n\n    @Test\n    public void\
  \ testEntityToModel () {\n        StudentEntity entity = new StudentEntity ();\n\
  \        entity . setClassVal ( \"X\" );\n        entity . setName ( \"John\" );\n\
  \        entity . setId ( 1 );\n        Student model = studentMapper . getModelFromEntity\
  \ ( entity );\n        assertEquals ( entity . getClassVal (), model . getClassName\
  \ ());\n        assertEquals ( entity . getName (), model . getName ());\n     \
  \   assertEquals ( entity . getId (), model . getId ());\n    }\n\n    @Test\n \
  \   public void testModelToEntity () {\n        Student model = new Student ();\n\
  \        model . setId ( 1 );\n        model . setName ( \"John\" );\n        model\
  \ . setClassName ( \"X\" );\n        StudentEntity entity = studentMapper . getEntityFromModel\
  \ ( model );\n        assertEquals ( entity . getClassVal (), model . getClassName\
  \ ());\n        assertEquals ( entity . getName (), model . getName ());\n     \
  \   assertEquals ( entity . getId (), model . getId ());\n    }\n}\n```\n\n运行以下命令来测试映射。\n\
  \n```bash\nmvn clean test\n```\n\n## 输出\n\n一旦命令执行成功，验证输出。\n\n```bash\nmvn clean\
  \ test\n\n[INFO] Scanning for projects...\n...\n[INFO] --- maven-surefire-plugin:2.12.4:test\
  \ (default-test) @ mapping ---\n[INFO] Surefire report directory: \\mvn\\mapping\\\
  target\\surefire-reports\n-------------------------------------------------------\n\
  T E S T S\n-------------------------------------------------------\nRunning com.tutorialspoint.mapping.StudentMapperTest\n\
  Tests run: 2, Failures: 0, Errors: 0, Skipped: 0, Time elapsed: 0.004 sec\n...\n\
  ```\n\n## 自定义映射\n\n我们还可以为使用 `org.mapstruct.Mapper` 注解创建的 Mapper 添加自定义方法。我们也可以创建抽象类而不是接口。Mapstruct\
  \ 会自动创建相应的映射器类。\n\n现在在接口中创建一个默认的转换方法。\n\n```java\n@Mapper\npublic interface StudentMapper\
  \ {\n    default Student getModelFromEntity ( StudentEntity studentEntity ){\n \
  \       Student student = new Student ();\n        student . setId ( studentEntity\
  \ . getId ());\n        student . setName ( studentEntity . getName ());\n     \
  \   student . setClassName ( studentEntity . getClassVal ());\n        return student\
  \ ;\n    }\n}\n```\n\n同样地，我们也可以创建一个抽象类作为映射器。\n\n```java\n@Mapper\npublic absgract\
  \ class StudentMapper {\n    Student getModelFromEntity ( StudentEntity studentEntity\
  \ ){\n        Student student = new Student ();\n        student . setId ( studentEntity\
  \ .getId ());\n        student . setName ( studentEntity . getName ());\n      \
  \  student . setClassName ( studentEntity . getClassVal ());\n        return student\
  \ ;\n    }\n}\n```\n\n\n\n\n\n```java\nmodel.setName ( \"John\" );\n\nmodel.setClassName\
  \ ( \"X\" );\n\nStudentEntity entity = studentMapper.getEntityFromModel ( model\
  \ );\n\nassertEquals ( entity.getClassVal (), model.getClassName ());\n\nassertEquals\
  \ ( entity.getName (), model.getName ());\n\nassertEquals ( entity.getId (), model.getId\
  \ ());\n\n}\n\n}\n```\n\n运行以下命令来测试映射。\n\n```bash\nmvn clean test\n```\n\n## 输出\n\
  \n一旦命令执行成功，验证输出。\n\n```bash\nmvn clean test\n\n[INFO] Scanning for projects...\n\
  \n...\n\n[INFO] --- maven-surefire-plugin:2.12.4:test (default-test) @ mapping ---\n\
  \n[INFO] Surefire report directory: \\mvn\\mapping\\target\\surefire-reports\n\n\
  -------------------------------------------------------\n\nT E S T S\n\n-------------------------------------------------------\n\
  \nRunning com.tutorialspoint.mapping.StudentMapperTest\n\nTests run: 2, Failures:\
  \ 0, Errors: 0, Skipped: 0, Time elapsed: 0.004 sec\n\n...\n```\n\n# 映射多个对象\n\n\
  我们也可以添加映射多个对象的映射。例如，我们想要使用 `Student` 和 `Address` 对象来获取一个 `DeliveryAddress` 对象。\n\
  \n现在创建一个映射接口，它可以将两个对象映射到一个对象。\n\n```java\n@Mapper\n\npublic interface DeliveryAddressMapper\
  \ {\n@Mapping ( source = \"student.name\" , target = \"name\" )\n@Mapping ( source\
  \ = \"address.houseNo\" , target = \"houseNumber\" )\nDeliveryAddress getDeliveryAddress\
  \ ( StudentEntity student , AddressEntity address );\n\n}\n```\n\n## 示例\n\n在 Eclipse\
  \ 中按照`映射多个对象`章节中的更新打开项目映射。\n\n使用以下代码创建 `DeliveryAddress.java` ——\n\nDeliveryAddress.java\n\
  ```java\npackage . tutorialspoint . model ;\n\npublic class DeliveryAddress {\n\
  private String name ;\n\nprivate int houseNumber ;\n\nprivate String city ;\n\n\
  private String state ;\n\npublic String getName () {\nreturn name ;\n}\n\npublic\
  \ void setName ( String name ) {\nthis . name = name ;\n}\n\npublic int getHouseNumber\
  \ () {\nreturn houseNumber ;\n}\n\npublic void setHouseNumber ( int houseNumber\
  \ ) {\nthis . houseNumber = houseNumber ;\n}\n\npublic String getCity () {\nreturn\
  \ city ;\n}\n\npublic void setCity ( String city ) {\nthis . city = city ;\n}\n\n\
  public String getState () {\nreturn state ;\n}\n\npublic void setState ( String\
  \ state ) {\nthis . state = state ;\n}\n\n}\n```\n\n使用以下代码创建 `AddressEntity.java`\
  \ ——\n\nAddressEntity.java\n```java\npackage . tutorialspoint . entity ;\n\npublic\
  \ class AddressEntity {\nprivate int houseNo ;\n\nprivate String city ;\n\nprivate\
  \ String state ;\n\npublic int getHouseNo () {\nreturn houseNo ;\n}\n\npublic void\
  \ setHouseNo ( int houseNo ) {\nthis . houseNo = houseNo ;\n}\n\npublic String getCity\
  \ () {\nreturn city ;\n}\n\npublic void setCity ( String city ) {\nthis . city =\
  \ city ;\n}\n\npublic String getState () {\nreturn state ;\n}\n\npublic void setState\
  \ ( String state ) {\nthis . state = state ;\n}\n\n}\n```\n\n使用以下代码创建 `DeliveryAddressMapper.java`\
  \ ——\n\nDeliveryAddressMapper.java\n```java\npackage . tutorialspoint . mapper ;\n\
  \nimport org . mapstruct . Mapper ;\n\nimport org . mapstruct . Mapping ;\n\nimport\
  \ com . tutorialspoint . entity . AddressEntity ;\n\nimport com . tutorialspoint\
  \ . entity . StudentEntity ;\n\nimport com . tutorialspoint . model . DeliveryAddress\
  \ ;\n\n@Mapper\n\npublic interface DeliveryAddressMapper {\n@Mapping ( source =\
  \ \"student.name\" , target = \"name\" )\n@Mapping ( source = \"address.houseNo\"\
  \ , target = \"houseNumber\" )\nDeliveryAddress getDeliveryAddress ( StudentEntity\
  \ student , AddressEntity address );\n\n}\n```\n\n使用以下代码创建 `DeliveryAddressMapperTest.java`\
  \ ——\n\nDeliveryAddressMapperTest.java\n```java\npackage . tutorialspoint . mapping\
  \ ;\n\nimport static org . junit . jupiter . api . Assertions . assertEquals ;\n\
  \nimport org . junit . jupiter . api . Test ;\n\nimport org . mapstruct . factory\
  \ . Mappers ;\n\nimport com . tutorialspoint . entity . AddressEntity ;\n\nimport\
  \ com . tutorialspoint . entity . StudentEntity ;\n\nimport com . tutorialspoint\
  \ . mapper . DeliveryAddressMapper ;\n\nimport com . tutorialspoint . model . DeliveryAddress\
  \ ;\n\npublic class DeliveryAddressMapperTest {\nprivate DeliveryAddressMapper deliveryAddressMapper\
  \ = Mappers . getMapper ( DeliveryAddressMapper . class );\n\n@Test\n\npublic void\
  \ testEntityToModel () {\nStudentEntity student = new StudentEntity ();\nstudent\
  \ . setClassVal ( \"X\" );\nstudent . setName ( \"John\" );\nstudent . setId ( 1\
  \ );\nAddressEntity address = new AddressEntity ();\naddress . setCity ( \"Y\" );\n\
  address . setState ( \"Z\" );\naddress . setHouseNo ( 1 );\nDeliveryAddress deliveryAddress\
  \ = deliveryAddressMapper . getDeliveryAddress ( student , address );\nassertEquals\
  \ ( deliveryAddress .getName (), student . getName ());\nassertEquals ( deliveryAddress\
  \ .getCity (), address . getCity ());\nassertEquals ( deliveryAddress .getState\
  \ (), address . getState ());\nassertEquals ( deliveryAddress .getHouseNumber (),\
  \ address . getHouseNo ());\n}\n\n}\n```\n\n运行以下命令来测试映射。\n\n```bash\nmvn clean test\n\
  ```\n\n## 输出\n\n一旦命令执行成功，验证输出。\n\n```bash\nmvn clean test\n\n[INFO] Scanning for\
  \ projects...\n\n...\n\n[INFO] --- maven-surefire-plugin:2.12.4:test (default-test)\
  \ @ mapping ---\n\n[INFO] Surefire report directory: \\mvn\\mapping\\target\\surefire-reports\n\
  \n-------------------------------------------------------\n\nT E S T S\n\n-------------------------------------------------------\n\
  \nRunning com.tutorialspoint.mapping.DeliveryAddressMapperTest\n\nTests run: 1,\
  \ Failures: 0, Errors: 0, Skipped: 0, Time elapsed: 0.001 sec\n\nRunning com.tutorialspoint.mapping.StudentMapperTest\n\
  \nTests run: 2, Failures: 0, Errors: 0, Skipped: 0, Time elapsed: 0.001 sec\n\n\
  Results :\n\nTests run: 3, Failures: 0, Errors: 0, Skipped: 0\n```\n\n# 映射嵌套 Bean\n\
  \nMapStruct 处理嵌套映射。例如，一个带有 `Subject` 作为嵌套 Bean 的 `Student`。\n\n现在创建一个映射接口，它可以对嵌套对象进行映射。\n\
  \n```java\n@Mapper\n\npublic interface StudentMapper {\n@Mapping ( target = \"className\"\
  \ , source = \"classVal\" )\n@Mapping ( target = \"subject.name\" , source = \"\
  subject\" )\nStudentEntity getModelFromEntity ( StudentEntity student );\n\n}\n\
  ```\n\n\n\n\n```java\npackage com.tutorialspoint.mapper ;\n\nimport org.mapstruct.Mapper\
  \ ;\nimport org.mapstruct.Mapping ;\nimport com.tutorialspoint.entity.StudentEntity\
  \ ;\nimport com.tutorialspoint.model.Student ;\n\n@Mapper\npublic interface StudentMapper\
  \ {\n\n    @Mapping ( target = \"className\" , source = \"classVal\" )\n    @Mapping\
  \ ( target = \"subject\" , source = \"subject.name\" )\n    Student getModelFromEntity\
  \ ( StudentEntity studentEntity );\n\n    @Mapping ( target = \"classVal\" , source\
  \ = \"className\" )\n    @Mapping ( target = \"subject.name\" , source = \"subject\"\
  \ )\n    StudentEntity getEntityFromModel ( Student student );\n}\n```\n\n使用以下代码更新\
  \ `StudentMapperTest.java`：\n\n```java\nStudentMapperTest.java\n\npackage com.tutorialspoint.mapping\
  \ ;\n\nimport static org.junit.jupiter.api.Assertions.assertEquals ;\nimport org.junit.jupiter.api.Test\
  \ ;\nimport org.mapstruct.factory.Mappers ;\nimport com.tutorialspoint.entity.StudentEntity\
  \ ;\nimport com.tutorialspoint.entity.SubjectEntity ;\nimport com.tutorialspoint.mapper.StudentMapper\
  \ ;\nimport com.tutorialspoint.model.Student ;\n\npublic class StudentMapperTest\
  \ {\n    private StudentMapper studentMapper = Mappers.getMapper ( StudentMapper.class\
  \ );\n\n    @Test\n    public void testEntityToModel () {\n        StudentEntity\
  \ entity = new StudentEntity ();\n        entity.setClassVal ( \"X\" );\n      \
  \  entity.setName ( \"John\" );\n        entity.setId ( 1 );\n        SubjectEntity\
  \ subject = new SubjectEntity ();\n        subject.setName ( \"Computer\" );\n \
  \       entity.setSubject ( subject );\n        Student model = studentMapper.getModelFromEntity\
  \ ( entity );\n        assertEquals ( entity.getClassVal (), model.getClassName\
  \ ());\n        assertEquals ( entity.getName (), model.getName ());\n        assertEquals\
  \ ( entity.getId (), model.getId ());\n        assertEquals ( entity.getSubject\
  \ ().getName (), model.getSubject ());\n    }\n\n    @Test\n    public void testModelToEntity\
  \ () {\n        Student model = new Student ();\n        model.setId ( 1 );\n  \
  \      model.setName ( \"John\" );\n        model.setClassName ( \"X\" );\n    \
  \    model.setSubject ( \"Science\" );\n        StudentEntity entity = studentMapper.getEntityFromModel\
  \ ( model );\n        assertEquals ( entity.getClassVal (), model.getClassName ());\n\
  \        assertEquals ( entity.getName (), model.getName ());\n        assertEquals\
  \ ( entity.getId (), model.getId ());\n        assertEquals ( entity.getSubject\
  \ ().getName (), model.getSubject ());\n    }\n}\n```\n\n运行以下命令来测试映射。\n\n```bash\n\
  mvn clean test\n```\n\n## 输出\n\n一旦命令执行成功，请验证输出。\n\n```bash\nmvn clean test\n```\n\
  \n```text\n[INFO] Scanning for projects...\n...\n[INFO] --- maven-surefire-plugin:2.12.4:test\
  \ (default-test) @ mapping ---\n[INFO] Surefire report directory: \\mvn\\mapping\\\
  target\\surefire-reports\n-------------------------------------------------------\n\
