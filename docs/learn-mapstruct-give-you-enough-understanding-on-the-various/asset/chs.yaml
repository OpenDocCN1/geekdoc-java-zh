  \ 跳过: 0\n\n...\n\n# 映射枚举 (Mapping Enum)\n\nMapstruct 自动映射枚举。同名的枚举会被自动映射。在名称不同的情况下，我们可以使用\
  \ `@ValueMapping` 注解来进行映射。\n\n## 语法\n\n```java\n@Mapper\n\npublic interface UtilityMapper\
  \ {\n\n@ValueMapping(source = \"EXTRA\", target = \"SPECIAL\")\n\nPlacedOrderType\
  \ getEnum(OrderType order);\n\n}\n```\n\n接下来的示例演示了相同的操作。\n\n## 示例\n\n在 Eclipse 中按照\
  \ **映射流（Mapping Stream）** 章节中更新的那样打开 mapping 项目。\n\n使用以下代码更新 `UtilityMapper.java`\
  \ −\n\n```java\nUtilityMapper.java\npackage com . tutorialspoint . mapper ;\n\n\
  import java . util . GregorianCalendar ;\n\nimport java . util . Map ;\n\nimport\
  \ java . util . stream . Stream ;\nimport org . mapstruct . MapMapping ;\n\nimport\
  \ org . mapstruct . Mapper ;\nimport org . mapstruct . ValueMapping ;\nimport com\
  \ . tutorialspoint . enums . OrderType ;\n\nimport com . tutorialspoint . enums\
  \ . PlacedOrderType ;\n\n@Mapper\npublic interface UtilityMapper {\n\n@MapMapping\
  \ ( valueDateFormat = \"dd.MM.yyyy\" )\nMap < String , String > getMap ( Map < Long\
  \ , GregorianCalendar > source );\n\nStream < String > getStream ( Stream < Integer\
  \ > source );\n\n@ValueMapping ( source = \"EXTRA\" , target = \"SPECIAL\" )\nPlacedOrderType\
  \ getEnum ( OrderType order );\n\n}\n```\n\n使用以下代码更新 `UtilityMapperTest.java` −\n\
