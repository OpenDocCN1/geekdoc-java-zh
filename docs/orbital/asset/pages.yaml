  md: 'and flywheel simulate gravity. Her lean, firm limbs have no definition, no
    matter how you push and press and pedal for these two hours in the gym still there
    are twenty-two more hours every day in which the body has no force to work against.
    Next to her Pietro is harness to the US treadmill, listening to Duke Ellington
    with his eyes closed; here in his head are the wild wint meadows of Emilia-Romagna.
    Chie, in the next module, on the bike with her teeth clenched and the resistance
    up high, counting out the cadence of her pedalling.


    Up in microgravity you''re a seabird on a warm day drifting, just drifting. What
    use are biceps, calves, strong bones; what use muscle mass? Legs are a thing of
    the past. But every day the six of them have to fight this until to dissipate.
    They retreat inside their headphones and press weights and cycle nowhere at twenty-three
    times the speed of sound on a bike that has no seat or handlebars, a set of pedals
    attached to a rig, and run eight miles inside a slick metal module with a close-view
    of a turning planet.


    Sometimes they wish for a cold stiff wind, gustery rain, autumn leaves, reddened
    fingers, muddy legs, a curious dog, a startled rabbit, a leaping sudden deer,
    a puddle in a pothole soaked feet, a slight hill, a fellow runner a shaft of sun.
    Sometimes they succumb to the eventful windless humming of their sealed spacecraft.
    While they run, while they cycle, while they push and press, the continents and
    oceans fall away beneath – the lavender Arctic, the eastern tip of Russia vanishing
    behind, storms strengthening over the Pacific, the desert– and mountain-created
    deserts of Chad, southern Russia and Mongolia and the Pacific once more.


    Anyone in Mongolia or those easternmost wildernesses of Russia, or at least who
    knows about such things, would be aware that now, in their cold afternoon sky,
    higher than any airplane, a spacecraft is passing and that some human is there
    hefting a lift-bar with her legs, willing her muscles not to give in to the seduction
    of weightlessness, nor bones to birdness. Else that poor spacefarer will be in
    all kinds of trouble when she lands back on earth where legs, once more, are very
    much a thing. Without that hefting and sweating and pressing she would survive
    the blazing heat and tumble of her re-entry only to be pulled from her capsule
    and fold like a paper crane.'
