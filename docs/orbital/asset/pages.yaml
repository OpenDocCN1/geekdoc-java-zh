  md: 'It’s almost five in the morning Roman knows in this light band of pre-alarm
    sleep that they’ll be circling somewhere near Turkmenistan, Uzbekistan, which
    means south-western Russia will be distant portside, that outlying hook between
    the Black and Caspian Seas. Overnight the cities have been laid down in the season’s
    first fine snow — Samara and Tolyatti over the gorged banks of the Volga, a black
    snake hulking through white.


    It’s as if each orbit is encoded into him. He’s been here almost half a year and
    he knows the paths they take over the earth, the procession of orbits, their repeating
    patterns. Even in sleep he’s remotely aware of the sun glinting off the gold domes
    of Tolyatti’s cathedral – a flash of light that seems to appear from nothing.
    A little way soft triangular shape of Volograd, which they see from above when
    they fly from Star City to Kazakhstan for their launch; when you see Volograd
    from the plane you know you’re near the Kazakhstan border and leaving Russia and
    everything everyone behind.


    The crack that appeared outside gives a centimet or two. It sends fissures that
    broadly echo an aerial map of the concurring Volga River. It’s not so far from
    Roman’s head, this crack, on the other side of the thin alloy shell, and no patching
    with epoxy and Kapton tape is going to hold it. The pressure in the Russian module
    drops just a fraction, barely noticeable, not enough to sound any alarm, and the
    clocks count themselves around towards waking time and the onset of another blitzed
    and man-made day.


    When you’ve moved along the length of the spaceship to its aft, through hatches
    that get ever smaller and modules that get ever old, and you come here to the
    depict Soviet bunker right at the end where Anton and Roman sleep, then you see
    the table littered from dinner (a bad habit of this crew to leave their clearing
    to the next day) – there are some spoons fastened with Velcro, and fastened to
    them empty vacuum-packed sachets of olives, the sachets stuffed with napkins that
    are splattered with borsch, there are four idling spinning crumbs of honeycomb
    that have been caught for now in an equilibrium of forces between the module’s
    air vents which push one way and the spacecraft’s air vents that pull the other,
    and below where they float there are some unopened packets of bread cubes pegged
    to the wall.'
