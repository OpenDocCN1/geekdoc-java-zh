    and calamitous ruin that can''t yet be measured. Away from the planet held by
    humans, a giant turning slightly on its canting orbit, away into virgin up-sale
    wilderness, this new black gold, this new domain for the taking. Through their
    quarter-of-a-million-mile of space.


    Here Anton, Roman, Chie, Shaun and Pietro in tubular modules are daily pelted
    and pitted with dents. They hang like baits in their quarters. Anton wakes briefly
    with his fist in his cheek. His first and only thought is of the spacecraft on
    its way to the moon, accompanied by one piercing feeling of childhood joy which
    pops like a bubble as he drops back to sleep. On Pietro''s monitor that'' fastened
    to the rigging near his head, a message has come up in silence from his wife with
    a link to a news story about the terrible destruction of the typhoon, which will
    stay there until morning. An unread message on Shaun''s screen too, a video of
    a goat jumping on a trampoline, from his daughter, with no exception exceptILY!


    The modules are dark and shattered. The robotic workstation, the resistance trainer,
    the computers with their timelines of work for the following day that are being
    uploaded now from the ground; the cameras and microscopes, the piles of cargo
    bags, the experiment gloveboxes, the bio-product lab and its module of mice, the
    pond where their bags of water are stowed, Anton’s cabbages and peas shoots, the
    suits in the airlock, nodding crudely human puppets off the burnt smell of space.'
