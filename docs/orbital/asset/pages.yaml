  md: '# Orbit 1, into orbit


    You aren''t even the farthest-flung humans now, says ground control. How does
    that feel?


    For a crew of four is on its way to the moon and has just surpassed the space
    station''s shallow orbiting distance of two hundred and fifty miles above the
    planet. The lunar astronauts are catapulted them in a five-billion-dollar blaze
    of suited-booted glory.


    For the first time you''ve been overtaken, say ground control. You''re yesterday''s
    news, you joke, and Pietro jokes back that better yesterday''s news than tomorrow''s,
    if they know what he means. If you''re an astronaut you''d rather not be news.
    And here''s the thing, thinks Chie, her mother''s down there on earth. Everything
    that''s left of her mother''s down there. Better to be lassoing it like this than
    watching it disappear in the rear-view mirror. Anton just looks out of the space-viewing
    portal to where he knows the constellations of Pegasus and Andromeda to be, though
    his vision can''. He''s tired. Doesn''t sleep that well here, mind too constantly
    jet-lagged and staggered. There''s Saturn, there''s the aeroplane of Aquila. The
    moon''s a stone''s throw. One day, he''ll, get there.


    Mornings, a surge of sweat and breath and effort, weights and bike and treadmill,
    the two hours a day when their bodies are not suspended and are instead forced
    to comply with gravity. In the Russian segment of the craft, Anton on the bike
    shaking off what sleep he had, Roman on the treadmill. Three modules away in the
    non-Russian segment there''s Nell on the bench press watching his muscles work
    under a sheen of sweat while'
