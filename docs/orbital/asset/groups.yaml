    Russian had been to the moon, that there was no flag and no Korovka. Nor can he
    remember when he decided that, nevertheless, he would make one part of his father''s
    stories true: he would go there. He told his wife that he would. He told her with
    utmost certainty and with pre-emptive pride and a swelling sense of national and
    personal and husbandly and later fatherly duty; he would go there, the first Russian,
    but not the last. Many years ago that was, that he told her all.


