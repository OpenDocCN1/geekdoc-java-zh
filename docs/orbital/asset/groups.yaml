    她说，那七位在“挑战者号”上去世的宇航员，我对他们的生活了如指掌，一切。


    肖恩从塑料咖啡杯口吸着水——很滑稽，就像在用玩具浇水壶喝水。


    她说，我当时才七岁。我的墙上贴着他们的照片，那批机组成员。在他们生日那天，我会点蜡烛，不知道大概过了三年后。肖恩说：“你点过？”


    我点过。


    好。


    我我在想，我父亲从未试图阻止过这种行为。


    肖恩缓慢地赞同着点头，咀嚼着，在脑海中处理着这个孩子为死的宇航员点蜡烛的画面；点蜡烛，此为止，老天爷。但是为了宇航员。不过又为什么不能呢；他以前经常在房间周围布置光纤陷阱来防止妹妹闯入。孩子都有自己的办法。


    我感到很惊恐，内尔说。我很惊恐他们就在那里，然后就在七十秒内消失了。消失了。


    我的意思是，当然，肖恩说。


    在七十秒内，消失了。


    在全世界的注视下，他说。孩子们也在注视。


    每个人都在看，每个人——，内尔停住了，仿佛她站在悬崖边缘。当我还是孩子时，那个念头就再也没有停止过睡眠，她说。关于一切转变得有多之快的想法。还有我父亲，让我继续说。蜡烛能驱散恶魔，他曾这样说过，以此来安慰我——这就是为什么当你想念某人时要点蜡烛，让恶魔远离他们。我父亲很少说些荒唐的话，但那确实是荒唐的。当你身处一个碎成五千块碎片的航天飞机舱内，当你的舱室以每数百英里的速度坠落十二英里并在海洋中破碎时，防恶魔的保护有什么用呢？如果真有恶魔，它们难道不是已经行动了吗？


    她清楚地记得这一切；在厨房橱子里找到一些生日蜡烛和烛台，把它们插在橡皮泥里，好几个小时都不敢划火，知道自己不被允许用这些东西，觉得它们会发生危险的事，也许会在她手里爆炸。


    肖恩没有回答，但那语气并没有轻蔑之。他似乎在思考。她也是。思考着一个月后，当残骸和宇航员的遗体从海底被打捞起来时她是如何哭的，以及在甚至无法理解的悲痛中，她是如何沉溺于一种执念的。她父亲认为她现在仍在埋葬它。


    在刹那，肖恩在想，我到底在这里干什么，在一个真空的铁罐头里？一个铁罐头里的罐头人。距离死亡只有四英寸钛钛。不仅仅是死亡，而是彻底的虚无。


    你为什么要这么做？试图在一个永远无法繁荣的地方生存？试图去往一个宇宙并不想要你的地方，而明明有一个完美的地球在接纳你。他从不确定人类对太空的渴望好奇还是不知报。这种奇异的渴望是让他成为了英雄还是白痴。无疑，是介于两者之间的那么一点点。


    这些念头撞在墙上，消失了。它们重生为一种突然的忧虑，这是今天第一百次了，为了那些灵魂，他的同事和朋友，在前往月球的途中。


    “带上她吧，”他的妻子曾说过，“如果你在上面丧生了，你身上的数百万个碎片将环绕地球；这是个好主意，不是吗？”并带着同谋般的微笑。并像往常那样摸了摸他的耳垂。


    “嘿，小鼠们，”智低声说，“嘿。”


    她从实验架上取下一个单元，滑出一个模块，里面的老鼠盖住身体试图夺回。她用手指把它捏起来。在她周围，空间站的无线电像涨水的溪流一样涌动着，现在是下午，美国已经醒了。涌动着关于月球的讨论。第一位登上月球女性宇航员，人类历史上伟大的跨越。


    有五组每组八只老鼠——那些未被科学之手触碰过的（除了把它们送这里的火箭外）；那些定期注射以防止肌肉萎缩的鼠；以及那些出生就经过改造、肥壮且适应无重力生活的鼠。


    第一到第三组的未受触碰的老鼠每天都在萎缩。自从它们乘坐补给船到达这一周以来，它们的灵魂仿佛坍塌了。它们的黑眼睛在萎缩的身体里凸出；它们的脚大而无用，让它们看起来像某种变异且未进化的生物。


    第四组注射了诱饵受体的老鼠更大、更强壮。智逐一地把它们拎出来，拇指用力按住它们的后脑，这样一来它们就知道不要挣扎，只能僵结；它们盯着某个无法揣测的东西。甚至它们折叠的蝙蝠耳朵也不动。她的另一只拇指轻轻按下注射器。松开后，每只老鼠都从她的手中流回笼子里。


    然而，第五组的改造老鼠更大胆，仿佛它们通过本能知道膨胀的身体赋予了它们更大的优势和力量。当她伸手对她的手感兴趣时，它们的食物棒向前送并吱叫，那比它们本身大不了多少。而那些肌肉萎缩的未处理老鼠，像掌中的梅子一样。她把嘴贴在它们耳。“对不起，”她低声说，“但你们没有一个是活着的。不管是小小的，还是大大的。你们都完蛋了。我很抱歉告诉你们。”


    老鼠对这个消息表现出某种程度的镇定。“你们必须是这样，”她说，“永远保持冷静。”她用拇指滑过尖锐的脊椎。她会想念母亲的挑骨仪式，当他们从灰烬中寻找火化后幸存的骨碎片。想念那个将是最难的。（等，让我重新检查一下“bone-picking”的OCR，它可能是“骨-挑选”或“骨-选择”。考虑到上下文，“骨-picking”似乎是不可能的，除非它是一处明显的拼错误。根据原文的“bone-picking”……“尺骨”或“桡”——这些是解剖学术语。）重新读一遍：“她会想念母亲的挑骨仪式，当他们从灰烬中寻找火化后幸存的骨碎片。想念那个将是最难的。”


    - 第一-三组的未受触碰的老鼠每天都在萎缩……


