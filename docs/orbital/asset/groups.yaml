    时光已久，在12月5日，多细胞生命降临，红色的、褐色的，最后是绿色藻类在阳光照射的浅水中散发着无尽的荧光；12月20日，植物走上了陆地，地衣和苔藓，无茎无根，但紧随其后仅在几千年后，维管植物出现了——草类、蕨类、仙人掌、树木，地球完好的土壤现在被根系蜿蜒缠绕和开采，被掠夺的水分很快被云层重新补充，生长与腐烂的循环系统再次开启，为了水和光、为了高度、为了呼吸、为了绿色和色彩而进行竞争性的挤撞和推搡。


    圣诞节到了，尽管基督尚未出生——那是0.23亿年前，而恐龙来了，在灭绝前经历了五年的光辉，直到灭绝消灭了它们，或者至少消灭了那些陆地生物，那些迟钝者和食树者；在它们的缺席处出现了一个空位：招募——陆地生命形式，不接受时间浪费者，请申请。而谁来申请呢？是哺乳动物，它们在新年夜夕的下午很快进化成了最具有投机性且狡猾的形式：火的点燃者、石块的黑客、铁的熔化者、土地的耕耘者、神的崇拜者、时间的记录者、船只的航员、鞋子的穿着者、谷物的商人、土地的发现者、系统的策划者、音乐的编织者、歌曲的歌手、颜料的调配者、书籍的装订者、数字的计算、箭的发射者、原子的观察者、身体的装饰者、药片的吞噬者、头发的分割者、头的抓挠者、思维的主、万物的掠食者、与死亡争论者、过度的爱者、爱的过剩、被爱困扰、爱的亏欠、对爱的匮乏、对爱的渴望、对渴望之爱，这种双足的生物，人类。佛陀在午夜前六秒到来，半秒后是印度神，另一个半秒是基督，一秒半后是真真拉。


    在宇宙年工业化的尾声中，法西斯主义、内燃机、奥古斯托·皮诺切特、尼古拉·特斯拉、弗里达·卡洛、马拉拉·优萨夫莱、亚历山大·汉密尔顿、维夫·里查兹、幸运·卢西安诺、阿达·洛芙莱斯、众筹、分裂原子、冥王星、超现实主义、塑料、爱因斯坦、乔·福、坐牛、贝特丽克斯·波特、英迪拉·甘迪、波尔、龙骑珍、鲍勃·迪伦、随机访问内存、足球、石灰粉、日俄战争、可可·香儿、抗生素、哈利法塔、比莉·假日、戈尔达·梅尔、伊戈尔·斯特文斯基、披萨、保温瓶、古巴导弹危机、三十届夏季奥运和二十四届冬季奥、葛饰北斋、巴沙尔·阿萨德、Lady
    Gaga、埃里克·萨蒂、拳阿里、深政府、世界大战、网络、钢铁、晶体管、科索沃、茶包、W.B. 叶慈、暗物质、牛仔裤、交易所、阿拉伯之春、弗吉尼亚·伍尔夫、阿尔贝托·贾科梅蒂、尤塞因·博尔特、约翰尼·卡什、避孕、冷冻、弹簧床、希格斯玻子、动态影像、象棋。


    当然，宇宙并没有在午夜时分结束。时间按照它惯常的虚无主义运行，割了我们所有人，对我们生活的偏好无动于衷，将我们击倒。在另一个千年后，地球上的生物已变成了外骨骼-机械-机-不死的后人类，他们利用了某些更快乐的恒星的能量，并正在枯竭。


    如果宇宙日历包含了所有时间（其中大部分尚未发生），那么在两个月内，任何事情都可能发生在冰凉的大理石地球，从生命的角度来看，这些都没有希望——一颗流星可能会将整个太阳系同地球一起抛出去，陨石撞击可能导致大灭绝，地球倾角可能会增加，轨道的弯曲和漂移最终可能弹出某些行星；而在所有情况下，大约还有四个月（五十亿年），太阳将耗尽燃料，膨变成红矮星并吞噬水星和金星。地球如果幸存，也将变得焦枯干旱，海洋被煮干，成为一颗留在白矮星、黑矮星、死太阳永恒轨道上的灰烬，直到整场戏结束，轨道衰减，太阳将我们吞噬。


