  - '[PAGE 101]


    long time yet, and on December 5th came multicellular life, red, brown and then
    finally green algae spawned in boundless fluorescence in the shallows of sunlit
    water, and on December 20th plants found their way to the land, liverworts and
    mosses, stemless and rootless but nevertheless, then hot on their heels only thousands
    of years later the vascular plants, grasses, ferns, cacti, trees, the earth’s
    unbroken soil now root-snaked and tapped, plundered of moisture soon restocked
    by the clouds, looping systems of growth and rotting again, competitive barging
    and elbowing for water and light, height, for breath, for greenness and colour.


    Christmas Day, though Christ’s not yet born – 0.23 billion years ago, and here
    come the dinosaurs for their five years of glory before the extinction that wiped
    them out, or wiped out at least landlubanning ones, the plodders and tree-munchers,
    and in their absence a vacant spot: Wanted – land-dwelling life forms, no time-wasters,
    apply within, and who should apply the mammalian things, who quicksharp by-afternoon
    on New Year’s Eve have evolved into their most opportunistic and crafty form,
    the igniters of fire, the hackers in stone, the melters of iron, the ploughers
    of earth, the worshippers of gods, the tellers of time, the sailors of ships,
    the wearers of shoes, the traders of grain, the discoverers of lands, the schemers
    of systems, the weavers of music, the singers of song, the mixers of paint, the
    binders of books, the crunchers of numbers, the slingers of arrows, the observers
    of atoms, the adorners of bodies, the gobblers of pills, the splitters of hairs,
    the scratchers of heads, the owners of minds, the losers of minds, the predators
    of everything, the arguers with death, the lovers of excess, the excess of love,
    the addled with love, the deficit of love, the lacking for love, the long for
    love, the love of longing, the two-legged thing, the human being. Buddha came
    at six seconds to midnight, half a second later the Hindu gods, in another half-second
    came Christ and a second and a half later Allah.


    In the inline closing of the cosmic year’s industrialisation, fascism, the combustion
    engine, Augusto Pinochet, Nikola Tesla, Frida Kahlo, Malala Yousafzai, Alexander
    Hamilton, Viv Richards, Lucky Luciano, Ada Lovelace, crowdfunding, the split atom,
    Pluto, surrealism, plastic, Einstein,'
  - '[PAGE 102]


    FloJo, Sitting Bull, Beatrix Potter, Indira Gandhi, Bohr, Calamity Jane, Bob Dylan,
    Random Access Memory, soccer, pebble-dash, the Russo-Japanese War, Coco Chanel,
    antibiotics, the Burj Khalifa, Billie Holiday, Golda Meir, Igor Stravinsky, pizza,


    Thermos flasks, the Cuban Missile Crisis, thirty summer Olympics and twenty-four
    winter, Katsushaka Hokusai, Bashar Assad, Lady Gaga, Erik Satie, Muhammad Ali,
    the deep state, the world wars, cyberspace, steel, transistors, Kosovo, teabags,
    W. B. Yeats, dark matter, jeans, the stock exchange, the Arab Spring, Virginia
    Woolf, Alberto Giacometti, Usain Bolt, Johnny Cash, birth control, frozen food,
    the sprung mattress, the Higgs boson, the moving image, chess.


    Except of course the universe doesn’t end at the stroke of midnight. Time moves
    on its usual nihilism, mows us all down, jaw-dropping insensate to our preference
    for living, Guns us down. In another split millennia will pass and the beings
    on earth have become exoskeletal-cybernetic-machine-deathless-postbeings who''ve
    harnessed the energy of some happier star and areizzling dry.


    If the cosmic calendar is in all of time, most of which has not yet occurred,
    in another two months any number of things could have happened to the cool marble
    of earth and none of them promising from a life point of view — a wandering star
    could throw the whole solar system out and earth with it, a meteor strike could
    cause mass extinction, the earth’s axial tilt could increase, the flexing and
    drifting of orbits could eventually eject some planets, and in all events it’ll
    be roughly another four months, five billion years, that the sun will run out
    of fuel, expand to a red dwarf and consume Mercury and Venus. Earth, if it survives,
    will be scorched and arid, its'
  - '[PAGE 103]


    oceans boiled dry, a cinder stuck in an interminable orbit of a white dwarf black
    dwarf dying sun until until the whole show ends as the orbit decays and the sun
    eats us up.


    And this is just the local scene; a minor scuffle, a mini-drama. We''re caught
    in a universe of collision and drift, the long slow ripples of the first Big Bang
    as the cosmos breaks apart; the closest galaxies smash together, those that are
    left scatter and flee one another until each is alone and there''s only space,
    an expansion into itself, an emptiness birthing itself, and in the cosmic calendar
    as it would exist then, all humans ever did and will be a brief light that flickers
    on and off again one single day in the middle of the year, remembered by nothing.


    We exist now in a fleeting bloom of life and knowing, one finger-snap of frantic
    being, and this is it. This summery burst of life is more bomb than bud. These
    fecund times are moving fast.


    (Late, so late, the six awake discombobulated from their post-film sleep. Is it
    day or night? Have they got to the moon yet? What decade, what century are we
    in?


    It''s 1.30 a.m.; several hours passed the rigidly scheduled bedtime. Lucky mission
    control turns the surveillance cameras off at night, they think, only half in
    jest; otherwise we''d all get it in the neck.


    In this half-sleep and confusion the strangeness of their lives for a moment catches
    up with them. They find them in a circle in the middle of the module facing each
    other as if they''ve met again after a long time apart. Without word or reason
    they sail inwards and join, twelve arms interlinked. Buona notte, oyasumi, spaknoy
    gece, sweet dreams, goodnight. Hands squeezing shoulders and ruffling hair. Then
    propelling backwards, a brief look outside to bright daylight flooding Florida,
    and each of them off their quarters, where the dark stanium thrums them back into
    sleep.)'
  - '[PAGE 104]


    # Orbit 14, ascending


    With untold peace and silence, the typhoon hits land. From the stillness of their
    vantage point, their solar arrays are copper against the night. The darkness of
    the Indian Ocean cedes to cloud which curdles, and the typhoon is a thick white
    mass sheened with moonlight. Their orbit proceeds north-east over Malaysia, Indonesia,
    the Philippines, but these islands are been gone.


    Nobody is up to see it; it''s past two in the morning and the spacecraft is dark
    and humming. Through the great domed window there''s no view but a perspective-less
    expanse of typhoon. There''s the easternmost arm of its spiral, and the clouds
    for hundreds of miles have been whipped into motion. Anybody watching would be
    struck by vertigo at this swirling earth.


    Those down beneath the roof of cloud see a car door wing along a street followed
    by a sheet of corrugated iron. They see an unrooted tree smash into a bench itself
    smashed into a bike itself smashed against a billboard that''s blown across the
    road. They see fifty children huddled behind a barricade of desks while the school
    around them blows away. They see rain peering into the floodwaters that surge
    inland. They see someone''s dog washed down the street in two meters of soupy-thinged
    water, and the dog''s someone promptly after it, and a parasol, a pram, a book,
    a cupboard, dead birds, tarpaulin, a van, many shoes, coconut trees, a gate, a
    woman''s body, a chair, roof timbers, Christ on his cross, a flag, countless bottles,
    a steering wheel, clicking, door frames, bowls, road signs, you name it. They
    see the ocean roll over a town. The airport collapse, the planes capsize. The
    bridges give.'
  - '[PAGE 105]


    The very first crack of silver on the earth’s right shoulder signals that dawn
    is soon to come, and as the orbit presses north the clouds are disbanding and
    the typhoon slopes away behind. The lights of Taiwan and Hong Kong rounding towards
    them on the earth’s curvature look like fires raging. The ring of airglow at the
    atmosphere is neon green fading to orange.


    Now some dreams come to Chie in which her mother is alive; they’re spiked with
    relief and exultation. Beneath her Japan and East Asia crowd the forward view
    and if she were to wake and look out she’d see little or nothing of the typhoon.
    She’d see only a lovely planet shifting unfalteringly past the places of her childhood.
    It’s the last of night down there and the continent is etched in gold.'
