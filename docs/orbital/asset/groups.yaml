    轨道 16\n\n致谢\n\n# 轨道减 1\n\n他们在飞船中环绕地球旋转，是如此彼此依靠，又如此孤独，以至于他们的思想、他们内在的神话，有时也会汇聚在一起。有时他们做着同样的梦——关于分形、蓝球，以及被黑暗吞噬的熟悉孔，以及冲击他们感官的明亮而充满能量的黑色太空。原始的空间是一只豹子，野性而原始；他们梦见它在自己的舱室里穿行。\n\
    \n他们挂在睡袋里。金属外壳之外仅手掌之宽，宇宙在简单的永恒中展开。他们的睡眠开始变得稀薄，某个遥远的地球清晨降临，他们的笔记本电脑闪烁着新一天的第一条静默信息；时刻清醒、时刻警觉的空间随着风扇和过滤器的声音而震动。厨房里留着昨晚晚餐的残留——用磁铁固定在桌上的脏叉子，以及插在墙上袋子里的筷子。四个蓝色气球在流动的空气中漂浮，一些褪色的彩带写着“生日快乐”——这是一场庆祝，也是他们拥有的一切。剪刀上有一抹巧克力，一根绳子上挂着一个小毛毡月亮，系在折叠桌的把手旁。\n\
    \n外面，地球在月光中摇曳，随着他们向那无尽的边缘迈进，地球向后剥落；横跨太平洋的云朵将海洋呈现出钴蓝色。现在，圣地亚出现在南美洲靠近的海岸线上，笼罩在云雾迷绕的金色光芒中。穿越太平洋温暖海域的风掀起了一场风暴。台风向西移动亚洲，他们的飞行器轨迹则向东向下进入巴塔哥尼亚，那里的地平线是一颗双星。大气层环线之外便是太阳，下一分钟它就将越过地平线，黎明将在几秒钟内到来离开，随后阳光将无处不在。中东非突然变得明亮而炽热。\n\
    \n今天是他进入太空的第四百三十四天，这是通过三个不同的任务统计的总数。他仔细记录着。就这次任务而言是八十八天。在单次为期九个月的任务中，总共大约有两百多天（此处原文逻辑）。他们在飞船中环绕地球旋转，是如此彼此依靠，又如此孤独，以至于他们的思想、他们内在的神话，有时也会汇聚在一起。有时他们做着同样的梦——关于分形、蓝球，以及被黑暗吞噬的熟悉孔，以及冲击他们感官的明亮而充满能量的黑色太空。原始的空间是一只豹子，野性而原始；他们梦见它在自己的舱室里穿行。\n\
    \n他们挂在睡袋里。金属外壳之外仅手掌之宽，宇宙在简单的永恒中展开。他们的睡眠开始变得稀薄，某个遥远的地球清晨降临，他们的笔记本电脑闪烁着新一天的第一条静默信息；时刻清醒、时刻警觉的空间随着风扇和过滤器的声音而震动。厨房里留着昨晚晚餐的残留——用磁铁固定在桌上的脏叉子，以及插在墙上袋子里的筷子。四个蓝色气球在流动的空气中漂浮，一些褪色的彩带写着“生日快乐”——这是一场庆祝，也是他们拥有的一切。剪刀上有一抹巧克力，一根绳子上挂着一个小毛毡月亮，系在折叠桌的把手旁。\n\
    \n外面，地球在月光中摇曳，随着他们向那无尽的边缘迈进，地球向后剥落；横跨太平洋的云朵将海洋呈现出钴蓝色。现在，圣地亚出现在南美洲靠近的海岸线上，笼罩在云雾迷绕的金色光芒中。穿越太平洋温暖海域的风掀起了一场风暴。台风向西移动亚洲，他们的飞行器轨迹则向东向下进入巴塔哥尼亚，那里的地平线是一颗双星。大气层环线之外便是太阳，下一分钟它就将越过地平线，黎明将在几秒钟内到来离开，随后阳光将无处不在。中东非突然变得明亮而炽热。\n\
    \n今天是他进入太空的第四百三十四天，这是通过三个不同的任务统计的总数。他仔细记录着。就这次任务而言是八十八天。在单次为期九个月的任务中，总共大约有两百多天（此处原文逻辑）。\n\
    \n（注：由于原文中出现了大量重复段落，根据指令“不要重复输出原文”，此处译文已对重复内容进行了整合。以下为后续章节翻译：）\n\n# 轨道 1，上升\n\n\
    罗曼早醒了。他挣掉睡袋，在黑暗中游向窗户。我们在哪里？我们在地球上的哪里？南半球正在转瞬即逝。“你们受协调世界时限制，”地面工作人员告诉他们。“对这件事保持清醒，”看着自己的手表来锚定思想，在醒来时告诉自己：这是新一天的黎明。”\n\
    \n事实如此，在这一天里，他们将环绕地球十六次。他们将看到十六次日出，十六次日落，十六个夜晚。罗曼抓住窗户边的扶手以稳身体；日子飞速流逝。\n\n事实如此。但这一天包含了五大洲、秋季与春天、冰川与沙漠、荒野与战区。在环绕地球的旋转中，在光影的积累以及对推力、姿态、速度和传感器的复杂算术中，清晨的鞭响每九十分钟到来一次。他们喜欢这些日光的光芒与他们自身重合的日子。\n\
    \n"
