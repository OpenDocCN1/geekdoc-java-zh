    沙子、藻类、珊瑚和浮游生物让水域呈现出一系列绿色的光芒——但现在却出现了翻滚破碎的暴雨云，通常宁静的景色显得疲惫而不安。当它们向印度东岸攀升时，云层正在变薄；晨光增强了，短暂地显得冷峻，随后雾气从孟加拉湾袭入，云层稀疏而密集，恒河的泥沙河口向孟加拉国敞开。赭色的平原和赭黄色的河流，横跨千里山脊的酒红色山谷。喜马拉雅山脉是蔓延的霜叶；珠穆玛峰是一座难以辨认的悬崖。它们之外覆盖地球的一切切，都是西藏高原深邃的棕色，冰川径就、河流径就，点缀着宝石蓝色的冰冻湖。


    现在向上斜向穿过中国的大山脉，那抹淡淡的锈色斑迹是九寨沟谷非凡的秋季景观，接着是戈壁沙漠，看上去十分平淡，但近距离观察，那里有一位画家无畏的笔触，他在水流中看到了动态，在棕色的蛋壳紫和深红色块中看到了色彩，将干旱描绘成油渍溢出的色调，将峡谷描绘成母贝壳。北向轨道向此压来，进入朝鲜和北海道上方。日本是一缕没入消失点的丝缕。那是十一个轨道和十六小时前，它们经过那里，而这一次它们在向上时掠过它，穿过沿着太平洋海脊的俄罗斯岛屿群，越过白令海。而现在，陆地像一条丝绸滑裙般退去。


    有一种跨越大陆的感觉，向上攀升并越过地球的脊线。以一条洁净的弧线向上并越过北太平洋。尽管它们的轨道是绕行星运行的直线，但转弯让轨道路径看起来在上下、南北之间剧烈起伏，从北极圈边缘延伸到南方海洋。现在，在它最北的点上，它再次下沉。在左侧远处，是一块平滑、清脆的冰块，标志着阿拉斯加。那是一团无云的、可破碎的白色甜点。当云层进一步向南积聚时，整个景象是冰浮和云的液体旋涡。阿拉斯加半岛的长尾。瞥见陆地、峡湾和入海。山脉变薄。左舷的加拿大海岸根本不是海岸线，而是一片被大锤砸成随机碎片的陆地。


    在它们来到这里之前，曾有一种世界另一端的感觉，一种遥远而不可触及。现在他们看到大陆如何像过度生长的花园一样交织在一起——亚洲和澳澳洲完全并不分离，而是由穿插其间的岛屿连接在了一起；同样，俄罗斯和阿拉斯加面贴面，只有极小的一片水将它们隔开。欧洲毫无声张地汇入亚洲。大陆和国家一个接一个地出现，地球感觉——并不小，而是几乎是无止境的连接，像一首流动诗节的史诗。它没有任何产生对立的可能性。即使当海洋来临，来去又来，以一种无缝的卷轴没入时，也没有关于陆地或任何被抛光成蓝色的感觉，你听过的每一个国家似乎都滑入了洞穴，即便那时，也不再等待任何其他。别无他物，从未有过。当陆地再次出现时，你想，噢，是的，仿佛从一个迷人的梦中醒来。而当海洋再次出现时，你想，噢，是的，仿佛从一个梦中醒来，直到你被梦境填满到找不到出口，也不再想去尝试。你只是在漂浮、在旋转、在梦境深处数百英里的地方飞行。


    夜晚结束了。在东面，地平线变得模糊。还没到这里，但它们正追踪靠近。下方的太平洋以及在扭曲的曲线上坠落的内华华达山脉更近了，如果你透过透镜看，你会看到远处的旧金山、洛杉矶，印记在一块印记在海上的陆地上，一条用尖锐的白色勾勒出的海岸线，一种萎缩土地的灰色色调。下加利福尼亚半岛肥沃的沿海平原。然后，它们也扭曲着远去。


    夜晚结束了。在东面，地平线变得模糊。还没到这里，但它们正追踪靠近。


    有时，这种横跨地球的速度足以让人精疲力竭且困惑。你离开一个大陆，在十分之四内到达了下一个，很难摆脱那种大陆消失的感觉，它压在你的背上，那里发生的一切生命来来去去。日日夜夜，季节与独裁。只有在夜晚睡觉时，你才从这台跑步机上解脱出来。即使在睡眠时你也能感觉到地球在旋转，正如你站在那里感觉到它一样。你感受到所有穿透你皮肤的日子，如果地球在轨道上停顿一秒，你会从惊中醒来，感知到某种。


    黎明后已经过去了四十分钟，夜晚的阴影从东部渗入。它看起来并不多，左舷的一抹污迹。蓝色已变成紫色，但仅此如此。绿色变成了紫色，白色变成了紫色，或者说是它的残迹。不，美国已经离开了。夜晚拆开了地球的蓝绿色织锦。赤道再次从北向南被跨越，月色昏暗，只有一度。突然间，仿佛由于不悦快，太阳拂去了地球表面的日光，星辰如雪滴花般从上帝的某处迸而出。船员们在睡中感受到了夜晚突如其来的重量——那颗巨大的球形行星。他们现在向海洋深处坠落了一格，在厄瓜多尔岸边，基多和利马预示着陆地。有千里的闪电击打着岸，有一条两英里的积云带停留在海上，有一道四千里的山脉屏障。在没有城市的最浓稠黑暗中，有一千里橙色斑点组成的补丁，那里雨林在燃烧。


    一千百万生命栖息在下方的布宜诺斯艾利斯，郊区让位于黑色农田，河流汇入海洋，还有高南极圈。躲在地球的腹下，在这些公顷的夜晚中，有南极黄昏时奇特的氛围，但在这些北纬纬度，天空是厚实且充满银系的。你现在正直视银河的心脏，它的引力如此强大且迷人，以至于感觉轨道将脱离，进入那深邃的海洋，那引力是如此强烈且令人心醉，以至于感觉轨道将脱离，进入那深邃的海洋。这种引力是如此强烈且令人心醉，以至于感觉轨道将脱离在没有云的夜晚，直到没有了。当陆地再次出现时，你想，噢，是的，仿佛从一个迷人的梦中醒来。而当海洋再次出现时，你想，噢，是的，仿佛从一个梦中醒来，直到你被梦境填满到找不到出口，也不再想去尝试。你只是在漂浮、在旋转、在梦境深处数百英里的地方飞行。


    夜晚结束了。在东面，地平线变得模糊。还没到这里，但它们正追踪靠近。

