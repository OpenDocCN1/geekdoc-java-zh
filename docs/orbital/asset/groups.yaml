    ## 轨道上升


    在难以言说的和平与寂静中，台风登陆了陆地。从他们的视角来看，航天器是黑暗且发出嗡嗡声的。通过圆顶窗，看到的只有一片没有透感的台风风野。


    任何看到这一切的人都会被这旋转的地球感到眩晕。


