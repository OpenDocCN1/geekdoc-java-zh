    of the domed windows, and become aware of themselves as a solitary head and torso
    in the vacuum of space. Suspended in a little pocket of breathable air. A sense
    of gratitude so overwhelming that there''d be nothing they could do or about it,
    no word or thought that could be its equal, so for a moment they''d close there
    on the inside of the eyelids, a vivid and geometrically perfect sphere, and they''d
    have no idea if this was simply an after-image or a projection of the mind, which
    knew that planet well by now that it could draw it without reference.


    With each sunrise nothing is diminished or lost and every single one staggers
    every time blade of light cracks open the sun explodes from it, a momentary immaculate
    star, then spills its light like a pale uniped, and floods the earth, every time
    night becomes day in a matter of a minute, every time the earth dips through space
    like a creature diving and finds another day, day after day again from the depth
    of space, a day ninety minutes, every day brand new and of infinite supply, it
    staggers them.'
- md: '

    And now those cities on the Gulf of Oman are passing behind, balanced by dawn.
    Rose-flushed mountains, lavender desert, and up ahead Afghanistan, Uzbekistan,
    Kazakhstan, and a round of faint cloud that is the moon. Sometimes when they pass
    over Kazakhstan they can''t properly assimilate the fact that they left earth
    from there, and will go back to there. That the only means of getting home is
    to rip through the atmosphere in flames, glass blackened, to pray that the heat
    shield holds and that the parachutes and reverse thrusters deploy, and that all
    of the thousands of moving, working parts move and work. It''s difficult to compute
    that the whispering line calls a thing they must crash through. They must burn
    and roll in a blazing bald before they jolt up with the drogue and see the grasses
    and wild horses of the Kazakh plains.


    In their sleep the crew has gone one more full ninety-minute transit around the
    earth, their fifteenth orbit of the sixth. To snowboard the view is the snow-covered
    Himalayas that stretch like a road, a vast, open and endless road. To the south
    of those mountains are cities, Lahore and New Delhi, which in the brilliance of
    day will have bleached into the landscape, gone. Eaten up by a topography of wilderness
    that doesn''t seem to know mankind. Just that mountain range leading ever ever
    south.


    It''s mid-morning coming in to Russia and in the shrill light the earth is once
    again a glass marble in blackest space. Bereft and fragile now its neighbouring
    stars and planets can no longer be seen. And yet it is, at the same time, the
    opposite of fragile. There''s nothing there on its flawless surface that could
    break, and it''s as if there is in fact nothing there at all – the more you look
    at it the less substance it has and the more it becomes an apparition, a holy
    ghost.


    The whole globe has passed beneath and will keep on passing. With each full orbit
    they''ll track a few degrees westward, and when the orbit comes again in ninety
    minutes it will be over Eastern Europe, where another day will break. Another
    fresh day in all the fresh days. The earth is blue-hooped and covered with snow.
    The earth is almost as far north as it will ever be and begins to round out at
    the lower edge of the Arctic Circle. Beyond, the North Pole which is never quite
    seen. Descending now away from Russia and toward a Pacific passage of five thousand
    miles.


    ## Orbit 16


    By now the lunar astronauts are journeying in their little thimble of a command
    module towards moon orbit. They’re entering the first stage of their powered flyby.
    Did you know, says Capcom from ground control, that the record for the most lightning
    strikes sustained by one person has been broken? It was seven strikes, but as
    of last week a man in China has been struck by lightning rod around eight times.
    Oh, says one of the lunar crew, does he carry a lightning rod around with him?
    The things people will do to break a record, laughs another, and Capcom tells
    them that eighty-four per cent of deaths by lightning strike are men. That figures,
    says the crew. Live dumb, die young. What happened, by the way, to that thing
    you told last night, about the cow that got stuck in a pea bog? They hoisted it
    out, Capcom says. It was all day out but they got some straps and a Mitsubishi
    pickup and pulled the thing out. Hope it obliged them with a little milk at the
    end of that. How’s the moon looking from where you are? It looks shadowed and
    grey like an old man, they say. It looks bashed up all the same kind of welcoming.
    We can just see about where we’ll land when we reach the South Pole. It’s more
    stunning than we’d ever hoped. We’ll have safe and sound in the next nine hours,
    Capcom tells them. God willing and with a good wind behind us, one says, and another
    adds: All that effort to save a cow.


    From an outside view you’d see them wend a long-untrodden man-made trail between
    two billing spheres. You’d see that far from venturing alone, they navigate through
    a swarm of satellites, a midgey seething of orbiting things, two hundred million
    flung-out things. Operating satellites, ex-satellites blown into pieces, natural
    satellites, flecks of paint, frozen engine coolant, the upper stages of rockets,
    bits of Sputnik 1 and Iridium 33 and Kosmos 2251, solid-rocket exhaust particles,
    a lost toolbag, a mislaid camera, a dropped pair of pliers and a pair of gloves.
    Two hundred million things orbiting at twenty-five thousand miles an hour and
    sandblasting veneer of space.


    From an outside view you see the lunar spaceship tiptoes away through this field
    of junk. It negotiates through low earth, the busiest and trashiest stretch of
    the solar system, and with an injection burn forces itself out on its transit
    to the moon where the clutter thins and the going''s. A full-throttle scarper
    in the billionaire''s rocket, out and away, away from the junk, away from the
    breaking burning storm scintillating earth fleeing the scene of a crime. Away
    from the plucking fluting typhoon and the houses barging down roads becomes rapid
    and calamitous ruin that can''t yet be measured. Away from the planet held by
    humans, a giant turning slightly on its canting orbit, away into virgin up-sale
    wilderness, this new black gold, this new domain for the taking. Through their
    quarter-of-a-million-mile of space.


    Here Anton, Roman, Chie, Shaun and Pietro in tubular modules are daily pelted
    and pitted with dents. They hang like baits in their quarters. Anton wakes briefly
    with his fist in his cheek. His first and only thought is of the spacecraft on
    its way to the moon, accompanied by the feeling of joy. It’s as if each orbit
    is encoded into him. He’s been here almost half a year and he knows the paths
    they take over the earth, their repeating patterns. Even in sleep he’s remotely
    aware of the sun glinting off the gold domes of Tolyatti – a flash of light that
    seems to appear from nothing. A little way triangular shape of Volograd, which
    they see from above when they fly from Star City to Kazakhstan for their launch;
    when you see Volograd from the plane you know you’re near the Kazakhstan border
    and leaving Russia and everything behind.


    It’s almost five in the morning Roman knows in this light they’ll be circling
    somewhere near Turkmenistan, Uzbekistan, which means south-western Russia will
    be distant portside, the Black and Caspian Seas. Overnight the cities have been
    laid down in the season’s first snow — Samara and Tolyatti over the Volga banks.
    The crack that appeared outside gives a centimeter or two. It sends fissures that
    broadly echo an aerial map of the Volga River. It’s not so far from Roman’s head,
    this crack, on the other side of the thin alloy shell, and no patching with epoxy
    and Kapton tape is going to hold it. The pressure in the Russian module drops
    just a fraction, barely noticeable, not enough to sound any alarm, and the clocks
    count themselves around towards waking time and the onset of another blitzed and
    man-made day.


    When you’ve moved along the length of the spaceship to its aft, through hatches
    that get ever smaller and modules that get ever old, and you come here to the
    depict Soviet bunker right at the end where Anton and Roman sleep, then you see
    the table littered from dinner (a bad habit of this crew to leave their clearing
    to the next day) – there are some spoons fastened with Velcro, and fastened to
    them empty vacuum-packed sachets of olives, the sachets stuffed with napkins that
    are splattered with borsch, there are four idling spinning crumbs of honeycomb
    that have been caught for now in an equilibrium of forces between the module’s
    air vents which push one way and the spacecraft’s air vents that pull the other,
    and below where they float there are some unopened packets of bread cubes pegged
    to the wall.

