    to the moon, he hears that haunting call — that''s what we''re doing when we come
    into space, asserting our species by extending its territory. Space is the one
    remaining wilderness we have. The solar system into which we venture is the new
    frontier now our earthly frontiers have been discovered and plundered. That''s
    all this great human endeavour of space exploration really is, he thinks, an animal
    migration, a bid for survival. A looping song sent into the open, a territorial
    animal song.


