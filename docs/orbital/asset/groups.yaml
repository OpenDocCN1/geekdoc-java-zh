    Making lists is what Chie would do when she was a child, when she was disturbed
    or anxious. She went through a phase of unexplained anger, and began to write
    lists of all the people she would like to be rid of, and all the ways she''d like
    them to die. She knew it was wrong to want to kill them herself, so their deaths
    were always preventable accidents. When the anger subsided the lists changed in
    mood but didn''t cease to be. Her parents supposed it was her way of controlling
    her feelings and never tried to stop her, and barely made comment, and all her
    life, in difficult times, the lists resurface. In some ways she hardly notices
    writing them, they''re like nail-biting or teeth-grinding, they bring a reflexive
    comfort. Here, they wa slightly on their pegs in sleeping quarters while she dreams.
    Once, when she was around eight years old, she wrote a list of unusual things,
    one item of which was female pilots. She asked her parents, her teachers, how
    many female pilots there were in Japan and the answer turned out to be'
  - '[PAGE 107]


    none, in the military at least. None. And a seed was sown in a resolute mind,
    a methodical and fearless and crystalline mind.


    When Anton was a child of six or seven, he made a model of a spaceship as many
    children were wont to, out of a washing-up-liquid bottle and tinfoil, and his
    astronauts, who were fashioned from pegs and swaddled in cotton wool, made spacewalks
    almost daily. They were permanently dressed for a spacewalk, white and so puffy
    as to be limbless, and they popped from the hatch within seconds of waking, as
    easily as slipping out of bed. His father showed him all possible to if he sat
    in a dark room and shone a torchlight, it was often possible to see the glittery
    suspension of dust motes in the path of the light; it was into that astronauts
    would launch, and he would hold them lightly between thumb and forefinger and
    let them float among the dust motes as if among stars. And this soon became the
    purpose of the spacewalks – to catalogue an ever deeper field of stars.


    In her dreams now, Nell is swimming with Shaun in search of the Challenger astronauts,
    except that Nell is a child, at least that''s what the dream tells her she doesn''t
    look like a child, she looks like herself, but since herself is somewhat elf it
    fits for the dream to transpose the two, child and adult; they''re driving. Nell
    has a candle whose flame flutters in the water. They find the thing they were
    looking for, which turns out to be a fire. On the seaside, a bonfire. Its flame
    is circular as flames in microgravity, and they take it with them to a boat which
    in fact is a rock bobbing in the middle of the ocean. On this rock is her mother
    holding the small monkey that Nell remembered today, in the memory of the square
    in Cape Town, and which the dream seems fresh and full of meaning. Ah, Nell thinks,
    I see. I see at last; this is why I came to space. There''s a shock of grief that
    detonates her dream and blows it to pieces. She wakes. She doesn''t know what
    it is understood in the dream, it''s there in her mind but vanishes on contact.
    There''s just an age-old grief for long-dead mother. No longer unhappy, just an
    abrasion. When she drifts towards sleep the mother she sees is not her but Chic''s.


    The peculiar thing (that they''ll never discover) is that Shaun is dreaming too
    of this circular flame, this microgravity doughnut of fire. Not the rest, just
    the fire. It''s spinning in space and it perturbs him because it seems to disprove
    the existence of God, in some logic that belongs only to dreams. Then the doughnut
    of fire becomes a typhoon, a little spiral that looks'
  - '[PAGE 108]


    just like a galaxy, and he''s watching it distantly. At some point in the night
    he''s taken his earplugs out and is holding one in each gently closed hand.


    I decided to be an astronaut when I was in the womb, Roman''s saying to a roomful
    of people. Before I was born, when I was taking in oxygen through an umbilical
    cord, when I was swimming weightless, when I knew infinity I''d recently come
    from it, that''s when I decided to become an astronaut. And the people in the
    room start laughing and clapping as if he''s told a joke, when in fact he''s told
    the plainest truth he knows. All the same, he feels exceptionally happy. His mother
    and father are in the room, clapping along, and behind Anton.


    Chie, half awake and half asleep, is down in Shikoku in her parents'' house by
    the sea and a typhoon is howling and the moon is sideways. She''s on the porch
    steps holding her mother tight to her chest and her mother is a child and her
    hands in Chie''s are small as mikans. The sea is lapping at the bottom step.*It''s
    alright*, mother whispers, *daijobō-desu*, she says, *look up and see*. But what
    they see is the moon, when the astronauts are sailing, have been blown off orbit
    course and the astronauts can''t find it, to which her mother says, *I always
    knew that would happen. I always knew it.* She holds her mother while the millennia
    pass, crushing into her chest. I shouldn''t have left you, she''s thinking. I
    shall never again go away so far. The planets whip around the earth and the light
    is orange and the earth collides with the windblown moon, and they stay on their
    step. *I shall never again*, she says, *I never again.*


    For Anton there is the moon once again, his third repeat. He''s drifting alone
    near the moon as Michael Collins had, and he hears a murmur and this time it doesn''t
    turn into voices but music, a violin''s note which stretches space so the earth
    is so far away he can barely see it. *Everything warps with music.* He is in love;
    he doesn''t question with whom or what, or how he knows, but he knows, and he
    climbs out of his spacesuit better to feel it, this elastic ecstatic thing; he
    removes the helmet of his spacesuit to find it was only ever a hat, a silk kartuz
    topped with a large red flower.


    Pietro doesn''t dream. He has a rare night of deep and solid unthinking sleep.
    His breaths and heartbeats are smooth and few, his face resolved'
  - '[PAGE 109]


    its creases, his body well of atom-self, an unworried sum of parts, as if he knows
    that outside the earth falls away in perpetual invention and leaves nothing more
    for him to do. Our lives here are inexpressibly trivial and momentous at once,
    it seems he''s about to wake up and say. Both repetitive and unprecedented. We
    matter greatly and not at all. To reach some pinnacle of human achievement only
    to discover that your achievements are next to nothing and that to understand
    this is the greatest achievement of any life, which itself is nothing, and also
    much more than everything. Some metal separates us from the void; death is so
    close. Life is everywhere, everywhere.'
  - '[PAGE 110]


    # Orbit 15


    They’ve been sailing north-east in darkness from the Antarctic ice shelf, across
    acres of unwitnessed nothing. Everyone sleeps. Beneath glides the Indian Ocean
    at night, with barely a sense of the earth’s existence. There’s the faded orange
    line of the atmosphere which is the only suggestion that a planet is there – that
    the close and faithful moon. Yet through the atmosphere the stars can be seen,
    and so it seems this outer edge of the earth is made of glass, or that the planet
    is contained inside a glass dome. As and their spacecraft orbits towards an ever-renewing
    horizon, so the stars seem to rush and fizz in their billions upwards.


    Perhaps this spacecraft is the only thing. Silently sliding around an invisible
    rock. Perhaps it was this for those early discoverers who, on a blind night at
    sea, many months and thousands of miles from a coast they couldn’t be sure existed,
    had been filled with an intimacy with the earth, some sense that they were the
    only ones on it, and had known a brief peace.


    It’s just three in the morning on the clocks up here. Down there lightning pulses
    slow and dazzling from the black, tens or hundreds of miles apart, and the satin
    dark turns milky with storm cloud. The equator nears. It brings a shrieking star,
    for a huge, Bethlehem light. It’s not so much that they follow it as that comes
    for a wave of dawn that washes to the aft, and the clouds (the debris of the wrecked
    typhoon) are turbulent peaks of violet and peach.


    The hundred-cymbal clang of sudden daylight. A few minutes later they come in
    of the ocean where the Maldives, Sri Lanka, the tip of India are ripe with morning.
    The shallow shoals and sandbanks of the Gulf of Mannar. Off to starboard are the
    shores of Malaysia and Indonesia where'
