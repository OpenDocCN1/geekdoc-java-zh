    # Orbit minus 1


    Rotating about the earth in their spacecraft they are so together, and so alone,
    that even their thoughts, their internal mythologies, at times convene. Sometimes
    they dream the same dreams – of fractals and blue spheres and familiar faces engulfed
    in dark, and of the bright energetic black of space that slams their senses. Raw
    space is a panther, feral and primal; they dream stalking through their quarters.


    They hang in their sleeping bags. A hand-span away beyond a skin of metal the
    universe unfolds in simple eternities. Their sleep begins to thin and some distant
    earthly morning dawns and their laptops flash the first silent messages of a new
    day; the wide-awake, always-awake station vibrates with fans and filters. In the
    galley are the remnants of last night’s dinner – dirty forks secured to the table
    by magnets and chopsticks wedged in a pouch on the wall. Four blue balloons are
    buoyed on the circulating air, some faint bunting says Happy Birthday a celebration
    and it was all they had. There’s a smear of chocolate on a pair of scissors and
    a small felt moon on a piece of string, tied to the handles of the foldable table.


    Outside the earth reels away in a mass of moonglow, peeling backward as they forge
    towards its edeless edge; the tufts of cloud across the Pacific brighten the nocturnal
    ocean to cobalt. Now there’s Santiago on South America’s approaching coast in
    a cloud-hazed burn of gold. Unseen through the closed shutters the trade winds
    blowing across the warm waters of the Western Pacific have worked up a storm,
    an engine of heat. The winds take the warmth out of the ocean where it gathers
    as clouds which thicken and curdle and begin to spin in vertical stacks that have
    formed a typhoon.'
