    When Chie heard of her mother''s death she instantly went to one of the few earthly
    possessions she has in orbit – a photograph her mother gave her before she left
    to come here. In the photograph her mother is standing on the beach near their
    family home. She''s in her youth. Aged twenty-four, before she had Chie, when
    she moved, freshly married, to the house by the sea. Her mother is on the beach
    in a thick woolen coat, though it was July and must have been hot. On the back
    of the photograph it says Moon Landing Day, 1969 in her father''s hand. Her mother
    is scowling at the sky where a gull flies by what seems like. The gull is blurred
    when her mother is sharp, narrow and small. It isn''t clear whether her scowl
    is for the bird or the sky itself where she thinks the Apollo spaceship could
    be.


    For Chie, as a child, the photograph had a power she neither understood nor questioned.
    The lure of the absent moon, the absent landing, the great proclaimed that was
    happening, but elsewhere. Mythical in its remove. Moon Landing Day. She''d thought
    as a child that it must have been her mother was looking at the beach, something
    happening up on the moon, and that her mother could see it with naked eye. Or
    if her mother had been part of the event in some way. And it wasn''t until her
    mother gave her the photo before this mission that she remembered those thoughts,
    and felt their charge and the force of the past and what past is so stealthy in
    making the future – because she''s looking back that this photo had generated
    her first thought of space.


    On the photo''s reverse now, under Moon Landing Day, 1969, is says, this time
