    Nell brings a packet of chocolate-coated honeycomb that her husband sent up to
    her in the last resupply craft, because she was craving food that had a crunch
    and could not be scooped up with a spoon; he sent her three packs which she''s
    been working through in morsels, the pleasure of eating it almost trumped by the
    pain of its being gone. She shares out the last of it among the crew; this paltry
    hoarding, no good, she thinks. They speak about things they miss — doughnuts,
    fresh cream, roast potatoes. The sweets of her childhood.


    I remember well going to the dagashiya as a child, Chie says. We all went together
    after school, it was was like another world – when you walked in there was a big
    counter full of candy, and candy was hanging from the ceiling and on the walls,
    and the smell – the sweetness. It would make you faint if you stayed long enough.
    You would go in and ask for a mix. *Bontan ai*, some *ninjin*, some candy cigarettes.


