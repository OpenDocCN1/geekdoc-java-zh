    At some point in their stay in orbit there comes for each of them a powerful desire
    that sets in – a desire never to leave. A sudden ambushing by happiness. They
    find it everywhere, this happiness, springing forth from the blandest of places
    – the experiment decks, from within the sachets of risotto and chicken cassoulet,
    from the panels of screens, switches and vents, from the brutally cramped titanium,
    Kevlar and steel tubes in which they''re trapped, from the very floors which are
    walls and the walls which are ceilings and the ceilings which are floors. From
    the handholds which are foot-holds which chafe the toes. In the spacesuits, which
    wait in airlocks which speaks of being in space which is everything – ambushes
    them with happiness, and it isn''t so much that they don''t want to go home but
    home is an idea that has imploded – grown so big, so distended and full, that
    it''s caved in itself.


    At first on their missions each miss their families, sometimes so much that it
    seems to scrape out their insides; now, out of necessity, they''ve come to see
    that their family is one here, others who know the things they know and the things
    they see, whom they need no words of explanation. When they get back how will
    they even begin to say what happened to them, who and what they were? They want
    no except this view from the window of the solar arrays as they taper into emptiness.
    No rivets in the entirety of the world will except these rivets around the window
    frames. They want padded hallways for the rest of their lives. This continuous
    hum.


    They feel space trying to rid them of the notion of days. It says: what''s a day?
    They insist it twenty-four hours and ground crews telling them so, but it takes
    their twenty-four hours and grows sixteen days and nights at them in return. They
    cling to their twenty-four clock because it''s all the feeble time-bound body
    knows – sleep and bowels and all that is lashed to it. But the mind goes free
    within the first week. The mind is in a dayless freak zone, surfing earth''s hurtling
    horizon. Day is here, and then they see come upon them the shadow of a cloud racing
    over a wheat field. Forty-five minutes later comes day again, stampeding across
    the Pacific. Nothing is what they thought it.


    Now as they track south from eastern Russia diagonally across the Sea of Okhotsk
    path between Japan and Russia. In this indistinct light the islands seem to be
    a trail of drying footprints. Her country is a ghost haunting the water. Her country
    is a dream she remembers once having. It lies slantwise and slight.


    She looks out from the lab window as she towels herself off after exercise. Her
    weightless bobbing is steady and upright. If she could stay in orbit for the rest
    of her life all would be well. It''s only when she goes back that her mother is
    dead; as in musical chairs there''s one fewer seat than there are humans who need
    it it but so long as the music plays the number of seats is immaterial and everyone
    is still in the game. You have to not stop. You have to keep moving. You have
    this glorious orbit and when you''re orbiting you-impact-proof and nothing can
    touch you. When the planet is galloping through space and you gallop after it
    through light and dark with your time-drunk brain, nothing can end. There could
    be no end, there can be only circles.


    Don''t go back. Stay here ongoing. The creamy light off the ocean so exquisite;
    the gentle clouds ripples in tides. With a zoom lens the first part of snow on
    the top of Mount Fuji, the silver bracelet of the Nagara River where she was a
    child. Just there, the perfect solar arrays drinking sun.


    From the space station''s distance mankind is a creature that comes out at night.
    Mankind is the light of cities and the illuminated filament of roads. By day,
    it''s hidden in plain sight.


    On this orbit, two of today''s sixteen, they can watch if they ever have such
    a stretch of time, and traverse the earth one whole round and see barele a trace
    of human or animal life.


    Their transit approaches West Africa just the vast spill of dry blots out every
    obvious human landmark to the naked eye. They pass central Africa, the Caucasus
    and Caspian Sea, southern Russia, Mongolia, eastern China, the north of Japan
    in the blanching light. By the time night comes in the Western Pacific there''s
    no land in sight, no cities to proclaim mankind. On this orbit the entire night-pass
    is oceanic and black, stealing down the mid-Pacific between New Zealand and South
    America, brushing the tip of Patagonia back up to Africa, and just as the ocean
    runs out and the coasts of Liberia and Ghana and Sierra Leone creep up, sunrise
    blasts open the dark and daytime floods in, the entire northern hemisphere once
    again luminous and humanless. Seas, lakes, plains, deserts, mountains, estuaries,
    deltas, forests and ice floes.


    As they orbit they might as well be intergalactic travellers chancing upon a virgin
    frontier. It seemsuninhabited Captain, they say when they glance out before breakfast.
    We believe it could be the remnants of a collapsed civilisation. Prepare the thrusters
    for landing.


