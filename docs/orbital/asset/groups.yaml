    what has suddenly become their mundanity. The mundaneness of their earth-struck
    orbit, bound for nowhere; their looping round and never out. Their, monogamous
    circling which struck them last night as humbly beautiful. A sense of attention
    and servitude, as a sort of worship. And though they looked out before going to
    bed, as if they might see those moon-bound astronauts sailing past, and though
    their sleep was restless with anticipation, it wasn''t the moon they entered their
    dreams, but their own wild garden of space outside the spacecraft – the garden
    they''d all at some point walked in. And the ever-electric blue pull of the earth.


