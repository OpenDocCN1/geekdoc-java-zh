    understand. They know that the vision can weaken and the bones deteriorate. Even
    with so exercise still the muscles will atrophy. The blood will clot and the brain
    shift in its fluid. The spine lengthens, the T cells struggle to reproduce, kidney
    stones form. While they''re here food tastes of litre. Their sinuses are murder.
    Proprioception falters – it''s hard to know where their body parts are without
    looking. They become misshapen bags of fluid, too much in the body and not enough
    lower down. Fluid gathers the eyeball and squashes the optic nerve. Sleep mutnies.
    Their gut microbiomes grow new bacteria. Their cancer risk increases.


    Not encouraging thoughts, as Roman says. Anton asks him a while later if he worries
    about this.


    No, he says. Never. And you?


    Beneath them the South Pacific now passes in absolute night, an endless pit of
    black, and there is no planet, just the gentle green line of the atmosphere and
    countless stars, astonishing solitude, everything so near infinite.


    No, Anton answers. Never.


    Sometimes they look at the earth and could be tempted to roll back all they know
    to be true, and believe that it sits, this planet, at the centre of everything.
    It seems so spectacular, so dignified and regal. They could still be led to believe
    that God himself had dropped it there, at the very centre of the whole universe,
    and they could forget all truths men and women had uncovered (via a jerking and
    stuttering path of discovery followed by denial followed by discovery followed
    by cover-up) that the earth is a piddling speck at the centre of nothing. They
    could think: negligible thing could shine bright, no-furled nothing satellite
    could bother itself with these shows of beauty, no paltry rock could arrange intricacy
    as fungi and minds.


    So sometimes it would be easier to unwind the heliocentric centuries and go back
    to the years of a divine and hulking earth around which all things orbited – the
    sun, the planets, the universe itself. You''d need more distance from the earth
    than they have to find it insignificant and small; to really understand its cosmic
    place. It''s clearly not that kingly earth of old, a God-given clod too stout
    and stately to be able move about the ballroom of space; no. Its beauty echoes
    – its beauty is its echoing, its ringing singing lightness. It''s not peripheral
    and it''s not the centre; it''s not everything and it''s not nothing, but it seems
    much more than something. It''s made of rock but appears from here gleam and ether,
    a nimble planet that moves three ways – in rotation on its axis, a tilt on its
    axis, and around the sun. This planet that''s relegated out of the centre and
    into the sidelines – the thing that goes around rather than gone around, except
    for its knob of muscle. This thing that harbours humans who polish the ever-larger
    lenses of our telescopes that tell us ever-smaller we are. And we stand there
    gaping. In time we come to see that we are not on the sidelines of the universe
    but that it''s of a universe of sidelines, that there is no centre, just a giddy
    mass of waltzing things, and that perhaps the entirety of our understanding consists
    of an elaborate and ever-evolving knowledge of our extraneousness, a bashing away
    of mankind''s age by the instruments of scientific enquiry until it is, that ego,
    a shattered edifice that lets light through.


    They said at their in-between distance of low earth orbit, their half-mast view.
    They think: maybe it''s hard human and maybe that''s the problem. It''s hard to
    shift from thinking your planet is safe at the centre of it all to knowing in
    fact it''s a planet of normalish size and normalish mass rotating about an average
    star in a solar system of average everything in a galaxy of innurably many, and
    that the whole thing is going to explode or collapse.


    Maybe human civilisation is like a single life – we grew out of the royalty of
    childhood into supreme normality; we find out about our own unspecialness and
    in a flush of innocence we feel quite glad – if we''re special then we might not
    be alone. If there are who-knows-how-many solar systems just like ours, with-knows-how-many
    planets, one of those planets is surely inhabited, and companionship is our consolation
    for trivial. And so, in loneliness and curiosity and hope, humanity looks outwards
    and thinks they might be on Mars perhaps, the others, sends out probes. But Mars
    appears to be a frozen desert of cracks and craters, so maybe in that case they''re
    in the neighbouring solar system, or the neighbouring galaxy, or the one after.


    We send out the Voyager probes into interstellar space in a big-hearted fanciful
    spasm of hope. Two capsules from earth containing images songs just waiting to
    be found in — who knows — tens or hundreds of thousands of years if all goes well.
    Otherwise millions or billions, or not at all. Meanwhile we begin to listen. We
    scan the reaches for radio waves. Nothing answers. We keep on scanning for decades
    and decades. Nothing answers. We make wishful and fearful projections through
    books, films and the like about how it might look, alien life, when it finally
    makes contact. But it doesn''t make contact and we suspect in truth waiting when
    there’s nothing there? And now maybe out there, we think. Why bother humankind
    in the late smash-it-all-up teenage age of self-harm and nihilism, because we
    didn''t ask to be alive, we didn''t ask to inherit an earth to look after, and
    we didn''t ask to be completely justly darkly alone.


    Maybe one day we''ll look in the mirror and be happy with the fair-to-middling
    ape that eyes us back, and we''ll gather our breath and think: OK, we’re alone,
    we’re alone.

