    \ of Earth Orbits With Daylight in the Northern Hemisphere\n\n![](img/791ebcf04e6f10e9684b63c1b5f1bbe7_4_0.png)\n\
    \n# Contents\n\n- Orbit minus 1\nOrbit 1, ascending\nOrbit 1, into orbit 2\nOrbit\
    \ 3, ascending\nOrbit 3, descending\nOrbit 4, ascending\nOrbit 4, descending\n\
