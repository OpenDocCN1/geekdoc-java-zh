    Why couldn’t a spaceship be decked out like an old farmhouse, with flowery wallpaper
    and oak beams – fake oak beams, says Pietro at breakfast. Lightweight non-flammable
    armchairs and all these things. Like an old Italian farmhouse. Or an English one.


    At which everybody looks at Nell, who is English, and who shrugs and digs about
    in the.

