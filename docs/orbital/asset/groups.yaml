    To answer your wife’s question, the subject of the painting is the dog.

    He looks then — when Pietro hands back the postcard, reaches across to squeeze
    the bony dome of Shaun’s shoulder before diving away — at the dog in the foreground.
    He’d never given it a second glance, but now he can look at anything else. It
    has eyes closed. In a painting that’s all about looking and seeing, it’s the only
    living thing in the scene that isn’t looking anywhere, at anyone or anything.
    He sees now large and handsome it is, and how prominent— and though it’s dozing
    there’s nothing slumped or dumb in that dope. Its paws are outstretched, its head
    erect and proud.


    This can’t be coincidental, he thinks, in so orchestrated and symbolic of a scene,
    and it suddenly seems that Pietro is right, he’s understood the painting, or that
    his comment has made Shaun see a different painting altogether to the one he’d
    seen before. Now he doesn’t see a painter or princess or dwarf or monarch, he
    sees a portrait of a dog. An animal surrounded by the strangeness of humans, all
    their odd cuffs and ruffles and silks and postures, the mirrors and angles and
    viewpoints; all the ways they tried to be animals and how comical this is, when
    he looks at it now. And how the dog is the only thing in the painting that isn’t
    slightly laughable or trapped within a matrix of vanities. The only thing in the
    painting that could be called vagely free.'
