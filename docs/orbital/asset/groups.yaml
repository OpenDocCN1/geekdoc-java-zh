    Those seven astronauts who died on the Challenger, she says, I knew everything
    about their lives, everything.


    Shaun sucks from the spout of the plastic coffee cup — comical, like supplying
    from a toy watering can.


    I was only seven, she says. I had pictures of them on my wall, the crew. I lit
    candles on their birthdays for, I don''t know, three or so years after. Shaun
    says, "You did?"


    I did.


    OK.


    I wonder now that my father never tried to discourage this.


    Shaun nods slowly in his approving way, chewing, processing his image of this
    child lighting candles for dead astronauts; lighting candles full stop, dear God.
    But for astronauts. And yet why not; he used to fibre-optic traps around his room
    to stop his sister trespassing. All children have their ways.


    I was horrified, Nell says. I was horrified that they were there and then they
    were gone, in seventy seconds. Gone.


    I mean, sure, Shaun says.


    In seventy seconds, gone.


    With the world watching, he says. Children watching.


    Everybody watching, everybody—, Nell falters as if she''s arrived at a precipice.
    When I was a child that thought stopped sleeping, she says. The thought of how
    quickly everything could turn around. And my father, let me get on with it. Candles
    keep demons away, as he once said, in a bid to comfort me — that''s why you light
    them when you remember someone, to keep the demons from them. My father rarely
    absurd things, but that was absurd. What use was protection from demons when you''d
    in a space shuttle that had broken into five thousand pieces, when your compartment
    had fallen twelve miles at hundreds of miles an hour and smashed apart in the
    ocean? If there''d been demons, hadn''t they already acted?


    She remembers this clearly; finding some birthday candles and holders in the kitchen
    cupboard and planting them in plasticine and not daring for hours to strike a
    match, knowing she wasn''t allowed them, thinking they might do something dangerous,
    explode in her hands perhaps.


    Shaun doesn’t answer, though there’s nothing dismissive in that. He seems to be
    thinking. She too. Thinking of how she cried when the wreckage and the astronauts''
    bodies were recovered from the seabed over a month later, and how, in grief which
    she couldn’t even begin to understand, buried herself in an obsession. Her father
    thinks he might still be burying it in now.


    For a split second Shaun thinks, what the hell am I doing here, in a tin can in
    a vacuum? A tinned man in a tin can. Four inches of titanium away from death.
    Not just death, obliterated non-existence.


    Why would you do this? Trying to live where you can never thrive? Trying to go
    where the universe doesn’t want you when there’s a perfectly good earth that there
    does. He’s never sure if man’s lust for space is curiosity or ingratitude. If
    this weird longing makes him a hero or an idiot. Undoubtedly something just short
    of either.


