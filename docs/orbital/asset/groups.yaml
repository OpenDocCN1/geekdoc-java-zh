    # Orbit 11


    Everything, everything is turning and passing.


    So Shaun thinks and as he slips the postcard back in his pouch he feels like laughing
    at the question before him. How are we writing the future of humanity? We''re
    not writing anything, it''s writing us. We''re windblown leaves. We think we''re
    the wind, but we''re just the leaf. And isn''t it strange, how everything we do
    in our capacity as humans only makes us more as the animals we are? Aren''t we
    so insecure a species that we''re forever gazing at ourselves and trying to ascertain
    what makes us different? We are great ingenious curious beings who pioneer into
    space and change the future, when really the only thing humans can do is that
    other animals cannot start from nothing. That seems to be the only thing — and,
