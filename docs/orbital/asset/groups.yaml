    they were before they came, whatever their differences in training or background,
    in motive or character, whatever country they fall from, they are equal here by
    the delicate might of their spaceship. Each each other’s unspoken rule. They are
    a choreography of movements and functions of the ship’s body:

    - Anton – quiet, and dry in his humour, sentimental, crying openly at films –
    the spaceship’s heart.

    - Pietro its mind,

    - Roman (the current commander, dextrous and capable, able to fix anything, control
    the robotic arm with millimetre precision, wire the most complex board) its hands,

    - Shaun its soul (Shaun there to convince them all that they have souls), Chie
