    of nature and his an artwork? The difference seems both trivial and insurmountable.
    She remembers walking around a wood with her father one winter’s day when she
    was nine or ten and there was a full-size tree that they almost walked straight
    past they realised it was man-made, it was a sculpture made from tens of thousands
