    Down over the arrowing peninsula of Dakar, crossing the equator, and in the closing
    minutes of day the lights of Brazzaville and Kinshasa on either side of the Congo
    River tepid in the dusk. Blue becomes mauve becomes indigo black, and night-time
    souths Africa in one. Gone is the paint-splattered, ink-leached, crumbled-satin,
    crumbled-pastel overflowing-fruit-bowl container of chaotic perfection, the continent
    of salt pans and red sediment floodplain and the nerve networks of splaying rivers
    and mountains that bubble up from the plains green and velvety like growth. Gone
    is a continent and another sheer widow’s veil of star-struck night.


    Roman and Anton are in the Russian model, Roman trying to find a loose screw that
    floated out of a pair of scissors and is now somewhere about his head; Anton is
    at the window looking nadir, legs aloft. There are the disappearing lights of
    Cape Town and storms over the ocean. Wherever you are at night over the earth,
    there’s somewhere the soft erratic pulse of lightning. Electric silver-blue silent
    flower opening and closing. Here, over there, over here.


    Absent Anton runs his fingers over a loop that’s appeared on his neck the last
    fortnight and he tries to obscure by raising the collar of his polo shirt. The
    last thing you need is to get in space. They’ll worry and send you home, and because
    you can’t fly back on your own, two others will have to go with you, and to cut
    short the missions of those two others would be unforgivable. He’ll say nothing
    to the flight surgeon or his fellow crew and he’ll hope nobody notices. It’s the
    size of a cherry in the low hollow of his neck, and perfectly painless.


    There’s wife at home, herself so long unwell, and he tells their children left
    nothing bad to happen to them ever, as if such a gift. He’s the vehicle that carries
    him all through darkness, and the weight that has borne him along years and years.
    But he, too, is preyed by darkness, as we all are. He never knew how to tell them
    that. He never knew how to say to his wife what he wanted amicably to say:'
  - '[PAGE 84]


    Zabudem, ladno? Let''s forget it, shall we? Let''s call it a day. We don''t love
    one another any more, when complicate what''s simple? When he found the lump those
    were the words that came straight to his mind. Zabudem, ladno? They were casual
    and easy in his head as if he were proposing to end an awkward conversation. They
    were light words and they ended the decades of struggle inside him, and he feels
    sure that in the saying of the words they will all be released – he, his wife,
    their children – they will be released from the darkness he is supposed to and
    could never save them from.


    The lovelessness of his marriage is a fact that has come upon him gradually, one
    gentle dancing after the other. When he''s seen through a telescopic lens of the
    flowlines made by ships patrolling the ocean, or the ancient shorelines of Bolivia''s
    bright orange Laguna Colorada, or the red sulphur-tipped tip of an erupting volcano,
    or the wind-cut folds of rock in the Kavir Desert, each sight has come to him
    the winching open of the heart, a crack at a time. He''d not know how capacious
    it was, the heart. Nor how in love he could be with a ball of rock; it keeps him
    awake at night, the vitality of this life. Then, when first caught the sight of
    the lump on his neck it seemed – though he can''t truly why – the logical culmination
    of all those windings, those realisations that he and his wife didn''t love each
    other and that life was too wide and too short. He felt since then resolved, in
    possession of a crucial new piece of information. Zabudem, ladno? he''ll say to
    his wife when he returns to earth and she''ll answer quickly without surprise
    and with a short nod, Ladno, proekali. Let''s so easy an answer to a question
    they hadn''t even known to ask. He tugs his collar stiffly until.


    When Nell sees the lights of Cape Town she thinks of the time she went there as
    a child. She doesn''t remember much of that, just, oddly, standing in a cobbled
    square in the heat with a tiny monkey on her shoulder, a monkey on a lead. Is
    that a real memory? She''s sure the monkey-on-the-shoulder is real, and she knows
    she went Cape Town, but she doesn''t know if the two things belong together.


    Pietro checks the news to see how the typhoon has come meteor; it unnerves him
    that they can no longer see it from their orbit. Meteorologists have decided upon
    calling it a super-typhoon; they speak of its rapid intensification that''s left
    everyone ill-prepared, and of the increased regularity of storms like these. He
    goes to the observation dome to take'
  - '[PAGE 85]


    photographs of the glistening sea and waxing moon, everything buffed and brushed
    and burnished. God lays the beams of his upper chambers on the waters. Psalm something-or-other,
    he remembers Shaun once telling him. And it does seem sometimes as though it could
    be true, this upper chamber pours light on the seas. He takes photographs; hundreds.


    What of the Filipino children and he his wife met on their honeymoon, the fisherman''s
    children? Their easy toothy grins, the scuffed knees and silky skin, their vests
    and flip-flops and dirty toes, their sing-song chatter, the bottomless brown of
    their lovely eyes, their incomplete trust of these invading beings who had come
    to dinner and made them slack-jawed at photos of people in spacesuits, this ripped
    Buzz Lightyear in an Armani T-shirt, like they knew and saw what their parents
    didn''t (or what their parents had chosen to overlook). That is, the tables would
    never turn; whatever universe Lightyear here and his tall-smelling and subtly
    pregnant wife had come from, they''d never see it, they''d never be sitting for
    dinner in the invaders'' home on a luxury holiday with that one-day same and for
    all their distrust, the same measure of utter acceptance, of brimming giving,
    the gifts of shells they''d found, a green baseball cap (which Lightyear''s wife
    wore for the rest of the evening), a plastic whistle in the shape of a donkey
    to give their baby when it was born. Where are those children now; are they somewhere
    safe?


    And then, when the day''s experiments are done, they all finish up the last of
    their tasks which is the rigorous documenting of their own selves; the appetite
    reports, the moon monitoring, the pulse measuring, the urine sampling. They each
    extract blood for the flight surgeon to analyse. This era is ebbing, Shaun thinks
    when he puts vials of blood in the centrifuge for stowage. He thinks: the days
    of this trusty spaceship are numbered now. Why be confined to an orbit two hundred
    and fifty miles above the earth when you could be two hundred and fifty miles
    above it? And that''s just the start. That''s just the moon. Then a habitation
    base around the moon, extended time spent there, with long-haul spacecraft refuelling.
    One day not so distant there''ll be men and women slingshotting out of the earth''s
    orbit and away, away, far past the six of them here, toward the beckoning red
    beacon of Mars.'
- md: '

    This six, those who''ve come before them, are the lab rats who''ve made all things
    possible. They''re the specimens and the objects of research who''ve forged the
    way for their own surpassing. One day their journeys to space will seem nothing
    but a coach excursion, and the horizons of possibility that open out at their
    fingers will only confirm their own smallness and brevity. They swim in microgravity
    like little watched fish. The heart cells they culture will one day be used to
    replace those of the slingshot astronauts for Mars. But not their own, which are
    fated to die. They take blood, urine, faecal and saliva samples, monitor their
    heart rates and blood pressure and sleep patterns, document any ache, pain or
    unusual sensation. They are data. Above all else, that means not an end.


    In its bareness, the thought brings them some relief from the anguish of space
    – the loneliness of being here and the apprehension of learning here. It was never
    really about them and it is not about them now – what they want, what they think,
    what they believe. Their arrival and their return. It''s about those astronauts
    on their way now to the moon, and the next men and women, the men and women who
    will one day be going to live on a new lunar station, who will go into deeper
    space, the decades of men and women who''ll come after them. Except it''s not
    even about that, it''s just about the future and the siren song of other worlds,
    some grand abstract dream of interplanetary life, of humanity uncoupled from its
    hobbled earth and set free; the conquest of the void.


    The six here might or not dream this dream too, and it doesn''t matter if they
    dream it, it doesn''t matter, so long as they comply and play their parts. And
    this they do gladly in day and out. They measure their grip. They sleep with their
    chests constricted by straps and monitors which hamper the breath. They scan their
    brains. They swab their throats. They pull the syringe from their overused veins.
    All of it gladly.


    Maddening things:

    - Forgetfulness

    - Questions

    - Church bells that ring every quarter-hour

    - Non-opening windows

    - Lying awake

    - Blocked noses

    - Hair in ducts and filters

    - Fire alarm tests

    - Powerlessness

    - A fly in the eye


    In the Russian quarters there is an inflatable globe that wafts above the table;
    a picture on the wall of the Urals and another of the cosmonaut Alexei Leonov
    and another of Sergei Krikalev; the table cluttered with work tools hastily Velcroed,
    a fork in an empty can of tuna, Roman’s amateur radius set-up. After more than
    twenty-five years and some one hundred and fifty tearing orbits, the module is
    becoming old and creaky and less flight-worthy. On the outer shell of the craft,
    a crack has appeared. Slender, but troubling.


    No gleaming capitalist Western space-dream here; no, a grey, utilitarian heftiness,
    a temple to sturdy engineering and the genius of the pragmatic. A time capsule
    of the post-Soviet era, the last echoes of a lapsed century. There is an attempt
    at home-making, to say this is a floor and is a ceiling and this is the right
    way up, to defy the spaceness of space that dominates the other modules where
    up and down and left and right are vanished concepts. Its stab at cosiness is
    in vain, there’s nothing cosy about Velcro walls and kilometres of cabling and
    flat buzzing light, and in the end it’s neither space-age nor domestic – more
    a subterranean bunker which, all the same, they hold in great affection – for
    their efforts for comfort, failed they argued.


    Here they gather this evening for dinner, the six of them, and Roman and Anton
    answer supplies from their larder – been soup, borsch and russolnik, pitted fish,
    olives, cottage cheese and cubes of dried bread.


    "Was it this morning that we talked about making the station look like a farmhouse?"
    Pietro says. "It feels two minutes ago or otherwise five years, I can’t decide.
    Maybe it’s the typhoon, he says. Way it’s tracked beneath us like some old-age
    beast."


    Anton, near the observation window, looks out instinctively but there’s no typhoon
    to see. He doesn’t know where they are, it’s all ocean and a silver night. It’s
    only when he spots a pinprick of light to starboard-side that he deduces Tasmania
    and gathers how far south they are now. The silhouette of the craft’s robotic
    arm cuts diagonally across his view.


    Nell brings a packet of chocolate-coated honeycomb that her husband sent up to
    her in the last resupply craft, because she was craving food that had a crunch
    and could not be scooped up with a spoon; he sent her three packs which she''s
    been working through in morsels, the pleasure of eating it almost trumped by the
    pain of its being gone. She shares out the last of it among the crew; this paltry
    hoarding, no good, she thinks. They speak about things they miss — doughnuts,
    fresh cream, roast potatoes. The sweets of her childhood.


    "I remember well going to the dagashiya as a child," Chie says. "We all went together
    after school, it was was like another world – when you walked in there was a big
    counter full of candy, and candy was hanging from the ceiling and on the walls,
    and the smell – the sweetness. It would make you faint if you stayed long enough.
    You would go in and ask for a mix. *Bontan ai*, some *ninjin*, some candy cigarettes."


    "We would have a ten-pence mix-up," Nell says. "If you chose carefully you could
    get sweets you could suck, and you could make them last all day."


    "Korova," says Anton, thinking of his dream. And Roman echoes, "Korova."


    "Were the sweets we had that?" Pietro says.


    "Oh, I loved those," says Shaun. "They were the best."


    "It''s all just convenience stores now," says Chie. "There are hardly any dagashiya
    left in Japan."


    Nell bats a piece of honeycomb from palm to palm and watches it glide like a shuttle.


    She fastens her chopsticks to the table and begins to talk about a memory of her
    mother climbing a mountain in Shikoko. She gestures the immensity of the mountain
    with her arms, and the napkin still clutches becomes a waving flag. She says how
    her mother arrived at the top of her, in the wind''s full fury, and raised her
    arms in excitement and called Chie-chan! I''m here, I''m up here! And that is
    the happiest memory she has of mother as an adult, when her mother was strong
    and full of joy. It was the safest and most loved I ever felt by her," Chie says.
    "When she called out Chie-chan! I''m up here! I can''t stop thinking of her. Of
    my mother and father in her garden."


    "My family have offered to wait and have the funeral when I arrive, but I didn''t
    want that, so it will be tomorrow," Chie says quite suddenly. "She says she''ll
    be to scatter the ashes later in the Shikoko garden by the sea."


    She falls quiet she tucks the napkin in her pocket. Maybe she''s never spoken
    about herself this much in her handful of months – nor in the years of training
    that went before. They''re all somewhat solitary and contained, but more than
    any of them. Anton finds himself crying,

