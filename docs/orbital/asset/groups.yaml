    so she wrote only to send love and attached a photo of the Severn Estuary at sunrise,
    one of the moon, one of Chie and Anton at the observation windows. She finds she
    often struggles for things to tell people at home, because the small things are
    too mundane and the rest is so too astounding and there seems to be nothing in
    between, none of the usual gossip, he-said-she-said, there is a lot of round and
    round. There is a lot of contemplation of how it’s possible to get nowhere very
    fast.


