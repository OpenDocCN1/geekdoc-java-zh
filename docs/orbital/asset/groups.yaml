    photograph, the only life form in the universe, is American. He remembers how
    his father would tell him stories about Russian landings, looping, detailed, extravagant
    tales that he had assumed, because his father told them, true, but which of course
    were fables. How powerfully did those fables impact him. When he asked his father
    if, when he grew up, could be the next Russian to go to the moon, his father said,
    he could, it was written in the stars. On that the moon''s surface, by the Russian
    flag, was a little box of Korovka, the milky sweet he liked, left by the last
    visiting cosmonaut. That box had his name on, that he would one day eat those
    Korovka.


