    A foot or beyond those four suspended crumbs is the photograph of Roman’s hero,
    Sergei Krikalev – thin, neat and inscrutable, small-eared, blue-eyed, slight melancholia
    about the face, a touch of the Mona Lisa smile. It was he, Krikalev, who was one
    of the first humans up here in this craft and he was first turned on the lights
    which ebbed through windows into the bare dark.


    He seems to know that something is ending, that good things must go this way,
    towards fracture and fallout. So many astronauts and cosmonauts have passed through
    here, this orbiting laboratory, this science experiment in the carefully controlled
    nurturing of peace. It’s going to end. And it will end through the restless spirit
    of endeavour that made it possible in the first place. Striking out, further and
    deeper. The moon, moon. Mars, the moon. Further yet. A human being was not made
    to stand still.


    Maybe we are the dinosaurs and need to watch out. But maybe against all the odds
    we’ll migrate to Mars where we’ll start a colony of gentle preservers, people
    who want to keep the red planet red, we’ll devise a planetary flag because that’s
    a thing we lacked on earth and we’ll come to wonder if that’s why it all fell
    apart, and we’ll look back at the faint dot of blue that is our old convalcing
    earth and we’ll say, Do remember? Have you heard the tales? Maybe there’s another
    parent-planet – earth is our mother and Mars, or somewhere, will be our father.
    We are not such orphans-in-waiting after all.


    Krikalev seems to look out from the photograph as a god looks on its creation,
    with a patient forbearance. Humankind is a brotherhood of sailors out on oceans.
    Humankind is not this nation or that, it is all together, always come what may.
    He sits in timeless stillness amid the module’s perpetual eighty-decibel vibration
    around him the green Velcroed flammable walls close in airlessly. And each day
    and week the crack on his hull widens and Krikalev’s smile seems more and more
    vaunted and more and more godly.


    Let there be, he seems quietly to say.


    Forty or fifty bodies are sheltered beneath the altar of a chapel that squats
    low among trees. Floodwater reaches to its roof. The mile of coconut plantation
    between here and the coast is submerged completely by the tidal surge, the buffering
    of the trees has saved this chapel; by design it has no windows along its east
    elevation which is toward the ocean and those elsewhere are so far spared. The
    chapel door strains but holds under the burden of water. The concrete walls crack,
    but they hold too. Hunks of plaster falling from the ceiling under the stooping
    timbers. A dead shark tumbles past the front window. The wind is ebbing. The people
    inside no longer hear slamming against the roof. If the building can withstand
    the flood for another few hours until the water recedes they will make it. They
    pray.


    It’s the Santo Niño’s saving them, they’re inclined to believe. Even the non-
    or religious think it now. Gathered around this little embroidered effigy of the
    child Jesus, praying and praying, praying for hours, turning away from the ocean
    that leans on the windows, whispering and muttering and clutching each other,
    they suppose they must be witnessing a miracle. They don’t know how the building
    could stand. It’s not possible. Far bigger and more robust buildings would have
    collapsed in the rampage of the typhoon. But if the Santo Niño remains in its
    glass casing intact too. They’ve taken it from its ledge and huddled and they
    aren''t move; somehow a few of their children who’d been wailing in fear are now
    sound asleep.


    The fisherman’s wife has one child in her cross-legged lap and another proposed
    against her. The other two are curled asleep with their heads in the fisherman’s
    lap, his right hand laid quietly on one forehead, left the other. His wife has
    a gash across her shoulder from a sheet of metal as they were fleeing, without
    complaint. An unearthly watery light fills the chapel, a smell of brine and wet
    wood. The children are safe. The sea has stopped surging, it rests exhausted.
    the Philippines and Indonesia are shrouded in fine arrangements of cloud in multiple
    vortices and eddies that soon will push westward. The typhoon has smashed itself
    to pieces against the land. The islands are smaller than they were several hours
    ago, misshapen by flood. The worst is gone.


    From the east shunts a bright front of unforgiving heat off the Pacific, which,
    from the last descent of this sixteenth orbit, is a glorious coppering of disbanded
    light. It isn’t earth, it’s only photons and it can''t be grasped and it can''t
    remain. It starts to unpick as night falls steep across the tranche of the Southern
    Pacific.


    One day few years hence, at this very spot in the Pacific that it''s passing now,
    this craft will bow graciously out of orbit and plummet through the atmosphere
    into the ocean. Submarines will go down to explore its wreckage; that''s another
    thirty-five thousand orbits away. This orbit reaches its deepest edge where auroras
    flicker Antarctica and the moon rises huge as a buckled bicycle wheel. It''s 5.30
    a.m. Wednesday morning; moon-landing day. The stars explode.


    Out here, electromagnetic vibrations ripple through the vacuum as bodies in space
    give out light. If these vibrations are translated into sounds the planets each
    have their own music, the sound of their light. The sound of their magnetic fields
    and ionospheres, their solar winds, the radio waves trapped between the planet
    and its atmosphere.


    Neptune''s sound is liquid and rushing, a tide crashing onto a shore in a howling,
    Saturn''s rings are different still, Uranus''s is a frantic, Jupiter''s moon,
    Io, makes the earth a magnificent symphony. The sound of the wind in the leaves,
    the city city in the distance.

