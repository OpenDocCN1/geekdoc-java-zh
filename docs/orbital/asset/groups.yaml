    当千智听到母亲去世的消息时，她立刻走向她在轨道上仅有的几件地球财产之一——那张母亲在离开这里之前留给她的照片。照片中，母亲站在他们家附近的海滩上。那时的她正值年华。二十四岁，在她生下千智之前，在她结完婚搬进那栋海边房子时。母亲站在沙滩上，穿着一件厚实的羊毛外套，尽管那是七月，天气一定很热。照片背面用父亲的笔迹写着“1969年登月日”。母亲正皱眉盯着天空，那里有一只海鸥掠过。当母亲的身影清晰时，海鸥是模糊的，狭窄而渺小。不清楚她的皱眉是为了那只鸟，还是为了那片她认为阿波罗号飞船可能所在的天空。


    对于小时候的千智来说，这张照片有一种她既理解也不质疑的力量。缺席的月球、缺席的着陆、那被宣告的正在发生的宏大盛事，但却远在彼方。遥远得带有神话色彩。登月日。她小时候想，母亲一定是在看着海滩，月球上正在发生什么，而母亲可以用肉眼看到它。或者母亲以某种方式参与了那场活动。直到母亲在这次任务之前把照片交给她，她才想起了那些念头，并感受到了这些想法的分量，以及过去的力量，以及过去塑造未来时是如此无声——正因为她在回望，这张照片才产生了她对太空的第一个想法。


    现在，照片的反面，“1969年登月日”下方写着句话，这次是母亲的笔迹：“给未来的以及以后所有的登月日。”当千智读到它时，这似乎完全不像母亲的作风，她不禁怀疑母亲是否可能预知了某些事，那是对自己死亡的预兆，并在离开前悄悄留下了一些情感。这个念头让她大脑空白。她想念母亲。她想念母亲的坚韧、直率和疏离。她预感到母亲是独一无二的。还有多少人曾在原子弹爆炸时躺在婴儿床上？寥寥无几。有多少人在那个可怕的八月因炸弹失去了母亲？母亲的生活是安静而静止的，一点也不像千智。想起来，她在海滩上的照片是那种生活的完美象征，世界在身边模糊流逝，而她保持静止。尽管她们的生活截然不同，但千智所有的勇气都归于母亲。母亲的韧性、脸皮厚度以及对任何事情的准备，即使是困难、痛苦或危险。她面对困难和危险的胆量与喜悦。她那测试飞行员的大脑，让她思考飞行、呼吸和梦想飞行。她与死亡之间的竞技性对斗，她正赢得那场比赛，这让她感到自己无所不能、坚不可摧。静静地、出人意料地鲁莽。


    她知道自己并非无所不能。但她出身于一个从历史裂缝中滑落的家族，一切都崩塌了。她的祖父在炸弹爆炸当天因工作劳累生病，带着婴儿离开了，而她的奶奶去市场了。奶奶没有留下遗骸。在祖父工作的长崎弹药工厂，几乎也没有什么人的遗骸，如果不生病，他本会在那里。在经历了多年的战争后，当时的日本每个人都身体状况不佳。每个人不是半挨饿，要么患有霍乱、痢疾、疟疾，或是任何在体内游荡且无药可救的老病毒或感染——她的祖父因为其中一种病毒已经不舒服了一段时间，那是他第一天请假。为什么是这样？如果他那天上班，他就会死。如果他留在家，婴儿就不会陪在他身边；如果那个婴儿——千智的母亲——那天去了市场，她短暂的生命就会终结，千智也就不会后后存在。他们的家族在命运的裂缝中侧向挪动生存。


    千智凝视着这张照片。她们曾把它挂家里的一面墙上；她记得母亲指着它说：“看，千千，那是我们去月球那天的我。”直到现在，她依然不知道自己在海滩“登月日”照片里看到了什么；她不知道该如何解读那个场景的奇异，以及图像与标题之间的不协调。她审视着母亲的脸，质问那个皱眉以寻找其含义的线索，但她不知道。她读出的一切都是事后诸葛的、叠加的、是对真实的猜测。为什么这张照片会在千智小时候挂在墙上？它有什么特别或有意义的地方？那是母亲在对女儿说：“现在我要让你看到你生命中可能的一切，人类——以及你——所能做到的是近乎无限的。”但那个皱眉，难道不是对可能或希望的表达吗？或者她在说：“这里有一些人到达月球——你看到或听到其中一个女性吗，更不用说是非白人种、非美国的女性了。你有没有注意到这是一群正处于男性气概巅峰的男人，带着他们的火箭、推进器、载荷，全世界的目光都盯着他们——这就是世界，一个男人的游乐场，一个男人的实验室，不要去竞争，因为任何竞争尝试都会让你感到沮丧、自卑和被毁灭，为什么要去跑一场你注定失败、永远无法赢得比赛呢？所以请记住，我的女儿，你不卑微，把这句话记在心里。”


    ## 轨道 6


