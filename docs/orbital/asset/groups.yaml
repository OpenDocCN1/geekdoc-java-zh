    # Orbit 6


    RUSSIAN COSMONAUTS ONLY, it says on the door of the Russian WC.

    Correspondingly on the US toilet door, AMERICAN, EUROPEAN AND JAPANESE ASTRONAUTS
    ONLY. Because of ongoing political disputes please use your own national toilet.


    The idea of a national toilet has caused some amusement among the crew. I''m just
    going to take a national pee, Shaun will say. Or Roman: Guys, I''m going to go
    and do one for Russia.


    You will have to pay us to use our toilet facilities, the Russian Space Agency
    has said to those of America, Europe and Japan, and so those agencies have responded
    in kind: go right ahead, our toilet is in any case better than yours. And neither
    can you use our exercise bike. Well you can''t access our food stores then. It''s
    been like now for over a year.


    On the craft''s internal cameras mission control watches the crew in flagrant
    disregard of these edicts and there''s no trying to make it different. Astronauts
    and cosmonauts are much like cats, they conclude. Intrepid, cool, and can''t be
    herded.


    We have all been travelling, the crew thinks, travelling for years with barely
    a moment of settling; all of us living out of bags and borrowed places, hotels,
    space centres and training facilities, sleeping on friends'' sofas in midway cities
    between one training course and another. Living in caves and submarines and deserts
    to test our mettle. If we have any single thing in common it''s our acceptance
    of belonging nowhere and everywhere in order to reach this, this near-mythical
    craft. This last nationless, borderless outpost that strains against the tethers
    of biological life. What'
