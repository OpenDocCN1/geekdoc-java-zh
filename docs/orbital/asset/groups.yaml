    What would you do? Nell asks.

    Chie winks. Yes, Pietro, what would you do?

    Lie there, Pietro says. And dream of space.


    Day comes at them in a barrage.

    Pietro will go and monitor his microbes that tell them more about the viruses,
    fungi and bacteria that are present on the craft. Chie will continue growing her
    protein crystals, and attach herself to the MRI to have one of many routine brain
    scans that show the impact of microgravity on their neural functioning. Shaun
    will monitor his thale cross to see what happens to plant roots when they lack
    the gravity and light to know when and how to grow. Chie and Nell will check the
    well-being of and collect data for their forty resident mice who are enlightening
    more muscle wastage in space, and later Shaun and Nell will conduct experiments
    on flammability. Roman and Anton will service the Russian oxygen generator and
    culture heart cells. Anton will water his cabages and his dwarf wheat. They will
    all report on whether they have headaches and in the head and how acute. They
    will all at some point take their cameras to the earth-viewing windows and photograph
    each of the locations that they’ve been given, in particular Of Extra-Special
    Interest. They will: change the smoke detectors, change out the Water Supply Tank
    in slot 2 and install a new tank in slot 3 of the Water Storage System, clear
    the bathroom and kitchen, fix the toilet-that-always-breaks. Their day is mapped
    by acronyms, MOP, MPC, PGP, RR, MRI, CEO, OESI, WRT for WSS, T-T-A-B.


