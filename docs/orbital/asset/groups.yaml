    # Orbit 5, descending


    The earth is a place of circular systems: growth and decomposition, rainfall\sand
    evaporation, alive with the cycling of air currents that shunt the weather

    around the continents.


    You know this of course, but in space you see it. The looping weather.

    This is what Nell could watch all day. A research meteorologist before she

    bec an astronaut, she has an eye for the weather. How the earth drags at

    the air. How we show the clouds at the equator are dragged up and eastward by

    the earth’s rotation. The most moist air evaporating off the equatorial

    ooceans and pulled in an arc to the poles, cooling, sinking, tugged back down

    a a westward curve. Ceaseless movement. Although, these words – drag,

    pull, tug – they describe the force of this movement but not its grace, not its

    what? Its synchronicity/fluidity/harmony. None of those is quite the word.

    It’s not so much that the earth is one thing and the weather another, but that

    they’re the same. The earth is its air currents, the air currents the earth, just

    a face is not separate from the expressions it makes.


    What expression is this then, that she can see now? This typhoon’s

    another ninety minutes bigger, ninety minutes bolder, and closer to land. It’s

    not anger, as people tend to say. It doesn’t look from anything like

    anger. More like defiance, strength, vivacity, the bulge-eyed tongue-out

    warrior face worn in the haka.


    She photographs the typhoon’s approach. It’s extraordinary how she can

    see the curving of air that forms the trade winds, its sluicing westwards

    along the equator, churning up warmth from the surface of the ocean; the

    resulting banks of cloud form drawing fuel from the ocean; the'
  - '[PAGE 53]


    warmer the ocean, the larger the storm. She knows all this but she''s never seen
    it so animate.


    It''s really something, this typhoon, Pietro says when he comes to join her. They
    watch it on in the Philippines and Taiwan and the coast of Vietnam. Its spiral
    flings clouds for hundreds of miles around a hole-punched siphoning eye.


    They seem fairly frail, don''t they, the Philippines, Pietro says. Little scraps
    of land that are first in line. They look like they could just wash away.


    Nell nods. I''ve been diving there several times, she says.


    I went to the Philippines on my honeymoon, he tells her. I went deep-sea diving
    in the Tubbataha reef, I''ve never seen a more incredible sight in my life, shapes
    colours and creatures I could never imagined. And I dived off the island of Samar,
    I made friends with a fisherman, my wife and I had dinner with his family.


    The people are amazing, Nell says, so warm and open. I went diving at Cor Bay
    among the wrecks, and at Barracuda Lake, and Malaspascua – we went out at dawn
    one day and saw manta rays and thunder sharks, the sharks are like sickles, like
