    flight simulations, their bodies delivered bumpily through the hatch, six of them
    suddenly in the same small space, a mass of amazed life. A flurry of handshakes
    and long embraces, of hellos and welcomes, of my God, can you believe this, of
    we made it, you made it, dobro pozalovat, welcome, welcome and welcome back. Whistling.
    Anton brought bread and salt as per the Russian tradition of hospitality. Or in
    any case crackers and salt cubes. They all partake.


    There were just moments of this and then before they knew it found themselves
    with a headset and microphone and on a screen were their families, beaming. Except
    that it''s not your family and it''s not your living room you see in the background,
    but something you knew from another life that comes to you now with a vague recollection.
    They stumbled through some words that were erased from memory as soon as they
    were spoken by their brains were hijacked and tumbling and they couldn''t see
    for tiredness and their limbs were asked. Even for Roman who''d been here twice
    before. It takes some adjustment. It gives your body a pumelling. The first dumbfound
    view of earth, a haunt of timeline, no a cantoupe, an eye, lilac orange almond
    mauve magenta bruised textured shellac-ed splendour.


    That night Roman''s felt moon spun in front of him in delirious sleep. He saw
    images of his son in states of need or peil. A pain in his forehead blew like
    a hatchet, and he worried that the sound of his vomiting would keep others awake.
    In the US section Shaun was worrying the same.


    In the morning everything, was everything, was new. Their clothes were creased
    from the packet, their toothbrush and towel in their cellphone. Their sports shoes
    crisp and roomy around their bloodless feet and the blood that was travelling
    upwards to shape their faces in a relentless expression of sleepy surprise. The
    earth outside was made that day and at the same time the oldest of things. Their
    minds were freshly minted. The sickness was gone, as if they''d been purged. Roman
    taught Nell and Shaun, who hadn''t been here before, the art of moving. Your body
    can float, can fly; not human! You can swim giddy through air. Just repeat the
    mantra as you go: slow is smooth and smooth is fast, slow is smooth and smooth
    is fast. By day by day the tethers of their lives have broken one after the other
    and everything they are now a new invention. That''s how it is, Pietro once told
    Roman, and he agreed, that''s how it is.'
- md: '

    Just a few weeks leaves you paler and thinner. If humans were to stay long enough
    in space would they eventually take on the form of something amphibious, Pietro
    wonders. He’s here now almost six months and has three months more. He thinks
    he’s becoming a tadpole, a head and no body. With the atrophying of the body life
    doesn’t tug him so much. He feels hungry so he eats, and the sinuses are so blocked
    that the food has no taste; there’s no real appetite, not deep or robust as it
    is on earth. He sleeps because he must, but his sleep is mostly tentative, and
    everything in his body seems to lack commitment to the cause of his animal life,
    as if it’s a cooling of systems, an efficient running-down of superfluous parts.
    In the slowing and cooling he hears his thoughts more, they’re distant bells chiming
    one at a time in his head. In orbit his sense of life is simpler and gentler and
    more forgiving, not that his thoughts are different but that his thoughts are
    fewer and more direct. They don’t avalanche like they used to. They come and they
    interest him for as long as they need and then they go.


    There were some nights, about a month in it, that he thought of his wife with
    an insane and afflictive longing, he thought of his bony nudity, tan lines, dark
    underarm hair, rack of ribs, tied wrists, sweat on her breasts in the siesta heat.
    The thoughts left him momentarily embered and drunk with longing. A week after
    that he did his spacewalk with Nell, and the next night she, Nell, appeared in
    a dream that involved some setting on earth he wasn’t familiar with, a room in
    absolute darkness that seemed cramped and, in his mind, panelled with wood, but
    in which Nell’s voice came from far away although her body was against him. It
    was so surprising to find her there that momentary ecstatic had gone through his
    core. There was a party happening out of sight – he could just hear the music
    but no real sense of where it was. He held her up himself and kissed her neck
    and repeated her name in awe. That’s all he remembers and the next day at breakfast
    he could barely look at her, so embarrassed she was.


    The dream hasn’t repeated, and it felt then that any note of sexuality in his
    body quietened. It seemed to understand there was no point, and a switch was flicked
    off, and all went blank and calm.


    ## Orbit 8, descending


    When Nell went freediving she would think: maybe this is how it is to be an astronaut.
    Now up here she sometimes closes her eyes and thinks: this is like diving. The
    slow suspended the body moves, calmly carried as if in water. And the way they
    move around the labyrinth of the spaceship as if around a wreck – the constricted
    spaces, the hatches and narrow tubes that warren this way and that in near-identical
    patterns, it''s hard to know where you started from or where the earth will be
    when you look out. And when you do look out any claustrophobia becomes agoraphobia
    in an instant, or you have both at once.


    She hauls cargo bags from one place to another. Everything burnable, nothing not
    to go back to earth, goes into stowage; bags of food waste, rubbish, used tissues
    and toilet paper and wipes, trousers, T-shirts, socks, underwear and towels, gym
    clothes steeps in weeks of sweat, old tubes of toothpaste, every packet of meal
    and drink they''ve had, nail and hair cuttings, all of it to go, eventually, into
    the resupply craft that arrives next week, so that it undocks in two months the
    lot will combust in the atmosphere, and any debris left will begin its long life
    of earth orbit. The task becomes blindly physical, shuffling cargo cubes about
    in a 3D puzzle. It''s like a caravan here; there''s too little room, everything
    is crammed everywhere, you push it down with your feet and fast before it can
    float away. When she passes Anton in a doorway they turn on their sides and glide
    front-to-front, her nose brushing the slight bulge of his belly.


    There was a caravanning holiday she had which couldn''t have been long before
    her mother died. Perhaps she was four or five. Just as she is now, her mother
    was shoving bags wherever they would go, in the small kitchen cupboards whose
    laminate was peeling off, in the trunks under the table seats, in the tiny bedroom
    wardrobe, in the overhead cupboards whose magnetic catches clicked (the sound
    all day long was click-click-click), her mother quietly industrious as if they
    were moving in, not on holiday. And they moved around and often, and there was
    a time ‘between homes’ as her father later said (where) she always imagined at
    some relative’s or a friend), but he didn’t mention a caravan and if they’d lived
    in one, for however long, she’d have surely remembered.


    A light outside – the late afternoon sobriety of what she knows instantly to northern
    Europe, complex with cloud, under which there are numberless shades of brown.
    The south coast of Ireland – where her husband is – and England portside; they
    skirt below these coasts before going south through the centre of Europe. There’s
    such unsteady to the way they orbit, the way they seem always to climb the pale
    crest of the earth, never to reach it. But going with such patience and purpose
    nevertheless. And as they traverse the colours, the browns lighter, the palette
    less sombre, a range of greens from the dark of the mountains to the emerald of
    river plains to the teal of the sea. The rich purplish-green of the vast Nile
    Delta. Brown becomes peaches plum; Africa beneath in its abstract batik. The Nile
    is a spilling of royal-blue ink.


    Her husband says that Africa from space looks like a late Turner; those near-seamless
    landscapes of thick impasto shot with light. He’d told her once that if he were
    ever where she is, he’d spend his whole time in tears, but he’d need firm ground.
    There are people like him (so he says) who complicate inner lives by feeling too
    much, and therefore need stability. A house, a field, for example.


    Nobody has limitlessness, she''d said without hesitation. I want to want to, he''d
    said. I want to be the kind of person who wants to go to Mars, but I''d go mad
    on the way, I''d be the one who cracked and threatened the mission, they''d have
    to euthanise me for the greater good. Come on, she''d said kindly (though in essence
    she thought he was probably right). The last of the cargo bags to move what she
    puts in the airlock, with the spacesuits – ghostly floating things, touched with
    the rawness of space. Will she ever go out in one of these? That was really like
    freediving, being outside of the craft. There was a time she went freediving at
    night through bioluminescence – stars spiking all around. Your lungs packed with
    air, your body and the water equalising and becoming continuous with one another,
    the mind tranquil and gathered.


    She and her husband exchange photographs almost daily; sometimes his view of the
    rough and the mountain and a bloodied sunset, sometimes a close-up of an icicle
    or sheep ear or flower or gatepost, sometimes the sea or the clouds reflected
    in the wet sand, once the night sky and a drawn circle where their spacecraft
    was travelling across – not visible in the photo but a caption: You Are Here.
    By the time you get this, he wrote in his message, you’ll have been round the
    world another eight or nine times. You’ve got to admit that it’s difficult, he
    said, having a wife flying above seventeen thousand miles an hour. Never knowing
    where she is or where to find her. In return she shows him pictures of the earth,
    of the stars and moon, of the sleeping quarters and crew mates and dinners and
    modules. Of Ireland, which is always at least under cloud. On her a bike in stark
    constantly stimulating fluorescent light, amid the clutter of cables, wires, experiment
    racks, cameras, ducts, vents, bars, hatches, switches, panels. The truth is, he
    knows where to find her. Her exact location is a publicly known and closely mapped
    fact, a set orbit predictable to the millisecond. She could be in any of the seventeen
    modules, but nowhere else.

