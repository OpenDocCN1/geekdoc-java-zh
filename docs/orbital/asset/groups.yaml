    the sand, algae, coral and phytoplankton make the water luminous with a spectrum
    of greens – except now there''s tumbled broken-up storm cloud and the usually
    tranquil view is weary and troubled. As they ascend India''s east coast the clouds
    are thinning; morning strengthens, is briefly stark, and then a haze moves in
    at the Bay of Bengal, the clouds wispy and numerous and the Ganges silt estuary
    opens into Bangladesh. The umber plains and ochre rivers, burgundy valley of a
    thousand-mile ridge. The Himalayas are a creeping hoof frost; Everest an indiscernible
    bluff. Everything beyond them, which caps the earth, is the rich brown of the
    Tibetan Plateau, glacial, river-run and studded with sapphire frozen lakes.


    Up now and diagonally across China''s great mountains, the faint smudge of rust
    that is the extraordinary autumn bloom of the Jiuzhaigou Valley and then the Gobi
    Desert in seeming plainness, except in looking closer there are the fearless brushstrokes
    of a painter who sees in the movement of water and sees in brown bolts of duck-egg
    mauve and crimson, and casts the arid in shades of oil spill, and of canyons nacreous
    shells. On it presses, the northward orbit, into North Korea and above Hokkaido.
    Japan is a wisp trailing into a vanishing point. It was eleven orbits and sixteen
    hours ago that they passed it, and this time they skim it going up, across the
    arm of Russian islands that sweep along the Pacific ridge, over the Bering Sea.
    Now the land falls away like a silken slip.


    There is the feeling of climbing over the continents, climbing up and over the
    crest of the earth. Up and over the North Pacific in a clean arc. Though their
    orbit proceeds in a straight line around the planet, the’s turn makes the orbital
    path appear to loop up down, north and south in deep undulations, from the rim
    of the Arctic Circle to the southern seas. And now, at its northernmost point,
    it dips again. Far off to the left is the smooth, crisp bon of ice that marks
    Alaska. A cloud-free confection of crackable white. When the cloud accrues further
    south, the whole of the view is a liquid swirl of ice floe and cloud. The long
    tail of the Alaska Peninsula. A glimpse of land, fjord and inlet. Mountain range
    thinning. The coast of Canada portside not a coast at all but a land that’s been
    sledgehammered into random pieces.


    Before they came here used to be a sense of the other side of the world, a far-away-and-out-of-reach.
    Now they see how the continents run into each other like overgrown gardens – that
    Asia and Australasia are not separate at all but are made continuous by the islands
    that trail between; likewise Russia and Alaska are nose to nose, barely a spit
    of water to hold them apart. Europe runs into Asia with not a note of fanfare.
    Continents and countries come one after the other and the earth feels – not small,
    but almost endlessly connected, an epic poem of flowing verses. It holds no possibility
    of opposition. And even when the oceans come, and come and come in a seamless
    reel, there''s no sense of land or anything polished blue, and every country you''ve
    ever heard seems to have slid into the cavern, even then there''s no waiting for
    anything else. There is nothing else and never was. When land comes again you
    think, oh yes, as if you''ve woken up from a captivating dream. And when ocean
    comes again you think, oh yes, as if you''ve woken up from a dream, until you''re
    so dream-packed that you can find no way out and don''t try to try. You''re just
    floating and spinning and flying a hundred miles deep inside a dream.


    The night is over. Off to the east, where the horizon is blurring. Not here yet
    but they''re tracking closer. The Pacific below, and falling away in warped curve
    are closer the Sierra Nevada, and if you looked through a lens you''d see far
    off, San Francisco, Los Angeles, imprinted on a landmass that''s imprinted on
    sea, a coastline drawn in sharp-tipped white, a greyish hue of shrunkenland. The
    fertile coastal plains of Baja California. Then they too warp away.


    The night is over. Off to the east, where the horizon is blurring. Not here yet
    but they''re tracking closer.


    There are times when the rapidity of this passage across the earth is enough to
    exhaust and bewilder. You leave one continent and are the next within quarter
    of an hour, it''s hard to shake the sense of vanished continent, it sits on your
    back, all the life that happens there came and went. Days and nights, seasons
    and dictatorships. It''s only when night you sleep that you''re relieved of this
    treadmill. And even when you sleep you feel the earth turning, just as you feel
    it there. You feel all the days that break through your skin, and if the earth
    were to pause for a second in its orbit, you''d wake with a start knowing something.


    Forty minutes have passed since dawn and sidling in from the east is the shadow
    of night. It seems not much, portside smudge. Blue has turned purple but that''s
    about it. Green has turned purple, white has turned purple, or what''s left of
    it. No, America has gone. Night has unraveled the earth''s blue-green weave. The
    equator is crossed again from north to south the moon is dusky and one degree.
    Suddenly now, as if displeased, the sun swipes daylight off the face of the earth
    and stars burst like snowdrops from God knows where. In their sleep the crew felt
    the abrupt weight of night – that great bulb of a planet. They fall a notch deeper
    into Ocean now off the shores of Ecuador where Quito and Lima herald the land.
    There are a thousand miles of lightning zapping the coast, and a two-mile trail
    of nimbus cloud that sits on the sea, and a four-thousand-mile rampart of mountain.
    And in the densest dark where there are no cities, a thousand-mile patchwork of
    orange dots where the rainforest burns.


    Twelve million lives are nestled below in Buenos Aires, where suburb gives to
    farmland to black, and where river gives to ocean, and the high Antarctic Circle.
    Tucked under the belly of the earth, in all these hectares of night, is the odd
    ambience of the South Pole in twilight, but here at these northerly latitudes
    the sky is thick and full of galaxy. You are looking now straight into the heart
    of the Milky Way, whose pull is so strong and compelling that it feels the orbit
    will detach from the earth and venture there, into that deep, dense mass of stars
    give off their own light, so that it''s no longer to speak of darkness. Now is
    the long pass of the South Atlantic uninterrupted by land for some two thousand
    miles until the southernmost tip of Africa. But if the crew were watching and
    adjusted their eyes, there''d be no sense of emptiness, only the immense consolation
    of that which they could never fathom or comprehend. And it''s through this night
    that their craft sails for a time, lost in the world. When the lights of Cape
    Town come they''re a talon that marks the beginning, or end, of a continent of
    several thousand miles. The ascending orbit moves up its coast, Mozambique, Tanzania,
    Kenya, Somalia. Africa is dusty brown in the moonlit night, sparsely clouded,
    and electrified by lightning across its breadth. Its city lights are discrete
    and scant. Maputo here, Harare there, Lusaka over there, Mombasa ahead, and each
    is a small heap of gold coins on a tapestry cloth, joined by nothing – no night-lit
    roads or urban sprawl. A beautiful velvet poetry of man on an earth that tips
    into the void; you feel fall off, except with each new moment there''s more earth,
    and follow its trail across the Gulf of Aden to the Middle East. The lights of
    Salalah on the Arabian Sea, electric screech in soft swirling desert, and a minute
    earlier Abu Dhabi, Doha, Muscat would have befelled the fair cost but time is
    up – the sun is coming one more time and a shank of silver skewers the night.
    The crew''ve been thousands of sunrises when they''ve in space, and of those watched
    hundreds, and if they were awake now they''d float from their quarters and watch
    another. They don''t know how it can be their view is so endlessly repetitive
    and yet each time, every single time, newborn. They''d open the shutters of the
    domed windows, and become aware of themselves as a solitary head and torso in
    the vacuum of space. Suspended in a little pocket of breathable air. A sense of
    gratitude so overwhelming that there''d be nothing they could do or about it,
    no word or thought that could be its equal, so for a moment they''d close there
    on the inside of the eyelids, a vivid and geometrically perfect sphere, and they''d
    have no idea if this was simply an after-image or a projection of the mind, which
    knew that planet well by now that it could draw it without reference. With each
    sunrise nothing is diminished or lost and every single one staggers every time
    blade of light cracks open the sun explodes from it, a momentary immaculate star,
    then spills its light like a pale uniped, and floods the earth, every time night
    becomes day in a matter of a minute, every time the earth dips through space like
    a creature diving and finds another day, day after day again from the depth of
    space, a day ninety minutes, every day brand new and of infinite supply, it staggers
    them.

