- md: '

    comes with a few pumpkins sprawling stems. Mildew on the stems and the wooden
    door frame and the wooden step; a morning dampness to the paper screens. The most
    beautiful evening skies of late. The woman lies on one of the narrow steps, she
    is narrow too, a broomstick is how she sees herself. All this woodenness around
    her and no human beings, so she has turned to so as not to be outdone.


    You know sometimes when a day is your last and she would never in a million years
    lie outside like this in the early evening on her step in some gesture of late
    abandon, minor rebellion – a tough old broomstick, she. Dislikes nonsense. Her
    blood has slowed and everything has slowed. She has not felt well these last weeks.
    She has looked to see the moving point of light in the sky that, since her husband''s
    death, has made nearly sixty thousand orbits of the earth and she has thought
    she would try to wait another month for her daughter to come back. But since when
    did death wait, and what sort of a homecoming would it anyway? To die on her daughter''s
    arrival on her. Her extremities feel suddenly hot, like her heart is trying to
    send the blood away from itself. Let me rest, her heart is saying. She hears a
    cicada, never before you would hear a cicada this late in the year, so warm now
    all the time they don''t know when to die. It sounds like one long lingering male,
    and perhaps she would linger if she''d been buried underground for fifteen years
    awaiting her turn to mate, but now his call isn''t one of mating but of solitude,
    a leave-me-be, just that one call in the quiet dusk.


    Track the days forward one and again then three and four, and the body has been
    taken from the step and the house is deserted. From invisible light in the dull
    evening sky, where the woman''s daughter is stationed, Asia slides away to the
    starboard side. Shikoku and Kyushu pass beneath, and everything else is ocean;
    the same ocean raids the shore by the wooden house, getting closer to the garden
    that last decade, where the pumpkins are starting to soften. The last of Asia
    is gone to the west and the aft and there''s nothing all except the deep trench
    of the Pacific, and their orbit presses south-east for countless empty miles.


    There, in that emptiness, the typhoon is organising. For the last twenty-four
    hours it''s been shifting west, by now past the Marshall Islands, that fragile
    tracing of sinking lands so piecemeal and storm-worn. First some clumping of high
    drifting cloud, the clouds congregating from all directions, denser and darker;
    not one storm but a collision of several, and it''s clear now that the cloud is
    muscling and spiralling into what could be at the very least a Category Four typhoon.


    Take as many photographs as you can, the crew is told, they do, long lenses against
    the glass, shutters stuttering, seeing only the eastern arm of the storm so far,
    off to starboard where it wraps itself against the earth''s horizon in flocks
    of spun grey; seeing in detail what nobody on earth can see – how the clouds are
    ordering themselves anticlockwise, a whipped-up windy march. Sunlight rebounds
    off the cloud''s milky cover and the earth with the eerie pale-glow of an eye
    shot with cataracts. It seems to fix them with an unsteady stare.


    How wired and wakeful the earth seems suddenly. It''s not one of the regular typhoons
    that haphazardly assault these parts of the world, they agree. They can''t see
    it all, but it''s bigger than projections had previously thought, and moving faster.
    They send their images, the latitudes and longitudes. They are like fortune tellers,
    the crew. Fortune tellers who can see and tell the future but do nothing to change
    or stop it Soon their orbit will descend away to the east and south and no matter
    how they crane their necks backward at the earth-viewing windows the typhoon will
    roll out of sight and their vigil will end and darkness will hit them at speed.


    They have no power – they have only their cameras and a privileged anxious view
    of its building magnificence. They watch it come.


    ## Orbit 4, ascending


    In the new morning of today’s fourth earth orbit the Saharan dust sweeps to the
    sea in hundred-mile ribbons. Hazy pale green shimmering sea, hazy tangerine land.
    This is Africa chiming with light. You can almost hear it, this light, from inside
    the craft. Gran Canaria’s steep radial gorges pile the island like a sandcastle
    hastily built, and when the Atlas Mountains announce the end of the desert, clouds
    appear in the shape of a shark whose tail flips at the southern coast of Spain,
    whose fin-tip nudges the southern Alps, whose nose will dive one moment into the
    Mediterranean. Albania and Montenegro are velvet soft with mountain.


    Where do the boundaries sit, Shaun thinks as he moves past the window. He tries
    to place it all – Montenegro, Serbia, Hungary, Romania, he can never remember
    the exact arrangement. You could spend your days, your ever orbiting life, with
    Rand McNally Atlas and your maps of the stars. You could do no work whatsoever.
    You could abandon it, just to look. You could know the earth inside out, in its
    little hollow of space. You could never comprehend the stars, but the earth could
    know in the way you know another person, in the way he could quite studied and
    determined to know his wife. With a yearning that''s hungry and selfish. He wishes
    to know it, inch by inch.


    In microgravity their arteries are thickening and stiffening and the muscle of
    the heart weakening and shrinking. Those hearts, so inflated with ecstasy at the
    spectacle of space, are at the same time withered by it. And when heart cells
    are damaged or depleted they don''t renew too well, so here they are, their own
    tender hearts waning and toughening while they try to preserve the heart cells
    in their dishes.


    In these dishes is humanity, Anton says to Roman in the Russian lab. The two of
    them move humanity about their pipettes. The pink-purple-red configuration of
    cells was once the skin taken from human volunteers, the skin cells reverted back
    to stem cells, the stem cells into heart cells. The skin samples were taken from
    people of different ages, backgrounds, races. This is quite astounding to Anton
