    绘画，而他正在画的是国王和王后，但他们在画作之外，就在我们所在的地方，正向内看。我们知道他们在那里的唯一方式，是因为我们在正前方的一面镜子里看到了他们的倒影。国王和王后正在看到的正是我们正在看到的——他们的女儿和她的侍女们，这也是这幅画的名字——《宫廷侍女》（*Las
    Meninas*，意为“侍女们”）。那么，这幅画真正的主体是什么呢——国王和王后（他们正被画着，他们的白脸虽然很小，但位于背景中心），他们的女儿（她是中间的明星，在幽暗中是如此明亮、金发），她的侍女们（还有侏矮人、监护人和狗），背景门框处一个正迈步的行秘男子，他似乎正要送来一个消息；委拉斯奎斯（他作为画家的身份通过他出现在画中得到了证实，他正坐在画架前画一幅国王王后的画像，但那幅画也是《宫廷侍女》本身）。或者，是我们这些观众，占据了与国王王后相同的位置，我们正向内看，并且同时被委拉斯奎斯和小公主注视，并通过倒影被国王和王后注视？或者，主体是艺术本身（它是生活中的一系列幻象、技巧和人工手段），还是生活本身（它是一个试图通过感知、梦境和艺术来理解生活的意识中所产生的系列幻象、技巧和人工手段）？或者——老师说——这仅仅是一幅关于虚无的画？只是一个有着几人和一面镜子的房间？


    对于十五岁的肖恩来说，他不想上艺术课，并且已经知道想成为一名战士，这节课简直是徒劳的极顶点。他并不喜欢这幅画，也不在乎它画的是什么。也许那只是一个有几人和一面镜子的房间，但他甚至没闲工夫去举手说出这种话。他在笔记本上画着一些几何形状的涂鸦。然后，他画了一个被吊的人。坐在他旁边的女孩看到了这些涂鸦，戳了戳他，挑起眉毛微笑，那是一个微小而逃避的微笑。多年后当她成为他的妻子时，她给了他一张《宫廷侍女》的明片，对她来说，那是他们第一次真正交流的象征。多年以后，当他远在俄罗斯准备进入太空时，他在明片背面用密密麻麻的字体写下了老师所说一切的精要，他早已完全忘光，但她却记得如此清晰，这种清晰度让他并不意外，因为她是他见过的最敏锐、最清醒的人类。


    他在船员宿舍里留着那张明片。今天早上当他醒来时，发现自己正盯着它看，盯着妻子在背面写的关于主体和视角的所有可能性。国王、王后、侍女、女孩、镜子、艺术家。他凝视的时间比他意识到的要长。有一种未完成之梦的残存感，思绪中有些狂野。当他爬出睡袋，穿上跑步服去厨房喝咖啡时，他看到了阿曼进入波斯湾的另一个独特地标，阿拉伯海阿拉伯阿拉伯海面上方的尘云，巨大的印度河河口，以及他所知道的卡拉奇——在白天是不可见的，但在夜晚却是一个巨大的、复杂的、交叉线条的网格，让他想起了以前画的那些涂鸦。


    根据他们在这里使用的、被摧毁的任意时间标准，现在是清晨六点。其他人正在起床。


    他们向下望去，理解了为什么地球被称为“大地之母”。他们不时会感受到。他们都会将地球与母亲联系在一起，这反过来让他们觉得自己像孩子。在他们剃得干净的胡须的中性波波头中，在他们普通的短裤和易用勺舀的食物中，在清晨、用吸管喝的果汁中，在生日彩带中，在早起、在那些被迫尽责的夜晚里，他们在这里共同拥有一种被突然抹除的童年感和渺小感。透过高耸入云的圆顶。


    但现在，更是如此。自从琪来到周五厨房做晚餐时，她脸色苍白，说道：“我妈妈去世了。”肖恩松掉了手中的那包面条，让它漂浮在桌子上，皮特罗向她走过了三步，低下头，握住她的只手，动作流畅得让你以为他已经准备好了，而内尔喃喃了一句听不清的话——什么？怎么了？*什么？*
    看着琪的脸脸突然变得通红，仿佛这些话带给了她痛苦。


    自从那个消息，他们发现自己在俯视地球，正如他们绕着地球运行（看起来是漫游的，尽管事实并非如此），还有那个词：母亲，母亲。琪现在唯一的妈妈是那个旋转的、发光的球，它不由自主地绕着太阳运行。琪成了一个孤儿，她的父亲已经去世十年。那个球是她现在唯一能指着的东西，它带给了她生命。没有它，就没有生活。没有那颗行星，就没有生活。显而易见。


    （注：原文第12-14页存在大量重复和乱码，已进行清理）。


