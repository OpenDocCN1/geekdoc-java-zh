    # Orbit minus 1\n\nRotating about the earth in their spacecraft they are so together,\
    \ and so alone, that even their thoughts, their internal mythologies, at times\
    \ convene. Sometimes they dream the same dreams – of fractals and blue spheres\
    \ and familiar faces engulfed in dark, and of the bright energetic black of space\
    \ that slams their senses. Raw space is a panther, feral and primal; they dream\
    \ stalking through their quarters.\n\nThey hang in their sleeping bags. A hand-span\
    \ away beyond a skin of metal the universe unfolds in simple eternities. Their\
    \ sleep begins to thin and some distant earthly morning dawns and their laptops\
    \ flash the first silent messages of a new day; the wide-awake, always-awake station\
    \ vibrates with fans and filters. In the galley are the remnants of last night’s\
    \ dinner – dirty forks secured to the table by magnets and chopsticks wedged in\
    \ a pouch on the wall. Four blue balloons are buoyed on the circulating air, some\
    \ faint bunting says Happy Birthday-a celebration and it was all they had. There’s\
    \ a smear of chocolate on a pair of scissors and a small felt moon on a piece\
    \ of string, tied to the handles of the foldable table.\n\nOutside the earth reels\
    \ away in a mass of moonglow, peeling backward as they forge towards its edeless\
    \ edge; the tufts of cloud across the Pacific brighten the ocean to cobalt. Now\
    \ there’s Santiago on South America’s approaching coast in a cloud-hazed burn\
    \ of gold. The winds across the warm waters of the Pacific have worked up a storm.\
    \ The typhoon moves west towards Asia, their craft tracks eastward and down towards\
    \ Patagonia where the horizon is a binary star. Just beyond the hoop of the atmosphere\
    \ is the sun, and in the next minute it will clear the horizon, and dawn will\
    \ come and go in a matter of seconds before daylight is everywhere at once. Central\
    \ and East Africa suddenly bright and hot.\n\nToday is his four hundred and thirty-fourth\
    \ day in space, a tally arrived over three different missions. He keeps close\
    \ count. Of this mission it’s eighty-eight. In a single nine-month mission there\
    \ are in total roughly five hundred and forty hours of morning exercise. Five\
    \ hundred and afternoon meetings with the American, European and Russian crews\
    \ on the ground. Four thousand three hundred and twenty sunrises, four thousand\
    \ three hundred and twenty sunsets. Almost one hundred eight million miles travelled.\
    \ Thirty-six Tuesdays, for all that, this being one. Five hundred and forty times\
    \ of having to swallow toothpaste. Thirty-six changes of T-shirt, a hundred and\
    \ thirty-five changes of underwear (a fresh set of underwear every day is a storage\
    \ luxury that can’t be afforded), fifty-four pairs of socks. Auroras, hurricanes,\
    \ storms — their numbers unknown but their occurrence certain. Nine full cycles,\
    \ of course, of the moon, their silver companion moving placidly through its phases\
    \ while the days go awry. But all the same moon seen several times a day and sometimes\
    \ in strange distortion.\n\nTo his tally kept on a piece of paper in his crew\
    \ quarters, Roman will add the eighty-eighth line. Not to wish the time away but\
    \ to try to tether it to something countable. Otherwise – otherwise the centre\
    \ drifts. Space shreds time to pieces. They were told this in training: keep a\
    \ tally each day when you wake, tell yourself this is the morning of a new day.\
    \ Be clear with yourself on this matter. This is the morning of a new day.\n\n\
    # Orbit 1, ascending\n\nRoman wakes early. He sloughs off his sleeping bag and\
    \ swims in the dark to the window. Where are we? Where are we on earth? The southern\
    \ hemispheres are fleeting away. You're bound to Coordinated Universal Time, ground\
    \ crews tell them. Be clear with yourself on this matter, looks out at your watch\
    \ to anchor your mind, tell yourself when you wake up: this is the morning of\
    \ a new day.\n\nAnd so it is, in this new day they'll circle the earth sixteen\
    \ times. They will see sixteen sunrises and sixteen sunsets, sixteen nights. Roman\
    \ clasps the handrail to the window to steady himself; the days rush. \n\nAnd\
    \ so it is. But it's a day of five continents and autumn and spring, glaciers\
    \ and deserts, wildernesses and warzones. In their rotations around the earth\
    \ in accumulations of light and dark in the baffling arithmetic of thrust and\
    \ attitude and speed and sensors, the whip-crack of morning arrives every ninety\
    \ minutes. They like these days when the brief bloom of daylight coincides with\
    \ their own.\n\nIn this last minute of darkness the moon is near-full and low\
    \ to the glow of atmosphere. It's as if night has no idea it's about to be obliterated\
    \ by day. Roman has a sense of himself a few months hence staring from his bedroom\
    \ window at home, flowers beside his wife's array of dry – to him unnamed flowers,\
    \ leaning into the Moscow air, and seeing it, the same moon, like a souvenir he's\
    \ brought back from a holiday somewhere exotic. But it's just for a moment and\
    \ then the sight of this moon from the space station – lying squashed and low\
    \ beyond the atmosphere, not really above them but across, like an equal – is\
    \ everything, and that brief comprehension he had of his bedroom, his home, is\
    \ gone.\n\nIt's a painting inside a painting, his teacher had said look closely.\
    \ Look here. Velázquez, the artist, is in the painting, at his easel, painting\n"
