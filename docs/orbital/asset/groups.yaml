    to flee. Flee to where? It isn''t like that. You have your life and it can''t
    be moved.


    Up ahead is the Terminator, sharp boundary line between day and night that falls
    across the full girth of the planet. It slices Papua New Guinea in two. This half
    is daylight, that half dark.


    The island''s day-lit half lies lush and dragon-like, its mountains mythical in
    the long last light, its coasts outlined by bioluminescent shores. Its dark half
    is a shadow on royal blue water. An electric light or two on the coast. The craft
    slides south-east into the thick dark, the Solomon Islands, Vanuatu, Fiji, flecks
    of pale gold. Boeing away to starboard Canberra, Sydney and Brisbane in delicate
    solace, then very much nothing for the shuttle-woven tip of New Zealand which
    punctuates fiery southern seas.


    At this time of year there are fewer than six hours of absolute night over these
    more northern regions of Antarctica, and the rest is day and shades of twilight.
    Now is that steep night. In an Antarctic research base some migration biologists
    have just set up camp for the annual arrival of Arctic terns. They''ll have flown-to-pole,
    these scant birds. They''ve digested some of their internal organs to become long-distance
    athletes and travel some thousand miles. The beginning of October now, the Antarctic
    breaking free of what has a long tenacious dusk, teeming below the ice. And those
    biologists will wait until bolts of white appear and the sky is filled with the
    sharp kip and cap of a coming flock. But now in the narrow interval of darkness
    the biologists come out to see something else. They don''t even need to look up
    to know it''s there. Around their base is a ring of green. The Martians are coming,
    they say. They stamp their feet on the lunar-like snowflake while red light splits
    open the Milky Way.


    From up here in space where Roman glances out in passing through the dome of windows,
    the view is at first indistinct. It takes a moment to orientate. An expanse of
    wintry nothingness, pearly cloud cover, and then the familiar gleam of ice-sheet
    sloping off the Antarctic Circle. Starboard, the Seven Sisters directly bright.
    Sometimes there are urges to see a particular thing – the Pyramids or the New
    Zealand fjords or a desert of sand dunes that are bright orange and entirely abstract
    and which the eye can''t fathom – the image could just as easily be a close-up
    of one of the heart cells they have in their Petri dishes. Sometimes they want
    to see the theatrics, the opera, the earth''s atmosphere, airglow, and sometimes
    it''s the smallest things, the lights of fishing boats off the coast of Malaysia
    dotted starlike in the black ocean. But now Roman can begin to see what he suspected
    was there, a thing they all know, with a kind of sixth sense, is there – the flexing,
    morphing green and red of the auroras which snake around the inside of the atmosphere
    fretful and magnificent like something trapped.


    Nell, he says, come quick. Nell, come quick. Nell, he says, come quick. Nell,
    come quick. Nell, he says, come quick. Nell, come quick. Nell, he says, come quick.
    Nell, come quick. Nell, he says, come quick. Nell, come quick.


    # Orbit 5, ascending


    A fortnight or so ago, Anton had a dream about the imminent moon landing. In fact
    he had two dreams in two consecutive nights, both very similar (which is typical
    of his brain, make technical repeats of the same dream as if to test its efficiency).
    It isn''t that, being a cosmonaut, he normally dreams out the moon or space –
    on the contrary, being a cosmonaut he normally has very practical dreams about
    how to use a wrench to get himself out of the small window on fire. Training dreams.
    But lately his nights are flooded with images, his dreams odd and wistful as if
    they are not really his but someone else''s. And now this repeated one, no doubt
    because of those astronauts who left Cape Canaal yesterday. He dreamed – of all
    things, of all damned things – of the infamous image taken by Michael Collins
    during the first successful mission, back in 1969: the photograph of the lunar
    module leaving the moon''s surface, and of the earth beyond, a blue half-sphere
    hanging in all blackness and bearing mankind. No Russian should be swept in these
    thoughts. There is no talk of it on their side and the silence is wholly begrudging
    – the thirteen, fifteen and sixteenth Americans to land on the moon''s hallowed
    dusted crust, and yet not still a single Russian boot. Not one. Not single Russian
    flag. No Russian brain dreaming about it, not this moon landing and not the first
    or the second or the third or fourth the fifth or the sixth, but how do you stop
    your dreams?


    In the photograph Collins took, there''s lunar module carrying Armstrong and Aldrin,
    just behind the moon, and some two hundred fifty thousand miles beyond that the
    earth, a blue half-sphere hanging in all blackness and bearing mankind. Michael
