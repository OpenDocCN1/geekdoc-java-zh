    ## 轨道 5，下降


    地球是一个充满了循环系统的地方：生长与分解，降雨与蒸发，在环绕大陆输送天气的气流循环作用下生机勃勃。


    你当然知道这些，但在太空中你可以看到它。循环的天气。这是内尔可以看一整天的。在成为宇航员之前，她是一名研究型气象学家，对天气很有眼光。地球如何拖拽空气。我们看到赤道的云如何被地球的旋转向上并向东移动。从赤道海洋蒸发出的潮湿空气被拉成弧形移向极地，冷却并下沉。


    尚通过地面小组与前往月球的宇航员朋友取得联系。他们像宇航员那样互相交流。“上升时有点颠簸，但现在飞得很顺畅。那里的风景真美。”他说他也去那里，这事半真半假。他比任何事情都想去，但他也想念他的妻子，无法忍受离她更远的想法。月球是亏月的，华丽而丰满。由于靠近大气，它的下半部分被压缩得变形，像一个坐垫。当他们向北飞越雪山、云雾缭绕的安第斯山脉时，出现了苍白的光，然后云层变薄，下方是亚马逊，被火灼得斑驳且疮痍。


    “你好吗？”罗曼对着口袋里的无线电，对着正在消失的澳洲大大陆说道，“你好吗（Zdraste）？”


    一个声音透过静电和划擦声艰难地传回来。“你在吗？你在吗，你好？”


    '
