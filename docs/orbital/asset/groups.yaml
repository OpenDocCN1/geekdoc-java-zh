    Pietro has had other missions and other spacewalks and run however thousands of
    thousands of experiments in his four-hundred-ish days in space, and there''s a
    sense of level-headed distance about it all, you run the experiment or install
    the unit or you collect the data and then you pass it on and move to the next.
    What are you anyway as an astronaut or a conduit – you are selected for your non-stick
    temperament, maybe one day a robot could do your job and maybe it will; you have
    to wonder. They do sometimes wonder. A robot has no need for hydration, nutrients,
    excretion, sleep, a robot has no irksome brain fluids or menstruation or libido
    or taste buds. You don''t have to fly fruit to a rocket or build it with vitamins
    and antioxidants and sleeping pills and painkillers, nor for a toilet with funnels
    and pumps that requires a training course to use, nor a unit that recycles its
    urine into drinking water, since it has no urine and it needs no water and it
    wants and asks for nothing.


    But what would it be to cast out into space creations that had no eyes to see
    it and no heart to fear or exalt in it? For years an astronaut trains in pools
    and caves and submarines and simulators, every flaw or weakness located, tested
    and winnow away until what''s left is a near-perfect unflappable triangulation
    of brain, limbs and senses. For some it comes hard and for others more easily.
    For Pietro, more easily; he is a natural-born astronaut, he has an equilibrium
    that has there since childhood, an extraordinary ease and presence of mind that
    made him bypass most of the shit-shifting tantrums of toddler-dom and rebellions
    of adolescence. A deep curiosity, a brain of architecture, a focus, an optimism
    and a pragmatism; an astronaut to his bones before he even knew what an astronaut
    was. But a robot, no.


    There in his chest is a heart that tilts and pitches. He can keep its beats slow
    and smooth, quell its habits of fear or panic or impulse, stop it yearning too
    much for home, curb its un impulses of abandon. Calm and steady, calm and steady.
    Metronome pacing out the breath. Yet still in it tilts and pitches. It wants what
    it wants and hopes what it needs and loves what it loves. So strenuously unrob
    is the astronaut''s heart that it leaves the earth''s atmosphere and it presses
    out – stops pressing in and the counterweight of the heart pressing out, as if
    suddenly aware it is part of an animal, alive and feeling. An animal that does
    not just bear witness, but loves what it witnesses.


    And so Pietro thinks about the spectrometer out there, which will help ascertain
    if the earth is dimming. Since he and Nell installed inside, he thinks about it
    each day when he wakes up, his lenses pointing three ways, to the earth, the sun
    and moon, measuring the light that is. Earth-bound astronauts, sailing past, and
    though their sleep was restless with anticipation, it wasn''t the moon they entered
    their dreams, but their own wild garden of space outside the spacecraft – the
    garden they''d all at some point walked in. And the ever-electric blue pull of
    the earth.


