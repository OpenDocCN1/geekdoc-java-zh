    彼特罗认为，有一个特别的渔民和他的家人，现在该走了，昨天就该走了。但去哪里呢？怎么去呢？对于那个渔民来说，有一种保护物品的冲动，不想离开你的东西，因为那是你在经历了最后一次台风、上一次以及再之前的台风后仅有的几件东西。距离台风袭击可能还有几小时，而你正处一个海洋中岛屿之又岛屿上，那里绝望地低洼。因此，你能做的只有绝望地躺着。你幸过了所有其他人。你拥有一间由锡皮、纸板、硬纸板和木棍做的房子，如今台风如此频繁，建造更好的房子毫无意义，与其留住某些东西，不如变得无可失去。


    所以你留下了。你抬头望向动不安的夜空，你那位忙碌无果的宇航员朋友在那里度过余生，并给你发来关于萨马尔（你的岛屿）在青绿色海域中的疯狂照片。他会叫你离开。现在任何时候你都会看到手机，收到一条告诉你离开的信息。他会告诉你，如果需要，他可以找人安排，去买航班。


    你的妻子小心翼翼地说，他是个好人，事实确实如此。一个最善良的男人。每个月给你的孩子寄学费，而且他只见过你一次面，是在一次潜水旅行中（这鬼的竟然是他的蜜月），而你在你的渔船上。你掉掉了割线刀，它瞬间没入水底，那把刀花了你十美元，它非常好又锋利。这时，宇航员和他的妻子浮出水面，他们一直在海豚跳跃之远的浅滩间潜水，看到你正趴在船边向下看。他们争留了十五分钟，在找到你的刀之前拒绝离开，坚决地拒绝。“没关系的，”你举起手示意道，“别麻烦了。”但他们确实费心了，并奇迹地在二十五米下的岩石间找到了它。


    一个宇航员和一个渔民。这是何怎样的世界的碰撞。他带着妻子来吃晚餐，迷迷了你的孩子，并对你的纸板房子施了神奇的咒，仿佛他那天下午直接从空间本身降临的。尽管你妻子天生的疑虑从未完全消除，但她大多被说服了。甚至你拍的所有照片都带有一种神奇的色彩——你妻子面容喜悦，你你自己，神情严峻如狮子，四个孩子（坐着的、站着的、惊讶的、平静的、微笑的、抓着的）一种整体的美感——这让你在最初就开口了。


    你现在手里拿着那张照片。如果你们都要逃离这场风暴，你会带这一张，宇航员的照片。但你并不打算逃离。逃到哪里去？不像那样。你有你的生活，它无法被移动。


    前方是晨明线，昼夜交替的界线，横跨整个行星的周长。它切分了巴布亚新几内亚，那是白天，另一半是黑暗。


    岛屿被照亮的一半是茂密的，如龙一般，它的山脉在神话的光芒中，被发光的海岸线勾勒。它的黑暗的一半是皇家蓝色水面上的影子。电光出现在海岸边，船只向东南滑入黑暗中，索罗门群岛、瓦努阿图

    斐吉，淡金色的斑点。飞向堪培拉、悉尼和布里斯班，在慰藉中，然后是新西兰的穿梭机尖，点缀着南方海域。


    在这个季节，南极更北地区的绝对黑夜不到六小时，剩下的是白天和黄昏的色彩。现在是陡峭的夜晚。在南极研究基地，生物学家们刚刚为北极燕的年度抵达安营。它们飞向极地，这些稀有的鸟。它们消化了一些器官，变成了长距离运动员，旅行了数千英里。十月的开始，南极释放了长久的暮色，在冰层下涌动。那些生物学家会等待，直到白光出现，天空充满了尖锐的顶峰。但现在在狭窄的黑暗间隙中，生物学家们出来看到了别的东西。他们甚至不需要抬头就知道它在那里。在他们的基地周围是一圈绿。火星人来了，他们说。他们脚踩在如月球般的雪花上，红光劈开了了银河。


    从这里的太空，当罗曼透过圆顶窗向外张望时，景色起初是模糊的。需要时间来适应。一片寒冷的虚无，珍珠般的云层，然后是延伸至南极圈的冰层熟悉的微光。右舷，七姐妹星直接闪烁。有时人们会有冲动去看特定的东西——金字塔，或是新西兰的峡湾，或一片亮橙色且完全抽象的沙丘，眼睛无法理解——那幅图像完全可以看作是他们培养皿中某一个细胞的特写。有时他们想看戏剧性的表演，看歌剧，看地球的大气层，看大气光，有时是那些最微小的东西，马来西亚海岸外散落的渔船的灯光，像星辰一样点布在黑色的海洋中。但现在，罗曼可以开始看到他怀疑在那里的东西，一种他们都知道的、凭借某种第六感存在在那里的——在大气层内部环绕的、变幻的红极光，焦躁而壮丽，仿佛被困住的什么。


