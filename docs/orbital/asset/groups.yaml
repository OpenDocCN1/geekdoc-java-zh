    the planet and pushed and pulled the tides which shape the coasts, so has politics
    sculpted and shaped and left evidence of itself everywhere.


    They come to see the politics of want. The politics of growing and getting, a
    billion extrapolations of the urge for more, that''s what they begin to see when
    they look down. They don''t even need to look down since they, too, are part of
    those extrapolations, they more than anyone —on their their rocket whose boosters
    at lift-off burn the fuel of a million cars.


    The planet is shaped by the sheer amazing force of human want, which has changed
    everything, the forests, the poles, the reservoirs, the glaciers, the rivers,
    the seas, the mountains, the coastlines, the skies, a planet contoured and landscaped
    by want.'
  - '[PAGE 69]


    # Orbit 8, ascending


    If you know where to look and you get a large zoom lens and close right in, you
    can see the man-made craters in the desert in Arizona that were dynamited out
    to resemble the moon. Here in the sixties Armstrong and Aldrin trained for their
    landing, though they''re going now, those craters, eroding away.


    New Mexico, Texas, Kansas, borderless states and invisible cities on the wide
    dry cowhide of the southwest American belt. The clouds are windwarped and ribbonny
    and travelling. Here and there a momentary flash which signals the sun reflecting
    off the hull of an aeroplane; the plane can''t be seen, only the flash. And across
    this great leathery hide are nonsensical scorings, indentations pressed into a
    surface, which of course are rivers but which have no flow. They seem dry, static,
    accidental and abstract. They seem like strands of long fallen hair.


    On the curve of the earth, fast approaching, is a mossier tinge, a land less arid;
    then the finger of blue with a depth of black. Lake Michigan, Lake Superior, Lake
    Huron, Lake Ontario, Lake Erie. Their centres beaten in the afternoon sun.


    The past comes, the future, the past, the future. It''s always now, it''s never
    now.


    It''s 5 p.m. on their looping spacecraft. On the earth beneath them, where Toronto
    is just appearing, it''s still midday. On the other side of the world it''s already
    tomorrow and the other side of the world will arrive in forty minutes.'
  - '[PAGE 70]


    Over there, in tomorrow, the typhoon summons winds of a hundred and eighty miles
    per hour. It''s rampaging through the Mariana Islands. The sea levels off the
    islands’ coasts have already risen by the expansion of the warmer water, and now,
    where the winds push the sea towards the westward edges of its basin, the sea
    rises more and a five-metre storm surge engulfs the islands of Tinian and Saipan.
    It''s as though the islands are hit with cluster bombs – blown out,, walls buckling,
    furniture flying, trees splicing.


    Nobody foresaw the rapid growth of this typhoon, in twenty-four hours has gone
    from a seventy-mile-an-hour skirmish in the middle ocean to a charging force closing
    in on land. The meteorologists who see the images of it now raise its level to
    a Category Five and some think typhoon and some think super-typhoon and there''s
    nothing to do but predict its landfall at the Philippines to the nearest hour.
    The hour, they say, will be 10 a.m. local time, 2 a.m. up here.


    It’s all in on the earth''s other side, occurring on a day that hasn''t yet arrived.
    The crew go on with the last of their tasks. Anton eats an energy bar to fight
    off afternoon drowsiness. Shaun removes the four fasteners from the bracket of
    the smoke detector that needs replacing. Chemie inspects the bacteria filters.
    Their path now ups and overs and exits America where the Atlantic is ancient,
    the placid silver-grey of a dugout brooch. Calm suffices this hemisphere. And
    with no ceremony they complete another lap of the lonely planet. They top out
    three hundred miles off the Irish coast.


    In passing through the lab, Nell looks out and sees the promise of Europe on the
    watery horizon. She feels somehow speechless. Speechless at the fact of her loved
    ones being down there on that stately and resplendent sphere, as if she’s just
    discovered they’ve been living all along in the palace of a king or queen. People
    live there, she thinks. I live there. This seems improbable to her today.


    Roman, Nell and Shaun arrived there three months ago, a trio of astronauts folded
    into a module size of a two-man tent. They docked to the station and the capsule’s
    probe penetrated neatly the spacecraft’ drogue. Soft capture. A bee entering a
    flower. The spacecraft’s eight mechanical hooks locked the module in. Hard capture,
    confirm, hard capture complete. A'
  - '[PAGE 71]


    stilling inside the module and a moment’s pause, Roman, Nell and Shaun had turned
    to one another and high-fived with sailing hands that hadn’t figured out what
    it meant to be weightless. Roman had cupped lightly the felt moon his son had
    given him, that hung in front of them on the voyage, a mascot, now bobbing. In
    the grandeur of space even that mascot had utmost dignity. Everything was capped
    with potential. They could barely speak.


    Stillness more and stillness again and stillness blooming into the hearts of the
    crew. It had been six hours of exhilarating speed, and now nothing. In harbour.
    Could it be that six hours ago you were on terra firma? Unfold your legs, pull
    yourself from your seat into the orbital module and stretch your crooked back.


    They were held for some two hours while they waited for the leak checks to be
    finished and for the pressure between the crafts to equalise. On the other side
    of the hatch was the awaiting crew who arrived three months before. Anton, Pietro,
    Chie. They knocked, clack-clack on the hatch, and a series of knocks came back.
    They did this for, and were only some eighteen inches from the inside of that
    spaceship would be their home for several months, only eighteen inches from everything
    towards which they’d been aiming for so long. Yet to wait and wait, in some antechamber
    which felt in a sensible biblical, a pause between life and the afterlife. In
    some respects, for those two hours, you don’t exist in any way you can recognise.
    Nothing you’ve ever experienced that far from the surface of the earth and nothing
    you’re about to experience is really yet known. And you’re exhausted in a way
    you’ve never been before. And incredulous at microgravity, at your nasal voice
    which doesn’t sound like yourself.


    Diligently they waited for the mercury to show the pressure was equal – it must
    reach seven four, seven seven before opening the hatch. Roman’s eyes were unable
    to lift from the pressure gauge. He attached the crank handle and turned it slowly
    and the crew on the other side pulled as he pushed and heard their voices, that’s
    it, we’re there, here comes as the hatch opened with a great hearing wearness
    with a nauseous wave of euphoria engulfed them. Engulfed them all. A roll of uncertain
    laughter, and faces appeared Pietro, my friend; Chie, dear Chie moy drug; Anton,
    my brother. Here’s the module they had all known so long through'
