    and fourteen going north, though they’ll be back in bed by the time those come.


    Earlier that morning Nell had an email from her brother saying he was unwell with
    the flu, and that struck her, how long it has been since she was ill – she feels
    in space as though her body is young again and there are no aches or pains, except
    for the space headaches they all get – even those are rare for her. Something
    about having your weight taken off, having no pressure on your joints and no pressure
    on your mind – no choices. Your days are laid out minute by minute in a schedule.
    You do someone’s bidding and go to bed early and usually exhausted and you get
    up early and start again and the only decision to be made is what to eat, and
    that too is limited.


    In his email her brother said half just that he hates being ill all over and that
    it must be nice to be with others all the time, your floating family, he called
    it. Up here, nice feels each such an alien word. It is brutal, inhuman, overwhelming,
    lonely, extraordinary and magnificent. There isn’t one single thing that is nice.
