    it is be an astronaut and not believe in God. They''d draw a blank. She''d point
    out of the port and starboard windows where the darkness is endless and ferocious.
    Where solar systems and galaxies are violently scattered. Where the field of view
    is so deep and multi-dimensional that the warp of space-time is something you
    can almost see. Look, she''d say. What made but some headless hurling beautiful
    force?


