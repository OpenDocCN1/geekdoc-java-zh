  - '[PAGE 37]


    one particular fisherman and his family, Pietro thinks, get out now, get out yesterday.
    But get out where? And how? And for the fisherman there''s this protective urge
    not to leave your things, they being the few things you still have after the last
    typhoon and the one before and the one before that. There are maybe hours before
    it hits, and you are on an island that''s off an island that''s in the ocean,
    hopelessly low-lying. So all you can do is lie hopelessly. You survived all the
    others. You have a house made of tin, cardboard, hardboard and sticks, and these
    days typhoons are so frequent and that there''s no point in building something
    better, it''s easier to have nothing to lose than to keep something.


    So you stay. And you look up to the restless night sky where your unsuccessfully
    astronaut friend spends his days, and emails you crazy photos of Samar, your island,
    in its turquoise seas. He would tell you to leave. Any minute now you''ll look
    at your phone and there''ll be a message from telling you to leave. He''ll tell
    you he can get someone to arrange it if need be, get a flight.


    Your wife says guarded, he is a kind man, and this is true. The kindest of men.
    Sends you each month for your children''s school and has met you only once, on
    a diving trip (his honeymoon of all things) and you on your fishing boat. You
    dropped your line-cutting knife and it sank in a moment, cost you ten dollars
    that knife and was good and sharp. Then surfaced the astronaut and his wife who''d
    been diving among your shoals a dolphin-leap away, and they saw you peering over
    the edge of your boat. When they fought for fifteen minutes and refused to come
    until they found your knife, flatly refused. It''s alright, you''d said, by way
    of a raised hand, don''t bother. But they bothered, and found it by some miracle
    wedged between rocks twenty-five metres down.


    An astronaut and a fisherman. What a collision of worlds. He came to dinner with
    his wife and charmed his children and cast a spell of wonder on your cardboard
    house as if he''d dropped in that afternoon from space itself, and though your
    wife''s natural suspicions never quite ease she is mostly won. Even the photo
    you took of all has a spell of wonder – your wife slender-faced and joyful, you
    yourself, intense and lion-like, the four children (sitting, standing, surprised,
    serene, grinning, clinging) a collective of tumbled beauty – it made you ask as
    for the first are.'
