    # Orbit 12


    They float in front of a Russian film about two cosmonauts whose bodies become
    possessed by aliens during their re-entry to earth. They pass around a packet
    of mints. By the end of the film the six of them are hanging, arms raised straight
    in front of them, heads bobbing; they look so peaceful in sleep.


    Pietro with a faint smile, his hair thickly boyish, an expression everhopeful.
    Nell''s cheeks flushed and her lips pursed as if she''s still extracting the last
    taste of the mint. Roman, heavy brows giving a sense of a deep purposeful contentment
    that must not be disturbed. Shaun, looking somehow flung, his arms wider than
    the others'', his head tilted back. Chie, hands suspended from wrists that seem
    breakable, an alertness in the movements of her eyelids, ponytail wafting above
    her head as always, but in sleep giving an odd pounding sense of readiness. Anton
    – Anton, looking pleased, as if he''s just presented his children with a muchwanted
    thing; his hand is floating and the fist half-clenched, and a muscle twitches
    at the base of his thumb.


    The film builds in sound at its climax, some thumping violence and searing music
    – but they are all well used to noise here. Nobody wakes.'
