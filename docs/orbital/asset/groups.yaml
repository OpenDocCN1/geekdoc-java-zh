    that has there since childhood, an extraordinary ease and presence of mind that
    made him bypass most of the shit-shifting tantrums of toddler-dom and rebellions
    of adolescence. A deep curiosity, a brain of architecture, a focus, an optimism
    and a pragmatism; an astronaut to his bones before he even knew what an astronaut
