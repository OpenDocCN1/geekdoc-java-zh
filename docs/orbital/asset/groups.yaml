    - Tailgaters

    - Tired children

    - Wanting to go for a run

    - Lumpy pillows

    - Peeing zips in space when in a hurry

    - Stuck zips

    - Whispering people

    - The Kennedys


    Chie clips her lists to the storage pouches in her sleeping quarters, where she
    puts her keepsakes, her few personal effects; a small tube of skin emolient for
    the sore dryness that afflicts her hands, a black and white photograph of her
    young mother on the beach near her house, a poetry collection about Japanese mountains
    which her uncle sent up in the last crew package and which she has no time for
    at all. She tears out its blank pages at the back and on them she sprawls her
    lists in a loose and sketchy hand.


