    of the earth. It sweeps a seventy-kilometre swath of the planet the craft orbits,
    moving from continent to continent, north and south, an obsessive eye watching,
    gathering, calibrating light.


    Pietro has had other missions and other spacewalks and run however thousands of
    thousands of experiments in his four-hundred-ish days in space, and there''s a
    sense of level-headed distance about it all, you run the experiment or install
    the unit or you collect the data and then you pass it on and move to the next.
    What are you anyway as an astronaut or a conduit – you are selected for your non-stick
    temperament, maybe one day a robot could do your job and maybe it will; you have
    to wonder. They do sometimes wonder. A robot has no need for hydration, nutrients,
    excretion, sleep, a robot has no irksome brain fluids or menstruation or libido
    or taste buds. You don''t have to fly fruit to a rocket or build it with vitamins
    and antioxidants and sleeping pills and painkillers, nor for a toilet with funnels
    and pumps that requires a training course to use, nor a unit that recycles its
    urine into drinking water, since it has no urine and it needs no water and it
    wants and asks for nothing.


