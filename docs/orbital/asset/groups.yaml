    jettisoned, they''ll be reeling out in increments along a path of two hundred
    and fifty thousand miles whose every inch is mapped in numbers, and they''ll go
    that way until tomorrow night when they reach the moon.


    Last night the six astronauts here dug out the party things, blew up some balloons,
    hung out the birthday bunting, and prepared themselves as celebratory meal as
    they could muster from the library of silver sachets – they found chocolate puddings
    and peach cobblers and packets of custard. Roman hung up the little felt moon
    his son had given him and which had been one of the few things he''d brought with
    him to space. They felt elation mixed with angst envy mixed with pride which looped
    back to elation, and in the end they went to bed as early as they always do. Because
    moon landing or not, there''s an early morning. There''s always, every day, an
    early morning.


    And there''s a backlash feeling, quiet and unshared but there in them all, of
    what has suddenly become their mundanity. The mundaneness of their earth-struck
    orbit, bound for nowhere; their looping round and never out. Their, monogamous
    circling which struck them last night as humbly beautiful. A sense of attention
    and servitude, as a sort of worship. And though they looked out before going to
    bed, as if they might see those moon-bound astronauts sailing past, and though
    their sleep was restless with anticipation, it wasn''t the moon they entered their
    dreams, but their own wild garden of space outside the spacecraft – the garden
    they''d all at some point walked in. And the ever-electric blue pull of the earth.


    Irritating things:


    +   - Tailgaters

    - Tired children

    - Wanting to go for a run

    - Lumpy pillows

    - Peeing zips in space when in a hurry

    - Stuck zips

    - Whispering people

    - The Kennedys


    Chie clips her lists to the storage pouches in her sleeping quarters, where she
    puts her keepsakes, her few personal effects; a small tube of skin'
  - '[PAGE 33]


    emolient for the sore dryness that afflicts her hands, a black and white photograph
    of her young mother on the beach near her house, a poetry collection about Japanese
    mountains which her uncle sent up in the last crew package and which she has no
    time for at all. She tears out its blank pages at the back and on them she sprawls
    her lists in a loose and sketchy hand.


    Reassuring things:


    +   - The earth below

    - Mugs with sturdy handles

    - Trees

    - Wide stairways

    - Home-knits

    - Nell''s singing

    - Strong knees

    - Pumpkins


    Out there on the nadir of the craft is the unit that Pietro and Nell installed
    on their spacewalk the walk before, a spectrometer that measures the radiance
    of the earth. It sweeps a seventy-kilometre swath of the planet the craft orbits,
    moving from continent to continent, north and south, an obsessive eye watching,
    gathering, calibrating light.


    Pietro has had other missions and other spacewalks and run however thousands of
    thousands of experiments in his four-hundred-ish days in space, and there''s a
    sense of level-headed distance about it all, you run the experiment or install
    the unit or you collect the data and then you pass it on and move to the next.
    What are you anyway as an astronaut or a conduit – you are selected for your non-stick
    temperament, maybe one day a robot could do your job and maybe it will; you have
    to wonder. They do sometimes wonder. A robot has no need for hydration, nutrients,
    excretion, sleep, a robot has no irksome brain fluids or menstruation or libido
    or taste buds. You don''t have to fly fruit to a rocket or build it with vitamins
    and antioxidants and sleeping pills and painkillers, nor for a toilet with funnels
    and pumps that requires a training course to use, nor a unit that recycles its
    urine into drinking water, since it has no urine and it needs no water and it
    wants and asks for nothing.'
  - '[PAGE 34]


    But what would it be to cast out into space creations that had no eyes to see
    it and no heart to fear or exalt in it? For years an astronaut trains in pools
    and caves and submarines and simulators, every flaw or weakness located, tested
    and winnow away until what''s left is a near-perfect unflappable triangulation
    of brain, limbs and senses. For some it comes hard and for others more easily.
    For Pietro, more easily; he is a natural-born astronaut, he has an equilibrium
    that has there since childhood, an extraordinary ease and presence of mind that
    made him bypass most of the shit-shifting tantrums of toddler-dom and rebellions
    of adolescence. A deep curiosity, a brain of architecture, a focus, an optimism
    and a pragmatism; an astronaut to his bones before he even knew what an astronaut
    was. But a robot, no.


    There in his chest is a heart that tilts and pitches. He can keep its beats slow
    and smooth, quell its habits of fear or panic or impulse, stop it yearning too
    much for home, curb its un impulses of abandon. Calm and steady, calm and steady.
    Metronome pacing out the breath. Yet still in it tilts and pitches. It wants what
    it wants and hopes what it needs and loves what it loves. So strenuously unrob
    is the astronaut''s heart that it leaves the earth''s atmosphere and it presses
    out – stops pressing in and the counterweight of the heart pressing out, as if
    suddenly aware it is part of an animal, alive and feeling. An animal that does
    not just bear witness, but loves what it witnesses.


    And so Pietro thinks about the spectrometer out there, which will help ascertain
    if the earth is dimming. Since he and Nell installed inside, he thinks about it
    each day when he wakes up, his lenses pointing three ways, to the earth, the sun
    and moon, measuring the light that is reflected off the earth''s surface and the
    clouds. Whether the earth''s surface is dimming because the particulates in the
    air from pollutants reflect the sun''s light back into space, or brightening because
    the melting ice sheet and lessening high bright cloud mean that more of the sun''s
    light is absorbed by the earth. Or at once, and then to what effect? This complex
    system of energy exchange which determines the temperature of the planet.


    He thinks about the latter – the prospect of the earth absorbing less – light
    reflected back into space. From here, looking down, what would be to see a less
    radiant planet? On a day like this seeing, as he captures videos, its patterning
    of clouds and the wide spectrum of its'
  - '[PAGE 35]


    oceans’ blues in morning light, a hologram arising out of blackness. Radiance
    itself. What would it be to lose this? To starboard, the soft brushed nickel of
    the Mediterranean sheened by sun, the pleating and folding of the Dolomites and
    Alps, dark snowless peaks, indigo valleys, olive plains, the endless run of riverbeds,
    the tawny southern lands of his own country after a summer with no rain. Vesuvius
    just visible if you know where to look. Early October now, and still, he’s told,
    no rain. And yet regardless the planet sings with light as if from its core, from
    the belly of itself, this great photogenic thing he collects in his lens.


    Eastern Europe slides past, and into Russia and over Mongolia and down through
    China, twenty minutes is all that takes, and he waits for the typhoon to come
    round. It’s just there, he knows, beyond the planet’s next bend, tucked on the
    other side of this bright blue curve, and his view of it will be full and almost
    directly above. Every day it surprises him. How unexpectedly strange it is for
    that spaceship of a planet to be sailing past his vision. Perhaps there is no
    other observed object in the universe – who knows? It isn’t just his eyes or those
    of the rest of crew observing, not just the lenses of the spectrometer, but the
    other earth-viewing imagers attached to the station and thousands of satellites
    swarming and buzzing in high and low orbit, billions of radio waves transmitted
    and received.


    Here he is now, a non-robot with a camera and a pair of twenty-twenty eyes and
    a heart pitching forwards, tripping up, at the earth’s singularity. It bangs against
    his ribs as he films.'
  - '[PAGE 36]


    # Orbit 4, descending


    Their hands are in sealed experiment boxes or assembling or disassembling ruggedised
    units or refilling the auto-release food pouches in the modules of mice, their
    feet are in tethers at their workstations, their screw-drivers and spanners and
    scissors and pencils are drifting here and there about their heads and shoulders,
    a pair of tweezers loose and sails towards the air vents which, in their imperceptible
    sucking, are the resting place of all lost things.


    They descend past Shanghai, which by day is an un-peopled coast on the edge of
    a continent of every conceivable hue. Their fourth earth orbit of the waking day,
    and though their orbital path is in an eastward direction, all the same with each
    full transit their path shifts went because of the rotation of the earth, so that
    – like the typhoon – move steadily inwards, off the Pacific, towards Malaysia
    and the Philippines, and the typhoon hustles in behind.


    They stop whatever they''re doing and take up their cameras. The clack of multiple
    shutters, the whirl of lenses, the white soles of socks pitched into the air while
    the crew congregate at earth-viewing windows butting gently against the bulletproof
    glass, taken aback by what they see. What they see is an unbroken vista of typhoon
    and a deep sucking well at its center. A planet made entirely of spinning cloud.


    On the ground people are told to evacuate. Images from space coming through, confirming
    what the midday birds and running goats seem to know, which is that this typhoon
    has found fuel enough to spread itself three hundred miles wide at a pressing
    speed. To all in the Philippines: get out or hunk down. To those on the tiny eastern
    islands, just get out.'
