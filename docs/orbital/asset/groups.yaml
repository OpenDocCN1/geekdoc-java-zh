    the typhoon moves west towards southern Asia, their craft tracks east, eastward
    and down towards Patagonia where the lurch of a far-off aurora domes the horizon
    in neon. The Milky Way is a smoking trail of gunpowder shot through a satin sky.


    Onboard the craft it’s Tuesday morning, four fifteen, the beginning of October.
    Out there it’s Argentina it’s South Atlantic it’s Cape Town it’s Zimbabwe. Over
    its right shoulder the planet whispers morning – a slender molten breach of light.
    Slip through time zones in silence.


    They have each at some point been shot into the sky on a kerosene bomb, and then
    through the atmosphere in a burning capsule with the equivalent weight of two
    black bears upon them. They have each steled their ribcages against the force
    until the bears retreat, after the other, and the sky become space, and gravity
    diminish, and their hair stand on end.


    Six of them in a great H of metal hanging above the earth. They turn on head,
    four astronauts (American, Japanese, British, Italian) and two cosmonauts (Russian;
    Russian); two women, four men, one space station made up of seventeen connecting
    modules, seventeen and half half miles an hour. They are the latest six of many,
    nothing unusual about this any more, routine astronauts in earth’s backyard. Earth’s
    fabulous and improbable backyard. Turning head on heel in the slow drift of their
    hurtle, head on hip on hand on heel, and turning with the days. The days rush.
    They will each here for nine months or so, nine months of this weightless drifting,
    nine months of this swollen head, nine months of this sardine living, nine months
    of this earthward gaping, back to the patient planet below.


    Some alien civilisation might look on and ask: what are they doing here? Why they
    go nowhere but round and round? The earth is the answer to every question. The
    earth is the face of an exalted lover; they watch it sleep and wake and become
    lost in its habits. The earth is a mother waiting for her children to return,
    full of stories and rapture and longing. Their bones a little less dense, their
    limbs a little thinner. Eyes filled with sights that are difficult to tell.'
  - '[PAGE 8]


    # Orbit 1, ascending


    Roman wakes early. He sloughs off his sleeping bag and swims in the dark to the
    lab window. Where are we, where are we? Where on earth. It’s night and there’s
    land. Into view edges a giant city nebula among space, reddish-rust-; no, two
    cities, Johannesburg and Pretoria locked together like a binary star. Just beyond
    the hoop of the atmosphere is the sun, and in the next minute it will clear the
    horizon and flood the earth, and dawn will come and go in a matter of seconds
    before daylight is everywhere at once. Central and East Africa suddenly bright
    and hot.


    Today is his four hundredth and thirty-fourth day in space, a tally arrived over
    three different missions. He keeps close count. Of this mission it’s eighty-eight.
    In a single nine-month mission there are in total roughly five hundred eight and
    forty hours of morning exercise. Five hundred and afternoon meetings with the
    American, European and Russian crews on the ground. Four thousand three hundred
    and twenty sunises, four thousand three hundred and twenty sunsets. Almost one
    hundred and eight million miles travelled. Thirty-six Tuesdays, for all that,
    this being one. Five hundred and forty times of having to swallow toothpaste.
    Thirty-six changes of T-shirt, a hundred and thirty-five changes of underwear
    (a fresh set of underwear every day is a storage luxury that can’t be afforded),
    fifty-four pairs of socks. Auroras, hurricanes, storms — their numbers unknown
    but their occurrence certain. Nine full cycles, of course, of the moon, their
    silver companion moving placidly through its phases while the days go awry. But
