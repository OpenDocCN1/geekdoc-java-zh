    at all – they’re much more and much less than that. Each other for this short
    of time because they’re companions, mentors, dentists, hairdressers. On spacewalks,
    launches, re-entry, in emergencies, they’re each other’s lifelines. Each a representative
    of the human race – they have to make do in lieu of earthly – families, animals,
    weather, sex, trees. Some days they just want to walk, or lie down. When they
    miss people and earth feels so far away that depression washes over them for days
    and even the view of the sun setting over board isn’t enough to lift them, then
    they have to be able to see something that keeps them going. Some days they look
