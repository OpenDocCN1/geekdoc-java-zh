    Neptune''s sound is liquid and rushing, a tide crashing onto a shore in a howling
    storm; Saturn''s is that of the sonic boom of a jet, a sound that resonates through
    your feet and the bones; Saturn''s rings are different still, a gale siphoning
    through a derelict building but in slowed and warping time. Uranus a frantic zapping
    screech. Jupiter''s moon, Io, makes the metallic pulsing orchestra of a tuning
    fork.


    And the earth, a complex orchestra of sounds, an out-of-tune band practice of
    saws and woodwind, a spacey full-throttle distortion of engines, a speed-of-light
    battle between galactic tribes, the ricochet of trills from a damp rainforest
    morning, the opening bars of electronic trance, and behind it all a ringing sound,
    a gathered in a hollow throat. A fumbled harmony taking shape. The sound of very
    far-off voices coming together in a choral mass, an sustained note that expands
    through the static. You think it''ll burst into song, the way the choral sound
    emerges full of intent, and this polished-bead planet sounds brightly sweet. Its
    light is a choir. Its light is an ensemble of a trillion things which rally and
    unify for a few short moments before falling back into the rin-tin-tin and jumbled
    tumbling of static woodwind rainforest trance of a wild and lilting world.'
