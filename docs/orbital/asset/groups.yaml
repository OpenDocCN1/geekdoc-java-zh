    To his tally kept on a piece of paper in his crew quarters, Roman will add the
    eighty-eighth line. Not to wish the time away but to try to tether it to something
    countable. Otherwise – otherwise the centre drifts. Space shreds time to pieces.
    They were told this in training: keep a tally each day when you wake, tell yourself
    this is the morning of a new day. Be clear with yourself on this matter. This
    is the morning of a new day.


    And so it is, in this new day they''ll circle the earth sixteen times. They will
    see sixteen sunrises and sixteen sunsets, sixteen nights. Roman clasps the handrail
    to the window to steady himself; the southern hemispheres are fleeting away. You''re
    bound to Coordinated Universal Time, ground crews tell them. Be clear with yourself
    on this matter, looks out at your watch to anchor your mind, tell yourself when
    you wake up: this is the morning of a new day.


    And so it is. But it''s a day of five continents and autumn and spring, glaciers
    and deserts, wildernesses and warzones. In their rotations around the earth in
    accumulations of light and dark in the baffling arithmetic of thrust and attitude
    and speed and sensors, the whip-crack of morning arrives every ninety minutes.
    They like these days when the brief bloom of daylight coincides with their own.


    In this last minute of darkness the moon is near-full and low to the glow of atmosphere.
