    There are times when it seems the only thing to do is to tuck your legs to your
    chest and somersault through the air. Shaun in the three cubic metres of space
    outside his quarters. Nell and Pietro in the lab where they set up a film to watch.
    Roman and Anton at a game of poker in the Russian module, using as chips the disc
    magnets which hold their cards. Chie in the experiment rack where the mice are
    still flying. She opens her arms and windmills upside down.


    Somersault, forward and back, with arms spread wide, recall the miracle of your
    weightlessness; remember when you first came here you were baffled by the lack
    of gravity because your body kept wanting to decide which way was up, and nothing
    gave it any clue. It craving resistance and was nothing to resist.


    When they arrived there had hours or days of space sickness. They kept crashing
    into things. They propelled themselves so fast or suddenly; the nausea drove them
    to hang in their quarters with a blindfold insisting on their brains be the change,
    and the acceptance was felt as a kind of peacekeeping. They dared a somersault.
    Their minds followed and they began to understand – they hovered over the window
    with a day or night view of the earth and remembered with a fresh wave of comprehension
    that they were falling. They were weightless not through lack of gravity – there’s
    plenty of gravity, so close to earth – but they were in a constant state of free
    fall. They were not flying, but falling. Falling at over seventeen miles an hour.
