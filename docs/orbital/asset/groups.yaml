    现在智惠做了一些梦，梦里她的母亲还活着；这些梦充满了宽慰和狂喜。在她下方，日本和东亚挤满了前方的视野，如果她醒来向外看，她几乎看不到或完全看不到台风。那里是最后的夜晚，大陆被金光勾勒出来。

