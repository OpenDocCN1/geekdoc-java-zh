    ## Orbit 10


    Some eighty million miles distant the sun is in the roaring. It edges now toward
    its eleven-or-so-year maximum, erupting and flashing, when you look you can see
    its edges are flayed with violent light and its surface sun-spot-bruised. Immense
    solar flares send protons earthwards and in their wake are geomagnetic storms
    triggering light displays three miles high.


    It’s a radioactive soup out there and if their shields are to fail they’d be cooked
    and they know it. But a strange effect happens when the sun is so active, whereby
    its radiation (comparatively meek and resistant) pushes away cosmic radiation
    (a veritable bag of spitting snakes) and the soup that they swim in is thereby
    tempered. What their shields don’t deflect the earth’s magnetic fields do, and
    the dose in the lab are barely perturbed. The sun’s particle billows, flares explode
    and whip earthward in eight minutes flat, energy pulses, explodes, a great ball
    of fusion and fury. In the sun’s fury they’re somewhat and improperly cooled,
    as if the sun were a dragon and they, by stupendous fortune, had found themselves
    in their domain and protection.


    And in leeside shelter there they are; it’s early evening now: Shaun collecting
    the rubbish bags, Roman cleaning the toilet and Pietro the US, Anton cleaning
    the air purification system, Chie wiping and disinfecting, Nell vacuuming the
    air vents, where she finds a pencil, a bolt and a screwdriver, some hair and some
    nail clippings.


    Then a moment of aimlessness is upon them. She floats at the window portside knowing
    that their orbit is as far away from Japan as it can ever get; it’ll be another
    four hours or before they pass it again. My mother is there, she thinks. Everything’s
    left of my mother is there, and soon it will be burned and gone. They’re skimming
    the west of Africa, Mauritania, Mali now, soon Nigeria, Gabon, Angola; their second
    time of seeing these countries today, but this morning it was on the ascending
    orbit, this time they descend to the coast and loop underneath the Cape of Good
    Hope like those ships of old.


    Down over the arrowing peninsula of Dakar, crossing the equator, and in the closing
    minutes of day the lights of Brazzaville and Kinshasa on either side of the Congo
    River tepid in the dusk. Blue becomes mauve becomes indigo black, and night-time
    souths Africa in one. Gone is the paint-splattered, ink-leached, crumbled-satin,
    crumbled-pastel overflowing-fruit-bowl container of chaotic perfection, the continent
    of salt pans and red sediment floodplain and the nerve networks of splaying rivers
    and mountains that bubble up from the plains green and velvety like growth. Gone
    is a continent and another sheer widow’s veil of star-struck night.


    Roman and Anton are in the Russian model, Roman trying to find a loose screw that
    floated out of a pair of scissors and is now somewhere about his head; Anton is
    at the window looking nadir, legs aloft. There are the disappearing lights of
    Cape Town and storms over the ocean. Wherever you are at night over the earth,
    there’s somewhere the soft erratic pulse of lightning. Electric silver-blue silent
    flower opening and closing. Here, over there, over here.


    Absent Anton runs his fingers over a loop that’s appeared on his neck the last
    fortnight and he tries to obscure by raising the collar of his polo shirt. The
    last thing you need is to get in space. They’ll worry and send you home, and because
    you can’t fly back on your own, two others will have to go with you, and to cut
    short the missions of those two others would be unforgivable. He’ll say nothing
    to the flight surgeon or his fellow crew and he’ll hope nobody notices. It’s the
    size of a cherry in the low hollow of his neck, and perfectly painless.


    There’s wife at home, herself so long unwell, and he tells their children left
    nothing bad to happen to them ever, as if such a gift. He’s the vehicle that carries
    him all through darkness, and the weight that has borne him along years and years.
    But he, too, is preyed by darkness, as we all are. He never knew how to tell them
    that. He never knew how to say to his wife what he wanted amicably to say:


    Zabudem, ladno? Let''s forget it, shall we? Let''s call it a day. We don''t love
    one another any more, when complicate what''s simple? When he found the lump those
    were the words that came straight to his mind. Zabudem, ladno? They were casual
    and easy in his head as if he were proposing to end an awkward conversation. They
    were light words and they ended the decades of struggle inside him, and he feels
    sure that in the saying of the words they will all be released – he, his wife,
    their children – they will be released from the darkness he is supposed to and
    could never save them from.


    The lovelessness of his marriage is a fact that has come upon him gradually, one
    gentle dancing after the other. When he''s seen through a telescopic lens of the
    flowlines made by ships patrolling the ocean, or the ancient shorelines of Bolivia''s
    bright orange Laguna Colorada, or the red sulphur-tipped tip of an erupting volcano,
    or the wind-cut folds of rock in the Kavir Desert, each sight has come to him
    the winching open of the heart, a crack at a time. He''d not know how capacious
    it was, the heart. Nor how in love he could be with a ball of rock; it keeps him
    awake at night, the vitality of this life. Then, when first caught the sight of
    the lump on his neck it seemed – though he can''t truly why – the logical culmination
