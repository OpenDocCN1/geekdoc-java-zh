    – or, the image in the photograph was his reality, as if he were Collins, and
    he was drifting out alone, the only man in the universe. In the second dream it
    was the same calm loneliness, and then he could hear something that became a faint
    murmur, the bubbling murmur of thousands or millions of voices, when he listened
    zoomed closer and the voices clamoured and became one, which was his own. He saw
    himself, or perhaps not – he saw his voice, or was his voice – standing on the
    very surface of the earth looking out into space and to the moon, which was extremely
