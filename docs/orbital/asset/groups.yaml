    Nell, he says, come quick. Nell, who is passing through the module, swims up into
    the dome. The two of them trading air in his lookout.


    The airglow is dusty greenish yellow. Beneath it the gap between atmosphere and
    earth is a fuzz of neon which starts to stir. It ripples, spills, it''s smoke
    that pours across the face of the planet; the ice is green, the underside of the
    spacecraft an alien pal. The light gains edges and limbs; folds and opens. Strains
    against the inside of the atmosphere, writhes and flexes. Sends up plumes. Fluores
    and brightens. Detonates in towers of light. Erupts clean through the atmosphere
    and puts up two hundred miles high. At the top of the towers is a swathe of magenta
    obscures the stars, and across the globe a shimmering hum of rolling light, here
    the flickering, quavering, flooding light, and the depth of space is mapped in
    light. Here the flooding, flooding green, the snakeing blades of neon, there the
    vertical columns of red, to turn, there the far stars comets by, there the close
    stars that stay fixed in the heavens, beyond them the specks that can barely be
    seen.


    By Shaun and Chie have come, and Anton is at the window in the Russian module,
    and Pietro in the lab, six of them drawn moth-like. The orbit rounds above the
    Antarctic and begins its ascent towards the north. It leaves waves of aurora in
    its wake. The towers collapsing as if exhausted, twitches of green on the magnetic
    field. The South Pole recedes behind.


    Roman''s face is like that of a child. Ofiget, he murmurs. A wow snatched from
    the back of the throat. Sugoi, Chie replies, and Nell echoes it. Remember this,
    each of them thinks. Remember this.'
