    他的泪水化作四滴水珠从他的眼睛里浮出，他和智子在手心里接住了。这里是不让液体流出的，他们对此非常谨慎。


    “你听得见我的话吗？”罗曼问道。

    “我听到了，”那个声音说。

    “很好。我是罗曼。”

    “你好，罗曼，我是特蕾丝。”

    “特蕾丝，”他说，“我是一个俄罗斯宇航员。”

    “哇。你的英语怎么样？我的俄语不太好。”

    “别担心。每个人的俄语都不好。”

    “我在温哥华郊。”

    “那不错，我以前去过温哥华。”

    “嗯，我从未去过太空。”

    “我早料料之中。”

    “我并不想去，你懂的。”

    “在轨道经过、信号丢失之前，我们只有六七分钟时间，所以如果你有什么问题的话？”

    “嗯，罗曼，我想我有一个。”

    “我在。”

    “你有没有觉得过——你有没有感到过沮丧（crestfallen）？”

    “沮丧？”

    “是的。你也有过吗？”


    “我不认识这个词，它是什么意思？”

    “它是什么意思？它的意思是，你是否曾想过，意义是什么？”

    “在太空的意义是什么？”


    “意义。你有没有。你是否有时会在太空中睡觉，然后想，为什么？这会让你感到困惑吗？或者你在太空中刷牙时。我有一次在长途飞机的飞机上，在洗手间刷牙，我向窗外望去，突然在想，我的牙有什么意义？不是什么坏的想法，只是这种‘我刷牙到底有什么意义’的想法瞬间让我泄了气。它让我在那儿停滞了脚步。你能听懂我的话吗？我说话得太快了吗？”


    “我听懂。”


    “现在很多时候当我睡觉时，也有同样的感觉。当我掀开被子，我想起在飞机上的那个时刻，气就泄了。我的肩膀塌了，我感到很沮丧。我感到难过。但我不知道为什么。”


    “沮丧。它的意思是——也许是抑郁？”


    “它的意思是可能是失望。意兴消沉。是的，就像灵魂离开了你。”


    “你想知道我是不是这种感觉吗？”


    “因为我看过你们在上面睡觉的照片，那里就像挂在小电话亭里的睡袋，看起来那么冷清。所以——如果你介意我这么说，太荒谬了。我在想，你们在付出了所有努力之后到达那那里——因为那需要努力——然后看着那个地方想，就这样？这难道不像是一个大失所望吗？你懂我的意思吗？”


    “荒谬。”


    “我冒犯你了。”


    “不，不。我在思考。”


    “抱歉。”


    “我告诉你，特蕾丝，关于我们的睡袋。确实是挂着的，我们大多数甚至不用用弹筋把它固定在墙上，我们自由地漂浮，那种感觉非常舒服。但我记得我第一个晚上看到我的睡袋，也许第一眼你可能会觉得——什么？沮丧，想到这就是你几个月的床，但接着你看到它，它让你微笑。我看到它并没有完全挂直，它不只是挂着，你懂的——没有重力让它变得，那个词是什么，沉重或者——”


    “毫无生气或软塌。”

    你知道的，它在飘起；轻微地飘起，就像完美风中的船帆。你知道的，只要你还在轨道上，一切都会好，你不会感到沮丧，一次也没有。你可能会想家，你可能会精疲力竭，你可能会觉得自己像笼子里的动物，你可能会孤独，但你永远、永远不会感到沮丧。”


    “那么就像灵魂是进入了你的身体，而不是离开你。就像一切都是活的？就像你的睡袋是活的。”


    “我想——是的，没错。”


    “我听不太清楚了。”


    “不。”


    “我希望那是夜晚，这样我就可以抬头看到你们的光经过头顶。”


    “尽管我们正在经过。”


    “我丈夫去世了，这是他的无线电——”

    “抱歉，特蕾丝，信号正在丢失。”

    “在夏天，我们去世了。”

    “抱歉，特蕾丝——”

    “你好，你在吗？你好？”


    “爱，我想你，”肖恩写道。


    在《宫廷群》明信片的背面是他妻的字迹，那是左倾的左手字，紧紧的，棱角且富有男子气味。这种缺失。然而，如果现在给他一个回家的机会，他不会接受，而当几个月后该出发时，他将不愿去。这是一种陶醉；太空带来的高海拔病般的思乡症药物。这种既不想留在这里又一直想留在这里的感觉，心被哀鸣声掏空了，但那一点也不空虚，而是意识到自己可以被填满。轨道上的景象正是如此；它们让你变成一只飘逸的风筝，由你所有不具备的东西赋予了你形状和柔软。


    他让它浮在笔记本电脑上方的空间，在那里在缓慢的弹道式漂移中旋转。在电子邮箱里，他有一个关于即将降临的时刻的社论问题需要回答；他们请了一位演员、一位物理学家、一个学生、一位艺术家、一位作家和一个生物学家。

