    and languid dreams of discovery, in any case dreams of breaking or being free.
    The flying they did, or still do, in dreams is the closest analogy they have to
    moving in space, these dreams share the same weightless ease and the same sense
    of miracle, because it ought to be impossible for a heavy wingless body to be
    gliding freely and smoothly and yet here it is and it seems that you are finally
    doing the thing for which your being was born. It is hard to believe. At the same
    time, it is hard to believe in anything else. It is hard to believe the quality
    of blackness that is the entirety of space around a day-lit earth, where the earth
    absorbs all the light — yet hard to believe in nothing but that blackness, is
    alive, and breathing and beckoning. If Nell had ever been afraid of nothingness,
    once was she yearned for anything other than — to drift into it and for her tether
    to reel out thousands of miles.


    You look down the length of your own body hanging to the rig while you grapple
    with the pistol-grip tool and the torque multiplier and the old bolts that have
    got stock and which have no force of gravity to remove, and two hundred and fifty
    miles beneath your feet the buffered orb of earth hangs too like a hallucination,
    something made by and of light, something you could pass through the centre of,
    and the only word that seems to apply to it is unearthly. It can''t possibly be.
    Forget all you know. You look back at the vast spread of the space station and
    in this moment it, not earth, feels like home. Inside the craft the four others.
    But out there, forget all you know. Her and Pietro''s the only ones to beat in
    space between the earth''s atmosphere and as far beyond the solar system as anyone
    can guess. Their two heartbeats speeding peacefully through it, never in the same
    place twice. Never to return to the same place again.


    When the six of them talked about their spacewalks afterwards, they described
    déjà vu — they knew they''d been there before. Roman said that perhaps it was
    caused by untapped memories of being in the womb. That''s what being floating
    in space feels like for me, he''d said. Being not yet born.


    Here is Cuba with pink morning.


    The sun bounces everywhere off the ocean''s surface. The turquoise shallows of
    the Caribbean and the horizon conjuring the Sargasso Sea.


    To be out there, Nell thinks, to have no glass or metal between her and this.
    Just a spacesuit filled with coolant to ward off the sun’s heat. Just a spacesuit
    and piece of rope and her slender life.


    Just her feet dangling above a continent, her left foot obscuring France, her
    right foot Germany. Her gloved hand blotting out western China.


    At first they’re drawn to the views at night – the gorgeous encrust of city lights
    and the surface dazzle of man-things. There’s something so crisp and clear and
    purposeful about the earth by night, this thick embroidered urban tapestries.
    Almost every mile of Europe’s coastline is inhabited and the whole continent outlined
    with fine precision, the cities constellations joined by the golden thread of
    roads. Those same golden threads across the Alps, usually greyish blue with snowfall.


    At night they can come to home – there’s Seattle, Osaka, London, Bologna, St Petersburg
    and Moscow — Moscow one enormous point of light like the Pole Star in a shrill
    clear sky. The night’s excess takes their breath. The spread of life. The planet
    proclaims to the abyss: there is something and someone here. And how, for all
    that, a sense of friendliness and peace prevails, even at night there’s only one
    manmade border in the world of the world; a long trail of lights between Pakistan
    and India. That’s all civilisation has to show for its divisions, and by even
    day that has gone.


