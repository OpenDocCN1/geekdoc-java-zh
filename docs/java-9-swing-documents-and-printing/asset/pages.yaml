  md: '# JAVA 9: SWING, DOCUMENTS AND PRINTING


    A Document object divides the document into a hierarchy of objects where each
    node has the type Element and consists of an offset and an end position in the
    document. In addition, an Element may have associated an AttributeSet and thus
    a style is not used by, for example, by a JTextField and a JTextArea. An Element
    object thus describes a part of the document and seen from a JPane it is interesting
    that an Element has its own style.


    An important task for AbstractDocument is to implement a locking mechanism that
    ensures that at one point only a single writer can use the document, but no or
    more can read the document.


