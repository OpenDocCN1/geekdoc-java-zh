  md: 'As regards the size and location of a component, note the following methods:


    +   - getWidth()

    - getHeight()

    - getSize()

    - getLocation()


    which returns the component''s current size and location.


    You can also define a component''s alignment within the container where it is
    located and the basic methods are


    +   - setAlignmentX()

    - setAlignmentY()


    and both methods have a float parameter, where 0 means left or top, 1 means right
    or bottom, and a value between these extremes indicates the degree to which the
    component is to be adjusted. For example means 0.5 centered. The only layout managers
    that use these properties are a BoxLayout or an OverlayLayout.


