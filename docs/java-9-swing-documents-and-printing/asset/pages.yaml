  md: 'JAVA 9: SWING, DOCUMENTS AND PRINTING


    A SLOT MACHINE


    +   1. *Cancel* undo the changes.

    2. *Save* that saves the changes. Doing so will delete all historical data for
    this configuration, that is all rows in the table *run* regarding this configuration.
    The amounts are counted for each player and added as a transaction to the player''s
    account.

    3. *Remove* deletes the configuration, and here the goes goes as where the current
    rows in the table *run* are deleted and counted together and inserted as transactions
    on players accounts.

    4. *Sort* sorts the game table.

    5. *Shuffle* blends the figures on the reels such they get a random location.

    6. *Tests* simulates a number of games with the configuration. The number of games
    is entered in the *Tests* field, and the result is a window with the test results.
    The goal of the function is to validate the frequencies for profit, and how much
    the machine returns before saving the configuration.


    There are many details related to that feature, including implementing drag and
    drop, and among other things, the database functions are in the class *DB*.


