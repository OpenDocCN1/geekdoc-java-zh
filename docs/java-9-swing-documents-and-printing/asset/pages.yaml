  md: '# JAVA 9: SWING, DOCUMENTS AND PRINTING


    # REQUIREMENTS SPECIFICATION


    The machine can be in one of two modes


    +   1. User mode

    2. Admin mode


    where in the last mode besides playing, you can configure the machine and administrator
    users. The requirement specification is divided according to these two use patterns.


    # User mode


    In user mode, this is a simple program with few features. When a user (player)
    meets the program, the player must do one of the following:


    +   1. Log in with username (email address) and password

    2. Register yourself as a user (if the player is not already a user)


    If the player has forgotten his password, the player must contact the administrator,
    who may change the password. If the player is logged in, the player can change
    the password at any time.


    In the latter case (where a new player has to be created) the user must inform


    +   - email address

    - password

    - name

    - phone number

    - debit card (number, expiry date, control number – should simulate a real card)


    After that, the user can play the machine if there is money on the account. In
    addition to play, the user can perform the following functions:


    +   1. Log out

    2. Deposit money on the account

    3. Display account information and change these (but not the email address), and
