  md: 'Firstly, it should be noted that the class inherits JComponent and is therefore
    a component.

    This means, among other things, that the component has all the functionality that
    a JComponent provides. The class defines a static variable that refers to the
    image. You should note that the class uses the method getImage() to load the image
    and gives it the size 320 × 180, which is also the size of the component. The
    class also defines instance variables, which defines the first width of the frame
    while the other is the text to be drawn on the image.


    The constructor defines the background color (to black). Note that it is possible
    because the class Birds is a JComponent and therefore has a setColor() method.
    The background color is used to the frame and to the text. Similarly, the constructor
    defines the font, which is used to draw the text. Finally, the constructor associates
    an event handler to the component so that it catches with the mouse.


    Then there is the method paintComponent(), which is the method that must be performed
    when it is necessary to draw and when the window opens and the component is displayed.
    You should note that the method is never called explicitly, but is called by the
    runtime system when it is necessary to draw the image. The method has a parameter
    of the type Graphics, which is an abstract base class as a screen. One can think
    of a Graphics object as a canvas where a component can draw and the class provides
    a variety of drawing tools available. In addition, the class defines properties
    in the form of font and color, cutting area and a coordinate system. The upper
    left corner is (0,0) and + x values are oriented to the right while positive +
    y values are oriented downwards. The paintComponent() method starts by calling
    the base class paintComponent(), and then performing a type of cast of the parameter
    to a Graphics2D object. The Graphics2D class is derived from Graphics (and has
    been introduced along Swing after the introduction of Java 2). Improved drawing
    tools are available, and therefore, in practice, you performs this type of cast.
    An example of a drawing tool is drawImage(), and the third statement uses this
    method to draw the image. The next five statements define and draw the frame.
    It involves telling what color draw with which pen (how thick a line) should be
    drawn with finally defining the rectangle that defines the frame. Drawing geometric
    figures is treats detailed in the next book, but it requires some calculations
    to get the frame drawn within the component’s physical boundary at the 320 × 180
    pixels. The last statements in paintComponent() are used to draw the text, and
    the challenge is to get the text drawn in the middle of the component.'
