    INTERNATIONALIZING


    The program starts by creating a ResourceBundle named bundle1, and it will when
    not specify any Locale read the file Cards.properties, which is called the base
    properties file. Next, the values for the four keys are printed, and the result
    is the first lines. Next, another ResourceBundle is created with the name bundle2,
    but this time a Locale is added. The result is that the file for this Locale is
    read and that is Cards_en_US.properties. The next statement is iterating all the
    keys and printing the English names. Finally, a ResourceBundle is created and
    called bundle3, but with a local for German. It will then look for the Cards_de.properties,
    but such a file does not exist and it will read the file Cards.properties which
    is the base properties file. Therefore, the last statement writes the


    Ruder


    ResourceBundles based on properties provide the great advantage that they can
    be maintained outside of the program and thus make it flexible to language versions
    of programs. However, it should be noted that the keys cannot be changed as they
    are referenced from the program. Another question is where the properties files
    should be and they should simply be placed in the project directory in the src
    directory (see below). Should the program be installed elsewhere (as is the case
    in practice), the properties must be copied together with the jar file and placed
    in the same location.


