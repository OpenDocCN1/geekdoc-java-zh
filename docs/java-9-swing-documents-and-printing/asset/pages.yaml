  md: '# JAVA 9: SWING, DOCUMENTS AND PRINTING


    There are defined three instance variables, where the first is the icon to be
    inserted, and the last method is the same method that I have used many times that
    loads the image from my jar file and scales. The variable counter is used for
    the text of the buttons that may be inserted so that they can be known from each
    other. Finally, there is a reference to the JTextPane component so it can be referenced
    from the three buttons'' event handlers. The component is inserted into the window
    as other components, and there is something to note in the three event handlers.
    You should notice the following methods on a JTextPane:


    +   - replaceSelection()

    - insertIcon()

    - insertComponent()


    which is used to insert a text, insert an icon, and insert a component, respectively.
    Regardless of the names, they all work in the same way and replace the content
    marked with what to insert — if something is selected and otherwise inserted at
    the caret''s position.


    Then there is styling in the form of attributes and styles. You can attach attributes
    to the individual characters, to paragraphs, and to the entire document. Character
    attributes relate to font and text color. Attributes regarding paragraphs may
    also concern indentation and line spacing. A style is a group of attributes that
    can be used in multiple places in the document, and may be a named style known
    by a name. If you change an attribute by a style (attached to the document), the
    attribute of all text in the document that uses styles will change. If a style
    is assigned to a paragraph, its attributes can be overridden by attaching attributes
    to a portion of the paragraph''s text. An attribute is a key/value pair, and families
    of attributes are defined by three interfaces: AttributeSet, MutableAttributeSet
    and Style.


    I will now show a program with a JTextPane, which uses styles. The program opens
    a window with a JTextPane and a menu:


