  md: '# JAVA 9: SWING, DOCUMENTS AND PRINTING


    # USER DEFINED COMPONENTS


    The starting point for a custom component is a class that inherits JComponent
    – another component, and especially a special as JPanel. Starting from the development
    of a component derived from JComponent, you can say that you are starting from
    scratch.


    A component can usually raise events and will have associated listeners for which
    notifications can be sent. In this case, a notification must be sent when the
    component’s properties (there are five) are changed, but since the class inherits
    JComponent, it already has the required logic for PropertyChangeEvent so PropertyChangeListener
    objects can be registered as listeners. The class must take care only of raising
    events for the five properties.


    As mentioned above, the class must also fire an event when the component’s value
    changes between the boundaries of the three areas (cold, normal and hot) and for
    that I have defined the following event:


