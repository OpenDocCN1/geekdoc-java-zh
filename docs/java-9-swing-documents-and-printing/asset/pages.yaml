  md: '# JAVA 9: SWING, DOCUMENTS AND PRINTING THE CLIPBOARD


    as in Java is represented by a class Clipboard, but otherwise the most important
    of course

    are the two handlers. You save data using the setContents() method, which has
    two

    parameters. The first is the data to be saved, while the other is the owner. It
    is not so

    often, but it has the type ClipboardOwner (that is an interface) and the meaning
    is that the\owner can get a notification if the clipboard''s content are overwritten
    (for example, from

    an application). In this example, the value of the parameter is null, which simply

    means that no notifications are sent.


    In order to have data saved on the clipboard – and again – they may be encapsulated

    a a data structure of the type transferable. It is an interface and there are
    several concrete

    classes that implement this interface, and StringSelection is an example of a
    transferable

    that is specially designed to transfer text. In this case, a string is encapsulated
    in a

    StringSelection object.


    Then there is the event handler paste(). One retrieves from the clipboard using
    the

    method getContent(), where the parameter is a DataFlavor, which tells what it
    is for a kind

    of data to be retrieved. The DataFlavor class has defined flavors, and stringFlavor

    is an example that tells data is a StringSelection. It is a transferable that
    has a method

    getData(), which returns the specific data, and this method also has a DataFlavor

    as parameter. In the fact, the statement that retrieves data from the clipboard
    could be written

    as follows:


    ```

    cb.getContents(null).getTransferData(DataFlavor.stringFlavor)

    ```


    The class Clipboard has a method getAvailableFlavors() that returns an array of
    DataFlavor

    objects that tell the contents of the clipboard can be interpreted. Sometimes
    for

    it it is text), the content can be interpreted in several ways (styled text, html,
    plain

    text) and there may be more DataFlavor objects the object defines most

    information will be first in the array. The last loop in the event handler paste()
    iterates

    over all DataFlavor objects, and there are two. In particular, if you getContent()
    indicates

    an incorrect DataFlavor or if the clipboard is empty, you get an exception.


    # 6.1 MIME TYPES


    When saving data on the clipboard, data will be defined by a class such as Java.lang.String,

    as as long as there is only a need to transfer data between Java applications,
    it is sufficient

    to tell a DataFlavor which type, but data should be transferred to other programs,
    which of

    course not know Java''s classes, and there is a need for another way to define
    what data

    formats are. Thus, there is a need for platform independent and language-neutral
    term for

    data formats. To this, MIME is used, which is an Internet standard, which makes
    it

    possible to attach various documents to electronic mail.


