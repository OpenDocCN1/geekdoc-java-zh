  md: 'The last method builds the data model of the tree based on the object model
    and thus the data read in the database. The data model is constructed as a hierarchy
    consisting of nodes of the type MutableTreeNode. The first node represents the
    root of the tree and thus a Denmark object. This node, is created a Region node
    for each region, and a node for the region''s municipalities, and finally, each
    municipality nodes a node for each zip code used by that municipality. The method
    is used in create() to create a JTree object, and you should note that the argument
    of the constructor is a TreeNode for the root of the tree.


    The individual nodes in a Tree can be referenced in several ways, with a TreePath,
    which is the list of nodes leading from the root to the particular node. Here
    you should note the method getPath(), which is a method that determines a TreePath
    object for a specific node. Here, it is assumed that all nodes that are not the
    root has a reference to the node that is a child.


    You must not use the method collapse() that collapses part of the tree. The method
    has a TreePath parameter and collapses part of the tree that has path no root.
    You should especially note how to refer to the node that TreePath represents.
    Also note that the method is recursive and how to collapse the node root with
    the statement


    ```

    tree.collapsePath(root);

    ```


    If you instead replace this statement with


    ```

    tree.expandPath(root);

    ```


    the method will expand the tree completely.


    Back there is the event handler for the button. By determining the tree''s root
    as a node, and then collapses the whole tree. Next, an ArrayList is created for
    TreePath objects, and a loop is performed over all child nodes to the root. Each
    iteration calls a method select() that creates a TreePath object for all nodes
    that match the search string. This method is also recursive, but the result is
    that the ArrayList contains all nodes that are to be represented by a TreePath.
    The list is finally used to mark the individual nodes


    ```

    tree.setSelectionPaths(paths.toArray(array));

    ```


    which means that the individual nodes are selected and that the tree is expanded
    so that all selected nodes are visible.'
