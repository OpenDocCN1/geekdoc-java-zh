  md: '# JAVA 9: SWING, DOCUMENTS AND PRINTING


    # USER DEFINED COMPONENTS


    The class has three constructors that initializes the six properties. The constructors
    are generally trivial, you should note that they define what the component is
    listening to the mouse. The event handlers are defined as inner classes at the
    end of the code. The two classes are trivial and there is not much to explain,
    but you should note what the classes are doing, and especially how they assign
    values to the variable marked.


    Then there are get and set methods for class''s properties. There are six get
    methods that, of course, are all trivial, and there are five set methods in which
    setValue() is the most important. The method can be called by the users, but is
    also called from the method of the event handler MouseHandler and hence each time
    the knob moves. First, the current value of the component is stored in a local
    variable, after the component is updated. Next, the component must be redrawn,
    by calling repaint(). Then the method fires PropertyChangeEvent for the property
    value, it is tested whether is a changed state (if the value represents another
    area) and, if it is the case, a KnobEvent firing, which occurs in the method fireEvent().
    The four other set methods work a bit, but are simpler. A PropertyChangeEvent
    is firing for that property, which is then updated and the component is redrawn.
    Note that the class methods so KnobListener objects can register themselves as
    listeners for KnobEvent''s and possibly again be unregistered.


