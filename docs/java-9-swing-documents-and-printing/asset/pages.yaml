    The class DnDrop implements DropTargetListener, which in the same defines 5 event
    traders, which are triggered by the drop component. I have implemented three of
    them. The first means that a frame appears around the top label when the mouse
    in a drag and drop operation is entered over the component. It shows the user
    that it is a place where you can drop. The second event handler removes the frame
    if the mouse longer points to the component. Then there is the handler drop(),
    which is performed when dropping – that is, releasing the mouse. The method tests
    whether the object to be dropped has the correct DataFlaver (a JLabel component),
    and if so, the following statement is performed:


    ```

    dropLabel.setBackground(((JLabel)e.getTransferable().

    TransferData(LABEL_FLAVOR).getBackground());

    ```


    The method takes the object that was transferred and converted to a JLabel. Next,
    the background color of the component dropLabel is changed to the background color
    of the transferred object. As the next step, the method removes the frame and
    finally the following executed:


    ```

    e.dropComplete(true);

    ```


    which tells that the drop operation is performed correctly.


    Finally, there is the class DnDGesture implements the DragGesture interface. This
    interface defines only a single method (event handler), which is a method performed
    when the drag and drop operation starts. It is actually the method that binds
    it together. The method starts to determine a reference to the label the drag
    operation concerns. Then, the method changes the cursor so there is a visual effect
    of the operation. Finally, the method starts the operation by specifying the selected
    cursor as well as encapsulating the current object in a Transferable object.


