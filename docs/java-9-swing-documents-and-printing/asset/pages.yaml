    A SLOT MACHINE


    The machine must be configurable and you should be able to choose whether to play
    with 3 or 4 wheels. In terms of configuring the machine, one must also be able
    to choose which and how many figures should be on each wheel, which combinations
    should give a win and what the winnings should be, and finally it should also
    be possible to choose which images to use. It must be possible for the player
    to choose from several configurations. When setting up a configuration, ensure
    that in the long-term configuration provides profits to the owner of the machine
    (the house), but at the same time, the machine must often make a gain to be sure
    that the machine gives so much back that there is someone who want to play on
    the machine.


    There should also be an opportunity for some kind of statistics, where you can
    see when the machine gives a win and how big the winnings are.


