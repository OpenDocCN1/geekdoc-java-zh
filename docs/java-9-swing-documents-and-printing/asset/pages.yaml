  md: '# INTRODUCTION


    In the book Java 2, I have considered the development of programs with a graphical
    user interface and including Swing, which is the Java API for the development
    of GUI applications, and I also have in subsequent books considered more examples
    of GUI programs. Specifically, I have in Java 6 about databases treated JTable,
    which is the most complex of the Swing components. All what previously are said
    regarding GUI programs are good enough, but there are a lot of more to tell, and
    including several concepts of Swing. The following deals primarily with what not
    previously are said, but some will be repetitions and elaborations of what I have
    already touched on concerning the development of GUI applications.


    I will divide the book in the following chapters and the individual chapters are
    largely independent of each other and can be read in any order:


    +   1. Swing details

    2. Layout

    3. Swing components

    4. User defined components

    5. The clipboard

    6. Drag and drop

    7. Edit text

    8. Internationalization

    9. Final example


    Part of the following are perhaps beyond the needs in everyday life, but as important
    issues, I would particularly highlight drag and drop as well as the clipboard,
    there are issues that necessarily must be mastered to work as a software developer
    in practice. Also I will mention the development of custom components.


    # 1.1 A COMMENT ABOUT SWING


    Before I address the subjects of this book I want to mentioning three classes,
    which I have already used, but may not have been referred to profit, and at least,
    it is worth knowing the classes, and I will use them as follows when needed.'
