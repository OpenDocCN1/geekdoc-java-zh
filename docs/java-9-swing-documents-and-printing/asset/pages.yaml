  md: 'Holding a key down (for keys with a unicode representation) briefly generates
    sequences of KEY_PRESSED and KEY_TYPED events.


    Each KeyEvent has associated so-called modifiers, which indicate the state of
    SHIFT, CTRL, ALT and META at the time of pressing a key. It is an int, which is
    a bitwise OR of the following constants


    +   - InputEvent.SHIFT_MASK

    - InputEvent.CTRL_MASK

    - InputEvent.ALT_MASK

    - InputEvent.ALT_GRAPH_MASK

    - InputEvent.META_MASK

    - InputEvent.BUTTON1_MASK

    - InputEvent.BUTTON2_MASK

    - InputEvent.BUTTON3_MASK


    The value can be changed by getModifiers() and you can test for the single keys
    by isShiftDown(), isControlDown(), isAltDown() and isMetaDown().


    It is thus possible to control components using the keyboard by registering KeyListener
    objects. Since it can be very extensive (to be written), Swing has defined an
    alternative way of using KeyStroke objects, you also call keyboard accelerators.
    A KeyStroke encapsulates a key release (true), a modifier value, and a boolean
    value, which indicates whether it is a key press (false) or a key release (true).
    The KeyStroke class has 5 static methods that create KeyStroke objects:


    +   - getStroke(char keyChar)

    - getStroke(int keyCode, int modifiers)

    - getStroke(int keyCode, int modifiers, boolean onRelease)

    - getStroke(String representation)

    - getStroke(KeyEvent anEvent)


    To register a listener for the keyboard for a JComponent is used:


    registerKeyboardAction(ActionListener action, KeyStroke stroke, int condition)'
