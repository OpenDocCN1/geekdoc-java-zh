  md: '# JAVA 9: SWING, DOCUMENTS AND PRINTING


    # SWING DETAILS


    The rest of the code concerns primarily to define accessor methods for properties.
    First, there are the two instances borderWidth and text. Here you should note
    the two set methods with repaint(). This statement forces the component to be
    redrawn. The method fires an event that is inserted into the event queue, and
    the event dispatch thread will then redraw the component when time is. There are
    also overrides of the two methods setFont() and setBackground() which do nothing
    but call the corresponding method in the base class. Note that no repaint() is
    required, as the basic class takes care of it. Finally, I also override the getPreferredSize(),
    getMinimumSize() and getMaxSize(), so they return a fixed size. It is for the
    sake of layout managers, who use these methods. Since the size is fixed, it does
    not make sense to use the set methods (they would not have any effect), and therefore
    they are overstocked so that they raise an exception. Alternatively, one could
    insert overriding as empty methods.


    Back there is the event management, which must necessarily implement the methods
    addActionListener() and removeEventListener(). Here you should note that listenerList
    is defined in the base class and can thus be referred from the derivative class
    TheBirds. Also note how listenerList is used in the ClickHandler class to send
    notifications to all listeners.


