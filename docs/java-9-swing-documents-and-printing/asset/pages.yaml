  md: "# JAVA 9: SWING, DOCUMENTS AND PRINTING\n\n```\npublic void addLayoutComponent(String\
    \ name, Component comp)\n{\n}\n```\n\n```\npublic void removeLayoutComponent(Component\
    \ comp)\n{\n}\n```\n\n```\npublic Dimension preferredLayoutSize(Container parent)\n\
    {\n    int left = getDivider(parent);\n    int w = 0;\n    int h = 0;\n    for\
    \ (int k = 1; k < parent.getComponentCount(); k += 2) {\n        Dimension d =\
    \ parent.get(k).getPreferredSize();\n        w = Math.max(w, d.width);\n     \
    \   h += d.height + vGap;\n    }\n    h -= vGap;\n    Insets insets = parent.getInsets();\n\
    \    return new Dimension(left + insets.left + insets.right, h + insets.top +\
    \ insets.bottom);\n}\n```\n\n```\npublic Dimension minimumLayoutSize(Container\
    \ parent)\n{\n    return preferredLayoutSize(parent);\n}\n```\n\n```\npublic void\
    \ layoutContainer(Container parent)\n{\n    int left = getDivider(parent);\n \
    \   Insets insets = parent.getInsets();\n    int w = parent.getWidth() - insets.left\
    \ - insets.right;\n    int x = insets.left;\n    int y = insets.top;\n    for\
    \ (int k = 1; k < parent.getComponentCount(); k += 2) {\n        Component component\
    \ = parent.getComponent(k);\n        Dimension d = component.getPreferredSize();\n\
    \        parent.getComponent(k - 1).setBounds(x, y, left - hGap, d.height);\n\
