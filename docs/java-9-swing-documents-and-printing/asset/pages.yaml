    # 10.4 PROGRAMMING


    If you have done a careful and analysis, possibly combined with one or more prototypes,
    you should have all the requirements in place at the start of the programming
    phase. It is at least the theory and, with practice, it will work for smaller
    projects. However, one must also acknowledge that no matter how careful you be,
    then during the programming can happen changes to the specification, including
    wishes for something that would work in that way or may even new wishes. In fact,
    it is not strange, and during the development of a program, the understanding
    of the application’s use and also the possibility of recognizing new features
    that the program should also have or something that is agreed in the specification
    can be advantageously modified all may cause changes. Obviously, the larger a
    program, the greater the chances are that during the programming there will be
    a desire to change the requirement specification.


    Should it happen – or it happens – you must contact the customer and present the
    changes, including what the changes will mean in terms of resource usage and the
    time horizon for when the program can be completed. Then there must be an agreement
    as to whether the new wishes are included in the project, or may they be postponed
    to later. In practice, it is important that such wishes come true, as a developer,
    you not just implements things that are not part of the requirement specification,
    since ultimately it is the customer who decides (and pays for) what should be
    part of the finished program.


    The conclusion is that even after a thorough in-depth analysis, there is an opportunity
    during the programming there will be wishes to change the requirement specification,
    wishes that may be clarified with the customer.


    The same applies to the design, and here is more the rule than the exception.
    This is due to several factors, among other things, the boundary between design
    and programming is not sharp. Thus, there will almost always be changes in the
    design, and usually changes that must be made by the developer without the customer’s
    approval.'
