  md: '# THE CLIPBOARD


    Using the clipboard and thus copy and paste is an expected functionality in modern
    programs, at least long as it are programs that process text. Basically, it is
    possible to select some object, as some text, and save them to the clipboard,
    retrieve it and perhaps even into a completely different program. In most programs,
    it is something that the programmer does not need to relate to, as many components
    (such as components for editing text) have functionality built-in. There are also
    situations where it is necessary to program copy and paste (for example, if you
    write custom components), therefore this chapter. Moreover, in the book Java 2,
    I have shown a little about how to do.


    In principle, it is quite simple, but if you are investigating how it is implemented,
    it is by no means simple, and there are several reasons for that. The clipboard
    is of some memory where you can save something, but the clipboard a concept outside
    the program and something that is administered by the operating system and by
    the virtual machine. Another problem is that data is not just data, and even text
    is not just text. For example, if writing text in a word processor contains the
    text many control characters and other formatting information must also be saved
    and later re-inserted for paste. It is therefore necessary to save information
    about what kind of data is stored on the clipboard. Finally, if you have to copy
    and paste between two programs programs, may not know other''s data formats. In
    general, one can immediately conclude that copying and pasting data between two
    different programs does not necessarily produce meaningful results.


    I want to start with a simple program that opens the following window:


    ![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_130_0.png)


    Clicking the Copy button some text are copied to the clipboard and clicking the
    button Paste opens a message box that displays the text copied on the clipboard
    (the text is taken from the clipboard). The program thus shows how to save data
    on the clipboard and retrieve this data. The code is as follows:'
