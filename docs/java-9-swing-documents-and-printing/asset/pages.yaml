    # 2.4 RENDERING OF COMPONENTS


    When the machine displays a component on the screen, it means that the component
    must be drawn and it is said that Swing is rendering the component. If the component
    changes at a later time – for example if a button is clicked – it must be drawn
    again. Generally a component is drawn by performing the method paint(), and it
    is a custom component where it is the programmer is in charge of drawing the component,
    you must override this method and the override must always start with the statement
    superComponent(). In fact, it''s not simple as much can happen with a component,
    and for example the component may be fully or partially covered by another component.


