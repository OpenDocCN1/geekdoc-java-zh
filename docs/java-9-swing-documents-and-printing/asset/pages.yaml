    The first statement in mousePressed() determines the index on the row that is
    selected. If a row is selected and if it is a double click, the path (in the hierarchy
    of the tree) is determined to the node that is clicked. Such a path is represented
    by a TreePath, which is a list of nodes from root to the current node. For example,
    if the click is on spade seven, the list – TreePath object consists of the root,
    the node representing spades, and the node represented spade seven. With the TreePath
    object available, the last node in the path is determined, which is the double-clicked
    node. Since only something has to be done when it is clicked on a node for a specific
    card, will it tested whether the node clicked on is a leaf node. If that is the
    case, the Card object assigned to the node is determined, which is to update a
    JLabel with that card.


