    THE CLIPBOARD


    A MIME type consists of a media type that can be considered as a parent category
    as well as a subtype that defines a more specific type within the category. The
    types are separated by the character / and an example be


    ...


    ```

    text/plain

    ```


    which indicates plain text without formatting information. There are many other
    MIME types, for example


    ```

    image/gif

    image/jpg

    text/html

    ```


    You can also define your own MIME types, which must consist of a known media type
    as well as a subset that starts with “x-”, which indicates that it is an unregistered
    type. Finally are


    ```

    application/octet-stream

    ```


