  md: '# JAVA 9: SWING, DOCUMENTS AND PRINTING INTRODUCTION


    First, I would like to mention Swing Utilities which is a class that contains
    many static utility methods. I have used the methods invokeLater() and invokeAndWait()
    to ensure that a method is performed in the event dispatcher thread. There are
    many other methods and you should study the class and the methods it provides.
    Most of the methods you rarely ever need, but it is good to know their existence.


    Another class is called SwingConstants, and as the name says, the class defines
    a number of constants. You are encouraged to investigate which ones. Generally,
    the different Swing components defines constants for example regarding alignment.
    That is, the constants are defined in several places, and the meaning by SwingConstants
    is instead of using the constants defined in the individual components classes,
    then you should use the constants in SwingConstants.


    Finally, there is the class SwingWorker, which is an abstract class that is to
    perform time-consuming GUI operations in one or more background threads. The goal
    is that timeconsuming tasks should not be performed in the event dispatcher thread,
    as a program then will be in a state where it is not responding. The goal of the
    class is to make it easier to perform time-consuming tasks in their own threads
    rather than yourself has to write the necessary code for threads.


    Comparing what is said about Swing in this book and the book Java 2, you are familiar
    with most of what Swing makes available to write programs with a graphical user
    interface. Everything is not explained, and in practice it is necessary to constantly
    look up the online documentation, partly because Swing is so extensive that it
    is impossible to learn everything, and partly because Swing is also developing.
    Swing is a very successful API for developing GUI programs, but is also criticized
    for writing a list. It''s also correct, but if you develop your own class libraries
    that fit the tasks that you typically solve, Swing can actually be done quite
    efficiently. However, there are alternatives and when the language is Java, it
    is javafx, which is a newer API for developing graphical user interfaces, but
    it is the subject for the book Java 16.'
