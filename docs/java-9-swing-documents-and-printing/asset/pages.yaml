  md: '# JAVA 9: SWING, DOCUMENTS AND PRINTING


    # SWING DETAILS


    When a component has focus and a key is pressed on the keyboard, the component
    (depending on the component in question) can send a KeyEvent. These events can
    be captured by associating a KeyListener. Unlike other events, a KeyEvent is sent,
    possibly before the corresponding operation is performed. When a key is pressed,
    three KeyEvents are fired:


    +   1. KEY_PRESSED that occurs when a key is pressed. The key is specified with
    a keyCode property, and getKeyCode() can get a virtual code representing the key,
    such as KeyEvent.VK_ENTER. You should be aware that combination keys such as CTRL-C
    fires two KEY_PRESSED events, and the virtual codes are KeyEvent.VK_CTRL and KeyEvent.VK.C.
    A KeyEvent also has a property keyChar, which contains the unicode code.

    2. KEY_RELEASED are identical to KEY_PRESSED events and firing when the key is
    released, they are not fired as often as KEY_PRESSED events.

    3. KEY_TYPED are events that are firing between KEY_PRESSED and KEY_RELEASED,
    but no keyCode is attached. These events are not fired for keys that do not have
    a unicode representation such as PAGE UP and PRINT SCREEN.


    ![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_44_0.png)'
