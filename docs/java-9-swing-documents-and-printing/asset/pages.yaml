  md: '# 10 A SLOT MACHINE


    As the final example of this book, I will show the development of a program that
    will simulate a slot machine. The aim is, of course, to show the use of the concepts
    introduced in this book, but where the focus is also on the process. A slot machine
    consists of (typical) three wheels on which some figures are placed. The wheels
    rotate and the combination displayed when the wheels stops, determines whether
    there is a win and, if so, how much the winnings are. To write a program that
    can simulate such a machine and thus wheels that rotates, I need concepts that
    have been dealt with in the next book, and the code can therefore be written after
    you have read the next book (or equivalent Java). The following version of the
    program will therefore not simulate rotating wheels, but just show the figures.


    As mentioned, I want to focus on the process. At least on analysis and design,
    the program is relatively large and during the programming I will primarily describe
    what is made and what you should especially notice when you read the code, but
    not much about how it was made since the number of pages will be very extensive.
    For the same reasons, I will not describe how to write an installation script,
    but you can do it in the same way as shown for other programs.


    # 10.1 TASK FORMULATION


    A program must be written to simulate a slot machine on a regular PC. There must
    be some form of user administration, and in order to play the machine, you must
    be created as a user with an account and have deposited money on the account.
    It must also be possible to receive an amount from the account if there is money
    on it which in practice will mean you have won.


    You should not be able to play with “real” money, but the program must be able
    to simulate that the player puts in money and that the player gets paid money.'
