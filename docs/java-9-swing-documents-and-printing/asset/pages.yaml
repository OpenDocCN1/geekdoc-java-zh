  md: "# JAVA 9: SWING, DOCUMENTS AND PRINTING\n\nand added to the container in that\
    \ order, which is an essential condition for this layout manager. The layout manager\
    \ will then put the components into two columns, where the first column (called\
    \ the header column) contains all label components, while the other column contains\
    \ the other fields. The width of the first column is by default the largest width\
    \ of all label components, but you can specify a fixed size. The width of the\
    \ second column is the largest width of the fields. The code here is as follows:\n\
    \n```\npublic class DialogLayout implements LayoutManager\n{\n    private int\
    \ divider = -1; // horizontal a possible fixed width of the headers\n    private\
    \ int hGap = 10; // horizontal gap between components\n    private int vGap =\
    \ 5; // vertical gap between components\n\n    public DialogLayout() {\n    }\n\
    \n    public DialogLayout(int hGap, int vGap) {\n        this.hGap = hGap;\n \
    \       this.vGap = vGap;\n    }\n```\n\n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_61_0.png)"
