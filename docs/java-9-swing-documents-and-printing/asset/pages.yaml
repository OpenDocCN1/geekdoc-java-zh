    # 8.4 DOCUMENT


    As mentioned, all text components use a model, as defined above by the Document
    Interface. The model represents the text that the user edits, and if it is a styled
    document, it is also the model that represents the attributes. The Document interface
    does not define anything about styles, but instead, it takes place in a sub-interface
    `StyledDocument`. The concrete models can thus be illustrated by the following
    figure, where `AbstractDocument` as evidenced by the name is an abstract class,
    `PlainDocument` and `DefaultStyledDocument` are concrete classes. `PlainDocument`
    is the model for a `JTextField` and a `JTextArea` component, while `DefaultStyledDocument`
    is the model of a `JTextPane` and a `JEditorPane.


    ![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_196_1.png)


