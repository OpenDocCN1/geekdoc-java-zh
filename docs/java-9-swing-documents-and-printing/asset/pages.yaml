  md: '# JAVA 9: SWING, DOCUMENTS AND PRINTING


    The ActionListener parameter must define the method actionPerformed() to perform
    the necessary operations corresponding to the KeyStroke parameter. The last parameter
    specifies under conditions that KeyStroke is valid:


    +   - JComponent.WHEN_FOCUSED, the ActionListener is called only if the component
    to which the KeyStroke object has focus.

    - JComponent.WHEN_ANCESTOR_OF_FOCUSED_COMPONENT, the component''s ActionListeners
    are called only if the KeyStroke object concerns is on a higher level (ancestor)
    than the component that has focus.

    - JComponent.WHEN_IN_FOCUSED_WINDOW, the ActionListener is called only if the
    component to which the KeyStroke object relates is in a window that has focus
    (JFrame, JDialog, JWindow).


    For example, if you want to define an ActionListener for ALT-H, regardless of
    which component in a JFrame the name frame that has focus, you can write something
    like the following:


    ```

    KeyStroke keyStroke =

    KeyStroke.getKeyStroke(KeyEvent.VK_H, KeyEvent.ALT_MASK, false);

    frame.getRoot().registerKeyboardAction(listener, keyStroke,

    Component.WHEN_ANCESTOR_OF_FOCUSED_COMPONENT);

    ```


    where listener is the name of the actual ActionListener.


    Each JComponent maintains a Hashtable with all KeyStroke as client properties.
    When a KeyStroke is registered with registerKeyboardAction(), it is added to this
    data structure. Only one ActionListener for each KeyStroke can be registered and
    if there is already an ActionListener for a particular KeyStroke, a new one overwrites
    the previous one. You can determine the current KeyStroke bindings using the getRegisteredKeyrokes()
    method and remove all bindings with resetKeyboardActions().


    By an Action, you basically understand an instance of an ActionListener with Hashtable
    bound properties, in fact, similar to client properties in JComponent. Typically,
    you use Action objects to record keyboard actions.


