  md: 'JAVA 9: SWING, DOCUMENTS AND PRINTING


    # 9 INTERNATIONALIZING


    Sometimes programs must be used in several countries and thus in multiple languages,
    and it demands the capability'' user interface and how data are displayed. One
    option would be to write several versions of the same program (an English version,
    a Danish version and so on), but for maintenance reasons it is not an optimal
    solution. However, Java supports internationalization, so the program itself determines
    how data should be displayed on where it is used. It is the subject of this chapter,
    and it is by no means simple, and the following is it relates to an introduction
    to what it''s all about.


    Basically, it relates to the language used by the program to display text, as
    well as the formats for dates, times and numbers. In reality, there are two things,
    and internationalization means the program supports multiple languages and formats,
    while by localization is understand as the process that the program determines
    which language and formats to use. it is all complicated by the fact that more
    countries use the same language, and some countries use more languages, and in
    the same way there is no clear distinction between language and formatting rules.
    Seen from Java, the starting point is the class Locale, which basically consists
    of three properties:


    +   1. a language code (ISO-639)

    2. a country code (ISO-3166)

    3. a variant code that is not required


    The language code is two or three characters and as examples can be mentioned


    English en eng

    French fr fra

    Germande deu

    Danish da dän


    Similarly, the country codes are two or three characters, and as examples can
    be mentioned


    English gb gbr

    French fr fra

    German de deu

    Denmark dk dnk


