  md: 'Note that the ModelAndView implements the interface PropertyChangeListener
    and can be registered as listener for PropertyChangeEvent''s. Otherwise, the most
    important method is createButton(), which creates a button. How to define a client
    property for the button, which means that a button has a counter that from the
    start has the value 0. The button''s event handler has the type ClickHandler (an
    inner class) and it displays the first of the above message boxes. You should
    note how to refer to the client property clickCounter, and also that the event
    handler counts this property with 1. When this happens, the button fires an PropertyChangeEvent,
    in this case the ModelAndView''s propertyChange() method is performed (MainView
    registered as listener) that opens the selector dialog box.


    # # EXERCISE 1


    Create a copy of the project PropertiesProgram. You must now change the program
    to perform exactly as before, but instead of associating a client property with
    the buttons, you should write a type CounterButton extends JButton with a property
    counter, and the window should then contain 9 Counter components. Note that this
    means the method setCount() should fire a PropertyChangeEvent.


    # # 2.2 SIZE AND LOCATION


    As described in the book Java 2, a component''s size is defined by three properties
    of the type Dimension:


    +   1. preferredSize

    2. minimumSize

    3. maximumSize


    but to what these properties are used, as is explained in Java 2, completely determined
    by the current layout manager. In fact, it is allowed to write a layout manager,
    that completely ignores these properties. It is absolutely essential to mention
    that the exact size and location of a component in a window is determined by the
    current layout manager. You can also define the size and location of a component
    with setBounds(), but here you should be aware that a layout manager suppresses
    the values set with setBounds() (or setSize()) and setLocation(). If you want
    to place the components in this way, remove the layout manager by setting it to
    null.'
