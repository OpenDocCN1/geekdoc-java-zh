  md: '# USER DEFINED COMPONENTS


    In the first chapters of this book I have mentioned custom components and actually
    even given two examples, and in this chapter I will attach remarks to how to create
    good custom components. As described in the previous chapter, Swing is born with
    many components that offer what may be needed to design a graphical user interface,
    but on the other hand, there may be special places where you need to develop your
    own components, and, on the other hand, a window may contain panels that will
    be used in multiple places, and therefore it may be worth developing your own
    custom components. In any case, the motivation for writing a custom component
    will always be that there is a need for a graphical element that may be used in
    multiple places and typically even in completely different programs from the current
    one.


    In principle, it''s easy to write custom components using Swing, but if you do
    it right, and thus write components behave like any other Swing component, it''s
    not quite simple and there are several requirements that you need ensure that
    a custom component complies. Therefore this chapter.


    ![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_97_0.png)'
