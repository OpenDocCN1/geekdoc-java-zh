  md: '# JAVA 9: SWING, DOCUMENTS AND PRINTING


    # EDIT TEXT


    Basically, you can think of a JTextPane as a JTextArea and a component where you
    can enter and edit text lines, with the big difference that the component supports
    styling of the text. This means that individual text elements have assigned style
    objects in the form of, for example, font and color. The component can actually
    do more than that, it can display images and even other Swing components. Like
    the other Swing components, a JTextPane is designed by MVC, and the model is defined
    (similar to the other text components) of the Document interface, and a JTextPane
    uses the concrete class StyledDocument as model. It is thus the model that keeps
    track of the individual style elements. The model is dealt with the first in the
    next section, and this section will primarily show how to use a JTextPane in a
    program.


    I want to start with an application that opens a window with three buttons. Over
    the three buttons is a JTextPane in a JScrollPane. If you click the Insert Text
    button, this Hello World is inserted at the cursor’s position. Clicking the Insert
    icon instead adds an icon at the cursor’s position, and clicking the Insert component
    adds a button. Below the window after I have


    +   1. clicked the button Insert text twice

    2. clicked the button Insert icon

    3. clicked the button Insert text four times

    4. clicked the button Insert component twice


    ![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_184_0.png)


    If instead select some of the content and click on one of the buttons, the selected
    will be replaced by what are inserted. You should note that the buttons are real
    buttons and clicking on one of them will give you a message box. In fact, you
    can insert any Swing component and hence a JPanel, and then you can insert a form.
    The example here has nothing to do with styling, but it shows that the component
    is capable of rendering.


