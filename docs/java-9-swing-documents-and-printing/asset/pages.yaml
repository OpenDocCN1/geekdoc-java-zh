  md: '# 2.3 EVENT HANDLING


    Events appear generally when a key is pressed on the keyboard or when something
    happens to the mouse (clicking on a button or moving the mouse). Swing components
    can fire different kinds of events, which are types defined in java.awt.event
    or javax.swing.event, and many of them are component specific. Each event type
    defines at least the object that has fired the event in question but will also
    contain other information about the state of the object. There are also events
    that are not raised by a component.


    In order for an object to receive notifications regarding an event, the object
    must be registered as listening to it. To make it, the class of the object must
    implement a listener interface (for example ActionListener), and then the object
    can be registered (for example, with addEventListener()).


    The abstract class Component defines a protected field of the type EventList,
    called listenerList, which all components inherit. The type EventList is an array
    of pairs of the form XX / XX is an event type. This array contains the listeners
    of the component and which events are listened to, and the component can then
    send notifications to listeners when an event occurs. When an array is used instead
    of a collection, it is to increase performance since a collection such as ArrayList
    is a relatively complex class. In fact, it means that a new array must be created
    (and copied) every time a listener is added, but it is still cheaper using a collection,
    because it is limited how many listeners are registered for a given component.


    All events are handled by event handlers by the registered listener objects, and
    as described in the book Java 8, these handlers must be performed by the event
    dispatching thread, which is the thread that carries out all location and drawing
    of the individual components. The thread is linked to a FIFO queue of events processing,
    and the individual events are processed in the order in which they are inserted
    into the queue and the next one not be processed until the previous one is completed.
    Otherwise, one could risk the state of a component being changed while it, for
    example, redraw. For this reason, you must not perform an event handler outside
    the event-dispatching thread by, for example, to call the method fireXX() directly
    from another thread. It is also important that event handlers and code that draws
    the components are effective, as you may else risk blocking the system from events
    in the event queue waiting for treatment.'
