    \ how the component can be changed and how to read the component's state.\n2.\
    \ The component's model that consists of a defining interface and a default implementation.\
    \ It is the model that implements the component's logic and sends notifications\
    \ to listeners.\n3. A so-called UI delegate, who stands for the component layout,\
    \ event management regarding mouse and keyboard, and finally, is the UI delegate\
    \ who will draw the component.\n\nThe project KnobProgram is the same program\
    \ as the project Knob, but the Knob component is written in accordance with the\
