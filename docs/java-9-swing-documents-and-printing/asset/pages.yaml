    # LAYOUT


    ![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_65_0.png)


    All components should be added to a panel with a DialogLayout in a sequence (as
    in the above example), but the components are placed in groups in the order in
    which they are added to the container based on the following rules, where there
    are three grouls:


    +   - COMP_LBL that includes pairs consisting of a JLabel and another component
    that is in the same as the previous version of DialogLayout

    - COMP_PAN that includes JPanel, JScrollPane and DialogSeparator (a custom component
    that is the horizontal line shown in window).

    - COMP_CMD that includes AbstractButton JButton, JCheckBox, JRadioButton)


    When added, a group span until the group type is changed. The components in the
    individual groups are laid out as follows:


    +   - COMP_LBL: The components are laid out in pairs in the same way as the previous
    DialogLayout

    - COMP_PAN: The components are laid out vertically underneath each other

    - COMP_CMD: The components are laid out horizontal and ajusted, centered or right


