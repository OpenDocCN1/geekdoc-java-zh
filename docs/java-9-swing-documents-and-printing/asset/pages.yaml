    # 5.3 A BETTER KNOB


    A custom component is often developed as described above, and as components as
    part of one''s applications, it is also an excellent method, but the method is
    not entirely in line with the recommendations for how to develop a Swing component,
    partly because the component should support look-and-feel. For practical programming,
    the biggest problem with the Knob component, as described above, is that it does
    not separate user interface and model, which makes it more difficult to maintain
    the code. In this section I will look at another version of the Knob component,
    where the difference is that the code is written differently.


