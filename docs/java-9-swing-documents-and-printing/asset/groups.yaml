    \ Java 的角度来看，起点是 `Locale` 类，它基本上由三个属性组成：\n\n- 1. 语言代码 (ISO-639)\n- 2. 国家代码 (ISO-3166)\n\
    - 3. 一个可选的变体代码\n\n语言代码为两个或三个字符，例如：\n\n英语 en eng\n法语 fr fra\n德语 deu\n丹麦语 da dän\n\
