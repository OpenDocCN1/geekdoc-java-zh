    long line (unless you directly insert line breaks). The other JTextArea will automatically
    break lines that are to long. You should note that the text is defined as html,
    and since a JTextArea does not format the text, all characters are displayed without
    interpretation.


    The field in the lower left corner was created by the method createTextPane().
    A JTextPane showed styled text, which means you can insert attributes into the
    text that specify how the text is to be formatted. In this case, font size and
    color attributes are entered. You should study the method createTextPane() and
