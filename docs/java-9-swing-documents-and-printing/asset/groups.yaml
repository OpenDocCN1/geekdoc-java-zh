    # 3.1 LAYOUT MANAGERS


    Layout managers are treated in the book Java 2, where I have shown how most managers
    work, and while there are more, I will not associate additional comments with
    the classic layout managers in this place. With the layout managers discussed
    in Java 2, you can actually design any layout for a window although it is not
    necessarily simple. For reason or maybe because you have special needs, you may
    be interested in writing your own layout manager, and I will show below a two
    examples of how to do.


    A layout manager is basically a class that implements the interface LayoutManager,
    or a derived interface called LayoutManager2. The difference is whether it is
    a layout manager where you call so-constrained for the components'' location,
    what do you do in, for example a BorderLayout and a GridBagLayout. The interface
    LayoutManager defines basically two methods:


    +   - preferredLayoutSize(Container parent) that determines the preferred size
    for the actual container

    - layoutContainer(Container parent) that layouts the components in the container


    If you opens the program LayoutProgram, you get the following window:


