    \n## 2.3 事件处理\n\n事件通常在按下键盘按键或鼠标发生某些操作（点击按钮或移动鼠标）时出现。Swing 组件可以触发不同类型的事件，这些类型定义在\
    \ `java.awt.event` 或 `javax.swing.event` 中，其中许多是特定于组件。每个事件类型至少定义了触发该事件的对象，但还会包含有关对象状态的其他信息。还有一些事件不是由组件提出的。\n\
    \n为了让对象接收有关事件的通知，该对象必须注册为它的监听器。要实现这一点，对象的类必须实现监听器接口（例如 `ActionListener`），然后就可以注册对象（例如通过\
    \ `addEventListener()`）。\n\n抽象类 `Component` 定义了一个 `EventList` 类型的保护字段 `listenerList`，所有组件都继承了它。`EventList`\
    \ 类型是一个对数组，形式为 `XX / XX` 是事件类型。该数组包含了组件的监听器以及所监听的事件，当事件发生时，组件可以向监听器发送通知。使用数组而不是集合是为了提高性能，因为像\
    \ `ArrayList` 这样的集合是一个相对复杂的类。事实上，这意味着每当添加监听器时都必须创建一个新数组（并复制），但使用集合仍然更便宜，因为为给定组件注册的监听器数量是有限的。\n\
    \n所有事件都由注册的监听器对象的事件处理器进行处理，正如《Java 8》书中描述的，这些处理器必须由事件分发线程（event dispatch thread）执行，该线程负责执行所有单个组件的定位和绘制。该线程与一个先进先出（FIFO）事件处理队列相连，各个事件按照它们插入队列的顺序进行处理，在上一个事件完成之前，下一个事件不会被处理。否则，可能会面临组件状态在处理期间（例如重绘时）被更改的风险。因此，你绝不能在事件分发线程之外执行事件处理器，例如直接从另一个线程调用\
    \ `fireXX()` 方法。同样，事件处理器和绘制组件的代码必须是高效的，否则你可能会面临系统阻塞的风险，导致事件队列中的事件等待处理而无法被处理。\n\
    \n为了确保所有与事件处理器相关的代码都在事件分发线程中执行，在 Java 中我展示了 `SwingUtilities` 类有两个方法 `invokeLater()`\
    \ 和 `invokeAndWait()`，它们会将一个可运行对象添加到系统事件队列中。确保代码在事件分发线程中执行的经典模式是如下如下执行代码：\n\n\
    ```java\npublic void doThreadSafeWork() {\n    if (SwingUtilities.isEventDispatchThread())\
    \ {\n        // 在此处执行所有工作...\n    }\n    else {\n        Runnable callDoThreadSafeWork\
    \ = new Runnable() {\n            public void run() {\n                doThreadSafeWork();\n\
    \            }\n        };\n        SwingUtilities.invokeLater(callDoThreadSafeWork);\n\
    \    }\n}\n```\n在这里首先测试代码是否由事件分发线程执行。当 SwingUtilities 通过 `invokeLater()` 接收到一个\
    \ Runnable 时，它会被立即转发到 SystemEventQueue 中。\n\n# JAVA 9: SWING、文档与打印\n\n## SWING\
    \ 细节\n\n### 2.4 组件的渲染\n\n当机器在屏幕上显示组件时，意味着组件必须被绘制，这被称为 Swing 正在渲染组件。如果组件稍后发生变化——例如点击了按钮——它必须重新绘制。通常，组件通过执行\
    \ `paint()` 方法来绘制，对于自定义组件，即由程序员负责绘制组件，你必须重写此方法，且重写必须始终以 `super()` 开始。事实上，这并不简单，因为组件上会发生很多事情，例如组件可能完全或部分地被另一个组件覆盖。\n\
