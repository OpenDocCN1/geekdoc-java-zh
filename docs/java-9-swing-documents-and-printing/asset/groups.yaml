    \ consists of a media type that can be considered as a parent category as well\
    \ as a subtype that defines a more specific type within the category. The types\
    \ are separated by the character / and an example be\n\n```text\ntext/plain\n\
    ```\n\nwhich indicates plain text without formatting information. There are many\
    \ other MIME types, for example\n\n```\nimage/gif\nimage/jpg\ntext/html\n```\n\
