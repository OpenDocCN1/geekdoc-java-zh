    \ = new JPanel(new GridLayout(8, 1, 0, 5));\n        JPanel right = new JPanel(new\
    \ GridLayout(8, 1, 0, 5));\n        add(left);\n        add(right);\n        left.add(new\
    \ JLabel(\"Style Name\", JLabel.LEFT));\n        right.add(txtName);\n       \
    \ left.add(new JLabel(\"Font\", JLabel.LEFT));\n        right.add(lstFont);\n\
    \        left.add(new JLabel(\"Size\", JLabel.LEFT));\n        right.add(lstSize);\n\
