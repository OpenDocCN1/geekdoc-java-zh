    - uninstUI(JComponent)

    - update(Graphics g, JComponent)

    - paint(Graphics g, JComponent)

    - getPreferredSize(JComponent)

    - getMinimumSize(JComponent)

    - getMaxSize(JComponent)


    Most UI delegates are written to know a component''s model (or models as a component
    may have multiple model objects) through a defined interface. Swing has multiple
    families of UI delegates, and each family contains a class (which implements ComponentUI)
    for most Swing components, and such a family is called a look-and-feel (or PLAF
    for pluggable look-and-feel). javax.swing.plaf contains abstract classes derived
    from ComponentUI and javax.swing.basic consists of classes that expand the abstract
    classes from javax.swing.plaf with specific classes. These UI delegate classes
    are used as the building blocks of all look-and-feel families. There are the following
    families, called Windows, Motif and Metal, respectively:'
