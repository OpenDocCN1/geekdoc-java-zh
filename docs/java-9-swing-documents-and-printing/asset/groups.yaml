- md: "\n## 8.5 A JEDITORANE\n\nAs the last of Swing's text components, JEditorPane\
    \ should be mentioned. It's a component that rarely has any interest in it, but\
    \ it can be perceived as the base class of styled text components, and a JTextPane\
    \ an example of a text component derived from JEditor. As can be seen from the\
    \ above, a JTextPane is a component that can be used to edit a document with style\
    \ information is assigned. The actual text is represented by a StyledDocument,\
    \ but some logic is to control how text and styles can be edited (what actions\
    \ can be performed) and it is all encapsulated in an EditorKit. The simple text\
    \ components such as JTextField and JTextArea use a DefaultEditorKit while a JTextPane\
    \ uses derived class StyledEditorKit. The goal of a JEditorPane is that you can\
    \ define its own text component derived from JEditorPane by defining its own EditorKit\
    \ and its Document type, defining text components that exactly support the tasks\
    \ you need. In fact, Swing comes with two examples that can be used to edit html\
    \ and rtf documents.\n\nIn this section I will illustrate how you can write your\
    \ own html editor. The goal is not to reach a finished html editor (is comprehensive),\
    \ but to show a little more about text components and a little about what an EditorKit\
    \ is. I want to start with an example called AEditorPane. If you run the program,\
    \ you will get the following message box:\n\n```\nMessage\njavax.swing.text.HTMLEditorKit\n\
    OK\n```\n\nand when you click OK, you will get the following window:\n\n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_201_0.png)\n\
    \n# JAVA 9: SWING, DOCUMENTS AND PRINTING\n\nThe window shows the following html\
