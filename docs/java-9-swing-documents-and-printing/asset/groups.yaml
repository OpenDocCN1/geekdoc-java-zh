    # LAYOUT


    A window consists of panels in which to place components. Viewed from the programmer,
    a window is a JFrame, JDialog or a JWindow (a window without a title bar), all
    of which have a single panel of components. There is a special panel called rootPane,
    which has the type of JRootPane and called rarely referred to. It contains two
    panels, called layeredPane and glassPane. Here is the last JPanel that is invisible
    (transparent), which can be used to place something in a window that is located
    above all. The other has the type JLayerPane and is also a panel that is not directly
    referenced, but it has two panels, where the first one is special and called JMenuBar
    and is used for the window menu while the other is a JPanel and is called contentPane
    for the other contents of the window (see below). It is therefore for the window''s
    contentPane that you want to add components, but generally you do not have to
    think about it, because if you (for example, in the constructor of a JFrame or
    a method called from the constructor write something like the following:


    ```

    setLayout(new FlowLayout);

    add(component);

    ```


    it automatically refers to the window''s contentPane — least today, but previously
    it was necessary to write


    ```

    getContentPane().setLayout(new FlowLayout);

    getContentPane().add(component);

    ```


    ![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_53_0.png)


    A panel has a layout manager that determines how components are placed in the
    panel. By default, a JFrame and a JDialog have a BorderLayout, while a JPanel
    has a FlowLayout.'
