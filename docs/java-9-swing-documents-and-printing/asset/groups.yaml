    # 4.2 JTree


    JTree is a component that can visually display hierarchical data, and you actually
    know the component from a JFileChooser, where the component is used to browse
    the system. The actual Swing component must visualize a hierarchy, and the data
    to be visualized comes from a data model, and similar to, for example, the component
    JTable, a JTree uses several helper classes, as in this case are found in javax.swing.tree.
    JTree is a complex class with many properties and settings, and in the following
    I will illustrate how the component can be used.


