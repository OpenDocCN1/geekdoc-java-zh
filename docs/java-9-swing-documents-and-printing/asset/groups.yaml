    JAVA 9: SWING, DOCUMENTS AND PRINTING


    SWING DETAILS


    As for the main application that opens the window above, I will not mention it
    here as it does not add anything new, but I can mention that it has a BorderLayout
    and shows TheBirds component encapsulated in a FlowLayout.


    The above component draws a text using a particular font, and in fact fonts are
    quite complex. Considering the figure, it should illustrate two lines with a particular
    font. The fully drawn lines are the baseline, and when drawString() draws a text,
    the y-coordinates refer to the baseline. The part above the baseline is called
    ascent, while the part below the baseline is called descent. Between lines there
    is a distance and height is the distance two baselines.


    ![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_33_0.png)


    The above paintComponent() uses the class FontMetrics, which generally returns
    a number of information about the current font. The class also has a method stringWidth(),
    which returns the length of a string measured relative to the current font. In
    the example above, these values are used to draw the text centered in the component.


    The key to validating and rendering components is performed by a service RepManager.
    It is responsible for sending events to the event dispatch queue, which is done
    using two methods repaint() and revalidate() that encapsulate events in runnable
    objects and send them to invokeLater(). The difference is that repaint() tells
    the component to be redrawn and that the paintComponent() needs to be executed
    again, while the revalidate() tells the layout manager that components must be
    layout out, so that their location and size are recalculated. Swing components
    use as default double-buffering, which is a technique in which, instead of drawing
    directly on the physical device, the drawing is performed in a memory buffer.
    One can think of it as a memory representation of a drawing like a picture, and
    after the image is drawn, it is sent to the physical device as a whole, which
    is very fast and for us people it means that we get a stable image. Otherwise,
    in complicated screens, one might find that the drawing process takes time.


