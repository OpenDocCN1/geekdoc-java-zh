    # JAVA 9: SWING, DOCUMENTS AND PRINTING


    As mentioned, the boundary between design and programming is not sharp, which
    can result in significant decisions are postponed to the programming phase. In
    general, you should be careful and there is a tendency or the risk under the design
    not to find challenges and problems that must be solved. This indicates that during
    the design, sufficient time is not used, neglecting or underestimating problems
    that may occur during the programming. It''s hard to put the right distinction
    between design and programming, but conversely, under the design work with the
    big lines and not writing the program, but the result is, if significant decisions
    are postponed for programming, there is a great risk that parts of the code that
    is written must be changed or, at worst, rewritten. Therefore, it is important
    that all major challenges are dealt with before you write the program.


    In connection with the development of this program, there are actually examples
    of tasks that should have been treated better under the design and, for example,
    I would like to mention two.


    It is part of the requirements that the administrator must be able to test the
    individual configurations as how they earns and how much the house earns on the
    configuration. How it will happen is not either in the analysis or the design.
    If it has not been processed through the analysis is an indication that it developers
    to come up with a solution, which is not unusual, and therefore there should be
    a sketch of a solution under the design. For example, it should have been considered
    whether the database has the data needed to make a reasonable analysis of a given
    configuration.


    Another issue is what happen if you change or delete a configuration. Doing so,
    the data recorded for games with the configuration is not necessarily longer valid,
    meaning that information about the individual player''s use of the machine is
    no longer valid. The data in question can not be deleted, as it also deletes how
    a player has won or lost. It is also an example of a problem that has been solved
    during the design.


    # THE CURRENT PROGRAM


    With a slightly larger program, the programming phase should be divided into multiple
    iterations, where an iteration is defined as a part of the program that can be
    developed and tested independently, something that I have previously illustrated.
    This also applies to the current program, but I do not want to review the individual
    iterations this time, but only focus on the final result, pointing out what has
    been made and where the biggest challenges have been.


    # JAVA 9: SWING, DOCUMENTS AND PRINTING A SLOT MACHINE


    I want to use the library PalLib, and to the extent that it does not contains
    the required library methods it should be updated. The result of the task is thus
    both the current program and an updated library.


    The program has a classic MVC architecture:


    ![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_241_0.png)


    The dal layer has only one class DB. The class is written as a singleton and has
    all methods that maintains the database. The class is extensive, but does not
    contain anything new.


    The model layer has the classes from the design. They are all modified where the
    methods are implemented, and some new classes have also been added, but in general
    there are few and simple extensions. Specifically, there is the class Repository,
    which is a fairly thin adapter class to the dal layer. In principle, the class
    is meaningless as it does nothing but delegate call of methods to the class DB,
    and its sole purpose is that the dal layer should not be known in the view and
    controller layers.


    A large part of the code is in the view layer, which defines no less than 33 types
    (classes and interfaces). The number exaggerates several classes are model classes
    for JTable components as well as CellRenderer classes, and many of the other classes
    relate to simple dialogs. This corresponds to that are almost two windows, that
    are not simple dialog boxes, and the control layer has only 7 classes.


    When you opens the program, you will meet the following window:


    ![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_242_0.png)


    If you click on *Close* in the *Logon* dialog box or click on the cross in the
    upper right corner, the program ends so you can not play before there is a player.
    If you are not a player, you can click on *New player*, and you will get a dialog
    box where you can be created as a player:


    # JAVA 9: SWING, DOCUMENTS AND PRINTING A SLOT MACHINE


    ![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_243_0.png)


    SIMPLY CLEVER


