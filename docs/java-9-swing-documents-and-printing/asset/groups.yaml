  mdcn: "\n\n# JAVA 9: SWING、文档与打印\n\n## 用户自定义组件\n\n在后文中，只有绘制组件以及如何实现将是下一本书的主题，但简而言之，会发生以下情况。当组件需要被绘制时，会调用\
    \ `paintComponent()` 方法。当运行时发现组件无效（必须重绘）时会调用它，这通常发生在窗口创建时或执行 `repaint()` 方法时。注意，set\
    \ 方法会执行此操作，并确保当组件属性更改时窗口会被重绘。`paintComponent()` 方法有一个 `Graphics` 对象，它代表绘制区域并提供了一些绘制工具。在这种情况下，会发生以下操作：\n\
    \n- 1. 调用 `calculatePosition()` 方法，该方法初始化辅助变量并返回旋钮的 y 坐标\n- 2. 将 `Graphics` 对象强制转换为\
    \ `Graphics2D` 对象，它具有更好的绘制工具\n- 3. 定义绘图质量\n- 4. 将颜色定义为红色\n- 5. 绘制一个圆\n- 6. 为热点区域绘制一个矩形\n\
    - 7. 将颜色定义为橙色\n- 8. 为普通区域绘制一个矩形\n- 9. 将颜色定义为蓝色\n- 10. 绘制一个圆——带有水银的下方的圆\n- 11.\
    \ 为冷区域绘制一个矩形\n- 12. 将颜色定义为洋红色\n- 13. 绘制旋钮\n\n然后是一个使用 `Knob` 组件的测试应用程序，我不想在这里显示代码，但你应该注意，该组件的使用方法与其他组件相同。\n\
    \n## 5.3 更好的旋钮\n\n自定义组件通常如上描述的那样开发，并作为应用程序的组件使用，这也是一种极佳的方法，但这种方法并不完全符合开发 Swing\
    \ 组件的建议，部分原因是组件应该支持外观和感觉（look-and-feel）。对于实际编程而言，上述所示，`Knob` 组件最大的问题是它没有分离用户界面和模型，这使得代码维护变得困难。在本节中，我将查看\
    \ `Knob` 组件的另一个版本，其区别在于代码的编写方式不同。\n\n基本上，一个 Swing 组件由：\n\n- 1. 组件类，它指定了如何创建组件、如何更改组件以及如何读取组件的状态。\n\
    - 2. 组件模型，由一个定义接口和一个默认实现组成。模型负责实现组件的逻辑并向监听器发送通知。\n- 3. 所谓的 UI 代理，它代表组件布局、关于鼠标和键盘的事件管理，最后是负责绘制组件的\
    \ UI 代理。\n\n`KnobProgram` 项目与 `Knob` 项目是同一个程序，但 `Knob` 组件是按照上述模式编写的。基本上，它们是相同的代码，只是组织方式不同。\n\
    \n组件仍然可以抛出 `KnobEvent`，且 `KnobEvent` 和 `KnobListener` 的两种类型相对于组件的第一个版本来说完全没有变化。\n\
    \n我将从从模型开始，模型由以下接口定义：\n\n```java\npackage knob.beans;\n\nimport java.beans.*;\n\
    \npublic interface KnobModel {\n    public int getMinimum();\n    public int getMaximum();\n\
    \    public int getValue();\n    public int getState();\n    public double getLower();\n\
    \    public double getUpper();\n    public void setMinimum(int minimum);\n   \
    \ public void setMaximum(int maximum);\n    public void setValue(int value);\n\
    \    public void setLower(double lower);\n    public void setUpper(double upper);\n\
    \    public void addPropertyChangeListener(PropertyChangeListener listener);\n\
    \    public void removePropertyChangeListener(PropertyChangeListener listener);\n\
    \    public void addKnobListener(KnobListener listener);\n    public void removeKnobListener(KnobListener\
    \ listener);\n}\n```\n\n该接口定义了组件的属性，以及这些属性对应的 getter 和 setter 方法范围。此外，接口定义了哪些监听器可以注册为组件通知的接收者。这里是\
    \ `PropertyChangeListener` 和 `Listener` 对象。模型由 `DefaultKnobModel` 类实现。我不想显示整个类，但开头如下：\n\
    \n```java\npublic class DefaultKnobModel implements KnobModel {\n    public static\
    \ final double epsilon = 0.0000000001;\n    private EventListenerList listenerList\
    \ = new EventListenerList();\n    public static final int HOT = 3;\n    public\
    \ static final int NORMAL = 2;\n    public static final int COLD = 1;\n    private\
    \ int min;\n    private int max;\n    private double upper;\n    private double\
    \ lower;\n    private int value;\n    private int state;\n```\n\n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_116_0.png)\n\
    \n在这里你可以看到变量已经从 `Knob` 类中移动出来，但仅代表组件状态的变量，而不是用于绘制组件的变量。注意模型有自己的监听器集合，并注意其类型为 `EventListener`。该类具有适当的构造函数——这与原始类相同。代码的其余部分是实现接口定义的方法，在这里你特别需要注意\
    \ set 方法，因为它们将触发所需的事件。\n\n然后是 UI 代理，根据自定义组件的开发模式，它从以下类开始：\n\n```java\npackage\
    \ knobprogram;\n\nimport javax.swing.plaf.*;\n\npublic class KnobUI extends ComponentUI\
    \ {\n    public static final String UI_CLASS_ID = \"KnobID\";\n}\n```\n\n该类继承自\
    \ `ComponentUI` 且不包含很多内容，它只是定义了一个常量，以便该类在外观感觉方面有一个唯一的名称。有了这个类，你就可以编写 UI 代理了，即负责绘制组件并处理鼠标和键盘事件的类。下面我提供了该类的开头，但我没有显示任何关于绘制组件的内容，也没有定义鼠标事件处理器的内部类，因为这些代码与之前的版本相同。\n\
    \n```java\npublic class BasicKnobUI extends KnobUI {\n    private MouseHandler\
    \ handler = null;\n    private MouseMotionHandler motionHandler = null;\n    private\
    \ KnobModel model = null;\n    private boolean marked = false;\n    private Ellipse2D\
    \ knob = null;\n    private double height;\n    private double width;\n    private\
    \ double t;\n    private double m;\n    private double w;\n    public BasicKnobUI(JComponent\
    \ component) {\n        model = ((Knob) component).getModel();\n    }\n```\n\n\
    ```java\npublic static ComponentUI createUI(JComponent c)\n{\n    return new BasicKnobUI(c);\n\
    }\n```\n\n```java\npublic void installUI(JComponent component)\n{\n    Knob knob\
    \ = (Knob)component;\n    knob.addMouseListener(handler = new MouseHandler());\n\
    \    knob.addMouseMotionListener(motionHandler = new MouseMotionHandler());\n\
    }\n```\n\n```java\npublic void uninstallUI(JComponent component)\n{\n    Knob\
    \ knob = (Knob)component;\n    if (handler != null) knob.removeMouseListener(handler);\n\
    \    if (motionHandler != null) knob.removeMouseMotionListener(motionHandler);\n\
    }\n```\n\n你应该注意到用于绘制用户界面的变量已经移动到了这个类中。否则，你应该注意到已实现的方法，无需尝试解释具体在做什么，这些方法意味着组件支持外观和感觉，并且是开发自定义组件的一部分。后文是组件本身，即\
    \ *Knob* 类，它现在变成了一个非常薄的类：\n\n```java\npackage knobprogram;\n\nimport javax.swing.*;\n\
    import java.beans.*;\n\npublic class Knob extends JComponent implements PropertyChangeListener\n\
    {\n    private KnobModel model;\n\n    public Knob()\n    {\n        init(new\
    \ DefaultKnobModel());\n    }\n\n    public Knob(KnobModel model)\n    {\n   \
    \     init(model);\n    }\n}\n```\n\n"
