    if it can take you.


    Send us your CV on www.employerforlife.com


    # JAVA 9: SWING, DOCUMENTS AND PRINTING


    With regard to payment cards, it is pseudo, but the card number must be 16 digits,
    where a space may have been inserted between 4 digits. The check code must be
    3 characters, but in the same way as the card number, nothing is used. Finally,
    there is the expiration date that the program checks against the current date
    when playing on the machine. The email address must have a legitimate format for
    an email address and must be unique as it is used as user identification. The
    password must be at least 10 characters.


    If you create a user with legitimate data, the dialog closes and the dialog for
    the login window also closes and you are ready to play. The two dialogs for logon
    and creation of a user both have a controller attached, but are otherwise simple.
    As for the dialog to create a player, it is the dialog box that opens from the
    main toolbar if the player wishes to maintain the account.


    To implement the game itself (and thus the Main class, which is one of the two
    complex windows in the program), a class WheelComponent has been written, which
    is a view representing a wheel, and MainView uses three instances or four of this
    component. It is this component that starts a thread that will simulate the wheels
    rotating. The game function resembles the prototype, and only minor changes have
    been made that concern rotation of the wheels. The game feature must also ensure
    that the logic of the hold buttons are properly implemented, to test whether there
    is a win and that the player''s balance is updated. In addition, the game feature
    must ensure that you cannot play if the player''s account is empty. These features
    are implemented in the class Main, and the database is updated for each game as
    is a requirement that all games are written to a log (the table run). Compared
    to the database design, this table is expanded with two columns: The amount of
    the result of the game, and the id of the configuration played. This is to simplify
    some of the other features.


    Then there are the features in the toolbar. The first is logout, and if you click
    on it, you will get the login window again. The next function is to deposit amounts
    into the account and clicking on the button will give you simple dialog box where
    you enter the amount and password. The last is to ensure that others do not unduly
    deposit money into the account and thus raise on the registered payment card.
    The third feature of the toolbar is used by the player to maintain user data and,
    as mentioned, opens a dialog box simple to the above to create a user. A player
    cannot change his email address as it is perceived as a key. The fields for password
    are empty, and you should not enter the old password. These fields must only be
    filled in if you want to change the password. The four features open a simple
    dialog box that shows an overview of which:


