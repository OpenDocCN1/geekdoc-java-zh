  mdcn: "\n\n# JAVA 9: SWING、文档与打印\n\n这里定义了三个实例变量，其中第一个是待插入的图标，最后一个方法是我多次使用的那个方法，它用于从我的\
    \ jar 文件中加载并缩放图像。变量 `counter` 用于可能插入的按钮的文本，以便它们能够相互区分。最后，有一个对 `JTextPane` 组件的引用，以便在三个按钮的事件处理器中引用它。该组件像其他组件一样被插入到窗口中，在三个事件处理器中会有一些需要注意的地方。你应该注意\
    \ `JTextPane` 上的以下方法：\n\n- replaceSelection()\n- insertIcon()\n- insertComponent()\n\
    \n它们分别用于插入文本、插入图标和插入组件。无论名称如何，它们的工作方式相同，都会替换标记为待插入内容的内容——如果选择了某些内容则进行替换，否则在光标位置插入。\n\
    \n然后是以属性（attributes）和样式（styles）形式存在的。你可以将属性附加到单个字符、段落以及整个文档。字符属性涉及字体和文本颜色。关于段落的属性可能还涉及缩进和行间距。样式（Style）是属性的组，可以用于文档中的多个地方，并且可以是一个通过名称的命名样式。如果你通过样式（附加到文档）更改属性，那么文档中所有使用该样式的文本属性都会发生变化。如果将样式分配给一个段落，可以通过向该段落文本的局部附加属性来覆盖其属性。属性是一个键/值对，而属性族由三个接口定义：`AttributeSet`、`MutableAttributeSet`\
    \ 和 `Style`。\n\n现在我将展示一个使用样式的 `JTextPane` 程序。该程序会打开一个带有 `JTextPane` 和菜单的窗口：\n\n\
    | 带有样式的文本 | |\n| --- | --- |\n| | |\n\nJAVA 9: SWING、文档与打印\n\n## 编辑文本\n\n菜单有三个菜单项：\n\
    \n- 设置样式 (Set style)\n- 修改样式 (Modify style)\n- 创建样式 (Create style)\n\n其中前两个是空子菜单，最后一个是一个用于为段落创建样式的函数。如果你选择此菜单项，将得到如下所示的窗口，你可以在这里创建一个定义字体的命名样式。在这里你应该特别注意，你可以指定区域外部应该留出多少空白。\n\
    \n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_188_0.png)\n\n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_189_0.png)\n\
    \n一旦你创建了样式，每个子菜单中都会添加一个菜单项，然后你就可以对光标所在的段落应用样式，并可以打开与所示相同的对话框来编辑该样式。以下是程序的运行情况，输入了\
    \ 7 行文本：\n\n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_189_1.png)\n\n注意每一行都是一个段落。随后创建了\
    \ 4 个样式，并应用到这 7 行上。结果如下：\n\n# JAVA 9: SWING、文档与打印\n\n# 编辑文本\n\n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_190_0.png)\n\
