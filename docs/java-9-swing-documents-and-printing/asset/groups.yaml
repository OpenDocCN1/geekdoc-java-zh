    \nJAVA 9: SWING, DOCUMENTS AND PRINTING\n\n## EDIT TEXT\n\n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_196_0.png)\n\
    \nYou need to examine the help for JTextPane to find out how to determine the\
    \ area selected and in the first program in this chapter, you can see how to assign\
    \ attributes to individual characters instead of a paragraph.\n\n## 8.4 DOCUMENT\n\
    \nAs mentioned, all text components use a model, as defined above by the Document\
    \ Interface. The model represents the text that the user edits, and if it is a\
    \ styled document, it is also the model that represents the attributes. The Document\
    \ interface does not define anything about styles, but instead, it takes place\
