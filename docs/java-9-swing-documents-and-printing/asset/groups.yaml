- md: "\n# JAVA 9: SWING, DOCUMENTS AND PRINTING\n\nThe method starts by determining\
    \ the rectangle that is selected, which is done using a getSelected() method.\
    \ Next, the getPixels() method is used to form your array with all image pixels\
    \ within this rectangle, and then creates the object to be saved on the clipboard.\
    \ The object has the type ImageData, and it is now saved on the clipboard by embedding\
    \ it in an ImageTransferable object. When the method returns the rectangle, it\
    \ is because it is also used in the cut(rect) method:\n\n```\nprivate void cut()\
    \ {\n  Rectangle rect = copy();\n  int[] pix = getPixels(rect);\n  for (int i\
    \ = 0; i < pix.length; ++i) pix[i] = 0;\n  setPixels(pix, rect);\n}\n```\n\n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_149_0.png)\n\
