    # JAVA 9: SWING, DOCUMENTS AND PRINTING


    In terms of payment, the program simulates money is raised on the player''s account,
    and if you put money on the account, the program must simulate the deposit of
    the player''s account. All transactions must be recorded so that a player can
    always see how much has been inserted and raised.


    Of course, the most important feature is to play, which is performed by clicking
    on a button or equivalent. It must be possible to hold the individual wheels similar
    to the following:


    +   1. You may not hold all wheels

    2. You should not be able to hold a wheel if it was held in the previous game

    3. You can not hold a wheel if there was a win in the previous game


    When playing the machine, the result of a game must be registered, where the following
    information should be registered:


    +   1. the user who has played

    2. the time for the play

    3. the configuration for play

    4. the result as the wheels combination

    5. the win (0, if there is no gain)


    # Admin mode


    If you log in as administrator, besides playing the machine, you can configure
    it and manage user accounts.


    Regarding the configuration of the machine, you must be able to maintain specific
    configurations where a configuration indicates:


    +   1. A name so the configuration can be chosen by the players

    2. Number of wheels (3 or 4)

    3. Which figures are to be used on the wheels (typically in the neighborhood of
    10)

    4. The position of the figures (order) on the wheels - the same figure may appear
    several times

    5. Which combinations would give a win and the amounts of the winnings

    6. What the cost is to play on the machine

    7. If configuration is active and can be selected by players


    Regarding the administration of player accounts, you should be able to:


    +   1. Change player''s password (for example, if forgotten)

    2. Delete a player where the player''s balance is transferred to the player''s
    account'
