    \ classes. `PlainDocument` is the model for a `JTextField` and a `JTextArea` component,\
    \ while `DefaultStyledDocument` is the model of a `JTextPane` and a `JEditorPane`.\n\
    \n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_196_1.png)\n\nA Document object divides\
    \ the document into a hierarchy of objects where each node has the type Element\
    \ and consists of an offset and an end position in the document. In addition,\
    \ an Element may have associated an AttributeSet and thus a style is not used\
    \ by, for example, by a JTextField and a JTextArea. An Element object thus describes\
    \ a part of the document and seen from a JPane it is interesting that an Element\
    \ has its own style.\n\nAn important task for AbstractDocument is to implement\
    \ a locking mechanism that ensures that at one point only a single writer can\
    \ use the document, but no or more can read the document.\n\nAs a simple example\
    \ of how to attach your own document to a text component, the following window:\n\
    \n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_197_0.png)\n\nwhere the user can enter\
    \ 20 characters.\n\n```java\nclass MaxDocument extends PlainDocument\n{\n    private\
    \ int max;\n\n    public MaxDocument(int max)\n    {\n        this.max = max;\n\
    \    }\n\n    public void insertString(int offset, String str, AttributeSet attr)\n\
    \    throws BadLocationException\n    {\n        if (getLength() + str.length()\
    \ > max) Toolkit.getDefaultToolkit().beep();\n        else super.insertString(offset,\
