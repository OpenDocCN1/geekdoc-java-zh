    That is, the constants are defined in several places, and the meaning by SwingConstants
    is instead of using the constants defined in the individual components classes,
    then you should use the constants in SwingConstants.


    Finally, there is the class SwingWorker, which is an abstract class that is to
    perform time-consuming GUI operations in one or more background threads. The goal
    is that timeconsuming tasks should not be performed in the event dispatcher thread,
    as a program then will be in a state where it is not responding. The goal of the
    class is to make it easier to perform time-consuming tasks in their own threads
    rather than yourself has to write the necessary code for threads.


