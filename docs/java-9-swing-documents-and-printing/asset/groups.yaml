    # JAVA 9: SWING, DOCUMENTS AND PRINTING


    # EDIT TEXT


    Basically, you can think of a JTextPane as a JTextArea and a component where you
    can enter and edit text lines, with the big difference that the component supports
    styling of the text. This means that individual text elements have assigned style
    objects in the form of, for example, font and color. The component can actually
    do more than that, it can display images and even other Swing components. Like
    the other Swing components, a JTextPane is designed by MVC, and the model is defined
    (similar to the other text components) of the Document interface, and a JTextPane
    uses the concrete class StyledDocument as model. It is thus the model that keeps
    track of the individual style elements. The model is dealt with the first in the
    next section, and this section will primarily show how to use a JTextPane in a
    program.


