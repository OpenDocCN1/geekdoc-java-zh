    # FOREWORD


    This book is the ninth in a series of books on software development. The programming
    language is Java, and the language and its syntax fills obviously much, but the
    books have also focused on the process and how to develop good and robust applications.
    This book deals with Swing and how to use Swing to develop applications with a
    graphical user interface. I have also looked at the development of programs with
    a graphical user interface in the book Java 2, and this book is a continuation
    of Java 2, with greater emphasis on details and how Swing works internally. Several
    of the chapters of the book include topics that are not used so often in practical
    programming, but on the other hand, topics that it is necessary to know in part
    to solve specific problems, and partly to develop user and maintain complex user
    interfaces written using Swing. The book requires knowledge of programming and
    Swing throughout to the contents of the book Java 2. The book ends with the development
    of an application, with primary focus on the graphical user interface.


    As the title says this series of books with software development, and the goal
    is to teach the reader how to develop applications in Java. It can be learned
    by reading about the subject and by studying sample programs, but most importantly
    by yourself to do it and write your own programs from scratch. Therefore, an important
    part of the books is exercises and problems, where the reader has to write programs
    that correspond to the substance being treated in the books. All books in the
    series are built around the same skeleton and will consist of test examples and
    exercises and problems that are placed naturally. The difference between exercises
    and problems is that the exercises deals with the substance presented in the text,
    and furthermore it is relatively accurately described what to do. Problems are
    in turn more loosely described, and a little bigger and there is really any clear
    best solution. These are books to be read from start to finish, but the many code
    examples, including exercises and problems play a central role, and it is important
    that the reader predict in detail studying the code to many examples and also
    solves the exercises and problems or possibly just studying the recommended solutions.


    All books ends with one or two larger sample programs, which focus primarily on
    an explanation of how the program is written. On the other hand appears the code
    only to a limited extent — if all and the reader should instead study the finished
    code perhaps while testing the program. In addition to show the development of
    programs that are larger than the examples, which is otherwise presented.


