    \ but problem 1 below is about improving the program at that point.\n\n# 2.5 FOCUS\
    \ AND THE KEYBOARD\n\nSwing components are placed in a container and one of the\
    \ components has focus, so that events related to the keyboard are sent to this\
    \ component. The general focus cycle is from left to right and from top to bottom,\
    \ and you switch focus with TAB and CTRL-TAB, and if you want to change focus\
    \ in the opposite direction, use SHIFT-TAB and CTRL-SHIFT-TAB. Focus is controlled\
