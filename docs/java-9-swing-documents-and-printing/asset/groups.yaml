    \ DB。该类被写为单例，并拥有所有维护数据库的方法。该类非常详尽，但不包含任何新内容。\n\n模型层包含了设计中的类。它们在实现方法时都经过修改，并添加了一些新类，但总的来说，扩展很少且结构简单。具体来说，有一个\
    \ Repository 类，它是到 dal 层的一个相当薄的适配器类。原则上，这个类是没有意义的，因为它除了将方法调用委托给 DB 类之外什么都不做，它的唯一目的是让视图层和控制层不感知\
