    \ 的对象可以注册为 `ChangeEvent` 的监听器。此类事件仅与单个值相关，即引发事件的组件。\n\n另一种属性是客户端属性（client properties），它们是存储在附加到每个\
    \ Swing 组件的 `Hashtable` 中的键值对。这意味着通过 `putClientProperty()` 方法你可以添加或删除客户端属性。例如，你可以按照以下方式添加属性：\n\
