    # JAVA 9: SWING, DOCUMENTS AND PRINTING


    # A SLOT MACHINE


    A typical design activity is database design, and changes will almost always occur
    during the programming phase. This does not mean that the database design is not
    important during the design phase, as programming typically involves minor adjustments,
    but they will, almost certainly, also be there. This is also the case with the
    current program, where some columns have been added to some of the tables, as
    well as changes to the foreign keys. It is worth paying attention to the design
    of the database during the design phase to avoid this kind of changes during programming,
    but vice versa, with just a small size database, it is difficult to avoid any
    adjustments during programming. When such changes are problematic, it is because
    they means that the database data content needs to be recreated, which may be
    time consuming. In this case, some changes have meant that it has also been necessary
    to change the initialization program CreateDefault and it has been necessary to
    run the program again.


    Another design activity is the design of the model layer and including the most
    important model classes. It is rarely associated with the major challenges, but
    you must be prepared to make changes to these model classes and to create new
    ones. It is not a problem and just states that during the design you are not at
    the same level of details as during programming, and that is not the idea, as
    the design should focus on the overall concepts alone.


