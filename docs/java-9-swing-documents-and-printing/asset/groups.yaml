    # JAVA 9: SWING, DOCUMENTS AND PRINTING


    The MaskFormatter class has many options for formatting text, and you are encouraged
    to read the help to get an idea of the possibilities. There are also other classes
    for formatting text, and you should pay special attention to the class NumberFormat.


    The window''s top line shows two additional fields, that both are JTextArea fields.
