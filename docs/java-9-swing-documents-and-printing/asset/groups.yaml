    lblCount.setFont(new Font(\"Liberation Serif\", Font.BOLD, 36));\nnew DropTarget(dropLabel,\
    \ DnDConstants.ACTION_COPY, new DnDTarget());\ndragSource = new DnDSource();\n\
    add(panel);\n}\n```\n\n```java\nprivate JLabel createLabel() {\nJLabel label =\
