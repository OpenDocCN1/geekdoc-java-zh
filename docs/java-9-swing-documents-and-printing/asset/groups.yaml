  - '[PAGE 174]


    JAVA 9: SWING, DOCUMENTS AND PRINTING


    EDIT TEXT


    Finally, each of the last two fields in the bottom line shows a JEditorPane. Here
    you can specify that the text is to be rendered with a MIME type, and exactly
    that means EditorKit to use. The first indicates text / plain and shows the text
    as plain text, while the last use text / html and thus interprets the html tags
    and renders the text as an HTML document.


    In principle, the 6 text components work in the same way that can be briefly described:
    The component is a UI delegate, among other things, defines font and color properties.
    It also defines the component''s caret and highlighter, as InputMap and ActionMap
    that relate to the keyboard and commands such as cut / copy / select-all, caret-to-end-of-line,
    page-down, and so on. It is also the UI delegate that instantiates an EditorKit.
    For a JTextArea, it is a DefaultEditor that defines most of the component''s Actions.
    A text works on a Document (such as a PlainDocument) either created by the component
    or transferred to the constructor. The document object represents the text by
    dividing it into one or more Elements. An Element object represents a portion
    of the document''s content as well as style information. For example, a JTextArea
    creates an Element for each line, but ignores about styles. A text document registers
    itself by listening to the events it needs to keep track of, and registers, other
    things, as a DocumentListener so it can update itself if the Document is changed.
    It is the UI delegate that is responsible for drawing the component using the
    component''s EditorKit and a ViewFactory. This class creates a hierarchy of one
    or more View objects based on the Element objects of the document, and this hierarchy
    is drawn on the screen.


    That hardly tells much, but it mentions several classes, and all these classes
    you can override and in what way to get a text component to work as you like.
    These are the classes that make Java''s text API incredibly flexible and the subject
    of the rest of this is to give some examples of what you can do.


    # 8.1 JFORMATTEDTEXTFIELD


    As shown in the introductory example, a JFormattedTextField is a JTextField, where
    a formatter is attached to the component and determines how to format the content
    of the field. In the introductory example, I used a MaskFormatter, which can be
    used to ensure that you can only enter characters, but there are many other options.
    The type of a formatter is AbstractFormatter, and the specific formatter determines
    the format and when it happens. Regarding the latter, it may happen during the
    entry, for example, for a MaskFormatter, but other formatter objects the formatting
    first place after the field loses focus. With an option for the component, you
    can specify what should be done if the input does not conform to the format, but
    the default setting is that the component formats the content as well as possible
    and ignores what does not conforms the format.


