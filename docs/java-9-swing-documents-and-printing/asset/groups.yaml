    Before I leave this section on layout managers, I will mention a VariableGridLayout,
    that is an older layout manager from Sun, who has been deprecated for many years.
    However, I have a lot of pleasure from this manager, so the following. A VariableGridLayout
    is simply a layout manager that inherits GridLayout, and it is thus a GridLayout,
    but with the extension that rows and columns do not necessarily have the same
    height/width. After creating a VariableGridLayout, you can specify how much of
    the total height is to be applied to a particular row, and in the same way you
    can specify how much of the total width to be used for a particular column.


