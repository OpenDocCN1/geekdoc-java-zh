    \nand from this, you can see that CENTER in a BorderLayout ignores the preferred\
    \ size of the panel.\n\nThe example thus shows that it is different how the preferred\
    \ size is used.\n\n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_23_2.png)\n\n## 2.3\
    \ EVENT HANDLING\n\nEvents appear generally when a key is pressed on the keyboard\
    \ or when something happens to the mouse (clicking on a button or moving the mouse).\
    \ Swing components can fire different kinds of events, which are types defined\
    \ in java.awt.event or javax.swing.event, and many of them are component specific.\
    \ Each event type defines at least the object that has fired the event in question\
    \ but will also contain other information about the state of the object. There\
    \ are also events that are not raised by a component.\n\nIn order for an object\
    \ to receive notifications regarding an event, the object must be registered as\
    \ listening to it. To make it, the class of the object must implement a listener\
    \ interface (for example ActionListener), and then the object can be registered\
    \ (for example, with addEventListener()).\n\nThe abstract class Component defines\
    \ a protected field of the type EventList, called listenerList, which all components\
    \ inherit. The type EventList is an array of pairs of the form XX / XX is an event\
    \ type. This array contains the listeners of the component and which events are\
    \ listened to, and the component can then send notifications to listeners when\
    \ an event occurs. When an array is used instead of a collection, it is to increase\
    \ performance since a collection such as ArrayList is a relatively complex class.\
    \ In fact, it means that a new array must be created (and copied) every time a\
    \ listener is added, but it is still cheaper using a collection, because it is\
    \ limited how many listeners are registered for a given component.\n\nAll events\
    \ are handled by event handlers by the registered listener objects, and as described\
    \ in the book Java 8, these handlers must be performed by the event dispatching\
    \ thread, which is the thread that carries out all location and drawing of the\
    \ individual components. The thread is linked to a FIFO queue of events processing,\
    \ and the individual events are processed in the order in which they are inserted\
    \ into the queue and the next one not be processed until the previous one is completed.\
    \ Otherwise, one could risk the state of a component being changed while it, for\
    \ example, redraws. For this reason, you must not perform an event handler outside\
    \ the event-dispatching thread by, for example, to call the method fireXX() directly\
    \ from another thread. It is also important that event handlers and code that\
    \ draws the components are effective, as you may else risk blocking the system\
    \ from events in the event queue waiting for treatment.\n\nTo ensure that all\
    \ codes associated with event handlers are performed in the event dispatching\
    \ thread, in Java I have shown how the SwingUtilities class has two methods invokeLater()\
    \ and invokeAndWait(), which adds a runnable object to the system event queue.\
    \ A classic pattern to ensure that a code is performed in the event dispatching\
    \ thread is to execute the code as follows:\n\n```java\npublic void doThreadSafeWork()\
    \ {\n    if (SwingUtilities.isEventDispatchThread()) {\n        // do all work\
    \ here...\n    }\n    else {\n        Runnable callDoThreadSafeWork = new Runnable()\
    \ {\n            public void run() {\n                doThreadSafeWork();\n  \
    \          }\n        };\n        SwingUtilities.invokeLater(callDoThreadSafeWork);\n\
    \    }\n}\n```\nHere it is first tested whether the code is performed by the event\
    \ dispatching thread. When SwingUtilities receives a Runnable by callingLater(),\
    \ it is immediately forwarded to the SystemEventQueue.\n\n## JAVA 9: SWING, DOCUMENTS\
    \ AND PRINTING\n\n## SWING DETAILS\n\n### 2.4 RENDERING OF COMPONENTS\n\nWhen\
    \ the machine displays a component on the screen, it means that the component\
    \ must be drawn and it is said that Swing is rendering the component. If the component\
    \ changes at a later time – for example if a button is clicked – it must be drawn\
    \ again. Generally a component is drawn by performing the method paint(), and\
    \ it is a custom component where it is the programmer in charge of drawing the\
    \ component, you must override this method and the override must always start\
    \ with super(). In fact, it's not simple as much can happen with a component,\
    \ and for example the component may be fully or partially covered by another component.\n\
    \nAs an example, I will show a custom component. It should be immediately said\
    \ that a custom component is written in a different way than the following example,\
    \ but I will return to it later. If you open the program Birds, it displays the\
    \ following window:\n\n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_26_0.png)\n\n\
    ![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_27_0.png)\n\nHere the picture is a component\
    \ all the other components in the window. It's a very simple component that has\
    \ a fixed size and shows an image with which has a frame been drawn and a text\
    \ drawn on top of the picture. The component has properties you can determine\
    \ the width of the frame and change the text. You can also change the font in\
    \ which it is drawn, and finally you can change the color of the frame and the\
    \ text. If you click on the image, the component raises an ActionListener that\
    \ registered listeners can capture. The code of that component is as follows:\n\
    \n```java\npackage birdprogram;\n\nimport java.awt.*;\nimport java.awt.event.*;\n\
    import java.awt.geom.Rectangle2D;\nimport javax.swing.*;\n\npublic class TheBirds\
    \ extends JFrame {\n    private static ImageIcon birds =\n        createImageIcon(\"\
    /birdprogram/birds.jpg\", 320, 180);\n    private float borderWidth = 5;\n   \
    \ private String text = \"Birds in Thy\";\n\n    public TheBirds() {\n{\n    \
    \    setBackground(Color.black);\n        setFont(new Font(\"Liberation Serif\"\
    , Font.BOLD, 36));\n        addMouseListener(new ClickHandler());\n    }\n}\n\
    ```\n"
