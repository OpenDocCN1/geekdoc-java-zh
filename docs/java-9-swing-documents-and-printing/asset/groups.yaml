    2. minimumSize

    3. maximumSize


    but to what these properties are used, as is explained in Java 2, completely determined
    by the current layout manager. In fact, it is allowed to write a layout manager,
    that completely ignores these properties. It is absolutely essential to mention
    that the exact size and location of a component in a window is determined by the
    current layout manager. You can also define the size and location of a component
    with setBounds(), but here you should be aware that a layout manager suppresses
    the values set with setBounds() (or setSize()) and setLocation(). If you want
    to place the components in this way, remove the layout manager by setting it to
    null.'
