    +   1. com.sun.java.swing.plaf.windows.WindowsLookAndFeel

    2. com.sun.java.swing.plaf.motif.MotifLookAndFeel

    3. javax.swing.plaf.metal.MetalLookAndFeel


    where the latter is default (and there is also a MacLookAndFeel, which has to
    be installed).

    However, a look-and-feel can only be used if it is on the right platform, and
    for

    example the first of the above can not be used on a Linux machine. A look-and-feel
