    \ events and will have associated listeners for which notifications can be sent.\
    \ In this case, a notification must be sent when the component’s properties (there\
    \ are five) are changed, but since the class inherits JComponent, it already has\
    \ the required logic for PropertyChangeEvent so PropertyChangeListener objects\
    \ can be registered as listeners. The class must take care only of raising events\
    \ for the five properties.\n\nAs mentioned above, the class must also fire an\
    \ event for the state (cold, normal and hot)![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_104_0.png)\
    \ where the parameters of the event is the current value, the state that changed\
    \ from to. You should also note that the class is derived from EventObject. It\
    \ is the base class for all events, and its constructor requires a single parameter\
    \ of type Object that represents the object (source) that fired the event. The\
    \ class is trivial and has a get method for the source, but it is part of the\
    \ Swing convention that all event objects must be directly or indirectly derived\
    \ from EventObject.\n\nSince the Knob class can fire events of type KnobEvent,\
    \ there must be other objects that can be registered as listeners, and therefore,\
    \ a simple listener interface is also defined:\n\nJAVA 9: SWING, DOCUMENTS AND\
    \ PRINTING\n\n```java\npackage knobprogram;\n\nimport java.util.*;\n\npublic interface\
    \ KnobListener extends EventListener\n{\n    void knobChanged(KnobEvent e);\n\
    }\n```\n\nHere you should also note that this interface extends EventListener,\
    \ which is nothing but a simple marker interface, and again it is a convention\
    \ in Swing that all listeners should implement this interface. The reason is that\
    \ a listener object can be added to a collection with listeners.\n\n```java\n\
    package knobprogram;\n\nimport java.util.*;\n\npublic class KnobEvent extends\
    \ EventObject\n{\n    private int value;\n    private int from;\n    private int\
    \ to;\n\n    public KnobEvent(Object source, int value, int to)\n    {\n     \
    \   super(source);\n        this.value = value;\n        this.from = from;\n \
    \       this.to = to;\n    }\n\n    public int getValue() {\n        return value;\n\
    \    }\n\n    public int getFrom() {\n        return from;\n    }\n\n    public\
    \ int getTo() {\n        return to;\n    }\n}\n```\n\nThen there is the component\
    \ itself, which consists of five properties:\n\n- min, which is the smallest value\
    \ of the component\n- max, which is the largest value of the component\n- value,\
