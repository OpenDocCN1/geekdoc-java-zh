    propertyName\");\n```\n\n客户端属性允许你在运行时添加属性，你可以将它们视为一种与组件关联额外数据的机会。客户端属性是绑定的，并且当值改变时会触发\
    \ `PropertyChangeEvent`。出于性能考虑，你应该偶尔向组件添加客户端属性。如果你需要多个客户端属性，应该考虑使用 `GridLayout(3,\
