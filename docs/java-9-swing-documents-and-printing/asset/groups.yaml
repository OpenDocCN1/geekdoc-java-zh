    ## JAVA 9: SWING, DOCUMENTS AND PRINTING


    Finally, the administrator should be able to print a statistic that can show how
    each configuration behaves. Here you can see, among other things whether a configuration
    gives positive returns or not the distribution of the single winnings over time.


    ## THE PROTOTYPE


    A prototype has been developed to illustrate the user interface and how it will
    work on the machine. If you click on the game button, the prototype selects random
    figures (there are 15 available), but the figures are changed for a period of
    time to simulate that the wheels rotates. The toolbar at the top of the window
    is features available to the player, where the icon on the right is intended as
    login. The prototype is called SlotMachine. (img/d1bfc3b279aa0e38d6b85f)


    ## 10.3 DESIGN


    Information about players and configurations must be saved somewhere. I will start
    with the design of this database, and design is outlined in the following ER diagram
    where there are the following entities:


    1. Config represents a concrete configuration of the machine

    2. Wheel represents a wheel for a configuration

    3. Figure represents a figure on a wheel

    4. Winning represents a gain with a given combination of figures

    5. Player represents a player

    6. Game represents a game on the machine

    7. Transaction is an amount that the player has inserted or raised on the account


    The attribute between Config and Wheel indicates the position of the wheel, and
    in the same way, the attribute between Wheel and Figure indicate the position
    of a figure on a wheel. (img/d1bfc3b279aa0e38d6b85dc85f9734c5_33.png)


    If you add attributes to the diagram, the conceptual database can be illustrated
    as follows: (img/d1bfc3b279aa0e38d6b85dc85f9734c5_34.png)


    ## Dictionary:


    | Table | Column | Type | Constraints |

    | :--- | :--- | :--- | :--- |

    | Player | id | INT | primary key |

    | | email | VARCHAR(100) | unique |

    | | password | VARCHAR(200) | encrypted |

    | | name | VARCHAR(50) | NOT NULL |

    | | phone | VARCHAR(20) | |

    | | card | VARCHAR(20) | NOT NULL |

    | | date | DATE | NOT NULL |

    | | code | INT | NOT NULL |

    | | balance | DECIMAL | |

    | Transaction | id | INT | primary key |

    | | amount | INT | NOT NULL |

    | | type | BOOLEAN | true = deposited, false = paid |

    | Config | id | INT | primary key |

    | | name | VARCHAR(50) | NOT NULL |

    | | amount | INT | NOT NULL |

    | | size | INT | must be 3 or 4 |

    | Figure | id | INT | primary key |

    | | name | VARCHAR(50) | NOT NULL |

    | | image | BINARY | NOT NULL |

    | Wheel | id | INT | primary key |

    | Winning | id | INT | primary key |

    | | amount | INT | winning, may be 0 |

    | Game | id | INT | primary key |

    | | time | DATETIME | date and time for the winning |


    The above ER model can be mapped to a relational model as shown below. In addition
    to names, there are only a few changes. Regarding transactions, the type has been
    removed and it has been decided that a positive transaction means that it has
    been inserted into the account while a negative transaction means that the account
    has been raised. (img/d1bfc3b279aa0e38d6b85dc85f9734c5_36.png)


    The Wheel entity has been changed so that it is a relation between Config and
    Figure, and the two positions are attributes in this relation, indicating the
    wheel number and the position of a figure, respectively. All relationships are
    simple and in third normal form, and with reference to the above data dictionary
    I can immediately write a script and create the database. The script is not shown
    here. (img/d1bfc3b279aa0e38d6b85dc85f9734c5_37.png)


    As part of the design, a NetBeans project has been created as a copy of the project
    from the analysis that defines a design of the model layer. There is also a program
    (the project CreateDefault) that creates a default configuration. The goal of
    this program is to have a configuration in place before the programming starts.
    With regard to figures (images) for the wheels it has been decided that the machine
    must use square images in a small resolution so they do not fill too much.


    Following these steps, two additional changes have been added to the database:


    1. The table figure is expanded with a column series. The column contains a short
    text, and is used for categorizing the figures. The above program has uploaded
    16 figures to the database, which is located in the category Default.

    2. The database is expanded with a simple table admin with two columns. The table
    must contain the password and email address of the administrator.


    ## 10.4 PROGRAMMING


    If you have done a careful analysis possibly combined with one or more prototypes,
    you should have all the requirements in place at the start of the programming
    phase. It is at least the theory and, with practice, it will work for smaller
