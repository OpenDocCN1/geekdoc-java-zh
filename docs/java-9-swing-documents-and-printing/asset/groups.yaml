    Download free eBooks at bookboom.com\n\nClick on the ad to read more\n\ncut()\
    \ must start with a copy() and then the area saved must be blanked by setting\
    \ all pixels to 0. The actual image is updated using the setPixels() method. Back\
    \ there is the paste() method:\n\n```\nprivate void paste()\n{\n    Clipboard\
    \ cb = getToolkit().SystemClipboard();\ntry {\n    Transferable tf = cb.getContent(null);\n\
    \    if (tf.isDataFlavorSupported(ImageTransferable.IMAGE_FLAVOR))\n    {\n  \
