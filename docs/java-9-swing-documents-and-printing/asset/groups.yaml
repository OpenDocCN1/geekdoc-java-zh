    \    private JTextField txtTop = new JTextField();\n    private JTextField txtBottom\
    \ = new JTextField();\n    private JCheckBox cmdBold = new JCheckBox(\"Bold\"\
    );\n    private JCheckBox cmdItalic = new JCheckBox(\"Italic\");\n\n    public\
