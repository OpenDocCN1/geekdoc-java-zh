  mdcn: "\n\n# JAVA 9: SWING、文档与打印\n\n该方法首先通过 `getSelected()` 方法确定被选中的矩形。接下来，使用 `getPixels()`\
    \ 方法构建一个包含该矩形内所有图像像素的数组，然后创建要保存到剪贴板的对象。该对象的类型为 `ImageData`，现在通过将其嵌入 `ImageTransferable`\
    \ 对象中将其保存到剪贴板上。当该方法返回矩形时，是因为它也被用于 `cut(rect)` 方法中：\n\n```\nprivate void cut()\
    \ {\n  Rectangle rect = copy();\n  int[] pix = getPixels(rect);\n  for (int i\
    \ = 0; i < pix.length; ++i) pix[i] = 0;\n  setPixels(pix, rect);\n}\n```\n\n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_149_0.png)\n\
    \n关于 e-Learning for Kids。e-Learning for Kids 成立于 2004 年，是一个全球非营利基金会，致力于为 5-12\
    \ 岁的儿童提供互联网上的趣味免费学习，课程涵盖数学、科学、语言艺术、计算机、健康和环境。自 2005 年以来，全球 190 多个国家的 1500 万儿童受益于\
    \ LU KI 提供的在线学习。一个全志愿者团队，由来自全球的教育和在线学习专家以及业务专业人士组成，他们致力于改变世界。我们的愿景通过种子资金、志愿者、赞助者和慷慨开发者的参与来实现。欲了解更多信息，请访问\
    \ www.e-learningforkids.org。\n\n在 bookboom.com 下载免费电子书\n\n点击广告阅读更多\n\n`cut()`\
    \ 必须以 `copy()` 开始，然后通过将所有像素设置为 0 来清空已保存的区域。实际的图像使用 `setPixels()` 方法进行更新。下面是 `paste()`\
    \ 方法：\n\n```java\nprivate void paste()\n{\n    Clipboard cb = getToolkit().SystemClipboard();\n\
    try {\n    Transferable tf = cb.getContent(null);\n    if (tf.isDataFlavorSupported(ImageTransferable.IMAGE_FLAVOR))\n\
    \    {\n      ImageData data =\n      (ImageData)(tf.getTransferData(ImageTransferable.IMAGE_FLAVOR));\n\
    \      Rectangle area =\n      new Rectangle(point.x, point.y, data.getWidth(),\
    \ data.getHeight());\n      int[] pixels = data.getPixels();\n      setPixels(pixels,\
    \ area);\n    }\n    end = start;\n    repaint();\n} catch (Exception ex) {\n\
    \    JOptionPane.showMessageDialog(this, ex.toString());\n}\n```\n\n该方法首先将剪贴板的内容作为\
    \ `Transferable` 对象引用。如果该对象支持正确的 `DataFlavor`，则以 `ImageData` 对象的形式检索数据，并基于此创建一个用于更新像素的矩形。实际的更新通过\
    \ `setPixels()` 方法完成。当图像最终重绘时，必须移除选中的矩形。\n\n# 拖放\n\n拖放是指使用鼠标将数据从一个位置移动到另一个位置的操作。事实上，大多数\
    \ Swing 组件都带有内置的拖放功能，在程序中实现这一功能相对简单。其原理类似于剪贴板，要移动的数据必须封装在 `Transferable` 对象中，此外，还必须实现三个接口：其中一个定义了执行移动操作的组件，另一个组件是你能够拖放对象的区域，用于指示操作的视觉表示。这听起来很多，但这是因为你对如何执行操作具有很高的自由度，而在实践中需要的其实非常有限。\n\
    \n拖放操作包括三个功能\n\n- 1. 复制（按住左键并移动鼠标）\n- 2. 移动（按住左键并移动鼠标 + CTRL）\n- 3. 链接（按住左键并移动鼠标\
    \ + CTRL + SHIFT）\n\n其中最后一种意味着没有复制对象，而仅定义原始对象的引用。这些操作在 `DnDConstants` 中定义为常量：\n\
    \n- 1. DnDConstants.ACTION_MOVE\n- 2. DnDConstants.ACTION_COPY\n- 3. DnDConstants.ACTION_REFERENCE\n\
    - 4. DnDConstants.ACTION_LINK\n- 5. DnDConstants.ACTION_COPY_OR_MOVE\n\n拖放的原理是，通过鼠标，可以将一个组件拖到另一个组件上方并释放第一个组件。当\
    \ Swing 组件支持拖放时，意味着所有关于鼠标的必要逻辑都是内置的，但在释放时会发生什么，Swing 显然不知道，这就是为什么需要进行编程的原因。我想从一个打开以下窗口的应用程序开始：\n\
    \n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_152_0.png)\n\n该窗口包含三个标签，含义是通过使用拖放操作可以更改顶部标签的背景颜色。下面是一个示例，背景颜色已更改了三次（数字\
    \ 3 显示在 `JLabel` 中，其意义仅在于展示这些接口作为拖放 API 部分的用途）：\n\n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_152_1.png)\n\
