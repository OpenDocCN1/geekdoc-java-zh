    import javax.swing.*;\n\npublic class Knob extends JComponent\n{\n    public static\
    \ final int HOT = 3;\n    public static final int NORMAL = 2;\n    public static\
    \ final int COLD = 1;\n    private int min;\n    private int max;\n    private\
    \ double upper;\n    private double lower;\n    private int value;\n    private\
    \ int state;\n}\n```\n"
