    # 前言


    本书是软件开发系列书籍中的第九本。编程语言是 Java，该语言及其语法显然占据了很大篇，但这些书籍也关注开发过程以及如何开发良好且健壮的应用程序。本书涉及
    Swing 以及如何使用 Swing 开发具有图形用户界面的应用程序。我在《Java 2》一书中也探讨了具有图形用户界面程序的开发，本书是《Java 2》的延续，更加强调细节以及
    Swing 的内部工作原理。书中的几个章节包含了在实际编程中并不经常使用的主题，但另一方面，这些主题在解决特定问题时是必要的，并在某种程度上有助于开发和维护使用
    Swing 编写的复杂用户界面。本书的内容要求读者具备编程和 Swing 的知识，并涵盖了《Java 2》中的内容。本书以一个应用程序的开发结束，主要侧重于图形用户界面。


    正如标题所示，这一系列书籍围绕软件开发展开，目标是教导读者如何用 Java 开发应用程序。可以通过阅读相关主题和学习示例程序来掌握，但最重要的是亲自动实践并从零开始编写自己的程序。因此，书中的重要部分是练习和问题，读者必须编写与书中处理的内容相应的程序。该系列的所有书籍都围绕同一个框架构建，并自然地安排测试示例、练习和问题。练习（exercises）与问题（problems）的区别在于，练习处理文中介绍的内容，并且对要做什么描述得相对准确。而问题的描述则较为松散，规模更大，且实际上没有明确的最佳解决方案。这些书是要从头到尾阅读的，但大量的代码示例（包括练习和问题）起着核心作用，读者详细地研究许多示例的代码，并解决练习和问题，或者只是研究推荐的解决方案。


