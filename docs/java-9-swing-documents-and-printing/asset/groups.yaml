    a modern browser and when the result of clicking the link in the window is not
    as desired, it is because the HTMLEditorKit class is not sufficiently comprehensive,
    but you can write your own - if you have the need.


    An EditorKit is an abstract class, for DefaultEditorKit is a concrete class, as
    used by the simple text components, and a derived class StyledEditorKit, by used
    of a JTextPane, and the HTMLEditorKit class is derived from StyledEditorKit. An
    EditorKit defines how to create the document, and also defines methods that can
    read the document from a stream and write it to a.


    # ACTIONS


    There are many events associated with text components and especially keyboard
    and mouse events, and you can also make settings regarding fonts and colors, and
    more. All these options are represented as actions. An Action is an interface
    that inherits its other interfaces: ActionListener and ActionListener, and one
    should think of an Action as an object representing an ActionEvent. The goal is
    to make that functionality should be available to several components. An Action
    may have associated secret key / value pairs that you have access to with the
    methods:


    ```

    Object getValue(String key)

    void put(String key, Object value)

    ```


    Particular attention should be paid to the last method as it changes the value
    if the key already exists.


    The interface is implemented by the class AbstractAction, but the class obviously
    does not implement actionPerformed(), and if you write your action types, it is
    equivalent to writing a class that inherits AbstractAction and then implementing
    actionPerformed(). The advantage of actions is that classes like JButton,,, etc,
    have constructors that have an Action as parameter, and it makes it easy to assign
    functionality to those kinds of objects, and finally is the reason that Actions
    are mentioned here, while the components uses a lot of Actions.'
