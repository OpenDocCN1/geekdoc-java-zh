    # 9.1 RESOURCE BUNDLES


    If a program is to be internationalized, it means that the text should be available
    in several languages, and although Java supports internationalization, it is of
    course the task of the development department to translate the text. The translated
    text must be saved somewhere, and it happens in resource bundles, which allow
    to save text, images and other resources outside of the program and not as part
    of the code. Resource bundles are represented by the class ResourceBundle, which
    encapsulates key/value pairs, where the key is a string, while value can be any
    arbitrary object.


    ResourceBundle is an abstract class, although you can define your own specific
    class, which you usually use


    +   - PropertyResourceBundle to text

    - ListResourceBundle to images and other resources


    I will as an example how to use a resource bundle of the first kind, as it is
    the commonly used in internationalization, primarily to achieve a program that
    is independent of the language.


    The starting point is a properties file, which is simply a text file where the
    filename has the extension .properties. An example might be the following:


    ```

    di=Ruder

    he=Hjerte

    sp=Spar

    cl=K1\u00f8r

    ```


    which contains four texts with keys. The content can be interpreted as the colors
    for playing cards. Note that the ‘o’ in the last value is encoded with the code
    for the unicode of the character. The file name is


    Cards.properties


    that is important. There is also a different version of the file with English
    names written as:


    ```

    di=Diamond

    he=Heart

    sp=Spade

    cl=Club

    ```'
