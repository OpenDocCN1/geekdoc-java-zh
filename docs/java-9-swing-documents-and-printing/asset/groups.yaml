  mdcn: "\n\n## 8.5 JEditorPane\n\n作为 Swing 文本组件的最后一个，应该提到 JEditorPane。它是一个很少有人对其感兴趣的组件，但它可以被视为样式化文本组件的基类，而\
    \ JTextPane 则是派生自 JEditorPane 的文本组件的一个示例。如上所示，JTextPane 是一个可以用于编辑带有样式信息的文档的组件。实际文本由\
    \ `StyledDocument` 表示，但控制文本和样式如何被编辑（可以执行哪些操作）的逻辑全部封装在 `EditorKit` 中。如 `JTextField`\
    \ 和 `JTextArea` 等简单文本组件使用 `DefaultEditorKit`，而 `JTextPane` 使用派生类 `StyledEditorKit`。JEditorPane\
    \ 的目标是让你能够通过定义自己的 `EditorKit` 和 `Document` 类型，定义一个派生自 JEditorPane 的自有文本组件，从而定义恰好支持你所需任务的文本组件。事实上，Swing\
    \ 自带了两个可以编辑 html 和 rtf 文档的示例。\n\n在本节中，我将说明如何编写你自己的 html 编辑器。目标不是实现一个完善的 html 编辑器（那是很复杂的），而是为了更多地展示文本组件以及\
    \ `EditorKit` 是什么。我想从一个名为 `AEditorPane` 的示例开始。如果你运行该程序，你将得到下面的消息框：\n\n```\nMessage\n\
