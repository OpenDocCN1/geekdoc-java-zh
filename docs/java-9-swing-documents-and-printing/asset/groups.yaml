    # JAVA 9: SWING, DOCUMENTS AND PRINTING


    # SWING DETAILS


    When a component has focus and a key is pressed on the keyboard, the component
    (depending on the component in question) can send a KeyEvent. These events can
    be captured by associating a KeyListener. Unlike other events, a KeyEvent is sent,
    possibly before the corresponding operation is performed. When a key is pressed,
    three KeyEvents are fired:


    +   1. KEY_PRESSED that occurs when a key is pressed. The key is specified with
    a keyCode property, and getKeyCode() can get a virtual code representing the key,
    such as KeyEvent.VK_ENTER. You should be aware that combination keys such as CTRL-C
    fires two KEY_PRESSED events, and the virtual codes are KeyEvent.VK_CTRL and KeyEvent.VK.C.
    A KeyEvent also has a property keyChar, which contains the unicode code.

    2. KEY_RELEASED are identical to KEY_PRESSED events and firing when the key is
    released, they are not fired as often as KEY_PRESSED events.

    3. KEY_TYPED are events that are firing between KEY_PRESSED and KEY_RELEASED,
    but no keyCode is attached. These events are not fired for keys that do not have
    a unicode representation such as PAGE UP and PRINT SCREEN.


    ![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_44_0.png)'
  - '[PAGE 45]


    Holding a key down (for keys with a unicode representation) briefly generates
    sequences of KEY_PRESSED and KEY_TYPED events.


    Each KeyEvent has associated so-called modifiers, which indicate the state of
    SHIFT, CTRL, ALT and META at the time of pressing a key. It is an int, which is
    a bitwise OR of the following constants


    +   - InputEvent.SHIFT_MASK

    - InputEvent.CTRL_MASK

    - InputEvent.ALT_MASK

    - InputEvent.ALT_GRAPH_MASK

    - InputEvent.META_MASK

    - InputEvent.BUTTON1_MASK

    - InputEvent.BUTTON2_MASK

    - InputEvent.BUTTON3_MASK


    The value can be changed by getModifiers() and you can test for the single keys
    by isShiftDown(), isControlDown(), isAltDown() and isMetaDown().


    It is thus possible to control components using the keyboard by registering KeyListener
    objects. Since it can be very extensive (to be written), Swing has defined an
    alternative way of using KeyStroke objects, you also call keyboard accelerators.
    A KeyStroke encapsulates a key release (true), a modifier value, and a boolean
    value, which indicates whether it is a key press (false) or a key release (true).
    The KeyStroke class has 5 static methods that create KeyStroke objects:


    +   - getStroke(char keyChar)

    - getStroke(int keyCode, int modifiers)

    - getStroke(int keyCode, int modifiers, boolean onRelease)

    - getStroke(String representation)

    - getStroke(KeyEvent anEvent)


    To register a listener for the keyboard for a JComponent is used:


    registerKeyboardAction(ActionListener action, KeyStroke stroke, int condition)'
  - '[PAGE 46]


    # JAVA 9: SWING, DOCUMENTS AND PRINTING


    The ActionListener parameter must define the method actionPerformed() to perform
    the necessary operations corresponding to the KeyStroke parameter. The last parameter
    specifies under conditions that KeyStroke is valid:


    +   - JComponent.WHEN_FOCUSED, the ActionListener is called only if the component
    to which the KeyStroke object has focus.

    - JComponent.WHEN_ANCESTOR_OF_FOCUSED_COMPONENT, the component''s ActionListeners
    are called only if the KeyStroke object concerns is on a higher level (ancestor)
    than the component that has focus.

    - JComponent.WHEN_IN_FOCUSED_WINDOW, the ActionListener is called only if the
    component to which the KeyStroke object relates is in a window that has focus
    (JFrame, JDialog, JWindow).


    For example, if you want to define an ActionListener for ALT-H, regardless of
    which component in a JFrame the name frame that has focus, you can write something
    like the following:


    ```

    KeyStroke keyStroke =

    KeyStroke.getKeyStroke(KeyEvent.VK_H, KeyEvent.ALT_MASK, false);

    frame.getRoot().registerKeyboardAction(listener, keyStroke,

    Component.WHEN_ANCESTOR_OF_FOCUSED_COMPONENT);

    ```


    where listener is the name of the actual ActionListener.


    Each JComponent maintains a Hashtable with all KeyStroke as client properties.
    When a KeyStroke is registered with registerKeyboardAction(), it is added to this
    data structure. Only one ActionListener for each KeyStroke can be registered and
    if there is already an ActionListener for a particular KeyStroke, a new one overwrites
    the previous one. You can determine the current KeyStroke bindings using the getRegisteredKeyrokes()
    method and remove all bindings with resetKeyboardActions().


    By an Action, you basically understand an instance of an ActionListener with Hashtable
    bound properties, in fact, similar to client properties in JComponent. Typically,
    you use Action objects to record keyboard actions.


    As a small example, the program KeyStrokeProgram opens the following window:'
