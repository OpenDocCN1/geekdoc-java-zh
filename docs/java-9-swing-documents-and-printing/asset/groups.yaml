  - '[PAGE 10]


    # SWING DETAILS


    The programs user interface is developed by means of components which the user
    can do something with, and examples are JButton and JTextField, and there are
    about 30 - slightly more, depending on how you count - so there is a lot to work
    with. The basic component is called JComponent and is an abstract class containing
    all that is common to Swing components.


    All Swing components today support the Java Beans specification, and it means
    that components consist of properties, where a property is an instance variable
    with accessor methods. If, for example a variable has the name propertyName and
    describes a property of the component, you can expect that the component has methods
    setPropertyName() and getPropertyName() or isPropertyName(). The first only if
    it is a property whose value must be changed, and the last only if its type is
    boolean.


    Properties can be divided into


    +   * Simple properties, that are properties, not firing an event when the value
    is changed.

    * Bound properties, that are firing a PropertyChangeEvent when the value changes,
    and where an object of the type PropertyChangeListener be registered as a listener
    for a PropertyChangeEvent with the method addPropertyChangeListener().

    * Constrained properties, which also fired a PropertyChangeEvent but before the
    value is changed. An object of the type VetoableChangeListeners can be registered
    as a listener for these events with the method addVetoableChangeListener() (only
    a few components fire these events).


    A PropertyChangeEvent has assigned three values: The name of the property, the
    old value and the new value.


    A component can also fire a ChangeEvent that is fired when a property change state.
    Objects of the type ChangeListener can be registered as listeners for a ChangeEvent.
    Such an event is only associated with a single value, which is the component that
    raises the event.


    Another kind of properties are client properties and are key/value pairs that
    are stored in a Hashtable attached to each Swing component. This means that, with
    the method putClientProperty() you can add or remove a client property. For example
    you can add a property in the following manner:


    ```

    component.putClientProperty("propertyName", propertyValue);

    ```'
  - '[PAGE 11]


    # JAVA 9: SWING, DOCUMENTS AND PRINTING


    # SWING DETAILS


    and you can remove it with the statement


    ```

    component.putClientProperty("propertyName", null);

    ```


    You can get the value with the statement:


    ```

    value = component.getClientProperty("propertyName");

    ```


    Client properties allows you to add properties at runtime, and you can think of
    them as an opportunity to associate additional data with a component. Client properties
    are bound and fired a PropertyChangeEvent when the value is changed. For performance
    reasons, you should only occasionally add client properties for a component, and
    if you need new features of a component, you should consider writing a derived
    class.


