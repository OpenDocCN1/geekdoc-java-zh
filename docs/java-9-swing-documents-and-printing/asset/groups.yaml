    \ area);\n    }\n    end = start;\n    repaint();\n} catch (Exception ex) {\n\
    \    JOptionPane.showMessageDialog(this, ex.toString());\n}\n```\n\nThe method\
    \ starts by referring to the contents of the clipboard as a Transferable object.\
    \ If this object supports the correct DataFlavor, data is retrieved as an ImageData\
    \ object and base on it, a rectangle is created for the pixels to be updated.\
    \ The actual update is done with the method setPixels(). When the image is finally\
    \ redrawn, the rectangle that is selected must be removed.\n\n# DRAG AND DROP\n\
    \nDrag and drop is an operation where data using the mouse are moved from one\
    \ position to another position. In fact, most Swing components come with built-in\
    \ features for drag and drop, and it is relatively simple to implement this feature\
    \ in a program. The principle is a bit like the clipboard that the data to be\
    \ moved must be encapsulated in a Transferable object, and in addition, three\
    \ interfaces must be implemented, one of which defines the component on which\
    \ to perform a move, the other component where you must be able to drag and drop\
    \ an object indicating the visual representation of the operation. It sounds like\
    \ a lot, but it's because you have high degrees of liberty as to how the operation\
    \ is to be performed, and in practice it is actually limited what is needed.\n\
    \nDrag and drop operation includes three functions\n\n- 1. copy (hold the left\
    \ button down and move the mouse)\n- 2. move (hold the left button down and move\
    \ the mouse + CTRL)\n- 3. link (hold the left button down and move the mouse +\
    \ CTRL + SHIFT)\n\nwhere the last means that an object is not copied, but only\
    \ a reference to the original object is defined. These operations are defined\
    \ as constants in the DnDConstants:\n\n- 1. DnDConstants.ACTION_MOVE\n- 2. DnDConstants.ACTION_COPY\n\
    - 3. DnDConstants.ACTION_REFERENCE\n- 4. DnDConstants.ACTION_LINK\n- 5. DnDConstants.ACTION_COPY_OR_MOVE\n\
    \nThe principle of drag and drop is, with the mouse, one can drag one component\
    \ over another component and drop the first one. When Swing components support\
    \ drag and drop, it means all the necessary logic about the mouse is built-in,\
    \ but what's going to happen when dropping, Swing can of course not know and that's\
    \ why something needs to be programmed. I want to start with an application that\
    \ opens the following window:\n\n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_152_0.png)\n\
    \nThe window contains three labels and the meaning is that using a drag-and-drop\
    \ operation you can change the background color of the top label. Below is an\
    \ example where the background color has been changed three times (the number\
    \ 3 is displayed in a JLabel and the meaning only is to show what the interfaces\
    \ are used for as part of the drag and drop API:\n\n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_152_1.png)\n\
    \n# JAVA 9: SWING, DOCUMENTS AND PRINTING\n\n# DRAG AND DROP\n\n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_153_0.png)\n\
    \nThe full code is shown below:\n\n```java\npackage dropswwing;\n\nimport java.awt.*;\n\
