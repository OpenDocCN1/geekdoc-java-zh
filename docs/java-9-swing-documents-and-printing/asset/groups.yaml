    \ 1 是关于在该点对程序进行改进。\n\n# 2.5 焦点与键盘\n\nSwing 组件放置在容器中，其中一个组件拥有焦点，这样与键盘相关的事件就会发送到该组件。通用的焦点循环是从左到右、从上到下，你可以通过\
    \ TAB 和 CTRL-TAB 切换焦点，如果你想反向切换焦点，请使用 SHIFT-TAB 和 CTRL-SHIFT-TAB。焦点通过 `FocusManager`\
    \ 类的实例控制。从程序员的角度来看，这并没有什么挑战，但组件在获得焦点和失去焦点时会发送事件：\n\n- 1. 当组件获得焦点时触发 `focusGained(FocusEvent\
    \ e)`\n- 2. 当组件失去焦点时触发 `focusLost(FocusEvent e)`\n\n# SWING 详情\n\n当组件拥有焦点且按下键盘上的按键时，该组件（取决于具体的组件）可以发送一个\
    \ `KeyEvent`。这些事件可以通过关联 `KeyListener` 来捕获。与其他事件不同，`KeyEvent` 可能在相应的操作执行之前发送。当按下按键时，会触发三个\
    \ `KeyEvent`：\n\n- 1. `KEY_PRESSED`：按下按键时发生。通过 `keyCode` 属性指定按键，`getKeyCode()`\
    \ 可以获取表示键的虚拟代码，例如 `KeyEvent.VK_ENTER`。你应该注意，像 CTRL-C 等组合键会触发两个 `KEY_PRESSED` 事件，虚拟代码为\
    \ `KeyEvent.VK_CTRL` 和 `KeyEvent.VK_C`。`KeyEvent` 还有一个 `keyChar` 属性，其中包含 Unicode\
    \ 编码。\n- 2. `KEY_RELEASED`：与 `KEY_PRESSED` 事件相同，在释放按键时触发，其触发频率不如 `KEY_PRESSED`\
    \ 事件频繁。\n- 3. `KEY_TYPED`：在 `KEY_PRESSED` 和 `KEY_RELEASED` 之间触发的事件，但没有关联 `keyCode`。对于没有\
    \ Unicode 表示的键（如 PAGE UP 和 PRINT SCREEN），不会触发这些事件。\n\n![](img/d1bfc3b279aa0e38d6b85dc85f9734c5_44_0.png)\n\
