    # DRAG AND DROP


    Drag and drop is an operation where data using the mouse are moved from one position
    to another position. In fact, most Swing components come with built-in features
    for drag and drop, and it is relatively simple to implement this feature in a
    program. The principle is a bit like the clipboard that the data to be moved must
    be encapsulated in a Transferable object, and in addition, three interfaces must
    be implemented, one of which defines the component on which to perform a move,
    the other component where you must be able to drag and drop an object indicating
    the visual representation of the operation. It sounds like a lot, but it''s because
    you have high degrees of liberty as to how the operation is to be performed, and
    in practice it is actually limited what is needed.


    Drag and drop operation includes three functions


    +   1. copy (hold the left button down and move the mouse)

    2. move (hold the left button down and move the mouse + CTRL)

    3. link (hold the left button down and move the mouse + CTRL + SHIFT)


    where the last means that an object is not copied, but only a reference to the
    original object is defined. These operations are defined as constants in the DnDConstants:


    +   1. DnDConstants.ACTION_MOVE

    2. DnDConstants.ACTION_COPY

    3. DnDConstants.ACTION_REFERENCE

    4. DnDConstants.ACTION_LINK

    5. DnDConstants.ACTION_COPY_OR_MOVE


    The principle of drag and drop is, with the mouse, one can drag one component
    over another component and drop the first one. When Swing components support drag
    and drop, it means all the necessary logic about the mouse is built-in, but what''s
    going to happen when dropping, Swing can of course not know and that''s why something
    needs to be programmed. I want to start with an application that opens the following
    window:'
