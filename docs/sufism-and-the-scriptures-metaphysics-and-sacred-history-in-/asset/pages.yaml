  md: '# 46 Sufism and the Scriptures


    and simplicity of the divine essence, on the one hand, and the multiplicity of
    the divine names and attributes, on the other hand. Al-Jili’s rationale for highlighting
    the two different names, then, lies in his desire to draw attention to the comprehensive
    nature of the Qur’an, for true comprehens entails not only being all-encompassing,
    like the divine essence, but also detailed, like the names and attributes; as
    Martin quite put it in a similar Ibn ‘Arabian perspective, ‘The Qur’an is, like,
    at the same time one and multiple.’⁷ In summary, al-Jili’s discussion of these
    two names of the Qur’an — and some of the Qur’an’s other names later in this chapter
    and in the following chapter — ought to be placed within the context of his concern
    to show that the Qur’an, as the most comprehensive scripture, stands at the top
    of the hierarchy of scriptures, and that Muhammad, as his recipient, is the human
    being who fully encompasses the divine manifestation.


    # The comprehensiveness of the Perfect Human


    So if you were to say, ‘What is the benefit of him saying: He sent down the Qur’an
    as a single whole?’ we would say, ‘that benefit] has two aspects. The first is
    with respect to the effect (al-hukm), because the perfect servant (‘abd al-kāmil),
    if God manifests Himself to Him through His Essence, is affected (yubkam) by what
    he witnesses (yashhad), which is that he is the whole (jumlah) of the essence
    that does not end, and that [the essence has descended upon him leaving its locus
    (mahall), which is its rank (al-makānin). The second aspect is with respect to
    the exhaustion of the remnants of humanity (istifā baqayāt itdmīḥ al-rusum al-haqa’iq
    al-khalqiyyah), in its completeness, becomes the appearance of the divine realities
    (al-kull ‘adl al-ilāhiyyah), through their [leaving] effects (atthār) on every
    limb of the body (kull ‘adl min a’d al-jism). So the comprehensiveness (al-jumlah)
    is connected to his saying [i.e, the hadith] according to this second aspect,
    and is passing the meaning of all of the defects created (dhāhab jumlat mā’in
    al-khalqiyyah) of commentary on the attainment of realization of the divine realities
    (al-tahaquq al-biā’ al-ilāhiyyah).’⁸


    Al-Jili’s concept of the Qur’an, as we have seen, centres upon his view that it
    is a comprehensive scripture — to understand that it is an expression of the divine
    essence and attributes — and subsequent to that idea, upon view that the recipient
    of the Quranic revelation — Muhammad, or in case of Qur’an al-hakim, the Perfect
    Human more generally — is a comprehensive being. In this section, al-Jili elaborates
    upon this connection between the comprehensiveness of the Qur’an and the comprehensiveness
    of the Perfect Human, through an explanation of the key term used to express the
    notion of comprehensiveness, namely, al-jumlah. As we saw earlier in the chapter,
    he draws this key term from a hadith in which Muhammad declares that he received
    the Qur ‘as a single whole’ (jumlatan wāhidah); hence the section can be viewed
    as a kind of commentary on that uncanonical whatical.'
