    thought depends, which provides the most comprehensive overview of al-Jīlí’s thought,
    and it is on this work, therefore, that the present book will clearly state.


    # Al-Insān al-kāmil


    As already noted, while it is obviously devoted to the idea of the Perfect Human,
    al-Insān al-kāmil in fact ranges over almost every topic that al-jili deemed important
    from his Ibn ‘Ābian Sufi metaphysical perspective. Each of sixty-three chapters
    are devoted to a specific key term and concept, the majority of which are rooted
    in the Qur’an or Ibn ‘Ābian Sufi metaphysics works. The book is divided into two
    parts$^{15}$ the first of which deals with the divine essence (al-dhāt), names
    (al-asmā’) and attributes (al-ṣifāt), and the second of which is mainly devoted
    to Qur’anic concepts such as the Preserved Text (al-lawḥ al-maḥfīz) and the Holy
    Spirit (rū al-ʿūd), though the dividing line between the two parts is not a completely
    sharp. The chapters on the scriptures are located towards the end of the first
    part of the book. Because this is, the scriptures are associated with al-Jilī
    thought with the divine essence, names and attributes, are yet also Qur’anic themes.
    In this sense, they can be viewed as a bridge connecting the two parts of the
    book, and therefore as central to the work as a whole – providing further justification
    for our decision to focus upon it in the present book.


    As can seen, the contents of al-Insān al-kāmil are heavily coloured by Qur’anic
    imagery and vocabulary; indeed, we can go so far as say that the book is a kind
    of lexicon of Qur’anic terminology, with the Qur’anic key terms defined according
    to al-Jili’s Sufi metaphysical ideas. Thus, he begins each chapter with an explanation
    of'
