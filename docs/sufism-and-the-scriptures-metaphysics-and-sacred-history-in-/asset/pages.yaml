    # The Qur’an


    We begin our reading of al-Jīī’s Sufi metaphysical conception of the scriptures
    with an analysis of chapter thirty-four of al-Insān al-kāmilī, which is devoted
    to the Qur’an (*al-Qurān*), the scripture revealed to Muhammad – the event, as
    we have seen, constitutes the apex of sacred history in the Qur’an-centred view.
    The Qur’an is the first scripture to which al-Jīī devotes a specific chapter in
    al-Insān al-kāmil.¹ This is notable, because his treatment of the scriptures is
    otherwise chronological. Chapter thirty-six is devoted to the Torah (*al-Tawrāh*),
    chapter thirty-seven to the Psalms (*al-Zabr*) and chapter thirty-eight to the
    Gospel (*al-Injīl). Chapter thirty-five of the Furgan, and will be partly analysed
    later in this chapter). Al-Jīzī decision to put the Qur’an first, I think, reflects
    his belief in the superiority of the Qur’an and Muhammad over the other scriptures
    and prophets. At a more metaphysical level, while reality (*al-haqiqah al-muhammadiyyah*),²
    actually existed before all of the other prophets, an idea indicated in the famous
    hadith often quoted by Ibn ‘Āabi and his followers: ‘Muhammad was a prophet even
    when Adam was between water and clay.³ From this Sufi metaphysical perspective,
    then, the Qur’an – which, as we shall see, Muhammad is closely connected to –
    can be said to have existed before the creation of mankind and therefore to be
    chronologically prior to the other scriptures as well as superior to them.


    These preliminary remarks reflect the nature of al-Jīzī’s treatment of the Qur’an.
    As will become, he displays relatively little interest in more mundane matters
    that were traditionally interesting to Qur’anic exegetes, as the historical circumstances
    of revelation (*asbab al-nuzul*), the grammar, syntax and vocabulary of Qur’anic
    Arabic, or verses abrogate (*al-nasikh wa-mansukh*), showing much greater concern
    for the metaphysical significance of the revelation of the Qur’an and Muhammad’s
    role as messenger. In this way, he integrates the Qur’an into his overall Sufi
    metaphysics. At the same time, his treatment of the Qur’an also reveals a conception
    of sacred history, which, as we can already begin to see, chimes with the Qur’an-centred
    view. In what follows, I shall attempt to bring out these key elements of al-Jīzī’s
    conception of the Qur’an by undertaking a close reading of key extracts from chapters
    thirty-four and thirty-five.'
