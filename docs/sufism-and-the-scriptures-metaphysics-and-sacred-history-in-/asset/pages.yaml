  md: 'This tendency of al-Jili views the scriptures and prophets through the prism
    of his Sufi metaphysics is reminiscent of Ibn ‘Ārābi, who similarly uses Qur’ic
    prophetic stories in Fuṣūṣ-al-ḥikam as gateways to a discussion of his Sufi metaphysical
    ideals. Equally, the three key Sufi metaphysical ideas that underlie al-Jili’s
    view of the scriptures are highly Ibn ‘Ārabian. This deep influence of Ibn ‘Ārābi
    on a thicker living in Yemen two hundred years ago can be taken as an indicator
    of Ibn ‘Ārābi’s impact on Sufi thought of the later Middle Ages – an influence
    that would continue to grow over the following centuries, up until modern times.
    At the same time, however, it would be wrong to view al-Jili as merely a duplicator
    of Ibn ‘Ārābi’s thought or a commentator on his work. Certainly, there are hints,
    in the work of al-Jili’s ‘Ārabian predecessors, the ‘metaphysicalizing’ wave in
    which al-Jili understands the scriptures: for example, Ibn ‘Ārābi uses the term
    ‘book’‘scripture’ (kutub martamab jam wa-dammim), including the divine knowledge,
    Adam and man/the world; ‘al-Qawāni draws a tantalizing parallel between the universal
    divine books (kutub ilāhiyah kulliyyah) – that is, the Qur’ān, Furqan, Torah,
    Psalms and God and the five ‘divine presences’ (hadrat) (a concept closely related
    to the ‘levels of existence’); and al-Qaysari, similarly, identifies the five
    ‘presences’ or ‘worlds’ (awāīm) as ‘divine books’ (kutub ilāhiyah). Yet, it does
    not come as a passage in al-Jili’s writings, or in the work of his interpreters,
    who those earlier apply their Sufi metaphysics to the various scriptures in the
    same systematic, consistent and detailed fashion that they did in these chapters
    of al-Insān-kamil. Nor as far as I know, do Ibn ‘Ābi or his interpreters ever
    engage with such topics as the contents of the Torah or the Christian doctrine
    of the Trinity in an in-depth way as does al-Jili. The present book, therefore,
    bears out the often claims that al-Jili is both adherent of the ‘Ārabian tradition
    and yet also a more systematic than Ibn ‘Ārābi and a relatively independent-minded
    thinker, who develops the ideas of Ibn ‘Ārābi and his followers in new directions.⁴


    While the chapters analysed here provide an overview of al-Jili’s key Sufi metaphysics
    and the relation of his thought to Ibn ‘Ārābi’s thought the wider Ibn ‘Ārabian
    tradition, they also give us a clear and fascinating insight into the more specific
    issue of his views on sacred history. It is clear that, in line with the Qurān-centred
    view of sacred history, al-Jili views the revelation of the Qur’ān, Torah and
    Gospel as different elements of a single phenomenon. While in conventional, Qur’anic
    terms, the scriptures constitute different instances of God ‘sending down (tanzil)
    the true message to one of His prophets, who are thereafter commanded to propagate
    this message to the people, in al-Jili’s Sufi reworking of the conventional view,
    they constitute ‘manifestation’ (tajalli) of the divine existence. The four recipients
    of these revelations, similarly, like of divine manifestation, also share in a
    similar kind of prophecy, as in the Qurān-centred view.


    At the same time, we are also able to draw out of al-Jili’s discussion of the
    scriptures a hierarchy of scriptures, prophets and religions; and indeed, al-Jili
    makes this hierarchy explicit on a number of occasions. The hierarchy is based
    on the principle that each of the scriptures represents a particular type of divine
    manifestation. Since, according to the Sufi metaphysical idea of the levels of
    existence, some of these manifestations are'
