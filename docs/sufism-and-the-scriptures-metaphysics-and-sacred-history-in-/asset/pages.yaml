  md: '# Introduction


    Based on my reading of the chapters on the scriptures, I shall argue that, while
    al-Jili’s view of the scriptures is to a large extent conditioned by his key Sufi
    metaphysical ideals (particularly what I describe as the ideas of universal theophany,
    the ‘levels of existence’, and ‘the Perfect Human’), nevertheless his view of
    sacred history is consistent with the Qur’ān-centred view. We shall see that his
    view of the pre-Qur’anic scriptures – the Torah, Psalms and Gospel – and the pre-
    or non-Islamic communities to which they were revealed – the Jews and Christians
    – is marked by a certain ambivalence, and that, consistent with the Qur’ān-centred
    view, he maintains the superiority of the Qur’ān, Muhammad and Islam over the
    other scriptures, prophets and religions. This being the case, the findings of
    the present book challenge and complicate prevailing views regarding the pluralistic
    quality of Ibn ‘Arabian Sufi views on other religions, and supplement and support
    the argument recently made in relation to Ibn ‘Arabi by Gregory Lipton in Rethinking
    Ibn ‘Arabi (2018).¹⁷ In this way, the present book should, I hope, be of interest
    and use not only to scholars and students of Sufism and the Ibn ‘Arabian Sufi
    tradition but also to those interested in the history of Muslim-Jewish Muslim-Christian
    relations and Islamic views of the religious ‘other’.'
