    Friend of God, particularly when discussing the famous hadith according to which
    God becomes the tongue, hearing, sight and so forth of the servant who draws near
    to him.⁹ This would suggest al-Jili here in the ‘perfect’ Friends of God in general,
    rather than Muhammad in particular, which would be in keeping with his earlier
    indication that Perfect Humans other than Muhammad are capable of receiving the
    revelation of al-Qur’ān-hakim, and with his more general Ibn ‘Arab conception
    of the Perfect Humans or Friends of God as ‘general’ prophetic channels for communication
    between God and man, even after the sealing of legislative prophecy. On the other
    hand, Muhammad is obviously the messenger who receives the Qur’anic revelation,
    Muhammad is also the speaker of the hadith quoted here, on which this passage
    is effectively a commentary; and, as already, al-Jili’s locus here is of the bodily
    transformation of the recipient of the Qur’anic revelation fits with his earlier
    statement that Muhammad’s body (jism) was the locus for the manifestation of God’s
    unqualified oneness. Furthermore, in the Kamālt, a text describing Muhammad’s
    embodiment of God’s ninety-nine most beautiful names, al-Jili specifically links
    the transformation indicated here to Muhammad: “There was no prophet among the
    prophets,¹¹ he writes, ‘who did not manifest humanity (al-bashariyah), with the
    exception of Muhammad, for whose humanity was non-existent (ma-dī‘ām), and there
    was no trace (athar) of it.’¹¹⁰ The Prophet, he goes on to say, was marked by
    ‘the absence of created renamants (al-baqāā-al-halqyaj) within him, in every respect,
    because of his realization of the perfections of the Real, in every respect, for
    God ‘concealed his existence through His, and His perfection appeared within him
    without indwelling (hulūl) or adaptation [i.e. of God] (takayyf).¹¹¹ So He appeared
    in the human form of the human organism (nāsūt al-hayāl-al-insānī), effecting
    the effects of humanity and humanity (ahkām al-insāniyyah-al-bashariyah).¹¹²


    It seems that, while the transformation from human to quasi-divine is potentially
    attainable by other human beings, the archetypal – or perhaps the only – figure
    who achieved this transformation is Muhammad. This fits with his insistence upon
    Muhammad, other individuals being perfect by virtue of their attachment to the
    Prophet, the most perfect individual. If the other Perfect Humans receive the
    Qur’anic revelation in some sense, then we can assume that they do only so in
    their capacity as which the Muhammadan Reality appears, as suggested above. Underlying
    all of this is the centrality of Muhammad within al-Jili’s Sufi metaphysics, a
    point that is of great relevance to our understanding of his sacred history. Indeed,
    al-Jili’s description of the effacement of Muhammad’s humanity in this passage
    (and the passage quoted from the Kamālt) elevates the Prophet once again to quasi-divine
    status, to an extent not found in the earlier Ibn ‘Arabian tradition or in the
    mainstream Islamic tradition.¹¹¹³ Indeed, it is significant where al-Jili goes
    beyond the conventional Muslim view, he does so in the context of exaltation of
    Muhammad, a point that only serves to strengthen the reader’s sense of the superiority
    of Muhammad and the Qur’an over the other prophets and scriptures in his thought.'
