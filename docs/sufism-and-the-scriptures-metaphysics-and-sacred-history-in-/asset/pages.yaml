  md: '# Al-Jīli and al-Insān al-kāmil


    Though, for Ibn ‘Ābi and his followers, it is true to say that only God really
    exists, what ‘appears’ or becomes manifest in the phenomenal world is not God’s
    essence (*al-dhāt*) itself. Rather, it is specifically through his *Names* and
    attributes (*al-maṣā-wa-sifāt*) that God reveals Himself within the world;²² hence,
    in another work, Ibn Khaldūn also refers to the Ibn ‘Ābians as the partisans of
    manifestation, of divine names, and presences (*asḥāb al-tajallī wa-maẓāir al-maṣā-wa-hadrat*);²³
    It is through the names and attributes, then, that serve as ‘connections’ (*nisab*)
    between God and his creation.²⁴ This is significant, insofar as divine names and
    attributes reflect the divine reality to different degrees of completeness. As
    al-Jīli puts in his *Sharḥ mushkil al-Futuhāt* to every attribute.²⁵ We can refer
    to this notion as ‘the idea of the levels of existence, maratīb al-wujūd’ being
    a term employed by Ibn ‘Ābi and his followers, who we have already seen, a work
    of that term.³⁶ A synonym for that term is *[ḥadrat]*; hence the inclusion of
    that term in Ibn Khaldūn’s name for the Ibn ‘Ābians.²⁷ The significance of the
    levels of existence lies in the fact that, the different existents (*mawjudūd*)
    of the phenomenal world constitute *loci of manifestation* (*mazāhir*) of the
    different names and attributes, and if these names and attributes reflect the
    divine to different degrees of completeness, then phenomenal existence will also
    in accordance with the particular divine names that they manifest.²⁸ While the
    key ‘Ābian idea of universal theology speaks of unity (*wahdatah*) of God and
    creation, therefore, the idea of the levels of existence points towards the *diversity*
    or multiplicity (*kathrat*) within both the Godhead and the phenomenal world;
    hence the ‘Ābian Sufis speak of ‘unity within multiplicity’ and ‘multiplicity
    within unity.’⁹ The Shaykh [‘the oneness (*wāḥidyyah*) of God’, writes al-Jīli
    in his commentary on the *Futiḥāt*, of al-Jīli, it is important that we acknowledge
    the existence of both of perspectives – that is, of unity and multiplicity – in
    the Ibn ‘Ābian world view. This holds especially for his views on the scriptures
    and sacred history, as we shall see, al-Jīli professes a belief in the underlying
