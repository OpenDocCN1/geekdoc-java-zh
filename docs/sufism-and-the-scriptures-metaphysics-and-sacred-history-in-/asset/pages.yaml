    # ## The Qur’an-centred view of sacred history


    While al-Jili’s Sufi metaphysics determines his view of the scriptures and renders
    his view of sacred history distinctive (at least from non-Ibn ‘Arabian views of
    sacred history), this does not mean, as already suggested, that his scriptures
    violate the Qur’an-centred view of their generations. In order to establish this
    point, it is first necessary that we have some idea of the key elements of that
    Qur’an-centred view. This raises first the issue of terminology: What it means
    to talk about the ‘Qur’an-centred view of sacred history?


    Sacred history can be generally understood as an ‘Account of God working through
    His agents to accomplish His will,’ where ‘human agents’ are prophets, Understanding
    in this way, it can be said that history in the Qur’an is sacred history: as Kenneth
    Craig, the ‘time-perspectives’ of the Qur’an are ‘backwards’ to the prophets and
    their generations, and forwards to the judgment-end². Secular history, by contrast,
    receive little attention to the Islamic scripture.


    I am calling ‘the Qur’an-centred view of sacred history’, however, is not confined
    merely to what the Qur’an itself says about the prophets and their communities;
    rather, the term refers to the common framework in which Muslims priority to (and
    in many cases, up to the present day) thought about the prophetic past³. As it
    includes ideas about sacred history in various genres of post-Qur’anic Islamic
    literature, such as hadith, Qur’an exegetesis (tafsir), doxography, religious
    polemic, the tales of the prophets (qisas al-‘anbyā’) and historical chronicles
    (tārīkh), as well as the Qur’an itself. Nevertheless, this view of sacred history
    is ‘Qur’an-centred’ in two respects. First, though supplemented by the sources
    mentioned, it is primarily rooted in what the Qur’an says about sacred history.
    Second, this view of sacred history, as we shall see presently, makes the revelation
    of the Qur’an to Muhammad the central event in history, in the sense that all
    that went before this event is believed to lead up to it, and all that come after
    must look back to it.


    The central theme through the Qur’an-centred view of sacred history is the need
    for mankind to acknowledge, believe, in submit and worship the one God (Allā)
    who created the heavens and the earth – obligations figured by the key Arabic
    terms tawīhid, imān, isl and ‘ibāddah.’ Those who perform these obligations will
    be admitted to paradise, and those who do not will be condemned to hell (see e.g.'
