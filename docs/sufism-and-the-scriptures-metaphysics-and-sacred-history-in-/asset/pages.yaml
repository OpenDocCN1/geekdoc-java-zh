    (b) The Sufi metaphysics of al-Insān al-kāmil


    # Ibn ''Arabian Sufi metaphysics:


    Ibn ''Jilī’s al-kāmil reveals his almost total commitment to the underlying Sufi
    metaphysical world view of Ibn ''Arabī and his interpreters. The major contribution
    of this intellectual tradition to the history of ideas, and the central idea within
    his metaphysical system, is what I have termed the ''idea of universal theophany.''
    This is to say that the entire phenomenal world is, as Syed Muhammad Naqub al-Atas
    has rather phrased it, the ''theatre of [God''s] manifestation.''¹⁶ This is to
    say that existence or being not independent or separate kind of existence, but
    rather ''limited'' (muqayyad) existence of God, ''unlimited'' (muʿlaq) existence
    is in the fact one and only ''real'' existence. For the Ibn ''Arabians, the first
    half of the shahāda, ''There is no god God, the fundamental unit of Islamic monotheistic
    faith, means nothing less than ''there is no existence but God,'' or as al-Jili
    puts, ''The Real is everything (al-haqq huwa al-kull).''¹⁸ This idea of universal
    theophany features (either explicitly or implicitly) on every page of the writings
    of Ibn ''Arabī and his followers, including tajalli of al-Insān al-kāmil, where
    it is figured by the recurring key tajalli (''unveiling'', ''manifestation'',
    ''self-disclosure'') and zuūr (‘appearance’, ‘manifestation'') and thus in makin
    makes forms maqjaz and mazhar (‘locus of manifestation, the literal version of
    al-''Arabī’s more poetic rendering).¹⁹ As Izutsu puts, tajalli is the pivotal
    point of Ibn ''Arabī’s thought. Indeed, the concept of tajalli is the very basis
    of his world-view'';² hence Ibn Khaldūn (8/1046) calls the Ibn ''Arabian Sufis
    the parties of [divine] metaphysics, loci of appearance, and presences (ashāb
    al-tajalli wa-mazāhir wa-al-ḥadāt).²¹'
