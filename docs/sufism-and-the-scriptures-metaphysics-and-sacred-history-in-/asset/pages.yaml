    Sufism and the Scriptures


    Overarching all of the elements in Table 2 are God – of whom all of the elements
    constitute manifestations – His Prophet, Muhammad – in whom all of the elements
    are manifest. In this respect, we find that al-Jili’s discussion of scripture
    ultimately leads us back to the key points within his Sufi metaphysics, namely,
    the existence of multiplicity within unity and unity within multiplicity; the
    nature of God as both simple – in the ‘unqualified oneness’ of His essence – and
    qualified – in the ‘qualified oneness’ of His Names and attributes; and the nature
    of the Perfect Human, Muhammad, as a comprehensive being who unifies the one and
    the many, the simple and the qualified, the divine and the created.


    # Conclusion


    al-Jili’s chapter on the Qur’an reveals much about his general conception of revelation.
    The Qur’an, as he sees it, is not merely a ‘book’ in the conventional sense; its
    revelation is also an expression of God’s manifestation in the ‘book’ of the phenomenal
    world, its different names representing different aspects of God. Furthermore,
    the revelation of the Qur’an to Muhammad is an indication that Muhammad is perfect
    for this divine manifestation, followed by those individuals who embody the Muhammad
    Reality. The chapter therefore constitutes an elaboration of al-Jili’s key Sufi
    metaphysical ideals of universal theophany and the Perfect Human, expressed in
    terms of the Qur’anic revelation. This tendency of al-Jili’s to use the scriptures
    as a ‘way in to his broader Sufi metaphysics can be seen throughout the chapters
    discussed in this topic.


    This is not to, however, that the Qur’an, in al-Jili’s view, functions merely
    as a symbol for something else, with no intrinsic significance of his. As he sees
    it, the revelation of the Qur’an to Muhammad is the central event in the course
    of history, constituting the moment when God revealed Himself fully to him and
    when much attained his fullest perfection. The chapter therefore not deals with
    the general ideas of universal theophany and the Perfect Human at an abstract
    level but also indicates the unique place of the Qur’an and Muhammad at the level
    of sacred history. If we were to try to sum up the nature of this uniqueness,
    we could say that it lies in the comprehensiveness or perfection of the Qur’an
    and Muhammad, for both constitute a comprehensive manifestation of God’s essence
    and His Names and attributes.


    Throughout this chapter, al-jili flirts with ideas that might be described, from
    a traditional Islamic perspective, heterodox. This is particularly true of his
    depiction of Muhammad, whom he describes in such exalted terms as almost blur
    the boundary between divinity and humanity. This can be seen in his identification
    of Muhammad’s essence with the divine essence, of Muhammad’s body as the locus
    of manifestation for God’s unqualified oneness, and of Muhammad with the Qur’an.
    For the purposes of the present book what is most important is that the overall
    view of sacred history that al-Jili puts forward is in keeping with the Qur’an-centred
    view, even if it is expressed in Sufi metaphysical terms. For al-Jili, the Qur’an,
    being an expression of the divine essence at the level of unqualified oneness,
    constitutes the complete form'
