  md: '# Conclusion


    The chapters of *al-Insān al-kāmīl* on the Qur’ān, Torah, Psalms and Gospel serve
    as a useful case study for anyone seeking to understand al-Jilī’s *‘Ārabian* Sufi
    metaphysics and Ibn *‘Ārabian views on the scriptures, prophets and religions.
    As this book has tried to show, a close reading of these chapters gives us an
    insight into the key elements of both al-Jilī’s thought and several important
    issues, as how his believes with his Sufi metaphysics determines his view of sacred
    history, the relation of his thought to the Qur’ān-centered view of sacred history
    and the relevance of these aspects of al-Jilī’s thought to thinking on the relationship
    between Islam and other religions.


    To begin with more generally, the chapters that we have looked at demonstrate
    that al-Jilī’s thought revolves around the three key Ibn ‘Ārabian Sufi metaphysical
    ideals of universal theophany,the levels of existence and the Perfect Human, as
    well as other related ideas like the ideas of universal monotheism and mercy.
    As we have seen, these Ibn ‘Ārabian ideas determine his view of scripture and
    prophecy. We have seen that in accordance with al-Jilī’s ideals of universal theophany,
    he believes that each of the scriptures constitute a form of divine manifestation
    (tajalli). This means, in his interpretation, that each scripture is a ‘revelation’
    not in the narrow sense of being revealed by God but also in the broader sense
    that each is an ‘unveiling of God Himself The Qur’ān is an unveiling of the divine
    essence, and the earlier scriptures of the various kinds of divine names and attributes.
    Connected to this, we have also seen how, in accordance with his idea of the levels
    of existence, al-Jilī deems each of the scriptures to correspond to a particular
    level within the hierarchy of existence. The Qur’ān corresponds to the level of
    ‘unqualified oneness’ (al-‘ādiyyah), the Torah to the level of ‘all-mercifulness’
    (al-rahmānyyah), the Psalms to the level of ‘kingship’ (al-malikiyyah), and the
    Gospel to the level of ‘qualified oneness’. Furthermore, we have seen that he
    views the prophets Muhammad, Moses, David and Jesus, the recipients of these scriptures,
    as ‘loci of manifestation’ (mazāhir) of these different types of divine manifestation
    and levels of existence. As loci of manifestation of the divine names and attributes
    (and, in the case of Muhammad, the divine essence itself), the prophets can therefore
    be understood as Perfect Humans. Finally, we have seen that al-Jilī’s explanation
    and interpretation of the contents of the scriptures, and the doctrines that are
    drawn from them, are also determined by his key Sufi metaphysical concepts and
    related Sufi ideas. This is true of his interpretation of Qur’anic verses, of
    his presentation of the ‘sciences’ contained in the Torah and the Psalms and of
    his analysis of the true meaning of the doctrine of the Trinity expressed in the
    Gospel. In each case, his discussion takes us back to the same key ideas, which
    provide a key to explaining the fundamental issue of the relationship between
    God and creation.'
