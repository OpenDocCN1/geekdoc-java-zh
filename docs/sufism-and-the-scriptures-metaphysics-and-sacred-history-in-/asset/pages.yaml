    more complete than others, which is to say that they are fuller expressions of
    the divine names and attributes (in the case of the Qur’ān, the divine essence),
    it follows that some of the scriptures are more complete than others. Significantly,
    we find that the hierarchy of scriptures, prophets and religions that emerges
    from al-Jili’s discussion is fully in keeping with the Qur-centered view of sacred
    history, even if its Sufi metaphysical is untypical. The Qur’ān, as an expression
    of the divine essence and the level of ‘unqualified oneness’ (the third level
    of existence, yet the least qualified after the hidden of the divine essence),
    stands at the top of the hierarchy of scriptures, followed by the Gospel, an expression
    of the names and the level of ‘unqualified oneness’ (the fourth level), then the
    Torah, an expression of the names of the attributes and the level of ‘all-mercifulness’
    (the fifth level), and the Psalms, an expression of the active attributes and
    the level of ‘kingship’ (the sixth or seventh level).


    In accordance with this hierarchy of scriptures, Muhammad stands at the summit
    of the hierarchy, for as recipient of the Qur’an he embodies the divine essence
    as well as all of the attributes, and is therefore the most perfect and complete
    Perfect Human; indeed, his spiritual reality, known as the ‘Muhammadmadan Reality’
    (al-haiqah al-muhammadiyyah), seems not only to pervade the entirety of the existence
    and other ‘Perfect Ones’ but also to blur into the divine essence itself. As for
    Moses, David and Jesus, he also excludes for the errors of their people, he nevertheless
    deems them to be lesser prophets and Perfect Humans incomparably, the revelations
    or manifestations that he received were not complete as the Qur’ān, indicating
    that his knowledge was not complete as his.³ Although al-Jili suggests that these
    other prophets are Perfect Humans insofar they were only manifestation of the
    divine names and attributes, he never applies the term insān to them, reflecting
    to which this title, should only be used of Muhammad.


    Finally, the superiority of the Qur’ān and Muhammad means that, in al-Jili’s view,
    Muhammad’s people, the Muslims, are the best religious community, and his religion,
    Islam, the best of religions. While so, the people spiritually and cognitively
    aware Muslims who properly understand their scripture and their faith are able
    to synthesize, in true Ibn ‘Abrian fashion, the perspectives of tashbih and tanzih
    (difference comparability and incomparability), the Jewish people are excessive
    in tanzih, while the Christians go to an extreme of tashbih. When it comes to
    assessing the merits of the Jews and the Christians, just as the Gospel comes
    second in the hierarchy of scriptures, so do the Christians come second in the
    hierarchy of religious communities, for though they have committed the error of
    limiting the divine manifestation to Jesus and the other persons of the Trinity,
    nevertheless, their mistaken doctrines of the Trinity and Incarnation serve the
    positive purpose of enabling them to recognize – at least partially – the key
    Sufi metaphysical truth that God manifest in his creation, and in particular in
    mankind. The Jews, meanwhile, do not recognize this truth, since Moses was commanded
    not to propagate the tablets of the Torah that contained the mysteries of ‘lordship’
    (rububiyyah) and ‘power’ (qudrah), which point to God’s appearance within mankind.
    Judaism and the Jews therefore come third, in, the hierarchy of religions and
    religious communities.'
