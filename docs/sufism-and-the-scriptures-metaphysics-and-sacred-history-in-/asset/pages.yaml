  md: '# Al-Jili and al-Insān al-kāmil


    # Al-Jili’s life and works


    We know little about al-Jili’s life with any certainty. Such is the paucity of
    surviving information on his life, in fact, that Claude Addas, the leading modern
    biographer of Ibn ʿArabī¹, has gone so far as to ask, albeit rhetorically, whether
    al-Jili really existed. Thanks to the work done by Riyadh Atlagh, however, we
    now have the basic outlines of his biography.² Al-Jili was born in Calicut on
    the Malabar Coast of India (d. 806/1365). As a boy he travelled with his father
    to Aden in Yemen, following a route well traversed by traders and then in later
    periods. From Aden went to Zabid on Yemen’s western coastal plain, which subsequently
    made him famous. In Zabid he joined the Sufi community led by the famous shaykh
    Ismaʿ al-Jabarti (d. 806/1403) of the Ahdali branch ṭariqah. Al-Jabarti was close
    to the Rusulid sultans of southern Yemen, al-Ashraf Ismaʿī (r. 778–803/1376–1400)
    and al-Nṣir Ahmad whose Sufi community patronage and protection from its critics
    from the anti-Sufi fuqahhā. Al-Jabarti’s Sufi circle was known for its samʿ (Sufi
    mystical concerts) central to its ritual practice and for his adherence to the
    ideas of Ibn ʿArabī and his followers. Al-Jili taught his disciples from his famous
    commentaries by al-Jandi (d. 700/1300), al-Qāshīni (d. 730/1329) and al-Qaysari
    (d. 751/1350) and al-Futūḥāt al-Makkīyyah.³⁴ It is therefore likely that al-Jili
    was first exposed to Ibn ʿArabian Sufi thought in a depth and sustained manner
    in the course of his instruction by al-Jili. While Zabid became his home, he travelled
    widely, visiting Mecca and Medina, India, Iran, Damascus, Gaza, and Cairo over
    the course of his life. He died and was buried in Zabid in 811/1408.⁵


    We know relatively little about the details of al-Jili’s life, we are able to
    build up a fairly comprehensive picture of his thought based on the several writings
    of that have come down to us. We have approximately twenty works (including two
    made up of several treatises), of which eleven are extant. The surviving works
    deal with ʿArabian Sufi metaphysical topics. Indeed, at least one of them is a
    direct commentary (sharḥ) on a work of Ibn ʿArabī’s: Sharḥ mushkilāt al-Futūḥāt
    al-Makkīyyah, a partial commentary on the summative penultimate chapter (chapter
    559) of the Futūḥāt, written at some point between 805/1402/3 (which al-Jili mentions
    in the Sharḥ as the year of a particularly significant dream he'
