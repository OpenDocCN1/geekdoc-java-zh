    Notes


    12. In the realm of interreligious dialogue and debate, three possible approaches
    to other religions are identified: ''exclusivism'', ''inclusivism'' and ''pluralism''.
    Simply put, exclusivism is the view that one''s own religion is the only path
    to the truth and/or salvation; inclusivism is the view that, while one''s own
    religion is the correct path to the truth and/or salvation, adherents of other
    religions can be admitted to the truth and/or salvation; pluralism is the view
    that there are multiple paths to the truth and/or salvation. This typology was
    first set out by the Christian theologian Alan Race. See A. Race, Christians and
    Religious Pluralism: Patterns in Christian Theology (London: S Press, 1983).


    13. Owing to the subject of this book, I also bring into my analysis relevant
    passages from the last chapter (chapter sixty-three) of IbnʿĀismīl, On all of
    the religions and forms of worship; and include a brief summary of the key ideas
    contained within this chapter in the conclusion to this book.


    14. For potential pitfalls of textual analysis, see Q. Skinner, ''Meaning and
    Understanding in the History of Ideas'', History and Idea 8, no. 1 (1969), 3–5,
    23–38.


    15. In adopting this method to the study of texts, I am particularly indebted
    to Michael Freeden''s description (or advocacy) of the approach to the study of
    ideologies that has focused concepts, see M. Freeden, Ideology: A Very Short Introduction
    (Oxford: Oxford University Press, 2003), 48–55, as well as to Nettler''s approach
    to the study of IbnʿArabi, as developed in R. Nettler, Suf Metaphysics and Quranic
    Prophets: IbnʿArababi''s Thought and Method in the Fūsṣ-al-hikikam (Cambridge:
    Islamic Texts Society, 2003). Similar conceptual approaches to the study of IbnʿArababi
    can be seen in S. M. N. Al-Attas, The Mysticism of Hamzah Farabi (PhD thesis.,
    School of Oriental and African Studies, 1966) (see eq. 13–15); T. Itutsu, Sufism
    & Taoism: A Comparative Study of Philosophical Concepts (Berkeley and London:
    University of California Press, 1984).


