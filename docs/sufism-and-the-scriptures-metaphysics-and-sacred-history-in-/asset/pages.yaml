  md: '# The Qur’ān


    these two different types of divine manifestation, and grounds the idea in a number
    of sciptural passages.


    The first scriptural passage is a hadith that, as already mentioned, is reported
    on the authority of Ibn ‘Abbās. This hadith, or variants of it, is commonly used
    in the Qur’anic exegetical literature to indicate the idea that the Qur’ān was
    sent down as a single whole from the Preserved Tablet (al-lawḥ al-maḥfūẓ) to the
    lowest heaven on the Night of Power (laylat al-qadr), and then revealed to Muhammad,
    in the lower world, over a period of twenty and twenty-five years. Al-Jili explains
    this traditional notion of a two-stage process of the Qur’anic revelation–the
    first as a complete work, the second in gradual stages–for his own Sufi metaphysical
    notion namely, the manifestation of the essence and the manifestation of the names
    and attributes. Al-Jili tells that the first part of the hadith, about the Qur’ān
    revealed ‘with a single push’ (daf’atan waḥidātan), indicates what he calls al-taḥāqī
    al-dhāti, a term that denotes the attentation of knowledge of the divine essence
    an accomplishment that constitutes the response to the manifestation of the essence
    (al-tajallī al-dhāt). It can be inferred that Al-Jili understands the term daf’atan
    waḥidātan to be synonymous with the aforementioned jumlah wādah, for both the
    manifestation of the divine essence and within the recipient of the Qur’anic revelation,
    that is Muhammad. Taking the correspondences further, it can also be said that
    the first part of the hadith denotes the revelation of which tells of the Qur’ān
    was revealed to Muhammad. By contrast, the second part of the hadith, which tells
    of the Qur’ān in ‘divised-up verses’ (āyāt maqta‘ī), denotes the manifestation
    of the differentiated divine names and attributes within Muhammad (or the Perfect
    Human more generally). The correspondence between this idea and the point Al-Jili
    made earlier in the chapter is indicated by his use of the term athār, a term
    that we have already come across (along with synonyms, in the Ibn ‘Arabian lexicon,
    aḥām and rusum) in the context of Al-Jili’s description of the physical effect
    that the manifestation of the divine names and attributes had on the body of Muhammad.
    The correspondence is further reinforced by Al-Jili’s reference to the ‘taraqqī’
    of the recipient of this Qur’anic revelation, a notion that we see in his discussion
    of the revelation of al-Quran al-hakim, the form of revelation that represents
    the manifestations of the divine names and attributes. While the first part of
    the hadith denotes al-Qurān al-karim, therefore the second part denotes that of
    al-Qurān al-hakim.


