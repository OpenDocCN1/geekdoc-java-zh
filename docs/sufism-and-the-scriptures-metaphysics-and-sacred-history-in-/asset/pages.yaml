    More generally, it can be said that al-Jilī’s notion is that there are different
    levels of knowledge – and therefore different levels of knowledge – reflects the
    hierarchical and elitist conception of knowledge and society that was widespread
    in pre-modern Islamic thought, not only among Sufis, but also among Muslim judges,
    theologians and philosophers.¹¹⁵ many of whom – including the aforementioned Ibn
    Rusd – also outlined threefold hierarchies of ‘knowers’¹¹⁶ In al-Jilī’s case,
