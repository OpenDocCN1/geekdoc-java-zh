    see S. Al-Hakim, Al-Muʿjam al-sūfī: al-ḥikmah fi ḥudūd al-kalimah (Dandarah li-atab‘wa-al-nashr,
    1981).


    17. See G. Lipton, Rethinking IbnʿArabi (New York: Oxford University Press, 2018),
