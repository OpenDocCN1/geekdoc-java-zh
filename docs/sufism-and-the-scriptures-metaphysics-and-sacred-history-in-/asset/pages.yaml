  md: '# Sufism and the Scriptures


    This gap is a source of regret, not only because of the intrinsic interest of
    al-Jili’s treatment of the scriptures, the insight that these chapters give into
    his wider Ibn ‘Arabian Sufi metaphysics, and al-Jili’s general significance within
    the history of Sufi thought,¹ but because they raise issues of relevance both
    to the history of Sufi and Ibn ‘Arabian Sufi metaphysics, and as already indicated,
    to topics in the study of Islam and Islamic thought: specifically, Islamic ideas
    about scripture, prophethood and sacred history, and who Muslims historically
    thought about the relationship between Islam and other religions at an abstract,
    theoretical level (as opposed to the level of day-to-day lived experience). Connected
    to that point, these chapters are also of relevance to an important issue in the
    study of Ibn ‘Arabian Sufi thought, namely, the question of the stance that Ibn
    ‘Arabian Sufis – al-Jili – have taken other religions. As we see, a notable feature
    of much modern writing on Ibn ‘Arabian Sufism – Sufism much more – is the emphasis
    on the more inclusivist or pluralistic stance by thinkers in the intellectual
    tradition toward non-Muslims and their religions.¹² The chapters of al-Insān kāmil
    on the scriptures shed some light on the thought of al-Jili and the Ibn ‘Arabian
    Sufis, and so, I argue, that it ought to be somewhat modified.


    In light of the significance of these chapters, therefore, and in the absence
    of focused scholars on them, the present book undertakes to present and analyze
    this key section of al-Jili’s major work.³ I undertake a close reading of the
    chapters of al-Jili’s ideas, and to so, as far as possible, reading the internal
    logic of al-Jili’s ideas, and of what his views were or to have been, or imposing
    our own preconceptions or an artificial coherence to the text.¹⁴ In this close
    reading approach, I pay particular attention to the key terms that he uses, the
    concepts that those terms denote, the particular concepts that al-Jili has of
    concepts and the way in which he arranges them into particular patterns or groups
    of terms that together make up a coherent text. I attempt to identify the key
    terms and groups of terms that form the building blocks of his conception of both
    the individual scriptures, and of sacred history as a work, and so to elucidate
    the key features of that conception, while the keeping sight flow of his reasoning.
    Although this method can, be be useful and particularly applicable to the writing
    and thought of al-Jili, in addition to his immersion in the Arabic vocabulary
    of the Qurān, kalam and falsafa, Su‘ād al-Hākin has the ‘new language’ (lughah
    jadidah) of Ibn ‘Arabi and his interpreters.¹⁵ Furthermore, I supplement this
    close reading with a history of ideas perspective, reading al-Jili’s text against
    the background of Sufi and other widely held Islamic conceptions of sacred history,
    particularly what I call the ‘Qurān-centred view of sacred history’.¹⁶ This is
    intended to allow us both to consider the originality of al-Jili’s ideas about
    the scriptures, prophets and religions and to enter broader debates regarding
    Ibn ‘Arabian Sufi views on sacred history and other religions and their supposedly
    pluralistic nature.'
