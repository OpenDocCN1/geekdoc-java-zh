    This effect neither cut nor does cease, rather the servant continues (taraqin)
    in such a manner, and the Real continues with the manifestation (tajallin), in
    which there is no way of exhausting that...


    We have so far seen, in al-Jili’s view, God’s sending down of the Qur’an to Muhammad
    constitutes the manifestation of His unqualified oneness with the Prophet. The
    Qur’an, therefore, represents the comprehensiveness, simplicity and unity of the
    divine essence at the level of al-‘abadiyyah. In this section, al-Jili elaborates
    upon this idea and introduces a new element into his conception of the Qur’an,
    namely, the revelation of the Qur’an constitutes the manifestation of the differentiated
    attributes, in addition to the manifestation of the comprehensive, simple essence.


    These two aspects of the Quranic revelation are represented, as al-Jili sees it,
    in the different names by which the Qur’an is known, al-Qur’an al-karim and al-Qur’an
    al-hakim. Both of these are names that the Qur’an assigns to itself, hence al-Jili’s
    discussion here here as a Sufi metaphysical exegesis of those traditional Quranic
    terms. The adjectives karim and hakim, it should also be noted, are among the
    attributes that the Qur’an assigns to God, meaning that the Qur’an (in its own
    self-understanding) ‘reflects the attributes of the one who is sent down,’ a notion
    that supports al-Jili’s conception of revelation as the self-manifestation of
    God. Let us look, then, how he integrates each of these names of the Qur’an into
    that conception.'
