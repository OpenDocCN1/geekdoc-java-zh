  md: '# Introduction


    ‘Abd-Karim al-Jīli’s (d. 811/1408) al-Insān al-kāmil fi maʿrifat al-awākhir wa-awāil
    (The Perfect Human in the Knowledge of the Last and First Things) is one of the
    most important and influential works of Sufi metaphysics in the tradition of Ibn
    ‘Āabi (d. 638/1240). The latter was perhaps the most widely discussed Sufi thinker
    of age, and al-Jīli, who lived two centuries after the famous Andalusian Sufi
    thinker, is generally acknowledged as one of his most independent and thoughtful
    followers, and al-Insān al-kāmil his most important and widely read work. As its
    title al-Jīli’s book is principally concerned with the ybn ‘Arabian idea of the
    ‘Perfect Human (al-insān al-kāmil), and within it he develops this idea in an
    original and highly influential way. Yet it would be a mistake to imagine that
    the book is solely concerned with the Perfect Human, and that al-Jīli’s contribution
    to the history of ideas was limited to his elaboration of that. In fact, al-Insān
    al-kāmil is a comprehensive medium of Ibn ‘Arabian Sufi doctrine – a remarkably
    clear, connected and profound expression of Suf – would come to be used by Sufi
    orders across the Islamic world as one of the key ‘mediating works’ in intellectual
    tradition, introducing Sufi to the Ibn ‘Arabian Sufi world in a relatively comprehensible
    and systematic fashion.


    Among the topics treated with some length in al-Insān al-kāmil is the issue of
    the key in Islamic topic. This issue is discussed in full chapters thirty-four
    to thirty-eight of the text, which are devoted to the scriptures widely recognized
    in Islam: the Qur’ān (al-Qurān) also called the Furgan [al-Furqān]), the Torah
    (al-Tawrāh), the Psalms (al-Zabūr), and the Gospel (al-Injīl). Despite their importance
    within al-Jīli’s work, these chapters – and therefore al-Jīli’s treatment of sacred
    history – remain little known or discussed, both in academic scholarship on Ibn
    ‘Arabian thought and on Sufism and Islam. They were not included in Titus Buchardt’s
    partial 1952 translation nor in the translated extracts from al-Insān al-kāmil
    in French, Le thượng of al-Jīli’s book was presented by Margaret Smith in her
    anthology of Sufi literature, nor in the French translation of a chapter of al-Insān
    al-kāmil included by the scholar of Shī’a and Sufi thought Henry Corbin in his
    *Terre céleste et corps de réurrection, de l’Iran mādzen à l’Iran shīte* (1960).
    Nor do they make an appearance in Muhammad Iqbal’s presentation of al-Jīli’s book,
    based on his reading of al-Insān al-kāmil, in his major work *The Development
    of Metaphysics in Persia* (1908). The first introduction to the chapters on the
    scriptures, in fact, remains the few pages devoted by the great Cambridge orientalist
    R. A. Nicholson in his seminal studies *Islamic Mysticism* (1921), which was first
    published a century ago.'
