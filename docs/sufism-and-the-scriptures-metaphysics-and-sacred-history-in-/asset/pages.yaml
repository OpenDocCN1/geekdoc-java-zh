  md: 'Throughout this chapter, we have seen how al-Jili refers to the two aspects
    of the Qur’an using a number of different names. Before concluding, let us briefly
    consider one final name of the Qur’an that fits into this twofold concept, namely
    the Furgan (al-Furqān), to which al-Jili in fact does a separate chapter of al-Insān-al-kāmil
    (thirty-five). From a root connecting separation and distinction, the term al-furan
    is used in the Qur’an in various ways: sometimes it denotes the Qur’an itself
    (see e.g. Q. 25.01, 2,185), sometimes it denotes the Torah (which apparently refers
    to that distinguishes the saved community of believers from the unbelievers (see
    e.g. Q 8.41, while by others, according to the dominant interpretation, it refers
    to the battle of Badr).¹¹² These interpretations are related, they all connect
    that which distinguishes truth from falsehood.¹¹³ Al-Furqān was commonly held
    to be one of the most significant names of the Qur’an.¹¹⁴ As, it does not come
    as a surprise that the al-Jili displays considerable interest in the name he refers.


    Al-Jili’s understanding of the name, and how it fits into his notion of the two
    aspects of the Qur’an, emerges from the opening of chapter thirty-five. He opens
    the chapter with a poem, which begins: ‘The attributes of God (sifāt Allah) are
    a furgan, while the essence of God (dhāt Allah) is a qur’an.’¹¹⁵ He explains this
    on the opening lines of the section that follows them:


    Know that the Qur’an is an expression of the name and attributes (‘ibārah al-asmā’
    wa-sifāt), in their different varieties (‘alá ikhtilāf tanawwu‘ih). From its perspective,
    every attribute and name is distinguished (tamamayazz) from others, so distinction
    (al-farq) occurs in the self of the Real, with respect to His most beautiful names
    and His attributes.¹¹⁶


    He goes on to detail how the divine names and attributes are different from one
    another, and related to this, how some are better than others. While the details
    of these distinctions and hierarchies do not concern us here, it is clear from
    this that the name al-Qurān corresponds with those names of the Qur that point
    to God’s names and attributes, that is, al-Qurān-al-hakim and al-sab’al-mathānī,
