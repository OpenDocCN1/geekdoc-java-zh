  md: '# 40


    # Sufism and the Scriptures


    Al-Jili’s quotation of that in the present passage serves to bring us back from
    the discussion of Muhammad’s nature to the consideration of the revelation of
    the Qur’an, to which this chapter is ostensibly devoted. More specifically, it
    indicates that, as suggested, these two topics are in fact interrelated, for Muhammad
    being a locus of manifestation for the unqualified oneness of God in his body
    and ipesity, and clearly indicates something significant about the relationship
    between Muhammad and the Qur’an. Al-Jili’s conception of the nature of this relationship
    can be expressed in the following way: if the Qur’an, as is indicated at the beginning
    of the chapter, is an expression of al-dhāt and al-ahadiyyah, and if Muhammad’s
    body and ipesity are loci of manifestation for identical to al-dhāt, then it would
    serve to follow that Muhammad and the Qur’an are somewhat identical, for both
    manifest the same levels of divine existence.


    Again, this idea, as it may seem, may in fact be taken as a Sufi metaphysical
    elaboration of a motif found within Islamic tradition. Responding to a question
    about the Prophet’s character, Muhammad’s wife Aisha is believed to have said,
    ‘His character was the Qur’an (khuluqha)’⁸ a statement that the Qur’anic connects
    to Qur’an 68:4: And truly you [i.e. Muhammad] have a great character (khuluq ‘azīm)’⁸⁹
    This tradition is found in Sufi literature,¹⁰ and is suggesting here, that al-Jili
    and in more explicit terms says: ‘It is if the Qur’an, he writes, ‘had taken on
    a lively form under the name of Muhammad by b. Allah...’ One who has not lived
    to see him, contemplate the Qur’an for there is no difference between the act
    of contending it and the act of contending the Envoy of God.’¹¹ While Al-Jili
    does not explicitly say the saying of Aisha here, he quotes it in al-Kamālāt al-ilāhiyyah
    to similar effect as Ibn ‘Arabī: Aisha’s statement, says, ‘al-tahaqquq bi-al-kamāl
    al-ilāhiyyah), because the Qur’an is simply an expression of the perfections of
    God.’¹² Al-Jili is inviting the reader to draw the same conclusion in the perfect
    of al-Insān al-kāmil under discussion, that Muhammad, as the recipient of the
    divine revelation/manifestation is himself a locus of divine manifestation, which
    is to say that he is the Perfect Human.


    All of this reflects Al-Jili’s more general Sufi metaphysical conception of revelation
    as a phenomenon that allows the levels of existence, the scriptures and human
    beings (specifically, the prophets or Perfect Humans). Each of these three categories,
    as loci of the divine manifestation, corresponds existentially with each of the
    others. The relevance of this key principle for our inquiry into Al-Jili’s views
    on sacred history is that it allows us to construct a series of hierarchies of
    the levels of existence, scriptures and prophets. At the top of these hierarchies
    stand, respectively, al-ahadiyyah, the first and last qualified form of divine
    manifestation: the Qur’an, the scripture that expresses the divine essence in
    the most complete way; and Muhammad, the prophet or Perfect Human who, in his
    body, identity and essence, receives the most complete form of divine manifestation.'
