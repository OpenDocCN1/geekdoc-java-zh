    (kalimah) of each prophet represents a different type of wisdom (hikmah); for
    example, the divine wisdom (ilāhiyyah) in the case of Adam, transcendence (alawiyyah)
    in the case of Moses and singularity (fardiyyah) in the case of Muhammad. When
    Ibn ‘Arabī not fully bring into the implications of this idea for the hierarchy
    of prophecy, nevertheless such here in the background: the singularity of Muhammad,
    for, reflects his status as the best of prophets and ‘most perfect’ (akmal) Al-Jili,
    in his role as an expander and elaborator of Ibn ‘Arabī’s wisdom, states this
    more explicitly: the Qur’an is not best of scriptures, because Muhammad is the
