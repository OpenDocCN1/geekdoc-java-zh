    Know that the Qur’an is an expression of the essence (al-dhāt), in which all of
    the attributes disappear (yadmahill). For it [i.e. the essence] is the locus of
    manifestation (al-majlá) that is called ‘unqualified oneness’ (al-ahādiyyah).⁴


    Al-Jili begins the prose section of the chapter on the Qur’an with a clear statement
    of Ibn ‘ʿArabī, Sufi metaphysical meaning of the scripture. The Qur’an, he tells
    us here, corresponds to the simple divine essence (al-dhāt al-mahd/al-sadīḥ) in
    its state of not being qualified by names or attributes. In the opening poem that
    immediately precedes this line, he calls the Qur’an ‘a simple essence (dhāt mahd).’⁵
    The Qur’an, in other words, is a part of God, and the essential part at that.
    While al-Jili does not use the term here, he implies that the Qur’an is uncreated,
    in keeping with the Sunni view. Whereas Sunni doctrine holds that the Qur’an is
    identical with one of God’s attributes – namely, God’s speech (kalām Allah)– al-Jili,
    from Sufi metaphysical perspective, further identifies it with the very essence
    of God. The implication of this identification is that, with the revelation of
    the Qur’an, in fact revealed His essence within the created world. As we shall
    see, what al-Jili seems to believe, in apparent contradiction of the conventional
    theological view, found also in Sufi thought, that the divine essence is revealed
    and unknowable.⁶


    However, al-Jili also indicates that, when he calls the Qur’an an expression of
    the essence, he does not mean the hidden, utterly magnificent aspect of the essence,
    but rather the ‘locus of manifestation’ (majlá) (al-ahādiyyah).⁷ The term majlá
    itself marks a martabah (in marātib al-wujūd), that is one of al-Jili’s forty
    levels of existence. As we saw in Chapter 1, al-Jili presents al-ahādiyyah in
    al-Insān al-kāmil as the third level of existence, it is in fact as he indicates
    in the lower Marātib al-wujūd – the second level in terms of being unqualified
    and unlimited; it is to the level of absolute existence (al-muqlā), that is, the
    all-encompassing, utterly unqualified and unlimited existence of the divine essence.⁸
    Above it is the inner, totally hidden aspect of the essence, and what he calls,
    others name, ‘the absolute’ (al-ghayab al-mutlaq) and the ‘quiddity of the true
    nature of essence’ (mahiyyat kunt al-dhāt).⁹ Al-ahādiyyah is therefore both the
    level at the essence, as al-Jili notes again here, remains unqualified by any
    names or attributes (which can be said to ‘disappear’) and also the level at which
    the divine existence begins to turn towards phenomenality, and what he calls ‘the
    first of the descents of the essence (awwal tanazzulāt al-dhāt) from the darkness
    of the Cloud into the light of the locus of manifestation.¹⁰


    The Qur’an, as an expression of al-ahādiyyah, therefore, does not represent the
    divine essence in its state of complete and utter hidden, but rather in its outward,
    if unspecified. The hidden aspect of the essence, meanwhile, is represented not
    by the Qur’an, but, as he tells us in thirty-three, of the Mother of the Book
    (umm al-kitāb). This makes sense, if we remember, that in the Qur’an-centered
    view of sacred history, the Mother of the Book represents the unveiled heavenly
    archetype of the Qur’an and other scriptures, while the Qur’an is of revealed
    in the phenomenal world. Even though the Qur’an represents the unqualified, simple'
