    ## 亚特兰蒂斯（ATLANTIS）。

    一万千年前的战士之都


    ![](img/957198bfa35231bee9422ba8d437a087_31_0.png)


    那是我们来的地方。从未想过我会看到它。


    外星人在大约两万年前创造了人类的基因组。


    但这个地方——亚特兰蒂斯，是遗传学家合成以释放我们真实潜力的地方。


    嗯，我在亚特兰蒂斯长大的，在祭司领主的统治下。他们是一群疯狂的狂热分子。


    但他们总是说这个岛是神圣之地。


    “这一点我想他们是对的。看看下面的人，他们刚刚开始意识到自己可以成为什么”在我们的时代并非如此。自从传送门开启，呃，布莱克闪电（Black Bolt）？守住回到现在的传送门，读者，我我接近宫殿时，准备好快速撤离。


    这些人是我们的祖先，不是我们的敌人。无论如何，这都是荣誉之过。他们应该为我们帮助。预料到麻烦吗？但他们不是这里唯一的危险。不是吗。


