    # 他们降临地球；他们改变了世界。现在，黑闪电与不人类将展现异能！


    当美杜莎女王与人类火人燃起新恋时，这位沉默之王还能保持安静吗？抑或局势将爆发一场关于声音、愤怒与火焰的战斗？——乔尼·斯托并不是加入不人类事业的唯一新成员——X猛战队的野兽也站在了他们的一边！在面对历史上最危险的反派：征服者康时，他们将需要一切可能的帮助。康的战场跨越了数千年，他将以一种极其恐怖的方式攻击不人类。康在数千年前迈出的哪一步，将在现在造成毁灭性的破坏——而哪一个不人类会与他联手？


    收录《异能不人类》#0-4话，以及来自《2015年免费漫画书日（复仇者联盟）》#1的额外内容——由 CHARLES SOULE 编剧，STEVE MCNIVEN
