    ……检查。


    这个地方的人口每公里五万人。


    云朵飘过，它们很快就会……


    新阿提兰。


    你为什么在这里，黑尔特？


    我曾说过吗？关于阿提兰的陨落。


    你拥有统治的权利，我的丈夫。


    我对吗？


    我是否能看到我们的儿子？


