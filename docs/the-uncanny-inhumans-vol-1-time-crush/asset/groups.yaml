    # THEY FELL TO EARTH; THEY CHANGED THE WORLD. NOW, BLACK BOLT AND THE INHUMANS
    GET UNCANNY!


    CAN THE SILENT KING STAY QUI when Queen Medusa finds new love with the Human Torch?
    Or will the situation erupt in a battle of sound and fury and fire? – Johnny Storm
    isn’t the only new recruit to the Inhuman cause – the X-Men’s Beast is on their
    side! They’ll need all the help they get when they face the most dangerous villain
    throughout history: Kang the Conqueror! Kang’s battleground covers thousands of
    years, and he’ll attack the Inhumans in a horrifying fashion. What move will Kang
    make, millennia ago, will wreak havoc in the present – and which Inhuman will
    work with him?


