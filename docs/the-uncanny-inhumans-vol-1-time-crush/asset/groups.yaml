    ![](img/957198bfa35231bee9422ba8d437a087_66_6.png)


    ![](img/957198bfa35231bee9422ba8d437a087_67_0.png)


    天哪，谁跟我说话吧！


    消失了，读者。亚特兰蒂斯失落了。这里有成千上万人……


    就是这样。如果我要从时间线上抹除类人类，毫无疑问，我会去那里。那是我们找到康魔的最佳机会——但我们会困在过去。我上次离开门户时差点核平了曼哈顿。我不让那种事再次发生。我把它关在我们身后。读者，带我们回到现在。我每天只有三次机会，而且每次都会变弱。我可以去康魔那里，但在睡觉之前无法把我们带回家。完成了。做吧。


    ![](img/957198bfa35231bee9422ba8d437a087_68_0.png)


    也许吧，麦科伊博士，你觉得……


    ![](img/957198bfa35231bee9422ba8d437a087_68_1.png)


    谁有他？他在哪？


    康魔在哪？


    ![](img/957198bfa35231bee9422ba8d437a087_69_0.png)


    我也看到他了，黑雷神。那是康吗？我不确定。


    ![](img/957198bfa35231bee9422ba8d437a087_69_1.png)


    啊。他在什么……他在做什么？


    ![](img/957198bfa35231bee9422ba8d437a087_70_0.png)


    ![](img/957198bfa35231bee9422ba8d437a087_70_1.png)


    ![](img/957198bfa35231bee9422ba8d437a087_70_2.png)


    终于，你们到了。我等了很久。


    --终于，你们到了。我等了很久，父亲。


    ![](img/957198bfa35231bee9422ba8d437a087_71_0.png)


    很久以前。


    你在好奇这些幻影。它们是什么，从何处来。我会解释的。


    它们是我灵魂的碎片。当我第一次从时间线中出现时，我只能产生一个。那是很久以前的事。


    现在，我有我的儿子，我自己的王国。我唯一拥有的，或需要的王国。我很高兴你们都来了。这里有伟大的美杜莎，再次见到你太棒了，母亲。特里同，尽管沙漠不适合鱼。当然，他们是炮灰。我想知道他们是否知道自己是什么身份。


    ![](img/957198bfa35231bee9422ba8d437a087_73_0.png)


    ![](img/957198bfa35231bee9422ba8d437a087_73_1.png)


    ![](img/957198bfa35231bee9422ba8d437a087_73_2.png)


    ![](img/957198bfa35231bee9422ba8d437a087_73_3.png)


    阿胡拉！求了！让我们聊聊！


    噢，母亲。距离上次听到你的声音已经一百九十年了。我记得……摇篮曲。你给我的歌。因为父亲把我抛给了康魔，当然再也没有摇篮曲了。从那时起只有战鼓。我曾梦见你的声音，美杜莎。但现在……我的梦全是灰烬。


    - 后退，美杜莎！躲开，我会把它们烧掉！

    - 什么--

    - 你想让我--

    - 噢，对。解决掉阿胡拉这一切就结束了。我来。

    - 别担心，黑雷神，我明白。

    - 他还是你的儿子。


    后退，我的皇后。我会拖住他们。母亲不应该战斗自己的儿子。


    感谢特，但遗憾的是阿胡拉并不赞同。我不会站在你这边。


    读者，释放，兽！躲到我身后！


    发生什么了，艾索？


    箭！我会用我的力量把它们击落。


    就躲到我身后！


    ![](img/957198bfa35231bee9422ba8d437a087_77_0.png)


    我不明白！改变了我们上面的压力——让它变得更厚了。这应该挡住所有的箭！这些阿胡拉看起来像是某种精神投影，艾索。他们和他们的武器，可能完全不受普通物理法则的影响。


    你？看？


    百支箭中，也许有五支穿透了。遗憾的是，其中一支击中了我，但你不必对自己太严苛。


    他们还在来吗？


    噢，是的。


    而且我们带回的那些小道具是我们找到征服者康并设法扭转局的唯一希望？


    历史记录和《类人类法典》。是的，也正确。


    那就退后保护好他们。我现在可能不需要视力——但以后可能需要。所以，我会解决掉任何靠近我的东西。艾索，如果从那里能做什么，我将不胜感激。

