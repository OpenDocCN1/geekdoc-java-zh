    黑雷神，系好你的安全带，读者。听我指令。


    我打赌他就在那里。


    听着，我可以读取时空带我们回到过去。如果康魔正在攻击整个类人类种族，那绝对也包括我。他必须被阻止。


    但我完全不知道该去哪里，或者……到底什么时候去。


    我或许能帮上忙。康魔正在做的其实非常微妙——甚至是胆无忌惮。


    在保持其他部分完整的同时抹除时间线上的特定部分……极其困难。你几乎不得不承认这一点。


    不，你真的没必要承认。如果你能帮忙，就告诉我。


    我对人类历史的了解还不足以自己独立完成，但假设一下，如果我们能锁定过去康魔最有可能行动的地点……


    我们可以做到的。我们可以利用《类人类法典》（Inhuman Codex）隔离出康魔针对的基因链，还有另一个设备……我们之前误认了。它可以窥视过去。


    如果我有这两样东西，我信配合麦科伊博士的，一定能找出去哪里。


    我们可以先到达那里。


    极棒的主意，艾索！艾索！现在，东西在哪儿？


    啊……


    ……在外面。


    不，黑雷神，你做不到，我也一样。我们几乎确定是康魔的首要目标。


    据我们所知，如果我们中任何一个离开这个气泡，会立即消失。


    我可以去。我不是类人类。我不可能是康魔计划的一部分。


    虽然风暴先生的逻辑中存在缺陷，但他可能仍是我们最好的希望。但我可以去——我需要留在这里维持防御。


    谢谢你，乔尼。现在，我会叫两个人类在九层中厅和你汇合，带上你需要的物品。


    康魔可能还没意识到它们的存在。他们可能有更多时间。


    ![](img/957198bfa35231bee9422ba8d437a087_64_0.png)


    ![](img/957198bfa35231bee9422ba8d437a087_64_1.png)


    嘿，炼狱，格里德，自孟买之后没见过你们了。


    发生怎么了，乔尼？美杜莎听起来很担心。她从不显得担心。


    一路上我会告诉你。


    在路上？我们要去某个地方吗？


    是的。我不会抛下朋友不顾。


    抛下？抛下我们为了什么？


    有些坏事，但别担心。我会搞定的。


    你不会有任何事发生在你身上的。


    乔尼！你赶到了。感谢瑞恩斯，但格里德……炼狱……


    ## 北大西洋。

    1942年


    ![](img/957198bfa35231bee9422ba8d437a087_66_0.png)


    快点，艾索？


    我正在努力！这非常复杂。


    随她去吧，特里同。艾索很才华横溢。无论你还是我，都得比她更出色了。


    ![](img/957198bfa35231bee9422ba8d437a087_66_1.png)


    ![](img/957198bfa35231bee9422ba8d437a087_66_2.png)


    好了，康。完成了。最后一个。我给了给了你想要的。


    ![](img/957198bfa35231bee9422ba8d437a087_66_3.png)


    是的，我的儿子，你已经完成了我要求的一切。现在……我将，成全你的愿望。


    ![](img/957198bfa35231bee9422ba8d437a087_66_4.png)


