    ## 欣赏这段由艾索（ISO）和弗林特（FLINT）主演的额外故事！


    我应该几分钟内就能让它恢复正常。


    随了，那是人类科技。你不能随随便便就“修理”人类科技，你才当了几个月的“人类”。


    不管是不是人类，它都只是一台机器。我懂机器。


    噢，就这么简单吗？


    我在农场里长大的。书很匮乏。我拥有的只有机器。那是我研究的东西。


    如果你能让那玩意儿运转起来，你就是个天才，但如果你没修好呢？你你知道传送门另一端是什么吗？


    那么，为什么你脸上不再有那些蓝色的东西了？


    我想等我把它修好时就知道了。现在，把螺丝刀给我。


    噢，你是说这些吗？当我使用力量时，它们仍然在这里。我上一次使用它们时，场面相当激烈，等结束后它们就消失了。


    嗯……好吧，我很高兴它们还在。我喜欢它们。它们很漂亮。


    真希望这些石头能从我脸上消失，这样我就能重新融入现实世界了。


    也许你可以的。你的特长就是能控制石头，对吧？你为什么不能控制你脸上的那些呢？


    试试看。像你使用力量时那样集中注意力。


    不行。


    也许是你想太多了？我的变化是在我没察觉的情况下发生的。


    你会拉下那个拉杆吗？


    来了——


    什么——


    ![](img/957198bfa35231bee9422ba8d437a087_128_0.png)


    把它关掉！快把它关掉，杰森！


    不！


    我们复仇的时刻到了！伟大的卡尔登王（KALDEN）在2000年前放逐了我们，从那时起我们每天都在为传送门再次开启的那一天做准备！


    奥登（ORDON）！抓住那个女孩！我们将获得复仇！


    ![](img/957198bfa35231bee9422ba8d437a087_128_1.png)


    再见，斯纳克（SNARKLIE）。我从没喜欢过。


    别动，戈登（GORDON）。


    噢，我就呆在这儿。


    真冷酷。


    极其冷酷。


    我去传送门。你去搞那个混蛋。


    不……


    现在再等一下——


    粉碎


    别难过，斯纳克。我们在新阿提兰（ATTILAN）的监狱会去看你的。


    嘿……我的脸……


    你进化了。


    我会想念你的石头的。


    # 完。


    ## 后续还有……


    ## ……今年的《惊奇人类》（UNCANNY INHUMANS）中


    在灭霸之前，否则我会把你的心盛在盘子里呈给你！


    你将遭受前所未有的痛苦，直到我——


    不错，你变得越来越精准了。


    ## 新阿提兰。


    现在，真正的灭霸会拿走那块石头喂给你，连同这个房间里的每一个人。


    谢谢你的鼓励，戈登。


    你没抓到重点，弗林。你们中几个人无法控制这么小的石头。现在你正在制造一个强大的攻击。


    造出那个只是运气。这些东西对我来说正处于边缘。很滑手，但石头越小，就越难处理。


    这听起来怎么样，戈登？


    我告诉你，当我第一次走出舱室时，我用这双腿花了一周时间才正常走路。


    但一旦我掌握了它，并第一次尝试我的声波武器——我们都像弗林特一样。


    生活就是变化。


    咚，咚。


    抱歉打断训练，但我们有目标了。我需要杰森。


    当然了，探员，他完全归你了。太极了。嘿，小子，在所有人之中……我是说，美杜莎（MEDUSA）前段时间从奥克兰那一个非常糟糕的境地里救了你。你要报之以报，懂吧？


    我喜欢那部电影！


    别担心弗林特，我的变化是在我没察觉的情况下发生的。那是电影的。


    噢，娜雅（NAJA），那是。


    天哪，娜雅（NAJA），快点。


    我不知道是不是这个，我希望是如此。


    谢谢你的感激，戈登。


    你没抓到重点，弗林。你们中几个人无法控制这么小的石头。现在你正在制造一个强大的攻击。


