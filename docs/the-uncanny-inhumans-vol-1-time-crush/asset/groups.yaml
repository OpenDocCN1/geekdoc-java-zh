    # 约翰！


    ![](img/957198bfa35231bee9422ba8d437a087_86_3.png)


    ![](img/957198bfa35231bee9422ba8d437a087_86_4.png)


    够了。


    那到底是什么鬼？听起来像是核弹爆炸了一样。


    你是少数几个听过黑闪之语的幸运儿之一。


    哈？那个倒霉蛋受害者到底是谁？


    实际上，是约翰·风暴。


    好吧，不能说我没预料到这个。


    够了！


    不！看起来像是阿胡拉通过某种方式附身了他。黑闪只是在保护我们！那个火炬人是想把我们全部活活了。


    黑闪的某些攻击一定通过回回阿胡拉的链接传了过去。他们被击晕了。


    阿胡拉正在重新集结。我们需要找一个可以防御的地方。


    在哪儿？这里什么都没有。


    好吧，让我们来瞧吧。


    城堡


    轰。

    一座堡垒，

    按定制。


    我看不见它。

    但我猜它

    看起来很奇怪。比应该的

    要小。这是

    我今天读的第二次了，

    所以强度只有的一半。

    我很抱歉。


    不。这比什么都没有

    好无限倍。读者，

    它提供了一个机会。

    谢谢你。


    母亲...

    父亲...


    我觉得...


    是时候谈谈了。


    ![](img/957198bfa35231bee9422ba8d437a087_89_0.png)


    ![](img/957198bfa35231bee9422ba8d437a087_89_1.png)


    ![](img/957198bfa35231bee9422ba8d437a087_89_2.png)


    ![](img/957198bfa35231bee9422ba8d437a087_89_3.png)


    ![](img/957198bfa35231bee9422ba8d437a087_89_4.png)


    我的儿子，康征对你做了什么？


    ![](img/957198bfa35231bee9422ba8d437a087_90_0.png)


    > 什么也没有，母亲。

    都是我做的，都是我做的。


    > 康征训练我打仗。我们一起穿梭于不同的时间线，他给我布置任务。战斗。


    > 我按照他的要求去做。我赢得了所有的胜利。他是我的守护者，我的老师，我的父亲。


    > 我不是傻瓜。我很快就明白他在做什么。从时间流中抹除人类族。


    ![](img/957198bfa35231bee9422ba8d437a087_90_1.png)


    > 当这一切完成后，我杀杀了康征，并将他的时间据为己有。这是故意的。


    我本可以在任何地方找到你，但我决定在这里等了无数年，因为我知道如果你找到我，你会看到我最好的状态。看看康征把我变成了什么样，带着你的能力！看看我。我是征服者，我有话要说。你没看到吗？


    ![](img/957198bfa35231bee9422ba8d437a087_91_0.png)


    告诉我你看到了什么！


    ![](img/957198bfa35231bee9422ba8d437a087_91_1.png)


    ![](img/957198bfa35231bee9422ba8d437a087_91_2.png)


    ![](img/957198bfa35231bee9422ba8d437a087_91_3.png)


    我的儿子。


    ![](img/957198bfa35231bee9422ba8d437a087_92_0.png)


    来吧，你们所有人。


    我们需要拯救阿胡拉。


    # 失落的人类城市阿提兰。


    一万三年前。


    停在那儿！再过来一点，否则我们将被迫攻击。


    你是阿提兰的朋友还是敌人？


    都不是。我是征服者康。带我去。


    你们有我的人民之一吗？他们进入茧化了吗？我的实验室之外没有灵矿，而我授权了转化。这不可能。


    哼。我能感觉到你在攻击我的大脑，兰达克。你将会倒台。你的精神能力我很熟悉。这符合我的目的。这是阿胡拉，一个来自未来的人类。他我的父亲，另一个人类国王，黑闪，将阿胡拉暴露在灵矿雾中，并要求我使用时间转移技术将他带到这里，给你。他从茧化中出来时将拥有新的能力，但转化是完全不可预测的。他可能是任何样子。无论这个孩子来自哪个时代，所有人类都是我的人民。不，阿胡拉是我的财产。达成了一个协议。这样做是为了拯救孩子的生命并将他带到这里。征服者不守言。但一旦我们理解阿胡拉变成了什么，你已经给了他所需的帮助和训练。我会带他离开。


    我对他有用途。走着吧，康。我不久前才发现灵矿对人类的影响。我还有很多要学习的。你可能认为你拥有这个人，但即使在研究的早期阶段，有一个概念非常清晰：转化改变一切。阿提兰是我的王国，我决定这里发生什么。也许吧，但我怀疑阿胡拉急于离开人类遗产。他一可以就会离开。如果你不相信我，兰达克……去问他吧。


    什……什么？发生了什么？父亲？你的父亲是黑闪吗，孩子？是的，但是……他刚刚在这里。不在。你在茧化期间被独立移动了。你的父亲把你托付给了别人——这个男人康。这听起来可能吗？是的。是的，可能。但你是谁？我在哪？这个地方叫阿提兰，我是兰达克，这里的国王。


    兰达克？


    发现了灵矿。你是伟大的基因学家。你创造了现在这样的人类。然而我所处的位置，仅仅是一个科学家。告诉我，阿胡拉——你那个时代的人类是什么样的？我很乐知道我们的种族变成了什么样。我——不，时间线是脆弱的，预知的影响可能是毁灭性的。但你不断在调整时间线，我见过你这么做！是的，因为我是康。很好，我想知道我们的人民存活就足够了。阿胡拉，告诉我——你经历了灵矿转化，感觉如何？你对自己的新能力可能是什么样的感觉吗？……我不确定。我感觉——


    哼，当然了。留在这里，这不会很久的。


    ![](img/957198bfa35231bee9422ba8d437a087_99_0.png)


    如此如此。


    那什么鬼？！


    唔！


    你就这样走了。简直天才了。


    沉默之王康不守信。


