    # END TIMES


    # RIO DE JANEIRO, BRAZIL.


    "ALL RIGHT, BOYS..."


    ![](img/957198bfa35231bee9422ba8d437a087_7_0.png)


    ...EASY PICINS.


    CHECK EVERYTHING. THIS PLACE HAS A POPULATION DENSITY SOMETHING LIKE FIFTY THOUSAND
    PEOPLE PER KILOMETER.


    LEFT A BUNCH OF CLOUDS, BUT HURRY—THE SLUM SCUM''LL BE BACK SOON AS THE MISTS
    BLOW THROUGH.


    YOU GOT IT, BOSS.


    > ALÔ?

    > ANYONE HERE? (TRANSLATED FROM PORTUGUESE):

    > OH...


    DAMN, I HATE WHEN ONE GOES BAD LIKE FLUSHING MONEY DOWN THE DRAIN. WE JUST FOUND
    A WHOLE FAMILY, AND WE''VE BARELY STARTED LOOKING. LIFE WILL PAY US FOUR HUNDRED
    FOR AN''S WORK. YOU NEED TO COUNT THEM. YOU KNOW ANYWAY, WE NEED HURRY. WE HAVE
    TO GET THEM IN STASIS BEFORE THEY EMGE FROM THE CLOUDS. GOD KNOWS WE''LL BE DEALING
    WITH THEM. YOU KNOW, YOU''RE RIGHT. I SUPPOSE THINGS COULD ALWAYS BE-


    --WORSE.


    > ON ME! NOW! TROUBLE!


    # NEW ATTILAN.


    > WHAT ARE YOU DOING HERE?


    ![](img/957198bfa35231bee9422ba8d437a087_12_0.png)


    WAS I NOT CLEAR THE LAST TIME WE SPOKE?


    YOU HAVE LOST YOUR RIGHT TO RULE, MY HUSBAND.


    AND YOU HAVE LOST YOUR RIGHT TO ME.


    WHY ARE YOU HERE, BLACK BOLT?


    AH, I SEE. AS I RECALL, WHEN THAT LIGHTS UP, IT MEANS THE WORLD IS ABOUT TO END.


    TELL ME, DID YOU AND YOUR ILLUMINATI FRIENDS CALL IT, OR ARE YOU TRYING TO STOP
    IT? EITHER WAY, THAT DOES''T ANSWER MY-


    AH, I SEE YOU PLAN TO BRING MY LOST SON. YOU CAN NO LONGER PRETEND TO BE A KING.
    SO YOU WISH TO PRETEND YOU ARE FATHER.


    I WOULD GIVE ANYTHING TO SEE OUR SON AGAIN.


    WANT TO REUNITE YOUR PRECIOUS FAMILY, JUST BEFORE IT IS ANNIHILATED.


    YOU DON''T THINK I HAVE BEEN SEARCHING FOR HIM CEASELESSLY SINCE THE FALL OF ATLANTIS?
    I HAVE SENT MY VERY BEST.


    COME, HUSBAND.


    AHURA VANISHED THROUGH ELDRAC''S GATEWAY BEFORE YOU DESTROYED OLD ATTILAN, BLACK
    BOLT.


    I HAVE NOT HEARD FROM HIM SINCE; AND ELDRAC WILL NOT SEND ME TO HIM, NO MATTER
    MANY TIMES I ASK.


    BUT I TRUST HIM, WHEREVER THE GATEWAY SENT OUR SON, IT WAS WHERE HE NEEDED TO
    BE.


    ELDRAC WAS GRIEVOUSLY INJURED IN THE FALL OF ATTILAN, BLACK BOLT, HE BARELY SURVIVED.


    MY HUSBAND WOULD ASK A FAVOR, ELDRAC, WILL YOU HELP HIM?


    DO YOU SUPPOSE HE BLAMES YOU FOR THAT?


    I WONDER, MY LOVE...


    ...WHERE DOES ELDRAC THINK YOU NEED TO BE?


    I GET IT? BUT I THINK... YOU MAY NOT GET HIM... ENOUGH.


    LET''S KNOCK THIS BASTARD DOWN.


    # TUNGUSKA, SIBERIA.

    1908.


    # KANG


    > YOU HAVE DAMAGED MY FORTRESS QUITE ENOUGH, BLACK BOLT.


    > YOU SPEAK AGAIN, I WILL DIVERT THE ENERGY TO THE MOMENT OF YOUR BIRTH.


    > NEXT TIME, JUST KNOCK. YOU HAVE BEEN EXPECTED IN THE HOME OF KANG THE CONQUEROR
    FOR SOME TIME NOW.


    YOU KNOW I AM A TIME TRAVELER. THOSE ARCHERS YOU DESTROYED, FOR EXAMPLE—SOME OF
    THE VERY BEST THE 14TH CENTURY HAD TO OFFER.


    THE TIMESTREAM HOLDS FEW SECRETS FROM ME.


    SEE IT HERE ABOVE US, LAID BARE, SUBJECT TO MY MASTERY, AND YET, EVEN KANG THE
    CONQUEROR FINDS PUZZLED.


    FOR SUDDENLY... THERE IS NO FUTURE.


    THE MOMENT OF REBIRTH GROWS VERY NEAR. I THOUGHT PERHAPS I MIGHT SEE YOU, OR YOUR
    BRIDE, BEFORE IT ALL ENDS. I HAVE HOPED SO IT GIVES ME THE CHANCE TO OBSERVE A
    MOMENT THAT EVEN I, WITH EVERYTHING I HAVE EXPERIENCED THROUT THE EONS, MIGHT
    FIND INTERESTING.


    SO LET US SEE.


    AHURA YOUR FATHER IS HERE.


    I NO FATHER.


    THIS MAN DESTROYED MY HOME, AND HE SENT ME AWAY TO THE FORTRESS OF KANG THE CONQUEROR—ONE
    OF THE DEADLIEST, MOST POWERFUL ENEMIES ATTILAN HAS EVER FACED.


    I ASSUMED IT WAS A TEST, PERHAPS EVEN A SECRET PLAN FROM THE INTRICATE MIND OF
    THE GREAT BLACKAGAR BOLTAGON.


    I TOOK MY PLACE AS HOSTAGE, LEARNED WHAT I COULD, AND PREPARED FOR THE DAY THAT
    MY FATHER WOULD CALL ME INTO ACTION.


    BUT IT NEVER CAME, DID IT? THERE WAS NO PLAN.


    I DO NOT KNOW THIS MAN. DO YOU WISH WITH HIM.

    '
