  mdcn: "\n\n## JAVA 15: 关于 JAVAFX 的更多内容：软件开发\n\n### 10.3 绘制坐标轴\n\n本次迭代涉及绘制坐标系的轴，因此将接下来的两个迭代合并为了一个迭代。通常情况下，绘制坐标轴面临着许多挑战，其中一个原因是它们在窗口大小变化时必须能够良好运行，但\
