  - "[PAGE 147]\n\nJAVA 15: MORE ABOUT JAVFX:\nSOFTWARE DEVELOPMENT\n\n# 6.2 A CANVAS\n\
    \nBefore I look at the last control, I will mention a Canvas, which is a control\
