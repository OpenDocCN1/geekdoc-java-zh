    There is a lot to note in the code. There are no less than 13 instance variables,
    the first being a reference to the Sphere object. The two next are the light source
    and the camera respectively. Finally, the 10 Label controls that are used to display
    the values of the 10 Slider controls.


    As for the method start(), there is not much to says placing two components in
    an HBox. However, there is a challenge. A Scene object can generally not display
    both 3D and 2D objects - at least not. To solve this, I have introduced the concept
    of a SubScene that allows you to have multiple Scene objects in a window. It can
    be used for multiple purposes (primarily in 3D graphics), and it can be used to
    split the window into a part for 3D objects and a part for 2D objects. That is
    exactly what is the case in this example.


    The method create3D() creates a 3D Scene, where the root is a Group with a Sphere
    that has a radius 100. Note that a Material is also defined. For this root, a
    SubScene is created. In particular, how to specify anti-aliasing is used and that
    the camera is attached to the SubScene object. This is why the image from the
    start is displayed black, because the camera''s location in (0,0,0) corresponds
    to it inside the ball.


