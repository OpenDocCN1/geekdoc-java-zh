    \ value of the property that is bound. You cannot directly change the value of\
    \ z above. In addition, a property can only be bound to one expression with unidirectional\
    \ bindings, and trying to bind it again, overrides the first binding.\n\nA binding\
    \ can also be bidirectional, which means that you can also change the value of\
    \ the property that is bound. Obviously, a binding like the above cannot be bidirectional,\
    \ for changing z, there is no way to automatically update the values of x and\
    \ y. For a binding to be bidirectional, it must be between properties of the same\
    \ type, but in return, a property may be bound to other properties. The following\
    \ method shows the principles of bidirectional binding:\n\n```\nprivate static\
