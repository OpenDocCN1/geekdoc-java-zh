    \ `setName()` 和 `setJob()` 方法来设置默认值。\n\n## 2.2 可观察集合 (OBSERVABLE COLLECTIONS)\n\
    \nJavaFX 定义了集合，它们是经典集合类的扩展。定义了三个接口：\n\n- ObservableList<T>\n- ObservableSet<T>\n\
    - ObservableMap<K, V>\n\n它们分别继承自 List<T>、Set<T> 和 Map<K, V>并且都继承了 Observable 接口。JavaFX\
    \ 并没有直接提供实现这些接口的类，而是提供了一个 `FXCollections` 类，其中包含静态方法可以返回实现这些接口的对象。从程序员的角度来看，可观察集合是一个可以观察内容失效和更改的列表、集合或映射。\n\
    \n考虑以下示例：\n\n```java\nprivate static void test08()\n{\n    ObservableList<String>\
    \ list = \n    FXCollections.observableArrayList(\"Gorm den Gamle\", \"Harald\
