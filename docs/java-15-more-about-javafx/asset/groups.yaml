    \ a ComboBoxTableCell should be used. The database has a table country, and the\
    \ combobox must be initialized with all the country codes from this table. Back\
    \ there is column Text, where the cells must be edited with a TextArea control\
    \ and thus a custom TableCell. Note that you may need to write back one or another\
    \ to finish entering text, for example, by typing F12.\n\nA particular problem\
    \ is when physically writing to the database. You can course write each time you\
    \ create a person and delete a person, but writing each time you edit a cell may\
    \ not be appropriate. You can therefore choose a different strategy, where you\
    \ write back changes when you click on a button. That's the purpose of the Save\
