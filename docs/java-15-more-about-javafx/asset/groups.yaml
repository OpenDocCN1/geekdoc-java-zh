    As mentioned in the introduction to this chapter, the FDraw program is developed
    by a form of prototyping. The term prototyping is sometimes used for a development
    as above, although the word is not correctly used. The term prototyping understands
    the development of a program, which is intended to illustrate the ideas of an
    application, and after the prototype has been developed and presented, the actual
    system begins from the beginning, but not as a further development of the prototype.
    The prototype is itself a model that is not used as part of the final development.
    It is therefore more correct to say that the program FDraw is developed by a form
    of iterative development through very small iterations, sometimes referred to
    as sprints.


