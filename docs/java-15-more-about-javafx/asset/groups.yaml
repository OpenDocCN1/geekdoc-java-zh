    that by simply a slightly larger program it is impossible to carry out analysis
    where all requirements are identified and determined. Every experience shows that
    you do it, it will not meet the requirements. It is impossible to think about
    it all and there will certain be new demands of requirements over the development
    period, and if there is no user interaction at the development, one can most be
    sure that the end of a program has many shortcomings and inconveniences that the
    user does not using. Therefore, in iterative system development, an iteration
    is a system development in its own, but not necessarily as small iterations as
    the current example suggests. An iteration will generally have a limited amount
    in time, and must lead the program from one state to another. The result of an
    iteration is a milestone in system development, where the state of the program
    can be presented and assessed by the upcoming users or the customer and possibly
    lead to something being corrected and new requirements to be set. Typically, an
    iteration will be system development process in itself, including analysis, design,
    programming and testing, but so that the weight changes over time, with the emphasis
    on analysis and design in the first iterations, but in later iterations the analysis
    and design feel less as the requirements are now established and most most important
    decisions regarding the design of the program are also in place.


