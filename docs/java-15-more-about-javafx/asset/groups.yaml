    # 3.4 A TREEVIEW CONTROL


    JavaFX also has a WebView control, which corresponds to a JTree from Swing and
    is a control that visualizes hierarchical data. Basically, there are two classes
    TreeItem and View, the first representing an element in the tree, while the latter
    is the actual component. A TreeItem is either a composite or a leaf and it is
    determined by whether it has children.


    The program ShowWorldProgram shows some of the world''s countries organized in
    a hierarchy:


    ![](img/998d397bc3b3b3eb4f67343f38bad5e5_87_0.png)


    Above, all continents in this world, which all of the Antarctica are composite
    nodes, as are shown with the arrow, showing that it is a node with child nodes
    and that can be expanded by clicking the arrow with the mouse. Below is the same
    window where Asia and North America are expanded (you should note that the component
    automatically displays a scrollbar when necessary):


    ![](img/998d397bc3b3b3eb4f67343f38bad5e5_87_1.png)


    A WebView shows data defined in a model, which is a hierarchy of TreeItem elements,
    and in this case, the model is defined in the method build():'
