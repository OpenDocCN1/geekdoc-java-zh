    \ z = 19\n```\n\n在 JavaFX 中，所有读/写属性都支持双向绑定，作为一个如何使用的示例，请考虑以下类：\n\n```java\npackage\
    \ javafxproperties;\n```\n\n```java\nimport javafx.application.Application;\n\
    import javafx.scene.*;\nimport javafx.scene.paint.*;\nimport javafx.scene.stage.Stage;\n\
