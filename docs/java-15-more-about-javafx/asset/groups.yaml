    # FOREWORD


    This book is the fifteenth in a series of books on software development and the
    book is a natural continuation of the previous book on programming of GUI applications
    with JavaFX. The book focuses primarily on JavaFX properties and data bindings,
    but also treats the basic architecture of a JavaFX application as Model-View-Presenter.
    Other important topics are addressed controls like TableView and TreeView also
    charts and 3D graphics are mentioned. The book requires knowledge of JavaFX corresponding
    to what is dealt in the book Java 14. After reading this and solving the corresponding
    exercises and tasks, you will be able to write complete GUI applications using
    JavaFX and use JavaFX as an alternative to Swing.


    As the title says this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in Java. It can be learned
    by reading about the subject and studying complete programs, but most importantly
    by yourself to do it and write your own programs from scratch. Therefore, an important
    part of the books is exercises and problems, where the reader has to write programs
    that correspond to the substance being treated in the books. All books in the
    series is built around the same skeleton and will consist of text and examples
    and problems that are placed in the text where they naturally belongs. The difference
    between exercises and problems is that the exercises largely deals with repetitions
    of the substance is presented in the text, and furthermore it is accurately described
    what to do. Problems are in turn loosely described, and are typically a little
    bigger and there is rarely any clear best solution. These books are to read from
    start to finish, but the many examples, including exercises and problems play
    a central role, and it is important that the reader predict in detail studying
    the code to the many examples also solves the exercises and problems or possibly
    just studying the recommended solutions.


    All books end with one or two larger sample programs, which focus primarily on
    process and an explanation of how the program is written. On the other hand appear
    the code only to a limited extent — if at all — and the reader should study the
    finished program code while testing the program. In addition to show the development
    of programs that are larger than the examples, which otherwise is presented, the
    aim of the concluding examples is to show program examples from varying fields
    of application.


    Most books also ends with an appendix dealing with a subject that would not be
    treated in the books. It may be issues on the installation of software or other
    topics in computer technology, which are not about software development, but where
    it is necessary to have an introductory knowledge. If the reader already is familiar
    with the subject, the current appendix can be skipped.'
