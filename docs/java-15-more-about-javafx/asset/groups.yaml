- md: "\n# JAVA 15: MORE ABOUT JAVAFX:\n\n# SOFTWARE DEVELOPMENT\n\nunidirectional\
    \ binding, which is defined by the method bind(). There are several limitations\
    \ to unidirectional bindings, and you can not, for example, directly change the\
    \ value of the property that is bound. You cannot directly change the value of\
    \ z above. In addition, a property can only be bound to one expression with unidirectional\
    \ bindings, and trying to bind it again, overrides the first binding.\n\nA binding\
    \ can also be bidirectional, which means that you can also change the value of\
    \ the property that is bound. Obviously, a binding like the above cannot be bidirectional,\
    \ for changing z, there is no way to automatically update the values of x and\
    \ y. For a binding to be bidirectional, it must be between properties of the same\
    \ type, but in return, a property may be bound to other properties. The following\
    \ method shows the principles of bidirectional binding:\n\n```java\nprivate static\
    \ void test05() {\n  IntegerProperty x = new SimpleIntegerProperty(3);\n  IntegerProperty\
    \ y = new SimpleIntegerProperty(5);\n  IntegerProperty z = new SimpleIntegerProperty(7);\n\
    \  System.out.println(\"x = \" + x.get() + \", y = \" + y.get() + \", z = \" +\
    \ z.get());\n  x.bindBidirectional(y);\n  System.out.println(\"x = \" + x.get()\
    \ + \", y = \" + y.get() + \", z = \" + z.get());\n  x.bindBidirectional(z);\n\
    \  System.out.println(\"x = \" + x.get() + \", y = \" + y.get() + \", z = \" +\
    \ z.get());\n  z.set(11);\n  x.unbindBidirectional(y);\n  x.unbindBidirectional(z);\n\
    \  System.out.println(\"x = \" + x.get() + \", y = \" + y.get() + \", z = \" +\
    \ z.get());\n  y.set(17);\n  z.set(19);\n  System.out.println(\"x = \" + x.get()\
    \ + \", y = \" + y.get() + \", z = \" + z.get());\n}\n```\n\nThree properties\
    \ are created, and the first println() displays the value of these properties\
    \ before they are bound. Next, x is bound to y and the next println() statement\
    \ shows that x now has the same value as y. Then x is bound to z, which means\
    \ that x has the same value as z, and x is bound to y and since the binding is\
