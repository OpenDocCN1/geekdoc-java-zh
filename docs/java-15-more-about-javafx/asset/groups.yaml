    \    System.out.println(property2.get());\n}\n```\n\n上面定义了两个列表内容的绑定，但这意味着通过单向绑定，两个列表的内容并不是同步的：\n\
    \n# JAVA 15：关于 JAVFX：\n软件开发\n\n[Svend, Knud, Valdemar]\n[]\n[Gorm, Harald, Svend,\
