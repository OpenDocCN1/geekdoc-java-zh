  mdcn: "\n# JAVA 是：更多关于 JAVFX：\n软件开发\n\n## JAVFX 属性\n\n```\nSystem.out.println(property1.get());\n\
    System.out.println(property2.get());\n}\n```\n\n上面定义的两个 `ListProperty` 对象，它们包装了\
    \ `ObservableList`，因此前两个打印语句将输出：\n\n- [Kristian]\n- [Frederik]\n\n这并不奇怪。因为由于 JavaFX\
    \ 属性，它们可以进行绑定：\n\n```\nproperty1.bind(property2);\n```\n\n这以单向绑的方式将 `property1`\
    \ 绑定到 `property2`。确切地说，这意味着 `property1` 包装的列表与 `property2` 包装的列表是同一个。下一个语句向 `property1`\
    \ 添加了三个名字，下一个语句再次向 `property2` 添加了一个名字。接下来的两个打印语句的结果是\n\n- [Frederik, Svend, Knud,\
    \ Valdemar, Hans]\n- [Frederik, Svend, Knud, Valdemar, Hans]\n\n![](img/998d397bc3b3b3eb4f67343f38bad5e5_38_0.png)\n\
    \n# JAVA 15：更多关于 JAVAFX：\n软件开发\n\n这可能不是人们所预期的，因为它是一个单向绑定，但由于这两个属性包装的是同一个列表（即 `property2`\
    \ 原本包装的那个），因此在两种情况下更新的都是列表。如果你随后执行语句：\n\n```\nproperty2.set(FXCollections.observableArrayList(\"\
    Gorm\", \"Harald\"));\n```\n\n`property2` 现在包装了一个包含两个名字的列表，由于绑存在，两个属性都将引用此内容。如果你尝试执行该语句（会发现\
    \ `property1` 已绑定到 `property2`，且此处被注释掉），你将由于该事实而得到一个异常。不要更改 `property1` 所包装的对象。接下来，绑定被移除，取而代之的是创建一个双向绑定。现在你可以更改两个属性的列表，因为绑定是双向的，并且以最后的值为准。因此，最后的打印语句的结果为：\n\
    \n- [Niels, Abel, Oluf, Knud]\n- [Niels, Abel, Oluf, Knud]\n\n上述绑定绑定了属性所包装的列表，但你可以通过\
