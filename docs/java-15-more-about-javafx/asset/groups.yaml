    \ 方法没有执行任何特殊操作，但它执行了许多耗时的计算，目标是让它成为一个持续使用机器处理器的方法。\n\n关于用户界面，没有什么需要解释的，你应该主要关注\
    \ `work()` 方法，它是 Start 按钮的事件处理器。该方法测试点击了哪一个单选按钮，如果是顶部的，则调用 `work1()` 方法。这意味着它在\
    \ JavaFX 应用程序线程中执行，导致程序会“卡死”，直到 `work1()` 完成。例如，你不会看到 Start 按钮变为禁用状态。如果点击中间的单选按钮，会再次执行\
    \ `work1()` 方法，但这次是在它自己的线程中运行。结果是在方法尝试更新 Label 组件时会抛出异常。另一方面，如果按下底部的单选按钮，则执行 `work2()`\
    \ 方法，它在原理上与 `work1()` 相同，但在更新 `work2` 时，使用了以下语句：\n\n```java\nPlatform.runLater(()\
    \ -> label.setText(text));\n```\n\n这意味着组件 label 在 JavaFX 应用程序线程中更新。\n该类有两个与 JavaFX\
    \ 应用程序线程相关的静态方法：\n\n- public static boolean isFxApplicationThread()\n- public\
    \ static void runLater(Runnable runnable)\n\n其中第一个在调用线程是 JavaFX 应用程序线程时返回 true，而另一个创建一个\
    \ Runnable 对象，并在线程运行的某个时刻由 JavaFX 应用程序线程执行。\n\n# 7.1 任务 (TASK)\n\n为了在 GUI 编程中支持线程，JavaFX\
    \ 提供了一个非常简单的并发框架，基于现有的 Java 并框架。该框架由一个名为 `State` 的枚举组成（定义了线程可能处于的状态），以及一个名为 `WorkerEvent`\
    \ 的事件类型（线程在切换状态时会触发此类事件）。此外，只有四种线程构成了一个简单的层次结构，顶层是一个接口，而其他三个是特定类型：\n\n![](img/998d397bc3b3b3eb4f67343f38bad5e5_156_0.png)\n\
    \n准确来说，`Worker` 接口的实例是一个由一个或多个后台线程执行的任务。任务的状态可以通过 JavaFX 应用程序线程进行观察。`Task`、`Service`\
    \ 和 `ScheduledService` 类是实现 `Worker` 接口的抽象类，代表不同类型的任务。`Task` 类代表可以执行一次的任务，且 `Task`\
    \ 对象不能重用。`Service` 类代表可以重复的 `Task`，最后，`ScheduledService` 类代表可以在特定时间执行的 `Service`。在下文中，我将展示一个\
    \ Task 和 Service 的示例。\n\n任务必须是确定质数——这是一个你在之前的书中见过很多的任务。目标是让处理大数字的任务花费很长时间。运行 `PrimesProgram1`\
