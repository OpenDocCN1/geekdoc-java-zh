    opens up a very close course with the upcoming users and helps to end with a solution
    that meets the users'' requirements for the completed program. However, there
    are also disadvantages, and in particular there is a risk that you will have to
    change the code that has been made.


    When you build on iteration on iteration, there is a great chance that you have
    to go back change something that has been programmed in previous iterations, among
    other things because there are always new demands and wishes. That is precisely
    why traditional system development speaks of analysis and design, which defines
    the requirements for the finished program through the analysis, and under the
    design, it will be decided how to write the program before beginning the programming.


    Now, it is not either or and you can perfectly combine iterative development with
