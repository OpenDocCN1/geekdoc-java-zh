    \ values must be set by directly updating the model, performing the setName()\
    \ and setJob() methods.\n\n## 2.2 OBSERVABLE COLLECTIONS\n\nJavaFX defines multiple\
    \ collections, which are extensions of the classic collection classes. There are\
    \ three interfaces defined:\n\n- ObservableList<T>\n- ObservableSet<T>\n- ObservableMap<K,\
    \ V>\n\nwhich inherits List<T>, Set<T> and Map<K, V> respectively, also inherits\
    \ the interface Observable. JavaFX does not immediately have classes that implements\
    \ these interfaces, but instead, there is a class of FXCollections that static\
    \ methods that return objects that implement these interfaces. Viewed from the\
    \ programmer, an observable collection is a list, set or map that can be observed\
    \ for invalidation and changes of the content.\n\nConsider the following example:\n\
    \n```java\nprivate static void test08()\n{\n    ObservableList<String> list =\
    \ \n    FXCollections.observableArrayList(\"Gorm den Gamle\", \"Harald Blåtand\"\
    );\n    list.addListener(FXProperties::onChanged);\n    list.addAll(\"Svend Tveskæg\"\
    , \"Harald d. 2.\");\n    list.add(\"Knud d. Store\");\n    list.remove(0);\n\
    \    show(list);\n    java.util.Collections.sort(list);\n    show(list);\n}\n\
