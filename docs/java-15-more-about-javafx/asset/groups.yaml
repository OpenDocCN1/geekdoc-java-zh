    ## JAVA 15: MORE ABOUT JAVAFX:


    ### EXERCISE 5


    The database padata has four tables that contain information about Danish regions,
    Danish municipalities and Danish zip codes, while the fourth table represents
    a many-many relationship between municipality and zipcode. The four tables were
    created with the following script:


    ```sql

    create table region (

    regnr int not null primary key,

    name varchar(30) not null

    );


    create table municipality (

    munnr int not null primary key,

    name varchar(30) not null,

    regnr int not null,

    area decimal(10, 2),

    number int,

    year int,

    foreign key (regnr) references region(regnr)

    );

    ```


    ![](img/998d397bc3b3b3eb4f67343f38bad5e5_95_0.png)


    ## JAVA 15: MORE ABOUT JAVAFX:

    SOFTWARE DEVELOPMENT


    ### EXERCISE 5


    ```sql

    create table zipcode

    (

    code char(4) not null primary key,

    city varchar(30) not null

    );


    create table post

    (

    code char(4) not null,

    unnr int not null,

    primary key (code, munnr),

    foreign key (code) references zipcode(code),

    foreign key (munnr) references municipality(munnr)

    );

    ```


    You must write a program that you can call Denmark, which displays this data in
    a TextView. Note that the program should only display names, but you should not
    be able to edit the content. When the program starts, you should see the following
    window:


    ![](img/998d397bc3b3b3eb4f67343f38bad5e5_96_0.png)


    and below the same window after the root, Region Midtjylland and the municipality
    Holstebo are expanded:


    ![](img/998d397bc3b3b3eb4f67343f38bad5e5_96_1.png)


    ## JAVA 15: MORE ABOUT JAVAFX:

    SOFTWARE DEVELOPMENT


    ### 3.5 A TREEVIEW WITH COUNTRY OBJECTS


    As a final example of using a Tree, I will show a program called UpdateWorldProgram.
    The program is similar to the previous one, but partly the individual objects
    are of a custom type and not just strings, and partly there are more data. The
    database padata (see, if applicable, the book Java 6) contains three tables that
    contain data about currencies, continents and countries:


    ![](img/998d397bc3b3b3eb4f67343f38bad5e5_97_0.png)


    where the last two columns in the country table are foreign keys. The program
    will show an overview of all countries, but organized in a TreeView, and where
    it should be possible to edit the information about a country. If you open the
    program, you get the following window where North America is expanded:


    ![](img/998d397bc3b3b3eb4f67343f38bad5e5_97_1.png)


    For example, if you double-click on the United States, you will see the following
    window where you can edit data about the United States:


    ## JAVA 15: MORE ABOUT JAVAFX:

    SOFTWARE DEVELOPMENT


    ### EXERCISE 5


    | Edit country |

    | --- |

    | Name | Amerikas Forenede Stater (USA) |

    | Area | 9834000 |

    | Inhabitants | 323100000 |

    | World | North America [NA] |

    | Currency | Amerikanske dollar [USD] |

    | OK | Cancel |


    The two comboboxes contains all continents and all currencies, respectively, and
    are used to change a country''s currency or content. Note that the above window
    with the Tree component does not show all the world''s countries as only the countries
    in the database where a foreign key to the table world is included. You should
    also note that the program does not provide opportunities to create new countries
    or delete existing countries, but of course it would be easy to expand the program
    with these features.

