    ### 练习 5


    | 编辑国家 |

    | --- |

    | 名称 | Amerikas Forenede Stater (USA) |

    | 面积 | 9834000 |

    | 人口 | 323100000 |

    | 世界 | 北洲 [NA] |

    | 货币 | 美元 [USD] |

    | 确定 | 取消 |


    这两个组合框框（comboboxes）分别包含所有大陆和所有货币，并用于更改国家的货币或内容。请注意，上述带有 Tree 组件的上述窗口并没有显示世界上所有的国家，因为它只显示了数据库中包含指向
    `world` 表外键的国家。你还应该注意，程序没有提供创建新国家或删除现有国家的功能，当然，扩展程序以增加这些功能是非常容易的。


