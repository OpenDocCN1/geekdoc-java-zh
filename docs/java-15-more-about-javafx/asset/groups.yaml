    \ surface where you can\nd geometric figures and insert images using drawing features.\
    \ You can also\nmanipulate the individual pixels using a PixelWriter.\n\nA Canvas\
    \ has attached a GraphicsContext class that represents the graphic content and\n\
    provides drawing functions available. You are encouraged to investigate which\
    \ methods\nGraphics makes available.\n\nFor example, the program CanvasProgram\
    \ opens the following window:\n\n![](img/998d397bc3b3b3eb4f67343f38bad5e5_147_0.png)\n\
    \nwhere a square, a circle, a text and a curve (a parable) are drawn and a picture\
    \ is added.\nThe new is that it has been done using a Canvas:\n\n```\npackage\
    \ canvasprogram;\n\nimport javafx.application.Application;\nimport javafx.scene.Scene;\n\
    import javafx.scene.canvas.*;\nimport javafx.scene.image.*;\nimport javafx.scene.layout.*;\n\
    import javafx.scene.paint.*;\nimport javafx.scene.text.*;\nimport javafx.scene.stage.Stage;\n\
    \npublic class CanvasProgram extends Application\n{\n    @Override\n    public\
    \ void start(Stage stage) {\n        Canvas canvas = new Canvas(520, 160);\n \
    \       GraphicsContext gc = canvas.getGraphicsContext2D();\n        gc.setLineWidth(2.0);\n\
    \        gc.strokeRect(20, 20, 120, 120);\n```\n\nDownload free eBooks at bookboom.com"
