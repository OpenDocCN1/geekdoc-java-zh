    \ multi-threaded, and similar to Swing JavaFX uses a special thread to update\
    \ the user interface. This thread is called JavaFX Application Thread. Since all\
    \ nodes in the program's scene graph are not thread-safe (for the reasons of performance),\
    \ there are the same challenges you know from Swing that you cannot directly update\
    \ them from thread, but it should be done by calling a method performed in the\
    \ JavaFX Application Thread. In this chapter I want to show what JavaFX makes\
    \ available to make it simple. The program UpdateGUI opens the window:\n\n![](img/998d397bc3b3b3eb4f67343f38bad5e5_152_0.png)\n\
    \nIf you click the Start button, the program starts a method that takes a time\
    \ and after the method is completed. Clicking the Clear button deletes the content\
    \ of the top label. If you try the program while the top radio button is pressed,\
    \ you will find that nothing happens when you click the Clear button — at least\
    \ before the method started of the Start button is completed. The user experiences\
    \ that the program \"hangs\". Solutions are, of course, to execute the method\
    \ that takes time, in its own thread. Pressing the middle radio button and clicking\
    \ Start again executes the method in a background thread, but now you get an exception.\
    \ The reason is that the background thread tries to update the JavaFX Application\
    \ Thread, which raises an exception. On the other hand, press the bottom radio\
    \ button and click Again, so it runs as is, where the top label is updated on\
    \ a regular basis, and you can delete that label at any time by clicking the Clear\
    \ button.\n\n```\npublic class UpdateGUI extends Application\n{\n  private Label\
    \ label = new Label(\"Not running...\");\n  private RadioButton cmd1 = new RadioButton(\"\
    Application thread\");\n  private RadioButton cmd2 = new RadioButton(\"Background\
    \ thread\");\n  private RadioButton cmd3 = new RadioButton(\"Platform.runLater()\"\
    );\n  private Button cmdOk;\n```\n\nDownload free eBooks at ebook.com\n\n153"
