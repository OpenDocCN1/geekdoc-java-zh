    \ = \" + z.isBound() + \", \" + z.get());\n}\n```\n\n因此，绑定是一个求值的表达式。该表达式由一个或多个可观测值组成，这些值被称为依赖项。绑定观察依赖项的变化，并在依赖项变化时自动更新其值。JavaFX\
    \ 中所有的属性类都内置了绑定支持。绑定有两种形式：单向绑定和双向绑定。上面的例子是：\n\n- Bound = true, 8\n- Bound = true,\
