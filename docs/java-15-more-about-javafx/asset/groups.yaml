- md: "\n# JAVAFX PROPERTIES\n\nProperties and beans have been mentioned several times\
    \ in the previous books, and classes in JavaFX defines properties that you can\
    \ read or modify as a programmer. In a typical bean, a property is nothing but\
    \ get methods and possibly set method that represents a property of the current\
    \ class, and typically corresponds to a variable with get and set methods. In\
    \ addition, a Java Bean uses a particular name convention. In JavaFX, however,\
    \ a property is a bit more, as it is necessary to know. Properties in JavaFX are\
    \ observable, so an observer can receive notifications regarding invalidations\
    \ and changes. There is a strict distinction between read/write properties and\
    \ read-only properties. The value of a property can be either a single value or\
    \ a collection.\n\nAnother important difference is that a property is always an\
    \ object whose class is part of a particular class hierarchy for properties. As\
    \ examples can be mentioned\n\n- IntegerProperty\n- DoubleProperty\n\n(and there\
    \ are corresponding classes for the other simple data types). These classes are\
    \ actually abstract, and for each class there are two specific classes that for\
    \ an IntegerProperty are\n\n- SimpleIntegerProperty\n- ReadOnlyIntegerWrapper\n\
    \nwhen the first represents a read/write property, while the other represents\
    \ a read-only property. A property class defines as usual get and set methods,\
    \ but the class also defines two methods called getValue() and setValue(). For\
    \ primitive types, get and set methods work on primitive types (int, double and\
    \ so on), while the other works on objects (such as Integer, Double, etc.). For\
    \ reference types like\n\n- StringProperty\n- ObjectProperty<T>\n\nall four methods\
    \ works on objects, and because of autoboxing, there is no difference in practice,\
    \ for example on get and getValue(). As an example, below is shown a method that\
    \ creates a read/write IntegerProperty\n\n# JAVA 15: MORE ABOUT JAVAFX: SOFTWARE\
    \ DEVELOPMENT\n\nJAVAFX PROPERTIES\n\n```\nprivate static void test01() {\n  \
    \  IntegerProperty p = new SimpleIntegerProperty(100);\n    System.out.println(p.get());\n\
    \    p.set(200);\n    System.out.println(p);\n}\n```\n\nand the method (which\
    \ is a method in the project FXProperties) is performed you get the result:\n\n\
    ```\n100\nIntegerProperty [value: 200]\n```\n\nHere you should note the last line\
    \ that is the result of toString() in the class SimpleIntegerProperty, while the\
    \ first prints the value of an int.\n\nRead-only properties are actually a bit\
    \ more complex as they are a wrapper about two properties that the system ensures\
    \ is synchronized. Here, the one is a read-only property, while the other is a\
    \ read/write. The idea is that from outside it is a read-only property, but it\
    \ can be changed internally from the class in which it is defined, and the application\
    \ is typical as a instance variable.\n\nAs an example, below is shown a class\
    \ with two JavaFX properties:\n\n```\npackage javafx.beans.property.*;\n\npublic\
    \ class Counter {\n    private IntegerProperty step = new SimpleIntegerProperty(1);\n\
    \    private ReadOnlyIntegerWrapper value = new ReadOnlyIntegerWrapper(0);\n\n\
    \    public final IntegerProperty stepProperty() {\n        return step;\n   \
    \ }\n\n    public final int getStep() {\n        return step.get();\n    }\n}\n\
    ```\n\n```\npublic final void setStep(int step)\n{\n    this.step.set(step);\n\
    }\n```\n\n```\npublic final ReadOnlyIntegerProperty valueProperty()\n{\n    return\
    \ value.getReadOnlyProperty();\n}\n```\n\n```\npublic final int getValue()\n{\n\
    \    return value.get();\n}\n```\n\n```\npublic void increase()\n{\n    value.set(value.get()\
    \ + step.get());\n}\n```\n\n![](img/998d397bc3b3b3eb4f67343f38bad5e5_11_0.png)\n\
    \n# JAVA 15: MORE ABOUT JAVAFX: SOFTWARE DEVELOPMENT\n\n# JAVAFX PROPERTIES\n\n\
    ```\npublic void decrease() {\n    value.set(value.get() - step.get());\n}\n```\n\
    \n```\n@Override\npublic String toString() {\n    return \"\" + value.get();\n\
    }\n```\n\nThis is an example of a JavaFX bean. The two properties are called step\
