  mdcn: "\n\n# JAVAFX 属性\n\n属性（Properties）和豆类（beans）在之前的书中已经提到过多次，JavaFX 中的类定义了程序员作为可以读取或修改的属性。在典型的豆类中，一个属性无非是表示当前类属性的\
