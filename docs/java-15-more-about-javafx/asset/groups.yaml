    # 10.15 结


    正如本章引言中提到的，FDraw 程序是以原型开发的形式开发的。“原型开发”一词有时被用于上述开发方式，尽管该词的使用并不完全准确。原型开发指的是对程序进行开发，旨在说明应用程序的想法，在原型开发完成并展示后，实际系统将从头开始，但并不是这样。


