    \ 160, 20, 120, 120);\nwriteGraph(gc);\nPane root = new JPanel();\nroot.getChildren().add(canvas);\n\
    Scene scene = new Scene(root);\nstage.setScene(scene);\nstage.setTitle(\"Drawing\
    \ on a Canvas\");\nstage.show();\n```\n\n```\nprivate void writeGraph(GraphicsContext\
    \ gc) {\n    PixelWriter writer = gc.getPixelWriter();\n    for (double x = 300;\
    \ x < 500; x += 0.25) {\n        writer.setColor((int)x, (int)y(x), Color.BLUE);\n\
    \    }\n}\n```\n\n```\nprivate double y(double x) {\n    return x * x / 100 -\
    \ 8 * x + 1620;\n}\n```\n\n```\npublic static void main(String[] args) {\n   \
    \ launch(args);\n}\n```\n\nThe code is easy enough to figure out. In the method\
    \ start(), a Canvas object is created of a certain size, and is referenced to\
