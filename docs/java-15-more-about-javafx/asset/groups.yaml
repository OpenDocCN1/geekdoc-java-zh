    \ 按钮可以删除列表框的内容，通过 Cancel 按钮你可以停止线程，最后通过 Exit 按钮可以终止程序。\n\n为了执行此任务，我将定义一个 `Task`\
    \ 对象。你应该查看 `Worker<V>` 和 `Task<V>` 的文档，但在本例，我没有显示关于类属性的代码：\n\n```java\npublic\
    \ class PrimesTask extends Task<ObservableList<Long>> {\n    private final ObservableList<Long>\
    \ list = \n    FXCollections.<Long>observableArrayList();\n    private final LongProperty\
    \ from = new SimpleLongProperty();\n    private final LongProperty to = new SimpleLongProperty();\n\
    \    ...\n}\n```\n\n```java\npublic void clear() {\n}\n```\n\n![](img/998d397bc3b3b3eb4f67343f38bad5e5_157_0.png)\n\
    \n# JAVA 15: 关于 JAVAFX 的更多内容：\n软件开发\n\n# JAVAFX 与并发\n\n```java\nlist.clear();\n\
    \n@Override\nprotected ObservableList<Long> call()\n{\n    list.clear();\n   \
    \ long count = getTo() - getFrom() + 1;\n    long counter = 1;\n    for (long\
    \ i = getFrom(); i <= getTo(); ++i,++counter) {\n        if (this.isCancelled())\
    \ break;\n            updateMessage(\"检查 \" + i + \" 是否为质数\");\n        if (isPrime(i))\
    \ {\n            long n = i;\n            Platform.runLater(() -> list.add(n));\n\
    \        }\n        updateProgress(counter, count);\n    }\n    return list;\n\
    }\n\n@Override\nprotected void cancelled()\n{\n    super.cancelled();\n}\n\n@Override\n\
    protected void failed()\n{\n    super.failed();\n}\n\n@Override\nprotected void\
    \ succeeded()\n{\n    super.succeeded();\n}\n\nprivate boolean isPrime(long number)\n\
    {\n    if (number < 2) return false;\n    for (long i = 2; i <= Math.sqrt(number);\
    \ i++) {\n        if (number % i == 0) return false;\n    }\n    return true;\n\
    }\n```\n\n"
