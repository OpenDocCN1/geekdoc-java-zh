- md: "\n# JAVA 15: MORE ABOUT JAVFX: SOFTWARE DEVELOPMENT\n\nUSER DEFINED CONTROLS\n\
    \n## 6 USER DEFINED CONTROLS\n\nIt is rarely necessary to write your own controls,\
    \ but the possibility exists, and it could even be the task to developing your\
    \ own user defined controls. A control must be derived directly or indirectly\
    \ from the class Node that it can be part of a scene graph in the same way as\
    \ all other controls, but in most cases, one will write a defined control as a\
    \ class inheriting an existing control, as it is made for the most important functionality.\
    \ If you open the program UserControlProgram, you get the following window:\n\n\
    ![](img/998d397bc3b3b3eb4f67343f38bad5e5_143_0.png)\n\n![](img/998d397bc3b3b3eb4f67343f38bad5e5_143_1.png)\n\
    \nwhich contains 7 custom controls. The other 4 have the type LabelField, consisting\
    \ of a Label and a TextField, while the 4 others have the type Spinner. It's a\
    \ kind of button and clicking on it will rotate the line (default 2 seconds),\
    \ after which the component will trigger an ActionEvent. The program's start()\
    \ method is as follows:\n\n```java\npublic void start(Stage primaryStage)\n{\n\
    \    Spinner spin1 = new Spinner(50, Color.RED, Color.WHITE);\n    spin1.setOnAction(e\
    \ -> System.out.println(\"ok 1\"));\n    Spinner spin2 = new Spinner(50);\n  \
    \  spin2.setOnAction(e -> System.out.println(\"ok 2\"));\n    Spinner spin3 =\
    \ new Spinner(50, Color.RED, Color.WHITE, 1000);\n    spin3.setOnAction(e -> System.out.println(\"\
    ok 3\"));\n    spin3.setBackground(Color.DARKGREEN);\n    spin3.setForeground(Color.LIGHTGREEN);\n\
    \    Spinner spin4 = new Spinner(50, Color.DARKBLUE, Color.LIGHTBLUE);\n    spin4.setOnAction(e\
    \ -> System.out.println(\"ok 4\"));\n    spin4.setTime(5000);\n    HBox pane =\
    \ new HBox(20, spin1, spin2, spin3, spin4);\n    LabelField label = null;\n  \
    \  VBox root = new VBox(20, field = new LabelField(\"Svend\", \"\", 100, 300),\
    \ new\n    new LabelField(\"Valdemmar\", \"\", 100, 400), pane);\n    field.textProperty().addListener((ob,\
    \ ov, nv) -> System.out.println(nv));\n    field.setFont(Font.font(\"Arial\",\
    \ 18));\n    root.setPadding(new Insets(20, 20, 20, 20));\n    Scene scene = new\
    \ Scene(root);\n    primaryStage.setTitle(\"Hello controls\");\n    primaryStage.setScene(scene);\n\
    \    primaryStage.show();\n}\n```\n\nInitially, 4 Spinners are created, and the\
    \ goal is to show how to create a Spinner (which parameters can be specified by\
    \ the constructor) and which properties can be set. Here you should especially\
    \ note how to associate an event handler. They are all trivial and the goal is\
    \ to show (with a text on the console) when the events in question occurs. The\
    \ 4 Spinner are placed in an HBox that can be added to the root of the window.\
    \ When root is created (a VBox), 3 LabelField controls are added, where you will\
    \ primarily observe the parameters of the constructor. For the first control is\
    \ associate with an event handler which is trivial and the goal is to show that\
    \ you can associate an event handlers to the entry field.\n\nBoth user controls\
    \ are simple and have no great practical, but they show something about how to\
    \ create a user. In the rest of this chapter I will describe how the two controls\
    \ are written.\n\n## 6.1 A LABELFIELD\n\nWhen writing a custom control, the two\
    \ main decisions are what properties should be and events the control is going\
    \ to fire. The actual control is, in fact, not much more than a HBox with a Label\
    \ and a TextField, and in addition to a HBox, you should be able to set the width\
    \ of the Label and the TextField, respectively, and set the text for both components.\
    \ Finally, there must be a property for the font that should apply to both the\
    \ Label and the TextField, so that both components always uses the same font.\
    \ When you enter text or otherwise change the text for the TextField component,\
    \ it should changeEvents, and in order for these events to be captured from an\
    \ application, the component returns the TextField component's textProperty. The\
    \ component can then be written where I have included one of five constructors\
    \ and two properties:\n\n```java\npublic class LabelField extends HBox {\n   \
    \ private Label label;\n    private TextField field = new TextField();\n\n   \
    \ public LabelField(String caption, String text, double captionWidth) {\n    \
    \    setAlignment(Pos.BASELINE_LEFT);\n        label = caption == null ? new Label()\
    \ : new Label(caption);\n        if (text != null) field.setText(text);\n    \
    \    if (captionWidth > 0) label.setPrefWidth(captionWidth);\n        if (fieldWidth\
    \ > 0) field.setPrefWidth(fieldWidth);\n        label.setAlignment(Pos.CENTER_RIGHT);\n\
    \        this.setSpacing(10);\n        getChildren().addAll(label, field);\n \
    \   }\n\n    public double getCaptionWidth() {\n        return captionProperty().get();\n\
    \    }\n\n    public void setCaptionWidth(double captionWidth) {\n        captionProperty().set(captionWidth);\n\
    \    }\n\n    public DoubleProperty captionWidth() {\n        return label.prefWidth();\n\
    \    }\n\n    public String getText() {\n        return textProperty().get();\n\
    \    }\n\n    public void setText(String text) {\n        textProperty().set(text);\n\
    \    }\n\n    public StringProperty textProperty() {\n        return field.textProperty();\n\
    \    }\n}\n```\n\nIn fact, there is not to notice, and the most important code\
    \ is found in constructor, where the two components should be placed \"nicely\"\
    \ in the container. Note that the class inherits HBox and is therefore a component\
    \ that can be inserted into a scene graph like all other controls.![](img/998d397bc3b3b3eb4f67343f38bad5e5_146_0.png)\n\
    \n## 6.2 A CANVAS\n\nBefore I look at the last control, I will mention a Canvas,\
    \ which is a control I have not previously mentioned. A Canvas is a control consisting\
    \ of a drawing surface where you can geometric figures and insert images using\
    \ drawing features. You can also manipulate the individual pixels using a PixelWriter.\n\
    \nA Canvas has attached a GraphicsContext class that represents the graphic content\
    \ and provides drawing functions available. You are encouraged to investigate\
    \ which methods.\n\nFor example, the program Canvas opens the following window:![](img/998d397bc3b3b3eb4f67343f38bad5e5_147_0.png)\n\
    \nwhere a square, a circle, a text and a curve (a parable) are drawn and a picture\
    \ is added. The new is that it has been done using a Canvas:\n\n```java\npackage\
    \ canvasprogram;\n\nimport javafx.application.Application;\nimport javafx.scene.Scene;\n\
    import javafx.scene.canvas.*;\nimport javafx.scene.image.*;\nimport javafx.scene.layout.*;\n\
    import javafx.scene.paint.*;\nimport javafx.scene.text.*;\nimport javafx.scene.stage.Stage;\n\
    \npublic class CanvasProgram extends Application\n{\n    @Override\n    public\
    \ void start(Stage stage) {\n        Canvas canvas = new Canvas(520, 160);\n \
    \       GraphicsContext gc = canvas.getGraphicsContext2D();\n        gc.setLineWidth(2.0);\n\
    \        gc.strokeRect(20, 20, 120, 120);\n        gc.setFill(Color.RED);\n  \
    \      gc.fillOval(40, 40, 80, 80);\n        gc.setFont(Font.font(24));\n    \
    \    gc.strokeText(\"Hello\", 50, 90);\n        Image image = new Image(\"resources/images/stone.jpg\"\
    );\n        gc.drawImage(image, 160, 20, 120, 120);\n        writeGraph(gc);\n\
    \        Pane root = new Pane();\n        root.getChildren().add(canvas);\n  \
    \      Scene scene = new Scene(root);\n        stage.setScene(scene);\n      \
    \  stage.setTitle(\"Drawing on a Canvas\");\n        stage.show();\n    }\n\n\
    \    private void writeGraph(GraphicsContext gc) {\n        PixelWriter writer\
    \ = gc.getPixelWriter();\n        for (double x = 300; x < 500; x += 0.25) {\n\
    \            writer.setColor((int)x, (int)y(x), Color.BLUE);\n        }\n    }\n\
    \n    private double y(double x) {\n        return x * x / 100 - 8 * x + 1620;\n\
    \    }\n\n    public static void main(String[] args) {\n        launch(args);\n\
    \    }\n}\n```\n\nThe code is easy enough to figure out. In the method start(),\
    \ a Canvas object is created of a certain size, and is referenced to the Canvas\
    \ object's GraphicsContext. For this object, the width of the pen to be drawn\
    \ is defined, then a drawing tool is used to draw a rectangle. Since nothing is\
    \ said about color, it is drawn with a black pen. Next, a fill color is added\
    \ and a filled circle is drawn. Note specially that the drawing function is called.\
    \ As a next step, a font is defined and a text is drawn. Finally, an image is\
    \ inserted and finally the method writeGraph() is called, which draws the curve.\
    \ The curve is not too \"nice\" – is is some pixelated and there are other ways\
    \ to draw such a Graph, but the example should show how to manipulate the individual\
    \ pixels in a Canvas. Finally, note that a Canvas is a node, and therefore can\
    \ be added to a scene graph.\n"
