  mdcn: "\n\n# JAVA 15: 关于 JAVAFX 的更多内容：\n软件开发\n\n# JAVAFX 与并发\n\n```java\npublic\
    \ static void main(String[] args)\n{\n    launch(args);\n}\n```\n\n要执行的方法在 `work1()`\
