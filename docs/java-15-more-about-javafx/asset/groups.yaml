  mdcn: "\n\n# JAVA 15: 关于 JAVAFX 的更多信息：\n\n# 软件开发\n\n单向绑定由 `bind()` 方法定义。单向绑定有几个局限性，例如，你不能直接更改被绑定的属性值。你无法直接更改上述\
    \ `z` 的值。此外，使用单向绑定，一个属性只能绑定到一个表达式，尝试再次绑定它将会覆盖第一个绑定。\n\n绑定也可以是双向的，这意味着你也可以更改被绑定的属性值。显然，上面的绑定不能是双向的，因为更改\
    \ `z` 没有方法可以自动更新 `x` 和 `y` 的值。要实现双向绑定，它必须位于相同类型的属性之间，作为回报，一个属性可以绑定到其他属性。以下方法展示了双向绑定的原理：\n\
    \n```java\nprivate static void test05() {\n  IntegerProperty x = new SimpleIntegerProperty(3);\n\
    \  IntegerProperty y = new SimpleIntegerProperty(5);\n  IntegerProperty z = new\
    \ SimpleIntegerProperty(7);\n  System.out.println(\"x = \" + x.get() + \", y =\
    \ \" + y.get() + \", z = \" + z.get());\n  x.bindBidirectional(y);\n  System.out.println(\"\
    x = \" + x.get() + \", y = \" + y.get() + \", z = \" + z.get());\n  x.bindBidirectional(z);\n\
    \  System.out.println(\"x = \" + x.get() + \", y = \" + y.get() + \", z = \" +\
    \ z.get());\n  z.set(11);\n  x.unbindBidirectional(y);\n  x.unbindBidirectional(z);\n\
    \  System.out.println(\"x = \" + x.get() + \", y = \" + y.get() + \", z = \" +\
    \ z.get());\n  y.set(17);\n  z.set(19);\n  System.out.println(\"x = \" + x.get()\
    \ + \", y = \" + y.get() + \", z = \" + z.get());\n}\n```\n\n创建了三个属性，第一个 `println()`\
    \ 显示了这些属性在绑定之前的值。接下来，将 `x` 绑定到 `y`，下一个 `println()` 语句显示 `x` 现在具有与 `y` 相同的值。然后将\
    \ `x` 绑定到 `z`，这意味着 `x` 具有与 `z` 相同的值，由于 `x` 绑定到 `y` 且绑定是双向的，`y` 的值变成了 `x` 的值。下一个\
