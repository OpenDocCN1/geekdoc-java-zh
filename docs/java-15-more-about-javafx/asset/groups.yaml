    \ name : list) System.out.println(name);\n}\n```\n\n```java\nprivate static void\
    \ onChanged(ListChangeListenerChange<? extends String> change)\n{\n    System.out.println(\"\
    List has changed\");\n}\n```\n\n如果执行该方法，结果如下：\n\n- List has changed\nList has\
    \ changed\nList has changed\n\n- Gorm den Gamle\nHarald Blåånd\nSvend Tveskåg\n\
    Knud d. Store\nList has changed\n\n- Gorm den Gamle\nHarald Blåånd\nKnud d. Store\n\
    Svend Tveskåg\n\n列表创建时包含两个元素，然后关联的 `ChangeChangeListener` 只是在控制台上打印了一条消息。第一个事件发生在添加了两个元素后，下一个发生在添加了另一个元素后。最后，第三个事件发生在删除一个元素后。`show()`\
    \ 方法在控制台上显示列表内容并进行读取。注意参数类型是 `List<String>`，这是可以的，因为 `ObservableList<String>`\
