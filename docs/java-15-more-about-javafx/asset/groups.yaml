- md: "\nJAVA 15: MORE ABOUT JAVAFX:\nSOFTWARE DEVELOPMENT\n\n## DRAG AND DROP\n\n\
    JavaFX supports direct drag and drop, such the functionality is built into both\
    \ Scene and a Node object. We are talking about the operation as a press-drag-release\
    \ gesture, means that the user holds one of the mouse's buttons down, drag the\
    \ mouse and releases mouse again to complete the operation. A gesture can be started\
    \ of the Scene object or on any Node object, called the source object, and a gesture\
    \ can include several objects (Nodes). During the operation, several events are\
    \ firing and the use of these events depends on the purpose of the current gesture,\
    \ which may be:\n\n- That you want to change a node's shape by dragging its perimeter\
    \ or dragging it to another location. In this gesture, only the node that initiates\
    \ the operation is involved.\n- That you want to draw a source and drop it to\
    \ another node (target) and in one way or another combine the two nodes. When\
    \ the source node is dropped on the target node, some action is performed.\n-\
    \ To drag a node and drop it over another node to transfer data from the source\
    \ node to the target node, and the actual data transfer occurs when the source\
    \ node is dropped.\n\n![](img/998d397bc3b3b3eb4f67343f38bad5e5_113_0.png)\n\n\
    To describe these gestures, the documentation divides them into three types:\n\
    \n1. simple press-drag-release gesture\n2. full press-drag-release gesture\n3.\
    \ drag-and-drop gesture\n\nand here is the last of the most interesting (which\
    \ is most to be aware of), and I will divide the chapter into sections corresponding\
    \ to this division.\n\n## 4.1 SIMPLE PRESS-DRAG-RELEASE GESTURE\n\nAs the name\
    \ says, it is the simplest form for drag-and-drop and is used where the operation\
    \ relates only to a single node and which node that starts the gesture. During\
    \ the operation, all MouseDragEvent types are fired:\n\n- MouseDragEntered\n-\
    \ MouseDragOver\n- MouseDragExited\n- MouseDragReleased\n\nbut they are only sent\
    \ to the source node. As an example, below is shown an application that opens\
    \ a window with Label controls. By pointing at the top and holding down the mouse,\
    \ the background of the window changes to light green, and moves the mouse, the\
    \ text changes to yellow and the background turns light blue. If you pull the\
    \ mouse around the window, nothing happens even if you drag the mouse over the\
    \ bottom Label. However, if you release the mouse, the background color and the\
    \ text color of the top Label are returned to white and black respectively. The\
    \ example should show what happens if you start a drag gesture for a Label (and\
    \ thus any other node) and drag the mouse around the window.\n\n![](img/998d397bc3b3b3eb4f67343f38bad5e5_114_0.png)\n\
    \n```java\npackage simpelnd;\n\nimport javafx.application.Application;\nimport\
    \ javafx.scene.Scene;\nimport javafx.scene.control.*;\nimport javafx.scene.layout.*;\n\
    import javafx.stage.Stage;\nimport javafx.geometry.*;\nimport javafx.scene.text.Font;\n\
    import javafx.scene.paint.*;\nimport javafx.beans.property.*;\n\n```\n\npublic\
    \ class SimpleDnd extends Application {\n    private Label lbl1 = new Label(\"\
    Source\");\n    private Label lbl2 = new Label(\"Target\");\n    private final\
    \ ObjectProperty<Color> fg = new SimpleObjectProperty<Color>(Color.BLACK);\n \
    \   private final ObjectProperty<Background> bg = new SimpleObjectProperty<Background>(background(Color.WHITE));\n\
    \n    @Override\n    public void start(Stage stage) {\n        Scene scene = new\
    \ Scene(getRoot());\n        lbl1.setOnMousePressed(e -> bg.set(background(Color.LIGHTGREEN)));\n\
    \        lbl1.setOnMouseDragged(e -> bg.set(background(Color.LIGHTBLUE)));\n \
    \       lbl1.setOnMouseDragReleased(e -> fg.set(Color.YELLOW));\n        lbl1.setOnMouseReleased(e\
    \ -> { bg.set(background(Color.WHITE)); fg.set(Color.BLACK); });\n        lbl2.setOnMouseEntered(e\
    \ -> bg.set(background(Color.DARKGREEN)));\n        lbl2.setOnMouseDragged(e ->\
    \ bg.set(background(Color.DARKBLUE)));\n        lbl2.setOnMouseDragReleased(e\
    \ -> fg.set(Color.RED));\n        lbl2.setOnMouseExited(e -> bg.set(background(Color.MAGENTA)));\n\
    \        stage.setScene(scene);\n        stage.setTitle(\"Simple Dnd\");\n   \
    \     stage.show();\n    }\n\n    private Pane getRoot() {\n        lbl1.setFont(Font.font(24));\n\
    \        lbl2.setFont(Font.font(24));\n        lbl1.setTextProperty().bind(fg);\n\
    \        VBox pane = new VBox(50, lbl1, lbl2);\n        pane.setPadding(new Insets(50,\
    \ 50, 50, 50));\n        pane.backgroundProperty().bind(bg);\n        return pane;\n\
    \    }\n}\n```\n\nJAVA 15: MORE ABOUT JAVFX: \nSOFTWARE DEVELOPMENT\n\nDRAG AND\
    \ DROP\n\nJAVA 15: MORE ABOUT JAVFX: SOFTWARE DEVELOPMENT\n\nThe program has defined\
    \ as instance variables, as well as properties for Color. Here is the static method\
    \ background(Color). The method returns a Background. The program is a VBox, and\
    \ similarly, the drag event handlers are assigned to the top. \n\n![](img/998d397bc3b3b3eb4f67343f38bad5e5_116_0.png)\n\
    \nJAVA 15: MORE ABOUT JAVFX:\nSOFTWARE DEVELOPMENT\n\nDRAG AND DROP\n\nThe meaning\
    \ is that you must observe these event handlers. A simple press-drag-release gesture\
    \ relates only to the node – the operation ends when the mouse is released and\
    \ wherever the mouse points.\n\n## 4.2 FULL-DRAG-RELEASE GESTURE\n\nWhen the node\
    \ receives a MouseDetected event, it can launch a full press-drag-release gesture\
    \ by calling the method startFullDrag(). In addition, the property mouseTransparent\
    \ must be false for the source so this node does not receive all notifications.\
    \ The example FullpressDnd is almost identical to the above and opens the same\
    \ window. Clicking on the top Label starts a drag operation, which immediately\
    \ results in the same as above, but when the mouse is dragged over the bottom\
    \ Label, the background of the window changes to dark blue the text in the label\
    \ becomes white. If the mouse is dragged out from the bottom label, the text color\
    \ in the top label changes to violet. When the mouse is released, it returns to\
    \ default. This is the time following:\n\n```java\npublic class FullpressDnd extends\
    \ Application {\n    private Label lbl1 = new Label(\"Source\");\n    private\
    \ Label lbl2 = new Label(\"Target\");\n    private final ObjectProperty<Color>\
    \ fgl = new SimpleObjectProperty<Color>(Color.BLACK);\n    private final ObjectProperty<Color>\
    \ f2 = new SimpleObjectProperty<Color>(Color.BLACK);\n    private final ObjectProperty<Background>\
    \ bg = new SimpleObjectProperty<Background>(background(Color.WHITE));\n\n    @Override\n\
    \    public void start(Stage stage) {\n        Scene scene = new Scene(getRoot());\n\
    \        lbl1.setOnPressed(e -> startDrag());\n        lbl1.setOnMouseDragged(e\
    \ -> bg.set(background(Color.LIGHTBLUE)));\n        lbl1.setOnMouseDetected(e\
    \ -> lbl1.startFullDrag());\n        fgl.set(Color.YELLOW);\n        lbl1.setOnMouseReleased(e\
    \ -> endDrag());\n        lbl2.setOnMouseEntered(e -> f2.set(Color.WHITE));\n\
    \        lbl2.setOnMouseDragged(e -> bg.set(background(Color.DARKBLUE)));\n  \
    \      lbl2.setOnMouseReleased(e -> lbl1.setText(\"End\"));\n        lbl2.setOnMouseExited(e\
    \ -> { if (lbl1.isMouseTransparent()) f2.set(Color.MAGENTA); });\n        stage.setScene(scene);\n\
    \        stage.setTitle(\"Full Dnd\");\n        stage.show();\n    }\n\n    public\
    \ static void main(String[] args) {\n        launch(args);\n    }\n\n    // ...\
    \ methods for startDrag, endDrag, getRoot, background ...\n}\n```\n"
  mdcn: "\nJAVA 15: 关于 JAVAFX 的更多：\n软件开发\n\n## 拖放\n\nJavaFX 支持直接的拖放操作，这种功能被内置在 Scene\
    \ Scene 和 Node 对象中。我们所指的是一种“按下-拖动-释放”（press-drag-release）的手势，这意味着用户按住鼠标的一个按钮，移动鼠标并再次释放鼠标以完成操作。手势可以从\
    \ Scene 对象开始，也可以在任何 Node 对象（称为源对象）上开始，手势可以包含多个对象（节点）。在操作期间，会触发多个事件，而这些事件的使用取决于当前手势的目的，可能包括：\n\
    \n- 你想通过拖动节点的边界或将其拖到另一个位置来更改节点的形状。在这种手势中，只有发起操作的节点参与其中。\n- 你想绘制一个源并将其释放到另一个节点（目标），并以某种方式将这两个节点组合。当源节点释放到目标节点上时，会执行某些操作。\n\
    - 拖动节点并将其释放到另一个节点上方，以便将数据从源节点传输到目标节点，实际的数据传输在源节点释放时发生。\n\n![](img/998d397bc3b3b3eb4f67343f38bad5e5_113_0.png)\n\
    \n为了描述这些手势，文档将它们分为三种：\n\n1. 简单的按下-拖动-释放手势\n2. 完整的按下-拖动-释放手势\n3. 拖放手势\n\n这里是最后一种有趣的（最需要注意的），我将该章节分为与此划分相对应的部分。\n\
    \n## 4.1 简单的按下-拖动-释放手势\n\n顾如名，它是拖放最简单的形式，用于操作仅涉及单个节点以及启动手势的那个节点的情况。在操作期间，会触发所有的\
    \ MouseDragEvent 类型：\n\n- MouseDragEntered\n- MouseDragOver\n- MouseDragExited\n\
    - MouseDragReleased\n\n但它们只发送给源节点。例如，下方显示了一个打开带有 Label 控件窗口的应用程序。通过指向顶部并按住鼠标，窗口背景变为浅绿色；移动鼠标时，文本变为黄色且背景变为浅蓝色。如果你在窗口周围移动鼠标，即使你将鼠标拖过底部的\
    \ Label，也不会发生任何事情。然而，如果你释放鼠标，顶部 Label 的背景颜色和文本颜色将分别恢复白色和黑色。该示例应该展示了为 Label（以及任何其他节点）启动拖动手势并在窗口周围移动鼠标会发生什么。\n\
    \n![](img/998d397bc3b3b3eb4f67343f38bad5e5_114_0.png)\n\n```java\npackage simpelnd;\n\
    \nimport javafx.application.Application;\nimport javafx.scene.Scene;\nimport javafx.scene.control.*;\n\
    import javafx.scene.layout.*;\nimport javafx.stage.Stage;\nimport javafx.geometry.*;\n\
    import javafx.scene.text.Font;\nimport javafx.scene.paint.*;\nimport javafx.beans.property.*;\n\
    \n```\n\npublic class SimpleDnd extends Application {\n    private Label lbl1\
    \ = new Label(\"Source\");\n    private Label lbl2 = new Label(\"Target\");\n\
    \    private final ObjectProperty<Color> fg = new SimpleObjectProperty<Color>(Color.BLACK);\n\
    \    private final ObjectProperty<Background> bg = new SimpleObjectProperty<Background>(background(Color.WHITE));\n\
    \n    @Override\n    public void start(Stage stage) {\n        Scene scene = new\
    \ Scene(getRoot());\n        lbl1.setOnMousePressed(e -> bg.set(background(Color.LIGHTGREEN)));\n\
    \        lbl1.setOnMouseDragged(e -> bg.set(background(Color.LIGHTBLUE)));\n \
    \       lbl1.setOnMouseDragReleased(e -> fg.set(Color.YELLOW));\n        lbl1.setOnMouseReleased(e\
    \ -> { bg.set(background(Color.WHITE)); fg.set(Color.BLACK); });\n        lbl2.setOnMouseEntered(e\
    \ -> bg.set(background(Color.DARKGREEN)));\n        lbl2.setOnMouseDragged(e ->\
    \ bg.set(background(Color.DARKBLUE)));\n        lbl2.setOnMouseDragReleased(e\
    \ -> fg.set(Color.RED));\n        lbl2.setOnMouseExited(e -> bg.set(background(Color.MAGENTA)));\n\
    \        stage.setScene(scene);\n        stage.setTitle(\"Simple Dnd\");\n   \
    \     stage.show();\n    }\n\n    private Pane getRoot() {\n        lbl1.setFont(Font.font(24));\n\
    \        lbl2.setFont(Font.font(24));\n        lbl1.setTextProperty().bind(fg);\n\
    \        VBox pane = new VBox(50, lbl1, lbl2);\n        pane.setPadding(new Insets(50,\
    \ 50, 50, 50));\n        pane.backgroundProperty().bind(bg);\n        return pane;\n\
    \    }\n}\n```\n\nJAVA 15: 关于 JAVFX 的更多： \n软件开发\n\n拖放\n\n程序定义了实例变量，以及 Color 的属性。这里是静态方法\
    \ background(Color)。该方法返回一个 Background。该程序是一个 VBox，同样地，拖动事件处理程序被分配给顶端。 \n\n![](img/998d397bc3b3b3eb4f67343f38bad5e5_116_0.png)\n\
    \nJAVA 15: 关于 JAVFX 的更多：\n软件开发\n\n拖放\n\nJAVA 15: 关于 JAVFX 的更多：软件开发\n\n拖放的含义是你必须观察这些事件处理程序。简单的按下-拖动-释放手势仅涉及节点——当鼠标释放时操作结束，无论鼠标指向哪里。\n\
    \n## 4.2 完整-拖动-释放手势\n\n当节点接收到 Detected 事件时，可以通过调用 `startFullDrag()` 方法启动完整的按下-拖动-释放手势。此外，源节点的\
    \ mouseTransparent 属性必须为 false，以便该节点不会接收通知。示例 FullpressDnd 与上述几乎相同，并打开相同的窗口。但当鼠标拖过底部的\
    \ Label 时，窗口背景变为深蓝色。如果鼠标从底部 Label 拖出，顶部 Label 的文本颜色变为紫色。当鼠标释放时，它将恢复默认。以下是代码：\n\
    \n```java\npublic class FullpressDnd extends Application {\n    private Label\
    \ lbl1 = new Label(\"Source\");\n    private Label lbl2 = new Label(\"Target\"\
    );\n    private final ObjectProperty<Color> fgl = new SimpleObjectProperty<Color>(Color.BLACK);\n\
    \    private final ObjectProperty<Color> f2 = new SimpleObjectProperty<Color>(Color.BLACK);\n\
    \    private final ObjectProperty<Background> bg = new SimpleObjectProperty<Background>(background(Color.WHITE));\n\
    \n    @Override\n    public void start(Stage stage) {\n        Scene scene = new\
    \ Scene(getRoot());\n        lbl1.setOnPressed(e -> startDrag());\n        lbl1.setOnMouseDragged(e\
    \ -> bg.set(background(Color.LIGHTBLUE)));\n        lbl1.setOnMouseDetected(e\
    \ -> lbl1.startFullDrag());\n        fgl.set(Color.YELLOW);\n        lbl1.setOnMouseReleased(e\
    \ -> endDrag());\n        lbl2.setOnMouseEntered(e -> f2.set(Color.WHITE));\n\
    \        lbl2.setOnMouseDragged(e -> bg.set(background(Color.DARKBLUE)));\n  \
    \      lbl2.setOnMouseReleased(e -> lbl1.setText(\"End\"));\n        lbl2.setOnMouseExited(e\
    \ -> { if (lbl1.isMouseTransparent()) f2.set(Color.MAGENTA); });\n        stage.setScene(scene);\n\
    \        stage.setTitle(\"Full Dnd\");\n        stage.show();\n    }\n\n    public\
    \ static void main(String[] args) {\n        launch(args);\n    }\n\n    // ...\
    \ methods for startDrag, endDrag, getRoot, background ...\n}\n```\n"
