    Here is the last trivial, while the top three are also assigned to buttons in
    the toolbar. The goal is that it should be possible to save a drawing and later
    re-load the drawing. Since the program is a tool that should be easy to install,
    drawings must not be saved in a database, but in ordinary files. Here are four
    options:


    +   1. to save drawings as JSON documents

    2. to save drawings as XML documents

    3. to save the drawings by conventional object serialization

    4. to save drawings in a custom format


    Here is the first most obvious, as JSON does not fill up much, it is a standard
    and can therefore be read by everyone and those other programs. It requires that
    a Model object be converted to JSON, and the JSON text loading can create a Java
    object. There are open source APIs that can do that and examples are GSON and
    Jackson, which are all excellent products. Unfortunately, they do not work in
    the current case, and the reason is that it is de and complex object structure,
    but primarily by JavaFX is causing problems. Both products outline solutions that
    more or less directly solve the problems. It is apparently not quite simple, but
    one expects that future versions can be used directly. Because of that, I have
    abandoned using.


