    event type called WorkerEvent, and a thread fires such an event when it switches
    state. Else there are only four types of threads that constitute a simple hierarchy,
    the top one being an interface, while the other three are specific types:


    ![](img/998d397bc3b3b3eb4f67343f38bad5e5_156_0.png)


    Precisely, an instance of the Worker interface is a task to be performed by one
    or more background threads. The task''s state is observable from the JavaFX Application
    Thread. The Task, Service, and ScheduledService classes are abstract classes that
    implement the Worker interface and represent different kinds of tasks. The Class
    represents a task that can be performed once and a Task object cannot be reused.
    The Service class represents a Task that can be repeated, and finally, the ScheduledService
    class represents a Service that can be performed at certain times. In the following
    I will show an example of a Task and Service.


