  md: '# JAVFX PROPERTIES


    Properties and beans have been mentioned several times in the previous books,
    and classes in JavaFX defines properties that you can read or modify as a programmer.
    In a typical bean, a property is nothing but get methods and possibly set method
    that represents a property of the current class, and typically corresponds to
    a variable with get and set methods. In addition, a Java Bean uses a particular
    name convention. In JavaFX, however, a property is a bit more, as it is necessary
    to know. Properties in JavaFX are observable, so an observer can receive notifications
    regarding invalidations and changes. There is a strict distinction between read/write
    properties and read-only properties. The value of a property can be either a single
    value or a collection.


    Another important difference is that a property is always an object whose class
    is part of a particular class hierarchy for properties. As examples can be mentioned


    +   - IntegerProperty

    - DoubleProperty


    (and there are corresponding classes for the other simple data types). These classes
    are actually abstract, and for each class there are two specific classes that
    for an IntegerProperty are


    +   - SimpleIntegerProperty

    - ReadOnlyIntegerWrapper


    when the first represents a read/write property, while the other represents a
    read-only property. A property class defines as usual get and set methods, but
    the class also defines two methods called getValue() and setValue(). For primitive
    types, get and set methods work on primitive types (int, double and so on), while
    the other works on objects (such as Integer, Double, etc.). For reference types
    like


    +   - StringProperty

    - ObjectProperty<T>


    all four methods works on objects, and because of autoboxing, there is no difference
    in practice, for example on get and getValue(). As an example, below is shown
    a method that creates a read/write IntegerProperty'
