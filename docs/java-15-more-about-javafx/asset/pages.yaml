  md: "# JAVA 15: MORE ABOUT JAVFX:\nSOFTWARE DEVELOPMENT\n\n# 6.1 A LABELFIELD\n\n\
    When writing a custom control, the two main decisions are what properties should\
    \ be and events the control is going to fire. The actual control is, in fact,\
    \ not much more than a HBox with a Label and a TextField, and in addition to a\
    \ HBox, you should be able to set the width of the Label and the TextField, respectively,\
    \ and set the text for both components. Finally, there must be a property for\
    \ the font that should apply to both the Label and the TextField, so that both\
    \ components always uses the same font. When you enter text or otherwise change\
    \ the text for the TextField component, it should changeEvents, and in order for\
    \ these events to be captured from an application, the component returns the TextField\
    \ component's textProperty. The component can then be written where I have included\
    \ one of five constructors and two properties:\n\n```\npublic class LabelField\
    \ extends HBox {\n    private Label label;\n    private TextField field = new\
    \ TextField();\n\n    public LabelField(String caption, String text, double captionWidth)\
    \ {\n        setAlignment(Pos.BASELINE_LEFT);\n        label = caption == null\
    \ ? new Label() : new Label(caption);\n        if (text != null) field.setText(text);\n\
    \        if (captionWidth > 0) label.setPrefWidth(captionWidth);\n        if (fieldWidth\
    \ > 0) field.setPrefWidth(fieldWidth);\n        label.setAlignment(Pos.CENTER_RIGHT);\n\
    \        this.setSpacing(10);\n        getChildren().addAll(label, field);\n \
    \   }\n\n    public double getCaptionWidth() {\n        return captionWidthProperty().get();\n\
    \    }\n\n    public void setCaptionWidth(double captionWidth) {\n        captionWidthProperty().set(captionWidth);\n\
    \    }\n\n    public DoubleProperty captionWidthProperty() {\n        return label.prefWidthProperty();\n\
    \    }\n```"
