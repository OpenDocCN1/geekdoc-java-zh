    private static int lastId = 0;

    private int id;

    private ObjectPropertyColorWrapper color =

    new SimpleObjectProperty(Colors.list.get(0));

    private ObjectProperty<Double> stroke = new SimpleObjectProperty(1.0);


    public FunctionModel()

    {

    id = ++lastId;

    }",}

    ```


    Note that the class is defined abstract so that it cannot be instantiated. The
    class ExpressionModel is then trivial


    ```

    public class ExpressionModel extends FunctionModel

