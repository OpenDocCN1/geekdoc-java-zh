  md: '# JAVA 15: MORE ABOUT JAVFX:

    SOFTWARE DEVELOPMENT


    and that is, the event handler invalidated() is performed twice. The function
    creates a read/write IntegerProperty with the value 100, and is then valid. Then
    an event handler for invalid events is added. When the value of p changes to 101,
    the property becomes invalid and an invalid event is triggered. When the value
    changes to 102, an event is not fired because it is already invalid. The method
    reads the property in question (in System.out.println()), which, among other things,
    means it becomes valid. When it is subsequently set to 102, no invalidation event
    is fired, as the value is not changed. This happens when the value changes to
    103.


    If you then remove the comment and set a comment in front of the first addListener(),
    instead a ChangeListener is added, and if you then performs the method you get
    the result:


    ```

    Set to 101

    Property is changed

    Changed to 101

    Set to 102

    Property is changed

    Changed to 102

    Set to 102

    Changed to 102

    Set to 103

    Property is changed

    Changed to 103

    ```


    Note that a change event is performed each time the value changes, but not when
    the value is set to 102 the second time as the value is not changed.


    Another difference between invalidation events and change events is that javafx
    for invalidation events use lazy evaluation, while change events use eager evaluation
    as a value must be transferred to the event handler.


    To some extent, one can achieve the same with an invalidation event and a change
    event, but an invalidation event is slightly more effective as it is not necessarily
    fired when the value changes and as it does not necessarily update the value.
    If you want to choose which event you should listen to, the main rule is that
    if you do not read the value in the event handler, you should listen to invalidation
    events, but if you read the value, you should listen to a change event as it automatically
    updates the value (and validates the property). You can see the effect if you
    in the above program remove both comments:


    ```

    Set to 101

    Property is invalid

    Property is changed

    Changed to 101

    ```'
