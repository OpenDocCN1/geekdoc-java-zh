  md: 'JAVA 15: MORE ABOUT JAVAFX:

    SOFTWARE DEVELOPMENT


    # DRAG AND DROP


    JavaFX supports direct drag and drop, such the functionality is built into both
    Scene

    and a Node object. We are talking about the operation as a press-drag-release
    gesture,

    means that the user holds one of the mouse''s buttons down, drag the mouse and
    releases

    mouse again to complete the operation. A gesture can be started of the Scene object

    or on any Node object, called the source object, and a gesture can include several
    objects\(Nodes). During the operation, several events are firing and the use of
    these events depends

    on on the purpose of the current gesture, which may be:


    +   - That you want to change a node''s shape by dragging its perimeter or dragging

    it to another location. In this gesture, only the node that initiates the operation

    involved.

    - That you want to draw a source and drop it to another node (target) and in one

    way or another combine the two nodes. When the source node is dropped on the

    target node, some action is performed.

    - To drag a node and drop it over another node to transfer data from the source

    node to the target node, and the actual data transfer occurs when the source node

    is dropped.


    ![](img/998d397bc3b3b3eb4f67343f38bad5e5_113_0.png)


