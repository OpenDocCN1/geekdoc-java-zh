    # 2.6 DECORATIONS


    A typical window looks something like the following:


    ![](img/998d397bc3b3b3eb4f67343f38bad5e5_49_0.png)


    where there is a title bar and a border so you can change the window size. In
    addition, there is the window content, here a scene graph with a label and a button.
    The title bar and border are displayed depends on the current platform, and for
    the title bar, the platform determines which buttons are available. The window''s
    title bar is also used to move the window on the screen by dragging it with the
    mouse and for example maximizing it by double-clicking the title bar.


    Title bar and border are referred to as the window''s decorations or styles, and
    here are actually more options, which are defined as properties of the Stage object.
    I want to mention three:


    +   1. StageStyle.DECORATED, which is the default where the window has a title
    bar and a border

    2. StageStyle.UNDECORATED, where the window is not decorated and therefore does
    not have a title bar or border

    3. StageStyle.TRANSPARENT, where the window is not decorated and also has a transparent
    background


