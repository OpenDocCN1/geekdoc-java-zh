    # 2.7 MODALITY


    As you know from Swing, a dialog box can be modelless or modal, and of course
    it also applies in JavaFX, where it is a property of the Stage object. There are
    three options:


    +   * Modality.NONE, where the result is a modelless window, which is the default
    for a Stage

    * Modality.WINDOW_MODAL, which is modal and blocks all windows that directly or
    indirectly own this window

    * Modality.APPLICATION_MODEL, which is modal and blocks all of the application''s
    other windows


