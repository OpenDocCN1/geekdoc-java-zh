    # 5 MVC


    I have treated the Model-View-Controller pattern earlier, which is the design
    pattern of a GUI program, and in this context, I also mentioned that there are
    several versions of the pattern, partly because of the development tools used,
    but also due to the API used. Should you use JavaFX fully, you should use the
    Model-View-Presenter pattern, which you sometimes see shortened as MVP. The pattern
    can be sketched as follows:


    ![](img/998d397bc3b3b3eb4f67343f38bad5e5_133_0.png)


    The principle is that the program''s view takes care of everything to be displayed.
    The user interaction takes place in the view layer, but can turn to the model
    to get the data to be displayed. When there is a user interaction, it is sent
    to the presenter module, which takes care of it. That is, a window''s event handlers
    are placed in a presenter class as a result that can update the view component
    and execute commands on the model. When the model is updated as a result of commands
    from the presenter, it can send notifications, the view component can listen to
    and possibly read the model to ensure the synchronization between model and view.


    It''s principle, and in fact, is not very different than I previously mentioned
    MVC, just the pattern is drawn in a way that directly supports JavaFX. Another
    thing, however, is what it means in the code, and especially who is responsible
    for creating the individual objects, and it is best illustrated with an example.


    Looking at the previous examples in this book, they basically had a 2 layer architecture
    consisting of a view layer and a model layer. The most important thing in the
    above pattern is actually a more accurate breakdown of the view layer in a view
    component and a presenter component. The goal of all is to make the code as simple
    and manageable as possible, and even the most important thing to ensure that GUI
    programs are written in a standardized manner, and one of the patterns that JavaFX
    recommends a systematic use of data binding. In previous books, I have used database
    addresses that only have a single table:


