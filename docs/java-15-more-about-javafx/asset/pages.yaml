  md: '# 10 FINAL EXAMPLE


    The final example of this book is a program where the user can enter an expression
    for a mathematical function in one real variable, for example


    $y = 3x^2 - 2x + 1$


    and the program must then be able to draw the function''s graph. The requirements
    are formulated continuously as the program is to be developed through a form of
    prototyping, but the main purpose of the program is that when you have drawn the
    graph for one or more functions in a coordinate system, you must be able to copy
    the graph to the clipboard and paste it into a word processor, for example. You
    can then think of the program as a tool that can be used by a writer of mathematical
    notes or books, but perhaps by students in daily mathematics education.


    Regarding the other features of the program, there are primarily requirements
    for flexibility and ease of use, as well as the types of graphs that the program
    can draw. Some of the program''s features will relate to settings, including,
    for example, color and line thickness settings, as well as settings for the coordinate
    system will be important.


    More challenges are expected during the development, and the biggest challenge
    is assumed to relate to performance, as it may take time to draw a complete graph.
