  md: "# JAVA 15: MORE ABOUT JAVFX:\nSOFTWARE DEVELOPMENT\n\n# 3.3 FILTERS\n\nOne\
    \ of the important features of a JTable is the use of filters, and with a TableView,\
    \ it's all a bit easier. A TableView shows the content of an ObservableList and\
    \ you can set a filter with a filter wrapper to the table and encapsulated in\
    \ a sort wrapper. To conclude this review of the TableView component, I will show\
    \ an example that sets a filter.\n\nThe example is called FilterKingsProgram and\
    \ I want to reuse objects of the type King, and the data model for the TableView\
    \ component is essentially unchanged from previously and will be shown here.\n\
    \nThe window's code is:\n\n```\npublic class FilterKingsProgram extends Application\n\
    {\n    private TextField txtName = new TextField();\n\n    @Override\n    public\
    \ void start(Stage stage) {\n        TableView<King> table = new TableView();\n\
    \        table.getColumns().addAll(KingModel.getNameCol(),\n            KingModel.getFromCol(),\
    \ KingModel.getToCol());\n        initialize(table);\n        BorderPane root\
    \ = new BorderPane(table, null, null, createBottom(), null);\n        root.setPadding(new\
    \ Insets(10, 10, 10, 10));\n        Scene scene = new Scene(root, 500, 400);\n\
    \        stage.setScene(scene);\n        stage.setTitle(\"Show kings\");\n   \
    \     stage.show();\n    }\n\n    private void initialize(TableView table) {\n\
    \        FilteredList<King> filter = \n            new FilteredList<King>(KingModel.getKings(),\
    \ king -> true);\n        txtName.textProperty().addListener((observable, oldValue,\
    \ newValue) -> {\n            filter.setPredicate(king -> {\n                if\
    \ (newValue == null || newValue.isEmpty()) return true;\n                String\
    \ lowerCaseFilter = newValue.toLowerCase();\n                if (king.getName().toLowerCase().contains(lowerCaseFilter))\
    \ return true;\n                return false;\n            });\n        });\n\
    \    }\n}\n```"
