  md: '# JAVA 15: ABOUT JAVFX


    EXERCISE 5


    Similar to the columns for the two previous controls, a CellValueFactory object
    is associated with which a parameter specifies where to retrieve the individual
    values. The name of the property is specified by the specific objects to be displayed,
    and here it Country objects. A CellValueFactory indicates which values should
    be displayed in the columns cells. For the name, a TreePropertyValueFactory uses
    the content of the individual cells as a Label containing the value. The type
    TreePropertyValueFactory implements a Callback interface, and you can therefore
    define your own CellValueFactory as a class that implements this interface if
    you want to determine the value of the columns cells. I have done that for the
    next two columns in the form of the class SumFactoryBean. The class has a parameter
    field, which is the name of the property in the class Country which the column
    relates. The goal is that the same class should apply for both columns Area and
    Inhabitants. Otherwise, the class consists primarily of overriding the method
    call(), is defined by the interface Callback. The method has parameters that represent
    the current cell in the model, and tests whether the cell contains a Country that
    does have a reference to a continent. If that is the case, the object itself represents
    a continent and the method calculate() which determines the sum of all child object
    values for the current property. You should note that the method calculate() is
    recursive, and that is why the root of the tree shows the sum of all the world''s
    countries. If the current cell is not for a continent, the value is determined
    by a default TreePropertyValueFactory.


