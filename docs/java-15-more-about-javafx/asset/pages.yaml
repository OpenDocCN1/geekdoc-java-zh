    That is, changes of the two properties $x$ and $y$ automatically update $z$, which
    exactly is what binding is about. The next statement removes the binding of $z$,
    after which $x$ and $y$ are changed again. The last statement will print


    Bound = false, z = 24


    which partly shows that $z$ is no longer bound and its value has not changed since
    it is no longer linked to the two properties $x$ and $y$.


    A binding is thus an expression that is evaluated to a value. The expression consists
    of one or more observable values, known as dependencies. The binding observes
    changes of its dependencies and its value is automatically updated when its dependencies
    change values. All property classes in JavaFX have built-in support for binding.
    There are two forms of binding: Unidirectional binding and bidirectional binding.
