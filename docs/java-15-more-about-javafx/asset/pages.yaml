  md: '# JAVA 15: MORE ABOUT JAVFX:

    SOFTWARE DEVELOPMENT


    In general, a drag-and-drop operation includes the following actions:


    +   - Point to a node and hold down one of the mouse''s buttons

    - Drag the mouse while the button is held down and the node gets a DragDetected
    event and perform a startDragAndDrop(), after which the node is a gesture source
    node and the current data is placed on the clipboard

    - After starting a drag-and-drop gesture, the system no longer sends MouseEvents,
    but instead DragEvents

    - If a source is dragged over a gesture target, it will check if it will accept
    data on the clipboard and do it, with will a DragEvent indicate that data is accepted.

    - If the user drags the mouse pointing to a gesture target, it will apply the
    current data and send a DragDropped event

    - When the source gesture receives a DragDone event, it tells that the operation
    has been completed


    In this section I will illustrate drag-and-drop with three examples, and the first
    one is called TextDnd and opens the following window:


    ![](img/998d397bc3b3b3eb4f67343f38bad5e5_120_0.png)


    It is basically the same window as in the two previous examples, except that there
    is a frame outside of the two Label controls, and a button has been added. In
    this example, drag and drop gestures get the text from the top label and drop
    it on the bottom label. A drag-and-drop gesture can be performed in two ways (actually
    three and you can read about drag-and-drop in the book Java 10), where one drops
    a copy of the data element (here the text in the top label) while the other moves
    it. Here the text Copy in the button means that it is a copy gesture that is being
    executed. Clicking the button changes the text and it is a move gesture, while
    resetting the window. The code is as follows:'
