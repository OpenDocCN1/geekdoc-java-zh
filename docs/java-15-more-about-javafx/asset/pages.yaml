    Basically, it is important to specify a function''s domain, and the dialog ExpressionView
    is therefore expanded to:


    ![](img/998d397bc3b3b3eb4f67343f38bad5e5_205_0.png)


    It is now possible to add a number of intervals where the union of these intervals
    is the domain. If you do not enter any intervals, the domain is perceived as the
    real axis. For each interval you can enter values:


    +   1. A is the left end point. If the value is blank, the left end point is minus
    infinity.

    2. Start indicating a mark for the starting point. If blank, no mark is displayed,
    otherwise it may be Close, which means a filled circle or Open, which means an
    open circle.

    3. B is the right end point. If the value is blank, the right end point is infinite.

    4. End that indicates a mark for the end point. If blank, no mark is displayed,
    otherwise it may be Close, which means a filled circle or Open, which means an
    open circle.


