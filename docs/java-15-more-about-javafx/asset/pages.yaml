    Storing drawings using object serialization is not appropriate in this case. Among
    other things, at the start of the project, I mentioned that it was not desirable,
    but in fact it gives a problem to JavaFX, as properties and other JavaFX types
    are not serializable. At least, serialization of objects would require some extra
    work.


    I will therefore choose the last of the above options and save as text files,
    but in a custom format. In practice, it may be of interest, and it is not very
    difficult, but in turn, there are a few significant disadvantages. Since it is
    a custom and non-transparent format, it is difficult to apply the files in other
    contexts than the current application. The contents of the files do not follow
    any standard. In itself that will often mean that a method like the following
    is rejected. Secondly, a custom format like the following is not easy to maintain,
    and if the model is changed, the code to save drawings and read them must be changed
    accordingly, which means it is very expensive to change the model. The question
    is whether there are any benefits and that''s hardly, but should I imply two,
    it should be that the format is compact and saved drawings do not fill up much,
    which may be important if drawings send over a network, and second as an example
    of what it takes to build an object hierarchy from a text (it JSON or XML).


