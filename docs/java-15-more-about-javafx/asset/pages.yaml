    public static void main(String[] args) {\n    launch(args);\n}\n```\n\nCustom\
    \ types can not be immediately transferred via the clipboard as they do not have\
    \ a known mime type. This means that a target node cannot test what is on the\
    \ clipboard. Therefore, the program starts by creating a static object of the\
    \ type DataFormat PERSON_LIST. The value is not important. It just has to be a\
    \ name that is unique (for the program). The method getRoot() fills a parser,\
    \ and it must, among things, initialize the left ListView with 6 Person objects.\
    \ These objects are created in the method getPersons(), but I have not shown the\
    \ code. Note that for both ListView controls, select MULTIPLE, the user can select\
    \ more Person objects. However, the most important thing is that 4 event handlers\
    \ are assigned to each control, since both controls can be source and target gesture\
    \ nodes.\n\nThe methods (there are 4) that the event handlers call has a parameter\
    \ that tells what it is for a ListView that the event concerns. dragDetected()\
    \ initiates a drag operation, and you must note that its mode is COPY_OR_MOVE\
    \ so that it can be used in either case. You start a COPY operation by pressing\
    \ the mouse button, if you also holding down the SHIFT key, it is a MOVE operation.\
    \ dragDetected() uses the method getSelectedItems() to return the Person objects\
    \ that are selected, and it this list of objects is placed on the clipboard. dragOver()\
    \ and dragDropped() appear as shown in the two previous examples but note how\
    \ dragDropped() using the PERSON_LIST object tests whether it is data of the correct\
    \ kind that located on the clipboard before the list is copied to the target ListView\
    \ component. Finally, there is the method dragDone() that tests whether it is\
    \ a MOVE operation, and if necessary, the objects that are moved will be deleted\
    \ from the source node."
