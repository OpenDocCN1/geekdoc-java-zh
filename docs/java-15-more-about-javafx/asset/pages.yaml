    \ you cannot course a directional binding, but a ReadOnlyIntegerWrapper has an\
    \ asString() method, which returns a StringBinding, and allows it to create a\
    \ unidirectional binding. The result is that if the value in the Counter object\
    \ changes (clicking the Down and Up buttons), the Label object will automatically\
    \ be updated. A Slider has a valueProperty of the type IntegerProperty, and the\
    \ same classes to class Counter, which has a stepProperty of the same type. You\
    \ can therefore create a bidirectional binding between these two properties. The\
    \ result is that if you change the slider, the Counter's step property is updated.\
