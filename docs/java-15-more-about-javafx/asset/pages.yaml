  md: 'JAVA 15: MORE ABOUT JAVFX:

    SOFTWARE DEVELOPMENT


    DRAG AND DROP


    To describe these gestures, the documentation divides them into three types:


    +   1. simple press-drag-release gesture

    2. full press-drag-release gesture

    3. drag-and-drop gesture


    and here is the last of the most interesting (which is most to be aware of), and
    I will divide the chapter into sections corresponding to this division.


    # 4.1 SIMPLE PRESS-DRAG-RELEASE GESTURE


    As the name says, it is the simplest form for drag-and-drop and is used where
    the operation relates only to a single node and which node that starts the gesture.
    During the operation, all MouseDragEvent types are fired:


    +   - MouseDragEntered

    - MouseDragOver

    - MouseDragExited

    - MouseDragReleased


    but they are only sent to the source node. As an example, below is shown an application
    that opens a window with Label controls. By pointing at the top and holding down
    the mouse, the background of the window changes to light green, and moves the
    mouse, the text changes to yellow and the background turns light blue. If you
    pull the mouse around the window, nothing happens even if you drag the mouse over
    the bottom Label. However, if you release the mouse, the background color and
    the text color of the top Label are returned to white and black respectively.
    The example should show what happens if you start a drag gesture for a Label (and
    thus any other node) and drag the mouse around the window.


    ![](img/998d397bc3b3b3eb4f67343f38bad5e5_114_0.png)


