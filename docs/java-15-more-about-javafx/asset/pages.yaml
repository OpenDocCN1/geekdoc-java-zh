  md: '# JAVA 15: MORE ABOUT JAVAFX: ADVANCED CONTROLS SOFTWARE DEVELOPMENT


    The two columns are basically defined in the same way, just the type is this time
    Integer. However, these columns are not inserted directly in the table, but via
    another column created by the method getPeriodCol(). Columns can be nested and
    the column created by getPeriodCol() is a column consisting of two other columns.
    At the user interface, it corresponds to the column with the header Period having
    two subcolumns, respectively from year and to year. In this case, there is no
    particular reason for it in addition to showing that it is possible and what the
    syntax is.


    The class also creates a column for the property country, and here is nothing
    new, and actually the method getCountryCol() is not used. The goal is to show
    that you do not have to display all columns in the user interface.


    Finally, there is the method getYearCol(), which shows how many years that king
    has ruled, or the text Unknown you do not know the government period. This column
    is different, as there is no corresponding property in the King class, and the
    values to be displayed in the cells must be calculated. This happens again using
    the method setCellValueFactory(). It has the following prototype:


    ```

    setCellValueFactory(Callback<TableColumn.CellDataFeatures<S,T>, ObservableValue<T>>
    value)

    ```


    Callback<R> is an interface parameterized with two types, and the interface defines
    a single method


    ```

    R call(P param)

    ```


    In this case for the column Year, it means that the cells of the column are initialized
    by a method of the form


    ```

    ObservableValue<String> call(TableColumn.CellDataFeatures<King, String> value)

    ```


    which is used to calculate the years in which the king has ruled. You can add
    your own custom-defined columns. You should note that the value returned is a
    read-only property, as you cannot edit such a value in the user interface.


    If you run the program, not by default you can change the columns width with the
    mouse, change the order of columns, and sort them by clicking the header.


