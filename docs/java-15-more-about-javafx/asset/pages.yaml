    # 2.1 BINDING PROPERTIES


    JavaFX supports binding of properties where a property of a component or node
    can bind to a property on another object. In general, it is relatively simple
    to use, but in fact, many details are assigned to the concept, the classes in
    JavaFX are hidden the most. In the following, I will illustrate with some simple
    examples what binding is about. Consider the following method:


    ```

    private static void test04() {

    IntegerProperty x = new SimpleIntegerProperty(3);

    IntegerProperty y = new SimpleIntegerProperty(5);

    IntegerProperty z = new SimpleIntegerProperty(7);

    z.bind(x.add(y));

    System.out.println("Bound = " + z.isBound() + ",", z = " + z.get());

    x.set(11);

    y.set(13);

    System.out.println("Bound = " + z.isBound() + ",", z = " + z.get());

    z.unbind();

    x.set(17);

    y.set(19);

    System.out.println("Bound = " + z.isBound() + ",", z = " + z.get());

    }}

    ```


    The method defines three properties of the type Property initialized with values
    3, 5 and 7. An IntegerProperty has an add() method that performs an addition of
    two properties and returns a binding of the sum of the two properties which is
    an expression of the type NumberBinding, representing the sum of the values of
    the two properties. This binding is linked to the property z. The next statement
    will print


    ```

    Bound = true, z = 8

    ```'
