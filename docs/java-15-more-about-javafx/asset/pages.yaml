    As the example, I will show how to bind to a single element in an ObservableList:


    ```

    private static void test13()

    {

    ListProperty<Person> property =

    new SimpleListProperty<Person>(FXCollections.observableArrayList());

    ObjectBinding<Person> last =

    property.valueAt(property.get().subtract(1));

    property.add(new Person("Gudrun Jensen", "Heks"));

    property.add(new Person("Carlo Andersen", "Skarpretter"));

    property.add(new Person("Valborg Kristenen", "Spåkone"));

    System.out.println(property.get());

    System.out.println(last.get());

    }

    ```


    property is a ListProperty, which wrapper an ObservableList with Person objects.
    last is an ObjectBinding object for a Person object that is bound to the last
    item in the list the property is wrapper for. The syntax. The method valueAt()
    has as an index and returns an ObjectBinding to the object to which the index
    refers. After adding three objects to the list, the print statements


    [Gudrun Jensen: Heks, Carlo Andersen: Skarpretter, Valborg Kristenen: Spåkone]

    Valborg Kristenen: Spåkone


    In the same way as shown in this section, there are also wrapper properties called
    SetProperty and MapProperty for an ObservableSet and an ObservableMap respectively.


