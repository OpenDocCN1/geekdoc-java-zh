    The camera used above has the type PerspectiveCamera, but there is also a camera
    ParallelCamera,

    and the difference is what kind of projection is used. A PerspectiveCamera is
    the most used

    since, as the name says, it sees the object in perspective. A clip area is attached
    to a camera

    so that shapes that are close to the camera do not appear and the same for shapes
    that are

    far away.


