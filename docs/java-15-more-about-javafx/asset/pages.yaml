    # 8.5 CAMERA AND LIGHT


    The camera is the most crucial factor in 3D graphics, but it can be difficult
    to predict the effect. For example, if you create a sphere with radius 50 and
    without any kind of transition and create a camera in the same way, you get the
    following window:


    ![](img/998d397bc3b3b3eb4f67343f38bad5e5_174_0.png)


    This corresponds to the starting point of the coordinate system (0, 0, 0), which
    is the center of the sphere. The camera is located in the same position, and if
    you changed the window size, nothing happens with the shape. Since the sphere
    has no Material, a default value is given, which is light gray color, and since
    there is no mention of light, a light source with the same position as the camera
    is used.


    If you move the shape 100 in each direction, the center of the sphere is shifted
    to (100, 100, 100) and the result is as shown below, where you should notice that
    the figure has become smaller as it is shown 100 into the screen and thus away
    from the viewer:


    ![](img/998d397bc3b3b3eb4f67343f38bad5e5_174_1.png)


