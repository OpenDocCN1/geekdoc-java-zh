  \n### final 变量\n最后的 final 静态变量通常用于定义命名常量，例如 `Integer.MAX_VALUE`，它是 int 的最大值。\n\n\
  ## 实例 final 变量\n实例 final 变量可以留空，但在获取包含 final 变量的类的对象引用之前必须初始化。因此，如果我们不在声明时进行初始化，那么可以初始化\
  \ final 变量的其他地方是：\n\n* 构造函数\n* 初始化块\n\n## 初始化块\n以下程序将无法编译，因为 final 变量没有被初始化。默认值初始化的概念不适用于\
  \ final 变量，因为它们在初始化后无法被修改。\n\n```java\nclass FinalTest3\n{\n    final int x;\n}\n\
  class MyClass\n{\n    public static void main(String args[])\n    {\n        FinalTest3\
  \ f=new FinalTest3();\n        System.out.println(f.x);\n    }\n}\n```\n（注：后续部分内容为原文重复，此处已根据逻辑进行处理）\n\
  \n\n\n\n\n在任何时刻，任何特定对象上最多只能有一个线程执行同步（synchronized）方法。这种讨论也适用于类的静态同步同步方法。\n\n注意-\
  \ `synchronized` 修饰符不适用于类或成员变量。\n\n### E. native 修饰符:-\n\n`native` 修饰符只能修饰方法。与 `abstract`\
  \ 关键字一样，`native` 表示方法体将在其他地方找到。`native` 方法的体完全位于 JVM 之外，位于一个库中。原生代码是用非 Java 语言编写的，通常是\
  \ `C` 或 `C++`，并针对单一目标机器类型进行编译。因此，违反了 Java 的平台无关性。将 Java 移植到新平台的人员需要实现大量的原生代码来支持\
  \ GUI 组件、网络通信以及广泛的其他特定平台的功能。然而，应用程序程序员和 Applet 程序员很少需要编写原生代码。\n\n### F. transient\
  \ 修饰符:-\n\n对象可以使用序列化（serialization）进行存储。序列化将对象转换为便于存储对象的输出格式。之后可以按照序列化时的相同状态检索对象，这意味着包含在序列化中的所有字段将具有与序列化时相同的值。此类对象被称为持久化对象。\n\
  \n在类声明中可以将字段指定为 `transient`，表示当类的对象被写入持久化存储器时，其值不应被保存。\n\n```java\nclass Experiment\
  \ implements Serializable {\n    transient int currentTemperature; // transient\n\
  \    double mass;                       // 持久值\n}\n```\n\n对静态变量指定 `transient` 修饰符是冗余的，因此不建议这样做。静态变量不是序列化对象持久化状态的一部分。\n\
  \n### G. volatile 修饰符\n\n在执行期间，编译后的代码可能会出于效率考虑缓存字段的值。由于多个线程可以访问同一个字段，因此确保缓存在读取和写入字段值时不导致不一致至关重要。`volatile`\
  \ 修饰符可以告知编译器它不应尝试对该字段进行优化，因为当多个线程访问该字段时，优化可能会导致不可预测的结果。\n\n![STAR-LOGO-2013](img/image024.png)\n\
  \n# 章节\n# ∞ 14 ∞\n## (包装类)\n\n### 引言\n\nJava 中的原始数据类型不是对象。如果我们想将这些数据类型作为对象使用，那么我们必须使用\
  \ `java` 包中提供的每种原始数据类型对应的包装类。\n\n有许多内置类，它们无法处理原始数据类型，因为它们只处理对象。其中一个类是 `Vector`，它用于存储对象集合。我们不能使用\
  \ `Vector` 类直接存储原始数据类型的元素集合。但我们可以通过存储与原始数据类型对应的包装类对象来实现。\n\nJava 为每种原始数据类型都有对应的包装类，如下表所示：\n\
  \n| 原始数据类型 | 包装类 |\n| :--- | :--- |\n| boolean | `Boolean` |\n| char | `Character`\
  \ |\n| byte | `Byte` |\n| short | `Short` |\n| int | `Integer` |\n| long | `Long`\
  \ |\n| float | `Float` |\n| double | `Double` |\n\n### Number 类：\n\n抽象类 `Number`\
  \ 定义了超类，由包装数值类型 `byte`、`short`、`int`、`long`、`float` 和 `double` 的类实现。`Number` 类拥有抽象方法，返回对象在不同数字格式下的值。这些方法是：\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `byteValue()` | 将指定的数字作为 byte 返回。 |\n| `shortValue()`\
  \ | 将指定的数字作为 short 返回。 |\n| `abstract int intValue()` | 将指定的数字作为 int 返回。 |\n| `abstract\
  \ long longValue()` | 将指定的数字作为 long 返回。 |\n| `abstract float floatValue()` | 将指定的数字作为\
  \ float 返回。 |\n| `abstract double doubleValue()` | 将指定的数字作为 double 返回。 |\n\n注意-\
  \ `byteValue()`、`shortValue()`、`intValue()`、`longValue()`、`floatValue()` 和 `doubleValue()`\
  \ 方法返回的值可能涉及舍入或截断。\n\n#### 示例 14.1\n\n以下示例演示了在调用 `Number` 类的方法时是如何发生舍入和截断的。\n\n\
  ```java\nclass Wrapper {\n    public static void main(String args[]) {\n       \
  \ Integer iObj = new Integer(128);\n        System.out.println(iObj.byteValue());\
  \ // 截断\n        Long lObj = new Long(123456789123456789L);\n        System.out.println(lObj);\n\
  \        System.out.println(lObj.doubleValue());\n        Float fObj = new Float(3.99f);\n\
  \        System.out.println(fObj.intValue()); // 截断\n    }\n}\n```\n\n**输出：**\n\
  ```\n-128\n123456789123456789\n1.23456789123456784E17\n3\n```\n\n#### 使用包装类的构造函数将原始数字转换为对象，以及将数值对象转换回原始数字:-\n\
  \n示例 14.2\n 以下示例演示了如何将原始类型封装在对象中，以及它们如何转换回原始类型。\n\n```java\nclass Convert {\n  \
  \  public static void main(String args[]) {\n        System.out.println(\"使用构造函数将原始数字转换为对象\"\
  );\n        byte b = 105;\n        Byte bObj = new Byte(b);\n        System.out.println(bObj);\
  \ // toString()\n        short s = 2015;\n        Short sObj = new Short(s);\n \
  \       System.out.println(sObj);\n        int i = 32717;\n        Integer iObj\
  \ = new Integer(i);\n        System.out.println(iObj);\n        long l = 23454335565675L;\n\
  \        Long lObj = new Long(l);\n        System.out.println(lObj);\n        float\
  \ f = 3.1415f;\n        Float fObj = new Float(f);\n        System.out.println(fObj);\n\
  \        double d = 3.1415;\n        Double dObj = new Double(d);\n        System.out.println(dObj);\n\
  \n        System.out.println(\"将数值对象转换为原始数字\");\n        byte b1 = bObj.byteValue();\n\
  \        short s1 = sObj.shortValue();\n        int i1 = iObj.intValue();\n    \
  \    long l1 = lObj.longValue();\n        float f1 = fObj.floatValue();\n      \
  \  double d1 = dObj.doubleValue();\n        System.out.println(b1);\n        System.out.println(s1);\n\
  \        System.out.println(i1);\n        System.out.println(l1);\n        System.out.println(f1);\n\
  \        System.out.println(d1);\n    }\n}\n```\n\n**输出：**\n```\n使用构造函数将原始数字转换为对象\n\
  105\n2015\n32717\n23454335565675\n3.1415\n3.1415\n将数值对象转换为原始数字\n105\n2015\n32717\n\
  23454335565675\n3.1415\n3.1415\n```\n\n#### 使用包装类的 toString()静态方法将原始数字转换为字符串\n\n\
  示例 14.3：\n\n```java\nclass ConvertPrimitiveToString {\n    public static void main(String\
  \ args[]) {\n        System.out.println(\"使用相应包装类的 toString() 静态方法将原始数字转换为字符串:\"\
  );\n        byte b = 105;\n        String str = Byte.toString(b);\n        System.out.println(str);\n\
  \        short s = 303;\n        str = Short.toString(s);\n        System.out.println(str);\n\
