  \ numbers to Strings using toString() method of corresponding wrapper class:\n103\n\
  203\n32000\n4544444444444\n3.1444\n4.1444\n```\n\n## 使用对应包装类的静态 `valueOf()` 方法将字符串对象（数值字符串）转换为数值对象\n\
  \n### 示例 14.5\n\n```java\nclass StringToNumericObjectDemo\n{\n    public static\
  \ void main(String args[])\n    {\n        String str=\"30\";\n        String str2=\"\
  30.333\";\n        Byte bObj=Byte.valueOf(str);\n        System.out.println(bObj);\n\
