  ## 关于作者\n\nHarry 是一位匿名黑客活动分子、全球著名的计算机程序员、畅销 Java 作者以及科学黑客专家，在计算机编程、黑客和网络安全领域拥有独特的经验。\n\
  \n他曾帮助许多国家政府和全球跨国软件公司保护其网络和安全。他编写了关于各种计算机编程语言以及计算机安全与黑客的若干书籍。\n\n他是技术软件工程师和硕士。他是\
  \ C 和 C++ 以及核心 Java 和数据结构与算法领域的领先权威。他拥有超过 5 年的软件方法论专家经验。他的教学和研究领域为人工智能、编程语言。\n\n\
  \n\n\n\n多年来的经验告诉我，许多对技术工作原理最了解的人，在以一种能让我理解的方式来解释他们所知的内容方面成功却相当有限。我的兴趣，我相信我的技能，并不在于成为一名专家，而在于成为一名教育者，以一种合理、易于消化且读起来有趣的形式呈现复杂信息，这正是我的书。\n\
  \n“什么是真实？你如何定义真实？如果你谈论的是你可以感觉到、嗅到、尝到和看到的，那么真实简单来说，就是你的大脑解释的电信号。”\n\n“……我现在才开始发现在纸上表达想法的困难性。只要它纯包含描述，那就相当容易；但一旦涉及到推理，要建立恰当的联系、清晰度和适度的流畅性，对我来说，正如我所说的，这是一个我完全没有预料到的困难……”\n\
  \n– HarrY.\n\n\n![STAR-LOGO-2013](img/image030.png)\n\n# 前言\n\n# ∞ 核心 Java 技能——轻松学会！\
  \ ∞\n\n从畅销的 Java 编程书籍作者 Harry. H. Chaudhary（销量超过 167,000 本！）那里，在短时间内学习 Java 编程的所有基础和高级特性。本\
  \ Java 指南从基础开始，通过数千行 Java 代码详细引导你进入 Java 的高级特性，我承诺这本书将使你成为 Java 专家级冠军。任何人都可以通过这本书在专家水平上学习\
  \ Java。\n\n工程类学生和职场开发者也可以这本书。这本书涵盖了所有计算机科学专业学位的常用核心大纲。如果你是认真的，请尽管开始用这本终极 Java 书来开启你的一天。\n\
  \n本 Java 书的主要目标不仅仅是给你提供 Java 编程知识，我遵循了一种模式，针对每个 Java 主题问题通过清晰的理论解释和不同的 Java 复杂度来改进数千个代码的解决方案，你将发现复杂的\
  \ Java 问题有多种解决方案。\n\n### 有何特别之处 –\n\n在书中，我为开发者和新手详细涵盖并解释了最新的 Java 8 特性的几个主题，主题如–\
  \ Lambdas、|| Java 8 函数式接口、|| Java 8 中的 Stream 和时间 API。\n\n如果你读过这本书，你就知道会有什么样的期待：一种根据你大脑工作方式设计的、视觉丰富的格式。如果你没读过，你将大大惊喜。你会看到为什么人们说它和你读过的任何\
  \ Java 书都不同。\n\n学习一门新语言并非易事，尤其是当它是像 Java 这样一种面向对象的编程语言时。你可能会认为问题出在大脑上。它似乎有自己的主意，并不总是想要接受你被迫学习的那些枯燥技术内容。事实是，你的大脑渴望新奇感。\n\
  \n它不断地寻找、扫描，等待着不寻常的事情发生。毕竟，它是为了帮助你生存而构建的。它将所有常规、普通、无味的内容过滤到背景中，这样它们就不会干扰你大脑的真正工作——记录重要的事情。你的大脑是如何知道什么是重要的？\n\
  \n本 Java 书不需要之前的编程经验。然而，如果你拥有 `C` 或 `C++` 编程背景，那么你将学得更快。\n\n正因如此，本 Java 书对几个关键特性提供了快速详细的概述。描述的内容将为你提供立足点。\n\
  \n# 章节\n\n# ∞ 1 ∞\n\n## Java 概述\n\n### 简介\n\nJava 是一种由 Sun Microsystems 在 1991 年开发的强大面向对象编程语言。Java\
  \ 最初是为消费电子设备开发的，但后来转向了互联网。现在 Java 已成为互联网最广泛使用的编程语言。Java 是一种平台无关语言（机器无关）。由 Java 开发的程序运行在世界上任何硬件或操作系统上。\n\
  \nSun Microsystems（Oracle）在 1995 年 5 月的一次大型会议上正式宣布了 Java。通常，这样的活动不会引起多少关注。然而，由于对全球的狂热，Java\
  \ 立即引起了商业界的兴趣。\n\n### Java 的需求\n\nJava 的开发是因为需要一种平台无关的语言，可用于创建嵌入到各种消费电子设备（如微波炉和遥控器）中的软件。用\
  \ `C` 和 `C++` 编写的程序针对特定的硬件和软件编译，该程序无法在任何其他硬件或软件上运行。因此，我们需要为每种类型的硬件编写 `C/C++` 编译器来编译同一个程序。但编译器的创建昂贵且耗时。因此需要平台无关的语言。这样从编译器编译的程序可以在任何硬件上运行。这种需求导致了\
  \ Java 的诞生。\n\n### Java 类库\n\nJava 程序由称为类的部分组成。类由称为方法的部分组成，方法执行任务并在完成后返回信息。你可以编写可能需要的每个部分来形成一个\
  \ Java 程序。然而，大多数 Java 程序员都会利用 Java 类库中丰富的现有类集合。类库也被称为 `Java API`（应用程序接口）。\n\n\n\n\
  \n\n在整本书中，我们讨论了许多类库。类库主要由编译器供应商提供，但许多类库由独立软件供应商（ISV）提供。此外，许多类库可以通过互联网和万维网作为免费软件或共享软件获取。你可以下载免费软件产品并免费使用，但须遵守版权所有者指定的任何限制。\n\
  \n## 典型 Java 环境的基础\n\nJava 系统通常由几个部分组成：环境、语言、Java 应用程序接口（`API`）以及各种类库。以下讨论解释了一个典型的\
  \ Java 程序开发环境，Java 程序通常通过五个阶段进行执行。这些阶段是：编辑、编译、加载、验证和执行。后续描述使用了标准的 `Java SE 7 开发工具包`（`JDK\
  \ 7`），它可以通过 `Oracle` 获取。\n\n如果你使用的是不同的 Java 开发环境，则可能需要遵循不同的步骤来编译和执行 Java 程序。在这种情况下，请查阅你的编译器的文档以获取详情。\n\
  \n**注意：** 如果你没有使用 `UNIX/Linux`、`Windows 95/98/ME` 或 `Windows NT/2000`，请参考你系统 Java\
  \ 环境的手册，或询问导师如何在你的环境中完成这些任务（该环境可能与上述环境相似）。\n\n### 阶段 1：编辑文件\n\n这是通过编辑器程序（通常称为编辑器）完成的。程序员使用编辑器输入\
  \ Java 程序，并在必要时进行修正。当程序员指定保存编辑器中的文件时，程序会被存储在次级存储设备上，如磁盘。Java 程序文件名以 `.java` 扩展结尾。\n\
  \n`UNIX/Linux` 系统上广泛使用的两个编辑器是 `vi` 和 `emacs`。在 `Windows 95/98/ME` 和 `Windows NT/2000`\
  \ 上，简单的编辑程序如 `DOS Edit` 命令和 `Windows Notepad`（Windows 记事本）就足够了。\n\nJava 集成环境（`IDEs`），如\
  \ `Forte for Java Community Edition`、`NetBeans`、`Borland’s JBuilder`、`Symantec’s\
  \ Visual Cafe` 和 `IBM’s Visual Age` 都内置了集成到编程环境中的编辑器。\n\n### Java 与 C\n\n我们假设读者知道如何编辑文件。像\
  \ `Java` 这样的语言是面向对象的——在类语言上编程被称为面向对象编程（`OOP`），它允许设计人员将面向对象的设计实现为工作系统。另一方面，`C` 等语言是过程化编程语言，因此编程倾向于以动为导向。\n\
  \n在 `C` 中，编程单元是 `function`（函数）。在 `Java` 中，编程单元是 `class`（类），最终从中实例化对象（“创建”的形象术语）。`Java`\
  \ 类包含 `methods`（实现类的行为）和 `attributes`（实现类的数据）。\n\n`C` 程序员侧重于编写函数。执行某些共同任务的操作组被组合成函数，而函数被分组形成程序。数据在\
  \ `C` 中无疑非常重要，但观点是数据主要存在是为了支持函数所执行的动作。系统规范中的动词帮助 `C` 程序员确定实现该系统所需的函数集。\n\n`Java`\
  \ 程序员专注于创建他们自己的用户定义类型，称为 `classes`（类）和 `components`（组件）。每个 `class` 包含数据以及操作这些数据的函数集。`Java\
  \ class` 的数据组件被称为 `attributes`（属性）。\n\n`Java class` 的函数组件被称为 `methods`（方法）。正如内置类型（如\
  \ `int`）的实例被称为 `variable`（变量）一样，用户定义类型（即 `class`）的实例被称为 `object`（对象）。程序员使用内置类型作为构建用户定义类型的“构建块”。\n\
  \n`Java` 的重点是 `classes`（我们从中创建对象）而不是函数。系统规范中的名词帮助 `Java` 程序员确定用于创建对象的 `classes`\
  \ 集合，这些对象将共同工作实现系统。\n\n`Classes` 之于对象，正如同蓝图之于房屋。我们可以从一张蓝图建造许多许多房屋，也可以从一个 `class`\
  \ 实例化许多个对象。`Classes` 还可以与其他 `classes` 建立关系。\n\n例如，在银行的面向对象设计中，“银行柜台人员” `class` 需要与“客户”\
  \ `class` 建立联系。这些关系被称为关联（associations）。我们将看到，当软件被封装成 `classes` 时，这些类可以在未来的软件系统中被重用。相关的类组通常被封装为可重用的组件（usable\
  \ components）。\n\n你创建的每个新 `class` 都有成为有价值的软件资产的潜力，你和其他程序员可以使用它来加速并提高未来软件开发工作的质量——这是一个令人兴奋的可能性。\n\
  \n## Java 与 C、C++ 和 C# 的关系\n\n`Java` 从 `C` 继承了语法，从 `C++` 继承了面向对象的特性。它不是 `C++` 的增强版本。`Java`\
  \ 既向上也不向下兼容 `C++`。我想告诉你们的一个重要点是，`Java` 语言的设计并不是为了取代 `C++` 和 `C#`。微软开发的另一种用于支持 `.NET\
  \ Framework` 的语言 `C#` 与 `Java` 密切相关，因为它们共享 `C++` 和 `C` 风格的语法，支持分布式编程，并使用相同的对象模型。\n\
  \n## Java 的主要目标是实现\n\n### 1. 安全\n当我们使用兼容 Java 的浏览器时，没有病毒感染的威胁。此外，没有恶意程序从本地收集收集信息（如信用卡号、银行账户余额和密码）的威胁。`Java`\
  \ 在网络应用程序和我们的计算机之间提供了防火墙。\n\n### 2. 可移植性\n`Java` 程序可以在运行不同操作系统和不同硬件的计算机之间进行移植。\n\
  \n### 3. Java 字节码\nJava 编译器的输出是字节码而非机器码（`.class` 文件）。字节码是一种高度优化的指令集，设计用于由 Java 运行时执行，即\
  \ `JVM`（Java 虚拟机）。\n\n`JVM` 是解释字节码的解释器。编译程序运行更快，但 Java 为了实现可移植性仍使用解释器，因此程序稍慢。这有助于提高安全性，因为每个\
  \ Java 程序的执行都在 `JVM` 的控制之下。\n\n### JIT（即时编译）\n`JIT` 是 `JVM` 用于将字节码转换为实际机器码的翻译器。它不翻译整个字节码，而是按需进行翻译。\n\
  \n## Java 的各个版本\n\n- Java 1：`JDK 1.0`、`JDK 1.1`\n- Java 2：`JDK 1.2`、`JDK 1.3`、`JDK\
  \ 1.4`、`JDK 1.5` 或 `JDK 5`、`JDK 1.6` 或 `JDK 6`\n- Java 1.7：`JDK 1.7` 或 `SE 7`\n\
  - Java SE 8（Java 8，2014 年 4 月）\n\n**注意 1：** `JDK`（Java 开发工具包）\n**注意 2：** 旧 Java\
  \ 版本的许多功能已被新 Java 版本弃用，但我们仍然可以使用它们。\n\n## Java 可以开发的应用程序类型\n\n1. **独立应用程序（Standalone\
  \ Applications）：** 独立应用程序是运行在我们本地计算机上、在该操作系统下的程序，类似于 `C` 或 `C++` 程序。\n2. **Applet（小程序）：**\
  \ `applet` 是一种跨越互联网传输并在客户端机器上兼容 Java 的浏览器（如 `Internet Explorer` 或 `Netscape Navigator`）中执行的小型程序。\n\
  \n`applet` 不能像独立应用程序一样执行。`applet` 只能通过嵌入 HTML 页面来执行，类似于声音文件、图像文件或视频片段。\n\n\n\n\n\
  现在，这个嵌入了 applet 的 HTML 页面可以在本地机器上的网络浏览器下载此类 HTML 页面后运行。applet 是一种可以响应用户输入并进行动态更改的程序。它不会反复重复地播放相同的动画或声音。\n\
  \n### 1. Web 应用程序\n这些是运行在 Web 服务器上的程序。当我们通过在浏览器中指定 `URL`（通用资源定位符）访问网站时，网络浏览器会向 Web\
  \ 服务器发送针对特定网站的请求。在收到此请求后，服务器会运行一个程序，该程序被称为 Web 应用程序。我们使用 `Java Servlets` 和 `JSP`（Java\
  \ 服务端页面）来编写此类程序。\n\n这些程序运行在服务器上，然后将结果/响应发送给客户端。`JSP` 页面可以被视为 HTML 和 Java 代码的结合。Web\
  \ 服务器在执行之前会将 `JSP` 页面转换为 `Java Servlets`。\n\n当客户端请求特定的 `URL` 且该 `URL` 对应于 HTML 页面时，Web\
  \ 服务器直接将 HTML 页面返回给客户端，由客户端进行显示。如果 `URL` 对应于 servlet 或 `JSP`，则会在服务器上执行，并将结果/响应返回给客户端，由客户端进行显示。\n\
  \n### 2. 分布式应用程序\nJava 被分为若干运行在独立机器上的小程序。这些程序中使用的对象可以相互通信。这些应用程序被称为分布式应用程序。这允许两台不同计算机上的对象远程执行过程。为此，我们使用了\
  \ `RMI`（远程方法调用）。\n\n––––––\n\n## Java 的特性：\n\n### 1. 简单\nJava 的语法与 `C` 和 `C++` 几乎相似，因此熟悉\
  \ `C/C++` 的程序员不需要从头开始学习语法。但 `C/C++` 中许多既复杂又可能导致歧义的特性在 Java 中被删除了。\n\n1. Java 不支持多重继承，因为这个概念比较复杂并可能导致歧义。\n\
  2. Java 不支持全局变量，这也导致了 `C/C++` 程序中出现许多 bug。\n3. Java 不使用指针，也不允许指针算术，由于固有的复杂性，这是 `C/C++`\
  \ 程序中大多数 bug 的成因。\n4. Java 不支持运算符重载，因为它可能导致混淆。\n5. Java 中没有垃圾值的概念。我们必须在使用变量之前对其初始化。\n\
  \n### 2. 安全\nJava 程序运行在 `JVM`（Java 虚拟机）内部，其他部分无法访问它们。这极大地提高了安全性。由于这一特性，Java 程序很少挂起。这与频繁挂起的\
  \ `C/C++` 程序完全不同。Java 的安全模型有三个主要组件：\n\n1. 类加载器。\n2. 字节码验证器。\n3. 安全管理器。\n\nJava 使用不同的类加载器从本地机器和远程机器加载类文件（可执行文件）。从远程机器加载的类（如\
  \ `Applet` 类）不允许读取或写入本地机器上的文件。这防止了恶意程序损坏本地文件系统。字节码验证器在类加载器完成后立即验证字节码。它确保字节码是有效的\
  \ Java 代码。它几乎消除了 Java 程序执行某些恶意活动的可能性，如访问 `JVM` 外部内存。`Security Manager` 控制文件删除、线程创建等关键操作。这些操作是被允许的。\n\
  \n### 3. 可移植\nJava 使用不同的类加载器从本地机器和远程机器加载类文件（可执行文件）。从远程机器加载的类（如 `Applet` 类）不允许读取或写入本地机器上的文件。这防止了恶意程序损坏本地文件系统。字节码验证器在类加载器完成后立即验证字节码。它确保字节码是有效的\
  \ Java 代码。它几乎消除了 Java 程序执行某些恶意活动的可能性，如访问 `JVM` 外部内存。`Security Manager` 控制文件删除、线程创建等关键操作。这些操作是被允许的。\n\
