  \ 类通过 `synchronized` 代码块提供了线程间通信，通过以下方法：\n\n8. `final void wait(long timeout)`：当前线程等待直到另一个线程调用\
  \ `notify()` 或 `notifyAll()`。\n9. `final void wait(long timeout, long nanos) throws\
  \ InterruptedException`：当前线程等待直到另一个线程调用 `notify()` 或 `notifyAll()` 方法，或者指定的时间已过。\n\
  10. `final void notify()`：唤醒等待对象监视器的单个线程。\n11. `final void notifyAll()`：唤醒等待对象监视器的所有线程。线程通过调用\
  \ `wait` 方法在对象监视器上等待。![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)\n\
  \n# 第 13 章\n# 21\n# 集合框架 (Collection Framework)\n\n### 引言\n\nJava 集合框架标准化了处理组的方式。在\
  \ Java2 之前，提供了如 `Vector`、`Dictionary`、`Hashtable` 和 `Properties` 类来存储和操作对象。尽管这些类非常有用，但它们缺乏一个统一的主题。我们使用\
  \ `Vector` 的方式并不相同，而且之前的方法并不易于扩展或适应。为了解决这些问题，集合框架的设计考虑了以下目标：\n\n* 集合框架必须是高性能的。基础集合（动态数组、链表、哈表）是高效的。\n\
  * 集合框架允许不同类型的集合以相似的方式工作，并具有高度的互操作性。\n* 集合框架必须易于扩展。\n\n为了实现上述目标，集合框架围绕一组标准接口进行设计。这些接口提供了多种实现。我们也可以实现自己的集合。\n\
  * 集合框架的另一个项是 `Iterator` 接口。它提供了一种通用的、标准化的访问集合元素的方法。因此，`Iterator` 提供了遍历集合的内容。因为每个集合类都可以实现\
  \ `Iterator`，这使得代码只需微小的改动就可以遍历列表，例如。除了集合之外，框架定义了多个映射接口和类。这些映射存储键值对。尽管在术语的正确使用上，它们不是“集合”，但它们是完全集成的。\n\
