  \ 0，下一个在索引 1。如果索引无效将抛出 `IndexOutOfBoundsException`。`String s1 = \"matrix\"; System.out.println(s1.charAt(0));\
  \ // 将打印 \"m\"` |\n| 12 | `public void getChars(int srcBegin, int srcEnd, char[]\
  \ dst, int dstBegin)` | 将字符串中的字符复制到目标数组。要拷贝的第一个字符位于索引 `srcBegin`，最后一个字符位于索引 `srcEnd-1`（该方法可能会抛出\
  \ `ArrayIndexOutOfBoundsException` 和 `IndexOutOfBoundsException`）。 |\n| 13 | `public\
  \ void getBytes(int srcBegin, int srcEnd, byte[] dst, int dstBegin)` | |\n| 14 |\
  \ `public byte[] getBytes()` | 使用默认集将此字符串编码为字节序列。对于不支持 16 位 Unicode 的环境非常有用。 |\n\
  | 15 | `public boolean equals(Object obj)` | 将调用字符串与指定对象。如果参数不为空且是一个与调用字符串表示相同字符序列的\
  \ `String` 对象，则为 true。 |\n| 16 | `public boolean equalsIgnoreCase(String anotherString)`\
  \ | 忽略大小写比较两个字符串。 |\n| 17 | `public int compareTo(String str)` | 按字典顺序比较调用字符串与传入的字符串。返回值：`<0`\
  \ 表示调用字符串小于 str，`>0` 表示调用字符串大于 str，`0` 表示两个字符串相等。 |\n| 18 | `public int compareIgnoreCase(String\
  \ anotherString)` | 忽略大小写比较两个字符串。 |\n| 19 | `public boolean regionMatches(int startIndex,\
  \ String str2, int str2StartIndex, int len)` | 测试两个字符串区域是否相等。 |\n| 20 | `public\
  \ boolean regionMatches(Boolean ignoreCase, int startIndex, String str2, int str2StartIndex,\
  \ int len)` | 测试两个字符串区域是否相等。如果 `ignoreCase` 标志为 true，则忽略大小差异。 |\n| 21 | `public\
  \ boolean startsWith(String prefix, int startIndex)` | 测试字符串是否从指定索引开始以指定的前缀开头。该方法不返回异常，如果\
