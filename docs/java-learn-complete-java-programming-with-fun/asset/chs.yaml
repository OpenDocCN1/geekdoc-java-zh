  ## (Scanner 类与数组)\n## (命令行参数)\n\n### 引言\n\n### Scanner 类\n这是 Java 在 JDK1.5-6-7 版本中新增的新类，用于从用户获取基本数据类型的输入。使用此类获取输入非常简单，因为我们只需要创建该类的对象并调用特定方法。该类位于\
  \ `java.util` 包中。\n\n| `public java.util.Scanner(java.io.InputStream);` |\n| `public\
  \ java.util.Scanner(java.io.File) throws java.io.FileNotFoundException;` |\n| `public\
  \ java.util.Scanner(java.lang.String);` |\n| `public void close();` |\n| `public\
  \ boolean hasNext();` |\n| `public java.lang.String next();` 输入不包含任何空格的字符串。 |\n\
  | `public java.lang.String nextLine();` 输入可能包含空格的字符串。 |\n| `public boolean hasNextBoolean();`\
  \ |\n| `public boolean nextBoolean();` |\n| `public boolean hasNextByte();` |\n\
  | `public byte nextByte();` |\n| `public boolean hasNextShort();` |\n| `public short\
  \ nextShort();` |\n| `public boolean hasNextInt();` 检查输入缓冲区中的下一个值是否为 int。 |\n| `public\
  \ int nextInt();` 输入一个整数值。 |\n| `public boolean hasNextLong();` |\n| `public long\
  \ nextLong();` |\n| `public boolean hasNextFloat();` |\n| `public float nextFloat();`\
  \ |\n| `public boolean hasNextDouble();` |\n| `public double nextDouble();` |\n\n\
  #### 示例 4.1\n```java\nimport java.util.*;\nclass SumInput\n{\n    public static\
  \ void main(String args[])\n    {\n        Scanner sc=new Scanner(System.in);\n\
  \        int a,b,sum;\n        System.out.print(\"Enter Ist number\");\n       \
  \ a = sc.nextInt();\n        System.out.print(\"Enter 2nd number\");\n        b\
  \ = sc.nextInt();\n        sum = a+b;\n        System.out.println(\"Sum is \" +\
  \ sum);\n    }\n}\n```\n输出:\n```\nEnter Ist number 45\nEnter 2nd number 55\nSum\
  \ is 100\n```\n\n## 数组\n\nJava 中的数组是相同类型变量或数据项的有序集合。Java 允许任意维度的数组。Java 数组与 C/C++\
  \ 有不同。我们不能在声明时指定数组的大小。内存分配始终是动态的。Java 中的每个数组都被视为一个对象，具有一个特殊的属性 `length`，该属性指定数组中的元素个数。\n\
  \n### 1. 一维数组\n\n#### 声明\n`type array_name[];` // 声明时不进行内存分配。\n或\n`type [] array_name;`\n\
  \n需要注意的是，声明并没有实际创建数组。它只是声明了一个可以指向数组对象的引用。\n`int a1 [], a2 ;` \n`int [] a3, a4 ;`\n\
  \n这两个声明将 `a1`、`a3` 和 `a4` 声明为指向 `int` 数组的引用变量，但变量 `a2` 不能指向 `int` 值的数组。它仅仅是一个 `int`\
  \ 变量。当 `[]` 符号紧跟类型之后时，声明中的所有变量都是数组。否则，`[]` 符号必须跟随声明中的每个单独变量名。\n\n#### 使用 new 运算符进行内存分配\n\
  `array_name = new type[SIZE];` // `SIZE` 可以是常量或变量。\n\n![image](img/image036.png)\n\
  \n**注意 1**- 数组的所有元素将自动初始化为零，但为了用不同的值初始化数组，可以在声明本身中初始化。数组的声明、内存分配和初始化步骤可以合并为一个：`int\
  \ a[]={5,7,1};`\n\n**注意 2**- 数组索引从零开始。\n\n**注意 3**- 在 Java 中，所有数组将分配的大小存储在一个名为 `length`\
  \ 的变量中。我们可以通过属性 `length` 访问数组长度：“`array_name.length`”。\n\n**注意 4**- `int a[],b[];`\n\
  `a = b = new int[5];`\n在上述步骤中，`new` 只创建了一个数组，该数组引用首先存储在 `b` 中，然后是 `a`。因此 `a` 和 `b`\
  \ 都指向同一个数组。赋值引用不会创建副本。\n\n#### 示例 4.2 数组中存储的所有数字之和\n```java\nclass SumArr\n{\n \
  \   public static void main(String args[])\n    {\n        int a[]={10,50,20,40,30};\n\
  \        int n=a.length,sum=0;\n        for(int i=0;i<n;i++)\n            sum+=a[i];\n\
  \        System.out.println(\"Sum of numbers is \" + sum);\n    }\n}\n```\n输出： `Sum\
  \ of numbers is 150`\n\n#### 示例 4.3 使用选择排序排序数组的程序\n```java\nimport java.util.Scanner;\n\
  class Sort\n{\n    public static void main(String args[])\n    {\n        int n;\n\
  \        Scanner sc = new Scanner(System.in);\n        System.out.println(\"Enter\
  \ many elements\");\n        n = sc.nextInt();\n        int a[] = new int[n];\n\
  \        //input array\n        for(int i=0;i<n;i++)\n// ... (此处省略后续逻辑)\n    }\n\
  }\n```\n\n### 2. 二维数组\n\n#### 声明\n`type array_name[];`\n或\n`type[][] array_name;`\n\
  \n#### 内存分配\n`array_name = new type[ROWS][COLUMNS];` // `ROWS` & `COLUMNS` 可以是常量\n\
  \n到为止我们讨论了可以存储值的数组变量。考虑以下表格，显示值。\n\n#### 示例 4.4 打印矩阵转置的程序\n```java\nimport java.util.*;\n\
  class Transpose\n{\n    public static void main(String args[])\n    {\n        Scanner\
  \ sc=new Scanner(System.in);\n        int r,c;\n        System.out.print(\"Enter\
  \ many rows\");\n        r=sc.nextInt();\n        System.out.print(\"Enter many\
  \ cols.\");\n        c=sc.nextInt(); \n        int m[][]=new int[r][c];\n      \
  \  //input\n        for(int i=0;i<r;i++)\n            for(int j=0;j<c;j++)\n   \
  \         {\n                System.out.print(\"Enter\" + (i+1) + \",\" +(j+1));\n\
  \                m[i][j]=sc.nextInt();\n            }\n        //transpose\n   \
  \     for(int i=0;i<c;i++)\n        {\n            for(int j=0;j<r;j++)\n      \
  \          System.out.print(m[j][i])\"\\t\");\n            System.out.println();\n\
  \        }\n    }\n}\n```\n\n#### 示例 4.5 将两个矩阵相乘到第三个矩阵的程序\n```java\nimport java.util.*;\n\
  class MatrixMult\n{\n    public static void main(String args[])\n    {\n       \
  \ Scanner sc=new Scanner(System.in);\n        int r1,c1;\n        System.out.print(\"\
  Enter many rows\");\n        r1=sc.nextInt();\n        System.out.print(\"Enter\
  \ many cols.\");\n        c1=sc.nextInt();\n        int r2,c2;\n        System.out.print(\"\
  Enter many rows\");\n        r2=sc.nextInt();\n        System.out.print(\"Enter\
  \ many cols.\");\n        c2=sc.nextInt();\n        if(c1 != r2)\n        {\n  \
  \          System.out.println(\"Can't mult\");\n            System.exit(1);\n  \
  \      }\n        int m1[][]=new int[r1][c1];\n        //input m1\n        for(int\
  \ i=0;i<r1;i++)\n// ... (后续逻辑省略)\n    }\n}\n```\n\n\n\n\n\n```java\nfor(int j=0;j<c1;j++)\
  \ {\n    System.out.print(\"Enter\" + \"element \" + (i+1) + \",\" + (j+1));\n \
  \   m1[i][j]=sc.nextInt();\n}\nint m2[][]=new int[r2][c2];\n//输入 m2\nfor(int i=0;i<r2;i++)\n\
  \    for(int j=0;j<c2;j++) {\n        System.out.print(\"Enter\" + \"element \"\
  \ + (i+1) + \",\" +(j+1));\n        m2[i][j]=sc.nextInt();\n    }\nint m3[][]=new\
  \ int[r1][c2];\n//矩阵乘法\nfor(int i=0;i<r1;i++)\n    for(int j=0;j<c2;j++)\n     \
  \   for(int k=0;k<c1;k++)\n            m3[i][j]+=m1[i][k]*m2[k][j];\n//输出 m3\nfor(int\
  \ i=0;i<r1;i++) {\n    for(int j=0;j<c2;j++)\n        System.out.print(m3[i][j]+\"\
  \\t\");\n    System.out.println();\n}\n```\n\n### 3. 变长数组\n\n数组将多维数组处理为“数组的数组”，可以按照如下方式声明二维数组：\n\
  \n```java\nint arr[ ] [ ] = new int [4][ ];\narr[0] = new int [1];\narr[1] = new\
  \ int [2];\narr[2] = new int [3];\narr[3] = new int [4];\n```\n\n这意味着数组总共有 4 行，其列从\
  \ 1 开始并逐个递增。因此，它们在内存中的表示如下：\n\n![image](img/image021.png)\n（内存分配）\n\n**注意 1** -\
  \ 数组的所有元素都将自动初始化为零，但如果想用不同的值初始化数组，可以在声明本身时进行。数组的声明、内存分配和初始化步骤可以合并为一步：\n\n```java\n\
  int a[][]={  {5,7,1}, {1,7,9}, {4,5,7}, {1,1,1} };\n```\n\n**注意 2** - 在上述数组中，`a.length`\
  \ 将显示行数，即 4；`a[0].length` 将显示第 $0^{th}$ 行的列数，即 3\n\n### 命令行参数\n\n有时我们希望在运行程序时向程序传递信息。这是通过将命令行参数传递给\
  \ `main()` 实现的。命令行参数是在执行程序时直接跟在命令行程序名称后面的信息。\n\n要在 Java 程序内部访问命令行参数，我们必须使用传递给 `main()`\
  \ 的 `String` 数组。\n\n`JVM` 调用 `main()` 方法并将命令行参数作为字符串数组传递给它。数组的长度（即命令行参数的数量）是通过上述示例中的\
  \ `length` 属性获取。\n\n`for` 循环在控制台/显示器上显示命令行参数。\n\n#### 示例 4.6 从命令行参数输入名称的程序。\n\n\
  ```java\nclass Hello {\n    public static void main(String args[]) {\n        for(int\
  \ i=0;i<args.length;i++)\n            System.out.println(\"Hello \" + args[i]);\n\
  \    }\n}\n```\n```bash\njavac Hello.java\njava Hello Ravi Ajay Vijay\n```\n**输出：**\n\
  ```\nHello Ravi\nHello Ajay\nHello Vijay\n```\n\n#### 示例 4.7 打印通过命令行参数输入的数字之和的程序。\n\
  \n```java\nclass SumCmd {\n    public static void main(String args[]) {\n      \
  \  int sum=0;\n        for(int i=0;i<args.length;i++)\n            sum+=Integer.parseInt(args[i]);\n\
  \        System.out.println(\"Sum is \" + sum);\n    }\n}\n```\n```bash\njavac SumCmd.java\n\
  java SumCmd 5 6\n```\n**输出：**\n```\nSum is 11\n```\n\n#### 示例 4.8 排序从命令行输入数组的程序。\n\
  \n```java\nclass SortCmd {\n    public static void main(String args[]) {\n     \
  \   int n=args.length;\n        int a[]=new int[n];\n        for(int i=0;i<n;i++)\n\
  \            a[i] = Integer.parseInt(args[i]);\n        for(int i=0;i<n-1;i++)\n\
  \            for(int j=i+1;j<n;j++)\n                if(a[i]>a[j]) {\n         \
  \           int t=a[i];\n                    a[i]=a[j];\n                    a[j]=t;\n\
  \                }\n        for(int i=0;i<n;i++)\n            System.out.print(a[i]+\"\
  \\t\");\n    }\n}\n```\n```bash\njavac SortCmd.java\njava SortCmd 5 4 1 3 2\n```\n\
  **输出：**\n```\n1 2 3 4 5\n```\n\n### 单选题\n\n1. 如果 `MyProg.java` 被编译为应用程序并从命令行作为 `java\
  \ MyProg` 运行，那么 `main()` 方法中的 `args.length` 的值是：\nA. MyProg\nB. 0\nC. 1\nD. \n\n\
  2. 在声明 `char[] c = new char[10];` 后，`c` 的值是：\nA. 0\nB. 50\nC. null\nD. 报错\n\n3.\
  \ 下列哪项关于多维数组的声明是正确的？\nA. `int[][] a = new int[5][5];`\nB. `int a[][] = new int[5][5];`\n\
  C. `int a[][][] = new int[5][];`\nD. 以上都是正确的\n\n4. 关于 Java 命令行参数，下列哪说法错误的是？\nA.\
  \ 命令行参数通过 `main()` 方法传递。\nB. 命令行参数是 `String` 数组类型。\nC. 命令行参数直接跟在程序名后面。\nD. 命令行参数的数量通过\
  \ `length` 属性获取。\n\n5. 下列关于 Java 类和对象的描述中，正确的是？\nA. 类是逻辑上的构造。\nB. 对象是物理上的实在。\nC.\
  \ 类在声明时创建对象。\nD. 以上都是正确的。\n\n\n\n\n\n在 `s2` 中进行的任何更改也将反映在 `s1` 中。这种赋值不会进行任何内存分配。几步之后，如果我们在\
  \ `s1` 中赋值 `null`，那么该对象将不会被销毁，因为它的引用指向对象 `s2`。但如果 `s1` 和 `s2` 都被赋值为 `null`，那么该对象将被垃圾回收器销毁，该对象占用的内存将被释放。\n\
  \n### 示例 5.1 只包含成员变量的类。\n\n```java\nclass A\n{\n    int x;\n    int y;\n}\nclass\
  \ ClassTest1\n{\n    public static void main(String args[])\n    {\n        A a1,a2;\
  \  //引用变量\n        a1 = new A();  //创建对象\n        a2 = new A();\n        a1.x =\
  \ 10;\n        a1.y = 20;\n        a2.x = 5;\n        a2.y = 6;\n        System.out.println(a1.x\
  \ + \"\\t\" + a1.y);\n        System.out.println(a2.x + \"\\t\" + a2.y);\n    }\n\
  }\n```\nOutput:\n```\n10  20\n5  6\n```\n\n### 示例 5.2 包含成员变量和成员方法的类。\n\n```java\n\
  class A\n{\n    private int x;\n    private int y;\n    void setdata(int x1, int\
  \ y1)\n    {\n        x = x1;\n        y = y1;\n    }\n    void display()\n    {\n\
  \        System.out.println(x + \"\\t\" + y);\n    }\n}\nclass ClassTest2\n{\n \
  \   public static void main(String args[])\n    {\n        A a1 = new A();\n   \
  \     A a2 = new A();\n        //a1.x=10;  // 因为 x 是私有的，报错\n        a1.setdata(10,20);\n\
  \        a2.setdata(5,7);\n        a1.display();\n        a2.display();\n    }\n\
  }\n```\nOutput:\n```\n10  20\n5  7\n```\n\n注- 我们既可以在类外部也可以在类内部声明类的对象。\n\n### 示例\
  \ 5.3 在类内部定义自身的类对象。\n\n```java\nclass A\n{\n    private int x;\n    private int\
  \ y;\n    void setdata(int x1, int y1)\n    {\n        x = x1;\n        y = y1;\n\
  \    }\n    void display()\n    {\n        System.out.println(x + \"\\t\" + y);\n\
  \    }\n    public static void main(String args[])\n    {\n        A a1 = new A();\n\
  \        A a2 = new A();\n        a1.setdata(10,20);\n        a2.setdata(5,7);\n\
  \        a1.display();\n        a2.display();\n    }\n}\n```\nOutput:\n```\n10 \
  \ 20\n5  7\n```\n\n### 类成员的修饰符 / 可见性标签-\n\n可见性修饰符仅适用于类的成员，而不适用于局部变量。\n\n- `private`:\
  \ 如果我们在成员变量或方法上指定 `private` 修饰符，那么该成员在声明它的类外部是不可见的。这将向其他类隐藏该类的成员。\n- `public`: 如果我们在成员变量或方法上指定\
  \ `public` 修饰符，那么该成员对所有类都可见。该成员甚至在包外也可以被访问。`main()` 方法始终定义为 `public`，因为 `main()`\
  \ 方法是由 `JVM` 访问的，而 `JVM` 在定义 `main()` 的类之外。\n- `protected`: 定义为 `protected` 的成员可以从属于同一个包的所有类访问。受保护的成员也可以从其他包的任何类访问。\n\
  - `default / 无修饰符`: 如果在成员之前没有指定可见性修饰符，则该成员可以从同包内的所有类访问。该成员无法在包外访问。\n\n#### 类或接口的可见性修饰符\n\
  \n- `public`: 如果一个类对所有包的类都可见，则它必须声明为 `public`。\n- `default / 无修饰符`: 如果没有指定可见性修饰符，则该类仅对同包内的类可见。\n\
  \n### 实例变量隐藏\n\n当局部变量与实例变量同名时，局部变量会隐藏实例变量。通过 `this` 关键字可以显式地引用实例变量。\n\n### 示例 5.4\
  \ `this` 关键字的使用\n\n```java\nclass A\n{\n    private int x;\n    private int y;\n\
  \    void setdata(int x, int y)\n    {\n        this.x = x;  //this.x 是类成员，x 是局部变量\n\
  \        this.y = y; \n    }\n    void display()\n    {\n        System.out.println(x\
  \ + \"\\t\" + y);\n    }\n}\nclass ClassTest4\n{\n    public static void main(String\
  \ args[])\n    {\n        A a1 = new A();\n        A a2 = new A();\n        a1.setdata(10,20);\n\
  \        a2.setdata(5,7);\n        a1.display();\n        a2.display();\n    }\n\
  }\n```\nOutput:\n```\n10  20\n5  7\n```\n\n### 方法重载\n\n只要参数的数量、类型或顺序不同，我们就可以拥有多个同名的方法。这被称为方法重载。在调用重载方法时，传入的实际参数类型可能与任何重载方法的形式参数不完全匹配。在这种情况下，参数将提升到更高类型，直到找到匹配。如果在提升参数后仍未找到匹配，则会发生编译错误。\n\
  \n### 示例 5.5 在此示例中，有两个相同的 `setdata()` 方法但参数不同，因此这是方法重载。\n\n```java\nclass A\n{\n\
  \    private int x,y;\n    void setdata(int x1)\n    {\n        x = y = x1;\n  \
  \  }\n    void setdata(int x1, int y1)\n    {\n        x = x1;\n        y = y1;\n\
  \    }\n    void display()\n    {\n        System.out.println(x + \"\\t\" + y);\n\
  \    }\n}\nclass ClassTest5\n{\n    public static void main(String args[])\n   \
  \ {\n        A a1 = new A();\n        a1.setdata(5);\n        a1.display();\n  \
  \      A a2 = new A();\n        a2.setdata(10,20);\n        a2.display();\n    }\n\
  }\n```\nOutput:\n```\n5  5\n10  20\n```\n\n#### 构造函数\n\n\n\n\n\n## 默认构造函数\n每个类都有一个默认构造函数（如果没有定义显式构造函数），它不接受任何参数，且其体体不包含任何语句。编译器会自动生成默认构造函数。\n\
  \n一旦我们添加了自己的构造函数，编译器就会停止生成默认构造函数。如果我们不在类中创建任何构造函数，`JVM` 将创建默认构造函数，并用默认值 `null` 或零初始化实例变量。\n\
  \n### 示例 5.6 默认构造函数的用法\n```java\nclass A {\n    private int x;\n    private int\
  \ y;\n    void display() {\n        System.out.println(x + \"\\t\" + y);\n    }\n\
  }\nclass ClassTest6 {\n    public static void main(String args[]) {\n        A a1\
  \ = new A();\n        a1.display();\n    }\n}\n```\n**输出：**\n```\n0  0\n```\n**注意：**\
  \ 在这里我们没有创建任何构造函数因此 `JVM` 在创建对象后会自动创建默认构造函数，并将实例变量初始化为 `0` 或 `null`。\n\n## 默认零参数构造函数\n\
  我们可以用自己的零参数构造函数来替换默认构造函数。这将允许我们将实例变量初始化为任何值。\n\n## 参数化构造函数\n带有参数的构造函数被称为参数化构造函数。\n\
  \n**注意：** 可以像方法一样重载构造函数。这被称为构造函数重载。\n\n### 示例 5.7 构造函数的用法\n```java\nclass A {\n\
  \    private int x;\n    private int y;\n    A() //零参数构造函数 {\n        x = y = 0;\n\
  \    }\n    A(int x1) //参数化单参数构造函数 {\n        x = y = x1;\n    }\n    A(int x1,\
  \ int y1) //参数化双参数构造函数 {\n        x = x1;\n        y = y1; \n    }\n    void display()\
  \ {\n        System.out.println(x + \"\\t\" + y);\n    }\n}\nclass ClassTest7 {\n\
  \    public static void main(String args[]) {\n        A a1 = new A();\n       \
  \ a1.display();\n        A a2 = new A(5);\n        a2.display();\n        A a3 =\
  \ new A(4,7);\n        a3.display();\n    }\n}\n```\n**输出：**\n```\n0  0\n5  5\n\
  4  7\n```\n\n### 示例 5.8:\n```java\nimport java.util.Scanner;\nclass Complex {\n\
  \    private int real,imag;\n    Complex()//零参数构造函数 {\n        real=imag=0;\n  \
  \  }\n    Complex(int real, int imag) {\n        this.real=real;\n        this.imag=imag;\n\
  \    }\n    void getdata() {\n        Scanner sc=new Scanner(System.in);\n     \
  \   System.out.print(\"Enter real\");\n        real=sc.nextInt();\n        System.out.print(\"\
  Enter imag\");\n        imag=sc.nextInt();\n    }\n    void display() {\n      \
  \  if(imag>=0)\n            System.out.println(real+\"+\"+imag+\"i\");\n       \
  \ else\n            System.out.println(real+\"\"+imag+\"i\");\n    }\n    Complex\
  \ sum(Complex c) {\n        Complex t=new Complex();\n        t.real=real+c.real;\n\
  \        t.imag=imag+c.imag;\n        return t;\n    }\n    Complex mult(Complex\
  \ c) {\n        Complex t=new Complex();\n        t.real=real*c.real;\n        t.imag=imag*c.imag;\n\
  \        return t;\n    }\n    public static void main(String args[]) {\n      \
  \  Complex c1=new Complex();\n        Complex c2=new Complex();\n        Complex\
  \ c3=null,c4=null;\n        c1.getdata();\n        c2.getdata();\n        c3=c1.sum(c2);\n\
  \        System.out.print(\"Sum is \");\n        c3.display();\n        c4=c1.mult(c2);\n\
  \        System.out.print(\"Product is \");\n        c4.display();\n    }\n}\n```\n\
  \n## finalize() 方法\n有时对象在被销毁时需要执行某些操作。例如，如果一个对象持有某些非 Java 资源（如文件句柄），我们可能希望在对象被销毁之前确保这些资源被释放。为了处理此类情况，Java\
  \ 提供了一种名为终化（finalization）的机制。通过终化，我们可以定义对象即将被垃圾回收器回收时发生的特定操作。`finalize()` 只在垃圾回收之前被调用。它在对象超出范围时不会被调用。\n\
  \n```java\nprotected void finalize() {\n    // 此处编写终化代码\n}\n```\n**注意：** 除了 `protected`\
  \ 修饰符外，我们也可以使用 `public`。\n\n## 变量类型\nJava 有三种变量：\n\n### 1. 实例变量\n在类中声明且位于所有方法之外的变量被称为实例变量。该变量的副本数量与对象的数量相同。在\
  \ Java 中，不需要手动显式地初始化实例变量，因为这些变量在对象创建并使用 `new` 运算符分配内存时就会被初始化。\n变量根据其类型进行初始化。所有数值变量都自动初始化为\
  \ `0`，布尔变量初始化为 `false`，引用变量（对象）初始化为 `null` 值。\n我们可以通过对象名和 `.` 运算符来访问这些变量。\n\n###\
  \ 2. 局部变量\n在方法内部声明的变量被称为局部变量。它们与实例变量不同。局部变量不会自动初始化。\n\n### 3. 静态变量\n静态变量也声明在方法之外，与实例变量类似，但它们使用了\
  \ `static` 修饰符。静态变量对于类是全局的（对于所有实例）。它们对于跟踪全局状态非常有用。例如，类中的静态变量 `count` 可以存储程序中创建的实例数量。无论程序创建了多少实例，静态变量只有一份拷贝，并在实例间共享。可以使用\
  \ `.` 运算符访问类变量，但也可以通过类名访问静态变量。如果我们声明不同的对象，它们也会指向同一个静态变量。静态变量在类加载/使用时会被初始化为默认值（零、`false`\
  \ 或 `null`）。它们只能调用其他静态方法，只能访问静态数据。它们无法以方式引用 `this` 或 `super`。\n\n### 示例 5.9\n```java\n\
  class A {\n    int x; //实例变量\n    static int y; //静态变量或类变量\n}\nclass ClassTest8\
  \ {\n    public static void main(String args[]) {\n        A a1 = new A();\n   \
  \     A a2 = new A();\n        A a3 = new A();\n        a1.x = 10;\n        a1.y\
  \ = 20;\n        a2.x = 11;\n        a2.y = 21;\n        a3.x = 12;\n        a3.y\
  \ = 22;\n        System.out.println(a1.x + \"\\t\" + a1.y);\n        System.out.println(a2.x\
  \ + \"\\t\" + a2.y);\n        System.out.println(a2.x + \"\\t\" + a3.y);\n    }\n\
  }\n```\n**输出：**\n```\n10  22\n11  22\n12  22\n```\n\n## 方法类型\n1. 实例方法。\n2. 静态方法。\n\
  \n### 实例方法\n这些方法与 C++ 函数相同。实例方法只能通过对象调用。如果在同一类的静态方法内部调用实例方法，也必须使用对象名。\n\n\n\n\n\
  静态方法可以使用对象或类名来调用。静态方法只能访问静态成员。静态方法可以从同一类的静态方法中直接调用（无需使用对象或类名）。\n\n### 示例 5.10\n\n\
  ```java\nclass A\n{\n    int x;\n    static int y;\n    static int sum(int a, int\
  \ b)\n    {\n        //y = 5; 无错误，静态方法可以访问静态变量\n        //x = 10; 错误，静态方法无法访问实例变量\n\
  \        //A a1 = new A();\n        //a1.x = 10; 无错误，因为静态方法可以通过对象访问实例变量\n      \
  \  //this.x = 10; 错误，因为静态方法无法访问 this 或 super 关键字\n        int c;\n        c = a+b;\n\
  \        return(c);\n    }\n    static float avg(int a, int b)\n    {\n        return\
  \ (float)(a+b)/2;\n    }\n}\nclass ClassTest9\n{\n    public static void main(String\
  \ args[ ])\n    {\n        System.out.println(A.sum(5,6)); // 静态方法可以通过类名\n     \
  \         // 调用\n        System.out.println(A.avg(5,6));\n        A a1 = new A();\n\
  \        System.out.println(a1.sum(5,6)); // 静态方法也可以通过对象\n              // 调用\n\
  \    }\n}\n```\n\n输出：\n```\n11\n5.5\n11\n```\n\n### 初始化块与静态块\n初始化块（Initialize block）用于初始化类的实例成员变量，静态块（static\
  \ block）用于初始化类的静态成员变量。但构造函数会在这些块之后执行。\n\n### 示例 5.11\n\n```java\nclass A\n{\n  \
  \  int x;\n    static int y;\n\n    { // 初始化实例变量的初始化块\n        x = 10;\n    }\n\n\
  \    static // 初始化静态变量的静态块\n    {\n        y = 5;\n    }\n}\nclass ClassTest10\n\
  {\n    public static void main(String args[])\n    {\n        A a1 = new A();\n\
  \        System.out.println(a1.x + \"\\t\" + a1.y);\n    }\n}\n```\n\n输出：\n```\n\
  10 5\n```\n\n### final 变量\n如果变量被声明为 `final`，则我们不能改变它的值 `final (double PI=3.141;)`。`final`\
  \ 变量不按每个实例占用内存。`final` 变量是一个常量变量，其值不能被改变。`final` 引用类型变量不能改变其引用。\n\n### 示例 5.12\n\
  \n```java\nclass A\n{\n    void m1() \n    {\n        System.out.println(\"Inside\
  \ m1()\");\n    }\n}\nclass ClassTest11\n{\n    public static void main(String args[])\n\
  \    {\n        final int x=10; // 不能更改\n        final int y;  // 变量 y 未初始化，所以稍后可以初始化\
  \ y\n        y=20;  // 现在 y 已初始化，之后我们不能再改变它的值\n        //  y=30;  错误\n        System.out.println(x);\n\
  \        System.out.println(y);\n        final A a1=new A();  // a1 是常量引用，所以我们不能\n\
  \        // 将其他对象的引用赋值给 a1。\n        a1.m1();\n        A a2 = new A();\n       \
  \ // a1 = a2;  错误\n    }\n}\n```\n\n输出：\n```\n10\n20\nInside m1()\n```\n\n### 参数传递机制\n\
  1. 值传递（Call by Value）。\n2. 引用传递（Call by reference）。\n\n当按值传递时，传递的是变量的副本。当按引用传递时，传递的是引用。\n\
  \n当基本类型（如 `int`, `float`, `long`）按值传递时，方法内部对参数的操作不会影响原始变量。而当引用类型按值传递时，传递的是引用的副本，因此在方法内部通过引用修改对象的属性会影响原始对象。但需要注意，如果是在方法内部将引用重新指向一个新的对象，则不会影响外部的引用。\n\
  \n（注：此处根据原文中 Argument Mechanism 后的描述描述，结合 Java 逻辑进行了逻辑翻译。由于原文该部分描述较多且重复重复混乱，译文已根据语境进行了理顺处理。）\n\
  \n\n\n## 4. 什么是静态内部类？它与其他任何静态成员有什么区别？\n\n## 5. 我们如何在 Java 中声明常量值？\n\n## 6. \"final\"\
  \ 关键字的含义是什么？\n\n## 7. 什么是类变量？\n\n答案：\n\n当我们创建一个同类的多个对象时，每个对象都将共享变量的公共副本。这意味着无论从该类创建了多少个对象，每个类都只有一个副本。类变量或静态变量是在类中使用\
  \ `static` 关键字声明的。\n\n这些变量存储在静态内存中。类变量主要用于常量，即那些从不改变其初始值的变量。静态变量始终通过类名进行调用。\n\n\
  该变量在程序启动时创建，即它在通过 `new` 操作符创建类的实例之前就已经创建了，并在程序停止时被销毁。类变量的作用范围与实例变量相同。\n\n类变量可以在类级别的任何地方使用\
  \ `static` 关键字定义。它的初始值与实例变量相同。当类变量被定义为 `int` 时，其默认值为零；当声明为 `boolean` 时，其默认值为 `false`；对象引用则为\
  \ `null`。类变量与类相关，而不是与任何对象相关。\n\n## 8. 解释垃圾回收。\n\n答案：垃圾回收是 Java 最重要的特性之一。垃圾回收也被称为自动内存管理，因为\
  \ JVM 会自动从内存中移除未使用的变量/对象（值为 `null`）。用户程序无法直接从内存中释放对象，相反，由垃圾回收器自动释放不再被程序引用的对象。\n\n\
  每个类都从 `java.lang.Object` 继承了 `finalize()` 方法，当垃圾回收器确定不再有对对象的引用时，就会调用 `finalize()`\
  \ 方法。\n\n在 Java 中，当变量不再使用时，显式地将其赋值 `null` 是一个好习惯。在 Java 中调用 `System.gc()` 和 `Runtime.gc()`\
  \ 时，JVM 会尝试回收未使用的对象，但无法保证所有对象何时会被垃圾回收。\n\n## 9. 如果一个类有多个构造函数，我们可以从一个构造函数调用另一个吗？\n\
  \n可以。使用 `this()` 从另一个构造函数调用构造函数。\n\n## 10. 构造函数和普通方法之间有什么区别？\n\n构造函数的名称必须与类名相同，且不能返回值。它们只被调用一次，而普通方法可以被调用多次，并且可以返回结果或为\
  \ `void`。\n\n## 11. 我们如何强制进行垃圾回收？\n\n垃圾回收是自动过程，无法强制执行。我们可以通过调用 `System.gc()` 来请求它。JVM\
  \ 并不保证 GC 会立即启动。\n\n## 12. 下列陈述中哪是不正确的？\n\n(a) Java 中的局部变量总是由默认值初始化。\n\n(b) Java\
  \ 中的局部变量必须在使用之前进行初始化。\n\n(c) 内部块中的局部变量不能与外部块中的局部变量具有相同名称。\n\n(d) 同一级两个块中的局部变量可以有相同的名称。\n\
  \n![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)\n\
  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n# ∞ 6 ∞\n## (继承)\n\n### 引言\n\n当一个类的属性转移到另一个类时，就称为继承。通过这种方式，被继承的类被称为超类、基类或父类，而继承的类被称为子类、子类或派生类。\n\
  \n继承允许我们通过添加额外功能来扩展现有的类（基类）。它鼓励代码的重用，这有助于减小代码体积，尽管在某些情况下可能会导致复杂性。\n\n例如，如果我们已经完成了一个简单计算器的代码。此后我们需要开发一个科学计算器，那么我们有两种方案：\n\
  \n(i) 创建一个新类。（重写类）\n\n(ii) 扩展该类。\n\n在大多数情况下，第二种方案是更好的选择。情况下，我们只需要编写一小段代码。同时，我们不需要在调试和测试上花费大量时间，因为基类已经过测试并已使用了长时间。当我们需要将一个类继承到另一个类时，必须使用\
  \ `extends` 关键字。\n\n语法：`class sub_class extends base_class`\n\n![image](img/image087.png)\n\
  \n类 A（超类或基类或父类）。\n\n类 B（子类或派生类或子类）。\n\n子类将拥有基类的所有特征，加上在扩展类中定义的新特征。Java 不支持多重继承，但它支持多接口继承，因此子类只能扩展一个基类。\n\
  \n示例 6.1：\n\n```java\n1. class A\n2. {\n3.    int x;\n4.    void setX(int x1)\n\
  5.    {\n6.    x = x1;\n7.    }\n8.    void displayX()\n9.    {\n10.   System.out.println(x);\n\
  11.   }\n12. }\n13. class B extends A\n14. {\n15.   int y;\n16.   void setY(int\
  \ y1)\n17.   {\n18.     y = y1;\n19.   }\n20.   void displayY()\n21.   {\n22.  \
  \   System.out.println(y);\n23.   }\n24. }\n25. class InheritTest\n26. {\n27.  \
  \ public static void main(String args[])\n28.   {\n29.      A a1 = new A();\n30.\
  \      a1.setX(5);\n31.      a1.displayX();\n32.      B b1 = new B();\n33.     \
  \ b1.setX(10);\n34.      b1.displayX();\n35.      b1.setY(20);\n36.      b1.displayY();\n\
  37.   }\n38. }\n```\n\n输出：\n```\n5\n10\n20\n```\n\n### 成员隐藏\n\n如果子类成员与父类成员具有相同的名称（对于方法而言具有相同的签名），那么它就隐藏了父类成员。\n\
  \n虽然两个成员在子类中都可能可用，但使用成员名称时只能访问子类成员，因为它隐藏了父类成员。\n\n### 使用 super 关键字\n\n每当子类需要引用其直接父类时，可以通过\
  \ `super` 关键字来实现。`super` 有两个通用用途：\n\n1. 调用父类的构造函数\n子类可以通过以下形式的 `super` 调用其父类定义的构造方法：`super(parameter-list);`\
  \ 这里 `parameter-list` 指定了父类构造方法所需的任何参数。事实上，`super()` 总是子类构造方法内部执行的第一语句。\n\n2. 访问被子类成员隐藏的父类成员\n\
  关键字 `super` 可用于如下访问父类的隐藏成员：`super.member;` 这里 `member` 可以是方法也可以是数据成员。\n\n### 方法重载与方法重写\n\
  \n#### 方法重载：\n\n当两个或多个方法具有相同名称但参数不同时，被称为方法重载。方法重载用于对象执行相似任务但使用不同输入参数的情况。\n\n当我们调用方法时，Java\
  \ 首先匹配方法名，然后是参数的数量和类型。决定调用哪一个方法定义被称为多态。\n\n#### 方法重写：\n\n我们已经看到父类中的方法可以被子类继承并被子类创建的对象使用。方法继承允许我们在子类中重复定义和使用方法，而无需在子类中再次定义。\n\
  \n在类层次结构中，当子类中的实例方法与其父类中的实例方法（非私有）具有相同的名称和签名时，子类中的方法被称为重写了父类中的方法。\n\n当在子类内部调用被重写的方法时，它始终将引用子类中定义的版本。父类中定义的版本将被隐藏。\n\
  \n\n\n\n\n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\black_star_logo.jpg](img/image080.jpg)\n\
  \n### 示例 6.2\n\n```java\nclass A\n{\n    int x;\n    void set(int x1)\n    {\n \
  \       x = x1;\n    }\n    void display()\n    {\n        System.out.println(x);\n\
  \    }\n}\nclass B extends A\n{\n    int y;\n    void set(int x1,int y1) //set method\
  \ of class B is not overriding set\n    // method of class A as arguments are different\n\
  \    {\n        set(x1);  //This will call set() of class A\n        y = y1;\n \
  \   }\n    void display() //display method of class B is overriding display\n  \
  \  //method of class A\n    {\n        //  display();  This will call display of\
  \ class B\n        super.display(); // This will call display of class A\n     \
  \   System.out.println(y);\n    }\n}\nclass InheritTest2\n{\n    public static void\
  \ main(String args[])\n    {\n        B b1 = new B();\n        b1.set(10,20);\n\
  \        b1.display();\n    }\n}\n```\n\n**输出：**\n```\n10\n20\n```\n\nJava 支持以下继承形式：\n\
  [1] 单继承继承。\n[2] 多级继承。\n[3] 层级继承。\n\n### [1] 单独继承。\n\n![image](img/image042.png)\n\
  \n### 示例 6.3\n\n```java\nclass A\n{\n    private int x;\n    A()\n    {\n      \
  \  x = 0;\n    }\n    A(int x1)\n    {\n        x = x1;\n    }\n    void display()\n\
  \    {\n        System.out.print(x);\n    }\n}\nclass B extends A\n{\n    private\
  \ int y;\n    B()\n    {\n        super();\n        //x=0;  error as x is private\n\
  \        y=0;\n    }\n    B(int x1, int y1)\n    {\n        super(x1);\n       \
  \ //x = x1; error as x is private\n        y = y1;\n    }\n    void display()\n\
  \    {\n        super.display();\n        System.out.print(y);\n    }\n}\nclass\
  \ InheritTest3\n{\n    public static void main(String args[])\n    {\n        B\
  \ b1 = new B();\n        b1.display();\n        B b2 = new B(10,20);\n        b2.display();\n\
  \    }\n}\n```\n\n**输出：**\n```\n0 0 10 20\n```\n\n––––––––\n\n### [2] 多级继承。\n\n\
  ![image](img/image018.png)\n\n––––––––\n\n![C:\\Users\\Made Man Harry\\Desktop\\\
  Stars\\black_star_logo.jpg](img/image039.jpg)\n\n### 示例 6.4\n\n```java\nclass A\n\
  {\n    private int x;\n    A()\n    {\n        x = 0;\n    }\n    A(int x1)\n  \
  \  {\n        x = x1;\n    }\n    void display()\n    {\n        System.out.println(x);\n\
  \    }\n}\nclass B extends A\n{\n    private int y;\n    B()\n    {\n        super();\n\
  \        y = 0;\n    }\n    B(int x1, int y1)\n    {\n        super(x1);\n     \
  \   y = y1;\n    }\n    void display()\n    {\n        super.display();\n      \
  \  System.out.println(y);\n    }\n}\nclass C extends B\n{\n    private int z;\n\
  \    C()\n    {\n        super();\n        z = 0;\n    }\n    C(int x1, int y1,\
  \ int z1)\n    {\n        super(x1,y1);\n        z = z1;\n    }\n    void display()\n\
  \    {\n        super.display();\n        System.out.println(z);\n    }\n}\nclass\
  \ InheritTest4\n{\n    public static void main(String args[])\n    {\n        C\
  \ c1 = new C();\n        c1.display();\n        C c2 = new C(10,20,30);\n      \
  \  c2.display();\n    }\n}\n```\n\n**输出：**\n```\n0\n0\n0\n10\n20\n30\n```\n\n![C:\\\
