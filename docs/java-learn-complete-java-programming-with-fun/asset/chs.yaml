  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章\n\n# ∞ 2 ∞\n\n## (Java 语言)\n\n––––––––\n\
  \n## 标记-\n\n最小的独立单元被称为标记，如关键字、标识符、常量、字符串和运算符。\n\nA. 关键字是语言的保留名称，不能用作变量、函数等的名称。\n\
  B. 标识符是指变量、数组、函数、类、接口等的名称。\nC. 常量/字面量是指程序中无法更改的固定值。\nD. 运算符是作用于变量和常量的特殊符号，形成表达式。\n\
  E. 分隔符是用于分隔语句的特殊字符，如 `( ) { } [ ] ; , .`\n\n––––––––\n\n## A. 关键字-\n\n`abstract`\
  \ `continue` `goto` `package` `synchronized`\n`assert` `default` `if` `private`\
  \ `this`\n`boolean` `do` `implements` `protected` `throw`\n`break` `double` `import`\
  \ `public` `throws`\n`byte` `double` `import` `public` `throws`\n`\n`transient`\
  \ `else` `instanceof` `return`\n`case` `extends` `int` `short` `try`\n`class` `final`\
  \ `static` `void`\n`char` `float` `native` `super` `volatile`\n`goto` `for` `new`\
  \ `switch`\n`enum`\n\n注 1：增加了 `assert`、`goto`、`enum`。\n注 2：增加了 `true` 和 `null`。\n\
  注 3：增加了 `boolean`、`false`、`true`。\n\n## B. 标识符\n\n标识符是指变量、数组、函数、类、接口等的名称。\n\n标识符命名规则：\n\
  1. 标识符必须以字母、美元符号或下划线开头。\n2. 后续可以是数字。\n3. 长度没有限制。\n4. Java 允许 Unicode 字符。\n\n示例：`StudentTest`、`AnnualProfit`、`PI`。\n\
  \n## C. 常量/字面量\n\n常量/字面量是指程序中无法更改的固定值。字面量不能出现在赋值运算符的左侧。字面量是在源代码中指定的，而不是在运行时确定的。\n\
  \n字面量类型\n- `5`、`-5`、`0xA`、`012`、`5l`、`5L` 是整数字面量。\n- `5.23`、`-5.23`、`5.4f`、`5.4F`、`5.4d`、`5.4D`、`1.2E-03`\
  \ 是浮点字字面量。\n- `'a'`、`'A'`、`'\\n'`、`'\\141'`、`'\\u0061'` 是字符字面量。\n- `\"matrix\"`\
  \ 是字符串字面量。\n\n## D. 运算符\n\nJava 提供了丰富的运算符。运算符组合常量、变量和子表达式形成表达式。Java 中的大多数运算符的行为与\
  \ C/C++ 相似，但有一些区别，这里进行了介绍。\n\n- 算术运算符 (`+`、`-`、`*`、`/`、`%`）：这些运算符与 C/C++ 相同。\n-\
  \ `%` 运算符也可以用于浮点数。\n当二进制运算符应用于不同类型时，低类型的操作会在求值之前转换为高级类型，结果的类型将与高级类型操作数的类型相同。\n\n\
  \n\n\n\n- 对于 `int` 类型，除以零或对零取模会导致 `ArithmeticException`（运行时错误），但浮点数类型则不会。\n- 当我们对\
  \ `int` 应用算术运算符且结果超出了 `int` 的范围时，额外的高位位将被截断，这个新值将赋值给接收其结果的变量；但在浮点类型中，如果溢出将导致 `Infinity`\
  \ 或 `-Infinity`，如果发生下溢则将导致 `0`。\n\n### 递增和递减运算符 (`++`, `--`)\n\n这些运算符与 `C`/`C++`\
  \ 中的相同。\n\n```java\nint a=5,b;\nb = ++a*++a;\nSystem.out.print(b);    //42\na =\
  \ 5; \nSystem.out.print(++a*++a);  //42\n```\n\n### 关系运算符 (`<`, `>`, `<=`, `>=`,\
  \ `instanceof`)\n\n这些运算符与 `C`/`C++` 中的相同，但 `< `<=`、`>` `>=` 不能应用于布尔类型和引用类型。\n\n\
  ### `instanceof` 运算符 `-:`\n\n`instanceof` 运算符用于测试对象的类。`instanceof` 运算符的通用形式为：\n\n\
  ```java\nif(object instanceof type)\n```\n\n这里，`object` 是一个类的实例，`type` 是一个类类型。如果\
  \ `object` 是指定类型的实例，或者是指定类型任何子类的实例，则 `instanceof` 运算符返回 `true`，否则结果为 `false`。\n\n\
  ### 赋值运算符 (`=`, `+=`, `-=`, `*=`, `/=`, `%=`)\n\n这些运算符与 `C`/`C++` 中的相同。\n\n### 等于运算符\
  \ (`==`, `!=`)\n\n这些运算符与 `C`/`C++` 中的相同。\n\n### 逻辑运算符 (`&&`, `||`, `!`)\n\n这些运算符与\
  \ `C`/`C++` 中的相同。\n\n### 三元运算符 (`? :`)\n\n该运算符与 `C`/`C++` 中的相同。\n\n### 位运算运算符 (`&`,\
  \ `|`, `^`, `~`, `<<`, `>>`, `>>>`)\n\n这些运算符与 `C`/`C++` 中的相同，移位运算符除外。移位运算符仅适用于整数类型。\n\
  \n#### 左移运算符 (`<<`)\n\n要获得 `<<` 运算符的结果，左侧操作数的位将根据右侧操作数的指定向左移动，并在右侧的空位上用零填充。左移 1\
  \ 位等同于乘以 2。结果的符号可能与左侧操作数的符号不同。这可能是因为符号取决于最左位，该位可能会从 0 变为 1 或从 1 变为 0，从而导致符号变化。\n\
  \n示例：`b = a << 2;` 要获得 `b` 的值，将 `a` 中的位左移 2 位，并用零填充右侧的两位。\n\n#### 右移运算符 (`>>`)（有符号）\n\
  \n要获得 `>>` 运算符的结果，左侧操作数的位将根据右侧操作数的指定向右移动，并在左侧的空位用符号位填充。右移 1 位等同于除以 2。此运算符永远不会改变结果的符号，即与左侧操作数的符号相同。\n\
  \n示例：`b = a >> 2;` 要获得 `b` 的值，将 `a` 中的位右移 2 位，并用符号填充右侧的两位（如果 `a` 为正则填充 0，如果 `a`\
  \ 为负则填充 1）。\n\n#### 零填充右移运算符 (`>>>`)（无符号）\n\n要获得 `>>>` 运算符的结果，左侧操作数的位将根据右侧操作数的指定向右移动，并在左侧的空位用\
  \ 0 填充。右移 1 位等同于除以 2。如果发生了移位，结果将始终为正，因为最右边的位将变为零。\n\n示例：`b = a >>> 2;` 要获得 `b` 的值，将\
  \ `a` 中的位右移 2 位，并用 0 填充右侧的两位。\n\n## 运算符优先级\n\n| 级别 | 运算符 | 说明 | 结合性 |\n| :--- |\
  \ :--- | :--- | :--- |\n| 1 | `()` `[]` `.` | 函数调用、下标、直接成员 | 从左到右 |\n| 2 | `++`\
  \ `--` `~` `!` | 递增、递减、位取反、逻辑取反 | 从右到左 |\n| 3 | `*` `/` `%` | 乘、除、取模 | 从左到右 |\n\
  | 4 | `+` `-` | 加、减 | 从左到右 |\n| 5 | `>>>` `>>` `<<` | 位右移、位左移、位零填充右移 | 从左到右 |\n\
  | 6 | `>>=` `<<=` `instanceof` | 大于、大于等于、小于、小于等于 | 从左到右 |\n| 7 | `==` `!=` | 等于、不等于\
  \ | 从左到右 |\n| 8 | `&` | 位与 | 从左到右 |\n| 9 | `^` | 位异异 | 从左到右 |\n| 10 | `|` | 位或 |\
  \ 从左到右 |\n| 11 | `&&` | 逻辑与 | 从左到右 |\n| 12 | `||` | 逻辑或 | 从左到右 |\n| 13 | `?:` |\
  \ 三元运算符 | 从左到右 |\n| 14 | `=` `+=` `-=` `*=` `/=` `%=` `&=` `|=` `^=` `>>=` `<<=`\
  \ `>>>=` | 赋值运算符 | 从右到左 |\n\n| 符号 | 名称 | 目的 |\n| :--- | :--- | :--- |\n| `()` |\
  \ 括号 | 函数调用 |\n| `[]` | 方括号 | 下标、数组 |\n| `.` | 点 | 直接成员访问 |\n| `{ }` | 大括号 | 代码块\
  \ |\n| `;` | 分号 | 语句结束 |\n| `,` | 逗号 | 分隔符 |\n| ` ` | 空格 | 分隔符 |\n\n\n\n\n\n# 局部变量\n\
  局部变量用于块或方法内部。局部变量（也称为自动变量）默认不会初始化。局部变量在第一次使用之前必须显式地初始化，否则将出现编译编译时错误“Variable might\
  \ not have been initialized”（变量可能未初始化）。\n\n### 示例\n```java\nint a,b=5;\nif(b>2)\
  \ {\n    a = b;\n}\nSystem.out.print(a);\n```\n在上面的程序中，如果 `if` 条件为假，则 `a` 的值未定义，因此编译器将给出错误“Variable\
  \ a might not have been initialized”（变量 a 可能未初始化）。\n\n在 Java 中，我们不能在内部块中定义与外部块同名的变量。\n\
  ```java\nint a=5;\n{\n    int a=7;  // 错误\n}\n```\n\n# 实例变量\n实例变量用于定义对象的属性或状态。\n\
