  \      Label l4 = new Label(\"India\",Label.CENTER);\n      Label l5 = new Label(\"\
  Pakistan\",Label.CENTER);\n      Label l6 = new Label(\"UK\",Label.CENTER);\n  \
  \    Label l7 = new Label(\"India\",Label.RIGHT);\n      Label l8 = new Label(\"\
  Pakistan\",Label.RIGHT);\n      Label l9 = new Label(\"UK\",Label.RIGHT);\n    \
  \  l3.setText(\"USA\");\n      System.out.println(l1.getText());\n      f.add(l1);f.add(l2);f.add(l3);\n\
  \      f.add(l4);f.add(l5);f.add(l6);\n      f.add(l7);f.add(l8);f.add(l9);\n  \
  \    f.setSize(500,200);\n      f.setVisible(true);\n    }\n}\n```\n输出：\n![image](img/image086.png)\n\
  \n### List\nList 是垂直排列的文本项。如果列表包含的项多于显示范围，它会自动获取垂直滚动条。\n\n#### 构造函数\n`List()` 创建滚动列表。此构造函数没有指定可见行数，但产生默认四行的高度。当然，在许多情况下，列表的实际高度由布局管理器决定。\n\
  `List(int rows)` 创建一个指定可见行数的滚动列表。\n`List(int rows, boolean multipleMode)` 创建一个显示指定行数的新滚动列表并允许多项选择。\n\
  \n### 示例 17.18\n```java\nimport java.awt.*;\nclass ListTest\n{\n  public static\
  \ void main(String args[])\n    { \n      Frame f = new Frame ( );\n      f.setLayout\
  \ (new FlowLayout ());\n      List l1=new List(3,true);\n      l1.add(\"India\"\
  );\n      l1.add(\"Nepal\");\n      l1.add(\"Shri Lanka\");\n      l1.add(\"USA\"\
  );\n      l1.add(\"UK\");\n      f.add(l1);\n      System.out.println(l1.getRows());\n\
  \      f.setSize(300, 300);\n      f.setVisible(true);\n    }\n}\n```\n输出：\n![image](img/image002.png)\n\
  \nList 有五个项，但只有 3 行可见，因此会自动提供垂直滚动条。\n\n注意：选择列表中的某项会导致列表发送 Item 事件；双击某项会发送 Action\
  \ 事件。\n\n`void add(String item)` 将指定的项添加到滚动列表的末尾。\n\n\n\n\n```java\nvoid add(String\
  \ item, int index)\n```\n将指定的项添加到由 `index` 指明位置的滚动列表中。\n\n```java\nvoid addActionListener(ActionListener\
  \ i)\n```\n添加指定的动作监听器，以接收来自此列表的动作事件。\n\n```java\nvoid addItemListener(ItemListener\
  \ i)\n```\n添加指定的项目监听器，以接收来自此列表的项选择事件。\n\n```java\nString getItem(int index)\n```\n\
  获取与指定的 `index` 关联的项。\n\n```java\nint getItemCount()\n```\n获取列表中的项数。\n\n```java\n\
  String[] getItems()\n```\n获取列表中的项。\n\n```java\nint getRows()\n```\n获取此列表中可见的行数。\n\
  \n---\n\n```java\nint getSelectedIndex()\n```\n获取列表中被选中项的索引。\n\n```java\nint[] getSelectedIndexes()\n\
  ```\n获取列表中所有被选中的索引。\n\n```java\nString getSelectedItem()\n```\n获取此滚动列表中的被选中项。\n\n\
  ```java\nString[] getSelectedItems()\n```\n获取此滚动列表中的被选中项。\n\n```java\nvoid remove(int\
  \ position)\n```\n从此滚动列表中删除指定位置的项。\n\n```java\nvoid remove(String item)\n```\n从列表中删除第一次出现的指定项。\n\
  \n```java\nvoid removeAll()\n```\n删除此列表中的所有项。\n\n```java\nvoid replaceItem(Sring\
  \ newValue, int index)\n```\n将滚动列表中指定索引处的项替换为新字符串。\n\n```java\nvoid select(int index)\n\
  ```\n选中滚动列表中指定索引的项。\n\n```java\nvoid setMultipleMode(boolean b)\n```\n设置标志位，决定此列表是否允许多项选择。\n\
  \n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass ListTest extends\
  \ Frame implements ActionListener {\n    Button b1,b2,b3,b4,b5,b6;\n    List l1,l2;\n\
  \    TextField tf1,tf2;\n\n    ListTest() {\n        setLayout(new GridLayout(3,3));\n\
  \        l1=new List(3,true);\n        l2=new List(3,true);\n        b1=new Button(\"\
  >\");\n        b2=new Button(\">>\");\n        b3=new Button(\"<\");\n        b4=new\
  \ Button(\"<<\");\n        b5=new Button(\"Add\");\n        b6=new Button(\"Add\"\
  );\n        b1.addActionListener(this);\n        b2.addActionListener(this);\n \
