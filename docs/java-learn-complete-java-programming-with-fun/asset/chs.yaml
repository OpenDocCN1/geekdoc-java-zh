  \ if(s.equals(\"green\"))\n        tf1.setBackground(Color.green);\n      else if(s.equals(\"\
  blue\"))\n        tf1.setBackground(Color.blue);\n    }\n}\n```\n\n### Label\n最简单的可见\
  \ AWT 组件是 `Label`。Label 通常不用于响应用户输入或发送事件。\n\n#### 构造函数\n`Label()` 构建一个空标签。\n`Label(String\
  \ text)` 构建一个带有指定文本的新标签，左对齐。\n`Label(String text, int alignment)` 构建一个带有指定文本和指定对齐方式的新标签。\n\
  \n#### 方法\n`String getText()` 获取标签的文本。\n`void setText(String text)` 设置标签的文本。\n\n\
  ### 示例 17.17\n```java\nimport java.awt.*;\nclass LabelTest\n{\n  public static void\
  \ main(String args[])\n    {\n      Frame f = new Frame(\"Testing Label\");\n  \
  \    f.setLayout(new GridLayout(3,3));\n      f.setFont(new Font(\"Arial\",Font.PLAIN,\
  \ 20));\n      Label l1 = new Label(\"India\",Label.LEFT);\n      Label l2 = new\
