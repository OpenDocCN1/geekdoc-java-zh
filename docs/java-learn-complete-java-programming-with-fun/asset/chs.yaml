  \ `int a=5,b=7,t;`\n6. `t = a;`\n7. `a = b;`\n8. `b = t;`\n9. `System.out.print(\"\
  After Swap are \" + a + \",\" + b);`\n10. `}`\n11. `}`\n\n**输出**：After Swap are\
  \ 7,5\n\n## 注释\n注释有三种类型：\n- 单行注释：`//`\n- 多行注释：`/* */`\n- 文档注释：`/** */`\n\n- Java\
  \ 程序必须包含一个类。`main()` 方法定义在类内部。\n- 源文件可以包含任意数量的类或接口，但最多有一个公共类。\n- 独立 Java 程序从 `main()`\
  \ 方法开始执行，因此我们想要开始执行的类必须包含 `main()` 方法。\n- `main()` 方法始终具有以下签名：`public static void\
  \ main(String args[])`\n\n**注意**：方法原型在 Java 中被称为签名。\n\n- `public` 关键字表示方法可以从任何地方访问。\n\
  - `static` 关键字表示无需创建对象即可调用。\n- `void` 关键字表示方法不返回值。\n- `main()` 方法接收一个参数，即 `String`\
  \ 数组。\n- `System` 是提供系统访问的类，`out` 是连接到控制台的输出流。\n\n## Java 程序结构\n- **文档部分**：该部分包含一组注释，给出程序名称、作者以及程序员以后可能参考的其他细节。注释解释了算法的原因和内容。\n\
  - **包语句**：源文件最多有一个包语句。如果存在包语句，它必须 Java 程序的第一条语句。只有注释可以包语句之前。\n- **导入语句**：源文件可以有零或多个导入语句。导入语句类似于\
  \ C/C++ 中的 `#include` 语句。如果存在，所有的导入语句都在包语句之后、类/接口定义之前。\n- **接口语句**：接口类似于类但包含一组方法声明。这也是一个可选部分，仅在我们希望在程序中实现多继承功能时使用。\n\
  - **不包含 main 方法的类定义**：Java 程序可以包含多个类定义。类是 Java 程序的主要元素。这些类用于映射现实世界问题的对象。\n- **包含\
  \ main 方法的类定义**：由于每个 Java 独立程序都需要一个 `main` 方法作为起点，因此该类是 Java 程序的核心部分。简单的 Java 程序可能只包含这部分。`main`\
  \ 方法创建对象并建立它们之间的通信。当 `main` 方法结束时，程序终止并将控制交回操作系统。\n\n## 垃圾回收\nJava 对象的内存分配是完全动态的，但\
  \ Java 不像 C/C++ 那样支持指针算术。每当我们运行 Java 程序时，JVM 也会后台运行另一个名为垃圾回收器的程序（线程）。垃圾回收器会检查 Java\
  \ 对象。\n\n\n\n\n当一个 Java 对象不再被使用时，它会被垃圾回收器（Garbage Collector）回收，即为对象分配的内存被添加到空闲内存\
  \ `pool/heap` 中并可以重用。这在很大程度上简化了程序员的工作。这也消除了许多由于不当使用指针算术和内存管理功能（如显式释放内存）引起的错误。\n\n\
