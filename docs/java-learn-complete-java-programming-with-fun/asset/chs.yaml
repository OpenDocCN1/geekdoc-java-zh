  \n\n\n\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `void set(Object obj)` | 用 `next` 或 `previous`\
  \ 返回的最后一个元素替换为指定的元素（可选操作）。 |\n\n### RandomAccess 接口\n\n这是一个由 `List` 实现类使用的标记接口，用于指示它们支持随机访问。`ArrayList`\
  \ 和 `Vector` 实现了此接口。\n\n### Comparator 接口\n\n比较器（Comparator）用于控制某些数据结构（如 `TreeSet`\
  \ 或 `TreeMap`）的顺序。\n\n#### 方法\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `int compare(Object\
  \ o1,Object o2)` | 比较其两个参数的顺序。 |\n| `boolean equal(Object obj)` | 表明另一个对象是否“等于”此\
  \ `Comparator`。 |\n\n### Collection 接口\n\n`Collection` 接口是集合框架构建的基础。它声明了所有集合将拥有的核心方法。由于所有集合都实现了\
  \ `Collection` 接口，因此熟悉它的方法对于清晰地理解框架是必要的。其中 set 几个方法可能会抛出 `UnsupportedOperationException`。当一个对象与另一个对象不兼容时（例如尝试向集合添加不兼容的对象时），会产生\
  \ `ClassCastException`。\n\n#### Collection 接口中的方法\n\n| 方法 | 说明 |\n| :--- | :---\
  \ |\n| `boolean add(Object obj)` | 确保此集合包含指定的元素（可选操作）。将对象添加到调用的集合中。如果元素 `obj` 已添加到集合，则返回\
  \ true。如果元素 `obj` 已经是集合的成员且集合不允许重复，则返回 false。 |\n| `boolean addAll(Collection c)`\
  \ | 将指定集合中的所有元素都添加到此集合中（可选操作）。 |\n| `void clear()` | 移除此集合中的所有元素（可选操作）。 |\n| `boolean\
  \ contain(Object o)` | 如果此集合包含指定的集合，则返回 true。 |\n| `boolean containAll(Collection\
  \ c)` | 如果此集合包含指定集合中的所有元素，则返回 true。 |\n| `boolean equal(Object o)` | 将指定的对象与此集合进行等等性比较。\
  \ |\n| `int hashCode()` | 返回此集合的哈希值。 |\n| `boolean isEmpty()` | 如果此集合不包含任何元素，则返回\
  \ true。 |\n| `Iterator iterator()` | 返回一个用于此集合中元素的迭代器。 |\n| `boolean remove(Object\
  \ o)` | 如果此集合中存在指定的元素，则移除其单个实例（可选操作）。 |\n| `boolean removeAll(Collection c)` | 移除所有包含在指定集合中的元素（可选操作）。\
  \ |\n| `boolean retainAll(Collection c)` | 保留此集合中包含在指定集合中的元素（可选操作）。 |\n| `int size()`\
  \ | 返回此集合中的元素数量。 |\n| `Object[] toArray()` | 返回包含此集合中所有元素的数组。 |\n\n可以通过调用 `equals()`\
  \ 方法比较两个集合的等性性。“等性”的精确含义可能根据集合的不同而不同。\n\n例如，你可以实现 `equals()` 以便比较存储在集合中的元素的值。或者，`equals()`\
  \ 也可以比较这些元素的引用。\n\n### List 接口\n\n列表（List）是一种有序的集合，称为序列（sequence）。`List` 接口扩展了 `Collection`\
  \ 接口，并声明了存储元素序列的集合的行为。\n\n可以使用从零开始的索引根据元素在列表中的位置插入或访问元素。列表可以包含重复元素。除了 `Collection`\
  \ 定义的方法外，`List` 还定义了一些它自己的方法。\n\n#### List 接口中的方法\n\n| 方法 | 说明 |\n| :--- | :---\
  \ |\n| `boolean add(Object o)` | 将指定的元素添加到此列表的末尾（可选操作）。该方法在 `Collection` 接口中定义，但作为\
  \ `List` 接口的一部分，它应该实现为始终将元素添加到列表的末尾。 |\n| `void add(int index, Object element)`\
  \ | 在此列表的指定位置插入指定的元素（可选操作）。插入点或其之后的任何现有元素都会向前移动。因此，不会覆盖任何元素。 |\n| `boolean addAll(Collection\
  \ c)` | 按照指定集合 `iterator` 返回的顺序，将指定集合中的所有元素添加到此列表的末尾（可选操作）。该方法在 `Collection` 接口中定义，但作为\
  \ `List` 接口的一部分，它应该实现为始终将元素添加到列表的末尾。 |\n| `boolean addAll(int index, Collection\
  \ c)` | 将指定集合中的所有元素插入此列表的指定位置（可选操作）。如果调用的列表发生变化则返回 true，否则返回 false。 |\n| `Object\
  \ get(int index)` | 返回此列表中指定位置的元素。 |\n| `int indexOf(Object o)` | 返回指定元素在此列表中第一次出现的索引，或者如果列表不包含该元素，则返回\
  \ -1。 |\n| `int lastIndexOf(Object o)` | 返回指定元素在此列表中最后一次出现的索引，或者如果列表不包含该元素，则返回 -1。\
  \ |\n| `ListIterator iterator()` | 返回此列表元素的列表迭代器（按正确的顺序）。 |\n| `ListIterator iterator(int\
  \ index)` | 返回一个从此列表指定位置开始的列表元素迭代器（按正确的顺序）。 |\n| `Object remove(int index)` | 移除指定位置的元素（可选操作）并返回被删除的元素。结果列表将紧凑。因此，后续元素的索引将减一。\
  \ |\n| `Object set(int index, Object element)` | 用指定的元素替换此列表中指定位置的元素（可选操作）。 |\n\
  | `List subList(int fromIndex, int toIndex)` | 返回包含从 start 到 end-1 元素的列表。返回列表中的元素也被调用的对象引用。\
  \ |\n\n注意：如果集合不可修改，这些方法中的几个可能会抛出 `UnsupportedOperationException`；当对象不兼容时，会产生 `ClassCastException`。\n\
  \n`Collection` 定义的 `add(Object o)` 和 `addAll(Collection c)` 方法的语义被 `list` 改变，以便将元素添加到列表的末尾。\n\
  \n### Set 接口\n\n`Set` 接口定义了一个集合。它扩展了 `Collection` 接口并声明了不允许重复元素的集合的行为。\n\n因此，如果尝试向集合添加重复元素，`add()`\
  \ 方法将返回 false。它没有定义任何自己的方法。\n\n### SortedSet 接口\n\n`SortedSet` 接口扩展了 `Set` 接口，并声明了升序排序的集合的行为。\n\
  \n| 方法 | 说明 |\n| :--- | :--- |\n| `Comparator comparator()` | 返回此排序集合相关的比较器，如果它使用元素的自然排序，则返回\
  \ null。 |\n| `Object first()` | 返回此排序集合中的第一个元素。 |\n| `SortedSet headSet(Object toElement)`\
  \ | 返回此排序集合中严格小于 `toElement` 的元素的视图。 |\n| `Object last()` | 返回此排序集合中的最后一个元素。 |\n\
  | `SortedSet subSet(Object fromElement, Object toElement)` | 返回此排序集合中范围从 `fromElement`（包含）到\
  \ `toElement`（不包含）的元素的视图。 |\n| `SortedSet tailSet(Object fromElement)` | 返回此排序集合中大于或等于\
  \ `fromElement` 的元素的视图。 |\n\n\n\n\n\n当调用的集合中不包含任何项的数组时，某些方法会抛出 `NoSuchElementException`。当对象与集合中的元素类型不兼容时，会抛出\
  \ `ClassCastException`。如果尝试使用 null 对象且集合不允许 null，则会抛出 `NullPointerException`。\n\n\
  ### 集合类\n\n某些集合类提供了完整的实现，可以直接使用。另一些类是抽象的，它们提供了骨架实现，用作创建具体集合的起点。\n\n没有任何一个集合类是同步版本的。\n\
  \n标准的集合类包括：\n\n| 类名 | 描述 |\n| :--- | :--- |\n| `AbstractCollection` | 实现了 `Collection`\
  \ 接口的大部分。 |\n| `AbstractList` | 扩展 `AbstractCollection` 并实现了 `List` 接口的大部分。 |\n\
  | `AbstractSequenceList` | 扩展 `AbstractList`，供使用顺序访问而非随机访问元素的集合使用。 |\n| `AbstractSet`\
  \ | 扩展 `AbstractCollection` 并实现了 `Set` 接口。 |\n| `LinkedList` | 通过扩展 `AbstractSequentialList`\
  \ 实现链列表。 |\n| `ArrayList` | 通过扩展 `AbstractList` 实现动态数组。它使用元素的随机访问。 |\n| `HashSet`\
  \ | 扩展 `AbstractSet` 以供哈希表使用。 |\n| `LinkedHashSet` | 扩展 `HashSet` 以允许插入顺序迭代。 |\n\
  | `TreeSet` | 扩展 `AbstractSet` 并实现 `SortedSet` 接口。它使用二叉搜索树按排序存储元素。 |\n\n注意：除了集合类外，一些遗留类如\
  \ `Vector`、`Stack`、`Hashtable` 也经过重写以支持集合。\n\n### 通过 Iterator 和 ListIterator 访问集合\n\
  \n通常你需要遍历集合中的元素。到目前为止，最简单的方法是使用迭代器，即实现了 `Iterator` 或 `ListIterator` 接口的对象。\n\n`Iterator`\
  \ 允许你通过遍历集合来获取或移除元素。`ListIterator` 扩展了 `Iterator`，允许对列表进行双向遍历并修改元素。\n\n在使用迭代器访问集合之前，必须先获取它。每个集合类都提供了一个\
  \ `iterator()` 方法，返回一个指向集合开头的迭代器。通过使用此迭代器对象，你可以一次访问集合中的每个元素。\n\n对于实现 `List` 的集合，你还可以通过调用\
  \ `ListIterator` 获取迭代器。列表迭代器允许你以正向或反向方向访问集合，并且你可以修改元素。否则，`ListIterator` 的用法与 `Iterator`\
  \ 一致。\n\n### ArrayList 类\n\n`ArrayList` 类扩展了 `AbstractList` 并实现了 `List` 接口。`ArrayList`\
  \ 支持根据需要增长的动态数组。在 Java 中，标准数组是固定长度的。\n\n数组创建后，它们不能增长或缩小，这意味着我们必须预先知道数组将容纳多少元素。但有时，我们直到运行时才知道数组的大小。为了处理这种情况，集合框架定义了\
  \ `ArrayList`。\n\n`ArrayList` 是一个对象引用的变长度数组，也就是说，`ArrayList` 的大小可以动态增加或减少。创建创建时有一个初始大小。\n\
  \n当超过容量时，集合会自动扩大；当对象被移除时，数组可能会缩小。使用 J2SE 5 引入的泛型功能，可以限制添加到 `ArrayList` 中的元素类型。\n\
  \n注意：遗留类 `Vector` 也支持动态数组。\n\n### ArrayList 类的构造函数与方法\n\n| 方法 | 描述 |\n| :--- | :---\
  \ |\n| `public ArrayList(int)` | 构建一个具有指定初始容量的空列表。随着元素被添加到数组列表中，容量会自动增长。 |\n| `public\
  \ ArrayList()` | 构建一个初始容量为 10 的空列表。 |\n| `public ArrayList(Collection)` | 构建一个包含指定集合中元素的列表。元素按照集合的\
  \ `Iterator` 返回的顺序排列。 |\n| `public void trimToSize()` | 反之，如果我们想缩小 `ArrayList` 对象的底层数组大小，使其恰好等于它当前持有的项数，可以调用\
  \ `trimToSize()` 方法。 |\n| `public void ensureCapacity(int)` | 虽然 `ArrayList` 对象的容量在存储对象时会自动增加，但我们可以通过调用\
  \ `ensureCapacity()` 方法手动增加 `ArrayList` 对象的容量。通过在开始时增加一次容量，可以防止后续多次重新分配。因为重新分配在时间上是昂贵的，防止不必要的重新分配可以提高性能。\
  \ |\n| `public int size()` | |\n| `public Boolean isEmpty()` | |\n| `public Object\
  \ clone()` | |\n| `public Object[] toArray()` | 在处理 `ArrayList` 时，当需要从 `ArrayList`\
  \ 获取数组时，我们可能想要获得一个包含列表内容的实际数组。我们可以通过调用 `toArray()` 方法来实现。我们想要将集合转换为数组有几个原因，例如：为某些操作获取更快的处理时间；将数组传递给未重载以接收集合的方法；将较新的基于集合的代码与不支持集合的遗留代码集成。\
  \ |\n| `public Object[] toArray(Object[])` | |\n| `public Object get(int)` | |\n\
  | `public Object set(int, Object)` | |\n| `public boolean add(Object)` | |\n| `public\
  \ void add(int, Object)` | |\n| `public Object remove(int)` | |\n| `public boolean\
  \ remove(Object)` | |\n| `public void clear()` | |\n| `public boolean addAll(Collection)`\
  \ | |\n| `public boolean addAll(int, Collection)` | |\n| `public boolean contains(Object)`\
  \ | |\n| `public int indexOf(Object)` | |\n| `public int lastIndexOf(Object)` |\
  \ |\n\n### 示例 21.1\n\n```java\nimport java.util.*;\nclass ArrayListTest\n{\n   \
