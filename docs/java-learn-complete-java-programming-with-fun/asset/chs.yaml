  \    }\n}\n```\n\n## 处理窗口事件\n\n### 示例 18.5\n```java\nimport java.awt.*;\nimport\
  \ java.awt.event.*;\nclass A5\n{ \n  public static void main(String args[])\n  \
  \  { \n      Frame f= new Frame();\n      f.setLayout(new FlowLayout());\n     \
  \ f.setSize(300,300);\n      f.addWindowListener(new B( ));\n      f.setVisible(true);\n\
  \    }\n}\nclass B implements WindowListener\n{ \n  public void windowOpened(WindowEvent\
  \ we)\n    {\n      System.out.println(\"Window Opened\");\n    }\n  public void\
  \ windowActivated(WindowEvent we)\n    {\n      System.out.println(\"Window Activated\"\
  );\n    }\n  public void windowDeactivated(WindowEvent we)\n    {\n      System.out.println(\"\
  Window Deactivated\");\n    }\n  public void windowClosing(WindowEvent we)\n   \
  \ { \n      System.out.println(\"Window Closing\");\n      Frame f = (Frame) we.getWindow\
  \ ();\n      f.dispose();\n    }\n  public void windowClosed(WindowEvent we)\n \
  \   {\n      System.out.println(\"Window Closed\");\n    }\n  public void windowIconified(WindowEvent\
  \ we)\n    {\n      System.out.println(\"Window Iconified\");\n    }\n  public void\
  \ windowDeiconified(WindowEvent we)\n    {\n      System.out.println(\"Window Deiconified\"\
  );\n    }\n}\n```\n**输出：**\n![image](img/image005.png)\n\n**注意：** 窗口可以关联多个监听器。通过调用\
  \ `removeWindowListener(al)` 从组件中移除监听器，例如：\n\n```java\nf.removeWindowListener(al);\n\
  ```\n\n`WindowListener` 接口并不保证所有监听器会按照它们添加的顺序被通知。因此，在实现 `WindowListener` 的类中，我们必须为所有方法提供空实现。\n\
  \n### 适配器 (Adapters)\n某些事件监听接口具有多个方法。最大的接口 `WindowListener` 有七个方法。假设我们只想捕获 `windowClosing()`\
  \ 事件，以便执行关闭窗口的代码。虽然我们只需要实现 `WindowListener` 类中的一个方法，但我们必须为所有方法提供占位实现。\n\n`java.awt.event`\
  \ 包提供了多个适配器类，为每个定义了多个方法的监听接口提供一个。适配器仅仅是实现了接口并提供了空方法的类。例如，`WindowAdapter` 类实现了 `WindowListener`\
  \ 接口的个空方法。\n\n**适配器类及其对应的接口：**\n\n| 适配器类 | 监听接口 |\n| :--- | :--- |\n| `ContainerAdapter`\
  \ | `ContainerListener` |\n| `FocusAdapter` | `FocusListener` |\n| `KeyAdapter`\
  \ | `KeyListener` |\n| `MouseAdapter` | `MouseListener` |\n| `MouseMotionAdapter`\
  \ | `MouseMotionListener` |\n| `WindowAdapter` | `WindowListener` |\n\n### 示例 18.6\
  \ WindowAdapter 类的使用\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass\
  \ A6\n{ \n  public static void main (String args[])\n    { \n      Frame f= new\
  \ Frame();\n      f.setLayout(new FlowLayout());\n      f.setSize(300,300);\n  \
  \    f.addWindowListener(new B( ));\n      f.setVisible(true);\n    }\n}\nclass\
  \ B extends WindowAdapter\n{ \n  public void windowClosing(WindowEvent we)\n   \
  \ { \n      System.out.printIn(\"Window Closing\");\n      Frame f = (Frame) we.getWindow\
  \ ();\n      f.dispose();\n    }\n}\n```\n\n`InputEvent` 类：\n\n\n\n\n\n这是所有组件级输入事件的根事件类。输入事件在由其源组件进行正常处理之前，会先传递给监听器。这允许监听器和组件子类“消费”该事件，使得源组件不会以默认方式处理这些事件。例如，在\
  \ `Button` 组件上消费鼠标按下事件将防止 `Button` 被激活。\n\n#### 方法\n\n- `void consume()`: 消费此事件，以使其产生该事件的源不会以默认方式对其进行处理。\n\
  - `int getModifiers()`: 返回此事件的修饰符掩码。\n- `int getModifiersEx()`: 返回此事件的扩展修饰符掩码。\n\
  - `static String getModifiersExText(int modifiers)`: 返回一个描述扩展修饰符按键的字符串，例如“shift”、“Ctrl\
  \ + Shift”等。\n- `long getWhen()`: 返回此事件发生的时间戳。\n- `boolean isAltDown()`: 返回此事件中\
  \ Alt 修饰符是否被按下。\n- `boolean isConsumed()`: 返回此事件是否已被消费。\n- `boolean isControlDown()`:\
  \ 返回此事件中 Control 修饰符是否被按下。\n- `boolean isShiftDown()`: 返回此事件中 shift 修饰符是否被按下。\n\n\
  ### 鼠标事件类\n\n这是 `Input Event` 类的子类。此事件表示组件中发生了鼠标操作。当且仅当鼠标光标位于组件子级未被遮挡的部分、或者位于菜单或顶层窗口上时，才认为鼠标操作发生在特定的组件中。\n\
  \n此事件既用于鼠标事件（点击、进入、按下、移出、释放），也用于鼠标移动事件（移动和 拖拽）。\n\n#### 方法\n\n- `int getButton()`:\
  \ 返回哪个鼠标键的状态发生了变化（如果有）。\n- `int getClickCount()`: 返回与此事件相关的鼠标点击次数。\n- `static String\
  \ getMouseModifiersText(int modifiers)`: 返回一个描述事件期间按下的修饰符按键的字符串，例如“Shift”或“Ctrl\
  \ + shift”。\n- `point getPoint()`: 返回事件相对于源组件的 x, y 位置。\n- `int getX()`: 返回事件相对于源组件的水平\
  \ x 位置。\n- `int getY()`: 返回事件相对于源组件的垂直 y 位置。\n- `boolean isPopupTrigger()`: 返回此鼠标事件是否为该平台的弹出菜单触发事件。\n\
  \n**注意：** 弹出菜单在不同系统上的触发方式不同。因此，为了实现良好的跨平台功能，应该在鼠标按下和鼠标释放时都检查 `isPopupTrigger()`。\n\
  \n### 处理鼠标事件\n\n#### 示例 18.7\n\n```java\n1. import java.awt.*;\n2. import java.awt.event.*;\n\
  3. class A7\n4. { \n5.   public static void main(String args[])\n6.   { \n7.   \
