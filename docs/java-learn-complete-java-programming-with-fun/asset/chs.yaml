  \ 的 `area()`\n`Circle` 的 `display()`\n`Rectangle` 的 `getdata()`\n`Rectangle` 的 `area()`\n\
  `Rectangle` 的 `display()`\n\n## 抽象类与抽象方法\n\n我们已经看到，通过将一个方法标记为 `final`，我们可以确保该方法在子类中不被重定义。Java\
  \ 允许我们进行与此完全相反的操作。即我们可以指明某个方法在子类中必须被重定义，从而使重写成为强制性。这是通过在方法定义中使用关键字 `abstract` 实现的。\n\
  \n在某些情况下，我们希望定义一个超类，它声明某个特定抽象的结构，但不提供每个方法的完整实现。\n\n也就是说，有时我们想要创建一个超类，它只定义一个被所有子类共享的泛化形式，而将细节留给每个子类去填充。\n\
  \n此类类决定了子类必须实现的方法性质。这种情况发生的一种方式是超类无法为某个方法创建有意义的实现。\n\n要声明抽象方法，请使用以下通用形式：\n\n`abstract\
  \ return_type name (parameter-list);`\n\n没有任何方法体。任何包含一个或多个抽象方法的类也必须声明为抽象类。要声明一个类为\
  \ `abstract`，我们只需要在声明开头的 `class` 关键字前面使用 `abstract` 关键字。\n\n抽象类不能对象。也就是说，抽象类不能使用\
  \ `new` 操作符直接实例化。这样的对象是无用的，因为抽象类没有完全定义。\n\n此外，我们不能声明抽象构造函数或抽象静态方法。抽象类的任何子类必须实现超类中所有的抽象方法，要么自身被声明为抽象类。\n\
  \n### 示例 6.6:\n\n```java\nabstract class Shape\n{\n    abstract void getdata();\n\
  \    abstract void area();\n    abstract void display();\n}\nclass Circle extends\
  \ Shape\n{\n    void getdata()\n    {\n        System.out.println(\"getdata() of\
  \ Circle\");\n    }\n    void area()\n    {\n        System.out.println(\"area()\
  \ of Circle\");\n    }\n    void display()\n    {\n        System.out.println(\"\
  display() of Circle\");\n    }\n}\nclass Rectangle extends Shape\n{\n    void getdata()\n\
  \    {\n        System.out.println(\"getdata() of Rectangle\");\n    }\n    void\
  \ area()\n    {\n        System.out.println(\"area() of Rectangle\");\n    }\n \
  \   void display()\n    {\n        System.out.println(\"display() of Rectangle\"\
  );\n    }\n}\nclass InheritTest6\n{\n    public static void main(String args[])\n\
  \    {\n        //超引用变量可以接受子类对象\n        //动态绑定\n        Shape s[]={new Circle(),\
  \ new Rectangle()};\n        for(int i=0;i<s.length;i++)\n        {\n          \
  \  s[i].getdata();\n            s[i].area();\n            s[i].display();\n    \
  \    }\n    }\n}\n```\n\n输出:\n\n```\ngetdata() of Circle\narea() of Circle\ndisplay()\
  \ of Circle\ngetdata() of Rectangle\narea() of Rectangle\ndisplay() of Rectangle\n\
  ```\n\n## Final 方法:-\n\n如果我们不希望某个方法被派生类方法重写，那么可以将基类方法定义为 `final`。任何重写该方法的尝试都会导致编译时错误。\n\
  \n```java\nclass A\n{\n    final void method1()\n    {\n        //\n    }\n}\nclass\
  \ B extends A\n{\n    void method1()  // 错误\n    {\n        //\n    }\n}\n```\n\n\
  ## Final 类:-\n\n有时出于安全考虑，我们可能希望防止类被进一步子类化。不能被子类的类被称为 `final` 类。在 Java 中通过使用 `final`\
  \ 关键字来实现：\n\n```java\nfinal class A1\n{\n    //\n}\nclass B extends A    // 错误\n\
  {\n    //\n}\n```\n\n任何继承类 `A` 的尝试都会导致错误，编译器将不允许这样做。声明 `final` 防止了任何扩展。编译器还允许某些优化。\n\
  \n## 理论题：\n\n1. 什么是继承？\n2. Java 中有多少种类型？\n3. 默认构造函数和参数构造函数之间的区别是什么？\n4. final 类和\
  \ final 方法之间的区别是什么？\n5. 什么是超类？\n6. 什么是抽象类？\n7. 编译时绑定和运行时绑定的区别是什么？\n8. 方法重载和方法重写的区别是什么？\n\
  \n# 第 7 章：面向对象编程\n\n### 引言\n\n面向对象编程对比过程化编程:-\n\n所有程序由两个元素组成：过程（逻辑）和数据。取决于主要关注的是处理还是数据，可以有两种方法。过程化语言（c,\
  \ FORTRAN, PASCAL, COBOL 等）关注“正在发生什么”（过程），而对“谁是什么”（数据）的关注较少。随着程序变得巨大，过程化方法变得越来越不再适用。开发面向对象编程语言是为了克服过程化语言的局限性。\n\
  \n这两种方法的基本区别总结如下：\n\n(i) 面向向对象的程序是以数据为中心的，而用过程化语言编写的程序是以过程为中心的。\n(ii) 面向对象的程序围绕数据（对象）组织，因此它们能更好地模拟现实世界的对象。\n\
  (iii) 与过程化方法相比，面向对象方法代码的可重用性和扩展性非常高。因此代码量较小。\n(iv) 面向对象的程序更容易维护，因为它们相对复杂性较低且尺寸较小。\n\
  (v) 面向对象的程序基于自底而上的设计方法，而过程化程序基于自顶而下的设计方法。\n\n## OOP（面向对象编程）的基本概念：\n\n下面提到了面向对象编程的一些基本元素：\n\
  \n* 抽象\n* 对象和类\n* 三大 OOP 原则：\n    * 封装\n    * 继承\n    * 多态\n* 持久化\n* 泛型\n* 组合 /\
  \ 聚合\n\n### 1. 抽象:-\n\n抽象是包括过程化语言在内的任何编程语言的基本元素之一。内置数据类型的概念也是一种抽象。在 C 语言中使用 `struct`\
  \ 定义自定义数据类型的特性进一步扩展了这种抽象。\n\n抽象的基本目的是通过隐藏细节来降低复杂性。例如，建筑不被视为建筑材料的集合，而是一个具有独特特征和属性的定义良好的对象。\n\
  \n抽象可以定义为识别对象的本质属性和行为，而不深入细节。对象的属性和行为将其与其相似类型的对象区分开来，并有助于对对象进行分类/分组。\n\n面向对象编程语言使用\
  \ `classes` 和 `objects` 来模拟抽象。\n\n### 2. 对象和类:-\n\n\n\n\n\n## 对象 (Object)\n对象是一个物理或抽象的实体或事物它可以与其他相似类型的对象区分开来。对象具有三个特征：\n\
  \n(i) 标识（Identification）。\n(ii) 属性（Properties / Attributes）。\n(iii) 行为（Behaviors\
  \ / Methods / Operations / Functions）。\n\n对象也可以被视为 `class` 的实例，其中 `class` 类似于一个内置数据类型，而对象就是\
  \ `variable`。\n\n## 类 (Class)\n`class` 通过抽象其属性和行为来表示一类对象。`class` 可以被看作创建对象的蓝图。对象具有其\
  \ `class` 定义的属性和行为。`class` 可以被视为用户自定义的数据类型，而对象是该 `class` 所代表的数据类型的 `variable/instance`（变量/实例）。\n\
  \n对象的属性是通过是通过 `Java` 中的数据成员/字段（data members / fields）定义的。`class` 中的数据成员/字段是一个可以存储数据的\
  \ `variable`。对象的行为/操作是使用 `Java` 中的 `methods`（方法）定义的。数据成员和 `methods` 都称为 `class`\
  \ 的成员。\n\n`class` 也可以被视为用户自定义的数据类型，而对象是该数据类型的 `variable`。一旦定义了 `class`，我们就可以创建任意属于该\
  \ `class` 的对象。\n\n# 三大面向对象原则 (Three OOP Principles)\n\n## 封装 (Encapsulation)\n封装是将代码以及代码对所作用的数据结合在一起的机制。`Java`\
  \ 类支持这种机制，因为它们允许我们共同定义代码和数据。封装还通过将某些类成员声明为 `private` 来帮助数据隐藏，使得它们无法从不属于该 `class`\
  \ 的代码访问。\n\n## 继承 (Inheritance)\n在面向对象编程中，继承指的是一个 `class` 的属性对被称为子类（sub-classes）或派生类（derived\
  \ classes）的其他类可用。子类或派生类是派自现有 `class` 的类。它继承现有 `class` 的所有特征，该现有类也被称为基类（base-class）或超类（super-class）。因此，继承可以定义为从\
  \ `super-class` 或 `base-class` 派生出一个 `class` 的过程。继承 `class` 不会给 `base-class/super-class`\
  \ 引入任何变化。与 `base-class` 相比，派生类/子类具有更大量的属性和行为。\n\n继承的主要优势是代码复用。如果 `base class` 使用使用了很长时间，并且需要添加一些额外的属性和方法，我们可以通过派生另一个\
  \ `class` 来实现。派生类将能够使用 `base class` 的代码而无需调试，因为它已经使用了很长时间了。\n\n### 类层次结构 (Class\
  \ Hierarchy)\n所有派生自同一个 `base class` 的类都属于一个家族并形成类层次结构。类层次结构可以与树结构相比，其中一个 `base class`\
  \ 位于根节点且没有 `super-class`。\n\n所有其他类要么派生自层次根节点的 `class`，要么派生自某些直接或间接派生自根类的类。随着我们在树向下移动，增加的功能越来越多。叶节点表示的类没有任何子类。以下示例展示了一些类层次结构。\n\
  \n![image](img/image088.png)\n\n## 多态 (Polymorphism)\n多态是一项允许同一接口用于一类通用操作特性。大多数面向对象的语言在以下情况下使用多态：\n\
  \n*   运算符重载 (Operator Overloading)。\n*   方法重载 (Method Overloading)。\n*   方法重写 (Method\
  \ Overriding)。\n\n### 运算符重载 (Operator Overloading)\n大多数语言对内置操作使用这种形式的多态。例如，`C/C++`\
  \ 或 `Java` 中的所有算术运算符都可以用于许多类型的操作数（`int`, `long`, `float`, `double` 等）。因此，相同的加法运算符可以用于加两个整数也可以加两个浮点数。\n\
  \n`C++` 允许用户重载内置运算符。例如，我们可以重载算术运算符来处理复数。虽然 `Java` 对内置运算符使用了运算符重载，但它不允许用户重载运算符。\n\
  \n### 方法重载 (Method Overloading)\n这一特性允许我们编写多个同名的 `methods`。`C++` 和 `Java` 都具有这一特性。同名的\
  \ `methods`（`C++` 中为 `function`）根据参数（arguments）进行区分。重载方法必须具有不同的参数数量，或者如果参数数量相同，参数的类型必须不同。\n\
  \n如果重载方法的调用可以在编译时解析，即如果编译器可以决定调用哪一个重载方法，则这被称为静态绑定（static binding），它是编译时多态的例子。\n\n\
  如果重载方法的调用无法编译时解析，即如果编译器无法决定调用哪一个重载方法，则这被称为动态绑定（dynamic binding），它是运行时多态的例子。\n\n\
  通常情况下 `Java` 在运行时解析对重载方法的调用，但在许多情况下，重载方法的调用是在编译时解析的。\n\n### 方法重写 (Method Overriding)\n\
  子类可以定义一个与 `super class` 中相同的 `method`，且具有相同数量和类型的参数。这被称为方法重写。\n\n编译器无法解析对重写方法的调用。`Java`\
  \ 通常使用动态绑定来解析重写方法的调用，即决策发生在运行时。\n\n## 持久化 (Persistence)\n某些面向对象的语言允许我们从/到持久化存储介质存储/检索程序的状态，即次级存储之类的永久存储介质。\n\
  \n`Java` 允许我们在次级存储中存储任何对象并在以后检索它。如果我们尝试在对象图的顶端存储一个对象，所有其他引用的对象都将被递归地找到并保存。同样，当以后检索对象时，所有对象及其引用（即整个对象图）都会在主内存中正确创建。\n\
  \n例如，通过仅保存树的根节点就可以保存整个树结构。在稍后的阶段，可以在内存中重建树结构。\n\n## 泛型 (Genericity)\n定义一种算法，独立于任何特定数据类型，然后毫不费力地将该算法应用于各种数据类型的概念被称为泛型。`C++`\
  \ 使用 `templates`（模板）支持这一特性。`Java` 也通过 `Object class` 支持这一特性，该类位于 `Java` 中任何类层次结构的顶端。\n\
  \n例如，通过使用这一特性，我们可以实现一个泛型数据类型 `stack`，使得在 `stack` 中存储任意元素都是可能的。这一特性在很大程度上提高了复用性。\n\
  \n## 组合 / 聚合 (Composition / Aggregation)\n对象可能由其他对象组成。这样的对象被称为组合对象或聚合对象。例如，如果将 `class\
  \ vehicle` 的对象定义为由 `Engine`、`Body`、`Axle`、`Seats` 等对象组成的组合对象是合适的。\n\n## 继承对比组合 (Inheritance\
  \ v/s Composition)\n从现有类派生新类有两种基本机制：继承和组合。`class Bus` 可以通过继承 `class vehicle` 的属性来派生。这里\
  \ `Bus` 是 `vehicle` 的一种，除了所有车辆共有的属性和行为外，它还有额外的属性/行为。\n\n换说 `class Bus` 与 `class\
  \ vehicle` 之间存在“是”（is-a）关系，我们可以说 `Bus` 是一辆车辆。\n\n`class vehicle` 本身可能通过组合派自许多其他类。例如，`class\
  \ vehicle` 的对象可能由属于 `Engine`、`Gear Box`、`Seats`、`Driver’s Seat Body` 和 `Steering\
  \ Wheel` 等类的对象组成。\n\n\n\n\n\n在这种情况下，派生类与表示组合对象部分的类之间存在“整体与部分”的关系。我们不能说 `vehicle`\
  \ 是一个 `Engine` 或 `Vehicle` 是一个 `Gear Box`，因为 `Vehicle` 是由许多部分组成的。\n\n# 超类与子类\n\n\
  通常，一个类的对象也是另一个类的对象（即“是一个”）。`rectangle` 确实 `quadrilateral`（正方形、平行边形和梯形也是如此）。因此，可以说类\
  \ `Rectangle` 继承自类 `Quadrilateral`。在这种背景下，`Quadrilateral` 类是超类，而 `Rectangle` 类是子类。\n\
  \n`rectangle` 是 `quadrilateral` 的特定类型，但声称 `quadrilateral` 是 `rectangle` 是错误的（四边形可能是平行边形）。图展示了超类和潜在子类的几个简单继承示例。继承产生的子类比其超类更多的特征，因此超类和子类这两个术语可能会引起混淆。\n\
  \n然而，另一种看待这些术语的方法是完全合理的。因为每个子类对象都是其超类的对象，而且一个超类可以有多个子类，所以超类所表示的对象集合通常比该超类的任何子类所表示的对象集合要大。\n\
  \n例如，超类 `Vehicle` 以通的方式表示所有车辆，如汽车、卡车、船只、自行车等。然而，子类 `Car` 只代表了世界上所有 `Vehicles` 中的一小部分。继承关系形成了树状的层次结构。\n\
  \n超类与其子类之间存在层次关系。一个类完全可以独立存在，但只有当一个类被用于继承机制时，它才会成为为其他类提供属性和行为的超类，或者成为继承这些属性和行为的子类。经常，一个类既是子类也是超类。\n\
  \n| 超类 | 子类 |\n| :--- | :--- |\n| Student | 研究生、本科生 |\n| Shape | 圆形、三角形、矩形 |\n|\
  \ Loan | 汽车贷款、住房贷款、教育贷款 |\n| Employee | 教职工、职员员工 |\n| Account | 支票账户、储蓄账户 |\n\n\
