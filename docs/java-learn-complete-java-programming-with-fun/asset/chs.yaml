  \  }\n}\n```\n\nOutput:\n![image](img/image096.png)\n\n### CardLayout (卡片布局)\n\n\
  在 `CardLayout` 中，我们可以存储许多卡片，但一次只显示一张。同一时间只有一个卡片可见，但你可以从一张卡片切换到另一张。这里的卡片指的是一个 `Panel`。\n\
  \n如果我们想一次显示两个卡片，就必须先创建两个 `Panel`（每个卡片一个），然后创建一个主 `Panel` 来包含这两个卡片。这对于具有可选组件的用户用户界面来说非常有用，这些组件可以根据用户输入动态启用或禁用。\n\
  \n#### 构造函数\n\n- `CardLayout()`：创建一个间隙为 0 的新卡片布局。\n- `CardLayout(int, int)`：创建一个具有指定的水平和垂直间距的新卡片布局。水平间距放置在左、右边缘。垂直间距放置在顶部和底部边缘。\n\
  \n与其他布局相比，`CardLayout` 需要更多的工作。卡片通常存储在一个类型为 `panel` 的对象中。当卡片添加到面板时，通常会给它们指定一个名称。因此，我们在向面板添加卡片时将使用\
  \ `add()` 方法。\n\n` add(Component objpanel, Object objname)` 在这里，`objname` 是一个字符串，用于指定由\
  \ `objpanel` 指定面板的卡片名称。\n\n#### 方法\n\n- `void first(Container parent)`：跳转到容器的第一张卡片。\n\
  - `void next(Container parent)`：跳转到给定容器的下一张卡片。如果当前可见卡片是最后一张，此方法将翻到布局的第一张卡片。\n- `void\
  \ previous(Container parent)`：跳转到给定容器的上一张卡片。如果当前可见卡片是第一张，此方法将翻到布局的最后一张。\n- `void\
  \ last(Container parent)`：跳转到容器的最后一张卡片。\n- `void show(Container parent, String name)`：跳转到以给定名称布局的组件。如果不存在此类组件，则会发生（异常）。\n\
  \n使用以下步骤创建 CardLayout：\n1. 创建一个新的 `Panel` 对象和一个 `CardLayout` 对象。\n2. 使用第一步中创建的实例将\
  \ `Panel` 对象的布局设置为 `CardLayout`。\n3. 现在为每张卡片创建一个单独的 `Panel` 对象，并添加我们想要添加到该 `Panel`\
  \ 中的任何内容，如按钮、复选框等。\n4. 在步骤 3 中创建的每个 `Panel` 对象在添加到主面板时都需要唯一的名称。\n5. 最后将主面板添加到容器中。\n\
  \n### 示例 17.10\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nimport\
  \ java.applet.*;\n/*<applet code=\"CardLayoutTest\" width=500 height=100></applet*/\n\
  public class CardLayoutTest extends Applet implements ActionListener, MouseListener\n\
  {\n  Panel mp;\n  CardLayout c1;\n  public void init()\n  {\n    Button b1=new Button(\"\
  First\");\n    Button b2=new Button(\"Second\");\n    b1.addActionListener(this);\n\
  \    b2.addActionListener(this);\n    add(b1);\n    add(b2);\n    Panel p1=new Panel();\n\
  \    Label l1=new Label(\"INDIA\");\n    p1.add(l1);\n    Panel p2=new Panel();\n\
  \    Label l2=new Label(\"USA\");\n    p2.add(l2);\n    mp=new Panel();\n    c1=new\
  \ CardLayout();\n    mp.setLayout(c1);\n    mp.add(p1,\"Country1\");\n    mp.add(p2,\"\
  Country2\");\n    add(mp);\n    addMouseListener(this);\n  }\n  public void actionPerformed(ActionEvent\
  \ ae)\n  {\n    Button b=(Button)ae.getSource();\n    if(b.getLabel().equals(\"\
  First\"))\n      c1.show(mp,\"Country1\");\n    else\n      c1.show(mp,\"Country2\"\
  );\n  }\n  public void mousePressed(MouseEvent me)\n  {\n    c1.next(mp);\n  }\n\
  \  public void mouseReleased(MouseEvent me){}\n  public void mouseClicked(MouseEvent\
  \ me){}\n  public void mouseEntered(MouseEvent me){}\n  public void mouseExited(MouseEvent\
  \ me){}\n}\n```\n\n输出:\n![image](img/image022.png)\n\n### GridBagLayout\n\n`GridBagLayout`\
  \ 是标准布局管理器中最复杂且最灵活的。虽然它听起来应该是 `GridLayout` 的子类，但它完全不同。在 `GridLayout` 中，元素排列...\n\
  \n#### 示例 17.11\n\nAWT 组件可以分类为：\n1. 视觉组件（Visual Components）。\n2. 容器组件（Container\
  \ Components）。\n3. 菜单组件（Menu Components）。\n\n视觉组件和容器组件都属于从 `java.awt.Component`\
  \ 开始的组件层次结构。（菜单组件继承自 `java.awt.MenuComponent`，因此它们不继承相同的父类功能）。\n\n### `java.awt.Component`\
  \ 类的方法\n\n由于继承自 `java.awt.component`，所有视觉和容器组件都实现了几个方法。这些方法如下：\n\n- `Dimension getSize()`：以\
  \ `Dimension` 对象的形式返回组件的大小，该对象具有类型为 `int` 的公共数据成员 `height` 和 `width`。\n- `void setBackground(Color\
  \ c)`：设置组件的背景颜色。背景通常用于渲染组件的非文本区域。\n- `void setForeground(Color c)`：设置组件的前景颜色。通常组件的前景颜色用于渲染文本。如果没有显式设置组件的前景或背景颜色，组件将使用其直接父容器的前景和背景颜色。\n\
  - `void setFont(Font f)`：设置组件的字体。\n\n\n\n\n\n`setFont()` 方法决定了组件在渲染其需要显示的任何文本时使用的字体。如果我们不显式设置组件的字体，则组件将使用其容器的字体。\n\
  \n```\nvoid setEnabled(Boolean b)\n```\n如果参数为 `true`，则组件具有正常外观。如果参数为 `false`，则组件将显示为灰色且不对用户输入做出响应。\n\
  \n```java\nvoid setSize (Dimension d)\n```\n设置组件的大小。\n\n```java\nvoid setSize (int\
  \ width, int height)\n```\n设置组件的大小。\n\n```java\nvoid setBounds (int x, int y, int\
  \ width, int height)\n```\n尝试移动并调整组件的大小。左上角的新位置由 `x` 和 `y` 指定，新尺寸由 `width` 和 `height`\
  \ 指定。\n\n```java\nvoid setVisible (Boolean b)\n```\n此方法接受一个布尔值参数，用于决定组件是否在屏幕上显示。此方法通常用于帧（frames）。\n\
  \n### Note\n如果我们尝试过调用 `setSize()` 或 `setBounds()` 方法，我们就会知道这通常是徒劳的。我们试图给组件的大小和位置会被布局管理器（layout\
  \ manager）覆盖。\n\n事实上，这两个方法的存在大部分是为了供布局管理器使用的。该规则的一个主要例外是 `Frame` 类，它不受布局管理器的控制，并且完全愿意让我们设置它的尺寸或边界。\n\
  \n### 视觉组件\n视觉组件是用户实际上可以看到并与之交互的组件。AWT 支持以下视觉组件：\n\n* `Button`（按钮）\n* `Canvas`（画布）\n\
  * `Checkbox`（复选框）\n* `Choice`（选择框）\n* `FileDialog`（文件对话框）\n* `Label`（标签）\n* `List`（列表）\n\
  * `ScrollPane`（滚动面板）\n* `Scrollbar`（滚动条）\n* `TextArea`（文本区域）\n* `TextField`（文本字段）\n\
  \n要在 GUI 中使用这些组件之一，我们首先通过调用相应的构造函数来创建一个实例。然后将组件添加到容器中。\n\n### 按钮\n`Button` 类实现了一个推入按钮。\n\
  \n#### 构造函数\n* `Button()`\n* `Button(String)`\n构造函数接受一个字符串参数，用于指定按钮标签的文本。当按钮被按下时，它会发送一个\
  \ `Action` 事件。\n\n#### 方法\n* `String getLabel()`\n获取此按钮的标签。\n* `void setLabel(String\
  \ label)`\n将按钮的标签设置为指定的字符串。\n* `void addActionListener(ActionListener l)`\n添加指定的动作监听器以接收来自此按钮的动作事件。\n\
  \n**示例 17.12**\n```java\nimport java.awt.*;\nclass ButtonTest\n{\n  public static\
  \ void main(String args[]) \n  {\n      Frame f=new Frame(\"Testing Button Component\"\
  );\n      f.setLayout(new FlowLayout());\n      Font f1=new Font(\"Arial\",Font.BOLD,40);\n\
  \      Color c1=new Color(255,0,0);\n      Color c2=new Color(0,255,0);\n      Button\
  \ b1 = new Button();\n      Button b2 = new Button(\"Cancel\");\n      b1.setForeground(c1);\n\
  \      b2.setForeground(c1);\n      b1.setBackground(c2);\n      b2.setBackground(c2);\n\
  \      b1.setFont(f1);\n      b2.setFont(f1);\n      b1.setLabel(\"Ok\");\n    \
  \  System.out.println(b2.getLabel());\n      f.add(b1);\n      f.add(b2); \n   \
  \   f.setSize(500,200);\n      f.setVisible(true);\n  }\n}\n```\n输出：\n![image](img/image064.png)\n\
  \n### 画布\n`Canvas` 是一个组件，没有默认的外观或行为。我们可以通过子类 `canvas` 来创建自定义的绘制区域、工作区域、组件等。画布接收来自鼠标和键盘的输入事件，将这些输入转换为有意义的外观效果取决于程序员。\n\
  \n画布的默认尺寸（或者更准确地说，是首选尺寸）小得毫无用。处理这个问题的一种方法是使用能够调整画布大小的布局管理器。另一种方法是我们自己对画布调用 `setSize()`，画布是这种方法可能有效的少数情况之一，因为我们发送到\
  \ `setSize()` 方法的值将变成画布的首选尺寸。\n\n**示例 17.13**\n```java\nimport java.awt.*;\nclass\
  \ CanvasTest\n{ \n  public static void main (String args [])\n  { \n      Frame\
  \ f = new Frame();\n      f.setLayout(new FlowLayout());\n      Canvas c=new MyCanvas();\n\
  \      c.setSize(100,100);\n      f.add(c);\n      f.setSize(300,300);\n      f.setVisible(true);\n\
  \  }\n}\nclass MyCanvas extends Canvas\n{\n  public void paint(Graphics g )\n  {\n\
  \      setBackground(Color.green);\n      g.setColor(Color.red);\n      g.drawLine(0,\
  \ 0, 99, 99);\n  }\n}\n```\n输出：\n![image](img/image073.png)\n\n### 复选框\n复选框是一个双状态按钮。两个状态为\
  \ `true`（已选中）和 `false`（未选中）。复选框的三种基本形式为：\n\n#### 构造函数\n* `Checkbox()`\n创建一个标签为空字符串的框。\n\
  * `Checkbox(String label)`\n创建一个带有指定标签的框。\n* `Checkbox(String label, boolean state)`\n\
  创建一个带有指定标签和初始状态的框。\n\n#### 方法\n* `String getLabel()`\n获取此框的标签。\n* `void setLabel(String\
  \ label)`\n将框的标签设置为指定的字符串。\n* `boolean getState()`\n确定此框是处于“开启”还是“关闭”状态。\n* `void\
  \ setState(boolean state)`\n将框的状态设置为指定的状态。\n* `void addItemListener(ItemListener\
  \ l)`\n添加指定的监听器以接收来自此框的项事件。\n\n**示例 17.14**\n```java\nimport java.awt.*;\nclass\
  \ CheckboxTest\n{\n  public static void main(String args[])\n  {\n      Frame f\
  \ = new Frame(\"Testing Component Component\");\n      f.setLayout(new((3,1)); \
  \            c c1 new Checkbox();\n      Checkbox c2=new\",(\");\ntrue););3=new\
  \ Check=(\" Check\");\n      c1.setLabel(\"BreakFast\");\n      c3.setState(true);\n\
  \      f.add(c1);f.add(c2);f.add(c3);\n\n      if(c1.getState())\n        System.out.println(c1.getLabel());\n\
  \      if(c2.getState())\n        System.out.println(c2.getLabel());\n      if(c3.getState())\n\
  \        System.out.println(c3.getLabel());\n\n      f.setSize(100,100);\n     \
  \ f.setVisible(true);\n  }\n}\n```\n输出：\n![image](img/image023.png)\n\n**另一个示例**\n\
  ```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass CheckboxTest extends\
  \ Frame implements ItemListener\n{\n  Checkbox c1;\n  TextField tf1;\n  CheckboxTest()\n\
  \  {\n      setLayout(new GridLayout(2,1));\n      c1=new Checkbox(\"Red\");\n \
  \     c1.addItemListener(this);\n      add(c1);\n      tf1=new TextField();\n  \
  \    add(tf1);\n      setSize(100,100);\n      setVisible(true);\n  }\n  public\
  \ static void main(String args[])\n  {\n      new CheckboxTest();\n  }\n  public\
  \ void itemStateChanged(ItemEvent ie)\n  {\n      if(c1.getState())\n        tf1.setBackground(Color.red);\n\
  \      else\n        tf1.setBackground(Color.white);\n  }\n}\n```\n\n### 单选按钮\n\
  复选框可以被组合成复选框组，它们具有单选行为。在单选行为下，复选框组中始终只有一个成员可以为 `true`；选择新成员会将之前选中的成员的状态设置为 `false`。许多窗口系统（例如\
  \ Motif）将单选组实现为组件。\n\n我们可以通过创建多个复选框并使用 `java.awt.CheckboxGroup` 类将它们分组来实现单选行为。在\
  \ Java 中，`java.awt.CheckboxGroup` 类不是组件；它仅仅是一个组织复选框的不可见类。这意味着 Java 不对复选框成员之间的空间关系施加任何限制。\n\
  \n\n\n\n如果我们愿意，可以将一组中的一个成员放在框架的左上角，将另一个成员放在右下角，并将第三个成员放在完全不同的框架中。当然，结果很可能违背逻辑和大多数\
  \ GUI 样式指南。\n\n`CheckboxGroup` 类的两种方法支持支持获取和设置当前选中的成员或组。\n\n`Checkbox getSelectedCheckbox()`\n\
  \n获取来自此复选框组的当前选择。\n\n`void setSelectedCheckbox(Checkbox box)`\n\n将此组中当前选中的复选框设置为指定的复选框。\n\
  \n### 示例 17.15\n\n```java\nimport java.awt.*;\nclass CheckboxGroupTest\n{\n    public\
  \ static void main(String args[])\n    {\n      Frame f = new Frame(\"Testing RadioButton\
  \ Component\");\n      f.setLayout(new GridLayout(3,1));\n      CheckboxGroup cbg=new\
  \ CheckboxGroup();\n      Checkbox c1=new Checkbox(\"BreakFast\",false,cbg);\n \
  \     Checkbox c2=new Checkbox(\"Lunch\",true,cbg);\n      Checkbox c3=new Checkbox(\"\
  Dinner\",false,cbg);\n      c3.setState(true);\n      f.add(c1);f.add(c2);f.add(c3);\n\
  \      if(c1.getState())\n        System.out.println(c1.getLabel());\n      else\
  \ if(c2.getState())\n        System.out.println(c2.getLabel());\n      else if(c3.getState())\n\
  \        System.out.println(c3.getLabel());\n      f.setSize(100,100);\n      f.setVisible(true);\n\
  \    }\n}\n```\n输出：\n![image](img/image041.png)\n\n### Choice\nChoice 是一种下拉/弹出列表。\n\
  \n#### 方法\n`void add(String item)` 向此 Choice 菜单添加一个项。\n`void addItemListener(ItemListener\
  \ i)` 添加指定的监听器以接收来自此 choice 菜单的项。\n`String getItem(int index)` 获取 Choice 菜单中指定索引处的\
  \ `String`。\n`int getItemCount()` 返回 Choice 菜单中的项数。\n`int getSelectedIndex()` 返回当前选中项的索引。\n\
  `String getSelectedItem()` 获取当前选择的字符串表示。\n`void insert(String item, int index)`\
  \ 在此 choice 的指定位置插入项。\n`void remove(int position)` 从 choice 菜单中删除第一个出现的项。\n`void\
  \ remove(String item)` 从 Choice 菜单中删除第一个出现的项。\n`void removeAll()` 从 choice 菜单中的所有项。\n\
  `void select(int pos)` 将此 choice 菜单中的选中项设置为指定位置的项。\n`void select(String Str)` 将此\
  \ Choice 菜单中的选中项设置为与指定字符串相等的项。\n\n### 示例 17.16\n```java\nimport java.awt.*;\nclass\
  \ ChoiceTest\n{\n  public static void main(String args[]) throws InterruptedException\n\
  \    {\n      Frame f = new Frame(\"Testing Choice Component\");\n      f.setLayout(new\
  \ FlowLayout());\n      f.setSize(100,100);\n      f.setVisible(true);\n      Choice\
  \ c1=new Choice();\n      c1.add(\"BreakFast\");\n      c1.add(\"Lunch\");\n   \
  \   c1.add(\"Dinner\");\n      f.add(c1);\n      c1.select(\"Dinner\"); // c1.select(2);\n\
  \      Thread.sleep(1000);\n      System.out.println(c1.getSelectedItem());\n  \
  \    System.out.println(c1.getSelectedIndex());\n      System.out.println(c1.getItemCount());\n\
  \      System.out.println(c1.getItem(0));\n      c1.insert(\"Brunch\",1);\n    \
  \  c1.remove(2); // c1.remove(\"Lunch\");\n    }\n}\n```\n输出：\n![image](img/image028.png)\n\
  \n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass CheckboxItemTest\
  \ extends Frame implements ItemListener\n{\n  TextField tf1;\n  Choice c1;\n  CheckboxItemTest()\n\
  \    {\n      setLayout(new FlowLayout());\n      c1=new Choice();\n      c1.add(\"\
  red\");\n      c1.add(\"green\");\n      c1.add(\"blue\");\n      tf1 = new TextField(8);\n\
  \      tf1.setBackground(Color.red);\n      c1.addItemListener(this);\n      add(c1);\n\
  \      add(tf1);\n      setSize(200,200);\n      setVisible(true);\n    }\n  public\
