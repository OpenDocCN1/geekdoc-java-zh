  16.      sb3.addAdjustmentListener(this);\n17.      TextField tf1 = new TextField();\n\
  18.      add(sb1);\n19.      add(sb2);\n20.      add(sb3);\n21.    public void valueChanged(AdjustmentEvent\
  \ e)\n22.      {\n23.      int a=e.getValue();\n24.      tf1.setText(a);\n25.  \
