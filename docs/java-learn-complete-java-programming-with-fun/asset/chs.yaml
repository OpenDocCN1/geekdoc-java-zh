  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n# ∞ 3 ∞\n## (控制语句)\n\n### 引言\n控制语句用于改变执行流。Java\
  \ 的控制语句可以分为三类。\n\n1. **选择语句（选择控制结构）** 选择语句允许程序根据表达式的结果或变量的状态，从一组不同的执行路径中选择任意一条路径。\n\
  \n1.1. `if`\n2. `if else`\n3. `嵌套 if else`\n4. `if-else-if`\n5. `switch`\n\n(a)\
  \ `if` 的语法 (b) `if else` 的语法\n```\nif(condition)      if(condition)\n{        {\n\
  statements;    }\n}      else\n{\n}\n```\n(c) 嵌套 `if else` 的语法 (d) `if-else-if`\
  \ 阶梯的语法\n```\nif(condition)      if(condition1)\n{        {\nif (condition)    }\n\
  {\n  else if(condition2)\n  {\nelse      }\n  else if(condition3)\n  {\n  }\n}\n\
  else        else\n{        {\nif (condition)    }\n{        \n}\n          \nelse\
  \          \n{          \n}\n}\n```\n(e) `switch case` 的语法\n```java\nswitch(expression)\n\
  {\ncase 1:\nstatement 1 sequence;\nbreak;\ncase 2:\nstatement 2 sequence;\nbraek;\n\
  case 3:\nstatement 3 sequence;\nbreak;\ncase n:\nbreak;\ndefault :\ndefault statement\
  \ sequence;\n}\n```\n\n示例 3.1 寻找两个数最大值的程序 (`Max.Java`)\n```java\n2. class Max\n\
  3. {\n4.   public static void main(String args[])\n5.   {\n6.     int a,b,max;\n\
  7.     a = 10;\n8.     b = 20;\n9.     if(a>b)\n10        max = a;\n11.      else\n\
  12        max = b;\n13.      System.out.println(\"Max of two numbers is \" + max);\
  \ //输出\n14.    }\n15. }\n```\n输出：\nMax of two numbers is 20\n\n1. **迭代语句（循环控制结构）**\
  \ 循环我们可以重复单个语句或一组语句 n 次的过程。\n\n1.1. `for`\n2. `while`\n3. `do while`\n\n(a) `for`\
  \ 循环的语法。\n```java\nfor( initialize; condition; increment/decrement)\n{\nstatements;\n\
  }\n```\n(b) `while` 循环的语法。\n(c)\n```java\ninitialize;\nwhile(condition)\n{\nstatements;\n\
  increment/decrement;\n}\n```\n(d) `do while` 循环的语法。\n```java\ninitialize;\ndo\n\
  {\nstatements;\nincrement/ decrement;\n} while(condition);\n```\n**注意：**\n条件可以是任何布尔表达式。只要条件表达式为真，循环体就会执行。当条件变为假时，控制立即传递到循环后的下一行代码。\n\
  \n示例 3.2\n```java\n1. class Loop1\n2. {\n3.   public static void main(String args[])\n\
  4.   {\n5.     int n=5;\n6.     for(int i=1;i<=n;i++)\n7.     {\n8.        for(int\
  \ j=1;j<=i;j++)\n9          System.out.print(j);\n10         System.out.println();\n\
  11.     }\n12.   }\n```\n输出：\n1\n12\n123\n1234\n12345\n\n### 跳转语句\n它允许我们的程序以非线性的方式工作。\n\
  1. `break`。\n2. `标签 break` (labeled break)。\n3. `continue`。\n4. `标签 continue` (labeled\
  \ continue)。\n5. `return`。\n\n- 大多数语句的语法与 C/C++ 中对应的语句相同。存在一些显著差异。\n- `if`、`while`\
  \ 和 `do` 语句中的条件表达式必须是布尔表达式，即它们的值应为 true 或 false。我们不能用 0 代替 false 或用非零值代替 true（这在\
  \ C/C++ 中是有效的）。\n- Java 没有 `goto` 语句，尽管 `goto` 是保留字。Java 提供了 `labeled break` 和 `labeled\
  \ continue` 语句，它们通常被称为 `goto` 的文明形式。\n- 在 Java 中，`switch` 表达式可以是任何整数表达式（`long`），即\
  \ `switch` 表达式的类型可以是 `byte`、`short`、`char` 或 `int`。但 Java 的 `int` 是 4 字节，与 C++ 中\
  \ `long` 的大小相同。\n- `case` 标签像 C/C++ 一是常量表达式，但 `case` 标签的值必须在 `switch` 表达式的范围内，否则程序将无法编译。\n\
  - `labeled break` 语句用于终止在 `break` 语句中指定标签的块。与简单的 `break` 不同，我们可以终止任何块。例如，可以从深度嵌套的\
  \ `for` 循环内部终止最外层循环。`break` 语句也可以终止简单的块（即该块不需要是循环或 `switch` 语句）。\n- `labeled continue`\
  \ 语句指定要继续的外层循环的标签。该标签不需要对应最近的闭包循环。\n\n跳转语句示例：\n(a) `break`\n```java\nfor(int i=1;i<=10;i++)\n\
  {\n  if(i == 5)\n  break; //如果 i 是 5 则终止循环\n  System.out.print( i );\n}\n```\n输出：1\
  \ 2 3 4\n\n(b) `labeled break`\n```java\nboolean t =true;\nfirst : {\n  second:\
  \ {\n    third: {\n      System.out.println(\"Before the break\");\n      if(t)\
  \ break first; // 终止 first 块\n    }\n    System.out.println(\"This will not execute\"\
  );\n  }\n  System.out.println(\"This will not execute\");\n}\n```\n输出：\nBefore the\
  \ break\n\n(c) `continue`\n```java\nfor(int i=0;i<10;i++)\n{\n  if(i % 2 == 0) continue;\
  \ // 如果 i 是偶数则跳过\n  System.out.print( i + \" \");\n}\n```\n输出：1 3 5 7 9 \n\n(d)\
  \ `labeled continue`\n```java\nouter: for(int i=0;i<5;i++)\n{\n  inner: for(int\
  \ j=0;j<i;j++)\n  {\n    if(j==1)\n      continue outer;\n    System.out.println(\"\
  i = \" + i+\", j = \" + j );\n  }\n}\n```\n输出：\ni = 1, j = 0\ni = 2, j = 0\ni =\
  \ 3, j = 0\ni = 4, j = 0\n\ne) `return`\n```java\nvoid test() {\n  for(int i=0;\
  \ i<5; i++) {\n    if(i==2) return; // 当 i 为 2 时退出方法\n    System.out.println(i);\n\
  \  }\n}\n```\n输出：0 1\n\n# 多选题\n1. 给定以下变量：\n```java\nint one = 1;\nint two = 2;\n\
  boolean flag = true;\n```\n以下哪个是正确的？\na) `one == two`\nb) `one != two`\nc) `flag\
  \ == false`\nd) `flag != true`\n\n2. 如果 `val = 1`，如下代码：\n```java\nswitch(val)\n\
  {\ncase 1: System.out.print(\"P\");\ncase 2: System.out.print(\"Q\");\ncase 3: System.out.print(\"\
  R\");\ncase 4: System.out.print(\"S\");\n}\n```\n哪些值会被打印？\na) P\nb) PQRS\nc) PQR\n\
  \n3. 假设 `val` 被定义为正整数，如下代码：\n```java\nif( val > 4 )\n  System.out.println( \"Test\
  \ A\" );\nelse if( val > 9 )\n  System.out.println( \"Test B\" );\nelse\n  System.out.println(\
  \ \"Test C\" );\n```\n哪些 `val` 的值会导致输出 \"Test C\"\na) val < 0\nb) val 在 0 到 4 之间\n\
  c) val 在 4 到 9 之间\nd) val > 9\ne) val = 0\nf) 无值\n\n4. 对于代码：\n```java\nm = 0;\n\
  while( m++ < 2 )\n  System.out.println( m );\n```\n标准输出是以下哪个？\na) 0\nb) 1\nc) 2\n\
  d) 3\ne) 无输出且抛出异常\n\n5. 考虑代码片段：\n```java\nouter: for( int i = 1; i <3; i++ )\n{\n\
  \  inner: for( j = 1; j < 3; j++ )\n  {\n    if( j==2 )\n      continue outer;\n\
  \    System.out.println( \"i = \" + i+\", j = \" + j );\n  }\n}\n```\n以下哪些会被标准输出？\n\
  a) i = 1, j = 1\nb) i = 1, j = 2\nc) i = 1, j = 3\nd) i = 2, j = 1\ne) i = 2, j\
  \ = 2\nf) i = 2, j = 3\ng) i = 3, j = 1\nh) i = 3, j = 2\n\n答案：1(c,d,e,f,g) 2(a,b)\
  \ 3(b) 4(b,c) 5(a,d)\n\n## 理论题\n1. Java 有 \"goto\" 吗？\n2. 什么是标签循环。\n\n# 练习\n1. 编写一个程序检查给定年份是否为闰年。\n\
