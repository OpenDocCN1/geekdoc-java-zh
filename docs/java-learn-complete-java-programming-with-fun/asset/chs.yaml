  10.      Button b1 = new Button(\"Push Me\");\n11.      b1.addMouseListener(new\
  \ B());\n12.      b1.addMouseMotionListener(new C());\n13.      b1.addActionListener(new\
  \ D());\n14.      f.add(b1);\n15.      f.setVisible(true);\n16.   }\n17. }\n18.\
  \ class B implements MouseListener\n19. { \n20.   public void mouseEntered(MouseEvent\
  \ me)\n21.   { \n22.      System.out.println(\"Mouse Entered...\");\n23.      System.out.println(me.getX());\n\
  24.      System.out.println(me.getY());\n25.   }\n26.   public void mouseExited(MouseEvent\
  \ me)\n27.   { \n28.      System.out.println(\"Mouse Exited...\");\n29.      Point\
  \ p1=me.getPoint();\n30.      System.out.println(p1.x);\n31.      System.out.println(p1.y);\n\
  32.   }\n33.   public void mousePressed(MouseEvent me)\n34.   { \n35.      System.out.println(\"\
  Mouse pressed...\");\n36.      int ms = me.getModifiers();\n37.      String s =\
  \ me.getModifiersEx();\n38.      System.out.println(s);\n39.   }\n40.   public void\
  \ mouseReleased(MouseEvent me)\n41.   { \n42.      System.out.println(\"Mouse Released...\"\
  );\n43.      System.out.println(\"ClickCount->\" + me.getClickCount());\n44.   }\n\
  45.   public void mouseClicked(MouseEvent me)\n46.   { \n47.      System.out.println(\"\
  Mouse Clicked...\");\n48.      System.out.println(\"Button->\"+me.getButton());\n\
  49.   } \n50. }\n51. class C implements MouseMotionListener\n52. {\n53.   public\
  \ void mouseMoved(MouseEvent me)\n54.   { \n55.      System.out.println(\"Mouse\
  \ Moved...\");\n56.   }\n57.   public void mouseDragged(MouseEvent me)\n58.   {\
  \ \n59.      System.out.println(\"Mouse Dragged...\");\n60.   }\n61. }\n62. class\
  \ D implements ActionListener\n63. {\n64.   public void actionPerformed(ActionEvent\
  \ e)\n65.   { \n66.      System.out.println(\"Button Actioned\");\n67.   }\n68.\
  \ }\n```\n\n### ActionEvent 类\n\n这是一个 `ActionEvent` 的子类。此事件表示组件中发生了动作。当一个组件 发生特定操作（如被按下）时，注册的\
  \ `ActionListener` 就会收到一个 `ActionEvent`。\n\n它是一个语义化的事件（例如“按钮按下”）。实现了 `ActionListener`\
  \ 接口的对象将接收此类事件。\n\n**注意：** 在键盘上触发 `ActionEvent` 时，不同的系统可能会有不同的修饰键。\n\n#### 方法\n\n\
  - `String getAction()`: 返回与此动作相关的命令字符串。\n- `int getModifiers()`: 返回事件期间按下的修饰符按键。\n\
  - `long getWhen()`: 返回事件发生的时间戳。\n\n#### 示例 18.8\n\n此示例说明了 `ActionEvent` 发生时如何识别修饰键。\n\
  \n```java\n1. import java.awt.*;\n2. import java.awt.event.*;\n3. public class KeyModifierDemo\
  \ extends Frame implements ActionListener\n4. { \n5.   Button b;\n6.   KeyModifierDemo\
  \ ()\n7.   { \n8.     b = new Button (\"Button\");\n9.     b.addActionListener(this);\n\
  10.      setLayout(new FlowLayout());\n11.      add(b);\n12.      setBounds(100,100,200,200);\n\
  13.      setVisible(true);\n14.   }\n15.   public static void main (String args[])\n\
  16.   { \n17.      new KeyModifierDemo();\n18.   }\n19.   public void actionPerformed\
  \ (ActionEvent ae)\n20.   { \n21.      System.out.println(\"Button Pressed\");\n\
  22.      int ms = ae.getModifiers();\n23.      if ((ms & InputEvent.CTRL_DOWN_MASK)\
  \ != 0)\n24.      {   \n25.        System.out.println(\"CTRL key was pressed\");\n\
  26.      }\n27.      if ((ms & InputEvent.SHIFT_DOWN_MASK) != 0)\n28.      { \n\
  29.        System.out.println(\"Shift Key was pressed\");\n30.      }\n31.     \
  \ if ((ms & InputEvent.ALT_DOWN_MASK) != 0)\n32.      { \n33.        System.out.println(\"\
  ALT key was pressed\");\n34.      }\n35.    }\n36.  }\n37. }\n```\n\n### 处理多个动作命令\n\
  \nAction 事件是最简单的。当我们发现一个滚动条发送了调整事件时，明显的问题是“现在滚动条的值是多少？”。当我们发现鼠标被点击时，自然会想“鼠标的 x 和\
  \ y 坐标是多少？”。但当我们发现一个按钮发送了 ActionEvent 事件时，似乎没有其他额外信息需要寻找了；按钮被点击了，这似乎就是全部。\n\n\n\n\
  \n然而，Action 事件关联有一个额外的信息。此此信息是一个字符串，被称为 Action 命令（Action command）。我们可以通过 `getActionCommand()`\
  \ 方法提取 Action 事件的 Action 命令。如果 Action 事件是由文本字段（text field）发送的，`getActionCommand()`\
  \ 将返回文本字段当前的内容（当用户按下回车键时，文本字段会发送 Action 事件）。如果 Action 事件是由按钮发送的，默认行为是 `getActionCommand()`\
  \ 返回按钮标签的字符串。然而，我们可以通过调用其 `setActionCommand(String)` 方法显式地设置按钮的 ActionCommand。\n\
  \n```java\nButton btn = new Button (“Hello”);\nbtn.setActionCommand (“Hello”);\n\
  ```\n\n按钮 Action 命令的用处在按钮的 Action 监听器（Action listener）需要决定如何响应 Action 事件时显而易见。单个监听器作为多个组件的监听器是常见的现象；在我们的上下文中，一个对象可以是几个或多个按钮的\
  \ Action 监听器。在这种情况下，对象的 `actionPerformed()` 方法必须通过判断哪个按钮被点击来执行。以下示例演示了这一点：\n\n###\
  \ 示例 18.9\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass ButtonRefTest\n\
  {\n    Button b1,b2,b3;\n    ButtonRefTest()\n    {  \n      Frame f=new Frame();\n\
  \      f.setLayout(new FlowLayout ( ));\n      f.setSize(300,300);\n      b1=new\
  \ Button(\"Push Me\");\n      b2=new Button(\"Click Me\");\n      b3=new Button(\"\
  Hit Me\");\n      f.add(b1);   f.add(b2);   f.add(b3);\n      B obj= new B(b1,b2,b3);\n\
  \      b1.addActionListener(obj);\n      b2.addActionListener(obj);\n      b3.addActionListener(obj);\n\
  \      f.setVisible(true);\n    }\n    public static void main(String args [ ])\n\
  \    { \n      new ButtonRefTest();\n    }\n}\nclass B implements ActionListener\n\
  { \n    Button b4,b5,b6;\n    B(Button b1, Button b2, Button b3)\n    {\n      b4\
  \ = b1;\n      b5 = b2;\n      b6 = b3;\n    }\n    public void actionPerformed(ActionEvent\
  \ ae)\n    {  \n      Button b=(Button)ae.getSource();\n      if(b==b4)\n      System.out.println(\"\
  First Button was pressed\");\n      else if(b==b5)\n      System.out.println(\"\
  Second Button was pressed\");\n      else if(b==b6)\n      System.out.println(\"\
  Third  was pressed\");\n    }\n}\n```\n\n### 示例 18.10\n\n```java\nimport java.awt.*;\n\
  import java.awt.event.*;\nclass GetLabelTest\n{\n    Button b1,b2,b3;\n    GetLabelTest()\n\
