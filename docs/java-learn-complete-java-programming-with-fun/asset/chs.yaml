  \        double d = 3.44444;\n        str = Double.toString(d);\n        System.out.println(str);\n\
  \    }\n}\n```\n\n**输出：**\n```\n使用相应包装类的 toString() 静态方法将原始数字转换为字符串：\n105\n303\n\
  100\n454444444444\n3.444\n3.44444\n```\n\n\n\n\n\n## 使用对应包装类的 `toString()` 方法将数值对象转换为字符串：\n\
