  \ if(b==b3) {\n            String s[]=l2.getSelectedItems();\n            for(int\
  \ i=0;i<s.length;i++) {\n                l1.add(s[i]);\n                l2.remove(s[i]);\n\
  \            }\n        } else if(b==b4) {\n            String s[]=l2.getItems();\n\
  \            for(int i=0;i<s.length;i++) {\n                l1.add(s[i]);\n    \
  \            l2.remove(s[i]);\n            }\n        } else if(b==b5) {\n     \
  \       l1.add(tf1.getText());\n        } else if(b==b6) {\n            l2.add(tf2.getText());\n\
  \        }\n    }\n}\n```\n\n### TextField 和 TextArea\n\n`TextField` 和 `TextArea`\
  \ 类实现了用于文本输入、显示和编辑的一维和二维组件。这两个类都继承自 `TextComponent` 超类。\n`Object` -> `Component`\
  \ -> `TextComponent` -> (`TextField, TextArea`)\n\n`TextField` 和 `TextArea` 都有多种构造函数，提供了指定或不指定初始字符串或首选大小的选择。不指定首选大小的构造函数最适用于布局管理器将忽略该组件的情况。\n\
  \n#### `TextField` 的构造函数\n- `TextField()`：创建一个文本框。\n- `TextField(int columns)`：创建一个具有指定列宽的文本框。\n\
  - `TextField(String text)`：创建一个包含指定文本的文本框。\n- `TextField(String text, int columns)`：创建一个包含指定文本且具有指定列数的文本框。\n\
  \n#### `TextArea` 的构造函数\n- `TextArea()`：创建一个文本区域。\n- `TextArea(int rows, int columns)`：创建一个具有指定行数和列数的文本区域。\n\
  - `TextArea(String text)`：创建一个包含指定文本的文本区域。\n- `TextArea(String text, int rows, int\
  \ columns)`：创建一个包含指定文本并指定行列数的文本区域。\n- `TextArea(String text, int rows, int columns,\
  \ int scrollbarPolicy)`：创建一个包含指定文本、指定行数、列数以及滚动条策略的文本区域。\n\n`TextArea` 类定义了几个常量可以作为\
  \ `scrollbarPolicy` 参数的值：\n- `SCROLLBARS_BOTH`\n- `SCROLLBARS_VERTICAL_ONLY`\n-\
  \ `SCROLLBARS_HORIZONTAL_ONLY`\n- `SCROLLBARS_NONE`\n\n对于这两个类，`columns` 参数存在一些意想不到的问题。首先，列宽是相对于字体宽度的衡量的。对于等宽字体，列宽显然是每个字符宽度的倍数。对于比例字体，列宽被取为所有字符宽度的平均值。这种平均值并没有考虑到字符使用的频率。因此在大多数情况下，包含大量小写字母的组件显示的字符比请求的要。\n\
  \n接下来是比例字体的问题。对于等宽字体，列宽应该是显而易见的。对于比例字体，列宽取为所有字符宽度的平均值。\n\n#### `TextComponent` 类的方法\n\
  - `getSelectedText()`：获取文本组件中选中的文本。\n- `getText()`：获取文本组件中的文本。\n- `setEditable(boolean\
  \ b)`：设置标志，决定此文本组件是否可编辑。\n- `setText(String t)`：将文本组件中的文本设置为指定的文本。\n\n### 示例 17.19\n\
