  \n\n\n\n# Java 编程概述\n\n## 1. Java 编译器\n首先，Java 程序被编译成字节码。字节码类似于机器码，但它不针对特定的处理器或平台。字节码不能被直接执行。\n\
  \n## 2. Java 解释器 (JVM)\nJava 解释器通过 `JIT` 将字节码翻译成特定平台的机器码。\n\n- **注意 1**：`C` 或 `C++`\
  \ 程序只编译一次，而 Java 字节码每次执行 Java 程序时都会被翻译。因此，与 `C/C++` 程序相比，Java 程序的运行速度稍慢。\n- **注意\
  \ 2**：运行 Java 程序，我们需要文本编辑器（记事本或 Edit）、`JDK`（Java 开发工具包）以及 `JVM`（许多操作系统中已安装）。我们也可以使用\
