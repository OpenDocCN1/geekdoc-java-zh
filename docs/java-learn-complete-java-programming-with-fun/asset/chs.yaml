  \ | `public int indexOf(String str)` | 返回子字符串在字符串中首次出现的索引。 |\n\n\n\n\n\n## String\
  \ 方法\n\n| Method | Description |\n| :--- | :--- |\n| `public int indexOf(String\
  \ str, int fromIndex)` | 返回从指定索引开始，在该字符串中指定子字符串首次出现的索引。 |\n| `public int lastIndexOf(int\
  \ ch)` | 返回在该字符串中指定字符最后一次出现的索引。 |\n| `public int lastIndexOf(int ch, int fromIndex)`\
  \ | 从指定索引开始反向查找，返回在该字符串中指定字符最后一次出现的索引。 |\n| `public int lastIndexOf(String str)`\
