  After reset:\nAAA\n```\n\n# Pushback Input Stream\n\n`PushbackInputStream` 为另一个输入流增加了功能，即“推回”或“重读”一个字节的能力。缓冲区的用途之一就是实现推回功能。\n\
  \n推回用于输入流，允许一个字节在被读取后返回到流中。除了 `InputStream` 类常见的方法外，`PushbackInputStream` 还提供了 `unread()`\
  \ 方法，如下所示：\n\n| `public java.io.PushbackInputStream(java.io.InputStream, int);`\
  \ | 创建一个具有指定大小推回缓冲区的 `PushbackInputStream`，并保存其参数（传入的输入流）以备后用。这允许将多个字节返回到输入流。 |\n\
  | `public java.io.PushbackInputStream(java.io.InputStream);` | 创建一个 `PushbackInputStream`\
  \ 并保存其参数（传入的输入流）以备后用。这允许将一个字节返回到输入流。 |\n| `public int read() throws java.io.IOException;`\
  \ | |\n| `public int read(byte[], int, int) throws java.io.IOException;` | |\n|\
  \ `public void unread(int) throws java.io.IOException;` | 通过将字节复制到推回缓冲区的头部来推回字节\
  \ |\n| `public void unread(byte[], int, int) throws java.io.IOException;` | 通过将字节数组的一部分复制到推回缓冲区的头部来推回字节数组的一部分。\
  \ |\n| `public void unread(byte[]) throws java.io.IOException;` | 通过将字节数组复制到推回缓冲区的头部来推回整个字节数组。\
  \ |\n| `public int available() throws java.io.IOException;` | |\n| `public long\
  \ skip(long) throws java.io.IOException;` | |\n| `public boolean markSupported();`\
  \ | `PushbackInputStream` 的副作用是使创建它的 `InputStream` 的 `mark()` 或 `reset()` 方法失效。使用\
  \ `markSupported()` 方法检查你正要在上面使用 `mark()`/`reset()` 的流。 |\n| `public synchronized\
  \ void mark(int);` | |\n| `public synchronized void reset() throws java.io.IOException;`\
  \ | |\n| `public synchronized void close() throws java.io.IOException;` | |\n\n\
