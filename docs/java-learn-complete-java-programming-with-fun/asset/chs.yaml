  3.44324232432\n3.33\n30.333\n```\n\n**注意:** 如果字符串不包含可解析的数字，所有的 `valueOf()` 方法都会抛出\
  \ `NumberFormatException`。\n\n## 使用对应包装类的构造函数将字符串对象（数值字符串）转换为数值对象\n\n### 示例 14.6\n\
  \n```java\nclass StringToNumericObjectDemo1\n{\n    public static void main(String\
  \ args[])\n    {\n        String str=new String(\"30\");\n        //String str=\"\
  30\";\n        String str2=new String(\"30.333\");\n        Byte bObj = new Byte(str);\n\
  \        System.out.println(bObj);\n        //Byte bObj=new Byte(str2);   //NumberFormatException\n\
  \        Short sObj=new Short(str);\n        System.out.println(sObj);\n       \
  \ Integer iObj=new Integer(str);\n        System.out.println(iObj);\n        Long\
  \ lObj=new Long(str);\n        System.out.println(lObj);\n        Float fObj=new\
  \ Float(str);\n        System.out.println(fObj);\n        Double dObj=new Double(str);\n\
  \        System.out.println(dObj);\n    }\n}\n```\n\n**输出:**\n```\n30\n30\n30\n\
  30\n30.333\n30.333\n```\n\n**注意:** 如果字符串不包含可解析的数字，上述构造函数将抛出 `NumberFormatException`。\n\
  \n## 使用对应包装类的解析方法将字符串对象（数值字符串）转换为原始类型数字\n\n### 示例 14.7:\n\n```java\nclass StringToPrimitiveDemo\n\
  {\n    public static void main(String args[])\n    {\n        String str = new String(\"\
  30\");\n        //String str=\"30\";\n        String str2= new String(\"30.333\"\
  );\n        byte b = Byte.parseByte(str);\n        System.out.println(b);\n    \
  \    //byte b1=Byte.parseByte(str2);  //NumberFormatException\n        short s =\
  \ Short.parseShort(str);\n        System.out.println(s);\n        int i = Integer.parseInt(str);\n\
  \        System.out.println(i);\n        long l = Long.parseLong(str);\n       \
  \ System.out.println(l);\n        float f = Float.parseFloat(str2);\n        System.out.println(f);\n\
  \        double d = Double.parseDouble(str2);\n        System.out.println(d);\n\
  \    }\n}\n```\n\n**输出:**\n```\n30\n30\n30\n30\n30.333\n30.333\n```\n\n**注意:** 对应包装类的常量：\n\
  - `MAX_VALUE`\n- `MIN_VALUE`\n- `TYPE`\n- `NEGATIVE_INFINITY`\n- `POSITIVE_INFINITY`\n\
  - `NaN`\n\n对应 `Double` 类的解析方法：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `static byte parseByte(String\
  \ s)` | 将字符串解析为 `byte`。 |\n| `static short parseShort(String s)` | 将字符串解析为 `short`。\
  \ |\n| `static int parseInt(String s)` | 将字符串解析为 `int`。 |\n| `static long parseLong(String\
  \ s)` | 将字符串解析为 `long`。 |\n| `static float parseFloat(String s)` | 将字符串解析为 `float`。\
  \ |\n| `static double parseDouble(String s)` | 将字符串解析为 `double`。 |\n\n如果字符串不包含可解析的数字，这些方法将抛出\
  \ `NumberFormatException`。\n\n\n\n\n\n## Character 方法\n\n| `static boolean isJavaIdentifierStart(char\
  \ ch)` 确定指定的字符是否可以作为 Java 标识符的起始字符。 |\n| `static boolean isLetter(char ch)` 确定指定的字符是否为字母。\
  \ |\n| `static boolean isLetterorDigit(char ch)` 确定指定的字符是否为字母或数字。 |\n| `static boolean\
  \ isLowerCase(char ch)` 确定指定的字符是否为小写字母。 |\n| `static boolean isSpaceChar(char ch)`\
  \ 确定指定的字符是否为 Unicode 空格字符。 |\n| `static boolean isTitleCase(char ch)` 确定指定的字符是否为标题大小写字母。\
  \ |\n| `static boolean isUpperCase(char ch)` 确定指定的字符是否为大写字母。 |\n| `static boolean\
  \ isWhitespace(char ch)` 根据 Java 确定指定的字符是否为空白字符。 |\n| `static char toLowerCase(char\
  \ ch)` 将字符参数转换为小写。 |\n| `static char toUpperCase(char ch)` 将字符参数转换为大写。 |\n| `static\
  \ char toTitleCase(char ch)` 将字符参数转换为标题大小写。 |\n| `int compareTo(Character anotherCharacter)`\
  \ 以数值比较两个 Character 对象。 |\n| `int hashcode()` 返回此 Character 对象的哈希码。 |\n| `boolean\
  \ equals(Object obj)` 将此对象与指定的对象进行比较。 |\n\n## Boolean 类\n\n`Boolean` 类将原始数据类型 `Boolean`\
  \ 的值封装在对象中。\n\n### 构造方法\n\n| `Boolean(Boolean value)` 分配一个表示值参数的 `Boolean` 对象。 |\n\
  | `Boolean(String s)` 如果字符串参数不为空且在忽略大小写的情况下等于字符串“true”，则分配一个表示值为 true 的 `Boolean`\
  \ 对象。 |\n\n### Boolean 类的方法\n\n| `boolean booleanValue()` 将此 `Boolean` 对象的值作为 `Boolean`\
  \ 原始类型返回。 |\n| `int compareTo(Boolean b)` 将此 `Boolean` 实例与另一个实例进行比较。 |\n| `boolean\
  \ equals(Object obj)` 仅当参数不空且是一个表示与此对象具有相同布尔值的 `Boolean` 对象时，返回 true。 |\n| `static\
  \ Boolean getBoolean(String name)` 仅当由参数命名的系统属性存在且等于字符串“true”时，返回 true。 |\n| `int\
  \ hashCode()` 返回此 `Boolean` 对象的哈希码。 |\n| `static boolean parseBoolean(String s)`\
  \ 将字符串参数解析为布尔值。 |\n| `String toString()` 返回表示此 `Boolean` 值的 `String` 对象。 |\n| `static\
  \ String toString(boolean b)` 返回表示指定布尔值的 `String` 对象。 |\n| `static Boolean valueOf(boolean\
  \ b)` 返回一个表示指定布尔值的 `Boolean` 实例。 |\n| `static Boolean valueOf(String s)` 返回一个值由指定\
  \ `String` 表示的 `Boolean`。 |\n\n![STAR-LOGO-2013](img/image024.png)\n\n# Java 中的输入/输出\n\
  \n### 简介\n\nJava 程序通过流（streams）执行 I/O 操作。流是产生或消耗信息的抽象。Java I/O 系统将流与物理设备连接。\n\n\
  所有流的行为方式都是相同的，即使它们所连接的实际物理设备有所不同。因此，相同的 I/O 类和方法可以应用于任何类型的设备。\n\n这意味着输入流可以抽象许多不同的输入类型：从磁盘文件、键盘或网络套接字。同样，输出流可以指向控制台、磁盘文件或网络连接。\n\
  \n流是一种处理输入/输出的简洁方法，而让我们代码的每个部分都理解键盘和网络之间的区别（例如）。Java 在 `java.io` 包中定义的类层次结构中实现了流。\n\
  \n![PhotoFunia-5b0b11f_o](img/image083.jpg)\n\n### Java 程序与 I/O 设备的关系\n\n将数据从一个流发送到另一个流的概念（类似于一根管道连接到另一根管道）使得\
  \ Java 流成为文件处理的强大工具。我们可以使用一系列简单的流操作构建复杂的流处理序列。\n\n此功能可用于在流的流水线中过滤数据，以便获得所需格式的数据。例如，我们可以使用一个流获取二进制格式的原始数据，然后使用另一个串联的流将其转换为整数。\n\
  \n## 输入流和输出流\n\nJava 流分为两种基本类型：通常的输入流和输出流。输入流从源提取（即读取）数据并将其发送到程序。\n\n![image](img/image017.png)\n\
  \n程序在数据源上连接并打开输入流，然后顺序读取数据。同样，程序在数据目标位置连接并打开输出流，并顺序写入数据。在两种情况下，程序都不知道端点的细节（即源和终点）。\n\
  \n## 字节流和字符流\n\nJava2 定义了两种流：字节流（Byte）和字符流（Character）。字节流为处理字节的输入输出提供了方便的方法。例如，在读取或写入二进制数据时会使用字节流。字符流为处理字符的输入输出提供了方便的方法。它们使用\
  \ `Unicode`，因此可以国际化。此外，在某些情况下，字符流比字节流更高效。Java 的原始版本（Java 1.0）不包含字符流，当时所有的 I/O 都是面向字节的。\n\
  \nJava 1.1 增加了字符流，并且某些面向字节的类和方法被废弃了。\n\n**注意：** 在底层，所有 I/O 仍然是面向字节的。字符流仅提供了处理字符的方便方法。\n\
  \n这两组类可以根据其目的进一步分类。字节流和字符流类包含了独立处理各种设备输入输出操作的特殊类。我们也可以根据读取或写入的源或目标类型对流分组。源或目标可以是内存、文件或管道。\n\
  \n![image53](img/image53.jpg)\n![sss](img/image67.jpg)\n\n## Java 类的分类\n\n### 字节流类概述\n\
  \n字节流类通过两个类层次结构定义。顶端有两个抽象类：\n\n1. `InputStream`\n2. `OutputStream`\n\n每个抽象类都有多个具体的子类，处理不同设备之间的差异，例如磁盘文件、网络连接内存缓冲区。\n\
  \n### InputStream 类\n\n用于读取 8 位字节的 InputStream 类包括一个名为 `InputStream` 的超类，以及许多支持各种输入功能的子类。\n\
  \n![image00](img/image00.jpg)\n![image35](img/image35.png)\n![image81](img/image81.png)\n\
  \n### InputStream 类\n\n`InputStream` 超类是一个抽象类，定义了执行输入功能的方法，例如：\n\n*   读取字节。\n* \
  \  关闭流。\n*   标记流的位置。\n*   跳过流。\n*   查找流中的字节数。\n\n#### InputStream 类的方法\n\n| `int\
  \ available()` 提供输入中可字节数（必须由子类重写）。`InputStream` 类的 `available` 方法始终返回 0。 |\n| `void\
  \ close()` 关闭此输入流并释放与流相关的系统资源。`InputStream` 类的 `close` 方法什么都不做。 |\n| `void mark(int\
  \ readlimit)` 标记此输入流当前的位置。`InputStream` 类的 `mark` 方法什么都不做。 |\n| `boolean markSupported()`\
  \ 测试此输入流是否支持 mark 和 reset 方法。`InputStream` 类的 `markSupported` 方法返回 false。 |\n\n\n\
  \n\n\n## InputStream 方法\n\n| abstract int read() | 从输入流中读取下一个字节数据。子类必须提供此方法的实现。\
  \ |\n| `int read(byte[] b)` | 从输入流中读取若干字节，并将它们存储到缓冲区数组 `b` 中。实际读取的字节数将作为整数返回。 |\n\
  | `int read(byte[] b, int offset, int len)` | 从输入流中读取若干字节，并从参数 `off` 指定的位置开始将它们存储到缓冲区数组\
  \ `b` 中。实际读取的字节数将作为整数返回。 |\n| `void reset()` | 将此流重新定位到上一次在该输入流上调用 `mark` 方法时的位置。`InputStream`\
  \ 的 `reset` 方法不执行任何操作，并始终抛出 `IOException`。 |\n| `long skip(long n)` | 从此输入流中跳过并丢弃多达\
  \ `n` 个字节的数据，并返回实际跳过的字节数。 |\n\n## DataInput 接口\n\n`DataInput` 是一个接口，定义了从 `InputStream`\
  \ 读取原始数据类型的方法。\n\n### DataInput 接口的方法\n\n| `boolean readBoolean()` | 读取一个输入字节，如果该字节非零则返回\
  \ true，如果为零则返回 false。 |\n| `byte readByte()` | 读取并返回一个输入字节。 |\n| `char readChar()`\
  \ | 读取一个输入字符并返回其值。 |\n| `double readDouble()` | 读取八个输入字节并返回一个 double 值。 |\n| `float\
  \ readfloat()` | 读取四个输入字节并返回一个 float 值。 |\n| `void readFully(byte[] b)` | 从输入流中读取若干字节并将它们存储在缓冲区数组\
  \ `b` 中。如果流在读取所有字节之前到达结尾，此方法将抛出 `EOFException`。 |\n| `void readFully(byte[] b, int\
  \ off, int len)` | 从输入流中读取 `len` 个字节，并从 `off` 指定的位置开始将它们存储在缓冲区数组 `b` 中。如果流在读取所有字节之前到达结尾，此方法将抛出\
  \ `EOFException`。 |\n| `int readInt()` | 读取四个输入字节并返回一个 `int` 值。 |\n| `String readLine()`\
  \ | 从输入流中读取下一行。 |\n| `long readLong()` | 读取八个输入字节并返回一个 `long` 值。 |\n| `short readShort()`\
  \ | 读取两个输入字节并返回一个 `short` 值 |\n| `Strig readUTF( ` | 读取一个使用修改后的 UTF-8 格式的字符串。 |\n\
  | `int skipBytes(int n)` | 尝试从输入流中跳过 `n` 个字节的数据，并丢弃跳过的字节。返回实际跳过的字节数。 |\n\n## InputStream\
  \ 类总结\n\n`FilterInputStream` 包含另一个输入流，它将其作为基本数据源，可能在此过程中转换数据并提供额外功能。\n\n`FilterInputStream`\
  \ 类本身简单地重写了 `InputStream` 的所有方法，这些方法版本会将所有请求传递给包含的输入流。`FilterInputStream` 的子类可能会进一步重写其中的一些方法，并可能提供额外的方法和字段。\n\
  \n注意，`DataInputStream` 类继承自 `FilterInputStream` 并实现了 `DataInput` 接口。因此，`DataInputStream`\
  \ 在使用 `InputStream` 类方法外，还继承了 `FilterInputStream` 并实现了 `DataInput` 中描述的方法。\n\n###\
  \ InputStream 类总结：\n\n| `InputStream` | 此抽象类是所有表示字节输入流类的父类。 |\n| `BufferedInputStream`\
  \ | `BufferedInputStream` 为另一个输入流增加了功能——即缓冲输入并支持 `mark` 和 `reset` 方法。 |\n| `ByteArrayInputStream`\
  \ | `ByteArrayInputStream` 包含一个内部缓冲区，其中包含可以从流中读取的字节。 |\n| `DataInputStream` | `DataInputStream`\
  \ 让应用程序以与无关的方式从底层输入流读取 Java 原始数据类型。 |\n| `FileInputStream` | `FileInputStream` 包含来自文件系统的输入字节。\
  \ |\n| `FilterInputStream` | `FilterInputStream` 包含另一个输入流，它将其作为基本数据源，可能在此过程中传输数据或提供额外功能。\
  \ |\n| `PipedInputStream` | `PipedInputStream` 应该连接到管道输出流，然后管道输入流将提供写入管道输出流的任何数据字节。\
  \ |\n| `PushbackInputStream` | `PushbackInputStream` 为另一个输入流增加了功能，即“推回”或“重读”一个字节的能力。\
  \ |\n| `SequenceInputStream` | `SequenceInputStream` 代表另一个流的逻辑连接。 |\n| `ObjectInputStream`\
  \ | `ObjectInputStream` 反序列化之前使用 `ObjectOutputStream` 写入的原始数据和对象。 |\n\n### OutputStream\
  \ 类\n\n输出流类派生自基类 `OutputStream`，它是一个抽象类，并有许多子类来支持各种输出相关的功能。\n\n### OutputStream\
  \ 类\n\n父类 `OutputStream` 是一个抽象类，定义了执行输出功能的方法，例如：\n\n* 写入字节\n* 关闭流\n* 刷新流\n\n![z](img/image057.png)\n\
  （输出流类的层次结构）\n\n哎呀！！让我们看看下面这张高质量图片-\n\n![IO_InputOutputStreams](img/image019.png)\n\
  \n### OutputStream 类的方法\n\n| `void close()` | 关闭此输出流并释放与此流相关的任何流资源。 |\n| `void flush()`\
  \ | 刷新此输出流，强制将缓冲的输出字节写入。 |\n| `void write(byte[] b)` | 向输出流写入字节数组 `b`。 |\n| `void\
  \ write(byte[] b, int off, int len)` | 从 `off` 指定的位置开始向输出流写入 `len` 个字节。 |\n| `abstract\
  \ void write(int b)` | 向输出流写入指定的字节。 |\n\n## DataOutput 接口\n\n`DataOutput` 是一个接口，定义了向\
  \ `OutputStream` 写入原始数据类型的方法。\n\n![IO_LayeredInput](img/image89.png)\n\n### DataOutput\
  \ 接口的方法\n\n| `void writeBoolean(boolean v)` | 向输出流写入布尔值。 |\n| `void writeByte(int\
  \ v)` | 输出输出写入参数 `v` 的低位字节。 |\n| `void writeBytes(string s)` | 将字符串写入输出流。对于字符串 `s`\
  \ 中的每个字符，按顺序写入一个字节。 |\n| `void writeChar(int v)` | 向输出流写入字符值，该值由两个字节组成。 |\n| `void\
  \ writeChars(string s)` | 按顺序将字符串 `s` 中的每个字符写入输出流。 |\n| `void writeDouble(double\
  \ v)` | 向输出流写入 double 值，该值由八个字节组成。 |\n| `void writeFloat(float v)` | 向输出流写入 float\
  \ 值，该值由四个字节组成。 |\n| `void writeInt(int v)` | 向输出流写入 int 值，该值由四个字节组成。 |\n| `void\
  \ writeLong(long v)` | 向输出流写入 long 值，该值由八个字节组成。 |\n| `void writeShort(int v)` |\
  \ 向输出流写入 short 值，该值由两个字节组成。 |\n| `void writeUTF(String str)` | 向输出流写入两个字节的长度信息，随后是字符串\
  \ `str` 中每个字符的修改 UTF-8 表示。 |\n\n OutputStream 类总结\n\n`DataOutputStream` 是 `DataInputStream`\
  \ 的对应部分。`DataOutputStream` 类在运行 `OutputStream` 类方法外，还实现了 `DataOutput` 接口中描述的方法。\n\
  \n### OutputStream 类总结：\n\n| `OutputStream` | 此抽象类是所有表示字节输出流类的父类。 |\n| `BufferedOutputStream`\
  \ | 该类实现了缓冲输出流。 |\n\n\n\n\n\n| `ByteArrayOutputStream` | 该类实现了一个输出流，其中数据被写入字节数组中。\
  \ |\n| `DataOutputStream` | 数据输出流允许应用程序以可移植的方式将 Java 原始数据类型写入到输出流中。 |\n| `FileOutputStream`\
  \ | 文件输出流是用于向 `File` 写入数据的输出流。 |\n| `PipedOutputStream` | 管道输出流可以连接到管道输入流，以创建一个通信管道。\
  \ |\n| `FilterOutputStream` | `FilterOutputStream` 包含其他一些输出流，它将这些流作为自己的目标，可能在传输过程中转换数据或提供额外的功能。\
  \ |\n| `PrintStream` | `PrintStream` 为另一个输出流添加功能，即能够方便地打印各种数据值的表示形式。 |\n\n# 字符流类概览\n\
  \n字符流通过使用两个类层次结构定义。顶端是两个抽象类：`Reader` 和 `Writer`。这些抽象类处理 Unicode 字符流。\n\nJava 对这些每一个抽象类有几个具体的子类。抽象的\
  \ `Reader` 和 `Writer` 类定义了其他流类实现的几个关键方法。其中最重要的两个方法是 `read()` 和 `write()`，它们分别读取和写入数据字符。这些方法被派生的流类重写。\n\
  \n## Reader 流类\n\nReader 流类设计用于从文件中读取字符。`Reader` 类是此组中所有其他类的基类。这些类在功能上与输入流类非常相似，但输入流使用字节作为信息的根本单位，而\
  \ reader 流使用字符。\n\n`Reader` 类包含的方法与 `InputStream` 类中提供的方法相同。因此，`Reader` 类可以执行输入流类实现几乎的所有功能。\n\
  \n![image](img/image059.png)\n\n(Reader 流类的层级结构)\n\n### Reader 类\n\n`Reader` 是一个抽象类，定义了\
  \ Java 的字符输入流式模型。该类中的所有方法都会抛出 `IOException`。\n\n### Reader 类的方法\n\n| 方法 | 说明 |\n\
  | :--- | :--- |\n| `abstract void close()` | 关闭流。一旦流被关闭，进一步的 `read()`、`ready()`、`mark()`\
  \ 或 `reset()` 调用将抛出 `IOException`。然而，关闭一个之前已经关闭的流没有影响。 |\n| `void mark()` | 标记流中的当前位置。随后的\
  \ `reset()` 调用将尝试将流重新定位到此处。并不是所有的字符输入流都支持 `mark()` 操作。 |\n| `boolean markSupported()`\
  \ | 告知此流是否支持 `mark()` 操作 |\n| `int read()` | 读取单个字符并返回来自调用输入流的下一个可用字符的整数表示。当遇到文件末尾时返回\
  \ -1。 |\n| `int read(char[] buffer)` | 尝试将多达 buffer 长度的字符读取到 `buffer` 中，并返回成功读取的字符数。当遇到文件末尾时返回\
  \ -1。reader 子类必须实现此方法。 |\n| `abstract int read(char[] buffer, int offset, int numChar)`\
  \ | 尝试从 `buffer[offset]` 开始读取多达 `numChar` 个字符，并返回成功读取的字符数。当遇到文件末尾时返回 -1。reader 子类必须实现此方法。\
  \ |\n| `boolean ready()` | 告知此流是否准备好读取。如果下一次输入请求不会等待，则返回 true，否则返回 false。 |\n| `void\
  \ reset()` | 重置流。并不是所有的字符输入流都支持此方法。 |\n| `long skip(long n)` | 跳过多达 `n` 个字符并返回跳过的字符数。如果\
  \ `n` 为负数，则抛出 `IllegalArgumentException`。 |\n\n### Reader 类总结\n\n| 类 | 说明 |\n| :---\
  \ | :--- |\n| `Reader` | 用于读取字符流的抽象类 |\n| `BufferedReader` | 从字符输入流读取文本，对字符进行缓冲，以便高效读取字符、数组和行。\
  \ |\n| `CharArrayReader` | 此类实现了一个字符缓冲区，可以作为字符输入流使用。 |\n| `FileReader` | 用于读取字符文件的便利类。\
  \ |\n| `FilterReader` | 用于读取过滤字符流的抽象类。 |\n| `InputStreamReader` | `InputStreamReader`\
  \ 是从字节流到字符流的桥梁：它读取字节并使用指定的字符集将其解码为字符。 |\n| `PipedReader` | 管道字符输入流。 |\n| `PushbackReader`\
  \ | 允许将字符推回流中的字符流读取器。 |\n| `StringReader` | 源自字符串的字符流。 |\n\n## Writer 流类\n\nWriter\
  \ 流类设计用于向文件/输出设备写入字符。writer 类是一个抽象类，作为所有其他 writer 流类的基类。\n\n基类通过定义与 `OutputStream`\
  \ 类中相同的方法，为所有输出操作提供支持。\n\n`Writer` 类包含的方法与 `OutputStream` 类中提供的方法相同。因此，`Writer`\
  \ 类可以执行输出流类实现几乎的所有功能。\n\n![image](img/image068.png)\n\n(Writer 流类的层级结构)\n\n![C:\\\
  Users\\Made Man Harry\\Desktop\\Stars\\black_star_logo.jpg](img/image054.jpg)\n\n\
  ### Writer 类\n\n`Writer` 是一个抽象类，定义了字符输出流式。该类中的所有方法都返回 void 值，并在发生错误时抛出 `IOException`。\n\
  \n### Writer 类的方法\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `abstract void close()` | 关闭流并先对其进行刷新。\
  \ |\n| `abstract void flush()` | 刷新流。 |\n| `void write(char[] cbuf)` | 写入字符数组。 |\n\
  | `abstract void write(char[] cbuf, int off, int len)` | 从指定的偏移量开始写入字符数组的一部分。子类必须实现此方法。\
  \ |\n| `void write(int c)` | 向调用的输出流写入单个字符。注意参数是 `int`，这允许你直接对表达式调用 write 而无需将其强制转换回\
  \ char。 |\n| `void write(String str)` | 写入字符串。 |\n| `void write(String str, int\
  \ off, int len)` | 写入从指定偏移量开始的字符串部分。 |\n\n![C:\\Users\\Made Man Harry\\Desktop\\\
  Stars\\Star_logo_yellow.jpg](img/image16.jpg)\n\n### Writer 类总结\n\n| 类 | 说明 |\n\
  | :--- | :--- |\n| `Writer` | 用于写入字符流的抽象类。 |\n| `BufferedWriter` | 向字符输出流写入文本，对字符进行缓冲，以便高效写入单个字符、数组和字符串。\
  \ |\n| `CharArrayWriter` | 实现了一个字符缓冲区，可以作为 Writer 使用。 |\n| `FileWriter` | 用于写入字符文件的便利类。\
  \ |\n| `FilterWriter` | 用于写入过滤字符流的抽象类。 |\n| `OutputStreamWriter` | `OutputStreamWriter`\
  \ 是从字符流到字节流的桥梁：写入它的字符使用指定的字符集编码为字节。 |\n| `PipedWriter` | 管道字符输出流。 |\n| `PrintWriter`\
  \ | 向文本输出流打印对象的格式化表示。 |\n| `StringWriter` | 将输出收集在字符串缓冲区中的字符流，然后可以使用它可以构造字符串。 |\n\
  \n## File 类\n\n尽管 `java.io` 中定义的许多类都是基于流操作，但 `File` 类并不是。它直接处理文件和文件系统。也就是说，file\
  \ 类没有指定如何从文件中检索或存储信息。它描述的是文件本身的属性。\n\n文件对象用于获取或处理与磁盘关联的信息，例如权限、时间、日期和目录路径，以及遍历子目录层级。\n\
  \n\n\n\n尽管出于安全考虑，文件在 applet 中的用法受到严格限制，但它们仍然存储持久性和共享信息的核心资源。\n\nJava 中的目录被简单地视为一个文件，只是多了一个属性——一个可以通过\
  \ `list()` 方法检查的文件名列表。\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `public File(String);`\
  \ | |\n| `public File(String, String);` | |\n| `public File(File, String);` | |\n\
  | `public File(URI);` | 该构造函数由 Java2（版本 1.4）添加 |\n| `public String getName();` |\
  \ 返回文件或目录的名字 |\n| `public String getParent();` | 返回从对象创建时指定的路径的文件的父目录；如果此路径不是父目录，则返回\
  \ null。 |\n| `public String getPath();` | 返回相对路径。 |\n| `public boolean isAbsolute();`\
  \ | 测试此抽象路径是否为绝对路径。 |\n| `public String getAbsolutePath();` | 返回从根目录开始的绝对（完整）路径。\
  \ |\n| `public boolean canRead();` | 测试应用程序可以读取由此抽象路径表示的文件。 |\n| `public boolean\
  \ canWrite();` | 测试应用程序可以修改由此抽象路径表示的文件。 |\n| `public boolean exists();` | 测试由此抽象路径表示的文件或目录是否存在。\
  \ |\n| `public boolean isDirectory();` | 测试由此抽象路径表示的是否为目录。 |\n| `public boolean\
  \ isFile();` | 测试由此抽象路径表示的是否为普通文件。 |\n| `public boolean isHidden();` | 测试此抽象路径命名的文件是否为隐藏文件。\
  \ |\n| `public long lastModified();` | 返回由此抽象路径表示的文件最后修改的时间。 |\n| `public long length();`\
  \ | 返回由此抽象路径表示的文件长度。 |\n| `public boolean createNewFile() throws java.io.IOException;`\
  \ | 仅当不存在名称的文件时，自动创建一个由此抽象路径命名的新空文件。 |\n| `public boolean delete();` | 删除由此抽象路径表示的文件或目录。\
  \ |\n| `public String[ ] list();` | 返回由此抽象路径表示的目录中文件和目录的字符串数组。如果 File 对象对应于文件，则返回\
  \ null。 |\n| `public boolean mkdir();` | 创建由此抽象路径命名的目录。 |\n| `public boolean mkdirs();`\
  \ | 创建由此抽象路径命名的目录，包括任何必要的不存在的父目录。 |\n| `public boolean setLastModified(long);` |\
  \ 设置由此抽象路径命名的文件或目录的最后修改时间。 |\n| `public boolean setReadOnly();` | 标记由此抽象路径命名的文件或目录，使其只允许读操作。\
  \ |\n| `public boolean setWritable(boolean);` | |\n| `public boolean setReadable(boolean);`\
  \ | |\n| `public boolean canExecute();` | |\n| `public long getTotalSpace();` |\
  \ |\n| `public long getFreeSpace();` | |\n| `public long getUsableSpace();` | |\n\
  | `boolean renameTo(File);` | 重命名由此抽象路径表示的文件。 |\n\n### 示例\n\n```java\nFile f1 =\
  \ new File(\"/\");\nFile f2 = new File(\"/\", \"autoexec.bat\");\nFile f3 = new\
  \ File(f1, \"autoexec.bat\");\n```\n\n### 注意\n\nJava 在处理 UNIX 和 Windows 之间的路径分隔符时表现良好。如果你在\
  \ Windows 版本的 Java 上使用正斜杠（`/`），路径仍然可以正确解析。\n\n记住，如果你在字符串中使用 Windows 规范（`\\\\`）。Java\
  \ 的惯例是使用 UNIX 和 URL 风格的正斜杠作为路径分隔符。\n\n`File` 定义了许多获取 `File` 对象标准属性的方法。然而，`File`\
  \ 类并不是对称的。这意味着，虽然有主要方法允许你检查简单文件对象的属性，但没有相应的函数来更改这些属性。\n\n### 示例 15.1\n\n接下来的示例展示了\
  \ `File` 类的几个方法\n\n```java\nimport java.io.*;\nclass FileTest\n{\n    public static\
  \ void main(String args[]) throws IOException\n    { \n        File f = new File(\"\
  /javaprog/ch15/15.1/FileTest.java\");\n        if(!f.exists())\n            f.createNewFile();\n\
  \        System.out.println(\"Length=\"+f.length()+\" bytes\");\n        System.out.println(\"\
  Name=\"+f.getName());\n        System.out.println(\"Parent=\"+f.getParent());\n\
  \        System.out.println(\"Path=\"+f.getPath());\n        System.out.println(\"\
  Absolute Path=\"+f.getAbsolutePath());\n        System.out.println(f.exists() ?\
  \ \"Exists\" : \"Does not exist\");\n        System.out.println(f.isFile() ? \"\
  is file\" : \"not a file\");\n        System.out.println(f.canRead() ? \"is readable\"\
  \ : \"not readable\");\n        System.out.println(f.canWrite() ? \"is writable\"\
  \ : \"not writable\");\n        System.out.println(f.isDirectory() ? \"is directory\"\
  \ : \"not a file\");\n        System.out.println(f.isHidden() ? \"is hidden\" :\
  \ \"not a file\");\n    }\n}\n```\n\n\n\n\n### FileOutputStream 方法\n\n| `public\
  \ FileOutputStream(File) throws FileNotFoundException;` 创建一个文件输出流，用于向指定的 `File`\
  \ 对象表示的文件写入。 |\n| `public FileOutputStream(File, boolean) throws FileNotFoundException;`\
  \ 创建一个文件输出流，用于向指定的 `File` 对象表示的文件写入。 |\n| `public native void write(int) throws\
  \ java.io.IOException;` |\n| `public void write(byte[ ]) throws java.io.IOException;`\
  \ |\n| `public void write(byte[ ], int, int) throws java.io.IOException;` |\n| `public\
  \ void close( ) throws java.io.IOException;` |\n\n#### 示例 15.2\n\n```java\nimport\
  \ java.io.*;\nclass FileRead\n{\n  public static void main(String args[])\n  {\n\
  \      FileInputStream fin=null;\n      int a;\n      try\n      {\n        fin=new\
  \ FileInputStream(args[0]);\n        System.out.println(\"No. of characters to read=\"\
  +fin.available());\n        fin.skip(3);\n        a = fin.read();\n        while(a\
  \ != -1)\n        {\n          System.out.print((char)a);\n          a = fin.read();\n\
  \        }\n        System.out.println(\"No. of characters to read=\"+fin.available());\n\
  \        fin.close(); \n      }\n      catch(ArrayIndexOutOfBoundsException e)\n\
  \      {\n        System.out.println(e);\n      }\n      catch(FileNotFoundException\
  \ e)\n      {\n        System.out.println(e);\n      }\n      catch(IOException\
  \ e)\n      {\n        System.out.println(e);\n      }\n  }\n}\n```\n\n**输出：**\n\
  ```\njava FileRead A.txt\nNo. of characters to read=20\nMatrix Computers\nNo. of\
  \ characters to read=0\n```\n\n#### 示例 15.3\n\n```java\nimport java.io.*;\nclass\
  \ FileCopy\n{\n  public static void main(String args[]) throws IOException\n  {\n\
  \      FileInputStream fin=null;\n      FileOutputStream fout=null;\n      fin=new\
  \ FileInputStream(args[0]);\n      fout=new FileOutputStream(args[1]);\n      int\
  \ a;\n      a = fin.read();\n      while(a != -1)\n      {\n        fout.write(a);\n\
  \        a = fin.read();\n      }\n      fin.close();fout.close();\n  }\n}\n```\n\
  \n#### 示例 15.4\n\n```java\nimport java.io.*;\nclass CopyFile\n{\n  public static\
  \ void main(String args[]) throws IOException\n  { \n      int n;\n      FileInputStream\
  \ fin = new FileInputStream(\"A.txt\");\n      FileOutputStream fout = new FileOutputStream(\"\
  B.txt\");\n      byte b[ ]= new byte[10];\n      n = fin.read(b);\n      while(n\
  \ != -1)\n      { \n        fout.write(b,0,n);\n        n = fin.read(b);\n     \
