  输出：\n\n![image](img/image058.png)\n\n## Scrollbar（滚动条）\n\n调整列表和滚动面板的 Scrollbar 组件可以作为独立的组件存在。它有三个构造函数：\n\
  \n`Scrollbar ()`\n\n构造一个新的垂直滚动条。\n\n`Scrollbar (int orientation)`\n\n构造具有指定方向的新滚动条。\n\
  \n`Scrollbar (int orientation, int initialValue, int sliderSize, int minValue, int\
  \ maxValue)`\n\n构造具有指定方向、初始值、滑块大小以及最小值和最大值的新滚动条。`sliderSize` 参数控制滑块的大小，但不是以像素为单位。对于对于带有方向参数的构造函数，该值应该是以下之一：\n\
  \n- `Scrollbar.HORIZONTAL`（水平）\n- `Scrollbar.VERTICAL`（垂直）\n\n### 示例 17.22\n\n```java\n\
