  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章\n\n# ∞ 8 ∞\n\n## (包)\n\n### 引言\n\n\
  当我们处理一个项目时，必须将程序拆分为若干类。为了组织这些类，我们使用 `Packages`（包）。包既是一种命名机制，也是一种可见性控制机制。包是相关的类和接口的集合。在包的帮助下，只要它们定义在不同的包中，就可以给多个类赋予相同的名称。\n\
  \n单个包不能包含两个同名的类。\n\n`PROGRAMS` 被组织为包的集合。每个包都有自己的一组子包，这有助于防止名称冲突。一个顶层包只有在被声明为 `public`\
  \ 时才能在包外部访问。包的命名结构是层次化的。包的成员是类、接口类型以及子包。`java` 中的包是一种封装机制，用于将相关的类、接口和子包分组。\n\n对于小型程序，包可以是未命或具有简单的名称，但如果代码要广泛分发，则应该选择唯一的包名。\n\
  \n这可以防止当两个开发小组恰好选择相同的包名，且这些包随后在在程序程序中使用时可能发生的冲突。如果我们没有为 `java` 类指定包，那么该类将成为 Java\
  \ 默认包的一部分，称为未命名包。但这要求每个类都必须有唯一的名称以避免冲突。\n\n### 未命名包的示例\n\n```java\nclass A\n{\n\
  - - - - - - -\n- - - - - - - -\n}\n\nclass A_demo\n{\n    public static void main(String\
  \ args[])\n    {\n- - - - - - -\n- - - - - - - -\n    }\n}\n```\n\n### 如何定义包\n\n\
  要创建一个包，请在 Java 源文件中将 `package` 命令作为第一条语句包含。在该文件中声明的任何类都将属于指定的包。`package` 语句定义了存储类的命名空间。如果我们省略了包语句，类名将放入默认包中，该包没有名称，并称为未命名包。\n\
  \n`package` 语句具有以下语法：\n\n```java\npackage package_name;\n```\n\nJava 使用文件系统目录来存储包。记住大小是敏感的，目录名必须与包名完全匹配。多个文件可以包含相同的包语句。\n\
  \n### 语法：\n\n```java\npackage p1;    //包声明\nclass A      //类声明\n{\n- - - - - - -\
  \  //类 A 的体\n- - - - - - -\n}\n```\n\n`package` 是一个关键字。`p1` 是类 `A` 存储的包名。\n\n###\
  \ 示例 8.1:\n\n```java\n1.  package p1;\n2.  class A\n3.    {\n4.      public static\
  \ void main(String args[])\n5.      {\n6.        System.out.println(\"First Package\
  \ program.\");\n7.      }\n8.    }\n```\n\n我们假设当前文件夹是 `(c:\\javaprg\\p1>)`。\n\n\
  ```bash\nC:\\javaprg\\p1>javac A.java\nC:\\javaprg\\p1>java A\n```\n输出：\n`First\
  \ Package program.`\n\n注意：如果使用 `-d c:\\javaprg A.java` 编译上述内容，则 `p1` 文件夹将自动创建，`.class`\
  \ 文件将放在该文件夹中。\n\n```bash\nC:\\javaprg\\p1>javac -d c:\\javaprg A.java\nC:\\javaprg\\\
  p1>java p1.A\n```\n\n## 导入包\n\n所有内置类都存储在命名的包中。由于类必须使用其包名完全限定，为每个类输入长名称可能会非常麻烦。`import`\
  \ 语句是将某些类引入我们的应用程序的便利方法。一旦导入，就可以仅使用名称直接引用类。`import` 语句紧跟在 `package` 语句之后，任何类定义之前。这是\
  \ `import` 语句的通用形式：\n\n```java\nimport p1.classname;\nimport p2.*;\n```\n\n### 示例\
  \ 8.2\n\n使用 `import` 语句使用 `Random` 类打印 10 个随机数：\n\n```java\nclass RandomTest1\n\
  {\n    public static void main(String args[])\n    {\n        java.util.Random r1\
  \ = new java.util.Random();\n        for(int i=1; i<=10; i++)\n        {\n     \
  \       System.out.println(java.util.Math.abs(r1.nextInt()));\n        }\n    }\n\
  }\n```\n\n### 示例 8.3\n\n带有 `import` 语句使用 `Random` 类打印 10 个随机数：\n\n```java\nimport\
  \ java.util.Random;\nclass RandomTest2\n{\n    public static void main(String args[])\n\
  \    {\n        Random r1 = new Random();\n        for(int i=1; i<=10; i++)\n  \
  \      {\n            System.out.println(Math.abs(r1.nextInt()));\n        }\n \
  \   }\n}\n```\n\n\n\n\n如果我们从当前文件夹以外的任何文件夹运行上述程序，它将无法运行。默认情况下，Java 运行时系统使用当前工作目录作为起点。\n\
  \n因此，如果我们的包在当前目录下，或者在当前目录的子目录下，它将能够找到。但要从任何其他文件夹运行上述程序，我们必须在命令提示符中使用 `SET CLASSPATH=.;C:\\\
  JAVAPRG` 命令来设置类路径。`CLASSPATH` 是一个环境变量。我们每次第一次启动计算机时都必须输入此命令。但如果我们把此命令放在 `我的电脑 ->\
  \ 属性 -> 高级 -> 环境变量` 中，那么就不需要再反复输入此命令了。\n\n我们也可以不设置 `CLASSPATH` 环境变量的情况下运行程序。执行此操作输入：\n\
  \n```\njava –classpath c:\\javaprg p1.A\n```\n\n## 包 (Packages)\n\n注意 4:-我们可以创建包的层级结构。要这样做，只需使用点将每个包名与其上方的包名分开。多级包语句的通用形式为：\n\
  \n`package package_name1[.package_name2][.package_name3];`\n\n包的层级结构必须反映在 Java 开发系统的文件系统中。例如，包\
  \ `java.awt.Image` 需要存储在 `java\\awt\\image` (WINDOWS) 或 `java/awt/image` (UNIX)\
  \ 或 `java:swt:image` (MACINTOSH) 文件系统中。\n\n包的层级结构代表了 Java 类和接口的组织。它并不代表类和接口的源代码组织。\n\
  \n每个 Java 源文件（也称为编译单元）可以包含零或多个类和接口的定义，但编译器会为其中的每一个项目生成一个包含 Java 字节码的独立类文件。类或接口可以使用包声明来指示其\
  \ Java 字节码被放在特定的包中。\n\n- 包 `java` 有子包 `awt`、`applet`、`io`、`lang`、`net` 和 `util`，但没有类或接口。\n\
  - 包 `java.awt` 有一个名为 `image` 的子包，以及许多类和接口。\n- 因为包 `java.awt` 有子包 `image`，所以它不能包含名为\
  \ `image` 的类或接口的声明。\n- 如果一个包的全限定名是 `P`，且 `Q` 是 `P` 的子包，那么 `P.Q` 就是子包的全限定名。\n- 如果有一个名为\
  \ `mouse` 的包，且该包中有一个成员 `Button`（然后被称为 `mouse.Button`），那么不能存在任何全限定名为 `mouse.Button`\
  \ 或 `mouse.Button.Click` 的包。\n- 一个源文件中最多只能出现一个包语句，且它必须是 Java 源文件的第一个语句。\n\n### 类的可见性\
  \ (Visibility of class)\n\n类和包都是封装和包含变量、方法命名空间及范围的手段。包作为类和子包的容器。类作为数据和方法代码的容器。类是\
  \ Java 最小的抽象单元。由于类和包之间的相互作用，Java 处理了五类类成员的可见性：\n\n1. 类内部可见性。\n2. 同一个包中子类中的可见性。\n\
  3. 同一个包中非子类中的可见性。\n4. 不同包中子类中的可见性。\n5. 既不在同一包中也不是子类的子类中的可见性。\n\n注意 1:-顶层类和接口有两种可能的访问权限：`default`\
  \ 和 `public`。\n注意 2:-如果类声明为 `public`，则其他代码可以访问。\n注意 3:-如果类具有 `default` 访问权限，则只能由同一个包内的其他代码访问。\n\
  注意 4:-如果类的可见性修饰符为 `default`，即使是类的公共成员也只在包内可见。\n\n## JAR 文件 (Java 归档文件)\n\n为了压缩文件，我们使用诸如\
  \ `winzip` 等程序，就像 Java 的 JAR 功能可以压缩整个 Java 包层级结构一样。它提供了更好的安装便利。不需要在客户位置创建文件结构。我们只需要使用\
  \ JAR 文件，该文件将恢复整个文件结构。所有的包、子包和类文件都将从 JAR 文件自动创建。JAR 技术让交付和安装变得简单得多。此外，JAR 文件中的元素是压缩的，这使得下载\
  \ JAR 文件比单独下载未解压缩的文件更快。这允许消费者确定这些元素是由特定的组织或个人产生的。\n\nJAR 文件有以下可用选项：\n\n| 选项 |  |\n\
  | :--- | :--- |\n| `c` | 创建一个新的归档文件。 |\n| `C` | 在命令执行期间更改目录。 |\n| `f` | 文件列表的第一个元素是要创建的归档文件的名称。\
  \ |\n| `i` | 应该提供索引信息。 |\n| `m` | 文件列表中的第二个元素是外部清单文件的名称。 |\n| `M` | 不创建清单文件。 |\n\
  | `t` | 应该列出归档内容。 |\n| `u` | 更新现有的 JAR 文件。 |\n| `v` | 工具在执行时应提供详细输出。 |\n| `x` |\
  \ 文件从归档中提取出来。 |\n| `o` | 不使用压缩。 |\n\n### 创建 JAR 文件\n```\nc:\\javaprg> jar -cf Myjar.jar\
  \ pack1\n```\n这将创建一个名为 `Myjar.jar` 的 JAR 文件，它将包含压缩格式的 `pack1` 包的所有文件。\n\n### 提取\
  \ JAR 文件\n```\nc:\\javaprg> jar Myjar.jar\n```\n此命令用于提取 JAR 文件（如解压）。\n\n### 列出 JAR\
  \ 文件内容\n```\nc:\\javaprg> jar -tf Myjar.jar\n```\n以下命令列出了 `Myjar.jar` 的内容。\n\n###\
  \ 更新现有的 JAR 文件\n```\nc:\\javaprg> jar -uf Myjar.jar pack1\n```\n以下命令用于更新 JAR 文件。\n\
  \n### 创建可执行的 JAR 文件\n```\nc:\\javaprg> jar -cmf mainClass Myjar.jar pack1\n```\n\
  其中 `mainClass` 是一个文本文件，包含 `Main-Class: pack1.pack2.pack3.A` 并保存在 `javaprg` 文件夹中。\n\
  \n### 执行 JAR 文件\n```\njava -jar Myjar.jar\n```\n[/]\n\n## 理论题\n\n1. 我们如何理解包？\n2.\
  \ 解释所有的修饰符及其在不同包、子包、子类和其他类中的范围。\n3. JAR 文件有什么作用？\n4. `import` 语句的作用是什么？\n\n# 第 9\
  \ 章：接口 (Interface)\n\n### 简介\n\n接口本质上是一种类。与类一样，接口包含方法和变量，但有一个主要的区别。区别在于接口只定义抽象方法和末尾变量（常量）。这意味着接口不编写任何代码来实现这些方法，且数据字段只包含常量。\n\
  \n因此，实现接口的类负责编写实现这些方法的代码。接口在语法上与类相似，但缺少实例变量，且其方法声明没有体。在实践中，这意味着我们可以定义接口而不对其如何实现做任何假设。接口的目的是将类的接口与其实现分离。接口只定义类需要做什么，而不说如何做。\n\
  \n\n\n\n嵌套接口是指任何声明在另一个类或接口体内的接口。顶层接口不是嵌套接口的接口。定义接口的语法与定义类的语法非常相似。接口定义的通用形式如下：\n\n\
  ```java\ninterface interface_name\n{\n    variable declarations;\n    methods declarations;\n\
  }\n```\n\n在这里，`interface` 是关键字，`interface_name` 是任何有效的 Java 标识符（类似于类名）。\n\n**注意：**\
  \ 当我们定义一个接口时，默认情况下它是 `public`（公共的）且 `abstract`（抽象的）。\n\n### 接口修饰符\n可以用于顶层接口的唯一修饰符是\
  \ `abstract` 和 `public`。即使我们不使用 `abstract` 修饰符，接口也会隐式地声明为 `abstract`，因此不需要使用 `abstract`\
  \ 修饰符。顶层接口的可见性可以是 `package`（包私有）或 `public`，就像顶层类一样。如果不使用可见性修饰符，则接口的可见性假设为 `package`。\n\
  \n### 数据变量成员声明\n接口中只能定义常量。接口中的所有变量都是隐式的 `public`、`final` 和 `static`，这意味着它们不能被实现类更改。它们还必须用常量值初始化。\n\
  \n```java\npublic static final type variable_name=value;\n```\n\n在接口中声明的变量是 `public`、`static`\
  \  `final`。这意味着它是一个具有公共访问权限的静态变量。该变量也被声明为 `final`，这意味着它必须在声明时被赋值，并且之后不能进行修改。`final`\
  \ 关键字类似于 C/C++ 中的 `const`。\n\n### 方法声明\n方法声明将仅包含方法列表，而不包含任何 `body`（方法体）语句。它们在参数列表后以分号结束。它们本质上是抽象方法，接口中指定的任何方法都不能有默认实现。\n\
  \n接口中的所有方法默认始终都是 `public` 和 `abstract` 修饰符。我们不能在接口中声明 `static` 方法。\n\n```java\n\
  public abstract return_type method_name(parameter_list);\n```\n\n这里是一个包含两个变量和一个方法的接口定义示例：\n\
  \n```java\ninterface item\n{\n    static final int code = 1001;\n    static final\
  \ String name = \"Matrix\";\n    abstract void display( );\n}\n```\n\n**注意：** 方法的代码不包含在接口中，方法声明简单地以分号结束。\n\
  \n另一个接口的示例：\n\n```java\ninterface area\n{\n    float pi = 3.142f;\n    float compute\
  \ (float x, float y);\n    void show( );\n}\n```\n\n### 扩展接口\n像类一样，接口也可以被扩展，即一个接口可以从其他接口派生。新接口将以类似于子类的方式继承子接口的所有成员。这是通过使用\
  \ `extends` 关键字实现的，如下：\n\n```java\ninterface interface_1\n{\n    int code = 1001;\n\
  \    String name = \"Matrix\";\n}\n\ninterface interface_2 extends interface_1\n\
  {\n    void display();\n}\n```\n\n`interface_2` 将继承常量 `code` 和 `name`。\n\n**注意：**\
  \ 变量 `name` 和 `codes` 是像普通变量一样声明的。这在这里是允许的，但接口中的所有变量都被视为常量、`public` 和 `static`，尽管这里没有使用\
  \ `public`、`static` 和 `final` 关键字。\n\n我们可以将多个接口合并并在一个接口中。以下声明是有效的：\n\n```java\n\
  interface interface_1\n{\n    int code = 1001;\n    String name = \"Matrix\";\n\
  }\n\ninterface interface_2\n{\n    void display();\n}\n\ninterface interface_3 extends\
  \ interface_1, interface_2\n{\n}\n```\n\n**注意：** 始终记住接口不能扩展类。这违反了接口只能有抽象方法和常量的规则。\n\
  \n### 实现接口\n接口被用作“超类”，其属性被类继承。因此，有必要创建一个给定接口的类。一旦定义了接口，一个或多个类就可以实现该接口。\n\n要实现接口，要在类定义中包含\
  \ `implements` 子句，然后创建接口声明的方法。\n\n实现类必须提供所有接口中所有方法的 `body`，否则它必须被声明为 `abstract`。实现类还可以扩展一个类并可以实现多个接口。\n\
  \n```java\nmodifier class<class-name> implements<interface-name>\n{\n    body of\
  \ the class\n}\n```\n\n**类中接口实现 implements 的语法**\n\n```java\ninterface interface_name\n\
  {\n}\n\nclass class _name implements interface_name\n{\n    Body of class\n}\n```\n\
  \nJava 不支持多重继承，但它支持多接口继承，即一个类可以实现多个接口，如下所示：\n\n```java\nmodifiers class <class-name>\
  \ implements <interface-1>,<interface-2>,<interface-3>, ....<interface-n>\n{\n \
  \   body of class\n}\n```\n\n**注意：** 当我们实现接口方法时，必须将其声明为 `public`。实现接口方法类似于重写，因此我们不能降低可见性。\n\
  \n**示例 9.1**\n```java\n1. interface interface_1\n2. {\n3.    void show(int x);\n\
  4. }\n5. class class_1 implements interface_1\n6. {\n7.    public void show(int\
  \ x)\n8.    {\n9.    }\n10. }\n11. }\n```\n\n**示例 9.2 抽象类**\n```java\n1. interface\
  \ common\n2. {\n3.    void push(int x);\n4.    void pop( );\n5. }\n6. abstract class\
  \ stack implements common\n7. {\n8.    void push(int x)\n9.    {\n10.   }\n11. }\n\
  ```\n\n### 通过接口访问类对象\n我们可以使用接口而不是类类型声明对象引用。任何实现类的实例都可以由这种变量引用。当我们通过这些引用之一调用方法时，将在实际引用的实例上调用正确的版本。这是接口的一个重要特性。要执行的方法在运行时查找，允许类在调用它们的代码之后创建。此过程类似于使用父类引用来访问子类。\n\
  \n与 Java 中普通方法调用相比，运行时动态查找方法会有开销，因此我们应该避免在性能关键代码中使用接口。**\n\n**示例 9.3**\n```java\n\
  interface Math_function\n{\n    void display(int x);\n}\n\nclass Sqrt implements\
  \ Math_function\n{\n    public void display(int x)\n    {\n        System.out.println(\"\
  sqrt of x =\"+Math.sqrt(x));\n    }\n}\n\nclass Log implements Math_function\n{\n\
  \    public void display(int x)\n    {\n        System.out.println(\"log of x =\
  \ \"+Math.log(x));\n    }\n}\n\nclass Math_Demo\n{\n    public static void main(String\
  \ args[])\n    {\n        Math_function f1 = new Sqrt();\n        Math_function\
  \ f2 = new Log();\n        f1.display(27);\n        f2.display(3);\n\n        Math_function\
  \ f3;\n        f3=f1; // 多态（赋值引用）\n        f3.display(30);\n    }\n}\n```\n\n\n\n\
  \n\n```java\n30. f3=f2;  //多态（赋值引用）\n31. f3.display(5);\n32. }\n33. }\n```\nOutput:\n\
  \n![image](img/image072.png)\n\n## 接口的特性\n\n- `Interface` 是一个关键字。\n- `Interface`\
  \ 可以声明为抽象的（abstract），但它默认就是抽象的，因此不需要添加 `abstract` 关键字。\n- 所有变量始终是 `public static`\
  \ 且 `final` 的。\n- `interface` 的所有方法必须在类中实现。\n- 实现类实现的所有方法必须是 `public` 的。\n- `Interface`\
  \ 仅包含方法的声明。\n- `Interface` 方法不能声明为 `static`。它们始终被声明为实例方法。\n- 类既不能缩小接口方法的访问权限，也不能在方法的\
  \ `throws` 子句中指定新的异常；因为尝试这样做将等同于改写了接口的契约，这是非法的。重写方法的标准也适用于实现接口方法。\n- 在实现类中，所有方法都需要被定义为\
  \ `public`。\n- 这里允许使用 `abstract` 关键字进行部分实现。\n- 无论类直接或间接实现了多少个接口，对于可能在多个接口中有多次声明的方法，它只提供一个单一的实现。\n\
  - 方法原型声明也可以像类一样进行重载。\n- 接口常量可以被任何客户端（类或接口）通过其全限定名来访问，无论该客户端是否扩展或实现了该接口。然而，如果客户端是实现此接口的类或扩展此接口的接口，则客户端也可以直接访问此类常量，而无需使用全限定名。此类客户端继承了接口常量。\n\
  - 在接口常量的多重继承的情况下，任何名称冲突都可以使用相关常量的全限定名来解决。\n\n## 接口变量\n\n`interface` 中的所有变量始终是 `public\
  \ static` 和 `final` 的，因为它们是实现类访问数据类型和方法的公共部分。\n\n## 接口变量的内存管理\n\n静态变量在程序加载时始终会分配内存，它们占用独立的内存，不与任何对象的内存共享。它们也被称为常量变量。可以使用接口名和\
  \ `{}` 点操作符直接访问。\n\n### 示例 9.4\n\n```java\ninterface Static_Var\n{\n  int sun=1;\n\
  \  int mon=2;\n  int tues=3;\n  int wed=4;\n  int thurs=5;\n  int fri=6;\n  int\
  \ sat=7;\n}\nclass Week_Day implements Static_Var\n{\n  public static void main(String\
  \ args[])\n  {\n    System.out.println(sun);\n    System.out.println(mon);\n   \
  \ System.out.println(tues);\n    System.out.println(wed);\n    System.out.println(thurs);\n\
  \    System.out.println(fri);\n    System.out.println(sat);\n  }\n}\n```\n或者\n\n\
  ```java\nclass Week_Day\n{\n  public static void main(String args[])\n  {\n    System.out.println(Static_Var.sun);\n\
  \    System.out.println(Static_Var.mon);\n    System.out.println(Static_Var.tues);\n\
  \    System.out.println(Static_Var.wed);\n    System.out.println(Static_Var.thurs);\n\
  \    System.out.println(Static_Var.fri);\n    System.out.println(Static_Var.sat);\n\
  \  }\n}\n```\nOutput: 1\n2\n3\n4\n5\n6\n7\n\n### 示例 9.5\n\n```java\ninterface Two_Methods\n\
  {\n  void m1();\n  void m2();\n}\nclass Three_Methods implements Two_methods\n{\n\
  \  public void m1()\n  {\n    // m1 的方法体\n  }\n  public void m2()\n  {\n    // m2\
  \ 的方法体\n  }\n  public void m3()\n  {\n    // m3 的方法体\n  }\n}\nclass Methods_Demo\n\
  {\n  public static void main(String args[])\n  {\n    Two_methods tm1 = new Three_methods();\n\
  \    tm1.m1();\n    tm1.m2();\n    //tm1.m3(); 错误\n    Three_Methods tm2 = new Three_Methods();\n\
  \    tm2.m3();\n  }\n}\n```\n注意：这里我们无法通过接口引用调用 `m3()`，因为方法没有在接口中声明。接口引用只能访问接口中声明的方法。\n\
  \n### 示例 9.6 一个类多个接口\n\n```java\ninterface Two_Methods\n{\n  void m1();\n  void\
  \ m2();\n}\ninterface One_Method extends Two_Methods\n{\n  void m3();\n}\nclass\
  \ Three_Methods implements One_Method\n{\n  public void m1()\n  {\n    // m1 的方法体\n\
  \  }\n  public void m2()\n  {\n    // m2 的方法体\n  }\n  public void m3()\n  {\n  \
  \  // m3 的方法体\n  }\n}\nclass Methods_Demo\n{\n  public static void main(String args[])\n\
  \  {\n    Three_methods tm1 = new Three_methods();\n    tm1.m1();\n    tm1.m2();\n\
  \    tm1.m3();\n  }\n}\n```\n\n## 非接口方法\n\n当任何类实现了接口的方法，并在类中定义了接口未定义的额外方法时，我们可以说这些额外方法是非接口方法。使用接口引用变量无法调用这些额外方法。\n\
  \n### 示例 9.7\n\n```java\ninterface Two_Methods\n{\n  void push(int x);\n  int pop();\n\
  }\nclass Stack implements Two_Methods\n{\n  int arr[] = new int[5];\n  int top=\
  \ -1;\n  public void push(int item)\n  {\n    if(top == 4)\n    {\n      System.out.println(\"\
  Overflow\");\n      return;\n    }\n    top++;\n    arr[top]=item;\n  }\n  public\
  \ int pop()\n  {\n    if(top == -1)\n    {\n      System.out.println(\"Underflow\"\
  );\n      return -1;\n    }\n    int item = arr[top];\n    top--;\n    return (item);\n\
  \  }\n  void disp()\n  {\n    for(int i=top;i>=0;i--)\n    {\n      System.out.println(arr[i]);\n\
  \    }\n  }\n}\nclass Stack_Demo\n{\n  public static void main(String args[])\n\
  \  {\n    Stack s1=new Stack();\n    s1.push(10);\n    s1.push(20);\n    s1.push(30);\n\
  \    s1.push(40);\n    s1.push(50);\n    s1.disp();\n    s1.push(60);\n    s1.disp();\n\
  \    s1.pop();\n    s1.disp();\n  }\n}\n```\n\n\n\n\n\n该规则的唯一例外是 `+` 和 `+=` 运算符，它们连接两个字符串并产生一个\
  \ `String` 对象作为结果。在 Java 中，字符数组不被视为字符串。在 Java 中，`String` 类被定义用于执行所有的字符串操作。`String`\
  \ 类和 `StringBuffer` 是 `java.lang` 包的一部分。\n\n### String 类\n\n```java\nString s1 =\
  \ new String(\"matrix\");\nString s2 = \"matrix\";\nSystem.out.println(s1);\nSystem.out.println(s1.length);\n\
  System.out.println(\"matrix\".length);\n```\n\n`String` 在 Java 中具有以下特性：\n\n####\
  \ (i) String 是 Java 中的对象\n`String` 表示一个字符序列，但与许多将 `String` 实现为字符数组的其它语言不同，Java 将字符串实现为\
  \ `string` 类型的对象。\n\n字符串操作是许多 Java 程序中最常见的部分。将字符串实现为内置对象允许 Java 提供一套功能完备的特性，使字符串处理变得方便。此外，对象可以通过多种方式进行构造，以便在需要时轻松获取字符串。\n\
  \n#### (ii) String 是不可变的\n`String` 是不可变的，也就是说在创建后我们无法更改该字符串。然而，声明为 `String` 引用的变量可以随时更改以指向其他字符串对象。\n\
  \n我们仍然可以执行所有类型的字符串操作。每当我们需要现有字符串的修改版本时，就会创建一个包含这些修改内容的新字符串对象。\n\n原始字符串保持不变。使用这种方法是因为固定的、不可变的字符串可以比可变的字符串实现得更高效。\n\
  \n对于那些需要修改字符串的情况，有一个名为 `StringBuffer` 的伴随类，其对象包含的字符串在创建后是可以被修改的。\n\n#### (iii) String\
  \ 类是 final 的\n`String` 和 `StringBuffer` 类都是 `final` 的。这意味着我们不能在任何类中扩展 `String` 类。这允许某些优化，从而提高常用字符串操作的性能。\n\
  \n### String 类的构造函数与方法\n\n| # | 方法 | 说明 |\n| :--- | :--- | :--- |\n| 1 | `public\
