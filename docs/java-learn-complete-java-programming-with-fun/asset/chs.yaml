  `FileReader` 类创建了一个 `Reader`，你可以用它来读取文件的内容。它两个常用的构造函数是：\n\n- `FileReader(File file)`：创建一个\
  \ `FileReader` 流，用于从指定的文件读取。\n- `FileReader(String fileName)`：创建一个 `FileReader`\
  \ 流，用于从指定的文件读取。\n\n**注意：** 如果文件不存在、是一个目录而非普通文件，或者由于某些原因无法打开读取，其中一个构造函数都可能抛出 `FileNotFoundException`。\n\
  \n### FileWriter\n\n`FileWriter` 类创建了一个 `writer`，你可以用它向文件写入。它两个常用的构造函数是：\n\n- `FileWriter(File\
  \ file)`：一个 `FileWriter` 对象，用于写入指定的文件。\n- `FileWriter(String fileName)`：一个 `FileWriter`\
  \ 对象，用于写入指定的文件。\n- `FileWriter(File file, boolean append)`：一个 `FileWriter` 对象，以\
  \ `append` 模式向指定的文件写入。\n- `FileWriter(String filename, boolean append)`：一个 `FileWriter`\
  \ 对象，以 `append` 模式向指定的文件写入。\n\n如果使用前两个构造函数，将创建一个新文件。如果同名文件存在，它将被覆盖。如果使用后两个构造函数且\
  \ `append` 标志为 `false`，则它们的行为与前两个构造函数相同。如果 `append` 标志为 `true`，则文件指针将置于文件末尾，如果文件不存在则会创建新文件。\n\
  \n**注意：** 如果文件存在但是目录而非普通文件、不存在但无法创建、或由于任何原因无法打开，这些构造函数可能会抛出 `IOException`。例如，当你尝试打开一个只读文件时，将抛出\
  \ `IOException`。\n\n#### 示例 15.5\n\n```java\nimport java.io.*;\nclass FileCopy\n\
  {\n  public static void main(String args[]) throws IOException\n  {\n      FileReader\
  \ fin=null;\n      FileWriter fout=null;\n      fin=new FileReader(args[0]);\n \
  \     fout=new FileWriter(args[1]);\n      int a;\n      a = fin.read();\n     \
  \ while(a != -1)\n      {\n        fout.write((char)a);\n        a = fin.read();\n\
  \      }\n      fin.close();\n      fout.close();\n  }\n}\n```\n\n### RandomAccessFile\n\
  \n`RandomAccessFile` 封装了一个随机访问文件。`RandomAccessFile` 允许我们在文件的任何位置读取和写入字节、文本和原始数据类型。它支持自定位请求——即你可以将文件指针置于文件的任何位置。它实现了\
  \ `DataInput` 和 `DataOutput` 接口。`mode` 参数指定打开文件的访问模式如下：\n\n| 值 | 含义 |\n| :--- |\
  \ :--- |\n| `\"r\"` | 仅读取。调用结果对象的任何 `write` 方法将抛出 `IOException`。 |\n| `\"rw\"` |\
  \ 可读写。如果文件不存在，则将尝试创建它。 |\n| `\"rws\"` | 可读写，如 `\"rw\"`，并且要求对文件内容或元数据的同步写入到底层存储设备。\
  \ |\n| `\"rwd\"` | 可读写，如 `\"rw\"`，并且要求对文件内容（数据）同步写入到底层存储设备。 |\n\n#### RandomAccessFile\
  \ 方法\n\n除了 `DataInput` 和 `DataOutput` 接口的方法外，该类的一些常用方法包括：\n\n| `public RandomAccessFile(String,\
