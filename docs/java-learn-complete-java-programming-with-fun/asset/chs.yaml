  2. {\n3.    int a;\n4.    float b;\n5.    public TestClone1 clone2() throws CloneNotSupportedException\n\
  6.    {\n7.      return (TestClone1) clone();\n8.    }\n9. }\n10. class CloneDemo1\n\
  11. {\n12.    public static void main(String a[]) throws CloneNotSupportedException\n\
