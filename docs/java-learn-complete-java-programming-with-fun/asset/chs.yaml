  \n### 示例 17.5:-\n\n我们可以在设置布局时通过使用重载构造函数来更改行内组件之间的间距（水平间距）以及行之间的间距（垂直间距）：\n\n![image](img/image020.png)\n\
  `f.setLayout(new FlowLayout(FlowLayout.CENTER, 20))`\n\n![image](img/image078.png)\n\
  vgap（行间距） hgap（组件间距）\n\n输出：\n\n![image](img/image046.png)\n\n### GridLayout:\n\n\
  网格布局管理器（GridLayout）的功能封装在 `java.awt.GridLayout` 类中。它以表格格式按行和列排列组件。我们可以将容器空间想象为一个由行和列组成的网格。在指定布局时，我们必须指定行数和列数。\n\
  \n网格布局管理器会将与行的大小（布局中指定的列数）相适应的多个组件放入第一行，并将其他组件移动到第二行，依此类推。这类似于电子，被分为固定数量的行和列。\n\n\
  流式布局管理器（Flow layout manager）始终尊重组件的首选 own。`GridLayout` 管理器采取了相反：当它在给定空间内执行布局时，它会忽略组件的首选\
  \ own。网格布局中的每行每列的大小都是相同的，布局可用的总区域在行数和列数之间平分。网格布局使用“行主”表示法，即组件按照它们被添加的顺序从左到右、逐一行地出现。\n\
  \n当我们添加少量组件（即远少于行数乘以列数）或非常多组件（即多于行数乘以列数）时，`GridLayout` 的行为会很奇怪。如果将相同的组件放置在一个更高、更窄的框架中，那么每个组件都会按比例变得更高、更窄。示例\
  \ 17.6：\n\n```java\nimport java.awt.*;\n\npublic class MyFrame6 extends Frame\n\
  { \n    public static void main(String args[])\n    { \n      MyFrame6 f = MyFrame6();\n\
  \      f.setLayout(new GridLayout(5,3));\n      for(int row=0; row<5; row++)\n \
  \     { \n        f.add(new Label(\"Label\" + row));\n        f.add(new Button(\"\
  Button\" + row));\n        f.add(new TextField(\"TextField\" + row));\n      }\n\
  \      f.setSize(500,200);\n      f.setVisible(true);\n    }\n}\n```\n\n输出：\n\n\
  ![image](img/image50.png)\n\n### BorderLayout:\n\n边界布局管理器（BorderLayout）的功能封装在 `java.awt.BorderLayout`\
  \ 类中。它是框架（frames）的默认管理器，程序员迟早都会遇到它。\n\n它提供了一种非常有用的布局策略。流布局管理器总是尊重组件的首选大小；网格布局管理器从不这样做。边界布局管理器则介于两者之间。\n\
  \n它将可用空间分为五个部分：`North`、`South`、`East`、`West` 和 `Center`。我们可以向每个区域添加一个组件。每个区域可以为空，也可以包含一个组件（当然，如果该组件是容器，我们可以显示多个组件）。\n\
  \n`BorderLayout` 总是尊重 `North` 和 `South` 组件的首选高度，并强制它们与容器等宽。`North` 和 `South` 区域适用于工具栏、状态栏以及任何应该尽可能宽但不要过高的控件。\n\
  \n`East` 和 `West` 区域是 `North` 和 `South` 的相反。在 `East` 和 `West` 中，组件获得其首选宽度但高度被限制。\n\
  \n在这里，组件垂直延伸到 `North` 组件的底部（如果有的话）或延伸到容器的顶部（如果没有 `North` 组件）。同样，组件垂直向下延伸到 `South`\
  \ 组件的顶部（如果有的话）或延伸到容器的底部（如果没有 `South` 组件）。\n\n边界布局不受我们添加组件的顺序的影响。相反，我们必须指定哪个区域将接收我们要添加的组件。\n\
  \n重载的 `add()` 方法接受两个参数：\n* 首先是要添加的组件，\n* 第二个是任意对象\n\n正确使用 `Border layout` 管理器需要第二个参数是\
  \ `BorderLayout` 类本身定义的常量。我们应该了解的五个常量是：\n\n* `BorderLayout.NORTH`\n* `BorderLayout.SOUTH`\n\
  * `BorderLayout.EAST`\n* `BorderLayout.WEST`\n* `BorderLayout.CENTER`\n\n边界布局管理器控制的第五个区域被称为\
  \ `Center`。`Center` 只是在 `North`、`South`、`East` 和 `West` 分配后剩余的容器部分。\n\n将组件添加到中心时，省略\
  \ `add()` 调用中的第二个参数是合法的但不太明智。在 Java 平台上，边界布局管理器将假设我们指的是中心；但在旧版本中，行为是不可预测的，且通常会导致组件完全不可见。\n\
  \n### 示例 17.7\n\n\n\n\n\n```java\nimport java.awt.*;\n\npublic class MyFrame7\n\
  {\n  public static void main(String args[])\n  {\n    Frame f=new Frame( );\n  \
