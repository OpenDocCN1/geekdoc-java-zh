  \n这是一个字节流类，继承自 `FilterOutputStream`。`PrintStream` 为另一个输出流添加了功能，即能够方便地打印各种数据值的表示形式。\n\
  \n可选情况下，可以创建一个 `PrintStream` 以实现自动刷新（flush automatically）；这意味着在写入字节数组后、调用其中一个 `println`\
  \ 方法或写入换行符或字节（`\\n`）之后，会自动调用 `flush` 方法。\n\n由 `PrintStream` 打印的所有字符都将使用平台的默认字符编码转换为字节，然后写入到构造函数中指定的\
  \ `OutputStream` 或 `File` 中。\n\n`PrintStream` 支持针对所有类型（包括 `object`）的 `print()` 和\
  \ `println()` 方法。如果参数不是简单类型，`PrintStream` 方法将调用对象的 `toString()` 方法并打印结果。\n\n####\
  \ 构造函数\n\n- `PrintStream(File file)`：创建一个新的打印流，不进行自动行刷新，使用指定的文件。\n- `PrintStream(String\
  \ fileName)`：创建一个新的打印流，不进行自动行刷新，使用指定的文件名。\n- `PrintStream(OutputStream out)`：创建一个新的打印流，连接到指定的\
  \ `OutputStream`。\n- `PrintStream(OutputStream out, boolean autoFlush)`：创建一个新的打印流，连接到指定的\
  \ `OutputStream`。\n\n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\Star_logo_yellow.jpg](img/image032.jpg)\n\
  \n### 示例 15.14\n\n```java\nimport java.io.*;\nclass PrintStreamTest\n{\n    public\
  \ static void main (String args[]) throws IOException\n    {\n        PrintStream\
  \ ps = new PrintStream(System.out, true);\n        ps.println(\"This is a string\"\
  );\n        int i = -7;\n        ps.println(i);\n        double d = 4.5e-7;\n  \
  \      ps.println(d);\n    }\n}\n```\n\nOutput:\n```\nThis is a string\n-7\n4.5E-7\n\
  ```\n\n### 示例 15.15\n\n```java\nimport java.io.*;\nclass PrintStreamTest2\n{\n \
  \   public static void main (String argv[]) throws IOException\n    {\n        FileOutputStream\
  \ fout = new FileOutputStream(\"test.dat\");\n        PrintStream ps = new PrintStream(fout,\
  \ true);\n        ps.println(\"This is a string\");\n        int i = -7;\n     \
  \   ps.println(i);\n        double d = 4.5e-7;\n        ps.println(d);\n    }\n\
  }\n```\n\n## PrintWriter\n\n虽然在 Java 中使用 `System.out` 写入控制台仍然是被允许的，但它主要推荐用于调试或示例程序。\n\
  \n对于真实世界的程序，在使用 Java 时向控制台写入的推荐方法是通过 `PrintWriter` 流。`PrintWriter` 是基于字符的类之一。使用基于字符的类进行控制台输出可以使程序的国际化更容易。\n\
  \n#### 构造函数\n\n- `PrintWriter(File file)`：创建一个新的 `PrintWriter`，不进行自动行刷新，用于写入指定的文件。\n\
  - `PrintWriter(String fileName)`：创建一个新的 `PrintWriter`，不进行自动行刷新，用于写入指定的文件。\n- `PrintWriter(OutputStream\
  \ out)`：创建一个新的 `PrintWriter`，不进行自动行刷新，用于写入指定的 `OutputStream`。\n- `PrintWriter(OutputStream\
  \ out, boolean autoFlush)`：创建一个新的 `PrintWriter` 用于写入指定的 `OutputStream`。\n- `PrintWriter(Writer\
  \ out)`：创建一个新的 `PrintWriter`，不进行自动行刷新，用于写入指定的 `Writer`。\n- `PrintWriter(Writer out,\
  \ Boolean autoFlush)`：创建一个新的 `PrintWriter` 用于写入指定的 `Writer`。\n\n最常用的构造函数是：\n`PrintWriter(OutputStream\
  \ os, boolean flushOnNewLine)`\n\n在这里，`os` 是 `OutputStream` 类型的对象，`flushOnNewLine`\
  \ 控制 Java 每每次调用 `println()` 方法时是否都刷新输出流。如果 `flushOnNewLine` 为 `true`，则会自动执行刷新。如果为\
  \ `false`，则刷新不是自动的。\n\n`PrintWriter` 支持针对所有类型（包括对象）的 `print()` 和 `println()` 方法。如果参数不是简单类型，`PrintWriter`\
  \ 方法将调用对象的 `toString()` 方法并打印结果。\n\n要使用 `PrintWriter` 写入控制台，请为输出流指定 `System.out`\
  \ 并在每个新行后刷新流。例如，此行代码创建了一个连接到控制台输出的 `PrintWriter`：\n`pw = new PrintWriter(System.out,\
  \ true)`\n\n### 示例 15.16\n\n```java\nimport java.io.*;\nclass PrintWriterTest\n\
  {\n    public static void main (String argv[]) throws IOException\n    {\n     \
  \   PrintWriter pw = new PrintWriter(System.out, true);\n        pw.println(\"This\
  \ is a string\");\n        int i = -7;\n        pw.println(i);\n        double d\
  \ = 4.5e-7;\n        pw.println(d);\n    }\n}\n```\nOutput:\n```\nThis is a string\n\
  -7\n4.5E-7\n```\n\n### 示例 15.17\n\n```java\nimport java.io.*;\nclass PrintWriter1\n\
  {\n    public static void main (String argv[]) throws IOException\n    {\n     \
  \   FileWriter fout = new FileWriter(\"test.dat\");\n        PrintWriter pw = new\
  \ PrintWriter(fout, true);\n        pw.println(\"This is a string\");\n        int\
  \ i = -7;\n        pw.println(i);\n        double d = 4.5e-7;\n        pw.println(d);\n\
  \    }\n}\n```\n\n### 示例 15.18\n\n```java\nimport java.io.*;\nclass PrintWriter2\n\
  {\n    public static void main (String argv[]) throws IOException\n    {\n     \
  \   PrintWriter pw = new PrintWriter(System.out, true);\n        pw.println(\"This\
  \ is a string\");\n        int i = -7;\n        pw.println(i);\n        double d\
  \ = 4.5e-7;\n        pw.println(d);\n    }\n}\n```\n\n## PipedInputStream 和 PipedOutputStream\n\
  \n输出流可以连接到输入流以创建一个管道。输出流是管道的发送端。输入流应该连接到输出流；输入流随后提供写入输出流的任何字节。\n\n通常，数据由一个线程从 `PipedInputStream`\
  \ 对象读取，并由另一个线程写入相应的 `PipedOutputStream`。在单个线程中使用这两个对象是不被推荐的，因为可能会导致死锁。输入流包含一个缓冲区，在限制范围内将读操作与写操作解耦。\n\
  \n#### 构造函数\n\n- `PipedInputStream()`：创建一个尚未连接的 `PipedInputStream`。\n- `PipedInputStream(PipedOutputStream\
  \ src)`：创建一个连接到输出流 `src` 的 `PipedInputStream`。\n- `PipedOutputStream()`：创建一个尚未连接到输入流的\
  \ `PipedOutputStream`。\n- `PipedOutputStream(PipedInputStream snc)`：创建一个连接到指定输入流的\
  \ `PipedOutputStream`。\n\n### 示例 15.19\n\n```java\nimport java.io.*;\nclass TextGenerator\
  \ extends Thread\n{\n    OutputStream out;\n    TextGenerator(OutputStream out)\n\
  \    {\n        this.out = out;\n    }\n    public void run()\n    {\n        try\n\
  \        {\n            try\n            {\n                for(byte b = 65; b<=90;\
  \ b++)\n                    out.write(b);\n            }\n            finally\n\
  \            {\n                out.close();\n            }\n        }\n       \
  \ catch(IOException e) \n        {\n            System.out.println(e);\n       \
  \ }\n    }\n}\nclass Pipe\n{\n    public static void main(String[] args[]) throws\
  \ IOException\n    {\n        PipedOutputStream out = new PipedOutputStream();\n\
  \        PipedInputStream in = new PipedInputStream(out);\n        TextGenerator\
  \ data = new TextGenerator(out);\n        data.start();\n        int ch;\n     \
  \   while((ch = in.read()) != -1)\n            System.out.print((char) ch);\n  \
  \  }\n}\n```\nOutput:\n```\nABCDEFGHIJKLMNOPQRSTUVWXYZ\n```\n\nPipedReader 和 PipedWriter:-\n\
  \n\n\n\n\n它们的功能与 `PipedInputStream` 和 `PipedOutputStream` 相同，唯一的区别在于它们是字符流。\n\n\
  #### 构造函数\n\n- `PipedReader()`\n创建一个尚未连接的 `PipedReader`。\n\n- `PipedReader(PipedWriter\
  \ src)`\n创建一个 `PipedReader`，并使其连接到管道写入器 `src`。\n\n- `PipedWriter()`\n创建一个尚未连接到管道读取器的\
  \ `Piped 写入 writer`。\n\n- `PipedWriter(PipedReader snk)`\n创建一个连接到指定的管道读取器的 `Piped\
  \ 写入 writer`。\n\n### 示例 15.20\n\n```java\nimport java.io.*;\nclass TextGenerator\
  \ extends Thread\n{ \n  Writer out;\n    TextGenerator(Writer out)\n  { \n    this.out\
  \ = out;\n  }\n  public void run()\n  { \n    try {\n      try { \n        for(char\
  \ c = 'a'; c<='z'; c++)\n            out.write(c);\n      }\n      finally {\n \
  \       try {  \n          Thread.sleep(2000);  \n        } \n        catch(Exception\
  \ e) {}\n        System.out.println(\"aaaaaaaaaaaaa\");\n        if(true)\n    \
  \    return;  // IOException: pipe Broken\n      out.close();  //IOException: Write\
  \ end dead\n    }  //OK if thread finishes after closing the pipe\n    }\n    catch(IOException\
  \ e) { System.out.println(e);}\n  }\n}\nclass Pipe2\n{ \n  public static void main\
  \ (String argv[]) throws IOException\n  { \n    PrintStream ps = new PrintStream(System.out);\n\
  \    PipedWriter out = new PipedWriter();\n    PipedReader in = new PipedReader(out);\n\
  \    TextGenerator data = new TextGenerator(out);\n    data.start(); int ch;\n \
  \   while((ch = in.read()) != -1)\n      System.out.print((char) ch);\n  }\n}\n\
  ```\n\n**输出：**\n```\nabcdefghijklmnopqrstuvwxyzaaaaaaaaaaaaa\nException in thread\
  \ \"main\" java.io.IOException: Pipe broken\nat java.io.PipedReader.read(Unknown\
  \ Source)\nat Pipe2.main(Pipe2.java:43)\n```\n\n### 过滤字节流\n\n过滤流仅仅是对底层输入或输出流的包装器，能够透明地提供某些扩展功能。典型的扩展包括缓冲、zip\
  \ 压缩/解压等。过滤字节流有 `FilterInputStream` 和 `FilterOutputStream`。它们的构造函数为：\n\n- `FilterInputStream(InputStream\
  \ in)`\n通过将参数 `in` 赋值给字段 `this.in` 来创建一个 `FilterInputStream`，以便日后使用。\n\n- `FilterOutputStream(OutputStream\
  \ out)`\n创建一个构建在指定的底层输出流之上的输出流过滤器。\n\n这些类中提供的方法与 `InputStream` 和 `OutputStream`\
  \ 中的方法相同。\n\n### 缓冲字节流\n\n对于面向字节的流，缓冲流通过在 I/O 流上挂载内存缓冲区来扩展过滤流类。该缓冲区允许 Java 一次处理多个一个字节的\
  \ I/O 操作，从而提高性能。\n\n由于缓冲区的存在，流的跳过（skip）、标记（mark）和重置（reset）变得可能。缓冲字节流类是 `BufferedInputStream`\
  \ 和 `BufferedOutputStream`。`PushbackInputStream` 也实现了缓冲流。\n\n### BufferedInputStream\n\
  \n缓冲 I/O 是一种常见的性能优化手段。Java 的 `BufferedInputStream` 类允许你将任何 `InputStream` “包装”成缓冲流并实现这种性能提升。\n\
  \n`BufferedInputStream` 有两个构造函数：\n\n- `BufferedInputStream(InputStream in)`\n创建一个\
  \ `BufferedInputStream` 并保存其参数输入流 `in` 以备后用。会创建一个内部缓冲区并存储在 `buf` 中。\n\n- `BufferedInputStream(InputStream\
  \ in, int size)`\n创建一个具有指定缓冲区大小的 `InputStream`，并保存参数输入流 `in` 以备后使用。\n\n缓冲输入流还为支持向后移动提供了基础。除了任何\
  \ Input Stream 中实现的 `read()` 和 `skip()` 方法外，`BufferedInputStream` 还支持 `mark()` 和\
  \ `reset()` 方法。这种支持通过 `markSupported()` 返回 `true` 来体现。\n\n### 示例 15.21\n\n```java\n\
  import java.io.*;\nclass BufferedInputStreamTest\n{\n  public static void main(String\
  \ args[]) throws IOException\n  {\n    FileInputStream fin=new FileInputStream(\"\
  A.txt\");\n    BufferedInputStream b1 = new BufferedInputStream(fin);\n    for(int\
  \ i=1;i<=10;i++)\n      System.out.print((char)b1.read());\n    System.out.println();\n\
  \    if(b1.markSupported())\n    {\n      b1.mark(500);\n      for(int i=1;i<=10;i++)\n\
  \      {\n        System.out.print((char)b1.read());\n      }\n      System.out.println();\n\
  \      b1.reset();\n      for(int i=1;i<=10;i++)\n      {\n        System.out.print((char)b1.read());\n\
  \      }\n    }\n    else\n      System.out.println(\"Marking option is not availabel\"\
  );\n    b1.close();\n    fin.close();\n  }\n}\n```\n\n**输出：**\n```\nmatrix Research\
  \ And\nearch And\n```\n\n**注意：** `mark(32)` 保留了后续读取的 32 个字节的标记（这足够所有访问）。`mark` 的使用限制在缓冲区范围内。\n\
  \n### BufferedOutputStream\n\n与缓冲输入不同，输出缓冲不提供额外功能。它仅用于提高性能。这里是两个构造函数：\n\n- `BufferedOutputStream(OutputStream\
  \ out)`\n创建一个写入到指定的底层输出流的缓冲输出流。它使用大小为 512 字节的缓冲区。\n\n- `BufferedOutputStream(OutputStream\
  \ out, int size)`\n创建一个使用指定缓冲区大小写入到指定的输出流的缓冲输出流。\n\n### 示例 15.22\n\n```java\nimport\
  \ java.io.*;\nclass BufferedOutputStreamTest\n{\n  public static void main(String\
  \ args[]) throws IOException\n  {\n    BufferedOutputStream f = new BufferedOutputStream\
  \ (System.out,100);\n    byte buf[ ] = \"This will be displayed without flush()\\\
  n\".getBytes();\n    f.write(buf);\n    f.write(buf);\n    System.out.println(\"\
  testing...\");\n    f.write(buf);\n    //f.flush(); or\n    //f.close();\n  }\n\
  }\n```\n\n**输出：**\n```\ntesting...\n```\n（注：只有调用 `flush()` 或 `close()`，或者缓冲区满时，内容才会显示在上。）\n\
  \n### BufferedReader\n\n`BufferedReader` 通过缓冲输入提高性能。它有两个构造函数：\n\n- `BufferedReader(Reader\
  \ in)`\n创建一个使用默认大小输入缓冲区的字符输入流。\n\n- `BufferedReader(Reader in, int sz)`\n创建一个使用指定大小输入缓冲区的字符输入流。\n\
  \n### 示例 15.23\n\n```java\nimport java.io.*;\nclass BufferedReaderTest\n{\n  public\
  \ static void main(String args[]) throws IOException\n  {\n    FileReader fr=new\
  \ FileReader(\"A.txt\");\n    BufferedReader b1 = new BufferedReader(fr);\n    for(int\
  \ i=1;i<=10;i++)\n      System.out.print((char)b1.read());\n    System.out.println();\n\
  \    if(b1.markSupported())\n    {\n      b1.mark(5);\n      for(int i=1;i<=10;i++)\n\
  \      {\n        System.out.print((char)b1.read());\n      }\n      System.out.println();\n\
  \      b1.reset();\n      for(int i=1;i<=10;i++)\n      {\n        System.out.print((char)b1.read());\n\
  \      }\n    }\n  }\n}\n```\n\n\n\n[content]\n\n使用 `BufferedWriter` 可以通过减少数据实际物理写入输出流的次数来提高性能。\n\
  \n#### 构造函数\n\n- `BufferedWriter(Writer out)`: 创建一个使用默认大小输出缓冲区的缓冲化字符输出流。\n- `BufferedWriter(Writer\
  \ out, int sz)`: 创建一个使用给定大小输出缓冲区的缓冲化字符输出流。\n\n### 示例 15.24\n\n```java\nimport java.io.*;\n\
  \nclass BufferedWriterTest\n{ \n  public static void main(String args[]) throws\
  \ IOException\n    {\n      BufferedWriter f = new BufferedWriter(new PrintWriter(System.out));\n\
  \      String s  = \"This will not be displayed without flush()\\n\";\n      char\
  \ buf[ ] = new char[s.length()];\n      s.getChars(0,s.length(),buf,0);\n      f.write(buf);\n\
  \      f.write(buf);\n      System.out.println(\"testing...\");\n      f.write(buf);\n\
  \      //f.flush();\n      //f.close();\n    }\n  }\n```\n**输出：**\ntesting...\n\n\
  ---\n\n### 使用字节流处理原始数据类型\n\n基础输入和输出流提供了读/写方法，这些方法只能用于读/写字节或字符。\n\n如果我们想读/写整数和双精度浮等原始数据类型，可以使用过滤器类作为现有输入输出流的封装，以对原始流中的数据进行过滤。\n\
  \n用于创建处理原始数据类型的“数据流”的两个过滤器类是 `DataInputStream` 和 `DataOutputStream`。这些类使用了如下所示的多重继承概念，并实现了父类和接口中包含的所有方法。\n\
  \n![image](img/image011.png)\n\n可以如下创建从文件的输入数据流：\n\n```java\nFileInputStream fis\
  \ = new FileInputStream(infile);\nDataInputStream dis = new DataInputStream(fis);\n\
  ```\n\n这些语句基本上是将 `dis` 封装在 `fis` 之上并将其用作“过滤器”。同样，下面的语句创建了输出数据流 `dos` 并将其封装在输出文件流\
  \ `fos` 之上。\n\n```java\nFileOutputStream fos = new FileOutputStream(outfile);\n\
  DataOutputStream dos = new DataOutputStream(fos);\n```\n\n### 示例 15.25\n\n以下程序演示了原始数据的读取和写入。\n\
  \n```java\nimport java.io.*;\n\nclass ReadWritePrimitive\n{ \n  public static void\
  \ main (String args[]) throws IOException\n    { \n      File primitive = new File(\"\
  prim.dat\");\n      FileOutputStream fos = new FileOutputStream(primitive);\n  \
  \    DataOutputStream dos = new DataOutputStream(fos);\n      dos.writeInt(1999);\n\
  \      dos.writeDouble(222.44);\n      dos.writeBoolean(false);\n      dos.writeChar('X');\n\
  \      dos.close();\n      fos.close();\n      FileInputStream fis = new FileInputStream(primitive);\n\
  \      DataInputStream dis = new DataInputStream(fis);\n      System.out.println(dis.readInt());\n\
  \      System.out.println(dis.readDouble());\n      System.out.println(dis.readBoolean());\n\
  \      System.out.println(dis.readChar());\n      dis.close();\n      fis.close();\n\
  \    }\n  }\n```\n**输出：**\n1999\n222.44\nfalse\nX\n\n---\n\n### 定义流\n\n`System`\
  \ 类包含了三个预定义的流变量——`in`、`out` 和 `err`。这些字段在 `System` 类中声明为 `public` 和 `static`。这意味着它们可以被程序的任何部分使用，而无需引用特定对象。\n\
  \n- `System.out` 指向标准输出流。默认情况下，这是控制台。`System.out` 是一个 `PrintStream` 类型的对象。\n- `System.in`\
  \ 指向标准输入，默认是键盘。`System.in` 是一个 `InputStream` 类型的对象。\n- `System.err` 指向标准错误流，默认也是控制台。`System.err`\
  \ 是一个 `PrintStream` 类型的对象。\n\n这些都是字节流，尽管它们通常被用于从控制台读写字符。如果需要，可以将它们封装在基于字符的流中。\n\n\
  ### InputStreamReader\n\n`InputStreamReader` 是从字节流到字符流的桥梁；它读取字节并使用指定的字符集将其解码为字符。它使用的字符集可以显式指定，也可以接受平台的默认字符集。\n\
  \n**构造函数：**\n- `InputStreamReader(InputStream in)`: 创建一个使用默认字符集的 `InputStreamReader`。\n\
  - `InputStreamReader(InputStream in, String charsetName)`: 创建一个使用命名字符集的 `InputStreamReader`。\n\
  \n### 示例 15.26\n\n```java\nimport java.io.*;\n\nclass InputStreamReaderTest\n{ \n\
  \  public static void main (String argv[]) throws IOException\n    { \n      char\
  \ c;\n      InputStreamReader is = new InputStreamReader(System.in);\n      System.out.println(\"\
  Enter characters, 'q' to quit\");\n      c = (char)is.read();\n      while(c!='q')\n\
  \        { \n          System.out.print(c);\n          c = (char)is.read();\n  \
  \      }\n    }\n  }\n```\n**输出：**\nEnter characters, 'q' to quit\nabcd\nabcd\n\n\
  ### 示例 15.27\n\n对之前的示例进行了修改，利用缓冲来提高性能。\n\n```java\nimport java.io.*;\n\nclass BufferedReaderTest\n\
  { \n  public static void main (String args[]) throws IOException\n    { \n     \
  \ char c;\n      BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n\
  \      System.out.println(\"Enter characters, 'q' to quit\");\n      c = (char)br.read();\n\
  \      while(c!='q')\n        { \n          System.out.print(c);\n          c =\
  \ (char)br.read();\n        }\n    }\n  }\n```\n**输出：**\nEnter characters, 'q' to\
  \ quit\nabcd\nabcd\n\n### 示例 15.28\n\n`InputStreamReader` 不提供 `readLine()` 方法，因此\
  \ `InputStreamReader` 到提供了 `readLine()` 方法的 `BufferedReader`。\n\n```java\nimport\
  \ java.io.*;\n\nclass BufferedReaderTest\n{ \n  public static void main (String\
  \ argv[]) throws IOException\n    { \n      BufferedReader br = new BufferedReader(new\
  \ InputStreamReader(System.in));\n      System.out.println(\"Enter 'stop' to quit\"\
  );\n      String str = br.readLine();\n      while(!str.equals(\"stop\"))\n    \
  \    { \n          System.out.println(\"Your Name:\"+str);\n          str = br.readLine();\n\
  \        }\n    }\n  }\n```\n**输出：**\nEnter 'stop' to quit\nHarry Feat\nYour Name:Harry\
  \ Feat\nstop\n\n### OutputStreamWriter\n\n`OutputStreamWriter` 是从字符流到字节流的桥梁：写入它的字符使用指定的字符集编码为字节。它使用的字符集可以显式指定，也可以接受平台的默认字符集。\n\
  \n**构造函数：**\n- `OutputStreamWriter(OutputStream out)`: 创建使用默认字符编码的 `OutputStream`。\n\
  - `OutputStreamWriter (OutputStream out, String charsetName)`: 创建使用命名字符集的 `OutputStream`。\n\
  \n### 读取控制输入\n\n在 Java 1.0 中，执行控制输入的唯一方法是使用字节流，这种旧代码仍然存在。\n\n今天，使用字节流读取控制输入在技术上可行，但这样做可能需要使用已弃的方法，且这种方法并不推荐。\n\
  \n在 Java 中，控制输入通过读取 `System.in` 实现。为了获得连接控制台的字符流，您将 `System.in` 封装在 `InputStreamReader`\
  \ 对象中，可以进一步封装在 `BufferedReader` 对象中以提高性能。\n\n### 示例 15.29\n\n此示例演示了我们可以直接从 `System.in`\
  \ 读取。\n\n```java\nimport java.io.*;\n\nclass ReadFromConsole\n{ \n  public static\
  \ void main (String arg[]) throws IOException\n    { \n      char c;\n      System.out.println(\"\
  Enter characters, 'q' to quit\");\n      c = (char) System.in.read();\n      while(c!='q')\n\
  \        { \n          System.out.print(c);\n          c = (char) System.in.read();\n\
  \        }\n    }\n  }\n```\n**输出：**\nEnter characters, 'q' to quit\nabcd\nabcd\n\
  xyzq\nxyz\n\n\n\n\n从控制台读取的正确方法是将 `System.in` 封装在 `InputStreamReader` 中，进一步封装在 `BufferedReader`\
  \ 中，以提高性能并一次读取一行。相关的示例在之前与 `InputStreamReader` 类相关的章节已经介绍过。\n\n## 写入控制台输出\n\n控制台输出可以通过\
  \ `print()` 和 `println()` 最容易地实现。这些方法由 `PrintStream` 类定义（`PrintStream` 是 `System.out`\
  \ 所引用对象的类型）。尽管 `System.out` 是一个字节流，但将其用于简单的程序输出仍然是可以接受的。\n\n然而，基于字符的替代方案是正确的选择。因为\
  \ `PrintStream` 是派生自 `OutputStream` 的输出流，它还实现了低级方法 `write()`。因此，可以使用 `write()` 向控制台写入。`PrintStream`\
  \ 定义的 `write()` 的简单形式是：\n\n```java\nvoid write(int byteval)\n```\n\n该方法将 `byteval`\
  \ 指定字节写入流中。尽管 `byteval` 被声明为整数，但只有低 8 位会被写入。\n\n### 示例 15.30\n\n```java\nimport\
  \ java.io.*;\n\nclass WriteTest\n{\n    public static void main (String argv[ ])\
  \ throws IOException\n    {\n      int b;\n      b = 'A';\n      System.out.write(b);\n\
  \      // System.out.flush();to flush\n      System.out.write('\\n');//to flush\n\
  \    }\n}\n```\n\n**输出:**\n```\nA\n```\n\n**注意：** 你通常不会使用 `write()` 来执行控制台输出，因为\
  \ `print()` 和 `println()` 使用起来要简单得多。\n\n## 序列化\n\n序列化是将对象的状态写入字节流的过程。当你想要将对象的状态写入字节流时，这非常有用。当你想要将程序的状态保存到持久化存储区域（如文件）时，这也有用。在稍后的时间，你可以通过反序列化过程来恢复这些对象。\n\
  \n实现 RMI 也需要序列化。RMI 允许一台机器上的 Java 对象调用另一台机器上的 Java 对象的方法。对象可以作为远程方法的参数传递。发送端对对象进行序列化并转换。接收端对其反序列化。\n\
  \n如果你尝试对对象图顶部的对象进行序列化，所有其他引用的对象都将被递归定位并序列化。\n\n同样，在反序列化过程中，所有这些对象及其引用都会被正确地存储。声明为\
  \ `transient` 或 `static` 的变量不会被序列化设施保存。\n\n## Externalizable 接口\n\nJava 用于序列化和反序列化的设施设计得使得保存和恢复对象状态的大部分工作自动完成。\n\
  \n然而，在某些情况下，程序员可能需要控制这些过程。例如，使用压缩或加密技术可能是必要的。`Externalizable` 接口就是为了这些情况设计的。实现 `Externalizable`\
  \ 接口的类也可以被序列化反序列化。\n\n但控制权在用户手中，即用户可以决定序列化反序列化哪些部分。序列化代码写在 `readExternal()` 方法中，反序列化代码写在\
  \ `writeExternal()` 方法中。\n\n### Externalizable 接口中的方法\n\n```java\nvoid readExternal(ObjectInput\
  \ in)\n```\n\n对象实现 `readExternal` 方法，通过调用用于原始类型的 `DataInput` 方法，以及用于对象、字符串和数组的 `readObject`\
  \ 方法来恢复其内容。\n\n```java\nvoid writeExternal(ObjectOutput out)\n```\n\n对象实现 `writeExternal`\
  \ 方法，通过调用用于其原始值的 `DataOutput` 方法，或调用用于对象、字符串和数组的 `ObjectOutput.writeObject` 方法来保存其内容。\n\
  \n## ObjectOutput 接口\n\n`ObjectOutput` 接口扩展了 `DataOutput` 接口并支持对象序列化。除了 `DataOutput`\
  \ 接口定义的方法外，`ObjectOutput` 接口只了一个方法：\n\n```java\nVoid writeObject(Object object)\n\
  ```\n\n用于序列化对象。`ObjectOutput` 接口的所有方法在错误情况下都会抛出 `IOException`。\n\n## ObjectOutputStream\n\
  \n`ObjectOutputStream` 类扩展了 `OutputStream` 类并实现了 `ObjectOutput` 接口。它负责将对象写入流。\n\n\
  #### 构造函数\n\n```java\nObjectOutputStream(OutputStream out)\n```\n\n创建一个写入指定 `OutputStream`\
  \ 的 `ObjectOutputStream`。参数 `out` 是序列化对象将写入的输出流。\n\n## 写入对象的方法\n\n```java\nvoid\
  \ writeObject(Object obj)\n```\n\n将对象写入底层存储或流。\n\n## ObjectInput 接口\n\n`ObjectInput`\
  \ 接口扩展了 `DataInput` 接口。它支持对象序列化。除了 `DataInput` 接口定义的方法外，`ObjectInput` 接口定义了一个方法：\n\
  \n```java\nObject readObject()\n```\n\n用于反序列化对象。\n\n## ObjectInputStream\n\n`ObjectInputStream`\
  \ 类扩展了 `InputStream` 类并实现了 `ObjectInput` 接口。`ObjectInputStream` 负责从流中读取对象。\n\n####\
  \ 构造函数\n\n```java\nObjectInputStream(InputStream in)\n```\n\n创建一个从指定 `InputStream`\
  \ 读取的 `ObjectInputStream`。参数 `in` 是应该从中读取序列化对象的输入流。\n\n反序列化方法为：\n\n```java\nObject\
  \ readObject()\n```\n\n从 `ObjectInputStream` 读取一个对象。\n\n### 示例 15.31\n\n```java\n\
  import java.io.*;\n\nclass SerializationTest\n{\n    public static void main (String\
  \ args[]) throws IOException\n    {\n      try\n      {\n        MyClass object1\
  \ = new MyClass(\"Hello\", 123, 1.3e3);\n        MyClass object2 = new MyClass(\"\
  Hello1\", 1, 2);\n        System.out.println(object1);\n        System.out.println(object2);\n\
  \        FileOutputStream fos = new FileOutputStream(\"serial.dat\");\n        ObjectOutputStream\
  \ oos = new ObjectOutputStream(fos);\n        oos.writeObject(object1);\n      \
  \  oos.writeObject(object2);\n        oos.flush();\n        oos.close();\n     \
  \ }\n      catch(Exception e)\n      {\n        System.out.println(e);\n      }\n\
  \      try\n      {\n        MyClass object3, object4;\n        FileInputStream\
  \ fis = new FileInputStream(\"serial.dat\");\n        ObjectInputStream ois = new\
  \ ObjectInputStream(fis);\n        object3 = (MyClass) ois.readObject();\n     \
  \   object4 = (MyClass) ois.readObject();\n        ois.close();\n        System.out.println(\"\
  After deserialization\");\n        System.out.println(object3);\n        System.out.println(object4);\n\
  \      }\n      catch(Exception e)\n      {\n        System.out.println(e);\n  \
  \    }\n    }\n}\n\nclass MyClass implements Serializable\n{\n    String s;\n  \
  \  int i=100;\n    double d;\n    MyClass(String s, int i, double d)\n    {\n  \
  \    this.s = s;\n      this.i = i;\n      this.d = d;\n    }\n    public String\
  \ toString()\n    {\n      return \"s = \"+ s +\"; i = \"+ i + \" ; d = \" +d;\n\
  \    }\n}\n```\n\n**输出:**\n```\ns = Hello; i = 123 ; d = 1300.0\ns = Hello1; i =\
  \ 1 ; d = 2.0\nAfter deserialization\ns = Hello; i = 123 ; d = 1300.0\ns = Hello1;\
  \ i = 1 ; d = 2.0\n```\n\n**注意：** 我们可以在一个文件中保存多个相同类型的对象，也可以在文件中保存不同类型的对象。\n\n###\
  \ 示例 15.32\n\n此示例演示了 `transient` 和 `static` 变量在序列化过程中不会被持久化。\n\n```java\nimport\
  \ java.io.*;\n\nclass SerializationTest2\n{\n    public static void main (String\
  \ args[]) throws IOException\n    {\n      try\n      {\n        MyClass object1\
  \ = new MyClass(\"Hello\", 123, 1.3e3);\n        MyClass object3 = new MyClass(\"\
  Hello1\", 1, 2);\n        object3.x = 200;\n        A object5 = new A();\n     \
  \   System.out.println(object1);\n        System.out.println(object3);\n       \
  \ System.out.println(object5);\n```\n\n\n\n\n\n```java\nFileOutputStream fos = new\
  \ FileOutputStream(\"serial.dat\");\nObjectOutputStream oos = new ObjectOutputStream(fos);\n\
  oos.writeObject(object1);\noos.writeObject(object3);\noos.writeObject(object5);\n\
  object3.x = 400;\noos.flush();\noos.close();\n}\ncatch(Exception e) {\n    System.out.println(e);\n\
  }\ntry {\n    MyClass object2, object4;\n    A object6;\n    FileInputStream fis\
  \ = new FileInputStream(\"serial.dat\");\n    ObjectInputStream ois = new ObjectInputStream(fis);\n\
  \    object2 = (MyClass) ois.readObject();\n    object4 = (MyClass) ois.readObject();\n\
  \    object6 = (A) ois.readObject();\n    ois.close();\n    fis.close();\n    System.out.println(\"\
  After deserialization\");\n    System.out.println(object2);\n    System.out.println(object4);\n\
  \    System.out.println(object6);\n}\ncatch(Exception e) {\n    System.out.println(e);\n\
  }\n}\n}\nclass MyClass implements Serializable {\n    String s;\n    transient private\
  \ int i=100;\n    public static int x = 10;\n    double d;\n    MyClass(String s,\
  \ int i, double d) {\n        this.s = s;\n        this.i = i;\n        this.d =\
  \ d;\n        x = 100;\n    }\n    public String toString() {\n        return \"\
  s = \" + s + \"; i = \"+ i + \" ;d = \" + d +\"; x = \"+ x;\n    }\n}\nclass A implements\
  \ Serializable {\n    public String toString() {\n        return \"Class A\";\n\
  \    }\n}\n```\n\n### 示例 15.33: 使用 Externalizable\n\n```java\nimport java.io.*;\n\
  class SerializationTest1 {\n    public static void main (String args[]) throws IOException\
  \ {\n        try {\n            MyClass object1 = new MyClass(\"Hello\", 99, 123.45);\n\
  \            System.out.println(object1);\n            FileOutputStream fos = File\
  \ FileOutputStream(\"serial.dat\");\n            ObjectOutputStream oos = new ObjectOutputStream(fos);\n\
  \            System.out.println(\"before writing object\");\n            oos.writeObject(object1);\n\
  \            System.out.println(\"after writing object\");\n            oos.flush();\n\
  \            oos.close();\n        }\n        catch(Exception e) {\n           \
  \ System.out.println(e);\n        }\n        try {\n            MyClass object2;\n\
  \            FileInputStream fis = new FileInputStream(\"serial.dat\");\n      \
  \      ObjectInputStream ois = new ObjectInputStream(fis);\n            System.out.println(\"\
  before reading object\");\n            object2 = (MyClass) ois.readObject();\n \
  \           System.out.println(\"after reading object\");\n            ois.close();\n\
  \            System.out.println(object2);\n        }\n        catch(Exception e)\
  \ {\n            System.out.println(e);\n        }\n    }\n}\nclass MyClass implements\
  \ Serializable {\n    String s;\n    int i=100;\n    double d;\n    public MyClass()\
  \ {}; It is must\n    public MyClass(String s, int i, double d) {\n        this.s\
  \ = s;\n        this.i = i;\n        this.d = d;\n    }\n    public String toString()\
  \ {\n        return \"s = \"+ s +\"; i = \"+ i + \" ;d = \" +d;\n    }\n    public\
  \ void writeExternal(ObjectOutput oos) throws IOException {\n        System.out.println(\"\
  Inside writeExternal\");\n        oos.writeObject(s);\n        oos.writeInt(i);\n\
  \        oos.writeDouble(d);\n    }\n    public void readExternal(ObjectInput ois)\
  \ throws ClassNotFoundException, IOException {\n        System.out.println(\"Inside\
  \ readExternal\");\n        s = (String) ois.readObject();\n        i = ois.readInt();\n\
  \    }\n}\n```\n\n**输出：**\n`s = Hello; i = 99 ;d = 123.45`\nbefore writing object\n\
  after writing object\nbefore reading object\nafter reading object\n`s = Hello; i\
  \ = 99 ;d = 123.45`\n\n**注意：**\n在反序列化期间，对象将使用默认构造函数构造（与 `Serializable` 接口不同），然后进行初始化。状态测试应该在\
  \ `readExternal()` 中进行。同样，在序列化期间，只保存类标识符。任何状态必须在 `writeExternal()` 中显式保存。\n\n# 章节：16\
  \ 章：(Applet)\n\n### 简介\nApplet 是一种设计用于在互联网上传输并由 Internet Explorer 或 Netscape Navigator\
  \ 等兼容 Java 的浏览器在客户端机器上执行的应用程序。Applet 也是 Java 程序，但它们存在（存储）在服务器上。\n\nApplet 无法像独立应用程序那样执行。Applet\
  \ 只能通过像图像或音频文件一样嵌入 HTML 页面中来执行。要运行 applet，我们需要访问一个嵌入了 applet 的 HTML 页面。当网络浏览器下载此类\
  \ HTML 页面时，它会随后加载包含 applet 代码的可执行文件，然后在本地机器上执行它。\n\napplet 到达客户端后，它对资源的访问非常有限。\n\
  \n### Applet 架构\nApplet 与普通程序不同：\n*   Applet 是基于 GUI 的（窗口化）程序\n*   Applet 是事件驱动的\n\
  \n当普通 Java 程序（基于 GUI 的）需要输入时，它会提示用户并调用某些方法，如 `readLine()`，即交互是由程序发起的。这不是 GUI 程序的运行方式。用户发起程序的交互。例如，在文字处理软件中用户通过点击不同的按钮发起操作，从而产生事件并执行相应的代码。\n\
  \nApplet 使用 `awt` 包（抽象窗口工具包）来提供 GUI 并处理事件。`awt` 之所以命名是因为因为它完全依赖底层操作系统的功能。\n\nApplet\
  \ 类似于一组中断服务程序。Applet 等待事件发生。`awt` 通过调用 applet 提供的事件处理器来通知 applet 事件。一旦发生，applet\
  \ 必须采取适当行动并迅速将控制权还给 AWT。这是一个至关重要的点。大多数情况下，我们的 applet 不应该进入长时间保持控制的“模式”。相反，它必须对事件做出特定响应，并将控制权返回给\
  \ AWT 运行系统。\n\n在 applet 需要独立执行重复任务的情况下（例如，在窗口中显示滚动消息），我们必须启动额外的执行线程。\n\n### 编写 Applet\n\
  所有 applet 都是 `Applet` 类的子类。`Applet` 类包含在 `java.applet` 包中。`Applet` 类的结构如下：\n\n`java.lang.Object`\n\
  |\n`java.awt.Component`\n|\n`java.awt.Container`\n|\n`java.awt.Panel`\n|\n`java.applet.Applet`\n\
  \n`Applet` 类提供了 applet 执行的所有必要支持，例如启动和停止。它提供了加载和显示图像的方法。它还为所有的窗口化活动提供了必要的支持。\n\n\
  我们扩展 `Applet` 类的子类必须始终声明为 `public`，因为它是由网络浏览器实例化并执行的。浏览器在实例化 applet 时使用无参数构造函数，因此必须提供具有\
  \ `public` 可见性的无参数构造函数。\n\n\n\n\n建议不要在 `Applet` 类中提供构造函数，因为情况下编译器将提供默认的无参数构造函数。\n\
  \n我们可以利用 `init()` 方法进行初始化。在编写 applet 代码时，我们通常会重写 `Applet` 类的一些方法，这些方法在 applet 执行期间会被自动调用。\n\
  \n重写 `paint()` 方法是非常常见的。`paint()` 方法中的代码主要在 `Applet` 窗口中显示输出。\n\n### 示例 16.1 (App1.java)\n\
  以下程序演示了一个简单的 applet，它只是在窗口内显示“Hello World”。我们在 applet 的 `paint` 方法中绘制/显示任何内容，它都会出现在\
  \ applet 的窗口中。\n\n在接下来的示例中，applet 窗口的背景颜色设置为红色，前景颜色设置为绿色，因此背景将显示为红色，文本“Hello Word”将以绿色显示。\n\
  \n```java\nimport java.awt.*;\nimport java.applet.Applet;\n/*<applet code= \"App1\"\
  \ width =500 height=100></applet>*/\npublic class App1 extends Applet\n{ \n    public\
  \ void init()\n    {\n        setBackground(Color.red);\n        setForeground(Color.green);\n\
  \    }\n    public void paint(Graphics g)\n    { \n      g.drawString(\"Hello World\"\
  ,20,20);\n    }\n}\n```\n\n输出：\n![image](img/image094.png)\n\n### 执行 Applet\nApplet\
  \ 并不是通过基于控制的 Java 运行时解释器执行的。我们有两种方法可以运行 applet。\n\n1. 在兼容 Java 的 Web 浏览器中执行 applet。\n\
  2. 使用 `appletviewer`，例如标准 SDK 工具 `appletviewer`。`appletviewer` 在窗口中执行我们的 applet。这是测试我们\
  \ applet 最快且最简单的方法。\n\n#### 在 浏览器中执行 Applet\n我们需要编写一个短的 HTML 文本文件，其中包含适当的 `APPLET`\
  \ 标签。applet 标签必须包含以下三个属性：\n- `Code`\n- `Width`\n- `Height`\n\n属性 `code` 的值指定包含 applet\
  \ 代码的类名。属性 `width` 和 `height` 分别指定 applet 窗口的宽度和高度。\n\n这里是嵌入了 applet \"App1\" 的\
  \ HTML 文件 `RunApp.Html`。\n\n```html\n<html>\n<head>\n<title>Simple Applet</title>\n\
  </head>\n<body>\n<h1>Simple “Hello World” Application </h1>\n<applet code= “App1”\
  \ width =500 height=100>\n</applet>\n</body>\n</html>\n```\n\n你可以通过在 Web 浏览器中打开\
  \ `RunApp.html` 文件来执行 applet。该文件可以在本地文件系统上，也可以从 Web 服务器加载。\n\n#### 使用 `appletviewer`\
  \ 执行 Applet\n然而，存在一种更方便的方法可以让我们加速测试。只需在你的 Java 源代码文件中包含一个包含该 `APPLET` 标签的注释即可。通过这种方式，我们的代码就包含了必要的\
  \ HTML 语句的原型文档，我们只需通过启动 `appletviewer` 并传入 Java 源代码文件即可测试编译后的输出。如果使用这种方法，那么在编译后我们可以如下所示执行\
  \ applet：\n\n```bash\nappletviewer SimpleApplet.Java\n```\n\n### Applet 生命周期方法\n\
  Applet 重写了一组方法，这些方法提供了浏览器或 `appletviewer` 与 applet 交互并控制其执行的基本机制。\n\n这些方法也被称为生命周期方法，因为浏览器或\
  \ applet 查看器会在 applet 生命期的不同阶段自动调用它们。总共有五个生命周期方法：\n- `public void init()`\n- `public\
  \ void start()`\n- `public void stop()`\n- `public void destroy()`\n- `public void\
  \ paint (Graphics g)`\n\n这些方法中的四个方法：`init()`、`start()`、`stop()` 和 `destroy()` 定义在\
  \ `applet` 类中。\n\n`paint()` 由 `awt.Component` 类定义，并提供了所有这些方法的默认实现。Applet 不需要重写它们未使用的方法。然而，非常简单的\
  \ applet 将不需要定义它们。\n\n#### Applet 的初始化与终止\n当 applet 开始时，将按顺序调用以下方法：\n1. `init()`\n\
  2. `start()`\n3. `paint()`\n\n当 applet  终止时，会发生以下方法调用序列：\n1. `stop()`\n2. `destroy()`\n\
  \n#### `init()` 方法\n这是第一个被调用的方法。在这里我们应该初始化变量并编写其他初始化活动的代码。该方法在 applet 的生命周期内仅在实例化后立即被调用一次。\n\
  \n#### `start()` 方法\n`start()` 方法在 `init()` 之后被调用。它还用于在 applet 停止后重启。`init()` 在第一次加载\
  \ applet 时被调用一次，而 `start()` 在每次 applet 的 HTML 文档显示在屏幕上时被调用。因此，如果用户离开网页并返回，applet\
  \ 将从 `start()` 恢复执行。\n\n#### `paint()` 方法\n`paint()` 在 applet 开始时的 `init()` 和 `start()`\
  \ 方法之后被调用。每当 applet 的输出需要重绘时，`paint()` 方法也会被调用。这种情况可能由于多种原因引起。例如，运行 applet 的窗口被覆盖，或者\
  \ applet 被最小化后恢复。\n\n#### `stop()` 方法\n`stop()` 方法在浏览器离开包含 applet 的页面时被调用。我们使用 `stop()`\
  \ 暂停在 applet 不可见运行时需要的线程。我们可以在 `start()` 中重启它们。\n\n#### `destroy()` 方法\n`destroy()`\
  \ 方法在环境确定需要从内存中移除 applet 时被调用。此时，我们应该释放 applet 可能使用的任何资源。\n\n### 示例 16.2\n一个简单的\
  \ applet，设置背景颜色为青色，前景颜色为红色，并显示说明 `init()`、`start()` 和 `paint()` 方法调用顺序的消息。\n\n```java\n\
  import java.awt.*;\nimport java.applet.*;\n/*<applet code= \"App2\" width =500 height=100></applet>*/\n\
  public class App2 extends Applet\n{ \n    String msg=\"\";\n    public void init()\n\
  \    {\n        System.out.println(\"Inside init\");\n        setBackground(Color.cyan);\n\
  \        setForeground(Color.red);\n        msg = \"Inside init—\";\n    }\n   \
  \ public void start()\n    {\n        System.out.println(\"Inside start\");\n  \
  \      msg += \"Inside start—\";\n    }\n    public void stop()\n    {\n       \
  \ System.out.println(\"Inside Stop\");\n        msg += \"Inside stop—\";\n    }\n\
  \    public void paint (Graphics g)\n    {\n        System.out.println(\"Inside\
  \ paint\");\n        msg += \"Inside paint—\";\n        g.drawString(msg,10,30);\n\
  \    }\n    public void destroy()\n    {\n        System.out.println(\"Inside destroy\"\
  );\n    }\n}\n```\n\n### 动态 Applet\nApplet 窗口中显示的输出可以是动态的。例如，我们可以显示一个移动的横幅。Applet\
  \ 还可以用于诸如通过服务器获取显示与板球比赛相关的得分和其他统计数据；显示股票价格等应用程序。\n\n### 示例 16.3\n以下示例显示了一个移动的横幅。它演示了使用\
  \ `repaint()` 方法来刷新显示。该 applet 在 applet 窗口中从右向左滚动消息。\n\n由于消息滚动是一项重复性任务，它是由 applet\
  \ 在启动时创建的独立线程执行的。该程序还演示了可以在 `stop()` 方法中释放资源并在 `start()` 方法中重新获取。\n\n```java\nimport\
  \ java.awt.*;\nimport java.applet.*;\n```\n\n\n\n\n```java\n/*<applet code=\"App3\"\
  \ width=500 height=100></applet>*/\n\npublic class App3 extends Applet implements\
  \ Runnable {\n    String msg=\"A Simple Moving Banner.\" ;\n    Thread t = null;\n\
  \    boolean stopFlag;\n\n    public void init ()\n    { \n      setBackground(Color.cyan);\n\
  \      setForeground(Color.red);\n    }\n\n    public void start()\n    { \n   \
  \   t=new Thread(this);\n      stopFlag = false ;\n      t.start ();\n    }\n\n\
  \    public void stop()\n    { \n      stopFlag=true;\n      t=null;\n    }\n\n\
  \    public void paint(Graphics g)\n    { \n      g.drawString(msg,50,30);\n   \
  \ }\n\n    public void run()\n    {  \n      for (;;)\n      {\n        repaint();\n\
  \        try\n        {\n          Thread.sleep(250);\n        }\n        catch(InterruptedException\
  \ e)\n        {\n          System.out.println(e);\n        }\n        msg = msg.substring\
  \ (1) + msg.charAt(0);\n        if (stopFlag)\n          break;\n      }\n    }\n\
  }\n```\n\n输出：\n\n![image](img/image037.png)\n\n### 使用状态窗口\n\n除了在窗口中显示信息外，applet\
  \ 还可以向运行其的浏览器或 `appletviewer` 的状态窗口输出消息。\n\n要做到这一点，请调用 `showStatus()` 方法并传入我们想要显示的字符串。状态窗口是向用户提供关于\
  \ applet 正在发生情况的反馈、建议选项或可能报告某些类型的错误的好地方。\n\n状态窗口也是一个极佳的调试辅助（帮助），因为它为我们提供了一种输出关于\
  \ applet 信息的简单方法。\n\n示例 16.4：下面的示例演示了如何使用状态窗口。\n\n```java\nimport java.awt.*;\n\
  import java.applet.*;\n/*<applet code=\"App4\" width=500 height=100></applet>*/\n\
  public class App4 extends Applet {\n    public void init( )\n    { \n      setBackground(Color.cyan);\n\
  \    }\n    public void paint(Graphics g)\n    { \n      g.drawString(\"This is\
  \ in the applet window\",10,20);\n      showStatus(\"This is shown in the status\
  \ window\");\n    }\n}\n```\n\n输出：\n\n![image](img/image055.png)\n\n### HTML 的 APPLET\
  \ 标签\n\n`APPLET` 标签用于从 HTML 文档和 `appletviewer` 启动 applet。\n\n`appletviewer` 会在独立的窗口中执行它找到的每个\
  \ `APPLET` 标签；而像 Netscape Navigator 和 Internet Explorer 这样的网络浏览器则允许在单个页面上运行多个 applet。\n\
  \n标准 `APPLET` 标签的语法为：\n\n```html\n< APPLET\nCODE=applet class name\nCODEBASE=codebase\
  \ URL\nALT=alternate Text,\nNAME=appletInstancename\nWIDTH=pixels\nHEIGHT=pixels\n\
  ALIGN=alignment\nVSPACE=vertical space in pixels\nHSPACE=horizontal space in pixels\n\
  >\n\n<PARAM NAME=attributeName-1  VALUE=Attribute Value-1>\n<PARAM  NAME=attributeName-2\
  \  VALUE=Attribute Value-2>\n<PARAM  NAME=attributeName-N  VALUE=Attribute Value-N>\n\
  </APPLET>\n```\n\n- **CODE**: `CODE` 是一个必需属性，用于提供包含 applet 编译后的类文件的文件名称。该文件相对于 applet\
  \ 的 `CODEBASE` URL（即 html 文件文件所在的目录）。\n- **CODEBASE**: `CODEBASE` 是一个可选属性，用于指定 applet\
  \ 代码的基 URL，即将在其中搜索 applet 可执行类文件（由 `CODE` 标签指定）的目录。如果未指定此属性，则使用 HTML 文档的 URL。\n\
  - **ALT**: `ALT` 标签是一个可选属性，用于指定当浏览器理解 `APPLET` 标签但无法运行 Java 时应该 显示的短文本消息（备用文本）。这与我们为不支持\
  \ applet 的浏览器提供的备用 HTML 是不同的。\n- **NAME**: `NAME` 是一个可选属性，用于为 applet 实例指定名称。applet\
  \ 必须命名，以便同一页面上的其他 applet 能够通过名称找到它们并与之通信。要通过名称获取 applet，请使用 `getApplet()`，该方法由 `Applet`\
  \ 接口定义。\n- **WIDTH and HEIGHT**: applet 显示区域以像素为单位的尺寸。\n- **ALIGN**: `ALIGN` 是一个可选属性，用于指定\
  \ applet 的对齐方式。该属性的处理方式与 HTML `IMG` 标签相同，取值为：`LEFT`、`RIGHT`、`TOP`、`BOTTOM`、`MIDDLE`、`BASELINE`、`TEXTTOP`、`ABSMIDDLE`\
  \ 以及 `ABSBOTTOM`。\n- **VSPACE and HSPACE**: 这些属性可选的。`VSPACE` 指定 applet 上下方的空间（像素）。`HSPACE`\
  \ 指定 applet 左右两侧的空间（像素）。它们的处理方式与 `IMG` 标签的 `VSPACE` 和 `HSPACE` 属性相同。\n\n#### PARAM\
  \ 标签\n\n`PARAM` 标签允许我们在 HTML 页面中指定 applet 特定的参数。applet 通过 `getParameter()` 方法访问这些属性。`PARAM`\
  \ 标签有两个属性：`NAME` 和 `VALUE`。\n\n示例 16.5：下面的示例演示了如何从 HTML 页面向 Applet 传递参数。\n\n```java\n\
  import java.awt.*;\nimport java.applet.*;\n/*<applet code=\"App5\" width=500 height=100></applet>*/\n\
  public class App5 extends Applet {\n    String fName;\n    int fSize;\n    public\
  \ void init ()\n    {\n      fName = getParameter(\"fontName\");\n      if (fName\
  \ == null)\n        fName = \"Courier\";\n      fSize = Integer.parseInt(getParameter(\"\
  fontSize\"));\n      Font f1= new Font(fName, Font.PLAIN, fSize);\n      setFont(f1);\n\
  \    }\n    public void paint (Graphics g)\n    { \n      g.drawString(\"Font Name\
  \ : \" + fName, 0, 25 );\n      g.drawString(\"Font Size : \" + fSize, 0, 50 );\n\
  \      g.drawString(\"Hello world\", 0,75);\n    }\n}\n```\n\n输出：\n\n![image](img/image91.png)\n\
  \n### 获取 DocumentBase 和 CodeBase\n\n通常，我们会创建需要显式加载媒体和文本的 applet。Java 允许 applet 从启动\
  \ HTML 文件的目录（文档基）以及加载 applet 类文件的目录（代码基）加载数据。\n\n这些目录以 `URL` 对象的形式返回。它们可以与要加载的文件字符串拼接。要加载另一个文件，我们将使用\
  \ `Applet` 接口定义的 `showDocument()` 方法。\n\n示例 16.6：下面的示例演示了如何在 applet 代码中获取文档基和代码基。\n\
  \nApp6.java\n```java\nimport java.awt.*;\nimport java.applet.*;\nimport java.net.URL;\n\
  public class App6 extends Applet {\n    public void paint (Graphics g)\n    {\n\
  \      URL u1 = getCodeBase( );\n      g.drawString (\"Code base:-\" + u1, 10,20);\n\
  \      URL u2 = getDocumentBase();\n      g.drawString(\"Document base:-\"+u2, 10,40);\n\
  \    }\n}\n```\n\nApp6.html\n```html\n<html>\n  <body>\n    <applet code=\"App6\"\
  \ width=500 height=200></applet>\n  </body>\n</html>\n```\n\n输出：\n\nAppletContext\
  \ 和 Show Document():\n\n`AppContext` 是一个接口，允许我们从 applet 的执行环境中获取信息。当前执行的 applet\
  \ 的上下文通过调用 `applet` 类定义的 `getAppletContext()` 方法获取。\n\n\n\n\n在 applet 中，一旦我们获取了\
  \ applet 的上下文（context），就可以调用 `showDocument()` 方法将另一个文档显示在视图中。该方法没有返回值，如果执行失败也不会抛出异常，因此请谨慎使用。这里有两个\
  \ `showDocument()` 方法。\n\n```\nvoid ShowDocument(URL url)\n```\n用给定的 `URL` 替换当前查看的\
  \ Web 页面。\n\n```\nvoid ShowDocument (URL url, String where)\n```\n在浏览器窗口内的指定位置显示指定的文档。“where”的有效参数有：\n\
  \n- `_self`（在当前帧中显示）\n- `_parent`（在父帧中显示）\n- `_top`（在最顶层帧中显示），以及\n- `_blank`（在新浏览器窗口中显示）\n\
  \n### 示例 16.7\n以下 applet 演示了 `Applet Context` 和 `showDocument()` 的用法。执行时，它获取当前的\
  \ applet 上下文，并使用该上下文将控制权转移到名为 `A.html` 的文件。该文件必须与 applet 位于同一目录下。`Test.html` 可以包含你喜欢的任何有效超文本。\n\
  \n```\n1. import java.awt.*;\n2. import java.applet.*;\n3. import java.net.*;\n\
  4. public class App7 extends Applet\n5. { \n6.   AppletContext ac;\n7.   URL u1;\n\
  8.   public void init()\n9.   {\n10.      setBackground(Color.cyan);\n11.     }\n\
  12.  public void start( )\n13.  {\n14.     ac = getAppletContext();\n15.     u1\
  \ = getCodeBase();\n16.     try\n17.     {\n18.      Thread.sleep(3000);\n19.  \
  \    ac.showDocument(new URL(u1 + \"A.html\"),\"_blank\");\n20.     }\n21.     catch(MalformedURLException\
  \ e)\n22.     { \n23.      showStatus(\"Invalid URL\");\n24.      e.printStackTrace()\
  \ ;\n25.     }\n26.     catch(InterruptedException e)\n27.     { \n28.      showStatus(\"\
  Invalid URL\");\n29.      e.printStackTrace () ;\n30.     }\n31.  }\n32.  public\
  \ void paint (Graphics g)\n33.  {\n34.    g.drawString(u1+\"A.html\",20,20);\n35.\
  \    try\n36.     {\n37.      Thread.sleep(3000);\n38.     }\n39.     catch(InterruptedException\
  \ e)\n40.     {\n41.      System.out.println(e);\n42.     }\n43. }\n```\n\n```\n\
  App7.html\n1. <html>\n2.   <head>\n3.     <Title>Applet Context</Title>\n4.   </head>\n\
  5.   <body>\n6.     <applet code=\"App7\" width=200 height=200></applet>\n7.   </body>\n\
  8. </html>\n```\n\n```\nA.html\n1. <html>\n2.   <head>\n3.     <title>New Page</title>\n\
  4.   </head>\n5.   <body bgcolor=blue text=red>\n6.     <h1>matrix</h1>\n7.   </body>\n\
  8. </html>\n```\n\n### 示例 16.8\n```\n1. import java.applet.*;\n2. import java.awt.*;\n\
  3. import java.awt.event.*;\n4. /*<applet code=\"CopyApp\" width=500 height=200></applet*/\n\
  5. public class CopyApp extends Applet implements ActionListener\n6. {\n7.   TextField\
  \ tf1,tf2;\n8.   Button b1;\n9.   public void init()\n10.  {\n11.     setForeground(Color.red);\n\
  12.     Font f1=new Font(\"Arial\", Font.BOLD+Font.ITALIC,20);\n13.     tf1=new\
  \ TextField(8);\n14.     tf2=new TextField(8);\n15.     tf1.setFont(f1);\n16.  \
  \   tf2.setFont(f1);\n17.     b1=new Button(\"Copy\");\n18.     b1.addActionListener(this);\n\
  19.     b1.setFont(f1);\n20.     add(tf1);\n21.     add(tf2);\n22.     add(b1);\n\
  23.  }\n24.  public void paint(Graphics g)\n25.  {\n26.     g.drawString(\"Matrix\"\
  ,0,150);\n27.  }\n28.  public void actionPerformed(ActionEvent ae)\n29.  {\n30.\
  \     String s1=tf1.getText();\n31.     tf2.setText(s1);\n32.  }\n33. }\n```\n输出：\n\
  ![image](img/image010.png)\n\n### 示例 16.9 使用 Applet 计算两个数之和\n```\n1. import java.applet.*;\n\
  2. import java.awt.*;\n3. import java.awt.event.*;\n4. /*<applet code = \"SumApplet\"\
  \ width=400 height=400></applet> */\n5. public class SumApplet extends Applet implements\
  \ ActionListener\n6. {\n7.   TextField tf1,tf2,tf3;\n8.   Label l1,l2,l3;\n9.  \
  \ Button b1;\n10.  public void init()\n11.  {\n12.     setLayout(new GridLayout(4,2));\n\
  13.     l1 = new Label(\"No. 1\");\n14.     l2 = new Label(\"No. 2\");\n15.    \
  \ l3 = new Label(\"Result\");\n16.     tf1 = new TextField(8);\n17.     tf2 = new\
  \ TextField(8);\n18.     tf3 = new TextField(8);\n19.     b1 = new Button(\"Sum\"\
  );\n20.     b1.addActionListener(this);\n21.     add(l1);add(tf1);\n22.     add(l2);add(tf2);\n\
  23.     add(l3);add(tf3);\n24.  }\n```\n\n\n\n\n# 面板 (Panels)\n\n面板（Panels）就像应用程序组件和窗口一样，包含其他组件，如按钮、`canvas`、复选框、滚动条（`scrollbars`）、`scrollpanes`、文本区域、文本字段和其他面板。\n\
  \n复杂的 GUI 有时具有非常复杂的面板包含层级结构，即面板嵌套面板，以此类推，贯穿许多层包含。\n\n由于容器也是组件，因此由于继承关系，组件可用的方法也适用于容器。\n\
  \n容器最常用的方法是 `add()` 方法，通过该方法将组件添加到容器中，其通用形式如下：\n\n```java\nvoid add (Component comp);\n\
  ```\n\n所有组件都是 `component` 类的子类，因此任何组件都可以使用 `add()` 方法被添加到容器中。\n\n## 布局管理器 (Layout\
  \ Manager)\n\n在向容器中添加组件时，一个重要问题涉及到组件的位置和大小。组件的位置可以通过两种方式指定：\n\n(i) 绝对定位。\n\n(ii)\
  \ 相对定位。\n\n在绝对定位中，我们指定组件应该被添加的确切位置。这种方法可以为我们提供精细的控制，如果我们仅为单个平台设计 GUI，这可能是最佳选择。\n\
  \n例如，通过指定组件左上角的坐标，可以将组件添加到容器水平方向的中间。\n\n我们可以根据容器的宽度和组件的宽度计算这些坐标。但如果容器宽度发生变化或组件尺寸发生变化，组件将不会留在中间。\n\
  \n另一种方法是相对定位，它可能无法允许我们指定组件的确切位置，但在我们希望组件始终位于容器水平方向的中间的情况下，这种方法可能更适用。\n\n我们可以通过指定组件的相对位置，如\
  \ `left`（左）、`right`（右）、`center`（居中）等，来实现这一点。在文字处理器中，将文档标题居中是非常常见的。即使页面宽度发生变化，标题也会保持居中，这就是相对定位的一个例子。\n\
  \n在 Java 中，可以使用绝对定位，但并不建议这样做。`AWT` 设计初衷是使用相对定位。我们可以使用相对规格来指定组件布局，例如：组件将添加到上一个组件的右侧、组件将添加到其他某些组件的下方、组件将出现在顶部、组件的大小将是容器宽度的\
  \ `¼^(th)` 等。即使在不知道组件尺寸的情况下，这些规格也有用。\n\nJava 鼓励使用相对定位，因为它是平台无关的，相同的 GUI 应该能够在各种平台上运行而无需修改。\n\
  \n称为布局管理器（layout managers）的内置 Java 类处理了将相对位置映射到实际/物理位置的任务。Java 支持许多类型的布局管理器，我们将讨论以下布局管理器：\n\
  \n1. `FlowLayout`\n2. `GridLayout`\n3. `BorderLayout`\n4. `CardLayout`\n5. `GridBagLayout`\n\
  \n### 使用布局管理器时的两个观察\n\n- 我们不再需要承担指定每个组件精确位置和尺寸的负担。\n- 我们不再拥有指定每个组件确切位置和尺寸的权力。\n\n\
  ## 为什么 Java 使用布局管理器？\n\n原因有两个：\n\n1. 理论上来说，精确布局（即以像素为指定每个组件的大小和位置）是一项重复且经常执行的任务；因此，根据面向对象编程（OOP）的功能，布局功能应该被封装在一个或多个类中，以自动化该任务。显然，布局管理器消除了大量的繁琐开发。许多程序员起初并不喜欢布局管理器的想法，但随着繁琐选择的消除，他们变得越来越欣赏它们。\n\
  \n2. 使用布局管理器的实际原因源于 Java 的平台无关性。在 Java 中，`AWT` 组件的行为借自运行 `JVM` 的底层硬件的窗口系统。因此，在 Macintosh\
  \ 上，`AWT` 按钮就像任何其他 Mac 按钮一样；在 Motif 平台上，Java 按钮看起来就像任何其他 Motif 按钮，以此类推。这里的问题在于，按钮和其他组件在不同平台上实例化时具有不同的尺寸。\n\
  \n如果 Java 鼓励精确的像素级缩放和定位，将有很多 Java GUI 在其原始平台上看起来精美，但在其他平台上看起来很糟糕甚至无法使用。\n\n如上所述，布局管理器通过使用相对定位解决了这一问题。\n\
  \n## 布局策略 (Layout policy)\n\n每个 Java 组件都有首选尺寸（preferred size）。首选尺寸表示了在不与布局管理器冲突的情况下，组件希望是多大。首选尺寸通常是能够以视觉上有意义的方式渲染组件所需的最小尺寸，例如，按钮的首选尺寸即是其标签文本的大小，加上文本周围的一小圈空白边框，再加上标记按钮边界的阴影装饰，因此按钮的首选尺寸是“恰好足够”。首选尺寸取决于平台，因为组件的边界装饰随系统而异。\n\
  \n当布局管理器布局其容器的子组件时，它必须平衡两个考虑因素：\n\n(i) 布局策略和\n(ii) 每个组件的首选尺寸\n\n首要任务是执行布局策略。如果尊重组件的首选尺寸意味着违反布局策略，那么布局管理器将覆盖组件的首选尺寸。理解布局管理器意味着理解它将组件放置在何处，以及它将如何处理组件的首选尺寸。\n\
  \n### 1. FlowLayout\n\n流式布局管理器的功能封装在 `java.awt.FlowLayout` 类中。\n\n流式布局管理器将组件按水平行排列。它是面板和应用程序组件的默认布局管理器类型。\n\
  \n流式布局将尽可能多的组件放入第一行，并将其他组件移动到第二行。如果第二行没有留出空间，组件将移动到第三行，依此类推。这与在文档中输入文字非常。当我们到达当前行的末尾时，下一个单词将移动到下一行，依此类推。如果我们更改文档的宽度或高度，整个文档将重新格式化。组件始终按照它们被添加到容器的顺序从左到右出现。\n\
  \n默认情况下，流式布局在水平和垂直方向的组件之间留有五个像素的间隙。这种默认值可以通过调用 `FlowLayout` 构造函数的重载版本并传入所需的水平和垂直间隙来更改。在每一行中，组件均匀分布，并且组件簇居中。簇的对齐（有时称为“对齐”）可以通过向流式布局构造函数传递参数来控制。可能值为：\n\
  \n- `FlowLayout.LEFT`\n- `FlowLayout.CENTER`\n- `FlowLayout.RIGHT`\n\n示例 17.1:\n\
  \n```java\nimport java.awt.*;\nclass MyFrame {\n    public static void main(String\
  \ args[ ]) {\n        Frame f=new Frame( );\n        FlowLayout flow=new FlowLayout();\n\
  \        f.setLayout(flow);\n        Label l1 = new Label(\"Name : \");\n      \
  \  f.add(l1);\n        TextField tf1=new TextField(\"Matrix\");\n        f.add(tf1);\n\
  \        tf1.setBackground(Color.green);\n        tf1.setForeground(Color.red);\n\
  \        Button b1 = new Button(\"ok\");\n        Font f1 = new Font(\"Arial\",\
  \ Font.BOLD, 24);\n        b1.setFont(f1); \n        f.add(b1);\n        f.setSize(500,100);\n\
  \        f.setVisible(true);\n    }\n}\n```\n\n\n\n\n\n注意:-如果我们缩小上述窗口的大小，且三个组件无法在单行内容纳，则组件将从最后一个组件开始移动到下一行。\n\
  \n输出：\n\n![image](img/image082.png)\n\n### 示例 17.2\n\n```java\nimport java.awt.*;\n\
