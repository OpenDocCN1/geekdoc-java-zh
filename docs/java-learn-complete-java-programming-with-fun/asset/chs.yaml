  \ | `public String(String str)` | 初始化新创建的 `String` 对象，使其表示与参数相同的字符序列；换句话之，新创建的字符串是参数字符串的拷贝。`String\
  \ s1 = new String(\"Matrix\"); String s2 = new String(s1);` 字符串 `s2` 是字符串 `s1` 的拷贝。虽然内容相同，但\
  \ `s1` 和 `s2` 指向不同的字符串对象。 |\n| 3 | `public String(char ch[])` | 分配一个新的 `String`，使其表示字符数组参数当前包含的字符序列。`char\
