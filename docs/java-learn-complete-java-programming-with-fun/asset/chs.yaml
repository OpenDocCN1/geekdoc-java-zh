  \ 事件简介\n\n### 简介\n\n当一个普通程序（非 GUI）需要输入时，它会提示用户并调用某些方法，例如 `readline()`。对于 GUI 程序，用户是通过点击不同的按钮来触发动作的。\n\
  \n| 接口 | 事件（方法） | 类 | 方法 |\n| :--- | :--- | :--- | :--- |\n| `ActionListener` |\
  \ `actionPerformed()` | `ActionEvent` | `getSource()` |\n| `ItemListener` | `itemStateChanged()`\
  \ | `ItemEvent` | `getItem()` |\n| `AdjustmentListener` | `adjustmentValueChanged()`\
  \ | `AdjustmentEvent` | `getAdjustable()` |\n| `MouseListener` | `mouseEntered``mouseExited``mouseClicked``mouseReleased`\
  \ | `MouseEvent` | `getX()``getY()``getPoint()``getClickCount()``getButton()``getModifiers()``getModifiersText()`\
  \ |\n| `MouseMotionListener` | `mouseMoved``mouseDragged` | `MouseEvent` | 同上 |\n\
  | `KeyListener` | `keyTyped``keyPressed``keyReleased` | `KeyEvent` | `getKeyChar()``getKeyCode()`\
  \ |\n| `FocusListener` | `focusGained``focusLost` | `FocusEvent` | `getSource()`\
  \ |\n| `WindowListener` | `windowOpened``windowClosing``windowClosed``windowActivated``windowDeactivated``windowIconified``windowIcon`\
  \ | `WindowEvent` | `getWindow()` |\n\nJava 使用委托模型进行事件处理。在委托模型中，可以告诉组件在生成特定类型的事件时通知哪个对象。如果组件对某种事件不感兴趣，则该类型的事件将不会传递。委托模型基于以下核心概念：\n\
  \n- 事件类。\n- 事件监听器。\n- 适配器。\n\n### 事件类：\n\n点击按钮会导致产生事件。事件包含大量相关信息，如时间、生成事件的组件、点击发生点的坐标等。\n\
  \n这些信息被放在事件类中。该概念类似于异常处理。每当发生异常时，都会创建一个适当异常类的对象，并将所有异常信息放入该对象中。\n\n### 事件监听器：\n\n\
  事件监听器负责在事件发生时采取适当行动。事件监听器是组件委托处理特定类型事件任务的对象。\n\n\n\n\n\n当组件接收到输入时，会构造一个相应类型的事件，然后该事件将作为参数传递给监听器上的某个方法调用。监听器必须实现包含该事件处理方法的接口。\n\
  \n我们可以将事件监听器与处理异常的 `catch` 块进行比较。我们需要为要处理的异常提供一个相应的 `catch` 块。同样地，如果我们想处理由某个组件生成的事件，我们需要提供相应的监听器。\n\
  \n监听器与组件相关联。不同的事件有不同的监听器。当事件发生时，会调用相应的监听器方法，并将事件对象作为参数传递。\n\n### 适配器 (Adapters)\n\
  \n语言中定义的监听器仅为接口。我们需要提供相应监听器的实现。某些监听器具有 2 个或更多方法。\n\n要实现一个具有多个方法的监听器，即使只对其中一个方法感兴趣，也需要提供所有方法的实现。适配器类提供了这一解决方案。\n\
  \n适配器类提供了监听器所有方法的空实现（dummy implementation），这有助于减少编程工作。如果我们只想使用监听器类的一个方法，只需只需扩展适配器类并重写所需的方法。\n\
  \n### 事件层次结构 (Event hierarchy)\n\nAWT 有一个定义良好的事件层次结构。通常，事件层次结构中的叶子节点表示实际事件。非叶子类作为基类并封装。AWT\
  \ 事件层次结构如图所示。\n\n![image](img/image14.png)\n\n#### java.util.event.Object 类\n\n\
  这是所有事件类的顶级父类。它是一个非常通用的类，只有一个感兴趣的方法，返回产生事件的对象。\n\n```\nObject source()\n```\n\n####\
  \ java.awt.AWTEvent 类\n\n事件对象的子类是 `java.awt.AWTEvent`。同样，只有一个感兴趣的方法，返回事件的 ID。\n\n\
  ```\nint getID()\n```\n\n`java.awt.AWTEvent` 的子类表示由各种 AWT 组件生成的各种事件类型，并包含触发事件的所有必要信息。例如，`MouseEvent`\
  \ 代表可能性：`MOUSE_CLICKED`、`MOUSE_DRAGGED` 等。这些事件类型实际上由组件的激活触发：\n\n1. `ActionEvent`：在按钮点击、双击列表时生成。\n\
  2. `AdjustmentEvent`：当滚动条的值改变时生成。\n3. `ContainerEvent`：当组件添加到容器或从容器中移除时生成。\n4. `FocusEvent`：当组件获得或失去焦点时生成。\n\
  5. `ItemEvent`：当从列表、选择框或复选框选择或取消选择时生成。\n6. `KeyEvent`：由键盘活动生成。\n7. `MouseEvent`：由鼠标活动生成。\n\
  8. `MouseWheelEvent`：当鼠标轮旋转时生成。\n9. `WindowEvent`：由窗口活动生成（如最小化或还原）。\n10. `WindowEvent`：当文本组件被修改时生成。\n\
  \n#### java.awt.event 包\n\n该包提供了处理由 AWT 组件触发的不同类型事件的接口和类。该包定义了事件和监听器，监听器与事件源注册以接收有关特定类型事件的通知。\n\
  \n### 事件监听器接口 (Event Listener Interfaces)\n\n每个事件类都有相应的监听器接口并定义了一个或多个方法。常用的监听器接口在以下章节中描述。\n\
  \n#### ActionListener 接口\n\n这是接收动作事件的监听器接口。对动作事件感兴趣的类实现此接口，并使用组件的 `addActionListener()`\
  \ 方法注册。当动作事件发生时，会调用监听器的 `actionPerformed()` 方法，其签名为：\n\n| Method | Description |\n\
  | :--- | :--- |\n| `void actionPerformed (ActionEvent e)` | 当动作发生时调用。 |\n\n####\
  \ AdjustmentListener 接口\n\n这是接收调整事件的监听器接口。\n\n| Method | Description |\n| :--- |\
  \ :--- |\n| `void adjustmentValueChanged (Adjustment e)` | 当滑块/滑动条的值改变时调用。 |\n\n\
  #### ContainerListener 接口\n\n这是当组件添加到容器或从容器中移除时接收事件的监听器接口。\n\n| Method | Description\
  \ |\n| :--- | :--- |\n| `void componentAdded (containerEvent e)` | 当组件添加到容器时调用。\
  \ |\n| `void componentRemoved (containerEvent e)` | 当组件从容器中移除时调用。 |\n\n#### FocusListener\
  \ 接口\n\n这是当组件获得或失去焦点时接收事件的监听器接口。\n\n| Method | Description |\n| :--- | :--- |\n\
  | `void focusG(focus e)` | 当组件获得键盘焦点时调用。 |\n| `void focusLost (focusEvent e)` |\
  \ 当组件失去键盘焦点时调用。 |\n\n#### ItemListener 接口\n\n这是接收项目事件的监听器接口。\n\n```\nvoid itemStateChanged\
  \ (ItemEvent e)\n```\n当项目被用户选中或取消选择时调用。\n\n#### KeyListener 接口\n\n这是接收键盘事件（按键）的监听器接口。\n\
  \n| Method | Description |\n| :--- | :--- |\n| `void keyPressed( KeyEvent e)` |\
  \ 当按下按键时调用。 |\n| `void keyReleased (KeyEvent e)` | 当释放按键时调用。 |\n| `void keyTyped\
  \ (KeyEvent e)` | 当输入按键时调用。 |\n\n#### MouseListener 接口 \n\n这是在组件上接收鼠标事件（按下、释放、点击、进入和退出）的监听器接口。\n\
  \n| Method | Description |\n| :--- | :--- |\n| `void mouseClicked(MouseEvent e)`\
  \ | 当在组件上点击（按下并释放）鼠标按钮时调用。 |\n| `void mouseEntered(MouseEvent e)` | 当鼠标进入组件时调用。\
  \ |\n| `void mouseExited( MouseEvent e)` | 当鼠标离开组件时调用。 |\n| `void mousePressed(MouseEvent\
  \ e)` | 当在组件上按下鼠标按钮时调用。 |\n| `void mouseReleased(MouseEvent e)` | 当在组件上释放鼠标按钮时调用。\
  \ |\n\n#### MouseMotionListener\n\n这是在组件上接收鼠标移动事件（移动和拖动）的监听器接口。\n\n| Method | Description\
  \ |\n| :--- | :--- |\n| `void mouseDragged(MouseEvent e)` | 当在组件上按下鼠标按钮并拖动时调用。 |\n\
  | `void mouseMoved(MouseEvent e)` | 当鼠标指针在组件上移动但未按下按钮时调用。 |\n\n#### MouseWheelListener\
  \ 接口\n\n这是在组件上接收鼠标轮事件的监听器接口。\n\n```\nvoid mouseWheelMoved(MouseEvent e)\n```\n当鼠标轮旋转时调用。\n\
  \n#### WindowListener 接口\n\n当窗口的状态由于打开、关闭、激活或取消激活、最小化或还原而改变时，监听器对象中的相关方法会被调用并将窗口事件传递给它。\n\
  \n| Method | Description |\n| :--- | :--- |\n| `void windowActivated(WindowEvent\
  \ e)` | 当设置为活动窗口时调用。 |\n| `void windowClosed(WindowEvent e)` | 当调用 Dispose 导致窗口关闭时调用。\
  \ |\n| `void windowClosing(WindowEvent e)` | 当用户尝试从窗口系统菜单关闭窗口时调用。 |\n\n\n\n\n\n\
  ```java\nvoid windowDeactivated(WindowEvent e)\n```\n当窗口不再是活动窗口时调用此方法。\n\n```java\n\
  void windowDeiconified(WindowEvent e)\n```\n当窗口从最小化状态恢复到正常状态时调用此方法。\n\n```java\n\
  void windowIconified(WindowEvent e)\n```\n当窗口从正常状态变为最小化状态时调用此方法。\n\n```java\nvoid\
  \ windowOpended (WindowEvent e)\n```\n当窗口第一次变为可见时调用此方法。\n\n## 处理 ActionEvent\n\n\
  ### 示例 18.1\n下面的示例解释了如何处理点击按钮生成的 `actionevent`。\n\n```java\nimport java.awt.*;\n\
  import java.awt.event.*;\nclass A1\n{ \n  public static void main(String args[])\n\
  \    { \n      Frame f=new Frame();\n      f.setLayout(new FlowLayout());\n    \
  \  f.setSize(500,100);\n      Button b1=new Button(\"Push me\");\n      Button b2=new\
  \ Button(\"Click me\");\n      b1.addActionListener(new B());\n      b2.addActionListener(new\
  \ C());\n      f.add(b1);\n      f.add(b2);\n      f.setVisible(true);\n    }\n\
  }\nclass B implements ActionListener\n{ \n  public void actionPerformed(ActionEvent\
  \ ae)\n    {\n      System.out.println(\"Button Pushed\");\n    }\n}\nclass C implements\
  \ ActionListener\n{ \n  public void actionPerformed(ActionEvent ae)\n    {\n   \
  \   System.out.println(\"Button Clicked\");\n    }\n}\n```\n**输出：**\n![image](img/image065.png)\n\
  \n### 示例 18.2\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass A2 implements\
  \ ActionListener\n{ \n  static Button b1=null,b2=null;\n  public static void main(String\
  \ args[])\n    { \n      Frame f=new Frame();\n      f.setLayout(new FlowLayout());\n\
  \      f.setSize(500,100);\n      b1=new Button(\"Push me\");\n      b2=new Button(\"\
  Click me\");\n      b1.addActionListener(new A2());\n      b2.addActionListener(new\
  \ A2());\n      f.add(b1);\n      f.add(b2);\n      f.setVisible(true);\n    }\n\
  \  public void actionPerformed(ActionEvent ae)\n    {\n      if(ae.getSource() ==\
  \ b1) \n      System.out.println(\"Button Pushed\");\n      else\n      System.out.println(\"\
  Button Clicked\");\n    }\n}\n```\n**输出：** 与上一个示例相同。\n\n### 示例 18.3\n```java\nimport\
  \ java.awt.*;\nimport java.awt.event.*;\nclass A3 implements ActionListener\n{ \n\
  \  Button b1=null,b2=null;\n  A3()\n    {\n      Frame f=new Frame();\n      f.setLayout(new\
  \ FlowLayout());\n      f.setSize(500,100);\n      b1=new Button(\"Push me\");\n\
  \      b2=new Button(\"Click me\");\n      b1.addActionListener(this);\n      b2.addActionListener(this);\n\
  \      f.add(b1);\n      f.add(b2);\n      f.setVisible(true);\n    }\n  public\
  \ static void main(String args[])\n    { \n      new A3();\n    }\n  public void\
  \ actionPerformed(ActionEvent ae)\n    {\n      if(ae.getSource() == b1)\n     \
  \ System.out.println(\"Button Pushed\");\n      else\n      System.out.println(\"\
  Button Clicked\");\n    }\n}\n```\n**输出：** 与上一个相同。\n\n### 示例 18.4\n```java\nimport\
  \ java.awt.*;\nimport java.awt.event.*;\nclass A4 implements ActionListener\n{ \n\
  \  static Button b1=null,b2=null;\n  static TextField tf1=null, tf2=null, tf3=null;\n\
  \  public static void main(String args[])\n    { \n      Frame f=new Frame();\n\
