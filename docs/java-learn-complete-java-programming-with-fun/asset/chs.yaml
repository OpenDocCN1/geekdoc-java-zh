  \n––––––––\n\n### [3] 层级继承。\n\n![image](img/image012.png)\n\n#### 构造函数的调用顺序：\n\n\
  当创建一个类层次结构时，构成该层次结构的类的构造函数按照什么顺序被调用？答案是，在类层次结构中，构造函数按照派生顺序从父类到子类进行调用。\n\n此外，由于 `super()`\
  \ 必须是子类构造函数中执行的第一条语句；无论是否使用 `super()`，这种顺序都是相同的。如果不使用 `super()`，编译器也会自动调用默认的 `super()`。\n\
  \n––––––––\n\n#### 动态方法绑定（动态方法派发或运行时绑定）：\n\n方法重写是 Java 强大概念的基础。动态方法派发是在运行时解析覆盖的方法，而不是在编译时。动态方法派发很重要，因为这是\
  \ Java 实现多态的方式。\n\n父类引用变量可以引用子类对象。通过父类引用调用重写方法时，Java 根据调用时对象的类型来确定执行哪个版本的方法。\n\n\
  因此，这种判断是在运行时进行的，当不同类型的对象被引用时。这种判断是在调用发生时进行的。\n\n![C:\\Users\\Made Man Harry\\Desktop\\\
  Stars\\black_star_logo.jpg](img/image039.jpg) 示例 6.5\n\n```java\nclass Shape\n{\n\
  \    void getdata()\n    {\n        System.out.println(\"getdata() of Shape\");\n\
