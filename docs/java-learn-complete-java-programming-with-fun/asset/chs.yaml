  \ |\n| `public char[] toCharArray()` | 将调用的字符串转换为新的字符数组。提供此函数是为了方便起见，因为可以使用 `getChars()`\
  \ 达到相同的结果 |\n| `public static String valueOf(Object)` | 为参数 `p`（简单类型或对象）创建一个字符串对象\
  \ |\n\n## 字符串数组\n\n我们也可以创建并使用包含字符串的数组。\n\n### 示例 10.1\n```java\nimport java.util.Scanner;\n\
  \nclass StringArrSort {\n    public static void main(String args[]) {\n        Scanner\
  \ sc = new Scanner(System.in);\n        System.out.print(\"Enter how many names\
  \ \");\n        int n = sc.nextInt();\n        String s[] = new String[n];\n   \
  \     //input\n        for (int i = 0; i < n; i++) {\n            System.out.println(\"\
  Enter name \" + (i + 1));\n            s[i] = sc.next();\n        }\n        //sorting\n\
  \        for (int i = 0; i < n - 1; i++) {\n            for (int j = i + 1; j <\
  \ n; j++) {\n                if (s[i].compareTo(s[j]) > 0) {\n                 \
  \   String t = s[i];\n                    s[i] = s[j];\n                    s[j]\
  \ = t;\n                }\n            }\n        }\n        //output\n        for\
  \ (int i = 0; i < n; i++)\n            System.out.println(s[i]);\n    }\n}\n```\n\
  \n## 字符串转换与 toString()\n\n当 Java 在拼接过程中将数据转换为其 `String` 表示形式时，它是通过调用 `String` 类定义的重载字符串转换方法\
  \ `valueOf()` 的其中一个来实现的。`valueOf()` 是一个针对所有简单类型和 `Object` 类型重载的静态方法。\n\n对于简单类型，`valueOf()`\
  \ 返回包含调用时值的人类可读等价值的字符串。对于对象，`valueOf()` 调用对象上的 `toString()` 方法。\n\n每个类都继承了 `toString()`，因为它是由\
  \ `Object` 类定义的。然而，`toString()` 的默认实现很少是足够的。它显示类名，后面跟着符号“@”，然后是对象 ID（例如 `Box@ab1342`），这通常没有用。对于我们创建的大多数重要类，我们希望重写\
  \ `toString()` 并提供我们自己的字符串表示。\n\n### 示例 10.2\n```java\nclass A {\n    private int\
  \ x, y;\n    A() {\n        x = y = 0;\n    }\n    A(int x1, int y1) {\n       \
  \ x = x1;\n        y = y1;\n    }\n}\n\nclass ToStringTest1 {\n    public static\
  \ void main(String args[]) {\n        A a1 = new A(5, 6);\n        System.out.println(a1);\
  \ // 调用了 Object 类的 toString()\n        String s1 = \"Object a1 is \" + a1; // 将对象与字符串拼接\n\
  \        System.out.println(s1);\n    }\n}\n```\n**输出：**\n```\nA@ab1342\nObject\
  \ a1 is A@ab1342\n```\n\n### 示例 10.3\n```java\nclass A {\n    private int x, y;\n\
  \    A() {\n        x = y = 0;\n    }\n    A(int x1, int y1) {\n        x = x1;\n\
  \        y = y1;\n    }\n    // 在这里重写 toString()\n}\n\nclass ToStringTest2 {\n \
  \   public static void main(String args[]) {\n        A a1 = new A(5, 6);\n    \
  \    System.out.println(a1);\n        String s1 = \"Object a1 is \" + a1;\n    }\n\
  }\n```\n\n### 示例 10.4\n```java\nimport java.util.*;\n\nclass FindTest {\n    public\
  \ static void main(String args[]) {\n        Scanner sc = new Scanner(System.in);\n\
  \        String s1, s2;\n        System.out.print(\"Enter string\");\n        s1\
  \ = sc.next();\n        System.out.print(\"Enter string to search\");\n        s2\
  \ = sc.next();\n        int ans = s1.indexOf(s2);\n        if (ans == -1) {\n  \
  \          System.out.println(\"Not Found\");\n        } else {\n            System.out.println(\"\
  found at pos \" + ans);\n        }\n    }\n}\n```\n\n## StringBuffer\n\n`StringBuffer`\
  \ 是 `String` 的伙伴类，提供了许多 `String` 的功能。正如所知，`String` 表示固定长度。相反，`StringBuffer` 表示可增长和可写的字符序列。`StringBuffer`\
  \ 可以在中间插入或在末尾追加字符。`StringBuffer` 会自动扩展以留出空间，通常分配比需要的更多的字符。Java 经常使用该类，但许多程序员只处理\
  \ `String`，通过 + 运算符在后台操作 `StringBuffer`。\n\n### 关于 StringBuffer 的几点重要说明\n- `StringBuffer`\
  \ 像 `String` 一样是一个对象。\n- `StringBuffer` 类也像 `String` 一样是最后的。\n- `StringBuffer` 对象是可变的（可以修改），不像\
  \ `String` 对象。\n\n### StringBuffer 的构造函数和方法：\n\n| Method | Description |\n| :---\
  \ | :--- |\n| `public StringBuffer()` | 构造函数预留 16 个字符而不重新分配。 |\n| `public StringBuffer(int)`\
  \ | 该构造函数接受一个整数参数，显式设置缓冲区的大小。 |\n| `public StringBuffer(String)` | 该构造函数接受一个 `String`\
  \ 参数，设置 `StringBuffer` 对象的初始内容，并预留 16 个字符的空间。 |\n| `public synchronized int length()`\
  \ | 返回 `StringBuffer` 的当前长度。 |\n| `public synchronized int capacity()` | 返回当前容量。容量是新插入字符的可用空间，超出将发生分配。\
  \ |\n| `public synchronized void ensureCapacity(int)` | 确保容量至少等于指定的最小值。如果我们想在构造\
  \ `StringBuffer` 后预留某些字符的空间，可以使用 `ensureCapacity()` 方法设置缓冲区的大小。如果我们预先知道将向 `StringBuffer`\
  \ 追加大量小字符串，这将非常有用。 |\n| `public synchronized void trimToSize()` | 删除多余的空空间。现在容量将等于长度。\
  \ |\n| `public synchronized void setLength(int newLength)` | 设置字符序列的长度。`newLength`\
  \ 必须是非负数。当我们增大缓冲区时，会在现有缓冲区末尾添加空字符。如果我们调用的 `setLength()` 值小于 `length()` 返回的值，则存储在新长度之外的字符将丢失。\
  \ |\n\n\n\n\n\n# 方法引用\n\n| `public synchronized char charAt(int index)` | 返回此序列中指定索引处的字符值。\
  \ |\n| `public synchronized void getChars(int srcBegin, int srcEnd, char[] dst,\
  \ int dstBegin)` | 将字符从此序列复制到目标字符数组 `dst` 中。第一个复制的字符位于索引 `srcBegin`；最后一个复制的字符位于索引\
  \ `srcEnd-1`。要复制的字符总数为 `srcEnd-srcBegin`。字符被复制到 `dst` 中从索引 `dstBegin` 开始的子数组中。注意：确保目标或数组足够大，能够容纳指定子字符串中的字符数量。\
  \ |\n| `public synchronized void setCharAt(int index, char ch)` | 将指定索引处的字符设置为 `ch`。如果\
  \ `index` 为负数或大于或等于 `length()`，则抛出 `IndexOutOfBoundsException`。 |\n| `public synchronized\
  \ StringBuffer append(Object)` | `append` 方法将任何其他类型数据的字符串表示连接到调用该 `StringBuffer`\
  \ 对象的末尾。 |\n| `public synchronized StringBuffer delete(int start, int end)` | 从索引\
  \ `start` 到 `end-1` 移除字符 |\n| `public synchronized StringBuffer deleteCharAt(int\
  \ index)` | 移除指定位置的字符 |\n| `public synchronized StringBuffer replace(int start,\
  \ int end, String str)` | 将索引 `start` 到索引 `end-1` 的字符替换为指定 `String` 中的字符。 |\n| `public\
  \ synchronized String substring(int)` | 返回一个新的 `String`，包含当前此字符序列中的字符子序列。该子字符串从指定的索引开始，延伸到此序列的末。\
  \ |\n| `public synchronized String substring(int start, int end)` | 返回一个新的 `String`，包含当前此字符序列中的字符子序列。该子字符串从指定的\
  \ `start` 索引开始，延伸到索引 `end-1` 处的字符。 |\n| `public synchronized StringBuffer insert(int,\
  \ Object)` | 将一个 `String` 插入另一个 `String`。它被重载以接受所有简单类型的值以及 `Strings` 和 `Objects`。\
  \ |\n| `public int indexOf(String)` | |\n| `public synchronized int indexOf(String,\
  \ int)` | |\n| `public int lastIndexOf(String)` | |\n| `public synchronized int\
  \ lastIndexOf(String, int)` | |\n| `public synchronized StringBuffer reverse()`\
  \ | 反转 `StringBuffer` 的内容。 |\n\n## 示例 10.5\n\n```java\nimport java.util.Scanner;\n\
  class SortStr\n{\n    public static void main(String args[])\n    {\n        Scanner\
  \ sc = new Scanner(System.in);\n        System.out.print(\"Enter a string\");\n\
  \        StringBuffer sb1 = new StringBuffer(sc.next());\n        //Sorting\n  \
  \      for(int i=0;i<sb1.length()-1;i++)\n        for(int j=i+1;j<sb1.length();j++)\n\
  \            if(sb1.charAt(i) > sb1.charAt(j))\n            {\n                char\
  \ t=sb1.charAt(i);\n                sb1.setCharAt(i,sb1.charAt(j));\n          \
  \      sb1.setCharAt(j,t);\n            }\n        System.out.println(sb1);\n  \
  \  }\n}\n```\n**输出：**\nEnter a string SHIVAM\nAHIMSV\n\n## 示例 10.6：统计给定句子中单词数的程序。\n\
  \n```java\nclass WordCnt\n{\n    public static void main(String args[])\n    {\n\
  \        String s1 = \"Mohan Das  Karam  Chand  Gandhi\";\n        boolean flag=false;\n\
  \        int cnt=0;\n        for(int i=0;i<s1.length();i++)\n        {\n       \
  \     if(s1.charAt(i) == ' ')\n                flag = false;\n            else\n\
  \            {\n                if(flag == false)\n                {\n         \
  \           flag = true;\n                    cnt++;\n                }\n      \
  \      }\n        }\n        System.out.print(\"No. of Words=\" + cnt);\n    }\n\
  }\n```\n**输出：** No. of Words=5\n\n# 第一章：异常处理\n\n### 简介\n异常异常是由运行时引起的、破坏程序正常流的条件。当\
  \ Java 解释器遇到错误时，它创建一个异常对象并抛出它。在旧的语言中，我们使用 `goto` 或返回代码。\n\n这种方法是繁琐的。Java 的异常处理通过将异常管理引入面向对象的世界来避免这些问题。\n\
  \n### 异常基础\n异常是一个描述代码中发生的异常情况的对象。当异常情况出现时，会创建一个表示该异常的对象并将其抛出。异常可以由 Java 运行时系统生成，也可以由你的代码手动生成。\n\
  \nJava 异常处理通过五个关键字管理：`try`、`catch`、`throw`、`throws` 和 `finally`。\n- `try`：你想要监控异常的语句包含在此块中。\n\
  - `catch`：如果发生异常，异常将在块中被捕获并处理。\n- `throw`：用于手动抛出异常。\n- `throws`：用于指定从方法抛出异常。\n-\
  \ `finally`：在 `try` 块完成后绝对必须执行的任何代码。\n\n**异常处理块的一般形式：**\n```java\ntry {\n    //\
  \ 监控错误的代码块\n}\ncatch (ExceptionType1 exOb) {\n    // 针对 ExceptionType1 的异常处理器\n\
  }\nfinally {\n    // 在 try 块结束后执行的代码块\n}\n```\n\n### 异常类型\n所有异常类型都是内置类 `Throwable`\
  \ 的子类。因此，`Throwable` 位于异常类层次结构的顶端。在 `Throwable` 直接下方有两个子类，它们将异常划分为两个不同的分支：\n\n1.\
  \ `Exception`：用于用户程序应该捕获的异常情况。你将通过派生此类来创建自己的自定义异常类型。 own\n2. `RuntimeException`：`Exception`\
  \ 的一个重要子类。这种类型的异常对于你编写的程序会自动定义，包括除以零和无效数组索引等情况。\n\n\n\n\n另一个分支由 `Error` 顶层，它定义了在正常情况下程序预计不会被捕获的异常。`Error`\
  \ 类型的异常用于 Java 运行时系统指示与运行时环境本身相关的错误。栈溢出（Stack overflow）就是此类错误的一个示例。本章将不会处理 `Error`\
  \ 类型的异常，因为这些异常通常是为了响应程序无法处理的灾难性故障而创建的。\n\n顶层异常层次结构所示：\n\n![image](img/image074.png)\n\
  \n### 示例 11.1\n\n```java\nclass ErrorTest1\n{\n    public static void main(String\
  \ args[])\n    {\n      int a=5,b=2,c=2,d;\n      d=a/(b-c); //ArithmeticException(Divide\
  \ by zero) occurred\n      System.out.println(d);\n      System.out.println(\"This\
  \ will not be printed\");\n    }\n}\n```\n程序将在除法操作期间终止，不会执行剩余的语句。\n\n### 示例 11.2\n\
  \n```java\nclass A\n{\n    void display()\n    {\n      -----\n    }\n}\nclass ErrorTest2\n\
  {\n    public static void main(String args[])\n    {\n      A a1=null;\n      a1.display();\
  \ // NullPointerException occurred\n    }\n}\n```\n在上述程序中将发生 `NullPointerException`。该引用变量没有用\
  \ `new` 初始化。在这种情况下，程序也会终止。\n\n### 示例 11.3\n\n```java\nclass ErrorTest3\n{\n    public\
  \ static void main(String args[])\n    {\n      int a[ ] = {10,20,30};\n      System.out.println(a[3]);\
  \  //ArrayIndexOutOfBoundsException occurred\n    }\n}\n```\n在上述情况下，数组的长度为 3，索引从\
  \ 0 到 2，因此如果我们打印 `a[3]`，那么它就是第 4 个元素，这不是一个有效的索引。这将产生一个异常错误。在 C/C++ 中这是允许的，但在 Java\
  \ 中是不允许。\n\n**注意**\n\nJDK 7 增加了一种新的 `try` 语句形式，支持自动资源管理。这种新的 `try` 形式被称为 `try-with-resources`，在\
  \ `Chapter` 文件的关于文件管理的上下文中进行了描述，因为文件是最常用的资源之一。\n\n### 异常的其他情况\n\n1. 我们尝试打开的文件可能不存在。\n\
  2. 我们想要创建一个新对象，但没有可用内存。\n3. 我们想要加载的类文件可能缺失或格式错误。\n4. 我们想要转换为数字的 `String` 包含无效字符，导致无法转换为数字。\n\
  \n如果异常对象没有被正确捕获和处理，解释器将显示错误消息并终止程序。如果我们希望继续执行剩余代码，我们应该尝试捕获由错误条件抛出的异常对象。\n\n这项任务被称为异常处理。异常处理机制的目的是提供一种检测和报告“异常情况”的方法，以便采取适当的措施。该机制建议引入单独错误处理代码来执行以下任务：\n\
  \n1. 发现问题。（发生异常）\n2. 通知错误已发生。（抛出异常）\n3. 接收错误信息。（捕获异常）\n4. 纠正措施。（处理异常）\n\nJava 异常处理通过五个关键字管理：`try`、`catch`、`throw`、`throws`\
  \ 和 `finally`。\n\n我们想要监控异常的程序语句包含在 `try` 块中，每当发生错误时，异常会被抛到 `catch` 块。我们的代码可以捕获此异常（使用\
  \ `catch`）并以合理的方式进行处理。系统生成的异常由 Java 运行时系统自动抛出。\n\n要手动抛出异常，使用关键字 `throw`。任何抛出方法的异常必须通过\
  \ `throws` 子句进行指定。任何在方法返回之前必须执行的代码都放在 `finally` 块中。\n\n（注：源文件中剩余文本包含高度重复且碎片化的句子结构；我优先考虑了上述提供的核心技术定义和示例。）*\n\
  \n\n\n\n换句话说，`catch` 并不是被“调用”，因此执行流永远不会从 `catch` “返回”到 `try` 块。因此，“这不会被打印。”这一行不会显示。一旦\
  \ `catch` 语句执行完毕，程序控制将继续执行位于整个 `try/catch` 机制之后的下一行代码。\n\n`try` 及其 `catch` 语句形成一个单元。`catch`\
  \ 子句的作用范围仅限于紧随其后的 `try` 语句指定的语句。`catch` 语句无法捕获由另一个 `try` 语句抛出的异常（稍后描述的嵌套 `try` 语句除外）。被\
  \ `try`保护的语句必须用大括号括起来（也就是说，它们必须在一个块内）。你不能对单个语句使用 `try`。\n\n大多数结构良好的 `catch` 子句的目标应该是解决异常情况，然后继续执行，就好像该错误从未发生过一样。例如，在下一个程序中，`for`\
  \ 循环的每次迭代都会获取两个随机整数。这两个整数相互相除，结果被用于除以值 `12345`。最终结果存入 `a` 中。如果任何除法操作导致 `divide-by-zero`\
  \ 错误，它会被捕获，`a` 的值被设置为 `zero`，程序继续运行。\n\n```java\n// Handle an exception and move\
  \ on.\n\nimport java.util.Random;\n\nclass HandleError {\n    public static void\
  \ main(String args[]) {\n        int a=0, b=0, c=0;\n        Random r = new Random();\n\
  \        for(int i=0; i<32000; i++) {\n            try {\n                b = r.nextInt();\n\
  \                c = r.nextInt();\n                a = 12345 / (b/c);\n        \
  \    } catch (ArithmeticException e) {\n                System.out.println(\"Division\
  \ by zero.\");\n                a = 0; // set a to zero and continue\n         \
  \   }\n            System.out.println(\"a: \" + a);\n        }\n    }\n}\n```\n\n\
  ### 显示异常描述\n\n`Throwable` 重写了 `toString()` 方法（由 `Object` 定义），返回包含异常描述的字符串。你可以通过简单地将异常作为参数传递给\
  \ `println()` 语句来显示此描述。例如，上一个程序的 `catch` 块可以重写如下：\n\n```java\ncatch (ArithmeticException\
  \ e) {\n    System.out.println(\"Exception: \" + e);\n    a = 0; // set a to zero\
  \ and continue\n}\n```\n\n当把此版本替换到程序中并运行时，每个 `divide-by-zero` 错误都会显示以下消息：\n`Exception:\
  \ java.lang.ArithmeticException: / by zero`\n\n虽然这在上下文中没有特殊价值，但在其他情况下，显示异常描述是有价值的——特别是当你正在进行异常实验或进行调试时。\n\
  \n| 异常类型 | 异常原因 |\n| :--- | :--- |\n| `ArithmeticException` | 算术错误，例如 - 除以 0 |\n\
  | `ArrayIndexOutOfBoundsException` | 数组索引越界 |\n| `ArrayStoreException` | 在数组中存储错误类型的数据\
  \ |\n| `FileNotFoundException` | 访问不存在的文件 |\n| `IOException` | 无法从文件读取 |\n| `NullPointerException`\
  \ | 由引用空对象引起\n| `NumberFormatException` | 字符串与数字之间的转换失败\n| `OutOfMemoryException`\
  \ | 没有足够的内存分配新对象 |\n| `SecurityException` | Applet 尝试执行浏览器安全设置不允许允许的操作 |\n| `StackOverflowException`\
  \ | 系统栈空间不足 |\n| `StringIndexOutOfBoundsException` | 程序尝试访问字符串中不存在的字符位置 |\n\n###\
  \ Java 内置异常\n\n在标准包 `java.lang` 内部，Java 定义了多个异常类。之前的示例已经使用了其中几个。这些异常中最通用的是标准类型 `RuntimeException`\
  \ 的子类。\n\n正如之前所解释的那样，这些异常不需要包含在 `throws` 列表中。在语言中，这些被称为**未检查异常**，因为编译器不会检查方法是否处理了它们。在\
  \ `java.lang` 中定义的必须包含在方法 `throws` 列表中的异常是**检查异常**。\n\n### 多 catch 子句\n\n在某些情况下，单个\
  \ `try` 块可能会抛出多个异常。为了处理这种情况，你可以指定多个 `catch` 子句。当抛出异常时，会按顺序检查每个 `catch` 语句，并执行第一个与异常类型匹配的语句。其中一个\
  \ `catch` 执行后，其他的将直接跳过。\n\n```java\n// Demonstrate multiple catch statements.\n\
  class MultipleCatches {\n    public static void main(String args[]) {\n        try\
  \ {\n            int a = args.length;\n            System.out.println(\"a = \" +\
  \ a);\n            int b = 42 / a;\n            int c[] = { 1 };\n            c[42]\
  \ = 99;\n        } catch (ArithmeticException e) {\n            System.out.println(\"\
  Divide by 0: \" + e);\n        } catch (ArrayIndexOutOfBoundsException e) {\n  \
  \          System.out.println(\"Array index oob: \" + e);\n        }\n        System.out.println(\"\
  After/catch blocks.\");\n    }\n}\n```\n\n如果该程序在没有命令行参数的情况下启动，将会导致 `divide-by-zero`\
  \ 异常，因为 `a` 将等于零。如果你提供了命令行参数，它将跳过除法错误（设置 `a` 大于零），但它会导致 `ArrayIndexOutOfBoundsException`，因为整型数组\
  \ `c` 的长度为 1，而程序却尝试给 `c[42]` 赋值。\n\n以下是两种运行方式生成的输出：\n`C:>MultipleCatches`\na = 0\n\
  Divide by 0: java.lang.ArithmeticException: / zero\nAfter catch blocks.\n\n`C:>MultipleCatches\
  \ TestArg`\na = 1\nArray index oob: java.lang.ArrayIndexOutOfBoundsException:42\n\
  After catch blocks.\n\n当你使用多个 `catch` 语句时，必须记住异常子类必须位于其父类之前。这是因为使用父类的 `catch` 语句会捕获该类型及其任何子类的异常。因此，如果子类在父类之后，它将永远无法被访问。此外，在\
  \ Java 中，不可达代码是一个错误。例如，考虑以下程序：\n\n```java\n/* 此程序包含错误。\n在系列 catch 语句中，子类必须在其父类之前。\n\
  否则，将产生不可达代码并导致编译时错误。 */\nclass SuperSubCatch {\n    public static void main(String\
  \ args[]) {\n        try {\n            int a = 0;\n            int b = 42 / a;\n\
  \        } catch(Exception e) {\n            System.out.println(\"Generic Exception\
  \ catch.\");\n        }\n        /* 此 catch 永远不会到达，因为\nArithmeticException 是 Exception\
  \ 的子类。 */\n        catch(ArithmeticException e) { // 错误 – 不可\n            System.out.println(\"\
  This is never reached.\");\n        }\n    }\n}\n```\n\n\n\n如果你尝试编译此程序，将收到一条错误消息，说明第二个\
  \ `catch` 语句是不可达，因为异常已经被捕获。由于 `ArithmeticException` 是 `Exception` 的子类，第一个 `catch`\
  \ 语句将处理所有基于 `Exception` 的错误，包括 `ArithmeticException`。\n\n这意味着第二个 `catch` 语句将永远不会执行。要解决这个问题，请反转\
  \ `catch` 语句的顺序。\n\n## 嵌套 try 语句\n\n`try` 语句可以嵌套。也就是说，一个 `try` 语句位于另一个 `try` 块内部。每当进入一个\
  \ `try` 语句时，该异常的上下文就会推到栈上。\n\n如果内部 `try` 语句没有针对特定异常的 `catch` 处理器，栈将回溯并检查下一个 `try`\
  \ 语句的 `catch` 处理器是否匹配。\n\n这种情况会一直持续，直到其中一个 `catch` 语句执行成功，或者所有的嵌套 `try` 语句都已耗尽。如果没有\
  \ `catch` 语句匹配，Java 运行时系统将处理该异常。\n\n以下是一个使用嵌套 try 语句的示例：\n\n### 多重 catch 语句\n\n\
  当存在多个 `catch` 语句时，称之为多重 catch 语句。\n\n#### 多重 catch 语句示例\n\n```java\ntry\n{\n   \
  \ statement; //产生一个异常\n}\ncatch(Exception-type-1 e)\n{\n    statement 1; //处理类型\
  \ 1 的异常\n}\ncatch(Exception-type-2 e)\n{\n    statement 2; //处理类型 2 的异常\n}\n// ...\n\
  catch(Exception-type-n e)\n{\n    statement n; //处理类型 n 的异常\n}\n```\n\n#### 示例 11.4\n\
  \n```java\nclass ErrorTest4\n{\n    public static void main(String args[])\n   \
  \ {\n        int a=10,b=2,c=2,d;\n        System.out.println(\"Before Exception\
  \ \");\n        d=a/(b-c);\n        System.out.println(\"After Exception \");\n\
  \    }\n}\n```\n\n输出：\n![image](img/image043.png)\n\n在这里我们没有捕获异常，因此程序将在显示消息“Before\
  \ Exception”后终止。现在我们使用异常处理已经解决了这个问题。\n\n#### 示例 11.5\n\n```java\nclass ErrorTest5\n\
  {\n    public static void main(String[] args)\n    {\n      int a=10,b=2,c=2,d;\n\
  \      try\n      {\n        System.out.println(\"Before Exception\");\n       \
  \ d=a/(b-c);\n        System.out.println(\"This Will Not Print\");\n      }\n  \
  \    catch(ArithmeticException e)\n      {\n      System.out.println(\"After Exception\"\
  );\n      System.out.println(\"error : Division by zero\");\n      }\n    }\n}\n\
  ```\n\n输出：\n![image](img/image049.png)\n\n## 异常处理的优势\n\n- 我们可以很容易确定异常/错误将在哪里处理。异常/错误在运行时沿调用栈向上传播——首先到达封装的\
  \ `try` 块，然后返回到调用方法——直到异常处理器捕获它们为止。\n- 异常/错误的位置是确定的，因为整个堆栈轨迹对用户都是可见的。对于调试非常有帮助。\n\
  - 程序员有机会从错误/异常状态中恢复。\n- 错误处理代码与正常程序流分离，以增加可读性和可维护性。\n- 使用 Java 无需测试是否发生了异常/错误情况。添加更多的错误/异常处理器只需要添加更多的\
  \ `catch` 子句，但不需要触动原始程序流。\n\n## 异常类的层次结构\n\n所有 `Exception` / `Error` 类的根类是 `throwable`\
  \ 类，它是 `object` 类的直接子类。异常/错误在 Java 中也是对象。`Exception` 的子类带有 `Exception` 后缀。\n\n`throwable`\
  \ 类有两个直接子类：\n\n- `Error`: `Error` 类的子类基本上用于指示非正常状态，例如：\n    1. `OutOfMemoryError`\
  \ 表示 Java 虚拟机内存已耗尽，垃圾回收器无法回收可用内存。\n    2. `StackOverflowError` 解释器中发生栈溢出。\n    这些错误通常是不可恢复的，不应该被处理。\n\
  - `Exception`: `Exception` 类的子类通常是可恢复的。例如，`EOFException` 信号我们打开的文件没有更多数据可读。`FileNotFoundException`\
  \ 表示我们想要打开的文件不存在。\n\n层次结构示例：own![image](img/image01.png)\n\n异常分为两类\n\n### 检查点异常\
  \ (Checked Exception)\n如果必须捕获异常，则它被称为检查异常。如果 `try` 块中可能发生检查异常且未被处理，程序将无法编译。编译器确保如果一个方法直接或间接地可以抛出检查异常，则该方法必须显式地处理它。该方法要么捕获异常并采取适当行动，要么将异常传递给调用者。注意：`Exception`\
  \ 及其所有子类（运行时异常及其子类除外）都是检查异常，必须捕获。\n\n### 未检查异常 (Unchecked Exception)\n如果不必捕获异常，则它被称为未检查异常。即使未处理未检查异常，程序也可以编译。如果程序中发生了未处理的未检查异常，程序将在该点终止。但如果处理异常，程序将不会终止。注意：`Error`\
  \ 及其所有子类都是未检查异常，不需要捕获。运行时异常及其所有子类是未检查异常。用户定义的异常是检查异常。\n\n`Exception` 类中的方法：\n\n\
  | 方法 | 描述 |\n| :--- | :--- |\n| `getMessage()` | 获取与异常相关的错误消息。 |\n| `printStackTrace()`\
  \ | 打印显示异常/错误的堆栈轨迹。 |\n| `toString()` | 显示异常/错误名称以及 `getMessage()` 返回的消息。 |\n\n\
  #### 示例 11.6\n\n```java\nclass ErrorTest6\n{\n    public static void main(String[]\
  \ arr)\n    {\n      try\n      {\n        int a=10,b=2,c=2,d;\n        System.out.println(\"\
  Before Exception\");\n        d=a/(b-c);\n        System.out.println(\"This Will\
  \ Not Print\");\n      }\n      catch(ArithmeticException e)\n      {\n      System.out.println(\"\
  After Exception\");\n      System.out.println(\"error : Division by zero\");\n \
  \     System.out.println(e.getMessage());\n      System.out.println(e); //调用了 toString()\n\
  \      e.printStackTrace();\n      }\n    }\n}\n```\n\n输出：\nBefore Exception\nAfter\
  \ Exception\nerror : Division by zero\nby Zero\njava.lang.ArithmeticException: /\
  \ by zero\njava.lang.ArithmeticException: / by zero\nat ErrorTest6.main(ErrorTest6.java:10)\n\
  \n#### 示例 11.7 多重 catch\n\n```java\nclass ErrorTest7\n{\n    public static void\
  \ main(String args[])\n    {\n      try\n      {\n        int a=args.length;\n \
  \       System.out.println(\"Before Exception\");\n        int b=58/a;\n       \
  \ int c[] = {1};\n        c[47]=100;\n        System.out.println(\"After Exception\"\
  );\n      }\n      catch(ArithmeticException e)\n      {\n        System.out.println(\"\
  Divide by zero :\"+e);\n      }\n      catch(ArrayIndexOutOfBoundsException e)\n\
  \      {\n        System.out.println(\"Array Index oob :\"+e);\n      }\n      System.out.println(\"\
  After try/catch block\");\n    }\n}\n```\n\n输出 1：当我们以 “java ErrorTest7” 运行上述程序时：\n\
  Before Exception\nDivide by zero :java.lang.ArithmeticException: / by zero\nAfter\
  \ try/catch block\n\n输出 2：当我们以 “java ErrorTest7 45” 运行上述程序时：\nBefore Exception\n\
  Array Index oob:java.lang.ArrayIndexOutOfBoundsException: 47\nAfter try/catch block\n\
  \n\n\n\n\n如果在另一个 `try` 块中使用 `try` 和 `catch` 语句，则被称为嵌套的 `try catch`。\n\n### 语法\n\n\
  ```java\ntry // 外部 try\n{\n    try // 内部 try\n    {\n        statement ;\n    }\n\
  \    catch1() // 内部 catch\n    {\n        statement ;\n    }\n    catch2() // 内部\
  \ catch\n    {\n        statement ;\n    }\n}\ncatch() // 外部 catch\n{\n    statement\
  \ ;\n}\n```\n\n### 示例 11.8 嵌套 try 和 catch-\n\n```java\nclass Nested\n{\n    public\
  \ static void main(String args[])\n    {\n        try\n        {\n            int\
  \ a=args.length;\n            int b=58/a;\n            System.out.println(\"a= \"\
  +a);\n            try\n            {\n                if(a==1)\n               \
  \     a=a/(a-a);\n                if(a==2)\n                {\n                \
  \    int c[]={1};\n                    c[42]=100;\n                }\n         \
  \   }\n            catch(ArrayIndexOutOfBoundsException e)\n            {\n    \
  \            System.out.println(\"ArrayIndex oob \"+e);\n            }\n       \
  \ }\n        catch(ArithmeticException e)\n        {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n\n**输出 I:**\n当我们以 `java ErrorTest8` 运行上述程序时（除以零）\n\n\
  **输出 II:**\n当我们以 `java ErrorTest8 10` 运行上述程序时\n`a=1 / by zero` \n\n**输出 III:**\n\
  当我们以 `java ErrorTest8 10 20` 运行上述程序时\n`a=2`\n`ArrayIndex oob java.lang.ArrayIndexOutOfBoundsException:\
  \ 42`\n\n---\n\n### finally 语句\n\nJava 支持另一种名为 `finally` 的语句，它可以用于处理未被之前任何一个 `catch`\
  \ 语句捕获的异常。`finally` 块可以处理在 `try` 块中生成的任何异常。无论是否发生错误，它都会执行。它可以紧跟在 `try` 块之后或最后一个\
  \ `catch` 块之后，如下所示：\n\n**语法：**\n\n```java\ntry\n{\n}\ncatch(...)\n{\n}\ncatch(...)\n\
  {\n}\nfinally\n{\n}\n```\n\n### 示例 11.9 finally 语句\n\n```java\nclass ErrorTest9\n\
  {\n    public static void main(String args[])\n    {\n        int a[ ] = {5,10};\n\
  \        int b=5;\n        try\n        {\n            int x=a[2]/b-a[1];\n    \
  \    }\n        catch(ArithmeticException e)\n        {\n            System.out.println(\"\
  Division By Zero\");\n        }\n        catch(ArrayIndexOutOfBoundsException e)\n\
  \        {\n            System.out.println(\"Array Index error\");\n        }\n\
  \        catch(ArrayStoreException e)\n        {\n            System.out.println(\"\
  Wrong Data Type\");\n        }\n        finally // 始终执行\n        {\n           \
  \ System.out.println(\"Always Execute\");\n        }\n        int y=a[1]/a[0];\n\
  \        System.out.println(\"y = \"+y);\n    }\n}\n```\n**输出:**\n`Array Index error`\n\
  `Always Execute`\n`y = 2`\n\n---\n\n### throw\n\n到目前为止，我们只捕获由 Java 运行时系统抛出的异常。然而，我们的程序也可以使用\
  \ `throw` 语句显式地抛出异常。通用形式所示：\n\n`throw instance;`\n\n这里 `instance` 必须是 `Throwable`\
  \ 类型的对象或 `Throwable` 的子类。简单类型如 `int` 或 `char`，以及非 `Throwable` 类如 `String` 和 `Object`\
  \ 不能用作异常。执行流立即停止；检查最近的内部 `try` 块，查看其是否有匹配异常类型的 `catch` 语句。如果有，控制权将转移到该语句。如果没有，则检查下一个\
  \ `try` 语句，以此此类推。如果未找到匹配的 `catch`，默认处理器将打印堆栈跟踪。这里我们取了一个创建并抛出异常的程序。捕获异常的处理器将其重新抛出给外部处理器。\n\
  \n### 示例 11.10\n\n```java\nclass ErrorTest10\n{\n    int age;\n    void setAge(int\
  \ a)\n    {\n        if(a>0)\n            age = a;\n        else\n        {\n  \
  \          NullPointerException e = new NullPointerException(\"Invalid Age\");\n\
  \            throw e;\n        }\n    }\n    public static void main(String args[])\n\
  \    {\n        ErrorTest10 a1 = new ErrorTest10();\n        try\n        {\n  \
  \          a1.setAge(20);\n            a1.setAge(-10);\n        }\n        catch(NullPointerException\
  \ e)\n        {\n            System.out.println(e.getMessage());\n        }\n  \
  \  }\n}\n```\n**输出:**\n`Invalid Age`\n\n---\n\n### throws\n\n如果一个方法可能会导致它未处理的异常，它必须指定这种行为，以便方法的调用者能够针对该异常进行防护。我们通过在方法声明中包含\
  \ `throws` 子句来实现。`throws` 子句列出了方法可能抛出的异常类型。这对于所有检选异常（checked exceptions）都是必要的。方法可以抛出的所有异常都必须在\
  \ `throws` 子句中声明。如果没有声明，会导致编译错误。这是一个包含 `throws` 子句的方法声明通用形式：\n\n**语法：**\n\n`type\
  \ method-name(parameter list) throws exception-list`\n`{ // 方法体 }`\n\n在这里，`exception-list`\
  \ 是方法可以抛出的异常的逗号分隔列表。\n\n### 示例 11.11\n\n```java\nimport java.io.*; \nclass ErrorTest11\n\
  {\n    int age;\n    void setAge(int a) throws IOException\n    {\n        if(a>0)\n\
  \            age = a;\n        else\n        {\n            IOException e = new\
  \ IOException(\"Invalid Age\");\n            throw e;\n        }\n    }\n    public\
  \ static void main(String args[])\n    {\n        ErrorTest11 a1 = new ErrorTest11();\n\
  \        try\n        {\n            a1.setAge(20);\n            a1.setAge(-10);\n\
  \        }\n        catch(IOException e)\n        {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n**输出:**\n`Invalid Age`\n\n---\n\n### 创建自定义异常/类：创建自己的异常子类\n\
  \n这非常简单：只需定义 `Exception` 的子类即可。我们的子类不需要实现任何内容。`Exception` 类没有定义任何自己的方法。当然，它从 `Throwable`\
  \ 继承了这些方法。\n\n### 示例 11.12\n\n```java\nclass AgeException extends Exception\n{\n\
  ```\n\n\n\n\n\n```java\nclass AgeException(String msg) {\n    super(msg);\n}\n\n\
  class ErrorTest12 {\n    int age;\n    void setAge(int a) throws InvalidAgeException\
  \ {\n        if(a > 0)\n            age = a;\n        else {\n            AgeException\
  \ e = new AgeException(\"Invalid Age\");\n            throw e;\n        }\n    }\n\
  \    public static void main(String args[]) {\n        ErrorTest12 a1 = new ErrorTest12();\n\
  \        try {\n            a1.setAge(20);\n            a1.setAge(-10);\n      \
  \  } catch(AgeException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\nOutput:\n```\nInvalid Age\n```\n\n下面的示例声明了 `Exception`\
  \ 的一个新子类，并使用该子类在方法中指示错误条件。它重写了 `toString()` 方法，允许显示精心定制的异常描述。\n\n![sss](img/image090.jpg)\n\
  \n此示例定义了一个名为 `MyException` 的 `Exception` 子类。该子类非常简单：它只包含一个构造函数和一个重写的 `toString()`\
  \ 方法，该方法显示异常的值。\n\n`ExceptionDemo` 类定义了一个名为 `compute()` 的方法，该方法会抛出一个 `MyException`\
  \ 对象。当 `compute()` 的整数参数大于 10 时，会抛出异常。`main()` 方法为 `MyException` 设置了异常处理器，然后调用 `compute()`\
  \ 并传入一个合法值（小于 10）和一个非法值，以展示代码执行的两种路径。\n\n以下是结果：\n```\nCalled compute(1)\nNormal\
  \ exit\nCalled compute(20)\nCaught MyException[20]\n```\n\n## 链式异常\n\n链式异常特性允许我们将异常与另一个异常关联。第二个异常描述了第一个异常的原因。例如，想象一种情况：一个方法因为尝试除以零而抛出\
  \ `ArithmeticException`。然而，问题的实际原因是发生了 I/O 错误，这导致除数被设置不当。\n\n尽管该方法必须抛出 `ArithmeticException`（因为这是发生的错误），但我们可能还想让调用代码知道底层原因是\
  \ I/O 错误。\n\n为了允许链式异常，Java 2 1.4 版本向 `Throwable` 类添加了两个构造函数和两个方法。构造函数所示：\n\n```java\n\
  Throwable(Throwable causeExc)\nThrowable(String msg, Throwable causeExc)\n```\n\n\
  在第一形式中，`causeExc` 是发生的异常。第二种形式允许我们在指定原因异常的同时指定一个描述。这两个构造函数也被添加到 `Error`、`Exception`\
  \ 和 `RuntimeException` 类中。\n\n添加到 `Throwable` 类的链式异常方法是 `getCause()` 和 `initCause()`\n\
  \n```java\nThrowable getCause()\nThrowable initCause(Throwable causeExc)\n```\n\n\
  `getCause()` 方法返回当前异常的底层异常。如果没有底层异常，则返回 `null`。`initCause()` 方法将 `causeExc` 与调用的异常关联并返回该异常的引用。因此，我们可以在异常创建后与其关联一个原因。然而，原因异常只能设置一次。\n\
  \n因此，我们对每个异常对象只能调用一次 `initCause()`。此外，如果原因异常是通过构造函数设置的，则我们无法使用 `initCause()` 方法再次设置它。通常情况下，`initCause()`\
  \ 用于为不支持上述两个额外构造函数的旧版异常类设置原因。大多数 Java 内置异常都没有定义额外的构造函数。因此，如果我们需要向这些异常中添加一个异常，将使用\
  \ `initCause()`。链式异常并不是每个程序都需要的。但在了解底层原因有用的情况下，它们提供了一种优雅的解决方案。\n\n### 示例 1.13\n\n\
  ```java\nclass ErrorTest13 {\n    int age;\n    void setAge(int a) {\n        if(a>0)\n\
  \            age = a;\n        else {\n            NullPointerException e = new\
  \ NullPointerException(\"Admission Failed\");\n            e.initCause(new ArithmeticException(\"\
  Age is invalid\"));\n            throw e;\n        }\n    }\n    public static void\
  \ main(String args[]) {\n        ErrorTest13 a1 = new ErrorTest13();\n        try\
  \ {\n            a1.setAge(20);\n            a1.setAge(-10);\n        } catch(NullPointerException\
  \ e) {\n            System.out.println(e.getMessage());\n            System.out.println(e.getCause());\n\
  \        }\n    }\n}\n```\nOutput:\n```\nAdmission Failed\nAge is Invalid\n```\n\
  ![sss](img/image034.jpg)\n\n在这个示例中，顶层异常是 `NullPointerException`。它被添加了一个原因异常 `ArithmeticException`。当异常从\
  \ `demroc()` 抛出时，它被 `main()` 捕获。在那里，显示顶层异常，随后通过调用 `getCause()` 获取底层异常。链式异常可以持续到所需的深度。因此，原因异常本身也可以有原因。请注意，过长的异常链可能表明设计不当。链式异常并不是每个程序都需要的。但在了解底层原因有用的情况下，它们提供了一种优雅的解决方案。\n\
  \n## 三个 JDK 7 新异常特性（已更新）\n\nJDK 7 为异常系统增加了三个有趣且实用的特性。第一个是在资源不再需要时自动释放（例如文件）。它是基于\
  \ `try` 语句的扩展形式 `try-with-resources`，将在后续介绍文件的章节中介绍。\n\n第二个新特性是 `multi-catch`，第三个有时被称为\
  \ `final rethrow` 或更精确的重抛。这两个特性将在此处描述。\n\n`multi-catch` 特性允许两个或多个异常由同一个 `catch`\
  \ 语句捕获。尽管处理的是不同的异常，但多个异常处理器使用相同的代码序列并不常见。不需要单独捕获每个异常类型，现在可以使用单个 `catch` 子句处理所有异常，从而避免代码重复。\n\
  \n要使用 `multi-catch`，用 OR 操作符分隔 `catch` 子句中的每个异常类型。每个 `multi-catch` 参数隐式为 `final`。（如果需要可以显式指定\
  \ `final`，但没有必要。）\n\n由于每个 `multi-catch` 参数隐式为 `final`，因此不能被赋值新值。\n\n这是一个使用 `multi-catch`\
  \ 特性捕获 `ArithmeticException` 和 `ArrayIndexOutOfBoundsException` 的 `catch` 语句：\n\n\
  ```java\ncatch(ArithmeticException | ArrayIndexOutOfBoundsException e)\n```\n\n\
  下面的程序展示了 `multi-catch` 特性的用法：\n\n```java\n// 演示 JDK 7 的 multi-catch 特性\nclass MultiCatch\
  \ {\n    public static void main(String args[]) {\n        int a=10, b=0;\n    \
  \    int vals[] = { 1, 2, 3 };\n        try {\n            int result = a / b; //\
  \ 生成 ArithmeticException\n            // vals[10] = 19; // 生成 ArrayIndexOutOfBoundsException\n\
  \            // 此 catch 子句捕获这两个异常。\n        } catch(ArithmeticException | ArrayIndexOutOfBoundsException\
  \ e) {\n            System.out.println(\"Exception caught: \" + e);\n        }\n\
  \        System.out.println(\"After multi-catch.\");\n    }\n}\n```\n\n当尝试除以零时，程序将生成\
  \ `ArithmeticException`。如果你注释掉除法语句并移除下一行的注释符号，则会生成 `ArrayIndexOutOfBoundsException`。这两个异常都由同一个\
  \ catch 语句捕获。\n\n\n\n\n\n更精确的重新抛出（rethrow）功能限制了可以重新抛出的异常类型，仅限于关联的 `try` 块抛出的、且未被先前的\
  \ `catch` 句处理的、并是参数的子类或父类的检查异常。\n\n虽然这种能力可能并不常用，但现在已经可以使用。为了使精确的重新抛出功能生效，`catch`\
  \ 参数必须是有效最终（effectively final），这意味着它在 `catch` 块内部不能被赋予新值，或者必须显式声明为 `final`。\n\n\
  ## 使用异常\n\n异常处理为具有许多动态运行时特性的复杂程序提供了一种强大的机制。将 `try`、`throw` 和 `catch` 视为处理程序逻辑中错误和异常边界条件的整洁方式是非常重要的。与其他使用错误返回代码来指示失败的语言不同，Java\
  \ 使用异常。因此，当一个方法可能会失败时，让它抛出一个异常。\n\n这是一种处理失败模式更干净的方法。最后一点：Java 的异常处理语句不应被视为非局部分支的通用机制。如果你这样做，只会让你的代码变得混乱并难以维护。\n\
  \n## 理论题\n\n1. 什么是异常？\n2. 我们如何定义一个 `try` 块？\n3. 我们如何定义一个 `catch` 块？\n4. 列出 Java\
  \ 中可能发生的一些常见异常类型给出示例。\n5. 捕获所有类型的异常是必须的吗？\n6. 一个 `try` 块可以使用多少个 `catch` 块。\n7. 创建一个可能产生三种异常的\
  \ `try` 块，然后结合必要的 `catch` 块以捕获并妥善处理它们。\n8. `finally` 块是什么？它何时以及如何使用？给出一个合适的示例。\n\
  9. 解释异常处理机制如何用于程序调试。\n\n![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)\n\
  \n![STAR-LOGO-2013](img/image024.png)\n\n# 第 12 章\n\n## (多线程编程)\n\n### 引言\n\n线程是程序内部的单一控制流。线程与进程非常相似。事实上，线程也被称为轻量级进程。\n\
  \n## 线程对比进程\n\n通常，不同的进程占用不同的内存空间。当 CPU 从一个进程切换到另一个进程时，当前运行进程的状态会被保存，另一个进程的状态会被恢复。在状态切换期间没有进行任何有用工作。状态切换时间应该尽可能短，以最大化\
  \ CPU 的利用率。\n\n线程也像是独立的进程，但它们共享相同的内存和状态。各个线程也有独立的状态，但与进程状态相比，状态非常小。状态可能只包含程序计数器和栈指针。因此，从一个线程切换到另一个线程所需的时间非常短。因此，与进程相比，线程的上下文切换时间非常短。因此，多线程的情况下\
  \ CPU 利用率比多进程的情况下高。\n\n## 多线程程序\n\n多线程程序包含两个或多个可以并发运行的部分。此类程序的每个部分被称为线程，每个线程定义了一条独立的执行路径。因此，多线程是多任务处理的一种特殊形式。\n\
  \n例如，一个程序可能有三个线程：\n* 一个负责打印。\n* 一个负责编辑。\n* 一个负责从互联网下载文件。\n\n所有这些线程可能都在并发运行，从而最大化\
  \ CPU 的利用率。\n\n## 基于进程的多任务处理\n\n大多数操作系统允许我们同时运行两个或多个程序。这被称为基于进程的多任务处理。例如，我们可以运行一个\
  \ Java 程序，同时在编辑一个文字文档。基于进程的多任务处理确保了大部分时间内会有程序要执行，因此增加了 CPU 的利用率。\n\n在基于进程的多任务处理中，程序是调度程序可以分发的最小代码单元。\n\
  \n## 基于线程的多任务处理\n\n线程是基于线程的任务处理环境中的最小执行单元。一个进程可以被分为若干并发执行的线程。这允许我们在单个程序中并发处理多个一个任务。\n\
  \n例如，我们可以编辑一个文字文档。基于线程的任务处理提高了 CPU 的利用率。\n\n## Java 线程模型\n\nJava 运行时系统在许多方面依赖线程，并且所有的类库都是为多线程设计的。这有助于通过防止\
  \ CPU 周期浪费来降低效率。\n\n## 线程生命周期（线程状态）\n\n线程存在多种状态。线程可以处于运行状态。它可以处于就绪状态。运行中的线程可以被挂起，从而暂时停止其活动。挂起的线程随后可以恢复。当线程在等待资源时会处于阻塞状态。在任何时候，线程都可以终止。\n\
  \n### 1. 新生状态\n\n当我们创建一个线程对象时，线程就出生了，被称为处于新生状态。线程尚未被调度运行。\n\n在此状态下，我们只能对它执行以下任一操作：\n\
  1. 使用 `start()` 方法调度它运行。\n2. 使用 `stop()` 方法将其杀死。\n\n如果被调度，它将移动到可运行状态（runnable）。如果我们尝试在此状态下使用任何其他方法，将抛出异常。\n\
  \n### 2. 可运行状态\n\n可运行状态意味着线程已准备好执行，并正在等待处理器的可用。也就是说，线程已经加入了等待执行的线程队列。如果所有线程的优先级相同，则会以时间轮询的方式给它们执行时间片。\n\
  \n放弃控制权的线程会加入队列末尾并再次等待轮到。然而，如果我们想让一个线程在轮到它之前将控制权让给另一个等优先级的线程，可以通过调用 `yield()` 方法来实现。\n\
  \n### 3. 运行状态\n\n运行意味着处理器已经将时间分配给该线程进行执行。运行中的线程在以下情况之一可能会放弃控制权：\n* 它的时间片结束。\n* 被高优先级线程抢占。\n\
  * 它让出，即自愿放弃控制权。\n* 它完成了执行。\n* 它被其他线程停止。\n\n\n\n\n\n*   它已使用 `suspend()` 方法挂起。被挂起的线程可以通过\
  \ `resume()` 方法恢复。当我们由于某些原因想挂起线程一段时间，但不想杀死它时，这种方法非常有用。\n*   它被告知等待直到某个事件发生。这是通过\
  \ `wait()` 方法实现的。可以使用 `notify()` 方法调度线程再次运行。\n*   它正在执行某些 I/O 操作。\n\n### 4. 阻塞状态\
  \ (Blocked State)\n\n当线程被阻止进入可运行（runnable）状态以及随后的运行（running）状态时，该线程被称为阻塞。这发生在线程为了满足某些要求而挂起、睡眠或等待时。阻塞线程被视为“不可运行”，但并未死亡，因此完全有资格再次运行。\n\
  \n### 5. 死亡状态 (Dead State)\n\n每个线程都有生命周期。运行中的线程在完成其 `run()` 方法的执行后结束生命。它会自然死亡。然而，我们可以在任何状态下向它发送停止消息来杀死它，从而导致过早死亡。线程可以在一出生时被杀死，或者在运行期间被杀死，甚至在处于“不可运行”（阻塞状态）时被杀死。\n\
  \n### 线程优先级 (Thread Priorities)\n\nJava 为每个线程分配了一个优先级，该优先级决定了与其他线程相比如何处理该线程。线程优先级是整数，指定了线程线程相对于另一个线程的相对优先级。\n\
  \n作为一个绝对值，优先级是没有意义的；如果只有一个线程在运行，那么高优先线程的运行速度并不比低优先线程快。相反，线程的优先级用于决定何时从一个运行线程切换到下一个线程。这被称为上下文切换（context\
  \ switch）。决定何时发生上下文切换的规则很简单：\n\n*   线程可以自愿地（自己）放弃控制权。这是通过显式地让出（yielding）、睡眠（sleeping）、阻塞（blocking）或等待\
  \ I/O（pending I/O）来实现的。在这种情况下，将检查所有其他线程，并且通常会将优先级最高且准备好运行的线程分配 CPU。\n*   线程可以被高优先级线程抢占。在这种情况下，一个不让出处理器的低优先级线程无论正在做什么，都会被一个高优先级线程直接抢占。基本上，只要高优先级线程想要运行，它就会运行。这被称为抢占式多任务处理（preemptive\
  \ multitasking）。\n*   某些操作系统支持非抢占的优先级调度。在这种情况下，只有当低优先级线程完成时，高优先级线程才能获得机会。\n*   在两个优先级相同的线程竞争\
  \ CPU 周期的情况下，情况会有点复杂。对于像 windows98 这样的操作系统，等优先线程必须自愿地（自己）让出（放弃）控制权给同级线程。如果不这样做，其他线程将不会运行。\n\
  \n注意：操作系统切换等优先级线程的方式存在差异可能会产生问题。\n\n## 同步 (Synchronization)\n\n由于多线程为我们的程序引入了异步行为，我们必须在需要时有一种方法来强制执行同步。例如，如果我们想让两个线程通信并共享复杂的数据结构（如链表），我们需要某种方法来确保它们之间不发生冲突。\n\
  \n也就是说，我们必须防止一个线程在另一个线程正在读取数据时写入数据。Java 使用监视器（monitor）进行线程间同步。我们可以将监视器想象为一个只能容一个线程的小盒子。一旦线程进入监视器，它就可以用来保护共享资源不被多个线程同时操作。\n\
  \n大多数多线程系统以对象的形式暴露，我们的程序必须显式地获取并锁定。Java 提供了一个更整洁的解决方案。\n\n没有名为“monitor”的类，相反，每个对象都有自己的隐式监视器，当调用对象的\
  \ `synchronized` 方法时，监视器会自动进入。一旦线程进入 `synchronized` 方法，其他线程就无法调用同一对象上的任何其他 `synchronized`\
  \ 方法。这使我们能够编写非常清晰、简洁的多线程代码，因为同步支持内置在语言中。\n\n## 消息传递 (Messaging)\n\n当使用大多数其他语言进行编程时，我们必须依赖操作系统建立线程之间的通信。\n\
  \n这无疑会增加开销。相比之下，Java 提供了一种整洁、低成本的方法让两个或多个线程相互通信，通过调用所有对象都具有的定义方法。Java 的消息系统允许线程进入对象的\
  \ `synchronized` 方法，然后在那里等待，直到其他线程显式地通知它离开。\n\n### Thread 类和 Runnable 接口\n\nJava\
  \ 的多线程系统构建在 `Thread` 类、其方法及其伴侣接口 `Runnable` 之上。该类属于 `java.lang` 包，因此不需要显式导入它。\n\n\
  `Thread` 封装了一个执行线程，由于我们无法直接引用运行线程的内部状态，我们将通过它的代理（即产生它的 `Thread` 实例）来处理它。要创建一个新线程，我们的程序将扩展\
  \ `Thread` 类或实现 `Runnable` 接口。`Thread` 类定义了几个帮助管理线程的方法：\n\n| 方法 | 描述 |\n| :--- |\
  \ :--- |\n| `String getName()` | 返回此线程的名字 |\n| `int getPriority()` | 返回此线程的优先级 |\n\
  | `boolean isAlive()` | 测试此线程仍在运行 |\n| `void join()` | 等待此线程死亡（终止） |\n| `void run()`\
  \ | 如果此线程是使用单独 `Runnable` 对象构造的，则调用该 `Runnable` 对象的 `run` 方法；否则，此方法什么都不做并返回；如果扩展了类并在子类中重写了\
  \ `run()` 方法，则调用被重写的 `run()` 方法。 |\n| `void setName(String name)` | 将此线程更改为参数 |\n\
  | `static void sleep(long millis)` | 让当前执行线程睡眠指定的毫秒数 |\n| `static void sleep(long\
  \ millis, int nanos)` | 让当前执行线程睡眠指定的毫秒和纳秒数 |\n| `void start()` | 启动线程执行，Java 虚拟机调用此线程的\
  \ `run` 方法 |\n| `static void yield()` | 让当前执行线程对象临时暂停并允许其他线程执行 |\n| `static Thread\
  \ currentThread()` | 返回当前执行线程引用 |\n\n### 主线程 (The main thread)\n\n当 Java 程序启动时，一个线程立即开始。这通常被称为程序的主线程，因为它是程序开始时执行的线程。主线程是创建其他“子”线程的线程。\n\
  \n虽然主线程是在程序启动时自动创建的，但可以通过 `Thread` 对象对其进行控制。为了这样做，我们需要通过调用 `currentThread()` 方法获取其引用，该方法是\
  \ `Thread`类的公共静态成员。\n\n该方法返回调用它的线程的引用。一旦有了主方法的引用，我们就可以像任何其他线程一样控制它。\n\n### 示例 12.1\n\
  \n下面的示例演示了如何获取主线程的引用，然后使用 `Thread` 类的方法访问其属性。\n\n```java\nclass CurrentThreadTest\
  \ {\n    public static void main (String args[]) {\n        Thread t = Thread.currentThread();\n\
  \        System.out.println(\"Current thread:\" + t);\n        System.out.println(\"\
  Name:\"+ t.getName());\n        System.out.println(\"Priority:\"+ t.getPriority());\n\
  \        t.setName(\"MyThread\");\n        t.setPriority(Thread.MAX_PRIORITY);\n\
  \        System.out.println(\"After name and priority change :\" + t);\n       \
  \ System.out.println(\"Name:\" + t.getName());\n    }\n}\n```\n\n\n\n\n\n```java\n\
  System.out.println(\"Priority:\" + t.getPriority());\n\nfor (int n=1; n<=5; n++)\
  \ {\n    System.out.println(n);\n    try {\n        Thread.sleep(1000);\n    } catch\
  \ (InterruptedException e) {\n        System.out.println(\"Main thread interrupted\"\
  );\n    }\n}\n```\n\n**输出:**\n```text\nCurrent thread:Thread[main,5,main]\nName:main\n\
  Priority:5\nAfter name and priority change :Thread[MyThread,10,main]\nName:MyThread\n\
  Priority:10\n1\n2\n3\n4\n5\n```\n\n**注意 1：** `Thread` 类中的 `sleep()` 方法可能会抛出 `InterruptedException`，这是一个受检异常。如果其他线程想要中断这个正在睡眠的线程，就会发生这种情况。\n\
  \n**注意 2：** 注意当将 `t`（线程引用）作为 `println()` 的参数时产生的输出。它将按顺序显示：线程名称、它的优先级以及它的线程组名称。它的优先级为\
  \ `5`，这是默认值，而 `main` 也是该线程所属线程组的名称。线程组是一个控制整个线程集合状态的数据结构。\n\n## 创建线程\n\n在最通用的意义上，我们通过实例化\
  \ `Thread` 类型的对象来创建线程。Java 识别出两种实现方式的方法：\n\n1. 我们可以实现 `Runnable` 接口。\n2. 我们可以扩展\
  \ `Thread` 类本身。\n\n### 实现 Runnable\n\n创建线程最简单的方法是创建一个实现 `Runnable` 接口的类。要实现 `Runnable`，类只需要实现一个名为\
  \ `run()` 的单一方法。\n\n```java\npublic void run( )\n```\n\n在 `run()` 方法内部，我们将定义构成新线程的代码。`run()`\
  \ 可以调用其他方法、使用其他类并声明变量，就像主线程一样。唯一的区别是，`run()` 为程序中另一个并发执行的线程建立了入口点。该线程将在 `run()`\
  \ 返回时结束。\n\n在我们创建了实现 `Runnable` 的类后，我们将在该类内部使用以下构造函数之一来实例化 `Thread` 类型的对象：\n\n-\
  \ `Thread(Runnable threadObj)`\n- `Thread(Runnable threadObj, String threadName)`\n\
  \n这里 `threadObj` 是调用其 `run` 方法的对象，而 `threadName` 是新线程的名称。在新线程创建后，在没有调用 `start()`\
  \ 方法之前，它不会开始运行。`start()` 方法将线程放入就绪队列（可运行状态）。每当线程被调度时，它的执行将从 `run()` 方法开始。\n\n###\
  \ 示例 12.2\n\n```java\nclass A implements Runnable {\n    public void run() {\n \
  \       for(int i=1;i<=5;i++) {\n            System.out.println(\"Child Thread:\"\
  \ + i);\n        }\n        System.out.println(\"Exiting child thread\");\n    }\n\
  }\nclass RunnableTest {\n    public static void main(String args[]) {\n        A\
  \ a1=new A();\n        Thread t1 = new Thread(a1,”Demo Thread”);\n        t1.start();\n\
  \        System.out.println(\"Main thread exiting\");\n    }\n}\n```\n\n**输出:**\n\
  ```text\nMain thread exiting\nChild Thread:1\nChild Thread:2\nChild Thread:3\nChild\
  \ Thread:4\nChild Thread:5\nExiting child thread\n```\n\n### 示例 12.3\n\n```java\n\
  class A implements Runnable {\n    Thread t;\n    A() {\n        t= new Thread(this,\
  \ “Demo Thread”);\n        System.out.println(\"Child thread: “+ t);\n        t.start();\n\
  \    }\n    public void run() {\n        for (int i=1; i<=5; i++) {\n          \
  \  System.out.println(\"Child Thread: ”+ i );\n            try {\n             \
  \   Thread.sleep(500);\n            } catch (InterruptedException e) {\n       \
  \         System.out.println(e);\n            }\n        }\n        System.out.println\
  \ (“Exiting thread”);\n    }\n}\nclass RunnableTest2 {\n    public static void main\
  \ (String args ) {\n        A a1=new A();\n        for (int i=1; i<=5; i++) {\n\
  \            System.out.println(\"Main Thread:\"+ i);\n            try {\n     \
  \           Thread.sleep (1000);\n            } catch(InterruptedException e) {\n\
  \                System.out.println(“main interrupted”);\n            }\n      \
  \  }\n        System.out.println(“End of thread”);\n    }\n}\n```\n\n**输出:**\n```text\n\
  Child thread: Thread[Demo Thread,5,main]\nMain Thread:1\nChild Thread: 1\nChild\
  \ Thread: 2\nMain Thread:2\nChild Thread: 3\nMain Thread:3\nChild Thread: 4\nMain\
  \ Thread:4\nMain Thread:5\nExiting thread\nEnd of Main thread\n```\n\n### 扩展 Thread\
  \ 类\n\n创建线程的第二方法是创建一个扩展 `Thread` 的类，然后创建该类的实例。扩展类必须重写 `run()` 方法，这是新线程的入口点。它还必须调用\
  \ `start()` 来执行新线程。\n\n### 示例 12.4\n\n```java\nclass A extends Thread {\n    A(\
  \ ) {\n        super (“Test Thread”);\n        System.out.println (“Child thread:”\
  \ + this);\n        start();\n    }\n    public void run () {\n        for (int\
  \ i=1; i<=5; i++) {\n            System.out.println(“Child Thread:”+i);\n      \
  \      try {\n                sleep(500);\n            } catch(InterruptedException\
  \ e) {\n                System.out.println(“thread interrupted”);\n            }\n\
  \        }\n        System.out.println (“Exiting Child thread”);\n    }\n}\nclass\
  \ ThreadTest {\n    public static void main(String args[]) {\n        new A();\n\
  \        for (int i=1; i<=5; i++) {\n            System.out.println(“Main Thread:\
  \ “+i);\n            try {\n                Thread.sleep(100);\n            } catch(InterruptedException\
  \ e) {\n                System.out.println(“thread interrupted”);\n            }\n\
  \        }\n    }\n}\n```\n\n**输出:**\n```text\nChild thread:Thread[Test Thread,5,main]\n\
  Main Thread: 1\nChild Thread:1\nChild Thread:2\nMain Thread:2\nChild Thread:3\n\
  Main Thread:3\nChild Thread:4\nExiting Child thread\n```\n\n## 选择选择方法\n\n`Thread`\
  \ 类定义了多个可以被派生类重写的方法。在这些方法中，必须重写的只有 `run()`。当然，当我们实现 `Runnable` 时也是如此。许多程序员认为，类只有在被增强或修改时才应该扩展。因此，如果我们不需要重写任何\
  \ `Thread` 方法，可能最好的方法是实现 `Runnable`。\n\n### 创建线程：示例 12.5\n\n```java\nclass A implements\
  \ Runnable {\n    String name;\n    Thread t;\n    A(String threadName) {\n    \
  \    name=threadName;\n        t=new Thread(this, name);\n        System.out.println(“Child\
  \ thread:”+t);\n        t.start();\n    }\n    public void run() {\n        for(int\
  \ i=1;i<=5;i++) {\n            System.out.println(t.getName())+ \":\" + i);\n  \
  \          try {\n                Thread.sleep(1000);\n            } catch (InterruptedException\
  \ e) {\n                System.out.println(e);\n            }\n        }\n     \
  \   System.out.println(name+ “Exiting”);\n    }\n}\nclass MultiThreadTest {\n  \
  \  public static void main(String args ) {\n        A a1=new A(“One”);\n       \
  \ A a2=new A(“Two”);\n        A a3=new A(“Three”);\n        try {\n            Thread.sleep(10000);\n\
  \        } catch(InterruptedException e) {\n            System.out.println(“main\
  \ thread interrupted”);\n        }\n        System.out.println (“Main thread exiting”);\n\
  \    }\n}\n```\n\n\n\n\n\n```\nChild thread:Thread[One,5,main]\nChild thread:Thread[Two,5,main]\n\
  Child thread:Thread[Three,5,main]\nOne:1\nTwo:1\nThree:1\nOne:2\nTwo:2\nThree:2\n\
  One:3\nTwo:3\nThree:3\nOne:4\nTwo:4\nThree:4\nOne:5\nTwo:5\nThree:5\nOneExiting\n\
  TwoExiting\nThreeExiting\nMain thread exiting\n```\n\n### 使用 isAlive() 和 join()\
  \ 方法强制执行顺序\n\n通常，我们希望主线程最后结束。实现这一目标的方法之一是在 `main` 中调用 `sleep()`。这是一种比较粗暴（原始）的方法。有两种方法可以判断线程是否已完成。首先，我们可以在线程上调用\
  \ `isAlive()`。该方法由 `Thread` 类定义，其通用形式为：\n\n```\nfinal boolean isAlive()\n```\n\n\
  如果调用该方法的线程仍在运行，则 `isAlive()` 方法返回 `true`；否则返回 `false`。虽然 `isAlive()` 有时有用，但我们更常用的用于等待线程完成的方法是\
  \ `join()`，所示所示：\n\n```\nfinal void join() throws InterruptedException\n```\n\n\
  该方法会等待直到调用它的线程终止。`join()` 的其他形式允许我们指定等待指定线程终止的最长时间。\n\n接下来的示例使用了 `join()` 来确保主线程是最后一个停止的。它还演示了\
  \ `isAlive()` 方法。\n\n### 示例 12.6\n\n```java\nclass A implements Runnable\n{ \n \
  \ String name;\n  Thread t;\n  A(String threadName)\n  { \n    name=threadName;\n\
  \    t=new Thread(this,name);\n    System.out.println(\"Child thread:\"+t);\n  \
  \  t.start();\n  }\n  public void run()\n  { \n    for(int i=1;i<=5;i++)\n     \
  \ { \n        System.out.println(name + \":\"+ i );\n        try\n        { \n \
  \         Thread.sleep(1000);\n        }\n        catch(InterruptedException e)\n\
  \        { \n          System.out.println(e);\n        }\n      }\n    System.out.println(name\
  \ + \"Exiting\");\n  }\n}\nclass DemoJoin\n{ \n  public static void main(String\
  \ args[] )\n  { \n    A ob1=new A(\"One\");\n    A ob2=new A(\"Two\");\n    A ob3=new\
  \ A(\"Three\");\n    System.out.println(\"Thread One is alive?:\"+ob1.t.isAlive());\n\
  \    System.out.println(\"Thread Two is alive?:\"+ob2.t.isAlive());\n    System.out.println(\"\
  Thread Three is alive?:\"+ob3.t.isAlive());\n    try\n    { \n      ob3.t.join();\n\
  \      ob2.t.join();\n      ob1.t.join();\n    }\n    catch(InterruptedException\
  \ e)\n    { \n      System.out.println(\"main thread interrupted\");\n    }\n  \
  \  System.out.println(\"Thread One is alive?:\"+ ob1.t.isAlive());\n    System.out.println(\"\
  Thread Two is alive?:\"+ ob2.t.isAlive());\n    System.out.println(\"Thread Three\
  \ is alive?:\"+ ob3.t.isAlive());\n    System.out.println(\"Main thread exiting\"\
  );\n  }\n}\n```\n\n```\nChild thread:Thread[One,5,main]\nChild thread:Thread[Two,5,main]\n\
  Child thread:Thread[Three,5,main]\nThread One is alive?:true\nThread Two is alive?:true\n\
  Thread Three is alive?:true\nOne:1\nTwo:1\nThree:1\nOne:2\nTwo:2\nThree:2\nOne:3\n\
  Two:3\nThree:3\nOne:4\nTwo:4\nThree:4\nOne:5\nTwo:5\nThree:5\nOneExiting\nTwoExiting\n\
  ThreeExiting\nThread One is alive?:false\nThread Two is alive?:false\nThread Three\
  \ is alive?:false\nMain thread exiting\n```\n\n### 优先级\n\n线程优先级被线程调度器用于决定何时允许每个线程运行。与低优先级线程相比，高优先级线程将被优先调度。高优先级线程也可以抢占低优先级线程。例如，当一个低优先级线程正在运行时，而一个高优先级线程从睡眠或等待\
  \ I/O 中恢复时，它将抢占低优先级线程。理论上，同等优先级的线程应该获得相同的 CPU 访问权限。但 Java 设计用于工作在各种环境中。其中某些环境实现多任务的方式与其他不同。为了安全起见，具有相同优先级的线程应该偶尔让出控制权。这确保了非抢占式操作系统下所有线程都有运行的机会。实践中，即使在非抢占环境中，大多数线程也不可避免地遇到某些情况，如等待\
  \ I/O。当这种情况发生时，阻塞线程被挂起，其他线程可以运行。对于计算密集型线程，我们应该确保它偶尔让出控制权以便其他线程运行。\n\n设置线程优先级使用 `setPriority()`\
  \ 方法，它是 `Thread` 的成员方法。其通用形式为：\n\n```\nfinal void setPriority(int level)\n```\n\n\
  `level` 的值必须在 `Thread.MIN_PRIORITY` 到 `Thread.MAX_PRIORITY` 范围内。这些值目前是 1 和 10。要将线程恢复为默认优先级指定\
  \ `Thread.NORM_PRIORITY`，它目前是 5。我们可以通过调用 `Thread` 的 `getPriority()` 方法获取当前的优先级设置，所示：\n\
  \n```\nfinal void getPriority()\n```\n\nJava 的实现在调度方面存在巨大的差异。Windows XP/98/2000\
  \ 版本的运行方式符合预期。然而，其他版本可能会完全不同。大多数不一致性源于线程依赖抢占式行为而非协作让出 CPU 时间。在 Java 中获得可预测行为的安全方法是使用主动让出\
  \ CPU 的线程。以下示例演示了两个不同优先级的线程，它们在抢占式平台上的运行方式与非抢占式平台并不相同。\n\n### 示例 12.7\n\n```java\n\
  class Clicker implements Runnable\n{ \n  long click = 0;\n  Thread t;\n  volatile\
  \ boolean running=true;\n  Clicker (int p)\n  { \n    t=new Thread (this);\n   \
  \ t.setPriority (p);\n  }\n  public void run ()\n  { \n    while (running)\n   \
  \   { \n        click++;\n      }\n  }\n  void stop ()\n  { \n    running = false;\n\
  \  }\n  void start ()\n  { \n    t.start ();\n  }\n}\nclass HiLoPri\n{ \n  public\
  \ static void main (String args[] )\n  { \n    Thread.currentThread().setPriority(Thread.MAX_PRIORITY);\n\
  \    Clicker hi = new Clicker(Thread.NORM_PRIORITY+1);\n    Clicker lo = new Clicker(Thread.NORM_PRIORITY-1);\n\
  \    lo.start(); hi.start();\n    try\n    { \n      Thread.sleep (10000);\n   \
  \ }\n    catch (InterruptedException e)\n    { \n      System.out.println(e);\n\
  \    }\n    lo.stop(); hi.stop();\n    try\n    { \n      hi.t.join();\n      lo.t.join();\n\
  \    }\n    catch (InterruptedException e)\n    { \n      System.out.println(e);\n\
  \    }\n    System.out.println(\"Low : \" + lo.click);\n    System.out.println(\"\
  High : \" + hi.click);\n  }\n}\n```\n\n```\nLow  : 63660819\nHigh : 2086505403\n\
  ```\n\n\n\n\n\n当两个或多个线程需要访问共享资源时，它们需要某种方式来确保资源在同一时刻只有一个线程使用。实现这一目标的过程被称为同步。\n\n\
  同步的关键是监视器（monitor，也称为信号量）的概念。监视器是一个作为互斥锁的对象。在给定时间内，只有一个线程可以拥有监视器。\n\n当线程获取锁时，认为它进入了监视器。所有其他尝试进入被锁监视器的线程将被挂起，直到第一个线程退出监视器。这些其他线程被称为等待监视器。拥有监视器的线程如果需要，可以重新进入同一个监视器。我们可以通过两种方式对代码进行同步：\n\
  \n(i) 使用 `synchronized` 方法\n(ii) 使用 `synchronized` 语句\n\n## 使用同步方法\n\n在 Java 中，同步是简单的，因为所有对象都有与其关联的隐式监视器。要进入对象的监视器，只需调用用\
  \ `synchronized` 关键字修饰的方法。当一个线程在 `synchronized` 方法内部时，所有尝试调用该方法（或同一实例上的任何其他 `synchronized`\
  \ 方法）的其他线程都必须执行 `wait()`。要退出监视器并将对象的控制权交给下一个等待的线程，监视器的所有者只需从 `synchronized` 方法返回即可。\n\
  \n### 示例 12.8\n\n下面的程序说明了由于三个线程并发运行，它们产生的输出会混杂。\n\n```java\nclass A\n{\n  void display(String\
  \ msg)\n  {\n    System.out.print(\"[\" + msg);\n    try\n      {\n        Thread.sleep(1000);\n\
  \      }\n      catch(InterruptedException e)\n      {\n        System.out.println(e);\n\
  \      }\n      System.out.println(\"]\");\n  }\n}\nclass B implements Runnable\n\
  {\n  A obj;\n  String msg;\n  Thread t;\n  B(A obj1, String m)\n    {\n      msg\
  \ = m;\n      obj = obj1;\n      t = new Thread(this);\n      t.start();\n    }\n\
  \  public void run()\n    {\n      obj.display(msg);\n    }\n}\nclass Synch1\n{\n\
  \  public static void main(String args[])\n    {\n      A a1 = new A();\n      B\
  \ b1 = new B(a1,\"Hello\");\n      B b2 = new B(a1,\"World\");\n      B b3 = new\
  \ B(a1,\"Matrix\");\n    }\n}\n```\n\n输出：\n```\n[Hello[World[Matrix]\n]\n]\n```\n\
  \n正如我们所见，通过调用 `sleep()`，call() 方法允许执行切换到另一个线程。这导致了三个消息字符串的输出混杂。在这个程序中，没有任何机制可以阻止三个线程同时在同一个对象上调用同一个方法。\n\
  \n这被称为竞态条件（race condition），因为这三个线程正在相互竞争以完成该方法。这个示例使用 `sleep()` 使效果变得重复且明显。在大多数情况下，竞态条件更加微妙且不可预测，因为我们无法确定上下文切换何时发生。这可能导致程序在某运行时是正确的，下次运行时是错误的。\n\
  \n为了做到这一点，我们只需要在方法 `display()` 定义之前加上 `synchronized` 关键字。这可以防止任何线程在另一个线程正在使用 `display()`\
  \ 时进入该方法。\n\n### 示例 12.9\n\n通过简单地将 `call()` 方法声明为 `synchronized` 方法，就解决了输出混杂的问题。\n\
  \n```java\nclass A\n{\n  synchronized void display(String msg)\n  {\n    System.out.print(\"\
  [\" + msg);\n    try\n      {\n        Thread.sleep(1000);\n      }\n      catch(InterruptedException\
  \ e)\n      {\n        System.out.println(e);\n      }\n      System.out.println(\"\
  ]\");\n  }\n}\nclass B implements Runnable\n{\n  A obj;\n  String msg;\n  Thread\
  \ t;\n  B(A obj1, String m)\n    {\n      msg = m;\n      obj = obj1;\n      t =\
  \ new Thread(this);\n      t.start();\n    }\n  public void run()\n    {\n     \
  \ obj.display(msg);\n    }\n}\nclass Synch2\n{\n  public static void main(String\
  \ args[])\n    {\n      A a1 = new A();\n      B b1 = new B(a1,\"Hello\");\n   \
  \   B b2 = new B(a1,\"World\");\n      B b3 = new B(a1,\"Matrix\");\n    }\n}\n\
  ```\n\n输出：\n```\n[Hello]\n[World]\n[Matrix]\n```\n注意：一旦线程进入了实例上的任何同步方法，其他线程就无法进入该实例上的任何其他同步方法。然而，该实例上的非同步方法仍然可以调用。\n\
  \n## 使用同步语句\n\n虽然在我们创建的类创建 `synchronized` 方法是实现同步的一种简单有效的方法，但它在所有情况下都不适用。要理解为什么，请考虑以下情况。假设我们要对一个并非设计用于多线程访问的类的对象进行同步。也就是说，该类没有使用\
  \ `synchronized` 方法。此外，该类不是我们创建的，而是第三方；我们无法访问源代码。因此，我们无法在该类内部适当的方法添加 `synchronized`\
  \ 修饰符。如何通过同步访问该类的对象呢？\n\n解决方案是在类方法内部放入 `synchronized` 块。`synchronized` 语句的通用形式是：\n\
  \n```java\nsynchronized(object)\n{\n  statements to be\n}\n```\n在这里，`object` 是被同步对象的引用。当前线程成功进入了\
  \ `object` 的监视器。\n\n### 示例 12.10\n\n使用 `synchronized` 块的另一种版本，在 `run()` 方法中在前一个示例的基础上：\n\
  \n```java\nclass A\n{\n  void display(String msg)\n  {\n    System.out.print(\"\
  [\" + msg);\n    try\n      {\n        Thread.sleep(1000);\n      }\n      catch(InterruptedException\
  \ e)\n      {\n        System.out.println(e);\n      }\n      System.out.println(\"\
  ]\");\n  }\n}\nclass B implements Runnable\n{\n  A obj;\n  String msg;\n  Thread\
  \ t;\n  B(A obj1, String m)\n    {\n      msg = m;\n      obj = obj1;\n      t =\
  \ new Thread(this);\n      t.start();\n    }\n  public void run()\n    {\n     \
  \ synchronized(obj)\n      {\n        obj.display(msg);\n      }\n    }\n}\nclass\
  \ Synch3\n{\n  public static void main(String args[])\n    {\n      A a1 = new A();\n\
  \      B b1 = new B(a1,\"Hello\");\n      B b2 = new B(a1,\"World\");\n      B b3\
  \ = new B(a1,\"Matrix\");\n    }\n}\n```\n输出：\n```\n[Hello]\n[World]\n[Matrix]\n\
  ```\n\n## 在不同对象上调用同一方法\n\n### 示例 12.11\n\n线程可以在不同对象上调用同一个同步方法，因为每个对象都有不同的锁。这再次会导致输出混杂。\n\
  \n```java\nclass A\n{\n  synchronized void display(String msg)\n  {\n    System.out.print(\"\
  [\" + msg);\n    try\n      {\n        Thread.sleep(1000);\n      }\n      catch(InterruptedException\
  \ e)\n      {\n        System.out.println(e);\n      }\n      System.out.println(\"\
  ]\");\n  }\n}\nclass B implements Runnable\n{\n  A obj;\n  String msg;\n  Thread\
  \ t;\n  B(A obj1, String m)\n    {\n      msg = m;\n      obj = obj1;\n      t =\
  \ new Thread(this);\n      t.start();\n    }\n  public void run()\n    {\n     \
  \ obj.display(msg);\n    }\n}\nclass Synch4\n{\n  public static void main(String\
  \ args[])\n    {\n      A a1 = new A();\n      A a2 = new A();\n      A a3 = new\
  \ A();\n      B b1 = new B(a1,\"Hello\");\n      B b2 = new B(a2,\"World\");\n \
  \     B b3 = new B(a3,\"Matrix\");\n    }\n}\n```\n\n输出：\n```\n[Hello[World[Matrix]\n\
  ]\n]\n```\n\n\n\n\n\n# 使用静态同步方法\n\n### 示例 12.12\n\n在下面的示例中，尽管我们在不同的对象上调用了 `display()`\
  \ 方法，但输出并没有混杂。原因是 `display()` 方法是 `static`（静态的），因此锁是针对整个类 `A` 获取的，而不是针对单个对象。\n\n\
  ```java\nclass A\n{\n    static synchronized void display(String msg)\n    {\n \
  \     System.out.print(\"[\" + msg);\n      try\n      {\n        Thread.sleep(1000);\n\
  \      }\n      catch(InterruptedException e)\n      {\n        System.out.println(e);\n\
  \      }\n      System.out.println(\"]\");\n    }\n}\nclass B implements Runnable\n\
  {\n    A obj;\n    String msg;\n    Thread t;\n    B(A obj1, String m)\n    {\n\
  \      msg = m;\n      obj = obj1;\n      t = new Thread(this);\n      t.start();\n\
  \    }\n    public void run()\n    {\n      obj.display(msg);\n    }\n}\nclass Synch5\n\
  {\n    public static void main(String args[])\n    {\n      A a1 = new A();\n  \
  \    A a2 = new A();\n      A a3 = new A();\n      B b1 = new B(a1,\"Hello\");\n\
  \      B b2 = new B(a2,\"World\");\n      B b3 = new B(a3,\"Matrix\");\n    }\n\
  }\n```\n\n**输出：**\n```\n[Hello]\n[World]\n[Matrix]\n```\n\n## 线程间通信\n\n前面讨论过，多线程通过将我们的任务分为离散的逻辑单元来取代事件循环编程。线程还证明了次要优点：它们消除了轮询（polling）。轮询通常通过循环实现，用于重复地检查某些条件。一旦条件成立，就会采取相应的行动。\n\
  \n这浪费了 CPU 周期。例如，考虑经典的队列问题，其中一个线程产生数据，另一个线程消耗这些数据。为了让该问题更具交互性，假设生产者必须等待消费者完成任务才能生成更多数据。在轮询系统中，消费者在等待生产者生产时会浪费许多\
  \ CPU 周期。一旦生产者完成，它就会开始轮询，浪费更多的 CPU 周期来等待消费者完成，以此此类推。\n\n为了避免轮询，Java 通过 `wait()`、`notify()`\
  \ 和 `notifyAll()` 方法包含了一种优雅（智能）的进程间通信机制。这些方法在 `Object` 类中被实现为 `final` 方法，因此所有类都拥有这些方法。所有三个方法只能在\
  \ `synchronized` 语文中调用。\n\n- `wait()` 告诉调用线程放弃监视器（monitor）并睡眠，直到其他线程进入同一个监视器并调用\
  \ `notify()`。\n- `notify()` 唤醒在同一对象上调用过 `wait` 的线程（通常是第一个线程）。\n- `notifyAll()` 唤醒在同一对象上调用过\
  \ `wait()` 的所有线程。通常优先级最高的线程将运行。\n\n这些方法在 `Object` 类中声明，如下所示：\n\n```java\nfinal void\
  \ wait() throws InterruptedException\nfinal void notify()\nfinal void notifyAll()\n\
  ```\n\n### 示例 12.13\n\n下面的示例程序错误地实现了一个简单的生产者/消费者问题。它由四个类组成：`Q`，我们正尝试同步的队列；`Producer`，产生队列条目的线程对象；`Consumer`，消耗队列条目的线程对象；以及\
  \ `PC`，创建单个 `Q`、`Producer` 和 `Consumer` 的微类。\n\n```java\nclass Q\n{ \n    int n;\n\
  \    synchronized int get()\n    { \n      System.out.println(\"Got:\"+n);\n   \
  \   return n;\n    }\n    synchronized void put(int n)\n    {\n      this.n=n;\n\
  \      System.out.println(\"Put:\"+n);\n    }\n}\nclass Producer implements Runnable\n\
  {\n    Q q1;\n    Producer(Q q2)\n    {\n      q1=q2;\n      new Thread(\"Producer\"\
  ).start();\n    }\n    public void run()\n    { \n      int i=0;\n      while(true)\n\
  \      { \n        q1.put(++i);\n      }\n    }\n}\nclass Consumer implements Runnable\n\
  {\n    Q q1;\n    Consumer(Q q2)\n    {\n      q1=q2;\n      new Thread(\"Consumer\"\
  ).start();\n    }\n    public void run()\n    { \n      while (true)\n      { \n\
  \        q1.get();\n      }\n    }\n}\nclass PC\n{\n    public static void main(String\
  \ args[])\n    {\n      Q q1=new Q();\n      new Producer(q1);\n      new Consumer(q1);\n\
  \      System.out.println(\"Press Control-C to stop\");\n    }\n}\n```\n\n尽管 `Q`\
  \ 上的 `put()` 和 `get()` 方法是同步的，但没有什么能阻止生产者超过消费者，也没有什么能阻止消费者两次消耗相同的值。因此，我们得到如下所示的错误输出：\n\
  \n**输出：**\n```\nPress Control-C to stop\nPut:1\nPut:2\nPut:3\nPut:4\nPut:5\nPut:6\n\
  Put:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nPut:8\nPut:9\nPut:10\nPut:11\n\
  Put:12\nPut:13\nPut:14\nPut:15\nGot:15\nGot:15\nGot:15\nGot:15\nGot:15\nGot:15\n\
  Got:15\n```\n*(注：原文示例输出在某处截断，此处根据逻辑补全了可能的输出流)*\n\n在 Java 中编写此程序的正确方法是在两个方向上使用 `wait()`\
  \ 和 `notify()` 信号，如下文所示：\n\n```java\nclass Q\n{ \n    int n;\n    boolean valueSet=false;\n\
  \    synchronized int get ()\n    { \n      if(!valueSet)\n      { \n        try\n\
  \        { \n          wait();\n        }\n        catch (InterruptedException e)\n\
  \        { \n          System.out.println(e);\n        }\n      }\n      System.out.println(\"\
  Got :\" + n);\n      valueSet = false;\n      notify();\n      return n;\n    }\n\
  \    synchronized void put (int n)\n    { \n      if(valueSet)\n      { \n     \
  \   try\n        { \n          wait();\n        }\n        catch (InterruptedException\
  \ e)\n        { \n          System.out.println(e);\n        }\n      }\n      this.n=n;\n\
  \      System.out.println(\"Put:\" + n);\n      valueSet = true;\n      notify();\n\
  \    }\n}\nclass Producer implements Runnable\n{\n    Q q1;\n    Producer(Q q2)\n\
  \    {\n      q1=q2;\n      new Thread(\"Producer\").start();\n    }\n    public\
  \ void run()\n    { \n      int i=0;\n      while(true)\n      { \n        q1.put(++i);\n\
  \      }\n    }\n}\nclass Consumer implements Runnable\n{\n    Q q1;\n    Consumer(Q\
  \ q2)\n    {\n      q1=q2;\n      new Thread(\"Consumer\").start();\n    }\n   \
  \ public void run()\n    { \n      while (true)\n      { \n        q1.get();\n \
  \     }\n    }\n}\nclass PC2\n{\n    public static void main(String args[])\n  \
  \  {\n      System.out.println(\"Press Control-C to stop\");\n      Q q1=new Q();\n\
  \      new Producer(q1);\n      new Consumer(q1);\n    }\n}\n```\n\n## 死锁\n\n我们需要避免的一种专门与多任务相关的特殊类型错误是死锁，它发生在两个线程对一对同步对象产生循环依赖时。例如，假设一个线程进入对象\
  \ `X` 的监视器，另一个线程进入对象 `Y` 的监视器。如果 `X` 线程尝试调用 `Y` 的任何同步方法，它将如预期地阻塞。然而，如果 `Y` 线程反过来尝试调用\
  \ `X` 的任何同步方法，该线程将永远等待，因为为了访问 X，它必须释放对 Y 的锁以便第一个线程完成。死锁是一个很难调试的错误，原因有两个：\n\n(i))\
  \ 通常情况下，它只在两个线程的时间分片恰合适时极少发生。\n(ii)) 它可能涉及两个以上的线程和两个同步对象。\n\n### 示例 12.15\n\n```java\n\
  class A\n{\n    synchronized void foo(B b1)\n    {\n}\n```\n\n\n\n\n\n```java\n\
  \      System.out.println(\"Method foo called and then blocked\");\n      try {\n\
  \        Thread.sleep(1000);\n      } catch(InterruptedException e) {\n        System.out.println(e.getMessage());\n\
  \      }\n      System.out.println(\"Trying to call b1.last()\");\n      b1.last();\n\
  }\n\nsynchronized void last() {\n    System.out.println(\"This will not be printed\"\
  );\n}\n}\n\nclass B {\n    synchronized void bar(A a1) {\n        System.out.println(\"\
  Method bar called and then blocked\");\n        try {\n            Thread.sleep(1000);\n\
  \        } catch(InterruptedException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n        System.out.println(\"Trying to call a1.last()\");\n        a1.last();\n\
  \    }\n\n    synchronized void last() {\n        System.out.println(\"This will\
  \ not be printed\");\n    }\n}\nclass DeadLock implements Runnable {\n    A a1 =\
  \ new A();\n    B b1 = new B();\n\n    DeadLock() {\n        Thread t = new Thread(this);\n\
  \        t.start();\n        a1.foo(b1);\n    }\n\n    public void run() {\n   \
  \     b1.bar(a1);\n    }\n\n    public static void main(String args[]) {\n     \
  \   new DeadLock();\n    }\n}\n```\n\nOutput:\n```\nMethod foo called and then blocked\n\
  Method bar called and then blocked\nTrying to call b1.last()\nTrying to call a1.last()\n\
  ```\n\n### 在 Java 1.1 及之前的版本中挂起、恢复和停止线程：\n\n在 Java 2 之前，`suspend()` 和 `resume()`\
  \ 由 `Thread` 类定义，用于暂停和重启线程执行。它们的格式如下所示。\n\n```java\nfinal void suspend()\nfinal\
  \ void resume()\n```\n\n####  12.16:\n\n```java\nclass A implements Runnable {\n\
  \    String name;\n    Thread t;\n\n    A(String threadname) {\n        name = threadname;\n\
  \        t = new Thread(this, name);\n        System.out.println(\"Child Thread:\
  \ \" + t);\n        t.start();\n    }\n\n    public void run() {\n        for(int\
  \ i=1; i<=30;i++) {\n            System.out.println(name + \": \" + i);\n      \
  \      try {\n                Thread.sleep(100);\n            } catch(InterruptedException\
  \ e) {\n                System.out.println(e);\n            }\n        }\n     \
  \   System.out.println(name + \" exiting\");\n    }\n}\n\nclass SuspendResume {\n\
  \    public static void main(String args[]) {\n        A ob1 = new A(\"One\");\n\
  \        A ob2 = new A(\"Two\");\n        try {\n            Thread.sleep(1000);\n\
  \            ob1.suspend();\n            System.out.println(\"Suspending one\");\n\
  \            Thread.sleep(1000);\n            ob1.resume();\n            System.out.println(\"\
  Resuming one\");\n            ob2.suspend();\n            System.out.println(\"\
  Suspending two\");\n            Thread.sleep(1000);\n            ob2.resume();\n\
  \            System.out.println(\"Resuming two\");\n        } catch(InterruptedException\
  \ e) {\n            System.out.println(e);\n        }\n        try {\n         \
  \   System.out.println(\"Waiting for threads to finish\");\n            ob1.t.join();\n\
  \            ob2.t.join();\n        } catch(InterruptedException e) {\n        \
  \    System.out.println(e);\n        }\n    }\n}\n```\n\nOutput:\n```\nChild Thread:\
  \ Thread[One,5,main]\nChild Thread: Thread[Two,5,main]\nOne: 1\nTwo: 1\nOne: 2\n\
  Two: 2\nOne: 3\nTwo: 3\nOne: 4\nTwo: 4\nOne: 5\nTwo: 5\nOne: 6\nTwo: 6\nOne: 7\n\
  Two: 7\nOne: 8\nTwo: 8\nOne: 9\nTwo: 9\nOne: 10\nSuspending one\nTwo: 11\nTwo: 12\n\
  Two: 13\nTwo: 14\nTwo: 15\nTwo: 16\nTwo: 17\nTwo: 18\nTwo: 19\nTwo: 20\nResuming\
  \ one\nSuspending two\nOne: 11\nOne: 12\nOne: 13\nOne: 14\nOne: 15\nOne: 16\nOne:\
  \ 17\nOne: 18\nOne: 19\nOne: 20\nResuming two\nOne: 21\nTwo: 21\nOne: 22\nTwo: 22\n\
  One: 23\nTwo: 23\nOne: 24\nTwo: 24\nOne: 25\nTwo: 25\nOne: 26\nTwo: 26\nOne: 27\n\
  Two: 27\nOne: 28\nTwo: 28\nOne: 29\nTwo: 29\nOne: 30\nTwo: 30\nOne exiting\nTwo\
  \ exiting\nWaiting for threads to finish\n```\n\n注意：- `suspend()` 方法定义了挂起线程。一旦线程被挂起，它可以通过\
  \ `resume()` 方法恢复。其签名如下：\n\n```java\nfinal void suspend()\n```\n\nJava 2 之后，`stop()`\
  \ 方法被废弃，因为一旦线程被停止，它就无法被恢复。其签名如下：\n\n```java\nfinal void stop()\n```\n\nJava 2 之后，`suspend()`\
  \ 和 `resume()` 方法也被废弃，因为它们可能导致死锁。其签名如下：\n\n```java\nfinal void suspend()\nfinal\
  \ void resume()\n```\n\n\n\n\n\n通过指定成员访问性修饰符，类可以控制哪些信息是客户端（即其他类）可见的。这些修饰符帮助类定义一个约，使用户确切知道该类提供了哪些服务。\n\
  \n成员的访问性/可见性可以是以下之一：\n\n- `public`（公共的）\n- `protected`（受保护的）\n- `default`（默认，也称为包访问权限）\n\
  - `private`（私有的）\n\n注意： 成员访问性修饰符仅当类（或其任一个子类）对客户端可见时才有意义。另请注意，一个成员只能指定一个访问性修饰符。\n\
  \n此讨论同时适用于类的实例和静态成员。\n\n### 3. 接口的成员访问性/可见性修饰符\n\n可以用于接口数据成员和方法的唯一访问性/可见性修饰符是 `public`。\n\
  \n`public` 也是接口成员的默认访问性/可见性修饰符，也就是说即使不使用 `public` 修饰符，成员也被始终隐假设为 `public`。\n\n###\
  \ 4. 顶级类的其他修饰符：\n\n除了可见性修饰符外，我们还可以在顶级类之前使用以下修饰符：\n\n#### (a) `abstract`（抽象的）\n\n\
  可以使用关键字 `abstract` 指定一个类，表示它不能被实例化。包含 `abstract` 方法的类必须声明为 `abstract`，否则将无法通过编译。不包含抽象方法的类也可以被声明为\
  \ `abstract`。此类类可以作为许多子类的基类。\n\n#### (b) `final`（最终的）\n\n可以将类声明为 `final`，表示它不能被扩展。`final`\
  \ 类标记了其实现继承层次结构的下边界。只有定义完整的类才能被声明为 `final`。一个类不能同时是 `final` 和 `abstract`。\n\n以下是\
  \ `final` 类的的一些重要特征：\n\n- `final` 类的所有方法也是 `final` 的，也就是说它们具有具体的实现且不能被重写。\n- 使用\
  \ `final` 类时，某些类型检查会变得更快。事实上，许多类型检查变成了编译时检查，错误可以更早地捕获。如果编译器遇到对 `final` 类的引用，它知道所引用的对象恰是该类型。\n\
  - 编译器能够对 `final` 方法执行某些代码优化，因为可以对此类成员做出某些假设。\n- 当调用非 `final` 方法时，运行时系统确定对象的实际类，将方法调用绑定到该类型方法的正确实现上，然后调用该实现。\n\
  - 在 `final` 方法的情况下，我们确定类型子类不能重写该方法，因此绑定是在编译时完成的，类似于 `private` 和 `static` 方法的情况，这无疑会提高性能。\n\
  - 在 `final` 方法的情况下，编译器可能会将调用替换为方法的实际体，类似于宏。这种机制被称为“内联”（inlining）。在 C++ 中，我们有权将函数声明为\
  \ `inline` 的选项（尽管最终决定由编译器做出），但在 Java 中，由编译器做决定。\n\n### 5. 顶级接口的其他修饰符：\n\n#### (a)\
  \ `abstract`\n\n这是除可见性修饰符外，唯一可以用于接口的修饰符。\n\n接口仅指定方法原型而不包含任何实现：从本质上说说，它们是隐式抽象的（即它们不能被实例化）。我们可以将接口声明为\
  \ `abstract`，但这是多余的，因为接口始终是抽象的。\n\n### 6. 接口成员的其他修饰符：\n\n数据成员的其他修饰符：\n除可见性修饰符 `public`\
  \ 外，我们还可以使用修饰符 `static` 和 `final`。虽然我们可以使用这些修饰符，但它是多余的，因为所有数据成员都是隐式的 `public`、`static`\
  \ 和 `final` 的。\n\n方法的其他修饰符：\n除可见性修饰符 `public` 外，我们还可以使用修饰符 `abstract`。虽然可以使用 `abstract`\
  \ 修饰符，但它是多余的，因为所有方法都是隐式的 `public` 且抽象的。\n\n### 7. 类成员的其他修饰符:-\n\n字段和/方法的某些特征可以通过以下关键字进行声明指定：\n\
  \n1. `static`\n2. `final`\n3. `abstract`\n4. `synchronized`\n5. `native`\n6. `transient`\n\
  7. `volatile`\n\n#### A. `static` 修饰符：\n\n`static` 成员属于它们被定义的类，而不是类的任何实例的一部分。根据类中\
  \ `static` 成员的访问性修饰符，客户端可以使用类名或通过类的对象引用来访问这些成员。\n\n`static` 变量（也称为类变量）：\n这些变量只存在于它们定义的类中。当类被加载时，如果没有指定显式初始化表达式，`static`\
  \ 变量将初始化为默认值。`static` 成员变量通常用于跟踪实例的全局信息。\n\n`static` 方法：\n这些也被称为类方法。类中的 `static`\
  \ 方法可以直接访问类中的其他 `static` 成员。它不能访问类的实例（即非静态）成员，因为对于 `static` 方法来说，没有关联对象的概念。\n\n\
  然而，请注意，类中的 `static` 方法始终可以使用类类型的引用来访问其成员，无论这些成员是否是静态的。一个典型的 `static` 方法可能会代表整个类和/或类的对象执行某些任务。\n\
  \n子类中的实例不能重写父类中的 `static` 方法。编译器将用错误标记此操作（意味着父类中的 `static` 方法不能被子类的静态方法重写）。`static`\
  \ 方法是类特定的，不属于任何对象，而方法是代表对象调用的。子类中的 `static` 方法可以隐藏父类中的 `static` 方法。\n\n声明为 `static`\
  \ 的方法有若干限制：\n- 它们只能调用其他 `static` 方法。\n- 它们只能访问 `static` 数据成员。\n- 它们无法无法引用 `this`\
  \ 或 `super`。\n\n`static` 初始化块：\nJava 类可以有一个或多个 `static` 初始化块。`static` 初始化块的语法如下：\n\
  \n```java\nstatic {\n    code\n}\n```\n\n`static` 初始化块可以被视为静态方法，一旦类加载就会隐式/自动地调用。\n\
  \n静态块在以下情况下非常有用：\n- `static` 变量的动态初始化。\n- 在加载类时执行一次性活动。例如加载 jdbc 驱动类。\n- 在 Hashtable、HashMap、Properties\
  \ 等中加载小型数据库/配置文件。\n\n#### B. `final` 修饰符：\n\n`final` 修饰符可以用于：\n-地变量\n- 实例变量/数据成员\n\
  - 静态变量/数据成员\n- 实例方法\n\n`final` 变量：\n`final` 变量通常在声明时初始化，赋值后就无法修改。关于 final 变量的一些重要要点：\n\
  \n- `final` 变量是一个常量，尽管它被称为变量。一旦初始化，其值就不能更改。这适用于实例、静态和局部变量，包括声明为 final 的参数。\n- `final`\
  \ 是唯一适用于局部变量或形式参数的修饰符。\n- 基本数据类型的 `final` 变量一旦初始化就不能更改。\n- 引用类型的 `final` 变量一旦初始化就不能更改其引用值，但它所指向的对象的状态仍然可以更改。\n\
  \n\n\n\n\n*   最后的 final 静态变量通常用于定义命名常量，例如 `Integer.MAX_VALUE`，它是 int 的最大值。\n\n##\
  \ 局部 final 变量:-\n\n### 示例 13.1\n以下示例说明了局部 final 变量可以如上所述留空，但在首次使用之前必须初始化。变量 `x`\
  \ 在在显示器上显示其值之前被初始化。\n\n```java\nclass FinalTest1 // 使用了空 final final\n{\n    public\
  \ static void main(String args[])\n    {\n        final int x;  // 并不必须在声明时初始化\n\
  \        x = 50;\n        System.out.println(x);\n    }\n}\n```\n输出：`50`\n\n###\
  \ 示例 13.2\n以下代码将无法编译，因为 final 变量被初始化了两次。\n\n```java\nclass FinalTest2 // 使用了空 final\
  \ final\n{\n    public static void main(String args[ ])\n    {\n        final int\
  \ x; \n        x=50;\n        System.out.println(x);\n        x = 60;\n    }\n}\n\
  ```\n\n## 实例 final 变量:-\n\n实例 final 变量可以留空，但在获取包含 final 变量的类的对象引用之前必须初始化。因此，如果我们不在声明时进行初始化，那么可以初始化\
  \ final 变量的其他地方是：\n\n* 构造函数\n* 初始化块\n\n### 示例 13.3\n以下程序将无法编译，因为 final 变量没有被初始化。默认值初始化的概念不适用于\
