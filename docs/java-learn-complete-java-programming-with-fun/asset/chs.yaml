  \n它在对象被垃圾回收之前被调用，以便进行任何清理工作。然而，`Object` 类中默认的 `finalize()` 方法没有做任何有用的操作。这对于释放非 Java\
  \ 资源可能有用，但不推荐这样做。如果可用内存足够，`finalize()` 方法可能永远不会被调用，在这种情况下资源可能永远不会被释放。\n\n### 6.\
  \ `protected Object clone() throws CloneNotSupportedException`\n\n通过 `clone()` 方法可以创建与当前对象完全相同（即具有相同状态）的新对象，也就是说原始值和引用值被复制，这被称为浅拷贝（shallow\
  \ cloning）。\n\n类可以重写 `clone()` 方法以提供其自己的克隆概念。例如，通过递归克隆组成对象来克隆复合对象被称为深拷贝（deep cloning）。当重写时，子类中的方法通常被声明为\
  \ public，以便允许任何客户端克隆该类的对象。\n\n如果重写 `clone()` 方法依赖于 `Object` 类中的 `clone()` 方法，则子类必须实现\
  \ `Cloneable` 标记接口，以指示其对象可以安全地克隆。否则，`Object` 类中的 `clone()` 方法将抛出检查异常 `CloneNotSupportedException`。\n\
  \n#### 使用 `clone()` 和 `Cloneable` 接口\n\n`clone()` 方法会在调用它的对象上生成一个该对象的副本。以下是与 `clone()`\
  \ 方法的一些重要事实：\n\n- 只有实现了 `Cloneable` 接口的类才能被克隆。`Cloneable` 接口没有定义成员。它用于指示一个类允许对对象进行位拷贝（即创建克隆）。\n\
  - 如果你对对没有实现 `cloneable` 接口类的对象调用 `clone()`，将抛出 `CloneNotSupportedException`。\n-\
  \ `Cloneable` 接口是一个空接口。这种接口被称为标记/标签接口（marker/tag interface）。创建克隆时，不会调用被克隆对象的构造函数。\n\
  - 克隆对象只是原始对象的完全拷贝。克隆是一个潜在危险的操作，因为可能会导致意外的副作用。\n- 例如，如果被克隆的对象包含一个名为 `objRef` 的引用变量，那么在创建克隆时，`clone`\
  \ 中的 `objRef` 将与原始对象中的 `objRef` 指向同一个对象。如果克隆修改了 `objRef` 所引用对象的内容，那么原始对象也会被改变。\n\
