  \ 个字符到 $m^{th}$ 个字符（不包含 $m^{th}$）的子字符串 |\n| `public String concat(String str)` |\
  \ 将字符串 `str` 拼接到调用字符串对象的末尾。 |\n| `public String replace(char x, char y)` | 将所有出现的\
