    Henry Francis Lyte, "Abide with Me"


    # CHAPTER 3


    # # Immutability


    If you listen to functional-programming aficionados, you''ll hear people making
    a big deal about immutability—the fact that in a functional program, data cannot
    be altered once created.


    And, indeed, Elixir enforces immutable data.


    But why?


    # ## You Already Have (Some) Immutable Data


    Forget Elixir for a moment. Think about your current programming language of choice.
    Let''s imagine you''d written this:


    ```

    count = 99

    d_something_with(count)

    print(count)

    ```


    You''d expect it to output 99. In fact, you''d be very surprised if it didn''t.
    At your very core, you believe that 99 will always have the value 99.


    Now, you could obviously bind a new value to your variable, but that doesn''t
    change the fact that the value 99 is still 99.


    Imagine programming in a world where you couldn''t rely on that—where some code,
    possibly running in parallel with your own, could change the value of 99. In that
    world, the call to do_something_with might kick off code that runs in the background,
    passing it the value 99 as an argument. And that could change the contents of
    the parameter it receives. Suddenly, 99 could be 100.


    You''d be (rightly) upset. And, what''s worse, you''d never really be able to
    guarantee your code produced the correct results.'
