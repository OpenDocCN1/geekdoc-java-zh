  md: "The first message is sent back, but the second is nowhere to be seen. What's\
    \ worse, it just hangs, and we have to use ^C (the control-C key sequence) to\
    \ get out of it.\n\nThat's because our greet function handles only a single message.\
    \ Once it has processed the receive, it exits. As a result, the second message\
    \ we send it in is never processed. The second receive at the top level then just\
    \ hangs, waiting for a response that will never come.\n\nLet's least fix the hanging\
    \ part. We can tell receive that we want to time out if a response is not received\
    \ in so many milliseconds. This uses a pseudo-pattern called after.\n\n```\nspawn/spawn3.exs\n\
    defmodule Spawn3 do\n  def greet do\n    receive do\n      {sender, {:ok, \"Hello,\
    \ #{msg}\"}} ->\n        send sender\n    end\n\n```\n\n```\n# here's a client\n\
    pid = spawn(Spawn3, :greet, [])\n```\n\n```\nsend pid, {self, \"World!\"} ->\n\
    \  {:ok, message} ->\n    IO.puts message\nend\n```\n\n```\nsend pid, {self, \"\
    Kermit!\"} ->\n  {:ok, message} ->\n    IO.puts message\n  after 500 ->\n    IO.puts\
    \ \"The greeter has gone away\"\nend\n```\n\n```\niex c(\"spawn3.exs\")\nHello\
    \ World!\n... short pause ...\nThe greeter has gone away\n[Spawn3]\n```\n\nBut\
    \ how would we make our greet function handle multiple messages? Our natural reaction\
    \ is to make loop, doing a receive on each iteration. Elixir doesn't have loops,\
    \ but it does have recursion."
