    # # Binaries


    The binary type represents a sequence of bits.


    A binary literal looks like <<term...>>.


    The simplest term is just a number from 0 to 255. The numbers are stored as successive
    bytes in the binary.


    ```

    iex> b << 1, 2, 3 >>

    <<1, 2, 3>>\iex> byte_size b

    3\iex> bit_size b

    24

    ```


    You can specify modifiers to set any term''s size (in bits). This is useful working
    with binary formats such as media files and network packets.'
