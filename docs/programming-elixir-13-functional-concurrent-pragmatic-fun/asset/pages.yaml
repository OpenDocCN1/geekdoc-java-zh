  md: '```

    iex> a = 1

    1\iex> 1 = a

    1\iex> 2 = a

    ** (MatchError) no match of right hand side value: 1

    ```


    Look at the second line of code, 1 = a. It''s another match, and it passes. The
    variable a already has the value 1 (it was set in the first line), so what''s
    the left of the equals sign is the same as what''s on the right, and the match
    succeeds.


    But the third line, 2 = a, raises an error. You might have expected it to assign
    2 to a, as that would make the match succeed, but Elixir will only change the
    value of a variable on the left side of an equals sign—on the right it is replaced
    with its value. This failing line of code is the same as 2 = 1, which causes the
    error.


    # More Complex Matches


    First, a little background syntax. Elixir lists can be created using square brackets
    containing a comma-separated set of values. Here are some lists:


    +   [ "Humperdinck", "Buttercup", "Fezzik" ]

    [ "milk", "Butter", [ "iocane", 12 ] ]


    Back to the match operator.


    ```

    iex> list = [ 1, 2, 3 ]

    [1, 2, 3]

    ```


    To make the match true, Elixir bound the variable list to the list [1, 2, 3].


    But let''s try something else:


    ```

    iex> list = [1, 2, 3 ]

    [1, 2, 3]\iex> [a, b, c ] = list

    [1, 2, 3]\iex> a

    1\iex> b

    2\iex> c

    3

    ```


    Elixir looks for a way to make the value of the left side the same as on the right.
    The left side is a list containing three variables, and the right is a list'
