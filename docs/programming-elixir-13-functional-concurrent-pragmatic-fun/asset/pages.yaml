    \ code in the Ticker module. This means they can be called directly wherever we\
    \ have the module loaded—no message passing required. This is a common pattern;\
    \ we have a module that is responsible for spawning a process and for providing\
    \ the external interface to that process.\n\nBack to the code. The last function,\
