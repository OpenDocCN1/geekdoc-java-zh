  md: "First, you can determine at compile time the minimum level of logging to include.\
    \ Logging below this is not even compiled into your code. The compile-time level\
    \ is set in the config/config.ex file:\n\n```\nproject/5/issues/config/config.ex\n\
    use Mix.Config\nconfig :issues, github_url: \"https://api.github.com\"\nconfig\
    \ :logger, compile_time_level: ::info\n```\n\nNext, you can change the minimum\
    \ log level at runtime by calling Logger.con. (Clearly, this cannot enable log\
    \ levels that you excluded at compile time.)\n\nAfter this configuration, it's\
    \ time to add some logging.\n\nThe basic logging functions are Logger.debug, .info,\
    \ .warn, and .error. Each function takes either string or a zero-affinity function:\n\
    \n```\nLogger.debug \"Order total #{total(order)}\"\nLogger.debug fn -> \"Order\
    \ total #{total(order)}\" end\n```\n\nWhy have the function version? Because the\
    \ calculation of the order total is expensive. In the first version, we'll always\
    \ call it to interpolate the value into our string, even if the runtime log level\
    \ is set to ignore debug-level messages. In the function variant, the total function\
    \ will be invoked only if the log message is needed.\n\nAnyway, here's a version\
    \ of our fetch function with some logging:\n\n```\nproject/5/issues/lib/github_issues/issues.ex\n\
    defmodule Issues.GithubIssues do\n  require Logger\n  @user_agent [ \"User-agent\"\
    , \"Elixir dave@pragprog.com\" ]\n  def fetch(user, project) do\n    Logger.info\
    \ \"Fetching user #{user}'s project #{project}\"\n    issues_url(project)\n  \
    \  |> HTTPison.post(@user_agent)\n    |> handle_response\n  end\n  def handle_response({:ok,\
    \ %status_code: 200, body: body}}) do\n    Logger.info \"Successful response\"\
    \n    Logger.debug fn -> inspect(body) end\n    {:ok, Poison.Parser.parse!(body)}\n\
    \  end\n  def handle_response({{}, %status_code: status, body: body}}) do\n  \
