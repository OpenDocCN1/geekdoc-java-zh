    ```\nfunctions/pin.exs\ndefmodule Greeter do\n  def for(name, greeting) do\n \
    \   fn\n      ('name) -> \"#{greeting} #{name}\"\n      (_) -> \"I don't know\
    \ you\"\n    end\n  end\nend\n\nmr_valim = Greeter.for(\"José\", \"Oi!\")\nIO.puts\
    \ mr_valim(\"José\") # => José\nIO.puts mr_valim(\"ave\") # => I don't know you\n\
    ```\n\nIn this example, the Greeter.for returns a function with two heads. The\
    \ first head matches when its first parameter is the value of the name passed\
