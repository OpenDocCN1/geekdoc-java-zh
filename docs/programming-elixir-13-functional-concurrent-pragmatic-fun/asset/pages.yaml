- img_proc: true
  md: "We could delegate the inspect function to the Elixir default. For our value\
    \ 50, this would be %Bitmap(value: 50). But let's override it. We need to implement\
    \ the inspect function. It takes a value and some options. The listing's on the\
    \ next page.\n\n```\nprotocols/bitmap_inspect.ex\ndefmodule Bitmap do\n  destruct\
    \ value: 0\n\n  defimpl Inpect do\n    def inspect(%value: value, _opts) do\n\
    \      \"#{Bitmap#{value}=#{as_binary(value)}}\"\n    end\n\n    defp as_binary(value)\
    \ do\n      to_string(:io_lib.format(\"~2B\", [value]))\n    end\n  end\nend\n\
    ```\n\n```\n$ iex bitmap_inspect.ex\\iex fifty = %Bitmap(value: 50)\n\"%Bitmap(50=01100110)\"\
    \ninspect fifty\n\"%Bitmap(50=01100110)\"\ninspect fifty, structs: false\n\"%{__struct__:\
    \ Bitmap, value: 50}\"\n```\n\nThere's a wrinkle here. If you pass structs to\
    \ IO.inspect(or Kernel.inspect), it never calls your inspect function. Instead,\
    \ it formats it as a struct.\n\nThe formatting of our %Bitmap leaves a little\
    \ to be desired for large numbers:\n%Bitmap(value: 12345678901234567890)\n%Bitmap(12345678901234567890=010101101010101010101000110011001110111111000100010101010)\n\
    \nThe output was all on one line, and wrapped in code. To fix this, we use a feature\
    \ called algebra documents. An algebra document is a tree structure that represents\
    \ some data you'd like to pretty-print. Your job is to create the structure based\
    \ on the data you want to inspect, and Elixir will then find a nice way to display\
    \ it.\n\nIn our case, I'd like the bitmap values to display on a single line if\
    \ they fit, and I'd like them to break intelligently onto multiple lines if not.\n\
    \n1. http://citeseerx.ist.psu.edu/viewdoc/summary?doi=10.1.1.34.2200"
