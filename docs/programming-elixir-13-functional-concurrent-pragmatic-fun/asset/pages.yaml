    # Infinite Streams\n\nBecause streams are lazy, there's no need for the whole\
    \ collection to be available upfront. For example, I write\n\n```\niex> Enum.map(1..10_000_000,\
    \ &(&+1)) |> Enum.take(5)\n[2, 3, 4, 5, 6]\n```\n\nit takes about 8 seconds before\
    \ I see the result. Elixir is creating a 10-million-element list, then taking\
