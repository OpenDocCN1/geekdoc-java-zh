  md: "# Heredocs\n\nAny string can span several lines. To illustrate this, we'll\
    \ use both IO.puts and IO.write. We use write for the multiline string because\
    \ puts always appends a newline, and we want to see the contents without this.\n\
    \n```\nIO.puts \"start\"\nIO.write \"\"\n  my\n  string\n\"\nIO.puts \"end\"\n\
    ```\n\nproduces:\nstart\n  my\n  string\nend\n\nNotice how the multiline string\
    \ retains the leading and trailing newlines and the leading spaces on the intermediate\
    \ lines.\n\n```\nIO.puts \"start\"\nIO.write \"\"\"\"\n  my\n  string\n\"\"\"\"\
    \nIO.puts \"end\"\n```\n\nproduces:\nstart\n  my\n  string\nend\n\nHeredocs are\
    \ used extensively to add documentation to functions and modules.\n\n# Sigils\n\
    \nLike Ruby, Elixir has an alternative syntax for some literals. We've already\
    \ seen it with regular expressions, where we wrote ~r{...}. In Elixir, these ~style\
    \ literals are called sigils (a symbol with magical powers)."
