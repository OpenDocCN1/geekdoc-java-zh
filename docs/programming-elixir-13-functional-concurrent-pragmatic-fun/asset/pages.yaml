    Finally, there''s some debate about whether regular expressions and ranges are
    value types. Technically they aren''t—under the hood they are just structures.
    But right now it''s convenient to treat them as distinct types.


    # Value Types


    The value types in Elixir represent numbers, names, ranges, and regular expressions.


    # Integers


    Integer literals can be written as decimal (1234), hexadecimal (0cafe), octal
    (0o765), and binary (0b1010).


    Decimal numbers may contain underscores—these are often used to separate groups
    of three digits when writing large numbers, so one million could be written 1_000_000
    (or perhaps 100_000 in China and Japan).


    There is no fixed limit on the size of integers—their internal representation
