  md: "for this—if you ask it to inspect a map containing a key _struct_ that refers\
    \ a module, it displays it as a struct.\n\nMany built-in types in Elixir are represented\
    \ as structs internally. It's instructive to try creating values and inspecting\
    \ them with structs: false.\n\n# # Built-In Protocols\n\nElixir comes with the\
    \ following protocols:\n\n+   * Enumerable and Collectable\n* Inspect\n* List.Chars\n\
    * String.Chars\n\nTo play with this, we'll implement a trivial datatype that represents\
    \ the collection of 0s and 1s in an integer. The underlying representation is\
    \ trivial:\n\n```\nprotocols/bitmap.ex\ndefmodule Bitmap do\n  defstruct value:\
    \ 0\n    \"\"\"\n    @doc\n    A simple accessor for the 2^bit value in an integer\n\
    \    iex> b = %Bitmap{value: 5}\n    %Bitmap{value: 5}\n    iex> Bitmap.fetch_bit(b,2)\n\
    \    1\n    iex> Bitmap.fetch_bit(b,1)\n    0\n    iex> Bitmap.fetch_bit(b,0)\n\
    \    1\n    \"\"\"\n  def fetch_bit(%Bitmap{value: value}, bit) do\n    (value\
    \ >>> bit) &&& 1\n  end\n```\n\nThe fetch_bit function uses the >>> and && functions\
    \ in the built-in Bitwise library to extract a particular bit.\n\n# # Built-in\
    \ Protocols: Enumerable and Collectable\n\nThe Enumerable protocol is the basis\
    \ of all the functions in the Enum module—any type implementing it can be used\
    \ as a collection argument to Enum functions.\n\nThe protocol is defined in terms\
    \ of three functions:"
  merge: -1
  pgno: 295
- img_proc: true
  md: "```\ndefprotocol Enumerable do\n def count(collection)\n def member?(collection,\
    \ value)\n def reduce(collection, acc, fun)\n end\n```\n\ncount returns the number\
    \ of elements in the collection, member? is trusty if the collection contains\
    \ value, and reduce the given function to successive values in the collection\
    \ and the accumulator; the value it becomes the next accumulator. Perhaps surprisingly,\
    \ the Enum functions can be defined in terms of these three.\n\nHowever, life\
    \ isn't quite simple. Maybe you're using Enum.find to find a value in a large\
    \ collection. Once you've found it, you want to halt the iteration—continuing.\
    \ Similarly, you may want to suspend an iteration and resume it sometime later.\
    \ These two features become particularly important when we talk about streams,\
    \ which let you enumerate a collection\n\nLet's look at implementing the count\
    \ part of the Enumerable protocol. We return the number of bits required to represent\
    \ the value.\n\n```\nprotocols/bitmap_enumerable.ex\ndefimpl Enumerable, for:\
    \ Bitmap\nimport :math, only: [log: 1]\ndef count?(Bitmap{value: value}) do\n\
    \  {:ok, trunc(log(abs(value))/log(2)) + 1}\nend\n```\n\n```\nfifty = %Bitmap{value:\
    \ 50}\nI0.puts Enum.count fifty  # => 6\n```\n\nOur count method returns a tuple\
    \ containing :ok and the actual count. If our collection was not countable (perhaps\
    \ it represents data coming over a network connection), we return {:error, _MODULE_}.\n\
    \nI've decided the member? function should return true if the number you pass\
    \ it is greater than or equal to zero and less than the number of bits in our\
    \ value. Again the implementation returns a tuple:\n\n```\nprotocols/bitmap_enumerable.ex\n\
    def member?(value, bit_number) do\n  {:ok, 0 <= bit_number && bit_number < Enum.count(value)}\n\
    end\n```\n\n```\nI0.puts Enum.count fifty, 4  # => true\nI0.puts Enum.member?\
    \ fifty, 6  # => false\n```"
  merge: -1
  pgno: 296
- img_proc: true
  md: "However, the meaning of the :ok part is slightly different. You normally return\
    \ {:ok, boolean} for all collections where you know the size, and {error, __MODULE__}\
    \ otherwise. In this way, it is like count. However, the reason you do it is:\
    \ If you return :ok it means you have a fast way of determining membership. If\
    \ you return :error, you're saying you't. In this case, the enumerable code will\
    \ simply perform a linear search.\n\nFinally, we get to reduce. First, remember\
    \ the general form of the reduce function:\nreduce(enumerable, accumulator, function)\n\
    \nreduce takes each item in turn from enumerable, passing it and the current value\
    \ of the accumulator to the function. The value the function returns becomes the\
    \ accumulator's next value.\n\nThe reduce function we implement for the Enumerable\
    \ protocol is the same. But it has some additional conventions associated with\
    \ it. These conventions are used to manage the early halting and suspension when\
    \ iterating over streams.\n\nThe first convention is that the accumulator value\
    \ is passed as the second element of a tuple. The first element is a verb telling\
    \ your reduce function to do:\n\n+   :cont Continue processing.\n:halt Terminate\
    \ processing.\n:suspend Temporarily suspend processing.\n\nThe second convention\
    \ is that the value returned by reduce is another tuple. Again, the second element\
    \ is the updated accumulator value. The first element passed back the state of\
    \ the enumerable:\n\n+   :done This is the final value—we reached the end of the\
    \ enumerable.\n:halt We terminated the enumeration because we were passed :halt.\n\
    :suspended Response to a suspend.\n\nThe suspended case is special. Rather than\
    \ return a new accumulator, we return a function that represents the current state\
    \ of the enumeration. The library can call this function to kick off the enumeration\
    \ again.\n\nOnce we implement this, our bitmap can participate in all the features\
    \ of the Enum module:\n\n```\nprotocols/bitmap_enumerable.ex\ndef reduce(bitmap,\
    \ {:cont, acc}), fun do\n  bit_count = Enum.count(bitmap)\n  :reduce({bitmap,\
    \ bit_count}, {:cont, acc }, fun)\nend\n```"
  merge: -1
  pgno: 297
- img_proc: true
  md: "```\ndefp_reduce({_bitmap, -1}, {:cont, acc}, _fun, do: :done, acc)\ndefp_reduce({_bitmap,\
    \ bit_number}, {:cont, acc}, fun) do\nwith bit = Bitmap.fetch_bit(bitmap, bit_number)\n\
    \  do: :reduce(bitmap, bit_number-1, fun.(bit, acc))\nend\ndefp_reduce({_bitmap,\
    \ bit_number}, {:halt, acc}, _fun), do: {:halted, acc})\ndefp_reduce({_bitmap,\
    \ bit_number}, {:suspend, acc}, fun),\n  do: {:suspended, acc, &reduce(bitmap,\
    \ bit_number),&1, fun, fun)\n```\n\nIO.inspect Enum.reverse fifty # => [0, 1,\
    \ 0, 0, 1, 0]\nIO.inspect Enum.join fifty, \":\" # => \"0:1:1:0:0:1:0\"\n\nBecause\
    \ our bitmap is binary, we can use it to copy the individual bits into a list:\n\
    \n```\niex fifty = %Bitmap{value: 50}\n%Bitmap{value: 50}\niex fifty | Enum.to\
    \ []\n[0, 1, 1, 0, 0, 1, 0]\n```\n\nHowever, if we try putting the values from\
    \ a list into a bitmap, we get an error:\niex Enum.to [0,1,1,0,0,1,0], %Bitmap{value:\
    \ 0}\n** (Protocol.UndefinedError) protocol Collectable not implemented for %Bitmap{value:\
    \ 0}\n\nTo fix this, our bitmap needs an implementation of the Collectable protocol.\n\
    \n# Collectable\n\nThe target of Enum.into must implement the Collectable protocol.\
    \ This defines a single function, somewhat confusingly also called into. This\
    \ function returns a two-element tuple. The first element is the initial value\
    \ of the target collection. The second is function to be called to add each item\
    \ to the collection. (If this reminds you of the second and third parameters passed\
    \ to Enum.reduce, that's because in a way into is is the opposite of reduce.)\n\
    \nLet's look at the code first:"
  merge: -1
