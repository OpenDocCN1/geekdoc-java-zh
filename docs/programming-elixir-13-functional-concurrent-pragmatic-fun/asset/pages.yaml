  md: '# Variable Scope


    Elixir is lexically scoped. The basic unit of scoping is the function body Variables
    defined in a function (including its parameters) are local to that function. In
    addition, modules define a scope for variables, but these are only accessible
    at the top level of module, and not in functions defined in the module.


    Several Elixir structures also define their own scope. We''ll look at one of these,
    for Comprehensions, on page 107. The other is with.


    # The with the Expression


    The with expression serves double duty. First, it allows you to define a local
    scope for variables: if you need a couple of temporary variables when calculating
    something, and don''t want those variables to leak out into the wider scope. Second,
    it gives you some control over pattern matching failures.


    For example, the /etc/passwd file contains lines as


    ```

    _installassistant:*:25:25:Install Assistant:/var/empty:/usr/bin/false

    lp:*:26:26:Printing Services:/var/pool/cups:/usr/bin/false

    postfix*:27:27:Postfix Mail Server:/var/pool/postfix:/usr/bin/false

    ```


    The two numbers are the user and group ids for the given username. The code finds
    the values for the _lp user.


    ```

    basic-types-with-scope.ex

    content = "Now is the time"

    lp = with {ok

    ```


    The expression lets us work with what are effectively temporary variables as we
    open the file, read its content, close it, and search for the line we want. The
    value of the with is the value of its do parameter.


    The inner variable content is local to the with, and does not affect the variable
    in the outer scope.'
