    "The next number is 458"

    iex(sequence<127.0.0.1>5> Sequence.Server.next_number

    "The next number is 459"

    ```


    Erlang can actually run two versions of a module at the same time. Currently

    executing code will continue to use the old version until that explicitly

    cites the name of the module that has changed. At that point, and for that

    particular process, execution will swap to the new version.


    This is a critical part of hot loading of code. We want to let code that is cur-

    rent running continue without interruption, but the new release may not

    be compatible with it. So Erlang lets run on the old release. But the next

    request will reference the module explicitly, and the new code will be loaded.


    In our case, when we say Sequence.Server.next_number, the reference to

    Sequence.Server triggers the reload, so the 0.0.2 release handles the next request.'
