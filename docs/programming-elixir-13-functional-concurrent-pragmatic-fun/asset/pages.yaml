- img_proc: true
  md: "The String.Chars protocol is used to convert a value to a string (binary, or\
    \ double quoted string). This is the protocol used for string interpolation.\n\
    \nThe protocols are implemented identically, except List.Chars requires that you\
    \ write a charlist function, and String.Chars requires you to write to string.\n\
    \nHere's a String.Chars implementation for our Bitmap. It simply chunks the bits\
    \ in groups of three, putting an underscore between each.\n\n```\nprotocols/bitmap_string.ex\n\
    deflimp String.Chars, for: Bitmap do\n  def to_string(bitmap) do\n    import Enum\n\
    \    bitmap\n    |> reverse\n    |> chunk(3)\n    |> map(fn three_bits -> three_bits\
    \ |> reverse |> join end)\n    |> reverse\n    |> join(\"\")\nend\n```\n\nLet's\
    \ try it:\n\n```\niex> \"Fifty in bits is: #{fifty}\"\n\"Fifty in bits is: 110_010\"\
    \n```\n\n# Protocols Are Polymorphism\n\nWhen you want to write a function that\
    \ behaves differently depending on the type of your arguments, you're looking\
    \ at a polymorphic function. Elixir protocols give you a tidy and controlled way\
    \ to implement this. Whether you're integrating your types into the existing Elixir\
    \ library or creating a new library with a flexible interface, protocols let you\
    \ package the behaviour in a well-documented and disciplined way.\n\nAnd with\
    \ that, we're almost done. But when you write about a language, there are always\
    \ little details that don't seem to fit anywhere. That's why the next chapter\
    \ is full of odds and ends."
