  md: '# CHAPTER 17


    # OTP: Servers


    If you''ve been following Elixir or Erlang, youve probably come across OTP. It
    is often hyped as the answer to all high-availability distributed-application
    woes. It isn''t, but it certainly solves many problems that you''d otherwise need
    to solve yourself, including application discovery, failure detection and management,
    hot code swapping, and server structure.


    First, the obligatory one-paragraph history. OTP stands for the Open Telecom Platform,
    but the full name is largely of historical interest and everyone says OTP. It
    was initially to build telephone exchanges and switches. But these devices have
    the same characteristics we want from any large online application, so OTP is
    now a general-purpose tool for developing and managing large systems.


    OTP is actually a bundle that includes Erlang, a database (wonderfully called
    Mnesia), and an innumerable number of libraries. It also defines a structure for
    your applications. But, as with all large, complex frameworks, there is a lot
    to learn. In this book we''ll focus on the essentials and I''ll point you towards
    other information sources.


    We''ve been using OTP all along—mix, the Elixir compiler, and even our issue tracker
    followed OTP conventions. But that use was implicit. Now we''ll make it explicit
    and start writing servers using OTP.


    # Some OTP Definitions


    OTP defines systems in terms of hierarchies of applications. An application consists
    of one or more processes. These processes follow one of a small number of OTP
    devices, called behaviors. There is a behavior used for general-purpose servers,
    one for implementing event handlers, and one for finite-state machines. Each implementation
    of one of these behaviors will run'
  merge: -1
  pgno: 222
- img_proc: true
  md: "in its own process (and may have additional associated processes). In this\
    \ chapter we'll be implementing the server behavior, called GenServer.\n\nA special\
    \ behavior, called supervisor, monitors the health of these processes and implements\
    \ strategies for restarting them if needed.\n\nWe look at these components from\
    \ the bottom up—this chapter will look at servers, the next will explore supervisors,\
    \ and finally we'll implement applications.\n\n# An OTP Server\n\nWhen we wrote\
    \ our Fibonacci server in the previous chapter, on page 199, we had to do all\
    \ the message handling ourselves. It wasn't difficult, but it was tedious. Our\
    \ scheduler also had to keep track of three pieces of state information: the queue\
    \ of numbers to process, the results generated so far, and the list of active\
    \ PIDs.\n\nMost servers have a similar set of needs, so OTP provides libraries\
    \ that do all the low-level work for us.\n\nWhen we write an OTP server, we write\
    \ a module containing one or more callback functions with standard names. OTP\
    \ will invoke the appropriate callback to handle a particular situation. For example,\
    \ when someone sends a request to our server, OTP will call our handle_call function,\
    \ passing in the request, the caller, and the current server state. Our function\
    \ responds by returning a tuple containing an action to take, the return value\
    \ for the request, and an updated state.\n\n# State and the Single Server\n\n\
    Way back when we summed the elements in a list, on page 70, we came across the\
