  md: '# Part III


    # More Advanced Elixir


    Among the joys of Elixir is that it laughs at the concept of “what you see is
    what you get.” Instead, you can extend it in many different ways. This allows
    you to add layers of abstraction to your code, which makes your code easier to
    work with.


    This part covers macros (which let you extend the language’s syntax), protocols
    (which let you add behaviors to existing modules), and use (which lets you add
    capabilities to a module). We finish with a grab-bag chapter of miscellaneous
    Elixir tricks and tips.'
