    \ GenServer\n\ndef handle_call({:next_number, _from, current_number}, _state)\
    \ do\n  {:reply, current_number, current_number+1}\nend\n\ndef handle_cast({:increment_number,\
    \ delta}, current_number) do\n  {:noreply, current_number + delta}\nend\n```\n\
