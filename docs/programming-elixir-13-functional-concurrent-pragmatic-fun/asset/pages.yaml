    # Nodes, Cookies, and Security


    Although this is cool, it might also ring alarm bells. If you can run arbitrary
    code on any node, then anyone with a publicly accessible node has just handed
    over his machine to any random hacker.


    But that''s not the case. Before a node will let another connection, it checks
    that the remote node has permission. It does that by comparing node''s cookie'
