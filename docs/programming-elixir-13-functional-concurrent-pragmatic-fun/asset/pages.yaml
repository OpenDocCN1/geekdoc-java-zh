  md: "# Exercise: Protocols-1\n\nA basic Caesar consists of shifting the letters\
    \ in a message by a fixed offset. For an offset of 1, for example, a will become\
    \ b, b will become c, and z will become a. If the offset is 13, we have the ROT13\
    \ algorithm.\n\nLists and binaries can both be stringlike. Write a Caesar protocol\
