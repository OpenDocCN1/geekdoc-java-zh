    # Load Order


    You may be wondering about the structure of the preceding code. We put the macro
    definition in one module, and the usage of that macro in another. And that second
    module included a require call.


    Macros are expanded before a program executes, so the macro defined in one module
    must be available as Elixir is compiling another module that uses those macros.
    The require function tells Elixir to ensure the named module is compiled before
    the current one. In practice it is used to make the macros defined in one module
    available in another.


    But the reason for the two modules is less clear. It has to do with the fact that
    Elixir first compiles source files and then runs them.


    If we have one module per source file and we reference a module in file A from
    file B, Elixir will load the module from A, and everything just works. If we have
    a module and the code that uses it in the same file, and the module is defined
    in the same scope in which we use it, Elixir will not know to load the module''s
    code. We''ll get this:


    > ** (Compile)

    .../dumper.ex:7:

    module My is not loaded but defined. This happens because we are trying to use
    a module in the same context as it is defined. Try defining the module outside
    the context that requires it.


    By placing the code that uses module My in a separate module, we force My to load.


