    iex name

    "Dave"

    iex

    ```


    # The Value Returned by a Comprehension


    In our examples so far, the comprehension has returned a list. The list contains
    the values returned by the do expression for each iteration of the comprehension.


    This behavior can be changed with the ~ parameter. This takes a collection to
    receive the results of the comprehension. For example, we can populate a popular
    map


