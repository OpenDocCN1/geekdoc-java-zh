  md: "You can write supervisors as separate modules, but the Elixir style is to include\
    \ them inline. The easiest way to get started is to create your project with the\
    \ --sup flag. Let's do this for our sequence server.\n\n```\n$ mix new --sup sequence\n\
    * creating README.md\n* creating .gitignore\n* creating mix.exs\n* creating config\n\
    * creating config/config.exs\n* creating lib\n* creating lib/sequence.ex\n* creating\
    \ test\n* creating test/test_helper.exs\n* creating test/sequence_test.exs\n```\n\
    \nNothing looks different, but open lib/sequence.ex\n\n```\ndefmodule Sequence\
    \ do\n  use Application\n\n  def start(_type, args) do\n    import Supervisor.Spec,\
    \ warn: false\n    children = [\n      # Worker and child supervisors to be supervised\n\
    \      # worker(Sequence.Worker, [arg1, arg2, arg3])\n    ]\n    opts = [strategy:\
    \ :one_for_one, name: Sequence.Supervisor]\n    Supervisor.start_link(children,\
