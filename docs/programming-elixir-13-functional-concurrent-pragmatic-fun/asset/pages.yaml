  md: "# A Simple Process\n\nHere's a module that defines a function we'd like to\
    \ run as a separate process:\n\n```\nspawn/spawn-basic.ex\ndefmodule SpawnBasic\
    \ do\n  def greet\n    IO.puts \"Hello\"\nend\n```\n\nYup, that's it. There's\
    \ nothing special—it's just regular code.\n\nLet's fire up iex and play:\n\n```\n\
    iex> c(\"spawn-basic.ex\")\n[SpawnBasic]\n```\n\nFirst let's call it as a regular\
    \ function:\n\n```\niex> SpawnBasic.greet\nHello\n:ok\n```\n\nNow let's run it\
    \ in a separate process:\n\n```\niex> spawn(SpawnBasic, :greet, [])\nHello\n#PID<0.42.0>\n\
    ```\n\nThe spawn function kicks off a new process. It comes in many forms, but\
    \ the two simplest let you run an anonymous function and run a named function\
    \ in a module, passing a list of arguments. (We used the latter here.)\n\nThe\
    \ spawn returns a Process Identifier, normally called a PID. This uniquely identifies\
    \ the process it creates. (This identifier could be unique among all processes\
    \ in the world, but here it's just unique in our application.)\n\nWhen we call\
    \ spawn, it creates a new process to run the code we specify. We don't know exactly\
    \ when it will execute—we only that it is eligible to run.\n\nIn this example,\
    \ we can see that our function ran and output “Hello” prior to iex reporting the\
    \ PID returned by spawn. But you can't rely on this. Instead you'll use messages\
    \ to synchronize your processes' activity."
  merge: -1
