  md: 'The default implementation stops the server with a :bad_call error, you''ll
    need to implement handle_call for every call type your server implements.


    # handle_cast(request, state)


    Called in response to GenServer.cast(pid, request).


    A successful response is {:noreply, new_state}. Can also return {:stop, reason,
    new_state}.


    The default implementation stops the server with a :bad_cast error.


    # handle_info(info, state)


    Called to handle incoming messages that are not call or cast requests. For example,
    timeout messages are handled here. So termination messages from linked processes.
    In addition, messages sent to the PID using send (so they bypass GenServer) will
    be routed to this function.


    # terminate(reason, state)


    Called when the server is to be terminated. However, as we''ll discuss in the
    next chapter, once we add supervision to our servers, we don''t have to worry
    about this.


    # code_change(from_version, state, extra)


    OTP lets replace a running server without stopping the system. However, the new
    version of the server might represent its state بمعنى from the old version. The
    code_change callback is invoked to change from the old state format to the new.


    # format_status(reason, [dict, state])


    Used to customize the state display of the server. The conventional response is
    data:[{:State, state_info}].


    The call and cast handlers return standardized responses. Some of these responses
    can contain an optional :hibernate or timeout parameter. If hibernate is returned,
    the server is removed from memory but is recovered by the next request. The timeout
    option can be the atom ::infinite (which is the default) or a number. If the latter,
    a timeout message is sent if the server is idle for the specified number of milliseconds.


    The first two responses are common between call and cast.


    ```

    {:noreply, new_state [, :hibernate | timeout] }

    ```'
