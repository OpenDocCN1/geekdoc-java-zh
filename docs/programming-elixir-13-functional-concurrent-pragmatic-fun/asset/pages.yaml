    \ like I did myself, until José Valim set me straight—there's a better way. In\
    \ our mix.ex file, there's a function called application.\n\n```\nproject/0/issues/mix.exs\n\
    # Configuration for the OTP application\n# Type `mix help compile` for more information\n\
    def application do\n  [applications: [:logger]]nend\n```\n\nOTP is the framework\
    \ that manages suites of running applications. By default, this application function\
    \ configures the contents of these suites. It starts the Elixir logger. But we\
    \ can use it to start extra applications. We tell him about starting HTTPPoison\
    \ here. (I found this counterintuitive at first. Erlang—and, by extension, Elixir—programs\
    \ are often structured as suites of cooperating subpopulations. Frequently, the\
    \ code that would be a library in another language is a subapplication in Elixir.\
    \ It might help to think of these as components or services.)\n\n```\nproject/1/issues/mix.exs\n\
    def application do\n  [applications: [:logger, :httppoison]]nend\n```\n\nDon't\
    \ worry about the details here—we'll be talking about extensively in Part II of\
