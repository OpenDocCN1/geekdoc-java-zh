  md: "# Sending Messages Between Processes\n\nLet's rewrite our example to use messages.\
    \ The top level will send greet message containing a string, and the greet function\
    \ will respond with a greeting containing that message.\n\nIn Elixir we send a\
    \ message using the send function. It takes a PID and the message to send (an\
    \ Elixir value, which we also call a term) on the right. You can send anything\
    \ you want, but most Elixir developers seem to use atoms and tuples.\n\nWe wait\
    \ for messages using receive. In a way, this acts just like case, with the message\
    \ body as the parameter. Inside the block associated with the receive call, you\
    \ can specify any number of patterns and associated actions. Just as with case,\
    \ the action associated with the first pattern that matches the function is run.\n\
    \nHere's the updated version of our greet function.\n\n```\nspawn/spawn1.ex\n\
    defmodule Spawn do\n  def greet do\n    receive do\n      (sender, msg) ->\n \
    \       send sender, {:ok, \"Hello, #{msg}\"}\n    end\n  end\n  end\n```\n\n\
    ```\n# here's a client\npid = spawn(Spawn, :greet, [])\nsend pid, {self, \"World!\"\
    }\n```\n\n```\nreceive do\n  {:ok, message} ->\n    IO.puts message\nend\n```\n\
    \nThe function uses receive to wait for a message, and then matches the message\
    \ in the block. In this case, the only pattern is a two-element tuple, where the\
    \ first element is the original sender's PID and the second is the message. In\
