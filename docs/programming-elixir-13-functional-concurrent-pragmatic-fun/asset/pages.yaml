    is retained across a crash.


    # Your Turn


    +   - Exercise: OTP-Supervisors-1

    Add a supervisor to your stack application. Use iex to make sure its server starts
    correctly. Use the server normally, and then crash it (try popping from an empty
    stack). Did it restart? What were the stack contents after the restart?


    # Managing Process State Across Restarts


    Some servers are effectively stateless. If we had a server that calculated the
    factors of numbers or responded to network requests with the current time, we
    could simply restart it and let it run.


    But our server is not stateless—it needs to remember the current number so it
    can generate an increasing sequence.


    All of the approaches to this choose a simple option—we''ll write a separate worker
    process that can store and retrieve a value. We''ll call our *stash*. The sequence
    server can store its current number in the stash whenever it terminates, and then
    we can recover the number when we restart.


    At this point, we have to think about lifetimes. Our sequence server should be
    fairly robust, but we''ve already found one thing that crashes it. So in actuarial
    terms, it isn''t the fittest process in the scheduler queue. But our stash process
    must be more robust—it must outlive the sequence server, at the very least.


    We have to do two things to make this happen. First, we make it as simple as possible.
    The fewer moving parts in a chunk of code, the less likely it is to go wrong.


    Second, we have to supervise it separately. In fact, we''ll create a supervision
    tree. It''ll look like the following diagram:'
