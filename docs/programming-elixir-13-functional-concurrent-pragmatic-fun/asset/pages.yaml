  md: "That works well once a system is up and running and everything is knitted together.\
    \ If you want to register a callback process on one node and an event-generating\
    \ process on another, just give the callback PID to the generator.\n\nBut how\
    \ can the callback find the generator in the first place? One way is for the generator\
    \ to register its PID, giving it a name. The callback on the other node can look\
    \ up the generator by name, using the PID that comes back to send messages to\
    \ it.\n\nHere's an example. Let's write a simple server that sends a notification\
    \ every 2 seconds. To receive the notification, a client has to register with\
    \ the server. And we'll arrange things so that clients on different nodes can\
    \ register.\n\nWhile we're at it, we'll do a little packaging so that to start\
    \ the server you run Ticker.start,and start the client you run Client.start. We'll\
    \ also add an API Ticker.to register a client with the server.\n\nHere's the server\
    \ code:\n\n```\nnodes/ticker.ex\ndefmodule Ticker do\n  @interval 2000 # 2 seconds\n\
    \  @name :ticker\n\n  def start do\n    pid = spawn(:MODULE__, :generator, [[]\n\
    \    :global.register_name(@name, pid)\n  end\n\n  def register(client_pid) do\n\
    \    send :global.where_is(@name), {:register, client_pid}\n  end\n\n  def generator(clients)\
    \ do\n    receive do\n      {:register, pid} ->\n        IO.puts \"registering\
    \ #{inspect pid}\"\n        generator([pid|clients])\n      after\n        @interval\
    \ ->\n          IO.puts \"tick\"\n          Enum.each clients, fn client ->\n\
    \            send client, {:tick}\n          end\n          generator(clients)\n\
    \    end\n  end\nend\n```"
