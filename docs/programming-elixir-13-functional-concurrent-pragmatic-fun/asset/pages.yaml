  md: "Or, we can think in terms of quote-as-string-literal analogy. In this case,\
    \ we can make a (slightly tenuous) quote that is little like the interpolation\
    \ we can do in strings. When we write \"sum#{1+2}\", Elixir evaluates 1+2 and\
    \ interpolates the result into the quoted quote. When we write quote do: dequote(name)\
    \ do, Elixir interprets the contents of name into code representation it is building\
    \ as part of the list.\n\n# Expanding a List—un_splicing\n\nConsider this code:\n\
    \n```\niex> Code.quoted(quote do: {1,2,unquote([3,4])})\n{{1,2,[3,4]], [[]]}\n\
    ```\n\nThe list [3,4] is inserted, as a list, into the overall quoted quoted list,\
    \ resulting in [1,2,[3,4]].\n\nIf we wanted to insert just the elements of the\
    \ list, we could use unquote_splicing.\n\n```\niex> Code.eval_quoted(quote do:\
    \ {1,2,unquote_splicing({3,4})})\n{{1,2,3,4], [[]]}\n```\n\nRemembering that single-quoted\
    \ strings are lists of characters, this means we can write\n\n```\niex> Code.eval_quoted(quote\
    \ do: {?, ? = unquote_splicing('1234')})\n{'1234',[]}\n```\n\n# Back to Our myif\
    \ Macro\n\nWe now have everything we need to implement an if macro.\n\n```\nmacros/myif.ex\n\
    defmodule My Do\ndefmacro if(condition, clauses) do\n  do_clause = Keyword.get(clauses,\
    \ :do, nil)\n  else_clause = Keyword.get(clauses, :else, nil)\n  quote do\n  \
    \  case unquote(condition) do\n      val when val in [false, nil] -> unquote(else_clause)\n\
    \      -> unquote(do_clause)\n    end\n  end\nend\nend\n\ndefmodule Test Do\n\
    require My\nMy.if==2 do\n```"
