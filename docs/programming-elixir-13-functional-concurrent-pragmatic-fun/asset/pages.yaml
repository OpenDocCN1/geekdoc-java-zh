  md: 'In this chapter, you''ll see:

    * Strings and string literals

    * Character lists (single-quoted literals)

    * Pattern matching and processing strings


    # CHAPTER 11


    # Strings and Binaries


    We''ve been happily using strings without really discussing them. Let''s rectify
    that.


    # String Literals


    Elixir has two kinds of string: single-quoted and double-quoted. They differ significantly
    in their internal representation. But they also have many things in common.


    +   * Strings can hold characters in UTF-8 encoding.

    * They may contain escape sequences:


    | \a BEL (0x07) | BS (0x08) | \d DEL (0x7f) |

    | \e ESC (0x1b) | FF (0x0c) | \n NL (0x0a) |

    | \r CR (0x0d) | \s SP (0x20) | \t TAB (0x09) |

    | \v VT (0x0b) | 1–6 hex digits | \xh 2 hex digits |


    +   * They allow interpolation in Elixir expressions using the syntax #{...}.


    ```

    iex name = "dave"

    iex> "Hello, ${String.capitalize name}!"

    "Hello, Dave!"

    ```


    +   * Characters that would otherwise have special meaning can be escaped with
    a backslash.


    +   * They support heredocs.'
