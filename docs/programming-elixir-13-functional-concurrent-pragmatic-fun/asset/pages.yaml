  md: '# Streams—Lazy Enumerables


    In Elixir, the Enum module is greedy. This means that when you pass it a collection,
    it potentially consumes all the contents of that collection. It also makes the
    result will typically be another collection. Look at the following pipeline:


    ```

    ```enum/pipeline.exs

    [ 1, 2, 3, 4, 5 ]

    |> Enum.map(&1&1)

    |> Enum.with_index

    |> Enum.map(fn {value, index} -> value - index end)

    |> IO.inspect #=> [1,3,7,13,21]

    ```

    ```


    The first map function takes the original list and creates a new list of squares.
    with_index takes this list and returns a list of tuples. The next map subtracts
    the index from the value, generating a list that gets passed to IO.inspect.


    So, this pipeline generates four lists on one outputting the final result.


    Let''s look at something different. Here''s some code that reads from a file and
    returns the longest.


    ```

    ```enum/longest_line.exs

    IO.puts File.read!("/usr/share/dict/words")

    |> String.split

    |> Enum.max_by(&String.length/1)

    ```

    ```


    In this case, we read the dictionary into memory (on my machine''s 2.4MB), split
    into a list of words (236,000 of them) before processing it to find the longest
    (which happens to be *formaldehydeoxysulphylate*).


    In both of these examples, our code is suboptimal because each call to Enum is
    self-contained. Each call takes a collection and returns a collection.


    What we really want is to process the elements in the collection as we need them.
    We don''t need to store intermediate results as full collections; we just need
    to pass the current element from function to function. And that''s what streams
    do.


    # A Stream Is a Composable Enumerator


    Here''s a simple example of creating a Stream:


    ```

    ```iex s = Stream.map([1, 3, 5, 7], &(&1 + 1))

    Stream<[enum: [1, 3, 5, 7], funs: [#Function<37.75997480/1 in Stream.map/2>]>

    ```

    ```'
