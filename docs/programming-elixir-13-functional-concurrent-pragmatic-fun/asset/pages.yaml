    \ and We then pass the PID to the subsupervisor.\n\nThis subsupervisor is basically\
    \ the same as our first supervisor—it simply spawns the sequence worker. But instead\
    \ of passing in a current number, it passes in the stash's PID.\n\n```\notp-supervisor/2/sequence/lib/sequence/sub_supervisor.ex\n\
    defmodule Sequence.SubSupervisor do\n  use Supervisor\n\n  def start_link(stash_pid)\
    \ do\n    {:ok,pid} = Supervisor.start_link(__MODULE__, stash_pid)\n  end\n  def\
    \ init(stash_pid) do\n    child_processes = [ worker(Sequence.Server, [stash_pid])\
    \ ]\n    supervise child_processes, strategy: :one_for_one\n  end\n```\n\nThe\
    \ sequence worker has two changes. First, when it initializes it must get the\
    \ current number from the stash. Second, when it terminates it stores the then-current\
    \ number back in the stash. To make these changes, we'll override two more GenServer\
    \ callbacks: init and terminate.\n\n```\notp-supervisor/2/sequence/lib/sequence/server.ex\n\
    defmodule Sequence.Server do\n  use GenServer\n\n  #####\n  # External API\n \
    \ def start_link(stash_pid) do\n    {:ok,pid} = GenServer.start_link(__MODULE__,\
    \ stash_pid, name: __MODULE__)\n  end\n  def next_number(pid) do\n    GenServer.call\
    \ __MODULE__, :next_number\n  end\n  def increment_number(delta) do\n    GenServer.cast\
    \ __MODULE__, {:increment_number, delta}\n  end\n```"
