- img_proc: true
  md: 'A release is a bundle that contains a particular version of your application,
    its dependencies, its configuration, and any metadata it requires to get running
    and stay running. A deployment is a way of getting a release into an environment
    where it can be used.


    A hot upgrade is a kind of deployment that allows the release of a currently running
    application to be changed while that application continues to run—the upgrade
    happens in place with no user-detectable disruption.


    In this section we''ll talk about releases and hot upgrades. We won''t dig deeply
    into deployment.


    # EXRM—The Elixir Release Manager


    exrm is an Elixir package that makes most release tasks easy. It is built on top
    of the Erlang relax package, which in turn uses some special features of the Erlang
    virtual machine.


    Imagine you were managing the deployment of hundreds of thousands of lines of
    code into running telephone switches, while maintaining all the ongoing connections,
    providing a full audit trail, and maintaining contractual uptime guarantees. This
    is clearly complex. Very complex. And this is the task the Erlang folks faced,
    so they created tools that help.


    relx and exrm are layers of abstraction on top of this complexity. Normally manage
    to hide it, but sometimes the lower levels leak out and you get to see how the
    sausage is made.


    This book isn''t going to get that deep. Instead, I just want to give you a feel
    for the process.


    # Before We Start


    In Elixir, we version both the application code and the data it operates on. The
    two are independent—we might go for a dozen code releases without changing any
    data structures.


    The code version is stored in the project dictionary in mix.exs. But how we version
    the data. Come to think of it, where do we even define the data?


    In an OTP application, all state is maintained by servers, and each server''s
    state is independent. So it makes sense to version the app data within each server
    module. Perhaps a server initially holds its state in a two-element tuple. That
    could be version 0. Later, it is changed to hold state in a three-element tuple.
    That could be version 1.'
