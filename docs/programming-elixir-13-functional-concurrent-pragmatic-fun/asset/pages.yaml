    \ in the 1st argument from the success typing\narguments: ([any()],number)\ndone\
    \ in 0m28s\ndone (warnings were emitted)\n\nHere it noticed that the length_plus_n\
    \ function called on its first parameter,\nand length requires a list as an argument.\
    \ This means length_plus_n needs\na list argument, and so it compiles.\n\nWhat\
