    #Stream-enum: [1, 2, 3, 4]

    funs: [#Function<32.133702391 in Stream.map/2>,\ #Function<32.133702391 in Stream.map/2>]

    ```


    ```

    iex odds = Stream.filter plus_ones, fn x -> rem(x,2) == 1 end

    #Stream-enum: [1, 2, 3, 4]

    funs: [#Function<26.133702391 in Stream.filter/2>,\ #Function<32.133702391 in
    Stream.map/2>,\ #Function<32.133702391 in Stream.map/2>]

    ```


    Enum.to_list odds

    [5, 17]


    Of course, in real life we have written this


    ```

    enum/stream1.exs

    [1,2,3,4]

    |> Stream.map(&(&1*1))

    |> Stream.filter(fn x -> rem(x,2) == 1)

    |> Enum.to_list

    ```


    Note that we''re never creating intermediate lists—we''re just passing successive
    elements of each of the collections to the next in the chain. The Stream values
    shown in the previous iex session gives a hint of how this works—streams are represented
    as a list of functions, each of which is applied in turn to each element of the
    stream as it is processed.


