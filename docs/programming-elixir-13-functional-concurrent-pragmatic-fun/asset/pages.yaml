    # Regular Expressions


    Elixir has regular-expression literals, written as ~r{regexp} or ~r{regexp}opts.
    Here I show the delimiters for regular-expression literals as { and }, but they
    are considerably more flexible. You can choose any nonalphanumeric characters
    as delimiters, as described in the discussion of sigils on page 114. Some people
    use ~r|../ for nostalgic reasons, but this is less convenient than the bracketed
    forms, as any forward slash inside the pattern must be escaped.


    Elixir regular expression support is provided by PCRE,¹ which basically provides
    a Perl-5-compatible syntax for patterns.


    You can specify one or more single-character options following a regex literal.
    These modify the literal''s match behavior or add functionality.


    | Opt | Meaning |

    |---|---|

    | f | Force the pattern to start match on the first line of a multiline string.
    |

    | g | Support named groups. |

    | i | Make matches case insensitive. |

    | m | If the string to be matched contains multiple lines, ^ and $ match the start
    and end of lines. \A and \z continue to match the beginning or end of the string.
    |

    | s | Allow . to match any newline characters. |

    | U | Normally modifiers * and + are greedy, matching as much as possible. The
    U modifier makes them ungreedy, matching as little as possible. |

    | u | Enable unicode-specific patterns like \p. |

    | x | Enable extended mode—ignore whitespace and comments (# to end of line).
    |


    > ¹ http://www.pcre.org/'
