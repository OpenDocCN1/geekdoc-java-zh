  md: "# The Available Types\n\nYou can define implementations for one or more of\
    \ the following types:\n\n+   - Any Atom BitString Float Function\n- Integer List\
    \ Map PID Port\n- Record Reference Tuple\n\nThe type BitString is used in place\
    \ of Binary.\n\nThe type Any is a catchall, allowing you to match an implementation\
    \ with any function. Just you'll want to put the implementations for specific\
    \ types before an implementation for Any.\n\nYou can list multiple types on a\
    \ single definipl. For example, the following protocol can be called to determine\
    \ whether a type is a collection:\n\n```\nprotocols/is_collection.ex\ndefprotocol\
    \ Collection do\n  @fallback_to_any true\n  def is_collection?(value)\nend\n\n\
    defimpl Collection, for: [List, Tuple, BitString, Map] do\n  def is_collection?(_),\
    \ do: true\nend\nndefimpl Collection, for: Any do\n  def is_collection?(_), do:\
    \ false\nend\n```\n\n```\nEnum.each [ 1, 1. 0, [1,2], {1,2}, %{}, \"cat\" ], fn\
    \ value ->\nIO.puts \"#{inspect value}: #{Collection.is_collection?(value)}\"\
    )\nend\n```\n\nWe write definipl stanzas for the collection types: List, Tuple,\
    \ BitString, and Map. But what about the other types? To handle them, we use the\
    \ special type Any in a second definipl. If we use Any, though, we also have to\
    \ add an annotation to the protocol definition. That's what the @fallback_to_any\
    \ line does.\n\nThis produces\n\n```\n1: false\n1.0: false\n[1,2]: true\n{1,2}:\
    \ true\n%{}: true\n\"cat\": true\n```\n\n# Your Turn"
