  md: '# Maps


    A map is a collection of key/value pairs. A map literal looks like this:


    ```

    %{ key => value

    ```


    Here are some maps:


    ```

    iex states = %{"AL" => "Alabama", "WI" => "Wisconsin"}

    %{"AL" => "Alabama", "WI" => "Wisconsin"}

    iex responses = %{:error, :enoent} => {:error, :busy} => :retry}

    %{error, :busy} => :retry, {:error, :enoent} => :fatal}

    iex colors = %{:red => 0xff0000, :green => 0x00ff00, :blue => 0x0000ff}

    %{blue: 255, green: 65280, red: 16711680}

    ```


    In the first case the keys are strings, in the second they are tuples, and in
    the third they''re atoms. Although typically all the keys in a map are the same
    type, that isn''t required.


    ```

    iex %{"one" => 1, :two => {1,1,1} => 3}

    %{:two => 2, {1, 1, 1} => 3, "one" => 1}

    ```


    If the key is an atom, you can use the same shortcut that you use with key-word
    lists:


    ```

    iex colors = %{red: 0xff0000, green: 0x00ff00, blue: 0x0000ff}

    %{blue: 255, green: 65280, red: 16711680}

    ```


    You can also use expressions for the keys in map literals:


    ```

    iex name = %{"José Valim"}

    "José Valim"

    iex %{String.downcase(name) => name}

    %{"jose valim" => "José Valim"}

    ```


    Why do we have both maps and keyword lists? Whereas keyword lists allow only one
    entry for a particular key. Maps are efficient (particularly as they grow), and
    they can be used in Elixir''s pattern matching, which we discuss in later chapters.


    In general, keyword lists are for things such as command-line parameters and for
    passing around options, and use maps when you want an associative array.


