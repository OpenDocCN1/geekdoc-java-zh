    Plutarch records the story of a ship called Theseus. Over the course of many years
    most of the ship''s structure was replaced, piece by piece. While this was happening,
    the ship was in continuous use. Plutarch raises the question "Is the renovated
    Theseus the same as the original"


    Using Elixir release management, our applications can work the same way the Theseus
    did, running continuously but being updated all the time.


    Is the latest application same as the original? Who cares, as long as it''s still
    running?


    # OTP Is Big—Unbelievably Big


    This book scratches OTP''s surface. But (I hope) it does introduce the major concepts
    and give you an idea of what''s possible.


    More advanced uses of OTP may include release management (including hot code-swapping),
    handling of distributed failover, automated scaling, and so on. But if you have
    an application that needs such things, you will likely already have or soon need
    dedicated operations experts who know the low-level details of making OTP apps
    perform the way you need to.


    There is nothing simple about scaling out to the kind of size and sophistication
    that is possible with OTP. But now you know you can start small and get there.'
