    # Comprehensions


    When you''re writing functional code, you often map and filter collections of
    things. To make your life easier (and your code easier to read), Elixir provides
    a general-purpose shortcut for the: comprehension.


    The idea of a comprehension is fairly simple: given one or more collections, extract
    all combinations of values from each, optionally filter the values, and then generate
    a new collection using the values that remain.


    The general syntax for comprehensions is deceptively simple:


    ```

    result = for generator or filter... [ into: value ], do: expression

    ```


    Let''s see a couple of basic examples before we get into the details.


    ```

    iex for x <- [ 1, 2, 3, 4, 5 ], do: x * x

    [1, 4, 9, 16, 25]

    iex for x <- [ 1, 2, 3, 4, 5 ], x < 4, do: x * x

    [1, 4, 9]

    ```


    A generator specifies how you to extract values from a collection


    ```

    pattern <- enumerable_thing

    ```


    Any variables matched in the pattern are available in the rest of the comprehension
    (including the block). For example, x <- [1,2,3] says that we want to run the
    rest of the comprehension with x set to 1. Then we run it with x set to 2, and
    if we have two generators, their operations are nested,


    x <- [1,2], y <- [5,6]

    will run the rest of the comprehension with x=1, y=5; y=6; x=2, y=5; and x=2,
    y=6. We can use these values of x and y in the do block.


    ```

    iex for x <- [1,2], y <- [5,6], do: x * y

    [5, 6, 10, 12]

    iex for x <- [1,2], y <- [5,6], do: {x, y}

    [{1, 5}, {1, 6}, {2, 5}, {2, 6}]

    ```


    You can use variables from generators in later generators:'
