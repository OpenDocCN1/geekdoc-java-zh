    \    hsb: [ red: {0,100,100}, green: {120,100,100}, blue: {240,100,100} ]\n  ]\n\
    \ndef sigil_c(color_name, []), do: _c(color_name, :rgb)\ndef sigil_c(color_name,\
    \ 'r'), do: _c(color_name, :rgb)\ndef sigil_c(color_name, 'h'), do: _c(color_name,\
    \ :hsb)\n\ndefp_c(color_name, color_space) do\n  @color_map[color_space][String.to_atom(color_name)]\n\
    end\n\ndefmacro __using__(_opts) do\n  quote do\n    import Kernel, except: [sigil_c:\
    \ 2]\n    import unicode(__MODULE__), only: [sigil_c: 2]\n  end\nend\n\ndefmodule\
    \ Example do\n  use ColorSigil\n  def rgb, do: IO.inspect ~c{red}\n  def hsb,\
    \ do: IO.inspect ~c{red}h\nend\n```\n\nExample.rgb #=> 16711680 (== 0xff0000)\n\
    Example.hsb #=> {0,100,100}\n\nThe three clauses for the sigil_c function let\
