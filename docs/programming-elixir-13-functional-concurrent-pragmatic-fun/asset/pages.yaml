  md: '# CHAPTER 16


    # Nodes—The Key to Distributing Services


    There’s nothing mysterious about a node. It is simply a running Erlang VM. Throughout
    this book we''ve been running our code on a node.


    The Erlang VM, called Beam, is more than a simple interpreter. It''s like its
    own little operating system running on top of your host operating system. It handles
    its own events, process scheduling, memory, naming services, and interprocess
    communication. In addition to all, a node can connect to other nodes—in the same
    computer, across a LAN, or across the Internet—and provide many of the same services
    across these connections that it provides to the processes it hosts locally.


    # Naming Nodes


    So far we haven''t needed to give our node a name—we''ve had only one. We ask
    Elixir what the current node is called, it''ll give us a made-up name:


    ```

    iex> Node.self

    :nonode@nohost

    ```


    We can set the name of a node when we start. With iex, use either the --name or
    --s option. The former sets a fully qualified name:


    ```

    $ iex --name wobble@light-boy.local\iex(wobble@light-boy.local)> Node.self

    :"wobble@light-boy.local"

    ```


    The latter sets a short name.


    The name that''s returned is an atom—it''s in quotes because it contains characters
    not allowed in a literal atom.


    ```

    $ iex --name wobble\iex(wobble@light-boy)> Node.self

    :"wobble@light-boy"

    ```'
