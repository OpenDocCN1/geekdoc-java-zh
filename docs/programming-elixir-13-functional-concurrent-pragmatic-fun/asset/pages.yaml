- img_proc: true
  md: "We do with this having our inspect function return an algebra document rather\
    \ than a string. In that document, we indicate places where breaks are allowed\
    \ (but not required) and how we show the nesting works:\n\n```\nprotocols/bitmap_algebra.exs\n\
    defmodule Bitmap\n  defstruct value: 0\n\ndefimpl Inspect, for: Bitmap\n  import\
    \ Inspect.Algebra\n  def inspect(%Bitmap{value: value}, _opts) do\n    concat(\n\
    \      nest(\n        concat([\n          \"%Bitmap{\\n          break(\"\"),\n\
    \          nest([to_string(value),\n            \"=\",\n            break(\"\"\
    ),\n            as_binary(value))],\n        ]), 2),\n        break(\"\"),\n \
    \       \"\")\n      end)\n  end\n  defp as binary(value) do\n    to_string(:io_lib.format(\"\
    ~2B\", [value]))\n  end\nend\n```\n\nbig_bitmap = %Bitmap{value: 12345678901234567890}\n\
    IO.inspect big_bitmap\nIO.inspect big_bitmap, structs: false\n\nWe get this output:\n\
    \n```\niex %Bitmap{value: 12345}\n%Bitmap(12345=0110000000110001)\niex %Bitmap{value:\
    \ 123456789123456789}\n%Bitmap{\n  123456789123456789=\n  0110111011001101011001011110101110000011111010101\n\
    }\n```\n\nFor more information, see the documentation for Inspect.Algebra.\n\n\
    # Built-in Protocols: List.Chars and String.Chars\n\nThe List.Chars protocol is\
    \ used by the Kernel to :charlist function to convert a value into a list of characters\
    \ (think *single quoted string*)."
