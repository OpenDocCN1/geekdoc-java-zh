    \ and a second supervisor. That second supervisor then manages the worker that\
    \ generates the sequence.\n\nOur sequence generator needs to know the PID of the\
    \ stash in order to retrieve and store the sequence value. We could register the\
    \ stash process under a name (just as we did with the sequence worker itself),\
    \ but as this is purely a local affair, we can pass it the PID directly. However,\
    \ to do we need to get the stash worker spawned first. This leads to a slightly\
    \ different design for the top-level supervisor. We'll move the code that starts\
    \ the top-level supervisor out of sequence.ex and into a separate module. We'll\
    \ initialize it with no children and add the stash and the subsupervisor manually.\
    \ Once we start the stash worker, we'll have its PID, and we can pass it on to\
    \ the subsupervisor (which in turn will pass it to the sequence worker). Our supervisor\
    \ looks like this:\n\n```\notp-supervisor/2/sequence/lib/supervisor.ex\ndef Sequence.Supervisor\
    \ do\n    use def start_link(initial_number) do\n        result = {ok, sup} =\
    \ Supervisor.link(__MODULE__, [initial_number])\n        start_workers(sup, initial_number)\n\
    \        result\n    end\n    def start_workers(sup, initial_number) do\n    \
    \    # Start the stash worker\n        Supervisor.start_child(sup, worker(Sequence.Stash,\
    \ [initial_number])\n        # and then the subsupervisor for the actual sequence\
    \ server\n        Supervisor.start_child(sup, supervisor(Sequence.SubSupervisor,\
    \ [stash]))\n    end\n    def init([]) do\n        supervise [], strategy: :one_for_one\n\
    \        result\n    end\n```"
