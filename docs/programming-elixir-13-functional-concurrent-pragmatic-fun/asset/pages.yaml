    \ Named Functions\n\nOnce a program grows beyond a couple of lines, you'll want\
    \ to structure it. Elixir makes this easy. You break your code into named functions\
    \ and organize these functions into modules. In fact, in Elixir named functions\
    \ must be written inside modules.\n\nLet's look at a simple example. Navigate\
    \ to a working directory and create an Elixir source file called times.exs.\n\n\
    ```\nmm/times.exs\ndefmodule Times do\n  def double(n) do\n    n * 2\n  end\n\
    end\n```\n\nHere we have a module named Times. It contains a single function,\
    \ double. Because our function takes a single argument and because the number\
    \ of arguments forms part of the way we identify Elixir functions, you'll see\
    \ this function name written double/1.\n\n# ## Compiling a Module\n\nLet's look\
    \ at two ways to compile this file and load it into elix. First, if you're at\
    \ the command line, you can do this:\n\n```\n$ iex times.exs\\iex> Times.double(4)\n\
    8\n```\n\nGive ix a source file's name, and it compiles and loads the file before\
    \ it displays a prompt.\n\nIf you're already in iex, you can use the c helper\
    \ to compile your file without returning to the command line."
