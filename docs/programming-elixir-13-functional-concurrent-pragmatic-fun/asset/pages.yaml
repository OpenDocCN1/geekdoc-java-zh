  md: '# Single-Quoted Strings—Lists of Character Codes


    Single-quoted strings are represented as a list of integer values, each value
    corresponding to a codepoint in the string. For this reason, we refer to them
    as character lists (or char lists).


    ```

    iex> str = ''wombat''

    ''wombat''\iex> is_list str

    true\iex> length str

    6\iex> Enum.reverse str

    ''tabnow''

    ```


    This is confusing: iex says it is a list, but it shows the value as a string.
    That is because iex prints a list of integers as a string if it believes each
    number in the list is a printable character. You can try this for yourself.


    ```

    iex> [ 67, 65, 84 ]

    ''CAT''

    ```


    You can look at the internal representation in a number of ways:


    ```

    iex> str = ''wombat''

    ''wombat''\iex> :io.format("-w-n", [ str ])

    [119,111,109,98,97,116]

    iex> List.to_tuple str

    {119, 111, 109, 98, 97, 116}

    > str ++ [0]

    [119, 111, 109, 98, 97, 116]

    ```


    The ~w in the format string forces str to be written as an Erlang term—the underlying
    list of integers. The ~n is a newline.


    The last example creates a new character list with a null byte at the end. iex
    no longer thinks all the bytes are printable, and so returns the underlying character
    codes.


    If a character list contains characters Erlang considers nonprintable, you''ll
    see the list representation.


    ```

    iex> ''\x0/ay''

    [8706, 120, 47, 8706, 121]

    ```


    Because a character list is a list, we can use the usual pattern matching and
    List functions.'
