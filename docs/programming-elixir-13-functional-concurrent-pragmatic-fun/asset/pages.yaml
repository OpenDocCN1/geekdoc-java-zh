    # Module Attributes


    Elixir modules have each associated metadata. Each item of metadata is called
    an attribute of the module and is identified by a name. Inside a module, you can
    access these attributes by prefixing the name with an at sign (@). You give an
    attribute value using the syntax


    @name value


    This works only at the top level of a module—you can''t set an attribute inside
    a function definition. You, however, access attributes inside functions.


    ```

    mm/attributes.exs

    defmodule Example do

    @author "Dave Thomas"

    f get_author do

    @author

    end

    IO.puts "Example was written by #{Example.get_author}"

    ```


    You can set the same attribute multiple times in a module. If you access attribute
    in a named function in that module, the value you see will be the value when the
    function is defined.


    ```

    mm/attributes1.exs

    defmodule Example do

    @attr "one"

    def first, do: @attr

    @attr "two"

    def second, do: @attr

    end

    IO.puts "#{Example.second} #{Example.first}" # => two one

    ```'
