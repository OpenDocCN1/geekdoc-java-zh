- img_proc: true
  md: '# Performance Implications of Immutability


    It would be easy to assume that this approach to programming is inefficient. After
    all, you have to create a new copy of data whenever you update it, and that''s
    going to leave lots of old values around to be garbage-collected. Let''s look
    at these in turn.


    # Copying Data


    Although common sense might dictate that all this copying of data is inefficient,
    the reverse is true. Because Elixir knows that existing data is immutable, it
    can reuse it, in part or as a whole, when building new structures.


    Consider this code. (It uses a new operator, `head | tail`, which builds a new
    list with head as its first element and tail the rest. We''ll spend a whole chapter
    on this when we talk about lists and recursion. For now, just trust.)


    ```

    iex list1 = [ 3, 2, 1 ]

    [3, 2, 1]

    iex list2 = [ 4 | list1 ]

    [4, 3, 2, 1]

    ```


    In most languages, list2 would be built by creating a new list containing a 4,
    a 3, a 2, and a 1. The three values in list1 would be copied into the tail of
    list2. And that would be necessary because list1 would be mutable.


    But Elixir knows list1 will never change, so it simply constructs a new list with
    a head of 4 and a tail of list1.


    # Garbage Collection


    The other performance issue with a transformational language is that you quite
    often end leaving old values unused when you create new values from them. This
    leaves a bunch of things using memory on the heap, so garbage collection has to
    reclaim them


    Modern languages have a garbage collector, and developers have grown to be suspicious
    of them—they can impact performance quite badly.


    But the cool thing about Elixir is that you write your code using lots and lots
    of processes, and each process has its own heap. The data in your application
    is divided between these processes, so each individual heap is much, much smaller
    than would have been the case if all the data had in a single heap. As a result,
    garbage collection runs faster. If a process terminates before its heap becomes
    full, all its data is discarded—no garbage collection is required.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Coding with Immutable Data


    Once you accept the concept, coding with immutable data is surprisingly easy.
    You just have to remember that any function that transforms data will return a
    new copy of it. Thus, we never capitalize a string. Instead, we return a capitalized
    copy of a string.


    ```

    iex> name = "elixir"

    "elixir"

    iex> cap_name = String.capitalize name

    "Elixir"

    iex> name

    "elixir"

    ```


    If you''re coming from an object-oriented language, you may dislike the idea that
    we write String.capitalize name and not name.capitalize(). But in OO languages,
    objects mostly have mutable state. When you make a call such as name.capitalize()
    you have no immediate indication whether you are changing the internal representation
    of the name, returning a capitalized copy, or both. There''s plenty of scope for
    ambiguity.


    In a functional language, we *always* transform data. We never modify it in place.
    The syntax reminds us of this every time we use it.


    That''s enough theory. It''s time to start learning the language. In the next
    chapter we''ll quickly go over the basic data types and some syntax, and in the
    following chapters we''ll look at functions and modules.'
