  md: 'The call to Task.async creates a separate process that runs the given function.
    The return value of async is a task descriptor (actually a PID and a ref) that
    we''ll use to identify the task later.


    Once the task is running, the code continues with other work. When it wants to
    get the function''s value, it calls Task.await, passing the task descriptor. This
    call waits for our background task to finish and returns its value.


    When we run this, we see


    ```

    $ elixir tasks1.ex

    Start the task

    Do something else

    Wait for the task

    The result is 6765

    ```


    We can also pass Task.async the name of a module and function, along with any
    arguments. Here are the changes:


    ```

    tasks/tasks.ex

    worker = Task.async(Fib, :of, [20])

    result = Task.await(worker)

    IO.puts "The result is #{result}"

    ```


    # Tasks and Supervision


    Tasks are implemented as an OTP servers, which means we can add them to our application''s
    supervision tree. We can do this in two ways.


    First, we can link a task to a currently supervised process by calling start_link
    instead of async. This has less impact than you might think. If the function running
    in the task crashes and we use start_link, our process will be terminated immediately.
    If we use async, our process will be terminated only when we subsequently call
    await on the crashed task.


    The second way to supervise tasks is to run them directly from a supervisor. This
    is pretty much the same as specifying any other worker:


    ```

    import Supervisor.Spec

    children = [

    worker(Task, fn fn -> do_something_extraordinary() end)

    ]

    ```


    supervise children, strategy: :one_for_one


    # Agents


    An agent is a background process that maintains state. This state can be accessed
    at different places within a process or node, or across multiple nodes.'
