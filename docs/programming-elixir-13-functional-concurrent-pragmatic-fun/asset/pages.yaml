  md: '# Foreword


    I have always been fascinated with how changes in hardware affect how we write
    software.


    A couple of decades ago, memory was a very limited resource. It made sense back
    then for our software to take hold of some piece of memory and mutate it as necessary.
    However, allocating this memory and cleaning up after we no longer needed it was
    a very error-prone task. Some memory was never freed; sometimes memory was allocated
    over another structure, leading to faults. At the time, garbage collection was
    a known technique, but we needed faster CPUs in order to use it in our daily software
    and free ourselves from manual memory management. That has happened—most of our
    languages are now garbage-collected.


    Today, a similar phenomenon is happening. Our CPUs get more and more cores. This
    means new software needs to use as many cores as it can as if it is to maximize
    its use of the machine. This conflicts directly with how we currently write software.


    In fact, mutating our memory actually slows down our software when many cores
    are involved. If you have four cores trying to access and manipulate the same
    piece of memory, they can trip over each other. This potentially corrupts memory
    unless some kind of synchronization is applied.


    I quickly learned that applying this synchronization is manual, error prone, and
    tiresome, and it hurts performance. I suddenly realized that''s not how I wanted
    to spend time writing software in the next years of my career, and I set out to
    study new languages and technologies.


    It was on this quest that I fell in love with the Erlang virtual machine and ecosystem.


    In the Erlang VM, all code runs in tiny concurrent processes, each with its own
    state. Processes talk to each other via messages. And since all communication
    happens by message-passing, exchanging messages between different'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'machines on the same network is handled transparently by the VM, making it
    a perfect environment for building distributed software!


    However, I felt there was still a gap in the Erlang ecosystem. I missed firstclass
    support for some of the features I find necessary in my daily work, things such
    as metaprogramming, polymorphism, and first-class tooling. From this need, Elixir
    was born.


    Elixir is a pragmatic approach to functional programming. It values its functional
    foundations and it focuses on developer productivity. Concurrency is the backbone
    of Elixir software. As garbage collection once free developers from the shackles
    of memory management, Elixir is here to free you from antiquated concurrency mechanisms
    and bring you joy when writing concurrency code.


    A functional programming language lets us think in terms of functions that transform
    data. This transformation never mutates data. Instead, each application of a function
    potentially creates a new, fresh version of the data. This greatly reduces the
    need for data-synchronization mechanisms.


    Elixir also empowers developers by providing macros. Elixir code is nothing more
    than data, and therefore can be manipulated via macros like any other value in
    the language.


    Finally, object-oriented programmers will find many of the mechanisms they consider
    essential to writing good software, such as polymorphism, in Elixir.


    All this is powered by the Erlang VM, a 20-year-old virtual machine built from
    scratch to support robust, concurrent, and distributed software. Elixir and the
    Erlang VM are going to change how you write software and make you ready to tackle
    the upcoming years in programming.


    José Valim


    Creator of Elixir


    Tenczynek, Poland, October 2014'
  merge: -1
