  md: 'The first thing to note is line 2. The use line effectively adds the OTP

    GenServer behavior to our module. This is what it lets handle all the callbacks.

    It also means we don''t have to define every callback in our module—the

    behavior defines defaults for them all.


    When a client calls our server, GenServer invokes the handle_call function than

    follow. It receives


    +   - The information client passed to the call as its first parameter

    - The PID of the client as the second parameter

    - The server state as the third parameter


    Our implementation is simple: we return a tuple to OTP.


    ```

    { :reply, current_number, current_number+1 }

    ```


    The reply element tells OTP to reply to the client, passing back the value that

    is the second element. Finally, the tuple''s third element de-ines the new state.

    This will be passed as the last parameter to handle_call the next time it is

    invoked.


    # Fire Up Our Server Manually


    We can play with our server in iex. Open it in the project''s main directory,

    remembering the -S mix option.


    ```

    $ iex -S mix

    > {ok, pid} = GenServer.start_link(Sequence.Server, 100)

    {:ok, #PID<0.71.0}>

    > GenServer.call(pid, :next_number)

    100

    > GenServer.call(pid, :next_number)

    101

    > GenServer.call(pid, :next_number)

    102

    ```


    We''re using two functions from the Elixir GenServer module. The start_link function

    behaves like the spawn_function we used in the previous chapter. It asks

    GenServer to start a new process and link to it (so we get notifications if it

    fails). We pass in the module to run as a: the initial state (100 in this

    case). We could also pass GenServer options as a third parameter, but the

    defaults work fine here.


    We get back a status (:ok) and the server''s PID. The call function takes this

    PID and calls the handle_call function in the server. The call''s second parameter

    is passed as the first argument to handle_call.'
