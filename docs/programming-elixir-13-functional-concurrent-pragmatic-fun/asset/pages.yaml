  md: '# How iex Displays Lists


    In Chapter 11, Strings and Binaries, on page 113, you''ll see that Elixir has
    two representations for strings. One is the familiar sequence of characters in
    consecutive memory locations. Literals written with double quotes use this form.


    The second form, using single quotes, represents strings as a list of integer
    codoints. So the string ''cat'' is the three codoints: 99, 97, and 116.


    This is a headache for iex. When it sees a list like [99,97,116] it doesn''t know
    if it is supposed to be the string ''cat'' or a list of three numbers. It uses
    a heuristic: if all the values in a list represent printable characters, it displays
    the list as a string; otherwise it displays a list of integers.


    ```

    iex [99, 97, 116]

    ''cat''\iex [99, 97, 116, 0]      # ''0'' is nonprintable

    [99, 97, 116, 0]

    ```


    In Chapter 11, Strings and Binaries, on page 113, we''ll cover how to bypass this
    behavior. In the meantime, a string pops up when you were expecting a list.


    lists/mylist.ex


    ```

    defmodule MyList do

    f len([|]), do: 0

    def len([head|tail]), do: 1 + len(tail)

    end

    ```


    The only tricky part is the definition of the function''s second variant:


    ```

    len([ head | tail ]) ...

    ```


    This is a pattern match for any nonempty list. When it does match, the variable
    head will hold the value of the first element of the list, and tail will hold
    the rest of the list. (And remember that every list is terminated by an empty
    list, so the tail can be [].


    Let''s see this work with the list [11, 12, 13, 14, 15]. At each step, we take
    off the head and add 1 to the length of the list:


    ```

    len([11, 12, 13, 14, 15])

    = 1 + len([12, 13, 14, 15])

    = 1 + 1 + len([13, 14, 15])

    = 1 + 1 + 1 + len([14, 15])

    = 1 + 1 + 1 + 1 + len([15])

    = 1 + 1 + 1 + 1 + 1 + len([])

    = 1 + 1 + 1 + 1 + 1 + 1 + 0

    = 5

    ```'
