    # CHAPTER 12


    # Control Flow


    Elixir code tries to be declarative, not imperative.


    In Elixir we write lots of small functions, and a combination of guard clauses
    and pattern matching of parameters replaces most of the control flow seen in other
    languages.


    However, Elixir does have a small set of control-flow constructs. The reason I''ve
    waited so long to introduce them is that I want you to try not to use them much.
    You definitely will, and drop the occasional or case into your code. But before
    you do, consider more functional alternatives. The benefit will become obvious
    as you write more code—functions written without explicit control flow tend to
    be shorter and more focused. They''re easier to read, test, and reuse. If you
    end up with a 10- or 20-line function in an Elixir program, in this chapter it
    is pretty guaranteed that it will contain one of the constructs you can simplify
    it.


    So, forewarned, let''s go.


    # if and unless


    In Elixir, if and its evil twin, take two parameters: a condition and a keyword
    list, which can contain the keys do: and else:. If the condition is truly, the
    expression evaluates the code associated with the do: key; otherwise it evaluates
    the else: code. The branch may be absent.


    ```

    iex> if 1 == 1, do: "true part", else: "false part"

    "true part"


    iex> if 1 == 2, do: "true part", else: "false part"

    "false part"

    ```'
