  md: "CHAPTER 20\n\n# Tasks and Agents\n\nThis part of the book is about processes\
    \ and process distribution. So far we've covered two extremes. In the first chapters\
    \ we looked at the spawn primitive, along with message sending and receiving and\
    \ multinode operations. We then looked at OTP, the 800-pound gorilla of process\
    \ architecture.\n\nSometimes, though, we want something in the middle. We want\
    \ to be able to run simple processes, either for background processing or for\
    \ maintaining state. But we don't want to be bothered with the low-level details\
    \ of spawn, send, and receive, and we really don't need the extra control that\
    \ writing our GenServer gives us.\n\nEnter tasks and agents, two simple-to-use\
    \ Elixir abstractions. These use OTP's features but insulate us from these details.\n\
    \n# Tasks\n\nAn Elixir task is a function that runs in the background.\n\n```\n\
    tasks/tasks1.ex\ndefmodule Fib do\n  def(0), do: 0\n  def(1), do: 1\n  def(n),\
    \ do: Fib.of(n-1) + Fib.of(n-2)\nend\n\nIO.puts \"Start the task\"\nworker = Task.async(fn\
    \ -> Fib.of(20) end)\nIO.puts \"Do something else\"\n# ...\nIO.puts \"Wait for\
    \ the task\"\nresult = Task.await(worker)\nIO.puts \"The result is #{result}\"\
    \n```"
