    Because squares are enumerable, you can also pass a stream to a stream function.
    Because of this, we say that streams are composable.


    ```

    iex squares = Stream.map [1, 2, 3, 4],(&(&1*)

    #Stream-enum: [1, 2, 3, 4]

    funs: [#Function<32.133702391 in Stream.map/2>]

