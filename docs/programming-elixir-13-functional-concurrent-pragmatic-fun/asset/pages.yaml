- img_proc: true
  md: "the calculation, and a scheduler that assigns work to a calculation process\
    \ when it becomes free. The following diagram shows the message flow.\n\n![](img/1ab9716b0f893152e6837cbf5f4252d6_206_0.png)\n\
    \nWhen the calculator is ready for the next number, it sends a :ready message\
    \ to the scheduler. If there is still work to do, the scheduler sends it to the\
    \ calculator in a :fib message; otherwise it sends the calculator a :shutdown.\
    \ When a calculator receives a :fib message, it calculates the given Fibonacci\
    \ number and returns it in an :answer. If it gets a :shutdown, it simply exits.\n\
    \nHere's the Fibonacci calculator module:\n\n```\nspawn/fib.exs\ndefmodule FibSolver\
    \ do\n  def fib(scheduler) do\n    send scheduler, {:ready, self }\n    receive\
    \ do\n      {:fib, n, client} ->\n        send client, {:answer, n, fib_calc(n)}\n\
    \        fib(scheduler)\n      {:shutdown} ->\n        exit(:normal)\n    end\n\
    \  end\n\n  # very inefficient, deliberately\n  defp fib_calc(0), do: 0\n  defp\
    \ fib_calc(1), do: 1\n  defp fib_calc(n), do: fib_calc(n-1) + fib_calc(n)\nend\n\
    ```\n\nThe public API is the fib function, which takes the scheduler PID. When\
    \ it starts, it sends a :ready message to the scheduler and then waits for a message\
    \ back."
