  md: "```\ncase File.open(\"config_file\")\n  {:ok, file} ->\n    process(file)\n\
    \  {:error, message} ->\n    raise \"Failed to open config file: #{message}\"\n\
    end\n```\n\nOr you let Elixir raise an exception for you and write\n\n```\n{ok,\
    \ file} = File.open(\"config_file\")\nprocess(file)\n```\n\nIf the pattern match\
    \ on the first line fails, Elixir will raise a MatchError exception. It won't\
    \ be as informative as our version that handled the error explicitly, but if the\
    \ error should never happen, this is probably good enough (at least until it triggers\
    \ the first time and the operations folks say they'd like more information).\n\
    \nAn even better way to handle this is to use File.open!. The trailing exclamation\
    \ point in the method name is an Elixir convention—if you see it, you know the\
    \ function will raise an exception on error, and that exception will be meaningful.\
    \ So we could write\n\n```\nfile = File.open(\"config_file\")\n```\n\nand get\
    \ on with our lives.\n\n# Doing More with Less\n\nElixir has just a few forms\
    \ of control flow: if, cond, unless, case, and (perhaps) raise. But surprisingly,\
    \ this doesn't matter in practice. Elixir programs are rich and expressive without\
    \ a lot of branching code. And they're easier to work with as a result.\n\nThat\
    \ concludes our tour of Elixir. Now let's start putting it all together and implement\
    \ a full project.\n\n# Your Turn\n\n+   Exercise: ControlFlow-1\nRewrite the FizzBuzz\
