    # Functions Remember Their Original Environment


    Let''s take this idea of greeter a function further.


    ```

    iex greeter = fn name -> (fn -> "Hello #{name}") end

    #Function12.17052888 in :erl_eval.expr/5

    iex dave_greeter = greeter("Dave")

    #Function12.17052888 in :erl_eval.expr/5

    iex dave_greeter.()

    "Hello Dave"

    ```


    Now the outer function has a name parameter. Like any parameter, name is available
    for use throughout the body of the function. In this case, we use inside the string
    in the inner function.


    When we call the outer function, it returns the inner function definition. At
    this point it has not yet substituted the name into the string. But when we call
    the inner function (dave_greeter()), the substitution takes place and the greeting
    appears.


    But something strange happens here. The inner function uses the outer function''s
    name parameter. By the time greeter("Dave") returns, the outer function has finished
    executing and the parameter has gone out of scope. And yet we run the inner function,
    it merely uses that parameter''s value.


    This works because functions in Elixir carry with them the bindings of variables
    in the scope in which they are defined. In our example, the variable name is bound
    in the scope of the outer function. When the inner function is defined, it inherits
    this scope and carries the binding of name around with it. This is a closure—the
    scope encloses the bindings of its variables, packaging them into something that
    can be saved and used later.


    Let''s play with this some more.'
