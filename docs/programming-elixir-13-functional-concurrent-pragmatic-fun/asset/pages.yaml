- img_proc: true
  md: "```\nexceptions/defexception.ex\ndefmodule KinectProtocol do\n  defexception\
    \ message: \"Kinect protocol error\",\n    can_retry: false\n\n  def full_message(me)\
    \ do\n    \"Kinect failed: #{me.message}, retriable: #{me.can_retry}\"\n  end\n\
    end\n```\n\nUsers of our library could write code like:\n\n```\nexceptions/defexception.ex\n\
    try do\n  talk_to_kinect\n  rescue\n    error in [KinectProtocolError] ->\n  \
    \    I.puts KinectProtocolError.full_message(error)\n      if error.can_retry,\
    \ do: schedule_retry\nend\n```\n\nIf an exception gets raised, the code handles\
    \ it and possibly retries:\nKinect failed: usb unplugged, retriable: true\nRetrying\
    \ in 10 seconds\n\n# Now Ignore This Appendix\n\nThe Elixir source code for the\
    \ mix utility contains no exception handlers. The Elixir compiler itself contains\
    \ a total of five (but it is doing some pretty funky things).\n\nIf you find yourself\
    \ defining new exceptions, ask if you should be isolating the code in a separate\
    \ process instead. After all, if it can go wrong, wouldn't you want to isolate\
    \ it?"
