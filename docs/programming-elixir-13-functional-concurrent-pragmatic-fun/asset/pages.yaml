    \  def sum([], total) do: total\n  def sum([head | tail], total) do: sum(tail,\
    \ head+total)\nend\n```\n\nThe parameter total maintains the state while the function\
    \ trles down the list.\n\nIn our Fibonacci code, we maintained a lot of state\
    \ in the schedule_processes function. In fact, all three of its parameters were\
