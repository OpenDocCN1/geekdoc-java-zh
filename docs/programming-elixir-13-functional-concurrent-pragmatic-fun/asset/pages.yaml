    # CHAPTER 2


    # Pattern Matching


    We started the previous chapter by saying Elixir engenders a different way of
    thinking about programming.


    To illustrate this and to lay the foundation for a lot of Elixir programming,
    let''s start reprogramming your brain by looking at something that''s one of the
    cornersstones of all programming languages—assignment.


    # Assignment:


    # I Do Not Think It Means What You Think It Means.


    Let''s use the interactive Elixir shell, iex, to look at a really simple piece
    of code. (Remember, you start iex at the command prompt and you enter Elixir code
    at its iex> prompt, and it displays the resulting values.)


    ```

    iex> a = 1

    1

    iex> a + 3

    4

    ```


    Most programmers would look at this code and say, "OK, we assign one to a variable
    a, then on the next line we add 3 to a, giving us 4."


    But when it comes to Elixir, they''d be wrong. In Elixir, the equals sign is not
    an assignment. Instead it''s like an assertion. It succeeds if Elixir can find
    a way of making the left-hand side equal the right-hand side. Elixir calls a =
    a match operator.


    In this case, the left-hand side is a variable and the right-hand side is an integer
    literal, Elixir can make the match true by binding the variable a to value 1.
    You could argue it is just an assignment. But let''s take it up a notch.'
