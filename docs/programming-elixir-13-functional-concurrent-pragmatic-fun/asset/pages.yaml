  md: "Now think about servers. They use recursion to loop, handling one request on\
    \ each call. They can also pass state to themselves as a parameter in a recursive\
    \ call. And that's one of the OTP manages for us. Our handler functions get the\
    \ current state (as their last parameter), and they return (other things) a potentially\
    \ updated state. Whatever state a function returns is the state that will be passed\
    \ to the next request handler.\n\n# Our First OTP Server\n\nLet's write what is\
    \ possibly the simplest OTP server. You pass a number when you start it up, and\
    \ that becomes the current state of the server. When you call it with a next request,\
    \ it returns that current state to the caller, and at the same time increments\
    \ the state, ready for the next call. Basically, each time you call it get an\
    \ updated sequence number.\n\n# Create a New Project Using Mix\n\nStart by creating\
    \ a new project in your work directory. We'll call it sequence.\n\n+   $ mix new\
    \ sequence\n* creating README.md\n* creating .gitignore\n* creating mix.exs\n\
    * creating lib\n* creating lib/sequence.ex\n* creating lib/sequence\n* creating\
    \ test\n* creating test/test_helper.exs\n* creating test/sequence_test.exs\n\n\
    # Create the Basic Sequence Server\n\nNow we'll create Sequence.Server, our server\
    \ module. Move into the sequence directory, and create a subdirectory under lib/\
    \ also called sequence.\n\n```\n$ cd sequence\n$ mkdir lib/sequence\n```\n\nAdd\
    \ the file server.ex to lib/sequence:\n\n```\notp-server/1/sequence/lib/sequence/server.ex\n\
    defmodule Sequence.Server do\n  use GenServer\n\n  def handle_call(:next_number,\
    \ _from, current_number) do\n    { :reply, current_number, current_number+1 }\n\
    \  end\nend\n```"
