  md: '# Protocols—Polymorphic Functions


    We have used the inspect function many times in this book. It returns a printable
    representation of any value as a binary (which is what we hard-core folks call
    strings).


    But stop and think for a minute. Just how can Elixir, which doesn''t have objects,
    know what to call to do the conversion to a binary? You can pass inspect anything,
    and Elixir somehow makes sense of it.


    It could be done using guard clauses:


    ```

    def inspect(value) when is_atom(value), do: ...

    df inspect(value) when is_binary(value), do: ...

    : :

    ```


    But there''s a better way.


    Elixir has the concept of protocols. A protocol is a little like the behaviours
    we saw in the previous chapter that it defines the functions that must be provided
    to achieve something. But a behaviour is internal to a module—the module implements
    the behaviour. Protocols are different—you can place a protocol''s implementation
    completely outside the module. This means you can extend modules'' functionality
    without having to add code to them—in fact, you can extend the functionality even
    if you don''t have the modules'' source code.


    # Defining a Protocol


    Protocol definitions are very similar to basic module definitions. They can contain
    module- and function-level documentation (@moduleledoc and @doc), and they will
    contain one or more function definitions. However, these functions will not have
    bodies—they are simply to declare the interface that the protocol requires.'
  merge: -1
  pgno: 291
- img_proc: true
  md: "For example, here is the definition of the Inspect protocol:\n\n```\ndefprotocol\
    \ do\n  def inspect(thing, opts)\nend\n```\n\nJust like a module, the protocol\
    \ defines one or more functions. But we implement the code separately.\n\n# Implementing\
    \ a Protocol\n\nThe defimpl macros let give you Elixir follows is the implementation\
    \ of a protocol for one or more types. The code that follows is the implementation\
    \ of the Inspect protocol for PIDs and references.\n\n```\ndefimpl Inspect, for:\
    \ PID do\n  def inspect(pid, _opts)\n    \"PID\" <> IO.iodata_to_binary(pid_to_list(pid))\n\
    end\n```\n\n```\ndefimpl Inspect, for: Reference do\n  def inspect(ref, _opts)\n\
    \    '#Ref' <> IO.iodata_to_binary(rest)\nend\n```\n\nFinally, the Kernel module\
    \ implements inspect, which calls Inspect.inspect(self) with its parameter. This\
    \ means that you call inspect(self), it becomes a call to Inspect.inspect(self).\
    \ And because self is a PID, this tern resolves to something like \"#PID<0.25.0\"\
    .\n\nBehind the scenes, defimpl puts the implementation for each protocol-and-type\
    \ combination into a separate module. The protocol for Inspect for the PID type\
    \ is in the module.PID. And because you can re modules, you can change the implementation\
    \ of functions accessed via protocols.\n\n```\niex inspect self\n\"#PID<0.25.0\"\
    \niex defimpl Inspect, for: PID do\n  def inspect(pid, _)\n    \"Process: \" <>\
    \ IO.iodata_to_binary(erlang.pid_to_list(pid)) <> \"!\"\nend\niex:3: redefining\
    \ module Inspect.PID\n{:module, Inspect.PID, <<70,79,...}>\niex inspect\n\"#Process<0.25.0>!\"\
    \n```"
