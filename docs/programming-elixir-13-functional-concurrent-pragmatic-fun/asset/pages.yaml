- img_proc: true
  md: "A sigil starts with a tilde, followed by an upper- or lowercase letter, delimited\
    \ content, and perhaps some options. The delimiters can be <...>, {...}, [...],\
    \ (...), [|], ..., \"\", and '...'.\n\nThe letter determines the sigil's type:\n\
    \n+   ~C A character list with no escaping or interpolation\n~c A character list,\
    \ escaped and interpolated just like a single-quoted string\n~D A Date in the\
    \ format yyyy-mm-dd\n~N A naive (raw) DateTime in the format yyyy-mm-dd hh:mm:ss[.ddd]\n\
    ~R A regular expression with no escaping or interpolation\n~r A regular expression,\
    \ escaped and interpolated\n~S A string with no escaping or interpolation\n~s\
    \ A string, escaped and interpolated just like a double-quoted string\n~T A Time\
    \ in the format hh:mm:ss[.dddd]\n~W A list of whitespace-delimited words, with\
    \ no escaping or interpolation\n~w A list of whitespace-delimited words, with\
    \ escaping and interpolation\n\nHere are some examples of sigils, using a variety\
    \ of delimiters:\n\n```\niex > -C[1n2#{1+2}]\n'\\1n2\\{1+2}'\\iex > -C\"1\\n2#{1+2}\"\
    \n'1n23'\n > -S[1n2#{1+2}]\n\"\\\"1n2\\#{1+2}\"\n > ~s/1n2#{1+2}/\n\"1n23\"\\\
    iex > -W[the c#{'a'}t sat on the mat]\n[\"the\", \"c\\#{'a'}t\", \"sat\", \"on\"\
    , \"the\", \"mat\"]\niex > -W[the c#{'a'}t sat on the mat]\n[\"the\", \"cat\"\
    , \"sat\", \"on\", \"the\", \"mat\"]\niex > -D[1999-12-31]\n-D[1999-12-31]\\iex\
    \ > ~T[12:34:56]\n-T[12:34:56]\niex > -N[1999-12-31 23:59:59]\n-N[1999-12-31 23:59:59]\n\
    ```\n\nThe ~W and ~w sigils take an optional type specifier, a, c or s, which\
    \ determines whether it returns atoms, list, or strings of characters. (We've\
    \ already seen the ~r options.)\n\n```\niex > -w[the c#{'a'}t sat on the mat]\n\
    [:the, :cat, :sat, :on, :the, :mat]\\iex > -w[the c#{'a'}t sat on the mat]c\n\
    ```"
