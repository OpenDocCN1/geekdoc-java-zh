    You can write the first of the previous examples as follows:\n\n```\niex if 1\
    \ == 1 do\n  ...> \"true part\"\n  ...> else\n  ...> \"false part\"\n  ...> end\n\
    truue part\n```\n\nunless is similar:\n\n```\niex unless 1 == 1, do: \"error\"\
    , else: \"OK\"\n\"OK\"\niex unless 1 == 2, do: \"OK\", else: \"error\"\n\"OK\"\
    \niex unless 1 == 2 do\n  ...> \"OK\"\n  ...> else\n  ...> \"error\"\n  ...> end\n\
    \"OK\"\n```\n\nThe value of if and unless is the value of the expression that\
    \ was evaluated.\n\n# cond\n\nThe cond macro lets you list out series of conditions,\
    \ each with associated code. It executes the code corresponding to the first truthy\
    \ conditions.\n\nIn the game of FizzBuzz, children count up from 1. If the number\
    \ is a multiple of three, they say “Fizz.” For multiples of five, they say “Buzz.”\
    \ For multiples of both, they say “FizzBuzz.” Otherwise, they say the number.\n\
    \nIn Elixir, we can code this as follows:\n\n```\ncontrol/fizzbuzz.ex\ndefmodule\
    \ FizzBuzz do\n  def upto(n) when n > 0, do: _upto(1, n, [])\n  defp _upto(current,\
    \ result), do: Enum.reverse result\n  defp _upto(current, left, result) do\n \
    \   next_answer =\ncond\n      rem(current, 3) == 0 and rem(current, 5) == 0 ->\n\
    \        \"FizzBuzz\"\n      rem(current, 3) == 0 ->\n        \"Fizz\"\n     \
    \ rem(current, 5) == 0 ->\n```"
