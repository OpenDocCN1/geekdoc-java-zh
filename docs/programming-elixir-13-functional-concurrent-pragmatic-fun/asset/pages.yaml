    \n# Parallel Map—The “Hello, World” of Erlang\n\nDevin Torres reminded me that\
    \ every book in the Erlang space must, by law, include a parallel map function.\
    \ Regular map returns the list that results from applying a function to each element\
    \ of a collection. The parallel version does the same, but it applies the function\
    \ to each element in a separate process.\n\n```\nspawnmodule pmap.exs\ndef Parallel\
    \ do\n  def pmap(collection, fun) do\n    me = self\n    collection\n    | Enum.map(fn\
    \ elem) ->\n      spawn_link fn -> (send me, {self, fun.(elem) }) end\n    end\n\
    \    | Enum.map(fn (pid) ->\n      receive do {pid, result} -> result end\n  \
    \  end\n  end\n```\n\nOur method contains two transformations (look for the |\
    \ operator). The first transformation maps collection into a list of PIDs, where\
    \ each PID in the list runs the given function on an individual list element.\
    \ If the collection contains 1,000 items, we'll run 1,000 processes."
