  md: "That's fine for anonymous maps. But what if we want to create a typed map—a\
    \ map that has a fixed set of fields and default values for those fields, and\
    \ that you can pattern-match by type as well as content.\n\nEnter the `struct`.\n\
    \nA struct is just a module that wraps a limited form of map. It's limited because\
    \ the keys must be atoms and because these maps don't Dict capabilities.\n\nThe\
    \ name of the module is the name of the map type. Inside the module, you use the\
    \ defstruct macro to define the struct's members.\n\n```\nmaps/defstruct.ex\n\
    defmodule Subscriber do\n  defstruct name: \"\", paid: false, over_18: true\n\
    end\n```\n\nLet's play with this in iex\n\n```\n$ iex defstruct.ex\niex s1 = %Subscriber{name:\
    \ \"\", over_18: true, paid: false}\niex s2 = %Subscriber{name: \"Dave\", over_18:\
    \ true, paid: false}\niex s3 = %Subscriber{name: \"Mary\", paid: true}\n%Subscriber(name:\
    \ \"Mary\", over_18: true, paid: true)\n```\n\nThe syntax for creating a struct\
    \ is the same as the syntax for creating a map—you simply add the map name between\
    \ the syntax and the {.\n\nYou access the fields in a struct using dot notation\
    \ or pattern matching:\n\n```\niex s3.name\n\"Mary\"\niex %Subscriber{name: a_name}\
    \ = s3\n%Subscriber(name: \"Mary\", over_18: true, paid: true)\niex a_name\n\"\
    Mary\"\n```\n\nAnd updates follow:\n\n```\niex s4 = %Subscriber{s3 | name: \"\
    Marie\"}\n%Subscriber(name: \"Marie\", over_18: true, paid: true)\n```\n\nWhy\
    \ are structs wrapped in a module? The idea is that you are likely to add struct-specific\
    \ behavior.\n\n```\nmaps/defstruct1.ex\ndefmodule Attendee do\n  defstruct name:\
    \ \"\", paid: false, over_18: true\n  def attend_after_party(attendee) = %Attendee{}\
