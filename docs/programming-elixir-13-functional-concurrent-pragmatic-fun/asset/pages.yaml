  md: '```

    catch

    exit, code -> "Exited with code #{inspect code}"

    throw, value -> "throw called with #{inspect value}"

    what, value -> "Caught #{inspect what} with #{inspect value}"

    end

    end

    ```


    ```

    defp incite(1) do

    exit(:something_bad_happened)

    end


    defp incite(2) do

    throw {:animal, "wombat"}

    end


    defp incite(3) do

    erlang.error "Oh no!"

    end

    ```


    Calling the start function with 1, 2, or 3 will cause an exit, a throw, or an
    error to be thrown. Just to illustrate wildcard pattern matching, we handle the
    case by matching any type into the variable.


    ```

    iex("catch.ex")

    [Catch]

    iex Catch.start 1

    "Exited with code :something_bad_happened"

    iex Catch.start 2

    "throw called with {:animal,\"wombat\"}

    iex Catch.start 3

    "Caught : :error with \"Oh no!\"

    ```


    # Defining Your Own Exceptions


    Exceptions in Elixir are basically records. You can define your own exceptions
    by creating a module. Inside it, use defexception to define the various fields
    in the exception, along with its default values. Because you''re creating a module,
    you can also add functions—often these are used to format the exception''s fields
    into meaningful messages.


    Say we''re writing a library to talk to a Microsoft Kinect controller. It might
    want to raise an exception on various kinds of communication error. Some of these
    are permanent, but others are likely to be transient and can be retried. We''ll
    define our exception with its (required) message field and an additional `can_retry`
    field. We''ll also add a function that formats these two fields into a nice message.'
