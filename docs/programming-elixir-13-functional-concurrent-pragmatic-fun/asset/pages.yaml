- img_proc: true
  md: "protocols/bitmap_collectable.exs\n\n```\ndefimpl Collectable, for: Bitmap do\n\
    \  use Bitwise\n\n  def into(%Bitmap{value: target}) do\n    {target, fn\n   \
    \   acc, {:cont, next_bit} -> (acc <<< 1) ||| next_bit\n      acc, :done -> %Bitmap{value:\
    \ acc}\n      :halt -> :ok\n    end\n  end\nend\n```\n\nWe can call it in iex:\n\
    iex Enum.into([1,1,0,0,1,0], %Bitmap{value: 50})\n\nIt works like this:\n\n+ \
    \  - Enum.into calls the function for Bitmap, passing it the target value (%Bitmap{value:\
    \ 0}) in this case.\n- Bitmap.into returns a tuple. The first element is the value,\
    \ extracted from the bitmap structure. This acts as the initial value for an accumulator.\
    \ The second element of the tuple is a function.\n- Enum.into then calls this\
    \ function, passing it the accumulator and a command. If the command is :done,\
    \ the iteration over collection being injected into the bitmap has has finished,\
    \ so we return a new bitmap with the accumulator. If the value is :halt, the iteration\
    \ has terminated early, and nothing needs to be done.\n- The real work is done\
    \ when the function is passed the {:cont, next_val} command. Here is where the\
    \ Collectable adds the next value to the accumulator. In our case, we shift the\
    \ accumulator up and OR the new value in.\n\nRemember the Big Picture\nIf think\
    \ all this enumerable/collectable stuff is complicated—well, you're correct. It\
    \ is. In part that's because these conventions allow all enumerable values to\
    \ be used either eagerly and lazily. And when you're dealing with big (or even\
    \ infinite) collections, this is a big deal.\n\n# Built-in Protocols: Inspect\n\
    \nThis is the protocol that is used to inspect a value. The rule is simple—if\
    \ you can return a representation that is valid Elixir literal, do so. Otherwise,\
    \ prefix the representation with #Typename."
  merge: -1
