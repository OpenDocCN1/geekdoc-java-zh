    =ERROR REPORT==== 25-Apr-2013::15:16:14 ===

    Too many processes

    ** (SystemLimitError) a system limit has been reached

    ```


    It looks like the virtual machine doesn''t support 400,000 processes. Frankly,
    this is not a hard limit—we jumped into a default value. We can increase using
    the VM''s +P parameter. We pass this parameter to the VM using the --el parameter
    to elixir. (This is why I chose to run from the command line.)


    ```

