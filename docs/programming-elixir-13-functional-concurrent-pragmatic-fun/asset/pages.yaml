  md: 'dialyer recognizes that this makes no sense, and complains. But look at the
    error. It isn''t complaining about addition. Instead, it has assigned a default
    typespec to our function, based on its analysis of what we call inside that function.


    This is success typing. Dialyer attempts to infer the most permissive types that
    are compatible with the code—it assumes the code is correct until it finds a contradiction.
    This makes it a powerful tool, as it can make assumptions as it runs.


    Does that mean you don''t need @spec attributes? That''s your call. Try it with
    and without. Often, adding a @spec will further constrain a function''s signature.
    We saw this with our count_of_atoms function, where the spec made it explicit
    that we expected a list of atoms as an argument.


    Ultimately, dialyer is a tool, not a test of your coding chops. Use it as such,
    but don''t waste time adding specs to get a gold star.'
