  md: '# CHAPTER 19


    # OTP: Applications


    So far in our quick tour of Elixir and OTP we''ve looked at server processes and
    the supervisors that monitor them. There''s one more stage in our journey—the
    application.


    # This Is Not Your Father’s Application


    Because OTP comes from the Erlang world, it uses Erlang names for things. And
    unfortunately, some of these names are not terribly descriptive. The name *application*
    is one of these. When most of us talk about applications, we think of a program
    we run to do something—maybe on our computer or phone, or via a web browser. An
    application is a self-contained whole.


    In the OTP world, that''s not the case. Instead, an application is a bundle of
    code that comes with a descriptor. That descriptor tells the runtime what the
    code has, what global names it registers, and so on. In fact, an OTP application
    is more like a dynamic link library or a shared object than a conventional application.


    It might help to see the word *application* and in your head but pronounce *component*
    or *service*.


    For example, back when we were fetching GitHub issues using the HTTPPoison library,
    that we actually installed an independent application containing HTTPPoison. Although
    it looked like we were just using a library, mix automatically loaded the HTTPPoison
    application. When we started it, it turned a couple of other applications that
    it needed (SSL and Hackney), which in turn kicked off their own supervisors and
    workers. And all of this was transparent to us.


    I''ve said that applications are components, but there are some applications that
    are at the top of the tree and are meant to be run directly.'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'In this chapter we''ll look at both types of application component (see what
    I did there?). In reality they’re virtually the same, so let’s cover the common
    ground first.


    # The Application Specification File


    You probably noticed that every now and then mix will talk about a file called
    name.app, where name is your application’s name.


    This file is called an application specification and is used to define your application
    to the runtime environment. Mix creates this file automatically from the information
    in mix.ex combined with information it gleans from compiling your application.


    When you run your application this does not need to use all the OTP functionality—this
    file will always be created and referred to. However, once you start using OTP
    trees, stuff you add to mix.ex will get copied into the .app file.


    # Turning Our Sequence Program into an OTP Application


    So, here’s the good news. The application in the previous chapter is already a
    full-blown OTP application. When mix created the initial project tree, it added
    a supervisor (which we then modified) and enough information to our mix.ex file
    to get the application started. In particular, it filled in the application function:


    ```

    def application do

    mod: { Sequence, [] }]

    end

    ```


    This says that the top-level module of our application is called Sequence. OTP
    assumes this module will implement a start function, and it will pass that function
    an empty list as a parameter.


    In our previous version of the start function, we ignored the arguments and instead
    hard-wired the call to start_link to pass 123 to our application. Let’s change
    that to take the value from mix.exs instead. First, change mix.exs to pass an
    initial value (we’ll use 456):


    ```

    def application do

    mod: { Sequence, 456 }]

    end

    ```


    Then change the sequence.ex code to use this passed-in value:'
