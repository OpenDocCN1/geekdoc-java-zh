  md: 'Help for all of those functions can be consulted directly from the command
    line using the h helper itself. Try:


    +   | h(v/0)


    To learn more about IEx as a whole, just type h(IEx).


    In the list of helper functions, the number following the slash is the number
    of arguments the helper expects.


    Probably the most useful is h itself. With an argument, it gives you help on Elixir
    modules or individual functions in a module. This works for any modules loaded
    into iex (so when we talk about projects later on, you''ll see your own documentation
    here, too).


    For example, the IO module performs common I/O functions. For help on the module,
    type h(IO) or h IO.


    ```

    iex h IO

    # or...

    iex h(IO)

    ```


    Functions handling IO.


    Many functions in this module expects an IO device as argument. An IO device must
    be a PID or an atom representing a process. For convenience, Elixir provides :stdio
    and :stderr as shortcuts to Erlang''s :standard_io and :standard_error....


    This book frequently uses the puts function in the IO module, which in its simplest
    form writes a string to the console. Let''s get the documentation.


    ```

    iex h.puts

    defuts(device \ group leader(), item)

    ```


    Writes item to the given device, similar to write/2, but adds a newline at the
    end.


    Another informative helper is i, which displays information about a value:


    ```

    iex i 123

    Term

    123

    Data type

    Integer

    Reference modules

    Integer

