  md: "The do...end form is a lump of syntactic sugar—during compilation it is turned\
    \ into the do: form; (And the do: form itself is nothing special; it simply a\
    \ term in a keyword list.) Typically people use the do: syntax for single-line\
    \ blocks, and do...end for multiline ones.\n\nThis means our example would probably\
    \ be written as\n\n```\nmm/times1.ex\ndefmodule Times do\n  def double(n), do:\
    \ n * 2\nend\n```\n\nWe could even write it as\n\n```\ndefmodule Times, do: (def\
    \ double(n), do: n*2)\n```\n\n(but please don't).\n\n# Your Turn\n\n+   Exercise:\
    \ ModulesAndFunctions-1\nExtend the Times module with a triple function that multiplies\
    \ its parameter by three.\n\n+   Exercise: ModulesAndFunctions-2\nRun the result\
    \ in ix. Use both techniques to compile the file.\n\n+   Exercise: ModulesAndFunctions-3\n\
    Add a quadruple function. (Maybe it could call the double function...)\n\n# Function\
    \ Calls and Pattern Matching\n\nIn the previous chapter we covered how anonymous\
    \ functions use pattern matching to bind their parameter list to the passed arguments.\
    \ The same is true of named functions. The difference is that we write the function\
    \ multiple times, each time with its own parameter list and body. Although this\
    \ looks like multiple function definitions, purists will tell you it's multiple\
    \ clauses of the same definition (and they'd be right).\n\nWhen you call a named\
    \ function, Elixir tries to match your arguments with the parameter list of the\
    \ first definition (clause). If it cannot match them, it tries the next definition\
    \ of the same function (remember, this must have the same arity) and checks to\
    \ see if it matches. It continues until it runs out of candidates.\n\nLet's play\
    \ with this. The factorial of n, written n!, is the product of all numbers from\
    \ 1 to n. O! is defined to be 1."
