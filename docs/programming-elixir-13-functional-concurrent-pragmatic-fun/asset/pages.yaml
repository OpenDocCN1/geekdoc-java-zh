  md: 'The run function spawns the correct number of processes and records the PIDs.
    It then calls the workhorse function, schedule_processes.


    This function is basically a receive loop. If it gets a ready message from a server,
    it sees if there is more work in the queue. If there is, it passes the next number
    to the calculator and then recurses with one fewer number in the queue.


    If the work queue is empty when it receives a ready message, it sends a shutdown
    to the server. If this is the last process, then we''re done and it sorts the
    accumulated results. If it isn''t the last process, it removes the process from
    the list of processes and recurses to handle another message.


    Finally, if it gets an answer message, it records the answer in the result accumulator
    and recurses to handle the next message.


    We drive the scheduler with the following code:


    ```

    spawn/fib.ex

    to_process = List.duplicate(37, 20)

    Enum 1..10, fn num_processes ->

    {time, result} = :timer.tc(

    Scheduler, :run,

    [num_processes, FibSolver, :fib, to_process]

    )

    if num_processes == 1 do

    IO.puts inspect result

    IO.puts "\n# time(s)"

    end

    :io.format("~2B ~.2f", [num_processes, time/1000000.0])

    end

    ```


    The to_process list contains the numbers we''ll be passing to our fib servers.
    In our case, we give it the same number, 37, 20 times. The intent here is to load
    each of our processors.


    We run the code a total of 10 times, varying the number of spawned processes from
    1 to 10. We use :timer.tc to determine the elapsed time of each iteration, reporting
    the result in seconds. The first time around the loop, we also display the numbers
    we calculated.'
