    The node that attempts to connect receives false, indicating the connection was
    not made. And the node that it tried to connect to logs an error describing the
    attempt.


    But why does it succeed when we don''t specify a cookie? When Erlang starts, it
    looks for an .erlang.cookie file in your home directory. If that file doesn''t
    exist, Erlang creates it and stores a random string in it. It uses that string
    as the cookie for any node the user starts. That way, all nodes you start on a
    particular machine are automatically given access to each other.


    Be careful when connecting nodes over a public network—the cookie is transmitted
    in plain text.


    # Naming Your Processes


    Although a PID is displayed as three numbers, it contains just two fields: the
    first number is the node ID and the next two numbers are the low and high bits
    of the process ID. When you run a process on your current node, its node ID will
    always be zero. However, when you export a PID to another node, the node ID is
    set to the number of the node on which the process lives.'
