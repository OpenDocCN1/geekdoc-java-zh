  md: "```\n$ elixir -r link2.ex\n** (EXIT from #PID<0.35.0>) :boom\n```\n\nOur child\
    \ process died, and it killed the entire application. The default\nbehavior of\
    \ linked processes—when one exits abnormally, it kills the other.\n\nWhat if you\
    \ want to handle the death of another process? Well, you probably\ndon't want\
    \ to do that. Elixir uses the OTP framework for constructing process\ntrees, and\
    \ OTP includes the concept of process supervision. An incredible\namount of effort\
    \ has been spent getting this right, so I recommend using it\nmost of the time.\
    \ (We cover this in Chapter 18, OTP: Supervisors, on page 231).\n\nHowever, you\
    \ can tell Elixir to convert the exit signals from a linked process\nto a message\
    \ that you can handle. Do this by trapping the exit.\n\n```\nspawn/link3.ex\n\
    defmodule Link3 do\n  import :timer, only: [sleep: 1]\n\n  def sad_function do\n\
    \    sleep 500\n    exit(:boom)\n  end\n  def run do\n    Process.flag(:trap_exit,\
    \ true)\n    spawn_link(Link3, :sad_function, [])\n    receive do\n      msg ->\n\
    \        IO.puts(\"MESSAGE RECEIVED: #{inspect msg}\")\n      after 1000 ->\n\
    \        IO.puts(\"Nothing happened as far as I am concerned\")\n    end\n  end\n\
    end\nLink3.run\n```\n\nThis time we see an :EXIT message when the spawned process\
    \ terminates:\n\n```\n$ elixir -r link3.ex\nMESSAGE RECEIVED: {:EXIT, #PID<0.41.0>,\
    \ :boom}\n```\n\nIt doesn't matter why a process exits—it may simply finish processing,\
    \ it may\nexplicitly exit, or it may raise an exception—the same :EXIT message\
    \ is received.\nFollowing an error, however, it contains details of what went\
    \ wrong.\n\n# Monitoring a Process\n\nLinking the calling process and another\
    \ process—each receives notification-\ns about the other. By contrast, monitoring\
    \ lets a process spawn another"
