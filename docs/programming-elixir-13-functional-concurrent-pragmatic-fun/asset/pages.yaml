  md: "We know that blocks in Elixir are converted into keyword parameters, so this\n\
    is equivalent to\n\n```\nmyif <<condition>,\n  do: <<evaluate if true>,\n  else:\
    \ <<evaluate if false>\n```\n\nHere's a sample call:\n\n```\nMy.myif==2, do: (IO.puts\
    \ \"1 == 2\"), else: (IO.puts \"1 != 2\")\n```\n\nLet's try to implement myif\
    \ as a function:\n\n```\ndefmodule My do\n  def myif(condition, clauses) do\n\
    \    do_clause = Keyword.get(clauses, :do, nil)\n    else_clause = Keyword.get(clauses,\
    \ :else, nil)\n    case condition do\n      val when in in [false, nil]\n    \
    \    -> else_clause\n      otherwise -> do_clause\n  end\nend\n```\n\nWhen we\
    \ run it, we're (mildly) surprised to get the following output:\n\n```\niex> My.myif==2,\
    \ do: (IO.puts \"1 == 2\"), else: (IO.puts \"1 != 2\")n1 == 2\n1 != 2\n:ok\n```\n\
    \nWhen we call the myif function. Elixir has to evaluate all of its parameters\n\
    before passing them in output. So both the do: and else clauses are evaluated,\
    \ and\nwe see their output. Because IO.puts returns :ok on success, what actually\
    \ gets\npassed to myif is\n\n```\nmyif 1==2, do: :ok, else: :ok\n```\n\nThis is\
    \ why the final return value is :ok.\n\nClearly we need a way of delaying the\
    \ execution of these clauses. And this is\nwhere macros come in. But before we\
    \ implement our myif macro, we need a\nlittle background."
