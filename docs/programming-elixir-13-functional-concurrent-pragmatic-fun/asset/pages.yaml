  md: 'unfold, resource. (If you needed proof that the internal implementation is
    tricky, consider the fact that these last names give you almost no hint of their
    power.)


    Let’s start with the three simplest: cycle, repeatedly, and iterate.


    # Stream.cycle


    Stream.cycle takes an enumerable and returns an infinite stream containing that
    enumerable elements. When it gets to the end, it repeats from the beginning, indefinitely.
    Here is an example that generates the rows in an HTML table with alternating green
    and white classes:


    ```

    iex Stream.cycle{-w green white}) |

    ...Stream.zip(..5) |>

    ...Enum.map(class, value) ->\n...-s(tr class="#{class}"><td>#{value}</td></tr>|\n
    end) |>

    ...10.puts

    <tr class="green"><td>1</td></tr>

    <tr class="white"><td>2</td></tr>

    <tr class="green"><td>3</td></tr>

    <tr class="white"><td>4</td></tr>

    <tr class="green"><td>5</td></tr>

    ```


    # Stream.repeatedly


    Stream.repeatedly takes a function and invokes it each time a new value is wanted.


    ```

    iex Stream.repeatedly(fn -> true end) |> Enum.take(3)

    [true, true, true]\iex Stream.repeatedly(&random.uniform(0)) |> Enum.take(3)

    [0.72304205622108, 0.94581636451987, 0.501490712406471]

    ```


    # Stream.iterate


    Stream.iterate(start_value, next_fun) generates an infinite stream. The first
    value is start_value. Each value is generated by applying next_fun to this value.
    This continues for as long as the stream is being used, with each value being
    the result of applying next_fun to the previous value.


    Here are some examples:


    ```

    iex Stream.iterate(0, &&(&1+1)) |> Enum.take(5)

    [0, 1, 2, 3, 4]\iex Stream.iterate(2, &&(&*1)) |> Enum.take(5)

    [2, 4, 16, 256, 65536]\iex Stream.iterate([], &&(&1)) |> Enum.take(5)

    [[], [], [], [], []]

    ```'
