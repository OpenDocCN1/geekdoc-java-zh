    # # Handling Truthy


    The type as_boolean(T) says that the actual value matched will be of type T, but
    the function that uses the value will treat it as a truthy (anything other than
    nil or false is considered). Thus the specification for the Elixir function Enum.count


    ```

    @spec count(t, element -> as_boolean(term)) :: non_neg_integer

    ```


    # # Some Examples


    ```

    integer | float

    ```


    Any number (Elixir has an alias for this).


    ```

    [ {atom, any} ]

    list(atom, any)

    ```


    A list of key/value pairs. The two forms are the same.


    ```

    non_neg_integer | {:error, String.t})

    ```


    An integer greater than or equal to zero, a tuple containing the atom and a string.


    ```

    ( integer, atom -> {:pair, atom, integer} )

    ```


    An anonymous function that takes an integer and an atom and returns a tuple containing
    the atom :pair, an atom, and an integer.


    ```

    <<_:_*4>>

    ```


    A sequence of 4-bit nibbles.


    # # Defining New Types


    The attribute @type can be used to define new types.


    ```

    @type type_name :: type_specification

    ```


    Elixir uses this to define built-in types and aliases.


    ```

    @type term :: any

    @type binary :: <<_:_*8>>

    @type bitstring :: <<_:_*1>>

    @type boolean :: false | true

    @type byte :: 0..255

    @type char :: 0..0xffff

    ```'
