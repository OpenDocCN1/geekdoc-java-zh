    # Names, Source Files, Conventions, Operators, and So On


    Elixir identifiers consist of upper- and lowercase ASCII characters, digits, and
    underscores. They may end with a question or an exclamation mark.


    Module, record, protocol, and behavior names start with an uppercase letter and
    are BumpyCase. All other identifiers start with a lowercase letter or an underscore,
    and by convention underscores between words. If the first character is an underscore,
    Elixir doesn''t report a warning if the variable is unused in a pattern match
    or function list.


    Source files are written in UTF-8, but identifiers may use only ASCII.


    By convention, source files use two-character indentation for nesting—and we use
    spaces, no tabs, to achieve this.


    Comments start with a hash sign (#) and run to the end of the line.


    The community is compiling a style guide. As I write this, it is at https://github.com/levionessa/elixir_style_guide,
    but I''m told it may move in the future.


    # Truth


    Elixir has three special values related to Boolean operations: true, false, and
    nil. nil is treated as false in Boolean contexts.


    (A bit of trivia: all of these values are aliases for atoms of the same name,
    so true is the same as the atom :true.)


    In most contexts, any value other than false or nil is treated as true. Sometimes
    we refer to this as truthy as opposed to true.


    # Operators


    Elixir has a very rich set of operators. Here''s a subset we''ll use in this book.


    # Comparison operators


    ```

    a === b # strict equality (so 1 === 1.0 is false)

    ```'
