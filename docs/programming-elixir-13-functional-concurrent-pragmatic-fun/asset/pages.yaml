  md: '```

    iex> b = <<::size(2), ie::size(3)   # 01 001

    <<9::size(5)                       # = 9 (base 10)

    iex> byte_size b

    1

    > bit_size b

    5

    ```


    You can store integers, floats, and other binaries in binaries.


    ```

    iex> int = << 1 >>

    <<1>float

    iex> float = << 2.5 :: float >>

    <<64, 4, 0, 0, 0, 0, 0>>\iex> mix = << int :: binary, float >>

    <<1, 64, 4, 0, 0, 0, 0, 0>>

    ```


    Let''s finish an initial look at binaries with an example of bit extraction. An
    IEEE 754 float has a sign bit, 11 bits of exponent, and 52 bits of mantissa. The
    exponent is biased by 1023, and the mantissa is a fraction with the top assumed
    to be 1. We can extract the fields and then use :math.pow, which performs exponentiation,
    to reassemble the number:


    ```

    iex> sign::size(1), exp::size(11), mantissa::size(52) == << 3.14159::float >>

    >>(1 + mantissa / :math.pow(2, 52)) * :math.pow(2, 1023)

    3.14159

    ```


    # Double-Quoted Strings Are Binaries


    Whereas single-quoted strings are stored as char lists, the contents of a double-quoted
    string (dqs) are stored as a consecutive sequence of bytes in UTF-8 encoding.
    Clearly this is more efficient in terms of memory and certain forms of access,
    but it does have two implications.


    First, because UTF-8 characters can take more than a single byte to represent,
    the size of the binary is not necessarily the length of the string.


    ```

    iex> dqs = "\ax/\ay"

    "\ax/\ay"\iex> String.length dqs

    5\iex> byte_size dqs

    9\iex> String.at(dqs, 0)

    "\a"\iex> String.codepoints(dqs)

    ["\a", "x", "/", "\a", "y"]\iex> String.split(dqs, "//")

    ["\ax", "\ay"]

    ```'
