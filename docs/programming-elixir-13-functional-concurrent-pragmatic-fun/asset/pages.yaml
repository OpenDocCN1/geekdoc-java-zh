  md: '# Your Turn


    ► Exercise: PatternMatching-1


    Which of the following will match?


    +   - a = [1, 2, 3]

    - a = 4

    - 4 = a

    - [a, b] = [1, 2, 3]

    - a = [[1, 2, 3]]

    - [a] = [[1, 2, 3]]

    - [[a]] = [[1, 2, 3]]


    # Ignoring a Value with _ (Underscore)


    If we didn''t need to capture a value during the match, we could use the special
    variable _ (an underscore). This acts like a variable but immediately discards
    any value given to it—in a pattern match. it is like a wildcard saying "I''ll
    accept any value here." The following example matches any three-element list that
    has a 1 as its first element.


    ```

    iex> [1, _] = [1, 2, 3]

    1, 2, 3

    iex> [1, _] = [1, "cat", "dog"]

    1, "cat", "dog"

    ```


    # Variables Bind Once (per Match)


    Once a variable has been bound to a value in the matching process, keeps that
    value for the remainder of the match.


    ```

    iex> [a, a] = [1, 1]

    1, 1

    iex> a

    1

    iex> [b, b] = [1, 2]

    ** (MatchError) no match of right hand side value: [1, 2]

    ```


    The first expression in this example succeeds because a is initially matched with
    the first 1 on the right side. The value is then used in the second term to match
    the second 1 on the right side.


    In the next expression, the first b matches the 1. But the second b corresponds
    to the value 2 on the right. b cannot have two different values, and so the match
    fails.'
