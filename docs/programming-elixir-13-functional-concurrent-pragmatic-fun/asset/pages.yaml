  md: "# Macros Inject Code\n\nLet's pretend we're the Elixir compiler. We read a\
    \ module’s source to bottom and generate a representation of the code we find.\
    \ That representation is a nested Elixir tuple.\n\nIf we want to support macros,\
    \ we need a way to tell the compiler that we'd like to manipulate a part of that\
    \ tuple. We do that using defmacro, quote, and unquote.\n\nIn the same way that\
    \ def defines a function, defmacro defines a macro. You'll see what that looks\
    \ like shortly. However, the real magic starts not when we define a macro, but\
    \ when we use one.\n\nWhen we pass parameters to a macro, Elixir doesn't evaluate\
    \ them. Instead, it passes them as tuples representing their code. We can examine\
    \ this using a simple macro definition that prints out its parameter.\n\n```\n\
    macros/dumper.exs\ndefmodule My do\n  defmacro macro(param)\n    IO.inspect param\n\
    \  end\n\ndefmodule Test do\n  require My\n\n  # These values represent themselves\n\
    \  My.macro :atom      => :atom\n  My.macro 1          => 1\n  My.macro 1.0  \
    \      => 1.0\n  My.macro [1,2,3]    => [1,2,3]\n  My.macro \"binaries\" => \"\
    binaries\"\n  My.macro {1, 2 }    => {1, 2}\n  My.macro do: 1     => do: 1\n\n\
    \  # And these are represented by 3-element tuples\n  My.macro {1,2,3,4,5}\n \
    \ => {\"{}\",line: 20],[1,2,3,4,5]}\n\n  My.macro do: ( a = 1; a + a)\n  => [do:\n\
    \      {:block,[]},\n      {:=,[line: 22],{a,[line: 22],nil,1}}},\n      {:+,,[line:\
    \ 22],{a,[line: 22],nil},{a,[line: 22],nil]}]]}]\n\n  My.macro do\n    1+2\n \
    \ else\n```"
