- img_proc: true
  md: "and be notified of its termination, but without the reverse notification—it\
    \ is one-way only.\n\nWhen you monitor a process, you receive a :DOWN message\
    \ when it exits fails, or it doesn't exist.\n\nYou can use spawn_monitor to turn\
    \ on monitoring when you spawn a process, or you can use Process.monitor to monitor\
    \ an existing process. However, if you use Process.monitor (or link to an existing\
    \ process), there is a potential race condition—if the process dies before your\
    \ monitor call completes, you may not receive a notification. The spawn_link and\
    \ spawn_monitor versions are atomic, however, you'll always catch a failure.\n\
    \n```\nspawn_monitor.Ex\ndefmodule Monitor1 do\n  import :timer, only: [ sleep:\
    \ 1 ]\n  def sad function do\n    sleep 500\n    exit(:boom)\n  end\n  def run\
    \ do\n    res = spawn_monitor(Monitor1, :sad_function, [])\n    IO.puts inspect\
    \ res\n    receive do\n      msg ->\n        IO.puts \"MESSAGE RECEIVED: #{inspect\
    \ msg}\"\n      after 1000 ->\n        IO.puts \"Nothing happened as far as I\
    \ am concerned\"\n    end\n  end\nend\n```\n\nMonitor1.run\nand the results are\
    \ similar to the spawn_link version:\n\n```\n$ elixir -r monitor1.ex\n#{PID<0.37.0>,#Reference<0.0.0.53>,:process,#PID<0.37.0>,:boom}\n\
    ```\n\nMESSAGE RECEIVED:\n\n(The Reference record in the message is the identity\
    \ of the monitor that was created. The spawn_monitor can also return it, with\
    \ the PID.)\n\nSo, when do you use links and when should you choose monitors?\n\
    \nIt depends on your processes' semantics. If the intent is that a failure in\
    \ one process should terminate another, you need links. If you need to know when\
    \ some other process exits for any reason, choose monitors."
