    Instead we get back a stream value that contains a specification of what we intended.


    How do we get the stream to giving us results? Treat it as a collection and pass
    it to a function in the Enum module:


    ```

    iex s = Stream.map [1, 3, 5, 7],(&(&1 + 1)

    #Stream<>

    iex Enum.to_list s

