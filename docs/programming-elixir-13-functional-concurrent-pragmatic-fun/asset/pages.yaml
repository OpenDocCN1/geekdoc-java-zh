  md: "# Guard Clauses\n\nWe've seen that pattern matching allows Elixir to decide\
    \ which function to invoke based on the arguments passed. But what if we need\
    \ to distinguish based on their types or on some test involving their values?\
    \ For this, you use guard clauses. These are predicates that are attached to a\
    \ function definition using one or more keywords. When doing pattern matching,\
    \ Elixir first does the conventional parameter-based matching and evaluates any\
    \ when predicates, executing the function only if at least one predicate is true.\n\
    \n```\nmm/guard.ex\ndefmodule Guard do\n  def what_is(x) when is_number(x) do\n\
    \    IO.puts(\"#{x} is a number\"\n  end\n  def what_is(x) when is_list(x) do\n\
    \    IO.puts(\"#{x} is a list\"\n  end\n  def what_is(x) when is_atom(x) do\n\
    \    IO.puts(\"#{x} is an atom\"\n  end\n\n  Guard.what_is(99)         # => 99\
    \ is a number\n  Guard.what_is(:cat)      # => cat is an atom\n  Guard.what_is([1,2,3])\
    \   # => [1,2,3] is a list\n```\n\nRecall our previous factorial example on page\
    \ 49.\n\n```\nmm/factorial.ex\ndefmodule Factorial do\n  def of(0), do: 1\n  def\
    \ of(n), do: n * of(n)\nend\n```\n\nIf we were to pass it a negative number, it\
    \ would loop forever—no matter how many times we decrement n, it will never be\
    \ zero. So it is a good idea to add a guard clause\n\n```\nmm/factorial2.ex\n\
    defmodule Factorial do\n  def of(0), do: 1\n  def of(n) when n > 0 do\n    n *\
    \ of(n-1)\nend\n```\n\nIf you run this code with a negative argument, none of\
    \ the functions will match:"
