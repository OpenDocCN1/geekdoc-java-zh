    \ The SCOWL collection looks promising, as it already has words divided by size.)\n\
    \n# Protocols and Structs\n\nElixir doesn't have classes, but (perhaps surprisingly)\
    \ it does have user-defined types. It pulls off this magic using structs and a\
    \ few conventions.\n\nLet's play with a simple struct. Here's the definition:\n\
    \n```\nprotocols/basic.exs\ndefmodule Blob do\n  defstruct content: nil\nend\n\
    ```\n\nAnd here we use it in iex:\n\n```\niex c \"basic.exs\"\n[Blob]\\iex b =\
    \ %Blob{content: 123}\n%Blob(content: 123)\n inspect b\n\"%_struct{content: 123}\"\
    \n```\n\nIt looks for all the world as if we've created some new type, the blob.\
    \ But that's only because Elixir is hiding something from us. By default, inspect\
    \ recognizes structs. If we turn this off using the structs: false option, inspect\
    \ reveals the true nature of our blob value:\n\n```\niex inspect b, structs: false\n\
    \"%{_struct__: Blob, content: 123}\"\n```\n\nA struct value is actually just a\
    \ map with the key _struct referencing the struct's module (Blob in this case)\
    \ and the remaining elements containing the keys and values for this instance.\
    \ The inspect implementation for maps checks"
