  md: 'The counter function on line 2 is the code that will run in separate processes.
    It is passed the PID of the next process in the chain. When it receives a number,
    it increments it and sends it on to that next process.


    The create_processes function is probably the densest piece of Elixir encountered
    so far. Let''s break it down.


    It is passed the number of processes to create. Each process has to be passed
    so that it knows how to send the updated number to. All this is done on line 11.


    The reduce will iterate over the range 1..n. Each time around, it will pass an
    accumulator as the second parameter to its function. We set the initial value
    of accumulator to self, or our PID.


    In the function, we spawn a new process that runs the counter function, using
    the third parameter of spawn to pass in the accumulator''s current value (initially
    self). The value spawn returns is the PID of the newly created process, which
    becomes the accumulator''s value for the next iteration.


    Putting it another way, each time we spawn a new process, we pass the previous
    process''s PID in the send_to parameter.


    The value that the reduce function returns is the accumulator''s final value,
    which is the PID of the last process created.


    On the next line we set the ball rolling by passing 0 to the last process. It
    will increment it and pass 1 to the second-to-last process. This goes on until
    the very process we created passes the result back to us. We use the receive block
    to capture this, and format it into a nice message.


    Our receive block contains a new feature. We''ve already seen how guard clauses
    can constrain pattern matching and function calling. The same guard can be used
    to qualify the pattern in a receive block.


    Why do we need this, though? It turns out there''s a bug in some versions of Elixir.¹
    When you compile and run a program using iex -5 mix, a residual message is left
    lying around from the compilation process (it records a process''s termination).
    We ignore that message by telling the receive clause that we''re interested only
    in simple integers.


    The run function starts the whole thing off. It uses a built-in Erlang library,
    tc, which can change a function''s execution. We pass it the module, name, and


    +   1. https://github.com/elixir-lang/elixir/issues/1050'
