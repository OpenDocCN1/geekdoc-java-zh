    As the list(t) entry shows, you can parameterize the types in a new definition.
    Simply use one or more identifiers as parameters on the left side, and use these
    identifiers where would otherwise use type names on the right. Then when you use
    the newly defined type, pass in actual types for each of the parameters:


    @type variant(type_name, type) :: { :variant, type_name, type }

    @spec create_string_tuple(string, String.t) :: variant(string, String.t)


    As well as @type, Elixir has the @type and @opaque module attributes. They have
    the same syntax as @type, and do basically the same thing. The difference is in
    the visibility of the result.


    @type defines a type that is local to the module that contains—the type is private.
    @opaque defines a type whose name may be known outside the module but whose definition
    is not.


    # Specs for Functions and Callbacks


    The @spec specifies a function’s parameter count, types, and return-value type.
    it can appear anywhere in a module that defines the function, but by convention
    it sits immediately before the function definition, following any function documentation.


    We''ve already seen the syntax:


    @spec function_name(param1_type, ...) :: return_type


    Let’s see some examples. These come from the built-in Dict module.


    ```

    @type key :: any

    @type value :: any

    @type keys :: [ key ]

    @type t :: tuple | list    # `t` is the type of the collection

    @spec values(t) :: [value]

    @spec size(t) :: non_neg_integer

    @spec has_key?(t, key) :: boolean

    @spec update(t, key, value, (value -> value)) :: t

    ```'
