  md: '# # Installing Elixir


    This book assumes you’re using at least Elixir 1.3. The most up-to-date instructions
    for installing Elixir are available at http://elixir-lang.org/install.html. Go
    install it now.


    # ## Running Elixir


    In this book, I show a terminal session like this:


    ```

    $ echo Hello, World

    Hello, World

    ```


    The terminal prompt is the dollar sign, and the stuff you type follows. (On your
    system, the prompt will likely be different.) Output from the system is shown
    without highlighting.


    # ### iex—Interactive Elixir


    To test that your Elixir installation was successful, let’s start an interactive
    Elixir session. Your regular shell prompt, type iex


    ```

    $ iex

    rlang/OTP 18 [erts-7.1] [source] [64-bit] [smp:4:4] [async-threads:10]

    [hype] [kernel-poll:false] [dtrace]

    Interactive Elixir (x.y.z) - press Ctrl+C to exit (type h) ENTER for help)

    iex(1)>

    ```


    (The various version numbers you see will likely be different—I won’t bother to
    show them on subsequent examples.)


    Once you have an iex prompt, you can enter Elixir code and you will see the result.
    If you enter an expression that continues over more than one line, iex will prompt
    for the additional lines with an ellipsis (...).


    ```

    iex(1)> 3 + 4

    7

    iex(2)> String.reverse "madamimadam"

    "madamimadam"\iex(3)> 5 *

    ...(3)> 6

    30

    iex(4)>

    ```


    The number in the prompt increments for each complete expression executed.

    I’ll omit the number in most of the examples that follow.'
