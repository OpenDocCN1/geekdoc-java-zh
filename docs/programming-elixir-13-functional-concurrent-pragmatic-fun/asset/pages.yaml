    # Module Names: Elixir, Erlang, and Atoms


    When we write modules in Elixir, they have names as String or PhotoAlbum. We call
    functions in them using calls such as String.length("abc").


    What’s happening here is subtle. Internally, module names are just atoms. When
    you write a name starting with an uppercase letter, such as I0, Elixir converts
    it internally into an atom called Elixir.IO.


    ```

    iex> is_atom I0

    true

    iex> to_string I0

    "Elixir.IO0"

    iex> "Elixir.IO0" === I0

    true

    ```


    So a call to a function in a module is really an atom followed by a dot followed
    by the function name. And, indeed, we can call functions like this:


    ```

    iex> IO.puts 123

    123

    iex> "Elixir.IO0".puts 123

    123

    ```


    # Calling a Function in an Erlang Library


    The Erlang conventions for names are different—variables start with an uppercase
    letter and atoms are simple lowercase names. So, for example, the Erlang module
    timer is just that, the atom timer. In Elixir we write that as :timer. If you
    want to refer to the tc function in timer, you’d write :timer.tc. (Note the colon
    at the start.)


    Say we want to output a floating-point number in a three-character field with
    one decimal place. Erlang has a function for this. A search for erlang format
    takes us to the description of the format function in the Erlang module.³3


    Reading the description, we see that Elixir expects us to call :io.format. So,
    in Elixir we simply change the module name to an Elixir atom:


    ```

    iex> :io.format("The number is ~3.1f-n", [5.678])nThe number is 5.7

    :ok

    ```


