    ```


    Now we have an umbrella project containing two regular projects. Because there''s
    nothing special about the subprojects, you can use all the regular mix commands
    in them. At the top level, though, you can build all the subprojects as a unit.


    # Making the Subproject Decision


    The fact that subprojects are just regular mix projects means you don''t have
    to worry about whether to start a new project using umbrella. Simply start as
    a simple project. If you later discover the need for an umbrella project, create
    it and move your existing simple project into the apps directory.


    # The LineSigil Project


    This project is trivial—just copy the LineSigil module from the previous section
    into apps/line_sigil/sigil/line_sigil.ex. Verify it builds by running mix compile—in
    either the top-level directory or the line_sigil directory.


    # The Evaluator Project


    The evaluator takes a list of strings containing Elixir expressions and evaluates
    them. It returns a list containing the expressions intermixed with the value of
    each. For example, given


    ```

    a = 3

    b = 4

    a + b

    ```


    our code will return


    ```

    code> a = 3

    value> 3

    code> b = 4

    value> 4

    code> a + b

    value> 7

    ```


    We''ll use Code.eval_string to execute the Elixir expressions. To have the values
    of variables pass from one expression to the next, we''ll also need to explicitly
    maintain the current binding.


    Here''s the code:'
