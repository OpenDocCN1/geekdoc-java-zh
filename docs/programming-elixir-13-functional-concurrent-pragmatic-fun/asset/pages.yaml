  md: "# Using Bindings to Inject Values\n\nRemember that there are two ways of injecting\
    \ values into quoted blocks. One is unquote. The other is to use a binding. However,\
    \ the two have different uses and different semantics.\n\nA binding is simply\
    \ a keyword list of variable names and their values. When we pass a binding to\
    \ quote, the variables are set inside the body of that quote.\n\nThis is useful\
    \ because macros are executed at compile time. This means they don't have access\
    \ to values that are calculated at runtime.\n\nHere's an example. The intent is\
    \ to have a macro that defines a function that returns its own name:\n\n```\n\
    defmacro mydef(name) do\n  quote do\n    def unquote(name)(), do: unquote(name)\n\
    end\n```\n\nWe try this out using something like mydef(:some_name). Sure enough,\
    \ defines a function that, when called, returns :some_name.\n\nBuoyed by our/macro_no_binding,\
    \ we try something more ambitious:\n\n```\nmacros/macro_no_binding.exs\ndefmodule\
    \ My do\n  defmacro mydef(name) do\n    quote do\n      def unquote(name)(), do:\
    \ unquote(name)\n    end\nend\ndefmodule Test do\n  require My\n  [ :fred, :bert\
    \ ] | Enum.each(&My.mydef(&1))\nend\n```\n\nI0.puts Test.fred\n\nAnd we're rewarded\
    \ with this:\n\n```\nmacro_no_binding.exs:12: invalid syntax in def _@()\n```\n\
    \nAt the time the macro is called, the each loop hasn't yet executed, so we have\
    \ no valid name to pass it. This is where bindings come in:"
  merge: -1
  pgno: 277
- img_proc: true
  md: "```\nmacros/macro_binding.exs\ndefmodule My do\n  defmacro mydef do\n    quote\
    \ bind_quoted: [name: name] do\n      def unquote(name)(),: unquote(name)\n  \
    \  end\n  end\nend\n```\n\n```\ndefmodule Test do\n  require My\n  [ :fred, :bert\
    \ ] |> Enum.each(&My.mydef(&))\nend\n```\n\nIO.puts Test.fred #=> fred\n\nTwo\
    \ things happen here. First, the binding makes the current value of name available\
    \ inside the body of the quoted block. Second, the presence of the bind_quoted:\
    \ option automatically defers the execution of the unquote calls in the body.\
    \ This way, the methods are defined at runtime.\n\nAs its name implies, simple\
    \ things such as tuples are the same as normal and quoted code, but for most values\
    \ you probably want to quote them or use Macro.escape to ensure that your code\
    \ fragment will be interpreted correctly.\n\n# Macros Are Hygienic\n\nIt is tempting\
    \ to think of macros as some kind of textual substitution—a macro’s body is expanded\
    \ as text and then compiled at the point of call. But that’s not the case. Consider\
    \ this example:\n\n```\nmacros/hygiene.ex\ndefmodule Scope do\n  defmacro update_local(val)\
    \ do\n    local = \"some value\"\n    result = quote do\n      local = unquote(val)\n\
    \      IO.puts \"End of macro body, local = #{local}\"\n    end\n    result\n\
    \  end\n  IO.puts \"In macro definition, local = #{local}\"\n  result\nend\n```"
