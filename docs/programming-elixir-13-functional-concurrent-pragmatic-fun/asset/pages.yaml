  md: "We define a start function that spawns the server process. It then uses glob-al.register_name\
    \ to register the PID of this server under the name :ticker.\n\nClients who want\
    \ to receive ticks call the register function. This function sends a message to\
    \ the Ticker server, asking it to add those clients to its list. Clients could\
    \ have done this directly by sending a register message to the server process.\
