  md: '```

    a == b # strict inequality (so 1 != 1.0 is true)

    a == b # value equality (so 1 == 1.0 is true)

    a != b # value inequality (so 1 != 1.0 is false)

    a > b # normal comparison

    a >= b #

    a < b #

    a <= b #

    ```


    The ordering comparisons in Elixir are less strict than in many languages, as
    you compare values of different types. If the types are the same or compatible
    (for example, 3>2 or 3.0<5), the comparison uses natural ordering. Otherwise comparison
    is based on type according to this rule:


    number - atom < reference < function < port < pid < tuple < map < list < binary


    # Boolean operators


    (These operators evaluate true or false as their first argument)


    ```

    a or b # true if a is true, otherwise b

    a and b # false if a is false, otherwise b

    not a # false if a is true, true otherwise

    ```


    # Relaxed Boolean operators


    These operators take arguments of any type. Any value apart from nil or false
    is interpreted as.


    ```

    a || b # a if a is trusty, otherwise b

    a && b # b if a is trusty, otherwise a

    !a # false if a is trusty, otherwise true

    ```


    # Arithmetic operators


    ```

    +-* / div

    ```


    Integer division yields a floating-point result. Use div(a,b) to get integer.
    rem is the remainder operator. It is called as a function (rem(11, 3) => 2). It
    differs from normal modulo operations in that the result will have the same sign
    as the function''s first argument.


    # Join operators


    ```

    binary1 <> binary2 # concatenates two binaries (later we''ll)

    # see that binaries include strings

    list1 ++ list2 # concatenates two lists

    list1 - list2 # removes elements of list2 from a

    # copy of list 1

    ```


    # The in operator


    ```

    a in enum # tests if a is included in enum (for example,

    # a list, a range, or a map). For maps, it should

    # be a {key, value} tuple

    ```'
