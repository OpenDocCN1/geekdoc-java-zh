  md: "```\ndef sum([], total), do: total\ndef sum([ head | tail ], total), do: sum(tail,\
    \ head+total)\nend\n```\n\nOur sum function has two parameters, the list and the\
    \ total so far. In the recursive call, we pass the list's tail and increment the\
    \ total by the value of the head.\n\nAt all times, these types of functions maintain\
    \ an invariant, a condition that is true on return from any call (or nested call).\
    \ In this case, the invariant is that at any stage of the recursion, the sum of\
    \ the elements in the list parameter plus the current total will equal the entire\
    \ list. Thus, when the list becomes empty the total will be the value we want.\n\
    \nWhen we call sum we have to remember to pass both the list and the initial total\
    \ value (which will be 0):\n\n```\niex \"sum.exs\"\n[MyList]\\iex MyList.sum([1,2,3,4,5],\
    \ 0)\n15\niex MyList.sum([11,12,13,14,15], 0)\n65\n```\n\nHaving to remember that\
    \ extra zero is a little tacky, the convention in Elixir is to hide it—our module\
    \ has a public function that takes just a list, and it calls private functions\
    \ to do the work.\n\n```\nlists/sum2.ex\ndefmodule MyList do\n  def sum(list),\
    \ do: _sum(list, 0)\n  # private methods\n  defp _sum([], total), do: total\n\
    \  defp _sum([ head | tail ], total), do: _sum(tail, head+total)\nend\n```\n\n\
    Two things to notice here: First, we use def to define a private function. We\
    \ won't be able to call these functions outside the module. Second, we choose\
    \ to give our helper functions the same name as our public function, but with\
    \ a leading underscore. Elixir treats them as being independent, but a human reader\
    \ can see that they are clearly related.\n\n(Had we kept the exact name, they\
    \ would still be different functions, as they have a different arity from the\
    \ original sum function. The leading underscore makes it explicit. Some library\
    \ code also uses do\\_xxx for these helpers.)"
