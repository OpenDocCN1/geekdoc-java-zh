  md: "# APPENDIX 2\n\n# # Type Specifications and Type Checking\n\nWhen we looked\
    \ at @callback, on page 283, we saw that we defined callbacks in terms of their\
    \ parameter types and return value. For example, we might see\n\n```\n@callback\
    \ parse(uri_info) :: URI.Info.t\n@callback default_port() :: integer\n```\n\n\
    The terms URI.Info and integer are examples of type specifications. And, as José\
    \ Valim pointed out to me, the cool thing is that they are implemented (by Yurii\
    \ Rashkovskii) directly in the Elixir language itself—no parsing is involved.\
    \ This is a fantastic illustration of the power of Elixir metaprogramming.\n\n\
    In this appendix we'll discuss how to specify types in Elixir. But before we do,\
    \ there's another question to address: *Why bother?\n\n# ## When Specifications\
    \ Are Used\n\nElixir type specifications come from Erlang. It is very common to\
    \ see Erlang code where every exported (public) function is preceded by a -spec\
    \ line. This is metadata that gives type information. The following code comes\
    \ from the Elixir parser (which is [currently] written in Erlang). It says the\
    \ return_error function takes two parameters, an integer, and never returns.\n\
    \n```\n-spec return_error(integer, any()) -> no_return().\nreturn_error(Line,\
    \ Message) ->\n  throw({error, Line, MODULE, Message}}\n```\n\nOne of the reasons\
    \ Erlang does this is to document their code. You can read it in inline while\
    \ reading the source, and you can also read it in the pages created by their documentation\
    \ tool."
  merge: -1
  pgno: 318
- img_proc: true
  md: 'The other reason is that they have tools such as dialzer that perform static
    analysis of Erlang code and report on some kinds of type mismatches.¹


    These same benefits can apply to Elixir code. We have the @spec module attribute
    for documenting a function''s type specification; in wex have the @t helper for
    showing user-defined types. You can also run Erlang tools such as dialzer on compiled
    Elixir .beam files.


    However, type specifications are not currently in wide use in the Elixir world.
    Whether you use them is a matter of personal taste.


    # Specifying a Type


    A type is simply a subset of all possible values in a language. For example, the
    type integer means all the possible integer values, but excludes lists, binaries,
    PIDs, and so on.


    The basic types in Elixir are any, atom, char_list (a single-quoted string), float,
    fun, integer, map, none, pid, port, reference, and tuple.


    The type any (and its alias, _) is the set of all values, and none is the empty
    set.


    A literal atom or integer is the set containing just that value.


    The value nil can be represented as [] or nil.


    # Collection Types


    A list is represented as [type], where type is any of the basic or combined types.
    This notation does not signify a list of one element—it simply says that elements
    of the list will be of the given type. If you want to specify a nonempty list,
    use [type...]. the type list is an alias for [any].


    Binaries are represented using this syntax:


    ```

    <<>>

    ```


    An empty binary (size 0).


    ```

    <<_ : size >>

    ```


    A sequence of size bits. This is called a bitstring.


    ```

    <<_ : size * unit_size >>

    ```


    A sequence of size units, where each unit is unit_size long.'
