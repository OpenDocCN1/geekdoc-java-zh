    \ &(&+1)) |> Enum.take(5)\n[2, 3, 4, 5, 6]\n```\n\nthe result comes back instantaneously.\
    \ The take just needs five values, which it gets from the stream. Once it has\
    \ them, there's no more processing.\n\nIn these examples the stream is bounded,\
    \ but it can equally go on forever. To do that, we'll need to create streams based\
    \ on functions.\n\n# Creating Your Own Streams\n\nStreams are implemented in Elixir\
