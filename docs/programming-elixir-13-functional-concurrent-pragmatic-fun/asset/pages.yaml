    Even though we crashed our worker, it got restarted and the state was preserved.
    Now we begin to see how careful supervision is critical if we want to write reliable
    applications.


    # Supervisors Are the Heart of Reliability


    Think about our previous example; it was both trivial and profound. It was trivial
    because there are many ways of achieving some kind of fault tolerance with a library
    that returns successive numbers. But it was profound because it is a concrete
    representation of the idea of building confidence in our code. The outer ring,
    where our code interacts with the world, should be as reliable as we can make
    it. But within ring there are other, nested rings. And in those rings, things
    can be less than perfect. The trick is to ensure that the code in each ring knows
    how to deal with failures of the code in the next ring down.


    And that''s where supervisors come into play. In this chapter we''ve seen only
    a small fraction of supervisors'' capabilities. And that different strategies
    for dealing with the termination of a child, different ways of restarting them.
    There''s plenty of information online about using OTP supervisors.


    The real power of supervisors is that they exist. The fact that you use to manage
    your workers means you are forced to think about reliability and state as you
    design your application. And discipline allows applications with very high availability—in
    Programming Erlang (2nd edition) [Arm13]. Joe Armstrong says OTP has been used
    to build systems with 99.999999% reliability. That''s nine nines. And that ain''t
    bad.


    There''s one more level in our lightning tour of OTP—the application. And that''s
    the next chapter''s topic.'
