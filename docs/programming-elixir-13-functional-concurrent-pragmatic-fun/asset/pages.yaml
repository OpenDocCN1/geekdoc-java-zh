  md: '+   - Convert any collection into a list:


    ```

    iex> Enum.to_list 1..5

    [1, 2, 3, 4, 5]

    ```


    +   - Concatenate collections:


    ```

    iex> Enum.concat([1,2,3], [4,5,6])

    [1, 2, 3, 4, 5, 6]

    iex> Enum.concat([1,2,3], ''abc'')

    [1, 2, 3, 97, 98, 99]

    ```


    +   - Create collections whose elements are some function of the original:


    ```

    iex> Enum.map(list,&(&1 * 10))

    [10, 20, 30, 40, 50]\iex> Enum.map(list,&String.duplicate("*", &1))

    ["*", "**", "***", "****", "******"]

    ```


    +   - Select elements by position or criteria:


    ```

    iex> Enum.at(10..20, 3)

    13

    > Enum.at(10..20, 20)

    nil

    > Enum.at(10..20, 20, :no_one_here)

    :no_one_here

    > Enum.filter(list,&(&1 > 2))

    [3, 4, 5]

    iex> require Integer      # to get access to is_even

    nil

    > Enum.filter(list,&Integer.is_even/1)

    [2, 4]

    > Enum.reject(list,&Integer.is_even/1)

    [1, 3, 5]

    ```


    +   - Sort and compare elements:


    ```

    iex> Enum.sort(["there", "was", "a", "crooked", "man"])

    ["a", "crooked", "man", "there", "was"]

    iex> Enum.sort(["there", "was", "a", "crooked", "man"], &(String.length(&1) <=
    6))

    ["a", "was", "man", "there", "crooked"]

    iex> Enum.map(["there", "was", "a", "crooked", "man"], &"was")

    ["was", "was", "was", "was", "was"]

    iex> Enum.max_by(["there", "was", "a", "crooked", "man"], &String.length/1 "crooked")

    "crooked"

    ```


    +   - Split a collection:


    ```

    iex> Enum.take(list, 3)

    [1, 2, 3]

    iex> Enum.take_every list, 2

    ```'
