  md: "# The import Directive\n\nThe import directive brings a module's functions\
    \ and/or macros into the current scope. If you use a particular module a lot in\
    \ your code, import can cut down the clutter in your source files by eliminating\
    \ the need to repeat the module name time and again.\n\nFor example, if you import\
    \ the flatten function from the List module, you'd be able to call it in your\
    \ code without having to specify the module name.\n\n```\nmm/import.ex Example\
    \ do\ndefmodule do\n  def func1 do\n    List.flatten [1,[2,3],4]\n  end\n  def\
    \ func2 do\n    import List, only: [flatten: 1]\n    flatten [5,6,7],8]\n  end\n\
    end\n```\n\nThe full syntax of import is\nimport Module [, only:|except: ]\n\n\
    The optional second parameter lets you control which functions or macros are imported.\
    \ You write only: or except:, followed by a list of name: arity pairs. It is a\
    \ good idea to use import in the smallest possible enclosing scope and to use\
    \ only: to import just the functions you need.\n\n```\nimport List, only: [ flatten:\
    \ 1, duplicate: 2 ]\n```\n\nAlternatively, you can give only: one of the atoms\
    \ :functions or :macros, and import will bring in only functions or macros.\n\n\
    # The alias Directive\n\nThe alias directive creates an alias for a module. One\
    \ obvious use is to cut down on typing.\n\n```\ndefmodule Example do\n def compile_and_go(source)\
    \ do\n  alias My.Other.Module.Parser, as: Parser\n  alias My.Other.Runner, as:\
    \ Runner\n  source\n  |> Parser.parse()\n  |> Runner.execute())\nend\nend\n```"
