  md: "# case\n\ncase lets you test a value against a set of patterns, executes the\
    \ code associated with the first one that matches, and returns the value of code.\
    \ The patterns may include guard clauses.\n\nFor example, the file.open function\
    \ returns a two-element tuple. If the open is successful, it returns {:ok, file};\
    \ where file is an identifier for the open file. If the open fails, it returns\
    \ {:error, reason}. We can use case to take the appropriate action when one opens.\
    \ (In this case the code opens its own source file.)\n\n```\ncontrol/case.ex\n\
    case File.open(\"case.ex\") do\n {:ok, file} ->\nIO.puts(\"First line: #{IO.read(file,\
    \ :line)}\"\n {:error, reason} ->\nIO.puts(\"Failed to open file: \\#{reason}\"\
    )\nend\n```\n\nproduces: First line File.open(\"case.ex\") do\n\nIf we change\
    \ the file name to something that doesn't exist and then rerun the code, we instead\
    \ seen get: Failed to open file: enopent.\n\nWe can use the full power of nested\
    \ pattern matches:\n\n```\ncontrol/case1.exs\ndefmodule Users do\ndave = %{name:\
    \ \"Dave\", state: \"TX\", likes: \"programming\"}\ncase dave do\n%{state: some_state}\
    \ = person ->\nIO.puts(\"\\#{person.name} lives in \\#{some_state}\")\n->\nIO.puts(\"\
    No matches\")\nend\n```\n\nWe've seen how to employ guard clauses to refine the\
    \ pattern used when matching functions. We can do the same with case.\n\n```\n\
    control/case2.exs\ndave = %{name: \"Dave\", age: 27}\ncase dave do\nperson = %{age:\
    \ age} when is_number(age) and age >= 21 ->\nIO.puts(\"You are cleared to enter\
    \ the Foo Bar, \\#{person.name}\")\n->\nIO.puts(\"Sorry, no admission\")\nend\n\
    ```"
