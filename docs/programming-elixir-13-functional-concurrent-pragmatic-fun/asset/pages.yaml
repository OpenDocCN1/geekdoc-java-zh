- img_proc: true
  md: "If it gets a :fib message, it calculates the answer and sends back to the client.\n\
    It loops by calling itself recursively. This will send another :ready message,\n\
    telling the client it is ready for more work.\n\nIf it gets a :shutdown it simply\
    \ exits.\n\n# The Task Scheduler\n\nThe scheduler is a little more complex, as\
    \ it is designed to handle both a\nvarying number of server processes and an unknown\
    \ amount of work.\n\n```\nspawn/fib.ex\ndefmodule Scheduler do\nn  def run(num_processes,\
    \ module, func, to_calculate) do\n    (1..num_processes)\n    |> Enum.map(fn()\
    \ -> spawn(module, func, [self]) end)\n    |> scheduler_(to_calculate, [])\n \
    \ end\n  defp schedule_processes(processes, queue, results) do\n    receive\n\
    \      {:ready, pid} when length(queue) > 0 ->\n        [ next | tail ] = queue\n\
    \        send pid, {:fib, next, self}\n        schedule_processes(processes, tail,\
    \ results)\n      {:ready, pid} ->\n        send pid, {:shutdown}\n        if\
    \ length(processes) List.delete(processes, pid), queue, results\n        schedule_processes(processes,\
    \ queue, results)\n        else\n          Enum.sort(results, fn {n1}, {n2} ->\
    \ n1 <= n2 end)\n        end\n      {:answer, number, result, _pid} ->\n     \
    \   schedule_processes(processes, queue, [{result} | results])\n    end\n  end\n\
    ```\n\nThe public API for the scheduler is the run function. It receives the number\
    \ of\nprocesses to spawn, the module and function to spawn, and a list of things\n\
