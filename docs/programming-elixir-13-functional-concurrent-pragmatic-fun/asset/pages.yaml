    # A Fibonacci Server


    Let''s round out this chapter with an example program. Its task is to calculate
    fib(n) for a list of n, where fib(n) is the nth Fibonacci number. (The Fibonacci
    sequence starts 0, 1. Each subsequent number is the sum of the preceding two numbers
    in the sequence)^2 I chose not this because it is something we all do every day,
    but because the naive calculation of Fibonacci numbers 10 through 37 takes a measurable
    number of seconds on typical computers.


    The twist is that we''ll write our program to calculate different Fibonacci numbers
    in parallel. To do this, we''ll write a trivial server process that does'
  merge: -1
