  md: '```

    ''the'', ''cat'', ''sat'', ''on'', ''the'', ''mat''

    iex ~w[cat{a}]t sat on the mat]

    "the", "cat", "sat", "on", "the", "mat"

    ```


    The delimiter can be any word. If it is [, [, {, or <, the terminating delimiter
    is the corresponding closing character. Otherwise the terminating delimiter is
    the nextescaped occurrence of the opening delimiter.


    Elixir does not check the nesting of delimiters, so the sigil ~s{a{b}} is the
    three-character string a{b}.


    If the opening delimiter is three single or three double quotes, the sigil is
    treated as a heredoc.


    ```

    iex ~"""

    >... the

    >... cat

    >... sat

    >... """

    ["the", "cat", "sat"]

    ```


    If you want to specify modifiers by heredoc sigils (most commonly you''d do this
    with ~r), add them after the terminating delimiter.


    ```

    iex ~r"""

    >... hello

    >... """

    ~r/hello\n/i

    ```


    One of the interesting things about sigils is that you can define your own. We
    talk about this in Part III, on page 305.


    # The Name "strings"


    Before we get into this, I need to explain something. In most other languages,
    you''d call ''cat'' and "cat" both strings. And that''s what I''ve been doing
    so far. But Elixir has a different convention.


    In Elixir, the convention is that we call double-quoted strings "strings." The
    single-quoted form is a character list.


    This is important. The single- and double-quoted forms are very different, and
    libraries that work on strings work only on the double-quoted form.


    Let''s explore the differences in more detail.'
