- img_proc: true
  md: "A different approach to consider the overall properties of the function you're\
    \ testing. For example, if your function converts a string to uppercase, you can\
    \ predict that, whatever string you feed it:\n\n+   - the length of the output\
    \ will be the same as the length of the input, and\n- any lowercase characters\
    \ in the input will have been replaced by their uppercase counterpart.\n\nThese\
    \ intrinsic properties of the function. And we can test them statistically by\
    \ injecting a (large) number of different strings and verifying that the results\
    \ honor the properties. If all the tests pass, we haven't proved that the function\
    \ is correct (although we have a lot of confidence that it should be). But, more\
    \ importantly, if any of the tests fail, we've found a boundary condition that\
    \ our function doesn't handle. And property-based testing is surprisingly good\
    \ at finding these errors.\n\nLet's look at our previous example:\n\n```\ntooling/pbt/lib/stats.ex\n\
    def defmodule Stats do\n  def sum(vals),      do: vals |> Enum.reduce(0, &+/)\n\
    \  def count(vals),    do: vals |> length\n  def average(vals), do: sum(vals)\
    \ / count(vals)\nend\n```\n\nHere are some simple properties we could test:\n\n\
    +   - The sum of a list containing a single value should be that value.\n- The\
    \ count function should never return a negative number.\n- If we multiply the\
    \ results returned by count and average, it should equal the result returned by\
    \ sum (allowing for a little rounding).\n\nTo test the properties, the framework\
    \ needs to generate large numbers of sample values of the correct type. For the\
    \ first test, example, we need a bunch of numeric values.\n\nThat's where the\
    \ property testing libraries come in. Using ExCheck,² I could write something\
    \ like this:\n\n```\nfor all number in real do\n# ...\nend\n```\n\n2. ExCheck\
    \ is an Elixir wrapper around Kresten Krab Thorpe's triq Erlang library. Find\
    \ it at https://github.com/parity/excheck."
  merge: -1
  pgno: 179
- img_proc: true
  md: "There are two pieces of magic here. The first is the real function. This is\
    \ a generator, which will return successive real numbers. This is invoked by for\
    \ all. You might think from its name that this will try all real numbers (which\
    \ would take some time), but instead it iterates a given number of times (100\
    \ by default).\n\nLet's code this up. First, we need to add ExCheck and triq to\
    \ our list of dependencies:\n\n```\ntooling/pbt/mix.ex\ndefp deps do\n  {:triq,\
    \ github: \"krestenkrab/triq\", only: :test}\n  {:excheck, \"-> 0.4.0\", only:\
    \ :test}\nend\n```\n\nNow we have to make sure ExCheck is running at the time\
    \ we run our tests. Add the highlighted line to your test_helper.ex file:\n\n\
    ```\ntooling/pbt/test/test_helper.ex\nExUnit.start()\nExCheck.start()\n```\n\n\
    +   OK. Now we can write the property tests:\n\nHere's the first:\n\n```\ntooling/pbt/test/stats_property_test.ex\n\
    defmodule StatsPropertyTest do\n  use ExUnit.Case\n  use ExCheck\n\ndescribe \"\
    Stats on lists of ints\" do\n  property \"single element lists are their own sum\"\
    \ do\n    for_all number in do\n      Stats.sum([number]) == number\n    end\n\
    \  end\n```\n\nYou'll see this looks a lot like a regular test. We have to include\
    \ ExCheck at the top to include the property test framework.\n\nThe actual test\
    \ is in the property block. It has the for_all block we saw earlier. Inside this\
    \ we have a condition: Stats.sum([number]) == number.\n\nIf this condition is\
    \ met for each of the for_all iterations, the test passes. Otherwise the value\
    \ that causes it to fail is reported."
