    # Concurrent Programming


    You want to write concurrent programs. That''s probably why you''re reading this
    book.


    Let''s look at Elixir''s actor-based concurrency model. Then we''ll dig into OTP,
    the Erlang management architecture that helps you create applications that are
    highly scalable and very reliable.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '![](img/1ab9716b0f893152e6837cbf5f4252d6_191_0.png)


    # CHAPTER 15


    # Working with Multiple Processes


    One of Elixir''s key features is the idea of packaging code into small chunks
    that can be run independently and concurrently.


    If you''ve come from a conventional programming language, this may worry you.
    Concurrent programming is “known” to be difficult, and there’s a performance penalty
    to pay when you create lots of processes.


    Elixir doesn''t have these issues, thanks to the architecture of the Erlang VM
    on which it runs.


    Elixir uses the actor model of concurrency. An actor is an independent process
    that shares nothing with any other process. You can spawn new processes, send
    them messages, and receive them back. And that''s (apart from some details about
    error handling and monitoring, which we cover later).


    In the past, you may have had to use threads or operating system processes to
    achieve concurrency. Each time, you probably felt you were opening Pandora’s box—there
    was so much that could go wrong. But that worry evaporates in Elixir. In fact,
    Elixir developers are so comfortable creating new processes, they’ll often do
    it at times when you’ve created an object in a language such as Java.


    One more thing—when we talk about processes in Elixir, we are not talking about
    native operating system processes. These are too slow and bulky. Elixir uses process
    support in Erlang. These processes will run across all your CPUs (just like native
    processes), but they have very little overhead. As we’ll cover a bit later, it’s
    very easy to create hundreds of thousands of Elixir processes on even a modest
    computer.'
