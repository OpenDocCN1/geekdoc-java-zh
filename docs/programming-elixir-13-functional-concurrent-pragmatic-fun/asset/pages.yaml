  md: "Before we can write our version of if, we need one more trick—the ability to\
    \ substitute existing code into a quoted block. There are two ways of doing this:\
    \ by using the unquote function and with bindings.\n\n# The unquote Function\n\
    \nLet's get two things out of the way. First, we can use unquote only inside a\
    \ quote block. Second, unquote is a silly name. It should really be something\
    \ like inject_code_fragment.\n\nLet's see why we need this. Here's a simple macro\
    \ that tries to output the result of evaluating the code we pass it:\n\n```\n\
    defmacro macro(code) do\n  quote do\n    IO.inspect(code)\n  end\nend\n```\n\n\
    Unfortunately, when we run it, it reports an error:\n** (CompileError).../eg2.ex:11:\
    \ function code/0 is undefined\n\nInside the quote block, Elixir is just parsing\
    \ regular code, so the name code is inserted literally into the code fragment\
    \ it returns. But we don't want that. We want Elixir to insert the evaluation\
    \ of the code we pass in. And that's where we use unquote. It temporarily turns\
    \ off quoting and simply injects a code fragment into the sequence of code being\
    \ returned by quote.\n\n```\ndefmodule My do\n  defmacro macro(code) do\n    quote\
    \ do\n      IO.inspect(unquote(code))\n    end\nend\n```\n\nInside the quote block,\
    \ Elixir is busy parsing the code and generating its internal representation.\
    \ But when it hits the unquote, it stops parsing and simply copies the code parameter\
    \ into the generated code. After unquote, it goes back to regular parsing.\n\n\
    There's another way of thinking about this. Using unquote inside a quote is a\
    \ way of deferring the execution of the quoted code. It doesn't run when the quote\
    \ block is parsed. Instead it runs when the code generated by the quote block\
    \ is executed."
