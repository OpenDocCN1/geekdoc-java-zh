  md: 'There are several ways of exiting from iex—none are tidy. The easiest two are
    typing Ctrl-C twice or typing Ctrl-G followed by q and Return. On some systems,
    you can also use a single Ctrl-\.


    # iEX Helpers


    iex has a number of helper functions. Type h (followed by return) to get a list:


    ```

    iex> h

    ```


    # IEX.Helpers


    Welcome to Interactive Elixir. You are currently seeing the documentation for
    the module IEX.Helpers which provides many helpers to make Elixir''s shell joyful
    to work with.


    This message was triggered by invoking the helper h(), usually referred to h/0
    (since it expects 0 arguments).


    You can use the h function to invoke the documentation for any Elixir module function:


    ```

    h Enum

    h Enum.map

    h Enum.reverse/1

    ```


    You can also use the i function to introspect any value you have in the shell:


    ```

    | i "hello"

    ```


    There are many other helpers available:


    +   * b/1 - prints callbacks info and docs for a given module

    * c/1 - compiles a file into the current directory

    * c/2 - compiles a file to the given path

    * cd/1 - changes the current directory

    * clear/0 - clears the screen

    * flush/0 - flushes all messages sent to the shell

    * h/0 - prints this help message

    * h/1 - prints help for the given module, function or macro

    * i/1 - prints information about the given data type

    * import_file/1 - evaluates the given file in the shell''s context

    * l/1 - loads the given module''s beam code

    * ls/0 - lists the contents of the current directory

    * ls/1 - lists the contents of the specified directory

    * nl/2 - deploys local beam code to a list of nodes

    * pid/1 - creates a PID from a string

    * pid/3 - creates a PID with the 3 integer arguments passed

    * pw/0 - prints the current working directory

    * recompile/0 - recompiles the given module''s source file

    * respawn/0 - spawns the current shell

    * s/1 - prints spec information

    * t/1 - prints type information

    * v/0 - retrieves the last value from the history

    * v/1 - retrieves the nth value from the history'
