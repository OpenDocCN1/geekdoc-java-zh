  md: 'The code may not make sense, but by about halfway through the book, you''ll
    be writing this kind of thing for yourself.


    # Functions Are Data Transformers


    Elixir lets us solve the problem in the same way the Unix shell does. Rather than
    have command-line utilities, we have functions. And we can string them together
    as we please. The smaller—more focused—those functions, the more flexibility we
    have when combining them.


    If we want, we can make these functions in parallel—Elixir has a powerful mechanism
    for passing messages between them. And these are not your father''s boring old
    processes or threads—we''re talking about the potential to run millions of them
    on a single machine and have hundreds of these machines interoperating. Bruce
    Tate commented on this paragraph with this thought: "Most programmers treat threads
    and processes as a necessary evil; Elixir developers feel they are an important
    simplification." As we get deeper into the book, you''ll start to see what he
    means.


    This idea of transformation transforms its inputs into its output. The trigonometric
    function sin is an example—give it π/4, and you''ll get 0.7071... An HTML templating
    system is a function: it takes a template containing placeholders and a list of
    named values, and produces a completed HTML document.


    But this power comes at a price. You''re going to unlearn a whole lot of what
    you know about programming. Many of your instincts are wrong. And this will be
    frustrating, because you''re going to feel like a total n00b.


    Personally, I feel that''s part of the fun.


    You didn''t learn, say, object-oriented programming overnight. You are unlikely
    to become a functional programming expert by breakfast, either.


    But at some points will click. You''ll start thinking about problems in a different
    way, and you''ll find yourself writing code that does amazing things with very
    little effort on your part. You''ll find yourself writing small chunks of code
    that can be used over and over, often in unexpected ways (just as we grep can
    be).


    Your view of the world may even change a little as you stop thinking in terms
    of responsibilities and start thinking in terms of getting things done.


    And just about everyone agree that will will be fun.'
  merge: -1
