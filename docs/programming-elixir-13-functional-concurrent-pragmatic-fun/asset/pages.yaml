  md: 'Still thinking about your current language. consider this:


    ```

    array = [ 1, 2, 3 ]

    do_something_with(array)

    print(array)

    ```


    Again, you''d hope the print call would output [1,2,3]. But in most languages,
    do_something_with will receive the array as a reference. If it decides to change
    the second element or delete the contents entirely, the output won''t be what
    you expect. Now it''s harder to look at your code and reason about what it does.


    Take this a step further—run multiple threads, all with access to the array. Who
    knows what the array will be in if they all start changing it?


    All this is because most compound data structures in most programming languages
    are mutable—you can change all or part of their content. And if pieces of your
    code do this in parallel, you''re in a world of hurt.


    By coincidence, Jessica Kerr (@jessitron) tweeted the following on the day I updated
    this section.


    > GOTO was evil because we asked, "how did I get to this point of execution?"
    Mutability leaves us with, "how did I get to this state?"


    It''s spot-on.


    # Immutable Data Is Known Data


    Elixir sidesteps these problems. In Elixir, all values are immutable. The most
    complex nested list, these things behave just like the simplest integer. Their
    values are all immutable.


    In Elixir, once a variable references a list such as [1,2,3], you know it will
    always reference those same values (until you rebind the variable). And this makes
    concurrency a lot less frightening.


    But what if you need to add 10 to each element in [1,2,3]? Elixir does it by producing
    a copy of the original, containing the new values. The original remains unchanged,
    and your operation will not affect any other code holding a reference to that
    original.


    This fits in nicely with the idea that programming is about transforming data.
    When we update [1,2,3], we don''t hack it in place. Instead we transform it into
    something new.'
