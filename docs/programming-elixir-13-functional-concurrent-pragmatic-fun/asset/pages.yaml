  md: "Although the recursive call is physically the last thing in the function, it\
    \ is not the last thing executed. The function has to multiply the value it returns\
    \ by n.\n\nTo make it recursive, we need to move the multiplication into the recursive\
    \ call, and this means adding an accumulator:\n\n```\nspawn/fact_tr.exs\ndefmodule\
    \ TailRecursive do\n  def factorial(n),    do: _fact(n, 1)\n  defp fact(0, acc),\
    \    do: acc\n  defp _fact(n, acc),   do: _fact(n-1, acc*n)\nend\n```\n\n# Process\
    \ Overhead\n\nAt the start of the chapter, I somewhat cavalierly said Elixir processes\
    \ were very low overhead. Now it is time to back that up. Let's write some code\
    \ that creates n processes. The first will send a number to the second. It will\
    \ increment and pass it to the third. This will continue until we get to the last\
    \ process, which will pass the number back to the top level.\n\n```\nspawn/chain.exs\n\
    defmodule Chain do\n  def counter(next_pid) do\n    receive do\n      n ->\n \
    \       send next_pid, n + 1\n    end\n  end\n\n  def create_processes(n) do\n\
    \    last = Enum.reduce(1..n, self,\n      fn (_send_to) ->\n        spawn(Chain,\
    \ :counter, [send_to])\n    end)\n    \n    send last, 0  # start the count by\
    \ sending a zero to the last process\n    receive do\n      # and wait for the\
    \ result to come back to us\n      final_answer when is_integer(final_answer)\
    \ ->\n        \"\"Result is #{inspect(final_answer)}\"\n    end\n  end\n\n  def\
    \ run(n) do\n    IO.puts inspect :timer.tc(Chain, :create_processes, [n])\n  end\n\
    ```"
