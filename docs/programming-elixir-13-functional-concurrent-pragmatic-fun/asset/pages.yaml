- img_proc: true
  md: "In the last two instances, size can be specified as _ in which case binary\
    \ has an arbitrary number of bits/units.\n\nThe predefined type bitstring is equivalent\
    \ to <<::>>, an arbitrarily sized sequence of bits. Similarly, binary is defined\
    \ as <<_:*8>>, an arbitrary sequence of 8-bit bytes.\n\nTuples are represented\
    \ as {type, type...}, or using the type tuple, both {atom,integer} and tuple(atom,integer)\
    \ represent a tuple whose first element is an atom and whose second element is\
    \ an integer.\n\n# Combining Types\n\nThe range operator (.) can be used with\
    \ literal integers to create a type representing the range. The three built-in\
    \ types, non_neg_integer, pos_integer, and neg_integer, represent integers that\
    \ are greater than or equal to, greater or less than zero, respectively.\n\nThe\
    \ union operator (|) indicates that the acceptable values are the unions of its\
    \ arguments.\n\nParentheses may be used to group terms in a type specification.\n\
    \n# Types and Structures\n\nAs structures are basically maps, you could just use\
    \ the map type for them, but doing so throws away a lot of useful information.\
    \ I recommend that you define a specific type for each struct:\n\n```\ndefmodule\
    \ LineItem do\n  defstruct sku :: \"\", quantity: 1\n  @type t :: LineItem(sku:\
    \ String.t, quantity: integer)\nend\n```\n\nYou can then reference this type as\
    \ LineItem.t.\n\n# Anonymous Functions\n\nAnonymous functions are specified using\
    \ (head -> return_type).\n\nThe head specifies the arity and possibly the type\
    \ of the function parameters. It can ..., meaning an arbitrary number of arbitrarily\
    \ typed arguments, or a list of types, in which case the number of types is the\
    \ function’s.\n\n```\n( -> integer) # Arbitrary parameters; returns an integer\n\
    (list(integer) -> integer) # Takes a list of integers and returns an integer\n\
    (() -> String.t) # Takes no parameters and returns an Elixir string\n(integer,\
    \ atom -> list(atom)) # Takes an integer and an atom and returns\n# a list of\
    \ atoms\n```"
