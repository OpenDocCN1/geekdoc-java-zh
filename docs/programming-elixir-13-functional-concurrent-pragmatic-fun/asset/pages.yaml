  md: "# Dynamic (Runtime) Nested Accessors\n\nThe nested accessors we've seen so\
    \ far are macros—they operate at compile time. As a result, they have some limitations:\n\
    \n+   * The number of keys you pass a particular call is static.\n* You cannot\
    \ pass the set of keys as parameters between functions.\n\nThese are a natural\
    \ consequence of the way macros make their parameters into code at compile time.\n\
    \nTo overcome this, get_in, put_in, update_in, and get_and_update_in can all take\
    \ a list of keys as a separate parameter. Adding this parameter changes them from\
    \ macros to function calls, so they become dynamic.\n\n| Macro | Function |\n\
    | get_in | no | (dict, keys) |\n| put_in | (path, value) | (dict, keys, value)\
    \ |\n| update_in | (path, fn) | (dict, keys, fn) |\n| get_and_update_in | (path,\
    \ fn) | (dict, keys, fn) |\n\nHere's a simple example:\n\n```\nmaps/dynamic_nested.ex\n\
    nested = %n  buttercup: %n    actor: %n      first: \"Robin',\n      last: \"\
    Wright\"\n    },\n    role: \"princess\"\n  },\n  westley: %n    actor: %n   \
    \   first: \"Cary',\n      last: \"Ewles\" # typo!\n    },\n    role: \"farm boy\"\
    \n  }\n}\nIO.inspect get_in(nested, [:buttercup])\n# => #{actor: %{first: \"Robin\"\
    , last: \"Wright\"}, role: \"princess\"}}\n```"
