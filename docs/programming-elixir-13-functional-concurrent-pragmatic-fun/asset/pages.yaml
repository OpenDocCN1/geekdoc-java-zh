  md: '# Multi-app Umbrella Projects


    It is unfortunate that Erlang chose to call self-contained bundles of code apps.
    In many ways, they are closer to being shared libraries. As as your projects grow,
    you may find yourself wanting to split your code into multiple libraries, or apps.
    Fortunatelyately, mix makes this painless.


    To illustrate the process, we''ll create a simple Elixir evaluator. Given a set
    of input lines, it will return the result of evaluating each. This will be one
    app.


    To test it, we''ll need to pass in lists of lines. We''ve already written a trivial
    sigil that creates lists of lines for us, so we''ll make that sigil code into
    a separate-rate application.


    Elixir calls these multi-app projects umbrella projects.


    # Create an Umbrella Project


    We use mix to create an umbrella project, passing it the --umbrella option.


    ```

    $ mix new --umbrella eval

    * creating README.md

    * creating mix.ex

    * creating apps

    ```


    Compared to a normal project, the umbrella is pretty lightweight—just a mix file
    and an apps directory.


    # Create the Subprojects


    Subprojects are stored in the apps directory. There''s nothing special about them—they
    are simply regular projects created using mix new. Let''s create our two projects
    now:


    ```

    $ cd eval/apps

    $ mix new line_sigil

    * creating README.md

    ... and so on

    $ mix new evaluator

    * creating README.md

    ... and so on

    * creating test/evaluator_test.ex

    ```


    At this point we can try out our umbrella project. Go back to the overall project
    directory and try mix compile.


    ```

    $ cd ..

    $ mix compile

    == evaluator

    ```'
