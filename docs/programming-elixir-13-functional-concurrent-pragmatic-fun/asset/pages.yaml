  md: "# Binaries and Pattern Matching\n\nThe first rule of binaries is “if in doubt,\
    \ specify the type of each field.” Available types are binary, bits, bitstring,\
    \ bytes, float, integer, utf8, utf16, and utf32. You can also add qualifiers:\n\
    \n+   - size(n): The size in bits of the field.\n- signed or unsigned: For integer\
    \ fields, should it be interpreted as signed?\n- endianness: big, little, or native.\n\
    \nUse hyphens to separate multiple attributes for a field:\n<< length::unsigned-integer-size(12),\
    \ flags::bitstring-size(4) >> = data\nHowever, unless you're doing a lot of work\
    \ with binary file or protocol formats, the most common use of all this scary\
    \ stuff is to process UTF-8 strings.\n\n# String Processing with Binaries\n\n\
    When we process lists, we use patterns that split the head from the rest of the\
    \ list. With binaries that hold strings, we can do the same kind of trick. We\
    \ have to specify the type of the head (UTF-8), and make sure the tail remains\
    \ a binary.\n\n```\nstrings/utf-iterate.ex\ndefmodule Utf8 do\n def each(str,\
    \ func) when is_binary(str), do: _each(str, func)\n\n defp _each(<< head :: utf8,\
    \ tail :: binary >>) do\n  func.(head)\n  _each(tail, func)\nend\n\ndef _each(<<>>,\
    \ _func), do: []\nend\n```\n\nUtf8.\"ög\", fn char -> IO.puts end\n\nproduces:\n\
    8706\n111\n103"
