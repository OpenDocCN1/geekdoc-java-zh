  md: "# CHAPTER 24\n\n# More Cool Stuff\n\nElixir is packed with features that make\
    \ coding a joy. This chapter contains a smattering of them.\n\n# Writing Your\
    \ Own Sigils\n\nYou know by now that you can create strings and regular-expression\
    \ literals using sigils:\n\n```\nstring = ~s{now is the time}\nregex = ~r{..h}\n\
    ```\n\nHave you ever wished a sigil you could extend these sigils to add your\
    \ own specific literal types? You can.\n\nWhen you write a sigil as ~{...}, Elixir\
    \ converts it into a call to the function sigil_s. It passes the function two\
    \ values. The first is the string between the delimiters. The second is a list\
    \ containing any lowercase letters that immediately follow the closing delimiter.\
    \ (This second parameter is used to pick up any options you pass to a regex literal,\
    \ such as ~r/cat/if.)\n\nHere's the implementation of a sigil ~l that takes a\
    \ multiline string and returns a list containing each line as a separate string.\
    \ We know that ~l... is converted into a call to sigil_l, so we write a simple\
    \ function in the LineSigil module.\n\n```\nodds/line_sigil.ex\ndefmodule LineSigil\
    \ do\n  @doc\"\"\n  Implement the '~l' sigil, which takes a string containing\n\
    \  multiple lines and returns a list of those lines.\n  # Example usage\n  iex>\
    \ import LineSigil\n  nil\n  iex> ~l\\\"\"\"\n```"
