    # Streams in Practice


    In the same way that functional programming requires you to look at problems in
    a new way, streams allow you to look at iteration and collections afresh. Not
    every situation where you are iterating requires a stream. But consider using
    a stream when you want to defer processing until you need the data, and when you
    need to deal with large numbers of things without necessarily generating them
    all at once.


    # The Collectable Protocol


    The Enumerable protocol lets you iterate over the elements in a type—given a collection,
    you can get the elements. Collectable is in some sense the opposite—it allows
    you to build a collection by inserting elements into it.


    Not all collections are collectable. Ranges, for example, cannot have new entries
    added to them.


    The collectable API is pretty low-level, so you''ll typically access it via Enum.into
    and using comprehensions (which we cover in the next section). For example, you
    can inject the elements of a range into an empty list using


    ```

    iex> Enum.into(1..5, [])

    [1, 2, 3, 4, 5]

    ```'
