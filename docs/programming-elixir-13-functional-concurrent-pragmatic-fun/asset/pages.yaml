  md: '# Exceptions: raise and try, catch and throw


    Elixir (like Erlang) takes the view that errors should normally be fatal to the
    processes in which they occur. A typical Elixir application''s design involves
    many processes, which means the effects of an error will be localized. A supervisor
    will detect the failing process, and the restart will be handled at that level.


    For that reason, you won''t find much exception-handling code in Elixir programs.
    Exceptions are raised, but you rarely catch them.


    Use exceptions for things that are exceptional—things that should never happen.


    Exceptions do exist. This appendix is an overview of how to generate them and
    how to catch them when they occur.


    # Raising an Exception


    You can raise an exception using the raise function. At its simplest, you pass
    a string and it generates an exception of type RuntimeError.


    ```

    iex raise "Giving up"

    ** (RuntimeError) Giving up

    erl_eval.error:572: :erl_eval.do_apply/6

    ```


    You can also pass the type of the exception, along with other optional fields.
    All exceptions implement at least the message field.


    ```

    iex raise RuntimeError

    ** (RuntimeError) runtime error

    erl_eval.error:572: :erl_eval.do_apply/6

    iex raise RuntimeError, message: "override message"

    ** (RuntimeError) override message

    erl_eval.error:572: :erl_eval.do_apply/6

    ```'
  merge: -1
  pgno: 313
- img_proc: true
  md: "You can intercept exceptions using the try function. It takes a block of code\
    \ to execute, rescue, catch, and optional clauses.\n\nThe rescue and catch clauses\
    \ look a bit like the body of a case function—they take patterns and code to execute\
    \ if the pattern matches. The subject of the exception is the exception that was\
    \ raised.\n\nHere's an example of exception handling in action. We define a module\
    \ with a public function, start. It calls a different helper function depending\
    \ on the value of its parameter. With 0, it runs smoothly. With 1, 2, or 3, it\
    \ causes the VM to raise an error, which we catch and report.\n\n```\nexceptions/exception.ex\n\
    defmodule Boom do\n  start(n) do\n    try\n      raise_error(n)\n    rescue\n\
    \      [ FunctionClause, RuntimeError ] ->\n        IO.puts \"no function match\
    \ or runtime error\"\n      error in [ArithmeticError] ->\n        IO.inspect\
    \ error\n        IO.puts \"Uh-oh! Arithmetic error\"\n        reraise \"too late,\
    \ we're doomed\", System.stacktrace\n      other_errors ->\n        IO.puts \"\
    Disaster! \\#{inspect other_errors}\"\n    after\n      IO.puts \"DONE!\"\n  \
    \  end\n  end\n\n  def raise_error() do\n    IO.puts \"No error\"\n  end\n\n \
    \ def raise_error(val = 1) do\n    IO.puts \"About to divide by zero\"\n    1\
    \ / (val-1)\n  end\n\n  def raise_error(2) do\n    IO.puts \"About to call a function\
    \ that doesn't exist\"\n    raise_error(99)\n  end\n\n  def raise_error(3) do\n\
    \    IO.puts \"About to try creating a directory with no permission\"\n    File.mkdir!(\"\
    /not_allowed\")\n  end\nend\n```"
  merge: -1
  pgno: 314
- img_proc: true
  md: "We define three different exception patterns. The first matches one of the\
    \ two exceptions, FunctionClauseError or RuntimeError. The second matches an ArithmeticError\
    \ and stores the exception value in the variable. The last clause catches any\
    \ exception into the variable other_error.\n\nWe also include an after clause.\
    \ This will always run at the end of the function, regardless of whether an exception\
    \ was raised.\n\nFinally, look at the handling of ArithmeticError. As well as\
    \ reporting the error, we call raise. This raises the current exception, but lets\
    \ us add a message. We also pass in the stack trace (which is actually the stack\
    \ trace at the point original exception was raised). Let's see all this in iex:\n\
    \n```\niex c(\"exception.ex\")\n[Boom]\\iex> Boom.start 1\nAbout to divide by\
    \ zero\n%ArithmeticError{}\nUh-oh! Arithmetic error\nDONE!\n** (RuntimeError)\
    \ too late, we're doomed\nexception.ex:26: Boom.raise_error/1\nexception.ex:5:\
    \ Boom.start/1\n```\n\n```\niex> Boom.start 2\nAbout to call a function that doesn't\
    \ exist\nno function match or runtime error\nDONE!\n:ok\n```\n\n```\niex> Boom.start\
    \ 3\nAbout to try creating a directory with no permission\nDisaster! %File.Error(action:\
    \ \"make directory\", path: \"/not_allowed\"\nreason: :eacces\nDONE!\n:ok\n```\n\
    \n# catch, exit, and throw\n\nElixir code (and the underlying Erlang libraries)\
    \ can raise a second kind of error. These are generated when a process calls error,\
    \ exit, or throw. All three take a parameter, which is available to the catch\
    \ handler.\n\nHere's an example:\n\n```\nexceptions/catch.ex\ndefmodule Catch\
    \ do\n  def start(n) do\n    try do\n      incite(n)\n```"
