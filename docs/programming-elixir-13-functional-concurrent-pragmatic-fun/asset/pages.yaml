  md: '# # A Vain Attempt at a Justification


    I''m a language nut. I love trying languages out, and I love thinking about their
    design and implementation. (I know; it''s sad).


    I came across Ruby in 1998 because I was an avid reader of comp.lang.misc (ask
    your parents). I downloaded it, compiled it, and fell in love. As with any time
    you fall in love, it''s difficult to explain why. It worked the way I work, and
    it had enough depth to keep me interested.


    Fast-forward 15 years. All that time I''d been looking for something new that
    gave me the same feeling.


    I came across Elixir a while back, but for some reason never got sucked in. But
    a few months before starting this book, I was chatting with Corey Haines. I was
    bemoaning the fact that I wanted a way to show people functional programming concepts
    without the academic trappings those books seem to attract. He told me to look
    again at Elixir. I did, and I felt the same way I felt when I first saw Ruby.


    So now I''m dangerous. I want other people to see just how great this is. I want
    to evangelize. So my first step is to write a book.


    But I don''t want to write another 900-page Pickaxe book. I want this book to
    be short and exciting. I''m not going into all the detail


    Instead, I want to give you an idea of the power and beauty of this programming
    model. I want to inspire you to get involved, and then point to the online resources
    that will fill in the gaps.


    But mostly, I want you to have fun.'
  merge: -1
