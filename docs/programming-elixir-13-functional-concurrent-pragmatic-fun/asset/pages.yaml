  md: "# Raising Exceptions\n\nFirst, the official warning: exceptions in Elixir are\
    \ not control-flow structures. Instead, Elixir exceptions are intended for things\
    \ that should never happen in normal operation. That means the database going\
    \ down or a server failing to respond could be considered exceptional. Failing\
    \ to open a file whose name is fixed could be seen as exceptional. However, failing\
    \ to open a file whose name is user entered is not (You could anticipate that\
    \ a user might mistype it every and now.)\n\nRaise an exception with the raise\
    \ function. At its simplest, you pass it a string and it generates an exception\
    \ of type RuntimeError.\n\n```\niex> raise \"Giving up\"\n** (RuntimeError) Giving\
    \ up\n```\n\nYou can also pass the type of the exception, along with other optional\
    \ attributes. All exceptions implement at least the message attribute.\n\n```\n\
    iex> raise RuntimeError\n** (RuntimeError) runtime error\niex> raise RuntimeError,\
    \ message: \"override message\"\n** (RuntimeError) override message\n```\n\nYou\
    \ use exceptions far less in Elixir than in other languages—the design philosophy\
    \ is that errors should propagate back to an external, supervising process. We'll\
    \ cover this when we talk about [OTP Supervisors on page 231].\n\nElixir has all\
    \ the usual exception-catching mechanisms. To emphasize how little you should\
    \ use them, I described them in [an appendix on page 315].\n\n# Designing with\
    \ Exceptions\n\nIf File.open succeeds, it returns {:ok, file}, where file is the\
    \ service that gives you access to the file. If it fails, it returns {:error,\
    \ reason}. So, for code that knows a file might not succeed and wants to handle\
    \ the fact, you might write\n\n```\ncase File.open(user_file_name) do\n  {:ok,\
    \ file} ->\n    process(file)\n  {:error, message} ->\n    IO.puts :stderr, \"\
    Couldn't open #{user_file_name}: #{message}\"\nend\n```\n\nIf instead you expect\
    \ the file to open successfully every time, you could raise an exception of failure."
