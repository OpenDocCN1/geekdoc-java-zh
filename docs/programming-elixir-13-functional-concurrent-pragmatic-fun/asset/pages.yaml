  md: "# CHAPTER 21\n\n# Macros and Code Evaluation\n\nHave you ever felt frustrated\
    \ that a language didn’t just have the right feature for some code you were writing?\
    \ Or you have found repeating chunks of code that weren't amenable to factoring\
    \ into functions? Or you have just wished you could program closer to your problem\
    \ domain?\n\nIf so, then you’ll love this chapter.\n\nBut, before we get into\
    \ the details, here’s a warning: macros can easily make your code harder to understand,\
    \ because you're essentially rewriting parts of the language. For that reason,\
    \ never use a macro when you could use a function. Let’s repeat that:\n\n> Never\
    \ use a macro when you can use a function.\n\nIn fact, you’ll probably not write\
    \ a macro in regular application code. But if you’re writing a library and want\
    \ to use some of the other metaprogramming techniques that we show in later chapters,\
    \ you’ll need to know how macros work.\n\n# Implementing an if Statement\n\nLet’s\
    \ imagine Elixir didn’t have an if statement—all it has case. Although we’re prepared\
    \ to abandon our old friend while the loop, not having an if statement is just\
    \ too much to bear, so we set about implementing one.\n\nWe’ll want to call it\
    \ using something like\n\n```\nmyif <<condition>> do\n  evaluate if true»\nelse\n\
    \  evaluate if false»\nend\n```"
