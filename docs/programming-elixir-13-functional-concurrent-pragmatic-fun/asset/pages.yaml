  md: "Right now, for instance, I'm taking empty files and transforming them into\
    \ files containing text. Soon I will transform those files into a format you can\
    \ read. A web server somewhere will transform your request to download the book\
    \ into an HTTP response containing the content.\n\nI don't want to hide data.\
    \ I want to transform it.\n\n# Combine Transformations with Pipelines\n\nUnix\
    \ users are used to the philosophy of small, focused command-line tools that can\
    \ be combined in arbitrary ways. Each tool takes an input, transforms it, and\
    \ we writes the result in a format that the next tool (or a human) can use.\n\n\
    This philosophy is incredibly flexible and leads to fantastic reuse. The Unix\
    \ utilities can be combined in ways undreamed of by their authors. And each one\
    \ multiplies the potential of the others.\n\nIt's also highly reliable—each small\
    \ program does one thing well, which makes it easier to test.\n\nThere's another\
    \ benefit. A command pipeline can operate in parallel. If I write\n\n```\n$ grep\
    \ Elixir *.pml | wc -l\n```\n\nthe word-program, wc, runs at the same time as\
    \ the grep command. Because wc consumes grep's output as it is produced, the answer\
    \ is ready with virtually no delay once grep finishes.\n\nJust to give you a taste\
    \ of this kind of thing, here's an Elixir function called pmap. It takes a collection\
    \ and a function, and returns the list that results from applying that function\
    \ to each element of the collection. But...it runs a separate process to do the\
    \ conversion of each element. Don't worry about details for now.\n\n```\nspawn/pmap1.ex\n\
    defmodule Parallel do\n  def pmap(collection, func) do\n    collection\n    |>\
    \ Enum.map(&Task.async(fn -> func.(&1) end))\n    |> Enum.map(&Task.await/1)\n\
    \  end\n```\n\nWe could run this function to get the squares of the numbers from\
    \ 1 to 1000.\n\n```\nresult = Parallel.pmap.1000, &(&1 * &1)\n```\n\nAnd, yes,\
    \ I just kicked off 1,000 background processes, and I used all the cores and processors\
    \ on my machine."
