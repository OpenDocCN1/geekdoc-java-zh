  md: '# CHAPTER 18


    # OTP: Supervisors


    I''ve said it a few times now: the Elixir way says not to worry much about code
    that crashes; instead, make sure the overall application keeps running.


    This might sound contradictory, but really it is not.


    Think of a typical application. If an unhandled error causes an exception to be
    raised, the application stops. Nothing else gets done until it is restarted. If
    it''s a server handling multiple requests, they all might be lost.


    The issue is here that one error takes the whole application down.


    But imagine that your application consists of hundreds or thousands of processes,
    each handling just a small part of a request. If one of those crashes, everything
    else carries on. You might lose the work it''s doing, and when you can design
    your applications to minimize that risk. And when that process gets restarted,
    you''re back running at 100%.


    In the Elixir and OTP worlds, supervisors perform all of this process monitoring
    and restarting.


    # Supervisors and Workers


    An Elixir supervisor has just one purpose—it manages one or more worker processes.
    (As we''ll discuss later, it can also manage other supervisors.)


    At its simplest, a supervisor is a process that uses the OTP supervisor behavior.
    It is given a list of processes to monitor and is told what to do if a process
    dies, and how to prevent restart loops (when a process is restarted, dies, gets
    restarted, dies, and so on).


    To do this, the supervisor uses the Erlang VM process-linking and -monitoring
    facilities. We talked about these when we covered spawn on page 195.'
