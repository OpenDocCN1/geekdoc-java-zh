    # Handling Multiple Messages\n\nLet's try sending a second message.\n\n```\nspawn2.exs\n\
    defmodule Spawn2 do\n  greet do\n    receive do\n      {sender, msg} ->\n    \
    \    send sender, {:ok, \"Hello, #{msg}\"}\n    end\n  end\n```\n\n# here's a\
    \ client\n\n```\npid = spawn(Spawn2, :self, \"World!\")\nsend pid, {:ok, \"World!\"\
    }\nreceive do\n  {:ok, message} ->\n    I.puts message\nend\n```\n\n```\nsend\
    \ pid, {:ok, \"Kermit\"}\nreceive do\n  {:ok, message} ->\n    I.puts message\n\
    end\n```\n\nRun it in iex:\n\n```\niex> c(\"spawn2.exs\")\nHello World!\n....\
