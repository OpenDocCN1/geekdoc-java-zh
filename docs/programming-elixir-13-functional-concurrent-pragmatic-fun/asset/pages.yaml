    # GenServer Callbacks


    GenServer is an OTP protocol. OTP works by assuming that your module defines a
    number of callback functions (six, in the case of a GenServer). If you were writing
    a GenServer in Erlang, your code would have to contain implementations of all
    six.


    When you add the line use GenServer to a module, Elixir creates default implementations
    of these six callback functions. We all have to override the ones where we add
    our own application-specific behaviour. Our examples so far have the two callbacks
    handle_call and handle_cast. Here''s a full list:


    ```

    init(start_arguments)

    ```


    Called by GenServer when starting a new server. The parameter is the second argument
    passed to start_link. Return {:ok, state} on success, or {:stop, reason} if the
    server could not be started.


    You can specify an optional timeout using {:ok, state, timeout}, in which case
    GenServer sends the process :timeout message whenever no message is received in
    a span of timeout ms. (The message is passed to the handle_info function.)


    The default GenServer implementation sets the server state to the argument you
    pass.


    ```

    handle_call(request, from, state)

    ```


    Invoked when a client uses GenServer.call(pid, request). The from parameter is
    a tuple containing the PID of the client and a unique tag. The state parameter
    is the server state.


    On success returns {:reply, result, new_state}. The list that follows this one
    on page 226, shows other valid responses.'
