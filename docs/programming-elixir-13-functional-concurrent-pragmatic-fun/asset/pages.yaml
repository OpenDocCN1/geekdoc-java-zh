  md: "```\niex> c \"times.exs\"\n[Times]\niex> Times.double(4)\n8\niex> Times.double(123)\n\
    246\n```\n\nThe line c \"times.exs\" compiles your source file and loads it into\
    \ iex. We then call the double function in the Times module a couple of times\
    \ using Times.double.\n\nWhat happens if we make our function fail by passing\
    \ it a string rather than a number?\n\n```\niex> Times.double(\"cat\")\n** (ArithmeticError)\
    \ bad argument in arithmetic expression\ntimes.exs:3: Times.double/1\n```\n\n\
    An exception (ArithmeticError) gets raised, and we see a stack backtrack. The\
    \ first line tells us what went wrong (we tried to perform arithmetic on a string),\
    \ and the next line tells us. But look at what it writes for the name of our function:\
    \ Times.double/1.\n\nIn Elixir a named function is identified by both its name\
    \ and its number of parameters (its *arity*). Our double function takes one parameter,\
    \ Elixir knows it as double/1. If we had another version of double that took three\
    \ parameters, it would be known as double/3. These two functions are totally separate\
    \ as Elixir is concerned. But from a human perspective, you'd imagine that if\
    \ two functions have the same name they are related, even if they have a different\
    \ number of parameters. For that reason, don't use the name for two functions\
    \ that do unrelated things.\n\n# The Function’s Body Is a Block\n\nThe do...end\
    \ block is one way of grouping expressions and passing them to other code. They\
    \ are used in module and named function definitions, control structures...any\
    \ place in Elixir where code needs to be handled as an entity.\n\nHowever, do...end\
    \ is not actually the underlying syntax. The syntax looks like this:\n\n```\n\
    def double(n), do: n * 2\n```\n\nYou can pass multiple lines to do: by grouping\
    \ them with parentheses.\n\n```\ndef greet(greeting, name), do: (\n  IO.puts \"\
    How're you doing, #{name}?\"\n)\n```"
