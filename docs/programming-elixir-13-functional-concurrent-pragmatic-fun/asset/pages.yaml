  md: "```\ndefmodule Spawn4 do\n  greet do\n    receive\n      {sender, msg} ->\n\
    \        send sender, {:ok, \"Hello, #{msg}\"}\n      greet\n    end\n  end\n\
    ```\n\n# here's a client\npid = spawn(Spawn4, :greet, [])\nsend pid, {self, \"\
    World!\"}\nreceive do\n  {:ok, message} ->\n    IO.puts message\nend\nsend pid,\
    \ {self, \"Kermit\"}\nreceive do\n  {:ok, message} ->\n    IO.puts message\n \
    \ after 500 ->\n    IO.puts \"The greeter has gone away\"\nend\n\nRun this, and\
    \ both messages are processed:\niex c(\"spawn4.ex\")\nHello World!\nHello Kermit!\n\
    [Spawn4]\n\n# Recursion, Looping, and the Stack\n\nThe greet function might have\
    \ worried you a little. Every time it receives a message, it ends up calling itself.\
    \ In many languages, this adds a new frame to the stack. After a large number\
    \ of messages, you might run out of memory.\n\nThis doesn't happen in Elixir,\
    \ as it implements tail-call optimization. If the last thing a function does is\
    \ call itself, there's no need to make the call. Instead, the runtime simply jumps\
    \ back to the start of the function. If the recursive call has arguments, then\
    \ these replace the original parameters.\n\nBut beware—the recursive call must\
    \ be the very last thing executed. For example, the following code is not tail\
    \ recursive:\n\n```\ndef factorial(0), do: 1\ndef factorial(n), do: n * factorial(n-1)\n\
    ```"
