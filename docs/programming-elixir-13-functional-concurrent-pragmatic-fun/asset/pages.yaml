    {4015, "Result is 10"}

    ```


    We asked it to run 10 processes, and it came back in 4m. The answer was correct.
    Let''s try 100 processes.


    ```

    $ elixir -r chain.chains -e "Chain.run(100)"

    {4562, "Result is 100"}

    ```


    Only a small increase in the time. There''s probably some startup latency on the
    first creation. Onward! Let''s try 1,000.


    ```

    $ elixir -r chain.chains -e "Chain.run(1_000)"

    {8458, "Result is 1000"}

    ```


    Now 10,000.


    ```

    $ elixir -r chain.chains -e "Chain.run(10_000)"

    {66769, "Result is 10000"}

