  md: 'with its own cookie. A cookie is just an arbitrary string (ideally long and
    very random). As an administrator of a distributed Elixir system, you need to
    create a cookie and make sure all nodes use it.


    If you are running the iex or elixir commands, you can pass in the cookie using
    the --cookie option.


    ```

    $ iex --name one --cookie chocolate-chip

