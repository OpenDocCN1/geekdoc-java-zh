    \ 8. We assign the value of the cond expression to\nnext_answer. Inside the cond,\
    \ we have four alternatives—the current number is\nmult of 3 and 5, just 3, 5,\
    \ or neither. Elixir examines each in turn\nand returns the value of the expression\
    \ following the -> for the first one.\nThe_upto function then recurses to find\
