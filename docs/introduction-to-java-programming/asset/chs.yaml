  \n编写一个程序将给定的数字转换为单词（例如：237 -> two three seven）。[](images/00013.jpeg)\n\n```java\n\
  /* The given number is written in words\n* This program requires jdk1.6 or higher\
  \ to compile and execute\n* ka.somasundaram@gmail.com */\nimport java.io.Console;\n\
  \nclass Digit2word {\n    public static void main(String args[]) {\n        Console\
  \ con = System.console();\n        int numb, gnumb, reminder;\n        String sword\
  \ = \"\", word = \"\", snumb;\n        con.printf(\"%n Type in the number : \");\n\
  \        snumb = con.readLine();\n        gnumb = Integer.parseInt(snumb);\n   \
  \     numb = gnumb;\n        while (numb > 0) {\n            reminder = numb % 10;\n\
  \            switch (reminder){\n                case 0:\n                    sword\
  \ = \"zero \";\n                    break;\n                case 1:\n          \
  \          sword = \"One \";\n                    break;\n                case 2:\n\
  \                    sword = \"two \";\n                    break;\n           \
  \     case 3:\n                    sword = \"three \";\n                    break;\n\
  \                case 4:\n                    sword = \"four \";\n             \
  \       break;\n                case 5:\n                    sword = \"five \";\n\
  \                    break;\n                case 6:\n                    sword\
  \ = \"six \";\n                    break;\n                case 7:\n           \
  \         sword = \"seven \";\n                    break;\n                case\
  \ 8:\n                    sword = \"eight \";\n                    break;\n    \
  \            case 9:\n                    sword = \"nine \";\n                 \
  \   break;\n                default:\n                    sword = \"No digit\";\n\
  \            }\n            word = sword + word;\n            numb = numb / 10;\n\
  \        }\n        con.printf(\"%n The given number %d in words :%s\", gnumb, word);\n\
  \    }\n}\n```\n\n上述程序给出了图 5.26 所示的输出。\n\n![](img/00057.jpeg)\n\n**图 5.26** 程序输出\n\
