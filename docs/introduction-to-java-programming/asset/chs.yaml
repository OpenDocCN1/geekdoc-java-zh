  10.8 编写一个程序，找出字符数组中的大写字母、空白字符和数字。\n10.9 编写一个程序，将给定字符数组中的字符转换为大写字母。\n10.10 编写一个程序，将\
  \ int 类型数字 a=34 和 b=36 转换为二进制字符串。按位与运算 a 和 b，并打印结果的二进制字符串。\n\n\n\n\n一个编译通过且无错误的\
  \ Java 程序将执行并完成其开发时所设的任务。然而，在某些情况下，在正常条件下运行良好的程序可能会在异常情况下（如除以零）遇到错误。这些发生在异常情况下的错误被称为异常（exceptions）。这些错误可能发生在程序代码内部，也可能通过程序尝试访问的资源产生。错误来源可能是用户输入错误（例如提供错误的\
  \ URL）、设备错误（例如打印机未就绪）、物理限制（如磁盘满或内存不足）以及代码错误（如数组索引越界、尝试访问空栈和除以零错误）。如果这些异常没有被捕获，程序将在发生异常点终止。Java\
  \ 提供了适当的机制来处理此类异常。处理异常的目的是告知用户错误，或采取替代路径解决问题并完成剩余任务。这有助于用户了解程序内部正在发生什么。如果没有这些信息，用户可能会得到意之外的输出。\n\
  \n## 11.1 异常的类型\n\nJava 中的所有异常都由 `java.lang` 包中定义的超类 `Throwable` 处理。`Throwable`\
  \ 类有两个子类：`Exception` 和 `Error`。`Exception` 再次有两个子类：`IOException` 和 `RuntimeException`。异常的层次结构如图\
  \ 11.1 所示。\n\n![](img/00126.jpeg)\n\n**图 11.1** 异常层次结构\n\n### RuntimeException\n\
  在运行时发生在程序代码中的异常在此类中处理。除以零错误、数组索引越界、错误的类型转换和空指针访问属于此类异常。如果程序员在编写程序时留心，这些类型的错误是可以避免的。这些异常可以被\
  \ Java 捕获并处理。\n\n### IOException\n在访问 I/O 设备时发生的异常在此类中处理。找不到文件、遇到文件结束属于此类异常。\n\n\
  ### Exception\n在此类中，用户可以创建自己的异常 并在 Java 程序中使用它。此类下的所有异常都应该被捕获并处理。\n\n### Error\n\
  程序员无法控制的错误在此类中处理。磁盘满和内存不足属于此类错误。Java 没有提供任何机制来处理它们，且它们不应该被捕获。\n\n## 11.2 捕获异常\n\n\
  Java 开发人员已经识别了常见的异常，并在 `Exception` 中进行了说明。当此类异常在程序运行时出现在程序中时，应该被捕获并处理。异常通过 `try...catch`\
  \ 机制被捕获。`try...catch` 块的标准形式如下：\n\n| try | { ... |  |\n|  |  | 可能产生异常的语句 |\n|  |\
  \  | exceptions |\n|  | } catch (ExceptionType e1){ 处理语句 |\n| Exception Type1 |\
  \ | |\n|  | } | catch (ExceptionType e2) { 处理 ExceptionType2 的语句 |\n|  | } | finally\
  \ { 无论是否发生异常都会执行的语句 |\n|  | } |  ||\n\n术 `try`、`catch` 和 `finally` 是 Java 关键字。`e1`\
  \ 和 `e2` 是错误对象变量。在 `try` 块中，放置怀疑可能导致异常的语句。`ExceptionType1` 和 `ExceptionType2` 是不同的异常类型。`catch`\
  \ 块包含在发生 `Exception` 时要执行的语句。\n\n单个 `try` 块可以设置多个 `catch` 块，每个 `catch` 块处理 `try`\
  \ 块内部发生的多种异常中的一种特定类型异常。`try` 块可以构造为捕获任意数量的异常。如果在 `try` 块中发生异常且没有匹配的 `catch` 块，程序将终止。如果\
  \ `try` 块内部没有发生 `Exception`，所有的 `catch` 块语句都将被跳过，仅执行 `finally` 块中的语句。此 `finally`\
  \ 块无论是否发生 `Exception` 都会执行。`catch` 块语句仅对前面的 `try` 块有效。`finally` 块是可选的。\n\n下面的程序\
  \ 11.1 包含一个在运行时产生的数组越界异常，导致程序在未完成任务的情况下终止。\n\n程序 11.1![](img/00013.jpeg)\n\n```java\n\
  /* 此程序演示了程序中发生的异常。\n* 此程序需要 jdk1.6 或更高版本\n* ka.somasundaram@gmail.com\n*/\nclass\
  \ ExceptionDemo1 {\n    public static void main(String args[]) {\n        int mat[]\
  \ = new int[5];\n        mat[5] = 755;\n        System.out.printf(\"Last element\
  \ of mat = %d\\n\", mat[5]);\n    }\n}\n```\n\n上述程序输出了如图 11.2 所示的错误消息。\n\n![](img/00127.jpeg)\n\
  \n**图 11.2** 图 11.2 程序 11.1 的输出屏幕\n\n上述错误消息表明，`java.lang` 包中定义的 `ArrayIndexOutOfBoundsException`\
  \ 在程序 `ExceptionDemo1.java` 的 main 方法的第 5 行发生。在程序 11.1 中，`mat` 数组的索引只能取 0 到 4 的值。然而，程序尝试访问索引为\
  \ 5 的元素，这已经越界。\n\n现在，我们将利用 Java 的异常处理功能，使用 `try` 和 `catch` 来处理异常。下面的程序 11.2 使用 `try...catch`\
  \ 结构处理数组异常：\n\n程序 11.2![](img/00013.jpeg)\n\n```java\n/* 此程序演示了程序中发生的异常。\n* 此程序需要\
  \ jdk1.6 或更高版本\n* ka.somasundaram@gmail.com\n*/\nimport java.io.Console;\nclass\
  \ Catch {\n    public static void main(String args[]) {\n        Console con = System.console();\n\
  \        int mat[] = new int[5];\n        try {\n            mat[5] = 75;\n    \
  \    } catch (ArrayIndexOutOfBoundsException e) {\n            con.printf(\"Array\
  \ of bounds in array\\n\");\n        }\n        mat[4] = 75;\n        con.printf(\"\
  Beyond the exception point \\n\");\n        con.printf(\"Last element of mat = %d\\\
  n\", mat[4]);\n    }\n}\n```\n\n上述程序输出了如图 11.3 所示的输出。\n\n![](img/00128.jpeg)\n\n\
  **图 11.3** 图 11.3 程序 11.2 的输出屏幕\n\n程序 11.2 的输出显示程序越过了数组异常并完成了。在 `catch` 块中，可以放置任何对导致异常语句提供补救的语句。\n\
  \n在 `try` 块中，当发生异常时，从异常语句到 try 块结束之间的所有语句都将被跳过。因此，程序员必须决定将哪些语句放在 `try` 块内部。如果代码中发生异常且它不会对结果产生任何问题，则可以在\
  \ `catch` 块之后放置一个空块 `{}`。下面的程序 11.3 演示了与 for 循环叠加的 `try... catch` 块中的上述概念：\n\n程序\
  \ 11.3![](img/00013.jpeg)\n\n```java\n/* 此程序演示了 try 块的多重 catch。\n* 此程序需要 jdk1.6\
  \ 或更高版本。\n* ka.somasundaram@gmail.com\n*/\nimport java.io.Console;\nclass Multicatch\
  \ {\n    public static void main(String args[]) {\n        int i, x, cons = 4;\n\
  \        Console con = System.console();\n        for (i = 1; i < 8; i++) {\n  \
  \          try {\n                x = 25 / (cons - i);\n                con.printf(\"\
  %n quot = %d\\n\", x);\n            } catch (ArithmeticException e) {\n        \
  \        con.printf(\"\\n Divide by zero error for i = %d\\n\", i);\n          \
  \  } catch (ArrayIndexOutOfBoundsException e) {\n            }\n        }\n    }\n\
  }\n```\n\n![](img/00011.jpeg)在 `try ... catch` 块中，当发生异常时，从异常语句到 try 块结束之间的所有语句都将被跳过。\n\
  \n### 11.2.1 嵌套 try 块\n\n\n\n\n\nJava 程序中允许嵌套 `try` 块，即一个 `try` 块包含另一个 `try` 块。`catch`\
  \ 语句对于由 `{` 和 `}` 定义的相应语句块有效。接下来的程序 11.4 释了嵌套的 `try` 块：\n\n程序 11.4![](img/00013.jpeg)\n\
  \n```java\n/* This program illustrates the nested Try block.\n* This program requires\
  \ jdk1.6 or higher for compile and execute.\n* ka.somasundaram@gmail.com\n*/\n\n\
  import java.io.Console;\n\nclass NestedTry {\n    public static void main(String\
  \ args[]) {\n        int vec[] = {3, 5, 4, 10, 2};\n        int nmr = 24;\n    \
  \    int quot, sum = 0;\n        Console con = System.console();\n        for (int\
  \ i = 0; i <= 5; i++) {\n            try {\n                quot = nmr / (2 – i);\n\
  \                try {\n                    sum += vec[i];\n                } catch\
  \ (ArrayIndexOutOfBoundsException e) {\n                    con.printf(“Array index\
  \ out of bounds at index(inner try) = %d%n”, i);\n                } catch (ArithmeticException\
  \ e) {\n                    con.printf(“Divide by zero error at i (inner try) =\
  \ %d%n”, i);\n                }\n                con.printf(“Quotient = %d%n”, quot);\n\
  \            } catch (ArrayIndexOutOfBoundsException e) {\n                con.printf(“Array\
  \ index out of bounds at index(outer try) = %d%n”, i);\n            } catch (ArithmeticException\
  \ e) {\n                con.printf(“Divide by zero error at i ( outer try) = %d%n”,\
  \ i);\n            }\n        }\n        con.printf(“Sum of numbers = %d%n”, sum);\n\
  \    }\n}\n```\n\n上面的程序给出了图 11.5 所示的输出。\n\n![](img/00130.jpeg)\n\n**图 11.5** 程序\
  \ 11.4 的输出屏幕\n\n上面的程序计算变量 `nmr` 除以 `i-2` 的整数除法商，并计算包含五个元素的数组 `vec` 之和。当 `for` 循环重复时，会发生除零错误，控制将跳过直到外部\
  \ `try` 块结束的所有语句并寻找匹配的 `catch` 语句。因此，外部 `try` 块中用于 `ArithmeticException` 的 `catch`\
  \ 语句被捕获并执行 `catch` 块语句。由于控制跳过了从异常发生到相应 `try` 块 `}` 之间的所有语句，`i=2` 时 `sum += vec[i]`\
  \ 未执行。因此，`sum` 的最终值为 20 而不是 24。当数组索引 `i` 取值为 5 时，内部 `try` 块发生 `ArrayIndexOutOfBoundsException`\
  \ 并被捕获处理。控制随后退出内部 `try` 块并执行剩下的两个打印语句。\n\n### 11.2.2 多个 catch 块的层次结构\n\n当为一个 `try`\
  \ 块设置多个 `catch` 块时，应先捕获子类异常，然后捕获父类异常。如果将父类异常处理器放在前面，后面是子类异常的处理器，则 Java 编译器将给出 `TypeException\
  \ has already been caught` 错误。假设在多个 catch 块中，第一个 `catch` 块捕获 `Exception` 类型的异常，随后是另一个捕获\
  \ `ArithmeticException` 的 `catch` 块，则会发生 `ArithmeticException has already been caught`\
  \ 错误。接下来的程序 11.5 说明所示：\n\n程序 11.5![](img/00013.jpeg)\n\n```java\n/* This program\
  \ illustrates the order of catch statement\n* This program will give compile error\n\
  * This program requires jdk1.6 or higher.\n* ka.somasundaram@gmail.com\n*/\n\nimport\
  \ java.io.Console;\n\nclass Catchorder {\n    public static void main(String args[])\
  \ {\n        int vec[] = {3, 5, 4, 10, 2};\n        int nmr = 24;\n        int quot,\
  \ sum = 0;\n        Console con = System.console();\n        for (int i = 0; i <=\
  \ 5; i++) {\n            try {\n                quot = nmr / (2 – i);\n        \
  \        sum += vec[i];\n                con.printf(“%n Quotient = %2d”, quot);\n\
  \            } catch (Exception e) {\n                con.printf(“%n Divide by zero\
  \ error at i =%2d “, i);\n            } catch (ArithmeticException e) {\n      \
  \          con.printf(“%n Array index out of bounds at index = %2d”, i);\n     \
  \       }\n        }\n        con.printf(“%n Sum of numbers = %2d”, sum);\n    }\n\
  }\n```\n\n上面的程序在编译后将给出图 11.6 所示的输出。\n\n![](img/00131.jpeg)\n\n**图 11.6** 程序 11.5\
  \ 的错误屏幕\n\n在上面的程序中，第一个 `catch` 块捕获父类 `Exception` 异常，而第二个 `catch` 块捕获属于 `RuntimeException`\
  \ 的 `ArithmeticException`，它是 `Exception` 的子类（见图 11.1）。因此产生编译错误。如果交换 `catch` 块的顺序，程序将没有错误且可以执行。\n\
  \n![](img/00011.jpeg) 在多个 catch 块中，应先捕获子类异常，后捕获父类异常。\n\n## 11.3 重新抛出异常\n\n当异常在方法中被捕获时，由程序员决定处理。如果知道如何处理该异常，就可以处理；否则可以重新抛出。重新抛出通过\
  \ `throw` 子句完成。除非使用 `throw` 语句，否则程序将终止。接下来的程序 11.6 说明如何重新抛出异常。如果发生任何此类错误，可以将其纳入\
  \ `Throwable` 或其子类中。\n\n程序 11.6![](img/00013.jpeg)\n\n```java\n/* This program demonstrates\
  \ rethrowing an exception\n* This program requires jdk1.6 or higher.\n* ka.somasundaram@gmail.com\n\
  */\n\nimport java.io.Console;\n\nclass Rethrow {\n    public static void main(String\
  \ args[]) throws Exception {\n        int nmr = 24, i, quot;\n        Console con\
  \ = System.console();\n        for (int i = 0; i <= 5; i++) {\n            try {\n\
  \                quot = nmr / (2 – i);\n                try {\n                \
  \    sum += vec[i];\n                } catch (ArrayIndexOutOfBoundsException e)\
  \ {\n                    con.printf(“Array index out of bounds at index(inner try)\
  \ = %d%n”, i);\n                } catch (ArithmeticException e) {\n            \
  \        con.printf(“Divide by zero error at i (inner try) = %d%n”, i);\n      \
  \          }\n                con.printf(“Quotient = %d%n”, quot);\n           \
  \ } catch (ArrayIndexOutOfBoundsException e) {\n                con.printf(“Array\
  \ index out of bounds at index(outer try) = %d%n”, i);\n            } catch (ArithmeticException\
  \ e) {\n                con.printf(“Divide by zero error at i ( outer try) = %d%n”,\
  \ i);\n            }\n        }\n        con.printf(“Sum of numbers = %d%n”, sum);\n\
  \    }\n}\n```\n\n上面的程序给出了图 11.7 所示的输出。\n\n![](img/00132.jpeg)\n\n**图 11.7** 程序\
  \ 11.6 的输出屏幕\n\n接下来的程序 11.7 说明重新捕获重新抛出的异常并使其完成：\n\n程序 11.7![](img/00013.jpeg)\n\n\
  ```java\n/* This program demonstrates recatching a rethrown exception\n* and makes\
  \ the program to complete:\n*/\n\nimport java.io.Console;\n\nclass Recatch {\n \
  \   public static void main(String args[]) {\n        int nmr = 24, i, quot;\n \
  \       Console con = System.console();\n        for (int i = 0; i <= 5; i++) {\n\
  \            try {\n                try {\n                    quot = nmr / (2 –\
  \ i);\n                    con.printf(\"Quotient = %d%n\", quot);\n            \
  \    } catch (ArithmeticException e) {\n                    con.printf(\"Rethrowing\
  \ the exception at i =%d%n\", i);\n                    throw e;\n              \
  \  }\n            } catch (ArithmeticException e) {\n                con.printf(\"\
  Recaught %s %n\", e);\n            }\n        }\n    }\n}\n```\n\n## 11.4 创建自定义异常\n\
  \n到目前为止看到的所有异常都是 Java 语言内部定义的。我们已经学习了如何捕获和重新抛出它们。某些程序可能会产生 Java 预定义异常的错误。如果发生任何此类错误，可以将其纳入\
  \ `Throwable` 或其子类中。这提供了一种创建新异常的机制。创建异常的通用形式为：\n\n`new ThrowableClass()`\n\n或 `new\
  \ ThrowableClass(String s)`\n\n`ThrowableClass` 可以 `Throwable` 或其子类。`Throwable`\
  \ 及其子类有两个构造函数。第一个构造函数不需要参数，第二个构造函数接受字符串作为参数。字符串被赋值为异常名称。例如，以下语句创建一个带有参数的新异常 `MyException`\
  \ 并使用 `throw` 子句抛出。\n\n`Throwable MyException = new Throwable(\"Help Me\");`\n\n\
  `throw MyException;`\n\n接下来的程序 11.8 创建一个异常、抛出它并捕获它。\n\n程序 11.8![](img/00013.jpeg)\n\
  \n```java\n/* This program illustrates the creation of a new exception\n* using\
  \ Throwable class.\n* This program requires jdk1.6 or higher for compile and execute.\n\
  * ka.somasundaram@gmail.com\n*/\n\nimport java.io.Console;\n\nclass MyException\
  \ {\n    public static void main(String args[]) {\n        Throwable MyExpn = new\
  \ Throwable(“Help Me”);\n    }\n}\n```\n\n\n\n\n\n```java\nConsole con = System.console();\n\
  \ntry {\n    con.printf“A new excetion is thrown%n”);\n    throw MyExpn;\n} catch\
  \ (Throwable e) {\n    con.printf(“The exception is caught here.%n%nThe exception\
  \ is %s%n”, e);\n}\n}\n```\n\n上述程序给出了图 11.9 所示的输出。\n\n![](img/00134.jpeg)\n\n**图\
  \ 11.9** 程序 11.8 的输出屏幕\n\n接下来的程序 11.9 创建了一个名为 `NewExp` 的 `Exception` 子类，创建了该类型的对象，抛出它并捕获它。\n\
  \n程序 11.9![](img/00013.jpeg)\n\n```java\n/*此程序演示了如何使用 Exception 的子类\n* 创建一个新异常。\n\
  * 此程序需要 jdk1.6 或更高版本进行编译和执行。\n* ka.somasundaram@gmail.com\n*/\nimport java.io.Console;\n\
  \nclass NewExp extends Exception {\n    Console con = System.console();\n\n    NewExp(String\
  \ s) {\n        con.printf“Untamed exception is thrown out:%s%n”, s);\n    }\n\n\
  \    public static void main(String args[]) {\n        Console con = System.console();\n\
  \        NewExp ne = new NewExp“Lion”);\n        try {\n            throw ne;\n\
  \        } catch (Exception e) {\n            con.printf“I caught that exception\
  \ and tamed it : %s%n”, e);\n        }\n    }\n}\n```\n\n上述程序给出了图 11.10 所示的输出。\n\
  \n![](img/00135.jpeg)\n\n**图 11.10** 程序 11.9 的输出屏幕\n\n## 11.5 广播方法将抛出的异常\n\n当开发一个用于执行任务的方法时，它可能会产生各种类型的异常。生成的异常中，某些无法由方法本身处理的。因此，广播该方法将要抛出异常是非常重要的，这样该方法的调用者就可以适当地处理该异常。无法处理的\
  \ `Error` 类型异常以及程序员本可以避免的 `RuntimeException` 不应该被广播。只有 `Error` 或 `RuntimeException`\
  \ 以外的异常才能被广播。广播是通过使用 `throws` 关键字完成。广播是在声明方法时进行的。方法 `throws` 异常的广播通用形式为：\n\n```java\n\
  return-type methodname(parameter_list) throws Exception1, Exception2 {\n    method_body\n\
  }\n```\n\n例如，下面的方法广播了两个异常：\n\n```java\nstatic double readDouble() throws IOException,\
  \ ParseException {\n    String s = br.readLine();\n}\n```\n\n在上面的示例中，`readDouble()`\
  \ 方法宣布该方法可能会导致两个异常：`IOException` 和 `ParseException`。接下来的程序 11.10 演示了如何广播方法抛出的异常。\n\
  \n程序 11.10![](img/00134.jpeg)\n\n```java\n/*此程序演示了广播其\n方法将抛出一个异常。\n* 此程序需要 jdk1.6\
  \ 或更高版本。\n* ka.somasundaram@gmail.com\n*/\nimport java.io.Console;\n\nclass Cal\
  \ {\n    int x, y;\n\n    int Process(int a, int b) throws Exception {\n       \
  \ Console con = System.console();\n        x = a;\n        y = b;\n        con.printf“I\
  \ dont what to do these numbers %d and %d%n”, a, b);\n        throw new Exception“AVA”);\n\
  \        // return (a+b); 这条语句可以放在 throw 之后。\n        // 将导致编译错误\n    }\n}\n\nclass\
  \ Broadcast {\n    public static void main(String args[]) {\n        Cal cl = new\
  \ Cal();\n        Console con = System.console();\n        try {\n            cl.Process(10,\
  \ 25);\n        } catch (Exception e) {\n            con.printf“The thrown Exception\
  \ is: %s%n\\t is caught in main%n”, e);\n            con.printf“Sum of the two numbers\
  \ is %d%n”, (cl.x + cl.y));\n        }\n    }\n}\n```\n\n上述程序给出了图 11.11 所示的输出。\n\
  \n![](img/00136.jpeg)\n\n**图 11.11** 程序 11.10 的输出屏幕\n\n## 11.6 finally 块\n\n在 `try...catch`\
  \ 块中，如果没有发生异常，所有语句都将被执行。当发生异常时，放置在异常发生点到块结束之间的语句将被跳过，控制流将寻找匹配的 catch 块。在某些问题中，执行某些语句（如关闭文件）是关重要的，无论是否发生异常。这些重要的语句放置在\
  \ `finally` 块中。程序 11.11 演示了 `finally` 块的使用。\n\n程序 11.11![](img/00134.jpeg)\n\n```java\n\
  /*此程序演示了 finally 块\n* 此程序需要 jdk1.6 或更高版本\n* ka.somasundaram@gmail.com\n*/\nimport\
  \ java.io.Console;\n\nclass Finally {\n    public static void main(String args[])\
  \ {\n        int i, x, cons = 2;\n        Console con = System.console();\n    \
  \    for (i = 1; i < 4; i++) {\n            try {\n                x = 25 / cons;\n\
  \            } catch (ArithmeticException) {\n                con.printf“Divide\
  \ by zero error for %d%n”, i);\n            } finally {\n                con.printf“Exception\
  \ or no this will be printed%n”);\n            }\n        }\n    }\n}\n```\n\n上述程序给出了图\
  \ 11.12 所示的结果。\n\n![](img/00137.jpeg)\n\n**图 11.12** 程序 11.11 的输出\n\n无论是否发生异常，`finally`\
  \ 块中的语句都会执行。\n\n## 11.7 检查异常与非检查异常\n\nJava 开发者识别了一些必须在编译时就已知的异常。被列出的异常由编译器进行检查。这些异常被称为检查异常。未列出的异常在运行时被识别。这些异常被称为非检查异常。只有检查异常才能在\
  \ `throws` 子句中广播。表 11.1 给出了检查异常，表 11.2 给出了非检查异常。\n\n**表 11.1** 检查异常\n\n| 异常 | 产生\
