  \n\n\n在多线程中，同一组变量和内存空间由所有线程共享。当一个处理子任务（例如读取输入流）的线程必须等待字节的到达时，该线程将退出 CPU，而另一个线程（例如在屏幕上绘制图形）可能会进入\
  \ CPU 并继续其任务。因此，Java 线程提供了一种更优化地利用 CPU 时间的机制。多线程用于各种应用程序。线程机制由 Java 位于 `java.lang`\
  \ 包中的 `Thread` 类支持。\n\n## 14.2 创建线程\n\nJava 线程可以通过两种不同的方式创建。它们是：\n\n(i) 通过继承 `Thread`\
  \ 类\n\n(ii) 通过实现 `Runnable` 接口\n\n虽然两种方法都可以用于创建线程，但实现 `Runnable` 接口具有某些优势。在两种情况下，都需要实现包含线程执行代码的\
  \ `run()` 方法。\n\n### Thread 类\n\n`Thread` 类中定义的几个构造函数是：\n\n(i) `Thread (Runnable\
  \ target)`\n创建一个新的 `Thread` 对象，使用包含 `run()` 方法的 `target`。\n\n(ii) `Thread (String\
  \ name)`\n创建一个带有由 `name` 指定名称的新的 `Thread` 对象。\n\n(iii) `Thread (Runnable target,\
  \ String name)`\n创建一个新的 `Thread` 对象，使用包含 `run()` 方法的 `target`，并带有 `name` 指定的名称。\n\
  \n表 14.1 给出了 `Thread` 类中用于创建和执行线程的一些方法。\n\n**表 14.1 Thread 类中定义的一些方法**\n\n| 方法 |\
  \ 方法的用途 |\n| :--- | :--- |\n| 1. | `String getName()` | 返回调用者 Thread 对象的名称 |\n|\
  \ 2. | `boolean isAlive()` | 如果线程已启动尚未终止，则返回 true |\n| 3. | `void join()` | 等待线程终止\
  \ |\n| 4. | `void run()` | 包含要在线程中执行的语句 |\n| 5. | `void start()` | 通过调用 `run()`\
  \ 方法启动线程 |\n| 6. | `void sleep(long ms)` | 让当前正在执行的线程睡眠 `ms` 毫秒 |\n\n让我们看看如何从 `Thread`\
  \ 类创建线程。创建一个 `Thread` 类的子类。编写一个 `run()` 方法，并放置所有由线程执行的语句。为该类编写构造函数，并通过传递 `run()`\
  \ 方法作为参数创建 `Thread` 类的实例。这是通过使用 `this` 关键字完成的。可选地，可以通过将一个字符串作为 `Thread` 实例的第二个参数来为线程分配一个名称。通过调用\
  \ `Thread` 类的 `start()` 方法启动线程。程序 14.1 是这种方法创建线程的示例。该程序计算从 1 到 `n` 的自然数的和，其中 `n`\
  \ 从 1 变化到 5。\n\n程序 14.1![](img/00013.jpeg)\n\n```java\n/* 通过继承 Thread 类创建线程\n* 线程在构造函数中被创建并启动\n\
  * 此程序需要 jdk1.6 或更高版本\n* ka.somasundaram@gmail.com\n*/\nimport java.io.Console;\n\
  \nclass Sumthread extends Thread {\n    int i, sum = 1;\n    Thread th;\n    Console\
  \ con = System.console();\n\n    Sumthread() {\n        th = new Thread(this, “My\
  \ thread1”);\n        con.printf(“The thread created is :%s\\n”, th.getName());\n\
  \        th.start();\n    }\n\n    public void run() {\n        for (i = 1; i <=\
  \ 5; sum += ++i) {\n            con.printf(“Sum of numbers from 1 upto %d = %d \\\
  n”, i, sum);\n        }\n    }\n}\n\nclass Threadcreate1 {\n    public static void\
  \ main(String args[]) {\n        new Sumthread();\n    }\n}\n```\n\n上述程序输出了图 14.3\
  \ 所示的输出。\n\n![](img/00157.jpeg)\n\n**图 14.3 程序 14.1 的输出屏幕**\n\n在上述程序 14.1 中，`run()`\
  \ 方法由自身的类对象执行。`run()` 方法没有被直接调用。当调用 `start()` 方法时，`run()` 方法会被自动调用。`run()` 方法也可能由其他\
  \ `Thread` 对象执行。程序 14.2 显示了如何由定义 `run()` 方法之外的其他对象来执行 `run()` 方法。程序 14.2 处理的问题与程序\
  \ 14.1 相同。\n\n程序 14.2![](img/00013.jpeg)\n\n```java\n/* 通过继承 Thread 类创建线程\n* 线程在一个类中被创建并在另一个类中启动\n\
