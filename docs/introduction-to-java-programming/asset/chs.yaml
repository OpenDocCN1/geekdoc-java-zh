  \ false |\n| 2. | `equals(Boolean b)` | 如果调用对象与 `b` 相等，则返回 true，否则返回 false |\n|\
  \ 3. | `static Boolean valueOf(String s)` | 如果字符串 `s` 包含 true，则返回 true 实例 |\n\n\
