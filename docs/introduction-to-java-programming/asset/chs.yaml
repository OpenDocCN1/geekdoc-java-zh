  \ 窗口。\n\n## 16.1 绘制线条\n\n使用以下方法绘制线条：\n\n```java\npublic void drawLine(int x1, int\
  \ y1, int x2, int y2)\n```\n\n`drawLine` 用当前颜色从点 (x1, y1) 绘制到 (x2, y2) 的一条直线。\n\n\
  随后的的程序 16.1 显示了 `drawLine()` 方法：\n\n程序 16.1![](img/00013.jpeg)\n\n```java\n/*\n\
  <applet code = Line width = 250 height =300 >\n</applet>\nka.somasundaram@gmail.com\
  \ */\nimport java.applet.Applet;\nimport java.awt.Graphics;\n\npublic class Line\
  \ extends Applet {\n    public void paint(Graphics gp) {\n        int x1 = 10, y1\
  \ = 250;\n        int x2 = 200, y2 = 10;\n        gp.drawLine(x1, y1, x2, y2);\n\
  \        gp.drawString(\"Line\", 20, 270);\n    }\n}\n```\n\n上述程序给出以下输出：\n\n![](img/00176.jpeg)\n\
  \n**图 16.1** 程序 16.1 的输出屏幕\n\n### 16.2 绘制矩形\n\n指定矩形的参数如图 16.2 所示。\n\n![](img/00177.jpeg)\n\
  \n**图 16.2** 指定矩形的参数\n\n可以使用以下方法绘制不同样式的矩形：\n\n```java\npublic void drawRect(int\
  \ x, int y, int width, int height)\n```\n`drawRect` 用当前颜色绘制一个左左上角位于 (x, y)，宽度和高度为指定的矩形。\n\
  \n```java\npublic void drawRoundRect(int x, int y, int width, int height, int arcw,\
  \ int arch)\n```\n`drawRoundRect` 用当前颜色绘制一个左上角位于 (x, y)，宽度和高度为指定的圆角矩形；`arcw` 是四个角处圆弧的水平直径，`arch`\
  \ 是圆弧的垂直直径。\n\n```java\npublic void draw3DRect(int x, int y, int width, int height,\
  \ boolean raised)\n```\n`draw3DRect` 用当前颜色绘制一个左上角位于 (x,y)，宽度和高度为指定的 3D 矩形；如果 `raised`\
  \ 为 true，则矩形看起来凸于表面，否则它会凹于表面。\n\n```java\npublic void fillRect(int x, int y, int\
  \ width, int height)\n```\n`fillRect` 绘制一个填充的矩形。\n\n```java\npublic void fillRoundRect(int\
  \ x, int y, int width, int height, int arcw, int arch)\n```\n`fillRoundRect` 绘制一个填充的圆角矩形。\n\
  \n```java\npublic void fill3DRect(int x, int y, int width, int height, boolean raised)\n\
  ```\n`fill3DRect` 绘制一个填充的 3D 矩形。\n\n随后的程序 16.2 显示了各种矩形绘制方法的使用：\n\n程序 16.2![](img/00013.jpeg)\n\
