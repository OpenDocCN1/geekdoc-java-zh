  \n**图 14.4 程序 14.2 的输出屏幕**\n\n现在，让我们看看创建线程的第二种方法：实现 `Runnable` 接口。实现 `Runnable`\
  \ 的一个优势是可以在父类的子类中创建线程。程序 14.3 显示了通过实现 `Runnable` 创建线程。\n\n程序 14.3![](img/00013.jpeg)\n\
  \n```java\n/* 实现 Runnable 接口创建线程\n* 线程在构造函数中被创建并启动\n* 此程序需要 jdk1.6 或更高版本\n* ka.somasundaram@gmail.com\n\
  */\nimport java.io.Console;\n\nclass Sumthread implements Runnable {\n    int i,\
  \ sum = 0;\n    Thread th;\n    Console con = System.console();\n\n    Sumthread()\
  \ {\n        th = new Thread(this, “My thread3”);\n        con.printf(“The thread\
  \ created is :%s\\n”, th.getName());\n        th.start();\n    }\n\n    public void\
  \ run() {\n        for (i = 1; i <= 5; sum += ++i) {\n            con.printf(“Sum\
  \ of numbers from 1 upto %d = %d \\n”, i, sum);\n        }\n    }\n}\n\nclass Threadcreate3\
  \ {\n    public static void main(String args[]) {\n        new Sumthread();\n  \
  \  }\n}\n```\n\n上述程序输出了图 14.5 所示的输出。\n\n![](img/00159.jpeg)\n\n**图 14.5 程序 14.3\
  \ 的输出屏幕**\n\n在上述程序 14.3 中，`run()` 方法由自身的类对象执行。`run()` 方法没有被直接调用。当调用 `start()` 方法时，`run()`\
  \ 方法会被自动调用。`run()` 方法也可能由其他 `Thread` 对象执行。程序 14.4 显示了如何由定义 `run()` 方法之外的其他对象来执行\
  \ `run()` 方法。\n\n程序 14.4![](img/00013.jpeg)\n\n```java\n/* 实现 Runnable 接口创建线程\n\
  * 线程在一个类中被创建并在另一个类中启动\n* 此程序需要 jdk1.6 或更高版本\n* ka.somasundaram@gmail.com */\nimport\
  \ java.io.Console;\n\nclass Sumthread implements Runnable {\n    int i, sum = 0;\n\
  \    Console con = System.console();\n\n    public void run() {\n        for (i\
  \ = 1; i <= 5; sum += ++i) {\n            con.printfhardt Sum of numbers from 1\
  \ upto %d = %d \\n”, i, sum);\n        }\n    }\n}\n\nclass Threadcreate4 {\n  \
  \  public static void main(String args[]) {\n        Console con = System.console();\n\
  \        Sumthread st = new Sumthread();\n        Thread th = new Thread(st, “My\
  \ thread4”);\n        con.printf(“The thread created is :%s\\n”, th.getName());\n\
  \        con.printf(“Before starting the thread\\n Is the thread alive? :%b\\n”,\
  \ th.isAlive());\n        th.start();\n        con.printf(“After starting the thread\\\
  n Is the thread alive? :%b\\n”, th.isAlive());\n    }\n}\n```\n\n\n\n当线程被创建时，它在完成任务并死亡之前会经历不同的状态。这些不同的状态为：\n\
  \n* `new`（新建）\n* `runnable`（就绪）\n* `running`（运行）\n* `blocked`（阻塞）\n* `dead`（死亡）\n\
  \n### 新建线程\n当线程被创建时，它处于新建状态。在此状态下，线程不会被执行。\n\n### 就绪线程\n当在线程对象上调用 `start()` 方法时，线程处于就绪状态。就绪线程并不一定会被\
  \ CPU 执行。就绪线程会加入准备好执行的线程集合中。哪一个就绪线程占用 CPU 是由底层操作系统决定的。\n\n### 运行线程\n当前正在被 CPU 执行的线程处于运行状态。\n\
  \n### 阻塞线程\n运行中的线程可能由于以下任一条件而进入阻塞状态。\n\n* 线程调用了 `wait` 方法\n* 线程执行了 I/O 操作\n* 线程调用了\
  \ `sleep` 方法\n\n图 14.6 显示了线程的不同状态。\n\n![](img/00160.jpeg)\n\n**Fig 14.6** 线程的不同状态\n\
  \n当阻塞线程被解除阻塞时，它会进入就绪状态而不是运行状态。在就绪线程中，优先级较高（由程序员设置）的线程将进入运行状态。这种调度是由操作系统完成的。\n\n\
  ![](img/00011.jpeg)当阻塞线程被解除阻塞时，它会进入就绪状态而不是运行状态。\n\n### 死亡线程\n线程在两种情况下变为死亡。在第一种情况下，线程完成了任务，退出运行状态并变为死亡。在另一种情况下，由于异常的发生，`run`\
  \ 方法被终止，线程变为死亡。\n\n## 14.4 多线程编程\n在早期的示例中，我们已经看到了只有一个线程的程序。现在，我们将看到如何编写一个多线程程序。当程序启动时，会自动创建一个线程。它被称为主线程。可以使用\
  \ `Thread` 类的 `currentThread()` 方法访问主线程。程序 14.5 阐述了两个子线程的创建，一个计算自然数的和，另一个计算数字的阶乘。\n\
  \n程序 14.5![](img/00013.jpeg)\n\n```java\n/* 此程序创建两个线程\n* 此程序需要 jdk.6 或更高版本。\n* ka.somasundaram@gmail.com\n\
  */\n\nimport java.io.Console;\n\nclass Sumthread implements Runnable {\n    int\
  \ i, sum = 0;\n    Console con = System.console();\n    public void run() {\n  \
  \      for (i = 1; i <= 5; i++) {\n            sum += i;\n            con.printf(“Sum\
  \ of numbers from 1 upto %d = %d%n”, i, sum);\n        }\n    }\n}\n\nclass Factthread\
  \ implements Runnable {\n    int i, n, fact = 1;\n    Console con = System.console();\n\
  \    public void run() {\n        for (i = 1; i <= 5; i++) {\n            fact *=\
  \ i;\n            con.printf(“Factorial of %d = %d%n”, i, fact);\n        }\n  \
  \  }\n}\n\nclass Twothread {\n    public static void main(String args[]) {\n   \
  \     Thread ct = Thread.currentThread();\n        Console con = System.console();\n\
  \        con.printf(“The main thread is: %s%n”, ct.getName());\n        Sumthread\
  \ st = new Sumthread();\n        Factthread ft = new Factthread();\n        Thread\
  \ sumt = new Thread(st, “Sum thread”);\n        Thread factt = new Thread(ft, “Factorial\
  \ thread”);\n        sumt.start();\n        factt.start();\n        con.printf(“\
  \ The thread created is : %s%n”, sumt.getName());\n        con.printf(“ The thread\
  \ created is : %s%n”, factt.getName());\n    }\n}\n```\n\n上述程序给出了图 14.7 所示的输出。\n\
  \n![](img/00161.jpeg)\n\n**Fig 14.7** 程序 14.5 两次执行的输出屏幕\n\n当你反复运行上述程序 14.5 时，你可能会得到交错的结果或以不同的顺序的结果。这是因为在创建线程时，每个线程都被分配了一个默认优先级。由于求和线程和阶乘线程的优先级相同，CPU\
  \ 时间被平均地分配给每个线程。因此，结果可能是交错的。\n\n## 14.5 线程优先级\n可以为线程分配优先级。操作系统使用优先级来确定应该给哪个就绪线程分配\
  \ CPU 时间。优先级由从 1 到 10 的数字给出。优先级数字高的线程将比优先级数字低的线程获得优先。可以使用以下方法设置线程的优先级：\n\n`setPriority(intpri-numb)`\n\
  \n有三个预定义的优先级：`MIN_PRIORITY` 的值为 1，`NORM_PRIORITY` 的值为 5，`MAX_PRIORITY` 的值为 10。当线程被创建时，会赋予一个默认优先级\
  \ `NORM_PRIORITY`。要获取线程的优先级，可以使用 `int getPriority()` 方法。当两个线程的优先级相同时，底层操作系统决定给哪个线程\
  \ CPU。线程到运行状态的调度取决于操作系统。线程的调度取决于操作系统。程序 14.6 显示了线程的创建和优先级分配。程序 14.6\n\n```java\n\
  /* 此程序为创建的线程设置优先级\n* 此程序需要 jdk.6 或更高版本。\n* ka.somasundaram@gmail.com */\n\nimport\
  \ java.io.Console;\n\nclass Sumthread implements Runnable {\n    int i, sum = 0;\n\
  \    Console con = System.console();\n    public void run() {\n        for (i =\
  \ 1; i <= 5; i++) {\n            sum += i;\n            con.printf(“Sum of numbers\
  \ from 1 upto %d = %d%n”, i, sum);\n        }\n    }\n}\n\nclass Factthread implements\
  \ Runnable {\n    int i, n, fact = 1;\n    Console con = System.console();\n   \
  \ public void run() {\n        for (i = 1; i <= 5; i++) {\n            fact *= i;\n\
  \            con.printf(“Factorial of %d = %d%n”, i, fact);\n        }\n    }\n\
  }\n\nclass Thread {\n    public static void main(String args[]) {\n        Thread\
  \ ct = Thread.currentThread();\n        Console con = System.console();\n      \
  \  con.printf(“The main thread is: %s%n”, ct.getName());\n        Sumthread st =\
  \ new Sumthread();\n        Factthread ft = new Factthread();\n        Thread sumt\
  \ = new Thread(st, “Sum thread”);\n        Thread factt = new Thread(ft, “Factorial\
  \ thread”);\n        sumt.setPriority(Thread.MIN_PRIORITY);\n        factt.setPriority(Thread.MAX_PRIORITY);\n\
  \        String smnam = sumt.getName();\n        String ftnam = factt.getName();\n\
  \        con.printf(“ The thread created is : %s%n”, smnam);\n        con.printf(“\
  \ The thread created is : %s%n”, ftnam);\n        int smpri = sumt.getPriority();\n\
  \        int ftpri = factt.getPriority();\n        con.printf(“ The priority of\
  \ %s = %d%n”, smnam, smpri);\n        con.printf(“ The priority of %s = %d%n”, ftnam,\
  \ ftpri);\n        factt.start();\n        sumt.start();\n    }\n}\n```\n\n上述程序给出了图\
  \ 14.8 所示的输出。\n\n![](img/00162.jpeg)\n\n**Fig 14.8** 程序 14.6 的输出屏幕\n\n在上述程序 14.6\
  \ 中，阶线程线程执行，因为它被分配了比求和线程更高的优先级。无论执行多少次，你都会得到相同顺序的结果。这与程序 14.5 的结果不同。\n\n## 14.6\
  \ 等待线程 - join() 方法\n在某些问题中，可能需要在另一个线程继续之前等待特定线程完成任务。在这种情况下可以使用 `Thread` 类的 `join()`\
  \ 方法。当在线程对象上调用 `join()` 方法时，控制将等待线程完成任务并变为死亡线程。然后控制继续执行执行流程。在程序 14.7 中，创建了两个线程。启动一个线程并对其调用\
  \ `join()` 方法。在线程完成任务之前，控制在该处等待。一旦相应的线程进入死亡状态，控制就会继续其他语句的执行。\n\n程序 14.7![](img/00013.jpeg)\n\
  \n```java\n/* 此程序为创建的线程设置优先级\n* 通过调用 join() 方法对线程进行间接等待\n* 只有在当前线程终止后另一个进程才会开始。\n\
  * 此程序需要 jdk.6 或更高版本。\n* ka.somasundaram@gmail.com\n*/\n\nimport java.io.Console;\n\
  \nclass Sumthread implements Runnable {\n    int i, sum = 0;\n    Console con =\
  \ System.console();\n    public void run() {\n        for (i = 1; i <= 5; i++) {\n\
  \            sum += i;\n            con.printf(“Sum of numbers from 1 upto %d =\
  \ %d%n”, i, sum);\n        }\n    }\n}\n\nclass Factthread implements Runnable {\n\
  \    int i, n, fact = 1;\n    Console con = System.console();\n    public void run()\
  \ {\n        for (i = 1; i <= 5; i++) {\n            fact *= i;\n            con.printf(“Factorial\
  \ of %d = %d%n”, i, fact);\n        }\n    }\n}\n\nclass Thread {\n    public static\
  \ void main(String args[]) {\n        Thread ct = Thread.currentThread();\n    \
  \    Console con = System.console();\n        Sumthread st = new Sumthread();\n\
  \        Factthread ft = new Factthread();\n        Thread sumt = new Thread(st,\
  \ “Sum thread”);\n        Thread factt = new Thread(ft, “Factorial thread”);\n \
  \       sumt.start();\n        sumt.join();\n        factt.start();\n    }\n}\n\
  ```\n\n\n\n\n```java\nclass Factthread implements Runnable {\n    int i, n, fact\
  \ = 1;\n    Console con = System.console();\n\n    public void run() {\n       \
  \ for (i = 1; i <= 5; i++) {\n            fact *= i;\n            con.printf(\"\
  Factorial of %d = %d\\n\", i, fact);\n        }\n    }\n}\n\nclass Threadjoin {\n\
  \    public static void main(String args[]) {\n        Sumthread st = new Sumthread();\n\
  \        Console con = System.console();\n        Factthread ft = new Factthread();\n\
  \        Thread sumt = new Thread(st, \"Sum thread\");\n        Thread factt = new\
  \ Thread(ft, \"Factorial thread\");\n        sumt.setPriority(Thread.NORM_PRIORITY\
  \ - 2);\n        factt.setPriority(Thread.NORM_PRIORITY + 2);\n        String smnam\
  \ = sumt.getName();\n        String ftnam = factt.getName();\n        int ftpri\
  \ = factt.getPriority();\n        int smpri = sumt.getPriority();\n        con.printf(\"\
  The priority value of %s = %d\\n\", smnam, smpri);\n        con.printf(\"The priority\
  \ value of %s = %d\\n\", ftnam, ftpri);\n        sumt.start();\n        con.printf(\"\
  The thread created is : %s\\n\", smnam);\n        try {\n            sumt.join();\n\
  \        } catch (InterruptedException e) {\n        }\n        factt.start();\n\
  \        con.printf(\"The thread created is : %s\\n\", ftnam);\n    }\n}\n```\n\n\
