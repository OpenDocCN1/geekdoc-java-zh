  \ 的输出屏幕\n\n## 7.8 方法重载\n\n一个类可以包含任意数量的方法。方法可以接受参数作为输入进行数据处理。这些参数被称为类型签名。Java 允许许多方法具有相同的名称但不同的类型签名。这种名称相同但类型签名不同的方法被称为方法重载。\n\
  \n![](img/00011.jpeg)类中名称相同但类型签名不同的方法被称为重载方法。重载方法体现了多态的概念。\n\n以下程序 7.11 说明了方法重载的用法。该程序包含一个具有两个同名\
  \ `Area` 但类型签名不同的方法的类。当给出两个参数时，一个方法计算矩形的面积，而对于单个参数，另一个方法计算正方形的面积。\n\n程序 7.11![](img/00013.jpeg)\n\
  \n```java\n/* 此程序演示了方法重载。\n* 此程序需要 jdk1.6 或更高版本进行编译和执行。\n* ka.somasundaram@gmail.com\n\
  */\nimport java.io.Console;\n\nclass Rectangle {\n    double lenth, breadth;\n\n\
  \    double Area(double l, double b) {\n        lenth = l;\n        breadth = b;\n\
  \        return lenth * breadth;\n    }\n\n    double Area(double a) { //重载方法\n\
  \        lenth = breadth = a;\n        return lenth * breadth;\n    }\n}\n\nclass\
  \ Overload {\n    public static void main(String args[]) {\n        double len,\
  \ br, area;\n        String slen, sbr;\n        Console con = System.console();\n\
  \        Rectangle rec = new Rectangle();\n    }\n}\n```\n\n\n\n` 标签中并不完整（在代码块处截断了），且包含了大量重复的逻辑描述。根据你提供的要求和示例，我为你对给出的文本部分进行了专业的翻译：\n\
