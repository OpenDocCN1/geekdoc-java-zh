  \ extends Applet {\n    public void paint(Graphics gp) {\n        int x[]={60,10,10,60,110,160,210};\n\
  \        int y[]={10,60,160,210,160,60,10};\n        int n = 7;\n        gp.drawPolyline(x,\
  \ y, n);\n        gp.drawString(“Polyline”, 90, 210);\n        showStatus(“Applet\
  \ with Polylines”);\n    }\n}\n```\n\n上述程序给如下输出：\n\n![](img/0183.jpeg)\n\n**图 16.9**\
  \ 程序 16.7 的输出屏幕\n\n`drawPolygon()` 方法总是绘制闭合的多边形，而 `drawPolyline()` 方法绘制开放的多边形。\n\
