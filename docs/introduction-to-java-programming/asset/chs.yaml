  \ ={110,90,90,110,130,150,150,130,110};\n        int fy[] ={250,270,290,310,310,290,270,250,250};\n\
  \        int n = 12;\n        int fn = 9;\n        gp.drawPolygon(x, y, n);\n  \
  \      gp.drawString(“Polygon”, 90, 210);\n        gp.fillPolygon(fx, fy, fn);\n\
