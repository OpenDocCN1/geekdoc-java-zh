  \ 程序 16.6 的输出屏幕\n\n## 16.6 绘制折线\n\n`drawPolygon()` 方法总是绘制一个闭合的多边形。没有方法可以绘制开放的多边形。这通过\
  \ `drawPolyline()` 方法实现。该方法绘制一系列连接的线。用于绘制此类折线的方法是：\n\n```java\npublic void drawPolyline(int\
  \ xPoints[], int yPoints[], int nPoints)\n```\n\n绘制由数组 `xPoints` 和 `yPoints` 指定的连接线序列；每对\
  \ `(x,y)` 给一个点。折线的点数为 `nPoints`。\n\n程序 16.7 显示了 `drawPolyline()` 方法的使用。\n\n程序 16.7![](img/00013.jpeg)\n\
  \n```java\n/*\n<applet code = Polyline width =250 height =250 >\n</applet>\nka.somasundaram@gmail.com\n\
