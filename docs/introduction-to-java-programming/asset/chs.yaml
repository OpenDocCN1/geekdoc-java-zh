  **图 5.16** 程序 5.9 的输出屏幕\n\n`for` 循环可以相互嵌套，如下：\n\n```java\nfor (i=1; i<n; i++) //\
  \ 外层循环开始\n{\n    for (k=1; k<m; k++) // 内层循环开始\n    {\n        // ...\n    } //\
  \ 内层循环结束\n} // 外层循环结束\n```\n\n下面的程序 5.10 展示了嵌套的 `for` 循环。它生成了 2、3 和 4 的乘法表。\n\n\
  ### 程序 5.10![](img/00013.jpeg)\n\n```java\n/* 此程序演示了嵌套的 for 循环\n* 此程序需要 jdk1.6 或更高版本。\n\
  * ka.somasundaram@gmail.com\n*/\nimport java.io.Console;\n\nclass MulTable {\n \
  \   public static void main(String args[]) {\n        Console con = System.console();\n\
  \        int i, j, m = 4, n = 5;\n        int prod;\n        for (i = 2; i <= m;\
  \ ++i) {\n            con.printf(“Multiplication Table for %d%n”, i);\n        \
  \    for (j = 1; j <= n; ++j) {\n                prod = j * i;\n               \
  \ con.printf(“ %d X %d = %d%n”, j, i, prod);\n            }\n            con.printf(“%n\
  \ “); // 创建空行\n        }\n    }\n}\n```\n\n上面的程序 5.10 出了图 5.17 所示的输出。\n\n![](img/00045.jpeg)\n\
  **图 5.17** 程序 5.10 的输出屏幕\n\n## 5.6 break 语句\n\n`break` 语句仅用于循环和 `switch` 语句。当执行此语句时，控制权将跳出循环。该循环将终止。break\
  \ 语句的流程图见图 5.18。\n\n下面的程序 5.11 展示了在 for 循环中使用 `break`：\n\n![](img/00046.jpeg)\n\
  **图 5.18** break 语句的流程图\n\n### 程序 5.11![](img/00013.jpeg)\n\n```java\n/* 此程序演示了\
  \ break 语句的使用\n* 此程序需要 jdk1.6 或更高版本。\n* ka.somasundaram@gmail.com */\nimport java.io.Console;\n\
  \nclass BreakDemo {\n    public static void main(String args[]) {\n        Console\
  \ con = System.console();\n        int n = 5, m = 20;\n        for (int i = 1; i\
  \ <= m; i++) {\n            if (n * i > 30) {\n                con.printf(“%n 退出循环”);\n\
  \                break;\n            }\n            con.printf(“ %d X %d = %d%n”,\
  \ i, n, n * i);\n        }\n    }\n}\n```\n\n上面的程序 5.11 出了图 5.19 所示的输出。\n\n![](img/00047.jpeg)\n\
  **图 5.19** 程序 5.11 的输出屏幕\n\n块可以被标记，并且 `break` 控制可以用来退出任何已标记的块。这被称为标签 break（labeled\
  \ break）。块的标签可以使用形成变量的规则形成。在使用嵌套循环时，标签 break 非常有用。下面的程序 5.12 展示了标签 break 语句：\n\n\
  ### 程序 5.12![](img/00013.jpeg)\n\n```java\n/* 此程序演示了标签 break 语句的使用\n* 此程序需要 jdk1.6\
  \ 或更高版本进行编译和执行\n* ka.somasundaram@gmail.com\n*/\nimport java.io.Console;\n\nclass\
  \ LabelBreak {\n    public static void main(String args[]) {\n        Console con\
  \ = System.console();\n        int n = 0, m = 0;\n        loop1:\n        while\
  \ (true) {\n            n++;\n            m = 0;\n            con.printf(“%n loop1\
  \ n = %d%n”, n);\n            loop2:\n            while (m <= n) {\n           \
  \     if (n * m > 10) {\n                    con.printf(“%n 退出 loop2 和 loop1”);\n\
  \                    break loop1;\n                }\n                con.printf(“\
  \ loop2 %d X %d = %d%n”, m, n, n * m);\n            }\n        }\n        con.printf(“%n\
  \ loop1”);\n    }\n}\n```\n\n上面的程序 5.12 出了图 20。\n\n![](img/00048.jpeg)\n**图 20**\n\
  \n## 5.7 continue 语句\n\n`continue` 语句用于循环块内部。当执行 `continue` 语句时，控制将跳过循环的剩余部分并回到循环开始。continue\
  \ 语句的流程图见图 5.21。\n\n下面的程序 5.13 展示了 `continue` 的使用：\n\n![](img/00049.jpeg)\n**图 5.21**\
  \ continue 语句的流程图\n\n### 程序 13![](img/00013.jpeg)\n\n```java\n/* 此程序演示了 continue\
  \ 语句的使用\n* 此程序需要 jdk1.6 或更高版本进行编译和执行\n* ka.omasundaram@gmail.com\n*/\nimport java.io.Console;\n\
  \nclass ContinueProg {\n    public static void main(String args[]) {\n        Console\
  \ con = System.console();\n        int i = 0;\n        while (++i < 10) {\n    \
  \        if (i % 2 == 0) {\n                continue;\n            }\n         \
  \   con.printf(“ %d\\n”, i);\n        }\n    }\n}\n```\n\n上面的程序 5.13 出了图 22 所示的输出。\n\
  \n![](img/00050.jpeg)\n**图 22** 程序 13 的输出屏幕\n\n同样可以使用标签 continue 结构。下面的程序 5.14 展示了标签\
  \ continue：\n\n### 程序 14![](img/00013.jpeg)\n\n```java\n/* 此程序演示了标签 continue 语句\n\
  * 此程序找到 1 到给定数字之间的所有质数\n* 此程序需要 jdk1.6 或更高版本进行编译和执行\n* ka.omasundaram@gmail.com\n\
  */\nimport java.io.Console;\n\nclass LabelContinue {\n    public static void main(String\
  \ args[]) {\n        Console con = System.console();\n        int i = 1, n, max;\n\
  \        String smax;\n        con.printf(“%n 输入数字到:”);\n        smax = con.readLine();\n\
  \        max = Integer.parseInt(smax);\n        con.printf(“%n 1 到 %d 之间的质数%n”,\
  \ max);\n        con.printf(“ %d\\n”, i);\n        start:\n        for (n = 2; n\
  \ <= max; ++n) {\n            test:\n            for (i = 2; i < n; ++i) {\n   \
  \             if (n % i == 0) {\n                    continue start;\n         \
  \       }\n            }\n            con.printf(“ %d\\n”, n);\n        }\n    }\n\
  }\n```\n\n上面的程序 5.14 出了图 23 所示的输出。\n\n![](img/00051.jpeg)\n**图 23** 程序 14 的输出屏幕\n\
  \n## 5.8 逗号语句\n\nJava 允许在 `for` 语句中使用多个初始化和迭代。通过这种功能，可以初始化多个变量并进行多次迭代。此类语句之间用逗号()分隔。但只有一个条件表达式。多个初始化和迭代的通用形式为：\n\
  \n`for (init1, init2, init3; condition; itr1, itr2, itr3)`\n{ 语句; }`\n\n下面的程序 5.15\
  \ 展示了逗号语句的使用。\n\n### 程序 5.15![](img/00013.jpeg)\n\n```java\n/* 此程序演示了逗号语句的使用\n*\
  \ 此程序需要 jdk1.6 或更高版本进行编译和执行\n* ka.somasundaram@gmail.com\n*/\nimport java.io.Console;\n\
  \nclass CommaDemo {\n    public static void main(String args[]) {\n        Console\
  \ con = System.console();\n        int n, i, sum;\n        for (i = 1, n = 5; n\
  \ > 0; i++, n--, sum = 0) {\n            sum = i + n;\n            con.printf(“%d\
  \ + %d = %d%n”, i, n, sum);\n        }\n    }\n}\n```\n\n上面的程序 5.15 的输出见图 24。\n\n\
