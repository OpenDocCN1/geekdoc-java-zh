  在本章中，你将学习输入/输出处理过程。Java 将所有数据视为字节流或字符流。Java 提供了许多类来处理磁盘文件、内存以及与源/目的无关的进程。本章将解释其中少数类。\n\
  \n### 12.1 I/O 流\nJava 的输入/输出（I/O）操作非常复杂，难以理解，但更加灵活和强大。Java 开发者关注了非键盘面向的数据处理。他们希望执行平台无关的\
  \ I/O 操作，因此具有了复杂性。Java 中所有的 I/O 操作都是基于流的。所有数据都被视为字节流或字符流。流从文件、内存、显示器、键盘和网络套字开始或结束。从何处读取数据称为输入流。将数据写入何处称为输出流。由于\
  \ Java 的双字节 Unicode 字符与传统的单字节字符不同，Java 有两种类型的流：字节流和字符流。字符流处理 Unicode 字符。每个流都有自己的输入流类和输出流类。在本章中解释少数字节流类。字节流的\
  \ I/O 操作由两个抽象类 `InputStream` 和 `OutputStream` 处理。同样，字符流有 `Reader` 和 `Writer` 抽象类。与\
  \ I/O 类位于 `java.io` 包中，在使用 I/O 类的程序中需要导入它们。\n\n所有的流（`InputStream`、`OutputStream`、`Writer`\
  \ 和 `Reader`）在创建它们的对象时会自动打开。\n\n![](img/00011.jpeg)Java 中使用的数据通过两种流处理：字节流和字符流。\n\
  \n本章涉及的少数类是：\n* `File`\n* `FileInputStream`\n* `FileOutputStream`\n* `DataInputStream`\n\
  * `DataOutputStream`\n\n### 12.2 FILE 类\n`File` 类仅用于获取文件的详细信息。它不能用于向文件读取或写入字节。它有助于在处理文件之前对其研究。`File`\
  \ 类具有以下构造函数：\n\n(i) `File(String dirpath)`\n(ii) `File(String dirpath, String filename)`\n\
  (iii) `File(File object, String filename)`\n\n其中，`dirpath` 是目录路径，`filename` 是文件名，`object`\
  \ 是 `File` 类型对象。\n\n`File` 类中定义的一些方法如表 12.1 所示。\n\n**表 12.1** File 类定义的一些方法\n\n\
