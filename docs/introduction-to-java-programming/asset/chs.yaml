  \ `Sum` 线程调用 `join` 方法时，控制权会等待直到 `Sum` 线程完成其任务。之后启动 `Factorial` 线程。\n\n### 14.7\
  \ 控制线程\n\n多线程的目标是处理相互独立的子任务，并优化地利用 CPU 时间。在多线程程序中，如果给某个特定线程分配了较高的优先级，且它需要更长时间来完成任务，那么其他可运行的线程必须继续等待。如果允许一个线程消耗大部分\
  \ CPU 时间让其他线程等待，将无法获得任何益处。应该为程序中的每个线程提供公平的机会。在任何多线程程序中，某些线程在执行操作过程中（例如执行 I/O 操作）可能会从运行状态变为阻塞状态，从而为其他线程进入运行状态创造机会。在没有此类自然事件的情况下，程序员必须找到方法让\
  \ CPU 饥饿型线程让路，以便其他线程进入 CPU。Java 有两种方法可以将线程的运行状态改为阻塞状态。这些方法在表 14.2 中。\n\n**表 14.2**\
  \ 控制线程的方法\n\n| 方法 | 方法的目的 |\n| :--- | :--- |\n| 1. | `static void sleep(long ms)`\
  \ | 使线程睡眠 ms 毫秒 |\n| 2. | `static void yield()` | 导致运行线程让出其他可运行线程 |\n\n`sleep` 方法使线程在指定的时间内睡眠（空闲）。一旦线程调用了\
  \ `sleep` 方法，它就会从运行状态变为阻塞状态。它将保持阻塞直到指定的时间到达，然后唤醒并进入可运行状态。这是让线程让路以便其他可运行线程进入运行状态的一种方法。程序\
  \ 14.8 显示了 `sleep` 方法的使用。在此程序中，除了主线程外还创建了两个子线程 `Sum` 线程和 `Factorial` 线程。每个子线程在两次或三次计算后睡眠\
  \ 200 毫秒。\n\n程序 14.8![](img/00013.jpeg)\n\n```java\n/* 此程序演示了 sleep() 方法的使用。\n*\
  \ 此程序需要 jdk1.6 或更高版本。\n* ka.somasundaram@gmail.com */\n\nimport java.io.Console;\n\
  \nclass Sumthread implements Runnable {\n    int i, sum = 0;\n    Console con =\
  \ System.console();\n\n    public void run() {\n        for (i = 1; i <= 5; i++)\
  \ {\n            sum += i;\n            try {\n                if (i % 2 == 0) {\n\
  \                    Thread.sleep(200);\n                }\n            } catch\
  \ (InterruptedException e) {\n            }\n            con.printf(\"Sum of numbers\
  \ from 1 upto %d = %d\\n\", i, sum);\n        }\n    }\n}\n\nclass Factthread implements\
  \ Runnable {\n    int i, n, fact = 1;\n    Console con = System.console();\n\n \
  \   public void run() {\n        for (i = 1; i <= 5; i++) {\n            fact *=\
  \ i;\n            try {\n                if (i % 3 == 0) {\n                   \
  \ Thread.sleep(200);\n                }\n            } catch (InterruptedException\
  \ e) {\n            }\n            con.printf(\"Factorial of %d = %d\\n\", i, fact);\n\
  \        }\n    }\n}\n\nclass Threadsleep {\n    public static void main(String\
  \ args[]) {\n        // ... (此处代码在原文中截断，已翻译对应部分)\n    }\n}\n```\n\n上述程序输出了图 14.9\
  \ 所示的输出。\n\n![](img/00164.jpeg)\n\n\n\n\n在上述程序中，创建了 `main`、`Sum` 和 `Factorial` 三个线程。这三个线程的优先级均为\
  \ 5。与之前的程序 14.8 一，当处理的数字为偶数时，`Sum` 线程会被让出（yield），当处理的数字能被 3 整除时，`Factorial` 线程会被让出。得到的结果与之前相同。需要注意的是，当程序重复多次时，输出的顺序可能与上面所示不同。这是因为线程调度是由底层操作系统完成的。因此，对于不同的操作系统，输出的交错顺序可能会不同。\n\
