  \ 小程序基础知识（APPLET BASICS）\n\n小程序（Applets）是 Java 支持的第二种程序。它们可以从远程机器下载并在本地机器运行。它们不受本地操作系统控制。它们无法访问本地资源。它们被分成小的字节码并跨网络传输。这些字节码在接收机器上由\
  \ 虚拟机（JVM）重新组装。它们不能直接执行。小程序可以是 HTML 页面的元素。因此，它们只能通过执行 HTML 页面来运行。为了测试，HTML 页面中的\
  \ `applet` 元素可以通过 JDK 提供的 `appletviewer` 执行。小程序用于客户端编程。\n\n小程序不使用 `main()` 方法和 `System.out.println()`\
  \ 方法。它们仅使用图形方法输出。它们生成窗口输出。因此，它们需要图形支持。为了绘制图形输出，它们使用了 Java 的抽象窗口工具（AWT）。小程序定义在 `Applet`\
  \ 类中。因此，编写小程序时需要导入 `java.applet` 和 `java.awt` 包。`JApplet` 定义在 `Swing` 中。\n\n简单的程序在程序\
  \ 15.1 中。\n\n程序 15.1![](img/00013.jpeg)\n\n```java\n/* 这是一个简单的程序\nka.somasundaram@gmail.com\n\
  */\n\nimport java.applet.Applet;\nimport java.awt.Graphics;\n\npublic class Myapplet\
  \ extends Applet {\n    public void paint(Graphics g) {\n        g.drawString(\"\
  Welcome to Applet World\", 20, 40);\n    }\n}\n```\n\n编译此程序的方法如下面编译应用程序程序所示：\n\n\
