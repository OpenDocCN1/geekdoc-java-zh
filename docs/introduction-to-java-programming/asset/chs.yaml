  \ 卢比至 1500 卢比购买提供 12% 折扣，对 1500 卢比以上的购买提供 15% 折扣。编写一个程序为给定的销售实现上述方案，并打印销售额、折扣和客户支付的净额。\n\
  5.12 二次方程 `ax²+bx+c=0` 的根由给出 ![](img/00058.jpeg)，条件为 `if (b²–ac) < 0` 则取绝对值 `|(b²–ac)|`。给定\
  \ `a`, `b`, `c`，编写一个 Java 程序计算两个根 `x[1]` 和 `x[2]`。\n5.13 一家电器商店为电机分配代码 1，风扇分配代码\
  \ 2，荧光灯分配代码 3，电线分配代码 4。所有其他项目代码为 5。在销售中，分配代码是。\n\n#### 数组\n\n在 Java 中，数组是存储相同类型变量集合的数据。\
