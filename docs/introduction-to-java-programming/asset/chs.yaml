  \n![](img/00173.jpeg)\n\n**图 15.7** 程序 15.5 的输出界面\n\n# 15.6 HTML APPLET 标签\n\nApplet\
  \ 可以是 HTML 页面上的一个元素。`applet` 语句本身有自己的结构，被称为 `applet 标签`。各个组件定义了 applet 的行为和属性。`applet\
  \ 标签` 的通用结构所示。用 `[...]` 编写的内容是可选的，其他条目对于 applet 来说是必须的。\n\n```html\n<APPLET\n[CODEBASE\
  \ = codebase URL]\nCODE = appletName\n[archive = archivefile]\n[ALT = alternateText]\n\
  [NAME = appletInstanceName]\nWIDTH = pixels HEIGHT = pixels\n[ALIGN = alignment]\n\
