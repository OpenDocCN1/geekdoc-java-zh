  \     for (i = 2; i <= nmax; i++)\n            fact *= i;\n        return fact;\n\
  \    }\n\n    public double Hypfun(double x){\n        sinh = x;\n        for (int\
  \ k = 1; k <= n; k++)\n        {\n            factn = Factfun(2 * k + 1);\n    \
