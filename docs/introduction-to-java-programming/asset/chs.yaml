  \ 4 × 4 元素矩阵的行列式。\n\n## 7 类 (Classes)\n\n在本章中，将解释类的基本概念。这是面向对象编程的开始。书中讨论了如何定义类以及如何创建对象。还解释了通过方法重载来实现多态的一种方法。\n\
  \n类是 Java 面向对象编程的基础构建模块。类定义了数据以及如何处理数据。\n\n\n\n\n变量 `adrs` 是一个对象引用变量，其类型为 `Address`。`new`\
  \ 操作符创建一个类型为 `Address` 的对象并返回该对象的引用，该引用被存储在 `adrs` 中。\n\n![](img/00077.jpeg)\n\n\
  **图 7.3** 类、`new` 运算符和对象\n\n除了少数几种情况外，类不能直接作为类来使用。只有类的实例可以被使用。对象引用变量 `adrs` 包含一个指向\
  \ `Address` 对象的引用，而不包含任何关于该对象的数据。当你将一个对象引用变量拷贝到另一个对象引用变量时，不会创建对象，而是创建了引用的另一个拷贝，它再次指向同一个对象。以下语句创建了对象引用变量\
  \ `adrs` 的另一个拷贝。\n\n```\nAddress adrs1 = adrs;\n```\n\n![](img/00078.jpeg)\n\n**图\
  \ 7.4** 对象引用变量的拷贝\n\n当打印 `adrs` 时，只会打印对象引用 `3B75`，而不是对象的内容。\n\n![](img/00011.jpeg)对象是类的实例。\n\
  \n## 7.3 点(.) 运算符\n\n点操作符（`.`）用于访问在该对象中定义的实例变量和方法。使用点运算符的一般形式为：\n\n```\nObject.instance_variable\n\
  ```\n\n下面的程序 7.1 演示了点运算符的使用：\n\n程序 7.1![](img/00013.jpeg)\n\n```\n/* 此程序需要 jdk1.6\
  \ 或更高版本。\n此程序演示了如何声明一个类并\n为实例变量赋值\n\nka.somasundaram@gmail.com\n*/\nimport java.io.Console;\n\
  \nclass Address {\n    String nam, city;\n    int pin;\n}\n\nclass ClassDemo {\n\
  \    public static void main(String args[]) {\n        Console con = System.console();\n\
  \        // 创建 Address 对象\n        Address adrs = new Address();\n        // 给实例变量赋值\n\
  \        adrs.nam = “Dr.K.Somasundaram”;\n        adrs.city = “Ambathurai”;\n  \
