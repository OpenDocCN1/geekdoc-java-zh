  \n![](img/00079.jpeg)\n\n**图 7.1** 程序 7.1 的输出屏幕\n\n## 7.6 实例变量隐藏\n\n在声明方法和构造函数时，使用参数作为参数。参数的名称通常与实例变量不同。然而，Java\
  \ 允许参数和实例变量具有相同的名称。为了从形式参数中识别实例变量，使用了 `this` 关键字。`this` 代表当前类。下面的程序 7.5 演示了在类中使用\
  \ `this`：\n\n\n\n\n```java\npublic static void main(String args[]) {\n    //创建 Address\
