  \n# 录\n\n## 转换字符\n\n转换字符通常分为以下六类。\n\n| 类型 | 描述 |\n| :--- | :--- |\n| (1) 通用 | 可应用于任意类型\
  \ |\n| (2) 字符 | 可应用于表示 Unicode 字符的基本类型：`char`, `Character`, `byte`, `Byte`, `short`,\
  \ `Short`。 |\n| (3) 数值 | (i) 整数 - 可应用于整数类型 `byte`, `Byte`, `short`, `Short`, `int`,\
  \ `Integer`, `long`, `Long`。 |\n| | (ii) 浮点 - 可应用于浮点类型：`float`, `Float`, `double`,\
  \ `Double`。 |\n| (4) 日期/时间 | 可应用于能够编码日期或时间的类型：`long`, `Long`, `Calendar` 和 `Date`。\
  \ |\n| (5) 百分号 (%) | 输出字面量 |\n| (6) 换行符(%n) | 输出一个换行符 |\n\n通用、字符和数值类型的格式占位符具有以下语法：\n\
  \n`%[argument_index $][flags][width][precision]conversion`\n\n`argument_index $`\
  \ 是参数的位置。`flags` 修改输出。`width` 指定最小字符数。`precision` 限制字符数。`conversion` 是转换的类型。\n\n"
