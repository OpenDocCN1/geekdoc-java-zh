  \n![](img/00181.jpeg)\n\n**图. 16.7** 程序 16.5 的输出屏幕\n\n## 16.5 绘制多边形\n\n具有多个角的多边形使用以下方法绘制。每个方法接受两个\
  \ `int` 类型的数组，一个用于所有的 x 坐标，另一个用于所有的 y 坐标，它们构成多边形。使用这些方法绘制的所有多边形都是闭合的。\n\n```java\n\
  public void drawPolygon(int xPoints[], int yPoints[], int nPoints)\n```\n\n绘制由数组\
  \ `xPoints` 和 `yPoints` 定义的闭合多边形；`nPoints` 代表 `(x,y)` 点对的数量。通常，起始点和结束点的 x 和 y 点是相同的。如果用户没有提供与起点相同的结束点，此方法将在起点处闭合线段。\n\
  \n```java\npublic void fillPolygon(int xPoints[], int yPoints[], int nPoints)\n\
  ```\n\n绘制由数组 `xPoints`、`yPoints` 和 `nPoints` 指定的填充闭合多边形。\n\n```java\npublic void\
  \ drawPolygon(Polygon p)\n```\n\n绘制由 `Polygon` 对象 `P` 定义的多边形的轮廓。\n\n程序 16.6 演示了两种多边形绘制方法的使用：\n\
  \n程序 16.6![](img/00013.jpeg)\n\n```java\n/* 绘制 drawPolygons 的 Applet\n<applet code\
