  \n## 7.5 构造函数\n\n构造函数用于在创建对象时为实例变量分配初始值。在上一节 7.4 中，我们看到使用方法来初始化实例变量。使用构造函数，可以在对象创建时自动分配初始值。构造函数是特殊的方法。构造函数的名称与类名相同。声明构造函数的一般形式为：\n\
  \n```\nclass class {\n    classname(parameterlist) {\n        body;\n    }\n}\n\
  ```\n\n下面的程序 7.3 展示了构造函数的使用：\n\n程序 7.3![](img/00013.jpeg)\n\n```\n/* 此程序需要 jdk1.6\
