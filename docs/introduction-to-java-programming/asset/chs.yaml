  \n\n\n\n```java\npublic void fillArc(int x, int y, int width, int height, int startAngle,\
  \ int arcAngle)\n```\n\n绘制一个填充的圆弧\n\n程序 16.5 显示了 `drawArc()` 方法的使用。\n\n程序 16.5![](img/00013.jpeg)\n\
