  \n## 13 字符串\n\n在本章中，你将学习字符串。Java 支持三种类型的字符串：`String`、`StringBuffer` 和 `StringBuilder`。`String`\
  \ 类型字符串是固定的，而 `StringBuffer` 和 `StringBuilder` 字符串在操作上更加灵活。本章将介绍处理这三种类型字符串的方法。\n\
  \n在 Java 语言中，字符串被定义为字符序列。Java 中使用的字符串由三个类处理：`String`、`StringBuffer` 和 `StringBuilder`。`String`\
  \ 类处理创建后不再更改的字符串。`StringBuffer` 和 `StringBuilder` 类处理创建后需要更改的字符串。所有这些类都位于 `java.lang`\
  \ 包中。\n\n### 13.1 STRING 类\n\n`String` 对象使用以下构造函数创建：\n\n* `String()`：创建一个空字符串的 `String`。\n\
  * `String(char charray[])：使用字符数组创建 `String`。\n* `String(char charray[], int start,\
  \ int len)`：从字符数组的 `start` 位置开始取 `len` 个字符创建 `String`。\n* `String(String str)`：根据另一个\
  \ `String` 创建 `String`。\n\n示例：\n\n```java\nString s1 = new String(); // 创建空字符串的\
  \ String\nchar name[] = {'M','a','g','e','s','h'};\nString s2 = new String(name);\
  \ // 使用字符数组创建 String\nString s3 = new String(name, 2, 3); // 从字符数组的第 2 位置开始取 3 个字符创建\
  \ String\nString s4 = new String(s2); // 根据另一个 String 创建 String\n```\n\n（注：原文对构造函数的描述是碎片化的，根据标准\
