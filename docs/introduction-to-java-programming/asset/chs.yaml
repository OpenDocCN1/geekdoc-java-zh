  \ 类处理。它们都是字节流。\n\n## 12.5 过滤字节流\n\nJava 中的每个流都提供了以不同形式访问数据的方法。基本字节流以字节形式访问数据。原始字节无法用于任何有用目的。为了将字节转换为\
  \ `char`、`string`、`int` 等有用形式，Java 提供了几种流。这些流作用于其他流上，并将字节转换为有用形式或反亦然。这种可以接受其他流作为参数的流被称为**过滤流\
  \ (filtered streams)**。Java 拥有 `FilterInputStream` 和 `FilterOutputStream`。\n\n有几种只能在其他流上工作的过滤流。在许多实际情况下，只有过滤流是有用的。在接下来的章节中，将讨论了两种过滤流：\n\
  \n![](img/00141.jpeg)\n\n**图 12.3** 过滤字节流\n\n### 12.5.1 DataOutputStream\n\n它是 `FilterOutputStream`\
  \ 的子类。该类中的方法有助于将基本类型转换为字节并将其传递给底层输出流。该类中的 `write` 方法有助于创建一个输出流，该输出流可以通过 `DataInputStream`\
  \ 中的方法读取。写入输出流的数据不是人类可读的形式。该类中的构造函数为：\n\n```java\nDataOutputStream(OutputStream\
  \ ous)\n```\n\n创建一个新的数据输出流，将数据写入底层的输出流 `ous`\n\n`DataOutputStream` 中定义的一些方法见表 12.4。所有方法都会抛出\
  \ `IOException`。\n\n**表 12.4** DataOutputStream 类中的方法\n\n所有方法都会抛出 `IOException`\n\
  \n| 方法 | 方法的目的 |\n| :--- | :--- |\n| 1. `void write(int b)` | 将 `b` 的低 8 位写入底层输出流\
  \ |\n| 2. `void write(byte bf[], int off , int len)` | 从字节数组 `bf` 中从 `bf[off]` 开始将\
  \ `len` 个字节写入底层输出流 |\n| 3. `void flush()` | 将缓冲的字节发送到输出流 |\n| 4. `void writeBoolean(boolean\
  \ b)` | 将布尔值 `b` 作为 1 字节值写入底层输出流 |\n| 5. `void writeByte(int in)` | 将 `int` 值作为字节值写入底层流\
  \ |\n| 6. `void writeShort(int in)` | 将 `short` 作为两个字节写入底层输出流；先写入高字节。 |\n| 7. `void\
  \ writeChar(int in)` | 将 `char` 作为 2 字节值写入底层流；先写入高字节。 |\n| 8. `void writeInt(int\
  \ in)` | 将 `int` 作为 4 字节写入底层流；先写入高字节 |\n| 9. `void writeLong(long ln)` | 将 `long`\
  \ 作为 8 字节写入底层流；先写入高字节。 |\n| 10. `void writeFloat(float f)` | 使用特殊方法将 `float` 转换为\
  \ `int` 并将 `int` 作为 4 字节写入底层流；先写入高字节。 |\n| 11. `void writeDouble(double d)` | 使用特殊方法将\
  \ `double` 转换为 `long` 并将 `long` 作为 8 字节写入底层输出流；先写入高字节。 |\n| 12. `void writeUTF(String\
  \ str)` | 使用修改后的 UTF-8 编码将 `String` 写入底层输出流。 |\n\n下面的程序 12.4 示例了 `DataOutputStream`\
  \ 类中定义的一些方法的使用。\n\n程序 12.4![](img/00013.jpeg)\n\n```java\n/* 此程序演示了 DataOutputStream\
  \ 的用法\n* 此程序需要 jdk1.6 或更高版本\n* ka.somasundaram@gmail.com */\nimport java.io.*;\n\
  \nclass Dataoutput {\n\npublic static void main(String args[]) {\n\nConsole con\
  \ = System.console();\nFile fout = new File(“dataoutput.dat”);\nString name, snrec,\
  \ sage, shit;\nint age, nrec, nmax;\ndouble height;\n\nDataOutputStream dous;\n\n\
  try {\n\ndous = new DataOutputStream(\nnew FileOutputStream(fout));\n\ncon.printf(“\
  \ How many data?:”);\n\nsnrec = con.readLine();\nnrec = Integer.parseInt(snrec);\n\
  nmax = nrec;\ncon.printf(“The following data are written to output.dat file%n”);\n\
  \nwhile (nrec > 0) {\n\ncon.printf(“ Name:”);\n\nname = con.readLine();\ncon.printf(“\
  \ Age:”);\n\nsage = con.readLine();\nage = Integer.parseInt(sage);\ncon.printf(“\
  \ Height in metres:”);\n\nshit = con.readLine();\nheight = Double.parseDouble(shit);\n\
  \ndous.writeUTF(name);\ndous.writeInt(age);\ndous.writeDouble(height);\n\nnrec--;;\n\
  \n}\n\ncon.printf(“%d records were sent to dataoutput.dat file%n”, nmax);\n\ndous.close();\n\
