  \n**图. 15.3** 程序 15.2 的输出屏幕\n\nApplet 的输入输出依赖于 `AWT`。与 applet 的所有用户交互都是事件驱动的，例如鼠标点击。因此，只有在了解事件处理细节后，才能理解组成\
  \ applet 的所有元素。在接下来的章节中将 applet 的基础。\n\n![](img/00011.jpeg)Applet 只能是 HTML 页面的一部分并由网络浏览器执行。然而，在开发阶段，可以使用\
  \ `appletviewer` 直接执行 applet。\n\n## 15.2 APPLET 生命周期方法\n\nApplet 通过 `Applet` 类提供的适当方法进行创建、执行、停止和销毁。所有这些活动都通过以下方法完成。它们被称为生命方法。这些方法由\
  \ `AWT` 自动调用。可以重写适当的方法以满足用户需求。\n\n(a) `init()` 此方法用于初始化 applet 的变量。这是第一个被调用的方法。只被调用一次。\n\
  \n(b) `start()` 此方法在 `init()` 方法之后自动调用。每当用户访问不同页面后返回包含 applet 的页面时，也会被调用。`start()`\
  \ 方法可以被重复调用，而 `init()` 方法只在 applet 加载时被调用一次。线程在此方法中被重启。\n\n(c) `paint()` 此方法在 `start()`\
  \ 方法之后自动调用。使用 `paint()` 方法绘制用户屏幕。此方法有一个在 `AWT` 中定义的 `Graphics` 类型的参数。当 applet 开始执行时会调用\
  \ `paint()` 方法。\n\n(d) `stop()` 此方法在用户离开包含 applet 的页面时自动调用。因此，它可以被重复调用。这有助于在用户不使用\
  \ applet 时挂起活动。否则，将减慢系统性能。\n\n(e) `destroy()` 此方法在浏览器结束活动时自动调用。此方法有助于释放 applet 使用的资源。当\
  \ applet 从系统内存移除时，用户必须放置所有完成最终活动所需的代码。`stop()` 方法在 `destroy()` 方法之前被自动调用。\n\n程序\
  \ 15.3 给出了出了编写 `init`、`start`、`stop` 和 `destroy` 方法的说明。字符串 `mesg1` 到 `mesg4` 未分配初始值。它们在各自方法执行时被赋予字符串字面量。字符串\
  \ `mesg3` 在 `destroy()` 方法内部被赋值了文本。`stop` 和 `destroy` 方法内部的语句仅在 applet 停止和销毁时执行。这可以通过重启\
  \ applet 来实现。\n\n程序 15.3![](img/00013.jpeg)\n\n```java\n/* 此程序说明了 applet 的生命方法\n\
  \nka.somasundaram@gmail.com\n\n<applet code = Allmethod1 width = 250 height = 200>\n\
  \n</applet>\n*/\n\nimport java.applet.Applet;\n\nimport java.awt.Graphics;\n\npublic\
  \ class Allmethod1 extends Applet {\n\nString mesg1, mesg2, mesg3, mesg4;\n\npublic\
  \ void destroy() {\n\nmesg4 = “system is destroying your applet`;\n}\n\npublic void\
  \ init() {\n\nmesg1 = “message from init method`;\n}\n\npublic void stop() {\n\n\
  mesg3 = “message from stop`;\n}\n\npublic void start() {\n\nmesg2 = “message from\
  \ start method`;\n}\n\npublic void paint(Graphics gp) {\n\ngp.drawString(“Demo for\
  \ basic methods of applet”, 20, 40);\n\nif (mesg1 != null) {\n\ngp.drawString(mesg1,\
  \ 80);\n\n}\n\nif (mesg2 != null) {\n\ngp.drawString(mesg2, 100);\n\n}\n\nif (mesg3\
  \ != null) {\n\ngp.drawString(mesg3, 120);\n\n}\n\nif (mesg4 != null) {\n\ngp.drawString(mesg4,\
  \ 140);\n\n}\n\n}\n\n}\n```\n\n执行 applet 时的输出如下：\n\n![](img/00170.jpeg)\n\n**图.\
  \ 15.4** 程序 15.3 的输出屏幕\n\n在输出中，选择 Applet 并点击。这将销毁 applet 并重新启动。结果是 `mesg3` 和 `mesg4`\
