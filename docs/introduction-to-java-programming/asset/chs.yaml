  \n### 13.2 StringBuffer 类\n\n需要修改的字符串由 `StringBuffer` 类处理。在创建 `StringBuffer` 后，可以向其插入或追加新字符串。`StringBuffer`\
  \ 的大小可以根据需要增长。`StringBuffer` 对象可以被动态修改。当创建一个 `StringBuffer` 时，总是会为其附加额外的 16 个字符的空间。这有助于\
  \ `StringBuffer` 对象在无需任何其他过程的情况下增长 16 个字符。也就是说，`StringBuffer` 的大小是该字符串中的字符数加上 16。当字符串超过空闲的\
  \ 16 个字符空间时，`StringBuffer` 将重新定位到所需大小的新内存空间。`StringBuffer` 类型的对象在多线程环境中是安全的。\n\n\
  `StringBuffer` 类中的构造函数有助于创建 `StringBuffer` 对象。构造函数有：\n\n- `StringBuffer()`：创建一个空的\
  \ `StringBuffer` 对象；它具有 16 个字符的空间。\n- `StringBuffer(int size)`：创建一个具有指定大小容量缓冲的 `StringBuffer`\
  \ 对象。\n- `StringBuffer(String str)`：创建一个带有字符串 `str` 以及额外 16 个字符空间的的 `StringBuffer`\
  \ 对象。\n\n`String` 类中定义的 `equals()` 方法在 `StringBuffer` 类也可用。`equals()` 方法可以用于比较相同类型的字符串对象，而不是混合比较。也就是说，`String`\
  \ 对象不能与 `StringBuffer` 对象进行比较。\n\n![](img/00011.jpeg)` `equals()` 方法不应用于比较不同类型的对象。\n\
  \n`StringBuffer` 类中定义的方法如表 13.2 所示。\n\n**表 13.2** `StringBuffer` 类中定义的方法\n\n| 方法\
  \ | 方法的用途 |\n| :--- | :--- |\n| 1. `int length()` | 返回调用对象中字符的总数 |\n| 2. `int capacity()`\
  \ | 返回调用对象被分配的总容量 |\n| 3. `void ensureCapacity (int capacity)` | 将调用对象的缓冲区容量设置为所需的容量\
  \ |\n| 4. `void setLength(int len)` | 设置 `StringBuffer` 对象的长度；如果 `len` 大于对象的长度，将创建空位。\
  \ |\n| 5. `char charAt(int index)` | 返回调用对象中索引处的字符 |\n| 6. `void setCharAt(int index,\
  \ char ch)` | 设置调用对象中索引处的字符 |\n| 7. `void getChars(int sourceBegin, int sourceEnd,\
  \ char target[], int targetBegin)` | 将从 `sourceBegin` 到包含 `sourceEnd` 在内的字符复制到 `target`\
  \ 中，从 `targetBegin` 开始 |\n| 8. `StringBuffer append(String str)` | 在对象后追加 `str`\
  \ 并返回一个 `StringBuffer` |\n| 9. `StringBuffer append(int num)` | 在对象后追加 `num` 并返回一个\
  \ `StringBuffer` |\n| 10. `StringBuffer append(object obj)` | 在对象后追加 `obj` 并返回一个\
  \ `StringBuffer` |\n| 11. `StringBuffer insert(int index, String str)` | 在索引处插入\
  \ `str` 并返回一个 `StringBuffer` |\n| 12. `StringBuffer reverse()` | 反转调用对象中的字符并返回 `StringBuffer`\
  \ |\n| 13. `StringBuffer delete (int startIndex, int endIndex)` | 删除从 `startIndex`\
  \ 到 `endIndex` 的字符并返回 `StringBuffer` |\n| 14. `StringBuffer deleteCharAt (int index)`\
  \ | 删除调用对象索引处的字符并返回 `StringBuffer` |\n| 15. `StringBuffer replace (int startIndex,\
  \ int endIndex, String str)` | 用 `str` 替换 `startIndex` 到 `endIndex` 之间的字符并返回 `StringBuffer`\
  \ |\n| 16. `String substring(int startIndex)` | 返回从 `startIndex` 到调用对象结束的 `String`\
  \ |\n| 17. `String substring(int startIndex, int endIndex)` | 返回 `startIndex` 到\
  \ `endIndex` 之间的 `String` |\n| 18. `String toString()` | 固定调用对象的缓冲区后返回 `String`\
  \ |\n\n### 13.3 StringBuilder 类\n\n另一个类 `StringBuilder`（从 JDK 1.5 开始）用于处理可变或灵活的字符串。它拥有\
  \ `StringBuffer` 类中定义的所有方法。`StringBuilder` 类型字符串在多线程环境中是不安全的。\n\n程序 13.6 演示了 `StringBuffer`\
  \ 类中定义的一些方法。\n\n程序 13.6![](img/00013.jpeg)\n\n```java\n/* 演示 StringBuffer 类中一些方法的程序\n\
  * 此程序需要 jdk1.6 或更高版本才能编译和执行。\n* ka.somasundaram@gmail.com */\nimport java.io.Console;\n\
  \nclass StringBuf {\n    public static void main(String args[]) {\n        StringBuffer\
  \ name = new StringBuffer(“Praveen Kumar”);\n        Console con = System.console();\n\
  \        int count = name.length();\n        con.printf(“Name = %s\\n”, name);\n\
  \        con.printf(“Length of name = %d\\n”, count);\n        con.printf(“Capacity\
  \ of name = %d\\n”, name.capacity());\n        con.printf(“Substring 5th character\
  \ = %s\\n”, name.substring(4));\n        con.printf(“Name after inserting initial\
  \ = %s\\n”, name.insert(0, “S.”));\n        con.printf(“Name after appending the\
  \ degree = %s\\n”, name.append(“ MS”));\n        con.printf(“Reversed name = %s\\\
  n”, name.reverse());\n    }\n}\n```\n\n\n\n阅读完本章后，你应该学习了以下内容：\n\n*   Java 支持三种类型的字符串：`String`、`StringBuffer`\
  \ 和 `StringBuilder`。\n*   `String` 类型的操作较为僵化，而 `StringBuffer` 和 `StringBuilder`\
  \ 类型在操作上更加灵活。\n\n在下一章中，你将学习线程。\n\n![](img/00053.jpeg)\n\n### 题目 13.1T\n\n编写一个程序，通过键盘输入以下列表（或你选择的任何列表），按字母顺序排列名称并打印出来。\n\
