  \ | 数组索引越界 |\n| 3. ClassCastException | 无效类型转换 |\n| 4. IllegalArgumentException\
  \ | 传递给方法的无效参数 |\n| 5. NegativeArraySizeException | 负数数组大小 |\n| 6. NullPointerException\
  \ | 空值使用 |\n| 7. NumberFormatException | 字符串转换数字错误 |\n| 8. StringOutOfBoundsException\
