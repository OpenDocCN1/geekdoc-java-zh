  \n### II. 为以下内容编写 Java 程序：\n\n8.14 编写一个类，其中包含一个计算矩形面积的方法。创建一个子类来计算矩形盒的体积。\n8.15\
  \ 编写一个名为 `square` 的类，包含一个方法 `Area(double a)` 用于计算正形的面积 (a²)。创建一个 `Square` 的子类 `Cube`，并编写重写方法\
  \ `Area(double a)` 来计算立方体的表面积 (6a²)。\n8.16 编写一个带有静态方法的类，该方法返回三个给定整数的最大值。编写另一个带有\
  \ `main` 方法的类，调用该静态方法打印两组整数值的最大值（例如 {5, 2, 10}, {75, 20, 89}）。\n8.17 编写一个带有抽象方法\
  \ `void Special(int n)` 的抽象类。创建该类的子类并实现 `Special` 方法，找出从 1 到 n 之间所有的完全平方数。\n8.18\
  \ 编写一个带有抽象方法 `double Process(double P, double R)` 的抽象类 `Special`。创建一个子类 `Discount`\
  \ 并使用以下公式实现 `Process()` 方法：\n\n```\nnet = P – P* R/100\n```\n返回净值。为 `Special` 创建另一个子类\
  \ `Tax`，并使用以下公式实现 `Process()` 方法：\n\n```\ntotal = P + P * R/100\n```\n返回总额。\n\n\
  ## 9 包与接口\n\n在本章中将介绍包（package）和接口（interface）。当有多个类在许多程序中重用时，管理它们就变成了一个问题。为了解决这个问题，使用了包。接口拥有没有方法体的方法。接口帮助程序员按照他们选择的程序来实现接口方法。接口还帮助实现多重继承。\n\
  \n### 9.1 包 (PACKAGE)\n\n通常情况下，你会为多个应用程序创建许多类。当类数量很大时，将它们全部保存在同一个目录中并为不同的应用程序进行管理会有些繁琐。为了解决这个问题，可以将类存储在不同的目录中，每个目录包含执行相似类型函数的类。为了识别类在目录中的存储位置，使用\
  \ `package` 语句。当你想要在任何其他目录的任何类中使用该类时，这种标识是必要的。因此，包有助于管理大量的类。包语句的一般形式为：\n\n```\n\
  package pckg1.pckg2.pckg3;\n```\n\n例如，语句\n\n```\npackage java.soms.jbook;\n```\n\
  表示程序存储在 `java\\soms\\jbook` 目录中。\n\n在任何程序中，如果使用 `package` 语句，必须必须第一个语句。\n\n![](img/00110.jpeg)\n\
  \n**图 9.1** 包充当类的容器\n\n### 9.2 import 语句\n\n当你想要在另一个包的另一个类中使用某个包中的类时，可以使用 `import`\
  \ 语句在你的类中引用这些类。例如，图 9.1 中 `Package1` 中的类 `A` 可以通过放置以下语句被 `package2` 访问：\n\n```\n\
  import package1.A;\n```\n\n在任何 Java 程序中，如果使用 `import` 语句，它必须紧跟在 `package` 语句之后。\n\
  \n除了用户定义的类外，用户还可以成千上万个 Java 类。Java 类被封装在不同的包中并放置在 Java 开发包 (JDK) 中。你可以使用 `import`\
  \ 语句访问它们。例如，所有的输入/输出函数都可以在 `java.io` 包可用。因此，语句：\n\n```\nimport java.io.*;\n```\n\
  可以访问 `java.io` 包中的所有类。\n\n语句中的类和方法：\n\n```\nSystem.out.println(......);\n```\n在\
  \ Java 语言包 `java.lang` 中可用。`java.lang` 包中还有其他类如 `Math`。Java 编译器默认会自动导入 `java.lang.*`，因此没有必要显式地\
  \ `import` 这个包。`*` 标记表示你可以访问该包中的所有类。如果需要某个特定的类，可以显式提到类名而不是使用 `*`。如果两个类具有相同的类名，则无法通过以下语句访问它们：\n\
  \n```\nimport package1.*;\nimport package2.*;\n```\n必须连同 `package` 名称显式地提到类名。以下示例说明了这一概念：\n\
  \n```class\nclass Newclass extends package1.classA {\n    . . .\n    . . .\n}\n\
  ```\n\n### 9.3 访问修饰符 (ACCESS MODIFIER)\n\nJava 语言的关键特征之一是它的封装。这一特性有助于你根据所需的程度保护你的数据和方法。在非\
  \ OOP 语言中没有这种特性。Java 中的这种特性通过访问修饰符来实现。让我们假设我们有两个包，如图 9.2 所示的 `Package1` 和 `Package2`。\n\
  \n![](img/00111.jpeg)\n\n**图 9.2** 同一包和不同包中的类、子类和非子类\n\n在类中使用访问说明符声明的成员（方法或变量）可以被设置为仅对该类可见或对任何包可见。这有助于用户控制其他类对成员的使用。\n\
  \n访问修饰符及其可见性见表 9.1。\n\n**表 9.1** 访问修饰符及其可见性\n\n| 修饰符 | 可见性 |\n| :--- | :--- |\n\
  | private | 仅对类可见 |\n| protected | 对任何包中的子类以及同包内的所有类可见 |\n| public | 对所有包可见 |\n\
  | 无修饰符（默认） | 仅对同包可见 |\n\n在目前为止看到的所有程序中，实例变量都没有任何修饰符。这意味着变量对整个包（该目录的所有类）可见。以下程序 9.1、9.2\
  \ 和 9.3 展示了访问修饰符的使用：\n\n以下程序 9.1 展示了放置在包 `jbookr` 中的类 `A`：\n\nProgram 9.1![](img/00013.jpeg)\n\
