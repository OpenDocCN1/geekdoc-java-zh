- "# Java 编程入门指南\n\n\n\n![](img/cover.jpeg)\n![](img/00005.jpeg)\n\n\n![](img/00006.jpeg)\n\
  \n\n\n\n## 致谢\n\n我感谢甘迪格拉姆农村学院（Gandhigram Rural Institute）MCA 和 MSc-IT 课程（1995-2013）的所有学生，通过他们我学习了\
  \ Java 语言。\n\n感谢我的妻子 S. Gomathi 以及儿子 S. Praveen Kumar 和 S. Magesh，他们抽出时间准备了这份手稿，否则这本该属于家庭的时间。感谢\
  \ T. Vasantha 女士准备手稿并使用 PageMaker 完成了排版。我感谢 V. Pechi 先生帮助准备了手稿的几个章节。感谢 Jaico 出版社的\
  \ Soumen Mukherjee 先生发起了本书并对书籍大纲提出了宝贵建议，还感谢 Jaico 的整个编辑团队为本书的出版所付出的努力。\n\nK. Somasundaram\
  \ 博士\n\n## 前言\n\n本书是我过去 15 年来为甘迪格拉姆农村学院 MCA 和 MSc 项目的学生准备 Java 编程课程的成果。尽管我在开发科学和商业软件方面已经很好地接触过如\
  \ FORTRAN、COBOL、BASIC、Pascal 和 C 等其他计算机语言，但学习 Java 是一种完全不同的体验。当我 1995 年开始阅读 Patrick\
  \ Naughton 写的《Java 手册》时，我对 Java 程序的结构和语法感到非常困惑。事实上，要识别 Java 程序的起点是相当困难的。但在阅读这本书并理解这些概念的过程中，我发现了\
  \ Java 语言强大的功能。我希望任何阅读 Java 入门书籍的读者也能获得同样的体验。\n\n本书适用于为期一学期（入门级）的 Java 编程课程。它包含了\
  \ `JDK1.7` 中引入的新功能。与其他书籍相比，你会在书中发现的一个值得注意的特点是使用了在 `Console` 类中定义的最近引入的 `printf()`\
  \ 方法，而不是传统的 `System.out.println()` 语句。\n\n本书由 16 章组成。第 1 章解释了面向对象编程（OOP）概念、Java\
  \ 技术及其特性。第 2 章解释了 Java 字面量、数据类型和变量。第 3 章介绍了 Java 程序的编写感觉。第 4 章介绍了 Java 语言中可用的运算符。第\
  \ 5 章给出了带有示例程序的流程控制语句。第 6 章涉及数组和 Java 的 `Arrays` 类。第 7 章介绍了类概念，并详细说明了如何从类创建对象。读者需要花时间彻底理解本章中引入的基本概念。第\
  \ 8 章解释了用于重用现有代码的继承，并通过示例程序进行了演示。第 9 章解释了用于组织和管理类的包概念。此外，还介绍了如何使用 private、protected\
  \ 和 public 等访问修饰符来实现封装。介绍了接口，许多程序员可以使用不同的不同的代码实现相同的方法。第 10 章介绍了包装类，通过它可以可以为基本类型创建对象。第\
  \ 11 章解释了程序中发生的异常情况（异常）。本章演示了如何开发无错误且健壮的 Java 程序。第 12 章涉及输入/输出数据流的处理。第 13 章介绍了使用\
  \ `Strings` 处理文本，书中解释了三个字符串类中定义的方法。第 14 章解释了如何创建多线程程序。第 15 章解释了 applet，这是客户端编程的第二种\
  \ Java 程序。第 16 章解释了如何使用 `Graphics` 类中定义的方法绘制规则形状。\n\n在每一章中都提供了复习题，帮助读者自测学习情况。在许多章节中，提供了“试一试”程序，让读者能够为现实问题开发程序。\n\
  \n章节的安排非常合理，任何初学者都能平稳地从一章过渡到另一章。我没有包含任何会让读者在任何一点感到意外的主题。没有任何编程语言背景的初学者都可以使用这本书。我相信，在阅读本书后，读者将获得使用\
  \ Java 开发程序的信心。本书将为 Java 打下坚实的基础，使读者跳转到 Swing、JDBC、Servlets 等 Java 高级的话题。\n\n\n\n\
  \n\n程序 5.7 可以写成程序 5.8 所示的另一种形式。循环变量 `n` 可以在 `for` 结构内部声明。迭代器是可选的。如果程序中不需要迭代器，可以将其留空。\n\
  \n程序 5.8![](img/00013.jpeg)\n\n```java\n/* 此程序演示了 for 语句的使用。\n* 迭代器留空，因为它是在 for\n\
  * 外部完成的。\n* 此程序需要 jdk1.6 或更高版本。\n* ka.somasundaram@gmail.com\n*/\nimport java.io.Console;\n\
  \nclass ForDemo2 {\n    public static void main(String args[]) {\n        Console\
  \ con = System.console();\n        int n, max, sum = 0;\n        String sn;\n  \
  \      con.printf(\"%n 输入一个 1–10 之间的数字: \");\n        sn = con.readLine();\n   \
  \     n = Integer.parseInt(sn);\n        max = n;\n        for (int i = n; n > 0;)\
  \ {\n            sum += n––;\n        }\n        con.printf(\"%n 从 1 到 %d 的数字之和为\
  \ %d\", max, sum);\n    }\n}\n```\n\n程序 5.8 中的 `for` 循环可以进一步改进，并写成紧凑的形式：`for (int\
  \ i=n; n>0; sum+=n– –)`\n\n\n\n\n\n![](img/00011.jpeg)在 `for` 结构中，初始化、条件、迭代器这三个组件中的一个、两个或三个都可以缺失。语句\
  \ `for ( ; ; )` 是有效的，并将将形成一个无限循环。\n\n下面的程序 5.9 计算给定数字的阶乘。\n\n### 程序 5.9![](img/00013.jpeg)\n\
  \n```java\n/* 此程序使用 for 语句找到数字的阶乘\n* 此程序需要 jdk1.6 或更高版本。\n* ka.somasundaram@gmail.com\n\
  */\nimport java.io.Console;\n\nclass Factorial {\n    public static void main(String\
  \ args[]) {\n        Console con = System.console();\n        int n;\n        String\
  \ sn;\n        long fact = 1;\n        con.printf(“%n 输入一个数字来计算其阶乘: “);\n      \
  \  sn = con.readLine();\n        n = Integer.parseInt(sn);\n        for (int i =\
  \ 1; i <= n; ++i) {\n            fact *= i;\n        }\n        con.printf(“Factorial\
