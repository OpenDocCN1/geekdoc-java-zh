  \ sinh;\n    }\n}\n\nclass Hycos implements Hyper {\n    double cosh;\n    long\
  \ factn;\n    int i;\n    long Factfun(int nmax){\n        long fact = 1;\n    \
  \    for (i = 2; i <= nmax; i++)\n            fact *= i;\n        return fact;\n\
  \    }\n\n    public double Hypfun(double x) {\n        cosh = 1;\n        for (int\
  \ k = 1; k <= n; k++){\n            factn = Factfun(2 * k);\n            cosh =\
  \ cosh + Math.pow(x, (2 * k)) / factn;\n        }\n        return cosh;\n    }\n\
  }\n\nclass TIO91{\n    public static void main(String args []){\n        double\
  \ x, sinh, cosh, jsh, jch;\n        Hyper hcos;\n        Hyper hsin;\n        Console\
  \ con = System.console();\n        int pn = 40;\n        for (int i = 0; i < pn;\
  \ i++)\n            System.out.print(\"–\");\n        con.printf(\"%n\");\n    \
  \    con.printf(\"x \\t sinh \\t Java \\t cosh \\t Java %n\");\n        for (int\
  \ i = 0; i < pn; i++)\n            System.out.print(\"–\");\n        con.printf(\"\
  %n\");\n        for (x = 0; x < 5.1; ){\n            hsin = new Hysin();\n     \
  \       hcos = new Hycos();\n            sinh = hsin.Hypfun(x);\n            cosh\
