  \n**图 13.3** 程序 13.1 的输出屏幕\n\n### 13.1.2 使用 + 进行字符串拼接\n\n字符串拼接有多种方法。一种方法是使用 `+`\
  \ 运算符。在 Java 中，当 `+` 运算符用于字符串时，它会将操作数字符串进行拼接。\n\n示例：\n\n1. `String s1 = \"this is\
  \ demo\" + \"text\";`\n\n`String s1` 将占据 \n\n`s1 = \"This is a demo text\".`\n\n\
  2. `int mark = 75;`\n\n`String s2 = \"Your mark is \" + mark;`\n\n`System.out.println(s2);`\n\
  \n上述代码将输出：\n\n**Your mark is 75**\n\n`+` 运算符可以与字符串和数值型变量一起使用。在这种情况下，数值值会被转换为 `String`\
  \ 类型并附加到前一个 `String` 对象之后。以下是字符串拼接的更多示例：\n\n3. `String s1 = \"Do it\";`\n\n`String\
  \ s2 = \"by yourself\";`\n\n`String s3 = s1 + s2;`\n\n`System.out.println(s3)`\n\
  \n上述语句将产生以下结果：\n\n**Do it by yourself.**\n\n4. `System.out.println (\"Sum of 3 and\
  \ 5 is \" + 3+5):`\n\n该语句将产生以下结果：\n\n**Sum of 3 and 5 is 35**\n\n5. `System.out.println\
  \ (\"Sum of 3 and 5 is\" + (3+5));` 该语句将产生以下结果：\n\n**Sum of 3 and 5 is 8**\n\n从上述示例\
  \ 4 和 5 可以看出，在将字符串与数值类型进行拼接时，必须遵守运算符的优先级。\n\n`String` 对象有许多实用的方法，其中一些在表 13.1 中给出。\n\
