  \ 接口 (INTERFACES)\n\n### 9.4.1 定义接口\n\n接口与 `abstract` 类相似，但在功能上有所不同。接口定义没有主体的方法。接口不能拥有实例变量。但它可以包含\
  \ `final` 变量，这些变量必须用值初始化。方法可以具有类型签名。接口有助于实现 Java 中的多继承。定义 `interface` 的通用形式为：\n\n\
  ```java\nmodifier interface ifname {\n    final type var1 = val1;\n    final type\
  \ var2 = val2;\n    modifier return_type mname1(type signature1) ;\n    modifier\
  \ return_type mname2(type signature2);\n}\n```\n\n在这里，修饰符可以是 `public` 或不加修饰符。`var1`、`var2`\
  \ 是 `final` 变量，`val1` 和 `val2` 是值。`ifname` 是 `interface` 的名称，`mname1` 和 `mname2`\
  \ 是方法名。当 `interface` 被声明为 `public` 时，任何其他类都可以使用它。接口定义的示例：\n\n```java\n// interface\
  \ 示例\ninterface Calculation{\n    final double pi=3.142;\n    double Area( r);\n\
  }\n```\n\n### 9.4.2 实现接口\n\n一旦定义了 `interface`，另一个类应该实现该接口的所有方法。接口可以被多个类实现。一个类可以实现多个接口。实现接口的通用形式为：\n\
  \n```java\nmodifier class classname [extends superclass] implements interface1,\
  \ interface2 {\n    body;\n}\n```\n\n在这里修饰符可以是 `public` 或不加修饰符。`interface1`、`interface2`\
  \ 是接口。\n\n\n\n\n\n}\n\n上述程序给如图 9.7 所示的结果。\n\n![](img/00116.jpeg)\n\n**图 9.7** 程序\
  \ 9.4 的输出屏幕\n\n读完本章后，你应该已经学习了以下内容：\n\n*   `package` 语句表示文件在目录中的位置。\n*   要引用和访问包中的类，使用\
  \ `import` 语句。\n*   `Access modifier`（访问修饰符）实现了数据封装属性。\n*   `Access modifiers`（访问修饰符）对数据和方法提供不同的保护。\n\
  *   `Interfaces`（接口）允许以多种不同的方式实现预定义的概念方法。\n*   通过 `interfaces` 可以实现多重继承。\n\n在下一章中，你将学习包装类。\n\
