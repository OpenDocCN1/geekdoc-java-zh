  \n## 12.3 字节流 (BYTE STREAM)\n\n在字节流中，数据作为字节序列被访问。除了字符或文本以外的所有类型都在此流中进行处理。如前所述，此流有两个抽象类：`InputStream`\
  \ 和 `OutputStream`。由于 `InputStream` 和 `OutputStream` 是抽象类，因此无法创建此类类型的对象。但是可以声明此类类型的对象引用。这两个类具有抽象方法和具体方法。抽象方法在子类中实现。\n\
  \n### 12.3.1 InputStream\n\n`InputStream` 具有表 12.2 所示的方法。这些方法用于从输入流输入字节。所有方法都可能抛出\
  \ `IOException`。\n\n**表 12.2** `InputStream` 中定义的方法\n\n| *方法* | *方法的目的* |\n| :---\
  \ | :--- |\n| 1. | `abstract int read()` | 读取一个字节并返回该字节的整型表示；在流的末尾返回 –1 |\n| 2.\
  \ | `int read(byte b[])` | 读取内容到字节数组 `b` 中并返回读取的字节数；最多读取 `b.length` 个字节，在流的末尾返回\
  \ –1 |\n| 3. | `int read(byte b[], int off , int len)` | 从 `b[off ]` 开始读取 `len`\
  \ 个字节到字节数组 `b` 中并返回读取的字节数；在流的末尾返回 –1 |\n| 4. | `int available()` | 返回可读取的字节数 |\n\
  | 5. | `void close()` | 关闭输入流 |\n| 6. | `void mark(int marklen)` | 在当前位置放置标记，直到读取了\
  \ `marklen` 个字节后才标记 |\n| 7. | `boolean markSupported()` | 如果流支持 `mark()` 则返回 true\
  \ |\n| 8. | `void reset()` | 读取控制重置为之前设置的标记。后续的 `read()` 将重新读取这些字节 |\n| 9. | `long\
  \ skip(long m)` | 跳过输入流中的 `m` 个字节并返回实际跳过的字节数 |\n\n### 12.3.2 OutputStream\n\n抽象类\
  \ `OutputStream` 具有表 12.3 所示的方法。这些方法用于将字节发送到输出流。所有方法都可能抛出 `IOException`。\n\n**表\
  \ 12.3** `OutputStream` 中定义的方法\n\n| *方法* | *方法的目的* |\n| :--- | :--- |\n| 1. | `abstract\
  \ void write(int b)` | 向输出流写入单个字节 `b` |\n| 2. | `void write(byte b[])` | 向输出流写入字节数组\
  \ `b` |\n| 3. | `void write(byte b[], int off, int len)` | 从 `b [off]` 开始向输出流写入\
  \ `len` 个字节 |\n| 4. | `void flush()` | 刷新输出缓冲区；即，将任何缓冲的字节发送到其目的地 |\n| 5. | `void\
  \ close()` | 关闭输出流 |\n\n## 12.4 磁盘文件处理 (DISK FILE HANDLING)\n\n两个抽象类 `InputStream`\
  \ 和 `OutputStream` 有许多具体的子类，这些子类实现了抽象方法。只有创建这些子类的对象用于输入流和输出流。`FileInputStream` 和\
  \ `FileOutputStream` 分别是 `InputStream` 和 `OutputStream` 的子类。这两个用于处理磁盘文件。\n\n###\
  \ 12.4.1 FileInputStream\n\n该类用于从磁盘文件读取字节。`FileInputStream` 类具有以下构造函数：\n\n(i) `FileInputStream(String\
  \ filename)`\n使用 `filename` 中提到的文件创建文件输入流\n\n(ii) `FileInputStream(File fobject)`\n\
  使用对象 `fobject` 提供的信息创建文件输入流\n\n这两个构造函数都可能抛出 `FileNotFoundException`。\n\n除了表 12.2\
  \ 中给出的所有父类方法（`mark()`、`reset()` 和 `close()` 除外），所有方法都被此类类重写。此流中的方法只能读取一个字节或一个字节数组。因此，在此流中只能处理面向字节的数据。\n\
