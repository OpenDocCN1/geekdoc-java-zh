  ![](img/00093.jpeg)\n\n**图 8.1** 程序 8.2 的输出屏幕\n\n在上述程序中，关键字 `super` 指向父类构造函数 `Address()`。当在构造函数内部使用\
  \ `super()` 时，它必须是第一条语句。\n\n## 8.2 方法重写 (METHOD OVERRIDING)\n\n在构建子类时，除了继承自父类的方法外，它们可能拥有自己的方法。子类中的方法可能与父类具有相同的名称和类型签名。在这种情况下，子类的方法将重写父类中的方法。这被称为方法重写。方法重写体现了完全的多态性。以下程序\
  \ 8.3 阐了方法重写。\n\n程序 8.3![](img/00013.jpeg)\n\n```java\n/* 此程序演示方法重写概念。\n\n* 此程序需要\
  \ jdk1.6 或更高版本。\n\n* ka.somasundaram@gmail.com\n\n*/\n\nimport java.io.Console;\n\
  \nclass A {\n\ndouble result;\n\ndouble Process(double x, double y) {\n\nresult\
  \ = x * y;\n\nreturn result;\n\n}\n\n}\n\nclass B extends A {\n\ndouble Process(double\
  \ x, double y) {\n\nresult = x / y;\n\nreturn result;\n\n}\n\n}\n\nclass Override\
  \ {\n\npublic static void main(String args[]) {\n\ndouble p = 10.0, q = 4.0, aval,\
  \ bval;\n\nConsole con = System.console();\n\nA a = new A();\n\nB b = new B();\n\
  \naval = a.Process(p, q);\n\nbval = b.Process(p, q);\n\ncon.printf“\\n %4.1f and\
  \ %4.1f processed in A = %4.1f%n”, p, q, aval);\n\ncon.printf“\\n %4.1f and %4.1f\
  \ processed in B = %4.2f%n “, p, q, bval);\n\n}\n\n}\n```\n\n上述程序给出了如图 8.2 所示的输出。\n\
  \n![](img/00094.jpeg)\n\n**图 8.2** 程序 8.3 的输出屏幕\n\n在上述程序中，`Process()` 方法产生了两个不同的结果。方法的选择是在运行时完成的，被称为动态方法分发。\n\
  \nJava 支持所示的多级继承：\n\n![](img/00095.jpeg)\n\n**图 8.3** Java 中的多级继承\n\n利用这一原理，可以创建多级继承中的子类。\n\
  \n![](img/00011.jpeg) 子类中与父类方法具有相同名称和类型签名的方法被称为重写方法。重写方法体现了多态属性。\n\n## 8.3 FINAL\
  \ 类 (FINAL CLASS)\n\n继承允许创建子类。然而，如果有需要，可以通过将类声明为 `final` 来防止继承。声明为 `final` 的类不能有子类。以下程序\
  \ 8.4 显示了 `final` 类的用法：\n\n程序 8.4![](img/00013.jpeg)\n\n```java\n/* 此程序演示 final\
  \ 类。\n\n* 此程序需要 jdk1.6 或更高版本进行编译和执行。\n\n* ka.somasundaram@gmail.com\n\n*/\n\nimport\
  \ java.io.Console;\n\n// 这防止 Circle 的任何子类的创建\n\nfinal class FinCircle {\n\ndouble\
  \ radius;\n\nfinal double PHI = Math.PI;\n\nFinCircle(double r) {\n\nradius = r;\n\
  \n}\n\ndouble Area() {\n\nreturn PHI * radius * radius;\n\n}\n\ndouble Circum()\
  \ {\n\nreturn 2 * PHI * radius;\n\n}\n\n}\n\nclass FinalClass {\n\npublic static\
  \ void main(String args[]) {\n\ndouble ar, radius = 5.5, sar;\n\nConsole con = System.console();\n\
  \nFinCircle cir = new FinCircle(radius);\n\nar = cir.Area();\n\nsar = cir.Circum();\n\
  \ncon.printf“\\n Radius of the circle = %5.1f\\n” radius);\n\ncon.printf“\\n Area\
  \ of the circle = %5.1f\\n”, ar);\n\ncon.printf“\\n Circumference of the circle\
  \ = %5.1f\\n”, sar);\n\n}\n\n}\n```\n\n上述程序给出了如图 8.4 所示的输出。\n\n![](img/00096.jpeg)\n\
  \n**图 8.4** 程序 8.4 的输出屏幕\n\n## 8.4 FINAL 方法 (FINAL METHOD)\n\n类中的方法可以防止被子类中的方法重写。像\
  \ `final` 类一样，方法可以使用修饰符 `final` 进行声明。声明为 `final` 的方法在子类中不能有重写方法。以下程序 8.5 阐述了 `final`\
  \ 方法的用法：\n\n程序 8.5![](img/00013.jpeg)\n\n```java\n/* 此程序演示 final 方法。\n\n* 此程序需要\
  \ jdk1.6 或更高版本。\n\n* ka.somasundaram@gmail.com\n\n*/\n\nimport java.io.Console;\n\
  \nclass A {\n\ndouble result;\n\nfinal double Process(double x, double y) {\n\n\
  result = x * y;\n\nreturn result;\n\n}\n\n}\n\nclass B extends A {\n\n// 重写是不可能的\n\
  double Process(double x, double y) {\n\nresult = x / y;\n\nreturn result;\n\n}\n\
  \n}\n\nclass FinalMethod {\n\npublic static void main(String args[]) {\n\ndouble\
  \ p = 10.0, q = 4.0, aval, bval;\n\nConsole con = System.console();\n\nA a = new\
  \ A();\n\nB b = new B();\n\naval = a.Process(p, q);\n\nbval = b.Process(p, q);\n\
  \ncon.printf“\\n %4.1f and %4.1f processed in A = %4.1f%n”, p, q, aval);\n\ncon.printf“\\\
  n %4.1f and %4.1f processed in B = %4.2f%n “, p, q, bval);\n\n}\n\n}\n```\n\n上述程序给出了如图\
  \ 8.5 所示的输出。\n\n![](img/00097.jpeg)\n\n**图 8.5** 程序 8.5 的输出\n\n在大多数情况下，它是有效的，但无法保证每一个。\n\
  \n## 8.5 FINAL 变量 (FINAL VARIABLES)\n\n变量也可以被声明为 `final`。一旦声明了它们，就不能为其赋值新值。按照约定，`final`\
  \ 变量使用大写字母。以下是 `final` 的示例：\n\n`final int PASS_MARK` = 40\n`final int MINUTE_VAL`\
  \ = 60\n`final double INTEREST_RATE` = 12.5\n`final double UPPER_LIMIT` = 120\n\
  `final double PHI` = 3.14\n\n## 8.6 对象销毁与垃圾回收\n\n对象在创建时会占用空间。当对象不再被使用时，Java 会识别它们并释放内存。这被称为垃圾回收。Java\
  \ 中没有析构方法。在某些情况下，对象使用内存以外的内容，例如文件或系统资源。在这种情况下，必须小心释放资源。为了提供这种功能，Java 有 `finalize()`\
  \ 方法。该方法可以放在类内部。在对象被销毁之前，Java 会运行 `finalize()`。用户可以在 `finalize()` 中定义要执行的操作。尽管在大多数情况下它是有效的，但程序员必须找到其他方法来释放资源。\n\
  \n## 8.7 递归 (RECURSION)\n\n当方法调用其自身时，被称为递归。有些问题可以使用递归轻松地编写。递归方法需要栈内存。在时间上效率较低。Java\
  \ 支持递归方法。考虑计算给定数字阶乘的问题。寻找阶角的公式为：$n! = 1 \\times 2 \\times 3....n$\n\n上述公式可以写为：\n\
  $n! = n * (n–1)!$\n$n! = n * (n–1)*(n–2)!$\n$n! = n * (n–1)*(n–2)*(n–3)!$\n$等等.$\
  \ 最后 $0! = 1! = 1$。\n\n以下程序 8.6 使用递归方法实现了上述公式：\n\n程序 8.6![](img/00013.jpeg)\n\n\
  ```java\nimport java.io.Console;\n\nclass Factfun {\n\nlong Fact(int n) {\n\nif\
  \ (n == 0 || n == 1) {\n\nreturn 1;\n\n} else {\n\nreturn n * Fact(n – 1);\n\n}\n\
  \n}\n\n}\n\nclass Recursion {\n\npublic static void main(String args[]) {\n\nFactfun\
  \ f = new Factfun();\n\nConsole con = System.console();\n\ncon.printf“\\n Factorial\
  \ of 8 = %d\\n”, f.Fact(8));\n\ncon.printf“\\n Factorial of 12 = %d\\n”, f.Fact(12));\n\
  \n}\n\n}\n```\n\n\n\n\n}\n\n}\n\n上述程序给出了图 8.6 所示的输出。\n\n![](img/00098.jpeg)\n\n\
  **图 8.6** 程序 8.6 的输出屏幕\n\n## 8.8 静态方法、变量和块\n\n### 8.8.1 静态方法\n\n到为止，我们看到方法是在对象上调用的。也就是说，方法是相对于类的实例被调用的。Java\
  \ 提供了一种机制，可以在没有类实例的情况下调用方法。此类方法被称为 `static` 方法。静态方法使用修饰符 `static` 进行声明。例如，`main()`\
  \ 是一个 `static` 方法，因为它必须独立于任何对象进行运行。如果方法在同一个类中，可以直接调用静态方法；如果它在不同的类中，则可以通过指定类名和方法名来调用。调用\
  \ `static` 方法的一般形式是：\n\n`classname.static_method;`\n\n`static` 方法不能访问该类的任何实例变量。它不能在方法内部使用\
  \ `this` 或 `super`。它只能访问静态方法和 `static` 变量。\n\n以下程序 8.7 阐释了在同一类中使用 `static` 方法的方法：\n\
  \n程序 8.7![](img/00013.jpeg)\n\n```java\n/* 同一类内静态方法的示例。\n* 此程序需要 jdk1.6 或更高版本。\n\
  * ka.somasundaram@gmail.com\n*/\n\nimport java.io.Console;\n\nclass Stat {\n   \
  \ static void Add(int a, int b) {\n        Console con = System.console();\n   \
  \     int sum = a + b;\n        con.printf(“Sum of numbers = %d\\n”, sum);\n   \
  \ }\n\n    public static void main(String args[]) {\n        Add(5, 24);\n    }\n\
  }\n```\n\n上述程序的输出如图 8.7 所示。\n\n![](img/00099.jpeg)\n\n**图 8.7** 程序 8.7 的输出屏幕\n\n\
  以下程序 8.8 阐释了从不同类使用静态方法的方法：\n\n程序 8.8![](img/00013.jpeg)\n\n```java\n/* 此程序演示了在不同类中使用静态方法。\n\
  * 此程序需要 jdk1.6 或更高版本。\n* ka.somasundaram@gmail.com */\nimport java.io.Console;\n\
  \nclass Statc {\n    static void Add(int a, int b) {\n        Console con = System.console();\n\
  \        int sum = a + b;\n        con.printf(“Sum of numbers = %d\\n”, sum);\n\
  \    }\n}\n\nclass Static1 {\n    public static void main(String args[]) {\n   \
  \     Statc.Add(5, 24);\n    }\n}\n```\n\n上述程序得到的结果与之前的程序 8.7 相同。\n\n![](img/00011.jpeg)\
  \ 静态方法可以被直接调用。\n\n### 8.8.2 静态变量\n\nJava 的实例变量也可以声明为 `static`。当一个变量被声明为 `static`\
  \ 时，它就变成了类变量而不是对象变量。程序的任何部分都可以访问静态变量。即使创建了实例，`static` 变量也会保留最后修改的值。实际上，它变成了一个全局变量或类变量。\n\
  \n例如，考虑以下程序 8.9：\n\n程序 8.9![](img/00013.jpeg)\n\n```java\n/* 此程序演示了静态变量的使用。\n* 此程序编译和执行需要\
  \ jdk1.6 或更高版本。\n* ka.somasundaram@gmail.com\n*/\nimport java.io.Console;\n\nclass\
  \ Stat {\n    static int i = 0, j = 0;\n    void Printval() {\n        Console con\
  \ = System.console();\n        con.printf(“ i = %d%n”, i);\n        con.printf(“\
  \ j = %d%n”, j);\n    }\n}\n\nclass Statvar {\n    public static void main(String\
  \ args[]) {\n        Stat sv = new Stat();\n        Console con = System.console();\n\
  \        con.printf(“ Value of variables in the first object%n”);\n        sv.Printval();\n\
  \        sv.i = 10;\n        sv.j = 15;\n        con.printf(“ Value of variables\
  \ in the second object%n”);\n        Stat sv1 = new Stat();\n        sv1.Printval();\n\
  \    }\n}\n```\n\n上述程序给出了图 8.8 所示的输出。\n\n![](img/00100.jpeg)\n\n**图 8.8** 程序 8.9\
  \ 的输出屏幕\n\n在上述程序 8.9 中，如果我们将实例变量 `i` 和 `j` 声明为：\n`static int i=0, j=0;`\n在 `Statvar`\
  \ 类中，你将得到图 8.9 所示的结果。\n\n![](img/00101.jpeg)\n\n**图 8.9** 将 `i` 和 `j` 声明为静态后的程序\
  \ 8.9 输出屏幕\n\n你从上述结果中观察到，当变量 `i` 和 `j` 被声明为 `static` 时，它们保留了在第一个对象中设置的值，因此当创建第二个对象时，`i`\
  \ 和 `j` 保留了最后修改的值。\n\n![](img/00011.jpeg) 静态变量是类变量。静态方法可以修改静态变量，并反映在所有对象中。\n\n###\
  \ 8.8.3 静态块\n\n在某些情况下，可能只需要执行一次的语句。在 Java 中，这些语句可以放在类中，并独立于实例。这些被称为 `static` 块。在没有\
  \ `main` 方法的情况下，程序 8.10 演示了静态块。\n\n程序 8.10![](img/00013.jpeg)\n\n```java\n/* 此程序演示了静态块的使用。\n\
  * 此程序需要 jdk1.6 或更高版本。\n* ka.somasundaram@gmail.com\n*/\nimport java.io.Console;\n\
  \nclass Statblock {\n    void Printval() {\n        Console con = System.console();\n\
  \        con.printf(“%n Printval()”);\n    }\n    static {\n        Console con\
  \ = System.console();\n        con.printf(“%n static block”);\n    }\n}\n\nclass\
  \ Stblock {\n    public static void main(String args[]) {\n        Statblock sb\
  \ = new Statblock();\n        Console con = System.console();\n        con.printf(“%n\
  \ First object”);\n        sb.Printval();\n        Statblock sb1 = new Statblock();\n\
  \        Console con = System.console();\n        con.printf(“%n Second object”);\n\
  \        sb1.Printval();\n    }\n}\n```\n\n上述程序给出了图 8.10 所示的输出。\n\n![](img/00102.jpeg)\n\
  \n**图 8.10** 程序 8.10 的输出屏幕\n\n## 8.9 抽象类\n\n在继承层次结构中，我们看到向下移动时子类具有具体的实例变量和方法。同样，当我们向上移动时，类的共同属性可以抽象并定义在一个类中。这有助于在一个类中处理复杂问题。例如，考虑几何形状：圆、矩形和平行四边形。它们都有面积和周长等共同属性。这些共同属性可以被抽象到一个公共类\
  \ `Shape` 中，并带有计算面积和周长的方法。但由于计算面积和周长的公式不同，这些方法没有具体的实现体。\n\n![](img/00103.jpeg)\n\
  \n**图 8.11** 将多个类的共同点抽象到公共类\n\n因此，方法可以在没有主体的情况下定义。Java 定义没有主体的方法，这些被称为 `abstract`\
  \ 方法。抽象方法使用 `abstract` 关键字定义。包含至少一个 `abstract` 方法的类被称为 `abstract` 类。由于抽象类没有具体的方法，因此无法创建抽象类的对象。然而，可以创建抽象类的对象引用变量。此外，当定义一个抽象类时，该抽象类的子类必须提供具体的方法。否则，子类也将成为一个\
  \ `abstract` 类。以下程序 8.11 包含一个抽象类和一个抽象方法：\n\n程序 8.11![](img/00013.jpeg)\n\n```java\n\
  /* 此程序演示了抽象类和抽象方法。\n* 此程序编译和执行需要 jdk1.6 或更高版本。\n* ka.somasundaram@gmail.com\n*/\n\
  import java.io.Console;\n\nabstract class Shape {\n    double area;\n    final double\
  \ PHI = Math.PI;\n    abstract double Area(); // 抽象方法\n}\n\nclass Circle extends\
  \ Shape {\n    double radius;\n    Circle(double r) {\n        radius = r;\n   \
  \ }\n\n    double Area() {\n        area = PHI * radius * radius;\n        return\
  \ area;\n    }\n}\n\nclass Abstractclass {\n    public static void main(String args[])\
  \ {\n        Console con = System.console();\n        Circle cir = new Circle(4.0);\n\
  \        double ar;\n        ar = cir.Area();\n    }\n}\n```\n\n\n\n```java\ncon.printf(“Area\
  \ of the circle = %6.2f%n”, ar);\n}\n\n}\n```\n\n上述程序给出了图 8.12 所示的输出。\n\n![](img/00104.jpeg)\n\
  \n**图 8.12** 程序 8.11 的输出屏幕\n\n![](img/00011.jpeg) 一个没有方法体的方法的方法被称为**抽象方法**（abstract\
  \ method）。包含抽象方法的类被称为**抽象类**（abstract class）。\n\n## 8.10 数学方法\n\n对于工程和科学计算，需要许多基础数学函数，如\
