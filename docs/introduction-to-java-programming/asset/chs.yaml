  </APPLET>\n```\n\n### CODEBASE\n它定义了包含 applet 代码的 URL。如果未定义 `CODEBASE`，则使用 HTML\
  \ 文档的 URL。\n\n### CODE\n它指定了 applet 类文件的名称。这是一个强制性要求。该文件相对于 HTML 文档的代码库 URL，或者由\
  \ `CODEBASE` 指定。\n\n### ARCHIVE\n它指定了存档文件（`JAR`）文件名。当执行 applet 时需要一组文件时，可以使用它。\n\
  \n### ALT\n它指定了当浏览器可以理解 `applet 标签` 但无法执行 applet 时要显示的文本。这是一个可选属性。\n\n### NAME\n\
  它指定了 applet 实例的名称。名称可以帮助一个 applet 在同一页面上找到另一个 applet 并与之通信。这是一个可选属性。\n\n### WIDTH\
  \ and HEIGHT\n这指定了 applet 显示区域的宽度和高度。以像素为单位给出，且为整数。\n\n### ALIGN\n它指定了 applet 在网页中的对齐方式。预定义的值有\
  \ `LEFT`（左对齐）、`RIGHT`（右对齐）、`TOP`（顶部）、`BOTTOM`（底部）、`MIDDLE`（居中）、`BASELINE`（基线）、`TEXTTOP`（文本顶部）、`ABSMIDDLE`（绝对居中）和\
  \ `ABSBOTTOM`（绝对底部）。\n\n### PARAMNAME and VALUE\n可以定义参数，并赋予其名称和值。`PARAM` 声明它是一个参数，`NAME`\
  \ 声明参数名称，`VALUE` 指定由 `NAME` 定义的变量可以取的值。可以使用 `getParameter()` 方法将值传递给 applet。这是一个可选属性。\n\
