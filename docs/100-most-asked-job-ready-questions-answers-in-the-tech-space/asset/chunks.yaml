    WHERE is used to filter rows before grouping in a query, while HAVING is used
    to filter grouped rows after grouping.


    34.


    What is the difference between a database and a data warehouse?


    a.


    A database is a collection of related data organized for transactional purposes,
    while a data warehouse is a large repository of data organized for analytical
    purposes.


    35.


    What is the difference between a primary key and a candidate key?


    a.


    A candidate key is a column or a set of columns that can uniquely identify each
    record in a table. A primary key is a chosen candidate key that becomes the main
    identifier for the table.


    36.


    What is the difference between a schema and a database?


    a.


    A database is a collection of related data, while a schema is a logical container
    within a database that holds objects like tables, views, and procedures.


    37.


    What is a self-join?


    a.


    A self-join is a join operation where a table is joined with itself. It is used
    when you want to compare rows within the same table.


    38.


    What is a recursive SQL query?


    a.


    A recursive SQL query is a query that refers to its own output in order to perform
    additional operations. It is commonly used for hierarchical or tree-like data
    structures.


    39.


    What is the difference between a correlated subquery and a nested subquery?


    a.


    A correlated subquery is a subquery that references columns from the outer query,
    while a nested subquery is a subquery that is independent of the outer query.


    40.


    What is the difference between a natural join and an equijoin?


    a.


    A natural join is a join operation that automatically matches columns with the
    same name from both tables, whereas an equijoin is a join operation that explicitly
    specifies the join condition using equality operators.


    41.


    What is the difference between an outer join and an inner join?


    a.


    An inner join returns only the matching rows from both tables, whereas an outer
    join returns all rows from one table and matching rows from the other table(s).


    42.


    What is the difference between a left join and a right join?


    a.


    A left join returns all rows from the left table and matching rows from the right
    table, whereas a right join returns all rows from the right table and matching
    rows from the left table.


    43.


    What is a full outer join?


    a.


    A full outer join returns all rows from both tables, including unmatched rows,
    and combines them based on the join condition.


    44.


    What is a self-referencing foreign key?


    a.


    A self-referencing foreign key is a foreign key that references the primary key
    of the same table. It is used to establish hierarchical relationships within a
    single table.


    45.


    What is the purpose of the GROUP BY clause?


    a.


    The GROUP BY clause is used to group rows based on one or more columns. It is
    typically used with aggregate functions to perform calculations on each group.


    46.


    What is the purpose of the HAVING clause?


    a.


    The HAVING clause is used to filter grouped rows based on specific conditions.
    It operates on the results of the GROUP BY clause.


    47.


    What is the purpose of the ORDER BY clause?


    a.


    The ORDER BY clause is used to sort the result set based on one or more columns
    in ascending or descending order.


    48.


    What is the purpose of the DISTINCT keyword?


    a.


    The DISTINCT keyword is used to retrieve unique values from a column in a result
    set, eliminating duplicate rows.


    49.


    What is the purpose of the LIKE operator?


    a.'
