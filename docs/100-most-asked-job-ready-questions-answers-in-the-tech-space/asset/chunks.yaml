    ## 第 4 章

    ### 100 道最高频的 JavaScript 求职面试题


    1. **Java 中的类（class）是什么？**

    回答：Java 将代码封装在各种类中，这些类定义了新的数据类型。这些新数据类型被用于创建对象。


    2. **什么是 JVM？**

    回答：`JVM` 是 Java 虚拟机，它是编译后的 `java` 类文件的运行环境。


    3. **在 Java 中表示价格的正确数据类型是什么？**

    回答：如果不考虑内存且性能不是至关重要的，使用 `BigDecimal`；否则，使用具有预定义精度的 `double`。


    4. **Java 支持多重继承吗？**

    回答：Java 不多重继承。


    5. **Java 编程语言支持哪些平台？**

    回答：Java 运行在多种平台上，例如 Windows、Mac OS 以及各种版本的 UNIX/Linux，如 HP-Unix、Sun Solaris、Red
    hat Linux、Ubuntu、Cent OS 等。


    6. **列出 Java 的五个特性？**

    回答：某些特性包括：

    - 面向对象

    - 平台无关

    - 健壮性

    - 解释型

    - 多线程


    7. **解释方法重载（method overloading）？**

    回答：当一个 Java 程序包含多个同名但属性不同的方法时，这种现象被称为方法重载。


    8. **对源文件内包语句（package statement）的位置施了哪些限制？**

    回答：包语句必须作为源文件的第一行出现（排除空行和注释）。


    9. **使用什么种方法来指定容器的布局？**

    回答：使用 `setLayout()` 方法来指定容器的布局。


    10. **Applet 类的直接父类是什么什么？**

    回答：`Panel` 类是 `Applet` 类的直接父类。


    11. **Java 中的访问修饰符（access modifiers）是哪些？**

    回答：有 3 种访问修饰符：`public`、`protected` 和 `private`。如果没有指定标识符，默认的称为友好的（friendly），但程序员不能显式地指定
    friendly。


    12. **什么是包（packages）？**

    回答：包是相关类和接口的集合，提供了访问保护和命名空间管理。


    13. **继承（Inheritance）是什么意思？它的优点是什么？**

    回答：继承是从类继承所有特性的过程。继承的优点是代码重用以及子类对变量和方法的访问权限。


    14. **可以在异常处理器中重新抛出异常吗？**

    回答：是的，我们可以在异常处理器中重新抛相同的异常。如果我们想从 catch 块抛出检查异常，我们需要声明该异常。


    15. **String 类型变量会自动初始化为什么值？**

    回答：`String` 类型的默认值是 `null`。


    16. **当线程阻塞 I/O 时，它会进入什么状态？**

    回答：当它阻塞 I/O 时，线程进入等待状态。


    17. **哪些容器使用 Flow Layout 作为默认布局？**

    回答：`Panel` 和 `Applet` 类使用 Flow Layout 作为默认布局。


    18. **解释 Java 常量的编码规范？**

    回答：Java 中的常量使用 `static` 和 `final` 关键字创建。

    1) 常量包含大写字母。

    2) 如果常量名是两个单词的组合，用下划线分隔。

    3) 常量名通常是名词。例如：`MAX_VALUE`、`MIN_VALUE`、`MAX_PRIORITY`、`MIN_PRIORITY`。


    19. **什么是同步（synchronization）？它为什么重要？**

    回答：同步是指控制多个线程访问共享资源的能力。它之所以重要是因为如果没有它，一个线程在另一个线程正在使用或更新该对象值时进行修改，这通常会导致严重的错误。


    20. **解释 Java 变量的编码规范？**

    回答：

    1) 变量名应以小字母开头。

    2) 变量名应该是名词。

    3) 推荐使用简洁意义的名字。

    4) 如果有多个单词，每个内部单词应大写字母开头。例如：`string`、`value`、`empName`、`MEP salary`。


    21. **什么是抽象类（abstract class）？**


