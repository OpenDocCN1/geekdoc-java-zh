    A clustered index determines the physical order of data in a table. Each table
    can have only one clustered index, and it is generally created on the primary
    key column(s).


    ### 15. What is a non-clustered index?

    A non-clustered index is a separate structure from the table that contains a sorted
    list of selected columns. It enhances the performance of searching and filtering
    operations.


    ### 16. What is the difference between a primary key and a unique key?

    A primary key is a column or a set of columns that uniquely identifies each record
    in a table and cannot contain NULL values. A unique key, on the other hand, allows
    NULL values and enforces uniqueness but does not automatically define the primary
    identifier of a table.


    ### 17. What is ACID in database transactions?

    ACID stands for Atomicity, Consistency, Isolation, and Durability. It is a set
    of properties that ensure reliability and integrity in database transactions.


    ### 18. What is the difference between UNION and UNION ALL?

    `UNION` combines the result sets of two or more `SELECT` statements and removes
    duplicates, whereas `UNION ALL` combines the result sets without removing duplicates.


    ### 19. What is a view?

    A view is a virtual table derived from one or more tables. It does not store data
    but provides a way to present data in a customized or simplified manner.


    ### 20. What is a stored procedure?

    A stored procedure is a precompiled set of SQL statements that performs a specific
    task. It can be called and executed multiple times with different parameters.


    ### 21. What is a trigger?

    A trigger is a set of SQL statements that are automatically executed in response
    to a specific event, such as `INSERT`, `UPDATE`, or `DELETE` operations on a table.


    ### 22. What is a transaction?

    A transaction is a logical unit of work that consists of one or more database
    operations. It ensures that all operations within the transaction are treated
    as a single unit, either all succeeding or all failing.


    ### 23. What is a deadlock?

    A deadlock is a situation where two or more transactions are unable to proceed
    because each is waiting for a resource held by another transaction. This can result
    in a perpetual wait state.


    ### 24. What is the difference between CHAR and VARCHAR data types?

    `CHAR` is a fixed-length character data type that stores a specific number of
    characters, while `VARCHAR` is a variable-length character data type that stores
    a varying number of characters.


    ### 25. What is the difference between a function and a stored procedure?

    A function returns a value and can be used in SQL statements, whereas a stored
    procedure does not return a value directly but can perform various actions.


    ### 26. What is the difference between GROUP BY and HAVING clauses?

    `GROUP BY` is used to group rows based on one or more columns, while `HAVING`
    is used to filter grouped rows based on specific conditions.


    ### 27. What is the difference between a database and a schema?

    A database is a collection of related data that is stored and organized. A schema,
    on the other hand, is a logical container within a database that holds objects
    like tables, views, and procedures.


    ### 28. What is a data warehouse?

    A data warehouse is a large repository of data collected from various sources,
    structured and organized to support business intelligence and reporting.


    ### 29. What is the difference between OLTP and OLAP?

    `OLTP` (Online Transaction Processing) is used for day-to-day transactional operations
    and focuses on real-time processing. `OLAP` (Online Analytical Processing) is
    used for complex analytical queries and focuses on historical data analysis.


    ### 30. What is a correlated subquery?

    A correlated subquery is a subquery that references columns from the outer query.
    It is executed for each row of the outer query, making it dependent on the outer
    query''s results.


    ### 31. What is the difference between a temporary table and a table variable?

    A temporary table is a physical table that is created and used temporarily within
    a session or a specific scope, whereas a table variable is a variable with a structure
    similar to a table and exists only within the scope of a user-defined function
    or a stored procedure.


    ### 32. What is the difference between UNION and JOIN?

    `UNION` combines rows from two or more tables vertically, while `JOIN` combines
    columns from two or more tables horizontally based on related columns.


    ### 33. What is the difference between WHERE and HAVING clauses?

    `WHERE` is used to filter rows before grouping in a query, while `HAVING` is used
    to filter grouped rows after grouping.


    ### 34. What is the difference between a database and a data warehouse?

    A database is a collection of related data organized for transactional purposes,
    while a data warehouse is a large repository of data organized for analytical
    purposes.


    ### 35. What is the difference between a primary key and a candidate key?

    A candidate key is a column or a set of columns that can uniquely identify each
    record in a table. A primary key is a chosen candidate key that becomes the main
    identifier for the table.


    ### 36. What is the difference between a schema and a database?

    A database is a collection of related data, while a schema is a logical container
    within a database that holds objects like tables, views, and procedures.


    ### 37. What is a self-join?

    A self-join is a join operation where a table is joined with itself. It is used
    when you want to compare rows within the same table.


    ### 38. What is a recursive SQL query?

    A recursive SQL query is a query that refers to its own output in order to perform
    additional operations. It is commonly used for hierarchical or tree-like data
    structures.


    ### 39. What is the difference between a correlated subquery and a nested subquery?

    A correlated subquery is a subquery that references columns from the outer query,
    while a nested subquery is a subquery that is independent of the outer query.


    ### 40. What is the difference between a natural join and an equijoin?

    A natural join is a join operation that automatically matches columns with the
    same name from both tables, whereas an equijoin is a join operation that explicitly
    specifies the join condition using equality operators.


    ### 41. What is the difference between an outer join and an inner join?

    An inner join returns only the matching rows from both tables, whereas an outer
    join returns all rows from one table and matching rows from the other table(s).


    ### 42. What is the difference between a left join and a right join?

    A left join returns all rows from the left table and matching rows from the right
    table, whereas a right join returns all rows from the right table and matching
    rows from the left table.


    ### 43. What is a full outer join?

    A full outer join returns all rows from both tables, including unmatched rows,
    and combines them based on the join condition.


    ### 44. What is a self-referencing foreign key?

    A self-referencing foreign key is a foreign key that references the primary key
    of the same table. It is used to establish hierarchical relationships within a
    single table.


    ### 45. What is the purpose of the GROUP BY clause?

    The `GROUP BY` clause is used to group rows based on one or more columns. It is
    typically used with aggregate functions to perform calculations on each group.


    ### 46. What is the purpose of the HAVING clause?

    The `HAVING` clause is used to filter grouped rows based on specific conditions.
    It operates on the results of the `GROUP BY` clause.


    ### 47. What is the purpose of the ORDER BY clause?

    The `ORDER BY` clause is used to sort the result set based on one or more columns
    in ascending or descending order.


    ### 48. What is the purpose of the DISTINCT keyword?

    The `DISTINCT` keyword is used to retrieve unique values from a column in a result
    set, eliminating duplicate rows.


