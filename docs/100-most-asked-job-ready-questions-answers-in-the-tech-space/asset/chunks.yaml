    # What is event delegation in JavaScript?


    Event delegation is a technique where you attach an event listener to a parent
    element instead of individual child elements. It allows handling events efficiently,
    especially for dynamically added elements.


    ## 53. What is the purpose of the startsWith() method in JavaScript?


    The `startsWith()` method is used to check if a string starts with a specified
    substring. It returns true if the string starts with the substring, and false
    otherwise.


    ## 54. What is the purpose of the endsWith() method in JavaScript?


    The `endsWith()` method is used to check if a string ends with a specified substring.
    It returns true if the string ends with the substring, and false otherwise.


    ## 55. What is the purpose of the includes() method in JavaScript?


    The `includes()` method is used to check if a string contains a specified substring.
    It returns true if the substring is found, and false otherwise.


    ## 56. What is the purpose of the padStart() method in JavaScript?


    The `padStart()` method is used to pad the beginning of a string with a specified
    character until it reaches a desired length. It is often used for formatting purposes.


    ## 57. What is the purpose of the padEnd() method in JavaScript?


    The `padEnd()` method is used to pad the end of a string with a specified character
    until it reaches a desired length. It is often used for formatting purposes.


    ## 58. What is the purpose of the charAt() method in JavaScript?


    The `charAt()` method is used to retrieve the character at a specified index in
    a string. It returns the character at the specified index or an empty string if
    the index is out of range.


    ## 59. What is the purpose of the charCodeAt() method in JavaScript?


    The `charCodeAt()` method is used to retrieve the Unicode value of the character
    at a specified index in a string. It returns the Unicode value of the character
    or `NaN` if the index is out of range.


    ## 60. What is the purpose of the String.fromCharCode() method in JavaScript?


    The `String.fromCharCode()` method is used to create a string from a sequence
    of Unicode values. It allows converting Unicode values to their corresponding
    characters.


    ## 61. What is the purpose of the JSON.stringify() method in JavaScript?


    The `JSON.stringify()` method is used to convert a JavaScript object or value
    to a JSON string. It is commonly used for data serialization and communication
    with web servers.


    ## 62. What is the purpose of the JSON.parse() method in JavaScript?


    The `JSON.parse()` method is used to parse a JSON string and convert it into a
    JavaScript object or value. It is commonly used to deserialize JSON data received
    from a server.


    ## 63. What is the purpose of the encodeURIComponent() function in JavaScript?


    The `encodeURIComponent()` function is used to encode special characters in a
    URL component. It ensures that the component can be included in a URL without
    causing any parsing errors.


    ## 64. What is the purpose of the decodeURIComponent() function in JavaScript?


    The `decodeURIComponent()` function is used to decode URL-encoded components.
    It converts URL-encoded characters back to their original form.


    ## 65. What is the purpose of the Math.random() function in JavaScript?


    The `Math.random()` function is used to generate a random floating-point number
    between 0 (inclusive) and 1 (exclusive). It is often used to introduce randomness
    in JavaScript programs.


    ## 66. What is the purpose of the Math.floor() function in JavaScript?


    The `Math.floor()` function is used to round a number down to the nearest integer.
    It removes the decimal part of the number and returns the largest integer less
    than or equal to the given number.


    ## 67. What is the purpose of the Math.ceil() function in JavaScript?


    The `Math.ceil()` function is used to round a number up to the nearest integer.
    It increases the number to the next higher integer, regardless of the decimal
    part.


    ## 68. What is the purpose of the Math.round() function in JavaScript?


    The `Math.round()` function is used to round a number to the nearest integer.
    It rounds the number up or down based on the decimal part.


    ## 69. What is the purpose of the Math.max() function in JavaScript?


    The `Math.max()` function is used to find the largest number among a list of arguments.
    It returns the highest value passed as an argument.


    ## 70. What is the purpose of the Math.min() function in JavaScript?


    The `Math.min()` function is used to find the smallest number among a list of
    arguments. It returns the lowest value passed as an argument.


    ## 71. What is the purpose of the Math.pow() function in JavaScript?


    The `Math.pow()` function is used to calculate the power of a number. It takes
    a base and an exponent as arguments and returns the result of raising the base
    to the exponent.


    ## 72. What is the purpose of the Math.sqrt() function in JavaScript?


    The `Math.sqrt()` function is used to calculate the square root of a number. It
    returns the positive square root of the given number.


    ## 73. What is the purpose of the Math.abs() function in JavaScript?


    The `Math.abs()` function is used to calculate the absolute value of a number.
    It returns the magnitude of the number without considering its sign.


    ## 74. What is the purpose of the Math.floor() and Math.random() functions together?


    By combining `Math.floor()` and `Math.random()` functions, you can generate a
    random integer within a specified range. For example, `Math.floor(Math.random()
    * 10)` generates a random integer between 0 and 9.


    ## 75. What is the purpose of the Date() constructor in JavaScript?


    The `Date()` constructor is used to create a new JavaScript Date object that represents
    a specific date. It allows working with dates and performing various operations
    on them.


    ## 76. What is the purpose of the getFullYear() method in JavaScript Date objects?


    The `getFullYear()` method is used to retrieve the four-digit year value of a
    Date object. It returns the year as a four-digit number, such as 2023.


    ## 77. What is the purpose of the getMonth() method in JavaScript Date objects?


    The `getMonth()` method is used to retrieve the month value of a Date object.
    It returns a zero-based index, where January is represented by 0 and December
    by 11.


    ## 78. What is the purpose of the getDate() method in JavaScript Date objects?


    The `getDate()` method is used to retrieve the day of the month value of a Date
    object. It returns the day as a number between 1 and 31.


    ## 79. What is the purpose of the getDay() method in JavaScript Date objects?


    The `getDay()` method is used to retrieve the day of the week value of a Date
    object. It returns a zero-based index, where Sunday is represented by 0 and Saturday
    by 6.


    ## 80. What is the purpose of the getHours() method in JavaScript Date objects?


    The `getHours()` method is used to retrieve the hour value of a Date object. It
    returns the hour as a number between 0 and 23.


    ## 81. What is the purpose of the getMinutes() method in JavaScript Date objects?


    The `getMinutes()` method is used to retrieve the minute value of a Date object.
    It returns the minute as a number between 0 and 59.


    ## 82. What is the purpose of the getSeconds() method in JavaScript Date objects?


    The `getSeconds()` method is used to retrieve the second value of a Date object.
    It returns the second as a number between 0 and 59.


    ## 83. What is the purpose of the getFullYear() and getMonth() methods together
    in JavaScript Date objects?


    By combining the `getFullYear()` and `getMonth()` methods, you can retrieve the
    full date in a human-readable format. For example:


    ```javascript

    const currentDate = new Date();

    const year = currentDate.getFullYear();

    const month = currentDate.getMonth();

    console.log(year + ''-'' + (month + 1));

    ```


    This will print the current year and month in the format ''YYYY-MM''.


    ## 84. What is the purpose of the setFullYear() method in JavaScript Date objects?


    The `setFullYear()` method is used to set the year value of a Date object. It
    allows modifying the year component of a date.


