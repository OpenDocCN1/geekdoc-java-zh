- fmt: '

    The `filter()` function is used to create a new array containing elements that
    pass a certain condition defined by a provided function. It allows filtering elements
    from an array based on specific criteria.


    ### 21. What is the purpose of the `reduce()` function in JavaScript?

    The `reduce()` function is used to reduce an array to a single value by applying
    a function to each element and accumulating the result. It is often used to perform
    calculations or transformations on arrays.


    ### 22. What is a callback function in JavaScript?

    A callback function is a function that is passed as an argument to another function
    and gets executed at a later time or in response to an event. It enables asynchronous
    and event-driven programming.


    ### 23. What is the difference between `let` and `var` in JavaScript?

    The `let` keyword declares block-scoped variables, while the `var` keyword declares
    function-scoped variables. Variables declared with `var` are hoisted, while variables
    declared with `let` are not.


    ### 24. What are JavaScript modules?

    JavaScript modules are reusable pieces of code that encapsulate related functionality.
    They allow for better organization, encapsulation, and code reuse in larger JavaScript
    applications.


    ### 25. What is object destructuring in JavaScript?

    Object destructuring is a feature that allows extracting properties from objects
    and assigning them to variables. It provides a concise way to extract values and
    work with object properties.


    ### 26. What are JavaScript classes?

    JavaScript classes are a way to define objects with shared properties and behaviors.
    They provide a template for creating multiple instances of objects with similar
    characteristics.


    ### 27. What is inheritance in JavaScript?

    Inheritance is a mechanism in JavaScript where an object can inherit properties
    and methods from another object. It allows for code reuse and creating hierarchical
    relationships between objects.


    ### 28. What are JavaScript getters and setters?

    Getters and setters are special methods used to get and set the values of object
    properties, respectively. They provide control over property access and enable
    data validation and encapsulation.


    ### 29. What is the purpose of the `try/catch` statement in JavaScript?

    The `try/catch` statement is used for error handling in JavaScript. It allows
    catching and handling exceptions that occur during the execution of a block of
    code.


    ### 30. What is the difference between `let` and `const` in JavaScript?

    The `let` keyword is used to declare variables that can be reassigned, while the
    `const` keyword is used to declare variables that are read-only and cannot be
    reassigned.


    ### 31. What is the purpose of the `forEach()` function in JavaScript?

    The `forEach()` function is used to execute a provided function once for each
    element in an array. It provides an easy way to iterate over array elements and
    perform operations on them.


    ### 32. What is the purpose of the `localStorage` object in JavaScript?

    The `localStorage` object allows web applications to store key-value pairs locally
    within the user''s browser. It provides a simple way to store and retrieve data
    persistently.


    ### 33. What are arrow functions? How are they different from regular functions?

    Arrow functions are a concise syntax for defining functions in JavaScript. They
    have a shorter syntax compared to regular functions and do not bind their own
    `this` value.


    ### 34. What is the purpose of the `setTimeout()` function in JavaScript?

    The `setTimeout()` function is used to schedule the execution of a function after
    a specified delay in milliseconds. It allows adding time-based delays to JavaScript
    code.


    ### 35. What is event bubbling in JavaScript?

    Event bubbling is a mechanism in which an event triggered on a specific element
    will also trigger the same event on all of its parent elements. It starts from
    the innermost element and propagates upwards in the DOM tree.


    ### 36. What is the purpose of the `fetch()` function in JavaScript?

    The `fetch()` function is used to make HTTP requests and fetch resources from
    the network. It provides a modern and flexible way to perform asynchronous network
    requests.


    ### 37. What is the difference between `null` and `undefined`?

    `null` is an explicitly assigned value that represents the absence of an object,
    while `undefined` is a value assigned by the JavaScript engine to variables that
    have been declared but have not been assigned a value.


    ### 38. What is event propagation in JavaScript?

    Event propagation is the process of an event being triggered on an element and
    then propagating to its parent elements or capturing down from its parent elements.
    It allows handling events at different levels of the DOM hierarchy.


    ### 39. What is the purpose of the `Object.keys()` function in JavaScript?

    The `Object.keys()` function is used to extract all the keys of an object and
    return them as an array. It provides an easy way to iterate over an object''s
    properties.


    ### 40. What is the difference between `null` and `undefined` in JavaScript?

    `null` is an assigned value that represents the intentional absence of an object
    value, while `undefined` represents an uninitialized or undefined value, often
    used as a default initial value.


    ### 41. What is the purpose of the `addEventListener()` method in JavaScript?

    The `addEventListener()` method is used to attach an event listener to an element.
    It allows you to listen for specific events and execute a function when the event
    is triggered.


    ### 42. What is the purpose of the `parentNode` property in JavaScript?

    The `parentNode` property is used to access the parent node of an element in the
    DOM. It allows traversal and manipulation of the DOM tree by accessing the immediate
    parent of an element.


    ### 43. What is the purpose of the `querySelector()` method in JavaScript?

    The `querySelector()` method is used to select the first element that matches
    a specified CSS selector. It provides a powerful way to retrieve elements from
    the DOM based on CSS selectors.


    ### 44. What is the purpose of the `querySelectorAll()` method in JavaScript?

    The `querySelectorAll()` method is used to select all elements that match a specified
    CSS selector. It returns a collection of elements that can be iterated over or
    accessed using indexing.


    ### 45. What is the difference between `querySelector()` and `getElementById()`?

    `querySelector()` is a more versatile method that allows selecting elements based
    on any CSS selector, while `getElementById()` is specifically used to select an
    element by its unique `id` attribute.


    ### 46. What is the difference between function declarations and function expressions
    in JavaScript?

    Function declarations are hoisted and can be called before they are defined, while
    function expressions are not hoisted and must be defined before they are called.


    ### 47. What is the purpose of the `bind()` method in JavaScript?

    The `bind()` method is used to create a new function with a specified `this` value
    and initial arguments. It allows explicit binding of the `this` value within a
    function.


    ### 48. What is the purpose of the `call()` method in JavaScript?

    The `call()` method is used to invoke a function with a specified `this` value
    and arguments provided individually. It allows borrowing methods from other objects
    and explicit invocation of functions.


    ### 49. What is the purpose of the `apply()` method in JavaScript?

    The `apply()` method is used to invoke a function with a specified `this` value
    and arguments provided as an array or an array-like object. It allows borrowing
    methods from other objects and explicit invocation of functions.


    ### 50. What is the purpose of the `Array.isArray()` method in JavaScript?

    The `Array.isArray()` method is used to determine whether a given value is an
    array or not. It returns true if the value is an array, and false otherwise.


    ### 51. What is event capturing in JavaScript?

    Event capturing is the process of an event being triggered on an element''s parent
    elements first, before reaching the target element. It allows capturing events
    at the outermost level of the DOM hierarchy.

