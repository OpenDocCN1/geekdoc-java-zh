- fmt: "\n### 80. Explain creating threads by implementing Runnable class?\nAnswer:\
    \ This is the first and foremost way to create threads. By implementing the `Runnable`\
    \ interface and implementing the `run()` method we can create a new thread. Method\
    \ signature: `public void run()`. `run` is the starting point for execution for\
    \ another thread within our program.\nExample:\n```java\npublic class MyClass\
    \ implements Runnable {\n    @Override\n    public void run()\n}\n```\n\n### 81.\
    \ When do we use synchronized methods in java?\nAnswer: If multiple threads try\
    \ to access a method where the method can manipulate the state of the object,\
    \ in such a scenario we can declare a method as `synchronized`.\n\n### 82. Can\
    \ we cast any other type to Boolean Type with type casting?\nAnswer: No, we can\
    \ neither cast any other primitive type to `Boolean` data type nor can cast `Boolean`\
    \ data type to any other primitive data type.\n\n### 83. What are synchronized\
    \ methods and synchronized statements?\nAnswer: Synchronized methods are methods\
    \ that are used to control access to an object. A `synchronized` statement can\
    \ only be executed after a thread has acquired the lock for the object or class\
    \ referenced in the `synchronized` statement.\n\n### 84. Explain the importance\
    \ of finally block in java?\nAnswer: `finally` block is used for cleaning up of\
    \ resources such as closing connections, sockets, etc. if `try` block executes\
    \ with no exceptions then `finally` is called after `try` block without executing\
    \ `catch` block. If there is an exception thrown in `try` block `finally` block\
    \ executes immediately after the `catch` block. If an exception is thrown, `finally`\
    \ block will be executed even if the no `catch` block handles the exception.\n\
    \n### 85. Can we catch more than one exception in a single catch block?\nAnswer:\
    \ From Java 7, we can catch more than one exception with a single `catch` block.\
    \ This type of handling reduces the code duplication. Note: When we catch more\
    \ than one exception in a single `catch` block, `catch` parameter is implicitly\
    \ `final`. We cannot assign any value to `catch` parameter. Ex: `catch(ArrayIndexOutOfBoundsException\
    \ | ArithmeticException e)`\nIn the above example, `e` is `final` we cannot assign\
    \ any value or modify `e` in the `catch` statement.\n\n### 86. What are abstract\
    \ methods in java?\nAnswer: An abstract method is a method which doesn’t have\
    \ anybody body. An `abstract` method is declared with keyword `abstract` and semicolon\
    \ in place of the method body. Signature: `public abstract void ();` Ex: `public\
    \ abstract void getDetails();`. It is the responsibility of subclass to provide\
    \ implementation to an `abstract` method defined in the `abstract` class.\n\n\
    ### 87. State some situations where exceptions may arise in java?\nAnswer: \n\
    1) Accessing an element that does not exist in the array.\n2) Invalid conversion\
    \ of number to string and string to a number (`NumberFormatException`).\n3) The\
    \ invalid casting of class (`ClassCastException`).\n4) Trying to create an object\
    \ for interface or abstract class (`InstantiationException`).\n\n### 88. What\
    \ is an exception in java?\nAnswer: In java, an exception is an object. Exceptions\
    \ are created when abnormal situations arise in our program. Exceptions can be\
    \ created by `JVM` or by our application code. All `Exception` classes are defined\
    \ in `java.lang`. In other words, we can say `Exception` as a run time error.\n\
    \n### 89. What is an error in Java?\nAnswer: Error is the subclass of `Throwable`\
    \ class in java. When errors are caused by our program we call that as `Exception`,\
    \ but some times exceptions are caused due to some environmental issues such as\
    \ running out of memory. In such cases, we can’t handle the exceptions. Exceptions\
    \ which cannot be recovered are called as errors in java. Ex: `OutOfMemory` issues.\n\
    \n### 90. What are the advantages of Exception handling in java?\nAnswer: \n1)\
    \ Separating normal code from exception handling code to avoid abnormal termination\
    \ of the program.\n2) Categorizing into different types of `Exceptions` so that\
    \ rather than handling all exceptions with `Exception` root class we can handle\
    \ with specific exceptions. It is recommended to handle exceptions with specific\
    \ `Exception` instead of handling with `Exception` root class.\n3) Call stack\
    \ mechanism: If a method throws an exception and it is not handled immediately,\
    \ then that exception is propagated or thrown to the caller of that method. This\
    \ propagation continues till it finds an appropriate exception handler, if it\
    \ finds handler it would be handled otherwise program terminates Abruptly.\n\n\
    ### 91. What’s the difference between constructors and other methods?\nAnswer:\
    \ Constructors must have the same name as the class and can not return a value.\
    \ They are only called once while regular methods could be called many times.\n\
    \n### 92. Is there any limitation of using Inheritance?\nAnswer: Yes, since inheritance\
    \ inherits everything from the super class and interface, it may make the subclass\
    \ too clustering and sometimes error-prone when dynamic overriding or dynamic\
    \ overloading in some situation.\n\n### 93. Where and how can you use a private\
    \ constructor?\nAnswer: Private constructor is used if you do not want other classes\
    \ to instantiate the object and to prevent subclassing.\n\n### 94. What is type\
    \ casting?\nAnswer: Type casting means treating a variable of one type as though\
    \ it is another type.\n\n### 95. What is the difference between the `>>` and `>>>`\
    \ operators?\nAnswer: The `>>` operator carries the sign bit when shifting right.\
    \ The `>>>` zero-fills bits that have been shifted out.\n\n### 96. What is the\
    \ difference between inner class and nested class?\nAnswer: When a class is defined\
    \ within a scope of another class, then it becomes inner class. If the access\
    \ modifier of the inner class is `static`, then it becomes nested class.\n\n###\
    \ 97. Can you call one constructor from another if a class has multiple constructors?\n\
