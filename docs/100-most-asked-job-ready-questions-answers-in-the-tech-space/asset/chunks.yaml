    The `LIKE` operator is used in a `WHERE` clause to search for a specified pattern
    in a column. It allows wildcard characters like `%` (matches any sequence of characters)
    and `_` (matches any single character).


    ### 50. What is the purpose of the `IN` operator?

    a. The `IN` operator is used in a `WHERE` clause to check if a value matches any
    value in a list or a subquery.


    ### 51. What is the purpose of the `BETWEEN` operator?

    a. The `BETWEEN` operator is used in a `WHERE` clause to check if a value lies
    within a specified range of values, inclusive of the endpoints.


    ### 52. What is the purpose of the `EXISTS` operator?

    a. The `EXISTS` operator is used in a `WHERE` clause to check if a subquery returns
    any rows. It returns true if the subquery result set is not empty.


    ### 53. What is the purpose of the `COUNT()` function?

    a. The `COUNT()` function is used to count the number of rows or non-null values
    in a column.


    ### 54. What is the purpose of the `SUM()` function?

    a. The `SUM()` function is used to calculate the sum of values in a column.


    ### 55. What is the purpose of the `AVG()` function?

    a. The `AVG()` function is used to calculate the average value of a column.


    ### 56. What is the purpose of the `MAX()` function?

    a. The `MAX()` function is used to retrieve the maximum value from a column.


    ### 57. What is the purpose of the `MIN()` function?

    a. The `MIN()` function is used to retrieve the minimum value from a column.


    ### 58. What is the purpose of the `GROUP_CONCAT()` function?

    a. The `GROUP_CONCAT()` function is used to concatenate values from multiple rows
    into a single string, grouped by a specific column.


    ### 59. What is the purpose of the `JOIN` keyword?

    a. The `JOIN` keyword is used to combine rows from two or more tables based on
    related columns.


    ### 60. What is a self-referencing table?

    a. A self-referencing table is a table that has a foreign key column referencing
    its own primary key. It is used to represent hierarchical relationships within
    a single table.


    ### 61. What is the difference between `UNION` and `UNION ALL`?

    a. `UNION` combines the result sets of two or more `SELECT` statements and removes
    duplicate rows, whereas `UNION ALL` combines the result sets without removing
    duplicates.


    ### 62. What is the purpose of the `ROW_NUMBER()` function?

    a. The `ROW_NUMBER()` function assigns a unique sequential number to each row
    within a result set. It is often used for pagination or ranking purposes.


    ### 63. What is the purpose of the `RANK()` function?

    a. The `RANK()` function assigns a rank to each row within a result set based
    on a specified criteria, such as ordering by a column. It allows you to identify
    the ranking of each row.


    ### 64. What is the purpose of the `DENSE_RANK()` function?

    a. The `DENSE_RANK()` function is similar to the `RANK()` function but assigns
    consecutive ranks to rows without gaps. If two rows have the same rank, the next
    rank is skipped.


    ### 65. What is the purpose of the `LAG()` function?

    a. The `LAG()` function is used to access the value of a previous row within a
    result set based on a specified column. It allows you to compare values across
    adjacent rows.


    ### 66. What is the purpose of the `LEAD()` function?

    a. The `LEAD()` function is used to access the value of a subsequent row within
    a result set based on a specified column. It allows you to compare values across
    adjacent rows.


    ### 67. What is the purpose of the `COALESCE()` function?

    a. The `COALESCE()` function is used to return the first non-null value from a
    list of expressions. It is often used to provide a default value when a column
    value is null.


    ### 68. What is the purpose of the `CASE` statement?

    a. The `CASE` statement is used to perform conditional logic within a SQL statement.
    It allows you to evaluate multiple conditions and return different values based
    on the result.


    ### 69. What is the purpose of the `TRUNCATE TABLE` statement?

    a. The `TRUNCATE TABLE` statement is used to remove all rows from a table, while
    keeping the table structure intact.


    ### 70. What is the purpose of the `CONSTRAINT` keyword?

    a. The `CONSTRAINT` keyword is used to define rules for the data.


    ### 71. What is the purpose of `PRIMARY KEY` constraint?

    a. The `PRIMARY KEY` constraint is used to uniquely identify each row in a table.
    It cannot contain null values.


    ### 72. What is the purpose of `FOREIGN KEY` constraint?

    a. The `FOREIGN KEY` constraint is used to establish a relationship between two
    tables and ensure referential integrity.


    ### 73. What is the purpose of the `INDEX` keyword?

    a. The `INDEX` keyword is used to create an index on one or more columns to improve
    query performance.


    ### 74. What is the purpose of `CASCADE` keyword in a `FOREIGN KEY` constraint?

    a. The `CASCADE` keyword is used to specify that changes to the primary key should
    be propagated to the foreign key.


    ### 75. What is the purpose of the `UPDATE` statement?

    a. The `UPDATE` statement is used to modify existing records in a table.


    ### 76. What is the purpose of the `DELETE` statement?

    a. The `DELETE` statement is used to remove one or more records from a table.


    ### 77. What is the purpose of the `COMMIT` statement?

    a. The `COMMIT` statement is used to permanently save all changes made within
    a transaction.


    ### 78. What is the purpose of the `ROLLBACK` statement?

    a. The `ROLLBACK` statement is used to undo all changes made within a transaction.


    ### 79. What is the purpose of the `SAVEPOINT` statement?

    a. The `SAVEPOINT` statement is used to define a specific point within a transaction
    to which you can roll back.


    ### 80. What is the purpose of `CONSTRAINT` keyword in the `ALTER TABLE` statement?

    a. The `CONSTRAINT` keyword in the `ALTER TABLE` statement is used to add, modify,
    or drop constraints on columns within an existing table.


    ### 81. What is the purpose of `DISTINCT` keyword in the `SELECT` statement?

    a. The `DISTINCT` keyword in the `SELECT` statement is used to retrieve unique
    values from a column in the result set, eliminating duplicate rows.


    ### 82. What is the purpose of `AS` keyword in the `SELECT` statement?

    a. The `AS` keyword in the `SELECT` statement is used to assign an alias to a
    column or a table.


    ### 83. What is the purpose of the `ORDER BY` clause in the `SELECT` statement?

    a. The `ORDER BY` clause in the `SELECT` statement is used to sort the result
    set based on one or more columns in ascending or descending order.


    ### 84. What is the purpose of the `GROUP BY` clause in the `SELECT` statement?

    a. The `GROUP BY` clause in the `SELECT` statement is used to group rows based
    on one or more columns.


    ### 85. What is the purpose of the `HAVING` clause in the `SELECT` statement?

    a. The `HAVING` clause in the `SELECT` statement is used to filter grouped rows
    based on specific conditions.


    ### 86. What is the purpose of the `LIMIT` clause in the `SELECT` statement?

    a. The `LIMIT` clause is used to restrict the number of rows returned by the query.

