    # Python 中的装饰器（Decorators）是什么？


    Python 中的装饰器是一种在不直接修改其源代码的情况下，修改或增强函数或类行为的方法。装饰器被实现为包装在目标函数或类周围的函数，并为其添加额外的功能。


    ## 85. Python 中 @property 装饰器的作用是什么？


    Python 中的 `@property` 装饰器用于将一个方法定义为类属性的 getter（get）。它允许像访问普通属性一样访问该属性，同时在内部调用该
    getter 方法。


    ## 86. Python 中 @staticmethod 装饰器的作用是什么？


    Python 中的 `@staticmethod` 装饰器用于在类中定义静态方法。静态方法不需要类的实例即可调用，并且可以直接从类本身访问。


    ## 87. Python 中 @classmethod 装饰器的作用是什么？


    Python 中的 `@classmethod` 装饰器用于定义类方法。类方法将类本身作为第一个参数接收，允许它们访问和修改类级属性，并执行特定于类的操作。


    ## 88. Python 中的 lambda 函数是什么？


    Python 中的 `lambda` 函数是一种可以在单行内定义的匿名函数。它通常用于简单的、一次性的操作，并且不需要正式的 `def` 语句。


    ## 89. Python 中的模块（Modules）是什么？


    Python 中的模块是包含 Python 代码和定义的文件。它们可以被导入并用于其他 Python 程序，以提供可重用的功能。


    ## 90. Python 中的包（Packages）是什么？


    Python 中的包是将相关模块组织成目录层次结构的方法。它们允许对代码进行更好的组织和模块化，使得大型项目更易管理。


    ## 91. 包中 __init__.py 文件的作用是什么？


    包中的 `__init__.py` 文件作为该目录是一个 Python 包的指示。它可以是空的，也可以包含在导入包时执行的初始化代码。


    ## 92. Python 中 sys 模块的作用是什么？


    Python 中的 `sys` 模块提供了对特定于系统的参数和函数的访问权限。它允许与 Python 解释器进行交互，并提供有关运行时环境的信息。


    ## 93. Python 中 os 模块的作用是什么？


    Python 中的 `os` 模块提供了一种与操作系统交互的方法。它允许执行各种与文件和目录操作、进程管理以及环境变量相关的操作。


    ## 94. Python 中 datetime 模块的作用是什么？


    Python 中的 `datetime` 模块提供了处理日期和时间的类。它允许对日期和时间进行创建、格式化和执行操作。


    ## 95. Python 中 random 模块的作用是什么？


    Python 中的 `random` 模块提供了生成随机数的函数。它允许你生成随机整数、浮点数，并从列表中进行随机选择。


    ## 96. Python 中 json 模块的作用是什么？


    Python 中的 `json` 模块提供了处理 JSON（JavaScript 对象表示法）数据的函数。它允许将 Python 对象编码为 JSON 字符串，并将
    JSON 字符串解码为 Python 对象。


    ## 97. Python 中 pickle 模块的作用是什么？


    Python 中的 `pickle` 模块提供了用于对 Python 对象进行序列化和反序列化的函数。它允许你将 Python 对象转换为可以存储或传输的二进制格式，然后将它们恢复为对象。


    ## 98. Python 中的生成器（Generators）是什么？


    Python 中的生成器是可以暂停和恢复的函数，允许它们随时间产生一个值序列。它们是内存内存的，并且为迭代大型或无限序列提供了一种方便的方法。


    ## 99. Python 中 yield 关键字的作用是什么？


    Python 中的 `yield` 关键字用于生成器语境中。它允许生成器函数临时暂停并向调用者产生一个值，而不会丢失其内部状态。然后可以恢复生成器以从上次停止的地方继续执行。


    ## 100. Python 中 zip() 函数的作用是什么？


    Python 中的 `zip()` 函数用于将多个可迭代对象（如列表或元组）合并成单一的元组元组的可迭代对象。它将每个可迭代对象中的对应元素配对，并在最短的可迭代对象被耗尽时停止。


    # 第 2 章

    ## 100 道高频 SQL 职位面试题


    ### 1. 什么是 SQL？


    a. `SQL`（结构化查询语言）是一种用于管理关系型数据库的编程语言。它允许用户从数据库中存储、操作和检索数据。


    ### 2. SQL 语句有哪些不同的类型？


    a. SQL 语句可以分为三类：

    i. 数据定义语言 (DDL)：用于创建、修改和删除数据库对象。

    ii. 数据操作语言 (DML)：用于查询、插入、更新和删除数据。

    iii. 数据控制语言 (DCL)：用于控制数据库访问，授予或撤销权限。


    ### 3. 什么是主键（Primary Key）？


    a. 主键是表中用于唯一标识每条记录的列或列集合。它确保了数据的完整性并允许高效地检索数据。


    ### 4. 什么是外键（Foreign Key）？


    a. 外键是表中的一列或一组列，它引用另一个表的主键。它在两个表之间建立了关系。


    ### 5. 什么是复合键（Composite Key）？


    a. 复合键是由两个或多个列组成的主键。这些列共同唯一标识了表中的每条记录。


    ### 6. DELETE 和 TRUNCATE 之间的区别是什么？


    a. `DELETE` 是一种 DML 语句，用于从表中删除特定行；而 `TRUNCATE` 是一种 DDL 语句，用于删除表中的所有行并重置表。


    ### 7. 什么是子查询（Subquery）？


    a. 子查询是嵌套在另一个查询中的查询。它可以根据另一个表的值从一个表中检索数据或执行复杂的计算。


    ### 8. 子查询和连接（Join）之间的区别是什么？


    a. 子查询是嵌套在另一个查询中的查询，而连接用于根据相关列合并两个多个表的行。


    ### 9. 什么是自连接（Self-join）？


    a. 自连接是将表与其自身进行连接的操作。当你需要比较同一表内的行时，它是非常有用的。


    ### 10. JOIN 操作有哪些不同的类型？


    a. JOIN 操作类型有：

    i. `INNER JOIN`：返回两个表中匹配的行。

    ii. `LEFT JOIN`：返回左表的所有行以及右表的匹配行。

    iii. `RIGHT JOIN`：返回右表的所有行以及左表的匹配行。

    iv. `FULL JOIN`：返回两个表的所有行。


    ### 11. SQL 中的归一化（Normalization）是什么？


    a. 归一化是组织数据库数据以消除冗余和依赖问题的过程。它涉及将表分成更小、更易管理的实体。


    ### 12. 数据库归一化的不同范式有哪些？


    a. 不同的范式有：

    i. 第一范式 (1NF)：消除重复行并确保值的原子性。

    ii. 第二范式 (2NF)：确保每个非键列都依赖于整个主键。

    iii. 第三范式 (3NF)：确保每个非键列只依赖于主键，而不依赖于其他非键列。

    iv. 第四范式 (4NF)：消除多值依赖。

    v. 第五范式 (5NF)：消除连接依赖。


    ### 13. 什么是索引（Index）？


    a. 索引是一种提高数据库表数据检索速度的数据库结构。它允许对数据进行快速搜索、排序和过滤。


    ### 14. 什么是聚集索引（Clustered Index）？


    a.


