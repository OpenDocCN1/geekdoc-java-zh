  trans: "\n\n### 80. 解释通过实现 Runnable 类来创建线程？\n答案：这是创建线程的第一种也是主要的方法。通过实现 `Runnable`\
    \ 接口并实现 `run()` 方法，我们可以创建一个新线程。方法签名：`public void run()`。`run` 是程序中另一个线程执行的起始点。\n\
    示例：\n```java\npublic class MyClass implements Runnable {\n    @Override\n    public\
    \ void run()\n}\n```\n\n### 81. 在 Java 中我们何时使用同步方法（synchronized methods）？\n答案：如果多个线程尝试访问一个方法，且该方法可能会操作对象的状态，在这种情况下，我们可以将方法声明为\
    \ `synchronized`。\n\n### 82. 我们能通过类型转换将任何其他类型转换为 Boolean 类型吗？\n答案：不能，我们既不能将任何原始数据类型转换为\
    \ `Boolean` 数据类型，也不能将 `Boolean` 数据类型转换为任何其他原始数据类型。\n\n### 83. 什么是同步方法（synchronized\
    \ methods）和同步语句（synchronized statements）？\n答案：同步方法是用于控制对对象访问的方法。`synchronized`\
    \ 语句只有在线程获取了 `synchronized` 语句所引用的对象或类的锁后才能被执行。\n\n### 84. 解释 Java 中 finally 块的重要性？\n\
    答案：`finally` 块用于清理资源，例如关闭连接、套接字等。如果 `try` 块执行时没有异常，则 `finally` 在 `try` 块之后被调用，而不执行\
    \ `catch` 块。如果 `try` 块中抛出异常，`finally` 块会在 `catch` 块之后立即执行。如果抛出了异常，即使没有 `catch`\
    \ 块处理异常，`finally` 块也会执行。\n\n### 85. 我们可以在单个 catch 块中捕获多个异常吗？\n答案：从 Java 7 开始，我们可以用单个\
    \ `catch` 块捕获多个异常。这种处理方式减少了代码重复。注意：当我们在单个 `catch` 块中捕获多个异常时，`catch` 参数是隐式 `final`\
    \ 的。我们无法为 `catch` 参数分配任何值。例如：`catch(ArrayIndexOutOfBoundsException | ArithmeticException\
    \ e)`\n在上面的示例中，`e` 是 `final` 的，我们无法在 `catch` 语句中为 `e` 分配值或修改 `e`。\n\n### 86. Java\
    \ 中的抽象方法（abstract methods）是什么？\n答案：抽象方法是没有主体的方法。`abstract` 方法用 `abstract` 关键字声明，并用分号代替方法体。签名：`public\
    \ abstract void ();` 示例：`public abstract void getDetails();` 为 `abstract` 类中定义的\
    \ `abstract` 方法提供实现是子类的责任。\n\n### 87. 列举一些 Java 中可能出现异常的情况？\n答案： \n1) 访问数组中不存在的元素。\n\
    2) 数字到字符串以及字符串到数字的无效转换（`NumberFormatException`）。\n3) 类的无效强制转换（`ClassCastException`）。\n\
    4) 尝试为接口或抽象类创建对象（`InstantiationException`）。\n\n### 88. Java 中的异常（exception）是什么？\n\
    答案：在 Java 中，异常是一个对象。当程序出现异常时，就会创建异常。异常可以由 `JVM` 创建，也可以由应用程序代码创建。所有的 `Exception`\
    \ 类都定义在 `java.lang` 中。换句话说，我们可以把 `Exception` 视为运行时错误。\n\n### 89. Java 中的错误（error）是什么？\n\
    答案：Error 是 Java 中 `Throwable` 类的子类。当错误由我们的程序引起时，我们称之为 `Exception`，但有时异常是由环境问题（如内存耗尽）引起的。在这种情况下，我们无法处理这些异常。无法恢复的异常在\
    \ Java 中被称为错误。例如：`OutOfMemory` 问题。\n\n### 90. Java 中异常处理的优点是什么？\n答案： \n1) 将正常代码与异常处理代码分离，以避免程序的非正常终止。\n\
    2) 将异常分类为不同类型 `Exceptions`，这样我们就不用 `Exception` 根类处理所有异常，而是可以使用特定的异常进行处理。建议使用特定的\
    \ `Exception` 处理异常，而不是使用 `Exception` 根类。\n3) 调用栈机制：如果一个方法抛出异常且未被立即处理，则该异常将传播或抛给该方法的调用者。这种传播会一直持续直到找到合适的异常处理器，如果找到了句柄，异常就会被处理；否则程序将异常终止。\n\
    \n### 91. 构造函数（constructors）与其他方法之间的区别是什么？\n答案：构造函数的名称必须与类相同，且没有返回值。它们只会被调用一次，而普通方法可以被调用多次。\n\
    \n### 92. 使用继承（Inheritance）有什么局限性吗？\n答案：是的，由于继承继承了父类和接口的所有内容，它可能会导致子类过于臃肿，并且在某些情况下进行动态重写或动态重载时容易出错。\n\
    \n### 93. 何何以及如何使用私有构造函数（private constructor）？\n答案：如果你不希望其他类实例化对象并防止子类化，则使用私有构造函数。\n\
    \n### 94. 什么是类型转换（type casting）？\n答案：类型转换意味着将一种类型的变量视为另一种类型。\n\n### 95. `>>` 运算符和\
    \ `>>>` 运算符的区别是什么？\n答案：`>>` 运算符在右移时会保留符号位。`>>>` 运算符会将向右移出的位填充零。\n\n### 96. 内部类（inner\
    \ class）和嵌套类（nested class）的区别是什么？\n答案：当一个类被定义在另一个类的作用范围内时，它就变成内部类。如果内部类的访问修饰符是\
    \ `static`，则它变成嵌套类。\n\n### 97. 如果类有多个构造函数，可以从一个构造函数调用另一个吗？\n答案：可以，使用 `this()`\
    \ 语法。\n\n### 98. 为什么我们需要包装类（wrapper classes）？\n答案：当方法期望对象时，我们可以将其作为方法参数传递。它还提供了工具方法。\n\
    \n### 99. Java 允许默认参数（Default Arguments）吗？\n答案：不，Java 不允许默认参数。\n\n### 100. Java\
    \ 中什么数字以零开头？\n答案：八进制数字（Octal Numbers）在 Java 中以零开头表示，例如：`06`。\n\n### 结语\n总之，“100\
    \ Most Asked Job Ready Questions & Answers in the Tech Space”对于任何在竞争激烈的技术就业市场中导航的人来说都是宝贵的资产。这本书不仅提供了答案，还解释了其背后的原理，它让读者对基础技术概念有更深入的理解，使他们能够自信且胜任地应对面试。书中简洁的格式确保了忙碌的专业人士和积极求职者能够高效地准备面试，而无需在海量资源中筛选。无论你是应届毕业生，还是希望刷新知识的资深技术老兵，这本书都为你提供了在动态技术行业中成功所需的必备技能和知识。\n\
    \n在技术技能需求量大的时代，“100 Most Asked Job Ready Questions & Answers in the Tech Space”\
    \ 是一本必不可少的工具书，可以帮助你获得理想的技术工作并在职业中蓬勃发展。\n\n"
