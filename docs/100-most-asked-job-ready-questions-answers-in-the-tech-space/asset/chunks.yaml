    \n### 66. What will be the output of Round(3.7) and Ceil(3.7)?\nAnswer: `Round(3.7)`\
    \ returns `4` and `Ceil(3.7)` returns `4`.\n\n### 67. What is constructor in java?\n\
    Answer: A constructor is a special method used to initialize objects in the java.\
    \ we use constructors to initialize all variables in the class when an object\
    \ is created. As and when an object is created it is initialized automatically\
    \ with the help of constructor in java. We have two types of constructors: `Default\
    \ Constructor` and `Parameterized Constructor`.\n\n### 68. How can we find the\
    \ actual size of an object on the heap?\nAnswer: In Java, there is no way to find\
    \ out the actual size of an object on the heap.\n\n### 69. Can a variable be local\
