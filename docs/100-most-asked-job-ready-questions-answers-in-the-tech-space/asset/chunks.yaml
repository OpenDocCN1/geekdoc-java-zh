    `SELECT` 语句中的 `LIMIT` 子句用于限制查询返回的行数。它允许你指定要检索的最大行数。


    ### 87. `SELECT` 语句中 `OFFSET` 子句的作用是什么？

    a. `SELECT` 语句中的 `OFFSET` 子句与 `LIMIT` 子句结合使用，用于在开始返回结果集之前跳过指定数量的行。


    ### 88. `SELECT` 语句中 `JOIN` 关键字的作用是什么？

    a. `SELECT` 语句中的 `JOIN` 关键字用于根据相关列合并两个或多个表中的行。它允许你在单次查询中从多个表中检索数据。


    ### 89. `INNER JOIN` 的作用是什么？

    a. `INNER JOIN` 是一种连接操作，它根据指定的连接条件，从两个表中仅返回匹配的行。它合并了在连接列中具有匹配值的行。


    ### 90. `LEFT JOIN` 的作用是什么？

    a. `LEFT JOIN` 是一种连接操作，它根据指定的连接条件返回左表的所有行以及右表的匹配行。如果没有找到匹配项，则右表列将返回空值（null）。


    ### 91. `RIGHT JOIN` 的作用是什么？

    a. `RIGHT JOIN` 是一种连接操作，它根据指定的连接条件返回右表的所有行以及左表的匹配行。如果没有找到匹配项，则左表列将返回空值（null）。


    ### 92. `FULL OUTER JOIN` 的作用是什么？

    a. `FULL OUTER JOIN` 是一种连接操作，返回两个表的所有行（包括不匹配的行），并根据连接条件将它们合并。如果没有找到匹配项，则相应的列将返回空值（null）。


    ### 93. `UNION` 运算符的作用是什么？

    a. `UNION` 运算符用于将两个或多个 `SELECT` 语句的结果集合并为一个单一的结果集。它会移除最终结果集中的重复行。


    ### 94. `UNION ALL` 运算符的作用是什么？

    a. `UNION ALL` 运算符用于将两个或多个 `SELECT` 语句的结果集合并为一个单一的结果集，包含重复行。


    ### 95. `WHERE` 子句中 `LIKE` 运算符的作用是什么？

    a. `LIKE` 运算符在 `WHERE` 子句中用于在列中搜索指定的模式。它允许使用通配符，如 `%`（匹配任何字符序列）和 `_`（匹配任何单个字符）。


    ### 96. `WHERE` 子句中 `IN` 运算符的作用是什么？

    a. `IN` 运算符在 `WHERE` 子句中用于检查某个值是否匹配列表或子查询中的任何值。


    ### 97. `WHERE` 子句中 `EXISTS` 运算符的作用是什么？

    a. `EXISTS` 运算符在 `WHERE` 子句中用于检查子查询是否返回了行。如果子查询结果集为空，则返回真（true）。


    ### 98. `SELECT` 语句中 `GROUP BY` 子句的作用是什么？

    a. `SELECT` 语句中的 `GROUP BY` 子句用于根据一个或多个列对行分组。它通常与聚合函数配合使用，对每个组执行计算。


    ### 99. `SELECT` 语句中 `ORDER BY` 子句的作用是什么？

    a. `SELECT` 语句中的 `ORDER BY` 子句用于根据一个或多个列升序或降序对结果集进行排序。


    ### 100. `SELECT` 语句中 `DISTINCT` 关键字的作用是什么？

    - `SELECT` 语句中的 `DISTINCT` 关键字用于从结果集的列中检索唯一值，消除重复行。


    ## 第 3 章

    ### 100 道高频 JavaScript 工作面试面试题


    #### 1. 什么是 JavaScript？

    JavaScript 是一种高级的解释型编程语言，主要用于为网页添加交互性。


    #### 2. JavaScript 中的数据类型有哪些？

    JavaScript 有六种基本数据数据类型：`string`、`number`、`boolean`、`null`、`undefined` 和 `symbol`，以及一种名为
    `object` 的复杂数据类型。


    #### 3. `null` 和 `undefined` 有什么区别？

    `null` 表示有意地缺失任何对象值，而 `undefined` 表示值的缺失或变量未初始化。


    #### 4. JavaScript 中的 `DOM` 是什么？

    文档对象模型（`DOM`）是一种表示 HTML 和 XML 文档结构的编程接口。它允许 JavaScript 访问并操作网页的内容和结构。


    #### 5. JavaScript 中的事件（event）是什么？

    事件是发生在浏览器中的动作或发生的情况，例如按钮点击或页面加载。JavaScript 可以通过执行代码来响应这些事件。


    #### 6. JavaScript 中的匿名函数（anonymous function）是什么？

    匿名函数是没有名字的函数。它可以被赋值给变量，或作为参数传递给另一个函数。它们通常用于一次性函数或回调函数。


    #### 7. JavaScript 中的闭包（closures）是什么？

    闭包是指能够访问外部函数变量的函数，即使外部函数已经执行完毕也是如此。它们封装了数据，并提供了一种在函数调用之间维持状态的方法。


    #### 8. `==` 和 `===` 有什么区别？

    `==` 在进行类型转换后检查相等性，而 `===` 只有在不进行类型转换的情况下检查相等性。


    #### 9. JavaScript 中的提升（hoisting）是什么？

    提升是 JavaScript 的一种行为，变量声明和函数声明会被移动到所在作用域的顶部，允许在声明之前使用它们。


    #### 10. JavaScript 中的 `this` 关键字

    `this` 关键字指向当前执行代码的对象。它的值取决于函数是如何调用的。


    #### 11. JavaScript 中定义函数的不同方式有哪些？

    JavaScript 函数可以通过函数声明、函数表达式、箭头函数以及对象中的方法来定义。


    #### 12. `let` 关键字的作用是什么？

    `let` 关键字用于在 JavaScript 中声明块级作用变量。使用 `let` 声明的变量仅在定义的块内可访问。


    #### 13. `const` 关键字的作用是什么？

    `const` 关键字用于在 JavaScript 中声明块级作用变量，该变量不可重新赋值。但它不会让对象或数组变为不可变。


    #### 14. 什么是 模板字符串（template literals）？

    模板字符串用反引号（`` ` ``）表示，是 JavaScript 创建字符串的一种方式，支持变量插值和多行字符串。


    #### 15. 什么是 Promise（promises）？

    Promise 用于 JavaScript 的异步编程。它们代表异步操作的最终完成（或失败），并允许使用 `.then()` 和 `.catch()` 进行链式操作。


    #### 16. JavaScript 中的 `async/await` 语法是什么？

    `async/await` 语法是处理异步操作的现代方法。它允许以更类似于同步的方式编写异步代码，使其更易于阅读和维护。


    #### 17. 箭头函数（arrow functions）是什么？

    箭头函数是 JavaScript 中定义函数的简洁语法。与传统的函数表达式相比，它们的语法更短，并继承所在作用域的 `this` 值。


    #### 18. JavaScript 中的事件委托（event delegation）是什么？

    事件委托是一种技术，你在父元素上附加事件监听器，而不是单个子元素。它允许高效地处理事件，特别是对于动态添加的元素。


    #### 19. JavaScript 中 `map()` 函数的作用是什么？

    `map()` 函数用于通过对现有数组的每个元素应用给定函数来创建一个新数组。它允许轻松地转换和处理数组元素。


