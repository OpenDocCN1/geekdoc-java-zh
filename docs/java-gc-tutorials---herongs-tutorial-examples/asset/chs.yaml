  ```\n\nJava GC 教程\n\n### 并行收集器 - +XX:+UseParallelGC\n\n本章节提供了关于通过 `XX:+UseParallelGC`\
  \ 选项指定的并行收集器的笔记和代码示例，动态调整 `eden` 和 `to` 区域。\n\n> 什么是并行收集器？\n> 并行收集器日志格式\n> 并行收集器的日志消息类型\n\
  > \"-Xlog:gc+task=debug\" - 打印 GC 线程\n> \"-XX:ParallelGCThreads\" - 线程数\n> 并行收集器暂停\
  \ Minor/Major GC\n> 使用年轻年代的并行收集器\n> 并行收集器调整 NewRatio 和 SurvivorRatio\n> 并行收集器自适应大小策略\n\
  > 自适应大小策略日志消息\n> \"-Xlog:gc+ergo=trace\" - Minor GC 报告\n> 自适应大小策略调整 Survivor 空间\n\
  > 自适应大小策略调整 Eden 空间\n> 针对低延迟的自适应大小策略\n> 针对高吞吐量的自适应大小策略\n\n#### 要点总结：\n\n*   并行收集器\
  \ `-XX:+UseParallelGC` 实际上在年轻代使用并行回收器（PS Collector），在老年代使用并行旧年代收集器（Parallel Old\
  \ Collector）。\n*   并行收集器可以通过 `\"-XX:+UseParallelGC\"` 或 `-XX:+UseParallelOldGC`\
  \ JVM 选项调用。\n*   并行收集器在日志中使用 `PSYoungGen` 表示年轻年代 GC。\n*   并行收集器使用 `ParOldGen` 表示老年代\
  \ GC。\n*   并行收集器以停顿世界（Stop-the-world）的方式执行 Minor GC 和 Major GC。\n*   并行收集器也被称为吞吐量收集器，因为它通过减少\
  \ GC 时间来提高吞吐量。\n*   并行收集器使用的线程数可以通过 `-XX:ParallelGCThreads` 控制。\n*   并行收集器以停顿世界的方式执行\
  \ Minor GC 和 Major GC。\n*   并行收集器可以在每次年轻代 GC 时打印晋升年龄分布。\n*   由于自适应大小策略的存在，并行收集器即使在命令行中指定了\
  \ NewRatio 和 SurvivorRatio，也会进行动态调整。\n\n\n\n\n\n```\nherong> java -Xms40m -Xmx80m\
  \ -XX:+UseParallelGC \\\n   -Xlog:gc=info,gc+heap=info GarbageCollection\n\n[0.013s][info][gc]\
  \ Using Parallel\n   -- This message indicates that Parallel Collector was used\n\
  \n[0.359s][info][gc,heap] GC(0) PSYoungGen: 10240K->1504K(11776K)\n[0.359s][info][gc,heap]\
  \ GC(0) ParOldGen: 0K->1843K(27648K)\n[0.359s][info][gc     ] GC(0) Pause Young\
  \ (Allocation Failure)\n                              10M->3M(38M) 5.280ms\n   --\
  \ A Young (Minor) GC occurred\n      PSYoungGen stands for Parallel Scavenge Young\
  \ Generation\n      ParOldGen stands for Parallel Old Generation\n\nStep/TotalMemory/FreeMemory/UsedMemory:\n\
  1   40370176   28669696   11700480\n2   40370176   27052752   13317424\n\n[0.515s][info][gc,heap]\
  \ GC(1) PSYoungGen: 11674K->1504K(22016K)\n[0.515s][info][gc,heap] GC(1) ParOldGen:\
  \ 1843K->5817K(27648K)\n[0.515s][info][gc     ] GC(1) Pause Young (Allocation Failure)\n\
