  \ 选项如何用于打印 G1 执行的年轻代所有阶段的最大日志。\n\n如果你想知道 G1 年轻 GC 过程中执行了哪些阶段，以及每个阶段是如何执行的，你需要开启最大\
  \ GC 日志（使用 `-Xlog:gc*=trace` 选项）并查看所有 GC 日志。\n\n以下是我捕获 G1 执行的单个年轻 GC 日志的操作：\n\n\
  1. 运行以下命令将所有日志记录到文件中：\n\n```bash\n herong> java -Xms16m -Xmx64m \\\n   -XX:+UseG1GC\
  \ -Xlog:gc*=trace GarbageCollection > output.txt\n```\n\n2. 在文本编辑器中打开日志文件 `output.txt`。查找符合正则表达式\
  \ `Pause Young \\(Normal\\) \\(G1 Evacuation Pause\\)` 模式的日志行。取其中之一：\n\n```\n [info\
