  \ GC Tutorials - Herong's Tutorial\nGarbage Collection Performance Test\n\n### Performance\
  \ Test and System Interruptions\n\nThis section provides a tutorial showing performance\
  \ impact of operating system. After several runs of `GCPerformance.java` program,\
  \ I noticed that the throughput and latency measurements are not accurate because\
  \ system interruptions. Since Windows is a multi-tasking system, it will interrupt\
  \ the JVM to perform other tasks. Those system interruptions will stop the JVM for\
  \ some periods of time. If system interruptions have long durations, we can find\
  \ it easily by examining the output. For example, if you start the JVM to run the\
  \ application, wait for few seconds, then start Chrome while the JVM is running.\
  \ You may get the following output running with JDK 8 on an older computer.\n\n\n\
  \n\n- 在运行 `JVM` 期间请不要触碰你的电脑。\n- 长时间运行 `GCPerformance.java`。这样吞吐量会更准确。但延迟不会改变，因为它是按最坏情况计算的。\n\
  \nJava GC 教程 - Herong 的教程示例\n\n∟垃圾回收性能测试程序\n\n### \"START /REALTIME\" - 以最高优先级运行\
  \ JVM\n\n本节提供了一个教程，展示了如何使用 `START /REALTIME` 命令在 Windows 系统上以最高优先级运行 `JVM`。\n\n\
  另一种减少系统中断的方法是在 Windows 系统上使用 `START /REALTIME` 命令启动 `JVM`。它将以最高优先级运行 `JVM`，就像在没有任何系统中断的情况下实时运行\
  \ `JVM` 一样。\n\n让我们尝试：启动 `JVM` 运行应用程序，等待几秒钟，然后在 `JVM` 运行时在电脑上启动 Chrome。\n\n```\n\
