  \ - Herong's Tutorial Examples\n\n#### Garbage First (G1) Collector - +XX:+UseG1GC\n\
  \nThis chapter provides tutorial notes and example codes on the Garbage First (G1)\
  \ Collector specified by the `-XX:+UseG1GC` option. Topics include introduction\
  \ the G1 Collector; G1 log message; Stop-The-World behavior of G1.\n\n* What Is\
  \ Garbage First (G1) Collector\n* Garbage First GC Log\n* Maximum Logging of All\
  \ Phases on Normal Young GC\n* Maximum Logging on Concurrent Start GC\n* Maximum\
  \ Logging of All Phases on Old GC\n* Maximum Logging of All Phases on Full GC\n\
  * [-XX:ParallelGCThreads=6] - G1 Parallel Threads(part0081.xhtml)\n* [-XX:ConcGCThreads=5]\
  \ - Old GC Concurrent Threads(part0082.xhtml)\n* [-XX:G1HeapRegionSize=n] - G1 Region\
  \ Size(part0083.xhtml)\n* G1 Humongous Allocation - Objects Too Large\n* [-Xlog:gc+age=trace]\
  \ - Object Age(part0085.xhtml)\n* [-XX:+MaxTenuringThreshold=0] - Skip G1 Survivors(part0086.xhtml)\n\
  \nTakeaways:\n\n* The Garbage First (G1) Collector, `-XX:+UseG1GC`, improves the\
  \ performance of the Concurrent Mark-Sweep (CMS) Collector by dividing the Heap\
  \ area into regions and working on regions mostly filled with garbage first.\n*\
  \ G1 Young (or Minor) GC is performed with application stopped and with multiple\
  \ parallel threads.\n* G1 Old (or Major) GC has 7 phases: Clear Claimed Marks, Scan\
  \ Root Regions, Mark, Remark, Rebuild Remembered Sets, Cleanup, Cleanup for Next\
  \ Mark.\n* 3 of 7 G1 Old GC phases, Clear Claimed Marks, Remark, Cleanup, are paused\
  \ phases performed with application stopped and with multiple parallel threads.\n\
  * 4 of 7 G1 Old GC phases, Scan Root Regions, Mark, Rebuild Remembered Sets, Cleanup\
  \ for Next Mark, are concurrent phases performed with application, Young/Full GC\
  \ running and with multiple concurrent threads.\n* G1 Full GC is triggered when\
  \ an Old GC is running too long and the heap is running out of space.\n* G1 Full\
  \ GC is performed with application stopped and with multiple parallel threads.\n\
  * `-XX:G1HeapRegionSize=n` can be used to specify the size of regions used by the\
  \ G1 collector. The default region size is 1024K.\n* Any object that is more than\
  \ half a region size is considered a \"Humongous object\". Such an object is allocated\
  \ directly in the old generation into \"Humongous regions\". A Humongous region\
  \ is a contiguous set of regions.\n\n#### Java GC Tutorials - Herong's Tutorial\
  \ Examples\n\n##### Garbage First (G1) Collector - +XX:+UseG1GC](part0074.xhtml)\n\
  \n#### What Is Garbage First (G1) Collector\n\nThis section describes the Garbage-First\
  \ (G1) Collector, which divides the heap into a number of equally sized regions.\
  \ The G1 Collector measures how much garbage each region has and collects garbage\
  \ in regions mostly filled with garbage first.\n\n\n\n\n\n# HotSpot Garbage First\
  \ (G1) 垃圾回收器\n\n- 当应用程序想要创建新对象时，内存将从当前的 Eden 区域分配给新对象。\n- 当当前的 Eden 区域满时，另一个空闲区域将作为当前的\
  \ Eden 区域。\n- 当创建的 Eden 区域过多时，将以多线程并行停顿世界（stop-the-world）的方式启动 `Minor GC`。\n- `Minor\
  \ GC` 的第一步是遍历所有旧 Eden 和 Survivor 区域，标记所有存活对象。\n- `Minor GC` 的第二步是将所有小于晋升阈值（tenuring\
  \ threshold）的存活对象复制到新的 Survivor 区域。较老的对象被复制到新的 Tenured（老年代）区域。\n- `Minor GC` 的最后一步是释放所有不再存活对象的旧\
  \ Eden 和 Survivor 区域。\n- 当创建的 Tenured 区域过多时，将启动包含四个阶段的 `Major GC`：初始标记（Initial Mark）、标记（Mark）、清理（Cleanup）和复制（Copy）。\n\
  - `Major GC` 的 `Initial Mark` 阶段与 `Minor GC` 结合，以共享相同的应用程序停顿时间。\n- `Major GC` 的\
  \ `Mark` 阶段是遍历所有旧 Tenured 区域以标记所有存活对象，并使用多个并行线程（大多数情况下）与应用程序并发运行。\n- `Major GC`\
  \ 的 `Cleanup` 阶段是释放任何识别为没有存活对象的旧 Tenured 区域，与应用程序并发运行。\n- `Major GC` 的 `Copy` 阶段与\
  \ `Minor GC` 结合，以共享相同的应用程序停顿。它的工作是将存活对象从旧 Tenured 区域复制到新的 Tenured 区域，从而释放旧 Tenured\
  \ 区域。\n\n`Major GC` 的 `copy` 阶段遵循特殊规则，即优先从垃圾最多的 Tenured 区域复制存活对象。这就是为什么该回收器被称为 `Garbage\
  \ First (G1)` 回收器。\n\n显然，从垃圾更多的区域复制存活对象更具成本效益，用更少的工作获得更好的回报。事实上，垃圾较少的区域应该保持原样，因为释放的内存不多。\n\
  \n下图显示了堆区域如何划分为不同的区域，以及如何将区域分配为 Eden 空间（`Eden region`）、Survivor 空间（`Survivor region`）或老年代（`Tenured\
  \ region`）：\n\n![](img/image00261.jpeg)\n\n## Garbage First (G1) 回收器 - \"+XX:+UseG1GC\"\
