  \nJava GC 教程\n\nParallel 收集器 - \"+XX:+UseParallelGC\"\n\n### Parallel Collector\
  \ 使用年轻代\n\n本节介绍了 `Parallel` 收集器如何使用自适应大小策略来实现最佳延迟。在强制 `Parallel` 收集器提供 1 ms 延迟的同时，我注意到\
  \ `Parallel` 收集器完全停止了年轻代。所有新对象都直接分配在年代中。\n\n以下是我在 `GC(515)` 之后看到的日志：\n\n```\nherong>\
  \ java -XX:+UseParallelGC -XX:MaxGCPauseMillis=1 \\\n   -XX:GCTimeRatio=9 -Xmx1200m\
