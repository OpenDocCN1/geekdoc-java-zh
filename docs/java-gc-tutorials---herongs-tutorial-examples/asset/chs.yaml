  \n`-XX:ParallelThreads` - This section describes how to use the `-XX:ParallelThreads`\
  \ option to control the number of threads used by the Parallel Collector.\n\nIn\
  \ the previous tutorial, we learned that the Parallel collector did use 2 threads\
  \ to perform both Young and Full GCs.\n\nThe next question is how the Parallel collector\
  \ determines the number of threads to use.\n\nBy documentation, the Parallel collector\
  \ uses the number of cores `N`. If `N` is greater than 8, the fraction is `5/8`.\
  \ If `N` is less than 8, the fraction is `1/2`. If you want to control the number\
  \ of threads, you can use `-XX:ParallelGCThreads=n`.\n\nIn the example below:\n\n\
