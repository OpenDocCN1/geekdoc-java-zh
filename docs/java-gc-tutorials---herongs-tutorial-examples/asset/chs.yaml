  \   2597 ms\n```\n\nJava GC 教程 - Herong 的教程示例\n\n### G1 收集器的性能测试\n\n本章提供了关于 G1 收集器性能影响的教程笔记和示例代码。主题包括堆占用；堆大小影响；仅运行年轻\
  \ GC；运行 Full GC 和 Old GC。\n\n*   G1 GC 占用 - 空闲堆 4% 到 50%\n*   堆大小对 G1 GC 的影响\n*\
  \   堆区域对 G1 GC 的影响\n*   对象大小对 G1 Young GC 的影响\n*   并行线程对 G1 Young GC 的影响\n*   对象大小对\
