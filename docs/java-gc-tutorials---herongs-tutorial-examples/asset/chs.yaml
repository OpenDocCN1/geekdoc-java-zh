  ## 垃圾回收器介绍\n\n\n\n\n\n本章提供了关于垃圾回收器的教程笔记和示例代码。主题包括 JVM 内存管理总结；分代垃圾回收器介绍；新生代和老年代堆区域；Eden\
  \ 区和幸存者空间；标记-清除-压缩算法；垃圾回收器变体。\n\n- JVM 内存管理器 - 垃圾回收器\n- HotSpot 中的分代垃圾收集\n- 新生代收集\
  \ - Minor GC\n- 新生代垃圾回收器 - Serial, PS, ParNew, G1\n- 老年代代收集 - Major GC\n- 老年代垃圾回收器\
  \ - Serial, ParOldGen, CMS, G1\n- 回收器组合：Serial, Parallel, Concurrent, G1, Z\n\n\
  ### 核心要点：\n\n- HotSpot JVM 堆内存被分为两代：新生代（Young Generation）和老年代（Tenured/Old Generation）。\n\
  - 新生代进一步分为三个区域：Eden 区、幸存者空间“From”和幸存者空间“To”。\n- 当 Eden 区满时，会执行一次 Minor 垃圾收集（Minor\
  \ GC），将存活对象从 Eden 区移动到幸存者空间“To”区。它还会通过将“年轻”存活对象移动到幸存者空间“To”区并将“老”存活对象晋到老年代，来清空幸存者空间“From”区。\n\
  - 当老年代满时，会执行一次 Full 垃圾收集（Full GC），它遵循三步的标记-清除-压缩（MSC）过程来释放死亡对象并碎片碎片空间。\n- HotSpot\
  \ JVM 中使用了 6 种垃圾回收器：串行回收器（Serial Collector）、并行回收器（Parallel Collector）、并行压缩回收器（Parallel\
  \ Compaction Collector）、并发标记清除回收器（CMS）、垃圾优先器（G1）和 Z 回收器（ZGC）。\n\nJava GC 教程 - Herong\
  \ 的教程示例\n\n∟垃圾回收器介绍\n\n### JVM 内存管理器 - 垃圾回收器\n\n本节描述了什么是垃圾回收器以及它在管理 JVM 内存中的角色和职责。\n\
  \n在之前的章节中，我们观察了 JVM 如何自动为我们管理堆内存。在接下来的章节中，我们将学习 JVM 实际上如何管理内存的基本概念。\n\n#### 什么是垃圾回收器？\n\
  \n垃圾回收器是 JVM 的组件，主要负责管理堆（Heap）区域的内存空间。它还管理方法区（Method Area）和直接内存（Direct Memory）区域的内存空间。具体来说，垃圾回收器有三个主要职责：\n\
  \n1. **为新对象分配内存** - 当 Java 请求创建一个新的数据对象（类的实例或数组）时，垃圾回收器必须在内存中找到一块特定大小的空闲空间。刚开始这是一项简单的任务，因为空闲空间是一个连续的块。但由于旧对象的释放顺序与分配顺序不一致，空闲空间可能会碎片。垃圾回收器可能需要移动数据对象，将空闲空间合并成大块。\n\
  2. **确保存活对象留在内存中** - 一旦分配了数据对象，垃圾回收器必须持续跟踪它，以知道该对象在内存中的实际位置，以及有多少个存活引用指向该对象。\n3.\
  \ **释放死亡对象的内存** - 当一个数据对象失去最后一个存活引用时，它就变成死亡对象，也称为垃圾。垃圾回收器可以将死亡对象留在内存中一段时间。但当没有足够的空闲空间分配新对象时，它必须释放它们。寻找死亡对象并释放这些对象所用空间的过程被称为垃圾收集。\n\
  \n#### 垃圾回收器的常见设计目标：\n\n- **必须安全（Safe）** - 垃圾回收器绝不能误释放任何存活对象。\n- **必须全面（Comprehensive）**\
  \ - 垃圾回收器不应让任何垃圾长时间不被收集。\n- **必须快速（Fast）** - 垃圾回收器可能会中断程序的执行以执行垃圾，但这些中断应该是非常短的。\n\
  - **不能浪费空间** - 垃圾回收器不应因为内存碎片化而浪费过多空闲空间。\n- **必须可扩展（Scalable）** - 垃圾回收器在多处理器系统上必须是扩展的。\n\
  \nJava GC 教程 - Herong 的教程示例\n\n∟垃圾回收器介绍\n\n### HotSpot 中的分代垃圾收集\n\n本节描述了 HotSpot\
  \ JVM 中使用的分代垃圾收集架构。新生代存储寿命较短的对象，老年代存储寿命较长的对象。\n\n早些我们学习了垃圾回收器的角色和职责。现在让我们来看一个真实示例，HotSpot\
  \ JVM 中实现的垃圾回收器。\n\n从架构上说，HotSpot 垃圾回收器被称为分代收集器，它将内存分为部分（代）：\n\n- **新生代（Young Generation）**\
  \ - 存储寿命较短的对象，空间较小。新生代的垃圾收集频率更高。新生代的垃圾收集操作被称为 `Minor GC`。Minor GC 可以选择更快且空间效率更低的垃圾收集算法。\n\
  - **老年代（Tenured Generation）** - 存储寿命较长的对象，空间较大。老年代的垃圾收集频率较低。老年代的垃圾收集操作被称为 `Major\
  \ GC`。Major GC 可以选择空间效率更高但速度较慢的垃圾收集算法。\n\n新对象通常首先分配在新生代。如果它经历了若干次 `Minor GC`，则会被晋到老年代。\n\
  \n分代垃圾收集方法之所以高效，是因为在大多数 Java 应用中观察到了以下弱分代假设：\n\n- 大多数对象的寿命较短。\n- 引用年轻对象的对象少于引用老对象的。\n\
  \n下图展示了 HotSpot 使用的分代收集架构：\n\n![](img/image258.jpeg)\n\nHotSpot 分代收集\n\nJava GC\
  \ 教程 - Herong 的教程示例\n\n∟垃圾回收器介绍\n\n### 新生代收集 - Minor GC\n\n本节描述新生代收集（也称为 Minor GC）的基本步骤。新生代分为三个区域：Eden\
  \ 区、幸存者空间“From”和幸存者空间“To”。\n\n为了让 `Minor GC` 更高效，HotSpot 的新生代进一步分为三个：\n\n- **Eden\
  \ 区** - 存储新分配的对象，空间较大。\n- **幸存者空间 \"From\"** - 存储至少经历过一次 `Minor Collection`的对象，空间较小。\n\
  - **幸存者空间 \"To\"** - 预留的垃圾回收器工作空间，大小与幸存者空间“From”相同。\n\n`Minor GC` 涉及 6 个基本步骤：\n\n\
  - 确定新生代中的每个对象是存活还是死亡的。\n- 将 Eden 区中的存活对象复制到幸存者空间 \"To\"。\n- 将幸存者空间 \"From\" 中达到晋升标准的存活对象复制到老年代。\n\
  - 将幸存者空间 \"From\" 中未达到晋升标准的存活对象复制到幸存者空间 \"To\"。\n- 移除所有死亡对象，使 Eden 区和幸存者空间“From”区为空。\n\
  - 交换幸存者空间“From”区和幸存者空间“To”区之间的标签，使幸存者空间“To”区为空。\n\n下图展示了 HotSpot JVM 中 `Minor GC`\
  \ 的基本步骤：\n\n![](img/image259.jpeg)\n\nHotSpot 新生代收集 - Minor GC\n\n\n\n\n\n# Java\
  \ GC 教程 - Herong 教程示例 (#part0001.xhtml)\n\n## 垃圾回收器介绍 (#part0015.xhtml)\n\n## 年生代收集器\
  \ - Serial, PS, ParNew, G1\n\n本节描述用于年轻代的垃圾回收器：`Serial`、`Parallel Scavenge (PS)`、`Parallel\
  \ New (ParNew)` 以及 `Garbage First (G1)`。\n\n根据执行 GC 任务的算法，年轻（new）代 4 种主要的垃圾回收器：\n\
  \n1. `Serial Collector`（通过 `-XX:+UseSerialGC` 选项调用） - 用于年轻代的 Serial 收集器使用 `Copy\
  \ (也称为 Scavenge)` 算法，仅使用 1 个 CPU 处理器（1 个线程）以停顿世界（stop-the-world）的方式串行执行：\n   - 当\
  \ `\"eden\"` 空间满时，将存活对象从 `\"eden\"` 拷贝到 `\"from\"` 空间。\n   - 清空 `\"eden\"` 空间。死亡对象被清除。\n\
  \   - 当 `\"from\"` 空间满时，将存活对象从 `\"from\"` 拷贝到 `\"to\"` 空间。\n   - 清空 `\"from\"` 空间。死亡对象被清除。\n\
  \   - 当 `\"to\"` 空间满或存活对象过老时，将存活对象从 `\"to\"` 空间拷贝到 `\"tenured\"` 代。\n   - 交换 `\"\
  from\"` 和 `\"to\"` 空间。\n   年轻（new）代的 Serial 收集器可以在 GC 日志中通过 `\"DefNew\"` 标签识别，例如：`\"\
  DefNew: 34207K->4287K(38720K)\"`。\n\n2. `Parallel Scavenge (PS)`（也称为 `\"PS Scavenge\"\
  `） Collector（通过 `-XX:+UseParallelGC` 选项调用） - 用于年轻代的 PS 收集器使用 `Copy (也称为 Scavenge)`\
  \ 算法，使用多个 CPU 处理器（多个线程）以停顿世界的方式并行执行。\n   年轻（new）代的 PS 收集器与 Serial 收集器使用相同的算法，但它使用多个线程更快地完成任务。\n\
  \   年轻（new）代的 PS 收集器可以在 GC 日志中通过 `\"PSYoungGen\"` 标签识别，例如：`\"PSYoungGen: 32768K->5104K(37888K)\"\
  `。\n\n3. `Parallel New (ParNew)` Collector（通过 `-XX:+UseConcMarkSweepGC` 选项调用） -\
  \ 用于年轻代的 ParNew 收集器使用 `Copy (也称为 Scavenge)` 算法，使用多个 CPU 处理器（多个线程）以停顿世界的方式并行执行。\n\
  \   年轻（new）代的 ParNew 收集器与 PS 收集器使用相同的算法，但它有一个内部的 `'callback'`，允许老年代收集器对它收集的对象进行操作（实际上是为了与并发收集器配合工作），正如\
  \ Jack Shirazi 在 [\"从 JDK 1.7.0_04 开始起可用 Oracle JVM Garbage Collectors](http://www.fasterj.com/articles/oraclecollectors1.shtml)\
  \ 中描述的。\n   年轻代的 ParNew 收集器可以在 GC 日志中通过 `\"ParNew\"` 标签识别，例如：`\"ParNew: 1068K->63K(1152K)\"\
  `。\n   在 JVM 9 及更早版本中，可以显式使用 `-XX:+UseParNewGC` 选项调用年轻代的 ParNew 收集器。但该选项已从 JVM 10\
  \ 中移除。\n\n4. `Garbage First (G1)` Collector（通过 `-XX:+UseG1GC` 选项调用） - G1 收集器将堆分为三种类型的区域：`Eden`、`Survivor`\
  \ 和 `Tenured`。\n   在每次年轻代 GC 期间，G1 收集器遍历所有现有 `Eden` 和 `Survivor` 区域以标记所有存活对象。然后它将所有小于晋升阈值的存活对象拷贝到新的\
  \ Survivor 区域。较旧的对象拷贝到新的 Tenured 区域。\n   年轻（new）代的 G1 收集器可以在 GC 日志中通过 `\"G1 Evacuation\
  \ Pause\"` 标签识别，例如：`\"Pause Young (Normal) (G1 Evacuation Pause) 24M->9M(126M) 12.948ms\"\
  `。\n\n### 老年代收集 - Major GC\n\n本节描述了老年代收集的基本步骤，也称为 Major GC，它在整个老年代上使用简单的 3 步 Mark-Sweep-Compact\
  \ 算法。\n\nMajor GC 使用的基本算法称为 `Mark-Sweep-Compact`，它由 3 个步骤组成：\n   - `Mark`（标记）：识别老年代中哪些对象仍然存活并对其进行标记。\n\
  \   - `Sweep`（清除）：通过遍历整个老年代识别并移除垃圾。\n   - `Compact`（压缩）：将存活对象移动到年代的开头，将碎片化的空空间合并为年代末尾的单一连续块。\n\
  \n`Mark-Sweep-Compact` 算法非常直观，如下所示：\n\n![](img/image0026.jpeg)\n\nHotSpot 老年代收集\
  \ - Major GC\n\n### 老年代收集器 - Serial, ParOldGen, CMS, G1\n\n本节描述用于老年代的垃圾回收器：`Serial`、`Parallel\
  \ Old (ParOldGen)`、`Concurrent Mark Sweep (CMS)` 以及 `Garbage First (G1)`。\n\n根据所使用的算法，老年代（old）有\
  \ 4 种主要的垃圾回收器：\n\n1. `Serial`（也称为 MarkSweep） Collector（通过 `-XX:+UseSerialGC` 选项调用）\
  \ - 用于老年代的 Serial 收集器使用 `Mark-Sweep-Compact` 算法，仅使用 1 个 CPU 处理器（1 个线程）以停顿世界的方式串行执行。\n\
  \   老年代的 Serial 收集器可以在 GC 日志中通过 `\"Tenured\"` 标签识别，例如：`\"Tenured: 13758K->44242K(86016K)\"\
  `。\n\n2. `Parallel Old (ParOldGen)`（也称为 PS Mark）Collector（通过 `-XX:+UseParallelGC`\
  \ 选项调用） - 用于老年代的 Parallel Old 收集器使用 `Mark-Sweep-Compact` 算法，使用多个 CPU 处理器（多个线程）以停顿世界的方式并行执行。\n\
  \   老年代收集器可以在 GC 日志中通过 `\"ParOldGen\"` 标签识别，例如：`\"ParOldGen: 11361K->42264K(86016K)\"\
  `。\n   Parallel Old 收集器称为并行压缩收集器。\n\n3. `Concurrent Mark Sweep (CMS)` Collector（通过\
  \ `-XX:+UseConcMarkSweepGC` 选项调用） - 用于老年代的 CMS 收集器在大部分 GC 期间并发运行，不停止应用程序。这将减少应用程序停顿时间。\n\
  \   老年代的 CMS 收集器可以在 GC 日志中通过 `\"CMS\"` 标签识别，例如：`\"CMS: 14177K->47119K(86016K)\"\
  `。\n\n4. `Garbage First (G1)` Collector（通过 `-XX:+UseG1GC` 选项调用） - G1 收集器将堆分为三种类型的区域：`Eden`、`Survivor`\
  \ 和 `Tenured`。\n   当老年代区域过多时，G1 收集器开始遍历所有老年代区域以标记存活对象。这是与应用程序并发执行的。\n   G1 收集器将共享年轻代\
  \ GC 的 `\"copy\"` 阶段，将老年代区域中的存活对象拷贝到新的老年代区域。拷贝阶段优先选择垃圾较年代区域。这就是为什么该收集器被称为垃圾优先（G1）收集器。\n\
  \   老年代的 G1 收集器可以在 GC 日志中通过 `\"Old regions\"` 标签识别，例如：`\"Old regions: 8->37\"`。\n\
  \n### 收集器组合：Serial, Parallel, Concurrent, G1, Z\n\n本节描述了 JVM 12 HotSpot 支持的不同的垃圾回收器组合：`Serial`、`Parallel`、`Concurrent`、`G1`\
  \ 和 `Z`。\n\n在之前的章节中，我们分别讨论了年轻代和老年代的垃圾回收器：\n- 年轻代的 4 种垃圾回收器：`Serial`、`Parallel Scavenge\
  \ (PS)`、`Parallel New (ParNew)` 以及 `Garbage First (G1)`。\n- 老年代的 4 种垃圾回收器：`Serial`、`Parallel\
  \ Old (ParOldGen)`、`Concurrent Mark Sweep (CMS)` 以及 `Garbage First (G1)`。\n\n\n\n\
  \n\n一种单代垃圾收集器，称为 `Z`（或 `ZGC`）。`Z` 收集器自 JVM 11 开始引入，目前仅在 Linux 操作系统上作为实验选项可用。`Z`（或\
  \ `ZGC`）收集器可以通过 `-XX:+UseZGC` 选项调用。\n\n现在让我们来看看垃圾回收器的依赖关系和兼容性。截至 JVM 17，HotSpot\
  \ JVM 能够支持以下 5 种垃圾回收器组合：\n\n```\n GC Combination           Minor GC          Major\
  \ GC            Thread\n--------------           --------          -------     \
  \       ------\n\nSerial                   Serial            Serial            \
  \ 1\n-XX:+UseSerialGC         Stop-the-world    Stop-the-world\n\nParallel     \
  \            Parallel Scavenge Parallel Old\n-XX:+UseParallelGC       Mostly Parallel\
  \   Mostly Parallel    Multi\n-XX:+UseParallelOldGC    Stop-the-world    Stop-the-world\n\
  \nConcurrent               Parallel New      CMS\n-XX:+UseConcMarkSweepGC  Mostly\
  \ Parallel   Mostly Parallel    Multi\n                         Stop-the-world \
  \   Mostly concurrent\n\nConcurrent Old only      Serial            CMS\n-XX:+UseConcMarkSweepGC\
  \  Mostly Parallel   Mostly Parallel    Multi\n-XX:-UseParNewGC         Stop-the-world\
  \    Mostly concurrent\n\nGarbage First (G1)       Garbage First     Garbage First\
  \      Multi\n-XX:+UseG1GC             Mostly Parallel   Mostly Parallel\n     \
  \                    Stop-the-world    Mostly concurrent\n\nZ - 1 Generation   \
  \                  Z                        Multi\n-XX:+UseZGC                 \
  \         Mostly Parallel\n                                     Mostly concurrent\n\
  ```\n\n注意：\n\n- 当使用 `-XX:+UseParallelGC` 调用 `Parallel Scavenge` 用于新生代回收时，会自动选择 `Parallel\
  \ Old` 用于老年代回收。\n- 当使用 `-XX:+UseParallelOldGC` 调用 `Parallel Old` 用于老年代回收时，会自动选择\
  \ `Parallel Scavenge` 用于新生代回收。\n- 当使用 `-XX:+UseConcMarkSweepGC` 调用 `CMS` 用于老年代回收时，会自动选择\
  \ `Parallel New` 用于新生代。\n- 当同时使用 `-XX:+UseConcMarkSweepGC` 和 `-XX:-UseParNewGC`\
  \ 时，你将强制 JVM 使用 `Serial` 处理新生代。这种组合实际上已经过弃，并将在未来被禁用。\n- 其他组合不兼容且已禁用。\n\n接下来，我们将逐一讨论每个\
  \ GC 组合。\n\nJava GC 教程 - Herong 的教程示例\n\n## Serial 收集器 - \"+XX:+UseSerialGC\"\n\n\
  本章节提供了关于由 `+XX:+UseSerialGC` JVM 选项指定的 Serial 收集器的笔记和示例代码。主题包括：Serial 收集器介绍；GC 日志消息格式和示例；控制堆区域分配的\
  \ `-XX:NewRatio` 和 `-XX:SurvivorRatio`；`TargetSurvivorRatio`、`-XX:MaxTenuringThreshold`、`-XX:+NeverTenure`\
  \ 和 `-XX:+AlwaysTenure` 晋升行为。\n\n- 什么是 Serial 收集器\n- Serial Collector 的 GC 日志消息格式\n\
  - Serial Collector 的 GC 日志消息示例\n- 来自 Serial Collector 的日志类型\n- Serial Collector\
  \ 在进行 Minor/Major GC 时停止应用\n- 堆内存区域的使用报告\n- 默认 NewRatio - 老年代 vs 新生代\n- \"-XX:NewRatio\"\
  \ - 老年代与“新生代”的比例\n- \"-XX:SurvivorRatio\" - Eden 空间与 Survivor 空间的比例\n- Serial GC\
  \ 追踪 - 紧凑堆\n- Serial GC 追踪 - 紧凑堆（部分 2）\n- Serial GC 追踪 - 紧凑堆（部分 3）\n- Serial GC\
  \ 追踪 - 充足堆\n- Serial GC 追踪 - 老活跃对象\n- Serial GC 追踪 - 晋升阈值\n- \"-XX:TargetSurvivorRatio\"\
  \ - 第二晋升条件\n- Serial GC 追踪 - 受控制的晋升阈值\n- \"-XX:+NeverTenure\" 和 \"-XX:+AlwaysTenure\"\
  \ 的工作\n- Serial Collector 的 Minor GC 触发条件\n\n### 核心总结：\n\n- 由 `-XX:+UseSerialGC`\
  \ 选项指定的 Serial 收集器实际上使用了新生代的 Serial 收集器和老年代的 Serial 收集器。\n- Serial 收集器日志中使用 `DefNew`\
  \ 代表新生代 GC。\n- Serial 收集器使用 `Tenured` 代表老年代 GC。\n- Serial 收集器以停顿（stop-the-world）的方式并仅使用\
  \ 1 个线程串行执行 Minor 和 Major GC。\n- `-XX:NewRatio` 选项控制老年代大小与新生代大小的比例。默认约为 2。\n- `-XX:SurvivorRatio`\
  \ 选项控制 Eden 空间大小与 Survivor 空间的比例。默认约为 8。\n- Serial 收集器是 HotSpot JVM 8 的默认垃圾回收器。\n\
  - `-Xlog:gc+heap=debug` 选项在每次 GC 后打印堆信息。\n- `-Xlog:gc+age=trace` 选项在每次 GC 前打印对象年龄。\n\
  - `-XX:MaxTenuringThreshold` 选项控制进入老年代的年龄限制。\n- `-XX:TargetSurvivorRatio` 选项控制 Survivor\
  \ 空间的使用率。\n- `-XX:+NeverTenure` 选项强制对象留在 Survivor 空间，即使它们已成熟。\n- `-XX:+AlwaysTenure`\
  \ 选项强制对象直接从 Eden 空间晋升到老年代。\n\nJava GC 教程 - Herong 的教程示例\n\n## Serial 收集器 - \"+XX:+UseSerialGC\"\
  ](#part0023.xhtml)\n\n### 什么是 Serial 收集器\n\n本节介绍了 Serial 收集器，它使用了新生代 Serial 收集器和老年代\
  \ Serial 收集器的组合，因此以单线程、stop-the-world 方式执行。\n\n**什么是 Serial 收集器？** Serial 收集器实际上是两个垃圾回收器的组合：\n\
  \n- 新生代的 Serial 收集器 - 使用三区域（Eden、Survivor 空间 \"From\" 和 Survivor 空间 \"To\"）算法，以\
  \ 1 个线程串行执行，stop-the-world 方式。\n- 老年代的 Serial 收集器 - 使用“标记-清除-压缩”算法，以 1 个线程串行执行，stop-the-world\
  \ 方式。\n\nSerial 收集器的主要特征：\n\n- Serial 收集器与应用程序串行运行。这意味着执行垃圾回收时，Java 应用程序会停止。\n-\
  \ Serial 收集器使用 1 个线程运行。因此它无法充分利用多处理器系统。\n- 可以通过 JVM 选项 `-XX:+UseUseGC` 指定。\n- Serial\
  \ 收集器是 HotSpot JVM 8 及更早版本的默认垃圾回收器。\n\nJava GC 教程 - Herong 的教程示例\n\n## Serial Collector\
  \ 的 GC 日志消息格式](#part0025.xhtml)\n\n### Serial Collector 的 GC 日志消息格式\n\n本节提供了对 Serial\
  \ Collector 生成 GC 日志消息的解释。\n\n帮助我们理解 Serial 收集器如何工作的第一步是理解它生成的 GC 日志消息。\n\n让我们用我的示例程序\
  \ `GarbageCollection.java` 捕获一些 GC 日志：\n\n```\n herong> java -XX:+UseSerialGC -Xlog:gc,gc+heap=info\
  \ GarbageCollection\n\n[0.019s][info][gc] Using Serial\n...\n```\n\n好的。我们在应用程序启动\
  \ 0.019 秒后获得了第一个 GC 日志。这确认了 JVM 正在使用 Serial GC。\n\n\n\n\n继续在控制台中查看额外的输出：\n\n```\n\
  \ ...\nStep/TotalMemory/FreeMemory/UsedMemory:\n1   127729664   107555136   20174528\n\
  2   127729664   105882632   21847032\n...\n14   127729664   92701256   35028408\n\
  [0.906s][info][gc,heap] GC(0) DefNew: 34207K->4288K(38720K)\n[0.906s][info][gc,heap]\
  \ GC(0) Tenured: 0K->13758K(86016K)\n[0.906s][info][gc     ] GC(0) Pause Young (Allocation\
  \ Failure)\n   33M->17M(121M) 28.706ms\n15   127729664   108238488   19491176\n\
  ```\n\n这里是 0.102 秒时第一次新生 GC（Minor GC）的日志消息。是我对这 3 条消息的理解：\n\n- `DefNew: 34207K->4288K(38720K)`\
  \ - 这条消息告诉我们，针对新生代（New generation）的 Serial GC（DefNew）将新生代堆的使用量从 34207K 减少到了 4288K，见消息中的\
  \ `... 34207K->4288K...`。分配的新生代堆总大小为 38720K，见消息中的 `...((38720K)`。\n\n- `Tenured:\
  \ 0K->13758K(86016K)` - 这条消息告诉我们老年代（Old generation）的堆的使用量从 0K 扩展到 13758K，见消息中的 `...0K->13758K...`。这是新生\
  \ GC 的结果，它将一些存活对象从新生代提升到了老年代堆。分配的老年代堆总大小为 86016K，见消息中的 `...(86016K)`。\n\n- `Pause\
  \ Young (Allocation Failure) 33M->17M(121M) 28.706ms` - 这条消息告诉我们 Java 应用因 `Allocation\
  \ Failure`（分配失败）触发了新生 GC（Minor GC）而停顿。堆的使用量从 33M 减少到 17M，见消息中的 `... 33M->17M...`。分配的堆总大小为\
  \ 121M，见消息中的 `...(121M)...`。这次新生 GC 总耗时 28.706ms，见消息中的 `... 28.706ms`。\n\n基于这些消息，我们可以计算出以下结果：\n\
  \n```\n 从新生代移除的对象：34207K - 4288K = 29919K。\n移动到老年代的存活对象：13758K - 0K = 13758K。\n\
  \ 被销毁的死亡对象（垃圾）：29919K - 13758K = 16161K。\n```\n\n再次在控制台中查看额外的输出：\n\n```\n ...\n\
  46   127729664   74069456   53660208\n[0.591s][info][gc,heap] GC(1) DefNew: 38643K->4287K(38720K)\n\
  [0.591s][info][gc,heap] GC(1) Tenured: 13758K->44242K(86016K)\n[0.591s][info][gc\
  \     ] GC(1) Pause Young (Allocation Failure)\n   51M->47M(121M) 24.964ms\n47 \
  \  127729664   77015592   50714072\n...\n78   127729664   42775624   84954040\n\
  [0.617s][info][gc,heap] GC(2) DefNew: 38719K->4287K(38720K)\n[0.617s][info][gc,heap]\
  \ GC(2) Tenured: 44242K->73192K(86016K)\n[0.617s][info][gc     ] GC(2) Pause Young\
  \ (Allocation Failure)\n   81M->75M(121M) 16.611ms\n79   127729664   47170696  \
  \ 80558968\n```\n\n又发生了两次新生 GC（Minor GC）。让我们继续。\n\n```\n ...\n109   127729664  \
  \ 13511344   1142832\n[0.653s][info][gc     ] GC(4) Pause Full (Allocation Failure)\n\
  \   104M->35M(138M) 17.526ms\n[0.655s][info][gc,heap] GC(3) DefNew: 38669K->0K(38784K)\n\
  [0.655s][info][gc,heap] GC(3) Tenured: 73192K->36569K(86016K)\n[0.655s][info][gc\
  \     ] GC(3) Pause Young (Allocation Failure)\n   109M->35M(121M) 37.570ms\n110\
  \   127729664   89572168   38223\n```\n\n这是 0.653 秒时第一次全 GC（Major GC）的日志。是我对这 4\
  \ 条消息的理解：\n\n- `GC(4) Pause Full (Allocation Failure) 104M->35M(138M) 17.526ms`\
  \ - 这条消息告诉我们 Java 应用因 `Allocation Failure` 触发了全 GC 而停顿。堆的使用量从 104M 减少到 35M，见消息中的\
  \ `...104M->35M...`。这次全 GC 总耗时 17.526ms，见 `...17.526ms`。\n\n- `GC(3) DefNew...`、`GC(3)\
