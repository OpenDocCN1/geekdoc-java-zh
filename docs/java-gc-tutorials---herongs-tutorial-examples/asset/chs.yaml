- "# Java GC 教程 - Herong 教程示例\n\n\n\n![](img/cover00263.jpeg)\n\n# Java GC 教程\n- Herong\
  \ 的教程示例\n\n![](img/image00257.jpeg)\n\nv1.11, 2022\n\n杨鹤龙 博士\n\nCopyright © 2022\
  \ Dr. Herong Yang. 版权所有。\n\n本书是作者在学习 `JVM GC`（垃圾回收）过程时编写的教程笔记和示例代码集。主题包括 Java 垃圾回收器、`STW`（停停世界）、串行回收器（Serial\
  \ Collector）、并行回收器（Parallel Collector）、并发回收器（Concurrent Collector）、G1 回收器（G1 Collector）、GC\
  \ 算法、分代 GC（Generational GC）、分区域 GC（Regional GC）、堆内存管理、年轻代/新生代（Young/New Generation）、老年代（Tenured/Old\
  \ Generation）、对象引用（Object Reference）、Eden 空间、幸存区（Survivor Spaces）、新生 GC（Minor GC）、老年代\
  \ GC（Major GC）、全 GC（Full GC）、性能调优、吞吐量/延迟性能（Throughput/Latency Performance）、堆足迹（Heap\
  \ Footprint）。已于 2022 年结合 `JVM 17` 更新。如需获取最新更新和免费示例章节，请访问 https://www.herongyang.com/Java-GC。\n\
