  \ 时，一些“年龄为 15”的对象将因为它们的成熟度而被提升到“老年代”。\n\n### 结论\n\n*   默认情况下，串行收集器（Serial collector）启动时的\
  \ `TargetSurvivorRatio` 为 50。\n*   如果“from” 空间的使用百分比高于 `TargetSurvivorRatio`，剩余的存活对象无论其年龄如何，都将被提升到老年代。这种情况也称为过早晋（premature\
  \ tenuring 或 premature promotion）。\n\n[Java GC 教程 - Herong' 教程示例\n\n∟串行收集器 - \"\
  +XX:+UseSerialGC\"\n\n∟Serial GC 追踪 - 受控制的晋升阈值 \n\n本节提供了一个教程，展示了如何使用 `InitialTenuringThreshold`\
  \ 和 `MaxTenuringThreshold` JVM 参数来控制串行收集器的晋升阈值（Tenuring threshold）。\n\n之前的教程中，我们学习了串行收集器通过晋升阈值（默认为\
  \ 15 代）来控制对象的晋升。当一个存活对象达到晋升阈值年龄时，它被认为已成熟并提升到老年代。\n\n但如果幸存区的使用率达到 `TargetSurvivorRatio`（默认为\
  \ 50%），所有剩余的存活对象无论年龄如何都将提升到老年代。串行收集器根据幸存区的使用情况调整晋升阈值。如果我们提供足够的幸存区，存活对象可以在年轻代中停留\
  \ 15 次 GC（这取决于对象在“from”和“to”幸存区之间复制的次数）。如果我们更改默认行为，可以使用 `InitialTenuringThreshold`\
  \ 和 `MaxTenuringThreshold`：\n\n*   `-XX:InitialTenuringThreshold=3` 设置晋升阈值的初始值为\
  \ 3。串行收集器可能会更改它。\n*   `-XX:MaxTenuringThreshold=3` 将晋升阈值的最大值设置为 3。这确保任何年龄大于 3 的对象都会提升到老年代。\n\
  \n让我们用带有 `-XX:NewSize=102m` 的测试程序 `GarbageCollection2` 尝试一下：\n\n```\n herong> java\
