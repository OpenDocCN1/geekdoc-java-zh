  \ Threads\n\n## 核心要点\n\n* 并发标记-清除（CMS）收集器 `-XX:+UseConcMarkSweepGC` 在 HotSpot JVM\
  \ 9.0 版本中被弃用，并可能在未来的版本中被移除。\n* CMS 收集器实际上使用了年轻代的的**并行新生（ParNew）收集器**和老年代的**并发标记-清除（CMS）收集器**。\n\
  * CMS 收集器在日志消息中使用 `\"ParNew\"` 表示年轻代 GC。\n* CMS 收集器在日志消息中使用 `\"Old\"` 表示老年代 GC。\n\
  * CMS 收集器通过多个线程并发执行老年代（主 GC/Major GC），且在大多数情况下不会停止应用程序。\n* CMS 收集器在执行主 GC 的初始标记（Initial\
  \ Mark）和最终标记（Final Mark）步骤时会停止应用程序。\n* CMS 收集器在执行 Minor GC（年轻代 GC）时会停止应用程序。\n* CMS\
  \ 收集器在执行 Full GC（全 GC）时会停止应用程序。\n* CMS 收集器也被称为低延迟收集器，因为它减少了应用程序的停顿时间。但由于 GC 与应用程序并发运行，它可能会减慢应用程序的速度。它是像网站等交互式应用的良好选择。\n\
  * 使用 `-XX:+UseConcMarkSweepGC` 选项时，使用 ParNew 收集器执行年轻代 GC。\n* ParNew 维护一个年代年龄分布列表（Tenuring\
  \ Age Distribution），以确定对象何时进入老年代。\n* 老年代占用百分比会触发 CMS GC。\n* 如果老年代在完成 GC 过程之前被完全占用，CMS\
  \ 并发模式可能会失败。\n* CMS 收集器在 GC 过程的某些阶段确实使用了多个线程。\n* CMS 并行（停顿世界）阶段的线程数可以通过 `-XX:ParallelGCThreads=n`\
  \ 选项控制。\n* 1 个 CMS 并发阶段（即标记阶段）的线程数可以通过 `-XX:ConcGCThreads=n` 选项控制。\n\n## Java GC\
  \ 教程 - Herong's 教程示例\n\n### 并发标记-清除 (CMS) 收集器 - +XX:+UseConcMarkSweepGC\n\n####\
  \ 什么是并发标记-清除 (CMS) 收集器\n\n本节描述了并发标记-清除（CMS）收集器，它尝试通过使用单独的垃圾收集线程，在应用程序线程执行的同时并发追踪可达对象，从而减少主\
  \ GC 的应用程序停顿时间。\n\n**什么是并发标记-清除 (CMS) 收集器？** 并发标记-清除（CMS）收集器实际上是两个垃圾收集器的组合：\n\n\
  * 年轻代的并行新生（ParNew）收集器 - 它使用 3 区域（Eden、存活区 \"From\" 和存活区 \"To\"）算法，通过多个线程以停顿世界（stop-the-world）的方式并行运行。它还有一个内部“回调”机制，允许老年代收集器对其收集的对象进行操作。\n\
  * 老年代的并发标记-清除（CMS）收集器 - 它使用 `\"Mark-Sweep-Compact\"` 算法，与应用程序并发运行。其中仍有一小部分仍以停顿世界的方式运行。\n\
  \n可以使用 `-XX:+UseConcMarkSweepGC` JVM 选项调用 CMS 收集器。\n\n在每个主 GC 周期中，CMS 收集器会在收集开始时以及收集中期再次短时间地暂停所有应用程序线程。第二次停顿往往是两次停顿中较长的一个。在两次停顿期间，都会使用多个线程执行收集工作。收集的剩余部分（包括大多数对存活对象的追踪和对不可达对象的扫描）由一个或多个与应用程序并发运行的垃圾收集线程完成。\n\
  \n通常情况下，具有大量长生命周期数据（较大的老年代）并且运行在具有两个或多个处理器的机器上的应用程序往往能从使用此收集器中受益。\n\nCMS 收集器也被称为低延迟收集器，因为它减少了应用程序的停顿时间。但由于\
  \ GC 与应用程序并发运行，它可能会减慢应用程序的速度。它是像网站等交互式应用的良好选择。\n\n#### 并发标记-清除收集器 GC 日志消息格式\n\n\
  本节描述 HotSpot JVM 并发标记-清除（CMS）收集器的日志消息格式。\n\n*警告：并发标记-清除（CMS）收集器已从 JVM 15 中移除。但如果你仍然安装了\
  \ JVM 14 或更早版本，可以继续使用。*\n\n在使用并发标记-清除收集器进行任何测试之前，让我们先看看该收集器生成的日志消息：\n\n```\nherong>\
  \ java -Xms2m -Xmx64m -XX:+UseConcMarkSweepGC \\ \\\n   -Xlog:gc,gc+heap=info GarbageCollection\n\
  \nJava HotSpot(TM) 64-Bit Server VM warning: Option UseConcMarkSweepGC was\ndeprecated\
  \ in version 9.0 and will likely be removed in a future release.\n\n[info][gc] Using\
  \ Concurrent Mark Sweep\nStep/TotalMemory/FreeMemory/UsedMemory:\n\n[info][gc,heap]\
  \ GC(0) ParNew: 987K->128K(1152K)\n[info][gc,heap] GC(0) CMS: 0K->737K(1344K)\n\n\
  [info][gc] GC(0) Pause Young (Allocation Failure) 0M->0M\n\n[info][gc,heap] GC(0)\
  \ ParNew: 987K->128K(1152K)\n[info][gc,heap] GC(0) CMS: 0K->737K(1344K)\n\n[info][gc]\
  \ GC(0) Pause Young (Allocation Failure) 0M->0M\n\n[info][gc,heap] GC(0) ParNew:\
  \ 987K->128K(1152K)\n[info][gc,heap] GC(0) CMS: 0K->737K(1344K)\n\n[info][gc] GC(0)\
  \ Pause Young (Allocation Failure) 0M->0M\n```\n\n\n\n\n\n*   \"Pause Remark 1M->1M(2M)\
  \ 0.799ms\" - 表示标记阶段（remark）的完成，这是一个停顿（stop-the-world）阶段。该阶段会重新扫描 CMS 堆中任何残留的更新对象，从根节点回溯并处理引用对象。重扫描（Rescan）步骤耗时\
  \ 0.799ms。\n*   \"Concurrent Sweep\" - 表示扫描阶段（sweeping）的开始。该阶段移除未标记（死亡）的对象，并与所有运行的其他线程并发执行。\n\
  *   \"Concurrent Sweep 0.159ms\" - 表示扫描阶段结束以及所花费的时间。\n*   \"Concurrent Reset]\"\
  \ - 表示重置阶段（reset）的开始。在此阶段中，CMS 数据结构被重新初始化，以便在稍后开始一个新周期。\n*   \"Concurrent Reset\
  \ 0.244ms\" - 表示重置阶段结束以及所花费的时间。\n*   \"Old: 737K->737K(1344K)\" - 表示老年代代（tenured\
  \ generation） CMS 过程结束以及释放了多少内存。遗憾的是，CMS 过程没有释放任何内存。老年代堆的使用量从 737K 变为 737K。\n\n\
  Java GC 教程 - Herong 的教程示例\n\n∟并发标记-清理 (CMS) 收集器 - \"+XX:+UseConcMarkSweepGC\"\n\n\
  ## 通过并发标记和清理减少停顿（Stop-The-World）\n\n本节演示了 CMS 收集器如何通过与应用程序并发运行标记和清理步骤的部分来减少停顿（STW）时长。\n\
  \n使用并发标记-清理（CMS）收集器的主要优势是 CMS 在不停止应用程序的情况下执行主 GC，或者说对应用程序不产生 STW 停顿。但在 JVM 9 或更高版本中，似乎没有简单的方法可以衡量这一点。我没有找到任何\
  \ `-Xlog` 选项可以生成关于应用程序何时以及被 CMS 收集器停止多久的日志消息。\n\n然而，如果你仍在使用 JVM 8 或更早版本，可以使用 `-XX:+PrintGCApplicationStoppedTime`\
  \ 和 `-XX:+PrintGCApplicationConcurrentTime` JVM 来确认 CMS 收集器的停顿行为：\n\n```\n herong>\
