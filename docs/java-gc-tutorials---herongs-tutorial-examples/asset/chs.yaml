  \n\n### \"-XX:+MaxTenuringThreshold=0\" - 跳过 G1 存活区\n\n本节演示了如何使用 `-XX:+MaxTenuringThreshold=0`\
  \ JVM 选项将存活对象直接从 Eden 区域提升到年代区域，而不经过存活区域。\n\n与其他垃圾收集器一样，我们可以通过 `-XX:+MaxTenuringThreshold=0`\
  \ JVM 选项强制年轻代 GC 将存活对象从 Eden 区域提升到年代区域。\n\n```\n herong> java -XX:+UseG1GC -Xms100m\
  \ -Xmx100m -Xlog:gc*=trace \\\n   -XX:G1HeapRegionSize=4m -XX:MaxTenuringThreshold=0\
  \ \\\n   GarbageCollection2\n\nStep/TotalMemory/FreeMemory/UsedMemory:\n...\n17\
  \   104857600   81788832   23068768\nGC(0) Heap before GC invocations=0 (full 0):\
  \ garbage-first heap\nGC(0)   region size 4096K, 6 young (24576K), 0 survivors (0K)\n\
  GC(0) Pause Young (Normal) (G1 Evacuation Pause)\nGC(0) Age table with threshold\
  \ 0 (max threshold 0)\n   -- 存活对象应被提升到年龄小于 1 的年代区域\n\nGC(0) Eden regions: 6->0(4)\n\
  GC(0) Survivor regions: 0->0(1)\nGC(0) Old regions: 0->5\nGC(0) Archive regions:\
  \ 0->0\n   -- GC #0 (年轻代 GC) 完成\n   -- Eden 区域分配了 6 个区域的新对象\n   -- 5 个区域的存活对象被提升到年代区域\n\
  \   -- 1 个区域的死亡对象被销毁\n   -- 使用了 0 个存活区域\n\n...\n29   104857600   72351136   32506464\n\
  GC(1) Heap before GC invocations=1 (full 0): garbage-first heap\nGC(1)   region\
  \ size 4096K, 4 young (16384K), 0 survivors (0K)\nGC(1) Pause Young (Normal) (G1\
  \ Evacuation Pause)\nGC(1) Age table with threshold 0 (max threshold 0)\n   -- 存活对象应被提升到年龄小于\
  \ 1 的年代区域\n\nGC(1) Eden regions: 4->0(5)\nGC(1) Survivor regions: 0->0(1)\nGC(1)\
  \ Old regions: 5->8\nGC(1) Archive regions: 0->0\n   -- GC #1 (年轻代 GC) 完成\n   --\
  \ Eden 区域分配了 4 个区域的新对象\n   -- 3 个区域的存活对象被提升到年代区域\n   -- 1 个区域的死亡对象被销毁\n   -- 使用了\
  \ 0 个存活区域\n```\n\n结论：`-XX:+MaxTenuringThreshold=0` JVM 选项可以强制 G1 GC 将存活对象从 Eden\
  \ 区域提升到年代区域，从而跳过存活区域。\n\nJava GC 教程 - Herong 教程示例\n\n∟Z 垃圾收集器 (ZGC) - \"\\+XX:+UseZGC\"\
