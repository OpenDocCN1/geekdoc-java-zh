  \  64.62  64620\n```\n\n### 结论：\n\n* 通过 JVM 选项 `-XX:ConcGCThreads=8`，可以控制 Old GC\
  \ 并发阶段使用的线程数。\n* 并发线程越多，Old GC 运行越快。我的测试显示，8 个线程比 1 个线程快约 3 倍。\n* 然而，并发线程数对应用性能没有影响，因为并发阶段是与应用程序并行运行的。\n\
