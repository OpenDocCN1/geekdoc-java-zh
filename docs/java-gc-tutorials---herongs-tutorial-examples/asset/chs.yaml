  \n## 线程数对 Parallel GC 的影响\n\n本节提供了测试，以找出使用并行垃圾回收器时 GC 线程数量对性能的影响。在我那台双核四处理器的 CPU\
  \ 电脑上，将 GC 线程数从 1 增加到 4 略微提升了应用程序性能。\n\n我们想要发现的是使用并行垃圾回收器时 线程数量对性能的影响：\n\n### 测试\
  \ 1 - 使用 1 个 GC 线程的 Parallel GC:\n\n```\n C:\\herong>start /realtime java -XX:+UseParallelGC\
  \ -Xms1600m -Xmx1600m\n   -XX:NewSize=1200m -XX:SurvivorRatio=1 -XX:ParallelGCThreads=1\n\
  \   -Xlog:gc,gc+heap.log GCPerf9 1024 32 64 1000\n\nParameters:\n   Size=1024KB,\
  \ Base=32, Chunk=32, Warmup=64, Runs=1000\nResults:\n   Total execution time = 12\
  \ seconds\n   Total objects processed = 32000\n   Average time per run = 12 milliseconds\n\
  \   Throughput = 2631 objects/second\n   Latency = 1000 milliseconds\n   Throughput\
  \ (max, ave, min) = (999999, 2631, 1000)\n   Latency (min, ave, max) = (1, 380,\
  \ 1000)```\n\n### 测试 2 - 使用 2 个 GC 线程的 Parallel GC:\n\n``` C:\\herong>start /realtime\
  \ java -XX:+UseParallelGC -Xms1600m -Xmx1600m\n   -XX:NewSize=1200m -XX:SurvivorRatio=1\
  \ -XX:ParallelGCThreads=2\n   -Xlog:gc,gc+heap.log GCPerf9 1024 32 64 1000\n\nParameters:\n\
  \   Size=1024KB, Base=32, Chunk=32, Warmup=64, Runs=1000\nResults:\n   Total execution\
  \ time = 11 seconds\n   Total objects processed = 32000\n   Average time per run\
  \ = 11 milliseconds\n   Throughput = 2771 objects/second\n   Latency = 968 milliseconds\n\
  \   Throughput (max, ave, min) = (999999, 2771, 1032)\n   Latency (min, ave, max)\
  \ = (1, 360, 968)```\n\n### 测试 3 - 使用 4 个 GC 线程的 Parallel GC:\n\n``` C:\\herong>start\
  \ /realtime java -XX:+UseParallelGC -Xms1600m -Xmx1600m\n   -XX:NewSize=1200m -XX:SurvivorRatio=1\
  \ -XX:ParallelGCThreads=4\n   -Xlog:gc,gc+heap.log GCPerf9 1024 32 64 1000\n\nParameters:\n\
  \   Size=1024KB, Base=32, Chunk=32, Warmup=64, Runs=1000\nResults:\n   Total execution\
  \ time = 12 seconds\n   Total objects processed = 32000\n   Average time per run\
  \ = 12 milliseconds\n   Throughput = 2633 objects/second\n   Latency = 2439 milliseconds\n\
  \   Throughput (max, ave, min) = (999999, 2633, 410)\n   Latency (min, ave, max)\
  \ = (1, 379, 2439)```\n\n### 测试 4 - 使用 8 个 GC 线程的 Parallel GC:\n\n``` C:\\herong>start\
  \ /realtime java -XX:+UseParallelGC -Xms1600m -Xmx1600m\n   -XX:NewSize=1200m -XX:SurvivorRatio=1\
  \ -XX:ParallelGCThreads=8\n   -Xlog:gc,gc+heap.log GCPerf9 1024 32 64 1000\n\nParameters:\n\
