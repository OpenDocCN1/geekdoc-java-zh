  ##### Serial 垃圾器的日志类型\n\n本节描述了使用 Serial 垃圾器配合 `-log:gc*=debug` 选项生成的各种日志消息。\n\n\
  如果你使用 Serial 垃圾器 (`-XX:+SerialGC`) 并配合 `-log:gc*=debug` 选项运行应用程序，可能会看到以下类型的日志消息：\n\
  \n1. **堆初始分配 - JVM 启动时报告：**\n\n```\n[debug][gc,heap] Minimum heap 2097152  Initial\
  \ heap 2097152\n   Maximum heap 6710864\n```\n\n2. **新生年代减少消息 - 作为 Young GC 的一部分：**\n\
  \n```\n[info][gc,heap] GC(0) DefNew: 1024K->128K(1152K)\n```\n\n3. **老年代扩张消息 - 作为\
  \ Young GC 的一部分：**\n\n```\n[info][gc,heap] GC(0) Tenured: 0K->418K(768K)\n```\n\n\
  4. **Young GC 的开始/结束：**\n\n```\n[info][gc,start] GC(0) Pause Young (Allocation Failure)\n\
  ...\n[info][gc] GC(0) Pause Young (Allocation Failure) 1M->0M(1M) 2.341ms\n```\n\
  \n5. **对象年龄阈值 - 作为 Young GC 的一部分：**\n\n```\n[debug][gc,age] GC(0) Desired survivor\
  \ size 65536 bytes,\n                       new threshold 1 (max threshold 15)\n\
  ```\n\n6. **元空间减少 - 作为 Young GC 的一部分：**\n\n```\n[0.059s][info ][gc,metaspace] GC(0)\
  \ Metaspace: 328K->328K(1056768K)\n```\n\n7. **GC 执行时间 - 作为 Young 或 Full GC 的一部分：**\n\
  \n```\n[info][gc,cpu] GC(0) User=0.00s Sys=0.00s Real=0.00s\n```\n\n8. **堆快照 - 在\
  \ Full GC 之前报告：**\n\n```\n[info][gc,start] GC(0) Pause Young (Allocation Failure)\n\
  ...\n[info][gc] GC(0) Pause Young (Allocation Failure) 1M->0M(1M) 2.341ms\n```\n\
  \n9. **堆快照 - 在 Full GC 之后报告：**\n\n```\n[info][gc,start] GC(0) Pause Full (Allocation\
  \ Failure)\n...\n[info][gc] GC(0) Pause Full (Allocation Failure) 1M->0M(1M) 2.341ms\n\
  ```\n\n\n\n\n然而，如果你仍在使用 `JVM 8` 或更早版本，可以使用 `-XX:+PrintGCApplicationStoppedTime`\
  \ 和 `-XX:+PrintGCApplicationConcurrentTime` JVM 选项来确认串行收集器（Serial Collector）的停停世界（stop-the-world）行为：\n\
  \n```\n herong> \\Progra~1\\java\\jdk1.8.0\\bin\\java -Xms2m -Xmx64m -XX:+PrintGC\n\
  \   -XX:+PrintGCApplicationStoppedTime -XX:+PrintGCApplicationConcurrentTime\n \
  \  -XX:+PrintGCTimeStamps -XX:+UseSerialGC GarbageCollection\n\nStep/TotalMemory/FreeMemory/UsedMemory:\n\
  0.114: Application time: 0.0088216 seconds\n   -- Application executed for 0.0088216\
  \ seconds with no stop\n\n0.115: [GC (Allocation Failure)  878K->755K(1984K), 0.0017072\
  \ secs]\n   -- Serial Collector did a Minor GC\n\n0.117: Total time for which application\
  \ threads were stopped: 0.0025561 s,\n   Stopping threads took: 0.0000456 seconds\n\
  \   -- Serial Collector did stop the application for 0.0025561 seconds\n\n1   2031616\
  \   698704   1332912\n1.109: Application time: 0.9924986 seconds\n   -- Application\
  \ executed for 0.9924986 seconds with no stop\n\n1.110: [GC (Allocation Failure)\
  \  1557K->1540K(2500K), 0.0054299 secs]\n1.117: [Full GC (Allocation Failure)  1540K->1540K(2500K),\
  \ 0.0052930 secs]\n   -- Serial Collector did a Major (labeled as Full) GC\n\n1.123:\
  \ Total time for which application threads were stopped: 0.0135217 s,\n   Stopping\
  \ threads took: 0.0000990 seconds\n   -- Serial Collector did stop the application\
  \ for 0.0135217 seconds\n\n2   3874816   1473136   2401680\n2.128: Application time:\
  \ 1.0044262 seconds\n   -- Application executed for 1.0044262 seconds with no stop\n\
  \n2.130: [GC (Allocation Failure)  2601K->2580K(3784K), 0.0047073 secs]\n   -- Serial\
  \ Collector did a Minor GC\n\n2.135: Total time for which application threads were\
  \ stopped: 0.0064456 s,\n   Stopping threads took: 0.0001472 seconds\n   -- Serial\
  \ Collector did stop the application for 0.0064456 seconds\n\n3   3874816   425272\
  \   3449544\n3.131: Application time: 0.9955077 seconds\n   -- Application executed\
  \ for 1.9955077 seconds with no stop\n\n3.133: [GC (Allocation Failure)  3624K->3620K(4820K),\
  \ 0.0055259 secs]\n3.139: [Full GC (Allocation Failure)  3620K->3620K(4820K), 0.0057639\
  \ secs]\n   -- Serial Collector did a Major (labeled as Full) GC\n\n3.146: Total\
  \ time for which application threads were stopped: 0.0136471 s,\n   Stopping threads\
  \ took: 0.0001502 seconds\n   -- Serial Collector did stop the application for 0.0136471\
  \ seconds\n...\n```\n\nGC 日志信息确认了：\n\n* 串行收集器会停止应用程序以执行 Minor GC（新生代垃圾回收）。\n* 串行收集器会停止应用程序以执行\
  \ Major GC（年代垃圾回收）。\n* 串行收集器执行 Major GC 停止应用程序的时间比 Minor GC 更长。\n\nJava GC 教程 -\
  \ Herong's Tutorial Examples\n\n∟Serial Collector - \"+XX:+UseSerialGC\"\n\n## 堆内存区域使用报告\n\
  \n本节提供了对由 `-Xlog:gc+heap=debug` 日志选项生成的堆内存区域使用报告的解释。\n\n如果我们想知道堆是如何划分为不同的区域，可以查看\
  \ `-Xlog:gb+heap=debug` 选项打印的堆使用报告。\n\n使用 `-Xlog:gb+heap=debug` 选项重新运行 `GarbageCollection.java`\
  \ 几秒钟并检查第一个 \"Heap after GC ...\" 消息：\n\n```\n herong> java -Xms10m -Xmx10m -XX:+UseSerialGC\
  \ -Xlog:gc+heap=info \\\n   GarbageCollection\n...\n[debug][gc,heap] GC(0) Heap\
  \ after GC invocations=1 (full 0):\n                        def new generation \
  \  total 3072K, used 319K [...\n[debug][gc,heap] GC(0) eden space 2752K,   0% used\
  \ [...\n[debug][gc,heap] GC(0) from space 320K,  99% used [...\n[debug][gc,heap]\
  \ GC(0) to space 320K,   0% used [...\n[debug][gc,heap] GC(0) tenured generation\
  \   total 6848K, used 739K [...\n[debug][gc,heap] GC(0) the space 6848K,  10% used\
  \ [...\n[debug][gc,heap] GC(0) Metaspace used 2268K,\n                         \
  \ capacity 6149K, committed 6400K, reserved 10567K\n[debug][gc,heap] GC(0) class\
  \ space used 287K,\n              capacity 672K, committed 768K, reserved 104876K\n\
  \n以下是如何解读堆使用情况的：\n\n* `def new generation total 3072K, used 319K` - `def new generation`\
  \ 是串行收集器管理的 `Young（新生代）` 的内部名称，分配了 `3072K`，当前使用了 `319K`。\n* `eden space 2752K, 0%\
  \ used` - `eden space` 分配了 `2752K`，使用率为 `0%`。\n* `from space 320K, 99% used` - `from\
  \ space` 分配了 `320K`，使用率为 `99%`。\n* `to space 320K, 0% used` - `to space` 分配了 `320K`，使用率为\
  \ `0%`。\n* `tenured generation total 6848K, used 739K` - `tenured generation` 是串行收集器管理的\
  \ `Tenured（老年代）` 的内部名称，分配了 `6848K`，当前使用了 `739K`。\n* `Metaspace used 2268K, ... reserved\
  \ 10568K` - `Metaspace`（不是堆的一部分）未由垃圾器管理，已使用 `2268K`。\n* `class space used 287K,\
  \ ... reserved 104876K` - `class space`（不是堆的一部分）未由垃圾器管理，已使用 `287K`。\n\n注意当通过 `-Xms10m\
  \ -Xmx10m` 指定堆大小为 `10 MB` 时，JVM 分配了 `3072K` 给新生代，`6848K` 给老年代。新生代占 `30%`，老年代占 `70%`。\n\
  \nJava GC 教程 - Herong's Tutorial Examples\n\n∟Serial Collector - \"+XX:+UseSerialGC\"\
  \n\n## 默认 NewRatio - 老年代与新生代\n\n本节介绍了 `NewRatio`，即老年代与新生代的大小比例。\n\n从上一个教程中，我们了解到串行收集器会将堆内存分为两个代：`30%`\
  \ 的 `new（新生代）` 和 `70%` 的 `old（老年代）`。在本教程中，让我们运行更多测试来确认这一点：\n\n### 1. 堆大小: 10 MB\
  \ -\n\n```\n herong> java -Xms10m -Xmx10m -XX:+UseSerialGC -Xlog:gc+heap=info \\\
  \n   GarbageCollection\n...\n[debug][gc,heap] GC(0) Heap after GC invocations=1\
  \ (full 0):\n                        def new generation   total 3072K, used 319K\
  \ [...\n[debug][gc,heap] GC(0) eden space 2752K,   0% used [...\n[debug][gc,heap]\
  \ GC(0) from space 320K,  99% used [...\n[debug][gc,heap] GC(0) to space 320K, \
  \  0% used [...\n[debug][gc,heap] GC(0) tenured generation   total 6848K, used 739K\
  \ [...\n[debug][gc,heap] GC(0) the space 6848K,  10% used [...\n...\n```\n\n###\
  \ 2. 堆大小: 20 MB -\n\n```\n herong> java -Xms20m -Xmx20m -XX:+UseSerialGC -Xlog:gc+heap=info\
  \ \\\n   GarbageCollection\n...\n[gc,heap] GC(0) Heap after GC invocations=1 (full\
  \ 0):\n                 def new generation   total 6144K, used 639K [...\n[gc,heap]\
  \ GC(0) eden space 5504K,   0% used [...\n[gc,heap] GC(0) from space 640K,  99%\
  \ used [...\n[gc,heap] GC(0) to space 640K,   0% used [...\n[gc,heap] GC(0) tenured\
  \ generation   total 13696K, used 1444K [...\n[gc,heap] GC(0) the space 13696K,\
  \  10% used [...\n...\n```\n\n### 3. 堆大小: 40 MB -\n\n```\n herong> java -Xms40m\
  \ -Xmx40m -XX:+UseSerialGC -Xlog:gc+heap=info \\\n   GarbageCollection\n...\n[debug][gc,heap]\
  \ GC(0) Heap after GC invocations=1 (full 0):\n                        def new generation\
  \   total 12288K, used 1343K [...\n[debug][gc,heap] GC(0) eden space 10944K,   0%\
  \ used [...\n[debug][gc,heap] GC(0) from space 1344K,  99% used [...\n[debug][gc,heap]\
  \ GC(0) to space 1344K,   0% used [...\n[debug][gc,heap] GC(0) tenured generation\
  \   total 27328K, used 2024K [...\n[debug][gc,heap] GC(0) the space 27328K,   7%\
  \ used [...\n...\n```\n\n### 4. 堆大小: 80 MB -\n\n\n\n\n\n```bash\n herong> java -Xms80m\
  \ -Xmx80m -XX:+UseSerialGC -Xlog:gc+heap=info \\\n   GarbageCollection\n...\n[debug][gc,heap]\
  \ GC(0) Heap after GC invocations=1 (full 0):\n                        def new generation\
  \   total 24576K, used 2688K [...\n[debug][gc,heap] GC(0)   eden space 21888K, \
  \  0% used [...\n[debug][gc,heap] GC(0)   from space 2688K, 100% used [...\n[debug][gc,heap]\
  \ GC(0)   to   space 2688K,   0% used [...\n[debug][gc,heap] GC(0)  tenured generation\
  \   total 54656K, used 3308K [...\n[debug][gc,heap] GC(0)    the space 54656K, \
  \  6% used ...\n...\n```\n\n下表是上述测试的总结：\n\n```\n Heap Size   New Generation   Tenured\
  \ Generation\n---------   --------------   ------------------\n      10M       \
  \ 3072K 30%            6848K 70%\n      20M        6144K 30%           13696K 70%\n\
  \      40M       12288K 30%           27328K 70%\n      80M       24576K 30%   \
  \        54656K 70%\n```\n\n结论：默认情况下，Serial GC 将堆的 30% 分配给“新生年代”，70% 分配给老年代。或者说“老年代”与“新生年代”大小的默认比例为\
  \ 2.33。这个比例也称为 `NewRatio`。\n\n[Java GC 教程 - Herong 的教程示例\n\n∟Serial 器 - \"+XX:+UseSerialGC\"\
  \n\n∟`-XX:NewRatio` - 老年代与“新生”年代的比例\n\n本节描述了默认的“新生”比例（老年代与“新生”年代的大小比例）。\n\n如果你的应用程序使用了大量短命对象，你可能希望通过使用\
  \ `-XX:NewRatio` JVM 选项降低老年代相对于“新生”年代的比例。\n\n默认情况下，根据我们在上一个教程中做的测试，“NewRatio”被设置为\
  \ 2.33。如果我们指定 `-XX:NewRatio=1` 并使用 `-Xms40m -Xmx40m`，那么 40 MB 的堆将平分为 20 MB 的新生年代和\
  \ 20 MB 的老年代。\n\n```bash\n herong> java -Xms40m -Xmx40m -XX:NewRatio=1 -XX:+UseSerialGC\
  \ \\\n   -Xlog:gc+heap=info GarbageCollection\n...\n[debug][gc,heap] GC(0) Heap\
  \ after GC invocations=1 (full 0):\n                        def new generation \
  \  total 18432K, used 2048K [...]\n[debug][gc,heap] GC(0)   eden space 16384K, \
  \  0% used [...]\n[debug][gc,heap] GC(0)   from space 2048K, 100% used [...]\n[debug][gc,heap]\
  \ GC(0)   to   space 2048K,   0% used [...]\n[debug][gc,heap] GC(0)  tenured generation\
  \   total 20480K, used 2249K [...]\n[debug][gc,heap] GC(0)    the space 20480K,\
  \  10% used [...]\n```\n\n输出确认了 NewRatio 约为 1（或 20480K/18432K）。\n\n如果你想减小“新生”年代的大小，可以指定\
  \ `-XX:NewRatio=3` 和 `-Xms40m -Xmx40m`，这将产生约 30 MB 的老年代和 10 MB 的“新生”年代：\n\n```bash\n\
  \ herong> java -Xms40m -Xmx40m -XX:NewRatio=3 -XX:+UseSerialGC \\\n   -Xlog:gc+heap=info\
  \ GarbageCollection\n\n...\n[debug][gc,heap] GC(0) Heap after GC invocations=1 (full\
  \ 0):\n                        def new generation   total 9216K, used 1024K [...]\n\
  [debug][gc,heap] GC(0)   eden space 8192K,   0% used [...]\n[debug][gc,heap] GC(0)\
  \   from space 1024K, 100% used [...]\n[debug][gc,heap] GC(0)   to   space 1024K,\
  \   0% used [...]\n[debug][gc,heap] GC(0)  tenured generation   total 30720K, used\
  \ 2041K [...]\n[debug][gc,heap] GC(0)    the space 30720K,   6% used [...]\n```\n\
  \n你也可以直接使用 `-XX:NewSize=...` 和 `-XX:MaxNewSize=...` 选项直接指定“新生”年代的大小：\n\n```bash\n\
  \ herong> java -Xms40m -Xmx40m -XX:NewSize=9m -XX:MaxNewSize=11m \\\n   -XX:+UseSerialGC\
