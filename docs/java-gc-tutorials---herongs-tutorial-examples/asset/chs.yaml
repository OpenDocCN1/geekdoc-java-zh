  # Java GC 教程 - Herong 的教程示例\n\n## Garbage First (G1) 垃圾收集器 - \"+XX:+UseG1GC\"\n\n\
  ### Full GC 时所有阶段的最大日志\n\n本节演示了如何使用 `-Xlog:gc*=trace` 选项来打印 G1 收集器执行 Full GC 时所有阶段的最大日志信息。\n\
  \n如果你想知道 G1 Full GC 过程中执行了哪些阶段，以及每个阶段是如何执行的，你需要通过 `-Xlog:gc*=trace` 选项开启最大 GC 日志并查看所有的\
  \ GC 日志消息。\n\n以下是我为了捕获 G1 收集器执行的单个 Full GC 所有日志消息所的操作：\n\n1. 运行以下命令将所有日志消息捕获到文件中：\n\
  \n```\n herong> java -Xms16m -Xmx64m \\\n   -XX:+UseG1GC -Xlog:gc*=trace GarbageCollection\
  \ > output.txt\n```\n\n2. 在文本编辑器中打开日志文件 `output.txt`。使用正则表达式 `Pause Full \\(G1 Evacuation\
  \ Pause\\)` 查找日志消息行。取第一个匹配的日志消息，例如：\n\n```\n [info ][gc,start] GC(35) Pause Full\
  \ (G1 Evacuation Pause)\n```\n\n此日志消息表示 CMS 收集器开始了一个 Full GC (GC #35)。\n\n3. 在编辑器中搜索所有包含\
  \ `GC\\(35\\)` 的日志行，以获取 GC #35 的所有日志：\n\n```\n GC(35)  num     #instances      \
