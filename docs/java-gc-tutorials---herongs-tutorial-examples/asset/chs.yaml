  \ 的教程示例(#part0001.xhtml)\n\n## 对象引用与垃圾回收\n\n### 对象引用类型\n\n本节描述了 Java 应用中可以使用的 6\
  \ 种对象引用。\n\n在 Java 应用中，我们可能对数据对象有 6 种引用：\n\n- **强引用 (Strong Reference)**：强引用是对应用程序中使用的普通对象所持有对象的引用。垃圾回收器不会移除仍然具有强引用的对象。\n\
  - **软引用 (Soft Reference)**：软引用是对 `SoftReference` 包装对象所持有对象的引用。垃圾回收器可以移除仅具有软引用的对象。\n\
  - **弱引用 (Weak Reference)**：弱引用是对 `SoftReference` 包装对象所持有对象的引用（注：原文此处为 SoftReference\
  \ 应为 WeakReference）。垃圾回收器可以移除仅具有弱引用的对象。\n- **最终引用 (Final Reference)**：最终引用是对终结线程（finalizer\
  \ thread）所持有对象的引用。当垃圾回收器在对象上执行 `finalize()` 方法时，需要这种引用。\n- **虚引用 (Phantom Reference)**：虚引用是对\
  \ `PhantomReference` 包装对象所持有对象的引用。垃圾回收器可以移除仅具有虚引用的对象。\n- **JNI 弱引用 (JNI Weak Reference)**：JNI\
  \ 弱引用是由 Java Native Interface 管理的对象的引用。\n\n## 强引用 GC 测试程序\n\n本节描述了一个使用强引用的简单 GC\
  \ 测试程序，在本教程中，我们将编写一个仅使用强引用的测试程序来展示对垃圾回收器的影响：\n\n```java\n /* GCRef.java\n * Copyright\
  \ (c) Herong.com. 保留权利。\n */\nimport java.util.*;\nclass GCRef {\n   static MyList\
  \ objList = null;\n   static int objSize = 1024; // KB\n   static int chunkSize\
  \ = 32; // 对象的数量\n   static int wait = 1000;   // 毫秒\n   public static void main(String[]\
  \ arg) {\n      System.out.println(\"Parameters: Size=\"+objSize+\"KB, Base=\"+baseSize+\"\
  , Wait=\"+wait+\"ms\");\n      objList = new MyList();\n      myTest();\n   }\n\
  \   public static void myTest() {\n      for (int m=0; m<baseSize; m++) {\n    \
  \     objList.add(new MyObject());\n      }\n\n      Runtime rt = Runtime.getRuntime();\n\
  \      System.out.println(\"Real  Exec  Proc.  Total  Free  Used  Free\");\n   \
  \   System.out.println(\"Time  Time   Obj.   Mem.  Mem.    Free\");\n      long\
  \ dt0 = System.currentTimeMillis();\n      long count = 0;\n      while (true) {\n\
  \         for (int m=0; m<chunkSize; m++) {\n            objList.add(new MyObject());\n\
  \         }\n         for (int m=0; m<chunkSize; m++) {\n            objList.removeTail();\n\
  \         }\n         count++;\n\n         mySleep(wait);\n         long tm = rt.totalMemory()/1024;\n\
  \         long fm = rt.freeMemory()/1024;\n         long ratio = (100*fm)/tm;\n\
  \         long dt = System.currentTimeMillis() - dt0;\n         long de = dt - (count*wait);\n\
  \         System.out.println((dt/1000)+\"  \"+(de/1000)\n            +\"  \"+count*chunkSize\n\
  \            +\"  \"+tm+\"  \"+fm+\"  \"+(tm-fm)+\"  \"+ratio+\"%\");\n      }\n\
  \   }\n   static void mySleep(int t) {\n      try {\n         Thread.sleep(t);\n\
  \      } catch (InterruptedException e) {\n         System.out.println(\"Interrupted...\"\
  );\n      }\n   }\n   static class MyObject {\n      private long[] obj = null;\n\
  \      public MyObject next = null;\n      public MyObject prev = null;\n      public\
  \ MyObject() {\n         obj = new long[objSize*128]; //128*8=1024 bytes\n     \
  \ }\n   }\n   static class MyList {\n      MyObject head = null;\n      void add(MyObject\
  \ o) {\n      }\n      void removeTail() {\n      }\n   }\n}\n```\n\n\n\n\n\n- 如果\
  \ \"from\" 空间中的一个对象只有一个强引用，且该引用被应用程序移除，它将在下一次 `Minor GC` 中被 `Serial` 收集器移除。\n\n\
  ## Java GC 教程 - Herong 的教程示例\n\n### 对象引用与垃圾回收\n\n#### 最终引用 GC 测试程序\n\n本节阐述了一个 GC\
  \ 测试程序 `GCFinalRef.java`，用于演示最终引用（final references）对垃圾回收器的影响。\n\n现在，让我们来写另一个使用最终引用的\
  \ GC 测试程序：\n\n```java\n /* GCFinalRef.java\n * Copyright (c) HerongYang.com. All\
  \ Rights Reserved.\n */\nimport java.util.*;\nclass GCFinalRef {\n   static MyList\
  \ objList = null;\n   static int objSize = 1024; // 单位 KB, default = 1 MB\n   static\
  \ int baseSize = 32;  // 基础中的对象数量\n   static int chunkSize = 32; // 块中的对象数量\n  \
  \ static int wait = 1000;    // 毫秒: 1 秒\n   public static void main(String[] arg)\
  \ {\n      if (arg.length>0) objSize = Integer.parseInt(arg[0]);\n      if (arg.length>1)\
  \ baseSize = Integer.parseInt(arg[1]);\n      if (arg.length>2) chunkSize = Integer.parseInt(arg[2]);\n\
  \      if (arg.length>3) wait = Integer.parseInt(arg[3]);\n      System.out.println(\"\
  Parameters: \"+Size=\"+objSize+\"KB\"\n         +\", Base=\"+baseSize +\", Chunk=\"\
  +chunkSize\n         +\", Wait=\"+wait+\"ms\");\n      objList = new MyList();\n\
  \      myTest();\n   }\n   public static void myTest() {\n      for (int m=0; m<baseSize;\
  \ m++) {\n         objList.add(new MyObject());\n      }\n\n      Runtime rt = Runtime.getRuntime();\n\
  \      System.out.println(\n         \"Real  Exec  Proc.  Total  Free  Used  Free\"\
  );\n      System.out.println(\n         \"Time  Time   Obj.   Mem.  Mem.  Mem. \
  \   %.\");\n      long dt0 = System.currentTimeMillis();\n      long count = 0;\n\
  \      while (true) {\n         for (int m=0; m<chunkSize; m++) {\n            objList.add(new\
  \ MyObject());\n         }\n         for (int m=0; m<chunkSize; m++) {\n       \
  \     objList.removeTail();\n         }\n         count++;\n\n         mySleep(wait);\n\
  \         long tm = rt.totalMemory()/1024;\n         long fm = rt.freeMemory()/1024;\n\
  \         long ratio = (100*fm)/tm;\n         long dt = System.currentTimeMillis()\
  \ - dt0;\n         long de = dt - (count*wait);\n         System.out.println((dt/1000)+\"\
  \  \"+(de/1000)\n            +\"  \"+count*chunkSize\n            +\"  \"+tm+\"\
  \  \"+fm+\"  \"+(tm-fm)+\"  \"+ratio+\"%\");\n      }\n   }\n   static void mySleep(int\
  \ t) {\n      try {\n         Thread.sleep(t);\n      } catch (InterruptedException\
  \ e) {\n         System.out.println(\"Interreupted...\");\n      }\n   }\n   static\
  \ class MyObject {\n      public static long count = 0;\n      private long[] obj\
  \ = null;\n      public MyObject next = null;\n      public MyObject prev = null;\n\
  \      public MyObject() {\n         count++;\n         obj = new long[objSize*128];\
  \ //128*8=1024 bytes\n      }\n      protected final void finalize() {\n       \
  \  count--;\n      }\n   }\n   static class MyList {\n      MyObject head = null;\n\
  \      MyObject tail = null;\n      void add(MyObject o) {\n         if (head==null)\
  \ {\n            head = o;\n            tail = o;\n         } else {\n         \
  \   o.prev = head;\n            head.next = o;\n            head = o;\n        \
  \ }\n      }\n      void removeTail() {\n         if (tail!=null) {\n          \
  \  if (tail.next==null) {\n               tail = null;\n               head = null;\n\
  \            } else {\n               tail = tail.next;\n               tail.prev\
  \ = null;\n            }\n         }\n      }\n   }\n}\n```\n\n该程序与 `GCStrongRef.java`\
  \ 相同，区别在于：\n\n- 在 `MyObject` 类中添加了 `finalize()` 方法，用于更新静态变量 `\"count\"`。\n- 当一个\
  \ `MyObject` 对象准备从堆（Heap）中移除时，它会被放入最终化线程（finalizer thread），并为该对象添加最终引用。\n\n顺便提一下，从\
  \ JDK 9 开始，`java.lang.Object.finalize()` 已被弃用。因此此测试程序在未来的 JDK 版本中可能会失效。\n\n## Java\
  \ GC 教程 - Herong 的教程示例\n\n### 对象引用与垃圾回收\n\n#### 使用 Serial GC 的最终引用测试\n\n本节提供了一个教程，展示带有最终引用的对象如何进入最终化线程队列以执行其\
  \ `finalize()` 方法。如果最终化器执行太慢，带有最终引用的对象将填满堆。\n\n现在让我们运行程序：\n\n\n\n` 标签内部中断了），且包含了大量重复的\
  \ GC 日志代码。为了确保翻译的质量和逻辑性，我将针对您提供的**结构化文本（Conclusion、Tutorial 及正文部分）**进行专业翻译。如果需要对特定的日志行进行分析，请提供完整的日志片段。\n\
  \n以下是翻译后的内容：\n\n[content]\n\n### 结论\n\n- 当带有 `finalize()` 方法的对象从应用程序中释放时，它们会被放入队列中，等待终化器线程（finalizer\
  \ thread）执行 `finalize()` 方法。\n- 终化器线程队列中的对象带有最终引用（final references）。串口收集器（Serial\
  \ collector）在这些 `finalize()` 方法执行之前无法移除它们。\n- 终化器线程运行速度似乎非常缓慢，导致堆中持有了许多只有最终引用的对象。\n\
  - 当 Serial Major GC（大垃圾回收）无法释放更多堆内存时，它会启动 Serial Full GC（并发全垃圾回收）。\n\nJava GC 教程\
  \ - Herong 的教程示例\n\n∟对象引用与垃圾回收\n\n**最终引用的性能影响**\n\n本节通过对比运行 `GCFinalRef.java` 和\
  \ `GCStrongRef.java` 的执行结果，提供了一个展示最终引用对性能影响的教程。最终引用会让执行速度变慢 2 倍！\n\n在之前的教程中，我们学习到带有\
  \ `finalize()` 方法的对象会在堆中留下带有最终引用的死循环对象，直到它们被终化器线程处理完毕。\n\n在本教程中，让我们对比一下 `GCFinalRef.java`\
  \ 与 `GCStrongRef.java` 的执行情况，以观察最终引用的性能影响。\n\n### 使用最终引用的 GCFinalRef.java 执行情况：\n\
  \n```\n herong> java -XX:+UseSerialGC -Xms600m -Xmx600m \\\n   -XX:NewRatio=1 -XX:SurvivorRatio=1\
  \ \\\n   GCFinalRef 1024 32 32 0\n\nParameters: Size=1024KB, Base=32, Chunk=32,\
  \ Wait=0ms\nReal  Exec  Proc.  Total  Free  Used  Free\nTime  Time   Obj.   Mem.\
  \  Mem.  Mem.    %.\n0  0  32  512000  442366  69634  86%\n0  0  64  512000  412901\
  \  99099  80%\n0  0  96  512000  379150  132850  74%\n...\n10  10  24256  512000\
  \  346381  165619  67%\n10  10  24288  512000  313617  22388    42%\n11  11  24320\
  \  510000224444  26666544%\n\n\n\n\n10     .。。\n\n### 结论\n\n- 带有 `finalize()` 方法的对象从应用程序中释放时，它们会被放入队列中，等待终化器线程执行\
  \ `finalize()` 方法。\n- 终化器线程队列中的对象带有最终引用。串口收集器在这些 `finalize()` 方法执行之前无法移除它们。\n- 终化器线程运行速度似乎非常缓慢，导致堆中持有了许多只有最终引用的对象。\n\
  - 当 Serial Major GC 无法释放更多堆内存时，它会启动 Serial Full GC。\n\nJava GC 教程 - Herong 的教程示例\n\
  \n**垃圾回收性能测试程序**\n（注：此处翻译了您原文中 Conclusion 之后的引导语）\n\n**GCPerformance.java - 性能测试程序**\n\
  \n本节提供了关于垃圾回收测试程序的教程笔记和示例代码。主题包括吞吐量计算；延迟计算；操作系统中断；P99（百分分位）性能；以最高优先级运行 JVM。\n\n\
  > GCPerformance.java - 性能测试程序\n> GCPerformance.java - 输出\n> 等待时间对性能的影响\n> 对象大小对性能的影响\n\
  > 分块大小对性能的影响\n> 与 GC 无关的性能抖动\n> 性能测试与系统中断\n> \"START /REALTIME\" 以最高优先级运行 JVM\n\
  > GCFinalRef99.java - 99 百分位性能\n> GCFinalRef99.java - 输出验证\n> GCFinalRef99V2.java\
  \ - 带负载百分分位性能\n> GCFinalRef99V2.java - 负载水平\n> GCFinalRef99V2.java - 对象数量与大小\n\n\
  **要点总结：**\n\n- 对象分配和释放可以通过简单的模拟程序 `GCPerformance.java` 进行垃圾回收测试。\n- 吞吐量性能可以定义为在给定时间内执行的平均任务数量。\n\
  - 延迟性能可以定义为执行单个任务所需的最长时间。\n- 测试程序的任务定义为：创建一个新对象并将其添加到链表中，然后从链表中移除一个旧对象。\n- 由于某些原因，吞吐量性能会出现抖动。当分块大小为\
  \ 16 个对象且每个对象 1024K 时，这些抖动显示为正常的 2 倍。\n- 如果我们采用前 99%（P99）最佳样本，性能测量将更准确。\n- 在 Windows\
  \ 系统上，可以使用 `START /REALTIME` 命令以最高优先级运行 JVM，以减少系统中断。\n\n\n\n\n\n```java\n /* GCPerformance.java\n\
  \ * Copyright (c) HerongYang.com. All Rights Reserved.\n */\nclass GCPerformance\
  \ {\n   static MyList objList = null;\n   static int objSize = 1024; // in KB, default\
  \ = 1 MB\n   static int baseSize = 32;  // # of objects in the base\n   static int\
  \ chunkSize = 32; // # of objects in chunk\n   static int wait = 1000;    // in\
  \ milliseconds: 1 second\n   static int warmup = 256;   // warmup loops: 256*32\
  \ = 8GB\n   public static void main(String[] arg) {\n      if (arg.length>0) objSize\
  \ = Integer.parseInt(arg[0]);\n      if (arg.length>1) baseSize = Integer.parseInt(arg[1]);\n\
  \      if (arg.length>2) chunkSize = Integer.parseInt(arg[2]);\n      if (arg.length>3)\
  \ wait = Integer.parseInt(arg[3]);\n      if (arg.length>4) warmup = Integer.parseInt(arg[4]);\n\
  \      System.out.println(\"Parameters: +\"Size=\"+objSize+\"KB\"\n         +\"\
  , Base=\"+baseSize +\", Chunk=\"+chunkSize\n         +\", Wait=\"+wait+\"ms\" +\"\
  , Warmup=\"+warmup);\n      objList = new MyList();\n      myTest();\n   }\n   public\
  \ static void myTest() {\n      for (int m=0; m<baseSize; m++) {\n         objList.add(new\
  \ MyObject());\n      }\n      for (int k=0; k<warmup; k++) {\n         for (int\
  \ m=0; m<chunkSize; m++) {\n            objList.add(new MyObject());\n         }\n\
  \         for (int m=0; m<chunkSize; m++) {\n            objList.removeTail();\n\
  \         }\n      }\n\n      Runtime rt = Runtime.getRuntime();\n      System.out.println(\"\
  Real:Exec  Lat.     Throughput      \"\n         +\"Total:Free  Proc.\");\n    \
  \  System.out.println(\"Time:Time  ms/o  Ave:Min:Max:Chunk  \"\n         +\" Mem.:Mem.\
  \   Obj.\");\n      long dt0 = System.currentTimeMillis();\n      long dt1 = System.currentTimeMillis();\n\
  \      long minPerf = 999999;\n      long maxPerf = 0;\n      long count = 0;\n\
  \      while (true) {\n         for (int m=0; m<chunkSize; m++) {\n            objList.add(new\
  \ MyObject());\n         }\n         for (int m=0; m<chunkSize; m++) {\n       \
  \     objList.removeTail();\n         }\n         count++;\n\n         mySleep(wait);\n\
  \         long tm = rt.totalMemory()/1024;\n         long fm = rt.freeMemory()/1024;\n\
  \         long dt2 = System.currentTimeMillis();\n         long dt = dt2 - dt0;\n\
  \         long de = dt - (count*wait);\n         long perf = (1000*chunkSize)/(dt2-dt1-wait);\
  \ // per second\n         if (perf<minPerf) minPerf = perf;\n         if (perf>maxPerf)\
  \ maxPerf = perf;\n\n         System.out.println((dt)      // Real time in millis\n\
  \            +\":\"+(de)                 // Execution time in millis\n         \
  \   +\"  \"+(1000000/minPerf)   // Latency (ms/1000 objects)\n            +\"  \"\
  +((1000*count*chunkSize)/de) // Average throughput\n            +\":\"+minPerf \
  \             // Best throughput\n            +\":\"+maxPerf              // Worst\
  \ throughput\n            +\":\"+perf                 // Chunk throughput\n    \
  \        +\"  \"+tm+\":\"+fm           // Total and free memory in KB\n        \
  \    +\"  \"+(count*chunkSize)); // Objects processed\n         dt1 = dt2;\n   \
  \   }\n   }\n   static void mySleep(int t) {\n      try {\n         Thread.sleep(t);\n\
  \      } catch (InterruptedException e) {\n         System.out.println(\"Interreupted...\"\
  );\n      }\n   }\n   static class MyObject {\n      private long[] obj = null;\n\
  \      public MyObject next = null;\n      public MyObject prev = null;\n      public\
  \ MyObject() {\n         obj = new long[objSize*128]; // 128*8=1024 bytes\n    \
  \     for (int i=0; i<objSize*128; i++) {\n            obj[i] = i/2+i/3+i/4+i/5;\
  \ // some work load\n         }\n      }\n   }\n   static class MyList {\n     \
  \ MyObject head = null;\n      MyObject tail = null;\n      void add(MyObject o)\
  \ {\n         if (head==null) {\n            head = o;\n            tail = o;\n\
  \         } else {\n            o.prev = head;\n            head.next = o;\n   \
  \         head = o;\n         }\n      }\n      void removeTail() {\n         if\
  \ (tail!=null) {\n            if (tail.next==null) {\n               tail = null;\n\
  \               head = null;\n            } else {\n               tail = tail.next;\n\
  \               tail.prev = null;\n            }\n         }\n      }\n   }\n}\n\
  ```\n\n关于该测试程序的一些说明：\n\n- 内部类 `MyObject` 用于表示一个通用对象。对象的大小可以通过 `objSize` 参数控制。\n\n\
  - 另一个内部类 `MyList` 用于作为注册和释放对象的管理器。它使用链表数据结构来完成工作。\n\n- 主测试方法 `myTest()` 分为两个部分：初始化/预热和测试运行。在这些部分，对象会被添加到链表中；在测试运行部分，会从链表中移除对象。\n\
  \n- 初始化/预热部分执行两项任务：由 `baseSize` 参数控制的链表初始化；以及通过 `warmup` 参数控制的对块（chunks）对象的堆预热。\n\
  \n- 测试运行部分是一个无限循环。在循环的每次迭代中，会将 `chunkSize` 数量的新对象添加到链表中，并移除 `chunkSize` 数量的旧对象。\n\
  \n- 你可以使用 `wait` 参数在每次迭代中等待若干毫秒来降低循环速度。\n\n### 吞吐量\n\n**吞吐量**定义为每秒处理的对象数量。测试程序的输出关注以下两个指标：\n\
  \n- 总吞吐量的计算方法为总对象数除以经过的时间。\n- 记录了块（chunks）的最佳和最差吞吐量。\n\n### 延迟\n\n**延迟**定义为处理单个对象所需的时间。其计算方法如下：\n\
  \n- 总延迟通过吞吐量的乘法倒数计算。\n- 需要归一化为每 1000 个对象的毫秒。\n\nJava 教程 - Herong 的示例\n\n垃圾回收性能测试\n\
