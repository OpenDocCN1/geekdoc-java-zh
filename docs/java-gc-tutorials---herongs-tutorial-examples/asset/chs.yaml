  \n\n### `-XX:SurvivorRatio` - Eden 和 Survivor 区的比例\n\n本节描述了默认的“新生”比例（老年代与“新生”年代的大小比例）。\n\
  \n我们可以控制 Eden 空间与 Survivor 区之间的比例吗？答案是肯，使用 `-XX:SurvivorRatio` 选项。\n\nEden 空间与 Survivor\
  \ 区之间的比例定义为 `SurvivorRatio`。\n\n默认情况下，`SurvivorRatio` 设置为 8。你可以通过测试 `-Xms20m -Xmx20m\
  \ -XX:NewRatio=1 -XX:SurvivorRatio=6` 来验证。“新生”年代将获得 10 MB，分为 7.5 MB 的 Eden 区、1.25\
  \ MB 的 from Survivor 区和 1.25 MB 的 to Survivor 区：\n\n```bash\n herong> java -Xms20m\
  \ -Xmx20m -XX:NewRatio=1 -XX:SurvivorRatio=6 \\\n   -XX:+UseSerialGC -Xlog:gc+heap=info\n\
  ...\n[debug][gc,heap] GC(0) Heap after GC invocations=1 (full 0):\n            \
  \            def new generation   total 8960K, used 1279K [...]\n[debug][gc,heap]\
  \ GC(0)   eden space 7680K,   0% used [...]\n[debug][gc,heap] GC(0)   from space\
  \ 1280K,  99% used [...]\n[debug][gc,heap] GC(0)   to   space 1280K,   0% used [...]\n\
  [debug][gc,heap] GC(0)  tenured generation   total 10240K, used 1590K [...]\n[debug][gc,heap]\
