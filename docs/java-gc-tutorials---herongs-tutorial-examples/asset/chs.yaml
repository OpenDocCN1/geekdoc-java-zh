  \n\nParallel Collector Stops Application for Minor/Major GC\n\nThis section provides\
  \ log messages showing that the Parallel Collector stops the application for both\
  \ Minor GC and Major GC. The next thing we want to confirm is stop-the-world behavior\
  \ of the Parallel Collector. There seems to be no easy way to do this in JVM 9 or\
  \ higher releases. I could not find any `-Xlog` options to generate any log messages\
  \ about how long application gets stopped by the Parallel Collector. But if you\
  \ are using JVM 8 or older, you can confirm stop-the-world behavior of the Parallel\
  \ Collector with `-XX:+PrintGCStoppedTime` and `-XX:+PrintGCApplicationcurrentTime`.\n\
  \nJVM options:\n```\n herong> \\Progra~\\java\\jdk1.8.0\\bin\\java -Xms2m -Xmx64m\n\
  \   -XX:+UseParallelGC -XX:+PrintGCDetails -XX:+PrintCTimeStamps\n   -XX:+PrintGCStoppedTime\n\
  \   -XX:+PrintGCApplicationcurrentTime\n```\n\nGarbageCollectionStep/TotalMemory/FreeMemory/UsedMemory:\n\
  \n0.735: Application time: 0.1749388 seconds\n0.736: [GC (Allocation Failure) [PSYoungGen:\
