  \ 7680K/1280K）。\n\nJava GC 教程 - Herong 的教程示例\n\nSerial 器 - \"+XX:+UseSerialGC\"\n\
  \n### Serial GC 追踪 - 紧凑堆\n\n本节提供了如何在紧凑堆大小下追踪 Serial GC 运行的教程。我们知道测试程序 `GarbageCollection.java`\
