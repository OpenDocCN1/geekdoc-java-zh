  *   `-XX:+UseConcMarkSweepGC` JVM 参数调用了 `ParNew` 收集器进行年轻代 GC。\n*   `ParNew` 收集器以“停顿世界”（stop-the-world）的方式执行年轻代\
  \ GC，而不是与应用程序执行并发进行。\n*   如果你有足够的年轻代内存，则不需要对老年代（Tenured generation）进行 GC。\n*   `CMS`\
  \ 收集器与年轻代 GC 无关。\n\nJava GC 教程 - Herong 的教程示例\n\n∟ 并发标记清除 (CMS) 收集器 - \"+XX:+UseConcMarkSweepGC\"\
