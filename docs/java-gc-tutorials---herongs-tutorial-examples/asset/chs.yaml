  \ 99% 的吞吐量目标。\n\nJava GC 教程 - Herong 示例\n\n∟并行回收器 - \"+XX:+UseParallelGC\"\n\n∟用于最佳延迟的自适应大小策略\n\
  \n本节提供了关于`并行回收器`如何使用`自适应大小策略`来实现最佳延迟目标的教程。\n\n根据 Java 文档，并行回收器使用的`自适应大小策略`允许你设置\
  \ 3 个性能目标，并让回收器决定为了满足这些目标的 GC 配置。\n\n在第一次测试中，让我们使用这些 JVM 选项让并行回收器为我们提供最佳延迟性能：\n\n\
  ```\n -XX:MaxGCPauseMillis=1\n   我们想要最佳延迟：\n   为我们提供最短的应用程序暂停时间或小于 1 毫秒。\n\n-XX:GCTimeRatio=1\n\
  \   我们不在乎吞吐量：\n   你可以花费 50%（即 1/(1+1)）的时间用于 GC。\n\n-Xmx1200m\n   我们不在乎内存占用：\n  \
  \ 你可以可以使用高达 1.2GB 的堆内存。\n```\n\n\n\n\n\n由于您提供的文本仅包含代码块，根据要求不需要翻译：\n\n```\nherong>\
  \ java -XX:+UseParallelGC -XX:MaxGCPauseMillis=1 \\\n   -XX:GCTimeRatio=9 -Xmx1200m\
