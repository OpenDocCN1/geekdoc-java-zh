  -XX:+NeverTenure\" 和 \"-XX:+AlwaysTenure\" 的有效性\n\n本节提供了一个教程，展示 `-XX:+NeverTenure`\
  \ 和 `-XX:+AlwaysTenure` JVM 参数对串行收集器有效。\n\nHotSpot JVM 还支持两个你可以用来控制晋升行为的隐藏选项：\n\n\
