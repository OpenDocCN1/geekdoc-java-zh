  \ 收集器发生了多次 Old GC，取而代之的是 Full GC。Java GC 教程 - Herong 的教程\n∟并发标记-清除 (CMS) 收集器 - \"\
  +XX:+UseConcMarkSweep\" `-XX:+UseCMSInitiatingOccupancy` 和 `-XX:CMSInitiatingFraction=20`\
  \ 可以在老年代达到 20% 时触发 CMS。\n\n在最后一个教程中，我们看到当老年代内存使用率达到 60% 时触发了 `CMS` 收集器。如果我们想更早启动\
  \ `CMS` 收集器，可以使用 `-XX:+UseCMSInitiatingOccupancy` 和 `-XX:CMSInitiatingFraction=20`\
  \ 选项，使用给定的 20% 老年代占用率来触发 CMS。\n\n\n\n\n\n此日志消息表示 CMS 收集器完成了一次完整的年代 GC（`GC #8`）。\n\
