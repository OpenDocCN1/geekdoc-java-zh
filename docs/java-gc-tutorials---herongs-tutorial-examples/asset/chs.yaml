  \n   -XX:TargetSurvivorRatio=99 \\\n   -Xlog:gc=info,gc+heap=debug,gc+age=trace\
  \ \\\n   -XX:InitialTenuringThreshold=3 -XX:MaxTenuringThreshold=3 \\\n   -XX:NewSize=102m\
