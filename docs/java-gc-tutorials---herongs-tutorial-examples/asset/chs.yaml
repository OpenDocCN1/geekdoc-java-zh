  \n### Java GC 教程\n- [Herong 的示例](https://wiki.example.org/part001.html)\n- [Serial\
  \ 收集器 - +XX:+UseSerialGC](https://wiki.example.org/part002.html)\n\n### -XX:TargetSurvivorRatio\n\
  \n本节介绍了 `-XX:TargetSurvivorRatio` 参数，它设置了幸存区的最大使用率。当达到此限制时，所有剩余对象无论年龄都会进入老年代。在之前的教程中，我们学习了存活晋晋（从幸存区进入老年代）：当存活对象达到晋代阈值时，它将进入老年代。\n\
  \n另一种触发晋代的情况：当幸存区的使用率达到 `-XX:TargetSurvivorRatio` 定义的比例时，这种情况被称为过晋（premature promotion）。Serial\
  \ 收集器使用 `-XX:TargetSurvivorRatio=50` 作为默认值，意味着幸存区的使用率保持在 50% 以下。这似乎浪费了内存。我们在 `GarbageCollection.java`\
  \ 程序中使用 `-XX:TargetSurvivorRatio=50` 运行第一次测试。\n\n```\nherong> java -Xms360m -Xmx360m\
