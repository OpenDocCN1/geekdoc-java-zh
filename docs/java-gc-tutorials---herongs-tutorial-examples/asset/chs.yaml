  \ 等待时间对性能的影响\n- 对象大小对性能的影响\n\n\n\n\n\n# Java GC 教程 - Herong 的示例\n\n## 堆内存区域与大小控制\n\
  \n本章提供了关于堆内存区域的教程笔记和示例代码。包括 `OutOfMemoryError` 异常；内存区域分配限制；`HotSpot` 与 `JRockit`\
  \ 的 `OutOfMemoryError` 比较。\n\n### Java 异常：\"java.lang.OutOfMemoryError: Java heap\
  \ space\"\n\n本节提供了一个教程示例，演示了 JVM 如何扩展堆空间以分配更多对象，以及在不允许进一步扩展时如何导致 `java.lang.OutOfMemoryError:\
  \ Java heap space` Java 异常。\n\n首先，让我们使用以下简单的程序 `HeapMemoryCrash.java` 来观察当堆内存耗尽时会发生什么：\n\
  \n```java\npublic class HeapMemoryCrash {\n    public static void main(String[]\
  \ args) {\n        List<byte[]> list = new ArrayList<>();\n        while (true)\
  \ {\n            list.add(new byte[1024 * 1024]); // 1MB array\n        }\n    }\n\
  }\n```\n\n### 核心点总结：\n\n*   当 Java 应用所需的内存超过其给定的限制时，JVM 会抛出 `OutOfMemoryError` 异常。\n\
  *   `OutOfMemoryError` 异常主要发生在 JVM 堆内存区域。\n*   JVM 堆内存的大小可以通过 `-Xms` 和 `-Xmx` 进行控制。\n\
  *   在 Windows 系统的 32 位 `HotSpot` 上，JVM 堆内存的大小限制为 1.5 GB（或 1,550 MB）。\n*   在 Windows\
  \ 系统的 64 位 `HotSpot` 上，JVM 堆内存的大小限制为 25 GB。\n\n\n\n\n\n```java\n /* HeapMemoryCrash.java\n\
  \ * Copyright (c) HerongYang.com. All Rights Reserved.\n */\nclass HeapMemoryCrash\
  \ {\n   public static void main(String[] a) {\n      int max = 1000;\n      Object[]\
  \ arr = new Object[max];\n      heapCheck();\n      for (int n=0; n<max; n++) {\n\
  \         arr[n] = new long[10*1024*128];\n         System.out.println((n+1)+\"\
  : \"\n            +((n+1)*10)+\" MB of objects created.\");\n         heapCheck();\n\
  \      }\n   }\n   public static void heapCheck() {\n      Runtime rt = Runtime.getRuntime();\n\
  \      rt.gc();\n      long total = rt.totalMemory();\n      long free = rt.freeMemory();\n\
  \      long used = total - free;\n      java.io.Console con = System.console();\n\
  \      con.format(\"Total memory: %s%n\",total);\n      con.format(\" Free memory:\
  \ %s%n\",free);\n      con.format(\" Used memory: %s%n\",used);\n      String str\
  \ = con.readLine(\"Press ENTER key to continue: \");\n   }\n}\n```\n\n该程序的设计目的是：\n\
  \n*   运行一个 1000 次的循环。如果你愿意，可以将其调大。\n*   在每次迭代中，都会创建一个包含 `10*1024*128` 个元素的 `long[]`\
  \ 数组对象。由于每个元素占用 8 字节，该对象所需的总存储空间为 10 MB。\n*   每个数组对象的引用存储在另一个数组中以保持其被引用（或“被使用”），这样\
  \ JVM 就不会从堆（Heap）中将其释放掉。\n*   使用 `totalMemory()` 和 `freeMemory()` 方法来报告堆的当前使用情况。\n\
  \n使用 JDK 17 的 HotSpot JVM 编译并运行：\n\n```\n herong> javac HeapMemoryCrash.java\n\n\
  herong> java -Xms20m -Xmx50m HeapMemoryCrash\n\nTotal memory: 20447232\n Free memory:\
  \ 20188720\n Used memory: 258512\nPress ENTER key to continue:\n\n1: 10 MB of objects\
  \ created.\nTotal memory: 26152960\n Free memory: 15377464\n Used memory: 10775496\n\
  Press ENTER key to continue:\n\n2: 20 MB of objects created.\nTotal memory: 50724864\n\
  \ Free memory: 29463808\n Used memory: 21261056\nPress ENTER key to continue:\n\n\
  3: 30 MB of objects created.\nTotal memory: 50724864\n Free memory: 18978032\n Used\
  \ memory: 31746832\nPress ENTER key to continue:\n\n4: 40 MB of objects created.\n\
  Total memory: 50724864\n Free memory: 8492256\n Used memory: 42232608\nPress ENTER\
  \ key to continue:\nException in thread \"main\" java.lang.OutOfMemoryError: Java\
  \ heap space\n   at HeapMemoryCrash.main(HeapMemoryCrash.java:10)\n```\n\n输出结果证实了：\n\
  \n*   `-Xms20m` 选项有效，JVM 在启动时根据第一次调用 `totalMemory()` 的结果预留了 20,447,232 字节（约 20 MB）。\n\
  *   第一次 `heapCheck()` 调用报告使用了 258,512 字节的堆空间。此时，我的 Java 应用仅创建了 1 个数组对象 `Object[1000]`，大约占用\
  \ 8,000 字节。因此，JVM 本身占用了堆中约 250 KB 的空间。\n*   第二次 `heapCheck()` 调用报告使用了 10,775,496\
  \ 字节的堆空间，增加了 10,516,984 字节。此时，我的 Java 应用增加了 1 个数组对象 `long[10*1024*128]`，大约占用 10,485,760\
  \ 字节，这与堆使用空间的增加量相匹配（包含了一些数组开销使用）。这证实了数组对象是在分配在堆中的。\n*   第二次 `heapCheck()` 调用还报告\
  \ JVM 将总堆空间从 10 MB 扩展到了 26 MB (26,152,960 字节)。这是允许的，因为我通过 `-Xmx50m` 将最大堆大小设置为 50\
  \ MB。但这种扩展似乎并非必要，因为我的 Java 应用请求分配一个 10 MB 的对象，而在不进行扩展的情况下，20,188,720 字节的堆空间已经足够了。这种行为表明\
  \ JVM 倾向于预留比实际需要更多的堆空间。\n*   在分配了 40 MB 的对象后，我的 Java 应用使用了堆中 50 MB 的约 42 MB。堆中仅剩\
  \ 8.5 MB 空间。\n*   当我的 Java 应用 再次请求分配另一个 10 MB 的对象时，JVM 抛出了异常：“java.lang.OutOfMemoryError:\
  \ Java heap space”。这是预料之中的，因为 JVM 无法进一步扩展 `-Xmx50m` 的堆空间。\n\n### Windows 上的内存分配限制\n\
  \n本节介绍了 JVM 扩展堆空间以分配更多对象会导致 `java.lang.OutOfMemoryError: Java heap space` 异常（如果不允许进一步扩展的话）。当然，通过\
  \ `-Xms` 和 `-Xmx` 指定更大的堆大小可以解决 `OutOfMemoryError`。但 JVM 版本和操作系统对可分配内存是有限制的。以下是一些示例：\n\
  \n#### 1. 新 Windows 上的 64 位 HotSpot JVM 17\n\n使用更大的堆大小运行教程中的示例，查看 64 位 HotSpot JVM\
  \ 可以分配多少内存：\n\n```\n herong> java -version\njava version \"17.0.1\"\nJava(TM) SE\
  \ Runtime Environment (build 17.0.1)\nJava HotSpot™ 64-Bit VM (build 17.0.1+1)\n\
  \nherong> java -Xms10g HeapMemoryCrash\nTotal memory: 10737418240 Free memory: 1073662832\n\
  \ Used memory: 789608\nPress ENTER key to continue:\n\nherong> java -Xms11g HeapMemoryCrash\n\
  Java HotSpot™ 64-Bit Server warning:\n  INFO: os::commit_memory(0x000000540000000,\
  \ 118116064, 0) failed;\n  error='The paging file is too small for this operation'\n\
  \  (DOS error/errno=1455)\n# There is insufficient memory for the Java Runtime to\
  \ continue.\n# Native memory allocation (mmap) failed to map 118116064 bytes for\
  \ virtual space\n# An error report with more information is saved:\n# C:\\herong\\\
  hs_err_pid1204\n```\n\n这说明对于我的新 Windows 10，64 位 HotSpot JVM 只能为堆空间分配 10 GB。\n\n\
  #### 2. 旧 Windows 10  64 位 HotSpot JVM 12\n\n使用更大的堆大小运行教程中的示例，查看 64 位 HotSpot JVM\
  \ 可以分配多少内存：\n\n```\n herong> java -version\njava version \"12.0.1\"\nJava(TM) SE\
  \ Runtime Environment (build 12.0.1+12)\nJava HotSpot™ 64-Bit VM (build 12.0.1+12,\
  \ mixed mode)\n\nherong> java -Xms25g HeapMemoryCrash\nTotal memory: 26843545600\
  \ Free memory: 26842982168\n Used memory: 563432\nPress ENTER key to continue:\n\
  \nherong> java -Xms26g HeapMemoryCrash\nJava HotSpot™ 64-Bit Server warning:\n \
  \ INFO: os::commit_memory(0x000001b8bc000, 436207616, 0) failed;\n  error='The paging\
  \ file is too small for this operation'\n  (DOS error/errno=1455)\n#\n# There is\
  \ insufficient memory for the Java Runtime to continue.\n# Native memory allocation\
  \ (mmap) failed to map 436207616 bytes for\n# Failed to commit area from 0x000001b8bc000\
  \ to 0x000001b8d5bc00\n# of length 436207616.\n# An error report with more information\
  \ is saved:\n# C:\\herong\\hs_err_pid21136.log\n```\n\n这说明 64 位 HotSpot JVM 接受 25\
  \ GB 的堆空间。\n\n#### 3. Windows 7  64 位 HotSpot JVM 8\n\nWindows 7 上的 64 位 HotSpot\
  \ JVM 8 实际上可以接受大一点的堆大小：\n\n```\n herong> java -version\njava version \"1.8.0_161\"\
  \nJava(TM) SE Runtime Environment (build 1.8.0_161-b12)\nJava HotSpot™ 64-Bit Server\
  \ VM (build 25.161-b12, mixed mode)\n\nherong> java -Xms27g HeapMemoryCrash\nTotal\
  \ memory: 27783069696 Free memory: 27782734072\n Used memory: 335624\nPress ENTER\
  \ key to continue:\n...\n\nherong> java -Xms28g HeapMemoryCrash\nError occurred\
  \ during initialization of VM\nUnable to allocate 917504KB bitmaps for parallel\n\
  garbage collection for the requested 29360128KB heap\nError: Could not create the\
  \ Java Virtual Machine.\nError: A fatal exception has occurred. Program will exit.\n\
  ```\n\n这说明 64 位 HotSpot JVM 仅接受高达 27 GB 的堆空间。\n\n\n\n\n\n#### 4. 在 Windows 7 计算机上的\
  \ 32 位 HotSpot JVM 8\n\n如果你正在使用 32 位 HotSpot JVM，它只能拥有较小得多的堆内存：\n\n```\nherong>\
  \ java -version\njava version \"1.8.0_45\"\nJava(TM) SE Runtime Environment (build\
  \ 1.8.0_45-b15)\nJava HotSpot(TM) Client VM (build 25.45-b02, mixed mode)\n\nherong>\
  \ java -Xms1550m HeapMemoryCrash\nTotal memory: 1571160064\n Free memory: 1570902744\n\
  \ Used memory: 257320\nPress ENTER key to continue:\n...\n\nherong> java -Xms1560m\
  \ HeapMemoryCrash\nError occurred during initialization of VM\nCould not reserve\
  \ enough space for 1597440KB object heap\n```\n\n这告诉我们，32 位 HotSpot JVM 的 JVM 堆空间最大只接受\
  \ 1,550 MB。\n\nJava GC 教程 - Herong's 教程示例\n\n∟堆区域和大小控制\n\n∟HotSpot 和 JRockit 的 OutOfMemoryError\
  \ 对比\n\n本节提供了一个教程示例，用于对比 HotSpot 12, 10, 1.8, 1.7, 1.6 和 JRockit 28.2.7  OutOfMemoryError\
  \ 异常。\n\n作为对比，我用其他版本的 HotSpot JVM 和 JRockit JVM 测试了我的示例 `HeapMemoryCrash.java`。\n\
  \n1. 从 HotSpot Server JVM 1.6 到 JVM 12，当它们无法按照我指定的 `-Xmx50m` 选项将堆扩展到 50 MB 时，它们返回了相同的异常信息：\n\
  \n```\nherong> java -Xms20m -Xmx50m HeapMemoryCrash\nTotal memory: 20185088\n Free\
  \ memory: 19926784\n Used memory: 258304\nPress ENTER key to continue:\n1: 10 MB\
  \ of objects created.\nTotal memory: 20185088\n Free memory: 9410016\n Used memory:\
  \ 10775072\nPress ENTER key to continue:\n2: 20 MB of objects created.\nTotal memory:\
  \ 30932992\n Free memory: 9672144\n Used memory: 21260848\nPress ENTER key to continue:\n\
  3: 30 MB of objects created.\nTotal memory: 41156608\n Free memory: 9409984\n Used\
  \ memory: 31746624\nPress ENTER key to continue:\nException in thread \"main\" java.lang.OutOfMemoryError:\
  \ Java heap space\n   at HeapMemoryCrash.main(HeapMemoryCrash.java:10)\n```\n\n\
  2. JRockit JVM 28.2.7 也给了我相同的异常错误 `OutOfMemoryError`。但它包含了一个不同的消息，“allocLargeObjectOrArray:\
  \ J, size 10485776”：\n\n```\nherong> \\Progra~1\\java\\jrockit-jdk1.6.0_45-R28.2.7-4.1.0\\\
  bin\\javac\n   HeapMemoryCrash.java\n\nherong> \\Progra~1\\java\\jrockit-jdk1.6.0_45-R28.2.7-4.1.0\\\
  bin\\java\n   -Xms20m -Xmx50m HeapMemoryCrash\nTotal memory: 20971520\n Free memory:\
  \ 17905560\n Used memory: 3065960\nPress ENTER key to continue:\n1: 10 MB of objects\
  \ created.\nTotal memory: 20971520\n Free memory: 9496216\n Used memory: 11475304\n\
  Press ENTER key to continue:\n2: 20 MB of objects created.\nTotal memory: 31760384\n\
  \ Free memory: 10510888\n Used memory: 21249496\nPress ENTER key to continue:\n\
  3: 30 MB of objects created.\nTotal memory: 47411200\n Free memory: 15675928\n Used\
  \ memory: 31735272\nPress ENTER key to continue:\n4: 40 MB of objects created.\n\
  Total memory: 47411200\n Free memory: 5190216\n Used memory: 42220984\nPress ENTER\
  \ key to continue:\nException in thread \"Main Thread\" java.lang.OutOfMemoryError:\n\
  \   allocLargeObjectOrArray: [J, size 10485776\n   at HeapMemoryCrash.main(HeapMemoryCrash.java:10)\n\
  ```\n\n注意，JRockit JVM 的异常使用的是 `allocLargeObjectOrArray()` 方法来创建我的大数组对象。\n\n[Java\
