  \ 收集器在 `\"paused\"` GC 阶段使用的 `\"Parallel GC Threads\"` 数量根据以下规则计算：“在具有 N 个硬件线程的机器上，如果\
  \ N 大 8，JVM 使用 N 的固定比例作为垃圾回收器线程的数量。当 `N` 值较大时，该比例约为 5/8。当 `N` 小于 8 时，使用的数量为 `N`。在特定平台上，该比例下降到\
