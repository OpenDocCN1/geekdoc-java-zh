  \ GC 之前分配更多新对象。这减少了 GC 的频率并提高了吞吐量。\n\n*   但延迟显示，当堆大小从 100MB 增加到 800MB 时，应用程序停顿时间变差了，因为更多的对象需要更长的应用程序暂停时间来执行每次\
