  \ Old GC 的影响\n*   CPU 处理器对 G1 Old GC 的影响\n*   G1 收集器的性能总结\n\n结论：\n\n*   G1 收集器需要大约\
  \ 4% 的空闲堆空间执行垃圾回收。\n*   更多的空闲堆空间会提高应用程序的吞吐量性能。\n*   堆区域大小似乎对应用程序吞吐量性能没有影响。\n*  \
  \ 当对象大小为 1K 时，G1 Young GC 每秒可以处理约 42 MB 的对象。\n\nJava GC 教程 - Herong 的教程示例\n\n###\
  \ G1 收集器的性能测试\n\n#### G1 GC 占用 - 空闲堆 4% 到 50%\n\n本节提供了查找运行 `GCPerfP99V2.java` 所需堆内存占用的教程。G1\
  \ 收集器需要大约 4% 到 50% 的空闲堆空间来执行垃圾回收。\n\n内存占用是一个重要的性能因素因素，它通过运行应用程序所需的最小堆大小来衡量。让我们使用\
  \ `GCPerfP99V2.java` 进行一些测试，以找出 G1 收集器的占用。\n\n**测试 1** - 66 MB 的堆内存不足以运行需要峰值 64\
  \ MB 活对象的 `GCPerfP99V2.java`：\n\n```\n herong> java -XX:+G1GC -Xms66m -Xmx66m GCPerfP99V2\
  \ 32 1024 1024 0 10\n\nParameters:\n   Size=32KB, Base=1024, Chunk=1024, Warmup=0,\
  \ Runs=10, Loads=1\n[0.077s] Run start 1\n\nException: java.lang.OutOfMemoryError\
  \ thrown from the\n   UncaughtExceptionHandler in thread \"main\"\n```\n\n**测试 2**\
  \ - 67 MB 的堆内存足以运行需要峰值 64 MB 活对象的 `GCPerfP99V2.java`：\n\n\n\n\n\n```\n herong> java\
  \ -XX:+UseG1GC -Xms67m -Xmx67m GCPerfP99V2 32 1024 1024 0 10\n\nParameters:\n  \
  \ Size=32KB, Base=1024, Chunk=1024, Warmup=0, Runs=10, Loads=1\n...\n分位数运行统计:\n\
  \   Total number of runs = 10\n   Percentile % = 99\n   Execution time = 408 ms\n\
  \   Average time per run = 45 ms\n   Standard deviation = 2.6874192494328497 ms\n\
  \   Objects processed = 9216\n   Throughput = 22588 objects/second\n   Latency =\
  \ 49 ms/1000 objects\n   Throughput (max, ave, min) = (24380, 22588, 20078)\n  \
  \ Latency (min, ave, max) = (41, 44, 49)\nWorst runs dropped:\n   #, Time, Throughput\
  \ = 10, 54, 18962\n```\n\n因此，67 MB 是 G1 收集器运行 `GCPerfP99V2.java` 的堆内存占用，该程序在峰值时期需要\
  \ 64 MB 的存活对象。\n\n这告诉我 G1 收集器大约需要 4%（计算为 `(67-64)/67`）的空闲内存来执行垃圾回收。\n\n然而，如果应用程序使用更大的对象，G1\
  \ 可能会使用巨区域（humongous regions）来存储它们，导致大量的堆空间浪费。见下面的测试结果。\n\n### 测试 3\n132 MB 的堆内存不足以运行\
  \ `GCPerfP99V2.java`，该程序在峰值时期需要 64 MB 的存活大对象（大小为 1024K）。\n\n```\n herong> java -XX:+UseG1GC\
  \ -Xms132m -Xmx132m GCPerfP99V2 1024 32 32 0 10\n\nParameters:\n   Size=1024KB,\
  \ Base=32, Chunk=32, Warmup=0, Runs=10, Loads=1\n...\n[0.302s] Run start 7\n[0.324s]\
  \ Run end 7: 22ms\n[0.327s] Run start 8\nException in thread \"main\" java.lang.OutOfMemoryError:\
  \ Java heap space\n   at GCPerfP99V2$MyObject.<init>(GCPerfP99V2.java:116)\n   at\
  \ GCPerfP99V2.myTest(GCPerfP99V2.java:52)\n```\n\n### 测试 4\n133 MB 的堆内存足够运行 `GCPerfP99V2.java`，该程序在峰值时期需要\
  \ 64 MB 的存活大对象（大小为 1024K）。\n\n```\n herong> java -XX:+UseG1GC -Xms133m -Xmx133m\
  \ GCPerfP99V2 1024 32 32 0 10\n\nParameters:\n   Size=1024KB, Base=32, Chunk=32,\
  \ Warmup=0, Runs=10, Loads=1\n...\n分位数运行统计:\n   Total number of runs = 10\n   Percentile\
  \ % = 99\n   Execution time = 271 ms\n   Average time per run = 30 ms\n   Standard\
  \ deviation = 9.291573243177568 ms\n   Objects processed = 288\n   Throughput =\
  \ 1062 objects/second\n   Latency = 1626 ms/1000 objects\n   Throughput (max, ave,\
  \ min) = (1523, 1062, 615)\n   Latency (min, ave, max) = (656, 941, 1626)\nWorst\
  \ runs dropped:\n   #, Time, Throughput = 10, 52, 615\n```\n\n因此，133 MB 是 G1 收集器运行\
  \ `GCPerfP99V2.java` 的堆内存占用，该程序在峰值时期需要 64 MB 的存活大对象（大小为 1024K）。\n\n这告诉我在这种情况下，G1\
  \ 收集器大约需要 50%（计算为 `(133-64)/133`）的空闲内存来执行垃圾回收。这是因为默认的区域大小为 1MB，任何大于 G1 区域大小一半的对象都将存储在巨区域中。我们的对象大小为\
  \ 1MB，它将存储在 2 个巨区域中，占用 2MB 的堆空间。因此，64 MB 的对象需要 128 MB 的堆空间。\n\n### 结论\n\n* 相对于 G1\
  \ 区域大小，对于使用较小对象的应用程序，G1 收集器大约需要 4% 的空闲内存来执行垃圾回收。\n* 如果应用程序使用的对象大于 G1 区域大小的一半，G1\
  \ 收集器大约需要 50% 的空闲内存来执行垃圾回收。\n* 为了避免浪费堆空间，您应该将 G1 区域大小设置为大于大部分对象大小的 2 倍。\n\nJava\
