  \ - Herong 的教程示例\n\n∟串行收集器的性能测试\n\n### 串行 Young GC 的性能\n\n本节提供了相关测试，以找出在提供足够的“eden”和“from”空间的情况下，仅使用\
  \ Serial Young GC 对性能的影响。增加堆大小会减少 Young GC 的频率并提高吞吐量性能。\n\n如果我提供足够的年轻代（Young generation）空间，使得串行收集器只运行\
  \ Young GC，我的应用程序性能会更好吗？\n\n让我们通过运行 `GCPerfP99.java` 并带有 JVM 参数来寻找答案，在“eden”和“from”中提供足够的空间以运行\
  \ Young GC 而不将任何存活对象晋到老年代（Tenured generation）。\n\n#### 测试 1\n使用 `-Xms600m -Xmx600m\
  \ -XX:NewRatio=1 -XX:SurvivorRatio=1` 来获得 100MB 的 \"eden\" 空间和 100MB 的 \"from\"\
  \ 空间。\n\n```\n C:\\herong>start /realtime java -XX:+UseSerialGC -Xms600m -Xmx600m\n\
  \   -XX:NewRatio=1 -XX:SurvivorRatio=1 -Xlog:gc,gc+heap=debug:gc.log\n   GCPerfP99\
