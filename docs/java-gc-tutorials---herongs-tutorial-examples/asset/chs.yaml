  \n### Serial GC 追踪 - 存活对象\n\n此部分提供了关于 Serial GC 如何增加每次额外 GC 中 \"from\" 空间对象年龄的教程。在之前的教程中，我们了解到如果内存紧张，Serial\
  \ 收集器会跳过年轻代 GC 只执行老年代 GC。如果你给一个巨大的内存，Serial 收集器的频率较低，并且在触发下次 GC 时，所有的“年龄 1”对象都已死亡。在这个教程中，让我们修改测试程序让某些对象存活久一点。\n\
  \n```\n GarbageCollection2.java\n * 版权 (c) HerongYang.com. 保留所有权利\n */\nclass GarbageCollection2\
  \ {\n   public static void main(String[] a) {\n      java.util.Random rnd = new\
  \ java.util.Random();\n      int max = 10000;\n      int min = 32;\n      Object[]\
  \ arr = new Object[min];\n      Runtime rt = Runtime.getRuntime();\n      System.out.println(\"\
  步骤/总内存/空内存/用内存:\");\n      for (int m=0; m<max; m++) {\n         int k = rnd.nextInt(min);\n\
  \         for (int n=min-1; n>=k+1; n--) arr[n] = arr[n-1];\n         arr[k] = getOneMega();\n\
  \         long total = rt.totalMemory();\n         long free = rt.freeMemory();\n\
  \         System.out.println((m+1)+\"   \"+total+\"   \"+free+\"   \"\n        \
  \    +(total-free));\n      }\n   }\n   private static Object getOneMega() {\n \
  \     return new long[1024*128]; // 1MB\n   }\n}\n```\n\n\n\n\n\n第一次 GC 执行一切正常，没有异常。在\
