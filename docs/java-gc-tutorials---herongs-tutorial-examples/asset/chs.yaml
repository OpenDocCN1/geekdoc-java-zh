  \n本节提供了对并发垃圾收集器（Concurrent collector）所有性能测试的总结。\n\n为了找出哪种收集器配置性能最佳，我们将 `java GCPerfP99\
  \ 1024 32 32 64 1000` 的所有测试结果列在张表中：\n\n```\n Configuration      Heap Size    Throughput\
  \   Latency\n1.1 Default                100 M        1261/s   1000 ms\n1.2 Default\
  \                400 M        1859/s   1470 ms\n1.3 Default                800 M\
  \        2139/s   1972 ms\n1.4 Default               1600 M        2787/s   1000\
  \ ms\n\n    Configuration      Eden/From    Throughput   Latency\n2.1 Young GC only\
  \      100/100 M        2332/s   1000 ms\n2.2 Young GC only      200/200 M     \
  \   2628/s   1000 ms\n2.3 Young GC only      400/400 M        2611/s   1000 ms\n\
  2.4 Young GC only      800/100 M        2748/s    968 ms\n2.5 Young GC only    \
  \ 1600/100 M        1971/s   1000 ms\n\n    Configuration   Eden/Tenured    Throughput\
  \   Latency\n3.1 Always Tenure      100/100 M        1723/s   1470 ms\n3.2 Always\
  \ Tenure      200/200 M        2510/s   1000 ms\n3.3 Always Tenure      400/400\
  \ M        2532/s   1000 ms\n3.4 Always Tenure      800/400 M        2418/s   1314\
  \ ms\n3.5 Always Tenure      800/200 M        2113/s   1470 ms\n\n    Configuration\
  \  Eden/From/Old    Throughput   Latency\n4.1 Young & Old    100/50/ 100 M     \
  \   2177/s   1000 ms\n4.1 Young & Old    100/50/ 200 M        2072/s   1000 ms\n\
  4.1 Young & Old    100/50/1600 M        2178/s   1000 ms\n```\n\n结论：\n\n*   最佳的并发\
  \ GC 配置是给予足够大的年轻代（Young generation），这提供了每秒 2748 个对象的吞吐量，每 1000 个对象的延迟为 968 毫秒。在这种情况下，只需要进行年轻\
  \ GC。\n*   当我们强制并发收集器直接将对象提升到老年代（Tenured generation）时，吞吐量和延迟都会变差。在这种情况下，年轻 GC 会复制所有对象（包括死亡对象）到老年代。\n\
