  \ - \"+XX:+UseG1GC\"\n\n∟`\"-XX:ParallelGCThreads=6\"` - G1 并行线程\n\n本节提供了一个教程，展示如何通过\
  \ `-XX:ParallelGCThreads=6` 选项控制 G1 GC 过程中使用的并行线程数量。\n\n“并行 GC 线程”（Parallel GC Threads）是在下文所述的\
  \ G1 收集器执行的“暂停”GC 阶段中使用的并行线程：\n\n*   可以多线程执行的 Young GC 阶段。请注意，所有 Young GC 阶段都是“暂停”的，即停顿世界（stop-the-world）阶段。\n\
  *   某些可以在多线程执行且处于“暂停”世界模式的 Old GC 阶段。\n*   可以多线程执行的 Full GC 阶段。\n\n默认情况下，G1 收集器在“暂停”GC\
  \ 阶段使用的“并行 GC 线程”计算规则如下：在 `N` 大于 8 的机器上，JVM 使用 `N` 的固定比例作为线程数。当 `N` 小于 8 时，数量为 `N`。在某些平台上，该比例为\
  \ 5/16。\n\n如果你想覆盖默认的并行 GC 线程数，可以使用 `-XX:ParallelGCThreads=n`。以下是 `-XX:ParallelGCThreads=6`\
  \ 的影响测试：\n\n```\nherong> java -Xms16m -Xmx64m -XX:ParallelGCThreads=6\n-XX:+UseG1GC\
