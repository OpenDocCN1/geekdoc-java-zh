  ### 针对最佳吞吐量的自适应大小策略\n\n本节提供了一个关于并行收集器如何使用自适应大小策略来实现我们吞吐量目标的教程。在第二次测试中，我们让 `Parallel`\
  \ 收集器使用以下 JVM 参数来提供最佳吞吐量性能：\n\n```\n -XX:MaxGCPauseMillis=1000\n   我们不在乎延迟：\n  \
  \ 你可以暂停应用程序 1000 ms。\n-XX:GCTimeRatio=99\n   我们想要最佳吞吐量：\n   给 GC 留出最小比例的时间，即小于 1%\
  \ (1/(1+99))\n-Xmx1200m\n   我们不在乎内存占用：\n   你可以使用高达 1.2GB 的堆\n```\n\n这是我们得到的结果：\n\
