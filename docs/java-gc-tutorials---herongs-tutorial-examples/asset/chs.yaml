  \n结论：CMS 收集器将主 GC 的停顿（STW）时间减少到只有两个步骤：初始标记和最终标记。这无疑提升了应用程序的性能（响应时间）。\n\nJava GC\
  \ 教程 - Herong 的教程示例\n\n∟并发标记-清理 (CMS) 收集器 - \"+XX:+UseConcMarkSweepGC\"\n\n## 用于\
  \ Minor GC 的并行 New (ParNew) 收集器\n\n本节演示了 `-XX:+UseConcMarkSweepGC` JVM 选项在新生代 GC\
  \ 时调用并行 New (ParNew) 收集器。\n\n在之前的教程中，我们学习了 `-XX:+UseConcMarkSweepGC` JVM 选项会对新生代调用\
  \ `并行 New (ParNew)` 收集器，并对老代调用 `并发标记-清理 (CMS)` 收集器。\n\n在本教程中，让我们在新生代内存充足的情况下运行测试，以观察\
  \ ParNew 收集器如何工作。\n\n\n\n\n\n```\nherong> java -Xms2m -Xmx64m -XX:+UseConcMarkSweepGC\
  \ -Xms1200m -Xmx1200m \\\n   -XX:NewRatio=1 -XX:SurvivorRatio=1 -Xlog:gc,gc+heap=info\
  \ \\\n   GarbageCollection > output.txt\n\nherong> more output.txt\n[info ][gc \
