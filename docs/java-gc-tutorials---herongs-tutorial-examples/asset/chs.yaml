  \ Size Policy），该策略按延迟、吞吐量和占用目标顺序动态更改堆代的大小。\n\n在上一个教程中，我们观察到并行收集器会动态改变新生代（Young generation）的大小和幸存区（survivor\
  \ space）的比例。\n\n这种行为实际上是并行收集器使用的“自适应大小策略”。以下是 Java 文档中的描述：\n\n1. 并行收集器默认开启自适应大小策略（使用\
  \ `-XX:+UseParallelGC` JVM 选项）。\n2. 使用 `-XX:+UseAdaptiveSizePolicy` 和 `-XX:-UseAdaptiveSizePolicy`\
  \ JVM 选项显式开启或关闭自适应大小策略。\n3. 如果开启，自适应大小策略将动态更改堆代的大小，以顺序满足以下目标：\n    * 延迟目标（Latency\
  \ Goal）——将应用程序暂停降低到所需水平以下。\n    * 吞吐量目标（Throughput Goal）——将应用程序执行时间与暂停时间的比例提高到所需水平以上。\n\
  \    * 占用目标（Footprint Goal）——尽可能减小堆的大小。\n4. 自适应大小策略使用以下简单方法来实现上述目标：\n    * 步骤 1\
  \ - 尝试满足延迟目标：检查应用程序暂停时间。如果大于所需水平，则减小代代的大小以减少应用程序暂停时间。\n    * 步骤 2 - 尝试满足吞吐量目标：在满足延迟目标的情况下，检查应用程序执行时间与暂停时间的比例。如果该比例低于所需水平，则增加代代的大小以增加应用程序执行时间。\n\
  \    * 步骤 3 - 尝试满足占用目标：如果延迟目标和吞吐量目标都得到满足，则调整代代的大小以减少堆内存占用。\n5. 延迟目标可以通过 `-XX:MaxGCPauseMillis=nnn`\
  \ JVM 选项控制，其中 `nnn` 指定所需的应用程序暂停时间的毫秒数。默认值是 `-XX:MaxGCPauseMillis=4294967295`。\n\
  6. 吞吐量目标可以通过 `-XX:GCTimeRatio=nnn` JVM 选项控制，其中 `nnn` 用于 `1/(+nnn)` 表达式，指定应用程序 GC\
  \ 暂停占时间的百分比。默认值是 `-XX:GCTimeRatio=99`，表示 1%（或 `1/(1+99)`）的时间应用于应用程序 GC 暂停。\n7. 使用\
  \ `-XX:AdaptiveSizePolicyOutputInterval=1` 和 `PrintAdaptiveSizePolicy` JVM 选项可以打印\
  \ GC 日志信息，说明自适应大小策略在每次 GC 中的执行情况。\n\n“自适应大小策略”功能看起来非常棒。我们将在接下来的教程中测试它。\n\nJava GC\
