  \ KB。\n- \"Free Mem.\"（空闲内存） - 由 `freeMemory()` 方法报告的应用程序可用空闲堆内存大小，单位为 KB。\n- \"\
  Proc. Obj.\"（处理对象） - 测试运行期间处理的对象总数。\n\n对于本次运行会话，应用程序性能为：\n\n```\n Throughput: 399\
