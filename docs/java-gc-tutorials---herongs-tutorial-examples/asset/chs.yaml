  \ 888) | 1126 |\n| 1600 MB | 3427 (9999, 1032) | 968 |\n\n## 总结\n- 使用 `-XX:MaxTenuringThreshold=0`\
  \ JVM 选项，可以通过跳过 \"from\" 空间让 Serial 收集器运行更多的 Full GC（全 GC）。\n- 当增加“老年代”空间时，吞吐量性能会提高，因为\
  \ GC 频率降低了。\n- 当增加“老年代”空间时，延迟保持基本不变。这告诉我们 Serial Old GC 在 100 MB 到 1600 MB 的 \"\
  eden\" 空间中处理新对象花费的时间相似。\n\n以下是在带有带有 JDK 8 的旧电脑上的测试结果：\n\n```bash\n Tenured     \
  \ Throughput       Latency\n Old GC   Ave (Max, Min)/s    ms/1000\n\n   100 MB \
  \  491 (695, 344)         2906\n   200 MB   510 (695, 410)         2439\n   400\
  \ MB   520 (695, 410)         2439\n```\n\n\n\n\n\n本节对在 Serial 垃圾回收器运行 `GCPerfP99.java`\
