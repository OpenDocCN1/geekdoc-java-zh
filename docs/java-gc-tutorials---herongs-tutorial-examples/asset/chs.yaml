  \ Collector) 性能总结\n\n本节提供了并行收集器所有性能测试的总结。为了找出哪种并行收集器配置提供最佳性能，我们将 `GCPerf99 1024\
  \ 32 64 1000` 的所有结果列在张表中：\n\n```\n Configuration   Heap Size    Throughput   Latency\n\
  1.1 Default              100M        1210/s   1470 ms\n1.2 Default             \
  \ 400M        1740/s   1937 ms\n1.3 Default              800M        1869/s   2439\
  \ ms\n1.4 Default             1600M        2550/s    968 ms\n1.5 Default       \
  \      3200M        2547/s   1470 ms\n1.6 Default             6400M        2917/s\
  \    968 ms\n\n    Configuration   Eden/From    Throughput   Latency\n2.1 Young\
  \ GC only        100M         2418/s   1000 ms\n2.2 Young GC only        200M  \
  \      2684/s   1000 ms\n2.3 Young GC only        400M        2082/s   5376 ms\n\
  2.4 Young GC only        800M        1510/s  1235 ms\n2.5 Young GC only       1600M\
  \         457/s  1867 ms\n\n    Configuration     Tenured    Throughput   Latency\n\
  3.1 Always Tenure        100M         1950/s   1470 ms\n3.2 Always Tenure      \
  \  200M        1954/s   1972 ms\n3.3 Always Tenure        400M        1979/s   3412\
  \ ms\n3.3 Always Tenure        800M        1698/s   6369 ms\n3.3 Always Tenure \
  \      1600M         636/s  7142 ms\n\n    Configuration   GC Threads   Throughput\
  \   Latency\n4.1 Default/1600M            1        2631/s   1000 ms\n4.2 Default/1600M\
  \            2        2771/s    968 ms\n4.3 Default/1600M            4        2633/s\
  \   2439 ms\n4.4 Default/1600M            8        2884/s   3906 ms\n```\n\n###\
  \ 结论\n\n- 最佳的并行 GC 配置是给予足够新生代（Young generation），这可以提供每秒 2917 个对象的吞吐量，每 1000 个对象的延迟为\
  \ 968 毫秒。在这种情况下，只需要 Young GC。\n- 当我们强制并行收集器直接将对象提升到老年代（Tenured generation）时，吞吐量和延迟都会变差。在这种情况下，Young\
  \ GC 将所有对象（包括垃圾对象）复制到老年代，导致应用程序长时间停顿。\n- 更多的内存可以提高吞吐量。但过多的内存也会降低性能。\n\n以下是在带有 `JDK\
