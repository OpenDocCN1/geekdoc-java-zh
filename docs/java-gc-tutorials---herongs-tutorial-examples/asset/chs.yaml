  \nJava GC 教程 - Herong 的教程示例\n\n∟垃圾回收性能测试程序\n\n∟[GCPerfP99V2.java - 负载下的百分位数性能]\n\
  \n本节提供了教程，用于寻找 `GCPerfP99V2.java` 程序的负载水平，使执行环境中断的影响降低到非常水平。在我 2019 年使用的电脑上，1000\
  \ 的负载变异系数为 1.22%。\n\n应用程序性能的一个大困难是执行环境的执行中断。在我的情况下，JVM 可能会中断应用程序线程以运行 GC 线程或其他线程，而操作系统可能会中断\
  \ JVM 以运行其他进程。\n\n\n\n\n在本教程中，让我们来看看我是否可以通过增加工作负载，将环境中断产生的影响降低到一个非常稳定的水平。\n\n**测试\
