  \ \"eden\" 和 \"from\" 空间时，可以运行仅包含年轻 GC 的并发收集，这实际上是由并行新生收集器（ParNew）执行的。\n\n*   当\
  \ \"eden\" 空间从 100MB 增加到 800MB 时，吞吐量性能得到了提高，因为年轻 GC 的执行频率降低了。\n\n*   但当 \"eden\"\
  \ 空间增加到 1600MB 时，吞吐量性能显著下降。我不确定原因所在。\n\n*   延迟保持保持不变。这告诉我们年轻 GC 能够提供稳定的最大停顿时间。\n\
