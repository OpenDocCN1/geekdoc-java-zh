  \ collector）性能影响的教程笔记和示例代码。主题包括堆内存占用；堆大小影响；仅运行 Young GC；运行更多的 Old GC。\n\n- 并行 GC\
  \ 内存占用 - 释放 10% 堆空间\n- 堆大小对并行 GC 的影响\n- 并行新生代 GC 无法移除死亡对象\n- 并行新生代 GC 的性能\n- 并行\
  \ Full GC 的性能\n- \"-XX:MaxTenuringThreshold=0\" - 对并行 GC 不利\n- 极小的幸存区空间对并行 GC 不利\n\
  - 线程数对并行 GC 的影响\n- AFFINITY=n - CPU 处理器与并行 GC\n- 最佳并行 GC 配置\n- 并行收集器的性能总结\n\n###\
  \ 核心要点：\n\n- 并行收集器需要大约 10% 的空堆空间来执行垃圾回收。\n- 更多的空堆空间将提高应用程序的吞吐量性能。\n- 并行 Young GC\
  \ 似乎比 Old GC 更高效。\n- 强制让 Young GC “始终进入老年代（Always Tenure）”会导致性能下降。\n- 为新生代提供足够的空间以仅使用\
  \ Young GC 可以获得最佳性能。\n- GC 线程数应与 CPU 处理器的数量匹配以获得最佳性能。\n\n## 并行收集器的性能测试\n\n### 并行\
  \ GC 内存占用 - 释放 10% 堆空间\n\n本节提供了教程，以找出运行 `GCPerfP99.java` 时的堆内存占用。并行收集器需要大约 10% 的空堆空间来执行垃圾回收。\n\
