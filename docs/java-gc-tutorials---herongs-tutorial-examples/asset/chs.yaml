  - 如果对象在多次 GC 中在幸存区（from space）中被识别为存活对象，它们会变得更老。\n- 当对象达到年代值时，它们会被提升到老年代，即使幸存区还有空间。\n\
  \n### Java GC 教程 - Herong 的教程\n\n### Serial 收集器 - +XX:+SerialGC\n\n### Serial GC\
  \ Trace - 年代值\n\n本节教程介绍了 `Serial GC` 如何动态更改年代值，并提前或推迟提升对象以满足 `TargetSurvivorRatio`\
  \ 设置。\n\n在之前的教程中，我们了解到当一个存活对象存活多次 Minor GC 并达到年代值时，会被提升到老年代。\n\n但 Serial 收集器也可以根据过去的\
  \ GC 统计数据动态更改年代值。这是为了快速将对象移出幸存区以防止幸存区溢出。\n\n让我们用较小的幸存区重新运行相同的测试。\n\n```\nherong>\
  \ java -Xms360m -Xmx360m -XX:+UseSerialGC \\\n   -XX:NewRatio=1 -XX:SurvivorRatio=1\
  \ \\\n   -Xlog:gc=info,gc+heap=debug,gc+age=trace GarbageCollection\n```\n\n第一次\
  \ Minor GC 时，幸存区（from）的使用率为 43%。没有溢出风险，因此 Serial 收集器将年代值保持为 15（默认值）。\n\n```\n ...\n\
