  \nJava GC Tutorials - Herong's Tutorial Examples\n\nConcurrent Mark-Sweep (CMS)\
  \ Collector - \"+XX:+UseConcMarkSweepGC\"\n\n#### Maximum Logging of All Phases\
  \ on Full GC\n\nThis section demonstrates that the `-Xlog:gc*=trace` option can\
  \ be used to print out maximum logging messages of all phases on a Full GC performed\
  \ by the CMS collector.\n\nIf you want to know how many phases are performed in\
  \ a CMS Full GC process and how each phase is performed, you need to turn on the\
  \ maximum GC logging with the `-Xlog:gc*=trace` option.\n\n\n\n\n以下是我为了捕获 CMS 收集器执行单次\
  \ Full GC（全垃圾回收）的所有日志消息而的操作。\n\n1. 运行以下命令将所有日志消息捕到文件中：\n\n```\n herong> java -XX:+UseConcMarkSweepGC\
