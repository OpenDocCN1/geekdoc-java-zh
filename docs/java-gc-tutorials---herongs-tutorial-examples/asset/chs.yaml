  *   当 \"eden\" 和 \"from\" 空间从 100MB 增加到 200MB 时，吞吐量性能更好，因为 GC 频率降低了。\n*   并行年轻代\
  \ GC 在处理 100MB 和 200MB 的 \"eden\" 中的新对象时消耗的时间相同，因此延迟性能相同。\n*   然而，当 \"eden\" 和 \"\
  from\" 空间从 100MB 增加到 1600MB 时，吞吐量性能会变差，因为 GC 耗的时间变得长了很多。延迟性能也会下降。\n*   并行 GC 设计并不是用于使用大量的年轻代空间。\n\
