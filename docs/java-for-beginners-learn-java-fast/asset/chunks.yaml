    quote


    //                                                                      Backslash


    # Chapter 2


    # About Object Oriented Programming


    Java is an object-oriented programming (OOP) language, organized around objects
    and data instead of actions and logic. Before you can start writing your own Java
    code, you need to be aware of the basics of the language:


    ● Abstraction – picking out common features of procedures and objects


    ● Class – category of objects, a definition of the properties of the objects in
    the class


    ● Encapsulation – combining elements to make something new


    ● Information Hiding – hiding details of functions or objects to reduce code complexity


    ● Inheritance – a representation of the “is a” relationship of different classes


    ● Interface – codes and language used by applications to communicate


    ● Messaging – communication form in parallel and OOP programming


    ● Object – self-contained, consisting of procedure and data used for data manipulation


    ● Polymorphism – ability to process an object per its class or data type


    ● Procedure – part of the program that does something specific


    ## The Advantages of OOP


    The main advantage of OOP is that programmers can create modules that don’t need
    to be changed when a new object type is added. Programmers can just create a new
    object that will inherit their features from those that already exist, making
    it an easy language to modify.


    # Chapter 3


    # Class Fundamentals


    Classes are a fundamental part of Java and are incredibly powerful. A class is
    used to define a new data type, which is then used to create an object of the
    type defined. In basic, a class is a template for the object and the object is
    an instance of the class. Because of that, you will see the words instance and
    object used interchangeably.


    ## The Form of a Class


    To define a class, you must declare the exact nature and form of it. To do this,
    you must specify the data in the class and the code that will operate on the data.
    Most classes will contain both although some only have data or code in them.


    You declare a class by using the class keyword and the following shows you the
    general form of a class:


                 class classname {


         type instance-variable1;


         type instance-variable2;


         // ..


    type instance-variableN;


    type methodname1(parameter-list) {


         //body of method


    }


    type methodname2(parameter-list) {


         //body of method


    }


         //..


    type methodnameN(parameter-list) {


         // body of method


    }


    }


     The variables, or data, that are defined in the class are known as instance variables
    and the code itself is held within a method. The methods and variables that are
    defined in a class are called members and, in most cases, the variables will be
    acted on and accessed by the specific methods in the class. The methods determine
    how the data is used.


