    \n## Separators\n\nThese are used a lot in Java and each has its own use:\n\n\
    | Separator | Comments |\n| :--- | :--- |\n| `()` | For declaring methods/passing\
    \ arguments |\n| `{}` | Code block |\n| `[]` | Defines array and accesses element\
    \ |\n| `;` | The end of a statement |\n| `,` | Argument separation |\n| `.` |\
    \ Calling operator for methods & objects |\n| `:` | For each loop |\n\n## Literals\n\
    \nJava uses literals to give us an idea of the data type:\n\n| Literal Types |\
    \ Example | Comments |\n| :--- | :--- | :--- |\n| Integer | `10` | no distinguisher\
    \ |\n| Long | `10L` | for Long |\n| Null | `null` | keyword |\n| String | `\"\
    Java Programs\"` | double quotes for a string |\n| Character | `'a'` | single\
    \ quotes for character |\n| Double Floating Point | `3123.5` | no distinguisher\
    \ |\n| Floating Point | `3.5f` | f for float |\n| Boolean | `true` | keyword or\
    \ false |\n\nOther than separators Java literals give us a brief idea. Let us\
    \ view them in a tabular.\n\n## Escape Sequences\n\nWe use escape sequences in\
    \ strings to escape a specific character:\n\n| Escape Sequence | Sequence |\n\
    | :--- | :--- |\n| `\\t` | Horizontal tab |\n| `\\n` | New line |\n| `\\r` | Carriage\
    \ return |\n| `\\f` | Form feed |\n| `\\\"` | Double quote |\n| `\\'` | Single\
    \ quote |\n| `\\\\` | Backslash |\n\n# Chapter 2\n\n# About Object Oriented Programming\n\
    \nJava is an object-oriented programming (OOP) language, organized around objects\
    \ and data instead of actions and logic. Before you can start writing your own\
    \ Java code, you need to be aware of the basics of the language.\n\n## The Advantages\
    \ of OOP\n\nThe main advantage of OOP is that programmers can create modules that\
    \ don’t need to be changed when a new object is added. Programmers can just create\
    \ a new object that will inherit their features from those that exist, making\
    \ it an easy to modify.\n\n# Chapter 3\n\n# Class Fundamentals\n\nClasses are\
    \ a fundamental part of Java and are incredibly powerful. A class is used to define\
    \ a new data type, which is then used to create an object. In basic, a class is\
    \ a template for the object and the object is an instance of the class. Because\
    \ of that, you will see the words instance and object interchangeably.\n\n## The\
    \ Form of a Class\n\nTo define a class, you must declare the nature and form of\
    \ it. To do this, you must specify the data in the class and the code that will\
    \ operate on it. Most classes will contain both although only have data or code.\n\
    \nYou declare a class by using the `class` keyword and the following shows you\
    \ the general form of a class:\n\n```java\nclass classname {\n    type instance-variable1;\n\
    \    type instance-variable2;\n    // ..\n    type instance-variableN;\n\n   \
    \ type methodname1(parameter-list) {\n        //body of method\n    }\n\n    type\
    \ methodname2(parameter-list) {\n        //body of method\n    }\n    //..\n \
    \   type methodnameN(parameter-list) {\n        // body of method\n    }\n}\n\
    ```\n\nThe variables, or data, that are defined in the class are known as instance\
    \ variables and the code itself is held within a method. The methods and variables\
    \ that are defined in a class are called members and, in most cases, the variables\
    \ will be acted on and accessed by the specific methods in the class. The methods\
    \ determine how the data is used.\n\n# Chapter 4\n\n# Conclusion + FREE BONUS\
    \ VIDEO COURSE\n\n![Blackbird (1).jpg](images/00001.jpeg)\n\nFinally, if you enjoyed\
    \ this book, then I’d like to ask you for a favor, would you be kind enough to\
    \ leave a review for this book on Amazon? It’d be greatly appreciated!\n"
