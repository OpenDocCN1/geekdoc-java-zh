    # Chapter 1


    # Basic Java Syntax


    Java is one of the most versatile of all the computer programming languages and
    one of the easiest to learn. In this chapter, we will be covering the basic syntax
    of the language, which is the first thing you must learn:


    ## Whitespace


    Whitespace characters are what makes the java code much easier to read and consist
    of spaces, newlines, and tabs. Usually, a whitespace character will be ignored
    by the Java compiler so, even if you were to use large amounts of it in your code,
    the actual bytecode that is generated would be quite small and would have an impact
    on system memory. Do be careful of excessive use, though, because it can make
    the code hard to read.


    ## Styles


    Styles is all about how the source code is formatted. A Java file is normally
    formatted so that it is easy to read and that is where style guidelines come into
    play. These are standards that are usually set by an individual or an organization;
    this formatting is ignored by the Java compiler and it includes the use of indentation,
    newlines, and spacing. You can also use comments to format the code and add in
    notes so that anyone else reading your code can see what is going on.


    Styles must deal with the formatting of the source codes. Generally, we format
    a Java file so that it becomes easier to read. To format a Java file, we need
    to look at style guidelines. Style guidelines are mainly standards followed by
    company, organization or individual. Generally, when setting guidelines developers
    keep in mind formatting of code which is easier to read. This formatting is ignored
    by the compiler. Styles include the use of indentation, spacing, and newlines
    which format source codes as per developers. Comments are used to format code
    and add notes so that any other programmer reading the code gets the idea behind
    the code.


    Example 1 – Bad Formatting


    <b>// Bad Style Coding


    // Not easy to read, no indents used


    public class Welcome {


    public static void main(String[] args){


    int i = 0; // single line comment


    for(int i=0;i<=10;i++){


    int j = 1;


    int k = j;


    System.out.println("Welcome to comments");


    }


    } </b>


    Example 2 – Good Formatting


    <b>// Good Style Coding


    // Very easy to read, excellent use of indents


    public class Welcome {


      public static void main(String[] args){


        int i = 0; // single line comment


        for(int i=0;i<=10;i++){


          int j = 1;


          int k = j;


          System.out.println("Welcome to comments");


        }


      }


    }</b>


    ## Comments


    Comments are very important because they allow you to add notes to your source
    code, thus making what could be a complicated piece of code much easier to read
    and to debug. They are not read by the Java compiler so they will have no impact
    on memory.  There are a couple of types of comments:


    ● Single line – begins with a // and anything written between // and the end of
    the line is ignored


    ● Multi-line – begins with /* and ends with */ - anything written in between is
    ignored and this can cover many lines of your code.


    <b>public class Welcome {


      public static void main(String[] args){


        int i = 0; // this is a single line comment


        for(int i=0;i<=10;i++){


         /* int j = 1;


            int k = j;


            System.out.println("Welcome to comments"); */


         /* multi-line comment, whole code in between will be commented out */


        }


      }


    }</b>


    ## Identifiers


    Identifiers are the collective names that are given to methods, classes and variables
    in Java. There are rules about the naming conventions for identifiers and these
    follow:


    ● Identifiers must start with a Unicode character, underscore or dollar sign


    ● Numbers can be included after the first character, along with dollar signs,
    underscores and Unicode characters


    ● Try to avoid using currency symbols, like $ if you can


    ● Identifier names are case sensitive


    ● You cannot use a reserved keyword


    ● Use capital letters to separate two or more words in the name


    Valid Identifiers                            Invalid Identifiers             
