    \ | 保留关键字 |\n\n## 保留关键字\n\nJava 中有几个单词是为语言保留的，你不能将它们用于用途之外的任何地方，特别是不能用于命名。保留关键字如下：\n\
    \n* `abstract`\n* `assert`\n* `boolean`\n* `break`\n* `byte`\n* `case`\n* `catch`\n\
    * `char`\n* `class`\n* `const`\n* `continue`\n* `default`\n* `do`\n* `double`\n\
    * `else`\n* `enum`\n* `extends`\n* `final`\n* `finally`\n* `float`\n* `for`\n\
    * `goto`\n* `if`\n* `implements`\n* `import`\n* `instanceof`\n* `int`\n* `interface`\n\
