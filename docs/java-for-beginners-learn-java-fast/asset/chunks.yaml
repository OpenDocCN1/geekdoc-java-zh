    \n# 第 1 章：Java 基础语法\nJava 是所有计算机编程语言中最强大的语言之一，也是最容易学习的语言之一。在本章中，我们将介绍该语言的基本语法，这是你必须学习的第一点：\n\
    \n### 空格\n空白字符使得 `java` 代码具有可读性。空白字符包括空格、制表符和换行符。编译器会忽略它们，但它们对人类的可读至关重要。\n\n###\
    \ 样式\n样式涉及代码的格式化。适当的缩进和间距使代码更容易理解和维护。\n\n#### 示例 1：糟糕的格式\n```java\n// Bad Style\n\
    public class Welcome {\npublic static void main(String[] args) {\nint i = 0; //\
    \ line comment\nfor(int i=0;i<=10;i++){\nint j = 1;\nint k = j;\nSystem.out.println(\"\
    Welcome to\");\n}\n}\n```\n\n#### 示例 2：良好的格式\n```java\n// Good Style\npublic class\
    \ Welcome {\n    public static void main(String[] args) {\n        int i = 0;\
    \ // line comment\n        for(int i=0;i<=10;i++){\n            int j = 1;\n \
    \           int k = j;\n            System.out.println(\"Welcome to comments\"\
    );\n        }\n    }\n}\n```\n\n### 注释\n注释非常重要，因为它们允许你在源代码中添加备注，从而使可能复杂的代码变得更容易阅读和调试。Java\
    \ 编译器不会读取注释，因此它们不会影响内存。主要有两种类型：\n\n- 单行注释：以 `//` 开头，`//` 到行尾之间的任何内容都会被忽略。\n- 多行注释：以\
    \ `/*` 开头，以 `*/` 结尾——其间的任何内容都会被忽略并可以跨多行。\n\n```java\npublic class Welcome {\n\
    \    public static void main(String[] args) {\n        int i = 0; // this is a\
    \ single line comment\n        for(int i=0;i<=10;i++){\n            /* \n    \
    \        int j = 1;\n            int k = j;\n            System.out.println(\"\
    Welcome to comments\"); \n            */\n            /* 这是多行注释，中间的所有代码将被注释掉 */\n\
    \        }\n    }\n}\n```\n\n### 标识符\n标识符是赋予 Java 中方法、类和变量的集体名称。\n\n- 标识符必须以 Unicode\
    \ 字符、下划线（_）或美元符号（$）开头。\n- 第一个字符之后可以包含数字、美元符号、下划线和 Unicode 字符。\n- 如果可能，尽量避免使用货币符号（如\
    \ `$`）。\n- 标识符名称区分大小写。\n- 你不能使用关键字。\n- 使用大写字母分隔名称中的两个或多个单词。\n\n"
