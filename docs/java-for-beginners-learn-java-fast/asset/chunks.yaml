    * `while`\n\n## 分隔符\n\n这些在 Java 中非常常用，且每个都有自己的用途：\n\n| 分隔符 | 注释 |\n| :--- | :---\
    \ |\n| `()` | 用于声明方法/传递参数 |\n| `{}` | 代码块 |\n| `[]` | 定义数组并访问元素 |\n| `;` | 语句结束\
    \ |\n| `,` | 参数分隔 |\n| `.` | 方法和对象的调用运算符 |\n| `:` | 用于增强循环 |\n\n## 字面量\n\nJava\
    \ 使用字面量来让我们直观了解数据类型：\n\n| 字面量类型 | 示例 | 注释 |\n| :--- | :--- | :--- |\n| 整数 | `10`\
    \ | 无区分符 |\n| 长整 | `10L` | 用于 Long |\n| Null | `null` | 关键字 |\n| 字符串 | `\"Java\
    \ Programs\"` | 双引号表示字符串 |\n| 字符 | `'a'` | 单引号表示字符 |\n| 双精度浮点数 | `3123.5` | 无区分符\
    \ |\n| 浮点数 | `3.5f` | f 表示 float |\n| 布尔值 | `true` | 关键字或 false |\n\n除了分隔符外，Java\
    \ 字面量也给了我们一个简洁的概念。让我们通过表格的形式查看它们。\n\n## 转义序列\n\n我们在字符串中使用转义序列来转义特定字符：\n\n| 转义序列\
    \ | 序列 |\n| :--- | :--- |\n| `\\t` | 水平表符 |\n| `\\n` | 换行 |\n| `\\r` | 回车 |\n\
    | `\\f` | 换页 |\n| `\\\"` | 双引号 |\n| `\\'` | 单引号 |\n| `\\\\` | 反斜杠 |\n\n# 第 2 章\n\
    \n# 关于面向对象编程\n\nJava 是一种面向对象编程 (OOP) 语言，围绕对象和数据组织，而不是动作和逻辑。在开始编写自己的 Java 代码之前，你需要了解该语言的基础。\n\
    \n## OOP 的优势\n\nOOP 的主要优势是程序员可以创建模块，当添加新对象时不需要修改这些模块。程序员只需要创建一个新对象，使其从现有对象继承特征，从而变得易于修改。\n\
    \n# 第 3 章\n\n# 类基础\n\n类是 Java 的基础部分，并且非常强大。类用于定义一种新的数据类型，然后用该类型来创建对象。基本上，类是对象的模板，而对象是类的实例。正如此，你会看到“实例\
    \ (instance)”和“对象 (object)”这两个词交替使用。\n\n## 类的形式\n\n要定义一个类，必须声明它的性质和形式。为了做到，必须指定类中的数据以及对数据进行操作的代码。大多数类都会包含两者，尽管有些只包含数据或代码。\n\
    \n你通过使用 `class` 关键字来声明类，下面是类的通用形式：\n\n```java\nclass classname {\n    type instance-variable1;\n\
    \    type instance-variable2;\n    // ..\n    type instance-variableN;\n\n   \
    \ type methodname1(parameter-list) {\n        //方法体\n    }\n\n    type methodname2(parameter-list)\
    \ {\n        //方法体\n    }\n    //..\n    type methodnameN(parameter-list) {\n\
    \        // 这里的方法体\n    }\n}\n```\n\n在类中定义的变量或数据称为**实例变量 (instance variables)**，代码本身包含在方法内部。类中定义的方法和变量被称为**成员\
    \ (members)**，在大多数情况下，变量会被类中的特定方法操作和访问。方法决定了数据如何被使用。\n\n# 第 4 章\n\n# 结 + 免费赠送课程\n\
    \n![Blackbird (1).jpg](img/00001.jpeg)\n\n"
