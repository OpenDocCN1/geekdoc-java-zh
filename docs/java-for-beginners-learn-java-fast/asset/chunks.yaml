    ## Separators


    These are used a lot in Java and each has its own use:


    Separator                              Comments                                         
                               


    () For declaring methods/passing arguments             


    {}                                          Code block                           
                                                           


    []                                          Defines an array and accesses array
    element             


    ;                                          The end of a statement             
                                             


    ,                                          Argument separation                           
                                     


    .                                          Calling operator for methods & objects       


    :                                          For each loop                           
                                                   


    ## Literals


    Java uses literals to give us an idea of the data type:


    Literal Types                            Example                                         
    Comments


    Integer                                          10                           
                                no distinguisher


    Long                                                        100L             
                                              L for Long


    Null                                                        null             
                                              keyword


    String                                                        “Java Programs”             
                  double quotes for a string


    Character                                          ‘a’                           
                                single quotes for character


    Double Floating Point              3123.5                                         
                  no distinguisher


    Floating Point                            3.5f                                         
                  f for float


    Boolean                                          true                           
                                keyword for true or false


    Other than separators Java also uses literals. Literals give us a brief idea about
    the data types. Let us view them in a tabular form 


    ## Escape Sequences


    We use escape sequences in strings to escape a specific character:


    Escape Sequence                                          Replaced


    /t                                                                      Horizontal
    tab


    /n                                                                      New line


    /r                                                                      Carriage
    return


    /f                                                                      Form feed


    /”                                                                      Double
    quote


