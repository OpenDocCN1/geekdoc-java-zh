- "# Java 入门指南：快速学习 Java\n\n\n\n![](img/00002.jpeg)\n\n\n\n## 引言\n我要感谢你的下载，并祝贺你下载了《Java\
  \ 入学者教程：快速学习 Java》这本书。\n\n这本书将向你介绍 Java 语言编程的核心概念。\n\nJava 是 Web 开发者的首选编程语言，用于 Android\
  \ 应用程序、网站、基于 Web 的游戏以及 Web 应用。它是最容易学习的语言之一，我将介绍 Java 编程的基础概念。\n\n感谢感谢下载本书，希望你读得愉快！\n\
  \n# 第 1 章：Java 基础语法\nJava 是所有计算机编程语言中最强大的语言之一，也是最容易学习的语言之一。在本章中，我们将介绍该语言的基本语法，这是你必须学习的第一点：\n\
  \n## 空格\n空白字符使得 `java` 代码具有可读性。空白字符包括空格、制表符和换行符。编译器会忽略它们，但它们对人类的可读至关重要。\n\n## 样式\n\
  样式涉及代码的格式化。适当的缩进和间距使代码更容易理解和维护。\n\n### 示例 1：糟糕的格式\n```java\n// Bad Style\npublic\
  \ class Welcome {\npublic static void main(String[] args) {\nint i = 0; // line\
  \ comment\nfor(int i=0;i<=10;i++){\nint j = 1;\nint k = j;\nSystem.out.println(\"\
  Welcome to\");\n}\n}\n```\n\n### 示例 2：良好的格式\n```java\n// Good Style\npublic class\
  \ Welcome {\n    public static void main(String[] args) {\n        int i = 0; //\
  \ line comment\n        for(int i=0;i<=10;i++){\n            int j = 1;\n      \
  \      int k = j;\n            System.out.println(\"Welcome to comments\");\n  \
  \      }\n    }\n}\n```\n\n## 注释\n注释非常重要，因为它们允许你在源代码中添加备注，从而使可能复杂的代码变得更容易阅读和调试。Java\
  \ 编译器不会读取注释，因此它们不会影响内存。主要有两种类型：\n\n- 单行注释：以 `//` 开头，`//` 到行尾之间的任何内容都会被忽略。\n- 多行注释：以\
  \ `/*` 开头，以 `*/` 结尾——其间的任何内容都会被忽略并可以跨多行。\n\n```java\npublic class Welcome {\n  \
  \  public static void main(String[] args) {\n        int i = 0; // this is a single\
  \ line comment\n        for(int i=0;i<=10;i++){\n            /* \n            int\
  \ j = 1;\n            int k = j;\n            System.out.println(\"Welcome to comments\"\
  ); \n            */\n            /* 这是多行注释，中间的所有代码将被注释掉 */\n        }\n    }\n}\n\
  ```\n\n## 标识符\n标识符是赋予 Java 中方法、类和变量的集体名称。\n\n- 标识符必须以 Unicode 字符、下划线（_）或美元符号（$）开头。\n\
  - 第一个字符之后可以包含数字、美元符号、下划线和 Unicode 字符。\n- 如果可能，尽量避免使用货币符号（如 `$`）。\n- 标识符名称区分大小写。\n\
  - 你不能使用关键字。\n- 使用大写字母分隔名称中的两个或多个单词。\n\n\n\n\n\n| `tree` | `Tree` | 区分大小 |\n| :---\
  \ | :--- | :--- |\n| `my2var` | `2myVar` | 以数字作为字符 |\n| `myNewVar` | `my@new@var`\
  \ | 无效字符 - @ |\n| `switching` | `switch` | 保留关键字 |\n\n## 保留关键字\n\nJava 中有几个单词是为语言保留的，你不能将它们用于用途之外的任何地方，特别是不能用于命名。保留关键字如下：\n\
  \n* `abstract`\n* `assert`\n* `boolean`\n* `break`\n* `byte`\n* `case`\n* `catch`\n\
  * `char`\n* `class`\n* `const`\n* `continue`\n* `default`\n* `do`\n* `double`\n\
  * `else`\n* `enum`\n* `extends`\n* `final`\n* `finally`\n* `float`\n* `for`\n* `goto`\n\
  * `if`\n* `implements`\n* `import`\n* `instanceof`\n* `int`\n* `interface`\n* `long`\n\
  * `native`\n* `new`\n* `package`\n* `private`\n* `protected`\n* `public`\n* `return`\n\
  * `short`\n* `static`\n* `strictfp`\n* `super`\n* `switch`\n* `synchronized`\n*\
  \ `this`\n* `throw`\n* `throws`\n* `transient`\n* `try`\n* `void`\n* `volatile`\n\
  * `while`\n\n## 分隔符\n\n这些在 Java 中非常常用，且每个都有自己的用途：\n\n| 分隔符 | 注释 |\n| :--- | :---\
  \ |\n| `()` | 用于声明方法/传递参数 |\n| `{}` | 代码块 |\n| `[]` | 定义数组并访问元素 |\n| `;` | 语句结束\
  \ |\n| `,` | 参数分隔 |\n| `.` | 方法和对象的调用运算符 |\n| `:` | 用于增强循环 |\n\n## 字面量\n\nJava 使用字面量来让我们直观了解数据类型：\n\
  \n| 字面量类型 | 示例 | 注释 |\n| :--- | :--- | :--- |\n| 整数 | `10` | 无区分符 |\n| 长整 | `10L`\
  \ | 用于 Long |\n| Null | `null` | 关键字 |\n| 字符串 | `\"Java Programs\"` | 双引号表示字符串 |\n\
  | 字符 | `'a'` | 单引号表示字符 |\n| 双精度浮点数 | `3123.5` | 无区分符 |\n| 浮点数 | `3.5f` | f 表示 float\
  \ |\n| 布尔值 | `true` | 关键字或 false |\n\n除了分隔符外，Java 字面量也给了我们一个简洁的概念。让我们通过表格的形式查看它们。\n\
  \n## 转义序列\n\n我们在字符串中使用转义序列来转义特定字符：\n\n| 转义序列 | 序列 |\n| :--- | :--- |\n| `\\t` |\
  \ 水平表符 |\n| `\\n` | 换行 |\n| `\\r` | 回车 |\n| `\\f` | 换页 |\n| `\\\"` | 双引号 |\n| `\\\
  '` | 单引号 |\n| `\\\\` | 反斜杠 |\n\n# 第 2 章\n\n# 关于面向对象编程\n\nJava 是一种面向对象编程 (OOP) 语言，围绕对象和数据组织，而不是动作和逻辑。在开始编写自己的\
  \ Java 代码之前，你需要了解该语言的基础。\n\n## OOP 的优势\n\nOOP 的主要优势是程序员可以创建模块，当添加新对象时不需要修改这些模块。程序员只需要创建一个新对象，使其从现有对象继承特征，从而变得易于修改。\n\
  \n# 第 3 章\n\n# 类基础\n\n类是 Java 的基础部分，并且非常强大。类用于定义一种新的数据类型，然后用该类型来创建对象。基本上，类是对象的模板，而对象是类的实例。正如此，你会看到“实例\
  \ (instance)”和“对象 (object)”这两个词交替使用。\n\n## 类的形式\n\n要定义一个类，必须声明它的性质和形式。为了做到，必须指定类中的数据以及对数据进行操作的代码。大多数类都会包含两者，尽管有些只包含数据或代码。\n\
  \n你通过使用 `class` 关键字来声明类，下面是类的通用形式：\n\n```java\nclass classname {\n    type instance-variable1;\n\
  \    type instance-variable2;\n    // ..\n    type instance-variableN;\n\n    type\
  \ methodname1(parameter-list) {\n        //方法体\n    }\n\n    type methodname2(parameter-list)\
  \ {\n        //方法体\n    }\n    //..\n    type methodnameN(parameter-list) {\n  \
  \      // 这里的方法体\n    }\n}\n```\n\n在类中定义的变量或数据称为**实例变量 (instance variables)**，代码本身包含在方法内部。类中定义的方法和变量被称为**成员\
  \ (members)**，在大多数情况下，变量会被类中的特定方法操作和访问。方法决定了数据如何被使用。\n\n# 第 4 章\n\n# 结 + 免费赠送课程\n\
