  md: "# 6.2 ~LISTS\n\nYou should be able to work with linked lists and binary trees\
    \ in a do-it-yourself way, using the ListNode and TreeNode classes provided by\
    \ the Development Committee, and have a general understanding of heaps — a particular\
    \ type of binary tree used for implementing priority queues.\n\nSection 6.8 reviews\
    \ Big-Oh analysis of algorithms, which is also a required topic.\n\n# 6.2. Lists\n\
    \nA list is a collection of items arranged in a sequence. We only consider lists\
    \ that hold objects (not ints or doubles). If you want to hold integers or doubles,\
    \ use objects of a wrapper class (Integer or Double). A list may contain duplicate\
    \ values (the same object, obj1 == obj2 or \"equal\" objects, obj1.equals(obj2)).\
    \ Elements of a list can be accessed through indices. The indices start from 0.\n\
    \njava.util.List<E> is a library interface that describes list methods. E in angle\
    \ brackets is the 'type parameter': it specifies the type of objects stored in\
    \ the list. In a program, E is replaced by a specific type of objects. For example,\
    \ we can have a List<String> or a List<Integer>. The AP subset consists of the\
    \ following methods of List<E>:\n\n```\nint size(); // Returns the number of items\n\
    boolean contains(E x);                   // in the list\nvoid add(int index, E\
    \ x);               // Adds x at the end of the list\nE get(int index);      \
    \                 // Inserts x at index\nE set(int index, E x);              \
    \    // Returns the element at index to x\nE remove(int index);              \
    \      // Sets the old value\nE remove(int index);                    // Removes\
    \ the item at index;\nIterator<E> iterator();                 // Returns its value\n\
    ListIterator<E> listIterator();        // Returns an Iterator\n              \
    \                           // (iterators are discussed below)\n```\n\nNote the\
    \ following properties of Java lists:\n\n+   - A list holds references to (that\
    \ is, addresses of) objects.\n- The same object can be inserted several times\
    \ into a list and belong to several lists.\n- In general, an object can be modified\
    \ if it is inserted into a list; however, Strings, Integers, Doubles are immutable\
    \ objects, which cannot be modified.\n- Indices are checked for the valid range,\
    \ from 0 to list.size() - 1; in an appropriate implementation, methods would throw\
    \ an IndexOutOfBoundsException called with an invalid index argument.\n- add(index,\
    \ x) and remove(index) appropriately adjust the indices of all the items that\
    \ follow the added or removed item and adjust the size of the list."
