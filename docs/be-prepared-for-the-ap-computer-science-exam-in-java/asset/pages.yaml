    # 4.5. Polymorphism


    Polymorphism is a mechanism that ensures the correct method is called for an object
    disguised as a more generic type. In the above example, if we


    ```

    double volume = solids[0].Volume();

    ```


    the compiler does not know whether solids[0] is a Sphere or a Cube. The decision
    of which getVolume method to call is postponed until run-time. In Java implementation,
    each object holds a pointer to a table of entry points to its methods; thus the
    object itself "knows" what type of object it is. This technique is called dynamic
    method binding — which method to call is decided at run time, not compile time.'
