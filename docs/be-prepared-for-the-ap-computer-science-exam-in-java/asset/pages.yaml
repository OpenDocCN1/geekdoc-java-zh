    | Insertion Sort | O(n) — array already sorted | O(log n) | O(n²) |

    | Mergesort | O(n log n), or O(n) in a slightly modified version when the array
    is sorted | O(log n) | O(log n) |

    | Quicksort | O(n log n) | O(log n) | O(n²) — pivot is consistently chosen far
