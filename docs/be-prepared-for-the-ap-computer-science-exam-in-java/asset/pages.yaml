    Option I would be problematic on an actual exam. First, it assumes that students
    know how to subtract fractions, which can''t be taken for granted. Second, it
    is ambiguous with regard to possible arithmetic overflow: we assume that the numerators
    and denominators of the fractions are small enough so their products do not overflow
    the int range? Luckily we can eliminate this because the compareTo method is defined
    incorrectly: the parameter must be a Fraction, not an Object. If we put Object
    there the compiler will display a cryptic error message “Fraction must be declared
    abstract” (compareTo(Fraction is not defined). Option II works, even though it
    provides a truncated result of the comparison: compareTo can return only 0, 1,
    or -1. Recall that only the sign of a comparison result really matters. Option
    III fulfils the formal requirements, but fractions that differ “by a small fraction”
    will be deemed equal. This is not in the spirit of compareTo for arithmetic method.
    If a question like this happened to slip past exam editors, we''d say the answer
    was B.


