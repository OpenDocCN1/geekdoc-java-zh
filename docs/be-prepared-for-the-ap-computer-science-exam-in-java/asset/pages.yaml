  md: 'Consider the task of sorting the elements of an array in ascending order. Which
    of the following statements are true?


    +   I. Selection Sort always requires more comparisons than Insertion Sort.

    II. Insertion Sort always requires more moves than Insertion Sort.

    III. Insertion Sort, on average, requires more moves than Selection Sort.


    +   (A) I only

    (B) II only

    (C) III only

    (D) I and II

    (E) II and III


    This question gives us a chance to review the properties of the two quadratic
    sorts. As we have, Statement I is false: although, on average, Selection Sort
    requires more comparisons, Insertion Sort (an array sorted) will take as many
    comparisons as Selection Sort. Statement II is false, too; in the best case, when
    the array is already sorted, Insertion Sort does not require any moves at all.
    (Selection Sort, too, with a slight modification, can avoid any moves when the
    array is already sorted.) Statement III is the vogue: what do we mean, “on average?”
    First, our array must be large enough to support conclusions. Sorting an array
    of three elements will not be representative. Let''s assume we set up an experiment
    where we generate a fairly large array of random numbers, sort it using each of
    the two algorithms, and count the number of moves. Indeed, the $k$-th iteration
    through the outer loop may require more moves from 0 to $k$ moves, $k/2$ moves
    on average. In Selection Sort, each iteration through the outer loop requires
    one swap, which can be counted as three moves. The answer is C.


    Insertion Sort works better with a linked list than with an array because inserting
