  md: 'Object-oriented programming (OOP) — a programming methodology based on designing
    the program as a world of interacting objects arranged in hierarchies of classes
    and using encapsulation and polymorphism.


    Top-down design — a design methodology in which you define the general structure
    of the program, laying out high-level classes and their interaction, and then
    refine the design of each class, identifying subtasks and smaller classes or methods.
    Then you refine the design of subtasks, individual methods, and so on.


    Top-down development — similar to top-down design: you first lay out high-level
    classes and methods. These methods may call lower-level methods, which are not
    yet implemented. You can compile and sometimes test high-level pieces of your
    code by substituting “stubs” — empty or greatly simplified placeholders — low-level
    methods that are not coded.


    Data structure — a way of organizing data combined with methods of accessing and
    manipulating the data. For example, a two-dimensional array with methods or operators
    for retrieving and changing the values of elements is a data structure that may
    be useful for representing tables.


    Encapsulation and information hiding — the practice of making all instance variables
    and helper methods that are used only inside the class private. The clients of
    a class can use a class only through its public constructors and methods.


    Procedural abstraction — a description of a procedure that is not tied to a specific
    hardware platform, particular data types, or other details. A high-level programming
    language, such as Java, already assures a degree of procedural abstraction by
    isolating a programmer from the particular hardware platform. An algorithm is
    even more abstract. It can be described using pseudocode, flowcharts, or other
    tools independent of any particular programming language.


    Reusable code — debugged and tested libraries, classes, or fragments of code that
    are somewhat general in nature and ready to be reused in other projects. Using
    code shortens software development projects, no matter what methodology is being
    employed.


    Team development — OO languages, such as Java, allow you to split a project into
    separate pieces and assign their development to different team members. Encapsulation
    and information hiding facilitate team development by limiting the amount of interaction
    needed between developers.


    User interface — the behavior of a program as it interacts with a user: screens,
    menus, commands, messages, graphics, and so on.'
