    A course registration database holds information about students'' sign-ups for
    courses in a given semester. It must be able to perform two tasks quickly: determining
    whether or not a particular student is registered for a given course, and generating
    a list of all the students in a given course. Which of the following data organization
    methods is most appropriate for these tasks?


    +   (A) A map that uses students as keys and a value associated with a key

    (B) A map that uses courses as keys and a student as a value associated with a
    key

    (C) A two-dimensional array of Boolean values with rows corresponding to courses
    and columns corresponding to students; the element at the intersection of course
    and student is set to true if the student is taking the course

    (D) A map that uses courses as keys; a value associated with the key is a set
    of all students taking this course

    (E) A map that uses students as keys; a value associated with the key is a list
    of all students taking the student


    Note that sets and lists are objects in Java, so choices D and E are entirely
    plausible. A student can take several courses and several students can be in the
    same course, so the mappings in A and B do not work. The table approach in C could
