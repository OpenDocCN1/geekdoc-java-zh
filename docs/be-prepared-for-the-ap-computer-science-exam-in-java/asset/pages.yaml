  md: 'The add(index, x) and remove(index) methods are less efficient because they
    require shifting all values that follow the value at index toward the end or toward
    the beginning of the array, respectively.


    ```

    java.util.LinkedList<E>

    ```


    The nodes of a linked list are scattered in memory, but each node contains a reference
    to the next node. In the last node of the list, the reference is set to null.


    ![](img/e320d34bf6b289b099c4a1d8b2b5ab9c_130_0.png)


    Figure 6-1. A linked list


    A linked list with a tail maintains an additional reference to the last node.
    A doubly-linked list has a reference to the tail and a reverse link from each
    node to the previous one (Figure 6-2).


    ![](img/e320d34bf6b289b099c4a1d8b2b5ab9c_130_1.png)


    Figure 6-2. A doubly-linked list


    java.util.LinkedList<E> implements a list as a doubly-linked list, with references
    to the list''s head and tail.


    A linked list does not provide direct access to the list''s elements; to get the
    i-th element you need to start from the beginning (or end) and follow the links
    until you get to the i-th node. The get(index) and set(index, x) methods are still
    provided in LinkedList<E> to fulfill the requirements of the List<E> interface,
    but these methods are inefficient. On the other hand, you don''t need to move
    items when you insert or remove an item: a new node can be inserted or removed
    simply by rearranging a few links.'
