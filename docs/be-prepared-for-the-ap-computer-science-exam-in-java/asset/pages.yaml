    *** Syntax error ***


    This example is longer than a typical multiple-choice question, but it allows
    us to review stacks and queues in a more realistic setting. In this method a stack
    is used to untangle expression with nested parentheses and a queue is used for
    storing parenthesized subexpressions they are extracted. This is a reasonable
    example of what stacks and queues might be used for. As soon as an opening parenthesis
    is found, its position is saved on the stack; when a closing parenthesis is found,
    the saved opening is popped from the stack and the substring between (excluding
    the parentheses) is added to the queue. Use of a stack automatically assures that
    the opening and closing parentheses for a substring is indeed a matching pair.
    The stack must be empty at the end; otherwise a syntax error is reported because
    the parentheses do not match.


    In this example, expr is "Consider (((a+b) * (a-b))/2". The parentheses match,
    so E is not the right answer. Their contents are printed for each pair of matching
    parentheses, so D is not the right answer either. There are four matching pairs,
    so the output must contain exactly four lines, as in A and C. The inner expressions
    end up closer to the top of the stack, so they will be queued and printed first.
    The answer is A.


