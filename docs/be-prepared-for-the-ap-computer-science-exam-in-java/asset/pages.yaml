  md: '# viii PREFACE


    This is a lot of material to cover, and it is certainly not the goal of this book
    to teach you everything you need to know from scratch. For that, you need a complete
    textbook with exercises and programming projects. Most students who take the exam
    are enrolled in an AP science course at their school. A determined student can
    prepare for the exam on his or own; it may take anywhere between three and twelve
    months, and a good textbook will be even more important.


    The goals of this book are:


    +   - to describe the exam format and requirements

    - to describe the Java subset

    - to provide an effective review of what you should know with emphasis on the
    more difficult topics and common omissions and mistakes

    - to help you identify and fill the gaps in your knowledge

    - to offer sample exam questions with answers, hints, and solutions for you to
    practice and analyze your mistakes


    The AP exams in computer science are paper-and-pencil affairs. While you need
    a computer with Java to learn how to program and how to implement common algorithms
    in Java, this book does not require the use of a computer. In fact, it is a good
    idea not to use one when you work on practices, so that you can get used to the
    exam''s format and environment. One-hundred-percent correct Java syntax is the
    emphasis here. Small mistakes (a missed semicolon or a brace) that a compiler
    would normally help catch will probably not affect your exam score. You''ll need
    a computer only to access AP Central and our web site for the latest updates and
    past exam free-response solutions.


    Chapter 1 explains the format, required materials, and the Java subset for the
    exams and provides information about exam grading and exam-taking hints. Chapter
    2 and Chapter 3 cover the elements of Java required for the exam. Chapter 4 deals
    with OOP topics. Chapter 5 deals with common algorithms for searching and sorting.
    Chapter 6 reviews additional AB exam types: lists, stacks, queues, trees, sets,
    maps, and so on. Chapter 7 reviews the GridWorld case study. The review chapters
    contain sample multiple-choice questions with detailed explanations of all the
    right and wrong answers. Chapter 8 is actually on the book''s companion web site,
    http://www.skylit.com/prepared/. It offers annotated solutions to past exams.
    At the end of the book are five practice solutions — three A and two AB, with
    no overlap — followed by answers and solutions.


    Good luck!'
