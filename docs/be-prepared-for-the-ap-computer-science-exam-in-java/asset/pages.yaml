    For example:


    ![](img/e320d34bf6b289b099c4a1d8b2b5ab9c_157_0.png)


    # It is easy to find the smallest node in a heap — it is at the root.


    The completeness property allows us to store a heap in an array. The nodes are
    simply stored in order of scanning all the levels from top to bottom, left to
    right. In Java implementations, it is convenient to leave the first element of
    the array unused, because in algorithms that handle heaps it is easier to have
    the root of the heap in the element of the array with the index 1. The above tree,
    for example, may be stored as


    ```

    <empty> A D E X L R X

    ```


    In this scheme, a[1] is the root. If a[i] is a node, its parent is found in a[i/2]
    and its left and right children, if present, are found in a[2*i] and a[2*i+1].


    In the heap implementation, remove removes the root of the heap and returns its
    value. After the root is removed, the heap is repaired by moving its last leaf
    (that is, the rightmost node in the bottom row) to the root and then “reheaping
    down” until the ordering property is restored. Reheaping down is swapping the
    node that is out of order with its smallest child until it falls into place.


    A node is inserted by adding it as a new leaf to the bottom row, then “reheaping
    it up” until the ordering is restored. Reheaping up is swapping the node that
    is out of order with its parent until it falls into place.


    > The time of both removal and insertion operations, on average as well as in
    the worst case, is roughly proportional to log n, where n is the number of nodes
    in the heap.'
