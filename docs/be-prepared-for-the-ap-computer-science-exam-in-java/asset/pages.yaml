  md: "The following method eliminates consecutive nodes with duplicate values from\
    \ a linked list. For example, A→B→B→C→A→A becomes A→B→C→A.\n\n```\npublic void\
    \ skipDuplicates(ListNode head) {\n    ListNode p = head;\n    ListNode p2;\n\
    \    while (p != null) {\n        p2 = p.getNext();\n        while (p2 != null\
    \ && p2.getValue().equals(p.getValue())) {\n            p2 = p2.getNext();\n \
    \       }\n        p.setNext(p2);\n        p = p.getNext();\n    }\n}\n```\n\n\
    Which of the following best describes the best-case and worst-case running time\
    \ for skipDuplicates on a list with n nodes\n\nBest case: Worst case:\n\n+   (A)\
    \ O(1) O(n)\n(B) O(n) O(n)\n(C) O(1) O(n^2)\n(D) O(n) O(n^2)\n(E) O(n^2) O(n^2)\n\
    \n> No matter what the “best case” is, the method has to examine every node of\
    \ the list. The running time cannot possibly be constant; therefore, A and C are\
    \ wrong answers. There is a case when all nodes are different. In that case the\
    \ inner loop is simply skipped, and we end up with a simple traversal of the list\
    \ in one sequential loop. The running time in that case is O(n), so E is not the\
    \ right answer. We are left with B and D. This example is an exception to the\
    \ rule of thumb: it has nested loops, so you might think the worst time might\
    \ be O(n^2). But this method eliminates consecutive duplicate values, not all\
    \ duplicate values. The trick is that the outer loop doesn't necessarily go to\
    \ the next node, but can jump over all removed nodes. Even when all the nodes\
    \ of the list are the same, each node is visited only once. We did warn you to\
    \ use the rules of thumb with caution, didn't we? The answer is B."
