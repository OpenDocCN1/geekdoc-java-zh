  md: 'The row number increases in the direction from north to south. The column number
    increases from west to east.


    Seven more constants represent turns:


    ```

    public static final int LEFT = -90;

    public static final int RIGHT = 90;

    public static final int HALF_LEFT = -45;

    public static final int HALF_RIGHT = 45;

    public static final int FULL_CIRCLE = 360;

    public static final int HALF_CIRCLE = 180;

    public static final int AHEAD = 0;

    ```


    (In your code, you might find it easier to use the numbers — 360, 180, 0 — instead
    of Location.FULL_CIRCLE, Location.HALF_CIRCLE, Location.AHEAD.)


    Location''s getLocation(int dir) returns the location that is adjacent to this
    location in the compass direction. Locations that touch in a corner are considered
    adjacent.


    Location''s getDirectionToward(Location other) method returns the compass direction
    (in degrees) from this location to other. For example,


    ```

    Location loc1 = new Location(3, 7);

    Location loc2 = loc1.getAdjacent(Location.SOUTHWEST);

    int dir = loc1.getDirectionToward(loc2);

    ```


    sets loc2 to (4, 6) and dir to 225 (that is, Location.SOUTHWEST).


    # Grid


    The Grid<E> interface represents a two-dimensional grid that can hold objects
    of the type E. GridWorld uses Grid<Actor> to hold objects that are Actors (that
    is objects of the class Actor or any of the subclasses or descendants of Actor).


    > In GridWorld, only one actor can reside at a given location in the grid.


    The interface isolates specific implementations of the grid from the rest of the
    GridWorld classes.


    A grid can be implemented as a two-dimensional array (as in BoundedGrid), but
    it can also be implemented in other ways. 「 Only the AB exam deals with specific
    implementations of Grid. 」


    The Grid<E> interface is shown in Figure 7-3. It has eleven methods that roughly
    fall into two groups: “general” grid methods and “local neighborhood” methods.'
