    # 6.8. Big-Oh Analysis


    In previous chapters we have said several times that “the number of required comparisons
    is approximately proportional to $n^2$ or “the running time is roughly proportional
    to log $n$." What exactly does “approximately” or “roughly” mean? “Big-Oh” provides
    a formal definition and notation for the concept of order of growth.


    An accurate definition of “Big-Oh” can be found in many textbooks. Here we give
    only a practical rule:


    > If we have two functions, $f(n)$ and $g(n)$, and the ratio $f(n)/g(n)$ approaches
    a positive constant as $n$ increases without bound, then we can say that $f$ and
    $g$ have the same order of growth, and we can write:

    $f(n) = O(g(n))$


    The order of growth definition disregards constant factors: $f(n) = O(k \cdot
    f(n))$ for constant $k > 0$.


    In the analysis of algorithms, an integer $n$ defines the size of a task: the
    number of elements to be sorted; the number of nodes in a list or set, and so
    on. The time or space requirements for an algorithm can be expressed in terms
    of $O(f(n))$. We use standard reference functions to which we compare the rates
    of growth. The most common reference functions are:


    | (constant) | $n \log n$ | ($n \log n$) |

    | $\log n$ (logarithmic) | $n^2$ (quadratic) |

    | $n$ (linear) |


    If $f(n)$ is a polynomial of degree $k$, then $f(n) = O(n^k)$.


    For example,


    ```

    $$(n-1) = \frac{n^2}{2} - \frac{n}{2} = O(n^2)$

    ```'
