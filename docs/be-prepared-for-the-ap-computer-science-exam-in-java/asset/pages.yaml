  md: "# Loop invariants\n\nAB exam takers should be familiar with the concept of\
    \ a loop invariant. A loop invariant is an assertion about the loop that is relevant\
    \ to the purpose of the loop and holds true before and after each iteration through\
    \ the loop. This assertion is usually expressed as a relation between the variables\
    \ in loop. Loop invariants are used to reason about programs formally and to prove\
    \ their correctness without tracing all the iterations through a loop. If you\
    \ can establish if the assertion is true before the first iteration, and for any\
    \ iteration if the assertion is true before iteration it will remain true after\
    \ that iteration, then your assertion is a loop invariant. If you are familiar\
    \ with mathematical induction, you can see how it works here. If not, you can\
    \ still answer questions about loop invariants without too much trouble.\n\nConsider\
    \ the following code segment:\n\n```\nint count = 0;\nint n = 41;\nint k = 2;\n\
    \nwhile (k <= n)\n{\n    if (isPrime(k))\n        count++;\n    k++;\n}\n```\n\
    \nWhich of the following statements are loop invariants for the above code?\n\n\
    +   I. k is a prime.\nII. 41 is a prime.\nIII. count is equal to the number of\
    \ primes from 2 to $k-1$.\n\n+   (A) I only\n(B) II only\n(C) III only\n(D) I\
    \ and II\n(E) None of the three"
