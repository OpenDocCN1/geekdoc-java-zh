  md: '# 4.4~Class Hierarchies


    The MailingList class HAS-A(n) ArrayList<String> people as an instance variable,
    but Mailing Is-Not-A(n) ArrayList: it does not Array. The programmer has not provided
    a size method for the Mailing class (a design mistake), so choice A is wrong.
    B or C might look alike at first, but people is private in MailingList, so it
    is not directly accessible in Subscribers. MailingList has a public method getPeople
    and this method is inherited and accessible in the Subscribers class. getPeople
    returns an ArrayList<String>, which has a size that returns the size of the list.
    The answer is D.

    Also note that


    ```

    return getPeople();

    ```


    is equivalent to


    ```

    ArrayList<String> temp = getPeople();

    return temp.size();

    ```


    # 4.4. Class Hierarchies


    If you have a class, you can derive one or several subclasses from it. Each of
    these classes can in turn serve as a superclass for other subclasses. You can
    build a tree-like hierarchy of classes, in which each class has one superclass.
    For example:


    ![](img/e320d34bf6b289b099c4a1d8b2b5ab9c_84_0.png)


    In fact, Java classes belong to one big hierarchy; it starts at a class Object.
    If you do not specify that your class extends any particular class, then it extends
    Object by default. Therefore, every object IS-A(n) Object. The Object class provides
    a few common methods, including equals and toString, but these methods are not
    very useful and usually get redefined classes in the lower hierarchy.


    Class hierarchies exist to allow reuse of code from classes in the lower classes
    without duplication and to promote a more logical design. A class lower in the
