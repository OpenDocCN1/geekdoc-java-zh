  md: '# 4 CHAPTER 1 ~ EXAM FORMAT, GRADING, AND TIPS


    AB exam:


    All of the above, plus you should be able to:


    +   - Write code that throws exceptions, such as

    throw new NoSuchElementException();

    throw new IllegalArgumentException();

    - Design and implement interfaces, abstract classes, subclasses.

    - Use small subsets of methods for collection interfaces and classes List<E>,
    ArrayList<E>, LinkedList<E>, Iterator<E>, ListIterator<E>, Stack<E>, Queue<E>,
    PriorityQueue<E>, Set<E>, TreeSet<E>, HashSet<E>, Map<K, V>, TreeMap<K, V>, HashMap<K,
    V> J-).


    > If you must stray from the subset in your free-response solution, you might
    have misunderstood the problem and be making it harder than it is.


    Things that are not in the AP subset and should be avoided include the following:


    +   - Java syntax abominations, such as the ?_: operator and the "comma" operator

    ++ and -- in expressions (as in a[i++])

    - Primitive data types other than boolean, int, and double (char is not in the
    subset)

    - All bit-wise logical operators


    Also not in the subset and will not be tested:


    +   - The switch statement, the do-while loop, continue in loops

    - The prefix form of ++ and -- operators (++k, --k)

    - Library classes (such as StringBuffer, Arrays, DecimalFormat, etc.), unless
    specifically listed in the subset

    - checked exceptions and try-catch-finally statements

    - System.in and Scanner; any input and output other than System.out.print and
    System.out.println


    +   - enum data types'
