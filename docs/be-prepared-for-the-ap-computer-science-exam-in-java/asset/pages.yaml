  md: "# 106 CHAPTER 5 ~ ALGORITHMS\n\n42\n\nConsider the following implementation\
    \ of Mergesort:\n\n```\n// sorts values a[n1], ... a[n2] in ascending order\n\
    // precondition: 0 <= n1 <= n2 < a.length\npublic void sort(int[] a, int n1, int\
    \ n2) {\n    if (n1 == n2)\n        return;\n    int m = (n1 + n2) / 2;\n    sort(a,\
    \ n1, m);\n    sort(a, m+1, n2);\n    if (a[m] > a[m+1]) // Optional line\n  \
    \  merge(a, n1, n2);\n}\n```\n\nCompare it with a more conventional version with\
    \ the if statement on the “optional line” removed. Suppose a has 8 elements and\
    \ sort(a, 0, 7) is called. Which of the following values in a will version with\
    \ if work faster than the version without?\n\n+   I. 1 2 3 4 5 6 7 8\nII. 5 6\
    \ 7 8 2 1 4 3\nIII. 2 1 4 3 6 5 8 7\n\n+   (A) I only\n(B) I and II\n(C) I and\
    \ III\n(D) I, II, and III\n(E) None of the three\n\nA typical implementation of\
    \ Mergesort doesn't skip the work even when the array is already sorted. The slight\
    \ change proposed in this question allows Mergesort to skip all the merging and\
    \ quickly establish that an array is already sorted, as in Array I. This version\
    \ also avoids merging when the array is partially sorted, namely when all the\
    \ values in the left half are smaller than any value in the right half, as in\
    \ Array III. In that case, the two recursive calls to sort the array becomes sorted\
    \ and the call to merge is skipped.\n\nSince the algorithm is recursive, it will\
    \ also save time when portions of the array have these properties — are either\
    \ sorted or partially sorted — even when the whole array isn't. Array II, for\
    \ example, the left half is sorted and the right half is partially sorted. The\
    \ answer is D."
