  md: '# 2.4. Integer and Double Classes


    In Java, variables of primitive data types (int, double, etc.) are not objects.
    In some situations it is convenient to represent numbers as objects. For example,
    you might want to store numeric values in an ArrayList (see Section 2.6), but
    the elements of ArrayList must be objects. The java.lang package provides several
    “wrapper” classes that represent primitive data types as objects. Two of these
    classes, Integer and Double, are in the AP subset.


    The Integer class has a constructor that takes an int value and creates an Integer
    object representing that value. The intValue method returns an Integer value represented
    by that object as an int. For example:


    ```

    Integer obj = new Integer(123);

    int num = obj.intValue(); // num gets the value of 123

    ```


    Likewise, Double''s constructor creates a Double that represents a given double
    value. The method doubleValue returns the double represented by a Double object:


    ```

    Double obj = new Double(123.45);

    double x = obj.doubleValue(); // x gets the value of 123.45

    ```


    > The equals method of the Integer or of the Double class if you want to compare
    two Integer or Double variables, respectively.


    For example:


    ```

    Integer a = new Integer(...);

    Integer b = new Integer(...);

    if (a.equals(b))

    ```


    If you use a relational operator == or != to two Integer or Double variables,
    you will compare their addresses. This is rarely, if ever, what you want to do.


    The Integer and Double classes implement the Comparable<Integer> and Comparable<Double>
    interfaces respectively (see Section 4.6), each of these classes has a compareTo
    method. As usual, obj1.compareTo(obj2) returns a positive integer if obj1 is greater
    than obj2 (that is, obj1’s numeric value is greater than obj2’s numeric value),
    a negative integer if obj1 is less than obj2, and zero if their numeric values
    are equal.'
