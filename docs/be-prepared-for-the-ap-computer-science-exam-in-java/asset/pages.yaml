  md: '# 1.3. Grading


    The exams are graded on a scale from 1 to 5. Grades of 5 and 4 are called “extremely
    well qualified” and “well qualified,” respectively, and usually will be honored
    by colleges that give credit or placement for AP exams in computer science. A
    grade of 3, “qualified,” especially on the A exam, may be denied credit or placement
    at some colleges. Grades of 2, “possibly qualified,” and 1, “no recommendation,”
    will not get you college credit or placement.


    Table 1-1 presents published statistics and grade distributions on the 2004 A
    and AB exams. In 2004, 13,834 candidates took the A exam and 5,807 candidates
    took the AB exam.


    | | Computer Science A | | Computer Science AB | |

    |---|---|---|---||}{

    | | Number | % | Number | % |

    | Students | 13,834 | 100.0 | 5,807 | 100.0 |

    | Grade: | 5 | 2,572 | 18.6 | 1,574 | 27.1 |

    | | 4 | 3,270 | 23.6 | 1,058 | 18.2 |

    | | 3 | 2,102 | 15.2 | 1,020 | 17.6 |

    | | 2 | 1,309 | 9.5 | 702 | 12.1 |

    | | 1 | 4,581 | 33.1 | 1,453 | 25.0 |

    | 3 or Higher | | 7,944 | 57.4 | 3,652 | 62.9 |


    Table 1-1. 2004 grade distributions for A and AB exams


    > The multiple-choice and free-response sections weigh equally in the final grade.


    The College Board uses a weighted combination of the multiple-choice (MC) and
    free-response (FR) scores to determine the final total score:


    ```

    totalScore = MC_coeff * (countCorrect - 0.25*countWrong) + FR_coeff * FR_score;

    ```'
