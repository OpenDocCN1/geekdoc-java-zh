  md: "# 92 CHAPTER 5 ~ ALGORITHMS\n\n# # Insert in order\n\nMany applications, including\
    \ Insertion Sort, require you to insert a value into a sorted array while preserving\
    \ the order:\n\n```\n// shifts a[k], ..., a[n-1] appropriately into\n// a[k-1],\
    \ ..., a[n] and insert new value into a[k] so that the\n// ascending order is\
    \ preserved\n// precondition: a[0] <= a[1] <= ... <= a[n-1]; n < a.length\nvoid\
    \ insertInOrder(int a[], int n, int newValue)\n{\n    // Shift values to the right\
    \ by one until you find the\n    // place to insert:\n    int k = n;\n    while\
    \ (k > 0 && a[k-1] > newValue)\n    {\n        a[k] = a[k-1];\n        k--;\n\
    \    }\n    a[k] = newValue;\n}\n```\n\nIn the above code, we shift the values\
    \ in the array to the right by one to create a vacant slot and then insert the\
    \ new value into the vacancy thus created. Note that the shifting has to proceed\
    \ from the end, so that each shifted value is placed into a vacant slot and does\
    \ not overwrite any data (Figure 5-1).\n\n![](img/e320d34bf6b289b099c4a1d8b2b5ab9c_105_0.png)\n\
    \n**Figure 5-1.** Inserting a new value in the middle of a sorted array"
