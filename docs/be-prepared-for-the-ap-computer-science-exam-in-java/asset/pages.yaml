  md: "# 7.2 ~ THE Location CLASS AND THE GRID INTERFACE 155\n\n# 7.2. The Location\
    \ Class and the Grid Interface\n\n# Location\n\nA Location object represents a\
    \ (row, col) location (with integer coordinates) on a two-dimensional grid.\n\n\
    The Location class has one constructor —\n\n```\npublic Location(int row, int\
    \ col)\n```\n\nand two accessor methods:\n\n```\npublic int getRow()         \
    \     // Returns the row for this location\npublic int getCol()              //\
    \ Returns the column for this location\n```\n\n> Location objects are immutable:\
    \ once created, a Location object cannot change.\n\nLocation implements Comparable\
    \ and provides a compareTo method that compares locations by row and then, if\
    \ equal, by column. Location also overrides Object's equals method in a manner\
    \ consistent with compareTo. [ It is consistent with the hashCode method as well\
    \ ]\n\nLocation's toString converts a location into a string:\n\n```\npublic String\
    \ toString() \n{\n    return \"\" + getRow() + \", \" + getCol() + \"\";\n}\n\
    ```\n\nThe Location class also helps to handle directions on the grid. It defines\
    \ eight public constants\n\n```\npublic static final int NORTH = 0;\npublic static\
    \ final int NORTHEAST = 45;\npublic static final int EAST = 90;\npublic static\
    \ final int SOUTHEAST = 135;\npublic static final int SOUTH = 180;\npublic static\
    \ final int SOUTHWEST = 225;\npublic static final int WEST = 270;\npublic static\
    \ final int NORTHWEST = 315;\n```\n\n— represent compass directions (in degrees)."
