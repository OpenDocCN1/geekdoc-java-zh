  md: "# Insertion Sort\n\nIn *Insertion Sort*, we iterate for *k* from 2 up to *n*.\
    \ We keep the first $(k-1)$ elements sorted and insert the $k$-th element among\
    \ where it belongs:\n\n```\n// sorts n values in a in ascending order\n// precondition:\
    \ array contains a[0], ..., a[n-1] (n >= 1)\npublic void insertionSort(int[] a,\
    \ int n)\n{\n    for (int k = 2; k <= n; k++) {\n        int temp = a[k-1];\n\
    \        int i;\n        for (i = k-1; i > 0; i--) {\n            if (a[i] <=\
    \ temp)\n                break;\n            else\n                a[i] = a[i-1];\n\
    \        }\n        a[i] = temp;\n    }\n}\n```\n\nIn this version of Insertion\
    \ Sort, if the array is already sorted, the inner loop just runs one comparison\
    \ and we immediately break out of it. Then the method needs a total of $n-1$ comparisons.\
    \ This is the best case: instead of *quadratic* time, the method executes in linear\
    \ time.\n\nThe worst case for this implementation of Insertion Sort is when the\
    \ array is sorted in reverse order. Then the inner loop runs $k-1$ times and the\
    \ whole method will need as many comparisons as Selection Sort:\n\n$1+2+...+(n-1)\
    \ = \\frac{n(n-1)}{2}$\n\nThe average case is about half that number, still approximately\
    \ proportional to $n^2$.\n\nThe methods above are just examples of how Selection\
    \ and Insertion Sorts can be implemented. Other variations are possible."
