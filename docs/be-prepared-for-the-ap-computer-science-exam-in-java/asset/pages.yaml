  md: "AbstractGrid leaves the remaining seven “general grid” methods — numRows, numCols,\
    \ isValid, get, put, remove, and getOccupiedLocations — abstract (see Figure 7-3\
    \ on page 157). BoundedGrid and UnboundedGrid implement these methods.\n\n# BoundedGrid\n\
    \nIn the BoundedGrid<E> class, objects are stored in a 2-D array:\n\n```\nprivate\
    \ Object[] occupantArray;\n```\n\nEmpty locations hold null. BoundedGrid’s constructor\
    \ allocates occupantArray with positive numbers of rows and columns; elements\
    \ are filled with null by default. For a location to be valid in BoundedGrid,\
    \ the location’s row and column must fall in the ranges: 0 <= row < getNumRows();\
    \ 0 <= col < getNumCols(). In Java it looks like this:\n\n```\npublic boolean\
    \ isValid(Location loc)\n{\n    return 0 <= loc.getRow() && loc.getRow() < getNumRows()\n\
    \        && 0 <= loc.getCol() && loc.getCol() < getNumCols();\n}\n```\n\nJava\
    \ does not support generic arrays, so occupantArray is an array of Objects; a\
    \ cast is used in the get method to convert the element into type E (which causes\
    \ an unavoidable warning):\n\n```\npublic E get(Location loc)\n{\n    if (!isValid(loc))\n\
    \        throw new IllegalArgumentException(\"Location \" + loc\n            +\
    \ \" is not valid\");\n    return (E) occupantArray[loc.getRow()][loc.getCol()];\n\
    \        // the cast to (E) causes a warning\n}\n```\n\nThe bounded grid implementation\
    \ is efficient for accessing, adding, and removing elements: the time complexity\
    \ (Big-Oh) of the get, put, and remove methods is O(1). However, to get a list\
    \ of all occupied locations, you need to scan the whole occupantArray:"
