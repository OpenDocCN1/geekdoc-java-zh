  md: "# 3.1 ~ CLASSES 45\n\nIn the AP subset, constructors are always public.\n\n\
    > It is a common practice in OOP (and a requirement on the AP exam) to make all\
    \ instance variables private.\n\nPrivate fields and methods hide the implementation\
    \ details of a class from other classes, its clients. This concept is known as\
    \ encapsulation. A client class uses your class through constructors and public\
    \ methods. In general, it is a good idea to supply as little information to client\
    \ classes as possible. This concept is known as information hiding. For example,\
    \ if a method is used only internally within that class, it should be made private.\n\
    \n# Accessors and modifiers\n\nSince all instance variables are private, they\
    \ are not directly accessible in client classes. It is common to provide special\
    \ public methods, called accessors, that return the values of instance variables.\
    \ For example:\n\n```\npublic class School\n{\n    public String getName()\n \
    \   {\n        return name;\n    }\n}\n```\n\nAccessors' names often start with\
    \ a \"get.\" Accessors can have any name, but starting with \"get\" makes their\
    \ purpose easier to remember. Accessors do not change the state of the object.\n\
    \nA public method that sets a new value of an instance variable is called a modifier.\
    \ Modifiers' names often start with a \"set.\" For example:\n\n```\npublic class\
    \ School\n{\n    public void setName(String nm)\n    {\n        name = nm;\n \
    \   }\n}\n```\n\nThe \"accessor\" and \"modifier\" designations are somewhat informal\
    \ — a class may have a method that sets an instance variable to a new value and\
    \ at the same time returns, say, the old value."
