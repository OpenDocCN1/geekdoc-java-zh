  md: "# 5.3. Selection and Insertion Sorts\n\nSorting means arranging a list of items\
    \ in ascending or descending order, according to the values of the items or some\
    \ key that is part of an item. Sorting algorithms are usually discussed for lists\
    \ represented as arrays. On the AB exam, sorting questions may involve linked\
    \ lists, queues, or priority queues.\n\n**Selection Sort and Insertion Sort are\
    \ called quadratic sorts because they use two straightforward nested loops and\
    \ the number of required comparisons is approximately proportional to n^2.**\n\
    \n# Selection Sort\n\nIn Selection Sort we iterate for k from n down to 2: we\
    \ find the largest among the first k elements and swap it with the k-th element.\n\
    \n```\n// sorts values in an ascending order\n// precondition: array contains\
    \ a[0], ..., a[n-1] (n >= 1)\npublic void selectionSort(int[] a, int n) {\n  \
    \  int maxPos;\n    for (int k = n; k >= 2; k--) {\n        maxPos = 0;\n    \
    \    for (int i = 1; i < k; i++) {\n            if (a[i] > a[maxPos])\n      \
    \          maxPos = i;\n            }\n        }\n        // Swap a[maxPos], a[k-1]\n\
    \        int temp = a[maxPos]; a[maxPos] = a[k-1]; a[k-1] = temp;\n    }\n}\n\
    ```\n\nIn the above method, the inner loop runs k-1 times, for k=n, n-1, ...,\
    \ 2.\n\n**The total number of comparisons in Selection Sort is always the same:**\n\
    \n$$(n-1)+(n-2)+...+1 = \\frac{n(n-1)}{2}$$\n\nIn another variation of Selection\
    \ Sort we find the smallest among the elements a[k], ..., a[n-1] and swap it with\
    \ a[k] (for k=0, ..., n-2)."
