  md: '# 174 CHAPTER 7 ~ GRIDWorldCase STUDY


    In general, BoundedGrid is simple and predictable. It is suitable for implementing
    relatively small grids. BoundedGrid''s getOccupiedLocations method returns the
    list of locations in a predictable order, scanning each row of the array from
    left to right starting at the top row (row 0). However, a lot of space is wasted,
    and the getOccupiedLocations method may become slow in a BoundedGrid if the grid
    is large and its population is sparse. In a sparsely-populated UnboundedGrid,
    the getOccupiedLocations method is more efficient. On the other hand, it returns
    the list of locations arranged in an unpredictable order, which may be of concern
    in some applications.


    The Part 5 exercises in the case study (p. 38) discuss some alternative implementations
    of an unbounded grid. Make sure you understand these implementations well, with
    special emphasis on the time and space complexity (Big-Oh).


    ![](img/e320d34bf6b289b099c4a1d8b2b5ab9c_187_0.png)


    Suppose we replace a HashMap with a TreeMap in the UnboundedGrid class. What will
    be the average time complexity (Big-Oh) of the get, put, and getOccupiedLocations
    methods, in terms of the current number of occupants n?


    | get | put | getOccupiedLocations |

    |---|---|---|

    | (A) | O(1) | O(1) | O(n) |

    | (B) | O(1) | O(log n) | O(n) |

    | (C) | O(log n) | O(log n) | O(n) |

    | (D) | O(1) | O(n) | O(n) |

    | (E) | O(n) | O(n) | O(n*) |


    > This is just a review of TreeMap. The answer is C.


