  md: "# Recursive implementation of Binary Search\n\nThe description of the Binary\
    \ Search algorithm is recursive in nature, and it can be implemented recursively\
    \ with ease.\n\nConsider the following incomplete recursive implementation of\
    \ Binary Search:\n\n1\n\n```\n// returns the position of the element equal to\
    \ target or -1,\n// if target is not among the values a[left], ..., a[right]\n\
    // precondition: array contains values stored from a[left]\n// to a right), sorted\
    \ in ascending order\npublic int binarySearch(int a, int left, int right, int\
    \ target)\n{\n    int targetPos = -1;\n    int middle;\n\n    < statement 1>\n\
    \    middle = (left + right) / 2;\n    if (target == a[middle])\n        < statement\
    \ 2>\n    else if (target < a[middle])\n        targetPos = binarySearch(a, left,\
    \ middle - 1, target);\n    else\n        targetPos = binarySearch(a, middle +\
    \ 1, right, target);\n}\n\nreturn targetPos;\n```\n\nWhich of the following could\
    \ be used to replace <statement 1> and <statement 2> so that the binarySearch\
    \ method works as intended?\n\n| <statement 1> | <statement 2> |\n|---|---|\n\
    | (A) while (left <=) | return targetPos; |\n| (B) while (left <=) | return middle;\
    \ |\n| (C) while (left <) | targetPos = middle; |\n| (D) if (left <=) | targetPos\
    \ = middle; |\n| (E) if (left <) | return middle; |\n\nIn the choice between while\
    \ and if, this is a recursive solution and recursion replaces iterations. This\
    \ eliminates A, B, and C. In D and E choice works for Statement 2, Statement 1\
    \ in E misses the case when left == right. The answer is D."
