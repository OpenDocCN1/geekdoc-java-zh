  md: '# 5.6 ~ DATA ORGANIZATION QUESTIONS


    # 111


    Suppose Design 2 is chosen and that the following method is implemented efficiently
    as:


    Given a subject number between 1 and N and a day between 1 and K, the method returns
    true if the given subject is offered on the given day and false otherwise.


    Which of the following statements is true?


    +   (A) The average time spent in the method is proportional to N.

    (B) The average time spent in the method is proportional to K.

    (C) The average time spent in the method is proportional to the total number of
    exams in the array (N times),

    (D) The average time spent in the method is proportional to the average number
    of exams per day.

    (E) The time spent in the method does not depend on N or K, nor on the distribution
    of exams by day.


    > The above two questions compare space and time requirements for the same data
    represented as a list (Design 1) and as a lookup table (Design 2). You can answer
    these questions right away if you are familiar with lookup tables. In a lookup
    table, a data item (here a valid subject/day pair) is represented as an array.
    Lookup tables usually take more space but provide instantaneous (constant time)
    access to data regardless of the size of the table.


    If you''ve never heard the term lookup table, you can still figure it out.


    In Question 45 the space requirement for Design 1 is K+N integers: for each day
    (representing the number of exams for that day) and for each exam (each exam has
    to be listed under one of the days). The space requirement for Design 2 is K*Boolean
    values. In Java, an integer takes four bytes, regardless of the particular platform.
    A Boolean may vary, but even if it takes only one byte, 4(K+N) < N*K for large
    enough N and K (recall that N≥34, K≥14). The answer is A.


    In Question 46, you must know that you can go directly to any element of an array,
    table[i]. This property is called random access and it''s what arrays are all
    about. The n-th subject is offered on the k-th day if table[(n-1)*K + (k-1)] is
    true. (Here, table should be a two-dimensional array, but these are not in the
    A subset.) The answer is E.'
