    The US Postal Service provides insurance for different types of mail. The cost
    of insurance depends only on the amount of insurance purchased by the sender and
    not on the particular type of mail. It would be too tedious to add the insurance
    option to each of the classes that represent different types of mail. Instead,
    we can create one "wrapper" class that will help us calculate the total cost,
    including insurance, for all kinds of mail pieces. InsuredMail is such a class.
    It is somewhat unusual because it both extends Mail and has an instance variable
    of the type Mail. InsuredMail''s constructor sets that instance variable to a
    Mail object, passed to the constructor as a parameter. The second parameter passed
    to the constructor is the amount of insurance (in dollars):


