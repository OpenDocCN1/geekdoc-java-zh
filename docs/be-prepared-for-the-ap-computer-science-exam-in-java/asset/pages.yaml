  md: '# 2.1 ~VARIABLES; ARITHMETIC, RELATIONAL, AND LOGICAL OPERATORS


    This question gives us a chance to review what we know about data types.


    A is false: symbolic constants are not so different from variables. The difference
    is that a constant declaration includes the keyword final. Class constants are
    often declared as static variables. For example:


    ```

    public static double final PI = 3.141592653589793;

    ```


    B is true. While real numbers are written in programs in decimal notation, a Java
    compiler converts them into a special floating-point format that takes eight bytes
    and is convenient for computations.


    C is false. The data type by itself does not determine where the variable is stored.
    Its location in memory is determined by where the variable is used and its allocation:
    whether it is a local variable in a method or an instance variable of a class.


    E is false, too. In Java, you can write a/b, while both a and b are of type int.
    The result is truncated to integer.


    D is true. Sometimes a parameter of a different type may be promoted to the type
    expected by the method (for example, an int can be promoted to double when you
    call, Math.sqrt(x) for an int x). But this is not always the case (for example,
    a double will not work in place of a String). The answer is D.


    # Arithmetic operators


    > The most important thing to remember about Java''s arithmetic operators is that
    the data type of the result, even each intermediate result, is the same as the
    data type of the operands. In particular, the result of division of one integer
    by another is truncated to an integer.


    For example:


    ```

    int n = 3;

    double result;

    result = (n + 1) * n / 2; // result is 6.0

    result = (n / 2) * (n + 1); // result is 4.0

    result = (1 / 2) * n * (n + 1); // result is 0.0

    ```'
