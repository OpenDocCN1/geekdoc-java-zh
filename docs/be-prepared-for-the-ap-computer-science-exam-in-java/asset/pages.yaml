  md: "# # Chapter 5. Algorithms\n\n# ## 5.1. Iterations\n\nMost programming languages\
    \ provide iteration control structures, such as the while for loops in Java. Simple\
    \ loops are good for iterating (repeating the same operation) over a range of\
    \ numbers or over the elements of a one-dimensional array or a linked list\n\n\
    A for loop is a convenient and idiomatic way to traverse a one-dimensional array:\n\
    \n```\nfor (int k = 0; k < a.length; k++)\n{\n    System.out.println(a[k]);  \
    \  // ... or whatever you need to do\n    // with each element\n}\n```\n\nor\n\
    \n```\nfor (T x : a)\n{\n    System.out.println(x);\n}\n```\n\nwhere T is the\
    \ data type of the elements of a.\n\n> For working with two-dimensional arrays\
    \ you usually need nested loops. The following code, traverses a two-dimensional\
    \ array m:\n\n```\nint r, c, nRows = m.length, nCols = m[0].length;\nfor (r =\
