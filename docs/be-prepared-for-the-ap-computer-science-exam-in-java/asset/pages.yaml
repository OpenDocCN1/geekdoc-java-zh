  md: '# 7.5~CRTERS 167


    A Bee is an actor that acts as follows. First the Bee makes all the Flowers in
    neighboring locations brighten their color. After that, the Bee moves to a randomly
    neighboring location that contains a Flower or, if no adjacent Flowers have been
    found, to a randomly picked empty neighboring location. If there is nowhere to
    move, the Bee stays in its current location. If the Bee moves onto a Flower, it
    saves that Flower and restores it when it moves away from that location. Which
    of the following is the best approach to implementing the Bee class?


    +   (A) Implement Bee as a subclass of Actor, overriding the act method

    (B) Implement Bee as a subclass of Bug, overriding the act and moveTo methods

    (C) Implement Bee as a subclass of Critter, overriding the act and moveTo methods

    (D) Implement Bee as a subclass of Critter, overriding the processActors, getMoveLocations
    and makeMove methods

    (E) Implement Bee as a subclass of Critter, overriding the getActors, processActors,
    getMoveLocations, selectMoveLocation, and makeMove methods


    A Bee does something to some other actors, so it falls into the general category
    of “critters.” It is course possible to derive Bee directly from Actor (Choice
    A), but with duplicate code, when Critter class already exists? It is also possible
    to derive Bee from Bug (Choice B), but that would damage the neat hierarchy of
    GridWorld. A Bug moves in a particular way, and it is better to leave it alone.
    We wouldn’t be able to use any of Bug’s code by deriving Bee from Bug.


    We are left with the three “critter” choices. Choice C is totally unacceptable:
    we never override Actor’s low-level moveTo, and we usually do not override Critter’s
    act method. The question remains: Will overriding processActors, getMoveLocations,
    and makeMove (Choice D) be sufficient to Bee’s functionality, or do we need to
    override all five of Critter’s service methods (Choice E)? Note that Critter’s
    getActors returns a list of all actors in neighboring locations, then processActors
    decides which one to “eat.” A Bee can work in a similar way: it can use Critter’s
    getActors and let its processActors test which of neighbors are Flowers and brighten
    their color.


    getMoveLocations can return a list of all neighboring Flowers, or if there are
    no flowers among the neighbors, return a list of all empty neighboring locations.
    No need to change Critter’s selectMoveLocation, which simply selects a random
    location from the list. Bee’s makeMove method can handle saving and/or restoring
    the Flower Bee “landed on”, if necessary, call super.makeMove () to move. Choice
    E is overkill. The answer is D.'
