    Option I is nonsense because Location objects are immutable; a Location does not
    have a setTo method. When an actor changes its location in the grid, it must inform
    the grid of the change, and possibly remove the current occupant of the new location.
    To emphasize that, the corresponding method is moveTo, not setLocation. The statements


    ```

    Location newLoc = new Location(loc.getRow() + 1, loc.getCol());

    andy.moveTo(newLoc);

    ```


    would work, but


    ```

    andy.moveTo(loc.getAdjacentLocation(Location.SOUTH));

    ```


    is better, because it is more abstract: it does not rely on the knowledge of compass
    directions to rows and columns in the grid. The answer is C.


