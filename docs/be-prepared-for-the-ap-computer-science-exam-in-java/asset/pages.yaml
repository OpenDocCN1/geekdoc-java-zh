  md: '# 1.5. Exam Taking Tips


    Some things are obvious:


    +   - If you took the time to read a multiple-choice question and all the answer
    choices decided to skip it, take an extra ten seconds. Most likely you have eliminated
    one or two wrong answers even without noticing.

    - If a common paragraph refers to a group of questions you took the time to read
    it, try each question in the group.

    - Do read the question before jumping to the code included in the question.


    There are a few important things to know about answering free-response questions.


    > > Remember that all free-response questions have equal weight. Don’t assume
    that the first question is the easiest and the last is the hardest.


    In a nutshell: be neat, straightforward, and professional; keep your exam reader
    in mind; don''t show off.


    More specifically:


    +   1. Stay within the AP Java subset.


    +   2. Remember that the elegance of your code does not count. More often than
    not, a brute-force approach is the best. You may waste a lot of time writing tricky,
    non-standard code and trick yourself in the process or mislead your exam reader
    who, after all, is only human. No one will test your code on a computer.


    +   3. Superior efficiency of your code does not count, unless the desired Big-Oh
    of the solution is specifically stated in the question.


    +   4. Remember that Parts (b) and (c) of a question are graded independently
    from the previous parts, and may actually be easier: Part (a) may ask you to write
    a method, while Part (b) or Part (c) may simply ask you to use it.


    It is common for method(s) specified in Part (a) to be called in subsequent parts.
    Do so, even if your Part (a) is incorrect or left blank. Do not re-implement code
    from earlier parts in later parts — you will waste valuable time and may lose
    points for doing so.'
  merge: -1
  pgno: 21
