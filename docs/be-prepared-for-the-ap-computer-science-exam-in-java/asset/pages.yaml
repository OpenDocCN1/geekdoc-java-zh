  md: '# Preface


    The AP exams in computer science test your understanding of basic concepts in
    computer science as well as your fluency in Java programming. There are two levels
    of the exam. The A-level exam covers roughly of a one-semester introductory course
    in computer science (CS-1). The AB-level exam covers a typical introductory course
    also covers a second course on data structures (CS-1 + CS-2). Chapter 1 in this
    book will help you decide which exam you should take.


    Exam questions are developed by The College Board''s AP CS Test Development Committee,
    and are put together by Educational Testing Service (ETS). In 2005, The College
    Board tested 34 courses in 20 disciplines, and 1,221,016 students took most up-to-date
    information on AP exams offered and participation statistics can be found on The
    College Board''s AP Central web site, http://apcentral.collegeboard.com.


    In the spring of 2004, the computer science exams used Java for the first time.
    At the same time, the AP CS program''s emphasis shifted from implementation of
    algorithms and coding to object-oriented software design and development. The
    2007 exam incorporated some features of Java 5.0 (a.k.a. Java 1.5) for the first
    time. Developing exams is a very big effort for the College Board; training teachers
    in a new programming language is another undertaking. So it is safe to say that
    Java is here to stay for a few years, as long as it remains a popular programming
    language in colleges and in industry.


    > Answers to exam questions written in a programming language other than Java
    will not receive credit.


    A working knowledge of Java is necessary but not sufficient for a good grade on
    the exam. First and foremost, you must understand the basic concepts of computer
    science, object-oriented programming (OOP), and some algorithms. The exam also
    includes standard data structures: lists, stacks, queues, trees, sets, maps, priority
    queues, hash tables, and Big-Oh analysis of algorithms.


    As for Java: you don''t know the whole language, just the subset described in
    The College Board''s Advanced Placement Course Description for Computer Science
    (available at http://www.collegeboard.com/student/testing/ap/sub_compsia.html).
    You must also be familiar with The College Board''s materials developed specifically
    for the AP exams: the GridWorld case study and, for the AB exam, ListNode and
    TreeNode classes.'
