  md: "# Chapter 6. AB Topics: Linked Lists, Stacks,\nQueues, Trees, etc.\n\nAll the\
    \ material in this chapter is needed only for the AB exam. \n\n# 6.1. Overview\n\
    \nA collection refers to a particular way of storing and using data. In Java it\
    \ is convenient to describe a collection as an interface; different classes that\
    \ implement interface provide different implementations of the collection.\n\n\
    > Starting with Java 5.0, java.util collections hold objects of a specific type.\n\
    \nJava developers call them generic collections or generics for short, because\
    \ the implementation is general enough to handle objects of any given type. Java\
    \ API documentation uses the letter E as the generic object type parameter for\
    \ the elements in a collection, and the letters K and V for the object types of\
    \ keys and maps.\n\n> Java collections cannot hold data of primitive types (such\
    \ as ints or doubles).\n\nTable 6-1 lists six kinds of collections you should\
    \ be familiar with. These include List<E>, Queue<E>, Set<E>, and Map<K, V> interfaces\
    \ and the Stack<E> class from the java.util package — only the AP subset of their\
    \ methods is required for the exam.\n\nFor the exam you should know the java.util\
    \ classes that implement the List<E>, Queue<E>, Set<E>, and Map<K, V> interfaces\
    \ as well as the concepts behind these implementations (arrays and linked lists,\
    \ binary search trees, hash tables and heaps). You should understand the differences\
    \ between different implementations, their efficiency, and their appropriate uses."
