    \ = ... < creates an empty list>\nitems.add(\"One\");\nitems.add(\"Two\");\nitems.add(\"\
    Three\");\nitems.add(\"Four\");\n\nfor (int i = 0; i < items.size(); i++) {\n\
    \    System.out.print(items.remove(i) + \" \");\n}\n\nSystem.out.println();\n\
    ```\n\n+   (A) An empty line\n(B) One Two Three Four\n(C) One Two Three\n(D) One\
    \ Three\n(E) IndexOfBoundsException\n\nOutOfBoundsException can't happen because\
    \ i is never negative and i < items.size() at each iteration. There must be output,\
    \ as \"One\" is printed if i = 0. The trick is that after the first iteration,\
    \ the indices are adjusted: \"Two\" becomes the item at 0, \"Three\" at 1, and\
    \ \"Four\" at 2, while i becomes 1. So the second output value is \"Three\". After\
    \ the second iteration, the size of the list becomes 2 and i becomes 2, so the\
    \ loop exited. The answer is D.\n\n# java.util.ArrayList<E>\n\nWe already reviewed\
    \ ArrayList in Section 2.6. Here we briefly look at it again in the context of\
    \ Java Collections framework.\n\nArrayList<E> implements the List<E> interface\
    \ using an array. This provides direct access to the list's elements, so the get\
    \ and set methods are efficient.\n\nArrayList's no-args constructor allocates\
    \ an array of some default initial capacity and sets the size to 0 (no values\
    \ stored in it). As values are added, their number may exceed the current capacity.\
    \ When the capacity is doubled, a new array is allocated, the old values are copied\
    \ into the new array, and the old array is discarded. All of this happens automatically\
    \ behind the scenes. Most of the time, the add() method, which adds an item at\
    \ the end, works efficiently, but once in a while, when the list runs out of space,\
    \ it may take more time for moving the values into a new array."
