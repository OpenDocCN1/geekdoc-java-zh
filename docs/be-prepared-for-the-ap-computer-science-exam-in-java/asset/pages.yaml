    \ considerations\n\nTable 7-2 lists the average time complexity for grid methods\
    \ in the BoundedGrid and UnboundedGrid implementations. In BoundedGrid the best,\
    \ average, and worst access times are the, and they don't depend on the number\
    \ of objects in the grid. The time complexity of isValid, get, put, and remove\
    \ are O(1). In UnboundedGrid the average time complexity of these methods is also\
    \ O(1). However, the worst-case running times of get, put, and remove are subject\
    \ to the variations typical for any hash table. For example, the put method may\
    \ require reallocating the table and rehashing elements. In its case, the Big-Oh\
    \ becomes O(n), but that does not happen often.\n\n| Method | BoundedGrid | UnboundedGrid\
    \ |\n|---|---|--|\n| isValid | O(1) | O(1) |\n| get | O(1) | O(1) |\n| put | O(1)\
    \ | O(1) |\n| remove | O(1) | O(1) |\n| getOccupiedLocations | O(rows * cols)\
