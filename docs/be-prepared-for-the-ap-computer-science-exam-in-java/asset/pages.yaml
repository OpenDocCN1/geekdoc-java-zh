  md: '# 40 CHAPTER 2 ~JAVA FEATURES, PART 1


    ArrayList provides methods for getting and setting the value of a particular element,
    adding a value at the end of the list, removing a value, and inserting a value
    at a given position. As in standard arrays, indices start from 0.


    An ArrayList is automatically resized when it runs out of space. ArrayList''s
    "no-args" constructor (that is, the constructor that takes no parameters) allocates
    an array of default initial capacity and size 0 (no values stored in it). As values
    are added, their number may exceed the current capacity. Then the capacity is
    doubled, a new array is allocated, the old values are copied into the new array,
    and the old array is discarded. All this happens behind scenes — you don''t have
    to worry about any of.


    The AP subset includes the following methods of ArrayList<E>:


    | size() | Returns the number of values currently stored in the list |

    | boolean add(E x) | Adds x at the end of the list; returns boolean |

    | E get(int index) | Returns the value stored at index |

    | E set(int index, E x) | Sets the value of the element at index to x; returns
    the old value |

    | E remove(int index) | Removes the value at index and shifts the subsequent values
    toward the beginning of the list; returns the value stored at index |

    | void add(int index, E x) | Inserts x at index, shifting the current value stored
    at index and all the subsequent values toward the end of the list |


    The add and remove methods adjust the size of the ArrayList appropriately. The
    methods that take an index parameter check that the index is in the valid range,
    from 0 to size() - 1 and "throw" IndexOutOfBoundsException if the index is not
    in that range.


    Since the compiler knows what type of objects are stored in an ArrayList, it automatically
    casts values retrieved from the list into their type. For example:


    ```

    ArrayList<Fish> list = new ArrayList<Fish>();

    Fish f = list.get(i);

    ```'
