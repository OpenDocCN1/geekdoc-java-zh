    # Aliasing


    A more complicated concept is aliasing. It is good to understand in general, but
    it is unlikely to come up on the exams. The following explanation is for a more
    inquisitive reader.


    Suppose we have a Point class that represents a point on a plane. Consider a method:


    ```

    // point2 receives coordinates of point1 rotated 90 degrees

    // counterclockwise around the origin

    public void rotate90(Point point1, Point point2)

    {

    point2.setY(point1.getX());

    point2.setX(-point1.getY());

    }

    ```


    In this example, rotate90 takes two Point objects as parameters. Like all objects,
    these are passed to the method as references. Note that a Point object here is
    not immutable because it has the setX and setY methods. The code looks pretty
    harmless: it sets point2 coordinates to the new values obtained from point1 coordinates.
    However, suppose you call rotate90(point, point) however changing the coordinates
    of point appropriately. The compiler will not prevent you from doing that, but
    the result will not be what you expected. Inside the method, point1 and point2
    actually refer to point. The first statement will set point''s y equal to x, and
    the original value of y will be lost. If point coordinates are, x = 3, y = 5,
    instead of getting x = -5, y = 3, as intended, you will get x = -3, y = 3. This
    type of error is called an aliasing error.'
