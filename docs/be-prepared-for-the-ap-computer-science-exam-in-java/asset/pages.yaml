    appends s2 to s1. In reality it creates a new string by concatenating s1 and s2
    and

    sets s1 to refer to it. It is equivalent to


    s1 = s1 + s2;


    What is the output of the following code segment?


    ```

    String str1 = "Happy ";

    String str2 = str1;

    str2 += "New Year !";

    str2.substring(6);

    System.out.println(str2);

    ```


    +   (A) Happy New Year!

    (B) Happy New Year!

    (C) Happy New Year New Year!

    (D) Happy New Year! Happy New Year!

    (E) Happy New Year! Happy Happy


    > After str2 = str1, and str2 point to the same memory location that

    contains "Happy ". But after str2 += "New Year! ", these variables point to

    different things; str1 remains "Happy " (strings are immutable) while str2 becomes

    "Happy New Year !". str2.substring(6) does not change str2 — it calls its

    substring does not use its returned value (a common beginner''s mistake: again,

    strings are immutable). The answer is B.


