  md: '# Heapsort


    Another application of heaps is Heapsort.


    > Heapsort is an $n \log n$ sorting method. Heapsort does not require a temporary
    array.


    Suppose we have a list of values. In the first phase of the Heapsort we can start
    with an empty heap and insert all the values from the list into it. In the second
    phase we remove the values one by one from the top of the heap and store them
    back into the list. We will end up with a list sorted in ascending order.


    If a list is stored in an array, there is an efficient algorithm that reorders
    its elements in the same space in such a way that the array becomes a representation
    of a heap (in this case, a “maximum” heap with the largest element in the root).
    We then remove the elements from the top of the heap and store them starting at
    the end of the same array in reverse order. This algorithm eliminates the need
    for an additional temporary array.


    ![](img/e320d34bf6b289b099c4a1d8b2b5ab9c_158_0.png)


    Suppose Heapsort is used to sort an array of nine elements in ascending order
    in the same place without using additional space. The first phase of the algorithm
    rearranges the elements of the array to form a maximum heap (with the largest
    value at the root). In the second phase the elements are removed by one from the
    top of the heap and placed in order starting at the end of the array. Suppose
    the following sequence represents a heap built after the first phase of Heapsort:


    9 6 8 3 4 7 5 2 1


    Which of the following sequences may represent the elements of the array after
    two iterations through the second phase of Heapsort?


    +   (A) 6 3 4 7 5 2 1 8 9

    (B) 7 5 1 2 6 3 4 8 9

    (C) 8 9 6 3 4 7 5 2 1

    (D) 9 6 8 5 4 7 1 2 3

    (E) 7 6 5 3 4 1 2 8 9'
