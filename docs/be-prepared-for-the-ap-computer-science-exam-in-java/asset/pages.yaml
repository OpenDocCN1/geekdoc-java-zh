  md: '# Bit-wise logical operators


    The bit-wise logical operators, &, |, ^ and ~, are not in the AP Java subset and
    are not tested on the AP exams. You don''t have to worry about them.


    Programmers use these operators to perform logical operations on individual bits,
    usually in int values. Unfortunately, Java also allows you to apply these operators
    to boolean values, and when used that, these operators do not comply with short-circuit
    evaluation. This may lead to a nasty bug if you inadvertently write & instead
    of && or instead of |. For example,


    ```

    if (x != 0 & y/x > 2)   Error: & instead

    of &&

