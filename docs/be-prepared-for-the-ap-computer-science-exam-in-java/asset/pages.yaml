  md: '# 6.6. Hashing


    Hashing is a method for storing information in which the value of an item (or
    the value of the key of an item) translates directly into its location in a hash
    table. Ideally, hashing provides instantaneous access to data (more precisely,
    the search time is constant regardless of the number of elements).


    A typical hash table is a one-dimensional array of fixed size. Some elements of
    the array contain stored information; others may be empty. A hash method is provided
    that translates the value of an element into an integer in the range from 0 to
    size-1, which serves as an index into the array.


    Hash tables are similar to lookup tables, but not quite the same. In a lookup
    table, the function that converts values into indices is always a one-to-one mapping,
    so each value is mapped onto a unique index into the table and can be found without
    any ambiguity.


    > In hash tables, different values can be mapped to the same location in the table
    (that is, the same index). These situations are collisions.


    Hash tables are used when lookup tables would take too much space to be practical.
    A good hashing method spreads the values uniformly in the table, minimizing the
    number of collisions. Still, some way to resolve collisions is needed.


    A common way to resolve collisions is by chaining, where each element of the hash
    table is not just one value, but a bucket, something with its own storage structure.
    For example, a bucket may be a list. Finding a value in a table involves computing
    the index for the bucket, finding the target value in the bucket. In a good hash
    the buckets remain small, containing a few elements, so a search within one bucket
    is short.


    The java.util.HashSet<E> and java.util.HashMap<K, V> classes use a hash table
    to implement Set<E> and Map<K, V>, respectively. These classes assume a reasonable
    hashCode method. In Java, the Object class has a generic hashCode method, so every
    object has this method. More specific types of objects (Strings, Integers, etc.)
    have their own hashCode methods defined. It is a good idea to appropriately redefine
    the generic hashCode method for your class. Usually this is accomplished by combining
    calls to hashCode for some of the data fields of the class. A hashCode method
    returns an integer from the whole range. That value is further mapped for a particular
    hash table to the range from 0 to size-1.'
