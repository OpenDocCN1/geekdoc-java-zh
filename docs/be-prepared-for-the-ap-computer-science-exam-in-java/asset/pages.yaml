    # 3.3. Random Numbers


    Random numbers simulate chance in computer programs. For example, if you want
    to simulate a roll of a die, you need to obtain a number from 1 to 6 (with any
    one of these values appearing with the same probability). "Random" are not truly
    random — their sequence is generated using a certain formula — but they are enough
    for many applications. Java provides a library class java.util package, which
    has methods for generating the "next" random integer or the "next" random double.
    These methods are not static — you need to create a Random object and first call
    its nextInt and nextDouble methods. nextInt() returns a double from 0 (inclusive)
    to 1 (exclusive). For example: random integer from 0 to n-1;


    ```

    private static Random generator = new Random();

    ...

    int numPoints = generator.nextInt(6) + 1;

    // sets numPoints to a random number from 1 to 6

    double xCoord = generator.nextDouble(); // sets xCoord and yCoord

    double yCoord = generator.nextDouble(); // to random numbers

    // 0 < xCoord < 1; 0 < yCoord < 1

    ```


    nextInt and nextDouble are not static in Random but rather depend on a particular
    instance of Random.


    If you create a Random object using Random''s no-args constructor, it starts a
    unique sequence of random numbers. The random number generator uses an initial
    value, called "seed," as a starting point. The no-args constructor seeds the generator
    with a value that is likely to produce a unique sequence of random numbers. (Random
    has another constructor that takes the seed as a parameter, but this constructor
    is not in the AP subset.)'
