    (E) Derive Butterfly from ChameleonCritter and redefine the getActors methods.\n\
    \nSince a Butterfly acts in a manner similar to a ChameleonCritter, it has sense\
    \ to derive the Butterfly class from ChameleonCritter. Butterfly can override\
    \ ChameleonCritter’s getActors method to include only Flowers in the returned\
    \ list. Alternatively, Butterfly can override ChameleonCritter’s processActors\
    \ method to select a random number only among Flowers. There is no need to override\
    \ both, though. The answer is D.\n\n# 7.6. AB Topic: Grid Implementations\n\n\
    All the material in this section is needed only for the AB exam. \n\nPart 5 of\
    \ the case study discusses two implementations of the grid: BoundedGrid<E> class\
    \ implements Grid<E> as a two-dimensional array of objects of type E; the UnboundedGrid<E>\
    \ class implements Grid<E> as a HashMap<Location, E>.\n\nEach implementation has\
    \ its advantages and disadvantages. In the bounded grid, we can go directly to\
    \ the object at a given location and it is easy to find neighbors of a location.\
    \ On the other hand, an unbounded grid can be as large as you want, no memory\
    \ is wasted for empty locations, and putting all its objects into a list is more\
    \ efficient because you don’t need to scan through all the rows and columns."
