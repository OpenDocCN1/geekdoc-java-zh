  md: '# Autoboxing


    Starting with Java 5.0, the compiler in certain situations automatically converts
    values of primitive data types, (int, double, etc.) into the corresponding wrapper
    types (Integer, Double, etc.). This feature is called autoboxing (or autowrapping).
    For example, in


    ```

    ArrayList<Integer> numbers = new ArrayList<Integer>();

    numbers.add(5);

    ```


    the second line is compiled as


    ```

    numbers.add(new Integer(5));

    ```


    Likewise, where appropriate, the compiler performs autoboxing. For example,


    ```

    int num = numbers.get(0);

    ```


    in effect compiles as


    ```

    int num = numbers.get(0).intValue();

    ```


    > Autoboxing and autoboxing are not in the AP subset, but you won''t be penalized
    for relying on them.


    # 2.5. Arrays


    There are two ways to declare and create a one-dimensional array:


    ```

    someType a = new someType[ size ];

    someType[] b = { value0, value1, ..., value_n-1};

    ```


    For example:


    ```

    double[] samples = new double[100];

    int[] numbers = {1, 2, 3};

    String[] cities = {"Atlanta", "Boston", "Cincinnati", "Dallas"};

    ```


    The first declaration declares an array of doubles of size 100. Its elements get
    values (zeroes), but this fact is not in the AP subset. The second declaration
    creates an array of ints of size 3 with its elements initialized to 1, 2, and
    3. The third declaration declares and initializes an array of four given strings.'
