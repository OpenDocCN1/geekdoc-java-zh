    \   UnboundedGrid<E>\n```\n\n**Figure 7-4. The Grid interface and its implementations.\n\
    \nAbstractGrid implements the four \"local neighborhood\" Grid methods — getValidAdjacentLocations,\
    \ getEmptyAdjacentLocations, getOccupiedAdjacentLocations, and getNeighbors using\
    \ the \"general\" grid methods, such as isValid and get. For example:\n\n```\n\
    public ArrayList<Location> getValidAdjacentLocations(Location loc)\n{\n    ArrayList<Location>\
    \ locs = new ArrayList<Location>();\n    int d = Location.NORTH;\n    for (int\
    \ i = 0; i < Location.FULL_CIRCLE / Location.HALF_RIGHT; i++) {\n        Location\
    \ neighborLoc = loc.getAdjacentLocation(d);\n        if (isValid(neighborLoc))\
    \ {\n            locs.add(neighborLoc);\n            d = d + Location.HALF_RIGHT;\n\
    \        }\n    }\n    return locs;\n}\n```\n\nA streamlined version of this would\
    \ be:\n\n```\npublic ArrayList<Location> getValidAdjacentLocations(Location loc)\n\
    {\n    ArrayList<Location> locs = new ArrayList<Location>();\n    for (int d =\
    \ 0; d < 360; d += 45) {\n        Location neighborLoc = loc.getAdjacentLocation(d);\n\
    \        if (isValid(neighborLoc)) {\n            locs.add(neighborLoc);\n   \
    \     }\n    }\n    return locs;\n}\n```"
