  md: '# Chapter 4. Program Design and OOP Concepts


    # 4.1. Computer Systems


    You are probably aware by now that a typical computer system''s hardware has at
    least one processor, (a.k.a. CPU), some RAM (random-access memory), secondary
    storage devices (such as magnetic disks, CD-ROM drives, floppy disk drives, etc.)
    and peripherals (modems, printers, sound cards and speakers, mice or other pointing
    devices, etc.).


    Chances are you also have worked with an operating system, a piece of software
    that controls the computer system and interacts with a user. Linux, Windows XP,
    and OS X, are examples of operating systems. A compiler is also a piece of software.
    It checks syntax in programs written in a high-level programming language and
    translates them into code. In Java, a compiler translates the source code (program
    text) into machine-independent bytecode—instructions for the Java Virtual Machine.
    The virtual machine acts as a run-time interpreter that reads and executes the
    appropriate instructions on a particular computer. A debugger is a program that
    helps you run and test your program in a controlled way and find errors (“bugs”)
    in it. The editor, compiler, interpreter, debugger, and other software development
    tools may be combined in one package called an IDE (Integrated Development Environment),
    which has a GUI (Graphical User Interface).


    Issues of system reliability and security and the legal and ethical issues related
    to computer use are not precisely defined in the AP exam guidelines. Questions
    about these topics would have to be rather general.


    # 4.2. Program Design and Development Methodology


    Computer science tries to emphasize problem solving, as opposed to just programming
    in a particular language or using specific hardware platforms. The exam topics
    related to general software design and development methodology emphasize procedural
    and functional decomposition, and the reusability of code. These topics are discussed
    in the context of object-oriented design and development. Here is a very brief
    glossary of the relevant terms:


    Specifications — a detailed description of what a piece of software should accomplish
    and how it should behave and interact with the user. Specifications may be given
    for a whole system, one module, or even one class or method.'
