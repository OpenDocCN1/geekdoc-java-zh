  md: '# ## Chapter 7. GridWorld Case Study


    # ### 7.1. Introduction


    The GridWorld case study is a teaching and testing tool developed specifically
    for the AP Computer Science program. In the past, exams have had five to six multiple-choice
    questions and one free-response question on the case study.


    The case study involves a fairly large program that manipulates various “critters”
    in a two-dimensional grid. The case study materials include a narrative (40 pages
    plus appendices); Java source code and class libraries; and javadoc documentation.
    All these materials are posted at the AP Central web site (A Guide to AP Central
    at http://www.skylit.com). Parts 1 through 4 of the case study narrative are required
    for the AB exam. In addition, Part 5 is required for the AB exam.


    The best way to prepare for the exam questions on the case study is to have the
    case study integrated into your course so you can work on your course the case
    study code and exercises as you go along. This chapter will help you review what
    you have learned. If you did not have the opportunity to work on the case study
    in your course, you can still answer case study questions successfully after studying
    the case study narrative, the required code, and this review.


    +   * By setting up the GridWorld project and running the BugRunner program, as
    described in Part 1 of the GridWorld narrative.


    The case study code includes Java files with main (such as BugRunner.java — the
    first project — or BoxRunner.java, CritterRunner.java, or CrabRunner.java) and
    the library file gridworld.jar. GridWorld projects are set up in the same manner
    as any other project in IDE.


    Figure 7-1 shows the “big picture” of the case study classes and interfaces. The
    code is organized into four packages: gui, world, actor, and grid. Of these four
    you are responsible for only two, actor and grid, and even these two you need
    to know to a limited extent.


    +   * You are not required to know what a package is or how the GridWorld classes
    are split into packages. However, to get projects to compile, you''ll need to
    import classes from the correct packages.'
