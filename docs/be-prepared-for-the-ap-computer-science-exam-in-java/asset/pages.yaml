  md: '# 6 CHAPTER 1 ~ EXAM FORMAT, GRADING, AND TIPS


    For multiple-choice questions, one point is given for each correct answer and
    1/4 point subtracted for each wrong answer. Free-response questions are graded
    by a group of high school teachers and college professors. Scores are based on
    a rubric established by the Chief Reader, Exam Leader, and Question Leaders. Each
    free-response question is graded out of 9 points, with partial credit given according
    to the rubric.


    The final score is obtained by adding the MC and FR weighted scores. The MC and
    FR coefficients are chosen in such a way that they give equal weights to the multiple-choice
    and free-response sections of the exam. For example, if the exam has 40 multiple-choice
    questions and 4 free-response questions, weights of 1.25 for multiple-choice and
    1.3889 for free-response will give each section a maximum of 50, for a maximum
    possible score of 100.


    Four cut-offs determine the grade. Table 1-2 shows the maximum composite scores
    and cut-off points used for the 1999 and 2004 exams. In 2004, 79% or more correct
    answers on the AB and 68% or more correct answers on the AB would get you a 5.
    The cut-off points are determined by the Chief Reader and may vary slightly from
    year to year based on the score distributions and close examination of a sample
    of individuals.


    | A Max composite score 80 (1.00 * MC + 1.1111 * FR) | AB Max composite score
    100 (1.25 * MC + 1.3889 * FR) |

    |---|---|---|---||

    | Grade | 1999 | 2004 | 1999 | 2004 |

    | 5 | 60 - 80 | 63 - 80 | 70 - 100 | 68 - 10 |

    | 4 | 45 - 59 | 49 - 62 | 60 - 69 | 56 - 67 |

    | 3 | 33 - 44 | 39 - 48 | 41 - 59 | 44 - 55 |

    | 2 | 25 - 32 | 32 - 38 | 31 - 40 | 35 - 43 |

    | 1 | 0 - 24 | 0 - 31 | 0 - 30 | 0 - 34 |


    Table 1-2. Score-to-grade conversion


    # 1.4. AB or OR?


    Table 1-1 shows that a larger percentage of AB exam takers got a 5. That''s how
    it should be — if you don''t know that you can get a 4 or 5 on the AB exam, you
    don''t need to take it. If you haven''t covered all the AB material or are not
    comfortable with it, take the A exam. It makes sense to get a 2 or 1 on the AB
    exam if you could get a 5 or 4 on the A exam. The practice exams in this book
    will help you make up your mind.'
