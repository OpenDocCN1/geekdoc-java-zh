    # 5.5. Mergesort [and Quicksort]


    Mergesort and Quicksort are two recursive sorting algorithms based on the "divide
    and conquer" principle. Both algorithms take, on average, $n \log n$ comparisons,
    as opposed to $n^2$ comparisons in quadratic sorts. This difference can be very
    significant for large arrays. For example, for 1024 elements, Mergesort and Quicksort
    may run 100 times faster than Selection Sort and Insertion Sort.


    # Mergesort


    The idea of Mergesort is simple: divide the array into two approximately equal
    halves; sort (recursively) each half, then merge them together into one sorted
    array (Figure 5-2). Mergesort usually requires a temporary array for holding the
    two sorted halves before they are merged back into the original space.


    Split the array into two halves:


    ```

    A: 1 7 4 9:3 5 8 6 2

    ```


    Sort each half (recursively) and copy into temp:


    ```

    temp: 1 4 7 9:2 3 5 6 8

    ```


    Merge elements in ascending order from the two halves back into the array:


    ```

    temp: 1 4 7 9:2 3 5 6 8

    A: 1 2 3

    ```


    ![](img/e320d34bf6b289b099c4a1d8b2b5ab9c_118_0.png)


    Figure 5-2. Mergesort'
