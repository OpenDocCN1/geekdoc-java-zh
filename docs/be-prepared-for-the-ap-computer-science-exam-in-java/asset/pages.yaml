  md: '# Chapter 3. Java Features, Part 2


    # 3.1. Classes


    A Java program consists of classes. The term class refers to a class of objects.


    You should know the following concepts and terms:


    +   * class private and public fields and methods

    * object encapsulation and information hiding

    * instance of a class client of a class

    * constructor accessor

    * new operator modifier static methods

    * garbage collection public static final fields (constants)

    * instance variable or field



    An object that belongs to a particular class is also called an instance of that
    class, and the process of creating an object is called instantiation.


    A class definition includes constructors, methods, and data fields. The constructors
    describe how objects of the class can be created; the methods describe what an
    object of this class can do; the data fields (a.k.a. instance variables or simply
    fields) describe the object''s attributes — the current state of an object.


    # Constructors


    Constructors describe ways to create an object of a class and initialize the object''s
    instance variables.


    > All constructors have the same name as the class. Constructors do not have any
    return data type, not even void.


    A constructor may take parameters that help define a new object. A constructor
    that takes no parameters is called a "no-args" constructor.


    > The term parameter is often interchangeable with the term argument (as in function
    argument in math), especially when it refers to the actual values passed to a
    constructor or method.'
