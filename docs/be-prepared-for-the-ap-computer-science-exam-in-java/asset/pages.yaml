  md: '5. Bits of “good thinking” count. You may not know the whole solution, but
    if you have read and understood the question, go ahead and write fragments of
    code that may earn you partial credit points. But don’t spend too much time improvising
    incorrect code.


    6. Don''t waste your time erasing large portions of work. Instead, cross out your
    work with one neat line, but only after you have something to replace it with.
    Do not cross out a solution if you have no time to redo it, even if it is wrong.
    You won''t be penalized for incorrect code and get partial credit for it. Exam
    readers are instructed not to read any code that you have crossed out. But if
    you wrote two solutions, be sure to cross one out: otherwise the first one on
    the page will be graded.


    7. Read the comment about the method header quickly — it usually rest the task
    in a more formal way and sometimes gives hints. Assume that all preconditions
    are satisfied — don’t unnecessary checks to your code.


    8. One common mistake is to forget a return statement in a non-void method. Make
    sure the returned value matches the specified type.


    9. Do not ignore any hints in the question description. If an algorithm is suggested
    for a method (as “you may use the following algorithm”), don’t fight it, just
    do it! If the description says “you may use a helper method,” be sure to write
    and use one: chances are it is much more difficult to come up with a solution
    without a helper method.


    10. Remember that the exam readers grade a vast number of exams in quick succession
    during a marathon grading session every June. Write as neatly as possible. Space
    out your code (don’t save paper).


    11. Always indent your code properly. This helps you and your exam reader. If
    you miss a brace but your code is properly indented, the reader (as opposed to
    a Java compiler) may accept it. Similarly, if you put each statement on a separate
    line, a forgotten semicolon may not be held against you.


    12. Follow the Java naming style: the names of all methods, variables, and parameters
    start with a lowercase letter. Use meaningful, but not verbose, names for variables.
    count may be better than a; sum may be better than temp; row, col may be better
    than i, j. k is better than loopControlVariable. If the question contains examples
    of code with names, use the same names for appropriate.'
