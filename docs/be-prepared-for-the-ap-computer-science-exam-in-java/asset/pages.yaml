  md: '# 4.3 ~ INHERITANCE


    These are very general concepts, and it is not easy to come up with multiple-choice
    or free-response questions that test in-depth understanding of these concepts.
    In past exams, design and implementation questions have been limited to specific
    data structures and algorithms, which sometimes used these terms in their descriptions.
    An exam may include a free-response "design" question that asks you to design
    a small class, then use some of its features (see Section 4.7).


    # 4.3. Inheritance


    Inheritance allows a programmer to state that one class extends another class,
    inheriting its features. In Java terminology, a subclass extends a superclass.
    extends is a Java reserved word. For example:


    ![](img/e320d34bf6b289b099c4a1d8b2b5ab9c_80_0.png)


    Inheritance implements the IS-A relationship between objects: an object of a subclass
    type IS-A (is also an object of the superclass). A high school is a kind of school.
    A HighSchool object IS-A (kind of) School object. Technically this means that
    in your program you can use an object of a subclass whenever an object of its
    superclass is expected. For example:


    ```

    School sch = new HighSchool(...);

    ```


    If a constructor or a method in a class extends a School type of parameter to
    be passed to it, you can call it with a HighSchool type of argument. Objects of
    a subclass inherit the data type of the superclass.


    In Java, a class can directly extend only one superclass — there is no multiple
    inheritance for classes. But more than one subclass can be derived from the same
    superclass:


    ```

    public class HighSchool extends School ...

    public class ElementarySchool extends School ...

    public class DrivingSchool extends School ...

    ```


    The IS-A relationship of inheritance is not to be confused with the HAS-A relationship
    between objects. That X has "a" simply means that Y is a data field (instance
    variable) in X. For example, you might say that a HighSchool HAS-A MarchingBand,
    but not a HighSchool IS-A MarchingBand.'
