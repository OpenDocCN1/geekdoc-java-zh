  md: '# 4.7. “Design” Question


    The free-response section of the exam may include a “design” question. This type
    of question asks you to design but not implement a simple class that represents
    a given situation or model. This is the “design” part of the question. Other parts
    may ask you to implement a method or constructor or to write some code of a client
    class that uses some constructors or methods from the class you designed.


    > > Note that you are not asked to implement your class in the design part, only
    to design it. It would be a huge waste of time to write code for your class if
    you are not asked to do so.


    Designing a class means specifying its constructors and their parameters, public
    (and possibly private) methods, and fields (public static constants and private
    instance variables).


    > > In the context of the AP exams, all instance variables should be declared
    private.


    In writing the design part, pay special attention to the following:


    +   - Use reasonable and consistent style with proper indentation and generous
    spacing between statements.

    - Do not include comments or preconditions — they are not required.

    - Choosing meaningful names for your class, its methods and their parameters,
    and fields and local variables. Following the same naming style as shown in the
    other parts of the exam: a class name starts with an uppercase letter; the names
    of all methods, parameters, and instance variables start with a lowercase letter.
    Make sure that all constructors have the same name as the class.

    - Make all instance variables private and group them together at the top of the
    class.

    - Put all constructors and public methods first. Make all methods public, unless
    there is a specific hint in the question that some of are “helper” methods used
    inside this class — then make private.

    - In addition to specified constructors, it may be a good idea to provide a no-args
    constructor that takes arguments.

    - Specify appropriate return types for all methods. Recall that constructors do
    not have a return type, not even void.'
