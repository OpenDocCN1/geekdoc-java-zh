  md: "# 5.2 SEQUENTIAL SEARCH AND BINARY SEARCH\n\nStatement I is not an invariant\
    \ because it varies; k may or not be a prime as we iterate through the loop. More\
    \ precisely, k is a prime before the first iteration (k = 2) and before the second\
    \ iteration (k = 3), but not after it (k=4). This eliminates A and D. Statement\
    \ II is not an invariant for a different reason. Certainly 41 is a prime — so\
    \ are 37, 43, 47, and an infinite number of other integers. Also, Washington,\
    \ DC, is the capital of the United States. These facts, do not help us about the\
    \ purpose or correctness of the above code. But Statement III is a typical invariant:\
    \ it links the values of the variables count and k reflects the purpose of the\
    \ loop, namely counting all the primes from 2 to n. The answer is C.\n\n# 5.2.\
    \ Sequential Search and Binary Search\n\nA typical application of a simple loop\
    \ is Sequential Search:\n\n```\n// returns pos such that <= < n and a[pos] ==\
    \ target,\n// -1 if target is not among a[0], ..., a[n-1]\n// precondition: array\
    \ holds values a[0], ..., a[n-1]\npublic int sequentialSearch(int a, int n, int\
    \ target) {\n    for (int k = 0; k < n; k++) {\n        if (a[k] == target)\n\
    \            return k;\n    }\n    return -1;\n}\n```\n\nSequential Search works\
    \ for any array: the values in the array may be in random order. If an array is\
    \ sorted (that is, if its elements are arranged in ascending or descending order),\
    \ Binary Search is a much more efficient method.\n\nBinary Search is a “divide\
    \ and conquer” method for quickly finding a target value in a sorted array. Suppose\
    \ the array is sorted in ascending order. We take an element in the middle (or\
    \ approximately in the middle) of the array and compare it to the target. If they\
    \ are equal, we’re done. If the target is greater, we continue the search in the\
    \ right half of the array; if it’s smaller, we continue in the left half."
  merge: -1
