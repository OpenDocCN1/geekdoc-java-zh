  md: 'In the Critter class itself, the service methods getActors, processActors,

    getMoveLocations, selectMoveLocation, and makeMove are pretty simple:


    +   - getActors returns a list of all actors in neighboring locations of this
    critter;

    - processActors "eats" (removes from the grid) all actors from that list, except

    rocks and other critters;

    - getMoveLocations returns the list of all empty neighboring locations (including

    t ones emptied by processActors);

    - if the list returned by getMoveLocations is not empty, selectMoveLocation

    selects a random location from that list; otherwise it returns this Critter''s
    current

    location;

    - makeMove moves this Critter to the selected location by calling its moveTo

    method.


    > AP exam questions may ask you to reason about or write a subclass of

    Critter.


    A critter is an actor that first processes some actors, then moves. The case study

    narrative states: "It is usually not a good idea to override the act method in
    a Critter

    subclass.


    > Do not override the act method in Critter subclasses. Override one or

    more of the five service methods instead.


    Critter''s setup is very flexible, and you can implement many different behaviors
    by

    overriding one or more of the five service methods. You should always try to override
    as

    few of these methods as possible. You should also call the superclass''s methods,
    where

    appropriate, to avoid duplicating code. Critter''s act method will call the correct

    service method(s) of a Critter''s subclass due to polymorphism.'
