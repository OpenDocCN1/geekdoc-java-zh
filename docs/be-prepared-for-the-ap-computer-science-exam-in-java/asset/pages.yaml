  md: '# Quicksort


    Quicksort is a little less obvious and it is not required for the A exam.


    It works as follows. Choose a “pivot” element. Rearrange all the elements of the
    array so that the pivot divides the array into two parts. All the elements to
    the left of the pivot should be less than or equal to the pivot. All the elements
    to the right of the pivot should be greater than or equal to the pivot. Sort (recursively)
    each part.


    Quicksort does not require temporary storage. On average, it runs a bit faster
    than Mergesort, but it is less predictable. You have be lucky when you choose
    a pivot; hopefully its value be close to the median value for the array, so that
    the pivot divides the array into two roughly equal halves.


    # Suppose the method


    ```

    public void quickSort(int[] a, int k, int m) { ... }

    ```


    implements the recursive quick algorithm that sorts the elements a[k], ..., a[m]
    in ascending order. It is implemented in such a way that a[k] serves as the pivot
    element. Which of the following ordering properties of the array with 1000 elements
    results in the best running time for quickSort(a, 0, 999)?


    +   (A) When a[0], ..., a[999] are already sorted in ascending order

    (B) When a[0], ..., a[999] are sorted in descending order

    (C) When a[0] is the median of [0, ..., a[999] and the rest of the 999 elements
    are sorted in ascending order

    (D) When a[999] is the median of [0, ..., a[999] and the rest of the 999 elements
    are sorted in ascending order

    (E) When a[0], ..., a[999] are arranged in random order


    Quicksort is a recursive algorithm, which means that the method will be called
    many times for different segments of the array. For it to run efficiently, the
    pivot element in these must be pretty close to the median value of the segment.
    When the array is already sorted, as in A and B, the first element, is chosen
    as pivot, is as far from the median as possible. In such situations the pivot
    does not split the array into two or less equal halves; it just splits away one
    element. These are the worst cases for quick. In C and D the first element is
    median, this applies only at the top level of recursion. As we proceed deeper
    with recursive calls, the smaller segments become sorted and we face the same
    problem as in A and B. The random arrangement ensures that the first element will
    be somewhat close to the median with some frequency and quickSort will work as
    intended. The answer is E.'
