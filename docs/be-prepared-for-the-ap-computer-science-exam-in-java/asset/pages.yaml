    algorithm is implemented in an optimal way and lets the average Big-Oh performance.
    There may be best-case and worst-case scenarios Big-Oh is different. Table 6-3
    shows the average, best, and worst cases for common algorithms. The worst case,
    in assumes that the algorithm is running on the set of data that takes the longest
    time to process.


    There are also rules of thumb, you have to use them with caution.


    +   * If an algorithm uses a single loop, it''s either $O(n)$ for straightforward
    sequential processing or $O(\log n)$ for divide and conquer methods.

    * If an algorithm uses nested loops, it''s either $O(n^2)$ for straightforward
    sequential iterations over a square or $O(n \log n)$ for an algorithm with a divide
    and conquer component. The only “n \log n” algorithms that are specifically named
    in the AP program are Mergesort, Quicksort, and Heapsort.


    | Big-Oh | Algorithm |

    | $O(1)$ — "constant" | * Appending an element at the end of an array

    * Appending a node at the head of a linked list or the tail of a doubly-linked
    list

    * Push and pop operations for a stack

    * Add and remove operations for a queue

    * Retrieval/insertion in a hash table |

    | $O(\log n)$ — “logarithmic” | * Binary Search in a sorted array

    * Search and insertion in a binary search tree

    * Retrieval/insertion in a heap |

    | $O(n)$ — “linear” | * Sequential Search in an array

    * Traversals of lists or trees with $n$ nodes

    * Calculating sums or products of $n$ elements, as in $n$ |

    | $O(n \log n)$ — “n-log-n” | * Mergesort

    * Quicksort

    * Heapsort |

    | $O(n^2)$ — “quadratic” | * Selection Sort and Insertion Sort

    * Traversals of $n$-by-$n$ 2-D arrays

    * Algorithms that take “triangular” nested loops |


    Table 6-2. Big-Oh examples for common algorithms'
