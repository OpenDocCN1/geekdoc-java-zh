  md: "# 6.7. Priority Queues, Heaps, and Heapsort\n\nA priority queue is a storage\
    \ structure that allows you to retrieve items in order of their priority or rank.\
    \ A priority queue is controlled by two operations: *add* an item and *remove*\
    \ removes and returns the highest-priority item. Priority queues are used for\
    \ processing events (messages, orders) in order of their priority. A priority\
    \ queue can hold several items of the same priority.\n\nThe `java.util.PriorityQueue<E>`\
    \ class implements the `Queue<E>` interface, so the names of the methods for adding\
    \ and retrieving values are the same as a regular queue:\n\n```\nboolean isNotEmpty();\
    \          // Returns true if this queue is empty;\n                         \
    \    // otherwise returns false\nboolean add(E x);         // Adds x to this queue;\n\
    \                             // returns true if successful\nE remove();     \
    \          // Removes and returns the firat\n                             // (that\
    \ is the highest-priority) item\n                             // from this queue\n\
    E peek();                 // Returns the highest-priority item\n             \
    \                // without removing it from the queue\n```\n\n> However, the\
    \ values are retrieved from a priority queue not in in order of their arrival\
    \ but in order of their priority.\n\nThe `PriorityQueue<E>` class assumes that\
    \ a priority queue holds Comparable<E> objects (otherwise a comparator must be\
    \ provided to the constructor as a parameter — not in the AP subset). By convention,\
    \ the highest-priority value is the smallest. If two values have the same priority,\
    \ the tie is broken arbitrarily.\n\nThe `PriorityQueue<E>` class implements a\
    \ priority queue as a heap.\n\n+   A heap is a binary tree with two additional\
    \ properties:\n1. Completeness — each level, except possibly the bottom one, is\
    \ filled with nodes. The last level may have nodes missing on the right side.\n\
    2. Ordering — each node is smaller than or equal to all the nodes in its left\
    \ and right subtrees."
