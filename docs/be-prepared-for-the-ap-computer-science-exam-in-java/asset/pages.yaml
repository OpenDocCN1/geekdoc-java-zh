  md: "compareTo takes one parameter of the type T— and it is usually assumed that\
    \ the parameter belongs to the same class that implements Comparable<T>. For example:\n\
    \n```\npublic class Flight implements Comparable<Flight>\n    ...\n    public\
    \ int compareTo(Flight other)\n    {\n        return getDepartureTime() - other.getDepartureTime();\n\
    \    }\n```\n\nString, Integer, and Double all implement Comparable, but naturally\
    \ they do so in different ways. Strings are compared lexicographically. The comparison\
    \ is case-sensitive, and all uppercase letters precede all lowercase letters.\
    \ Integer and Double objects are compared as usual, based on their numeric values.\n\
    \nThe Comparable<T> interface does not specify an equals method, and a class that\
    \ implements Comparable<T> does not need an equals method to compile. But it is\
    \ better to override the equals method inherited from Object and make it consistent\
    \ with compareTo, to avoid possible errors later. For example:\n\n```\npublic\
    \ boolean equals(Object x)\n{\n    return x instanceof Flight && compareTo((Flight)x)\
    \ == 0;\n}\n```\n\nThe Boolean operator instanceof is not in the AP subset.\n\n\
    Note that the argument to your equals method should have the type Object, so that\
    \ your equals indeed overrides Object's equals. This is especially important if\
    \ you plan to store objects of your class in Java collections, such as HashSets."
