  md: "# 96 CHAPTER 5 ~ ALGORITHMS\n\nFor example:\n\n```\n// returns the position\
    \ of the element equal to target or -1 if target is\n// not in the array\n// precondition:\
    \ array contains n values sorted in ascending order\npublic int binarySearch(int[]\
    \ a, int n, int target)\n{\n    int left = 0;\n    int right = n - 1;\n    int\
    \ middle;\n\n    while (left <= right) {\n        middle = (left + right) / 2;\n\
    \        if (target == a[middle])\n            return middle;\n        } else\
    \ if (target < a[middle])\n            right = middle - 1; // Continue search\
    \ in the left half\n        else\n            left = middle + 1; // Continue search\
    \ in the right half\n    }\n    return -1;\n}\n```\n\nBinary Search in an array\
    \ of $2^k - 1$ elements requires at most $k$ iterations. In other words, Binary\
    \ Search in an array of $n$ elements requires $\\log n$ iterations. Thus in an\
    \ array of 1,000,000 elements it would need at most 20 iterations. By comparison,\
    \ Sequential Search in an array of $n$ elements takes, on average, $n/2$ iterations,\
    \ and in the worst case it may take $n$ iterations.\n\n35\n\nSuppose that two\
    \ programs, one using Binary Search and the other using Sequential Search, take\
    \ (on average) the same amount of time to find a random target value in a sorted\
    \ array of 30 elements. Roughly much faster than the Sequential Search program\
    \ will the Binary Search program run on an array of 1000 elements?\n\n+   (A)\
    \ 2 times faster\n(B) 10 times faster\n(C) 16 times faster\n(D) 33 times faster\n\
    (E) 50 times faster\n\nBinary Search takes 5 iterations for 30 elements ($32 =\
    \ 2^5$) and 10 iterations for elements ($1024=2^{10}$). So Binary Search will\
    \ run roughly two times longer on a 1000-element array than on a 30-element array.\
    \ Sequential search will run roughly 33 times longer ($1000 \\approx 30*33$).\
    \ On 1000 elements, Binary Search will be $33/2 = 16.5$ faster. The answer is\
    \ C."
