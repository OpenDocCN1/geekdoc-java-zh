  md: "A class can extend only one class, but it can implement several interfaces.\
    \ For example:\n\n```\npublic class Car extends Vehicle implements Fillable, Sellable\
    \ { ... }\n```\n\nEach interface adds a secondary data type to the objects of\
    \ the class it implements. If a class C implements interface I, objects of C can\
    \ be disguised as type I objects and polymorphism applies (the same way as subclasses).\
    \ For example, we can have a method:\n\n```\n// fills all objects in the array\
    \ a to capacity\npublic void setUp(Fillable a) {\n  for (Fillable f : a) {\n \
    \   f.fill(f.getMaximumCapacity() - f.getCurrentAmount());\n  }\n}\n```\n\nThe\
    \ formula works polymorphically for any types of different Fillable objects that\
    \ might be stored in the array a.\n\n> If C implements interface I, all subclasses\
    \ of C automatically implement I.\n\nInterfaces help us write more general methods,\
    \ facilitating code reuse.\n\n# The Comparable<T> interface\n\nThe library (built-in)\
    \ interface java.lang.Comparable<T> is widely used for designating objects that\
    \ can be compared in some way. We need to compare objects in order to arrange\
    \ them in order (sorting), perform a Binary Search, or implement certain data\
    \ structures such as Binary Search Trees. Objects of a class that implements Comparable\
    \ are said to have a natural ordering.\n\nStarting with Java 5.0, the Comparable<T>\
    \ interface is a \"generic\" interface, that is, it works with objects of a specific\
    \ type. The Comparable<T> interface specifies only one method:\n\n```\nint compareTo(T\
    \ other);\n```\n\nThe method returns a positive integer if this object is \"greater\"\
    \ than the other, zero if they are \"equal,\" and a negative integer if it is\
    \ \"less than\" the other (Sort of like minus other.). It is up to the programmer\
    \ to define what \"smaller\" and \"greater\" might mean when comparing objects\
    \ of his class and whether the value returned by compareTo has any meaning besides\
    \ telling which object is larger or smaller."
