    \ syntax allows the programmer to catch and process the exception and have the\
    \ program recover. This type of exception is called a checked exception.\n\nChecked\
    \ exceptions and the try-catch statements are not in the AP subset.\n\nOther errors,\
    \ such as an array index out of bounds or an attempt to call a method of a non-existing\
    \ object are considered fatal: the program displays an error message with information\
    \ about where the error occurred, then quits. This type of exception is called\
    \ an unchecked exception.\n\nIn Java, an exception is an object. The Java library\
    \ implements many types of exceptions, and if necessary you can derive your own\
    \ exception class from one of the library classes. For AP CS exams, as such integer\
    \ zero you would expect ArithmeticException, IndexOutOfBoundsException, NullPointerException,\
    \ IllegalArgumentException, and ClassCastException mean.\n\nWe say that a program\
    \ “throws” an exception. An ArithmeticException is thrown in case of an arithmetic\
    \ error, such as integer division by zero. (You would expect Math.sqrt(x) to throw\
    \ an ArithmeticException for a negative x, but it doesn't. Java exception handling\
    \ is inconsistent at times.)\n\nIndexOutOfBoundsException is self-explanatory:\
