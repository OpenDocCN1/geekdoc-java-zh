  md: '# # Chapter 1. Exam Format, Grading, and Tips


    # ## 1.1. Exam Format and Materials


    Figure 1-1 shows the format of the AP Computer Science exam. The exam takes 3
    hours of test time (plus breaks and for instructions). It is divided into two
    sections. Section I consists of 40 multiple-choice questions with a total allotted
    time of 1 hour and 15 minutes (1.5 to 2 minutes per question on average). Section
    II consists of four free-response questions with a total allotted time of 1 hour
    and 45 minutes (20-30 minutes per question). The free-response questions usually
    consist of two or three parts each. No computers, calculators, other devices,
    books, or materials are allowed.


    | Section I: Multiple Choice (40 questions) | 1 hr 15 min |

    | Section II: Free Response (4 questions) | 1 hr 45 min |

    | | 3 hours |


    **Figure 1-1.** AP Computer Science exam format


    Exam materials given to you at the exam will include a booklet containing the
    needed case study code and *Quick Reference* — a list of the library classes and
    their methods included in the AP subset as well as the `List` and `TreeNode` classes.
    These materials are provided for reference — it is expected that you will already
    be very familiar and comfortable with the case study and the required library
    classes before the exam. `http://www.skylit.com/beprepared/` has current links
    to these materials.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# 2 CHAPTER 1 ~ EXAM FORMAT, GRADING, AND TIPS


    The multiple-choice section is a mixture of questions related to general computer
    science terms, program design decisions, specific elements of Java syntax, properties
    of classes, logical analysis of fragments of Java code, OOP concepts, and five-six
    questions related to the case study. The AB exam also includes data structures:
    linked lists, stacks, queues, trees, sets, maps, priority queues, hash tables,
    heaps, etc., and “Big-Oh” analysis of algorithms.


    The free-response questions usually aim to cover a wide range of material: arrays,
    strings, classes and interfaces, Java library classes (within the AP subset),
    and so on. The AB exam may include questions on two-dimensional arrays, linked
    lists, trees, sets, maps, and other data structures. In past exams, students have
    not been asked to write complete programs. Usually, they were asked to write a
    constructor or a method that performs a specific task under a given header for
    the method. The second part of the question often refers to the class or method
    implemented in the first part, but each part is graded separately, and your implementation
    of Part (a) does not have to be correct in order for you to get full credit for
    Part (b). Part (c) may ask questions about your implementation or ask you to write
    an additional method that uses Parts (a) and/or (b). In that case you are to assume
    that the methods in the previous parts work as intended, regardless of what you
    wrote for.


    Free-response questions usually include a “design” question, in which you are
    asked to design a small class, then write it or some fragments of it or use in
    other parts of the question. Your design will be graded based on the appropriateness
    of the features of your class, appropriate names for methods and variables, and
    other criteria.


    One free-response question is based on the Case Study. It may ask you to extend
    a Case Study class and to write a new method or rewrite an existing method.


    # 1.2. The Java Subset


    The Development Committee has defined a restricted subset of Java to be tested
    on the exams. The purpose of the subset is to focus the AP CS program on general
    concepts than the specifics of Java and to limit the scope, especially material
    related to the peculiarities of Java. The subset is described in The College Board’s
    Advanced Placement Course Description for Computer Science; we have a link to
    this book’s website http://www.skylit.com/beprepared/. The AB “superset” also
    defines the ListNode and TreeNode classes (see Chapter 6).


    What is in the subset? Actually, quite bit.'
