  md: 'Such questions may test your reading comprehension skills, but in terms of
    real technical difficulty they don’t go too far beyond common sense. It certainly
    helps you have a good understanding of various data structures and how they use
    in different algorithms. Here, for example, we have to deal with finding an element
    with a given key (subscriber ID) in an array and inserting a new value into an
    array. The relevant ideas that come to mind are Sequential and Binary Search,
    inserting a value in order, and inserting at the end.


    You may want to jot down a little table in order not to get confused in the Methods
    and Operations; then check the appropriate boxes (what works faster):


    | A: random | B: sorted |

    |---|---|

    | 1. Increment # msgs — "find" | |

    | 2. Add a subsor — "insert" | ✓ |


    Clearly, if you need to worry about the order, adding a subscriber to a sorted
    array will take more work than just slamming him on the end of a random one. This
    alone eliminates choices B, C, and E. (Don’t try to be too smart, thinking that
    you may need to reallocate and copy the array if it is not large enough. That
    is not what this question is about)


    Is it easier to find a value in a sorted array? Of course. If you remember that
    you can use Binary Search on a sorted array, that’s great. But even if you don’t,
    this would be a good guess. The fact that the array is sorted probably can’t hurt
    the search operation. This eliminates A. The answer is D.'
