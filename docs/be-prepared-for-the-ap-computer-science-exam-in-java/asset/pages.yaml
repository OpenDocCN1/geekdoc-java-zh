    # 5.6. Data Organization Questions


    AP CS exams may contain multiple-choice questions on appropriate ways of representing
    data for specific tasks. Below are a few examples of such questions at the A level.
    AB takers have a much larger toolbox of standard data structures — lists, two-dimensional
    arrays, trees, hash tables, maps, etc. These are discussed in Chapter 6.


    Consider designing a data structure that represents information about subscribers
    in an e-mail server system. Among other attributes, a subscriber has an ID and
    a number of unread new messages. Information about all subscribers who have unread
    mail will be stored in an array of Subscriber objects. Two possible implementations
    are considered:


    +   - Method A: Store the array entries in arbitrary order.

    - Method B: Store the array in sorted order by subscriber ID.


    Consider the following operations:


    +   - Operation 1: Increment the number of messages for a subscriber with a specified
    ID.

    - Operation 2: Add a new subscriber with a given number of messages to the list
    of subscribers.


    Which of the following is true?


    +   (A) Both Operation 1 and Operation 2 can be implemented more efficiently using
    Method A than Method B.

    (B) Both Operation 1 and Operation 2 can be implemented more efficiently using
    Method B than Method A.

    (C) Operation 1 can be implemented more efficiently using Method A; Operation
    2 can be implemented more efficiently using Method B.

    (D) Operation 1 can be implemented more efficiently using Method B; Operation
    2 can be implemented more efficiently using Method A.

    (E) Operation 1 and Operation 2 can be implemented equally efficiently using either
    method.'
