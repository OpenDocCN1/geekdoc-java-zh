  md: "# 7.4. Bugs, Flowers, and Rocks\n\nThe classes Bug, Flower, and Rock are subclasses\
    \ of Actor.\n\nThe Rock is the simplest of the three. It has two constructors:\
    \ the no-args constructor creates a black rock, and the Rock(Color color) constructor\
    \ creates a rock of a given color. Rock's act method is empty — a rock just sits\
    \ there.\n\nThe Flower class is similar to Rock, but its default color is Color.PINK,\
    \ and its act darkens the color of the flower. You don't need to worry about the\
    \ implementation of this class — just remember how to call its constructors.\n\
    \nThe Bug class is more interesting. It has two constructors, similar to Rock's\
    \ constructors and Flower's constructors, but its default color is Color.RED.\
    \ A Bug has three methods: canMove, move, and turn. These methods are called from\
    \ Bug's act method which looks like this:\n\n```\npublic void act() {\n  if (canMove())\
    \ {\n    move();\n  } else {\n    turn();\n  }\n}\n```\n\nA Bug tries to move\
    \ forward in its current direction. A Bug can move if the new location is valid\
    \ and empty or contains a Flower:\n\n```\npublic boolean canMove() {\n  Grid<Actor>\
    \ gr = getGrid();\n  if (gr == null) {\n    return false;\n  }\n  Location loc\
