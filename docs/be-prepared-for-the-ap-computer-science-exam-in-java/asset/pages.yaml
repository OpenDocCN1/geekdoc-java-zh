    Strictly speaking, the parameter in Set<E>’s contains and remove methods is specified
    in Java API as Object, not E. We find this unfortunate and potentially dangerous,
    as these methods can throw a ClassCastException for TreeSet, if called with a
    parameter other than an instance of E. That’s why we use E instead of Object.


    > The elements of set are not indexed. An iterator, returned by the iterator method,
    traverses the elements in an order that depends on a particular implementation.


    A mathematical set holds unique values. However, what constitutes “unique” (not
    equal) values in Java is not a simple question: it also depends on the particular
    implementation. java.util offers two classes that implement Set<E>: TreeSet<E>,
    which uses a binary tree, and HashSet<E>, which uses a hash table. These data
    structures are discussed in details 6.5 and 6.6.


    In general, objects placed into a TreeSet are assumed to be Comparable, and TreeSet
    uses their compareTo method for comparing them (unless a comparator is provided
    to the TreeSet’s constructor, which is not in the AP subset). x is deemed to be
    “equal” to y and if x.compareTo(y) returns 0.


    +   An iterator returns the TreeSet’s values in ascending order.


    A HashSet does not assume that its elements are Comparable; it uses the hashCode
    method and the equals method to decide whether two objects are equal. So objects
    placed into a HashSet need to have a usable hashCode method.


    +   An iterator returns the HashSet’s values in no particular order.


