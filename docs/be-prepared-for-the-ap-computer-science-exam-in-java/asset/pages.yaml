  md: 'Recall that Math’s static method min returns the value of the smaller of two
    integers. If a, b, c, and m integer variables, which of the following best describes
    the behavior of a program with the following statement?


    ```

    m = Math.min(Math.min(a, c), Math.min(b, c));

    ```


    +   (A) The statement has a syntax error and will not compile.

    (B) The program will run go into an infinite loop.

    (C) a will get the smallest value of a and c; b will get the smallest value of
    b and c; m will get the smallest value of a, b, and c.

    (D) m will be assigned the smallest of the values a, b, and c.

    (E) None of the above


    Any expression of the appropriate data type, including a method call that returns
    a value of the appropriate data type, may be used in a larger expression or as
    an argument to a method. The code above is basically equivalent to:


    ```

    int temp1 = Math.min(a, c);

    int temp2 = Math.min(b, c);

    m = Math.min(temp1, temp2);

    ```


    So m gets the smallest of the three values. The answer is D.


