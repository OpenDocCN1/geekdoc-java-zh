  md: '# 7.3. The Actor Class


    The Actor class serves as a base class for a hierarchy of classes that represent
    different kinds of "bugs," "flowers," "rocks," "critters," and so on. Actor is
    not an abstract class, so you can create an object of this class. However, an
    object of type Actor is not a very interesting object: when asked to "act" it
    just turns around 180 degrees.


    An Actor object has four attributes: color, location, direction, and grid.


    +   An actor can belong to one and only one grid at a time; its grid attribute
    refers to that grid, or it is null if the actor is currently not in any grid.


    The Actor class has one constructor that takes no parameters. This constructor
    sets the actor''s color to Color.BLUE, the actor''s direction to 0 (Location.NORTH),
    and the actor''s location and grid to null.


    The Actor class has four accessors for these attributes and two modifiers:


