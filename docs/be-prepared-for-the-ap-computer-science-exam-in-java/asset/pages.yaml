    // Precondition: the actor is not in grid;

    // loc is a valid location in grid.

    ```


    ```

    public void removeFromGrid()

    // Removes this actor from its grid.

    // Precondition: the actor is in a grid.

    ```


    Actor''s moveTo method —


    ```

    public void moveTo(Location newLocation)

