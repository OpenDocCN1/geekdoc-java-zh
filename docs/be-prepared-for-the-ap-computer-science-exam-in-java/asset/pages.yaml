  md: '# 2.1 ~ VARIABLES; ARITHMETIC, RELATIONAL, AND LOGICAL OPERATORS


    # Modulo division


    The % (modulo division) operator usually applies to two integers: it calculates
    the remainder when the first operand is divided by the second.


    For example:


    ```

    int r;

    r = 17 % 3; // r is set to 2

    r = 8 % 2;  // r is set to 0

    r = 4 % 5;   // r is set to 4

    ```


    # Compound assignment, ++ and --


    Compound assignment operators are +=, -=, *=, /=, and %=. x += y is the same as
    x = x + y. Other operations follow the same pattern.


    There are two forms of the ++ and -- operators in Java. The prefix form increments
    (or decrements) the variable before its value is used in the rest of the expression;
    the postfix form increments (or decrements) it afterwards.


    > The AP Development Committee discourages the use of ++ and -- in expressions.
    Use ++ and -- only in separate statements.


    For example:


    ```

    while (i <= n) {

    sum += i++;

    i++

    } while (i <= n) {

    sum += i;

    i++

    }

    ```


    ![](img/e320d34bf6b289b099c4a1d8b2b5ab9c_28_0.png)


    You won''t lose points over ++ or -- in expressions if you use them correctly,
    but they won''t earn any credit, either.


    > It is bad style not to use increment or compound assignment operators where
    appropriate.'
