  ```\n\n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\black_star_logo.jpg](img/image063.jpg)\n\
  \n### Example 15.6\n\n```java\nimport java.io.*;\nclass RandomIO {\n    public static\
  \ void main(String args[]) throws IOException {\n        RandomAccessFile file =\
  \ null;\n        try {\n            file = new RandomAccessFile(\"rand.dat\", \"\
  rw\");\n            file.writeChar('X');\n            file.writeInt(1999);\n   \
  \         file.writeDouble(222.44);\n            System.out.println(\"File pointer\
  \ Pos:\"+file.getFilePointer());\n            file.seek(0);\n            System.out.println(file.readChar());\n\
  \            System.out.println(file.readInt());\n            System.out.println(file.readDouble());\n\
  \            System.out.println(\"File pointer Pos:\"+file.getFilePointer());\n\
  \            file.seek(2);\n            System.out.println(\"File pointer Pos:\"\
  +file.getFilePointer());\n            System.out.println(file.readInt());\n    \
  \        file.seek(file.length());\n            file.writeBoolean(false);\n    \
  \        file.seek(14);\n            System.out.println(file.readBoolean());\n \
  \           System.out.println(\"File pointer Pos:\"+file.getFilePointer());\n \
  \           System.out.println(file.readInt());//EOF Exption\n        } catch(EOFException\
  \ e) {\n            System.out.println(\"Trying to read after end of file\");\n\
  \        } finally {\n            file.close();\n        }\n    }\n}\n```\n\n**输出：**\n\
  ```text\nFile pointer Pos:14\nX\n1999\n222.44\nFile pointer Pos:14\nFile pointer\
