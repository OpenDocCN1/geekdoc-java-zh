  Child Thread: Thread[One,5,main]\nChild Thread: Thread[Two,5,main]\nOne: 1\nTwo:\
  \ 1\nOne: 2\nTwo: 2\nOne: 3\nTwo: 3\nOne: 4\nTwo: 4\nOne: 5\nTwo: 5\nSuspending\
  \ one\nOne: 6\nResuming one\nSuspending two\nTwo: 6\nTwo: 7\nTwo: 8\nTwo: 9\nTwo:\
  \ 10\nResuming two\nTwo: 11\nWaiting for threads to finish\nOne exiting\nTwo exiting\n\
  main exiting\n```\n\n# 章节\n# ∞ 13 ∞\n## (修饰符 / 可见性模式)\n\n## 引言\n\n修饰符是给编译器提供关于代码、数据、类或接口信息的关键字。例如，我们一直在使用可见性修饰符\
  \ `public`、`private`、`protected`、包权限 等来指定类成员的可见性。除了可见性，我们还使用了 `static`、`final` 和\
  \ `abstract` 修饰符。\n\n为了清晰理解，修饰符分类：\n\n1. 顶层类和接口的访问权限修饰符\n2. 类成员的访问权限/可见性\n3. 接口成员的访问权限/可见性\n\
  4. 顶层类的其他修饰符\n5. 顶层接口的其他修饰符\n6. 接口成员的其他修饰符\n7. 类成员的其他修饰符\n\n1. 顶层类和接口的访问权限修饰符：\n\
  \n* `public`\n* `default`（包）访问权限\n\n2. 类成员的访问权限/可见性：\n\n\n\n\n\n通过指定成员访问性修饰符，类可以控制哪些信息对客户端（即其他类）可见。这些修饰符帮助类定义一个约，使用户确切知道该类提供了哪些服务。\n\
  \n成员的访问性/可见性可以是以下之一：\n\n* `public`\n* `protected`\n* `default`（也称为包访问权限）\n* `private`\n\
  \n注意：成员访问性修饰符仅在类（或其任意一个子类）对客户端可见时才有意义。另外请注意，一个成员只能指定一个访问性修饰符。\n\n此讨论同时适用于类的实例成员和静态成员。\n\
  \n### 3. 接口的成员访问性/可见性修饰符\n\n可以用于接口数据成员和方法的唯一成员访问性/可见性修饰符是 `public`。\n\n`public`\
  \ 也是接口成员的默认访问性/可见性修饰符，即使我们不使用 `public` 修饰符，成员总是被隐式地认为是 `public`。\n\n### 4. 顶层类的修饰符\n\
  \n除了可见性修饰符，我们还可以在顶层类之前使用以下修饰符：\n\n#### (a) `abstract`\n\n可以使用关键字 `abstract` 指定一个类，表示它不能被实例化。包含\
  \ `abstract` 方法的类必须声明为 `abstract`，否则将无法编译。不包含 `abstract` 方法的类也可以声明为 `abstract`。此类类可以作为多个子类的基类。\n\
  \n#### (b) `final`\n\n可以将类声明为 `final`，以表示它不能被扩展。`final` 类标记了其实现继承层次结构的下边界。只有定义完整的类才能被声明为\
  \ `final`。一个类不能同时是 `final` 和 `abstract` 的。\n\n以下是 `final` 类的一些重要特性：\n\n* `final`\
  \ 类的所有方法也都是 `final` 的，即它们具有具体的实现且不能被重写。\n* 使用 `final` 类时，某些类型检查会变得更快。事实上，许多类型检查变成了编译时检查，并且可以更早地捕获错误。如果编译器遇到对\
  \ `final` 类的引用，它知道所引的对象恰是该类型。\n* 编译器能够对 `final` 方法执行某些代码优化，因为对这些成员可以做出某些假设。\n* 当调用非\
  \ `final` 方法时，运行时系统确定对象的实际类，将方法调用绑定到该类型方法的正确实现上，然后调用该实现。\n* 在 `final` 方法的情况下，我们确定类型子类不能重写该方法，因此绑定是在编译时完成的，类似于\
  \ `private` 和 `static` 方法的情况，这绝对会提高性能。\n* 在 `final` 方法的情况下，编译器可以将调用替换为方法的实际体，类似于宏（Macro）。这种机制被称为“内联”（inlining）。在\
  \ C++ 中，我们有将函数声明为 `inline` 的选项（尽管最终决定由编译器做出），但在 Java 中，由编译器做决定。\n\n### 5. 顶层接口的其他修饰符\n\
  \n#### (a) `abstract`\n\n这是除可见性修饰符外，唯一一个可以与接口配合使用的修饰符。\n\n接口只指定方法原型而不包含任何实现：它们从本质上说是隐式抽象的（即：它们不能被实例化）。我们可以将接口声明为\
  \ `abstract`，但这是多余的，因为接口总是抽象的。\n\n### 6. 接口成员的其他修饰符\n\n数据成员的其他修饰符：\n除了可见性修饰符 `public`，我们还可以使用修饰符\
  \ `static` 和 `final`。虽然我们可以使用这些修饰符，但它是多余的，因为所有数据成员都是隐式的 `public`、`static` 和 `final`。\n\
  \n方法的其他修饰符：\n除了可见性修饰符 `public`，我们还可以使用修饰符 `abstract`。虽然可以使用 `abstract` 修饰符，但它是多余的，因为所有方法都是隐式的\
  \ `public` 且 `abstract`。\n\n### 7. 类成员的其他修饰符\n\n可以通过以下关键字在声明中指定字段和或方法的某些特性：\n\n\
  1. `static`\n2. `final`\n3. `abstract`\n4. `synchronized`\n5. `native`\n6. `transient`\n\
  7. `volatile`\n\n#### A. `static` 修饰符\n\n`static` 成员属于它们被定义的类，而不是类的任何实例的一部分。根据类中\
  \ `static` 成员的访问性修饰符，客户端可以使用类名或通过类的对象引用来访问这些成员。\n\n`static` 变量（也称为类变量）：\n这些变量仅存在于它们被定义的类中。当类加载时，如果没有指定显式的初始化表达式，`static`\
  \ 变量将初始化为它们的默认值。`static` 成员变量通常用于跟踪有关实例的全局信息。\n\n`static` 方法：\n这些也被称为类方法。类中的 `static`\
  \ 方法可以直接访问该类中的其他 `static` 成员。它不能访问类的实例（即非静态）成员，因为对于 `static` 方法来说不存在关联对象的概念。\n\n\
  然而，请注意类中的 `static` 方法始终可以使用该类类型的引用来访问其成员，无论这些成员是否是 `static` 的。一个典型的 `static` 方法可能会代表整个类和或类的对象执行某些任务。\n\
  \n子类中的实例不能重写父类中的 `static` 方法。编译器会将此标记为错误（意味着父类中的静态方法不能被非静态方法重写）。`static` 方法是类特定的，不属于任何对象，而方法是代表对象调用的。但子类中的\
  \ `static` 方法可以隐藏（hide）父类中的 `static` 方法。\n\n声明为 `static` 方法有若干限制：\n* 它们只能调用其他 `static`\
  \ 方法。\n* 它们只能访问静态数据成员。\n* 它们无法以任何方式引用 `this` 或 `super`。\n\n`static` 初始化块：\nJava\
  \ 类可以有一个或多个静态初始化块。静态初始化块的语法如下：\n\n```\nstatic {\n    code\n}\n```\n\n`static` 初始化块可以被视为静态方法，它在类加载时隐式/自动调用。静态块在以下情况下有用：\n\
  * 静态变量的动态初始化。\n* 在加载类时执行一次性活动。例如加载 JDBC 驱动类。\n* 在 Hashtable、HashMap、Properties 等加载小型数据库/配置文件。\n\
  \n#### B. `final` 修饰符\n\n`final` 修饰符可以用于：\n* 局部变量\n* 实例变量/数据成员\n* 静态变量/数据成员\n* 实例方法\n\
  \n`final` 变量：\n`final` 变量通常在声明时初始化，赋值后无法修改。关于 `final` 变量的一些重要要点：\n* `final` 变量是一个常量，尽管它被称为变量。一旦初始化，其值就无法更改。这适用于实例、静态和局部变量。\n\
  * `final` 是唯一适用于局部变量或形式参数的修饰符。\n* 原始数据类型的 `final` 变量一旦初始化，其值就无法更改。\n* 引用类型的 `final`\
  \ 变量一旦初始化，其引用值就无法更改，但它所指向的对象的状态仍然可以更改。\n通常 `final` 变量在声明时初始化，但并非必须如此。此类 `final`\
  \ 变量也称为空 final 变量（blank final variable），在在使用之前必须初始化一次。\n\n\n\n\n\n*   静态 final 变量通常用于定义具名常量，例如\
  \ `Integer.MAX_VALUE`，它是 int 的最大值。\n\n## 局部 final 变量\n\n### 示例 13.1\n以下示例说明了局部 final\
  \ 变量可以如上所述留空，但在首次使用之前必须初始化。变量 `x` 在在显示器上显示其值之前才进行初始化。\n\n```java\nclass FinalTest1\
  \ // 使用了空白 final\n{\n    public static void main(String args[])\n    {\n       \
  \ final int x;  // 并不必须在声明时进行初始化\n        x = 50;\n        System.out.println(x);\n\
  \    }\n}\n```\n输出：`50`\n\n### 示例 13.2\n以下代码将无法编译，因为 final 变量被初始化了两次。\n\n```java\n\
  class FinalTest2 // 使用了空白 final\n{\n    public static void main(String args[ ])\n\
  \    {\n        final int x; \n        x=50;\n        System.out.println(x);\n \
  \       x = 60;\n    }\n}\n```\n\n## 实例 final 变量\n\n实例 final 变量可以留空，但在获取包含该 final\
  \ 变量的类对象引用之前必须初始化。因此，如果我们不在声明时进行初始化，那么 final 变量可以初始化的其他地方是：\n\n*   构造方法\n*   初始化块\n\
  \n### 示例 13.3\n以下程序将无法编译，因为 final 变量没有被初始化。默认值初始化的概念不适用于 final 变量，因为它们在初始化后无法被修改。\n\
  \n```java\nclass FinalTest3 // 使用了空白 final\n{\n    final int x; // final 实例变量没有默认初始化\n\
  }\nclass MyClass\n{\n    public static void main(String args[])\n    {\n       \
  \ FinalTest3 f=new FinalTest3();\n        System.out.println(f.x);\n    }\n}\n```\n\
  输出：\n（编译时错误）：变量 `x` 可能未被初始化。\n\n### 示例 13.4\n以下程序也将无法编译，因为 final 变量在获取引用后才被初始化。\n\
  \n```java\nclass FinalTest4\n{\n    final int x;\n}\nclass MyClass\n{\n    public\
  \ static void main(String args[])\n    {\n        FinalTest4 f=new FinalTest4();\n\
  \        f.x = 10;\n        System.out.println(f.x);\n    }\n}\n```\n\n### 示例 13.5\n\
  以下示例说明了空白 final 实例变量可以在构造方法中初始化。\n\n```java\nclass FinalTest5\n{\n    final int\
  \ x;\n    public static void main(String args[])\n    {\n        FinalTest5 f=new\
  \ FinalTest5();\n        System.out.println(f.x);\n    }\n    FinalTest5()\n   \
  \ {\n        x=10;\n    }\n}\n```\n输出：`10`\n\n### 示例 13.6\n以下程序说明了空白 final 变量可以使用动态值进行初始化，并可以使用\
  \ `this` 关键字引用。因此，同一类的不同对象可以拥有 final 变量的不同值。\n\n```java\nclass FinalTest6\n{\n \
  \   final int x;\n    FinalTest6(int x1)\n    {\n        x = x1;\n    }\n    public\
  \ static void main(String args[])\n    {\n        FinalTest6 f1=new FinalTest6(10);\n\
  \        FinalTest6 f2=new FinalTest6(20);\n        System.out.println(f1.x);\n\
  \        System.out.println(f2.x);\n    }\n}\n```\n输出：\n`10`, `20`\n\n## 初始化块\n\
  以下程序说明了空白 final 变量可以使用动态值进行初始化，并可以使用 `this` 关键字引用。因此，同一类的不同对象可以拥有 final 变量的不同值。\n\
  \n（注：提供的文本末尾包含重复/乱码部分；我保留了所提供示例的核心逻辑）。\n\n\n\n\n\n在任何给定时刻，任何对象上最多只有一个线程可以执行 `synchronized`\
  \ 方法。这种讨论也适用于类的静态 `synchronized` 方法。\n\n注意- `synchronized` 修饰符不适用于类或成员变量。\n\n###\
  \ E. native 修饰符:-\n\n`native` 修饰符只能指代方法。与 `abstract` 关键字一样，`native` 表示方法的体将在其他处找到。`native`\
  \ 方法的体完全位于 `JVM` 之外，位于一个库中。原生代码用非 Java 语言编写（通常是 `C` 或 `C++`），并针对单一目标机器类型进行编译。因此，这违反了\
  \ Java 的平台无关性。将 Java 移植到新平台的人需要实现大量的原生代码来支持 GUI 组件、网络通信以及广泛的其他平台特定功能。然而，应用程序和 applet\
  \ 程序员需要编写原生代码的情况非常罕见。\n\n### F. transient 修饰符:-\n\n可以使用序列化来存储对象。序列化将对象转换为便于存储对象的输出格式。之后可以按照序列化时的相同状态检索对象，这意味着包含在序列化中的字段将具有与序列化时相同的值。这样的对象被称为持久化对象。\n\
  \n在类声明中可以将一个字段指定为 `transient`，表示当类的对象被写入持久化存储时，不应保存其值。\n\n```java\nclass Experiment\
  \ implements Serializable\n{\n    transient int currentTemperature;  //transient\n\
  \    double mass;        //persistent value\n}\n```\n\n对静态变量指定 `transient` 修饰符是冗余的，因此不建议这样做。静态变量不是序列化对象持久化状态的一部分。\n\
  \n### G. volatile 修饰符\n\n在执行期间，编译后的代码可能会出于效率考虑缓存字段的值。由于多个线程可以访问同一个字段，因此不允许缓存在读取和写入字段值时导致不一致是至关重要的。`volatile`\
  \ 修饰符可以告知编译器，它不应尝试对该字段进行优化，因为这在多个线程访问该字段时可能会导致不可预测的结果。\n\n![STAR-LOGO-2013](img/image024.png)\n\
  \n# 章节\n# ∞ 第 14 章 ∞\n\n## (包装类)\n\n## 引言\n\n`java` 中的原始数据类型不是对象。如果我们想将这些数据类型作为对象使用，那么我们必须使用\
  \ `java.lang` 包中提供的每个原始数据类型对应的包装类。\n\n有许多内置类，它们无法处理原始数据类型，因为它们只处理对象。其中一个类是 `Vector`，它用于存储对象集合。我们不能使用\
  \ `Vector` 类直接存储原始数据类型元素的集合。但我们可以通过存储与原始数据类型对应的包装类对象来实现这一点。\n\nJava 为每个原始数据类型都有对应的包装类，如下表所示：\n\
  \n| 原始数据类型 | 包装类 |\n| :--- | :--- |\n| boolean | `Boolean` |\n| char | `Character`\
  \ |\n| byte | `Byte` |\n| short | `Short` |\n| int | `Integer` |\n| long | `Long`\
  \ |\n| float | `Float` |\n| double | `Double` |\n\n## Number 类：\n\n抽象类 `Number`\
  \ 定义了超类，包装数值类型 `byte`、`short`、`int`、`long`、`float` 和 `double` 的类都实现了它。`Number` 类具有抽象方法，可以返回对象在不同数字格式下的值。这些方法是：\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `byteValue()` | 返回指定数字的 `byte` 值。 |\n| `shortValue()`\
  \ | 返回指定数字的 `short` 值。 |\n| `intValue()` | 返回指定数字的 `int` 值。 |\n| `longValue()` |\
  \ 返回指定数字的 `long` 值。 |\n| `floatValue()` | 返回指定数字的 `float` 值。 |\n| `doubleValue()`\
  \ | 返回指定数字的 `double` 值。 |\n\n注意- `byteValue()`、`shortValue()`、`intValue()`、`longValue()`、`floatValue()`\
  \ 和 `doubleValue()` 方法返回的值可能涉及舍入或截断。\n\n### 示例 14.1\n\n以下示例演示了在调用 `Number` 类的方法时如何发生舍入和截断。\n\
  \n```java\nclass Wrapper\n{\n    public static void main(String args[ ])\n    {\n\
  \        Integer iObj = new Integer(128);\n        System.out.println(iObj.byteValue());\
  \ //truncation\n        Long lObj = new Long(123456789123456789L);\n        System.out.println(lObj);\n\
  \        System.out.println(lObj.doubleValue());\n        Float fObj = new Float(3.99f);\n\
  \        System.out.println(fObj.intValue()); // truncation\n    }\n}\n```\n\n**输出：**\n\
  ```\n-128\n123456789123456789\n1.23456789123456784E17\n3\n```\n\n### 使用包装类的构造函数将原始数字转换为对象，以及将数值对象转换回原始数字:-\n\
  \n### 示例 14.2\n\n以下示例演示了如何将原始类型封装在对象中，以及如何将它们转换回原始类型。\n\n```java\nclass Convert\n\
  {\n    public static void main(String args[])\n    {\n        System.out.println(\"\
  Converting primitive numbers to objects using constructors\");\n        byte b =\
  \ 105;\n        Byte bObj = new Byte(b);\n        System.out.println(bObj);\n  \
  \      short s = 2015;\n        Short sObj = new Short(s);\n        System.out.println(sObj);\
  \ //toString()\n        int i = 32717;\n        Integer iObj = new Integer(i);\n\
  \        System.out.println(iObj);\n        long l = 2345433556575L;\n        Long\
  \ lObj = new Long(l);\n        System.out.println(lObj);\n        float f = 3.1415f;\n\
  \        Float fObj = new Float(f);\n        System.out.println(fObj);\n       \
  \ double d = 3.1415;\n        Double dObj = new Double(d);\n        System.out.println(dObj);\n\
  \n        System.out.println(\"Converting numeric objects to primitive numbers\"\
  );\n        byte b1 = bObj.byteValue();\n        short s1 = sObj.shortValue();\n\
  \        int i1 = iObj.intValue();\n        long l1 = lObj.longValue();\n      \
  \  float f1 = fObj.floatValue();\n        double d1 = dObj.doubleValue();\n    \
  \    System.out.println(b1);\n        System.out.println(s1);\n        System.out.println(i1);\n\
  \        System.out.println(l1);\n        System.out.println(f1);\n        System.out.println(d1);\n\
  \    }\n}\n```\n\n**输出：**\n```\nConverting primitive numbers to objects using constructors\n\
  105\n2015\n32717\n2345433556575\n3.1415\n3.1415\nConverting numeric objects to primitive\
  \ numbers\n105\n2015\n32717\n2345433556575\n3.1415\n3.1415\n```\n\n## 使用包装类的 `toString()`\
  \ 静态方法将原始数字转换为字符串\n\n### 示例 14.3：\n\n```java\nclass ConvertPrimitiveToString\n{\n\
  \    public static void main(String args[ ])\n    {\n        System.out.println(\"\
  Converting primitive numbers to String using toString() static method of corresponding\
  \ wrapper class:\");\n        byte b = 105;\n        String str = Byte.toString(b);\n\
  \        System.out.println(str);\n        short s = 303;\n        str = Short.toString(s);\n\
  \        System.out.println(str);\n        int i = 100;\n        str = Integer.toString(i);\n\
  \        System.out.println(str);\n        long l = 454444444444l;\n        str\
  \ = Long.toString(l);\n        System.out.println(str);\n        float f = 3.444f;\n\
  \        str = Float.toString(f);\n        System.out.println(str);\n        double\
  \ d = 3.44444;\n        str = Double.toString(d);\n        System.out.println(str);\n\
  \    }\n}\n```\n\n**输出：**\n```\nConverting primitive numbers to String using toString()\
  \ static method of corresponding wrapper class:\n105\n303\n100\n454444444444\n3.444\n\
  3.44444\n```\n\n\n\n# 使用相应包装类的 `toString()` 方法将数值对象对象转换为字符串\n\n### 示例 14.4\n\n```java\n\
  class ObjectToStringDemo\n{\n    public static void main(String args[ ])\n    {\n\
  \        System.out.println(\"Converting object numbers to Strings using\" +\n \
  \       \"toString() method of corresponding wrapper class:\");\n        byte b=103;\n\
  \        Byte bObj = new Byte(b);\n        String str=bObj.toString();\n       \
  \ System.out.println(str);   \n        short s=203;\n        Short sObj=new Short(s);\n\
  \        str = sObj.toString();\n        System.out.println(str); \n        Integer\
  \ iObj = new Integer(32000);\n        str = iObj.toString();\n        System.out.println(str);\n\
  \        str = new Long(4544444444444l).toString();\n        System.out.println(str);\n\
  \        str = new Float(3.1444f).toString();\n        System.out.println(str);\n\
  \        str = new Double(4.1444).toString();\n        System.out.println(str);\n\
  \    }\n}\n```\n\n**输出：**\n```\nConverting object numbers to Strings using toString()\
  \ method of corresponding wrapper class:\n103\n203\n32000\n4544444444444\n3.1444\n\
  4.1444\n```\n\n## 使用相应包装类的静态 `valueOf()` 方法将字符串对象（数值字符串）转换为数值对象\n\n### 示例 14.5\n\
  \n```java\nclass StringToNumericObjectDemo\n{\n    public static void main(String\
  \ args[])\n    {\n        String str=\"30\";\n        String str2=\"30.333\";\n\
  \        Byte bObj=Byte.valueOf(str);\n        System.out.println(bObj);\n     \
  \   //Byte bObj1 = new Byte(str2);  //NumberFormatException\n        Short sObj\
  \ = Short.valueOf(str);\n        System.out.println(sObj);\n        Integer iObj=Integer.valueOf(str);\n\
  \        System.out.println(iObj);\n        Long lObj=Long.valueOf(\"3432432432\"\
  );\n        System.out.println(lObj);\n        Float fObj=Float.valueOf(\"3.333\"\
  );\n        System.out.println(fObj);\n        Double dObj=Double.valueOf(str2);\n\
  \        System.out.println(dObj);\n    }\n}\n```\n\n**输出：**\n```\n30\n30\n3432432432\n\
  3.33\n3.333\n```\n**注意：** 如果字符串不包含可解析的数字，所有 `valueOf()` 方法都会抛出 `NumberFormatException`。\n\
  \n## 使用相应包装类的构造函数将字符串对象（数值字符串）转换为数值对象\n\n### 示例 14.6\n\n```java\nclass StringToNumericObjectDemo\n\
  {\n    public static void main(String args[])\n    {\n        String str=new String(\"\
  30\");\n        //String str=\"30\";\n        String str2=new String(\"30.333\"\
  );\n        Byte bObj = new Byte(str);\n        System.out.println(bObj);\n    \
  \    //Byte bObj=new Byte(str2);  //NumberFormatException\n        Short sObj=new\
  \ Short(str);\n        System.out.println(sObj);\n        Integer iObj=new Integer(str);\n\
  \        System.out.println(iObj);\n        Long lObj=new Long(str);\n        System.out.println(lObj);\n\
  \        Float fObj=new Float(str);\n        System.out.println(fObj);\n       \
  \ Double dObj=new Double(str);\n        System.out.println(dObj);\n    }\n}\n```\n\
  \n**输出：**\n```\n30\n30\n30\n30.333\n30.333\n```\n**注意：** 如果字符串不包含可解析的数字，上述构造函数将抛出\
  \ `NumberFormatException`。\n\n## 使用相应包装类的解析方法将字符串对象（数值字符串）转换为原始类型数字\n\n### 示例 14.7：\n\
  \n```java\nclass StringToPrimitiveDemo\n{\n    public static void main(String args[])\n\
  \    {\n        String str = new String(\"30\");\n        //String str=\"30\";\n\
  \        String str2= new String(\"30.333\");\n        byte b = Byte.parseByte(str);\n\
  \        System.out.println(b);\n        //byte b1=Byte.parseByte(str2);  //NumberFormatException\n\
  \        short s = Short.parseShort(str);\n        System.out.println(s);\n    \
  \    int i = Integer.parseInt(str);\n        System.out.println(i);\n        long\
  \ l = Long.parseLong(str);\n        System.out.println(l);\n        float f = Float.parseFloat(str2);\n\
  \        System.out.println(f);\n        double d = Double.parseDouble(str2);\n\
  \        System.out.println(d);\n    }\n}\n```\n\n**输出：**\n```\n30\n30\n30\n30\n\
  30.333\n30.333\n```\n**注意：** 如果字符串不包含可解析的数字，`parseXXXXX()` 方法将抛出 `NumberFormatException`。\n\
