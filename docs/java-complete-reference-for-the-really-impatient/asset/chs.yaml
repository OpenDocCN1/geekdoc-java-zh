  switch( val )\n{\n    case 1: System.print( \"P\" );\n    case 2: System.print(\
  \ \"Q\" );\n    ...\n}\n```\n哪些值会打印输出？\n(a) P\n(b) Q\n(c) R\n(d) S\n\n3. 假设 `val`\
  \ 定义为正整数，以下代码：\n```java\nif( val > 4 )\n    System.out.println( \"Test A\" );\n\
  else if( val > 9 )\n    System.out.println( \"Test B\" );\nelse\n    System.out.println(\
  \ \"Test C\" );\n```\n哪些 `val` 的值会导致打印 \"Test C\"：\n(a) `val < 0`\n(b) `val` 在 0\
  \ 到 4 之间\n(c) `val` 在 4 到 9 之间\n(d) `val > 9`\n(e) `val = 0`\n(f) 没有 val 值满足\n\n\
  4. 对于代码：\n```java\nm = 0;\nwhile( m++ < 2 )\nSystem.out.println( m );\n```\n哪些会被打印？\n\
  (a) 0\n(b) 1\n(c) 2\n(d) 3\n(e) 什么都不打印且抛出异常\n\n5. 考虑代码片段：\n```java\nouter: for(\
  \ int i = 1; i <3; i++ )\ninner: for( j = 1; j < 3; j++ )\n{\n    if( j==2 )\n \
  \       continue outer;\n    System.out.println( \"i = \" + i+\", j = \" + j );\n\
  }\n```\n哪些输出到标准输出？\n(a) i = 1, j = 1\n(b) i = 1, j = 2\n(c) i = 1, j = 3\n(d) i\
  \ = 2, j = 1\n(e) i = 2, j = 2\n(f) i = 2, j = 3\n(g) i = 3, j = 1\n(h) i = 3, j\
  \ = 2\n\n答案：1(c,d,e,f,g) 2(a,b) 3(b) 4(b,c) 5(a,d)\n\n# 理论\n1. Java 有 `goto` 吗？\n\
