  \n# 章节\n# ∞ 4 ∞\n## (Scanner 类与数组)\n## (命令行参数)\n\n## 引言\n\n### Scanner 类\n\n这是 Java\
  \ 在 JDK 1.5-6-7 版本中添加的一个新类，用于从用户获取基本数据类型的输入。使用此类获取输入非常简单，因为我们只需要创建该类的对象并调用特定方法。该类可用于\
  \ `java.util` 包中。\n\n| `public java.util.Scanner(java.io.InputStream);` |\n| `public\
  \ java.util.Scanner(java.io.File) throws java.io.FileNotFoundException;` |\n| `public\
  \ java.util.Scanner(java.lang.String);` |\n| `public void close();` |\n| `public\
  \ boolean hasNext();` |\n| `public java.lang.String next();` 输入不包含任何空格的字符串。 |\n\
  | `public java.lang.String nextLine();` 输入可能包含空格的字符串。 |\n| `public boolean hasNextBoolean();`\
  \ |\n| `public boolean nextBoolean();` |\n| `public boolean hasNextByte();` |\n\
  | `public byte nextByte();` |\n| `public boolean hasNextShort();` |\n| `public short\
  \ nextShort();` |\n| `public boolean hasNextInt();` 检查输入缓冲区中的下一个值是否为 int。 |\n| `public\
  \ int nextInt();` 输入一个整数值。 |\n| `public boolean hasNextLong();` |\n| `public long\
  \ nextLong();` |\n| `public boolean hasNextFloat();` |\n| `public float nextFloat();`\
  \ |\n| `public boolean hasNextDouble();` |\n| `public double nextDouble();` |\n\n\
  示例 4.1:\n\n```java\nimport java.util.*;\nclass SumInput\n{\n    public static void\
  \ main(String args[])\n    {\n        Scanner sc=new Scanner(System.in);\n     \
  \   int a,b,sum;\n        System.out.print(\"输入第一个数字\");\n        a = sc.nextInt();\n\
  \        System.out.print(\"输入第二个数字\");\n        b = sc.nextInt();\n        sum\
  \ = a+b;\n        System.out.println(\"和为 \" + sum);\n    }\n}\n```\n输出：\n```\n\
  输入第一个数字 45\n输入第二个数字 55\n和为 100\n```\n\n## 数组\n\nJava 中的数组是相同类型变量或数据项目的有序集合。Java\
  \ 允许任何维度的数组。Java 中的数组与 C/C++ 有些不同。我们不需要在声明时指定数组的大小。内存分配始终是动态的。Java 中的每个数组都被视为一个对象，具有一个特殊的属性\
  \ `length`，该属性指定数组中的元素个数。\n\n### 1. 一维数组\n\n#### 声明\n`type array_name[];` // 声明时不进行内存分配。\n\
  或\n`type [] array_name;`\n\n需要注意的是，声明并没有真正创建数组。它只是声明了一个可以指向数组对象的引用。\n\n`int a1 [],\
  \ a2;`\n`int [] a3, a4;`\n\n这两个声明将 `a1`、`a3` 和 `a4` 声明为引用变量，可以指向 `int` 数组，但变量 `a2`\
  \ 不能指向 `int` 类型的数组。它仅仅是一个 `int` 变量。当 `[]` 符号跟随类型时，声明中的所有变量都是数组。否则，`[]` 符号必须跟随声明中的每个单独数组名。\n\
  \n#### 使用 `new` 运算符进行内存分配：\n`array_name = new type[SIZE];` // `SIZE` 可以是常量也可以是变量。\n\
  \n![image](img/image036.png)\n\n**注意 1**- 数组的所有元素将自动初始化为零，但为了用不同的值初始化数组，我们可以在声明本身时初始化。数组的声明、内存分配和初始化步骤可以合并：\n\
  `int a[]={5,7,1};`\n\n**注意 2**- 数组索引从零开始。\n\n**注意 3**- 在 Java 中，所有数组的都存储在一个名为 `length`\
  \ 的变量中。我们可以使用属性 `length` 来访问数组的长度：“`array_name.length`”。\n\n**注意 4**- `int a[],b[];`\n\
  `a = b = new int[5];`\n在上述步骤中，通过 `new` 只了一个数组，该数组的引用首先存储在 `b` 中，然后存储在 `a` 中。因此，a`\
  \ 和 `b` 都指向同一个数组。赋值引用不会创建副本。\n\n示例 4.2: 数组中存储的数字和。\n\n```java\nclass Sum\n{\n  \
  \  public static void main(String args[])\n    {\n        int a[]={10,20,30};\n\
  \        int n=a.length,sum=0;\n        for(int i=0;i<n;i++)\n            sum+=a[i];\n\
  \        System.out.println(\"和为 \" + sum);\n    }\n}\n```\n输出：和为 60\n\n示例 4.3:\
  \ 使用选择技术排序数组。\n\n```java\nimport java.util.Scanner;\nclass Sort\n{\n    public static\
  \ void main(String args[])\n    {\n        Scanner sc = new Scanner(System.in);\n\
  \        System.out.print(\"输入个数\");\n        int n=sc.nextInt();\n        int a[]\
  \ = new int[n];\n        //输入\n        for(int i=0;i<n;i++)\n        {\n       \
  \     System.out.print(\"输入元素 \" + (i+1) + \": \");\n            a[i]=sc.nextInt();\n\
  \        }\n        //排序逻辑（此处省略具体实现）\n    }\n}\n```\n\n### 2. 二维数组\n\n#### 声明\n\
  `type array_name[][`\n或\n`type[][] array_name;`\n\n#### 内存分配\n`array_name = new\
  \ type[ROWS][COLUMNS];` // `ROWS` 和 `COLUMNS` 可以是常量或变量。\n\n到为止我们讨论了存储值的数组。考虑具有行和列矩阵。\n\
  \n示例 4.4: 打印矩阵的转置。\n\n```java\nimport java.util.*;\nclass Transpose\n{\n    public\
  \ static void main(String args[])\n    {\n        Scanner sc=new Scanner(System.in);\n\
  \        int r,c;\n        System.out.print(\"输入行数\");\n        r=sc.nextInt();\n\
  \        System.out.print(\"输入列数\");\n        c=sc.nextInt();\n\n        int m[][]=new\
  \ int[r][c];\n        //输入\n        for(int i=0;i<r;i++)\n            for(int j=0;j<c;j++)\n\
  \            {\n                System.out.print(\"输入元素 \" + (i+1) + \",\" +(j+1)\
  \ + \": \");\n                m[i][j]=sc.nextInt();\n            }\n        //转置输出\n\
  \        for(int i=0;i<c;i++)\n        {\n            for(int j=0;j<r;j++)\n   \
  \             System.out.print(m[j][i]+\"\\t\");\n            System.out.println();\n\
  \        }\n    }\n}\n```\n\n示例 4.5: 将两个矩阵相乘得到第三个矩阵。\n\n```java\nimport java.util.*;\n\
  class MatrixMult\n{\n    public static void main(String args[])\n    {\n       \
  \ Scanner sc=new Scanner(System.in);\n        int r1,c1;\n        System.out.print(\"\
  输入第一个矩阵行数\");\n        r1=sc.nextInt();\n        System.out.print(\"输入第一个矩阵列数\"\
  );\n        c1=sc.nextInt();\n        int r2,c2;\n        System.out.print(\"输入第二个矩阵行数\"\
  );\n        r2=sc.nextInt();\n        System.out.print(\"输入第二个矩阵列数\");\n       \
  \ c2=sc.nextInt();\n        if(c1 != r2)\n        {\n            System.out.println(\"\
  无法相乘\");\n            System.exit(1);\n        }\n        int m1[][]=new int[r1][c1];\n\
  \        // 输入和计算逻辑此处略...\n    }\n}\n```\n\n\n\n\n\n```java\nfor(int j=0;j<c1;j++)\n\
  {\n    System.out.print(\"Enter\" + \"element \" + (i+1) + \",\" + (j+1));\n   \
  \ m1[i][j]=sc.nextInt();\n}\nint m2[][]=new int[r2][c2];\n//输入 m2\nfor(int i=0;i<r2;i++)\n\
  \    for(int j=0;j<c2;j++)\n    {\n        System.out.print(\"Enter\" + \"element\
  \ \" + (i+1) + \",\" +(j+1));\n        m2[i][j]=sc.nextInt();\n    }\nint m3[][]=new\
  \ int[r1][c2];\n//矩阵乘法\nfor(int i=0;i<r1;i++)\n    for(int j=0;j<c2;j++)\n     \
  \   for(int k=0;k<c1;k++)\n            m3[i][j]+=m1[i][k]*m2[k][j];\n//输出 m3\nfor(int\
  \ i=0;i<r1;i++)\n{\n    for(int j=0;j<c2;j++)\n        System.out.print(m3[i][j]+\"\
  \\t\");\n    System.out.println();\n}\n}\n}\n```\n\n### 3. 变长数组\n\n数组将多维数组视为“数组的数组”，可以按照如下方式声明一个二维数组：\n\
  \n```java\nint arr[ ] [ ] = new int [4][ ];\narr[0] = new int [1];\narr[1] = new\
  \ int [2];\narr[2] = new int [3];\narr[3] = new int [4];\n```\n\n这意味着数组总共有 4 行，其列从\
  \ 1 开始并逐个增加。因此，它们在内存中的表示方式如下：\n\n![image](img/image021.png)\n（内存分配）\n\n**注意 1**-\
  \ 数组的所有元素都将自动初始化为零，但如果想用不同的值初始化数组，我们可以在声明时进行初始化。数组的声明、内存分配和初始化步骤可以合并为一条：\n\n```java\n\
  int a[][]={  {5,7,1}, {1,7,9}, {4,5,7}, {1,1,1} };\n```\n\n**注意 2**- 在上述数组 `a` 中，`a.length`\
  \ 将显示行数，即 4；`a[0].length` 将显示第 0 行的列数，即 3\n\n## 命令行参数\n\n有时我们希望在运行程序时向程序传递信息。这是通过向\
  \ `main()` 传递命令行参数来实现的命令行参数是在执行程序时直接跟在命令行中程序名后面的信息。\n\n要在 Java 程序内部访问命令行参数，我们必须使用传递给\
  \ `main()` 的 `String` 数组。\n\nJVM 调用 `main( )` 方法并将命令行参数作为字符串数组传递给它。在上面的示例中，数组的长度（即命令行参数的数量）是通过使用属性\
  \ `length` 获取的。\n\n`for` 循环在控制台/显示器上显示命令行参数。\n\n#### 示例 4.6 从命令行参数输入名称的程序。\n\n```java\n\
  class Hello\n{\n    public static void main(String args[])\n    {\n        for(int\
  \ i=0;i<args.length;i++)\n            System.out.println(\"Hello \" + args[i]);\n\
  \    }\n}\n```\n`javac Hello.java`\n`java Hello Ravi Ajay Vijay`\n\n**输出：**\n```\n\
  Hello Ravi\nHello Ajay\nHello Vijay\n```\n\n#### 示例 4.7 输出通过命令行参数输入的数字之和的程序。\n\n\
  ```java\nclass SumCmd\n{\n    public static void main(String args[])\n    {\n  \
  \      int sum=0;\n        for(int i=0;i<args.length;i++)\n            sum+=Integer.parseInt(args[i]);\n\
  \        System.out.println(\"Sum is \" + sum);\n    }\n}\n```\n`javac SumCmd.java`\n\
  `java SumCmd 5 6`\n**输出：**\n```\nSum is 11\n```\n\n#### 示例 4.8 从命令行排序数组的程序。\n\n\
  ``````java\nclass SortCmd\n{\n    public static void main(String args[])\n    {\n\
  \        int n=args.length;\n        int a[]=new int[n];\n        for(int i=0;i<n;i++)\n\
  \            a[i] = Integer.parseInt(args[i]);\n        for(int i=0;i<n-1;i++)\n\
  \            for(int j=i+1;j<n;j++)\n                if(a[i]>a[j])\n           \
  \     {\n                    int t=a[i];\n                    a[i]=a[j];\n     \
  \               a[j]=t;\n                }\n        for(int i=0;i<n;i++)\n     \
  \       System.out.print(a[i]+\"\\t\");\n    }\n}\n```\n`javac SortCmd.java`\n`java\
  \ SortCmd 5 4 1 3 2`\n**输出：**\n```\n1 2 3 4 5\n```\n\n## 多选题\n\n1. 如果 `MyProg.java`\
  \ 被编译并在命令行执行 `java MyProg hello world`，那么 `main` 方法中 `args.length` 的值是：\nA. 0\n\
  B. 1\nC. 2\nD. 3\n\n2. 在 Java 中，声明 `int[][] arr = new int[3][4];` 后，以下描述正确的是：\n\
  A. `arr.length` 是 4\nB. `arr[0].length` 是 3\nC. `arr.length` 是 3\nD. 以上均错\n\n3.\
  \ 关于 Java 数组，以下说法错误的是：\nA. 数组的大小在创建后无法改变\nB. 数组可以存储不同类型的元素\nC. 数组的索引从 0 开始\nD. 数组是连续存储在内存中的\n\
  \n4. 命令行参数是通过哪个参数名传递给 `main` 方法的？\nA. `System`\nB. `args`\nC. `options`\nD. `input`\n\
  \n5. 下列关于数组初始化的描述，正确的是：\nA. 数组元素会自动初始化为 0\nB. 数组可以在声明时直接初始化\nC. 数组不能在声明时初始化\nD.\
  \ 以上都是\n\n\n\n\n\n在 `s2` 中进行的任何更改也将反映在 `s1` 中。这种赋值不会进行内存分配。几步之后，如果我们为 `s1` 赋值 `null`，那么该对象不会被销，因为它的引用仍在对象\
  \ `s2`。但如果 `s1` 和 `s2` 都被赋值为 `null`，则该对象将被垃圾回收器回收，对象占用的内存将被释放。\n\n### 示例 5.1 只包含成员变量的类。\n\
  \n```java\nclass A\n{\n    int x;\n    int y;\n}\nclass ClassTest1\n{\n    public\
  \ static void main(String args[])\n    {\n        A a1,a2;  //引用变量\n        a1 =\
  \ new A();  //创建对象\n        a2 = new A();\n        a1.x = 10;\n        a1.y = 20;\n\
  \        a2.x = 5;\n        a2.y = 6;\n        System.out.println(a1.x + \"\\t\"\
  \ + a1.y);\n        System.out.println(a2.x + \"\\t\" + a2.y);\n    }\n}\n```\n\
  **输出：**\n```\n10  20\n5  6\n```\n\n### 示例 5.2 包含成员变量与成员方法的类。\n\n```java\nclass A\n\
  {\n    private int x;\n    private int y;\n    void setdata(int x1, int y1)\n  \
  \  {\n        x = x1;\n        y = y1;\n    }\n    void display()\n    {\n     \
  \   System.out.println(x + \"\\t\" + y);\n    }\n}\nclass ClassTest2\n{\n    public\
  \ static void main(String args[])\n    {\n        A a1 = new A();\n        A a2\
  \ = new A();\n        //a1.x=10;  因为 x 是私有的，所以报错\n        a1.setdata(10,20);\n \
  \       a2.setdata(5,7);\n        a1.display();\n        a2.display();\n    }\n\
  }\n```\n**输出：**\n```\n10  20\n5  7\n```\n\n注意 - 我们可以在类外部，也可以在类内部声明类的对象。\n\n### 示例\
  \ 5.3 在类内部定义类的对象。\n\n```java\nclass A\n{\n    private int x;\n    private int y;\n\
  \    void setdata(int x1, int y1)\n    {\n        x = x1;\n        y = y1;\n   \
  \ }\n    void display()\n    {\n        System.out.println(x + \"\\t\" + y);\n \
  \   }\n    public static void main(String args[])\n    {\n        A a1 = new A();\n\
  \        A a2 = new A();\n        a1.setdata(10,20);\n        a2.setdata(5,7);\n\
  \        a1.display();\n        a2.display();\n    }\n}\n```\n**输出：**\n```\n10 \
  \ 20\n5  7\n```\n\n### 类成员的修饰符 / 可见性标签\n\n可见性修饰符仅适用于成员成员而不适用于局部变量。\n\n- `private``-\
  \ 如果我们在成员变量或方法上指定 `private` 修饰符，那么该成员在声明它的类外部是不可见的。这将从其他类隐藏该类的成员。\n- `public`- 如果我们在成员变量或方法上指定\
  \ `public` 修饰符，那么该成员对所有类都可见。该成员甚至可以在包外被访问。`main()` 方法始终被定义为 `public`，因为 `main()`\
  \ 方法是由 JVM 访问的，而 JVM 在定义 `main()` 方法的类外部。\n- `protected`- 声明为 `protected` 的成员可以从属于同一包的所有类访问。受保护的成员也可以从其他包的任何子类访问。\n\
  - `default / 无修饰符`- 如果在成员之前没有指定可见性修饰符，则可以从相同包中的所有类访问该成员。该成员无法跨包访问。\n\n#### 类或接口的可见性修饰符\n\
  \n- `public`- 如果一个类要对所有包的所有类都可见，则必须通过指定 `public` 修饰符将其声明为 `public`，该修饰符应出现在 `class`\
  \ 关键字之前。\n- `default / 无修饰符`: 如果在类之前没有任何访问/可见性修饰符，它的可见性仅限于它所所在的包（类组）内。\n\n#### this\
  \ 关键字\n\n`this` 是一个引用变量，存储了用于调用方法的对象的引用。`this` 的引用在运行时会被替换为调用对象的引用。有时，一个方法需要引用调用它的对象。这可以通过\
  \ `this` 来实现。注意：局部变量会隐藏实例变量，因此我们必须显式地使用该关键字。\n\n#### 实例变量隐藏\n\n众所周知，在 Java 中在同一个嵌套作用域内声明两个同名的局部变量是违法的。但我们可以拥有与类的实例变量同名的局部变量（方法的参数）。当局部变量与实例变量同名时，局部变量会隐藏实例变量。但\
  \ `this` 关键字允许即使在局部变量隐藏了实例变量的情况下，我们仍然能够引用到该实例变量。\n\n### 示例 5.4 this 关键字的使用\n\n```java\n\
  class A\n{\n    private int x;\n    private int y;\n    void setdata(int x, int\
  \ y)\n    {\n        this.x = x;  //this.x 是类成员，x 是局部变量\n        this.y = y;\n \
  \   }\n    void display()\n    {\n        System.out.println(x + \"\\t\" + y);\n\
  \    }\n}\nclass ClassTest4\n{\n    public static void main(String args[])\n   \
  \ {\n        A a1 = new A();\n        A a2 = new A();\n        a1.setdata(10,20);\n\
  \        a2.setdata(5,7);\n        a1.display();\n        a2.display();\n    }\n\
  }\n```\n**输出：**\n```\n10  20\n5  7\n```\n\n### 方法重载\n\n我们可以有多个同名的方法，只要它们在参数数量、参数类型或参数顺序上不同。这被称为方法重载。\n\
  \n在调用重载方法时，传递的实际参数类型可能与任何重载方法的形式参数不完全匹配。在这种情况下，参数将提升到更高类型，直到找到匹配项为止。如果在提升参数后仍未找到匹配项，则会发生编译错误。\n\
  \n### 示例 5.5 在示例中，两个 `setdata()` 方法名称相同但参数不同，因此这是方法重载。\n\n```java\nclass A\n{\n\
  \    private int x,y;\n    void setdata(int x1)\n    {\n        x = y = x1;\n  \
  \  }\n    void setdata(int x1, int y1)\n    {\n        x = x1;\n        y = y1;\n\
  \    }\n    void display()\n    {\n        System.out.println(x + \"\\t\" + y);\n\
  \    }\n}\nclass ClassTest5\n{\n    public static void main(String args[])\n   \
  \ {\n        A a1 = new A();\n        a1.setdata(5);\n        a1.display();\n  \
  \      A a2 = new A();\n        a2.setdata(10,20);\n        a2.display();\n    }\n\
  }\n```\n**输出：**\n```\n5  5\n10  20\n```\n\n\n\n\n\n## 默认构造函数\n每个类都有一个默认构造函数（如果没有定义显式构造函数），该函数不接受任何参数，且其体体不包含任何语句。编译器会自动生成默认构造函数。\n\
  \n一旦我们添加了自己的构造函数，编译器就会停止生成默认构造函数。如果我们不在类中创建任何构造函数，那么 `JVM` 将创建默认构造函数，并将实例变量初始化为默认值\
  \ `null` 或零。\n\n#### 示例 5.6 默认构造函数的用法\n```java\nclass A {\n    private int x;\n\
  \    private int y;\n    void display() {\n        System.out.println(x + \"\\t\"\
  \ + y);\n    }\n}\nclass ClassTest6 {\n    public static void main(String args[])\
  \ {\n        A a1 = new A();\n        a1.display();\n    }\n}\n```\n**输出：**\n```\n\
  0 0\n```\n**注意：** 这里我们没有创建任何构造函数，因此 `JVM` 在创建对象后自动创建默认构造函数，并将实例变量初始化为 0 或 `null`。\n\
  \n### 默认零参数构造函数\n我们可以用自己的零参数构造函数替换默认构造函数。这允许我们将实例变量初始化为任何值。\n\n## 参数化构造函数\n带有参数的构造函数称为参数化构造函数。\n\
  \n**注意：** 可以像方法一样对构造函数进行重载。这被称为构造函数重载。\n\n#### 示例 5.7 构造函数的用法\n```java\nclass A\
  \ {\n    private int x;\n    private int y;\n    A() //零参数构造函数 {\n        x = y\
  \ = 0;\n    }\n    A(int x1) //参数化单参数构造函数 {\n        x = y = x1;\n    }\n    A(int\
  \ x1, int y1) //参数化双参数构造函数 {\n        x = x1;\n        y = y1; \n    }\n    void\
  \ display() {\n        System.out.println(x + \"\\t\" + y);\n    }\n}\nclass ClassTest7\
  \ {\n    public static void main(String args[]) {\n        A a1 = new A();\n   \
  \     a1.display();\n        A a2 = new A(5);\n        a2.display();\n        A\
  \ a3 = new A(4,7);\n        a3.display();\n    }\n}\n```\n**输出：**\n```\n0 0\n5 5\n\
  4 7\n```\n\n#### 示例 5.8:\n```java\nimport java.util.Scanner;\nclass Complex {\n\
  \    private int real,imag;\n    Complex()//零参数构造函数 {\n        real=imag=0;\n  \
  \  }\n    Complex(int real, int imag) {\n        this.real=real;\n        this.imag=imag;\n\
  \    }\n    void getdata() {\n        Scanner sc=new Scanner(System.in);\n     \
  \   System.out.print(\"Enter real\");\n        real=sc.nextInt();\n        System.out.print(\"\
  Enter imag\");\n        imag=sc.nextInt();\n    }\n    void display() {\n      \
  \  if(imag>=0)\n            System.out.println(real+\"+\"+imag+\"i\");\n       \
  \ else\n            System.out.println(real+\"\"+imag+\"i\");\n    }\n    Complex\
  \ sum(Complex c) {\n        Complex t=new Complex();\n        t.real=real+c.real;\n\
  \        t.imag=imag+c.imag;\n        return t;\n    }\n    Complex mult(Complex\
  \ c) {\n        Complex t=new Complex();\n        t.real=real*c.real;\n        t.imag=imag*c.imag;\n\
  \        return t;\n    }\n    public static void main(String args[]) {\n      \
  \  Complex c1=new Complex();\n        Complex c2=new Complex();\n        Complex\
  \ c3=null,c4=null;\n        c1.getdata();\n        c2.getdata();\n        c3=c1.sum(c2);\n\
  \        System.out.print(\"Sum is \");\n        c3.display();\n        c4=c1.mult(c2);\n\
  \        System.out.print(\"Product is \");\n        c4.display();\n    }\n}\n```\n\
  \n## finalize 方法\n有时对象在被销毁时需要执行某些操作。例如，如果一个对象持有某些非 Java 资源（如文件句柄），我们可能希望在对象销毁之前确保这些资源被释放。为了处理这种情况，Java\
  \ 提供了一种名为 finalization（最终化）的机制。通过使用最终化，我们可以定义对象即将被垃圾回收器回收时的特定操作。`finalize()` 仅在垃圾回收之前调用。它在对象超出作用范围时不会调用。在\
  \ C++ 中，析构函数的概念用于最终化，但它与 Java 中的 `finalize()` 并不相同。\n\n```java\nprotected void finalize()\
  \ {\n    // 此处编写 finalize 代码。\n}\n```\n**注意：** 除了 `protected` 修饰符外，我们也可以使用 `public`。\n\
  \n## 变量类型\nJava 有三种变量：\n\n#### 1. 实例变量\n在类中声明、在所有方法之外的变量称为实例变量。该变量的副本数量与对象的数量相同。在\
  \ Java 中不需要初始化实例变量，因为这些变量在对象创建并使用 `new` 运算符分配内存时就会被初始化。变量根据其类型进行初始化。所有数值变量都自动初始化为\
  \ `0`，布尔变量初始化为 `false`，引用变量（对象）初始化为 `null`。\n\n#### 2. 局部变量\n在方法内部声明的变量是局部变量。它们不会自动初始化。\n\
  \n#### 3. 静态变量\n静态变量与实例变量一样声明在方法/块之外，但带有 `static` 修饰符。它们对类是全局的。静态变量可以用于跟踪全局状态。例如，类中的静态变量\
  \ `count` 可以存储程序中创建的实例数量。对象通过静态变量进行通信，就像全局变量一样。\n\n#### 示例 5.9\n```java\nclass A\
  \ {\n    int x; //实例变量\n    static int y; //静态或类变量\n}\nclass ClassTest8 {\n    public\
  \ static void main(String args[]) {\n        A a1 = new A();\n        A a2 = new\
  \ A();\n        A a3 = new A();\n        a1.x = 10;\n        a1.y = 20;\n      \
  \  a2.x = 11;\n        a2.y = 21;\n        a3.x = 12;\n        a3.y = 22;\n    \
  \    System.out.println(a1.x + \"\\t\" + a1.y);\n        System.out.println(a2.x\
  \ + \"\\t\" + a2.y);\n        System.out.println(a2.x + \"\\t\" + a3.y);\n    }\n\
  }\n```\n**输出：**\n```\n10 22\n11 22\n12 22\n```\n\n## 方法类型\n#### 实例方法\n这些方法与 C++\
  \ 函数相同。实例方法只能通过对象调用。如果在同一个类的静态方法内部调用实例方法，那么也必须使用对象名称。\n\n#### 静态方法\n\n\n\n\n静态方法可以使用对象名也可以通过类名来调用。静态方法只能访问静态成员。在同一类的静态方法中，可以直接调用静态方法（不需要对象或类名）。\n\
  \n#### 示例 5.10\n\n```java\nclass A\n{\n    int x;\n    static int y;\n    static\
  \ int sum(int a, int b)\n    {\n        //y = 5; 无错误，静态方法可以访问静态变量\n        //x =\
  \ 10; 错误，静态方法无法访问实例变量\n        //A a1 = new A();\n        //a1.x = 10; 无错误，因为静态方法可以通过对象访问实例变量\n\
  \        //this.x = 10; 错误，静态方法无法访问 this 或 super 关键字\n        int c;\n        c\
  \ = a+b;\n        return(c);\n    }\n    static float avg(int a, int b)\n    {\n\
  \        return (float)(a+b)/2;\n    }\n}\nclass ClassTest9\n{\n    public static\
  \ void main(String args[ ])\n    {\n        System.out.println(A.sum(5,6)); // 静态方法可以通过类名\n\
  \              // 调用\n        System.out.println(A.avg(5,6));\n        A a1 = new\
  \ A();\n        System.out.println(a1.sum(5,6)); // 静态方法也可以通过对象\n              //\
  \ 调用\n    }\n}\n```\n**输出：**\n```\n11\n5.5\n11\n```\n\n### 初始化块与静态块 (Initialize\
  \ & static Block)\n初始化块用于初始化类的实例成员变量，而静态块用于初始化类的静态成员变量。构造函数会在这些块之后被调用。\n\n### 示例\
  \ 5.11\n\n```java\nclass A\n{\n    int x;\n    static int y;\n\n    {  // 初始化实例变量的初始化块\n\
  \        x = 10;\n    }\n\n    static  // 初始化静态变量的静态块\n    {\n        y = 5;\n \
  \   }\n}\nclass ClassTest10\n{\n    public static void main(String args[])\n   \
  \ {\n        A a1 = new A();\n        System.out.println(a1.x + \"\\t\" + a1.y);\n\
  \    }\n}\n```\n**输出：**\n```\n10  5\n```\n\n## final 变量 (Final Variables)\n如果变量被声明为\
  \ `final`，则我们不能改变它的值 `final (double PI=3.141;)`。final 变量不按实例占用内存。final 变量是一个常量变量，其值不能改变。final\
  \ 变量的引用类型不能改变其引用。\n\n### 示例 5.12\n\n```java\nclass A\n{\n    void m1() \n    {\n\
  \        System.out.println(\"Inside m1()\");\n    }\n}\nclass ClassTest11\n{\n\
  \    public static void main(String args[])\n    {\n        final int x=10; // 不能更改\n\
  \        final int y;  // 变量 y 未初始化，所以我们稍后可以初始化 y\n        y=20;   现在 y 已初始化，之后我们不能再改变它的值\n\
  \        //  y=30;  错误\n        System.out.println(x);\n        System.out.println(y);\n\
  \        final A a1=new A();  // a1 是常量引用，所以我们不能\n        // 将其他对象的引用赋值给 a1\n  \
  \      a1.m1();\n        A a2 = new A();\n        //  a1 = a2;  错误 \n    }\n}\n\
  ```\n**输出：**\n```\n10\n20\nInside m1()\n```\n\n### 参数传递机制 (Argument Passing Mechanism)\n\
  1. 值传递 (Call by Value)。\n2. 引用传递 (Call by reference)。\n\n当将基本数据类型（`int`、`float`、`long`\
  \ 等）传递给方法时，是使用值传递的方法。对于对象，实际传递的是对象引用。\n\n对象引用也是通过值传递的方法进行传递的。然而，由于所传递的值指向一个对象，该值的拷贝仍然指向与其对应的实形参数相同的对象。\n\
  \n例如，如果我们将存储了对象引用的引用变量 `a1` 传递给函数，且函数中 `a2` 是形式参数，那么 `a1` 和 `a2` 都指向同一个对象。\n\n通过\
  \ `a2` 对对象值进行的任何更改也将反映在 `a1` 中。但如果我们在 `a2` 中分配一个新引用，那么该引用将被复制到 `a1` 中。\n\n### 示例\
  \ 5.13\n```java\nclass Box\n{\n    private int feet;\n    private int inches;\n\
  \    Box()\n    {\n        feet = inches = 0;\n    }\n    Box(int feet, int inches)\n\
  \    {\n        this.feet = feet;\n        this.inches = inches;\n    }\n    void\
  \ display()\n    {\n        System.out.println(\"Feet is \" + feet +\"\\n\" + \"\
  Inches is \" + inches);\n    }\n    void swap(Box obj)\n    {\n        int t;\n\
  \        t = feet;\n        feet = obj.feet;\n        obj.feet = t;\n        t =\
  \ inches;\n        inches = obj.inches;\n        obj.inches = t;\n    }\n}\nclass\
  \ ClassTest2\n{\n    public static void main(String args[])\n    {\n        Box\
  \ b1 = new Box(5,6);\n        Box b2 = new Box(7,4);\n        b1.swap(b2); // 对象通过引用传递\n\
  \        b1.display();\n        b2.display();\n    }\n}\n```\n**输出：**\n```\nFeet\
  \ is 7\nInches is 4\nFeet is 5\nInches is 6\n```\n\n### 嵌套内部类 (Nested Inner Classes)\n\
  在另一个类内部定义一个类是可能的；此类类被称为嵌套类。嵌套类的作用范围限于其外部类的作用范围。嵌套类可以访问其所嵌套类的成员，包括该类的私有成员。然而，外部类无法访问嵌套类的成员。\n\
  \n嵌套类有两种类型：静态的和非静态的。静态嵌套类是应用了 `static` 修饰符的类。由于它是静态的，它必须通过对象来访问其外部类的成员。也就是说，它不能直接引用外部类的成员。由于这种限制，静态嵌套类很少使用。非静态嵌套类可以访问外部类的所有成员。\n\
  \n### 示例 5.14\n```java\nclass Outer\n{\n    static class Inner\n    {\n        int\
  \ x = 15;\n        void msg()\n        {\n            System.out.println(\"Hello\
  \ from Inner class\");\n        }\n    }\n\n    void test()\n    {\n        Inner\
  \ i = new Inner();\n        i.msg();\n        System.out.println(i.x);\n    }\n\
  }\n\nclass ClassTest13\n{\n    public static void main(String args[])\n    {\n \
  \       Outer o = new Outer();\n        o.test();\n    }\n}\n```\n**输出：**\n```\n\
  Hello from Inner class\n15\n```\n\n### 示例 5.15\n```java\nclass Outer\n{\n    class\
  \ Inner\n    {\n        int x = 15;\n        void msg()\n        {\n           \
  \ System.out.println(\"Hello from Inner class\");\n        }\n    }\n\n    void\
  \ test()\n    {\n        Inner i = new Inner();\n        i.msg();\n        System.out.println(i.x);\n\
  \    }\n}\nclass ClassTest14\n{\n    public static void main(String args[])\n  \
  \  {\n        Outer o = new Outer();\n        o.test();\n    }\n}\n```\n**输出：**\n\
  ```\nHello from Inner class\n15\n```\n\n## Random 类\n### 示例 5.16\n```java\nimport\
  \ java.util.Random;\nclass RandomTest\n{\n    public static void main(String args[])\n\
  \    {\n        Random r1 = new Random();\n        for(int i=1;i<=10;i++)\n    \
