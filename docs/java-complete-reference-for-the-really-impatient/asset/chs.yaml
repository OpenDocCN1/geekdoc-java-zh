  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节 \n# ∞ 3 ∞\n## (控制语句)\n\n## 引言\n控制语句用于改变执行流。Java\
  \ 的控制语句可以分为三类。\n\n### 1. 选择语句（决策控制结构） 选择语句允许程序根据表达式的结果或变量的状态，从一组不同的执行路径集合中选择任意一条路径。\n\
  \n1.1. `if`\n2. `if else`\n3. 嵌套 `if else`\n4. `if-else-if`\n5. `switch`\n\n(a)\
  \ `if` 的语法 (b) `if else` 的语法\n\n```\nif(condition)      if(condition)\n{\n    statements;\n\
  }\nelse\n{\n}\n```\n\n(c) 嵌套 `if else` 的语法 (d) `if-else-if` 阶梯的语法\n\n```\nif(condition)\
  \      if(condition1)\n{\n    if (condition)\n}\nelse if(condition2)\n{\n}\nelse\
  \ if(else3)\n{\n    \n\n}\n}\nelse\n{\n    if\n    )\n    )\n    {\n    else\n \
  \   {\n    }\n}\n```\n\n(e) `switch case` 的语法\n\n```java\nswitch(expression)\n{\n\
  \    case 1:\n        statement 1 sequence;\n        break;\n    case 2:\n     \
  \   statement 2 sequence;\n        braek;\n    case 3:\n        statement 3 sequence;\n\
  \        break;\n    case n:\n        break;\n    default :\n        default statement\
  \ sequence;\n}\n```\n\n#### 示例 3.1 寻找两个数最大值的程序 (Max.Java)\n```java\nclass Max\n\
  {\n    public static void main(String args[])\n    {\n        int a,b,max;\n   \
  \     a = 10;\n        b = 20;\n        if(a>b)\n            max = a;\n        else\n\
  \            max = b;\n        System.out.println(\"Max of two numbers is \" + max);\
  \ //输出\n    }\n}\n```\n输出：`Max of two numbers is 20`\n\n### 2. 迭代语句（循环控制结构）循环是一个我们可以重复单条语句或一组语句\
  \ n 次的过程。\n\n2.1. `for`\n2. `while`\n3. `do while`\n\n(a) `for` 循环的语法。\n```java\n\
  for( initialize; condition; increment/decrement)\n{\n    statements;\n}\n```\n\n\
  (b) `while` 循环的语法。\n(c)\n```java\ninitialize;\nwhile(condition)\n{\n    statements;\n\
  \    increment/decrement;\n}\n```\n(d) `do while` 循环的语法。\n\n```java\ninitialize;\n\
  do\n{\n    statements;\n    increment/ decrement;\n} while(condition);\n```\n**注意-**\
  \ 条件可以是任何布尔表达式。只要条件表达式为真，循环体就会一直执行。当条件变为假时，控制立即传递到紧随循环的下一行代码。\n\n#### 示例 3.2\n```java\n\
  class Loop1\n{\n    public static void main(String args[])\n    {\n        int n=5;\n\
  \        for(int i=1;i<=n;i++)\n        {\n            for(int j=1;j<=i;j++)\n \
  \               System.out.print(j);\n            System.out.println();\n      \
  \  }\n    }\n}\n```\n输出：\n1\n12\n123\n1234\n12345\n\n### 1. 跳出语句- 它允许我们的程序以非线性方式工作。\n\
  1. `break`。\n2. 标记 `break` (labeled break)。\n3. `continue`。\n4. 标记 `continue` (labeled\
  \ continue)。\n5. `return`。\n\n- 大多数语句的语法与 C/C++ 相同。但存在一些差异。\n- 用于 `if`、`for` 和 `do`\
  \ 语句的条件表达式必须是布尔表达式，即它们的值应该为真或假。我们不能像 C/C++ 中那样用 0 代假或用非零代替真。\n- Java 没有 `goto` 语句，尽管\
  \ `goto` 是一个保留字。Java 提供了 `labeled break` 和 `labeled continue` 语句，它们通常被称为 goto 的文明形式。\n\
  - 在 Java 中，`switch` 表达式可以是任何整数表达式，`long` 除外。`switch` 表达式的类型可以是 `byte`、`short`、`char`\
  \ 或 `int`。Java 的 `int` 是 4 字节，与 C/C++ 中的 `long` 相同。\n- `case` 标签像 C/C++ 一样是常量表达式，但\
  \ case 标签的值必须在 `switch` 表达式的范围内，否则程序将编译。\n- `labeled break` 语句用于终止在 `break` 中指定标签的块。与简单的\
  \ `break` 不同，我们可以终止任何块。例如，可以从深度嵌套循环内部终止最外层循环。`break` 语句也可以用于终止简单块（即块不需要是循环或 switch\
  \ 语句）。\n- `labeled continue` 语句指定要继续的闭层循环的标签。标签不需要对应最近的闭层循环。\n\n#### 跳出语句\n(a) `break`\n\
  ```java\nfor(int i=1;i<=10;i++)\n{\n    if(i == 5)\n        break; //如果 i 是 5 则终止循环\n\
  \    System.out.print( i );\n}\n```\n输出：`1 2 3 4`\n\n(b) 标记 `labeled break`\n```java\n\
  boolean t =true;\nfirst : {\n    second: {\n        third: {\n            System.out.println(\"\
  Before the break\");\n            if(t) break second; //跳出第二个块\n            System.out.println(\"\
  This will not execute\");\n        }\n        System.out.println(\"This will not\
  \ execute\");\n    }\n    System.out.println(\"This is after block\");\n}\n```\n\
  输出：\n`Before the break`\n`This is after block`\n\n(c) `continue`\n```java\nfor(int\
  \ i=0;i<10;i++)\n{\n    if( i % 2 == 0 )\n        continue;\n    System.out.println(\
  \ i );\n}\n```\n**注意-** 使用 `%` 运算符检查 `i` 是否为偶数。如果是偶数则跳过。\n输出：\n1\n3\n5\n7\n9\n\n\
  (d) 标记 `labeled continue`\n```java\nouter: for(int i=0;i<5;i++)\n{\n    for(int\
  \ j=0;j<i;j++)\n    {\n        if( j==2 )\n            continue outer;\n       \
  \ System.out.println( i + j );\n    }\n}\n```\n输出：\n0\n1\n2\n3\n4\n5\n6\n7\n\n(e)\
  \ `return`\n```java\nint sum(int a, b)\n{\n    a+b;\n    return;\n}\n```\n\n# 选择题\n\
  1. 给定以下变量：\n`int one = 1;`\n`int two = 2;`\n`char initial = '2';`\n`boolean flag\
