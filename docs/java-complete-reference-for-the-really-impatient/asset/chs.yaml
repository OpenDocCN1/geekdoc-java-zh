  1. 如果我们希望一个成员变量在类外部无法被访问，在声明变量时应该使用什么关键字？\n\n2. 在 Java 中，对象/值是如何传递的？\n\n3. 考虑以下代码：\n\
  \n```java\npublic static void main(String args[])\n{\n    int a = 5;\n    System.out.println(\
  \ cube( a ) );\n}\n\nint cube( int theNum )\n{\nreturn theNum * theNum * theNum;\n\
  }\n```\n解释“static”关键字的重要性\n\n当我们尝试编译并运行此代码时会发生什么？\n\na) 无法编译，因为 cube 在 java.lang.Math\
  \ 类中已经定义。\nb) 无法编译，因为 cube 不是静态的。\nc) 编译通过，但会抛出算术异常。\nd) 能够完美运行并在标准输出上打印“125”。\n\
  \n\n\n\n## 4. 什么是静态内部类？它与任何其他静态成员有什么区别？\n\n## 5. 如何在 Java 中声明常量值\n\n## 6. \"final\"\
  \ 关键字的含义是什么？\n\n## 7. 什么是类变量？\n\n**答案：**\n\n当我们创建一个相同类的多个对象时，每个对象将共享变量的公共副本。这意味着无论从该类创建了多少个对象，每个类只有一份副本。类变量或静态变量在类中使用\
  \ `static` 关键字进行声明。\n\n这些变量存储在静态内存中。类变量主要用于常量，即初始值从不改变的变量。静态变量始终通过类名进行调用。\n\n该变量在程序启动时创建，即它在通过\
  \ `new` 运算符创建类的实例之前就已经创建了，并在程序停止时销毁。类变量的作用范围与实例变量相同。\n\n类变量可以在类层级的任何地方使用 `static`\
  \ 关键字进行定义。它的初始值与实例变量相同。当类变量被定义为 `int` 时，其默认值 零；当声明为 `boolean` 时，其默认值为 false，对象引用则为\
  \ null。类变量与类相关，而不是与任何对象相关。\n\n## 8. 解释垃圾回收。\n\n**答案：** 垃圾回收是 Java 最重要的特性之一。垃圾回收也被自动内存管理，因为\
  \ `JVM` 会自动从内存中移除未使用的变量/对象（值为 `null`）。用户程序无法直接从内存中释放对象，相反，由垃圾回收器自动释放不再被程序引用的对象。\n\
  \n每个类都从 `java.lang.Object` 继承了 `finalize()` 方法，当垃圾回收器确定不再有对该对象的引用时，就会调用 `finalize()`\
  \ 方法。\n\n在 Java 中，当变量不再被使用时，显式地为变量赋值 `null` 是一个好习惯。在 Java 中，调用 `System.gc()` 和 `Runtime.gc()`\
  \ 时，`JVM` 会尝试回收未使用的对象，但无法保证所有对象何时会被垃圾回收。\n\n## 9. 如果一个类有多个构造函数，我们可以从其中一个构造函数调用另一个吗？\n\
  \n可以。使用 `this()` 从一个构造函数调用另一个构造函数。\n\n## 10. 构造函数和普通方法之间有什么区别？\n\n构造函数的名称必须与类名相同且不能有返回值。它们只会被调用一次，而普通方法可以被调用多次，并且可以返回结果或为\
  \ `void`。\n\n## 11. 我们如何强制执行垃圾回收？\n\n垃圾回收是自动过程，无法强制执行。我们可以通过调用 `System.gc()` 来请求它。`JVM`\
  \ 不保证 GC 会立即启动。\n\n## 12. 下列哪项说法是不正确的？\n\n(a) Java 中的局部变量总是由默认值初始化的。\n(b) Java 中的局部变量在使用之前必须初始化。\n\
  (c) 内部块中的局部变量不能与外部块中的局部变量同名。\n(d) 同一层级的两个块中的局部变量可以有相同的名称。\n\n![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)\n\
  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n# ∞ 6 ∞\n## (继承)\n\n### 简介\n\n当一个类的属性转移到另一个类时，就称为继承。在这种情况下，被继承的类被称为超类、基类或父类，而继承的类被称为子类、子类或派生类。\n\
  \n继承允许我们通过添加额外功能来扩展现有的类（基类）。它鼓励代码的重用，这有助于减小代码量，尽管在某些情况下可能会导致复杂性。\n\n例如，假设我们已经完成了简单计算器的代码。之后我们需要开发一个科学计算器，那么我们有两种方案：\n\
  \n(i) 创建一个新类。（重写该类）\n(ii) 扩展该类。\n\n在大多数情况下，第二种方案是更好的选择。在这种情况下，我们只需要编写一小段代码。同时，我们不需要在调试和测试上花费大量时间，因为基类已经过测试并且已经使用了很久。当我们需要将一个类继承另一个类时，必须使用\
  \ `extends` 关键字。\n\n**语法：** `class sub_class extends base_class`\n\n![image](img/image087.png)\n\
  \n类 `A`（超类、基类或父类）。\n类 `B`（子类、派生类或子类）。\n\n子类将拥有基类的所有特征，外加上扩展类中定义的新特征。Java 不支持多重继承，但支持多接口继承，因此子类只能继承一个基类。\n\
  \n**示例 6.1：**\n\n```java\n1. class A\n2. {\n3.    int x;\n4.    void setX(int x1)\n\
  5.    {\n6.    x = x1;\n7.    }\n8.    void displayX()\n9.    {\n10.   System.out.println(x);\n\
  11.   }\n12. }\n13. class B extends A\n14. {\n15.   int y;\n16.   void setY(int\
  \ y1)\n17.   {\n18.   y = y1;\n19.   }\n20.   void displayY()\n21.   {\n22.   System.out.println(y);\n\
  23.   }\n24. }\n25. class InheritTest\n26. {\n27.   public static void main(String\
  \ args[])\n28.   {\n29.     A a1 = new A();\n30.     a1.setX(5);\n31.     a1.displayX();\n\
  32.     B b1 = new B();\n33.     b1.setX(10);\n34.     b1.setY(20);\n35.     b1.displayX();\n\
  36.     b1.displayY();\n37.   }\n38. }\n```\n\n**输出：**\n```\n5\n10\n20\n```\n\n\
  ### 成员隐藏\n\n如果子类成员与超类成员的名称（对于方法而言为签名）相同，那么它会隐藏超类成员。虽然两个成员在子类中都是可用的，但使用成员名称时只能访问子类成员。\n\
  \n### 使用 super 关键字\n\n每当子类需要引用其直接超类时，可以通过 `super` 关键字来实现。`super` 有两个通用用途：\n\n1.\
  \ 调用超类的构造函数：子类可以通过以下形式 `super(parameter-list);` 调用超类的构造方法。这里 `parameter-list` 指定了超类构造函数所需的参数。事实上，`super()`\
  \ 必须是子类构造函数内部的第一条语句。\n2. 访问被子类隐藏的超类成员：关键字 `super` 可以如下方式访问超类的隐藏成员：`super.member;`。这里\
  \ `member` 可以是方法或数据成员。\n\n### 方法重载与方法重写\n\n方法重载\n当两个或多个方法的名称相同但参数不同时，被称为方法重载。方法重载用于对象需要执行相似任务但使用不同输入参数。当我们调用方法时，`java`\
  \ 首先匹配方法名称，然后匹配参数的数量和类型。决定调用哪个方法定义被称为多态。\n\n方法重写\n我们已经看到超类中的方法被子类继承并由子类创建的对象使用。方法继承允许我们在子类中重复定义和使用方法，而无需再次定义。在类层次结构中，当子类的实例方法与其超类中的非私有实例方法的名称和签名相同时，子类中的方法被称为重写了超类中的方法。当在子类内部调用重写的方法时，它将始终引用子类定义的该方法版本。超类定义的方法版本将被隐藏。\n\
  \n\n\n\n\n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\black_star_logo.jpg](img/image080.jpg)\n\
  \n### 示例 6.2\n\n```java\nclass A\n{\n    int x;\n    void set(int x1)\n    {\n \
  \       x = x1;\n    }\n    void display()\n    {\n        System.out.println(x);\n\
  \    }\n}\nclass B extends A\n{\n    int y;\n    void set(int x1,int y1) // 类 B\
  \ 的 set 方法没有重写类 A 的 set\n    // 方法，因为参数不同\n    {\n        set(x1);  //这将调用类 A 的\
  \ set()\n        y = y1;\n    }\n    void display() // 类 B 的 display 方法重写了\n   \
  \ // 类 A 的 display 方法\n    {\n        //  display();  这将会调用类 B 的 display\n     \
  \   super.display(); // 这将调用类 A 的 display\n        System.out.println(y);\n    }\n\
  }\nclass InheritTest2\n{\n    public static void main(String args[])\n    {\n  \
  \      B b1 = new B();\n        b1.set(10,20);\n        b1.display();\n    }\n}\n\
  ```\n\n**输出：**\n```\n10\n20\n```\n\nJava 支持以下继承形式：\n\n[1] 单级继承。\n[2] 多级继承。\n[3]\
  \ 层级继承。\n\n### [1] 单级继承。\n\n![image](img/image042.png)\n\n### 示例 6.3:\n\n```java\n\
  class A\n{\n    private int x;\n    A()\n    {\n        x = 0;\n    }\n    A(int\
  \ x1)\n    {\n        x = x1;\n    }\n    void display()\n    {\n        System.out.print(x);\n\
  \    }\n}\nclass B extends A\n{\n    private int y;\n    B()\n    {\n        super();\n\
  \        //x=0;  因为 x 是私有的，此处报错\n        y=0;\n    }\n    B(int x1, int y1)\n  \
  \  {\n        super(x1);\n        //x = x1; 因为 x 是私有的，此处报错\n        y = y1;\n  \
  \  }\n    void display()\n    {\n        super.display();\n        System.out.print(y);\n\
  \    }\n}\nclass InheritTest3\n{\n    public static void main(String args[])\n \
  \   {\n        B b1 = new B();\n        b1.display();\n        B b2 = new B(10,20);\n\
  \        b2.display();\n    }\n}\n```\n\n**输出：**\n```\n0 0 10 20\n```\n\n---\n\n\
  ### [2] 多级继承。\n\n![image](img/image018.png)\n\n### 示例 6.4\n\n```java\nclass A\n\
  {\n    private int x;\n    A()\n    {\n        x = 0;\n    }\n    A(int x1)\n  \
  \  {\n        x = x1;\n    }\n    void display()\n    {\n        System.out.println(x);\n\
  \    }\n}\nclass B extends A\n{\n    private int y;\n    B()\n    {\n        super();\n\
  \        y = 0;\n    }\n    B(int x1, int y1)\n    {\n        super(x1);\n     \
  \   y = y1;\n    }\n    void display()\n    {\n        super.display();\n      \
  \  System.out.println(y);\n    }\n}\nclass C extends B\n{\n    private int z;\n\
  \    C()\n    {\n        super();\n        z = 0;\n    }\n    C(int x1, int y1)\n\
  \    {\n        super(x1);\n        z = y1;\n    }\n    void display()\n    {\n\
  \        super.display();\n        System.out.println(z);\n    }\n}\nclass InheritTest4\n\
  {\n    public static void main(String args[])\n    {\n        C c1 = new C();\n\
  \        c1.display();\n        C c2 = new C(10,20);\n        c2.display();\n  \
  \  }\n}\n```\n\n**输出：**\n```\n0\n0\n0\n10\n0\n20\n```\n\n---\n\n### [3] 层级继承。\n\n\
  ![image](img/image12.png)\n\n#### 构造函数的调用顺序：\n\n当类层次结构被创建时，构造函数的调用顺序是：父类到子类。无论你是否显式调用\
  \ `super()`，子类的构造函数都会首先调用父类的无参构造函数（除非显式调用了带参构造函数）。\n\n```java\nclass A\n{\n    A()\n\
  \    {\n        System.out.println(\"A constructor\");\n    }\n}\nclass B extends\
  \ A\n{\n    B()\n    {\n        System.out.println(\"B constructor\");\n    }\n\
  }\nclass C extends A\n{\n    C()\n    {\n        System.out.println(\"C constructor\"\
  );\n    }\n}\nclass InheritTest5\n{\n    public static void main(String args[])\n\
  \    {\n        B b = new B();\n        C c = new C();\n    }\n}\n```\n\n**输出：**\n\
  ```\nA constructor\nB constructor\nA constructor\nC constructor\n```\n\n### 动态方法绑定（动态方法派发或运行时绑定）：\n\
  \n方法重写是 Java 强大概念之一的基础。动态方法派发是在运行时解析重写实例方法的机制，而不是在编译时。动态方法派发非常重要，因为这是 Java 实现运行时多态的方式。\n\
  \n通过父类引用调用重写方法时，Java 会根据调用时对象的类型来确定执行哪个版本的方法。因此，这种决定是在运行时进行的，取决于被引用的对象的类型，而不是引用的变量类型。\n\
  \n### 示例 6.5\n\n```java\nclass Shape\n{\n    void getdata()\n    {\n        System.out.println(\"\
  getdata() of Shape\");\n    }\n    void area()\n    {\n        System.out.println(\"\
  area() of Shape\");\n    }\n    void display()\n    {\n        System.out.println(\"\
  display() of Shape\");\n    }\n}\nclass Circle extends Shape\n{\n    void getdata()\n\
  \    {\n        System.out.println(\"getdata() of Circle\");\n    }\n    void area()\n\
  \    {\n        System.out.println(\"area() of Circle\");\n    }\n    void display()\n\
  \    {\n        System.out.println(\"display() of Circle\");\n    }\n}\nclass Rectangle\
  \ extends Shape\n{\n    void getdata()\n    {\n        System.out.println(\"getdata()\
  \ of Rectangle\");\n    }\n    void area()\n    {\n        System.out.println(\"\
  area() of Rectangle\");\n    }\n    void display()\n    {\n        System.out.println(\"\
  display() of Rectangle\");\n    }\n}\nclass InheritTest5\n{\n    public static void\
  \ main(String args[])\n    {\n        // 父类引用变量可以接受子类对象\n        // 动态绑定\n     \
  \   Shape s[]={new Circle(), new Rectangle()};\n        for(int i=0;i<s.length;i++)\n\
  \        {\n            s[i].getdata();\n            s[i].area();\n            s[i].display();\n\
  \        }\n    }\n}\n```\n\n**输出：**\n```\ngetdata() of Circle\narea() of Circle\n\
  display() of Circle\ngetdata() of Rectangle\narea() of Rectangle\ndisplay() of Rectangle\n\
  ```\n\n\n\n\n60. `}`\n\n输出:\n\n`getdata()` of `Circle`\n`area()` of `Circle`\n`display()`\
  \ of `Circle`\n`getdata()` of `Rectangle`\n`area()` of `Rectangle`\n`display()`\
  \ of `Rectangle`\n\n### 抽象类与抽象方法\n\n我们已经看到，通过将方法标记为 `final`，我们可以确保该方法在子类中不被重定义。`Java`\
  \ 允许我们进行与此完全相反的操作。也就是说我们可以指定某个方法必须在子类中被重定义，从而使重写成为强制性。这是通过方法定义中使用修饰关键字 `abstract`\
  \ 实现的。\n\n某些情况下，我们希望定义一个父类，该父类声明了某个抽象的结构，但不提供每个方法的完整实现。也就是说，有时我们想要创建一个父类，它只定义一个所有子类共享的通用形式，而将细节留给每个子类去填充。\n\
  \n这种类决定了子类必须实现的方法的性质。这种情况发生的一种方式是父类无法为某个方法创建有意义的实现。\n\n要声明抽象方法，请使用以下通用形式：\n\n`abstract\
  \ return_type name (parameter-list);`\n\n没有任何实现。任何包含一个或多个抽象方法的类也必须声明为 `abstract`。要声明一个类为\
  \ `abstract`，我们只需要在声明开头的 `class` 关键字前面使用 `abstract` 关键字。\n\n抽象类不能有对象。也就是说，抽象类不能用\
  \ `new` 操作符直接实例化。这样的对象是无用的，因为抽象类没有被完全定义。\n\n此外，我们不能声明抽象构造函数或抽象静态方法。抽象类的任何子类必须实现父类中所有的抽象方法，要么本身被声明为抽象。\n\
  \n### 示例 6.6:\n\n```java\nabstract class Shape\n{\n    abstract void getdata();\n\
  \    abstract void area();\n    abstract void display();\n}\nclass Circle extends\
  \ Shape\n{\n    void getdata()\n    {\n        System.out.println(\"getdata() of\
  \ Circle\");\n    }\n    void area()\n    {\n        System.out.println(\"area()\
  \ of Circle\");\n    }\n    void display()\n    {\n        System.out.println(\"\
  display() of Circle\");\n    }\n}\nclass Rectangle extends Shape\n{\n    void getdata()\n\
  \    {\n        System.out.println(\"getdata() of Rectangle\");\n    }\n    void\
  \ area()\n    {\n        System.out.println(\"area() of Rectangle\");\n    }\n \
  \   void display()\n    {\n        System.out.println(\"display() of Rectangle\"\
  );\n    }\n}\nclass InheritTest6\n{\n    public static void main(String args[])\n\
  \    {\n        //父类引用变量可以接受子类对象\n        //动态绑定\n        Shape s[]={new Circle(),\
  \ new Rectangle()};\n        for(int i=0;i<s.length;i++)\n        {\n          \
  \  s[i].getdata();\n            s[i].area();\n            s[i].display();\n    \
  \    }\n    }\n}\n```\n\n输出:\n\n`getdata()` of `Circle`\n`area()` of `Circle`\n\
  `display()` of `Circle`\n`getdata()` of `Rectangle`\n`area()` of `Rectangle`\n`display()`\
  \ of `Rectangle`\n\n### Final 方法\n\n如果我们不希望一个方法被派生类方法重写，那么可以将基类方法定义为 `final`。任何重写该方法的尝试都会导致编译时错误。\n\
  \n```java\nclass A\n{\n    final void method1()\n    {\n        -----\n    }\n}\n\
  class B extends A\n{\n    void method1()  // error\n    {\n        -----\n    }\n\
  }\n```\n\n### Final 类\n\n有时出于安全考虑，我们可能希望防止类被进一步子类化。不能被子类的类被称为 `final` 类。在 `java`\
  \ 中通过如下使用 `final` 关键字来实现：\n\n```java\nfinal class A1\n{\n    - - - - - -\n    -\
  \ - - - - -\n}\nclass B extends A    // error\n{\n    - - - - - - -\n    - - - -\
  \ - - -\n}\n```\n\n任何继承类 `A` 的尝试都会导致错误，编译器将不允许。声明类 `A` 会防止任何继承。声明类 `A` 会防止进一步的子类化。\n\
  \n### 理论题：\n\n1. 什么是继承？\n2. 有多少种类型的继承？\n3. 默认构造函数和参数化构造函数之间有什么区别？\n4. final 类和 final\
  \ 方法之间有什么区别？\n5. 什么是父类？\n6. 什么是抽象类？\n7. 编译时绑定和运行时绑定有什么区别？\n8. 方法重载和方法重写之间有什么区别？\n\
  \n# 第 7 章：（面向对象编程）\n\n## 引言\n\n面向对象编程 vs 过程化：\n\n所有程序都由两个元素组成：过程（逻辑）和数据。取决于关注点是处理还是数据，可以有两种方法。过程化语言（c,\
  \ PASCAL, COBOL 等）关注“正在发生什么”（过程），而较少关注“谁在运行”（数据）。随着程序变得庞大，过程化方法变得越来越不适用。开发面向对象的编程语言是为了克服过程化语言的局限性。与过程化语言相比，面向对象的程序相对复杂性较低。\n\
  \n这两种方法的主要区别总结如下：\n\n(i) 面向对象的程序以数据为中心，而过程化语言的程序以过程为中心。\n\n(ii) 面向对象的程序围绕数据（对象）组织，因此能更好地模拟真实世界对象。\n\
  \n(iii) 与过程化方法相比，面向对象方法的代码重用和扩展性非常高。因此代码量较小。\n\n(iv) 面向对象的程序更容易维护，因为它们相对不复杂且尺寸较小。\n\
  \n(v) 面向对象的程序基于自下而上的设计方法，而过程化程序基于自上而下的设计方法。\n\nJava 是基于面向范式的。Java 几乎是面向对象的语言。我们之所以用“几乎”，是因为出于性能考虑，Java\
  \ 也支持基本数据类型。C++ 不是纯的面向对象语言。C++ 是 C 的扩展，因此它使用一种混合了面向过程和面向对象的方法。\n\n## OOP（面向对象编程）的基本概念：\n\
  \n下面是面向对象编程的一些基本元素：\n\n*   抽象\n*   对象和类\n*   三大 OOP 原则：\n    *   封装\n    *   继承\n\
  \    *   多态\n*   持久化\n*   泛型\n*   组合 / 聚合\n\n### 1. 抽象\n\n抽象包括过程化语言在内的任何编程语言的基本元素之一。内置数据类型的概念也是一种抽象。在\
  \ `C` 语言中使用 `struct` 定义自定义数据类型进一步扩展了这种抽象。\n\n抽象的基本目的是通过隐藏细节来降低复杂性。例如，建筑并不被看作建筑材料的集合，而是一个具有独特特征和属性的定义良好的对象。\n\
  \n面向对象的编程语言使用类和对象来模拟抽象。\n\n### 2. 对象和类：\n\n\n\n\n\n# 对象 (Object)\n对象是一个物理或抽象的实体或事物，与其他相似类型的对象区分开来。对象具有三个特征：\n\
  \n(i) 标识性（Identification）。\n(ii) 属性（Attributes）。\n(iii) 行为（Beiors / Operations /\
  \ Functions）。\n\n对象也可以被视为类的实例（instance），其中类类似于内置数据类型，而对象是变量。\n\n# 类 (Class)\n类通过抽象对象的属性和行为来表示一类对象。类可以被视为创建对象的蓝图。对象具有其类定义的属性和行为。类可以被视为用户定义的数据类型，而对象是该类所代表的数据类型的变量/实例。\n\
  \n对象的属性/特征由 `Java` 中的数据成员/字段（data members / fields）定义。类中的数据成员/字段是一个可以存储数据的变量。对象的行为/操作是使用\
  \ `Java` 中的方法（methods）定义的。数据成员和方法统称为类的成员（members）。\n\n类也可以被视为用户定义的数据类型，而对象是该数据类型的变量。一旦定义了类，我们就可以创建任意数量属于该类的对象。\n\
  \n# 三大 OOP 原则 (Three OOP Principles)\n\n## 封装 (Encapsulation)\n封装是将代码及其在其上操作的数据绑定在一起的机制。`Java`\
  \ 类支持这一点，因为它允许我们把代码和数据定义在一起。封装还通过将某些类成员声明为 `private` 来帮助数据隐藏，使得它们无法从不该类的代码中访问。\n\
  \n## 继承 (Inheritance)\n在面向对象编程中，继承指的是一个类的属性对被称为子类（sub-classes）或派生类（derived classes）的其他类可用。子类或派生类是从现有类派生出来的类。它继承现有类的所有特征，现有类也被称为基类（base-class）或超类（super-class）。因此，继承可以定义为从超类或基类派生类的过程。继承类不会给基类/超类引入任何更改。与基类相比，派生类具有更广泛的属性和行为。\n\
  \n继承的主要优势是代码重用。如果基类已经使用了很长时间，并且需要添加一些额外的属性和方法，我们可以通过派生另一个类来实现。派生类将可以使用基类的代码而无需调试，因为它已经使用了很长时间。\n\
  \n### 类层次结构 (Class Hierarchy)\n所有派生自共同基类的类都属于一个家族并形成类层次结构。类层次结构可以与树结构相比，其中一个基类位于根节点且没有超类。\n\
  \n所有其他类要么派生自层次结构根节点的类，要么派生自另一个类（该类直接或间接地派生自根类）。随着我们向下移动，添加的功能越来越多。由叶节点表示的类没有任何子类。以下示例展示了一些类层次结构。\n\
  \n![image](img/image088.png)\n\n## 多态 (Polymorphism)\n多态是一种允许同一个接口用于通用类动作的特性。大多数面向对象的语言在以下情况下使用多态：\n\
  \n* 运算符重载（Operator Overloading）。\n* 方法重载（Method Overloading）。\n* 方法重写（Method Overriding）。\n\
  \n### 运算符重载\n大多数语言对内置操作使用这种多态。例如，`C/C++` 或 `Java` 中的所有算术运算符都可以用于许多类型的操作数（`int`、`long`、`float`、`double`\
  \ 等）。因此，相同的加法运算符可以加两个整数，也可以加两个浮点数。\n\n`C++` 允许用户重载内置运算符。例如，我们可以重载算术运算符来处理复数。虽然 `Java`\
  \ 对内置运算符使用了运算符重载，但它不允许用户重载运算符。\n\n### 方法重载\n此特性允许我们编写多个具有相同名称的方法。`C++` 和 `Java`\
  \ 具有这一特性。具有相同名称的方法（`C++` 中的函数）根据参数（参数）进行区分。重载的方法必须具有不同数量的参数，或者如果参数数量相同时参数的类型不同。\n\
  \n如果对重载方法的调用可以在编译时解析（即如果编译器可以决定调用哪个重载方法），则被称为静态绑定（static binding），它是编译时多态的例子。\n\n\
  如果对重载方法的调用无法在编译时解析（即如果编译器无法决定调用哪个重载方法），则被称为动态绑定（dynamic binding），它是运行时多态的例子。\n\n\
  通常情况下，Java 在运行时解析对重载方法的调用，但在许多情况下，对重载方法的调用调是在编译时解析的。\n\n### 方法重写 (Method Overriding)\n\
  子类可以定义一个与超类名称相同、参数数量和类型也相同的方法。这被称为方法重写。\n\n编译器无法解析对重写方法的调用。`Java` 通常使用动态绑定来解析对重写方法的调用，即决策发生在运行时。\n\
  \n# 持久化 (Persistence)\n一些面向对象的语言允许我们从持久化存储介质（如辅助存储等永久存储介质）存储/检索程序的状态。这被称为持久化。\n\n\
  `Java`允许我们在辅助存储中存储任何对象并在检索它。如果我们尝试在对象图的顶端存储一个对象，所有其他引用的对象将被递归地定位并保存。同样，当以后检索对象时，所有的对象及其引用都会在内存中正确创建（即整个对象图）。\n\
  \n# 泛型 (Genericity)\n独立于任何特定数据类型定义算法，然后在无需额外努力的情况下将该算法应用于多种数据类型的概念被称为泛型。`C++` 使用模板（templates）支持这一特性。`Java`\
  \ 也通过 `Object` 类支持这一特性，该类位于 Java 中任何类层次结构的顶端。\n\n例如，使用这一特性，我们可以实现一个泛型数据类型栈，以便栈中可以存储任何类型的元素。这一特性在很大程度上提高了重用性。\n\
  \n# 组合/聚合 (Composition / Aggregation)\n对象可能由其他对象组成。这样的对象被称为复合对象或聚合对象。例如，如果将 `vehicle`\
  \ 类的对象定义为由 `Engine`、`Body`、`Axle`、`Seats` 等对象组成的复合对象，这是合适的。\n\n## 继承与组合 (v/s)\n\
  从现有类派生新类有两种基本机制：继承和组合。`Bus` 类可以通过继承 `vehicle` 类的属性来派生。这里 `Bus` 是一种车辆，除了所有车辆共有的属性和行为外，它还有额外的属性/行为。\n\
  \n换句话说，`Bus` 类与 `vehicle` 类之间是“is-a”的关系，因为说 `Bus` 是一辆车辆。\n\n`vehicle` 类本身可能通过组合派自许多其他类。例如，`vehicle`\
  \ 类的对象可能由属于 `Engine`、`Gear Box`、`Seats`、`Driver’s Seat Body` 和 `Steering Wheel`\
  \ 等类的对象组成。\n\n\n\n\n在此例中，派生类与表示复合对象部分的类之间具有整体与部分的关系。我们不能说 `vehicle` 是一个 `Engine`\
  \ 或 `Vehicle` 是一个 `Gear Box`，因为 `Vehicle`是由许多部分组成的。\n\n# 超类与子类\n\n通常情况下，一个类的对象同样也是另一个类的“对象”。一个\
  \ `rectangle` 确实是一个 `quadilateral`（`squares`、`parallelograms` 和 `trapezoids` 也是如此）。因此可以说\
  \ `Rectangle` 类继承自 `Quadrilateral` 类。在这里，Quadrilateral` 类是超类，而 `Rectangle` 类是子类。\n\
  \n`rectangle` 是 `quadilateral` 的一种特定类型，但声称 `quadilateral` 是 `rectangle` 是错误的（`quadilateral`\
  \ 可能是 `parallelogram`）。图中展示了超类和潜在子类的几个简单继承示例。继承通常产生的子类比其超类具有更多的特征，因此超类和子类这两个术语可能会引起混淆。\n\
  \n然而，还有另一种完全合理的视角来看这些术语。因为每个子类对象都是其超类的对象，而且由于一个超类可以有多个子类，所以一个超类表示的对象集合通常比该超类的任何子类所表示的对象集合大。\n\
  \n例如，超类 `Vehicle` 以泛泛的方式表示所有车辆，如 `cars`、`trucks`、`boats`、`bicycles` 等。然而，子类 `Car`\
  \ 仅代表世界上所有 `Vehicles` 中的一小部分。继承关系构了树形的层级结构。\n\n超类与其子类之间存在层级关系。一个类确实可以独立存在，但只有当类被用于继承机制时，它才会成为为其他类提供属性和行为的超类，或者成为继承这些属性和行为的子类。经常，一个类既是子类也是超类。\n\
  \n| 超类 | 子类 |\n| :--- | :--- |\n| Student | Graduate student, Under student |\n\
  | Shape | Circle, Triangle, Rectangle |\n| Loan | Car Loan, Home Loan, Education\
  \ Loan |\n| Employee | Faculty Member, Staff Member |\n| Account | Checking Account,\
  \ Saving Account |\n\n![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)\n\
  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n\n# ∞ 8 ∞\n\n## (包)\n\n## 引言\n\n\
  当我们处理一个项目时，必须将程序拆分成几个类。为了组织这些类，我们使用 `Packages`。包既是一种命名机制，也是一种可见性控制机制。包是相互关联的类和接口的集合。在包的帮助下，只要它们定义在不同的包中，就可以给多个类赋予相同的名称。\n\
  \n单个包不能包含两个同名的类。\n\n`PROGRAMS` 被组织为多个包的集合。每个包都有自己的一组子包，这有助于防止命名冲突。顶层包只有在被声明为 `public`\
  \ 的情况下才能在包外部被访问。包的命名结构是层级的。包的成员是类类型、接口类型和子包。`java` 中的包是一种封装机制，可用于将相关的类、接口和子包分组。\n\
  \n对于小型程序，包可以是未命名的或具有简单的名称，但如果代码要广泛分发，应该选择唯一的包名。\n\n这可以防止当两个开发小组恰好选择了相同的包名，且这些包后来被用于同一个程序时，可能发生的冲突。如果我们没有为\
  \ `java` 类指定包，那么该类将是 Java 默认包的一部分，称为“未命名包”。但这要求每个类都必须有唯一的名称以避免冲突。\n\n### 未命名包的示例\n\
  \n```java\nclass A\n{\n    // ...\n}\n\nclass A_demo\n{\n    public static void\
  \ main(String args[])\n    {\n        // ...\n    }\n}\n```\n\n### 如何定义包\n\n要创建一个包，请在\
  \ Java 源文件的第一条语句中包含 `package` 命令。在该文件中声明的任何类都将属于指定的包。`package` 语句定义了存储类的命名空间。如果我们省略了\
  \ `package` 语句，类名将被放入默认包中，该包没有名称，被称为未命名包。\n\n`package` 语句的语法格式如下：\n\n```\npackage\
  \ package_name;\n```\n\nJava 使用文件系统目录来存储包。记住大小写是敏感的，且目录名必须与包名完全匹配。多个文件可以包含同一个 `package`\
  \ 语句。\n\n**语法：**\n\n```java\npackage p1;    //包声明\nclass A      //类声明\n{\n    //类\
  \ A 的主体\n}\n```\n\n`package` 是一个关键字。`p1` 是类 `A` 将要存储的包名。\n\n**示例 8.1：**\n\n```java\n\
  1.  package p1;\n2.  class A\n3.    {\n4.      public static void main(String args[])\n\
  5.      {\n6.        System.out.println(\"First Package program.\");\n7.      }\n\
  8.    }\n```\n\n我们假设当前文件夹是 `(c:\\javaprg\\)`。\n\n```bash\nc:\\javaprg>javac A\n\
  c:\\javaprg>java p1.A\n```\n**输出：**\nFirst Package program.注意：如果我们使用 `-d c:\\javaprg`\
  \ 编译上述内容，将会创建 `p1` 文件夹并将 .class 文件放置其中。\n\n```bash\nc:\\javaprg>javac -d c:\\javaprg\
  \ A\n```\n\n### 导入包\n\n所有内置类都存储在命名的包中。由于类必须带有完整的包名，为每个类输入路径会非常繁琐。`import` 语句是将某些类或整个包引入命名空间的便利方法。\n\
  \n`import` 语句紧随 `package` 语句（如果存在），位于类定义之前。这是 `import` 的通用形式：\n\n```\nimport p1.classname;\n\
  import p1.*;\n```\n\n**示例 8.2：**\n\n```java\n1. //使用包打印 10 个随机数\n2. //未使用 import\
  \ 语句\n3. class Random1\n4. {\n5.    public static void main(String args[])\n6. \
  \   {\n7.        java.util.Random r1 = new java.util.Random();\n8.        for(int\
  \ i=1;i<=10;i++)\n9.        {\n10.           System.out.println(Math.abs(r1.nextInt()));\n\
  11.       }\n12.   }\n13. }\n```\n\n```bash\nc:\\javaprg>javac Random1\nc:\\javaprg>java\
  \ Random1\n```\n**输出：**\n158862541\n1154462827\n452959606\n1235134497\n1421490552\n\
  1065881855\n424893046\n731473166\n1217844570\n437181304\n\n**示例 8.3：**\n\n```java\n\
  1. //使用包类打印 10 个随机数\n2. //使用 import 语句\n3. import java.util.Random;\n4. class RandomTest2\n\
  5. {\n6.    public static void main(String args[])\n7.    {\n8.        Random r1\
  \ = new Random();\n9.        for(int i=1;i<=10;i++)\n10.       {\n11.          \
  \ System.out.println(Math.abs(r1.nextInt()));\n12.       }\n13.   }\n14. }\n```\n\
  \n```bash\nc:\\javaprg>javac RandomTest2\nc:\\javaprg>java RandomTest2\n```\n**输出：**\n\
  686722541\n889442536\n1836112189\n320882863\n\n\n\n\n如果我们从当前文件夹以外的任何文件夹运行上述程序，它将无法运行。默认情况下，Java\
  \ 运行时系统使用当前工作目录作为起点。\n\n因此，如果我们的包在当前目录，或者在当前目录的子目录中，它将能够找到。但要从任何其他文件夹运行上述程序，我们必须在命令提示符中使用命令\
  \ `SET CLASSPATH=.;C:\\JAVAPRG` 来设置类路径。`CLASSPATH` 是一个环境变量。我们每次第一次启动计算机时都必须输入此命令。但如果我们将此命令置于`此电脑`\
  \ -> `属性` -> `高级` -> `环境变量` 中，那么就不再需要反复输入此命令了。\n\n我们也可以在不设置 `CLASSPATH` 环境变量的情况下运行该程序。这样做请输入：\n\
  \n```\njava –classpath c:\\javaprg p1.A\n```\n\n### 包的层次结构 (Package Hierarchy)\n\
  \n注意 4:-我们可以创建包的层级结构。要这样做，只需使用点将每个包名与其上一个包名隔开即可。多级包语句的一般形式为：\n\n```\npackage package_name1[.package_name2][.package_name3];\
  \ \n```\n\n包的层次结构必须反映在 Java 开发系统的文件系统中。例如，包 `java.awt.Image` 需要存储在 `java\\awt\\\
  image` (WINDOWS) 或 `java/awt/image` (UNIX) 或 `java:swt:image` (MACINTOSH) 文件系统中。\n\
  \n包的层次结构代表了 Java 类和接口的组织。它并不代表类和接口源代码组织。\n\n每个 Java 源文件（也称为编译单元）可以包含零或多个类和接口的定义，但编译器会为每一个定义生成一个包含\
  \ Java 字节码的单独类文件。类或接口可以使用包声明指示其 Java 字节码被放在特定的包中。\n\n* 包 `java` 有子包 `awt`、`applet`、`io`、`lang`、`net`\
  \ 和 `util`，但没有类或接口。\n* 包 `java.awt` 有名为 `image` 的子包，以及许多类和接口。\n* 因为包 `java.awt`\
  \ 有子包 `image`，所以它不能包含名为 `image` 的类或接口类型的声明。\n* 如果一个包的全限定名为 `P`，且 `Q` 是 `P` 的子包，那么\
  \ `P.Q` 就是该子包的全限定名。\n* 如果有一个名为 `mouse` 的包且包中有一个成员类 `Button`（这可能被引用为 `mouse.Button`），则不能存在全限定名为\
  \ `mouse.Button` 或 `mouse.Button.Click` 的包。\n* 一个源文件中最多只能出现一个包语句，且它必须是 Java 源文件的第一个语句。\n\
  \n### 类成员的可见性 (Visibility of class member)\n\n类和包都是封装和包含变量及方法命名空间及作用域的手段。包作为类和其他其他子级包的容器。类作为数据和方法代码的容器。\n\
  \n类是 Java 最小的抽象单元。由于类和包之间的相互作用，Java 处理了类成员的五种可见性类别。\n\n1. 类内部的可见性。\n2. 同一个包内子类中的可见性。\n\
  3. 同一个包内非子类的可见性。\n4. 不同包中子类中的可见性。\n5. 既不在同一个包中也不是子类的子类中的可见性。\n\n**注意 1:-** 顶级类和接口只有两种可能的访问权限：默认\
  \ (default) 和公有 (public)。\n**注意 2:-** 如果类被声明为 `public`，则可以通过其他代码访问。\n**注意 3:-**\
  \ 如果类具有默认访问权限，则只能被同一个包内的其他代码访问。\n**注意 4:-** 只有当类可见时，成员可见性才有意义。如果类的可见性修饰符是默认的，那么即使类的公共成员也只对包内可见。\n\
  \n### 访问修饰符 (Access specifiers)\n\n![image](img/image085.png)\n\n### JAR 文件 (Java\
  \ 归档文件)\n\n为了压缩文件，我们使用诸如 `winzip` 之类的程序，Java 的 JAR 功能也可以用于压缩整个 Java 包的层次结构。它为安装提供了更好的便利。\n\
  \n不需要在客户位置创建文件结构。我们只需要使用 JAR 文件，该文件将恢复整个文件结构。所有的包、子包和类文件都将从 JAR 文件自动创建。\n\nJAR 技术让软件的交付和安装变得简单。此外，JAR\
  \ 文件中的元素是压缩的，这使得下载 JAR 文件比单独下载几个未解压缩的文件要快得多。这允许消费者确定这些元素是由特定的组织或个人产生的。\n\nJAR 文件有以下选项：\n\
  \n| 选项 | 描述 |\n| :--- | :--- |\n| c | 创建一个新的归档。 |\n| C | 在命令执行期间更改目录。 |\n| f | 文件列表的第一个元素是要创建的归档名称。\
  \ |\n| i | 应提供索引信息。 |\n| m | 文件列表的第二个元素是外部清单文件（manifest）的名称。 |\n| M | 不创建清单文件 |\n\
  | t | 应列出归档内容。 |\n| u | 更新现有的 JAR 文件。 |\n| v | 工具执行时应提供详细输出。 |\n| x | 从归档中提取文件。\
  \ |\n| o | 不使用压缩 |\n\n#### 创建 JAR 文件\n\n```\nc:\\javaprg> jar -cf my.jar pack1\n\
  ```\n这将创建一个包含 `pack1` 所有文件的 JAR 文件。\n\n#### 提取 JAR 文件\n\n```\nc:\\javaprg> jar -xf\
  \ my.jar\n```\n\n#### 列出 JAR 文件内容\n\n```\nc:\\javaprg> jar -tf my.jar\n```\n\n####\
  \ 更新现有的 JAR 文件\n\n```\nc:\\javaprg> jar -uf my.jar pack2\n```\n\n#### 创建可执行的 JAR\
  \ 文件\n\n```\nc:\\javaprg> jar -cmf mainClass my.jar pack1\n```\n其中 `mainClass` 是一个文本文件，包含\
  \ `Main-Class: pack1.A`，并保存在 `javaprg` 文件夹中。\n\n#### 执行 JAR 文件\n\n```\nc:\\javaprg>\
  \ java -jar my.jar\n```\n\n# 理论题\n\n1. 我们对包有什么理解？\n2. 解释所有的修饰符及其在不同包、子包、子类和其他类中的作用域。\n\
  3. JAR 文件有什么用？\n4. `import` 语句的作用是什么？\n\n![image](img/image45.jpg)\n\n在 Amazon.com\
  \ 上搜索这本书，ISBN-978-1500730413。\n\n# 章\n\n# ∞ 9 ∞\n\n## (接口)\n\n––––––––\n\n### 引言\
  \ (Introduction)\n\n接口本质上是一种类。和类一样，接口包含方法和变量，但有一个主要的区别。区别在于接口只定义抽象方法和最终变量（常量）。这意味着接口不编写任何代码来实现这些方法，数据字段只包含常量。\n\
  \n因此，实现接口并定义实现代码是类的责任。在实践中，这意味着我们可以定义接口，而不对其实现方式做假设。接口的作用是将类的接口与其实现分离来。接口只定义类需要做什么，而不说如何做。\n\
  \n\n\n\n\n嵌套接口是指任何声明在另一个类或接口体内的接口。顶层接口是指嵌套嵌套接口。定义接口的语法与定义类非常相似。接口定义的通用形式如下：\n\n\
  ```java\ninterface interface_name\n{\n    variable declarations;\n    methods declarations;\n\
  }\n```\n\n在这里，`interface` 是关键字，`interface_name` 是任何有效的 Java 标识符（类似于类名）。\n\n**注意：**\
  \ 当我们定义一个接口时，默认情况下它是 `public`（公共）且 `abstract`（抽象的）。\n\n### 接口修饰符\n顶层接口可以使用的唯一修饰符是\
  \ `abstract` 和 `public`。即使我们不使用 `abstract` 修饰符，接口也会隐式地声明为 `abstract`，因此不需要使用 `abstract`\
  \ 修饰符。顶层接口的可见性可以是 `package`（包级）或 `public`，类似于顶层类。如果不使用可见性修饰符，则假设接口的可见性为 `package`。\n\
  \n### 数据变量成员声明\n接口中只能定义常量。接口中的所有变量都隐式地为 `public`、`final` 和 `static`，这意味着它们不能被实现类更改。它们还必须用常量值初始化。\n\
  \n```java\npublic static final type variable_name=value;\n```\n\n在接口中声明的变量是 `public`、`static`\
  \ 且 `final`。这意味着它是具有公共访问权限的静态变量。该变量也被声明为 `final`，这意味着它必须在声明时赋值，并且之后不能再修改。`final`\
  \ 关键字类似于 C/C++ 中的 `const`。\n\n### 方法声明\n方法声明将仅包含方法列表，而不包含任何方法体语句。它们在参数列表之后以分号结束。它们本质上是\
  \ `abstract` 方法，并且接口中指定的任何方法都不能有默认实现。\n\n接口中的所有方法默认始终是 `public` 和 `abstract` 修饰符的。我们不能在接口中声明\
  \ `static` 方法。\n\n```java\npublic abstract return_type method_name(parameter_list);\n\
  ```\n\n这里是一个包含两个变量和一个方法的接口定义示例。\n\n```java\ninterface item\n{\n    static final\
  \ int code = 1001;\n    static final String name = \"Matrix\";\n    abstract void\
  \ display( );\n}\n```\n\n**注意：** 方法的代码不包含在接口中，方法声明简单地以分号结束。\n\n另一个接口示例：\n\n```java\n\
  interface area\n{\n    float pi = 3.142f;\n    float compute (float x, float y);\n\
  \    void show( );\n}\n```\n\n### 扩展接口\n像类一样，接口也可以被扩展，即一个接口可以从其他接口派生。新接口将以子类的方式继承子接口的所有成员。这通过使用下所示的\
  \ `extends` 关键字实现。\n\n```java\ninterface interface_1\n{\n    int code = 1001;\n\
  \    String name = \"Matrix\";\n}\n\ninterface interface_2 extends interface_1\n\
  {\n    void display();\n}\n```\n\n`interface_2` 将继承常量 `code` 和 `name`。\n\n**注意：**\
  \ 变量 `name` 和 `codes` 是像普通变量一样声明的。这在这里是允许的，但接口中的所有变量都被视为常量、`public` 和 `static`，尽管这里没有\
  \ `public`、`static` 和 `final` 关键字。\n\n我们可以将多个接口组合成一个接口。以下声明是有效的。\n\n```java\ninterface\
  \ interface_1\n{\n    int code = 1001;\n    String name = \"Matrix\";\n}\n\ninterface\
  \ interface_2\n{\n    void display();\n}\n\ninterface interface_3 extends interface_1,\
  \ interface_2\n{\n}\n```\n\n**注意：** 始终记住，接口不能扩展类。这违反了接口只能有抽象方法和常量的规则。\n\n### 实现接口\n\
  接口被用作“超类”，其属性被类继承。因此，有必要创建一个继承接口的类。一旦定义了接口，一个或多个类就可以实现该接口。\n\n要实现接口，要在类定义中包含 `implements`\
  \ 子句，然后创建接口声明的方法。\n\n实现类必须提供所有接口中所有的方法体，否则它必须声明为 `abstract`。实现类还可以扩展一个类并实现多个接口。\n\
  \n```java\nmodifier class<class-name> implements<interface-name>\n{\n    body of\
  \ the class\n}\n```\n\n在类中实现接口的语法：\n\n```java\ninterface interface_name\n{\n}\n\n\
  class class _name implements interface_name\n{\n    Body of class\n}\n```\n\nJava\
  \ 不支持多继承，但它支持多接口继承，即一个类可以实现多个接口，如下所示：\n\n```java\nmodifiers class <class-name> implements\
  \ <interface-1>,<interface-2>,<interface-3>, ....<interface-n>\n{\n    body of class\n\
  }\n```\n\n**注意：** 当我们实现接口方法时，必须将其声明为 `public`。实现接口方法类似于重写（over-riding），因此我们不能降低可见性。\n\
  \n示例 9.1:\n```java\n1.  interface interface_1\n2.  {\n3.    void show(int x);\n\
  4.  }\n5.  class class_1 implements interface_1\n6.  {\n7.    public void show(int\
  \ x)\n8.    {\n9.    }\n10. }\n```\n\n示例 9.2 抽象类：\n```java\n1.  interface common\n\
  2.  {\n3.    push(int x);\n4.    void pop ( );\n5.  }\n6.  abstract class stack\
  \ implements common\n7.  {\n8.    \n9.  }\n```\n\n### 通过接口访问类对象\n我们可以声明使用接口而非类类型的对象引用。任何实现接口的类都可以通过这种变量进行引用。当我们通过这些引用之一调用方法时，将调用的是实际实例对应版本。这是接口的重要特性之一。要执行的方法在运行时查找，允许在代码编写之后创建类。调用代码可以通过接口进行分发，而无需了解“调用者”。这一过程类似于使用父类来访问子类。\n\
  \n与 Java 中的普通方法调用相比，在运行时查找方法会产生巨大的开销，因此我们应该避免在性能敏感的代码中使用接口。\n\n示例 9.3:\n```java\n\
  1.  interface Math_function\n2.  {\n3.    void display(int x);\n4.  }\n5.  class\
  \ Sqrt implements Math_function\n6.  {\n7.    public void display(int x)\n8.   \
  \ {\n9.      System.out.println(\"sqrt of x =\"+Math.sqrt(x));\n10.    }\n11.  }\n\
  12.  class Log implements Math_function\n13.  {\n14.    public void display(int\
  \ x)\n15.    {\n16.      System.out.println(\"log of x = \"+Math.log(x));\n17. \
  \   }\n18.  }\n19.  class Math_Demo\n20.  {\n21.    public static void main(String\
  \ args[])\n22.    {\n23.        Math_function f1 = new Sqrt();\n24.        Math_function\
  \ f2 = new Log();\n25.        f1.display(27);\n26.        f2.display(3);\n27.  \
  \      Math_function f3;\n28.        f3=f1; //多态（赋值引用）\n29.        f3.display(30);\n\
  30.    }\n31.  }\n```\n\n\n\n\n\n```java\n30.      f3=f2;  //多态（赋值引用）\n31.     \
  \ f3.display(5);\n32. }\n33. }\n```\n\n输出：\n\n![image](img/image072.png)\n\n## 接口的特性：\n\
  \n- `Interface` 是一个关键字。\n- `Interface` 可以被声明为抽象的（abstract），但它默认就是抽象的，因此无需添加 `abstract`\
  \ 关键字。\n- 所有变量始终是 `public static` 且 `final` 的。\n- 接口的所有方法必须在类中被实现。\n- 实现类实现的所有方法必须是\
  \ `public` 的。\n- `Interface` 仅包含方法的声明。\n- `Interface` 方法不能被声明为 `static`。它们总是被声明为实例方法。\n\
  - 类既不能缩小接口方法的访问权限，也不能在方法的 `throws` 子句中指定新的异常；因为尝试这样做等同于修改接口的契约，这种做法是不合法的。重写方法的准则也适用于实现接口方法。\n\
  - 在实现类中，所有方法都需要被定义为 `public`。\n- 此处允许 `abstract` 关键字进行部分实现。\n- 无论类直接或间接实现了多少接口，它对于在接口中可能有多个声明的方法，只提供单一的实现。\n\
  - 方法原型声明也可以像类一样进行重载。\n- 任何客户端（类或接口）都可以使用其完全限定名访问接口常量，无论该客户端是否扩展或实现了该接口。然而，如果客户端实现此接口的类或扩展此接口的接口，则客户端也可以直接访问此类常量，无需使用完全限定名。此类客户端继承了接口常量。\n\
  - 在接口常量多继承的情况下，任何名称冲突都可以使用相关常量的完全限定名来解决。\n\n## 接口变量：\n\n接口中的所有变量始终是 `public static`\
  \ 和 `final` 的，因为它们是实现类访问数据类型和方法的公共部分。\n\n## 接口变量的内存管理：\n\n静态变量在程序加载时总是获取内存，它们占用独立的内存，不与任何对象的内存共享。它们也被称为常量。可以使用接口名和\
  \ `{.}` 点操作符直接访问。\n\n### 示例 9.4\n\n```java\n1.    interface Static_Var\n2.    {\n\
  3.      int sun=1;\n4.      int mon=2;\n5.      int tues=3;\n6.      int wed=4;\n\
  7.      int thurs=5;\n8.      int fri=6;\n9.      int sat=7;\n10.     }\n11.   \
  \ class Week_Day implements Static_Var\n12.    {\n13.      public static void main(String\
  \ args[])\n14.      {\n15.        System.out.println(sun);\n16.        System.out.println(mon);\n\
  17.        System.out.println(tues);\n18.        System.out.println(wed);\n19. \
  \       System.out.println(thurs);\n20.        System.out.println(fri);\n21.   \
  \     System.out.println(sat);\n22.      }\n23.    }\n```\n\n或者\n\n```java\n11.\
  \    class Week_Day\n12.    {\n13.      public static void main(String args[])\n\
  14.      {\n15.        System.out.println(Static_Var.sun);\n16.        System.out.println(Static_Var.mon);\n\
  17.        System.out.println(Static_Var.tues);\n18.        System.out.println(Static_Var.wed);\n\
  19.        System.out.println(Static_Var.thurs);\n20.        System.out.println(Static_Var.fri);\n\
  21.        System.out.println(Static_Var.sat);\n22.      }\n23.    }\n```\n\n输出：\n\
  1\n2\n3\n4\n5\n6\n7 \n\n### 示例 9.5\n\n```java\n1.    interface Two_Methods\n2. \
  \     {\n3.        void m1( );\n4.        void m2( );\n5.      }\n6.    class Three_Methods\
  \ implements Two_methods\n7.      {\n8.        public void m1( )\n9.        {\n\
  10.        m1 的方法体;\n11.      }\n12.      public void m2( )\n13.        {\n14. \
  \       m2 的方法体;\n15.      }\n16.      public void m3( )\n17.        {\n18.    \
  \    m3 的方法体;\n19.      }\n20.    }\n21.    class Methods_Demo\n22.    {\n23.  \
  \    public static void main(String args[])\n24.      {\n25.        Two_methods\
  \ tm1 = new Three_methods();\n26.        tm1.m1();\n27.        tm1.m2();\n28.  \
  \      //tm1.m3(); 错误\n29.        Three_Methods tm2 = new Three_Methods();\n30.\
  \        tm2.m3();\n31.      }\n32.    }\n```\n注意：这里我们不使用接口引用调用 `m3()`，因为该方法在接口中没有声明。接口引用只能调用接口中声明的方法。\n\
  \n### 示例 9.6\n\n```java\n1.  interface Two_Methods\n2.  {\n3.    void m1( );\n4.\
  \    void m2( );\n5.  }\n6.  interface One_Method extends Two_Methods\n7.  {\n8.\
  \    void m3();\n9.  }\n10. class Three_Methods implements One_Method\n11. {\n12.\
  \   public void m1( )\n13.   {\n14.     m1 的方法体;\n15.   }\n16.   public void m2(\
  \ )\n17.   {\n18.     m2 的方法体;\n19.   }\n20.   public void m3( )\n21.   {\n22. \
  \    m3 的方法体;\n23.   }\n24. }\n25. class Methods_Demo\n26. {\n27.   public static\
  \ void main(String args[])\n28.   {\n29.     Two_Methods tm1 = new Three_methods();\n\
  30.     tm1.m1();\n31.     tm1.m2();\n32.     //tm1.m3(); 错误\n33.     Three_Methods\
  \ tm2 = new Three_Methods();\n34.     tm2.m3();\n35.   }\n36. }\n```\n\n\n\n这条规则的唯一例外是\
  \ `+` 和 `+=` 运算符，它们会拼接两个字符串并产生一个 `String` 对象。在 Java 中，字符数组不被视为字符串。在 Java 中，`String`\
  \ 类被用于执行所有的字符串操作。`String` 类和 `StringBuffer` 类是 `java.lang` 包的一部分。\n\n### String\
  \ 类：\n\n```java\nString s1 = new String(“matrix”);\nString s2 = “matrix”;\nSystem.out.println(s1);\n\
  System.out.println(s1.length);\nSystem.out.println(“matrix”.length);\n```\n\n`String`\
  \ 在 Java 中具有以下特征：\n\n---\n\n#### (i) String 是 Java 中的一个对象：\n\nString 代表一个字符序列，但与许多其他将\
  \ `String` 实现为字符数组的语言不同，Java 将字符串实现为 `string` 类型的对象。\n\n字符串操作是许多 Java 程序中最常见的部分。将字符串实现为内置对象允许\
  \ Java 能够提供全完整的功能，使得字符串处理变得方便。此外，字符串对象可以通过多种方式构建，以便在需要时轻松获取字符串。\n\n#### (ii) String\
  \ 是不可变的：\n\n字符串是不可变的，也就是说我们无法在创建后更改字符串。然而，声明为 `String` 引用的变量可以随时更改以指向另一个字符串对象。\n\
  \n我们仍然可以执行所有类型的字符串操作。每当我们需要现有字符串的修改版本时，就会创建一个新的新的字符串对象，其中包含了修改后的内容。\n\n原始字符串保持不变。使用这种方法是因为固定的、不可变的字符串比可变的字符串实现得更高效。\n\
  \n对于那些需要修改字符串的情况，有一个名为 `StringBuffer` 的伴随类，它的对象包含了在创建后可以被修改的字符串。\n\n#### (iii) String\
  \ 类是 final 的：\n\n`String` 和 `StringBuffer` 类都是 `final` 的。这意味着我们不能在其他类中扩展 `String`\
  \ 类。这允许进行某些优化，以提高常用字符串操作的性能。\n\n### String 类的构造方法与方法：\n\n| # | 说明 | 示例 |\n| :---\
  \ | :--- | :--- |\n| 1 | `public String( )` 初始化一个新创建的 `String` 对象，使其表示一个空字符序列。 |\
  \ `String s1 = new String( );` |\n| 2 | `public String(String str)` 初始化一个新创建的 `String`\
  \ 对象，使其与参数表示相同的字符序列；换句话说，新创建的字符串是参数字符串的拷贝。 | `String s1 = new String(“Matrix”);`String\
  \ s2 = new String(s1);` 字符串 `s2` 是字符串 `s1` 的拷贝。虽然内容相同，但 `s1` 和 `s2` 指向不同的字符串对象。\
