  ```\n\n# 第 17 章\n## (抽象窗口工具包 - AWT)\n\n### 简介\nJava 提供了大量的内置类，帮助帮助我们设计图形用户界面（GUI）。这些类中的大部分都属于\
  \ `java.awt` 包，统称为抽象窗口工具包（Abstract Windows Toolkit，AWT）。\n\n我们熟悉如 MS-WORD、MS-EXCEL\
  \ 等软件。所有这些软件都有 GUI，即当我们运行这些软件时，可以看到图形用户界面。\n\n我们通过通过键盘或鼠标选择不同的选项来访问这些软件的各种功能。显示用户界面需要进行大量的编程工作。\n\
  \nAWT 中帮助我们设计图形用户界面的三个重要部分是：\n* 组件（Components）\n* 容器（Containers）\n* 布局管理器（Layout\
  \ Managers）\n\n以上所有部分都起着重要的作用。\n\n### 组件（Components）\n组件是创建 GUI 的构建块。组件是具有图形化表示的对象，它可以显示在屏幕上并与用户交互。`java.awt.Component`\
  \ 类是与菜单相关的 AWT 组件的抽象父类。Component 类也可以被扩展以创建轻量级组件。轻量级组件是不与原生窗口关联的组件。\n\n某些组件类型（如按钮和滚动条）直接用于\
  \ GUI 控制。其他类型的组件（继承自 `Container` 类的）提供了特殊的组织方式。而 `TextField`、`TextArea`、`List` 等组件用于接受用户输入。标签（label）是一种不同的组件类型，其目的是为了标识其他组件。\n\
  \nJava 组件由 `java.awt.Component` 和 `java.awt.Menu` 父类的许多子类实现。组织大量类的一种方法是将它们分类：\n\n\
  ### 容器（Containers）\n所有的窗口应用程序都从一个显示在屏幕上的顶级窗口开始。同样，所有基于 GUI 的 Java 应用程序也从一个顶级窗口开始，在\
  \ Java 术语中被称为顶层容器。\n\n容器也是可以包含其他组件的 Java 组件。只有将组件添加到容器中或放入容器内时，组件才能变得可见。\n\n所有的\
  \ Java GUI 都位于 applet 或帧（Frame）中。applet 和 帧是 Java 中的两个顶层容器。\n\napplet 是 applet 的顶层容器，因此组件必须添加到其中。同样，帧是独立应用程序的顶层组件。\n\
  \n对于更复杂的 GUI，将 applet 或帧划分为更小的区域是方便的。这些区域可能构成例如工具栏或单选按钮矩阵。\n\n\n\n\n\n面板（Panels）就像应用程序和帧，可以包含其他组件，如按钮、画布、复选框、滚动条、滚动面板、文本区域、文本字段和其他面板。\n\
  \n复杂的 GUI 有时会有复杂的面板嵌套层级结构，即面板中嵌套面板，以此类推，跨越许多层嵌套。\n\n由于容器也是组件，因此由于继承关系，组件可用的方法也适用于容器。\n\
  \n容器最常用的方法是 `add()` 方法，通过该方法向容器中添加组件，其通用形式如下：\n\n```java\nvoid add (Component comp);\n\
  ```\n\n所有组件都是 `component` 类的子类，因此任何组件都可以使用 `add()` 方法被到容器中。\n\n### 布局管理器 (Layout\
  \ Manager)\n\n在向容器中添加组件时，一个重要问题与组件的位置和大小有关。组件的位置可以通过两种方式指定：\n\n(i) 绝对定位。\n\n(ii)\
  \ 相对定位。\n\n在**绝对定位**中，我们指定组件应该添加的精确位置。这种方法为我们提供了精细的控制，如果我们只为某一个平台设计 GUI，那么这可能是最佳选择。\n\
  \n例如，可以通过指定组件左上角的坐标，将组件添加在容器水平方向的中间。我们可以根据容器的宽度组件的宽度来计算这些坐标。但如果容器宽度改变或组件大小改变，组件将不会停留在中间。\n\
  \n另一种方法是**相对定位**，它可能不允许我们指定组件的精确位置，但在我们希望组件始终位于容器水平方向的中间的情况下，这种方法可能更为适用。我们可以通过指定组件的相对位置（如左、右、居中等）来实现这一点。在文字处理器中，将标题居中对齐是非常常见的。即使页面宽度发生变化，标题也会保持居中对齐，这就是相对定位的一个示例。\n\
  \n在 Java 中，可以使用绝对定位，但不建议这么做。AWT 的设计初衷是使用相对定位。我们可以通过相对规范来指定组件布局，例如：组件将添加到上一个组件的右侧、组件将添加到其他组件的下方、组件将出现在顶部、组件的大小将是容器宽度的\
  \ `1/4^(th)` 等，此类规范在不知道组件尺寸的情况下也有用。\n\nJava 鼓励相对定位，因为它是平台无关的，相同的 GUI 应该在不经修改的情况下运行在各种平台上。\n\
  \n称为布局管理器的内置 Java 类负责将相对位置映射到实际/物理位置的任务。Java 支持许多类型的布局管理器，我们将讨论以下布局管理器：\n\n1. `FlowLayout`\n\
  2. `GridLayout`\n3. `BorderLayout`\n4. `CardLayout`\n5. `GridBagLayout`\n\n####\
  \ 使用布局管理器时的注意事项：\n\n- 我们不必承担指定每个组件精确位置和尺寸的负担。\n- 我们不再拥有指定每个组件精确位置和尺寸的权力。\n\n###\
  \ 为什么 Java 要使用布局管理器？\n\n原因有两个：\n\n1. 理论上是因为，精确布局（即以像素为单位指定每个组件的大小和位置）是一项重复且经常执行的任务；因此，根据面向对象编程（OOP）原则，布局功能应当被封装在一个或多个类中以实现任务自动化。显然，布局管理器消除了许多开发中的繁琐工作。许多程序员起初不喜欢布局器的想法，但随着这些繁琐选择的消除，他们越来越欣赏它们。\n\
  \n2. 使用布局管理器的实际原因源于 Java 的平台无关性。在 Java 中，AWT 组件的行为借自于运行 JVM 的底层硬件的窗口系统。因此，在 Macintosh\
  \ 上，AWT 按钮与其他 Mac 按钮一样；在 Motif 平台上，Java 按钮看起来与其他任何 Motif 按钮一样，以此类推。这里的问题是，按钮和其他组件在不同平台上实例化时具有不同的尺寸。\n\
  \n如果 Java 鼓励精确的像素级尺寸控制和定位，那么会有大量的 Java GUI 在其原生平台上看起来精美，但在其他平台上看起来很糟糕甚至无法使用。如上文所述，布局管理器通过使用相对定位解决了这个问题。\n\
  \n### 布局策略 (Layout policy)\n\n每个 Java 组件都有一个首选尺寸（preferred size）。首选尺寸表示了组件希望有多大，前提是不与布局管理器发生冲突。首选尺寸通常是为以视觉上有意义的方式渲染组件所需的最小尺寸，例如，按钮的首选尺寸是其标签文本的大小，加上文本周围一小圈空白边框，再加上标记按钮边界的阴影装饰，因此按钮的首选尺寸是“恰好足够”。由于组件边界装饰在不同系统之间存在异，因此首选尺寸是取决于平台的。\n\
  \n当布局管理器对其容器的子组件进行布局时，它必须平衡两个考量：\n\n(i) 布局策略和\n(ii) 每个组件的首选尺寸\n\n首要任务是执行布局策略。如果尊重组件的首选尺寸意味着违反了布局策略，那么布局管理器将覆盖组件的首选尺寸。理解布局管理器意味着理解它将把组件放在哪里，以及它将如何处理组件的首选尺寸。\n\
  \n### 1. FlowLayout\n\n流式布局管理器的功能封装在 `java.awt.FlowLayout` 类中。流式布局管理器按水平行排列组件。它是面板和应用程序的默认布局管理器类型。流式布局管理器尽可能将尽可能多的组件放入第一行，并将其他组件移动到第二行。如果第二行没有剩余空间，组件将移动到第三行，以此类推。这与在文档中输入文字非常。\n\
  \n当我们到达当前行的末尾时，下一个单词将移动到下一行，以此类推。如果我们更改文档的宽度或高度，整个文档将重新格式化。组件始终按照它们添加到容器的顺序从左到右出现。\n\
  \n默认情况下，流式布局管理器在水平和垂直方向上留有五个像素的间隙。可以通过调用 `FlowLayout` 构造器的重载并并所需的水平垂直间隙来更改此默认。在每一行中，组件间距均匀，组件簇居中。簇的对齐（有时称为“对齐”）可以通过向\
  \ `FlowLayout` 构造器传递参数来控制。可能值为：\n\n- `FlowLayout.LEFT`\n- `FlowLayout.CENTER`\n\
  - `FlowLayout.RIGHT`\n\n示例 17.1:\n\n```java\nimport java.awt.*;\nclass My1 {\n \
  \   public static void main(String args[ ]) {\n        Frame f=new Frame( );\n \
  \       FlowLayout flow=new FlowLayout();\n        f.setLayout(flow);\n        Label\
  \ l1 = new Label(\"Name : \");\n        f.add(l1);\n        TextField tf1=new TextField(\"\
  Matrix\");\n        f.add(tf1);\n        tf1.setBackground(Color.green);\n     \
  \   tf1.setForeground(Color.red);\n        Button b1 = new Button(\"ok\");\n   \
  \     Font f1 = new Font(\"Arial\", Font.BOLD, 24);\n        b1.setFont(f1); \n\
  \        f.add(b1);\n        f.setSize(500,100);\n        f.setVisible(true);\n\
  \    }\n}\n```\n\n\n\n\n\n注意：如果我们减小上述窗口的大小，且三个组件无法在单行内适应，则组件将从最后一个组件开始移动到下一行。\n\n\
  输出：\n\n![image](img/image082.png)\n\n### 示例 17.2\n\n```java\nimport java.awt.*;\n\
  \npublic class MyFrame2 extends Frame\n{\n    public static void main (String args\
