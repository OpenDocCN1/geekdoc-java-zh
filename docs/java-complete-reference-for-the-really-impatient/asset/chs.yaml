  }\n```\n\n### TextField 和 TextArea\n\nTextField（文本框）和 TextArea（文本区域）类实现了用于文本输入、显示和编辑的一维和二维组件。这两个类都继承自\
  \ `TextComponent` 超类。\n\n`Object` -> `Component` -> `TextComponent` -> (`TextField`,\
  \ `TextArea`)\n\n这两个类（`TextField` 和 `TextArea`）都有多种构造函数，提供了指定或不指定初始字符串或首选大小的。未指定首选大小的构造函数最适用于布局管理器将忽略组件首选大小的情况。\n\
  \n#### TextField 类的构造函数\n\n`TextField()`\n构造新的文本框。\n\n`TextField(int columns)`\n\
  创建一个具有指定列数的文本框。\n\n`TextField(String text)`\n创建一个具有指定文本的文本框。\n\n`TextField(String\
  \ text, int columns)`\n创建一个具有指定文本和指定列数的文本框。\n\n#### TextArea 类的构造函数\n\n`TextArea()`\n\
  创建一个新的文本区域。\n\n`TextArea(int rows, int columns)`\n创建一个具有指定行数和列数的文本区域。\n\n`TextArea(String\
  \ text)`\n创建一个具有指定文本的文本区域。\n\n`TextArea(String text, int rows, int columns)`\n创建一个具有指定文本、行数和列数的文本区域。\n\
  \n`TextArea(String text, int rows, int columns, int scrollbarPolicy)`\n创建一个具有指定文本、行数、列数和滚动条策略的文本区域。TextArea\
  \ 类定义了几个可以作为滚动条参数的常量：`SCROLLBARS_BOTH`、`SCROLLBARS_VERTICAL_ONLY`、`SCROLLBARS_HORIZONTAL_ONLY`、`SCROLLBARS_NONE`。对于这两个类，列数存在一些令人意外的问题。首先，列数是根据特定字体渲染的宽度衡量的。使用微小字体\
  \ 25 列区域会非常窄，而使用巨大字体 5 列会非常宽。其次是比例字体的问题。对于等宽字体，列宽是显而易见的。对于比例字体，列宽是所有字符宽度和频率的平均值。因此在大多数情况下，包含小写字母的文本组件显示的字符比请求的要。\n\
  \n#### TextComponent 类的方法\n\n`String selectText()`\n获取文本组件中的选中文本。\n\n`String getText()`\n\
  获取文本组件显示的文本。\n\n`void setEditable(boolean b)`\n设置标志，决定此文本组件是否可编辑。\n\n`void setText(String\
  \ t)`\n将文本组件显示的文本设置为指定的文本。\n\n### 示例 17\n\n```java\nimport java.awt.*;\nclass TextFieldTest\n\
  {\n    public static void main(String args[])\n    {\n      Frame f=new Frame();\n\
  \      f.setLayout(new FlowLayout());\n      TextField tf1=new TextField();\n  \
  \    TextField tf2=new TextField(8);\n      TextField tf3=new TextField(\"matrix\"\
  );\n      TextField tf4=new TextField(\"matrix\",20);\n      TextArea ta1=new TextArea();\n\
  \      TextArea ta2=new TextArea(3,8);\n      TextArea ta3=new TextArea(\"abc\\\
  nxyz\\naaa\");\n      TextArea ta4=new TextArea(\"abc\\nxyz\\naaa\",2,2);\n    \
  \  TextArea ta5=new TextArea(\"abc\\nxyz\\naaa\",4,20,TextArea.SCROLLBARS_BOTH);\n\
  \      f.add(tf1);f.add(tf2);f.add(tf3);f.add(tf4);\n      f.add(ta1);f.add(ta2);f.add(ta3);f.add(ta4);\n\
  \      f.add(ta5);\n      tf1.setText(\"abc\");\n      System.out.println(tf3.getText());\n\
  \      tf3.setEditable(false);\n    }\n}\n```\n\n\n\n\n```java\n22. f.setSize(800,\
