  \ GridLayout(4,1));\n      p1.add(b1);\n      p1.add(b2);\n      p1.add(b3);\n \
  \     p1.add(b4);\n      add(l1);add(p1);add(l2);\n      add(tf1);add(new Label());add(tf2);\n\
  \      add(b5);add(new Label());add(b6);\n      setSize(300,300);\n      setVisible(true);\n\
