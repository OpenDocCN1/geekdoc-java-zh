  Button Size :0 0\nButton Size: 52 35\nFrame Size: 123 34\nFrame Size : 123 100\n\
  frame0,20,20,123x100,layout=java.awt.FlowLayout,title=,resizable,normal\n\n### 示例\
  \ 17.3\n\n如果我们将上述程序中的行，组件将左对齐：\n`f.setLayout(new FlowLayout(FlowLayout.CENTER));`\n\
  \n改为\n`f.setLayout(new FlowLayout(FlowLayout.LEFT));`\n\n输出：\n\n![image](img/image007.png)\n\
  \n### 示例 17.4:\n\n如果我们将上述程序中的行，组件将右对齐：\n`f.setLayout(new FlowLayout(FlowLayout.LEFT));`\n\
  \n改为\n`f.setLayout(new FlowLayout(FlowLayout.RIGHT));`\n\n输出：\n\n![image](img/image075.png)\n\
  \n### 示例 17.5:-我们可以通过在设置布局时使用重载构造函数来更改组件之间的间距（水平间距）以及行之间的间距（垂直间距）：\n\n![image](img/image020.png)\n\
  `f.setLayout(new FlowLayout(FlowLayout.CENTER, 20 ,20))`\n\n![image](img/image078.png)\n\
  vgap（行间距） hgap（组件间距）\n\n输出：\n\n![image](img/image046.png)\n\n### GridLayout:\n\n\
  `GridLayout` 的功能封装在 `java.awt.GridLayout` 类中。`GridLayout` 管理器以表格格式按行和列排列组件。我们可以将容器空间的由行和列组成的网格。在指定布局时，我们必须指定行数和列数。\n\
  \n`GridLayout` 管理器会将与行的大小（布局中指定的列数）相同数量的组件放入第一行，并将其他组件移动到第二行，依此类推。这类似于电子表格，它被分为固定数量的行和列。流布局管理器（flow\
  \ layout manager）始终尊重组件的首选尺寸。`GridLayout` 管理器采取相反的极端：当它在给定空间内执行布局时，它会忽略组件的首选尺寸。网格布局中的每行每列的大小都相同，布局可用的总区域在行数和列数之间平均分配。网格布局使用“行主”表示法，即组件按照它们被添加的顺序，从左到右、逐行出现。当我们添加较少的组件（即远少于行数乘以列数）或非常多的组件（即多于行数乘以列数）时，表现会很奇怪。如果将相同的组件放置在更高、更窄的框架中，那么每个组件都会按比例变得更高、更窄。###\
  \ 示例 17.6:\n\n```java\nimport java.awt.*;\n\npublic class MyFrame6 extends Frame\n\
  {\n    public static void main(String args[])\n    {\n      Frame f = new MyFrame6();\n\
  \      f.setLayout(new GridLayout(5,3));\n      for(int row=0; row<5; row++)\n \
  \     {\n        f.add(new Label(\"Label\" + row));\n        f.add(new Button(\"\
  Button\" + row));\n        f.add(new TextField(\"TextField\" + row));\n      }\n\
  \      f.setSize(500,200);\n      f.setVisible(true);\n    }\n}\n```\n\n输出：\n\n\
  ![image](img/image50.png)\n\n### BorderLayout:\n\n`BorderLayout` 的功能封装在 `java.awt.BorderLayout`\
  \ 类中。`BorderLayout` 管理器是框架的默认管理器，程序员迟早会接触它。`BorderLayout` 提供了一种非常有用的布局策略，但比流布局或网格布局更直观。流布局总是尊重组件的首选尺寸；网格布局从不。`BorderLayout`\
  \ 将可用空间划分为五个部分：`North`、`South`、`East`、`West` 和 `Center`。我们可以为每个区域添加一个组件。每个区域可以为空，也可以包含一个组件（即，如果该组件是容器，我们可以显示多个组件）。\n\
  \n`BorderLayout` 管理器尊重 `North` 和 `South` 组件的首选高度，并强制它们的宽度与容器相等。`North` 和 `South`\
  \ 区域适用于工具栏、状态行以及任何尽可能宽但不需要高的控件。`East` 和 `West` 区域是 `North` 和 `South` 的相反。在 `East`\
  \ 和 `West` 中，组件获得其首选宽度，但高度被限制。\n\n––––––\n\n这里组件垂直延伸到 `North` 组件的底部（如果有的话），或到容器的顶部（如果没有\
  \ `North` 组件）。同样，组件垂直延伸到 `South` 组件的顶部（如果有的话），或到容器的底部（如果没有 `South` 组件）。\n\n`Border\
  \ layout` 不受添加组件顺序的影响。相反，我们必须指定哪一个五个区域接收我们添加的组件。当我们向中心添加组件时，是合法的但不明明智的省略第二个参数。\n\
  \n重载的 `add()` 方法接受两个参数：\n* 第一，要添加的组件\n* 第二，一个对象\n\n正确使用 Border 布局管理器要求第二个参数必须是 `Border-Layout`\
  \ 类本身定义的常量。我们应该知道五个常量是：\n\n* `BorderLayout.NORTH`\n* `BorderLayout.SOUTH`\n* `BorderLayout.EAST`\n\
  * `BorderLayout.WEST`\n* `BorderLayout.CENTER`\n\n\n\n\n\n```java\nimport java.awt.*;\n\
  \npublic class MyFrame7\n{\n    public static void main(String args[])\n    {\n\
  \      Frame f=new Frame( );\n      Scrollbar sbRight=new Scrollbar(Scrollbar.VERTICAL);\n\
  \      f.add(sbRight, BorderLayout.EAST);\n      Scrollbar sbLeft=new Scrollbar(Scrollbar.VERTICAL);\n\
  \      f.add(sbLeft, BorderLayout.WEST);\n      Label labelTop=new Label(\"This\
  \ is North\");\n      labelTop.setFont(new Font(\"Serif\", Font.ITALIC, 36));\n\
  \      labelTop.setForeground(Color.white);\n      labelTop.setBackground(Color.black);\n\
  \      f.add(labelTop, BorderLayout.NORTH);\n      Label labelBottom=new Label(\"\
  This is south\");\n      labelBottom.setFont(new Font(\"Monospaced\", Font.BOLD,\
  \ 18));\n      labelBottom.setForeground(Color.white);\n      labelBottom.setBackground(Color.black);\n\
  \      f.add(labelBottom, BorderLayout.SOUTH);\n      f.setSize(500,200);\n    \
  \  f.setVisible(true);\n    }\n}\n```\n\n输出：\n\n![image](img/image008.png)\n\n###\
  \ 示例 17.8\n\n```java\nimport java.awt.*;\n\npublic class MyFrame8 extends Frame\n\
  {\n    public static void main(String args[])\n    {\n      Frame f=new MyFrame8(\
  \ );\n      //f.setLayout(new BorderLayout());\n      f.add (new Button(\"N\"),\
  \ BorderLayout.NORTH);\n      f.add (new Button(\"S\"), BorderLayout.SOUTH);\n \
  \     f.add (new Button(\"E\"), BorderLayout.EAST);\n      f.add (new Button(\"\
  W\"), BorderLayout.WEST);\n      Panel p=new Panel();\n      p.setBackground(Color.green);\
  \    \n      f.add (p, BorderLayout.CENTER);\n      //f.add (p);  默认是中心\n      f.setSize(300\
  \ ,300);\n      f.setVisible(true);\n    }\n}\n```\n\n输出：\n![image](img/image092.png)\n\
  \n### 示例 17.9\n\n```java\nimport  java.awt.*;\n\nclass BorderLayout3 extends Frame\n\
  {\n    public static void main (String args[])\n    {\n      Frame f=new BorderLayout3();\n\
  \      // f.setLayout(new BorderLayout());\n      Panel toolbar=new Panel();\n \
  \     toolbar.setLayout(new FlowLayout(FlowLayout.LEFT));\n      toolbar.setBackground(Color.lightGray);\n\
  \      toolbar.add(new Button (\"This\"));\n      toolbar.add(new Button (\"Is\"\
  ));\n      toolbar.add(new Button (\"The\"));\n      toolbar.add(new Button (\"\
  Toolbar\"));\n      f.add(toolbar,BorderLayout.NORTH);\n      TextField status=new\
  \ TextField(\"Status.\");\n      status.setFont(new Font(\"Monospaced\",Font.BOLD,48));\n\
  \      f.add (status,BorderLayout.SOUTH)    \n      f.setSize(300,300);\n      f.setVisible(true);\n\
  \    }\n}\n```\n\n输出：\n![image](img/image096.png)\n\n### CardLayout\n\n在 `CardLayout`\
  \ 中，我们可以存储许多卡片，但一次只显示一张。一次只有一张卡片是可见的，但你可以从一张卡片翻到另一张。这里 `card` 表示 `Panel`。如果我们想一次显示两张卡片，则必须为每张卡片创建一个\
  \ `Panel`，并创建一个包含这些卡片的主 `Panel`。这对于具有可选组件的用户界面非常有用，这些组件可以根据输入动态启用或禁用。\n\n### 构造函数\n\
  \n- `CardLayout()`：创建一个大小为 0 的新布局。\n- `CardLayout(int, int)`：创建一个具有指定水平和垂直间隙的新布局。水平间隙放置在左、右边缘。垂直间隙放置在顶部和底部。与其他布局相比，`CardLayout`\
  \ 需要更多的工作。卡片存储在类型为 `panel` 的对象中。当卡片被添加到面板时，通常会给它们指定一个名称。因此，当我们向面板添加卡片时，将使用 `add()`\
  \ 方法。\n`void add(Component objpanel, Object objname)`：`objname` 是一个字符串，指定由 `objpanel`\
  \ 指定的卡片名称。\n\n### 方法\n\n- `void first(Container parent)`：跳转到容器的第一张卡片。\n- `void next(Container\
  \ parent)`：跳转到容器的下一张卡片。如果当前可见卡片是最后一张，此方法将翻到布局中的第一张卡片。\n- `void previous(Container\
  \ parent)`：跳转到容器的上一张卡片。如果当前可见卡片是第一张，此方法将翻到布局中的最后一张卡片。\n- `void last(Container parent)`：跳转到容器的最后一张卡片。\n\
  - `void show(Container parent, String name)`：跳转到以给定名称添加到布局的组件。如果不存在组件，则不发生操作。\n\n\
  创建 `CardLayout` 使用以下步骤：\n1. 创建一个新的 `Panel` 对象和一个 `CardLayout` 对象。\n2. 使用第一步创建的实例将\
  \ `Panel` 对象的布局设置为 `CardLayout`。\n3. 现在为每张卡片创建一个单独的 `Panel` 对象，并添加想要添加到该 `Panel`\
  \ 中的任何内容，如按钮等。\n4. 将步骤 3 中创建的每个 `Panel` 对象添加到第 1 步创建的主 `Panel` 中，为每张卡片提供一个唯一名称。\n\
  5. 最后将主面板添加到窗口。\n\n### 示例 17.10\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import java.applet.*;\n/*applet code=\"CardLayout\" width=500 height=100*/\npublic\
  \ class CardLayoutTest extends Applet implements ActionListener, MouseListener\n\
  {\n    Panel mp;\n    CardLayout c1;\n    public void init()\n    {\n      Button\
  \ b1=new Button(\"First\");\n      Button b2=new Button(\"Second\");\n      b1.addActionListener(this);\n\
  \      b2.addActionListener(this);\n      add(b1);\n      add(b2);\n      Panel\
  \ p1=new Panel();\n      Label l1=new Label(\"INDIA\");\n      p1.add(l1);\n   \
  \   Panel p2=new Panel();\n      Label l2=new Label(\"USA\");\n      p2.add(l2);\n\
  \      mp=new Panel();\n      c1=new CardLayout();\n      mp.setLayout(c1);\n  \
  \    mp.add(p1,\"Country1\");\n      mp.add(p2,\"Country2\");\n      add(mp);\n\
  \      addMouseListener(this);\n    }\n    public void actionPerformed(ActionEvent\
  \ ae)\n    {\n      Button b=(Button)ae.getSource();\n      if(b.getLabel().equals(\"\
  First\"))\n        c1.show(mp,\"Country1\");\n      else\n        c1.show(mp,\"\
  Country2\");\n    }\n    public void mousePressed(MouseEvent me)\n    {\n      c1.next(mp);\n\
  \    }\n    public void mouseReleased(MouseEvent me){}\n    public void mouseClicked(MouseEvent\
  \ me){}\n    public void mouseEntered(MouseEvent me){}\n    public void mouseExited(MouseEvent\
  \ me){}\n}\n```\n\n### GridBagLayout\n\n`GridBagLayout` 是标准布局管理器中最复杂且灵活的。尽管听起来应该是\
  \ `GridLayout` 的子类，但它完全不同。\n\n### 示例 17.11\n\nAWT 组件可以分类为：\n1. **视觉组件**。\n2. **容器组件**。\n\
  3. **菜单组件**。\n\n视觉组件和容器组件都是从 `java.awt.Component` 开始的组件层次结构。（菜单组件扩展了 `java.awt.MenuComponent`，因此它们不继承相同的父类功能）。\n\
  \n#### `java.awt.Component` 类的方法\n\n所有视觉和容器组件通过继承 `java.awt.component` 都实现了几个方法。这些方法讨论如下：\n\
  \n- `Dimension getSize()`：以 `Dimension` 对象的形式返回组件的大小，该对象具有类型为 `int` 的公共数据成员 `height`\
  \ 和 `width`。\n- `void setBackground(Color c)`：设置组件的背景颜色。通常背景颜色用于渲染组件的非文本区域。\n- `void\
  \ setForeground(Color c)`：设置组件的前景颜色。通常组件的前景颜色用于渲染文本。如果没有显式设置组件的前景或背景颜色，组件将使用其直接容器的前景和背景颜色。\n\
  - `void setFont(Font f)`：设置组件的字体。\n\n\n\n\n`setFont()` 方法决定了组件在渲染其需要显示的任何文本时使用的字体。如果我们没有显式地设置组件的字体，则组件将使用其容器的字体。\n\
  \n```java\nvoid setEnabled(Boolean b)\n```\n\n如果参数为 `true`，则组件具有正常外观。如果参数为 `false`，则组件将显示为灰色且对用户输入没有响应。\n\
  \n```java\nvoid setSize(Dimension d)\n```\n设置组件的大小。\n\n```java\nvoid setSize(int\
  \ width, int height)\n```\n\n设置组件的大小。\n\n```java\nvoid setBounds(int x, int y, int\
  \ width, int height)\n```\n\n尝试移动并调整组件的大小。左上角的新位置由 `x` 和 `y` 指定，新大小由 `width` 和 `height`\
  \ 指定。\n\n```java\nvoid setVisible(Boolean b)\n```\n\n此方法接受一个 `Boolean` 参数，决定组件是否在屏幕上可见。此方法通常用于帧（frames）。\n\
  \n### 注意\n如果我们尝试过调用 `setSize()` 或 `setBounds()` 方法，就会知道这通常是徒劳的。我们尝试给组件的大小和位置会被布局管理器（layout\
  \ manager）覆盖。\n\n事实上，这两个方法的存在大部分是为了供布局管理器使用的。该规则的一个主要例外是 `Frame` 类，它不受布局管理器的控制，并且完全愿意让我们设置其的大小或边界。\n\
  \n### 视觉组件\n视觉组件是用户可以直接看到并与之交互的组件。AWT 支持以下视觉组件：\n\n* `Button`\n* `Canvas`\n* `Checkbox`\n\
  * `Choice`\n* `FileDialog`\n* `Label`\n* `List`\n* `ScrollPane`\n* `Scrollbar`\n\
  * `TextArea`\n* `TextField`\n\n要在 GUI 中使用这些组件之一，我们首先通过调用相应的构造函数创建一个实例。然后将组件添加到容器中。\n\
  \n### 按钮 (Button)\n`Button` 类实现了一个推推按钮。\n\n### 构造函数\n* `Button()`\n* `Button(String)`\n\
  \n构造函数接受一个字符串参数，用于指定按钮标签的文本。当按钮按下时，它会发送一个 `Action` 事件。\n\n### 方法\n* `String getLabel()`\n\
  获取此按钮的标签。\n* `void setLabel(String label)`\n将按钮的标签设置为指定的字符串。\n* `void addActionListener(ActionListener\
  \ l)`\n添加指定的动作监听器以接收来自此按钮的动作事件。\n\n**示例 17.12**\n```java\nimport java.awt.*;\nclass\
  \ ButtonTest\n{\n  public static void main(String args[]) \n  {\n      Frame f=new\
  \ Frame(\"Testing Button Component\");\n      f.setLayout(new FlowLayout());\n \
  \     Font f1=new Font(\"Arial\",Font.BOLD,40);\n      Color c1=new Color(255,0,0);\n\
  \      Color c2=new Color(0,255,0);\n      Button b1 = new Button();\n      Button\
  \ b2 = new Button(\"Cancel\");\n      b1.setForeground(c1);\n      b2.setForeground(c1);\n\
  \      b1.setBackground(c2);\n      b2.setBackground(c2);\n      b1.setFont(f1);\n\
  \      b2.setFont(f1);\n      b1.setLabel(\"Ok\");\n      System.out.println(b2.getLabel());\n\
  \      f.add(b1);\n      f.add(b2); \n      f.setSize(500,200);\n      f.setVisible(true);\n\
  \  }\n}\n```\n输出：\n![image](img/image064.png)\n\n### 画布 (Canvas)\n`Canvas` 是一个组件，没有默认外观或行为。我们可以派生\
  \ `canvas` 来创建自定义的绘图区域、工作区域、组件等。画布接收来自鼠标和键盘的输入事件，由程序员将这些输入转换为有意义的外观和感受。\n\n画布的默认大小（或更准确地说，首选大小）小得毫无用。处理这个问题的一种方法是使用可以调整画布大小的布局管理器。另一种方法是亲自对画布调用\
  \ `setSize()`，画布是少数这种方法可能有效的案例之一，因为我们发送到 `setSize()` 方法的值会变成画布的首选大小。\n\n**示例 17.13**\n\
  ```java\nimport java.awt.*;\nclass CanvasTest\n{ \n  public static void main (String\
  \ args [])\n  { \n      Frame f = new Frame();\n      f.setLayout(new FlowLayout());\n\
  \      Canvas c=new Canvas();\n      c.setSize(100,100);\n      f.add(c);\n    \
  \  f.setSize(300,300);\n      f.setVisible(true);\n  }\n}\nclass MyCanvas extends\
  \ Canvas\n{\n  public void paint(Graphics g )\n  {\n      setBackground(Color.green);\n\
  \      g.setColor(Color.red);\n      g.drawLine(0, 0, 99, 99);\n  }\n}\n```\n输出：\n\
  ![image](img/image03.png)\n\n### 复选框 (Checkbox)\n复选框是一个双状态按钮。状态为 `true`（已选中）和 `false`（未选中）。复选框的三种基本形式是：\n\
  \n**构造函数：**\n* `Checkbox()`：创建一个带有空标签的复选框。\n* `Checkbox(String label)`：创建一个指定标签的复选框。\n\
  * `Checkbox(String label, boolean state)`：创建一个指定标签和状态的复选框。\n\n**方法：**\n* `String\
  \ getLabel()`\n获取此复选框的标签。\n* `void setLabel(String label)`\n将复选框的标签设置为指定的字符串。\n\
  * `boolean getState()`\n确定复选框是“开启”还是“关闭”状态。\n* `void setState(boolean state)`\n\
  设置此复选框的指定状态。\n* `void addItemListener(ItemListener l)`\n添加指定的项监听器以接收来自此复选框的项事件。\n\
  \n**示例 17.14**\n```java\nimport java.awt.*;\nclass CheckboxTest\n{\n  public static\
  \ void main(String args[])\n  {\n      Frame f = new Frame(\"Testing Checkbox Component\"\
  );\n      f.setLayout(new GridLayout(3,1));\n      Checkbox c1=new Checkbox();\n\
  \      Checkbox c2=new Checkbox(\"Lunch\",true);\n      Checkbox c3=new Checkbox(\"\
  Dinner\");\n      c1.setLabel(\"Breakfast\");\n      c3.setState(true);\n      f.add(c1);f.add(c2);f.add(c3);\n\
  \      if(c1.getState())\n        System.out.println(c1.getLabel());\n      if(c2.getState())\n\
  \        System.out.println(c2.getLabel());\n      if(c3.getState())\n        System.out.println(c3.getLabel());\n\
  \      f.setSize(100,100);\n      f.setVisible(true);\n  }\n}\n```\n输出：\n![image](img/image023.png)\n\
  \n**另一个示例**\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass CheckboxTest\
  \ extends Frame implements ItemListener\n{\n  Checkbox c1;\n  TextField tf1;\n \
  \ CheckboxTest()\n  {\n      setLayout(new GridLayout(2,1));\n      c1=new Checkbox(\"\
  Red\");\n      c1.addItemListener(this);\n      add(c1);\n      tf1=new TextField();\n\
  \      add(tf1);\n      setSize(100,100);\n      setVisible(true);\n  }\n  public\
  \ static void main(String args[])\n  {\n      new CheckboxTest();\n  }\n  public\
  \ void itemStateChanged(ItemEvent ie)\n  {\n      if(c1.getState())\n        tf1.setBackground(Color.red);\n\
  \      else\n        tf1.setBackground(Color.white);\n  }\n}\n```\n\n### 单选按钮 (Radio\
  \ button)\n复选框可以组合成复选框组，具有单选行为。在单选行为下，复选框组中同时只有一个成员可以为 `true`；选择新成员会将之前先选的成员状态变为\
  \ `false`。许多窗口系统（例如 Motif）将单选组实现为组件。\n\n我们可以通过创建多个复选框并使用 `java.awt.CheckboxGroup`\
  \ 类对其进行分组来实现单选行为。在 Java 中，`java.awt.CheckboxGroup` 类不是组件；它仅仅是一个组织复选框的不可见类。这意味着 Java\
  \ 对复选框组成员之间的空间关系不加任何限制。\n\n\n\n如果我们愿意，可以将一个组中的一个成员放在框架的左上角，另一个成员放在右下角，而将第三个成员放在完全不同的框架中。当然，结果可能既违背常理以及大多数\
  \ GUI 样式指南。\n\n`CheckboxGroup` 类的两种方法支持获取和设置当前选中的成员或该组。\n\n`Checkbox getSelectedCheckbox()`\n\
  \n从此复选框组中获取当前选择。\n\n`void setSelectedCheckbox(Checkbox box)`\n\n将此组中当前选中的复选框设置为指定的复选框。\n\
  \n### Example 17.15\n\n```java\n1. import java.awt.*;\n2. class CheckboxGroupTest\n\
  3 {\n4.   public static void main(String args[])\n5.   {\n6.     Frame f = new Frame(\"\
  Testing RadioButton Component\");\n7.      f.setLayout(new GridLayout(3,1));\n8.\
  \      CheckboxGroup cbg=new CheckboxGroup();\n9.      Checkbox c1=new Checkbox(\"\
  BreakFast\",false,cbg);\n10.      Checkbox c2=new Checkbox(\"Lunch\",true,cbg);\n\
  11.      Checkbox c3=new Checkbox(\"Dinner\",false,cbg);\n12.      c3.setState(true);\n\
  13.      f.add(c1);f.add(c2);f.add(c3);\n14.      \n15.      if(c1.getState())\n\
  16.        System.out.println(c1.getLabel());\n17.      else if(c2.getState())\n\
  18.        System.out.println(c2.getLabel());\n19.      else if(c3.getState())\n\
  20.        System.out.println(c3.getLabel());\n21.          \n22.      f.setSize(100,100);\n\
  23.      f.setVisible(true);\n24.    }\n25. }\n```\n\nOutput:\n![image](img/image041.png)\n\
  \n### Choice\n\nChoice 是一个下拉列表。\n\n### Methods:\n\n`void add(String item)`\n\n向此\
  \ `Choice` 菜单中添加一个项目。\n\n`void addItemListener(ItemListener i)`\n\n添加指定的项监听器以接收来自此选择菜单的项事件。\n\
  \n`String getItem(int index)`\n\n获取此 `Choice` 菜单中指定索引处的 `String`。\n\n`int getItemCount()`\n\
  \n返回此 `Choice` 菜单中的项目数量。\n\n`int getSelectedIndex()`\n\n返回当前选中项的索引。\n\n`String getSelectedItem()`\n\
  \n以字符串形式获取当前选择的表示。\n\n`void insert(String item, int index)`\n\n在选择框的指定位置插入该项目。\n\
  \n`void remove(int position)`\n\n从选择菜单中移除第一个出现的项目。\n\n`void remove(String item)`\n\
  \n从 `Choice` 菜单中移除第一个出现的指定项目。\n\n`void removeAll()`\n\n从选择菜单中移除所有项目。\n\n`void select(int\
  \ pos)`\n\n将此选择菜单中的选中项设置为指定位置的项目。\n\n`void select(String Str)`\n\n将此 `Choice` 菜单中的选中项设为名称与指定字符串相等的项目。\n\
  \n### Example 17.16\n\n```java\n1. import java.awt.*;\n2. class ChoiceTest\n3 {\n\
  4.   public static void main(String args[]) throws InterruptedException\n5.    \
  \ {\n6.       Frame f = new Frame(\"Testing Choice Component\");\n7.       f.setLayout(new\
  \ FlowLayout());\n8.       f.setSize(100,100);\n9.       f.setVisible(true);\n10.\
  \      Choice c1=new Choice();\n11.      c1.add(\"BreakFast\");\n12.      c1.add(\"\
  Lunch\");           \n13.      c1.add(\"Dinner\");\n14.      f.add(c1);\n15.   \
  \   c1.select(\"Dinner\"); // c1.select(2);\n16.      Thread.sleep(1000);\n17. \
  \     System.out.println(c1.getSelectedItem());\n18.      System.out.println(c1.getSelectedIndex());\n\
  19.      System.out.println(c1.getItemCount());\n20.      System.out.println(c1.getItem(0));\n\
  21.      c1.insert(\"Brunch\",1);\n22.      c1.remove(2); // c1.remove(\"Lunch\"\
  );\n23.     }\n24. }\n```\n\nOutput:\n![image](img/image28.png)\n\n```java\n1. import\
