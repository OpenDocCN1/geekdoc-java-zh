  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n\n# ∞ 2 ∞\n\n## (Java 语言)\n\n## 标记\
  \ (Tokens)\n\n最小的独立单元被称为标记，例如关键字、标识符、常量、字符串和运算符。\n\nA. 关键字是语言的保留名称，不能用作变量、函数等的名称。\n\
  B. 标识符是指变量、数组、函数、类、接口等的名称。\nC. 常量/字面量是指程序中无法更改的固定值。\nD. 运算符是作用于变量和常量的特殊符号，并构成表达式。\n\
  E. 分隔符是用于分隔语句的特殊字符，如 `( )` `{ }` `[ ]` `;` `,` `.`\n\n### 关键字\n\n`abstract`, `continue`,\
  \ `goto`, `package`, `synchronized`\n`assert`, `default`, `if`, `private`, `this`\n\
  `boolean`, `do`, `implements`, `protected`, `throw`\n`break`, `double`, `import`,\
  \ `public`, `throws`\n`byte`, `else`, `import`, `public`, `throws` \n`abstract`,\
  \ `instanceof`, `return`, `transient`\n`case`, `extends`, `int`, `try`\n`char`,\
  \ `final`, `static`, `void`\n`byte`, `finally`, `long`, `volatile`\n`class`, `float`,\
  \ `native`, `super`\n`const`, `for`, `new`, `switch`\n\n注：`const`, `goto`, `null`\
  \ 是保留字。注 2：`true`, `false` 是保留字。\n\n### 标识符\n\n标识符是指变量、数组、函数、类、接口等的名称。\n\n1. 标识符必须以字母、美元符号或下划线开头。\n\
  2. 后续字符可以是数字。\n3. 标识符的长度没有限制。\n4. 标识符区分大小写。\n5. Java 允许 Unicode 字符。\n\n### 常量/字面量\n\
  \n常量/字面量是指中无法更改的固定值。\n\n1. 字面量不能出现在赋值运算符的左侧。\n2. 字面量是在源代码中指定的数值。\n\n#### 字面量类型\n\
  \n`5`, `-5`, `0x5A`, `012`, `5l`, `5L` 是整数常量，其中 `5,-5` 是十进制，`0x5A` 是十六进制，`012` 是八进制，`l`\
  \ 或 `L` 表示长型（long）。\n\n`5.23`, `-5.23`, `5.4f`, `5.4F`, `5.4d`, `5.4D`, `1.2E-03`\
  \ 是浮点型常量，其中 `f` 或 `F` 表示单精度（float），`d` 或 `D` 表示双精度（double），`5.23` 是标准计数法，`1.2E-03`\
  \ 是指数计数法（科学计数法），其中 `1.2` 是尾数，`-03` 是指数。\n\n`'a'`, `'A'`, `'\\n'`, `'\\141'`, `'\\\
  u0061'` 是字符常量，其中 `'\\n'` 是转义序列，`'\\141'` 是字符 'a' 的八进制代码，`'\\u0061'` 是字符 'a' 的十六进制代码。\n\
  \n`\"matrix\"` 是字符串字面量。字符串是字符组。Java 字符串没有其他语言中的行延续转义序列。因此字符串必须在同一行内开始和结束。Java 中的字符串是对象类型。\n\
  \n`True`, `false` 是布尔字面量。Java 中的 true 和 false 不等于 1 或 0。\n\n## 运算符\n\nJava 提供了丰富的运算符。运算符组合常量、变量和子表达式形成表达式。Java\
  \ 中的大多数运算符的行为与 C/C++ 相似，但有一些不同之处，在此涵盖。\n\n运算符可以分类为：\n\n- 算术运算符 (`+`, `-`, `*`, `/`,\
  \ `%`）：这些运算符与 C/C++ 相同。\n- `%` 运算符也可以作用于浮点数。\n- 当二进制运算符应用于不同类型的操作数时，低类型的操作数会在求值之前转换为高类型，结果的类型将与高类型操作数的类型相同。\n\
  \n\n\n\n\n- 对于 `int` 类型，除以零或取模零会导致 `ArithmeticException`（运行时错误），但浮点数类型则不会。\n- 当我们对\
  \ `int` 应用算术运算符且结果超出了 `int` 的范围时，额外的高位位将被截断，这个新值将赋值给接收结果的变量；但在浮点类型中，如果溢出，结果将 `Infinity`\
  \ 或 `-Infinity`，如果下溢，结果为 `0`。\n\n### 递增和递减运算符 (`++`, `--`)\n\n这些运算符与 `C/C++` 中的相同。\n\
  \n```java\nint a=5,b;\nb = ++a*++a;\nSystem.out.print(b);    //42\n\na = 5; \nSystem.out.print(++a*++a);\
  \  //42\n```\n\n### 关系运算符 (`<`, `>`, `<=`, `>=`, `instanceof`)\n\n这些运算符与 `C/C++`\
  \ 中的相同，但 `<`, `<=`, `>` , `>=` 不能应用于布尔类型和引用类型。\n\n### `instanceof` 运算符 `-`\n\n`instanceof`\
  \ 运算符用于测试对象的类型。`instanceof` 运算符的通用形式为：\n\n```java\nif(object instanceof type)\n\
  ```\n\n这里，`object` 是一个类的实例，`type` 是一个类类型。如果 `object` 是指定类型的实例，或者是指定类型任任何子类的实例，则\
  \ `instanceof` 运算符返回 `true`，否则其结果为 `false`。\n\n### 赋值运算符 (`=`, `+=`, `-=`, `*=`,\
  \ `/=`, `%=`)\n\n这些运算符与 `C/C++` 中的相同。\n\n### 等于运算符 (`==`, `!=`)\n\n这些运算符与 `C/C++`\
  \ 中的相同。\n\n### 逻辑运算符 (`&&`, `||`, `!`)\n\n这些运算符与 `C/C++` 中的相同。\n\n### 三元运算符 (`?\
  \ :`)\n\n该运算符与 `C/C++` 中的相同。\n\n### 位运算运算符 (`&`, `|`, `^`, `~`, `<<`, `>>`, `>>>`)\n\
  \n这些运算符与 `C/C++` 中的相同，移位运算符除外。移位运算符仅适用于整数类型。\n\n### 左移 (`<<`) 运算符\n\n要获得 `<<` 运算符的结果，左侧操作数的位将根据右侧操作数指定的向左移动，右侧的空位将用零填充。左移\
  \ 1 位等同于乘以 2。结果的符号可能与左侧操作数的符号不同。这可能是因为符号取决于最左位，而该位可能会从 0 变为 1 或从 1 变为 0，从而导致符号变化。\n\
  \n示例：`b = a << 2;`。要获得 `b` 的值，将 `a` 中的位左移 2 位，并用零填充右侧 2 位。\n\n### 右移 (`>>`) 运算符（带符号）\n\
  \n要获得 `>>` 运算符的结果，左侧操作数的位将根据右侧操作指定的向右移动，左侧的空位将用符号填充。右移 1 位等同于除以 2。该运算符永远改变结果的符号，即它与左侧操作数的符号相同。\n\
  \n示例：`b = a >> 2;`。要获得 `b` 的值，将 `a` 中的位右移 2 位，并用符号填充右侧 2 位（如果 `a` 为正则为 0，如果 `a`\
  \ 为负则为 1）。\n\n### 零填充右移 (`>>>`) 运算符（无符号）\n\n要获得 `>>>` 运算符的结果，左侧操作数的位将根据右侧操作指定的向右移动，左侧的空位将用\
  \ 0 填充。右移 1 位等同于除以 2。如果发生了移位，结果将始终为正数，因为最右侧位将变为零。\n\n示例：`b = a >>> 2;`。要获得 `b` 的值，将\
  \ `a` 中的位右移 2 位，并用 0 填充右侧 2 位。\n\n![black_star_logo](img/image070.jpg)\n![black_star_logo](img/image070.jpg)\n\
  ![black_star_logo](img/image070.jpg)\n\n---\n\n### 运算符优先级：\n\n| 优先级 | 运算符 | 描述 |\
  \ 结合性 |\n| :--- | :--- | :--- | :--- |\n| 1 | `()` `[]` `.` | 函数调用、下标、直接成员访问 | 从左到右\
  \ |\n| 2 | `++` `--` `~` `!` | 递增、递减、位取反、逻辑取非 | 从右到左 |\n| 3 | `*` `/` `%` | 乘法、除法、取模\
  \ | 从左到右 |\n| 4 | `+` `-` | 加法、减法 | 从左到右 |\n| 5 | `>>>` `>>` `<<` | 位右移、位左移、位零填充右移\
  \ | 从左到右 |\n| 6 | `>>=` `<<=` `instanceof` | 大于、大于等于、小于、小于 | 从左到右 |\n| 7 | `==`\
  \ `!=` | 等于、不等于 | 从左到右 |\n| 8 | `&` | 位按与 | 从左到右 |\n| 9 | `^` | 位异异 | 从左到右 |\n|\
  \ 10 | `|` | 位按或 | 从左到右 |\n| 11 | `&&` | 逻辑与 | 从左到右 |\n| 12 | `||` | 逻辑或 | 从左到右\
  \ |\n| 13 | `? :` | 三元运算符 | 从右到左 |\n| 14 | `=` `+=` `-=` `*=` `/=` `%=` `&=` `\\\
  |=` `^=` `>>=` `<<=` `>>>=` | 赋值运算符 | 从左到右 |\n\n| 符号 | 名称 | 目的 |\n| :--- | :---\
  \ | :--- |\n| `()` | 括号 | 函数调用、参数 |\n| `[]` | 中括号 | 数组 |\n| `.` | 点 | 分隔包名与类 |\n\
  | `{}` | 花括号 | 定义块 |\n| `;` | 分号 | 终止语句 |\n| `,` | 逗号 | 分隔标识符 |\n| `|` | 管道 | 用于表达式\
  \ |\n\n![black_star_logo](img/image070.jpg)\n\n### 数据类型\n\nJava 数据类型大致分为两类：\n\n\
  #### 1. 基本数据类型 / 类型\nJava 是面向对象的语言，但基本数据类型不是对象。它们是其他类型的类型。\n\n**数值类型**\n\n*整数类型：*\n\
  - `byte` (1 字节): -128 到 127\n- `short` (2 字节): -32768 到 32767\n- `int` (4 字节): -2147483648\
  \ 到 2147483647\n- `long` (8 字节): -9223372036854775808 到 9223372036854775807\n包含\
  \ `byte`, `short`, `int` 的表达式会自动提升为 `int`。\n\n*浮点数类型：*\n- `float` (4 字节): 1.401298464324817E-45\
  \ 到 3.402823466385286E38\n- `double` (8 字节): 4.9E-324 到 1.7976931348623157E308\n\
  \n**布尔数据类型：** boolean\n**字符数据类型：** `char` (2 字节): 0 到 65535（注意：Unicode 的前 128 个字符与\
  \ 7 位 ASCII 相同）\n\n#### 2. 非基本数据类型 / 派生类型或引用\n引用类型也被称为派生类型，因为它们派生自基本数据类型。\n\n**类**\n\
  *   内置/库类\n*   用户定义类\n\n**接口**\n*   内置/库接口\n*   用户定义接口\n\n**数组**\n数组也被视为对象。\n\n\
  ### \n三种变量：\n\n\n\n\n\n## 局部变量\n局部变量用于块或方法内部。局部变量（也称为自动变量）默认不会进行初始化。局部变量在第一次使用之前必须显式初始化，否则会出现编译时错误“变量可能未被初始化”。\n\
  \n### 示例\n```java\nint a,b=5;\nif(b>2)\n{\n    a = b;\n}\nSystem.out.print(a);\n\
  ```\n在上述程序中，如果 `if` 条件为假，则 `a` 的值未被定义，因此编译器将给出错误“变量 a 可能未初始化”。\n\n在 Java 中，我们不能在内部块中定义与外部块相同的变量。\n\
  ```java\nint a=5;\n{\n    int a=7;  // 错误\n}\n```\n\n## 实例变量\n实例变量用于定义对象的属性或状态。\n\
  \n## 类变量\n类变量用于定义类的所有对象共有的属性/状态。\n\n## Math 类库方法\n| 方法 | 描述 |\n| :--- | :--- |\n\
