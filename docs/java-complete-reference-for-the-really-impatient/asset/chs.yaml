  \n## FileDialog（文件对话框）\n\n此类类表示文件打开或文件保存对话框。文件对话框是一个模态对话框，这意味着只要对话框在屏幕上可见，来自对话框父框架的输入将专门重定向到对话框。当用户指定文件或点击取消按钮时，对话框会自动移除。最实用的\
  \ File 对框构造函数具有以下形式：\n\n`FileDialog(Frame parent, String title, int mode)`\n\n对话框的父帧是对话框将出现的帧。标题字符串显示在对话框的标题栏中。\n\
  \n模式 应该是以下者之一：\n\n- `FileDialog.LOAD` 或\n- `FileDialog.SAVE`\n\n在用户指定文件后，可以使用以下方法获取文件名或其目录：\n\
  \n`String getDirectory()`\n获取此文件对话框的选定目录。\n\n`String getFile()`\n获取此文件对话框的选定文件。\n\
  \n### 示例 17.20\n\n```java\nimport java.awt.*;\npublic class FileDialogTest\n{ \n\
  \  public static void main(String args[])\n  { \n    Frame f=new Frame( );\n   \
  \ f.setLayout(new FlowLayout( ));\n    f.setSize(200, 200);\n    f.setVisible(true);\n\
  \    FileDialog fd=new FileDialog (f, “Load file”, FileDialog.LOAD);\n    fd.setVisible(true);\n\
  \    System.out.println(fd.getFile());\n    System.out.println(fd.getDirectory());\n\
  \  }\n}\n```\n\n## ScrollPane（滚动面板）\n\nScrollPane 可以包含单个组件，该组件可能比滚动面板本身更高或更宽。如果容器组件大于滚动面板，那么\
  \ 滚动面板的默认行为是根据需要获取水平和/或垂直滚动条。\n\n该类有两个构造函数：\n\n`ScrollPane()`\n创建一个具有滚动条显示策略为“按需”的新滚动面板容器。\n\
  \n`ScrollPane(int scrollbarDisplayPolicy)`\n创建一个具有指定滚动条行为的新滚动面板容器。滚动面板的显示策略应该是以下者之一：\n\
  \n- `ScrollPane.SCROLLBARS_AS_NEEDED`（默认）\n- `ScrollPane.SCROLLBARS_ALWAYS`\n- `ScrollPane.SCROLLBARS_NEVER`\n\
  \n下面的代码创建了一个具有默认（As_NEEDED）滚动条行为的滚动面板。该滚动面板包含一个很大的按钮；因此肯定需要滚动条。\n\n### 示例 17.21\n\
  \n```java\nimport java.awt.*;\nclass SPaneTest\n{ \n  public static void main(String\
  \ args[])\n  { \n    Frame f=new Frame();\n    f.setLayout(new GridLayout(1,2));\n\
  \    f.setSize(250, 150);\n    ScrollPane spane=new ScrollPane();\n    spane.setBackground(Color.green);\n\
  \    f.add(spane);\n    f.add(new TextArea());\n    Button b1=new Button(\"Push\
  \ Me !\");\n    b1.setFont(new Font(\"Serif\", Font.ITALIC, 100));\n    spane.add(b1);\n\
  \    f.setVisible(true);\n  }\n}\n```\n\n输出：\n\n![image](img/image058.png)\n\n###\
  \ Scrollbar（滚动条）\n\n调整列表和滚动面板的 Scrollbar 组件可以作为独立的组件可用。它有三个构造函数：\n\n`Scrollbar()`\n\
  构造一个新的垂直滚动条。\n\n`Scrollbar(int orientation)`\n构造具有指定方向的新滚动条。\n\n`Scrollbar(int orientation,\
  \ int initialValue, int sliderSize, int minValue, int maxValue)`\n构造一个具有指定方向、初始值、滑块大小以及最小值和最大值的新滚动条。`sliderSize`\
  \ 参数控制滑块的大小，但不是以像素为单位。\n\n对于接受方向参数的构造函数，此值应该是以下者之一：\n\n- `Scrollbar.HORIZONTAL`\n\
  - `Scrollbar.VERTICAL`\n\n### 示例 17.22\n\n```java\nimport java.applet.*;\nimport\
  \ java.awt.*;\nimport java.awt.event.*;\n/*<applet code = \"RGB\" width=500 height=200></applet>\
  \ */\npublic class RGB extends Applet implements AdjustmentListener\n{\n  TextField\
  \ tf1;\n  Scrollbar sb1,sb2,sb3;\n  public void init() {\n    setLayout(new GridLayout(4,1));\n\
  \    sb1 = new Scrollbar(Scrollbar.HORIZONTAL,0,10,0,255);\n    sb2 = new Scrollbar(Scrollbar.HORIZONTAL,0,10,0,255);\n\
  \    sb3 = new Scrollbar(Scrollbar.HORIZONTAL,0,10,0,255);\n    sb1.addAdjustmentListener(this);\n\
  \    sb2.addAdjustmentListener(this);\n    sb3.addAdjustmentListener(this);\n  \
  \  tf1 = new TextField(8);\n    add(tf1);add(sb1);\n    add(sb2);add(sb3);\n  }\n\
  \  public void adjustmentValueChanged(AdjustmentEvent ae) {\n    int a=0,b=0,c=0;\n\
  \    a = sb1.getValue();\n    b = sb2.getValue();\n    c = sb3.getValue();\n   \
  \ Color c1 = new Color(a,b,c);\n    tf1.setBackground(c1);\n  }\n```\n\n## AWT 事件简介\n\
  \n### 简介\n\n### 介绍 AWT 事件\n\n### 简介\n\n### GUI 事件\n\n非 GUI 的程序通过调用某些方法来与用户交互。当普通的\
  \ Java 程序（非 GUI 的）需要输入时，它会提示用户并调用某些方法，如 `readline()`，交互是由程序发起的。点击按钮会产生事件并根据情况执行某些代码。点击将保存内容。\n\
  \n| 接口 | 事件（方法） | 类 | 方法 |\n| :--- | :--- | :--- | :--- |\n| `ActionListener` |\
  \ `actionPerformed()` | `ActionEvent` | `getSource()` |\n| `ItemListener` | `itemStateChanged()`\
  \ | `ItemEvent` | `getItem()` |\n| `AdjustmentListener` | `adjustmentValueChanged()`\
  \ | `AdjustmentEvent` | `getAdjustable()` |\n| `MouseListener`, `MouseAdapter` |\
  \ `mouseEntered`, `mouseExited`, `mouseClicked`, `mouseReleased` | `MouseEvent`\
  \ | `getX()`, `getY()`, `getPoint()`, `getClickCount()`, `getButton()`, `getModifiers()`,\
  \ `getModifiersText()` |\n| `MouseMotionListener`, `MouseMotionAdapter` | `mouseMoved`,\
  \ `mouseDragged` | `MouseEvent` | 同上 |\n| `KeyListener`, `KeyAdapter` | `keyTyped`,\
  \ `keyPressed`, `keyReleased` | `KeyEvent` | `getKeyChar()`, `getKeyCode()` |\n\
  | `FocusListener`, `FocusAdapter` | `focusGained`, `focusLost` | `FocusEvent` |\
  \ `getSource()` |\n| `WindowListener`, `WindowAdapter` | `windowOpen`, `windowClosing`,\
  \ `windowClosed`, `windowActivated`, `windowDeactivated`, `windowIconified`, `windowDeiconified`\
  \ | `WindowEvent` | `getWindow()` |\n\n### 事件类\n\n点击按钮产生一个事件。事件关联有大量信息，例如时间、生成事件的组件、点击点的坐标等。这些信息被放在事件类中。该概念类似于异常处理。每当发生异常时，都会创建一个相应的异常类对象，并将所有异常相关信息放入该对象。我们拥有事件类的层次结构，它与异常类的层次结构非常相似。每当发生某些事件时，它会被事件处理机制检测到，创建相应的事件类对象并将所有事件相关信息放入其中。\n\
  \n### 事件监听器\n\n事件监听器负责在事件发生时采取适当行动。事件监听器是组件委托其处理特定类型事件的任务的对象。\n\n\n\n\n\n当组件接收输入时，会构建一个相应类型的事件，然后该事件将作为参数传递给监听器上的方法调用。监听器必须实现包含该事件处理方法的接口。\n\
  \n我们可以将事件监听器与处理异常的 `catch` 块进行比较。我们需要为要处理的异常提供一个相应的 `catch` 块。同样，如果我们想处理由某些组件生成的事件，我们需要提供适当的监听器。\n\
  \n监听器与组件相关联。不同的事件有不同的监听器。当事件发生时，会调用相应的监听器方法，并将事件对象作为参数传递。\n\n### 适配器 (Adapters)\n\
  \n语言中定义的监听器仅是接口。我们需要提供相应监听器的实现。某些监听器具有 2 个或更多方法。\n\n要实现具有多个方法的监听器，即使我们只对其中一个感兴趣，也需要提供所有方法的实现。适配器类为这个问题提供了解决方案。\n\
  \n适配器类提供了监听器所有方法的空实现（dummy implementation）。这有助于减少编程工作量。如果我们只想使用包含例如 5 个方法的监听器类中的一个方法，可以简单地扩展适配器类并重写所需的方法。\n\
  \n### 事件层次结构 (Event hierarchy)\n\nAWT 具有定义良好的事件层次结构。通常，事件层次结构中的叶子节点类表示实际事件。而非叶子节点类作为基类并进行封装。\n\
  \nAWT 事件层次结构如下所示。\n\n![image](img/image014.png)\n\n### java.util.event.EventObject\
  \ 类\n\n这是所有事件类的顶层超类。它是一个非常通用的类，只有一个感兴趣的方法，即返回产生事件的源。\n\n```\nObject getsource()\n\
  ```\n\n### java.awt.AWTEvent 类\n\n`event object` 的一个子类是 `java.awt.AWTEvent`，它是所有委托模型事件类的超类。同样，只有一个感兴趣的方法，返回事件的\
  \ ID。\n\n```\nint getID()\n```\n\n事件的 ID 是一个 `int` 类型，用于指定事件的精确性质。例如，`mouseevent`\
  \ 类的实例可以代表七种情况之一：点击、拖拽、进入、移动、退出、按下、释放。这些每种可能性都由 `int` 类型 `MouseEvent` 表示，如 `MOUSE_CLICKED`、`MouseEvent.MOUSE_DRAGGED`\
  \ 等。\n\n`java.awt.AWTEvent` 的子类表示由各种 AWT 组件生成的各种事件类型，并包含了与触发事件的活动相关的所有必要信息。\n\n\
  非超类事件类型（即那些由组件实际触发的事件）包括：\n\n1. `ActionEvent`：通常由组件的激活泛产生，例如。它在点击按钮、双击列表项以及在 `TextField`\
  \ 中按下回车键时生成。\n2. `AdjustmentEvent`：由可调整组件（如滚动条）的调整生成。\n3. `ContainerEvent`：当组件被添加到容器中或从容器中移除时生成。\n\
  4. `FocusEvent`：当组件接收或丢失输入焦点时生成。\n5. `ItemEvent`：当从列表、选择框或复选框中选择项目时生成。\n6. `KeyEvent`：由键盘活动生成。\n\
  7. `MouseEvent`：由鼠标活动生成。\n8. `MouseWheelEvent`：一种指示鼠标滚轮事件。\n9. `WindowEvent`：一种指示鼠标滚轮旋转的事件。\n\
  10. `TextEvent`：当组件发生变化时生成。\n\n### java.awt.event 包\n\n该包提供了处理事件的接口。`EventListeners`\
  \ 是必须实现的接口。`Adapters` 是提供默认实现的类。\n\n### 事件监听器 (Event Listeners)\n\n`EventListeners`\
  \ 是必须实现的以处理特定事件的接口。\n\n#### ActionListener\n这是用于接收动作事件的监听器。\n\n```\nvoid actionPerformed(ActionEvent\
  \ e)\n```\n\n#### AdjustmentListener\n这是用于接收调整事件的监听器。\n\n```\nvoid adjustmentValueChanged(AdjustmentEvent\
  \ e)\n```\n\n#### ContainerListener\n这是当组件被添加到容器或从容器中移除时接收事件的监听器。\n\n```\nvoid componentAdded(ContainerEvent\
  \ e)\nvoid componentRemoved(ContainerEvent e)\n```\n\n#### FocusListener\n这是组件获得或失去焦点时的器。\n\
  \n```\nvoid focusGained(WindowEvent e)\nvoid focusLost(WindowEvent e)\n```\n\n####\
  \ ItemListener\n这是用于接收项目事件的监听器。\n\n```\nvoid itemStateChanged(ItemEvent e)\n```\n\
  \n#### KeyEvent\n这是用于接收键盘事件的监听器。\n\n```\nvoid keyPressed(KeyEvent e)\nvoid keyReleased(KeyEvent\
  \ e)\nvoid keyTyped(KeyEvent e)\n```\n\n#### MouseListener\n这是用于接收鼠标事件的监听器。\n\n\
  ```\nvoid mouseClicked(MouseEvent e)\nvoid mouseEntered(MouseEvent e)\nvoid mouseExited(MouseEvent\
  \ e)\nvoid mousePressed(MouseEvent e)\nvoid mouseReleased(MouseEvent e)\n```\n\n\
  #### MouseMotionListener\n这是用于接收鼠标移动事件的监听器。\n\n```\nvoid mouseDragged(MouseEvent\
  \ e)\nvoid mouseMoved(MouseEvent e)\n```\n\n#### MouseWheelListener\n这是用于接收鼠标滚轮事件的监听器。\n\
  \n```\nvoid mouseWheelMoved(MouseEvent e)\n```\n\n#### WindowListener\n这是用于接收窗口状态变化的监听器。\n\
  \n```\nvoid windowActivated(WindowEvent e)\nvoid windowClosed(WindowEvent e)\nvoid\
  \ windowClosing(WindowEvent e)\n```\n\n\n\n\n```java\nvoid windowDeactivated(WindowEvent\
  \ e)\n```\n当窗口不再是活动窗口时被调用。\n\n```java\nvoid windowDeiconified(WindowEvent e)\n```\n\
  当窗口从最小化状态恢复正常状态时被调用。\n\n```java\nvoid windowIconified(WindowEvent e)\n```\n当窗口从正常状态变为最小化状态时被调用。\n\
  \n```java\nvoid windowOpended (WindowEvent e)\n```\n当窗口第一次可见时被调用。\n\n# 处理 ActionEvent\n\
  \n### 示例 18.1\n以下示例解释了如何处理点击按钮生成的 actionevent。\n\n```java\nimport java.awt.*;\n\
  import java.awt.event.*;\nclass A1\n{\n  public static void main(String args[])\n\
  \    {\n      Frame f=new Frame();\n      f.setLayout(new FlowLayout());\n     \
  \ f.setSize(500,100);\n      Button b1=new Button(\"Push me\");\n      Button b2=new\
  \ Button(\"Click me\");\n      b1.addActionListener(new B());\n      b2.addActionListener(new\
  \ C());\n      f.add(b1);\n      f.add(b2);\n      f.setVisible(true);\n    }\n\
  }\nclass B implements ActionListener\n{\n  public void actionPerformed(ActionEvent\
  \ ae)\n    {\n      System.out.println(\"Button Pushed\");\n    }\n}\nclass C implements\
  \ ActionListener\n{\n  public void actionPerformed(ActionEvent ae)\n    {\n    \
  \  System.out.println(\"Button Clicked\");\n    }\n}\n```\n输出：\n![image](img/image065.png)\n\
